  yaml_path: translation/nt/luke/011/037.yaml
  text: While he was speaking[a], a Pharisee asks him to dine with him[b]; so he went in and reclined at the table.
translation:
  language: te
  text: ఆయన మాట్లాడుతుండగా, ఒక పరిసయ్యుడు తనతో కలిసి భోజనం చేయమని ఆయనను కోరాడు[a]. అప్పుడు ఆయన లోపలికి వెళ్లి భోజన బల్ల దగ్గర ఆనుకొని కూర్చున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఉదయపు భోజనం చేయమని’ లేదా ‘మధ్యాహ్న భోజనం చేయమని’ అని కూడా అనువదించవచ్చు; గ్రీకు క్రియ ఉదయపు లేదా మధ్యాహ్నపు భోజనాన్ని సూచించగలదు, కానీ ఇక్కడ సాధారణంగా భోజనం చేయడాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, ఆ కాలంలో ఆచారంగా ఉన్న విధంగా భోజన బల్ల దగ్గర ఆనుకొని కూర్చున్నాడు.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν δὲ τῷ λαλῆσαι
  choice: ఆయన మాట్లాడుతుండగా
  rationale: ἐν + articular infinitive సమకాలిక చర్యను సూచిస్తుంది; ఈ తెలుగు రూపం కొనసాగుతున్న కాలభావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐρωτᾷ
  choice: కోరాడు
  rationale: ఇది కథనంలోని చారిత్రక వర్తమాన రూపం; తెలుగులో సహజ కథనశైలికి భూతకాలాన్ని వాడాం. క్రియ యొక్క ప్రాథమిక భావమైన అడగడం/కోరడాన్ని నిలిపి, ఆహ్వాన భావాన్ని తరువాతి వాక్యభాగం తెలియజేసేలా చేశాం.
- source_word: Φαρισαῖος
  choice: ఒక పరిసయ్యుడు
  rationale: సమూహనామానికి ప్రామాణిక తెలుగు రూపాన్ని, నిర్దిష్టం కాని ఏకవచన భావానికి ‘ఒక’ను వాడాం.
- source_word: ὅπως ἀριστήσῃ
  choice: భోజనం చేయమని
  rationale: ἀριστάω ఉదయం లేదా మధ్యాహ్నపు భోజనాన్ని సూచించగలదు; సందర్భం సమయాన్ని ఖచ్చితంగా చెప్పనందున సాధారణమైన ‘భోజనం చేయడం’ అనే భావాన్ని ఎంచుకున్నాం.
- source_word: παρ’ αὐτῷ
  choice: తనతో కలిసి
  rationale: గ్రీకు పదబంధం అక్షరార్థంగా ‘తనతో/తన దగ్గర’ అని ఉంటుంది. ఇల్లు అని స్పష్టంగా చేర్చకుండా, కలిసి భోజనం చేసే సామాజిక భావాన్ని నిలిపాం.
- source_word: εἰσελθὼν
  choice: లోపలికి వెళ్లి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన అనుబంధ చర్యను సహజమైన తెలుగు క్రమంలో తెలిపాం.
- source_word: ἀνέπεσεν
  choice: భోజనానికి బల్ల దగ్గర ఆనుకొని కూర్చున్నాడు
  rationale: మొదటి శతాబ్దపు భోజన పద్ధతిలో ఈ క్రియ బల్ల దగ్గర ఆనుకొని భోజనానికి కూర్చోవడాన్ని సూచిస్తుంది; కేవలం ‘కూర్చున్నాడు’ అనే అనిశ్చిత భావాన్ని నివారించాం.
