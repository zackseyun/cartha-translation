source:
  edition: SBLGNT
  text: ἄνδρες ⸀Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/032.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the proclamation of Jonah, and behold, something greater than Jonah is here.
translation:
  language: te
  text: నీనెవె పురుషులు తీర్పు సమయంలో ఈ తరంతో కలిసి లేచి నిలబడతారు, ఈ తరాన్ని దోషిగా తీరుస్తారు. ఎందుకంటే యోనా ప్రకటించిన సందేశానికి స్పందించి వారు పశ్చాత్తాపపడ్డారు. ఇదిగో, యోనా కంటే గొప్పది ఇక్కడ ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యోనా కంటే గొప్పవాడు ఇక్కడ ఉన్నాడు,” లేక “యోనా కంటే ఎక్కువ ఇక్కడ ఉంది.” గ్రీకులో ‘గొప్పది/ఎక్కువ’ అనే పదం నపుంసకలింగ రూపంలో ఉంది. కాబట్టి ఇది కేవలం ఒక వ్యక్తితో చేసే పోలికనే కాక, యేసులోను ఆయన పరిచర్యలోను ఉన్న మరింత గొప్ప వాస్తవాన్ని విస్తృతంగా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: నీనెవె పురుషులు
  rationale: ἄνδρες అనే స్పష్టమైన పురుషలింగ బహువచనాన్ని ‘ప్రజలు’ అని సాధారణీకరించకుండా నిలుపుతూ, తెలుగులో సహజంగా నగరనామంతో వ్యక్తులను సూచిస్తుంది.
- source_word: ἀναστήσονται
  choice: లేచి
  rationale: భవిష్య న్యాయ సందర్భంలో వారు లేచి నిలబడటాన్ని తెలియజేస్తుంది; ‘పునరుత్థానమవుతారు’ అని సందర్భార్థాన్ని అతిగా స్పష్టీకరించదు.
- source_word: ἐν τῇ κρίσει
  choice: తీర్పు సమయంలో
  rationale: అంతిమ న్యాయ సంఘటనను ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: ఈ తరంవారితో పాటు
  rationale: μετά యొక్క సహవాస భావాన్ని ‘తో పాటు’ ద్వారా నిలుపుతుంది; ‘ఈ తరం’ అనే సమాంతర సువార్తల ప్రయోగాన్ని వ్యక్తులను సూచించే సహజ రూపంలో అందిస్తుంది.
- source_word: κατακρινοῦσιν αὐτήν
  choice: ఈ తరాన్ని దోషిగా తీరుస్తారు
  rationale: κατακρίνω కేవలం తీర్పు చెప్పడం కాక దోషిగా నిర్ధారించడాన్ని సూచిస్తుంది; సర్వనామానికి బదులు దాని పూర్వపదాన్ని పునరుక్తి చేయడం తెలుగులో స్పష్టతనిస్తుంది.
- source_word: μετενόησαν
  choice: పశ్చాత్తాపపడ్డారు
  rationale: ప్రవక్త సందేశానికి వచ్చిన నైతిక-ఆధ్యాత్మిక ప్రతిస్పందనను ‘మనస్సు మార్చుకున్నారు’ కంటే సముచితంగా వ్యక్తపరుస్తుంది.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: యోనా ప్రకటించిన సందేశానికి
  rationale: κήρυγμα యొక్క ప్రకటన/సందేశ భావాన్నీ, εἰς సూచించే ప్రతిస్పందన సంబంధాన్నీ సహజమైన తెలుగులో కలిపి అందిస్తుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రద్ధను గంభీరంగా ఆకర్షించే మూలంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: యోనా కంటే గొప్పది ఇక్కడ ఉంది
  rationale: నపుంసకలింగ πλεῖον‌ను ‘గొప్పవాడు’గా మార్చకుండా ‘గొప్పది’గా ఉంచి, యేసు వ్యక్తితో పాటు ఆయనలో ప్రత్యక్షమైన విస్తృత వాస్తవాన్ని సూచించే అవకాశాన్ని కాపాడుతుంది.
theological_decisions:
- issue: πλεῖον Ἰωνᾶ యొక్క సూచన మరియు పరిధి
  choice: యోనా కంటే గొప్పది ఇక్కడ ఉంది
  alternative: యోనా కంటే గొప్పవాడు ఇక్కడ ఉన్నాడు; యోనా కంటే ఎక్కువైనది ఇక్కడ ఉంది
  rationale: గ్రీకు పదం నపుంసకలింగంలో ఉంది. యేసే దృష్టిలో ఉన్నప్పటికీ, పదబంధాన్ని కేవలం వ్యక్తిగత పోలికగా పరిమితం చేయకుండా, ఆయనలోను ఆయన పరిచర్యలోను ఉన్న గొప్ప వాస్తవాన్ని కూడా సూచించగల మూలంలోని ఉద్దేశపూర్వక విస్తృతిని ఈ రూపం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరమైన న్యాయ మరియు ప్రవచన ధోరణిని నిలుపుతూ రూపొందించబడింది. ‘గొప్పది’ అనే రూపం ఉద్దేశపూర్వకంగా మూలంలోని నపుంసకలింగ అస్పష్టతను కాపాడుతుంది.
