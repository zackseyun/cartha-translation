revisions:
- from: నీనెవె పురుషులు తీర్పు సమయంలో ఈ తరంవారితో పాటు లేచి, ఈ తరాన్ని దోషిగా తీరుస్తారు. ఎందుకంటే యోనా ప్రకటించిన సందేశానికి వారు పశ్చాత్తాపపడ్డారు. ఇదిగో, యోనా కంటే గొప్పది ఇక్కడ ఉంది.[a]
  to: నీనెవె పురుషులు తీర్పు సమయంలో ఈ తరంతో కలిసి లేచి నిలబడతారు, ఈ తరాన్ని దోషిగా తీరుస్తారు. ఎందుకంటే యోనా ప్రకటించిన సందేశానికి స్పందించి వారు పశ్చాత్తాపపడ్డారు. ఇదిగో, యోనా కంటే గొప్పది ఇక్కడ ఉంది.[a]
  rationale: The revision improves modern Telugu idiom and the judicial imagery while preserving every source-level distinction. In particular, it retains the masculine reference to the Ninevites and the Greek neuter ambiguity of πλεῖον rather than resolving it into an exclusively personal claim.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:43:28Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the major Greek elements: the explicitly masculine Ninevites, their future rising in the judgment, condemnation of this generation, repentance in relation to Jonah’s proclamation, the emphatic ἰδού, and the neuter πλεῖον (‘greater thing/reality’). The revision makes the response relation expressed by εἰς τὸ κήρυγμα more idiomatic in Telugu without adding a specific action such as ‘hearing.’'
  naturalness: Several expressions are understandable but slightly stiff or unnatural in modern standard Telugu. ‘ఈ తరంవారితో పాటు’ is less natural than ‘ఈ తరంతో కలిసి’; judicial ‘rise up’ is better represented by ‘లేచి నిలబడతారు’; and ‘సందేశానికి వారు పశ్చాత్తాపపడ్డారు’ benefits from an explicit, idiomatic response construction.
  terminology: ‘తీర్పు,’ ‘పశ్చాత్తాపపడ్డారు,’ and ‘దోషిగా తీరుస్తారు’ are suitable in this register. ‘యోనా కంటే గొప్పది’ appropriately preserves the neuter breadth of πλεῖον. The footnote is retained but its second alternative is adjusted to idiomatic Telugu.
  issues:
  - severity: medium
    issue: Judicial rising is rendered only as ‘లేచి.’
    rationale: Although intelligible, ‘లేచి నిలబడతారు’ more naturally conveys ἀναστήσονται in the courtroom/eschatological setting and retains the vivid image without forcing the technical term ‘resurrection.’
  - severity: low
    issue: ‘ఈ తరంవారితో పాటు’ is awkward.
    rationale: ‘ఈ తరంతో కలిసి’ is the normal modern Telugu way to express association with ‘this generation’ and does not alter the referent.
  - severity: medium
    issue: ‘యోనా ప్రకటించిన సందేశానికి వారు పశ్చాత్తాపపడ్డారు’ is not fully idiomatic.
    rationale: Using ‘స్పందించి’ naturally expresses repentance in response to Jonah’s proclamation, the contextual force of εἰς with μετανοέω, while avoiding an unsupported specification such as ‘after hearing.’
  - severity: low
    issue: The footnote’s alternative ‘ఎక్కువైనది’ is unnatural Telugu.
    rationale: ‘యోనా కంటే ఎక్కువ ఇక్కడ ఉంది’ is a more idiomatic literal alternative for ‘more than Jonah is here.’
  revised_text: నీనెవె పురుషులు తీర్పు సమయంలో ఈ తరంతో కలిసి లేచి నిలబడతారు, ఈ తరాన్ని దోషిగా తీరుస్తారు. ఎందుకంటే యోనా ప్రకటించిన సందేశానికి స్పందించి వారు పశ్చాత్తాపపడ్డారు. ఇదిగో, యోనా కంటే గొప్పది ఇక్కడ ఉంది.[a]
