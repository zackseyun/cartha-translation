  source_fidelity: 'ప్రధాన అనువాదం గ్రీకు వాక్యనిర్మాణాన్నీ భావాన్నీ మొత్తంగా విశ్వసనీయంగా తెలియజేస్తోంది: యేసు వారి ఆలోచనలను ఎరిగి పలికాడు; అంతర్గతంగా విభజించబడిన రాజ్యం నాశనమవుతుంది; ఇల్లు ఇంటిమీద పడుతుంది. అయితే ‘తనకు తానే విరోధంగా చీలిపోయిన’ కంటే ‘తనలో తానే విభజించబడిన’ అనేది διαμερισθεῖσα మరియు ἐφ’ ἑαυτὴν యొక్క అంతర్గత-విభజన భావాన్ని మరింత సహజంగా అందిస్తుంది.'
