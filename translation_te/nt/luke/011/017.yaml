id: LUK.11.17
reference: Luke 11:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: αὐτὸς δὲ εἰδὼς αὐτῶν τὰ διανοήματα εἶπεν αὐτοῖς· Πᾶσα βασιλεία ἐφ’ ἑαυτὴν διαμερισθεῖσα ἐρημοῦται, καὶ οἶκος ἐπὶ οἶκον πίπτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/017.yaml
  text: But he[a], knowing their thoughts, said to them, “Every kingdom divided against itself is laid waste, and a house falls upon a house.”
translation:
  language: te
  text: 'అయితే ఆయన వారి ఆలోచనలు తెలుసుకొని వారితో ఇలా అన్నాడు: “తనలో తానే విభజించబడిన ప్రతి రాజ్యం నాశనమవుతుంది; ఒక ఇల్లు మరొక ఇంటిమీద పడిపోతుంది.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఇక్కడ ‘ఇల్లు’ అనే పదం కుటుంబాన్ని లేదా ఇంటివారిని సూచించవచ్చు. గ్రీకు పదం οἶκος భౌతికమైన ఇంటినిగానీ, కుటుంబం లేదా ఇంటివారినిగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: తెలుసుకొని
  rationale: ఇక్కడ ఈ పదం వారి అంతరంగ ఆలోచనలను గ్రహించి ఉన్న జ్ఞానాన్ని సూచిస్తుంది. ప్రధాన క్రియతో దాని భాగధాతు సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: διανοήματα
  choice: ఆలోచనలు
  rationale: మనస్సులోని తలంపులు లేదా తర్కాలను సూచిస్తుంది; శత్రుత్వపూరిత ఉద్దేశాన్ని అవసరానికి మించి నిర్దిష్టం చేయకుండా స్పష్టంగా ఉంటుంది.
- source_word: Πᾶσα βασιλεία
  choice: ప్రతి రాజ్యం
  rationale: ఇది సాధారణంగా వర్తించే సూత్రవాక్యం; πᾶσα యొక్క పంపిణీ భావాన్ని నిలుపుతుంది.
- source_word: ἐφ’ ἑαυτὴν
  choice: తనకు తానే విరోధంగా
  rationale: διαμερίζωతో కలిసి ఇది కేవలం విభజనను కాక అంతర్గత విరోధాన్ని సూచిస్తుంది.
- source_word: διαμερισθεῖσα
  choice: చీలిపోయిన
  rationale: రాజ్యంలో ఏర్పడిన అంతర్గత విభజనను సహజంగా, బలంగా వ్యక్తం చేస్తుంది.
- source_word: ἐρημοῦται
  choice: నాశనమవుతుంది
  rationale: పాడై నిర్జనమయ్యే తీవ్రమైన ఫలితాన్ని, గ్రీకు క్రియలోని కర్మణి భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: οἶκος ἐπὶ οἶκον
  choice: ఒక ఇల్లు మరొక ఇంటిమీద
  rationale: సంక్షిప్తమైన గ్రీకు రూపంలోని భౌతిక చిత్రాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ తెలుగులో అర్థమయ్యేలా చేస్తుంది; కుటుంబం అనే సామాజిక అర్థం కూడా సాధ్యమేనని పాదసూచికలో తెలియజేయబడింది.
- source_word: πίπτει
  choice: పడిపోతుంది
  rationale: సామెతలాంటి వాక్యంలోని వర్తమాన కాలాన్ని, పడిపోవడం అనే రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: సామెత రెండవ భాగంలో οἶκος అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘ఇల్లు’ అని అనువదించడం
  alternative: ‘కుటుంబం’ లేదా ‘ఇంటివారు’
  rationale: οἶκος భౌతిక ఇంటినీ కుటుంబాన్నీ సూచించగలదు. సందర్భం సామెతలా, సంక్షిప్తంగా ఉన్నందున ప్రధాన పాఠ్యం దాని స్పష్టమైన చిత్రాన్ని నిలుపుతుంది; సామాజిక అర్థాన్ని పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. సూత్రవాక్యపు గంభీరతను నిలుపుతూ, గ్రీకు వాక్యంలోని సంక్షిప్తతను అతిగా వివరణాత్మకం చేయలేదు.
