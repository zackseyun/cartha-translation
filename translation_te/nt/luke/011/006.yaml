id: LUK.11.6
reference: Luke 11:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπειδὴ φίλος ⸀μου παρεγένετο ἐξ ὁδοῦ πρός με καὶ οὐκ ἔχω ὃ παραθήσω αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/006.yaml
  text: because a friend of mine has come to me from a journey[a], and I have nothing to set before him.
translation:
  language: te
  text: ఎందుకంటే, ప్రయాణం నుంచి నా స్నేహితుడొకడు నా దగ్గరికి వచ్చాడు[a]; అతనికి పెట్టడానికి నా దగ్గర ఏమీ లేదు.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘దారి నుంచి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: ఎందుకంటే
  rationale: ఉపమానంలోని అభ్యర్థనకు కారణాన్ని పరిచయం చేసే సహజమైన తెలుగు కారణసూచక పదం.
- source_word: φίλος μου
  choice: నా స్నేహితుడొకడు
  rationale: నిర్దిష్ట ఉపపదం లేని φίλος తో μου కలిసిన నిర్మాణంలోని అనిర్దిష్ట భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: παρεγένετο
  choice: వచ్చాడు
  rationale: παραγίνομαι ఇక్కడ చేరుకోవడాన్ని సూచిస్తుంది; వచ్చిన వ్యక్తి ఇంకా అక్కడే ఉన్నాడనే ఫలితభావం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: ἐξ ὁδοῦ
  choice: ప్రయాణం నుంచి
  rationale: అక్షరార్థంగా ‘దారి నుంచి’ అయినా, సందర్భంలో ప్రయాణం చేసి రావడమే భావం; ఈ రూపం ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: πρός με
  choice: నా దగ్గరికి
  rationale: మాట్లాడుతున్న వ్యక్తి వైపు రావడాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘నా ఇంటికి’ అని మూలంలో లేని అంశాన్ని చేర్చదు.
- source_word: οὐκ ἔχω
  choice: నా దగ్గర ఏమీ లేదు
  rationale: లేమిని స్పష్టంగా, సహజమైన తెలుగు వాడుకలో వ్యక్తం చేస్తుంది.
- source_word: ὃ παραθήσω αὐτῷ
  choice: అతనికి పెట్టడానికి
  rationale: ఆతిథ్య సందర్భంలో భోజనాన్ని ఎదుట పెట్టే భావాన్ని నిలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘వడ్డించడానికి భోజనం’ అనే పదాలను జోడించదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ఆతిథ్య సందర్భం పాఠ్యంలో అంతర్లీనంగా ఉండేలా ఉంచి, మూలంలో లేని ‘ఇల్లు’ లేదా ‘భోజనం’ వంటి పదాలను చేర్చలేదు.
