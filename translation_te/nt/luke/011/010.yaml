id: LUK.11.10
reference: Luke 11:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει, καὶ ὁ ζητῶν εὑρίσκει, καὶ τῷ κρούοντι ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/010.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: te
  text: ఎందుకంటే అడిగే ప్రతి ఒక్కరూ పొందుతారు; వెదికేవారు కనుగొంటారు; తట్టేవారికి తెరవబడుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సందర్భాన్ని మరింత స్పష్టంగా చెబితే, ‘తట్టేవారికి తలుపు తెరవబడుతుంది.’ గ్రీకులో ఏమి తెరవబడుతుందో చెప్పలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: ప్రతి ఒక్కరూ
  rationale: కర్తగా వాడిన వర్తమాన అసమాపక క్రియతో కలిసి ఇది వ్యక్తులందరినీ విడివిడిగా సూచిస్తుంది; ‘ప్రతి ఒక్కరూ’ ఆ సార్వత్రిక పరిధిని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని ప్రోత్సాహానికి ఈ వాక్యం కారణం లేదా వివరణ ఇస్తున్న అనుసంధాన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ὁ αἰτῶν
  choice: అడిగే
  rationale: వర్తమాన అసమాపక క్రియలోని సాధారణంగా లేదా కొనసాగుతూ చేసే చర్య భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λαμβάνει
  choice: పొందుతారు
  rationale: అడగడం–పొందడం అనే సందర్భానికి సరిపోయే గౌరవప్రదమైన, సాధారణ తెలుగు పదం.
- source_word: ὁ ζητῶν
  choice: వెదికేవారు
  rationale: వెదకడం అనే సాధారణ లేదా కొనసాగుతున్న చర్యను సూచిస్తూ, లింగాన్ని ప్రత్యేకంగా పేర్కొనని సహజమైన వ్యక్తి సూచన.
- source_word: εὑρίσκει
  choice: కనుగొంటారు
  rationale: వెదకడం–కనుగొనడం అనే జతలో మూలపదానికి నేరమైన, సహజమైన సమానార్థకం.
- source_word: τῷ κρούοντι
  choice: తట్టేవారికి
  rationale: దత్తి విభక్తి భావాన్ని ‘-కి’తో నిలిపి, తరువాతి కర్మణి క్రియతో ఉన్న గ్రీకు నిర్మాణాన్ని కాపాడుతుంది.
- source_word: ἀνοιγήσεται
  choice: తెరవబడుతుంది
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ, గ్రీకులో చెప్పని కర్మను ‘తలుపు’ అని ప్రధాన వచనంలో అదనంగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: వాగ్దానపు సార్వత్రిక పరిధి మరియు బలం
  choice: వచనంలో ఉన్నట్లే ఎలాంటి అదనపు షరతులు చేర్చకుండా సాధారణ సార్వత్రిక సూత్రంగా అనువదించడం.
  alternative: దీనిని అతిశయోక్తితో కూడిన ప్రోత్సాహంగా చూపడం లేదా ‘సరిగా అడిగే ప్రతి ఒక్కరూ’ వంటి వ్యాఖ్యానాత్మక షరతు చేర్చడం.
  rationale: ప్రార్థనకు ప్రోత్సాహమిచ్చే సందర్భంలో గ్రీకు పాఠం ఎలాంటి స్పష్టమైన పరిమితి లేని సార్వత్రిక వాక్యాన్ని చెబుతుంది. అనువాదం ఆ ధార్మిక ఉద్వేగాన్ని పరిష్కరించకుండా యథాతథంగా ఉంచాలి.
- issue: ἀνοιγήσεται క్రియలో కర్త/కర్మ స్పష్టంగా లేకపోవడం
  choice: ‘తెరవబడుతుంది’ అని మాత్రమే ఉంచి, ఏమి తెరవబడుతుందో ప్రధాన వచనంలో పేర్కొనకపోవడం.
  alternative: సందర్భం ఆధారంగా ‘తలుపు తెరవబడుతుంది’ అని స్పష్టీకరించడం.
  rationale: తట్టడం అనే సందర్భం తలుపును సూచించినప్పటికీ, గ్రీకు మూలంలో అది ప్రత్యక్షంగా లేదు. అందువల్ల ప్రధాన అనువాదం మూలంలోని అస్పష్టతను నిలుపుతుంది; సందర్భోచిత స్పష్టీకరణను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘ప్రతి ఒక్కరూ/వెదికేవారు/తట్టేవారు’ రూపాలు లింగాన్ని నిర్దిష్టం చేయకుండా సాధారణ వ్యక్తులను సూచిస్తాయి. మూడు సమాంతర వాక్యభాగాల లయను అర్ధవిరామాలతో నిలిపాం.
