source:
  edition: SBLGNT
  text: καὶ ἄφες ἡμῖν τὰς ἁμαρτίας ἡμῶν, καὶ γὰρ αὐτοὶ ἀφίομεν παντὶ ὀφείλοντι ἡμῖν· καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς ⸀πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/004.yaml
  text: And forgive us our sins[a], for we ourselves also forgive everyone indebted to us[c][b]. And do not bring us into temptation.
translation:
  language: te
  text: మా పాపాలను క్షమించు; ఎందుకంటే మాకు రుణపడి ఉన్న ప్రతి ఒక్కరినీ[a] మేము కూడా క్షమిస్తాం. మమ్మల్ని శోధనలోకి తీసుకురావద్దు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మాకు బాకీ ఉన్న ప్రతి ఒక్కరినీ.” ఇక్కడ గ్రీకు పదం రుణం లేదా బాకీ భాషను వాడుతుంది; మొదటి భాగంలో మాత్రం “పాపాలు” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పరీక్షలోకి” లేదా “కష్టపరీక్షలోకి.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἄφες
  choice: క్షమించు
  rationale: ప్రార్థనలో దేవునికి చేసిన ప్రత్యక్ష విన్నపంగా ἀφίημι ఇక్కడ సహజంగా ‘క్షమించు’ అని అర్థమిస్తుంది; ‘విడిచిపెట్టు’ అనేది ఈ సందర్భంలో కృత్రిమంగా ఉంటుంది.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: మా పాపాలను
  rationale: మూల గ్రీకు మొదటి భాగంలో ‘అప్పులు’ కాకుండా స్పష్టంగా ‘పాపాలు’ అంటుంది.
- source_word: καὶ γὰρ αὐτοὶ
  choice: ఎందుకంటే … మేము కూడా
  rationale: γὰρ ముందున్న విన్నపానికి కారణాన్ని తెలియజేస్తుంది; αὐτοὶ ఇచ్చే ఉద్ఘాటనను ‘మేము’తో, καί భావాన్ని ‘కూడా’తో సహజమైన తెలుగు వాక్యక్రమంలో నిలిపింది.
- source_word: ἀφίομεν
  choice: క్షమిస్తాం
  rationale: ἄφεςతో ఉన్న క్రియాత్మక సంబంధాన్ని నిలుపుతూ, వర్తమాన కాలంలోని సాధారణ లేదా అలవాటైన చర్యను సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: παντὶ ὀφείλοντι ἡμῖν
  choice: మాకు రుణపడి ఉన్న ప్రతి ఒక్కరినీ
  rationale: ὀφείλωలోని రుణ భాషను నిలుపుతుంది; అదే సమయంలో మొదటి భాగంలోని ‘పాపాలు’ అనే పదంతో ఉన్న ఉద్దేశపూర్వక వ్యత్యాసాన్ని చెరపదు.
- source_word: μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν
  choice: మమ్మల్ని శోధనలోకి తీసుకురావద్దు
  rationale: εἰσφέρω యొక్క ‘లోనికి తీసుకురావడం’ భావాన్ని నిలుపుతూ, πειρασμόςకు ప్రధాన పాఠంలో ‘శోధన’ను ఎంచుకుంది; ‘పరీక్ష’ అనే విస్తృత భావాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: πειρασμόςకు సంబంధించిన చివరి విన్నపం
  choice: మమ్మల్ని శోధనలోకి తీసుకురావద్దు
  alternative: మమ్మల్ని పరీక్షలోకి తీసుకురావద్దు
  rationale: దేవునికి శోధనతో ఉన్న సంబంధాన్ని వివరణతో మృదువుచేయకుండా లేదా సిద్ధాంతపరంగా పరిష్కరించకుండా గ్రీకు వాక్యంలోని ఉద్రిక్తతను అలాగే ఉంచింది. πειρασμόςలోని ‘పరీక్ష/కష్టపరీక్ష’ భావాన్ని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రార్థనకు తగిన గౌరవప్రదమైన ఏకవచన ఆజ్ఞారూపాలను వాడింది. ‘రుణపడి’ మూలంలోని debt imageryని స్పష్టంగా నిలుపుతుంది; ‘శోధనలోకి తీసుకురావద్దు’ సంప్రదాయ పరిచయాన్ని మరియు గ్రీకు వాక్య నిర్మాణాన్ని సమతుల్యం చేస్తుంది.
