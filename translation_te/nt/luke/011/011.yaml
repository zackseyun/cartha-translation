  yaml_path: translation/nt/luke/011/011.yaml
  text: What father among you[a], if his son asks for a fish, will give him a snake instead of a fish?
translation:
  language: te
  text: మీలో ఏ తండ్రి, తన కుమారుడు చేప అడిగితే, చేపకు బదులుగా అతనికి పామును ఇస్తాడు?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνα δὲ ἐξ ὑμῶν τὸν πατέρα
  choice: మీలో ఏ తండ్రినైనా
  rationale: గ్రీకు వాక్యంలోని శ్రోతల మధ్యనున్న తండ్రిని ఉద్దేశించిన అలంకారిక ప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: αἰτήσει
  choice: అడిగితే
  rationale: భవిష్యత్ క్రియారూపం అలంకారిక ప్రశ్నలో షరతు భావంతో పనిచేస్తోంది; తెలుగులో ‘అడిగితే’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὁ υἱὸς
  choice: అతని కుమారుడు
  rationale: నిర్దిష్ట ఉపపదం సందర్భంలో తండ్రి–కుమారుని సంబంధాన్ని సూచిస్తుంది; ‘అతని’ ఆ సంబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἰχθύν / ἰχθύος
  choice: చేప / చేపకు
  rationale: గ్రీకులోని ఏకవచన concrete exampleను తెలుగులో అలాగే నిలుపుతుంది.
- source_word: ἀντὶ
  choice: బదులుగా
  rationale: ఒకదాని స్థానంలో మరొకటి ఇవ్వడమనే ప్రతిస్థాపన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὄφιν
  choice: పామును
  rationale: ὄφις‌కు ఆధునిక తెలుగులో సాధారణమైన, సందర్భోచితమైన సమానార్థకం; అవసరం లేని ప్రతీకాత్మక భావాన్ని జోడించదు.
- source_word: αὐτῷ ἐπιδώσει
  choice: అతనికి ఇస్తాడా
  rationale: ఇవ్వడం లేదా చేతికి అందించడం అనే మూలభావాన్ని సహజమైన తెలుగు అలంకారిక ప్రశ్నగా నిలుపుతుంది.
