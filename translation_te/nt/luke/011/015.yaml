id: LUK.11.15
reference: Luke 11:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπον· Ἐν Βεελζεβοὺλ ⸀τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/015.yaml
  text: But some of them said[a], “By Beelzebul, the ruler of the demons, he casts out demons.”
translation:
  language: te
  text: అయితే వారిలో కొందరు, “ఇతడు దయ్యాల అధిపతియైన బయెల్జెబూలు శక్తితో దయ్యాలను వెళ్లగొడుతున్నాడు” అని అన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బయెల్జెబూబు” అనేది ఇక్కడ గ్రీకు పాఠం ప్రకారం “బయెల్జెబూలు”గా ఇచ్చిన పేరుకు సంప్రదాయంగా వాడే రూపం.
    reason: alternative_reading
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: అయితే వారిలో కొందరు
  rationale: δὲ సందర్భంలోని వ్యతిరేక స్పందనను సూచిస్తుంది; ἐξ αὐτῶν యొక్క భాగార్థాన్ని ‘వారిలో’ సహజంగా తెలియజేస్తుంది.
- source_word: εἶπον
  choice: అని అన్నారు
  rationale: ఏకకాలికంగా జరిగిన మాటను సూచించే అఒరిస్ట్ క్రియకు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: Ἐν Βεελζεβοὺλ
  choice: బయెల్జెబూలు శక్తితో
  rationale: వ్యక్తి పేరుతో వచ్చిన ἐν ఇక్కడ సాధనం లేదా కార్యశక్తిని సూచిస్తుంది. కేవలం ‘తో’ కంటే ‘శక్తితో’ ఆరోపణ భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది; పేరును గ్రీకు రూపానికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: τῷ ἄρχοντι τῶν δαιμονίων
  choice: దయ్యాల అధిపతియైన
  rationale: ἄρχων అధికారమున్న పాలకుడు లేదా అధిపతిని సూచిస్తుంది. ‘అధిపతి’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, అనవసరమైన దయ్యశాస్త్ర వివరాలను చేర్చదు.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: దయ్యాలను వెళ్లగొడుతున్నాడు
  rationale: ἐκβάλλω దయ్యాలను బయటకు పంపడాన్ని సూచిస్తుంది. ‘వెళ్లగొట్టు’ సహజమైన తెలుగు; వర్తమాన క్రియ ఆరోపణలో చెప్పబడిన కార్యాన్ని సజీవంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: Βεελζεβούλ అనే దయ్య సంబంధిత పేరును అనువదించడం
  choice: బయెల్జెబూలు
  alternative: బయెల్జెబూబు
  rationale: ప్రధాన పాఠం గ్రీకు Βεελζεβούλ రూపాన్ని అనుసరిస్తుంది. సంప్రదాయంగా పరిచితమైన సంబంధిత రూపాన్ని పాదటిప్పణిలో ఉంచి, మూలభాషా ప్రాధాన్యాన్ని కాపాడింది.
- issue: ἄρχων పదంలోని అధికార భావం
  choice: దయ్యాల అధిపతి
  alternative: దయ్యాల రాజు
  rationale: ‘అధిపతి’ అధికారాన్ని స్పష్టంగా తెలియజేస్తుంది; వచనం చెప్పేదానికంటే ఎక్కువగా ఒక నిర్దిష్ట రాజ్యవ్యవస్థను సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ఆరోపణలోని భావాన్ని స్పష్టంచేయడానికి ‘శక్తితో’ను ఎంచుకున్నాం. పాదటిప్పణి గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంది.
