  source_fidelity: ‘అయితే వారిలో కొందరు’ accurately represents the adversative δὲ and the partitive ἐξ αὐτῶν. ‘దయ్యాల అధిపతియైన బయెల్జెబూలు శక్తితో’ conveys Ἐν Βεελζεβοὺλ τῷ ἄρχοντι τῶν δαιμονίων as agency and apposition, and ‘దయ్యాలను వెళ్లగొడుతున్నాడు’ faithfully renders the present-tense exorcistic expression ἐκβάλλει τὰ δαιμόνια. No material meaning is added or omitted.
