id: LUK.11.46
reference: Luke 11:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Καὶ ὑμῖν τοῖς νομικοῖς οὐαί, ὅτι φορτίζετε τοὺς ἀνθρώπους φορτία δυσβάστακτα, καὶ αὐτοὶ ἑνὶ τῶν δακτύλων ὑμῶν οὐ προσψαύετε τοῖς φορτίοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/046.yaml
  text: But he said[a], “Woe also to you lawyers, because you load people with burdens hard to bear[b], and you yourselves do not touch the burdens with one of your fingers.”
translation:
  language: te
  text: 'అందుకు ఆయన ఇలా అన్నాడు: “ధర్మశాస్త్ర నిపుణులారా[a], మీకూ అయ్యో! ఎందుకంటే, మీరు ప్రజల మీద మోయడానికి కష్టమైన భారాలు మోపుతున్నారు; మీరైతే స్వయంగా ఆ భారాలను ఒక్క వేలితోనైనా తాకరు.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘ధర్మశాస్త్ర నిపుణులు’ అంటే యూదుల ధర్మశాస్త్రంలో ప్రత్యేక పరిజ్ఞానం ఉన్నవారు; ఆధునిక అర్థంలోని న్యాయవాదులు కాదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆ భారాల మీద ఒక్క వేలు కూడా పెట్టరు.’ ఇతరులపై తాము మోపిన భారాల విషయంలో సహాయం చేయడానికి వారు ఏమాత్రం ప్రయత్నించరని ఈ రూపకం నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: νομικοῖς
  choice: ధర్మశాస్త్ర నిపుణులారా
  rationale: ఇక్కడ ఈ పదం ఆధునిక న్యాయవాదులను కాక, యూదుల ధర్మశాస్త్రంలో నిపుణులైన వారిని సూచిస్తుంది. సంబోధన రూపం గ్రీకు వాక్యంలోని ‘మీకు’ అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐαί
  choice: అయ్యో!
  rationale: ఇది కేవలం విచారాన్ని కాక ప్రవచనాత్మక హెచ్చరికను, తీర్పు ప్రకటనను కూడా మోసే పదం. ‘అయ్యో’ ఆ గంభీరమైన శక్తిని నిలుపుతుంది.
- source_word: φορτίζετε
  choice: భారాలు మోపుతున్నారు
  rationale: ప్రజలపై భారాన్ని ఎక్కిస్తున్నారనే స్పష్టమైన రూపకాన్ని ఈ ప్రయోగం నిలుపుతుంది.
- source_word: ἀνθρώπους
  choice: ప్రజల మీద
  rationale: ఇక్కడ పదం పురుషులకు మాత్రమే పరిమితం కాక సాధారణంగా మనుషులను సూచిస్తుంది; ఆధునిక తెలుగులో ‘ప్రజలు’ సహజమైన సమగ్ర పదం.
- source_word: φορτία δυσβάστακτα
  choice: మోయడం కష్టమైన భారాలు
  rationale: దాదాపు అసాధ్యమైనవి అని అతిశయింపకుండా, మోయడానికి లేదా భరించడానికి కష్టమైన భారాలు అనే మూల భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: αὐτοὶ
  choice: మీరైతే స్వయంగా
  rationale: ఇతరులపై భారాలు మోపేవారికీ వాటిని మోయాల్సిన ప్రజలకూ మధ్య ఉన్న వ్యత్యాసాన్ని గ్రీకు ఉద్ఘాటన ప్రకారం స్పష్టం చేస్తుంది.
- source_word: ἑνὶ τῶν δακτύλων ὑμῶν
  choice: ఒక్క వేలితో కూడా
  rationale: అతి స్వల్ప ప్రయత్నాన్ని సూచించే మూల రూపకాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: προσψαύετε
  choice: తాకరు
  rationale: మూల క్రియలోని ప్రత్యక్షమైన ‘తాకడం’ అనే చిత్రాన్ని నిలుపుతూ, ‘సహాయం చేయరు’ అనే అంతర్భావాన్ని ప్రధాన పాఠ్యంలో విపులీకరించదు.
- source_word: Καὶ ὑμῖν
  choice: మీకూ
  rationale: ముందు ఉద్దేశించిన వారితో పాటు ఈ ధర్మశాస్త్ర నిపుణులకూ శాపహెచ్చరిక వర్తిస్తోందనే καί యొక్క చేర్పు భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: νομικοῖς అనే వారి గుర్తింపు
  choice: యూదుల ధర్మశాస్త్ర నిపుణులు
  alternative: న్యాయవాదులు; శాస్త్రులు
  rationale: సందర్భంలో వీరు మోషే ధర్మశాస్త్రాన్ని వివరించే మతపరమైన నిపుణులు. ‘న్యాయవాదులు’ ఆధునిక పౌర న్యాయవృత్తిని తప్పుగా సూచించవచ్చు; ‘శాస్త్రులు’ అనేది సంబంధితమైనా మూల పదంతో ఎల్లప్పుడూ సమానార్థకం కాదు.
- issue: చివరి వాక్యభాగంలోని రూపకం
  choice: ‘ఒక్క వేలితో కూడా ఆ భారాలను తాకరు’ అనే ప్రత్యక్ష రూపకాన్ని నిలుపడం
  alternative: ఆ భారాలను మోయడంలో ఏమాత్రం సహాయం చేయరు
  rationale: వారు ఇతరులపై విధించిన వాటిలో సహాయం చేయరనే భావం స్పష్టంగా ఉన్నా, మూలం దానిని రూపకంగా చెబుతుంది. అందువల్ల వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా నిజమైన చిత్రాన్ని నిలిపాం.
- issue: οὐαί యొక్క తీర్పు స్వరం
  choice: ‘అయ్యో!’
  alternative: మీకు శ్రమ; మీకు శాపం
  rationale: ఈ మాటలో విచారం, హెచ్చరిక, తీర్పు అనే ఉద్వేగాలు కలిసివున్నాయి. ఒకే సిద్ధాంతపరమైన అర్థానికి పరిమితం చేయకుండా ‘అయ్యో’ ఆ ఉద్వేగ విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన సంభాషణ శైలిని ఉపయోగించాం. ‘ధర్మశాస్త్ర నిపుణులు’ అనే స్పష్టమైన పదబంధం అపార్థాన్ని నివారిస్తుంది; ‘భారాలు మోపడం’ మరియు ‘ఒక్క వేలితో కూడా తాకకపోవడం’ అనే మూల రూపకాలను సాధ్యమైనంత ప్రత్యక్షంగా నిలిపాం.
