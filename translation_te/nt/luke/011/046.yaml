- from: 'అందుకు ఆయన ఇలా అన్నాడు: “ధర్మశాస్త్ర నిపుణులారా[a], మీకూ అయ్యో! ఎందుకంటే, మీరు ప్రజల మీద మోయడం కష్టమైన భారాలు మోపుతున్నారు; మీరైతే స్వయంగా ఒక్క వేలితో కూడా ఆ భారాలను తాకరు.[b]”'
  to: 'అందుకు ఆయన ఇలా అన్నాడు: “ధర్మశాస్త్ర నిపుణులారా[a], మీకూ అయ్యో! ఎందుకంటే, మీరు ప్రజల మీద మోయడానికి కష్టమైన భారాలు మోపుతున్నారు; మీరైతే స్వయంగా ఆ భారాలను ఒక్క వేలితోనైనా తాకరు.[b]”'
  rationale: సవరణలు అర్థాన్ని మార్చవు. చివరి రూపకాన్ని మరింత సహజమైన తెలుగు పదక్రమంలో ఇచ్చి, ‘మోయడానికి కష్టమైన’ ద్వారా మూలంలోని δυσβάστακτα భావాన్ని నేరుగా ప్రతిబింబించాం. అడుగుట గుర్తులు, వాటి స్థానం, మరియు వివరణలు యథాతథంగా సరిపోతున్నాయి.
