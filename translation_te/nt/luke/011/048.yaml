id: LUK.11.48
reference: Luke 11:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄρα ⸂μάρτυρές ἐστε⸃ καὶ συνευδοκεῖτε τοῖς ἔργοις τῶν πατέρων ὑμῶν, ὅτι αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς ὑμεῖς δὲ ⸀οἰκοδομεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/048.yaml
  text: So you are witnesses and approve of the deeds of your fathers[a], because they killed them, but you build their tombs.
translation:
  language: te
  text: కాబట్టి, మీరు సాక్షులుగా ఉన్నారు, మీ పూర్వికుల కార్యాలను సమర్థిస్తున్నారు కూడా. ఎందుకంటే వారే వారిని చంపారు, కానీ మీరు మాత్రం కడుతున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకు పాఠ్యంలో ఇక్కడ “మీరు మాత్రం కడుతున్నారు” అని మాత్రమే ఉంది; కడుతున్నవి ముందటి వచనంలో పేర్కొన్న ప్రవక్తల సమాధులని సందర్భం సూచిస్తుంది.
    reason: సందర్భం నుంచి అర్థమయ్యే, కానీ ఈ వచనంలో స్పష్టంగా చెప్పబడని కర్మను వివరిస్తుంది.
lexical_decisions:
- source_word: ἄρα
  choice: కాబట్టి
  rationale: ముందటి వచనంలోని ఆరోపణ నుంచి తీసుకున్న నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μάρτυρές ἐστε
  choice: సాక్షులై
  rationale: వారు మాటలతో సాక్ష్యం చెప్పడం మాత్రమే కాక, తమ చర్యల ద్వారా పూర్వికుల పనులకు సాక్షులుగా నిలుస్తున్నారనే నామవాచక నిర్మాణ భావాన్ని నిలుపుతుంది.
- source_word: συνευδοκεῖτε
  choice: సమర్థిస్తున్నారు
  rationale: కేవలం ఏకీభవించడం కంటే, పూర్వికుల చర్యలకు నైతిక ఆమోదం తెలుపుతున్న బలమైన భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: τοῖς ἔργοις τῶν πατέρων ὑμῶν
  choice: మీ పూర్వికుల పనులకు
  rationale: ఇక్కడ πατέρων గత తరాలవారిని సూచిస్తున్నందున, ఆధునిక తెలుగులో సహజమైన ‘పూర్వికులు’ను ఎంచుకున్నాం; ἔργοις‌ను సందర్భానికి తగిన ‘పనులు’గా అనువదించాం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఆరోపణకు కారణాన్ని పరిచయం చేసే వివరణాత్మక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς
  choice: వారైతే ఆ ప్రవక్తలను చంపారు
  rationale: μέν…δέ వ్యత్యాసంలోని మొదటి భాగాన్ని ‘వారైతే’తో చూపి, ముందు వచనంలో స్పష్టమైన సూచ్యార్థమైన ప్రవక్తలను సహజత కోసం పేర్కొంటుంది.
- source_word: ὑμεῖς δὲ οἰκοδομεῖτε
  choice: మీరేమో వారి సమాధులను కడుతున్నారు
  rationale: δέతో ఉన్న వ్యత్యాసాన్ని ‘మీరేమో’ నిలుపుతుంది. గ్రీకులో కర్మను మళ్లీ చెప్పకపోయినా, 47వ వచనంలోని సమాధులే ఉద్దేశమని తెలుగులో వాక్యార్థం పూర్తిగా ఉండేందుకు స్పష్టం చేశాం.
theological_decisions:
- issue: οἰκοδομεῖτε అనే క్రియకు సూచిత కర్మను ప్రధాన పాఠ్యంలో చేర్చాలా?
  choice: ముందటి వచనం నుంచి ‘వారి సమాధులను’ అని స్పష్టంగా చేర్చడం.
  alternative: ‘మీరేమో కడుతున్నారు’ అని కర్మను చెప్పకుండా ఉంచడం.
  rationale: గ్రీకు వచనంలో కర్మ లేకపోయినా, 47వ వచనంలోని ప్రవక్తల సమాధులు స్పష్టమైన సందర్భార్థం. తెలుగులో కర్మలేని రూపం అసంపూర్ణంగా, అసహజంగా వినిపించే అవకాశం ఉన్నందున సూచిత కర్మను చేర్చి, దాన్ని పాదటిప్పణిలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘వారైతే… మీరేమో…’ నిర్మాణం గ్రీకులోని μέν…δέ వ్యత్యాసాన్ని సహజంగా నిలుపుతుంది.
