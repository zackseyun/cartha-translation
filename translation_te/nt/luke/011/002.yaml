  timestamp: '2026-07-16T10:43:16Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly preserves the shorter SBLGNT address Πάτερ (“తండ్రీ”), the general condition (“మీరు ప్రార్థించేటప్పుడు”), and the petitionary force of both imperatives. However, “నీ నామం పవిత్రంగా ఎంచబడుగాక” means, literally, “may your name be chosen as holy,” which does not convey ἁγιασθήτω: that God’s name be treated, honored, or regarded as holy.'
  naturalness: The overall wording is natural modern Telugu and suitably reverent. Replacing “ఎంచబడుగాక” with “పవిత్రమైనదిగా గౌరవించబడుగాక” gives a clear and idiomatic prayer formulation.
  terminology: “తండ్రీ,” “నామం,” “రాజ్యం,” and “వచ్చుగాక” are appropriate biblical-register Telugu. The revised phrase avoids implying that God’s name first acquires holiness while retaining the passive-petition sense.
  issues:
  - severity: medium
    issue: “పవిత్రంగా ఎంచబడుగాక” misrenders ἁγιασθήτω.
    rationale: ఎంచబడుట means “to be chosen,” whereas the Greek asks that God’s name be held or treated as holy. This is a substantive semantic mismatch in a central petition.
