id: LUK.11.2
reference: Luke 11:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὅταν προσεύχησθε, λέγετε· ⸀Πάτερ, ἁγιασθήτω τὸ ὄνομά σου· ἐλθέτω ἡ βασιλεία ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/002.yaml
  text: 'And he said to them[a], “When you pray, say: ‘Father, hallowed be your name[b]. Your kingdom come.’”'
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “మీరు ప్రార్థించేటప్పుడు ఇలా అనండి: ‘తండ్రీ,[a] నీ నామం పవిత్రమైనదిగా గౌరవించబడుగాక.[b] నీ రాజ్యం వచ్చుగాక.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని గ్రీకు ప్రతులు, మత్తయి 6:9లోని సమాంతర వాక్యంలాగే, “మా తండ్రీ” అని చదువుతాయి; ఇక్కడ స్వీకరించిన గ్రీకు పాఠంలో “తండ్రీ” అని మాత్రమే ఉంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, “నీ నామం పవిత్రపరచబడుగాక.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν προσεύχησθε
  choice: మీరు ప్రార్థించేటప్పుడు
  rationale: Ὅταν తో కూడిన వర్తమాన సంభావనార్థక క్రియ సాధారణంగా లేదా పునరావృతంగా జరిగే సందర్భాన్ని సూచిస్తుంది; ఈ తెలుగు రూపం సహజంగా అదే భావాన్ని తెలియజేస్తుంది.
- source_word: λέγετε
  choice: ఇలా అనండి
  rationale: వర్తమాన ఆజ్ఞార్థక రూపాన్ని సహజమైన తెలుగు ఉపదేశ శైలిలో అందిస్తుంది; ‘చెబుతూ ఉండండి’ అని పునరావృతిని అతిగా నొక్కిచెప్పదు.
- source_word: Πάτερ
  choice: తండ్రీ
  rationale: సంబోధనార్థక ఏకవచనాన్ని నేరుగా ప్రతిబింబిస్తుంది. మూలపాఠంలో ‘మా’ లేదు కాబట్టి మత్తయి 6:9తో సమన్వయం చేయలేదు.
- source_word: ἁγιασθήτω τὸ ὄνομά σου
  choice: నీ నామం పవిత్రంగా ఎంచబడుగాక
  rationale: దైవ నామం పవిత్రమైనదిగా గుర్తింపబడి ఆదరింపబడాలనే నిష్క్రియ ఆజ్ఞార్థక ప్రార్థనను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; దేవుని నామం మునుపు పవిత్రం కాదనే భావాన్ని కలిగించదు.
- source_word: ἐλθέτω ἡ βασιλεία σου
  choice: నీ రాజ్యం వచ్చుగాక
  rationale: అనుమతి లేదా ప్రార్థన భావంగల అఓరిస్ట్ ఆజ్ఞార్థకాన్ని సంక్షిప్తమైన తెలుగు ప్రార్థనా శైలిలో నిలుపుతుంది. βασιλείαలోని రాజ్యము/పాలన అనే భావ విస్తృతిని ‘రాజ్యం’ సహజంగా మోస్తుంది.
theological_decisions:
- issue: దేవుణ్ణి ‘తండ్రీ’ అని సంబోధించడంలో ‘మా’ పదం లేకపోవడం
  choice: తండ్రీ
  alternative: మా తండ్రీ
  rationale: ఇచ్చిన SBLGNT మూలపాఠం Πάτερ అని మాత్రమే చదువుతుంది. మత్తయి 6:9 లేదా ఆరాధనా సంప్రదాయాన్ని అనుసరించి ‘మా’ను చేర్చలేదు.
- issue: ἁγιασθήτω τὸ ὄνομά σου అనే ప్రార్థన
  choice: నీ నామం పవిత్రంగా ఎంచబడుగాక
  alternative: నీ నామం పవిత్రపరచబడుగాక
  rationale: నిష్క్రియ రూపాన్నీ ప్రార్థనాత్మక బలాన్నీ నిలుపుతూ, దేవుని నామానికి కొత్తగా పవిత్రత కలగాలనే అపార్థాన్ని తగ్గిస్తుంది. మరింత రూపసామ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలి వాడబడింది. ‘నామం,’ ‘రాజ్యం,’ ‘వచ్చుగాక’ వంటి బైబిలు సందర్భంలో సుపరిచితమైన పదాలను ఉంచి, అతిగా ప్రాచీనమైన ‘నామము,’ ‘రాజ్యము’ రూపాలను నివారించింది.
