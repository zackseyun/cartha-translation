revisions:
- from: 'ఆయన వారితో ఇలా అన్నాడు: “మీరు ప్రార్థించేటప్పుడు ఇలా అనండి: ‘తండ్రీ,[a] నీ నామం పవిత్రంగా ఎంచబడుగాక.[b] నీ రాజ్యం వచ్చుగాక.’”'
  to: 'ఆయన వారితో ఇలా అన్నాడు: “మీరు ప్రార్థించేటప్పుడు ఇలా అనండి: ‘తండ్రీ,[a] నీ నామం పవిత్రమైనదిగా గౌరవించబడుగాక.[b] నీ రాజ్యం వచ్చుగాక.’”'
  rationale: The revision changes only the rendering of ἁγιασθήτω τὸ ὄνομά σου. “పవిత్రమైనదిగా గౌరవించబడుగాక” accurately communicates the request that God’s name be honored as holy, without introducing the erroneous sense of selection or suggesting that the name needs to become holy. The footnote retains the more formally literal passive alternative.
