id: LUK.11.8
reference: Luke 11:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς διὰ τὸ εἶναι ⸂φίλον αὐτοῦ⸃, διά γε τὴν ἀναίδειαν αὐτοῦ ἐγερθεὶς δώσει αὐτῷ ⸀ὅσων χρῄζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/008.yaml
  text: I tell you[a], even if he will not get up and give him anything because he is his friend, yet because of his shameless persistence he will get up and give him whatever he needs.
translation:
  language: te
  text: 'నేను మీతో చెబుతున్నాను: అతడు తన స్నేహితుడు కాబట్టి లేచి అతనికి ఏదైనా ఇవ్వకపోయినా, అతని సిగ్గులేని పట్టుదల[a] కారణంగా మాత్రం లేచి అతనికి అవసరమైనదంతా ఇస్తాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతని ధైర్యం వల్ల,” “అతని తెగింపు వల్ల,” లేదా మరింత అక్షరార్థంగా, “అతని సిగ్గులేనితనం వల్ల.” ఇక్కడ “అతని” అనేది అడుగుతున్న వ్యక్తిని సూచిస్తుందని సాధారణంగా అర్థం చేసుకుంటారు; కొందరు దీనిని ఇంటి యజమాని తన గౌరవాన్ని కాపాడుకోవడంగా అర్థం చేసుకుంటారు.
    reason: ἀναίδεια పదానికి ఉన్న అర్థపరిధినీ, αὐτοῦ సూచనకు సంబంధించిన వ్యాఖ్యాన భేదాన్నీ సంరక్షించడం.
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: నేను మీతో చెబుతున్నాను
  rationale: యేసు నేరుగా శ్రోతలను ఉద్దేశించి చెప్పే సూత్రప్రాయమైన మాటను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς
  choice: లేచి అతనికి ఇవ్వకపోయినా
  rationale: εἰ καί లోని concessive భావాన్ని ‘ఇవ్వకపోయినా’ సహజంగా వ్యక్తం చేస్తుంది; ἀναστάς ఈ గృహసందర్భంలో పడకనుంచి లేవడాన్ని సూచిస్తుంది.
- source_word: διὰ τὸ εἶναι φίλον αὐτοῦ
  choice: అతడు తన స్నేహితుడు కాబట్టి
  rationale: కారణార్థక నిర్మాణాన్నీ, వ్యక్తిగత స్నేహసంబంధాన్నీ అమూర్తీకరించకుండా నేరుగా నిలుపుతుంది. సర్వనామ సూచనలో గ్రీకు వాక్యంలోని సహజ అస్పష్టతను అనవసరంగా విప్పదు.
- source_word: διά γε
  choice: కారణంగా
  rationale: ‘ఇవ్వకపోయినా ... కారణంగా’ అనే నిర్మాణం ద్వారానే బలమైన వ్యతిరేక మలుపు తెలుగులో స్పష్టమవుతుంది; అదనపు వ్యాఖ్యాత్మక పదం అవసరం లేదు.
- source_word: ἀναίδειαν
  choice: సిగ్గులేని పట్టుదల
  rationale: పదంలోని ‘సిగ్గులేనితనం’ అనే కఠిన అంచును నిలుపుతూ, సందర్భంలో అడుగుతూనే ఉండే పట్టుదల భావాన్ని తెలియజేస్తుంది; ప్రత్యామ్నాయ అర్థాలను పాదటిప్పణిలో ఉంచింది.
- source_word: ἐγερθεὶς
  choice: లేచి
  rationale: ఈ సందర్భంలో పడకనుంచి లేచి ఇవ్వడాన్ని సూచిస్తుంది; తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: ὅσων χρῄζει
  choice: అతనికి అవసరమైనవన్నీ
  rationale: అవసరమైన వస్తువుల పూర్తి పరిమాణాన్ని సూచించే సంబంధవాచక నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τι implied after δώσει in the first clause
  choice: ప్రత్యేక వస్తుకర్మను చేర్చలేదు
  rationale: తెలుగులో ‘అతనికి ఇవ్వకపోయినా’ సందర్భానుసారంగా పూర్తి భావాన్ని ఇస్తుంది; గ్రీకులో లేని ‘ఏదైనా’ అనే పదాన్ని తప్పనిసరిగా సరఫరా చేయాల్సిన అవసరం లేదు.
theological_decisions:
- issue: ఉపమానంలో ἀναίδεια పదపు భావం
  choice: అడిగేవాని ‘సిగ్గులేని పట్టుదల’
  alternative: ధైర్యం; మొండితనం; సిగ్గులేనితనం; ఇంటి యజమాని తన గౌరవాన్ని కాపాడుకోవడం
  rationale: సందర్భం నిర్బంధం లేకుండా పట్టుదలగా అడగడాన్ని సూచించవచ్చు; అయితే పదం స్వతహాగా ‘సిగ్గులేనితనం’ అనే ప్రతికూల అంచును కలిగి ఉంది. ప్రధాన పాఠం దానిని నిలుపుతుంది, పాదటిప్పణి ఇతర సాధ్యమైన భావాలను తెలియజేస్తుంది. దేవుడు మొరటుతనాన్ని ప్రోత్సహిస్తాడని వాక్యానికి మించిన నిర్ణయం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని కారణ–వ్యతిరేక నిర్మాణం నిలుపబడింది. ‘సిగ్గులేని పట్టుదల’ కొద్దిగా కఠినంగా వినిపించడం మూలపదంలోని ఉద్దేశిత భావ అంచును కాపాడుతుంది.
