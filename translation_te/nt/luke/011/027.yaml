id: LUK.11.27
reference: Luke 11:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ λέγειν αὐτὸν ταῦτα ἐπάρασά τις ⸂φωνὴν γυνὴ⸃ ἐκ τοῦ ὄχλου εἶπεν αὐτῷ· Μακαρία ἡ κοιλία ἡ βαστάσασά σε καὶ μαστοὶ οὓς ἐθήλασας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/027.yaml
  text: And it happened[a], as he was saying these things, that a woman from the crowd raised her voice and said to him, “Blessed is the womb that carried you[b], and the breasts that nursed you.”
translation:
  language: te
  text: ఆయన ఈ మాటలు చెబుతూ ఉండగా, జనసమూహంలోనుంచి ఒక స్త్రీ స్వరం ఎత్తి[a] ఆయనతో, “నిన్ను మోసిన[b] గర్భమూ, నీవు పాలు తాగిన స్తనాలూ ధన్యమైనవి!” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బిగ్గరగా పలికి.’ గ్రీకు నుడికారానికి అక్షరార్థం ‘స్వరం ఎత్తి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నిన్ను కన్న.’ ఇక్కడి గ్రీకు క్రియ గర్భంలో మోయడం లేదా బిడ్డను కనడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ ἐν τῷ λέγειν αὐτὸν ταῦτα
  choice: ఆయన ఈ మాటలు చెబుతూ ఉండగా
  rationale: ἐν τῷ + infinitive సూచించే సమకాలీన, కొనసాగుతున్న చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. Ἐγένετο δὲ అనే కథన సంధిని తెలుగులో భారంగా పునరుక్తి చేయకుండా వాక్య నిర్మాణంలోనే ప్రతిఫలింపజేసింది.
- source_word: ἐπάρασά ... φωνὴν
  choice: స్వరం ఎత్తి
  rationale: ‘స్వరం ఎత్తడం’ అనే గ్రీకు నుడికారాన్ని సహజమైన ఆధునిక తెలుగు నుడికారంతో నిలుపుతుంది; ఆమె అందరికీ వినిపించేలా పలికిందనే భావం వస్తుంది.
- source_word: τις γυνὴ ἐκ τοῦ ὄχλου
  choice: జనసమూహంలోనుంచి ఒక స్త్రీ
  rationale: τις ను అనవసరంగా ‘ఒకానొక’ అని భారంగా చేయకుండా అనిర్దిష్టమైన ‘ఒక స్త్రీ’గా, ἐκ ను మూలం/స్థలాన్ని సూచించే ‘లోనుంచి’గా అనువదించింది.
- source_word: Μακαρία
  choice: ధన్యమైనవి
  rationale: కేవలం వ్యక్తిగత సంతోషం కాక, ప్రత్యేక అనుగ్రహం లేదా గౌరవానికి పాత్రమైన స్థితిని సూచించే μακάριος భావాన్ని బైబిలు సందర్భానికి తగిన ‘ధన్యమైనవి’ నిలుపుతుంది.
- source_word: ἡ κοιλία ἡ βαστάσασά σε
  choice: నిన్ను మోసిన గర్భం
  rationale: మాతృత్వ సందర్భంలో κοιλία ను నిర్దిష్టంగా ‘గర్భం’గా, βαστάζω ను గర్భంలో మోయడాన్ని సూచించే ‘మోసిన’గా అందించింది.
- source_word: μαστοὶ οὓς ἐθήλασας
  choice: నీవు పాలు తాగిన స్తనాలు
  rationale: గ్రీకులో శిశువైన యేసే పాలు తాగినవాడిగా ఉన్న వ్యాకరణ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది; శరీర సంబంధమైన మాతృత్వ చిత్రాన్ని సభ్యంగా, దాపరికం లేకుండా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యేసు తల్లిని గౌరవించే మాటలో Μακαρία అనువాదం
  choice: నిన్ను మోసిన గర్భమూ, నీవు పాలు తాగిన స్తనాలూ ధన్యమైనవి
  alternative: నిన్ను మోసిన గర్భమూ ... భాగ్యవంతమైనవి
  rationale: ‘ధన్యమైనవి’ స్త్రీ పలికిన గౌరవభావాన్ని తగ్గించదు; అదే సమయంలో ఈ వచనానికి మించిన మరియ సంబంధ సిద్ధాంతాన్ని చేర్చదు. మూలపాఠంలోని గౌరవాన్నీ తదుపరి వచనంతో ఏర్పడే భావ ఉద్రిక్తతనూ యథాతథంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే సహజ వాక్య నిర్మాణంతో పాటు ‘ధన్యమైనవి,’ ‘గర్భం,’ ‘స్తనాలు’ వంటి గౌరవప్రదమైన బైబిలు పదజాలాన్ని నిలిపింది.
