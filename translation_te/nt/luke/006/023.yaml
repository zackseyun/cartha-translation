source:
  edition: SBLGNT
  text: χάρητε ἐν ἐκείνῃ τῇ ἡμέρᾳ καὶ σκιρτήσατε, ἰδοὺ γὰρ ὁ μισθὸς ὑμῶν πολὺς ἐν τῷ οὐρανῷ· κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς προφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/023.yaml
  text: Rejoice in that day and leap for joy[a], for behold, your reward is great in heaven[b]; for in the same way their fathers used to do to the prophets.
translation:
  language: te
  text: ఆ రోజున ఆనందించండి, సంతోషంతో గంతులు వేయండి[a]; ఇదిగో, పరలోకంలో మీ ప్రతిఫలం గొప్పది. ఎందుకంటే వారి పూర్వీకులు ప్రవక్తలతో కూడా అలాగే ప్రవర్తించేవారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ రోజున సంతోషించి గంతులు వేయండి.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఎందుకంటే వారి పూర్వీకులు ప్రవక్తలకు అదే విధంగా చేసేవారు’; సందర్భంలో భావం ఏమిటంటే, వారు ప్రవక్తలతోనూ అదే విధంగా ప్రవర్తించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρητε
  choice: ఆనందించి
  rationale: χαίρω యొక్క ఆజ్ఞార్థక బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; వెంట వచ్చే మరో ఆజ్ఞతో కలిపి చదవడానికి అనుకూలంగా ఉంది.
- source_word: σκιρτήσατε
  choice: సంతోషంతో గంతులు వేయండి
  rationale: ఈ క్రియ సూచించే ఉల్లాసభరితమైన శారీరక స్పందనను స్పష్టంగా తెలియజేస్తుంది; కేవలం ‘గంతులు వేయండి’ కంటే సందర్భంలోని ఆనందాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: తరువాత చెప్పే కారణంపై శ్రద్ధ నిలిపే గ్రీకు సంభాషణ సూచకపు బలాన్ని గౌరవప్రదమైన, పరిచితమైన తెలుగులో నిలుపుతుంది.
- source_word: μισθὸς
  choice: ప్రతిఫలం
  rationale: ఇక్కడ భావం సాధారణ కూలి లేదా జీతం కంటే దేవుని నుండి లభించే అనుకూల ప్రతిఫలం; ‘ప్రతిఫలం’ ఆ విస్తృతతను నిలుపుతుంది.
- source_word: πολὺς
  choice: గొప్పది
  rationale: ప్రతిఫలం యొక్క పరిమాణం లేదా ప్రాముఖ్యతను సహజ తెలుగు ప్రయోగంలో తెలియజేస్తుంది.
- source_word: ἐν τῷ οὐρανῷ
  choice: పరలోకంలో
  rationale: ఏకవచన οὐρανός ఇక్కడ సూచించే పరలోక రంగాన్ని సహజంగా అందిస్తుంది; వాక్యంలో లేనిది జోడించదు.
- source_word: κατὰ τὰ αὐτά
  choice: ఇలాగే
  rationale: ‘అదే విధంగా’ అనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తూ ప్రస్తుత హింసకు ప్రవక్తల పట్ల జరిగిన ప్రవర్తనతో ఉన్న పోలికను నిలుపుతుంది.
- source_word: ἐποίουν
  choice: చేసేవారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని అలవాటుగా లేదా పునరావృతంగా జరిగిన చర్య భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; గ్రీకులోని సంక్షిప్తతను అతిగా విశదీకరించదు.
- source_word: τοῖς προφήταις
  choice: ప్రవక్తలకు
  rationale: దత్తివిభక్తి సంబంధాన్ని నేరుగా నిలుపుతుంది; ‘వ్యతిరేకంగా’ వంటి వ్యాఖ్యాత్మక పదాన్ని చేర్చదు.
- source_word: οἱ πατέρες αὐτῶν
  choice: వారి పూర్వీకులు
  rationale: πατέρες ఇక్కడ గత తరాలవారిని సూచిస్తుంది. ఆధునిక సాధారణ పాఠకులకు ‘పూర్వీకులు’ స్పష్టంగా ఉండి, చారిత్రక తరాల మధ్య సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: వాగ్దానం చేసిన ప్రతిఫలం యొక్క స్వరూపం మరియు స్థానం
  choice: పరలోకంలో మీ ప్రతిఫలం గొప్పది
  alternative: పరలోకంలో దేవుని దగ్గర మీ ప్రతిఫలం గొప్పది
  rationale: మూలపాఠం ప్రతిఫలం పరలోకంలో ఉందని మాత్రమే చెబుతుంది. దేవుని గురించి వివరణాత్మక పదాలను చేర్చకుండా మూలంలోని అంత్యకాల నిరీక్షణను నిలుపుతుంది.
- issue: ‘వారి పూర్వీకులు’ అనే పదబంధపు సూచన
  choice: వారి పూర్వీకులు
  alternative: వారి తండ్రులు
  rationale: ప్రస్తుత వ్యతిరేకుల గత తరాలవారిని సూచించే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది; ఏ ప్రత్యేక సమూహాన్ని అనవసరంగా గుర్తించదు.
- issue: ప్రవక్తలకు చేసిన చర్య యొక్క స్వభావం
  choice: ప్రవక్తలకు కూడా ఇలాగే చేసేవారు
  alternative: ప్రవక్తలను కూడా ఇలాగే హింసించేవారు
  rationale: సందర్భం శత్రుత్వపూర్వక ప్రవర్తనను సూచించినా, ఈ వాక్యభాగంలో గ్రీకు క్రియ సాధారణమైన ‘చేసేవారు’ అనే రూపంలో ఉంది. అందువల్ల హింసను స్పష్టంగా చేర్చకుండా మూలంలోని సంక్షిప్తతను, సందర్భాధారిత భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘ఇదిగో’ ద్వారా మూలంలోని శ్రద్ధాకర్షక బలం నిలుపబడింది. చివరి వాక్యంలో గ్రీకు మూలంలోని ఉద్దేశపూర్వక సంక్షిప్తతను ప్రధాన పాఠంలో ఉంచి, దాని సందర్భార్థాన్ని పాదటిప్పణిలో వివరించాం.
