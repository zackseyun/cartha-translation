review_pass:
  verdict: revise
  source_fidelity: The temporal contrast (νῦν / future), the twofold οὐαί, and the future reversal are retained. “కడుపు నిండిన” appropriately conveys the concrete fullness set against future hunger. For πενθήσετε, however, “శోకిస్తారు” more specifically conveys mourning than the broader “దుఃఖిస్తారు.”
  naturalness: The draft is clear modern Telugu and preserves the solemn prophetic register. The revised wording remains idiomatic while making the mourning/weep pairing more precise.
  terminology: “అయ్యో” is a suitable rendering of οὐαί when retained as a forceful lament/woe. The second footnote should supply a genuine lexical alternative rather than an extended interpretive explanation, and its marker remains correctly attached to the second occurrence of οὐαί.
  issues:
  - severity: low
    issue: πενθήσετε is rendered “దుఃఖిస్తారు.”
    rationale: This is broadly possible, but “శోకిస్తారు” more directly represents mourning/lament and preserves its distinction from the following κλαύσετε, “ఏడుస్తారు.”
  - severity: medium
    issue: Footnote b is not framed as a concise lexical alternative.
    rationale: Its stated reason is lexical_alternative, but the note gives an explanatory paraphrase and adds “తీర్పు,” which is contextually plausible but not a lexical alternative supplied by οὐαί itself. A direct alternative such as “హా, మీ దుస్థితి!” better matches the source ambiguity and audit trail.
  revised_text: ఇప్పుడు కడుపు నిండిన మీకు అయ్యో! ఎందుకంటే మీరు ఆకలితో ఉంటారు.[a] ఇప్పుడు నవ్వుతున్న మీకు అయ్యో![b] ఎందుకంటే మీరు శోకిస్తారు, ఏడుస్తారు.
