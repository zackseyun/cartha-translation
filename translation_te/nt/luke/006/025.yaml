id: LUK.6.25
reference: Luke 6:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν, οἱ ἐμπεπλησμένοι ⸀νῦν, ὅτι πεινάσετε. ⸀οὐαί, οἱ γελῶντες νῦν, ὅτι πενθήσετε καὶ κλαύσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/025.yaml
  text: Woe to you who are full now[a], because you will be hungry. Woe to you who are laughing now[b], because you will mourn and weep.
translation:
  language: te
  text: ఇప్పుడు కడుపు నిండిన మీకు అయ్యో! ఎందుకంటే మీరు ఆకలితో ఉంటారు.[a] ఇప్పుడు నవ్వుతున్న మీకు అయ్యో![b] ఎందుకంటే మీరు శోకిస్తారు, ఏడుస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు ఆకలిపడతారు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “హా, మీ దుస్థితి!”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: మీకు అయ్యో!
  rationale: తీర్పుతో కూడిన ప్రవచనాత్మక హెచ్చరిక బలాన్ని నిలుపుతూ, కేవలం జాలిని సూచించే మాటగా మృదువుపరచకుండా సహజమైన తెలుగు ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: ἐμπεπλησμένοι
  choice: కడుపు నిండిన
  rationale: నింపబడిన ఫలితంగా ప్రస్తుతం ఉన్న స్థితిని తెలుపుతుంది. రాబోయే ఆకలితో ఉన్న స్పష్టమైన వ్యత్యాసాన్ని తెలుగులో సహజంగా చూపుతుంది.
- source_word: νῦν
  choice: ఇప్పుడు
  rationale: ప్రస్తుత స్థితికీ భవిష్యత్తులో కలిగే తారుమారుకీ మధ్య ఉన్న కాల వ్యత్యాసాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: πεινάσετε
  choice: మీరు ఆకలితో ఉంటారు
  rationale: భవిష్యత్తులో రానున్న లేమిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; మూలంలోని భావానికి మించిన తీవ్రతను చేర్చదు.
- source_word: γελῶντες
  choice: నవ్వుతున్న
  rationale: ప్రస్తుతం కొనసాగుతున్న నవ్వును సూచించే వర్తమాన కృదంత భావాన్ని నిలుపుతుంది; ‘సంతోషిస్తున్న’ అనే విస్తృతమైన అర్థాన్ని దిగుమతి చేయదు.
- source_word: πενθήσετε
  choice: మీరు దుఃఖిస్తారు
  rationale: తీవ్రమైన శోకాన్ని సూచిస్తూ, తరువాతి ‘ఏడుస్తారు’ అనే క్రియతో కలిసిపోకుండా ప్రత్యేక భావాన్ని నిలుపుతుంది.
- source_word: κλαύσετε
  choice: ఏడుస్తారు
  rationale: బయటకు వ్యక్తమయ్యే రోదనను సహజమైన తెలుగులో తెలియజేసి, ‘దుఃఖిస్తారు’ తరువాత వచ్చే వాక్చాతుర్య తీవ్రతను కాపాడుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఈ దుస్థితి ప్రకటనకు తరువాతి భవిష్యత్ తారుమారే కారణమని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దుస్థితి ప్రకటన స్వభావం
  choice: ప్రస్తుతం తృప్తిగా, నిర్లక్ష్యంగా ఉన్నవారికి రాబోయే తారుమారు మరియు తీర్పు గురించి ప్రవచనాత్మక హెచ్చరిక
  alternative: మారుతూ ఉండే జీవిత పరిస్థితుల గురించిన కేవలం సామాజిక పరిశీలన
  rationale: పునరావృతమైన οὐαί, భవిష్యత్ కాల క్రియలు, చుట్టుపక్కల ఉన్న ధన్యతలతో సమాంతర నిర్మాణం—ఇవి తటస్థ పరిశీలనకన్నా తీర్పుతో కూడిన రాబోయే తారుమారును సూచిస్తాయి. అది ఏ విధంగా నెరవేరుతుందో మూలపాఠం చెప్పనిదాన్ని అనువాదం నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అదే సమయంలో ప్రవచనాత్మక హెచ్చరికకు తగిన గంభీరతతో రూపొందించబడింది. ‘కడుపు నిండిన’ అనే స్పష్టమైన ప్రయోగం ప్రస్తుత సమృద్ధికీ రాబోయే ఆకలికీ మధ్య వ్యత్యాసాన్ని నిలుపుతుంది. రెండు చివరి క్రియలను విడిగా ఉంచి πενθήσετε καὶ κλαύσετε లోని తీవ్రతను కాపాడాం.
