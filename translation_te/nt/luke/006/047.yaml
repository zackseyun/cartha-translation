review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the three coordinated generic participles (coming, hearing, and doing/putting into practice) and the future introduction to the comparison. However, the comparison phrase uses plural/honorific agreement (ఎవరిలాంటివారో) after singular ప్రతి వ్యక్తి. A singular generic formulation is more precise here. Rendering ποιῶν αὐτούς as ఆచరించే is a natural, faithful Telugu expression for acting on Jesus’ words.
  naturalness: నా దగ్గరకు వచ్చి, నా మాటలు విని, వాటిని ఆచరించే is fluent modern standard Telugu. The revised comparison phrase is grammatically consistent and preserves the forward-looking colon that introduces the simile in the following verse.
  terminology: మాటలు appropriately renders λόγοι. ఆచరించే naturally conveys ποιῶν with reference to spoken teaching without adding doctrinal interpretation. ఎవరిలాంటివాడో preserves the personal comparison implicit in the masculine singular Greek form.
  issues:
  - severity: low
    issue: Number/register mismatch in ఎవరిలాంటివారో
    rationale: ప్రతి వ్యక్తి is singular, while ఎవరిలాంటివారో is plural or honorific singular. Since the Greek comparison is grammatically singular and generic, Telugu singular generic agreement is clearer.
  - severity: low
    issue: పాటించే is somewhat narrower than the full force of ποιῶν αὐτούς
    rationale: పాటించే can suggest observing instructions; ఆచరించే more naturally includes putting Jesus’ words into practice while retaining the intended sense.
