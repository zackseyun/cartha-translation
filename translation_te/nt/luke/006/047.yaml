source:
  edition: SBLGNT
  text: πᾶς ὁ ἐρχόμενος πρός με καὶ ἀκούων μου τῶν λόγων καὶ ποιῶν αὐτούς, ὑποδείξω ὑμῖν τίνι ἐστὶν ὅμοιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/047.yaml
  text: Everyone who comes to me and hears my words and does them—I will show you what he is like:[a][b]
translation:
  language: te
  text: 'నా దగ్గరకు వచ్చి, నా మాటలు విని, వాటిని ఆచరించే ప్రతి వ్యక్తి ఎవరిలాంటివాడో మీకు చూపిస్తాను:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ἐρχόμενος
  choice: వాటిని పాటించే ప్రతి వ్యక్తి
  rationale: πᾶς తో కూడిన వర్తమాన కృదంత నిర్మాణం సాధారణంగా ప్రతి వ్యక్తినీ సూచిస్తుంది. తెలుగులో ‘ప్రతి వ్యక్తి’ విశ్వవ్యాప్త పరిధిని సహజంగా తెలియజేస్తుంది.
- source_word: ἐρχόμενος πρός με
  choice: నా దగ్గరికి వచ్చి
  rationale: πρός + ద్వితీయా విభక్తి యేసు వైపు వచ్చి ఆయనను చేరడాన్ని సూచిస్తుంది; ‘నా దగ్గరికి’ ఆధునిక తెలుగులో సహజమైన ప్రయోగం.
- source_word: ἀκούων μου τῶν λόγων
  choice: నా మాటలు విని
  rationale: μου τῶν λόγων ఇక్కడ యేసుకు చెందిన లేదా ఆయన పలికిన మాటలను సూచిస్తుంది. ‘విని’ అనే రూపం మూలంలోని క్రియను నేరుగా నిలుపుతుంది.
- source_word: λόγων
  choice: మాటలు
  rationale: λόγοι ఈ సందర్భంలో యేసు పలికిన బోధనలను సూచిస్తుంది. ‘మాటలు’ నేరమైనదీ సాధారణ పాఠకులకు సులభమైనదీ.
- source_word: ποιῶν αὐτούς
  choice: వాటిని పాటించే
  rationale: మాటలు లేదా ఆజ్ఞలతో ποιέω వాడినప్పుడు వాటిని ఆచరించడం లేదా విధేయత చూపడం భావం. తెలుగులో ‘మాటలను చేయడం’ అసహజం కాబట్టి ‘పాటించే’ మూలభావాన్ని సహజంగా అందిస్తుంది.
- source_word: ὑποδείξω ὑμῖν
  choice: మీకు చూపిస్తాను
  rationale: రాబోయే ఉపమానాన్ని పరిచయం చేసే భవిష్యత్ క్రియను ‘చూపిస్తాను’ నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: τίνι ἐστὶν ὅμοιος
  choice: ఎవరిలాంటివారో
  rationale: τίνι రూపం ‘ఎవరికి/ఎవరితో సదృశుడు’ అనే పోలికను సూచిస్తుంది. ‘ఎవరిలాంటివారో’ తెలుగులో సహజంగా ఉండి, తరువాతి వచనంలోని వ్యక్తితో పోలికను ముందుగానే పరిచయం చేస్తుంది.
theological_decisions:
- issue: గ్రీకులోని వ్యాకరణపరమైన పుంలింగ ఏకవచన సాధారణ సూచన
  choice: ‘ప్రతి వ్యక్తి … ఎవరిలాంటివారో’ అనే లింగనిరపేక్ష సాధారణ తెలుగు నిర్మాణం
  alternative: ‘ప్రతి మనిషి … అతడు ఎవరిలాంటివాడో’ అని పుంలింగ ఏకవచనాన్ని స్పష్టంగా ఉంచడం
  rationale: గ్రీకు పుంలింగ ఏకవచనం ఇక్కడ పురుషులను మాత్రమే పరిమితం చేయకుండా ఏ వ్యక్తినైనా సాధారణంగా సూచిస్తుంది. తెలుగు గౌరవ/సాధారణ రూపమైన ‘వారు’ ఆధారిత నిర్మాణం ఆ విశ్వవ్యాప్త భావాన్ని సహజంగా కాపాడుతుంది; మూలంలో లేని లింగ పరిమితిని కలిగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలి. ‘పాటించే’ అనేది పదశః ‘చేసే’ కంటే సహజంగా ఉండి, యేసు మాటలను ఆచరించే భావాన్ని తెలియజేస్తుంది. చివరి ద్విబిందువు తరువాత వచ్చే ఉపమానంతో వాక్య సంబంధాన్ని నిలుపుతుంది.
