- from: మిమ్మల్ని ప్రేమించేవారినే మీరు ప్రేమిస్తే, అందులో మీకు ఏమి మెప్పు ఉంది?[a] ఎందుకంటే పాపులు కూడా తమను ప్రేమించేవారిని ప్రేమిస్తారు.
  to: మిమ్మల్ని ప్రేమించేవారిని మీరు ప్రేమిస్తే, మీకు ఏ మెప్పు లభిస్తుంది?[a] ఎందుకంటే పాపులు కూడా తమను ప్రేమించేవారిని ప్రేమిస్తారు.
