id: LUK.6.32
reference: Luke 6:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἰ ἀγαπᾶτε τοὺς ἀγαπῶντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; καὶ γὰρ οἱ ἁμαρτωλοὶ τοὺς ἀγαπῶντας αὐτοὺς ἀγαπῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/032.yaml
  text: And if you love those who love you[a], what credit is that to you? For even sinners love those who love them.
translation:
  language: te
  text: మిమ్మల్ని ప్రేమించేవారిని మీరు ప్రేమిస్తే, మీకు ఏ మెప్పు లభిస్తుంది?[a] ఎందుకంటే పాపులు కూడా తమను ప్రేమించేవారిని ప్రేమిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీకు ఏ కృప ఉంది?” గ్రీకు పదానికి ‘కృప,’ ‘మెప్పు,’ లేదా ‘అనుగ్రహం’ అనే అర్థాలు రావచ్చు; ఇక్కడ అది ప్రశంసించదగిన దానిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶτε / ἀγαπῶντας / ἀγαπῶσιν
  choice: ప్రేమించు
  rationale: మూడు సందర్భాల్లోనూ ఒకే పదాన్ని వాడి గ్రీకు మూలంలోని ఉద్దేశపూర్వక పునరుక్తిని, వాక్యపు అలంకార బలాన్ని నిలిపాం.
- source_word: ποία
  choice: ఏమి
  rationale: ప్రశ్నలోని గుణం లేదా విలువను సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: χάρις
  choice: మెప్పు
  rationale: ఇక్కడ రక్షణ సంబంధమైన ‘కృప’ కంటే ప్రశంసార్హత లేదా అనుకూల గుర్తింపు భావమే సందర్భానికి సరిపోతుంది; ‘మెప్పు’ సాధారణ పాఠకునికి ఆ నైతిక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἁμαρτωλοὶ
  choice: పాపులు
  rationale: నామవాచకంగా వాడిన గ్రీకు విశేషణానికి సహజమైన, సుపరిచితమైన తెలుగు సమానం.
- source_word: καὶ γὰρ
  choice: ఎందుకంటే ... కూడా
  rationale: γάρ లోని వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’, καί లోని ఉద్ఘాటనను ‘కూడా’ సహజంగా అందిస్తాయి.
- source_word: ὑμῖν
  choice: మీకు
  rationale: χάρις తో ఉన్న దత్తివును తెలుగులో సహజంగా ‘మీకు’ అని అనువదించాం.
theological_decisions:
- issue: యేసు మాటలో χάρις యొక్క భావం
  choice: రక్షణార్థక ‘కృప’ కాకుండా ‘మెప్పు/ప్రశంసార్హత’
  alternative: కృప; కృతజ్ఞత; ఘనత
  rationale: తమను ప్రేమించేవారినే ప్రేమించడంలో ప్రత్యేకంగా ప్రశంసించదగినది ఏముందనే నైతిక ప్రశ్న ఇక్కడ ప్రధానంగా ఉంది. ‘కృప’ అని ప్రధాన పాఠ్యంలో పెడితే సందర్భంలో ముందుకు రాని సిద్ధాంతార్థాన్ని పాఠకుడు గ్రహించే అవకాశం ఉంది; అయినా మూలపదపు విస్తృత అర్థాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘ప్రేమించు’ అనే పదాన్ని మూడుసార్లూ నిలిపి మూలంలోని పునరుక్తిని కాపాడాం. ప్రధాన పాఠ్యంలో ‘మెప్పు’ ద్వారా సందర్భార్థాన్ని స్పష్టం చేస్తూనే, χάρις లోని నిజమైన పదార్థ వైశాల్యాన్ని [a] పాదసూచికలో భద్రపరిచాం.
