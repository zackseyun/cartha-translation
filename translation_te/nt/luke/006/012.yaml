source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ταύταις ⸂ἐξελθεῖν αὐτὸν⸃ εἰς τὸ ὄρος προσεύξασθαι, καὶ ἦν διανυκτερεύων ἐν τῇ προσευχῇ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/012.yaml
  text: It happened in those days that he went out to the mountain to pray[a], and he spent the whole night in prayer to God.
translation:
  language: te
  text: ఆ రోజుల్లో ఆయన ప్రార్థించడానికి కొండకు వెళ్లాడు; దేవునికి ప్రార్థన చేస్తూ రాత్రంతా గడిపాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన దేవునికి ప్రార్థనలో రాత్రంతా కొనసాగాడు.”
    reason: ἦν διανυκτερεύων ἐν τῇ προσευχῇ అనే కొనసాగుతున్న క్రియను మరింత రూపసామ్యంగా వ్యక్తపరచే అనువాద ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ఒకసారి
  rationale: లూకా వాడే సంఘటనను పరిచయం చేసే కథన ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది. δέకు ప్రత్యేకంగా భారమైన అనుసంధాన పదాన్ని చేర్చకుండా, కథన మార్పును తేలికగా సూచిస్తుంది.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: ఆ రోజుల్లో
  rationale: సమీప సందర్భంలో ప్రస్తావించిన కాలాన్ని సూచించే సహజమైన తెలుగు కాలవ్యక్తీకరణ.
- source_word: ἐξελθεῖν αὐτὸν
  choice: ఆయన ... వెళ్లి
  rationale: ἐγένετο తరువాతి accusative-infinitive నిర్మాణాన్ని తెలుగులో సహజమైన సమాపక క్రియారూపంతో వ్యక్తపరుస్తుంది; బయలుదేరి వెళ్లిన భావాన్ని సందర్భానుసారంగా అందిస్తుంది.
- source_word: εἰς τὸ ὄρος
  choice: కొండకు
  rationale: ὄροςకు సాధారణంగా అర్థమయ్యే ప్రత్యక్ష సమానార్థకం. గ్రీకు నిర్దిష్ట ఉపపదాన్ని తెలుగులో తప్పనిసరిగా ప్రత్యేక సూచకంతో చూపడం అసహజం కాబట్టి చేర్చలేదు.
- source_word: προσεύξασθαι
  choice: ప్రార్థించడానికి
  rationale: చలనక్రియ తరువాత ఉద్దేశాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἦν διανυκτερεύων
  choice: రాత్రంతా గడిపాడు
  rationale: రాత్రి పొడవునా కొనసాగిన కార్యాన్ని తెలిపే imperfect-periphrastic భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: ἐν τῇ προσευχῇ τοῦ θεοῦ
  choice: దేవునికి ప్రార్థిస్తూ
  rationale: τοῦ θεοῦను ప్రార్థన ఎవరికి ఉద్దేశించబడిందో తెలిపే objective/directional genitiveగా వ్యక్తపరుస్తుంది; దేవుడే ప్రార్థిస్తున్నాడనే అపార్థాన్ని నివారిస్తుంది.
theological_decisions:
- issue: యేసు చేసిన ప్రార్థనతో τοῦ θεοῦకు ఉన్న సంబంధం
  choice: దేవునికి ప్రార్థిస్తూ
  alternative: దేవుని ప్రార్థనలో
  rationale: సందర్భంలో యేసు దేవుని ఉద్దేశించి ప్రార్థిస్తున్నాడనే సహజ భావాన్ని ఇస్తుంది. ‘దేవుని ప్రార్థన’ అని పదశః అనువదిస్తే అది దేవునికి చెందిన ప్రార్థన లేదా దేవుడు చేసే ప్రార్థన అనే అపార్థం కలిగించవచ్చు; అదనపు సిద్ధాంత వివరణను మాత్రం వచనంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఆయన’ గౌరవసూచక సర్వనామంగా వాడబడింది. ప్రధాన వాక్యంలో గ్రీకు వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా దాని కాల, ఉద్దేశ, కొనసాగింపు భావాలను నిలిపింది.
