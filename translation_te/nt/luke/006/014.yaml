source:
  edition: SBLGNT
  text: Σίμωνα ὃν καὶ ὠνόμασεν Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ ⸀καὶ Ἰάκωβον καὶ Ἰωάννην ⸁καὶ Φίλιππον καὶ Βαρθολομαῖον
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/014.yaml
  text: Simon, whom he also named Peter, and Andrew his brother, and James and John, and Philip and Bartholomew,
translation:
  language: te
  text: పేతురు అని కూడా ఆయన పేరు పెట్టిన సీమోను, అతని సోదరుడైన అంద్రెయ, యాకోబు, యోహాను, ఫిలిప్పు, బర్తొలొమయి,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σίμωνα
  choice: సీమోను
  rationale: లూకా సువార్తలో ఈ అపొస్తలునికి వాడుకలో ఉన్న ప్రామాణిక తెలుగు నామరూపం.
- source_word: ὃν καὶ ὠνόμασεν Πέτρον
  choice: ఆయనకు పేతురు అని కూడా పేరు పెట్టాడు
  rationale: ὀνομάζω ఇక్కడ పేరు పెట్టే చర్యను సూచిస్తుంది; ‘పిలిచాడు’ కంటే ‘పేరు పెట్టాడు’ ఆ భావాన్ని స్పష్టంగా నిలుపుతుంది. కర్త సందర్భం నుంచి యేసు అని అర్థమవుతుంది కాబట్టి గౌరవ ఏకవచన సర్వనామం వాడబడింది.
- source_word: Πέτρον
  choice: పేతురు
  rationale: Πέτροςకు స్థిరపడిన ప్రామాణిక తెలుగు బైబిలు నామరూపం.
- source_word: Ἀνδρέαν
  choice: అంద్రెయ
  rationale: Ἀνδρέαςకు మూల ఉచ్చారణకు దగ్గరగా, ఆధునిక తెలుగులో చదవదగిన నామరూపం.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: అతని సోదరుడు
  rationale: ఇక్కడ ἀδελφός సహోదరుడిని సూచిస్తుంది; ‘అతని’ అనేది సమీప పూర్వపదమైన సీమోనును సహజంగా సూచిస్తుంది.
- source_word: Ἰάκωβον
  choice: యాకోబు
  rationale: Ἰάκωβοςకు చారిత్రక-భాషాపరంగా సమీపమైన, తెలుగులో స్థిరపడిన నామరూపం; ఆంగ్ల సంప్రదాయ రూపమైన ‘James’ను ఆధారంగా చేసుకోలేదు.
- source_word: Ἰωάννην
  choice: యోహాను
  rationale: Ἰωάννηςకు తెలుగులో స్థిరపడిన ప్రామాణిక నామరూపం.
- source_word: Φίλιππον
  choice: ఫిలిప్పు
  rationale: Φίλιπποςకు సహజమైన తెలుగు లిప్యంతరీకరణ.
- source_word: Βαρθολομαῖον
  choice: బర్తొలొమయి
  rationale: Βαρθολομαῖοςకు మూలరూపాన్ని ప్రతిబింబించే, తెలుగులో సులభంగా చదవగల లిప్యంతరీకరణ.
- source_word: καὶ
  choice: కూడా / మరియు సూచించే జాబితా నిర్మాణం
  rationale: పేరు పెట్టడం గురించిన వాక్యభాగంలోని καίని ‘కూడా’గా స్పష్టంగా అనువదించాం; పేర్ల జాబితాలోని పునరావృత καίలను తెలుగులో సహజమైన కామా-ఆధారిత సమన్వయంగా వ్యక్తం చేశాం.
