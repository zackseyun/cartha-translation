  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ఇది తరువాతి వచనంలో కొనసాగే పన్నెండుగురి జాబితాలోని భాగం కావడంతో చివర కామా ఉంచబడింది.
