    text: లేదా, “ప్రతిష్ఠించబడిన రొట్టెలు”; సంప్రదాయంగా, “సముఖపు రొట్టెలు.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek sequence and cultic terminology while making the Telugu clause explicitly dependent, as required by ὡς in its inherited interrogative context. It also renders the priestly legal restriction in clear modern Telugu and retains the lexical alternative footnote.
