id: LUK.6.4
reference: Luke 6:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ὡς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸀λαβὼν ἔφαγεν καὶ ⸀ἔδωκεν τοῖς μετ’ αὐτοῦ, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ μόνους τοὺς ἱερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/004.yaml
  text: how he entered into the house of God[a], and took and ate the bread of the Presence, and gave some to those with him—which it is not lawful to eat except for the priests alone?
translation:
  language: te
  text: అతడు దేవుని గృహంలోకి ప్రవేశించి, సన్నిధి రొట్టెలను[a] తీసుకొని తిని, తనతో ఉన్నవారికి ఇచ్చాడో—వాటిని యాజకులు మాత్రమే తప్ప మరెవరికీ తినడానికి ధర్మశాస్త్రం ప్రకారం అనుమతి లేదు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతిష్ఠించబడిన రొట్టెలు”; సంప్రదాయంగా, “సముఖపు రొట్టెలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: ఎలా
  rationale: మునుపటి వాక్యంలో దావీదు చేసిన కార్యాన్ని ప్రస్తావించిన సందర్భంలో, ఇది ఆ కార్యం ఎలా జరిగిందో వివరించే పరోక్ష ప్రశ్నను కొనసాగిస్తుంది.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: దేవుని గృహంలోకి ప్రవేశించి
  rationale: οἶκος అనే మూలపదంలోని ‘గృహం’ భావాన్ని నిలుపుతూ, εἰς‌తో వ్యక్తమైన లోపలికి వెళ్లే కదలికను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἄρτους τῆς προθέσεως
  choice: సన్నిధి రొట్టెలు
  rationale: దేవుని సన్నిధిలో ఉంచబడే పవిత్ర రొట్టెలను సూచించే ఆరాధనాపరమైన భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
- source_word: λαβὼν ἔφαγεν
  choice: తీసుకొని తిని
  rationale: కృదంతం తరువాత ప్రధాన క్రియ వచ్చే గ్రీకు నిర్మాణంలోని కార్యక్రమాన్ని సహజమైన తెలుగు క్రియాక్రమంతో నిలుపుతుంది.
- source_word: ἔδωκεν τοῖς μετ’ αὐτοῦ
  choice: తనతో ఉన్నవారికి ఇచ్చాడు
  rationale: ‘తనతో ఉన్నవారు’ అనేది గ్రీకు పదబంధాన్ని నేరుగా ప్రతిబింబిస్తుంది; మూలంలో లేని ‘కొంత’ అనే భావాన్ని చేర్చలేదు.
- source_word: οὓς
  choice: వాటిని
  rationale: సంబంధ సర్వనామం ముందున్న బహువచన రొట్టెలను సూచిస్తున్నందున తెలుగులో స్పష్టమైన బహువచన సర్వనామం వాడబడింది.
- source_word: οὐκ ἔξεστιν φαγεῖν
  choice: తినడం ధర్మసమ్మతం కాదు
  rationale: ఇది సాధారణ అనుమతి కంటే ధార్మిక చట్టబద్ధతకు సంబంధించిన నిషేధమని తెలియజేస్తుంది.
- source_word: εἰ μὴ μόνους τοὺς ἱερεῖς
  choice: యాజకులు మాత్రమే తప్ప మరెవరూ
  rationale: εἰ μὴ మరియు μόνους కలిపి వ్యక్తం చేసే ప్రత్యేకతను, యాజకులకు మాత్రమే ఉన్న అనుమతిని తెలుగులో స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: పవిత్ర రొట్టెలకు సంబంధించిన ఆరాధనా-చట్టపరమైన నియంత్రణ
  choice: ధర్మసమ్మతం కాదు
  alternative: అనుమతి లేదు
  rationale: యేసు ఉదాహరణలోని అంశం కేవలం సామాజిక ఆచారం కాదు; ఇశ్రాయేలు ఆరాధనా ధర్మంలో యాజకులకు మాత్రమే ఉన్న హక్కు. ఈ ఎంపిక ఆ చట్టపరమైన, పవిత్రమైన నేపథ్యాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండే గౌరవప్రదమైన శైలి. ‘దేవుని గృహం’ మూలంలోని οἶκος‌ను నిలుపుతుంది; ‘సన్నిధి రొట్టెలు’ ఆరాధనాపరమైన పదబంధాన్ని సహజంగా అందిస్తుంది. వాక్యం ముందరి సందర్భాన్ని కొనసాగించే ప్రశ్న కావడంతో చివర ప్రశ్నార్థక రూపం ఉంచబడింది.
