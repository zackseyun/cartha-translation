revisions:
- from: అతడు దేవుని గృహంలోకి ప్రవేశించి, సన్నిధి రొట్టెలను[a] తీసుకొని తిని, తనతో ఉన్నవారికి ఇచ్చాడు. యాజకులు మాత్రమే తప్ప మరెవరూ వాటిని తినడం ధర్మసమ్మతం కాదు కదా?”
  to: అతడు దేవుని గృహంలోకి ప్రవేశించి, సన్నిధి రొట్టెలను[a] తీసుకొని తిని, తనతో ఉన్నవారికి ఇచ్చాడో—వాటిని యాజకులు మాత్రమే తప్ప మరెవరికీ తినడానికి ధర్మశాస్త్రం ప్రకారం అనుమతి లేదు?
  rationale: The revision preserves the Greek sequence and cultic terminology while making the Telugu clause explicitly dependent, as required by ὡς in its inherited interrogative context. It also renders the priestly legal restriction in clear modern Telugu and retains the lexical alternative footnote.
