  text: Give to everyone who asks you[a], and from the one who takes what is yours, do not demand it back.
translation:
  language: te
  text: నిన్ను అడిగే ప్రతి ఒక్కరికీ ఇవ్వు; నీకు చెందినవాటిని తీసుకునే ఆ వ్యక్తి దగ్గర వాటిని తిరిగి అడగకు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παντὶ
  choice: ప్రతి ఒక్కరికీ
  rationale: దాత్యర్థక ఏకవచన రూపం ఇక్కడ పంపిణీ భావంతో వాడబడింది; ఈ ఎంపిక ఆజ్ఞలోని విస్తృత పరిధిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: αἰτοῦντί σε
  choice: నిన్ను అడిగే
  rationale: αἰτέω అభ్యర్థించడాన్ని సూచిస్తుంది. ‘అడిగే’ అనేది సామాజిక స్థితిని అనవసరంగా నిర్దిష్టం చేయకుండా సాధారణ అర్థాన్ని ఇస్తుంది.
- source_word: δίδου
  choice: ఇవ్వు
  rationale: వర్తమానకాల ఆజ్ఞార్థక రూపాన్ని తెలుగులో సహజమైన ప్రత్యక్ష ఆజ్ఞగా అనువదించాం; నిరంతరతను అతిగా వ్యక్తం చేయలేదు.
- source_word: ἀπὸ τοῦ αἴροντος
  choice: తీసుకునేవాని నుండి
  rationale: αἴρω ఇక్కడ ఒకరి సొత్తును తీసుకోవడం లేదా తొలగించడం అనే విస్తృత భావాన్ని కలిగి ఉంది. ‘తీసుకునేవాని’ అనేది దొంగతనం వంటి న్యాయపరమైన వర్గాన్ని పాఠ్యంలో చేర్చదు.
- source_word: τὰ σὰ
  choice: నీకు చెందినవాటిని
  rationale: అక్షరార్థంగా ‘నీవైనవి’; ఈ రూపం వస్తువులు లేదా ఆస్తి మాత్రమే అని పరిధిని అనవసరంగా కుదించకుండా మూలంలోని బహువచన భావాన్ని నిలుపుతుంది.
- source_word: μὴ ἀπαίτει
  choice: వాటిని తిరిగి ఇవ్వాలని అడగకు
  rationale: ἀπαιτέω తిరిగి కోరడం, తిరిగి ఇవ్వాలని అడగడం, లేదా డిమాండ్ చేయడం అనే భావాలను కలిగి ఉంటుంది. ఈ ఎంపిక తిరిగి పొందాలనే భావాన్ని స్పష్టంగా ఉంచుతూ సహజమైన ఆధునిక తెలుగును అందిస్తుంది.
theological_decisions:
- issue: యేసు చెప్పిన నైతిక ఆజ్ఞల పరిధి మరియు బలం
  choice: ఆజ్ఞలను విస్తృతమైన ప్రత్యక్ష ఆజ్ఞలుగానే అనువదించడం
  alternative: వాటిని అతిశయోక్తిగా సడలించడం, దానధర్మానికే పరిమితం చేయడం, లేదా రెండవ భాగాన్ని న్యాయపరమైన దొంగతన పరిహారానికే పరిమితం చేయడం
  rationale: గ్రీకు పాఠ్యంలో ‘ప్రతి ఒక్కరికీ’ అనే విస్తృత భాషతో నేరుగా ఆజ్ఞార్థక రూపాలు ఉన్నాయి. వాటి అన్వయంపై ఉన్న చర్చను అనువాదంలోనే పరిష్కరించకుండా, మూలంలోని నైతిక ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: సాధారణ ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సులభంగా అర్థమయ్యే ఏకవచన ప్రత్యక్ష సంబోధనను ఉపయోగించాం. మూలంలో అస్పష్టతకు కారణమయ్యే పాఠాంతరం లేదు; అందువల్ల పాదటిప్పణి జోడించలేదు.
