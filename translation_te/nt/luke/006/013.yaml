  yaml_path: translation/nt/luke/006/013.yaml
  text: And when day came[a], he called his disciples, and chose twelve from among them[b], whom he also named apostles.
translation:
  language: te
  text: పగలైనప్పుడు ఆయన తన శిష్యులను దగ్గరకు పిలిచి[a], వారిలో నుంచి పన్నెండు మందిని ఎన్నుకున్నాడు. వారికి “అపొస్తలులు” అనే పేరు కూడా పెట్టాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన శిష్యులను సంబోధించాడు.” గ్రీకు క్రియకు ‘దగ్గరకు పిలిచాడు’ లేదా ‘సంబోధించాడు’ అనే అర్థాలు ఉండవచ్చు; ఇక్కడ వారిలో నుంచి పన్నెండు మందిని ఎన్నుకునే సందర్భం ‘దగ్గరకు పిలిచాడు’ అనే అర్థానికి అనుకూలంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారిని ‘అపొస్తలులు’ అని కూడా పిలిచాడు.” గ్రీకు క్రియకు ‘పేరు పెట్టాడు’ లేదా ‘అని పిలిచాడు’ అనే అర్థాలు ఉన్నాయి. ముందు శిష్యులను దగ్గరకు పిలిచిన చర్యతో తేడా స్పష్టంగా ఉండేందుకు ప్రధాన పాఠ్యంలో ‘పేరు పెట్టాడు’ అని వాడాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡμέρα
  choice: పగలైనప్పుడు
  rationale: పగటి సమయం వచ్చిందనే కాలసూచనను సహజమైన, సంక్షిప్తమైన తెలుగులో తెలియజేస్తుంది.
- source_word: προσεφώνησεν
  choice: తన శిష్యులను దగ్గరకు పిలిచి
  rationale: ఈ సందర్భంలో యేసు విస్తృతమైన శిష్యుల సమూహాన్ని తన దగ్గరకు పిలిచి, వారిలో నుంచి పన్నెండు మందిని ఎన్నుకున్న భావాన్ని స్పష్టంగా అందిస్తుంది; ‘సంబోధించాడు’ అనే అర్థసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: μαθητὰς
  choice: శిష్యులను
  rationale: సువార్తల సందర్భంలో μαθητήςకు స్థిరపడిన, సంబంధం మరియు శిక్షణ రెండింటినీ సూచించే సహజ తెలుగు పదం.
- source_word: ἐκλεξάμενος
  choice: ఎన్నుకున్నాడు
  rationale: ఆ సమూహం నుంచి ఉద్దేశపూర్వకంగా ఎంపిక చేసిన చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: ἀπ’ αὐτῶν
  choice: వారిలో నుంచి
  rationale: పన్నెండు మంది మరింత పెద్ద శిష్యుల సమూహంలో నుంచి ఎంపికయ్యారని స్పష్టం చేస్తుంది.
- source_word: δώδεκα
  choice: పన్నెండు మందిని
  rationale: వ్యక్తులను సూచిస్తున్నందున తెలుగు వాడుకకు అనుగుణంగా సంఖ్యకు ‘మంది’ చేర్చబడింది.
- source_word: ἀποστόλους
  choice: అపొస్తలులు
  rationale: ‘పంపబడినవారు’ అనే మూలభావం ఉన్నప్పటికీ, ఇక్కడ యేసు పన్నెండు మందికి ఇచ్చిన ప్రత్యేక హోదాగా పదం పనిచేస్తోంది; అందువల్ల స్థిరపడిన బైబిలు పదాన్ని వాడాం.
- source_word: ὠνόμασεν
  choice: పేరు పెట్టాడు
  rationale: ఇది వారికి ఒక హోదా లేదా పేరు ఇచ్చిన చర్యను సూచిస్తుంది; ముందు వచ్చిన ‘పిలిచాడు’తో గందరగోళం రాకుండా కూడా చేస్తుంది.
theological_decisions:
- issue: ἀποστόλουςను సాధారణ అర్థమైన ‘పంపబడినవారు’గా అనువదించాలా, స్థిరపడిన హోదా ‘అపొస్తలులు’గా అనువదించాలా
  choice: అపొస్తలులు
  alternative: పంపబడినవారు; సందేశకులు
  rationale: లూకా 6:13లో ఇది ఒక పనికి పంపబడిన వారిని సాధారణంగా వర్ణించడం కాకుండా, యేసు పన్నెండు మందికి ఇచ్చిన designationగా ఉంది. ‘అపొస్తలులు’ ఆ కథనపరమైన ప్రత్యేకతను కాపాడుతుంది; అదనపు సిద్ధాంతార్థాన్ని బలవంతంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని చర్యల క్రమాన్ని నిలుపుకుంటూనే, తెలుగులో సహజంగా చదవడానికి రెండు వాక్యాలుగా విభజించాం. ‘అపొస్తలులు’ అనే స్థిరపడిన పదాన్ని ఉంచి, దాని హోదా స్వభావాన్ని సందర్భమే తెలియజేసేలా చేశాం.
