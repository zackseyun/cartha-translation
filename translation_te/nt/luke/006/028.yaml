translation:
  language: te
  text: మిమ్మల్ని శపించేవారిని దీవించండి; మీతో దుర్వ్యవహారం చేసేవారి కోసం ప్రార్థించండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మిమ్మల్ని వేధించేవారి కోసం” లేదా “మిమ్మల్ని అవమానించేవారి కోసం.” గ్రీకు క్రియ అనేక రకాల శత్రుత్వపూరిత దుర్వ్యవహారాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: దీవించండి
  rationale: బహువచన ఆజ్ఞారూపంలోని క్రియను సహజమైన ఆధునిక తెలుగు ఆజ్ఞగా అందిస్తుంది; శపించడానికి విరుద్ధంగా ఆశీర్వాదం పలకడం అనే భావాన్ని నిలుపుతుంది.
- source_word: τοὺς καταρωμένους ὑμᾶς
  choice: మిమ్మల్ని శపించేవారిని
  rationale: నామవాచకంగా పనిచేసే గ్రీకు కృదంతాన్ని సహజమైన తెలుగు సంబంధార్థక రూపంలో ఇచ్చి, శాపం పలికే క్రియాశీల శత్రుత్వాన్ని కాపాడుతుంది.
- source_word: προσεύχεσθε
  choice: ప్రార్థించండి
  rationale: బహువచన ఆజ్ఞ యొక్క ప్రత్యక్ష బలాన్ని సరళంగా తెలియజేస్తుంది; గ్రీకు వర్తమాన కాలంలోని కొనసాగుతున్న వైఖరిని తెలుగులో కృత్రిమంగా అతిగా వ్యక్తం చేయదు.
- source_word: περὶ τῶν ἐπηρεαζόντων ὑμᾶς
  choice: మిమ్మల్ని దుర్వినియోగం చేసేవారి కోసం
  rationale: περί ను ప్రార్థనకు సంబంధించిన సందర్భంలో ‘కోసం’గా ఇచ్చాం. ἐπηρεάζωలో అవమానించడం, వేధించడం, దుర్వ్యవహారం చేయడం వంటి విస్తృత శత్రుత్వ భావం ఉండగలదు; ‘దుర్వినియోగం చేయడం’ ఆ విస్తృతిని కాపాడుతుంది, ప్రత్యామ్నాయాలను పాదసూచికలో చూపించాం.
theological_decisions:
- issue: శత్రువుల పట్ల ప్రేమను చూపే ఆజ్ఞల పరిధి
  choice: శత్రుత్వానికి దీవెనతోను ప్రార్థనతోను స్పందించాలనే ప్రత్యక్ష నైతిక ఆజ్ఞలుగా అనువదించడం
  alternative: ఆజ్ఞలకు అదనపు సిద్ధాంతపరమైన పరిమితులు లేదా వివరణలు జోడించడం
  rationale: మూలవాక్యం రెండు ప్రత్యక్ష ఆజ్ఞలను ఇస్తుంది. వాటి ఉద్దేశాన్ని ఒక ప్రత్యేక సిద్ధాంత దృక్పథంతో తగ్గించకుండా లేదా విస్తరించకుండా, వాటి నైతిక ఉద్రిక్తతను యథాతథంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. వాక్యం సంక్షిప్తంగా, సహజంగా ఉండేలా చేసి, దీవించడం–శపించడం మధ్యనున్న నైతిక వ్యతిరేకతను స్పష్టంగా నిలిపాం.
