  yaml_path: translation/nt/luke/006/003.yaml
  text: And Jesus answered them, “Have you not even read this, what David did when he was hungry, he and those who were with him?”
translation:
  language: te
  text: 'యేసు వారికి జవాబిచ్చి ఇలా అన్నాడు: “దావీదు ఏమి చేశాడో—అతడూ అతనితో ఉన్నవారూ ఆకలిగొన్నప్పుడు—ఇది కూడా మీరు చదవలేదా?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: ఇలా జవాబిచ్చాడు
  rationale: గ్రీకులోని participle + finite verb అనే సాధారణ వాక్యప్రయోగాన్ని అనవసర పునరుక్తి లేకుండా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πρὸς αὐτοὺς
  choice: వారికి
  rationale: యేసు ఎవరికీ జవాబిచ్చాడో స్పష్టంగా ఉంచే సహజ తెలుగు ప్రయోగం.
- source_word: Οὐδὲ τοῦτο
  choice: ఇది కూడా ... చదవలేదా?
  rationale: οὐδέ లోని ‘ఇది సైతం కాదా’ అనే నొక్కిచెప్పే భావాన్ని సహజమైన తెలుగు ప్రశ్నారూపంలో నిలుపుతుంది.
- source_word: ἀνέγνωτε
  choice: మీరు చదవలేదా
  rationale: లేఖన పరిజ్ఞానాన్ని ప్రశ్నించే గ్రీకు aorist rhetorical question భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὃ ἐποίησεν Δαυὶδ
  choice: దావీదు ... ఏమి చేశాడో
  rationale: గ్రీకు సంబంధవాచక నిర్మాణాన్ని అర్థం స్పష్టంగా ఉండే తెలుగు పరోక్ష ప్రశ్నా నిర్మాణంతో అందిస్తుంది.
- source_word: Δαυὶδ
  choice: దావీదు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ὁπότε
  choice: ఆకలిగొన్నప్పుడు
  rationale: కాలసంబంధాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐπείνασεν
  choice: ఆకలిగొన్నప్పుడు
  rationale: కథన సందర్భంలో ‘ఆకలిగా ఉన్నప్పుడు/ఆకలిగొన్నప్పుడు’ అనే అర్థాన్ని సహజంగా అందిస్తుంది.
- source_word: αὐτὸς καὶ οἱ μετ’ αὐτοῦ ὄντες
  choice: దావీదు, అతనితో ఉన్నవారు
  rationale: దావీదునూ అతనితో ఉన్నవారినీ గ్రీకు మూలంలాగే స్పష్టంగా ప్రస్తావిస్తుంది; ‘సహచరులు’ అనే కొంత వ్యాఖ్యానాత్మక పదాన్ని నివారిస్తుంది.
