id: LUK.6.9
reference: Luke 6:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ ὁ Ἰησοῦς πρὸς αὐτούς· ⸀Ἐπερωτῶ ὑμᾶς, ⸀εἰ ἔξεστιν ⸂τῷ σαββάτῳ⸃ ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ⸀ἀπολέσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/009.yaml
  text: But Jesus said to them[a], “I ask you, is it lawful on the Sabbath to do good or to do harm[b], to save a life or to destroy it?”
translation:
  language: te
  text: 'అయితే యేసు వారితో, “నేను మిమ్మల్ని అడుగుతున్నాను: విశ్రాంతి దినాన మేలు చేయడం న్యాయమా లేక కీడు చేయడం న్యాయమా? ప్రాణాన్ని కాపాడడమా లేక నాశనం చేయడమా?” అన్నాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: కథనంలోని స్వల్ప వ్యత్యాసాన్ని, యేసు వారి వైఖరికి స్పందిస్తున్న భావాన్ని సహజంగా సూచిస్తుంది.
- source_word: Ἐπερωτῶ ὑμᾶς
  choice: నేను మిమ్మల్ని అడుగుతున్నాను
  rationale: నేరుగా ఎదురుప్రశ్న అడిగే క్రియాబలాన్ని ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: εἰ ἔξεστιν
  choice: న్యాయమా
  rationale: విశ్రాంతి దిన ఆచరణలో ధర్మశాస్త్రపరంగా అనుమతించబడినదేమిటనే ప్రశ్నను సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: τῷ σαββάτῳ
  choice: విశ్రాంతి దినాన
  rationale: యూదుల సబ్బాతు దినాన్ని తెలుగులో సుపరిచితమైన బైబిలు పదబంధంతో సూచిస్తుంది.
- source_word: ἀγαθοποιῆσαι
  choice: మేలు చేయడం
  rationale: κακοποιῆσαιతో ఉన్న స్పష్టమైన నైతిక వ్యతిరేకతను నిలుపుతుంది.
- source_word: κακοποιῆσαι
  choice: కీడు చేయడం
  rationale: చెడు లేదా హానికరమైన కార్యం అనే విస్తృత నైతిక భావాన్ని నిలుపుతూ, తరువాతి కాపాడడం/నాశనం చేయడం అనే జోడితో సరిపోతుంది.
- source_word: ψυχὴν
  choice: ప్రాణాన్ని
  rationale: ఈ స్వస్థపరిచే సందర్భంలో వ్యక్తి జీవాన్ని సూచిస్తుంది; అమూర్తమైన ఆత్మ గురించిన సిద్ధాంతార్థాన్ని అనవసరంగా రుద్దదు.
- source_word: σῶσαι
  choice: కాపాడడం
  rationale: ప్రాణాన్ని సంరక్షించడం అనే సందర్భోచిత భావాన్ని సహజ తెలుగులో ఇస్తుంది.
- source_word: ἀπολέσαι
  choice: నాశనం చేయడం
  rationale: ‘కాపాడడం’తో ఉన్న బలమైన వ్యతిరేకతను నిలుపుతుంది; ‘చంపడం’ కంటే గ్రీకు పదంలోని విస్తృత భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ψυχὴν σῶσαι ἢ ἀπολέσαι అనే పదబంధంలో ψυχή అర్థం
  choice: “ప్రాణాన్ని కాపాడడమా, నాశనం చేయడమా”
  alternative: “ఆత్మను రక్షించడమా, నాశనం చేయడమా” లేదా “ఒక వ్యక్తిని కాపాడడమా, నాశనం చేయడమా”
  rationale: తక్షణ సందర్భం విశ్రాంతి దినాన ఒక మనిషికి మేలు చేయడం, అతని జీవాన్ని కాపాడడం గురించినది. అందువల్ల మానవ నిర్మాణంపై తరువాతి సిద్ధాంతాన్ని చొప్పించకుండా సందర్భంలోని ఆచరణాత్మక నైతిక బలాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. మూలంలోని మేలు/కీడు మరియు కాపాడడం/నాశనం చేయడం అనే సమాంతర నైతిక వ్యతిరేకతలు నిలుపబడ్డాయి.
