id: LUK.6.33
reference: Luke 6:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀καὶ ἐὰν ἀγαθοποιῆτε τοὺς ἀγαθοποιοῦντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; ⸁καὶ οἱ ἁμαρτωλοὶ τὸ αὐτὸ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/033.yaml
  text: And if you do good to those who do good to you[a], what credit is that to you? Even sinners do the same.
translation:
  language: te
  text: మీకు మేలు చేసేవారికి మీరు మేలు చేస్తే, మీకు ఏ ప్రశంస దక్కుతుంది?[a] పాపులు కూడా అలాగే చేస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీకు ఏ కృప ఉంది?” గ్రీకు పదానికి “కృప,” “అనుగ్రహం,” “కృతజ్ఞత,” లేదా “ప్రశంస” అనే అర్థాలు ఉండవచ్చు; ఇక్కడ పరస్పర మేలు చేసినందుకు లభించే ప్రశంసను సూచిస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθοποιῆτε
  choice: మేలు చేస్తే
  rationale: ఇతరులకు మంచి చేయడం లేదా ప్రయోజనం కలిగించడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοὺς ἀγαθοποιοῦντας ὑμᾶς
  choice: మీకు మేలు చేసేవారికే
  rationale: మూలంలోని క్రియతో పదబంధ సంబంధాన్ని నిలుపుతూ, పరస్పర మేలు అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘కే’ ప్రతిఫల చర్యపై ఉన్న దృష్టిని సహజంగా చూపిస్తుంది.
- source_word: ποία ὑμῖν χάρις ἐστίν
  choice: అందులో మీకు ఏ మెప్పు ఉంది?
  rationale: ఇక్కడ χάρις రక్షణసంబంధమైన ‘కృప’ కంటే ప్రశంస, అనుకూల గుర్తింపు, లేదా ఘనతను సూచిస్తుంది. ‘మెప్పు’ సామాన్య పాఠకులకు సహజంగా ఉండి ఆ సందర్భార్థాన్ని అందిస్తుంది.
- source_word: οἱ ἁμαρτωλοὶ
  choice: పాపులు
  rationale: లూకా వాడే సామాజిక-మతపరమైన వర్గపదాన్ని తగ్గించకుండా నేరుగా అందించే ప్రామాణిక తెలుగు రూపం.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: అలాగే చేస్తారు
  rationale: ‘అదే పని చేస్తారు’ అనే మూలార్థాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: καὶ
  choice: కూడా
  rationale: రెండవ καὶ ఇక్కడ ‘పాపులు సైతం’ అనే ఆరోహక భావాన్ని కలిగిస్తుంది; తెలుగులో ‘కూడా’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: నైతిక బోధ సందర్భంలో χάρις అర్థం
  choice: మెప్పు లేదా ప్రశంసకు పాత్రత
  alternative: కృప; ఉపకారం; కృతజ్ఞత
  rationale: ఈ అలంకారిక ప్రశ్న పరస్పర మేలు చేసినందుకు లభించే ప్రత్యేక ప్రశంసను గురించి ఉంది; రక్షణసంబంధమైన ‘కృప’ భావాన్ని సందర్భం నిర్బంధించదు. అయితే మూలపదంలోని విస్తృత అర్థాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ἀγαθοποιέω పదరూపాల అనుసంధానాన్ని ‘మేలు’ అనే ఒకే మూలపదంతో నిలిపాం. χάρις యొక్క సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో ‘మెప్పు’గా ఇచ్చి, నిజమైన పదార్థ వైవిధ్యాన్ని పాదసూచికలో భద్రపరిచాం.
