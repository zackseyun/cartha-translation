  edition: SBLGNT
  text: ⸀γίνεσθε οἰκτίρμονες ⸀καθὼς ὁ πατὴρ ὑμῶν οἰκτίρμων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/036.yaml
  text: Be merciful[a], just as your Father is merciful.
translation:
  language: te
  text: మీరు కనికరం గలవారుగా ఉండండి[a]; మీ తండ్రి కనికరం గలవాడై ఉన్నట్లే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కరుణగలవారుగా ఉండండి.” గ్రీకు విశేషణం ఇతరుల దుఃఖాన్ని చూసి చలించి కనికరం లేదా కరుణ చూపే వ్యక్తిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: ఉండండి
  rationale: వర్తమానకాల ఆజ్ఞార్థక రూపం నిరంతర జీవన వైఖరిని సూచిస్తుంది. తెలుగులో ‘కనికరంగలవారై ఉండండి’ సహజంగా ఉండి, ఆ గుణాన్ని అలవరచుకొని కొనసాగించాలనే భావాన్ని తెలియజేస్తుంది.
- source_word: οἰκτίρμονες
  choice: కనికరంగలవారు
  rationale: ఈ విశేషణం ఇతరుల బాధను చూసి చలించి కనికరం చూపే స్వభావాన్ని సూచిస్తుంది. ‘కనికరంగలవారు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: καθὼς
  choice: ఉన్నట్లే
  rationale: ఇది కారణాన్ని కాక పోలికను, ఆదర్శాన్ని సూచిస్తుంది; తండ్రి కనికరమే శిష్యుల ప్రవర్తనకు నమూనా అనే భావాన్ని నిలుపుతుంది.
- source_word: ὁ πατὴρ ὑμῶν
  choice: మీ తండ్రి
  rationale: మూలంలో ‘పరలోకపు’ అనే విశేషణం లేదు. అందువల్ల అదనపు పదాన్ని చేర్చకుండా సంబంధాత్మకమైన సరళ రూపాన్ని నిలిపాం.
- source_word: οἰκτίρμων
  choice: కనికరంగలవాడు
  rationale: మొదటి οἰκτίρμονες‌తో పదసంబంధాన్ని కాపాడేందుకు అదే తెలుగు మూలపదాన్ని ఏకవచన రూపంలో వాడాం.
theological_decisions:
- issue: ఆజ్ఞకు తండ్రి స్వభావంతో ఉన్న సంబంధం
  choice: తండ్రి కనికరాన్ని శిష్యుల ప్రవర్తనకు నమూనాగా చూపడం
  alternative: మీ తండ్రి కనికరంగలవాడు కాబట్టి మీరూ కనికరంగలవారై ఉండండి
  rationale: καθὼς పోలికను సూచించే పదం; దాన్ని కారణార్థకంగా మార్చకుండా ‘ఉన్నట్లే’ అని అనువదించడం మూలంలోని నైతిక అనుకరణ భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘కనికరంగల’ అనే పదాన్ని రెండు చోట్లా నిలిపి మూలంలోని పదపునరావృతిని కాపాడాం; పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చాం.
