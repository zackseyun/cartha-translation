  edition: SBLGNT
  text: καὶ ἔλεγεν ⸀αὐτοῖς· Κύριός ἐστιν ⸂τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/005.yaml
  text: And he was saying to them[a], “The Son of Man is Lord of the Sabbath.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “మనుష్య కుమారుడు విశ్రాంతి దినానికి ప్రభువు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనుష్య కుమారుడు విశ్రాంతి దినంపై ప్రభువుగా ఉన్నాడు.”
    reason: τοῦ σαββάτου అనే షష్ఠీ సంబంధాన్ని ‘విశ్రాంతి దినానికి ప్రభువు’ అని లేదా ‘విశ్రాంతి దినంపై ప్రభువుగా ఉన్నాడు’ అని వ్యక్తం చేయవచ్చు.
lexical_decisions:
- source_word: καὶ
  choice: ఆయన ... ఇలా
  rationale: తెలుగు కథన ప్రవాహంలో వాక్యారంభంలోని καίని ప్రతిసారి ‘మరియు’ అని అనడం అసహజంగా ఉంటుంది. ముందటి సందర్భంతో అనుసంధానాన్ని ‘ఇలా’ సహజంగా కొనసాగిస్తుంది.
- source_word: ἔλεγεν
  choice: అన్నాడు
  rationale: గ్రీకు అసంపూర్ణ భూతకాల రూపం మాటల సందర్భాన్ని నేపథ్యంగా చూపగలదు; అయితే తెలుగు కథనంలో మాటను పరిచయం చేయడానికి సాధారణ భూతకాలమైన ‘అన్నాడు’ సహజంగా ఉంటుంది. ‘చెబుతూ ఉండేవాడు’ అనడం మూలంలో తప్పనిసరిగా లేని పునరావృత భావాన్ని కలిగించవచ్చు.
- source_word: αὐτοῖς
  choice: వారితో
  rationale: దత్తివిభక్తి బహువచన సర్వనామాన్ని సందర్భానికి తగిన సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; వారు ఎవరో అదనంగా నిర్దిష్టీకరించదు.
- source_word: Κύριος
  choice: ప్రభువు
  rationale: ఇక్కడ ఇది కేవలం గౌరవ సంబోధన కాదు; అధికారం సూచించే క్రీస్తు సంబంధిత బిరుదు. ‘ప్రభువు’ ఆ బలాన్ని, పరిచితమైన బైబిలు పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: τοῦ σαββάτου
  choice: విశ్రాంతి దినానికి
  rationale: κύριοςతో ఉన్న షష్ఠీ సంబంధాన్ని తెలుగులో సహజంగా ‘దినానికి ప్రభువు’ అని తెలిపింది. ‘విశ్రాంతి దినం’ సాధారణ పాఠకులకు సబ్బాతు అనే దినం/వ్యవస్థను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: యేసు ఉపయోగించిన స్థిరమైన బిరుదును, దాని సెమిటిక్ నేపథ్యాన్ని, దానియేలు 7తో ఉండగల సంబంధాన్ని కాపాడే పరిచితమైన అనువాదం.
theological_decisions:
- issue: విశ్రాంతి దినానికి సంబంధించి మనుష్య కుమారుని ప్రభుత్వం
  choice: ‘మనుష్య కుమారుడు విశ్రాంతి దినానికి ప్రభువు’ అని ప్రత్యక్ష అధికార ప్రకటనగా అనువదించబడింది.
  alternative: ‘మనుష్య కుమారుడు విశ్రాంతి దినంపై అధికారం గల ప్రభువు.’
  rationale: గ్రీకు పదక్రమం κύριοςను ముందుకు తెచ్చినా, ప్రధాన వాదన విశ్రాంతి దినానికి సంబంధించి మనుష్య కుమారుని అధికారం. మూలంలో స్పష్టంగా లేని ‘కూడా/సైతం’ వంటి పదాన్ని చేర్చకుండా ఆ క్రీస్తు సంబంధిత బలాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ప్రభువు,’ ‘మనుష్య కుమారుడు’ అనే పరిచిత బైబిలు బిరుదులు నిలుపబడ్డాయి; ‘విశ్రాంతి దినం’ సాధారణ పాఠకుడికి వెంటనే అర్థమయ్యే రూపంగా ఎంచుకోబడింది.
