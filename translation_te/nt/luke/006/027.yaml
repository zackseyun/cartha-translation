id: LUK.6.27
reference: Luke 6:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀλλὰ ὑμῖν λέγω τοῖς ἀκούουσιν, ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν, καλῶς ποιεῖτε τοῖς μισοῦσιν ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/027.yaml
  text: 'But I say to you who are listening: love your enemies[a]; do good to those who hate you,'
translation:
  language: te
  text: 'కానీ, వినేవారైన మీతో నేను చెబుతున్నాను: మీ శత్రువులను ప్రేమించండి; మిమ్మల్ని ద్వేషించేవారికి మేలు చేయండి.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλλὰ
  choice: అయితే
  rationale: ముందున్న మాటలతో బలమైన వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ὑμῖν λέγω
  choice: మీతో నేను చెబుతున్నాను
  rationale: ప్రత్యక్ష సంబోధనను, ‘నేను చెబుతున్నాను’ అనే వర్తమాన వాక్యరూపాన్ని నిలుపుతుంది.
- source_word: τοῖς ἀκούουσιν
  choice: వింటున్న
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న, శ్రద్ధగా వినే భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: ἀγαπᾶτε
  choice: ప్రేమించండి
  rationale: ఆజ్ఞార్థక భావాన్ని స్పష్టంగా నిలుపుతూ ἀγαπάω యొక్క సాధారణ అర్థాన్ని ఇస్తుంది.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: మీ శత్రువులను
  rationale: కర్మను, స్వామ్యసూచక సర్వనామాన్ని నేరుగా మరియు సహజంగా అనువదిస్తుంది.
- source_word: καλῶς ποιεῖτε
  choice: మేలు చేయండి
  rationale: గ్రీకు నుడికారంలోని నైతిక కార్యభావాన్ని సహజమైన తెలుగు ప్రయోగంతో తెలియజేస్తుంది.
- source_word: τοῖς μισοῦσιν ὑμᾶς
  choice: మిమ్మల్ని ద్వేషించేవారికి
  rationale: దత్తి విభక్తి సంబంధాన్ని ‘వారికి’తో సహజంగా చూపిస్తూ μισέω యొక్క బలమైన అర్థాన్ని మెత్తబరచదు.
theological_decisions:
- issue: విరోధుల పట్ల నైతిక ఆజ్ఞలు
  choice: ఎలాంటి పరిమితినీ చేర్చకుండా ఆజ్ఞలను నేరుగా, బహువచన ఆజ్ఞార్థకాలుగా అనువదించడం
  alternative: వీటిని వ్యక్తిగత శత్రువులకు మాత్రమే పరిమితం చేయడం లేదా అలంకారాత్మక అతిశయోక్తిగా చూపడం
  rationale: గ్రీకు వాక్యంలో ఈ ఆజ్ఞల పరిధిని పరిమితం చేసే స్పష్టమైన మాట లేదు; కాబట్టి వాటి తీవ్రమైన నైతిక బలాన్ని అనువాదం యథాతథంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా గంభీరంగా రూపొందించబడింది. ‘వింటున్న మీతో’ అనే నిర్మాణం τοῖς ἀκούουσιν యొక్క కొనసాగుతున్న శ్రవణభావాన్ని ఉంచుతుంది. మూలంలో నిజమైన పాఠ్య ప్రత్యామ్నాయం అవసరం లేకపోవడంతో పాదసూచిక ఇవ్వలేదు.
