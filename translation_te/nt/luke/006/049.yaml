id: LUK.6.49
reference: Luke 6:49
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου, ᾗ προσέρηξεν ὁ ποταμός, καὶ ⸂εὐθὺς συνέπεσεν⸃, καὶ ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/049.yaml
  text: But the one who heard and did not act is like a man who built a house on the ground without a foundation[a]. When the river burst against it, it immediately collapsed[b], and the ruin of that house was great.
translation:
  language: te
  text: కాని విని చేయనివాడు[a] పునాది లేకుండా నేలపై ఇల్లు కట్టిన మనిషితో సమానం. నది ఆ ఇంటిమీద ఉద్ధృతంగా విరుచుకుపడగా, అది వెంటనే కూలిపోయింది; ఆ ఇంటి నాశనం చాలా గొప్పది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో అక్షరార్థంగా ‘విని, చేయనివాడు.’ ఇక్కడ ‘చేయడం’ అంటే యేసు మాటల ప్రకారం నడుచుకోవడం.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆ ఇంటి పగులు గొప్పదైంది’ లేదా ‘ఆ ఇంటి నాశనం ఘోరంగా ఉంది’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం పగులు, బీట లేదా కూలిపోవడం వల్ల కలిగిన నాశనాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας
  choice: కాని విని, ఆ మాటల ప్రకారం చేయనివాడు
  rationale: ποιέω ఇక్కడ యేసు మాటలు విని వాటి ప్రకారం చేయడాన్ని సూచిస్తుంది. మూలంలో కర్మ స్పష్టంగా లేకపోయినా, తెలుగులో సహజత కోసం సందర్భానుసారంగా ‘ఆ మాటల ప్రకారం’ అని వ్యక్తం చేశాం; భావాన్ని ‘ఆచరించు’ అనే మతపరమైన పదానికి పరిమితం చేయలేదు.
- source_word: ὅμοιός ἐστιν ἀνθρώπῳ
  choice: మనిషిలా ఉన్నాడు
  rationale: ఉపమాన నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో ఉంచుతుంది. ἀνθρώπῳ ఇక్కడ ఉదాహరణలోని ఒక మనిషిని సూచిస్తుంది.
- source_word: οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου
  choice: పునాది లేకుండా నేలమీద ఇల్లు కట్టిన
  rationale: γῆ సందర్భంలో భూమండలం కాక నేలను సూచిస్తుంది; χωρὶς θεμελίουను నేరుగా, స్పష్టంగా ‘పునాది లేకుండా’ అని అనువదించాం.
- source_word: ᾗ προσέρηξεν ὁ ποταμός
  choice: ఆ ఇంటిమీద నది ఉద్ధృతంగా తాకగానే
  rationale: ప్రసక్త సర్వనామం ఇంటిని సూచిస్తుంది. προσρήγνυμι తెలిపే బలమైన ఢీకొనడాన్ని ‘ఉద్ధృతంగా తాకింది’ ద్వారా వ్యక్తం చేశాం; ‘తాకగానే’ తరువాతి తక్షణ పతనంతో వాక్యాన్ని సహజంగా కలుపుతుంది.
- source_word: εὐθὺς συνέπεσεν
  choice: అది వెంటనే కూలిపోయింది
  rationale: συμπίπτω ఇంటి విషయంలో కూలిపోవడాన్ని సూచిస్తుంది; εὐθύς యొక్క తక్షణత్వాన్ని ‘వెంటనే’ నిలుపుతుంది.
- source_word: τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα
  choice: ఆ ఇంటి పతనం ఘోరంగా ఉంది
  rationale: ῥῆγμαకు పగులు, బీట, కూల్చివేత వల్ల కలిగిన నాశనం అనే భావపరిధి ఉంది. కూలిపోయిన ఇంటి సందర్భంలో ‘పతనం’ సహజంగా ఫలిత నాశనాన్ని తెలియజేస్తుంది; μέγα యొక్క తీవ్రతను ‘ఘోరంగా’ వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఉపమానంలోని ఏకవచన మానవ సూచన
  choice: మనిషి
  alternative: వ్యక్తి
  rationale: ἀνθρώπῳను ఉపమానంలోని ఒక మనిషిగా అనువదించడం మూలంలోని ఏకవచన చిత్రణను నిలుపుతుంది; దీనికి అదనపు సిద్ధాంతార్థం జోడించలేదు.
- issue: విని చేయకపోవడం యొక్క భావం
  choice: ఆ మాటల ప్రకారం చేయనివాడు
  alternative: ఆచరించనివాడు
  rationale: యేసు మాటలకు కార్యరూపం ఇవ్వడమే సందర్భార్థం. ‘ఆచరించు’ సాధ్యమైనప్పటికీ, ‘ప్రకారం చేయు’ మూలంలోని సాధారణ ποιέω భావాన్ని, వినడం-చేయడం మధ్య ఉద్రిక్తతను మరింత పారదర్శకంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన శైలి. ‘పునాది,’ ‘నేలమీద,’ ‘కూలిపోయింది’ వంటి సాధారణ నిర్మాణ పదాలను వాడాం. మూలంలోని వినడం–చేయకపోవడం వ్యత్యాసం మరియు ఇంటి ఘోర పతన చిత్రణను నిలిపాం.
