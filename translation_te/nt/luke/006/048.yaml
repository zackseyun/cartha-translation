id: LUK.6.48
reference: Luke 6:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομοῦντι οἰκίαν ὃς ἔσκαψεν καὶ ἐβάθυνεν καὶ ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν· πλημμύρης δὲ γενομένης προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἴσχυσεν σαλεῦσαι αὐτὴν ⸂διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/048.yaml
  text: He is like a man building a house[a], who dug deep and laid a foundation on the rock. And when a flood came, the river burst against that house and was not able to shake it, because it had been well built.
translation:
  language: te
  text: అతడు ఇల్లు కడుతున్న ఒక మనిషితో పోలి ఉన్నాడు[a]. అతడు లోతుగా తవ్వి, బండ మీద పునాది వేశాడు. వరద వచ్చినప్పుడు, నది ఆ ఇంటిని ఉద్ధృతంగా ఢీకొట్టింది; అయినా ఆ ఇల్లు చక్కగా కట్టబడి ఉండడం వల్ల దానిని కదిలించలేకపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక వ్యక్తితో.” గ్రీకు పాఠంలో ఈ ఉపమానంలోని ప్రతినిధికి పురుష ఏకవచన రూపం వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιός ἐστιν
  choice: అతడు ...లా ఉన్నాడు
  rationale: ఉపమానాన్ని నేరుగా వ్యక్తపరుస్తూ, ఆధునిక తెలుగులో సహజంగా వినిపించే రూపం.
- source_word: ἀνθρώπῳ
  choice: ఒక మనిషి
  rationale: గ్రీకు పాఠంలోని ఏకవచన పురుష ప్రతినిధి రూపాన్ని నిలుపుతుంది; సందర్భంలో ఇతడు ఉదాహరణగా ఉన్నాడు.
- source_word: οἰκοδομοῦντι οἰκίαν
  choice: ఇల్లు కడుతున్న
  rationale: నిర్మాణ చర్యను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἔσκαψεν καὶ ἐβάθυνεν
  choice: లోతుగా తవ్వి
  rationale: రెండు గ్రీకు క్రియలు సూచించే లోతైన తవ్వకాన్ని సహజమైన సంక్షిప్త తెలుగు ప్రయోగంతో అందిస్తుంది.
- source_word: ἔθηκεν θεμέλιον
  choice: పునాది వేశాడు
  rationale: తెలుగులో నిర్మాణానికి సంబంధించిన స్థిరమైన, సహజమైన పదబంధం.
- source_word: ἐπὶ τὴν πέτραν
  choice: బండ మీద
  rationale: πέτρα సూచించే దృఢమైన శిలను 'బండ' సహజంగా వ్యక్తపరుస్తుంది; 'పడకరాయి' వంటి వివరణాత్మక అర్థాన్ని జోడించదు.
- source_word: πλημμύρης δὲ γενομένης
  choice: వరద వచ్చినప్పుడు
  rationale: సమయం/పరిస్థితిని సూచించే గ్రీకు నిర్మాణాన్ని సహజంగా అందిస్తుంది.
- source_word: προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ
  choice: నది ఆ ఇంటిమీద ఉద్ధృతంగా దూసుకొచ్చింది
  rationale: క్రియలోని బలమైన ఢీకొనే భావాన్ని 'ఉద్ధృతంగా దూసుకొచ్చింది' తెలియజేస్తుంది; ποταμόςను 'నది'గా నిలుపుతుంది.
- source_word: οὐκ ἴσχυσεν σαλεῦσαι αὐτήν
  choice: దాన్ని కదిలించలేకపోయింది
  rationale: అసమర్థతను, ఇంటిని స్థిరత్వం కోల్పోయేలా చేయలేకపోవడాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν
  choice: అది చక్కగా కట్టబడి ఉండడం వల్ల
  rationale: కారణార్థాన్ని, ఇంటిని సూచించే కర్మణి భావాన్ని రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: ప్రతినిధి ఉపమానంలో ἀνθρώπῳ యొక్క లింగ సూచన
  choice: ఒక మనిషి
  alternative: ఒక వ్యక్తి
  rationale: గ్రీకు వాక్యంలో ఏకవచన పురుషుడు ఉపమానంలోని ప్రతినిధిగా కనిపిస్తాడు. ఆ రూపాన్ని లింగతటస్థంగా మార్చకుండా ఉంచుతూ, దాని ప్రతినిధి స్వభావాన్ని సందర్భానికే వదిలింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. నిర్మాణం మరియు వరద దృశ్యాల స్పష్టతను కాపాడుతూ, గ్రీకు పాఠంలోని కారణార్థం మరియు కర్మణి భావం నిలుపబడ్డాయి.
