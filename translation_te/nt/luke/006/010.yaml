    text: లేదా, “అతని చేయి స్వస్థపడింది.” గ్రీకు మాట అక్షరార్థంగా, అతని చేయి పునరుద్ధరించబడిందని చెబుతుంది; అది సరైన స్థితికి తిరిగి రావడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  revision_rationale: The revision corrects an unnatural expression for Jesus’ looking at those present, standardizes the spelling of “చేయి,” and renders the Greek passive restoration verb more directly. The footnote remains anchored to “పునరుద్ధరించబడింది” and distinguishes the alternative healing-oriented rendering without treating it as the primary wording.
