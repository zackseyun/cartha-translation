revisions:
- from: ఆయన వారందరినీ చుట్టూ చూసి, అతనితో, “నీ చెయ్యి చాపు” అన్నాడు. అతడు అలాగే చేశాడు; అతని చెయ్యి మునుపటి స్థితికి వచ్చింది.[a]
  to: ఆయన వారందరి వైపు చూసి, అతనితో, “నీ చేయి చాపు” అన్నాడు. అతడు అలాగే చేశాడు; అతని చేయి పునరుద్ధరించబడింది.[a]
  rationale: The revision corrects an unnatural expression for Jesus’ looking at those present, standardizes the spelling of “చేయి,” and renders the Greek passive restoration verb more directly. The footnote remains anchored to “పునరుద్ధరించబడింది” and distinguishes the alternative healing-oriented rendering without treating it as the primary wording.
