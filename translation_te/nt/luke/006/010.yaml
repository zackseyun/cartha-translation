source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος πάντας αὐτοὺς εἶπεν αὐτῷ· Ἔκτεινον τὴν χεῖρά σου· ὁ δὲ ἐποίησεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/010.yaml
  text: And after looking around at them all[a], he said to him, “Stretch out your hand.” And he did so, and his hand was restored.
translation:
  language: te
  text: ఆయన వారందరి వైపు చూసి, అతనితో, “నీ చేయి చాపు” అన్నాడు. అతడు అలాగే చేశాడు; అతని చేయి పునరుద్ధరించబడింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని చేయి స్వస్థపడింది.” గ్రీకు మాట అక్షరార్థంగా, అతని చేయి పునరుద్ధరించబడిందని చెబుతుంది; అది సరైన స్థితికి తిరిగి రావడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: చుట్టూ చూసి
  rationale: అక్కడున్నవారిని అందరినీ పరిశీలించిన తరువాత మాట్లాడిన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πάντας αὐτούς
  choice: వారందరినీ
  rationale: యేసు అక్కడున్న ప్రతి ఒక్కరినీ చూశాడనే సమగ్రతను నిలుపుతుంది.
- source_word: εἶπεν αὐτῷ
  choice: అతనితో ... అన్నాడు
  rationale: దత్తివాచక పరోక్ష కర్మను తెలుగులో సహజంగా వ్యక్తం చేస్తూ, మాట స్వభావానికి అదనపు అర్థాన్ని జోడించదు.
- source_word: Ἔκτεινον τὴν χεῖρά σου
  choice: నీ చెయ్యి చాపు
  rationale: ప్రత్యక్ష ఆజ్ఞను సరళంగా, స్పష్టంగా తెలియజేస్తుంది; χείρ ను ‘చెయ్యి’గానే ఉంచుతుంది.
- source_word: ὁ δὲ ἐποίησεν
  choice: అతడు అలాగే చేశాడు
  rationale: ποιέω ముందున్న ఆజ్ఞలో చెప్పిన చర్యను తిరిగి సూచిస్తుంది; δέ ఇక్కడ స్వల్ప కథన అనుసంధానంగా ఉంది.
- source_word: ἀπεκατεστάθη
  choice: మునుపటి స్థితికి వచ్చింది
  rationale: ἀποκαθίστημι లోని సరైన లేదా పూర్వ స్థితికి తిరిగి రావడం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘స్వస్థపడింది’ అనే వైద్యార్థాన్ని ప్రధాన పాఠ్యంలో నేరుగా చేర్చదు.
- source_word: ἡ χεὶρ αὐτοῦ
  choice: అతని చెయ్యి
  rationale: గ్రీకులో చెయ్యిని స్పష్టంగా మళ్లీ పేర్కొన్న విధానాన్ని నిలుపుతూ తెలుగులో సహజమైన స్వామ్య నిర్మాణాన్ని వాడుతుంది.
theological_decisions:
- issue: ἀπεκατεστάθη ద్వారా అద్భుత ఫలితాన్ని ఎలా వ్యక్తం చేయాలి
  choice: పునరుద్ధరణ భావంతో ‘మునుపటి స్థితికి వచ్చింది’
  alternative: ‘స్వస్థపడింది’ లేదా ‘బాగుపడింది’
  rationale: గ్రీకు క్రియ చికిత్సను మాత్రమే కాక సరైన లేదా పూర్వ స్థితికి పునరుద్ధరించబడటాన్ని ప్రధానంగా సూచిస్తుంది. ఎంపిక చేసిన రూపం ఆ భావాన్ని కాపాడుతూ అద్భుతాన్ని స్పష్టంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘చెయ్యి’ సాధారణ పాఠకులకు ‘చేయి’ కంటే పలుకుబడిలో స్పష్టంగా ఉండి, పాఠ్యమంతటా ఒకే రూపంలో వాడబడింది. మూలంలోని భాగవాచక వాక్యక్రమం తెలుగులో ‘చుట్టూ చూసి’గా సహజీకరించబడింది; పునరుద్ధరణ భావం ప్రధాన పాఠ్యంలోను, వైద్యార్థ ప్రత్యామ్నాయం పాదటిప్పణిలోను నిలుపబడింది.
