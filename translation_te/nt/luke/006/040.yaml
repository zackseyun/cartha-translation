id: LUK.6.40
reference: Luke 6:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν ⸀διδάσκαλον, κατηρτισμένος δὲ πᾶς ἔσται ὡς ὁ διδάσκαλος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/040.yaml
  text: A disciple is not above his teacher[b][a], but everyone when fully trained will be like his teacher.
translation:
  language: te
  text: శిష్యుడు[a] తన బోధకునికంటే గొప్పవాడు కాదు; అయితే పూర్తిగా శిక్షణ పొందిన[b] ప్రతి ఒక్కరూ తన బోధకునిలా ఉంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “విద్యార్థి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “పూర్తిగా సిద్ధపరచబడిన” లేదా “సమర్థునిగా తీర్చిదిద్దబడిన.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: శిష్యుడు
  rationale: ఇది కేవలం విద్యను అభ్యసించే వ్యక్తిని కాకుండా, బోధకునితో సంబంధంలో ఉండి ఆయన ద్వారా రూపుదిద్దుకునే వ్యక్తిని సూచిస్తుంది.
- source_word: ὑπὲρ
  choice: కంటే గొప్పవాడు
  rationale: ఇక్కడ ఈ పదం స్థానం లేదా హోదాలో మించినవాడని సూచిస్తోంది; ఆధునిక తెలుగులో ఈ పోలిక సహజంగా ఉంటుంది.
- source_word: διδάσκαλος
  choice: బోధకుడు
  rationale: బోధించే వ్యక్తి అనే మూలార్థాన్ని స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: κατηρτισμένος
  choice: పూర్తిగా శిక్షణ పొందిన
  rationale: καταρτίζω పదంలోని సిద్ధపరచడం, సమర్థునిగా తీర్చిదిద్దడం అనే భావాలను శిష్యుడు–బోధకుడు సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πᾶς
  choice: ప్రతి ఒక్కరూ
  rationale: ఏ ఒక్క వర్గానికీ పరిమితం కాని సామాన్య నియమంగా ఉన్న గ్రీకు పదబంధపు విస్తృత భావాన్ని తెలుగులో తెలియజేస్తుంది.
- source_word: ὡς
  choice: లా
  rationale: ఇక్కడ సమానత్వం కంటే పోలికను సూచించే సహజమైన తెలుగు రూపం.
- source_word: αὐτοῦ
  choice: తన
  rationale: ఇది ప్రతి శిష్యునికి అతని లేదా ఆమె బోధకునితో ఉన్న సంబంధాన్ని ఏకవచన ప్రతినిధి భావంలో సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: శిష్యుడు పూర్తిగా తీర్చిదిద్దబడినప్పుడు బోధకునితో ఉన్న పోలిక
  choice: తన బోధకునిలా ఉంటారు
  alternative: తన బోధకునితో సమానంగా ఉంటారు
  rationale: ὡς పోలికను సూచిస్తుంది; అన్ని విధాలా సంపూర్ణ సమానత్వం లేదా హోదా సమానత్వం అని వాక్యాన్ని బలవంతంగా నిర్ణయించకుండా ‘లా’ అనే రూపం మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
- issue: κατηρτισμένος యొక్క సందర్భానుసార భావం
  choice: పూర్తిగా శిక్షణ పొందిన
  alternative: పూర్తిగా సిద్ధపరచబడిన
  rationale: శిష్యుడు–బోధకుడు సందర్భం శిక్షణ భావానికి మద్దతిస్తుంది; అయినా పదానికి సిద్ధపరచడం లేదా సమర్థునిగా తీర్చిదిద్దడం అనే విస్తృత భావం కూడా ఉన్నందున దానిని పాదటీపులో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన సామెతసదృశ వాక్య నిర్మాణం వాడబడింది. ‘తన’ అనే రూపం గ్రీకు ఏకవచన సంబంధాన్ని సహజంగా నిలుపుతూ అనవసర లింగ నిర్దిష్టతను నివారిస్తుంది.
