id: LUK.6.34
reference: Luke 6:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸀δανίσητε παρ’ ὧν ἐλπίζετε ⸀λαβεῖν, ποία ὑμῖν χάρις ἐστίν; ⸀καὶ ἁμαρτωλοὶ ἁμαρτωλοῖς δανίζουσιν ἵνα ἀπολάβωσιν τὰ ἴσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/034.yaml
  text: And if you lend to those from whom you expect to receive[a], what credit is that to you? Even sinners lend to sinners so that they may receive back the same amount.
translation:
  language: te
  text: మీరు తిరిగి పొందుతామని ఆశించే వారికి అప్పుగా ఇస్తే, మీకు ఏ ఘనత ఉంటుంది?[a] పాపులు కూడా తాము ఇచ్చినంతే తిరిగి పొందడానికి పాపులకు అప్పుగా ఇస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీకు ఏ కృతజ్ఞత ఉంటుంది?” గ్రీకు పదానికి “కృతజ్ఞత” అనే అర్థం కూడా ఉండవచ్చు; ఇక్కడ అది ప్రశంసకు లేదా అనుకూల గుర్తింపుకు పాత్రమైన ఘనతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δανίσητε / δανίζουσιν
  choice: అప్పుగా ఇస్తే / అప్పుగా ఇస్తారు
  rationale: డబ్బు లేదా వస్తువులను తిరిగి పొందే ఉద్దేశంతో ఇవ్వడం అనే ఆర్థిక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: παρ’ ὧν
  choice: వారికి ... తిరిగి పొందగలమని
  rationale: అప్పు వారికి ఇవ్వబడుతుందని, తిరిగి పొందడం వారి నుంచేనని తెలుగు వాక్యనిర్మాణంలో సహజంగా తెలియజేస్తుంది.
- source_word: ἐλπίζετε λαβεῖν
  choice: తిరిగి పొందగలమని ఆశించే
  rationale: ἐλπίζω లోని ఆశించడం లేదా ఎదురుచూడడం అనే భావాన్ని నిలుపుతూ, అప్పు సందర్భంలో ఊహించిన తిరిగి చెల్లింపును స్పష్టం చేస్తుంది. ‘తిరిగి’ అనేది సందర్భం ద్వారా సూచితమైన భావం.
- source_word: ποία ... χάρις ἐστίν
  choice: మీకు ఏమి మెప్పు ఉంటుంది?
  rationale: ఇక్కడ χάρις రక్షణాత్మక కృపను కాక, ప్రశంసకు లేదా అనుకూల గుర్తింపుకు పాత్రతను సూచిస్తుంది. ‘మెప్పు’ సాధారణ పాఠకులకు సహజంగా ఉండి ఆ భావాన్ని అందిస్తుంది.
- source_word: ἁμαρτωλοὶ
  choice: పాపులు
  rationale: నామవాచకంగా వాడిన విశేషణానికి నేరుగా సరిపోయే, లూకా ఉపయోగించిన నైతిక వర్గాన్ని నిలిపే సాధారణ తెలుగు పదం.
- source_word: ἵνα ἀπολάβωσιν
  choice: తిరిగి పొందడానికి
  rationale: ఇచ్చినదాన్ని ప్రతిగా మళ్లీ పొందడం అనే ἀπολαμβάνω భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὰ ἴσα
  choice: తాము ఇచ్చినంతే
  rationale: సమానమైన పరిమాణం లేదా విలువ తిరిగి రావడాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, వడ్డీ లేదా లాభం అనే అదనపు భావాన్ని చేర్చదు.
theological_decisions:
- issue: యేసు అడిగిన ప్రశ్నలో χάρις భావం
  choice: రక్షణ కృపగా కాక, ప్రశంసకు పాత్రమైన మెప్పుగా అనువదించబడింది.
  alternative: కృప; కృతజ్ఞత; ప్రయోజనం
  rationale: తక్షణ సందర్భంలో శిష్యుల ప్రవర్తన పాపుల పరస్పర ప్రవర్తనకంటే ఎలా భిన్నంగా ఉందనే ప్రశ్న ప్రధానంగా ఉంది. అందువల్ల ‘మెప్పు’ నైతిక ప్రశంస లేదా అనుకూల గుర్తింపు భావాన్ని ఇస్తుంది; రక్షణ సిద్ధాంతాన్ని అనవసరంగా చొప్పించదు.
- issue: అప్పుకు ఆశించే ప్రతిఫలం స్వభావం
  choice: ఇచ్చినంతే తిరిగి పొందడం అని తటస్థంగా అనువదించబడింది.
  alternative: వడ్డీతో పొందడం; లాభంతో పూర్తిగా తిరిగి పొందడం
  rationale: τὰ ἴσα సమానమైన తిరిగి చెల్లింపును సూచిస్తుంది. మూలంలో లేని వడ్డీ, లాభం లేదా వడ్డీ వ్యాపార సంబంధిత నైతిక తీర్పును అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. ‘అప్పుగా ఇవ్వడం,’ ‘తిరిగి పొందడం’ వంటి సహజమైన ఆర్థిక పదజాలాన్ని ఎంచుకున్నాం. మూలంలోని χάρις పదానికి ఉన్న భావ విస్తృతిని పాదటిప్పణిలో నిలిపాం.
