revisions:
- from: మీరు తిరిగి పొందగలమని ఆశించే వారికి అప్పుగా ఇస్తే, మీకు ఏమి మెప్పు ఉంటుంది?[a] పాపులు కూడా తాము ఇచ్చినంతే తిరిగి పొందడానికి పాపులకు అప్పుగా ఇస్తారు.
  to: మీరు తిరిగి పొందుతామని ఆశించే వారికి అప్పుగా ఇస్తే, మీకు ఏ ఘనత ఉంటుంది?[a] పాపులు కూడా తాము ఇచ్చినంతే తిరిగి పొందడానికి పాపులకు అప్పుగా ఇస్తారు.
  rationale: The revision corrects the second-person/first-person agreement error in the expectation clause and replaces the less idiomatic “మెప్పు” with “ఘనత,” which better conveys the contextual sense of commendable moral credit. It retains the draft’s faithful neutral treatment of repayment as an equivalent return and preserves the lexical alternative for χάρις in the footnote.
  reviewer_model: gpt-5.6-terra
