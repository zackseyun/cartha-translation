translation:
  language: te
  text: యాకోబు కుమారుడైన యూదా[a], మరియు ఇస్కరియోతు యూదా—ఇతడు ద్రోహిగా మారాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యాకోబు సోదరుడైన యూదా’; గ్రీకు మూలంలో కేవలం ‘యాకోబుకు చెందిన యూదా’ అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδαν Ἰακώβου
  choice: యాకోబు కుమారుడైన యూదా
  rationale: Ἰακώβου అనే సంబంధార్థక షష్ఠీ విభక్తి ఖచ్చితమైన బంధాన్ని స్పష్టంగా చెప్పదు. అపొస్తలుల జాబితా సందర్భంలో ‘యాకోబు కుమారుడైన యూదా’ సహజమైన, సాధారణంగా అంగీకరించబడిన అర్థం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా మూలంలోని సందిగ్ధత నిలుస్తుంది.
- source_word: Ἰσκαριὼθ
  choice: ఇస్కరియోతు
  rationale: ఇది వ్యక్తికి సంబంధించిన పేరు లేదా బిరుదు కాబట్టి అనువదించకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణను వాడాం.
- source_word: ὃς ἐγένετο
  choice: ఇతడు ... మారాడు
  rationale: ἐγένετο లోని ‘అయ్యాడు/మారాడు’ అనే గతిశీల భావాన్ని కేవలం ‘ఉన్నాడు’ అని స్థిరస్థితిగా మార్చకుండా నిలిపాం.
- source_word: προδότης
  choice: ద్రోహి
  rationale: ప్రత్యేకంగా నమ్మకాన్ని వమ్ముచేసి అప్పగించే వ్యక్తిని సూచించే προδότης కు ‘ద్రోహి’ సంక్షిప్తమైన, సహజమైన తెలుగు సమానం.
- source_word: καὶ
  choice: జాబితా సమన్వయం
  rationale: పునరుక్త καὶ చివరి ఇద్దరి పేర్లను ముందున్న జాబితాతో కలుపుతుంది. ఈ ఒక్క వచనాన్ని సహజ తెలుగులో చదివేలా కామా మరియు పేర్ల సమన్వయంతో వ్యక్తం చేశాం.
theological_decisions:
- issue: Ἰακώβου వల్ల సూచితమైన యూదా–యాకోబు సంబంధం
  choice: ప్రధాన పాఠ్యంలో ‘యాకోబు కుమారుడైన యూదా’
  alternative: ‘యాకోబు సోదరుడైన యూదా’; లేదా అక్షరార్థంగా ‘యాకోబుకు చెందిన యూదా’
  rationale: గ్రీకు పాఠ్యం ‘యాకోబు యొక్క యూదా’ అనే సంక్షిప్త రూపాన్నే ఇస్తుంది; బంధాన్ని నిర్దిష్టంగా చెప్పదు. జాబితాలో సహజమైన తెలుగుకోసం ‘కుమారుడు’ను ప్రధాన పాఠ్యంలో సరఫరా చేసి, సాధ్యమైన ‘సోదరుడు’ అర్థాన్ని పాదసూచికలో నమోదు చేశాం; తద్వారా సంప్రదాయం ఆధారంగా సందిగ్ధతను సిద్ధాంతపరంగా తీర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. ‘ద్రోహిగా మారాడు’ అనే రూపం మూలంలోని ἐγένετο యొక్క మార్పు భావాన్ని నిలుపుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత పేరుకు వెంటనే ఉంచబడింది.
