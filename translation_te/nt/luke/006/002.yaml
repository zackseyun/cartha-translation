id: LUK.6.2
reference: Luke 6:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τινὲς δὲ τῶν Φαρισαίων ⸀εἶπαν· Τί ποιεῖτε ὃ οὐκ ⸀ἔξεστιν τοῖς σάββασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/002.yaml
  text: But some of the Pharisees said[a], “Why are you doing what is not lawful on the Sabbaths?”
translation:
  language: te
  text: అయితే పరిసయ్యుల్లో కొందరు, “విశ్రాంతి దినాన చేయడానికి అనుమతి లేనిది మీరు ఎందుకు చేస్తున్నారు?” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς
  choice: కొందరు
  rationale: పరిసయ్యులందరినీ కాక, వారిలో ఒక వర్గాన్ని సూచించే అనిర్దిష్ట బహువచనాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వాక్యంలోని చర్యకు ప్రతిస్పందనగా వచ్చే స్వల్ప వ్యతిరేకతను, కథన మలుపును తెలియజేస్తుంది.
- source_word: τῶν Φαρισαίων
  choice: పరిసయ్యుల్లో
  rationale: యూదుల ఈ వర్గానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణను వాడుతూ, τινὲς‌తో ఉన్న విభక్తి సంబంధాన్ని ‘వారిలో కొందరు’ అనే భావంతో చూపిస్తుంది.
- source_word: εἶπαν
  choice: అని అడిగారు
  rationale: మూలంలో సాధారణంగా ‘అన్నారు’ అనే క్రియ ఉన్నప్పటికీ, దాని వెంట ప్రత్యక్ష ప్రశ్న ఉంది; తెలుగులో ‘అని అడిగారు’ అనడం సహజంగా ఉండి మాటల కార్యాన్ని సరిగ్గా తెలియజేస్తుంది.
- source_word: Τί ποιεῖτε
  choice: మీరెందుకు చేస్తున్నారు?
  rationale: Τί అక్షరార్థంగా ‘ఏమి’ అయినా, ఇక్కడ చర్యను సవాలు చేసే ప్రశ్నలో ‘ఎందుకు’ అనే భావం సహజమైనది; వర్తమాన క్రియ కొనసాగుతున్న తక్షణ చర్యను సూచిస్తుంది.
- source_word: ὃ οὐκ ἔξεστιν
  choice: చేయడానికి అనుమతి లేని పనిని
  rationale: నిషేధించబడిన లేదా అనుమతించబడని చర్య అనే న్యాయ-మతపరమైన భావాన్ని, మూలంలో లేని నిర్దిష్ట ధర్మశాస్త్ర వివరణను చేర్చకుండా తెలియజేస్తుంది.
- source_word: τοῖς σάββασιν
  choice: విశ్రాంతి దినాన
  rationale: గ్రీకులో బహువచనం ఉన్నా అది వారపు విశ్రాంతి దినాన్ని సూచించే సాధారణ నుడికారం; తెలుగులో ఏకవచనం సహజంగా తక్షణ సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది. బహువచన రూపం పాదసూచికలో నమోదు చేయబడింది.
theological_decisions:
- issue: విశ్రాంతి దినాన్ని సూచించే బహువచన గ్రీకు నుడికారం
  choice: ప్రధాన పాఠ్యంలో ‘విశ్రాంతి దినాన’ అనే సహజ ఏకవచనం
  alternative: ‘విశ్రాంతి దినాల్లో’ అనే రూపపరమైన బహువచనం
  rationale: τοῖς σάββασιν వ్యాకరణపరంగా బహువచనమైనా, వారపు విశ్రాంతి దినాన్ని సూచించే సాధారణ గ్రీకు నుడికారం. తెలుగు పాఠ్యంలో ఏకవచనం ఉద్దేశిత భావాన్ని సహజంగా అందిస్తుంది; మూల రూపం పాదసూచికలో పారదర్శకంగా ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘పరిసయ్యులు,’ ‘విశ్రాంతి దినం’ అనే విస్తృతంగా అర్థమయ్యే పదాలు వాడబడ్డాయి. ప్రశ్నలోని ఆరోపణ స్వరం నిలుపబడింది; ఏ ప్రత్యేక మతశాఖ వ్యాఖ్యానమూ చేర్చబడలేదు.
