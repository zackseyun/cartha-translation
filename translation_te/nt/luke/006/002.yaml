review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents ‘some of the Pharisees,’ the challenging force of Τί ποιεῖτε as ‘why are you doing,’ the prohibition/permission sense of οὐκ ἔξεστιν, and the idiomatic singular Sabbath sense. However, εἶπαν is ‘said,’ not specifically ‘asked.’ Since the direct question itself already conveys the speech act, ‘అన్నారు’ is both natural and closer to the aorist verb.
  naturalness: The Telugu is clear, modern, and suitably restrained. Recasting the object as ‘చేయడానికి అనుమతి లేనిది’ avoids adding the noun ‘పని’ while preserving a natural Telugu accusation.
  terminology: ‘పరిసయ్యులు’ is an appropriate established transliteration. ‘విశ్రాంతి దినం’ is understandable modern Telugu for Sabbath; the footnote appropriately records the Greek plural idiom without imposing an interpretation.
  issues:
  - severity: low
    issue: ‘అని అడిగారు’ narrows εἶπαν (‘they said’) to ‘they asked.’
    rationale: Although a question naturally functions as a question, the Greek uses the general speech verb εἶπαν. Rendering it ‘అన్నారు’ preserves the source wording and leaves the question’s force in the quoted words.
  - severity: low
    issue: ‘పనిని’ is an unnecessary supplied noun for ὃ.
    rationale: The neuter relative refers broadly to what they were doing. ‘చేయడానికి అనుమతి లేనిది’ retains this breadth without materially changing the sense.
  revised_text: అయితే పరిసయ్యుల్లో కొందరు, “విశ్రాంతి దినాన చేయడానికి అనుమతి లేనిది మీరు ఎందుకు చేస్తున్నారు?” అన్నారు.
  revised_footnotes:
