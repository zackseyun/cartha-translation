  source_fidelity: 'ప్రధాన పాఠం ἐπλήσθησαν ἀνοίας ను ‘విచక్షణలేని ఆగ్రహంతో నిండిపోయి’గా సందర్భానుగుణంగా వ్యక్తపరుస్తుంది: ἀνοίαలోని వివేకరాహిత్యాన్ని కాపాడుతూ, ఈ శత్రుత్వ సందర్భంలో కనిపించే ఉగ్రతను సహజంగా తెలియజేస్తుంది. τί ἂν ποιήσαιεν లోని అనిశ్చిత/సంప్రదింపుల భావాన్ని ‘ఏమి చేయాలా అని’ సరిగ్గా ప్రతిబింబిస్తుంది; ‘యేసుకు’ మూలంలోని దత్తివిభక్తి అస్పష్టతను అలాగే ఉంచుతుంది.'
