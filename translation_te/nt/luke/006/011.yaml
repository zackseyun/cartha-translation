source:
  edition: SBLGNT
  text: αὐτοὶ δὲ ἐπλήσθησαν ἀνοίας, καὶ διελάλουν πρὸς ἀλλήλους τί ἂν ποιήσαιεν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/011.yaml
  text: But they were filled with rage[a], and they discussed with one another what they might do to Jesus.
translation:
  language: te
  text: అయితే వారు విచక్షణలేని ఆగ్రహంతో నిండిపోయి,[a] యేసుకు ఏమి చేయాలా అని ఒకరితో ఒకరు చర్చించుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఉన్మాదంతో నిండిపోయి,” లేదా “మూర్ఖత్వంతో నిండిపోయి.” గ్రీకు పదం వివేకరాహిత్యాన్ని, మూర్ఖత్వాన్ని, లేదా అదుపు తప్పిన బుద్ధిహీన స్థితిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: అయితే వారు
  rationale: δὲ ముందరి స్వస్థపరిచే కార్యానికి వీరి ప్రతిస్పందనను వ్యతిరేకంగా చూపుతుంది. αὐτοὶ లోని ఉద్ఘాటన తెలుగులో సందర్భం మరియు ‘అయితే’ ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: ἐπλήσθησαν ἀνοίας
  choice: విచక్షణలేని ఆగ్రహంతో నిండిపోయి
  rationale: ‘నిండిపోయారు’ అనే గ్రీకు రూపకాన్ని నిలుపుతూ, ἄνοια లోని బుద్ధిహీనత/వివేకరాహిత్య భావాన్ని మరియు ఈ సందర్భంలోని ఉగ్ర ప్రతిస్పందనను కలిపి తెలియజేస్తుంది. పదానికి ఉన్న విస్తృతిని పాదసూచికలో సూచించాం.
- source_word: διελάλουν πρὸς ἀλλήλους
  choice: ఒకరితో ఒకరు చర్చించుకున్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం పరస్పరంగా సాగిన సంప్రదింపును సూచిస్తుంది; ఈ తెలుగు ప్రయోగం ఆధునికంగా, సహజంగా ఉంది.
- source_word: τί ἂν ποιήσαιεν
  choice: ఏమి చేయాలా అని
  rationale: ἄν తో కూడిన optative పరోక్ష deliberationను సూచిస్తుంది. ‘ఏమి చేయాలా’ అనేది నిర్ణయానికి రాని ఆలోచనను సహజ తెలుగులో తెలియజేస్తుంది; బాధ్యత లేదా సామర్థ్యాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: τῷ Ἰησοῦ
  choice: యేసుకు
  rationale: ποιέω తో వచ్చిన దత్తివిభక్తిని నేరుగా ‘యేసుకు ఏమి చేయాలి’గా ఉంచడం మూలంలోని అనిశ్చితిని కాపాడుతుంది; ‘యేసుకు వ్యతిరేకంగా’ అని శత్రుత్వాన్ని మరింత స్పష్టీకరించలేదు.
theological_decisions:
- issue: ἀνοίας ను మానసిక వ్యాధిని సూచించేలా అనువదించాలా, లేక వివేకరహితమైన ఉగ్రతగా చూపాలా
  choice: విచక్షణలేని ఆగ్రహం
  alternative: ఉన్మాదం; మూర్ఖత్వం
  rationale: ఈ సందర్భంలో వారి ప్రతిస్పందన భావోద్వేగపూరితమైనదీ వివేకరహితమైనదీ. ‘ఉన్మాదం’ ఆధునిక వైద్యార్థాన్ని అనవసరంగా రప్పించవచ్చు; ‘మూర్ఖత్వం’ భావోద్వేగ తీవ్రతను తగ్గించవచ్చు. ప్రధాన పాఠం సందర్భార్థాన్ని ఇస్తూ, ఇతర నిజమైన అర్థసాధ్యతలను పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘విచక్షణలేని’ సాధారణ పాఠకులకు అర్థమయ్యేలా ἄνοια లోని వివేకరాహిత్యాన్ని వ్యక్తం చేస్తుంది; పాదసూచిక దాని అసలైన పదార్థ పరిధిని కాపాడుతుంది.
