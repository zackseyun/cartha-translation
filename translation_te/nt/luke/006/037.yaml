id: LUK.6.37
reference: Luke 6:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ μὴ κρίνετε, καὶ οὐ μὴ κριθῆτε· ⸀καὶ μὴ καταδικάζετε, καὶ οὐ μὴ καταδικασθῆτε. ἀπολύετε, καὶ ἀπολυθήσεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/037.yaml
  text: And do not judge[a], and you will certainly not be judged; and do not condemn, and you will certainly not be condemned. Forgive, and you will be forgiven.
translation:
  language: te
  text: “తీర్పు తీర్చకండి, అప్పుడు మీకు ఎట్టి పరిస్థితుల్లోనూ తీర్పు తీర్చబడదు. దోషులుగా తీర్పు చెప్పకండి, అప్పుడు మీరు ఎట్టి పరిస్థితుల్లోనూ దోషులుగా తీర్పు పొందరు. విడుదల చేయండి[a], అప్పుడు మీరు విడుదల చేయబడతారు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్షమించండి; అప్పుడు మీరు క్షమించబడతారు.” గ్రీకు క్రియకు ‘విడుదల చేయడం,’ ‘విడిచిపెట్టడం’ అనే అర్థాలు ఉన్నాయి; ఈ సందర్భంలో దాన్ని ‘క్షమించడం’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνετε
  choice: తీర్పు తీర్చకండి
  rationale: κρίνω యొక్క సాధారణ న్యాయనిర్ణయ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, తరువాతి బలమైన καταδικάζωతో ఉన్న అర్థభేదాన్ని నిలుపుతుంది.
- source_word: οὐ μὴ κριθῆτε
  choice: మీకు అసలే తీర్పు తీర్చబడదు
  rationale: οὐ μή అనే బలమైన నిరాకరణను ‘అసలే ... కాదు’ ద్వారా వ్యక్తం చేసి, కర్మణి రూపాన్ని నిలుపుతుంది.
- source_word: καταδικάζετε
  choice: దోషులుగా తీర్పు చెప్పకండి
  rationale: καταδικάζω అనేది కేవలం తీర్పు చేయడం కంటే బలంగా, దోషిగా నిర్ధారించడం లేదా ఖండించడం అనే భావం కలిగివుంది; ఈ అనువాదం ఆ అర్థతీవ్రతను స్పష్టం చేస్తుంది.
- source_word: οὐ μὴ καταδικασθῆτε
  choice: మీరు అసలే దోషులుగా తీర్పు పొందరు
  rationale: బలమైన నిరాకరణను, అలాగే దోషిగా నిర్ధారించబడే కర్మణి భావాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: ἀπολύετε
  choice: విడుదల చేయండి
  rationale: ἀπολύω యొక్క విస్తృతమైన ‘విడిచిపెట్టు, విడుదల చేయు’ భావాన్ని నిలుపుతూ, సందర్భానుసారమైన ‘క్షమించండి’ అనే సంకుచిత అర్థాన్ని ప్రధాన పాఠ్యంలో తప్పనిసరిగా నిర్ధారించదు.
- source_word: ἀπολυθήσεσθε
  choice: మీరు విడుదల చేయబడతారు
  rationale: మూలంలోని ἀπολύετε/ἀπολυθήσεσθε పదసంబంధాన్ని, పరస్పరతను నిలుపుతుంది.
- source_word: καὶ
  choice: అప్పుడు
  rationale: గ్రీకులో καὶ సమన్వయార్థకమైనా, ఆజ్ఞ తరువాత వచ్చే ఫలితసంబంధాన్ని తెలుగులో సహజంగా చూపడానికి ‘అప్పుడు’ ఉపయోగించబడింది; వాక్యాల సమాంతర నిర్మాణం అలాగే ఉంటుంది.
theological_decisions:
- issue: ἀπολύετεను ‘క్షమించండి’ అని సంకుచితంగా అనువదించాలా, ‘విడుదల చేయండి’ అని విస్తృతంగా అనువదించాలా
  choice: ప్రధాన పాఠ్యంలో ‘విడుదల చేయండి’
  alternative: ‘క్షమించండి’ లేదా ‘విడిచిపెట్టండి’
  rationale: తీర్పు తీర్చడం, దోషిగా నిర్ధారించడం అనే సమీప సందర్భంలో ఈ క్రియ విడుదల చేయడం లేదా ఒకరిపై ఉన్న హక్కుదావాను విడిచిపెట్టడం అనే విస్తృత భావాన్ని కలిగి ఉండవచ్చు. ‘క్షమించండి’ సందర్భోచితమైన సాధ్యార్థమే అయినా, మూలంలోని నిజమైన అర్థవిస్తృతిని ప్రధాన పాఠ్యంలో సంకుచితం చేయకుండా పాదసూచికలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవబహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. ‘తీర్పు తీర్చడం’ మరియు ‘దోషులుగా తీర్పు చెప్పడం’ మధ్య మూలంలోని అర్థతీవ్రత పెరుగుదల కాపాడబడింది. οὐ μή యొక్క గట్టి నిరాకరణను ‘అసలే’ తెలియజేస్తుంది.
