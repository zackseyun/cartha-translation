id: LUK.6.31
reference: Luke 6:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ καθὼς θέλετε ἵνα ποιῶσιν ὑμῖν οἱ ⸀ἄνθρωποι, ποιεῖτε αὐτοῖς ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/031.yaml
  text: And just as you want people to do for you[a], do the same for them.
translation:
  language: te
  text: మీకు ఇతరులు ఎలా చేయాలని మీరు కోరుకుంటారో, మీరు కూడా వారికి అలాగే చేయండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: ఎలా ... అలాగే
  rationale: ఇది పోలికకు ప్రమాణాన్ని సూచిస్తుంది. తెలుగు సహసంబంధ నిర్మాణమైన ‘ఎలా ... అలాగే’ మూలంలోని తులనాత్మక భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: θέλετε
  choice: మీరు కోరుకుంటారో
  rationale: ఇక్కడ θέλω సాధారణ కోరిక లేదా అభిలాషను సూచిస్తుంది. ‘కోరుకుంటారు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: ἵνα ποιῶσιν ὑμῖν
  choice: మీకు ఏమి చేయాలని
  rationale: θέλετε తరువాతి ἵνα వాక్యభాగం కోరుకున్న కార్యాన్ని తెలియజేస్తుంది. ‘ఏమి చేయాలని’ అనే నిర్మాణం ఆ భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: οἱ ἄνθρωποι
  choice: ఇతరులు
  rationale: ఈ సందర్భంలో పదం పురుషులకు మాత్రమే కాక సాధారణంగా ఇతర మనుషులకు వర్తిస్తుంది. ‘ఇతరులు’ పరస్పర సంబంధాన్ని స్పష్టంగా, లింగనిరపేక్షంగా తెలియజేస్తుంది.
- source_word: ποιεῖτε
  choice: చేయండి
  rationale: వర్తమాన ఆజ్ఞారూపం నిరంతర నైతిక ఆచరణను ఆదేశిస్తుంది. తెలుగు ఆజ్ఞారూపమైన ‘చేయండి’ ఆ ఆదేశాన్ని సహజంగా అందిస్తుంది; క్రియాస్వరూపాన్ని అతిగా విప్పదు.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: ὑμῖν (‘మీకు’)తో ఉన్న సమాంతరతను నిలుపుతూ ‘వారికి’ పరస్పర దిశను వ్యక్తపరుస్తుంది.
- source_word: ὁμοίως
  choice: అలాగే
  rationale: ఇది అనురూపమైన చర్యను సూచిస్తుంది. ‘అలాగే’ ముందున్న ‘ఎలా’తో కలిసి మూలంలోని పోలిక నిర్మాణాన్ని సహజంగా పూర్తిచేస్తుంది.
theological_decisions:
- issue: οἱ ἄνθρωποι యొక్క సాధారణ మానవ సూచన
  choice: ఇతరులు
  alternative: మనుషులు
  rationale: గ్రీకు పదం ఇక్కడ పురుషులకు మాత్రమే పరిమితం కాదు; సాధారణంగా ఎదుటివారిని సూచిస్తుంది. ‘ఇతరులు’ లింగపరమైన పరిమితిని కల్పించకుండా వాక్యంలోని పరస్పర నైతిక భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. ‘ఎలా ... అలాగే’ నిర్మాణం మూలంలోని పోలికను నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
