revisions:
- from: ఇతరులు మీకు ఏమి చేయాలని మీరు కోరుకుంటారో, మీరు కూడా వారికి అలాగే చేయండి.
  to: మీకు ఇతరులు ఎలా చేయాలని మీరు కోరుకుంటారో, మీరు కూడా వారికి అలాగే చేయండి.
  rationale: The revision supplies “ఎలా ... అలాగే” to represent καθὼς and ὁμοίως as a clear Telugu correlative construction. It preserves the broad, reciprocal sense of “do,” the generic reference to other people, and the imperative force, without adding interpretive content.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:23:38Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the reciprocal ethical command and the generic sense of οἱ ἄνθρωποι. However, it does not explicitly represent the comparative force of καθὼς (“just as/how”), which is central to the sentence structure. The initial καὶ is a light connective and need not be rendered mechanically in idiomatic Telugu.
  naturalness: 'The wording is clear and modern, but adding the Telugu correlative comparison makes the sentence more complete and idiomatic: “మీకు ఇతరులు ఎలా చేయాలని మీరు కోరుకుంటారో ... అలాగే చేయండి.”'
  terminology: “ఇతరులు” is an appropriate gender-inclusive contextual rendering of οἱ ἄνθρωποι. “చేయండి” suitably retains the broad repeated sense of ποιέω, without narrowing it to “treat.”
  issues:
  - severity: medium
    issue: The comparative marker καθὼς is not explicit in the draft text.
    rationale: The draft has “అలాగే” in the second clause but lacks a corresponding “ఎలా/ఎలాగైతే” in the first clause. The Greek sets the desired action of others as the standard for one’s own action; Telugu should express this correlative comparison overtly.
  revised_text: మీకు ఇతరులు ఎలా చేయాలని మీరు కోరుకుంటారో, మీరు కూడా వారికి అలాగే చేయండి.
  revised_footnotes: []
  revision_rationale: The revision supplies “ఎలా ... అలాగే” to represent καθὼς and ὁμοίως as a clear Telugu correlative construction. It preserves the broad, reciprocal sense of “do,” the generic reference to other people, and the imperative force, without adding interpretive content.
