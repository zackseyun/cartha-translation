id: LUK.6.46
reference: Luke 6:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τί δέ με καλεῖτε· Κύριε κύριε, καὶ οὐ ποιεῖτε ἃ λέγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/046.yaml
  text: Why do you call me[a], ‘Lord, Lord,’ and not do what I say?
translation:
  language: te
  text: “మీరు నన్ను ‘ప్రభువా, ప్రభువా’[a] అని పిలుస్తారు గానీ, నేను చెప్పేది ఎందుకు చేయరు?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “యజమానీ, యజమానీ.” గ్రీకులో: “క్యూరియే, క్యూరియే.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: ఎందుకు
  rationale: ఇక్కడ τί కారణాన్ని ప్రశ్నించే క్రియావిశేషణ భావంలో ఉంది; గద్దింపు ధ్వనిని సహజంగా వ్యక్తం చేయడానికి ‘ఎందుకు’ సరైనది.
- source_word: δέ
  choice: —
  rationale: δέ స్వల్ప అనుసంధాన పదం. తెలుగు వాక్యప్రవాహంలో ప్రత్యేక పదం లేకుండానే దాని సందర్భసంబంధం స్పష్టంగా ఉంటుంది.
- source_word: με
  choice: నన్ను
  rationale: καλεῖτε క్రియకు ప్రత్యక్ష కర్మ; తెలుగులో సహజమైన ద్వితీయా విభక్తి రూపం.
- source_word: καλεῖτε
  choice: పిలుస్తూ
  rationale: వర్తమానకాల బహువచన క్రియ. తరువాతి క్రియతో ఉన్న విరుద్ధతను తెలుగులో సహజంగా కలపడానికి ‘పిలుస్తూ’ అని అనువదించబడింది.
- source_word: Κύριε κύριε
  choice: ప్రభువా, ప్రభువా
  rationale: సంబోధనను, పునరుక్తి ద్వారా వచ్చే గాఢతను కాపాడుతుంది. κύριος కు ‘ప్రభువు’ ప్రధాన సమానార్థకం.
- source_word: καὶ οὐ
  choice: … ఎందుకు చేయరు?
  rationale: గ్రీకు సమన్వయంలోని విరుద్ధ భావాన్ని తెలుగు ప్రశ్న నిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ποιεῖτε
  choice: చేయరు
  rationale: యేసు చెప్పినదాన్ని ఆచరించడం లేదా పాటించడం అనే భావాన్ని సరళంగా, నేరుగా తెలియజేస్తుంది.
- source_word: ἃ
  choice: చెప్పేవాటిని
  rationale: నపుంసక బహువచన సంబంధసర్వనామ భావాన్ని తెలుగులో సహజమైన బహువచన సమాహార రూపంతో కాపాడుతుంది.
- source_word: λέγω
  choice: నేను చెప్పే
  rationale: మూలంలోని సరళమైన ‘నేను చెబుతున్నది’ అనే భావాన్ని అదనపు వివరణ లేకుండా అందిస్తుంది.
theological_decisions:
- issue: κύριος అనే క్రీస్తుసంబంధ బిరుదు అనువాదం
  choice: ప్రభువు
  alternative: యజమాని / గురువు
  rationale: ఈ సందర్భంలో యేసును నేరుగా సంబోధించే κύριος గౌరవాన్నీ, క్రీస్తుసంబంధ బరువునీ కలిగి ఉంది. ‘ప్రభువు’ ఆ రెండింటినీ నిలుపుతుంది; ఇతర అర్థసంభావ్యతను పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన శైలి. ‘ప్రభువా’ అనే సంప్రదాయబద్ధమైన, విస్తృతంగా అర్థమయ్యే సంబోధనను నిలిపి, వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా ఉండేలా నిర్మించాం.
