review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the rhetorical question, the repeated vocative «Κύριε κύριε», and the contrast between addressing Jesus as Lord and failing to do what he says. However, «పిలుస్తూ» (“while calling”) slightly recasts the Greek coordinate construction as a subordinate, ongoing action.
  naturalness: The proposed revision uses a more natural Telugu contrastive construction, «పిలుస్తారు గానీ … చేయరు», and «నేను చెప్పేది» idiomatically expresses “what I say” without an unnecessarily literal plural form.
  terminology: «ప్రభువా, ప్రభువా» appropriately preserves the vocative repetition and the established rendering of κύριος as “Lord.” The alternative «యజమానీ» is suitably retained in the footnote without displacing the main rendering.
  issues:
  - severity: low
    issue: The participial form «పిలుస్తూ» weakens the Greek’s direct contrast.
    rationale: 'καλεῖτε … καὶ οὐ ποιεῖτε presents two coordinated present actions: “you call … and do not do.” In Telugu, «పిలుస్తారు గానీ … చేయరు» retains the rebuking contrast more directly and naturally.'
  - severity: low
    issue: «నేను చెప్పేవాటిని» is less idiomatic than necessary.
    rationale: Although ἃ is formally neuter plural, Telugu naturally uses the collective relative expression «నేను చెప్పేది» for “what I say.” This preserves the sense without wooden pluralization.
  revised_text: “మీరు నన్ను ‘ప్రభువా, ప్రభువా’[a] అని పిలుస్తారు గానీ, నేను చెప్పేది ఎందుకు చేయరు?”
  revised_footnotes:
  - marker: a
    text: 'లేదా “యజమానీ, యజమానీ.” గ్రీకులో: “క్యూరియే, క్యూరియే.”'
    reason: lexical_alternative
