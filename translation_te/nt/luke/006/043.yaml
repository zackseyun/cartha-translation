id: LUK.6.43
reference: Luke 6:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐ γάρ ἐστιν δένδρον καλὸν ποιοῦν καρπὸν σαπρόν, οὐδὲ ⸀πάλιν δένδρον σαπρὸν ποιοῦν καρπὸν καλόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/043.yaml
  text: For there is no good tree producing rotten fruit, nor again a rotten tree producing good fruit.
translation:
  language: te
  text: ఎందుకంటే మంచి చెట్టు కుళ్లిన పండును కాయదు; అలాగే కుళ్లిన చెట్టు మంచి పండును కాయదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కుళ్లిన పండు,’ ‘కుళ్లిన చెట్టు’ అనే చోట్ల ‘చెడ్డ పండు,’ ‘చెడ్డ చెట్టు’ అని కూడా అనువదించవచ్చు. గ్రీకు σαπρός పదానికి కుళ్లినది, చెడిపోయినది, లేదా చెడ్డది అనే అర్థాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γάρ ἐστιν
  choice: ఎందుకంటే ... లేదు
  rationale: γάρ ముందున్న బోధకు వివరణాత్మక సంబంధాన్ని చూపుతుంది; ‘ఎందుకంటే’ దాన్ని సహజమైన తెలుగులో నిలుపుతుంది. Οὐ ... ἐστιν ఉనికిని నిరాకరించే ‘లేదు’గా అనువదించబడింది.
- source_word: δένδρον
  choice: చెట్టు
  rationale: ఇక్కడ పండ్లు కాసే చెట్టును సూచించే సాధారణ అర్థమే సందర్భానికి సరిపోతుంది.
- source_word: καλόν
  choice: మంచి
  rationale: καλός అనే పదంలోని మంచి, మేలైన, ఆరోగ్యకరమైన అనే భావాలకు ‘మంచి’ సహజమైన సమానార్థకం; వ్యవసాయ చిత్రాన్నీ నైతిక సూచననూ అతిగా వివరించకుండా ఉంచుతుంది.
- source_word: ποιοῦν καρπὸν
  choice: పండును కాసే
  rationale: పండ్ల సందర్భంలో ποιέω + καρπός అనే నిర్మాణానికి ‘పండును కాసే’ సహజమైన తెలుగు; గ్రీకు వర్తమాన కృదంత భావాన్ని సంబంధవాచక నిర్మాణంలో నిలుపుతుంది.
- source_word: σαπρόν
  choice: కుళ్లిన
  rationale: σαπρός యొక్క చెడిపోయిన లేదా కుళ్లిన అనే సాక్షాత్తు వ్యవసాయ చిత్రాన్ని ‘కుళ్లిన’ స్పష్టంగా నిలుపుతుంది; ‘చెడ్డ’ అనే విస్తృత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: οὐδὲ πάλιν
  choice: అలాగే ... లేదు
  rationale: οὐδέ రెండవ నిరాకరణను మొదటిదానికి జతచేస్తుంది; πάλιν ఇక్కడ ప్రతిగా లేదా మరోవైపు అనే సమాంతర భావాన్ని ఇస్తుంది. ‘అలాగే’ తెలుగులో విరుద్ధ సమాంతరాన్ని సహజంగా చూపుతుంది.
- source_word: δένδρον σαπρὸν
  choice: కుళ్లిన చెట్టు
  rationale: మొదటి భాగంలోని σαπρόνతో పదసామ్యాన్ని కాపాడి, చెట్టు అంతర్గతంగా చెడిపోయినదనే సజీవ చిత్రాన్ని నిలుపుతుంది.
- source_word: καρπὸν καλόν
  choice: మంచి పండు
  rationale: మొదటి భాగానికి విరుద్ధ సమాంతరాన్ని కాపాడే సరళమైన, సహజమైన అనువాదం.
theological_decisions:
- issue: వ్యవసాయ రూపకం మరియు నైతిక భావం మధ్య తీవ్రత
  choice: σαπρόςను రెండు చోట్లా ‘కుళ్లిన’గా అనువదించడం
  alternative: ‘చెడ్డ పండు’ / ‘చెడ్డ చెట్టు’
  rationale: మూలంలోని స్పష్టమైన వ్యవసాయ చిత్రాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని నైతిక అన్వయాన్ని అనువాదంలోనే ముందుగా నిర్ణయించలేదు. అయితే పదానికి ఉన్న విస్తృతమైన ‘చెడ్డ’ భావాన్ని పాదసూచికలో పేర్కొన్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన సామెతసదృశ శైలి వాడబడింది. ‘పండును కాసే’ అనేది తెలుగు వ్యవసాయ వాడుకకు సహజమైనది; రెండు భాగాల విరుద్ధ సమాంతర నిర్మాణం కాపాడబడింది.
