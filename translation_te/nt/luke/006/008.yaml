id: LUK.6.8
reference: Luke 6:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: αὐτὸς δὲ ᾔδει τοὺς διαλογισμοὺς αὐτῶν, ⸂εἶπεν δὲ⸃ τῷ ⸀ἀνδρὶ τῷ ξηρὰν ἔχοντι τὴν χεῖρα· ⸀Ἔγειρε καὶ στῆθι εἰς τὸ μέσον· ⸀καὶ ἀναστὰς ἔστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/008.yaml
  text: But he knew their thoughts[a], and he said to the man who had the withered hand[c][b], “Get up and stand in the middle.” And he got up and stood there.
translation:
  language: te
  text: కానీ ఆయన వారి ఆలోచనలను తెలుసుకొని, చేయి వాడిపోయిన ఆ మనిషితో, “లేచి, మధ్యలో[c] నిలబడు” అన్నాడు. అతడు లేచి నిలబడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: గ్రీకులో “మధ్యలోకి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: ఎరిగి
  rationale: οἶδα యొక్క ఈ రూపం ఇక్కడ వర్తమానార్థంతో ‘తెలుసు’ అని సూచిస్తుంది. కథన ప్రవాహంలో ‘ఎరిగి’ యేసుకు వారి అంతరంగ ఆలోచనలు తెలిసినట్లు సహజంగా తెలియజేస్తుంది; అవి ఆయనకు ఎలా తెలిసాయో మాత్రం వివరించదు.
- source_word: διαλογισμοὺς
  choice: ఆలోచనలు
  rationale: ఈ పదానికి ఆలోచనలు, తర్కాలు, అంతరంగ యోచనలు అనే అర్థపరిధి ఉంది. ‘ఆలోచనలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, సందర్భం చెప్పేదానికంటే ఉద్దేశాన్ని ఎక్కువగా నిర్దిష్టం చేయదు.
- source_word: ἀνδρὶ
  choice: మనిషితో
  rationale: ἀνήρ ఇక్కడ వయోజన పురుషుణ్ణి సూచిస్తుంది. తెలుగు సందర్భంలో ‘ఆ మనిషితో’ సహజంగా, మూలంలోని పురుష సూచనను నిలుపుతుంది.
- source_word: ξηρὰν ... τὴν χεῖρα
  choice: చెయ్యి వాడిపోయిన
  rationale: శరీర భాగానికి వాడిన ξηρός ఎండిపోయిన, వాడిపోయిన స్థితిని సూచిస్తుంది. ‘చెయ్యి వాడిపోయిన’ అనేది మూలంలోని చిత్రణను కాపాడుతూ, నిర్దిష్ట వైద్య నిర్ధారణను చేర్చకుండా సహజంగా ఉంటుంది.
- source_word: Ἔγειρε
  choice: లేచి
  rationale: ఈ ఆజ్ఞ ఉన్న చోటు నుంచి లేవమని చెబుతుంది. తరువాతి στῆθι నుండి దీనిని వేరుగా ఉంచడానికి ‘లేచి’ అని అనువదించబడింది.
- source_word: στῆθι
  choice: నిలబడు
  rationale: στῆθι నిలబడమనే ప్రత్యేక ఆజ్ఞ. ‘లేచి, ... నిలబడు’ అనే రెండు చర్యలతో మూలంలోని రెండు ఆజ్ఞలు నిలుస్తాయి.
- source_word: εἰς τὸ μέσον
  choice: మధ్యలో
  rationale: సమూహం మధ్యన ఉన్న బహిరంగ స్థానాన్ని ఈ పదబంధం సూచిస్తుంది. ‘మధ్యలో’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: ἀναστὰς ἔστη
  choice: అతడు లేచి నిలబడ్డాడు
  rationale: కృదంతం, ప్రధాన క్రియ కలిసి వరుసగా జరిగిన రెండు చర్యలను తెలియజేస్తాయి. ఈ అనువాదం వాటిని ఒకే చర్యగా కుదించకుండా రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: ఇతరుల అంతరంగ ఆలోచనలు యేసుకు తెలియడం
  choice: వారి ఆలోచనలు ఆయన ఎరిగినట్లు నేరుగా చెప్పడం
  alternative: ఆయన వారి ఉద్దేశాలను గ్రహించాడు; లేదా అతీంద్రియ జ్ఞానంతో వారి తర్కాలను తెలుసుకున్నాడు
  rationale: వారి ఆలోచనలు యేసుకు తెలుసని వాక్యం చెబుతుంది; అవి ఎలా తెలుసో చెప్పదు. అందువల్ల జ్ఞానానికి గల విధానాన్ని లేదా ఉద్దేశాల స్వభావాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘చెయ్యి వాడిపోయిన’ అనే రూపం నిర్దిష్ట వైద్య వ్యాఖ్యానాన్ని చేర్చకుండా మూలంలోని రూపకాత్మక-శారీరక వర్ణనను నిలుపుతుంది. ఆజ్ఞలోని ‘లేచి’ మరియు ‘నిలబడు’ అనే రెండు చర్యలను, అలాగే ప్రతిస్పందనలోని రెండు చర్యలను విడిగా కాపాడాం.
