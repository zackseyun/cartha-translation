id: LUK.6.17
reference: Luke 6:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ καταβὰς μετ’ αὐτῶν ἔστη ἐπὶ τόπου πεδινοῦ, καὶ ὄχλος ⸀πολὺς μαθητῶν αὐτοῦ, καὶ πλῆθος πολὺ τοῦ λαοῦ ἀπὸ πάσης τῆς Ἰουδαίας καὶ Ἰερουσαλὴμ καὶ τῆς παραλίου Τύρου καὶ Σιδῶνος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/017.yaml
  text: And coming down with them[a], he stood on a level place, with a large crowd of his disciples and a great multitude of the people from all Judea and Jerusalem and the coastal region of Tyre and Sidon,
translation:
  language: te
  text: ఆయన వారితో కలిసి కిందికి దిగి, సమతలమైన చోట[a] నిలబడ్డాడు. అక్కడ ఆయన శిష్యుల పెద్ద గుంపూ, యూదయ అంతటినుండి, యెరూషలేము నుండి, తూరు, సీదోను తీరప్రాంతం నుండి వచ్చిన ప్రజల గొప్ప సమూహమూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక మైదానంలో.” గ్రీకు పదబంధానికి అక్షరార్థం “సమతలమైన చోట.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβὰς μετ’ αὐτῶν
  choice: వారితో కలిసి కిందికి దిగి
  rationale: అయోరిస్ట్ కృదంతం ప్రధాన క్రియకు ముందు జరిగిన దిగివచ్చే కదలికను సూచిస్తుంది; ‘కిందికి దిగి’ దిశాభావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἔστη
  choice: నిలబడ్డాడు
  rationale: ἵστημι యొక్క అయోరిస్ట్ రూపం ఇక్కడ నిలుచున్న స్థితిని స్వీకరించడాన్ని సూచిస్తుంది; ‘నిలబడ్డాడు’ సరళమైన సహజ అనువాదం.
- source_word: ἐπὶ τόπου πεδινοῦ
  choice: సమతలమైన ఒక చోట
  rationale: τόπος అంటే ‘చోటు’; πεδινός అంటే ‘సమతలమైన/చదునైన’. విస్తారమైన మైదానమని అతిగా నిర్ధారించకుండా గ్రీకు పదబంధాన్ని పారదర్శకంగా అందిస్తుంది.
- source_word: ὄχλος πολὺς μαθητῶν αὐτοῦ
  choice: ఆయన శిష్యుల పెద్ద గుంపు
  rationale: ὄχλος అంటే గుంపు; πολὺς దాని పెద్ద పరిమాణాన్ని తెలియజేస్తుంది; షష్ఠీ విభక్తి ఆ గుంపు ఆయన శిష్యులతో ఏర్పడిందని సూచిస్తుంది.
- source_word: πλῆθος πολὺ τοῦ λαοῦ
  choice: ప్రజల గొప్ప సమూహం
  rationale: πλῆθος పెద్ద సంఖ్య లేదా సమూహాన్ని నొక్కిచెబుతుంది; λαός‌ను ‘ప్రజలు’గా అనువదించడం శిష్యులకంటే విస్తృతమైన జనసముదాయాన్ని సూచిస్తుంది.
- source_word: ἀπὸ πάσης τῆς Ἰουδαίας
  choice: యూదయ అంతటినుంచి
  rationale: πάσης ప్రాంతమంతటినీ సూచిస్తుంది; ఈ తెలుగు రూపం సమగ్రతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ἰερουσαλήμ
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన ప్రదేశనామ రూపం.
- source_word: τῆς παραλίου Τύρου καὶ Σιδῶνος
  choice: తూరు సీదోనుల తీరప్రాంతం
  rationale: παράλιος సముద్రతీరాన ఉన్న ప్రాంతాన్ని సూచిస్తుంది; తూరు, సీదోనులతో సంబంధమున్న తీరప్రాంతం అనే భౌగోళిక భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: ప్రసంగ స్థలానికి సంబంధించిన భౌగోళిక వర్ణన
  choice: సమతలమైన ఒక చోట
  alternative: ఒక మైదానంలో
  rationale: మత్తయి వర్ణనతో సమన్వయపరచడానికో, విరోధాన్ని సృష్టించడానికో ప్రయత్నించకుండా గ్రీకు పదబంధం చెప్పినంతనే అనువదిస్తుంది. ‘సమతలమైన ఒక చోట’ అనేది విస్తారమైన మైదానమని అనవసరంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. శిష్యుల గుంపు మరియు విస్తృత ప్రజాసమూహం మధ్య మూలపాఠంలోని భేదం నిలుపబడింది.
