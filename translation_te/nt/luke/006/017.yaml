  revised_text: ఆయన వారితో కలిసి కిందికి దిగి, సమతలమైన చోట[a] నిలబడ్డాడు. అక్కడ ఆయన శిష్యుల పెద్ద గుంపూ, యూదయ అంతటినుండి, యెరూషలేము నుండి, తూరు, సీదోను తీరప్రాంతం నుండి వచ్చిన ప్రజల గొప్ప సమూహమూ ఉన్నారు.
