  terminology: ‘అంజూరపు పండ్లు,’ ‘ద్రాక్షపండ్లు,’ ‘ముళ్ల మొక్కలు,’ and ‘ముళ్ల పొద’ are understandable, suitably nontechnical choices. ‘దాని సొంత పండును బట్టే’ adequately conveys the emphatic ἰδίου.
