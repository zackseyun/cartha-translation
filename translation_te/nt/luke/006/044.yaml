id: LUK.6.44
reference: Luke 6:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἕκαστον γὰρ δένδρον ἐκ τοῦ ἰδίου καρποῦ γινώσκεται· οὐ γὰρ ἐξ ἀκανθῶν συλλέγουσιν σῦκα, οὐδὲ ἐκ βάτου ⸂σταφυλὴν τρυγῶσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/044.yaml
  text: For each tree is known by its own fruit[a]. For they do not gather figs from thorns[b], nor do they harvest grapes from a bramble bush.
translation:
  language: te
  text: ఎందుకంటే ప్రతి చెట్టూ దాని సొంత పండును బట్టే గుర్తించబడుతుంది. ముళ్ల మొక్కల నుండి అంజూరపు పండ్లను ఏరరు; ముళ్ల పొద నుండి ద్రాక్షపండ్లను కోయరు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕκαστον ... δένδρον
  choice: ప్రతి చెట్టూ
  rationale: ἕκαστον యొక్క పంపిణీ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంతో ఉన్న వివరణాత్మక సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది; రెండో γάρను పునరుక్తి చేయకుండా దాని తార్కిక బలం మొత్తం వాక్యంలో కొనసాగుతుంది.
- source_word: ἐκ τοῦ ἰδίου καρποῦ
  choice: దాని సొంత పండును బట్టే
  rationale: ἐκ యొక్క ఆధార భావాన్ని ‘బట్టి’ ద్వారా, ἰδίου యొక్క స్వకీయ నొక్కును ‘సొంత’ ద్వారా వ్యక్తం చేస్తుంది.
- source_word: γινώσκεται
  choice: గుర్తించబడుతుంది
  rationale: వర్తమాన కర్మణి రూపంలోని సాధారణ, లక్షణాత్మక గుర్తింపును నిలుపుతుంది.
- source_word: ἀκανθῶν
  choice: ముళ్ల మొక్కల నుండి
  rationale: ఈ బహువచన పదం ముళ్లు గల మొక్కలను విస్తృతంగా సూచిస్తుంది; కేవలం విడి ముళ్లు అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: συλλέγουσιν
  choice: ఏరరు
  rationale: పండ్లను సేకరించే చర్యకు సహజమైన తెలుగు క్రియ.
- source_word: σῦκα
  choice: అంజూరపు పండ్లను
  rationale: సాధారణంగా గుర్తించదగిన తెలుగు వృక్షఫల నామం.
- source_word: βάτου
  choice: ముళ్ల పొద నుండి
  rationale: βάτος సూచించే ముళ్లతో కూడిన పొదను జాతిని అతిగా నిర్దిష్టం చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: σταφυλήν
  choice: ద్రాక్షపండ్లను
  rationale: గ్రీకులో ఏకవచన రూపం ఉన్నా, సామాన్య/సమూహ భావాన్ని సహజ తెలుగు బహువచనంతో అందిస్తుంది.
- source_word: τρυγῶσιν
  choice: కోయరు
  rationale: పండిన ద్రాక్షను పంటగా కోసే ప్రత్యేక వ్యవసాయ భావాన్ని, συλλέγουσιν‌కు వాడిన ‘ఏరరు’తో భేదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పండు రూపకం యొక్క నైతిక అన్వయం
  choice: వ్యవసాయ సామెతను ఉన్నట్టుగా ఉంచి, ‘పండు’ను స్వభావం లేదా క్రియలుగా అనువాదంలో విప్పి చెప్పలేదు.
  alternative: ‘మనిషి క్రియలు’ లేదా ‘స్వభావం’ అని వివరణాత్మకంగా విస్తరించడం.
  rationale: మూలవాక్యం రూపకాన్ని మాత్రమే చెబుతుంది; దాని సందర్భానుగత నైతిక అన్వయాన్ని పాఠకుడికి తెరిచి ఉంచడం మూలంలోని వాక్చాతుర్యాన్నీ theological tension‌నూ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామెతసదృశమైన సంక్షిప్తత, గౌరవప్రదమైన సరళత. మూలంలోని రెండు సేకరణ క్రియల భేదాన్ని ‘ఏరరు/కోయరు’తో నిలిపాం. పాఠ్యంలో ఫుట్‌నోట్లు లేనందున గుర్తులు అవసరం లేదు.
