id: LUK.6.22
reference: Luke 6:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μακάριοί ἐστε ὅταν μισήσωσιν ὑμᾶς οἱ ἄνθρωποι, καὶ ὅταν ἀφορίσωσιν ὑμᾶς καὶ ὀνειδίσωσιν καὶ ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρὸν ἕνεκα τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/022.yaml
  text: Blessed are you when people hate you[a], and when they exclude you and insult you and reject your name as evil because of the Son of Man.
translation:
  language: te
  text: మనుషులు మిమ్మల్ని ద్వేషించినప్పుడు, వారు మిమ్మల్ని వెలివేసి దూషించి, మనుష్యకుమారుని నిమిత్తం మీ పేరును చెడ్డదిగా తోసిపుచ్చినప్పుడు[a] మీరు ధన్యులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మీ పేరును చెడ్డదిగా తోసిపుచ్చడం’ అంటే మిమ్మల్ని చెడ్డవారిగా భావిస్తూ బహిరంగంగా నిందించడం లేదా సమాజంలో నిరాకరించడం కావచ్చు.
    reason: ఈ గ్రీకు ప్రయోగం వ్యక్తి పేరు లేదా ప్రతిష్ఠను బహిరంగంగా తిరస్కరించడాన్ని సూచిస్తుంది; దాని ఖచ్చితమైన సామాజిక రూపం కొంత అస్పష్టంగా ఉంది.
lexical_decisions:
- source_word: Μακάριοί
  choice: ధన్యులు
  rationale: తెలుగు బైబిలు ధన్యతా వాక్యాల గంభీరతను, దైవానుగ్రహంతో కూడిన స్థితిని సహజంగా నిలుపుతుంది; ‘సంతోషవంతులు’ అనేది భావోద్వేగానికే పరిమితమయ్యే అవకాశం ఉంది.
- source_word: ὅταν
  choice: అప్పుడు / -ినప్పుడు
  rationale: అనిర్దిష్టంగా సంభవించే పరిస్థితిని సహజ తెలుగు కాలవాచక నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: μισήσωσιν
  choice: ద్వేషించినప్పుడు
  rationale: శత్రుత్వం, తీవ్రమైన అయిష్టత అనే మూలార్థాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: οἱ ἄνθρωποι
  choice: మనుషులు
  rationale: ఇక్కడ పురుషులను మాత్రమే కాక సాధారణంగా ప్రజలను సూచించే సమష్టి అర్థాన్ని ఇస్తుంది.
- source_word: ἀφορίσωσιν
  choice: వెలివేసి
  rationale: సామాజిక లేదా సమూహ సహవాసం నుంచి దూరం చేయడం అనే సందర్భార్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ὀνειδίσωσιν
  choice: అవమానించి
  rationale: నిందించడం లేదా దూషించడం ద్వారా కలిగించే బహిరంగ అవమానాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκβάλωσιν τὸ ὄνομα ὑμῶν
  choice: మీ పేరును ... తిరస్కరించినప్పుడు
  rationale: అక్షరార్థమైన ‘మీ పేరును బయటికి విసిరివేయడం’ తెలుగులో అసహజం. పేరు లేదా ప్రతిష్ఠను అంగీకరించకుండా బహిరంగంగా తోసిపుచ్చే భావాన్ని ఇది తెలియజేస్తూ, ‘పేరు’ అనే మూలచిత్రాన్ని నిలుపుతుంది.
- source_word: ὡς πονηρὸν
  choice: చెడ్డదని
  rationale: వారి పేరును నైతికంగా చెడ్డదిగా పరిగణించడాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἕνεκα
  choice: కారణంగా
  rationale: హింసకు కారణం లేదా హేతువును స్పష్టంగా సూచిస్తుంది.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: సువార్తల్లో యేసు ఉపయోగించే స్థిరమైన బిరుదును, దాని అంతర్గ్రంథ సంబంధాలను కాపాడుతుంది.
theological_decisions:
- issue: ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρόν అనే ప్రయోగం
  choice: ‘మీ పేరును చెడ్డదని తిరస్కరించినప్పుడు’ అని ప్రధాన పాఠ్యంలో ఇవ్వడం
  alternative: ‘మీ పేరును చెడ్డదిగా బయటికి విసిరివేసినప్పుడు’ లేదా ‘మిమ్మల్ని చెడ్డవారిగా బహిరంగంగా నిరాకరించినప్పుడు’
  rationale: మూలంలోని ‘పేరు’ను నిలుపుతూ, తెలుగులో అసహజమైన అక్షరానువాదాన్ని నివారిస్తుంది. ఇది వ్యక్తిని, అతని పేరును లేదా ప్రతిష్ఠను బహిరంగంగా తోసిపుచ్చడం అనే సాధ్యమైన భావాలను పూర్తిగా ఒకే అర్థానికి కుదించదు.
- issue: οἱ ἄνθρωποι యొక్క సాధారణ మానవ సూచన
  choice: ‘మనుషులు’
  alternative: ‘ప్రజలు’ లేదా ‘మనుష్యులు’
  rationale: ఇది పురుషులకు మాత్రమే పరిమితం కాని సాధారణ సూచన; ‘మనుషులు’ ఆధునిక ప్రమాణ తెలుగులో సహజం.
- issue: τοῦ υἱοῦ τοῦ ἀνθρώπου అనే బిరుదు
  choice: ‘మనుష్యకుమారుడు’
  alternative: ‘మానవ కుమారుడు’
  rationale: తెలుగు క్రైస్తవ వాడుకలో స్థిరపడిన బిరుదును, సువార్తల మరియు దానియేలు గ్రంథ సంబంధ ప్రతిధ్వనిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగులో గంభీరమైన ధన్యతా వాక్య శైలిని ఉపయోగించాం. ‘ధన్యులు’ మరియు ‘మనుష్యకుమారుడు’ వంటి స్థిరమైన బైబిలు పదాలను నిలిపి, మిగిలిన వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా ఉండేలా నిర్మించాం.
