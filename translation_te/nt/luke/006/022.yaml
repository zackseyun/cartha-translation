review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys all principal Greek elements: beatitude, hatred, exclusion, verbal reproach, repudiation of the disciples’ name as evil, and the cause being the Son of Man. A small revision better represents ὀνειδίσωσιν as verbal abuse and makes ἕνεκα more idiomatic and unambiguous in Telugu.'
  naturalness: The sentence is broadly understandable, but ‘అవమానించి’ is less specifically verbal than the Greek, and ‘మనుష్యకుమారుని కారణంగా’ can sound slightly less idiomatic than the established causal expression ‘మనుష్యకుమారుని నిమిత్తం.’ Moving the footnote anchor to the idiom it explains also improves readability.
  terminology: ‘ధన్యులు’ appropriately retains the beatitude register. ‘మనుష్యకుమారుడు’ is the established Telugu Gospel title for the Son of Man and should be retained. ‘వెలివేసి’ accurately expresses social exclusion; ‘దూషించి’ better matches reproach/reviling.
  issues:
  - severity: low
    issue: ‘అవమానించి’ is somewhat broader than ὀνειδίσωσιν.
    rationale: The Greek verb specifically concerns reproach or abusive speech. ‘దూషించి’ is a natural modern Telugu equivalent that preserves this verbal force.
  - severity: low
    issue: The causal phrase ‘మనుష్యకుమారుని కారణంగా’ is less idiomatic and can be slightly opaque.
    rationale: ‘మనుష్యకుమారుని నిమిత్తం’ naturally conveys ἕνεκα, ‘on account of/for the sake of the Son of Man,’ in the established biblical register.
  - severity: low
    issue: The footnote marker follows the whole sentence rather than the disputed idiom it explains.
    rationale: Placing it immediately after ‘మీ పేరును చెడ్డదిగా తోసిపుచ్చినప్పుడు’ clearly anchors the note to ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρόν.
