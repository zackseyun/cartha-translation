revisions:
- from: మనుషులు మిమ్మల్ని ద్వేషించినప్పుడు, మిమ్మల్ని వెలివేసి అవమానించి, మనుష్యకుమారుని కారణంగా మీ పేరును చెడ్డదని తిరస్కరించినప్పుడు మీరు ధన్యులు.[a]
  to: మనుషులు మిమ్మల్ని ద్వేషించినప్పుడు, వారు మిమ్మల్ని వెలివేసి దూషించి, మనుష్యకుమారుని నిమిత్తం మీ పేరును చెడ్డదిగా తోసిపుచ్చినప్పుడు[a] మీరు ధన్యులు.
  rationale: 'The revision retains the Greek sequence and ambiguity while using more precise, natural Telugu: ‘దూషించి’ preserves the verbal reproach, ‘నిమిత్తం’ clearly conveys causation on account of the Son of Man, and ‘తోసిపుచ్చినప్పుడు’ maintains the concrete ‘name’ expression without an unnatural literalism. The footnote remains restrained and is anchored directly to the idiom.'
  reviewer_model: gpt-5.6-terra
