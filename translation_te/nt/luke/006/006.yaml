translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని కొనసాగుతున్న బోధనా చర్యను ‘బోధిస్తూ ఉన్నాడు’గా నిలిపి, ξηράకు వైద్య నిర్ధారణను చేర్చకుండా దాని రూపక వర్ణనను కాపాడింది.
