source:
  edition: SBLGNT
  text: Ἐγένετο ⸀δὲ ἐν ἑτέρῳ σαββάτῳ εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν καὶ διδάσκειν· καὶ ἦν ⸂ἄνθρωπος ἐκεῖ⸃ καὶ ἡ χεὶρ αὐτοῦ ἡ δεξιὰ ἦν ξηρά·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/006.yaml
  text: It happened on another Sabbath that he entered the synagogue and was teaching[a]. And a man was there whose right hand was withered.
translation:
  language: te
  text: మరో విశ్రాంతి దినాన ఆయన సమాజమందిరంలోకి వెళ్లి బోధిస్తూ ఉన్నాడు. అక్కడ కుడిచెయ్యి ఎండిపోయిన[a] ఒక మనిషి ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వాడిపోయిన.’ గ్రీకు విశేషణం ఎండిపోయిన లేదా వాడిపోయిన దానిని వర్ణించగలదు; ఇక్కడ అది ఆ మనిషి కుడిచెయ్యి బలహీనమైన లేదా పనికిరాని స్థితిలో ఉందని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: మరో విశ్రాంతి దినాన
  rationale: ఇది లూకా వాడే కథన మార్పు ప్రయోగం. తెలుగులో ‘జరిగిందేమిటంటే’ అని యాంత్రికంగా చేర్చకుండా, తరువాతి కాలసూచనతో సహజంగా కొత్త సంఘటనను ప్రారంభించడం దాని కథన విధిని నిలుపుతుంది.
- source_word: ἐν ἑτέρῳ σαββάτῳ
  choice: మరో విశ్రాంతి దినాన
  rationale: ἕτερος ఇక్కడ అదే రకమైన మరొక సందర్భాన్ని సూచిస్తుంది. ‘మరో విశ్రాంతి దినాన’ సహజమైన ఆధునిక తెలుగు.
- source_word: εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν
  choice: ఆయన సమాజమందిరంలోకి వెళ్లి
  rationale: ἐγένετο తరువాతి గ్రీకు infinitive నిర్మాణాన్ని తెలుగులో సహజమైన సమాపక క్రియారూపంగా మార్చింది. ‘సమాజమందిరం’ యూదుల συναγωγήను స్పష్టంగా సూచిస్తుంది.
- source_word: καὶ διδάσκειν
  choice: బోధిస్తూ ఉన్నాడు
  rationale: వర్తమాన infinitive యొక్క కొనసాగుతున్న క్రియా స్వభావాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: ἄνθρωπος ἐκεῖ
  choice: అక్కడ ... ఒక మనిషి ఉన్నాడు
  rationale: వ్యక్తి పురుషుడని మూలంలోని masculine noun సూచిస్తున్నందున ‘మనిషి’ వాడబడింది; existential clause తెలుగులో సహజ క్రమంలో అమర్చబడింది.
- source_word: ἡ χεὶρ αὐτοῦ ἡ δεξιὰ
  choice: కుడిచెయ్యి
  rationale: గ్రీకు పదబంధం ప్రత్యేకంగా అతని కుడి చేతినే సూచిస్తుంది. తెలుగు సంబంధార్థ నిర్మాణంలో ఇది ‘కుడిచెయ్యి ... ఒక మనిషి’గా సహజంగా వ్యక్తమవుతుంది.
- source_word: ξηρά
  choice: వాడిపోయిన
  rationale: ఈ విశేషణం ఎండిపోయిన లేదా వాడిపోయిన స్థితిని సూచిస్తుంది; ఈ స్వస్థత సందర్భంలో పనికిరాని స్థితిలో ఉన్న చేతిని సహజంగా వర్ణించడానికి ‘వాడిపోయిన’ అనుకూలం. ‘పక్షవాతం వచ్చిన’ అని అనడం మూలం చెప్పనిదాన్ని నిర్దిష్టం చేస్తుంది.
