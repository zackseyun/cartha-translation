id: LUK.6.7
reference: Luke 6:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀παρετηροῦντο ⸀δὲ οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι εἰ ἐν τῷ σαββάτῳ ⸀θεραπεύει, ἵνα εὕρωσιν ⸀κατηγορεῖν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/007.yaml
  text: And the scribes and the Pharisees were watching him closely to see whether he would heal on the Sabbath[b][a], so that they might find grounds to accuse him.
translation:
  language: te
  text: శాస్త్రులు, పరిసయ్యులు ఆయన సబ్బాతు రోజున స్వస్థపరుస్తాడో లేదో అని ఆయనను నిశితంగా గమనిస్తూ ఉన్నారు[a]. ఆయనపై ఆరోపణ చేయడానికి ఆధారం కనుగొనాలనే ఉద్దేశంతో వారు అలా చేశారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనను జాగ్రత్తగా గమనిస్తూ ఉన్నారు.’ గ్రీకు క్రియ నిశితమైన, సందర్భానుసారం విరోధభావంతో కూడిన గమనింపును సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆయనపై ఆరోపణ చేయడానికి అవకాశం కనుగొనాలని’ లేదా, ‘ఆయనను ఆరోపించాలని.’ గ్రీకు పదబంధం ఆయనపై ఆరోపణ చేయడానికి ఆధారం లేదా అవకాశాన్ని వెదకడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετηροῦντο
  choice: ఆయనను నిశితంగా గమనిస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న పరిశీలనను సూచిస్తుంది; సందర్భంలోని అనుమానపూరితమైన, విరోధపూరితమైన నిశిత దృష్టిని ‘నిశితంగా’ తెలియజేస్తుంది. గ్రీకులో కర్మ స్పష్టంగా లేకపోయినా, సందర్భానుసారం ‘ఆయనను’ అంటే యేసును చేర్చడం తెలుగులో సహజం.
- source_word: γραμματεῖς
  choice: శాస్త్రులు
  rationale: సువార్తల సందర్భంలో ధర్మశాస్త్ర నిపుణులను సూచించే, తెలుగులో స్థిరపడిన సంక్షిప్త పదం.
- source_word: Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: ఈ మతసమూహానికి తెలుగులో ప్రామాణికంగా వాడే పేరును ఉపయోగించింది.
- source_word: εἰ
  choice: స్వస్థపరుస్తాడేమో అని
  rationale: గమనించడం అనే క్రియ తర్వాత వచ్చే పరోక్ష ప్రశ్నను ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తూ, ‘whether’ అనే అనిశ్చిత భావాన్ని కాపాడుతుంది.
- source_word: ἐν τῷ σαββάτῳ
  choice: విశ్రాంతి రోజున
  rationale: యూదుల ప్రత్యేక సబ్బాతు దినాన్ని ordinary readersకు అర్థమయ్యే విధంగా ‘విశ్రాంతి రోజు’గా తెలిపింది; ఏకవచన కాలసూచనను నిలిపింది.
- source_word: θεραπεύει
  choice: స్వస్థపరుస్తాడేమో
  rationale: పరోక్ష ప్రశ్నలోని గ్రీకు వర్తమానాన్ని కథన దృష్టికోణానికి తగిన భవిష్యత్ సంభావ్యతగా తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἵνα εὕρωσιν
  choice: ఏదైనా ఆధారం దొరుకుతుందేమో అన్నదే వారి ఉద్దేశం
  rationale: ἵνα యొక్క ఉద్దేశార్థాన్ని స్పష్టంగా తెలుపుతుంది. ‘దొరుకుతుందేమో’ అనేది వెదికి కనుగొనాలనే భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: κατηγορεῖν αὐτοῦ
  choice: ఆయనపై నేరం మోపడానికి
  rationale: అతనికి వ్యతిరేకంగా ఆరోపణ చేయడం అనే న్యాయపరమైన భావాన్ని సహజంగా తెలియజేస్తుంది; ‘ఆధారం’తో కలిపి εὕρωσιν యొక్క భావాన్ని పూర్తి చేస్తుంది.
theological_decisions:
- issue: వ్యతిరేకుల ఉద్దేశ చిత్రణ
  choice: వారు యేసును నిశితంగా గమనించడం ఆయనపై నేరం మోపేందుకు ఆధారం వెదికే ఉద్దేశంతోనని స్పష్టంగా అనువదించడం.
  alternative: వారు ఆయన స్వస్థపరుస్తాడో లేదో కేవలం గమనించారని తటస్థంగా చెప్పడం.
  rationale: παρετηροῦντο అనే క్రియతో పాటు ἵνα εὕρωσιν κατηγορεῖν αὐτοῦ అనే ఉద్దేశ వాక్యం వారి గమనిక తటస్థమైనది కాదని చూపుతుంది. అయితే మూలపాఠం చెప్పినదానికంటే విస్తృతమైన దురుద్దేశాన్ని ఆపాదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గంభీరమైన కథన శైలిలో రూపొందించబడింది. ‘శాస్త్రులు’, ‘పరిసయ్యులు’, ‘స్వస్థపరచడం’ వంటి సువార్తా సందర్భంలో స్థిరపడిన పదాలను నిలిపి, క్లిష్టమైన గ్రీకు ఉద్దేశ నిర్మాణాన్ని సహజమైన రెండు తెలుగు వాక్యాలుగా విభజించింది.
