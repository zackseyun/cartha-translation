- from: శాస్త్రులు, పరిసయ్యులు ఆయన విశ్రాంతి రోజున స్వస్థపరుస్తాడేమో అని ఆయనను నిశితంగా గమనిస్తూ ఉన్నారు[a]. ఆయనపై నేరం మోపడానికి ఏదైనా ఆధారం దొరుకుతుందేమో అన్నదే వారి ఉద్దేశం[b].
  to: శాస్త్రులు, పరిసయ్యులు ఆయన సబ్బాతు రోజున స్వస్థపరుస్తాడో లేదో అని ఆయనను నిశితంగా గమనిస్తూ ఉన్నారు[a]. ఆయనపై ఆరోపణ చేయడానికి ఆధారం కనుగొనాలనే ఉద్దేశంతో వారు అలా చేశారు[b].
  rationale: సబ్బాతును ప్రత్యేక దిననామంగా పునరుద్ధరించాను; ‘నేరం మోపడం’ స్థానంలో మూలపాఠానికి తటస్థమైన ‘ఆరోపణ చేయడం’ వాడాను; అలాగే ἵνα εὕρωσιν లోని ఉద్దేశపూర్వక అన్వేషణను ‘ఆధారం కనుగొనాలనే ఉద్దేశంతో’ అని స్పష్టపరిచాను. నిశిత, సంభావ్య విరోధభావంతో కూడిన గమనింపు మరియు గ్రీకులోని అసంపూర్ణ భూతకాల భావం నిలిపి ఉంచబడ్డాయి.
