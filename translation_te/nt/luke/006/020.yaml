id: LUK.6.20
reference: Luke 6:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τοὺς μαθητὰς αὐτοῦ ἔλεγεν· Μακάριοι οἱ πτωχοί, ὅτι ὑμετέρα ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/020.yaml
  text: 'And he[a], lifting up his eyes toward his disciples, was saying: “Blessed are the poor[b], because yours is the kingdom of God.”'
translation:
  language: te
  text: 'తన శిష్యులవైపు కళ్లెత్తి చూసి ఆయన ఇలా చెప్పాడు: “పేదవారైన మీరు ధన్యులు[a][b]; ఎందుకంటే దేవుని రాజ్యం మీది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత రూపానుసారంగా, “పేదవారు ధన్యులు.” గ్రీకులో ఈ మాట మూడవ పురుష రూపంలో ఉంది; అయితే తరువాతి “మీది” అనే మాట ఇది శిష్యులకు చేసిన ప్రత్యక్ష సంబోధన అని చూపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లూకా ఇక్కడ “పేదవారు” అని మాత్రమే చెబుతున్నాడు; “ఆత్మలో పేదవారు” అని కాదు (మత్తయి 5:3తో పోల్చండి).
    reason: cross_reference
lexical_decisions:
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: కన్నులెత్తి చూస్తూ
  rationale: గ్రీకు ప్రయోగంలోని చూపును పైకెత్తి శిష్యులవైపు మళ్లించే స్పష్టమైన దృశ్యాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: εἰς τοὺς μαθητὰς αὐτοῦ
  choice: తన శిష్యులవైపు
  rationale: εἰς ఇక్కడ చూపు వెళ్లే దిశను సూచిస్తుంది; ‘వైపు’ ఆ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἔλεγεν
  choice: ఇలా చెబుతున్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం ప్రసంగాన్ని పరిచయం చేసే కొనసాగుతున్న క్రియాభావాన్ని కలిగిస్తుంది; తెలుగు కథనంలో ‘చెబుతున్నాడు’ దానిని సులభంగా నిలుపుతుంది.
- source_word: Μακάριοι
  choice: ధన్యులు
  rationale: బీటిట్యూడ్ సందర్భంలో దైవానుగ్రహం పొందిన శుభస్థితిని సూచించే స్థిరమైన, గౌరవప్రదమైన తెలుగు పదం; ‘సంతోషవంతులు’ కేవలం భావోద్వేగాన్ని సూచించే ప్రమాదం ఉంది.
- source_word: οἱ πτωχοί
  choice: పేదవారైన మీరు
  rationale: οἱ πτωχοί రూపపరంగా ‘పేదవారు’ అయినా, వెంటనే వచ్చే ὑμετέρα ప్రత్యక్ష సంబోధనను స్పష్టం చేస్తుంది. ఈ అనువాదం పేదరికాన్ని ఆత్మసంబంధమైనదిగా విస్తరించకుండా, ప్రత్యక్ష సంబోధనను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ధన్యస్థితికి కారణాన్ని పరిచయం చేసే స్పష్టమైన కారణార్థక అనుసంధానం.
- source_word: ὑμετέρα ἐστὶν
  choice: మీది
  rationale: ప్రత్యక్ష సంబోధనలోని బలమైన స్వామ్య భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: βασιλεία పదంలోని రాజ్యము/పరిపాలన భావపరిధిని అనవసరంగా కుదించకుండా నిలిపే ప్రామాణిక తెలుగు ప్రయోగం.
theological_decisions:
- issue: πτωχοίని భౌతిక/సామాజిక పేదరికంగా ఉంచాలా, లేక ‘ఆత్మలో పేదవారు’ అని విస్తరించాలా
  choice: పేదవారైన మీరు
  alternative: ఆత్మలో పేదవారైన మీరు
  rationale: లూకా వచనంలో πτωχοί మాత్రమే ఉంది; మత్తయి 5:3లోని విస్తరణను ఇక్కడ చేర్చకూడదు. అందువల్ల లూకా ఉంచిన భావతీవ్రత, అస్పష్టత యథాతథంగా ఉంటాయి.
- issue: మూడవ పురుష రూపమైన οἱ πτωχοίని ‘పేదవారు’ అని ఉంచాలా, లేక ప్రత్యక్ష సంబోధనగా అనువదించాలా
  choice: పేదవారైన మీరు ధన్యులు
  alternative: పేదవారు ధన్యులు
  rationale: οἱ πτωχοί వ్యాకరణపరంగా మూడవ పురుష రూపంలో ఉన్నప్పటికీ, ὑμετέρα (‘మీది’) శిష్యులను నేరుగా ఉద్దేశిస్తున్నట్టు నిర్ధారిస్తుంది. తెలుగు వాక్యంలో ప్రత్యక్ష సంబోధన సహజంగా ఉండేందుకు ‘మీరు’ చేర్చబడింది; రూపపరమైన ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘పేదవారు’ అనే నిరాడంబర పదాన్ని ఉంచి, ‘ఆత్మలో పేదవారు’ వంటి సమన్వయాత్మక వివరణను చేర్చలేదు. ప్రధాన వాక్యంలో ప్రత్యక్ష సంబోధన స్పష్టత కోసం ‘పేదవారైన మీరు’ వాడి, గ్రీకు మూడవ పురుష రూపాన్ని పాదసూచికలో నమోదు చేశాం.
