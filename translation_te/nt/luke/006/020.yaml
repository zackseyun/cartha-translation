- from: 'ఆయన తన శిష్యులవైపు కన్నులెత్తి చూస్తూ ఇలా చెబుతున్నాడు: “పేదవారైన మీరు ధన్యులు[a]; ఎందుకంటే దేవుని రాజ్యం మీది.”'
  to: 'తన శిష్యులవైపు కళ్లెత్తి చూసి ఆయన ఇలా చెప్పాడు: “పేదవారైన మీరు ధన్యులు[a][b]; ఎందుకంటే దేవుని రాజ్యం మీది.”'
