id: LUK.6.45
reference: Luke 6:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ τῆς καρδίας ⸀αὐτοῦ προφέρει τὸ ἀγαθόν, καὶ ὁ ⸀πονηρὸς ἐκ τοῦ ⸀πονηροῦ προφέρει τὸ πονηρόν· ἐκ γὰρ ⸀περισσεύματος καρδίας λαλεῖ τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/045.yaml
  text: The good man brings forth what is good out of the good treasure of his heart[a], and the evil man out of his evil treasure brings forth what is evil; for out of the overflow of the heart his mouth speaks.
translation:
  language: te
  text: మంచి మనిషి తన హృదయంలోని మంచి నిధి నుండి మంచిని బయటికి తెస్తాడు; చెడ్డ మనిషి తన చెడ్డ నిధి నుండి చెడును బయటికి తెస్తాడు. ఎందుకంటే హృదయం నుండి పొంగిపొర్లే దాని నుండే అతని నోరు మాట్లాడుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హృదయం యొక్క సమృద్ధి నుండే అతని నోరు మాట్లాడుతుంది.”
    reason: περισσεύματος అనే పదానికి ‘పొంగిపొర్లే దాని’తో పాటు ‘సమృద్ధి’ అనే పదార్థ ప్రత్యామ్నాయం సాధ్యమని చూపుతుంది.
lexical_decisions:
- source_word: ἀγαθὸς ἄνθρωπος
  choice: మంచి మనిషి
  rationale: వ్యక్తిని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం; ἀγαθός లోని నైతిక భావాన్ని నిలుపుతుంది.
- source_word: θησαυροῦ
  choice: నిధి
  rationale: హృదయంలో నిల్వచేయబడిన అంతర్గత సంపద అనే రూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: καρδίας
  choice: హృదయం
  rationale: మనిషి అంతరంగం, సంకల్పం, భావాలకు సూచనగా ఉన్న మూల రూపకాన్ని కాపాడుతుంది.
- source_word: προφέρει
  choice: బయటికి తెస్తాడు
  rationale: అంతర్గత నిల్వ నుండి ఏదో వెలువడుతుందనే గ్రీకు క్రియలోని భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πονηρὸς / πονηροῦ / πονηρόν
  choice: చెడ్డ / చెడు
  rationale: నైతిక వ్యతిరేకతను స్పష్టంగా ఉంచుతూ, ఆధునిక తెలుగులో సహజంగా వినిపిస్తుంది.
- source_word: περισσεύματος
  choice: పొంగిపొర్లుతున్న దాని
  rationale: అధికంగా నిండినది బయటికి ప్రవహిస్తుందనే περισσεύματος చిత్రాన్ని సజీవంగా తెలియజేస్తుంది.
- source_word: λαλεῖ
  choice: పలుకుతుంది
  rationale: సామెతసదృశమైన గంభీరతను నిలుపుతూ నోరుతో సహజంగా అన్వయిస్తుంది.
- source_word: τὸ στόμα αὐτοῦ
  choice: అతని నోరు
  rationale: హృదయంలో ఉన్నది బాహ్యంగా వ్యక్తమవుతుందనే మూలపాఠంలోని స్పష్టమైన శరీర రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ἀγαθός మరియు πονηρός మధ్య నైతిక వ్యత్యాసం
  choice: మంచి / చెడ్డ / చెడు అనే నైతిక వర్గాలను నిలుపడం
  alternative: మేలైన / హానికరమైన లేదా ఆరోగ్యకరమైన / చెడైన
  rationale: ఈ వాక్యం కేవలం ఉపయోగకరత గురించి కాక, వ్యక్తి నైతిక స్వభావం మరియు దాని బాహ్య వ్యక్తీకరణ గురించి చెబుతుంది.
- issue: హృదయం మరియు మాటల మధ్య సంబంధం
  choice: నోరు హృదయంలో పొంగిపొర్లుతున్న దానినే పలుకుతుందని రూపకాత్మకంగా అనువదించడం
  alternative: మనసులో ఎక్కువగా ఉన్నదే మాటల్లో బయటపడుతుంది
  rationale: వివరణాత్మక భావానువాదానికి వెళ్లకుండా καρδία, περίσσευμα, στόμα అనే మూల రూపకాలను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. ‘నిధి’, ‘హృదయం’, ‘నోరు’ అనే మూల రూపకాలను నిలిపి, వాక్యాన్ని తెలుగు ప్రవాహానికి అనుగుణంగా రెండు సమాంతర వాక్యాలుగా అమర్చాం.
