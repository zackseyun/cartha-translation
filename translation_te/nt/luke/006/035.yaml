id: LUK.6.35
reference: Luke 6:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πλὴν ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν καὶ ἀγαθοποιεῖτε καὶ δανίζετε μηδὲν ἀπελπίζοντες· καὶ ἔσται ὁ μισθὸς ὑμῶν πολύς, καὶ ἔσεσθε υἱοὶ Ὑψίστου, ὅτι αὐτὸς χρηστός ἐστιν ἐπὶ τοὺς ἀχαρίστους καὶ πονηρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/035.yaml
  text: But love your enemies[a], and do good, and lend, expecting nothing in return; and your reward will be great, and you will be sons of the Most High[b], because he is kind to the ungrateful and evil.
translation:
  language: te
  text: అయితే మీ శత్రువులను ప్రేమించండి, మేలు చేయండి, తిరిగి ఏమీ వస్తుందని ఆశించకుండా[a] అప్పుగా ఇవ్వండి. అప్పుడు మీ ప్రతిఫలం గొప్పగా ఉంటుంది; మీరు సర్వోన్నతుని కుమారులుగా ఉంటారు[b]. ఎందుకంటే ఆయన కృతజ్ఞతలేనివారిపట్ల, దుష్టులపట్ల దయగా ఉంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“తిరిగి ఏమీ వస్తుందని ఆశించకుండా” అని అనువదించిన గ్రీకు పదబంధం క్లిష్టమైనది. తక్కువ సంభావ్యతగల మరో అర్థం: “ఎవరి విషయంలోనూ నిరాశ చెందకుండా” లేదా “ఎన్నడూ ఆశ కోల్పోకుండా.” ఈ సందర్భంలో అది అప్పు తిరిగి చెల్లించబడుతుందని లేదా ఏదైనా ప్రతిఫలం వస్తుందని ఆశించకపోవడాన్ని సూచిస్తున్నట్లు తీసుకోబడింది.'
    reason: lexical_alternative
  - marker: b
    text: “కుమారులు” అనేది గ్రీకులోని పుంలింగ బహువచన పదానికి అనువాదం; ఇక్కడ అది ప్రతినిధ్యార్థాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: అయితే
  rationale: మునుపటి పరస్పర ప్రయోజన ధోరణికి భిన్నమైన బలమైన వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν
  choice: మీ శత్రువులను ప్రేమించండి
  rationale: ఆజ్ఞ యొక్క నేరుతనాన్ని, ‘శత్రువులు’ అనే పదంలోని తీవ్రతను తగ్గించకుండా నిలుపుతుంది.
- source_word: ἀγαθοποιεῖτε
  choice: మేలు చేయండి
  rationale: క్రియాశీలంగా మంచిని చేయాలనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δανίζετε
  choice: అప్పుగా ఇవ్వండి
  rationale: డబ్బు అని మూలంలో లేని వివరాన్ని చేర్చకుండా, అప్పివ్వడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: μηδὲν ἀπελπίζοντες
  choice: తిరిగి ఏమీ వస్తుందని ఆశించకుండా
  rationale: అప్పివ్వడం, పరస్పర ప్రతిఫలం అనే తక్షణ సందర్భంలో తిరిగి చెల్లింపు లేదా ప్రతిఫలం ఆశించకపోవడమే ప్రధాన భావంగా తీసుకుంది; పదబంధంలోని వేరొక సాధ్యార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: μισθὸς ὑμῶν πολύς
  choice: మీ ప్రతిఫలం గొప్పగా ఉంటుంది
  rationale: నైతిక, అంత్యకాలిక సందర్భానికి తగిన ‘ప్రతిఫలం’ను ఉపయోగించి పరిమాణాత్మక బరువును ‘గొప్పగా’తో నిలుపుతుంది.
- source_word: υἱοὶ Ὑψίστου
  choice: సర్వోన్నతుని కుమారులు
  rationale: υἱοί అనే పుంలింగ బహువచనాన్ని నేరుగా నిలుపుతూ, Ὕψιστος అనే దైవ బిరుదును తెలుగులో గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: χρηστός
  choice: దయగా
  rationale: అర్హతలేనివారిపట్ల దేవుని హితకరమైన వైఖరిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀχαρίστους καὶ πονηρούς
  choice: కృతజ్ఞతలేనివారిపట్ల, దుష్టులపట్ల
  rationale: రెండు వర్గాలనూ వేరుగా, స్పష్టంగా ఉంచి మూలంలోని నైతిక వివరణను నిలుపుతుంది.
theological_decisions:
- issue: υἱοὶ Ὑψίστουలోని పుంలింగ రూపాన్ని ఎలా అనువదించాలి
  choice: సర్వోన్నతుని కుమారులు
  alternative: సర్వోన్నతుని పిల్లలు
  rationale: గ్రీకు మూలంలోని స్పష్టమైన పుంలింగ బహువచనాన్ని ప్రధాన పాఠ్యంలో నిలిపింది; సందర్భంలో అది ప్రతినిధ్యార్థంగా వర్తించగలదని పాదసూచిక తెలియజేస్తుంది.
- issue: μηδὲν ἀπελπίζοντες అనే క్లిష్ట పదబంధాన్ని ఎలా అర్థం చేసుకోవాలి
  choice: తిరిగి ఏమీ వస్తుందని ఆశించకుండా
  alternative: ఎవరి విషయంలోనూ నిరాశ చెందకుండా; ఎన్నడూ ఆశ కోల్పోకుండా
  rationale: అప్పివ్వడం మరియు ప్రతిఫలాపేక్ష గురించిన సమీప సందర్భం తిరిగి చెల్లింపు లేదా లాభాన్ని ఆశించకపోవడాన్ని బలపరుస్తుంది; నిజమైన భాషాపరమైన అనిశ్చితిని పాదసూచికలో సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపాలు వాడబడ్డాయి. వాక్యంలోని వ్యత్యాసం, నైతిక తీవ్రత, దైవ బిరుదు నిలుపబడ్డాయి. ప్రధాన పాఠ్యం సులభంగా చదవగలిగేలా ఉండగా, మూలంలోని నిజమైన పదార్థ అనిశ్చితి పాదసూచికలో సంరక్షించబడింది.
