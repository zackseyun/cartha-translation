revisions:
- from: మనుషులందరూ మిమ్మల్ని గురించి మంచిగా మాట్లాడినప్పుడు మీకు అయ్యో! ఎందుకంటే వారి పూర్వికులు అబద్ధ ప్రవక్తలపట్ల కూడా అలాగే చేసేవారు.
  to: మనుషులందరూ మిమ్మల్ని గురించి మంచిగా మాట్లాడినప్పుడు అయ్యో మీకు! ఎందుకంటే ఆ మనుషుల తండ్రులు అబద్ధ ప్రవక్తలతో కూడా అలాగే ప్రవర్తించేవారు.
  rationale: The revision preserves the Greek warning and historical comparison while using more idiomatic Telugu word order. It restores the source's «fathers» wording, clarifies that they are the fathers of the praising people, and supplies the explanatory cultural note rather than broadening the main text. Footnote markers are supplied in the text in the English audit order.
