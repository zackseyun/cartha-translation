id: LUK.6.26
reference: Luke 6:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐαὶ ὅταν ⸂καλῶς ὑμᾶς⸃ εἴπωσιν ⸀πάντες οἱ ἄνθρωποι, κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς ψευδοπροφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/026.yaml
  text: Woe when all people speak well of you[b][a], for their fathers used to do the same to the false prophets.
translation:
  language: te
  text: మనుషులందరూ మిమ్మల్ని గురించి మంచిగా మాట్లాడినప్పుడు అయ్యో మీకు! ఎందుకంటే ఆ మనుషుల తండ్రులు అబద్ధ ప్రవక్తలతో కూడా అలాగే ప్రవర్తించేవారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐαί
  choice: మీకు అయ్యో!
  rationale: ప్రవచనాత్మక హెచ్చరిక, ఖండన భావాలను నిలుపుతూ తెలుగులో సహజమైన గంభీర ప్రయోగాన్ని వాడింది.
- source_word: ὅταν
  choice: మాట్లాడినప్పుడు
  rationale: సాధారణంగా సంభవించగల పరిస్థితిని సూచించే కాలార్థాన్ని సహజమైన తెలుగు ఉపవాక్యంతో తెలిపింది.
- source_word: καλῶς ὑμᾶς εἴπωσιν
  choice: మిమ్మల్ని గురించి మంచిగా మాట్లాడినప్పుడు
  rationale: కేవలం సరిగా మాట్లాడడం కాకుండా, అనుకూలంగా లేదా ప్రశంసగా మాట్లాడడం అనే గ్రీకు నుడికార భావాన్ని అందిస్తుంది.
- source_word: πάντες οἱ ἄνθρωποι
  choice: మనుషులందరూ
  rationale: లింగభేదం లేకుండా ప్రజలందరినీ సూచించే మూలంలోని సార్వత్రిక బహువచనాన్ని నిలుపుతుంది.
- source_word: κατὰ τὰ αὐτά
  choice: కూడా అలాగే
  rationale: అదే విధమైన ప్రవర్తనను సూచించే పోలికను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందున్న ‘అయ్యో’ అనే హెచ్చరికకు కారణాన్ని స్పష్టంగా అనుసంధానిస్తుంది.
- source_word: ἐποίουν
  choice: చేసేవారు
  rationale: గతంలో అలవాటుగా లేదా పునరావృతంగా జరిగిన చర్యను సూచించే imperfect భావాన్ని తెలుగులో సహజంగా వెల్లడిస్తుంది.
- source_word: τοῖς ψευδοπροφήταις
  choice: అబద్ధ ప్రవక్తలపట్ల
  rationale: ఆ చర్య ఎవరిపట్ల జరిగిందో తెలియజేసే dative సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: οἱ πατέρες αὐτῶν
  choice: వారి పూర్వికులు
  rationale: ఇక్కడ ఉద్దేశించిన మునుపటి తరాల ప్రజలను ఆధునిక పాఠకుడికి సహజంగా తెలియజేస్తూ తరాల మధ్య పోలికను నిలుపుతుంది.
theological_decisions:
- issue: అబద్ధ ప్రవక్తలతో చేసిన పోలిక యొక్క ఉద్దేశం
  choice: అందరి ప్రశంస గత తరాలు అబద్ధ ప్రవక్తలను ఆదరించిన చారిత్రక నమూనాతో పోల్చబడుతున్న హెచ్చరికగా అనువదించడం
  alternative: ఇతరులు చేసే ప్రతి సానుకూల వ్యాఖ్యనూ ఎలాంటి మినహాయింపు లేకుండా ఖండించడం
  rationale: γάρ మరియు κατὰ τὰ αὐτά ముందున్న హెచ్చరికను గత తరాల ప్రవర్తనతో అనుసంధానిస్తాయి. అనువాదం ఈ ఉద్రిక్తతను నిలుపుతుంది గాని ప్రతి ప్రశంసనూ నిషేధిస్తున్నట్లు అతిశయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘పూర్వికులు’ అనేది గ్రీకు ‘తండ్రులు’ అనే సామెతప్రాయ ప్రయోగానికి సందర్భానుగుణమైన సహజ సమానార్థకం.
