review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the warning, universal praise, the habitual past action, and the comparison with false prophets. However, «వారి పూర్వికులు» is broader than οἱ πατέρες αὐτῶν ('their fathers') and can leave the antecedent less clear. The Greek refers to the forebears/fathers of the people who offer the praise; Telugu can retain this biblical idiom naturally as «వారి తండ్రులు».
  naturalness: The wording is generally clear modern Telugu. «మీకు అయ్యో!» is understandable but somewhat calqued and less idiomatic in this sentence position. «అయ్యో మీకు!» is a more natural, solemn prophetic exclamation. «అబద్ధ ప్రవక్తలతో కూడా అలాగే ప్రవర్తించేవారు» naturally renders the Greek dative with ποιέω without the slightly formal «పట్ల ... చేసేవారు».
  terminology: «అబద్ధ ప్రవక్తలు» is appropriate for ψευδοπροφῆται. «వారి తండ్రులు» preserves the source term and biblical register; a footnote can explain the idiomatic sense as preceding generations, without replacing the text's wording.
  issues:
  - severity: low
    issue: «పూర్వికులు» replaces the literal familial term.
    rationale: οἱ πατέρες is literally 'the fathers.' While 'ancestors' is interpretively possible, retaining «తండ్రులు» better reflects the source and preserves its biblical idiom.
  - severity: low
    issue: The antecedent of «వారి» is not explicit enough in Telugu.
    rationale: The Greek αὐτῶν refers to the people who speak well of the disciples. Adding «ఆ మనుషుల» makes this relation explicit without adding interpretive content.
  - severity: low
    issue: «మీకు అయ్యో!» is somewhat awkward word order for a prophetic woe.
    rationale: «అయ్యో మీకు!» is more idiomatic Telugu while retaining the exclamatory denunciation/warning force of Οὐαί.
  revised_text: మనుషులందరూ మిమ్మల్ని గురించి మంచిగా మాట్లాడినప్పుడు అయ్యో మీకు! ఎందుకంటే ఆ మనుషుల తండ్రులు అబద్ధ ప్రవక్తలతో కూడా అలాగే ప్రవర్తించేవారు.
  revised_footnotes:
  - marker: a
    text: లేదా, “మిమ్మల్ని అనుకూలంగా మాట్లాడినప్పుడు.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “వారి తండ్రులు”; అంటే, వారి ప్రజల మునుపటి తరాలవారు.
    reason: cultural_note
  revision_rationale: The revision preserves the Greek warning and historical comparison while using more idiomatic Telugu word order. It restores the source's «fathers» wording, clarifies that they are the fathers of the praising people, and supplies the explanatory cultural note rather than broadening the main text. Footnote markers are supplied in the text in the English audit order.
