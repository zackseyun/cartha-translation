review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the rhetorical question, emphatic self-reference, permission-request force, singular masculine ‘brother,’ and the deliberately disproportionate imagery of a tiny particle and a large timber. The final clause, however, is more idiomatically and directly rendered by making the addressee the subject of ‘see clearly,’ as in Greek διαβλέψεις.
  naturalness: Most of the Telugu is clear and modern. ‘వేషధారీ’ can primarily evoke someone wearing a costume; ‘కపటుడా’ is the natural, direct modern equivalent for the rebuke ὑποκριτά. The final wording ‘నీకు స్పష్టంగా కనిపిస్తుంది’ is slightly impersonal in this context.
  terminology: ‘నలుసు’ and ‘దూలం’ preserve the small-versus-large contrast effectively. ‘సహోదరుడు’ faithfully reflects the masculine singular Greek term; the existing explanatory footnote is appropriate.
  issues:
  - severity: medium
    issue: ‘వేషధారీ’ for ὑποκριτά
    rationale: Although etymologically related to acting or outward appearance, it may suggest merely a costume wearer in current Telugu. ‘కపటుడా!’ more naturally communicates the moral rebuke ‘Hypocrite!’ without adding interpretation.
  - severity: low
    issue: Impersonal construction in the final clause
    rationale: Greek has the second-person future διαβλέψεις (‘you will see clearly’) followed by an infinitive of purpose/result. ‘నీవు స్పష్టంగా చూడగలవు’ retains this subject and is smoother Telugu.
  revised_text: నీ కంటిలో ఉన్న దూలాన్ని నీవే చూడకుండా, నీ సహోదరునితో[a], ‘సహోదరా, నీ కంటిలో ఉన్న నలుసును తీసివేయనివ్వు’ అని నీవు ఎలా చెప్పగలవు? కపటుడా! మొదట నీ కంటిలోని దూలాన్ని[b] తీసివేయి; అప్పుడు నీ సహోదరుని కంటిలో ఉన్న నలుసును తీసివేయడానికి నీవు స్పష్టంగా చూడగలవు.
