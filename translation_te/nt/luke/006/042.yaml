id: LUK.6.42
reference: Luke 6:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀πῶς δύνασαι λέγειν τῷ ἀδελφῷ σου· Ἀδελφέ, ἄφες ἐκβάλω τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ σου, αὐτὸς τὴν ἐν τῷ ὀφθαλμῷ σοῦ δοκὸν οὐ βλέπων; ὑποκριτά, ἔκβαλε πρῶτον τὴν δοκὸν ἐκ τοῦ ὀφθαλμοῦ σοῦ, καὶ τότε διαβλέψεις ⸂τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου ἐκβαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/042.yaml
  text: How can you say to your brother[a], ‘Brother, let me take out the speck that is in your eye,’ while you yourself do not see the beam that is in your own eye? Hypocrite, first take the beam out of your own eye[c][b], and then you will see clearly to take out the speck that is in your brother’s eye.
translation:
  language: te
  text: నీ కంటిలో ఉన్న దూలాన్ని నీవే చూడకుండా, నీ సహోదరునితో[a], ‘సహోదరా, నీ కంటిలో ఉన్న నలుసును తీసివేయనివ్వు’ అని నీవు ఎలా చెప్పగలవు? కపటుడా! మొదట నీ కంటిలోని దూలాన్ని[b] తీసివేయి; అప్పుడు నీ సహోదరుని కంటిలో ఉన్న నలుసును తీసివేయడానికి నీవు స్పష్టంగా చూడగలవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సహోదరుడు” అని అనువదించిన గ్రీకు పదం పుంలింగ ఏకవచన బంధుత్వ పదం; ఈ బోధ మరింత విస్తృతంగా వర్తించవచ్చు, కాని మూలపాఠంలోని పదరూపం పుంలింగంలో ఉంది.
    reason: cultural_note
  - marker: b
    text: “దూలం” అంటే భవన నిర్మాణంలో ఉపయోగించే పెద్ద కొయ్య; గ్రీకు δοκός పెద్ద కలప ముక్కను సూచిస్తుంది. “దుంగ” లేదా “పెద్ద కొయ్య” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασαι λέγειν
  choice: నీవు ఎలా చెప్పగలవు?
  rationale: సామర్థ్యాన్ని లేదా అలా చెప్పే సముచితతను సవాలు చేసే అలంకారిక ప్రశ్నను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἀδελφῷ / Ἀδελφέ / ἀδελφοῦ
  choice: సహోదరునితో / సహోదరా / సహోదరుని
  rationale: మూలంలోని పుంలింగ ఏకవచన బంధుత్వ పదాన్ని మార్చకుండా, గౌరవప్రదమైన సాధారణ తెలుగు రూపంలో అందిస్తుంది.
- source_word: ἄφες ἐκβάλω
  choice: తీసివేయనివ్వు
  rationale: అనుమతి కోరే ఆజ్ఞార్థక ప్రయోగాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κάρφος
  choice: నలుసు
  rationale: కంటిలో పడిన అతి చిన్న పొడి పదార్థపు ముక్కను సూచిస్తూ, పెద్ద దూలంతో ఉన్న అతిశయోక్తి వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: δοκός
  choice: దూలం
  rationale: పెద్ద నిర్మాణ కలపను సూచించే గ్రీకు పదానికి సరిపోతూ, నలుసుతో ఉన్న బలమైన దృశ్య వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: αὐτὸς ... οὐ βλέπων
  choice: నీవే చూడకుండా
  rationale: αὐτός లోని ఉద్ఘాటనను ‘నీవే’ ద్వారా కాపాడి, తన లోపాన్ని గ్రహించకపోవడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὑποκριτά
  choice: వేషధారీ!
  rationale: బయట ఒకలా కనిపిస్తూ లోపల వేరుగా ఉండే వ్యక్తిపై ఉన్న నేరుగా, బలమైన మందలింపును ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: διαβλέψεις
  choice: నీకు స్పష్టంగా కనిపిస్తుంది
  rationale: కేవలం చూడడం కాక స్పష్టంగా చూడగలగడం అనే భావాన్ని వ్యక్తం చేస్తుంది; తరువాతి ఉద్దేశార్థక క్రియతో సహజంగా కలుస్తుంది.
theological_decisions:
- issue: నైతిక బోధలో ἀδελφός అనే పుంలింగ బంధుత్వ పదం
  choice: సహోదరుడు
  alternative: తోటి వ్యక్తి / సహోదరుడు లేదా సహోదరి
  rationale: బోధ విస్తృతంగా వర్తించగలిగినా, మూలపాఠం పుంలింగ ఏకవచనాన్ని ఉపయోగిస్తుంది; దానిని సాధారణీకరించకుండా నిలుపుతుంది.
- issue: κάρφος మరియు δοκός మధ్య రూపకాలంకార వ్యత్యాసం
  choice: నలుసు ... దూలం
  alternative: చిన్న పుల్ల ... దుంగ / నలుసు ... కొయ్యదుంగ
  rationale: ఇతరుని చిన్న లోపం, తన గొప్ప లోపం మధ్య ఉన్న అతిశయోక్తితో కూడిన నైతిక వ్యత్యాసాన్ని సజీవంగా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; నేరుగా సంభోదించే ఏకవచన రూపాలు, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన పదజాలం. ‘నలుసు–దూలం’ అనే దృశ్య వ్యత్యాసం మూలంలోని అతిశయోక్తిని నిలుపుతుంది.
