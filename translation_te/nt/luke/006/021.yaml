id: LUK.6.21
reference: Luke 6:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες νῦν, ὅτι χορτασθήσεσθε. μακάριοι οἱ κλαίοντες νῦν, ὅτι γελάσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/021.yaml
  text: Blessed are you who are hungry now[a], because you will be filled. Blessed are you who weep now[b], because you will laugh.
translation:
  language: te
  text: ఇప్పుడు ఆకలితో ఉన్న మీరు ధన్యులు[a], ఎందుకంటే మీరు కడుపునిండా తింటారు[b]. ఇప్పుడు ఏడుస్తున్న మీరు ధన్యులు, ఎందుకంటే మీరు నవ్వుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇప్పుడు ఆకలితో ఉన్నవారు ధన్యులు ... ఇప్పుడు ఏడుస్తున్నవారు ధన్యులు.’ గ్రీకులో ఆర్టికల్‌తో కూడిన కృదంతాలు ఉన్నాయి; అయితే సమీప సందర్భం ప్రత్యక్ష సంబోధనకు మద్దతిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘మీరు తృప్తి పొందుతారు.’ గ్రీకు క్రియకు ఆహారంతో నిండిపోవడం, విస్తృతంగా పూర్తిగా తృప్తి చెందడం అనే భావాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: ధన్యులు
  rationale: యేసు పలికిన ధన్యతా వాక్యాల రూపాన్నీ, μακάριος లోని దైవానుగ్రహ సంబంధమైన భావాన్నీ ‘ధన్యులు’ సహజంగా నిలుపుతుంది; ‘సంతోషవంతులు’ కేవలం మనోభావాన్ని సూచించే ప్రమాదం ఉంది.
- source_word: οἱ πεινῶντες νῦν
  choice: ఇప్పుడు ఆకలితో ఉన్న మీరు
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న ఆకలి స్థితిని, νῦν ప్రస్తుతకాలాన్ని సూచిస్తాయి. గ్రీకులో ఆర్టికల్‌తో కూడిన కృదంతం ఉన్నప్పటికీ, రెండవ పురుష బహువచన క్రియలూ సమీప సందర్భంలోని ప్రత్యక్ష సంబోధనా ఈ రూపానికి మద్దతిస్తాయి.
- source_word: χορτασθήσεσθε
  choice: మీరు తృప్తిగా నింపబడతారు
  rationale: భవిష్యత్ కర్మణి రూపంలోని ‘నింపబడటం’ అనే concrete imageryని నిలుపుతూ, ఆహారంతో పూర్తిగా తృప్తి చెందే భావాన్ని తెలుగులో స్పష్టం చేస్తుంది; నెరవేర్పు విధానాన్ని నిర్దిష్టం చేయదు.
- source_word: οἱ κλαίοντες νῦν
  choice: ఇప్పుడు ఏడుస్తున్న మీరు
  rationale: κλαίω ఏడవడం లేదా కన్నీరు పెట్టడాన్ని సూచిస్తుంది; అది తప్పనిసరిగా మరణశోకానికే పరిమితం కాదు. ప్రత్యక్ష సంబోధనను, కొనసాగుతున్న స్థితిని ఈ రూపం నిలుపుతుంది.
- source_word: γελάσετε
  choice: మీరు నవ్వుతారు
  rationale: γελάω యొక్క సూటి, దృశ్యమైన ‘నవ్వడం’ భావాన్ని నిలుపుతుంది; ‘ఆనందిస్తారు’ అని విస్తరించి వ్యాఖ్యానించదు.
theological_decisions:
- issue: ప్రత్యక్ష సంబోధనా లేక సాధారణ మూడవ పురుష ధన్యతా వాక్యమా
  choice: ‘ఆకలితో ఉన్న మీరు / ఏడుస్తున్న మీరు’ అనే ప్రత్యక్ష సంబోధన
  alternative: ‘ఆకలితో ఉన్నవారు / ఏడుస్తున్నవారు’
  rationale: గ్రీకు పదబంధాలు వ్యాకరణపరంగా ‘...ఉన్నవారు’ అని చదవవచ్చు; అయితే χορτασθήσεσθε, γελάσετε రెండవ పురుష బహువచన రూపాలుగా ఉండటం, లూకా సందర్భంలోని శిష్యులకు ప్రత్యక్ష సంబోధన ఈ ఎంపికకు మద్దతిస్తాయి. ప్రత్యామ్నాయ వ్యాకరణ రూపాన్ని పాదసూచికలో ఉంచాం.
- issue: వాగ్దానం చేసిన తారుమారు యొక్క స్వభావం
  choice: ‘తృప్తిగా నింపబడతారు’, ‘నవ్వుతారు’ అనే స్పష్టమైన చిత్రాలను నిలుపడం
  alternative: దీనిని కేవలం ఆత్మీయ తృప్తిగా లేదా ప్రత్యేకంగా అంత్యకాల నెరవేర్పుగా అనువదించడం
  rationale: వాక్యం తారుమారును వాగ్దానం చేస్తుంది గానీ, అది ఎప్పుడు లేదా ఏ విధంగా నెరవేరుతుందో ఇక్కడ నిర్దిష్టం చేయదు; అనువాదం ఆ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ధన్యతా వాక్య శైలి. ‘ధన్యులు’ సంప్రదాయ బైబిలు పదమే అయినా ఇప్పటికీ స్పష్టంగా ఉంది. గ్రీకు మూలంలో ఒక్కటే ఉన్న భిన్నార్థక అంశానికి మాత్రమే పాదసూచిక ఇచ్చాం; అందువల్ల ప్రధాన పాఠంలో [a] మాత్రమే ఉంది.
