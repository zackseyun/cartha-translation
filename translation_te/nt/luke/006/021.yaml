revisions:
- from: ఇప్పుడు ఆకలితో ఉన్న మీరు ధన్యులు[a], ఎందుకంటే మీరు తృప్తిగా నింపబడతారు. ఇప్పుడు ఏడుస్తున్న మీరు ధన్యులు, ఎందుకంటే మీరు నవ్వుతారు.
  to: ఇప్పుడు ఆకలితో ఉన్న మీరు ధన్యులు[a], ఎందుకంటే మీరు కడుపునిండా తింటారు[b]. ఇప్పుడు ఏడుస్తున్న మీరు ధన్యులు, ఎందుకంటే మీరు నవ్వుతారు.
  rationale: The revision removes an unnatural redundant passive expression and replaces it with an idiomatic Telugu expression for being filled with food. It retains the source’s present deprivation/future reversal, direct address, and literal ‘laugh,’ without interpreting the promise as exclusively spiritual, temporal, or eschatological. The added lexical footnote records the broader ‘satisfied’ sense of χορτασθήσεσθε.
