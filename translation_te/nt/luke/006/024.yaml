id: LUK.6.24
reference: Luke 6:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πλὴν οὐαὶ ὑμῖν τοῖς πλουσίοις, ὅτι ἀπέχετε τὴν παράκλησιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/024.yaml
  text: But woe to you who are rich[b][a], for you have received your comfort.
translation:
  language: te
  text: అయితే, ధనవంతులైన మీకు అయ్యో! ఎందుకంటే మీరు మీ ఓదార్పును పొందారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ ఓదార్పును పూర్తిగా పొందారు.” ἀπέχετε అనే క్రియకు చెల్లింపు పూర్తిగా అందుకోవడం వంటి భావం ఉండవచ్చు. “ఓదార్పు”కు “సాంత్వన” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: అయితే
  rationale: ముందున్న ధన్యతలకు దీనికి మధ్య ఉన్న బలమైన వ్యతిరేకతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οὐαὶ
  choice: అయ్యో!
  rationale: విలాపం, గంభీర హెచ్చరిక, తీర్పు ప్రకటన అనే ప్రవచనాత్మక బలాన్ని నిలుపుతుంది; దానిని కేవలం సానుభూతి వ్యక్తీకరణగా బలహీనపరచదు.
- source_word: ὑμῖν τοῖς πλουσίοις
  choice: ధనవంతులైన మీకు
  rationale: ధనవంతులను నేరుగా సంబోధిస్తున్న దత్తివ్యాకరణ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఈ 'అయ్యో' ప్రకటనకు కారణాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: ἀπέχετε
  choice: ఇప్పటికే పొందుతున్నారు
  rationale: వర్తమానకాల భావాన్ని ఉంచుతూ, పొందవలసినది దక్కిపోయింది లేదా పూర్తిగా అందుతోంది అనే వాణిజ్యసంబంధ ఛాయను 'ఇప్పటికే' కొంతవరకు తెలియజేస్తుంది; 'పూర్తిగా' అనే మరింత స్పష్టమైన భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: τὴν παράκλησιν ὑμῶν
  choice: మీ ఆదరణను
  rationale: παράκλησις కు సందర్భానుగుణంగా ఓదార్పు/ఉపశమనం అనే అర్థాన్ని ఇచ్చే గౌరవప్రదమైన, సులభమైన పదబంధం.
theological_decisions:
- issue: ధనవంతులపై హెచ్చరిక స్వభావం
  choice: ధనవంతులను నేరుగా ఉద్దేశించిన గంభీరమైన 'అయ్యో' ప్రకటనగా అనువదించబడింది.
  alternative: దీనిని కేవలం 'అయ్యయ్యో' అనే సానుభూతి విలాపంగా చేయడం, లేదా 'ధనాన్ని నమ్ముకునేవారు' అని విస్తరించడం.
  rationale: గ్రీకు వాక్యం నేరుగా 'ధనవంతులైన మీకు' అని చెబుతుంది. ధనంపై నమ్మకం వంటి కారణాన్ని వచనం ఇక్కడ పేర్కొననందున దానిని చేర్చలేదు.
- issue: ἀπέχετε యొక్క కాల మరియు సంపూర్ణత భావం
  choice: ప్రధాన పాఠంలో 'ఇప్పటికే పొందుతున్నారు' అని ఉంచి వర్తమాన దృష్టినీ, ముందుగానే దక్కిన భావాన్నీ కలిపి నిలుపుకుంది.
  alternative: '''పూర్తిగా పొందారు'' లేదా ''పొందేశారు.'''
  rationale: ἀπέχετε వర్తమాన సూచకరూపమైనప్పటికీ, చెల్లించవలసిన మొత్తాన్ని పూర్తిగా పొందడం అనే ప్రయోగార్థం కలిగి ఉండవచ్చు. ఈ ఉద్రిక్తతను ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే యేసు పలికిన గంభీరమైన ప్రవచనాత్మక హెచ్చరికకు తగిన గౌరవప్రదమైన శైలి. పాదసూచిక గుర్తు ప్రధాన పాఠంలో పొందుపరచబడింది.
