review_pass:
  verdict: revise
  source_fidelity: The direct address to the rich and the prophetic force of οὐαί are retained. However, “ఆదరణ” ordinarily means support, favor, or patronage in modern Telugu and does not naturally convey παράκλησις here. Also, “ఇప్పటికే పొందుతున్నారు” combines ‘already’ with an ongoing receiving action awkwardly; ἀπέχετε is well represented idiomatically as having received, with its ‘in full’ nuance retained in the note.
  naturalness: “అయితే, ధనవంతులైన మీకు అయ్యో!” is direct and natural in a solemn prophetic register. “మీ ఓదార్పును పొందారు” is clear modern Telugu and avoids the semantic ambiguity of “ఆదరణ.”
  terminology: Use “ఓదార్పు” for παράκλησις in this context. “సాంత్వన” is a suitable lexical alternative in the footnote. The note preserves the commercial/full-receipt nuance of ἀπέχετε without making the main text unnecessarily cumbersome.
  issues:
  - severity: medium
    issue: “ఆదరణ” is not the best contextual equivalent for παράκλησις.
    rationale: In modern Telugu, ఆదరణ commonly denotes support, encouragement, favor, or patronage. In this saying, παράκλησις means comfort/consolation; “ఓదార్పు” communicates that sense more accurately.
  - severity: low
    issue: “ఇప్పటికే పొందుతున్నారు” is aspectually awkward.
    rationale: The combination suggests an action still in progress despite already being received. The present ἀπέχετε can idiomatically mean ‘you have received [in full]’; Telugu “పొందారు,” with the fuller nuance footnoted, is more natural and faithful.
  revised_text: అయితే, ధనవంతులైన మీకు అయ్యో! ఎందుకంటే మీరు మీ ఓదార్పును పొందారు.[a]
