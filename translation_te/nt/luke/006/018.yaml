review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the purpose clauses, healing from diseases, affliction caused by unclean spirits, and the imperfect passive sense of ἐθεραπεύοντο. However, the relative plural οἳ, which continues the crowd in the preceding verse, is rendered as an independent nominal phrase and thereby loses the explicit relative linkage. Also, ‘అపవిత్రాత్మలు’ is potentially ambiguous in Telugu as ‘unholy spirits’; ‘అపవిత్రమైన ఆత్మలు’ more directly represents πνεύματα ἀκάθαρτα while retaining biblical terminology.
  naturalness: The wording is broadly clear and modern. Recasting the opening as a relative clause makes the continuation from verse 17 smoother and avoids a semicolon joining two nominal groups. ‘స్వస్థత పొందుతున్నారు’ is natural Telugu and adequately conveys the imperfect as a scene-in-progress without the somewhat heavy ‘పొందుతూ ఉన్నారు.’
  terminology: ‘రోగాలు,’ ‘స్వస్థత,’ and ‘బాధించబడుతున్న’ are suitable. ‘అపవిత్రమైన ఆత్మలు’ is preferred for clarity and closer formal correspondence to the Greek adjective-noun phrase. The lexical-alternative footnote should remain anchored to ‘బాధించబడుతున్నవారు,’ not to the whole phrase.
  issues:
  - severity: medium
    issue: The relative connection of οἳ is not explicit.
    rationale: ‘వచ్చినవారు’ can function as a noun phrase, but the Greek οἳ explicitly links this verse to the people described in the preceding verse. ‘ఆయన మాట వినడానికి ... వచ్చినవారు’ is clearer as a dependent relative continuation.
  - severity: low
    issue: ‘అపవిత్రాత్మలు’ may be read as a lexical compound with less transparent adjectival force.
    rationale: The Greek reads ‘unclean spirits.’ ‘అపవిత్రమైన ఆత్మలు’ clearly preserves the adjective and is natural in modern standard Telugu.
  - severity: low
    issue: The footnote marker is placed after the entire affliction phrase rather than the lexical item being qualified.
    rationale: The note concerns the possible renderings of ἐνοχλούμενοι, so it should follow ‘బాధించబడుతున్నవారు.’
  revised_text: ఆయన మాట వినడానికి, తమ రోగాల నుంచి స్వస్థత పొందడానికి వచ్చినవారు; అపవిత్రమైన ఆత్మల చేత బాధించబడుతున్నవారు[a] స్వస్థత పొందుతున్నారు.
  revised_footnotes:
