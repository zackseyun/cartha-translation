revisions:
- from: ఆయన మాట వినడానికి, తమ రోగాల నుంచి స్వస్థత పొందడానికి వచ్చినవారు; అపవిత్రాత్మల చేత బాధించబడుతున్నవారు[a] కూడా స్వస్థత పొందుతూ ఉన్నారు.
