source:
  edition: SBLGNT
  text: οἳ ἦλθον ἀκοῦσαι αὐτοῦ καὶ ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν· καὶ οἱ ⸂ἐνοχλούμενοι ἀπὸ⸃ πνευμάτων ⸀ἀκαθάρτων ἐθεραπεύοντο·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/018.yaml
  text: who came to hear him and to be healed of their diseases[a]; and those troubled by unclean spirits were being healed.
translation:
  language: te
  text: ఆయన మాట వినడానికి, తమ రోగాల నుంచి స్వస్థత పొందడానికి వచ్చినవారు; అపవిత్రమైన ఆత్మల చేత బాధించబడుతున్నవారు[a] స్వస్థత పొందుతున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వేధించబడుతున్నవారు.’ గ్రీకు పదాన్ని సందర్భానుసారంగా ‘బాధించబడుతున్నవారు,’ ‘వేధించబడుతున్నవారు,’ లేదా ‘పీడించబడుతున్నవారు’ అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ ἦλθον
  choice: వచ్చినవారు
  rationale: οἳ ముందటి వచనంలోని జనసమూహాన్ని తిరిగి సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో సంబంధార్థక కృదంత రూపమైన ‘వచ్చినవారు’ ఆ అనుసంధానాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἀκοῦσαι αὐτοῦ
  choice: ఆయన మాట వినడానికి
  rationale: ఉద్దేశాన్ని తెలిపే infinitive భావాన్ని ‘వినడానికి’ వ్యక్తం చేస్తుంది. తెలుగులో కేవలం ‘ఆయనను వినడానికి’ కంటే ‘ఆయన మాట వినడానికి’ సహజంగా ఉంటుంది; మూలంలోని వ్యక్తినే వినడం అనే భావాన్ని మార్చదు.
- source_word: ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν
  choice: తమ రోగాల నుంచి స్వస్థత పొందడానికి
  rationale: ἰαθῆναι యొక్క passive healing భావాన్ని ‘స్వస్థత పొందడానికి’ సహజంగా అందిస్తుంది; ἀπό సూచించే విముక్తి లేదా వేరుపాటు భావాన్ని ‘నుంచి’ నిలుపుతుంది. αὐτῶν‌ను సంబంధిత సమూహానికే తిరిగి వర్తించే ‘తమ’గా అనువదించాం.
- source_word: ἐνοχλούμενοι ἀπὸ πνευμάτων ἀκαθάρτων
  choice: అపవిత్రాత్మల చేత బాధించబడుతున్నవారు
  rationale: ἐνοχλούμενοιలోని కొనసాగుతున్న passive affliction భావాన్ని ‘బాధించబడుతున్నవారు’ తెలియజేస్తుంది. ἀπό ఇక్కడ కారణం లేదా కర్తృత్వాన్ని సూచిస్తున్నందున ‘చేత’ సహజం; ‘అపవిత్రాత్మలు’ ἀκάθαρτος యొక్క స్థిరమైన బైబిలు భావాన్ని కాపాడుతుంది.
- source_word: ἐθεραπεύοντο
  choice: స్వస్థత పొందుతూ ఉన్నారు
  rationale: Imperfect passive యొక్క కొనసాగుతున్న లేదా పునరావృత చర్యను ‘పొందుతూ ఉన్నారు’ ప్రతిబింబిస్తుంది; ఆ దృశ్యంలో స్వస్థపరచడం జరుగుతూనే ఉందనే భావం నిలుస్తుంది.
theological_decisions:
- issue: πνευμάτων ἀκαθάρτων అనే పదబంధం
  choice: అపవిత్రాత్మలు
  alternative: దయ్యాలు; అశుద్ధాత్మలు
  rationale: మూలం ‘దయ్యాలు’ అనే వివరణాత్మక పదం కాకుండా ‘అపవిత్రాత్మలు’ అని చెబుతుంది. ఈ రూపం సువార్తలలోని పదబంధాన్నీ దాని ఆధ్యాత్మిక, నైతిక ప్రతిధ్వనినీ అనవసర వ్యాఖ్యానం లేకుండా నిలుపుతుంది.
- issue: ἐθεραπεύοντο యొక్క కాలాంశం
  choice: స్వస్థత పొందుతూ ఉన్నారు
  alternative: స్వస్థత పొందారు
  rationale: Imperfect రూపం దృశ్యంలో కొనసాగుతున్న లేదా పలుమార్లు జరుగుతున్న స్వస్థపరచే కార్యాన్ని సూచించగలదు; సాధారణ భూతకాలం ఆ కాలాంశాన్ని సమతలపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. వచనం ముందటి వచనంతో వ్యాకరణపరంగా అనుసంధానమై ఉన్నందున ‘వచ్చినవారు’ అనే సంబంధార్థక నిర్మాణం అలాగే ఉంచబడింది. ‘స్వస్థత పొందుతూ ఉన్నారు’ కొంత విస్తృతమైన రూపమైనా, మూలంలోని imperfect భావాన్ని సహజ తెలుగులో స్పష్టంగా నిలుపుతుంది.
