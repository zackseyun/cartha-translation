  yaml_path: translation/nt/luke/006/015.yaml
  text: and Matthew and Thomas[a], and James son of Alphaeus, and Simon who was called the Zealot
translation:
  language: te
  text: మరియు మత్తయిని, తోమాను, అల్ఫయి కుమారుడైన యాకోబును, జెలోతు అని పిలువబడే సీమోనును[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఉత్సాహవంతుడు అని పిలువబడే సీమోను.” ఇక్కడి గ్రీకు పదం ఒక బిరుదుగా ఉండవచ్చు; తరువాతి కాలంలోని ఒక రాజకీయ ఉద్యమంలో అతనికి అధికారిక సభ్యత్వం ఉండేదని ఈ పదం ఒక్కటే నిర్ధారించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: జాబితాలో కామాలతో సమన్వయం
  rationale: గ్రీకులో పేర్లను కలిపే καὶ పదం పదేపదే వచ్చినా, ఆధునిక సహజ తెలుగు జాబితాలో కామాలు అదే సమన్వయాన్ని స్పష్టంగా తెలియజేస్తాయి.
- source_word: Μαθθαῖον
  choice: మత్తయిని
  rationale: Μαθθαῖος అనే వ్యక్తిపేరుకు తెలుగులో స్థిరపడిన లిప్యంతరీకరణను, వాక్యంలోని కర్మరూపానికి తగిన విభక్తితో వాడాం.
- source_word: Θωμᾶν
  choice: తోమాను
  rationale: Θωμᾶς అనే వ్యక్తిపేరుకు తెలుగులో సాధారణంగా వాడే రూపాన్ని కర్మవిభక్తితో ఇచ్చాం.
- source_word: Ἰάκωβον Ἁλφαίου
  choice: అల్ఫయి కుమారుడైన యాకోబును
  rationale: ఈ పేరుపద్ధతిలో Ἁλφαίου అనే షష్ఠీ రూపం తండ్రి-కొడుకు సంబంధాన్ని సహజంగా సూచిస్తుంది; తెలుగులో దాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేశాం.
- source_word: Σίμωνα
  choice: సీమోనును
  rationale: Σίμων అనే వ్యక్తిపేరుకు స్థిరపడిన తెలుగు లిప్యంతరీకరణను కర్మవిభక్తితో వాడాం.
- source_word: τὸν καλούμενον
  choice: అని పిలువబడిన
  rationale: వర్తమాన కర్మణి అసమాపక క్రియతో ఉన్న గుర్తింపు పదబంధాన్ని సహజమైన తెలుగు విశేషణ ఉపవాక్యంగా అందించాం.
- source_word: Ζηλωτὴν
  choice: జెలోతు
  rationale: ఇది సీమోనును గుర్తించే బిరుదు. చారిత్రక రాజకీయ సభ్యత్వాన్ని నిర్ణయించకుండా ఉండేందుకు బిరుదును లిప్యంతరీకరించి, దాని భావపరిధిని పాదటీపులో వివరించాం.
theological_decisions:
- issue: Ζηλωτής అనేది ఒక రాజకీయ వర్గపు అధికారిక సభ్యత్వపేరా, లేక ఉత్సాహం గలవాడనే వివరణాత్మక బిరుదా?
  choice: ప్రధాన పాఠ్యంలో “జెలోతు” అనే గుర్తింపు బిరుదును ఉంచడం.
  alternative: “ఉత్సాహవంతుడు” అని అనువదించడం లేదా “జెలోతు వర్గ సభ్యుడు” అని చారిత్రకంగా నిర్దిష్టీకరించడం.
  rationale: గ్రీకు పదం బిరుదుగా పనిచేస్తుంది; అయితే అది తరువాతి కాలంలో ఏర్పడిన ఒక అధికారిక రాజకీయ ఉద్యమంలోని సభ్యత్వాన్ని తప్పనిసరిగా నిరూపించదు. లిప్యంతరీకరణతో పాటు పాదటీపు ఈ అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, అపొస్తలుల పేర్ల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. తెలుగు సహజత్వం కోసం పునరావృత καὶ స్థానంలో కామాలు వాడబడ్డాయి; మూలంలోని కర్మరూపాన్ని పేర్లకు “-ను/-ని” ద్వారా నిలిపాం.
