id: LUK.6.29
reference: Luke 6:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῷ τύπτοντί σε ἐπὶ τὴν σιαγόνα πάρεχε καὶ τὴν ἄλλην, καὶ ἀπὸ τοῦ αἴροντός σου τὸ ἱμάτιον καὶ τὸν χιτῶνα μὴ κωλύσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/029.yaml
  text: To the one who strikes you on the cheek[a], offer the other also; and from the one who takes away your cloak[c][b], do not withhold your tunic also.
translation:
  language: te
  text: నీ చెంపపై కొట్టేవానికి మరో చెంపను కూడా అందించు[a]. నీ పైవస్త్రాన్ని తీసుకుపోయేవాడు నీ లోవస్త్రాన్ని కూడా తీసుకోకుండా అతడిని అడ్డుకోవద్దు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చెంప’ అనే పదాన్ని ‘దవడ’ అని కూడా అనువదించవచ్చు. ఇక్కడ ‘అందించు’ అని ఉన్న గ్రీకు పదం అక్షరార్థంగా ‘ఇవ్వు’ లేదా ‘సమర్పించు’ అనే భావాన్ని ఇస్తుంది; ‘తిప్పు’ అని కాదు.
    reason: lexical_alternative
  - marker: b
    text: ‘పైవస్త్రం’ (ἱμάτιον) బయట ధరించే వస్త్రం; ‘లోవస్త్రం’ (χιτών) దాని కింద, శరీరానికి దగ్గరగా ధరించే వస్త్రం.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ τύπτοντί
  choice: కొట్టేవానికి
  rationale: వర్తమానకాల కృదంతం సాధారణంగా అలాంటి పని చేసే వ్యక్తిని సూచిస్తుంది; తెలుగులో ఇది సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: ἐπὶ τὴν σιαγόνα
  choice: నీ చెంపపై
  rationale: σιαγών ‘దవడ’ లేదా ‘చెంప’ను సూచించగలదు; కొట్టే సందర్భంలో ‘చెంప’ సాధారణ పాఠకులకు సహజమైన పదం.
- source_word: πάρεχε
  choice: అందించు
  rationale: παρέχωలోని ‘ఇవ్వు/సమర్పించు/అందించు’ భావాన్ని నిలుపుతుంది; మత్తయి వాక్యంలోని ‘తిప్పు’ అనే భిన్న క్రియను ఇక్కడికి దిగుమతి చేయదు.
- source_word: καὶ τὴν ἄλλην
  choice: మరో చెంపను కూడా
  rationale: సందర్భానుసారం విడిచిపెట్టబడిన ‘చెంప’ను తెలుగులో స్పష్టపరుస్తూ, καίలోని ‘కూడా’ అనే బలాన్ని నిలుపుతుంది.
- source_word: ἀπὸ τοῦ αἴροντός σου
  choice: తీసుకుపోయేవాడు
  rationale: αἴρω ఇక్కడ వస్త్రాన్ని తీసివేయడం లేదా తీసుకుపోవడం అనే భావంలో ఉంది; ‘తీసుకుపోయేవాడు’ స్వాధీనం చేసుకునే చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: τὸ ἱμάτιον
  choice: నీ పైవస్త్రాన్ని
  rationale: ἱμάτιον బయట ధరించే వస్త్రం; ‘పైవస్త్రం’ చారిత్రక వస్త్రభేదాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὸν χιτῶνα
  choice: నీ లోవస్త్రాన్ని
  rationale: χιτών శరీరానికి దగ్గరగా ధరించే లోపలి వస్త్రం; ‘లోవస్త్రం’ ἱμάτιονతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: μὴ κωλύσῃς
  choice: అడ్డుకోవద్దు
  rationale: κωλύω యొక్క ప్రాథమిక భావమైన ‘అడ్డగించు/నిరోధించు’ను నేరుగా నిలుపుతూ, గ్రీకు నిర్మాణంలోని నిరోధించవద్దనే ఆజ్ఞను సహజ తెలుగులో ఇస్తుంది.
theological_decisions:
- issue: లూకా మాటలను మత్తయిలోని సుపరిచితమైన ‘మరో చెంప తిప్పు’ అనే రూపంతో సమన్వయపరచాలా
  choice: లూకా ప్రత్యేక క్రియను అనుసరించి ‘మరో చెంపను కూడా అందించు’ అని అనువదించడం
  alternative: ‘మరో చెంపను కూడా తిప్పు’
  rationale: గ్రీకులో πάρεχε (‘అందించు/సమర్పించు’) ఉంది, ‘తిప్పు’ అనే క్రియ లేదు. అందువల్ల సమాంతర సువార్త పదప్రయోగాన్ని చేర్చకుండా లూకా స్వరూపాన్ని నిలుపుతుంది.
- issue: ఈ ఆజ్ఞలకు వివరణాత్మక పరిమితులు లేదా మృదుత్వం చేర్చాలా
  choice: ఆజ్ఞలను ఎలాంటి వివరణాత్మక అర్హతలు చేర్చకుండా నేరుగా ఉంచడం
  alternative: ప్రతీకారం చేయకపోవడం, అతిశయోక్తి, లేదా చట్టపరమైన వర్తింపు గురించి ప్రధాన పాఠ్యంలో వివరణ చేర్చడం
  rationale: మూలపాఠం నేరుగా ఆజ్ఞాపిస్తుంది. దాని నైతిక, ధార్మిక ఉద్వేగాన్ని అనువాదమే ముందుగానే పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా ఏకవచన సంబోధనను వాడింది. ‘పైవస్త్రం/లోవస్త్రం’ అనే జంట మూలంలోని వస్త్రభేదాన్ని సహజంగా నిలుపుతుంది. ప్రధాన పాఠ్యం ఆజ్ఞల నేరత్వాన్ని, కఠినత్వాన్ని మృదుపరచదు.
