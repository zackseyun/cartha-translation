  source_fidelity: మొదటి వాక్యం τῷ τύπτοντί, σιαγόνα, πάρεχε, καὶ τὴν ἄλληνను విశ్వసనీయంగా ప్రతిబింబిస్తుంది. రెండవ వాక్యంలో ἱμάτιον/χιτών భేదం కూడా సరిగానే ఉంది. అయితే ప్రస్తుత పదక్రమంలో ‘తీసుకోకుండా అడ్డుకోవద్దు’ అనేది ఎవరు ఎవరిని అడ్డుకుంటున్నారో అస్పష్టంగా ఉండి, ‘తీసుకోకపోవడాన్ని అడ్డుకోవద్దు’ అనే విరుద్ధ భావానికి కూడా దారితీయవచ్చు. స్పష్టమైన కర్మను చేర్చి κωλύσῃς యొక్క ‘అడ్డుకోకు’ భావాన్ని నిలిపాను.
  naturalness: ‘నీ చెంపపై కొట్టేవానికి మరో చెంపను కూడా అందించు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంది. వస్త్రాల వాక్యంలో ‘అతడిని అడ్డుకోవద్దు’ చేర్చడం వాక్యసంబంధాన్ని స్పష్టపరుస్తుంది; పైవస్త్రం/లోవస్త్రం జంట పాఠకులకు అర్థమయ్యేలా, చారిత్రక భేదాన్ని నిలుపుతుంది.
  terminology: ‘చెంప’కు ప్రత్యామ్నాయంగా ‘దవడ’ అనే గమనిక సముచితం. ἱμάτιονకు ‘పైవస్త్రం,’ χιτώνకు ‘లోవస్త్రం’ అనేవి వాటి పరస్పర భేదాన్ని కాపాడుతున్నాయి. ‘అందించు’ παρέχωను మత్తయి సమాంతరంలోని ‘తిప్పు’తో కలపకుండా సరిగ్గా వ్యక్తపరుస్తుంది.
