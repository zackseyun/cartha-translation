  to: 'ఆయన వారికి ఒక ఉపమానం కూడా చెప్పాడు: “ఒక అంధుడు మరొక అంధుడికి దారి చూపగలడా?[a] వారిద్దరూ గుంటలో పడిపోరా?”[b]'
  rationale: The revision retains every semantic and rhetorical feature of the Greek and the English audit trail, while using more natural modern-standard Telugu for ‘blind man’ and ‘pit/ditch’. Footnote b is narrowed to accurate Telugu alternatives for βόθυνος.
