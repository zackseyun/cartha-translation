id: LUK.6.39
reference: Luke 6:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀καὶ παραβολὴν αὐτοῖς· Μήτι δύναται τυφλὸς τυφλὸν ὁδηγεῖν; οὐχὶ ἀμφότεροι εἰς βόθυνον ⸀ἐμπεσοῦνται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/039.yaml
  text: 'And he also told them a parable: “Can a blind man guide a blind man? Will not both fall into a pit?”[a][b]'
translation:
  language: te
  text: 'ఆయన వారికి ఒక ఉపమానం కూడా చెప్పాడు: “ఒక అంధుడు మరొక అంధుడికి దారి చూపగలడా?[a] వారిద్దరూ గుంటలో పడిపోరా?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో పుంలింగ ఏకవచన రూపాలు ప్రతినిధి భావంతో వాడబడ్డాయి. అందువల్ల “ఒక అంధ వ్యక్తి … మరొక అంధ వ్యక్తికి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “గుంటలో” అనే మాటను “గొయ్యిలో” లేదా “కందకంలో” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: కూడా
  rationale: δὲతో కలిసి ఉన్న అదనపు భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: παραβολὴν
  choice: ఉపమానం
  rationale: సువార్తలలోని దృష్టాంతాత్మక లేదా పోలికతో కూడిన మాట అనే ప్రామాణిక భావాన్ని తెలియజేస్తుంది.
- source_word: Μήτι δύναται
  choice: చూపగలడా?
  rationale: ప్రతికూల సమాధానాన్ని ఆశించే సామర్థ్యసూచక అలంకారప్రశ్నను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τυφλὸς ... τυφλὸν
  choice: ఒక గుడ్డివాడు ... మరొక గుడ్డివాడికి
  rationale: గ్రీకు పుంలింగ ఏకవచన ప్రతినిధి రూపాన్ని నిలుపుతూ, తెలుగు సామెతసదృశ వాక్యానికి సహజంగా ఉంది.
- source_word: ὁδηγεῖν
  choice: దారి చూపగలడా
  rationale: ఒకరు మరొకరిని మార్గంలో నడిపించే దృశ్యాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: οὐχὶ ... ἀμφότεροι
  choice: వారిద్దరూ ... పడిపోరా?
  rationale: సానుకూల సమాధానాన్ని ఆశించే గ్రీకు అలంకారప్రశ్న బలాన్ని నిలుపుతుంది.
- source_word: βόθυνον
  choice: గోతి
  rationale: గుంత లేదా కాలువ అనే పరిధి గల పదానికి విస్తృతమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: ἐμπεσοῦνται
  choice: పడిపోరా
  rationale: భవిష్యత్ భావాన్ని తెలుగు అలంకారప్రశ్నలో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పుంలింగ నామవాచకార్థక τυφλός
  choice: ఒక గుడ్డివాడు ... మరొక గుడ్డివాడు
  alternative: ఒక అంధ వ్యక్తి ... మరొక అంధ వ్యక్తి
  rationale: గ్రీకులో పుంలింగ ఏకవచనం సామాన్య ప్రతినిధి భావంతో వాడబడింది. అన్వయాన్ని ఏ ఒక్క లింగానికీ పరిమితం చేయకుండా మూలరూపాన్ని ప్రతిబింబించేందుకు పుంలింగ రూపం ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. “గుడ్డివాడు” మూలంలోని పుంలింగ ప్రతినిధి రూపాన్ని నేరుగా ప్రతిబింబిస్తుంది; మరింత వ్యక్తి-కేంద్రీకృత ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
