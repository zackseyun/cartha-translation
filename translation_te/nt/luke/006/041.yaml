id: LUK.6.41
reference: Luke 6:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ δοκὸν τὴν ἐν τῷ ἰδίῳ ὀφθαλμῷ οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/041.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: te
  text: అయితే, నీ సహోదరుని కంటిలో ఉన్న నలుసును[a][b] నీవు చూస్తున్నావు గానీ, నీ సొంత కంటిలో ఉన్న దూలాన్ని[c] ఎందుకు గమనించవు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నలుసు’ (గ్రీకు κάρφος) అనే పదాన్ని ‘చిన్న పుల్ల’ లేదా ‘చెక్కపేళు’ అని కూడా అనువదించవచ్చు; ఇది పెద్ద దూలంతో వ్యత్యాసంగా ఉన్న అతి చిన్న రేణువును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘సహోదరుడు’ అని అనువదించిన గ్రీకు పదం పుంలింగ ఏకవచనంలో ఉంది; అయితే ఈ బోధ కేవలం మగ తోబుట్టువుకే పరిమితం కాదు.
    reason: cultural_note
  - marker: c
    text: ‘దూలం’ (గ్రీకు δοκός) అంటే పెద్ద కలప మాను; సందర్భానుసారంగా ‘కొయ్యదుంగ’ లేదా ‘పెద్ద పలక’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: ఎందుకు
  rationale: ఈ అలంకారిక ప్రశ్నలో τί, βλέπειςతో కలిసి కారణాన్ని ప్రశ్నిస్తూ మందలించే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘ఎందుకు’ సహజంగా ఆ బలాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి సందర్భం నుంచి కొనసాగింపుతో కూడిన స్వల్ప వ్యత్యాసాన్ని చూపుతుంది; ‘అయితే’ తెలుగులో సహజమైన మలుపును ఇస్తుంది.
- source_word: βλέπεις
  choice: చూస్తున్నావు
  rationale: సాధారణ దృష్టిక్రియను సూచిస్తూ కంటికి సంబంధించిన రూపకాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: κάρφος
  choice: నలుసు
  rationale: కంటిలో పడగల చిన్న గడ్డి, పొట్టు లేదా చెక్క రేణువును సూచించడానికి ‘నలుసు’ సహజమైన తెలుగు పదం; పెద్ద δοκόςతో ఉన్న అతిశయ వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: ὀφθαλμῷ
  choice: కంటిలో
  rationale: ὀφθαλμόςకు సాధారణ సమానార్థకం; గ్రీకు ఏకవచనాన్ని నిలిపింది.
- source_word: ἀδελφοῦ
  choice: సహోదరుని
  rationale: మూలంలోని పుంలింగ ఏకవచన బంధుత్వ పదాన్ని యథాతథంగా ప్రతిబింబిస్తుంది; విస్తృత అన్వయాన్ని పాదటీపులో తెలియజేస్తుంది.
- source_word: δοκόν
  choice: దూలం
  rationale: ఇల్లు లేదా కట్టడంలో వాడే పెద్ద కలప దూలాన్ని సూచిస్తుంది; చిన్న నలుసుతో ఉన్న అతిశయ వ్యత్యాసాన్ని స్పష్టంగా చూపుతుంది.
- source_word: ἰδίῳ
  choice: నీ సొంత
  rationale: ἴδιοςలోని స్వాధీనతపై గల ఉద్ఘాటనను, సహోదరుని కన్నుతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: κατανοεῖς
  choice: గమనించవు
  rationale: జాగ్రత్తగా గుర్తించడం లేదా గ్రహించడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ βλέπειςతోని వ్యత్యాసాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ἀδελφοῦ అనే లింగసూచక బంధుత్వ పదం
  choice: సహోదరుని
  alternative: సహోదరుడు లేదా సహోదరి; తోటి వ్యక్తి
  rationale: మూలపాఠం పుంలింగ ఏకవచనాన్ని ఉపయోగించినందున ప్రధాన పాఠంలో దాన్ని నిలిపాం. ఈ నైతిక బోధ పురుష సహోదరునికే పరిమితం కాదనే విస్తృత అన్వయాన్ని పాదటీపులో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నరూపాన్ని వాడాం. ‘నలుసు—దూలం’ అనే స్పష్టమైన పరిమాణ వ్యత్యాసం ద్వారా మూలంలోని అతిశయోక్తిని నిలిపాం; ‘చూస్తున్నావు—గమనించవు’ అనే క్రియల వ్యత్యాసం గ్రీకు βλέπεις—κατανοεῖς వ్యంగ్యాన్ని ప్రతిబింబిస్తుంది.
