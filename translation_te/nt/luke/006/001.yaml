    text: అంటే, తినదగిన గింజలు వేరయ్యేలా వారు ధాన్యపు కంకులను చేతుల్లో రుద్దుకున్నారు.
    reason: cultural_note
  revision_rationale: The revision retains the indefinite ‘ఒక’ for the anarthrous Greek expression, preserves the Sabbath as the specific historical referent, and renders the hand-rubbing action precisely. The footnote remains anchored to the preparation action and explains its cultural function without adding interpretation.
