revisions:
- from: ఒక విశ్రాంతి దినాన యేసు పంటచేల గుండా వెళ్తుండగా, ఆయన శిష్యులు ధాన్యపు వెన్నులను తుంచి, చేతులతో నలుపుకొని తింటూ ఉన్నారు.[a]
  to: ఒక సబ్బాతు దినాన ఆయన పంటచేల గుండా వెళ్తుండగా, ఆయన శిష్యులు ధాన్యపు కంకులను తుంచుకుంటూ, వాటిని చేతుల్లో రుద్దుకొని తింటూ ఉన్నారు.[a]
  rationale: The revision retains the indefinite ‘ఒక’ for the anarthrous Greek expression, preserves the Sabbath as the specific historical referent, and renders the hand-rubbing action precisely. The footnote remains anchored to the preparation action and explains its cultural function without adding interpretation.
