id: LUK.6.1
reference: Luke 6:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ⸀σαββάτῳ διαπορεύεσθαι αὐτὸν ⸀διὰ σπορίμων, καὶ ἔτιλλον οἱ μαθηταὶ αὐτοῦ ⸂καὶ ἤσθιον τοὺς στάχυας⸃ ψώχοντες ταῖς χερσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/001.yaml
  text: It happened on a Sabbath that he was passing through grainfields[a], and his disciples were plucking and eating the heads of grain[b], rubbing them in their hands.
translation:
  language: te
  text: ఒక సబ్బాతు దినాన ఆయన పంటచేల గుండా వెళ్తుండగా, ఆయన శిష్యులు ధాన్యపు కంకులను తుంచుకుంటూ, వాటిని చేతుల్లో రుద్దుకొని తింటూ ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, తినదగిన గింజలు వేరయ్యేలా వారు ధాన్యపు కంకులను చేతుల్లో రుద్దుకున్నారు.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ఒక ... దినాన ... వెళ్తుండగా
  rationale: లూకా వాడే కథన పరివర్తనను తెలుగులో సహజమైన సందర్భారంభ వాక్యనిర్మాణంతో వ్యక్తం చేశాం; ప్రత్యేకంగా ‘ఇప్పుడు’ అనే కాలసూచక పదాన్ని చేర్చలేదు.
- source_word: ἐν σαββάτῳ
  choice: ఒక విశ్రాంతి దినాన
  rationale: ఉపపదం లేని గ్రీకు రూపం ఇక్కడ నిర్దిష్టంగా ముందే పేర్కొన్న దినాన్ని కాక, ఒక విశ్రాంతి దిన సందర్భాన్ని సూచించగలదు.
- source_word: διαπορεύεσθαι αὐτὸν διὰ σπορίμων
  choice: యేసు పంటచేల గుండా వెళ్తుండగా
  rationale: అసమాపక క్రియలోని కొనసాగుతున్న చర్యను ‘వెళ్తుండగా’తో చూపించాం. αὐτόν యొక్క సూచిత వ్యక్తిని సందర్భానుసారం ‘యేసు’గా స్పష్టం చేశాం. σπόριμα పంట వేసిన ధాన్యపు చేలను సూచిస్తుంది; పంట రకాన్ని నిర్దిష్టం చేయలేదు.
- source_word: ἔτιλλον ... καὶ ἤσθιον
  choice: తుంచి ... తింటూ ఉన్నారు
  rationale: రెండు అసంపూర్ణ భూతకాల క్రియల కొనసాగుతున్న చర్యను సహజమైన తెలుగు క్రమంలో నిలిపాం.
- source_word: τοὺς στάχυας
  choice: ధాన్యపు వెన్నులను
  rationale: στάχυας అనేది ధాన్యపు మొక్కలలో గింజలు ఉండే వెన్నులు లేదా కంకులను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘వెన్నులు’ సహజమైన వ్యవసాయ పదం.
- source_word: ψώχοντες ταῖς χερσίν
  choice: చేతులతో నలుపుకొని
  rationale: తినదగిన గింజలను వేరుచేయడానికి వెన్నులను చేతుల్లో రుద్దే చర్యను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘సబ్బాతు’ అనే లిప్యంతరీకరణకు బదులుగా సాధారణ పాఠకులకు అర్థమయ్యే ‘విశ్రాంతి దినం’ వాడాం. ప్రధాన పాఠంలోని [a] సూచిక సంబంధిత వివరణ పాదటిప్పణితో సరిపోలుతుంది.
