revisions:
- from: ఇవ్వండి; అప్పుడు మీకు ఇవ్వబడుతుంది. మంచి కొలతతో—నొక్కి కుదించి, కుదుపుతూ నింపి, పొంగిపొర్లేలా—వారు మీ ఒడిలో పోస్తారు.[a] ఎందుకంటే మీరు ఏ కొలతతో కొలుస్తారో, అదే కొలతతో మీకు తిరిగి కొలవబడుతుంది.
  to: ఇవ్వండి; అప్పుడు మీకు ఇవ్వబడుతుంది. నొక్కి కుదించిన, కుదిపిన, పొంగిపొర్లుతున్న మంచి కొలతను వారు మీ ఒడిలో పోస్తారు.[a] ఎందుకంటే మీరు ఏ కొలతతో కొలుస్తారో, అదే కొలతతో మీకు తిరిగి కొలవబడుతుంది.
  rationale: The revision corrects the syntactic role of μέτρον καλὸν by making 'a good measure' the direct object of «పోస్తారు». It also makes all three Greek participles descriptive modifiers of that measure, while preserving the source’s vivid abundance, unspecified ‘they,’ and broad reciprocal saying. The footnote retains the cultural sense of κόλπος without narrowing the verse’s application.
  reviewer_model: gpt-5.6-terra
