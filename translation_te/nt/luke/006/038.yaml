id: LUK.6.38
reference: Luke 6:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δίδοτε, καὶ δοθήσεται ὑμῖν· μέτρον καλὸν πεπιεσμένον ⸀σεσαλευμένον ὑπερεκχυννόμενον δώσουσιν εἰς τὸν κόλπον ὑμῶν· ⸂ᾧ γὰρ μέτρῳ⸃ μετρεῖτε ἀντιμετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/038.yaml
  text: 'Give[a], and it will be given to you: a good measure—pressed down, shaken together, overflowing—they will give into your lap. For with the measure by which you measure[b], it will be measured back to you.'
translation:
  language: te
  text: ఇవ్వండి; అప్పుడు మీకు ఇవ్వబడుతుంది. నొక్కి కుదించిన, కుదిపిన, పొంగిపొర్లుతున్న మంచి కొలతను వారు మీ ఒడిలో పోస్తారు.[a] ఎందుకంటే మీరు ఏ కొలతతో కొలుస్తారో, అదే కొలతతో మీకు తిరిగి కొలవబడుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఒడి’ అంటే కొలిచిన ధాన్యం లేదా ఇతర సరుకును అందుకోవడానికి వస్త్రం ముందుభాగాన్ని మడిచి ఏర్పరచుకున్న చోటు.
    reason: cultural_note
lexical_decisions:
- source_word: δίδοτε
  choice: ఇవ్వండి
  rationale: వర్తమానకాల ఆజ్ఞార్థక బహువచనం. గ్రీకు క్రియాంశాన్ని అతిగా వివరిస్తూ ‘ఇస్తూ ఉండండి’ అనకుండా, సహజమైన సాధారణ ఆజ్ఞగా అనువదించబడింది.
- source_word: δοθήσεται ὑμῖν
  choice: మీకు ఇవ్వబడుతుంది
  rationale: భవిష్యత్ కర్మణి రూపాన్ని తెలుగులో సహజంగా, కర్తను పేర్కొనకుండా నిలుపుతుంది.
- source_word: μέτρον καλὸν
  choice: మంచి కొలతతో
  rationale: కొలిచిన పరిమాణం లేదా కొలతపాత్ర అనే రూపకాన్ని ‘కొలత’ నిలుపుతుంది; ‘ఉదారమైన’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని వ్యాఖ్యాన భావం చేరుతుంది.
- source_word: πεπιεσμένον
  choice: నొక్కి కుదించి
  rationale: పాత్రలో మరింత సరుకు పట్టేలా దానిని ఒత్తి కుదించిన దృశ్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: σεσαλευμένον
  choice: కుదుపుతూ నింపి
  rationale: పాత్రను కుదిపి అందులోని ధాన్యం లేదా సరుకు కిందికి ఒదిగేలా చేయడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὑπερεκχυννόμενον
  choice: పొంగిపొర్లేలా
  rationale: పాత్ర మిక్కిలిగా నిండి దాని అంచులపై నుంచి సరుకు జారిపడే సమృద్ధి దృశ్యాన్ని నిలుపుతుంది.
- source_word: δώσουσιν
  choice: వారు ... పోస్తారు
  rationale: గ్రీకులోని నిర్దిష్టం కాని మూడవ పురుష బహువచన కర్తను ‘వారు’గా నిలిపింది. కొలిచిన సరుకును ఒడిలో వేయడాన్ని తెలుగులో ‘పోస్తారు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς τὸν κόλπον ὑμῶν
  choice: మీ ఒడిలో
  rationale: κόλπος సూచించే ఒడి లేదా వస్త్రపు ముందుమడతకు ఆధునిక తెలుగులో సహజమైన సమానార్థకం; సాంస్కృతిక వివరాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ᾧ γὰρ μέτρῳ μετρεῖτε
  choice: ఎందుకంటే మీరు ఏ కొలతతో కొలుస్తారో
  rationale: కారణసూచక సంబంధాన్ని, కొలత రూపకాన్ని, పరస్పర ప్రతిఫల సూత్రాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: ἀντιμετρηθήσεται ὑμῖν
  choice: అదే కొలతతో మీకు తిరిగి కొలవబడుతుంది
  rationale: ἀντί సూచించే ప్రతిచర్య లేదా తిరిగి లభించే భావాన్ని ‘తిరిగి’ స్పష్టం చేస్తుంది; కర్మణి రూపాన్ని కూడా కాపాడుతుంది.
theological_decisions:
- issue: ఈ మాటను డబ్బు లేదా దానధర్మానికి మాత్రమే పరిమితం చేయాలా, లేక విస్తృతంగానే ఉంచాలా
  choice: ఇవ్వడం మరియు తిరిగి కొలవబడడం అనే విస్తృత భాషను నిలుపడం
  alternative: దీనిని ప్రత్యేకంగా ధనదానం లేదా భౌతిక ఉదారతకు పరిమితం చేయడం
  rationale: లూకా 6 సమీప సందర్భంలో కనికరం, తీర్పు తీర్చకపోవడం, క్షమించడం, ఇవ్వడం ఉన్నాయి. గ్రీకు వాక్యం ధనాన్ని స్పష్టంగా పేర్కొనదు; కాబట్టి అనువాదం సంపద-ప్రతిఫల బోధనను గానీ, కేవలం ఆర్థిక అర్థాన్ని గానీ చేర్చదు.
- issue: δώσουσιν లోని ‘వారు’ ఎవరిని సూచిస్తుంది
  choice: నిర్దిష్టం కాని ‘వారు’ అనే కర్తను నిలుపడం
  alternative: దేవుడే ఇస్తాడని స్పష్టంగా పేర్కొనడం లేదా పూర్తిగా కర్మణి రూపంలో మార్చడం
  rationale: మూల గ్రీకులో మూడవ పురుష బహువచన కర్త ఉన్నా అది ఎవరో చెప్పబడలేదు. అనువాదం ఆ ఉద్దేశపూర్వక అస్పష్టతను పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాన్ని వాడాం. మార్కెట్‌లో కొలతపాత్రను నొక్కి, కుదిపి, నిండుగా పోసే సజీవ దృశ్యాన్ని సహజంగా ఉంచాం. మూలంలో లేని ఆర్థిక లేదా సిద్ధాంతపరమైన పరిమితులను చేర్చలేదు.
