language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ὄχλος ⸀ἐζήτουν ἅπτεσθαι αὐτοῦ, ὅτι δύναμις παρ’ αὐτοῦ ἐξήρχετο καὶ ἰᾶτο πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/019.yaml
  text: And the whole crowd was trying to touch him[a], because power was coming out from him and healing them all.
translation:
  language: te
  text: జనసమూహమంతా ఆయనను తాకడానికి ప్రయత్నిస్తూ ఉండేది, ఎందుకంటే ఆయన నుండి శక్తి వెలువడుతూ ఉండేది[a], అది వారందరినీ స్వస్థపరుస్తూ ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన నుండి బయటకు వెళ్తూ ఉండేది.”
    reason: παρ’ αὐτοῦ ἐξήρχετοకు సాధ్యమైన పదప్రధాన ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: πᾶς ὁ ὄχλος
  choice: జనసమూహమంతా
  rationale: ఏకవచన సమూహవాచకమైన ὄχλοςతో πᾶς కలసి మొత్తం సమూహాన్ని సూచిస్తుంది. ‘జనసమూహమంతా’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ సమష్టి భావాన్ని నిలుపుతుంది.
- source_word: ἐζήτουν
  choice: ప్రయత్నిస్తూ ఉంది
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పదేపదే జరిగిన ప్రయత్నాన్ని సూచిస్తుంది. సమూహవాచక కర్తకు అనుగుణంగా ‘ప్రయత్నిస్తూ ఉంది’ అని అనువదించబడింది.
- source_word: ἅπτεσθαι
  choice: తాకడానికి
  rationale: ఈ స్వస్థత సందర్భంలో ἅπτομαι అంటే సహజంగా ‘తాకు’ అని అర్థం; అవసరం లేని ‘పట్టుకో’ అనే బలమైన భావాన్ని చేర్చలేదు.
- source_word: δύναμις
  choice: శక్తి
  rationale: ఇక్కడ δύναμις యేసు నుండి వెలువడి స్వస్థపరిచే ప్రభావశీల శక్తిని సూచిస్తుంది. మూలంలో లేని ‘అద్భుత శక్తి’ అనే వివరణను జోడించలేదు.
- source_word: παρ’ αὐτοῦ ἐξήρχετο
  choice: ఆయన నుండి శక్తి వెలువడి
  rationale: παράతో కూడిన ἐξέρχομαι ఆయన నుండి శక్తి బయటకు వస్తున్న కొనసాగింపు భావాన్ని ఇస్తుంది. ‘వెలువడి’ ఈ భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἰᾶτο
  choice: స్వస్థపరుస్తూ ఉంది
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగింపు భావాన్ని ‘స్వస్థపరుస్తూ ఉంది’ నిలుపుతుంది.
- source_word: πάντας
  choice: వారందరినీ
  rationale: πάντας అంటే ‘అందరినీ’; సందర్భంలోని ప్రజలను స్పష్టంగా సూచించడానికి సహజమైన తెలుగు సర్వనామ రూపమైన ‘వారందరినీ’ వాడబడింది.
theological_decisions:
- issue: యేసు నుండి వెలువడుతున్న δύναμις స్వభావం
  choice: ‘ఆయన నుండి శక్తి వెలువడి’ అని నేరుగా అనువదించడం
  alternative: ‘ఆయన నుండి అద్భుత శక్తి వెలువడి’
  rationale: వచనం యేసును స్వస్థపరిచే శక్తికి మూలంగా చూపుతుంది. ‘అద్భుత’ అనే పదం సందర్భంలో సూచితమైనా గ్రీకు పాఠ్యంలో స్పష్టంగా లేదు; కాబట్టి అదనపు సిద్ధాంత వివరణ లేకుండా మూల వాదనను నిలిపాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘జనసమూహమంతా’ అనే సమూహవాచక కర్తతో ఏకవచన క్రియాన్వయం ఉంచబడింది; గ్రీకు అసంపూర్ణ భూతకాలంలోని కొనసాగింపు భావం రెండు క్రియల్లోనూ వ్యక్తమైంది.
