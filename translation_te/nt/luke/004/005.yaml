source:
  edition: SBLGNT
  text: Καὶ ἀναγαγὼν ⸀αὐτὸν ἔδειξεν αὐτῷ πάσας τὰς βασιλείας τῆς οἰκουμένης ἐν στιγμῇ χρόνου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/005.yaml
  text: And after leading him up[b][a], he showed him all the kingdoms of the inhabited world in a moment of time.
translation:
  language: te
  text: అపవాది ఆయనను పైకి తీసుకెళ్లి, క్షణకాలంలో[a] మనుషులు నివసించే ప్రపంచంలోని[b] రాజ్యాలన్నిటినీ ఆయనకు చూపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక్క క్షణంలో.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ప్రపంచంలోని.’ గ్రీకు పదం సాధారణంగా ‘మనుషులు నివసించే ప్రపంచం’ అని అర్థమిస్తుంది; కొన్ని సందర్భాల్లో నాగరిక ప్రపంచాన్ని లేదా సామ్రాజ్యాధీన ప్రపంచాన్ని మరింత ప్రత్యేకంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγαγὼν
  choice: పైకి తీసుకెళ్లి
  rationale: పైకి తీసుకెళ్లడం అనే భావాన్ని నిలుపుతూ, లూకా పేర్కొనని ‘కొండ’ వంటి ప్రదేశాన్ని చేర్చదు. గ్రీకు భూతకాల కృదంతపు క్రమాన్ని సహజమైన తెలుగు క్రియాక్రమంతో వ్యక్తపరుస్తుంది.
- source_word: ἔδειξεν
  choice: చూపించాడు
  rationale: δείκνυμι యొక్క సాధారణ కథనార్థాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: πάσας τὰς βασιλείας
  choice: రాజ్యాలన్నిటినీ
  rationale: ఇక్కడ βασιλεία అమూర్తమైన రాజత్వం కంటే రాజ్యాలు లేదా పాలనా ప్రాంతాలను సూచిస్తుంది; πάσας భావాన్ని ‘అన్నిటినీ’ స్పష్టంగా నిలుపుతుంది.
- source_word: τῆς οἰκουμένης
  choice: నివాస ప్రపంచంలోని
  rationale: οἰκουμένη యొక్క ‘మనుషులు నివసించే ప్రపంచం’ అనే ప్రత్యేకతను నిలుపుతుంది; దీనిని రోమా సామ్రాజ్యానికే పరిమితం చేయదు.
- source_word: ἐν στιγμῇ χρόνου
  choice: క్షణకాలంలో
  rationale: సమయం అత్యంత స్వల్పమని తెలిపే గ్రీకు పదబంధాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: అపవాది రాజ్యాలను చూపించిన విధానం
  choice: అతడు చూపించాడని మాత్రమే వర్ణించడం
  alternative: అది దర్శనమని, అద్భుత ప్రదర్శనని, లేదా ఎత్తైన భౌగోళిక స్థలం నుండి చూసిన దృశ్యమని నిర్దిష్టీకరించడం
  rationale: గ్రీకు వాక్యం చూపించిన ప్రక్రియ ఎలా జరిగిందో వివరించదు. కాబట్టి దాని స్వభావాన్ని అనువాదం నిర్ణయించకుండా మూలంలోని అనిశ్చితిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘అపవాది’ అనే కర్తను సందర్భం నుంచి స్పష్టత కోసం వ్యక్తపరచినా, మూలంలోని ‘అతడు’ భావాన్ని మించి ఎలాంటి వివరణను చేర్చలేదు. పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
