- from: అప్పుడు అపవాది ఆయనను పైకి తీసుకెళ్లి, క్షణకాలంలో[a] నివాస ప్రపంచంలోని[b] రాజ్యాలన్నిటినీ ఆయనకు చూపించాడు.
  to: అపవాది ఆయనను పైకి తీసుకెళ్లి, క్షణకాలంలో[a] మనుషులు నివసించే ప్రపంచంలోని[b] రాజ్యాలన్నిటినీ ఆయనకు చూపించాడు.
