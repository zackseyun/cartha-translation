source:
  edition: SBLGNT
  text: Καὶ ὑπέστρεψεν ὁ Ἰησοῦς ἐν τῇ δυνάμει τοῦ πνεύματος εἰς τὴν Γαλιλαίαν. καὶ φήμη ἐξῆλθεν καθ’ ὅλης τῆς περιχώρου περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/014.yaml
  text: And Jesus returned to Galilee in the power of the Spirit[a], and a report about him went out through all the surrounding region.
translation:
  language: te
  text: యేసు ఆత్మ శక్తితో గలిలయకు తిరిగి వచ్చాడు. ఆయనను గురించిన వార్త[a] చుట్టుపక్కల ప్రాంతమంతటా వ్యాపించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సమాచారం,’ ‘ఖ్యాతి,’ ‘వదంతి.’ గ్రీకు పదం విస్తృతంగా వ్యాపించే వార్తను సూచించగలదు; అది అనుకూలమైనదా ప్రతికూలమైనదా అని స్వయంగా నిర్దేశించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψεν
  choice: తిరిగి వచ్చాడు
  rationale: కథనంలో తిరిగి రావడాన్ని సూచించే ὑποστρέφω పదానికి ఇది సహజమైన, దిశాభావాన్ని నిలుపుకునే తెలుగు ప్రయోగం.
- source_word: ἐν τῇ δυνάμει
  choice: శక్తితో
  rationale: ఈ పదబంధం యేసు తిరిగి వచ్చినప్పుడు ఆయనలో కార్యసాధకంగా ఉన్న ఆత్మ శక్తిని సూచిస్తుంది. తెలుగులో ‘శక్తితో’ సహజంగా ఉండి, విధానం లేదా పరిధి అనే గ్రీకు భావాన్ని అతిగా నిర్ధారించదు.
- source_word: τοῦ πνεύματος
  choice: ఆత్మ
  rationale: సమీప సందర్భంలో ఇది పరిశుద్ధాత్మను సూచిస్తుంది. అయితే ఈ వచనంలో ‘పరిశుద్ధ’ అనే విశేషణం లేనందున దానిని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: గలిలయకు
  rationale: ప్రయాణ గమ్యాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: φήμη
  choice: వార్త
  rationale: ఒక వ్యక్తిని గురించి విస్తృతంగా వ్యాపించే సమాచారం లేదా నివేదిక అనే భావాన్ని ఇస్తుంది; అది అనుకూలమా ప్రతికూలమా అని ముందే నిర్ణయించదు.
- source_word: ἐξῆλθεν
  choice: వ్యాపించింది
  rationale: గ్రీకులోని ‘బయలుదేరింది/వెల్లింది’ అనే రూపకాన్ని తెలుగులో వార్త ప్రసరించడాన్ని సహజంగా తెలియజేసే విధంగా వ్యక్తం చేస్తుంది.
- source_word: καθ’ ὅλης τῆς περιχώρου
  choice: చుట్టుపక్కల ప్రాంతమంతటా
  rationale: సమీపంలోని మొత్తం ప్రాంతం అంతటా అనే భౌగోళిక, విస్తరణ భావాలను స్పష్టంగా నిలుపుతుంది.
- source_word: περὶ αὐτοῦ
  choice: ఆయనను గురించిన
  rationale: περί యొక్క ‘గురించి’ అనే సంబంధార్థాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: πνεύματος పదం ఎవరిని సూచిస్తుంది?
  choice: ‘ఆత్మ’ ఇక్కడ పరిశుద్ధాత్మను సూచిస్తుంది
  alternative: నిర్దిష్టత లేని ఆత్మ లేదా యేసు అంతరాత్మ
  rationale: లూకా 4 సమీప సందర్భంలో యేసు పరిశుద్ధాత్మతో నింపబడటం, ఆత్మచేత నడిపించబడటం చెప్పబడింది. అయినప్పటికీ మూలంలో ఈ వచనంలో ‘పరిశుద్ధ’ అనే పదం లేదు కాబట్టి ‘ఆత్మ’ అనే రూపాన్నే ఉంచడం సందర్భార్థాన్నీ మూలపద రూపాన్నీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఆత్మ శక్తితో’ అనే సంక్షిప్త రూపం మూలంలోని సంబంధాన్ని అతిగా వ్యాఖ్యానించకుండా ఉంచుతుంది. ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదసూచిక గుర్తు ‘Spirit’ తరువాత ఉన్నప్పటికీ, దాని విషయం φήμη (‘వార్త’) గురించినది కాబట్టి తెలుగులో గుర్తును సరైన పదమైన ‘వార్త’కు జతచేశాం.
