  text: Καὶ κατῆλθεν εἰς Καφαρναοὺμ πόλιν τῆς Γαλιλαίας. καὶ ἦν διδάσκων αὐτοὺς ἐν τοῖς σάββασιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/031.yaml
  text: And he went down to Capernaum[a], a city of Galilee. And he was teaching them on the Sabbaths.
translation:
  language: te
  text: ఆయన గలిలయలోని ఒక పట్టణమైన కపెర్నహూముకు దిగివెళ్లాడు. సబ్బాతు దినాల్లో[a] ఆయన వారికి బోధిస్తూ ఉండేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో ఇది బహువచనం—‘సబ్బాతు దినాల్లో.’ ఇది పలు సబ్బాతు దినాల సందర్భాల్లో ఆయన బోధించాడని సూచించవచ్చు. తెలుగులో సందర్భానుసారంగా ‘సబ్బాతు దినాన’ అని కూడా చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατῆλθεν
  choice: దిగివెళ్లాడు
  rationale: κατέρχομαι లోని కిందికి ప్రయాణించే దిశాభావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; కేవలం ‘వెళ్లాడు’ అని సరళీకరించదు.
- source_word: Καφαρναοὺμ
  choice: కపెర్నహూము
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన స్థలనామ రూపం.
- source_word: πόλιν τῆς Γαλιλαίας
  choice: గలిలయలోని కపెర్నహూము పట్టణానికి
  rationale: జనిటివ్‌కు ఇక్కడ సహజమైన స్థానార్థాన్ని ఇస్తూ, కపెర్నహూము గలిలయలోని ఒక పట్టణమని స్పష్టం చేస్తుంది; గ్రీకులోని నిర్దిష్ట ఆర్టికల్ లేని πόλιν‌ను ‘ఆ పట్టణం’గా మార్చదు.
- source_word: ἦν διδάσκων
  choice: బోధిస్తూ ఉండేవాడు
  rationale: పెరిఫ్రాస్టిక్ ఇంపర్ఫెక్ట్ సూచించే కొనసాగుతున్న లేదా పునరావృతమైన బోధనా క్రియను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτοὺς
  choice: వారికి
  rationale: ఈ వచనంలో స్పష్టమైన నామవాచక పూర్వపదం లేనందున ‘ప్రజలకు’ వంటి వివరణను చేర్చకుండా సర్వనామాన్నే నిలుపుతుంది.
- source_word: ἐν τοῖς σάββασιν
  choice: విశ్రాంతి దినాల్లో
  rationale: σάββασιν అనే బహువచనాన్ని నిలుపుతూ, పలు విశ్రాంతి దినాల సందర్భాల్లో జరిగిన బోధన అనే పునరావృత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: σάββασιν అనే బహువచనాన్ని ఏకవచనంగా సరళీకరించాలా
  choice: విశ్రాంతి దినాల్లో
  alternative: విశ్రాంతి దినాన
  rationale: ఇది ప్రధాన సిద్ధాంతాంశం కాకపోయినా, యేసు ఒకే సందర్భంలో కాక పునరావృతంగా బోధించాడనే గ్రీకు వాక్యంలోని సాధ్యమైన భావాన్ని బహువచనం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘బోధిస్తూ ఉండేవాడు’ అనే రూపం కొనసాగింపు మరియు పునరావృత భావాలను మోస్తుంది. గ్రీకులోని రెండో καί ను తెలుగులో యాంత్రికంగా ‘మరియు’ అని పెట్టకుండా వాక్యప్రవాహంలో సహజంగా వ్యక్తం చేశాం.
