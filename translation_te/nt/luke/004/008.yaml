source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸂ὁ Ἰησοῦς εἶπεν αὐτῷ⸃· Γέγραπται· ⸂Κύριον τὸν θεόν σου προσκυνήσεις⸃ καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/008.yaml
  text: 'And Jesus answered him[a], “It is written: ‘You shall worship the Lord your God[b], and you shall serve only him.’”'
translation:
  language: te
  text: 'యేసు అతనికి ఇలా జవాబిచ్చాడు: “ఇలా రాసి ఉంది: ‘నీ దేవుడైన ప్రభువును ఆరాధించాలి[a]; ఆయనను మాత్రమే సేవించాలి.’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నీ దేవుడైన ప్రభువు ఎదుట వంగి నమస్కరించాలి.”
    reason: lexical_alternative
  - marker: b
    text: ఈ ఉటంకింపు ద్వితీయోపదేశకాండము 6:13ను ప్రతిధ్వనిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν αὐτῷ
  choice: అతనికి ఇలా జవాబిచ్చాడు
  rationale: గ్రీకు కథనంలోని కృదంతం–ప్రధాన క్రియ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో ఒకే జవాబు క్రియగా వ్యక్తం చేస్తూ, ప్రతిస్పందన భావాన్నీ పరోక్ష కర్మనూ నిలుపుతుంది.
- source_word: Γέγραπται
  choice: ఇలా రాసి ఉంది
  rationale: లేఖనాన్ని ఉటంకించడానికి వాడే పూర్ణ భూత కర్మణి రూపం; వ్రాయబడినది ఇప్పటికీ ప్రమాణంగా నిలిచి ఉందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: Κύριον τὸν θεόν σου
  choice: నీ దేవుడైన ప్రభువును
  rationale: κύριοςను ‘ప్రభువు’గా, θεόν σουను ‘నీ దేవుడు’గా నేరుగా అందిస్తూ, రెండూ ఒకే వ్యక్తిని సూచిస్తున్న అన్వయాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: προσκυνήσεις
  choice: ఆరాధించాలి
  rationale: దేవునికి అర్పించే భక్తిపూర్వక నమస్కారం అనే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది; శారీరకంగా వంగి నమస్కరించడం అనే మూల చిత్రాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: λατρεύσεις
  choice: సేవించాలి
  rationale: దేవునికి చేసే మతపరమైన సేవను సూచిస్తుంది. ‘సేవించాలి’ సంక్షిప్తంగా, సహజంగా ఉండగా ఆరాధనా సందర్భం దాని పవిత్ర సేవ భావాన్ని కాపాడుతుంది.
- source_word: αὐτῷ μόνῳ
  choice: ఆయనను మాత్రమే
  rationale: సేవ ఎవరికి చెందాలో తెలిపే ప్రత్యేకతను కాపాడుతుంది; ‘మాత్రమే’ను ‘ఆయనను’తో ఉంచడం ద్వారా దేవునికే సేవ చేయాలనే గ్రీకు ఉద్ఘాటన సహజమైన తెలుగులో వ్యక్తమవుతుంది.
theological_decisions:
- issue: దేవుణ్ణి సూచించే లేఖన ఉటంకింపులో κύριος అనువాదం
  choice: ప్రభువు
  alternative: యెహోవా / యెహోవా దేవుడు
  rationale: ద్వితీయోపదేశకాండంలోని హీబ్రూ నేపథ్యం దైవనామాన్ని కలిగి ఉన్నప్పటికీ, లూకా గ్రీకు పాఠం κύριον అని ఉంది. కాబట్టి కొత్త నిబంధన పాఠంలో లేని దైవనామాన్ని చేర్చకుండా ‘ప్రభువు’ అని అనువదించాం.
- issue: προσκυνήσειςలోని శారీరక నమస్కారం మరియు ఆరాధన భావాలు
  choice: ఆరాధించాలి
  alternative: వంగి నమస్కరించాలి
  rationale: దేవునిపట్ల ప్రత్యేక భక్తి, సేవ అనే ఈ సందర్భంలో ‘ఆరాధించాలి’ ప్రధాన భావాన్ని సరిగ్గా అందిస్తుంది; మూలపదంలోని శారీరక చిత్రాన్ని పాదసూచిక ద్వారా సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఇలా రాసి ఉంది’ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే లేఖన-ఉటంకింపు సూత్రం. దేవుణ్ణి సూచించే సర్వనామానికి గౌరవార్థక ఏకవచనమైన ‘ఆయనను’ వాడాం.
