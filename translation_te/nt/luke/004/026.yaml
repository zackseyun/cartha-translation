  to: ఏలీయా వారిలో ఎవరి దగ్గరికీ పంపబడలేదు; సీదోనుకు చెందిన సారెపతులోని ఒక విధవరాలి దగ్గరకు మాత్రమే పంపబడ్డాడు.[a]
