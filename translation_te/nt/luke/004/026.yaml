id: LUK.4.26
reference: Luke 4:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πρὸς οὐδεμίαν αὐτῶν ἐπέμφθη Ἠλίας εἰ μὴ εἰς Σάρεπτα τῆς ⸀Σιδωνίας πρὸς γυναῖκα χήραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/026.yaml
  text: And Elijah was sent to none of them[a], except to Zarephath of Sidon, to a widow.
translation:
  language: te
  text: ఏలీయా వారిలో ఎవరి దగ్గరికీ పంపబడలేదు; సీదోనుకు చెందిన సారెపతులోని ఒక విధవరాలి దగ్గరకు మాత్రమే పంపబడ్డాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో, “సీదోనుకు చెందిన సారెపతు.” దీనిని సాంప్రదాయంగా 1 రాజులు 17:9లోని సారెపతుగా గుర్తిస్తారు.
    reason: గ్రీకు స్థలనామ రూపాన్ని తెలియజేసి, పాత నిబంధనలోని సంబంధిత ప్రస్తావనతో సంబంధాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: ἐπέμφθη
  choice: పంపబడలేదు / పంపబడ్డాడు
  rationale: మూలంలోని కర్మణి ప్రయోగాన్ని నిలిపి, పంపిన వ్యక్తి దేవుడని పాఠ్యంలో స్పష్టంగా చేర్చకుండా ఉంచుతుంది.
- source_word: πρὸς οὐδεμίαν αὐτῶν
  choice: వారిలో ఎవరి దగ్గరికీ
  rationale: వ్యక్తుల వైపు పంపబడటాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపి, οὐδεμίαν లోని సంపూర్ణ మినహాయింపును కాపాడుతుంది.
- source_word: Ἠλίας
  choice: ఏలీయా
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన పేరురూపం.
- source_word: εἰ μὴ
  choice: దగ్గరికే
  rationale: తెలుగులో ‘తప్ప’ అనే పదాన్ని యాంత్రికంగా వాడకుండా, ఏకారంతో మినహాయింపు భావాన్ని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: Σάρεπτα
  choice: సారెపతు
  rationale: 1 రాజులు 17:9లోని పాత నిబంధన స్థలనామంతో సంబంధాన్ని గుర్తించగల సుపరిచిత తెలుగు రూపం.
- source_word: τῆς Σιδωνίας
  choice: సీదోను ప్రాంతంలోని
  rationale: జనిటివ్ ద్వారా సూచించిన భౌగోళిక అనుబంధాన్ని ‘సీదోను పట్టణంలోనే’ అని అతిగా నిర్దిష్టం చేయకుండా ప్రాంత సంబంధంగా అందిస్తుంది.
- source_word: γυναῖκα χήραν
  choice: ఒక విధవరాలి
  rationale: ‘ఒక స్త్రీ, విధవరాలు’ అనే అన్వయాన్ని అర్థనష్టం లేకుండా సహజమైన తెలుగులో సంక్షిప్తంగా అందిస్తుంది.
theological_decisions:
- issue: ఏలీయాను పంపినవారు ఎవరు?
  choice: పంపిన కర్తను పేర్కొనకుండా కర్మణి ప్రయోగాన్ని నిలిపివేయడం
  alternative: ‘దేవుడు ఏలీయాను పంపాడు’ అని కర్తను స్పష్టంగా చేర్చడం
  rationale: సందర్భం దేవుని కార్యాన్ని సూచించినా, గ్రీకు వాక్యం పంపిన కర్తను పేరుతో చెప్పదు. అందువల్ల మూలపాఠ్యంలోని నియంత్రణను అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘వారిలో’ అన్నది ముందరి వచనంలో ప్రస్తావించిన విధవరాళ్లను సూచిస్తుంది. మినహాయింపును ‘దగ్గరికే’ అనే ఏకారంతో బలంగా వ్యక్తం చేసింది.
