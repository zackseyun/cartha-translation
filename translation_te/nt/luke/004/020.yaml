    rationale: గ్రంథపు చుట్టను చుట్టి repeats the same root in close succession. A minor stylistic revision improves readability without changing meaning.
  - severity: low
    issue: Ongoing force of ἦσαν ἀτενίζοντες is understated
    rationale: కళ్లూ ఆయన మీదే నిలిచాయి communicates attention but is less explicit about the continuing, intent gaze expressed by the Greek periphrastic construction.
