id: LUK.4.20
reference: Luke 4:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πτύξας τὸ βιβλίον ἀποδοὺς τῷ ὑπηρέτῃ ἐκάθισεν· καὶ πάντων ⸂οἱ ὀφθαλμοὶ ἐν τῇ συναγωγῇ⸃ ἦσαν ἀτενίζοντες αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/020.yaml
  text: And after rolling up the scroll and giving it back to the attendant[a], he sat down[b]. And the eyes of everyone in the synagogue were fixed on him.
translation:
  language: te
  text: ఆయన గ్రంథచుట్టను[a] చుట్టివేసి, దాన్ని పరిచారకునికి[b] తిరిగి ఇచ్చి కూర్చున్నాడు. సమాజమందిరంలో ఉన్న వారందరి కళ్లు ఆయనవైపు తదేకంగా చూస్తూ ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గ్రంథం.’ గ్రీకు పదం సాధారణంగా లిఖిత గ్రంథాన్ని సూచించగలదు; అయితే ఈ సమాజమందిర సందర్భంలో అది గ్రంథపు చుట్టగా ఉండేది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, గ్రంథపు చుట్టలను నిర్వహించే బాధ్యతగల సమాజమందిర పరిచారకుడు.
    reason: cultural_note
lexical_decisions:
- source_word: πτύξας
  choice: చుట్టి
  rationale: మొదటి శతాబ్దపు సమాజమందిరంలో ఉపయోగించిన గ్రంథపు చుట్టను చదివిన తర్వాత తిరిగి చుట్టే చర్యను ఇది సహజంగా, చారిత్రక సందర్భానికి తగినట్లు తెలియజేస్తుంది.
- source_word: βιβλίον
  choice: గ్రంథపు చుట్ట
  rationale: ఈ పదం సాధారణంగా లిఖిత గ్రంథాన్ని సూచించగలిగినా, యెషయా గ్రంథాన్ని చదివిన ఈ సమాజమందిర సందర్భంలో అది చుట్ట రూపంలో ఉండేది; అందువల్ల ఈ పదబంధం చారిత్రక రూపాన్ని స్పష్టం చేస్తుంది.
- source_word: ἀποδοὺς
  choice: తిరిగి ఇచ్చి
  rationale: వాడిన వస్తువును దాని బాధ్యతగల వ్యక్తికి తిరిగి అప్పగించడమనే సంయుక్త క్రియ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὑπηρέτῃ
  choice: పరిచారకునికి
  rationale: సమాజమందిర ఆరాధనలో గ్రంథపు చుట్టలను నిర్వహిస్తూ సహాయం చేసే వ్యక్తిని సూచించడానికి ‘పరిచారకుడు’ ఆధునిక తెలుగులో గౌరవప్రదమైన, తప్పుదారి పట్టించని పదం.
- source_word: ἐκάθισεν
  choice: కూర్చున్నాడు
  rationale: కథనంలోని చర్యను నేరుగా తెలియజేస్తుంది; ఆయన బోధించే భంగిమను ప్రధాన వాక్యంలో అదనంగా వివరించదు.
- source_word: πάντων οἱ ὀφθαλμοὶ
  choice: వారందరి కళ్లూ
  rationale: గ్రీకులోని ‘అందరి కళ్లు’ అనే సజీవమైన చిత్రణను సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: ἀτενίζοντες αὐτῷ
  choice: ఆయన మీదే నిలిచాయి
  rationale: కొనసాగిన ఏకాగ్ర దృష్టిని తెలియజేస్తుంది; విరోధభావం లేదా మర్యాదలేని తదేక చూపు వంటి అదనపు భావాన్ని చేర్చదు.
- source_word: συναγωγῇ
  choice: సమాజమందిరంలో
  rationale: యూదుల ఆరాధన, బోధన జరిగే స్థలాన్ని సూచించే, తెలుగు బైబిలు సందర్భంలో సులభంగా అర్థమయ్యే పదం.
theological_decisions:
- issue: సమాజమందిర ఆరాధనలో βιβλίον యొక్క చారిత్రక రూపం
  choice: ‘పుస్తకం’ అనే సాధారణ పదానికి బదులుగా ‘గ్రంథపు చుట్ట’ అని అనువదించడం.
  alternative: పుస్తకం / గ్రంథం
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కాదు; మూల సందర్భంలో యెషయా గ్రంథం చుట్ట రూపంలో ఉండేదనే చారిత్రక వాస్తవాన్ని స్పష్టంగా ప్రతిబింబించే అనువాద నిర్ణయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని చర్యల క్రమాన్ని, ‘కళ్లూ ... నిలిచాయి’ అనే సజీవ చిత్రణను నిలిపి, చారిత్రక సందర్భాన్ని అవసరమైన చోట పాదసూచనలతో వివరించాం.
