source:
  edition: SBLGNT
  text: Ἀναστὰς δὲ ⸀ἀπὸ τῆς συναγωγῆς εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος. πενθερὰ δὲ τοῦ Σίμωνος ἦν συνεχομένη πυρετῷ μεγάλῳ, καὶ ἠρώτησαν αὐτὸν περὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/038.yaml
  text: And after rising from the synagogue[a], he entered Simon’s house. Now Simon’s mother-in-law was afflicted with a high fever, and they asked him about her.
translation:
  language: te
  text: ఆయన లేచి, సమాజమందిరం నుండి బయలుదేరి సీమోను ఇంట్లోకి ప్రవేశించాడు. సీమోను అత్త తీవ్రమైన జ్వరంతో బాధపడుతూ ఉంది. ఆమె గురించి వారు ఆయనను అడిగారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆమె కోసం ఆయనను వేడుకున్నారు.’ గ్రీకు పదబంధానికి అక్షరార్థంగా ‘ఆమె గురించి ఆయనను అడిగారు’ అని అర్థం; ఈ సందర్భంలో ఆమెకు సహాయం చేయమనే విన్నపం ఇందులో సూచితమై ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς δὲ ἀπὸ τῆς συναγωγῆς
  choice: ఆయన సమాజమందిరం నుంచి లేచి వెళ్లి
  rationale: అనంతర క్రియను సూచించే aorist participleను, ἀπό తెలిపే స్థలంనుంచి కదలికతో కలిపి సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. ‘లేచి వెళ్లి’ అనేది కేవలం నిలబడటమే కాక సమాజమందిరాన్ని విడిచి వెళ్లిన భావాన్నీ సందర్భానుసారంగా అందిస్తుంది.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος
  choice: సీమోను ఇంట్లోకి ప్రవేశించాడు
  rationale: εἰσέρχομαι + εἰς తెలిపే లోపలికి ప్రవేశించే కదలికను స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: πενθερὰ τοῦ Σίμωνος
  choice: సీమోను అత్త
  rationale: πενθεράకు సాధారణ ఆధునిక తెలుగు బంధుత్వ పదం ‘అత్త’; మూలంలో ఉన్న బంధాన్ని మాత్రమే తెలుపుతూ అదనపు వివరణను ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: ἦν συνεχομένη πυρετῷ μεγάλῳ
  choice: తీవ్రమైన జ్వరంతో బాధపడుతోంది
  rationale: συνέχω passive భావంలోని వ్యాధి పట్టి పీడిస్తున్న స్థితిని ‘బాధపడుతోంది’ సహజంగా తెలియజేస్తుంది; πυρετῷ μεγάλῳలో μέγας జ్వర తీవ్రతను సూచిస్తుందని ‘తీవ్రమైన’గా అనువదించబడింది.
- source_word: ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: ఆమె విషయమై వారు ఆయనను అడిగారు
  rationale: ἐρωτάωకు ‘అడుగు/విన్నవించు’ అనే భావ పరిధి ఉంది. ‘ఆమె విషయమై అడిగారు’ మూలంలోని తక్కువ నిర్దిష్టమైన వ్యక్తీకరణను నిలుపుతుంది; సహాయం కోరిన భావాన్ని పాఠ్యంలో స్పష్టంగా చేర్చదు.
theological_decisions:
- issue: πενθερά వల్ల సూచితమయ్యే సీమోను వివాహ స్థితి
  choice: బంధుత్వాన్ని ‘సీమోను అత్త’ అని నేరుగా అనువదించడం
  alternative: ‘సీమోను భార్య తల్లి’ అని విపులీకరించడం లేదా అతని వివాహ స్థితిపై వివరణ జోడించడం
  rationale: వచనం తెలిపే బంధాన్ని నమ్మకంగా అందిస్తూ, దాని నుంచి సిద్ధాంతపరమైన లేదా చారిత్రక నిర్ధారణలను అనువాదంలో చేర్చకుండా ఉంటుంది.
- issue: ἠρώτησαν αὐτὸν περὶ αὐτῆςలో అభ్యర్థన స్వభావం
  choice: ‘ఆమె విషయమై వారు ఆయనను అడిగారు’ అని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘ఆమె కోసం ఆయనను వేడుకున్నారు’ లేదా ‘ఆమెను స్వస్థపరచమని అడిగారు’
  rationale: సందర్భం సహాయం లేదా స్వస్థత కోసం విన్నపాన్ని సూచించినా, గ్రీకు పదబంధం దాన్ని అంత స్పష్టంగా చెప్పదు. అందువల్ల ప్రధాన పాఠ్యం మూలంలోని సంయమనాన్ని కాపాడి, సందర్భోచిత భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. ‘సమాజమందిరం’, ‘ప్రవేశించాడు’, ‘ఆమె విషయమై’ వంటి పదాలు సామాన్య పాఠకులకు అర్థమయ్యేలా ఉండి, వచన గంభీరతను నిలుపుతాయి. పాదసూచిక సూచిక [a] సంబంధిత అభ్యర్థన వాక్యం వద్ద ఉంచబడింది.
