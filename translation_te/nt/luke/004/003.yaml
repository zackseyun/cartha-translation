id: LUK.4.3
reference: Luke 4:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ αὐτῷ ὁ διάβολος· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ τῷ λίθῳ τούτῳ ἵνα γένηται ἄρτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/003.yaml
  text: Then the devil said to him[a], “If you are the Son of God, tell this stone to become bread.”
translation:
  language: te
  text: అప్పుడు అపవాది ఆయనతో, “నీవు దేవుని కుమారుడివైతే, ఈ రాయితో రొట్టెగా మారమని చెప్పు” అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు దేవుని కుమారుడివి గనుక.” సవాలు కోసం ఆ విషయాన్ని నిజమని అంగీకరిస్తున్న భావంలో గ్రీకు షరతును అర్థం చేసుకోవచ్చు; అయితే ప్రధాన పాఠం దాని షరతు రూపాన్ని నిలుపుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇది స్వల్ప అనుసంధాన పదం; కథనంలోని తదుపరి సంఘటనను సహజంగా సూచించడానికి ‘అప్పుడు’ సరిపోతుంది.
- source_word: διάβολος
  choice: అపవాది
  rationale: ఈ సందర్భంలో ఇది సాతానును సూచించే వ్యక్తిగత బిరుదు. ఆధునిక ప్రామాణిక తెలుగు బైబిలు భాషలో ‘అపవాది’ స్పష్టమైన, స్థిరమైన పదం.
- source_word: Εἰ
  choice: అయితే
  rationale: గ్రీకు షరతును పరిష్కరించకుండా కాపాడుతుంది. తెలుగులో ‘నీవు ... కుమారుడివైతే’ అనే నిర్మాణం సవాలులోని షరతు భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: దేవుని కుమారుడు
  rationale: ఈ క్రీస్తుసంబంధ సందర్భంలో ఇది అనిర్దిష్టమైన ‘ఒక కుమారుడు’ కాదు; గుర్తింపబడిన బిరుదు. తెలుగు వాక్యంలో ‘దేవుని కుమారుడివైతే’గా సహజంగా రూపాంతరం చెందుతుంది.
- source_word: εἰπὲ
  choice: చెప్పు
  rationale: λέγω అనే క్రియ యొక్క సాధారణ అర్థాన్నే నిలుపుతుంది; ‘ఆజ్ఞాపించు’ అనడం మూలపదం కంటే బలమైన వ్యాఖ్యానం అవుతుంది.
- source_word: τῷ λίθῳ τούτῳ
  choice: ఈ రాయి ... దానితో
  rationale: λίθοςకు ‘రాయి’ సహజమైన సమానార్థకం; సూచనార్థకమైన ‘ఈ’ను నిలిపి, తెలుగులో చెప్పే క్రియకు తగినట్లుగా ‘దానితో’ చేర్చబడింది.
- source_word: ἵνα γένηται
  choice: మారాలని
  rationale: మాట్లాడే క్రియ తరువాత ἵναతో వచ్చిన భావాన్ని తెలుగులో సహజమైన పరోక్ష ఆజ్ఞ నిర్మాణమైన ‘మారాలని ... చెప్పు’గా వ్యక్తపరుస్తుంది.
- source_word: ἄρτος
  choice: రొట్టె
  rationale: ἄρτοςకు నేరుగా సరిపోయే సాధారణ తెలుగు పదం. ‘ఆహారం’ చాలా విస్తృతం; ‘ఒక రొట్టె’ అని సంఖ్యను చేర్చడం మూలంలో లేనిది.
theological_decisions:
- issue: εἰ υἱὸς εἶ τοῦ θεοῦ అనే షరతు వాక్యభాగపు భావబలం
  choice: నీవు దేవుని కుమారుడివైతే
  alternative: నీవు దేవుని కుమారుడివి గనుక
  rationale: ప్రధాన పాఠం గ్రీకు షరతు రూపాన్ని నిలుపుతుంది; దాన్ని ముందే అంగీకరించిన వాస్తవంగా మార్చదు. దీనివల్ల యేసు కుమారత్వాన్ని నిరాకరించకుండానే శోధనలోని కథనాత్మక, దైవశాస్త్రీయ ఉద్రిక్తత నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘ఆయనతో’ గౌరవ సూచకంగా ఉంది; ప్రత్యక్ష సంభాషణలోని ఏకవచన ‘నీవు’ మూలంలోని సూటి సవాలును నిలుపుతుంది.
