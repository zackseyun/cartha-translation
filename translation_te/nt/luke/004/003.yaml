  to: అప్పుడు అపవాది ఆయనతో, “నీవు దేవుని కుమారుడివైతే, ఈ రాయితో రొట్టెగా మారమని చెప్పు” అన్నాడు.[a]
  rationale: 'The revision makes only a syntactic-naturalness adjustment: it renders the imperative addressed to the stone in idiomatic Telugu while preserving the Greek conditional challenge, demonstrative reference, and command that the stone become bread. The alternative-reading footnote remains warranted and is retained unchanged in meaning.'
