  to: అపవాది ఆయనతో, “నీకు ఈ అధికారమంతటినీ, వాటి మహిమనూ[a] ఇస్తాను. ఎందుకంటే అది నాకు అప్పగించబడింది; నేను కోరినవారికి దానిని ఇస్తూ ఉంటాను” అన్నాడు.
