id: LUK.4.6
reference: Luke 4:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ διάβολος· Σοὶ δώσω τὴν ἐξουσίαν ταύτην ἅπασαν καὶ τὴν δόξαν αὐτῶν, ὅτι ἐμοὶ παραδέδοται καὶ ᾧ ⸀ἂν θέλω δίδωμι αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/006.yaml
  text: And the devil said to him[a], “I will give you all this authority and their glory, because it has been handed over to me, and I give it to whomever I want.”
translation:
  language: te
  text: అపవాది ఆయనతో, “నీకు ఈ అధికారమంతటినీ, వాటి మహిమనూ[a] ఇస్తాను. ఎందుకంటే అది నాకు అప్పగించబడింది; నేను కోరినవారికి దానిని ఇస్తూ ఉంటాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వాటి వైభవాన్ని.” ఇక్కడ గ్రీకు పదం మహిమ, వైభవం లేదా గొప్పదనం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: అపవాది
  rationale: శోధన కథనంలో ఇది సాతానుకు వ్యక్తిగత బిరుదుగా వాడబడింది. ‘అపవాది’ అనే స్థిరమైన తెలుగు బైబిలు పదం ఆ వ్యక్తిగత సూచనను నిలుపుతుంది.
- source_word: Σοὶ δώσω
  choice: నీకు ... ఇస్తాను
  rationale: ముందుకు తెచ్చిన దత్తి సర్వనామంలోని ఉద్ఘాటనను సహజమైన తెలుగు పదక్రమంలో ‘నీకు’ను ముందుగా ఉంచి వ్యక్తం చేసింది.
- source_word: ἐξουσίαν
  choice: అధికారం
  rationale: ఈ సందర్భంలో ఇది బలాన్ని మాత్రమే కాక పరిపాలించే హక్కు లేదా అధికారాన్ని సూచిస్తుంది.
- source_word: ταύτην ἅπασαν
  choice: ఈ ... అంతటినీ
  rationale: దర్శింపబడిన రాజ్యాలపై ఉన్న అధికారపు సంపూర్ణతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: δόξαν αὐτῶν
  choice: వాటి మహిమ
  rationale: మునుపటి వచనంలో చూపబడిన రాజ్యాల ప్రతిష్ఠ, వైభవం అనే భావాన్ని ‘మహిమ’ నిలుపుతుంది; ‘వాటి’ ఆ రాజ్యాలను సూచిస్తుంది.
- source_word: παραδέδοται
  choice: అది నాకు అప్పగించబడింది
  rationale: గతంలో జరిగిన అప్పగింత ఫలితం కొనసాగుతున్నదనే పరిపూర్ణ కర్మణి భావాన్ని నిలుపుతుంది; ఆ వాదన చట్టబద్ధమని అనువాదం అదనంగా సూచించదు.
- source_word: ᾧ ἂν θέλω
  choice: నేను కోరినవారికి
  rationale: అపవాది తన ఇష్టానుసారంగా ఎవరికి ఇవ్వాలనుకుంటే వారికి ఇస్తానని చేసే వాదనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δίδωμι αὐτήν
  choice: దాన్ని ఇస్తాను
  rationale: వర్తమాన కాలంలోని సాధారణ లేదా అలవాటైన చర్య భావాన్ని తెలుగు సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది; ‘దాన్ని’ ప్రధానంగా ‘అధికారాన్ని’ సూచిస్తుంది.
theological_decisions:
- issue: రాజ్యాలపై అధికారం తనకు అప్పగించబడిందనే అపవాది వాదనను అనువాదం సమర్థిస్తున్నదా అన్న ప్రశ్న
  choice: ఇది అపవాది నేరుగా చేసిన వాదనగానే ఎలాంటి సంపాదకీయ వ్యాఖ్య లేకుండా అనువదించడం
  alternative: ‘తన వాదన ప్రకారం’ వంటి దూరం చూపే మాటలను చేర్చడం
  rationale: గ్రీకు పాఠం దీనిని అపవాది ప్రత్యక్ష ప్రసంగంగా ఇస్తుంది. అనువాదం అతని వాదనను బలహీనపరచకూడదు, అలాగే దాన్ని నిజమని ప్రత్యేకంగా ధ్రువీకరించకూడదు; వక్తను కథనం ఇప్పటికే స్పష్టంగా గుర్తించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి వాడబడింది. ‘అపవాది’ వ్యక్తిగత బిరుదుగా, ‘అధికారం’ పరిపాలనా భావంతో వాడబడ్డాయి. పాదసూచిక గుర్తు సంబంధిత పదమైన ‘మహిమనూ’ వెంట ఉంచబడింది.
