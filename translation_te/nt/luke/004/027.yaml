source:
  edition: SBLGNT
  text: καὶ πολλοὶ λεπροὶ ἦσαν ⸂ἐν τῷ Ἰσραὴλ ἐπὶ Ἐλισαίου τοῦ προφήτου⸃, καὶ οὐδεὶς αὐτῶν ἐκαθαρίσθη, εἰ μὴ Ναιμὰν ὁ Σύρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/027.yaml
  text: And there were many lepers in Israel in the time of Elisha the prophet, and none of them was cleansed except Naaman the Syrian.
translation:
  language: te
  text: ప్రవక్త ఎలీషా కాలంలో ఇశ్రాయేలులో అనేకమంది కుష్ఠరోగులు[a] ఉండేవారు, మరియు వారిలో సిరియావాడైన నయమాను తప్ప మరెవరూ శుద్ధి పొందలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘కుష్ఠరోగులు’ అని అనువదించిన పదం బైబిలు కాలంలో వివిధ తీవ్రమైన చర్మవ్యాధులను సూచించి ఉండవచ్చు; అది నేటి హాన్సెన్ వ్యాధికే పరిమితం కాదు.
    reason: ప్రాచీన వ్యాధి పదాన్ని ఆధునిక వైద్య నిర్ధారణతో పూర్తిగా సమానం చేసే అపార్థాన్ని నివారించడానికి.
lexical_decisions:
- source_word: λεπροὶ
  choice: కుష్ఠరోగులు[a]
  rationale: విశేషణాన్ని నామవాచకంగా వాడిన గ్రీకు రూపం చర్మవ్యాధితో బాధపడుతున్నవారిని సూచిస్తుంది. ‘కుష్ఠరోగులు’ తెలుగు బైబిలు పరిభాషలో సంక్షిప్తంగా, సహజంగా ఉంది; అయితే ఇది నేటి హాన్సెన్ వ్యాధికే పరిమితం కాకపోవచ్చని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: ἐν τῷ Ἰσραὴλ
  choice: ఇశ్రాయేలులో
  rationale: ఈ విభక్తి ప్రయోగం స్థలాన్ని లేదా పరిధిని సూచిస్తుంది. ‘ఇశ్రాయేలులో’ మూలంలోని విస్తృత భావాన్ని అనవసరంగా ‘దేశం’ లేదా ‘ప్రజలు’ అని నిర్దిష్టం చేయకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐπὶ Ἐλισαίου τοῦ προφήτου
  choice: ప్రవక్త ఎలీషా కాలంలో
  rationale: ἐπί + షష్ఠీ విభక్తి ఇక్కడ కాలసూచకం. తెలుగు వాక్యనిర్మాణంలో ‘ప్రవక్త ఎలీషా కాలంలో’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: ἐκαθαρίσθη
  choice: శుద్ధి పొందలేదు
  rationale: καθαρίζω ఇక్కడ వ్యాధి తొలగింపుతోపాటు ఆ వ్యాధికి సంబంధించిన అపవిత్రత నుంచి శుద్ధిని సూచిస్తుంది. ‘స్వస్థపరచబడలేదు’ కంటే ‘శుద్ధి పొందలేదు’ మూలంలోని శుద్ధి భాషను కాపాడుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: εἰ μὴ
  choice: తప్ప
  rationale: ఈ గ్రీకు ప్రయోగం మినహాయింపును సూచిస్తుంది. ‘నయమాను తప్ప’ తెలుగులో సంక్షిప్తమైన, సహజమైన సమానార్థక నిర్మాణం.
- source_word: Ναιμὰν ὁ Σύρος
  choice: సిరియా దేశస్థుడైన నయమాను
  rationale: వ్యక్తి పేరుతో వచ్చిన జాతి/దేశ గుర్తింపును స్పష్టంగా నిలుపుతుంది. శుద్ధి పొందినవాడు ఇశ్రాయేలీయుడు కాక, సిరియావాడనే వాక్యంలోని వ్యత్యాసాన్ని ఈ రూపం కాపాడుతుంది.
theological_decisions:
- issue: కుష్ఠవ్యాధికి సంబంధించిన శుద్ధి భాష యొక్క భావం
  choice: ἐκαθαρίσθηను ‘శుద్ధి పొందలేదు’ అని అనువదించడం
  alternative: స్వస్థత పొందలేదు; పరిశుద్ధపరచబడలేదు
  rationale: ఈ సందర్భంలో శారీరక స్వస్థతతోపాటు కుష్ఠవ్యాధికి సంబంధించిన ఆచారపరమైన అపవిత్రత తొలగింపును కూడా మూలపదం ప్రతిధ్వనింపజేస్తుంది. ‘శుద్ధి పొందడం’ ఆ రెండు కోణాలను అదనపు సిద్ధాంతాన్ని చేర్చకుండా నిలుపుతుంది.
- issue: నయమాను యొక్క సిరియా గుర్తింపు
  choice: ‘సిరియా దేశస్థుడైన’ అనే గుర్తింపును ప్రధాన వాక్యంలో ఉంచడం
  alternative: ‘ఒక సిరియావాడైన’ అని అనువదించడం లేదా దేశ గుర్తింపును వదలడం
  rationale: గ్రీకులోని నిర్దిష్ట గుర్తింపు మరియు వాక్యంలోని వాక్చాతుర్య వ్యత్యాసం—ఇశ్రాయేలులోని అనేకమందికి బదులుగా ప్రసిద్ధ విదేశీయుడు శుద్ధి పొందడం—రెండూ నిలుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని రెండు καί పదాలను యాంత్రికంగా రెండుసార్లు ‘మరియు’ అని కాకుండా, రెండవదానిలోని సందర్భానుగుణ వ్యత్యాసాన్ని ‘అయినా’తో వ్యక్తపరిచాం. ‘శుద్ధి పొందలేదు’ అనే రూపం మూలంలోని దైవకర్మణి/కర్మణి భావాన్ని అతిగా వివరించకుండా సహజంగా నిలుపుతుంది.
