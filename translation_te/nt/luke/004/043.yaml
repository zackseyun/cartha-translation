id: LUK.4.43
reference: Luke 4:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν πρὸς αὐτοὺς ὅτι Καὶ ταῖς ἑτέραις πόλεσιν εὐαγγελίσασθαί με δεῖ τὴν βασιλείαν τοῦ θεοῦ, ὅτι ⸀ἐπὶ τοῦτο ⸀ἀπεστάλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/043.yaml
  text: But he said to them[a], “I must also proclaim the good news of the kingdom of God to the other cities[b], because I was sent for this.”
translation:
  language: te
  text: 'అయితే ఆయన వారితో ఇలా అన్నాడు: “నేను ఇతర నగరాల్లో కూడా దేవుని రాజ్యం గురించిన శుభవార్తను ప్రకటించాలి; ఎందుకంటే ఈ ఉద్దేశం కోసం నేను పంపబడ్డాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑτέραις πόλεσιν
  choice: ఇతర పట్టణాల్లో
  rationale: ప్రస్తుత స్థలానికి భిన్నమైన ఇతర జనావాసాలను సూచిస్తుంది. ఆధునిక తెలుగులో πόλιςకు సందర్భానుగుణంగా ‘పట్టణాలు’ సహజంగా ఉంటుంది.
- source_word: εὐαγγελίσασθαί
  choice: సువార్తను ప్రకటించాలి
  rationale: εὐαγγελίζωలోని శుభవార్తను తెలియజేయడం అనే క్రియాశీల భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: δεῖ
  choice: ప్రకటించాలి
  rationale: యేసు కార్యంలో ఉన్న బలమైన అవసరతను ‘చేయాలి’ అనే రూపం సంక్షిప్తంగా నిలుపుతుంది.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: దేవుని రాజ్య సువార్తను
  rationale: గ్రీకు వాక్యంలో ‘దేవుని రాజ్యము’ εὐαγγελίζω క్రియకు కర్మగా ఉంది; తెలుగులో ‘దేవుని రాజ్యాన్ని సువార్తగా ప్రకటించడం’ అనే భావాన్ని సహజంగా ‘దేవుని రాజ్య సువార్తను ప్రకటించడం’గా వ్యక్తపరుస్తుంది.
- source_word: ἐπὶ τοῦτο
  choice: ఇందుకోసమే
  rationale: ఉద్దేశాన్ని సూచించే పదబంధాన్ని సహజంగా అందిస్తుంది; ‘-ఏ’ మూలంలోని లక్ష్యబలాన్ని ప్రతిబింబిస్తుంది.
- source_word: ἀπεστάλην
  choice: నేను పంపబడ్డాను
  rationale: కర్తను పేర్కొనని గ్రీకు కర్మణి రూపాన్ని అలాగే నిలుపుతూ, పంపబడిన కార్యభార భావాన్ని సంరక్షిస్తుంది.
- source_word: Καὶ
  choice: కూడా
  rationale: యేసు సేవ ప్రస్తుత స్థలంతో పరిమితం కాక ఇతర పట్టణాలకు సైతం విస్తరించాలనే సంకలన భావాన్ని ఇస్తుంది.
- source_word: ὁ δὲ εἶπεν πρὸς αὐτοὺς
  choice: అయితే ఆయన వారితో ఇలా అన్నాడు
  rationale: δέలోని స్వల్ప వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది; ‘ఇలా అన్నాడు’ ప్రత్యక్ష వాక్యానికి సహజమైన తెలుగు పరిచయం.
theological_decisions:
- issue: యేసు కార్యనియోగంలోని అవసరత మరియు పంపినవారి గుర్తింపు
  choice: ‘నేను ... ప్రకటించాలి’ అనే దైవకార్య సంబంధ అవసరతను, ‘నేను పంపబడ్డాను’ అనే కర్తను పేర్కొనని కర్మణి రూపాన్ని నిలుపడం
  alternative: ‘దేవుడు నన్ను ఇందుకోసమే పంపాడు’ అని పంపినవారిని స్పష్టంగా పేర్కొనడం
  rationale: లూకాలో δεῖ తరచుగా దైవిక అవసరతను సూచించినా, ఈ వాక్యంలో పంపినవారు ప్రత్యక్షంగా పేర్కొనబడలేదు. అందువల్ల సూచిత theological భావాన్ని విస్తరించి చెప్పకుండా మూలంలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. అనవసరమైన మతసంస్థాపరమైన సాంకేతిక పదజాలాన్ని నివారించాం.
