translation:
  language: te
  text: సమాజమందిరంలో ఉన్న వారందరూ ఈ మాటలు విని కోపంతో నిండిపోయారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తీవ్ర ఆగ్రహంతో నిండిపోయారు.’ గ్రీకు θυμός అనే పదం తీవ్రమైన కోపాన్ని లేదా ఆగ్రహాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: నిండిపోయారు
  rationale: πίμπλημι క్రియ యొక్క భూతకాల కర్మణి భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ‘తీవ్రంగా కోపపడ్డారు’ అనే మరింత వ్యాఖ్యానాత్మక అనువాదాన్ని నివారిస్తుంది.
- source_word: πάντες
  choice: వారందరూ
  rationale: సమాజమందిరంలో ఉన్న ప్రజలందరినీ సమష్టిగా సూచిస్తుంది; తెలుగులో సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: θυμοῦ
  choice: కోపంతో
  rationale: θυμός ఇక్కడ తీవ్రమైన కోపాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన ‘కోపం’ను ఉంచి, మరింత తీవ్రత గల ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: ἐν τῇ συναγωγῇ
  choice: సమాజమందిరంలో ఉన్న
  rationale: సంఘటన జరిగిన స్థలాన్ని స్పష్టంగా చూపుతూ, πάντες‌తో తెలుగులో సహజమైన వాక్య నిర్మాణాన్ని కల్పిస్తుంది.
- source_word: ἀκούοντες
  choice: విని
  rationale: వర్తమాన కృదంతం ప్రధాన క్రియతో సమకాలికంగా ఉండి, వారి కోపానికి సందర్భాన్ని తెలియజేస్తుంది; ‘విని’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ταῦτα
  choice: ఈ మాటలు
  rationale: యేసు ఇంతకు ముందు పలికిన వాటిని సూచిస్తుంది. గ్రీకు పదం విస్తృతంగా ‘ఇవి’ అని అర్థమివ్వగలిగినా, విన్న విషయాల సందర్భంలో ‘ఈ మాటలు’ తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
