revisions:
- from: అప్పుడు అందరూ ఆశ్చర్యచకితులై[a], ఒకరితో ఒకరు, “ఇది ఎలాంటి మాట! ఈయన అధికారంతో, శక్తితో అపవిత్రాత్మలకు ఆజ్ఞాపిస్తే అవి బయటికి వెళ్లిపోతున్నాయే!” అని చెప్పుకున్నారు.
  to: అందరిమీద విస్మయం కలిగింది; వారు ఒకరితో ఒకరు మాట్లాడుకుంటూ, “ఈ మాట[a] ఏమిటి? ఈయన అధికారంతోను శక్తితోను అశుద్ధాత్మలకు ఆజ్ఞాపిస్తున్నాడు, అవి బయటికి వస్తున్నాయి!” అని అన్నారు.
  rationale: The revision removes the conditional sense absent from the Greek, maintains the two coordinated present-tense assertions (“he commands … and they come out”), more closely reflects θάμβος coming upon all, and relocates the lexical footnote to the term it explains. No doctrinal interpretation has been added.
