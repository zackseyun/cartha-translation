id: LUK.4.36
reference: Luke 4:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐγένετο θάμβος ἐπὶ πάντας, καὶ συνελάλουν πρὸς ἀλλήλους λέγοντες· Τίς ὁ λόγος οὗτος ὅτι ἐν ἐξουσίᾳ καὶ δυνάμει ἐπιτάσσει τοῖς ἀκαθάρτοις πνεύμασιν, καὶ ἐξέρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/036.yaml
  text: And amazement came upon everyone[a], and they were speaking with one another, saying, “What is this word, that with authority and power he commands the unclean spirits, and they come out?”
translation:
  language: te
  text: అందరిమీద విస్మయం కలిగింది; వారు ఒకరితో ఒకరు మాట్లాడుకుంటూ, “ఈ మాట[a] ఏమిటి? ఈయన అధికారంతోను శక్తితోను అశుద్ధాత్మలకు ఆజ్ఞాపిస్తున్నాడు, అవి బయటికి వస్తున్నాయి!” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ సందేశం ఏమిటి?” గ్రీకు పదం లోగొస్‌కు “మాట,” “సందేశం,” లేదా “విషయం” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: θάμβος
  choice: ఆశ్చర్యచకితులై
  rationale: తీవ్రమైన ఆశ్చర్యాన్ని సూచించే మూలపద భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐγένετο ... ἐπὶ πάντας
  choice: అప్పుడు అందరూ ఆశ్చర్యచకితులై
  rationale: అక్షరార్థంగా ‘అందరిమీద ఆశ్చర్యం కలిగింది’ అనడం కంటే, అదే అనుభవాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: συνελάλουν πρὸς ἀλλήλους
  choice: ఒకరితో ఒకరు ... అని చెప్పుకున్నారు
  rationale: అసంపూర్ణ భూతకాలం సూచించే పరస్పర సంభాషణను సహజంగా నిలుపుతుంది.
- source_word: Τίς ὁ λόγος οὗτος
  choice: ఇది ఎలాంటి మాట
  rationale: λόγος ఇక్కడ పలికిన మాట, ఆజ్ఞ లేదా సందేశం అనే విస్తృత భావాన్ని కలిగి ఉండవచ్చు; ‘మాట’ ఆ అస్పష్టతను కొంతవరకు నిలుపుతుంది.
- source_word: ἐν ἐξουσίᾳ καὶ δυνάμει
  choice: అధికారంతో, శక్తితో
  rationale: మూలంలోని క్రమాన్ని, న్యాయబద్ధమైన అధికారం మరియు కార్యసాధక శక్తి అనే రెండు భావాలను నిలుపుతుంది.
- source_word: ἐπιτάσσει
  choice: ఆజ్ఞాపిస్తే
  rationale: వర్తమానకాలంలోని సజీవతను తెలుగు వాక్య నిర్మాణంలో సహజంగా ప్రతిబింబిస్తుంది.
- source_word: τοῖς ἀκαθάρτοις πνεύμασιν
  choice: అపవిత్రాత్మలకు
  rationale: సువార్తలలోని అశుద్ధత నేపథ్యాన్ని, అతీంద్రియ జీవుల సూచనను వ్యాఖ్యానాత్మకంగా తగ్గించకుండా నిలుపుతుంది.
- source_word: ἐξέρχονται
  choice: బయటికి వెళ్లిపోతున్నాయి
  rationale: ఆత్మలు వ్యక్తిని విడిచి బయటికి పోవడాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: భూతవిమోచన సందర్భంలోని πνεύματα అనే జీవుల వర్ణన
  choice: అపవిత్రాత్మలు
  alternative: అశుద్ధ ఆత్మలు
  rationale: కథనంలోని అతీంద్రియ చట్రాన్ని రూపకంగా లేదా మానసిక స్థితిగా మార్చకుండా, గ్రీకు పదబంధంలోని అపవిత్రత భావాన్ని నిలుపుతుంది.
- issue: λόγος యొక్క భావ పరిధి
  choice: మాట
  alternative: సందేశం / విషయం
  rationale: యేసు పలికిన అధికారపూర్వక ఉక్తి లేదా ఆజ్ఞకు తక్షణ సూచన ఉండగా, విస్తృతమైన ‘సందేశం’ భావాన్నీ పూర్తిగా మూసివేయదు; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు సహజంగా ఉండేలా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. ఆశ్చర్యంతో పలికిన ప్రశ్న యొక్క భావాన్ని తెలుగు విస్మయ నిర్మాణంతో వ్యక్తం చేసింది.
