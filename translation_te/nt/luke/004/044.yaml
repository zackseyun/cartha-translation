    reason: textual_variant
lexical_decisions:
- source_word: ἦν κηρύσσων
  choice: ప్రకటిస్తూ ఉన్నాడు
  rationale: εἰμί యొక్క భూతకాల రూపంతో వర్తమాన కృదంతం కలిసిన ఈ నిర్మాణం గతంలో కొనసాగిన లేదా పునరావృతమైన కార్యాన్ని సూచిస్తుంది. ‘ప్రకటిస్తూ ఉన్నాడు’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: κηρύσσων
  choice: ప్రకటిస్తూ
  rationale: κηρύσσω బహిరంగంగా సందేశాన్ని ప్రకటించడాన్ని సూచిస్తుంది. ‘ప్రకటిస్తూ’ అనే పదం మూలపదంలోని బహిరంగ ప్రకటన భావాన్ని నిలుపుతూ, సంఘసందర్భానికి సహజంగా సరిపోతుంది.
- source_word: εἰς τὰς συναγωγάς
  choice: సమాజమందిరాల్లో
  rationale: εἰς సాధారణంగా గమనాన్ని సూచించినా, ఇక్కడ ప్రకటించే కార్యం జరిగిన స్థలం లేదా పరిధిని తెలియజేస్తుంది. అందువల్ల తెలుగులో స్థానార్థకమైన ‘-ల్లో’ సహజంగా ఉంటుంది.
- source_word: συναγωγάς
  choice: సమాజమందిరాలు
  rationale: ఈ సందర్భంలో συναγωγή యూదుల ఆరాధనా-సమావేశ స్థలాలను సూచిస్తుంది. ఆధునిక తెలుగు బైబిల్ వాడుకలో ‘సమాజమందిరాలు’ స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: Ἰουδαίας
  choice: యూదయ
  rationale: SBLGNT మూలపాఠంలో Ἰουδαίας ఉంది; దానికి నేరుగా సరిపడే భౌగోళిక పేరు ‘యూదయ’. సమీప సందర్భంతో కనిపించే ఉద్రిక్తతను గలిలయగా మార్చి సమన్వయపరచకుండా యథాతథంగా నిలిపాం.
theological_decisions:
- issue: చుట్టుపక్కల గలిలయ సందర్భం ఉన్నప్పటికీ τῆς Ἰουδαίας అనే భౌగోళిక సూచన
  choice: యూదయ
  alternative: కొన్ని ప్రతుల్లో ఉన్న ‘గలిలయ’; లేదా యూదుల దేశమంతటినీ సూచించే విస్తృతార్థంలో ‘యూదయ’
  rationale: మూలభాషా పాఠానికి ప్రాధాన్యం ఇచ్చి SBLGNTలోని ‘యూదయ’ను ప్రధాన పాఠంలో ఉంచాం. సందర్భంతో కనిపించే ఉద్రిక్తతను అనువాదంలో పరిష్కరించకుండా, పాఠాంతరాన్ని పాదటిప్పణిలో తెలిపాం.
