translation:
  language: te
  text: ప్రభువు అనుగ్రహ సంవత్సరాన్ని ప్రకటించడానికి[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువు దయా సంవత్సరాన్ని ప్రకటించడానికి.”
    reason: lexical_alternative
  - marker: b
    text: 'సాంప్రదాయ అనువాదం: “ప్రభువుకు ఆమోదయోగ్యమైన సంవత్సరాన్ని ప్రకటించడానికి.” ఈ మాటలు యెషయా 61:2ను ప్రతిధ్వనింపజేస్తాయి; యూబిలీ భావాలను కూడా జ్ఞాపకం చేయవచ్చు.'
    reason: cross_reference
lexical_decisions:
- source_word: κηρύξαι
  choice: ప్రకటించడానికి
  rationale: ప్రజల ముందే అధికారికంగా చాటిచెప్పే κηρύσσω భావాన్ని ‘ప్రకటించు’ సహజంగా అందిస్తుంది; దీనిని కేవలం ప్రసంగించడానికే పరిమితం చేయదు. క్రియారూపం ముందున్న ఉద్దేశ పరంపరను కొనసాగించే విధంగా ఉంది.
- source_word: ἐνιαυτὸν
  choice: సంవత్సరాన్ని
  rationale: ἐνιαυτός సాధారణంగా ‘సంవత్సరం’ అనే అర్థమే ఇస్తుంది. యెషయా 61:2తో ఉన్న సంబంధాన్ని నిలుపుతూ, దీనిని విస్తృతమైన ‘కాలం’గా మార్చలేదు.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριοςకు సహజమైన, గౌరవప్రదమైన తెలుగు సమానం ‘ప్రభువు.’ షష్ఠీ విభక్తి సంబంధాన్ని ‘ప్రభువు అనుగ్రహ సంవత్సరం’ అనే సహజ నిర్మాణంలో వ్యక్తం చేశాం.
- source_word: δεκτόν
  choice: అనుగ్రహ
  rationale: ఈ సందర్భంలో δεκτός ఆమోదం, అనుకూలత, దయ లభించే భావాన్ని ఇస్తుంది. ‘అనుగ్రహ సంవత్సరం’ ఆధునిక తెలుగులో దైవానుకూలతను స్పష్టంగా తెలియజేస్తూ, కేవలం మానవ ఆమోదం అనే అపార్థాన్ని తగ్గిస్తుంది.
theological_decisions:
- issue: యెషయా 61:2 సూచన మరియు సునాద సంవత్సర భావసంభావ్యత
  choice: మూలపాఠ్యంలో ‘సంవత్సరం’ను ఉంచి, ‘సునాద సంవత్సరం’ అని స్పష్టంగా చేర్చలేదు.
  alternative: ‘ప్రభువు సునాద సంవత్సరాన్ని ప్రకటించడానికి’
  rationale: ఈ మాటలు యెషయా 61:2ను ప్రతిధ్వనింపజేస్తాయి; సునాద సంవత్సరాన్ని జ్ఞాపకం చేయవచ్చు. అయినా గ్రీకు పాఠ్యంలో ‘సునాదం’ అనే పదం ప్రత్యక్షంగా లేదు కాబట్టి వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: κύριος అనువాదం
  choice: ప్రభువు
  alternative: యెహోవా / యజమాని
  rationale: గ్రీకు κύριοςను నేరుగా, గౌరవప్రదంగా ‘ప్రభువు’ అని అనువదించడం ఈ యెషయా సూచనకు సరిపోతుంది; ప్రధాన పాఠ్యంలో దైవనామ సంప్రదాయాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘అనుగ్రహ సంవత్సరం’ అనే సంక్షిప్త నిర్మాణం సాధారణ పాఠకునికి అర్థమయ్యేలా ఉండి, యెషయా గ్రంథంతో ఉన్న సాహిత్య సంబంధాన్ని నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
