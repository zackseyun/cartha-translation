revisions:
- from: అనేకమందిలోనుండి దయ్యాలు కూడా బయటికి వస్తూ, “నీవు దేవుని కుమారుడవు!” అని కేకలు వేస్తూ చెప్పాయి. అయితే ఆయన వాటిని గద్దించి, మాట్లాడనివ్వలేదు; ఎందుకంటే ఆయనే మెస్సీయ[a] అని వాటికి తెలుసు.
  to: అనేకులనుండి దయ్యాలు కూడా బయటికి వస్తూ ఉండేవి; అవి కేకలు వేస్తూ, “నీవు దేవుని కుమారుడవు!” అని చెప్పేవి. అయితే ఆయన వాటిని గద్దిస్తూ, మాట్లాడనీయలేదు; ఎందుకంటే ఆయన మెస్సీయ[a] అని వాటికి తెలుసు.
  rationale: సవరించిన పాఠం గ్రీకు అసంపూర్ణ క్రియల పునరావృత కథనభావాన్ని ‘వస్తూ ఉండేవి’ మరియు ‘చెప్పేవి’ ద్వారా నిలుపుతుంది. రెండు బిరుదులు—‘దేవుని కుమారుడు’ మరియు ‘మెస్సీయ’—వేర్వేరు కథనస్థానాల్లో యథాతథంగా ఉంచబడ్డాయి. మూలంలో లేని అదనపు ఉద్ఘాటన తొలగించబడింది; పాదసూచికను పదార్థపరంగా మరింత కచ్చితంగా చేశాం.
  reviewer_model: gpt-5.6-terra
