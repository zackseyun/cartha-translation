id: LUK.4.41
reference: Luke 4:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐξήρχετο δὲ καὶ δαιμόνια ἀπὸ πολλῶν ⸀κραυγάζοντα καὶ λέγοντα ὅτι Σὺ ⸀εἶ ὁ υἱὸς τοῦ θεοῦ. καὶ ἐπιτιμῶν οὐκ εἴα αὐτὰ λαλεῖν, ὅτι ᾔδεισαν τὸν χριστὸν αὐτὸν εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/041.yaml
  text: Demons also were coming out of many[a], crying out and saying, “You are the Son of God!” But rebuking them, he would not allow them to speak, because they knew that he was the Messiah.
translation:
  language: te
  text: అనేకులనుండి దయ్యాలు కూడా బయటికి వస్తూ ఉండేవి; అవి కేకలు వేస్తూ, “నీవు దేవుని కుమారుడవు!” అని చెప్పేవి. అయితే ఆయన వాటిని గద్దిస్తూ, మాట్లాడనీయలేదు; ఎందుకంటే ఆయన మెస్సీయ[a] అని వాటికి తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు.” గ్రీకు పదం Χριστός, అంటే “అభిషిక్తుడు”; సందర్భంలో “మెస్సీయ.”
    reason: Χριστός అనే బిరుదుకు ప్రత్యామ్నాయమైన ‘క్రీస్తు’ను తెలియజేస్తూ, గ్రీకు పదం యొక్క మూలార్థం మరియు సందర్భానువాదాన్ని స్పష్టపరచడం.
lexical_decisions:
- source_word: δαιμόνια
  choice: దయ్యాలు
  rationale: ఈ నామవాచకం నేరుగా దయ్యాలను సూచిస్తుంది; ‘అపవిత్రాత్మలు’ అనే వేరే గ్రీకు పదబంధాన్ని ఇక్కడ దిగుమతి చేయలేదు.
- source_word: ἐξήρχετο
  choice: బయటికి వస్తూ
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పునరావృతమవుతున్న చర్యను సూచిస్తుంది; తెలుగు కథనంలో ‘వస్తూ’ దానిని సహజంగా తెలియజేస్తుంది.
- source_word: ἀπὸ πολλῶν
  choice: అనేకమందిలోనుండి
  rationale: గ్రీకులో మనుషులు అనే పదం సూచ్యంగా ఉన్నా వ్యక్తంగా లేదు; తెలుగులో భావం స్పష్టంగా, సహజంగా ఉండేందుకు ‘అనేకమందిలోనుండి’ అని అనువదించాం.
- source_word: κραυγάζοντα καὶ λέγοντα
  choice: కేకలు వేస్తూ చెప్పాయి
  rationale: బిగ్గరగా వెలువడిన అరుపును, దానితో కూడిన మాటను రెండింటినీ నిలుపుతుంది.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: దేవుని కుమారుడు
  rationale: క్రీస్తును సూచించే ఈ బిరుదు యొక్క నిర్దిష్టమైన, గంభీరమైన భావాన్ని నిలుపుతుంది.
- source_word: ἐπιτιμῶν
  choice: గద్దించి
  rationale: యేసు అధికారంతో తీవ్రంగా మందలించిన భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: οὐκ εἴα
  choice: మాట్లాడనివ్వలేదు
  rationale: ఆయన వాటిని మాట్లాడేందుకు అనుమతించకపోయాడనే భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది; సందర్భంలోని కొనసాగుతున్న నిరాకరణను తెలుగు క్రియ సహజంగా మోస్తుంది.
- source_word: ᾔδεισαν
  choice: వాటికి తెలుసు
  rationale: οἶδα యొక్క స్థితిసూచక భావాన్ని తెలుగులో సహజమైన వర్తమాన స్థితి రూపంతో వ్యక్తం చేసింది.
- source_word: τὸν χριστὸν αὐτὸν εἶναι
  choice: ఆయనే మెస్సీయ అని
  rationale: అవ్యక్త క్రియ నిర్మాణాన్ని సహజ తెలుగులోకి మార్చి, αὐτόν యొక్క నొక్కిచెప్పే భావాన్ని ‘ఆయనే’తో నిలిపింది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు / అభిషిక్తుడు
  rationale: ఇక్కడ Χριστός వ్యక్తినామంలా కాక గుర్తింపును తెలిపే బిరుదుగా ఉంది. ‘మెస్సీయ’ దాని యూద నేపథ్యంలోని బిరుదు స్వభావాన్ని నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: ‘దేవుని కుమారుడు’ మరియు ‘మెస్సీయ’ మధ్య సంబంధం
  choice: రెండు బిరుదులను వేరువేరుగా నిలుపడం
  alternative: రెండింటినీ ఒకే వివరణాత్మక పదబంధంగా కలపడం
  rationale: దయ్యాల మాటలో మొదటి బిరుదు, కథకుని వివరణలో రెండవ బిరుదు ఉన్నాయి. వాటి సంబంధాన్ని అనువాదం ముందుగానే పరిష్కరించకుండా గ్రీకు వచనంలోని తేడాను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ‘దేవుని కుమారుడు,’ ‘మెస్సీయ’ వంటి ప్రధాన బిరుదులకు తగిన గంభీరతను నిలిపింది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
