- from: అందరూ ఆయనను గురించి మంచిగా మాట్లాడారు[a]. ఆయన నోటినుండి వెలువడుతున్న కృపతో కూడిన మాటలకు[b] ఆశ్చర్యపడి, “ఇతడు యోసేపు కుమారుడు కాడా?” అని చెప్పుకున్నారు.
