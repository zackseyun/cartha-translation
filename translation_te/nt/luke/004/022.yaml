  text: καὶ πάντες ἐμαρτύρουν αὐτῷ καὶ ἐθαύμαζον ἐπὶ τοῖς λόγοις τῆς χάριτος τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ, καὶ ἔλεγον· ⸂Οὐχὶ υἱός ἐστιν Ἰωσὴφ οὗτος⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/022.yaml
  text: And all were speaking well of him and were marveling at the gracious words coming from his mouth[a], and they were saying[b], “Is this not Joseph’s son?”
translation:
  language: te
  text: అందరూ ఆయనను గురించి మంచిగా మాట్లాడారు[a], ఆయన నోటి నుండి వెలువడుతున్న కృపగల మాటలను బట్టి విస్మయపడ్డారు; వారు, “ఇతడు యోసేపు కుమారుడు కాడా?” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అందరూ ఆయనకు సాక్ష్యమిచ్చారు.” గ్రీకు పదబంధం ఆయనను గురించి అనుకూలంగా మాట్లాడడం లేదా ఆయనకు సాక్ష్యమివ్వడం అనే రెండు భావాలనూ ఇవ్వగలదు. ఈ సందర్భంలో, వారు విస్మయపడడమనే సమాంతర భావానికి అనుకూలంగా మాట్లాడడం బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρουν αὐτῷ
  choice: ఆయనను గురించి మంచిగా మాట్లాడారు
  rationale: ఈ సందర్భంలో ఈ పదబంధం అధికారిక సాక్ష్యం కంటే యేసు గురించి అనుకూలంగా మాట్లాడడాన్ని సూచించడం సహజం; వెంటనే వచ్చే వారి ఆశ్చర్యంతో కూడా ఇది సరిపోతుంది. అయినా ‘ఆయనకు సాక్ష్యమిచ్చారు’ అనే అర్థసాధ్యతను పాదటిప్పణిలో నిలిపాం.
- source_word: ἐθαύμαζον
  choice: ఆశ్చర్యపడి
  rationale: వారు విస్మయంతో స్పందించారని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. గ్రీకు అపూర్ణ భూతకాలంలోని కొనసాగుతున్న స్పందనను మొత్తం వాక్య నిర్మాణం ప్రతిబింబిస్తుంది.
- source_word: ἐπὶ τοῖς λόγοις
  choice: మాటలకు
  rationale: వారి ఆశ్చర్యానికి ఆ మాటలే కారణం లేదా సందర్భం అని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τῆς χάριτος
  choice: కృపతో కూడిన
  rationale: χάρις అనే పదంలోని కృప, అనుగ్రహం, ఆకర్షణీయత అనే భావపరిధిని పూర్తిగా ఒక్క అర్థానికి కుదించకుండా ఉంచుతుంది; ‘కృపగల’ కంటే ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ
  choice: ఆయన నోటినుండి వెలువడుతున్న
  rationale: మాటల మూలాన్ని సూచించే గ్రీకు భాషలోని స్పష్టమైన నోటి రూపకాన్ని నిలిపి, వర్తమాన కృదంతంలోని కొనసాగుతున్న భావాన్ని తెలియజేస్తుంది.
- source_word: Οὐχὶ
  choice: కాడా?
  rationale: సానుకూల సమాధానాన్ని ఆశించే గ్రీకు ప్రశ్నార్థక రూపాన్ని తెలుగులో సహజమైన ప్రతికూల ప్రశ్నగా నిలుపుతుంది.
- source_word: υἱός ἐστιν Ἰωσὴφ οὗτος
  choice: ఇతడు యోసేపు కుమారుడు
  rationale: సమూహం యేసును ఎలా గుర్తించిందో సూటిగా, సహజంగా తెలియజేస్తుంది; మూలంలో లేని వివరణను చేర్చదు.
theological_decisions:
- issue: కన్యక గర్భధారణ నేపథ్యంలో యేసును యోసేపు కుమారుడని పిలవడం
  choice: సమూహం పలికిన మాటగా ‘ఇతడు యోసేపు కుమారుడు కాడా?’ అని ఎలాంటి వివరణాత్మక మార్పు లేకుండా అనువదించడం
  alternative: అపార్థాన్ని నివారించేందుకు ‘యోసేపు కుమారుడని అనుకునే ఇతడు’ వంటి వివరణను వచనంలోనే చేర్చడం
  rationale: ఇది సమూహం కలిగిన అవగాహనను నివేదిస్తుంది; కథకుడు ఇక్కడ సిద్ధాంతపరమైన సవరణ చేయడం లేదు. అందువల్ల వచనంలోని కథనాత్మక, theological ఉద్విగ్నతను పరిష్కరించకుండా యథాతథంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అదే సమయంలో గౌరవభరితమైన బైబిలు శైలిని నిలిపాం. ‘నోటినుండి వెలువడుతున్న’ అనే స్పష్టమైన మూలభాషా చిత్రణను ఉంచి, మిగిలిన వాక్యాన్ని సహజ తెలుగు క్రమంలో అమర్చాం.
