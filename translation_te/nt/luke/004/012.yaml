id: LUK.4.12
reference: Luke 4:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Εἴρηται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/012.yaml
  text: 'And Jesus answered him[b][a], “It is said: You shall not put the Lord your God to the test.”'
translation:
  language: te
  text: 'యేసు అతనికి జవాబిచ్చాడు: “ఇలా చెప్పబడింది[a]: ‘నీ దేవుడైన ప్రభువును[b] పరీక్షించకూడదు.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సంప్రదాయ ఆంగ్ల అనువాదాల్లో తరచుగా “ఇలా వ్రాయబడింది” అని ఉంటుంది. ఇక్కడి గ్రీకు పదానికి అక్షరార్థం “ఇలా చెప్పబడింది.”
    reason: alternative_reading
  - marker: b
    text: ఇది ద్వితీయోపదేశకాండము 6:16 నుండి తీసుకున్న ఉల్లేఖనం. అక్కడి హెబ్రీ పాఠ్యంలో YHWH అనే దైవనామం ఉంది; దానిని తరచుగా “యెహోవా” లేదా “ప్రభువు” అని అనువదిస్తారు.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: జవాబిచ్చాడు
  rationale: పార్టిసిపుల్‌తో కూడిన సమాపక క్రియ ఇక్కడ ‘జవాబిచ్చాడు/ప్రత్యుత్తరమిచ్చాడు’ అనే సాధారణ భావాన్నిస్తుంది. ఆధునిక తెలుగులో ‘జవాబిచ్చాడు’ సహజంగా ఉంటుంది.
- source_word: αὐτῷ
  choice: అతనికి
  rationale: సందర్భంలో ఇది శోధించే అపవాదిని సూచించే దత్తివిభక్తి సర్వనామం.
- source_word: ὅτι
  choice: —
  rationale: ప్రత్యక్ష ఉల్లేఖనానికి ముందు తెలుగులో ‘అని’ తప్పనిసరి కాదు; ద్విబిందువు ద్వారా ఉల్లేఖనాన్ని సహజంగా పరిచయం చేశాం.
- source_word: Εἴρηται
  choice: ఇలా చెప్పబడింది
  rationale: λέγω క్రియ యొక్క perfect passive రూపం అక్షరార్థంగా ‘చెప్పబడింది/చెప్పబడి ఉంది’ అని సూచిస్తుంది. ఇది లేఖనాధికారాన్ని సూచించే ఉల్లేఖన సూత్రమైనా, గ్రీకులో γράφω లేదు కాబట్టి ‘వ్రాయబడింది’ని ప్రధాన పాఠ్యంలో పెట్టలేదు.
- source_word: Οὐκ ἐκπειράσεις
  choice: పరీక్షించకూడదు
  rationale: ἐκπειράζω అంటే పరీక్షకు గురిచేయడం లేదా పరీక్షించి చూడడం. ‘శోధించకూడదు’ అనేది పాపానికి ప్రేరేపించడం అనే అపార్థాన్ని కలిగించవచ్చు; ‘పరీక్షించకూడదు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: κύριον
  choice: ప్రభువును
  rationale: గ్రీకు κύριοςకు సాధారణమైన గౌరవపూర్వక తెలుగు సమానార్థకం ‘ప్రభువు’. తరువాతి ‘నీ దేవుడు’తో కలిపి సహజమైన నిబంధనాత్మక పదబంధం అవుతుంది.
- source_word: τὸν θεόν σου
  choice: నీ దేవుడైన
  rationale: ‘ప్రభువు’తో సమానాధికార సంబంధాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘నీ దేవుడైన ప్రభువు’గా రూపొందించాం.
theological_decisions:
- issue: లేఖన ఉల్లేఖన సూత్రం (Εἴρηται)
  choice: ఇలా చెప్పబడింది
  alternative: ఇలా వ్రాయబడింది
  rationale: మూల గ్రీకులో γράφω కాక λέγω ఉంది. అందువల్ల సంప్రదాయ రూపాన్ని ప్రధాన పాఠ్యంలోకి తేవకుండా మూలపదాన్ని నిలిపి, ‘వ్రాయబడింది’ను పాదసూచికలో తెలిపాం.
- issue: ద్వితీయోపదేశకాండము 6:16 ఉల్లేఖనంలో κύριος
  choice: ప్రభువు
  alternative: యెహోవా
  rationale: లూకా గ్రీకు పాఠ్యంలో κύριος ఉంది; అందుకే ప్రధాన పాఠ్యం గ్రీకు రూపాన్నే అనుసరిస్తుంది. అయితే ఉల్లేఖించబడిన హెబ్రీ పాఠ్యంలో దైవనామం YHWH ఉన్న విషయాన్ని పాదసూచికలో స్పష్టంచేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవపూర్వక శైలిని ఉపయోగించాం. ‘జవాబిచ్చాడు’, ‘పరీక్షించకూడదు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటాయి; మూల గ్రీకులోని ఉల్లేఖన సూత్రం మరియు హెబ్రీ నేపథ్యంలోని దైవనామ భేదం పాదసూచికల్లో నిలిపాం.
