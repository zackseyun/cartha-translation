id: LUK.4.17
reference: Luke 4:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐπεδόθη αὐτῷ βιβλίον ⸂τοῦ προφήτου Ἠσαΐου⸃ καὶ ⸀ἀναπτύξας τὸ βιβλίον εὗρεν τὸν τόπον οὗ ἦν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/017.yaml
  text: 'And the scroll of the prophet Isaiah was handed to him[a], and after unrolling the scroll, he found the place where it was written:'
translation:
  language: te
  text: 'ప్రవక్త యెషయా యొక్క గ్రంథపు చుట్ట[a] ఆయనకు అందజేయబడింది.[b] ఆయన ఆ చుట్టను విప్పి, ఇలా రాసి ఉన్న చోటును కనుగొన్నారు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గ్రంథం.’ గ్రీకు పదమైన βιβλίον సాధారణంగా లిఖిత పత్రాన్ని సూచించగలదు; అయితే ఈ సమాజమందిర సందర్భంలో అది ఎక్కువగా గ్రంథపు చుట్టనే సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రాచీన ప్రతుల్లో “ప్రవక్త యెషయా యొక్క” అనే మాటలు లేవు.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπεδόθη
  choice: అందజేయబడింది
  rationale: ఇది ‘ఇవ్వడం/చేతికి అందించడం’ అనే నిష్క్రియార్థక క్రియ. సమాజమందిరంలో పఠనార్థం చుట్టను ఆయనకు ఇచ్చిన సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: βιβλίον
  choice: గ్రంథపు చుట్ట
  rationale: βιβλίον సాధారణంగా లిఖిత పత్రం లేదా గ్రంథాన్ని సూచించగలదు; మొదటి శతాబ్దపు సమాజమందిర సందర్భంలో అది చుట్ట రూపంలోని గ్రంథప్రతిని సూచిస్తుంది. ‘గ్రంథపు చుట్ట’ విషయం మరియు భౌతిక రూపం రెండింటినీ స్పష్టం చేస్తుంది.
- source_word: τοῦ προφήτου Ἠσαΐου
  choice: ప్రవక్తయైన యెషయా గ్రంథపు
  rationale: యెషయాను ప్రవక్తగా గుర్తిస్తూ, ఆ చుట్టలోని గ్రంథం ఆయనదని తెలిపే సంబంధాన్ని సహజమైన తెలుగు నిర్మాణంలో నిలుపుతుంది.
- source_word: ἀναπτύξας
  choice: చుట్టను విప్పి
  rationale: ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను తెలియజేస్తుంది; చుట్ట సందర్భంలో ‘తెరిచి’ కంటే ‘విప్పి’ చారిత్రక భౌతిక రూపానికి సరిపోతుంది.
- source_word: εὗρεν
  choice: కనుగొన్నారు
  rationale: εὑρίσκω యొక్క సరళ అర్థాన్ని ఇస్తుంది; వెదకడంలో ప్రత్యేక కష్టం ఉందని అదనంగా సూచించదు.
- source_word: τόπον
  choice: చోటును
  rationale: మూలంలోని concrete ‘స్థలం/చోటు’ భావాన్ని నిలుపుతూ, గ్రంథంలోని నిర్దిష్ట భాగాన్ని సహజంగా సూచిస్తుంది.
- source_word: οὗ ἦν γεγραμμένον
  choice: ఇలా రాసి ఉన్న
  rationale: తరువాత వచ్చే ఉద్ధరణను పరిచయం చేస్తూ, గ్రీకు periphrastic perfect యొక్క నిలిచి ఉన్న లిఖిత స్థితిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
