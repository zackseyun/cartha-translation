translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన క్రియారూపాలు ఉపయోగించబడ్డాయి. ‘గ్రంథపు చుట్ట’ అనే పదబంధం సామాన్య పాఠకులకు అర్థమయ్యేలా గ్రంథ స్వరూపాన్నీ, మొదటి శతాబ్దపు చుట్ట రూపాన్నీ కలిపి తెలియజేస్తుంది.
