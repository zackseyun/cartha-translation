source:
  edition: SBLGNT
  text: ἤρξατο δὲ λέγειν πρὸς αὐτοὺς ὅτι Σήμερον πεπλήρωται ἡ γραφὴ αὕτη ἐν τοῖς ὠσὶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/021.yaml
  text: Then he began to say to them[a], “Today this Scripture has been fulfilled in your hearing.”
translation:
  language: te
  text: 'అప్పుడు ఆయన వారితో ఇలా చెప్పడం మొదలుపెట్టాడు: “నేడు మీరు వింటుండగా ఈ లేఖనం నెరవేరింది.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మీ చెవులలో.”
    reason: గ్రీకు నుడికారానికి అక్షరార్థ రూపాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: ἤρξατο δὲ λέγειν
  choice: అప్పుడు … చెప్పడం మొదలుపెట్టాడు
  rationale: δέ కథన పురోగతిని సూచిస్తుంది; ἤρξατο మరియు λέγειν కలసి మాట ప్రారంభించడాన్ని తెలియజేస్తాయి. ఈ తెలుగు రూపం ఆ కథన క్రమాన్నీ, ప్రారంభ భావాన్నీ సహజంగా నిలుపుతుంది.
- source_word: πρὸς αὐτοὺς
  choice: వారితో
  rationale: మాట చెప్పబడుతున్న శ్రోతలను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: Σήμερον
  choice: నేడు
  rationale: వాక్యారంభంలోని కాలసంబంధమైన ఉద్ఘాటనను సంక్షిప్తంగా, గంభీరంగా నిలుపుతుంది.
- source_word: πεπλήρωται
  choice: నెరవేరింది
  rationale: పూర్తయిన కార్యం ప్రస్తుతం ఫలితాన్ని కలిగి ఉందనే గ్రీకు perfect passive భావాన్ని తెలుగు సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది; కర్తను అదనంగా చేర్చదు.
- source_word: ἡ γραφὴ αὕτη
  choice: ఈ లేఖనం
  rationale: ఇప్పుడే చదివిన పవిత్ర గ్రంథభాగాన్ని సూచించే γραφή భావాన్ని అదనపు వివరణ లేకుండా నిలుపుతుంది.
- source_word: ἐν τοῖς ὠσὶν ὑμῶν
  choice: మీరు వింటుండగానే
  rationale: అక్షరార్థంగా ‘మీ చెవులలో’ అనే గ్రీకు ప్రయోగం, వారు వింటున్న సమయంలోనే నెరవేర్పు ప్రకటించబడిందనే భావాన్ని ఇక్కడ ఇస్తుంది. సహజమైన తెలుగులో ఆ భావాన్ని వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: లేఖనం నెరవేరిన విధానం
  choice: ఈ లేఖనం నేడు నెరవేరిందని మాత్రమే ప్రకటించడం
  alternative: ‘ఈ ప్రవచనం నాలో నెరవేరింది’ అని వివరణాత్మకంగా విస్తరించడం
  rationale: సందర్భం యేసుతో నెరవేర్పుకు సంబంధాన్ని సూచించినా, ఈ వచనంలోని గ్రీకు పాఠం ‘నాలో’ లేదా ‘నా ద్వారా’ అని స్పష్టంగా చెప్పదు. అందువల్ల మూలపాఠంలోని బలాన్నీ, దాని సంక్షిప్తతనూ అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే వాక్య గంభీరతను నిలుపుతూ అనువదించబడింది. ప్రత్యక్ష వాక్యంలోని ‘నేడు’ ఉద్ఘాటనను ముందుభాగంలో ఉంచాం.
