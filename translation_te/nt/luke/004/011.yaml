review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the carrying imagery and preserves the singular ‘foot.’ However, ‘నీ పాదం రాయికి తగలకుండా చూస్తారు’ adds an independent verbal idea (‘they will see to it/ensure’) that is not present in μήποτε προσκόψῃς. The Greek expresses the preventive purpose/result of their carrying: ‘lest you strike your foot against a stone.’'
  naturalness: ‘తమ చేతులపై నిన్ను మోస్తారు’ is natural, clear modern Telugu. Recasting the final clause as ‘నీ పాదం రాయికి తగలకుండునట్లు’ is both idiomatic in a Scripture quotation and closer to the Greek syntactic relationship.
  terminology: No theological terminology is introduced or altered. ‘మోస్తారు’ appropriately renders ἀροῦσίν. ‘రాయి’ and singular ‘పాదం’ are appropriate.
  issues:
  - severity: medium
    issue: The phrase ‘తగలకుండా చూస్తారు’ introduces ‘చూస్తారు’ (‘they will ensure/see to it’).
    rationale: The source has no verb corresponding to ‘చూస్తారు’; μήποτε introduces a dependent negative preventive clause governed by ‘they will carry you.’ The revision retains that relationship without adding agency or action.
  revised_text: మరియు, ‘తమ చేతులపై నిన్ను మోస్తారు[a], నీ పాదం రాయికి తగలకుండునట్లు[b].’
