  text: and[a], ‘On their hands they will carry you[b], lest you strike your foot against a stone.’
translation:
  language: te
  text: మరియు, ‘తమ చేతులపై నిన్ను మోస్తారు[a], నీ పాదం రాయికి తగలకుండునట్లు[b].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిన్ను పైకెత్తి మోస్తారు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీ పాదం రాయికి కొట్టుకోకుండునట్లు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὅτι
  choice: మరియు
  rationale: ఇది ముందటి వచనంలో మొదలైన లేఖన ఉల్లేఖనాన్ని కొనసాగిస్తుంది. ὅτι ఉల్లేఖనంలోని విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో దానిని విడిగా అనువదించకుండా ఉల్లేఖనంతో సూచించడం సహజం.
- source_word: Ἐπὶ χειρῶν
  choice: తమ చేతులపై
  rationale: దేవదూతల చేతులపై మోయబడుతున్న రక్షణాత్మక దృశ్యాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἀροῦσίν σε
  choice: నిన్ను మోస్తారు
  rationale: αἴρω భవిష్యత్ రూపం ఇక్కడ పైకెత్తి మోయడం అనే భావాన్ని ఇస్తుంది. ‘మోస్తారు’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలభావాన్ని నిలుపుతుంది.
- source_word: μήποτε
  choice: తగలకుండా చూస్తారు
  rationale: ప్రతికూల ఉద్దేశం లేదా నివారణ భావాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: προσκόψῃς πρὸς λίθον
  choice: రాయికి తగలకుండా
  rationale: పాదం ఒక రాయికి తగిలే భౌతిక చర్యను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τὸν πόδα σου
  choice: నీ పాదం
  rationale: గ్రీకు మూలంలోని ఏకవచనాన్ని అలాగే నిలుపుతుంది.
theological_decisions:
- issue: కీర్తన ఉల్లేఖనంలోని రక్షణాత్మక దృశ్యాన్ని ఆధునిక తెలుగులో వ్యక్తం చేయడం
  choice: ‘నిన్ను మోస్తారు’ అని అనువదించడం
  alternative: ‘నిన్ను పైకెత్తి పట్టుకుంటారు’
  rationale: రెండు రూపాలూ దేవదూతల రక్షణ భావాన్ని తెలియజేస్తాయి. ‘మోస్తారు’ సాధారణ పాఠకులకు సహజంగా ఉండి, ప్రత్యేక సిద్ధాంత వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని వాక్యక్రమం మరియు చేతులపై మోయబడే దృశ్యం సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
