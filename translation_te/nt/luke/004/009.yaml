id: LUK.4.9
reference: Luke 4:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂Ἤγαγεν δὲ⸃ αὐτὸν εἰς Ἰερουσαλὴμ καὶ ⸀ἔστησεν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ, καὶ εἶπεν αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν ἐντεῦθεν κάτω·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/009.yaml
  text: Then he led him to Jerusalem and set him on the pinnacle of the temple[a], and said to him, “If you are the Son of God[c][b], throw yourself down from here;”
translation:
  language: te
  text: అప్పుడు అపవాది ఆయనను యెరూషలేముకు తీసుకెళ్లి, దేవాలయ సముదాయంలోని ఎత్తైన అంచుమీద[a][b] నిలబెట్టి, ఆయనతో, “నీవు దేవుని కుమారుడవైతే[c], నిన్ను నీవు ఇక్కడి నుండి కిందికి విసిరివేయి;” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవాలయపు రెక్కమీద.” గ్రీకు పదం నిర్మాణంలో బయటకు పొడుచుకొచ్చిన అంచును లేదా ఎత్తైన కొసను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడున్న గ్రీకు పదం ἱερόν అంతర్గర్భాలయాన్ని మాత్రమే కాక మొత్తం దేవాలయ సముదాయాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా “నీవు దేవుని కుమారుడవు గనుక.” గ్రీకు షరతు వాక్యానికి ఆ భావం కూడా సాధ్యమే; అయితే శోధకుని సవాలును నిలుపుటకు ఇక్కడ “అయితే” అని అనువదించాం.
    reason: alternative_reading
lexical_decisions:
- source_word: ⸂Ἤγαγεν δὲ⸃
  choice: అప్పుడు ... తీసుకెళ్లి
  rationale: δέ కథనంలోని తదుపరి ఘట్టాన్ని సూచిస్తుంది; ἤγαγεν యేసును ఒక చోటికి తీసుకెళ్లడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది. కర్తను సందర్భానుసారంగా ‘అపవాది’ అని స్పష్టం చేశాం.
- source_word: Ἰερουσαλήμ
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన స్థలనామ రూపం.
- source_word: ἔστησεν
  choice: నిలబెట్టి
  rationale: ἵστημι యొక్క కారణార్థక భావాన్ని, అంటే ఆయనను అక్కడ నిలిచేలా చేయడాన్ని, సహజంగా తెలియజేస్తుంది.
- source_word: ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ
  choice: దేవాలయ ప్రాంగణంలోని ఎత్తైన అంచుమీద
  rationale: πτερύγιον ఇక్కడ నిర్మాణంలోని బయటకు పొడుచుకొచ్చిన అంచు లేదా ఎత్తైన కొసను సూచిస్తుంది; ἱερόν అంతర్గర్భాలయాన్ని మాత్రమే కాక మొత్తం దేవాలయ సముదాయాన్ని సూచిస్తుంది. అందువల్ల ప్రధాన వాక్యంలో అర్థాన్ని స్పష్టంగా, సహజంగా ఇచ్చాం.
- source_word: Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: నీవు దేవుని కుమారుడవైతే
  rationale: εἰ తో ఉన్న షరతు వాక్యం సవాలు చేసే ధోరణిని కాపాడుతుంది; ‘అయితే’ అని ఇవ్వడం వలన ‘నీవు నిజంగా కుమారుడవా?’ అని వ్యాఖ్యాత్మకంగా అతిశయింపకుండా మూలంలోని ఉద్వేగం నిలుస్తుంది.
- source_word: βάλε σεαυτὸν
  choice: దూకు
  rationale: ఈ సందర్భంలో తనను తాను కిందికి విసరడం అనే భావాన్ని తెలుగు సహజ ప్రయోగమైన ‘దూకు’ నేరుగా తెలియజేస్తుంది; క్రియ కర్తవైపే తిరిగి వర్తిస్తుందనే విషయం తెలుగులో సహజంగానే అర్థమవుతుంది.
- source_word: ἐντεῦθεν κάτω
  choice: ఇక్కడి నుండి కిందికి
  rationale: స్థానబిందువును, కిందికి సాగే దిశను రెండింటినీ స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: శోధకుడు యేసు గుర్తింపును సవాలు చేసే షరతు వాక్యం
  choice: నీవు దేవుని కుమారుడవైతే
  alternative: నీవు దేవుని కుమారుడవు గనుక
  rationale: εἰ + సూచనార్థక క్రియ కొన్నిసార్లు ‘గనుక/కాబట్టి’ అనే భావం ఇవ్వగలిగినా, ఈ శోధన సందర్భంలో ‘అయితే’ అనేది సవాలు లేదా పరీక్ష యొక్క ఉద్వేగాన్ని కాపాడుతుంది. అయితే ప్రత్యామ్నాయ అర్థసాధ్యతను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘దేవాలయ ప్రాంగణం’ ద్వారా ἱερόν యొక్క విస్తృత అర్థం ప్రధాన వాక్యంలోనే స్పష్టమైంది; మూలంలోని నిర్మాణ రూపకాన్ని పాదసూచికలో నిలిపాం.
