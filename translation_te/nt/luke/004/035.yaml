id: LUK.4.35
reference: Luke 4:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ⸀ἀπ’ αὐτοῦ. καὶ ῥίψαν αὐτὸν τὸ δαιμόνιον εἰς ⸀τὸ μέσον ἐξῆλθεν ἀπ’ αὐτοῦ μηδὲν βλάψαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/035.yaml
  text: And Jesus rebuked it[a], saying, “Be silent and come out of him.” And after throwing him into the midst[b], the demon came out of him without harming him at all.
translation:
  language: te
  text: యేసు దయ్యాన్ని గద్దించి, “నోరు మూసుకో[a], ఇతనిలోనుండి బయటికి రా” అని చెప్పాడు. అప్పుడు దయ్యం ఆ మనిషిని మధ్యలోకి[b] పడవేసి, అతనికి ఏ హానీ చేయకుండా అతనిలోనుండి బయటికి వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలోని పదానికి అక్షరార్థంగా “నోరుకు మూతి వేయబడుము” అని కూడా చెప్పవచ్చు; ఇక్కడ అది మౌనంగా ఉండమనే కఠిన ఆజ్ఞ.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “మధ్యలోకి”; ఎవరి మధ్యలో అనేది ఈ వాక్యంలో స్పష్టంగా చెప్పబడలేదు.
    reason: preserved_ambiguity
lexical_decisions:
- source_word: ἐπετίμησεν αὐτῷ
  choice: దానిని గద్దిస్తూ
  rationale: ἐπιτιμάωలోని కఠినమైన, అధికారపూర్వక మందలింపు భావాన్ని ‘గద్దిస్తూ’ సహజంగా వ్యక్తం చేస్తుంది. αὐτῷ సందర్భంలో దయ్యాన్ని సూచిస్తున్నందున తెలుగు నపుంసక సర్వనామమైన ‘దానిని’ వాడబడింది.
- source_word: Φιμώθητι
  choice: నోరు మూసుకో
  rationale: φιμόωకు ప్రాథమికంగా మూతి కట్టడం అనే రూపకం ఉన్నా, మాట్లాడకుండా చేయమనే ఆజ్ఞలో ‘నోరు మూసుకో’ సహజమైన, పదునైన ఆధునిక తెలుగు. మూలపదంలోని రూపకాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἔξελθε ἀπ’ αὐτοῦ
  choice: ఇతనిలోనుండి బయటికి రా
  rationale: ప్రత్యక్ష భూతవిమోచన ఆజ్ఞను స్పష్టంగా ఉంచుతుంది; ἀπό సూచించే విడిపోవడాన్ని ‘లోనుండి’ తెలియజేస్తుంది.
- source_word: ῥίψαν αὐτὸν
  choice: ఆ మనిషిని … పడవేసి
  rationale: అయోరిస్ట్ కృదంతం ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచిస్తుంది. ‘పడవేసి’ హింసాత్మక చర్యను సహజంగా తెలియజేస్తుంది; మూలంలో లేని అదనపు వివరాన్ని చేర్చదు.
- source_word: εἰς τὸ μέσον
  choice: మధ్యలో
  rationale: ‘మధ్యలోకి’ అనే మూలార్థాన్ని కాపాడుతూ, ఎవరి మధ్యలో అనేది వచనం స్పష్టంగా చెప్పకపోవడాన్ని అలాగే ఉంచుతుంది.
- source_word: τὸ δαιμόνιον
  choice: దయ్యం
  rationale: δαιμόνιονకు సూటిగా, సాధారణ ఆధునిక తెలుగులో అర్థమయ్యే సమానార్థకం.
- source_word: μηδὲν βλάψαν αὐτόν
  choice: అతనికి ఏ హానీ చేయకుండా
  rationale: μηδένలోని సంపూర్ణ నిరాకరణను ‘ఏ హానీ’ ద్వారా కాపాడుతూ, కృదంత సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: δαιμόνιονను ఎలా చిత్రించాలి
  choice: యేసు నేరుగా ఆజ్ఞాపించి, మనిషిలోనుండి బయటికి వచ్చిన ‘దయ్యం’గా అనువదించడం
  alternative: ‘దుష్టశక్తి’ లేదా మానసిక వ్యాధి వంటి అమూర్త వివరణగా మార్చడం
  rationale: గ్రీకు వచనం ప్రత్యక్ష సంబోధన, ఆజ్ఞ, బయటికి రావడం అనే భాషతో దయ్యాన్ని వ్యక్తిగత దుష్టాత్మగా కథనం చేస్తుంది. అనువాదం ఈ చిత్రణను తగ్గించకూడదు లేదా వేరే వివరణను చొప్పించకూడదు.
- issue: దయ్యం చేసిన హింసాత్మక చర్య మరియు హాని జరగకపోవడం మధ్య ఉద్రిక్తత
  choice: ‘పడవేసి’ మరియు ‘ఏ హానీ చేయకుండా’ అనే రెండు అంశాలనూ స్పష్టంగా ఉంచడం
  alternative: పడవేయడాన్ని మృదువుగా చెప్పడం లేదా హాని జరగలేదనే విషయాన్ని సాధారణీకరించడం
  rationale: వచనం హింసాత్మక ప్రదర్శనను, అయినా మనిషికి హాని కలగలేదనే ఫలితాన్ని రెండింటినీ ఉద్దేశపూర్వకంగా కలిపి చెబుతుంది; ఆ ఉద్రిక్తతను అనువాదంలో నిలుపుకోవాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కథనంలోని అధికారపూర్వకత మరియు గంభీరత నిలిచేలా రూపొందించబడింది. ‘నోరు మూసుకో’ ప్రత్యక్ష ఆజ్ఞకు తగిన పదును కలిగి ఉంది; ‘అతనిలోనుండి’ పునరుక్తి గ్రీకు వచన నిర్మాణాన్ని స్పష్టంగా అనుసరిస్తుంది.
