  yaml_path: translation/nt/luke/004/037.yaml
  text: And news about him was spreading into every place in the surrounding region[a].
translation:
  language: te
  text: ఆయన గురించిన వార్త చుట్టుపక్కల ప్రాంతంలోని ప్రతి చోటికీ వ్యాపిస్తూ ఉండేది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన గురించిన సమాచారం చుట్టుపక్కల ప్రాంతంలోని ప్రతి చోటికీ వెలువడుతూ ఉండేది.’
    reason: ἐξεπορεύετοకు మరింత అక్షరార్థమైన ‘వెలువడుతూ ఉండేది,’ ἦχοςకు ‘సమాచారం’ అనే ప్రత్యామ్నాయాలను చూపించడానికి.
lexical_decisions:
- source_word: ἐξεπορεύετο
  choice: వ్యాపిస్తూ వచ్చింది
  rationale: అసంపూర్ణ భూతకాల రూపం గతంలో కొనసాగుతున్న చర్యను సూచిస్తుంది. ἦχος అనే కర్తతో కలిసినప్పుడు, వార్త విస్తరిస్తున్న భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἦχος
  choice: వార్త
  rationale: ఈ పదానికి అక్షరార్థంగా ‘శబ్దం’ అనే భావం ఉన్నా, περὶ αὐτοῦ మరియు ἐξεπορεύετοతో కూడిన ఈ సందర్భంలో యేసు గురించిన సమాచారం లేదా వార్తను సూచిస్తుంది.
- source_word: περὶ αὐτοῦ
  choice: ఆయన గురించిన
  rationale: నివేదిక లేదా వార్త యొక్క విషయాన్ని సూచించే గ్రీకు పదబంధానికి సూటిగా, గౌరవప్రదంగా సరిపోయే అనువాదం.
- source_word: εἰς πάντα τόπον
  choice: ప్రతి చోటికీ
  rationale: πάντα τόπονలోని పంపిణీ భావాన్ని నిలుపుతూ, εἰς సూచించే దిశను ‘-కీ’ ద్వారా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τῆς περιχώρου
  choice: చుట్టుపక్కల ప్రాంతంలోని
  rationale: περίχωρος సూచించే పరిసర ప్రాంతం లేదా జిల్లా అనే భౌగోళిక భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: καὶ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: తెలుగు వాక్యప్రవాహంలో ఈ సాధారణ కథన సంధిని తప్పనిసరిగా ‘మరియు’ అని వ్యక్తపరచడం అసహజంగా ఉంటుంది; వాక్యానుక్రమమే దాని అనుసంధాన భావాన్ని తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ‘వ్యాపిస్తూ వచ్చింది’ కొనసాగుతున్న గత చర్యను సహజంగా వ్యక్తం చేస్తుంది; పాదటిప్పణి గ్రీకు పదబంధానికి దగ్గరైన ప్రత్యామ్నాయాన్ని నిలుపుతుంది.
