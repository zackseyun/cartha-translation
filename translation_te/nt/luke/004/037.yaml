  revision_rationale: The revision retains the contextual sense ‘news’ and the geographical/distributive scope, while rendering the ongoing past force of ἐξεπορεύετο without adding the nuance of వచ్చింది. The footnote is adjusted to a grammatically matching past-progressive alternative.
