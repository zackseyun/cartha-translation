- from: ఆయన గురించిన వార్త చుట్టుపక్కల ప్రాంతంలోని ప్రతి చోటికీ వ్యాపిస్తూ వచ్చింది.[a]
  to: ఆయన గురించిన వార్త చుట్టుపక్కల ప్రాంతంలోని ప్రతి చోటికీ వ్యాపిస్తూ ఉండేది.[a]
  rationale: The revision retains the contextual sense ‘news’ and the geographical/distributive scope, while rendering the ongoing past force of ἐξεπορεύετο without adding the nuance of వచ్చింది. The footnote is adjusted to a grammatically matching past-progressive alternative.
