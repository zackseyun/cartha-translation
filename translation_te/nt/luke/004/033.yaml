  text: καὶ ἐν τῇ συναγωγῇ ἦν ἄνθρωπος ἔχων πνεῦμα δαιμονίου ἀκαθάρτου, καὶ ἀνέκραξεν φωνῇ μεγάλῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/033.yaml
  text: And in the synagogue there was a man having an unclean spirit of a demon[a], and he cried out with a loud voice[b],
translation:
  language: te
  text: 'ఆ సమాజ మందిరంలో అపవిత్రమైన దయ్యపు ఆత్మగల ఒక మనిషి ఉన్నాడు.[a] అతడు బిగ్గర స్వరంతో కేక వేశాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో ‘ఆత్మ’, ‘దయ్యం’ అనే రెండు పదాలూ ఉన్నాయి. ఈ పదబంధాన్ని ‘అపవిత్రమైన దయ్యం యొక్క ఆత్మగల’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναγωγῇ
  choice: సమాజ మందిరంలో
  rationale: ఇది యూదులు కూడి ఆరాధించే స్థలాన్ని సూచిస్తుంది. ఆధునిక తెలుగు బైబిలు వాడుకలో ‘సమాజ మందిరం’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: ἄνθρωπος
  choice: ఒక మనిషి
  rationale: కథనంలో ఒక నిర్దిష్ట పురుషుణ్ని సూచిస్తున్నందున ‘మనిషి’ అని అనువదించాం.
- source_word: ἔχων
  choice: ఆత్మగల
  rationale: మూలంలోని ‘కలిగి ఉన్న’ అనే భావాన్ని కాపాడుతూ, ‘పట్టిన’ లేదా ‘ఆవహించిన’ వంటి మరింత వ్యాఖ్యానాత్మక పదాలను చేర్చకుండా సహజమైన తెలుగులో అందిస్తుంది.
- source_word: πνεῦμα δαιμονίου ἀκαθάρτου
  choice: అపవిత్రమైన దయ్యపు ఆత్మ
  rationale: మూలంలో ఉన్న ‘ఆత్మ’, ‘దయ్యం’, ‘అపవిత్రమైన’ అనే మూడు అంశాలనూ నిలుపుతుంది. ‘అపవిత్రమైన’ అనే విశేషణం గ్రీకు రూపంలో ‘దయ్యం’తో వ్యాకరణపరంగా సరిపోతుంది; తెలుగు సమాసం మూలంలోని సంబంధాన్ని సంక్షిప్తంగా ఉంచుతుంది.
- source_word: ἀνέκραξεν
  choice: కేక వేశాడు
  rationale: ఆకస్మికంగా బిగ్గరగా అరవడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: φωνῇ μεγάλῃ
  choice: పెద్ద స్వరంతో
  rationale: మూలంలోని నిర్దిష్టమైన ‘గొప్ప/పెద్ద స్వరంతో’ అనే రూపాన్ని కాపాడుతుంది; కేవలం ‘బిగ్గరగా’ అని సంక్షిప్తం చేయదు.
theological_decisions:
- issue: దయ్యానికి సంబంధించిన పదబంధం
  choice: అపవిత్రమైన దయ్యపు ఆత్మ
  alternative: అపవిత్రమైన దయ్యం యొక్క ఆత్మ
  rationale: గ్రీకు పాఠంలో πνεῦμα (‘ఆత్మ’) మరియు δαιμόνιον (‘దయ్యం’) రెండూ స్పష్టంగా ఉన్నాయి. రెండింటినీ ఉంచడం ద్వారా అతీంద్రియ సూచనను తగ్గించకుండా, ‘ఆవహించాడు’ వంటి అదనపు సిద్ధాంతపరమైన వివరణను కూడా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే కథనానికి తగిన గౌరవప్రదమైన శైలి పాటించబడింది. తరువాత వచ్చే ప్రత్యక్ష సంభాషణను సూచించడానికి చివర ద్విబిందువు ఉపయోగించబడింది.
