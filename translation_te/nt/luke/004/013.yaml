  text: καὶ συντελέσας πάντα πειρασμὸν ὁ διάβολος ἀπέστη ἀπ’ αὐτοῦ ἄχρι καιροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/013.yaml
  text: And after finishing every temptation[a], the devil departed from him until an opportune time.
translation:
  language: te
  text: అపవాది ప్రతి శోధనను[a] ముగించిన తర్వాత, తగిన సమయం వచ్చేవరకు ఆయనను విడిచి వెళ్లిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రతి పరీక్షను.” గ్రీకు పదానికి “శోధన,” “పరీక్ష” అనే రెండు అర్థాలూ రావచ్చు; అయితే ఇక్కడ అపవాది పాత్రను బట్టి “శోధన” మరింత సహజం.
    reason: lexical_alternative
lexical_decisions:
- source_word: συντελέσας
  choice: ముగించిన తర్వాత
  rationale: ఈ భూతకాల క్రియావిశేషణ రూపం ప్రధాన క్రియకు ముందుగా జరిగిన కార్యాన్ని సూచిస్తుంది. ‘ముగించిన తర్వాత’ అనేది ఆ కాలసంబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: πάντα πειρασμόν
  choice: ప్రతి శోధనను
  rationale: ఏకవచన πειρασμόνతో ఉన్న πάντα ఇక్కడ సందర్భంలోని శోధనలన్నిటినీ సమగ్రంగా సూచిస్తుంది. ‘ప్రతి శోధనను’ అనే రూపం పంపిణీయ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ διάβολος
  choice: అపవాది
  rationale: లూకా కథనంలో ఇది వ్యక్తిగతమైన అతీంద్రియ ప్రత్యర్థిని సూచిస్తుంది. ‘అపవాది’ ఆధునిక తెలుగు బైబిలు వాడుకలో గౌరవప్రదమైన, సుపరిచితమైన పదం.
- source_word: ἀπέστη ἀπ’ αὐτοῦ
  choice: ఆయనను విడిచి వెళ్లిపోయాడు
  rationale: ἀφίστημι ఇక్కడ ఒకరినుంచి తొలగిపోవడం లేదా విడిచి వెళ్లడం అనే అర్థం ఇస్తుంది. ఈ ఎంపిక సహజమైన తెలుగులో మూలార్థాన్ని నిలుపుతుంది.
- source_word: ἄχρι καιροῦ
  choice: తగిన సమయం వచ్చేవరకు
  rationale: καιρός కేవలం కాలాన్ని కాక తగిన లేదా అనుకూల సందర్భాన్ని సూచించగలదు. ఈ అనువాదం అపవాది వెళ్లిపోవడం తాత్కాలికమూ వ్యూహాత్మకమూ అన్న సూచనను అతిగా వివరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: యేసు అనుభవానికి సంబంధించి πειρασμός పదంలోని భావ ఛాయ
  choice: శోధన
  alternative: పరీక్ష
  rationale: πειρασμός అనే పదానికి ‘శోధన’ లేదా ‘పరీక్ష’ అనే రెండు భావాలు సాధ్యమే. ఇక్కడ కార్యనిర్వాహకుడు అపవాది కావడం, యేసును నమ్మకమైన విధేయతనుంచి మళ్లించేందుకు ప్రయత్నించడం వల్ల ప్రధాన పాఠ్యంలో ‘శోధన’ సందర్భోచితం. అయితే ఈ సంఘటన యేసు నమ్మకత్వాన్ని పరీక్షించినదిగా కూడా పనిచేస్తుంది కాబట్టి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వచనానికి తగిన గౌరవప్రదమైన కథన శైలి. మూలంలోని పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, కాలసంబంధం మరియు భావసూక్ష్మతను నిలిపింది.
