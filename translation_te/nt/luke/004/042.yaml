translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని వరుస చర్యలు, కొనసాగుతున్న అన్వేషణ, వెళ్లిపోకుండా అడ్డుకునే ప్రయత్నం నిలుపబడ్డాయి. పాదసూచిక గుర్తులు అవి వివరిస్తున్న పదబంధాల వెంట ఉంచబడ్డాయి.
