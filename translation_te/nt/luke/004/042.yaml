source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ἐξελθὼν ἐπορεύθη εἰς ἔρημον τόπον· καὶ οἱ ὄχλοι ἐπεζήτουν αὐτόν, καὶ ἦλθον ἕως αὐτοῦ, καὶ κατεῖχον αὐτὸν τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/042.yaml
  text: And when day came[a], he went out and went to a deserted place. And the crowds were seeking him[b], and they came to him and were trying to keep him from going away from them.
translation:
  language: te
  text: పగలు కాగానే ఆయన బయటకు వచ్చి ఒక నిర్జన ప్రదేశానికి వెళ్లాడు.[a] జనసమూహాలు ఆయన కోసం వెదుకుతూ ఆయన దగ్గరికి వచ్చాయి; ఆయన తమ దగ్గర నుంచి వెళ్లిపోకుండా అడ్డుకోవడానికి ప్రయత్నించాయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఒక ఏకాంత ప్రదేశానికి’ లేదా ‘జనావాసం లేని ప్రదేశానికి.’ గ్రీకు పదబంధం ఒంటరిగా ఉన్న లేదా జనావాసం లేని ప్రదేశాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆయనను నిలువరించడానికి ప్రయత్నించాయి’ లేదా ‘ఆయనను వెళ్లనివ్వకుండా ఉంచడానికి ప్రయత్నించాయి.’ జనసమూహాలు ఆయన వెళ్లిపోకుండా చేయడానికి ప్రయత్నించాయనేది భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: పగలు కాగానే
  rationale: ఈ genitive absolute కాలమార్పును సూచిస్తుంది. ‘పగలు కాగానే’ అనేది సహజమైన ఆధునిక తెలుగు; పగలు వచ్చిన సమయాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: బయటకు వచ్చి ... వెళ్లాడు
  rationale: ముందుగా బయటకు రావడం, ఆ తర్వాత ఒక ప్రదేశానికి వెళ్లడం అనే వరుస చర్యలను తెలుగులో సహజంగా, స్పష్టంగా ఉంచుతుంది.
- source_word: εἰς ἔρημον τόπον
  choice: ఒక నిర్జన ప్రదేశానికి
  rationale: ἔρημος ఇక్కడ తప్పనిసరిగా ఎడారిని కాకుండా జనావాసం లేని లేదా ఏకాంతమైన ప్రదేశాన్ని సూచిస్తుంది. ‘నిర్జన ప్రదేశం’ ఆ విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: οἱ ὄχλοι
  choice: జనసమూహాలు
  rationale: బహువచనంలోని ὄχλοι అనేక గుంపులుగా ఉన్న ప్రజలను సూచిస్తుంది; ‘జనసమూహాలు’ సంఖ్యను, సమూహ భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: ἐπεζήτουν αὐτόν
  choice: ఆయన కోసం వెదుకుతూ
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న అన్వేషణను తెలుగులో ‘వెదుకుతూ’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἦλθον ἕως αὐτοῦ
  choice: ఆయన దగ్గరికి వచ్చాయి
  rationale: వారు ఆయన ఉన్న చోటుకు చేరుకున్నారనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: κατεῖχον αὐτὸν
  choice: అడ్డుకోవడానికి ప్రయత్నించాయి
  rationale: κατέχω ఇక్కడ ఆయనను వెళ్లనివ్వకుండా నిలిపే ప్రయత్నాన్ని సూచిస్తుంది. భౌతికంగా పట్టుకున్నారనే భావాన్ని అనవసరంగా నిర్ధారించకుండా ప్రయత్నాత్మక భావాన్ని నిలుపుతుంది.
- source_word: τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν
  choice: ఆయన తమ దగ్గర నుంచి వెళ్లిపోకుండా
  rationale: ఆయన వారిని విడిచి వెళ్లకుండా చేయడమే జనసమూహాల ఉద్దేశమని ఈ నిర్మాణం స్పష్టంగా తెలుపుతుంది.
