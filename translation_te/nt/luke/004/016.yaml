id: LUK.4.16
reference: Luke 4:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν ⸀εἰς Ναζαρά, οὗ ἦν τεθραμμένος, καὶ εἰσῆλθεν κατὰ τὸ εἰωθὸς αὐτῷ ἐν τῇ ἡμέρᾳ τῶν σαββάτων εἰς τὴν συναγωγήν, καὶ ἀνέστη ἀναγνῶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/016.yaml
  text: And he came to Nazara[a], where he had been brought up, and as was his custom, he entered the synagogue on the Sabbath day, and stood up to read.
translation:
  language: te
  text: ఆయన పెరిగిన నజరా[a]కు వచ్చాడు. తన ఆచారం ప్రకారం ఆయన సబ్బాతు దినాన సమాజమందిరంలోకి వెళ్లి, చదవడానికి లేచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నజరేతు.’ ఇక్కడ గ్రీకు పాఠంలో ‘నజరా’ అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Ναζαρά
  choice: నజరా
  rationale: ఈ వచనంలోని గ్రీకు రూపం Ναζαράను నేరుగా ప్రతిబింబించేలా ‘నజరా’ అని లిప్యంతరీకరించాం; పాఠకులకు సుపరిచితమైన ‘నజరేతు’ను పాదటిప్పణిలో ఇచ్చాం.
- source_word: τεθραμμένος
  choice: తాను పెరిగిన
  rationale: τρέφω క్రియ యొక్క పరిపూర్ణ కర్మణి కృదంతం ఇక్కడ ఆయన పెంపకం పొంది ఎదిగిన స్థలాన్ని సూచిస్తుంది. ‘తాను పెరిగిన’ అనేది సహజమైన ఆధునిక తెలుగు.
- source_word: κατὰ τὸ εἰωθὸς αὐτῷ
  choice: తన ఆచారం ప్రకారం
  rationale: ఆయన అలవాటుగా పాటించే పద్ధతిని ఈ పదబంధం తెలియజేస్తుంది; ఈ అనువాదం ఆ భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ἐν τῇ ἡμέρᾳ τῶν σαββάτων
  choice: విశ్రాంతిదినాన
  rationale: గ్రీకులో బహువచన రూపం ఉన్నప్పటికీ ఇది ఒక విశ్రాంతిదినాన్ని సూచించే స్థిరప్రయోగం; తెలుగులో ఏకవచన రూపం సహజం.
- source_word: συναγωγήν
  choice: సమాజమందిరం
  rationale: ఈ యూదు సందర్భంలో పదం ప్రజలు కూడే సాధారణ సభను మాత్రమే కాక, యూదుల ఆరాధనా-బోధనా స్థలాన్ని సూచిస్తుంది.
- source_word: ἀνέστη ἀναγνῶναι
  choice: లేచి చదవడానికి నిలబడ్డాడు
  rationale: ἀνέστηతో కూడిన ఉద్దేశార్థక infinitive ఆయన చదవడం కోసం లేచి నిలబడిన చర్యను తెలియజేస్తుంది.
theological_decisions:
- issue: Ναζαρά అనే స్థలనామాన్ని ఎలా ఇవ్వాలి
  choice: నజరా
  alternative: నజరేతు
  rationale: ఈ వచనంలో ఉన్న గ్రీకు రూపాన్ని ఇతర వచనాల్లోని సుపరిచిత రూపంతో సమన్వయపరచకుండా నేరుగా ప్రతిబింబించాం. సంప్రదాయ స్థలనామాన్ని పాదటిప్పణిలో ఉంచడం వల్ల మూలపాఠ రూపమూ, పాఠకులకు తెలిసిన పేరూ రెండూ స్పష్టమవుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. గ్రీకు వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా సహజ తెలుగు వాక్యనిర్మాణాన్ని ఎంచుకున్నాం; అయితే చర్యల క్రమాన్ని, ఆచారబద్ధతను, చదవడానికి నిలబడిన ఉద్దేశాన్ని నిలిపాం.
