  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ τοῦ διαφυλάξαι σε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/010.yaml
  text: 'For it is written: ‘He will command his angels concerning you[c][b][a], to guard you,’'
translation:
  language: te
  text: 'ఎందుకంటే ఇలా రాసి ఉంది: “ఆయన తన దూతలకు నీ విషయమై నిన్ను కాపాడమని ఆజ్ఞాపిస్తాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: రాసి ఉంది
  rationale: లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే పరిపూర్ణ కర్మణి రూపానికి సహజమైన ఆధునిక తెలుగు; గతంలో రాయబడినది ఇప్పటికీ ప్రామాణికంగా నిలిచి ఉందనే భావాన్ని తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలోని ప్రలోభపెట్టువాని వాదనకు కారణం లేదా ఆధారం చూపే వివరణాత్మక సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ὅτι
  choice: ':'
  rationale: తెలుగులో ‘ఇలా రాసి ఉంది’ తరువాత ఉల్లేఖనాన్ని ద్విబిందువుతో సహజంగా ప్రవేశపెడుతుంది; ప్రత్యేకంగా ‘అని’ చేర్చకుండా మూలంలోని విషయ-పరిచయ కార్యాన్ని నిలుపుతుంది.
- source_word: Τοῖς ἀγγέλοις αὐτοῦ
  choice: ఆయన తన దూతలకు
  rationale: దత్తివ విభక్తిని ‘దూతలకు’గా, αὐτοῦను సహజమైన స్వామ్య సూచన ‘తన’గా వ్యక్తం చేస్తుంది; ఆజ్ఞాపించే కర్తను తెలుగులో స్పష్టంగా చూపేందుకు ‘ఆయన’ను ఉంచింది.
- source_word: ἐντελεῖται
  choice: ఆజ్ఞాపిస్తాడు
  rationale: భవిష్యత్ భావంతో కూడిన ‘ఆజ్ఞ ఇవ్వడం’ అనే అర్థాన్ని సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: περὶ σοῦ
  choice: నీ గురించి
  rationale: περί + షష్ఠీ విభక్తి యొక్క ‘నీ విషయమై/నీ గురించి’ అనే భావాన్ని సాధారణ పాఠకుడికి సహజంగా అందిస్తుంది.
- source_word: τοῦ διαφυλάξαι σε
  choice: నిన్ను కాపాడడానికి
  rationale: ఆర్టిక్యులర్ ఇన్ఫినిటివ్ తెలిపే ఉద్దేశాన్ని తెలుగులో స్పష్టమైన ప్రయోజనార్థక నిర్మాణంగా ఇస్తుంది; διαφυλάσσω యొక్క జాగ్రత్తగా కాపాడే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: సాతాను ఉటంకించిన కీర్తన వాక్యపు పరిమితి
  choice: లూకా ఇక్కడ నమోదు చేసిన మాటలను మాత్రమే అనువదించడం
  alternative: కీర్తన 91:11లోని పూర్తి మాటలను చేర్చి ఉల్లేఖనాన్ని విస్తరించడం
  rationale: లూకా ఇచ్చిన గ్రీకు పాఠ్యంలో ఉన్న భాగాన్నే నిలుపుతుంది; మూలంలో లేని కీర్తన కొనసాగింపును చేర్చి సమన్వయం చేయదు.
- issue: τοῦ διαφυλάξαι σε యొక్క వాక్యనిర్మాణ సంబంధం
  choice: ‘నిన్ను కాపాడడానికి’ అనే ఉద్దేశ వాక్యభాగాన్ని ముందుకు ఉంచి ఆజ్ఞ యొక్క లక్ష్యంగా చూపడం
  alternative: ‘నీ గురించి, నిన్ను కాపాడాలని’ అని మూల పదక్రమానికి మరింత దగ్గరగా ఉంచడం
  rationale: గ్రీకులో ఇది ‘నీ గురించి’ అనే పదబంధాన్ని వివరిస్తుందా, లేక ఆజ్ఞ యొక్క ఉద్దేశాన్ని తెలియజేస్తుందా అనే స్వల్ప నిర్మాణ అస్పష్టత ఉంది. తెలుగు ప్రధాన పాఠ్యం సహజంగా ఉద్దేశ భావాన్ని చూపుతుంది; ప్రత్యామ్నాయ నిర్మాణాన్ని పాదటిప్పణిలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన లేఖన శైలిని ఉపయోగించాం. ‘రాసి ఉంది,’ ‘దూతలు,’ ‘ఆజ్ఞాపిస్తాడు,’ ‘కాపాడడానికి’ వంటి విస్తృతంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం; ప్రాచీన లేదా మతశాఖకు ప్రత్యేకమైన పదజాలాన్ని నివారించాం.
