    text: అక్షరార్థంగా, ‘కొండ నుదురు’; అంటే ఎత్తైన ప్రదేశపు అంచు లేదా శిఖర-రేఖ.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆయనను ఎత్తు నుంచి కిందికి విసిరివేయడానికి.’
    reason: lexical_alternative
  revision_rationale: The revision removes unsupported temporal and distributive emphasis, restores the Greek’s connected sequence of actions, and renders the ὥστε-plus-infinitive clause as the crowd’s intended action without adding an explanatory clause. It also corrects the topographical footnote while preserving the lexical ambiguity of ὀφρύς.
