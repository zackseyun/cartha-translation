source:
  edition: SBLGNT
  text: καὶ ἀναστάντες ἐξέβαλον αὐτὸν ἔξω τῆς πόλεως, καὶ ἤγαγον αὐτὸν ἕως ὀφρύος τοῦ ὄρους ἐφ’ οὗ ἡ πόλις ⸂ᾠκοδόμητο αὐτῶν, ὥστε⸃ κατακρημνίσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/029.yaml
  text: And rising up[a], they drove him out of the town and led him to the brow of the hill on which their town had been built[b], so as to throw him down.
translation:
  language: te
  text: వారు లేచి, ఆయనను పట్టణం వెలుపలికి తోలివేసి, తమ పట్టణం నిర్మించబడిన కొండ అంచు[a] వరకు ఆయనను తీసుకువెళ్లారు, ఆయనను కిందికి పడదోయడానికి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘కొండ నుదురు’; అంటే ఎత్తైన ప్రదేశపు అంచు లేదా శిఖర-రేఖ.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆయనను ఎత్తు నుంచి కిందికి విసిరివేయడానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: లేచి
  rationale: సమూహం అకస్మాత్తుగా చర్యకు దిగడాన్ని సూచించే భూతకాల అసమాపక క్రియారూపం. సహజమైన తెలుగులో శారీరక కదలికను నిలుపుతుంది.
- source_word: ἐξέβαλον
  choice: వెలుపలికి తోలివేసి
  rationale: బలవంతంగా బయటకు పంపడం అనే శత్రుత్వభరిత భావాన్ని వ్యక్తం చేస్తుంది; మతపరమైన ప్రత్యేకార్థం కలిగే పదజాలాన్ని నివారిస్తుంది.
- source_word: πόλεως
  choice: పట్టణం
  rationale: πόλις నగరం లేదా పట్టణాన్ని సూచించగలదు. నజరేతు సందర్భంలో ‘పట్టణం’ సహజంగా, సముచితంగా ఉంటుంది.
- source_word: ἤγαγον
  choice: తీసుకెళ్లారు
  rationale: ἄγω యొక్క విస్తృతమైన ‘నడిపించు/తీసుకెళ్లు’ భావాన్ని ఇస్తుంది. ‘ఈడ్చుకెళ్లారు’ అని అనువదిస్తే మూలపదం స్వయంగా చెప్పేదానికంటే హింసను పెంచినట్లవుతుంది.
- source_word: ἕως ὀφρύος τοῦ ὄρους
  choice: కొండ అంచు వరకు
  rationale: ὀφρύς అక్షరార్థంగా కనుబొమ/నుదురు అయినా, భౌగోళిక సందర్భంలో ఎత్తైన ప్రదేశపు అంచు లేదా కనుమను సూచిస్తుంది. ‘కొండ అంచు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: ἐφ’ οὗ ἡ πόλις ᾠκοδόμητο αὐτῶν
  choice: తమ పట్టణం కట్టబడి ఉన్న కొండ
  rationale: పట్టణం ఆ కొండ మీద నిర్మించబడి ఉందనే సంబంధాన్ని, అలాగే αὐτῶν లోని స్థానికులకు చెందినదనే భావాన్ని ‘తమ’ ద్వారా నిలుపుతుంది.
- source_word: ὥστε
  choice: పడదోయడానికి
  rationale: ఇక్కడ ὥστε + infinitive సమూహపు ఉద్దేశాన్ని లేదా లక్ష్యించిన ఫలితాన్ని సూచిస్తుంది. తెలుగులో ప్రయోజనార్థక రూపం సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: κατακρημνίσαι
  choice: కిందికి పడదోయడానికి
  rationale: ఎత్తైన చోటు నుంచి కిందికి విసరడం లేదా పడవేయడం అనే బలమైన భావాన్ని ఇస్తుంది; మూలంలో స్పష్టంగా లేని ‘కొండచరియ’ అనే నామవాచకాన్ని చేర్చదు.
theological_decisions:
- issue: సమూహం చర్యలో సూచితమైన హింస స్థాయి
  choice: వారు యేసును బలవంతంగా బయటకు తోలి, ఎత్తు నుంచి పడదోయాలనే ఉద్దేశంతో తీసుకెళ్లారని చర్యల క్రమం ద్వారా చూపడం
  alternative: ‘హత్య చేయడానికి’ అని ఉద్దేశాన్ని వివరణాత్మకంగా నేరుగా పేర్కొనడం
  rationale: వచనం ప్రాణాంతక ఉద్దేశాన్ని బలంగా సూచించినా, ‘హత్య’ అనే వివరణాత్మక పదాన్ని నేరుగా ఉపయోగించదు. మూలంలోని చర్యలు, ఉద్దేశార్థక క్రియారూపమే ఆ తీవ్రతను వెల్లడించేలా అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘ఆయన’ అనే గౌరవ సూచక సర్వనామం వాడబడింది. హింసను తగ్గించకుండా, మూలంలో లేని ‘కొండచరియ’ లేదా ‘హత్య’ వంటి వివరాలను ప్రధాన పాఠ్యంలో చేర్చలేదు.
