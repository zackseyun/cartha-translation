  text: σὺ οὖν ἐὰν προσκυνήσῃς ἐνώπιον ἐμοῦ, ἔσται σοῦ πᾶσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/007.yaml
  text: Therefore[a], if you worship before me, it will all be yours.
translation:
  language: te
  text: కాబట్టి, నువ్వు నా ఎదుట ఆరాధిస్తే[a], ఇదంతా నీదవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా ఎదుట సాగిలపడితే.’ గ్రీకు క్రియ సాగిలపడడాన్ని లేదా ఆరాధించడాన్ని సూచించగలదు; ఇక్కడ సందర్భం సాతానుకు మతపరమైన ఆరాధనను అర్పించడం గురించి ఉన్నందున ప్రధాన పాఠంలో ‘ఆరాధిస్తే’ అని వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: నువ్వు
  rationale: గ్రీకులో ఏకవచన ద్వితీయ పురుష సర్వనామం స్పష్టంగా ఉండి స్వల్ప ఉద్ఘాటనను కలిగిస్తుంది; సాతాను యేసును నేరుగా సంబోధిస్తున్న సందర్భంలో ‘నువ్వు’ సహజంగా ఉంటుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: మునుపటి వచనంలోని ప్రతిపాదన నుంచి వచ్చే పర్యవసానాన్ని సూచించే అన్వయాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐὰν
  choice: …స్తే
  rationale: ఉపవాక్యంలోని షరతును ఆధునిక తెలుగులో సహజమైన షరతార్థక క్రియారూపంతో వ్యక్తం చేస్తుంది.
- source_word: προσκυνήσῃς
  choice: సాగిలపడి నన్ను ఆరాధిస్తే
  rationale: προσκυνέωలోని శరీర భంగిమతో కూడిన వంగి నమస్కరించడం, ఆరాధనాత్మక విధేయత—ఈ రెండు భావాలను సందర్భానుసారంగా నిలుపుతుంది.
- source_word: ἐνώπιον ἐμοῦ
  choice: నా ఎదుట
  rationale: స్థలసంబంధమైన, వ్యక్తిసంబంధమైన ‘నా సమక్షంలో/నా ఎదుట’ అనే భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: ἔσται σοῦ
  choice: నీదవుతుంది
  rationale: భవిష్యత్తు స్వామ్యార్థాన్ని సహజమైన తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: πᾶσα
  choice: ఇదంతా
  rationale: స్త్రీలింగ ఏకవచనమైన πᾶσα మునుపటి వచనంలోని సమస్త అధికారాన్ని, మహిమను సూచించే అధ్యాహారాన్ని కలిగి ఉంది; తెలుగు వాక్యానికి అవసరమైన సూచనను అతిగా ప్రత్యేకీకరించకుండా ‘ఇదంతా’ అందిస్తుంది.
theological_decisions:
- issue: προσκυνέωను కేవలం శారీరక నమస్కారంగా అనువదించాలా, ఆరాధనగా అనువదించాలా
  choice: సాగిలపడి నన్ను ఆరాధిస్తే
  alternative: నా ఎదుట సాగిలపడితే / నాకు నమస్కరిస్తే
  rationale: ఈ క్రియకు సాగిలపడడం, నమస్కరించడం, ఆరాధించడం అనే భావపరిధి ఉంది. తరువాతి వచనంలో దేవునికే ఆరాధన చేయాలనే యేసు సమాధానం వల్ల ఇక్కడ మతపరమైన విధేయత ప్రధానంగా ఉంది; ‘సాగిలపడి…ఆరాధిస్తే’ అనే రూపం శారీరక చర్యనూ దాని ఆరాధనాత్మక ఉద్దేశాన్నీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రత్యక్ష సంభాషణ. ‘నువ్వు/నీ’ ఏకవచన సంబోధన మూలంలోని ద్వితీయ పురుష ఏకవచనాన్ని ప్రతిబింబిస్తుంది. ‘సాగిలపడి…ఆరాధిస్తే’ మూలక్రియలోని భౌతిక భంగిమ మరియు మతపరమైన గౌరవం రెండింటినీ స్పష్టంగా ఉంచుతుంది.
