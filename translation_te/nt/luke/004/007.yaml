  verdict: revise
  source_fidelity: The draft correctly preserves the conditional force, the consequential οὖν, the future possession, and the comprehensive sense of πᾶσα. However, ‘సాగిలపడి నన్ను ఆరాధిస్తే’ represents the single Greek verb προσκυνήσῃς as two coordinated actions and adds an explicit object alongside ‘నా ఎదుట.’ A single Telugu verb better reflects the source while retaining the contextual sense of religious homage.
  naturalness: ‘కాబట్టి, నువ్వు నా ఎదుట ఆరాధిస్తే, ఇదంతా నీదవుతుంది’ is concise, natural modern standard Telugu, and suitably direct for the dialogue. It avoids the slightly redundant and expanded ‘సాగిలపడి నన్ను ఆరాధిస్తే.’
  terminology: ‘ఆరాధిస్తే’ appropriately renders προσκυνήσῃς in this temptation context. The footnote retains ‘సాగిలపడితే’ as a legitimate lexical alternative without making the main text carry both alternatives simultaneously.
