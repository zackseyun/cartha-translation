source:
  edition: SBLGNT
  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ὅτι ἐν ἐξουσίᾳ ἦν ὁ λόγος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/032.yaml
  text: And they were astonished at his teaching[a], because his word had authority.
translation:
  language: te
  text: ఆయన బోధకు వారు ఆశ్చర్యపోయారు, ఎందుకంటే ఆయన మాటకు అధికారం ఉండేది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆయన సందేశం అధికారంతో ఉండేది”; లేదా “ఆయన చెప్పేది అధికారంతో ఉండేది.”
    reason: λόγος మరియు ἐν ἐξουσίᾳ పదబంధాలకు సందర్భానికి తగిన ఇతర సహజ అనువాదాలను చూపించడానికి.
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: ఆశ్చర్యపోయారు
  rationale: ఈ క్రియ బలమైన ఆశ్చర్యాన్ని సూచిస్తుంది. గ్రీకు అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న ప్రతిస్పందనను సందర్భానుసారంగా సహజమైన తెలుగు కథన శైలిలో వ్యక్తపరుస్తుంది.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: ఆయన బోధకు
  rationale: ἐπίతో కూడిన ఈ పదబంధం వారి ఆశ్చర్యానికి ఆధారం లేదా విషయాన్ని సూచిస్తుంది. ‘బోధకు’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, బోధించే కార్యాన్నీ బోధలోని విషయాన్నీ సూచించగలదు.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఇక్కడ ὅτι వారి ఆశ్చర్యానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: ἐν ἐξουσίᾳ
  choice: అధికారంతో కూడి
  rationale: యేసు మాటకు ఉన్న అధికారయుక్తమైన లక్షణాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; అది కేవలం మాట్లాడే శైలిని మాత్రమే సూచించేలా పరిమితం చేయదు.
- source_word: ὁ λόγος αὐτοῦ
  choice: ఆయన మాట
  rationale: λόγος ఇక్కడ యేసు పలికిన మాట లేదా ప్రసంగాన్ని సూచిస్తుంది. ‘మాట’ గ్రీకు వాక్యంలోని సంక్షిప్తతను కాపాడుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: యేసు మాటలోని అధికారం యొక్క స్వభావం
  choice: ‘ఆయన మాట అధికారంతో కూడి ఉంది’ అని వర్ణనాత్మకంగా అనువదించబడింది.
  alternative: ‘ఆయన సందేశానికి అధికారం ఉంది’ లేదా ‘ఆయన చెప్పినది అధికారపూర్వకంగా ఉంది.’
  rationale: ఈ వచనం యేసు మాటకు అధికారం ఉందని స్పష్టంగా చెబుతుంది; అయితే ఆ అధికారానికి పూర్తి దైవశాస్త్రీయ ఆధారం ఏమిటో ఈ వచనంలో వివరించదు. అందువల్ల మూలంలో లేని క్రీస్తుశాస్త్ర వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘సిద్ధాంతం’ వంటి పరిమిత మతపరమైన పదానికి బదులుగా విస్తృతార్థం గల ‘బోధ’ను ఎంచుకున్నాం.
