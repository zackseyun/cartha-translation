  revision_rationale: The revision preserves the verse's causal claim and avoids interpreting the nature or origin of Jesus' authority. It replaces an awkward construction with idiomatic Telugu and represents the Greek past narrative wording more consistently. The footnote retains legitimate alternatives for λόγος and the phrase ἐν ἐξουσίᾳ.
