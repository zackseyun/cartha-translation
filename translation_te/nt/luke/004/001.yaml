id: LUK.4.1
reference: Luke 4:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰησοῦς δὲ ⸂πλήρης πνεύματος ἁγίου⸃ ὑπέστρεψεν ἀπὸ τοῦ Ἰορδάνου, καὶ ἤγετο ἐν τῷ πνεύματι ⸂ἐν τῇ ἐρήμῳ⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/001.yaml
  text: And Jesus[a], full of the Holy Spirit, returned from the Jordan and was being led by the Spirit in the wilderness.
translation:
  language: te
  text: యేసు పవిత్రాత్మతో నిండినవాడై యొర్దాను నుండి తిరిగి వచ్చాడు. ఆయన అరణ్యంలో ఆత్మచేత నడిపించబడుతూ ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆత్మలో.” గ్రీకు పదబంధాన్ని మరింత అక్షరార్థంగా ఇలా అనువదించవచ్చు; అయితే ఇక్కడ ఆత్మ ఆయనను నడిపిస్తున్నాడనే భావమే ఎక్కువగా కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης πνεύματος ἁγίου
  choice: పవిత్రాత్మతో నిండినవాడై
  rationale: πλήρης + సంబంధ విభక్తి ఒక దానితో నిండియున్న స్థితిని సూచిస్తుంది. ఈ తెలుగు రూపం ఆ స్థిరమైన వర్ణనను సహజంగా తెలియజేస్తుంది; అప్పుడే సంభవించిన నింపుదల సంఘటనగా సూచించదు.
- source_word: ὑπέστρεψεν
  choice: తిరిగి వచ్చాడు
  rationale: ὑποστρέφω యొక్క సాధారణ అర్థం ‘తిరిగి రావడం’; సందర్భంలో ఇది సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: ἀπὸ τοῦ Ἰορδάνου
  choice: యొర్దాను నుండి
  rationale: మూలంలో నది అనే వివరణాత్మక పదం లేదు; ప్రదేశనామాన్ని నేరుగా ఉంచడం మూలానికి సమీపంగా, తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: ἤγετο
  choice: నడిపించబడుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల కర్మణి రూపం గతంలో కొనసాగుతున్న క్రియను సూచిస్తుంది; ‘నడిపించబడుతూ ఉన్నాడు’ ఆ ప్రగతిశీల భావాన్ని నిలుపుతుంది.
- source_word: ἐν τῷ πνεύματι
  choice: ఆత్మచేత
  rationale: ἐν అక్షరార్థంగా ‘లో’ కావచ్చును; అయితే కర్మణి ἄγωతో ఇక్కడ నడిపించే వ్యక్తిగా ఆత్మను సూచించే సాధనార్థక/కర్తార్థక భావం సహజం. సమీప సందర్భంలోని పవిత్రాత్మనే ఇది సూచిస్తుంది.
- source_word: ἐν τῇ ἐρήμῳ
  choice: అరణ్యంలో
  rationale: ἔρημος నిర్జన ప్రాంతం, అరణ్యం లేదా ఎడారిని సూచించగలదు. ‘అరణ్యం’ ఇసుక ఎడారి అని అతిగా నిర్దిష్టపరచకుండా నిర్జన ప్రదేశ భావాన్ని ఇస్తుంది.
- source_word: δὲ
  choice: వాక్య విభజన ద్వారా మృదువైన కొనసాగింపు
  rationale: δέ కథనంలో స్వల్ప మార్పు లేదా కొనసాగింపును సూచిస్తుంది. తెలుగులో తప్పనిసరిగా సంధానపదం చేర్చకుండా వరుస వాక్య నిర్మాణంతో ఆ ప్రవాహం సహజంగా వ్యక్తమవుతుంది.
theological_decisions:
- issue: ἐν τῷ πνεύματι లోని ‘ఆత్మ’ ఎవరిని సూచిస్తుంది?
  choice: పవిత్రాత్మ
  alternative: యేసు అంతరాత్మ లేదా ఆత్మీయ స్థితి
  rationale: వెంటనే ముందు ‘పవిత్రాత్మతో నిండినవాడై’ అని ఉండటం, లూకా కథనంలో పవిత్రాత్మ క్రియాశీలంగా నడిపించేవాడిగా కనిపించడం వల్ల అదే పవిత్రాత్మను సూచించడం అత్యంత సహజం. పాఠానికి మించిన సిద్ధాంత వివరాలు ఇందులో చేర్చలేదు.
- issue: ἐν τῷ πνεύματι యొక్క సంబంధ భావం
  choice: ఆత్మచేత నడిపించబడడం
  alternative: ఆత్మలో నడిపించబడడం
  rationale: గ్రీకు ἐν రూపం స్థానార్థకంగా ‘లో’ అని కూడా అనువదించవచ్చు; అయినా కర్మణి క్రియతో ఇక్కడ ఆత్మ నడిపించే కర్తగా అర్థం కావడం సహజం. అసలు వ్యక్తీకరణలోని ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. గ్రీకు అసంపూర్ణ భూతకాలంలోని కొనసాగింపు భావాన్ని ‘నడిపించబడుతూ ఉన్నాడు’తో నిలిపి, పొడవైన వాక్యాన్ని తెలుగులో సహజంగా ఉండేందుకు రెండు వాక్యాలుగా విభజించాం. పాదసూచిక గుర్తు సంబంధిత వాక్యాంతంలో ఉంచబడింది.
