translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గంభీరమైన ప్రకటన స్వరాన్ని నిలుపుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదాలు వాడబడ్డాయి.
