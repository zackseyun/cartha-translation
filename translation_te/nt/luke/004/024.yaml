source:
  edition: SBLGNT
  text: εἶπεν δέ· Ἀμὴν λέγω ὑμῖν ὅτι οὐδεὶς προφήτης δεκτός ἐστιν ἐν τῇ πατρίδι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/024.yaml
  text: And he said[a], “Truly I tell you, no prophet is accepted in his hometown.”
translation:
  language: te
  text: 'అప్పుడు ఆయన ఇలా అన్నాడు: “నేను మీతో నిజంగా చెబుతున్నాను: ఏ ప్రవక్తకూ తన సొంత ఊరిలో ఆదరణ ఉండదు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన స్వస్థలంలో” లేదా “తన స్వదేశంలో.” గ్రీకు పదమైన πατρίς ఒకరి సొంత ఊరును, స్వప్రాంతాన్ని లేదా స్వదేశాన్ని సూచించవచ్చు; ఇక్కడ నజరేతు సందర్భానికి “సొంత ఊరు” సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δέ
  choice: అప్పుడు ఆయన ఇలా అన్నాడు
  rationale: δέ కథనాన్ని స్వల్పంగా ముందుకు నడిపించే అనుసంధాన పదం. ఇక్కడ బలమైన వ్యతిరేకతను సూచించకుండా, సహజమైన తెలుగు కథన ప్రవాహం కోసం ‘అప్పుడు’ వాడబడింది.
- source_word: Ἀμὴν
  choice: నిజంగా
  rationale: యేసు పలుకుల్లో ἀμήν గంభీరమైన ధృవీకరణకు నాంది. ‘నిజంగా’ దాని భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో ... చెబుతున్నాను
  rationale: ప్రత్యక్ష సంబోధనను, గంభీరమైన ప్రకటన స్వరాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉండే రూపం.
- source_word: οὐδεὶς προφήτης
  choice: ఏ ప్రవక్తకూ ... ఉండదు
  rationale: గ్రీకు భాషలోని సంపూర్ణ నిరాకరణను తెలుగులో సహజమైన ‘ఏ ... కూ ... ఉండదు’ నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: δεκτός
  choice: ఆదరణ
  rationale: ఇక్కడ పదం అనుకూలంగా స్వీకరించబడటం, గౌరవంతో ఆహ్వానించబడటం అనే సామాజిక భావాన్ని సూచిస్తుంది. ‘ఆదరణ ఉండదు’ ఈ విస్తృత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἐν τῇ πατρίδι αὐτοῦ
  choice: తన సొంత ఊరిలో
  rationale: πατρίς సొంత ఊరు, స్వస్థలం, లేదా స్వదేశాన్ని సూచించగలదు. తక్షణ సందర్భం నజరేతు కావడంతో ‘సొంత ఊరు’ సందర్భానికి తగినది; ఇతర సాధ్యార్థాలు పాదటిప్పణిలో ఉంచబడ్డాయి.
