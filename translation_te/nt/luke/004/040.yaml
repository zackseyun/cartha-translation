id: LUK.4.40
reference: Luke 4:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Δύνοντος δὲ τοῦ ἡλίου ⸀ἅπαντες ὅσοι εἶχον ἀσθενοῦντας νόσοις ποικίλαις ἤγαγον αὐτοὺς πρὸς αὐτόν· ὁ δὲ ἑνὶ ἑκάστῳ αὐτῶν τὰς χεῖρας ⸂ἐπιτιθεὶς ἐθεράπευεν⸃ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/040.yaml
  text: When the sun was setting[a], all who had people sick with various diseases brought them to him; and he laid his hands on each one of them and healed them.
translation:
  language: te
  text: సూర్యుడు అస్తమిస్తున్నప్పుడు[a], రకరకాల వ్యాధులతో బాధపడుతున్నవారు తమ దగ్గర ఉన్న వారందరూ వారిని ఆయన దగ్గరకు తీసుకొచ్చారు. ఆయన వారిలో ప్రతి ఒక్కరి మీద చేతులు ఉంచి వారిని స్వస్థపరిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సూర్యుడు అస్తమిస్తుండగా” అని కూడా అనువదించవచ్చు. గ్రీకులో వర్తమాన అసమాపక క్రియతో కూడిన షష్ఠీ స్వతంత్ర ప్రయోగం ఉంది; ఇది ఈ సంఘటనలు జరిగిన సమయాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δύνοντος δὲ τοῦ ἡλίου
  choice: సూర్యుడు అస్తమిస్తున్నప్పుడు
  rationale: వర్తమాన అసమాపక క్రియతో కూడిన గ్రీకు షష్ఠీ స్వతంత్ర ప్రయోగం, తరువాతి సంఘటనలు జరుగుతున్న సమయంలోనే సూర్యాస్తమయం కొనసాగుతున్నదని తెలియజేస్తుంది. తెలుగు ప్రయోగం ఆ సమకాలిక భావాన్ని సహజంగా నిలుపుతుంది; δέను అనవసరమైన ‘ఇప్పుడు’తో విస్తరించలేదు.
- source_word: ἅπαντες ὅσοι
  choice: ఎవరి దగ్గర ఉన్నారో, వారందరూ
  rationale: ఈ సంయుక్త ప్రయోగంలోని సమగ్రతను ‘వారందరూ’ నిలుపుతుంది; సంబంధ వాక్య నిర్మాణం ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: εἶχον ἀσθενοῦντας
  choice: బాధపడుతున్నవారు ఎవరి దగ్గర ఉన్నారో
  rationale: ἔχω ఇక్కడ రోగులు తమ సంరక్షణలో లేదా తమతో ఉన్నారనే సంబంధాన్ని సూచిస్తుంది. ‘దగ్గర ఉన్నారు’ అనే పదబంధం కుటుంబం లేదా ఇల్లు అని మూలంలో లేని పరిమితిని చేర్చకుండా ఆ సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἀσθενοῦντας νόσοις ποικίλαις
  choice: రకరకాల వ్యాధులతో బాధపడుతున్నవారు
  rationale: స్వస్థత సందర్భంలో ἀσθενέω అనారోగ్యాన్ని సూచిస్తుంది; ποικίλαις వ్యాధుల వైవిధ్యాన్ని తెలియజేస్తుంది. ఈ తెలుగు రూపం స్పష్టంగా, సహజంగా ఉంది.
- source_word: ἤγαγον αὐτοὺς πρὸς αὐτόν
  choice: వారిని ఆయన దగ్గరకు తీసుకొచ్చారు
  rationale: ఈ సందర్భంలో ἄγωకు ‘తీసుకొచ్చారు’ సహజమైన తెలుగు సమానార్థకం; రోగులను యేసు వద్దకు తీసుకురావడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἑνὶ ἑκάστῳ αὐτῶν
  choice: వారిలో ప్రతి ఒక్కరి మీద
  rationale: ద్విగుణ పంపిణీ భావం ప్రతి వ్యక్తికీ లభించిన ప్రత్యేక శ్రద్ధను నొక్కి చెబుతుంది; ‘ప్రతి ఒక్కరి’ దానిని నిలుపుతుంది.
- source_word: τὰς χεῖρας ἐπιτιθεὶς
  choice: చేతులు ఉంచి
  rationale: వ్యక్తి మీద చేతులు ఉంచే స్పష్టమైన శారీరక చర్యను సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ἐθεράπευεν
  choice: స్వస్థపరిచాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ పునరావృతంగా లేదా కొనసాగుతూ జరిగిన స్వస్థపరిచే చర్యను సూచిస్తుంది. ‘ప్రతి ఒక్కరి’ అనే పంపిణీ పదబంధంతో కలిసి తెలుగు సాధారణ భూతకాల రూపం ఆ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: చేతులు ఉంచి స్వస్థపరచడం
  choice: ఆయన వారిలో ప్రతి ఒక్కరి మీద చేతులు ఉంచి వారిని స్వస్థపరిచాడు
  alternative: ఆయన వారిలో ప్రతి ఒక్కరి మీద చేతులు ఉంచుతూ వారిని స్వస్థపరుస్తూ ఉన్నాడు
  rationale: మూలపాఠం యేసు చేసిన వ్యక్తిగతమైన, శారీరక స్వస్థత చర్యను వర్ణిస్తుంది. అనువాదం ఆ చర్యను నిలుపుతుంది; అయితే దానికి మూలంలో లేని సంస్కారపరమైన లేదా సంఘపరమైన అర్థాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ఎవరి దగ్గర ఉన్నారో’ అనే నిర్మాణం సంరక్షణ లేదా సన్నిహిత సంబంధాన్ని తెలియజేస్తూనే, మూలంలో లేని ‘కుటుంబం’ లేదా ‘ఇల్లు’ అనే వివరాలను చేర్చకుండా ఉంచుతుంది.
