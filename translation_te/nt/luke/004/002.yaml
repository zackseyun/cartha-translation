id: LUK.4.2
reference: Luke 4:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡμέρας τεσσεράκοντα πειραζόμενος ὑπὸ τοῦ διαβόλου. καὶ οὐκ ἔφαγεν οὐδὲν ἐν ταῖς ἡμέραις ἐκείναις, καὶ συντελεσθεισῶν ⸀αὐτῶν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/002.yaml
  text: for forty days, being tempted by the devil. And he ate nothing during those days, and when they were completed, he was hungry.
translation:
  language: te
  text: నలభై రోజుల పాటు అపవాది ఆయనను శోధిస్తూ ఉన్నాడు.[a] ఆ రోజుల్లో ఆయన ఏమీ తినలేదు. అవి ముగిసినప్పుడు ఆయనకు ఆకలి వేసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరీక్షిస్తూ ఉన్నాడు.’ గ్రీకు క్రియకు ‘శోధించు,’ ‘పరీక్షించు’ అనే రెండు అర్థాలూ రావచ్చు. ఇక్కడ చేసేవాడు అపవాది కాబట్టి ‘శోధించు’ సందర్భానికి బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας τεσσεράκοντα
  choice: నలభై రోజుల పాటు
  rationale: కాలవ్యాప్తిని సూచించే ద్వితీయా విభక్తి భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘పాటు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: πειραζόμενος
  choice: శోధిస్తూ ఉన్నాడు
  rationale: కర్త అపవాది కావడం వల్ల ఇక్కడ నైతికంగా ప్రలోభపెట్టే భావం ప్రధానంగా ఉంది. ‘శోధించు’ బైబిలు సందర్భంలో ఆ భావాన్ని గౌరవప్రదంగా మోస్తుంది; ‘పరీక్షించు’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: అపవాది ఆయనను
  rationale: διάβολος ఇక్కడ సాతానుకు స్థిరమైన వ్యక్తిగత బిరుదుగా వాడబడింది. తెలుగు బైబిలు వాడుకలో ‘అపవాది’ స్పష్టమైన, గౌరవప్రదమైన సమానార్థకం; కర్మణి నిర్మాణాన్ని సహజ తెలుగు కర్తరి నిర్మాణంగా మార్చాం.
- source_word: οὐκ ἔφαγεν οὐδὲν
  choice: ఆయన ఏమీ తినలేదు
  rationale: గ్రీకు బలమైన నిషేధాన్ని సహజమైన తెలుగులో నేరుగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: ఆ రోజుల్లో
  rationale: సూచించిన కాలవ్యవధిని ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: συντελεσθεισῶν αὐτῶν
  choice: అవి ముగిసినప్పుడు
  rationale: జనిటివ్ అబ్సల్యూట్ నిర్మాణాన్ని సహజమైన కాలవాచక ఉపవాక్యంగా మార్చి, ఆ రోజుల ముగింపును స్పష్టంగా ఉంచుతుంది.
- source_word: ἐπείνασεν
  choice: ఆయనకు ఆకలి వేసింది
  rationale: ఆ కాలం ముగిసిన తరువాత ఆకలి కలిగిన ఫలితాన్ని సహజమైన ఆధునిక తెలుగు ప్రయోగంతో తెలియజేస్తుంది.
theological_decisions:
- issue: అరణ్యంలో యేసు అనుభవానికి సంబంధించి πειραζόμενος అనువాదం
  choice: శోధిస్తూ ఉన్నాడు
  alternative: పరీక్షిస్తూ ఉన్నాడు
  rationale: అపవాది కర్తగా ఉన్నందున ‘శోధించు’ సందర్భానికి తగిన ప్రధాన భావం. అయినా గ్రీకు క్రియకు ‘పరీక్షించు’ అనే అర్థం కూడా సాధ్యమైనందున దానిని పాదసూచికలో నిలిపి, క్రీస్తు శోధింపబడగల స్వభావం గురించి అదనపు సిద్ధాంత వివరణను వచనంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు కర్మణి కృదంతాన్ని తెలుగులో స్పష్టమైన కర్తరి వాక్యంగా మార్చినా, అపవాది కార్యం కొనసాగిన భావాన్ని ‘శోధిస్తూ ఉన్నాడు’తో నిలిపాం. ముందు వచనంతో కలిసే వాక్యఖండ స్వభావాన్ని సాధ్యమైనంతవరకు కాపాడుతూ, తెలుగులో పఠనసౌలభ్యానికి వాక్య విభజన చేశాం.
