id: LUK.4.23
reference: Luke 4:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Πάντως ἐρεῖτέ μοι τὴν παραβολὴν ταύτην· Ἰατρέ, θεράπευσον σεαυτόν· ὅσα ἠκούσαμεν γενόμενα ⸂εἰς τὴν Καφαρναοὺμ⸃ ποίησον καὶ ὧδε ἐν τῇ πατρίδι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/023.yaml
  text: And he said to them[a], “Surely you will say to me this proverb, ‘Physician, heal yourself.’ Whatever we have heard was done in Capernaum, do here also in your hometown.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “మీరు తప్పకుండా నాతో ఈ సామెత చెబుతారు: ‘వైద్యుడా, నిన్ను నీవే స్వస్థపరచుకో.’ కపెర్నహూములో జరిగాయని మేము విన్నవన్నీ నీ సొంత ఊరైన ఇక్కడ కూడా చేయి.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “కపెర్నహూముకు జరిగినవని మేము విన్నవన్నీ.” గ్రీకులో εἰς (“కు/లోనికి”) ఉంది; అయితే ఈ సందర్భంలో దాని భావం స్థలాన్ని సూచిస్తూ, “కపెర్నహూములో,” అని అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντως
  choice: తప్పకుండా
  rationale: యేసు వారు ఏమంటారో నిశ్చయంగా ముందే చెబుతున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐρεῖτέ μοι
  choice: నాతో ... అంటారు
  rationale: భవిష్యత్ సూచక క్రియను అంచనాగా నిలుపుతూ, λέγω + దత్తి నిర్మాణాన్ని సహజమైన తెలుగు వాక్యంగా అందిస్తుంది.
- source_word: παραβολὴν
  choice: సామెత
  rationale: ఇక్కడ ఇది కథారూప ఉపమానం కాదు; ‘వైద్యుడా, నిన్ను నీవే బాగుచేసుకో’ అనే సంక్షిప్త సామెతను సూచిస్తుంది.
- source_word: Ἰατρέ
  choice: వైద్యుడా
  rationale: వైద్యవృత్తి వ్యక్తిని సంబోధించే పదానికి గౌరవప్రదమైన, సామెత ధోరణికి సరిపోయే తెలుగు రూపం.
- source_word: θεράπευσον σεαυτόν
  choice: నిన్ను నీవే బాగుచేసుకో
  rationale: ఆజ్ఞార్థక బలాన్ని నిలుపుతూ తెలుగులో స్థిరంగా, సహజంగా వినిపించే సామెత రూపం; ‘స్వస్థపరచుకో’ కంటే సాధారణ పాఠకులకు సులభం.
- source_word: ὅσα ἠκούσαμεν γενόμενα
  choice: జరిగాయని మేము విన్నవన్నీ
  rationale: γενόμενα యొక్క ‘జరిగినవి/సంభవించినవి’ అనే భావాన్ని, సమాచారం విన్నదే తప్ప ప్రత్యక్షంగా చూశారనే సూచన లేకుండా నిలుపుతుంది.
- source_word: εἰς τὴν Καφαρναοὺμ
  choice: కపెర్నహూములో
  rationale: εἰς సాధారణంగా ‘కు/లోనికి’ అయినా, జరగడాన్ని తెలిపే ఈ సందర్భంలో స్థలార్థకంగా గ్రహించడం సహజం; మూలంలోని అసాధారణ ప్రయోగం పాదటిప్పణిలో సూచించబడింది.
- source_word: ποίησον καὶ ὧδε
  choice: ఇక్కడ ... కూడా చేయి
  rationale: ποίησον యొక్క విస్తృత ‘చేయి’ భావాన్ని నిలుపుతూ καί యొక్క అదనపు భావాన్ని ‘కూడా’ ద్వారా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ πατρίδι σου
  choice: నీ సొంత ఊరిలో
  rationale: నజరేతు సందర్భంలో πατρίς దేశం కంటే స్వస్థలం లేదా సొంత ఊరును సూచిస్తుంది; ఈ రూపం ఆధునిక తెలుగులో స్పష్టం.
theological_decisions:
- issue: ఈ సందర్భంలో παραβολή స్వభావం
  choice: సామెత
  alternative: ఉపమానం / ఉపమానకథ / సూక్తి
  rationale: తదుపరి మాట సంక్షిప్తమైన లోకోక్తి; కథారూప ఉపమానం కాదు. అందువల్ల ‘సామెత’ సందర్భార్థాన్ని కచ్చితంగా తెలియజేస్తుంది.
- issue: γενόμενα యొక్క కర్తృత్వ భావం
  choice: జరిగాయని
  alternative: చేయబడ్డాయని
  rationale: మూలంలోని γίνομαι సంఘటనలు జరిగినట్లు చెబుతుంది; వాటిని ఎవరు చేశారో వ్యాకరణంలో స్పష్టంగా చెప్పదు. ‘జరిగాయని’ ఈ విస్తృతతను, అంతర్లీన అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. సామెతను సహజంగా ఉంచుతూ మూలంలోని భవిష్యత్ అంచనా, ఆజ్ఞార్థక బలం, స్థలసూచక అసాధారణతను కాపాడింది.
