revisions:
- from: 'ఆయన వారితో ఇలా అన్నాడు: “మీరు తప్పకుండా నాతో ఈ సామెత అంటారు: ‘వైద్యుడా, నిన్ను నీవే బాగుచేసుకో.’ కపెర్నహూములో జరిగాయని మేము విన్నవన్నీ ఇక్కడ, నీ సొంత ఊరిలో కూడా చేయి.”[a]'
  to: 'ఆయన వారితో ఇలా అన్నాడు: “మీరు తప్పకుండా నాతో ఈ సామెత చెబుతారు: ‘వైద్యుడా, నిన్ను నీవే స్వస్థపరచుకో.’ కపెర్నహూములో జరిగాయని మేము విన్నవన్నీ నీ సొంత ఊరైన ఇక్కడ కూడా చేయి.”[a]'
  rationale: The revision retains the source’s ambiguity concerning the events heard about and its contextually locative use of εἰς, while using clearer modern Telugu for the healing proverb and for the command to do in Nazareth what was heard of in Capernaum.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:17:17Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ confident prediction, the proverbial force of παραβολή, the imperative, the reported nature of what was heard, and the contextual locative sense of εἰς τὴν Καφαρναούμ. A small revision improves the clarity of θεραπεύω as physical healing and makes the scope of ‘here also, in your hometown’ unambiguous.
  naturalness: Most of the Telugu is modern and natural. ‘నిన్ను నీవే బాగుచేసుకో’ can mean ‘improve yourself’ and is less specifically medical than the Greek proverb. Also, placing ‘కూడా’ directly after ‘సొంత ఊరిలో’ can weakly suggest ‘in your hometown too’ rather than ‘do these things here too.’
  terminology: ‘సామెత’ appropriately renders παραβολή in this context, and ‘వైద్యుడా’ is suitable. ‘స్వస్థపరచుకో’ better preserves the healing sense of θεράπευσον without adopting a sectarian register. ‘సొంత ఊరు’ fittingly renders πατρίς in the Nazareth context.
  issues:
  - severity: medium
    issue: ‘బాగుచేసుకో’ is semantically broad.
    rationale: It may mean ‘make yourself better’ in a general sense, whereas θεράπευσον in the proverb specifically calls for healing/cure. ‘స్వస్థపరచుకో’ makes the medical sense clear.
  - severity: low
    issue: The placement of ‘కూడా’ can obscure the scope of καί.
    rationale: The Greek commands doing in Jesus’ hometown also the things heard to have occurred in Capernaum. ‘నీ సొంత ఊరైన ఇక్కడ కూడా చేయి’ expresses this relation more clearly.
  - severity: low
    issue: The footnote’s literal alternative is syntactically awkward in Telugu.
    rationale: It should show the unusual literal directional wording as ‘కపెర్నహూముకు జరిగినవని’ while explaining that the contextual sense is locative.
  revised_text: 'ఆయన వారితో ఇలా అన్నాడు: “మీరు తప్పకుండా నాతో ఈ సామెత చెబుతారు: ‘వైద్యుడా, నిన్ను నీవే స్వస్థపరచుకో.’ కపెర్నహూములో జరిగాయని మేము విన్నవన్నీ నీ సొంత ఊరైన ఇక్కడ కూడా చేయి.”[a]'
