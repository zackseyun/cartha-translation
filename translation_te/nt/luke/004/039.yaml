id: LUK.4.39
reference: Luke 4:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐπιστὰς ἐπάνω αὐτῆς ἐπετίμησεν τῷ πυρετῷ, καὶ ἀφῆκεν αὐτήν· παραχρῆμα δὲ ἀναστᾶσα διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/039.yaml
  text: And standing over her[a], he rebuked the fever, and it left her. Immediately she got up and began serving them.
translation:
  language: te
  text: ఆయన ఆమెకు పైగా నిలబడి, జ్వరాన్ని గద్దించాడు; అప్పుడు జ్వరం ఆమెను విడిచిపోయింది.[a] వెంటనే ఆమె లేచి వారికి సేవ చేయడం మొదలుపెట్టింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో గద్దింపబడినది ‘జ్వరం’; తరువాత ఆమెను విడిచిపోయిన కర్త కూడా అదే అని వాక్య నిర్మాణం సూచిస్తుంది. ‘అది ఆమెను విడిచిపోయింది’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστὰς ἐπάνω αὐτῆς
  choice: ఆమెకు పైగా నిలబడి
  rationale: యేసు ఆమెకు సంబంధించి ఉన్న భౌతిక స్థానాన్ని గ్రీకు పదబంధం స్పష్టంగా చూపిస్తుంది. తెలుగులో కొంత అసాధారణంగా వినిపించినా, ‘వంగి’ వంటి మూలంలో లేని చర్యను చేర్చకుండా ఆ దృశ్యాన్ని నిలుపుతుంది.
- source_word: ἐπετίμησεν
  choice: గద్దించాడు
  rationale: అధికారంతో తీవ్రంగా మందలించడం అనే భావాన్ని, స్వస్థపరిచే ఈ సందర్భంలో జ్వరమే నేరుగా ఉద్దేశించబడిందనే గ్రీకు నిర్మాణాన్ని నిలుపుతుంది.
- source_word: τῷ πυρετῷ
  choice: జ్వరాన్ని
  rationale: గ్రీకులో జ్వరమే గద్దింపుకు గురైనది; ‘ఆమె జ్వరాన్ని’ అని విస్తరించకుండా మూలంలోని ప్రత్యక్ష సమర్పణను కాపాడుతుంది.
- source_word: ἀφῆκεν αὐτήν
  choice: జ్వరం ఆమెను విడిచిపోయింది
  rationale: గ్రీకులో క్రియకు వ్యక్తంగా చెప్పని కర్త ముందున్న ‘జ్వరం.’ తెలుగులో కర్తను మళ్లీ చెప్పడం వల్ల అర్థం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: παραχρῆμα
  choice: వెంటనే
  rationale: స్వస్థత తక్షణమే కలిగిందనే లూకా ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀναστᾶσα
  choice: ఆమె లేచి
  rationale: స్వస్థత పొందిన వెంటనే ఆమె చేసిన చర్యను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: διηκόνει
  choice: సేవ చేయడం మొదలుపెట్టింది
  rationale: అసంపూర్ణ భూతకాల క్రియలోని ఆరంభ లేదా కొనసాగింపు భావానికి ‘మొదలుపెట్టింది’ సరిపోతుంది; సంఘపరమైన ప్రత్యేకార్థం కలిగే పదజాలాన్ని నివారిస్తుంది.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: అక్కడ ఉన్న బహువచన సమూహాన్ని సూచిస్తూ తెలుగులో సహజమైన దత్తి రూపాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: జ్వరాన్ని యేసు గద్దించడం వ్యక్తీకరణనా, దయ్య సంబంధిత కారణానికి సూచనా?
  choice: ‘జ్వరాన్ని గద్దించాడు’ అనే మూలానికి దగ్గరైన భాషను అలాగే ఉంచడం
  alternative: ‘ఆమె జ్వరాన్ని పోగొట్టాడు’ లేదా ‘వ్యాధిని నయం చేశాడు’
  rationale: గ్రీకు వాక్యం జ్వరాన్నే గద్దింపబడినదిగా చూపిస్తుంది. దాన్ని అలాగే ఉంచడం యేసు అధికారాన్ని వెల్లడిస్తూనే, జ్వరం దయ్యం వల్ల వచ్చిందని గానీ ఇది కేవలం అలంకారిక వ్యక్తీకరణ అని గానీ నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే మూలంలోని అధికారభరితమైన ‘గద్దించాడు’ అనే రూపాన్ని మరియు జ్వరాన్ని నేరుగా ఉద్దేశించిన నిర్మాణాన్ని నిలుపుతూ అనువదించబడింది.
