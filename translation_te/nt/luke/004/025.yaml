id: LUK.4.25
reference: Luke 4:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπ’ ἀληθείας δὲ λέγω ὑμῖν, πολλαὶ χῆραι ἦσαν ἐν ταῖς ἡμέραις Ἠλίου ἐν τῷ Ἰσραήλ, ὅτε ἐκλείσθη ὁ οὐρανὸς ⸀ἐπὶ ἔτη τρία καὶ μῆνας ἕξ, ὡς ἐγένετο λιμὸς μέγας ἐπὶ πᾶσαν τὴν γῆν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/025.yaml
  text: But I tell you truly, there were many widows in Israel in the days of Elijah, when the sky was shut up for three years and six months, as a great famine came over all the land.
translation:
  language: te
  text: 'కానీ నేను మీతో నిజంగా చెబుతున్నాను: ఏలీయా కాలంలో ఇశ్రాయేలులో అనేకమంది విధవరాళ్లు ఉన్నారు; ఆకాశం మూడు సంవత్సరాల ఆరు నెలలపాటు మూసుకుపోయినప్పుడు దేశమంతటా తీవ్రమైన కరవు వచ్చింది.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας
  choice: నిజంగా
  rationale: సత్యతను నొక్కిచెప్పే గ్రీకు పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐκλείσθη ὁ οὐρανὸς
  choice: ఆకాశం మూసుకుపోయి
  rationale: వర్షం నిలిచిపోయిందనే సందర్భార్థాన్ని సూచిస్తూనే, మూలంలోని రూపకాన్ని నిలుపుతుంది.
- source_word: λιμὸς μέγας
  choice: తీవ్రమైన కరవు
  rationale: λιμός సూచించే ఆహార కొరత/కరవును, μέγας తీవ్రతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: దేశమంతటా
  rationale: ఈ సందర్భంలో γῆ ఇశ్రాయేలు దేశాన్ని సూచించే అవకాశానికి అనుగుణంగా సహజంగా ఉంటుంది; విశ్వవ్యాప్త భావాన్ని అనవసరంగా రుద్దదు.
theological_decisions:
- issue: ఆకాశం మూసుకుపోవడం వెనుక కర్త
  choice: కర్తను పేర్కొనకుండా కర్మణి రూపాన్ని నిలుపడం
  alternative: దేవుడు ఆకాశాన్ని మూసివేశాడు
  rationale: గ్రీకు మూలం కర్తను ప్రత్యక్షంగా పేర్కొనదు; దేవుని కార్యం సూచితమైనప్పటికీ అనువాదంలో దానిని చేర్చలేదు.
- issue: ἐπὶ πᾶσαν τὴν γῆν పరిధి
  choice: దేశమంతటా
  alternative: భూమి అంతటా
  rationale: ఏలీయా కథా సందర్భంలో స్థానిక/దేశవ్యాప్త భావం బలంగా ఉంది; అయినా మూలపదానికి ‘భూమి’ అనే విస్తృత అర్థం కూడా సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సహజమైన వాక్య నిర్మాణం ఉపయోగించబడింది. ‘ఏలీయా’ అనే సాంప్రదాయ తెలుగు బైబిలు నామరూపం నిలుపబడింది.
