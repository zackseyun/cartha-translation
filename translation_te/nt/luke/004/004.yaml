id: LUK.4.4
reference: Luke 4:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀπεκρίθη ⸂πρὸς αὐτὸν ὁ Ἰησοῦς⸃· Γέγραπται ὅτι Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ⸀ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/004.yaml
  text: 'And Jesus answered him[b][a], “It is written: ‘Man will not live by bread alone.’”'
translation:
  language: te
  text: 'యేసు అతనికి జవాబిచ్చాడు: “ఇలా వ్రాయబడి ఉంది: ‘మనిషి[a] రొట్టెతో మాత్రమే జీవించడు.’[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మనిషి” అంటే ఇక్కడ స్త్రీపురుషులందరినీ కలుపుకొని, సాధారణంగా మానవ వ్యక్తి అని అర్థం.
    reason: lexical_alternative
  - marker: b
    text: యేసు ద్వితీయోపదేశకాండము 8:3ను ఉల్లేఖిస్తున్నాడు.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη πρὸς αὐτόν
  choice: అతనికి ఇలా జవాబిచ్చాడు
  rationale: ἀποκρίνομαι + πρός అనే గ్రీకు ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, జవాబు ఎవరికి చెప్పబడిందో స్పష్టంగా ఉంచుతుంది.
- source_word: Γέγραπται
  choice: ఇలా రాసి ఉంది
  rationale: పూర్త భూత నిష్క్రియ రూపంలోని, ఇప్పటికీ ప్రామాణికంగా నిలిచివున్న లేఖన వాక్యాన్ని సూచించే భావాన్ని సహజమైన తెలుగు ఉల్లేఖన సూత్రంతో తెలియజేస్తుంది.
- source_word: ὅτι
  choice: ':'
  rationale: ఇక్కడ ὅτι ప్రత్యక్ష ఉల్లేఖనాన్ని పరిచయం చేస్తుంది; తెలుగులో ద్విబిందువు పెట్టడం సహజంగా ఉంటుంది.
- source_word: ἐπ’ ἄρτῳ μόνῳ
  choice: రొట్టెవల్ల మాత్రమే
  rationale: జీవాన్ని నిలబెట్టే ఆధారం లేదా సాధనం అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ζήσεται
  choice: జీవించడు
  rationale: గ్రీకు భవిష్యత్ రూపం సామెతసదృశమైన సాధారణ సత్యాన్ని చెబుతోంది; ప్రతికూల తెలుగు భవిష్యదర్థక రూపం దానిని సహజంగా అందిస్తుంది.
- source_word: ὁ ἄνθρωπος
  choice: మనిషి
  rationale: ఇక్కడ ఏ ఒక్క పురుషుణ్ణి మాత్రమే కాక మానవ వ్యక్తిని సాధారణంగా సూచించే ఏకవచనాన్ని ‘మనిషి’ సహజంగా, గంభీరంగా నిలుపుతుంది.
theological_decisions:
- issue: ద్వితీయోపదేశకాండము 8:3 ఉల్లేఖనంలోని ὁ ἄνθρωπος అనే సాధారణ ఏకవచనం
  choice: మనిషి
  alternative: ఒక వ్యక్తి / మానవుడు
  rationale: ‘మనిషి’ గ్రీకు సాధారణ ఏకవచనాన్నీ పాత నిబంధనతోని అనుసంధానాన్నీ నిలుపుతూ, తెలుగులో సమస్త మానవులకు వర్తించే భావాన్ని సహజంగా తెలియజేస్తుంది; అది కేవలం పురుషులకే పరిమితమని అర్థం కాకుండా పాదటిప్పణి వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. యేసు మాటలలోని లేఖన ఉల్లేఖనాన్ని అంతర్గత ఉద్ధరణ గుర్తులతో స్పష్టంచేశాం. పాదటిప్పణి గుర్తులు ప్రధాన వచనంలో ఉన్నాయి.
