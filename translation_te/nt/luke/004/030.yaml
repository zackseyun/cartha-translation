  text: αὐτὸς δὲ διελθὼν διὰ μέσου αὐτῶν ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/030.yaml
  text: But he[a], passing through their midst, went on his way.
translation:
  language: te
  text: అయితే ఆయన[a] వారి మధ్యలో నుంచి దాటుతూ తన దారిన వెళ్లిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనే.’ గ్రీకులో సర్వనామం స్పష్టంగా ఉండి కొంత ఉద్ఘాటనను కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: ఆయన
  rationale: గ్రీకులో కర్త సర్వనామం స్పష్టంగా ఉండి కొంత ఉద్ఘాటనను కలిగి ఉంది. ఆధునిక గౌరవప్రదమైన తెలుగులో యేసును సూచించడానికి ‘ఆయన’ సహజంగా ఉంటుంది; ‘ఆయనే’ అనడం సందర్భం కోరినదానికంటే ఎక్కువ ఉద్ఘాటన కలిగించవచ్చు.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వచనంలోని జనసమూహపు హింసాత్మక ఉద్దేశానికి, యేసు క్షేమంగా వెళ్లిపోవడానికి మధ్య ఉన్న స్వల్ప వ్యతిరేకతను ‘అయితే’ సహజంగా తెలియజేస్తుంది.
- source_word: διελθὼν
  choice: వెళ్లి
  rationale: διέρχομαι యొక్క భూతకాల కృదంత రూపం ఒక ప్రదేశం గుండా కదలడాన్ని సూచిస్తుంది. ‘వారి మధ్యగా వెళ్లి’ అనే నిర్మాణం ప్రధాన క్రియకు ముందు జరిగిన కదలికను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: διὰ μέσου αὐτῶν
  choice: వారి మధ్యగా
  rationale: ఈ పదబంధం ఆ సమూహం మధ్యలో నుంచి సాగిపోవడాన్ని సూచిస్తుంది. ‘వారి మధ్యగా’ సంక్షిప్తంగా, సహజంగా ఉండి స్థల సంబంధ భావాన్ని నిలుపుతుంది.
- source_word: ἐπορεύετο
  choice: తన దారిన వెళ్లిపోయాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న ప్రయాణాన్ని లేదా అక్కడి నుంచి ముందుకు సాగడాన్ని చూపుతుంది. ‘తన దారిన వెళ్లిపోయాడు’ ఆ కొనసాగింపును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఈ వచనం అద్భుతరీతిలో తప్పించుకున్నాడనే భావాన్ని స్పష్టంగా చేర్చాలా, లేక వర్ణనాత్మకంగా తటస్థంగా ఉంచాలా
  choice: ‘వారి మధ్యగా వెళ్లి, తన దారిన వెళ్లిపోయాడు’ అనే తటస్థ వర్ణన
  alternative: ‘అద్భుతరీతిగా వారి మధ్య నుంచి తప్పించుకున్నాడు’ వంటి స్పష్టమైన అద్భుత సూచన
  rationale: గ్రీకు పాఠం యేసు జనసమూహం మధ్యగా వెళ్లినట్టు చెబుతుంది గాని అది ఎలా జరిగిందో చెప్పదు. అందువల్ల పాఠకులు సందర్భం నుంచి అర్థం చేసుకునే అవకాశాన్ని ఉంచుతూ, మూలంలో లేని అద్భుత విధానాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. అద్భుతం జరిగిందని గానీ జరగలేదని గానీ అనువాదం అదనంగా నిర్ణయించదు.
