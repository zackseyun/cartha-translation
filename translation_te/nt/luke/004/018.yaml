  verdict: revise
  source_fidelity: The draft accurately reflects the Greek clause sequence, including the two occurrences of ἄφεσις as ‘విడుదల’ and the contextual sense of τεθραυσμένους. A small adjustment better represents the perfect ἀπέσταλκέν (‘has sent’) and improves the Telugu idiom for ἀνάβλεψις.
