id: LUK.4.18
reference: Luke 4:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πνεῦμα κυρίου ἐπ’ ἐμέ, οὗ εἵνεκεν ἔχρισέν με εὐαγγελίσασθαι πτωχοῖς, ἀπέσταλκέν ⸀με κηρύξαι αἰχμαλώτοις ἄφεσιν καὶ τυφλοῖς ἀνάβλεψιν, ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/018.yaml
  text: The Spirit of the Lord is upon me[a], because he has anointed me to proclaim good news to the poor. He has sent me to proclaim release to the captives and recovery of sight to the blind, to send out the oppressed in release[b],
translation:
  language: te
  text: “ప్రభువు ఆత్మ నాపై ఉంది; ఎందుకంటే పేదలకు శుభవార్త ప్రకటించడానికి ఆయన నన్ను అభిషేకించాడు. బందీలకు విడుదలను[a], గుడ్డివారికి చూపు తిరిగి రావడాన్ని ప్రకటించడానికి, అణచివేయబడినవారిని[b] విడుదలతో పంపివేయడానికి ఆయన నన్ను పంపియున్నాడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విడుదల’ అని అనువదించిన గ్రీకు పదం ἄφεσιςకు ‘క్షమాపణ’ అనే అర్థం కూడా ఉండవచ్చు. ఇక్కడ బందీలు, అణచివేయబడినవారు అనే సందర్భం విమోచన భావాన్ని బలపరుస్తుంది; ఇదే పదం వచనంలో మళ్లీ ‘విడుదలతో’ అని వచ్చింది.
    reason: lexical_alternative
  - marker: b
    text: పదశః, ‘విరగగొట్టబడినవారిని’ లేదా ‘చితికిపోయినవారిని’; సందర్భంలోని నుడికార భావం ‘అణచివేయబడినవారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Πνεῦμα κυρίου ἐπ’ ἐμέ
  choice: ప్రభువు ఆత్మ నాపై ఉంది
  rationale: గ్రీకులో క్రియ స్పష్టంగా లేకపోయినా తెలుగులో సహజమైన వాక్యం కోసం ‘ఉంది’ చేర్చబడింది. ‘నాపై’ అనేది ἐπ’ ἐμέను, ‘ప్రభువు ఆత్మ’ అనేది యెషయా నేపథ్యంలోని సంబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: οὗ εἵνεκεν
  choice: ఎందుకంటే
  rationale: ఈ పదబంధంలోని కారణార్థాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἔχρισέν με
  choice: ఆయన నన్ను అభిషేకించాడు
  rationale: χρίωలోని అభిషేకం మరియు మెస్సీయ సంబంధిత ప్రతిధ్వనిని కాపాడుతుంది; కర్తను సందర్భానుసారం ‘ఆయన’గా వ్యక్తపరచింది.
- source_word: εὐαγγελίσασθαι πτωχοῖς
  choice: పేదలకు శుభవార్త ప్రకటించడానికి
  rationale: εὐαγγελίζω యొక్క శుభవార్తను తెలియజేసే భావాన్నీ, πτωχοί యొక్క ఆర్థిక లేదా సామాజిక విస్తృతినీ అనవసరంగా కుదించకుండా అందిస్తుంది.
- source_word: ἀπέσταλκέν με
  choice: ఆయన నన్ను పంపించాడు
  rationale: పంపబడిన నియామకాన్ని స్పష్టంగా తెలియజేస్తుంది. గ్రీకు perfect యొక్క కొనసాగుతున్న ఫలితాన్ని తెలుగు సందర్భమే సహజంగా మోస్తుంది.
- source_word: κηρύξαι
  choice: ప్రకటించడానికి
  rationale: బహిరంగంగా చాటిచెప్పే κηρύσσω భావాన్ని మతపరమైన పరిమిత పదజాలం లేకుండా తెలుపుతుంది.
- source_word: αἰχμαλώτοις ἄφεσιν
  choice: బందీలకు విడుదలను
  rationale: బందీలు మరియు యెషయా విమోచన నేపథ్యం కారణంగా ἄφεσιςకు ఇక్కడ ‘విడుదల’ ప్రధాన అర్థం. ‘క్షమాపణ’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: τυφλοῖς ἀνάβλεψιν
  choice: గుడ్డివారికి చూపు తిరిగి పొందడాన్ని
  rationale: ἀνάβλεψις కేవలం ‘చూపు’ మాత్రమే కాక చూపు పొందడం లేదా తిరిగి పొందడం అనే భావాన్ని సూచిస్తుంది.
- source_word: ἀποστεῖλαι
  choice: పంపివేయడానికి
  rationale: ἀποστέλλωతో ఉన్న పంపడం అనే పదసంబంధాన్ని పూర్తిగా ‘విడిపించడం’గా మార్చకుండా నిలుపుతుంది.
- source_word: τεθραυσμένους
  choice: అణచివేయబడినవారిని
  rationale: పదశః ‘విరగగొట్టబడినవారు/చితికిపోయినవారు’; ఈ విమోచన సందర్భంలో దాని నుడికార భావాన్ని ఆధునిక పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: ἐν ἀφέσει
  choice: విడుదలతో
  rationale: ముందున్న ἄφεσιςతో పదపునరుక్తిని కాపాడుతూ, తెలుగులో పూర్తిగా కృత్రిమంగా వినిపించే ‘విడుదలలో’ కంటే సహజంగా ఉంటుంది.
theological_decisions:
- issue: యెషయా ఉల్లేఖనంలో ἄφεσις అర్థం
  choice: విడుదల
  alternative: క్షమాపణ
  rationale: తక్షణ సందర్భంలోని బందీలు, గుడ్డివారు, అణచివేయబడినవారు అనే పదక్షేత్రం విమోచన భావాన్ని బలపరుస్తుంది. అయితే లూకా రచనల్లో ἄφεσιςకు ‘క్షమాపణ’ అనే ముఖ్యమైన వాడుక కూడా ఉన్నందున ఆ నిజమైన అర్థసాధ్యతను పాదసూచికలో నిలిపింది.
- issue: τεθραυσμένους యొక్క సామాజిక లేదా రూపకాల భావం
  choice: అణచివేయబడినవారు
  alternative: చితికిపోయినవారు / విరగగొట్టబడినవారు
  rationale: విమోచన సందర్భంలో ‘అణచివేయబడినవారు’ నుడికార భావాన్ని స్పష్టం చేస్తుంది; గ్రీకు perfect passive participleలోని బలమైన ‘విరగగొట్టబడిన’ చిత్రాన్ని పాదసూచిక సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. యెషయా ఉల్లేఖనంలోని ప్రకటనాత్మక లయను కాపాడేందుకు సమాంతర క్రియారూపాలు ఉంచబడ్డాయి. ‘అభిషేకించాడు’ అనే సాంప్రదాయ బైబిలు పదం దాని మెస్సీయ ప్రతిధ్వని కారణంగా నిలుపబడింది.
