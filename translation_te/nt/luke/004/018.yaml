  terminology: ‘ప్రభువు ఆత్మ,’ ‘అభిషేకించాడు,’ ‘శుభవార్త,’ and ‘విడుదల’ are appropriate. The footnotes retain the genuine lexical alternatives without imposing a doctrinal interpretation.
