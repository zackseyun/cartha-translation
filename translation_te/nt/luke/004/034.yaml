id: LUK.4.34
reference: Luke 4:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Ἔα, τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/034.yaml
  text: Ah! What have you to do with us[e][d][c][b][a], Jesus of Nazareth? Have you come to destroy us? I know who you are—the Holy One of God.
translation:
  language: te
  text: “ఆహ్! నజరేతువాడవైన యేసూ, మాతో నీకేమిటి?[a] మమ్మల్ని నాశనం చేయడానికి వచ్చావా? నీవెవరో నాకు తెలుసు—నీవు దేవుని పరిశుద్ధుడవు.”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మాకు, నీకు ఏమిటి?” ఇది సంబంధాన్ని నిరాకరించే లేదా ప్రతిఘటనను తెలిపే సెమిటిక్ నుడికారం.
    reason: cultural_note
  - marker: b
    text: “మమ్మల్ని” అనే బహువచనం ఎవరిని సూచిస్తుందో గ్రీకు పాఠ్యం స్పష్టంగా చెప్పదు. దయ్యం తన తరఫున ప్రతినిధిగా మాట్లాడుతుండవచ్చు లేదా విస్తృతమైన దయ్యాల లోకాన్ని సూచిస్తుండవచ్చు.
    reason: alternative_reading
  - marker: c
    text: మరొక విధంగా, “దేవునికి చెందిన పరిశుద్ధుడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔα
  choice: ఆహ్!
  rationale: ఆకస్మిక భయం లేదా నిరసనను తెలిపే ఈ ఆశ్చర్యోద్గారాన్ని, ‘మమ్మల్ని వదిలేయి’ అని భావాన్ని విస్తరించకుండా, సహజమైన తెలుగు కేకగా అనువదించాం.
- source_word: τί ἡμῖν καὶ σοί
  choice: మాతో నీకేమిటి?
  rationale: అక్షరార్థంగా ‘మాకు, నీకు ఏమిటి?’ అనే సెమిటిక్ నుడికారాన్ని సంబంధ నిరాకరణ లేదా ప్రతిఘటన భావంతో సహజమైన తెలుగులో నిలిపాం.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: నజరేయుడవైన యేసూ
  rationale: సంబోధన రూపాన్ని, నజరేతుతో యేసుకు ఉన్న సంబంధాన్ని సూచించే విశేషణ భావాన్ని కాపాడుతుంది.
- source_word: ἦλθες ἀπολέσαι ἡμᾶς
  choice: మమ్మల్ని నాశనం చేయడానికి వచ్చావా?
  rationale: రాక యొక్క ప్రస్తుత ప్రభావాన్ని సహజమైన తెలుగు ప్రశ్నగా చూపుతూ, ἀπόλλυμι యొక్క బలమైన నాశనార్థాన్ని నిలిపాం.
- source_word: οἶδά σε τίς εἶ
  choice: నీవెవరో నాకు తెలుసు
  rationale: గుర్తింపు ప్రకటనను అదనపు వివరణ లేకుండా నేరుగా అందిస్తుంది.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: దేవుని పరిశుద్ధుడు
  rationale: దేవునితో సంబంధమున్న ప్రత్యేక బిరుదును సిద్ధాంతపరమైన విస్తరణ లేకుండా, గ్రీకు నిర్మాణానికి పారదర్శకంగా అనువదిస్తుంది.
theological_decisions:
- issue: ἡμᾶς అనే బహువచన సర్వనామం
  choice: ‘మమ్మల్ని’ అని మాత్రమే ఉంచాం; అది ఎవరెవరిని సూచిస్తుందో నిర్దిష్టం చేయలేదు.
  alternative: దయ్యం మొత్తం దయ్యాల లోకానికి ప్రతినిధిగా మాట్లాడడం; లేదా తనను, ఆవహింపబడిన మనిషిని కలిపి మాట్లాడడం.
  rationale: గ్రీకు పాఠ్యంలో బహువచనం ఉంది గాని దాని పరిధి వివరించబడలేదు. అందువల్ల అనిశ్చితిని అనువాదంలోనే నిలిపాం.
- issue: ὁ ἅγιος τοῦ θεοῦ అనే క్రీస్తు సంబంధ బిరుదు
  choice: ‘దేవుని పరిశుద్ధుడు’ అని బిరుదుగానే ఉంచాం.
  alternative: ‘దేవునికి చెందిన పరిశుద్ధుడు’ లేదా మెస్సీయ/దైవ నియామకాన్ని వివరిస్తూ విస్తరించడం.
  rationale: వాక్యం బిరుదు యొక్క పూర్తి సిద్ధాంతార్థాన్ని వివరించదు; కాబట్టి తరువాతి సిద్ధాంత భాషను చేర్చకుండా దాని గంభీరతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన ప్రత్యక్ష సంభాషణ. ‘మాతో నీకేమిటి?’ అనే సంక్షిప్త నుడికారం మూలంలోని ప్రతిఘటనను నిలుపుతుంది. ‘నజరేయుడవైన’ కొద్దిగా సాహిత్య గంభీరతతో మూలంలోని Ναζαρηνέ విశేషణాన్ని ప్రతిబింబిస్తుంది.
