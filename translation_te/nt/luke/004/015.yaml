id: LUK.4.15
reference: Luke 4:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἐδίδασκεν ἐν ταῖς συναγωγαῖς αὐτῶν, δοξαζόμενος ὑπὸ πάντων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/015.yaml
  text: And he was teaching in their synagogues[a], being glorified by all.
translation:
  language: te
  text: ఆయన వారి సమాజమందిరాల్లో బోధిస్తూ ఉండేవాడు, మరియు అందరూ ఆయనను ప్రశంసించేవారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనను ఘనపరిచేవారు’ లేదా ‘మహిమపరిచేవారు.’ గ్రీకు పదం బహిరంగ ప్రశంసను, గౌరవాన్ని, లేదా మహిమపరచడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: ఆయన
  rationale: తెలుగులో వాక్యారంభంలో ‘మరియు’ అనడం సహజంగా ఉండదు. ముందరి కథనంతో అనుసంధానం సందర్భం ద్వారానే స్పష్టంగా ఉండగా, కర్తను నేరుగా ఉంచడం సహజమైన తెలుగు ప్రవాహాన్ని ఇస్తుంది.
- source_word: αὐτὸς
  choice: ఆయన
  rationale: ఇది యేసును సూచించే స్పష్టమైన సర్వనామం. గ్రీకులో స్వల్ప ఉద్ఘాటన ఉండవచ్చుగాని, ‘ఆయనే’ అని అనువదిస్తే అవసరానికి మించిన ఉద్ఘాటన వస్తుంది.
- source_word: ἐδίδασκεν
  choice: బోధిస్తూ ఉండేవాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న లేదా అలవాటుగా జరుగుతున్న కార్యాన్ని సూచిస్తుంది; ఈ రూపం ఆ క్రియాభావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐν ταῖς συναγωγαῖς αὐτῶν
  choice: వారి సమాజమందిరాల్లో
  rationale: స్థలార్థాన్ని, గ్రీకు బహువచనాన్ని, సంబంధసూచక సర్వనామాన్ని కాపాడుతుంది. ‘సమాజమందిరాలు’ ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో synagogue అనే యూదుల సమావేశ–ఆరాధనా స్థలాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: δοξαζόμενος
  choice: ఘనపరిచేవారు
  rationale: δοξάζω ఇక్కడ ప్రజలు యేసుకు తెలిపిన ప్రశంస లేదా గౌరవాన్ని సూచించగలదు. ‘ఘనపరచడం’ ఈ రెండింటినీ సహజంగా మోస్తూ, ‘మహిమ’ భావంతో ఉన్న పదసంబంధాన్ని పూర్తిగా తొలగించదు. గ్రీకు కర్మణి కృదంతాన్ని తెలుగులో సహజమైన కర్తరి ఉపవాక్యంగా మార్చాం.
- source_word: ὑπὸ πάντων
  choice: అందరూ
  rationale: గ్రీకులో కర్మణి ప్రయోగానికి కర్తను సూచించే ఈ పదబంధాన్ని, తెలుగు కర్తరి నిర్మాణంలో ‘అందరూ’గా ఇచ్చాం; విస్తృత ప్రజాదరణ భావం అలాగే ఉంటుంది.
theological_decisions:
- issue: యేసుకు సంబంధించి δοξαζόμενος పదాన్ని ఎలా అనువదించాలి
  choice: అందరూ ఆయనను ఘనపరిచేవారు
  alternative: అందరూ ఆయనను ప్రశంసించేవారు; అందరూ ఆయనను మహిమపరిచేవారు
  rationale: ఈ సందర్భంలో ప్రజల అనుకూల స్పందన, ప్రశంస, గౌరవం ప్రధానంగా కనిపిస్తాయి. ‘ఘనపరిచేవారు’ అనే పదం ఆ అర్థపరిధిని నిలుపుతూ, కేవలం దైవారాధనకు సంబంధించిన పూర్తి తాత్త్విక ప్రకటనను పాఠ్యంలోకి దిగుమతి చేయదు. ప్రత్యామ్నాయ భావాలను పాదసూచికలో ఉంచడం గ్రీకు పదంలోని నిజమైన అర్థవిస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. గ్రీకు వాక్యంలోని కర్మణి కృదంత నిర్మాణాన్ని యాంత్రికంగా అనుసరించకుండా, భావసంబంధాన్ని నిలిపే కర్తరి నిర్మాణంగా మార్చాం.
