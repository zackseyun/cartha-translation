id: LUK.9.5
reference: Luke 9:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὅσοι ⸀ἂν μὴ ⸀δέχωνται ὑμᾶς, ἐξερχόμενοι ἀπὸ τῆς πόλεως ⸀ἐκείνης τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν ⸀ἀποτινάσσετε εἰς μαρτύριον ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/005.yaml
  text: And as for all who do not receive you[a], as you leave that town[b], shake off the dust from your feet as a testimony against them.
translation:
  language: te
  text: మిమ్మల్ని ఎవరు స్వీకరించరో[a], మీరు ఆ పట్టణం[b] నుండి బయలుదేరేటప్పుడు, వారికి వ్యతిరేకంగా సాక్ష్యంగా మీ పాదాల నుండి ధూళిని దులిపివేయండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మిమ్మల్ని స్వాగతించనివారెవరో.’ ఇక్కడి క్రియ దూతలను స్వీకరించడం, వారికి ఆతిథ్యమివ్వడం అనే రెండు భావాలనూ కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆ నగరం.’ గ్రీకు పదం సందర్భాన్ని బట్టి పట్టణాన్నైనా నగరాన్నైనా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι ἂν μὴ δέχωνται ὑμᾶς
  choice: ఎవరైనా మిమ్మల్ని చేర్చుకోకపోతే
  rationale: ὅσοι ἄν అనిర్దిష్టమైన, సాధారణ భావాన్ని ఇస్తుంది. δέχομαι ఇక్కడ దూతలను అంగీకరించడం, ఆహ్వానించి స్వీకరించడం అనే విస్తృత భావం కలిగి ఉంది; ‘చేర్చుకోవడం’ ఆ రెండు ఛాయలనూ సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ἐξερχόμενοι ἀπὸ τῆς πόλεως ἐκείνης
  choice: మీరు ఆ పట్టణం నుంచి బయలుదేరేటప్పుడు
  rationale: వర్తమాన కృదంతం ప్రధాన ఆజ్ఞతో సమకాలికమైన చర్యను సూచిస్తుంది. πόλις సందర్భాన్ని బట్టి పట్టణం లేదా నగరం కావచ్చు; మిషన్ సందర్భంలో ‘పట్టణం’ పరిమాణాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν
  choice: మీ పాదాల ధూళిని
  rationale: κονιορτός నేలపై ఉండే సన్నని ధూళిని సూచిస్తుంది. ‘పాదాల ధూళి’ మూలంలోని శరీర సంబంధ చిత్రాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἀποτινάσσετε
  choice: దులిపివేయండి
  rationale: ఈ ఆజ్ఞ ధూళిని కదిలించి పూర్తిగా తొలగించే ప్రతీకాత్మక చర్యను సూచిస్తుంది; ‘దులిపివేయండి’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: εἰς μαρτύριον ἐπ’ αὐτούς
  choice: వారికి వ్యతిరేకంగా సాక్ష్యంగా
  rationale: εἰς μαρτύριον ఈ చర్య యొక్క సాక్ష్య స్వభావాన్ని, ἐπ’ αὐτούς సందర్భంలో దాని ప్రతికూల లేదా న్యాయసంబంధ దిశను సూచిస్తాయి. ఈ అనువాదం తుది తీర్పును అదనంగా ప్రకటించకుండా హెచ్చరిక బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పాదాల ధూళిని దులిపివేసే ప్రతీకాత్మక చర్య యొక్క బలం
  choice: తిరస్కరించిన వారికి వ్యతిరేకంగా నిలిచే సాక్ష్యం
  alternative: వారికి ఇచ్చే తటస్థ సూచన; లేదా తుది దైవ తీర్పును ప్రకటించే చర్య
  rationale: εἰς μαρτύριον ἐπ’ αὐτούς తటస్థ సంకేతం కంటే గంభీరమైన హెచ్చరిక లేదా న్యాయసంబంధ సాక్ష్యాన్ని సూచిస్తుంది. అయితే ఈ వాక్యం తుది శిక్షను స్పష్టంగా ప్రకటించదు; అందువల్ల ఆ ఉద్వేగాన్ని అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘చేర్చుకోకపోతే’ స్వీకరణ మరియు స్వాగతం రెండింటినీ కలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం. మూలంలోని ఆజ్ఞాత్మకతను ‘దులిపివేయండి’తో నిలిపాం.
