  naturalness: The revised wording is natural modern standard Telugu, maintains the generalizing force of ὅσοι ἄν, and reads smoothly as an instruction.
  terminology: ‘స్వీకరించు’ is the suitable broad equivalent for δέχομαι; the footnote supplies ‘స్వాగతించు’ as the contextual alternative. ‘సాక్ష్యంగా’ faithfully conveys μαρτύριον without overstating the implied judgment.
