review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the command to enter any house, remain there, and depart from that same place. However, the relative-future form “ప్రవేశిస్తారో” is less direct for the Greek indefinite construction ἣν ἂν … εἰσέλθητε; “ప్రవేశించినా” more naturally conveys “whatever house you enter.”
  naturalness: The draft is clear and modern, but “ఏ ఇంట్లోకి ప్రవేశిస్తారో” conventionally anticipates a corresponding “ఆ ఇంట్లో,” whereas the next clause says “అక్కడే.” The concessive/indefinite form “ప్రవేశించినా” is smoother Telugu in this instruction.
  terminology: “ఇల్లు,” “ఉండండి,” and “బయలుదేరండి” are appropriate, neutral modern-standard Telugu renderings. Replacing “అక్కడి నుంచే” with “అక్కడి నుండి” avoids adding an unnecessary emphatic nuance while retaining ἐκεῖθεν (“from there”).
  issues:
  - severity: low
    issue: Indefinite relative construction
    rationale: Use “ఏ ఇంట్లోకి ప్రవేశించినా” rather than “ఏ ఇంట్లోకి ప్రవేశిస్తారో” to express the Greek ἣν ἂν idiom naturally without implying an unresolved correlative clause.
  - severity: low
    issue: Possible added emphasis in నుంచే
    rationale: The enclitic “-ఏ” can sound emphatic (“from there itself/only”). The Greek specifies departure from that place but does not require this added emphasis; “నుండి” is more neutral.
  revised_text: మీరు ఏ ఇంట్లోకి ప్రవేశించినా, అక్కడే ఉండండి; అక్కడి నుండి బయలుదేరండి.
  revised_footnotes: []
  revision_rationale: 'This revision preserves the source’s sequence and repeated location: enter any house, remain there, and depart from there. It uses an idiomatic Telugu indefinite construction and neutral wording without interpretive expansion.'
