  text: And whatever house you enter, stay there, and leave from there.
translation:
  language: te
  text: మీరు ఏ ఇంట్లోకి ప్రవేశించినా, అక్కడే ఉండండి; అక్కడి నుండి బయలుదేరండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἣν ἂν οἰκίαν
  choice: ఏ ఇంట్లోకి
  rationale: ἣν ἂν యొక్క అనిశ్చిత సాధారణ భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఏ ... లోకి’గా వ్యక్తం చేస్తుంది.
- source_word: ἐκεῖ μένετε
  choice: అక్కడే ఉండండి
  rationale: μένω అంటే ఇక్కడ ఒకేచోట బసచేస్తూ ఉండడం; ‘అక్కడే’లో ἐκεῖ యొక్క స్థలబలం, సందర్భానుసారమైన నిలకడ రెండూ సహజంగా వినిపిస్తాయి.
- source_word: ἐκεῖθεν ἐξέρχεσθε
  choice: అక్కడి నుంచే బయలుదేరండి
  rationale: ἐκεῖθεν అంటే ‘అక్కడి నుండి’; ἐξέρχομαιకు సందర్భంలో ‘బయలుదేరు’ సహజమైనది. ‘నుంచే’ పునరుక్త ἐκεῖతో సూచితమైన అదే ఇంటి భావాన్ని నిలుపుతుంది.
