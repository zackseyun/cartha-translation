translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ఆజ్ఞారూపం. మూలంలోని రెండు సమన్వయ ఆజ్ఞలను అర్ధవిరామంతో స్పష్టంగా ఉంచి, ఎలాంటి వ్యాఖ్యాన విస్తరణను చేర్చలేదు.
