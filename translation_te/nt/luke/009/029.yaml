  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν τὸ εἶδος τοῦ προσώπου αὐτοῦ ἕτερον καὶ ὁ ἱματισμὸς αὐτοῦ λευκὸς ἐξαστράπτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/029.yaml
  text: And as he was praying[a], the appearance of his face became different, and his clothing became white[b], flashing like lightning.
translation:
  language: te
  text: ఆయన ప్రార్థిస్తూ ఉండగా, ఆయన ముఖరూపం భిన్నంగా మారింది; ఆయన వస్త్రాలు తెల్లగా మెరుపులా మెరిశాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన వస్త్రాలు తెల్లగా, మిరుమిట్లు గొలిపేవిగా అయ్యాయి.’ గ్రీకు పదం మెరుపువంటి తళుకును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν
  choice: ఆయన ప్రార్థిస్తూ ఉండగా
  rationale: లూకా వాడిన ఈ నిర్మాణం, ప్రార్థన జరుగుతున్న సమయంలో సంభవించిన సంఘటనను సూచిస్తుంది. తెలుగులో సహజమైన కాలసంబంధ ప్రయోగంతో దానిని వ్యక్తం చేశాం.
- source_word: τὸ εἶδος τοῦ προσώπου αὐτοῦ
  choice: ఆయన ముఖరూపం
  rationale: εἶδος ఇక్కడ అంతర్గత స్వరూపాన్ని కాక కనిపించే రూపాన్ని సూచిస్తుంది. ‘ముఖరూపం’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ἕτερον
  choice: భిన్నంగా మారింది
  rationale: ἕτερον అంటే ‘వేరైనది/భిన్నమైనది.’ మార్పును సూచించే వాక్యసందర్భానికి అనుగుణంగా ‘భిన్నంగా మారింది’ అని అనువదించాం; సమాంతర సువార్తలలోని ‘ప్రకాశించింది’ అనే భావాన్ని దిగుమతి చేయలేదు.
- source_word: ὁ ἱματισμὸς αὐτοῦ
  choice: ఆయన వస్త్రాలు
  rationale: ἱματισμός దుస్తులు లేదా వస్త్రాలను సూచిస్తుంది. గౌరవప్రదమైన ఆధునిక కథనశైలికి ‘వస్త్రాలు’ సరిపోతుంది.
- source_word: λευκὸς
  choice: తెల్లగా
  rationale: λευκός యొక్క ప్రత్యక్ష అర్థం ‘తెలుపు.’ దాని ప్రకాశాన్ని తరువాతి కృదంతం తెలియజేస్తుంది కాబట్టి ఇక్కడ అదనపు విశేషణం చేర్చలేదు.
- source_word: ἐξαστράπτων
  choice: మెరుపులా మెరిశాయి
  rationale: ఈ కృదంతం మెరుపువంటి ప్రకాశాన్ని సజీవంగా సూచిస్తుంది. ‘మెరుపులా మెరిశాయి’ ఆ దృశ్యాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: యేసు రూపాంతర వర్ణన
  choice: లూకా మాటల ప్రకారం ఆయన ముఖరూపం కనిపించే విధంగా భిన్నంగా మారిందని అనువదించడం
  alternative: ఆయన ముఖం ప్రకాశించింది
  rationale: వాక్యం నిజమైన దృశ్యమాన మార్పును వర్ణిస్తుంది; అయితే మత్తయిలో ఉన్న ‘ప్రకాశించింది’ అనే నిర్దిష్ట వర్ణనను లూకా ఇక్కడ ఉపయోగించలేదు. కాబట్టి సమాంతర వృత్తాంతాలతో సమన్వయం చేయకుండా లూకా యొక్క సంయమనభరిత పదప్రయోగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. గ్రీకు వాక్యంలోని కాలసంబంధం, కనిపించే రూపమార్పు, మెరుపువంటి వస్త్రప్రకాశం నిలుపబడ్డాయి.
