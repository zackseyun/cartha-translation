revisions:
- from: అయితే ఆయన వారితో, “మీరే వారికి తినడానికి ఏదైనా ఇవ్వండి” అన్నాడు.[a] అందుకు వారు, “మా దగ్గర ఐదు రొట్టెలు, రెండు చేపలు తప్ప మరేమీ లేవు. మేమే వెళ్లి ఈ ప్రజలందరికీ[b] ఆహారం కొనాలి అనుకుంటే తప్ప” అన్నారు.
  to: అయితే ఆయన వారితో, “మీరే[a] వారికి తినడానికి ఏదైనా ఇవ్వండి” అన్నాడు. అందుకు వారు, “మా దగ్గర ఐదు రొట్టెలు, రెండు చేపలు తప్ప మరేమీ లేవు—మేమే వెళ్లి ఈ ప్రజలందరికీ[b] ఆహారం కొంటే తప్ప” అన్నారు.
