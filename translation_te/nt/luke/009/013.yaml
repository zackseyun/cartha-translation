id: LUK.9.13
reference: Luke 9:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Δότε αὐτοῖς ⸂ὑμεῖς φαγεῖν⸃. οἱ δὲ εἶπαν· Οὐκ εἰσὶν ἡμῖν πλεῖον ἢ ⸂ἄρτοι πέντε⸃ καὶ ἰχθύες δύο, εἰ μήτι πορευθέντες ἡμεῖς ἀγοράσωμεν εἰς πάντα τὸν λαὸν τοῦτον βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/013.yaml
  text: But he said to them[a], “You give them something to eat.” But they said[b], “We have no more than five loaves and two fish—unless we go and buy food for all this people.”
translation:
  language: te
  text: అయితే ఆయన వారితో, “మీరే[a] వారికి తినడానికి ఏదైనా ఇవ్వండి” అన్నాడు. అందుకు వారు, “మా దగ్గర ఐదు రొట్టెలు, రెండు చేపలు తప్ప మరేమీ లేవు—మేమే వెళ్లి ఈ ప్రజలందరికీ[b] ఆహారం కొంటే తప్ప” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత స్పష్టంగా, “మీరు స్వయంగా వారికి తినడానికి ఏదైనా ఇవ్వండి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఈ జనసమూహమంతటికీ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δότε αὐτοῖς ὑμεῖς φαγεῖν
  choice: మీరే వారికి తినడానికి ఏదైనా ఇవ్వండి
  rationale: δίδωμι + φαγεῖν అనే గ్రీకు నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో ‘తినడానికి ఏదైనా ఇవ్వండి’గా వ్యక్తం చేశాం. సాధారణంగా కర్తను విడిచిపెట్టగల తెలుగులో ὑμεῖς యొక్క స్పష్టమైన ఉనికి, దాని ఉద్ఘాటనను ‘మీరే’ తెలియజేస్తుంది.
- source_word: Οὐκ εἰσὶν ἡμῖν πλεῖον ἢ
  choice: మా దగ్గర ... తప్ప మరేమీ లేవు
  rationale: తమ వద్ద ఉన్నది పేర్కొన్న పరిమిత పరిమాణమేనని చెప్పే నిషేధార్థక నిర్మాణాన్ని సహజంగా, స్పష్టంగా అందిస్తుంది.
- source_word: ἄρτοι πέντε
  choice: ఐదు రొట్టెలు
  rationale: ἄρτοι ఇక్కడ లెక్కించదగిన విడివిడిగా ఉన్న రొట్టెలను సూచిస్తుంది; ‘రొట్టెలు’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: ἰχθύες δύο
  choice: రెండు చేపలు
  rationale: మూలంలోని సాధారణ బహువచన నామవాచకానికి నేరమైన తెలుగు సమానం.
- source_word: εἰ μήτι
  choice: '... అనుకుంటే తప్ప'
  rationale: ఈ పదబంధం మినహాయింపుతో పాటు స్వల్ప సందేహం లేదా ఆచరణసాధ్యతపై అభ్యంతర స్వరాన్ని కలిగి ఉండవచ్చు. తెలుగు నిర్మాణం దానిని కఠినమైన ప్రకటనగా మార్చకుండా ఉంచుతుంది.
- source_word: πορευθέντες ἡμεῖς ἀγοράσωμεν
  choice: మేమే వెళ్లి ... ఆహారం కొనాలి
  rationale: గ్రీకు క్రియావిశేషణాత్మక అసమాపక క్రియను తెలుగులో సహజమైన సంయుక్త క్రియగా అందించాం. ἡμεῖς యొక్క స్పష్టతను ‘మేమే’తో నిలిపాం.
- source_word: πάντα τὸν λαὸν τοῦτον
  choice: ఈ ప్రజలందరికీ
  rationale: λαός యొక్క ‘ప్రజలు’ అనే విస్తృత సామూహిక అర్థాన్ని, πάντα మరియు τοῦτον సూచనలను సహజమైన తెలుగు పదక్రమంలో నిలిపాం.
- source_word: βρώματα
  choice: ఆహారం
  rationale: బహువచన రూపంలో ఉన్నప్పటికీ సందర్భంలో తినుబండారాలను సమష్టిగా సూచిస్తున్నందున ‘ఆహారం’ సహజమైన తెలుగు ఎంపిక.
theological_decisions:
- issue: యేసు ఆజ్ఞలోని ఉద్ఘాటన, శిష్యుల సమాధానంలోని స్వరం
  choice: యేసు మాటలో ὑμεῖς ఉద్ఘాటనను ‘మీరే’తో నిలిపి, శిష్యుల జవాబును ఆచరణసాధ్యతపై అభ్యంతరంగా మాత్రమే అనువదించాం.
  alternative: ఆజ్ఞను మరింత మందలింపుగా లేదా శిష్యుల జవాబును వ్యంగ్యంగా, అసహనంగా చూపించడం.
  rationale: మూలపాఠంలో నేరమైన ఆజ్ఞ, ఆచరణాత్మక అభ్యంతరం ఉన్నాయి; అయితే మందలింపు, వ్యంగ్యం లేదా తీవ్రమైన అసహనం స్పష్టంగా గుర్తించబడలేదు. అందువల్ల అదనపు భావోద్వేగాన్ని చేర్చలేదు.
- issue: εἰ μήτι వల్ల కలిగే వాక్యభావం
  choice: ‘మేమే వెళ్లి ... కొనాలి అనుకుంటే తప్ప’ అని, మినహాయింపు మరియు స్వల్ప ప్రశ్నార్థక అభ్యంతరం రెండింటికీ చోటు ఉంచాం.
  alternative: దీనిని స్పష్టమైన ప్రశ్నగా ‘మేము వెళ్లి కొనాలా?’ లేదా పూర్తిగా నిశ్చయాత్మక ప్రకటనగా ‘మేము వెళ్లి కొనడం తప్ప’ అని మార్చడం.
  rationale: గ్రీకు వాక్యం ప్రశ్నార్థక చిహ్నంతో గుర్తించబడకపోయినా, εἰ μήτι సందర్భంలో సందేహం లేదా అసంభవతను సూచించవచ్చు. ప్రధాన పాఠం ఆ ఉద్రిక్తతను అతిగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘మీరే’, ‘మేమే’ అనే రూపాలు మూలంలోని స్పష్టమైన సర్వనామాల ఉద్ఘాటనను సహజంగా నిలుపుతాయి. [a], [b] గుర్తులు రెండూ ప్రధాన పాఠంలో సంబంధిత పదబంధాల దగ్గర ఉంచబడ్డాయి.
