    rationale: ἀκολουθεῖ μεθ’ ἡμῶν లో యేసు ప్రత్యక్ష కర్మగా లేదు; ‘మాతో’ అనేది శిష్యబృంద సహవాసాన్ని సూచిస్తుంది. ‘నిన్ను’ చేర్చడం ఆ వ్యక్తి యేసును అనుసరిస్తున్నాడని వ్యాఖ్యానాత్మకంగా నిర్ధారిస్తుంది. ‘మాతో కలిసి అనుసరించడు’ అని ఉంచితే మూలంలోని సంక్షిప్తత, ఉద్రిక్తత నిలుస్తాయి.
