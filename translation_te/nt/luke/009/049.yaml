revisions:
- from: అప్పుడు యోహాను, “ప్రభువా, ఒకడు నీ పేరట దయ్యాలను వెళ్లగొట్టడం మేము చూశాం. అతడు మాతో కలిసి నిన్ను అనుసరించడం లేదు కాబట్టి, అతణ్ణి అడ్డుకోవడానికి ప్రయత్నించాం” అని అన్నాడు.
  to: 'అప్పుడు యోహాను ఇలా అన్నాడు: “స్వామీ, ఒక వ్యక్తి నీ పేరట దయ్యాలను వెళ్లగొట్టడం మేము చూశాం. అతడు మాతో కలిసి అనుసరించడు కాబట్టి, అతణ్ణి అడ్డుకోవడానికి ప్రయత్నించాం.”'
  rationale: మూలంలో లేని ‘నిన్ను’ను తొలగించి, μεθ’ ἡμῶν యొక్క ‘మాతో కలిసి’ భావాన్ని నిలిపాం. ἐκωλύομεν యొక్క అసంపూర్ణ/ప్రయత్నాత్మక భావాన్ని ‘అడ్డుకోవడానికి ప్రయత్నించాం’లో కాపాడాం. ‘స్వామీ’ ద్వారా Ἐπιστάταకు తగిన గౌరవపూర్వక నాయకత్వ సంబోధనను ఇచ్చాం. పాదటిప్పణి అవసరం లేదు, ఎందుకంటే ప్రధాన పాఠ్యం మూలంలోని సందిగ్ధతను తగ్గించకుండా అర్థమయ్యేలా ఉంది.
