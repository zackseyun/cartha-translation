id: LUK.9.49
reference: Luke 9:49
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς ⸀δὲ Ἰωάννης εἶπεν· Ἐπιστάτα, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, καὶ ⸀ἐκωλύομεν αὐτὸν ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/049.yaml
  text: Then John answered[a], “Master, we saw someone casting out demons in your name, and we tried to stop him because he does not follow with us.”
translation:
  language: te
  text: 'అప్పుడు యోహాను ఇలా అన్నాడు: “స్వామీ, ఒక వ్యక్తి నీ పేరట దయ్యాలను వెళ్లగొట్టడం మేము చూశాం. అతడు మాతో కలిసి అనుసరించడు కాబట్టి, అతణ్ణి అడ్డుకోవడానికి ప్రయత్నించాం.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ Ἰωάννης εἶπεν
  choice: అప్పుడు యోహాను ... అని అన్నాడు
  rationale: δέతో కూడిన ఈ కృదంత ప్రయోగం కథనంలో ప్రతిస్పందనను, ముందుకు సాగే సంధిని సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు ‘అప్పుడు ... అన్నాడు’ అని ఇచ్చాం; సందర్భంలో ప్రత్యక్ష ప్రశ్న లేకపోవడంతో కృత్రిమంగా ‘జవాబిచ్చాడు’ అని పెట్టలేదు.
- source_word: Ἐπιστάτα
  choice: ప్రభువా
  rationale: లూకా రచనలో ఇది శిష్యులు యేసును అధికారం, నాయకత్వం కలవాడిగా సంబోధించే ప్రత్యేక పదం. ఆధునిక తెలుగు బైబిలు శైలిలో ‘ప్రభువా’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది; కేవలం బోధనా పాత్రను సూచించే ‘బోధకుడా’ కంటే విస్తృతమైనది.
- source_word: εἴδομέν τινα
  choice: ఒకడు ... మేము చూశాం
  rationale: τινα అనిర్దిష్ట వ్యక్తిని సూచిస్తుంది. సంబంధిత పురుష ఏకవచన సర్వనామాల ప్రకారం తెలుగులో సహజమైన ‘ఒకడు’ వాడబడింది.
- source_word: ἐν τῷ ὀνόματί σου
  choice: నీ పేరట
  rationale: యేసు పేరు ఆధారంగా లేదా ఆయన అధికారంలో కార్యం చేయడాన్ని సూచించే గ్రీకు నుడికారానికి ‘నీ పేరట’ సహజమైన, సంక్షిప్తమైన తెలుగు సమానం; దాని ఆధ్యాత్మిక బరువును నిలుపుతుంది.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: దయ్యాలను వెళ్లగొట్టడం
  rationale: ἐκβάλλω ఇక్కడ దయ్యాలను వ్యక్తి నుంచి బయటకు పంపడాన్ని సూచిస్తుంది. ‘వెళ్లగొట్టడం’ ఆధునిక పాఠకులకు స్పష్టంగా, సహజంగా ఉంది.
- source_word: ἐκωλύομεν
  choice: అడ్డుకోవడానికి ప్రయత్నించాం
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా ప్రయత్నించిన చర్యను సూచించవచ్చు. తరువాతి వచనంలోని యేసు ఆజ్ఞకు అనుగుణంగా, వారు విజయవంతంగా పూర్తిగా ఆపేశారని తేల్చకుండా ప్రయత్న భావాన్ని నిలిపాం.
- source_word: ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν
  choice: అతడు మాతో కలిసి నిన్ను అనుసరించడం లేదు కాబట్టి
  rationale: μεθ’ ἡμῶνలోని ‘మాతో’ భావాన్ని స్పష్టంగా నిలిపి, ఆ వ్యక్తి శిష్యుల బృందంలో కలిసి యేసును అనుసరించడం లేదనే ఫిర్యాదును వ్యక్తం చేస్తుంది. ‘నిన్ను’ అనేది ἀκολουθεῖ యొక్క సందర్భసిద్ధమైన అంతర్భావిత కర్మను తెలుగులో సహజత కోసం స్పష్టం చేస్తుంది; అతడు యోహాను లేదా శిష్యులనే అనుసరించలేదనే అపార్థాన్ని నివారిస్తుంది.
theological_decisions:
- issue: ఆ వ్యక్తి ఎవరిని అనుసరించడం లేదనే ఫిర్యాదులోని భావసూక్ష్మత
  choice: అతడు మాతో కలిసి నిన్ను అనుసరించడం లేదు
  alternative: అతడు మమ్మల్ని అనుసరించడం లేదు
  rationale: గ్రీకులో μετά + షష్ఠీ విభక్తి ‘మాతో’ అని స్పష్టంగా ఉంది. కాబట్టి అతడు యేసును పూర్తిగా తిరస్కరించాడని గానీ, శిష్యులనే నాయకులుగా అనుసరించాల్సి ఉందని గానీ సూచించకుండా, వారి సహవాస బృందంలో చేరలేదనే కథన ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యే సహజమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం. మూలంలో ప్రత్యక్షంగా లేని పాదటిప్పణి అవసరం లేకుండా ‘మాతో కలిసి నిన్ను అనుసరించడం’ ద్వారా μεθ’ ἡμῶν భావాన్ని ప్రధాన పాఠ్యంలోనే స్పష్టంగా ఉంచాం.
