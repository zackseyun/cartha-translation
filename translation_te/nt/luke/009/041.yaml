revisions:
- from: 'అప్పుడు యేసు ఇలా జవాబిచ్చాడు: “విశ్వాసంలేని, వక్రమైన తరమా! నేను ఎంతకాలం మీతో ఉండాలి? ఎంతకాలం మిమ్మల్ని సహించాలి? నీ కుమారుణ్ణి ఇక్కడికి తీసుకురా.”'
  to: 'కానీ యేసు జవాబిచ్చి ఇలా అన్నాడు: “విశ్వాసంలేని, వక్రమైన తరమా! నేను ఇంకెంతకాలం మీతో ఉంటాను, మిమ్మల్ని సహిస్తాను? నీ కుమారుణ్ణి ఇక్కడికి తీసుకురా.”'
  rationale: The revision replaces the temporal connective with a mild contrastive one and preserves the Greek rhetorical future construction. It retains the draft's sound handling of the broad address, the rebuking tone, and the command directed to the father.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:42:55Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the rebuke, the indefinite corporate address ('generation'), the twofold rhetorical question, and the command to bring the son. However, δέ is more appropriately represented by a mild contrastive connective than by the temporal 'అప్పుడు,' and the Greek future rhetorical wording is better represented by 'ఉంటాను/సహిస్తాను' than the necessity-form 'ఉండాలి/సహించాలి.'
  naturalness: The revised wording is natural modern standard Telugu while retaining the elevated, admonitory register appropriate to Jesus' speech. 'వక్రమైన తరమా' is understandable and suitably forceful.
  terminology: '''విశ్వాసంలేని'' faithfully renders ἄπιστος without unnecessarily specifying its object. ''వక్రమైన'' preserves the figurative moral/spiritual distortion of διεστραμμένη without narrowing it to one interpretation. ''తరం'' retains the source''s broad, non-specific corporate reference.'
  issues:
  - severity: low
    issue: '''అప్పుడు'' renders δέ as a temporal transition.'
    rationale: δέ here most naturally supplies discourse contrast ('but'), not a specific temporal sequence ('then').
  - severity: low
    issue: The rhetorical futures are translated with necessity forms.
    rationale: '''ఉండాలి/సహించాలి'' can imply obligation (''must/should''). The Greek asks how long Jesus will remain and bear with them; Telugu future forms preserve that wording more closely.'
  revised_text: 'కానీ యేసు జవాబిచ్చి ఇలా అన్నాడు: “విశ్వాసంలేని, వక్రమైన తరమా! నేను ఇంకెంతకాలం మీతో ఉంటాను, మిమ్మల్ని సహిస్తాను? నీ కుమారుణ్ణి ఇక్కడికి తీసుకురా.”'
  revised_footnotes: []
  revision_rationale: The revision replaces the temporal connective with a mild contrastive one and preserves the Greek rhetorical future construction. It retains the draft's sound handling of the broad address, the rebuking tone, and the command directed to the father.
