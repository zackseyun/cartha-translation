reference: Luke 9:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ἔσομαι πρὸς ὑμᾶς καὶ ἀνέξομαι ὑμῶν; προσάγαγε ⸂ὧδε τὸν υἱόν σου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/041.yaml
  text: But Jesus answered, “O unbelieving and twisted generation, how long will I be with you and bear with you? Bring your son here.”
translation:
  language: te
  text: 'కానీ యేసు జవాబిచ్చి ఇలా అన్నాడు: “విశ్వాసంలేని, వక్రమైన తరమా! నేను ఇంకెంతకాలం మీతో ఉంటాను, మిమ్మల్ని సహిస్తాను? నీ కుమారుణ్ణి ఇక్కడికి తీసుకురా.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενεὰ
  choice: తరం
  rationale: ఈ సందర్భంలో సమకాలీన ప్రజాసమూహాన్ని సంబోధించే గ్రీకు పదానికి సహజమైన, విస్తృతార్థాన్ని నిలుపుకునే అనువాదం.
- source_word: ἄπιστος
  choice: విశ్వాసంలేని
  rationale: ‘నమ్మకంలేని/అవిశ్వాసి’ అనే భావాన్ని ఇక్కడ నేరుగా, సాధారణ పాఠకులకు స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: διεστραμμένη
  choice: వక్రమైన
  rationale: ‘వంకరగా చేయబడిన, దారి తప్పిన, చెడిపోయిన’ అనే రూపకాల పరిధిని నిలుపుతుంది; కేవలం నైతిక దుర్మార్గతకు మాత్రమే అర్థాన్ని కుదించదు.
- source_word: ἀνέξομαι
  choice: సహించాలి
  rationale: ఎవరినైనా ఓర్చుకొని భరించడం అనే క్రియార్థాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: προσάγαγε ὧδε
  choice: ఇక్కడికి తీసుకురా
  rationale: దగ్గరకు తీసుకురమ్మనే ఆజ్ఞను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘విశ్వాసంలేని, వక్రమైన తరం’ అనే మందలింపు ఎవరిని సూచిస్తుంది?
  choice: సంబోధనను సాధారణ బహువచన రూపంలోనే ఉంచడం
  alternative: దానిని ప్రత్యేకంగా శిష్యులకు, తండ్రికి, లేదా జనసమూహానికి మాత్రమే వర్తింపజేయడం
  rationale: గ్రీకు వాక్యం ఉద్దేశించిన వర్గాన్ని స్పష్టంగా పరిమితం చేయదు; అందువల్ల మూలంలోని ఉద్దేశ్యపూర్వక విస్తృతి/అస్పష్టతను అనువాదం నిలుపుతుంది.
- issue: ἕως πότε నిర్మాణంలోని రెండు ప్రశ్నల భావం
  choice: ‘నేను ఎంతకాలం మీతో ఉండాలి? ఎంతకాలం మిమ్మల్ని సహించాలి?’
  alternative: ‘నేను ఎంతకాలం మీతో ఉండి మిమ్మల్ని సహించాలి?’ అనే ఒకే ప్రశ్న
  rationale: గ్రీకులోని రెండు సమన్విత క్రియల వాక్చాతుర్య బలాన్ని తెలుగులో రెండు సమాంతర ప్రశ్నలుగా స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే యేసు పలికిన గంభీరమైన మందలింపు స్వరాన్ని కాపాడుతూ రూపొందించబడింది. ‘ఓ’ వంటి కృత్రిమ సంబోధనకు బదులుగా తెలుగు సంబోధన ప్రత్యయం ‘తరమా’ వాడబడింది.
