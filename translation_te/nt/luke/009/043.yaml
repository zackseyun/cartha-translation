id: LUK.9.43
reference: Luke 9:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐξεπλήσσοντο δὲ πάντες ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ. Πάντων δὲ θαυμαζόντων ἐπὶ πᾶσιν οἷς ⸀ἐποίει εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/043.yaml
  text: 'And they were all astonished at the majesty of God. But while everyone was marveling at all that he was doing[a], he said to his disciples:'
translation:
  language: te
  text: 'దేవుని గొప్పతనాన్ని చూసి అందరూ విస్మయచకితులయ్యారు.[a] యేసు చేస్తున్న వాటన్నిటిని బట్టి అందరూ ఆశ్చర్యపడుతుండగా, ఆయన తన శిష్యులతో ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని మహిమను చూసి.’ గ్రీకు పదం గొప్పతనం, వైభవం లేదా మహోన్నతత్వాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: విస్మయచకితులయ్యారు
  rationale: బలమైన ఆశ్చర్యాన్ని తెలిపే ఈ క్రియను, తరువాత వచ్చే θαυμαζόντωνతో భేదం కనిపించేలా బలమైన తెలుగు పదబంధంతో అనువదించాం. అపూర్ణ భూతకాల రూపం సూచించే కొనసాగుతున్న స్పందనను సందర్భానుసారంగా సహజమైన కథన భూతకాలంలో తెలిపాం.
- source_word: πάντες
  choice: అందరూ
  rationale: ప్రతివారూ ఈ స్పందనలో భాగమైనారనే సమగ్ర భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ
  choice: దేవుని మహాత్మ్యానికి
  rationale: ἐπίతో కూడిన దత్తి విభక్తి ఆశ్చర్యానికి కారణం లేదా విషయాన్ని సూచిస్తుంది. μεγαλειότηςలోని గొప్పతనం, వైభవం, మహోన్నతత అనే భావాలను ‘మహాత్మ్యం’ సంక్షిప్తంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: Πάντων δὲ θαυμαζόντων
  choice: అందరూ ఆశ్చర్యపడుతుండగా
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణాన్ని కాలసంబంధ ఉపవాక్యంగా సహజ తెలుగులో ఇచ్చాం. ‘ఆశ్చర్యపడుతుండగా’ అనే రూపం కొనసాగుతున్న చర్యను నిలుపుతూ, ముందున్న మరింత బలమైన ‘విస్మయచకితులయ్యారు’తో భేదాన్ని చూపుతుంది.
- source_word: ἐπὶ πᾶσιν οἷς ἐποίει
  choice: యేసు చేస్తున్న వాటన్నిటిని చూసి
  rationale: అందరూ ఆశ్చర్యపడడానికి కారణమైన ఆయన కొనసాగుతున్న కార్యాలన్నిటినీ సూచిస్తుంది. తెలుగు పాఠ్యంలో కర్త అపార్థం కాకుండా, కథన సందర్భం స్పష్టంగా సూచించే యేసు పేరును ఉపయోగించాం.
- source_word: εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: ఆయన తన శిష్యులతో ఇలా అన్నాడు
  rationale: సహజ తెలుగు సంభాషణ పరిచయంగా అనువదించాం; ‘తన’ మూలంలోని స్వామ్య సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది. తరువాత మాటలు రానున్నందున ‘ఇలా’ సహజ కథన ప్రవాహాన్ని ఇస్తుంది.
theological_decisions:
- issue: οἷς ἐποίει / εἶπενలోని సూచిత కర్త
  choice: కథన సందర్భానికి అనుగుణంగా కర్తను ‘యేసు’ అని మొదట స్పష్టం చేసి, తరువాత ‘ఆయన’ అని కొనసాగించడం
  alternative: రెండు చోట్లా ‘ఆయన’ అని ఉంచి, అది దేవుణ్ణి సూచిస్తుందా యేసును సూచిస్తుందా అనే తెలుగు అస్పష్టతను వదిలివేయడం
  rationale: తక్షణ కథన సందర్భంలో కార్యాలు చేస్తున్నవాడూ శిష్యులతో మాట్లాడుతున్నవాడూ యేసే. అదే సమయంలో ఆ కార్యాల్లో ప్రత్యక్షమైనది ‘దేవుని మహాత్మ్యం’ అని మూలపాఠం చెప్పే భేదాన్ని అనువాదం నిలుపుతుంది; దేవుణ్ణి, యేసును ఒకే సూచనగా కలిపివేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. రెండు గ్రీకు ఆశ్చర్య క్రియల బలభేదాన్ని ‘విస్మయచకితులయ్యారు’ మరియు ‘ఆశ్చర్యపడుతుండగా’ ద్వారా నిలిపాం.
