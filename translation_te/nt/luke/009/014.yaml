source:
  edition: SBLGNT
  text: ἦσαν γὰρ ὡσεὶ ἄνδρες πεντακισχίλιοι. εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Κατακλίνατε αὐτοὺς κλισίας ⸀ὡσεὶ ἀνὰ πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/014.yaml
  text: For there were about five thousand men[a]. And he said to his disciples[b], “Have them recline in groups of about fifty each.”
translation:
  language: te
  text: 'ఎందుకంటే దాదాపు ఐదువేల మంది పురుషులు[a] ఉన్నారు. ఆయన తన శిష్యులతో ఇలా అన్నాడు: “వారిని దాదాపు యాభై మంది చొప్పున గుంపులుగా భోజనానికి కూర్చోబెట్టండి[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులోని పదం ప్రత్యేకంగా వయోజన పురుషులను సూచిస్తుంది; ఈ సంఖ్యలో స్త్రీలు, పిల్లలు చేర్చబడలేదు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు క్రియ భోజనం కోసం ఆనుకుని లేదా వాలుతూ కూర్చునేలా చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ
  choice: దాదాపు
  rationale: ఈ పదం ఖచ్చిత సంఖ్యను కాక సుమారు సంఖ్యను సూచిస్తుంది; వచనంలోని రెండు సందర్భాల్లోనూ ‘దాదాపు’ సహజంగా సరిపోతుంది.
- source_word: ἄνδρες
  choice: పురుషులు
  rationale: ἀνήρ సాధారణంగా ప్రజలందరినీ కాక పురుషులను ప్రత్యేకంగా సూచిస్తుంది; మూలంలోని లింగ నిర్దిష్టతను నిలుపుతుంది.
- source_word: πεντακισχίλιοι
  choice: ఐదువేల మంది
  rationale: పురుషుల సంఖ్యను తెలిపే సరళమైన సంఖ్యావాచకం.
- source_word: Κατακλίνατε
  choice: భోజనానికి కూర్చోబెట్టండి
  rationale: ఈ క్రియ భోజనం కోసం ఆనుకొని కూర్చోవడం లేదా పరుండడం చేయించడాన్ని సూచిస్తుంది. తెలుగు సందర్భంలో ‘భోజనానికి కూర్చోబెట్టండి’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: κλισίας
  choice: గుంపులో
  rationale: బృందాలుగా లేదా విభాగాలుగా ఏర్పాటు చేయడాన్ని సూచించే బహువచన నామవాచకం; తెలుగులో పంపిణీ నిర్మాణంతో ‘ఒక్కో గుంపులో’ స్పష్టంగా ఉంటుంది.
- source_word: ἀνὰ πεντήκοντα
  choice: యాభై మంది చొప్పున
  rationale: ἀνά సంఖ్యతో కలిసి పంపిణీ భావాన్ని ఇస్తుంది; ‘చొప్పున’ ఆ భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: γὰρ ... δὲ
  choice: ఎందుకంటే ... అప్పుడు
  rationale: γάρ యొక్క వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’ నిలుపుతుంది; δέ కథన కొనసాగింపును ఇక్కడ ‘అప్పుడు’ సహజంగా తెలియజేస్తుంది.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: తన శిష్యులతో
  rationale: మూలంలోని αὐτοῦ స్వామ్య భావాన్ని ‘తన’ ద్వారా నిలుపుతూ, తెలుగు ఉక్తి నిర్మాణానికి సహజంగా ఉంది.
