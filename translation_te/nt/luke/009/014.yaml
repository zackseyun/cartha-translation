  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని సుమారు సంఖ్య, పురుషులనే సూచించే పదం, భోజనానికి ఆనుకొని కూర్చునే భావం, గుంపులవారీ పంపిణీ అన్నీ నిలుపబడ్డాయి.
