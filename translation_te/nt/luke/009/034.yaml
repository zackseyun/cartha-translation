source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ λέγοντος ἐγένετο νεφέλη καὶ ⸀ἐπεσκίαζεν αὐτούς· ἐφοβήθησαν δὲ ἐν τῷ ⸂εἰσελθεῖν αὐτοὺς⸃ εἰς τὴν νεφέλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/034.yaml
  text: While he was saying these things, a cloud appeared and began to overshadow them; and they were afraid as they entered into the cloud.
translation:
  language: te
  text: ఆయన ఈ మాటలు చెబుతూ ఉండగా, ఒక మేఘం వచ్చి వారిని కమ్మడం మొదలుపెట్టింది.[a] వారు ఆ మేఘంలోకి[b] ప్రవేశించగా భయపడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక మేఘం వచ్చి వారిని కమ్మింది.” గ్రీకు క్రియను చర్య మొదలైనదనే భావాన్ని ప్రత్యేకంగా వ్యక్తం చేయకుండా కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఈ మేఘం పాత నిబంధనలో దేవుడు తన సన్నిధిని ప్రత్యక్షపరచిన సందర్భాలను గుర్తుచేసే అవకాశం ఉంది; అయితే ఈ వచనం దానిని స్పష్టంగా చెప్పదు.
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα
  choice: ఈ మాటలు
  rationale: బహువచన సూచనను నిలుపుతూ, పేతురు అప్పుడే చెప్పిన మాటలను సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: αὐτοῦ λέγοντος
  choice: ఆయన ... చెబుతూ ఉండగా
  rationale: వర్తమాన కృదంతంతో ఉన్న genitive absolute సమకాలీనంగా కొనసాగుతున్న చర్యను సూచిస్తుంది; ఈ రూపం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐγένετο νεφέλη
  choice: ఒక మేఘం వచ్చి
  rationale: మేఘం ప్రత్యక్షమవడం లేదా అక్కడికి రావడం అనే ఆరంభాన్ని సహజంగా వ్యక్తం చేస్తుంది; అది ఎలా ఏర్పడిందో అదనంగా నిర్దేశించదు.
- source_word: ἐπεσκίαζεν
  choice: వారిని కమ్మడం మొదలుపెట్టింది
  rationale: అసంపూర్ణ భూతకాల రూపంలోని అభివృద్ధి చెందుతున్న లేదా ఆరంభమవుతున్న చర్యను వ్యక్తం చేస్తుంది. ‘కమ్మడం’ మేఘం వారిపై వ్యాపించిన దృశ్యాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἐφοβήθησαν
  choice: భయపడ్డారు
  rationale: భయం కలిగిన సంఘటనను సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν τῷ εἰσελθεῖν αὐτοὺς
  choice: వారు ... ప్రవేశించగా
  rationale: articular infinitive సూచించే సమకాలీన కాలసంబంధాన్ని సహజంగా తెలియజేస్తూ, αὐτούςను ప్రవేశించే వారి కర్తగా అనువదిస్తుంది.
- source_word: εἰς τὴν νεφέλην
  choice: ఆ మేఘంలోకి
  rationale: εἰς సూచించే లోపలికి కదలికను స్పష్టంగా నిలుపుతుంది; కేవలం మేఘం కింద ఉండటం అనే భావానికి పరిమితం చేయదు.
theological_decisions:
- issue: మేఘం స్వభావం మరియు దాని చర్య
  choice: ప్రధాన వాక్యంలో మేఘాన్ని దేవుని ప్రత్యక్ష సన్నిధిగా నేరుగా గుర్తించకుండా, అది వచ్చి వారిని కమ్మినట్లు వర్ణనాత్మకంగా అనువదించడం.
  alternative: మేఘాన్ని మహిమామేఘం లేదా దేవుని ప్రత్యక్ష సన్నిధి అని స్పష్టంగా పేర్కొనడం.
  rationale: సందర్భం పాత నిబంధనలో దేవుని ప్రత్యక్ష సన్నిధిని సూచించే మేఘ దృశ్యాలను గుర్తుచేసినా, ఈ వచనం స్వయంగా ఆ గుర్తింపును స్పష్టంగా చెప్పదు. అందువల్ల దృశ్యాన్ని నిలిపి, సిద్ధాంతపరమైన వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే వాక్య గౌరవాన్ని కాపాడే శైలి. ‘మేఘంలోకి ప్రవేశించగా’ అనే రూపం మూలంలోని స్పష్టమైన స్థలగమనాన్ని నిలుపుతుంది.
