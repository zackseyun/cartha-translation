id: LUK.9.59
reference: Luke 9:59
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς ἕτερον· Ἀκολούθει μοι. ὁ δὲ εἶπεν· ⸀Κύριε, ἐπίτρεψόν μοι ⸂ἀπελθόντι πρῶτον⸃ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/059.yaml
  text: Then he said to another[a], “Follow me.” But he said, “Lord, permit me first to go and bury my father.”
translation:
  language: te
  text: ఆయన మరొకరితో, “నన్ను అనుసరించు” అని చెప్పాడు. అయితే అతడు, “ప్రభువా, ముందుగా వెళ్లి నా తండ్రిని పాతిపెట్టడానికి నన్ను అనుమతించండి” అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా తండ్రిని పాతిపెట్టడానికి ముందు నన్ను వెళ్లనివ్వండి.”
    reason: ἀπελθόντι πρῶτον అనే నిర్మాణాన్ని తెలుగులో మరో సహజమైన పదక్రమంలో వ్యక్తం చేసే అనువాద ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: ἕτερον
  choice: మరొకరితో
  rationale: ἕτερος ఇక్కడ ఇంతకు ముందు ప్రస్తావించిన వ్యక్తికి భిన్నమైన మరొక వ్యక్తిని సూచిస్తుంది; ‘మరొకరితో’ సహజమైన తెలుగు కథన రూపం.
- source_word: Ἀκολούθει μοι
  choice: నన్ను అనుసరించు
  rationale: ἀκολουθέω అనే వర్తమాన ఆజ్ఞారూపాన్ని తెలుగులో సహజంగా ‘అనుసరించు’ అని ఇచ్చాం; కొనసాగింపు భావాన్ని ప్రత్యేకంగా చేర్చి అతివ్యాఖ్య చేయలేదు.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: యేసును నేరుగా సంబోధించే κύριε గౌరవ సంబోధనగానూ ప్రభువు అనే బిరుదుగానూ వినిపించగలదు; ‘ప్రభువా’ ఆ రెండు భావాల మధ్యనున్న ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది.
- source_word: ἐπίτρεψόν μοι
  choice: నన్ను అనుమతించండి
  rationale: ఇది అనుమతి కోరే ఆజ్ఞారూపం. ‘అనుమతించండి’ ఆధునిక తెలుగులో సహజంగా, గౌరవపూర్వకంగా ఉంది.
- source_word: ἀπελθόντι πρῶτον
  choice: ముందుగా వెళ్లి
  rationale: పాతిపెట్టే చర్యకు ముందు వెళ్లడాన్ని ఈ కృదంత నిర్మాణం సూచిస్తుంది; ‘ముందుగా వెళ్లి’ ఆ క్రమాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: θάψαι τὸν πατέρα μου
  choice: నా తండ్రిని పాతిపెట్టడానికి
  rationale: θάπτω యొక్క సాధారణ అర్థం ‘పాతిపెట్టు’; మూలంలోని ‘నా తండ్రి’ అనే ప్రత్యక్ష కర్మను యథాతథంగా ఉంచాం.
theological_decisions:
- issue: యేసును ఉద్దేశించి κύριος అనే సంబోధన
  choice: ప్రభువా
  alternative: బోధకుడా / అయ్యా
  rationale: ‘అయ్యా’ అనేది కేవలం సామాజిక మర్యాదగా భావాన్ని పరిమితం చేయవచ్చు; ‘ప్రభువా’ గౌరవ సంబోధనను, లూకా కథనంలో ఉండగల క్రీస్తుసంబంధమైన ప్రతిధ్వనిని రెండింటినీ నిలుపుతుంది.
- issue: తండ్రిని పాతిపెట్టడం అనే అభ్యర్థనకు నేపథ్యం
  choice: అభ్యర్థనను వివరణ లేకుండా నేరుగా అనువదించడం
  alternative: తండ్రి అప్పటికే మరణించాడని లేదా భవిష్యత్తులో మరణించే వరకు వేచి ఉండాలని పాఠ్యంలో స్పష్టీకరించడం
  rationale: గ్రీకు వాక్యం తండ్రి స్థితిని స్పష్టంగా చెప్పదు. అందువల్ల ఏ సాంస్కృతిక లేదా కాలక్రమ వ్యాఖ్యానాన్నీ ప్రధాన పాఠ్యంలో చేర్చకుండా అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. యేసు ఇచ్చిన ఏకవచన ఆజ్ఞకు ‘అనుసరించు’ అని, ఆయనను సంబోధించే వ్యక్తి అభ్యర్థనకు గౌరవబహువచనమైన ‘అనుమతించండి’ అని ఇచ్చాం. మూలంలో లేని నేపథ్య వివరాలను చేర్చలేదు.
