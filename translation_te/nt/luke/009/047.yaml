source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀εἰδὼς τὸν διαλογισμὸν τῆς καρδίας αὐτῶν ἐπιλαβόμενος ⸀παιδίον ἔστησεν αὐτὸ παρ’ ἑαυτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/047.yaml
  text: But Jesus[a], knowing the reasoning of their hearts, took a child and set him beside himself[b],
translation:
  language: te
  text: అయితే యేసు, వారి హృదయంలోని ఆలోచనను ఎరిగి, ఒక చిన్నబిడ్డను పట్టుకొని తన పక్కన నిలబెట్టాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδὼς
  choice: ఎరిగి
  rationale: ఈ సందర్భంలో అంతరంగ ఆలోచనను తెలుసుకోవడం లేదా గ్రహించడం అనే భావం ఉంది. దాని విధానాన్ని వివరించకుండా మానసిక అవగాహనను సహజంగా తెలియజేస్తుంది.
- source_word: διαλογισμὸν
  choice: ఆలోచనను
  rationale: శిష్యుల అంతరంగ తర్కం లేదా విచారణను సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఆలోచన’ సహజంగా ఉండి, సందర్భంలోని మానసిక ప్రక్రియను నిలుపుతుంది.
- source_word: τῆς καρδίας αὐτῶν
  choice: వారి హృదయంలోని
  rationale: గ్రీకులో ‘వారి’ బహువచన సంబంధంతో ‘హృదయం’ ఏకవచనంలో ఉంది. తెలుగు సామూహిక ప్రయోగంలో ‘వారి హృదయంలోని’ ఈ నిర్మాణాన్ని అసహజత లేకుండా నిలుపుతుంది.
- source_word: ἐπιλαβόμενος
  choice: దగ్గరకు తీసుకొని
  rationale: పదానికి పట్టుకోవడం లేదా తీసుకోవడం అనే స్పష్టమైన క్రియాభావం ఉంది. బాలుణ్ణి బలంగా పట్టుకున్నాడనే అవసరం లేని భావాన్ని రాకుండా, తదుపరి తన పక్కన నిలబెట్టిన చర్యతో సహజంగా అనుసంధానిస్తుంది.
- source_word: παιδίον
  choice: ఒక చిన్నబిడ్డను
  rationale: పిల్లవాణ్ణి సూచించే పదం; ‘చిన్నబిడ్డ’ తెలుగు బైబిలు వచనశైలిలో సహజంగా వయస్సు చిన్నదనే భావాన్ని అందిస్తుంది.
- source_word: ἔστησεν
  choice: నిలబెట్టాడు
  rationale: ἵστημι యొక్క కారక అర్థమైన ‘నిలబడేలా చేశాడు’ అనే దృశ్యాన్ని నేరుగా నిలుపుతుంది.
- source_word: παρ’ ἑαυτῷ
  choice: తన పక్కన
  rationale: ఇది యేసు పక్కనే లేదా ఆయన సమీపంలో అని స్పష్టంగా సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన రూపం.
theological_decisions:
- issue: యేసుకు వారి అంతరంగ ఆలోచన తెలియడం
  choice: యేసు వారి హృదయంలోని ఆలోచనను ఎరిగాడని మాత్రమే చెప్పడం
  alternative: ఇది దైవిక సర్వజ్ఞత్వం వల్లనో లేదా మానవీయ సూక్ష్మగ్రహణం వల్లనో అని స్పష్టీకరించడం
  rationale: లూకా ఆ జ్ఞానానికి గల విధానాన్ని ఈ వచనంలో వివరించడు. అందువల్ల అనువాదం ఏ ప్రత్యేక వివరణనూ చేర్చకుండా మూలంలోని తాత్త్విక ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. గ్రీకు ఏకవచన ‘హృదయం’ను సామూహిక తెలుగు ప్రయోగమైన ‘వారి హృదయంలోని’గా నిలిపి, చర్యల క్రమాన్ని స్పష్టంగా ఉంచాం.
