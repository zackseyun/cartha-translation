  text: But he rebuked them and commanded them to tell this to no one,[a]
translation:
  language: te
  text: అయితే ఆయన వారిని గట్టిగా హెచ్చరించి, ఈ విషయం ఎవరికీ చెప్పవద్దని ఆజ్ఞాపించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన వారిని గద్దించి, ఈ విషయం ఎవరికీ చెప్పవద్దని ఆజ్ఞాపించాడు.”
    reason: ἐπιτιμήσας అనే పదానికి ‘గట్టిగా హెచ్చరించడం’ లేదా ‘గద్దించడం’ అనే సందర్భోచిత అర్థాలు ఉండవచ్చు; ప్రత్యామ్నాయం దాని మరింత కఠినమైన శబ్దబలాన్ని చూపుతుంది.
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి పేతురు ఒప్పుకోలుకు యేసు ఇచ్చిన ప్రతిస్పందనలోని స్వల్ప వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో చూపుతుంది.
- source_word: ἐπιτιμήσας
  choice: గట్టిగా హెచ్చరించి
  rationale: ἐπιτιμάω ఇక్కడ కేవలం సాధారణ హెచ్చరికకంటే బలమైన, నియంత్రించే మాటను సూచిస్తుంది. శిష్యులను తప్పు చేసినందుకు గద్దించాడనే భావాన్ని తప్పనిసరిగా మోపకుండా దాని తీవ్రతను నిలుపుతుంది.
- source_word: παρήγγειλεν
  choice: ఆజ్ఞాపించాడు
  rationale: παραγγέλλωలోని అధికారపూర్వక ఆదేశ భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μηδενὶ
  choice: ఎవరికీ ... వద్దని
  rationale: మాట చెప్పబడే వ్యక్తి ఒక్కరూ ఉండకూడదనే సంపూర్ణ నిషేధాన్ని తెలుగులో సహజమైన నిషేధ నిర్మాణంతో తెలియజేస్తుంది.
- source_word: λέγειν
  choice: చెప్పవద్దని
  rationale: వ్యక్తిని సూచించే పరోక్ష కర్మతోను τοῦτο అనే విషయకర్మతోను ఉన్న సందర్భంలో λέγωకు 'చెప్పడం' సహజమైన తెలుగు సమానార్థకం.
- source_word: τοῦτο
  choice: ఈ విషయం
  rationale: సమీప సందర్భంలోని పేతురు ఒప్పుకోలును సూచించే గ్రీకు నిర్దేశక పదాన్ని స్పష్టతతో ఉంచుతుంది; ప్రధాన వాక్యంలో దాని అర్థాన్ని మరీ విపులీకరించదు.
theological_decisions:
- issue: పేతురు ఒప్పుకోలు తర్వాత యేసు విధించిన నిషేధం యొక్క బలం
  choice: ఈ దశలో దానిని ఎవరికీ వెల్లడించకూడదనే బలమైన నిషేధం
  alternative: దాని గురించి చెప్పవద్దనే సాధారణ హెచ్చరిక
  rationale: ἐπιτιμήσας మరియు παρήγγειλεν కలయిక సాధారణ అభ్యర్థనకంటే బలమైన ఆదేశాన్ని సూచిస్తుంది. అయితే ఈ నిషేధానికి వెనుక ఉన్న విస్తృత దైవశాస్త్ర కారణాన్ని అనువాదం స్వయంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా గౌరవప్రదంగా ఉంది. ‘గట్టిగా హెచ్చరించి’ అనే ప్రయోగం మూలంలోని తీవ్రతను నిలుపుతూ, ‘గద్దించి’ వల్ల కలగగల తప్పుచేసిన వారిని మందలించినట్టనే అదనపు భావాన్ని ప్రధాన పాఠ్యంలో నివారిస్తుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో పొందుపరచబడింది.
