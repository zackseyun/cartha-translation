revisions:
- from: కొందరేమో ఏలీయా ప్రత్యక్షమయ్యాడనీ, మరికొందరేమో పూర్వకాలానికి చెందిన ఒక ప్రవక్త లేచాడనీ[a] అన్నారు.
  to: కొందరు ఏలీయా ప్రత్యక్షమయ్యాడని, మరికొందరు పూర్వకాలపు ప్రవక్తలలో ఒకడు లేచాడని అన్నారు.[a]
