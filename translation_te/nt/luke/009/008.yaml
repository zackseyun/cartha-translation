id: LUK.9.8
reference: Luke 9:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑπό τινων δὲ ὅτι Ἠλίας ἐφάνη, ἄλλων δὲ ὅτι προφήτης ⸀τις τῶν ἀρχαίων ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/008.yaml
  text: and by some[a], that Elijah had appeared, and by others, that a prophet of the ancients had risen.
translation:
  language: te
  text: కొందరు ఏలీయా ప్రత్యక్షమయ్యాడని, మరికొందరు పూర్వకాలపు ప్రవక్తలలో ఒకడు లేచాడని అన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పూర్వకాలానికి చెందిన ఒక ప్రవక్త లేచాడు.”
    reason: προφήτης τις τῶν ἀρχαίων అనే పదబంధాన్ని “పూర్వకాలపు ప్రవక్తలలో ఒకడు” అని భాగసూచకంగా అర్థం చేసుకోవడం సహజం; “పూర్వకాలానికి చెందిన ఒక ప్రవక్త” అనే అర్థం కూడా సాధ్యమే.
lexical_decisions:
- source_word: ὑπό τινων ... ἄλλων
  choice: కొందరేమో ... మరికొందరేమో ... అన్నారు
  rationale: గత వచనంలో మొదలైన ప్రజాభిప్రాయాల నివేదికను తెలుగులో సహజంగా కొనసాగించడానికి గ్రీకులోని కర్తృవాచకమైన సంక్షిప్త నిర్మాణాన్ని ప్రత్యక్షంగా చెప్పే నిర్మాణంగా వ్యక్తపరిచింది.
- source_word: δὲ ... δὲ
  choice: కొందరేమో ... మరికొందరేమో
  rationale: ఇవి పరస్పర విరోధాన్ని బలంగా సూచించకుండా, జాబితాలోని వేర్వేరు అభిప్రాయాలను కలుపుతున్నాయి.
- source_word: Ἠλίας
  choice: ఏలీయా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన ప్రవక్త పేరును ఉపయోగించింది.
- source_word: ἐφάνη
  choice: ప్రత్యక్షమయ్యాడు
  rationale: φαίνω యొక్క భావమైన కనిపించడం లేదా ప్రత్యక్షం కావడాన్ని తెలియజేస్తూ, తరువాతి ἀνέστη అనే ‘లేచాడు’ అన్న పదంతో ఉన్న తేడాను నిలుపుతుంది.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: పూర్వకాలానికి చెందిన ఒక ప్రవక్త
  rationale: τις యొక్క అనిర్దిష్ట భావాన్ని ‘ఒక’ అని, τῶν ἀρχαίων యొక్క కాలసంబంధ భావాన్ని ‘పూర్వకాలానికి చెందిన’ అని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; అతడు తప్పనిసరిగా ఒక నిర్దిష్ట గుంపులో ‘ఒకడు’ అని గ్రీకు కంటే ఎక్కువగా నిర్ణయించదు.
- source_word: ἀνέστη
  choice: లేచాడు
  rationale: మరణం నుండి లేవడాన్ని సూచించగల క్రియను అస్పష్టతతో సహా నిలుపుతుంది; గ్రీకులో స్పష్టంగా లేని కర్మణి రూపాన్ని అనువాదంలో చేర్చదు.
theological_decisions:
- issue: పూర్వకాలపు ప్రవక్త గురించి ప్రజల వాదన స్వభావం
  choice: లేచాడు
  alternative: తిరిగి వచ్చాడు / లేపబడ్డాడు
  rationale: ἀνέστη ఇక్కడ మరణం నుండి లేవడాన్ని సహజంగా సూచిస్తుంది. ‘లేచాడు’ ప్రజల వాదనను మాత్రమే నివేదిస్తుంది; దానిని అనువాదకుడు సమర్థిస్తున్నట్టు చేయదు, అలాగే గ్రీకులో లేని కర్మణి భావాన్ని నిర్బంధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. ఇది ముందరి వచనంలో మొదలైన వాక్యానికి కొనసాగింపైనా, తెలుగు పఠనంలో స్పష్టత కోసం ‘అన్నారు’ చేర్చబడింది.
