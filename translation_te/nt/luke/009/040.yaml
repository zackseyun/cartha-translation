reference: Luke 9:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐδεήθην τῶν μαθητῶν σου ἵνα ἐκβάλωσιν αὐτό, καὶ οὐκ ἠδυνήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/040.yaml
  text: And I begged your disciples to cast it out[a], but they were not able.
translation:
  language: te
  text: నేను నీ శిష్యులను దానిని వెళ్లగొట్టమని వేడుకున్నాను[a], కానీ వారు వెళ్లగొట్టలేకపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ సర్వనామం ఆత్మను కాక బాలుణ్ణి సూచిస్తుందని తీసుకుంటే, ‘అతణ్ణి వెళ్లగొట్టమని.’
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδεήθην
  choice: వేడుకున్నాను
  rationale: δέομαι ఇక్కడ సాధారణంగా అడగడం కంటే తీవ్రమైన, వినయపూర్వకమైన అభ్యర్థనను సూచిస్తుంది; ‘వేడుకున్నాను’ తండ్రి ఆత్రుతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μαθητῶν σου
  choice: నీ శిష్యులను
  rationale: μαθητής సువార్తల సందర్భంలో గురువు దగ్గర నేర్చుకొని ఆయనను అనుసరించే ‘శిష్యుడు’ అనే స్థిరమైన భావాన్ని కలిగి ఉంది.
- source_word: ἵνα ἐκβάλωσιν
  choice: వెళ్లగొట్టమని
  rationale: ἵνα + subjunctive అభ్యర్థనలో ఉద్దేశించిన కార్యాన్ని సూచిస్తుంది; ἐκβάλλωకు భూతాన్ని లేదా ఆత్మను బయటికి పంపే సందర్భంలో ‘వెళ్లగొట్టు’ సహజంగా సరిపోతుంది.
- source_word: αὐτό
  choice: దానిని
  rationale: నపుంసకలింగ సర్వనామం సమీప సందర్భంలోని ఆత్మను సూచించే అవకాశమే ఎక్కువ. ‘దానిని’ ఆ సూచనను కాపాడుతుంది; అయితే బాలుణ్ణి సూచించే అవకాశాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: οὐκ ἠδυνήθησαν
  choice: వారు వెళ్లగొట్టలేకపోయారు
  rationale: δύναμαι సామర్థ్యాన్ని సూచిస్తుంది. తెలుగులో కేవలం ‘చేయలేకపోయారు’ అనడం కంటే ఉద్దేశించిన క్రియను పునరుక్తి చేయడం స్పష్టంగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: భూతవిమోచన సందర్భంలో αὐτό దేనిని సూచిస్తుంది?
  choice: ఆత్మను సూచిస్తున్నట్లు ‘దానిని’ అని అనువదించడం.
  alternative: బాలుణ్ణి సూచిస్తున్నట్లు ‘అతణ్ణి’ అని అనువదించడం.
  rationale: ἐκβάλλω సాధారణంగా దయ్యం లేదా అపవిత్రాత్మను వెళ్లగొట్టడాన్ని సూచిస్తుంది; నపుంసకలింగ αὐτό కూడా సందర్భంలోని πνεῦμαతో సహజంగా సరిపోతుంది. అయినప్పటికీ వ్యాకరణపరంగా బాలుణ్ణి సూచించే అవకాశాన్ని పూర్తిగా తొలగించకుండా పాదటిప్పణిలో నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘వేడుకున్నాను’ ద్వారా తండ్రి ఆత్రుతను, ‘వెళ్లగొట్టలేకపోయారు’ ద్వారా శిష్యుల అసమర్థతను స్పష్టంగా తెలిపాం.
