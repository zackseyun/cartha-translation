id: LUK.9.20
reference: Luke 9:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸂Πέτρος δὲ ἀποκριθεὶς⸃ εἶπεν· Τὸν χριστὸν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/020.yaml
  text: And he said to them[a], “But who do you say that I am?” Peter answered, “The Messiah of God.”
translation:
  language: te
  text: ఆయన వారితో, “మరి మీరు నన్ను ఎవరు అంటున్నారు?” అన్నాడు. పేతురు, “దేవుని మెస్సీయ[a]” అని జవాబిచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “దేవుని క్రీస్తు.”'
    reason: χριστός అనే గ్రీకు బిరుదుకు సంప్రదాయ లిప్యంతరీకరణను ప్రత్యామ్నాయంగా చూపిస్తుంది.
lexical_decisions:
- source_word: Ὑμεῖς
  choice: మీరు
  rationale: గ్రీకులో సర్వనామం స్పష్టంగా ఉండి, ముందు చెప్పబడిన ఇతరుల అభిప్రాయాలకు శిష్యుల జవాబును వ్యతిరేకంగా నిలుపుతుంది. తెలుగులో ‘మరి మీరు’ ఈ ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: τίνα με λέγετε εἶναι
  choice: నేను ఎవరినని చెప్తున్నారు?
  rationale: λέγετε + εἶναι పరోక్ష వాక్య నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు ప్రశ్నగా అందిస్తుంది; యేసు గుర్తింపు గురించిన ప్రశ్నను యథాతథంగా ఉంచుతుంది.
- source_word: ἀποκριθεὶς … εἶπεν
  choice: జవాబిచ్చాడు
  rationale: గ్రీకు కృదంతం తరువాత వచ్చే సమాపక క్రియను తెలుగులో ఒక సహజమైన సమాపక క్రియగా వ్యక్తం చేసింది; అర్థనష్టం లేదు.
- source_word: χριστόν
  choice: మెస్సీయ
  rationale: ఇక్కడ ఇది వ్యక్తినామం కాదు, ఇశ్రాయేలు ఆశించిన అభిషిక్త రాజును సూచించే బిరుదు. అందువల్ల బిరుదుగా ‘మెస్సీయ’ అని అనువదించి, సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదటిప్పణిలో ఉంచింది.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: 'గ్రీకు షష్ఠీ సంబంధాన్ని సంక్షిప్తంగా, సహజంగా కాపాడుతుంది: ‘దేవుని మెస్సీయ.’'
- source_word: δέ
  choice: మరి
  rationale: ప్రశ్నలోని δέ ముందుగా చెప్పబడిన ప్రజల అభిప్రాయాలకు శిష్యుల అభిప్రాయాన్ని వ్యత్యాసంగా చూపుతుంది. మొదటి δέను తెలుగులో విడిగా అనువదించకపోవడం సహజ కథన శైలికి అనుగుణం.
theological_decisions:
- issue: పేతురు ఒప్పుకోలులో χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: χριστός ఇక్కడ యేసును ఇశ్రాయేలు మెస్సీయ ఆశతో అనుసంధానించే బిరుదు. దానిని పేరులా కేవలం లిప్యంతరీకరించకుండా బిరుదు భావాన్ని ముందుకు తెచ్చేందుకు ‘మెస్సీయ’ను ప్రధాన పాఠ్యంలో వాడింది; విస్తృతంగా పరిచయమైన ‘క్రీస్తు’ రూపాన్ని పాదటిప్పణిలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. బహువచన ‘మీరు’ మరియు ‘మరి’ ద్వారా గ్రీకు వాక్యంలోని ఉద్ఘాటన, వ్యత్యాసం నిలుపబడ్డాయి.
