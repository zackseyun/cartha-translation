source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸀αὐτῷ· Ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς, σὺ δὲ ἀπελθὼν διάγγελλε τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/060.yaml
  text: But he said to him[a], “Leave the dead to bury their own dead, but you, go and proclaim the kingdom of God.”
translation:
  language: te
  text: 'అయితే ఆయన అతనితో ఇలా అన్నాడు: “చనిపోయినవారు తమ చనిపోయినవారిని పాతిపెట్టనివ్వు[a]. నీవైతే వెళ్లి దేవుని రాజ్యాన్ని ప్రకటించు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మొదటి ‘చనిపోయినవారు’ అన్న మాట ఆధ్యాత్మికంగా స్పందించనివారిని రూపకంగా సూచిస్తుండవచ్చు; రెండవది భౌతికంగా చనిపోయినవారిని సూచిస్తుంది. అయితే గ్రీకులో రెండు చోట్లా ఒకే పదం ఉంది; అందుకే అనువాదం కూడా ఆ ప్రభావాన్ని నిలుపుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄφες
  choice: పాతిపెట్టనివ్వు
  rationale: ἀφίημι యొక్క ఆజ్ఞార్థక బలాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, తరువాతి infinitive θάψαιతో కలిసి ‘చనిపోయినవారు ... పాతిపెట్టనివ్వు’ అని అనువదించబడింది.
- source_word: τοὺς νεκροὺς ... τοὺς ἑαυτῶν νεκρούς
  choice: చనిపోయినవారు ... తమ చనిపోయినవారిని
  rationale: గ్రీకులోని νεκρούς పదపునరుక్తిని నిలిపి, మొదటి ప్రయోగం రూపకాలంకారమా, రెండవది భౌతిక మరణమా అనే ఉద్దేశపూర్వక ఉద్రిక్తతను ప్రధాన పాఠ్యంలో పరిష్కరించకుండా ఉంచుతుంది.
- source_word: θάψαι
  choice: పాతిపెట్ట
  rationale: మృతదేహాన్ని సమాధి చేయడాన్ని తెలిపే సాధారణ, స్పష్టమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: ἑαυτῶν
  choice: తమ
  rationale: ఆత్మవాచక సర్వనామంలోని ‘వారి సొంత’ భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἀπελθὼν
  choice: వెళ్లి
  rationale: ముఖ్య ఆజ్ఞకు ముందు జరిగే క్రియను చూపే aorist participleను, అసహజమైన పదశః నిర్మాణం లేకుండా సహజ తెలుగు క్రమక్రియగా అందిస్తుంది.
- source_word: διάγγελλε
  choice: ప్రకటించు
  rationale: ప్రజల మధ్య విస్తృతంగా తెలియజేయడం అనే భావాన్నీ, వర్తమాన ఆజ్ఞార్థకంలోని కొనసాగింపు బలాన్నీ సందర్భానుకూలంగా వ్యక్తం చేస్తుంది.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: దేవుని రాజ్యాన్ని
  rationale: దేవుని పరిపాలన భావాన్ని కలిగిన స్థిరమైన బైబిలు పదబంధాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘చనిపోయినవారు’ అనే పదం రెండు సార్లు వచ్చినప్పుడు దాని భావం
  choice: రెండు చోట్లా ఒకే ‘చనిపోయిన’ పదాన్ని నిలుపుట
  alternative: “ఆధ్యాత్మికంగా చనిపోయినవారు తమ చనిపోయినవారిని పాతిపెట్టనివ్వు”
  rationale: మొదటి ప్రయోగం ఆధ్యాత్మిక స్పందనలేనివారిని, రెండవది భౌతికంగా మరణించినవారిని సూచించే అవకాశం ఉన్నప్పటికీ, గ్రీకు పాఠ్యం రెండింటికీ ఒకే పదాన్ని వాడుతుంది. అందువల్ల యేసు మాటలోని కఠినమైన విరోధాభాసాన్ని ప్రధాన పాఠ్యంలోనే నిలిపి, వివరణను పాదసూచికకు పరిమితం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను కాపాడే వాక్యనిర్మాణం వాడబడింది. ‘వెళ్లి ... ప్రకటించు’ అనేది గ్రీకు participle–imperative క్రమాన్ని సహజ తెలుగులో అందిస్తుంది. పాదసూచిక గుర్తు సంబంధిత విరోధాభాస వాక్యానంతరం ఉంచబడింది.
