id: LUK.9.28
reference: Luke 9:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ τοὺς λόγους τούτους ὡσεὶ ἡμέραι ὀκτὼ ⸀καὶ παραλαβὼν Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον ἀνέβη εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/028.yaml
  text: About eight days after these sayings[b][a], he took Peter and John and James and went up on the mountain to pray.
translation:
  language: te
  text: ఈ మాటలు చెప్పిన దాదాపు ఎనిమిది రోజుల తర్వాత[a], ఆయన పేతురును, యోహానును, యాకోబును వెంటబెట్టుకొని ప్రార్థించడానికి కొండపైకి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ పలుకుల తర్వాత దాదాపు ఎనిమిది రోజులకు.’ గ్రీకు λόγους ను ‘మాటలు’ లేదా ‘పలుకులు’ అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ప్రత్యేక పదబంధంగా అనువదించలేదు
  rationale: ఇది ఇక్కడ ప్రధానంగా కథన మార్పును సూచించే గ్రీకు ప్రయోగం. తెలుగులో కృత్రిమంగా ‘అప్పుడు ఇలా జరిగింది’ అని చేర్చకుండా, కాలసూచక వాక్యభాగంతో సహజంగా కథనాన్ని కొనసాగించాం.
- source_word: μετὰ τοὺς λόγους τούτους
  choice: ఈ మాటలు చెప్పిన ... తర్వాత
  rationale: λόγους మునుపటి పలుకులను సూచిస్తుంది. ‘ఈ మాటల తర్వాత’ అనే మరింత అక్షరార్థ రూపం సాధ్యమే అయినా, తెలుగులో ఉద్దేశాన్ని స్పష్టంగా, సహజంగా తెలియజేయడానికి ‘ఈ మాటలు చెప్పిన ... తర్వాత’ ఎంచుకున్నాం.
- source_word: ὡσεὶ ἡμέραι ὀκτὼ
  choice: దాదాపు ఎనిమిది రోజుల
  rationale: ὡσεὶ కాలాన్ని సుమారుగా సూచిస్తుంది; అందువల్ల సంఖ్యను ఖచ్చితమైనదిగా చేయకుండా ‘దాదాపు’ అని నిలిపాం.
- source_word: παραλαβὼν
  choice: వెంటబెట్టుకొని
  rationale: ఈ కృదంతం పేతురు, యోహాను, యాకోబులను తనతో తీసుకెళ్లడాన్ని సూచిస్తుంది. ‘వెంటబెట్టుకొని’ ఆధునిక తెలుగులో సహజంగా సహగమన భావాన్ని తెలియజేస్తుంది.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: పేతురును, యోహానును, యాకోబును
  rationale: పేర్లను ప్రామాణిక తెలుగు బైబిలు రూపాల్లో ఇచ్చి, గ్రీకు జాబితా క్రమాన్ని నిలిపాం.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: కొండపైకి వెళ్లాడు
  rationale: ἀνέβη లోని పైకి ఎక్కే కదలికను ‘పైకి’ నిలుపుతుంది. గ్రీకు నిర్దిష్ట ఉపపదం తప్పనిసరిగా ముందే గుర్తించిన ఒక ప్రత్యేక కొండను సూచించనందున సహజ తెలుగులో ‘కొండపైకి’ అన్నాం.
- source_word: προσεύξασθαι
  choice: ప్రార్థించడానికి
  rationale: ఈ అనంతక్రియ ఉద్దేశాన్ని వ్యక్తపరుస్తుంది; ‘ప్రార్థించడానికి’ దాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: సమాంతర సువార్త వృత్తాంతాలతో సంబంధంలో కాలవ్యవధి
  choice: దాదాపు ఎనిమిది రోజులు
  alternative: ఎనిమిది రోజులు
  rationale: లూకా వాడిన ὡσεὶ సుమారు కాలాన్ని స్పష్టంగా సూచిస్తుంది. ఇతర వృత్తాంతాలతో సమన్వయం చేయకుండా మూలంలోని అంచనా భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. పేర్ల జాబితాలో తెలుగు విభక్తులను స్పష్టంగా ఉంచాం; కాలవ్యవధిలోని సుమారు భావాన్ని కాపాడాం.
