id: LUK.9.39
reference: Luke 9:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πνεῦμα λαμβάνει αὐτόν, καὶ ἐξαίφνης κράζει, καὶ σπαράσσει αὐτὸν μετὰ ἀφροῦ καὶ ⸀μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ συντρῖβον αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/039.yaml
  text: and look[a], a spirit seizes him, and suddenly he cries out, and it convulses him with foaming, and it scarcely departs from him, crushing him.
translation:
  language: te
  text: ఇదిగో, ఒక ఆత్మ[a] అతన్ని పట్టుకుంటుంది; అకస్మాత్తుగా అతడు కేక వేస్తాడు. అది అతని నోట నురగ వచ్చేలా చేసి అతన్ని తీవ్రంగా కుదిపేస్తుంది; అతన్ని నలిపివేస్తూ, కష్టంగానే అతని నుండి వెళ్లిపోతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక దుష్టాత్మ’; లేదా, ‘ఒక దెయ్యం.’ ఇక్కడ గ్రీకు మూలంలో కేవలం ‘ఒక ఆత్మ’ అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: తండ్రి వర్ణనలోని ప్రత్యక్షతను, ఉత్కంఠను నిలుపుతూ ఆధునిక తెలుగులో సహజమైన అవధాన సూచకంగా ఉంది.
- source_word: πνεῦμα
  choice: ఒక ఆత్మ
  rationale: మూల గ్రీకు ఇక్కడ ‘అపవిత్ర’ లేదా ‘దయ్యం’ అని ప్రత్యేకంగా చెప్పకుండా πνεῦμα మాత్రమే వాడింది; అందువల్ల అదే అనిర్దిష్టతను నిలిపాం.
- source_word: λαμβάνει
  choice: పట్టుకుంటుంది
  rationale: ఆత్మ బాలుణ్ణి అకస్మాత్తుగా తన ఆధీనంలోకి తీసుకునే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐξαίφνης
  choice: వెంటనే
  rationale: సంఘటన హఠాత్తుగా మొదలయ్యే భావాన్ని సంక్షిప్తంగా తెలుపుతుంది.
- source_word: κράζει
  choice: అతడు కేక వేస్తాడు
  rationale: గ్రీకు క్రియలో బాలుడే అంతర్భావిత కర్త; ‘అది అతనితో కేక వేయిస్తుంది’ అని కారణాన్ని అదనంగా స్పష్టీకరించకుండా వాక్య నిర్మాణాన్ని కాపాడుతుంది.
- source_word: σπαράσσει αὐτὸν μετὰ ἀφροῦ
  choice: అది అతన్ని నురగ కక్కేలా మూర్ఛలతో కొట్టివేస్తుంది
  rationale: శరీరాన్ని తీవ్రంగా కుదిపే ఆకస్మిక మూర్ఛల భావాన్నీ, నురగ రావడాన్నీ సాధారణ పాఠకుడికి స్పష్టంగా అందిస్తుంది.
- source_word: μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ
  choice: అతి కష్టంగా అతని నుండి వెళ్లిపోతుంది
  rationale: ఆత్మ అతన్ని అరుదుగా వదులుతుందా లేక ఎంతో కష్టంతో వదులుతుందా అనే μόγις పదంలోని సందర్భసాధ్య భావాల్లో, ప్రత్యక్ష క్రియతో సహజంగా సరిపోయే ‘అతి కష్టంగా’ను ఎంచుకున్నాం.
- source_word: συντρῖβον αὐτόν
  choice: అతన్ని నలిపివేస్తూ
  rationale: ఆ ఆత్మ కలిగించే తీవ్రమైన హానిని బలంగా వ్యక్తపరుస్తుంది; నిర్దిష్ట గాయాన్ని ఊహించి జోడించదు.
theological_decisions:
- issue: πνεῦμαను ప్రధాన పాఠ్యంలో దయ్యం లేదా అపవిత్రాత్మగా స్పష్టంగా గుర్తించాలా
  choice: ఒక ఆత్మ
  alternative: ఒక దుష్టాత్మ; ఒక దయ్యం
  rationale: విస్తృత సందర్భం శత్రుత్వపూరితమైన అతీంద్రియ శక్తిని సూచించినా, ఈ వచనం πνεῦμα అని మాత్రమే చెబుతుంది. కాబట్టి మూలంలోని పదస్థాయి అనిర్దిష్టతను ప్రధాన పాఠ్యంలో నిలిపి, సందర్భసాధ్య అర్థాలను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకుడికి స్పష్టంగా ఉండే శైలిని వాడాం. గ్రీకు వాక్యంలోని వరుసగా జరిగే తీవ్ర చర్యలను అర్ధవిరామం, చిన్న వాక్యంతో సహజంగా విభజించాం; మూలంలోని వర్తమానకాల జీవంతత్వాన్ని నిలిపాం.
