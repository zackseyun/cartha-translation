id: LUK.9.3
reference: Luke 9:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Μηδὲν αἴρετε εἰς τὴν ὁδόν, μήτε ⸀ῥάβδον μήτε πήραν μήτε ἄρτον μήτε ἀργύριον, μήτε ⸀ἀνὰ δύο χιτῶνας ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/003.yaml
  text: And he said to them[a], “Take nothing for the journey—neither a staff, nor a bag, nor bread, nor money[c][b]; and do not have two tunics each.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “ప్రయాణానికి ఏమీ తీసుకువెళ్లవద్దు—చేతికర్రగానీ, ప్రయాణపు సంచిగానీ, రొట్టెగానీ, డబ్బుగానీ తీసుకోవద్దు; ఒక్కొక్కరు రెండు అంగీలు ఉంచుకోవద్దు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδὲν αἴρετε εἰς τὴν ὁδόν
  choice: ప్రయాణానికి ఏమీ తీసుకువెళ్లవద్దు
  rationale: ప్రయాణ సన్నాహాల సందర్భంలో αἴρω అంటే వెంట తీసుకువెళ్లడం; εἰς τὴν ὁδόν ఉద్దేశాన్ని సూచిస్తూ ‘ప్రయాణానికి’ అని సహజంగా అనువదించబడింది.
- source_word: ῥάβδον
  choice: చేతికర్ర
  rationale: ఈ సందర్భంలో ప్రయాణంలో ఆసరాగా ఉపయోగించే కర్రను సూచిస్తుంది; ఆధునిక తెలుగు పాఠకులకు ‘చేతికర్ర’ స్పష్టంగా ఉంటుంది.
- source_word: πήραν
  choice: ప్రయాణపు సంచి
  rationale: πήρα ప్రయాణంలో సరుకులు లేదా ఆహారం పెట్టుకునే సంచిని సూచిస్తుంది; కేవలం ‘సంచి’ కంటే సందర్భార్థాన్ని స్పష్టపరుస్తుంది.
- source_word: ἄρτον
  choice: రొట్టె
  rationale: మూలంలోని నిర్దిష్ట ఆహార పదార్థాన్ని సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: ἀργύριον
  choice: డబ్బు
  rationale: పదశః ‘వెండి’ అయినప్పటికీ ఈ సందర్భంలో మారక సాధనమైన ధనాన్ని సూచిస్తుంది; ‘డబ్బు’ ప్రయోగార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀνὰ δύο χιτῶνας ἔχειν
  choice: ఒక్కొక్కరు రెండు అంగీలు ఉంచుకోవద్దు
  rationale: ἀνά యొక్క విభజనార్థాన్ని ‘ఒక్కొక్కరు’ స్పష్టంగా తెలియజేస్తుంది; χιτώνకు చారిత్రక వస్త్రార్థాన్ని నిలిపేలా ‘అంగీ’ వాడబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. జాబితాలోని పునరుక్త μήτε నిర్మాణం తెలుగులో ‘గానీ’ మరియు చివర ‘తీసుకోవద్దు’ ద్వారా స్పష్టంగా ప్రతిబింబించబడింది; భావాన్ని మతపరంగా విస్తరించలేదు.
