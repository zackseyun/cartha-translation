id: LUK.9.45
reference: Luke 9:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα τοῦτο, καὶ ἦν παρακεκαλυμμένον ἀπ’ αὐτῶν ἵνα μὴ αἴσθωνται αὐτό, καὶ ἐφοβοῦντο ἐρωτῆσαι αὐτὸν περὶ τοῦ ῥήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/045.yaml
  text: But they did not understand this saying[a], and it was concealed from them so that they might not perceive it[b], and they were afraid to ask him about this saying.
translation:
  language: te
  text: అయితే వారు ఈ మాటను అర్థం చేసుకోలేదు; వారు దానిని గ్రహించకుండా ఉండేలా అది వారికి మరుగుగా ఉంచబడింది[a]; ఈ మాట గురించి ఆయనను అడగడానికి వారు భయపడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో దానిని ఎవరు మరుగుగా ఉంచారో చెప్పబడలేదు.
    reason: నిష్క్రియ నిర్మాణంలోని అనిర్దిష్ట కర్తను, దానికి సంబంధించిన వేదాంతపరమైన సందిగ్ధతను స్పష్టం చేయడం.
lexical_decisions:
- source_word: ἠγνόουν
  choice: అర్థం చేసుకోలేదు
  rationale: సందర్భంలో ఇది సమాచారం తెలియకపోవడం కంటే యేసు చెప్పిన మాట భావాన్ని గ్రహించలేకపోవడాన్ని సూచిస్తుంది.
- source_word: ῥῆμα
  choice: మాట
  rationale: ఇక్కడ ఇది యేసు అప్పుడే పలికిన నిర్దిష్ట వాక్యాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మాట’ సహజంగా ఉండి పలికిన సందేశం అనే భావాన్ని నిలుపుతుంది.
- source_word: ἦν παρακεκαλυμμένον
  choice: మరుగుచేయబడి ఉంది
  rationale: పరిభాషాత్మక పూర్ణ నిష్క్రియ నిర్మాణం ఆ మాట మరుగైన స్థితిలో ఉందని సూచిస్తుంది. నిష్క్రియ రూపాన్ని నిలుపుతూ దాన్ని ఎవరు మరుగుచేశారో అనువాదం నిర్దేశించదు.
- source_word: ἀπ’ αὐτῶν
  choice: వారి నుండి
  rationale: ἀπό యొక్క సహజ భావమైన ‘నుండి’ని నిలుపుతూ, ఆ మాట వారికి అందని విధంగా మరుగై ఉందనే భావాన్ని తెలియజేస్తుంది.
- source_word: ἵνα μὴ αἴσθωνται αὐτό
  choice: అది వారికి గ్రహింపబడకుండా
  rationale: αἰσθάνομαι లోని గ్రహించడం/తెలుసుకోవడం అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; ముందున్న ‘అర్థం చేసుకోలేదు’తో పదబంధ పునరుక్తిని తగ్గిస్తుంది.
- source_word: ἐφοβοῦντο
  choice: భయపడ్డారు
  rationale: వారు అడగడానికి వెనుకాడేలా చేసిన భయాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐρωτῆσαι
  choice: అడగడానికి
  rationale: ఈ సందర్భంలో వివరణ కోరుతూ యేసును ప్రశ్నించడాన్ని సూచించే సహజమైన తెలుగు ప్రయోగం.
theological_decisions:
- issue: మరుగుచేయబడటానికి కర్త ఎవరు?
  choice: ఆ మాట వారి నుండి మరుగుచేయబడి ఉందని నిష్క్రియ రూపంలోనే ఉంచడం
  alternative: దేవుడు దానిని వారికి మరుగుచేశాడని స్పష్టంగా చెప్పడం; లేదా అది వారికి కేవలం అస్పష్టంగా ఉండిపోయిందని చెప్పడం
  rationale: గ్రీకు పాఠం మరుగుచేసిన కర్తను పేర్కొనదు. కాబట్టి దేవుని ప్రత్యక్ష కర్తృత్వాన్ని చేర్చకుండా, అదే సమయంలో సాధారణ అస్పష్టతగా పలుచన చేయకుండా మూలంలోని వేదాంతపరమైన ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. ‘మాట’ను వరుస రెండు సందర్భాల్లో ఉంచి గ్రీకు ῥῆμα పునరావృతిని నిలిపాం. ఉద్దేశార్థక వాక్యభాగాన్ని తెలుగులో సహజమైన ‘గ్రహింపబడకుండా’ అనే నిర్మాణంతో అందించాం.
