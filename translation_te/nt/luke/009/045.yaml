  source_fidelity: 'మొత్తంగా మూలార్థం సరిగానే ఉంది: ῥῆμα యొక్క పునరావృతం, అవగాహన లేకపోవడం, మరుగుపరచబడిన నిష్క్రియ భావం, అడగడానికి భయపడటం అన్నీ నిలిచాయి. అయితే “వారి నుండి మరుగుచేయబడి ఉంది”తో పాటు “అది వారికి గ్రహింపబడకుండా” అనడం తెలుగులో భారంగా, కొంత అస్పష్టంగా ఉంది. ἵνα ఉపవాక్యంలోని ఉద్దేశార్థాన్ని స్పష్టంగా చూపాలి.'
