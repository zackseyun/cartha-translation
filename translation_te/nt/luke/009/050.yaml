id: LUK.9.50
reference: Luke 9:50
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ πρὸς αὐτὸν ⸀ὁ Ἰησοῦς· Μὴ κωλύετε, ὃς γὰρ οὐκ ἔστιν καθ’ ⸂ὑμῶν ὑπὲρ ὑμῶν⸃ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/050.yaml
  text: But Jesus said to him[a], “Do not stop him, for whoever is not against you is for you.”
translation:
  language: te
  text: అయితే యేసు అతనితో, “అతన్ని అడ్డుకోవద్దు[a]. ఎందుకంటే మీకు విరోధంగా లేనివాడు మీ పక్షాన ఉన్నాడు” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతన్ని నిరోధించవద్దు’; లేదా ‘అతన్ని నిషేధించవద్దు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: అయితే ... అని చెప్పాడు
  rationale: δέ ఇక్కడ ముందు చెప్పిన అభ్యంతరానికి యేసు ఇచ్చిన ప్రతిస్పందనను స్వల్ప వ్యత్యాసంతో కలుపుతుంది. ‘అయితే’ ఆ భావాన్ని అతిశయింపకుండా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πρὸς αὐτόν
  choice: అతనితో
  rationale: సర్వనామం వెంటనే ముందు మాట్లాడిన వ్యక్తిని సూచిస్తుంది. మూలంలో పేరుకు బదులు సర్వనామమే ఉన్నందున దానిని అలాగే నిలిపాం.
- source_word: ὁ Ἰησοῦς
  choice: యేసు
  rationale: వ్యక్తినామానికి ప్రామాణిక తెలుగు రూపం.
- source_word: Μὴ κωλύετε
  choice: అతన్ని అడ్డుకోవద్దు
  rationale: κωλύω అంటే అడ్డుకోవడం, నిరోధించడం లేదా నిషేధించడం. ఇక్కడ శిష్యులు ఆ వ్యక్తి చేస్తున్న పనిని ఆపడానికి ప్రయత్నించిన సందర్భంలో ‘అడ్డుకోవద్దు’ స్పష్టంగా, సహజంగా ఉంది. క్రియ బహువచన సంబోధనలో ఉన్నప్పటికీ తెలుగు నిషేధార్థక రూపం సంఖ్యను బహిరంగంగా చూపదు; సందర్భం శిష్యులందరికీ చెప్పిన మాటగా తెలియజేస్తుంది.
- source_word: ὃς γὰρ
  choice: ఎందుకంటే ... లేనివాడు
  rationale: ὃς తక్షణ సందర్భంలోని వ్యక్తిని సూచిస్తూనే సాధారణ సూత్రాన్ని కూడా వ్యక్తం చేస్తుంది. ‘లేనివాడు’ ఆ సాధారణ వ్యాప్తిని సహజంగా నిలుపుతుంది; γάρ కారణాన్ని తెలిపే ‘ఎందుకంటే’గా అనువదించబడింది.
- source_word: οὐκ ἔστιν καθ’ ὑμῶν
  choice: మీకు విరోధంగా లేనివాడు
  rationale: κατά జనిటివ్‌తో ఇక్కడ వ్యతిరేకతను సూచిస్తుంది. ὑμῶν రెండవ పురుష బహువచనాన్ని గౌరవార్థక ఏకవచనంగా అపార్థం కాకుండా సందర్భంలోని శిష్య సమూహానికి వర్తించే ‘మీకు’గా ఉంచాం.
- source_word: ὑπὲρ ὑμῶν
  choice: మీ పక్షాన ఉన్నాడు
  rationale: ὑπέρ ఇక్కడ మద్దతు లేదా అనుకూలతను సూచిస్తుంది. ‘మీ పక్షాన’ అనేది ‘విరోధంగా’ అనే పదబంధంతో ఉన్న వ్యతిరేక సమాంతరతను స్పష్టంగా కాపాడుతుంది.
theological_decisions:
- issue: యేసు చెప్పిన మాట యొక్క పరిధి
  choice: తక్షణ సందర్భంలోని వ్యక్తికే పరిమితం చేయకుండా సాధారణ సూత్రంగా ‘మీకు విరోధంగా లేనివాడు’ అని అనువదించడం.
  alternative: ‘మీకు విరోధంగా లేని ఆ వ్యక్తి మీ పక్షాన ఉన్నాడు’ అని నిర్దిష్ట వ్యక్తికే పరిమితం చేయడం.
  rationale: గ్రీకు సంబంధవాచకం తక్షణ సందర్భంలోని వ్యక్తిని సూచించగలిగినా, విస్తృతమైన సాధారణ సూత్రాన్ని కూడా తెలియజేస్తుంది. తెలుగు ఏకవచన సాధారణ నిర్మాణం ఈ రెండు స్థాయిలను అనవసరంగా సిద్ధాంతీకరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘అడ్డుకోవద్దు’ సాధారణ పాఠకుడికి స్పష్టంగా ఉండగా, ప్రత్యామ్నాయ నిఘంటు భావాలు పాదటిప్పణిలో ఇవ్వబడ్డాయి.
