source:
  edition: SBLGNT
  text: Συγκαλεσάμενος δὲ τοὺς δώδεκα ἔδωκεν αὐτοῖς δύναμιν καὶ ἐξουσίαν ἐπὶ πάντα τὰ δαιμόνια καὶ νόσους θεραπεύειν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/001.yaml
  text: And calling the twelve together[a], he gave them power and authority over all the demons and to heal diseases[b],
translation:
  language: te
  text: ఆ పన్నెండుమందిని ఒకచోటికి పిలిచి[a], ఆయన వారికి దయ్యాలన్నిటిమీద అధికారాన్ని చెలాయించడానికి, రోగాలను స్వస్థపరచడానికి శక్తినీ అధికారాన్నీ ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ పన్నెండుమందిని సమావేశపరచి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Συγκαλεσάμενος
  choice: ఒకచోటికి పిలిచి
  rationale: సυν- ఉపసర్గలోని ‘కలిసి/ఒకచోటికి’ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, ప్రధాన క్రియకు ముందు జరిగిన భాగస్వామ్య క్రియను నిలుపుతుంది.
- source_word: δὲ
  choice: ఆ
  rationale: ఇక్కడ δέ స్వల్ప కథన అనుసంధానకం; తెలుగులో వాక్యప్రవాహాన్ని సహజంగా కొనసాగించేందుకు ‘ఆ పన్నెండుమంది’ అనే నిర్మాణంలో మృదువుగా ప్రతిబింబించబడింది.
- source_word: τοὺς δώδεκα
  choice: ఆ పన్నెండుమందిని
  rationale: మూలంలో ‘శిష్యులు’ లేదా ‘అపొస్తలులు’ లేవు; కాబట్టి వాటిని చేర్చకుండా నిర్దిష్ట సమూహాన్ని సూచించేలా అనువదించబడింది.
- source_word: ἔδωκεν
  choice: ఇచ్చాడు
  rationale: δίδωμι యొక్క సరళమైన, ప్రత్యక్ష తెలుగు సమానార్థకం.
- source_word: δύναμιν
  choice: శక్తి
  rationale: కార్యాన్ని సాధించగల బలం లేదా సామర్థ్యాన్ని సూచిస్తుంది; ἐξουσίαతోని భేదాన్ని నిలుపుతుంది.
- source_word: ἐξουσίαν
  choice: అధికారం
  rationale: అప్పగించబడిన హక్కు లేదా అధికార పరిధిని తెలియజేస్తూ δύναμις నుండి భిన్నమైన భావాన్ని కాపాడుతుంది.
- source_word: ἐπὶ πάντα τὰ δαιμόνια
  choice: దయ్యాలన్నిటిమీద
  rationale: ἐπί + accusative ఇక్కడ వాటిమీద అధికారాన్ని సూచిస్తుంది; πάντα τὰ δαιμόνια యొక్క సమగ్ర బహువచన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: δαιμόνια
  choice: దయ్యాలు
  rationale: ‘అపవిత్రాత్మలు’ అని విస్తరించకుండా మూలపదానికి నేరుగా సరిపడే సాధారణ ఆధునిక తెలుగు పదం.
- source_word: νόσους
  choice: రోగాలు
  rationale: νόσος సూచించే వ్యాధి/అనారోగ్య భావానికి సాధారణమైన, స్పష్టమైన తెలుగు పదం.
- source_word: θεραπεύειν
  choice: స్వస్థపరచే సామర్థ్యం
  rationale: గ్రీకులోని infinitive ను ముందున్న ‘ఇచ్చాడు’తో సహజంగా అనుసంధానించేందుకు నామవాచక నిర్మాణంగా ఇచ్చింది; రోగాలను బాగుచేయడం అనే భావాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: δύναμις మరియు ἐξουσία మధ్య భేదం
  choice: ‘శక్తి’ మరియు ‘అధికారం’గా వేర్వేరుగా అనువదించడం
  alternative: రెండింటినీ ఒకే భావంగా ‘అధికారం’ లేదా ‘సామర్థ్యం’గా కలపడం
  rationale: మూలవాక్యం కార్యసాధక శక్తినీ అప్పగించబడిన అధికారాన్నీ వేరుగా పేర్కొంటుంది; రెండింటినీ నిలుపడం యేసు ఇచ్చిన నియామకంలోని భావసంపూర్ణతను కాపాడుతుంది.
- issue: ‘ఆ పన్నెండుమంది’ ఎవరో వివరణాత్మకంగా పేర్కొనడం
  choice: ‘శిష్యులు’ లేదా ‘అపొస్తలులు’ చేర్చకుండా ‘ఆ పన్నెండుమంది’గా ఉంచడం
  alternative: ‘పన్నెండుమంది శిష్యులు’ లేదా ‘పన్నెండుమంది అపొస్తలులు’
  rationale: ఈ వచనంలోని గ్రీకు పాఠం కేవలం ‘పన్నెండుమంది’ అని మాత్రమే చెబుతుంది; సమీప సందర్భం ఆధారంగా అదనపు బిరుదును చేర్చలేదు.
- issue: రోగాలను స్వస్థపరచడం ‘శక్తి మరియు అధికారం’ రెండింటికీ ఎలా అనుసంధానమవుతుంది
  choice: తెలుగులో సహజత కోసం ‘స్వస్థపరచే సామర్థ్యాన్ని’ సమాంతర కర్మగా వ్యక్తం చేయడం
  alternative: ‘రోగాలను స్వస్థపరచడానికి’ అని నేరుగా infinitive నిర్మాణం ఉంచడం
  rationale: గ్రీకు వాక్యనిర్మాణంలో θεραπεύειν యొక్క ఖచ్చిత అనుసంధానం కొంత సంక్షిప్తంగా ఉంది. తెలుగు వాక్యం దయ్యాలమీద ‘అధికారం’ అని చెప్పి, స్వస్థపరచడానికి ఇచ్చిన సామర్థ్యాన్ని సహజంగా వ్యక్తం చేస్తుంది; దీనివల్ల దయ్యాలమీద అధికారమూ రోగనివారణ సామర్థ్యమూ రెండూ నిలుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘పన్నెండుమంది’ వద్ద మూలంలో లేని గుర్తింపును చేర్చలేదు. ‘శక్తి/అధికారం’ జంటను ఉద్దేశపూర్వకంగా వేరు చేసి నిలిపాం; ‘దయ్యాలు’ నేరుగా δαιμόνιαను ప్రతిబింబిస్తుంది.
