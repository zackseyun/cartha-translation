id: LUK.9.51
reference: Luke 9:51
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας τῆς ἀναλήμψεως αὐτοῦ καὶ αὐτὸς τὸ ⸀πρόσωπον ⸀ἐστήρισεν τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/051.yaml
  text: It happened[a], when the days of his being taken up were being fulfilled[b], that he set his face to go to Jerusalem.
translation:
  language: te
  text: ఆయన పైకి తీసుకోబడే కాలం నెరవేరుతుండగా[a], ఆయన యెరూషలేముకు వెళ్లాలని దృఢంగా నిర్ణయించుకున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన ఆరోహణకు సంబంధించిన కాలం.’ గ్రీకులో అక్షరార్థంగా ‘ఆయన పైకి తీసుకోబడటం’ అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: ఇక్కడ గ్రీకులో అక్షరార్థంగా ‘తన ముఖాన్ని స్థిరపరచుకున్నాడు’ అని ఉంది; ఇది దృఢమైన సంకల్పాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ఇలా జరిగింది
  rationale: కథనంలో కొత్త పరిణామాన్ని సూచించే సూత్రప్రాయ ప్రయోగం. మూలంలో లేని ‘ఇప్పుడు’ అనే కాలసూచక పదాన్ని చేర్చకుండా, సహజమైన ఆధునిక తెలుగు కథనశైలిని వాడింది.
- source_word: ἐν τῷ συμπληροῦσθαι
  choice: నెరవేరుతుండగా
  rationale: ἐν తో కూడిన వర్తమాన articular infinitive కాలసంబంధమైన ‘...ఉండగా/సమయంలో’ భావాన్నీ, పూర్తికి చేరుతున్న ప్రక్రియనూ తెలియజేస్తుంది.
- source_word: τὰς ἡμέρας
  choice: రోజులు
  rationale: లూకా పేర్కొన్న నిర్దిష్ట కాలవ్యవధిని మూలానికి పారదర్శకంగా ఉండేలా బహువచన రూపంలో ఉంచింది.
- source_word: τῆς ἀναλήμψεως αὐτοῦ
  choice: ఆయన పైకి తీసుకోబడే
  rationale: ἀνάλημψις యొక్క ప్రాథమిక భావమైన ‘పైకి తీసుకోబడటం’ను నిలుపుతుంది; దాన్ని కేవలం ఆరోహణకే పరిమితం చేయకుండా మూలంలోని భావవిస్తృతిని కాపాడుతుంది.
- source_word: καὶ αὐτὸς
  choice: ఆయన
  rationale: తెలుగులో సహజమైన సర్వనామాన్ని వాడింది; తదుపరి దృఢనిశ్చయాన్ని తెలిపే పదబంధం సందర్భోచిత ఉద్ఘాటనను అందిస్తుంది.
- source_word: τὸ πρόσωπον ἐστήρισεν
  choice: తన ముఖాన్ని స్థిరపరచుకున్నాడు
  rationale: దృఢంగా సంకల్పించడాన్ని తెలిపే సజీవమైన సెమిటిక్ నుడికారాన్ని, దాని ప్రవచనాత్మక ప్రతిధ్వనిని కోల్పోకుండా సాధ్యమైనంత నేరుగా నిలిపింది.
- source_word: τοῦ πορεύεσθαι
  choice: వెళ్లడానికి
  rationale: ఈ సందర్భంలో ఉద్దేశాన్ని తెలిపే సహజమైన తెలుగు infinitival నిర్మాణం.
- source_word: εἰς Ἰερουσαλήμ
  choice: యెరూషలేముకు
  rationale: పట్టణాన్ని గమ్యస్థానంగా సూచించే εἰς యొక్క సాధారణ దిశార్థాన్ని తెలుపుతుంది.
theological_decisions:
- issue: τῆς ἀναλήμψεως αὐτοῦ యొక్క భావపరిధి
  choice: ఆయన పైకి తీసుకోబడే
  alternative: ఆయన ఆరోహణ
  rationale: గ్రీకు నామవాచకం అక్షరార్థంగా ‘పైకి తీసుకోబడటం’ను సూచిస్తుంది. ఇది యేసు మరణం, పునరుత్థానం, మహిమపరచబడటం వైపు సాగే మొత్తం ఘట్టాన్ని సూచించే అవకాశాన్ని తెరిచి ఉంచుతుంది; ‘ఆరోహణ’ అనే సముచిత సంప్రదాయ అర్థాన్ని పాదసూచికలో ఇచ్చింది.
- issue: τὸ πρόσωπον ἐστήρισεν అనే నుడికారం
  choice: తన ముఖాన్ని స్థిరపరచుకున్నాడు
  alternative: దృఢంగా నిర్ణయించుకున్నాడు
  rationale: యేసు దృఢనిశ్చయాన్ని తెలిపే రూపకాన్ని సరళమైన భావానువాదంగా మార్చకుండా నిలుపుతుంది; పాదసూచిక దాని నుడికారార్థాన్ని వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘పైకి తీసుకోబడే’ అనే రూపం ఉద్దేశపూర్వకంగా విస్తృతార్థాన్ని నిలుపుతుంది. ‘తన ముఖాన్ని స్థిరపరచుకున్నాడు’ కొంత మూలభాషా వాసన కలిగినా, పాదసూచిక సహాయంతో గ్రాహ్యంగా ఉండి మూలంలోని సాహిత్య రూపకాన్ని కాపాడుతుంది.
