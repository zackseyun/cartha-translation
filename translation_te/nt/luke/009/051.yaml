revisions:
- from: 'ఆయన పైకి తీసుకోబడే రోజులు నెరవేరుతుండగా[a], ఇలా జరిగింది: ఆయన యెరూషలేముకు వెళ్లడానికి తన ముఖాన్ని స్థిరపరచుకున్నాడు[b].'
  to: ఆయన పైకి తీసుకోబడే కాలం నెరవేరుతుండగా[a], ఆయన యెరూషలేముకు వెళ్లాలని దృఢంగా నిర్ణయించుకున్నాడు[b].
  rationale: The revision removes a Telugu scope ambiguity while preserving the Greek’s broad reference to Jesus’ being taken up and its processive temporal framing. It renders the source idiom by its natural modern-Telugu sense and supplies the literal expression in a clearly anchored footnote. The initial Greek narrative formula is represented through normal Telugu narrative flow rather than an intrusive formulaic clause.
  reviewer_model: gpt-5.6-terra
