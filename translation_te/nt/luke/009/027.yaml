id: LUK.9.27
reference: Luke 9:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ἀληθῶς, εἰσίν τινες τῶν ⸀αὐτοῦ ⸀ἑστηκότων οἳ οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/027.yaml
  text: But I tell you truly[b][a], there are some standing here who will certainly not taste death until they see the kingdom of God.
translation:
  language: te
  text: 'అయితే నేను మీతో నిజంగా చెబుతున్నాను: ఇక్కడ నిలబడి ఉన్నవారిలో కొందరు దేవుని రాజ్యాన్ని చూసే వరకు మరణాన్ని రుచి చూడనే చూడరు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మరణాన్ని రుచి చూడడం’ అనేది ‘మరణాన్ని అనుభవించడం’ లేదా ‘చనిపోవడం’ అనే అర్థమున్న నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν ἀληθῶς
  choice: అయితే నేను మీతో నిజంగా చెబుతున్నాను
  rationale: δέ యొక్క సంభాషణ మలుపును ‘అయితే’తో, ἀληθῶς యొక్క క్రియావిశేషణ భావాన్ని ‘నిజంగా’తో సహజమైన తెలుగు వాక్యక్రమంలో నిలిపింది.
- source_word: εἰσίν τινες τῶν αὐτοῦ ἑστηκότων
  choice: ఇక్కడ నిలబడి ఉన్నవారిలో కొందరు
  rationale: τινες తో కూడిన భాగస్వామ్య షష్ఠీ నిర్మాణాన్ని తెలుగులో సహజంగా ‘వారిలో కొందరు’గా ఇచ్చింది. αὐτοῦ యొక్క స్థలసూచక భావాన్ని ‘ఇక్కడ’ తెలియజేస్తుంది; ἑστηκότων యొక్క ప్రస్తుత స్థితిని ‘నిలబడి ఉన్న’గా ఉంచింది.
- source_word: οἳ οὐ μὴ γεύσωνται θανάτου
  choice: మరణాన్ని రుచి చూడనే చూడరు
  rationale: ‘మరణాన్ని రుచి చూడడం’ అనే మూల రూపకాన్ని నిలిపి, οὐ μή యొక్క బలమైన నిరాకరణను తెలుగు నొక్కిచెప్పే ‘చూడనే చూడరు’ నిర్మాణంతో వ్యక్తం చేసింది.
- source_word: ἕως ἂν ἴδωσιν
  choice: చూసే వరకు
  rationale: భవిష్యదభిముఖ పరిమితిని తెలుగులో సహజమైన ‘చూసే వరకు’తో తెలిపింది; పూర్తయిన చర్య అని అదనంగా నిర్ధారించలేదు.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: βασιλεία యొక్క రాజ్యం/పాలన అనే విస్తృత భావాన్ని ముందుగానే కుదించకుండా, ప్రామాణికమైన మరియు సాధారణ పాఠకులకు స్పష్టమైన ‘దేవుని రాజ్యం’ను ఎంచుకుంది.
theological_decisions:
- issue: ‘దేవుని రాజ్యాన్ని చూడడం’ దేనిని సూచిస్తుంది?
  choice: మూలంలోని పదబంధాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా యథాతథంగా ఉంచడం
  alternative: రూపాంతరం, పునరుత్థానం/ఆరోహణం, యెరూషలేము నాశనం, లేదా సంఘ విస్తరణలో రాజ్యం ప్రత్యక్షమవడాన్ని ప్రత్యేకంగా సూచించడం
  rationale: సందర్భానికి పలు చారిత్రక-వ్యాఖ్యానాత్మక అన్వయాలు సాధ్యమైనందున, అనువాదం ఒక నిర్దిష్ట అంత్యకాల సిద్ధాంతాన్ని నిర్ణయించకుండా మూలంలోని ఉద్వేగాన్ని నిలుపుతుంది.
- issue: ‘వరకు’ అన్న మాట తరువాత తప్పక మరణించడాన్ని సూచిస్తుందా?
  choice: ἕως ἄν యొక్క కాలపరిమితిని మాత్రమే అనువదించడం
  alternative: రాజ్యాన్ని చూసిన వెంటనే వారు మరణిస్తారని స్పష్టీకరించడం
  rationale: గ్రీకు నిర్మాణం పేర్కొన్న కాలపరిమితి వరకు మరణం జరగదని బలంగా చెబుతుంది; ఆ తరువాత ఏమి జరుగుతుందో ఈ వాక్యం స్వయంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించింది. ‘రుచి చూడనే చూడరు’ మూల రూపకాన్నీ బలమైన నిరాకరణనూ నిలుపుతుంది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోతుంది.
