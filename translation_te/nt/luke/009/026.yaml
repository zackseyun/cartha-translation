revisions:
- from: ఎందుకంటే, నా గురించీ నా మాటల గురించీ సిగ్గుపడేవాడు ఎవడైనా, మనుష్య కుమారుడు తన మహిమలోనూ, తండ్రి మహిమలోనూ, పరిశుద్ధ దూతల మహిమలోనూ వచ్చినప్పుడు అతని గురించి సిగ్గుపడతాడు.
  to: ఎందుకంటే, ఎవరైనా నా గురించీ నా మాటల గురించీ సిగ్గుపడితే, మనుష్య కుమారుడు తన మహిమలోను, తండ్రి మహిమలోను, పరిశుద్ధ దూతల మహిమలోను వచ్చినప్పుడు అతని విషయంలో సిగ్గుపడతాడు.
  rationale: 'The revision makes only safe idiomatic adjustments: it renders the generic indefinite relative with modern standard Telugu ‘ఎవరైనా’ and sharpens the reciprocal reference of τοῦτον. It retains the source’s ambiguity-free core meaning and does not introduce doctrinal interpretation. No footnote is required because the revised wording does not depend on an unresolved textual variant or a meaning not represented in the verse.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:43:00Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the generalizing warning, the reciprocal use of ‘be ashamed,’ the Son of Man title, the future temporal clause, and the glory associated with the Son of Man, the Father, and the holy angels. The Greek masculine singular is representative, so Telugu need not use a masculine-specific generic term.
  naturalness: The sentence is generally fluent and appropriately reverent. Replacing ‘ఎవడైనా’ with the modern, inclusive generic ‘ఎవరైనా’ better reflects ordinary standard Telugu without narrowing the warning’s scope. ‘అతని విషయంలో సిగ్గుపడతాడు’ is a natural Telugu way to retain the reciprocal sense without adding an interpretive term such as ‘deny’ or ‘reject.’
  terminology: ‘మనుష్య కుమారుడు,’ ‘మహిమ,’ and ‘పరిశుద్ధ దూతలు’ are suitable established biblical terminology. Repetition of ‘మహిమలోను’ makes the coordinated genitives clear in Telugu and is compatible with the English audit trail’s permitted construal.
  issues:
  - severity: medium
    issue: ‘ఎవడైనా’ is unnecessarily masculine-specific in modern Telugu.
    rationale: Although ὃς ... ἄν and τοῦτον are grammatically masculine singular, the construction is generic. ‘ఎవరైనా’ preserves the source’s general applicability more naturally in modern standard Telugu, while the following singular reference retains the individualizing force.
  - severity: low
    issue: ‘అతని గురించి సిగ్గుపడతాడు’ is somewhat less direct as the reciprocal counterpart to the first clause.
    rationale: ‘అతని విషయంలో సిగ్గుపడతాడు’ more clearly expresses being ashamed with reference to that person, while avoiding stronger, interpretive renderings such as ‘disown’ or ‘reject.’
  revised_text: ఎందుకంటే, ఎవరైనా నా గురించీ నా మాటల గురించీ సిగ్గుపడితే, మనుష్య కుమారుడు తన మహిమలోను, తండ్రి మహిమలోను, పరిశుద్ధ దూతల మహిమలోను వచ్చినప్పుడు అతని విషయంలో సిగ్గుపడతాడు.
