id: LUK.9.26
reference: Luke 9:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς γὰρ ἂν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους, τοῦτον ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται, ὅταν ἔλθῃ ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/026.yaml
  text: For whoever is ashamed of me and of my words[b][a], the Son of Man will be ashamed of him when he comes in his glory and the glory of the Father and of the holy angels.
translation:
  language: te
  text: ఎందుకంటే, ఎవరైనా నా గురించీ నా మాటల గురించీ సిగ్గుపడితే, మనుష్య కుమారుడు తన మహిమలోను, తండ్రి మహిమలోను, పరిశుద్ధ దూతల మహిమలోను వచ్చినప్పుడు అతని విషయంలో సిగ్గుపడతాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς γὰρ ἂν
  choice: ఎందుకంటే ... ఎవడైనా
  rationale: γάρ యొక్క వివరణాత్మక భావాన్ని ‘ఎందుకంటే’తో, ὃς ... ἄν యొక్క సాధారణ షరతు భావాన్ని ‘ఎవడైనా’తో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους
  choice: నా గురించీ నా మాటల గురించీ సిగ్గుపడేవాడు
  rationale: ἐπαισχύνομαι యొక్క ‘సిగ్గుపడు’ భావాన్ని, με మరియు λόγους అనే రెండు కర్మలతో నిలుపుతుంది; ‘నా మాటలు’ λόγους‌ను వ్యాఖ్యానాత్మకంగా మార్చకుండా అనువదిస్తుంది.
- source_word: τοῦτον
  choice: అతని గురించి
  rationale: ముందున్న సాధారణ ఏకవచన వ్యక్తిని తిరిగి సూచిస్తుంది. తెలుగులో ‘అతని గురించి సిగ్గుపడతాడు’ అనేది క్రియ యొక్క సంబంధార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: బిరుదు యొక్క మూలరూపాన్నీ దానియేలు గ్రంథంతో ఉన్న అంతర్గ్రంథ సంబంధాన్నీ కాపాడే స్థిరమైన తెలుగు రూపం.
- source_word: ἐπαισχυνθήσεται
  choice: సిగ్గుపడతాడు
  rationale: మొదటి ἐπαισχυνθῇతో ఉన్న ఉద్దేశపూర్వక పరస్పర సమాంతరతను అదే క్రియతో నిలుపుతుంది; ‘తిరస్కరిస్తాడు’ వంటి బలమైన వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: ὅταν ἔλθῃ
  choice: వచ్చినప్పుడు
  rationale: ὅταν + aorist subjunctive యొక్క భవిష్యత్ కాలసూచక భావానికి సహజమైన తెలుగు సమానం.
- source_word: ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων
  choice: తన మహిమలోనూ, తండ్రి మహిమలోనూ, పరిశుద్ధ దూతల మహిమలోనూ
  rationale: ఒక్కసారి వచ్చిన δόξῃ భావాన్ని తరువాతి genitive పదబంధాలకు తెలుగులో స్పష్టత కోసం పునరుక్తి చేస్తుంది. కుమారుని, తండ్రి, పరిశుద్ధ దూతల మహిమలతో కూడిన రాక అనే మూలంలోని గంభీరతను నిలుపుతుంది.
- source_word: τῶν ἁγίων ἀγγέλων
  choice: పరిశుద్ధ దూతల
  rationale: ἅγιος‌ను ‘పరిశుద్ధ’, ἄγγελος‌ను ‘దూత’గా నేరుగా, గౌరవప్రదంగా అందిస్తుంది.
theological_decisions:
- issue: సాధారణ పురుష ఏకవచన నిర్మాణం
  choice: సిగ్గుపడేవాడు ఎవడైనా ... అతని గురించి
  alternative: సిగ్గుపడే వ్యక్తి ఎవరైనా ... ఆ వ్యక్తి గురించి
  rationale: గ్రీకు వాక్యంలోని పురుష ఏకవచన రూపాన్ని నిలుపుతూ, హెచ్చరిక సాధారణంగా ఎవరినైనా ఉద్దేశిస్తుందనే భావాన్ని ‘ఎవడైనా’ తెలియజేస్తుంది; ఇది స్త్రీలను పరిధి నుంచి తొలగించదు.
- issue: మనుష్య కుమారుని, తండ్రి, పరిశుద్ధ దూతల మహిమ
  choice: తన మహిమలోనూ, తండ్రి మహిమలోనూ, పరిశుద్ధ దూతల మహిమలోనూ
  alternative: తన మహిమలో, తండ్రి మరియు పరిశుద్ధ దూతల మహిమలో
  rationale: మూలంలోని సమన్వయ నిర్మాణాన్ని స్పష్టంగా ఉంచి, ఈ మహిమల మధ్య సంబంధాన్ని సిద్ధాంతపరంగా మరింత నిర్వచించకుండా దాని క్రీస్తుసంబంధమైన మరియు అంత్యకాల గంభీరతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మనుష్య కుమారుడు’, ‘పరిశుద్ధ దూతలు’, ‘మహిమ’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని నిలిపి, అధిక గ్రాంథికతను నివారించింది.
