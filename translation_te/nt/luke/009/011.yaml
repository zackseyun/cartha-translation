id: LUK.9.11
reference: Luke 9:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι γνόντες ἠκολούθησαν αὐτῷ. καὶ ⸀ἀποδεξάμενος αὐτοὺς ἐλάλει αὐτοῖς περὶ τῆς βασιλείας τοῦ θεοῦ, καὶ τοὺς χρείαν ἔχοντας θεραπείας ἰᾶτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/011.yaml
  text: But the crowds[a], learning of it, followed him. And welcoming them, he was speaking to them about the kingdom of God and healing those who had need of healing.
translation:
  language: te
  text: అయితే జనసమూహాలు ఆ విషయం తెలుసుకొని ఆయనను అనుసరించాయి. ఆయన వారిని సాదరంగా స్వీకరించి, దేవుని రాజ్యం గురించి వారితో మాట్లాడుతూ, స్వస్థత అవసరమైనవారిని[a] స్వస్థపరుస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చికిత్స అవసరమైనవారిని.” గ్రీకు θεραπεία అనే పదానికి “స్వస్థత,” “చికిత్స,” లేదా “సంరక్షణ” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: అయితే జనసమూహాలు
  rationale: δέ ఇక్కడ స్వల్ప వ్యత్యాసంతో కథన మలుపును సూచిస్తుంది; ὄχλοι బహువచనాన్ని ‘జనసమూహాలు’గా నిలిపాం.
- source_word: γνόντες
  choice: ఆ విషయం తెలుసుకొని
  rationale: అయోరిస్ట్ కృదంతం ప్రధాన క్రియకు ముందున్న పరిస్థితిని సూచిస్తుంది. ‘ఆ విషయం’ అనేది యేసు ఎక్కడికి వెళ్లాడో వారు తెలుసుకున్న సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἠκολούθησαν αὐτῷ
  choice: ఆయనను అనుసరించాయి
  rationale: భౌతికంగా వెంట వెళ్లడం అనే కథనార్థాన్ని సహజంగా ఇస్తూ, ἀκολουθέω యొక్క విస్తృత సువార్తార్థాన్ని అతిగా నిర్దేశించదు.
- source_word: ἀποδεξάμενος αὐτούς
  choice: ఆయన వారిని ఆహ్వానించి
  rationale: ἀποδέχομαιలోని అనుకూలంగా స్వీకరించడం, సాదరంగా చేర్చుకోవడం అనే భావాన్ని ‘ఆహ్వానించి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐλάλει αὐτοῖς
  choice: వారికి బోధిస్తూ
  rationale: ἐλάλει అపరిణత భూతకాలంలోని కొనసాగుతున్న క్రియను ‘బోధిస్తూ’ నిలుపుతుంది; సందర్భంలో దేవుని రాజ్యం గురించి మాట్లాడటం బోధనా కార్యంగా ఉంది.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: దేవుని రాజ్యం గురించి
  rationale: ముఖ్యమైన బైబిలు పదబంధాన్ని పారదర్శకంగా, సాంప్రదాయబద్ధంగా నిలుపుతుంది.
- source_word: τοὺς χρείαν ἔχοντας θεραπείας
  choice: స్వస్థత అవసరమైనవారిని
  rationale: θεραπεία ఇక్కడ స్వస్థత లేదా చికిత్స అనే భావాన్ని కలిగి ఉంది; ప్రధాన పాఠ్యంలో సందర్భానికి సహజమైన ‘స్వస్థత’ను ఎంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἰᾶτο
  choice: స్వస్థపరుస్తూ ఉన్నాడు
  rationale: అపరిణత భూతకాల రూపం కొనసాగుతున్న స్వస్థపరిచే కార్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ అనువాదం
  choice: దేవుని రాజ్యం
  alternative: దేవుని పరిపాలన
  rationale: ‘పరిపాలన’ దేవుని క్రియాశీల ఏలుబడిని ముందుకు తెచ్చినా, ‘దేవుని రాజ్యం’ సువార్తలలో స్థిరపడిన కీలక పదబంధాన్ని నిలుపుతూ మూలంలోని భావవిస్తృతిని ముందే కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. గ్రీకు అపరిణత భూతకాల క్రియల కొనసాగుతున్న భావాన్ని ‘బోధిస్తూ,’ ‘స్వస్థపరుస్తూ ఉన్నాడు’ ద్వారా నిలిపాం. పాదసూచిక గుర్తు సంబంధిత వాక్యభాగం చివర ఉంచబడింది.
