  to: శిష్యులైన యాకోబు, యోహాను అది చూసి, “ప్రభువా, ఆకాశం నుండి అగ్ని దిగి వారిని దహించివేయమని మేము ఆజ్ఞాపించాలని మీరు కోరుతున్నారా[a]?” అని అడిగారు.
