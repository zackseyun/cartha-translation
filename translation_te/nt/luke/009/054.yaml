id: LUK.9.54
reference: Luke 9:54
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ Ἰάκωβος καὶ Ἰωάννης εἶπαν· Κύριε, θέλεις εἴπωμεν πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ καὶ ἀναλῶσαι ⸀αὐτούς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/054.yaml
  text: When the disciples James and John saw this[a], they said, “Lord, do you want us to command fire to come down from heaven and consume them?”
translation:
  language: te
  text: శిష్యులైన యాకోబు, యోహాను అది చూసి, “ప్రభువా, ఆకాశం నుండి అగ్ని దిగి వారిని దహించివేయమని మేము ఆజ్ఞాపించాలని మీరు కోరుతున్నారా[a]?” అని అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకు వాక్యం అక్షరార్థంగా, “ఆకాశం నుండి అగ్ని దిగి వారిని దహించివేయమని మేము చెప్పాలని మీరు కోరుతున్నారా?” అని ఉంది. దీన్ని “ఆకాశం నుండి అగ్నిని రప్పించి వారిని నాశనం చేయాలని మేము కోరాలా?” అని కూడా అనువదించవచ్చు.
    reason: εἴπωμεν అనే ‘చెప్పు’ క్రియ యొక్క అక్షరార్థాన్నీ, ἀναλῶσαιకు సాధ్యమైన ‘నాశనం చేయు’ అనే ప్రత్యామ్నాయాన్నీ చూపించడానికి.
lexical_decisions:
- source_word: ἰδόντες
  choice: అది చూసి
  rationale: కర్తరి భూతకాల కృదంతాన్ని సహజమైన తెలుగు కథనశైలిలో క్రియాపూర్వక రూపంగా అనువదించాం. ‘అది’ అనేది ముందటి వచనంలోని సమరయుల తిరస్కారాన్ని సూచించే సందర్భపూరిత పూరణ.
- source_word: οἱ μαθηταὶ Ἰάκωβος καὶ Ἰωάννης
  choice: శిష్యులైన యాకోబు, యోహాను
  rationale: యాకోబు, యోహాను ఎవరో గుర్తించే గ్రీకు సమానాధికార నిర్మాణాన్ని సహజమైన తెలుగులో నిలిపింది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: యేసును నేరుగా సంబోధించే κύριεకు ప్రామాణికమైన, గౌరవపూర్వక తెలుగు రూపం.
- source_word: θέλεις
  choice: మంటావా
  rationale: ఇక్కడ θέλω కోరిక లేదా అనుమతిని అడుగుతోంది. εἴπωμενతో కలిపి ‘మేము ... ఆజ్ఞాపించమంటావా?’ అనే సహజ తెలుగు నిర్మాణం ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: εἴπωμεν
  choice: మేము ఆజ్ఞాపించమంటావా
  rationale: మూల క్రియ అక్షరార్థంగా ‘చెప్పడం’ అయినా, అగ్ని దిగాలని చెప్పడం అనే సందర్భంలో ఆ మాటకు ఆజ్ఞాపన బలం ఉంది. తెలుగులో ‘అగ్నికి చెప్పడం’ అసహజంగా ఉండేందున సందర్భబలాన్ని సహజంగా వ్యక్తం చేశాం; అక్షరార్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ
  choice: ఆకాశం నుండి అగ్ని దిగి
  rationale: మూలంలోని దృశ్యరూపాన్ని, పదసంబంధాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలిపింది.
- source_word: ἀναλῶσαι
  choice: దహించివేయాలని
  rationale: ἀναλίσκωకు ‘మింగివేయు/నాశనం చేయు’ అనే పరిధి ఉన్నప్పటికీ, ఇక్కడ అగ్ని సందర్భం వల్ల ‘దహించివేయు’ స్పష్టంగా, సహజంగా సరిపోతుంది.
- source_word: αὐτούς
  choice: వారిని
  rationale: ముందటి సందర్భంలోని సమరయ గ్రామస్థులను సూచించే బహువచన సర్వనామం.
theological_decisions:
- issue: ‘చూసి’ అనే క్రియకు మూలంలో వ్యక్తంగా లేని కర్మ
  choice: అది చూసి
  alternative: చూసినప్పుడు
  rationale: గ్రీకులో కర్మ వ్యక్తంగా లేకపోయినా, సందర్భం ముందటి వచనంలోని తిరస్కారాన్ని స్పష్టంగా సూచిస్తుంది. ‘అది’ కొత్త భావాన్ని చేర్చకుండా తెలుగు పాఠకుడికి కథన సంబంధాన్ని స్పష్టం చేస్తుంది.
- issue: శిష్యుల ప్రతిపాదనలోని ఆజ్ఞాపన బలం
  choice: ఆజ్ఞాపించమంటావా
  alternative: అగ్ని దిగాలని మేము చెప్పమంటావా
  rationale: εἴπωμεν అక్షరార్థంగా ‘చెప్పుదుమా’ అయినప్పటికీ, అగ్ని దిగేలా పలకడం ఈ సందర్భంలో ఆజ్ఞాపనాత్మకం. సహజ తెలుగుకోసం ‘ఆజ్ఞాపించు’ ఎంచుకున్నాం; మూలంలోని పదప్రయోగాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి సహజమైన ప్రవాహం, యేసుకు గౌరవపూర్వక సంబోధన, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. మూలంలోని భావసాంద్రతను పాదసూచికతో సంరక్షించాం.
