review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly identifies James and John as disciples, retains the contextually supplied object in “అది చూసి,” and accurately represents fire descending from heaven to consume the Samaritan villagers. However, “మేము ఆజ్ఞాపించమంటావా?” is less precise in honorific register and is syntactically ambiguous: it can sound like “are you telling us to command?” rather than explicitly expressing θέλεις, “do you want/wish.”'
  naturalness: The narrative is clear and modern, but the direct address “ప్రభువా” is best paired with respectful second-person wording (“మీరు కోరుతున్నారా?”). The revised construction is smoother and explicitly connects Jesus’ desire with the disciples’ proposed act.
  terminology: “ప్రభువా,” “ఆకాశం,” “అగ్ని,” and “దహించివేయు” are appropriate. “ఆజ్ఞాపించు” is an acceptable contextual rendering of εἴπωμεν here, provided the literal “చెప్పు” is retained in the footnote.
  issues:
  - severity: medium
    issue: The wording “మేము ఆజ్ఞాపించమంటావా?” is syntactically and register-wise imprecise.
    rationale: θέλεις governs the disciples’ proposed action. “మీరు కోరుతున్నారా?” clearly renders this and maintains respectful address to Jesus. The revision also avoids the possible sense that Jesus is commanding them to issue a command.
  revised_text: శిష్యులైన యాకోబు, యోహాను అది చూసి, “ప్రభువా, ఆకాశం నుండి అగ్ని దిగి వారిని దహించివేయమని మేము ఆజ్ఞాపించాలని మీరు కోరుతున్నారా[a]?” అని అడిగారు.
