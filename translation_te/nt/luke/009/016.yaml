- from: అప్పుడు ఆయన ఆ ఐదు రొట్టెలను, రెండు చేపలను తీసుకొని, ఆకాశం వైపు చూసి, వాటిని ఆశీర్వదించి[a], విరిచి, జనసమూహం ముందు పెట్టడానికి శిష్యులకు ఇస్తూ వచ్చాడు.
