id: LUK.9.16
reference: Luke 9:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λαβὼν δὲ τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν αὐτοὺς καὶ κατέκλασεν καὶ ἐδίδου τοῖς μαθηταῖς ⸀παραθεῖναι τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/016.yaml
  text: Then[a], taking the five loaves and the two fish, and looking up to heaven, he blessed them and broke them and kept giving them to the disciples to set before the crowd.
translation:
  language: te
  text: అప్పుడు ఆయన ఆ ఐదు రొట్టెలను, రెండు చేపలను తీసుకొని, ఆకాశంవైపు కళ్లెత్తి చూసి, వాటిని ఆశీర్వదించి[a], విరిచి, జనసమూహం ముందు పెట్టడానికి శిష్యులకు ఇస్తూనే ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటి కొరకు దేవునికి కృతజ్ఞతలు తెలిపి.” ఇక్కడి గ్రీకు క్రియ అక్షరార్థంగా “ఆశీర్వదించాడు”; కొన్ని సమాంతర వృత్తాంతాల్లో “కృతజ్ఞతలు తెలిపాడు” అనే క్రియ ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: తీసుకొని
  rationale: ప్రధాన క్రియలకు ముందున్న చర్యను సహజమైన తెలుగు క్రియాసముచ్చయంతో తెలియజేస్తుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి చర్యకు మార్పును సహజంగా సూచిస్తుంది.
- source_word: ἄρτους
  choice: రొట్టెలను
  rationale: ఈ ఆహార సందర్భంలో విడివిడిగా ఉన్న రొట్టెలను సూచించే బహువచన రూపం.
- source_word: ἰχθύας
  choice: చేపలను
  rationale: మూలంలోని బహువచనాన్ని నేరుగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: ఆకాశం వైపు చూసి
  rationale: పైకి చూపు నిలిపిన చర్యను సహజ తెలుగులో వ్యక్తం చేస్తుంది; ప్రార్థనా సందర్భంలో ఆకాశం దేవుని నివాస దిశను సూచించగలదు.
- source_word: εὐλόγησεν αὐτοὺς
  choice: వాటిని ఆశీర్వదించి
  rationale: εὐλογέω అనే క్రియను దాని ప్రత్యక్ష అర్థంలో ఉంచి, పురుషలింగ బహువచన సర్వనామం సూచించే రొట్టెలు మరియు చేపలు రెండింటినీ ‘వాటిని’ అని పొందుపరుస్తుంది.
- source_word: κατέκλασεν
  choice: విరిచి
  rationale: పంచిపెట్టేందుకు ఆ ఆహారాన్ని ముక్కలుగా విరిచిన చర్యను సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἐδίδου
  choice: ఇస్తూ వచ్చాడు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న లేదా పునరావృత పంపిణీ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τοῖς μαθηταῖς
  choice: శిష్యులకు
  rationale: గ్రీకు నిర్దిష్ట పదాన్ని తెలుగు సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది; ‘తన’ అనే మూలంలో లేని స్వామ్యపదాన్ని జోడించదు.
- source_word: παραθεῖναι
  choice: ముందు పెట్టడానికి
  rationale: శిష్యులకు ఇవ్వడంలోని ఉద్దేశాన్ని, జనసమూహం ముందు ఆహారం ఉంచే నిర్దిష్ట చర్యగా నిలుపుతుంది.
- source_word: τῷ ὄχλῳ
  choice: జనసమూహం
  rationale: ὄχλος అనే పదంలోని గుంపు భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: οὐρανός పదానికి ప్రార్థనా సందర్భంలో అర్థం
  choice: ఆకాశం
  alternative: పరలోకం
  rationale: తెలుగులో పైకి చూడగల దిశను ‘ఆకాశం’ సహజంగా తెలియజేస్తుంది; ఈ ప్రార్థనా సందర్భం దానికి దేవునివైపు చూడటం అనే భావాన్ని ఇస్తుంది. ‘పరలోకం’ అని అనువదిస్తే కనిపించే ఆకాశాన్ని మించి ఒక నిర్దిష్ట లోకార్థాన్ని బలపరిచే అవకాశం ఉంది.
- issue: εὐλόγησεν పదం అనువాదం
  choice: ఆశీర్వదించి
  alternative: కృతజ్ఞతలు చెప్పి
  rationale: మూలంలో εὐλογέω ఉంది, εὐχαριστέω కాదు. సమాంతర వృత్తాంతాలతో సమన్వయం చేయడానికి మూలక్రియను మార్చకుండా దాని ప్రత్యేకతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే కథన శైలి. కొనసాగుతున్న పంపిణీ భావం కోసం ‘ఇస్తూ వచ్చాడు’ వాడబడింది. మూలంలోని క్రియావిశేషణ చర్యల క్రమాన్ని తెలుగు క్రియాసముచ్చయాలతో సహజంగా నిలుపుకున్నాం.
