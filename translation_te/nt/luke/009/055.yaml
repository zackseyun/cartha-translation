  text: కానీ ఆయన వారి వైపు తిరిగి వారిని మందలించాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'తరువాతి కొన్ని ప్రతులు ఇలా చేర్చాయి: “అప్పుడు ఆయన ఇలా అన్నాడు: ‘మీరు ఎలాంటి ఆత్మకు చెందినవారో మీకు తెలియదు; ఎందుకంటే మనుష్యకుమారుడు మనుష్యుల ప్రాణాలను నాశనం చేయడానికి కాదు, రక్షించడానికి వచ్చాడు.’”'
    reason: textual_variant
lexical_decisions:
- source_word: στραφεὶς
  choice: వెనుదిరిగి
  rationale: ఇది στρέφω అనే క్రియ యొక్క భూతకాల క్రియావిశేషణ రూపం; శిష్యులవైపు తిరిగిన చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వచనంలో శిష్యులు చేసిన ప్రతిపాదనకు యేసు స్పందనలోని స్వల్ప వ్యతిరేకతను, కథన కొనసాగింపును తెలియజేస్తుంది.
- source_word: ἐπετίμησεν
  choice: గద్దించాడు
  rationale: ἐπιτιμάω ఇక్కడ గట్టిగా మందలించడం లేదా తప్పును ఎత్తిచూపి ఖండించడం అనే భావాన్ని ఇస్తుంది; ‘గద్దించాడు’ ఆ తీవ్రతను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: αὐτοῖς
  choice: వారిని
  rationale: ఈ బహువచన సర్వనామం సందర్భంలో యాకోబు, యోహాను లేదా అక్కడ ఉద్దేశించబడిన శిష్యులను సూచిస్తుంది; తెలుగు వాడుకలో ‘గద్దించాడు’ అనే క్రియతో కర్మరూపం సహజం.
theological_decisions:
- issue: తరువాతి కొన్ని ప్రతుల్లో కనిపించే దీర్ఘ పాఠాంతరం
  choice: 'SBLGNTలోని సంక్షిప్త పాఠాన్ని మాత్రమే ప్రధాన వచనంలో అనువదించడం: ‘అయితే ఆయన వెనుదిరిగి వారిని గద్దించాడు.’'
  alternative: ‘అయితే ఆయన వెనుదిరిగి వారిని గద్దించి, “మీరు ఎలాంటి ఆత్మకు చెందినవారో మీకు తెలియదు; ఎందుకంటే మనుష్య కుమారుడు మనుష్యుల ప్రాణాలను నాశనం చేయడానికి రాలేదు, రక్షించడానికి వచ్చాడు” అని అన్నాడు.’
  rationale: ఇచ్చిన మూల గ్రీకు పాఠంలో సంక్షిప్త పఠనం మాత్రమే ఉంది. పరిచితమైన దీర్ఘ పాఠాంతరాన్ని ప్రధాన వచనంలో చేర్చకుండా, దాని ప్రాముఖ్యత కారణంగా పాదసూచికలో ఉంచడం మూలపాఠ ప్రాధాన్యాన్ని, పాఠభేద సాక్ష్యాన్ని రెండింటినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘వెనుదిరిగి’ భౌతికంగా తిరిగిన చర్యను, ‘గద్దించాడు’ గట్టి మాటతో సరిదిద్దిన భావాన్ని స్పష్టంగా తెలియజేస్తాయి.
