id: LUK.9.22
reference: Luke 9:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰπὼν ὅτι Δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/022.yaml
  text: saying[a], “It is necessary for the Son of Man to suffer many things and to be rejected by the elders, chief priests, and scribes, and to be killed[b], and on the third day to be raised.”
translation:
  language: te
  text: 'ఆయన ఇలా అన్నాడు[a]: “మనుష్యకుమారుడు ఎన్నో బాధలు అనుభవించడం, పెద్దలు, ముఖ్య యాజకులు, శాస్త్రుల చేత తిరస్కరించబడడం, చంపబడడం, మూడవ రోజున లేపబడడం[b] తప్పనిసరి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ఇలా చెబుతూ.”
    reason: గ్రీకులో εἰπών కృదంత రూపంలో ఉండి, మునుపటి వాక్యంతో ఈ మాటలను అనుసంధానిస్తుంది.
  - marker: b
    text: 'గ్రీకులో నిష్క్రియ రూపం: “లేపబడడం”; “లేవడం” అని కూడా అనువదించవచ్చు.'
    reason: పునరుత్థాన క్రియలోని నిష్క్రియ రూపాన్ని, దానిలో అంతర్లీనంగా ఉన్నప్పటికీ స్పష్టంగా చెప్పని దైవకార్య సూచనను తెలియజేయడం.
lexical_decisions:
- source_word: εἰπὼν
  choice: ఆయన ఇలా అన్నాడు
  rationale: గ్రీకు భూతకాల కృదంతం మునుపటి కథనంతో అనుసంధానమై యేసు మాటలను పరిచయం చేస్తుంది. తెలుగులో సహజమైన సంపూర్ణ వాక్యంగా ఇచ్చినా, ‘ఇలా’ ద్వారా తరువాతి ప్రత్యక్ష వాక్యంతో దాని సంబంధం నిలుస్తుంది.
- source_word: Δεῖ
  choice: తప్పనిసరి
  rationale: ఇది కేవలం అనుకూలతను కాక, దేవుని సంకల్పంలో ఉన్న అవసరతను సూచిస్తుంది. వాక్యాంతంలో ‘తప్పనిసరి’ ఉంచడం తెలుగు వాక్యనిర్మాణానికి సహజంగా ఉండి, గ్రీకులోని నిరపేక్ష అవసరతను కాపాడుతుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: సువార్తల్లోని స్థిరమైన స్వీయ బిరుదును, దాని దానియేలు గ్రంథ సంబంధ ప్రతిధ్వనులను కాపాడే సుపరిచిత రూపం.
- source_word: πολλὰ παθεῖν
  choice: ఎన్నో బాధలు అనుభవించడం
  rationale: πολλά సూచించే విస్తృతమైన అనేక కష్టాలను స్పష్టంగా తెలియజేస్తూ, ఆధునిక తెలుగులో సహజంగా వినిపిస్తుంది.
- source_word: ἀποδοκιμασθῆναι
  choice: తిరస్కరించబడడం
  rationale: పరిశీలించి అంగీకరించకపోవడం లేదా అధికారికంగా నిరాకరించడం అనే నిష్క్రియ భావాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: పెద్దలు, ముఖ్య యాజకులు, శాస్త్రుల చేత
  rationale: నిష్క్రియ క్రియతో ἀπό కార్యనిర్వాహకులను సూచిస్తుంది. ‘చేత’ ఆ నాయక వర్గాలే తిరస్కరించేవారని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: πρεσβυτέρων
  choice: పెద్దలు
  rationale: యూదుల సమాజంలో గుర్తింపు పొందిన నాయక వర్గాన్ని సూచించే సంప్రదాయబద్ధమైన, అర్థమయ్యే పదం.
- source_word: ἀρχιερέων
  choice: ముఖ్య యాజకులు
  rationale: ఇక్కడ బహువచనం ఒకే ప్రధాన యాజకుని పదవిని కాక, ప్రధాన యాజక వర్గాన్ని సూచిస్తుంది.
- source_word: γραμματέων
  choice: శాస్త్రులు
  rationale: సువార్తల్లో కనిపించే గుర్తించదగిన యూదు నాయక వర్గానికి నేరుగా సరిపడే పదం; ‘ధర్మశాస్త్ర బోధకులు’ కంటే తక్కువ వ్యాఖ్యానాత్మకం.
- source_word: ἀποκτανθῆναι
  choice: చంపబడడం
  rationale: నిష్క్రియ క్రియారూపాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది; అవసరం లేని న్యాయపరమైన భావాన్ని జోడించదు.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: మూడవ రోజున
  rationale: కాలాన్ని సూచించే గ్రీకు దత్తివుకు సహజమైన తెలుగు సమానం; పునరుత్థాన సూత్రవాక్యంలోని పరిచిత రూపాన్ని కాపాడుతుంది.
- source_word: ἐγερθῆναι
  choice: లేపబడడం
  rationale: గ్రీకు నిష్క్రియ క్రియారూపాన్ని కాపాడుతుంది. కార్యనిర్వాహకుడిగా దేవుని పేరు వాక్యంలో స్పష్టంగా చేర్చకుండా, దైవకార్య సూచనను నిలుపుతుంది.
theological_decisions:
- issue: పునరుత్థాన క్రియ యొక్క నిష్క్రియ రూపం
  choice: లేపబడడం
  alternative: లేవడం; పునరుత్థానం చెందడం
  rationale: ἐγερθῆναι నిష్క్రియ అనంతక్రియ. ‘లేపబడడం’ మూలరూపాన్ని, దేవుని కార్యమనే అంతర్లీన సూచనను కాపాడుతుంది; అయితే వాక్యంలో లేని కార్యనిర్వాహకుడిని స్పష్టంగా చేర్చదు.
- issue: Δεῖ యొక్క అవసరత భావం
  choice: తప్పనిసరి
  alternative: మనుష్య కుమారుడు తప్పక … చేయాలి
  rationale: గ్రీకు నిరపేక్ష నిర్మాణాన్ని వీలైనంతగా నిలుపుతూ, బాధ, తిరస్కారం, మరణం, లేపబడడం దేవుని విమోచన ప్రణాళికలో అవసరమైనవని సూచిస్తుంది; ఆ అవసరత ఎలా పనిచేస్తుందో అదనంగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన శైలి. నాయక వర్గాల పేర్లకు సువార్తలలో పరిచితమైన ‘పెద్దలు, ముఖ్య యాజకులు, శాస్త్రులు’ వాడబడ్డాయి. వరుసగా ఉన్న గ్రీకు నిష్క్రియ అనంతక్రియలను తెలుగులో ‘-బడడం’ నిర్మాణాలతో సాధ్యమైనంతవరకు నిలుపుతూ, వాక్యాంతంలోని ‘తప్పనిసరి’తో అన్నిటినీ అనుసంధానించాం.
