- from: 'ఆయన ఇలా అన్నాడు[a]: “మనుష్య కుమారుడు ఎన్నో బాధలు అనుభవించడం, పెద్దలు, ముఖ్య యాజకులు, శాస్త్రుల చేత తిరస్కరించబడడం, చంపబడడం, మూడవ రోజున లేపబడడం[b] తప్పనిసరి.”'
  to: 'ఆయన ఇలా అన్నాడు[a]: “మనుష్యకుమారుడు ఎన్నో బాధలు అనుభవించడం, పెద్దలు, ముఖ్య యాజకులు, శాస్త్రుల చేత తిరస్కరించబడడం, చంపబడడం, మూడవ రోజున లేపబడడం[b] తప్పనిసరి.”'
  rationale: స్థిరమైన సువార్త బిరుదును ఆధునిక తెలుగు వాడుకలో సహజంగా, గుర్తించదగినట్లుగా చేయడానికి మాత్రమే «మనుష్య కుమారుడు»ను «మనుష్యకుమారుడు»గా మార్చాం. మిగిలిన పదప్రయోగాలు మూల గ్రీకు అర్థం, క్రియల నిష్క్రియత, మరియు వాక్యంలోని అనిశ్చితిని సరిగా నిలుపుతున్నాయి.
