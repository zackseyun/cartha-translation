review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the sequence of infinitives, the leadership groups, the temporal phrase, and especially the passive force of ἐγερθῆναι. However, «మనుష్య కుమారుడు» is less suitable as the established Gospel title in modern Telugu than the conventional compound «మనుష్యకుమారుడు».
  naturalness: The nominalized construction is understandable and broadly natural. «మనుష్యకుమారుడు» is more idiomatic and recognizable in Telugu Scripture usage. The revised wording retains the draft's clear, modern syntax.
  terminology: Use «మనుష్యకుమారుడు» for ὁ υἱὸς τοῦ ἀνθρώπου. «పెద్దలు, ముఖ్య యాజకులు, శాస్త్రులు» suitably preserves the three institutional groups. «లేపబడడం» appropriately maintains the passive voice without supplying an agent.
  issues:
  - severity: low
    issue: The title is spaced as «మనుష్య కుమారుడు».
    rationale: For the fixed Gospel self-designation ὁ υἱὸς τοῦ ἀνθρώπου, «మనుష్యకుమారుడు» is the more established and immediately recognizable modern Telugu form. The spacing can also invite a merely descriptive reading ('a human son') rather than retaining the title-like expression.
  revised_text: 'ఆయన ఇలా అన్నాడు[a]: “మనుష్యకుమారుడు ఎన్నో బాధలు అనుభవించడం, పెద్దలు, ముఖ్య యాజకులు, శాస్త్రుల చేత తిరస్కరించబడడం, చంపబడడం, మూడవ రోజున లేపబడడం[b] తప్పనిసరి.”'
