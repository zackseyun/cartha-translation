- from: మరొకడు కూడా, “ప్రభువా, నేను నిన్ను అనుసరిస్తాను. అయితే ముందుగా నా ఇంటివారి దగ్గర సెలవు తీసుకోవడానికి నాకు అనుమతి ఇవ్వు” అని అన్నాడు.
  to: మరొకడు కూడా, “ప్రభువా, నేను నిన్ను అనుసరిస్తాను. అయితే ముందుగా నా ఇంటివారికి వీడ్కోలు చెప్పడానికి నాకు అనుమతి ఇవ్వు” అని అన్నాడు.
