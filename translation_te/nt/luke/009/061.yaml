id: LUK.9.61
reference: Luke 9:61
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ καὶ ἕτερος· Ἀκολουθήσω σοι, κύριε· πρῶτον δὲ ἐπίτρεψόν μοι ἀποτάξασθαι τοῖς εἰς τὸν οἶκόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/061.yaml
  text: And another also said[a], “I will follow you, Lord[c][b], but first permit me to say farewell to those in my house.”
translation:
  language: te
  text: మరొకడు కూడా, “ప్రభువా, నేను నిన్ను అనుసరిస్తాను. అయితే ముందుగా నా ఇంటివారికి వీడ్కోలు చెప్పడానికి నాకు అనుమతి ఇవ్వు” అని అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερος
  choice: మరొకడు
  rationale: మునుపటి వ్యక్తులకు భిన్నంగా ఇంకొక వ్యక్తిని పరిచయం చేస్తుంది; సందర్భంలో సహజమైన సంక్షిప్త రూపం.
- source_word: Ἀκολουθήσω σοι
  choice: నేను నిన్ను అనుసరిస్తాను
  rationale: భవిష్యత్ సూచక క్రియ మాట్లాడుతున్న వ్యక్తి ఉద్దేశాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: κύριε
  choice: ప్రభువా
  rationale: యేసును నేరుగా సంబోధిస్తున్న గౌరవార్థకతను, అలాగే ఉండగల లోతైన ధార్మిక భావాన్ని ముందుగానే ఒక వైపుకు పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: πρῶτον
  choice: ముందుగా
  rationale: మొదట చేయదలచిన పనికి ప్రాధాన్యక్రమాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐπίτρεψόν μοι
  choice: నాకు అనుమతి ఇవ్వు
  rationale: అనుమతిని కోరే ఆజ్ఞార్థక రూపాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀποτάξασθαι
  choice: సెలవు తీసుకోవడానికి
  rationale: ఇక్కడ మధ్యమ రూపంలోని క్రియ ఎవరి దగ్గరనైనా వీడ్కోలు తీసుకోవడం అనే అర్థాన్ని ఇస్తుంది; తెలుగు వాడుకలో ఇది సహజమైనది.
- source_word: τοῖς εἰς τὸν οἶκόν μου
  choice: నా ఇంటివారి దగ్గర
  rationale: పదబద్ధంగా అసాధారణమైన ‘నా ఇంటిలోనికి ఉన్నవారు’ అనే నిర్మాణాన్ని అనుకరించకుండా, తన ఇంటికి చెందిన లేదా అక్కడ ఉన్న ప్రజలను సూచించే భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: δὲ καὶ
  choice: కూడా … అయితే
  rationale: καί యొక్క చేర్పు భావాన్ని ‘కూడా’తో, వాక్యంలోని δέ యొక్క వ్యత్యాస/మార్పు భావాన్ని ‘అయితే’తో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యేసును ఉద్దేశించిన κύριε అనువాదం
  choice: ప్రభువా
  alternative: అయ్యా / బోధకుడా
  rationale: ఈ సంబోధన కేవలం మర్యాదను మాత్రమే సూచిస్తుందా లేక మరింత ధార్మిక గుర్తింపును మోస్తుందా అన్న విస్తృతిని మూలపాఠం తెరిచి ఉంచుతుంది. ‘ప్రభువా’ ఆ ఉద్వేగాన్ని తగ్గించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే వచనానికి తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. మూలంలోని భావాన్ని సహజంగానే స్పష్టంగా అందించినందున పాదటిప్పణులు అవసరం కాలేదు.
