source:
  edition: SBLGNT
  text: Εἰσῆλθεν δὲ διαλογισμὸς ἐν αὐτοῖς, τὸ τίς ἂν εἴη μείζων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/046.yaml
  text: Then a dispute arose among them as to which of them might be the greatest[a].
translation:
  language: te
  text: అప్పుడు తమలో ఎవరు గొప్పవాడై ఉంటాడనే వాదన వారి మధ్య తలెత్తింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారిలో ఒక ఆలోచన లేదా చర్చ తలెత్తింది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσῆλθεν
  choice: తలెత్తింది
  rationale: అక్షరార్థంగా ‘ప్రవేశించింది’ అయినా, διαλογισμόςతో కలిసి ఒక ఆలోచన, చర్చ లేదా వాదన ఉద్భవించిందనే భావాన్ని తెలుగులో సహజంగా ‘తలెత్తింది’ తెలియజేస్తుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇది కథనాన్ని ముందుకు నడిపించే మృదువైన అనుసంధాన పదం; ఆధునిక తెలుగులో ‘అప్పుడు’ సందర్భ ప్రవాహాన్ని సహజంగా సూచిస్తుంది.
- source_word: διαλογισμὸς
  choice: వాదన
  rationale: ఈ పదానికి అంతరంగ ఆలోచన, తర్కం, చర్చ అనే అర్థాలు ఉండవచ్చు. ఎవరు గొప్పవారనే పోటీభావం గల సందర్భంలో ‘వాదన’ ప్రధాన పాఠానికి తగినది; అసలు పదంలోని ఇతర సాధ్యార్థాలను పాదసూచికలో నిలిపాం.
- source_word: ἐν αὐτοῖς
  choice: వారి మధ్య
  rationale: అక్షరార్థంగా ‘వారిలో’ అని ఉన్నా, సమూహంలో జరిగిన వాదనను తెలుగులో ‘వారి మధ్య’ అని చెప్పడం సహజం. అయితే అంతరంగ ఆలోచన అనే సాధ్యతను పాదసూచిక పూర్తిగా మూసివేయదు.
- source_word: τὸ τίς ἂν εἴη
  choice: ఎవరు ... అనే
  rationale: గ్రీకు నిర్మాణం వాదన యొక్క విషయాన్ని తెలిపే పరోక్ష ప్రశ్న. ἄνతో కూడిన optativeలోని సంభావ్యతను తెలుగులో బలవంతంగా ‘అయి ఉండవచ్చు’ అని పెంచకుండా, సహజమైన పరోక్ష ప్రశ్న నిర్మాణంలో ఉంచాం.
- source_word: μείζων
  choice: గొప్పవారు
  rationale: గ్రీకులో తులనాత్మక రూపం ‘ఎక్కువ గొప్పవాడు’ అనే అక్షరార్థం కలిగినా, నిర్దిష్ట సమూహంలో అత్యున్నత స్థానం గురించిన ప్రశ్నను తెలుగులో ‘ఎవరు గొప్పవారు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτῶν
  choice: తమలో
  rationale: పోలిక జరుగుతున్న సమూహం వారేనని ఈ సంబంధవాచకం సూచిస్తుంది; కర్తలనే తిరిగి సూచించడానికి ‘తమలో’ స్పష్టంగా, సహజంగా ఉంది.
theological_decisions:
- issue: శిష్యుల మధ్య జరిగిన దాని స్వభావం
  choice: వాదన
  alternative: ఆలోచన లేదా చర్చ
  rationale: ఎవరు గొప్పవారనే పోటీభావం సందర్భంలో పరస్పర విభేదాన్ని ‘వాదన’ బాగా తెలియజేస్తుంది. అయినప్పటికీ διαλογισμός అంతరంగ ఆలోచనను లేదా సాధారణ చర్చను కూడా సూచించగలదు కాబట్టి ఆ అస్పష్టతను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘ప్రవేశించింది’ అనే కృత్రిమ అక్షరానువాదానికి బదులు ‘తలెత్తింది’ అని సహజీకరించాం; మూలంలోని అర్థపరిధిని పాదసూచికలో నిలిపాం.
