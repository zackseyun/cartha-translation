  source_fidelity: ప్రధాన అనువాదం διαλογισμόςను సందర్భానుకూలంగా ‘వాదన’గా, Εἰσῆλθενను ‘తలెత్తింది’గా సరిగ్గా అందిస్తుంది. అయితే ‘ఎవరు గొప్పవారనే’లో బహువచన రూపం గ్రీకులోని ఏకవచన τίς ... μείζωνకు కొద్దిగా అస్పష్టంగా ఉంది. ‘ఎవరు గొప్పవాడై ఉంటాడనే’ అనేది ఏకవచనాన్ని, ἂν εἴηలోని సంభావ్య భావాన్ని సహజంగా ప్రతిబింబిస్తుంది.
