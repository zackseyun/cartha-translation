source:
  edition: SBLGNT
  text: οἱ δὲ ἀποκριθέντες εἶπαν· Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἄλλοι δὲ ὅτι προφήτης τις τῶν ἀρχαίων ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/019.yaml
  text: And they answered[a], “John the Baptist; but others, Elijah; and others, that some prophet of the ancients has risen.”
translation:
  language: te
  text: 'వారు ఇలా జవాబిచ్చారు: “కొందరు, ‘బాప్తిస్మమిచ్చే యోహాను’ అంటున్నారు; మరికొందరు, ‘ఏలీయా’ అంటున్నారు; ఇంకొందరు, ‘పూర్వకాల ప్రవక్తల్లో ఎవరో ఒకరు లేచారు[a]’ అంటున్నారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చాలాకాలం క్రితం జీవించిన ఒక ప్రవక్త లేచారు.” గ్రీకు వాక్యాన్ని ఈ సహజమైన భావంలో కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες εἶπαν
  choice: వారు జవాబిస్తూ ... చెప్పారు
  rationale: కృదంతం మరియు సమాపక క్రియ రెండింటినీ సహజమైన తెలుగులో నిలుపుతూ, గ్రీకులోని సమాధానార్థక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: బాప్తిస్మమిచ్చే యోహాను
  rationale: βαπτιστής అనే గుర్తింపు బిరుదు యొక్క కార్యార్థాన్ని సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἄλλοι δὲ ... ἄλλοι δὲ
  choice: మరికొందరు ... ఇంకొందరు
  rationale: వేర్వేరు సమూహాల అభిప్రాయాలను సూచించే పునరుక్త నిర్మాణాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: Ἠλίαν
  choice: ఏలీయా
  rationale: ప్రవక్త పేరుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: పూర్వకాల ప్రవక్తల్లో ఎవరో ఒకరు
  rationale: τις లోని అనిర్దిష్టతను, τῶν ἀρχαίων సూచించే పూర్వకాల వ్యక్తుల సమూహంతో సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνέστη
  choice: లేచారు
  rationale: లేవడం, తిరిగి ప్రత్యక్షం కావడం, మృతులలోనుంచి లేవడం అనే సంభావ్య ప్రతిధ్వనులను ఒకదానికే పరిమితం చేయకుండా మూలపదంలోని విస్తృతిని నిలుపుతుంది.
theological_decisions:
- issue: ἀνέστη పునరుత్థానాన్ని స్పష్టంగా పేర్కొంటుందా, లేక సాధారణంగా లేచినట్లు చెబుతుందా
  choice: లేచారు
  alternative: తిరిగి వచ్చారు / మృతులలోనుంచి లేచారు
  rationale: ఈ సందర్భంలో పూర్వకాల ప్రవక్త మళ్లీ ప్రత్యక్షమయ్యాడనే జనాభిప్రాయం ఉంది. ‘లేచారు’ అనేది పునరుత్థానార్థపు సంభావ్యతను నిలుపుతుంది, అయితే మూలంలో లేని వివరణను బలవంతంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. సంభాషణలోని మూడు సమాధాన సమూహాలను స్పష్టంగా విడదీసి, మూలంలోని అనిర్దిష్టతను మరియు పునరుత్థాన సంబంధిత భావసంభావ్యతను కాపాడింది.
