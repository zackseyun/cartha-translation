id: LUK.9.18
reference: Luke 9:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν προσευχόμενον κατὰ μόνας συνῆσαν αὐτῷ οἱ μαθηταί, καὶ ἐπηρώτησεν αὐτοὺς λέγων· Τίνα με ⸂οἱ ὄχλοι λέγουσιν⸃ εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/018.yaml
  text: And it happened that while he was praying alone[a], the disciples were with him, and he asked them, saying, “Who do the crowds say that I am?”
translation:
  language: te
  text: ఒకసారి ఆయన ఏకాంతంగా[a] ప్రార్థిస్తూ ఉన్నప్పుడు, శిష్యులు ఆయనతో ఉన్నారు. అప్పుడు ఆయన వారిని, “జనసమూహాలు నన్ను ఎవరని చెబుతున్నాయి?” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “విడిగా.” κατὰ μόνας అనే పదబంధం పూర్తిగా ఎవరూ లేకుండా ఉండడాన్ని మాత్రమే కాక, ఇతరుల నుండి వేరుగా లేదా ఏకాంత పరిస్థితిలో ఉండడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ఒకసారి
  rationale: లూకా ఉపయోగించే కథనారంభ సూత్రాన్ని ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది; ప్రత్యేకంగా ‘సంభవించింది’ అని భారంగా అనువదించకుండా సందర్భ మార్పును నిలుపుతుంది.
- source_word: ἐν τῷ εἶναι αὐτὸν προσευχόμενον
  choice: ఆయన ... ప్రార్థిస్తూ ఉన్నప్పుడు
  rationale: ἐν తో కూడిన articular infinitive తెలిపే సమకాలిక పరిస్థితిని సహజమైన తెలుగు కాలవాచక నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: κατὰ μόνας
  choice: ఏకాంతంగా
  rationale: ఈ పదబంధానికి ‘ఒంటరిగా’ లేదా ‘ప్రత్యేకంగా/ఏకాంతంగా’ అనే భావాలు ఉండవచ్చు. శిష్యులు ఆయనతో ఉన్నారనే తదుపరి వాక్యంతో ఉన్న ఉద్వేగాన్ని పరిష్కరించకుండా, ప్రార్థనలోని ఏకాంత స్వభావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: συνῆσαν αὐτῷ οἱ μαθηταί
  choice: శిష్యులు ఆయనతో ఉన్నారు
  rationale: సాధారణ సహవాసార్థాన్ని నేరుగా నిలుపుతుంది; వారు దగ్గరలో మాత్రమే ఉన్నారని లేదా తరువాత వచ్చి చేరారని మూలంలో లేని వివరణను చేర్చదు.
- source_word: ἐπηρώτησεν αὐτοὺς λέγων
  choice: ఆయన వారిని ... అని అడిగాడు
  rationale: గ్రీకు participial speech formulaను తెలుగులో సహజమైన ప్రత్యక్ష వాక్య నిర్మాణంగా అందిస్తుంది.
- source_word: Τίνα με οἱ ὄχλοι λέγουσιν εἶναι
  choice: జనసమూహాలు నేను ఎవరినని చెబుతున్నాయి?
  rationale: గ్రీకు indirect-question నిర్మాణాన్ని తెలుగులో సహజంగా, ‘నేను’ అనే అంశాన్ని స్పష్టంగా నిలుపుతూ వ్యక్తపరుస్తుంది.
- source_word: οἱ ὄχλοι
  choice: జనసమూహాలు
  rationale: ‘ప్రజలు’ అనే సాధారణీకరణకన్నా గుంపులుగా ఉన్న సమూహాలను సూచించే ὄχλοι భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: యేసు ఏకాంతంగా ప్రార్థించడం, అదే సమయంలో శిష్యులు ఆయనతో ఉండడం మధ్య కనిపించే ఉద్వేగం
  choice: రెండు వాక్యాంశాలనూ నేరుగా ఉంచి, ‘ఏకాంతంగా’ అన్నదానికి పాదసూచికలో ప్రత్యామ్నాయ భావాన్ని ఇవ్వడం.
  alternative: శిష్యులు సమీపంలో ఉన్నారని లేదా ఆయన వ్యక్తిగతంగా ప్రార్థించాడని వివరణాత్మకంగా మార్చి ఉద్వేగాన్ని తొలగించడం.
  rationale: గ్రీకు వాక్యం ఏకాంత ప్రార్థనను, శిష్యుల సన్నిధిని రెండింటినీ చెబుతుంది. మూలంలో లేని స్థల లేదా పాల్గొనుట వివరాలను చేర్చకుండా ఆ భావ ఉద్వేగాన్ని నిలుపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘ఒకసారి’ కథన మార్పును సులభంగా సూచిస్తుంది. ప్రధాన వాక్యంలో ఉన్న భావ ఉద్వేగాన్ని పాదసూచిక వివరిస్తుంది గాని పరిష్కరించదు.
