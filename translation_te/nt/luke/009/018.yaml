revisions:
- from: ఒకసారి ఆయన ఏకాంతంగా[a] ప్రార్థిస్తూ ఉన్నప్పుడు, శిష్యులు ఆయనతో ఉన్నారు. అప్పుడు ఆయన వారిని, “జనసమూహాలు నేను ఎవరినని చెబుతున్నాయి?” అని అడిగాడు.
  to: ఒకసారి ఆయన ఏకాంతంగా[a] ప్రార్థిస్తూ ఉన్నప్పుడు, శిష్యులు ఆయనతో ఉన్నారు. అప్పుడు ఆయన వారిని, “జనసమూహాలు నన్ను ఎవరని చెబుతున్నాయి?” అని అడిగాడు.
