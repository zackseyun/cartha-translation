source:
  edition: SBLGNT
  text: Ἤκουσεν δὲ Ἡρῴδης ὁ τετραάρχης τὰ ⸀γινόμενα πάντα, καὶ διηπόρει διὰ τὸ λέγεσθαι ὑπό τινων ὅτι Ἰωάννης ⸀ἠγέρθη ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/007.yaml
  text: Herod the tetrarch heard about all that was happening[a], and he was perplexed because it was being said by some that John had been raised from the dead,
translation:
  language: te
  text: చతుర్థాధిపతియైన హేరోదు జరుగుతున్న సంగతులన్నిటి గురించి విన్నాడు. కొందరు, “యోహాను మృతులలోనుండి లేపబడ్డాడు”[a] అని చెబుతుండడంతో అతడు అయోమయపడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యోహాను మృతులలోనుండి లేచాడు.” గ్రీకు క్రియ కర్మణి రూపంలో ఉంది; అక్షరార్థంగా “లేపబడ్డాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσεν
  choice: గురించి విన్నాడు
  rationale: జరుగుతున్న సంఘటనలను గూర్చిన వార్తలు హేరోదుకు అందాయని సందర్భానికి సహజంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: తీవ్రమైన వ్యతిరేకతను సూచించకుండా కథనాన్ని ముందుకు నడిపించే సున్నిత అనుసంధానంగా వాడబడింది.
- source_word: ὁ τετραάρχης
  choice: చతుర్థాధిపతి
  rationale: సాధారణంగా ‘రాజు’ అని మార్చకుండా నిర్దిష్టమైన చారిత్రక-రాజకీయ బిరుదును నిలుపుతుంది.
- source_word: τὰ γινόμενα πάντα
  choice: జరుగుతున్న వాటన్నిటి
  rationale: సాగుతున్న సంఘటనలను సూచించే వర్తమాన కృదంత భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: διηπόρει
  choice: కలవరపడ్డాడు
  rationale: ఏమి అర్థం చేసుకోవాలో తెలియక అయోమయానికి, ఆందోళనకు లోనైన స్థితిని సందర్భానుకూలంగా వ్యక్తం చేస్తుంది.
- source_word: διὰ τὸ λέγεσθαι ὑπό τινων
  choice: కొందరు … అని చెబుతుండడంతో
  rationale: కారణార్థాన్ని, కొందరు చెబుతున్నారనే కొనసాగుతున్న నివేదిక భావాన్ని సహజమైన కర్తరి వాక్యంలో అందిస్తుంది.
- source_word: ἠγέρθη
  choice: లేపబడ్డాడు
  rationale: గ్రీకు క్రియలోని కర్మణి రూపాన్ని స్పష్టంగా నిలుపుతూ పునరుత్థాన భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐκ νεκρῶν
  choice: మృతులలోనుండి
  rationale: మరణించినవారి మధ్యనుండి లేపబడటాన్ని తెలిపే గ్రీకు పదబంధానికి సహజమైన బైబిలు తెలుగు రూపం.
theological_decisions:
- issue: యోహాను పునరుత్థానాన్ని గురించిన నివేదికలోని కర్మణి ప్రయోగం
  choice: మృతులలోనుండి లేపబడ్డాడు
  alternative: మృతులలోనుండి లేచాడు
  rationale: ἠγέρθη కర్మణి రూపంలో ఉన్నందున దాన్ని కర్తరి భావంగా మార్చకుండా మూలంలోని వ్యాకరణ, దైవశాస్త్ర ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘చతుర్థాధిపతి’ అనే చారిత్రక బిరుదును నిలిపి, ఉటంకించిన ప్రజాభిప్రాయాన్ని స్పష్టంగా చూపించాం.
