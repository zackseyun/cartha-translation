id: LUK.9.6
reference: Luke 9:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐξερχόμενοι δὲ διήρχοντο κατὰ τὰς κώμας εὐαγγελιζόμενοι καὶ θεραπεύοντες πανταχοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/006.yaml
  text: So they went out and traveled through the villages[b][a], proclaiming the good news and healing everywhere.
translation:
  language: te
  text: అప్పుడు వారు బయలుదేరి, ఊరూరా తిరుగుతూ[a] సువార్త ప్రకటిస్తూ[b], ప్రతిచోటా రోగులను స్వస్థపరుస్తూ వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గ్రామాల గుండా తిరుగుతూ.’ గ్రీకు పదబంధం ఒక్కో గ్రామానికి వెళ్లే పంపిణీ భావాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘శుభవార్త ప్రకటిస్తూ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξερχόμενοι
  choice: బయలుదేరి
  rationale: మునుపటి ఆజ్ఞను అనుసరించి శిష్యులు తమ ప్రయాణాన్ని ప్రారంభించిన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: కాబట్టి
  rationale: మునుపటి వచనంలో యేసు ఇచ్చిన ఆజ్ఞకు అనుగుణంగా జరిగిన పరిణామాన్ని సూచించే స్వల్ప కథన అనుసంధానాన్ని వ్యక్తం చేస్తుంది.
- source_word: διήρχοντο
  choice: తిరుగుతూ … వెళ్లారు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న, ప్రాంతం నుంచి ప్రాంతానికి సాగే ప్రయాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κατὰ τὰς κώμας
  choice: ఊరూరా
  rationale: κατά + బహువచన కర్మ విభక్తిలోని పంపిణీ భావాన్ని—ఒక గ్రామం నుంచి మరొక గ్రామానికి వెళ్లడాన్ని—సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: εὐαγγελιζόμενοι
  choice: సువార్త ప్రకటిస్తూ
  rationale: శుభవార్తను బహిరంగంగా తెలియజేయడాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; ‘సువార్త’ ఆధునిక తెలుగు క్రైస్తవ వాడుకలో అర్థవంతమైనప్పటికీ క్రియలోని ప్రకటన భావాన్ని ‘ప్రకటిస్తూ’ నిలుపుతుంది.
- source_word: θεραπεύοντες
  choice: రోగులను స్వస్థపరుస్తూ
  rationale: ఈ సందర్భంలో క్రియ సూచించే శారీరక స్వస్థతను స్పష్టం చేస్తుంది; తెలుగులో కర్మను చేర్చడం వాక్యాన్ని సహజంగా చేస్తుంది.
- source_word: πανταχοῦ
  choice: ప్రతిచోటా
  rationale: వారి ప్రకటన, స్వస్థపరిచే సేవ విస్తృతంగా జరిగినదనే భావాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: అపొస్తలీయ సేవలో εὐαγγελιζόμενοι భావం
  choice: సువార్త ప్రకటిస్తూ
  alternative: శుభవార్త తెలియజేస్తూ
  rationale: మూలపదంలోని శుభవార్త ప్రకటన భావాన్ని కాపాడుతూ, తరువాతి కాలానికి చెందిన మరింత విస్తృతమైన సిద్ధాంత నిర్వచనాన్ని వచనంలోకి బలవంతంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఊరూరా’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతూ మూలంలోని పంపిణీ భావాన్ని నిలుపుతుంది. రెండు సమకాలిక పరిచర్యలను ‘ప్రకటిస్తూ’, ‘స్వస్థపరుస్తూ’ అనే రూపాలతో, కొనసాగుతున్న ప్రయాణాన్ని ‘వెళ్లారు’తో వ్యక్తం చేశాం.
