id: LUK.9.57
reference: Luke 9:57
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Καὶ πορευομένων αὐτῶν ἐν τῇ ὁδῷ εἶπέν τις πρὸς αὐτόν· Ἀκολουθήσω σοι ὅπου ⸀ἐὰν ⸀ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/057.yaml
  text: And as they were going along the road[a], someone said to him, “I will follow you wherever you go.”
translation:
  language: te
  text: 'వారు దారిలో వెళ్తుండగా, ఒకరు ఆయనతో ఇలా అన్నారు: “మీరు ఎక్కడికి వెళ్లినా[a], నేను మిమ్మల్ని అనుసరిస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “మీరు ఎక్కడికి వెళ్లినా సరే” లేదా “మీరు ఎక్కడికి వెళ్లిపోతే అక్కడికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευομένων αὐτῶν
  choice: వారు ... వెళ్తుండగా
  rationale: వర్తమానకాల మధ్యమ కృదంతంతో ఉన్న genitive absolute, అదే సమయంలో కొనసాగుతున్న ప్రయాణాన్ని సూచిస్తుంది. ‘వెళ్తుండగా’ ఆ కాలసంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐν τῇ ὁδῷ
  choice: దారిలో
  rationale: ఇది ప్రయాణం జరుగుతున్న స్పష్టమైన స్థలాన్ని సహజంగా తెలియజేస్తుంది; లూకాలోని ప్రయాణ నేపథ్య ప్రతిధ్వనిని అనవసరంగా విస్తరించదు.
- source_word: εἶπέν τις
  choice: ఎవరో ... అన్నారు
  rationale: τις నిర్దిష్టతలేని వ్యక్తిని సూచిస్తుంది; మూలంలో స్పష్టంగా లేని లింగాన్ని ‘ఒక మనిషి’ అని చేర్చకుండా ‘ఎవరో’ నిలుపుతుంది.
- source_word: πρὸς αὐτόν
  choice: ఆయనతో
  rationale: మాట్లాడే క్రియతో వచ్చిన πρός‌ను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ἀκολουθήσω σοι
  choice: నేను మిమ్మల్ని అనుసరిస్తాను
  rationale: భవిష్యత్ సూచక రూపం సంకల్పం లేదా నిబద్ధతను తెలియజేస్తుంది. ‘అనుసరిస్తాను’ శారీరకంగా వెంట వెళ్లడం, శిష్యత్వార్థం—రెండింటినీ విపులీకరించకుండా నిలుపుతుంది.
- source_word: ὅπου ἐὰν ἀπέρχῃ
  choice: మీరు ఎక్కడికి వెళ్లినా
  rationale: ὅπου + ἐάν + subjunctive ఇచ్చే అనిర్దిష్ట ‘ఎక్కడికైనా/ఎక్కడికి వెళ్లినా’ భావాన్ని సహజంగా అందిస్తుంది. ἀπέρχομαιలోని ‘వెళ్లిపోవడం’ భావాన్ని పాదటిప్పణిలో ప్రత్యామ్నాయంగా ఉంచింది.
theological_decisions:
- issue: ἀκολουθέωలోని శిష్యత్వ ప్రాధాన్యం
  choice: ‘అనుసరిస్తాను’ అని అనువదించడం
  alternative: ‘మీ శిష్యుడిగా ఉంటాను’
  rationale: లూకా సందర్భంలో ఈ క్రియకు శిష్యత్వ ప్రాధాన్యం ఉన్నప్పటికీ, ‘అనుసరిస్తాను’ అనే రూపం అక్షర ప్రయాణం మరియు శిష్యత్వం రెండింటి ప్రతిధ్వనినీ నిలుపుతుంది; మూలంలో లేని వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. యేసును ఉద్దేశించిన ఏకవచనాన్ని తెలుగులో సాధారణ గౌరవార్థక ‘మీరు/మిమ్మల్ని’తో వ్యక్తం చేశాం. ‘ఎవరో’ మూలంలోని నిర్దిష్టతలేమిని, లింగ అనిశ్చితిని కాపాడుతుంది; దానికి అనుగుణంగా గౌరవ/లింగ-తటస్థ బహువచన క్రియారూపం ‘అన్నారు’ వాడబడింది. పాదటిప్పణి గుర్తును అది వివరిస్తున్న ‘వెళ్లినా’ పదబంధం వెంట ఉంచాం.
