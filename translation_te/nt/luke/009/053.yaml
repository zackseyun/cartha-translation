  yaml_path: translation/nt/luke/009/053.yaml
  text: And they did not receive him[b][a], because his face was going toward Jerusalem.
translation:
  language: te
  text: కానీ వారు ఆయనను స్వాగతించలేదు[a], ఎందుకంటే ఆయన ముఖం యెరూషలేమువైపు మళ్లి ఉంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనను స్వీకరించలేదు.” ఇక్కడ వాడిన క్రియ స్వీకరించడం, అంగీకరించడం, లేదా స్వాగతించడం అనే అర్థాలు ఇవ్వగలదు; ఈ సందర్భంలో ఆతిథ్యం ఇవ్వడానికి నిరాకరించడం భావమై ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఆయన ముఖం యెరూషలేమువైపు వెళ్తూ ఉంది.” ఇది యెరూషలేమువైపు ఉన్న నిర్ణీత దిశను లేదా దృఢ సంకల్పాన్ని వ్యక్తం చేసే ప్రయోగం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξαντο
  choice: స్వాగతించలేదు
  rationale: δέχομαι అంటే స్వీకరించడం, అంగీకరించడం, లేదా స్వాగతించడం. ప్రయాణం మరియు ఆతిథ్య సందర్భంలో ‘స్వాగతించలేదు’ సహజంగా ఉండి, వారు ఆయనకు ఆతిథ్యం నిరాకరించిన భావాన్ని తెలియజేస్తుంది.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: ఆయన ముఖం
  rationale: πρόσωπον యొక్క ప్రత్యక్ష అర్థం ‘ముఖం’. ఇక్కడ అది గమ్యం వైపు దృఢమైన దిశను సూచించే సెమిటిక్ శైలిలోని ప్రయోగంలో భాగం; దాని చిత్రాత్మకతను నిలుపుకోవడానికి ప్రత్యక్ష రూపాన్ని ఉంచాం.
- source_word: ἦν πορευόμενον
  choice: వెళ్తూ ఉంది
  rationale: ἦν తో వర్తమాన కృదంతమైన πορευόμενον కలిసిన పరిభాషాత్మక నిర్మాణం ప్రయాణంలో ఉండడాన్ని సూచిస్తుంది. సమీప సందర్భం నుంచి ‘నిశ్చయించుకున్నాడు’ అనే భావాన్ని ప్రధాన పాఠ్యంలో అదనంగా చేర్చకుండా, గ్రీకు రూపాన్ని దగ్గరగా అనుసరిస్తుంది.
- source_word: εἰς Ἰερουσαλήμ
  choice: యెరూషలేమువైపు
  rationale: εἰς గమ్యం లేదా దిశను సూచిస్తుంది. ‘ముఖం ... వెళ్తూ ఉంది’ అనే ప్రయోగంతో తెలుగులో ‘వైపు’ సహజంగా దిశను తెలియజేస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ὅτι ఇక్కడ వారు స్వాగతించకపోవడానికి కారణాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ‘ఎందుకంటే’ స్పష్టమైన కారణసూచక పదం.
theological_decisions:
- issue: ‘ఆయన ముఖం ... యెరూషలేమువైపు వెళ్తూ ఉంది’ అనే ప్రయోగంలోని భావం
  choice: ముఖం అనే చిత్రాత్మక పదాన్ని, వెళ్తున్న దిశను ప్రధాన పాఠ్యంలో నిలుపుకోవడం
  alternative: ‘ఆయన యెరూషలేముకు వెళ్లాలని దృఢంగా నిర్ణయించుకున్నాడు’ అని భావానువాదం చేయడం
  rationale: ఈ వాక్యం యెరూషలేమువైపు స్థిరమైన ప్రయాణ దిశను సూచించవచ్చు. అయితే πορευόμενον ప్రత్యక్షంగా ‘వెళ్తున్న’ భావాన్ని ఇస్తుంది; కాబట్టి సంకల్ప భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టీకరించి మూలంలోని ఉద్విగ్నతను తొలగించకుండా పాదసూచికలో వివరిస్తాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘స్వాగతించలేదు’ ప్రయాణ-ఆతిథ్య సందర్భాన్ని స్పష్టం చేస్తుంది. అసాధారణమైన ‘ఆయన ముఖం ... వెళ్తూ ఉంది’ అనే మూల చిత్రాన్ని ఉద్దేశపూర్వకంగా నిలిపి, దాని భావాన్ని పాదసూచికలో వివరించాం.
