    text: లేదా, “మిగిలిన శకలాలు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఎత్తబడ్డాయి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: తిని
  rationale: సందర్భంలోని వరుస చర్యలను సహజమైన తెలుగులో తెలిపే భూతకాల క్రియారూపం.
- source_word: ἐχορτάσθησαν
  choice: తృప్తి చెందారు
  rationale: అందరూ కడుపునిండా తిన్నారనే భావాన్ని ఆధునిక, సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πάντες
  choice: వారందరూ
  rationale: అంతా తిన్నారనే గ్రీకు వాక్యంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἤρθη
  choice: పోగుచేయగా
  rationale: ఈ సందర్భంలో మిగిలిన ముక్కలను ఎత్తి సమకూర్చడాన్ని సహజంగా తెలియజేస్తుంది; మూలంలోని కర్మణి భావానికి దగ్గరైన ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: τὸ περισσεῦσαν
  choice: మిగిలిన
  rationale: నామవాచకార్థంలో వాడిన గ్రీకు కృదంతం సూచించే ‘మిగిలిపోయినది’ అనే భావాన్ని సంక్షిప్తంగా ఇస్తుంది.
- source_word: αὐτοῖς
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: ఈ దత్తి రూపం ఎవరికి/ఎవరి తరువాత మిగిలిందో లేదా ఎవరిచేత ఎత్తబడిందో అనే విషయంలో కొంత అస్పష్టంగా ఉంది; తెలుగులో బలవంతంగా సంబంధాన్ని నిర్ణయించడం కంటే సందర్భంలో అంతర్భూతంగా ఉంచడం సహజం.
- source_word: κλασμάτων
  choice: విరిగిన ముక్కలను
  rationale: రొట్టెల నుండి విరిగిన లేదా మిగిలిన ముక్కలనే స్పష్టంగా, సామాన్య పాఠకులకు అర్థమయ్యేలా తెలుపుతుంది.
- source_word: κόφινοι δώδεκα
  choice: పన్నెండు గంపలు నిండాయి
  rationale: ‘పన్నెండు గంపలు’ అనే పరిమాణార్థాన్ని సహజ తెలుగు వాక్యంగా తెలియజేస్తుంది; ‘నిండాయి’ అనేది గ్రీకులో భావపూర్వకంగా ఉన్నా ప్రత్యక్షంగా లేని పూరక పదం.
