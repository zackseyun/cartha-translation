  text: 'And they all ate and were satisfied[b][a], and what was left over of the broken pieces was picked up for them: twelve baskets.'
translation:
  language: te
  text: వారందరూ తిని తృప్తి చెందారు. వారికి మిగిలిన విరిగిన ముక్కలు[a] పన్నెండు గంపలంత పోగయ్యాయి[b].
  philosophy: optimal-equivalence
  footnotes:
