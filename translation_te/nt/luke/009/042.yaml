id: LUK.9.42
reference: Luke 9:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔτι δὲ προσερχομένου αὐτοῦ ἔρρηξεν αὐτὸν τὸ δαιμόνιον καὶ συνεσπάραξεν· ἐπετίμησεν δὲ ὁ Ἰησοῦς τῷ πνεύματι τῷ ἀκαθάρτῳ, καὶ ἰάσατο τὸν παῖδα καὶ ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/042.yaml
  text: But while he was still coming near[a], the demon threw him down and convulsed him. But Jesus rebuked the unclean spirit, healed the boy, and gave him back to his father.
translation:
  language: te
  text: అతడు ఇంకా దగ్గరికి వస్తుండగా, దయ్యం అతణ్ణి నేలకేసి కొట్టి, తీవ్రంగా గిలగిల కొట్టుకునేలా చేసింది. యేసు మాత్రం ఆ అపవిత్రాత్మను గద్దించి, బాలుణ్ణి స్వస్థపరచి, అతని తండ్రికి తిరిగి అప్పగించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని తండ్రికి తిరిగి ఇచ్చాడు.”
    reason: ἀπέδωκενకు “తిరిగి అప్పగించాడు” మరియు “తిరిగి ఇచ్చాడు” రెండూ సహజమైన సందర్భోచిత తెలుగు అనువాదాలు.
lexical_decisions:
- source_word: ἔτι δὲ
  choice: ఇంకా ... వస్తుండగానే
  rationale: ἔτι సూచించే కొనసాగుతున్న చర్యను ‘ఇంకా’తో వ్యక్తం చేశాం; δέ ఇక్కడ స్వల్ప కథన మలుపును సూచిస్తుంది, దాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో అంతర్లీనంగా ఉంచాం.
- source_word: προσερχομένου αὐτοῦ
  choice: అతడు ... దగ్గరికి వస్తుండగానే
  rationale: వర్తమాన కృదంతంతో ఉన్న genitive absolute సమకాలీన చర్యను సూచిస్తుంది. ఎవరి దగ్గరికి వచ్చాడో పాఠ్యంలో స్పష్టంగా చెప్పనందున దాన్ని అదనంగా చేర్చలేదు.
- source_word: ἔρρηξεν αὐτὸν
  choice: అతణ్ణి నేలకేసి కొట్టి
  rationale: ఇక్కడ ῥήγνυμι దయ్యం బాలుణ్ణి హింసాత్మకంగా పడగొట్టడాన్ని సూచిస్తుంది; ‘నేలకేసి కొట్టి’ ఆధునిక తెలుగులో ఆ బలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὸ δαιμόνιον
  choice: దయ్యం
  rationale: δαιμόνιονకు నేరమైన, సాధారణ తెలుగు సమానార్థకం; తరువాతి πνεῦμα ἀκάθαρτον అనే వేరైన అభివ్యక్తిని కూడా ప్రత్యేకంగా నిలుపుతుంది.
- source_word: συνεσπάραξεν
  choice: తీవ్రంగా గిలగిల కొట్టుకునేలా చేసింది
  rationale: ఈ క్రియ తీవ్రమైన శరీర మెలికలు లేదా convulsions కలిగించడాన్ని సూచిస్తుంది. ఈ రూపం దయ్యమే వాటికి కారణమని స్పష్టంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా చెబుతుంది.
- source_word: ἐπετίμησεν
  choice: గద్దించి
  rationale: సువార్తలలో అధికారపూర్వకంగా మందలించడం లేదా ఆజ్ఞాపించడాన్ని సూచించే సాధారణ క్రియకు సహజమైన తెలుగు రూపం.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: ఆ అపవిత్రాత్మను
  rationale: ‘అపవిత్రాత్మ’ అనే రూపం ఆధ్యాత్మిక, నైతిక అపవిత్రత భావాన్ని నిలుపుతుంది; ‘ఆ’ ముందు పేర్కొన్న దయ్యంతో సంబంధాన్ని చూపుతుంది.
- source_word: ἰάσατο
  choice: స్వస్థపరచి
  rationale: అద్భుత స్వస్థత సందర్భంలో ἰάομαι యొక్క భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τὸν παῖδα
  choice: బాలుణ్ణి
  rationale: παῖς సందర్భానుసారం బాలుడు, బిడ్డ, సేవకుడు మొదలైన అర్థాలు కలిగి ఉండవచ్చు. ఇక్కడ తండ్రితో ఉన్న సంబంధం మరియు సందర్భం యువ బాలుణ్ణి సూచిస్తాయి; ‘బాలుడు’ లింగాన్ని ఉంచుతూ ‘కుమారుడు’ అనే స్పష్టంగా లేని బంధపదాన్ని చేర్చదు.
- source_word: ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ
  choice: అతని తండ్రికి తిరిగి అప్పగించాడు
  rationale: ἀποδίδωμι ఇక్కడ తిరిగి ఇవ్వడం లేదా పునరుద్ధరించి అప్పగించడం అనే భావాన్ని కలిగి ఉంది. ప్రధాన పాఠంలోని రూపం విమోచన అనంతర పునరప్పగింపును సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దయ్యపు పీడను సూచించే భాష
  choice: δαιμόνιονను ‘దయ్యం’గా, πνεῦμα ἀκάθαρτονను ‘అపవిత్రాత్మ’గా వ్యక్తిగత దుష్టాత్మను సూచించే పదాలతో అనువదించాం.
  alternative: వాటిని ‘దుష్టశక్తి’ లేదా కేవలం మానసిక/శారీరక వ్యాధిగా సాధారణీకరించడం.
  rationale: గ్రీకు పాఠ్యం కార్యం చేసే వ్యక్తిగత దయ్యాన్ని పేర్కొని, దానిని అపవిత్రాత్మగా కూడా వర్ణిస్తుంది. కాబట్టి పాఠ్యంలోని ఆధ్యాత్మిక కార్యసాధకత్వాన్ని సహజ కారణంగా మార్చలేదు. అదే సమయంలో యేసు బాలుణ్ణి స్వస్థపరిచాడని పాఠ్యం చెప్పే వైద్య/పునరుద్ధరణ కోణాన్నీ నిలిపాం.
- issue: విమోచన మరియు స్వస్థత మధ్య సంబంధం
  choice: యేసు అపవిత్రాత్మను గద్దించడాన్నీ, బాలుణ్ణి స్వస్థపరచడాన్నీ రెండు ప్రత్యేకమైన కానీ అనుసంధానమైన చర్యలుగా ఉంచాం.
  alternative: స్వస్థతను కేవలం భూతవిమోచనకు సమానంగా చేయడం లేదా భూతవిమోచనను తొలగించి కేవలం వైద్య స్వస్థతగా చెప్పడం.
  rationale: గ్రీకు వాక్యంలో ἐπετίμησεν మరియు ἰάσατο రెండూ విడివిడిగా ఉన్నాయి; వాటి మధ్య ఉన్న ఉద్రిక్తతను లేదా అనుసంధానాన్ని అనువాదం ముందుగానే పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, కథన గంభీరతను నిలుపుతుంది. ‘గిలగిల కొట్టుకునేలా చేసింది’ వంటి సహజమైన అభివ్యక్తి తీవ్రమైన శరీర మెలికలను స్పష్టంగా చెబుతుంది; ‘అపవిత్రాత్మ’, ‘గద్దించి’, ‘స్వస్థపరచి’ అనే పదాలు బైబిలు సందర్భానికి తగిన గౌరవప్రదమైన శైలిని ఉంచుతాయి.
