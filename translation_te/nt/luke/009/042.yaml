revisions:
- from: 'అతడు ఇంకా దగ్గరికి వస్తుండగానే, దయ్యం అతణ్ణి నేలకేసి కొట్టి, తీవ్రంగా గిలగిల కొట్టుకునేలా చేసింది. అయితే యేసు ఆ అపవిత్రాత్మను గద్దించి, బాలుణ్ణి స్వస్థపరచి, అతని తండ్రికి తిరిగి అప్పగించాడు.[a]


    [a] లేదా, “అతని తండ్రికి తిరిగి ఇచ్చాడు.”'
  to: అతడు ఇంకా దగ్గరికి వస్తుండగా, దయ్యం అతణ్ణి నేలకేసి కొట్టి, తీవ్రంగా గిలగిల కొట్టుకునేలా చేసింది. యేసు మాత్రం ఆ అపవిత్రాత్మను గద్దించి, బాలుణ్ణి స్వస్థపరచి, అతని తండ్రికి తిరిగి అప్పగించాడు.[a]
  rationale: The revision corrects the temporal nuance of the opening genitive absolute without adding an object for the boy’s approach. It also places the discourse contrast naturally in Telugu and retains the existing lexical alternative at the clause governed by ἀπέδωκεν. No doctrinal interpretation is added.
