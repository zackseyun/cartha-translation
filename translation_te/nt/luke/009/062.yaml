source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂ὁ Ἰησοῦς⸃· Οὐδεὶς ἐπιβαλὼν τὴν ⸀χεῖρα ἐπ’ ἄροτρον καὶ βλέπων εἰς τὰ ὀπίσω εὔθετός ἐστιν ⸂τῇ βασιλείᾳ⸃ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/062.yaml
  text: But Jesus said[b][a], “No one who has put his hand to the plow and looks back is fit for the kingdom of God.”
translation:
  language: te
  text: 'అయితే యేసు ఇలా అన్నాడు: “నాగలిమీద చేయి పెట్టి[a] వెనక్కి చూస్తున్న ఏ ఒక్కరూ దేవుని రాజ్యానికి తగినవారు కారు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాగలిని చేతితో పట్టుకుని.” ఇక్కడి చిత్రం దున్నడం మొదలుపెట్టి, ఆ తర్వాత తన దృష్టిని వెనుకకు మళ్లించే వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “తగినవారు” అనే పదాన్ని “సరిపోయేవారు” లేదా “ఉపయోగపడేవారు” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: ముందున్న మాటకు యేసు ఇచ్చిన ప్రతిస్పందనలోని స్వల్ప వ్యత్యాసాన్ని, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: Οὐδεὶς
  choice: ఎవ్వరూ ... కారు
  rationale: లింగభేదం లేకుండా ప్రతి వ్యక్తికీ వర్తించే సంపూర్ణ నిరాకరణను సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: ἐπιβαλὼν τὴν χεῖρα ἐπ’ ἄροτρον
  choice: నాగలిమీద చేయి పెట్టి
  rationale: దున్నడం మొదలుపెట్టేందుకు నాగలిని పట్టుకున్న చర్యను సూచించే వ్యవసాయ దృశ్యాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἄροτρον
  choice: నాగలి
  rationale: దున్నే వ్యవసాయ పరికరానికి ఆధునిక ప్రామాణిక తెలుగులో సాధారణంగా అర్థమయ్యే పదం.
- source_word: βλέπων εἰς τὰ ὀπίσω
  choice: వెనుకవైపు చూస్తూ ఉండే
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న లేదా అలవాటైన చర్యను నిలుపుతూ, వెనక్కి దృష్టి మళ్లించే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: εὔθετός
  choice: తగినవారు
  rationale: ఒక ఉద్దేశానికి సరిపోవడం లేదా అనుకూలంగా ఉండడం అనే భావాన్ని ఇస్తుంది; నైతిక యోగ్యత లేదా తుది రక్షణ గురించి మూలపాఠం చెప్పినదానికంటే ఎక్కువగా నిర్దిష్టం చేయదు.
- source_word: τῇ βασιλείᾳ τοῦ θεοῦ
  choice: దేవుని రాజ్యానికి
  rationale: εὔθετος‌తో ఉన్న దత్తి విభక్తిని సహజంగా ‘దేవుని రాజ్యానికి తగిన’ అని అందిస్తుంది; βασιλείαకు స్థిరమైన, విస్తృతంగా అర్థమయ్యే అనువాదం.
theological_decisions:
- issue: εὔθετός ἐστιν τῇ βασιλείᾳ τοῦ θεοῦ యొక్క సూచన
  choice: దేవుని రాజ్యానికి తగినవారు కారు
  alternative: దేవుని రాజ్యంలో ప్రవేశించడానికి యోగ్యులు కారు; దేవుని రాజ్య సేవకు ఉపయోగపడరు
  rationale: గ్రీకు పదం సరిపోవడం లేదా తగినదై ఉండడాన్ని సూచిస్తుంది. ఈ రూపం విభజిత నిబద్ధతపై హెచ్చరికను బలంగా ఉంచుతుంది, కానీ తుది రక్షణ నుంచి తప్పించబడటం లేదా కేవలం సేవలో ఉపయోగకరత అనే నిర్దిష్ట సిద్ధాంతార్థాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. వ్యవసాయ రూపకాన్ని యథాతథంగా నిలిపి, ‘చూస్తూ ఉండే’ ద్వారా కొనసాగుతున్న దృష్టి మళ్లింపును తెలియజేశారు. ‘తగినవారు’ మూలంలోని అర్థ విస్తృతిని, ధార్మిక ఉద్రిక్తతను అనవసరంగా పరిష్కరించకుండా కాపాడుతుంది.
