id: LUK.9.24
reference: Luke 9:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἂν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι, ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ, οὗτος σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/024.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will save it.
translation:
  language: te
  text: ఎందుకంటే, తన ప్రాణాన్ని[a] కాపాడుకోవాలని కోరుకునేవాడు దాన్ని పోగొట్టుకుంటాడు; అయితే నా నిమిత్తం తన ప్రాణాన్ని పోగొట్టుకునేవాడు దాన్ని కాపాడుకుంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన జీవితాన్ని,’ ‘తన ఆత్మను,’ లేదా ‘తన్నుతాను’; గ్రీకు పదం సందర్భానుసారం ప్రాణం, జీవితం, ఆత్మ, లేదా స్వయం అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν θέλῃ
  choice: ఎందుకంటే, ... కోరుకునేవాడు
  rationale: γάρ ముందున్న మాటకు వివరణాత్మక సంబంధాన్ని చూపుతుంది; ὃς ... ἂν అనే సాధారణ షరతును తెలుగులో సహజమైన ‘...వాడు’ నిర్మాణంతో తెలిపాం. θέλῃలోని సంకల్ప భావాన్ని ‘కోరుకునే’ నిలుపుతుంది.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: తన ప్రాణాన్ని
  rationale: ఈ సందర్భంలో ψυχή భౌతిక జీవితం, వ్యక్తి జీవం, లేదా స్వయం అనే విస్తృత భావాలను కలిగి ఉంది. ‘ప్రాణం’ ఈ విరోధాభాసానికి సహజంగా సరిపోతూ, ‘ఆత్మ’ అనే సంకుచిత మానవశాస్త్రీయ అర్థాన్ని బలవంతంగా రుద్దదు.
- source_word: σῶσαι / σώσει
  choice: కాపాడుకోవాలని / కాపాడుకుంటాడు
  rationale: σῴζω యొక్క ‘రక్షించు, కాపాడు’ భావంలో ఇక్కడ తన ప్రాణాన్ని నిలుపుకోవడం ప్రధానంగా ఉంది. రెండు చోట్ల ‘కాపాడు’ ధాతువును ఉంచి వాక్యంలోని ప్రతిధ్వనిని నిలిపాం; ఆత్మనేపదసదృశమైన తెలుగు రూపం సందర్భానికి సహజంగా ఉంది.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: పోగొట్టుకుంటాడు / పోగొట్టుకునేవాడు
  rationale: ἀπόλλυμι ఇక్కడ ‘నాశనం చేయు’ కంటే ‘కోల్పోవు’ అనే భావంలో ఉంది. ‘పోగొట్టుకొను’ తెలుగు వాక్యంలో ప్రాణాన్ని కాపాడుకోవడం–పోగొట్టుకోవడం అనే విరోధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἕνεκεν ἐμοῦ
  choice: నా నిమిత్తం
  rationale: ἕνεκεν ἐμοῦ కారణం లేదా ప్రేరణను సూచిస్తుంది. ‘నా నిమిత్తం’ గౌరవప్రదంగా, సహజంగా ఉండి యేసు కారణంగా కలిగే శిష్యత్వ నష్టాన్ని తెలియజేస్తుంది.
- source_word: οὗτος σώσει αὐτήν
  choice: దాన్ని కాపాడుకుంటాడు
  rationale: οὗτος ముందుగా పేర్కొన్న వ్యక్తినే నొక్కి చెబుతుంది. తెలుగులో ‘...వాడే’ అని మరింత గట్టిగా జోడించడం సాధ్యమైనా, సమాంతర వాక్య నిర్మాణమే వ్యక్తిని స్పష్టంగా చూపుతున్నందున సహజత్వం కోసం ప్రత్యేక సూచనపదాన్ని జోడించలేదు. αὐτήνను ‘దాన్ని’గా అనువదించి ‘ప్రాణం’తో సంబంధాన్ని నిలిపాం.
theological_decisions:
- issue: ψυχή అనే పదం యొక్క భావం
  choice: ప్రాణం
  alternative: జీవితం; ఆత్మ; స్వయం
  rationale: శిష్యత్వం, స్వీయనిరాకరణ, యేసు నిమిత్తం ప్రాణాన్ని కోల్పోవడం అనే తక్షణ సందర్భంలో ‘ప్రాణం’ ప్రధాన భావాన్ని అందిస్తుంది. అయితే మూలపదానికి ఉన్న విస్తృత అర్థపరిధిని పాదసూచికలో ఉంచి theological tension‌ను సంకుచితం చేయలేదు.
- issue: సాధారణ పురుషలింగ ఏకవచన సూచన
  choice: తన ... వాడు
  alternative: తమ ... వారు
  rationale: గ్రీకు వాక్యం ఏకవచన ప్రతినిధి నిర్మాణాన్ని ఉపయోగిస్తుంది. తెలుగులో ‘తన ... వాడు’ ఆ ఏకవచనాన్ని, వ్యక్తిగత శిష్యత్వ పిలుపును నిలుపుతుంది; ఇది పురుషులకు మాత్రమే పరిమితమని ఉద్దేశించదు.
- issue: కాపాడటం–పోగొట్టుకోవటం అనే విరోధాభాసం
  choice: ఒకే ధాతు జంటను రెండు భాగాల్లో నిలుపడం
  alternative: మొదటి భాగంలో ‘నిలుపుకోవడం’, చివరలో ‘రక్షించుకోవడం’
  rationale: σῴζω మరియు ἀπόλλυμι పునరావృతులు యేసు మాటలోని ఉద్దేశపూర్వక విరోధాభాసాన్ని నిర్మిస్తాయి. పదాలను మార్చి భావాన్ని ముందుగానే వివరిస్తే ఆ వాగ్ధాటి తగ్గుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన శైలిలో అనువదించాం. ‘నా నిమిత్తం’ అనే పదబంధం కొద్దిగా ఉన్నత శైలిని కలిగి ఉన్నా సుపరిచితమైనది. ప్రధాన పాఠ్యంలో [a] గుర్తు సంబంధిత ‘ప్రాణం’ పదం మొదటి భావనిర్ణయానికి వెంటనే ఉంచబడింది.
