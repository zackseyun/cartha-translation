  text: And they went on to another village[a].
translation:
  language: te
  text: మరియు వారు మరొక గ్రామానికి వెళ్లారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వేరొక గ్రామానికి.’ గ్రీకు విశేషణం ‘మరొక’ అనే అర్థంతో పాటు భిన్నత్వాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: అప్పుడు
  rationale: సాధారణంగా ఇది ‘మరియు’ అనే సమన్వయ భావాన్ని ఇస్తుంది; ఇక్కడ కథనంలోని తదుపరి చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేయడానికి ‘అప్పుడు’ అని అనువదించాం.
- source_word: ἐπορεύθησαν
  choice: వారు వెళ్లారు
  rationale: πορεύομαι అనే క్రియకు ‘వెళ్లు, ప్రయాణించు, ముందుకు సాగు’ అనే అర్థాలు ఉన్నాయి. ఇక్కడ గమ్యస్థానానికి కదలడాన్ని సహజంగా తెలిపే ‘వెళ్లారు’ సరిపోతుంది.
- source_word: εἰς
  choice: -కి
  rationale: చలన క్రియతో కలిసి εἰς గమ్యాన్ని సూచిస్తుంది; తెలుగులో గ్రామం అనే పదానికి జోడించిన ‘-కి’ విభక్తి దీనిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἑτέραν
  choice: మరొక
  rationale: ἕτερος ‘ఇంకొక’ లేదా ‘వేరొక’ అనే భావాన్ని ఇవ్వగలదు. ప్రధాన పాఠంలో ‘మరొక’ సహజంగా ఉండగా, భిన్నత్వాన్ని నొక్కిచెప్పే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: κώμην
  choice: గ్రామం
  rationale: κώμη పెద్ద పట్టణం కంటే చిన్న గ్రామీణ నివాసాన్ని సూచిస్తుంది; ‘గ్రామం’ ఖచ్చితమైన, సాధారణ తెలుగు పదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని సంక్షిప్తతను నిలిపి, ἑτέραν పదంలోని ‘మరొక/వేరొక’ అర్థసంభావ్యతను పాదసూచికలో భద్రపరిచాం.
