id: LUK.9.58
reference: Luke 9:58
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/058.yaml
  text: And Jesus said to him[a], “Foxes have dens, and the birds of the sky have nests[c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: te
  text: 'యేసు అతనితో ఇలా అన్నాడు: “నక్కలకు బొరియలు[a] ఉన్నాయి; ఆకాశ పక్షులకు[b] గూళ్లు ఉన్నాయి. కానీ మనుష్యకుమారునికి[c] తల వాల్చడానికి చోటు లేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బొరియలు” అనే పదాన్ని “గుహలు” లేదా “తలదాచుకునే స్థలాలు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “ఆకాశంలోని పక్షులు”; సంప్రదాయ అనువాదాల్లో “గాలి పక్షులు” అని కూడా ఉంటుంది.
    reason: lexical_alternative
  - marker: c
    text: “మనుష్యకుమారుడు” అనేది యేసు తనను తాను సూచించుకోవడానికి ఉపయోగించిన బిరుదు; ఇది దానియేలు 7:13–14ను ప్రతిధ్వనింపజేయవచ్చు.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλώπεκες
  choice: నక్కలు
  rationale: సందర్భంలో సాధారణ జంతువునే సూచించే నేరమైన, సహజమైన తెలుగు పదం.
- source_word: φωλεοὺς
  choice: బొరియలు
  rationale: నక్కలు తలదాచుకునే నేలలోని నివాస స్థలాలను సహజంగా సూచిస్తుంది; మూలంలోని దృశ్యరూపాన్ని నిలుపుతుంది.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: ఆకాశ పక్షులు
  rationale: గ్రీకు షష్ఠీవిభక్తి పదబంధానికి దగ్గరగా ఉండి, ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: κατασκηνώσεις
  choice: గూళ్లు
  rationale: స్థిరపడే లేదా నివసించే ప్రదేశాలు అనే మూలార్థాన్ని పక్షుల సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: యేసు తనను తాను సూచించుకోవడానికి ఉపయోగించిన గుర్తింపు పొందిన బిరుదును వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: ποῦ
  choice: చోటు లేదు
  rationale: οὐκ ἔχει ποῦ అనే నిషేధార్థక గ్రీకు ప్రయోగాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: κλίνῃ τὴν κεφαλήν
  choice: తల వాల్చడానికి
  rationale: విశ్రాంతి తీసుకోవడానికి స్థలం ఉండటాన్ని సూచించే స్పష్టమైన దృశ్యరూపాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: δὲ
  choice: కానీ
  rationale: జంతువులకు నివాస స్థలాలు ఉండటానికి, మనుష్యకుమారునికి లేకపోవటానికి మధ్యనున్న వ్యత్యాసాన్ని స్పష్టంగా చూపుతుంది.
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: యేసు అతనితో ఇలా అన్నాడు
  rationale: గ్రీకు కథన పరిచయాన్ని నేరుగా, సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
theological_decisions:
- issue: υἱὸς τοῦ ἀνθρώπου అనే యేసు స్వీయ-సూచనను అనువదించడం
  choice: మనుష్యకుమారుడు
  alternative: మానవుడు
  rationale: సాంప్రదాయంగా గుర్తింపు పొందిన బిరుదును నిలుపుతూ, దాని సాధారణ మానవార్థం మరియు దానియేలు 7తో ఉండగల ప్రతిధ్వని మధ్యనున్న అర్థ ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. “మనుష్యకుమారుడు” అనే స్థిరమైన బైబిలు బిరుదు నిలుపబడింది; “తల వాల్చడానికి చోటు లేదు” మూలంలోని నిరాశ్రయత దృశ్యాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా అందిస్తుంది.
