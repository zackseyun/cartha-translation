source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος καὶ οἱ σὺν αὐτῷ ἦσαν βεβαρημένοι ὕπνῳ· διαγρηγορήσαντες δὲ εἶδον τὴν δόξαν αὐτοῦ καὶ τοὺς δύο ἄνδρας τοὺς συνεστῶτας αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/032.yaml
  text: Peter and those with him were weighed down with sleep; but when they became fully awake[a], they saw his glory and the two men standing with him.
translation:
  language: te
  text: పేతురు, అతనితో ఉన్నవారు నిద్రభారంతో కుంగిపోయి ఉన్నారు; అయితే వారు పూర్తిగా మేల్కొన్నప్పుడు[a], ఆయన మహిమను, ఆయనతో నిలబడి ఉన్న ఆ ఇద్దరు మనుషులను చూశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మేల్కొన్న తర్వాత,” లేదా “వారు పూర్తిగా మెలకువలోకి వచ్చాక.” ఈ గ్రీకు క్రియ అరుదైనది; వారు అంతసేపూ మేల్కొనే ఉన్నారని కాక, పూర్తిగా మెలకువలోకి రావడాన్ని ఇది నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαρημένοι ὕπνῳ
  choice: నిద్రభారంతో కుంగిపోయి ఉన్నారు
  rationale: βαρέω అనే క్రియలోని ‘భారంతో అణగిపోవడం’ అనే రూపకాన్ని నిలుపుతూ, కేవలం ‘నిద్రమత్తుగా ఉన్నారు’ అన్నదానికంటే నిద్ర వారిని బలంగా ఆవరించిన స్థితిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: διαγρηγορήσαντες
  choice: వారు పూర్తిగా మేల్కొన్నప్పుడు
  rationale: అరుదైన ఈ క్రియను, ముందున్న నిద్రభార స్థితికి వ్యతిరేకంగా, పూర్తిగా మెలకువలోకి వచ్చినట్లు అర్థం చేసుకుంటుంది. వారు అంతసేపూ మేల్కొనే ఉన్నారని అనవసరంగా సూచించదు; పదంలోని అనిశ్చితిని పాదటిప్పణిలో తెలియజేస్తుంది.
- source_word: δόξαν
  choice: మహిమను
  rationale: δόξα యొక్క దృశ్య వైభవాన్నీ, రూపాంతర సంఘటనలోని విస్తృత బైబిలు-దైవశాస్త్ర ప్రతిధ్వనినీ ‘మహిమ’ సహజంగా కాపాడుతుంది.
- source_word: τοὺς δύο ἄνδρας
  choice: ఆ ఇద్దరు మనుషులను
  rationale: ἀνήρ ఇక్కడ సందర్భంలో మోషే, ఏలీయా అనే ఇద్దరు వయోజన పురుషులను సూచిస్తుంది. ‘ఆ ఇద్దరు మనుషులు’ అనేది తెలుగులో స్పష్టమైన, సాధారణ వ్యక్తీకరణ.
- source_word: τοὺς συνεστῶτας αὐτῷ
  choice: ఆయనతో నిలబడి ఉన్న
  rationale: సυνίστημι యొక్క ఇక్కడి అకర్మక భావమైన ఆయనతో కలిసి అక్కడ నిలిచి ఉండడాన్ని దృశ్యాత్మకంగా, సహజంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మొదటి δέ తెలుగులో ప్రత్యేక పదం లేకుండానే అంశ మార్పుగా సహజంగా వ్యక్తమవుతుంది; రెండవ δέ నిద్రభార స్థితికీ వారు చూసిన దృశ్యానికీ మధ్య వ్యత్యాసాన్ని ‘అయితే’ ద్వారా సూచిస్తుంది.
theological_decisions:
- issue: రూపాంతర సందర్భంలో δόξα అనువాదం
  choice: ఆయన మహిమను
  alternative: ఆయన తేజస్సును / ఆయన వైభవాన్ని
  rationale: ‘మహిమ’ కనిపించిన ప్రకాశవంతమైన ప్రత్యక్షతను సూచిస్తూనే, దాని స్వభావాన్ని అనువాదంలో అతిగా నిర్వచించకుండా బైబిలు అంతటా ఉన్న దైవశాస్త్ర సంబంధాన్ని కాపాడుతుంది.
- issue: διαγρηγορήσαντες యొక్క అర్థం
  choice: వారు పూర్తిగా మేల్కొన్నప్పుడు
  alternative: వారు మేల్కొనే ఉన్నప్పుడు / మేల్కొన్న తర్వాత
  rationale: ముందటి వాక్యభాగంలో వారు నిద్రభారంతో కుంగిపోయినట్లు ఉన్నందున, ఇక్కడ పూర్తిగా మెలకువలోకి రావడం సందర్భానికి అనుకూలం. అయినా అరుదైన గ్రీకు క్రియకు ‘మేల్కొనే ఉండడం’ అనే అర్థసాధ్యతను పూర్తిగా తొలగించకుండా పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘నిద్రభారం,’ ‘మహిమ’ వంటి పదాలు మూలంలోని రూపకాన్నీ బైబిలు ప్రతిధ్వనినీ నిలుపుతాయి; అరుదైన క్రియలోని నిజమైన అనిశ్చితిని పాదటిప్పణి కాపాడుతుంది.
