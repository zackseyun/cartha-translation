source:
  edition: SBLGNT
  text: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν τοὺς λόγους τούτους, ὁ γὰρ υἱὸς τοῦ ἀνθρώπου μέλλει παραδίδοσθαι εἰς χεῖρας ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/044.yaml
  text: Put these words into your ears[b][a], for the Son of Man is about to be handed over into the hands of men.
translation:
  language: te
  text: “ఈ మాటలను మీ చెవుల్లో పెట్టుకోండి, ఎందుకంటే మనుష్య కుమారుడు మనుష్యుల చేతుల్లోకి అప్పగించబడబోతున్నాడు[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ద్రోహం చేయబడబోతున్నాడు.” గ్రీకు క్రియకు ‘అప్పగించు,’ ‘చేతికప్పగించు,’ లేదా కొన్ని సందర్భాల్లో ‘ద్రోహం చేయు’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν
  choice: ఈ మాటలను మీ చెవుల్లో పెట్టుకోండి
  rationale: గ్రీకు వాక్యంలోని సజీవమైన ‘చెవుల్లో పెట్టుకోవడం’ అనే రూపకాన్ని నిలుపుతూ, ఉద్దేశపూర్వకంగా విని జ్ఞాపకం ఉంచుకోవాలనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. ప్రత్యేకంగా ఉన్న ὑμεῖς ఇచ్చే నొక్కిచెప్పే భావం ప్రత్యక్ష ఆజ్ఞలో సహజంగా వ్యక్తమవుతుంది.
- source_word: τοὺς λόγους τούτους
  choice: ఈ మాటలను
  rationale: యేసు వెంటనే చెప్పబోయే నిర్దిష్ట ప్రకటనను సూచిస్తున్నందున ‘మాటలు’ ప్రత్యక్షమైన, సహజమైన అనువాదం.
- source_word: ὁ γὰρ
  choice: ఎందుకంటే
  rationale: γάρ ముందున్న ఆజ్ఞకు కారణాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘ఎందుకంటే’ ఈ సంబంధాన్ని స్పష్టంగా, సహజంగా చూపిస్తుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: యేసు స్వీయ నిర్దేశక బిరుదును, దాని దానియేలు గ్రంథ సంబంధిత మరియు ధార్మిక ప్రతిధ్వనిని వ్యాఖ్యానాత్మకంగా కుదించకుండా సంప్రదాయబద్ధంగా నిలుపుతుంది.
- source_word: μέλλει
  choice: బోతున్నాడు
  rationale: జరగబోయే సమీప ఘటనను సూచించే μέλλω భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; విధి నిర్ణయించబడిందనే అదనపు భావాన్ని చేర్చదు.
- source_word: παραδίδοσθαι
  choice: అప్పగించబడబోతున్నాడు
  rationale: క్రియ యొక్క కర్మణి రూపాన్నీ, ఇతరుల అధికారంలోకి ఇవ్వబడే విస్తృత భావాన్నీ నిలుపుతుంది; దానిని కేవలం ‘ద్రోహం చేయబడటం’ అనే అర్థానికి పరిమితం చేయదు.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: మనుష్యుల చేతుల్లోకి
  rationale: ఎవరి అధికారానికో లోబడటం అనే మూలభాషా నుడికారాన్ని తెలుగులో సహజంగా నిలుపుతుంది. ἀνθρώπων ఇక్కడ సాధారణంగా మానవులను సూచిస్తుంది; ‘మనుష్య కుమారుడు—మనుష్యులు’ అనే పదసంబంధాన్నీ కాపాడుతుంది.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου అనే బిరుదు
  choice: మనుష్య కుమారుడు
  alternative: మానవ కుమారుడు / మానవుడు
  rationale: స్థిరపడిన అక్షరార్థ బిరుదు మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను, దానియేలు 7 ప్రతిధ్వనిని, క్రీస్తు సంబంధిత ప్రాధాన్యాన్ని వ్యాఖ్యానాత్మకంగా పరిష్కరించకుండా నిలుపుతుంది.
- issue: παραδίδοσθαι యొక్క అర్థ పరిధి
  choice: అప్పగించబడబోతున్నాడు
  alternative: ద్రోహం చేయబడబోతున్నాడు
  rationale: ఇక్కడ యేసు మానవుల అధికారంలోకి అప్పగించబడే విస్తృత ఘటన ముందుగా చెప్పబడుతోంది. ‘ద్రోహం’ అని అనువదిస్తే యూదా చర్యకు మాత్రమే అర్థాన్ని ముందుగానే కుదించే ప్రమాదం ఉంది.
- issue: ἀνθρώπων యొక్క పరిధి
  choice: మనుష్యుల
  alternative: పురుషుల
  rationale: ἀνθρώπων ఈ సందర్భంలో లింగాన్ని ప్రత్యేకంగా గుర్తించకుండా మానవులనే సూచిస్తుంది. ‘మనుష్యుల’ అనేది మూలంలోని ‘మనుష్య కుమారుడు—మనుష్యులు’ అనే వ్యత్యాసాన్ని నిలుపుతూ తెలుగులో సరైన విస్తృత అర్థాన్ని ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి ఉపయోగించబడింది. ‘మీ చెవుల్లో పెట్టుకోండి’ అనే ఉద్దేశపూర్వకంగా సజీవమైన నుడికారాన్ని నిలిపి, ‘చేతుల్లోకి అప్పగించబడటం’ అనే అధికారానికి లోబడే రూపకాన్నీ సంరక్షించాం. ప్రత్యక్ష ఉద్ధరణగా విరామచిహ్నాలు అమర్చబడ్డాయి.
