id: LUK.9.48
reference: Luke 9:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὃς ⸀ἂν δέξηται τοῦτο τὸ παιδίον ἐπὶ τῷ ὀνόματί μου ἐμὲ δέχεται, καὶ ὃς ⸁ἂν ἐμὲ δέξηται δέχεται τὸν ἀποστείλαντά με· ὁ γὰρ μικρότερος ἐν πᾶσιν ὑμῖν ὑπάρχων οὗτός ⸀ἐστιν μέγας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/048.yaml
  text: And he said to them[a], “Whoever receives this child in my name receives me, and whoever receives me receives the one who sent me[b]. For the one who is least among all of you—this one is great.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “ఈ బిడ్డను నా నామంలో[a] స్వీకరించేవాడు నన్ను స్వీకరిస్తాడు; నన్ను స్వీకరించేవాడు నన్ను పంపినవానిని స్వీకరిస్తాడు. ఎందుకంటే మీ అందరిలో అతి అల్పుడైనవాడే గొప్పవాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘స్వీకరించు’ అనే మాటను ‘ఆదరించు’ లేదా ‘ఆహ్వానించు’ అని కూడా అనువదించవచ్చు; గ్రీకు క్రియలో అంగీకరించడం, ఆతిథ్యంతో ఆదరించడం అనే భావాలు రెండూ ఉన్నాయి. ‘నా నామంలో’ అంటే ‘నా నామం ఆధారంగా’ లేదా ‘నా నామం కారణంగా’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξηται / δέχεται
  choice: చేర్చుకుంటారో / చేర్చుకుంటారు
  rationale: δέχομαιలో స్వీకరించడం, ఆహ్వానించి ఆదరించడం అనే భావాలు రెండూ ఉన్నాయి. ‘చేర్చుకోవడం’ వ్యక్తిని అంగీకరించి ఆదరించే భావాన్ని సహజమైన తెలుగులో ఇస్తూ, వాక్యమంతటా ఉన్న క్రియాపునరుక్తిని నిలుపుతుంది.
- source_word: παιδίον
  choice: బిడ్డ
  rationale: παιδίονకు సాధారణ అర్థం బిడ్డ లేదా చిన్నపిల్ల. సందర్భానికి తగిన, సహజమైన ఆధునిక తెలుగు పదంగా ‘బిడ్డ’ ఎంచుకోబడింది.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: నా నామంలో
  rationale: ఈ పదబంధం యేసు నామం, అధికారం లేదా ఆయనతో అనుబంధం ఆధారంగా బిడ్డను చేర్చుకోవడాన్ని సూచిస్తుంది. ‘నా నామంలో’ ఈ విస్తృతిని కుదించకుండా నిలుపుతుంది.
- source_word: τὸν ἀποστείλαντά με
  choice: నన్ను పంపినవానిని
  rationale: గ్రీకులో ఉన్న నామవాచకార్థక కృదంతాన్ని వ్యక్తిగత సూచనతో, అదనపు బిరుదును చేర్చకుండా అనువదిస్తుంది.
- source_word: μικρότερος
  choice: అత్యల్పుడు
  rationale: తులనాత్మక రూపమైనప్పటికీ ఇక్కడ శారీరక పరిమాణం లేదా వయస్సుకన్నా సమూహంలోని అల్పస్థితి ప్రధానంగా ఉంది. ‘అత్యల్పుడు’ ఆ సామాజిక భావాన్ని తెలియజేస్తుంది.
- source_word: ἐν πᾶσιν ὑμῖν
  choice: మీ అందరిలో
  rationale: సమూహంలోని స్థానాన్ని సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: ὑπάρχων
  choice: ఉన్నవాడు
  rationale: కృదంతాన్ని తెలుగులో సహజమైన సంబంధార్థక నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: οὗτός ἐστιν μέγας
  choice: ఉన్నవాడే గొప్పవాడు
  rationale: ‘వాడే’ అనే నిశ్చయార్థక రూపం οὗτοςలోని ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: Ὃς ἂν ... καὶ ὃς ἂν
  choice: ఎవరు ... వారూ / ఎవరు ... వారూ
  rationale: ἄνతో కూడిన సంబంధ వాక్యాలు సాధారణ, అనిర్దిష్ట షరతును వ్యక్తం చేస్తాయి; తెలుగు ‘ఎవరు...వారు’ నిర్మాణం దానికి సహజ సమానం.
- source_word: καὶ εἶπεν αὐτοῖς
  choice: ఆయన వారితో ఇలా అన్నాడు
  rationale: కథన ప్రవేశాన్ని సహజమైన తెలుగులో అందిస్తుంది; ‘ఇలా’ తరువాతి ప్రత్యక్ష వాక్యాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
theological_decisions:
- issue: ‘నన్ను పంపినవాడు’ అనే మాటకు సూచిత వ్యక్తి
  choice: తండ్రి లేదా దేవుడు అని అనువాదంలో విస్తరించకుండా, ‘నన్ను పంపినవాడు’ అనే పరోక్ష సూచనను నిలుపడం
  alternative: ‘నన్ను పంపిన తండ్రి’ లేదా ‘నన్ను పంపిన దేవుడు’
  rationale: మూలపాఠం వ్యక్తిని పేరుతో పేర్కొనకుండా నామవాచకార్థక కృదంతాన్ని వాడుతుంది. యేసు పంపబడినవాడనే సంబంధాన్ని నిలుపుతూ, మూలంలో లేని స్పష్టీకరణను చేర్చకూడదు.
- issue: బిడ్డను ‘నా నామంలో’ చేర్చుకోవడం
  choice: యేసు నామం, అధికారం, ఆయనతో అనుబంధం అనే విస్తృత సంబంధాన్ని నిలుపడం
  alternative: ‘నా నిమిత్తం’ లేదా ‘ఆ బిడ్డ నాకు చెందినవాడు కాబట్టి’
  rationale: ఈ పదబంధాన్ని కేవలం సాధారణ దయగా గానీ, ఒకే కారణార్థంగా గానీ కుదించకుండా ప్రతినిధిత్వం మరియు విధేయతకు సంబంధించిన భావాన్ని తెరిచి ఉంచుతుంది.
- issue: గొప్పతనపు విరోధాభాసం
  choice: సమాజంలో అత్యల్ప స్థితిలో ఉన్నవాడే గొప్పవాడని నేరుగా వ్యక్తపరచడం
  alternative: ‘మీ అందరిలో అతి చిన్నవయస్కుడే గొప్పవాడు’
  rationale: μικρότερος ఇక్కడ వయస్సును మాత్రమే కాక అల్పస్థితి లేదా వినయాన్ని సూచిస్తుంది. యేసు చెప్పిన విలువల తారుమారును మృదుపరచకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని క్రియాపునరుక్తి, పంపినవాని పరోక్ష సూచన, అత్యల్పుడు–గొప్పవాడు అనే విరోధాభాసం నిలుపబడ్డాయి. ఒకే పాదసూచికలో పరస్పర సంబంధిత పదార్థ ప్రత్యామ్నాయాలు సంక్షిప్తంగా ఇవ్వబడ్డాయి.
