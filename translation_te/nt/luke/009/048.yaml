revisions:
- from: 'ఆయన వారితో ఇలా అన్నాడు: “నా నామంలో ఈ బిడ్డను ఎవరు చేర్చుకుంటారో వారు నన్ను చేర్చుకుంటారు; నన్ను ఎవరు చేర్చుకుంటారో వారు నన్ను పంపినవానిని చేర్చుకుంటారు. ఎందుకంటే మీ అందరిలో అత్యల్పుడిగా ఉన్నవాడే గొప్పవాడు.”[a]'
  to: 'ఆయన వారితో ఇలా అన్నాడు: “ఈ బిడ్డను నా నామంలో[a] స్వీకరించేవాడు నన్ను స్వీకరిస్తాడు; నన్ను స్వీకరించేవాడు నన్ను పంపినవానిని స్వీకరిస్తాడు. ఎందుకంటే మీ అందరిలో అతి అల్పుడైనవాడే గొప్పవాడు.”'
  rationale: The revision replaces a potentially narrower Telugu verb with ‘స్వీకరించు,’ maintaining the Greek verbal repetition and its inclusive sense of reception. It also uses a natural singular generalizing construction, retains the sender’s unnamed reference, and renders μικρότερος as low social standing. The footnote is retained with its marker placed at the relevant phrase.
