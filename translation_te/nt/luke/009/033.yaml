id: LUK.9.33
reference: Luke 9:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ εἶπεν ⸀ὁ Πέτρος πρὸς τὸν Ἰησοῦν· Ἐπιστάτα, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν σκηνὰς τρεῖς, μίαν σοὶ καὶ μίαν Μωϋσεῖ καὶ μίαν Ἠλίᾳ, μὴ εἰδὼς ὃ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/033.yaml
  text: 'And as they were departing from him[a], Peter said to Jesus, “Master, it is good for us to be here. Let us make three shelters: one for you, one for Moses, and one for Elijah” — not knowing what he was saying.'
translation:
  language: te
  text: 'వారు ఆయనను విడిచి వెళ్తుండగా, పేతురు యేసుతో ఇలా అన్నాడు: “గురువా, మనం ఇక్కడ ఉండడం మంచిది. మూడు గుడారాలు[a] వేద్దాం—ఒకటి మీకు, ఒకటి మోషేకు, ఒకటి ఏలీయాకు.” తాను ఏమి చెబుతున్నాడో తెలియకుండానే అతడు ఇలా అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పందిళ్లు,” “తాత్కాలిక ఆశ్రయాలు.” గ్రీకు పదం తాత్కాలిక గుడారాలను సూచిస్తుంది; అది పర్ణశాలల పండుగకు సంబంధించిన బైబిలు ప్రతిధ్వనిని కూడా సూచించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ
  choice: వారు ఆయనను విడిచి వెళ్తుండగా
  rationale: ἐγένετο ἐν τῷ + infinitive అనే కథన నిర్మాణాన్ని తెలుగులో సహజమైన సమకాలిక క్రియారూపంతో తెలిపింది. αὐτούς అనేది సందర్భంలో మోషే, ఏలీయాలను; ἀπ’ αὐτοῦ అనేది యేసు నుండి విడిపోవడాన్ని సూచిస్తుంది.
- source_word: Ἐπιστάτα
  choice: ప్రభూ
  rationale: లూకా ప్రత్యేకంగా వాడే ఈ గౌరవ సంబోధన యేసు అధికారాన్ని గుర్తిస్తుంది. ‘బోధకుడా’ అని అనువదిస్తే διδάσκαλεతో ఉన్న భేదం చెరిగిపోతుంది; ‘ప్రభూ’ ఆధునిక తెలుగులో సహజమైన గౌరవ సంబోధనగా అధికార భావాన్ని అందిస్తుంది, అయితే κύριοςతో పదస్థాయి భేదం తెలుగులో పూర్తిగా నిలవదు.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: మనం ఇక్కడ ఉండడం మంచిది
  rationale: καλόν యొక్క సాధారణ మూల్యాంకన భావాన్నీ, infinitival construction భావాన్నీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ποιήσωμεν
  choice: వేద్దాం
  rationale: మొదటి పురుష బహువచన hortatory subjunctiveను ప్రతిపాదనగా నేరుగా తెలియజేస్తుంది. గుడారాల సందర్భంలో ‘వేద్దాం’ అనేది తెలుగులో సహజం; ‘నిర్మిద్దాం’ మూలపదానికి మించిన శాశ్వత నిర్మాణ భావాన్ని కలిగించవచ్చు.
- source_word: σκηνὰς
  choice: గుడారాలు
  rationale: తాత్కాలిక ఆశ్రయాల భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందించే సహజ తెలుగు పదం. పర్ణశాలల పండుగ లేదా ప్రత్యక్ష గుడారంతో ఉండగల ప్రతిధ్వనిని ప్రధాన పాఠ్యంలో నిర్ధారించకుండా పాదసూచికలో ఉంచింది.
- source_word: μὴ εἰδὼς ὃ λέγει
  choice: తాను ఏమి చెబుతున్నాడో అతనికి తెలియలేదు
  rationale: పేతురు మాట్లాడుతున్న ఆ క్షణంలో తన మాటల తాత్పర్యం గ్రహించని స్థితిని తెలియజేస్తుంది. λέγει యొక్క వర్తమాన దృక్కోణాన్ని ‘చెబుతున్నాడో’ నిలుపుతుంది.
theological_decisions:
- issue: రూపాంతర సందర్భంలో σκηνάςకు పండుగ లేదా ప్రత్యక్ష గుడారపు సూచన ఉండవచ్చా?
  choice: ప్రధాన పాఠ్యంలో ‘గుడారాలు’
  alternative: పందిళ్లు; తాత్కాలిక నివాసాలు; పర్ణశాలలు
  rationale: ఈ వాక్యం వాటిని పర్ణశాలల పండుగతో గానీ ప్రత్యక్ష గుడారంతో గానీ స్పష్టంగా సమానపరచదు. అందువల్ల ప్రధాన పాఠ్యం తటస్థమైన అర్థాన్ని ఇస్తూ, సాధ్యమైన బైబిలు ప్రతిధ్వనిని పాదసూచికలో సంరక్షిస్తుంది.
- issue: Ἐπιστάτα అనే అధికారపూర్వక సంబోధనను ఎలా అందించాలి?
  choice: ప్రభూ
  alternative: గురువా; బోధకుడా; నాయకా
  rationale: ‘ప్రభూ’ గౌరవం మరియు అధికార భావాన్ని సహజంగా అందిస్తుంది. ఇది ఇక్కడ κύριος అనే పదం ఉందని నిర్ధారించే ఉద్దేశంతో కాదు; ἐπιστάτηςకు సందర్భానుగుణ సంబోధనగా వాడబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. యేసును నేరుగా సంబోధించేటప్పుడు తెలుగు గౌరవ బహువచనమైన ‘మీకు’ ఉపయోగించబడింది; ఇది గ్రీకు ఏకవచన సంబోధనకు సామాజికంగా సహజమైన తెలుగు సమానార్థకం. పాదసూచిక గుర్తు సంబంధిత ‘గుడారాలు’ పదం వెంట ఉంచబడింది.
