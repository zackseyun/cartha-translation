  yaml_path: translation/nt/luke/009/015.yaml
  text: And they did so[a], and had them all sit down.
translation:
  language: te
  text: వారు అలాగే చేసి, అందరినీ కూర్చోబెట్టారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “అందరినీ కూర్చునేలా చేశారు” లేదా “అందరినీ ఆనుకొని పడుకునేలా చేశారు.” గ్రీకు క్రియ భోజనం కోసం ప్రజలను అమర్చడాన్ని సూచిస్తుంది; ఆ కాలంలో భోజనం చేసేటప్పుడు ఆనుకొని పడుకోవడం సాధారణంగా ఉండేది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: వారు
  rationale: తెలుగులో సహజమైన కథన ప్రవాహం కోసం వాక్యారంభంలోని సంధానార్థక καὶని ప్రత్యేకంగా ‘మరియు’ అని అనువదించకుండా, క్రియలో అంతర్లీనంగా ఉన్న కర్తను ‘వారు’ అని వ్యక్తం చేశాం; ఇది ముందటి వాక్యంలోని శిష్యులను సూచిస్తుంది.
- source_word: ἐποίησαν οὕτως
  choice: అలాగే చేసి
  rationale: యేసు ముందుగా చెప్పిన విధంగానే వారు చేశారనే పునఃసూచనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: καὶ
  choice: —
  rationale: రెండవ καὶ సూచించే వరుస చర్యను తెలుగులో ‘చేసి’ అనే అసమాపక క్రియ సహజంగా కలుపుతుంది; అదనంగా ‘మరియు’ చేర్చడం కృత్రిమంగా ఉంటుంది.
- source_word: κατέκλιναν
  choice: కూర్చోబెట్టారు
  rationale: κατακλίνω ఇక్కడ భోజనం కోసం ప్రజలను కూర్చునే లేదా ఆనుకునే స్థితిలో అమర్చడం అనే కారణార్థక భావాన్ని కలిగి ఉంది. ‘కూర్చోబెట్టారు’ ఆ కారణార్థకతను స్పష్టంగా, సహజంగా అందిస్తుంది; ప్రాచీన భోజనపు ఆనుకునే భంగిమను పాదసూచికలో నిలుపుతున్నాం.
- source_word: ἅπαντας
  choice: అందరినీ
  rationale: సమూహంలోని వారందరినీ మినహాయింపు లేకుండా సూచించే సంపూర్ణతను సహజంగా వ్యక్తం చేస్తుంది.
