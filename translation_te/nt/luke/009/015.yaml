translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన కథన శైలి. ‘కూర్చోబెట్టారు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండగా, మూలంలోని ప్రాచీన భోజన భంగిమను పాదసూచిక వివరిస్తుంది.
