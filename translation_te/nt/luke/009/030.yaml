id: LUK.9.30
reference: Luke 9:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄνδρες δύο συνελάλουν αὐτῷ, οἵτινες ἦσαν Μωϋσῆς καὶ Ἠλίας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/030.yaml
  text: And behold, two men were talking with him, who were Moses and Elijah,
translation:
  language: te
  text: ఇదిగో, ఇద్దరు మనుషులు ఆయనతో మాట్లాడుతున్నారు. వారు మోషే, ఏలీయా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: కథనంలో అకస్మాత్తుగా దృష్టిని ఆకర్షించే లూకా ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἄνδρες δύο
  choice: ఇద్దరు మనుషులు
  rationale: ఇక్కడ మోషే, ఏలీయా అనే ఇద్దరు పురుష వ్యక్తులను సూచిస్తుంది; ‘ఇద్దరు మనుషులు’ స్పష్టమైన, సహజమైన అనువాదం.
- source_word: συνελάλουν
  choice: మాట్లాడుతున్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న సంభాషణను సూచిస్తుంది; తెలుగు సందర్భంలో వర్తమాన కథనరీతి ఆ దృశ్యాన్ని సహజంగా, సజీవంగా అందిస్తుంది.
- source_word: αὐτῷ
  choice: ఆయనతో
  rationale: συλλαλέωతో వచ్చిన చతుర్థీ విభక్తి పరస్పర సంభాషణలో ఎవరితో మాట్లాడుతున్నారో సూచిస్తుంది.
- source_word: οἵτινες
  choice: వారు
  rationale: ముందు చెప్పిన ఇద్దరినీ నేరుగా గుర్తిస్తూ, తెలుగులో భారమైన సంబంధవాచక నిర్మాణాన్ని నివారిస్తుంది.
- source_word: Μωϋσῆς
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: Ἠλίας
  choice: ఏలీయా
  rationale: హీబ్రూ ప్రవక్త పేరుకు తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపం.
theological_decisions:
- issue: రూపాంతర దృశ్యంలోని ఇద్దరి గుర్తింపు
  choice: ఆ ఇద్దరు మనుషులను మోషే, ఏలీయా అని నేరుగా గుర్తించడం
  alternative: వారి ప్రతీకాత్మక లేదా అంత్యకాల ప్రాముఖ్యతను వివరణగా చేర్చడం
  rationale: మూలపాఠం వారి పేర్లను మాత్రమే నేరుగా తెలియజేస్తుంది; ప్రతీకాత్మక లేదా సిద్ధాంతపరమైన వివరణను అనువాదంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇదిగో’ ద్వారా మూలంలోని దృష్టి ఆకర్షణ నిలుపబడింది; చిన్న వాక్య విభజన పఠనసౌలభ్యాన్ని పెంచుతుంది.
