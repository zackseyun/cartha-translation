id: LUK.9.38
reference: Luke 9:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἀνὴρ ἀπὸ τοῦ ὄχλου ⸀ἐβόησεν λέγων· Διδάσκαλε, δέομαί σου ἐπιβλέψαι ἐπὶ τὸν υἱόν μου, ὅτι μονογενής ⸂μοί ἐστιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/038.yaml
  text: And behold[a], a man from the crowd cried out, saying, “Teacher, I beg you to look upon my son, because he is my only child.”
translation:
  language: te
  text: 'ఇదిగో, జనసమూహంలోనుండి ఒక మనిషి కేక వేసి ఇలా అన్నాడు: “బోధకుడా, నా కుమారుణ్ణి చూడమని నిన్ను వేడుకుంటున్నాను; ఎందుకంటే అతడే నాకు ఏకైక కుమారుడు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ఏకైక సంతానం.” గ్రీకులో అక్షరార్థంగా, “అతడు నాకు ఏకైకుడు” అని ఉంది. సందర్భంలో అతణ్ణి ఇప్పటికే కుమారుడని పేర్కొన్నందున “ఏకైక కుమారుడు,” “ఏకైక సంతానం” అనే రెండు అనువాదాలూ సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: కథనంలో శ్రోత దృష్టిని ఆకర్షించే గ్రీకు సంభాషణ సూచక బలాన్ని సహజమైన తెలుగు పదంతో నిలుపుతుంది.
- source_word: ἀνὴρ
  choice: ఒక మనిషి
  rationale: ఈ నామవాచకం వయోజన పురుషుణ్ణి సూచిస్తుంది; ఆధునిక తెలుగులో సందర్భానికి సహజంగా ఉండే లింగనిర్దిష్ట భావాన్ని ఇస్తుంది.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: జనసమూహంలోనుండి
  rationale: ఆ వ్యక్తి అక్కడ కూడిన జనసమూహానికి చెందినవాడిగా మాట్లాడాడనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐβόησεν
  choice: బిగ్గరగా ... అన్నాడు
  rationale: అతని అత్యవసరమైన, గట్టిగా చేసిన పిలుపును అతిశయోక్తి లేకుండా వ్యక్తపరుస్తుంది.
- source_word: λέγων
  choice: ఇలా అన్నాడు
  rationale: గ్రీకు కృదంత సంబంధాన్ని తెలుగులో సహజమైన ప్రత్యక్ష వాక్య పరిచయంగా అందిస్తుంది.
- source_word: Διδάσκαλε
  choice: బోధకుడా
  rationale: Διδάσκαλος యొక్క ప్రత్యక్ష అర్థమైన బోధించే వ్యక్తిని సూచిస్తుంది; ‘ప్రభువా’ వంటి అదనపు అధికార లేదా దైవార్థ ఛాయను చేర్చదు.
- source_word: δέομαί σου
  choice: నిన్ను వేడుకుంటున్నాను
  rationale: సాధారణ అభ్యర్థనకంటే బలమైన, దీనమైన మనవిని ఆధునిక గౌరవప్రద తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπιβλέψαι ἐπὶ
  choice: దయతో చూడమని
  rationale: కేవలం కంటితో చూడడం కాక శ్రద్ధ చూపి సహాయం చేయాలనే సందర్భోచిత భావాన్ని అందిస్తుంది; ‘దయతో’ అనేది మనవి సందర్భంలో ఉన్న కరుణాపూర్వక దృష్టిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸν υἱόν μου
  choice: నా కుమారుణ్ణి
  rationale: మూలంలోని సంబంధాన్ని, పురుష లింగాన్ని నేరుగా నిలుపుతుంది.
- source_word: μονογενής
  choice: ఒక్కడే కుమారుడు
  rationale: ముందే ‘కుమారుడు’గా గుర్తించిన సందర్భంలో అతడు తండ్రికి ఏకైక కుమారుడని తెలుపుతుంది; అయితే ‘ఏకైక సంతానం’ అనే అర్థసాధ్యతను పాదసూచికలో నిలుపుతుంది.
- source_word: μοί ἐστιν
  choice: అతడు నాకు
  rationale: గ్రీకు దత్తివిభక్తితో కూడిన εἰμί ఇక్కడ స్వామ్య సంబంధాన్ని సూచిస్తుంది; తెలుగు ‘నాకు’ ఆ నిర్మాణాన్ని సహజంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: μονογενής యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘ఒక్కడే కుమారుడు’
  alternative: ‘ఏకైక సంతానం’
  rationale: υἱός ముందే కుమారుడని స్పష్టం చేస్తుంది. μονογενής అతని ఏకైకత్వాన్ని నొక్కి చెబుతుంది; అది ఏకైక కుమారుడా లేక ఏకైక సంతానమా అనే స్వల్ప సందిగ్ధతను పాదసూచిక ద్వారా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. ‘ఇదిగో’ ద్వారా లూకా కథనంలోని దృష్టి-ఆకర్షక లక్షణాన్ని నిలిపి, తండ్రి మనవిలోని అత్యవసరతను సహజమైన మాటలతో వ్యక్తం చేసింది.
