id: LUK.9.23
reference: Luke 9:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ πρὸς πάντας· Εἴ τις θέλει ὀπίσω μου ⸂ἔρχεσθαι, ἀρνησάσθω⸃ ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ ⸂καθ’ ἡμέραν⸃, καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/023.yaml
  text: And he was saying to all[a], “If anyone wants to come after me, let him deny himself and take up his cross daily, and follow me.”
translation:
  language: te
  text: 'ఆయన అందరితో ఇలా చెబుతూ ఉన్నాడు: “ఎవరైనా[a] నా వెనుక రావాలని కోరుకుంటే, తనను తాను నిరాకరించుకొని, ప్రతిరోజూ తన సిలువను ఎత్తుకొని, నన్ను అనుసరించాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు వాక్యంలో ‘ఎవరైనా’ అనే సాధారణ ఏకవచనం ఉంది; దాని తరువాతి ఆజ్ఞలు, సర్వనామ రూపాలు వ్యాకరణపరంగా పుంలింగ ఏకవచనంలో ఉన్నాయి. తెలుగులో కర్తను మళ్లీ చెప్పకుండా ఉన్న ఈ నిర్మాణం స్త్రీ పురుషులందరికీ వర్తించే సాధారణ భావాన్ని సహజంగా తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: చెబుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న మాటను సాధ్యమైనంత సహజంగా నిలుపుతుంది; కేవలం ‘అన్నాడు’ అని అనడం ఆ కాలభావాన్ని తగ్గిస్తుంది.
- source_word: πρὸς πάντας
  choice: అందరితో
  rationale: యేసు మాటలు అక్కడున్న సమూహమంతటికీ ఉద్దేశించబడ్డాయని సూటిగా తెలియజేస్తుంది.
- source_word: Εἴ τις θέλει
  choice: ఎవరైనా ... కోరుకుంటే
  rationale: τις యొక్క అనిర్దిష్ట, సాధారణ ఏకవచన భావాన్నీ, θέλει యొక్క ఇష్టం లేదా సంకల్ప భావాన్నీ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὀπίσω μου ἔρχεσθαι
  choice: నా వెనుక రావాలని
  rationale: శిష్యత్వాన్ని సూచించే మూల రూపకాన్ని నిలుపుతుంది; చివర ఉన్న ‘అనుసరించాలి’ అనే క్రియతో ముందుగానే కలిపివేయదు.
- source_word: ἀρνησάσθω ἑαυτὸν
  choice: తనను తాను నిరాకరించుకొని
  rationale: వ్యక్తి తన స్వీయ హక్కులు లేదా స్వకేంద్రిత ఆధిపత్యాన్ని కాదనుకోవాలనే ఆజ్ఞను, అదనపు సిద్ధాంత వివరణ లేకుండా, మూలానికి దగ్గరగా అందిస్తుంది.
- source_word: ἀράτω
  choice: ఎత్తుకొని
  rationale: సిలువను స్వీకరించి ఎత్తుకోవడం అనే క్రియాత్మక రూపకాన్ని నిలుపుతుంది; కేవలం ‘మోయడం’గా మార్చదు.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: తన సిలువను
  rationale: σταυρός అనే నిర్దిష్టమైన ‘సిలువ’ పదాన్నీ, αὐτοῦ యొక్క స్వాధీన భావాన్నీ నిలుపుతుంది.
- source_word: καθ’ ἡμέραν
  choice: ప్రతిరోజూ
  rationale: ‘రోజు రోజుకు/ప్రతి రోజు’ అనే లూకా ప్రత్యేక నిరంతర శిష్యత్వ ప్రాధాన్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀκολουθείτω μοι
  choice: నన్ను అనుసరించాలి
  rationale: మూడవ పురుష ఆజ్ఞను ఆధునిక తెలుగులో సహజమైన విధిగా వ్యక్తం చేస్తూ, ముందున్న క్రియలన్నిటికీ ఆజ్ఞార్థక బలాన్ని అందిస్తుంది.
theological_decisions:
- issue: శిష్యత్వంలో ‘సిలువ’ భాష స్వరూపం
  choice: ‘సిలువ’ అనే పదాన్ని యథాతథంగా ఉంచడం
  alternative: బాధ, భారం లేదా త్యాగం అని వివరణాత్మకంగా మార్చడం
  rationale: σταυρός ఒక స్పష్టమైన చారిత్రక పదం, అదే సమయంలో రూపకార్థాన్ని కూడా మోస్తుంది. దానిని ఒకే రకమైన బాధ లేదా భారంగా పరిమితం చేయకుండా మూలంలోని గంభీరతను, ఉద్వేగాన్ని నిలుపాలి.
- issue: సాధారణ ఏకవచనం మరియు లింగ సూచన
  choice: ‘ఎవరైనా’తో సాధారణ ఏకవచనాన్ని ఉంచి, తెలుగులో సహజమైన లింగనిరపేక్ష కర్తలోప నిర్మాణాన్ని వాడడం
  alternative: ‘అతడు ... తనను’ అని పుంలింగాన్ని స్పష్టంగా చేర్చడం లేదా బహువచనంగా మార్చడం
  rationale: గ్రీకులో τις తరువాత వ్యాకరణపరంగా పుంలింగ ఏకవచన రూపాలు వస్తాయి; అయితే అవి సాధారణ వ్యక్తిని సూచిస్తాయి. తెలుగులో కర్తను మళ్లీ చెప్పకుండా ‘తనను తాను’ వాడటం ఏకవచన ప్రతినిధి భావాన్ని నిలుపుతూ అనవసరమైన జీవలింగ నిర్దిష్టతను దిగుమతి చేయదు.
- issue: మూడవ పురుష ఆజ్ఞల బలం
  choice: చివర ‘అనుసరించాలి’తో విధి/ఆజ్ఞ బలాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడం
  alternative: ‘అనుసరించుగాక’ వంటి ప్రత్యక్ష మూడవ పురుష ఆజ్ఞ రూపం
  rationale: ‘అనుసరించుగాక’ ఆధునిక సాధారణ తెలుగులో కృత్రిమంగా లేదా ఆశీర్వాదార్థకంగా వినిపించవచ్చు. ‘నిరాకరించుకొని ... ఎత్తుకొని ... అనుసరించాలి’ అనే నిర్మాణం మూడు గ్రీకు ఆజ్ఞల బలాన్ని సహజంగా కలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడింది. ‘నా వెనుక రావడం’ మరియు ‘నన్ను అనుసరించడం’ అనే వేర్వేరు మూల వ్యక్తీకరణలను నిలుపుతూ, ‘సిలువ’ రూపకాన్ని వివరణతో పరిమితం చేయలేదు.
