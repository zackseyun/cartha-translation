  terminology: “సిలువ,” “తనను తాను నిరాకరించుకొని,” and “నన్ను అనుసరించాలి” are appropriate and do not impose an interpretive theological expansion. The footnote accurately explains the generic-singular construction and the natural Telugu handling of grammatical gender.
