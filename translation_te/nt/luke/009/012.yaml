id: LUK.9.12
reference: Luke 9:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν· προσελθόντες δὲ οἱ δώδεκα εἶπαν αὐτῷ· Ἀπόλυσον τὸν ὄχλον, ἵνα ⸀πορευθέντες εἰς τὰς κύκλῳ κώμας ⸀καὶ ἀγροὺς καταλύσωσιν καὶ εὕρωσιν ἐπισιτισμόν, ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/012.yaml
  text: The day began to decline[a], and the twelve came and said to him, “Send the crowd away, so that they may go into the surrounding villages and countryside, find lodging, and get provisions[b], because we are here in a desolate place.”
translation:
  language: te
  text: 'రోజు వాలడం మొదలైంది[a]. ఆ పన్నెండుగురు ఆయన దగ్గరకు వచ్చి ఆయనతో ఇలా అన్నారు: “జనసమూహాన్ని పంపివేయండి. వారు చుట్టుపక్కల గ్రామాలకూ పల్లె ప్రాంతాలకూ వెళ్లి బస చేయడానికి, ఆహార సామగ్రి[b] సంపాదించుకోవడానికి అవకాశం కలుగుతుంది; ఎందుకంటే మనం ఇక్కడ నిర్జన ప్రదేశంలో[c] ఉన్నాం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, రోజు సాయంకాలం వైపు సాగుతోంది.
    reason: idiom_clarification
  - marker: b
    text: లేదా “ఆహారం.” గ్రీకు పదం ఆహార సరఫరా లేదా తినుబండారాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా “జనావాసం లేని ప్రదేశంలో.” గ్రీకు పదం జనావాసం లేని లేదా జనావాసం తక్కువగా ఉన్న ప్రాంతాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν
  choice: రోజు వాలడం మొదలైంది
  rationale: κλίνω అనే ‘వాలడం’ రూపకాన్ని నిలుపుతూ, రోజు సాయంకాలం వైపు సాగుతోందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: προσελθόντες δὲ οἱ δώδεκα
  choice: ఆ పన్నెండుగురు ఆయన దగ్గరకు వచ్చి
  rationale: προσέρχομαι అంటే దగ్గరకు రావడం; ‘ఆ పన్నెండుగురు’ అనేది యేసు ఎంపిక చేసిన పన్నెండుగురిని ఒక సమూహంగా సూచించే మూలంలోని నిర్దిష్టతను నిలుపుతుంది.
- source_word: Ἀπόλυσον τὸν ὄχλον
  choice: జనసమూహాన్ని పంపివేయండి
  rationale: ఇక్కడ ἀπολύω అంటే కూడిన ప్రజలను వెళ్లనివ్వడం లేదా పంపివేయడం. యేసుతో శిష్యులు మాట్లాడుతున్న సందర్భానికి మర్యాదార్థక ఆజ్ఞారూపం సహజంగా ఉంటుంది.
- source_word: εἰς τὰς κύκλῳ κώμας καὶ ἀγρούς
  choice: చుట్టుపక్కల ఉన్న గ్రామాలకూ పల్లెప్రాంతాలకూ
  rationale: κύκλῳ చుట్టూ ఉన్నవాటిని, κώμαι గ్రామాలను, ἀγροί పొలాలు లేదా గ్రామీణ ప్రాంతాలను సూచిస్తాయి; ‘పల్లెప్రాంతాలు’ ఇక్కడి విస్తృత గ్రామీణ భావాన్ని అందిస్తుంది.
- source_word: καταλύσωσιν
  choice: బస చేసి
  rationale: ఈ సందర్భంలో καταλύω రాత్రికి లేదా కొంతకాలం ఉండేందుకు బస చేయడాన్ని సూచిస్తుంది.
- source_word: εὕρωσιν ἐπισιτισμόν
  choice: ఆహార సామగ్రి సంపాదించుకోవాలి
  rationale: ἐπισιτισμός కేవలం ఒక భోజనం కన్నా ఆహార సరఫరా లేదా తినుబండారాలను సూచించగలదు; ‘ఆహార సామగ్రి’ ఆ విస్తృతిని నిలుపుతుంది.
- source_word: ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν
  choice: ఎందుకంటే మనం ఇక్కడ జనసంచారం లేని ప్రదేశంలో ఉన్నాం
  rationale: ἔρημος ఇక్కడ నివాసాలు లేదా వనరులు తక్కువగా ఉన్న ప్రదేశాన్ని సూచిస్తుంది. ‘జనసంచారం లేని’ అనే పదబంధం ఎడారి అనే అవసరానికి మించిన భౌగోళిక భావాన్ని రుద్దకుండా మూలభావాన్ని తెలుపుతుంది; ὧδε ను ‘ఇక్కడ’గా స్పష్టంగా ఉంచింది.
theological_decisions:
- issue: ἐρήμῳ τόπῳ అనే పదబంధానికి ఉండగల అరణ్య/ఎడారి అనుబంధం
  choice: జనసంచారం లేని ప్రదేశం
  alternative: ఎడారి ప్రదేశం / అరణ్య ప్రదేశం
  rationale: ఈ సందర్భంలో ప్రధాన భావం ఆ ప్రాంతంలో నివాసం, బస, ఆహార వనరులు లేకపోవడం. నిర్దిష్టమైన ఎడారి భూభాగాన్ని లేదా ప్రత్యేక అరణ్య ధార్మిక ప్రతీకను మూలం తప్పనిసరిగా సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా చదివే శైలి ఉపయోగించబడింది. యేసును ఉద్దేశించిన ఆజ్ఞకు మర్యాదార్థక బహువచన రూపం వాడబడింది. మూలంలోని ‘రోజు వాలడం’ అనే రూపకం నిలుపబడింది; అవసరమైన వివరణ పాదసూచికలో ఇచ్చబడింది.
