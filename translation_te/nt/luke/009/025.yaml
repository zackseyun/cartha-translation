id: LUK.9.25
reference: Luke 9:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τί γὰρ ὠφελεῖται ἄνθρωπος κερδήσας τὸν κόσμον ὅλον ἑαυτὸν δὲ ἀπολέσας ἢ ζημιωθείς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/025.yaml
  text: For what does a man profit if he gains the whole world[a], but loses or forfeits himself?
translation:
  language: te
  text: ఎందుకంటే, ఒక వ్యక్తి లోకమంతటినీ సంపాదించుకొని, తనను తాను[a] కోల్పోయినా లేదా నష్టానికి గురైనా అతనికి ప్రయోజనం ఏమిటి?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన ప్రాణాన్నే” లేదా “తన ఆత్మనే.” గ్రీకులో సాధారణంగా “ప్రాణం” లేదా “ఆత్మ” అని అనువదించే పదం కాకుండా “తనను తాను” అనే ఆత్మార్థక సర్వనామం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ ὠφελεῖται
  choice: ఎందుకంటే ... అతనికి ప్రయోజనం ఏమిటి?
  rationale: γάρ యొక్క ముందటి మాటకు కారణం చూపే భావాన్ని నిలుపుతూ, τί ὠφελεῖται అనే అలంకారప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἄνθρωπος
  choice: ఒక వ్యక్తి
  rationale: ఇక్కడ ἄνθρωπος సాధారణంగా ఏ మనిషినైనా సూచిస్తుంది; తెలుగు వాడుకలో ‘ఒక వ్యక్తి’ ఆ ప్రతినిధి భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: κερδήσας τὸν κόσμον ὅλον
  choice: లోకమంతటినీ సంపాదించుకొని
  rationale: κερδαίνω లోని పొందడం/సంపాదించడం అనే భావాన్ని, κόσμος ὅλος యొక్క సంపూర్ణతను నిలుపుతుంది.
- source_word: ἑαυτόν
  choice: తననుతానే
  rationale: మూలంలో ‘ప్రాణం’ లేదా ‘ఆత్మ’ అనే నామవాచకం కాకుండా ఆత్మార్థక సర్వనామం ఉంది; అందువల్ల వ్యక్తి యొక్క సంపూర్ణ స్వరూపాన్ని సంకుచితం చేయకుండా అనువదిస్తుంది.
- source_word: ἀπολέσας
  choice: పోగొట్టుకుంటే
  rationale: తననే కోల్పోవడం అనే ప్రధాన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἢ ζημιωθείς
  choice: లేదా నష్టపరచుకుంటే
  rationale: ἤ అనే ప్రత్యామ్నాయ సంబంధాన్ని నిలుపుతూ, ζημιόω యొక్క నష్టం పొందడం/నష్టానికి గురికావడం అనే భావాన్ని ἀπόλλυμι నుండి కొంత భిన్నంగా ఉంచుతుంది.
theological_decisions:
- issue: ἑαυτόν మానవ గమ్యంతో కలిగిన సంబంధం
  choice: తననుతానే
  alternative: తన ప్రాణాన్ని / తన ఆత్మను
  rationale: గ్రీకు పాఠంలో ψυχή లేదు; ఆత్మార్థక సర్వనామమే ఉంది. కాబట్టి దీనిని కేవలం ప్రాణం లేదా దేహానికి భిన్నమైన ఆత్మగా పరిమితం చేయకుండా మూలంలోని విస్తృత మానవార్థాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన అలంకారప్రశ్నగా రూపొందించబడింది. ‘పోగొట్టుకుంటే’ మరియు ‘నష్టపరచుకుంటే’ ద్వారా రెండు గ్రీకు క్రియల మధ్య ఉన్న స్వల్ప భేదాన్ని నిలుపుతూ, [a] సూచికను సంబంధిత పదబంధం తరువాత ఉంచాం.
