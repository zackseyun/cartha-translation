source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν ἀγγέλους πρὸ προσώπου αὐτοῦ. καὶ πορευθέντες εἰσῆλθον εἰς κώμην Σαμαριτῶν, ⸀ὡς ἑτοιμάσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/052.yaml
  text: And he sent messengers ahead of him[b][a]. And they went and entered a village of the Samaritans to prepare for him.
translation:
  language: te
  text: ఆయన తనకు ముందుగా దూతలను పంపాడు. వారు వెళ్లి, ఆయన కోసం ఏర్పాట్లు చేయడానికి సమరయుల గ్రామంలోకి ప్రవేశించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: పంపాడు
  rationale: ἀποστέλλω యొక్క సాధారణ కథనార్థాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: ἀγγέλους
  choice: దూతలను
  rationale: ఇక్కడ గ్రామానికి ముందుగా పంపబడిన మానవ ప్రతినిధులే ఉద్దేశం; ‘దూతలు’ అనే పదం సందర్భానికి సరిపోతూ మూలపదపు విస్తృత అర్థపరిధిని కూడా నిలుపుతుంది.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: తనకు ముందుగా
  rationale: అక్షరార్థంగా ‘ఆయన ముఖానికి ముందు’ అనే గ్రీకు నుడికారాన్ని, ఆయన కంటే ముందుగా వెళ్లారనే భావంతో సహజ తెలుగులో అందిస్తుంది.
- source_word: πορευθέντες
  choice: వారు వెళ్లి
  rationale: ఏరిస్ట్ పార్టిసిపుల్ ప్రధాన క్రియకు ముందున్న చర్యను సూచిస్తుంది; తెలుగు కథనశైలిలో ‘వెళ్లి’ ఆ క్రమాన్ని సహజంగా చూపుతుంది.
- source_word: εἰσῆλθον
  choice: ప్రవేశించారు
  rationale: εἰσέρχομαι యొక్క అర్థాన్ని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: κώμην
  choice: గ్రామంలోకి
  rationale: κώμη సాధారణంగా చిన్న నివాసస్థలాన్ని సూచిస్తుంది; అందువల్ల ‘గ్రామం’ ఖచ్చితమైన ఎంపిక.
- source_word: Σαμαριτῶν
  choice: సమరయుల గ్రామం
  rationale: గ్రీకు బహువచన షష్ఠీ విభక్తిని ‘సమరయుల గ్రామం’గా ప్రతిబింబించి, అది సమరయులు నివసించే లేదా వారికి చెందిన గ్రామమనే భావాన్ని నిలుపుతుంది.
- source_word: ὡς ἑτοιμάσαι αὐτῷ
  choice: ఆయన కోసం ఏర్పాట్లు చేయడానికి
  rationale: ὡς + infinitive ఇక్కడ ఉద్దేశాన్ని సూచిస్తుంది. సిద్ధం చేయవలసిన విషయాన్ని మూలం స్పష్టంగా చెప్పనందున తెలుగులోనూ సాధారణంగానే ఉంచుతుంది.
