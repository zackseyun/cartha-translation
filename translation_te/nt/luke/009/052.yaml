translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘దూతలు’ సందర్భంలో మానవ సందేశవాహకులను సూచిస్తుంది. గ్రీకు వాక్యారంభంలోని రెండు καίలను తెలుగులో యాంత్రికంగా పునరావృతం చేయకుండా, చర్యల క్రమాన్ని వాక్యనిర్మాణం ద్వారా చూపించాం.
