id: LUK.9.36
reference: Luke 9:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ γενέσθαι τὴν φωνὴν ⸀εὑρέθη Ἰησοῦς μόνος. καὶ αὐτοὶ ἐσίγησαν καὶ οὐδενὶ ἀπήγγειλαν ἐν ἐκείναις ταῖς ἡμέραις οὐδὲν ὧν ἑώρακαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/036.yaml
  text: And when the voice had come[a], Jesus was found alone. And they kept silent and told no one in those days anything of what they had seen.
translation:
  language: te
  text: ఆ స్వరం వినిపించినప్పుడు, యేసు ఒక్కడే కనిపించాడు.[a] వారు మౌనంగా ఉండిపోయారు; తాము చూసిన వాటిలో దేనినీ ఆ రోజుల్లో ఎవరికీ చెప్పలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యేసు ఒక్కడే కనుగొనబడ్డాడు.” “యేసు ఒక్కడే మిగిలాడు” లేదా “యేసు మాత్రమే కనిపించాడు” అని కూడా భావించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ γενέσθαι τὴν φωνήν
  choice: ఆ స్వరం వినిపించినప్పుడు
  rationale: ἐν + articular infinitive కాలసంబంధాన్ని సూచిస్తుంది. φωνή ఇక్కడ పరలోక ఉచ్చారణ కాబట్టి ‘స్వరం’; తెలుగు సహజత్వం కోసం γενέσθαι భావాన్ని ‘వినిపించినప్పుడు’గా వ్యక్తం చేశాం.
- source_word: εὑρέθη Ἰησοῦς μόνος
  choice: యేసు ఒక్కడే కనిపించాడు
  rationale: గ్రీకులో అక్షరార్థంగా ‘యేసు ఒక్కడే కనుగొనబడ్డాడు’ అని ఉన్నా, దృశ్యం ముగిసిన తరువాత ఆయన మాత్రమే అక్కడ కనిపించిన ఫలితాన్ని సహజమైన ఆధునిక తెలుగులో ఇది తెలియజేస్తుంది. ‘ఒక్కడే’ μόνος యొక్క ప్రత్యేక ఏకాకి ఉనికిని నిలుపుతుంది.
- source_word: ἐσίγησαν
  choice: మౌనంగా ఉండిపోయారు
  rationale: వారు ఆ అనుభవాన్ని వెంటనే చెప్పకుండా నిశ్శబ్దంగా ఉన్నారని σιγάω సూచిస్తుంది; ‘ఉండిపోయారు’ ఆ కొనసాగిన స్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐδενὶ ἀπήγγειλαν
  choice: ఎవరికీ చెప్పలేదు
  rationale: ἀπαγγέλλω ఇక్కడ తెలియజేయడం లేదా చెప్పడం అనే సాధారణ కథనార్థంలో ఉంది; ‘ఎవరికీ చెప్పలేదు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: ఆ రోజుల్లో
  rationale: మూలంలోని కాలపరిమితిని సంక్షిప్తంగా, నేరుగా నిలుపుతుంది.
- source_word: οὐδὲν ὧν ἑώρακαν
  choice: తాము చూసిన వాటిలో దేనినీ
  rationale: οὐδένతో కూడిన భాగసూచక సంబంధ వాక్యాన్ని నిలుపుతూ, వారు చూసిన విషయాల్లో ఒక్కదానినీ చెప్పలేదనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పరలోక స్వరం తరువాత యేసు ఒక్కడే ఉండడం యొక్క కథనార్థం
  choice: ‘యేసు ఒక్కడే కనిపించాడు’ అని వివరణాత్మక సిద్ధాంతాన్ని జోడించకుండా వర్ణించడం
  alternative: ‘యేసు ఒక్కడే మిగిలాడు’ లేదా ‘వారు యేసును మాత్రమే చూశారు’
  rationale: మూలవాక్యం దృశ్యం ముగిసినప్పుడు ఉన్న పరిస్థితిని మాత్రమే నివేదిస్తుంది. మోషే, ఏలీయా ఎలా అదృశ్యమయ్యారో లేదా ఈ సంఘటనకు ఏ ప్రత్యేక సిద్ధాంతార్థమో వచనం స్పష్టంగా చెప్పదు; అందువల్ల ఆ ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని రెండు వరుస ప్రతికూల భావాలను తెలుగులో సహజంగా ‘దేనినీ… ఎవరికీ చెప్పలేదు’ అనే నిర్మాణంతో నిలిపాం.
