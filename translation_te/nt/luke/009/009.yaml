source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ ⸀ὁ Ἡρῴδης· Ἰωάννην ἐγὼ ἀπεκεφάλισα· τίς δέ ἐστιν οὗτος περὶ ⸀οὗ ἀκούω τοιαῦτα; καὶ ἐζήτει ἰδεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/009.yaml
  text: But Herod said[a], “John I beheaded; but who is this about whom I hear such things?” And he kept seeking to see him.
translation:
  language: te
  text: అయితే హేరోదు, “యోహాను తల నేనే నరికాను; మరి నేను ఇలాంటి సంగతులు ఎవరి గురించి వింటున్నానో, ఈయన ఎవరు?” అన్నాడు. ఆయనను చూడాలని ప్రయత్నించేవాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆయనను చూడడానికి ప్రయత్నించేవాడు.” గ్రీకులోని అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న లేదా పదేపదే జరిగిన ప్రయత్నాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వాక్యంతో కొనసాగింపును, అలాగే హేరోదు స్పందనలోని స్వల్ప వ్యత్యాసాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: Ἡρῴδης
  choice: హేరోదు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: Ἰωάννην
  choice: యోహాను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ἐγὼ ἀπεκεφάλισα
  choice: యోహాను తల నరికించింది నేనే
  rationale: ἀπεκεφάλισα అనే క్రియలోని శిరచ్ఛేద భావాన్ని స్పష్టంగా ఉంచి, ἐγώ వల్ల కలిగే ‘నేనే’ అనే ఉద్ఘాటనను కాపాడుతుంది. తెలుగు ప్రయోగంలో కార్యాన్ని ఆజ్ఞాపించిన పాలకుని బాధ్యతను సహజంగా వ్యక్తపరచడానికి కారక రూపం వాడబడింది.
- source_word: τίς δέ ἐστιν οὗτος
  choice: మరి ... ఈయన ఎవరు?
  rationale: ప్రశ్నలోని ఆశ్చర్యం, సందిగ్ధతను నిలుపుతూ, మూలంలో లేని ‘మనిషి’ వంటి పదాన్ని చేర్చదు.
- source_word: περὶ οὗ ἀκούω τοιαῦτα
  choice: నేను ఇలాంటి సంగతులు ఎవరి గురించి వింటున్నానో
  rationale: τοιαῦτα యొక్క విస్తృతతను ‘ఇలాంటి సంగతులు’గా నిలుపుతుంది; ‘వార్తలు’ అని పరిమితం చేయదు.
- source_word: ἐζήτει ἰδεῖν αὐτόν
  choice: అతణ్ణి చూడాలని ప్రయత్నిస్తూ ఉండేవాడు
  rationale: ζητέω + infinitive యొక్క ప్రయత్న భావాన్ని, imperfect క్రియలోని కొనసాగుతున్న లేదా పునరావృత చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: యోహాను శిరచ్ఛేదం మరియు యేసు ఎవరో తెలుసుకోవాలనే హేరోదు ఆసక్తి
  choice: హేరోదు చెప్పిన మాటను, అడిగిన ప్రశ్నను వచనంలో ఉన్నంతవరకే నేరుగా అనువదించడం
  alternative: యోహాను మృతులలోనుండి లేచాడేమోనని హేరోదు భయపడ్డాడని వచనంలోనే స్పష్టంగా చేర్చడం
  rationale: ముందటి సందర్భంలో హేరోదు కలవరపడినట్లు ఉన్నా, ఈ వచనం అతడు యోహాను తల నరికించానని చెప్పి, తాను వింటున్న వ్యక్తి ఎవరో అడిగినట్లు మాత్రమే చెబుతుంది. అందువల్ల అదనపు ఊహను చేర్చకుండా వచనంలోని ఉద్రిక్తతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘నేనే’ అనే ఉద్ఘాటనను నిలిపి, హేరోదు ప్రశ్నలోని అయోమయాన్ని వివరణతో పరిష్కరించకుండా ఉంచింది.
