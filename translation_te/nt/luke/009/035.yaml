revisions:
- from: 'అప్పుడు మేఘంలోనుంచి ఒక స్వరం ఇలా వినిపించింది: “ఈయన నా కుమారుడు, నేను ఎన్నుకున్నవాడు[a]; ఈయన మాట వినండి.”'
  to: 'మరియు మేఘం నుండి ఒక స్వరం ఇలా వినిపించింది: “ఈయన నా కుమారుడు, ఎన్నుకోబడినవాడు[a]; ఈయన మాట వినండి.”'
  rationale: The revision retains the draft’s clear modern Telugu while rendering καί as a connective and ὁ ἐκλελεγμένος as a passive, articular designation. It also adjusts the footnote to describe the ‘beloved Son’ variant without adding an explicit first-person verb to the main reading.
