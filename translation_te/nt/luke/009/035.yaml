id: LUK.9.35
reference: Luke 9:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ φωνὴ ἐγένετο ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ⸀ἐκλελεγμένος, αὐτοῦ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/035.yaml
  text: And a voice came from the cloud[a], saying, “This is my Son, the Chosen One; listen to him.”
translation:
  language: te
  text: 'మరియు మేఘం నుండి ఒక స్వరం ఇలా వినిపించింది: “ఈయన నా కుమారుడు, ఎన్నుకోబడినవాడు[a]; ఈయన మాట వినండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో “ఎన్నుకోబడినవాడు”కు బదులుగా “నా ప్రియ కుమారుడు” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: ఒక స్వరం వినిపించింది
  rationale: గ్రీకు ప్రయోగం ఒక స్వరం సంభవించడాన్ని సూచిస్తుంది. తెలుగులో ‘స్వరం వినిపించింది’ సహజంగా ఉండి, సంఘటనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: ἐκ τῆς νεφέλης
  choice: మేఘంలోనుంచి
  rationale: ἐκ మూలాన్ని సూచిస్తుంది; ‘మేఘంలోనుంచి’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: λέγουσα
  choice: ఇలా
  rationale: స్వరం పలికిన విషయాన్ని పరిచయం చేయడానికి ‘ఇలా’ సహజమైన తెలుగు కథన ప్రయోగం.
- source_word: Οὗτός ἐστιν ὁ υἱός μου
  choice: ఈయన నా కుమారుడు
  rationale: గుర్తింపును తెలిపే నిర్మాణాన్ని గౌరవపూర్వకమైన, సహజమైన తెలుగులో నేరుగా అందిస్తుంది.
- source_word: ὁ ἐκλελεγμένος
  choice: నేను ఎన్నుకున్నవాడు
  rationale: ἐκλέγομαι యొక్క perfect passive participle ‘ఎన్నుకోబడినవాడు’ అనే స్థిర ఫలితభావాన్ని కలిగి ఉంది. కర్త దేవుడని సందర్భం స్పష్టం చేస్తున్నందున, ‘నేను ఎన్నుకున్నవాడు’ తెలుగులో సహజంగా ఉండి ‘ప్రియుడు’ అనే వేరే పాఠాన్ని కలపదు.
- source_word: αὐτοῦ ἀκούετε
  choice: ఈయన మాట వినండి
  rationale: ἀκούω ఇక్కడ కేవలం శబ్దం వినడం కాక శ్రద్ధగా ఆలకించి అనుసరించాలనే ఆజ్ఞార్థాన్ని కలిగి ఉంది. ‘ఈయన మాట వినండి’ తెలుగులో ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పరలోక స్వరంలో క్రీస్తును వర్ణించే పాఠభేదం
  choice: ἐκλελεγμένος ఆధారంగా ‘నేను ఎన్నుకున్నవాడు’
  alternative: ἀγαπητός ఆధారంగా ‘నా ప్రియ కుమారుడు’
  rationale: అందించిన SBLGNT మూలపాఠంలో ἐκλελεγμένος ఉంది. అందువల్ల సమాంతర సువార్తలలో సుపరిచితమైన ‘ప్రియుడు’ అనే పదంతో సమన్వయం చేయకుండా లూకా పాఠంలోని ప్రత్యేకతను ప్రధాన వచనంలో నిలిపి, ప్రత్యామ్నాయ పాఠాన్ని పాదసూచికలో పేర్కొన్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఈయన’ అనే రూపం సందర్భానికి తగిన గౌరవాన్ని ఇస్తుంది. మూలంలోని ‘ఎన్నుకున్నవాడు’ అనే ప్రత్యేక క్రీస్తుసంబంధ వర్ణనను కాపాడి, పాఠభేదాన్ని పాదసూచికలో ఉంచాం.
