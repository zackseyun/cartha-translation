id: LUK.9.10
reference: Luke 9:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὑποστρέψαντες οἱ ἀπόστολοι διηγήσαντο αὐτῷ ὅσα ἐποίησαν. καὶ παραλαβὼν αὐτοὺς ὑπεχώρησεν κατ’ ἰδίαν εἰς ⸂πόλιν καλουμένην Βηθσαϊδά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/010.yaml
  text: And when the apostles returned[a], they reported to him what they had done. And taking them with him, he withdrew privately to a town called Bethsaida.
translation:
  language: te
  text: అపొస్తలులు తిరిగి వచ్చి, తాము చేసినవన్నీ ఆయనకు వివరించారు. అప్పుడు ఆయన వారిని వెంటబెట్టుకొని, బేత్సయిదా అనే పట్టణానికి విడిగా వెళ్లిపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రత్యేకంగా” లేదా “ఏకాంతంగా.” ఇక్కడ ఆయన పూర్తిగా ఒంటరిగా ఉన్నాడని కాదు; అపొస్తలులతో కలిసి జనసమూహం నుంచి వేరుగా వెళ్లాడని భావం.
    reason: κατ’ ἰδίαν అనే పదబంధం అపొస్తలుల సహచర్యంతో ఎలా సరిపోతుందో స్పష్టం చేయడానికి.
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: తిరిగి వచ్చి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను తెలిపే అఓరిస్ట్ కృదంతాన్ని సహజమైన తెలుగు క్రమంలో చూపిస్తుంది.
- source_word: οἱ ἀπόστολοι
  choice: అపొస్తలులు
  rationale: లూకా సందర్భంలో సేవకు పంపబడిన పన్నెండుగురికి స్థిరమైన బిరుదు; ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితం.
- source_word: διηγήσαντο
  choice: వివరించారు
  rationale: జరిగినదాన్ని తెలియజేయడం లేదా వివరంగా చెప్పడం అనే భావాన్ని, అతిగా అధికారికంగా చేయకుండా అందిస్తుంది.
- source_word: ὅσα ἐποίησαν
  choice: తాము చేసినవన్నీ
  rationale: ὅσα లోని సమగ్ర భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; కర్తవైపు తిరిగి సూచించేందుకు ‘తాము’ వాడబడింది.
- source_word: παραλαβὼν αὐτούς
  choice: వారిని వెంటబెట్టుకొని
  rationale: వారిని తనతో పాటు తీసుకెళ్లాడనే సహచర్య భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ὑπεχώρησεν
  choice: వెళ్లిపోయాడు
  rationale: ఇక్కడ జనసమూహం నుంచి తప్పుకొని వెళ్లడాన్ని సూచిస్తుంది; ‘వెనుదిరిగాడు’ లేదా ‘వెనక్కి తగ్గాడు’ అనే అనవసర సైనిక భావాన్ని నివారిస్తుంది.
- source_word: κατ’ ἰδίαν
  choice: ఏకాంతంగా
  rationale: ప్రజల నుంచి వేరుగా, వ్యక్తిగతంగా వెళ్లడాన్ని సూచిస్తుంది; అపొస్తలులు ఆయనతో ఉన్నందున పూర్తిగా ఒంటరిగా ఉన్నాడని చెప్పదు.
- source_word: πόλιν καλουμένην Βηθσαϊδά
  choice: బేత్సయిదా అనే పట్టణానికి
  rationale: πόλις ను స్థల పరిమాణాన్ని అతిశయింపజేయని ‘పట్టణం’గా, καλουμένην ను సహజ తెలుగు ‘అనే’గా అందిస్తుంది.
- source_word: Βηθσαϊδά
  choice: బేత్సయిదా
  rationale: గ్రీకు స్థలనామానికి తెలుగు లిప్యంతరీకరణ.
theological_decisions:
- issue: అపొస్తలులు వెంట ఉండగా κατ’ ἰδίαν యొక్క భావం
  choice: ‘ఏకాంతంగా’—ప్రజల నుంచి వేరుగా వెళ్లడం
  alternative: ‘ఒంటరిగా’ లేదా ‘రహస్యంగా’
  rationale: వారిని వెంటబెట్టుకున్నాడని వాక్యమే స్పష్టంగా చెబుతుంది. కాబట్టి సంపూర్ణ ఒంటరితనాన్ని సూచించకుండా, జనసమూహం నుంచి విడిగా వెళ్లిన భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘అపొస్తలులు’ అనే సుపరిచిత బైబిలు పదాన్ని నిలిపి, మిగతా పదజాలాన్ని సహజంగా ఉంచాం.
