source:
  edition: SBLGNT
  text: Ἐγένετο ⸀δὲ τῇ ἑξῆς ἡμέρᾳ κατελθόντων αὐτῶν ἀπὸ τοῦ ὄρους συνήντησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/037.yaml
  text: On the next day[a], when they had come down from the mountain, a large crowd met him.
translation:
  language: te
  text: మరుసటి రోజు[a], వారు కొండ దిగి వచ్చినప్పుడు, పెద్ద జనసమూహం ఆయనను కలిసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తరువాతి రోజు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ప్రత్యేక పదబంధంగా అనువదించలేదు
  rationale: ఇది ఇక్కడ కథనాన్ని ముందుకు నడిపించే సంధి ప్రయోగం. తెలుగులో వాక్యక్రమమే ఆ మార్పును సహజంగా తెలియజేస్తుంది; ‘అప్పుడు’ లేదా ‘ఇదిగో’ చేరిస్తే మూలంలో లేని కాల లేదా ఉద్ఘాటన భావం రావచ్చు.
- source_word: τῇ ἑξῆς ἡμέρᾳ
  choice: మరుసటి రోజు
  rationale: కాలాన్ని సూచించే ఈ దత్తివిభక్తి ప్రయోగానికి ఇది సహజమైన, స్పష్టమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: κατελθόντων αὐτῶν
  choice: వారు ... దిగి వచ్చినప్పుడు
  rationale: జెనిటివ్ అబ్సల్యూట్ ప్రధాన క్రియకు నేపథ్య పరిస్థితిని తెలియజేస్తుంది. ఏఓరిస్ట్ కృదంతంలోని పూర్తయిన చర్య భావాన్ని ఈ రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ τοῦ ὄρους
  choice: కొండ
  rationale: ὄρος అంటే కొండ లేదా పర్వతం. ఈ సందర్భంలో సాధారణ పాఠకులకు ‘కొండ’ సహజంగా ఉండి, వారు దిగి వచ్చిన ఎత్తైన ప్రదేశాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: συνήντησεν αὐτῷ
  choice: ఆయనను కలిసింది
  rationale: క్రియకు ‘కలుసుకోవడం/ఎదురుపడడం’ అనే అర్థం ఉంది. ‘కలిసింది’ ఉద్దేశపూర్వకంగా స్వాగతించడానికి వచ్చారనే అదనపు భావాన్ని చేర్చకుండా మూలార్థాన్ని ఇస్తుంది.
- source_word: ὄχλος πολύς
  choice: పెద్ద జనసమూహం
  rationale: ὄχλος జనసమూహాన్ని, πολύς దాని పెద్ద పరిమాణాన్ని సూచిస్తాయి. ఈ పదబంధం గౌరవప్రదమైన ఆధునిక తెలుగులో సహజంగా ఉంది.
