source:
  edition: SBLGNT
  text: οἳ ὀφθέντες ἐν δόξῃ ἔλεγον τὴν ἔξοδον αὐτοῦ ἣν ἤμελλεν πληροῦν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/031.yaml
  text: who, appearing in glory, were speaking about his departure, which he was about to fulfill in Jerusalem.
translation:
  language: te
  text: వారు మహిమలో కనిపించి, ఆయన యెరూషలేములో నెరవేర్చబోయే తన నిర్గమం గురించి మాట్లాడుతున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిర్గమం’ అని అనువదించిన గ్రీకు పదానికి ‘వెళ్లిపోవడం’ లేదా ‘నిష్క్రమణ’ అని కూడా అర్థం. సందర్భంలో ఇది యేసు మరణాన్ని సూచించవచ్చు; ‘నిర్గమం’తో పదసంబంధ ప్రతిధ్వని కూడా ఉండవచ్చు.
    reason: ἔξοδος యొక్క సాధారణ అర్థపరిధిని మరియు సందర్భానుసారమైన మరణసూచనను కాపాడుతూ, మూలం నిర్దేశించని విస్తృత సిద్ధాంత వివరణను నివారిస్తుంది.
lexical_decisions:
- source_word: ὀφθέντες ἐν δόξῃ
  choice: మహిమలో కనిపించి
  rationale: దృశ్యంగా ప్రత్యక్షమవడాన్ని సూచించే ὀφθέντες భావాన్నీ, మహిమతో సంబంధాన్ని సూచించే ἐν δόξῃ భావాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἔλεγον
  choice: మాట్లాడుతున్నారు
  rationale: సందర్భంలో కొనసాగుతున్న సంభాషణను సూచించే అపూర్ణ భూతకాల భావాన్ని సహజమైన తెలుగు వర్ణనాశైలిలో వ్యక్తం చేస్తుంది.
- source_word: τὴν ἔξοδον αὐτοῦ
  choice: ఆయన నిర్గమం
  rationale: ἔξοδος అనే పదంలోని ‘వెళ్లిపోవడం/నిష్క్రమణ’ భావంతో పాటు నిర్గమకాండ సంబంధిత ప్రతిధ్వనికి అవకాశం ఉంచుతుంది; దానిని కేవలం ‘మరణం’గా పరిమితం చేయదు.
- source_word: ἣν ἤμελλεν πληροῦν
  choice: నెరవేర్చబోయే
  rationale: μέλλω యొక్క సమీప భవిష్యత్ భావాన్నీ, πληρόω యొక్క ‘పూర్తి చేయడం/నెరవేర్చడం’ భావాన్నీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἐν Ἰερουσαλήμ
  choice: యెరూషలేములో
  rationale: కార్యం జరిగే స్థలాన్ని మూలపాఠం ప్రకారం స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘నిర్గమం’ యొక్క పరిధి
  choice: ఆయన నిర్గమం
  alternative: ఆయన మరణం / ఆయన వెళ్లిపోవడం
  rationale: ఈ పదం యేసు మరణాన్ని సూచించినప్పటికీ, మరణం, పునరుత్థానం, ఆరోహణలతో కూడిన విస్తృత ప్రయాణాన్నీ, నిర్గమకాండ ప్రతిధ్వనినీ సూచించగలదు. అందువల్ల మూలంలోని ఉద్దేశపూర్వక విస్తృతతను కాపాడాం.
- issue: πληροῦν యొక్క అనువాదం
  choice: నెరవేర్చబోయే
  alternative: పూర్తి చేయబోయే
  rationale: ‘నెరవేర్చు’ అనేది నియమిత రక్షణకార్యాన్ని పూర్తిచేయడం అనే భావాన్ని మోస్తూ, మూలంలోని క్రియను అతిగా వివరణాత్మకం చేయకుండా ప్రతిబింబిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘నిర్గమం’ కొంత సాహిత్య/బైబిలు పదమైనందున దాని అర్థవిస్తృతిని పాదటిప్పణిలో వివరించాం.
