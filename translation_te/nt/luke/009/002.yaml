id: LUK.9.2
reference: Luke 9:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν αὐτοὺς κηρύσσειν τὴν βασιλείαν τοῦ θεοῦ καὶ ἰᾶσθαι ⸂τοὺς ἀσθενεῖς⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/002.yaml
  text: And he sent them out to proclaim the kingdom of God and to heal the sick,[a]
translation:
  language: te
  text: దేవుని రాజ్యాన్ని[a] ప్రకటించడానికి, రోగులను స్వస్థపరచడానికి ఆయన వారిని పంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని పాలనను.”
    reason: βασιλεία అనే పదం రాజ్యంతో పాటు రాజాధికారాన్ని లేదా పాలనను కూడా సూచించగలదు.
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: పంపాడు
  rationale: ἀποστέλλω ఇక్కడ అప్పగించిన కార్యం కోసం పంపడాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో ఉద్దేశార్థక క్రియలతో కలిసి ‘పంపాడు’ ఆ నియామక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: κηρύσσειν
  choice: ప్రకటించడానికి
  rationale: κηρύσσω బహిరంగంగా సందేశాన్ని చాటడాన్ని సూచిస్తుంది. ‘ప్రకటించడానికి’ ఆధునిక తెలుగులో సహజంగా ఉండి, కేవలం మతపరమైన ప్రసంగానికి పరిమితం చేయదు.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: దేవుని రాజ్యాన్ని
  rationale: ఈ పదబంధం దేవుని పాలననూ ఆయన రాజ్య పరిధినీ సూచించగల విశాలత కలిగివుంది. ‘దేవుని రాజ్యం’ స్థిరమైన, పారదర్శకమైన బైబిలు ప్రయోగం.
- source_word: ἰᾶσθαι
  choice: స్వస్థపరచడానికి
  rationale: ἰάομαι శారీరక అనారోగ్యం నుంచి బాగుచేయడాన్ని సూచిస్తుంది. ‘స్వస్థపరచడం’ గౌరవప్రదమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: τοὺς ἀσθενεῖς
  choice: రోగులను
  rationale: ἀσθενής సాధారణంగా ‘బలహీనులు’ అని కూడా అర్థమివ్వగలదు; అయితే ἰᾶσθαιతో ఉన్న ఈ సందర్భంలో అనారోగ్యంతో ఉన్నవారే ఉద్దేశించబడ్డారు. ‘రోగులను’ సంక్షిప్తంగా, సహజంగా ఉంది.
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ స్వభావం
  choice: దేవుని రాజ్యం
  alternative: దేవుని పాలన
  rationale: గ్రీకు βασιλεία రాజ్యాన్నీ రాజపాలననూ సూచించగలదు. ప్రధాన పాఠంలో ‘రాజ్యం’ దాని సంపూర్ణ బైబిలు భావవిస్తృతిని నిలుపుతుంది; ‘పాలన’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఇచ్చి మూలంలోని అర్థసంభావ్యతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. మూలంలోని రెండు ఉద్దేశాలను—ప్రకటించడం, స్వస్థపరచడం—సమాంతరంగా ఉంచాం. పాదసూచిక సూచిక [a] ప్రధాన పాఠంలో సంబంధిత పదబంధం వెంట ఉంది.
