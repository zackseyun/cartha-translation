id: LUK.23.43
reference: Luke 23:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν ⸀αὐτῷ· Ἀμήν ⸂σοι λέγω⸃ σήμερον μετ’ ἐμοῦ ἔσῃ ἐν τῷ παραδείσῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/043.yaml
  text: And he said to him[a], “Truly I tell you, today you will be with me in paradise.”
translation:
  language: te
  text: 'ఆయన అతనితో ఇలా అన్నాడు[a]: “నేను నీతో నిజంగా చెబుతున్నాను: ఈ రోజే నీవు నాతో పాటు పరదైసులో ఉంటావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, తక్కువ సంభావ్యతతో: “నేను ఈ రోజు నీతో నిజంగా చెబుతున్నాను: నీవు నాతో పాటు పరదైసులో ఉంటావు.” గ్రీకు పాఠంలో మొదట ఆధునిక విరామచిహ్నాలు లేవు. ఈ ప్రత్యామ్నాయ పఠనం “ఈ రోజు”ను “చెబుతున్నాను”తో అనుసంధానిస్తుంది; ప్రధాన పాఠం దానిని “ఉంటావు”తో అనుసంధానిస్తుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀμήν
  choice: నిజంగా
  rationale: యేసు అధికారపూర్వకమైన గంభీర ప్రకటనను ప్రారంభించే ధృవీకరణగా Ἀμήν ఇక్కడ వాడబడింది. ‘నిజంగా’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి దాని బలాన్ని నిలుపుతుంది.
- source_word: σοι λέγω
  choice: నేను నీతో ... చెబుతున్నాను
  rationale: మూలంలోని సంభాషణ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఏకవచన సంబోధనను కూడా స్పష్టంగా ఉంచుతుంది.
- source_word: σήμερον
  choice: ఈ రోజే
  rationale: σήμερον‌ను ‘ఉంటావు’ అనే భవిష్యత్ క్రియతో అనుసంధానించే ప్రధాన పఠనాన్ని తెలుపుతుంది. ‘-ఏ’ ఆ రోజు గురించిన వాగ్దాన బలాన్ని సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ అనుసంధానం పాదసూచికలో నిలుపబడింది.
- source_word: μετ’ ἐμοῦ
  choice: నాతో పాటు
  rationale: వ్యక్తిగత సహవాస భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἔσῃ
  choice: ఉంటావు
  rationale: εἰμί యొక్క భవిష్యత్ రూపాన్ని సాధారణ ఆధునిక తెలుగు భవిష్యత్ క్రియగా అందిస్తుంది.
- source_word: παραδείσῳ
  choice: పరదైసులో
  rationale: ఈ అంత్యకాల సంబంధ సందర్భంలో παράδεισος‌కు స్థిరపడిన ధార్మిక పదాన్ని వాడుతూ, మూలంలోని భావాన్ని ‘తోట’ అని సంకుచితం చేయకుండా ఉంచుతుంది.
theological_decisions:
- issue: విరామచిహ్నాలపై ఆధారపడే ఈ వాక్యంలో σήμερον (‘ఈ రోజు’) దేనితో అనుసంధానించాలి?
  choice: ‘ఈ రోజే’ను ‘నీవు నాతో పాటు పరదైసులో ఉంటావు’ అనే వాగ్దానంతో అనుసంధానించడం.
  alternative: '‘ఈ రోజు’ను ‘నేను నీతో చెబుతున్నాను’ అనే మాటతో అనుసంధానించడం: “నేను ఈ రోజు నీతో నిజంగా చెబుతున్నాను: నీవు నాతో పాటు పరదైసులో ఉంటావు.”'
  rationale: ప్రాచీన గ్రీకు పాఠంలో ఆధునిక విరామచిహ్నాలు లేవు. పదక్రమం, వాక్యప్రవాహం దృష్ట్యా σήμερον భవిష్యత్ ‘ఉంటావు’ను విశేషించడం మరింత సహజం. అయినా, మధ్యస్థితి గురించి సిద్ధాంతపరమైన ప్రభావం కలిగిన ప్రత్యామ్నాయ అన్వయాన్ని తొలగించకుండా పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘పరదైసు’ అనే పరిచిత ధార్మిక పదం నిలుపబడింది. ప్రధాన పాఠంలోని విరామచిహ్నాలు ఎంపిక చేసిన అన్వయాన్ని స్పష్టం చేస్తాయి; నిజమైన ప్రత్యామ్నాయం పాదసూచికలో సంరక్షించబడింది.
