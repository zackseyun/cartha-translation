id: LUK.23.31
reference: Luke 23:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι εἰ ἐν ⸀τῷ ὑγρῷ ξύλῳ ταῦτα ποιοῦσιν, ἐν τῷ ξηρῷ τί γένηται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/031.yaml
  text: For if they do these things when the wood is green[b][a], what will happen when it is dry?
translation:
  language: te
  text: ఎందుకంటే, పచ్చి కట్టె విషయంలో వారు ఈ పనులు చేస్తే,[a] ఎండిన కట్టె విషయంలో ఏమి జరుగుతుంది?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పచ్చి కట్టెలో వారు ఈ పనులు చేస్తే.” గ్రీకులో పచ్చిగా లేదా తేమగా ఉన్న కట్టె అనే దృశ్యం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: 'ఈ దృశ్యం తక్కువదాని నుంచి ఎక్కువదానికి సాగే భావాన్ని సూచించవచ్చు: పచ్చి కట్టె విషయంలో వారు ఈ పనులు చేస్తే, ఎండిన కట్టె విషయంలో ఇంకెంత తీవ్రమైనది జరుగుతుంది? అయితే కట్టెలు ఎవరిని లేదా దేనిని సూచిస్తున్నాయో వాక్యం స్వయంగా స్పష్టంగా చెప్పదు.'
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి విలాపం, హెచ్చరికలకు కారణాన్ని పరిచయం చేసే causal force‌ను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐν τῷ ὑγρῷ ξύλῳ
  choice: పచ్చి కట్టె విషయంలోనే
  rationale: ὑγρός–ξηρός వ్యత్యాసంలోని సామెతాత్మక దృశ్యాన్ని నిలుపుతూ, తెలుగులో అర్థమయ్యే రీతిగా ‘పచ్చి కట్టె’ అని ఇచ్చింది; ‘విషయంలో’ గ్రీకు ἐν యొక్క సందర్భార్థాన్ని సహజంగా తెలుపుతుంది.
- source_word: ταῦτα ποιοῦσιν
  choice: వారు ఇలా చేస్తే
  rationale: అనిర్దిష్ట బహువచన కర్తను ‘వారు’గా, జరుగుతున్న చర్యలను అతిగా వివరించకుండా ‘ఇలా’గా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῷ ξηρῷ
  choice: ఎండిన కట్టె విషయంలో
  rationale: మొదటి భాగంలోని కట్టెను భావానుసారంగా పునరుక్తి చేసి, పచ్చి–ఎండిన వ్యత్యాసాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: τί γένηται
  choice: ఏమి జరుగుతుంది?
  rationale: భవిష్య ఫలితాన్ని సూచించే అలంకారిక ప్రశ్న బలాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: పచ్చి కట్టె–ఎండిన కట్టె రూపకం
  choice: ప్రధాన పాఠ్యంలో రూపకాన్ని వ్యాఖ్యానించకుండా యథాతథంగా నిలుపడం
  alternative: ‘పచ్చి కట్టె’ యేసును, ‘ఎండిన కట్టె’ యెరూషలేమును లేదా దాని ప్రజలను సూచిస్తుందని స్పష్టీకరించడం; లేదా ఇది తక్కువదాని నుంచి ఎక్కువదానికి తీర్పును సూచించే సాధారణ సామెతగా అనువదించడం
  rationale: ఖచ్చితమైన సూచితార్థాలు వ్యాఖ్యానాత్మకమైనవి. అందువల్ల రాబోయే తీవ్రమైన పరిణామం అనే ఉద్వేగాన్ని ఉంచి, ఏకైక సిద్ధాంత వివరణను పాఠ్యంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘చెట్టు’ కంటే ξύλον యొక్క దహనసంబంధ రూపకానికి సరిపోయే ‘కట్టె’ను ఎంచుకున్నాం. ‘నే’ ద్వారా గ్రీకు వాక్యంలోని lesser-to-greater ఉద్ఘాటన సహజంగా వినిపిస్తుంది.
