  text: This man went to Pilate and asked for the body of Jesus.
translation:
  language: te
  text: ఇతడు పిలాతు దగ్గరికి వెళ్లి యేసు దేహాన్ని ఇవ్వమని అడిగాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: ఇతడు
  rationale: మునుపటి వచనంలో పేర్కొన్న అరిమతయ యోసేపును సూచించే నిర్దేశక సర్వనామ బలాన్ని నిలుపుతూ, కథనంలో సహజంగా ఉంటుంది.
- source_word: προσελθὼν
  choice: పిలాతు దగ్గరికి వెళ్లి
  rationale: ప్రధాన క్రియకు ముందుగా జరిగిన అనుబంధ చర్యను తెలుగులో సహజమైన పూర్వకాలిక క్రియారూపంతో వ్యక్తం చేస్తుంది.
- source_word: τῷ Πιλάτῳ
  choice: పిలాతు దగ్గరికి
  rationale: προσέρχομαιతో వచ్చిన సంప్రదాన విభక్తి, సమీపించిన వ్యక్తిని సూచిస్తుంది; మూలంలో లేని ‘పొంతి’ అనే సమాచారాన్ని చేర్చలేదు.
- source_word: ᾐτήσατο
  choice: తనకు ఇవ్వమని అడిగాడు
  rationale: αἰτέω యొక్క మధ్యమ రూపం ఇక్కడ ఏదైనా కోరడాన్ని సూచిస్తుంది. తెలుగులో ‘దేహాన్ని అడిగాడు’ కంటే, అంతర్లీనంగా ఉన్న అప్పగింత భావాన్ని ‘ఇవ్వమని అడిగాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: τὸ σῶμα
  choice: దేహాన్ని
  rationale: σῶμαకు నేరమైన, గౌరవప్రదమైన సమానార్థకం; ‘శవం’ అనడం మూలపాఠం కంటే కఠినంగా, మరింత వ్యాఖ్యానాత్మకంగా ఉంటుంది.
- source_word: τοῦ Ἰησοῦ
  choice: యేసు
  rationale: సంబంధార్థక షష్ఠీ విభక్తిని తెలుగులో సహజంగా ‘యేసు దేహం’ అనే నిర్మాణంతో వ్యక్తం చేసింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇతడు’ ద్వారా పూర్వవచనంలోని యోసేపుతో అనుసంధానం స్పష్టంగా నిలిచింది; వాక్యాన్ని అనవసరంగా మతపరమైన ప్రత్యేక పదజాలంతో భారంగా చేయలేదు.
