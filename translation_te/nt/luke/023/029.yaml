id: LUK.23.29
reference: Luke 23:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ἰδοὺ ἔρχονται ἡμέραι ἐν αἷς ἐροῦσιν Μακάριαι αἱ στεῖραι καὶ ⸀αἱ κοιλίαι αἳ οὐκ ἐγέννησαν καὶ μαστοὶ οἳ οὐκ ⸀ἔθρεψαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/029.yaml
  text: For look, days are coming in which they will say, ‘Blessed are the barren women, and the wombs that never bore, and the breasts that never nursed.’
translation:
  language: te
  text: ఎందుకంటే, ఇదిగో, ‘సంతానం లేని స్త్రీలు, పిల్లలను కనని గర్భాలు, పిల్లలకు పాలు ఇవ్వని రొమ్ములు ధన్యమైనవి’ అని ప్రజలు చెప్పే రోజులు వస్తున్నాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందరి వాక్యంలో యేసు ఇచ్చిన హెచ్చరికకు కారణాన్ని పరిచయం చేసే అనుసంధాన పదంగా అనువదించబడింది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: రాబోయే పరిస్థితిపై శ్రద్ధను కేంద్రీకరించే ప్రవచనాత్మక ఉద్ఘాటనను నిలుపుతుంది.
- source_word: αἱ στεῖραι
  choice: గొడ్రాళ్లు
  rationale: సంతానం కనలేని స్త్రీలను సూచించే మూలపదాన్ని సంక్షిప్తంగా, సహజమైన బైబిలు తెలుగు పదంతో వ్యక్తపరుస్తుంది.
- source_word: αἱ κοιλίαι αἳ οὐκ ἐγέννησαν
  choice: కనని గర్భాలు
  rationale: మూలంలోని శరీరాంగ ప్రస్తావనను, సమాంతర కవితాత్మక నిర్మాణాన్ని కాపాడుతుంది.
- source_word: μαστοὶ οἳ οὐκ ἔθρεψαν
  choice: పాలివ్వని రొమ్ములు
  rationale: ἔθρεψαν ఇక్కడ శిశువుకు చనుబాలు ఇచ్చి పోషించడాన్ని సూచిస్తుంది; సహజ తెలుగులో సంక్షిప్తంగా వ్యక్తపరచబడింది.
- source_word: Μακάριαι
  choice: ధన్యమైనవి
  rationale: విపత్తు సందర్భంలో ప్రజలు సంతానం లేని స్థితిని మేలైనదిగా ప్రకటించే విరోధాభాసాన్ని పరిష్కరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: సంతానం లేని వారిని ‘ధన్యులు’ అనడం
  choice: ఉద్ధరణలోని విరోధాభాసాన్ని యథాతథంగా నిలుపుతూ ‘ధన్యమైనవి’ అని అనువదించడం
  alternative: ‘మేలైనవి’ లేదా ‘అదృష్టవంతులు’ అని వివరణాత్మకంగా మార్చడం
  rationale: ఇది సంతానలేమిపై సాధారణ ధార్మిక ప్రకటన కాదు; రాబోయే భయంకర దినాల్లో ప్రజలు పలికే మాట. మూలంలోని μακάριαι పదం మరియు దాని తీవ్ర వ్యంగ్యాత్మక ఉద్వేగం నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని మూడు సమాంతర నామవాచక భాగాలను ఒకే ఉద్ధరణలో ఉంచి వాక్య లయను కాపాడాం; వివరణాత్మక పదాలను చేర్చలేదు.
