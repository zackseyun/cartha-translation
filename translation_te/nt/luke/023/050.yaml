id: LUK.23.50
reference: Luke 23:50
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ἀνὴρ ὀνόματι Ἰωσὴφ βουλευτὴς ὑπάρχων, ⸀ἀνὴρ ἀγαθὸς καὶ δίκαιος—
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/050.yaml
  text: And behold[a], a man named Joseph, who was a council member, a good and righteous man—
translation:
  language: te
  text: ఇదిగో, యోసేపు అనే ఒక మనిషి ఉన్నాడు; అతడు మహాసభ సభ్యుడు, మంచివాడు, నీతిమంతుడు—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: ఇదిగో
  rationale: లూకా ఉపయోగించిన దృష్టిని ఆకర్షించే కథన సూచకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది. గ్రీకు సంధాయకమైన Καίని ప్రత్యేకంగా ‘మరియు’ అని చేర్చడం తెలుగులో అసహజంగా ఉండేందున ‘ఇదిగో’లోనే కథన కొనసాగింపు వ్యక్తమవుతుంది.
- source_word: ἀνὴρ
  choice: ఒక మనిషి
  rationale: ఇక్కడ ἀνήρ వయోజన పురుష వ్యక్తిని సూచిస్తుంది. ‘ఒక మనిషి’ అనే రూపం వ్యక్తిని పరిచయం చేసే తెలుగు కథన శైలికి సహజంగా ఉంటుంది.
- source_word: ὀνόματι Ἰωσὴφ
  choice: యోసేపు అనే
  rationale: ὀνόματι అనే దత్తివిభక్తి పరిచయ సూత్రాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ వ్యక్తినామాన్ని లిప్యంతరీకరిస్తుంది.
- source_word: βουλευτὴς ὑπάρχων
  choice: అతడు మహాసభ సభ్యుడు
  rationale: βουλευτής పాలక మండలి సభ్యుణ్ణి సూచిస్తుంది; ఈ శ్రమవృత్తాంత సందర్భంలో యూదుల మహాసభ ఉద్దేశించబడింది. ὑπάρχωνను తెలుగులో సహజమైన సమాపక వాక్యంతో వ్యక్తపరచడం స్పష్టతనిస్తుంది.
- source_word: ἀνὴρ ἀγαθὸς καὶ δίκαιος
  choice: మంచివాడు, నీతిమంతుడు
  rationale: ἀγαθόςను ‘మంచివాడు’ అని, δίκαιοςను నైతిక-ఆధ్యాత్మిక యథార్థతను నిలుపుతూ ‘నీతిమంతుడు’ అని అనువదించాం. గ్రీకులో పునరుక్తమైన ἀνήρ ఇచ్చే వ్యక్తి-వర్ణన బలాన్ని తెలుగులో ఈ రెండు వ్యక్తివాచక విశేషణ రూపాలు సహజంగా మోస్తాయి; ‘మనిషి’ని మళ్లీ పలకడం అసహజంగా ఉంటుంది.
theological_decisions:
- issue: పాత్ర వర్ణనలో δίκαιος అనువాదం
  choice: నీతిమంతుడు
  alternative: న్యాయవంతుడు
  rationale: δίκαιος నైతిక యథార్థతతో పాటు న్యాయపరమైన భావాన్ని కూడా కలిగి ఉండవచ్చు. ఇక్కడ యోసేపు దేవుని ఎదుట, మనుషుల ఎదుట సత్ప్రవర్తన గలవాడని ప్రశంసించే విస్తృత బైబిలు భావాన్ని ‘నీతిమంతుడు’ మెరుగుగా నిలుపుతుంది; దీనిని సాంకేతిక సిద్ధాంతపదంగా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని అసంపూర్ణ కొనసాగింపును చివరి దీర్ఘవిరామ చిహ్నంతో నిలిపాం.
