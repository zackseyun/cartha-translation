id: LUK.23.14
reference: Luke 23:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν πρὸς αὐτούς· Προσηνέγκατέ μοι τὸν ἄνθρωπον τοῦτον ὡς ἀποστρέφοντα τὸν λαόν, καὶ ἰδοὺ ἐγὼ ἐνώπιον ὑμῶν ἀνακρίνας ⸀οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον ὧν κατηγορεῖτε κατ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/014.yaml
  text: He said to them[a], “You brought this man to me as one who was misleading the people, and behold, after examining him before you[b], I found no basis in this man for the charges you bring against him.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “ప్రజలను తప్పుదారి పట్టిస్తున్నవాడని[a] మీరు ఈ మనిషిని నా దగ్గరకు తీసుకొచ్చారు. ఇదిగో, మీ ఎదుటే ఇతన్ని విచారించిన తరువాత, మీరు ఇతనిపై మోపుతున్న ఆరోపణలకు ఇతనిలో ఏ ఆధారమూ నాకు కనిపించలేదు.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజలను దారి మళ్లిస్తున్నవాడని.” గ్రీకు క్రియకు దారి మళ్లించడం లేదా తప్పుదారి పట్టించడం అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీరు ఇతనిపై మోపుతున్న ఆరోపణల విషయంలో ఇతనిలో ఏ దోషమూ నాకు కనిపించలేదు.”
    reason: alternative_reading
lexical_decisions:
- source_word: Προσηνέγκατέ μοι
  choice: మీరు ... నా దగ్గరకు తీసుకొచ్చారు
  rationale: వారు యేసును పిలాతు దగ్గరకు తీసుకొచ్చిన పూర్తయిన చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; న్యాయవిచారణ సందర్భాన్ని కూడా నిలుపుతుంది.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: ఈ మనిషిని
  rationale: ఇక్కడ ἄνθρωπος ఒక నిర్దిష్ట పురుషుణ్ణి సూచిస్తుంది; ‘ఈ మనిషి’ సందర్భానికి సహజంగా, కచ్చితంగా సరిపోతుంది.
- source_word: ὡς ἀποστρέφοντα τὸν λαόν
  choice: ప్రజలను తప్పుదారి పట్టిస్తున్నవాడని
  rationale: ἀποστρέφω అనే క్రియకు ‘దారి మళ్లించడం’ లేదా ‘తప్పుదారి పట్టించడం’ అనే అర్థాలు ఉన్నాయి. ‘తప్పుదారి పట్టించడం’ ఆరోపణ స్వభావాన్ని తెలియజేస్తుంది; మూలంలో స్పష్టంగా లేని ‘తిరుగుబాటుకు రెచ్చగొట్టడం’ అనే బలమైన భావాన్ని చేర్చదు.
- source_word: τὸν λαόν
  choice: ప్రజలను
  rationale: లూకా రచనలో λαός సాధారణంగా ప్రజలను సమష్టిగా సూచిస్తుంది; ‘ప్రజలు’ సూటిగా, సహజంగా ఉంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రోతల దృష్టిని తరువాతి ప్రకటనవైపు మళ్లించే మూలపాఠంలోని ఉద్ఘాటనను గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐνώπιον ὑμῶν
  choice: మీ ఎదుటే
  rationale: విచారణ వారి సమక్షంలో బహిరంగంగా జరిగిందనే ఉద్ఘాటనను ‘ఏ’ నిపాతంతో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνακρίνας
  choice: ఇతన్ని విచారించిన తరువాత
  rationale: న్యాయసంబంధ సందర్భంలో ἀνακρίνω అంటే విచారించడం లేదా ప్రశ్నించి పరిశీలించడం. అస్పష్టంగా ఉన్న కర్మను సందర్భానుసారంగా ‘ఇతన్ని’ అని తెలుగులో వ్యక్తం చేశాం.
- source_word: οὐθὲν εὗρον ... αἴτιον
  choice: ఏ ఆధారమూ నాకు కనిపించలేదు
  rationale: αἴτιον న్యాయసందర్భంలో ఆరోపణకు కారణం, ఆధారం లేదా దోషాన్ని సూచించగలదు. ‘ఆధారం’ అనే పదం పిలాతు చేసిన న్యాయపరమైన నిర్ధారణను తెలియజేస్తూ, సంపూర్ణ నైతిక నిర్దోషిత్వం అనే భావాన్ని అవసరం లేకుండా చేర్చదు.
- source_word: ὧν κατηγορεῖτε κατ’ αὐτοῦ
  choice: మీరు ఇతనిపై మోపుతున్న ఆరోపణలకు
  rationale: κατηγορέω అనే న్యాయపదంలోని ‘ఆరోపించడం’ అనే భావాన్ని నిలుపుతూ, తెలుగులో సహజమైన న్యాయపరమైన వాక్యనిర్మాణాన్ని ఇస్తుంది.
theological_decisions:
- issue: పిలాతు ప్రకటన స్వభావం
  choice: పిలాతు, వారు మోపిన ఆరోపణలకు ఈ మనిషిలో ఆధారం కనుగొనలేదనే న్యాయపరమైన నిర్ధారణగా అనువదించడం
  alternative: ‘ఈ మనిషిలో ఏ దోషమూ నాకు కనిపించలేదు’
  rationale: ἀνακρίνω, αἴτιον, κατηγορέω వంటి పదాలు న్యాయవిచారణ సందర్భాన్ని ఏర్పరుస్తాయి. అందువల్ల తక్షణ ఆరోపణల విషయమై చేసిన నిర్ధారణను ప్రధాన పాఠంలో నిలిపి, విస్తృతమైన నైతిక లేదా సిద్ధాంతపరమైన తీర్పును పాఠంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయవిచారణ శైలిని ఉపయోగించాం. ‘ఇదిగో’ మూలంలోని ఉద్ఘాటనను నిలుపుతుంది; ‘మీ ఎదుటే’ విచారణ బహిరంగంగా జరిగిన సంగతిని నొక్కిచెబుతుంది. ‘ఇతను/ఇతని’ రూపాలు సందర్భంలో సహజంగా ఉండి, అవమానార్థాన్ని మోపవు.
