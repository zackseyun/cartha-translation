translation:
  language: te
  text: కాని ఆయనను సిలువ వేయించాలని కోరుతూ వారు బిగ్గర కేకలతో పట్టుబడుతూనే ఉన్నారు; వారి కేకలు పైచేయి సాధించాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέκειντο
  choice: పట్టుబడుతూనే ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం వారి ఒత్తిడి ఒక్కసారి చేసినది కాకుండా కొనసాగిందని తెలియజేస్తుంది. ఈ సందర్భంలో ‘పట్టుబడుతూనే ఉన్నారు’ దూకుడైన నిరంతర insistenceను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: φωναῖς μεγάλαις
  choice: పెద్ద కేకలతో
  rationale: φωνήకి ‘స్వరం’ లేదా ‘కేక’ అనే అర్థాలు సాధ్యం. శిక్ష కోరుతూ గుంపు గట్టిగా అరుస్తున్న సందర్భంలో ‘పెద్ద కేకలతో’ సహజంగా ఉండి, శబ్ద తీవ్రతను నిలుపుతుంది.
- source_word: αἰτούμενοι
  choice: వేయించాలని
  rationale: అక్షరార్థంగా ‘కోరుతూ’ అయినా, తెలుగులో ప్రధాన క్రియతో కలిపిన ‘వేయించాలని ... పట్టుబడుతూనే ఉన్నారు’ నిర్మాణం అభ్యర్థన విషయాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; బలవంతపు ధోరణి ప్రధాన క్రియ ద్వారా వ్యక్తమవుతుంది.
- source_word: αὐτὸν σταυρωθῆναι
  choice: ఆయనను సిలువ వేయించాలని
  rationale: గ్రీకు కర్మ-క్రియార్థక నిర్మాణంలోని భావాన్ని సహజ తెలుగు content constructionగా ఇస్తుంది. ‘సిలువ వేయడం’ సాధారణ ఆధునిక తెలుగు బైబిలు వాడుకకు స్పష్టమైనది.
- source_word: κατίσχυον
  choice: పైచేయి సాధించాయి
  rationale: ఈ క్రియ వారి కేకలు చివరకు ప్రభావవంతమై గెలిచినట్టు సూచిస్తుంది. ‘పైచేయి సాధించాయి’ న్యాయ విచారణలో వారి ఒత్తిడి బలపడిన భావాన్ని సహజంగా ఇస్తుంది.
- source_word: αἱ φωναὶ αὐτῶν
  choice: వారి కేకలే
  rationale: మొదటి భాగంలోని φωναῖςను ‘కేకలతో’ అని అనువదించినందున ఇక్కడ కూడా ‘కేకలు’ అని పునరావృతం చేసి గ్రీకు పదబంధ సంబంధాన్ని నిలిపాం. ‘-ఏ’ వారి కేకల ప్రభావాన్నే కథనం ముందుకు తెస్తున్నదని తెలుపుతుంది.
