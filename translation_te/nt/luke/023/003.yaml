id: LUK.23.3
reference: Luke 23:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ⸀ἠρώτησεν αὐτὸν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς αὐτῷ ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/003.yaml
  text: Then Pilate asked him[a], saying, “Are you the king of the Jews?” And answering him, he said[b], “You say so.”
translation:
  language: te
  text: అప్పుడు పిలాతు ఆయనను, “నీవు యూదుల[a] రాజువా?” అని అడిగాడు. అందుకు ఆయన, “నీవే అంటున్నావు” అని జవాబిచ్చాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యూదయవాసుల రాజువా?’ గ్రీకు పదం సందర్భానుసారం ‘యూదులు’ లేదా ‘యూదయవాసులు’ అని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నీవు అలా అంటున్నావు’; భావార్థంగా ‘అవును, నీవు అన్నట్టే.’ గ్రీకు జవాబు సంక్షిప్తమైనది; దాన్ని అర్హతతో కూడిన సమ్మతిగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక కథనాన్ని ముందుకు నడిపే స్వల్ప అనుసంధానాన్ని సూచిస్తుంది; ‘అప్పుడు’ సహజమైన క్రమాన్ని తెలియజేస్తుంది.
- source_word: ἠρώτησεν
  choice: అడిగాడు
  rationale: ἐρωτάω యొక్క భూతకాల రూపం పిలాతు వేసిన ప్రత్యక్ష ప్రశ్నను పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ‘అడిగాడు’ సహజంగా, ఖచ్చితంగా ఉంటుంది.
- source_word: λέγων
  choice: అని
  rationale: గ్రీకు భాషలోని ‘చెబుతూ’ అనే కృదంత భావాన్ని తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో ‘అని’ సహజంగా వ్యక్తపరుస్తుంది; ‘చెబుతూ అడిగాడు’ అనడం అనవసరంగా కఠినంగా ఉంటుంది.
- source_word: Σὺ εἶ
  choice: నీవు ... వా?
  rationale: సందర్భంలో ఇది స్పష్టమైన ప్రశ్న; తెలుగు ప్రశ్నార్థక నిర్మాణం ద్వారా దానిని సహజంగా వ్యక్తపరచాం.
- source_word: βασιλεὺς
  choice: రాజు
  rationale: βασιλεύς నేరుగా రాజును సూచిస్తుంది; ‘పాలకుడు’ అనడం విచారణలో ఉన్న రాజాధికార దావాను బలహీనపరుస్తుంది.
- source_word: τῶν Ἰουδαίων
  choice: యూదుల
  rationale: Ἰουδαῖοι అనే పదం సందర్భానుసారం యూదులు లేదా యూదయవాసులు అని అర్థమవవచ్చు. శ్రమవృత్తాంతంలోని రాజకీయ-మతపరమైన బిరుదు సందర్భంలో ‘యూదుల రాజు’ సహజమైన ప్రధాన పాఠం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἀποκριθεὶς αὐτῷ ἔφη
  choice: అందుకు ఆయన ... అని జవాబిచ్చాడు
  rationale: కృదంతం మరియు పరోక్ష కర్మను తెలుగులో సహజమైన ప్రతిస్పందన నిర్మాణంతో వ్యక్తపరుస్తుంది; మూలంలోని జవాబు భావాన్ని నిలుపుతూ అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: Σὺ λέγεις
  choice: నీవే అంటున్నావు
  rationale: గ్రీకు జవాబు సంక్షిప్తంగా, కొంత పరోక్షంగా ఉంది. ‘నీవే అంటున్నావు’ అనే రూపం నిరాకరణ చేయకుండా, ఆ బిరుదును పిలాతు మాటగానే ప్రతిధ్వనింపజేసే ఉద్వేగాన్ని నిలుపుతుంది.
theological_decisions:
- issue: Σὺ λέγεις అనే యేసు జవాబు యొక్క భావబలం
  choice: అర్హతతో కూడిన సమ్మతిని సూచించగల, ఉద్దేశపూర్వకంగా పరోక్షమైన ‘నీవే అంటున్నావు’
  alternative: ‘అవును, నీవు అన్నట్టే’ అనే స్పష్టమైన సమ్మతి; లేదా ‘అది నీవు చెప్పిన మాట’ అనే మరింత దూరం చూపే రూపం
  rationale: గ్రీకు వాక్యం కేవలం ‘అవును’ కంటే పరోక్షమైనది; అయితే అది బిరుదును నిరాకరించదు. ప్రధాన పాఠంలో ఈ వేదాంతపరమైన, వాక్చాతుర్యపరమైన ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతూ, పాదసూచికలో సాధ్యమైన భావాలను తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని λέγων అనే పునరుక్త నిర్మాణాన్ని తెలుగులో కఠినంగా అనుకరించకుండా ‘అని అడిగాడు’గా మార్చాం. Σὺ λέγεις లోని సంక్షిప్తతను, పరోక్షతను ‘నీవే అంటున్నావు’ ద్వారా నిలిపాం; అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
