  edition: SBLGNT
  text: παιδεύσας οὖν αὐτὸν ⸀ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/016.yaml
  text: Therefore[a], after disciplining him, I will release him.
translation:
  language: te
  text: కాబట్టి, అతన్ని శిక్షించిన తర్వాత[a] విడుదల చేస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దండించిన తర్వాత.’ ఈ క్రియ సరిదిద్దే ఉద్దేశంతో విధించే శిక్షను కూడా సూచించవచ్చు. ఇక్కడ కొందరు దీనిని ప్రత్యేకంగా కొరడాలతో కొట్టించడమని అర్థం చేసుకుంటారు; అయితే గ్రీకు క్రియ స్వయంగా అంత నిర్దిష్టంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύσας
  choice: శిక్షించిన తర్వాత
  rationale: ఇది భూతకాలక క్రియావిశేషణ రూపం; ఇక్కడ కాలసంబంధ భావాన్ని చూపుతుంది. న్యాయవిచారణ సందర్భంలో παιδεύω శిక్షించడం లేదా దండించడం అనే భావం ఇస్తుంది. శిక్ష విధానాన్ని గ్రీకు పదం స్వయంగా నిర్దిష్టంగా చెప్పదు కాబట్టి ‘కొరడాలతో కొట్టించిన తర్వాత’ అని పరిమితం చేయలేదు.
- source_word: οὖν
  choice: కాబట్టి
  rationale: పిలాతు మాటల్లో ముందున్న విషయాలనుంచి తీసుకున్న నిర్ణయాన్ని లేదా తదుపరి చర్యను సూచించే తార్కిక సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: αὐτόν
  choice: అతన్ని
  rationale: యేసును సూచించే కర్మకారక ఏకవచన సర్వనామానికి సహజమైన తెలుగు రూపం.
- source_word: ἀπολύσω
  choice: విడుదల చేస్తాను
  rationale: న్యాయపరమైన నిర్బంధ సందర్భంలో విడుదల చేయడం అనే భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: పిలాతు ప్రతిపాదనలో παιδεύω పదం పరిధి
  choice: న్యాయపరమైన శిక్ష భావంతో ‘శిక్షించిన తర్వాత’
  alternative: ‘దండించిన తర్వాత’; ‘కొరడాలతో కొట్టించిన తర్వాత’; ‘క్రమశిక్షణ చేసిన తర్వాత’
  rationale: విచారణ సందర్భం విద్యాబోధ లేదా సాధారణ క్రమశిక్షణ కంటే శిక్షాత్మక చర్యను కోరుతుంది. అయితే శిక్షను కొరడాదెబ్బలుగా గ్రీకు క్రియ స్వయంగా నిర్దిష్టపరచదు; అందువల్ల విస్తృతమైన పదాన్ని ఎంచుకుని ఆ అనిశ్చితిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన న్యాయపరమైన వాక్యనిర్మాణం. ‘కాబట్టి’ ద్వారా οὖν యొక్క తార్కిక బంధం నిలిపి, ‘శిక్షించిన తర్వాత’ ద్వారా క్రియావిశేషణ రూపంలోని కాలసంబంధాన్ని సహజంగా వ్యక్తం చేశాం.
