  text: ⸀Ἀνέκραγον δὲ παμπληθεὶ λέγοντες· Αἶρε τοῦτον, ἀπόλυσον δὲ ἡμῖν ⸀τὸν Βαραββᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/018.yaml
  text: But they all cried out together[a], saying, “Take this man away, and release Barabbas to us!”
translation:
  language: te
  text: అయితే వారందరూ కలిసి, “ఇతణ్ణి తీసుకుపో[a]; బరబ్బాను మాకు విడుదల చేయి!” అని కేకలు వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ మనిషిని తొలగించు.” గ్రీకు ఆజ్ఞను మరింత క్లుప్తంగా అనువదించవచ్చు; ఇతణ్ణి తమ ఎదుటనుండి తీసివేయాలనే డిమాండే దీని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέκραγον
  choice: కేకలు వేశారు
  rationale: ఈ క్రియ బిగ్గరగా చేసిన సామూహిక ఆక్రోశాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘కేకలు వేశారు’ సహజంగా ఉండి తీవ్రతను నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి సంభాషణకు విరుద్ధమైన మలుపును సూచించే కథన సంధిగా ఇక్కడ ‘అయితే’ తగినది.
- source_word: παμπληθεὶ
  choice: వారంతా ఒక్కసారిగా
  rationale: మొత్తం సమూహం కలిసి స్పందించిందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘ఏకకంఠంతో’ అన్నదానికంటే తక్కువ వ్యాఖ్యానాత్మకం.
- source_word: λέγοντες
  choice: … అని
  rationale: గ్రీకు వర్తమాన కృదంతం కేకల విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ఉద్ధరణ తర్వాత ‘అని’ వాడటం సహజమైన నిర్మాణం.
- source_word: Αἶρε
  choice: తీసుకుపో
  rationale: ఇక్కడ ఆ వ్యక్తిని తమ ఎదుటనుండి తొలగించాలనే ఆజ్ఞ ఉంది. ‘తీసుకుపో’ దాని బలాన్ని సహజంగా తెలియజేస్తూ, మరణశిక్షను గ్రీకు పదం కంటే స్పష్టంగా చేర్చదు.
- source_word: τοῦτον
  choice: ఇతణ్ణి
  rationale: సమీపంలో ఉన్న యేసును సూచించే పుంలింగ ఏకవచన సర్వనామపు నిర్దేశక బలాన్ని నిలుపుతుంది.
- source_word: ἀπόλυσον
  choice: విడుదల చేయి
  rationale: నిర్బంధం నుంచి విడిచిపెట్టడాన్ని సూచించే న్యాయసంబంధ సందర్భానికి ఈ పదబంధం స్పష్టంగా సరిపోతుంది.
- source_word: ἡμῖν
  choice: మాకు
  rationale: విడుదల వల్ల లబ్ధి పొందేవారిని సూచించే దత్తి విభక్తి భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: τὸν Βαραββᾶν
  choice: బరబ్బాను
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు లిప్యంతరీకరణలో, వాక్యంలోని కర్మరూపానికి తగిన విభక్తితో ఇచ్చింది.
theological_decisions:
- issue: Αἶρε అనే ఆజ్ఞ మరణాన్ని నేరుగా సూచిస్తుందా?
  choice: మరణశిక్షను స్పష్టంగా చేర్చకుండా ‘తీసుకుపో’ అని అనువదించడం
  alternative: ‘ఇతణ్ణి చంపివేయి’
  rationale: సందర్భంలో యేసును మరణానికి అప్పగించాలనే ఉద్దేశం ఉండవచ్చు; అయినా αἶρε స్వయంగా ప్రధానంగా తొలగించు/తీసుకుపో అనే భావాన్నే ఇస్తుంది. అందువల్ల సందర్భార్థాన్ని పాఠ్యంలో అతిగా స్పష్టీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. సమూహపు తీవ్రతను ‘వారంతా ఒక్కసారిగా’ మరియు ‘కేకలు వేశారు’ ద్వారా నిలిపి, ‘ఏకకంఠంతో’ వంటి కొద్దిగా వ్యాఖ్యానాత్మకమైన ప్రయోగాన్ని నివారించాం.
