source:
  edition: SBLGNT
  text: Ἰδὼν δὲ ὁ ἑκατοντάρχης τὸ γενόμενον ⸀ἐδόξαζεν τὸν θεὸν λέγων· Ὄντως ὁ ἄνθρωπος οὗτος δίκαιος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/047.yaml
  text: When the centurion saw what had happened[a], he glorified God, saying, “Certainly this man was righteous.”
translation:
  language: te
  text: జరిగినదాన్ని చూసిన శతాధిపతి, “నిజంగా ఈ మనిషి నీతిమంతుడుగా ఉన్నాడు[a]” అంటూ దేవుణ్ణి మహిమపరిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నిర్దోషి,” లేదా “న్యాయవంతుడు.” గ్రీకు పదం సందర్భాన్ని బట్టి నైతిక నీతిమంతత్వాన్ని లేదా న్యాయపరమైన నిర్దోషిత్వాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν
  choice: చూసిన
  rationale: ὁράω యొక్క భూతకాల కృదంత రూపాన్ని ప్రధాన క్రియతో సహజమైన కాలసంబంధంలో కలిపి తెలుగులో ‘చూసిన’గా అనువదించాం.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది స్వల్ప కథన అనుసంధాన సూచకం. తెలుగులో వాక్యప్రవాహమే ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది; ‘అయితే’ అని పెడితే మూలంలో ఉన్నదానికంటే ఎక్కువ వ్యతిరేక భావం కలగవచ్చు.
- source_word: ὁ ἑκατοντάρχης
  choice: శతాధిపతి
  rationale: రోమా సైన్యంలోని ఈ నిర్దిష్ట హోదాకు తెలుగులో స్థిరపడిన, సంక్షిప్తమైన పదం.
- source_word: τὸ γενόμενον
  choice: జరిగినది
  rationale: ఇప్పుడే సంభవించిన ఘటనను సూచించే నామీకృత కృదంతానికి సహజమైన తెలుగు రూపం; ‘జరిగినదంతా’ అని మూలానికి మించి విస్తరించలేదు.
- source_word: ἐδόξαζεν
  choice: మహిమపరిచాడు
  rationale: δοξάζω యొక్క దేవునికి మహిమ చెల్లించే బలమైన భావాన్ని నిలుపుతుంది. గ్రీకు అసంపూర్ణ భూతకాల రూపాన్ని తెలుగులో కృత్రిమంగా విస్తరించకుండా సహజ కథన భూతకాలంతో తెలిపాం.
- source_word: τὸν θεὸν
  choice: దేవుణ్ణి
  rationale: ప్రత్యక్ష కర్మను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలిపే రూపం.
- source_word: λέγων
  choice: అంటూ
  rationale: మహిమపరచడం ఏ మాటల ద్వారా వ్యక్తమైందో సహజంగా కలుపుతూ వర్తమాన కృదంత సంబంధాన్ని నిలుపుతుంది.
- source_word: Ὄντως
  choice: నిజంగా
  rationale: బలమైన ధృవీకరణను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: ఈ మనిషి
  rationale: యేసును నిర్దిష్ట పురుష వ్యక్తిగా సూచించే మూలపదబంధానికి నేరుగా సరిపోతుంది.
- source_word: δίκαιος
  choice: నీతిమంతుడు
  rationale: నైతిక, ధార్మిక బరువును కాపాడే ప్రధాన అర్థం. న్యాయపరమైన ‘నిర్దోషి’ అనే సందర్భోచిత అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἦν
  choice: తెలుగు నామవాచక విధేయంలో అంతర్లీనంగా ఉంది
  rationale: ‘ఈ మనిషి నీతిమంతుడు’ అనే సహజ తెలుగు వాక్యంలో భూతకాల సహాయక క్రియను తప్పనిసరిగా పలకనవసరం లేదు; ఈ మాట మరణించిన యేసు గురించి పలికిన సందర్భం ద్వారా కాలసూచన స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: శతాధిపతి మాటలో δίκαιος పదం అర్థం
  choice: నీతిమంతుడు
  alternative: నిర్దోషి; న్యాయవంతుడు
  rationale: ‘నీతిమంతుడు’ అనే రూపం పదంలోని నైతిక, ధార్మిక బరువును నిలుపుతుంది. అయితే లూకా వృత్తాంతంలో యేసు అన్యాయంగా శిక్షించబడ్డాడనే న్యాయస్థాన సందర్భం వల్ల ‘నిర్దోషి’ కూడా సాధ్యమైన అర్థం; అందువల్ల ఆ సందిగ్ధతను పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘శతాధిపతి,’ ‘మహిమపరిచాడు,’ ‘నీతిమంతుడు’ వంటి బైబిలు సందర్భంలో సుపరిచితమైన పదాలను ఉపయోగించినప్పటికీ వాక్యనిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా ఉంచాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘నీతిమంతుడు’ పదానికే జతచేశాం.
