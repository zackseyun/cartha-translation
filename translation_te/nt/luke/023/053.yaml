id: LUK.23.53
reference: Luke 23:53
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀καθελὼν ἐνετύλιξεν αὐτὸ σινδόνι, καὶ ἔθηκεν ⸀αὐτὸν ἐν μνήματι λαξευτῷ οὗ οὐκ ἦν ⸂οὐδεὶς οὔπω⸃ κείμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/053.yaml
  text: And after taking him down[a], he wrapped him in a linen cloth and placed him in a tomb cut in stone[b], where no one had yet been laid.
translation:
  language: te
  text: ఆయనను దింపి, నారబట్టలో చుట్టి, రాతిలో తొలిచిన సమాధిలో[a] ఉంచాడు; అందులో అప్పటివరకు ఎవరి దేహమూ ఉంచబడలేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చెక్కిన సమాధిలో,” లేదా “బండలో తొలిచిన సమాధిలో.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అందులో ఇంతకుముందు ఎవరూ ఉంచబడి ఉండలేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: ఆయనను దింపి
  rationale: καθαιρέω అనే క్రియ ఇక్కడ యేసును సిలువపై నుండి దింపడాన్ని సూచిస్తుంది. తెలుగు సందర్భంలో ‘ఆయనను దింపి’ సహజంగా ఉండి, ప్రధాన క్రియలకు ముందు జరిగిన చర్యను తెలియజేస్తుంది.
- source_word: ἐνετύλιξεν
  choice: చుట్టి
  rationale: ἐντυλίσσω బట్టలో చుట్టడాన్ని సూచిస్తుంది. ‘చుట్టి’ అనేది స్పష్టమైన, సహజమైన ఆధునిక తెలుగు రూపం; మూలంలో లేని అదనపు అంత్యక్రియల వివరాలను చేర్చదు.
- source_word: σινδόνι
  choice: నారబట్టలో
  rationale: σινδών నారతో చేసిన బట్టను, ఈ సందర్భంలో మృతదేహాన్ని చుట్టే బట్టను సూచిస్తుంది. ‘నారబట్ట’ పదార్థాన్ని స్పష్టంగా తెలియజేస్తూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంటుంది.
- source_word: ἔθηκεν
  choice: ఉంచాడు
  rationale: τίθημι ఇక్కడ దేహాన్ని సమాధిలో ఉంచడాన్ని సూచిస్తుంది. ‘ఉంచాడు’ సరళమైనదీ గౌరవప్రదమైనదీ.
- source_word: μνήματι
  choice: సమాధిలో
  rationale: μνῆμα అనేది మృతదేహాన్ని ఉంచే సమాధి స్థలాన్ని సూచిస్తుంది. తెలుగు బైబిలు సందర్భంలో ‘సమాధి’ స్పష్టమైన, స్థిరమైన పదం.
- source_word: λαξευτῷ
  choice: రాతిలో తొలిచిన
  rationale: λαξευτός రాయి లేదా బండను తొలిచి తయారు చేసినదని సూచిస్తుంది. ‘రాతిలో తొలిచిన’ అనేది నిర్మాణ విధానాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: οὗ
  choice: అందులో
  rationale: సంబంధ క్రియావిశేషణమైన οὗ ముందున్న సమాధిని సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ‘అందులో’ సహజంగా ఆ సంబంధాన్ని కొనసాగిస్తుంది.
- source_word: οὐδεὶς οὔπω κείμενος
  choice: అందులో అప్పటివరకు ఎవరినీ ఉంచలేదు
  rationale: ఈ పదబంధం ఆ సమాధిలో అప్పటివరకు ఏ వ్యక్తి దేహాన్నీ ఉంచలేదని తెలియజేస్తుంది. తెలుగు అంత్యక్రియల సందర్భంలో ‘ఎవరినీ ఉంచలేదు’ సహజంగా ఉండి, సమాధి ఇంతకుముందు ఉపయోగించబడలేదనే భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: సమాధి స్వరూపం మరియు అది ఇంతకుముందు ఉపయోగించబడకపోవడం
  choice: యేసును రాతిలో తొలిచిన, అప్పటివరకు ఎవరినీ ఉంచని సమాధిలో ఉంచినట్లు అనువదించడం
  alternative: ‘చెక్కిన సమాధి’ అని, లేదా ‘అందులో ఇంతకుముందెవరూ ఎన్నడూ పడుకోలేదు’ అని అనువదించడం
  rationale: వచనం చారిత్రక సమాధి వివరాన్ని మాత్రమే ఇస్తుంది. సమాంతర సువార్తల నుండి వివరాలను చేర్చకుండా, సమాధి రాతిలో తొలిచినదనీ ఇంతకుముందు ఉపయోగించబడలేదనీ మూలపాఠం చెప్పే రెండు అంశాలను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి పాటించబడింది. గ్రీకు వాక్యంలోని చర్యల క్రమం నిలుపబడింది; ‘సిలువపై నుండి’ అనే సందర్భస్పష్టీకరణను మూల వచనంలో ప్రత్యక్షంగా లేకపోవడంతో ప్రధాన పాఠంలో చేర్చలేదు.
