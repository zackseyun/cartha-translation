  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἠκολούθει δὲ αὐτῷ πολὺ πλῆθος τοῦ λαοῦ καὶ γυναικῶν ⸀αἳ ἐκόπτοντο καὶ ἐθρήνουν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/027.yaml
  text: A large crowd of people followed him, including women who were beating their breasts and mourning for him.
translation:
  language: te
  text: ప్రజల పెద్ద గుంపు ఆయనను వెంబడిస్తూ వచ్చింది; వారిలో రొమ్ములు బాదుకుంటూ ఆయన కోసం విలపిస్తూ ఉన్న స్త్రీలు కూడా ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκολούθει
  choice: వెంబడిస్తూ వచ్చారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న చర్యను సూచిస్తుంది; ఆధునిక తెలుగులో ఈ సందర్భానికి ‘వెంబడిస్తూ వచ్చారు’ సహజంగా ఉంది.
- source_word: δὲ
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: ఇది కథన కొనసాగింపును సూచిస్తుంది; తెలుగులో ప్రత్యేక సంధిపదం లేకుండానే ఆ కొనసాగింపు స్పష్టంగా ఉంటుంది.
- source_word: πολὺ πλῆθος τοῦ λαοῦ
  choice: ప్రజల్లో చాలామంది
  rationale: గ్రీకు పదబంధం పెద్ద ప్రజాసమూహాన్ని సూచిస్తుంది. యాంత్రికంగా ‘ప్రజల పెద్ద సమూహం’ అనడం కంటే ఇది సహజమైన ఆధునిక తెలుగు.
- source_word: καὶ γυναικῶν αἳ
  choice: వారిలో కొందరు స్త్రీలు
  rationale: స్త్రీలు ఆ సమూహంలో ఉన్నారని తెలియజేస్తూ, స్త్రీలింగ బహువచన సంబంధ సర్వనామం తరువాతి చర్యలకు ప్రత్యేకంగా స్త్రీలనే కర్తలుగా చూపుతుందని స్పష్టం చేస్తుంది.
- source_word: ἐκόπτοντο
  choice: తమ రొమ్ములు బాదుకుంటూ
  rationale: శోక సందర్భంలో ఈ మధ్యమ రూపం దుఃఖ సూచకంగా రొమ్ములు బాదుకోవడాన్ని సూచిస్తుంది; క్రియలో అంతర్లీనంగా ఉన్న సాంస్కృతిక చర్యను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐθρήνουν αὐτόν
  choice: ఆయన కోసం విలపిస్తున్నారు
  rationale: θρηνέω వినిపించే శోకవిలాపాన్ని సూచిస్తుంది; ‘ఆయన కోసం’ అనేది దాని కర్మను తెలుగులో సహజంగా తెలియజేస్తుంది.
