translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని కొనసాగుతున్న మూడు అసంపూర్ణ భూతకాల చర్యలను సహజ తెలుగు క్రియారూపాలతో నిలిపి, సంబంధ వాక్యం స్త్రీలను మాత్రమే సూచిస్తుందని స్పష్టపరచబడింది.
