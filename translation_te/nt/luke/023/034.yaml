id: LUK.23.34
reference: Luke 23:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ Ἰησοῦς ἔλεγεν· Πάτερ, ἄφες αὐτοῖς, οὐ γὰρ οἴδασιν τί ποιοῦσιν.⸃ διαμεριζόμενοι δὲ τὰ ἱμάτια αὐτοῦ ἔβαλον ⸀κλήρους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/034.yaml
  text: But Jesus was saying[a], “Father, forgive them, for they do not know what they are doing.” And dividing his garments, they cast lots.
translation:
  language: te
  text: అయితే యేసు, “తండ్రీ, వారిని క్షమించు; వారు ఏమి చేస్తున్నారో వారికి తెలియదు” అని చెబుతూ ఉన్నాడు.[a] ఆయన వస్త్రాలను పంచుకుంటూ వారు చీట్లు వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో, “తండ్రీ, వారిని క్షమించు; వారు ఏమి చేస్తున్నారో వారికి తెలియదు” అనే మాటలు లేవు.
    reason: textual_variant
lexical_decisions:
- source_word: ἔλεγεν
  choice: చెబుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పునరావృతమైన మాటను సూచించగలదు; సాధారణ ‘అన్నాడు’ కంటే ఈ రూపం ఆ క్రియాంశాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: Πάτερ
  choice: తండ్రీ
  rationale: ఇది ప్రత్యక్ష సంబోధన; గ్రీకులో లేని ‘నా’ అనే స్వామ్యభావాన్ని చేర్చకుండా సహజమైన తెలుగు సంబోధనను ఉపయోగిస్తుంది.
- source_word: ἄφες
  choice: క్షమించు
  rationale: దేవునికి చేసే ప్రార్థనలో అపరాధుల విషయంగా ἀφίημι కి సహజమైన సందర్భోచిత అర్థం ‘క్షమించు’.
- source_word: αὐτοῖς
  choice: వీరిని
  rationale: తెలుగులో సమీప సందర్భంలోని వ్యక్తులను సహజంగా సూచిస్తుంది; వారు ఖచ్చితంగా ఎవరో వాక్యంలో లేనందున మరింత నిర్దిష్టతను చేర్చదు.
- source_word: οὐ γὰρ οἴδασιν τί ποιοῦσιν
  choice: తాము ఏమి చేస్తున్నారో వీరికి తెలియదు
  rationale: οἶδα యొక్క జ్ఞానార్థాన్ని నేరుగా తెలియజేస్తుంది; ‘అర్థం చేసుకోరు’ వంటి వ్యాఖ్యానాత్మక విస్తరణను నివారిస్తుంది.
- source_word: διαμεριζόμενοι
  choice: పంచుకొని
  rationale: యేసు వస్త్రాలను తమ మధ్య విభజించుకున్న చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἱμάτια
  choice: వస్త్రాలు
  rationale: దుస్తుల వస్తువులను సూచిస్తూ కథనానికి తగిన గౌరవప్రదమైన సాహిత్య స్థాయిని నిలుపుతుంది.
- source_word: ἔβαλον κλήρους
  choice: చీట్లు వేశారు
  rationale: వాటా నిర్ణయించడానికి చీట్లు వేసే ప్రాచీన ఆచారాన్ని తెలుగులో స్థిరమైన, అర్థమయ్యే నుడికారంతో వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: అయితే / తరువాత
  rationale: మొదటి δέ స్వల్ప వ్యత్యాసం లేదా కథన మలుపును సూచిస్తుంది; రెండవది కథన కొనసాగింపును సూచిస్తుంది. తెలుగు ప్రవాహానికి అనుగుణంగా సందర్భానుసారంగా వేర్వేరుగా అనువదించబడింది.
theological_decisions:
- issue: “తండ్రీ, వీరిని క్షమించు; తాము ఏమి చేస్తున్నారో వీరికి తెలియదు” అనే వాక్యపు పాఠ ప్రామాణికత
  choice: ప్రధాన పాఠంలో చేర్చడం
  alternative: కొన్ని ప్రతుల్లో ఈ మాట లేదు
  rationale: ఇచ్చిన SBLGNT పాఠం ఈ భాగాన్ని పాఠాంతర సూచనతో ప్రధాన పాఠంలో ముద్రిస్తుంది. అందువల్ల దానిని ప్రధాన అనువాదంలో ఉంచి, ముఖ్యమైన ప్రతుల భేదాన్ని పాదసూచికలో పారదర్శకంగా తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. ἔλεγεν యొక్క కొనసాగుతున్న క్రియాంశాన్ని ‘చెబుతూ ఉన్నాడు’తో నిలిపాం. పాఠాంతర సూచిక [a] సంబంధిత వాక్యం ముగిసిన వెంటనే ఉంచబడింది.
