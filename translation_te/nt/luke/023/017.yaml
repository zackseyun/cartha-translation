translation:
  language: te
  text: పండుగ సందర్భంగా ఒకరిని వారికి విడుదల చేయాల్సిన బాధ్యత అతనికి ఉండేది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనం మొత్తం అత్యంత ప్రాచీన గ్రీకు ప్రతులలో అనేక వాటిలో (క్రీ.శ. 3వ శతాబ్దానికి చెందిన పాపైరస్ 75, 4వ శతాబ్దానికి చెందిన వాటికానస్ సహా), అలాగే ప్రాచీన కాప్టిక్ అనువాదాలలో లేదు. అయితే 4వ శతాబ్దానికి చెందిన సీనైటికస్ వంటి ఇతర ముఖ్యమైన ప్రాచీన ప్రతుల్లో, లాటిన్ సంప్రదాయంలో, తరువాతి బైజాంటీన్ అధికసంఖ్యాక ప్రతుల్లో ఇది ఉంది. మత్తయి 27:15, మార్కు 15:6లో పేర్కొన్న ఖైదీని విడుదల చేసే ఆచారంతో లూకా వృత్తాంతాన్ని సమన్వయపరచడానికి నకలు రాసినవారు దీన్ని చేర్చి ఉండవచ్చు. కొన్ని ప్రతుల్లో ఈ వాక్యం 18వ వచనం తరువాత ఉంది.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνάγκην … εἶχεν
  choice: విడుదల చేయాల్సిన బాధ్యత అతనికి ఉండేది
  rationale: ἀνάγκην ἔχειν అనే ప్రయోగం ‘అవసరానికి లోబడి ఉండడం’ లేదా ‘బాధ్యత కలిగి ఉండడం’ అనే భావాన్ని ఇస్తుంది. ఇక్కడ పిలాతుపై ఉన్న ఆచారపరమైన నిర్బంధాన్ని సహజమైన ఆధునిక తెలుగులో ‘బాధ్యత’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀπολύειν
  choice: విడుదల చేయడం
  rationale: న్యాయపరమైన ఈ సందర్భంలో ఖైదీని నిర్బంధం నుంచి విడిచిపెట్టడాన్ని సూచిస్తుంది; ‘క్షమించడం’ అని అనువదిస్తే మూలంలో లేని భావం చేరవచ్చు.
- source_word: κατὰ ἑορτήν
  choice: పండుగ సందర్భంగా
  rationale: ἑορτή మతపరమైన బహిరంగ ఉత్సవాన్ని సూచిస్తుంది. κατὰ అనే సంబంధాన్ని తెలుగులో సహజంగా ‘సందర్భంగా’ అని వ్యక్తం చేశాం; సందర్భంలో ఇది పస్కా పండుగ.
- source_word: ἕνα
  choice: ఒకరిని
  rationale: గ్రీకు పుంలింగ ఏకవచనం సందర్భానుసారం విడుదల చేయాల్సిన ఒక ఖైదీని సూచిస్తుంది. ‘ఒక మనిషిని’ కంటే ‘ఒకరిని’ ఆధునిక తెలుగులో సహజంగా ఉంది.
