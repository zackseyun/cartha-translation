  register: సామాన్య పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగును, న్యాయపరమైన సందర్భానికి తగిన గంభీరతను ఉపయోగించాం. గ్రీకులోని δέకు విడిగా ‘అయితే’ చేర్చలేదు; ఈ చిన్న అనుసంధాన కణం ఇక్కడ సందర్భ ప్రవాహంలో సహజంగా అంతర్లీనమవుతుంది. కర్తను మూలంలాగే పేరుతో స్పష్టీకరించకుండా ‘అతనికి’ అని ఉంచాం.
