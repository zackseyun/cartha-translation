id: LUK.23.51
reference: Luke 23:51
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτος οὐκ ἦν συγκατατεθειμένος τῇ βουλῇ καὶ τῇ πράξει αὐτῶν— ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων, ὃς ⸀προσεδέχετο τὴν βασιλείαν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/051.yaml
  text: This man had not agreed with their plan and action—he was from Arimathea[a], a city of the Jews, and he was waiting for the kingdom of God.
translation:
  language: te
  text: ఈయన వారి తీర్మానానికీ చర్యకూ సమ్మతించలేదు[a]—యూదుల పట్టణమైన అరిమతయకు చెందినవాడు; దేవుని రాజ్యం కోసం ఎదురుచూస్తూ ఉండేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి నిర్ణయానికీ, వారు చేసిన పనికీ ఒప్పుకోలేదు.’
    reason: βουλή, πρᾶξις, συγκατατίθημι పదాలకు సాధ్యమైన మరింత వివరణాత్మక పదప్రయోగం.
lexical_decisions:
- source_word: συγκατατεθειμένος
  choice: సమ్మతించలేదు
  rationale: ἦν‌తో కూడిన పరిపూర్ణ కృదంతం, ముందే ఏర్పడిన అసమ్మతి వైఖరిని సూచిస్తుంది. ‘సమ్మతించలేదు’ ఆధునిక తెలుగులో సహజంగా ఉండి, వారి నిర్ణయంలో పాలుపంచుకోలేదనే భావాన్ని తెలియజేస్తుంది.
- source_word: βουλῇ
  choice: తీర్మానానికి
  rationale: ఇక్కడ పదం పరిపాలక సభను కాక, వారు ఆలోచించి చేసిన నిర్ణయాన్ని సూచిస్తుంది. ‘తీర్మానం’ ఆ నిర్ణయాత్మక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: πράξει
  choice: చర్యకు
  rationale: βουλήతో జతగా వచ్చిన ఈ పదం, వారి తీర్మానాన్ని అమలు చేసిన కార్యాన్ని సూచిస్తుంది. ‘చర్య’ తీర్మానానికీ దాని అమలుకూ మధ్య తేడాను నిలుపుతుంది.
- source_word: ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων
  choice: యూదుల పట్టణమైన అరిమతయకు చెందిన
  rationale: గ్రీకు వాక్యంలోని వివరణాత్మక నిర్మాణాన్ని సహజమైన తెలుగులో అందిస్తూ, అరిమతయను ‘యూదుల పట్టణం’గా పేర్కొన్న మూలపాఠ భావాన్ని కాపాడుతుంది.
- source_word: προσεδέχετο
  choice: ఎదురుచూస్తున్నవాడు
  rationale: అసంపూర్ణ భూతకాల రూపం నిరంతరమైన, ఆశతో కూడిన ఎదురుచూపును సూచిస్తుంది. ఈ రూపం ఆ కొనసాగుతున్న వైఖరిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: లూకా రచనలోని ప్రామాణిక ధార్మిక పదబంధాన్ని స్పష్టంగా, స్థిరంగా నిలుపుతుంది; ‘పాలన’ అని వివరణాత్మకంగా మార్చి భావాన్ని పరిమితం చేయదు.
- source_word: οὗτος
  choice: ఈయన
  rationale: మునుపటి వచనంలో పేర్కొన్న యోసేపును నొక్కిచెప్పి తిరిగి సూచించే సర్వనామ భావాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: యేసు మరణానికి దారితీసిన నాయకుల చర్యల నుండి యోసేపు వేరుగా నిలిచిన స్వభావం
  choice: వారి తీర్మానానికీ, చర్యకూ అతడు సమ్మతించలేదని మాత్రమే పేర్కొనడం
  alternative: అతడు వారి తీర్మానానికి అనుకూలంగా ఓటు వేయలేదని లేదా వారి సభ నిర్ణయాన్ని ఆమోదించలేదని ప్రత్యేకంగా చెప్పడం
  rationale: గ్రీకు పాఠం వారి βουλή మరియు πρᾶξις విషయంలో అతని అసమ్మతిని స్పష్టంగా చెబుతుంది; అయితే నిర్దిష్టమైన ఓటింగ్ విధానాన్ని చెప్పదు. అందువల్ల చారిత్రక ప్రక్రియను ఊహించి చేర్చకుండా అతని అసమ్మతిని మాత్రమే అనువాదం తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వచనానికి తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. మూలంలోని దీర్ఘ వాక్య ప్రవాహాన్ని డాష్‌తో నిలుపుతూ, అసమ్మతి మరియు నిరీక్షణ భావాలను స్పష్టంగా ఉంచింది.
