  to: ఈయన వారి తీర్మానానికీ చర్యకూ సమ్మతించలేదు[a]—యూదుల పట్టణమైన అరిమతయకు చెందినవాడు; దేవుని రాజ్యం కోసం ఎదురుచూస్తూ ఉండేవాడు.
