source:
  edition: SBLGNT
  text: ἐγένοντο δὲ φίλοι ὅ τε ⸂Ἡρῴδης καὶ ὁ Πιλᾶτος⸃ ἐν αὐτῇ τῇ ἡμέρᾳ μετ’ ἀλλήλων· προϋπῆρχον γὰρ ἐν ἔχθρᾳ ὄντες πρὸς ⸀αὑτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/012.yaml
  text: And Herod and Pilate became friends with each other on that very day[b][a], for previously they had been in hostility toward one another.
translation:
  language: te
  text: హేరోదు మరియు పిలాతు ఆ రోజునే ఒకరికొకరు స్నేహితులయ్యారు[a]; ఎందుకంటే అంతకుముందు వారు ఒకరిపట్ల ఒకరు శత్రుత్వంలో ఉండేవారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒకరితో ఒకరు స్నేహంగా మారారు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అంతకుముందు వారు ఒకరికొకరు శత్రువులుగా ఉండేవారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένοντο
  choice: అయ్యారు
  rationale: γίνομαι యొక్క భూతకాల రూపం సంబంధంలో వచ్చిన మార్పును సూచిస్తుంది; తెలుగులో ‘అయ్యారు’ సహజంగా ఆ మార్పును తెలియజేస్తుంది.
- source_word: φίλοι
  choice: స్నేహితులు
  rationale: ఇది బహువచన విధేయ నామవాచకం; ‘స్నేహితులు’ అనే అనువాదం స్నేహాన్ని లేదా మైత్రి సంబంధాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ὅ τε Ἡρῴδης καὶ ὁ Πιλᾶτος
  choice: హేరోదు, పిలాతు
  rationale: గ్రీకు సహసంబంధ నిర్మాణం ఇద్దరినీ కలిపి చూపుతుంది; తెలుగులో పేర్లను ‘మరియు’ లేకుండా జతగా ఉంచడం సహజంగా ఉంటుంది.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: ఆ రోజునే
  rationale: αὐτῇ ఇచ్చే ఉద్ఘాటనను ‘-నే’ నిలుపుతుంది; ఇది ‘సరిగ్గా ఆ రోజున’ అనే భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: μετ’ ἀλλήλων
  choice: ఒకరికొకరు
  rationale: పరస్పర సంబంధాన్ని స్పష్టంగా, ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: προϋπῆρχον
  choice: అంతకుముందు ... ఉండేవారు
  rationale: ముందుగా కొనసాగుతూ ఉన్న స్థితిని గ్రీకు అసంపూర్ణ భూతకాలం సూచిస్తుంది; ‘అంతకుముందు ... ఉండేవారు’ దానిని నిలుపుతుంది.
- source_word: ἐν ἔχθρᾳ
  choice: శత్రుత్వంలో
  rationale: ἔχθρα అనే నామవాచకంలోని విరోధం లేదా వైరం భావాన్ని నామరూపంలోనే నిలుపుతుంది.
- source_word: ὄντες
  choice: ఉండేవారు
  rationale: ముందుగా కొనసాగిన స్థితిని తెలుగులో సహజమైన క్రియారూపంగా వ్యక్తం చేస్తుంది.
- source_word: πρὸς αὑτούς
  choice: ఒకరిపట్ల ఒకరు
  rationale: పరస్పర శత్రుత్వంతో పాటు πρός లోని దిశాత్మక భావాన్ని కూడా నిలుపుతుంది.
theological_decisions:
- issue: హేరోదు, పిలాతు మధ్య సంబంధంలో వచ్చిన మార్పు స్వభావం
  choice: వారు ఆ రోజున స్నేహితులయ్యారని చెప్పడం
  alternative: వారు ఒకరితో ఒకరు స్నేహంగా మారారని చెప్పడం
  rationale: φίλοι స్నేహితులను లేదా మైత్రి కలిగిన వారిని సూచించగలదు. ఈ సందర్భంలో అది వ్యక్తిగత సాన్నిహిత్యమా, రాజకీయ మైత్రియా అని వాక్యం స్పష్టంచేయదు; కాబట్టి అనువాదం అదనపు ఉద్దేశాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘ఆ రోజునే’ మూలంలోని కాల ఉద్ఘాటనను నిలుపుతుంది; ‘శత్రుత్వంలో’ మూలంలోని నామవాచక నిర్మాణాన్ని కాపాడుతుంది.
