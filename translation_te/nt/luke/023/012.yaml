  naturalness: The Telugu is clear and modern. The revised single sentence with a semicolon and 'ఎందుకంటే' more naturally displays the stated causal relationship while retaining the formal biblical register.
  terminology: ‘స్నేహితులయ్యారు’ appropriately renders φίλοι without adding a political or moral interpretation. ‘శత్రుత్వంలో ఉండేవారు’ preserves the nominal sense of ἐν ἔχθρᾳ, and ‘ఒకరిపట్ల ఒకరు’ suitably expresses the reciprocal/directional sense of πρὸς ἑαυτούς.
