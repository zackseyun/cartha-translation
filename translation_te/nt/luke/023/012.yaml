- from: ఆ రోజునే హేరోదు, పిలాతు ఒకరికొకరు స్నేహితులయ్యారు[a]. అంతకుముందు వారు ఒకరిపట్ల ఒకరు శత్రుత్వంలో ఉండేవారు[b].
  to: హేరోదు మరియు పిలాతు ఆ రోజునే ఒకరికొకరు స్నేహితులయ్యారు[a]; ఎందుకంటే అంతకుముందు వారు ఒకరిపట్ల ఒకరు శత్రుత్వంలో ఉండేవారు[b].
  rationale: The revision explicitly renders γάρ as ‘ఎందుకంటే’ and uses ‘మరియు’ to make the coordinated subject clear. It retains the draft’s faithful renderings of friendship, emphatic timing, and prior reciprocal hostility, without specifying whether the friendship was personal or political.
