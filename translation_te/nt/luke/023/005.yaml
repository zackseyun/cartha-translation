id: LUK.23.5
reference: Luke 23:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ ἐπίσχυον λέγοντες ὅτι Ἀνασείει τὸν λαὸν διδάσκων καθ’ ὅλης τῆς Ἰουδαίας, ⸀καὶ ἀρξάμενος ἀπὸ τῆς Γαλιλαίας ἕως ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/005.yaml
  text: But they kept insisting[a], saying, “He stirs up the people, teaching throughout all Judea[c][b], beginning from Galilee even to here.”
translation:
  language: te
  text: కాని వారు మరింత గట్టిగా నొక్కిచెప్పుతూ, “ఇతడు యూదయ అంతటా[b], గలిలయ నుండి మొదలుకొని ఇక్కడివరకు[c], బోధిస్తూ ప్రజలను రెచ్చగొడుతున్నాడు[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజలను ఉద్రేకపరుస్తున్నాడు.” గ్రీకు క్రియకు కల్లోలకరమైన రీతిలో ప్రజలను లేపడం లేదా రెచ్చగొట్టడం అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “యూదయ” అనేది ప్రత్యేకంగా యూదయ ప్రాంతాన్ని సూచించవచ్చు; కొన్ని సందర్భాల్లో యూదుల భూభాగాన్ని మరింత విస్తృతంగా కూడా సూచించవచ్చు. ఇక్కడ అతని కార్యాచరణ విస్తృతిని ఆరోపణ నొక్కిచెబుతోంది.
    reason: cultural_note
  - marker: c
    text: లేదా, “ఈ స్థలంవరకు.” ఈ మాట గలిలయ నుండి పిలాతు ఎదుట ఉన్న ప్రస్తుత స్థలంవరకు సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίσχυον
  choice: ఇంకా గట్టిగా పట్టుబట్టి
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న, బలమైన పట్టుదలను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: λέγοντες
  choice: అని అన్నారు
  rationale: వారి పట్టుదలలో భాగంగా పలికిన ఆరోపణను నేరుగా పరిచయం చేస్తుంది.
- source_word: Ἀνασείει
  choice: రెచ్చగొడుతున్నాడు
  rationale: ప్రజలను కల్లోలకరమైన రీతిలో ఉద్రేకపరుస్తున్నాడనే ఆరోపణను తెలియజేస్తుంది; అయితే నిర్దిష్టమైన తిరుగుబాటు నేరాన్ని అనవసరంగా చేర్చదు.
- source_word: τὸν λαὸν
  choice: ప్రజలను
  rationale: ఒకచోట కూడిన గుంపును మాత్రమే కాక విస్తృత ప్రజానీకాన్ని సూచిస్తుంది.
- source_word: διδάσκων
  choice: బోధిస్తూ
  rationale: ప్రస్తుతకాల కృదంతంలోని కొనసాగుతున్న చర్యను, ఆరోపణతో దాని సంబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: యూదయ అంతటా
  rationale: ప్రాంతమంతటా విస్తరించిన కార్యాచరణ అనే పంపిణీ/స్థలార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: గలిలయ నుండి మొదలుపెట్టి
  rationale: ἀπό సూచించే ఆరంభ స్థలాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἕως ὧδε
  choice: ఇక్కడివరకు
  rationale: గలిలయ నుండి పిలాతు ఎదుటి ప్రస్తుత స్థలంవరకు వచ్చిన విస్తృతిని, ὧδε లోని స్థలసూచనను నిలుపుతుంది.
theological_decisions:
- issue: యేసుపై చేసిన ఆరోపణ స్వభావం
  choice: ప్రజలను రెచ్చగొడుతున్నాడనే సామాజిక కల్లోల ఆరోపణగా అనువదించడం
  alternative: ప్రజలను తిరుగుబాటుకు ప్రేరేపిస్తున్నాడు
  rationale: ἀνασείει బలమైన, కల్లోలకరమైన ప్రేరేపణను సూచించగలదు; కానీ అది స్వతహాగా నిర్దిష్ట రాజకీయ తిరుగుబాటు నేరాన్ని తప్పనిసరిగా సూచించదు. అందువల్ల ఆరోపణ తీవ్రతను ఉంచుతూ దానిని అతిగా నిర్దిష్టం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయస్థాన ఆరోపణ శైలిని ఉపయోగించాం. మూలంలోని కొనసాగుతున్న పట్టుదల, భౌగోళిక విస్తృతి, ఆరోపణాత్మక తీవ్రతను నిలిపి, నిర్దిష్ట రాజకీయ నేరాన్ని అదనంగా చేర్చలేదు.
