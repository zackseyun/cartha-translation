id: LUK.23.44
reference: Luke 23:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂Καὶ ἦν⸃ ⸀ἤδη ὡσεὶ ὥρα ἕκτη καὶ σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/044.yaml
  text: And it was already about the sixth hour[b][a], and darkness came over the whole land until the ninth hour.
translation:
  language: te
  text: అప్పటికే దాదాపు ఆరవ గంట[a] అయింది; తొమ్మిదవ గంట వరకు దేశమంతటా[b] చీకటి కమ్ముకుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, దాదాపు మధ్యాహ్నం పన్నెండు గంటల నుంచి మధ్యాహ్నం మూడు గంటల వరకు.
    reason: cultural_note
  - marker: b
    text: లేదా, “భూమి అంతటా.” గ్రీకు పదం γῆకు “దేశం” లేదా “భూమి” అనే రెండు అర్థాలు ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤδη
  choice: అప్పటికే
  rationale: కథనంలో ఈ సమయం అప్పటికే వచ్చిందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὡσεὶ
  choice: దాదాపు
  rationale: సమయం కచ్చితమైనది కాక సుమారైనదని సూచిస్తుంది.
- source_word: ὥρα ἕκτη
  choice: ఆరవ గంట
  rationale: మూలంలోని ప్రాచీన కాలగణన వ్యక్తీకరణను ప్రధాన పాఠ్యంలో నిలుపుతుంది; ఆధునిక సమయ వివరణను పాదటిప్పణిలో ఇస్తుంది.
- source_word: σκότος
  choice: చీకటి
  rationale: ఈ సందర్భంలో నామవాచకానికి సాధారణమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: ἐγένετο
  choice: కమ్ముకుంది
  rationale: చీకటి వ్యాపించి ఆ ప్రాంతాన్ని ఆవరించిందనే సంఘటనాత్మక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: దేశమంతటా
  rationale: γῆ అనే పదానికి ‘దేశం/ప్రాంతం’ లేదా ‘భూమి’ అనే అర్థాలు ఉండగలవు. ప్రధాన పాఠ్యంలో పరిధిని అనవసరంగా విశ్వవ్యాప్తమని నిర్ణయించకుండా సందర్భోచితమైన పరిమిత అర్థాన్ని ఉంచుతుంది.
- source_word: ἕως ὥρας ἐνάτης
  choice: తొమ్మిదవ గంట వరకు
  rationale: ‘ఆరవ గంట’తో అనుసరణను కాపాడుతూ మూలంలోని కాలవ్యక్తీకరణను నిలుపుతుంది; ఆధునిక సమయ సమానార్థం పాదటిప్పణిలో ఉంటుంది.
theological_decisions:
- issue: చీకటి వ్యాపించిన పరిధిని సూచించే γῆ పదం
  choice: దేశం
  alternative: భూమి అంతా
  rationale: గ్రీకు పదం ప్రాంతీయ లేదా విశ్వవ్యాప్త పరిధిని సూచించగలదు. చారిత్రక/విశ్వవ్యాప్త పరిధిని అనువాదంలోనే ఖరారు చేయకుండా, ప్రధాన పాఠ్యంలో ‘దేశం’ అని ఇచ్చి, విస్తృతమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ప్రాచీన గంటల లెక్కను ప్రధాన పాఠ్యంలో నిలిపి, దాని ఆధునిక సమయ వివరణను పాదటిప్పణిలో ఇచ్చాం. ‘దేశమంతటా’ అనే రూపం సహజ తెలుగు ప్రవాహాన్ని ఇస్తూ γῆలోని అర్థసందిగ్ధతను పాదటిప్పణి ద్వారా కాపాడుతుంది.
