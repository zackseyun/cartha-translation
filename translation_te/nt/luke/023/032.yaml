  text: And two others[a], who were criminals[b], were being led with him to be put to death.
translation:
  language: te
  text: ఆయనతోపాటు మరో ఇద్దరు నేరస్థులను కూడా మరణానికి గురిచేయడానికి తీసుకువెళ్తూ ఉన్నారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చెడుకార్యాలు చేసినవారు.” గ్రీకు పదం నేరాలకు పాల్పడి శిక్షకు గురైనవారిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మరణశిక్షను అమలు చేయడానికి.” గ్రీకు పదం ఇక్కడ మరణపద్ధతిని ప్రత్యేకంగా చెప్పదు; అయితే సందర్భం సిలువవేయడాన్ని చూపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤγοντο
  choice: తీసుకువెళ్తున్నారు
  rationale: అసంపూర్ణ భూతకాల కర్మణి రూపం గతంలో కొనసాగుతున్న చర్యను సూచిస్తుంది. తెలుగులో సహజమైన అనిర్దిష్ట కర్త నిర్మాణం ద్వారా ఆ కొనసాగుతున్న చర్యను వ్యక్తం చేశాం.
- source_word: δὲ
  choice: వాక్యప్రవాహంలో ప్రత్యేక పదం లేకుండా
  rationale: ఇక్కడ δέ స్వల్ప కథన అనుసంధానకం. తెలుగులో వాక్యక్రమమే కథను సహజంగా ముందుకు నడిపిస్తుంది; ‘అయితే’ అనడం లేని వ్యతిరేక భావాన్ని కలిగించవచ్చు.
- source_word: καὶ
  choice: కూడా
  rationale: యేసుతోపాటు ఇతరులను కూడా తీసుకువెళ్లారనే చేర్పు భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἕτεροι
  choice: మరో ఇద్దరిని
  rationale: యేసుకు భిన్నంగా, ఆయనతోపాటు తీసుకువెళ్తున్న ఇతర ఇద్దరిని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: κακοῦργοι
  choice: నేరస్థులైన
  rationale: తీవ్రమైన దుష్కార్యాలకు పాల్పడి శిక్షకు గురైనవారనే సందర్భార్థాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: δύο
  choice: ఇద్దరిని
  rationale: వ్యక్తులను సూచించే సంఖ్యకు సహజమైన తెలుగు రూపం.
- source_word: σὺν αὐτῷ
  choice: ఆయనతోపాటు
  rationale: సహగమనాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀναιρεθῆναι
  choice: చంపడానికి
  rationale: మరణానికి గురిచేయడం అనే గ్రీకు పదపు విస్తృత అర్థాన్ని నిలుపుతుంది; ఈ వచనంలోని క్రియ స్వయంగా సిలువవేయడాన్ని నిర్దిష్టంగా చెప్పదు.
theological_decisions:
- issue: ἀναιρεθῆναι అనువాదంలో సిలువవేయడాన్ని స్పష్టంగా పేర్కొనాలా
  choice: చంపడానికి
  alternative: సిలువవేయడానికి; మరణశిక్షను అమలు చేయడానికి
  rationale: సందర్భం సిలువ మరణాన్ని స్పష్టం చేసినా, ఈ గ్రీకు క్రియ చంపే పద్ధతిని పేర్కొనదు. అందువల్ల మూలపదపు విస్తృత పరిధిని ప్రధాన పాఠ్యంలో నిలిపి, న్యాయపరమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ‘ఆయన’ రూపాన్ని వాడాం. కర్మణి క్రియను యాంత్రికంగా ‘తీసుకువెళ్లబడుతున్నారు’ అని కాకుండా, కర్తను పేర్కొనని సహజ తెలుగు నిర్మాణమైన ‘తీసుకువెళ్తున్నారు’గా ఇచ్చాం. వాక్యం సాధారణ పాఠకులకు సులభంగా ఉండేలా ఉంచుతూ మూలంలోని భావపరిధిని కాపాడాం.
