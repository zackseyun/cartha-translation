  text: κατακολουθήσασαι δὲ ⸀αἱ γυναῖκες, αἵτινες ἦσαν συνεληλυθυῖαι ⸂ἐκ τῆς Γαλιλαίας αὐτῷ⸃, ἐθεάσαντο τὸ μνημεῖον καὶ ὡς ἐτέθη τὸ σῶμα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/055.yaml
  text: The women who had come with him from Galilee followed and saw the tomb and how his body was laid[a].
translation:
  language: te
  text: గలిలయ నుండి ఆయనతో కలిసి వచ్చిన స్త్రీలు వెంబడి వెళ్లి సమాధినీ, ఆయన దేహాన్ని ఎలా ఉంచారో చూశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గలిలయ నుండి ఆయన వెంట వచ్చిన స్త్రీలు.’
    reason: సυνεληλυθυῖαι ... αὐτῷ అనే పదబంధంలోని సహప్రయాణ భావానికి సహజమైన మరో తెలుగు వ్యక్తీకరణను చూపిస్తుంది.
lexical_decisions:
- source_word: κατακολουθήσασαι
  choice: వెంబడించి వెళ్లి
  rationale: భూతకాల అసమాపక క్రియ ప్రధాన క్రియకు ముందు జరిగిన అనుసరణను సూచిస్తుంది. తెలుగులో ‘వెంబడించి వెళ్లి ... చూశారు’ అనేది సంఘటనల క్రమాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది స్వల్ప కథన మార్పును సూచిస్తుంది; ఈ వాక్యంలో తెలుగు వాక్యప్రవాహమే ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది. ‘ఇప్పుడు’ అని చేర్చితే మూలంలో లేని కాలార్థం వినిపించవచ్చు.
- source_word: αἱ γυναῖκες
  choice: స్త్రీలు
  rationale: నిర్దిష్ట సమూహాన్ని సందర్భం స్పష్టం చేస్తుంది; తెలుగులో ప్రత్యేక నిర్దేశక పదం అవసరం లేదు.
- source_word: αἵτινες ἦσαν συνεληλυθυῖαι ἐκ τῆς Γαλιλαίας αὐτῷ
  choice: గలిలయ నుండి ఆయనతో కలిసి వచ్చిన
  rationale: ముందుగా ఆయనతో కలిసి వచ్చిన చర్యను, ప్రయాణ ప్రారంభస్థలమైన గలిలయను రెండింటినీ నిలుపుతుంది. ‘వెంట వచ్చిన’ కూడా సాధ్యమే కానీ ‘కలిసి వచ్చిన’ అనేది συνέρχομαι భావానికి దగ్గరగా ఉంది.
- source_word: ἐθεάσαντο
  choice: చూశారు
  rationale: సందర్భంలో సమాధినీ దేహాన్ని ఉంచిన విధానాన్నీ గమనించిన భావం కర్మల ద్వారా స్పష్టమవుతుంది; ‘చూశారు’ సహజమైన ఆధునిక తెలుగు.
- source_word: τὸ μνημεῖον
  choice: సమాధిని
  rationale: యేసు దేహాన్ని ఉంచిన రాతి సమాధి స్థలాన్ని సూచించే ప్రామాణిక, సందర్భోచిత పదం.
- source_word: ὡς ἐτέθη
  choice: ఎలా ఉంచారో
  rationale: ὡς విధానాన్ని తెలియజేస్తుంది. గ్రీకులోని కర్మణి రూపాన్ని తెలుగులో సహజమైన అనిర్దిష్ట కర్త నిర్మాణంతో అందించింది; దేహాన్ని సమాధిలో ఉంచిన విధానమే ప్రధానాంశం.
- source_word: τὸ σῶμα αὐτοῦ
  choice: ఆయన దేహాన్ని
  rationale: గౌరవప్రదమైన సర్వనామంతో స్వామ్య సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: κατακολουθήσασαι అనే అసమాపక క్రియకు ἐθεάσαντο అనే ప్రధాన క్రియతో ఉన్న కథన సంబంధం
  choice: ‘వెంబడించి వెళ్లి ... చూశారు’ అనే వరుస చర్యలుగా అనువదించడం
  alternative: ‘వెంబడించిన తరువాత ... చూశారు’ లేదా మరింత రూపనిష్ఠంగా ‘వెంబడిస్తూ ... చూశారు’
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కాదు. అఒరిస్ట్ అసమాపక క్రియ సూచించే ముందరి చర్యను తెలుగులో సహజంగా ఉంచుతూ, స్త్రీలు వెంబడించి వెళ్లి ఆపై సమాధిని గమనించిన కథన క్రమాన్ని కాపాడుతుంది.
- issue: συνεληλυθυῖαι ... αὐτῷ లో సహప్రయాణ భావం
  choice: ‘ఆయనతో కలిసి వచ్చిన’
  alternative: ‘ఆయన వెంట వచ్చిన’
  rationale: రెండు అనువాదాలూ సాధ్యమే. ఎంచుకున్న రూపం మూలంలోని ‘కలిసి/తో వచ్చుట’ భావాన్ని ప్రత్యక్షంగా నిలుపుతుంది; ప్రత్యామ్నాయం సహచర్యాన్ని మరింత సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని స్వల్ప δέ అనుసంధానానికి ‘ఇప్పుడు’ వంటి స్పష్టమైన కాలసూచక పదాన్ని చేర్చలేదు. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో [a]గా ఉంచబడింది.
