revisions:
- from: అతడు హేరోదు అధికార పరిధిలోని వాడని తెలుసుకున్న పిలాతు, ఆ రోజుల్లో యెరూషలేములోనే ఉన్న హేరోదు దగ్గరికి అతణ్ణి పంపించాడు.[a]
  to: యేసు హేరోదు అధికార పరిధికి చెందినవాడని[a] తెలుసుకున్న పిలాతు, హేరోదు కూడా ఆ రోజుల్లో యెరూషలేములో ఉండగా, ఆయనను హేరోదు దగ్గరికి పంపించాడు.
  rationale: The revision retains the draft’s accurate legal-administrative rendering of ἐξουσία, moves the footnote anchor to the phrase it explains, and replaces the location-focused ‘-లోనే’ construction with ‘హేరోదు కూడా’ to represent the emphasis of καὶ αὐτόν. The temporal participial relation is naturally rendered by ‘ఉండగా’ without adding a causal claim.
