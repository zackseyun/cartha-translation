id: LUK.23.7
reference: Luke 23:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐπιγνοὺς ὅτι ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν ἀνέπεμψεν αὐτὸν πρὸς Ἡρῴδην, ὄντα καὶ αὐτὸν ἐν Ἱεροσολύμοις ἐν ταύταις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/007.yaml
  text: And when he learned that he was under Herod’s jurisdiction[a], he sent him to Herod, who himself was also in Jerusalem in those days.
translation:
  language: te
  text: యేసు హేరోదు అధికార పరిధికి చెందినవాడని[a] తెలుసుకున్న పిలాతు, హేరోదు కూడా ఆ రోజుల్లో యెరూషలేములో ఉండగా, ఆయనను హేరోదు దగ్గరికి పంపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హేరోదు అధికారానికి లోబడినవాడని.” గ్రీకు పదబంధం హేరోదు పరిపాలనా పరిధిని లేదా న్యాయాధికారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: తెలుసుకున్న
  rationale: ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచించే భూతకాల కృదంత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν
  choice: హేరోదు అధికార పరిధిలోని వాడని
  rationale: ἐξουσία ఇక్కడ నైరూప్యమైన శక్తిని కాక, పరిపాలనా లేదా న్యాయాధికార పరిధిని సూచిస్తుంది. ఈ ప్రయోగం ఆ భావాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: ἀνέπεμψεν αὐτὸν
  choice: అతణ్ణి పంపించాడు
  rationale: న్యాయసంబంధ సందర్భంలో కేసును మరో అధికారికి పంపించే ఛాయ ఉన్నప్పటికీ, 'పంపించాడు' మూలక్రియను స్పష్టంగా, సహజంగా అందిస్తుంది; అధికార పరిధి అనే ముందరి పదబంధం న్యాయపరమైన సందర్భాన్ని తెలియజేస్తుంది.
- source_word: πρὸς Ἡρῴδην
  choice: హేరోదు దగ్గరికి
  rationale: ఒక వ్యక్తి వద్దకు పంపడాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὄντα καὶ αὐτὸν
  choice: యెరూషలేములోనే ఉన్న హేరోదు
  rationale: καὶ αὐτόν లోని 'హేరోదు కూడా అక్కడే ఉన్నాడు' అనే ఉద్ఘాటనను '-లోనే' ద్వారా సహజంగా నిలుపుతుంది.
- source_word: ἐν Ἱεροσολύμοις
  choice: యెరూషలేములో
  rationale: స్థలనామానికి ప్రామాణిక తెలుగు రూపం.
- source_word: ἐν ταύταις ταῖς ἡμέραις
  choice: ఆ రోజుల్లో
  rationale: అక్షరార్థంగా 'ఈ రోజుల్లో' అయినా, గతకాల కథన దృష్టిలో 'ఆ రోజుల్లో' సహజమైన తెలుగు కాలసూచన.
theological_decisions:
- issue: హేరోదుకు సంబంధించిన ἐξουσία యొక్క రాజకీయ-న్యాయపరమైన భావం
  choice: అధికార పరిధి
  alternative: అధికారం; పరిపాలనా ప్రాంతం
  rationale: సందర్భం యేసు ఏ పాలకుని న్యాయపరమైన లేదా పరిపాలనా అధికారానికి లోబడతాడనే విషయానికి సంబంధించినది. 'అధికార పరిధి' రాజకీయ-న్యాయ భావాన్ని నిలుపుతూ, ఇక్కడ ἐξουσίαకు అనవసరమైన ధార్మిక అర్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. 'అధికార పరిధి' అనే సాధారణ న్యాయ-పరిపాలనా ప్రయోగంతో మూలంలోని భావాన్ని స్పష్టంగా ఉంచాం. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
