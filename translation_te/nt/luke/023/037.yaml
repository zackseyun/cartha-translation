  text: καὶ λέγοντες· Εἰ σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων, σῶσον σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/037.yaml
  text: and saying[a], “If you are the King of the Jews, save yourself.”
translation:
  language: te
  text: 'ఇలా అన్నారు: “నువ్వు యూదుల రాజువైతే[a], నిన్ను నువ్వే రక్షించుకో.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదయవాసుల రాజువైతే.” గ్రీకు పదం Ἰουδαίων సందర్భాన్ని బట్టి “యూదులు” లేదా “యూదయవాసులు” అని అర్థమివ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγοντες
  choice: ఇలా అన్నారు
  rationale: ముందటి వచనంలోని బహువచన కర్త చేసిన చర్యను కొనసాగించే గ్రీకు సంయోజక-కృదంత నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు కథన వాక్యంగా అందిస్తుంది. అపహాస్య భావాన్ని క్రియలో అదనంగా చేర్చకుండా సందర్భానికే వదిలివేస్తుంది.
- source_word: Εἰ σὺ εἶ
  choice: నువ్వు … అయితే
  rationale: సవాలు చేసే షరతును సహజంగా తెలియజేస్తుంది; వారు ఆ వాదనను అంగీకరించినట్లు సూచించదు. ఏకవచన సంబోధనను ‘నువ్వు’ స్పష్టంగా ఉంచుతుంది.
- source_word: ὁ βασιλεὺς
  choice: రాజు
  rationale: నిర్దిష్టమైన రాజబిరుదును తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; ‘యూదుల రాజు’ అనే మొత్తం పదబంధంలో నిర్దిష్టత స్పష్టమవుతుంది.
- source_word: τῶν Ἰουδαίων
  choice: యూదుల
  rationale: శ్రమానుభవ కథనంలో ఆరోపణగా, అపహాస్యంగా ఉపయోగించిన స్థిరమైన రాజకీయ-మెస్సీయ బిరుదుకు సందర్భోచితమైన సాధారణ తెలుగు రూపం. ప్రాంతీయ అర్థమైన ‘యూదయవాసుల’ను పాదసూచికలో నిలుపుతుంది.
- source_word: σῶσον σεαυτόν
  choice: నిన్ను నువ్వే రక్షించుకో
  rationale: ఆజ్ఞార్థక క్రియను, ఆత్మవాచక కర్మను సహజంగా అందిస్తూ, σεαυτόνలోని స్వీయ సూచనకు తగిన ఉద్ఘాటనను కాపాడుతుంది.
theological_decisions:
- issue: βασιλεὺς τῶν Ἰουδαίων అనే అపహాస్య రాజబిరుదు అనువాదం
  choice: యూదుల రాజు
  alternative: యూదయవాసుల రాజు
  rationale: సిలువ కథనంలో ఇది యేసుపై మోపిన రాజకీయ ఆరోపణతోనూ ఆయన రాజత్వంలోని వ్యంగ్య ఉద్రిక్తతతోనూ ముడిపడిన బిరుదు. ‘యూదుల రాజు’ సాధారణ పాఠకులకు సహజంగా, సందర్భానికి తగినట్లుగా ఉంటుంది; Ἰουδαίωνకు సాధ్యమైన ప్రాంతీయ భావాన్ని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. సైనికుల అపహాస్యం సందర్భం ద్వారా స్పష్టమయ్యేలా ఉంచి, λέγοντεςలో లేని ‘ఎగతాళి చేస్తూ’ వంటి వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు. పాదసూచిక గుర్తు ప్రత్యామ్నాయార్థం వర్తించే ‘యూదుల’ రాజబిరుదు దగ్గర ఉంచబడింది.
