  source_fidelity: The Telugu accurately conveys the participial continuation ('and saying') in idiomatic narrative form, the taunting conditional ('If you are'), the royal title, and the imperative-reflexive command ('save yourself'). It does not import mockery into λέγοντες beyond what the context supplies.
  naturalness: The wording is clear and natural in modern standard Telugu. “ఇలా అన్నారు” is a suitable finite-clause rendering of the Greek participial construction in a standalone verse, and “నిన్ను నువ్వే రక్షించుకో” naturally expresses the reflexive object with appropriate emphasis.
  terminology: “యూదుల రాజు” is the established, contextually appropriate Telugu rendering of the charged title. The footnote responsibly preserves the viable geographical/ethnic alternative “యూదయవాసుల,” without forcing that sense into the main text. “రక్షించుకో” suitably renders σῶσον in this direct challenge.
