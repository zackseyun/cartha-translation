id: LUK.23.56
reference: Luke 23:56
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑποστρέψασαι δὲ ἡτοίμασαν ἀρώματα καὶ μύρα. Καὶ τὸ μὲν σάββατον ἡσύχασαν κατὰ τὴν ἐντολήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/056.yaml
  text: Then after returning[a], they prepared spices and ointments. And on the Sabbath they rested according to the commandment[b],
translation:
  language: te
  text: అప్పుడు వారు తిరిగి వచ్చాక[a], సుగంధ ద్రవ్యాలను, పరిమళ తైలాలను[b] సిద్ధం చేశారు. సబ్బాతు దినాన వారు ఆజ్ఞ ప్రకారం విశ్రమించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తిరిగి వచ్చి.” గ్రీకు కృదంతం ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “పరిమళ తైలాలు” అనే మాటను “సుగంధ నూనెలు” లేదా “సువాసన లేపనాలు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: తిరిగి వచ్చాక
  rationale: స్త్రీలను సూచించే భూతకాల కృదంతం ప్రధాన క్రియకు ముందే జరిగిన చర్యను తెలియజేస్తుంది; తెలుగులో ‘తిరిగి వచ్చాక’ ఆ క్రమాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ కథన పురోగతిని సూచించే స్వల్ప అనుసంధాన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἡτοίμασαν
  choice: సిద్ధం చేశారు
  rationale: ἑτοιμάζω అనే క్రియకు సందర్భోచితమైన, సాధారణ ఆధునిక తెలుగు ప్రయోగం.
- source_word: ἀρώματα
  choice: సుగంధ ద్రవ్యాలు
  rationale: సమాధి సందర్భంలో మృతదేహానికి ఉపయోగించే సువాసనగల పదార్థాలను సూచిస్తుంది.
- source_word: μύρα
  choice: పరిమళ తైలాలు
  rationale: μύρον సువాసనగల నూనె లేదా లేపనాన్ని సూచిస్తుంది; ἀρώματα నుండి భేదాన్ని నిలుపుతూ తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: τὸ μὲν σάββατον
  choice: విశ్రాంతి దినాన
  rationale: ఇది సబ్బాతు దినాన్ని సూచించే కాలవాచక ప్రయోగం; ‘విశ్రాంతి దినం’ సాధారణ పాఠకులకు అర్థమయ్యే సహజ తెలుగు రూపం.
- source_word: ἡσύχασαν
  choice: విశ్రమించారు
  rationale: సబ్బాతు సందర్భంలో పని మాని విశ్రాంతిగా ఉండడమే ఉద్దేశం.
- source_word: κατὰ τὴν ἐντολήν
  choice: ఆజ్ఞ ప్రకారం
  rationale: ఏకవచనంలోని ‘ఆజ్ఞ’ను, దానికి అనుగుణంగా ప్రవర్తించిన భావాన్ని సంక్షిప్తంగా మరియు నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: ‘ఆజ్ఞ’ దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘ఆజ్ఞ’ అని మాత్రమే ఉంచడం
  alternative: ‘సబ్బాతును ఆచరించాలనే మోషే ధర్మశాస్త్ర ఆజ్ఞ’ అని విస్తరించడం
  rationale: సందర్భం సబ్బాతు ఆచరణకు సంబంధించిన ధర్మశాస్త్ర ఆజ్ఞను సూచించినా, మూలపాఠ్యం దానిని వివరిస్తూ విస్తరించదు. అందువల్ల అనవసర వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి పాటించబడింది. రెండు రకాల సుగంధ పదార్థాల మధ్య మూలపాఠ్యంలోని భేదం నిలుపబడింది; ‘విశ్రాంతి దినం’ అనే రూపం సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా ఉంది.
