review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the temporal sequence ('అప్పుడు'), the future ingressive force of ἄρξονται λέγειν ('చెప్పడం మొదలుపెడతారు'), the distinction between mountains and hills, and both imperative cries. No interpretive theological expansion has been introduced into the main text.
  naturalness: The use of 'పర్వతాలతో/కొండలతో' can be understood as addressing them, but in this compact quoted construction it can also naturally suggest accompaniment ('with the mountains'). 'పర్వతాలకు/కొండలకు' makes the addressee relation explicit and is more idiomatic and immediately clear in modern standard Telugu. Plain 'అని' is also the standard connective form here.
  terminology: ‘పర్వతాలు’ and ‘కొండలు’ appropriately maintain the lexical distinction between ὄρη and βουνοί. ‘కప్పండి’ directly represents καλύψατε; the lexical-alternative note appropriately records the contextual sense ‘దాచండి.’
  issues:
  - severity: low
    issue: Potential ambiguity in ‘పర్వతాలతో/కొండలతో’
    rationale: Although Telugu can use -తో with speech verbs for an addressee, it may also mean ‘with.’ Dative ‘పర్వతాలకు/కొండలకు’ more clearly conveys the Greek dative addressees in this quotation.
  - severity: low
    issue: Use of emphatic spelling ‘అనీ’
    rationale: The ordinary quotative connective ‘అని’ is more natural in contemporary standard prose and does not alter the sense.
