id: LUK.23.30
reference: Luke 23:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε ἄρξονται λέγειν τοῖς ὄρεσιν· Πέσετε ἐφ’ ἡμᾶς, καὶ τοῖς βουνοῖς· Καλύψατε ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/030.yaml
  text: Then they will begin to say to the mountains[a], ‘Fall on us,’ and to the hills[b], ‘Cover us.’
translation:
  language: te
  text: అప్పుడు వారు పర్వతాలకు[a], ‘మా మీద పడండి’ అని, కొండలకు[b], ‘మమ్మల్ని కప్పండి’ అని చెప్పడం మొదలుపెడతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ మాటలు ప్రవచన గ్రంథాల్లోని తీర్పు భాషను, ముఖ్యంగా హోషేయ 10:8ను, ప్రతిధ్వనింపజేస్తాయి.
    reason: cross_reference
  - marker: b
    text: లేదా ‘మమ్మల్ని దాచండి.’ మూలపదానికి అక్షరార్థంగా ‘కప్పండి’ అని అర్థం; అయితే ఈ సందర్భంలో రాబోయే తీర్పు నుండి దాచబడాలనే భావం కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: ముందటి సందర్భం తరువాత జరిగే క్రమాన్ని సూచించే సహజమైన, సంక్షిప్త కాలసూచక పదం.
- source_word: ἄρξονται λέγειν
  choice: చెప్పడం మొదలుపెడతారు
  rationale: ἄρξονται యొక్క భవిష్యత్‌కాల ఆరంభ భావాన్ని, దానికి పూరకమైన λέγειν అనే క్రియారూపాన్ని రెండింటినీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τοῖς ὄρεσιν
  choice: పర్వతాలతో
  rationale: ὄρος మరియు తరువాతి βουνός మధ్య ఉన్న భేదాన్ని నిలుపుతూ, మొదటి పదాన్ని ‘పర్వతాలు’గా అనువదించింది.
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: మా మీద పడండి
  rationale: బహువచన ఆజ్ఞారూపాన్ని, ἐπίతో వ్యక్తమయ్యే ‘మీదికి/మీద’ భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: τοῖς βουνοῖς
  choice: కొండలతో
  rationale: βουνός సాధారణంగా చిన్న ఎత్తైన భూభాగాన్ని సూచిస్తుంది; ‘కొండలు’ అనే పదం ὄρεσινతో ఉన్న పదభేదాన్ని కాపాడుతుంది.
- source_word: Καλύψατε ἡμᾶς
  choice: మమ్మల్ని కప్పండి
  rationale: καλύπτω యొక్క ప్రాథమిక ‘కప్పు’ భావాన్ని నిలుపుతుంది; సందర్భంలో దాగిపోవాలనే భావం ఉన్నప్పటికీ దానిని ప్రధాన పాఠ్యంలో వివరణాత్మకంగా మార్చలేదు.
theological_decisions:
- issue: ప్రవచనాత్మక తీర్పు భాషతో అంతర్పాఠ్య సంబంధం
  choice: పర్వతాలు, కొండలకు చేసే అక్షరార్థమైన మొరను యథాతథంగా నిలుపడం
  alternative: ‘రాబోయే తీర్పు నుండి మమ్మల్ని దాచండి’ అని వివరణాత్మకంగా అనువదించడం
  rationale: ఈ వాక్యం హోషేయ 10:8లోని తీర్పు భాషను ప్రతిధ్వనిస్తుంది. ప్రధాన పాఠ్యంలో తీర్పును స్పష్టంగా చేర్చకుండా దృశ్యరూపాన్నీ దైవశాస్త్రీయ ఉద్వేగాన్నీ నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘పర్వతాలు/కొండలు’ అనే మూలపద భేదాన్ని, ‘చెప్పడం మొదలుపెడతారు’ అనే ఆరంభ భావాన్ని, ‘కప్పండి’ అనే అక్షరార్థ దృశ్యాన్ని నిలుపుకుంది. ఉద్ధరణ నిర్మాణం తెలుగులో స్పష్టంగా ఉండేందుకు ‘అనీ’ వాడబడింది.
