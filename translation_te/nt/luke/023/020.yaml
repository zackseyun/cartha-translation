revisions:
- from: అయితే పిలాతు యేసును విడుదల చేయాలని కోరుతూ, మళ్లీ వారితో బిగ్గరగా మాట్లాడాడు.[a]
  to: అయితే పిలాతు యేసును విడుదల చేయాలని కోరుకుంటూ, మళ్లీ వారిని ఉద్దేశించి మాట్లాడాడు.[a]
  rationale: ‘బిగ్గరగా’ అనే మూలంలో లేని భావాన్ని తొలగించి, προσεφώνησενలోని ‘వారిని ఉద్దేశించి పలకడం’ అనే అర్థాన్ని స్పష్టంగా ఉంచాం. పిలాతు యేసును విడుదల చేయాలనే సమకాలీన ఉద్దేశాన్ని ‘కోరుకుంటూ’ ద్వారా నిలిపాం; ఇతర వాక్యాంశాలు మూలానికి అనుగుణంగానే ఉన్నాయి.
