source:
  edition: SBLGNT
  text: πάλιν ⸀δὲ ὁ Πιλᾶτος ⸀προσεφώνησεν, θέλων ἀπολῦσαι τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/020.yaml
  text: But Pilate called out again[a], wanting to release Jesus.
translation:
  language: te
  text: అయితే పిలాతు యేసును విడుదల చేయాలని కోరుకుంటూ, మళ్లీ వారిని ఉద్దేశించి మాట్లాడాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మళ్లీ వారితో మాట్లాడాడు.”
    reason: προσεφώνησενకు ‘ఉద్దేశించి మాట్లాడాడు’ అనే ప్రధాన అనువాదంతో పాటు, సందర్భానుసారంగా ‘వారితో మాట్లాడాడు’ అనే సహజమైన ప్రత్యామ్నాయం కూడా సాధ్యమే.
lexical_decisions:
- source_word: πάλιν
  choice: మళ్లీ
  rationale: ఈ క్రియావిశేషణం చర్య పునరావృతమైందని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మళ్లీ’ సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: δὲ
  choice: అయితే
  rationale: సమూహం స్పందనకు పిలాతు చేసిన ప్రతిస్పందనలోని స్వల్ప వ్యతిరేకతను, కథన పురోగతిని తెలియజేస్తుంది.
- source_word: ὁ Πιλᾶτος
  choice: పిలాతు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: προσεφώνησεν
  choice: వారితో బిగ్గరగా మాట్లాడాడు
  rationale: προσφωνέω అంటే ఒకరిని ఉద్దేశించి పలకడం లేదా పిలవడం. విచారణలోని బహిరంగ సందర్భాన్ని ‘బిగ్గరగా మాట్లాడాడు’ సహజంగా తెలియజేస్తుంది; అంతర్లీనంగా ఉన్న శ్రోతలను తెలుగులో ‘వారితో’ అని స్పష్టం చేసింది.
- source_word: θέλων
  choice: విడుదల చేయాలని కోరుతూ
  rationale: ప్రధాన క్రియ జరుగుతున్న సమయంలో పిలాతుకు ఉన్న ఉద్దేశాన్ని వర్తమాన కృదంతం సూచిస్తుంది; ‘కోరుతూ’ ఆ సమకాలీన భావాన్ని నిలుపుతుంది.
- source_word: ἀπολῦσαι
  choice: విడుదల చేయాలని
  rationale: నిర్బంధం నుంచి విడిచిపెట్టడాన్ని సూచించే న్యాయపరమైన సందర్భానికి ‘విడుదల చేయడం’ తగినది.
- source_word: τὸν Ἰησοῦν
  choice: యేసును
  rationale: తెలుగులో స్థిరపడిన నామరూపానికి కర్మవిభక్తి జోడించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని స్వల్ప వ్యతిరేకత, పునరావృతం, పిలాతు ఉద్దేశం నిలుపబడ్డాయి; క్రియలో అంతర్లీనంగా ఉన్న శ్రోతలను తెలుగు సహజత్వం కోసం ‘వారితో’ అని వ్యక్తం చేశాం.
