  text: But they kept shouting, saying, “Crucify, crucify him!”
translation:
  language: te
  text: కానీ వారు, “అతన్ని సిలువ వేయించు! సిలువ వేయించు!” అని గట్టిగా కేకలు వేస్తూనే ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత స్పష్టంగా, “అతన్ని సిలువపై మరణశిక్ష విధించు! సిలువపై మరణశిక్ష విధించు!”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: కానీ వారు
  rationale: οἱ సందర్భంలో ముందుగా ప్రస్తావించిన జనసమూహాన్ని సూచిస్తుంది; δέ ముందటి మాటకు వ్యతిరేకతను సూచిస్తున్నందున ‘కానీ’ సహజంగా సరిపోతుంది.
- source_word: ἐπεφώνουν
  choice: గట్టిగా కేకలు వేస్తూనే ఉన్నారు
  rationale: ἐπιφωνέω బిగ్గరగా కేక వేయడాన్ని సూచిస్తుంది; అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పదేపదే జరుగుతున్న చర్యను తెలియజేస్తుంది.
- source_word: λέγοντες
  choice: అని
  rationale: సమకాలిక కృదంతం కేకలలోని మాటలను పరిచయం చేస్తుంది; తెలుగులో ప్రత్యక్ష వాక్యానంతర ‘అని’ సహజమైన నిర్మాణం.
- source_word: Σταύρου σταύρου
  choice: సిలువ వేయించు! సిలువ వేయించు!
  rationale: σταυρόω అంటే సిలువపై మరణశిక్ష అమలు చేయడం. పిలాతును ఉద్దేశించిన ఏకవచన ఆజ్ఞగా తెలుగులో ‘వేయించు’ సహజం; పునరుక్తి జనసమూహపు పట్టుదల, అత్యవసరతను నిలుపుతుంది.
- source_word: αὐτόν
  choice: అతన్ని
  rationale: ఇది ఆజ్ఞకు కర్మగా ఉన్న సాధారణ పుంలింగ ఏకవచన సర్వనామం.
theological_decisions:
- issue: σταύρου అనే మరణశిక్ష ఆజ్ఞను అనువదించడం
  choice: సిలువ వేయించు
  alternative: సిలువపై మరణశిక్ష విధించు
  rationale: మూల క్రియ ప్రత్యేకంగా సిలువ మరణాన్ని సూచిస్తుంది. ‘సిలువ వేయించు’ తెలుగులో సంక్షిప్తంగా, సహజంగా ఉండి, పిలాతును ఉద్దేశించిన ఆజ్ఞను తెలియజేస్తుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; జనసమూహపు నిరంతరమైన గట్టి కేకను, పునరుక్త ఆజ్ఞను సహజమైనప్పటికీ గౌరవప్రదమైన కథనశైలిలో నిలుపుకుంది.
