id: LUK.23.26
reference: Luke 23:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὡς ἀπήγαγον αὐτόν, ἐπιλαβόμενοι ⸂Σίμωνά τινα Κυρηναῖον ἐρχόμενον⸃ ἀπ’ ἀγροῦ ἐπέθηκαν αὐτῷ τὸν σταυρὸν φέρειν ὄπισθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/026.yaml
  text: And as they led him away[a], they seized a certain Simon of Cyrene, coming in from the countryside[b], and laid the cross on him to carry behind Jesus.
translation:
  language: te
  text: వారు యేసును తీసుకుపోతుండగా, గ్రామీణ ప్రాంతం నుంచి వస్తున్న[a] కురేనీయుడైన సీమోను అనే ఒక వ్యక్తిని పట్టుకొని, యేసు వెనుక మోయడానికి సిలువను[b] అతని మీద మోపారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పొలం నుంచి వస్తున్న.’ గ్రీకు పదం ఒక నిర్దిష్ట పొలాన్ని గానీ, సాధారణంగా పట్టణం వెలుపల ఉన్న గ్రామీణ ప్రాంతాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: కొందరు ఇక్కడ ‘సిలువ’ను మరింత నిర్దిష్టంగా ‘సిలువ అడ్డుదూలం’గా అర్థం చేసుకుంటారు; అయితే గ్రీకు పాఠ్యంలో కేవలం ‘సిలువ’ అనే పదమే ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον
  choice: తీసుకెళ్తుండగా
  rationale: ἀπάγω అంటే అదుపులో ఒకరిని అక్కడి నుంచి తీసుకెళ్లడం లేదా నడిపించుకెళ్లడం. సందర్భానికి అనుగుణంగా ఈ రూపం సహజమైన ఆధునిక తెలుగులో ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: ἐπιλαβόμενοι
  choice: పట్టుకొని
  rationale: ఇక్కడ ἐπιλαμβάνομαι శారీరకంగా పట్టుకోవడాన్ని సూచిస్తుంది. సందర్భంలో బలవంతం స్పష్టంగా ఉన్నప్పటికీ, మూలపదాన్ని మించి తీవ్రతను చేర్చకుండా ‘పట్టుకొని’ అని అనువదించాం.
- source_word: Σίμωνά τινα Κυρηναῖον
  choice: కురేనీయుడైన సీమోను అనే ఒక వ్యక్తిని
  rationale: τινα పరిచయం లేని ఒక వ్యక్తిని సూచిస్తుంది; Κυρηναῖον అతడు కురేనే ప్రాంతానికి చెందినవాడని తెలియజేస్తుంది. ఈ నిర్మాణం తెలుగులో సహజంగా ఉంది.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: పల్లెప్రాంతం నుంచి వస్తున్న
  rationale: ἀγρός అనేది ప్రత్యేకంగా ‘పొలం’ను గానీ, పట్టణానికి వెలుపల ఉన్న గ్రామీణ ప్రాంతాన్ని గానీ సూచించగలదు. ప్రధాన పాఠ్యంలో విస్తృతమైన అర్థాన్ని ఉంచి, మరొక సాధ్యమైన అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἐπέθηκαν αὐτῷ τὸν σταυρὸν
  choice: దాన్ని అతని మీద మోపారు
  rationale: ἐπιτίθημι అంటే ఒక వస్తువును మరొకరి మీద ఉంచడం. ‘మోపారు’ అనేది భారం అతని మీద పెట్టబడిందనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τὸν σταυρὸν
  choice: సిలువను
  rationale: σταυρόςకు నేరమైన సాధారణ తెలుగు సమానార్థకం ‘సిలువ.’ ‘అడ్డుదూలం’ అని ప్రత్యేకీకరించడం మూలపాఠ్యంలో లేని చారిత్రక పునర్నిర్మాణాన్ని చేర్చుతుంది.
- source_word: φέρειν
  choice: మోయడానికి
  rationale: φέρω ఇక్కడ భౌతిక భారాన్ని మోయడాన్ని సూచిస్తుంది; ‘మోయడం’ ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన పదం.
- source_word: ὄπισθεν τοῦ Ἰησοῦ
  choice: యేసు వెనుక
  rationale: ὄπισθεν ప్రధానంగా స్థలపరంగా ‘వెనుక’ అని అర్థం. ఊరేగింపు దృశ్యాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా ఇది స్పష్టంగా చూపిస్తుంది.
theological_decisions:
- issue: శిలువవేత సందర్భంలో σταυρόςను మరింత నిర్దిష్టంగా ‘సిలువ అడ్డుదూలం’ అని అనువదించాలా?
  choice: సిలువ
  alternative: సిలువ అడ్డుదూలం
  rationale: మూలపాఠ్యంలో ఉపయోగించిన పదం σταυρός మాత్రమే; ప్రత్యేకంగా దూలాన్ని సూచించే పదం లేదు. అందువల్ల చారిత్రక పునర్నిర్మాణాన్ని పాఠ్యంలోకి చేర్చకుండా సాధారణ నేర అర్థమైన ‘సిలువ’ను ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా వాక్య గాంభీర్యాన్ని నిలుపుతూ అనువదించాం. గ్రీకు వాక్యంలోని సంఘటనల క్రమాన్ని కాపాడుతూ తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా అమర్చాం. అందించిన ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదసూచిక అక్షరాలు వాటి విషయాలకు సరిపోని స్థానాల్లో కనిపించాయి; తెలుగులో [a]ను ἀγρός ప్రత్యామ్నాయానికి, [b]ను σταυρός ప్రత్యామ్నాయానికి సరైన పదాల వద్ద ఉంచాం.
