  source_fidelity: 'మూల గ్రీకు వాక్యంలోని ప్రధాన అంశాలు దాదాపు సరిగానే ఉన్నాయి: యేసును తీసుకుపోవడం, కురేనేకు చెందిన సీమోనును పట్టుకోవడం, అతనిపై సిలువను మోపడం, యేసు వెనుక మోయడం అన్న క్రమం నిలిచింది. అయితే ప్రధాన వాక్యంలో ‘దాన్ని అతని మీద’ అనే సర్వనామ ప్రయోగం అనవసరంగా సూచనను కొద్దిగా భారంగా/అస్పష్టంగా చేస్తుంది. ‘సిలువను అతని మీద మోపారు’ అని నేరుగా చెప్పడం మూలంలోని τὸν σταυρὸν ను స్పష్టంగా ప్రతిబింబిస్తుంది.'
  naturalness: ‘తీసుకుపోతుండగా’ అనేది అదుపులో అక్కడి నుండి తీసుకువెళ్లే ἀπήγαγον భావానికి ‘తీసుకెళ్తుండగా’ కంటే కొద్దిగా సహజంగా, స్పష్టంగా ఉంది. ‘పల్లెప్రాంతం’ అర్థమయ్యేదే అయినా, పట్టణం వెలుపలి విస్తృత ప్రాంతం అనే సందర్భంలో ‘గ్రామీణ ప్రాంతం’ ఆధునిక ప్రామాణిక తెలుగులో మరింత తటస్థంగా ఉంటుంది. సవరించిన పదక్రమం వాక్యాన్ని సులభంగా చదవగలిగేలా చేస్తుంది.
