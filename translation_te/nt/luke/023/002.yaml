id: LUK.23.2
reference: Luke 23:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ λέγοντες· Τοῦτον εὕραμεν διαστρέφοντα τὸ ἔθνος ⸀ἡμῶν καὶ κωλύοντα ⸂φόρους Καίσαρι⸃ διδόναι ⸀καὶ λέγοντα ⸀αὑτὸν χριστὸν βασιλέα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/002.yaml
  text: And they began to accuse him[a], saying, “We found this man misleading our nation and forbidding us to pay taxes to Caesar, and saying that he himself is Messiah[c][b], a king.”
translation:
  language: te
  text: వారు ఆయన మీద నేరారోపణలు చేయడం మొదలుపెట్టి, “ఈ మనిషి మన జాతిని తప్పుదారి పట్టిస్తున్నాడని[a], కైసరుకు పన్నులు[b] చెల్లించకుండా అడ్డుకుంటున్నాడని, తానే మెస్సీయనని[c], రాజునని చెబుతున్నాడని మేము కనుగొన్నాం” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మన జాతిని చెడుదోవ పట్టిస్తున్నాడని” లేదా “మన జాతిని దారితప్పిస్తున్నాడని.”
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పదం φόρους; ఇది రోమా చక్రవర్తికి చెల్లించే పన్నులు లేదా కప్పాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా “తానే క్రీస్తునని, రాజునని చెబుతున్నాడని.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ
  choice: అప్పుడు వారు ఆయన మీద నేరారోపణలు చేయడం మొదలుపెట్టి
  rationale: న్యాయవిచారణ సందర్భంలోని κατηγορεῖν భావాన్ని ‘నేరారోపణలు చేయడం’ స్పష్టంగా తెలియజేస్తుంది; ἤρξαντο యొక్క ఆరంభ భావాన్ని ‘మొదలుపెట్టి’ నిలుపుతుంది.
- source_word: Τοῦτον
  choice: ఈ మనిషి
  rationale: సూచనాత్మకమైన, కొంత తృణీకార ధ్వని గల ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: εὕραμεν
  choice: మేము కనుగొన్నాం
  rationale: ఆరోపణను తాము నిర్ధారించినట్లు చెప్పే న్యాయపరమైన ధ్వనిని నిలుపుతుంది.
- source_word: διαστρέφοντα τὸ ἔθνος ἡμῶν
  choice: మన జాతిని తప్పుదారి పట్టిస్తున్నాడని
  rationale: διαστρέφωలోని దారి మళ్లించడం లేదా చెడుదోవ పట్టించడం అనే భావాన్ని రాజకీయ తిరుగుబాటుగా అతిగా నిర్దిష్టీకరించకుండా వ్యక్తం చేస్తుంది.
- source_word: κωλύοντα φόρους Καίσαρι διδόναι
  choice: కైసరుకు పన్నులు చెల్లించకుండా అడ్డుకుంటున్నాడని
  rationale: κωλύω యొక్క అడ్డగింపు భావాన్ని, φόρους యొక్క పన్ను లేదా కప్పం భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: λέγοντα αὑτὸν χριστὸν βασιλέα εἶναι
  choice: తానే మెస్సీయ, ఒక రాజు అని చెబుతున్నాడని
  rationale: αὑτόνలోని స్వయంప్రాధాన్యాన్ని ‘తానే’ ద్వారా, χριστός యొక్క బిరుదు భావాన్ని ‘మెస్సీయ’ ద్వారా, βασιλεύςను వేరొక రాజపదవిగా ఉంచుతుంది.
theological_decisions:
- issue: రాజకీయ ఆరోపణలో χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ χριστός పేరు వలె కాక రాజాభిషిక్త బిరుదుగా పనిచేస్తోంది; ‘మెస్సీయ’ యూదుల అభిషిక్త రాజు నేపథ్యాన్ని నిలుపుతుంది.
- issue: χριστόν మరియు βασιλέα మధ్య సంబంధం
  choice: మెస్సీయ, ఒక రాజు
  alternative: మెస్సీయ రాజు
  rationale: గ్రీకులోని రెండు విధేయ పదాలను ఒకే స్థిర బిరుదుగా కలపకుండా, రెండింటినీ విడిగా ఉంచి అసలు వాక్యంలోని నిర్మాణాత్మక అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవిచారణ సందర్భానికి తగిన గంభీరమైన కాని సాధారణ పాఠకులకు సులభమైన శైలి. ‘కైసరు,’ ‘మెస్సీయ’ వంటి చారిత్రక-ధార్మిక పదాలను నిలిపి, అవసరమైన వివరణలను పాదటిప్పణుల్లో ఇచ్చాం.
