translation:
  language: te
  text: అప్పుడు హేరోదు ఆయనను చాలాసేపు ప్రశ్నిస్తూనే ఉన్నాడు[a]. అయితే ఆయన అతనికి ఏ జవాబూ చెప్పలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అనేక మాటలతో’ లేదా ‘అనేక ప్రశ్నలతో.’ గ్రీకు పదబంధం చాలాసేపు కొనసాగిన మౌఖిక ప్రశ్నించడాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτα
  choice: ప్రశ్నిస్తూనే ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగిన లేదా పదేపదే జరిగిన ప్రశ్నించడాన్ని సూచిస్తుంది; తెలుగు రూపం ఆ నిరంతరతను సహజంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: అందుచేత / అయితే
  rationale: మొదటి δέ కథన ప్రవాహాన్ని కొనసాగించే మృదు సంధిగా ‘అందుచేత’తో, రెండవది హేరోదు ప్రశ్నించడానికి యేసు మౌనానికి మధ్య వ్యత్యాసాన్ని చూపేందుకు ‘అయితే’తో అనువదించబడింది.
- source_word: ἐν λόγοις ἱκανοῖς
  choice: చాలాసేపు
  rationale: అక్షరార్థంగా ‘అనేక మాటలతో’ అనే భావం ఉన్నా, సందర్భంలో దీర్ఘంగా సాగిన మౌఖిక ప్రశ్నలను సూచిస్తుంది. ‘చాలాసేపు’ ఆధునిక తెలుగులో సహజంగా ఆ నిడివిని తెలియజేస్తుంది; ప్రత్యామ్నాయ అక్షరార్థ భావాలను పాదసూచికలో ఉంచాం.
- source_word: αὐτὸς
  choice: ఆయన
  rationale: గ్రీకులోని స్వల్ప ఉద్ఘాటనను ప్రత్యేకంగా ‘ఆయనే’ అని బలపరచకుండా, ‘అయితే’ ద్వారా వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: οὐδὲν ἀπεκρίνατο αὐτῷ
  choice: అతనికి ఏ జవాబూ చెప్పలేదు
  rationale: ‘అతనికి ఏదీ జవాబివ్వలేదు’ కంటే ఇది సహజమైన ఆధునిక తెలుగు; οὐδέν యొక్క సంపూర్ణ నిరాకరణను ‘ఏ జవాబూ ... లేదు’ నిలుపుతుంది.
