id: LUK.23.46
reference: Luke 23:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ φωνήσας φωνῇ μεγάλῃ ὁ Ἰησοῦς εἶπεν· Πάτερ, εἰς χεῖράς σου ⸀παρατίθεμαι τὸ πνεῦμά μου. ⸂τοῦτο δὲ⸃ εἰπὼν ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/046.yaml
  text: And Jesus[a], crying out with a loud voice, said, “Father, into your hands I commit my spirit.” Having said this[c][b], he breathed his last.
translation:
  language: te
  text: యేసు బిగ్గర స్వరంతో కేకవేసి, “తండ్రీ, నీ చేతుల్లోకి నా ఆత్మను అప్పగిస్తున్నాను[a][b]” అని అన్నాడు. ఇలా చెప్పి ఆయన తుదిశ్వాస విడిచాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ఆత్మను నీ సంరక్షణకు అప్పగిస్తున్నాను.” ఈ క్రియ ఒకదాన్ని మరొకరి సంరక్షణలో ఉంచడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: 'ఈ మాట గ్రీకు లేఖనాల్లోని కీర్తన 31:5ను ప్రతిధ్వనిస్తుంది: “నీ చేతుల్లోకి నా ఆత్మను అప్పగిస్తున్నాను.”'
    reason: cross_reference
  - marker: c
    text: లేదా, “ఆయన ప్రాణం విడిచాడు”; ఈ గ్రీకు క్రియ అక్షరార్థంగా శ్వాస విడవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας φωνῇ μεγάλῃ
  choice: బిగ్గర స్వరంతో కేకవేసి
  rationale: φωνέω క్రియారూపం గట్టిగా పిలవడం లేదా కేకవేయడాన్ని సూచిస్తుంది; φωνῇ μεγάλῃ ఆ పలుకు బిగ్గరగా ఉందని నొక్కిచెబుతుంది. తెలుగు వాక్యం మూలంలోని బలాన్ని, వినిపించే స్వరాన్ని సహజంగా నిలుపుతుంది.
- source_word: Πάτερ
  choice: తండ్రీ
  rationale: ఇది ప్రత్యక్ష సంబోధన. గ్రీకులో లేని ‘నా’ అనే స్వామ్యపదాన్ని చేర్చకుండా, ప్రార్థనకు తగిన సహజమైన తెలుగు సంబోధన వాడబడింది.
- source_word: εἰς χεῖράς σου
  choice: నీ చేతుల్లోకి
  rationale: గ్రీకు బహువచనమైన ‘చేతులు’ను, εἰς తెలిపే దిశను నిలుపుతూ, కీర్తన 31:5 ప్రతిధ్వనిని గుర్తించగల సహజ తెలుగు రూపం.
- source_word: παρατίθεμαι
  choice: అప్పగిస్తున్నాను
  rationale: ఈ మధ్యమవాచక వర్తమాన రూపం ఒకదాన్ని మరొకరి సంరక్షణకు ఉద్దేశపూర్వకంగా అప్పగించడాన్ని సూచిస్తుంది. తెలుగు వర్తమాన కొనసాగింపు రూపం ఈ సందర్భంలోని కార్యసాధక ప్రకటనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ πνεῦμά μου
  choice: నా ఆత్మను
  rationale: πνεῦμα అనే పదానికి ఆత్మ, ఊపిరి, జీవశక్తి వంటి అర్థవ్యాప్తి ఉన్నా, తండ్రిని ఉద్దేశించి చేసిన ఈ ప్రార్థనలో ‘నా ఆత్మ’ మూలంలోని వ్యక్తిగత, ఆధ్యాత్మిక బరువును అనవసర సిద్ధాంత వివరణ లేకుండా నిలుపుతుంది.
- source_word: τοῦτο δὲ εἰπών
  choice: ఇలా చెప్పి
  rationale: ముందుగా జరిగిన మాటను ప్రధాన క్రియతో సంక్షిప్తంగా కలిపే సహజ ఆధునిక తెలుగు నిర్మాణం.
- source_word: ἐξέπνευσεν
  choice: తుదిశ్వాస విడిచాడు
  rationale: ఈ క్రియ అక్షరార్థంగా శ్వాస బయటకు వెళ్లడాన్ని సూచిస్తూ, సందర్భంలో మరణాన్ని తెలియజేస్తుంది. ‘తుదిశ్వాస విడిచాడు’ శ్వాస చిత్రణను, మరణార్థాన్ని రెండింటినీ స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: τὸ πνεῦμά μου యొక్క అనువాదం
  choice: నా ఆత్మను
  alternative: నా ఊపిరిని
  rationale: యేసు స్పృహతో తండ్రిని సంబోధించి తనను ఆయన సంరక్షణకు అప్పగించే సందర్భం ‘ఆత్మ’ అనే అర్థానికి ప్రాధాన్యం ఇస్తుంది. అయినా πνεῦμα పదంలోని ఊపిరి సంబంధిత అర్థవ్యాప్తిని పాదసూచిక ద్వారా గుర్తించవచ్చు; వాక్యం దానిని సిద్ధాంతపరంగా మరింత నిర్వచించదు.
- issue: παρατίθεμαι యొక్క వర్తమాన మధ్యమవాచక భావం
  choice: అప్పగిస్తున్నాను
  alternative: నీ సంరక్షణకు ఉంచుతున్నాను
  rationale: ఇది యేసు ఉద్దేశపూర్వకంగా చేస్తున్న కార్యసాధక ప్రకటనగా వినిపిస్తుంది. తెలుగు రూపం ఆ స్వచ్ఛంద అప్పగింతను వ్యక్తం చేస్తుంది; మధ్యమవాచకానికి మించిన సిద్ధాంత నిర్ధారణను చేర్చదు.
- issue: ἐξέπνευσενలోని మరణం–శ్వాస చిత్రణ
  choice: తుదిశ్వాస విడిచాడు
  alternative: చనిపోయాడు
  rationale: సాధారణ ‘చనిపోయాడు’ సందర్భార్థాన్ని ఇస్తుంది గాని మూలక్రియలోని శ్వాస చిత్రణను కోల్పోతుంది. ఎంపిక చేసిన రూపం మరణాన్ని స్పష్టం చేస్తూనే ఆ చిత్రణను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా, సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ‘తండ్రీ’ ప్రార్థనా సంబోధనను నిలుపుతుంది; ‘బిగ్గర స్వరంతో కేకవేసి’ మూలంలోని పునరుక్త బలాన్ని అతిగా కృత్రిమంగా కాకుండా అందిస్తుంది. పాదసూచిక గుర్తులన్నీ సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
