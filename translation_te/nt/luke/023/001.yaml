source:
  edition: SBLGNT
  text: Καὶ ἀναστὰν ἅπαν τὸ πλῆθος αὐτῶν ἤγαγον αὐτὸν ἐπὶ τὸν Πιλᾶτον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/001.yaml
  text: And the whole assembly of them rose and led him to Pilate[a].
translation:
  language: te
  text: అప్పుడు వారి సమూహమంతా లేచి, ఆయనను పిలాతు వద్దకు తీసుకెళ్లింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి జనసమూహమంతా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: అప్పుడు
  rationale: మునుపటి సంఘటన తరువాత జరిగిన తదుపరి చర్యను సహజమైన తెలుగు కథనశైలిలో సూచిస్తుంది; గ్రీకు సంధానపదానికి అదనపు కారణార్థాన్ని చేర్చదు.
- source_word: ἀναστὰν
  choice: లేచి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచించే గ్రీకు ఏరిస్ట్ కృదంతాన్ని సహజంగా, సంక్షిప్తంగా ప్రతిబింబిస్తుంది.
- source_word: ἅπαν τὸ πλῆθος αὐτῶν
  choice: వారందరి సమూహం
  rationale: ἅπαν యొక్క సంపూర్ణతను ‘అందరి’ ద్వారా, πλῆθος యొక్క సమష్టి భావాన్ని ‘సమూహం’ ద్వారా నిలుపుతుంది; సందర్భానికి మించి అధికారిక సంస్థగా నిర్దిష్టం చేయదు.
- source_word: ἤγαγον
  choice: తీసుకెళ్లింది
  rationale: ἄγω ఇక్కడ ఒక వ్యక్తిని గమ్యస్థానానికి అదుపులో వెంట తీసుకెళ్లడాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో సమష్టివాచకమైన ‘సమూహం’కు అనుగుణంగా ఏకవచన క్రియ వాడబడింది.
- source_word: αὐτὸν
  choice: ఆయనను
  rationale: యేసును సూచించే ప్రత్యక్ష కర్మ సర్వనామం; తెలుగు గౌరవప్రదమైన సాధారణ బైబిలు శైలికి అనుగుణం.
- source_word: ἐπὶ τὸν Πιλᾶτον
  choice: పిలాతు దగ్గరికి
  rationale: చలనక్రియతో కూడిన ἐπί + ద్వితీయా విభక్తి పిలాతు వైపు లేదా అతని సమక్షానికి తీసుకెళ్లడాన్ని సూచిస్తుంది; ‘దగ్గరికి’ ఆ గమ్యభావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: Πιλᾶτον
  choice: పిలాతు
  rationale: గ్రీకు వ్యక్తినామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
theological_decisions:
- issue: న్యాయవిచారణ సందర్భంలో సమష్టి కర్తను ఎలా వ్యక్తపరచాలి
  choice: వారందరి సమూహం
  alternative: వారి జనసమూహమంతా
  rationale: ‘సమూహం’ అనేది అక్కడ కూడిన మొత్తం వర్గాన్ని సూచిస్తుంది; అది యాదృచ్ఛిక గుంపని గానీ, గ్రీకు పాఠం చెప్పినదానికంటే నిర్దిష్టమైన అధికార సంస్థని గానీ భావింపజేయదు. ప్రత్యామ్నాయం πλῆθος యొక్క ‘జనసమూహం/సమూహమంతా’ భావాన్ని మరింత ప్రత్యక్షంగా చూపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథనశైలి. గ్రీకు సమష్టివాచక పదంలోని స్వల్ప అనిశ్చితిని పాదటిప్పణిలో నిలిపింది.
