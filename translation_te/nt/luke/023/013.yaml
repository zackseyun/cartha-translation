  yaml_path: translation/nt/luke/023/013.yaml
  text: But Pilate, having called together the chief priests and the rulers and the people,
translation:
  language: te
  text: అప్పుడు పిలాతు ప్రధాన యాజకులను, అధికారులను, ప్రజలను కూడబెట్టి,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: పిలాతు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇది కథనంలో స్వల్ప మార్పును లేదా తదుపరి పరిణామాన్ని సూచిస్తుంది. తెలుగులో ‘అప్పుడు’ సహజంగా ఆ అనుసంధానాన్ని తెలియజేస్తుంది; బలమైన వ్యతిరేకతను అనవసరంగా చేర్చదు.
- source_word: συγκαλεσάμενος
  choice: ఒకచోటికి పిలిపించి
  rationale: అయోరిస్టు మధ్యమ కృదంతంలోని సమీకరించి పిలిచే భావాన్ని, తరువాతి ప్రధాన క్రియకు ముందున్న చర్యగా సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: ఇక్కడ బహువచనం ఒకేసారి అనేక మహాయాజకులను కాక, ప్రముఖ యాజక అధికారులను సూచిస్తుంది; ‘ప్రధాన యాజకులు’ ఆ భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: ἄρχοντας
  choice: అధికారులు
  rationale: పాలనా లేదా సమాజ నాయకత్వ హోదాలో ఉన్నవారిని సూచించే ἄρχοντεςకు ఆధునిక తెలుగులో ‘అధికారులు’ సహజమైన అధికారిక పదం.
- source_word: λαὸν
  choice: ప్రజలు
  rationale: λαός అనే సామూహిక పదాన్ని ‘గుంపు’గా కుదించకుండా విస్తృతమైన ప్రజాసమూహ భావంతో అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కథన శైలి. గ్రీకు వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున తెలుగులోనూ చివర కామాతో అసంపూర్ణ నిర్మాణాన్ని నిలిపాం.
