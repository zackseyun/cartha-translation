id: LUK.23.15
reference: Luke 23:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδὲ Ἡρῴδης, ⸂ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς⸃· καὶ ἰδοὺ οὐδὲν ἄξιον θανάτου ἐστὶν πεπραγμένον αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/015.yaml
  text: But neither did Herod, for he sent him back to us. And look, nothing deserving of death has been done by him.
translation:
  language: te
  text: హేరోదు కూడా ఇతనిలో ఏ దోషమూ కనుగొనలేదు; ఎందుకంటే అతడు ఇతన్ని తిరిగి మన దగ్గరికి పంపించాడు. ఇదిగో, మరణశిక్షకు తగినదేదీ ఇతడు చేయలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ’ οὐδὲ Ἡρῴδης
  choice: హేరోదు కూడా ఇతనిలో ఏ దోషమూ కనుగొనలేదు
  rationale: ముందటి వాక్యంలోని ‘నేను ఇతనిలో ఏ దోషమూ కనుగొనలేదు’ అనే క్రియను ఇక్కడి గ్రీకు వాక్యం అధ్యాహారంగా ఉంచుతుంది. తెలుగులో భావం స్పష్టంగా ఉండేందుకు దానిని పూరించాం; οὐδέ ఇక్కడ పిలాతుతో పాటు హేరోదు కూడా అదే తీర్పుకు వచ్చాడని సూచిస్తుంది.
- source_word: ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς
  choice: ఎందుకంటే అతడు ఇతన్ని తిరిగి మన దగ్గరికి పంపించాడు
  rationale: ἀναπέμπω ఈ కథన సందర్భంలో తిరిగి పంపడాన్ని సూచిస్తుంది; γάρ వివరణాత్మక కారణాన్ని పరిచయం చేస్తుంది; πρὸς ἡμᾶς ను సహజమైన తెలుగులో ‘మన దగ్గరికి’ అని అనువదించాం.
- source_word: καὶ ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రోతల దృష్టిని వెంటనే తరువాతి నిర్ధారణపై నిలిపే ἰδού యొక్క సంభాషణాత్మక బలాన్ని, గౌరవప్రదమైన ఆధునిక తెలుగులో ‘ఇదిగో’ సహజంగా నిలుపుతుంది.
- source_word: οὐδὲν ἄξιον θανάτου
  choice: మరణశిక్షకు తగినదేదీ
  rationale: న్యాయవిచారణ సందర్భంలో θάνατος కేవలం మరణాన్ని కాక మరణదండనను సూచిస్తుంది. ‘మరణశిక్షకు తగినది’ మూలంలోని న్యాయపరమైన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐστὶν πεπραγμένον αὐτῷ
  choice: ఇతడు చేయలేదు
  rationale: పూర్తయిన చర్యకు ప్రస్తుత న్యాయపరమైన ప్రాముఖ్యత ఉందనే పరిపూర్ణ భావాన్ని తెలుగులో సహజమైన నిరాకరణ వాక్యంగా అందించాం. αὐτῷ ను సందర్భానుసారం చర్య చేసిన వ్యక్తిగా గ్రహించాం.
theological_decisions:
- issue: πεπραγμένον αὐτῷ లో αὐτῷ యొక్క సంబంధం
  choice: 'కర్తృభావం: ‘ఇతడు చేయలేదు’'
  alternative: 'సంబంధార్థం: ‘ఇతనిలో కనబడలేదు’'
  rationale: పిలాతు యేసు మరణశిక్షకు పాత్రమైన కార్యం చేయలేదని ప్రకటిస్తున్న న్యాయసందర్భానికి కర్తృభావం నేరుగా సరిపోతుంది. అయితే ‘ఇతనిలో కనబడలేదు’ అనే భావసమీప ప్రత్యామ్నాయం ముందటి దోషనిర్ధారణ భాషతో అనుసంధానమవుతుంది.
- issue: ἀλλ’ οὐδὲ Ἡρῴδης లో అధ్యాహార క్రియ
  choice: ముందటి వాక్యంలోని ‘ఏ దోషమూ కనుగొనలేదు’ అనే భావాన్ని స్పష్టంగా పూరించడం
  alternative: ‘హేరోదు కూడా కాదు’ అని అధ్యాహారాన్ని అలాగే ఉంచడం
  rationale: తెలుగులో కేవలం ‘హేరోదు కూడా కాదు’ అనడం అసంపూర్ణంగా, అసహజంగా ఉంటుంది. సందర్భంలోని క్రియను పూరించడం కొత్త సిద్ధాంతార్థాన్ని చేర్చకుండా మూలంలోని వ్యాకరణ అధ్యాహారాన్ని వెల్లడిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయవిచారణ సందర్భానికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘ఇతడు/ఇతన్ని’ రూపాలు నిందితుని గురించి పిలాతు ప్రజలతో మాట్లాడుతున్న సందర్భాన్ని సహజంగా ప్రతిబింబిస్తాయి.
