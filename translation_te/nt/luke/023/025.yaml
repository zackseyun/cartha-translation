id: LUK.23.25
reference: Luke 23:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπέλυσεν δὲ τὸν διὰ στάσιν καὶ φόνον βεβλημένον ⸀εἰς φυλακὴν ὃν ᾐτοῦντο, τὸν δὲ Ἰησοῦν παρέδωκεν τῷ θελήματι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/025.yaml
  text: So he released the man who had been thrown into prison for insurrection and murder[a], whom they were asking for[b]; but he handed Jesus over to their will.
translation:
  language: te
  text: అప్పుడు అతడు, తిరుగుబాటు మరియు హత్య కారణంగా చెరసాలలో వేయబడి ఉన్న, వారు కోరుతున్న వ్యక్తిని విడుదల చేశాడు; అయితే యేసును వారి ఇష్టానికి వదిలివేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέλυσεν
  choice: విడుదల చేశాడు
  rationale: ఖైదీని నిర్బంధం నుంచి విడిచిపెట్టడాన్ని సహజమైన న్యాయపరమైన భాషలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: διὰ στάσιν καὶ φόνον
  choice: తిరుగుబాటు మరియు హత్య కారణంగా
  rationale: διά + accusative కారణాన్ని సూచిస్తుంది; ఈ రాజకీయ సందర్భంలో στάσις అనేది సాధారణ వివాదం కాక తిరుగుబాటు.
- source_word: βεβλημένον εἰς φυλακήν
  choice: చెరసాలలో వేయబడి
  rationale: βάλλω యొక్క సజీవ భావాన్ని ‘వేయబడి’ నిలుపుతుంది; perfect passive participle సూచించే కొనసాగుతున్న ఖైదు స్థితి సందర్భంలో స్పష్టంగా ఉంది.
- source_word: ὃν ᾐτοῦντο
  choice: వారు కోరుతున్న వ్యక్తిని
  rationale: Imperfect రూపంలోని కొనసాగుతున్న కోరికను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘పట్టుబడుతున్నారు’ అని తీవ్రతను అదనంగా చేర్చదు.
- source_word: παρέδωκεν
  choice: అప్పగించాడు
  rationale: న్యాయపరంగా మరొకరి అధికారానికి లేదా నిర్ణయానికి ఒప్పగించే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τῷ θελήματι αὐτῶν
  choice: వారి ఇష్టానికి
  rationale: θέλημα లోని సంకల్పం/కోరిక భావాన్ని సంక్షిప్తంగా, గంభీరంగా నిలుపుతుంది.
- source_word: δὲ ... δὲ
  choice: అప్పుడు ... అయితే
  rationale: మొదటి δέ కథన పురోగతిని, రెండవ δέ విడుదలైన వ్యక్తి మరియు యేసు పట్ల జరిగిన చర్యల మధ్య వ్యత్యాసాన్ని తెలియజేస్తాయి.
theological_decisions:
- issue: విడుదలైన తిరుగుబాటుదారునికీ యేసుకూ మధ్య వ్యత్యాసం
  choice: కథనంలోని వ్యత్యాసాన్ని మాత్రమే స్పష్టంగా ఉంచడం
  alternative: ‘యేసుకు బదులుగా’ లేదా ‘ఆయన స్థానంలో’ అని విస్తరించడం
  rationale: మూల వాక్యం పిలాతు చేసిన చర్యను, జనుల ఇష్టాన్ని వివరిస్తుంది; ప్రాయశ్చిత్తం లేదా ప్రతినిధిత్వం గురించిన వివరణను ప్రత్యక్షంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. మూలంలోని సజీవమైన ‘చెరసాలలో వేయబడి’ అనే భావాన్ని నిలిపి, అవసరం లేని పాదటిప్పణులను నివారించాం.
