lexical_decisions:
- source_word: ὅστις
  choice: వేయబడినవాడు
  rationale: ఈ సంబంధవాచక సర్వనామం ముందుగా ప్రస్తావించిన బరబ్బాను సూచిస్తోంది. తెలుగు వాక్యనిర్మాణంలో క్రియాంతంలోని ‘వాడు’ ద్వారా ఆ సంబంధం సహజంగా వ్యక్తమవుతుంది.
- source_word: διὰ
  choice: కారణంగాను
  rationale: అక్యూసేటివ్‌తో వచ్చిన διὰ ఇక్కడ కారణాన్ని సూచిస్తుంది. రెండు నేరారోపణలను సమాంతరంగా కలపడానికి ‘కారణంగాను’ ఉపయోగించబడింది.
- source_word: στάσιν τινὰ
  choice: ఒక తిరుగుబాటు[a]
  rationale: στάσις పౌర కల్లోలం, తిరుగుబాటు లేదా రాజకీయ విద్రోహాన్ని సూచించగలదు; ‘తిరుగుబాటు’ ఆధునిక తెలుగులో సహజంగా ఉండి రాజకీయ హింసాత్మక భావాన్ని నిలుపుతుంది. τινά లోని అనిర్దిష్టతను ‘ఒక’ తెలియజేస్తుంది.
- source_word: γενομένην ἐν τῇ πόλει
  choice: పట్టణంలో జరిగిన
  rationale: కృదంతం στάσιν‌ను విశేషిస్తున్నందున తెలుగులో సహజమైన విశేషణ ఉపవాక్యంగా అనువదించబడింది. మూలపాఠం పట్టణాన్ని యెరూషలేము అని స్పష్టంగా పేర్కొననందున ‘పట్టణం’గానే ఉంచబడింది.
- source_word: φόνον
  choice: హత్య
  rationale: φόνος సాధారణంగా చంపడాన్ని మాత్రమే కాక నేరపూరితమైన హత్యను సూచిస్తుంది; న్యాయసంబంధ సందర్భంలో ‘హత్య’ తగిన పదం.
- source_word: βληθεὶς ἐν τῇ φυλακῇ
  choice: చెరసాలలో వేయబడినవాడు
  rationale: βάλλω యొక్క నిష్క్రియ కృదంతంలోని బలాన్ని ‘వేయబడిన’ నిలుపుతుంది; ‘చెరసాలలో’ φυλακή యొక్క నిర్బంధార్థాన్ని సహజ తెలుగులో అందిస్తుంది.
