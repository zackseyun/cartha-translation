id: LUK.23.11
reference: Luke 23:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐξουθενήσας δὲ αὐτὸν ⸀καὶ ὁ Ἡρῴδης σὺν τοῖς στρατεύμασιν αὐτοῦ καὶ ἐμπαίξας ⸀περιβαλὼν ἐσθῆτα λαμπρὰν ἀνέπεμψεν αὐτὸν τῷ Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/011.yaml
  text: But Herod also[a], together with his soldiers, treated him with contempt and mocked him. Dressing him in splendid clothing, he sent him back to Pilate.
translation:
  language: te
  text: అయితే హేరోదు కూడా తన సైనికులతో కలిసి ఆయనను చిన్నచూపు చూసి ఎగతాళి చేశాడు. ఆయనకు వైభవమైన వస్త్రం[a] తొడిగించి, తిరిగి పిలాతు దగ్గరికి పంపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రకాశవంతమైన వస్త్రం.” λαμπράν అనే మాటకు “ప్రకాశవంతమైన,” “వైభవమైన” అనే అర్థాలు ఉండవచ్చు. యేసుకు వ్యంగ్యంగా గౌరవప్రదమైన రూపం కలిగించడం ద్వారా ఆ వస్త్రం హేరోదు చేసిన ఎగతాళిలో భాగమై ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουθενήσας
  choice: చిన్నచూపు చూసి
  rationale: ఎవరినైనా విలువలేనివారిగా ఎంచి అవమానంగా చూడడం లేదా ప్రవర్తించడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: σὺν τοῖς στρατεύμασιν αὐτοῦ
  choice: తన సైనికులతో కలిసి
  rationale: ఈ కథన సందర్భంలో στράτευμα సూచించే సైనిక బృందాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐμπαίξας
  choice: ఎగతాళి చేశాడు
  rationale: అపహాస్యం చేయడం, హేళన చేయడం అనే క్రియార్థాన్ని గౌరవప్రదమైన కథన శైలిలో అందిస్తుంది.
- source_word: περιβαλὼν
  choice: తొడిగించి
  rationale: ఒకరికి వస్త్రం కప్పడం లేదా వేయించడం అనే సందర్భోచిత భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἐσθῆτα λαμπρὰν
  choice: వైభవమైన వస్త్రం
  rationale: ἐσθής యొక్క వస్త్రార్థాన్నీ, λαμπρός యొక్క ప్రకాశవంతమైన లేదా శోభాయమానమైన భావపరిధినీ కాపాడుతుంది; అది రాజవస్త్రమేనని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: ἀνέπεμψεν
  choice: తిరిగి ... పంపించాడు
  rationale: న్యాయవిచారణ సందర్భంలో మునుపటి అధికారియైన పిలాతు వద్దకు తిరిగి పంపిన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: τῷ Πιλάτῳ
  choice: పిలాతు దగ్గరికి
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు రూపంలో ఉంచుతూ గమ్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: వస్త్రం ద్వారా హేరోదు చేసిన ఎగతాళి స్వభావం
  choice: ప్రకాశం లేదా వైభవాన్ని సూచించే వస్త్రంగా అనువదించి, అది ఎగతాళిలో భాగమని సందర్భమే తెలియజేసేలా ఉంచడం
  alternative: దానిని ప్రత్యేకంగా రాజవస్త్రంగా లేదా పిచ్చితనానికి సూచనగా వ్యాఖ్యానించడం
  rationale: గ్రీకు పాఠం ప్రకాశవంతమైన లేదా వైభవమైన వస్త్రం అని మాత్రమే చెబుతుంది. కాబట్టి అవమానకరమైన వ్యంగ్యాన్ని కాపాడుతూ, వస్త్రానికి మరింత నిర్దిష్టమైన ప్రతీకార్థాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, అయినా బాధాకథనానికి తగిన గంభీరమైన కథన శైలి. గ్రీకు కృదంతాల క్రమాన్ని సహజమైన సమన్వయ క్రియలుగా మలిచింది; నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో నిలిపింది.
