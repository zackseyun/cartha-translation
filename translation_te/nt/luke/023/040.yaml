source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἕτερος ⸂ἐπιτιμῶν αὐτῷ ἔφη⸃· Οὐδὲ φοβῇ σὺ τὸν θεόν, ὅτι ἐν τῷ αὐτῷ κρίματι εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/040.yaml
  text: But the other answered[a], rebuking him, “Do you not even fear God, since you are under the same sentence?”
translation:
  language: te
  text: 'అయితే మరొకడు అతనిని గద్దిస్తూ ఇలా జవాబిచ్చాడు: “నువ్వు కూడా దేవునికి భయపడవా? ఎందుకంటే నువ్వూ అదే శిక్షావిధి కింద ఉన్నావు కాబట్టి![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అదే తీర్పు కింద” లేదా “అదే దండన కింద.” గ్రీకు పదం κρίμα తీర్పు, తీర్పు నిర్ణయం, లేదా విధించిన శిక్షను సూచించగలదు; ఇక్కడ వారిద్దరూ పంచుకుంటున్న ఒకే శిక్షాత్మక పరిణామాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἕτερος
  choice: అయితే రెండవవాడు ... ఇలా అన్నాడు
  rationale: δέ సందర్భంలో వ్యత్యాసాన్ని సూచిస్తుంది; ἀποκριθείς మాటకు ప్రతిస్పందించడాన్ని సూచించినా, సహజమైన తెలుగు కథనంలో ‘ఇలా అన్నాడు’ దాని భావాన్ని స్పష్టంగా అందిస్తుంది. ὁ ἕτεροςను ముందున్న నేరస్థునికి భిన్నంగా ‘రెండవవాడు’ అని ఇచ్చాం.
- source_word: ἐπιτιμῶν αὐτῷ
  choice: అతణ్ణి గద్దిస్తూ
  rationale: ἐπιτιμάωలోని తీవ్ర మందలింపు భావాన్ని ఆధునిక సహజ తెలుగులో ‘గద్దిస్తూ’ స్పష్టంగా వ్యక్తం చేస్తుంది; వర్తమాన అసమాపక క్రియ మాట పలికిన తీరును సూచిస్తుంది.
- source_word: Οὐδὲ φοβῇ σὺ τὸν θεόν
  choice: నువ్వు కూడా దేవునికి భయపడవా?
  rationale: οὐδέలోని ‘కూడా ... కాదా’ అనే ఉద్ఘాటనను నిలిపి, φοβέομαι యొక్క ప్రత్యక్ష భావాన్ని ‘భయపడు’గా ఉంచాం. దేవునిపట్ల జవాబుదారీతనాన్ని సూచించే బైబిలీయ ప్రయోగాన్ని ‘గౌరవించు’గా సడలించలేదు.
- source_word: ὅτι
  choice: కదా
  rationale: ఇక్కడ ὅτι గద్దింపుకు కారణాన్ని పరిచయం చేస్తుంది. తెలుగు అలంకార ప్రశ్నలో ‘కదా’ ఆ కారణ సంబంధాన్ని సహజంగా, బలంగా తెలియజేస్తుంది.
- source_word: ἐν τῷ αὐτῷ κρίματι εἶ
  choice: నువ్వూ అదే శిక్షావిధికి లోనయ్యావు
  rationale: κρίμα తీర్పు, దోషనిర్ణయం లేదా విధించిన శిక్షను సూచించగలదు. సిలువశిక్ష సందర్భంలో ‘శిక్షావిధి’ న్యాయపరమైన తీర్పుతో పాటు దాని శిక్షాత్మక ఫలితాన్ని వ్యక్తం చేస్తుంది; ‘లోనయ్యావు’ అనేది ἐν ... εἶను సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: దేవునికి భయపడడం అనే పదబంధ భావం
  choice: ‘దేవునికి భయపడవా?’ అని ప్రత్యక్షంగా అనువదించడం
  alternative: ‘దేవుణ్ణి గౌరవించవా?’ లేదా ‘దేవునిపట్ల భక్తి లేదా?’
  rationale: మూలంలోని φοβῇ పదానికి ఉన్న భయం మరియు భక్తిపూర్వక జవాబుదారీతనం మధ్య ఉద్రిక్తతను నిలిపి, దానిని కేవలం గౌరవంగా లేదా విస్తృత సిద్ధాంత వ్యాఖ్యగా మార్చలేదు.
- issue: κρίμα యొక్క న్యాయపరమైన పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘శిక్షావిధి’
  alternative: ‘తీర్పు’, ‘దోషశిక్ష’
  rationale: ఈ సందర్భంలో ఇద్దరూ పంచుకుంటున్న శిక్షాత్మక తీర్పు ప్రధానంగా కనిపిస్తుంది. అయినప్పటికీ κρίμα యొక్క విస్తృత అర్థపరిధిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. నేరస్థుడు మరొక నేరస్థునితో మాట్లాడుతున్నందున ఏకవచన అనౌపచారిక ‘నువ్వు’ వాడి, గద్దింపు తీవ్రతను నిలిపాం. ప్రధాన పాఠ్యంలోని [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోలుతుంది.
