id: LUK.23.45
reference: Luke 23:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂τοῦ ἡλίου ἐκλιπόντος⸃, ἐσχίσθη ⸀δὲ τὸ καταπέτασμα τοῦ ναοῦ μέσον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/045.yaml
  text: the sun having been darkened[c][b][a], and the curtain of the temple was torn in the middle.
translation:
  language: te
  text: సూర్యుని వెలుగు లేకపోగా[a], దేవాలయపు తెర[b] మధ్యగా చినిగిపోయింది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సూర్యుడు చీకటిపడగా.” “సూర్యగ్రహణం కలుగగా” అని కూడా కొందరు అనువదిస్తారు; అయితే గ్రీకు పదం అంత నిర్దిష్టమైన ఖగోళ వివరణను తప్పనిసరిగా సూచించదు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “దేవాలయపు పరదా.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “మధ్యలో చినిగిపోయింది”; భావానువాదంగా, “రెండుగా చినిగిపోయింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἡλίου ἐκλιπόντος
  choice: సూర్యుని వెలుగు లేకపోగా
  rationale: ἐκλείπω అనే క్రియలోని ‘లోపించడం, నిలిచిపోవడం’ అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. ఖగోళపరమైన గ్రహణాన్ని నిర్దిష్టంగా చెప్పకుండా, సందర్భంలో కలిగిన చీకటిని వ్యక్తం చేస్తుంది; జనిటివ్ అబ్సల్యూట్ నిర్మాణంలోని సందర్భార్థాన్ని ‘-పోగా’ రూపం నిలుపుతుంది.
- source_word: ἐσχίσθη
  choice: చినిగిపోయింది
  rationale: వస్త్రంతో చేసిన తెర చీలడాన్ని సూచించడానికి సహజమైన తెలుగు నిష్క్రియార్థక రూపం.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ ఇక్కడ స్వల్ప అనుసంధానాన్ని ఇస్తుంది. తెలుగులో ముందున్న ‘-పోగా’ నిర్మాణమే రెండు సంఘటనలను సహజంగా అనుసంధానిస్తుంది; అదనంగా ‘మరియు’ చేర్చడం భారంగా ఉంటుంది.
- source_word: τὸ καταπέτασμα
  choice: తెర
  rationale: ఆలయంలో విభజనగా వేలాడే వస్త్రాన్ని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేసే సాధారణ పదం. సంప్రదాయ ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: τοῦ ναοῦ
  choice: దేవాలయపు
  rationale: ναός ఇక్కడ దేవాలయ ప్రాంగణం మొత్తంకంటే పవిత్రస్థలాన్ని సూచించగలిగినా, ఈ పదబంధంలో ‘దేవాలయం’ సహజంగా, సులభంగా అర్థమవుతుంది.
- source_word: μέσον
  choice: మధ్యగా
  rationale: చీలిక తెర మధ్య భాగం గుండా ఏర్పడిందనే స్థాన/విధాన భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; ‘రెండు ముక్కలుగా’ అని ఫలితాన్ని మించి నిర్దిష్టం చేయదు.
theological_decisions:
- issue: సూర్యునికి సంబంధించి ἐκλιπόντος అర్థం
  choice: సూర్యుని వెలుగు లేకపోగా
  alternative: సూర్యుడు చీకటిపడగా; సూర్యగ్రహణం కలుగగా
  rationale: మూల క్రియ సూర్యుని వెలుగు నిలిచిపోవడం లేదా విఫలమవడం అనే భావాన్ని ఇస్తుంది; అది సాంకేతికంగా సూర్యగ్రహణమే అని తప్పనిసరిగా నిర్ధారించదు. అందువల్ల సంఘటనను తెలియజేస్తూ దాని ఖగోళ కారణాన్ని అనువాదం నిర్ణయించదు.
- issue: καταπέτασμα పదానికి అనువాదం
  choice: తెర
  alternative: పరదా
  rationale: ఆలయంలోని విభజక వస్త్రాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది; సంఘటనకు ఉన్న ధార్మిక ప్రాముఖ్యతను అనువాదంలో అదనంగా వివరించకుండా మూలపాఠానికే పరిమితం అవుతుంది.
- issue: μέσον వల్ల చీలిక స్వరూపం
  choice: మధ్యగా చినిగిపోయింది
  alternative: మధ్యలో చినిగిపోయింది; రెండుగా చినిగిపోయింది
  rationale: మూలపాఠం చీలిక మధ్య భాగంలో లేదా మధ్య గుండా జరిగిందని చెబుతుంది. ‘రెండుగా’ అనేది సంభావ్య ఫలితమే గాని μέσον పదానికి అక్షరార్థం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కాని సరళమైన శైలి వాడబడింది. ‘-పోగా’ రూపం మూలంలోని సంక్షిప్త సందర్భ నిర్మాణాన్ని సహజంగా నిలుపుతుంది. సూర్యగ్రహణం అనే సాంకేతిక వివరణను ప్రధాన పాఠంలో ప్రవేశపెట్టలేదు.
