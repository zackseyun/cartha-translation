id: LUK.23.38
reference: Luke 23:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἦν δὲ καὶ ⸀ἐπιγραφὴ ἐπ’ ⸀αὐτῷ· Ὁ βασιλεὺς τῶν Ἰουδαίων ⸀οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/038.yaml
  text: 'And there was also an inscription over him: “This is the King of the Jews.”[a][b][c][d]'
translation:
  language: te
  text: 'ఆయన పైన ఒక శాసనం[a] కూడా ఉంది[b]: “ఈయనే యూదుల రాజు.”[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “లిఖిత ప్రకటన,” “సూచిక,” లేదా “రాతపూర్వక నేరారోపణ.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఆయనకు పైగా.”
    reason: lexical_alternative
  - marker: c
    text: గ్రీకు అక్షరార్థంగా, “యూదుల రాజు—ఈయన.”
    reason: lexical_alternative
  - marker: d
    text: “యూదులు” అనే పదాన్ని కొన్ని సందర్భాల్లో “యూదయవాసులు” అని అనువదించవచ్చు; అయితే సిలువపై ఉన్న ఈ స్థిరమైన బిరుదులో “యూదులు” అనేదే సంప్రదాయబద్ధమైన, సందర్భోచితమైన అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  choice: శాసనం
  rationale: సిలువపై ఉంచిన లిఖిత ప్రకటనను సూచిస్తుంది. ‘శాసనం’ అనేది లిఖిత రూపాన్ని నిలుపుతూ, దానిని ప్రధాన పాఠంలోనే న్యాయపరమైన ‘నేరారోపణ’గా నిర్ణయించదు.
- source_word: ἐπ’ αὐτῷ
  choice: ఆయన పైన
  rationale: సిలువ సందర్భంలో యేసుకు పైభాగంలో ఆ లిఖిత శాసనం ఉన్న స్థానాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων οὗτος
  choice: ఈయనే యూదుల రాజు
  rationale: గ్రీకులో క్రియ లేని వాక్య నిర్మాణం ఉంది; οὗτος ఇచ్చే సూచనాత్మక ఉద్ఘాటనను ‘ఈయనే’ సహజంగా నిలుపుతుంది.
- source_word: Ἰουδαίων
  choice: యూదుల
  rationale: సిలువపై ఉన్న స్థిరమైన రాజబిరుదు సందర్భంలో ‘యూదుల రాజు’ సంప్రదాయబద్ధంగాను సందర్భోచితంగాను ఉంది; కొన్ని ఇతర సందర్భాల్లో సాధ్యమైన ‘యూదయవాసులు’ అనే ప్రాంతీయ అర్థాన్ని ఇక్కడ ప్రధాన పాఠంలో తీసుకోలేదు.
- source_word: δὲ καὶ
  choice: కూడా ఉంది
  rationale: కథనంలో మరొక వివరాన్ని చేర్చే సంధానాత్మక, సంకలనాత్మక భావాన్ని సహజమైన తెలుగు పదక్రమంలో తెలియజేస్తుంది.
theological_decisions:
- issue: సిలువపై ఉంచిన వాక్య స్వభావం
  choice: దానిని ‘శాసనం’గా పేర్కొని, యేసును ‘యూదుల రాజు’గా గుర్తించే మాటలను ఉన్నట్లుగా అందించడం
  alternative: దానిని స్పష్టంగా న్యాయపరమైన నేరారోపణగా అనువదించడం లేదా వ్యంగ్య/రాజకీయ ఉద్దేశాన్ని పాఠంలోనే వివరించడం
  rationale: ఈ వచనం శాసనం ఉనికిని, దాని మాటలను మాత్రమే నివేదిస్తుంది. వ్యంగ్యం, నేరారోపణ లేదా మెస్సీయ ఒప్పుకోలు అనే వ్యాఖ్యానాన్ని అనువాదంలో చేర్చకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ‘ఈయనే’ ద్వారా మూలంలోని సూచనాత్మక ఉద్ఘాటన నిలుపబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
