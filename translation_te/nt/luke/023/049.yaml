source:
  edition: SBLGNT
  text: εἱστήκεισαν δὲ πάντες οἱ γνωστοὶ ⸀αὐτῷ ⸀μακρόθεν, καὶ γυναῖκες αἱ ⸀συνακολουθοῦσαι αὐτῷ ἀπὸ τῆς Γαλιλαίας, ὁρῶσαι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/049.yaml
  text: But all those who knew him[a], and the women who had followed him from Galilee, were standing at a distance, watching these things.
translation:
  language: te
  text: అయితే, ఆయన పరిచయస్థులందరూ[a], గలిలయ నుండి ఆయనను అనుసరిస్తూ వచ్చిన స్త్రీలూ దూరంగా నిలబడి, ఇవన్నీ చూస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనను తెలిసినవారందరూ.” గ్రీకు పదం ఆయన పరిచయస్థులను లేదా సహచరులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: నిలబడి ... ఉన్నారు
  rationale: ఈ క్రియలోని కొనసాగుతున్న స్థితిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వాక్యం నుండి పరిశీలకుల వైపు జరిగే స్వల్ప వ్యత్యాసాన్ని లేదా మార్పును సూచిస్తుంది.
- source_word: πάντες οἱ γνωστοὶ αὐτῷ
  choice: ఆయనకు తెలిసినవారందరూ
  rationale: γνωστοί అనే పదం సన్నిహిత మిత్రులకే పరిమితం కాకుండా ఆయనకు పరిచయమున్నవారిని సూచించగలదు; ఈ అనువాదం ఆ విస్తృతిని నిలుపుతుంది.
- source_word: μακρόθεν
  choice: దూరంగా
  rationale: స్థలపరమైన దూరాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: γυναῖκες αἱ συνακολουθοῦσαι αὐτῷ ἀπὸ τῆς Γαλιλαίας
  choice: గలిలయ నుండి ఆయనను అనుసరించిన స్త్రీలు
  rationale: ఇది కథనంలో ఇప్పటికే గుర్తింపబడిన నిర్దిష్ట స్త్రీల సమూహాన్ని, గలిలయ నుండి యేసుతో వారి కొనసాగిన అనుబంధాన్ని తెలియజేస్తుంది.
- source_word: ὁρῶσαι ταῦτα
  choice: ఇవన్నీ చూస్తూ
  rationale: వారు ఆ సంఘటనలను కొనసాగిస్తూ గమనించారనే భావాన్ని, ταῦτα యొక్క బహువచన పరిధిని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని కొనసాగుతున్న దృశ్యభావం కోసం “నిలబడి ... చూస్తూ ఉన్నారు” అనే నిర్మాణం వాడబడింది; γνωστοί లోని అర్థవిస్తృతిని ప్రధాన పాఠం మరియు పాదటిప్పణి కలిసి కాపాడుతున్నాయి.
