revisions:
- from: అయితే ఆయనకు తెలిసినవారందరూ[a], గలిలయ నుండి ఆయనను అనుసరించిన స్త్రీలు దూరంగా నిలబడి, ఇవన్నీ చూస్తూ ఉన్నారు.
  to: అయితే, ఆయన పరిచయస్థులందరూ[a], గలిలయ నుండి ఆయనను అనుసరిస్తూ వచ్చిన స్త్రీలూ దూరంగా నిలబడి, ఇవన్నీ చూస్తూ ఉన్నారు.
  rationale: The revision corrects the Telugu relational ambiguity in the rendering of γνωστοί αὐτῷ. It also uses “స్త్రీలూ” to make explicit that the women form a second coordinated group with the acquaintances, while preserving the continuing visual scene and the broad lexical range in the footnote.
