  edition: SBLGNT
  text: καὶ ἡμέρα ἦν ⸂παρασκευῆς, καὶ⸃ σάββατον ἐπέφωσκεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/054.yaml
  text: And it was the day of Preparation[a], and the Sabbath was dawning.
translation:
  language: te
  text: అది సిద్ధపాటు దినం, విశ్రాంతి దినం మొదలవుతోంది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “విశ్రాంతి దినం తెల్లవారుతూ ఉంది” అని కూడా అనువదించవచ్చు. గ్రీకు క్రియకు “తెల్లవారడం” లేదా “మొదలవడం” అనే అర్థాలు ఉండవచ్చు; ఇక్కడ అది సాయంత్రం ప్రారంభమవుతున్న విశ్రాంతి దినాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρασκευῆς
  choice: సిద్ధపాటు దినం
  rationale: యూదుల వాడుకలో ఇది విశ్రాంతి దినానికి ముందు సిద్ధపడే దినాన్ని సూచిస్తుంది. ‘శుక్రవారం’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా, గ్రీకు పదంలోని సిద్ధపాటు భావాన్ని నిలిపింది.
- source_word: σάββατον
  choice: విశ్రాంతి దినం
  rationale: సందర్భంలో ఇది వారపు సబ్బాతును స్పష్టంగా సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు సహజంగా అర్థమయ్యే స్థిరమైన బైబిలు పదబంధాన్ని వాడింది.
- source_word: ἐπέφωσκεν
  choice: మొదలవుతూ ఉంది
  rationale: ఈ క్రియకు ‘తెల్లవారడం’ లేదా ‘మొదలవడం’ అనే భావాలు ఉండవచ్చు. ఇక్కడ సాయంత్రంతో విశ్రాంతి దినం ఆరంభమవుతున్న సందర్భం కాబట్టి, ఉదయం అని అపార్థం రాకుండా సందర్భార్థాన్ని తెలిపింది; మరింత పదానుసారమైన భావాన్ని పాదసూచికలో నిలిపింది.
- source_word: ἡμέρα ἦν παρασκευῆς
  choice: అది సిద్ధపాటు దినం
  rationale: గ్రీకు వాక్య నిర్మాణంలోని భావాన్ని సహజమైన, సంక్షిప్తమైన ఆధునిక తెలుగులో అందించింది.
- source_word: καὶ
  choice: ;
  rationale: రెండు సమన్విత వాక్యభాగాల సంబంధాన్ని తెలుగులో సహజంగా చూపేందుకు రెండవ καὶ స్థానంలో విరామచిహ్నాన్ని వాడింది; భావసంబంధాన్ని మార్చలేదు.
theological_decisions:
- issue: విశ్రాంతి దినం ఆరంభానికి సంబంధించి ἐπέφωσκεν అర్థం
  choice: సాయంత్ర సమయంలో విశ్రాంతి దినం మొదలవుతూ ఉందని ప్రధాన పాఠంలో తెలిపింది.
  alternative: “విశ్రాంతి దినం తెల్లవారుతూ ఉంది” అనే మరింత పదానుసార అనువాదం.
  rationale: యూదుల దినగణన ప్రకారం విశ్రాంతి దినం సాయంత్రం మొదలవుతుంది; సమాధి సందర్భం కూడా అదే సూచిస్తుంది. అయినప్పటికీ గ్రీకు క్రియలోని ‘తెల్లవారడం’ భావాన్ని పాదసూచికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘సిద్ధపాటు దినం’ మరియు ‘విశ్రాంతి దినం’ అనే పదబంధాలు మూలంలోని యూదుల కాలగణన నేపథ్యాన్ని నిలుపుతాయి.
