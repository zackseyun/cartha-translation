  source_fidelity: The Telugu accurately represents the Greek participial action (στραφεὶς πρὸς αὐτάς), Jesus’ address, the present prohibitions/commands, and the corrective force of πλήν. ‘నా కోసం’ and ‘మీ కోసం’ appropriately maintain the parallel ἐπ’ ἐμέ / ἐφ’ ἑαυτάς without adding interpretive detail.
  naturalness: The phrasing is fluent modern standard Telugu. ‘యేసు వారి వైపు తిరిగి’ naturally connects the participle to the following speech, and the plural imperative forms ‘ఏడవకండి/ఏడవండి’ suit the direct address.
  terminology: ‘యెరూషలేము కుమార్తెలారా’ appropriately preserves the literal, prophetic-style vocative Θυγατέρες Ἰερουσαλήμ. The alternative ‘యెరూషలేము స్త్రీలారా’ is properly supplied in the footnote. ‘పిల్లలు’ is an idiomatic and accurate rendering of τέκνα.
