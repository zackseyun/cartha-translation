id: LUK.23.28
reference: Luke 23:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: στραφεὶς δὲ πρὸς αὐτὰς ⸀ὁ Ἰησοῦς εἶπεν· Θυγατέρες Ἰερουσαλήμ, μὴ κλαίετε ἐπ’ ἐμέ· πλὴν ἐφ’ ἑαυτὰς κλαίετε καὶ ἐπὶ τὰ τέκνα ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/028.yaml
  text: But turning toward them[a], Jesus said, “Daughters of Jerusalem, do not weep for me; instead, weep for yourselves and for your children,”
translation:
  language: te
  text: అయితే యేసు వారి వైపు తిరిగి, “యెరూషలేము కుమార్తెలారా,[a] నా కోసం ఏడవకండి; బదులుగా మీ కోసం, మీ పిల్లల కోసం ఏడవండి” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యెరూషలేము స్త్రీలారా.” గ్రీకు మూలంలో అక్షరార్థంగా “యెరూషలేము కుమార్తెలారా” అని ఉంది; ప్రవచన శైలిలోని ఆ సంబోధనను ప్రధాన పాఠ్యంలో ఉంచాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς δὲ πρὸς αὐτὰς
  choice: అయితే ... వారి వైపు తిరిగి
  rationale: στραφεὶς అనే భూతకాల క్రియావిశేషణం యేసు స్త్రీల వైపు శరీరంగా తిరిగిన చర్యను సూచిస్తుంది; δέ స్వల్ప కథన మార్పు లేదా వ్యత్యాసాన్ని చూపుతుంది. సహజమైన తెలుగు వాక్యక్రమంలో రెండింటినీ నిలుపుతుంది.
- source_word: Θυγατέρες Ἰερουσαλήμ
  choice: యెరూషలేము కుమార్తెలారా
  rationale: మూలంలోని సంబోధనను అక్షరార్థానికి దగ్గరగా ఉంచి, ప్రవచన గ్రంథాల శైలిని మరియు సామూహిక అనుబంధాన్ని కాపాడుతుంది.
- source_word: μὴ κλαίετε ἐπ’ ἐμέ
  choice: నా కోసం ఏడవకండి
  rationale: వర్తమాన నిషేధ ఆజ్ఞను దాని కొనసాగుతున్న చర్యను తప్పనిసరిగా నిర్ధారించకుండా సహజంగా తెలుపుతుంది; ἐπί సూచించే శోక లక్ష్యాన్ని ‘కోసం’ వ్యక్తపరుస్తుంది.
- source_word: πλὴν ἐφ’ ἑαυτὰς κλαίετε
  choice: బదులుగా మీ కోసం ... ఏడవండి
  rationale: πλήν ఇక్కడ ‘నా కోసం కాదు, మీ కోసం’ అనే సరిదిద్దే వ్యత్యాసాన్ని చూపుతుంది; ప్రతిబింబ సర్వనామ భావాన్ని ‘మీ కోసం’ నిలుపుతుంది.
- source_word: τὰ τέκνα ὑμῶν
  choice: మీ పిల్లల కోసం
  rationale: τέκνα కుటుంబ సంబంధంలోని సంతానాన్ని సూచిస్తుంది; ‘పిల్లలు’ ఆధునిక సాధారణ తెలుగులో స్పష్టమైన సమానార్థకం.
theological_decisions:
- issue: Θυγατέρες Ἰερουσαλήμ అనే సంబోధన
  choice: యెరూషలేము కుమార్తెలారా
  alternative: యెరూషలేము స్త్రీలారా
  rationale: ‘కుమార్తెలు’ అనే మూల రూపం ప్రవచనాత్మక, లేఖన సంబంధ ప్రతిధ్వనిని కలిగి ఉంది. దానిని ప్రధాన పాఠ్యంలో ఉంచడం అదనపు సిద్ధాంతార్థాన్ని చేర్చకుండా ఆ అంతర్పాఠ్య బరువును కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఏడవకండి/ఏడవండి’ రూపాలు బహువచన సంబోధనకు తగిన మర్యాదను కలిగి ఉన్నాయి; మూలంలోని ఆజ్ఞాత్మక వ్యత్యాసం మరియు సమాంతర నిర్మాణం స్పష్టంగా నిలిచాయి.
