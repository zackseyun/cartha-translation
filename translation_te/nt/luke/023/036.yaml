  terminology: “ఎగతాళి చేశారు,” “సైనికులు,” and the respectful reference “ఆయన” are suitable. “పుల్లని ద్రాక్షారసం” is preferable for ὄξος. The footnote retains “వెనిగర్” as a legitimate traditional lexical alternative while clarifying the drink sense.
  issues:
