base_translation:
  language: en
  yaml_path: translation/nt/luke/023/036.yaml
  text: The soldiers also mocked him[a], coming up and offering him sour wine,
translation:
  language: te
  text: సైనికులు కూడా ఆయన దగ్గరకు వచ్చి, ఆయనకు పుల్లని ద్రాక్షారసం[a] అందిస్తూ ఆయనను ఎగతాళి చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వెనిగర్.” గ్రీకు పదమైన ὄξος పుల్లని ద్రాక్షారసాన్ని సూచిస్తుంది; అది సాధారణంగా తాగే చౌక పానీయం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: ఎగతాళి చేశారు
  rationale: ἐμπαίζω ఇక్కడ శత్రుభావంతో అవహేళన చేయడాన్ని సూచిస్తుంది. “ఎగతాళి చేశారు” ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, ఆ చర్యలోని తిరస్కార భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: δὲ … καὶ
  choice: కూడా
  rationale: δέ కథనాన్ని కొనసాగిస్తుండగా, విషయంతో ఉన్న καί సైనికులు కూడా ఎగతాళిలో చేరారని సూచిస్తుంది. ఈ సంయుక్త భావాన్ని తెలుగులో “కూడా” సహజంగా వ్యక్తపరుస్తుంది.
- source_word: αὐτῷ
  choice: ఆయనను / ఆయనకు
  rationale: రెండు సందర్భాల్లోనూ ఇది యేసును సూచిస్తుంది. తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా మొదట కర్మార్థంలో “ఆయనను,” తరువాత సంప్రదానార్థంలో “ఆయనకు” అని అనువదించబడింది.
- source_word: οἱ στρατιῶται
  choice: సైనికులు
  rationale: στρατιῶται సైనికులను సూచించే సాధారణ పదం. “సైనికులు” సందర్భానికి తగిన స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: προσερχόμενοι
  choice: దగ్గరికి వచ్చి
  rationale: ఈ వర్తమాన కృదంతం వారు యేసును సమీపించడాన్ని తెలియజేస్తుంది. “దగ్గరికి వచ్చి” తెలుగులో సహజంగా కథన చర్యను నిలుపుతుంది.
- source_word: ὄξος
  choice: పులిసిన ద్రాక్షారసం
  rationale: ὄξος అనేది సాధారణంగా సేవించే పుల్లబడిన లేదా పులిసిన చౌక ద్రాక్షారస పానీయాన్ని సూచిస్తుంది. “పులిసిన ద్రాక్షారసం” ఆధునిక పాఠకులు దీనిని కేవలం వంటలో వాడే వెనిగర్‌గా అపార్థం చేసుకోకుండా మూలార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: προσφέροντες
  choice: అందిస్తూ
  rationale: ఈ కృదంతం వారు ఆ పానీయాన్ని ఆయనకు ఇవ్వజూపుతున్న చర్యను సూచిస్తుంది. “అందిస్తూ” ఆ కొనసాగుతున్న చర్యను సహజంగా వ్యక్తపరుస్తుంది; వారి ఉద్దేశాన్ని అదనంగా నిర్ధారించదు.
theological_decisions:
- issue: ὄξος అందించిన సైనికుల చర్య స్వభావం
  choice: ఎగతాళి సందర్భంలో జరిగిన చర్యగా తటస్థంగా అనువదించడం
  alternative: దీనిని చిన్న కనికర చర్యగా లేదా పూర్తిగా హింసాత్మకమైన వెక్కిరింపుగా స్పష్టీకరించడం
  rationale: సమీప సందర్భం సైనికుల ప్రవర్తనను ఎగతాళిగా చూపుతున్నా, ఈ పానీయం అందించడంలోని ప్రత్యేక ఉద్దేశాన్ని వాక్యం స్వయంగా వివరించదు. అందువల్ల అనువాదం చర్యను యథాతథంగా ఉంచి, దాని స్వరాన్ని సందర్భమే తెలియజేయనిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. కృదంతాల సంబంధాన్ని తెలుగులో సులభంగా గ్రహించేందుకు “దగ్గరికి వచ్చి … అందిస్తూ” అనే నిర్మాణం వాడబడింది. “ఆయన” అనే గౌరవ సూచక సర్వనామం సాధారణ తెలుగు బైబిల్ వాడుకకు అనుగుణంగా ఉంది.
