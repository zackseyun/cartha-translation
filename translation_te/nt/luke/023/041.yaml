source:
  edition: SBLGNT
  text: καὶ ἡμεῖς μὲν δικαίως, ἄξια γὰρ ὧν ἐπράξαμεν ἀπολαμβάνομεν· οὗτος δὲ οὐδὲν ἄτοπον ἔπραξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/041.yaml
  text: And we indeed justly[a], for we are receiving what our deeds deserve[b]; but this man has done nothing wrong.
translation:
  language: te
  text: మనమైతే న్యాయంగా శిక్ష అనుభవిస్తున్నాం[a], ఎందుకంటే మనం చేసిన పనులకు తగినదాన్ని పొందుతున్నాం. కానీ ఈయన ఏ తప్పూ చేయలేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సరిగ్గానే.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఈయన తగనిదేదీ చేయలేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαίως
  choice: న్యాయంగానే
  rationale: వారు అనుభవిస్తున్న శిక్ష న్యాయమైనదీ, తాము చేసినదానికి తగినదీ అని చెప్పే న్యాయపరమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἄξια
  choice: తగిన ప్రతిఫలాన్ని
  rationale: ἄξια మరియు ἀπολαμβάνομεν కలిపి, గత క్రియలకు తగిన పరిణామాన్ని పొందుతున్నారనే భావాన్ని వ్యక్తం చేస్తాయి. ‘ప్రతిఫలం’ ఇక్కడ మంచికైనా చెడుకైనా క్రియకు తిరిగి లభించేదనే తటస్థ భావంలో వాడబడింది.
- source_word: ὧν ἐπράξαμεν
  choice: మనం చేసిన వాటికి
  rationale: మూలంలోని సంబంధవాచక నిర్మాణాన్ని సహజంగా ఉంచుతూ, శిక్షకు ఆధారమైన వారి గత కార్యాలను స్పష్టంగా సూచిస్తుంది.
- source_word: ἀπολαμβάνομεν
  choice: పొందుతున్నాం
  rationale: వర్తమాన కాలంలోని కొనసాగుతున్న అనుభవాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: οὗτος
  choice: ఈయన
  rationale: యేసును ప్రత్యక్షంగా సూచించే గౌరవప్రదమైన తెలుగు నిర్దేశక సర్వనామం; మూలంలోని ‘ఈ వ్యక్తి/ఈయన’ అనే వ్యత్యాస బలాన్ని నిలుపుతుంది.
- source_word: οὐδὲν ἄτοπον
  choice: ఏ తప్పూ
  rationale: ἄτοπον యొక్క ‘తగనిది, సరికానిది, తప్పైనది’ అనే విస్తృత భావాన్ని స్పష్టంగా అందిస్తుంది; ‘నేరం’ అని అనువదించి న్యాయపరమైన అర్థాన్ని అతిగా సంకుచితం చేయదు.
- source_word: ἔπραξεν
  choice: చేయలేదు
  rationale: గతంలో చేసిన కార్యాన్ని సహజమైన తెలుగు భూతకాల రూపంలో తెలియజేస్తుంది; ‘ఏ తప్పూ’తో సులభంగా, స్పష్టంగా కలుస్తుంది.
theological_decisions:
- issue: యేసు నిర్దోషిత్వం గురించి నేరస్థుడు ఇచ్చిన సాక్ష్యం
  choice: కానీ ఈయన ఏ తప్పూ చేయలేదు
  alternative: కానీ ఈయన తగనిదేదీ చేయలేదు
  rationale: తక్షణ సందర్భంలో యేసు తప్పు చేయలేదనే మానవ సాక్ష్యాన్ని స్పష్టంగా నిలుపుతుంది; వాక్యంలో ప్రత్యక్షంగా లేని విస్తృత సిద్ధాంత నిర్ధారణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన సంభాషణ శైలి వాడబడింది. ‘న్యాయంగానే’ మరియు ‘తగిన ప్రతిఫలం’ మూలంలోని న్యాయం–తగిన పరిణామం సంబంధాన్ని నిలుపుతాయి. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో చేర్చబడింది.
