source:
  edition: SBLGNT
  text: Πιλᾶτος δὲ ⸀ἀκούσας ἐπηρώτησεν εἰ ὁ ἄνθρωπος Γαλιλαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/006.yaml
  text: But Pilate[a], hearing this, asked whether the man was a Galilean,
translation:
  language: te
  text: అయితే పిలాతు అది విని, ఆ మనిషి గలిలయుడా అని అడిగాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: పిలాతు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: δὲ
  choice: అయితే
  rationale: కథనంలో స్వల్ప మలుపును సూచించే సహజమైన తెలుగు అనుసంధానం.
- source_word: ἀκούσας
  choice: అది విని
  rationale: పూర్వ సందర్భంలో చెప్పబడిన విషయాన్ని విన్నాడనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘అది’ సందర్భం నుంచి సరఫరా చేయబడింది.
- source_word: ἐπηρώτησεν
  choice: అడిగాడు
  rationale: ప్రశ్నించడం అనే మూలార్థానికి సరళమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: εἰ
  choice: …ఆ అని
  rationale: పరోక్ష అవును-కాదు ప్రశ్నను తెలుగులో సహజంగా నిర్మిస్తుంది.
- source_word: ὁ ἄνθρωπος
  choice: ఆ మనిషి
  rationale: నిర్దిష్టంగా ప్రస్తావించబడుతున్న వ్యక్తిని సూచిస్తూ, యేసు అనే పేరును మూలంలో లేనందున చేర్చదు.
- source_word: Γαλιλαῖός
  choice: గలిలయుడు
  rationale: గలిలయ ప్రాంతానికి చెందిన వ్యక్తి అనే ప్రాంతీయ గుర్తింపును సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἐστιν
  choice: గలిలయుడా
  rationale: గ్రీకు వర్తమాన క్రియ భావం తెలుగులో నామవాచక విధేయంతో కూడిన పరోక్ష ప్రశ్నలో ప్రత్యేక సహాయక క్రియ లేకుండానే సహజంగా వ్యక్తమవుతుంది.
theological_decisions: []
translation_notes:
  register: సాధారణ ఆధునిక పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని పరోక్ష ప్రశ్నను సహజ తెలుగు పదక్రమంలో అందించింది.
