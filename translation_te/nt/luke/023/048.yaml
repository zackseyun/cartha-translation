    reason: cultural_note
  revision_rationale: The revision changes only the historical-aspectual expression of the final verb and adds the natural possessive to the chest-beating idiom. It preserves the source text’s ambiguity about the crowd’s inner response and retains both existing footnote anchors and their content.
