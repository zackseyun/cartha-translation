id: LUK.23.48
reference: Luke 23:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ συμπαραγενόμενοι ὄχλοι ἐπὶ τὴν θεωρίαν ταύτην, ⸀θεωρήσαντες τὰ γενόμενα, ⸀τύπτοντες τὰ στήθη ὑπέστρεφον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/048.yaml
  text: And all the crowds that had gathered for this spectacle[a], after seeing what had happened, were returning[b], beating their chests.
translation:
  language: te
  text: ఈ దృశ్యాన్ని చూడడానికి[a] కూడివచ్చిన జనసమూహాలన్నీ జరిగినవాటిని చూసి, తమ రొమ్ములు బాదుకుంటూ తిరిగి వెళ్తూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ బహిరంగ దృశ్యం కోసం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συμπαραγενόμενοι
  choice: కూడివచ్చిన
  rationale: ప్రజలు ఆ స్థలానికి కలిసి వచ్చారనే సమూహ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὄχλοι
  choice: జనసమూహాలన్నీ
  rationale: గ్రీకు బహువచనాన్ని నిలుపుతూ, πάντες అనే సమగ్ర భావాన్ని కూడా స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ τὴν θεωρίαν ταύτην
  choice: ఈ దృశ్యాన్ని చూడడానికి
  rationale: θεωρίαలోని బహిరంగంగా చూడదగిన దృశ్యం అనే భావాన్ని సందర్భానుకూలంగా, సహజంగా అందిస్తుంది; వినోదాత్మక భావం కలిగించగల ‘ప్రదర్శన’ను ప్రధాన పాఠ్యంలో నివారించింది.
- source_word: θεωρήσαντες
  choice: చూసి
  rationale: ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సంక్షిప్తమైన సహజ తెలుగు క్రియారూపంతో చూపిస్తుంది.
- source_word: τὰ γενόμενα
  choice: జరిగినవాటిని
  rationale: జరిగిన సంఘటనలన్నిటినీ సూచించే గ్రీకు పదబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τύπτοντες τὰ στήθη
  choice: రొమ్ములు బాదుకుంటూ
  rationale: శోకం, దిగ్భ్రాంతి లేదా విలాపాన్ని సూచించే శారీరక చర్యను వ్యాఖ్యానించకుండా ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: ὑπέστρεφον
  choice: తిరిగి వెళ్తున్నారు
  rationale: గ్రీకు అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న దృశ్యభావాన్ని తెలుగులో సాధ్యమైనంతవరకు నిలుపుతుంది.
theological_decisions:
- issue: జనసమూహాల ప్రతిస్పందనలోని భావోద్వేగ, ఆధ్యాత్మిక అర్థం
  choice: ‘రొమ్ములు బాదుకుంటూ’ అనే శారీరక చర్యను మాత్రమే పేర్కొనడం
  alternative: వారు పశ్చాత్తాపపడుతున్నారని లేదా కేవలం భయంతో, దిగ్భ్రాంతితో ఉన్నారని స్పష్టీకరించడం
  rationale: గ్రీకు పాఠ్యం వారి అంతరంగ స్థితిని నిర్దిష్టంగా వ్యాఖ్యానించదు. అందువల్ల పశ్చాత్తాపం, అపరాధభావం, శోకం లేదా దిగ్భ్రాంతి అనే అవకాశాల్లో ఏదో ఒకదాన్ని అనవసరంగా నిర్ణయించకుండా అసలు ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్య నిర్మాణం వాడబడింది. ‘ప్రదర్శన’ అనే పదం కలిగించగల వినోద భావాన్ని నివారించి, ‘దృశ్యం’ను ఎంచుకుంది. క్రియలో కొనసాగుతున్న నేపథ్య చర్యను చూపేందుకు ‘తిరిగి వెళ్తున్నారు’ వాడబడింది.
