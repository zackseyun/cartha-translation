id: LUK.23.22
reference: Luke 23:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ τρίτον εἶπεν πρὸς αὐτούς· Τί γὰρ κακὸν ἐποίησεν οὗτος; οὐδὲν αἴτιον θανάτου εὗρον ἐν αὐτῷ· παιδεύσας οὖν αὐτὸν ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/022.yaml
  text: And he said to them a third time[a], “Why? What evil has this man done? I have found in him no grounds for death. Therefore, after disciplining him[c][b], I will release him.”
translation:
  language: te
  text: 'అతడు మూడోసారి వారితో ఇలా అన్నాడు: “ఎందుకు? ఇతడు ఏ చెడు చేశాడు?[a] ఇతనిలో మరణశిక్షకు తగినదేదీ నేను కనుగొనలేదు.[b] కాబట్టి ఇతన్ని శిక్షించి[c] విడుదల చేస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇతడు ఏ చెడు చేశాడని?” ప్రారంభంలోని Τί సంక్షిప్త అభ్యంతర ప్రశ్నగా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మరణానికి కారణమేదీ,” “మరణానికి పాత్రమైనదేదీ,” లేదా “మరణదండన విధించడానికి ఆధారమేదీ.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “దండించి”; మరింత నిర్దిష్టంగా, “కొరడాలతో కొట్టించి” అని కూడా భావించవచ్చు. గ్రీకు παιδεύσας శిక్షాత్మక చర్యను సూచిస్తుంది, కాని ఈ పదం ఒక్కటే దాని ఖచ్చితమైన రూపాన్ని పేర్కొనదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τρίτον
  choice: మూడోసారి
  rationale: పునరావృతిని సూచించే క్రియావిశేషణ ప్రయోగం; కథనంలోని ‘మూడోసారి’ అనే ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: Τί γὰρ κακὸν ἐποίησεν οὗτος;
  choice: ఎందుకు? ఇతడు చేసిన చెడు ఏమిటి?
  rationale: Τί అనే సంక్షిప్త అభ్యంతర ప్రశ్నను ‘ఎందుకు?’గా, దాని వెంట వచ్చే పూర్తి ప్రశ్నను వేరుగా ఉంచడం గ్రీకు సంభాషణ ప్రవాహాన్ని ప్రతిబింబిస్తుంది; κακόν యొక్క నైతిక బలాన్ని ‘చెడు’ నిలుపుతుంది.
- source_word: οὐδὲν αἴτιον θανάτου
  choice: మరణశిక్షకు తగిన నేరమేదీ
  rationale: న్యాయ సందర్భంలో αἴτιον కారణం, అభియోగం లేదా శిక్షకు ఆధారాన్ని సూచిస్తుంది. ‘మరణశిక్షకు తగిన నేరం’ తెలుగు పాఠకునికి న్యాయపరమైన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: εὗρον ἐν αὐτῷ
  choice: ఇతనిలో నాకు కనిపించలేదు
  rationale: εὗρον యొక్క నిర్ధారణాత్మక భావాన్ని సహజ తెలుగులో ‘నాకు కనిపించలేదు’గా వ్యక్తం చేస్తూ, ἐν αὐτῷలోని ‘ఇతనిలో’ అనే రూపాన్ని నిలుపుతుంది.
- source_word: παιδεύσας
  choice: శిక్షించి
  rationale: ఈ సందర్భంలో παιδεύω బోధనకన్నా శిక్షాత్మక చర్యను సూచిస్తుంది. ‘శిక్షించి’ ఖచ్చితమైన శిక్షా విధానాన్ని పేర్కొనకుండా ఆ విస్తృత భావాన్ని అందిస్తుంది.
- source_word: ἀπολύσω
  choice: విడుదల చేస్తాను
  rationale: న్యాయ సందర్భంలో ἀπολύω అంటే అదుపు లేదా శిక్ష నుంచి విడిచిపెట్టడం; ‘విడుదల చేస్తాను’ గౌరవప్రదమైన, సహజమైన న్యాయపరమైన తెలుగు.
theological_decisions:
- issue: παιδεύσαςలో పిలాతు ప్రతిపాదించిన చర్య స్వభావం
  choice: ఖచ్చితమైన విధానాన్ని పేర్కొనకుండా సాధారణ శిక్షాత్మక చర్యగా ‘శిక్షించి’ అని అనువదించడం.
  alternative: ‘దండించి’ లేదా, మరింత నిర్దిష్టంగా, ‘కొరడాలతో కొట్టించి’.
  rationale: యేసు మరణశిక్షకు పాత్రుడు కాదని ప్రకటిస్తూనే పిలాతు తక్కువ స్థాయి శిక్షను ప్రతిపాదిస్తున్న ఉద్రిక్తతను వాక్యం నిలుపుతుంది. గ్రీకు క్రియ శిక్షను సూచించినా దాని నిర్దిష్ట రూపాన్ని ఈ పదం ఒక్కటే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయ సందర్భానికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. గ్రీకు వాక్యంలోని సంక్షిప్త అభ్యంతర ప్రశ్నను, నిర్దోషిత్వ ప్రకటనను, అయినప్పటికీ శిక్షించాలనే ప్రతిపాదనలోని ఉద్రిక్తతను నిలుపింది.
