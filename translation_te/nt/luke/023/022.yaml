- from: 'అతడు మూడోసారి వారితో ఇలా అన్నాడు: “ఎందుకు? ఇతడు చేసిన చెడు ఏమిటి?[a] మరణశిక్షకు తగిన నేరమేదీ ఇతనిలో నాకు కనిపించలేదు.[b] కాబట్టి ఇతన్ని శిక్షించి[c] విడుదల చేస్తాను.”'
  to: 'అతడు మూడోసారి వారితో ఇలా అన్నాడు: “ఎందుకు? ఇతడు ఏ చెడు చేశాడు?[a] ఇతనిలో మరణశిక్షకు తగినదేదీ నేను కనుగొనలేదు.[b] కాబట్టి ఇతన్ని శిక్షించి[c] విడుదల చేస్తాను.”'
  rationale: The revision avoids restricting the legal expression αἴτιον θανάτου to a specific “crime,” improves the idiomatic form of the question, and retains all three footnote anchors at the words or clauses they explain. It preserves the Greek ambiguity concerning the precise punitive action in παιδεύσας.
