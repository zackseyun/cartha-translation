  text: And the chief priests and the scribes stood there[a], vehemently accusing him.
translation:
  language: te
  text: ప్రధాన యాజకులూ శాస్త్రులూ అక్కడ నిలబడి, ఆయనపై తీవ్రంగా ఆరోపణలు చేస్తూ ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనపై బలంగా ఆరోపణలు చేస్తూ ఉన్నారు’ / ‘ఆయనపై తీవ్రంగా అభియోగాలు మోపుతూ ఉన్నారు.’
    reason: εὐτόνως κατηγοροῦντες అనే పదబంధం బలమైన తీవ్రతతో కొనసాగుతున్న ఆరోపణ లేదా అభియోగం చేయడాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: అక్కడ నిలబడి ... ఉన్నారు
  rationale: 'ఈ రూపం గతకాల స్థితిని సూచిస్తుంది: వారు ఆ ప్రదేశంలో నిలబడి ఉన్నారు. తెలుగు వాక్యంలో సహజంగా ఉండేలా కొనసాగుతున్న చర్యతో కలిపి అనువదించబడింది.'
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ కథనాన్ని స్వల్పంగా ముందుకు నడిపే అనుసంధాన పదం. తెలుగులో వాక్యక్రమమే ఆ కొనసాగింపును సహజంగా తెలియజేస్తుంది; ‘అయితే’ అని పెడితే మూలంలో లేని బలమైన వ్యత్యాసం కలగవచ్చు.
- source_word: ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: ఇది ఏకకాలంలో అనేక మంది మహాయాజకులుగా ఉన్నారని కాకుండా, ప్రముఖ యాజక అధికారులను సూచించే స్థిరమైన బహువచన బిరుదు.
- source_word: γραμματεῖς
  choice: శాస్త్రులు
  rationale: సువార్తల సందర్భంలో ధర్మశాస్త్ర పండితులైన γραμματεῖς‌కు నేరుగా, సంప్రదాయబద్ధంగా అర్థమయ్యే తెలుగు పదం.
- source_word: εὐτόνως
  choice: తీవ్రంగా
  rationale: ఆరోపణలు బలంగా, పట్టుదలతో చేయబడుతున్నాయనే తీవ్రతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: κατηγοροῦντες
  choice: నేరాలు మోపుతూ
  rationale: వర్తమాన కృదంతం వారు నిలబడి ఉన్న సమయంలో కొనసాగుతున్న ఆరోపణ చర్యను సూచిస్తుంది. న్యాయపరమైన సందర్భాన్ని ‘నేరాలు మోపుతూ’ స్పష్టంగా అందిస్తుంది.
- source_word: αὐτοῦ
  choice: ఆయనపై
  rationale: κατηγορέωతో వచ్చే షష్ఠీ విభక్తి ఆరోపణ ఎవరికి వ్యతిరేకంగా ఉందో సూచిస్తుంది; తెలుగులో ‘ఆయనపై’ సహజమైన సమానం.
