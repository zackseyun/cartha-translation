id: LUK.23.4
reference: Luke 23:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος εἶπεν πρὸς τοὺς ἀρχιερεῖς καὶ τοὺς ὄχλους· Οὐδὲν εὑρίσκω αἴτιον ἐν τῷ ἀνθρώπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/004.yaml
  text: Then Pilate said to the chief priests and the crowds[a], “I find no basis for a charge against this man.”
translation:
  language: te
  text: 'అప్పుడు పిలాతు ముఖ్య యాజకులతోను జనసమూహాలతోను ఇలా అన్నాడు: “ఈ మనిషిపై నేరారోపణ చేయడానికి నాకు ఏ ఆధారమూ కనిపించడం లేదు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ మనిషిలో నాకు ఏ దోషమూ కనిపించడం లేదు.” గ్రీకు αἴτιον అనే పదానికి “దోషం” అనే అర్థం ఉండవచ్చు; అయితే ఇక్కడ అది న్యాయపరంగా నేరారోపణకు చెల్లే ఆధారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇది స్వల్ప అనుసంధాన పదం; ఇక్కడ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: Πιλᾶτος
  choice: పిలాతు
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపం.
- source_word: εἶπεν πρὸς
  choice: తో ... అన్నాడు
  rationale: ప్రత్యక్ష సంభాషణను సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: ἀρχιερεῖς
  choice: ముఖ్య యాజకులు
  rationale: ఏకకాలంలో అనేక ప్రధాన యాజకులు ఉన్నారనే భావం రాకుండా, యాజక నాయకవర్గాన్ని సూచించే ప్రామాణిక రూపం.
- source_word: ὄχλους
  choice: జనసమూహాలు
  rationale: గ్రీకు పదంలోని బహువచనాన్ని నిలుపుతుంది.
- source_word: Οὐδὲν εὑρίσκω
  choice: నాకు ఏ ... కనిపించడం లేదు
  rationale: పిలాతు చేస్తున్న ప్రస్తుత న్యాయపరమైన నిర్ధారణను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: αἴτιον
  choice: నేరారోపణ చేయడానికి ... ఆధారం
  rationale: ఈ న్యాయసందర్భంలో దోషం అనే సాధారణ భావం కంటే, అభియోగం మోపడానికి చెల్లే కారణం అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: ఈ మనిషిపై
  rationale: అక్షరార్థంగా ‘ఈ మనిషిలో’ అయినా, న్యాయపరమైన తెలుగు ప్రయోగంలో ‘ఈ మనిషిపై’ సహజంగా ఉంటుంది; నిర్దేశక భావాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయపరమైన పదజాలం ఉపయోగించబడింది. గ్రీకు బహువచనమైన ὄχλουςను ‘జనసమూహాలు’గా నిలుపుతూ, αἴτιον యొక్క న్యాయార్థాన్ని ప్రధాన పాఠ్యంలో స్పష్టం చేశాం.
