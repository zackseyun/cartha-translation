source:
  edition: SBLGNT
  text: καὶ ὅτε ⸀ἦλθον ἐπὶ τὸν τόπον τὸν καλούμενον Κρανίον, ἐκεῖ ἐσταύρωσαν αὐτὸν καὶ τοὺς κακούργους, ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/033.yaml
  text: And when they came to the place called Skull[a], there they crucified him and the criminals[b], one on the right and one on the left.
translation:
  language: te
  text: వారు “కపాలం”[a] అని పిలిచే చోటుకు వచ్చినప్పుడు, అక్కడ వారు ఆయనను సిలువ వేశారు; అలాగే నేరస్థులిద్దరిని కూడా సిలువ వేశారు—ఒకరిని కుడివైపున, మరొకరిని ఎడమవైపున[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కపాలం అనే చోటుకు.’ Κρανίον అనే గ్రీకు స్థలనామానికి అక్షరార్థం ‘కపాలం.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా, ‘ఒకరిని కుడివైపు నుండి, మరొకరిని ఎడమవైపు నుండి.’ సందర్భంలో ఇది వారి స్థానాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: వచ్చినప్పుడు
  rationale: కథన సందర్భంలో ἔρχομαι భూతకాల రూపాన్ని సహజమైన తెలుగు ఉపవాక్యంగా ‘వచ్చినప్పుడు’ అని అనువదించడం సముచితం.
- source_word: ἐπὶ τὸν τόπον
  choice: చోటుకు
  rationale: చలనాన్ని సూచించే క్రియతో ἐπί + ద్వితీయా విభక్తి గమ్యస్థానాన్ని సూచిస్తుంది; అందువల్ల ‘చోటుకు’ అని అనువదించబడింది.
- source_word: τὸν καλούμενον Κρανίον
  choice: “కపాలం” అని పిలిచే
  rationale: Κρανίον అంటే అక్షరార్థంగా ‘కపాలం.’ లిప్యంతరీకరణ చేయకుండా ఆ స్థలనామంలోని అర్థాన్ని నిలిపింది.
- source_word: ἐσταύρωσαν
  choice: సిలువ వేశారు
  rationale: σταυρόωకు ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, స్థిరమైన సమానార్థక ప్రయోగం ‘సిలువ వేయడం.’
- source_word: κακούργους
  choice: నేరస్థులు
  rationale: κακοῦργος నేరం చేసినవారిని లేదా దుష్కార్యాలు చేసినవారిని సూచిస్తుంది. ‘నేరస్థులు’ స్పష్టమైన ఆధునిక పదం; ‘దొంగలు’ లేదా ‘తిరుగుబాటుదారులు’ అని అనువదించడం మూలంలో లేని నిర్దిష్టతను చేర్చుతుంది.
- source_word: ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν
  choice: ఒకరిని కుడివైపున, మరొకరిని ఎడమవైపున
  rationale: ఈ పరస్పర సంబంధ నిర్మాణం ఇద్దరి స్థానాలను వేర్వేరుగా చూపిస్తుంది. మూలంలో స్పష్టంగా లేని ‘ఆయనకు’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
theological_decisions:
- issue: Κρανίον అనే స్థలనామం
  choice: కపాలం
  alternative: కపాల స్థలం; క్రానియోన్
  rationale: ఇది సాధారణ నామవాచకం నుండి ఏర్పడిన స్థలపేరు. దాని అర్థాన్ని అనువదించడం మూలంలోని భావాన్ని కాపాడుతుంది; సమాంతర సువార్తలలోని సంప్రదాయ రూపాలను ఇక్కడికి దిగుమతి చేయదు.
- issue: యేసుతో పాటు సిలువ వేయబడిన ఇద్దరి వర్ణన
  choice: నేరస్థులు
  alternative: దుష్కార్యులు; దొంగలు
  rationale: లూకా ఉపయోగించిన κακοῦργοι అనే పదం ‘దొంగలు’ కంటే విస్తృతమైనది. ‘నేరస్థులు’ అనే అనువాదం ఇతర సువార్తల పదజాలంతో సమన్వయం చేయకుండా లూకా పదప్రయోగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. తెలుగు వాక్యక్రమానికి అనుగుణంగా ప్రధాన క్రియను చివర ఉంచుతూ, మూలంలోని కుడి–ఎడమ స్థాన విభజనను స్పష్టంగా నిలిపాం.
