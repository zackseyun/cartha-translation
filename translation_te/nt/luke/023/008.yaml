- from: హేరోదు యేసును చూసినప్పుడు ఎంతో సంతోషించాడు. ఎందుకంటే, అతడు చాలాకాలంగా ఆయనను చూడాలని కోరుకుంటూ ఉన్నాడు; ఆయన గురించి వింటూ వచ్చాడు[a]. అంతేకాక, ఆయన చేసే ఏదైనా సూచక క్రియను[b] చూడాలని ఆశిస్తూ ఉన్నాడు.
