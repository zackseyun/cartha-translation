id: LUK.23.8
reference: Luke 23:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Ἡρῴδης ἰδὼν τὸν Ἰησοῦν ἐχάρη λίαν, ἦν γὰρ ⸂ἐξ ἱκανῶν χρόνων θέλων⸃ ἰδεῖν αὐτὸν διὰ τὸ ⸀ἀκούειν περὶ αὐτοῦ, καὶ ἤλπιζέν τι σημεῖον ἰδεῖν ὑπ’ αὐτοῦ γινόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/008.yaml
  text: When Herod saw Jesus[a], he rejoiced greatly, for he had for a long time wanted to see him because he had heard about him[b], and he was hoping to see some sign done by him.
translation:
  language: te
  text: హేరోదు యేసును చూసినప్పుడు ఎంతో సంతోషించాడు. ఎందుకంటే, ఆయన గురించి వింటూ ఉండడం వల్ల అతడు చాలాకాలంగా ఆయనను చూడాలని కోరుకుంటూ ఉన్నాడు[a]; అలాగే, ఆయన ద్వారా జరిగే ఏదో ఒక సూచనాత్మక కార్యాన్ని చూడాలని ఆశిస్తున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన గురించి విన్నాడు.’ గ్రీకులో ఇక్కడ వాడిన వర్తమాన క్రియారూపం పదేపదే లేదా కొనసాగుతూ విన్న విషయాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఏదైనా అద్భుతాన్ని.’ గ్రీకులో ‘సూచన’ (σημεῖον) అని ఉంది; ఇది ప్రాముఖ్యమైన సూచనగా భావించబడే అద్భుత కార్యాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχάρη λίαν
  choice: ఎంతో సంతోషించాడు
  rationale: χαίρω యొక్క ఆనంద భావాన్నీ, λίαν యొక్క తీవ్రతనూ సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐξ ἱκανῶν χρόνων
  choice: చాలాకాలంగా
  rationale: కాలవ్యవధిని సంవత్సరాలుగా అతిగా నిర్దిష్టం చేయకుండా, దీర్ఘకాలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: θέλων ἰδεῖν αὐτόν
  choice: ఆయనను చూడాలని కోరుకుంటూ ఉన్నాడు
  rationale: ἦν + θέλων అనే కొనసాగుతున్న కోరికను తెలుగులో సహజంగా ప్రతిబింబిస్తుంది.
- source_word: διὰ τὸ ἀκούειν περὶ αὐτοῦ
  choice: ఆయన గురించి వింటూ వచ్చాడు
  rationale: διάతో కూడిన నిర్మాణంలోని కారణ భావాన్ని సందర్భం ద్వారా నిలుపుతూ, వర్తమాన infinitive సూచించగల పునరావృత లేదా కొనసాగుతున్న వినికిడిని వ్యక్తపరుస్తుంది.
- source_word: ἤλπιζέν τι σημεῖον ἰδεῖν
  choice: ఏదైనా సూచక క్రియను చూడాలని ఆశిస్తూ ఉన్నాడు
  rationale: ἐλπίζωలోని ఆశ/నిరీక్షణ భావాన్ని, σημεῖονలోని కేవలం అద్భుతానికంటే విస్తృతమైన ‘సూచనగా నిలిచే కార్యం’ భావాన్ని కాపాడుతుంది.
- source_word: ὑπ’ αὐτοῦ γινόμενον
  choice: ఆయన చేసే
  rationale: సూచక క్రియకు యేసే కర్త అనే ὑπό సూచించే భావాన్ని సహజమైన తెలుగు కర్తృవాచక నిర్మాణంలో తెలియజేస్తుంది.
- source_word: ὁ δὲ Ἡρῴδης
  choice: హేరోదు
  rationale: δέ కథన పురోగతిని సూచిస్తుంది; తెలుగులో అనవసరమైన ‘ఇప్పుడు’ వంటి కాలసూచక పదాన్ని చేర్చకుండా వాక్యక్రమమే ఆ పురోగతిని మోస్తుంది.
- source_word: ἰδὼν τὸν Ἰησοῦν
  choice: హేరోదు యేసును చూసినప్పుడు
  rationale: aorist participleకు ప్రధాన క్రియతో ఉన్న కాలసంబంధాన్ని సహజమైన ‘చూసినప్పుడు’ నిర్మాణంతో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: σημεῖον యొక్క భావపరిధి
  choice: సూచక క్రియ
  alternative: అద్భుతం
  rationale: ఈ సందర్భంలో అద్భుత కార్యం ఉద్దేశించబడినా, గ్రీకు పదం ఆ కార్యం ఒక ప్రాముఖ్యమైన సూచనగా ఉండే భావాన్ని కూడా కలిగి ఉంది; అందుచేత ప్రధాన పాఠ్యంలో విస్తృత భావాన్ని నిలిపి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘ఆయన’ అనే గౌరవ సర్వనామం యేసుకు, ‘అతడు’ హేరోదుకు వాడి సూచనలను స్పష్టంగా ఉంచాం. మూలంలోని కొనసాగుతున్న కోరిక, వినికిడి, ఆశ భావాలను తెలుగు క్రియారూపాలతో నిలిపాం.
