reference: Luke 23:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἷς δὲ τῶν κρεμασθέντων κακούργων ἐβλασφήμει αὐτόν ⸀λέγων· ⸀Οὐχὶ σὺ εἶ ὁ χριστός; σῶσον σεαυτὸν καὶ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/039.yaml
  text: One of the criminals who were hanging there was reviling him[a], saying, “Are you not the Messiah? Save yourself and us.”
translation:
  language: te
  text: 'వేలాడదీయబడిన నేరస్థుల్లో ఒకడు ఆయనను దూషిస్తూ ఉండేవాడు; ఇలా అన్నాడు: “నువ్వు మెస్సీయవు కాదా?[a] నిన్ను నువ్వు రక్షించుకో, మమ్మల్ని కూడా రక్షించు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “నువ్వు క్రీస్తువు కాదా?” గ్రీకులో: హో క్రిస్టోస్.'
    reason: ὁ χριστός అనే బిరుదుకు సాధ్యమైన సాంప్రదాయ ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: Εἷς δὲ
  choice: ఒకడు
  rationale: δέ స్వల్ప కథన పురోగతిని లేదా వ్యత్యాసాన్ని సూచిస్తుంది; తెలుగులో సందర్భ ప్రవాహమే ఆ భావాన్ని మోయగలదు కాబట్టి ప్రత్యేక సంధానపదాన్ని చేర్చలేదు.
- source_word: τῶν κρεμασθέντων κακούργων
  choice: వేలాడదీయబడిన నేరస్థుల్లో
  rationale: κρεμασθέντων యొక్క ‘వేలాడదీయబడిన’ భావాన్ని నిలుపుతూ, κακούργωνను ఆధునిక సహజ తెలుగులో ‘నేరస్థులు’గా ఇచ్చాం; మూలంలో లేని మరింత నిర్దిష్టమైన ‘సిలువ వేయబడిన’ అనే క్రియను దిగుమతి చేయలేదు.
- source_word: ἐβλασφήμει αὐτόν
  choice: ఆయనను దూషిస్తూ
  rationale: ఇక్కడ యేసుపై పలికిన అవమానకరమైన మాటలే ప్రధాన భావం. అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న చర్యను ‘దూషిస్తూ’ సహజంగా తెలియజేస్తుంది.
- source_word: λέγων
  choice: అన్నాడు
  rationale: తెలుగు కథనంలో ప్రత్యక్ష సంభాషణను సహజంగా పరిచయం చేస్తుంది.
- source_word: Οὐχὶ σὺ εἶ ὁ χριστός;
  choice: నువ్వు మెస్సీయవు కాదా?
  rationale: οὐχί ఆశించిన సమ్మతిని లేదా ఎగతాళి ధోరణిని కలిగిన ప్రశ్న; ‘కాదా?’ ఆ వాక్చాతుర్య బలాన్ని నిలుపుతుంది. χριστός ఇక్కడ బిరుదుగా ఉంది.
- source_word: σῶσον σεαυτὸν καὶ ἡμᾶς
  choice: నిన్ను నువ్వు రక్షించుకో, మమ్మల్ని కూడా రక్షించు
  rationale: ఆజ్ఞార్థకతను, తనను తాను మరియు తమను విడిపించాలనే నేరస్థుని స్వార్థపూరిత సవాలును స్పష్టమైన సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ὁ χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ ఎగతాళి ప్రశ్నలో Χριστός పేరు వలె కాక బిరుదుగా పనిచేస్తుంది. ‘మెస్సీయ’ యూదుల అభిషిక్త విమోచకుని నిరీక్షణతో ఉన్న భావాన్ని నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన స్వరంలో ‘ఆయనను’ వాడి, నేరస్థుని ఎగతాళి మాటల్లో మూలంలోని ఏకవచన అనౌపచారిక సంబోధన బలాన్ని చూపేందుకు ‘నువ్వు’ ఉంచాం. వాక్యం సాధారణ పాఠకులకు సహజంగా, కానీ మూలానికి సమీపంగా రూపొందించబడింది.
