id: LUK.23.35
reference: Luke 23:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἱστήκει ὁ λαὸς θεωρῶν. ἐξεμυκτήριζον δὲ καὶ οἱ ⸀ἄρχοντες λέγοντες· Ἄλλους ἔσωσεν, σωσάτω ἑαυτόν, εἰ οὗτός ἐστιν ὁ χριστὸς ⸂τοῦ θεοῦ, ὁ⸃ ἐκλεκτός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/035.yaml
  text: And the people stood watching. But even the rulers were mocking him[a], saying, “He saved others; let him save himself, if this is God’s Messiah, the Chosen One.”
translation:
  language: te
  text: ప్రజలు నిలబడి చూస్తున్నారు. పాలకులు కూడా ఆయనను ఎగతాళి చేస్తూ, “ఇతడు ఇతరులను రక్షించాడు; ఇతడు దేవుని మెస్సీయ, ఎన్నుకోబడినవాడు అయితే, తనను తాను రక్షించుకోనీ!” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἱστήκει
  choice: నిలబడి ఉన్నారు
  rationale: ఇక్కడ ఈ క్రియ ప్రజలు నిలిచి ఉన్న దృశ్యాన్ని నేపథ్యంగా చూపిస్తుంది; తెలుగు వాక్యంలో సహజంగా ఉండేందుకు బహువచన కర్తకు అనుగుణంగా ఇచ్చాం.
- source_word: θεωρῶν
  choice: చూస్తూ
  rationale: ప్రజలు జరుగుతున్నదాన్ని నిరంతరం చూస్తున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐξεμυκτήριζον
  choice: ఎగతాళి చేస్తూ
  rationale: ఈ క్రియలో ఉన్న హేళనతో కూడిన అపహాస్య భావాన్ని స్పష్టంగా అందిస్తుంది; సందర్భం ఆధారంగా కర్మను ‘ఆయనను’ అని వ్యక్తం చేశాం.
- source_word: ἄρχοντες
  choice: నాయకులు
  rationale: ఈ సందర్భంలోని పాలకవర్గ లేదా మతనాయకులను సూచించే విస్తృతమైన, సహజమైన పదం; ‘పాలకులు’ కంటే సందర్భంలో సులభంగా అర్థమవుతుంది.
- source_word: Ἄλλους ἔσωσεν
  choice: ఇతడు ఇతరులను రక్షించాడు
  rationale: σῴζω యొక్క ‘రక్షించు’ భావాన్ని నిలిపి, తరువాతి σωσάτωతో ఉన్న పదపునరుక్తిని కాపాడుతుంది; ‘ఇతడు’ οὗτοςలోని చూపించి చెప్పే, హేళనాత్మక ఛాయను ముందుగానే వినిపిస్తుంది.
- source_word: σωσάτω ἑαυτόν
  choice: తనను తాను రక్షించుకోనీ
  rationale: మూడవ పురుష ఆజ్ఞార్థక భావాన్ని సహజమైన తెలుగులో అందిస్తూ, ముందటి ‘రక్షించాడు’తో పదసంబంధాన్ని నిలుపుతుంది.
- source_word: εἰ οὗτός ἐστιν
  choice: ఇతడే … అయితే
  rationale: οὗτος యొక్క నిర్దేశక బలాన్ని ‘ఇతడు’తో, వాక్యంలోని పరీక్షాత్మక హేళనను ‘అయితే’తో కాపాడుతుంది.
- source_word: ὁ χριστὸς τοῦ θεοῦ
  choice: దేవుని మెస్సీయ
  rationale: Χριστός ఇక్కడ వ్యక్తినామంలా కాక బిరుదుగా ఉంది. ‘మెస్సీయ’ ఆ బిరుదు యొక్క యూద నేపథ్యాన్ని నిలుపుతుంది; సుపరిచితమైన ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ὁ ἐκλεκτός
  choice: ఎన్నుకోబడినవాడు
  rationale: ఇది బిరుదువలె వాడబడినప్పటికీ, ఎవరిచేత ఎన్నుకోబడ్డాడో వాక్యంలో అదనంగా చేర్చకుండా గ్రీకు పదంలోని నిష్క్రియార్థకతను, దైవశాస్త్ర సంబంధ ఉద్వేగాన్ని నిలుపుతుంది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు; అభిషిక్తుడు
  rationale: ఈ సందర్భంలో Χριστός స్పష్టంగా బిరుదు. ‘మెస్సీయ’ దాని చారిత్రక-మెస్సీయ సంబంధ భావాన్ని నిలుపుతుంది; తెలుగు క్రైస్తవ వాడుకలో సుపరిచితమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: ὁ ἐκλεκτός యొక్క భావబలం
  choice: ఎన్నుకోబడినవాడు
  alternative: ఎన్నుకున్నవాడు; ఎన్నికైనవాడు
  rationale: గ్రీకు పదంలో ఎన్నుకునే కర్తను ఇక్కడ స్పష్టంగా పేర్కొనలేదు. అందువల్ల ‘దేవుడు ఎన్నుకున్నవాడు’ అని విస్తరించకుండా, అసలు వాక్యంలోని సంక్షిప్త బిరుదు మరియు భావ ఉద్వేగాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే శిలువ దృశ్యానికి తగిన గంభీరతతో. నాయకుల మాటల్లోని హేళనను ‘ఇతడు’ మరియు ఆజ్ఞార్థక ‘రక్షించుకోనీ’ ద్వారా నిలిపాం. ప్రధాన వాక్యంలో లేని దైవశాస్త్ర వివరణను చేర్చలేదు.
