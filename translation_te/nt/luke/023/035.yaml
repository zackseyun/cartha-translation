revisions:
- from: ప్రజలు నిలబడి చూస్తూ ఉన్నారు. నాయకులు కూడా ఆయనను ఎగతాళి చేస్తూ, “ఇతడు ఇతరులను రక్షించాడు; ఇతడే దేవుని మెస్సీయ[a], ఎన్నుకోబడినవాడు అయితే, తనను తాను రక్షించుకోనీ!” అన్నారు.
  to: ప్రజలు నిలబడి చూస్తున్నారు. పాలకులు కూడా ఆయనను ఎగతాళి చేస్తూ, “ఇతడు ఇతరులను రక్షించాడు; ఇతడు దేవుని మెస్సీయ, ఎన్నుకోబడినవాడు అయితే, తనను తాను రక్షించుకోనీ!” అన్నారు.
