    text: లేదా, “దేవుని క్రీస్తు, ఎన్నుకోబడినవాడు.”
    reason: ‘దేవుని మెస్సీయ, ఎన్నుకోబడినవాడు’ అనే బిరుదు పదబంధానికి ప్రత్యామ్నాయ అనువాదం.
  revision_rationale: The revision improves lexical precision for ἄρχοντες, avoids unnecessary emphatic expansion of οὗτος, and makes the alternative-reading footnote complete. It preserves the source syntax, irony, repeated ‘save’ vocabulary, and messianic titles without doctrinal expansion.
