id: LUK.23.42
reference: Luke 23:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγεν· Ἰησοῦ, μνήσθητί ⸀μου ὅταν ἔλθῃς ⸂ἐν τῇ βασιλείᾳ⸃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/042.yaml
  text: And he said[a], “Jesus, remember me when you come in your kingdom.”
translation:
  language: te
  text: 'అప్పుడు అతడు ఇలా అన్నాడు: “యేసూ, నీవు నీ రాజ్యంలో వచ్చినప్పుడు[a] నన్ను జ్ఞాపకం చేసుకో.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు నీ రాజ్యంతో వచ్చినప్పుడు.” కొన్ని ప్రతుల్లో “నీవు నీ రాజ్యంలోకి వచ్చినప్పుడు” అని ఉంది; అయితే SBLGNT పాఠంలో “నీ రాజ్యంలో” అని ఉంది.
    reason: SBLGNTలో ἐν (‘లో/రాజ్యంలో’) ఉంది. సందర్భానుసారం ‘రాజ్యంతో’ అనే భావం సాధ్యమైన ప్రత్యామ్నాయ వ్యాఖ్యానం; కొన్ని ప్రతుల్లో εἰς ఉండడం వల్ల ‘రాజ్యంలోకి’ అనే దిశార్థ పాఠం కూడా ఉంది.
lexical_decisions:
- source_word: καὶ
  choice: అప్పుడు
  rationale: కథనంలోని అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగు శైలిలో తెలియజేస్తుంది; అదనపు కారణార్థాన్ని చేర్చదు.
- source_word: ἔλεγεν
  choice: అతడు … అన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపానికి ‘చెబుతూ ఉన్నాడు’ అనే సాధ్యమైన భావం ఉన్నా, ఈ మాటల పరిచయంలో తెలుగు కథన శైలికి సాధారణ భూతకాలమే సహజం.
- source_word: Ἰησοῦ
  choice: యేసూ
  rationale: వ్యక్తినామంలోని సంబోధనా రూపాన్ని తెలుగు సంబోధనతో తెలియజేస్తుంది.
- source_word: μνήσθητί μου
  choice: నన్ను జ్ఞాపకం చేసుకో
  rationale: విన్నప స్వరాన్ని నిలుపుతూ మూలంలోని ‘నన్ను జ్ఞాపకం చేసుకో’ అనే భావాన్ని నేరుగా ఇస్తుంది; జ్ఞాపకం చేసుకోవడం వల్ల కలిగే అనుకూల చర్యను ప్రధాన పాఠ్యంలో విస్తరించి చెప్పదు.
- source_word: ὅταν ἔλθῃς
  choice: నీవు … వచ్చినప్పుడు
  rationale: భవిష్యత్తులో జరిగే సందర్భాన్ని సహజంగా తెలియజేస్తుంది; ఖచ్చితమైన కాలక్రమాన్ని అదనంగా నిర్ణయించదు.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: నీ రాజ్యంలో
  rationale: SBLGNTలోని ἐν (‘లో’)ను సమీపంగా అనుసరిస్తుంది. ‘నీ రాజ్యంలోకి’ అనే దిశార్థం కొన్ని ప్రతుల పాఠంతో మరింత స్పష్టంగా సరిపోతుంది కాబట్టి దాన్ని పాదసూచికలో ఉంచాం.
- source_word: βασιλείᾳ
  choice: రాజ్యంలో
  rationale: ‘రాజ్యం’ అనే పదం రాజరిక పాలన, అధికార పరిధి అనే భావాలకు చోటు ఇస్తూ తెలుగులో సుపరిచితంగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: యేసు భవిష్యత్తులో తన రాజ్యంలో రావడం గురించిన అంత్యకాల భావం
  choice: యేసు తన రాజ్యంలో వచ్చినప్పుడు తనను జ్ఞాపకం చేసుకోవాలని ఆ వ్యక్తి అడుగుతున్నట్లు అనువదించాం; సమయాన్ని లేదా అంత్యకాల క్రమాన్ని నిర్దిష్టం చేయలేదు.
  alternative: యేసు రాజాధికారంతో వచ్చినప్పుడు అని, లేదా తన రాజ్యంలోకి ప్రవేశించినప్పుడు అని అర్థం చేసుకోవచ్చు.
  rationale: వాక్యం యేసుకు చెందిన భవిష్యత్ రాజ్య నిరీక్షణను వ్యక్తం చేస్తుంది; అయితే దాని సమయాన్నీ సంపూర్ణ వేదాంత రూపరేఖనూ ఈ వాక్యమే వివరించదు. అందువల్ల ఆ ఉద్రిక్తతను పరిష్కరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్య నిర్మాణం, అయితే సంభాషణకు తగిన గౌరవప్రదమైన ‘యేసూ’ మరియు ప్రార్థనా విన్నపానికి తగిన ‘జ్ఞాపకం చేసుకో’ వాడబడ్డాయి.
