  text: ἐγένετο δὲ ἐν τῷ εἶναι αὐτοὺς ἐκεῖ ἐπλήσθησαν αἱ ἡμέραι τοῦ τεκεῖν αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/006.yaml
  text: And while they were there[a], the days were fulfilled for her to give birth.
translation:
  language: te
  text: వారు అక్కడ ఉన్నప్పుడు, ఆమె ప్రసవించవలసిన రోజులు నిండాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమె ప్రసవించవలసిన రోజులు పూర్తయ్యాయి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: ప్రత్యేక పదబంధంగా అనువదించకుండా వాక్యప్రవాహంలో వ్యక్తపరచడం
  rationale: ఈ గ్రీకు కథన సూత్రం ఇక్కడ ప్రధానంగా కథను ముందుకు నడిపిస్తుంది. తెలుగులో అదనంగా ‘అప్పుడు జరిగింది’ అని చేరిస్తే వాక్యం కృత్రిమంగా ఉంటుంది; కాలవాచక ఉపవాక్యం సహజంగానే కథన పురోగతిని తెలియజేస్తుంది.
- source_word: ἐν τῷ εἶναι αὐτοὺς ἐκεῖ
  choice: వారు అక్కడ ఉన్నప్పుడు
  rationale: ἐν తో కూడిన articular infinitive సమకాలికతను సూచిస్తుంది. ఈ అనువాదం ఆ కాలసంబంధాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐπλήσθησαν
  choice: నిండాయి
  rationale: గర్భధారణకు సంబంధించిన నిర్ణీత రోజులు పూర్తికి చేరుకున్న భావాన్ని ‘నిండాయి’ సహజంగా, అలాగే లూకా వాడిన పరిపూర్ణత భాషను పూర్తిగా సాధారణీకరించకుండా వ్యక్తపరుస్తుంది.
- source_word: αἱ ἡμέραι
  choice: రోజులు
  rationale: గ్రీకులో స్పష్టంగా ఉన్న ‘రోజులు’ అనే పదాన్ని నిలుపుతూ, ‘సమయం వచ్చింది’ అని భావాన్ని కుదించకుండా మూలంలోని రూపకల్పనను కాపాడుతుంది.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: ఆమె ప్రసవించవలసిన
  rationale: ఈ genitive articular infinitive ప్రసవానికి సంబంధించిన కాలాన్ని సూచిస్తుంది. ‘ప్రసవించవలసిన’ అనేది విధిబాధ్యతను ఉద్దేశపూర్వకంగా బలపరచకుండా, తెలుగులో నిర్ణీత ప్రసవకాలాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ἐπλήσθησαν αἱ ἡμέραι లో దైవనిర్ణీత లేదా నెరవేర్పు సమయమనే సంభావ్య సూచన
  choice: ‘రోజులు నిండాయి’ అని అనువదించడం
  alternative: ‘ఆమె ప్రసవించే సమయం వచ్చింది’ / ‘రోజులు పూర్తయ్యాయి’
  rationale: వాక్యం ప్రధానంగా మరియ గర్భకాలం పూర్తయిందని చెబుతుంది; అయితే లూకా వాడిన ‘నిండాయి’ అనే భాషలో ఉండగల నెరవేర్పు ప్రతిధ్వనిని తొలగించదు, అదే సమయంలో స్పష్టంగా లేని దైవశాస్త్రీయ వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కథన గాంభీర్యం మరియు మూలంలోని ‘రోజులు నిండాయి’ అనే భావ ఉద్వేగాన్ని నిలుపుతూ రూపొందించబడింది.
