source:
  edition: SBLGNT
  text: καὶ ἦλθεν ἐν τῷ πνεύματι εἰς τὸ ἱερόν· καὶ ἐν τῷ εἰσαγαγεῖν τοὺς γονεῖς τὸ παιδίον Ἰησοῦν τοῦ ποιῆσαι αὐτοὺς κατὰ τὸ εἰθισμένον τοῦ νόμου περὶ αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/027.yaml
  text: And he came in the Spirit into the temple[a]; and when the parents brought in the child Jesus to do for him according to the custom of the law[b],
translation:
  language: te
  text: ఆత్మలో ఆయన ఆలయానికి వచ్చాడు.[a] తల్లిదండ్రులు ధర్మశాస్త్ర ఆచారం ప్రకారం ఆయన విషయంలో చేయవలసినది చేయడానికి శిశువైన యేసును లోపలికి తీసుకువచ్చినప్పుడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆత్మచేత.’ గ్రీకు మాటను రెండు విధాలుగా అనువదించవచ్చు. ‘ఆత్మలో’ అనేది మూలపద నిర్మాణాన్ని, ఈ సందర్భంలో పరిశుద్ధాత్మపై లూకా ఉంచిన ప్రాధాన్యాన్ని మరింత దగ్గరగా నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ πνεύματι
  choice: ఆత్మలో
  rationale: గ్రీకు విభక్తి నిర్మాణాన్ని, ఈ సందర్భంలో లూకా పరిశుద్ధాత్మకు ఇచ్చిన ప్రాధాన్యాన్ని నిలుపుతుంది; కేవలం సిమ్యోను అంతరంగ స్వభావాన్ని సూచించే అవకాశంకన్నా పరిశుద్ధాత్మ సూచనే సందర్భానుకూలం.
- source_word: ἱερόν
  choice: ఆలయం
  rationale: ఇది అంతర్గత పరిశుద్ధ స్థలానికే పరిమితమైన ναός కాకుండా ఆలయ ప్రాంగణ సముదాయాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఆలయం’ సహజమైన ప్రామాణిక పదం.
- source_word: ἐν τῷ εἰσαγαγεῖν
  choice: లోపలికి తీసుకొచ్చినప్పుడు
  rationale: ἐν తో కూడిన articular infinitive ఇక్కడ కాలార్థకమైనది; తెలుగు వాక్యనిర్మాణంలో ఈ రూపం ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: γονεῖς
  choice: తల్లిదండ్రులు
  rationale: గ్రీకు పదానికి ఇదే సూటి సామాజిక-కుటుంబార్థం. మరియ, యోసేపుల పాత్రను కథన భాషలో తెలుపుతుంది; జీవశాస్త్రీయ పితృత్వంపై అదనపు వాదనను చేర్చదు.
- source_word: παιδίον Ἰησοῦν
  choice: యేసు శిశువు
  rationale: ఈ సందర్భంలో παιδίον పసిబిడ్డను సూచిస్తుంది; ‘యేసు శిశువు’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: τοῦ ποιῆσαι αὐτοὺς
  choice: చేయవలసినది చేయడానికి
  rationale: ఈ genitive articular infinitive ఉద్దేశాన్ని తెలుపుతుంది; αὐτούς తల్లిదండ్రులను కర్తలుగా సూచిస్తుండగా, తెలుగు రూపం సందర్భం ద్వారా ఆ కర్తను స్పష్టంగా ఉంచుతుంది.
- source_word: κατὰ τὸ εἰθισμένον τοῦ νόμου
  choice: ధర్మశాస్త్ర ఆచారం ప్రకారం
  rationale: εἰθισμένον అలవాటుగా లేదా నియమితంగా ఆచరించేదాన్ని సూచిస్తుంది; ‘ధర్మశాస్త్ర ఆచారం ప్రకారం’ సంక్షిప్తంగా, గౌరవప్రదంగా ఉంది.
- source_word: περὶ αὐτοῦ
  choice: అతని విషయంలో
  rationale: περί + genitive సంబంధం లేదా విషయాన్ని సూచిస్తుంది. ఆచారం శిశువుకు సంబంధించిందని చెప్పేందుకు ఈ రూపం మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: సిమ్యోను చర్యలో ‘ఆత్మ’ ఎవరు?
  choice: పరిశుద్ధాత్మను సూచించే ‘ఆత్మ’
  alternative: సిమ్యోను సొంత ఆత్మ లేదా అంతరంగ ప్రేరణ
  rationale: లూకా 2:25–27లో పరిశుద్ధాత్మ గురించిన పునరుక్త సూచనలు πνεῦμα పరిశుద్ధాత్మనే సూచిస్తుందని బలపరుస్తాయి. అయినా ప్రధాన పాఠంలో మూలంలోని ‘ఆత్మలో’ నిర్మాణాన్ని నిలిపి, ‘ఆత్మచేత’ అని కారణార్థాన్ని మాత్రమే నిర్బంధించలేదు.
- issue: మరియ, యోసేపులను ‘తల్లిదండ్రులు’ అని పిలవడం
  choice: γονεῖς ను సూటిగా ‘తల్లిదండ్రులు’ అని అనువదించడం
  alternative: సంరక్షకులు; యోసేపు మరియు మరియ
  rationale: ఇది లూకా ఉపయోగించిన సాధారణ కుటుంబ-సామాజిక భాష. కన్యాగర్భధారణను నిరాకరించదు; అదే సమయంలో మూలపాఠాన్ని సిద్ధాంత కారణంతో మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన బైబిలు శైలి. వాక్యం తదుపరి వచనంతో వ్యాకరణపరంగా కొనసాగుతున్నందున చివర కామా ఉంచబడింది. మూలంలో లేని అదనపు సిద్ధాంత వివరణను ప్రధాన పాఠంలో చేర్చలేదు.
