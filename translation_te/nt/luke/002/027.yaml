revisions:
- from: అతడు ఆత్మలో ఆలయంలోకి వచ్చాడు.[a] తల్లిదండ్రులు ధర్మశాస్త్ర ఆచారం ప్రకారం యేసు శిశువు విషయంలో చేయవలసినది చేయడానికి అతణ్ణి లోపలికి తీసుకొచ్చినప్పుడు,
  to: ఆత్మలో ఆయన ఆలయానికి వచ్చాడు.[a] తల్లిదండ్రులు ధర్మశాస్త్ర ఆచారం ప్రకారం ఆయన విషయంలో చేయవలసినది చేయడానికి శిశువైన యేసును లోపలికి తీసుకువచ్చినప్పుడు,
