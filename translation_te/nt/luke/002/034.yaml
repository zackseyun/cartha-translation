reference: Luke 2:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εὐλόγησεν αὐτοὺς Συμεὼν καὶ εἶπεν πρὸς Μαριὰμ τὴν μητέρα αὐτοῦ· Ἰδοὺ οὗτος κεῖται εἰς πτῶσιν καὶ ἀνάστασιν πολλῶν ἐν τῷ Ἰσραὴλ καὶ εἰς σημεῖον ἀντιλεγόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/034.yaml
  text: And Simeon blessed them and said to Mary his mother, “Look, this one is appointed for the fall and rise of many in Israel, and for a sign that is opposed,[a]”
translation:
  language: te
  text: 'సిమెయోను వారిని ఆశీర్వదించి, ఆయన తల్లి మరియతో ఇలా అన్నాడు: “ఇదిగో, ఈయన ఇశ్రాయేలులో అనేకులు పడిపోవడానికి, లేవడానికి, వ్యతిరేకించబడే చిహ్నంగా నియమించబడ్డాడు,[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ఎదిరించి మాట్లాడబడే చిహ్నంగా.”'
    reason: ἀντιλεγόμενον అనే పదం సాధారణ వ్యతిరేకతతో పాటు మాటలతో ఎదిరించడం లేదా ఖండించడం అనే భావాన్నీ కలిగి ఉంది.
lexical_decisions:
- source_word: εὐλόγησεν
  choice: ఆశీర్వదించి
  rationale: గ్రీకు పదంలోని ఆశీర్వదించడం అనే సాధారణ అర్థాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలిపింది.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే గ్రీకు ఉద్ఘాటనను గౌరవప్రదమైన, పరిచితమైన ఆధునిక తెలుగు రూపంలో అందిస్తుంది.
- source_word: οὗτος
  choice: ఈయన
  rationale: శిశువైన యేసును సూచిస్తున్నందున వ్యక్తిగత గౌరవసూచక రూపం సహజంగా ఉంది; వచనం చెప్పని పేరును చేర్చలేదు.
- source_word: κεῖται εἰς
  choice: నియమించబడ్డాడు
  rationale: ఇక్కడి భావం ఒక నిర్దిష్ట ఫలితానికి ఉంచబడటం లేదా నియమించబడటం; తెలుగు పాఠకునికి సహజంగా ఉండే రూపాన్ని ఎంచుకున్నాం.
- source_word: πτῶσιν καὶ ἀνάστασιν
  choice: పడిపోవడానికి, తిరిగి లేవడానికి
  rationale: పతనం–లేవడం అనే ఉద్దేశపూర్వక వ్యత్యాసాన్ని కాపాడుతుంది; ἀνάστασις‌కు పునరుత్థానం అనే భావం సాధ్యమైనా, ఈ సందర్భంలోని విస్తృత రూపకార్థాన్ని సంకుచితం చేయకుండా క్రియారూపంలో ఇచ్చాం.
- source_word: σημεῖον ἀντιλεγόμενον
  choice: వ్యతిరేకించబడే సూచన
  rationale: σημεῖον‌ను ‘సూచన’గా, వర్తమాన కర్మణి కృదంతమైన ἀντιλεγόμενον‌ను కొనసాగుతున్న లేదా సంభవించే వ్యతిరేకతగా నేరుగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ‘పడిపోవడం మరియు లేవడం’ ఎవరికి ఎలా వర్తిస్తాయి?
  choice: అనేకులు పడిపోవడానికి, తిరిగి లేవడానికి
  alternative: కొందరు పడిపోవడానికి, మరికొందరు లేవడానికి
  rationale: గ్రీకు మూలం ఒకే ‘అనేకులు’ సమూహంపై ఈ రెండు ఫలితాలు ఎలా పంచబడతాయో స్పష్టంగా చెప్పదు. అందువల్ల వ్యక్తులను రెండు వర్గాలుగా విభజించే వ్యాఖ్యానాన్ని అనువాదంలో చేర్చలేదు.
- issue: ἀνάστασις యొక్క భావపరిధి
  choice: తిరిగి లేవడానికి
  alternative: పునరుత్థానానికి
  rationale: ‘పునరుత్థానం’ సాధ్యమైన పదార్థమే అయినప్పటికీ, ఇక్కడ పునరుద్ధరణ, పైకి లేవడం, లేదా అంతిమ పునరుత్థానం అనే అవకాశాల మధ్య మూలంలోని ఉద్వేగాన్ని తెరిచి ఉంచే విస్తృత రూపాన్ని ఎంచుకున్నాం.
- issue: κεῖται లో దైవ నియామకం సూచితమా?
  choice: నియమించబడ్డాడు
  alternative: ఉంచబడ్డాడు
  rationale: ఈ సందర్భంలో నిర్దేశిత పాత్ర భావాన్ని ‘నియమించబడ్డాడు’ సహజంగా అందిస్తుంది; అయితే కర్తను—దేవుడు అని సహా—వచనం స్పష్టంగా పేర్కొననందున అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన బైబిలు శైలిని ఉపయోగించాం. ‘ఇదిగో’ మూలంలోని ఉద్ఘాటనను నిలుపుతుంది. అసలు వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున ముగింపులో భావపరంగా అనవసరమైన వివరణను చేర్చలేదు.
