translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని కొనసాగుతున్న అన్వేషణ భావాన్ని ప్రధాన పాఠ్యంలోనే స్పష్టంగా ఉంచినందున పాదటిప్పణి అవసరం లేదు.
