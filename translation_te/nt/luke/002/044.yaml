id: LUK.2.44
reference: Luke 2:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: νομίσαντες δὲ αὐτὸν ⸂εἶναι ἐν τῇ συνοδίᾳ⸃ ἦλθον ἡμέρας ὁδὸν καὶ ἀνεζήτουν αὐτὸν ἐν τοῖς συγγενεῦσιν ⸀καὶ τοῖς γνωστοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/044.yaml
  text: But supposing him to be in the traveling group[a], they went a day's journey[b], and they began searching for him among their relatives and acquaintances.
translation:
  language: te
  text: అయితే, ఆయన ప్రయాణబృందంలో ఉన్నాడని భావించి, వారు ఒక రోజు ప్రయాణ దూరం వెళ్లారు; తమ బంధువులలోను పరిచయస్థులలోను ఆయన కోసం వెదుకుతూ ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νομίσαντες
  choice: ఉన్నాడని భావించి
  rationale: మరియ, యోసేపులు చేసిన తాత్కాలిక ఊహను తెలియజేస్తుంది; అది నిశ్చిత జ్ఞానం కాదనే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వాక్యంతో స్వల్ప వ్యత్యాసాన్ని, కథలో వచ్చిన మలుపును సూచిస్తుంది.
- source_word: εἶναι ἐν τῇ συνοδίᾳ
  choice: ప్రయాణబృందంలో ఉన్నాడని
  rationale: συνοδία కలిసి ప్రయాణించే జనసమూహాన్ని సూచిస్తుంది. ‘ప్రయాణబృందం’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, అవసరం లేని సాంస్కృతిక భావాలను జోడించదు.
- source_word: ἦλθον ἡμέρας ὁδὸν
  choice: ఒక రోజు ప్రయాణమంత దూరం వెళ్లారు
  rationale: ఒక రోజులో ప్రయాణించే కాలం లేదా దూరాన్ని తెలిపే గ్రీకు ప్రయోగాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνεζήτουν
  choice: వెదుకుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న అన్వేషణను నిలుపుతుంది; ‘వెదకడం మొదలుపెట్టారు’ అనే ఆరంభార్థాన్ని తప్పనిసరిగా రుద్దదు.
- source_word: συγγενεῦσιν
  choice: బంధువులలో
  rationale: కుటుంబ సంబంధీకులను లింగభేదం లేకుండా సహజంగా సూచిస్తుంది.
- source_word: γνωστοῖς
  choice: పరిచయస్థులలో
  rationale: సన్నిహిత మిత్రులకే పరిమితం కాకుండా, వారికి తెలిసిన వ్యక్తులు అనే విస్తృత అర్థాన్ని నిలుపుతుంది.
