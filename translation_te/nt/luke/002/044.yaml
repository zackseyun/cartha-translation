revisions:
- from: అయితే, ఆయన ప్రయాణబృందంలో ఉన్నాడని భావించి, వారు ఒక రోజు ప్రయాణమంత దూరం వెళ్లారు. ఆ తర్వాత తమ బంధువులలో, పరిచయస్థులలో ఆయన కోసం వెదుకుతూ ఉన్నారు.
  to: అయితే, ఆయన ప్రయాణబృందంలో ఉన్నాడని భావించి, వారు ఒక రోజు ప్రయాణ దూరం వెళ్లారు; తమ బంధువులలోను పరిచయస్థులలోను ఆయన కోసం వెదుకుతూ ఉన్నారు.
  rationale: The revision removes an unsupported temporal addition and makes the expression for a day’s journey more idiomatic. It preserves the source’s provisional assumption, communal travel setting, completed day’s travel, and the imperfect verb’s continuing search without forcing an inceptive sense.
