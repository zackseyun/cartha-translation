source:
  edition: SBLGNT
  text: καὶ ἐγένετο μετὰ ἡμέρας τρεῖς εὗρον αὐτὸν ἐν τῷ ἱερῷ καθεζόμενον ἐν μέσῳ τῶν διδασκάλων καὶ ἀκούοντα αὐτῶν καὶ ἐπερωτῶντα αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/046.yaml
  text: And it happened that after three days they found him in the temple[b][a], sitting among the teachers and listening to them and asking them questions.
translation:
  language: te
  text: మూడు రోజుల తర్వాత వారు ఆయనను దేవాలయ ప్రాంగణంలో[a] కనుగొన్నారు. ఆయన బోధకుల మధ్య కూర్చొని, వారి మాటలు వింటూ, వారికి ప్రశ్నలు వేస్తూ[b] ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదం మొత్తం దేవాలయ సముదాయాన్ని లేదా దాని ప్రాంగణాలను సూచిస్తుంది; అంతర్గర్భాలయాన్ని మాత్రమే కాదు.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘వారిని ప్రశ్నిస్తూ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: సహజ తెలుగు కథన ప్రవాహంలో ప్రత్యేకంగా అనువదించలేదు
  rationale: లూకా ఉపయోగించే ఈ కథనారంభ సూత్రాన్ని తెలుగులో అక్షరార్థంగా ‘జరిగింది’ అని ఉంచితే అసహజంగా ఉంటుంది; తరువాతి ప్రధాన క్రియతో సంఘటనను నేరుగా చెప్పడం దాని కథన విధిని సహజంగా అందిస్తుంది.
- source_word: μετὰ ἡμέρας τρεῖς
  choice: మూడు రోజుల తర్వాత
  rationale: కాలక్రమంలో మూడు రోజులు గడిచిన తరువాత అని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: εὗρον αὐτόν
  choice: వారు ఆయనను ... కనుగొన్నారు
  rationale: గ్రీకు కథన భూతకాల క్రియకు నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: ἐν τῷ ἱερῷ
  choice: దేవాలయ ప్రాంగణంలో
  rationale: ἱερόν అంతర్గర్భాలయాన్ని మాత్రమే కాక మొత్తం దేవాలయ సముదాయాన్ని సూచిస్తుంది; ‘ప్రాంగణం’ ఆ విస్తృత భావాన్ని ప్రధాన పాఠ్యంలోనే స్పష్టం చేస్తుంది.
- source_word: καθεζόμενον ἐν μέσῳ τῶν διδασκάλων
  choice: బోధకుల మధ్య కూర్చొని
  rationale: ఆయన కూర్చున్న భంగిమను, బోధకుల నడుమ ఉన్న స్థానాన్ని సరళంగా కాపాడుతుంది; మూలంలో లేని ‘ధర్మశాస్త్ర’ అనే విశేషణాన్ని చేర్చదు.
- source_word: ἀκούοντα αὐτῶν
  choice: వారు చెప్పేది వింటూ
  rationale: ఇక్కడ ἀκούω శ్రద్ధగా వినడాన్ని సూచిస్తుంది; తెలుగులో కర్మను సహజంగా వ్యక్తం చేయడానికి ‘వారు చెప్పేది’ అని ఇచ్చాం.
- source_word: ἐπερωτῶντα αὐτούς
  choice: వారిని ప్రశ్నలు అడుగుతూ
  rationale: సంభాషణలో ప్రశ్నలు వేయడం అనే భావాన్ని ఇస్తుంది; ప్రతికూలమైన విచారణ లేదా సవాలు అనే భావాన్ని అనవసరంగా రప్పించదు.
theological_decisions:
- issue: యేసు బోధకులతో జరిపిన సంభాషణ స్వభావం
  choice: ‘వారు చెప్పేది వింటూ, వారిని ప్రశ్నలు అడుగుతూ’
  alternative: ‘వారిని ప్రశ్నిస్తూ’ లేదా ‘వారిని ప్రశ్నలతో పరీక్షిస్తూ’
  rationale: మూలపాఠ్యం వినడం, అడగడం రెండింటినీ చెబుతుంది. అనువాదం ఆయన జ్ఞానాన్ని తగ్గించకూడదు; అదే సమయంలో ఆయన వారిని సవాలు చేశాడని లేదా పరీక్షించాడని మూలంలో లేని భావాన్ని చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. పొడవైన గ్రీకు వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి పఠనసౌలభ్యం కల్పించాం. ‘ఆయన’ అనే గౌరవ సూచక రూపం ఉపయోగించాం.
