source:
  edition: SBLGNT
  text: καὶ ἦν ⸂ὁ πατὴρ αὐτοῦ⸃ καὶ ἡ ⸀μήτηρ θαυμάζοντες ἐπὶ τοῖς λαλουμένοις περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/033.yaml
  text: And his father and mother were marveling at the things being said about him[a].
translation:
  language: te
  text: ఆయన తండ్రి, తల్లి ఆయన గురించి చెప్పబడుతున్న మాటలకు ఆశ్చర్యపోతూ ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘ఆయన తండ్రి’ అని ఉంది. కథనంలోని సాధారణ కుటుంబ, సామాజిక లేదా చట్టపరమైన అర్థంలో ఇది యోసేపును సూచిస్తుంది. యేసు కన్యకు జన్మించాడని లూకా ముందుగా చెప్పిన దృష్ట్యా అపార్థం రాకుండా ఉండేందుకు కొన్ని అనువాదాలు ‘యోసేపు, ఆయన తల్లి’ అని ఇస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατὴρ αὐτοῦ
  choice: ఆయన తండ్రి
  rationale: గ్రీకు పాఠంలో నేరుగా ‘ఆయన తండ్రి’ అని ఉంది. కథనంలోని సాధారణ కుటుంబ, సామాజిక లేదా చట్టపరమైన అర్థంలో ఇది యోసేపును సూచిస్తుంది; పాఠాన్ని ‘యోసేపు’ అని మార్చకుండా ఉన్నదున్నట్లు అనువదించాం.
- source_word: μήτηρ
  choice: తల్లి
  rationale: μήτηρ యొక్క సహజమైన ప్రామాణిక తెలుగు రూపం. ముందు ఉన్న ‘ఆయన’ తండ్రి, తల్లి ఇద్దరికీ సందర్భానుసారంగా వర్తిస్తుంది.
- source_word: θαυμάζοντες
  choice: ఆశ్చర్యపోతూ ఉన్నారు
  rationale: ἦν తో కూడిన వర్తమాన కృదంతం గతంలో కొనసాగుతున్న స్పందనను తెలియజేస్తుంది. ‘ఆశ్చర్యపోతూ ఉన్నారు’ ఆ కొనసాగింపు భావాన్నీ విస్మయాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐπὶ τοῖς λαλουμένοις
  choice: చెప్పబడుతున్న మాటలకు
  rationale: బహువచన నిష్క్రియ కృదంతంలోని భావాన్ని నిలుపుతూ, పలుకబడుతున్న విషయాల పట్ల వారి స్పందనను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: περὶ αὐτοῦ
  choice: ఆయన గురించి
  rationale: περί + షష్ఠీ విభక్తి యొక్క సందర్భార్థాన్ని ఆధునిక గౌరవప్రదమైన తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: కన్య గర్భధారణను తెలిపిన సందర్భంలో యోసేపును ‘ఆయన తండ్రి’ అని పేర్కొనడం
  choice: మూలపాఠంలోని పదప్రయోగాన్ని ‘ఆయన తండ్రి’ అని ప్రధాన పాఠంలో నిలిపి, దాని కథనార్థాన్ని పాదసూచికలో వివరించడం.
  alternative: ‘యోసేపు, ఆయన తల్లి’ అని మార్చడం; లేదా ప్రధాన పాఠంలోనే ‘చట్టపరమైన తండ్రి’ అని వివరణ చేర్చడం.
  rationale: లూకా కథనంలో యోసేపు సాధారణ కుటుంబ, సామాజిక లేదా చట్టపరమైన అర్థంలో యేసు తండ్రిగా పేర్కొనబడగలడు. మూలపాఠంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను తొలగించకుండా, ముందుగా చెప్పిన కన్య గర్భధారణతో దీనిని బలవంతంగా సమన్వయపరచకుండా అనువదించడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఆయన’ అనే గౌరవ సూచక సర్వనామం యేసును సూచిస్తుంది. కొనసాగుతున్న గత చర్యను ‘ఆశ్చర్యపోతూ ఉన్నారు’ ద్వారా వ్యక్తపరిచాం; గ్రీకు పాఠంలోని ‘ఆయన తండ్రి’ అనే పదబంధాన్ని సిద్ధాంతపరమైన కారణంతో మార్చలేదు.
