revisions:
- from: కాపరులు తాము విన్నవాటన్నిటిని, చూసినవాటన్నిటిని బట్టి దేవుణ్ణి మహిమపరుస్తూ, స్తుతిస్తూ తిరిగి వెళ్లారు[a]. అంతా వారికి చెప్పబడినట్టే జరిగింది[b].
  to: కాపరులు తమకు చెప్పబడినట్టుగానే తాము విన్నదాన్నీ చూసినదాన్నీ బట్టి దేవుణ్ణి మహిమపరుస్తూ, స్తుతిస్తూ తిరిగి వెళ్లారు[a][b].
  rationale: 'The revision keeps the Greek clause structure intact: the shepherds returned while glorifying and praising God because of all they had heard and seen, with that heard-and-seen content corresponding to what had been spoken to them. It does not identify the unnamed speaker or add a separate assertion that everything occurred.'
