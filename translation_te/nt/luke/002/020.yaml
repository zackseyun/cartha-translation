id: LUK.2.20
reference: Luke 2:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὑπέστρεψαν οἱ ποιμένες δοξάζοντες καὶ αἰνοῦντες τὸν θεὸν ἐπὶ πᾶσιν οἷς ἤκουσαν καὶ εἶδον καθὼς ἐλαλήθη πρὸς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/020.yaml
  text: And the shepherds returned[a], glorifying and praising God for all that they had heard and seen[c][b], just as it had been told to them.
translation:
  language: te
  text: కాపరులు తమకు చెప్పబడినట్టుగానే తాము విన్నదాన్నీ చూసినదాన్నీ బట్టి దేవుణ్ణి మహిమపరుస్తూ, స్తుతిస్తూ తిరిగి వెళ్లారు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తిరిగి వచ్చారు.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “వారికి చెప్పబడిన ప్రకారమే.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: తిరిగి వెళ్లారు
  rationale: వారు సందర్శించిన చోటు నుంచి తమ మునుపటి స్థలానికి లేదా పనికి తిరిగి వెళ్లిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οἱ ποιμένες
  choice: కాపరులు
  rationale: ఈ కథన సందర్భంలో గొర్రెలను కాసే వ్యక్తులను సూచించే సాధారణ, సహజ తెలుగు పదం.
- source_word: δοξάζοντες
  choice: మహిమపరుస్తూ
  rationale: తిరిగి వెళ్లే సమయంలో కొనసాగిన చర్యను వర్తమాన కృదంత భావంతో చూపిస్తూ, దేవునికి మహిమ చెల్లించడాన్ని వ్యక్తం చేస్తుంది.
- source_word: αἰνοῦντες
  choice: స్తుతిస్తూ
  rationale: δοξάζοντεςతో భావసామ్యం ఉన్నప్పటికీ వేరైన రెండవ క్రియను విడిగా నిలుపుతుంది.
- source_word: ἐπὶ πᾶσιν οἷς
  choice: వాటన్నిటిని బట్టి
  rationale: వారు దేవుణ్ణి మహిమపరచి స్తుతించడానికి కారణం లేదా ఆధారాన్ని ἐπί దత్తివిభక్తి ఇక్కడ సూచిస్తుంది.
- source_word: ἤκουσαν καὶ εἶδον
  choice: విన్నవాటన్నిటిని, చూసినవాటన్నిటిని
  rationale: రెండు సమాంతర క్రియలను స్పష్టంగా నిలుపుతూ, అవి తిరిగి వెళ్లడానికంటే ముందు జరిగినవని సందర్భమే తెలియజేయనిస్తుంది.
- source_word: καθὼς ἐλαλήθη πρὸς αὐτούς
  choice: అంతా వారికి చెప్పబడినట్టే జరిగింది
  rationale: తెలుగులో సహజంగా ఉండేలా సరిపోలికను స్పష్టం చేస్తూ, గ్రీకు కర్మణి ప్రయోగంలో చెప్పినవారు ఎవరో పేర్కొనకుండా ఉంచుతుంది.
theological_decisions:
- issue: వారు విన్నదీ చూసిందీ దేవదూత ప్రకటించినదానితో సరిపోయిందని చెప్పేటప్పుడు, చెప్పిన వ్యక్తిని స్పష్టంగా పేర్కొనాలా?
  choice: “వారికి చెప్పబడినట్టే” అని కర్మణి రూపంలో ఉంచి, చెప్పిన వ్యక్తిని పేర్కొనలేదు.
  alternative: “దేవదూత వారికి చెప్పినట్టే”
  rationale: సందర్భం దేవదూత సందేశాన్ని సూచించినప్పటికీ, ఈ వాక్యంలోని గ్రీకు కర్మణి క్రియ కర్తను స్పష్టంగా చెప్పదు; అందువల్ల మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. “మహిమపరుస్తూ, స్తుతిస్తూ” అనే జంట మూలంలోని రెండు వేర్వేరు కృదంతాలను నిలుపుతుంది.
