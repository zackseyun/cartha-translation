  text: καὶ ὅτε ἐγένετο ἐτῶν δώδεκα, ⸀ἀναβαινόντων ⸀αὐτῶν κατὰ τὸ ἔθος τῆς ἑορτῆς
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/042.yaml
  text: And when he was twelve years old[a], as they were going up according to the custom of the feast[b],
translation:
  language: te
  text: ఆయనకు పన్నెండేళ్లు వచ్చినప్పుడు, వారు పండుగ[a] ఆచారం ప్రకారం పైకి వెళ్తుండగా[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ముందటి వచనంలో పేర్కొన్న పస్కా పండుగ.
    reason: cross_reference
  - marker: b
    text: లేదా, “పైకి వెళ్లినప్పుడు.” గ్రీకు కృదంతాన్ని ఇలా సరళంగా కూడా అనువదించవచ్చు; ప్రధాన పాఠ్యం కొనసాగుతున్న క్రియాభావాన్ని నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐτῶν δώδεκα
  choice: ఆయనకు పన్నెండేళ్లు వచ్చినప్పుడు
  rationale: గ్రీకు వయస్సు సూచించే నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. సందర్భానుసారం ఏకవచన కర్త యేసును సూచిస్తున్నందున ‘ఆయనకు’ అని వాడబడింది.
- source_word: ἀναβαινόντων
  choice: పైకి వెళ్తుండగా
  rationale: ἀναβαίνω అనే పదంలోని ‘పైకి వెళ్లు’ అనే భావాన్నీ, వర్తమాన కృదంతంలోని కొనసాగుతున్న క్రియాభావాన్నీ నిలుపుతుంది. గమ్యస్థానమైన యెరూషలేము ఈ వచనంలో మళ్లీ స్పష్టంగా చెప్పబడనందున ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: αὐτῶν
  choice: వారు
  rationale: ఈ సర్వనామం ముందు సందర్భంలోని కుటుంబ సమూహాన్ని, ముఖ్యంగా యేసు తల్లిదండ్రులను, సూచిస్తుంది. ‘వారు’ అనడం మూలంలోని సాధారణ సూచనను అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: κατὰ τὸ ἔθος
  choice: ఆచారం ప్రకారం
  rationale: స్థిరపడిన ఆచరణకు అనుగుణంగా చేయడాన్ని సహజంగా, మూలానికి సమీపంగా వ్యక్తం చేస్తుంది.
- source_word: τῆς ἑορτῆς
  choice: పండుగ
  rationale: ἑορτή మతపరమైన పండుగను సూచిస్తుంది. ముందటి వచనంలో అది పస్కా పండుగగా గుర్తించబడింది.
- source_word: καὶ ὅτε
  choice: వచ్చినప్పుడు
  rationale: తెలుగు వాక్యనిర్మాణంలో కాలసంబంధ ఉపవాక్యాన్ని సహజంగా వ్యక్తం చేస్తుంది. καί యొక్క కథన కొనసాగింపు భావం సందర్భం మరియు వాక్య కొనసాగింపులో ప్రతిఫలిస్తుంది.
