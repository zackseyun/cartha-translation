translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని అసంపూర్ణంగా కొనసాగుతున్న వాక్య నిర్మాణాన్ని చివరి అల్పవిరామంతో నిలిపి, తదుపరి వచనంతో ఉన్న అనుసంధానాన్ని కాపాడింది.
