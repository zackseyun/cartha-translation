    reason: textual_variant
  revision_rationale: The revision replaces a potentially merit-implying expression with wording that naturally conveys people as recipients of God’s favor. It retains the Greek syntactic distinction between the adopted genitive reading and the nominative textual variant, while keeping the verse’s elevated modern Telugu register.
