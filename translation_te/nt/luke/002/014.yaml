  text: Δόξα ἐν ὑψίστοις θεῷ καὶ ἐπὶ γῆς εἰρήνη ἐν ἀνθρώποις ⸀εὐδοκίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/014.yaml
  text: Glory to God in the highest[c][b][a], and on earth peace among people of good pleasure.
translation:
  language: te
  text: '“అత్యున్నత స్థలాల్లో దేవునికి మహిమ,

    భూమిపై దేవుని అనుగ్రహం పొందిన ప్రజల మధ్య శాంతి.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు ప్రసన్నమైన ప్రజల మధ్య.”
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రాచీన ప్రతుల్లో, “భూమిపై శాంతి, మనుషుల పట్ల సద్భావం” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: Δόξα
  choice: మహిమ
  rationale: ఇక్కడ దేవునికి ఆపాదించే మహిమను ప్రకటించే ఉద్ఘాటన. ‘మహిమ’ ఆరాధనా, దైవశాస్త్రీయ గంభీరతను సహజంగా నిలుపుతుంది.
- source_word: ἐν ὑψίστοις
  choice: అత్యున్నత స్థలాల్లో
  rationale: అత్యున్నత పరలోక ప్రాంతాన్ని సూచించే బహువచన స్థలార్థాన్ని నిలుపుతూ, తెలుగులో అర్థవంతంగా ఉంటుంది.
- source_word: θεῷ
  choice: దేవునికి
  rationale: గ్రీకు చతుర్థీ విభక్తిలోని మహిమ ఆపాదనను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ γῆς
  choice: భూమిపై
  rationale: అత్యున్నత స్థలాలతో ఉన్న స్థలవ్యతిరేకతను నేరుగా నిలుపుతుంది.
- source_word: εἰρήνη
  choice: శాంతి
  rationale: ఈ సందర్భంలోని విస్తృత బైబిలీయ భావాన్ని తెలిపే సహజమైన తెలుగు పదం.
- source_word: ἐν ἀνθρώποις
  choice: ప్రజల మధ్య
  rationale: ἄνθρωποι ఇక్కడ సమస్త మానవులను లింగభేదం లేకుండా సూచించగల సాధారణ బహువచనం; ‘ప్రజలు’ ఆధునిక తెలుగులో సహజమైన సమగ్ర రూపం.
- source_word: εὐδοκίας
  choice: ఆయన అనుగ్రహానికి పాత్రులైన
  rationale: జన్య విభక్తి εὐδοκίας ప్రజలను దేవుని ప్రసన్నత లేదా అనుగ్రహంతో సంబంధం ఉన్నవారిగా నిర్దేశిస్తుంది. తెలుగులో అసహజమైన ‘మంచి ఇష్టానికి చెందిన’ రూపాన్ని తప్పించి, భావాన్ని స్పష్టంగా అందిస్తుంది; ‘ఆయన’ మూలంలో ప్రత్యక్షంగా లేకపోయినా సందర్భానుసారంగా దేవునినే సూచిస్తుంది.
theological_decisions:
- issue: εὐδοκίας అనే జన్య రూపం యొక్క భావం
  choice: శాంతి దేవుని అనుగ్రహానికి పాత్రులైన ప్రజల మధ్య ఉందని అనువదించడం
  alternative: ‘ఆయన ప్రసన్నత పొందిన ప్రజల మధ్య’
  rationale: SBLGNTలో జన్య రూపమైన εὐδοκίας ఉంది; అది ‘శాంతి, సద్భావం’ అనే మూడు భాగాల ప్రకటనకన్నా, ప్రజలను అనుగ్రహం/ప్రసన్నతతో విశేషించే నిర్మాణానికి మద్దతిస్తుంది. ‘అనుగ్రహానికి పాత్రులైన’ అనే రూపం పూర్తి ఎన్నిక సిద్ధాంతాన్ని చొప్పించకుండా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- issue: εὐδοκία అనే నామవిభక్తి పాఠభేదం
  choice: ప్రధాన పాఠంలో SBLGNT జన్య పాఠాన్ని అనుసరించడం
  alternative: ‘భూమిపై శాంతి, మనుషుల పట్ల సద్భావం’
  rationale: అనుసరించాల్సిన ముద్రిత మూలపాఠం εὐδοκίας అని చదువుతుంది. సంప్రదాయ ప్రభావం కలిగిన εὐδοκία పాఠాన్ని పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన కీర్తనా శైలిని నిలిపాం. గ్రీకు ἄνθρωποι లింగసమగ్రంగా వాడబడినందున ‘ప్రజలు’ అని అనువదించాం; ప్రత్యేక సాంస్కృతిక పాదసూచిక అవసరం లేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
