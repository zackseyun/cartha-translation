revisions:
- from: '“అత్యున్నత స్థలాల్లో దేవునికి మహిమ,

    భూమిపై ఆయన అనుగ్రహానికి పాత్రులైన ప్రజల మధ్య శాంతి.”[a][b]'
  to: '“అత్యున్నత స్థలాల్లో దేవునికి మహిమ,

    భూమిపై దేవుని అనుగ్రహం పొందిన ప్రజల మధ్య శాంతి.”[a][b]'
