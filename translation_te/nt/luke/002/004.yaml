revisions:
- from: యోసేపు కూడా గలిలయలోని నజరేతు పట్టణం నుంచి యూదయకు, దావీదు పట్టణమని పిలువబడే బేత్లెహేముకు వెళ్లాడు. ఎందుకంటే అతడు దావీదు వంశగృహానికీ వంశపరంపరకూ చెందినవాడు.[a]
  to: యోసేపు కూడా గలిలయలోని నజరేతు పట్టణం నుండి యూదయకు, దావీదు పట్టణమని పిలువబడే బేత్లెహేముకు ఎక్కి వెళ్లాడు; ఎందుకంటే అతడు దావీదు ఇంటివాడూ, దావీదు వంశస్థుడూ.[a]
  rationale: The revision retains the source’s upward-motion nuance, improves modern Telugu readability, and renders οἶκος and πατριά as two distinct but related ancestry terms. The footnote remains correctly anchored at the paired expression and explains the lexical distinction without expanding the text’s theological claim.
