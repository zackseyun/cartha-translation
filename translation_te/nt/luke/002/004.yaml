id: LUK.2.4
reference: Luke 2:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀνέβη δὲ καὶ Ἰωσὴφ ἀπὸ τῆς Γαλιλαίας ἐκ πόλεως Ναζαρὲθ εἰς τὴν Ἰουδαίαν εἰς πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ, διὰ τὸ εἶναι αὐτὸν ἐξ οἴκου καὶ πατριᾶς Δαυίδ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/004.yaml
  text: And Joseph also went up from Galilee[a], from the town of Nazareth, to Judea, to the city of David which is called Bethlehem, because he was from the house and family line of David,
translation:
  language: te
  text: యోసేపు కూడా గలిలయలోని నజరేతు పట్టణం నుండి యూదయకు, దావీదు పట్టణమని పిలువబడే బేత్లెహేముకు ఎక్కి వెళ్లాడు; ఎందుకంటే అతడు దావీదు ఇంటివాడూ, దావీదు వంశస్థుడూ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో ‘ఇల్లు’ మరియు ‘వంశం’ అనే పూర్వీకత్వాన్ని సూచించే రెండు సంబంధిత పదాలు ఉన్నాయి; ఇవి యోసేపుకు దావీదుతో ఉన్న వంశసంబంధాన్ని నొక్కిచెబుతున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέβη
  choice: వెళ్లాడు
  rationale: యూదయ వైపు ఎక్కివెళ్లడాన్ని సూచించే గ్రీకు ప్రయాణ నుడికారాన్ని తెలుగులో సహజంగా ‘వెళ్లాడు’ అని ఇచ్చాం; ‘పైకి వెళ్లాడు’ ఇక్కడ అసహజంగా లేదా కేవలం ఎత్తును సూచించేదిగా వినిపించవచ్చు.
- source_word: δὲ καὶ
  choice: కూడా
  rationale: కథన కొనసాగింపును తెలుగులో వాక్యక్రమమే తెలియజేస్తుంది; καίలోని చేరిక భావాన్ని ‘కూడా’ నిలుపుతుంది.
- source_word: ἐκ πόλεως Ναζαρὲθ
  choice: నజరేతు పట్టణం నుంచి
  rationale: πόλιςకు సందర్భోచితంగా ‘పట్టణం’ వాడి, స్థలనామాన్ని ప్రామాణిక తెలుగు రూపంలో ఇచ్చాం.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: యూదయకు
  rationale: రోమా కాలపు ప్రాంతాన్ని సూచించే ప్రామాణిక భౌగోళిక పేరు.
- source_word: εἰς πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ
  choice: దావీదు పట్టణమని పిలువబడే బేత్లెహేముకు
  rationale: బేత్లెహేమును ‘దావీదు పట్టణం’గా గుర్తించే సంబంధ వాక్య నిర్మాణాన్నీ దావీదు అనుబంధాన్నీ నిలిపాం.
- source_word: διὰ τὸ εἶναι αὐτὸν
  choice: ఎందుకంటే అతడు … చెందినవాడు
  rationale: διάతో కూడిన articular infinitive కారణాన్ని తెలుపుతుంది; తెలుగులో సహజమైన కారణ వాక్యంగా మార్చాం.
- source_word: ἐξ οἴκου καὶ πατριᾶς Δαυίδ
  choice: దావీదు వంశగృహానికీ వంశపరంపరకూ చెందినవాడు
  rationale: οἶκος, πατριά అనే రెండు పూర్వీకత్వ పదాలను ఒకటిగా కలపకుండా, రాజవంశ సంబంధాన్నీ పితృవంశ పరంపరనూ వేర్వేరుగా ప్రతిబింబించాం.
theological_decisions:
- issue: దావీదు సంతతి సూచించే ద్వంద్వ పదప్రయోగం
  choice: దావీదు వంశగృహానికీ వంశపరంపరకూ చెందినవాడు
  alternative: దావీదు ఇంటివాడూ వంశస్థుడూ
  rationale: οἶκος మరియు πατριά రెండింటినీ నిలిపి, యోసేపు దావీదు వంశసంబంధాన్ని స్పష్టం చేస్తుంది; పాఠానికి మించిన సిద్ధాంత నిర్ధారణను జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘వంశగృహం’ కొంత సాహిత్యపరమైనదైనా దావీదు రాజవంశ భావాన్ని కాపాడుతుంది; ‘వంశపరంపర’ సాధారణ పాఠకుడికి అర్థమయ్యేలా πατριάలోని పూర్వీకత్వ భావాన్ని వ్యక్తం చేస్తుంది.
