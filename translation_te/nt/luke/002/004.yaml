review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies Joseph, Galilee, Nazareth, Judea, Bethlehem as David’s city, and the causal basis in Davidic ancestry. However, Ἀνέβη (‘went up’) is reduced to ‘వెళ్లాడు’; a natural Telugu equivalent can retain the upward-travel nuance. The final ancestry expression should also avoid the opaque coinage ‘వంశగృహం’ while retaining the distinction between οἶκος and πατριά.
  naturalness: ‘వంశగృహం’ is not idiomatic modern standard Telugu and is likely unclear to general readers. ‘దావీదు ఇంటివాడూ, దావీదు వంశస్థుడూ’ is natural and preserves the paired ancestry concepts. Joining the causal clause with a semicolon produces a smoother Telugu narrative sentence.
  terminology: ‘యోసేపు,’ ‘గలిలయ,’ ‘నజరేతు,’ ‘యూదయ,’ ‘దావీదు,’ and ‘బేత్లెహేము’ are suitable standard Telugu biblical forms. ‘ఇంటివాడు’ conveys οἶκος in its family/dynastic sense in this context, while ‘వంశస్థుడు’ appropriately conveys πατριά without importing doctrinal conclusions.
  issues:
  - severity: medium
    issue: The upward-travel sense of Ἀνέβη is omitted.
    rationale: Although ‘వెళ్లాడు’ is natural, ‘ఎక్కి వెళ్లాడు’ naturally preserves the source’s marked upward-travel idiom.
  - severity: medium
    issue: ‘వంశగృహం’ is unnatural and semantically opaque.
    rationale: The expression is not usual modern Telugu. A paired expression using ‘ఇంటివాడు’ and ‘వంశస్థుడు’ is clearer while preserving both Greek ancestry terms.
  revised_text: యోసేపు కూడా గలిలయలోని నజరేతు పట్టణం నుండి యూదయకు, దావీదు పట్టణమని పిలువబడే బేత్లెహేముకు ఎక్కి వెళ్లాడు; ఎందుకంటే అతడు దావీదు ఇంటివాడూ, దావీదు వంశస్థుడూ.[a]
