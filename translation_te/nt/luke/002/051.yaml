source:
  edition: SBLGNT
  text: καὶ κατέβη μετ’ αὐτῶν καὶ ἦλθεν εἰς Ναζαρέθ, καὶ ἦν ὑποτασσόμενος αὐτοῖς. καὶ ἡ μήτηρ αὐτοῦ διετήρει πάντα τὰ ῥήματα ⸀ταῦτα ἐν τῇ καρδίᾳ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/051.yaml
  text: And he went down with them and came to Nazareth[a], and he was subject to them[b]. And his mother kept all these things in her heart.
translation:
  language: te
  text: ఆయన వారితో కలిసి దిగి నజరేతుకు వచ్చాడు. ఆయన వారికి లోబడి ఉండేవాడు[a]. ఆయన తల్లి ఈ సంగతులన్నిటినీ[b] తన హృదయంలో దాచుకొని ఉంచేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారికి విధేయుడై ఉండేవాడు.” ఇక్కడి గ్రీకు నిర్మాణం కొనసాగుతూ వచ్చిన లోబడుటను లేదా విధేయతను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఈ మాటలన్నిటినీ.” గ్రీకు పదం పలికిన మాటలను, సూక్తులను, లేదా వాటి ద్వారా తెలియజేయబడిన సంగతులను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: దిగి
  rationale: యెరూషలేము నుండి నజరేతుకు జరిగిన భౌగోళిక దిగువ ప్రయాణ భావాన్ని సరళంగా నిలుపుతుంది.
- source_word: μετ’ αὐτῶν
  choice: వారితో కలిసి
  rationale: మరియ, యోసేపులతో కూడిన సహప్రయాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἦλθεν εἰς Ναζαρέθ
  choice: నజరేతుకు వచ్చాడు
  rationale: కథన దృష్టికోణానికి అనుగుణంగా ἔρχομαι యొక్క వచ్చుట/వెళ్లుట భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἦν ὑποτασσόμενος αὐτοῖς
  choice: వారికి లోబడి ఉండేవాడు
  rationale: అపరిణత కాల సహాయక క్రియతో కూడిన వర్తమాన కృదంత నిర్మాణం సూచించే కొనసాగుతున్న లోబడుటను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: διετήρει
  choice: భద్రంగా దాచుకుంది
  rationale: διατηρέω లోని జాగ్రత్తగా కాపాడుకొని ఉంచే భావాన్ని, కేవలం ‘ఉంచుకుంది’ కంటే స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: ఈ సంగతులన్నిటినీ
  rationale: ఈ సందర్భంలో ῥήματα పలికిన మాటలతో పాటు వాటి ద్వారా తెలియజేయబడిన విషయాలను కూడా సూచించగలదు; ‘సంగతులు’ తెలుగులో సహజంగా ఆ విస్తృతిని నిలుపుతుంది.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: తన హృదయంలో
  rationale: అంతరంగ జ్ఞాపకం, ధ్యానం అనే బైబిలు రూపకాన్ని వ్యాఖ్యానాత్మకంగా విప్పకుండా నిలుపుతుంది.
theological_decisions:
- issue: యేసు తన భౌతిక తల్లిదండ్రులతో కలిగిన సంబంధం
  choice: ఆయన వారికి లోబడి ఉండేవాడు
  alternative: ఆయన వారికి విధేయుడై ఉండేవాడు
  rationale: గ్రీకు వాక్యం మరియ, యోసేపుల పట్ల యేసు కొనసాగించిన లోబడుటను స్పష్టంగా చెబుతుంది. ఆయన దైవస్వరూపాన్ని తగ్గించకుండా, తరువాతి సిద్ధాంత వివరణను చేర్చకుండా వాక్యంలోని ఉద్రిక్తతను యథాతథంగా ఉంచుతుంది.
- issue: ῥήματα యొక్క సందర్భార్థం
  choice: ఈ సంగతులన్నిటినీ
  alternative: ఈ మాటలన్నిటినీ
  rationale: ఈ పదం పలికిన మాటలను గానీ, ఆ మాటలు సూచించిన విషయాలను గానీ తెలిపే అవకాశం ఉంది. ప్రధాన పాఠ్యంలో సందర్భోచితమైన విస్తృత అర్థాన్ని ఎంచుకుని, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘లోబడి ఉండేవాడు’ కొనసాగుతున్న క్రియను తెలియజేస్తుంది; ‘తన హృదయంలో భద్రంగా దాచుకుంది’ జాగ్రత్తగా జ్ఞాపకంలో ఉంచుకున్న భావాన్ని నిలుపుతుంది.
