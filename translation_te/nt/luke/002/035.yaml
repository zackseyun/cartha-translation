id: LUK.2.35
reference: Luke 2:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ σοῦ ⸀δὲ αὐτῆς τὴν ψυχὴν διελεύσεται ῥομφαία, ὅπως ἂν ἀποκαλυφθῶσιν ἐκ πολλῶν καρδιῶν διαλογισμοί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/035.yaml
  text: and a sword will pass through your own soul also[b][a], so that the thoughts of many hearts may be revealed.
translation:
  language: te
  text: నీ సొంత ప్రాణం గుండా కూడా ఒక ఖడ్గం దాటిపోతుంది[a][b], అనేకుల హృదయాల్లోని ఆలోచనలు బయలుపడేలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చీల్చుకుంటూ పోతుంది.’ గ్రీకు క్రియకు అక్షరార్థంగా ‘గుండా పోతుంది’ అనే భావం ఉంది; ఖడ్గం అనే ప్రతిరూపం సహజంగానే చీల్చడం లేదా గుచ్చడం అనే భావాన్ని కలిగిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘ఖడ్గం’ మరియ అనుభవించబోయే తీవ్రమైన వేదనకు రూపకంగా సాధారణంగా అర్థం చేసుకోబడుతుంది.
    reason: cultural_note
lexical_decisions:
- source_word: σοῦ ... αὐτῆς
  choice: నీ సొంత
  rationale: σοῦతో కూడిన αὐτῆς మరియను ఉద్దేశించిన వ్యక్తిగత నొక్కిచెప్పుదలను వ్యక్తం చేస్తుంది; ‘నీ సొంత’ దానిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ψυχή
  choice: ప్రాణం
  rationale: ఇక్కడ ψυχή కేవలం భౌతిక జీవాన్ని కాక, తీవ్రమైన వేదనను అనుభవించే అంతరంగ వ్యక్తిని సూచిస్తుంది. తరువాత వచ్చే ‘హృదయాలు’తో పదభేదాన్ని కూడా ఇది కాపాడుతుంది.
- source_word: διελεύσεται
  choice: గుండా ... దూసుకుపోతుంది
  rationale: క్రియ యొక్క ప్రాథమిక భావం ‘గుండా పోవడం.’ ఖడ్గం అనే ప్రతిరూపానికి తగిన తీవ్రతను ‘దూసుకుపోతుంది’ సహజంగా తెలియజేస్తుంది; అయితే ‘చీల్చుతుంది’ అని మాత్రమే అనువదించి క్రియలో లేని భావాన్ని ఖరారు చేయదు.
- source_word: ῥομφαία
  choice: ఖడ్గం
  rationale: ῥομφαία పెద్దదైన, భయంకరమైన కత్తిని సూచించగలదు. ప్రవచనాత్మకమైన ఈ సందర్భంలో ‘ఖడ్గం’ సంక్షిప్తంగా, గంభీరంగా, సహజంగా ఉంది.
- source_word: ὅπως ἂν
  choice: తద్వారా
  rationale: ఇది ఉద్దేశం లేదా ఫలితాన్ని పరిచయం చేయగల నిర్మాణం. ‘తద్వారా’ ముందరి మాటకూ హృదయాలోచనలు బయలుపడటానికీ ఉన్న సంబంధాన్ని నిలుపుతూ రెండింటిలో ఒక్కదానినే బలవంతంగా నిర్ణయించదు.
- source_word: ἀποκαλυφθῶσιν
  choice: బయలుపడతాయి
  rationale: గ్రీకు కర్మణి భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, అంతర్గతమైనది వెల్లడవుతుందనే అర్థాన్ని కాపాడుతుంది.
- source_word: ἐκ πολλῶν καρδιῶν διαλογισμοί
  choice: అనేకుల హృదయాల్లోని ఆలోచనలు
  rationale: ἐκ సూచించే అంతర్గత మూలాన్ని ‘హృదయాల్లోని’ సహజంగా తెలియజేస్తుంది. διαλογισμοί మంచి లేదా చెడు తలంపులని ముందుగానే నిర్ణయించకుండా విస్తృతమైన ‘ఆలోచనలు’గా అనువదించబడింది.
theological_decisions:
- issue: మరియను ఉద్దేశించిన ప్రవచనం మరియు ‘ఖడ్గం’ రూపకం
  choice: మరియకు కలిగే తీవ్రమైన వ్యక్తిగత వేదనను సూచించే ప్రత్యక్ష సంబోధనగా ఉంచి, ఆ వేదన ఏ సంఘటన ద్వారా నెరవేరుతుందో ప్రధాన పాఠ్యంలో నిర్దిష్టం చేయలేదు.
  alternative: దీనిని ప్రత్యేకంగా యేసు సిలువ మరణం వద్ద మరియ అనుభవించిన దుఃఖంగా, లేదా యేసు సేవ కలిగించిన విభజన వల్ల వచ్చిన వేదనగా వివరించడం.
  rationale: గ్రీకు పాఠ్యం మరియను నేరుగా ఉద్దేశిస్తుంది; కానీ ఖడ్గం అనే రూపకపు ఖచ్చితమైన చారిత్రక నెరవేర్పును ఈ వాక్యం స్వయంగా పేర్కొనదు. అందువల్ల ఆ ఉద్దేశపూర్వక అనిర్దిష్టతను నిలుపుకోవాలి.
- issue: ὅπως ἂνలో ఉద్దేశం–ఫలితం సంబంధం
  choice: ‘తద్వారా’ అని అనువదించి, ముందరి వేదన/విభజనతో హృదయాలోచనలు వెల్లడవడం మధ్య సంబంధాన్ని ఉంచింది.
  alternative: ‘ఈ ఉద్దేశంతో’ అని కేవలం ఉద్దేశంగా లేదా ‘దాని ఫలితంగా’ అని కేవలం ఫలితంగా ఖరారు చేయడం.
  rationale: ఈ గ్రీకు నిర్మాణం సందర్భంలో ఉద్దేశం లేదా ఉద్దేశిత ఫలితాన్ని సూచించగలదు; అనువాదం ఆ ఉద్రిక్తతను అనవసరంగా పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన ప్రవచన శైలిని ఉంచాం. ‘ఖడ్గం,’ ‘ప్రాణం,’ ‘హృదయాలు’ వంటి సుపరిచిత బైబిలీయ పదాలను వాడినా, పాతకాలపు క్రియారూపాలు మరియు కృత్రిమ పదక్రమాన్ని నివారించాం.
