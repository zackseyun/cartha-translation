review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the direct address, the emphatic ‘your own,’ the sword image, and the disclosure of inward thoughts. However, ‘తద్వారా ... బయలుపడతాయి’ states a straightforward result, whereas ὅπως ἂν introduces purpose or intended result and is better represented by a Telugu purpose construction.
  naturalness: The wording is generally modern, clear, and suitably solemn. ‘దూసుకుపోతుంది’ is understandable, but it adds an unnecessary nuance of rapid motion. ‘దాటిపోతుంది’ conveys passage through more directly and idiomatically in this figurative context.
  terminology: ‘ఖడ్గం,’ ‘ప్రాణం,’ ‘హృదయాలు,’ and ‘ఆలోచనలు’ are appropriate and preserve the distinction between ψυχή and καρδία. The notes appropriately retain the metaphor’s non-specificity.
  issues:
  - severity: medium
    issue: The clause introduced by ὅπως ἂν is rendered as an unqualified result.
    rationale: ‘తద్వారా అనేకుల హృదయాల్లోని ఆలోచనలు బయలుపడతాయి’ can mean ‘thereby ... will be revealed,’ but does not naturally express the Greek purpose/intended-result force. ‘... బయలుపడేలా’ preserves that connection without over-resolving purpose versus result.
  - severity: low
    issue: ‘దూసుకుపోతుంది’ adds a speed nuance not supplied by διελεύσεται.
    rationale: The Greek means ‘will pass/go through.’ ‘దాటిపోతుంది’ is a closer, natural Telugu rendering while the sword image itself supplies the severity.
  revised_text: నీ సొంత ప్రాణం గుండా కూడా ఒక ఖడ్గం దాటిపోతుంది[a][b], అనేకుల హృదయాల్లోని ఆలోచనలు బయలుపడేలా.
