revisions:
- from: నీ సొంత ప్రాణం గుండా కూడా ఒక ఖడ్గం దూసుకుపోతుంది[a][b]. తద్వారా అనేకుల హృదయాల్లోని ఆలోచనలు బయలుపడతాయి.
  to: నీ సొంత ప్రాణం గుండా కూడా ఒక ఖడ్గం దాటిపోతుంది[a][b], అనేకుల హృదయాల్లోని ఆలోచనలు బయలుపడేలా.
  rationale: The revision more closely reflects διελεύσεται with ‘దాటిపోతుంది’ and represents ὅπως ἂν with the purpose/intended-result construction ‘బయలుపడేలా.’ It preserves the Greek ambiguity about the precise historical referent of the sword and retains both existing footnotes with correctly anchored markers.
