  text: And he took him into his arms and blessed God and said,[a]
translation:
  language: te
  text: 'అతడు ఆ శిశువును తన చేతుల్లోకి తీసుకొని[a], దేవుణ్ణి స్తుతించి ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ శిశువును తన చేతుల్లోకి స్వీకరించి.” గ్రీకు క్రియకు “స్వీకరించు” లేదా “ఆహ్వానించు” అనే అర్థాలు ఉండగలవు; అయితే ఇక్కడ “చేతుల్లోకి” అనే పదబంధం వల్ల “తీసుకొని” అనేదే అత్యంత సహజమైన భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξατο
  choice: తీసుకొని
  rationale: δέχομαι సాధారణంగా ‘స్వీకరించు’ లేదా ‘ఆహ్వానించు’ అని అర్థమివ్వగలదు; అయితే ‘చేతుల్లోకి’ అనే తరువాతి పదబంధంతో ఇక్కడ శిశువును చేతుల్లోకి తీసుకున్న భౌతిక చర్యే సహజమైన భావం.
- source_word: αὐτό
  choice: ఆ శిశువును
  rationale: గ్రీకులో సర్వనామం నపుంసకలింగంలో ఉన్నా, అది బాలుడైన యేసును సూచిస్తుంది. తెలుగులో వ్యక్తిని సూచిస్తూ స్పష్టతను కాపాడేందుకు సందర్భానుసారంగా ‘ఆ శిశువును’ అని అనువదించాం.
- source_word: εἰς τὰς ἀγκάλας
  choice: తన చేతుల్లోకి
  rationale: ἀγκάλαι అనేది కౌగిలించుకోవడానికి లేదా మోసుకోవడానికి ఉపయోగించే చేతులను సూచిస్తుంది. గ్రీకులో స్వామ్యసూచక పదం స్పష్టంగా లేకపోయినా, సందర్భంలో అవి సుమెయోను చేతులే కనుక తెలుగులో ‘తన చేతుల్లోకి’ సహజంగా ఉంది.
- source_word: εὐλόγησεν τὸν θεόν
  choice: దేవుణ్ణి స్తుతిస్తూ
  rationale: దేవుడు కర్మగా ఉన్నప్పుడు εὐλογέω దేవుణ్ణి ఘనపరచడం లేదా స్తుతించడం అనే భావాన్ని ఇస్తుంది. తెలుగులో ‘దేవుణ్ణి ఆశీర్వదించాడు’ అనడం దేవునికి మేలు కలిగించాడనే అపార్థం కలిగించవచ్చు; అందువల్ల ‘స్తుతిస్తూ’ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: καὶ εἶπεν
  choice: ఇలా అన్నాడు
  rationale: ఇది తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది. ‘ఇలా అన్నాడు’ ఆధునిక తెలుగు కథనంలో సహజంగా ఉండి, గ్రీకు క్రియ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: αὐτός
  choice: అతడు
  rationale: ఇది కథనంలోని కర్తను కొనసాగిస్తూ స్వల్ప ఉద్ఘాటనను ఇస్తుంది. ఈ సందర్భంలో ‘అతడే’ అనడం అవసరానికి మించిన ఉద్ఘాటన అవుతుంది.
theological_decisions:
- issue: నపుంసకలింగ సర్వనామమైన αὐτό ఎవరిని సూచిస్తుంది?
  choice: ఇది శిశువైన యేసును వ్యక్తిగతంగా సూచిస్తుంది; అందుకే ‘ఆ శిశువును’ అని అనువదించాం.
  alternative: వ్యాకరణ లింగాన్ని యాంత్రికంగా అనుసరించి వ్యక్తిత్వరహిత నపుంసక సర్వనామంతో అనువదించడం.
  rationale: గ్రీకు వ్యాకరణ లింగం ‘శిశువు’ అనే సూచిత నామానికి అనుగుణంగా ఉంటుంది; కానీ సూచించబడుతున్నది యేసు అనే వ్యక్తి. సందర్భానుసారమైన వ్యక్తి సూచన కథనాన్ని మాత్రమే స్పష్టం చేస్తుంది, అదనపు సిద్ధాంతాన్ని చేర్చదు.
- issue: εὐλόγησεν τὸν θεόν ను పదశః ‘దేవుణ్ణి ఆశీర్వదించాడు’ అని అనువదించాలా?
  choice: దేవుణ్ణి స్తుతించాడు అనే భావంతో ‘దేవుణ్ణి స్తుతిస్తూ’ అని అనువదించాం.
  alternative: ‘దేవుణ్ణి ఆశీర్వదించి’ అని పదరూపాన్ని నేరుగా నిలుపుకోవడం.
  rationale: దేవుడు కర్మగా ఉన్న ఈ వాడుకలో క్రియ దేవుణ్ణి కొనియాడడం అనే అర్థం ఇస్తుంది. ఆధునిక తెలుగులో ‘దేవుణ్ణి ఆశీర్వదించడం’ తప్పుగా అర్థమయ్యే అవకాశం ఉన్నందున భావస్పష్టతకు ప్రాధాన్యమిచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని వరుస καί సంధులను యాంత్రికంగా పునరావృతం చేయకుండా, తెలుగు ప్రవాహానికి అనుగుణంగా ‘అప్పుడు’, కృదంత నిర్మాణం, ‘ఇలా’ వాడాం. ప్రధాన పాఠంలోని [a] సూచిక సంబంధిత పదబంధం తరువాత కాక, వాక్యాంతంలో ఆంగ్ల సంప్రదింపుపాఠానికి అనుగుణంగా ఉంచబడింది.
