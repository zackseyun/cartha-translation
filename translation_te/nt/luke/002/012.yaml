id: LUK.2.12
reference: Luke 2:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τοῦτο ὑμῖν ⸀τὸ σημεῖον, εὑρήσετε βρέφος ἐσπαργανωμένον ⸀καὶ κείμενον ἐν φάτνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/012.yaml
  text: 'And this will be the sign for you: you will find a baby wrapped in cloths and lying in a manger[a][b].'
translation:
  language: te
  text: 'ఇదే మీకు సూచన: బట్టలతో చుట్టబడి, పశువుల మేత తొట్టిలో పడుకొని ఉన్న ఒక పసిబిడ్డను మీరు కనుగొంటారు.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పొత్తిగుడ్డలతో చుట్టబడి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పశువుల తొట్టెలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: సూచన
  rationale: ఇక్కడ ఈ పదం గొర్రెల కాపరులు శిశువును గుర్తించడానికి ఇవ్వబడిన గుర్తింపును సూచిస్తుంది. ‘సూచన’ సహజమైన ఆధునిక తెలుగు; ఇది అద్భుతమైన రుజువు అని అదనంగా వ్యాఖ్యానించదు.
- source_word: εὑρήσετε
  choice: మీరు కనుగొంటారు
  rationale: భవిష్యత్ సూచక క్రియారూపంలోని నేరమైన అర్థాన్ని నిలుపుతుంది; దేవదూత చెప్పిన ముందస్తు సమాచారానికి సరిపోతుంది.
- source_word: βρέφος
  choice: ఒక పసిబిడ్డను
  rationale: βρέφος చాలా చిన్న వయసున్న శిశువును సూచిస్తుంది. ‘పసిబిడ్డ’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ἐσπαργανωμένον
  choice: బట్టలతో చుట్టబడి
  rationale: శిశువును వస్త్రాలతో చుట్టిన స్థితిని స్పష్టంగా తెలియజేస్తుంది. మూలపదం ప్రత్యేకంగా శిశువును చుట్టే వస్త్రాలను సూచించగలదని ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: κείμενον
  choice: పడుకొని ఉన్న
  rationale: κεῖμαι సూచించే ప్రస్తుత స్థితి లేదా భంగిమను తెలియజేస్తుంది; ముందుగా ఎవరో పడుకోబెట్టిన చర్యను అనవసరంగా ప్రధానంగా చేయదు.
- source_word: φάτνῃ
  choice: పశువుల మేత తొట్టిలో
  rationale: φάτνη యొక్క స్పష్టమైన వస్తుగత అర్థాన్ని సాధారణ తెలుగు పాఠకునికి నేరుగా తెలియజేస్తుంది; సంప్రదాయ తెలుగు పదమైన ‘తొట్టె’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇస్తుంది.
- source_word: τοῦτο ὑμῖν τὸ σημεῖον
  choice: ఇదే మీకు సూచన
  rationale: గ్రీకులోని స్వల్పంగా అధ్యాహారమైన నామవాక్యాన్ని తెలుగులో సహజంగా అందిస్తూ, తరువాత చెప్పేది గొర్రెల కాపరులకు ఇచ్చిన గుర్తింపు సూచన అని తెలియజేస్తుంది.
theological_decisions:
- issue: గొర్రెల కాపరులకు ఇవ్వబడిన సూచన స్వభావం
  choice: శిశువును గుర్తించడానికి ఇచ్చిన సూచనగా అనువదించడం
  alternative: దైవిక నిర్ధారణను తెలిపే అద్భుత సూచకచిహ్నంగా స్పష్టీకరించడం
  rationale: వాక్యం ప్రధానంగా శిశువును వారు ఎలా గుర్తిస్తారో చెబుతుంది. అందువల్ల అనువాదం ‘సూచన’ అనే స్పష్టమైన పదానికే పరిమితమై, దాని విస్తృత దైవశాస్త్రీయ ప్రాముఖ్యతను పాఠకుడి వ్యాఖ్యానానికి విడిచిపెడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘మేత తొట్టి’ ద్వారా φάτνη అర్థాన్ని స్పష్టంగా చేశాం; ‘పొత్తిగుడ్డలు’ వంటి సంప్రదాయ పదాన్ని పాదసూచికలో నిలిపాం.
