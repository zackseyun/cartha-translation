id: LUK.2.7
reference: Luke 2:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔτεκεν τὸν υἱὸν αὐτῆς τὸν πρωτότοκον, καὶ ἐσπαργάνωσεν αὐτὸν καὶ ἀνέκλινεν αὐτὸν ⸀ἐν φάτνῃ, διότι οὐκ ἦν αὐτοῖς τόπος ἐν τῷ καταλύματι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/007.yaml
  text: And she gave birth to her firstborn son[a], and wrapped him in cloths and laid him in a feeding trough[c][b], because there was no place for them in the guest room.
translation:
  language: te
  text: ఆమె తన మొదటిపుట్టిన కుమారుణ్ణి ప్రసవించి, ఆయనను గుడ్డలతో చుట్టి[a], పశువుల మేత తొట్టిలో ఉంచింది.[b] ఎందుకంటే అతిథి గదిలో[c] వారికి చోటు లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనను పొత్తిగుడ్డలతో చుట్టింది.’
    reason: lexical_alternative
  - marker: b
    text: సంప్రదాయంగా ‘పశువుల తొట్టి.’ గ్రీకు పదం పశువులకు మేత పెట్టే స్థలాన్ని లేదా తొట్టిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: సంప్రదాయంగా ‘సత్రం.’ గ్రీకు κατάλυμα అనే పదం అతిథి గది లేదా బసస్థలం అని అర్థం కావచ్చు. వాణిజ్య సత్రానికి లూకా 10:34లో వేరే గ్రీకు పదం వాడబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: కని
  rationale: ప్రసవ సందర్భంలో సహజమైన ఆధునిక తెలుగు ప్రయోగం; గ్రీకు క్రియలోని ప్రసవార్థాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: πρωτότοκον
  choice: తొలికుమారుణ్ణి
  rationale: ఇక్కడ జనన క్రమాన్ని సూచించే ‘మొదట పుట్టిన కుమారుడు’ అనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది; తరువాతి వేదాంతార్థాలను వాక్యంలోకి చేర్చదు.
- source_word: ἐσπαργάνωσεν
  choice: పొత్తిగుడ్డలతో చుట్టి
  rationale: శిశువును గుడ్డలతో చుట్టడాన్ని స్పష్టంగా తెలిపే సహజ తెలుగు; క్రియ యొక్క నిర్దిష్ట శిశుసంరక్షణ సందర్భాన్ని నిలుపుతుంది.
- source_word: ἀνέκλινεν
  choice: పడుకోబెట్టింది
  rationale: శిశువును ఒక చోట ఉంచి పరుండబెట్టడం అనే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: φάτνῃ
  choice: పశువుల మేత తొట్టిలో
  rationale: జంతువులకు మేత పెట్టే స్థలం లేదా తొట్టి అనే గ్రీకు పదం యొక్క స్పష్టమైన అర్థాన్ని ఆధునిక పాఠకునికి తెలియజేస్తుంది.
- source_word: τόπος
  choice: చోటు
  rationale: అందుబాటులో స్థలం లేకపోవడాన్ని సహజంగా, విస్తృతార్థంతో వ్యక్తం చేస్తుంది.
- source_word: καταλύματι
  choice: అతిథి గదిలో
  rationale: ఈ పదం అతిథులు బస చేసే గది లేదా బసస్థలాన్ని సూచించగలదు. లూకా 22:11లోని వినియోగంతో సరిపోతూ, వాణిజ్య సత్రాన్ని అనవసరంగా ఊహించదు.
theological_decisions:
- issue: κατάλυμα అనే పదాన్ని సంప్రదాయంగా ‘సత్రం’ అని అనువదించాలా, లేక ఇంటిలోని అతిథి స్థలాన్ని సూచించే పదంతో అనువదించాలా
  choice: అతిథి గది
  alternative: సత్రం; బసస్థలం
  rationale: గ్రీకు పదం తప్పనిసరిగా వాణిజ్య సత్రాన్ని సూచించదు. లూకా 10:34లో వాణిజ్య సత్రానికి πανδοχεῖον వాడగా, లూకా 22:11లో κατάλυμα అతిథి గదిని సూచిస్తుంది. అందువల్ల మూలభాషా ఆధారానికి ప్రాధాన్యమిస్తూ ‘అతిథి గది’ ఎంచుకోబడింది; సంప్రదాయ ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా సహజమైన వాక్యనిర్మాణం వాడబడింది. ‘తొలికుమారుడు,’ ‘పొత్తిగుడ్డలు’ వంటి పదాలు గౌరవప్రదమైన బైబిలు శైలిని నిలుపుతూ సులభంగా అర్థమయ్యేలా ఉన్నాయి. సంప్రదాయ జననదృశ్యంలో లేని వివరాలను చేర్చకుండా మూలంలోని క్రమం, కారణ సంబంధం నిలుపబడ్డాయి.
