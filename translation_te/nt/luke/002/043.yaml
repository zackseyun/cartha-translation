reference: Luke 2:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τελειωσάντων τὰς ἡμέρας, ἐν τῷ ὑποστρέφειν αὐτοὺς ὑπέμεινεν Ἰησοῦς ὁ παῖς ἐν Ἰερουσαλήμ, καὶ οὐκ ⸂ἔγνωσαν οἱ γονεῖς⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/043.yaml
  text: And when they had completed the days[a], as they were returning, Jesus the boy remained in Jerusalem[b], and his parents did not know it.
translation:
  language: te
  text: ఆ దినాలు ముగిసినప్పుడు, వారు తిరిగి వెళ్తుండగా, బాలుడైన యేసు యెరూషలేములో ఉండిపోయాడు[a]. ఆయన తల్లిదండ్రులకు[b] అది తెలియలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వెనుక ఉండిపోయాడు.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ‘ఆయన తల్లిదండ్రులు.’ ఇక్కడ లూకా ఉపయోగించిన సాధారణ కుటుంబ భాష, ఈ సువార్తలో ముందుగా చెప్పబడిన కన్యాగర్భధారణను నిరాకరించదు.
    reason: cross_reference
lexical_decisions:
- source_word: τελειωσάντων τὰς ἡμέρας
  choice: ఆ దినాలు ముగిసిన తరువాత
  rationale: జనిటివ్ అబ్సల్యూట్ ప్రధాన క్రియకు ముందు పూర్తయిన పరిస్థితిని సూచిస్తుంది. సమీప సందర్భంలో ఇవి పండుగ దినాలని స్పష్టమైనా, గ్రీకు వాక్యంలోని ‘దినాలు’ అనే ప్రయోగాన్ని అనవసరంగా విస్తరించకుండా నిలిపింది.
- source_word: ἐν τῷ ὑποστρέφειν αὐτοὺς
  choice: వారు తిరిగి వెళ్తుండగా
  rationale: ἐν తో కూడిన ఆర్టిక్యులర్ ఇన్ఫినిటివ్ సమకాలికంగా కొనసాగుతున్న చర్యను సూచిస్తుంది; తెలుగు ‘వెళ్తుండగా’ దాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑπέμεινεν
  choice: ఉండిపోయాడు
  rationale: ఈ సందర్భంలో ὑπομένω అక్కడే మిగిలి ఉండడం లేదా వెనుక ఉండిపోవడం అనే అర్థం ఇస్తుంది. ‘ఉండిపోయాడు’ ఆధునిక తెలుగులో సహజమైన కథన ప్రయోగం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: ὁ παῖς
  choice: బాలుడైన
  rationale: సమీప సందర్భంలో యేసుకు పన్నెండేళ్లు కావడంతో παῖς కు ‘బాలుడు’ వయస్సుకు తగిన, సహజమైన అనువాదం.
- source_word: ἐν Ἰερουσαλήμ
  choice: యెరూషలేములోనే
  rationale: స్థలాన్ని సూచించే ἐν ను ‘లో’తో అనువదించాం; యేసు అక్కడే మిగిలాడనే సందర్భార్థాన్ని సహజంగా తెలియజేయడానికి ఉద్ఘాటక ‘నే’ చేర్చాం.
- source_word: οὐκ ἔγνωσαν
  choice: అది తెలియలేదు
  rationale: ఇక్కడ γινώσκω ఒక విషయాన్ని తెలుసుకోవడం లేదా గ్రహించడం అనే అర్థంలో ఉంది. యేసు అక్కడ ఉండిపోయాడనే విషయాన్ని సూచించడానికి తెలుగులో సహజంగా ‘అది’ చేర్చాం.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: ఆయన తల్లిదండ్రులకు
  rationale: γονεῖς యొక్క నేరమైన అర్థం ‘తల్లిదండ్రులు.’ తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా చతుర్థీ విభక్తితో ఇచ్చాం.
theological_decisions:
- issue: మరియను, యోసేపును యేసు యొక్క γονεῖς అని పేర్కొనడం
  choice: ఆయన తల్లిదండ్రులకు
  alternative: ఆయన తల్లికీ యోసేపుకూ
  rationale: గ్రీకు పాఠం నేరుగా ‘ఆయన తల్లిదండ్రులు’ అంటుంది. లూకా సువార్తలో ముందుగా చెప్పబడిన కన్యాగర్భధారణను దీనితో నిరాకరించినట్లు భావించకుండా, రచయిత ఉపయోగించిన సాధారణ కుటుంబ భాషనూ దానిలోని వేదాంతపరమైన ఉద్రిక్తతనూ యథాతథంగా ఉంచాం.
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు కథనశైలిని ఉపయోగించాం. ‘బాలుడైన యేసు,’ ‘తల్లిదండ్రులు’ వంటి పదాలు సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా ఉండి, మూలపాఠపు గౌరవప్రద స్వరాన్ని నిలుపుతాయి.
