id: LUK.2.41
reference: Luke 2:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐπορεύοντο οἱ γονεῖς αὐτοῦ κατ’ ἔτος εἰς Ἰερουσαλὴμ τῇ ἑορτῇ τοῦ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/041.yaml
  text: And his parents went to Jerusalem year by year for the Feast of the Passover.
translation:
  language: te
  text: ఆయన తల్లిదండ్రులు ప్రతి సంవత్సరం పస్కా పండుగ కోసం యెరూషలేముకు వెళ్లేవారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: వెళ్లేవారు
  rationale: అసంపూర్ణ భూతకాల క్రియ ఇక్కడ గతంలో అలవాటుగా పునరావృతమైన చర్యను సూచిస్తుంది. ‘ప్రతి సంవత్సరం’తో కలిసి ‘వెళ్లేవారు’ ఆ భావాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: γονεῖς
  choice: తల్లిదండ్రులు
  rationale: ఈ బహువచన నామవాచకానికి సాధారణమైన, సహజమైన తెలుగు సమానార్థకం ‘తల్లిదండ్రులు’. మూలపాఠంలోని కుటుంబ సంబంధ పదాన్ని ఎలాంటి అదనపు సిద్ధాంత వివరణ లేకుండా నిలుపుతుంది.
- source_word: κατ’ ἔτος
  choice: ప్రతి సంవత్సరం
  rationale: κατά + ద్వితీయా విభక్తి ఇక్కడ సంవత్సరానికొకసారి జరిగే పునరావృతాన్ని సూచిస్తుంది. ‘ప్రతి సంవత్సరం’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: Ἰερουσαλὴμ
  choice: యెరూషలేము
  rationale: ఈ స్థలనామానికి తెలుగు బైబిలు వాడుకలో సుపరిచితమైన లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: τῇ ἑορτῇ
  choice: పండుగ కోసం
  rationale: ప్రయాణ సందర్భంలో ఈ దత్తివిభక్తి పండుగను ప్రయాణ సందర్భం లేదా ఉద్దేశంగా సూచిస్తుంది. ‘పండుగ కోసం’ ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τοῦ πάσχα
  choice: పస్కా
  rationale: πάσχα యూదుల ప్రత్యేక పండుగ పేరు. ‘పస్కా’ దాని సుపరిచితమైన తెలుగు లిప్యంతరీకరణ; ‘పండుగ’తో కలిపి దాని స్వభావం స్పష్టమవుతుంది.
theological_decisions:
- issue: యేసు కుటుంబ సభ్యుల ప్రస్తావన
  choice: ఆయన తల్లిదండ్రులు
  alternative: ఆయన తండ్రి, తల్లి
  rationale: గ్రీకు మూలపాఠం సాధారణంగా ‘ఆయన తల్లిదండ్రులు’ అని చెబుతుంది. లూకా గ్రంథంలోని కన్యాగర్భధారణ బోధకు విరుద్ధమైన వాదనను ఇది స్వయంగా చేయదు. కాబట్టి సిద్ధాంతపరమైన వివరణను చేర్చకుండా కథనంలోని సాధారణ కుటుంబ పదాన్నే అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గౌరవప్రదమైన కథన శైలిలో ఉంది. ‘వెళ్లేవారు’ ద్వారా గ్రీకు అసంపూర్ణ భూతకాలంలోని అలవాటుగా జరిగే చర్య భావం నిలుపబడింది.
