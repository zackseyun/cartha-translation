id: LUK.2.2
reference: Luke 2:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: (⸀αὕτη ἀπογραφὴ πρώτη ἐγένετο ἡγεμονεύοντος τῆς Συρίας Κυρηνίου·)
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/002.yaml
  text: This registration took place first while Quirinius was governing Syria[a][b].
translation:
  language: te
  text: కురేనియుడు సిరియాను పరిపాలిస్తున్నప్పుడు ఈ నమోదు మొదటిసారిగా జరిగింది.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కురేనియుడు సిరియాను పరిపాలించకముందు ఈ నమోదు జరిగింది.” ఇక్కడ “మొదటి” అనే గ్రీకు పదాన్ని కొందరు తులనాత్మక కాలార్థంలో అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: “నమోదు”కు బదులు “జనగణన” అని కూడా అనువదించవచ్చు. గ్రీకు పదం అధికారికంగా పేర్లు నమోదు చేయడాన్ని సూచిస్తుంది; ఇది తరచుగా పన్ను విధింపుతో సంబంధం కలిగి ఉండేది.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: ఈ
  rationale: మునుపటి వచనంలో చెప్పిన నమోదును సూచించే ప్రదర్శక సర్వనామం; ఆధునిక తెలుగులో ‘ఈ’ సహజంగా ఉంది.
- source_word: ἀπογραφὴ
  choice: నమోదు
  rationale: ప్రభుత్వపరమైన అధికారిక నమోదు అనే విస్తృత భావాన్ని నిలుపుతుంది; పన్ను లేదా జనగణన ఉద్దేశాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: πρώτη
  choice: మొదటిసారిగా
  rationale: సాధారణ క్రమవాచక అర్థమైన ‘మొదటి’ని సహజమైన తెలుగు క్రియావిశేషణ రూపంలో వ్యక్తం చేస్తుంది; వివాదాస్పదమైన ‘ముందు’ అర్థాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: ἐγένετο
  choice: జరిగింది
  rationale: ఒక సంఘటన సంభవించడాన్ని తెలిపే γίνομαι క్రియకు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ἡγεμονεύοντος
  choice: పరిపాలిస్తున్నప్పుడు
  rationale: సమకాలిక పరిస్థితిని తెలిపే జనిటివ్ అబ్సల్యూట్ నిర్మాణాన్ని నిలుపుతూ, నిర్దిష్ట అధికార పదవిని గ్రీకు మూలానికి మించి రుద్దదు.
- source_word: τῆς Συρίας
  choice: సిరియాను
  rationale: ప్రాంతనామానికి ప్రామాణిక తెలుగు రూపం; ‘పరిపాలించు’ క్రియకు తగిన కర్మ విభక్తితో ఇచ్చింది.
- source_word: Κυρηνίου
  choice: కురేనియుడు
  rationale: Κυρήνιος అనే వ్యక్తినామానికి తెలుగు బైబిలు వాడుకలో సుపరిచితమైన లిప్యంతరీకరణ.
theological_decisions:
- issue: చారిత్రకంగా వివాదాస్పదమైన వాక్యంలో πρώτη పదానికి అర్థం
  choice: ప్రధాన పాఠ్యంలో సాధారణ క్రమవాచక అర్థాన్ని అనుసరించి ‘మొదటిసారిగా’ అని అనువదించడం.
  alternative: ‘కురేనియుడు సిరియాను పరిపాలించకముందు ఈ నమోదు జరిగింది.’
  rationale: πρώτη పదానికి అత్యంత ప్రత్యక్షమైన అర్థం ‘మొదటి.’ అయితే వాక్యనిర్మాణం, చారిత్రక సంబంధం గురించి భిన్న అభిప్రాయాలు ఉన్నందున ‘ముందు’ అనే తులనాత్మక కాలార్థాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా స్వీకరించకుండా పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘పరిపాలిస్తున్నప్పుడు’ అనే రూపం గ్రీకు క్రియను పదవిపేరుగా అతిగా నిర్దిష్టం చేయకుండా ఉంచుతుంది. పాఠ్యంలో రెండు పాదసూచిక గుర్తులూ స్పష్టంగా చేర్చబడ్డాయి.
