    text: లేదా, ‘ఆయనను కనుగొనక, వారు యెరూషలేముకు తిరిగి వెళ్లారు; ఆయనను వెదుకుతూ.’
    reason: μὴ εὑρόντες ను ‘కనుగొనక’గా, ἀναζητοῦντες ను కొనసాగుతున్న అన్వేషణగా చూపే మరింత సన్నిహితమైన పదక్రమ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: καὶ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: తెలుగులో ముందున్న కథనంతో అనుసంధానం సహజంగానే స్పష్టమవుతుంది; ‘మరియు’ అని ఉంచడం ఈ సందర్భంలో కృత్రిమంగా ఉంటుంది.
- source_word: μὴ εὑρόντες
  choice: ఆయన కనిపించకపోవడంతో
  rationale: ప్రతికూల ఏఓరిస్టు కృదంతంలోని పరిస్థితి/కాల సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘ఆయనను కనుగొనలేక’ కూడా సాధ్యమే.
- source_word: ὑπέστρεψαν
  choice: తిరిగి వెళ్లారు
  rationale: ὑποστρέφω యొక్క ‘తిరిగి పోవడం’ అనే భావాన్ని సహజమైన కథన తెలుగులో తెలియజేస్తుంది.
- source_word: εἰς Ἰερουσαλήμ
  choice: యెరూషలేముకు
  rationale: నగరాన్ని గమ్యస్థానంగా చూపే εἰς భావానికి తెలుగు దత్తివిభక్తి సహజ సమానం.
- source_word: ἀναζητοῦντες
  choice: వెదుకుతూ
  rationale: ἀναζητέω సూచించే చురుకైన అన్వేషణను సాధారణ పాఠకులకు స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: αὐτόν
  choice: ఆయనను
  rationale: యేసును సూచించే పుంలింగ ఏకవచన సర్వనామాన్ని గౌరవప్రదమైన ఆధునిక తెలుగు ప్రయోగంతో అనువదించింది.
