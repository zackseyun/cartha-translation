    issue: “ఆయన కనిపించకపోవడంతో” shifts the subject and causal sense of μὴ εὑρόντες.
    rationale: The Greek means ‘not finding him’; it describes what his parents failed to do, not Jesus’ failure to be visible. “కనుగొనలేక” directly preserves this sense.
