  text: And when they did not find him[a], they returned to Jerusalem, searching for him.
translation:
  language: te
  text: ఆయనను కనుగొనలేక[a], వారు ఆయనను వెదుకుతూ యెరూషలేముకు తిరిగి వెళ్లారు.
