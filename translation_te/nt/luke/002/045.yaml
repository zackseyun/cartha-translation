translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా, అయితే బైబిలు కథనానికి తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. గ్రీకు కృదంతాల సంబంధాన్ని సహజమైన తెలుగు ఉపవాక్యం మరియు అసమాపక క్రియతో నిలిపింది.
