id: LUK.2.10
reference: Luke 2:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ ἄγγελος· Μὴ φοβεῖσθε, ἰδοὺ γὰρ εὐαγγελίζομαι ὑμῖν χαρὰν μεγάλην ἥτις ἔσται παντὶ τῷ λαῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/010.yaml
  text: And the angel said to them[a], “Do not be afraid, for behold, I bring you good news of great joy that will be for all the people,”
translation:
  language: te
  text: 'ఆ దూత వారితో ఇలా అన్నాడు: “భయపడకండి. ఇదిగో, నేను మీకు శుభవార్తను ప్రకటిస్తున్నాను: ప్రజలందరికీ[a] కలగబోయే గొప్ప ఆనందం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మొత్తం ప్రజల కోసం.” గ్రీకులో అక్షరార్థంగా “మొత్తం ఆ ప్రజలకు” అని ఉంది. లూకా సందర్భంలో ఇది ఒక నిర్దిష్ట ప్రజాసమూహాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἄγγελος
  choice: ఆ దూత
  rationale: గ్రీకు నిర్దిష్ట సూచకం, ముందరి సందర్భంలో ఇప్పటికే పరిచయమైన దూతనే తిరిగి సూచిస్తుంది; తెలుగులో ‘ఆ దూత’ ఈ సందర్భసంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: Μὴ φοβεῖσθε
  choice: భయపడకండి
  rationale: బహువచన సంబోధనను గౌరవప్రదమైన, సహజమైన ఆధునిక తెలుగు నిషేధరూపంతో అందిస్తుంది.
- source_word: ἰδοὺ γὰρ
  choice: ఇదిగో
  rationale: ἰδού యొక్క శ్రద్ధాకర్షక, గంభీర బలాన్ని ‘ఇదిగో’ నిలుపుతుంది. γάρ తెలియజేసే కారణసంబంధం తరువాత వచ్చే ప్రకటన ద్వారా తెలుగులో సహజంగా స్పష్టమవుతుంది; విడిగా ‘ఎందుకంటే’ చేరిస్తే వాక్యం కృత్రిమంగా ఉంటుంది.
- source_word: εὐαγγελίζομαι ὑμῖν
  choice: శుభవార్తను మీకు ప్రకటిస్తున్నాను
  rationale: క్రియ యొక్క మూలార్థమైన మంచి వార్తను ప్రకటించడాన్ని నేరుగా తెలియజేస్తూ, ὑμῖν అనే బహువచన దాతువును ‘మీకు’గా స్పష్టంగా ఉంచుతుంది.
- source_word: χαρὰν μεγάλην
  choice: గొప్ప ఆనందాన్ని
  rationale: μέγας యొక్క బలాన్ని, χαρά యొక్క భావాన్ని సహజమైన తెలుగులో నేరుగా నిలుపుతుంది.
- source_word: ἥτις ἔσται
  choice: కలగబోయే
  rationale: ఆ ఆనందం భవిష్యత్తులో ప్రజలకు చెందుతుందనే సంబంధవాక్య భావాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παντὶ τῷ λαῷ
  choice: ప్రజలందరికీ
  rationale: πᾶς మరియు నిర్దిష్టమైన τῷ λαῷ కలయికను సహజ తెలుగులో అందిస్తుంది. తెలుగు వ్యాకరణంలో నిర్దిష్ట ఉపపదం లేనందున, ఇది ‘మొత్తం ప్రజలకు’ మరియు ‘అందరు ప్రజలకు’ మధ్య ఉన్న మూలపాఠపు సందర్భసంబంధ ఉద్వేగాన్ని పూర్తిగా తీర్చకుండా ఉంచుతుంది.
theological_decisions:
- issue: παντὶ τῷ λαῷ యొక్క పరిధి
  choice: ప్రజలందరికీ
  alternative: ప్రజలందరి కోసం / మనుషులందరికీ
  rationale: గ్రీకు నిర్దిష్ట సూచకంతో ఉన్న λαός తక్షణ లూకా సందర్భంలో ఒక నిర్దిష్ట ప్రజాసమూహాన్ని—సంభవంగా ఇశ్రాయేలు ప్రజలను—సూచించవచ్చు. ‘మనుషులందరికీ’ అని అనువదించడం ఈ వచనంలోనే భావాన్ని ముందుగానే విశ్వవ్యాప్తం చేస్తుంది. ‘ప్రజలందరికీ’ మూలంలోని నిర్దిష్టతను తెలుగులో సాధ్యమైనంతవరకు కాపాడుతూ, విస్తృతార్థానికి తలుపు మూయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సహజమైన శైలిని ఉపయోగించాం. ‘ఇదిగో’ ప్రకటనలోని శ్రద్ధాకర్షక స్వరాన్ని నిలుపుతుంది; ‘సువార్త’ అనే తరువాతి సాంకేతిక మతపరమైన పదానికి బదులుగా, ఈ సందర్భంలోని సాధారణ శుభసందేశ భావాన్ని స్పష్టపరచడానికి ‘శుభవార్త’ ఎంచుకున్నాం.
