source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐπλήσθησαν ἡμέραι ὀκτὼ τοῦ περιτεμεῖν αὐτόν, καὶ ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς, τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου πρὸ τοῦ συλλημφθῆναι αὐτὸν ἐν τῇ κοιλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/021.yaml
  text: And when eight days were fulfilled for circumcising him[a], his name was called Jesus[c][b], the name called by the angel before he was conceived in the womb.
translation:
  language: te
  text: ఆయనకు సున్నతి చేయాల్సిన ఎనిమిదవ రోజు వచ్చినప్పుడు[a], ఆయనకు యేసు అనే పేరు పెట్టారు[b]—ఆయన తల్లి గర్భంలో గర్భస్థుడవకముందే దూత చెప్పిన పేరు అదే.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎనిమిది రోజులు పూర్తయినప్పుడు.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఆయన పేరు యేసు అని పిలువబడింది.”
    reason: lexical_alternative
  - marker: c
    text: అంటే, మరియ గర్భంలో ఆయన గర్భస్థుడవకముందే.
    reason: clarification
lexical_decisions:
- source_word: ἐπλήσθησαν ἡμέραι ὀκτὼ
  choice: ఎనిమిది రోజులు పూర్తయినప్పుడు
  rationale: గ్రీకు నుడికారంలోని పూర్తికావడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: τοῦ περιτεμεῖν αὐτόν
  choice: ఆయనకు సున్నతి చేయవలసిన
  rationale: ఆర్టిక్యులర్ ఇన్ఫినిటివ్ సూచించే ఉద్దేశం/సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς
  choice: ఆయనకు యేసు అని పేరు పెట్టారు
  rationale: పదశః పునరుత్పత్తి చేసే అసహజ నిర్మాణాన్ని నివారిస్తూ, గ్రీకు కర్మణి భావాన్ని సహజ తెలుగులో తెలిపుతుంది.
- source_word: Ἰησοῦς
  choice: యేసు
  rationale: కొత్త నిబంధనలో ఈ వ్యక్తినామానికి స్థిరపడిన తెలుగు రూపం.
- source_word: τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου
  choice: దూత పెట్టిన పేరు
  rationale: కృదంతం ‘పేరు’ను సూచిస్తుందని స్పష్టం చేస్తూ, ముందుగా దూత ప్రకటించిన పేరును సహజంగా తెలియజేస్తుంది.
- source_word: πρὸ τοῦ συλλημφθῆναι αὐτὸν ἐν τῇ κοιλίᾳ
  choice: ఆయన గర్భంలో ధరింపబడకముందే
  rationale: సందర్భంలో συλλαμβάνω సూచించే గర్భధారణ భావాన్ని, అదనపు సిద్ధాంత పదజాలం లేకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: క్రీస్తు గర్భధారణకు సంబంధించిన వాక్యభాగం
  choice: ఆయన గర్భంలో ధరింపబడకముందే
  alternative: ఆయన గర్భంలో రూపుదాల్చకముందే
  rationale: ఈ పాఠం చెప్పే మానవ గర్భధారణను నేరుగా పేర్కొంటుంది; గ్రీకు వాక్యం కోరనంత సిద్ధాంత విస్తరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘సున్నతి’, ‘గర్భంలో ధరింపబడడం’ వంటి సందర్భానుకూల పదాలు వాడబడ్డాయి.
