source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἐξῆλθεν δόγμα παρὰ Καίσαρος Αὐγούστου ἀπογράφεσθαι πᾶσαν τὴν οἰκουμένην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/001.yaml
  text: It happened in those days that a decree went out from Caesar Augustus that all the inhabited world should be registered[a].
translation:
  language: te
  text: 'ఆ రోజుల్లో, కైసరు ఔగుస్తు నుండి ఒక ఆజ్ఞ వెలువడింది: ప్రజలు నివసించే ప్రపంచమంతా నమోదు చేయబడాలని[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రోమా సామ్రాజ్య పరిధిలోని ప్రపంచమంతా” లేదా “సామ్రాజ్యమంతా.” ఇక్కడి గ్రీకు పదం తరచుగా రోమా సామ్రాజ్య సందర్భంలో భావించిన నివసింపబడిన ప్రపంచాన్ని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ఆ రోజుల్లో, … వెలువడింది
  rationale: Ἐγένετο అనే కథనారంభ సూత్రాన్ని తెలుగులో విడిగా ‘జరిగింది’ అని అనడం అసహజంగా ఉంటుంది; δὲ సూచించే కథన పురోగతిని కూడా వాక్య ప్రవాహంలో సహజంగా మిళితం చేశాం.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: ఆ రోజుల్లో
  rationale: గ్రీకు కాలసూచక పదబంధానికి సహజమైన, సమీప తెలుగు రూపం.
- source_word: ἐξῆλθεν δόγμα
  choice: ఒక ఆజ్ఞ వెలువడింది
  rationale: అధికారిక ఉత్తర్వు జారీ కావడాన్ని ‘ఆజ్ఞ వెలువడింది’ సహజంగా తెలియజేస్తుంది; ἐξῆλθεν లోని వెలుపలికి రావడం అనే రూపకాన్ని కూడా నిలుపుతుంది.
- source_word: παρὰ Καίσαρος Αὐγούστου
  choice: కైసరు ఔగుస్తు నుండి
  rationale: παρά + షష్ఠీ విభక్తి ఆజ్ఞకు మూలం లేదా జారీచేసిన అధికారిని సూచిస్తుంది; ‘నుండి’ దీనిని స్పష్టంగా నిలుపుతుంది.
- source_word: ἀπογράφεσθαι
  choice: నమోదు చేయబడాలని
  rationale: అధికారిక నమోదును సూచిస్తుంది; ఈ వచనం స్వయంగా చెప్పనంతగా ‘జనగణన’ లేదా పన్నుల ఉద్దేశాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: πᾶσαν τὴν οἰκουμένην
  choice: నివాస ప్రపంచమంతా
  rationale: οἰκουμένη యొక్క ‘నివసింపబడిన లోకం’ అనే భావాన్ని కాపాడుతూ, కేవలం ‘ప్రపంచమంతా’ అని చెప్పడం వల్ల కలిగే ఆధునిక భౌగోళిక అపార్థాన్ని తగ్గిస్తుంది.
theological_decisions:
- issue: οἰκουμένη యొక్క పరిధి
  choice: నివాస ప్రపంచమంతా
  alternative: రోమా ప్రపంచమంతా; సామ్రాజ్యమంతా
  rationale: గ్రీకు పదానికి ఉన్న విస్తృత ప్రాథమిక అర్థాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, సందర్భంలో సాధ్యమైన రోమా సామ్రాజ్య సంబంధిత పరిమితిని పాదసూచికలో అందించాం; చారిత్రక పరిధిని అనవసరంగా ఖరారు చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ‘కైసరు ఔగుస్తు’ అనే రూపం బిరుదు మరియు పేరును గుర్తించదగిన బైబిలు శైలిలో ఉంచుతుంది; వాక్య నిర్మాణం సాధారణ పాఠకునికి సహజంగా ఉండేలా రూపొందించబడింది.
