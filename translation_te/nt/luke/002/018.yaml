  yaml_path: translation/nt/luke/002/018.yaml
  text: And all who heard it were amazed about what had been told to them by the shepherds,[a]
translation:
  language: te
  text: విన్న వారందరూ కాపరులు వారికి చెప్పిన విషయాల గురించి ఆశ్చర్యపోయారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “విస్మయపడ్డారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (ముందటి వాక్యంతో సహజ అనుసంధానం)
  rationale: καί కథన ప్రవాహాన్ని ముందటి వాక్యంతో కలుపుతుంది. తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని పెట్టడం కంటే వాక్యక్రమంలో సహజంగా అనుసంధానించడం ఆధునిక కథనశైలికి అనుకూలం.
- source_word: πάντες οἱ ἀκούσαντες
  choice: విన్న వారందరూ
  rationale: నామవాచకంగా పనిచేసే articular aorist participle భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. గ్రీకులో లేని స్పష్టమైన కర్మను చేర్చకుండా సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: ἐθαύμασαν
  choice: ఆశ్చర్యపోయారు
  rationale: విన్నదానికి కలిగిన విస్మయం లేదా ఆశ్చర్యాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది; ఇది విశ్వాసాన్నీ అవిశ్వాసాన్నీ నిర్దేశించదు.
- source_word: περὶ τῶν λαληθέντων
  choice: చెప్పిన విషయాలను గురించి
  rationale: περί + genitive లోని ‘గురించి/సంబంధించి’ అనే భావాన్ని, అలాగే పలికిన విషయాలపై దృష్టిని నిలుపుతుంది.
- source_word: ὑπὸ τῶν ποιμένων
  choice: కాపరులు
  rationale: ὑπό + genitive సూచించే కర్తృత్వాన్ని తెలుగులో క్రియాశీల వాక్యనిర్మాణంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πρὸς αὐτούς
  choice: తమతో
  rationale: మాటలు వినిన వారికే ఉద్దేశించబడ్డాయని సూచిస్తూ, πρὸς αὐτούς లోని సర్వనామ సూచనను అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: ἐθαύμασαν వర్ణించే స్పందన స్వభావం
  choice: ఆశ్చర్యం లేదా విస్మయంగా మాత్రమే అనువదించడం
  alternative: వారు విశ్వాసంతో స్పందించారని లేదా కేవలం కుతూహలపడ్డారని స్పష్టీకరించడం
  rationale: θαυμάζω భావోద్వేగ స్పందనను తెలియజేస్తుంది; అది రక్షణాత్మక విశ్వాసమా, అవిశ్వాసమా అని వాక్యం చెప్పదు. అందువల్ల ఆ కథనాత్మక తెరచుదనాన్ని నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే కథనశైలి. గ్రీకు పదక్రమాన్ని బలవంతంగా అనుసరించకుండా, కర్తృత్వ సంబంధాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేసింది.
