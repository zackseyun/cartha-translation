- from: ఇప్పుడు, యజమానీ, నీ మాట ప్రకారం నీ దాసుణ్ణి[a] శాంతితో వెళ్లనిస్తున్నావు[b].
  to: ఇప్పుడు, యజమానీ, నీ మాట ప్రకారం నీ బానిసను[a] శాంతితో పంపివేస్తున్నావు[b].
  rationale: The revision replaces ‘దాసుడు’ with ‘బానిస’ to retain the explicit relational force of δοῦλος paired with δέσποτα in modern Telugu. It also uses the more idiomatic ‘పంపివేస్తున్నావు’ for the contextual sense of ἀπολύεις, while the footnote preserves the literal release/dismissal image and avoids making death explicit.
