source:
  edition: SBLGNT
  text: Νῦν ἀπολύεις τὸν δοῦλόν σου, δέσποτα, κατὰ τὸ ῥῆμά σου ἐν εἰρήνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/029.yaml
  text: Now you are dismissing your servant[a], Master, according to your word[b], in peace.
translation:
  language: te
  text: ఇప్పుడు, యజమానీ, నీ మాట ప్రకారం నీ బానిసను[a] శాంతితో పంపివేస్తున్నావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ సేవకుణ్ణి.’ గ్రీకు పదం δοῦλοςకు ‘బానిస’ లేదా ‘సేవకుడు’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ ‘యజమానీ’ అనే సంబోధనతో జతగా ఉన్నందున యజమాని–బానిస సంబంధం ప్రత్యేకంగా స్పష్టమవుతుంది.
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, ‘విడుదల చేస్తున్నావు’ లేదా ‘విడిచిపెడుతున్నావు.’ సందర్భంలో సుమెయోను ఈ జీవితం నుండి శాంతితో నిష్క్రమించడానికి సిద్ధంగా ఉన్నాడనే భావం ఉంది; అయితే గ్రీకు వాక్యం మరణాన్ని నేరుగా ప్రస్తావించదు.
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: ఇప్పుడు
  rationale: సుమెయోను ఎదురుచూసినది ప్రస్తుత క్షణంలో నెరవేరుతున్నదని సూచించే సహజమైన కాలవాచకం.
- source_word: ἀπολύεις
  choice: వెళ్లనిస్తున్నావు
  rationale: క్రియకు ‘విడుదల చేయడం, పంపివేయడం, వెళ్లనివ్వడం’ అనే పరిధి ఉంది. ఈ సందర్భంలో ‘వెళ్లనిస్తున్నావు’ సహజమైన ఆధునిక తెలుగు; మరణాన్ని నేరుగా పేర్కొనకుండా సందర్భంలోని భావాన్ని నిలుపుతుంది.
- source_word: τὸν δοῦλόν σου
  choice: నీ దాసుణ్ణి
  rationale: δοῦλος సేవకుణ్ణి లేదా యజమానికి చెందిన దాసుణ్ణి సూచించగలదు. వెంటనే వచ్చే δέσποτα అనే సంబోధన యజమాని–దాసుడు సంబంధాన్ని స్పష్టం చేస్తుంది కాబట్టి ‘దాసుడు’ ఎంచుకోబడింది.
- source_word: δέσποτα
  choice: యజమానీ
  rationale: δεσπότης అధికారమూ యాజమాన్యమూ గల యజమానిని సూచిస్తుంది. ‘యజమానీ’ అనేది ‘దాసుణ్ణి’తో ఉన్న ఉద్దేశపూర్వక సంబంధాన్ని నిలుపుతుంది.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: నీ మాట ప్రకారం
  rationale: κατά ఇక్కడ అనుగుణతను తెలియజేస్తుంది; ῥῆμα పలికిన మాట లేదా వాగ్దానాన్ని సూచిస్తుంది. ఈ అనువాదం రెండింటినీ సహజంగా నిలుపుతుంది.
- source_word: ἐν εἰρήνῃ
  choice: శాంతితో
  rationale: ‘శాంతిలో/శాంతితో’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, దేవుని వాగ్దానం నెరవేరినందువల్ల కలిగిన ప్రశాంత నిష్క్రమణ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: సుమెయోను మాటలను మరణానికి స్పష్టమైన సూచనగా అనువదించాలా?
  choice: మరణాన్ని నేరుగా చెప్పకుండా ‘వెళ్లనిస్తున్నావు’ అనే నిష్క్రమణ భావాన్ని నిలుపడం
  alternative: ఇప్పుడు నీ దాసుణ్ణి శాంతితో చనిపోనిస్తున్నావు
  rationale: సందర్భం సుమెయోను మరణానికి సిద్ధంగా ఉన్నాడని బలంగా సూచించినా, ἀπολύω స్వయంగా ‘చనిపోనివ్వడం’ అని కాక ‘విడుదల చేయడం/వెళ్లనివ్వడం’ అని అర్థమిస్తుంది. అందువల్ల మూలంలోని రూపకాన్నీ దైవశాస్త్రీయ ఉద్వేగాన్నీ స్పష్టీకరించి తొలగించకుండా ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలి. ‘యజమానీ—దాసుణ్ణి’ అనే జంట మూలంలోని సంబంధాన్ని నిలుపుతుంది; ‘వెళ్లనిస్తున్నావు’ పాతకాలపు ప్రయోగాలను నివారిస్తూ మూలంలోని నిష్క్రమణ రూపకాన్ని కాపాడుతుంది.
