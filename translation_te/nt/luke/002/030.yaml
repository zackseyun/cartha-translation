translation:
  language: te
  text: ఎందుకంటే నా కళ్లు నీ రక్షణను చూశాయి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ రక్షకుణ్ణి.’ గ్రీకులో ‘నీ రక్షణను’ అని ఉంది; అయితే సందర్భంలో దేవుని రక్షణ యేసు వ్యక్తిలో ప్రత్యక్షమవుతోంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: మునుపటి వాక్యంలో సుమెయోను తాను ప్రశాంతంగా వెళ్లిపోవచ్చని చెప్పడానికి గల కారణాన్ని ఇది పరిచయం చేస్తుంది; అందువల్ల కారణార్థాన్ని స్పష్టంగా తెలిపే ‘ఎందుకంటే’ సహజంగా ఉంది.
- source_word: εἶδον
  choice: చూశాయి
  rationale: గ్రీకు ఏఒరిస్ట్ పూర్తయిన దర్శనాన్ని సూచిస్తుంది. తెలుగులో సందర్భానుసారంగా సాధారణ భూతకాల రూపం సహజంగా ఉండి, ఆ దర్శనపు ప్రస్తుత ప్రాముఖ్యతను సందర్భమే తెలియజేస్తుంది.
- source_word: οἱ ὀφθαλμοί μου
  choice: నా కళ్లు
  rationale: గ్రీకు మూలంలో ‘నేను’ అని మాత్రమే కాకుండా ‘నా కళ్లు’ అని సజీవమైన శరీరసంబంధ వ్యక్తీకరణ ఉంది; తెలుగులోనూ అది సహజంగా నిలుస్తుంది.
- source_word: τὸ σωτήριόν σου
  choice: నీ రక్షణను
  rationale: σωτήριον నేరుగా ‘రక్షకుడు’ అనే వ్యక్తినామం కాకుండా రక్షణ లేదా విమోచనను సూచిస్తుంది. ‘నీ రక్షణను’ అనే అనువాదం మూలపదాన్ని కాపాడుతూ, ఆ రక్షణ యేసులో ప్రత్యక్షమైందని సందర్భం ద్వారా గ్రహించడానికి వీలు కల్పిస్తుంది.
theological_decisions:
- issue: τὸ σωτήριόν σου అనే పదబంధాన్ని భావవాచకంగా ‘నీ రక్షణను’ అని అనువదించాలా, శిశువైన మెస్సీయ సందర్భాన్ని బట్టి వ్యక్తివాచకంగా ‘నీ రక్షకుణ్ణి’ అని అనువదించాలా?
  choice: నీ రక్షణను
  alternative: నీ రక్షకుణ్ణి
  rationale: గ్రీకులో సాధారణంగా ‘రక్షకుడు’ అనే వ్యక్తిని సూచించే σωτήρ లేదు; σωτήριον ఉంది. కాబట్టి ‘నీ రక్షణను’ అనేది మూలభాషకు దగ్గరగా ఉండి, దేవుని రక్షణ యేసు వ్యక్తిలో ఉందనే సందర్భార్థాన్ని అనువాదంలో ముందుగానే పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘నా కళ్లు’ అనే మూలంలోని సజీవ వ్యక్తీకరణను అలాగే నిలిపి, ‘రక్షణ’ మరియు ‘రక్షకుడు’ మధ్య ఉన్న సందర్భపరమైన దైవశాస్త్ర ఉద్వేగాన్ని పాదటిప్పణిలో సూచించాం.
