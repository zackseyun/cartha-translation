  text: καὶ ἦν αὐτῷ κεχρηματισμένον ὑπὸ τοῦ πνεύματος τοῦ ἁγίου μὴ ἰδεῖν θάνατον πρὶν ⸂ἢ ἂν⸃ ἴδῃ τὸν χριστὸν κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/026.yaml
  text: And it had been revealed to him by the Holy Spirit that he would not see death before he had seen the Lord’s Messiah[a].
translation:
  language: te
  text: ప్రభువు మెస్సీయను[a] చూసే ముందే తాను మరణాన్ని చూడనని పరిశుద్ధాత్మ ద్వారా అతనికి వెల్లడించబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సాంప్రదాయంగా, “ప్రభువు క్రీస్తును.”
    reason: τὸν χριστὸν κυρίουకు సాంప్రదాయంగా వాడే ప్రత్యామ్నాయ అనువాదాన్ని నమోదు చేయడం.
lexical_decisions:
- source_word: κεχρηματισμένον
  choice: వెల్లడించాడు
  rationale: దైవిక సమాచారాన్ని పొందడం అనే భావాన్ని సందర్భానుసారంగా సహజమైన తెలుగులో తెలియజేస్తుంది; ‘హెచ్చరించాడు’ అనడం ఇక్కడ అతిగా సంకుచితం.
- source_word: ὑπὸ τοῦ πνεύματος τοῦ ἁγίου
  choice: పరిశుద్ధాత్మ అతనికి
  rationale: ὑπό + షష్ఠీ విభక్తి వ్యక్తిగత కర్తృత్వాన్ని సూచిస్తుంది. తెలుగు కర్తరి వాక్య నిర్మాణం పరిశుద్ధాత్మ కర్తృత్వాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: μὴ ἰδεῖν θάνατον
  choice: మరణాన్ని చూడడని
  rationale: ‘మరణాన్ని చూడడం’ అనే మూలంలోని రూపకాన్ని తెలుగు సహజంగా మోయగలదు; కేవలం ‘చనిపోడని’ కంటే మూలానికి దగ్గరగా ఉంటుంది.
- source_word: πρὶν ἢ ἂν ἴδῃ
  choice: చూసే వరకు
  rationale: ముందుగా ఆ సంఘటన జరగకుండానే మరణం సంభవించదనే భవిష్యత్ క్రమాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὸν χριστὸν κυρίου
  choice: ప్రభువు అభిషిక్తుణ్ణి
  rationale: χριστός ఇక్కడ బిరుదుగా ఉంది. ‘అభిషిక్తుడు’ దాని మూలార్థాన్ని, మెస్సీయ సంబంధమైన భావాన్ని తెలుగులో పారదర్శకంగా ఉంచుతుంది; κυρίουతోని సంబంధాన్ని ‘ప్రభువు అభిషిక్తుడు’గా నిలుపుతుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: కర్తకు చెందిన లేదా ఆయన పంపిన అభిషిక్తుడు అనే షష్ఠీ సంబంధాన్ని తెలుగు సమాససదృశ నిర్మాణం సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: χριστόςను మెస్సీయ బిరుదుగా అనువదించడం
  choice: అభిషిక్తుడు
  alternative: క్రీస్తు; మెస్సీయ
  rationale: ఇక్కడ χριστός పేరు వలె కాక బిరుదుగా పనిచేస్తుంది. ‘అభిషిక్తుడు’ గ్రీకు పదార్థాన్ని నేరుగా తెలియజేసి దాని యూద మెస్సీయ నిరీక్షణ నేపథ్యాన్ని కాపాడుతుంది. సాంప్రదాయ ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కర్తరి వాక్య నిర్మాణం వాడబడింది. ‘మరణాన్ని చూడడం’ అనే మూల రూపకం ఉద్దేశపూర్వకంగా నిలుపబడింది; భాష గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది.
