id: LUK.2.48
reference: Luke 2:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδόντες αὐτὸν ἐξεπλάγησαν, καὶ ⸂εἶπεν πρὸς αὐτὸν ἡ μήτηρ αὐτοῦ⸃· Τέκνον, τί ἐποίησας ἡμῖν οὕτως; ἰδοὺ ὁ πατήρ σου καὶ ἐγὼ ὀδυνώμενοι ⸀ἐζητοῦμέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/048.yaml
  text: And when they saw him[a], they were astonished, and his mother said to him, “Child, why have you done this to us? Look, your father and I have been anxiously looking for you.”
translation:
  language: te
  text: వారు ఆయనను చూసినప్పుడు ఆశ్చర్యపోయారు. ఆయన తల్లి ఆయనతో, “బిడ్డా, మాకు ఇలా ఎందుకు చేశావు? ఇదిగో, నీ తండ్రి, నేనూ ఎంతో వేదనతో నిన్ను వెదుకుతూ ఉన్నాం[a]” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తీవ్ర కలతతో నిన్ను వెదుకుతున్నాం.” గ్రీకు పదం వెదికిన సమయంలో వారు అనుభవించిన భావోద్వేగ బాధను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: వారు ఆయనను చూసినప్పుడు
  rationale: అయోరిస్ట్ కృదంతాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా అనువదించి, చూడటం తరువాత ఆశ్చర్యపడటం అనే క్రమాన్ని నిలిపింది.
- source_word: ἐξεπλάγησαν
  choice: ఆశ్చర్యపోయారు
  rationale: తీవ్రమైన ఆశ్చర్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; సందర్భంలో బలాన్ని అతిశయోక్తి లేకుండా అందిస్తుంది.
- source_word: Τέκνον
  choice: బిడ్డా
  rationale: తల్లి ప్రేమతో సంబోధించే τέκνονకు సహజమైన తెలుగు రూపం; గ్రీకులో లేని స్వామ్యసూచక పదాన్ని జోడించదు.
- source_word: τί ἐποίησας ἡμῖν οὕτως
  choice: మాకు ఇలా ఎందుకు చేశావు?
  rationale: గ్రీకు ప్రశ్నలోని ఫిర్యాదు భావాన్నీ, ἡμῖν యొక్క సంబంధబలాన్నీ సహజమైన తెలుగు ప్రశ్నగా నిలుపుతుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: ప్రత్యక్ష సంభాషణలో శ్రద్ధను బలంగా ఆకర్షించే సహజమైన తెలుగు పదం.
- source_word: ὁ πατήρ σου
  choice: నీ తండ్రి
  rationale: గ్రీకు పాఠంలోని సాధారణ కుటుంబ సంబంధ పదాన్ని ఎలాంటి వ్యాఖ్యాత్మక విశేషణం చేర్చకుండా యథాతథంగా నిలుపుతుంది.
- source_word: ὀδυνώμενοι
  choice: ఎంతో వేదనతో
  rationale: వెదకడంలో కలిగిన భావోద్వేగ బాధ లేదా తీవ్ర కలతను వ్యక్తపరుస్తుంది; కేవలం ఆందోళనగా బలహీనపరచదు.
- source_word: ἐζητοῦμέν σε
  choice: నిన్ను వెదుకుతూ ఉన్నాం
  rationale: ఇంపర్ఫెక్ట్ క్రియలోని కొనసాగుతున్న గత చర్యను, మాట్లాడే క్షణం వరకు సాగిన వెదకడాన్ని సహజమైన తెలుగు కొనసాగింపు రూపంలో అందిస్తుంది.
theological_decisions:
- issue: యేసును ఉద్దేశించి యోసేపును ‘నీ తండ్రి’ అని పేర్కొనడం
  choice: ప్రధాన పాఠంలో ఎలాంటి వివరణాత్మక విశేషణం లేకుండా ‘నీ తండ్రి’ అని ఉంచడం.
  alternative: ‘నీ భూలోక తండ్రి’
  rationale: గ్రీకు పాఠం మరియ మాటలను ‘నీ తండ్రి, నేనూ’ అని ఇస్తుంది. ‘భూలోక’ అని చేర్చడం అనువాదం కంటే వ్యాఖ్యానం అవుతుంది; తదుపరి వచనంతో ఏర్పడే దైవ కుమారత్వ సంబంధమైన కథన ఉద్వేగాన్ని అనువాదం పరిష్కరించకుండా నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కుటుంబ సంభాషణ శైలి వాడబడింది. ‘బిడ్డా,’ ‘ఇదిగో,’ ‘వేదనతో’ వంటి పదాలు సామాన్య పాఠకులకు స్పష్టంగా ఉండి మూలపాఠంలోని మాతృస్నేహం, ఆశ్చర్యం, బాధను నిలుపుతాయి.
