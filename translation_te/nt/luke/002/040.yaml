id: LUK.2.40
reference: Luke 2:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τὸ δὲ παιδίον ηὔξανεν καὶ ἐκραταιοῦτο ⸂πληρούμενον σοφίᾳ⸃, καὶ χάρις θεοῦ ἦν ἐπ’ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/040.yaml
  text: And the child grew and became strong[a], being filled with wisdom, and the favor of God was upon him.
translation:
  language: te
  text: ఆ బాలుడు ఎదుగుతూ, బలపడుతూ, జ్ఞానంతో నిండిపోతూ[b] ఉన్నాడు. దేవుని అనుగ్రహం[a] ఆయనపై ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని కృప.’
    reason: χάριςకు నేరుగా సరిపడే ప్రత్యామ్నాయ అనువాదం.
  - marker: b
    text: కొన్ని ప్రాచీన ప్రతుల్లో ‘జ్ఞానంతో నిండిపోతూ’ అనే పదబంధం లేదు.
    reason: SBLGNTలో ఈ పదబంధం బ్రాకెట్లలో ఉండటం పాఠాంతర అనిశ్చితిని సూచిస్తుంది.
lexical_decisions:
- source_word: Τὸ δὲ παιδίον
  choice: ఇక ఆ బాలుడు
  rationale: παιδίον అంటే చిన్న పిల్లవాడు; ఈ సందర్భంలో సహజమైన ఆధునిక తెలుగు పదం ‘బాలుడు’. δέ కథనాన్ని స్వల్పంగా ముందుకు తీసుకెళ్లే అనుసంధాన పదం కాబట్టి ‘ఇక’ అని అనువదించబడింది.
- source_word: ηὔξανεν
  choice: ఎదుగుతూ ... ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న శారీరక వికాసాన్ని సూచిస్తుంది; తెలుగు సంయుక్త వాక్యనిర్మాణంలో ‘ఎదుగుతూ ... ఉన్నాడు’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκραταιοῦτο
  choice: బలపడుతూ
  rationale: ఈ అసంపూర్ణ భూతకాల మధ్యమ/కర్మణి రూపం క్రమంగా బలం పొందడాన్ని సూచిస్తుంది; ‘బలపడుతూ’ ఆ ప్రగతిశీల భావాన్ని నిలుపుతుంది.
- source_word: πληρούμενον σοφίᾳ
  choice: జ్ఞానంతో నిండిపోతూ
  rationale: వర్తమాన అసమాపక క్రియ బాలుని ఎదుగుదలతో పాటు కొనసాగుతున్న స్థితిని తెలియజేస్తుంది; σοφίᾳ నింపబడిన విషయాన్ని సూచిస్తున్నందున ‘జ్ఞానంతో’ అని అనువదించబడింది.
- source_word: χάρις θεοῦ
  choice: దేవుని అనుగ్రహం
  rationale: χάρις ఇక్కడ దేవుని దయాపూర్వక అనుకూలత లేదా కటాక్షాన్ని సూచిస్తుంది. ‘అనుగ్రహం’ ఆధునిక తెలుగు బైబిలు వాడుకలో గౌరవప్రదంగా ఉండి, కృప మరియు అనుకూలత అనే భావపరిధిని రెండింటినీ మోయగలదు.
- source_word: ἦν ἐπ’ αὐτό
  choice: ఆయనపై ఉండేది
  rationale: ἐπί ఇక్కడ ఒక వ్యక్తిపై నిలిచి ఉండే సానుకూల సన్నిధిని సూచిస్తుంది. ‘ఆయనపై ఉండేది’ మూలంలోని రూపకాన్ని కాపాడుతుంది; యేసును సూచిస్తూ తెలుగు గౌరవార్థక ఏకవచనం వాడబడింది.
theological_decisions:
- issue: క్రీస్తు మానవ వికాస సందర్భంలో χάρις θεοῦ అనువాదం
  choice: దేవుని అనుగ్రహం
  alternative: దేవుని కటాక్షం
  rationale: ‘అనుగ్రహం’ దేవుని దయాపూర్వక అనుకూలతను సహజంగా తెలియజేస్తుంది; అదే సమయంలో పదాన్ని క్రీస్తులో ఏదో నైతిక లేదా దైవిక లోపం ఉందనే విధంగా వివరణాత్మకంగా పరిమితం చేయదు. ‘కటాక్షం’ చెల్లుబాటు అయ్యే భావ ప్రత్యామ్నాయంగా పాదటిప్పణిలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. గ్రీకు అసంపూర్ణ భూతకాల క్రియలు మరియు వర్తమాన అసమాపక క్రియలోని కొనసాగింపు భావాన్ని ‘ఎదుగుతూ, బలపడుతూ, జ్ఞానంతో నిండిపోతూ ఉన్నాడు’ అనే సమాంతర నిర్మాణంతో నిలుపుకున్నాం.
