lexical_decisions:
- source_word: ὃ
  choice: దానిని
  rationale: ఇది ముందరి వచనంలోని ‘రక్షణ’ను సూచించే నపుంసక ఏకవచన సంబంధ సర్వనామం. తెలుగులో వాక్యసంబంధం స్పష్టంగా ఉండేందుకు ‘దానిని’ సహజమైన ఎంపిక.
- source_word: ἡτοίμασας
  choice: నీవు … సిద్ధపరిచావు
  rationale: దేవునితో నేరుగా మాట్లాడుతున్న ద్వితీయ పురుష ఏకవచన భూతకాల క్రియను స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: κατὰ πρόσωπον
  choice: ఎదుట
  rationale: అందరి సమక్షంలో, అందరికీ కనిపించేలా ఉంచబడిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; గ్రీకు శరీరాంగ రూపకాన్ని కృత్రిమంగా పదేపదే అనుసరించదు.
- source_word: πάντων
  choice: అందరి
  rationale: వాక్యంలోని సమగ్ర పరిధిని నేరుగా నిలుపుతుంది.
- source_word: τῶν λαῶν
  choice: ప్రజల
  rationale: బహువచనంలోని ప్రజాసమూహాల విస్తృత భావాన్ని ఉంచుతుంది; తరువాతి వచనంలో వచ్చే అన్యజనులు–ఇశ్రాయేలు విభజనను ముందుగానే ఇక్కడికి దిగుమతి చేయదు.
theological_decisions:
- issue: తరువాతి వచనంతో సంబంధంలో λαῶν యొక్క పరిధి
  choice: ప్రజలందరి
  alternative: జనాలన్నిటి
  rationale: మూలంలోని బహువచనం అనేక ప్రజాసమూహాలను సమష్టిగా సూచిస్తుంది. ప్రధాన పాఠం ఆధునిక తెలుగులో సహజంగా ఉండగా, ప్రత్యామ్నాయం బహువచన సమూహభావాన్ని మరింత ప్రత్యక్షంగా చూపుతుంది.
- issue: κατὰ πρόσωπον యొక్క బహిరంగత/దృశ్యత్వ భావం
  choice: ఎదుట
  alternative: కళ్ల ఎదుట
  rationale: ‘ఎదుట’ సమక్షం మరియు బహిరంగత రెండింటినీ సహజంగా మోస్తుంది. ‘కళ్ల ఎదుట’ దృశ్యత్వాన్ని మరింత స్పష్టపరుస్తుంది గాని ప్రధాన పాఠంలో కొంత వివరణాత్మకంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం. ‘ముఖము ఎదుట’ వంటి పదశః కానీ అసహజమైన రూపాన్ని నివారించి, మూలంలోని సమక్షం మరియు బహిరంగత భావాలను ‘ఎదుట’తో నిలిపింది.
