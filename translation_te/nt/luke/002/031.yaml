  yaml_path: translation/nt/luke/002/031.yaml
  text: which you prepared before the face of all the peoples[b][a],
translation:
  language: te
  text: దానిని నీవు ప్రజలందరి ఎదుట[a][b] సిద్ధపరిచావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజలందరి కళ్ల ఎదుట”; గ్రీకు నుడికారం అందరికీ కనిపించేలా బహిరంగంగా ఉంచబడినదాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “జనాలన్నిటి ఎదుట.”
