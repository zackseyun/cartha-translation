id: LUK.2.37
reference: Luke 2:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ αὐτὴ χήρα ⸀ἕως ἐτῶν ὀγδοήκοντα τεσσάρων,) ἣ οὐκ ⸀ἀφίστατο τοῦ ἱεροῦ νηστείαις καὶ δεήσεσιν λατρεύουσα νύκτα καὶ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/037.yaml
  text: and then as a widow until she was eighty-four years old[a]. She did not depart from the temple[c][b], worshiping with fastings and prayers night and day.
translation:
  language: te
  text: ఆమె ఎనభై నాలుగు సంవత్సరాల వయసు వరకు విధవరాలిగా ఉండేది.[a] ఆమె దేవాలయ ప్రాంగణాన్ని[b] విడిచిపెట్టేది కాదు; ఉపవాసాలతోను ప్రార్థనలతోను[c] రాత్రింబగళ్లు దేవుణ్ణి ఆరాధిస్తూ ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమె ఎనభై నాలుగు సంవత్సరాలుగా విధవరాలిగా ఉండేది.” గ్రీకు పదబంధం ఆమె వయసునైనా, ఆమె విధవరాలిగా గడిపిన కాలాన్నైనా సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ఇక్కడి గ్రీకు పదం లోపలి పరిశుద్ధస్థలాన్ని మాత్రమే కాకుండా దేవాలయ సముదాయాన్ని లేదా దాని ప్రాంగణాలను సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా, “విన్నపాలతో” లేదా “మనవులతో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: విధవరాలు
  rationale: భర్త మరణించిన స్త్రీ అనే సాధారణ అర్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἕως ἐτῶν ὀγδοήκοντα τεσσάρων
  choice: ఎనభై నాలుగు సంవత్సరాల వయసు వరకు
  rationale: ప్రధాన పాఠంలో ఈ సంక్షిప్త గ్రీకు పదబంధాన్ని అన్న వయసుగా గ్రహించాం; విధవత్వ కాలాన్ని సూచించే అవకాశం పాదసూచికలో ఉంచాం.
- source_word: ἀφίστατο τοῦ ἱεροῦ
  choice: దేవాలయ ప్రాంగణాన్ని విడిచిపెట్టకుండా
  rationale: అసంపూర్ణ కాలరూపం సూచించే నిరంతర లేదా అలవాటైన ఆచరణను తెలియజేస్తుంది; ἱερόν యొక్క విస్తృత ప్రాంగణ భావాన్ని కూడా స్పష్టం చేస్తుంది.
- source_word: ἱεροῦ
  choice: దేవాలయ ప్రాంగణం
  rationale: ఈ పదం అంతరాలయాన్ని మాత్రమే కాకుండా మొత్తం దేవాలయ పరిసరాలను సూచిస్తుంది.
- source_word: νηστείαις
  choice: ఉపవాసాలతో
  rationale: బహువచనం అన్న పదేపదే ఆచరించిన ఉపవాసాలను సహజంగా సూచిస్తుంది.
- source_word: δεήσεσιν
  choice: ప్రార్థనలతో
  rationale: సందర్భంలో సహజమైన తెలుగు పదం; విన్నపాలు అనే మరింత నిర్దిష్ట భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: λατρεύουσα
  choice: దేవుణ్ణి ఆరాధిస్తూ
  rationale: మతపరమైన సేవ లేదా ఆరాధన భావాన్ని స్పష్టంగా తెలుపుతుంది; తెలుగులో కర్మను వ్యక్తపరచడం వాక్యాన్ని సహజంగా చేస్తుంది.
- source_word: νύκτα καὶ ἡμέραν
  choice: రాత్రింబగళ్లు
  rationale: గ్రీకు క్రమాన్నీ నిరంతర భక్తి భావాన్నీ సహజమైన తెలుగు నుడికారంలో అందిస్తుంది.
theological_decisions:
- issue: అన్న వయసా, విధవరాలిగా గడిపిన కాలమా?
  choice: ప్రధాన పాఠంలో ఆమె వయసు ఎనభై నాలుగు సంవత్సరాలు అని తీసుకున్నాం.
  alternative: ఆమె ఎనభై నాలుగు సంవత్సరాలుగా విధవరాలిగా ఉందని కూడా ఈ గ్రీకు పదబంధాన్ని అర్థం చేసుకోవచ్చు.
  rationale: గ్రీకు వాక్యనిర్మాణం రెండు అర్థాలకూ అవకాశం ఇస్తుంది. సందిగ్ధతను తొలగించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. “రాత్రింబగళ్లు,” “ఉండిపోయింది,” “ఆరాధిస్తూ ఉండేది” వంటి రూపాలు నిరంతర ఆచరణను సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో వరుసగా ఉంచబడ్డాయి.
