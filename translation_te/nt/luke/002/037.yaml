  rationale: 'The revision makes only safe stylistic and grammatical improvements: it replaces the somewhat resultative “ఉండిపోయింది” with the descriptive “ఉండేది,” presents the ongoing non-departure in an idiomatic finite clause, and corrects the footnote typo. The ambiguity over whether eighty-four denotes Anna’s age or the duration of her widowhood remains explicitly preserved in footnote a. Footnote anchors are retained and placed immediately after their relevant terms.'
