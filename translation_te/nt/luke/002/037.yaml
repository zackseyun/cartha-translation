- from: ఆమె ఎనభై నాలుగు సంవత్సరాల వయసు వరకు విధవరాలిగానే ఉండిపోయింది.[a] ఆమె దేవాలయ ప్రాంగణాన్ని విడిచిపెట్టకుండా,[b] ఉపవాసాలతో, ప్రార్థనలతో[c] రాత్రింబగళ్లు దేవుణ్ణి ఆరాధిస్తూ ఉండేది.
