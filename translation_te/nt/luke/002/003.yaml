- source_word: πάντες
  choice: అందరూ
  rationale: ‘అందరూ’ మూలంలోని సమగ్ర భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀπογράφεσθαι
  choice: నమోదు చేయించుకోవడానికి
  rationale: జనగణన సందర్భంలోని అధికారిక నమోదును సూచిస్తుంది. మధ్యమ రూపంలోని వ్యక్తి తనను నమోదు చేయించుకునే భావాన్ని ఈ ప్రయోగం సహజంగా తెలియజేస్తుంది.
- source_word: ἕκαστος
  choice: ఒక్కొక్కరు
  rationale: ప్రతి వ్యక్తి విడివిడిగా వెళ్లడాన్ని తెలిపే విభాజక భావాన్ని నిలుపుతుంది.
- source_word: ἑαυτοῦ
  choice: తమ సొంత
  rationale: ‘ఒక్కొక్కరు’తో సహజంగా సరిపోయే తెలుగు ఆత్మార్థక ప్రయోగం; ప్రతి ఒక్కరికీ సంబంధించిన సొంత పట్టణం అనే భావాన్ని కాపాడుతుంది.
- source_word: πόλιν
  choice: పట్టణం
  rationale: πόλις‌కు సహజమైన విస్తృత తెలుగు సమానార్థకం; ‘స్వస్థలం’ లేదా ‘పూర్వీకుల ఊరు’ వంటి మూలంలో లేని వివరణను చేర్చదు.
theological_decisions:
- issue: ἕκαστος ... ἑαυτοῦ లోని ఏకవచన పుంలింగ విభాజక నిర్మాణం
  choice: ఒక్కొక్కరు తమ సొంత పట్టణానికి
  alternative: ఒక్కొక్కడు తన సొంత పట్టణానికి
  rationale: గ్రీకులో నిర్మాణం వ్యాకరణపరంగా ఏకవచన పుంలింగంలో ఉంది. అయితే తెలుగులో ‘ఒక్కొక్కరు తమ’ అనేది ప్రతి వ్యక్తిని సూచించే సహజమైన గౌరవ/సామాన్య విభాజక నిర్మాణం; మూల భావాన్ని నిలుపుతూ అనవసరంగా పురుషులకు మాత్రమే పరిమితం చేయదు. మూలంలోని వ్యాకరణ రూపం పాదసూచికలో స్పష్టం చేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. కొనసాగుతున్న కదలికను ‘వెళ్తూ ఉన్నారు’తో, వ్యక్తిగత విభజనను ‘ఒక్కొక్కరు’తో వ్యక్తం చేసింది. పరిపాలనా సందర్భానికి సరిపోయేలా ‘నమోదు చేయించుకోవడానికి’ వాడబడింది.
