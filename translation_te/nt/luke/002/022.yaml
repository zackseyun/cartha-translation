revisions:
- from: మోషే ధర్మశాస్త్రం ప్రకారం వారి శుద్ధీకరణ దినాలు పూర్తయినప్పుడు[a], ఆయనను ప్రభువు సమక్షంలో అర్పించడానికి వారు యెరూషలేముకు తీసుకువెళ్లారు.
  to: మోషే ధర్మశాస్త్రం ప్రకారం వారి శుద్ధీకరణ దినాలు పూర్తయినప్పుడు[a], ప్రభువు ఎదుట ఆయనను సమర్పించడానికి వారు ఆయనను యెరూషలేముకు తీసుకువెళ్లారు.
