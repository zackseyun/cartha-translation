    text: కొన్ని ప్రతుల్లో ‘వారి శుద్ధీకరణ’కు బదులుగా ‘ఆమె శుద్ధీకరణ’ అని ఉంది.
    reason: textual_variant
  revision_rationale: The revision changes only the rendering of παραστῆσαι, from ‘అర్పించడానికి’ to ‘సమర్పించడానికి,’ and explicitly retains the ‘before the Lord’ sense with ‘ప్రభువు ఎదుట.’ The plural pronoun and its textual-variant footnote remain intact.
