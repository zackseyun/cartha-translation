id: LUK.2.22
reference: Luke 2:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐπλήσθησαν αἱ ἡμέραι τοῦ καθαρισμοῦ αὐτῶν κατὰ τὸν νόμον Μωϋσέως, ἀνήγαγον αὐτὸν εἰς Ἱεροσόλυμα παραστῆσαι τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/022.yaml
  text: And when the days of their purification were fulfilled according to the law of Moses[a], they brought him up to Jerusalem to present him to the Lord,
translation:
  language: te
  text: మోషే ధర్మశాస్త్రం ప్రకారం వారి శుద్ధీకరణ దినాలు పూర్తయినప్పుడు[a], ప్రభువు ఎదుట ఆయనను సమర్పించడానికి వారు ఆయనను యెరూషలేముకు తీసుకువెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘వారి శుద్ధీకరణ’కు బదులుగా ‘ఆమె శుద్ధీకరణ’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: పూర్తయినప్పుడు
  rationale: కాలవ్యవధి తన పూర్తి పరిమితికి చేరడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: καθαρισμοῦ
  choice: శుద్ధీకరణ
  rationale: ప్రసవానంతరం మోషే ధర్మశాస్త్రం నిర్దేశించిన ఆచారపరమైన శుద్ధిని సూచించే స్పష్టమైన పదం.
- source_word: αὐτῶν
  choice: వారి
  rationale: ఇచ్చిన SBLGNT పాఠంలోని బహువచన సర్వనామాన్ని యథాతథంగా నిలుపుతుంది; ఏకవచన పాఠాంతరాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: κατὰ τὸν νόμον Μωϋσέως
  choice: మోషే ధర్మశాస్త్రం ప్రకారం
  rationale: మోషే ధర్మశాస్త్ర నిర్దేశానికి అనుగుణంగా జరిగినదనే న్యాయపరమైన భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἀνήγαγον
  choice: తీసుకువెళ్లారు
  rationale: యెరూషలేముకు పైకి తీసుకెళ్లారనే సందర్భార్థాన్ని సహజ తెలుగులో అందిస్తుంది; తెలుగులో దిశను ప్రత్యేకంగా చేర్చకపోయినా గమ్యం స్పష్టంగా ఉంది.
- source_word: Ἱεροσόλυμα
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన స్థలనామ రూపం.
- source_word: παραστῆσαι
  choice: సమక్షంలో అర్పించడానికి
  rationale: దేవుని ఎదుట శిశువును ఆచారపూర్వకంగా సమర్పించే భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: κυρίῳ
  choice: ప్రభువు
  rationale: κύριοςకు గౌరవపూర్వకమైన, సాధారణ తెలుగు సమానార్థకం; ఇక్కడ దేవుణ్ణి సూచిస్తుంది.
theological_decisions:
- issue: ‘వారి శుద్ధీకరణ’లో సర్వనామ సంఖ్య
  choice: ప్రధాన పాఠంలో బహువచనమైన ‘వారి’ని నిలుపుట
  alternative: ‘ఆమె శుద్ధీకరణ’
  rationale: ఇచ్చిన గ్రీకు పాఠంలో αὐτῶν (‘వారి’) ఉంది. లేవీయకాండ నేపథ్యం లేదా పాఠాంతరం ఆధారంగా దాన్ని నిశ్శబ్దంగా ఏకవచనంగా మార్చకుండా, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం మూలపాఠంలోని ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ధర్మశాస్త్రం’, ‘శుద్ధీకరణ’, ‘ప్రభువు సమక్షంలో అర్పించడం’ వంటి పదాలు సందర్భంలోని న్యాయపరమైన, ఆచారపరమైన భావాన్ని నిలుపుతాయి.
