id: LUK.2.25
reference: Luke 2:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ⸂ἄνθρωπος ἦν⸃ ἐν Ἰερουσαλὴμ ᾧ ὄνομα Συμεών, καὶ ὁ ἄνθρωπος οὗτος δίκαιος καὶ εὐλαβής, προσδεχόμενος παράκλησιν τοῦ Ἰσραήλ, καὶ πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/025.yaml
  text: And behold[a], there was a man in Jerusalem whose name was Simeon, and this man was righteous and devout, waiting for the consolation of Israel[b], and the Holy Spirit was upon him.
translation:
  language: te
  text: ఇదిగో, యెరూషలేములో సిమ్యోను అనే ఒక మనిషి ఉండేవాడు. ఆ మనిషి నీతిమంతుడు, దైవభక్తి గలవాడు. అతడు ఇశ్రాయేలు యొక్క ఆదరణ[a] కోసం ఎదురుచూస్తూ ఉండేవాడు; పరిశుద్ధాత్మ అతనిపై ఉండెను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఇశ్రాయేలు యొక్క ఓదార్పు’ అని కూడా అనువదించవచ్చు. ఈ మాట ఇశ్రాయేలు కోసం దేవుడు వాగ్దానం చేసిన ఓదార్పు, పునరుద్ధరణ నిరీక్షణను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘పరిశుద్ధమైన ఒక ఆత్మ అతనిపై ఉండేది’ అనే అర్థం వ్యాకరణపరంగా సాధ్యమే; అయితే లూకా సందర్భంలో ఇది పరిశుద్ధాత్మను సూచించడమే అత్యంత సహజం.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: లూకా ఒక ముఖ్యమైన వ్యక్తిని సజీవంగా పరిచయం చేయడానికి ఉపయోగించిన కథన సూచికను సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: ἄνθρωπος
  choice: ఒక మనిషి
  rationale: ఇక్కడ సూచించబడుతున్నది సుమెయోను అనే పురుషుడు; అందువల్ల మూలంలోని వ్యక్తిగత, లింగసూచక భావం నిలుస్తుంది.
- source_word: ᾧ ὄνομα Συμεών
  choice: సుమెయోను అనే
  rationale: గ్రీకు గుర్తింపు నిర్మాణాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: δίκαιος
  choice: నీతిమంతుడు
  rationale: సుమెయోను నైతికంగానూ దేవుని నిబంధనకు అనుగుణంగానూ జీవించినవాడనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: εὐλαβής
  choice: దైవభక్తి గలవాడు
  rationale: దేవునిపట్ల భయభక్తులతో, జాగ్రత్తగా జీవించే స్వభావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: προσδεχόμενος
  choice: ఎదురుచూస్తూ ఉండేవాడు
  rationale: కొనసాగుతున్న ఆశాభరిత నిరీక్షణను తెలుగు క్రియారూపం సహజంగా తెలియజేస్తుంది.
- source_word: παράκλησιν τοῦ Ἰσραήλ
  choice: ఇశ్రాయేలుకు కలిగే ఆదరణ
  rationale: παράκλησις లోని ఓదార్పు, ఆదరణ, దేవుడు కలిగించే పునరుద్ధరణ అనే భావవిస్తృతిని అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: πνεῦμα ἅγιον
  choice: పరిశుద్ధాత్మ
  rationale: గ్రీకులో నిర్దేశక పదం లేకపోయినా, లూకా సందర్భంలో—ముఖ్యంగా తరువాతి వచనాల్లో—ఇది సహజంగా పరిశుద్ధాత్మను సూచిస్తుంది; తెలుగు రూపానికి వ్యాకరణ నిర్దేశక పదం అవసరం లేదు.
- source_word: ἐπ’ αὐτόν
  choice: అతనిపై ఉన్నాడు
  rationale: ఆత్మ యొక్క సన్నిధి లేదా కార్యసామర్థ్యాన్ని సూచించే మూలభాషా రూపకాన్ని అర్థాన్ని విస్తరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν ఎవరిని లేదా దేనిని సూచిస్తుంది?
  choice: పరిశుద్ధాత్మ అతనిపై ఉన్నాడు
  alternative: పరిశుద్ధమైన ఒక ఆత్మ అతనిపై ఉండేది
  rationale: లూకా 2:26–27లోని సమీప సందర్భం మరియు లూకా రచనల్లోని ప్రయోగం దీన్ని పరిశుద్ధాత్మకు సూచనగా గ్రహించడానికి బలమైన ఆధారం ఇస్తాయి. అయినప్పటికీ గ్రీకు నిర్దేశక పదం లేని నిర్మాణం వల్ల ఏర్పడే వ్యాకరణ సాధ్యతను పాదసూచికలో తెలియజేశారు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘ఇదిగో’ అనే కథన సూచికను, ‘ఆ మనిషి’ అనే మూలంలోని పునరుక్తిని నిలిపి, చిన్న వాక్యాల ద్వారా సాధారణ పాఠకులకు స్పష్టత కలిగించబడింది. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట సరిగా ఉంచబడ్డాయి.
