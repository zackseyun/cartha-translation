revisions:
- from: అషేరు గోత్రానికి చెందిన ఫనూయేలు కుమార్తె అన్న అనే ప్రవక్త్రి కూడా అక్కడ ఉంది. ఆమె చాలా వృద్ధురాలు; తన కన్యాత్వం ముగిసినప్పటి నుండి ఏడు సంవత్సరాలు భర్తతో జీవించింది.[a]
