  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἦν Ἅννα προφῆτις, θυγάτηρ Φανουήλ, ἐκ φυλῆς Ἀσήρ (αὕτη προβεβηκυῖα ἐν ἡμέραις πολλαῖς, ζήσασα ⸂μετὰ ἀνδρὸς ἔτη⸃ ἑπτὰ ἀπὸ τῆς παρθενίας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/036.yaml
  text: And there was a prophetess[a], Anna, the daughter of Phanuel, from the tribe of Asher. She was advanced in years, having lived with her husband seven years from her virginity[b],
translation:
  language: te
  text: ఫనూయేలు కుమార్తెను, అషేరు గోత్రానికి చెందిన అన్న అనే ఒక ప్రవక్తురాలు ఉండేది. ఆమె చాలా వృద్ధురాలు; తన కన్యత్వం ముగిసినప్పటి నుండి తన భర్తతో ఏడు సంవత్సరాలు జీవించింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన కన్యత్వం తరువాత తన భర్తతో ఏడు సంవత్సరాలు జీవించింది”; అంటే, వివాహంతో కన్యత్వ స్థితి ముగిసినప్పటి నుండి ఏడు సంవత్సరాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆτις
  choice: ప్రవక్త్రి
  rationale: స్త్రీని సూచించే గ్రీకు నామవాచకంలోని లింగసూచనను సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: θυγάτηρ Φανουήλ
  choice: ఫనూయేలు కుమార్తె
  rationale: సహజమైన తెలుగు వంశపరిచయ ప్రయోగం.
- source_word: ἐκ φυλῆς Ἀσήρ
  choice: అషేరు గోత్రానికి చెందిన
  rationale: మూలం లేదా గోత్రసంబంధాన్ని తెలిపే ἐκ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: προβεβηκυῖα ἐν ἡμέραις πολλαῖς
  choice: చాలా వృద్ధురాలు
  rationale: అక్షరార్థంగా ‘అనేక దినాల్లో ముందుకు సాగినది’ అనే గ్రీకు వృద్ధాప్య నుడికారానికి ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: ζήσασα μετὰ ἀνδρὸς ἔτη ἑπτὰ
  choice: ఏడు సంవత్సరాలు భర్తతో జీవించింది
  rationale: ఇక్కడ భర్తతో గడిపిన వైవాహిక జీవితాన్నే సూచిస్తుంది; తెలుగు వాక్యంలో సహజంగా ఉంటుంది.
- source_word: ἀπὸ τῆς παρθενίας αὐτῆς
  choice: తన కన్యాత్వం ముగిసినప్పటి నుండి
  rationale: కాలగణన ఆమె కన్యాత్వ స్థితి ముగిసినప్పటి నుంచి మొదలవుతుందని తెలుపుతుంది; వివాహానికి ముందు ఉన్న స్థితిని అనవసరంగా విస్తరించదు.
theological_decisions:
- issue: అన్న పాత్రకు προφῆτις అనే గుర్తింపు
  choice: ఆమెను ‘ప్రవక్త్రి’గా స్పష్టంగా పేర్కొనడం
  alternative: దీనిని కేవలం గౌరవపదంగా లేదా భక్తురాలు అనే సాధారణ అర్థంగా బలహీనపరచడం
  rationale: మూలపాఠం స్త్రీలింగంలోని సాధారణ ‘ప్రవక్త’ పదాన్నే స్పష్టంగా ఉపయోగిస్తుంది.
- issue: అన్న వయస్సు వర్ణన
  choice: గ్రీకు నుడికార భావాన్ని ‘చాలా వృద్ధురాలు’గా ఇవ్వడం
  alternative: ‘అనేక దినాల్లో ముందుకు సాగినది’ అని అక్షరానువాదం చేయడం లేదా తదుపరి వచనంలోని కాలగణనను ఇక్కడికి తీసుకురావడం
  rationale: సహజమైన తెలుగులో నుడికారార్థాన్ని అందిస్తూ, మూలం చెప్పినదానికంటే నిర్దిష్టమైన వయస్సును చేర్చదు.
- issue: ἀπὸ τῆς παρθενίας αὐτῆς యొక్క కాలసంబంధం
  choice: ఏడు సంవత్సరాలు ఆమె కన్యాత్వం ముగిసినప్పటి నుండి లెక్కించబడినవిగా చూపడం
  alternative: ‘తన కన్యాత్వం నుండి’ అనే అస్పష్టమైన అక్షరానువాదం
  rationale: మూలంలోని కాలారంభ భావాన్ని తెలుగులో అర్థమయ్యేలా చేస్తుంది; దీనికి వివరణాత్మక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. వచనం తరువాతి వాక్యంతో కొనసాగుతున్నందున చివరలో పూర్తి విరామం పెట్టలేదు; పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
