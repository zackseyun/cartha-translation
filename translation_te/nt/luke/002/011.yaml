id: LUK.2.11
reference: Luke 2:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ἐτέχθη ὑμῖν σήμερον σωτὴρ ὅς ἐστιν χριστὸς κύριος ἐν πόλει Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/011.yaml
  text: because today a Savior was born for you in the city of David[a], who is Messiah the Lord.
translation:
  language: te
  text: ఎందుకంటే ఈ రోజు దావీదు పట్టణంలో మీ కోసం రక్షకుడు పుట్టాడు; ఆయనే మెస్సీయ, ప్రభువు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత సాంప్రదాయికంగా, “క్రీస్తు ప్రభువు” అని అనువదించవచ్చు. గ్రీకులో χριστὸς κύριος అనే రెండు బిరుదులు ఉన్నాయి; అక్షరార్థంగా “మెస్సీయ ప్రభువు,” సాధారణంగా “మెస్సీయయైన ప్రభువు” అని అర్థం చేసుకుంటారు.
    reason: χριστὸς κύριος అనే సంక్షిప్త గ్రీకు పదబంధానికి ఉన్న సాంప్రదాయిక మరియు వ్యాఖ్యానాత్మక ప్రత్యామ్నాయాలను తెలియజేయడం.
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న దేవదూత ప్రకటనకు కారణాన్ని లేదా వివరణను పరిచయం చేసే సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐτέχθη
  choice: పుట్టాడు
  rationale: τίκτω అనే క్రియ యొక్క భూతకాల సంఘటనను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; కర్త పురుషుడని సందర్భం స్పష్టం చేస్తుంది.
- source_word: ὑμῖν
  choice: మీ కోసం
  rationale: ఇక్కడ దత్తివిభక్తి సూచించే ప్రయోజనార్థాన్ని, అంటే ఈ జననం వినేవారి మేలుకోసమని, స్పష్టంగా తెలియజేస్తుంది.
- source_word: σήμερον
  choice: ఈ రోజు
  rationale: కాలాన్ని స్పష్టంగా తెలిపే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: σωτὴρ
  choice: రక్షకుడు
  rationale: విడుదల మరియు రక్షణ అనే భావాలతో పాటు ఈ సందర్భంలోని మెస్సీయ సంబంధమైన ప్రాముఖ్యతను నిలుపుతుంది.
- source_word: ὅς ἐστιν
  choice: ఆయనే
  rationale: పుట్టిన రక్షకుడిని తరువాతి బిరుదులతో గుర్తించే గ్రీకు సంబంధవాక్యాన్ని తెలుగులో సంక్షిప్తంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: χριστὸς
  choice: మెస్సీయ
  rationale: ఇక్కడ ఇది వ్యక్తిపేరు కాకుండా దావీదు వంశానికి సంబంధించిన అభిషిక్త రాజు అనే బిరుదుగా ఉంది; అందువల్ల అర్థాన్ని తెలిపే ‘మెస్సీయ’ వాడబడింది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: అధికారాన్ని మరియు ఈ క్రీస్తు సంబంధమైన ప్రకటనలోని గాఢమైన ధార్మిక భావాన్ని నిలుపుతుంది.
- source_word: ἐν πόλει Δαυίδ
  choice: దావీదు పట్టణంలో
  rationale: గ్రీకు పదబంధాన్ని సహజమైన తెలుగులో అందిస్తూ దావీదు రాజవంశ సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: χριστὸς κύριος అనే రెండు బిరుదుల అన్వయం
  choice: మెస్సీయ, ప్రభువు
  alternative: ప్రభువైన మెస్సీయ; ప్రభువు యొక్క మెస్సీయ; క్రీస్తు ప్రభువు
  rationale: గ్రీకులో రెండు ప్రథమావిభక్తి బిరుదులు పక్కపక్కనే ఉండటం వల్ల వాటి మధ్య ఖచ్చితమైన వ్యాకరణ సంబంధం కొంత సంక్షిప్తంగా ఉంది. కామాతో రెండు బిరుదులనూ సమానంగా ఉంచడం ద్వారా ‘ప్రభువైన మెస్సీయ’ అని పూర్తిగా వ్యాఖ్యానించకుండా అసలు వాక్యంలోని ఉద్వేగాన్ని, స్వల్ప అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే దేవదూత ప్రకటనకు తగిన గౌరవప్రదమైన శైలిలో ఉంది. పదక్రమం తెలుగుకు సహజంగా మార్చబడింది; గ్రీకు బిరుదుల మధ్య ఉన్న సంబంధం అతిగా నిర్ధారించబడలేదు.
