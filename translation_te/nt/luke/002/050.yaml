language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ οὐ συνῆκαν τὸ ῥῆμα ὃ ἐλάλησεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/050.yaml
  text: And they did not understand the statement that he spoke to them[a].
translation:
  language: te
  text: ఆయన వారితో చెప్పిన మాటను వారు అర్థం చేసుకోలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పలుకును” లేదా “విషయాన్ని.”
    reason: ῥῆμα అనే గ్రీకు పదం సందర్భాన్ని బట్టి పలుకు లేదా విషయం అనే అర్థాలను కూడా ఇవ్వగలదు.
lexical_decisions:
- source_word: καὶ
  choice: '[ప్రత్యేక పదంగా అనువదించలేదు]'
  rationale: తెలుగులో ఈ వాక్యం ముందటి కథనానికి సహజంగా కొనసాగుతుంది. ‘మరియు’ అని పెట్టడం కృత్రిమంగా ఉంటుంది; ‘అయితే’ లేదా ‘కాని’ అని పెడితే గ్రీకులో స్పష్టంగా లేని వ్యతిరేక భావం చేరుతుంది.
- source_word: αὐτοὶ
  choice: వారు
  rationale: సందర్భంలో ఇది యేసు తల్లిదండ్రులను సూచిస్తుంది. గ్రీకులో సర్వనామం స్పష్టంగా ఉన్నందున తెలుగులోనూ ‘వారు’ అని ఉంచాం; ‘వారే’ అనడం అవసరానికి మించిన ఉద్ఘాటన కావచ్చు.
- source_word: οὐ συνῆκαν
  choice: అర్థం చేసుకోలేదు
  rationale: συνίημι ఇక్కడ గ్రహించడం లేదా అర్థం చేసుకోవడం అనే సాధారణ భావాన్ని ఇస్తుంది. ‘అర్థం చేసుకోలేదు’ సహజమైన ఆధునిక తెలుగు; పాక్షిక అవగాహన లేదా నిరాకరణ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: τὸ ῥῆμα
  choice: మాటను
  rationale: ῥῆμα ఒక పలుకు, చెప్పబడినది, లేదా విషయం అనే అర్థాలు కలిగి ఉండవచ్చు. ఇక్కడ యేసు అప్పుడే చెప్పిన నిర్దిష్ట పలుకును ‘మాట’ సహజంగా సూచిస్తుంది; మూలపదంలోని భావవిస్తృతిని పాదసూచికలో నిలిపాం.
- source_word: ὃ ἐλάλησεν αὐτοῖς
  choice: ఆయన తమతో చెప్పిన
  rationale: సాపేక్ష ఉపవాక్యాన్ని తెలుగులో సహజమైన కృదంత నిర్మాణంగా మార్చాం. ‘తమతో’ అనే ఆత్మార్థక రూపం, కర్త అయిన ‘వారు’నే ఆయన సంభోదించాడని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: యేసు తల్లిదండ్రుల ప్రతిస్పందనను కథనం చూపించే విధానం
  choice: యేసు చెప్పిన మాటను వారు అర్థం చేసుకోలేదని నేరుగా పేర్కొనడం
  alternative: వారు పూర్తిగా అర్థం చేసుకోలేదు; వారు అంగీకరించలేదు
  rationale: గ్రీకు పాఠం అవగాహన లేకపోవడాన్ని మాత్రమే చెబుతుంది. అది పాక్షిక అవగాహననో నిరాకరణనో పేర్కొనదు. యేసు వ్యక్తిత్వం మరియు కార్యం గురించి కథనంలో ఉన్న ఉద్విగ్నతను వివరణతో తొలగించకుండా అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘మాట’ సాధారణ పాఠకులకు సహజంగా ఉండి, యేసు చేసిన నిర్దిష్ట ప్రకటనను సూచిస్తుంది. మూలంలోని భావసాధ్యతలను పాదసూచికలో ఇచ్చాం.
