    text: లేదా “పలుకును” లేదా “విషయాన్ని.”
    reason: ῥῆμα అనే గ్రీకు పదం సందర్భాన్ని బట్టి పలుకు లేదా విషయం అనే అర్థాలను కూడా ఇవ్వగలదు.
  revision_rationale: The revision preserves the plain statement that they did not understand Jesus’ utterance, while replacing the unnatural reflexive wording with an unambiguous modern Telugu construction. The footnote is streamlined to natural lexical alternatives for ῥῆμα.
