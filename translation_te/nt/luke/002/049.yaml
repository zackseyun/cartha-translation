id: LUK.2.49
reference: Luke 2:49
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Τί ὅτι ἐζητεῖτέ με; οὐκ ᾔδειτε ὅτι ἐν τοῖς τοῦ πατρός μου δεῖ εἶναί με;
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/049.yaml
  text: And he said to them[a], “Why were you looking for me? Did you not know that I must be in my Father’s house?”
translation:
  language: te
  text: ఆయన వారితో, “మీరు నన్నెందుకు వెదికారు? నేను నా తండ్రి ఇంటిలో ఉండవలసిందేనని[a] మీకు తెలియదా?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నా తండ్రికి సంబంధించిన వాటిలో ఉండవలసిందేనని.” అక్షరార్థంగా, “నా తండ్రికి సంబంధించిన వాటిలో ఉండవలసిందేనని.” గ్రీకు పదబంధంలో అవసరమైన నామవాచకం చెప్పబడలేదు; అందువల్ల అది తండ్రి ఇంటినిగానీ, తండ్రి కార్యాలనుగానీ, విషయాలనుగానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὅτι
  choice: ఎందుకు
  rationale: కారణాన్ని ప్రశ్నించే గ్రీకు నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ἐζητεῖτέ
  choice: వెదికారు
  rationale: కథన సందర్భంలో తల్లిదండ్రులు యేసును వెదుకుతున్న చర్యను సహజంగా సూచిస్తుంది; గ్రీకు అసంపూర్ణ భూతకాల భావాన్ని తెలుగు సందర్భం స్పష్టం చేస్తుంది.
- source_word: οὐκ ᾔδειτε
  choice: మీకు తెలియదా?
  rationale: జ్ఞానం లేదా అవగాహనను సూచించే మూలపదాన్నీ, అలంకారప్రశ్న బలాన్నీ నేరుగా నిలుపుతుంది.
- source_word: ἐν τοῖς τοῦ πατρός μου
  choice: నా తండ్రి ఇంటిలో
  rationale: ఈ గ్రీకు పదబంధం అధ్యాహారంగా ఉంది; ఆలయ సందర్భంలో ‘నా తండ్రి ఇంటిలో’ అనేది అత్యంత సంభావ్యమైన, సహజమైన అర్థం. ఇతర సంభావ్య అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: δεῖ
  choice: ఉండవలసిందే
  rationale: దైవికంగా లేదా తప్పనిసరిగా కలిగే అవసరాన్ని సాధారణ ‘ఉండాలి’ కంటే స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: εἶναί με
  choice: నేను ... ఉండవలసిందే
  rationale: δεῖతో కూడిన కర్తృకర్మ infinitive నిర్మాణాన్ని సహజమైన తెలుగు వాక్యంగా అందిస్తుంది.
- source_word: πατρός μου
  choice: నా తండ్రి
  rationale: యేసు ఇక్కడ దేవుణ్ణి తన తండ్రిగా సూచిస్తున్నాడు. తెలుగులో పెద్ద అక్షరాల భేదం లేనందున అదనపు వ్యాఖ్యాన పదాలు చేర్చకుండా మూలంలోని పుత్రసంబంధ వాదనను యథాతథంగా ఉంచుతుంది.
theological_decisions:
- issue: ἐν τοῖς τοῦ πατρός μου అనే అధ్యాహార పదబంధం
  choice: ప్రధాన పాఠ్యంలో ‘నా తండ్రి ఇంటిలో’
  alternative: ‘నా తండ్రి కార్యాల్లో నిమగ్నమై’ లేదా ‘నా తండ్రికి సంబంధించిన వాటిలో’
  rationale: తక్షణ సందర్భం ఆలయం కాబట్టి ‘ఇంటిలో’ అనే అర్థం ప్రధాన పాఠ్యానికి సందర్భోచితం. అయితే గ్రీకు నిర్మాణం తండ్రి వ్యవహారాలు లేదా ఆయనకు సంబంధించిన విషయాలను కూడా సూచించగలదు; అందువల్ల ఆ నిజమైన సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
- issue: ‘నా తండ్రి’ ఎవరిని సూచిస్తుంది
  choice: దేవుణ్ణి తండ్రిగా సూచించే మాటను వివరణ చేర్చకుండా నిలుపుట
  alternative: ‘దేవుడైన నా తండ్రి’ అని స్పష్టీకరించడం
  rationale: ఆలయ సందర్భంలో సూచన దేవునికే అయినా, మూలపాఠ్యంలో లేని ‘దేవుడైన’ అనే వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు. దీనివల్ల యేసు పలికిన పుత్రసంబంధ ప్రకటన తన సహజ బలంతో నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘వెదికారు’ సాధారణ పాఠకులకు సులభం; ‘ఉండవలసిందే’ δεῖలోని తప్పనిసరి అవసరాన్ని నిలుపుతుంది. పాదసూచిక గుర్తు సందిగ్ధ పదబంధం వెంటనే ఉంచబడింది.
