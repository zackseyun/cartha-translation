id: LUK.2.24
reference: Luke 2:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τοῦ δοῦναι θυσίαν κατὰ τὸ εἰρημένον ἐν ⸀τῷ νόμῳ κυρίου, ζεῦγος τρυγόνων ἢ δύο νοσσοὺς περιστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/024.yaml
  text: 'and to offer a sacrifice according to what had been said in the Law of the Lord: a pair of turtledoves or two young pigeons[a].'
translation:
  language: te
  text: ప్రభువు ధర్మశాస్త్రంలో చెప్పబడిన ప్రకారం ఒక జత తాబేలు పావురాలను లేదా రెండు పావురపు పిల్లలను బలిగా అర్పించడానికి కూడా వారు వచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువు ధర్మశాస్త్రంలో చెప్పబడి ఉన్న ప్రకారం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ δοῦναι θυσίαν
  choice: బలిగా అర్పించడానికి
  rationale: δίδωμι పదానికి మూలార్థం ‘ఇవ్వడం’ అయినప్పటికీ, θυσίαతో కలిసి ఇక్కడ బలిని అర్పించడాన్ని సూచిస్తుంది. తెలుగు సహజ ప్రయోగంలో ‘బలిగా అర్పించడానికి’ ఉద్దేశార్థక infinitive భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: κατὰ τὸ εἰρημένον
  choice: చెప్పబడిన ప్రకారం
  rationale: perfect passive participle, ముందుగా పలికబడి ఇప్పటికీ ప్రామాణికంగా ఉన్న వాక్యాన్ని సూచిస్తుంది. ‘నిర్దేశించబడిన’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా, చెప్పడం అనే మూల క్రియాభావాన్ని నిలుపుతుంది.
- source_word: ἐν τῷ νόμῳ κυρίου
  choice: ప్రభువు ధర్మశాస్త్రంలో
  rationale: νόμος ఇక్కడ మోషే ధర్మశాస్త్రాన్ని సూచిస్తుంది; κύριοςకు సహజమైన గౌరవప్రద తెలుగు రూపం ‘ప్రభువు’. సంధర్భంలో ‘ప్రభువు ధర్మశాస్త్రం’ అనే సంబంధం స్పష్టంగా ఉంటుంది.
- source_word: ζεῦγος τρυγόνων
  choice: ఒక జత తెల్ల గువ్వలు
  rationale: ζεῦγοςను ‘ఒక జత’గా స్పష్టంగా అందించాం. τρυγών సాధారణ పావురం కాక turtledove అనే నిర్దిష్ట పక్షిని సూచిస్తుంది; ఆధునిక తెలుగు బైబిలు వాడుకలో గుర్తించదగిన ‘తెల్ల గువ్వ’ను ఎంచుకున్నాం.
- source_word: δύο νοσσοὺς περιστερῶν
  choice: రెండు పావురపు పిల్లలు
  rationale: νοσσός చిన్న పక్షి లేదా పిల్లను, περιστερά పావురాన్ని సూచిస్తుంది. ‘పావురపు పిల్లలు’ సహజమైన, ఖచ్చితమైన తెలుగు రూపం.
theological_decisions:
- issue: లేఖన-ధర్మశాస్త్ర సూత్రంలో κύριος అనువాదం
  choice: ప్రభువు
  alternative: యెహోవా
  rationale: గ్రీకు పాఠంలో κύριος ఉన్నందున కొత్త నిబంధనలో దాని సాధారణ తెలుగు అనువాదమైన ‘ప్రభువు’ను నిలిపాం. పాత నిబంధన నేపథ్యంలోని దైవనామాన్ని ఊహించి పాఠ్యంలోకి చేర్చలేదు.
- issue: κατὰ τὸ εἰρημένον యొక్క కాలసూచన
  choice: చెప్పబడిన ప్రకారం
  alternative: చెప్పబడి ఉన్న ప్రకారం
  rationale: గ్రీకు perfect రూపం గతంలో పలికినది ఇప్పటికీ ప్రమాణంగా నిలిచి ఉందనే ఛాయను కలిగి ఉంది. సహజ తెలుగులో ‘చెప్పబడిన ప్రకారం’ ఆ భావాన్ని తగినంతగా మోస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో చూపించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ఈ వాక్యం ముందటి వచనంతో వ్యాకరణపరంగా కొనసాగుతున్నందున, తెలుగులో స్వతంత్రంగా సులభంగా అర్థమయ్యేలా ‘వారు వచ్చారు’ను సందర్భపూరకంగా చేర్చాం. ఉద్ధరణ గుర్తులు ధర్మశాస్త్రంలోని బలి పదబంధాన్ని స్పష్టంగా గుర్తిస్తాయి.
