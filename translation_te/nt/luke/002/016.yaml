source:
  edition: SBLGNT
  text: καὶ ἦλθαν σπεύσαντες καὶ ἀνεῦραν τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ καὶ τὸ βρέφος κείμενον ἐν τῇ φάτνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/016.yaml
  text: And they came in haste and found Mary and Joseph[a], and the baby lying in the manger.
translation:
  language: te
  text: వారు త్వరపడి వచ్చి మరియను, యోసేపును, పశువులకు మేత పెట్టే తొట్టిలో[a] పడుకొని ఉన్న శిశువును కనుగొన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మేత తొట్టిలో.” గ్రీకు పదం పశువులకు మేత పెట్టే తొట్టిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθαν
  choice: వచ్చి
  rationale: కథనంలో కాపరులు దేవదూత తెలియజేసిన స్థలానికి చేరుకున్న కదలికను సహజంగా తెలియజేస్తుంది.
- source_word: σπεύσαντες
  choice: త్వరగా
  rationale: ప్రధాన క్రియతో పాటు జరిగిన చర్యలోని ఆతురతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀνεῦραν
  choice: కనుగొన్నారు
  rationale: వెదికిన తరువాత కనిపెట్టడం అనే భావాన్ని సందర్భానికి తగిన విధంగా వ్యక్తం చేస్తుంది.
- source_word: τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ
  choice: మరియను, యోసేపును
  rationale: వ్యక్తుల పేర్లకు ప్రామాణిక తెలుగు రూపాలను వాడి, గ్రీకు సమన్వయ నిర్మాణాన్ని సహజమైన తెలుగు జాబితాగా అందిస్తుంది.
- source_word: τὸ βρέφος
  choice: శిశువును
  rationale: βρέφος సూచించే అతి చిన్న బిడ్డకు ‘శిశువు’ స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: κείμενον
  choice: పడుకొని ఉన్న
  rationale: ఎవరో శిశువును అక్కడ ఉంచిన చర్యకన్నా, శిశువు ఉన్న స్థితిని గ్రీకు వర్తమాన కృదంతానికి అనుగుణంగా తెలియజేస్తుంది.
- source_word: ἐν τῇ φάτνῃ
  choice: పశువుల మేత తొట్టిలో
  rationale: φάτνη సూచించే మేత పెట్టే తొట్టిని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన కథన శైలిని, అలాగే మూలంలోని వరుస సమన్వయ భావాన్ని నిలిపాం. ‘శిశువు’ గౌరవప్రదంగానూ సాధారణ పాఠకులకు సులభంగానూ ఉంటుంది.
