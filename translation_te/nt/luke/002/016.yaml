  terminology: “మరియ,” “యోసేపు,” and “శిశువు” are suitable standard Telugu forms. “పశువులకు మేత పెట్టే తొట్టి” accurately identifies φάτνη without adding interpretive detail. The footnote retains the viable shorter lexical alternative.
