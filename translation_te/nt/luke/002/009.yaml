id: LUK.2.9
reference: Luke 2:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀καὶ ἄγγελος κυρίου ἐπέστη αὐτοῖς καὶ δόξα κυρίου περιέλαμψεν αὐτούς, καὶ ἐφοβήθησαν φόβον μέγαν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/009.yaml
  text: And an angel of the Lord stood before them[a], and the glory of the Lord shone around them[b], and they feared a great fear.
translation:
  language: te
  text: అప్పుడు ప్రభువు దూత ఒకడు వారి దగ్గర నిలిచాడు[a]. ప్రభువు మహిమ వారి చుట్టూ ప్రకాశించింది; వారు ఎంతో భయపడ్డారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి దగ్గరకు అకస్మాత్తుగా వచ్చాడు,” లేక “వారి పక్కన నిలిచాడు.” గ్రీకు క్రియ దగ్గర నిలబడడాన్నీ, అకస్మాత్తుగా అక్కడికి రావడాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “వారు గొప్ప భయాన్ని భయపడ్డారు.” ఇది తీవ్రమైన భయాన్ని తెలిపే గ్రీకు నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος κυρίου
  choice: ప్రభువు దూత ఒకడు
  rationale: ఈ సందర్భంలో ἄγγελος మానవ సందేశకుని కంటే దేవదూతను సూచిస్తుంది. గ్రీకులో నిర్దేశక ఉపపదం లేకపోవడం వల్ల ప్రత్యేకంగా ‘ఆ దూత’ అని కాకుండా ‘దూత ఒకడు’ అని అనువదించబడింది.
- source_word: ἐπέστη αὐτοῖς
  choice: వారి దగ్గర నిలిచాడు
  rationale: ἐφίστημι అనే క్రియ దగ్గర నిలబడడం లేదా అకస్మాత్తుగా అక్కడికి రావడం అనే భావాలను కలిగి ఉండగలదు. ప్రధాన పాఠంలో స్పష్టమైన స్థితి భావాన్ని ఉంచి, అకస్మాత్తు ప్రత్యక్షత అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో సూచించాం.
- source_word: δόξα κυρίου
  choice: ప్రభువు మహిమ
  rationale: δόξα ఇక్కడ దేవుని ప్రత్యక్ష మహిమను, దానితో కూడిన ప్రకాశాన్ని సూచిస్తుంది; ‘మహిమ’ దాని ధార్మిక బరువును నిలుపుతుంది.
- source_word: περιέλαμψεν αὐτούς
  choice: వారి చుట్టూ ప్రకాశించింది
  rationale: περιλάμπω వారి చుట్టూ వెలుగు ప్రకాశించడం లేదా వారిని వెలుగుతో ఆవరించడం అనే భావాన్ని ఇస్తుంది. ఈ అనువాదం మూలంలోని దిశాత్మక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: వారు ఎంతో భయపడ్డారు
  rationale: క్రియతో దానికి సమానార్థక నామవాచకాన్ని కలిపిన గ్రీకు నిర్మాణం భయ తీవ్రతను పెంచుతుంది. తెలుగులో ‘ఎంతో భయపడ్డారు’ సహజంగా అదే తీవ్రతను తెలియజేస్తుంది.
theological_decisions:
- issue: κύριος అనే దైవసూచక పదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఈ వాక్యంలో κύριος దేవుణ్ణి సూచిస్తుంది. ‘ప్రభువు’ దైవసూచక అర్థాన్ని, కొత్త నిబంధన వాడుకను సహజంగా నిలుపుతుంది.
translation_notes:
  register: సామాన్య ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉండేలా, అయితే వాక్యంలోని గంభీరతను నిలుపుతూ అనువదించబడింది. ‘దూత ఒకడు’ అనే రూపం మూలంలోని అనిర్దిష్టతను కాపాడుతుంది; చివరి గ్రీకు నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తం చేసి అక్షరార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
