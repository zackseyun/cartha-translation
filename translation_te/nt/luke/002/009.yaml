  source_fidelity: ‘ప్రభువు దూత ఒకడు’ correctly represents the anarthrous ἄγγελος κυρίου without making it definite. ‘వారి దగ్గర నిలిచాడు’ adequately conveys ἐπέστη αὐτοῖς, while the note preserves the possible nuance of sudden arrival. ‘ప్రభువు మహిమ వారి చుట్టూ ప్రకాశించింది’ faithfully expresses δόξα κυρίου and περιέλαμψεν αὐτούς. ‘వారు ఎంతో భయపడ్డారు’ naturally conveys the intensified Greek idiom ἐφοβήθησαν φόβον μέγαν; its literal form is appropriately supplied in the note.
