  terminology: ‘ప్రభువు ధర్మశాస్త్రం’ appropriately renders νόμος κυρίου in a biblical register. ‘ఊరు’ is a suitable contextual rendering of πόλις for Nazareth; the footnote transparently notes the Greek term.
