id: LUK.2.39
reference: Luke 2:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὡς ἐτέλεσαν ⸀πάντα τὰ κατὰ τὸν νόμον κυρίου, ⸀ἐπέστρεψαν εἰς τὴν Γαλιλαίαν ⸀εἰς πόλιν ἑαυτῶν Ναζαρέθ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/039.yaml
  text: And when they had completed everything according to the law of the Lord[a], they returned to Galilee, to their own town[b], Nazareth.
translation:
  language: te
  text: ప్రభువు ధర్మశాస్త్రం ప్రకారం అన్నిటినీ పూర్తి చేసినప్పుడు[a], వారు గలిలయకు, తమ సొంత ఊరైన[b] నజరేతుకు తిరిగి వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువు ధర్మశాస్త్రం ప్రకారం చేయవలసినవన్నీ పూర్తి చేసినప్పుడు.”
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో “పట్టణం.” నజరేతు చిన్న నివాసస్థలం కావడంతో ఇక్కడ “ఊరు” అని అనువదించబడింది.
    reason: cultural_note
lexical_decisions:
- source_word: ὡς
  choice: చేసినప్పుడు
  rationale: ఆరిస్ట్ క్రియతో కూడిన ఈ కాలసూచక నిర్మాణంలో ప్రధాన చర్య ఎప్పుడు జరిగిందో తెలియజేస్తుంది. ‘చేసినప్పుడు’ సహజంగా సంఘటనల క్రమాన్ని చూపుతుంది; వెంటనే జరిగిందనే భావాన్ని అదనంగా చేర్చదు.
- source_word: ἐτέλεσαν
  choice: పూర్తి చేశారు
  rationale: నిర్దేశించబడిన కార్యాలన్నిటినీ ముగింపుకు తీసుకురావడాన్ని సూచిస్తుంది. ‘నెరవేర్చారు’ అనే పదం ప్రవచన నెరవేర్పు అనే అదనపు భావాన్ని కలిగించవచ్చు కాబట్టి ‘పూర్తి చేశారు’ ఎంచుకోబడింది.
- source_word: πάντα τὰ κατὰ τὸν νόμον κυρίου
  choice: ప్రభువు ధర్మశాస్త్రం ప్రకారం అన్నిటినీ
  rationale: ప్రభువు ధర్మశాస్త్రానికి అనుగుణమైన కార్యాల సంపూర్ణతను సూచిస్తూ, గ్రీకు వాక్యంలోని భావాన్ని విస్తరించకుండా నిలుపుతుంది.
- source_word: νόμον κυρίου
  choice: ప్రభువు ధర్మశాస్త్రం
  rationale: తెలుగులో యూదుల లిఖిత దైవిక ధర్మనియమాన్ని సహజంగా, గౌరవప్రదంగా సూచిస్తుంది; సంబంధార్థక గ్రీకు నిర్మాణాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: ఇక్కడ దేవుణ్ణి సూచించే κύριοςకు సాధారణమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం.
- source_word: ἐπέστρεψαν
  choice: తిరిగి వెళ్లారు
  rationale: ప్రయాణ సందర్భంలో మునుపటి ప్రదేశానికి వెళ్లడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: గలిలయలోని
  rationale: తుది గమ్యమైన నజరేతు గలిలయ ప్రాంతంలో ఉందని తెలుగులో సహజంగా అనుసంధానిస్తుంది; గలిలయకు తిరిగివెళ్లారనే గ్రీకు భావం నిలుస్తుంది.
- source_word: εἰς πόλιν ἑαυτῶν
  choice: తమ సొంత ఊరైన
  rationale: ἑαυτῶνలోని స్వకీయ ఉద్ఘాటనను ‘తమ సొంత’ నిలుపుతుంది. నజరేతు చిన్న నివాసస్థలం కావడంతో πόλιςకు సందర్భానుగుణంగా ‘ఊరు’ సహజమైనది.
- source_word: Ναζαρέθ
  choice: నజరేతు
  rationale: ఈ స్థలనామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
theological_decisions:
- issue: ‘ప్రభువు ధర్మశాస్త్రం’లో ‘ప్రభువు’ ఎవరిని సూచిస్తుంది?
  choice: లేఖనాల్లో ఇచ్చిన దైవిక ధర్మశాస్త్రానికి మూలమైన దేవుణ్ణి సూచిస్తుంది.
  alternative: ఈ సందర్భంలో ప్రాముఖ్యమైన వేరొక దైవశాస్త్ర సంబంధిత పఠనం లేదు.
  rationale: ఇది యూదుల లేఖన సంప్రదాయంలో సాధారణ ప్రయోగం. కుటుంబం ధర్మశాస్త్రానుసారం వ్యవహరించిందనే వాక్య ఉద్దేశాన్ని అదనపు సిద్ధాంత వ్యాఖ్యానం లేకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ధర్మశాస్త్రం’ బైబిలు సందర్భాన్ని స్పష్టంగా ఉంచుతుంది; వాక్య నిర్మాణం తెలుగు పాఠకులకు సులభంగా ఉండేందుకు గలిలయను నజరేతు ఉన్న ప్రాంతంగా అనుసంధానించింది.
