id: LUK.2.19
reference: Luke 2:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ δὲ ⸀Μαρία πάντα συνετήρει τὰ ῥήματα ταῦτα συμβάλλουσα ἐν τῇ καρδίᾳ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/019.yaml
  text: But Mary was treasuring up all these words[b][a], pondering them in her heart.
translation:
  language: te
  text: అయితే మరియ ఈ మాటలన్నిటినీ పదిలపరచుకుంటూ[a], తన హృదయంలో వాటిని ఒకదానితో ఒకటి కలిపి ఆలోచిస్తూ[b] ఉండింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ విషయాలన్నిటినీ జాగ్రత్తగా కాపాడుకుంటూ.’
    reason: lexical_alternative
  - marker: b
    text: ‘కలిపి ఆలోచిస్తూ’ అనే మాటకు ‘వాటిని పరస్పరం పోల్చి పరిశీలిస్తూ’ అనే భావం కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వచనంలో ఇతరులు చూపిన బాహ్య స్పందనకు, మరియ చూపిన అంతరంగ స్పందనకు మధ్య ఉన్న స్వల్ప వ్యత్యాసాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: Μαρία
  choice: మరియ
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: πάντα
  choice: అన్నిటినీ
  rationale: మరియ విన్న మాటల సమాహారమంతటినీ సూచించే సమగ్ర భావాన్ని తెలుపుతుంది.
- source_word: τὰ ῥήματα ταῦτα
  choice: ఈ మాటలన్నిటినీ
  rationale: సందర్భంలో కాపరులు తెలియజేసిన సందేశం ప్రధానంగా ఉన్నందున ῥήματα అనే పదంలోని ‘మాటలు/చెప్పబడిన విషయాలు’ అనే భావాన్ని నేరుగా ఉంచుతుంది.
- source_word: συνετήρει
  choice: పదిలపరచుకుంటూ ... ఉండింది
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న చర్యను, అలాగే జాగ్రత్తగా కాపాడి ఉంచే భావాన్ని వ్యక్తం చేస్తుంది; కేవలం జ్ఞాపకం పెట్టుకోవడం లేదా దాచిపెట్టడం అనే అర్థాలకు పరిమితం చేయదు.
- source_word: συμβάλλουσα
  choice: ఒకదానితో ఒకటి కలిపి ఆలోచిస్తూ
  rationale: విషయాలను మనసులో కలిపి చూడడం, పోల్చడం, పరిశీలించడం అనే గ్రీకు క్రియార్థాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: తన హృదయంలో
  rationale: ఆలోచన, ధ్యానం, అంతరంగ స్పందనలను సూచించే మూలపాఠంలోని హృదయ రూపకాన్ని యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: మరియ స్పందన స్వభావం
  choice: ఆమె విన్న మాటలను జాగ్రత్తగా పదిలపరచుకుంటూ, వాటిని అంతరంగంలో కలిపి ఆలోచిస్తూ ఉండింది.
  alternative: ఆమె జరిగినవాటిని కేవలం జ్ఞాపకం పెట్టుకుంది; లేదా అప్పటికే వాటిని పూర్తిగా అర్థం చేసుకుంది.
  rationale: మూలపాఠం జాగ్రత్తగా భద్రపరచడం మరియు లోతుగా పరిశీలించడం రెండింటినీ చెబుతుంది; అయితే ఆమెకు అప్పుడే సంపూర్ణ అవగాహన కలిగిందని చెప్పదు. అందువల్ల ఆ ఉద్దేశపూర్వక అస్పష్టతను అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘హృదయంలో’ అనే బైబిలు రూపకం నిలుపబడింది; ‘పదిలపరచుకుంటూ’ మరియు ‘కలిపి ఆలోచిస్తూ’ అనే పదబంధాలు జ్ఞాపకం, పరిశీలన, ఇంకా పూర్తిగా తేలని అవగాహన మధ్య ఉన్న మూలపాఠపు ఉద్వేగాన్ని కాపాడుతాయి.
