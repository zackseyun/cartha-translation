revisions:
- from: అన్యజనులకు[a] ప్రత్యక్షత కలిగించే వెలుగుగాను, నీ ప్రజలైన ఇశ్రాయేలుకు మహిమగాను.
  to: అన్యజనులకు వెల్లడికై వెలుగుగాను, నీ ప్రజలైన ఇశ్రాయేలుకు మహిమగాను.
  rationale: The revision changes only the rendering of ἀποκάλυψις and its relation to εἰς. “అన్యజనులకు వెల్లడికై” retains the concise, unspecified revelation language of the Greek and expresses its purpose-oriented syntax naturally in Telugu. The parallel poetic register, Israel’s identification as God’s people, and the lexical-alternative footnote are retained.
