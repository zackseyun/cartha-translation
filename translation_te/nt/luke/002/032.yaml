  edition: SBLGNT
  text: φῶς εἰς ἀποκάλυψιν ἐθνῶν καὶ δόξαν λαοῦ σου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/032.yaml
  text: a light for revelation to the Gentiles[a], and glory to your people Israel.
translation:
  language: te
  text: అన్యజనులకు వెల్లడికై వెలుగుగాను, నీ ప్రజలైన ఇశ్రాయేలుకు మహిమగాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φῶς
  choice: వెలుగు
  rationale: తెలుగులో నిర్దిష్టతను సూచించే ఉపపదం అవసరం లేదు; శిశువును రూపకాలంకారంగా వర్ణించే ఈ కవితాత్మక వాక్యంలో ‘వెలుగు’ సహజంగా, మూలార్థానికి దగ్గరగా ఉంది.
- source_word: εἰς
  choice: కలిగించే … గాను
  rationale: ఇక్కడ εἰς ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది. ‘కలిగించే’ అనే నిర్మాణం ἀποκάλυψιν‌తో దాని సంబంధాన్ని, ‘గాను’ సమాంతర వాక్య నిర్మాణాన్ని సహజమైన తెలుగులో తెలియజేస్తాయి.
- source_word: ἀποκάλυψιν
  choice: ప్రత్యక్షత
  rationale: దాచబడినది బయలుపడడం లేదా తెలియబడడం అనే భావాన్ని ‘ప్రత్యక్షత’ సంక్షిప్తంగా నిలుపుతుంది; అసలు వాక్యంలో బయలుపరచబడే నిర్దిష్ట విషయం చెప్పబడనందున దానిని అనువాదంలో చేర్చలేదు.
- source_word: ἐθνῶν
  choice: అన్యజనులకు
  rationale: తరువాత వచ్చే ‘నీ ప్రజలైన ఇశ్రాయేలు’తో ఉన్న సందర్భోచిత వ్యత్యాసాన్ని ఇది స్పష్టంగా తెలియజేస్తుంది. మూలపదానికి ‘జనాలు/దేశాలు’ అనే విస్తృత అర్థం కూడా ఉండడం వల్ల ఆ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: δόξαν
  choice: మహిమ
  rationale: గౌరవం, వైభవం అనే భావాలతో పాటు బైబిలు సందర్భంలోని గంభీరతను కూడా ‘మహిమ’ సహజంగా నిలుపుతుంది.
- source_word: λαοῦ σου Ἰσραήλ
  choice: నీ ప్రజలైన ఇశ్రాయేలు
  rationale: ఇశ్రాయేలే ‘నీ ప్రజలు’ అని గుర్తించే అన్వయ సంబంధాన్ని ‘ప్రజలైన’ స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ
  choice: మరియు అనే భావాన్ని సమాంతర ‘గాను … గాను’ నిర్మాణం ద్వారా
  rationale: తెలుగు కవితాత్మక సమాంతర నిర్మాణంలో ‘గాను … గాను’ రెండు భాగాలను సహజంగా కలుపుతుంది; ప్రత్యేకంగా ‘మరియు’ చేర్చకపోయినా సమన్వయ భావం నిలుస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలుతో పోల్చినప్పుడు ἐθνῶν అర్థం
  choice: అన్యజనులు
  alternative: జనాలు / దేశాలు
  rationale: ఈ వాక్యంలో ἐθνῶνకు ఎదురుగా ‘నీ ప్రజలైన ఇశ్రాయేలు’ రావడం వల్ల యూదేతర ప్రజలు అనే సందర్భార్థం ప్రధానంగా కనిపిస్తుంది. అయితే మూల గ్రీకు పదంలోని విస్తృత అర్థాన్ని పాదటిప్పణి ద్వారా నిలిపాం.
- issue: ἀποκάλυψιν‌లో బయలుపరచబడేది ఏమిటి
  choice: ‘ప్రత్యక్షత’ అని మాత్రమే ఉంచి, దాని విషయాన్ని నిర్దిష్టం చేయలేదు
  alternative: సత్యాన్ని బయలుపరచే / దేవుణ్ణి తెలియజేసే
  rationale: గ్రీకు వాక్యం బయలుపరచబడే విషయాన్ని స్పష్టంగా పేర్కొనదు. అందువల్ల ఒక నిర్దిష్ట వేదాంత వివరణను మూలపాఠ్యంలో చేర్చకుండా అసలు సంక్షిప్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘వెలుగుగాను … మహిమగాను’ అనే సమాంతర నిర్మాణం మూలంలోని కవితాత్మక సమతౌల్యాన్ని నిలుపుతుంది.
