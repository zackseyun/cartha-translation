  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ποιμένες ἦσαν ἐν τῇ χώρᾳ τῇ αὐτῇ ἀγραυλοῦντες καὶ φυλάσσοντες φυλακὰς τῆς νυκτὸς ἐπὶ τὴν ποίμνην αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/008.yaml
  text: And there were shepherds in that same region[b][a], staying out in the fields and keeping watch over their flock by night.
translation:
  language: te
  text: అదే ప్రాంతంలో కొందరు గొర్రెల కాపరులు పొలాల్లో ఆరుబయట రాత్రి గడుపుతూ[a], తమ మందపై రాత్రి కావలి కాస్తున్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆరుబయటే ఉంటూ.” గ్రీకు క్రియ కాపరులు పొలాల్లో ఆరుబయట రాత్రి గడిపారని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “తమ మందపై రాత్రి కావలులు కాస్తూ”; ఇది వారు వంతులవారీగా రాత్రి కావలి కాసినట్లు సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιμένες
  choice: గొర్రెల కాపరులు
  rationale: ఈ నామవాచకం ప్రత్యేకంగా గొర్రెలను మేపి కాపాడేవారిని సూచిస్తుంది; సాధారణమైన ‘పశువుల కాపరులు’ కంటే ఇది మరింత నిర్దిష్టం.
- source_word: ἐν τῇ χώρᾳ τῇ αὐτῇ
  choice: అదే ప్రాంతంలో
  rationale: χώρα ఇక్కడ ముందుగా ప్రస్తావించిన పరిసర ప్రాంతాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ప్రాంతం’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: ἀγραυλοῦντες
  choice: పొలాల్లోనే ఉంటూ
  rationale: ఈ క్రియ రాత్రిని ఆరుబయట, ముఖ్యంగా పొలాల్లో గడపడాన్ని సూచిస్తుంది. ‘పొలాల్లోనే ఉంటూ’ ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: φυλάσσοντες φυλακὰς τῆς νυκτὸς
  choice: రాత్రి కావలి వంతులు కాస్తున్నారు
  rationale: మూలంలోని సమానమూల పదాల నిర్మాణం రాత్రి కావలిని వంతులవారీగా నిర్వహించడాన్ని సూచించవచ్చు. ‘కావలి వంతులు’ ఆ విశేషాన్ని నిలుపుతుంది.
- source_word: ἐπὶ τὴν ποίμνην αὐτῶν
  choice: తమ మందకు
  rationale: ποίμνη గొర్రెల సమూహాన్ని సూచిస్తుంది. సందర్భంలో కాపరులు ఇప్పటికే గొర్రెల కాపరులని చెప్పబడినందున ‘తమ మంద’ సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: Καὶ ... ἦσαν
  choice: అదే ప్రాంతంలో కొందరు ... ఉన్నారు/ఉంటూ
  rationale: గ్రీకు వాక్యం కథనాన్ని కొనసాగిస్తూ కొత్త దృశ్యాన్ని పరిచయం చేస్తుంది. తెలుగులో ప్రత్యేకంగా ‘మరియు అక్కడ ఉన్నారు’ అనడం అసహజం కాబట్టి సహజ వాక్య నిర్మాణంలో కొనసాగింపు భావం వ్యక్తమవుతుంది.
