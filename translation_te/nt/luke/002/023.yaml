id: LUK.2.23
reference: Luke 2:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ἐν νόμῳ κυρίου ὅτι Πᾶν ἄρσεν διανοῖγον μήτραν ἅγιον τῷ κυρίῳ κληθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/023.yaml
  text: as it is written in the Law of the Lord[a], that every male opening the womb shall be called holy to the Lord[c][b],
translation:
  language: te
  text: 'ప్రభువు ధర్మశాస్త్రంలో ఇలా వ్రాయబడియున్న ప్రకారం: “తల్లి గర్భం నుండి తొలిగా పుట్టే ప్రతి మగబిడ్డ ప్రభువుకు పవిత్రుడు అని పిలువబడతాడు,”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, మొదట పుట్టిన మగబిడ్డ ప్రభువుకు పవిత్రమైనవాడిగా, ఆయనకు ప్రతిష్ఠించబడినవాడిగా పరిగణించబడతాడు; నిర్గమకాండం 13:2, 12 చూడండి.
    reason: నుడికార వివరణ మరియు సంబంధిత వాక్యసూచన
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: ఇలా రాసి ఉన్న ప్రకారం
  rationale: లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే గ్రీకు ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తూ, రాసి ఉన్న దానికి కొనసాగుతున్న ప్రామాణికత ఉందనే భావాన్ని నిలుపుతుంది.
- source_word: ἐν νόμῳ κυρίου
  choice: ప్రభువు ధర్మశాస్త్రంలో
  rationale: νόμος ఇక్కడ మోషే ధర్మశాస్త్రాన్ని సూచిస్తుంది; κύριος ను గ్రీకు మూలానికి అనుగుణంగా ‘ప్రభువు’గా అనువదించాం.
- source_word: Πᾶν ἄρσεν
  choice: ప్రతి మగవాడు
  rationale: గ్రీకులోని స్పష్టమైన పుంలింగ, సమగ్ర ప్రయోగాన్ని నేరుగా నిలుపుతుంది; సందర్భం నవజాత మగశిశువును సూచిస్తుందనే విషయాన్ని పాదటీపు వివరిస్తుంది.
- source_word: διανοῖγον μήτραν
  choice: గర్భాన్ని తెరిచే
  rationale: మొదట పుట్టిన మగసంతానాన్ని సూచించే లేఖనీయ నుడికారాన్ని వ్యాఖ్యానంతో భర్తీ చేయకుండా సాధ్యమైనంత పారదర్శకంగా ఉంచుతుంది.
- source_word: ἅγιον τῷ κυρίῳ
  choice: ప్రభువుకు పవిత్రుడు
  rationale: ἅγιον లోని పవిత్రత భావాన్ని ‘ప్రతిష్ఠితుడు’ వంటి వ్యాఖ్యానాత్మక పదంతో భర్తీ చేయకుండా నిలుపుతుంది; దత్తి విభక్తిలోని అంకిత సంబంధాన్ని ‘ప్రభువుకు’ తెలియజేస్తుంది.
- source_word: κληθήσεται
  choice: అని పిలువబడాలి
  rationale: భవిష్యత్ కర్మణి రూపంలోని నియమాత్మక భావాన్ని ధర్మశాస్త్ర ఉల్లేఖనానికి తగిన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు ధర్మశాస్త్ర ఉల్లేఖనంలో κύριος అనువాదం
  choice: ప్రభువు
  alternative: యెహోవా
  rationale: ప్రస్తుత మూలపాఠం గ్రీకు κύριος ను కలిగి ఉంది. అంతర్లీన హెబ్రీ మూలంలో దైవనామం ఉన్నప్పటికీ, గ్రీకు సాక్ష్యాన్ని ముందుగా అనుసరించి ‘ప్రభువు’గా ఇచ్చాం.
- issue: ἅγιον లోని పవిత్రత భాష
  choice: పవిత్రుడు
  alternative: ప్రతిష్ఠితుడు / ప్రత్యేకించబడినవాడు
  rationale: మూలపాఠం స్పష్టంగా ‘పవిత్రమైన’ అనే పదాన్నే వాడుతుంది. అంకితం లేదా ప్రత్యేకింపు దాని సందర్భార్థమైనప్పటికీ, ప్రధాన పాఠంలో మూలంలోని పవిత్రత పదాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ధర్మశాస్త్ర ఉల్లేఖనానికి తగిన గౌరవప్రదమైన శైలి. ‘గర్భాన్ని తెరిచే’ అనే మూల నుడికారాన్ని ప్రధాన పాఠంలో నిలిపి, దాని అర్థాన్ని పాదటీపులో స్పష్టం చేశాం. వచనం తరువాతి వాక్యంతో వ్యాకరణపరంగా కొనసాగుతుంది కాబట్టి చివర కామా ఉంచబడింది.
