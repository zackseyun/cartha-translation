id: LUK.2.38
reference: Luke 2:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀καὶ αὐτῇ τῇ ὥρᾳ ἐπιστᾶσα ἀνθωμολογεῖτο τῷ ⸀θεῷ καὶ ἐλάλει περὶ αὐτοῦ πᾶσιν τοῖς προσδεχομένοις ⸀λύτρωσιν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/038.yaml
  text: And at that very hour[a], coming up[c][b], she began giving thanks to God and speaking about him to all who were waiting for the redemption of Jerusalem.
translation:
  language: te
  text: అదే సమయంలో[a] ఆమె అక్కడికి వచ్చి, దేవునికి కృతజ్ఞతలు తెలుపుతూ ఉండింది[b]; యెరూషలేము విమోచనం కోసం ఎదురుచూస్తున్న వారందరికీ ఆయన గురించి మాట్లాడుతూ ఉండింది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆ క్షణంలోనే.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దేవుణ్ణి స్తుతిస్తూ ఉండింది’ లేదా ‘దేవునికి కృతజ్ఞతలు తెలియజేస్తూ ఉండింది.’
    reason: lexical_alternative
  - marker: c
    text: ‘ఆయన’ అనేది సందర్భానుసారంగా బాలుడైన యేసును సూచించడం అత్యంత సహజం; అయితే గ్రీకులో దానికి అతి దగ్గరగా స్పష్టంగా పేర్కొన్నది ‘దేవుడు.’
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: అదే సమయంలో
  rationale: కాలాన్ని సూచించే ఈ దత్తివిభక్తి పదబంధంలో αὐτῇ ఉన్న నొక్కిచెప్పే భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘అదే సమయంలో’ తెలియజేస్తుంది.
- source_word: ἐπιστᾶσα
  choice: ఆమె అక్కడికి వచ్చి
  rationale: ఈ సందర్భంలో ఈ భూతకాల కృదంతం అన్న ఆ దృశ్యానికి వచ్చి చేరడాన్ని సూచిస్తుంది; ఎలా వచ్చిందో అనవసరంగా నిర్దిష్టం చేయకుండా భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἀνθωμολογεῖτο
  choice: కృతజ్ఞతలు చెబుతూ
  rationale: ఈ అసంపూర్ణ భూతకాల క్రియ దేవునికి కృతజ్ఞత లేదా స్తుతి వ్యక్తం చేసే కొనసాగుతున్న చర్యను సూచించగలదు. దత్తివిభక్తిలోని τῷ θεῷతో ‘కృతజ్ఞతలు చెబుతూ’ సహజంగా సరిపోతుంది.
- source_word: τῷ θεῷ
  choice: దేవునికి
  rationale: గ్రీకులోని దత్తివిభక్తిని సహజమైన తెలుగులో ‘దేవునికి’గా అందించింది.
- source_word: ἐλάλει περὶ αὐτοῦ
  choice: ఆయన గురించి మాట్లాడుతూ ఉండింది
  rationale: అసంపూర్ణ భూతకాలం కొనసాగుతున్న మాటలను సూచిస్తుంది. αὐτοῦను వివరణాత్మక నామంతో భర్తీ చేయకుండా సర్వనామంగానే ఉంచడం ద్వారా మూలంలోని సూచనాస్పష్టతను కాపాడింది.
- source_word: πᾶσιν τοῖς προσδεχομένοις
  choice: ఎదురుచూస్తున్న వారందరితో
  rationale: ప్రత్యాశతో వేచియుండే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ἐλάλειతో సంభాషణ గ్రహీతలను ‘వారందరితో’ సహజంగా సూచిస్తుంది.
- source_word: λύτρωσιν
  choice: విమోచనం
  rationale: విడుదలతో పాటు రక్షణ సంబంధమైన గంభీరతను కూడా నిలుపుకునే పదం; భావాన్ని కేవలం రాజకీయ లేదా భౌతిక విడుదలకు పరిమితం చేయదు.
- source_word: Ἰερουσαλήμ
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన స్థలనామ రూపం.
theological_decisions:
- issue: ἐλάλει περὶ αὐτοῦలో αὐτοῦ ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘ఆయన’ అనే సర్వనామాన్ని నిలిపి ఉంచి, సందర్భానుసారంగా బాలుడైన యేసును సూచించే అవకాశాన్ని తెరిచి ఉంచింది.
  alternative: గ్రీకు వాక్యంలో దగ్గరగా ఉన్న స్పష్ట నామవాచకం ‘దేవుడు’ కాబట్టి, ‘ఆయన’ దేవుణ్ణి సూచిస్తుందని కూడా అర్థం చేసుకోవచ్చు.
  rationale: కథన సందర్భం బాలుడైన యేసుపై కేంద్రీకృతమైనప్పటికీ, గ్రీకు వ్యాకరణం సూచనను పూర్తిగా తేల్చదు. కాబట్టి ప్రధాన పాఠ్యంలో నామాన్ని చేర్చి సందిగ్ధతను తొలగించలేదు; పాదసూచికలో రెండు అవకాశాలను తెలిపింది.
- issue: ‘యెరూషలేము విమోచనం’ యొక్క పరిధి
  choice: రాజకీయ, ఆధ్యాత్మిక లేదా అంత్యకాల సంబంధమైన ఒకే వివరణకు పరిమితం చేయకుండా ‘యెరూషలేము విమోచనం’గా ఉంచింది.
  alternative: ‘యెరూషలేము విడుదల’ లేదా విస్తరించి ‘యెరూషలేము ప్రజల విమోచనం’ అని అనువదించవచ్చు.
  rationale: ఈ పదబంధం యెరూషలేముతో ముడిపడిన దేవుని రక్షణకార్యంపై ప్రజల ఆశను విస్తృతంగా సూచించగలదు. మూలంలోని సామూహిక, రక్షణాత్మక భావవ్యాప్తిని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించింది. రెండు అసంపూర్ణ భూతకాల క్రియల కొనసాగుతున్న స్వభావాన్ని ‘చెబుతూ,’ ‘మాట్లాడుతూ ఉండింది’తో ప్రతిబింబించింది. మూలంలోని సర్వనామ సందిగ్ధతను ప్రధాన పాఠ్యంలో పరిష్కరించకుండా ఉంచింది.
