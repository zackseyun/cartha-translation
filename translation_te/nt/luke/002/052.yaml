source:
  edition: SBLGNT
  text: Καὶ Ἰησοῦς προέκοπτεν ⸂σοφίᾳ καὶ ἡλικίᾳ⸃ καὶ χάριτι παρὰ θεῷ καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/052.yaml
  text: And Jesus kept increasing in wisdom and stature[b][a], and in favor with God and men.
translation:
  language: te
  text: యేసు జ్ఞానంలోను, శారీరక ఎదుగుదలలోను[a], దేవుని మరియు మనుషుల ఆదరణలోను[b] ఎదుగుతూ వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శారీరక ఎదుగుదల’ అని అనువదించిన గ్రీకు పదానికి ‘వయస్సు’ లేదా ‘పరిపక్వత’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ప్రజలు’; గ్రీకు పదం ఇక్కడ మానవులందరినీ సాధారణంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτεν
  choice: వృద్ధి చెందుతూ వచ్చాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే, కాలక్రమంలో కొనసాగిన నిజమైన అభివృద్ధిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: σοφίᾳ
  choice: జ్ఞానంలో
  rationale: అవగాహన, వివేచనతో కూడిన విస్తృత భావంలోని σοφίαకు సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: ἡλικίᾳ
  choice: శరీర ఎదుగుదలలో
  rationale: ἡλικίαకు వయస్సు లేదా శరీర ఆకృతి/ఎత్తు అనే అర్థాలు ఉండవచ్చు. సందర్భంలో కనిపించే మానవ శారీరక ఎదుగుదలను ఈ పదబంధం స్పష్టంగా తెలియజేస్తుంది; మూలంలోని అర్థసందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: χάριτι
  choice: మరింత ప్రీతిపాత్రుడవుతూ
  rationale: ఇక్కడ χάρις రక్షణసంబంధమైన సిద్ధాంతార్థంలోని ‘కృప’కన్నా దేవుని మరియు మనుషుల ఆదరణ లేదా అనుకూలతను సూచిస్తుంది. తెలుగులో వ్యక్తులతో సంబంధాన్ని సహజంగా తెలిపే విధంగా క్రియాత్మక పదబంధాన్ని వాడాం.
- source_word: παρὰ θεῷ
  choice: దేవునికి
  rationale: παρά + చతుర్థీ విభక్తి ఇక్కడ దేవుని దృష్టిలో లేదా దేవునితో ఉన్న సంబంధంలో అనే భావాన్ని ఇస్తుంది; ‘దేవునికి ప్రీతిపాత్రుడు’ ఆ భావానికి సహజమైన తెలుగు రూపం.
- source_word: ἀνθρώποις
  choice: మనుషులకు
  rationale: ἄνθρωποι ఇక్కడ మానవులను సాధారణంగా సూచిస్తుంది. ‘మనుషులు’ లింగపరంగా పరిమితం చేయకుండా మూలపదానికి దగ్గరగా ఉంటుంది.
theological_decisions:
- issue: యేసు నిజమైన మానవ అభివృద్ధి
  choice: యేసు జ్ఞానంలోనూ శారీరక ఎదుగుదలలోనూ నిజంగా వృద్ధి చెందాడని వాక్యం నేరుగా చెబుతుంది.
  alternative: క్రీస్తు గురించి తలెత్తవచ్చని భావించే సిద్ధాంతపరమైన ఉద్రిక్తతను తగ్గించడానికి ఆయన అభివృద్ధిని అస్పష్టంగా అనువదించడం.
  rationale: προέκοπτεν యేసు కొనసాగుతూ అభివృద్ధి చెందాడని స్పష్టంగా చెబుతుంది. ఆయన నిజమైన మానవత్వం గురించిన ఈ వాక్యాన్ని అనువాదంలో తగ్గించకుండా, మూలంలోని theological tension ను యథాతథంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, అదే సమయంలో గౌరవప్రదమైన శైలిని పాటించాం. ‘వృద్ధి చెందుతూ వచ్చాడు’ కొనసాగిన అభివృద్ధిని తెలియజేస్తుంది; ‘ప్రీతిపాత్రుడవుతూ’ అనేది దేవుని మరియు మనుషుల ఆదరణ అనే సంబంధార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
