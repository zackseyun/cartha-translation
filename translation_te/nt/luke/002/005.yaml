id: LUK.2.5
reference: Luke 2:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπογράψασθαι σὺν Μαριὰμ τῇ ⸂ἐμνηστευμένῃ αὐτῷ⸃, οὔσῃ ἐγκύῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/005.yaml
  text: to register with Mary[b][a], who was betrothed to him and was pregnant.
translation:
  language: te
  text: నమోదు చేసుకోవడానికి, తనకు నిశ్చితార్థమైన మరియతో[a] కలిసి వెళ్లాడు; ఆమె గర్భవతిగా[b] ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తనతో పెళ్లి నిశ్చయమైన మరియతో.” ఇక్కడి గ్రీకు పదం ఆధునిక నిశ్చితార్థం కంటే బలమైన చట్టపరమైన, సామాజిక బంధాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆమె గర్భం ధరించి ఉంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπογράψασθαι
  choice: నమోదు చేసుకోవడానికి
  rationale: జనగణన సందర్భంలో పరిపాలనా నమోదును సూచిస్తుంది. మధ్యమ రూపాన్ని సహజమైన ఆధునిక తెలుగులో ఉద్దేశార్థకంగా వ్యక్తం చేస్తుంది.
- source_word: σὺν
  choice: కలిసి
  rationale: తోడుగా వెళ్లడమనే సహచర్య భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: Μαριὰμ
  choice: మరియ
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ἐμνηστευμένῃ αὐτῷ
  choice: తనకు నిశ్చితార్థమైన
  rationale: ఆధునిక నిశ్చితార్థం కంటే బలమైన నాటి చట్టపరమైన, సామాజిక బంధాన్ని ప్రధాన పాఠ్యంలో సహజంగా తెలియజేస్తూ, దాని విశిష్టతను పాదటిప్పణిలో వివరిస్తుంది.
- source_word: οὔσῃ ἐγκύῳ
  choice: ఆమె గర్భవతిగా ఉంది
  rationale: ఆ సమయంలో మరియ స్థితిని స్పష్టమైన, సమకాలీన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యోసేపుతో మరియ వివాహ సంబంధ స్థితి
  choice: తనకు నిశ్చితార్థమైన
  alternative: అతని భార్య; అతనితో పెళ్లి నిశ్చయమైన
  rationale: గ్రీకు పదం పూర్తయిన వివాహాన్ని కాక, అధికారికంగా ఏర్పడిన వివాహ నిశ్చయ బంధాన్ని సూచిస్తుంది. ‘భార్య’ అనడం మూలపాఠం చెప్పినదానికంటే ఎక్కువను చేర్చుతుంది; సాధారణ ఆధునిక నిశ్చితార్థంతో పూర్తిగా సమానమని భావించకుండా పాదటిప్పణి చారిత్రక బలాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే వాక్యనిర్మాణం. ఇది ముందరి వచనం నుంచి కొనసాగుతున్న భాగవాక్యం కావడంతో, తెలుగులో అర్థసంపూర్ణత కోసం ‘వెళ్లాడు’ను సందర్భానుసారంగా పునరుద్ధరించాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
