  terminology: “మరియ” follows established Telugu biblical name usage. “నిశ్చితార్థమైన” is a workable contemporary rendering of formal betrothal, while footnote a responsibly explains that the Greek relationship was stronger than a modern engagement. “గర్భవతిగా” is direct and idiomatic.
