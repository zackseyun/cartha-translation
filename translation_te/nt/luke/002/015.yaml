id: LUK.2.15
reference: Luke 2:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὡς ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν οἱ ἄγγελοι, ⸀οἱ ποιμένες ⸀ἐλάλουν πρὸς ἀλλήλους· Διέλθωμεν δὴ ἕως Βηθλέεμ καὶ ἴδωμεν τὸ ῥῆμα τοῦτο τὸ γεγονὸς ὃ ὁ κύριος ἐγνώρισεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/015.yaml
  text: And it happened that when the angels had gone away from them into heaven[a], the shepherds said to one another, “Let us go now to Bethlehem and see this thing that has happened[b], which the Lord has made known to us.”
translation:
  language: te
  text: 'దూతలు వారిని విడిచి పరలోకానికి వెళ్లిపోయినప్పుడు, కాపరులు ఒకరితో ఒకరు ఇలా చెప్పుకున్నారు: “మనం ఇప్పుడే బెత్లెహేముకు వెళ్లి, ప్రభువు మనకు తెలియజేసిన జరిగిన ఈ సంగతిని[a] చూద్దాం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జరిగిన ఈ విషయం.” గ్రీకు ῥῆμα అనే పదానికి “మాట,” “విషయం,” లేదా “సంగతి” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ὡς
  choice: వెళ్లిపోయినప్పుడు
  rationale: లూకా వాడే కథనారంభ సూత్రాన్ని తెలుగులో విడిగా ‘అది జరిగింది’ అని అనువదిస్తే అసహజంగా ఉంటుంది; కాలసంబంధాన్ని సహజమైన ఉపవాక్యంతో వ్యక్తం చేశాం.
- source_word: ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν
  choice: వారిని విడిచి పరలోకానికి వెళ్లిపోయినప్పుడు
  rationale: ἀπό యొక్క విడిపోవడాన్ని ‘విడిచి’, పూర్తయిన ప్రయాణాన్ని ‘వెళ్లిపోయినప్పుడు’ తెలియజేస్తాయి; సందర్భంలో οὐρανός దైవిక లోకాన్ని సూచిస్తున్నందున ‘పరలోకం’ ఎంచుకున్నాం.
- source_word: οἱ ἄγγελοι
  choice: దూతలు
  rationale: సందర్భంలో దేవుని సందేశవాహకులైన angels‌ను సూచించే సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: οἱ ποιμένες ἐλάλουν πρὸς ἀλλήλους
  choice: కాపరులు ఒకరితో ఒకరు ఇలా చెప్పుకున్నారు
  rationale: అసంపూర్ణ భూతకాల రూపాన్ని అతిగా దైర్ఘ్యార్థంతో చూపకుండా, పరస్పర సంభాషణను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Διέλθωμεν δὴ ἕως Βηθλέεμ
  choice: మనం ఇప్పుడే బేత్లెహేముకు వెళ్లి
  rationale: హితబోధక బహువచనాన్ని ‘మనం ... వెళ్లి’గా, δὴ యొక్క తక్షణత్వాన్ని ‘ఇప్పుడే’గా వ్యక్తం చేశాం. ἕως ఇక్కడ గమ్యస్థానార్థంలో సహజమైన తెలుగు ‘బేత్లెహేముకు’తో సరిపోతుంది.
- source_word: ἴδωμεν
  choice: చూద్దాం
  rationale: ముందున్న హితబోధక క్రియతో సమన్వయమైన సహజ తెలుగు రూపం.
- source_word: τὸ ῥῆμα τοῦτο τὸ γεγονός
  choice: ఈ జరిగిన సంగతి
  rationale: ῥῆμαకు ‘మాట’, ‘విషయం’, ‘సంగతి’ అనే భావాలు ఉండగలవు. ఇక్కడ ప్రకటించబడిన సంఘటనను సూచిస్తున్నందున ‘సంగతి’ సహజంగా ఉంటుంది; దాని పదార్థ వైవిధ్యాన్ని పాదసూచికలో నిలిపాం.
- source_word: ὃ ὁ κύριος ἐγνώρισεν ἡμῖν
  choice: ప్రభువు మనకు తెలియజేసిన
  rationale: ἐγνώρισεν యొక్క ‘తెలియజేయడం’ అనే భావాన్ని సాంకేతికమైన ‘ప్రత్యక్షపరచడం’గా అతిశయింపకుండా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ὁ κύριος అనే పదం ఎవరిని సూచిస్తుంది?
  choice: ప్రభువు
  alternative: దేవుడు; లేదా మరింత నిర్దిష్టంగా ఒక దైవిక వ్యక్తిని పేర్కొనడం
  rationale: తక్షణ సందర్భంలో ప్రకటనకు మూలం దేవుడే అయినా, గ్రీకు పాఠం కేవలం ‘ప్రభువు’ అని చెబుతుంది. అందువల్ల లూకా కథనంలోని దైవశాస్త్రీయ ప్రతిధ్వనిని పరిమితం చేయకుండా అదే బిరుదును నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథనశైలి. గ్రీకు వాక్యనిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా దాని కాలక్రమం, తక్షణత్వం, పదార్థ సందిగ్ధతను నిలిపాం.
