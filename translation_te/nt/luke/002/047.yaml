  text: ἐξίσταντο δὲ πάντες οἱ ἀκούοντες αὐτοῦ ἐπὶ τῇ συνέσει καὶ ταῖς ἀποκρίσεσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/047.yaml
  text: And all who heard him were astonished at his understanding and his answers[a].
translation:
  language: te
  text: ఆయన మాటలు వింటున్న వారందరూ ఆయనకున్న అవగాహనకూ ఆయన జవాబులకూ విస్మయపడ్డారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆశ్చర్యచకితులయ్యారు.’ గ్రీకు క్రియ బలమైన ఆశ్చర్యాన్ని వ్యక్తం చేయగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: ఆశ్చర్యచకితులయ్యారు
  rationale: ఈ సందర్భంలో ఈ క్రియ బలమైన ఆశ్చర్యాన్ని, విస్మయాన్ని తెలియజేస్తుంది. తెలుగు పాఠకులకు సహజంగా ఉండేలా, దాని తీవ్రతను నిలుపుతూ ఈ పదబంధాన్ని ఎంచుకున్నాం.
- source_word: δὲ
  choice: వాక్య ప్రవాహంలో ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ ఇక్కడ స్వల్ప కథన అనుసంధానకం. తెలుగులో ముందున్న వాక్యంతో సంబంధం సందర్భం ద్వారానే స్పష్టమవుతుంది; ‘అయితే’ అనడం అవసరంలేని వ్యతిరేక భావాన్ని కలిగించవచ్చు.
- source_word: πάντες οἱ ἀκούοντες αὐτοῦ
  choice: ఆయన మాటలు వింటున్న వారందరూ
  rationale: వర్తమాన కృదంతం వారు ఆయన మాటలు వింటున్న స్థితిని సూచిస్తుంది. ‘ఆయనను వింటున్న’ కంటే ‘ఆయన మాటలు వింటున్న’ అనేది సహజమైన ఆధునిక తెలుగు.
- source_word: ἐπὶ
  choice: -కూ ... -కూ
  rationale: దత్తి విభక్తితో ఉన్న ἐπί వారి ఆశ్చర్యానికి ఆధారం లేదా కారణాన్ని సూచిస్తుంది. తెలుగులో ‘అవగాహనకూ ... జవాబులకూ’ అనే నిర్మాణం ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: συνέσει
  choice: అవగాహన
  rationale: σύνεσις గ్రహణశక్తి, అంతర్దృష్టి, అవగాహన అనే భావాలను కలిగి ఉంది. ‘అవగాహన’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, మేధస్సు గురించిన అతిశయ మూల్యాంకనాన్ని చేర్చదు.
- source_word: ἀποκρίσεσιν
  choice: ఇచ్చిన జవాబులు
  rationale: సంభాషణ సందర్భంలో ἀπόκρισις‌కు ‘జవాబు’ సహజమైన సమానార్థకం. తెలుగులో వాక్యం సాఫీగా ఉండేందుకు ‘ఇచ్చిన’ చేర్చబడింది.
- source_word: αὐτοῦ
  choice: ఆయనకున్న / ఆయన ఇచ్చిన
  rationale: రెండు చోట్లా సర్వనామం యేసును సూచిస్తుంది. తెలుగులో సహజమైన స్వామ్య, కర్తృ సంబంధ నిర్మాణాలతో దాన్ని వ్యక్తం చేశాం.
