translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. బలమైన ఆశ్చర్యాన్ని నిలుపుతూ, పదక్షరానువాదం వల్ల కలిగే అసహజతను నివారించాం.
