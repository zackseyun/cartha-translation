source:
  edition: SBLGNT
  text: καὶ ἐξαίφνης ἐγένετο σὺν τῷ ἀγγέλῳ πλῆθος στρατιᾶς ⸀οὐρανίου αἰνούντων τὸν θεὸν καὶ λεγόντων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/013.yaml
  text: 'And suddenly there was with the angel a multitude of the heavenly host[a], praising God and saying:'
translation:
  language: te
  text: 'అకస్మాత్తుగా ఆ దూతతోపాటు పరలోక సైన్యసమూహం[a] ప్రత్యక్షమై, దేవుణ్ణి స్తుతిస్తూ ఇలా అంది:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరలోక సైన్యం’ లేదా ‘ఆకాశ సైన్య సమూహం.’
    reason: στρατιᾶς οὐρανίου అనే పదబంధంలోని ‘సైన్యం/సైన్యసమూహం’ మరియు ‘పరలోక/ఆకాశ’ అనే సాధ్యమైన పదప్రయోగాలను చూపించే నిఘంటు ప్రత్యామ్నాయాలు.
lexical_decisions:
- source_word: ἐξαίφνης
  choice: అకస్మాత్తుగా
  rationale: కథనంలో హఠాత్తుగా జరిగిన మార్పును సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐγένετο
  choice: ప్రత్యక్షమై
  rationale: ఇక్కడ ఉన్నది/కనిపించింది అనే అస్తిత్వార్థక ప్రయోగాన్ని దృశ్య సందర్భానికి సహజంగా అందిస్తుంది; ప్రత్యేకమైన దర్శన సిద్ధాంతాన్ని సూచించదు.
- source_word: σὺν τῷ ἀγγέλῳ
  choice: ఆ దూతతోపాటు
  rationale: సύν దత్తివుతో తెలిపే సహవాసాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: πλῆθος
  choice: సమూహం
  rationale: అనేకులు కూడిన పెద్ద సంఖ్యను సూచిస్తుంది; στρατιάతో కలిపి తెలుగులో సహజమైన సమాసాన్ని ఏర్పరుస్తుంది.
- source_word: στρατιᾶς οὐρανίου
  choice: పరలోక సైన్యసమూహం
  rationale: στρατιάలోని సైనిక రూపకాన్ని, οὐράνιοςలోని పరలోక సంబంధాన్ని రెండింటినీ నిలుపుతుంది; కేవలం ‘దూతల సమూహం’గా భావాన్ని కుదించదు.
- source_word: αἰνούντων τὸν θεόν
  choice: దేవుణ్ణి స్తుతిస్తూ
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న కార్యాన్ని సహజమైన తెలుగు క్రియావిశేషణ రూపంలో అందిస్తుంది.
- source_word: καὶ λεγόντων
  choice: ఇలా అంది
  rationale: తదుపరి వచనంలోని ఉక్తిని పరిచయం చేస్తుంది; సమూహాన్ని తెలుగు వ్యాకరణంలో ఏకవచన సమష్టి నామంగా అనుసరిస్తుంది.
theological_decisions:
- issue: στρατιᾶς οὐρανίου అనువాదం
  choice: పరలోక సైన్యసమూహం
  alternative: పరలోక సైన్యం; ఆకాశ సైన్యం
  rationale: ఈ పదబంధం క్రమబద్ధమైన పరలోక సమూహంతో పాటు సైనిక ఛాయను కూడా కలిగి ఉంది. సందర్భంలో వారు యుద్ధం చేయకుండా దేవుణ్ణి స్తుతిస్తున్నప్పటికీ, మూలంలోని సైనిక రూపకాన్ని తొలగించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘పరలోక సైన్యసమూహం’ మూలంలోని సైనిక-దివ్య రూపకాన్ని నిలుపుతుంది.
