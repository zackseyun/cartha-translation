  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδόντες δὲ ⸀ἐγνώρισαν περὶ τοῦ ῥήματος τοῦ λαληθέντος αὐτοῖς περὶ τοῦ παιδίου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/017.yaml
  text: And when they saw it[a], they made known the message that had been spoken to them about this child.
translation:
  language: te
  text: వారు చూసిన తరువాత, ఈ బిడ్డను గురించి తమకు చెప్పబడిన సందేశాన్ని[a] తెలియజేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మాటను’; లేదా ‘చెప్పిన విషయాన్ని’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: వారు చూసిన తరువాత
  rationale: ὁράω క్రియ యొక్క భూతకాల కృదంత రూపం ప్రధాన క్రియకు ముందుగా జరిగిన కార్యాన్ని సూచిస్తుంది. మూలంలో చూసిన దాని కర్మ స్పష్టంగా చెప్పబడలేదు; తెలుగులోనూ కర్మను చేర్చకుండా సహజంగా ఆ అస్పష్టతను నిలిపాం.
- source_word: δὲ
  choice: వాక్య ప్రవాహంలో ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప కథన అనుసంధానకం. తెలుగు కథన ప్రవాహంలో దాన్ని విడిగా ‘మరియు’ అని చేర్చకపోయినా దాని పని సహజంగా వ్యక్తమవుతుంది.
- source_word: ἐγνώρισαν
  choice: తెలియజేశారు
  rationale: γνωρίζω అంటే ఇతరులకు తెలిసేలా చేయడం లేదా వెల్లడించడం. ‘తెలియజేశారు’ ఆధునిక తెలుగులో సహజంగా ఉండి, అధికారిక ప్రకటన అనే అదనపు భావాన్ని చేర్చదు.
- source_word: περὶ τοῦ ῥήματος
  choice: సందేశాన్ని[a]
  rationale: ῥῆμα ఇక్కడ పలికిన మాటల విషయసారాన్ని సూచిస్తుంది. ‘సందేశం’ సందర్భానికి స్పష్టంగా సరిపోతుంది; ‘మాట’ లేదా ‘చెప్పిన విషయం’ అనే సాధ్యమైన అర్థాలను పాదసూచికలో ఉంచాం.
- source_word: τοῦ λαληθέντος αὐτοῖς
  choice: తమకు చెప్పబడిన
  rationale: మూలంలోని కర్మణి ప్రయోగాన్ని, అలాగే ముందే వారికి చెప్పబడిన కార్యాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: περὶ τοῦ παιδίου τούτου
  choice: ఈ బిడ్డను గురించి
  rationale: παιδίον ఇక్కడ అప్పుడే పుట్టిన యేసును సూచిస్తుంది. ‘ఈ బిడ్డ’ సహజమైన, సందర్భానుకూలమైన ఆధునిక తెలుగు ప్రయోగం.
theological_decisions:
- issue: దూతల ప్రకటనకు సంబంధించి ῥῆμα పదాన్ని అనువదించడం
  choice: సందేశం
  alternative: మాట; చెప్పిన విషయం
  rationale: ఇది బిడ్డను గురించి కాపరులకు ముందుగా చెప్పబడిన విషయసారాన్ని సూచిస్తుంది. ‘సందేశం’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; అయితే మూలపదంలోని ‘మాట/చెప్పిన విషయం’ అనే విస్తృతిని పాదసూచిక గుర్తిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, కథనానికి తగిన గంభీరతతో రూపొందించబడింది. మూలంలో ‘చూసిన’ క్రియకు కర్మ పేర్కొనబడనందున తెలుగులోనూ దాన్ని అనవసరంగా పూరించలేదు.
