review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the adversative contrast, the comparison involving Tyre and Sidon, and the future setting of judgment. However, “తీర్పు రోజున” adds “day,” which is not present in ἐν τῇ κρίσει (“in/at the judgment”). The source wording should retain the broader expression “తీర్పులో.”
  naturalness: The revised wording is natural modern standard Telugu. “మరింత సహనీయంగా ఉంటుంది” is an idiomatic impersonal comparative construction and clearly conveys that the judgment will be less severe for Tyre and Sidon than for the addressees.
  terminology: “తీర్పు” appropriately renders κρίσις without imposing a fuller doctrinal formulation. “తూరు, సీదోను” retains the established Telugu forms of the place names. “సహనీయంగా” is suitable for ἀνεκτότερον; the footnote supplies the close alternative “భరించదగినదిగా.”
  issues:
  - severity: medium
    issue: “తీర్పు రోజున” adds “day” to the source expression.
    rationale: ἐν τῇ κρίσει means “in/at the judgment” and does not contain ἡμέρα (“day”). Although the context may suggest final judgment, the translation should not add this temporal element to the verse itself.
  revised_text: అయితే తీర్పులో మీకంటే తూరు, సీదోనులకు మరింత సహనీయంగా ఉంటుంది.[a]
  revised_footnotes:
