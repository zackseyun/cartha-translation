id: LUK.10.14
reference: Luke 10:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πλὴν Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν τῇ κρίσει ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/014.yaml
  text: But it will be more bearable for Tyre and Sidon in the judgment than for you[a].
translation:
  language: te
  text: అయితే తీర్పులో మీకంటే తూరు, సీదోనులకు మరింత సహనీయంగా ఉంటుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మరింత భరించదగినదిగా ఉంటుంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: అయితే
  rationale: మునుపటి ఖండనతో ఉన్న బలమైన వ్యతిరేక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: తూరు, సీదోనులకు
  rationale: తులనాత్మక విశేషణంతో వచ్చిన సంప్రదాన విభక్తి భావాన్ని తెలుగులో ‘-లకు’ రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνεκτότερον
  choice: ఎక్కువ సహించదగినదిగా
  rationale: ‘మరింత భరించదగినది/సహించదగినది’ అనే తులనాత్మక అర్థాన్ని కాపాడుతుంది; తీర్పు సందర్భంలో గంభీరతను నిలుపుతుంది.
- source_word: ἔσται
  choice: ఉంటుంది
  rationale: భవిష్యత్ కాలంలోని అనుసంధాన క్రియను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ κρίσει
  choice: తీర్పు రోజున
  rationale: నిర్దిష్టమైన రాబోయే తీర్పు సందర్భాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘రోజున’ అనేది సందర్భానుగుణ స్పష్టీకరణ.
- source_word: ἢ ὑμῖν
  choice: మీకంటే
  rationale: గ్రీకులోని తులనను తెలుగులో సంక్షిప్తంగా, సహజంగా పూర్తి చేస్తుంది.
theological_decisions:
- issue: κρίσις యొక్క సందర్భార్థం
  choice: ‘తీర్పు రోజు’గా అనువదించి అంతిమ దైవిక తీర్పును సూచించడం
  alternative: సాధారణ అర్థంలో ‘తీర్పులో’
  rationale: పశ్చాత్తాపపడని పట్టణాల గతి తూరు, సీదోనులతో పోల్చబడుతున్న సందర్భం అంతిమ తీర్పును బలంగా సూచిస్తుంది. అయినప్పటికీ తీర్పు స్వరూపం గురించి అదనపు సిద్ధాంత వివరణను వాక్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరతను కాపాడే శైలి. స్థలాల పేర్లు ‘తూరు, సీదోను’గా వాడబడ్డాయి.
