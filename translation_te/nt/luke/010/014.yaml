- from: అయితే తీర్పు రోజున మీకంటే తూరు, సీదోనులకు ఎక్కువ సహించదగినదిగా ఉంటుంది.[a]
  to: అయితే తీర్పులో మీకంటే తూరు, సీదోనులకు మరింత సహనీయంగా ఉంటుంది.[a]
  rationale: The revision removes the unsupported addition “రోజున” and renders ἐν τῇ κρίσει directly as “తీర్పులో.” It retains the source’s adversative force, comparative relationship, future sense, and restrained theological wording.
