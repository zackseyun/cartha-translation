    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported addition “రోజున” and renders ἐν τῇ κρίσει directly as “తీర్పులో.” It retains the source’s adversative force, comparative relationship, future sense, and restrained theological wording.
