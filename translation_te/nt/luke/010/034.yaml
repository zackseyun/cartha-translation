id: LUK.10.34
reference: Luke 10:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ προσελθὼν κατέδησεν τὰ τραύματα αὐτοῦ ἐπιχέων ἔλαιον καὶ οἶνον, ἐπιβιβάσας δὲ αὐτὸν ἐπὶ τὸ ἴδιον κτῆνος ἤγαγεν αὐτὸν εἰς πανδοχεῖον καὶ ἐπεμελήθη αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/034.yaml
  text: And coming near[a], he bound up his wounds, pouring on oil and wine. Then he put him on his own animal, brought him to an inn[b], and took care of him.
translation:
  language: te
  text: అతడు అతని దగ్గరికి వెళ్లి, అతని గాయాలకు కట్లు కడుతూ వాటిమీద నూనెను, ద్రాక్షామద్యాన్ని పోశాడు.[a] తరువాత అతన్ని తన సొంత జంతువు[b] మీద ఎక్కించి, ఒక సత్రానికి తీసుకెళ్లి అతని బాగోగులు చూసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని గాయాలకు పట్టీలు కట్టాడు.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి గ్రీకు పదం బరువులు మోసే లేదా స్వారీకి ఉపయోగించే జంతువును సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: అతని దగ్గరికి వెళ్లి
  rationale: గాయపడిన వ్యక్తి వద్దకు భౌతికంగా చేరడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; భూతకాల అసమాపక క్రియ ప్రధాన చర్యకు ముందు జరిగిన కదలికను సూచిస్తుంది.
- source_word: κατέδησεν
  choice: వాటికి కట్లు కట్టాడు
  rationale: గాయాలను బట్టతో కట్టి చికిత్స చేయడం అనే ప్రత్యేక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τραύματα
  choice: గాయాలు
  rationale: దాడివల్ల కలిగిన శారీరక గాయాలకు సాధారణమైన, స్పష్టమైన తెలుగు పదం.
- source_word: ἐπιχέων
  choice: మీద ... పోసి
  rationale: నూనె, ద్రాక్షమద్యాన్ని గాయాలపై పోస్తూ కట్లు కట్టిన సహవర్తి చర్యను కాపాడుతుంది.
- source_word: ἔλαιον
  choice: నూనె
  rationale: మూలపదానికి నేరమైన సమానార్థకం; అది సాధారణంగా ఒలీవ నూనెను సూచించినా, మూలంలో లేని ప్రత్యేకీకరణను ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: οἶνον
  choice: ద్రాక్షమద్యం
  rationale: οἶνος సూచించే wine భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ‘ద్రాక్షారసం’లో ఉండగల మద్యరహిత పానీయం అనే సందిగ్ధతను నివారిస్తుంది.
- source_word: ἐπιβιβάσας
  choice: మీద ఎక్కించి
  rationale: గాయపడిన వ్యక్తిని జంతువు మీద ఉంచిన చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: ἴδιον
  choice: తన సొంత
  rationale: వ్యక్తిగత యాజమాన్యంపై ἴδιον ఉంచే నొక్కిచెప్పడాన్ని నిలుపుతుంది.
- source_word: κτῆνος
  choice: జంతువు
  rationale: బరువులు మోసే లేదా స్వారీకి ఉపయోగించే పెంపుడు జంతువును సూచించే విస్తృత మూలార్థాన్ని అనవసరంగా ఒక నిర్దిష్ట జంతువుకు పరిమితం చేయదు.
- source_word: πανδοχεῖον
  choice: సత్రం
  rationale: ప్రయాణికులు బస చేసే వసతిస్థలాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా సూచించే తెలుగు పదం.
- source_word: ἐπεμελήθη
  choice: బాగోగులు చూసుకున్నాడు
  rationale: వ్యక్తిగత శ్రద్ధతో సంరక్షించాడనే మధ్యమ క్రియ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
