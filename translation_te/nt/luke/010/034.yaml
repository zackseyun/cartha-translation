translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని వరుస చర్యలు నిలుపబడ్డాయి. అందించిన ఆంగ్ల పాఠ్యంలో పాదసూచిక గుర్తులు వాటి విషయాలకు సరిపోని చోట్ల ఉన్నందున, [a]ను గాయాలకు కట్లు కట్టడం వద్దకు, [b]ను జంతువు వద్దకు ఉంచి గమనికల అసలు సంబంధాన్ని స్పష్టం చేశాం.
