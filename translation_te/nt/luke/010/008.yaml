  text: καὶ εἰς ἣν ἂν πόλιν εἰσέρχησθε καὶ δέχωνται ὑμᾶς, ἐσθίετε τὰ παρατιθέμενα ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/008.yaml
  text: And into whatever city you enter[a], if they receive you, eat what is set before you[b],
translation:
  language: te
  text: మీరు ఏ పట్టణంలోకి ప్రవేశించి, అక్కడివారు మిమ్మల్ని స్వీకరిస్తే, మీకు వడ్డించినవి తినండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἣν ἂν πόλιν
  choice: ఏ పట్టణంలో ... అయినా
  rationale: సాపేక్ష సర్వనామంతో ἄν కలిసిన నిర్మాణం సాధారణమైన, అనిర్దిష్ట భావాన్ని ఇస్తుంది. తెలుగులో ‘ఏ పట్టణంలో ... అయినా’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది; గ్రీకు εἰς సూచించే లోపలికి కదలికను ‘ప్రవేశించినా’లోని భావం మోస్తుంది.
- source_word: εἰσέρχησθε
  choice: ప్రవేశించినా
  rationale: ఇది ἄνతో కూడిన సాధారణ సందర్భంలోని వర్తమాన సంభావనార్థక క్రియ. ‘ప్రవేశించినా’ ఆధునిక తెలుగులో సహజంగా ఉండి, పట్టణంలోకి వెళ్లే భావాన్ని నిలుపుతుంది.
- source_word: δέχωνται ὑμᾶς
  choice: అక్కడివారు మిమ్మల్ని స్వీకరిస్తే
  rationale: δέχομαι ఇక్కడ స్వీకరించడం లేదా ఆహ్వానించడం అనే భావాన్ని ఇవ్వగలదు. ‘స్వీకరిస్తే’ మూలపదానికి దగ్గరగా ఉండి సందర్భంలో ఆతిథ్య భావాన్నీ మోస్తుంది. గ్రీకులో καί ఉన్నప్పటికీ, అనిర్దిష్ట నిర్మాణం తరువాత తెలుగులో షరతుగా చెప్పడం సహజం.
- source_word: ἐσθίετε
  choice: తినండి
  rationale: వర్తమాన ఆజ్ఞార్థకాన్ని సహజమైన గౌరవ బహువచన ఆజ్ఞగా అనువదించింది.
- source_word: τὰ παρατιθέμενα ὑμῖν
  choice: మీకు వడ్డించినవి
  rationale: భోజన సందర్భంలో παρατίθημι ఎదుట ఉంచడం, వడ్డించడం అనే భావాన్ని ఇస్తుంది. ‘మీకు వడ్డించినవి’ సహజమైన తెలుగులో నిష్క్రియ భావాన్ని, ఆహార సూచనను స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ఆజ్ఞా శైలిని వాడాం. ‘స్వీకరిస్తే’ అనే పదం మూలంలోని receive/welcome భావ విస్తృతిని అతిగా సంకుచితం చేయకుండా ఉంచుతుంది.
