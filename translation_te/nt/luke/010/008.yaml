  verdict: revise
  source_fidelity: The draft accurately conveys the command to eat food offered by receptive residents. A small revision better represents εἰς ('into') and the linked general condition expressed by εἰσέρχησθε καὶ δέχωνται.
  naturalness: ‘ఏ పట్టణంలోకి మీరు ప్రవేశించి, అక్కడివారు మిమ్మల్ని స్వీకరిస్తే’ is clear, idiomatic modern standard Telugu. It avoids the slightly less precise locative wording ‘పట్టణంలో ప్రవేశించినా.’
  terminology: ‘స్వీకరిస్తే’ appropriately preserves the lexical range of δέχωνται ('receive/welcome'), while ‘మీకు వడ్డించినవి’ naturally renders the food set before the disciples.
  issues:
  - severity: low
    issue: The phrase ‘ఏ పట్టణంలో ప్రవేశించినా’ does not explicitly express movement into the city and uses a concessive-style form.
    rationale: εἰς marks entry into a city, and the Greek construction presents entry and reception as linked conditions. ‘ఏ పట్టణంలోకి మీరు ప్రవేశించి, అక్కడివారు మిమ్మల్ని స్వీకరిస్తే’ preserves both points naturally without changing the sense.
  revised_text: మీరు ఏ పట్టణంలోకి ప్రవేశించి, అక్కడివారు మిమ్మల్ని స్వీకరిస్తే, మీకు వడ్డించినవి తినండి.
