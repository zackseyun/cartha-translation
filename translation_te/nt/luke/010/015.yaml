id: LUK.10.15
reference: Luke 10:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ⸀τοῦ ᾅδου ⸀καταβιβασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/015.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will be brought down to Hades.
translation:
  language: te
  text: కపెర్నహూమా, నీవు పరలోకం వరకు హెచ్చించబడతావా? హేడీస్[a] వరకు దింపబడతావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మృతుల లోకం.’ గ్రీకు పదం ‘హేడీస్’; ఇది ‘గెహెన్నా’ (‘నరకం’) కాదు.
    reason: ᾅδηςకు వివరణాత్మక ప్రత్యామ్నాయాన్ని ఇస్తూ, గెహెన్నాతో ఉన్న పదభేదాన్ని కాపాడుతుంది.
lexical_decisions:
- source_word: Καφαρναούμ
  choice: కపెర్నహూము
  rationale: తెలుగు క్రైస్తవ వాడుకలో స్థిరపడిన ప్రామాణిక లిప్యంతరీకరణను అనుసరించి స్థలనామాన్ని అనువదించకుండా లిప్యంతరీకరించాం; సంబోధనలో ‘కపెర్నహూమా’ అని వాడాం.
- source_word: μὴ ... ὑψωθήσῃ
  choice: నీవు ... హెచ్చించబడతావా?
  rationale: μὴతో ఉన్న ప్రశ్న ప్రతికూల జవాబును ఆశించే అలంకారిక ప్రశ్న. దాన్ని నేరుగా ‘హెచ్చించబడవు’ అని మార్చకుండా ప్రశ్నారూపంలోనే ఉంచి మూలంలోని వ్యంగ్యబలాన్ని, కర్మణి ప్రయోగాన్ని కాపాడాం.
- source_word: ἕως οὐρανοῦ
  choice: పరలోకం వరకు
  rationale: ἕως పరిమితి లేదా వ్యాప్తిని సూచిస్తుంది. ‘వరకు’ మూలంలోని నిలువు దిశా చిత్రణను సహజమైన తెలుగులో నిలుపుతుంది; ఈ సందర్భంలో οὐρανόςకు ‘పరలోకం’ సాధారణంగా అర్థమయ్యే ఎంపిక.
- source_word: ἕως τοῦ ᾅδου
  choice: పాతాళం వరకు
  rationale: ᾅδης మృతుల లోకాన్ని సూచిస్తుంది; తుది శిక్షాస్థలాన్ని సూచించే గెహెన్నాతో ఇది సమానం కాదు. ‘పాతాళం’ నిలువు వ్యత్యాసాన్ని సహజంగా నిలుపుతుంది; సంభవించే అపార్థాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: καταβιβασθήσῃ
  choice: దింపబడతావు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ, ఎవరో క్రిందికి దింపే తీర్పు మరియు అవమాన భావాన్ని సహజమైన, మితమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ᾅδης పదానికి అనువాదం
  choice: పాతాళం
  alternative: మృతుల లోకం; హేడీస్; నరకం
  rationale: ‘నరకం’ అని అనువదిస్తే గెహెన్నా లేదా తుది శిక్ష గురించిన భావాన్ని అనవసరంగా దిగుమతి చేసే అవకాశం ఉంది. ‘పాతాళం’ మూలంలోని పైకి–కిందికి వ్యత్యాసాన్ని కాపాడుతుంది; పాదసూచిక దానిని ‘మృతుల లోకం’గా వివరిస్తూ గెహెన్నాతో తేడాను స్పష్టం చేస్తుంది.
- issue: μὴతో ఉన్న వాక్య నిర్మాణం
  choice: ప్రతికూల జవాబును ఆశించే అలంకారిక ప్రశ్న
  alternative: ‘నీవు పరలోకం వరకు హెచ్చించబడవు’ అనే నేర నిరాకరణ
  rationale: గ్రీకు నిర్మాణంలోని ప్రశ్నారూపాన్ని నిలుపడం వల్ల దాని నిజమైన వ్యంగ్యబలం, ఉద్దేశపూర్వక ఉద్రిక్తత రెండూ కాపాడబడతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని వాడాం. సంబోధన, అలంకారిక ప్రశ్న, కర్మణి ప్రయోగం, పరలోకం–పాతాళం నిలువు వ్యత్యాసం అన్నీ నిలుపబడ్డాయి.
