translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘యాజకుడు’ బైబిలు సందర్భానికి పరిచితమైన పదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది. మూలంలోని కొనసాగుతున్న చర్యను చూపేందుకు ‘దిగివెళ్తూ ఉన్నాడు’ను, ἀντιπαρῆλθεν‌లోని అవతలి వైపు దాటిపోయే భావాన్ని చూపేందుకు స్పష్టమైన కానీ అతివ్యాఖ్యానం కాని పదబంధాన్ని ఎంచుకున్నాం.
