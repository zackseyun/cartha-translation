source:
  edition: SBLGNT
  text: κατὰ συγκυρίαν δὲ ἱερεύς τις κατέβαινεν ἐν τῇ ὁδῷ ἐκείνῃ, καὶ ἰδὼν αὐτὸν ἀντιπαρῆλθεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/031.yaml
  text: By chance a certain priest was going down on that road[a], and when he saw him, he passed by on the opposite side.
translation:
  language: te
  text: యాదృచ్ఛికంగా, ఒక యాజకుడు ఆ దారిలో దిగివెళ్తూ ఉన్నాడు. అతడు ఆ మనిషిని చూసి, అతనికి అవతలి వైపున వెళ్లిపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతణ్ణి దాటిపోయాడు.’ అయితే గ్రీకు క్రియ అతనికి అవతలి వైపున ఉండి దాటిపోవడాన్ని సూచిస్తుంది; ఇది అతడు ఉద్దేశపూర్వకంగా తప్పించుకున్నాడనే భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ συγκυρίαν
  choice: యాదృచ్ఛికంగా
  rationale: ఈ గ్రీకు నుడికారం అనుకోకుండా లేదా సందర్భవశాత్తు జరగడాన్ని సూచిస్తుంది. ‘యాదృచ్ఛికంగా’ అనేది సహజమైన ఆధునిక తెలుగు; యాదృచ్ఛికత గురించి తాత్త్విక నిర్ధారణను అతిగా రుద్దదు.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ కథనాన్ని ముందుకు నడిపే స్వల్ప అనుసంధాన పదం. తెలుగులో వాక్యక్రమమే ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది; ‘అయితే’ అని అనువదిస్తే మూలంలో లేని బలమైన వ్యతిరేక భావం కలగవచ్చు.
- source_word: ἱερεύς τις
  choice: ఒక యాజకుడు
  rationale: τις పేరు చెప్పని ఒక వ్యక్తిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఒక యాజకుడు’ సహజంగా ఉండి ఆ అనిర్దిష్టతను కాపాడుతుంది; ‘ఒకానొక యాజకుడు’ అనవసరంగా సాహిత్య శైలిని పెంచుతుంది.
- source_word: κατέβαινεν
  choice: దిగివెళ్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న నేపథ్య చర్యను చూపుతుంది. ఈ ఎంపిక దిగువ దిశలో ప్రయాణించడాన్నీ, ఆ చర్య కొనసాగుతుండడాన్నీ కాపాడుతుంది.
- source_word: ἐν τῇ ὁδῷ ἐκείνῃ
  choice: ఆ దారిలో
  rationale: ὁδός‌తో ἐν ప్రయాణ మార్గాన్ని సూచిస్తుంది. ‘ఆ దారిలో’ సహజమైన తెలుగు ప్రయోగం.
- source_word: ἰδὼν αὐτὸν
  choice: అతడు ఆ మనిషిని చూసి
  rationale: అయోరిస్ట్ కృదంతం ఇక్కడ తదనంతర చర్యకు ముందు జరిగిన దర్శనాన్ని సూచిస్తుంది. ‘ఆ మనిషిని’ అని చెప్పడం ద్వారా తెలుగు పాఠకునికి సర్వనామ సూచన స్పష్టమవుతుంది.
- source_word: ἀντιπαρῆλθεν
  choice: దారికి అవతలి వైపునుంచి దాటిపోయాడు
  rationale: ఈ క్రియ కేవలం పక్కగా వెళ్లడమే కాక, ఎదురువైపు లేదా అవతలి వైపు ఉంచుకొని దాటిపోవడాన్ని సూచిస్తుంది. ఈ అనువాదం ఉద్దేశపూర్వకంగా దూరంగా తప్పించుకున్న భావసూచనను అతిగా వివరించకుండా నిలుపుతుంది.
