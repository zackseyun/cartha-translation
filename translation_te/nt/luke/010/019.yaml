id: LUK.10.19
reference: Luke 10:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀δέδωκα ὑμῖν τὴν ἐξουσίαν τοῦ πατεῖν ἐπάνω ὄφεων καὶ σκορπίων, καὶ ἐπὶ πᾶσαν τὴν δύναμιν τοῦ ἐχθροῦ, καὶ οὐδὲν ὑμᾶς οὐ μὴ ⸀ἀδικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/019.yaml
  text: Behold[a], I have given you the authority to tread on snakes and scorpions, and over all the power of the enemy[b], and nothing will ever harm you.
translation:
  language: te
  text: ఇదిగో, పాములనూ తేళ్లనూ తొక్కడానికి, శత్రువు యొక్క సమస్త శక్తిమీద అధికారాన్ని మీకు ఇచ్చి ఉన్నాను; ఏదీ మీకు ఏ విధంగానూ హాని చేయదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మూలభాషలో ఇక్కడ బలమైన ద్వంద్వ నిరాకరణ ఉంది: ‘ఏదీ మీకు ఎంతమాత్రమూ హాని చేయదు’ అనే భావం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδού
  choice: ఇదిగో
  rationale: శ్రోతల దృష్టిని ఆకర్షించే గ్రీకు సంభాషణ సూచకంలోని ఉద్ఘాటనను సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: δέδωκα
  choice: ఇచ్చి ఉన్నాను
  rationale: పూర్తయిన కార్యం ప్రస్తుతం ఫలితాన్ని కలిగి ఉందనే గ్రీకు పరిపూర్ణ కాల భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐξουσίαν
  choice: అధికారాన్ని
  rationale: తరువాత వచ్చే δύναμις అనే ‘శక్తి’తో ఉన్న పదభేదాన్ని కాపాడుతూ, ప్రసాదించబడిన అధికారాన్ని సూచిస్తుంది.
- source_word: τοῦ πατεῖν
  choice: తొక్కడానికి
  rationale: ఇచ్చిన అధికారం యొక్క ఉద్దేశం లేదా విషయాన్ని తెలుపుతూ మూలంలోని స్పష్టమైన దృశ్యాన్ని నిలుపుతుంది.
- source_word: ἐπάνω ὄφεων καὶ σκορπίων
  choice: పాములనూ తేళ్లనూ
  rationale: ఆధునిక తెలుగులో సహజంగా ఉండే పదాలతో మూలంలోని అక్షరార్థ దృశ్యాన్ని కాపాడుతుంది.
- source_word: ἐπὶ πᾶσαν τὴν δύναμιν
  choice: శక్తి అంతటిమీద
  rationale: శత్రువు కలిగిన సమస్త బలంపై శిష్యులకు ఇవ్వబడిన ఆధిపత్య విస్తృతిని తెలియజేస్తుంది.
- source_word: δύναμιν
  choice: శక్తి
  rationale: ἐξουσίαకు వాడిన ‘అధికారం’తో భేదాన్ని నిలుపుతూ బలం లేదా సామర్థ్యం అనే భావాన్ని ఇస్తుంది.
- source_word: τοῦ ἐχθροῦ
  choice: శత్రువు
  rationale: మూలంలోని ఏకవచన, వ్యక్తీకరణ భావాన్ని నిలుపుతుంది; ప్రధాన పాఠ్యంలో సాతాను అని అతిగా నిర్దిష్టం చేయదు.
- source_word: οὐδὲν ... οὐ μὴ ἀδικήσῃ
  choice: ఏదీ మీకు ఏ విధంగానూ హాని చేయదు
  rationale: οὐ μήతో కూడిన బలమైన నిరాకరణను సహజమైన తెలుగులో ‘ఏ విధంగానూ’ అనే ఉద్ఘాటనతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘శత్రువు’ ఎవరిని సూచిస్తున్నాడు
  choice: ప్రధాన పాఠ్యంలో ‘శత్రువు’ అని మాత్రమే అనువదించడం
  alternative: ‘సాతాను’ లేదా ‘అపవాది’ అని స్పష్టీకరించడం
  rationale: సందర్భం సాతాను సంబంధమైన విరోధాన్ని సూచించినా, గ్రీకు పాఠ్యం ‘శత్రువు’ అని మాత్రమే చెబుతుంది; అందువల్ల గుర్తింపును అనువాదంలోనే నిర్ణయించలేదు.
- issue: ‘పాములు, తేళ్లు’ అక్షరార్థమా ప్రతీకాత్మకమా
  choice: ప్రధాన పాఠ్యంలో అక్షరార్థ దృశ్యాన్ని నిలుపడం
  alternative: దుష్ట ఆత్మిక శక్తులకు రూపకంగా అనువదించడం
  rationale: పదాల ప్రత్యక్ష అర్థం పాములు, తేళ్లు; సందర్భం ఆత్మిక విరోధాన్ని కూడా స్ఫురింపజేయవచ్చు. అనువాదం ఈ వ్యాఖ్యాన అవకాశాన్ని తెరిచి ఉంచుతుంది.
- issue: హాని జరగదనే వాగ్దానంలోని ఉద్ఘాటన
  choice: ‘ఏ విధంగానూ హాని చేయదు’ అని బలమైన నిరాకరణను నిలుపడం
  alternative: ‘హాని చేయదు’ అని సాధారణ నిరాకరణగా ఇవ్వడం
  rationale: గ్రీకు οὐδέν ... οὐ μή నిర్మాణం అత్యంత బలమైన నిరాకరణను వ్యక్తం చేస్తుంది; దానిని తగ్గించకుండా, అలాగే దాని అన్వయాన్ని అదనపు సిద్ధాంత వివరణతో పరిమితం చేయకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘అధికారం/శక్తి’ అనే కీలక పదభేదాన్ని నిలిపాం; ‘ఇచ్చి ఉన్నాను’ ద్వారా గ్రీకు పరిపూర్ణ కాలంలోని ప్రస్తుత ఫలిత భావాన్ని వ్యక్తం చేశాం.
