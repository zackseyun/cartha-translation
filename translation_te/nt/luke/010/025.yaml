id: LUK.10.25
reference: Luke 10:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ νομικός τις ἀνέστη ἐκπειράζων ⸀αὐτὸν λέγων· Διδάσκαλε, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/025.yaml
  text: And behold[a], a lawyer stood up, testing him, saying, “Teacher, what must I do to inherit eternal life?”
translation:
  language: te
  text: ఇదిగో, ధర్మశాస్త్ర నిపుణుడు ఒకడు లేచి, ఆయనను పరీక్షిస్తూ, “బోధకుడా, నిత్యజీవాన్ని వారసత్వంగా పొందడానికి నేనేమి చేయాలి?” అని అడిగాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: ఇదిగో
  rationale: కథనంలో అకస్మాత్తుగా దృష్టిని ఆకర్షించే ἰδού పదబలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; Καί ఇక్కడ కథన అనుసంధానంగా పనిచేస్తుంది.
- source_word: νομικός τις
  choice: ధర్మశాస్త్ర నిపుణుడు ఒకడు
  rationale: ఇక్కడ νομικός ఆధునిక న్యాయవాదిని కాక, మోషే ధర్మశాస్త్రంలో నిపుణుడిని సూచిస్తుంది. ఈ ఎంపిక సందర్భార్థాన్ని నేరుగా, అపార్థం లేకుండా తెలియజేస్తుంది.
- source_word: ἀνέστη
  choice: లేచి
  rationale: వ్యక్తి నిలబడిన చర్యను సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐκπειράζων αὐτὸν
  choice: ఆయనను పరీక్షిస్తూ
  rationale: ప్రశ్న వెనుక ఉన్న పరీక్షించే లేదా పరిశీలించే ఉద్దేశాన్ని నిలుపుతుంది; ‘శోధిస్తూ’ అనేది పాపానికి ప్రలోభపెట్టడం అనే భావాన్ని అతిగా సూచించవచ్చు.
- source_word: λέγων
  choice: అని అడిగాడు
  rationale: గ్రీకు భాషలోని ‘చెబుతూ’ అనే భాగధాతు నిర్మాణాన్ని తెలుగు సంభాషణలో సహజంగా ప్రశ్నను పరిచయం చేసే రూపంగా మార్చింది.
- source_word: Διδάσκαλε
  choice: బోధకుడా
  rationale: సంబోధన రూపాన్ని నిలుపుతూ Διδάσκαλε యొక్క సాధారణ అర్థాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: τί ποιήσας
  choice: నేనేమి చేయాలి
  rationale: భవిష్యత్ ప్రధాన క్రియతో కూడిన గ్రీకు కృదంత నిర్మాణం సాధనం లేదా అవసరమైన చర్యను అడుగుతుంది; తెలుగులో ఈ రూపం సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: ζωὴν αἰώνιον
  choice: నిత్యజీవాన్ని
  rationale: కాలపరమైన నిరంతరత్వంతో పాటు యుగసంబంధ జీవితం అనే బైబిలీయ భావవ్యాప్తిని మోయగల స్థిరమైన, సులభంగా అర్థమయ్యే తెలుగు పదబంధం.
- source_word: κληρονομήσω
  choice: వారసత్వంగా పొందడానికి
  rationale: κληρονομέω లోని వారసత్వ రూపకాన్ని స్పష్టంగా నిలుపుతుంది; కేవలం ‘పొందడానికి’ అని అనువదిస్తే ఆ ముఖ్యమైన రూపకం పోతుంది.
theological_decisions:
- issue: రెండవ దేవాలయ కాలపు యూద సందర్భంలో νομικός అర్థం
  choice: ‘ధర్మశాస్త్ర నిపుణుడు’ అని అనువదించడం
  alternative: ‘న్యాయవాది’ లేదా ‘ధర్మశాస్త్ర బోధకుడు’
  rationale: ఆ వ్యక్తి మోషే ధర్మశాస్త్ర వివరణలో ప్రావీణ్యం కలవాడని మూలపదం సూచిస్తుంది. ఆధునిక లౌకిక న్యాయవాది అనే అపార్థాన్ని నివారించడానికి సందర్భస్పష్టమైన పదబంధం ఎంచుకోబడింది.
- issue: τί ποιήσας ... κληρονομήσω యొక్క భావబలం
  choice: ‘వారసత్వంగా పొందడానికి నేనేమి చేయాలి?’
  alternative: ‘నేనేమి చేసి నిత్యజీవాన్ని వారసత్వంగా పొందుతాను?’
  rationale: ప్రశ్నకర్త చర్యకూ వారసత్వానికీ మధ్య ఉంచిన ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది. అతని ప్రశ్నను రచనల సిద్ధాంతంగా సమర్థించదు లేదా ముందుగానే ఖండించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కథన గౌరవాన్ని మరియు మూలంలోని వారసత్వ రూపకాన్ని నిలుపుతూ అనువదించబడింది. సందర్భార్థం స్పష్టంగా ఉన్నందున పాదటిప్పణి అవసరం లేదు.
