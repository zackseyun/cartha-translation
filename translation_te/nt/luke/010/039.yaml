id: LUK.10.39
reference: Luke 10:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τῇδε ἦν ἀδελφὴ καλουμένη ⸀Μαριάμ, ἣ καὶ ⸂παρακαθεσθεῖσα πρὸς⸃ τοὺς πόδας τοῦ ⸀Ἰησοῦ ἤκουεν τὸν λόγον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/039.yaml
  text: And she had a sister called Mary[a], who also sat at Jesus’ feet and was listening to his word.
translation:
  language: te
  text: ఆమెకు మరియ అనే ఒక సోదరి ఉండేది. ఆమె యేసు[a] పాదాల దగ్గర కూర్చొని, ఆయన మాట వింటూ ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘యేసు’కు బదులుగా ‘ప్రభువు’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: τῇδε
  choice: ఆమెకు
  rationale: ఈ స్త్రీలింగ ఏకవచన సూచన మునుపటి వచనంలోని మార్తను సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘ఆమెకు ... సోదరి ఉండేది’ అనడం సహజంగా ఉండి, దత్తివిభక్తి భావాన్ని నిలుపుతుంది.
- source_word: ἀδελφὴ
  choice: సోదరి
  rationale: ఇది నేరుగా కుటుంబ బంధాన్ని తెలిపే పదం; ఆధునిక ప్రామాణిక తెలుగులో ‘సోదరి’ సహజమైన, గౌరవప్రదమైన ఎంపిక.
- source_word: καλουμένη Μαριάμ
  choice: మరియ అనే
  rationale: καλουμένη ఒక వ్యక్తి పేరును పరిచయం చేస్తుంది. ‘మరియ అనే’ అనేది తెలుగులో సహజంగా ఉండి మూలార్థాన్ని కచ్చితంగా అందిస్తుంది.
- source_word: παρακαθεσθεῖσα πρὸς τοὺς πόδας
  choice: పాదాల దగ్గర కూర్చొని
  rationale: ఈ పదబంధం ఒకరి పాదాల సమీపంలో కూర్చున్న స్థితిని సూచిస్తుంది. ‘పాదాల దగ్గర కూర్చొని’ శిష్యురాలి భంగిమను అతిగా వ్యాఖ్యానించకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοῦ Ἰησοῦ
  choice: యేసు
  rationale: ఇచ్చిన SBLGNT ప్రధాన పాఠంలో Ἰησοῦ (‘యేసు’) ఉంది. అందువల్ల దానినే ప్రధాన పాఠంలో ఉంచి, κύριος (‘ప్రభువు’) అనే పాఠాంతరాన్ని పాదసూచికలో నమోదు చేశాం.
- source_word: ἤκουεν
  choice: వింటూ ఉండేది
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న చర్యను సూచిస్తుంది; ‘వింటూ ఉండేది’ ఆ దురేటివ్ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τὸν λόγον αὐτοῦ
  choice: ఆయన మాట
  rationale: λόγος ఇక్కడ యేసు పలుకుతున్న బోధన లేదా సందేశాన్ని సూచించినా, ‘ఆయన మాట’ మూలపదపు విస్తృతిని సంకుచితం చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: ‘పాదాల దగ్గర’ అనే పదబంధంలో వ్యక్తి పేరు లేదా బిరుదుకు సంబంధించిన పాఠాంతరం
  choice: యేసు
  alternative: ప్రభువు
  rationale: ఇచ్చిన SBLGNT పాఠం τοῦ Ἰησοῦ అని చదువుతుంది కాబట్టి ప్రధాన అనువాదంలో ‘యేసు’ను అనుసరించాం. ‘ప్రభువు’ అనే ముఖ్యమైన పాఠాంతరం క్రీస్తు బిరుదును స్పష్టంగా ప్రదర్శిస్తుంది గనుక దానిని పాదసూచికలో భద్రపరిచాం; ఏ పాఠాంతరాన్నీ మౌనంగా కలిపివేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో అనువదించబడింది. గ్రీకు వాక్యంలోని కొనసాగుతున్న వినికిడి చర్యను ‘వింటూ ఉండేది’తో, పాదాల వద్ద కూర్చున్న భంగిమను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా వ్యక్తం చేశాం.
