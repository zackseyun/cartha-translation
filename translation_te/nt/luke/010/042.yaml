source:
  edition: SBLGNT
  text: ⸂ὀλίγων δέ ἐστιν χρεία ἢ ἑνός⸃· ⸂Μαριὰμ γὰρ⸃ τὴν ἀγαθὴν μερίδα ἐξελέξατο ἥτις οὐκ ἀφαιρεθήσεται ⸀αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/042.yaml
  text: But few things are needed—or one[a]. For Mary has chosen the good portion[b], which will not be taken away from her.
translation:
  language: te
  text: అయితే కొన్ని మాత్రమే అవసరం—లేదా ఒక్కటే[a]. ఎందుకంటే మరియ మంచి భాగాన్ని[b] ఎంచుకుంది; అది ఆమె నుండి తీసివేయబడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక్క విషయం మాత్రమే అవసరం.” భోజన సందర్భంలో గ్రీకు మాటను మరింత నిర్దిష్టంగా, “కొన్ని వంటకాలే అవసరం—లేదా ఒక్కటే” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “మంచి వాటాను.” ఇక్కడి మాట భోజనంలోని భాగాన్నీ, నిజంగా విలువైన దానిలో వాటాన్నీ ఉద్దేశపూర్వకంగా సూచిస్తూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγων δέ ἐστιν χρεία ἢ ἑνός
  choice: అయితే కొన్నే అవసరం—లేదా ఒక్కటే
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్తతను, ‘కొన్ని’ మరియు ‘ఒక్కటి’ మధ్య వ్యత్యాసాన్ని నిలుపుతుంది. సందర్భంలో ఇవి వంటకాలను సూచించవచ్చు; లేదా అవసరమైన విషయాలను మరింత విస్తృతంగా సూచించవచ్చు. తెలుగు వాక్యం రెండింటికీ అవకాశం ఇస్తుంది.
- source_word: Μαριὰμ
  choice: మరియ
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: τὴν ἀγαθὴν μερίδα
  choice: మంచి భాగాన్ని
  rationale: ἀγαθήను తులనాత్మకంగా మార్చకుండా ‘మంచి’గా అనువదిస్తుంది. μερίςలోని ‘భాగం/వాటా’ భావాన్ని నిలుపుతూ, భోజన భాగం మరియు నిజంగా విలువైన దానిలో వాటా అనే ద్వంద్వ సూచనకు వీలు కల్పిస్తుంది.
- source_word: ἐξελέξατο
  choice: ఎంచుకుంది
  rationale: మధ్యమ ప్రయోగంలోని వ్యక్తిగత, ఉద్దేశపూర్వక ఎంపిక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἥτις οὐκ ἀφαιρεθήσεται αὐτῆς
  choice: అది ఆమె నుండి తీసివేయబడదు
  rationale: ఎంచుకున్న భాగాన్నే తిరిగి సూచిస్తూ, భవిష్యత్ కర్మణి రూపంలోని తొలగించబడకపోవడం అనే వాగ్దానాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: ‘కొన్నే అవసరం—లేదా ఒక్కటే’ అనే మాటకు మార్త సేవతోను మరియ ఎంపికతోను ఉన్న సంబంధం
  choice: అది కొద్ది వంటకాలనో, ఒక్క వంటకాన్నో, లేక అవసరమైన ఒక్క విషయాన్నో సూచిస్తుందని ప్రధాన పాఠ్యంలో నిర్ణయించకుండా ఉంచడం.
  alternative: ‘ఒక్క విషయం మాత్రమే అవసరం’ అని స్పష్టీకరించడం; లేదా ‘కొన్ని వంటకాలు—లేదా ఒక్క వంటకమే’ అని భోజన సందర్భానికే పరిమితం చేయడం.
  rationale: గ్రీకు పాఠ్యం ఆచరణాత్మకమైన భోజన ఏర్పాట్ల సూచనకూ, మరింత విస్తృతమైన ఆధ్యాత్మిక వ్యత్యాసానికీ అవకాశం ఇస్తుంది. అనువాదం ఈ భావ ఉద్రిక్తతను పరిష్కరించకుండా సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని సంక్షిప్తతను, ‘మంచి’ అనే సాధారణ గుణవాచకాన్ని, వ్యాఖ్యానపరమైన అస్పష్టతను కాపాడింది.
