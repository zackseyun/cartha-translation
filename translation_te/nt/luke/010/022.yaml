id: LUK.10.22
reference: Luke 10:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς γινώσκει τίς ἐστιν ὁ υἱὸς εἰ μὴ ὁ πατήρ, καὶ τίς ἐστιν ὁ πατὴρ εἰ μὴ ὁ υἱὸς καὶ ᾧ ⸀ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/022.yaml
  text: All things have been handed over to me by my Father[a], and no one knows who the Son is except the Father[b], and who the Father is except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: te
  text: “నా తండ్రి సమస్తాన్నీ నాకు అప్పగించాడు.[a] కుమారుడు ఎవరో తండ్రికి తప్ప మరెవరికీ తెలియదు; తండ్రి ఎవరో కుమారునికి, కుమారుడు ఎవరికి ఆయనను బయలుపరచాలని కోరుకుంటాడో వారికి తప్ప మరెవరికీ తెలియదు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమస్తమూ నా తండ్రి చేత నాకు అప్పగించబడింది.”
    reason: మూలంలోని కర్మణి వాక్యనిర్మాణాన్ని మరింత రూపానుగుణంగా చూపించే ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: πάντα
  choice: సమస్తాన్నీ
  rationale: నపుంసక బహువచనమైన πάντα ఇక్కడ విస్తృత సమగ్రతను సూచిస్తుంది. ‘సమస్తాన్నీ’ ఆ వ్యాప్తిని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: παρεδόθη ὑπὸ τοῦ πατρός μου
  choice: నా తండ్రి ... నాకు అప్పగించాడు
  rationale: గ్రీకులోని కర్మణి ప్రయోగం మరియు వ్యక్తిగత కర్తృత్వాన్ని తెలుగులో సహజంగా వ్యక్తపరచడానికి కర్తరి వాక్యనిర్మాణం వాడబడింది; ‘అప్పగించాడు’ παραδίδωμι యొక్క ప్రధాన భావాన్ని నిలుపుతుంది.
- source_word: γινώσκει
  choice: తెలియదు
  rationale: తెలుగులో వ్యక్తి ఎవరో తెలుసుకోవడాన్ని ‘తెలియు’ సహజంగా వ్యక్తపరుస్తుంది. మూలంలో లేని ‘పూర్తిగా’ వంటి తీవ్రతను చేర్చలేదు.
- source_word: τίς ἐστιν ὁ υἱὸς
  choice: కుమారుడు ఎవరో
  rationale: వ్యక్తిగత, సంబంధాత్మక భావాన్ని వివరణాత్మక విస్తరణ లేకుండా నేరుగా నిలుపుతుంది.
- source_word: ὁ υἱός / ὁ πατήρ
  choice: కుమారుడు / తండ్రి
  rationale: సందర్భంలో ఇవి నిర్దిష్టమైన సంబంధాత్మక బిరుదులు. తెలుగు లిపిలో పెద్ద అక్షరాల భేదం లేకపోవడంతో నిర్దిష్టత వాక్యసందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: కుమారుడు ఎవరికి ఆయనను బయలుపరచాలని కోరుకుంటాడో వారికి
  rationale: నిర్దిష్టం కాని గ్రహీతను, కుమారుని సంకల్పాన్ని, బయలుపరచే చర్యను నిలుపుతుంది. ‘ఆయనను’ అన్నది ముందున్న తండ్రినే సూచిస్తుందని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: βούληται
  choice: కోరుకుంటాడో
  rationale: కుమారుని స్వచ్ఛంద సంకల్పాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; మూలంలోని భావాన్ని వ్యవస్థీకృత సిద్ధాంత భాషతో విస్తరించదు.
- source_word: ἀποκαλύψαι
  choice: బయలుపరచాలని
  rationale: దాచబడినది తెలిసేలా చేయడం అనే ప్రకటన భావాన్ని, దాని వేదాంత ప్రతిధ్వనిని నిలుపుతుంది.
theological_decisions:
- issue: తండ్రి మరియు కుమారుని మధ్య ప్రత్యేకమైన పరస్పర జ్ఞానం
  choice: ‘తెలియదు’ అనే సరళ పదంతో మూలంలోని ప్రత్యేక పరస్పర జ్ఞానాన్ని యథాతథంగా ఉంచడం
  alternative: ‘పూర్తిగా తెలియదు’ లేదా ‘నిజంగా తెలియదు’ అని తీవ్రతను చేర్చడం
  rationale: వాక్య నిర్మాణమే తండ్రి–కుమారుల ప్రత్యేక పరస్పర జ్ఞానాన్ని బలంగా వ్యక్తపరుస్తుంది. γινώσκειలో ప్రత్యక్షంగా లేని ‘పూర్తిగా’ వంటి పదాన్ని చేర్చకుండా వేదాంత బరువును నిలుపుతుంది.
- issue: తండ్రిని బయలుపరచడంలో కుమారుని సంకల్పం
  choice: βούληταιను ‘కోరుకుంటాడో’ అని అనువదించి కుమారుని నిర్ణాయక పాత్రను నిలుపడం
  alternative: కుమారుని పాత్రను మృదువుచేసే వివరణాత్మక అనువాదం లేదా మరింత ప్రాచీనమైన ‘చిత్తగిస్తాడో’
  rationale: గ్రీకు వాక్యం తండ్రిని బయలుపరచే వ్యక్తిగా కుమారుని స్వతంత్ర సంకల్పాన్ని చూపుతుంది. అనువాదం దానిని తగ్గించదు, అలాగే పాఠానికి మించిన సిద్ధాంత వివరణను చేర్చదు.
- issue: ἀποκαλύψαι యొక్క సూచిత కర్మ
  choice: ‘ఆయనను’ అని చేర్చి అది తండ్రిని సూచించేలా చేయడం
  alternative: కర్మను పూర్తిగా సూచితంగానే వదిలివేయడం
  rationale: గ్రీకులో తండ్రి ముందరి ఉపవాక్యం నుండి సూచిత కర్మగా వస్తాడు. తెలుగులో సహజత, స్పష్టత కోసం సర్వనామం అవసరం; అది కొత్త భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. మొదటి ఉపవాక్యంలో గ్రీకు కర్మణి నిర్మాణాన్ని తెలుగులో సహజమైన కర్తరి నిర్మాణంగా మార్చి, రూపానుగుణ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం. ‘కుమారుడు’, ‘తండ్రి’ అనే సంబంధాత్మక బిరుదులు వివరణ లేకుండా నిలుపబడ్డాయి; మూలంలో లేని వేదాంత తీవ్రతను చేర్చలేదు.
