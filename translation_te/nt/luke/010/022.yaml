  to: “నా తండ్రి సమస్తాన్నీ నాకు అప్పగించాడు.[a] కుమారుడు ఎవరో తండ్రికి తప్ప మరెవరికీ తెలియదు; తండ్రి ఎవరో కుమారునికి, కుమారుడు ఎవరికి ఆయనను బయలుపరచాలని కోరుకుంటాడో వారికి తప్ప మరెవరికీ తెలియదు.”
