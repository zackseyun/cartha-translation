id: LUK.10.16
reference: Luke 10:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁ ἀκούων ὑμῶν ἐμοῦ ἀκούει, καὶ ὁ ἀθετῶν ὑμᾶς ἐμὲ ἀθετεῖ· ὁ δὲ ἐμὲ ἀθετῶν ἀθετεῖ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/016.yaml
  text: The one who hears you hears me[a], and the one who rejects you rejects me; but the one who rejects me rejects the one who sent me.
translation:
  language: te
  text: “మిమ్మల్ని వినేవాడు నన్ను వింటాడు; మిమ్మల్ని తిరస్కరించేవాడు[a] నన్ను తిరస్కరిస్తాడు; అయితే నన్ను తిరస్కరించేవాడు నన్ను పంపినవాణ్ణి తిరస్కరిస్తాడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తిరస్కరించు’కు గ్రీకు పదమైన ἀθετέω ‘పట్టించుకోకపోవడం’ లేదా ‘పక్కన పెట్టడం’ అనే అర్థాలను కూడా ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀκούων ὑμῶν ἐμοῦ ἀκούει
  choice: మీ మాట వినేవాడు నా మాట వింటాడు
  rationale: ἀκούωతో వచ్చిన వ్యక్తివాచక సర్వనామాలను తెలుగులో సహజంగా పలికించడానికి ‘మీ మాట/నా మాట’ అని అనువదించాం. ఇది శిష్యుల సందేశాన్ని మాత్రమే సూచించే నైరూప్య పదాన్ని చేర్చకుండా, వారిని వినడం యేసును వినడమే అనే వ్యక్తిగత ప్రతినిధిత్వాన్ని నిలుపుతుంది.
- source_word: ὁ ἀθετῶν / ἀθετεῖ
  choice: తిరస్కరించేవాడు / తిరస్కరిస్తాడు
  rationale: ἀθετέωకు తిరస్కరించడం, పట్టించుకోకపోవడం, పక్కనపెట్టడం అనే భావాలు ఉండవచ్చు. ఈ వ్యక్తిగత సంబంధ సందర్భంలో ‘తిరస్కరించు’ స్పష్టంగా, సహజంగా ఉంది; మూడు సందర్భాల్లోనూ ఒకే పదాన్ని వాడి గ్రీకు పునరుక్తిని నిలిపాం.
- source_word: ὑμᾶς / ἐμέ
  choice: మిమ్మల్ని / నన్ను
  rationale: గ్రీకులో ప్రత్యక్ష కర్మలుగా వ్యక్తులే ఉన్నారు. అందువల్ల ‘మీ బోధను’ వంటి వ్యాఖ్యానాత్మక విస్తరణ చేయకుండా వ్యక్తిగత బలాన్ని నిలిపాం.
- source_word: ὁ δὲ ἐμὲ ἀθετῶν
  choice: నన్ను తిరస్కరించేవాడు
  rationale: δέ ఇక్కడ భావప్రవాహాన్ని ముందుకు తీసుకెళ్తుంది. తెలుగులో ప్రత్యేకంగా ‘అయితే’ లేదా ‘కాని’ చేరిస్తే అవసరానికి మించిన వ్యతిరేకత కలగవచ్చు; వరుస వాక్య నిర్మాణమే శిఖర భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τὸν ἀποστείλαντά με
  choice: నన్ను పంపినవాణ్ణి
  rationale: మూలంలోని substantival participleను సహజమైన తెలుగు సంబంధ వాక్యరూపంలో ఇచ్చాం. సూచితుడు తండ్రి అని పాఠంలో స్పష్టీకరించకుండా, మూలంలోని అంతర్నిహిత సూచనను అలాగే ఉంచాం.
theological_decisions:
- issue: యేసుకు ఆయన పంపిన శిష్యులతో ఉన్న ప్రతినిధిత్వ సంబంధం
  choice: శిష్యులను వినడం/తిరస్కరించడం యేసును వినడం/తిరస్కరించడం అనే ప్రత్యక్ష వ్యక్తిగత గొలుసును నిలుపడం
  alternative: వారి సందేశాన్ని లేదా బోధను మాత్రమే వినడం/తిరస్కరించడం అని భావానువాదం చేయడం
  rationale: మూలంలో ‘మీరు’, ‘నేను’ అనే వ్యక్తిగత సర్వనామాలున్నాయి. అందువల్ల అధికారపూర్వక ప్రతినిధిత్వ భావాన్ని కేవలం బోధను అంగీకరించడం లేదా నిరాకరించడంగా కుదించలేదు.
- issue: ‘నన్ను పంపినవాడు’ ఎవరు అనే సూచన
  choice: ‘నన్ను పంపినవాణ్ణి’ అని అంతర్నిహితంగానే ఉంచడం
  alternative: ‘నన్ను పంపిన తండ్రిని’ లేదా ‘దేవుణ్ణి’ అని స్పష్టీకరించడం
  rationale: సందర్భంలో సూచన దేవునికే అయినా, ఈ వచనంలోని గ్రీకు పాఠం ‘తండ్రి’ లేదా ‘దేవుడు’ అని చెప్పదు. కాబట్టి వివరణాత్మక పదాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ప్రతినిధిత్వ సంబంధాన్ని స్పష్టంగా చూపేందుకు ‘మీ మాట/నా మాట’ అనే సహజ తెలుగు ప్రయోగం వాడబడింది; తిరస్కరణకు సంబంధించిన గ్రీకు పునరుక్తి మాత్రం యథాతథంగా నిలుపబడింది.
