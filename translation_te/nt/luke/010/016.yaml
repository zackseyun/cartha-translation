- from: “మీ మాట వినేవాడు నా మాట వింటాడు; మిమ్మల్ని తిరస్కరించేవాడు నన్ను తిరస్కరిస్తాడు[a]. నన్ను తిరస్కరించేవాడు నన్ను పంపినవాణ్ణి తిరస్కరిస్తాడు.”
  to: “మిమ్మల్ని వినేవాడు నన్ను వింటాడు; మిమ్మల్ని తిరస్కరించేవాడు[a] నన్ను తిరస్కరిస్తాడు; అయితే నన్ను తిరస్కరించేవాడు నన్ను పంపినవాణ్ణి తిరస్కరిస్తాడు.”
  rationale: The revision removes the supplied nouns ‘మాట’ so that the Telugu, like the Greek, directly identifies hearing the commissioned disciples with hearing Jesus. It preserves the repeated rejection language, keeps the sender unnamed, and uses a modest Telugu equivalent for δέ.
