id: LUK.10.2
reference: Luke 10:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔλεγεν ⸀δὲ πρὸς αὐτούς· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι· δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ⸂ἐργάτας ἐκβάλῃ⸃ εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/002.yaml
  text: And he said to them[a], “The harvest is plentiful, but the workers are few. Therefore pray to the Lord of the harvest that he would send out workers into his harvest.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “కోత సమృద్ధిగా ఉంది, కాని పనివారు కొద్దిమందే. కాబట్టి తన కోతలోకి పనివారిని పంపమని కోతకు ప్రభువైనవారిని ప్రార్థించండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: ఇలా అన్నాడు
  rationale: గ్రీకులో అసంపూర్ణ భూతకాల రూపం ఉన్నప్పటికీ, కథన పరిచయంలో ఆధునిక తెలుగులో ‘అన్నాడు’ సహజంగా ఉంటుంది; ‘ఇలా’ మాటలను పరిచయం చేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది స్వల్ప కథన అనుసంధాన పదం; తెలుగులో వాక్యప్రవాహమే ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: θερισμός
  choice: కోత
  rationale: వ్యవసాయ రూపకాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగు పదంతో నిలుపుతుంది.
- source_word: πολύς
  choice: విస్తారంగా ఉంది
  rationale: కోత పరిమాణం గొప్పదని తెలియజేసే సహజ తెలుగు ప్రయోగం; ‘సమృద్ధిగా’ కంటే పొలపు కోత దృశ్యానికి ఇది అనుకూలం.
- source_word: ἐργάται
  choice: పనివారు
  rationale: కోత పనిలో పాల్గొనేవారిని సూచించే స్పష్టమైన, లింగనిరపేక్ష ఆధునిక పదం.
- source_word: ὀλίγοι
  choice: కొద్దిమందే
  rationale: పనివారి సంఖ్య తక్కువగా ఉందనే వ్యత్యాసాన్ని ‘ఏ’ నొక్కిచెప్పే రూపంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δεήθητε
  choice: వేడుకోండి
  rationale: ఇది సాధారణంగా అడగడం కంటే earnest petition భావాన్ని కలిగిన ఆజ్ఞ; ‘ప్రార్థించండి’ సందర్భానికి సరిపడినా, మూలపదంలోని వేడుకునే బలాన్ని ‘వేడుకోండి’ మరింత నేరుగా నిలుపుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి పరిస్థితి నుంచి వచ్చే నిర్ధారణను స్పష్టంగా సూచిస్తుంది.
- source_word: κύριος
  choice: యజమాని
  rationale: ‘కోత’కు అధికారి, స్వామి అనే రూపక సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది; దైవసూచనను వివరణాత్మకంగా విప్పకుండా ఉంచుతుంది.
- source_word: ὅπως
  choice: …మని
  rationale: వేడుకోబోయే విషయాన్ని తెలుగులో సహజమైన ఉద్ధరణాత్మక నిర్మాణంతో పరిచయం చేస్తుంది.
- source_word: ἐκβάλῃ
  choice: పంపించమని
  rationale: ఈ సందర్భంలో బయటకు పంపడం/కార్యానికి పంపడం ప్రధాన భావం. గ్రీకు క్రియలో ఉండగల బలమైన ‘తోసి పంపు’ ఛాయను పాదసూచికలో నిలుపుతున్నాం.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: తన కోతలోకి
  rationale: εἰς యొక్క లోనికి దిశను, αὐτοῦ యొక్క స్వామ్యభావాన్ని అదనంగా ‘పొలం’ చేర్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: ‘కోత యజమాని’ అనే బిరుదు ఎవరిని సూచిస్తుంది, దాని theological force ఏమిటి?
  choice: ‘కోత యజమాని’ అనే రూపక బిరుదును వివరణ లేకుండా నిలుపడం.
  alternative: ఇది దేవుడిని సూచిస్తుందని లేదా యేసు దైవిక అధికారాన్ని పరోక్షంగా సూచిస్తున్నాడని పాఠ్యంలోనే వివరించడం.
  rationale: మూలపాఠం కోతపై అధికారం కలిగి పనివారిని పంపే వ్యక్తిని చూపుతుంది గాని, ఈ వాక్యంలో ఆ వ్యక్తి గుర్తింపును లేదా క్రీస్తుతో సంబంధాన్ని స్పష్టంగా విప్పదు. అందువల్ల theological tension‌ను పరిష్కరించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. వ్యవసాయ రూపకం, ఆజ్ఞ యొక్క earnest force, కోతపై యజమానిత్వ భావం నిలుపబడ్డాయి; పాఠ్యంలో లేని ‘పొలం’ వంటి వివరాలు చేర్చలేదు.
