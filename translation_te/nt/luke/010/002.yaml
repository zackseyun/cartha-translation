    text: లేదా, “బలంగా పంపమని.” గ్రీకు క్రియ సాధారణంగా ‘పంపు’ అనే మాటకన్నా బలమైన భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
  revision_rationale: The revision preserves the agricultural metaphor, the contrast between plentiful harvest and few workers, and the direction “into his harvest.” It restores the title force of κύριος in idiomatic modern Telugu, uses the standard prayer term for δεήθητε, and retains the stronger nuance of ἐκβάλῃ in a footnote. The referent of the Lord of the harvest remains unexplicated.
