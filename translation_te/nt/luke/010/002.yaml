revisions:
- from: 'ఆయన వారితో ఇలా అన్నాడు: “కోత విస్తారంగా ఉంది, కాని పనివారు కొద్దిమందే. కాబట్టి కోత యజమానిని, తన కోతలోకి పనివారిని పంపించమని[a] వేడుకోండి.”'
  to: 'ఆయన వారితో ఇలా అన్నాడు: “కోత సమృద్ధిగా ఉంది, కాని పనివారు కొద్దిమందే. కాబట్టి తన కోతలోకి పనివారిని పంపమని కోతకు ప్రభువైనవారిని ప్రార్థించండి.”'
  rationale: The revision preserves the agricultural metaphor, the contrast between plentiful harvest and few workers, and the direction “into his harvest.” It restores the title force of κύριος in idiomatic modern Telugu, uses the standard prayer term for δεήθητε, and retains the stronger nuance of ἐκβάλῃ in a footnote. The referent of the Lord of the harvest remains unexplicated.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:43:06Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the plentiful harvest, few workers, imperative petition, and commissioning workers into the owner's harvest. However, rendering κύριος as “యజమాని” weakens the established title-level force of “Lord” in this religious context, and “వేడుకోండి” can sound like an ordinary request rather than prayer directed to the Lord.
  naturalness: The sentence is generally fluent modern Telugu. “కోత సమృద్ధిగా ఉంది” is more idiomatic for an abundant harvest than “కోత విస్తారంగా ఉంది.” “కోతకు ప్రభువైనవారిని ప్రార్థించండి” is natural, respectful Telugu while retaining the metaphorical title.
  terminology: Revise κύριος to “ప్రభువు” through the natural construction “కోతకు ప్రభువైనవారు,” preserving the title without identifying the referent. Use “ప్రార్థించండి” for δεήθητε, retaining its imperative religious-petition sense. The footnote should retain the stronger possible force of ἐκβάλῃ without making it the main-text sense.
  issues:
  - severity: medium
    issue: κύριος is rendered “యజమాని.”
    rationale: Although “owner/master” is within the lexical range and fits the metaphor, “Lord” is the source’s title and the English POB’s chosen theological terminology. In this context “యజమాని” can reduce the prayer’s divine-address force. “కోతకు ప్రభువైనవారు” preserves both title and metaphor without interpretive expansion.
  - severity: low
    issue: δεήθητε is rendered “వేడుకోండి.”
    rationale: The word can denote earnest entreaty, but in this context it is prayer to the Lord. “ప్రార్థించండి” is the standard natural Telugu rendering and does not lose the imperative force.
  - severity: low
    issue: “కోత విస్తారంగా ఉంది” is somewhat less idiomatic for abundant produce.
    rationale: “విస్తారంగా” primarily evokes spatial extent. “కోత సమృద్ధిగా ఉంది” naturally expresses the abundance denoted by πολύς.
  revised_text: 'ఆయన వారితో ఇలా అన్నాడు: “కోత సమృద్ధిగా ఉంది, కాని పనివారు కొద్దిమందే. కాబట్టి తన కోతలోకి పనివారిని పంపమని కోతకు ప్రభువైనవారిని ప్రార్థించండి.”'
  revised_footnotes:
