    text: లేదా, “నేను నీకు కృతజ్ఞతలు చెబుతున్నాను.” ప్రార్థన సందర్భంలో గ్రీకు క్రియ స్తుతినీ కృతజ్ఞతనీ వ్యక్తపరచగలదు.
    reason: lexical_alternative
