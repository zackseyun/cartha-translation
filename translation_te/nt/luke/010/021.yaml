id: LUK.10.21
reference: Luke 10:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ὥρᾳ ἠγαλλιάσατο ⸀τῷ πνεύματι ⸂τῷ ἁγίῳ⸃ καὶ εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ἀπέκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις· ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/021.yaml
  text: In that same hour he rejoiced in the Holy Spirit and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding, and revealed them to little children. Yes, Father[c][b], because this was well-pleasing in your sight.”
translation:
  language: te
  text: 'అదే సమయంలో ఆయన పరిశుద్ధాత్మలో ఆనందించి ఇలా అన్నాడు: “తండ్రీ, ఆకాశానికీ భూమికీ ప్రభువా, నేను నిన్ను స్తుతిస్తున్నాను[a]. ఎందుకంటే నీవు ఈ సంగతులను జ్ఞానులకూ వివేకులకూ దాచావు, పసిపిల్లలకు[b] బయలుపరిచావు. అవును, తండ్రీ, ఎందుకంటే ఇదే నీ దృష్టికి ప్రీతికరమైంది[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నీకు కృతజ్ఞతలు చెబుతున్నాను.” ప్రార్థన సందర్భంలో గ్రీకు క్రియ స్తుతినీ కృతజ్ఞతనీ వ్యక్తపరచగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “శిశువులకు.” ఇక్కడ ఈ మాట వినయంగలవారిని లేదా సమాజంలో గొప్పవారిగా ఎంచబడనివారిని రూపకంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఇదే నీ అనుకూల సంకల్పం” లేదా “ఇదే నీకు ప్రీతికరమైనది.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: అదే సమయంలో
  rationale: గ్రీకు కాలసూచక పదబంధంలోని ‘అదే’ అనే ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; అక్షరార్థమైన ‘అదే గంటలో’ ఇక్కడ కృత్రిమంగా ఉంటుంది.
- source_word: ἠγαλλιάσατο
  choice: ఆనందించి
  rationale: తీవ్రమైన సంతోషాన్ని సూచిస్తుంది; సందర్భంలో సహజంగా ఉండేందుకు ‘మిక్కిలి ఆనందించి’ కన్నా సంక్షిప్త రూపాన్ని ఎంచుకున్నాం.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: పరిశుద్ధాత్మలో
  rationale: నిర్దిష్ట ఉపపదాలతో ఉన్న గ్రీకు నిర్మాణం పరిశుద్ధాత్మనే సూచిస్తుంది. ‘లో’ అనే రూపం దత్తివిభక్తిలోని పరిధి లేదా సాధన భావాన్ని అనవసరంగా నిర్ణయించకుండా నిలుపుతుంది.
- source_word: Ἐξομολογοῦμαί σοι
  choice: నేను నిన్ను స్తుతిస్తున్నాను
  rationale: తండ్రిని ఉద్దేశించిన ప్రార్థనలో ఈ క్రియ స్తుతి లేదా కృతజ్ఞతను వ్యక్తపరచగలదు. ప్రధాన పాఠ్యంలో ‘స్తుతిస్తున్నాను’ ఉంచి, ‘కృతజ్ఞతలు చెబుతున్నాను’ అనే సాధ్యార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: తండ్రీ, ఆకాశానికీ భూమికీ ప్రభువా
  rationale: రెండు సంబోధనలను నిలుపుతూ κύριοςకు గౌరవభరితమైన సాధారణ సమానార్థంగా ‘ప్రభువు’ను వాడాం.
- source_word: ἀπέκρυψας
  choice: దాచిపెట్టి
  rationale: దేవుడే కర్తగా ఉన్న క్రియను నేరుగా నిలుపుతుంది; తరువాతి ‘బయలుపరిచావు’తో స్పష్టమైన వ్యతిరేక సమాంతరత ఏర్పడుతుంది.
- source_word: σοφῶν καὶ συνετῶν
  choice: జ్ఞానులకూ వివేకులకూ
  rationale: రెండు విశేషణాల భేదాన్ని నిలుపుతుంది; ‘విద్యావంతులు’ అని అనువదిస్తే మూలంలో లేని విద్యాస్థాయి భావం చేరుతుంది.
- source_word: ἀπεκάλυψας
  choice: బయలుపరిచావు
  rationale: దాచడం అనే క్రియకు విరుద్ధమైన ప్రకటన భావాన్ని, అలాగే వాక్యంలోని దైవిక ప్రత్యక్షత బరువును నిలుపుతుంది.
- source_word: νηπίοις
  choice: పసిపిల్లలకు
  rationale: అక్షరార్థంలోని చిన్నపిల్లలు లేదా శిశువుల రూపకాన్ని సాధారణ తెలుగులో నిలుపుతుంది; వినయులు లేదా అల్పులని ప్రధాన పాఠ్యంలో వివరణాత్మకంగా మార్చలేదు.
- source_word: οὕτως εὐδοκία ἐγένετο ἔμπροσθέν σου
  choice: ఇలా చేయడం నీ దృష్టికి ప్రీతికరమైంది
  rationale: గ్రీకు వాక్యంలోని ‘నీ సమక్షంలో/నీ దృష్టికి’ మరియు ‘ప్రీతి కలిగింది’ అనే భావాలను దగ్గరగా నిలుపుతూ తెలుగులో సహజంగా ఉంది; ‘నీ కృపాసంకల్పం’ అనే వ్యాఖ్యాత్మక అర్థాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
theological_decisions:
- issue: τῷ πνεύματι τῷ ἁγίῳ యొక్క సూచన
  choice: పరిశుద్ధాత్మలో
  alternative: తన ఆత్మలో; ఆత్మవశుడై
  rationale: నిర్దిష్ట ఉపపదంతో కూడిన పదనిర్మాణం ‘పరిశుద్ధాత్మ’ అనే వ్యక్తిగత సూచనకు బలంగా మద్దతిస్తుంది. ‘లో’ అనే అనువాదం పరిధి, సాధనం మధ్య ఉన్న స్వల్ప అస్పష్టతను నిలుపుతుంది.
- issue: జ్ఞానుల నుండి దాచడం, పసిపిల్లలకు బయలుపరచడం
  choice: దేవుడే రెండు క్రియలకు కర్తగా నేరుగా ఉంచడం
  alternative: జ్ఞానులు గ్రహించలేదు; పసిపిల్లలు గ్రహించారు
  rationale: మూలపాఠ్యంలో దైవకర్తృత్వం స్పష్టంగా ఉంది. దాని వల్ల కలిగే ధార్మిక ఉద్రిక్తతను మృదువుచేయకుండా నిలిపాం.
- issue: εὐδοκία యొక్క భావం
  choice: నీ దృష్టికి ప్రీతికరమైంది
  alternative: ఇది నీ కృపాసంకల్పం; ఇది నీ చిత్తమైంది
  rationale: ఈ నామవాచకం ప్రీతి, సంతోషం, అనుకూల సంకల్పం అనే భావాలను కలిగి ఉండగలదు. ప్రధాన పాఠ్యం మూలరూపానికి దగ్గరగా ఉండగా, సంకల్పార్థాన్ని పాదటిప్పణిలో చూపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, ప్రజలకు సులభంగా అర్థమయ్యే శైలి. ప్రార్థనా సంబోధనలో ‘తండ్రీ’, ‘ప్రభువా’ రూపాలు వాడబడ్డాయి. మూలంలోని దైవకర్తృత్వం, పరిశుద్ధాత్మ సూచన, εὐδοκίαలోని ప్రీతి/సంకల్ప అస్పష్టతలను సిద్ధాంతపరంగా సమతలీకరించకుండా నిలుపుకున్నాం.
