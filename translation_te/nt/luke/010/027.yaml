revisions:
- from: 'అతడు ఇలా జవాబిచ్చాడు: “నీ దేవుడైన ప్రభువును నీ హృదయమంతటినుండి[a], నీ పూర్ణాత్మతో, నీ పూర్ణబలంతో, నీ పూర్ణమనస్సుతో ప్రేమించాలి; నీ పొరుగువాణ్ణి నిన్ను నీవు ప్రేమించుకున్నట్లే ప్రేమించాలి.”'
  to: 'అతడు జవాబిచ్చాడు: “నీ దేవుడైన ప్రభువును నీ హృదయమంతటితో, నీ ఆత్మ అంతటితో, నీ బలమంతటితో, నీ మనస్సంతటితో ప్రేమించాలి; నీ పొరుగువానిని నిన్ను నీవు ప్రేమించుకున్నట్లే ప్రేమించాలి.”'
