id: LUK.10.27
reference: Luke 10:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ⸂ἐν ὅλῃ τῇ ψυχῇ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ ἰσχύϊ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ διανοίᾳ⸃ σου, καὶ τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/027.yaml
  text: And he answered, “You shall love the Lord your God from all your heart and with all your soul and with all your strength and with all your mind, and your neighbor as yourself.”
translation:
  language: te
  text: 'అతడు జవాబిచ్చాడు: “నీ దేవుడైన ప్రభువును నీ హృదయమంతటితో, నీ ఆత్మ అంతటితో, నీ బలమంతటితో, నీ మనస్సంతటితో ప్రేమించాలి; నీ పొరుగువానిని నిన్ను నీవు ప్రేమించుకున్నట్లే ప్రేమించాలి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: అతడు ఇలా జవాబిచ్చాడు
  rationale: గ్రీకు భాషలోని కృదంతం-క్రియా నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు కథన శైలిలో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: Ἀγαπήσεις
  choice: ప్రేమించాలి
  rationale: భవిష్యత్ సూచకరూపం ఇక్కడ లేఖన ఆజ్ఞగా పనిచేస్తోంది. తెలుగులో ‘ప్రేమించాలి’ ఆ ఆజ్ఞార్థాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: κύριον τὸν θεόν σου
  choice: నీ దేవుడైన ప్రభువును
  rationale: κύριος అనే దైవ బిరుదుకు ‘ప్రభువు’ను, θεόςకు ‘దేవుడు’ను ఉపయోగిస్తూ, రెండింటి సంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: ἐξ ὅλης τῆς καρδίας σου
  choice: నీ హృదయమంతటినుండి
  rationale: ἐξ అనే విభక్త్యర్థం ‘నుండి’ అనే మూలం/ఉద్భవ భావాన్ని ఇస్తుంది; తరువాతి ἐν పదబంధాలనుంచి దాని వ్యత్యాసాన్ని కూడా నిలుపుతుంది.
- source_word: ἐν ὅλῃ τῇ ψυχῇ σου
  choice: నీ పూర్ణాత్మతో
  rationale: ψυχήను ‘ఆత్మ’గా ఉంచి, దానిని కేవలం సాంకేతిక మానవశాస్త్ర విభాగంగా నిర్దేశించకుండా సంపూర్ణ అంతరంగ జీవితం అనే విస్తృత భావానికి అవకాశం ఇస్తుంది.
- source_word: ἐν ὅλῃ τῇ ἰσχύϊ σου
  choice: నీ పూర్ణబలంతో
  rationale: ἰσχύς సూచించే బలం లేదా శక్తిని స్పష్టమైన, సాధారణ తెలుగు పదంతో వ్యక్తం చేస్తుంది.
- source_word: ἐν ὅλῃ τῇ διανοίᾳ σου
  choice: నీ పూర్ణమనస్సుతో
  rationale: διάνοιαలోని మనస్సు, ఆలోచన, అవగాహన సామర్థ్యాన్ని ‘మనస్సు’ సహజంగా తెలియజేస్తుంది.
- source_word: τὸν πλησίον σου
  choice: నీ పొరుగువాణ్ణి
  rationale: నైతిక సందర్భంలో πλησίονకు స్థిరపడిన తెలుగు సమానార్థక పదం; సమీపంలోని తోటి మనిషి అనే సంబంధ భావాన్ని తెలియజేస్తుంది.
- source_word: ὡς σεαυτόν
  choice: నిన్ను నీవు ప్రేమించుకున్నట్లే
  rationale: గ్రీకులో రెండవ భాగంలో ఊహించబడిన ‘ప్రేమించు’ అనే క్రియను తెలుగులో స్పష్టం చేసి, ὡς యొక్క పోలిక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు దేవుణ్ణి సూచించే లేఖన ఉల్లేఖనంలో κύριος అనే దైవ బిరుదు
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఈ సందర్భంలో κύριος ఇశ్రాయేలు దేవుణ్ణి సూచిస్తోంది. ‘ప్రభువు’ దైవ బిరుదు యొక్క గంభీరతను, లేఖన ప్రతిధ్వనిని నిలుపుతుంది.
- issue: καρδία, ψυχή, ἰσχύς, διάνοια అనే నాలుగు మానవ సంబంధ పదాలు
  choice: హృదయం, ఆత్మ, బలం, మనస్సు అనే నాలుగు అంశాలను విడివిడిగా నిలుపడం
  alternative: వాటన్నిటినీ ‘నీ సర్వస్వంతో’ అని కలిపి భావానువాదం చేయడం
  rationale: ఈ పదాలు పరస్పరం కొంత భావసామ్యం కలిగినా, సంపూర్ణ భక్తిని బలంగా తెలియజేసే నాలుగు భాగాల నిర్మాణాన్ని మూలపాఠం ఉద్దేశపూర్వకంగా ఉంచింది. వాటిని విడిగా ఉంచడం కఠినమైన మానవశాస్త్ర విభజనను రుద్దకుండానే ఆ వాక్చాతుర్యాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన లేఖన శైలి ఉపయోగించబడింది. ‘హృదయమంతటినుండి’ అనే కొద్దిగా అసాధారణ నిర్మాణం మూలంలోని ἐξ మరియు తరువాతి ἐν మధ్య వ్యత్యాసాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది; దానికి పాదసూచిక వివరణ ఇస్తుంది.
