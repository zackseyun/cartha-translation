revisions:
- from: అప్పుడు ఆయన అతనితో, “నువ్వు సరిగ్గా జవాబిచ్చావు. దీన్ని చేస్తూ ఉండు; అప్పుడు నువ్వు జీవిస్తావు.[a]” అని అన్నాడు.
  to: 'ఆయన అతనితో ఇలా అన్నాడు: “నువ్వు సరిగ్గా జవాబిచ్చావు. ఇది చేయి, అప్పుడు నువ్వు జీవిస్తావు.[a]”'
  rationale: The revision removes the overly temporal rendering of δέ, uses a smoother Telugu speech introduction, and renders τοῦτο ποίει with an idiomatic imperative. It preserves the source’s unexpanded ‘you will live’ and retains the correctly anchored contextual footnote.
