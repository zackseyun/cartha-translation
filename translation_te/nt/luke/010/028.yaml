review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the evaluation and the future promise, but ‘అప్పుడు’ for δέ adds a more definite temporal-sequential sense than the mild Greek connective warrants. The present imperative may be rendered idiomatically as ‘ఇది చేయి’ without losing the command’s contextual force.
  naturalness: The direct speech is natural modern Telugu. ‘అతనితో … అని అన్నాడు’ is clear; placing ‘ఇలా’ before the quotation yields a smoother standard narrative construction. ‘ఇది చేయి’ is more idiomatic and concise than ‘దీన్ని చేస్తూ ఉండు’ in this aphoristic command.
  terminology: ‘సరిగ్గా జవాబిచ్చావు’ appropriately renders Ὀρθῶς ἀπεκρίθης. ‘జీవిస్తావు’ correctly retains ζήσῃ without importing ‘eternal life.’ The contextual clarification belongs in the footnote.
  issues:
  - severity: low
    issue: ‘అప్పుడు’ renders δέ too specifically.
    rationale: δέ is a mild connective (‘and/but/now’ according to context), not necessarily a temporal ‘then.’ Omitting it is natural in Telugu and avoids adding sequence.
  - severity: low
    issue: ‘దీన్ని చేస్తూ ఉండు’ is more explicitly durative than necessary.
    rationale: ποίει is a present imperative and can carry ongoing force, but the concise Telugu imperative ‘ఇది చేయి’ naturally conveys the command without over-specifying its aspect.
  revised_text: 'ఆయన అతనితో ఇలా అన్నాడు: “నువ్వు సరిగ్గా జవాబిచ్చావు. ఇది చేయి, అప్పుడు నువ్వు జీవిస్తావు.[a]”'
  revised_footnotes:
