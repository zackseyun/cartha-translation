  text: εἶπεν δὲ αὐτῷ· Ὀρθῶς ἀπεκρίθης· τοῦτο ποίει καὶ ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/028.yaml
  text: And he said to him[a], “You have answered correctly. Do this[b], and you will live.”
translation:
  language: te
  text: 'ఆయన అతనితో ఇలా అన్నాడు: “నువ్వు సరిగ్గా జవాబిచ్చావు. ఇది చేయి, అప్పుడు నువ్వు జీవిస్తావు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ సందర్భం నిత్యజీవాన్ని గురించి ఉంది (లూకా 10:25 చూడండి); అయితే ఇక్కడ గ్రీకు పాఠం కేవలం ‘నువ్వు జీవిస్తావు’ అని చెబుతుంది.
    reason: cross_reference
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: అప్పుడు ఆయన అతనితో … అని అన్నాడు
  rationale: δέ స్వల్ప కథన అనుసంధానాన్ని సూచిస్తుంది. తెలుగులో సహజమైన వాక్యనిర్మాణం కోసం పలికిన మాటలను మధ్యలో ఉంచి, ‘అప్పుడు’తో కథన ప్రవాహాన్ని చూపించాం; బలమైన వ్యతిరేకతను చేర్చలేదు.
- source_word: Ὀρθῶς
  choice: సరిగ్గా
  rationale: ὀρθῶς అంటే ‘సరిగా/యథార్థంగా.’ ఆధునిక సాధారణ తెలుగులో జవాబు సరైనదని అంచనా వేయడానికి ‘సరిగ్గా’ సహజంగా ఉంటుంది.
- source_word: ἀπεκρίθης
  choice: జవాబిచ్చావు
  rationale: రెండవ పురుష ఏకవచన భూతక్రియను తెలుగులో పూర్తయిన సమాధాన చర్యగా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τοῦτο ποίει
  choice: దీన్ని చేస్తూ ఉండు
  rationale: τοῦτο ముందుగా చెప్పిన ఆజ్ఞను సూచిస్తుంది. వర్తమాన కాల ఆజ్ఞారూపమైన ποίει లోని కొనసాగించే లేదా ఆచరిస్తూ ఉండే భావాన్ని ‘చేస్తూ ఉండు’ నిలుపుతుంది.
- source_word: καὶ ζήσῃ
  choice: అప్పుడు నువ్వు జీవిస్తావు
  rationale: καί ఇక్కడ ఆజ్ఞను దాని ఫలితంతో కలుపుతుంది; సహజ తెలుగులో ‘అప్పుడు’ ఆ సంబంధాన్ని తెలియజేస్తుంది. ζήσῃ ను అదనపు వ్యాఖ్యానం లేకుండా ‘జీవిస్తావు’గా అనువదించాం.
theological_decisions:
- issue: ‘జీవిస్తావు’ అనే మాట పరిధి
  choice: నువ్వు జీవిస్తావు
  alternative: నువ్వు నిత్యజీవాన్ని పొందుతావు
  rationale: సందర్భంలో నిత్యజీవం ప్రశ్నగా ఉన్నప్పటికీ (లూకా 10:25), ఈ వాక్యంలో గ్రీకు పాఠం కేవలం ‘నువ్వు జీవిస్తావు’ అని చెబుతుంది. అందువల్ల సందర్భార్థాన్ని పాఠ్యంలో విస్తరించి చేర్చకుండా, అసలు పదబంధంలోని సంక్షిప్తతను మరియు వ్యాఖ్యాన అవకాశాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. సంభాషణలో ఏకవచన ‘నువ్వు’ వాడటం గ్రీకు రెండవ పురుష ఏకవచనాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది. ‘చేస్తూ ఉండు’ వర్తమాన ఆజ్ఞారూపంలోని కొనసాగింపు భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
