id: LUK.10.7
reference: Luke 10:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν αὐτῇ δὲ τῇ οἰκίᾳ μένετε, ἐσθίοντες καὶ πίνοντες τὰ παρ’ αὐτῶν, ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ ⸀αὐτοῦ. μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/007.yaml
  text: Stay in that same house[a], eating and drinking what they provide, for the worker is worthy of his wages. Do not move from house to house.
translation:
  language: te
  text: అదే ఇంట్లో ఉండండి; వారు ఇచ్చేవాటిని తింటూ తాగండి. ఎందుకంటే పనివాడు తన జీతానికి అర్హుడు.[a] ఇంటింటికీ మారుతూ ఉండకండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పనివాడు తనకు రావలసిన జీతానికి అర్హుడు.”
    reason: τοῦ μισθοῦ αὐτοῦ అనే పదబంధాన్ని అర్హతకు సంబంధించిన జీతంగా, లేదా అతనికి న్యాయంగా రావలసిన జీతంగా కొద్దిగా విస్తరించి అనువదించవచ్చు.
lexical_decisions:
- source_word: ἐν αὐτῇ δὲ τῇ οἰκίᾳ μένετε
  choice: అదే ఇంట్లో ఉండండి
  rationale: αὐτῇ యొక్క అనాఫరిక, ఉద్ఘాటన భావాన్ని ‘అదే’ సహజంగా తెలియజేస్తుంది; వర్తమాన ఆజ్ఞారూపమైన μένετε నిరంతరం అక్కడే ఉండాలనే ఆదేశాన్ని సూచిస్తుంది.
- source_word: ἐσθίοντες καὶ πίνοντες τὰ παρ’ αὐτῶν
  choice: వారు ఇచ్చేవాటిని తింటూ తాగుతూ ఉండండి
  rationale: కృదంతాలు ప్రధాన ఆజ్ఞతో సమకాలికంగా కొనసాగే క్రియలను సూచిస్తాయి. τὰ παρ’ αὐτῶν ఆతిథ్యమిచ్చేవారు సమకూర్చే ఆహారపానీయాలను సూచిస్తుంది.
- source_word: ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ
  choice: ఎందుకంటే పనివాడు తన జీతానికి అర్హుడు
  rationale: ἐργάτης కు సాధారణ ఆధునిక తెలుగు ‘పనివాడు’; μισθός ఈ సందర్భంలో పనికి లభించే ప్రతిఫలమైన ‘జీతం’. ప్రతిబింబార్థక ‘తన’ గ్రీకు ఏకవచన సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν
  choice: ఇంటింటికీ మారుతూ ఉండకండి
  rationale: నివాసాన్ని ఒక ఇంటి నుంచి మరొక ఇంటికి మార్చుకుంటూ పోవద్దనే నిషేధాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది; వర్తమాన నిషేధంలోని పునరావృత భావాన్ని ‘మారుతూ ఉండకండి’ నిలుపుతుంది.
theological_decisions:
- issue: τοῦ μισθοῦ αὐτοῦ లోని పుంలింగ ఏకవచన సంబంధం
  choice: తన జీతానికి
  alternative: అతనికి రావలసిన జీతానికి
  rationale: ὁ ἐργάτης మరియు αὐτοῦ పుంలింగ ఏకవచనంలో ఉన్నాయి. తెలుగులో ‘తన’ కర్తతో సంబంధాన్ని స్పష్టంగా, సహజంగా చూపుతూ వ్యాకరణ ఏకవచనాన్ని నిలుపుతుంది; వాక్యానికి సామాన్య సూత్రార్థం ఉన్నప్పటికీ దాన్ని బహువచనంగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘అదే ఇంట్లో’ స్థిరంగా ఉండాలనే ఉద్ఘాటనను, ‘తింటూ తాగుతూ’ సమకాలిక కొనసాగింపును, ‘ఇంటింటికీ మారుతూ ఉండకండి’ పునరావృత నివాస మార్పుపై నిషేధాన్ని నిలుపుతున్నాయి.
