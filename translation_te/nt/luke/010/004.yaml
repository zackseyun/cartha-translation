id: LUK.10.4
reference: Luke 10:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ βαστάζετε βαλλάντιον, μὴ πήραν, ⸀μὴ ὑποδήματα, καὶ μηδένα κατὰ τὴν ὁδὸν ἀσπάσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/004.yaml
  text: Do not carry a money bag[a], a travel bag, or sandals[b], and greet no one along the road.
translation:
  language: te
  text: డబ్బు సంచిగానీ, ప్రయాణపు సంచిగానీ[a], చెప్పులుగానీ మోసుకెళ్లవద్దు; దారిలో ఎవరినీ పలకరించవద్దు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రయాణపు సంచి’ని ‘మూట’ లేదా కేవలం ‘సంచి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అప్పటి ఆచారం ప్రకారం వందనాలు, కుశలప్రశ్నలు చాలాసేపు కొనసాగేవి. కాబట్టి ఇది సాధారణ మర్యాదను పూర్తిగా నిషేధించడం కంటే, అత్యవసరమైన పనిలో అలాంటి పలకరింపుల వల్ల ఆలస్యం కాకూడదనే భావాన్ని సూచిస్తుండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: βαστάζετε
  choice: మోసుకెళ్లవద్దు
  rationale: ప్రయాణ సందర్భంలో βαστάζω అంటే ‘మోయడం/వెంట తీసుకెళ్లడం.’ తెలుగులో ‘మోసుకెళ్లవద్దు’ నిషేధపు భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: βαλλάντιον
  choice: డబ్బు సంచి
  rationale: ఇది డబ్బు పెట్టుకునే సంచిని సూచిస్తుంది. ఆధునిక పాఠకులకు ‘డబ్బు సంచి’ స్పష్టంగా ఉంటుంది.
- source_word: πήραν
  choice: ప్రయాణపు సంచి
  rationale: ప్రయాణంలో ఆహారం లేదా ఇతర అవసరాలు పెట్టుకునే సంచిని సూచిస్తుంది. ‘ప్రయాణపు సంచి’ దాని ఉపయోగాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὑποδήματα
  choice: చెప్పులు
  rationale: పాదాలకు ధరించే వాటిని, ప్రాచీన సందర్భంలో సాధారణంగా చెప్పులను, సూచిస్తుంది. ‘చెప్పులు’ సరళమైన ఆధునిక తెలుగు పదం.
- source_word: μηδένα
  choice: ఎవరికీ
  rationale: నిషేధ వాక్యంలో μηδένα అంటే ‘ఎవరినీ/ఎవరికీ కాదు.’ ‘వందనం చేయు’ అనే తెలుగు ప్రయోగంతో ‘ఎవరికీ’ సహజంగా సరిపోతుంది.
- source_word: κατὰ τὴν ὁδόν
  choice: దారిలో
  rationale: ప్రయాణం చేస్తుండగా దారి వెంబడి అనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἀσπάσησθε
  choice: వందనం చేయవద్దు
  rationale: ἀσπάζομαι ఇక్కడ పలకరించడం లేదా వందనం చేయడం అనే అర్థంలో ఉంది. ‘వందనం చేయవద్దు’ మూలంలోని ప్రత్యక్ష నిషేధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ప్రయాణంలో ఇతరులకు వందనం చేయవద్దన్న ఆజ్ఞ యొక్క తీవ్రత
  choice: ప్రధాన పాఠ్యంలో ‘దారిలో ఎవరికీ వందనం చేయవద్దు’ అనే ప్రత్యక్ష నిషేధంగానే అనువదించడం
  alternative: ‘సుదీర్ఘమైన పలకరింపులతో ఆలస్యం చేయవద్దు’ అని భావానువాదం చేయడం
  rationale: గ్రీకు పాఠ్యం ప్రత్యక్ష నిషేధాన్ని ఇస్తుంది. దానిని ప్రధాన పాఠ్యంలో మృదువుగా మార్చకుండా ఉంచి, అప్పటి సామాజిక వందనాలు సమయం పట్టేవనే సాధ్యమైన సాంస్కృతిక భావాన్ని పాదసూచికలో వివరిస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. వరుస నిషేధాలను సహజంగా కలపడానికి ‘-నిగానీ’ నిర్మాణాన్ని వాడాం. మూలంలోని ఆజ్ఞాత్మక తీవ్రతను ప్రధాన పాఠ్యంలో నిలిపి, సాంస్కృతిక వివరణను పాదసూచికకు పరిమితం చేశాం.
