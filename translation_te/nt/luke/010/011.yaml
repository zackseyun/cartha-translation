id: LUK.10.11
reference: Luke 10:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ τὸν κονιορτὸν τὸν κολληθέντα ἡμῖν ἐκ τῆς πόλεως ὑμῶν ⸂εἰς τοὺς πόδας⸃ ἀπομασσόμεθα ὑμῖν· πλὴν τοῦτο γινώσκετε ὅτι ⸀ἤγγικεν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/011.yaml
  text: 'Even the dust from your city that clung to our feet[a], we wipe off against you[d][c][b]. Nevertheless know this: the kingdom of God has come near.'
translation:
  language: te
  text: 'మీ పట్టణం నుండి మా పాదాలకు అంటుకున్న ధూళిని కూడా మీకు వ్యతిరేకంగా తుడిచివేస్తున్నాం.[a] అయినా ఇది తెలుసుకోండి: దేవుని రాజ్యం దగ్గరికి వచ్చింది.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మా పాదాల నుండి తుడిచివేస్తున్నాం’ అని కూడా అనువదించవచ్చు. గ్రీకు మాటతీరు కొంత అసహజంగా కనిపిస్తుంది; వారి పట్టణపు ధూళి సందేశకుల పాదాలకు అంటుకున్నదని భావం. ఇక్కడి క్రియ ‘దులిపివేయడం’ కంటే ప్రత్యేకంగా ‘తుడిచివేయడం’ అని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘సమీపించింది’ అని కూడా అనువదించవచ్చు. గ్రీకు పరిపూర్ణ కాలం దేవుని రాజ్యం దగ్గరికి వచ్చి, ఆ సమీపతకు కొనసాగుతున్న ప్రాముఖ్యత ఉందని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κονιορτός
  choice: ధూళి
  rationale: ఈ పదం సాధారణ మట్టి లేదా మురికిని కాకుండా ప్రత్యేకంగా ధూళిని సూచిస్తుంది; సందర్భంలోని సంకేతాత్మక చర్యను కూడా నిలుపుతుంది.
- source_word: κολληθέντα
  choice: అంటుకున్న
  rationale: కొనసాగి అతుక్కొని ఉండడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐκ τῆς πόλεως ὑμῶν
  choice: మీ పట్టణం నుండి
  rationale: ἐκ సూచించే మూలం లేదా ఉద్భవాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς τοὺς πόδας
  choice: మా పాదాలకు
  rationale: అక్షరార్థంగా ‘పాదాల మీదికి’ అనే కొంత అసహజమైన గ్రీకు ప్రయోగం ఇక్కడ ధూళి పాదాలకు అంటుకోవడాన్ని సూచిస్తుంది.
- source_word: ἀπομασσόμεθα
  choice: తుడిచివేస్తున్నాం
  rationale: ఈ క్రియ ప్రత్యేకంగా తుడిచి తొలగించడాన్ని సూచిస్తుంది; సంప్రదాయంగా వినిపించే ‘దులిపివేస్తున్నాం’ కంటే మూలపదానికి దగ్గరగా ఉంది.
- source_word: ὑμῖν
  choice: మీకు వ్యతిరేకంగా
  rationale: ఈ సందర్భంలో దత్తి విభక్తి ఆ చర్యను తిరస్కరించినవారికి వ్యతిరేకమైన సాక్ష్యంగా చూపే దిశను కలిగి ఉంది.
- source_word: πλήν
  choice: అయినా
  rationale: తీర్పును సూచించే చర్య జరిగినప్పటికీ తెలుసుకోవలసిన సత్యాన్ని బలంగా ముందుకు తెస్తుంది.
- source_word: γινώσκετε
  choice: తెలుసుకోండి
  rationale: వర్తమాన ఆజ్ఞార్థక రూపంలోని గుర్తించండి లేదా అంగీకరించండి అనే ప్రత్యక్ష పిలుపును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἤγγικεν
  choice: దగ్గరికి వచ్చింది
  rationale: సమీపించడం జరిగి, దాని ఫలితం కొనసాగుతోందనే పరిపూర్ణ కాల భావాన్ని వ్యక్తం చేస్తుంది; కేవలం భవిష్యత్తులో రాబోతోందని గానీ పూర్తిగా పరిపూర్ణమైందని గానీ నిర్ణయించదు.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: ప్రామాణికంగా, సులభంగా అర్థమయ్యే రూపం; దేవుని పరిపాలన భావాన్ని సందర్భంలో మోయగలదు.
theological_decisions:
- issue: ధూళిని తుడిచివేసే చర్య యొక్క భావం
  choice: తిరస్కరించిన పట్టణానికి వ్యతిరేకమైన సంకేతాత్మక సాక్ష్యం మరియు తీర్పు
  alternative: కేవలం పరిశుభ్రత లేదా ప్రయాణానికి సంబంధించిన చర్య
  rationale: ὑμῖν అనే దత్తి రూపం మరియు పరిసర మిషన్ సందర్భం ఇది సందేశాన్ని తిరస్కరించినవారికి వ్యతిరేకమైన సాక్ష్యచర్య అని సూచిస్తాయి; ‘మీకు వ్యతిరేకంగా’ ఈ భావాన్ని విస్తరించకుండా నిలుపుతుంది.
- issue: దేవుని రాజ్యం దగ్గరికి రావడం
  choice: యేసు పంపినవారి సేవ మరియు సందేశంలో దేవుని రాజ్యం దగ్గరికి వచ్చింది; అది తిరస్కరించబడిన చోట కూడా ఈ ప్రకటన నిజమే
  alternative: రాజ్యం కేవలం కాలపరంగా త్వరలో రానుంది; లేదా అది ఇప్పటికే సంపూర్ణంగా నెరవేరింది
  rationale: ἤγγικεν అనే పరిపూర్ణ రూపం చేరిన సమీపతను మరియు దాని కొనసాగుతున్న ప్రాముఖ్యతను సూచిస్తుంది; అంతిమ పరిపూర్ణతను ప్రకటించకుండా మూలంలోని అంత్యకాల ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘మీ పట్టణం నుండి మా పాదాలకు అంటుకున్న ధూళి’ అనే నిర్మాణం గ్రీకు పదక్రమంలోని అసహజతను తెలుగులో స్పష్టంగా చేస్తూనే మూల భావాన్ని కాపాడుతుంది. ‘తుడిచివేస్తున్నాం’ మూలక్రియను ఖచ్చితంగా ప్రతిబింబిస్తుంది; ‘దేవుని రాజ్యం దగ్గరికి వచ్చింది’ రాజ్య సమీపతలోని సంఘటనాత్మకతను, కొనసాగుతున్న ప్రాముఖ్యతను నిలుపుతుంది.
