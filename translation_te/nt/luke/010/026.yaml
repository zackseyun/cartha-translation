source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν πρὸς αὐτόν· Ἐν τῷ νόμῳ τί γέγραπται; πῶς ἀναγινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/026.yaml
  text: And he said to him[a], “What is written in the Law? How do you read it?”
translation:
  language: te
  text: 'అప్పుడు ఆయన అతనితో ఇలా అన్నాడు: “ధర్మశాస్త్రంలో ఏమి వ్రాయబడి ఉంది? నీవు దానిని ఎలా చదువుతావు?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు దానిని ఎలా అర్థం చేసుకుంటావు?” గ్రీకు మూలంలో అక్షరార్థంగా, “నీవు దానిని ఎలా చదువుతావు?” అని ఉంది; ఇందులో అర్థం చేసుకోవడం లేదా వ్యాఖ్యానించడం అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: అప్పుడు ఆయన
  rationale: δέ స్వల్ప కథన అనుసంధానాన్ని సూచిస్తుంది; ఇక్కడ స్పష్టమైన వ్యతిరేకతను అతిగా చూపకుండా సహజమైన తెలుగు కథన ప్రవాహానికి ‘అప్పుడు’ సరిపోతుంది. ὁ అంతర్లీన కర్తను సూచించే సర్వనామ విధిలో ఉంది.
- source_word: εἶπεν πρὸς αὐτόν
  choice: అతనితో … అని అడిగాడు
  rationale: πρός + ద్వితీయా విభక్తి సంబోధింపబడిన వ్యక్తిని చూపుతుంది. మాటలు ప్రశ్నల రూపంలో ఉన్నందున తెలుగులో ‘అడిగాడు’ సహజంగా ఉంది; అదనపు ప్రతిస్పందన భావాన్ని చేర్చలేదు.
- source_word: Ἐν τῷ νόμῳ
  choice: ధర్మశాస్త్రంలో
  rationale: νόμος ఇక్కడ ఇశ్రాయేలుకు ఇవ్వబడిన, ఆ ధర్మశాస్త్ర నిపుణుడు గుర్తించిన లిఖిత ధర్మశాస్త్రాన్ని సూచిస్తుంది. ‘ధర్మశాస్త్రం’ ఆధునిక ప్రామాణిక తెలుగులో ఆ ప్రత్యేక గ్రంథసముదాయాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τί γέγραπται
  choice: ఏమి వ్రాయబడి ఉంది
  rationale: పూర్ణ వర్తమాన కర్మణి రూపం γέγραπται వ్రాయబడినది ఇప్పటికీ లిఖితంగా నిలిచి ఉన్న స్థితిని సూచిస్తుంది; ఈ తెలుగు రూపం దానిని సహజంగా నిలుపుతుంది.
- source_word: πῶς
  choice: ఎలా
  rationale: πῶς పద్ధతి లేదా అవగాహనను ప్రశ్నిస్తుంది; ‘ఎలా’ దాని విస్తృతతను నిలుపుతుంది.
- source_word: ἀναγινώσκεις
  choice: చదువుతున్నావు
  rationale: ἀναγινώσκω యొక్క ప్రాథమిక అర్థం ‘చదువు.’ సందర్భంలో అర్థం చేసుకోవడం లేదా వ్యాఖ్యానించడం అనే ఛాయ ఉండవచ్చు; ప్రధాన పాఠంలో మూల క్రియను నిలిపి, ఆ ఛాయను పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: νόμος యొక్క సందర్భార్థం
  choice: ఇశ్రాయేలుకు ఇవ్వబడిన గుర్తింపు పొందిన లిఖిత ధర్మశాస్త్రాన్ని సూచించే ‘ధర్మశాస్త్రం’
  alternative: ‘తోరా’ లేదా సాధారణ అర్థంలోని ‘చట్టం’
  rationale: ద్వితీయ దేవాలయ యూదా సందర్భంలో ఇది ధర్మశాస్త్ర నిపుణునితో జరిగిన సంభాషణ. ‘ధర్మశాస్త్రం’ మూలంలోని ప్రత్యేక శాస్త్రసూచనను నిలుపుతూ, అనవసరంగా సంకుచితం చేయదు.
- issue: πῶς ἀναγινώσκεις లోని వ్యాఖ్యాన ఛాయ
  choice: ప్రధాన పాఠంలో ‘నీవు దానిని ఎలా చదువుతున్నావు?’
  alternative: ‘దానిని నీవు ఎలా అర్థం చేసుకుంటున్నావు?’
  rationale: ప్రశ్న కేవలం శబ్దపఠనం కాక అవగాహనను కూడా పరీక్షించవచ్చు; అయినా మూల క్రియ ప్రత్యక్షంగా ‘చదువు’ అని ఉంది. కాబట్టి ఆ వాక్యంలోని ఉద్దేశపూర్వక విస్తృతతను పరిష్కరించకుండా ప్రధాన పాఠంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘వ్రాయబడి’ అనే రూపం లిఖిత శాస్త్ర స్వభావాన్ని స్పష్టంగా ఉంచుతుంది; ‘చదువుతున్నావు’ మూలంలోని వర్తమాన రూపాన్నీ వ్యాఖ్యాన సంబంధమైన సందిగ్ధతనూ కాపాడుతుంది.
