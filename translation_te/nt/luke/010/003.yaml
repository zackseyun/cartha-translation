- from: వెళ్లండి; ఇదిగో, తోడేళ్ల మధ్యకు గొర్రెపిల్లలవలె మిమ్మల్ని పంపుతున్నాను.
  to: వెళ్లండి; ఇదిగో, నేను మిమ్మల్ని తోడేళ్ల మధ్యలో గొర్రెపిల్లల్లా పంపుతున్నాను.
  rationale: 'A single spatial correction changes “మధ్యకు” to locative “మధ్యలో,” preserving the force of ἐν μέσῳ. The revised wording retains the plural command, the discourse-alerting “ἰδού,” the ongoing present ‘I am sending,’ and the lambs-versus-wolves simile in idiomatic modern Telugu. No footnote is needed: the English audit-trail footnotes concern English wording and have no corresponding ambiguity requiring a Telugu anchor.'
