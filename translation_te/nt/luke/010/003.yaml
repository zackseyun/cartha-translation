id: LUK.10.3
reference: Luke 10:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑπάγετε· ⸀ἰδοὺ ἀποστέλλω ὑμᾶς ὡς ἄρνας ἐν μέσῳ λύκων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/003.yaml
  text: Go[a]; behold[b], I am sending you out as lambs in the midst of wolves.
translation:
  language: te
  text: వెళ్లండి; ఇదిగో, నేను మిమ్మల్ని తోడేళ్ల మధ్యలో గొర్రెపిల్లల్లా పంపుతున్నాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπάγετε
  choice: వెళ్లండి
  rationale: బహువచన ఆజ్ఞను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: తరువాత చెప్పబోయే గంభీరమైన విషయంపై శ్రద్ధ మళ్లించే సూచనార్థక అవ్యయ బలాన్ని నిలుపుతుంది.
- source_word: ἀποστέλλω ὑμᾶς
  choice: మిమ్మల్ని పంపుతున్నాను
  rationale: వర్తమానకాల క్రియను, బహువచన కర్మ సర్వనామాన్ని సహజమైన తెలుగు క్రమంలో ప్రతిబింబిస్తుంది; సందర్భమే పంపబడుతున్న కార్యాన్ని స్పష్టం చేస్తుంది.
- source_word: ὡς
  choice: వలె
  rationale: ఇది తాదాత్మ్యం కాక ఉపమానం అని స్పష్టంగా నిలుపుతుంది.
- source_word: ἄρνας
  choice: గొర్రెపిల్లలు
  rationale: గ్రీకు పదం సాధారణంగా గొర్రెలను కాక ప్రత్యేకంగా గొర్రెపిల్లలను సూచిస్తుంది; బలహీనత, ప్రమాదానికి లోనయ్యే స్థితి అనే చిత్రణను కాపాడుతుంది.
- source_word: ἐν μέσῳ λύκων
  choice: తోడేళ్ల మధ్యకు
  rationale: ‘తోడేళ్ల మధ్యలో’ అనే స్థలార్థాన్ని నిలుపుతూ, పంపే గమనానికి అనుగుణంగా తెలుగులో సహజమైన ‘మధ్యకు’ రూపాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: శిష్యుల పంపకంలోని జంతు ఉపమానం
  choice: ‘తోడేళ్ల మధ్యకు గొర్రెపిల్లలవలె’ అని నిర్దిష్ట ఉపమానాన్ని నిలుపడం
  alternative: ‘తోడేళ్ల మధ్యకు గొర్రెలవలె’
  rationale: మూలంలోని ἄρνας అంటే ‘గొర్రెపిల్లలు’; దాన్ని సాధారణ ‘గొర్రెలు’గా మార్చడం సమాంతర వాక్యాలతో అనవసర సమన్వయం చేసి, ఇక్కడి తీవ్రమైన బలహీనత చిత్రాన్ని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవబహువచన ఆజ్ఞారూపం సందర్భంలోని సమూహ సంబోధనకు సరిపోతుంది. ‘ఇదిగో’ గంభీరతను కాపాడుతూనే పాతబడిన శైలిని నివారిస్తుంది. మూలంలో లేని పాదసూచికలను చేర్చలేదు; అందువల్ల ప్రధాన పాఠ్యంలో సూచికలు లేవు.
