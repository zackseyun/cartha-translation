id: LUK.10.40
reference: Luke 10:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ δὲ Μάρθα περιεσπᾶτο περὶ πολλὴν διακονίαν· ἐπιστᾶσα δὲ εἶπεν· Κύριε, οὐ μέλει σοι ὅτι ἡ ἀδελφή μου μόνην με ⸀κατέλειπεν διακονεῖν; ⸀εἰπὲ οὖν αὐτῇ ἵνα μοι συναντιλάβηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/040.yaml
  text: But Martha was distracted with much serving. And she came up and said[a], “Lord, does it not matter to you that my sister has left me to serve alone? Tell her, then, to help me.”
translation:
  language: te
  text: అయితే మార్త అనేక సేవల వల్ల పరధ్యానంలో పడింది. ఆమె దగ్గరకు వచ్చి, “ప్రభువా, నా సహోదరి సేవ చేయడానికి నన్ను ఒంటరిగా వదిలేసిన సంగతి నీకు పట్టదా?[a] కాబట్టి నాకు సహాయం చేయమని ఆమెకు చెప్పు” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా సహోదరి సేవ చేయడం అంతా నాకొక్కదానికే వదిలేసిన సంగతి నీకు పట్టదా?”
    reason: μόνην με κατέλειπεν διακονεῖνలోని ‘నన్ను ఒంటరిగా సేవ చేయడానికి వదిలింది’ అనే భావాన్ని సహజమైన ప్రత్యామ్నాయ పదక్రమంలో తెలియజేస్తుంది.
lexical_decisions:
- source_word: περιεσπᾶτο
  choice: పరధ్యానానికి గురైంది
  rationale: ఈ అసంపూర్ణ భూతకాల క్రియ ఆమె కొంతసేపుగా అనేక పనులవైపు లాగబడుతూ, దృష్టి చెదరిన స్థితిలో ఉన్నదని సూచిస్తుంది. ‘పరధ్యానానికి గురైంది’ సందర్భంలోని మరియ దృష్టితో ఉన్న వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: περὶ πολλὴν διακονίαν
  choice: ఎంతో సేవ చేయడంలో
  rationale: ఇక్కడ διακονία అధికారిక పరిచర్యకన్నా ఇంటి సందర్భంలో చేసే ఆచరణాత్మక సేవను సూచిస్తుంది. ‘ఎంతో సేవ చేయడంలో’ అనే రూపం ‘అనేక ఏర్పాట్లు’ అని పరిధిని అనవసరంగా కుదించదు.
- source_word: ἐπιστᾶσα
  choice: దగ్గరకు వచ్చి
  rationale: మాట్లాడే ముందు ఆమె సమీపించిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: యేసును గౌరవంగా సంబోధించే κύριεకు ప్రామాణికమైన తెలుగు రూపం; లూకా రచనలోని విస్తృత ప్రయోగాన్నీ నిలుపుతుంది.
- source_word: οὐ μέλει σοι
  choice: నీకు పట్టదా?
  rationale: ఏదైనా ఒకరికి శ్రద్ధకు లేదా ఆందోళనకు సంబంధించిన విషయమా అని అడిగే గ్రీకు నుడికారాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μόνην με κατέλειπεν διακονεῖν
  choice: సేవ చేయడానికి నన్ను ఒంటరిగా వదిలేసిన
  rationale: μόνηνలోని ‘ఒంటరిగా’ అనే భావాన్నీ, διακονεῖνలోని సేవ చేసే భావాన్నీ రెండింటినీ నిలుపుతుంది; ‘నన్ను విడిచిపెట్టింది’ అనే మరింత తీవ్రమైన భావాన్ని రుద్దదు.
- source_word: εἰπὲ οὖν αὐτῇ
  choice: కాబట్టి ... ఆమెకు చెప్పు
  rationale: ఆజ్ఞలోని సూటితనంతో పాటు οὖν సూచించే నిర్ధారణాత్మక సంబంధాన్ని నిలుపుతుంది.
- source_word: συναντιλάβηται
  choice: నాకు సహాయం చేయమని
  rationale: తనతో కలిసి పనిలో పాలుపంచుకొని సహాయపడాలనే భావాన్ని సందర్భంలో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యేసును సంబోధించేటప్పుడు κύριος పదం అనువాదం
  choice: ప్రభువా
  alternative: బోధకుడా / యజమానీ
  rationale: ఈ సందర్భంలో ‘ప్రభువా’ గౌరవ సంబోధనను, అలాగే లూకా సువార్తలో యేసుకు వాడే విస్తృత బిరుదుతో సంబంధాన్ని కాపాడుతుంది; ఒక నిర్దిష్ట సిద్ధాంతార్థాన్ని అదనంగా రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవభరితమైన కథన శైలి వాడబడింది. ‘పరధ్యానానికి గురైంది’ మూలంలోని దృష్టి చెదరిన భావాన్ని కాపాడుతుంది; ‘ఎంతో సేవ’ గృహసేవను కేవలం భోజన ఏర్పాట్లకే పరిమితం చేయదు.
