  terminology: ‘ఆత్మలు’ correctly avoids over-specifying πνεύματα as demons or evil spirits. ‘పరలోకాల్లో’ is understandable biblical Telugu and faithfully reflects the Greek plural. The footnote gives the traditional singular alternative without displacing the source-based main rendering.
