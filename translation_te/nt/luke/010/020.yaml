  source_fidelity: The Telugu accurately preserves the corrective contrast of πλὴν, the paired prohibitive and positive imperatives, the unqualified wording ‘ఆత్మలు’ for τὰ πνεύματα, their present submission, and the perfect-passive sense that the disciples’ names stand written. ‘పరలోకాల్లో’ appropriately retains the plural οὐρανοῖς without importing a narrower doctrinal formulation.
