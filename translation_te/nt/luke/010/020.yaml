id: LUK.10.20
reference: Luke 10:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πλὴν ἐν τούτῳ μὴ χαίρετε ὅτι τὰ πνεύματα ὑμῖν ὑποτάσσεται, χαίρετε δὲ ὅτι τὰ ὀνόματα ὑμῶν ⸀ἐγγέγραπται ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/020.yaml
  text: Nevertheless[a], do not rejoice in this, that the spirits submit to you[c][b], but rejoice that your names have been written in the heavens.
translation:
  language: te
  text: అయితే, ఆత్మలు మీకు లోబడుతున్నాయని సంతోషించకండి; మీ పేర్లు పరలోకాల్లో రాయబడి ఉన్నాయని సంతోషించండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పరలోకాల్లో’ అని ఉన్న గ్రీకు పదం బహువచనంలో ఉంది; సంప్రదాయంగా ‘పరలోకంలో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: అయితే
  rationale: శిష్యుల సంతోషాన్ని పూర్తిగా తిరస్కరించకుండా, దాని అసలు ఆధారాన్ని సరిచేసే బలమైన వ్యతిరేక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν τούτῳ
  choice: …అని
  rationale: తెలుగులో సంతోషానికి కారణాన్ని ఉద్ధరణార్థక ‘అని’ నిర్మాణంతో చెప్పడం సహజం; గ్రీకు ‘ఇందులో’ అనే సూచనార్థాన్ని కారణవాక్యంలో నిలుపుతుంది.
- source_word: μὴ χαίρετε ... χαίρετε δὲ
  choice: సంతోషించకండి … సంతోషించండి
  rationale: ఒకే క్రియను పునరావృతం చేసి మూలంలోని ఆజ్ఞారూప విరుద్ధ సమాంతరతను కాపాడుతుంది.
- source_word: τὰ πνεύματα
  choice: ఆత్మలు
  rationale: సందర్భం విరోధి ఆత్మసంబంధ జీవులను సూచించినా, మూలపదం కేవలం ‘ఆత్మలు’ అని ఉన్నందున ‘దయ్యాలు’ లేదా ‘దురాత్మలు’ అని అతిగా నిర్దిష్టీకరించలేదు.
- source_word: ὑμῖν ὑποτάσσεται
  choice: మీకు లోబడుతున్నాయి
  rationale: ప్రస్తుతకాలంలోని లోబాటు భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τὰ ὀνόματα ὑμῶν
  choice: మీ పేర్లు
  rationale: గ్రీకు సంబంధబోధక నిర్మాణానికి సహజమైన తెలుగు స్వామ్యరూపం.
- source_word: ἐγγέγραπται
  choice: రాయబడి ఉన్నాయి
  rationale: పూర్తయిన కార్యం ఇప్పటికీ ఫలితస్థితిలో ఉందనే గ్రీకు పరిపూర్ణకాల భావాన్ని కాపాడుతుంది.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: పరలోకాల్లో
  rationale: οὐρανοῖς యొక్క బహువచన రూపాన్ని నిలుపుతూ, ఆధునిక తెలుగు బైబిలు వాడుకలో అర్థమయ్యే విధంగా అనువదిస్తుంది.
theological_decisions:
- issue: పేర్లు నమోదై ఉన్న స్థలం
  choice: పరలోకాల్లో
  alternative: పరలోకంలో
  rationale: గ్రీకు మూలంలోని బహువచనాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సంప్రదాయ ఏకవచనంతో దాన్ని సమతలీకరించలేదు.
- issue: ఆత్మల స్వభావం
  choice: ఆత్మలు
  alternative: దురాత్మలు / దయ్యాలు
  rationale: సందర్భం విరోధి ఆత్మలను సూచిస్తుంది; అయినా ఈ వచనంలోని πνεύματα స్వయంగా ఆ ప్రత్యేకణను ఇవ్వనందున విస్తృత పదాన్నే నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు, స్పష్టమైన విరుద్ధ సమాంతర నిర్మాణం. మూలంలోని ‘ఆత్మలు’ అనే విస్తృత పదాన్నీ, ‘పరలోకాలు’ అనే బహువచనాన్నీ నిలిపింది.
