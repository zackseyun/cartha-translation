revisions:
- from: 'ఆయన శిష్యులవైపు తిరిగి, వారితో ఏకాంతంగా[a] ఇలా అన్నాడు: “మీరు చూస్తున్నవాటిని చూసే కళ్లు ధన్యమైనవి.”'
  to: 'ఆయన శిష్యులవైపు తిరిగి, వారితో ప్రత్యేకంగా అన్నాడు: “మీరు చూస్తున్నవాటిని చూసే కళ్లు ధన్యమైనవి.”'
  rationale: The revision removes the small added force of ‘ఇలా’ and uses ‘ప్రత్యేకంగా’ to express κατ’ ἰδίαν naturally and without over-specifying the social setting. The footnote retains the valid alternative ‘ఏకాంతంగా.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:43:08Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the aorist participle ('turning'), the address to the disciples, the private/apart setting, and the beatitude concerning the eyes that see what the disciples see. ‘మీరు చూస్తున్నవాటిని’ appropriately preserves the present, plural sense of ἃ βλέπετε.
  naturalness: The Telugu is generally modern and natural. Omitting ‘ఇలా’ makes the speech introduction more direct, since the Greek has only ‘he said.’ ‘ప్రత్యేకంగా’ is a clearer modern rendering for the private/apart sense than a wording that could suggest being alone in a stricter sense.
  terminology: ‘శిష్యులు,’ ‘ధన్యమైనవి,’ and ‘కళ్లు’ are appropriate standard renderings. ‘ధన్యమైనవి’ retains the beatitude force without importing an explanation.
  issues:
  - severity: low
    issue: ‘ఇలా అన్నాడు’ adds a demonstrative element not expressed in the Greek.
    rationale: εἶπεν simply introduces the quotation. Telugu can naturally use ‘అన్నాడు:’ without adding ‘ఇలా.’
  - severity: low
    issue: The footnote alternative ‘వారితో ఒంటరిగా’ may imply a more strictly alone-with-them setting.
    rationale: κατ’ ἰδίαν means apart from others/privately; ‘ప్రత్యేకంగా’ better preserves this without narrowing the setting.
  revised_text: 'ఆయన శిష్యులవైపు తిరిగి, వారితో ప్రత్యేకంగా అన్నాడు: “మీరు చూస్తున్నవాటిని చూసే కళ్లు ధన్యమైనవి.”'
  revised_footnotes:
  - marker: a
    text: లేదా “ఏకాంతంగా.”
    reason: κατ’ ἰδίαν అంటే ఇతరుల నుండి వేరుగా, వ్యక్తిగతంగా లేదా ప్రత్యేకంగా అనే భావం; సందర్భాన్ని బట్టి ‘ఏకాంతంగా’ కూడా అనవచ్చు.
  revision_rationale: The revision removes the small added force of ‘ఇలా’ and uses ‘ప్రత్యేకంగా’ to express κατ’ ἰδίαν naturally and without over-specifying the social setting. The footnote retains the valid alternative ‘ఏకాంతంగా.’
