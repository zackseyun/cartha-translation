id: LUK.10.23
reference: Luke 10:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ στραφεὶς πρὸς τοὺς μαθητὰς κατ’ ἰδίαν εἶπεν· Μακάριοι οἱ ὀφθαλμοὶ οἱ βλέποντες ἃ βλέπετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/023.yaml
  text: And turning to the disciples privately[a], he said, “Blessed are the eyes that see what you see.”
translation:
  language: te
  text: 'ఆయన శిష్యులవైపు తిరిగి, వారితో ప్రత్యేకంగా అన్నాడు: “మీరు చూస్తున్నవాటిని చూసే కళ్లు ధన్యమైనవి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στραφεὶς
  choice: తిరిగి
  rationale: మాట్లాడే ముందు యేసు శిష్యులవైపు తిరిగిన చర్యను సహజమైన తెలుగు క్రియారూపంలో తెలియజేస్తుంది; గ్రీకు భూతకాల అసమాపక క్రియ యొక్క అనుసంధానాన్ని నిలుపుతుంది.
- source_word: πρὸς τοὺς μαθητὰς
  choice: శిష్యులవైపు
  rationale: πρός సూచించే దిశను స్పష్టంగా ఉంచుతూ, μαθητάς‌కు స్థిరమైన మరియు సహజమైన తెలుగు పదమైన ‘శిష్యులు’ను వాడుతుంది.
- source_word: κατ’ ἰδίαν
  choice: వారితో ఏకాంతంగా
  rationale: ఇతరుల నుండి వేరుగా శిష్యులతో చెప్పిన భావాన్ని సహజంగా వ్యక్తపరుస్తుంది. ‘ఏకాంతంగా’ ఒక్కటే వాడితే ఎవరు ఏకాంతంగా ఉన్నారనే స్వల్ప అస్పష్టత రావచ్చు కాబట్టి ‘వారితో’ చేర్చబడింది.
- source_word: Μακάριοι
  choice: ధన్యమైనవి
  rationale: ఇది కేవలం భావోద్వేగ సంతోషాన్ని కాక, ప్రత్యేక అనుగ్రహం పొందిన స్థితిని ప్రకటించే ధన్యతావచనం; ‘ధన్యమైనవి’ ఆ బరువును నిలుపుతుంది.
- source_word: οἱ ὀφθαλμοὶ οἱ βλέποντες
  choice: చూసే కళ్లు
  rationale: గ్రీకులోని ‘కళ్లు’ అనే సజీవమైన లక్షణార్థక రూపకాన్ని వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: ἃ βλέπετε
  choice: మీరు చూస్తున్నవాటిని
  rationale: వర్తమాన దృశ్యానుభవాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, గ్రీకు సంబంధసర్వనామ నిర్మాణంలోని బహువచన భావాన్ని ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ధన్యతావచనం యొక్క భావబలం
  choice: శిష్యులు చూస్తున్న వాటిని చూడగలిగిన కళ్లు ధన్యమైనవని ప్రకటించడం
  alternative: కేవలం ఆ కళ్లు సంతోషంగా లేదా అదృష్టవంతంగా ఉన్నాయని చెప్పడం
  rationale: μακάριοι ఇక్కడ దేవుని కార్యాలు మరియు ప్రత్యక్షతను చూడటానికి లభించిన ప్రత్యేక అనుగ్రహస్థితిని సూచించే ధన్యతావచనం. అయితే ఆ కార్యాలు ఏమిటో ఈ వచనంలోనే వివరించి జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘చూసే కళ్లు’ అనే మూలభాషా రూపకం అలాగే నిలుపబడింది; అనవసరమైన సిద్ధాంత వివరణ చేర్చబడలేదు.
