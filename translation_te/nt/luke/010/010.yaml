  text: εἰς ἣν δ’ ἂν πόλιν ⸀εἰσέλθητε καὶ μὴ δέχωνται ὑμᾶς, ἐξελθόντες εἰς τὰς πλατείας αὐτῆς εἴπατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/010.yaml
  text: But whatever city you enter and they do not receive you[a], go out into its streets and say,
translation:
  language: te
  text: 'అయితే మీరు ఏ పట్టణంలోనైనా ప్రవేశించి, అక్కడివారు మిమ్మల్ని స్వీకరించకపోతే, బయటకు వచ్చి ఆ పట్టణంలోని వీధుల్లో[a] ఇలా చెప్పండి:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బహిరంగ విశాల వీధుల్లో’ లేదా ‘ప్రజలు చేరే తెరచిన స్థలాల్లో.’ గ్రీకు πλατεῖαι ప్రజలకు అందుబాటులో ఉండే విశాల వీధులు లేదా బహిరంగ స్థలాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν
  choice: అయితే మీరు ఏ పట్టణంలో ... -ినా
  rationale: ἄνతో కూడిన సంబంధవాచక నిర్మాణం నిర్దిష్టం కాని, సాధారణంగా ఎదురయ్యే ఏ సందర్భాన్నైనా సూచిస్తుంది. తెలుగులో ‘ఏ పట్టణంలో ... -ినా’ ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἰσέλθητε
  choice: ప్రవేశించినా
  rationale: షరతుతో కూడిన సంబంధవాచక వాక్యంలో ఉన్న aorist subjunctive. ‘ప్రవేశించినా’ పట్టణంలోకి వెళ్లే భావాన్నీ, అనిర్దిష్ట షరతునూ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: μὴ δέχωνται ὑμᾶς
  choice: అక్కడివారు మిమ్మల్ని స్వీకరించకపోతే
  rationale: δέχομαι ఇక్కడ పంపబడిన వారిని అంగీకరించి ఆహ్వానించే విస్తృత భావాన్ని కలిగి ఉంది. ‘స్వీకరించు’ ఆ విస్తృతిని నిలుపుతుంది; వ్యక్తుల కర్తను తెలుగులో స్పష్టంచేయడానికి ‘అక్కడివారు’ వాడబడింది.
- source_word: ἐξελθόντες
  choice: వెళ్లి
  rationale: ఈ participle ప్రధాన ఆజ్ఞ అయిన εἴπατεకు ముందు జరిగే అనుబంధ చర్యను సూచిస్తుంది. తెలుగులో ‘వెళ్లి ... చెప్పండి’ సహజంగా క్రమాన్ని నిలుపుతుంది.
- source_word: τὰς πλατείας αὐτῆς
  choice: దాని బహిరంగ వీధుల్లోకి
  rationale: πλατεῖαι విశాలమైన, ప్రజలు చేరే బహిరంగ వీధులు లేదా చౌరస్తాలను సూచించగలదు. ‘బహిరంగ వీధులు’ ప్రకటన జరిగే ప్రజాస్థల భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: εἴπατε
  choice: ఇలా చెప్పండి
  rationale: λέγω యొక్క aorist imperativeను నేరుగా ఆజ్ఞగా అనువదించాం. తరువాతి వచనంలోని ఉద్ధరణను పరిచయం చేయడానికి తెలుగులో ‘ఇలా’ సహజంగా అవసరం.
