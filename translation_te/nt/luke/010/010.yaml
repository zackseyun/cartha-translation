  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. మూలంలోని అనిర్దిష్ట షరతు, చర్యల క్రమం, ప్రజలకు వినిపించే స్థల భావం నిలుపబడ్డాయి.
