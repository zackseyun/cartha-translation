id: LUK.10.5
reference: Luke 10:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν ⸂εἰσέλθητε οἰκίαν⸃ πρῶτον λέγετε· Εἰρήνη τῷ οἴκῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/005.yaml
  text: Into whatever house you enter[a], first say, ‘Peace to this house.’
translation:
  language: te
  text: మీరు ఏ ఇంట్లోకి ప్రవేశించినా, మొదట ‘ఈ ఇంటికి శాంతి కలుగుగాక’ అని చెప్పండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ ఇంటికి శాంతి.’ గ్రీకులో ఇది క్రియలేని సంక్షిప్త ఆశీర్వాద సూత్రం.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν ... οἰκίαν
  choice: మీరు ఏ ఇంట్లోకి ... అయినా
  rationale: εἰς యొక్క దిశార్థాన్ని ‘ఇంట్లోకి’ నిలుపుతుంది; ἣν ... ἂν తెలిపే అనిర్దిష్ట భావాన్ని ‘ఏ ... అయినా’ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰσέλθητε
  choice: ప్రవేశించినా
  rationale: ἄνతో కూడిన అనిర్దిష్ట సంబంధ వాక్యంలో ఉన్న ఏఓరిస్ట్ సబ్జంక్టివ్ సాధారణంగా భవిష్యద్ముఖ సందర్భాన్ని సూచిస్తుంది; ‘ప్రవేశించినా’ ఆ భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: οἰκίαν / οἴκῳ
  choice: ఇంటి / ఇంటికి
  rationale: ఈ సందర్భంలో నివాసస్థలమే ప్రధానార్థం. గ్రీకులోని οἰκία మరియు οἶκος మధ్య పదభేదాన్ని తెలుగులో బలవంతంగా చూపకుండా, సందర్భానుకూలంగా ఒకే సహజ పదాన్ని వాడింది.
- source_word: πρῶτον
  choice: మొదట
  rationale: ఇంట్లోకి ప్రవేశించిన తరువాత చేయవలసిన మొదటి కార్యాన్ని సూచించే క్రమప్రాధాన్యాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: λέγετε
  choice: చెప్పండి
  rationale: వర్తమాన ఆజ్ఞారూపంలోని నిర్దేశాన్ని సహజమైన గౌరవ బహువచన ఆజ్ఞగా వ్యక్తం చేస్తుంది.
- source_word: Εἰρήνη τῷ οἴκῳ τούτῳ
  choice: ఈ ఇంటికి శాంతి కలుగుగాక
  rationale: దత్తివిభక్తి ద్వారా సూచితమైన గ్రహీతను ‘ఈ ఇంటికి’గా చూపి, క్రియలేని సంక్షిప్త గ్రీకు ఆశీర్వాద సూత్రంలోని ఆశీర్వచన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: శాంతి పలుకుబడి స్వభావం
  choice: ‘ఈ ఇంటికి శాంతి కలుగుగాక’ అనే పలికే ఆశీర్వాదంగా అనువదించడం
  alternative: ‘ఈ ఇంటికి శాంతి’ అని గ్రీకు నిర్మాణాన్ని మరింత సంక్షిప్తంగా ఉంచడం
  rationale: ఇది కేవలం సాధారణ అభివాదం మాత్రమే కాక, ఇంటిమీద శాంతిని పలికే ఆశీర్వచన సూత్రం. ‘కలుగుగాక’ గ్రీకులో స్పష్టంగా లేని క్రియను అర్థపూరణగా ఇస్తున్నప్పటికీ, తెలుగులో ఆ సూత్రం యొక్క కార్యసాధక ఆశీర్వాద భావాన్ని సహజంగా నిలుపుతుంది; పాదసూచిక మూలంలోని సంక్షిప్తతను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన శైలి. ‘ఇంట్లోకి’ ద్వారా దిశార్థం, ‘కలుగుగాక’ ద్వారా సహజమైన ఆశీర్వచన భావం నిలుపబడ్డాయి.
