id: LUK.10.35
reference: Luke 10:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὴν ⸀αὔριον ἐκβαλὼν ⸂δύο δηνάρια ἔδωκεν⸃ τῷ πανδοχεῖ καὶ ⸀εἶπεν· Ἐπιμελήθητι αὐτοῦ, καὶ ὅ τι ἂν προσδαπανήσῃς ἐγὼ ἐν τῷ ἐπανέρχεσθαί με ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/035.yaml
  text: And on the next day[a], taking out two denarii, he gave them to the innkeeper and said, ‘Take care of him, and whatever more you spend, I will repay you when I return.’
translation:
  language: te
  text: మరుసటి రోజు అతడు రెండు దేనారాలు[a] తీసి సత్రం నిర్వాహకునికి ఇచ్చి, ‘ఇతన్ని జాగ్రత్తగా చూసుకో. నీవు అదనంగా ఎంత ఖర్చు చేసినా, నేను తిరిగి వచ్చినప్పుడు నీకు చెల్లిస్తాను’ అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: దేనారం ప్రామాణిక రోమా వెండి నాణెం; అది సుమారుగా ఒక కూలీ ఒక రోజు వేతనానికి సమానం.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπὶ τὴν αὔριον
  choice: మరుసటి రోజు
  rationale: తరువాతి రోజును సూచించే గ్రీకు కాలవ్యక్తీకరణను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἐκβαλών
  choice: తీసి
  rationale: ఇక్కడ తన దగ్గరున్న నాణేలను బయటకు తీసిన చర్యను సూచిస్తుంది; మూల క్రియకు ఇతర సందర్భాల్లో ఉండే బలమైన అర్థాన్ని అనవసరంగా రుద్దదు.
- source_word: δύο δηνάρια
  choice: రెండు దేనారాలు
  rationale: చారిత్రక నాణెం పేరును అనువాదంలో నిలుపుతుంది; దాని విలువను వ్యాఖ్యానాత్మకంగా పాఠ్యంలో మార్చదు.
- source_word: πανδοχεῖ
  choice: సత్రం నిర్వాహకునికి
  rationale: వసతి స్థలాన్ని నిర్వహించే వ్యక్తినే సూచిస్తుంది. ఆధునిక పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన పదబంధం.
- source_word: Ἐπιμελήθητι αὐτοῦ
  choice: ఇతన్ని జాగ్రత్తగా చూసుకో
  rationale: శ్రద్ధతో సంరక్షించాలనే ఆజ్ఞార్థక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὅ τι ἂν προσδαπανήσῃς
  choice: నీవు అదనంగా ఎంత ఖర్చు చేసినా
  rationale: ఇప్పటికే ఇచ్చిన మొత్తానికి మించి అయ్యే అనిర్దిష్ట వ్యయాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐν τῷ ἐπανέρχεσθαί με
  choice: నేను తిరిగి వచ్చినప్పుడు
  rationale: గ్రీకు ఆర్టిక్యులర్ ఇన్ఫినిటివ్‌లోని కాలసంబంధ భావాన్ని సహజమైన తెలుగు ఉపవాక్యంగా అందిస్తుంది.
- source_word: ἀποδώσω σοι
  choice: నీకు చెల్లిస్తాను
  rationale: అదనంగా ఖర్చైన మొత్తాన్ని తిరిగి చెల్లిస్తాననే ఆర్థిక సందర్భార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
