  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. చారిత్రక నాణెం పేరును నిలిపి, దాని సాంస్కృతిక విలువను పాదసూచికలో వివరించాం. ప్రధాన పాఠ్యంలోని [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోతుంది.
