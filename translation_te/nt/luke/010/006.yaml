id: LUK.10.6
reference: Luke 10:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸂ᾖ ἐκεῖ⸃ υἱὸς εἰρήνης, ἐπαναπαήσεται ἐπ’ αὐτὸν ἡ εἰρήνη ὑμῶν· εἰ δὲ μήγε, ἐφ’ ὑμᾶς ἀνακάμψει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/006.yaml
  text: And if a son of peace is there[a], your peace will rest upon him; but if not, it will return to you.
translation:
  language: te
  text: అక్కడ శాంతి కుమారుడు ఉంటే[a], మీ శాంతి అతనిపై విశ్రమిస్తుంది; లేకపోతే, అది మీ దగ్గరికి తిరిగి వస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శాంతిగల వ్యక్తి’ లేదా ‘శాంతిని స్వీకరించే వ్యక్తి’—అంటే, శాంతిని తీసుకొచ్చే సందేశాన్ని స్వీకరించేవాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱὸς εἰρήνης
  choice: శాంతిపుత్రుడు
  rationale: గ్రీకు వచనంలోని సెమిటిక్ శైలిగల ‘శాంతి కుమారుడు’ అనే పురుష ఏకవచన నుడికారాన్ని సంక్షిప్తంగా నిలుపుతుంది. ఇది శాంతి లక్షణం గలవాడిని లేదా శాంతిని మోసుకొచ్చే సందేశాన్ని స్వీకరించేవాడిని సూచిస్తుంది; అర్థస్పష్టత కోసం పాదసూచిక ఇచ్చాం.
- source_word: ἐπαναπαήσεται
  choice: నిలిచి ఉంటుంది
  rationale: ఎవరిమీదనైనా వచ్చి విశ్రమించడం లేదా నిలిచి ఉండడం అనే చిత్రాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἡ εἰρήνη ὑμῶν
  choice: మీ శాంతి
  rationale: శిష్యులు పలికిన శాంతి అభివాదం లేదా ఆశీర్వాదాన్ని సూచించే గ్రీకు ప్రత్యక్ష స్వామ్య నిర్మాణాన్ని అలాగే ఉంచుతుంది.
- source_word: μήγε
  choice: లేకపోతే
  rationale: బలపరచబడిన ప్రతికూల షరతును సహజమైన తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνακάμψει
  choice: తిరిగి వస్తుంది
  rationale: విశ్రమించే స్థానం దొరకని శాంతి పలికినవారి దగ్గరికి తిరిగి రావడం అనే భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐφ’ ὑμᾶς
  choice: మీ దగ్గరికి
  rationale: అక్షరార్థంగా ‘మీపై’ అయినప్పటికీ, ‘తిరిగి వస్తుంది’ అనే క్రియతో ‘మీ దగ్గరికి’ తెలుగు వాడుకలో సహజంగా ఉండి మూలార్థాన్ని కాపాడుతుంది.
- source_word: καὶ ἐὰν ᾖ ἐκεῖ
  choice: అక్కడ ... ఉంటే
  rationale: షరతుతోపాటు ἐκεῖ లోని స్థాన ప్రాధాన్యాన్ని నిలుపుతుంది. ముందరి వాక్యంతో కలిపే καί పద్య విభజనలో తెలుగులో తప్పనిసరి కాకపోవడంతో ప్రత్యేకంగా ‘మరియు’ అని పెట్టలేదు.
theological_decisions:
- issue: υἱὸς εἰρήνης అనే పురుషలింగ నుడికారాన్ని భావానువాదంతో లింగతటస్థం చేయాలా
  choice: ప్రధాన పాఠంలో ‘శాంతిపుత్రుడు’ అని నుడికారాన్ని నిలుపడం
  alternative: ‘శాంతిని స్వీకరించే వ్యక్తి’ లేదా ‘శాంతిగల వ్యక్తి’
  rationale: మూలంలోని పురుష ఏకవచన రూపాన్నీ సెమిటిక్ నుడికారాన్నీ కాపాడుతూ, అది కేవలం జీవశాస్త్రీయ కుమారత్వాన్ని సూచిస్తుందనే అపార్థం రాకుండా పాదసూచికలో భావాన్ని వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘శాంతిపుత్రుడు’ మూలభాషా నుడికారాన్ని కాపాడుతుంది; పాదసూచిక దాని ఉద్దేశిత భావాన్ని వివరిస్తుంది.
