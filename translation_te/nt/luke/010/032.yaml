    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: అలాగే
  rationale: ముందటి యాజకుని చర్యతో లేవీయుని చర్యను పోల్చే భావాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: —
  rationale: ఇక్కడ ఇది స్వల్ప అనుసంధాన అవ్యయం; తెలుగులో వాక్యప్రవాహమే దాని పనిని తగినంతగా తెలియజేస్తుంది.
- source_word: καὶ
  choice: కూడా
  rationale: యాజకునితోపాటు లేవీయుణ్ణి మరో సమాంతర ఉదాహరణగా చేర్చే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: Λευίτης
  choice: ఒక లేవీయుడు
  rationale: యూదుల చారిత్రక-మతపరమైన వర్గానికి ప్రామాణిక తెలుగు రూపాన్ని నిలుపుతుంది; కథనంలో ‘ఒక’ సహజంగా ఉంది.
- source_word: κατὰ τὸν τόπον
  choice: ఆ చోటికి
  rationale: సందర్భంలో ఇప్పటికే సూచించిన నిర్దిష్ట ప్రదేశానికి అతడు చేరుకున్నాడనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐλθὼν
  choice: వచ్చి
  rationale: ప్రధాన క్రియకు ముందున్న చర్యను తెలుగు క్రమసమాపక క్రియతో సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἰδὼν
  choice: అతన్ని చూసి
  rationale: చూడటం ప్రధాన చర్యకు ముందు జరిగిందని చూపుతుంది; కర్మను సందర్భం నుంచి స్పష్టంగా అందిస్తుంది.
- source_word: ἀντιπαρῆλθεν
  choice: అవతలి వైపుగా వెళ్లిపోయాడు
  rationale: కేవలం దాటిపోవడం మాత్రమే కాకుండా ఎదురువైపు నుంచి తప్పించుకొని వెళ్లిన భావాన్ని సమాస క్రియ సూచిస్తున్నందున దాన్ని నిలుపుతుంది.
theological_decisions:
- issue: Λευίτης అనే సామాజిక-మతపరమైన గుర్తింపు
  choice: లేవీయుడు అనే చారిత్రక వర్గనామాన్ని అలాగే ఉంచడం
  alternative: దేవాలయ సేవకుడు; లేవి గోత్రస్థుడు
  rationale: యాజకునికి సమాంతరంగా గుర్తించదగిన యూదు మతపరమైన వ్యక్తిని వచనం పేర్కొంటుంది. వివరణాత్మక పదంతో సాధారణీకరించకుండా చారిత్రక, కథన నిర్దిష్టతను ఇది కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని క్రియల వరుసను ‘వచ్చి, చూసి, వెళ్లిపోయాడు’గా నిలిపి, ἀντιπαρῆλθεν లోని తప్పించుకునే భావాన్ని ప్రధాన పాఠ్యంలో వ్యక్తం చేశాం.
