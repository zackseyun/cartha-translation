  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὑπέστρεψαν δὲ οἱ ἑβδομήκοντα ⸀δύο μετὰ χαρᾶς λέγοντες· Κύριε, καὶ τὰ δαιμόνια ὑποτάσσεται ἡμῖν ἐν τῷ ὀνόματί σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/017.yaml
  text: Then the seventy-two returned with joy[a], saying, “Lord, even the demons submit to us in your name.”
translation:
  language: te
  text: ఆ డెబ్బై ఇద్దరు[a] ఆనందంతో తిరిగి వచ్చి, “ప్రభువా, నీ నామంలో దయ్యాలు కూడా మాకు లోబడుతున్నాయి” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో “డెబ్బై ఇద్దరు”కు బదులుగా “డెబ్బై మంది” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπέστρεψαν
  choice: తిరిగి వచ్చి
  rationale: ఇది వారు తమ పరిచర్య ప్రయాణం నుంచి తిరిగి రావడాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో తరువాతి మాటల క్రియతో సహజంగా అనుసంధానించడానికి ‘తిరిగి వచ్చి’ అని అనువదించాం.
- source_word: δὲ
  choice: వాక్య ప్రవాహంలో ప్రత్యేక పదంగా వ్యక్తపరచలేదు
  rationale: δέ ఇక్కడ కథనాన్ని ముందుకు నడిపే స్వల్ప సంధాయకం. తెలుగులో ‘ఆ డెబ్బై ఇద్దరు… తిరిగి వచ్చి’ అనే నిర్మాణమే ఆ కొనసాగింపును సహజంగా తెలియజేస్తుంది; ‘అప్పుడు’ అని చేరిస్తే మూలంలో లేని కాలక్రమ బలం ఎక్కువ కావచ్చు.
- source_word: οἱ ἑβδομήκοντα δύο
  choice: ఆ డెబ్బై ఇద్దరు
  rationale: SBLGNT ప్రధాన పాఠంలోని ‘డెబ్బై ఇద్దరు’ సంఖ్యను అనుసరించాం. ‘ఆ’ అనే నిర్దేశకం ముందుగా పంపబడిన నిర్దిష్ట బృందాన్ని సూచిస్తుంది.
- source_word: μετὰ χαρᾶς
  choice: ఆనందంతో
  rationale: χαρά అనే నామవాచక భావాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: λέγοντες
  choice: ఇలా అన్నారు
  rationale: ప్రత్యక్ష సంభాషణను పరిచయం చేసే గ్రీకు వర్తమాన కృదంతాన్ని తెలుగులో సహజమైన ప్రధాన క్రియగా వ్యక్తం చేశాం.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: యేసును సంబోధించే κύριος పదానికి గౌరవప్రదమైన, ప్రామాణిక తెలుగు రూపం.
- source_word: καὶ
  choice: కూడా
  rationale: ఇక్కడ καί ఆశ్చర్యాన్ని బలపరుస్తూ ‘దయ్యాలు సైతం’ అనే భావాన్ని ఇస్తుంది; ‘కూడా’ సాధారణ ఆధునిక తెలుగులో ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τὰ δαιμόνια
  choice: దయ్యాలు
  rationale: శత్రుత్వ స్వభావమున్న ఆత్మ సంబంధ జీవులను సూచించే సాధారణ నూతన నిబంధన పదప్రయోగాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ὑποτάσσεται
  choice: లోబడుతున్నాయి
  rationale: వారి అనుభవంలో జరుగుతున్న లోబడటాన్ని వర్తమాన భావంతో వ్యక్తం చేస్తుంది. గ్రీకులో నపుంసక బహువచన కర్తతో ఏకవచన క్రియ ఉన్నా, తెలుగులో ‘దయ్యాలు’కు అనుగుణంగా బహువచన క్రియ సహజం.
- source_word: ἡμῖν
  choice: మాకు
  rationale: ὑποτάσσωతో వచ్చే దత్తి విభక్తిని తెలుగులో సహజంగా ‘మాకు’ అని అందించాం.
- source_word: ἐν τῷ ὀνόματί σου
  choice: నీ నామంలో
  rationale: యేసు నామంతో సంబంధమున్న అధికారము లేదా సాధన భావాన్ని పూర్తిగా ఒకే అర్థానికి పరిమితం చేయకుండా మూలంలోని సుపరిచితమైన విధానాన్నే నిలుపుతుంది.
theological_decisions:
- issue: శిష్యుల సంఖ్యలో పాఠాంతరం
  choice: డెబ్బై ఇద్దరు
  alternative: డెబ్బై మంది
  rationale: అందించిన SBLGNT పాఠంలో ‘డెబ్బై ఇద్దరు’ ఉంది. ప్రాముఖ్యమైన ‘డెబ్బై మంది’ పాఠాంతరాన్ని ప్రధాన పాఠంలో కలపకుండా అధస్సూచికలో భద్రపరిచాం.
- issue: యేసు నామంలో దయ్యాలు లోబడటం
  choice: నీ నామంలో
  alternative: నీ నామం ద్వారా / నీ నామాధికారంతో
  rationale: ἐν అనే పదబంధం సాధనం, పరిధి, అధికారం వంటి పరస్పర సంబంధిత భావాలను మోయగలదు. ఒకే వివరణను బలవంతంగా నిర్ణయించకుండా మూలంలోని భావ విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే వాక్య గౌరవాన్ని నిలుపుతూ రూపొందించబడింది. సంఖ్యకు సంబంధించిన అధస్సూచిక గుర్తును అది వివరిస్తున్న పదబంధం వెంటనే ఉంచాం.
