review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the journey, attack by robbers, stripping, and abandonment. However, the compact ‘కొట్టి’ underrepresents πληγὰς ἐπιθέντες (‘inflicted blows/wounds’); ‘దెబ్బలు కొట్టి’ preserves the explicit action more fully. The revised final clause retains ἡμιθανῆ, indicating that the victim was left nearly dead but not dead.
  naturalness: The wording is clear modern standard Telugu. Recasting the last sequence as ‘అతనిని కొనప్రాణాలతో వదిలి వెళ్లిపోయారు’ is smoother and makes the object of the participial clause explicit.
  terminology: Names are correctly rendered as యేసు, యెరూషలేము, and యెరికో. ‘దొంగలు’ is an acceptable natural rendering for λῃσταί in this narrative context, where their violent robbery is made clear by the following actions. No theological terminology or footnotes are needed.
