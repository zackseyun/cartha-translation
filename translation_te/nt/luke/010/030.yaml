id: LUK.10.30
reference: Luke 10:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑπολαβὼν ⸀δὲ ὁ Ἰησοῦς εἶπεν· Ἄνθρωπός τις κατέβαινεν ἀπὸ Ἰερουσαλὴμ εἰς Ἰεριχὼ καὶ λῃσταῖς περιέπεσεν, οἳ καὶ ἐκδύσαντες αὐτὸν καὶ πληγὰς ἐπιθέντες ἀπῆλθον ἀφέντες ⸀ἡμιθανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/030.yaml
  text: Jesus replied, “A certain man was going down from Jerusalem to Jericho, and he fell among robbers, who also stripped him, beat him, and went away, leaving him half dead.”
translation:
  language: te
  text: 'అందుకు యేసు ఇలా జవాబిచ్చాడు: “ఒక మనిషి యెరూషలేము నుండి యెరికోకు దిగిపోతూ దొంగల చేతిలో పడ్డాడు. వారు అతని బట్టలు ఊడదీసి, దెబ్బలు కొట్టి, అతనిని కొనప్రాణాలతో వదిలి వెళ్లిపోయారు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπολαβὼν δὲ
  choice: అందుకు ... ఇలా జవాబిచ్చాడు
  rationale: సంభాషణలో ముందున్న ప్రశ్నకు యేసు స్పందించాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: Ἄνθρωπός τις
  choice: ఒక మనిషి
  rationale: నిర్దిష్టంగా గుర్తించని వ్యక్తిని సూచించే గ్రీకు ప్రయోగానికి సరళమైన సమానార్థకం.
- source_word: κατέβαινεν
  choice: దిగిపోతూ
  rationale: యెరూషలేము నుండి యెరికో వైపు భౌగోళికంగా దిగివెళ్లడాన్ని కాపాడుతుంది.
- source_word: λῃσταῖς περιέπεσεν
  choice: దొంగల చేతిలో పడ్డాడు
  rationale: దోచుకునే హింసాత్మక వ్యక్తుల బారిన పడటాన్ని సహజ తెలుగు నుడికారంతో వ్యక్తపరుస్తుంది.
- source_word: ἐκδύσαντες αὐτὸν
  choice: అతని బట్టలు ఊడదీసి
  rationale: వారు అతనిని వస్త్రహీనునిగా చేశారనే చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: πληγὰς ἐπιθέντες
  choice: కొట్టి
  rationale: అక్షరార్థంగా ‘దెబ్బలు మోపి’; సందర్భంలో హింసించి గాయపరిచారనే భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: ἡμιθανῆ
  choice: కొనప్రాణంతో
  rationale: ‘సగం చనిపోయిన’ అనే అక్షరార్థ భావాన్ని సహజమైన తెలుగు వ్యక్తీకరణలో, ఇంకా స్వల్ప ప్రాణం మిగిలి ఉందనే అర్థంతో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన సరళమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని చర్యల క్రమాన్ని కాపాడుతూ, ‘καί’ పదాల పునరావృతాన్ని తెలుగులో అసహజంగా కాకుండా క్రియల వరుసతో వ్యక్తపరిచాం.
