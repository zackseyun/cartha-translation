review_pass:
  verdict: revise
  source_fidelity: The counterfactual past construction, the repeated occurrence language for the mighty works, the temporal force of πάλαι, and the concrete image of sitting in sackcloth and ashes are substantially retained. However, “నీకు శ్రమ” is less faithful to the prophetic lament/denunciation force of Οὐαί, and footnote b adds “turning to God,” which is not explicitly stated by μετενόησαν.
  naturalness: The sentence is generally clear modern Telugu. “నీకు అయ్యో!” is the more natural direct equivalent of the repeated prophetic exclamation. “గోనెపట్ట ధరించి” is smoother than “గోనెపట్ట కట్టుకొని” for wearing sackcloth.
  terminology: “శక్తివంతమైన కార్యాలు” suitably represents δυνάμεις, with “అద్భుతాలు” as a valid alternative. “పశ్చాత్తాపపడటం” is appropriate for μετενόησαν. The explanatory footnote must not define repentance in a way that adds a theological direction absent from this verse.
  issues:
  - severity: medium
    issue: “నీకు శ్రమ!” for Οὐαί σοι
    rationale: This can sound like a prediction or description of hardship. “నీకు అయ్యో!” more directly carries the lamenting, condemnatory prophetic exclamation without narrowing its force.
  - severity: medium
    issue: Footnote b adds “దేవుని వైపు తిరగడం”
    rationale: The Greek verb denotes repentance/change of mind, but this verse does not explicitly supply the object or direction “to God.” The note should preserve that lexical breadth rather than adding it.
  - severity: low
    issue: “గోనెపట్ట కట్టుకొని”
    rationale: It is understandable, but “గోనెపట్ట ధరించి” is more idiomatic Telugu for the customary mourning garment while retaining the source image.
  revised_text: “కొరాజీనా, నీకు అయ్యో! బేత్సయిదా, నీకు అయ్యో! ఎందుకంటే మీ మధ్య జరిగిన శక్తివంతమైన కార్యాలు[a] తూరు, సీదోనులలో జరిగి ఉంటే, వారు గోనెపట్ట ధరించి బూడిదలో కూర్చుని చాలాకాలం క్రితమే పశ్చాత్తాపపడి ఉండేవారు[b].”
