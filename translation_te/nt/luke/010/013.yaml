id: LUK.10.13
reference: Luke 10:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ ⸀καθήμενοι μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/013.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works that happened among you had happened in Tyre and Sidon, long ago they would have repented[b], sitting in sackcloth and ashes.
translation:
  language: te
  text: “కొరాజీనా, నీకు అయ్యో! బేత్సయిదా, నీకు అయ్యో! ఎందుకంటే మీ మధ్య జరిగిన శక్తివంతమైన కార్యాలు[a] తూరు, సీదోనులలో జరిగి ఉంటే, వారు గోనెపట్ట ధరించి బూడిదలో కూర్చుని చాలాకాలం క్రితమే పశ్చాత్తాపపడి ఉండేవారు[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అద్భుతాలు”; గ్రీకులో “శక్తి కార్యాలు” అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “చాలాకాలం క్రితమే మనస్సు మార్చుకొని ఉండేవారు, గోనెపట్ట ధరించి బూడిదలో కూర్చుని.”
    reason: previous_rendering
lexical_decisions:
- source_word: Οὐαί σοι
  choice: నీకు శ్రమ!
  rationale: ప్రవచనాత్మక ఖండనతో పాటు విలాప ఛాయను కూడా నిలుపుతుంది; ఆధునిక తెలుగు పాఠకులకు సహజంగా అర్థమవుతుంది.
- source_word: Χοραζίν / Βηθσαϊδά
  choice: కొరాజీనా / బేత్సయిదా
  rationale: ప్రదేశాల పేర్లను ప్రామాణిక తెలుగు బైబిలు రూపాలకు దగ్గరగా లిప్యంతరీకరించి, ప్రత్యక్ష సంబోధనను సూచించేందుకు ‘కొరాజీనా’ అనే సంబోధన రూపం వాడబడింది.
- source_word: δυνάμεις
  choice: శక్తివంతమైన కార్యాలు
  rationale: ఈ పదంలోని ‘శక్తి’ మరియు ‘కార్యాలు’ అనే రెండు భావాలను నిలుపుతుంది; ‘అద్భుతాలు’ అనే కొంత వివరణాత్మక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: ἐγενήθησαν ... αἱ γενόμεναι
  choice: జరిగి ఉంటే ... జరిగిన
  rationale: γίνομαι రూపాల పునరుక్తిని సాధ్యమైనంతవరకు నిలుపుతూ, కార్యసాధకుడికన్నా సంఘటన సంభవించడంపై ఉన్న గ్రీకు దృష్టిని ప్రతిబింబిస్తుంది.
- source_word: ἐν ὑμῖν
  choice: మీ మధ్య
  rationale: బహువచన సంబోధనలో పట్టణ ప్రజల మధ్య ఆ కార్యాలు సంభవించాయని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: πάλαι
  choice: చాలాకాలం క్రితమే
  rationale: ప్రతివాస్తవ షరతులోని దీర్ఘకాల పూర్వత్వాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: గోనెపట్ట కట్టుకొని బూడిదలో
  rationale: దుఃఖం, పశ్చాత్తాపానికి సంబంధించిన చారిత్రక-ప్రవచనాత్మక దృశ్యాన్ని కాంక్రీటుగా నిలుపుతుంది.
- source_word: καθήμενοι
  choice: కూర్చుని
  rationale: దుఃఖ సూచకమైన స్పష్టమైన భంగిమను తీసివేయకుండా సహజ తెలుగులో నిలుపుతుంది.
- source_word: μετενόησαν
  choice: పశ్చాత్తాపపడి ఉండేవారు
  rationale: లూకా సందర్భంలో నైతిక-ఆధ్యాత్మిక మార్పును తెలిపే ప్రామాణికమైన, విస్తృతంగా అర్థమయ్యే తెలుగు పదప్రయోగం.
theological_decisions:
- issue: యేసు పరిచర్యలో δυνάμεις స్వభావం
  choice: ‘శక్తివంతమైన కార్యాలు’ అని అనువదించడం
  alternative: ‘అద్భుతాలు’ లేదా ‘శక్తికార్యాలు’
  rationale: గ్రీకు పదం అసాధారణ కార్యాలను సూచించినప్పటికీ, దానిలోని శక్తి మరియు కార్యం అనే భావాలను ప్రధాన పాఠ్యంలో నిలుపుతుంది; అద్భుతాలు అనే సహజ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
- issue: పశ్చాత్తాప దృశ్యానికి ఉన్న బలం
  choice: ‘గోనెపట్ట కట్టుకొని బూడిదలో కూర్చుని’ అనే సాక్షాత్కార చిత్రాన్ని నిలుపడం
  alternative: ‘గోనెపట్టతో, బూడిదతో పశ్చాత్తాపపడేవారు’ అని సంక్షిప్తీకరించడం
  rationale: గ్రీకు పాఠ్యంలో ఉన్న కూర్చునే భంగిమను, దుఃఖ-పశ్చాత్తాప సూచక ఆచారాన్ని అమూర్తంగా మార్చకుండా కాపాడుతుంది.
- issue: ప్రతివాస్తవ షరతు
  choice: ‘జరిగి ఉంటే ... పశ్చాత్తాపపడి ఉండేవారు’
  alternative: నిశ్చయ వాక్యంగా ‘జరిగితే ... పశ్చాత్తాపపడతారు’
  rationale: గ్రీకు εἰ + aorist మరియు ἄν + aorist నిర్మాణంలోని గతకాల ప్రతివాస్తవ భావాన్ని యథాతథంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన ప్రవచనాత్మక స్వరం. వాక్య నిర్మాణం సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఉంచుతూ, ప్రతివాస్తవ షరతు మరియు గోనెపట్ట-బూడిద దృశ్యాన్ని కాపాడింది.
