revisions:
- from: “కొరాజీనా, నీకు శ్రమ! బేత్సయిదా, నీకు శ్రమ! ఎందుకంటే మీ మధ్య జరిగిన శక్తివంతమైన కార్యాలు[a] తూరు, సీదోనుల్లో జరిగి ఉంటే, వారు గోనెపట్ట కట్టుకొని బూడిదలో కూర్చుని చాలాకాలం క్రితమే పశ్చాత్తాపపడి ఉండేవారు[b].”
  to: “కొరాజీనా, నీకు అయ్యో! బేత్సయిదా, నీకు అయ్యో! ఎందుకంటే మీ మధ్య జరిగిన శక్తివంతమైన కార్యాలు[a] తూరు, సీదోనులలో జరిగి ఉంటే, వారు గోనెపట్ట ధరించి బూడిదలో కూర్చుని చాలాకాలం క్రితమే పశ్చాత్తాపపడి ఉండేవారు[b].”
  rationale: The revision gives Οὐαί its natural prophetic force in modern Telugu, improves the sackcloth idiom, and replaces an interpretively expanded repentance note with a lexically grounded alternative that follows the audit trail. It preserves the source’s past counterfactual sense, location contrast, and mourning posture.
