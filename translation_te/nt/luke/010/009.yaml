id: LUK.10.9
reference: Luke 10:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ θεραπεύετε τοὺς ἐν αὐτῇ ἀσθενεῖς, καὶ λέγετε αὐτοῖς· Ἤγγικεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/009.yaml
  text: And heal the sick in it[a], and say to them, ‘The kingdom of God has come near to you.’
translation:
  language: te
  text: 'ఆ పట్టణంలో ఉన్న రోగులను స్వస్థపరచండి, వారికి ఇలా చెప్పండి: ‘దేవుని రాజ్యం మీకు సమీపించింది[a].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీ దగ్గరికి చేరుకుంది.’
    reason: Ἤγγικεν అనే పరిపూర్ణ కాల క్రియ దగ్గరికి వచ్చిన చర్యను, దాని ప్రస్తుత ప్రాముఖ్యతను సూచిస్తుంది. ‘మీకు సమీపించింది’ ప్రధాన అనువాదంలో ఆ సమీపతను స్పష్టంగా తెలియజేస్తుంది; ‘మీ దగ్గరికి చేరుకుంది’ మరో సహజమైన తెలుగు వ్యక్తీకరణ.
lexical_decisions:
- source_word: θεραπεύετε
  choice: స్వస్థపరచండి
  rationale: వర్తమానకాల ఆజ్ఞారూపం నిరంతరంగా చేయవలసిన పరిచర్యను సూచిస్తుంది. రోగుల సందర్భంలో ‘స్వస్థపరచండి’ సహజంగా ఉండి, కేవలం శ్రద్ధ తీసుకోవడం కంటే స్వస్థత కలిగించే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τοὺς ἐν αὐτῇ ἀσθενεῖς
  choice: ఆ పట్టణంలో ఉన్న రోగులను
  rationale: ἀσθενεῖς అనే పదానికి ‘బలహీనులు’ అనే అర్థం కూడా ఉన్నప్పటికీ, θεραπεύετεతో కలిసి ఇక్కడ శారీరక అనారోగ్యమే ప్రధాన భావం. αὐτῇ మునుపటి వచనంలోని పట్టణాన్ని సూచిస్తుంది; అందువల్ల తెలుగులో దానిని స్పష్టంగా పేర్కొనడం సహజం.
- source_word: λέγετε αὐτοῖς
  choice: అని వారితో చెప్పండి
  rationale: మూలంలోని సరళమైన మాటల ఆజ్ఞను సహజమైన ఆధునిక తెలుగు ప్రత్యక్ష ఉద్ధరణ నిర్మాణంలో నిలుపుతుంది.
- source_word: Ἤγγικεν
  choice: వచ్చింది
  rationale: గ్రీకు పరిపూర్ణ కాలం దగ్గరికి వచ్చిన చర్యతో పాటు దాని ప్రస్తుత ప్రాముఖ్యతను సూచిస్తుంది. ‘వచ్చింది’ అనే రూపం ఆ చర్యను తెలియజేస్తుంది; ‘మీ దగ్గరికి’తో కలిపినప్పుడు సమీపించిన భావం స్పష్టమవుతుంది.
- source_word: ἐφ’ ὑμᾶς
  choice: మీ దగ్గరికి
  rationale: ἐγγίζωతో ఉన్న ἐπί + ద్వితీయా విభక్తి శ్రోతలకు సంబంధించి దగ్గరికి రావడాన్ని సూచిస్తుంది. ‘మీ దగ్గరికి’ ఆధునిక తెలుగులో సహజం; ‘మీ మీదికి’ ఇక్కడ అనవసరంగా బెదిరింపు భావాన్ని కలిగించవచ్చు.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: ఇది స్థిరపడిన, సులభంగా అర్థమయ్యే బైబిలు పదబంధం. దేవుని పాలన అనే చలనాత్మక భావాన్ని మినహాయించకుండా, ‘రాజ్యం’ అనే పదం మూలంలోని విస్తృత భావపరిధిని కాపాడుతుంది.
theological_decisions:
- issue: దేవుని రాజ్యం దగ్గరికి వచ్చిందనే ప్రకటన యొక్క భావం
  choice: యేసు పంపినవారి పరిచర్యలో దేవుని రక్షణాత్మక రాజ్యం శ్రోతల దగ్గరికి వచ్చిందని ప్రకటించడం; అది పూర్తిగా నెరవేరిందా లేక భవిష్యత్తులో మాత్రమే నెరవేరుతుందా అనే విషయాన్ని ఈ వచనం ద్వారా నిర్ణయించకపోవడం.
  alternative: రాజ్యం ఇప్పటికే పూర్తిగా ప్రత్యక్షమైందని లేదా అది కేవలం సమీప భవిష్యత్తులోనే రానుందని స్పష్టీకరించడం.
  rationale: Ἤγγικεν సమీపతను, ప్రస్తుత ప్రాముఖ్యతను తెలియజేస్తుంది; అయితే ప్రారంభమైన రాజ్యం మరియు భవిష్యత్ సంపూర్ణత మధ్య ఉన్న ఉద్వేగాన్ని వచనం తానే పూర్తిగా పరిష్కరించదు. సరళమైన అనువాదం ఆ ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి ఉపయోగించబడింది. మునుపటి వచనంలోని పట్టణాన్ని αὐτῇ సూచిస్తున్నందున ‘ఆ పట్టణంలో’ అని స్పష్టీకరించబడింది. రెండు ఆజ్ఞలను సహజమైన తెలుగు వాక్యాలుగా ఉంచుతూ మూలంలోని క్రమం నిలుపబడింది.
