  text: As they were traveling along[a], he entered a certain village, and a woman named Martha welcomed him.
translation:
  language: te
  text: వారు ప్రయాణిస్తూ ఉండగా, ఆయన ఒక గ్రామంలోకి ప్రవేశించాడు. మార్త అనే ఒక స్త్రీ ఆయనను సాదరంగా స్వాగతించింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῷ πορεύεσθαι αὐτοὺς
  choice: వారు ప్రయాణిస్తూ ఉండగా
  rationale: ἐν + ఆర్టిక్యులర్ ఇన్ఫినిటివ్ సమకాలీన చర్యను సూచిస్తుంది; αὐτούς బహువచనం కాబట్టి ప్రయాణిస్తున్న సమూహాన్ని స్పష్టంగా ఉంచాం. δέను తెలుగులో ప్రత్యేక పదంతో భారంగా అనువదించకుండా సహజ కథన ప్రవాహంలో వ్యక్తపరిచాం.
- source_word: αὐτὸς
  choice: ఆయన
  rationale: ఈ బలప్రయోగ సర్వనామం ప్రయాణిస్తున్న బహువచన సమూహం నుండి యేసును ప్రత్యేకంగా చూపిస్తుంది. సందర్భంలో పేరు చేర్చకుండా గౌరవార్థక సర్వనామం సహజంగా ఆ భేదాన్ని నిలుపుతుంది.
- source_word: εἰσῆλθεν εἰς κώμην τινά
  choice: ఒక గ్రామంలోకి ప్రవేశించాడు
  rationale: κώμηకు ‘గ్రామం’ సరియైన సమానార్థకం; τινάలోని అనిర్దిష్టతను ‘ఒక’ నిలుపుతుంది. ‘ఒక నిర్దిష్ట గ్రామం’ అనడం ఆధునిక తెలుగులో అసహజంగా ఉంటుంది.
- source_word: γυνὴ δέ τις ὀνόματι Μάρθα
  choice: మార్త అనే ఒక స్త్రీ
  rationale: పేరు పరిచయమయ్యే తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా ‘మార్త అనే’ వాడాం; τιςలోని అనిర్దిష్టతను ‘ఒక’తో నిలిపాం. δέ కొత్త పాత్రను ప్రవేశపెడుతుంది; వాక్య విభజన ఆ కథన మార్పును సహజంగా తెలియజేస్తుంది.
- source_word: ὑπεδέξατο αὐτόν
  choice: ఆయనను సాదరంగా ఆహ్వానించింది
  rationale: ὑποδέχομαι ఇక్కడ అతిథిగా ఆదరంతో స్వీకరించడం అనే భావాన్ని కలిగిస్తుంది. ‘సాదరంగా ఆహ్వానించింది’ ఆ ఆతిథ్య భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; మూలంలో ప్రత్యక్షంగా లేని ‘తన ఇంటికి’ అనే మాటను చేర్చదు.
