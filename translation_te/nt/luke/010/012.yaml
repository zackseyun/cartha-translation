id: LUK.10.12
reference: Luke 10:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι Σοδόμοις ἐν τῇ ἡμέρᾳ ἐκείνῃ ἀνεκτότερον ἔσται ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/012.yaml
  text: I tell you[b][a], it will be more bearable for Sodom on that day than for that city.
translation:
  language: te
  text: 'నేను మీతో చెబుతున్నాను: ఆ రోజున[a] ఆ పట్టణం కంటే సొదొమకు భరించడం మరింత సులభంగా ఉంటుంది.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆ రోజు’ దైవిక తీర్పు దినాన్ని సూచిస్తుంది; కొన్ని సమాంతర వచనాలు దీన్ని స్పష్టంగా చెబుతాయి.
    reason: cross_reference
  - marker: b
    text: లేదా, ‘మరింత సహించదగినదిగా ఉంటుంది.’ గ్రీకు తులనాత్మక పదం ἀνεκτότερονను ఈ విధంగానూ అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: నేను మీతో చెబుతున్నాను
  rationale: ప్రత్యక్షంగా, గంభీరంగా చెప్పే వర్తమానకాల ప్రకటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: Σοδόμοις
  choice: సొదొమకు
  rationale: గ్రీకు బహువచన దత్తి రూపం సొదొమ ప్రజలను సూచించగలిగినా, స్థలనామాన్ని సమష్టిగా వాడే మూలపాఠ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: ఆ రోజున
  rationale: మూలంలోని కాలసూచక పదబంధాన్ని సహజంగా అనువదిస్తూ, ప్రధాన పాఠంలో ‘తీర్పు’ అనే మాటను అదనంగా చేర్చదు.
- source_word: ἀνεκτότερον
  choice: భరించడం సులభంగా
  rationale: ‘ఎక్కువగా సహించదగినది’ అనే తులనాత్మక భావాన్ని సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: ἔσται
  choice: ఉంటుంది
  rationale: భవిష్యత్ కాలంలోని εἰμί క్రియను సహజమైన తెలుగు భవిష్యత్ నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: ἢ τῇ πόλει ἐκείνῃ
  choice: ఆ పట్టణం కంటే
  rationale: దత్తి తులనను ‘కంటే’ నిర్మాణంతో సహజంగా వ్యక్తం చేసి, demonstrative సూచనను నిలుపుతుంది.
theological_decisions:
- issue: ‘ఆ రోజు’ స్వభావం
  choice: ప్రధాన పాఠంలో ‘ఆ రోజున’ అని మాత్రమే ఉంచడం
  alternative: ‘తీర్పు రోజున’ అని విస్తరించడం
  rationale: సందర్భం దైవిక తీర్పును సూచించినా, ఈ వచనం స్వయంగా ‘ఆ రోజున’ అని మాత్రమే చెబుతుంది; అందువల్ల మూలపాఠపు పరోక్షతను నిలుపుతున్నాం.
- issue: సొదొమకు మరియు ఆ పట్టణానికి కలిగే తీర్పు తులన
  choice: ‘సొదొమకు భరించడం సులభంగా ఉంటుంది’ అనే తులనాత్మక రూపం
  alternative: ఆ పట్టణం సొదొమకంటే ఎక్కువ శిక్ష పొందుతుంది
  rationale: మూలపాఠం శిక్ష స్థాయిని నేరుగా వివరిస్తూ చెప్పకుండా, ఏది ఎక్కువగా భరించదగినదో తులన చేస్తుంది; ఆ ఉద్వేగాన్ని అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ‘నగరం’ కంటే సందర్భానుకూలమైన ‘పట్టణం’ ఎంచుకోబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
