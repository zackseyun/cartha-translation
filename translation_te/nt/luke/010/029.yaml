id: LUK.10.29
reference: Luke 10:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁ δὲ θέλων ⸀δικαιῶσαι ἑαυτὸν εἶπεν πρὸς τὸν Ἰησοῦν· Καὶ τίς ἐστίν μου πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/029.yaml
  text: But he[a], wanting to justify himself, said to Jesus, “And who is my neighbor?”
translation:
  language: te
  text: 'అయితే అతడు తనను తాను సమర్థించుకోవాలనే ఉద్దేశంతో యేసుతో ఇలా అన్నాడు: “మరి నా పొరుగువాడు ఎవరు?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎవరిని నా పొరుగువానిగా పరిగణించాలి?”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: కోరుతూ
  rationale: వర్తమాన కృదంతం ఆ వ్యక్తి ఉద్దేశాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండేలా క్రియావిశేషణ రూపంలో అనువదించబడింది.
- source_word: δικαιῶσαι ἑαυτὸν
  choice: తనను తాను సమర్థించుకోవాలని
  rationale: ఇక్కడ భావం సాంకేతికమైన ధార్మిక ‘నీతిమంతునిగా తీర్చడం’ కంటే, తాను సరైనవాడినని చూపించుకోవడం. ‘సమర్థించుకోవడం’ ఆ స్వీయ-న్యాయీకరణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἶπεν πρὸς τὸν Ἰησοῦν
  choice: యేసుతో ... అని అడిగాడు
  rationale: గ్రీకులో సాధారణంగా ‘యేసుతో అన్నాడు’ అని ఉన్నా, తరువాత వచ్చేది ప్రత్యక్ష ప్రశ్న కాబట్టి తెలుగులో ‘అడిగాడు’ సహజమైన వాక్యప్రయోగం; సంభాషణ సంబంధం ‘యేసుతో’ ద్వారా నిలిచింది.
- source_word: Καὶ
  choice: మరి
  rationale: ముందటి సంభాషణకు కొనసాగింపుగా వచ్చే ప్రశ్నను ‘మరి’ సహజంగా సూచిస్తుంది; సంధానక పదాన్ని వదలలేదు.
- source_word: τίς ἐστίν μου πλησίον
  choice: నా పొరుగువాడు ఎవరు?
  rationale: πλησίον ఇక్కడ నామవాచకార్థంలో ‘పొరుగువాడు/సమీపవాడు’ అని ఉంది. ధర్మశాస్త్ర ఉల్లేఖంతో ఉన్న పదసంబంధాన్ని కాపాడుతూ సాధారణ తెలుగు బైబిలు పరిభాషలో ‘పొరుగువాడు’ ఎంచుకున్నాం.
theological_decisions:
- issue: δικαιῶσαι ἑαυτόν అనే పదబంధం యొక్క భావం
  choice: తాను సరైనవాడినని చూపించుకోవాలనే ఉద్దేశంతో ‘తనను తాను సమర్థించుకోవాలని’ అని అనువదించడం
  alternative: తనను తాను నీతిమంతునిగా చూపించుకోవాలని
  rationale: సందర్భం ధర్మశాస్త్ర సంబంధమైన నైతిక సంభాషణ. ఇక్కడ పౌలు రచనల్లో కనిపించే సాంకేతిక న్యాయతీర్పు సిద్ధాంతాన్ని బలవంతంగా చేర్చకుండా, స్వీయ-సమర్థన భావాన్నీ కథనంలోని వ్యంగ్య ఉద్వేగాన్నీ నిలుపుతుంది.
- issue: ‘నా పొరుగువాడు ఎవరు?’ అనే ప్రశ్న పరిధి
  choice: ప్రశ్నను నేరుగా అనువదించడం
  alternative: ఎవరిని నా పొరుగువానిగా పరిగణించాలి?
  rationale: ప్రత్యామ్నాయం ప్రశ్నలో అంతర్లీనంగా ఉన్న వర్గీకరణ భావాన్ని స్పష్టం చేస్తుంది, కానీ మూలంలోని సంక్షిప్తతను వ్యాఖ్యానాత్మకంగా విస్తరిస్తుంది. అందువల్ల దానిని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘పొరుగువాడు’ అనే స్థిరమైన బైబిలు పదాన్ని నిలిపి, అవసరమైన అర్థవివరణను పాదటిప్పణిలో ఇచ్చాం.
