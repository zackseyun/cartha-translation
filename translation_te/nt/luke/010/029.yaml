  to: 'అయితే అతడు తనను తాను సమర్థించుకోవాలనే ఉద్దేశంతో యేసుతో ఇలా అన్నాడు: “మరి నా పొరుగువాడు ఎవరు?[a]”'
  rationale: The revision replaces ‘అడిగాడు’ with ‘ఇలా అన్నాడు’ to preserve εἶπεν, while retaining the question in direct speech. It also makes the expression of the man’s intent more idiomatic Telugu without altering the participial motive or the sense of self-justification. The alternative footnote remains appropriately anchored to ‘పొరుగువాడు’ and presents the interpretive scope implied by the question.
