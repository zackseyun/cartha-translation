  source_fidelity: 'The main sense is accurately represented: the man seeks to justify/vindicate himself and asks about the identity or scope of ‘my neighbor.’ However, εἶπεν πρὸς τὸν Ἰησοῦν means ‘said to Jesus,’ not specifically ‘asked Jesus.’ Although the following direct speech is a question, the Greek narrator uses the broader speech verb, which should be retained.'
  naturalness: The wording is generally natural modern standard Telugu. Recasting the opening participial phrase as ‘తనను తాను సమర్థించుకోవాలనే ఉద్దేశంతో’ reads more smoothly while retaining the motive expressed by θέλων.
  terminology: ‘తనను తాను సమర్థించుకోవడం’ appropriately conveys the contextual, nontechnical sense of δικαιῶσαι ἑαυτόν. ‘పొరుగువాడు’ is an established and suitable rendering of πλησίον here. ‘యేసు’ is standard Telugu biblical usage.
  issues:
  - severity: medium
    issue: ‘అడిగాడు’ narrows εἶπεν (‘said’) to ‘asked.’
