  text: Which of these three seems to you to have become a neighbor to the man who fell among the robbers?[a]
translation:
  language: te
  text: ఈ ముగ్గురిలో ఎవరు దొంగల చేతిలో చిక్కినవానికి పొరుగువాడిగా మారాడని నీకు అనిపిస్తోంది?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ ముగ్గురిలో ఎవరు దొంగల చేతిలో చిక్కినవానికి పొరుగువాడిగా ఉన్నాడని నీవు అనుకుంటున్నావు?” గ్రీకులో మరింత అక్షరార్థంగా, “ఈ ముగ్గురిలో ఎవరు దొంగల చేతిలో చిక్కినవానికి పొరుగువాడిగా మారాడని నీకు అనిపిస్తోంది?” అని ఉంది; ఇది పొరుగువానిగా మారి వ్యవహరించడాన్ని నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς τούτων τῶν τριῶν
  choice: ఈ ముగ్గురిలో ఎవరు
  rationale: నిర్దిష్టమైన ముగ్గురిలో ఒకరిని ఎంచి చెప్పమనే ప్రశ్నను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; గ్రీకులో లేని ‘మనుషులు’ అనే పదాన్ని చేర్చదు.
- source_word: πλησίον
  choice: పొరుగువాడిగా
  rationale: ఇక్కడ పదం స్థలపరంగా ‘దగ్గర’ అనే అర్థంలో కాక, మరొకరి పట్ల పొరుగువానిగా వ్యవహరించిన వ్యక్తిని సూచిస్తుంది.
- source_word: δοκεῖ σοι
  choice: నీకు అనిపిస్తోంది
  rationale: ‘నీకు తోస్తోంది/అనిపిస్తోంది’ అనే గ్రీకు భావాన్ని నిలుపుతూ, కేవలం ‘నీవు అనుకుంటున్నావు’ అని స్వేచ్ఛగా మార్చకుండా సహజమైన ఆధునిక తెలుగు ఇస్తుంది.
- source_word: γεγονέναι
  choice: మారాడని
  rationale: γίνομαι పరిపూర్ణ క్రియారూపంలోని ‘అయ్యాడు/మారాడు’ అనే చలనాత్మక భావాన్ని కాపాడుతుంది; కేవలం స్థిరమైన ‘ఉన్నాడు’గా అనువదించదు.
- source_word: τοῦ ἐμπεσόντος εἰς τοὺς λῃστάς
  choice: దొంగల చేతిలో చిక్కినవానికి
  rationale: గ్రీకు నుడికారంలోని దొంగల బారిన లేదా ఆధీనంలో పడిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; సందర్భంలో బాధితుణ్ణి సూచిస్తుంది.
theological_decisions:
- issue: మంచి సమరయుని ఉపమానంలోని నైతిక ప్రశ్న దృష్టి
  choice: ‘పొరుగువాడిగా మారాడు’ అని అనువదించడం
  alternative: ‘పొరుగువాడిగా ఉన్నాడు’ అని అనువదించడం
  rationale: ప్రశ్న ‘నా పొరుగువాడు ఎవరు?’ అనే గుర్తింపు నుంచి, అవసరంలో ఉన్నవానికి ఎవరు పొరుగువానిగా అయ్యారు అనే కార్యాచరణ వైపు మళ్లుతుంది. γεγονέναι లోని ఈ భావాన్ని అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘మారాడు’ ద్వారా మూలంలోని చలనాత్మక నైతిక భావం నిలుపబడింది. ప్రధాన పాఠంలోని [a] సూచిక పాదసూచికతో సరిపోలుతుంది.
