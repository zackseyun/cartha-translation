revisions:
- from: కాని ప్రయాణం చేస్తున్న ఒక సమరయుడు అతడు ఉన్న చోటికి వచ్చాడు. అతణ్ణి చూసి కనికరంతో చలించిపోయాడు.[a]
  to: కాని ప్రయాణిస్తూ ఉన్న ఒక సమరయుడు అతడు ఉన్న చోటికి వచ్చి, అతణ్ణి చూసి కనికరపడ్డాడు.[a]
  rationale: The revision retains every explicit element of the Greek and the narrative contrast while using a direct modern Telugu expression for compassion. The footnote remains anchored to the compassion verb and supplies a legitimate lexical alternative without interpretive expansion.
