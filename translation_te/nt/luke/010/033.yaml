source:
  edition: SBLGNT
  text: Σαμαρίτης δέ τις ὁδεύων ἦλθεν κατ’ αὐτὸν καὶ ⸀ἰδὼν ἐσπλαγχνίσθη,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/033.yaml
  text: But a Samaritan[a], as he traveled, came to where he was, and when he saw him, he was moved with compassion.
translation:
  language: te
  text: కాని ప్రయాణిస్తూ ఉన్న ఒక సమరయుడు అతడు ఉన్న చోటికి వచ్చి, అతణ్ణి చూసి కనికరపడ్డాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “అతనిపై దయ కలిగింది.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σαμαρίτης
  choice: ఒక సమరయుడు
  rationale: జాతి-మత గుర్తింపును సూచించే స్థిరమైన తెలుగు పదం; ఉపమానంలోని సామాజిక వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: δέ
  choice: కాని
  rationale: ముందు ప్రస్తావించిన యాజకుడు, లేవీయుడి ప్రవర్తనతో ఉన్న వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τις
  choice: ఒక
  rationale: అనిర్దిష్ట వ్యక్తిని ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: ὁδεύων
  choice: ప్రయాణం చేస్తున్న
  rationale: నేపథ్యంలో కొనసాగుతున్న ప్రయాణ చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: ἦλθεν κατ’ αὐτόν
  choice: అతడు ఉన్న చోటికి వచ్చాడు
  rationale: గాయపడిన వ్యక్తి ఉన్న ప్రదేశానికి సమరయుడు చేరుకున్నాడనే సందర్భానుగుణ భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: ἰδών
  choice: అతణ్ణి చూసి
  rationale: చూడటం ప్రధాన క్రియకు ముందున్న చర్య అని సంక్షిప్తంగా, సహజంగా చూపుతుంది.
- source_word: ἐσπλαγχνίσθη
  choice: కనికరంతో చలించిపోయాడు
  rationale: లోతైన, అంతరంగిక కనికరాన్ని సూచించే గ్రీకు క్రియ యొక్క భావోద్వేగ బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: సమరయుడి స్పందనను తరువాతి నైతిక లేదా సిద్ధాంత వ్యాఖ్యానంతో విస్తరించకుండా అనువదించడం
  choice: కనికరంతో చలించిపోయాడు
  alternative: అతనిపై కనికరపడ్డాడు
  rationale: మూలంలోని గాఢమైన దయాభావాన్ని నిలుపుతూ, కృప, పొరుగువాని ప్రేమ మొదలైన అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని వ్యత్యాసం, చర్యల క్రమం, గాఢమైన కనికర భావం నిలుపబడ్డాయి. పాదసూచిక గుర్తును దానికి సంబంధించిన క్రియావాక్యం వద్ద ఉంచాం.
