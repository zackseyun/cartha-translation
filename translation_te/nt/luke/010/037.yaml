id: LUK.10.37
reference: Luke 10:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ. εἶπεν ⸀δὲ αὐτῷ ὁ Ἰησοῦς· Πορεύου καὶ σὺ ποίει ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/037.yaml
  text: And he said, “The one who showed mercy to him.” Then Jesus said to him, “Go, and you do likewise.”
translation:
  language: te
  text: అప్పుడు అతడు, “అతనిపై దయ చూపినవాడే” అన్నాడు. అప్పుడు యేసు అతనితో, “వెళ్లి, నీవు కూడా అలాగే చేయి” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ
  choice: అతనిపట్ల కనికరం చూపినవాడే
  rationale: గ్రీకు పదబంధంలోని ‘అతనితో కనికరం చేసినవాడు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ὁ అనే నిర్దిష్టీకరణకు ‘వాడే’ తగిన బలం ఇస్తుంది.
- source_word: Πορεύου
  choice: నీవు వెళ్లి
  rationale: ఆజ్ఞార్థక క్రియను సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తూ, తరువాతి καὶ σύ లోని వ్యక్తిగత ఉద్ఘాటనతో కలుపుతుంది.
- source_word: καὶ σὺ ποίει ὁμοίως
  choice: అలాగే చేయి
  rationale: ὁμοίως ను ‘అలాగే’గా, కొనసాగింపును సూచించగల ποίει ఆజ్ఞను సందర్భానుకూలంగా ‘చేయి’గా అనువదించింది; ‘నీవు’ ద్వారా καὶ σύ యొక్క ఉద్ఘాటన నిలిచింది.
theological_decisions:
- issue: καὶ σύ లోని వ్యక్తిగత ఉద్ఘాటన
  choice: ‘నీవు వెళ్లి అలాగే చేయి’ అని స్పష్టంగా వ్యక్తపరచడం
  alternative: ‘వెళ్లి అలాగే చేయి’
  rationale: తెలుగులో కర్తను వదిలేయగలిగినా, గ్రీకులోని σύ స్పష్టంగా ఉండటం వల్ల ‘నీవు’ను ఉంచడం యేసు ఆజ్ఞను ఆ వ్యక్తికి నేరుగా వర్తింపజేసే బలాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా వినిపించే ప్రత్యక్ష సంభాషణ. మూలంలోని సంక్షిప్తతను, ‘నీవు’ అనే ఉద్ఘాటనను నిలిపింది.
