id: LUK.10.1
reference: Luke 10:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα ἀνέδειξεν ὁ κύριος ⸀καὶ ἑτέρους ἑβδομήκοντα ⸀δύο καὶ ἀπέστειλεν αὐτοὺς ἀνὰ δύο ⸁δύο πρὸ προσώπου αὐτοῦ εἰς πᾶσαν πόλιν καὶ τόπον οὗ ἤμελλεν αὐτὸς ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/001.yaml
  text: After these things[a], the Lord appointed seventy-two others also, and sent them two by two ahead of him into every town and place where he himself was about to go.
translation:
  language: te
  text: ఆ తరువాత ప్రభువు ఇతర డెబ్బై ఇద్దరినీ కూడా నియమించి, తాను వెళ్లబోయే ప్రతి పట్టణానికీ, ప్రతి చోటికీ తనకు ముందుగా వారిని ఇద్దరిద్దరుగా పంపాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: ఆ తరువాత
  rationale: బహువచన సూచనతో కూడిన కాలక్రమ మార్పును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; అక్షరార్థమైన ‘ఈ సంగతుల తరువాత’ కంటే ప్రవాహవంతంగా ఉంటుంది.
- source_word: ἀνέδειξεν
  choice: నియమించి
  rationale: ఒక పనికోసం వ్యక్తులను ఎంపిక చేసి నియమించే భావాన్ని సందర్భానుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ κύριος
  choice: ప్రభువు
  rationale: κύριοςకు ప్రామాణికమైన తెలుగు అనువాదం; ఇక్కడ యేసును సూచిస్తుంది.
- source_word: καὶ ἑτέρους ἑβδομήκοντα δύο
  choice: మరో డెబ్బై ఇద్దరిని
  rationale: ἑτέρουςలోని అదనపు వ్యక్తుల భావాన్ని ‘మరో’ తెలియజేస్తుంది; మూలపాఠంలోని సంఖ్య డెబ్బై రెండు. ముఖ్యమైన ప్రత్యామ్నాయ పాఠాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἀπέστειλεν
  choice: పంపాడు
  rationale: అనవసరమైన అధికారిక లేదా అపొస్తలిక భావాన్ని చేర్చకుండా చర్యను సూటిగా తెలియజేస్తుంది.
- source_word: ἀνὰ δύο δύο
  choice: ఇద్దరిద్దరుగా
  rationale: గ్రీకు పంపిణీయ ప్రయోగాన్ని సహజమైన తెలుగు రూపంలో, జంటలుగా పంపిన భావంతో తెలియజేస్తుంది.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: తనకంటే ముందుగా
  rationale: యేసు రాకకు ముందుగా వారిని పంపాడనే సిద్ధపరిచే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς πᾶσαν πόλιν καὶ τόπον
  choice: ప్రతి పట్టణానికీ, ప్రతి చోటికీ
  rationale: πόλις, τόπος అనే రెండు నామపదాలనూ విడిగా నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: οὗ ἤμελλεν αὐτὸς ἔρχεσθαι
  choice: తాను వెళ్లబోయే
  rationale: μέλλωలోని సమీప లేదా ఉద్దేశిత భవిష్యత్తు భావాన్ని తెలియజేస్తుంది; ‘తాను’ αὐτός యొక్క ఉద్ఘాటనను నిలుపుతుంది.
theological_decisions:
- issue: నియమించబడిన వారి సంఖ్యలో పాఠాంతరం
  choice: డెబ్బై ఇద్దరు
  alternative: డెబ్బై మంది
  rationale: అందించిన SBLGNT మూలపాఠంలో ἑβδομήκοντα δύο (‘డెబ్బై ఇద్దరు’) ఉంది. ‘డెబ్బై’ అనేది ప్రాముఖ్యమైన పాఠాంతరం కాబట్టి దాన్ని పాదసూచికలో సంరక్షించాం; ఇది సిద్ధాంతపరమైన నిర్ణయం కాదు, పాఠ విమర్శకు సంబంధించినది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా గౌరవప్రదమైన శైలిలో రూపొందించబడింది. గ్రీకు వాక్యంలోని కాలక్రమం, నియామకం, జంటలుగా పంపడం, యేసు స్వయంగా తరువాత వెళ్లడం అనే అంశాలు సహజమైన తెలుగు క్రమంలో నిలుపబడ్డాయి.
