source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ἐθεώρουν τὸν Σατανᾶν ὡς ἀστραπὴν ἐκ τοῦ οὐρανοῦ πεσόντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/018.yaml
  text: And he said to them[a], “I was watching Satan fall like lightning from heaven.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “సాతాను మెరుపువలె పరలోకం నుండి పడిపోవడాన్ని నేను చూస్తూ ఉన్నాను.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సాతాను మెరుపువలె పరలోకం నుండి పడిపోవడాన్ని నేను చూశాను.” గ్రీకులోని అసంపూర్ణ భూతకాల క్రియను ఇలా సరళంగా కూడా అనువదించవచ్చు; అయితే “చూస్తూ ఉన్నాను” అనే రూపం కొనసాగుతున్న భావాన్ని మరింత స్పష్టంగా నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτοῖς
  choice: అప్పుడు ఆయన వారితో ఇలా అన్నాడు
  rationale: δέ స్వల్ప కథన అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో ‘అప్పుడు’ సందర్భ ప్రవాహాన్ని సహజంగా తెలియజేస్తుంది. εἶπεν‌ను సాధారణ భూతకాలంగా అనువదించాం.
- source_word: Ἐθεώρουν
  choice: నేను చూస్తూ ఉన్నాను
  rationale: θεωρέω యొక్క అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న దర్శనాన్ని లేదా గమనింపును సూచించగలదు; ‘చూస్తూ ఉన్నాను’ ఆ aspect‌ను సహజ తెలుగులో నిలుపుతుంది.
- source_word: τὸν Σατανᾶν
  choice: సాతాను
  rationale: ఇక్కడ ఇది వ్యక్తిగత నామం/బిరుదుగా వాడబడింది; తెలుగులో స్థిరపడిన లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: ὡς ἀστραπὴν
  choice: మెరుపులా
  rationale: ὡς సూచించే ఉపమానాన్ని సంక్షిప్తమైన, సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: ఆకాశం నుండి
  rationale: οὐρανός‌కు ‘ఆకాశం’ లేదా ‘పరలోకం’ అనే అర్థాలు ఉండవచ్చు. ఈ దృశ్యాత్మక వాక్యంలో ‘ఆకాశం’ సహజంగా ఉండి, మూలంలోని స్థలార్థాన్ని అనవసరంగా సిద్ధాంతీకరించదు.
- source_word: πεσόντα
  choice: పడుతుండడం
  rationale: Σατανᾶν‌ను విశేషించే aorist participle‌ను గ్రహణ క్రియతో కూడిన సహజ తెలుగు పూరక నిర్మాణంగా ఇచ్చాం; ఇది పడే సంఘటనను సూచిస్తుంది.
theological_decisions:
- issue: సాతాను పడిపోవడం ఏ కాలానికి లేదా సంఘటనకు సంబంధించినదనే ప్రశ్న
  choice: కొనసాగుతున్న దర్శనం/గమనింపుగా ‘పడుతుండడం నేను చూస్తూ ఉన్నాను’ అని అనువదించడం
  alternative: ‘సాతాను మెరుపులా ఆకాశం నుండి పడడం నేను చూశాను’
  rationale: గ్రీకు వాక్యం ఇది ఆదికాల పతనమా, శిష్యుల పరిచర్యతో సంబంధమున్న ప్రస్తుత ఓటమా, లేక భవిష్య ఓటమికి సంబంధించిన దర్శనమా అని స్పష్టంగా నిర్ణయించదు. అనువాదం ఆ ఉద్రిక్తతను పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని ఉపమానాన్ని, కొనసాగుతున్న క్రియాభావాన్ని, కాలసంబంధమైన వ్యాఖ్యాన అస్పష్టతను కాపాడాం.
