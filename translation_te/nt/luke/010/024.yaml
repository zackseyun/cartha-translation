source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι πολλοὶ προφῆται καὶ βασιλεῖς ἠθέλησαν ἰδεῖν ἃ ὑμεῖς βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/024.yaml
  text: For I tell you that many prophets and kings desired to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: te
  text: 'ఎందుకంటే, నేను మీకు చెబుతున్నాను: అనేకమంది ప్రవక్తలూ రాజులూ మీరు చూస్తున్నవాటిని చూడాలని కోరుకున్నారు[a], కాని చూడలేదు; మీరు వింటున్నవాటిని వినాలని కోరుకున్నారు, కాని వినలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చూడాలని ఆశపడ్డారు” లేదా “చూడాలని తపించారు.”
    reason: ἠθέλησαν అనే పదం సందర్భానుసారం సాధారణ కోరికనుంచి గాఢమైన ఆకాంక్షవరకు సూచించగలదు.
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: ఎందుకంటే, నేను మీతో చెబుతున్నాను
  rationale: γάρ ముందున్న ధన్యతా ప్రకటనకు కారణవివరణను అనుసంధానిస్తుంది; λέγω ... ὑμῖν తెలుగులో సహజంగా ‘నేను మీతో చెబుతున్నాను’ అవుతుంది.
- source_word: πολλοὶ προφῆται καὶ βασιλεῖς
  choice: అనేకమంది ప్రవక్తలు, రాజులు
  rationale: రెండు చారిత్రక వర్గాలను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నేరుగా నిలుపుతుంది.
- source_word: ἠθέλησαν
  choice: కోరుకున్నారు
  rationale: θέλω ఇక్కడ బలమైన కోరికను సూచించగలిగినా తప్పనిసరిగా తీవ్రమైన తపనను సూచించదు; ‘కోరుకున్నారు’ సహజమైన, గౌరవప్రదమైన మధ్యస్థ ఎంపిక.
- source_word: ἰδεῖν ἃ ὑμεῖς βλέπετε
  choice: మీరు చూస్తున్నవాటిని చూడాలని
  rationale: క్రియల పునరుక్తిని నిలిపి, గ్రీకు సంబంధవాచక నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: καὶ οὐκ εἶδαν
  choice: కాని చూడలేదు
  rationale: καί ఇక్కడ ఆశించిన కోరికకు విరుద్ధమైన ఫలితాన్ని కలుపుతుంది; తెలుగులో ‘కాని’ ఆ భావసంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: మీరు వింటున్నవాటిని వినాలని కోరుకున్నారు, కాని వినలేదు
  rationale: మూలంలోని చూడడం–వినడం సమాంతరతను నిలుపుతుంది. రెండవ భాగంలో ‘కోరుకున్నారు’ను పునఃప్రయోగించడం తెలుగులో అసంపూర్ణతను నివారిస్తుంది; అది గ్రీకులో ముందటి ἠθέλησαν నుంచే అర్థమవుతుంది.
theological_decisions:
- issue: ‘ప్రవక్తలు, రాజులు’ ఎవరనే గుర్తింపు
  choice: ‘ప్రవక్తలు, రాజులు’ అనే చారిత్రక వర్గాలనే వ్యాఖ్యానం లేకుండా ఉంచడం
  alternative: ‘పూర్వకాల ప్రవక్తలు, రాజులు’ లేదా ‘ప్రవక్తలు, పాలకులు’
  rationale: మూలపాఠం కాలసూచక విస్తరణను ఇవ్వదు; βασιλεῖς అంటే ప్రత్యేకంగా ‘రాజులు.’ యేసు శిష్యులు పొందిన ప్రత్యక్షతకూ, గతంలోని ప్రముఖులు కోరుకున్నదానికీ మధ్యనున్న వేదాంతపరమైన ఉద్వేగాన్ని అనువాదం వివరించి పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని ‘చూడడం/వినడం’ సమాంతర నిర్మాణాన్ని నిలిపి, ‘మీరు’ అనే స్పష్టమైన కర్తను రెండు భాగాల్లోనూ ఉంచాం. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పదబంధం వెంటనే ఉంచబడింది.
