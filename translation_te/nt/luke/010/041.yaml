source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ εἶπεν αὐτῇ ὁ ⸀κύριος· Μάρθα Μάρθα, μεριμνᾷς καὶ ⸀θορυβάζῃ περὶ πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/041.yaml
  text: But the Lord answered her[a], “Martha, Martha, you are anxious and troubled about many things,”
translation:
  language: te
  text: 'అయితే ప్రభువు ఆమెకు జవాబిచ్చాడు: “మార్తా, మార్తా, నువ్వు అనేక విషయాల గురించి ఆందోళన చెందుతున్నావు, కలవరపడుతున్నావు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చింతిస్తూ, కలత చెందుతున్నావు.”
    reason: μεριμνᾷς మరియు θορυβάζῃ పదాల భావపరిధికి సహజమైన ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: జవాబిచ్చాడు
  rationale: గ్రీకు కథనంలో సహజంగా వచ్చే కృదంతం–క్రియ కలయికను తెలుగులో ఒకే సహజ క్రియగా వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మార్త చేసిన ఫిర్యాదు నుంచి ప్రభువు జవాబుకు వచ్చే స్వల్ప వ్యత్యాసాన్ని, మార్పును సూచిస్తుంది.
- source_word: αὐτῇ
  choice: ఆమెకు
  rationale: జవాబు ఎవరికి చెప్పబడిందో తెలుగులో సహజమైన సంప్రదాన విభక్తితో తెలియజేస్తుంది.
- source_word: ὁ κύριος
  choice: ప్రభువు
  rationale: లూకా కథనంలో యేసుకు వాడిన గౌరవార్థకమైన, క్రీస్తుసంబంధ ప్రతిధ్వని గల బిరుదును నిలుపుతుంది.
- source_word: Μάρθα Μάρθα
  choice: మార్తా, మార్తా
  rationale: ప్రత్యక్ష సంబోధనలోని పునరుక్తిని అలాగే ఉంచి, దానిలోని వాత్సల్యాన్ని మరియు నొక్కిచెప్పడాన్ని కాపాడుతుంది.
- source_word: μεριμνᾷς
  choice: ఆందోళన చెందుతూ
  rationale: లోపలి చింతను, మనోవ్యాకులతను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: θορυβάζῃ
  choice: కలవరపడుతున్నావు
  rationale: మనసులో అలజడి లేదా కలత చెందుతున్న భావాన్ని తెలియజేస్తూ, μεριμνᾷς నుంచి ఉన్న స్వల్ప భావభేదాన్ని నిలుపుతుంది.
- source_word: περὶ πολλά
  choice: అనేక విషయాల గురించి
  rationale: మార్త ఆందోళనకు సంబంధించిన విస్తృత విషయాలను సరళంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యేసుకు κύριος అనే బిరుదు
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఇక్కడ κύριος కేవలం గృహయజమాని లేదా గురువు అనే అర్థానికే పరిమితం కాక, లూకా కథనంలో గౌరవార్థకమైన మరియు క్రీస్తుసంబంధమైన ప్రతిధ్వనిని కలిగి ఉంది; ‘ప్రభువు’ ఆ విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. సంబోధనలోని పునరుక్తి మరియు రెండు భావోద్వేగ క్రియల మధ్య తేడా నిలుపబడ్డాయి.
