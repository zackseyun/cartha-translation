revisions:
- from: ఆ సేవకుడు తిరిగి వచ్చి, ఈ సంగతులను తన యజమానికి[a] తెలియజేశాడు. అప్పుడు ఇంటి యజమాని కోపంతో తన సేవకునితో, ‘వెంటనే బయలుదేరి పట్టణంలోని విశాల వీధుల్లోకీ సందుల్లోకీ వెళ్లి, పేదవారిని, అంగవైకల్యం ఉన్నవారిని[b], చూపులేనివారిని, కుంటివారిని ఇక్కడికి తీసుకురా’ అన్నాడు.
  to: ఆ సేవకుడు తిరిగి వచ్చి, ఈ సంగతులను తన యజమానికి[a] తెలియజేశాడు. అప్పుడు ఇంటి యజమాని కోపగించి తన సేవకునితో, ‘వెంటనే బయలుదేరి పట్టణంలోని విశాల వీధులకూ సందులకూ వెళ్లి, పేదవారిని, అంగవైకల్యం ఉన్నవారిని[b], చూపులేనివారిని, కుంటివారిని ఇక్కడ లోపలికి తీసుకురా’ అన్నాడు.
  rationale: The revision preserves the draft’s sound modern Telugu while making explicit the ‘bring in’ sense of εἰσάγαγε, more closely representing the master’s angry reaction, and refining the lexical alternative for ἀναπείρους. No doctrinal or interpretive expansion has been introduced.
