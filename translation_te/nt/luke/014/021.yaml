id: LUK.14.21
reference: Luke 14:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ παραγενόμενος ὁ ⸀δοῦλος ἀπήγγειλεν τῷ κυρίῳ αὐτοῦ ταῦτα. τότε ὀργισθεὶς ὁ οἰκοδεσπότης εἶπεν τῷ δούλῳ αὐτοῦ· Ἔξελθε ταχέως εἰς τὰς πλατείας καὶ ῥύμας τῆς πόλεως, καὶ τοὺς πτωχοὺς καὶ ἀναπείρους καὶ ⸂τυφλοὺς καὶ χωλοὺς⸃ εἰσάγαγε ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/021.yaml
  text: And when the servant came back[a], he reported these things to his lord. Then the master of the house, becoming angry, said to his servant, ‘Go out quickly into the broad streets and lanes of the city[b], and bring in here the poor and disabled and blind and lame.’
translation:
  language: te
  text: ఆ సేవకుడు తిరిగి వచ్చి, ఈ సంగతులను తన యజమానికి[a] తెలియజేశాడు. అప్పుడు ఇంటి యజమాని కోపగించి తన సేవకునితో, ‘వెంటనే బయలుదేరి పట్టణంలోని విశాల వీధులకూ సందులకూ వెళ్లి, పేదవారిని, అంగవైకల్యం ఉన్నవారిని[b], చూపులేనివారిని, కుంటివారిని ఇక్కడ లోపలికి తీసుకురా’ అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యజమాని’గా అనువదించిన κύριος అనే పదం ఇక్కడ దేవుణ్ణి సూచించే బిరుదు కాదు; సేవకుని మానవ అధిపతిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అవయవ లోపం ఉన్నవారిని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: తిరిగి వచ్చి
  rationale: సేవకుడు అంతకుముందు అప్పగించిన పనిని చేసి నివేదించడానికి వచ్చాడనే కథన సందర్భాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; క్రియలోని రాక భావాన్ని నిలుపుతుంది.
- source_word: δοῦλος
  choice: సేవకుడు
  rationale: ఈ ఉపమానంలోని గృహ సంబంధ పాత్రపై దృష్టి ఉన్నందున, సామాజిక బానిస స్థితిని ముందుకు తెచ్చే ‘బానిస’ కంటే ‘సేవకుడు’ సందర్భోచితంగా, సహజంగా ఉంది.
- source_word: ἀπήγγειλεν
  choice: తెలియజేశాడు
  rationale: తనకన్నా ఉన్నతునికి జరిగిన సంగతులను నివేదించే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: κυρίῳ
  choice: యజమానికి
  rationale: ఇక్కడ κύριος దేవునికి లేదా క్రీస్తుకు చెందిన బిరుదు కాక, సేవకుని మానవ అధిపతిని సూచిస్తుంది.
- source_word: ὀργισθεὶς
  choice: కోపంతో
  rationale: యజమాని విన్నదానికి ప్రతిస్పందనగా కోపగించి మాట్లాడాడనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἰκοδεσπότης
  choice: ఇంటి యజమాని
  rationale: ఇల్లు లేదా కుటుంబ వ్యవహారాలకు అధిపతిని సూచించే మూలపదంలోని గృహ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ταχέως
  choice: వెంటనే
  rationale: ఆజ్ఞలోని అత్యవసరతను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: πλατείας
  choice: విశాల వీధులు
  rationale: వెడల్పైన బహిరంగ వీధులను సూచించి, తరువాతి సన్నని సందులతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ῥύμας
  choice: సందులు
  rationale: పట్టణంలోని చిన్న లేదా సన్నని దారులను సూచించే సహజమైన తెలుగు పదం.
- source_word: πτωχούς
  choice: పేదవారు
  rationale: ఆర్థికంగా దరిద్రులైన ప్రజలను నేరుగా, గౌరవప్రదంగా సూచిస్తుంది.
- source_word: ἀναπείρους
  choice: అంగవైకల్యం ఉన్నవారు
  rationale: శారీరక అవయవ లోపం లేదా వైకల్యం ఉన్నవారిని సూచించే మూలపదాన్ని ఆధునిక, గౌరవప్రదమైన వ్యక్తి-కేంద్రిత భాషలో అందిస్తుంది.
- source_word: τυφλούς
  choice: చూపులేనివారు
  rationale: అంధులను ఆధునిక, గౌరవప్రదమైన తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: χωλούς
  choice: కుంటివారు
  rationale: నడకలో శారీరక లోపం ఉన్నవారిని సూచించే మూలపదానికి నేరమైన, సామాన్యులకు అర్థమయ్యే సమానార్థకం.
- source_word: εἰσάγαγε ὧδε
  choice: ఇక్కడికి తీసుకురా
  rationale: వారిని లోపలికి లేదా విందు జరిగే చోటికి తీసుకురావాలనే ఆజ్ఞను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఉపమానంలోని δοῦλος పదం
  choice: సేవకుడు
  alternative: బానిస
  rationale: ఈ వాక్యంలో బంధిత సామాజిక స్థితికన్నా యజమాని ఆజ్ఞను నెరవేర్చే గృహ సేవకుని పాత్ర ప్రధానంగా ఉంది; అందువల్ల ‘సేవకుడు’ సరిపోతుంది, అయితే మూలపదానికి ‘బానిస’ అనే విస్తృత అర్థం ఉండగలదు.
- issue: మానవ వ్యక్తిని సూచించే κύριος పదం
  choice: యజమాని
  alternative: ప్రభువు
  rationale: ఇక్కడ సూచించబడినవాడు కథలోని సేవకుని మానవ అధిపతి; దైవ బిరుదుగా అపార్థం కాకుండా ‘యజమాని’ ఎంచుకోబడింది.
- issue: ἀνάπηρος సూచించే వైకల్య స్వభావం
  choice: అంగవైకల్యం ఉన్నవారు
  alternative: అవయవాలు దెబ్బతిన్నవారు
  rationale: మూలపదం శారీరక వైకల్యం లేదా అవయవ లోపాన్ని సూచించగలదు. నిర్దిష్ట గాయ స్థితిని అనవసరంగా ఖరారు చేయకుండా విస్తృత భావాన్ని నిలిపే గౌరవప్రదమైన పదబంధం ఎంచుకోబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవభరితమైన కథన శైలి వాడబడింది. వైకల్యాన్ని సూచించే చోట వీలైనంత వ్యక్తి-కేంద్రిత భాషను ఎంచుకొని, πτωχούς, ἀναπείρους, τυφλούς, χωλούς అనే నాలుగు వేర్వేరు వర్గాలను మూలంలోని క్రమంలోనే ఉంచాం. πλατείας–ῥύμας మధ్య వ్యత్యాసాన్ని ‘విశాల వీధులు–సందులు’గా నిలిపాం.
