  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὔτε εἰς γῆν οὔτε εἰς κοπρίαν εὔθετόν ἐστιν· ἔξω βάλλουσιν αὐτό. ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/035.yaml
  text: It is fit neither for the soil nor for the manure pile[a]; they throw it outside. The one who has ears to hear[b], let him hear.
translation:
  language: te
  text: అది నేలకు గానీ ఎరువుకుప్పకు గానీ పనికిరాదు[a]; దాన్ని బయట పారవేస్తారు. వినడానికి చెవులు ఉన్నవాడు వినాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పేడకుప్పకు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వినడానికి చెవులు ఉన్నవారెవరైనా వినాలి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆν
  choice: నేలకు
  rationale: వ్యవసాయ సందర్భంలో γῆ సాగు నేలను సూచిస్తుంది; విశ్వార్థంలోని ‘భూమి’ కంటే ‘నేల’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: κοπρίαν
  choice: ఎరువుకుప్పకు
  rationale: κοπρία పేడ లేదా దానితో ఏర్పడిన ఎరువుకుప్పను సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో ‘ఎరువుకుప్ప’ వ్యవసాయ చిత్రాన్ని స్పష్టంగా ఉంచుతుంది; మరింత ప్రత్యక్షమైన ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: εὔθετόν
  choice: పనికిరాదు
  rationale: εὔθετος యొక్క ‘తగినది/ఉపయోగపడేది’ అనే భావాన్ని ‘నేలకు గానీ... గానీ పనికిరాదు’ అనే సహజ తెలుగు నిర్మాణం అందిస్తుంది.
- source_word: ἔξω βάλλουσιν αὐτό
  choice: దాన్ని బయట పారవేస్తారు
  rationale: గ్రీకులోని అనిర్దిష్ట బహువచన కర్తతో కూడిన కర్తరి ప్రయోగాన్ని నిలుపుతూ, ἔξω యొక్క ‘బయట’ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ ἔχων ὦτα ἀκούειν ἀκουέτω
  choice: వినడానికి చెవులు ఉన్నవాడు వినాలి
  rationale: ὁ ἔχων అనే ఏకవచన పుంలింగ నిర్మాణాన్ని ‘ఉన్నవాడు’గా, ἀκουέτω యొక్క ఆజ్ఞాత్మక బలాన్ని సహజ తెలుగులో ‘వినాలి’గా నిలుపుతుంది.
theological_decisions:
- issue: ముగింపు హెచ్చరికలో ప్రతినిధి పుంలింగ ఏకవచనం
  choice: వినడానికి చెవులు ఉన్నవాడు వినాలి
  alternative: వినడానికి చెవులు ఉన్నవారెవరైనా వినాలి
  rationale: గ్రీకు వ్యాకరణపరంగా పుంలింగ ఏకవచనంలో ఉన్నప్పటికీ సాధారణంగా ప్రతి వ్యక్తికీ వర్తిస్తుంది. ప్రధాన పాఠం మూల నిర్మాణాన్ని కాపాడుతుంది; దాని సమగ్ర ప్రతినిధి భావాన్ని పాదసూచికలో సహజ ప్రత్యామ్నాయంతో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. వ్యవసాయ సంబంధిత ప్రత్యక్ష చిత్రాన్ని నిలుపుతూ, కృత్రిమమైన పదానువాదాన్ని నివారించాం.
