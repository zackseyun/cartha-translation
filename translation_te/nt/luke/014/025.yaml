  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘జనసమూహాలు’ ద్వారా మూలంలోని బహువచనాన్ని నిలిపి, ‘ప్రయాణిస్తుండగా’ ద్వారా అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న నేపథ్య చర్యను వ్యక్తం చేశాం.
