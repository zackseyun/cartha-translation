  text: Συνεπορεύοντο δὲ αὐτῷ ὄχλοι πολλοί, καὶ στραφεὶς εἶπεν πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/025.yaml
  text: 'Large crowds were traveling with him[a], and turning, he said to them:'
translation:
  language: te
  text: 'అనేక జనసమూహాలు ఆయనతో కలిసి ప్రయాణిస్తుండగా[a], ఆయన తిరిగి వారితో ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “అనేక జనసమూహాలు ఆయనతో పాటు వెళ్తున్నాయి.” గ్రీకు క్రియ గతంలో కొనసాగుతున్న చర్యను సూచిస్తుంది: జనసమూహాలు ఆయనతో పాటు ప్రయాణిస్తూ ఉన్నాయి.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνεπορεύοντο
  choice: కలిసి ప్రయాణిస్తుండగా
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న ప్రయాణాన్ని, ఆయనకు తోడుగా వెళ్లడాన్ని సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో ‘ప్రయాణిస్తుండగా’ ఆ నేపథ్య చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది బలమైన వ్యతిరేకతను కాక స్వల్ప కథన మలుపును సూచిస్తుంది. తెలుగులో వాక్య నిర్మాణమే ఆ మార్పును స్పష్టంగా చూపుతుంది; ‘అప్పుడు’ అని చేరిస్తే మూలంలో లేని నిర్దిష్ట కాలభావం రావచ్చు.
- source_word: αὐτῷ
  choice: ఆయనతో
  rationale: సహచర్యాన్ని తెలిపే దత్తివిభక్తి భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; సందర్భంలో వ్యక్తి యేసు అని స్పష్టంగా ఉన్నందున మూలంలోని సర్వనామాన్ని నిలుపుతుంది.
- source_word: ὄχλοι πολλοί
  choice: అనేక జనసమూహాలు
  rationale: ὄχλοι అనే బహువచన రూపాన్నీ, πολλοί తెలిపే అధిక సంఖ్యనూ నిలుపుతుంది. ‘చాలా మంది ప్రజలు’ కంటే జనసమూహాల బహుత్వాన్ని ఇది స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ
  choice: వాక్యంలోని ప్రధాన-ఉపవాక్య అనుసంధానం
  rationale: గ్రీకు సరళ అనుసంధానాన్ని తెలుగులో ‘…ఉండగా, ఆయన…’ అనే సహజ నిర్మాణం ద్వారా అందించింది; అదనపు ఫలితార్థం లేదా కాలార్థం చేర్చలేదు.
- source_word: στραφεὶς
  choice: వారి వైపు తిరిగి
  rationale: క్రియకు ముందు జరిగిన సహజ కథన చర్యను వ్యక్తం చేస్తుంది. πρὸς αὐτούς తో కలిపి ‘వారి వైపు’ అనడం తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: εἶπεν
  choice: ఇలా అన్నాడు
  rationale: λέγω యొక్క సాధారణ కథనార్థాన్ని ఇస్తుంది. తరువాత వచ్చే ప్రత్యక్ష మాటలకు ద్విబిందువు ఉన్నందున ‘ఇలా’ సహజమైన తెలుగు పరిచయ పదంగా పనిచేస్తుంది.
- source_word: πρὸς αὐτούς
  choice: వారి వైపు … అన్నాడు
  rationale: మాట ఎవరిని ఉద్దేశించి చెప్పబడిందో సూచిస్తుంది. తెలుగులో తిరగడానికీ సంభాషణకీ ఒకే సమూహం లక్ష్యమని సహజంగా తెలియజేస్తుంది.
