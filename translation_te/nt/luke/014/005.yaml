  source_fidelity: మూలపాఠంలోని υἱός (‘కుమారుడు’), βοῦς (‘ఎద్దు’), φρέαρ (‘బావి’), εὐθέως (‘వెంటనే’)లను ముసాయిదా సరిగ్గా ప్రతిబింబిస్తుంది. అయితే σαββάτου అనేది నిర్దిష్టమైన ‘సబ్బాతు’ను సూచిస్తుంది; ‘విశ్రాంతి రోజు’ అనడం దానిని సాధారణీకరించే అవకాశం ఉంది. అలాగే ‘దాన్ని’ అనే ఒకే సర్వనామం కుమారునికీ వర్తిస్తున్నట్లు ఉండి వ్యక్తిని వస్తువుగా సూచిస్తుంది.
  naturalness: అలంకారిక ప్రశ్న సహజంగానే ఉంది. అయినా ‘అతనిని గానీ దానిని గానీ’ అని చెప్పడం కుమారుడు/ఎద్దు అనే రెండు అవకాశాలకు తెలుగులో స్పష్టమైన, గౌరవప్రదమైన సూచనను ఇస్తుంది. ‘సబ్బాతు రోజున’ అనేది ఆధునిక ప్రామాణిక వాడుకలో స్పష్టంగా ఉంటుంది.
