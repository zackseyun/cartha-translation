id: LUK.14.5
reference: Luke 14:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀καὶ πρὸς αὐτοὺς εἶπεν· Τίνος ὑμῶν υἱὸς ἢ βοῦς εἰς φρέαρ ⸀πεσεῖται, καὶ οὐκ εὐθέως ἀνασπάσει αὐτὸν ⸀ἐν ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/005.yaml
  text: And he said to them[a], “Which of you, if a son or an ox falls into a well, will not immediately pull him out on the Sabbath day?”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “మీలో ఎవరి కుమారుడో[a] లేదా ఎద్దో బావిలో పడితే, సబ్బాతు రోజున వెంటనే అతనిని గానీ దానిని గానీ పైకి లాగి తీయకుండా ఉంటారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో “కుమారుడు”కు బదులు “గాడిద” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: Τίνος ὑμῶν
  choice: మీలో ఎవరి
  rationale: ఈ అలంకారిక ప్రశ్నలోని సంబంధార్థక విచారణను సహజమైన తెలుగు ప్రయోగంతో వ్యక్తం చేస్తుంది.
- source_word: υἱὸς
  choice: కుమారుడు
  rationale: గ్రీకు పదం సాధారణంగా ‘బిడ్డ’ అని కాక పురుషలింగ ఏకవచనంగా ‘కుమారుడు’ అని నిర్దిష్టంగా ఉంది.
- source_word: βοῦς
  choice: ఎద్దు
  rationale: పని చేసే గోవు జాతి జంతువును సూచించే ఈ పదానికి సందర్భోచితమైన సాధారణ తెలుగు సమానం.
- source_word: φρέαρ
  choice: బావి
  rationale: మూలపదం సహజంగా బావిని సూచిస్తుంది; సమాంతర వాక్యాలకు అనుగుణంగా ‘గుంట’ అని మార్చలేదు.
- source_word: πεσεῖται
  choice: పడితే
  rationale: భవిష్యదర్థక రూపం ఈ షరతుతో కూడిన అలంకారిక ప్రశ్నలో తెలుగులో సహజంగా ‘పడితే’ అవుతుంది.
- source_word: εὐθέως
  choice: వెంటనే
  rationale: రక్షించడంలో ఆలస్యం ఉండదనే కాల అత్యవసరతను నిలుపుతుంది.
- source_word: ἀνασπάσει
  choice: పైకి లాగు
  rationale: కింద పడినదాన్ని లాగి పైకి తీయడమనే క్రియ యొక్క దృశ్యార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: αὐτὸν
  choice: దాన్ని
  rationale: తెలుగులో కుమారుడు లేదా ఎద్దు అనే రెండు ముందస్తు నామాలకు తిరిగి సూచించే సహజ ఏకవచన సర్వనామం; క్రియలో గౌరవ/జీవత్వ భేదాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: ἐν ἡμέρᾳ τοῦ σαββάτου
  choice: విశ్రాంతి రోజున
  rationale: ἡμέρα (‘రోజు’)ను వ్యక్తం చేస్తూ, σαββάτου యొక్క సందర్భార్థాన్ని సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ఉదాహరణలో బావిలో పడే వ్యక్తి లేదా జంతువు గురించిన పాఠాంతరం
  choice: కుమారుడు లేదా ఎద్దు
  alternative: గాడిద లేదా ఎద్దు
  rationale: ఇచ్చిన SBLGNT మూలపాఠంలో υἱὸς (‘కుమారుడు’) ఉంది; అందువల్ల ప్రధాన పాఠంలో దానినే అనుసరించి, ఇతర ప్రతుల పాఠాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన అలంకారిక ప్రశ్నగా మలిచాం. మూలంలోని ‘బావి,’ ‘వెంటనే,’ ‘విశ్రాంతి రోజు’ అనే అంశాలను నిలిపాం; పాఠాంతర సూచిక [a] ప్రధాన పాఠంలో సంబంధిత పదం వెంట ఉంచబడింది.
