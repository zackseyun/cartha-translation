source:
  edition: SBLGNT
  text: εἰ δὲ μήγε, ἔτι ⸂αὐτοῦ πόρρω⸃ ὄντος πρεσβείαν ἀποστείλας ἐρωτᾷ ⸀τὰ πρὸς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/032.yaml
  text: But if not[a], while the other is still far away[b], he sends a delegation and asks for terms of peace.
translation:
  language: te
  text: అలా కాకపోతే, అవతలి రాజు ఇంకా దూరంలో ఉండగా, ఇతడు ఒక రాయబారి బృందాన్ని[a] పంపి శాంతి షరతులను[b] కోరతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రాయబారులను.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘శాంతికి సంబంధించిన విషయాలు’; అంటే, శాంతిని సాధించడానికి అవసరమైన షరతులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ μήγε
  choice: అలా చేయలేకపోతే
  rationale: మునుపటి వచనంలో చెప్పిన యుద్ధసామర్థ్యం తనకు లేదని లెక్క తేలే పరిస్థితిని ఈ షరతుతో అనుసంధానిస్తుంది. తెలుగు సందర్భంలో ‘అలా చేయలేకపోతే’ సహజంగా ఉండి గ్రీకు భావాన్ని స్పష్టం చేస్తుంది.
- source_word: ἔτι αὐτοῦ πόρρω ὄντος
  choice: అవతలి రాజు ఇంకా దూరంలో ఉన్నప్పుడే
  rationale: Genitive absolute సమకాలీన పరిస్థితిని సూచిస్తుంది. αὐτοῦ అనేది మాట్లాడుతున్న రాజును కాక ప్రత్యర్థి రాజును సూచిస్తుంది; ‘అవతలి రాజు’ అనడం సందర్భాన్ని అతిగా వివరించకుండా సూచనను స్పష్టం చేస్తుంది.
- source_word: πρεσβείαν
  choice: ఒక రాయబారి బృందాన్ని
  rationale: ఈ పదం రాయబార కార్యం కోసం పంపే ప్రతినిధుల బృందాన్ని సూచించగలదు. ఆధునిక తెలుగులో ‘రాయబారి బృందం’ సహజంగా, రాజకీయ సందర్భానికి తగినట్లు ఉంటుంది.
- source_word: ἀποστείλας
  choice: పంపి
  rationale: Aorist participle ప్రధాన క్రియకు ముందు జరిగే అనుబంధ చర్యను సూచిస్తుంది. ‘పంపి ... కోరతాడు’ అనే తెలుగు నిర్మాణం చర్యల క్రమాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἐρωτᾷ
  choice: కోరతాడు
  rationale: ఇక్కడ ἐρωτάω కేవలం ప్రశ్నించడం కాక అభ్యర్థించడం లేదా కోరడం అనే భావాన్ని ఇస్తుంది.
- source_word: τὰ πρὸς εἰρήνην
  choice: శాంతి షరతులు
  rationale: అక్షరార్థంగా ‘శాంతికి సంబంధించిన విషయాలు’ అయిన ఈ ప్రయోగం యుద్ధ సందర్భంలో శాంతిని సాధించే నిబంధనలు లేదా షరతులను సూచిస్తుంది.
