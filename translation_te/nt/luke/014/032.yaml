  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇతడు’ మరియు ‘అవతలి రాజు’ అనే పదాలతో ఇద్దరు రాజుల మధ్య సూచన స్పష్టతను కాపాడాం.
