revisions:
- from: అప్పుడు నీవు ధన్యుడవుతావు; ఎందుకంటే వారు నీకు తిరిగి ప్రతిఫలం ఇవ్వలేరు[a]. నీతిమంతుల పునరుత్థాన సమయంలో[b] నీకు ప్రతిఫలం ఇవ్వబడుతుంది.
  to: నీవు ధన్యుడవుతావు, ఎందుకంటే వారు నీకు తిరిగి ప్రతిఫలం ఇవ్వలేరు[a]; ఎందుకనగా నీతిమంతుల పునరుత్థాన సమయంలో[b] నీకు ప్రతిఫలం ఇవ్వబడుతుంది.
  rationale: A safe, source-driven revision removes the unsupported temporal “అప్పుడు.” The causal relationship introduced by γάρ is retained explicitly with “ఎందుకనగా.” The wording continues to preserve the Greek passive, the reciprocal repayment language, and the unresolved scope of “the resurrection of the righteous.” Footnote a is clarified for idiomatic Telugu without changing its lexical explanation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:44:07Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys μακάριος, the inability implied by οὐκ ἔχουσιν ἀνταποδοῦναί σοι, the future passive repayment, and the resurrection of the righteous. However, the opening “అప్పుడు” (“then”) adds a temporal inference not expressed by καί, which is simply connective (“and”).
  naturalness: The Telugu is generally clear and appropriately formal. Removing “అప్పుడు” makes the opening both more faithful and more natural in its immediate context. “ఎందుకనగా” clearly represents γάρ without importing additional interpretation.
  terminology: “ధన్యుడు,” “ప్రతిఫలం,” “పునరుత్థానం,” and “నీతిమంతులు” are suitable modern-standard Telugu renderings and preserve the verse’s theological register. The passive “ప్రతిఫలం ఇవ్వబడుతుంది” appropriately leaves the giver unstated, as in Greek.
  issues:
  - severity: medium
    issue: “అప్పుడు” at the beginning
    rationale: The Greek begins with καί (“and”), not a temporal adverb. “అప్పుడు” can imply “then/at that time,” an element not supplied by this verse.
  - severity: low
    issue: Footnote a’s literal wording is slightly elliptical
    rationale: “నీకు తిరిగి ఇవ్వడానికి వారికి లేదు” is understandable but incomplete in Telugu. “నీకు తిరిగి చెల్లించే సామర్థ్యం వారికి లేదు” more clearly explains the idiomatic Greek construction while preserving its sense of inability or lack of means.
  revised_text: నీవు ధన్యుడవుతావు, ఎందుకంటే వారు నీకు తిరిగి ప్రతిఫలం ఇవ్వలేరు[a]; ఎందుకనగా నీతిమంతుల పునరుత్థాన సమయంలో[b] నీకు ప్రతిఫలం ఇవ్వబడుతుంది.
