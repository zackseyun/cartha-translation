source:
  edition: SBLGNT
  text: καὶ μακάριος ἔσῃ, ὅτι οὐκ ἔχουσιν ἀνταποδοῦναί σοι, ἀνταποδοθήσεται γάρ σοι ἐν τῇ ἀναστάσει τῶν δικαίων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/014.yaml
  text: And you will be blessed[a], because they cannot repay you[b]; for you will be repaid at the resurrection of the righteous.
translation:
  language: te
  text: నీవు ధన్యుడవుతావు, ఎందుకంటే వారు నీకు తిరిగి ప్రతిఫలం ఇవ్వలేరు[a]; ఎందుకనగా నీతిమంతుల పునరుత్థాన సమయంలో[b] నీకు ప్రతిఫలం ఇవ్వబడుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీకు తిరిగి చెల్లించే సామర్థ్యం వారికి లేదు”; ఇది వారి అసమర్థతను లేదా అందుకు కావలసిన వనరులు లేకపోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీతిమంతుల పునరుత్థానంలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: ధన్యుడవుతావు
  rationale: యేసు పలికిన ధన్యత వాక్యాలకు తగిన ఆధ్యాత్మిక, అంత్యకాలిక భావాన్ని ‘ధన్యుడు’ నిలుపుతుంది; కేవలం మనోభావాన్ని సూచించే ‘సంతోషంగా’ కంటే ఇది బలమైనది.
- source_word: οὐκ ἔχουσιν ἀνταποδοῦναί σοι
  choice: వారు నీకు తిరిగి ప్రతిఫలం ఇవ్వలేరు
  rationale: గ్రీకు నిర్మాణం అక్షరార్థంగా ‘తిరిగి ఇవ్వడానికి వారికి లేదు’ అని ఉన్నా, సందర్భంలో వారి అసమర్థత లేదా వనరుల లేమిని సూచిస్తుంది. ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνταποδοθήσεται
  choice: నీకు ప్రతిఫలం ఇవ్వబడుతుంది
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ, ప్రతిఫలం ఇచ్చే కర్తను వచనం పేర్కొననట్లే అనువాదమూ పేర్కొనదు. ముందున్న ‘ప్రతిఫలం ఇవ్వలేరు’తో పదసంబంధాన్ని కూడా నిలుపుతుంది.
- source_word: ἐν τῇ ἀναστάσει
  choice: పునరుత్థాన సమయంలో
  rationale: ἐν ఇక్కడ కాలాన్ని సూచిస్తుంది. ‘సమయంలో’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, సంఘటన జరిగే వేళను స్పష్టంగా తెలియజేస్తుంది.
- source_word: τῶν δικαίων
  choice: నీతిమంతుల
  rationale: ఈ షష్ఠీ విభక్తి ఎవరి పునరుత్థానం ఉద్దేశించబడిందో సూచిస్తుంది; ‘నీతిమంతులు’ δίκαιος పదంలోని నైతిక-దైవశాస్త్రీయ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘నీతిమంతుల పునరుత్థానం’ అనే మాట యొక్క పరిధి
  choice: నీతిమంతులతో సంబంధమున్న భవిష్యత్ పునరుత్థానంగా నేరుగా అనువదించబడింది.
  alternative: అందరి సాధారణ పునరుత్థానంలో నీతిమంతులపై ప్రత్యేక దృష్టి; లేదా ఇతరుల పునరుత్థానానికి భిన్నమైన నీతిమంతుల పునరుత్థానం.
  rationale: ఈ వాక్యం పునరుత్థాన సమయంలో నీతిమంతులకు కలిగే దైవిక ప్రతిఫలాన్ని ప్రకటిస్తుంది; అయితే పునరుత్థానాల కాలక్రమం లేదా సంఖ్యను నిర్ణయించదు. అందువల్ల విస్తృత అంత్యకాల సిద్ధాంత వివాదాన్ని అనువాదం పరిష్కరించదు.
- issue: ప్రతిఫలం ఇచ్చే కర్త
  choice: గ్రీకు కర్మణి ప్రయోగాన్ని అనుసరించి కర్తను పేర్కొనలేదు.
  alternative: ‘దేవుడు నీకు ప్రతిఫలం ఇస్తాడు’ అని కర్తను స్పష్టంగా చేర్చడం.
  rationale: సందర్భంలో దేవుడే ప్రతిఫలం ఇచ్చేవాడని భావించవచ్చుగానీ, మూలవచనం కర్తను నేరుగా చెప్పదు; కాబట్టి అనువాదం ఆ అంతర్నిహిత భావాన్ని వివరణగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ప్రతిఫలం’ అనే పదాన్ని క్రియాశీల, కర్మణి భాగాల్లో రెండింటిలోనూ ఉంచి గ్రీకు మూలంలోని పరస్పర పదసంబంధాన్ని సాధ్యమైనంతవరకు నిలిపాం.
