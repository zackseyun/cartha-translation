  text: And behold[a], a certain man with dropsy was before him.
translation:
  language: te
  text: ఇదిగో[a], శరీరంలో నీరు చేరి వాపు వచ్చిన ఒక వ్యక్తి ఆయన ఎదుట ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ఉన్న పదం శరీరంలో అసాధారణంగా ద్రవం చేరి వాపు కలిగే స్థితిని సూచిస్తుంది; దీనిని వైద్యపరంగా ఎడీమా అని కూడా అంటారు.
    reason: lexical clarification of ὑδρωπικός
lexical_decisions:
- source_word: καὶ
  choice: (ప్రత్యేకంగా అనువదించలేదు)
  rationale: తెలుగులో వాక్యారంభంలో ‘మరియు’ అనడం అసహజంగా ఉంటుంది; ἰδοὺతో కథన సంబంధం సహజంగానే కొనసాగుతుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: దృష్టిని ఆకర్షించే గ్రీకు సంభాషణ సూచకపు జీవంతమైన కథన బలాన్ని నిలుపుతుంది.
- source_word: ἄνθρωπός τις
  choice: ఒక వ్యక్తి
  rationale: పేరు చెప్పని నిర్దిష్ట వ్యక్తిని సూచించే τις భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἦν
  choice: ఉన్నాడు
  rationale: సందర్భంలోని స్థితిని తెలిపే εἰμί అపూర్ణ భూతకాల రూపానికి సహజమైన తెలుగు ప్రయోగం.
- source_word: ὑδρωπικὸς
  choice: నీరు పట్టిన వ్యాధితో బాధపడుతున్న
  rationale: శరీరంలో అసాధారణంగా ద్రవం చేరి వాపు కలిగే స్థితిని సాధారణ పాఠకులకు అర్థమయ్యేలా తెలియజేస్తుంది; అరుదైన వైద్యపదాన్ని ప్రధాన పాఠ్యంలో నివారిస్తుంది.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: ఆయన ఎదుట
  rationale: స్థానపరంగా ‘ముందు’ అనే భావాన్నీ, ఆయన సన్నిధిలో ఉన్నాడనే సందర్భార్థాన్నీ నిలుపుతుంది.
