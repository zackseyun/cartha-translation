translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన ‘ఆయన’ వాడబడింది. వైద్యస్థితిని సులభంగా అర్థమయ్యే వర్ణనాత్మక పదబంధంతో తెలిపి, వాక్యాన్ని సహజంగా ఉంచాం.
