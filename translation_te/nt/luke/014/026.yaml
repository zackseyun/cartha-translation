id: LUK.14.26
reference: Luke 14:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἴ τις ἔρχεται πρός με καὶ οὐ μισεῖ τὸν πατέρα ⸀ἑαυτοῦ καὶ τὴν μητέρα καὶ τὴν γυναῖκα καὶ τὰ τέκνα καὶ τοὺς ἀδελφοὺς καὶ τὰς ἀδελφάς, ἔτι ⸀τε καὶ τὴν ⸂ψυχὴν ἑαυτοῦ⸃, οὐ δύναται ⸂εἶναί μου μαθητής⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/026.yaml
  text: If anyone comes to me and does not hate his own father and mother and wife and children and brothers and sisters—and even his own life—he cannot be my disciple[a][b].
translation:
  language: te
  text: “ఎవరైనా నా వద్దకు వచ్చి, తన సొంత తండ్రిని, తల్లిని, భార్యను, పిల్లలను, అన్నదమ్ములను, అక్కచెల్లెళ్లను—అంతేకాక తన సొంత ప్రాణాన్ని కూడా—ద్వేషించకపోతే[a][b], అతడు నా శిష్యుడు కాలేడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని నాకంటే తక్కువగా ప్రేమించకపోతే.” ఇక్కడి క్రియ అక్షరార్థంగా “ద్వేషించు.” అయితే ఈ సందర్భంలో, అత్యంత సన్నిహిత కుటుంబ బంధాలకన్నా యేసుపట్ల విధేయతకు ప్రథమ స్థానం ఇవ్వాలనే డిమాండును అది వ్యక్తం చేస్తుంది; మత్తయి 10:37తో పోల్చండి.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తన సొంత ఆత్మను.” శిష్యరికానికి చెల్లించాల్సిన మూల్యాన్ని తెలిపే ఈ సందర్భంలో, ψυχή అనే పదానికి “ప్రాణం” లేదా “జీవితం” అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισεῖ
  choice: ద్వేషించకపోతే
  rationale: గ్రీకు క్రియ యొక్క ప్రత్యక్షమైన, ఉద్దేశపూర్వకంగా కఠినమైన భావాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది. ఈ సందర్భంలో ఇది యేసుపట్ల విధేయతకు కుటుంబ బంధాలకన్నా, సొంత ప్రాణానికన్నా అగ్రస్థానం ఇవ్వాలనే తులనాత్మక భావాన్ని సూచించవచ్చు; ఆ భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: ἔρχεται πρός με
  choice: నా దగ్గరికి వచ్చి
  rationale: πρός με అనే సంబంధాత్మక గమనాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది; మూలంలో లేని ‘నా వెంట’ అనే శిష్యరిక నుడికారాన్ని చేర్చదు.
- source_word: πατέρα ἑαυτοῦ
  choice: తన సొంత తండ్రిని
  rationale: ἑαυτοῦ లోని ఆత్మార్థక, వ్యక్తిగత బలాన్ని ‘తన సొంత’ ద్వారా నిలుపుతుంది.
- source_word: γυναῖκα
  choice: భార్యను
  rationale: కుటుంబ సభ్యుల జాబితాలో γυνή కి సందర్భోచితమైన అర్థం ‘భార్య’.
- source_word: ἀδελφοὺς καὶ ἀδελφάς
  choice: అన్నదమ్ములను, అక్కచెల్లెళ్లను
  rationale: మూలంలో పురుష, స్త్రీ సహోదర పదాలు రెండూ స్పష్టంగా ఉన్నాయి. ఆధునిక తెలుగులో సహజంగా రెండింటినీ విడిగా వ్యక్తం చేస్తుంది.
- source_word: ἔτι τε καὶ
  choice: అంతేకాదు, ... కూడా
  rationale: జాబితాలో చివరి అంశానికి ఇచ్చిన పరాకాష్ఠ బలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ψυχὴν ἑαυτοῦ
  choice: తన సొంత ప్రాణాన్ని
  rationale: శిష్యరిక మూల్యాన్ని తెలిపే ఈ సందర్భంలో ψυχή వ్యక్తి ప్రాణం/జీవితాన్ని సూచిస్తుంది. ‘ప్రాణం’ మూలపదంలోని విస్తృతతను ఉంచుతూ, కేవలం దేహరహిత ఆత్మ అనే సంకుచిత భావాన్ని రుద్దదు.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: అతడు నా శిష్యుడు కాలేడు
  rationale: అసమర్థత లేదా అననుకూలతను సూచించే గ్రీకు నిర్మాణ బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ఇది కేవలం నిషేధం కాదు.
theological_decisions:
- issue: μισεῖ అనే కఠినమైన పదాన్ని ప్రధాన పాఠ్యంలో మృదుపరచాలా?
  choice: ‘ద్వేషించు’ అనే ప్రత్యక్ష పదాన్ని ప్రధాన పాఠ్యంలో ఉంచి, తులనాత్మక/ప్రాధాన్య భావాన్ని పాదసూచికలో వివరించడం.
  alternative: ప్రధాన పాఠ్యంలోనే ‘తక్కువగా ప్రేమించు’ అని అనువదించడం.
  rationale: యేసు మాటలోని ఉద్దేశపూర్వక తీవ్రతను, వేదాంతపరమైన ఉద్వేగాన్ని అనువాదం ముందుగానే పరిష్కరించకుండా నిలుపుతుంది. మత్తయి 10:37తో పోలిస్తే కనిపించే ప్రాధాన్య భావాన్ని పాదసూచిక పాఠకునికి అందిస్తుంది.
- issue: ఈ వాక్యంలో ψυχή యొక్క భావం
  choice: ‘ప్రాణం’ అని అనువదించడం.
  alternative: ‘ఆత్మ’ లేదా ‘తనను తాను’ అని అనువదించడం.
  rationale: సందర్భం శిష్యరికానికి చెల్లించాల్సిన మూల్యం, సొంత ప్రాణంపై హక్కును కూడా యేసుపట్ల విధేయతకు లోబరచడం గురించి ఉంది. ‘ప్రాణం’ ఈ సందర్భార్థాన్ని తెలియజేస్తూ మానవ స్వభావంపై అవసరం లేని సంకుచిత సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘ద్వేషించు’ అనే కఠిన పదాన్ని ఉద్దేశపూర్వకంగా నిలిపి, దాని సందర్భార్థాన్ని పాదసూచికలో వివరించాం. కుటుంబ సంబంధాలకు తెలుగు సహజ జంటపదాలైన ‘అన్నదమ్ములు, అక్కచెల్లెళ్లు’ వాడాం.
