id: LUK.14.33
reference: Luke 14:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως οὖν πᾶς ἐξ ὑμῶν ὃς οὐκ ἀποτάσσεται πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν οὐ δύναται ⸂εἶναί μου⸃ μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/033.yaml
  text: So then[b][a], every one of you who does not renounce all his own possessions cannot be my disciple.
translation:
  language: te
  text: కాబట్టి, మీలో ప్రతి ఒక్కరూ తమకున్న ఆస్తులన్నిటినీ వదులుకోకపోతే నా శిష్యుడు కాలేడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమకున్న సమస్తానికి వీడ్కోలు చెప్పకపోతే.’ గ్రీకు క్రియకు ‘వీడ్కోలు చెప్పడం’ అనే అర్థం ఉండగలదు; ఇక్కడ అది తమకున్న ఆస్తులపై హక్కును లేదా పట్టును వదులుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως οὖν
  choice: అలాగే
  rationale: ముందున్న రెండు ఉపమానాలతో ఈ ముగింపు మాటకు ఉన్న అన్వయాన్ని, వాటి నుండి వచ్చే నిర్ధారణను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: πᾶς ἐξ ὑμῶν
  choice: మీలో ... ప్రతివాడూ
  rationale: ఈ షరతు వినేవారిలో ఒక్కొక్కరికీ వ్యక్తిగతంగా వర్తిస్తుందనే పంపిణీ భావాన్ని నిలుపుతుంది.
- source_word: ὃς οὐκ ἀποτάσσεται
  choice: వదులుకోని
  rationale: ἀποτάσσομαι అనే క్రియకు ‘వీడ్కోలు చెప్పడం’ అనే మూలభావం ఉంది; ఇక్కడ అది తనకున్న వాటిపై పట్టును లేదా హక్కును విడిచిపెట్టడాన్ని సూచిస్తుంది. ‘వదులుకోని’ ఈ తీవ్రతను సహజంగా తెలియజేస్తూ, తప్పనిసరిగా భౌతికంగా అన్నిటినీ అమ్మివేయడమే అని ముందే తేల్చదు.
- source_word: πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν
  choice: తనకున్న వాటన్నిటినీ
  rationale: ఈ ప్రయోగం ఒక వ్యక్తికి చెందిన ఆస్తులు లేదా వస్తుసంపదను సూచిస్తుంది. తెలుగు ఏకవచన ప్రతిబింబ సర్వనామమైన ‘తన’ గ్రీకు ἑαυτοῦ భావాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: నా శిష్యుడు కాలేడు
  rationale: ఇది కేవలం తగదని కాక, సాధ్యం కాదనే οὐ δύναται బలాన్ని సంక్షిప్తమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: μαθητής
  choice: శిష్యుడు
  rationale: యేసును అనుసరించడం, ఆయన వద్ద నేర్చుకోవడం అనే సంబంధపూర్వక భావాలను సువార్తల సందర్భంలో స్థిరంగా తెలియజేసే పదం.
theological_decisions:
- issue: తనకున్న వాటిని వదులుకోవాలనే ఆజ్ఞ స్వభావం
  choice: తనకున్న వాటన్నిటినీ ‘వదులుకోవడం’ అని అనువదించి, వాటిపై హక్కు లేదా పట్టును విడిచిపెట్టే భావాన్ని నిలుపడం
  alternative: ప్రతి శిష్యుడూ తన ఆస్తినంతటినీ అక్షరార్థంగా ఇచ్చివేయాలి లేదా అమ్మివేయాలి అన్నట్టుగా అనువదించడం
  rationale: ἀποτάσσεται అనే పదం నిర్ణయాత్మకంగా వీడ్కోలు చెప్పడం లేదా సంబంధాన్ని విడిచిపెట్టడం అనే భావాన్ని ఇస్తుంది. అనువాదం శిష్యత్వపు తీవ్రమైన డిమాండును తగ్గించకుండా, అది ప్రతి సందర్భంలోనూ తప్పనిసరి భౌతిక ఆస్తి విసర్జనే అని పాఠం చెప్పినదానికంటే ఎక్కువగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కాని సహజమైన శైలిని ఉపయోగించాం. ‘తన’ మరియు ‘ప్రతివాడూ’ ఏకవచన నిర్మాణాన్ని నిలుపుతూ సందర్భంలో ప్రతి శిష్యునికీ వర్తించే సాధారణ భావాన్ని ఇస్తాయి.
