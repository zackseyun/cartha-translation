  text: And another said[a], ‘I have married a wife, and for this reason I cannot come.’
translation:
  language: te
  text: మరొకడు, “నేను పెళ్లి చేసుకున్నాను. అందువల్ల రాలేను” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερος
  choice: మరొకడు
  rationale: సాకులు చెబుతున్న వరుసలో ఇంకొక వ్యక్తిని పరిచయం చేస్తుంది; సందర్భానికి సహజమైన తెలుగు రూపం.
- source_word: Γυναῖκα ἔγημα
  choice: నేను పెళ్లి చేసుకున్నాను
  rationale: γυνή ఇక్కడ γαμέωకు కర్మగా ఉండడం వల్ల ‘భార్య’ అనే వైవాహిక భావమే ఉద్దేశితం. తెలుగులో ‘ఒక భార్యను పెళ్లి చేసుకున్నాను’ అనడం అసహజం; ‘పెళ్లి చేసుకున్నాను’ అనే సహజ ప్రయోగమే ఆ భావాన్ని పూర్తిగా తెలియజేస్తుంది. పూర్తయిన చర్యకు వర్తమాన సంబంధం కూడా సందర్భంలో స్పష్టంగా ఉంటుంది.
- source_word: διὰ τοῦτο
  choice: అందువల్ల
  rationale: కొత్తగా జరిగిన వివాహాన్నే రాకపోవడానికి కారణంగా చూపే సంబంధాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὐ δύναμαι ἐλθεῖν
  choice: రాలేను
  rationale: δύναμαι + infinitive తెలిపే సామర్థ్యలేమి లేదా చెప్పబడుతున్న అసాధ్యతను సంక్షిప్తమైన సహజ తెలుగులో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్త సాకును అలాగే ఉంచి, తెలుగులో అనవసరంగా వినిపించే ‘భార్యను పెళ్లి చేసుకున్నాను’ అనే పదానువాదాన్ని నివారించాం.
