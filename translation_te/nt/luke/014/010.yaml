review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the invitation, the socially least place, the inviter’s address, public honor, and the meal setting. However, the Greek purpose-and-time sequence (ἵνα ὅταν, “so that when”) is clearer if the host’s later arrival is explicitly linked to taking the low place.
  naturalness: The Telugu is modern and generally natural. ‘అతి తక్కువ గౌరవస్థానం’ is more concise and idiomatic than ‘అతి తక్కువ గౌరవమున్న స్థానం,’ and ‘దీనివల్ల’ naturally expresses the resulting purpose without overexplaining it.
  terminology: ‘ఆహ్వానించినవాడు,’ ‘స్నేహితుడా,’ and ‘గౌరవం’ appropriately render the relevant Greek terms in this banquet context. The footnote correctly preserves the historically specific sense of reclining at a meal.
  issues:
  - severity: low
    issue: The connection represented by ἵνα ὅταν is understated.
    rationale: The draft’s repeated ‘అప్పుడు’ can be read as a simple sequence. The Greek directs the hearer to take the low place with the result/purpose that, when the inviter comes, he may publicly invite the person higher.
  - severity: low
    issue: The historical statement in footnote a is overly broad.
    rationale: ‘ఆ కాలంలో ప్రజలు...’ could suggest all meals or all people. Limiting the description to banquets is both more precise and sufficient for this context.
