id: LUK.14.10
reference: Luke 14:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν κληθῇς πορευθεὶς ἀνάπεσε εἰς τὸν ἔσχατον τόπον, ἵνα ὅταν ἔλθῃ ὁ κεκληκώς σε ⸀ἐρεῖ σοι· Φίλε, προσανάβηθι ἀνώτερον· τότε ἔσται σοι δόξα ἐνώπιον ⸀πάντων τῶν συνανακειμένων σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/010.yaml
  text: But when you are invited[a], go and recline in the lowest place, so that when the one who invited you comes, he will say to you, ‘Friend[b], move up higher.’ Then there will be honor for you in the presence of all who are reclining with you.
translation:
  language: te
  text: కాని నిన్ను ఆహ్వానించినప్పుడు, వెళ్లి అతి తక్కువ గౌరవస్థానంలో భోజనానికి కూర్చో[a]. దీనివల్ల నిన్ను ఆహ్వానించినవాడు వచ్చినప్పుడు, ‘స్నేహితుడా, మరింత పై స్థానానికి రా[b]’ అని నీతో అంటాడు. అప్పుడు నీతో కలిసి భోజనానికి కూర్చున్న వారందరి ఎదుట నీకు గౌరవం కలుగుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘భోజనానికి ఆనుకొని పడుకో.’ ఆ కాలంలో విందులలో ప్రజలు బల్ల దగ్గర ఆనుకొని పడుకుని భోజనం చేసేవారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఇంకా పైకి రా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθῇς
  choice: నిన్ను ఆహ్వానించినప్పుడు
  rationale: విందు సందర్భంలో καλέω సాధారణంగా పిలవడం కంటే ఆహ్వానించడాన్ని సూచిస్తుంది.
- source_word: πορευθεὶς ἀνάπεσε
  choice: వెళ్లి ... భోజనానికి కూర్చో
  rationale: పాల్గొని ఉన్న క్రియను ప్రధాన ఆజ్ఞతో సహజంగా కలిపి అనువదించాం. ἀνάπεσε భోజనానికి ఆనుకొని కూర్చోవడాన్ని సూచించినా, ఆధునిక తెలుగు పాఠకులకు సహజంగా ఉండేందుకు ప్రధాన పాఠ్యంలో ‘భోజనానికి కూర్చో’ అని ఇచ్చి సాంస్కృతిక వివరాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ἔσχατον τόπον
  choice: అతి తక్కువ గౌరవమున్న స్థానం
  rationale: ఇక్కడ ‘చివరి స్థానం’ అనేది క్రమంలో చివరను మాత్రమే కాక, విందులో అత్యల్ప గౌరవస్థానాన్ని సూచిస్తుంది.
- source_word: ὁ κεκληκώς σε
  choice: నిన్ను ఆహ్వానించినవాడు
  rationale: గ్రీకు కృదంతంలోని ఆహ్వానించిన వ్యక్తి అనే భావాన్ని ‘విందు యజమాని’ అని అదనంగా వ్యాఖ్యానించకుండా నేరుగా ఉంచుతుంది.
- source_word: Φίλε
  choice: స్నేహితుడా
  rationale: మర్యాదపూర్వక సంబోధనను అదనపు స్వామ్యభావం లేకుండా నేరుగా తెలియజేస్తుంది.
- source_word: προσανάβηθι ἀνώτερον
  choice: మరింత పై స్థానానికి రా
  rationale: మరింత గౌరవమున్న స్థానానికి వెళ్లడాన్ని సూచిస్తూ, మూలంలోని పైకి కదిలే రూపకాన్ని కూడా నిలుపుతుంది.
- source_word: δόξα
  choice: గౌరవం
  rationale: ఈ సామాజిక సందర్భంలో δόξα దైవిక మహిమకన్నా అందరి ఎదుట లభించే గౌరవాన్ని సూచిస్తుంది.
- source_word: ἐνώπιον πάντων τῶν συνανακειμένων σοι
  choice: నీతో కలిసి భోజనానికి కూర్చున్న వారందరి ఎదుట
  rationale: గౌరవం బహిరంగంగా లభిస్తుందనే భావాన్నీ, ఇది భోజన సందర్భమనే విషయాన్నీ స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: ఈ ఉపదేశపు స్వభావం
  choice: వినయం, గౌరవస్థానాల తారుమారు అనే విస్తృత బోధకు అవకాశం ఉంచుతూ, విందు సందర్భంలోని ఆచరణాత్మక ఆజ్ఞగా అనువదించడం.
  alternative: దీనిని కేవలం విందు మర్యాదగా పరిమితం చేయడం లేదా పూర్తిగా అంత్యకాల ప్రతిఫలానికి మాత్రమే వర్తింపజేయడం.
  rationale: వచనం సామాజిక విందు దృశ్యాన్ని ఉపయోగిస్తుంది; అయితే దాని ప్రాధాన్యాన్ని కేవలం సామాజికంగానో కేవలం అంత్యకాల సంబంధంగానో అనువాదమే నిర్ణయించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడాం. ప్రాచీన విందు ఆచారాన్ని ప్రధాన పాఠ్యంలో అసహజంగా చేయకుండా పాదటిప్పణిలో వివరించాం; గౌరవస్థానాల పైకి-కిందికి కదలికను మాత్రం పాఠ్యంలో నిలిపాం.
