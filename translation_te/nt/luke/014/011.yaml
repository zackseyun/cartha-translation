  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται καὶ ὁ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/011.yaml
  text: For everyone who exalts himself will be humbled[b][a], and the one who humbles himself will be exalted.
translation:
  language: te
  text: ఎందుకంటే, తనను తాను హెచ్చించుకునే ప్రతి వ్యక్తి తగ్గించబడతాడు, మరియు తనను తాను తగ్గించుకునే వ్యక్తి హెచ్చించబడతాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి ఉపదేశానికి కారణాన్ని పరిచయం చేసే వివరణాత్మక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πᾶς ὁ ὑψῶν ἑαυτὸν
  choice: తనను తాను హెచ్చించుకునే ప్రతి వ్యక్తి
  rationale: సార్వత్రికమైన, సామెతవంటి భావాన్ని నిలుపుతూ కర్తృవాచక వర్తమాన కృదంతాన్ని సహజమైన తెలుగు సంబంధ వాక్యంగా అందిస్తుంది.
- source_word: ταπεινωθήσεται
  choice: తగ్గించబడతాడు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని, అలాగే రెండో భాగంలోని స్వచ్ఛందంగా తగ్గించుకోవడంతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: καὶ
  choice: ;
  rationale: గ్రీకులోని సమన్వయాన్ని తెలుగులో రెండు సమాంతరమైన, వ్యతిరేకార్థక భాగాల మధ్య విరామచిహ్నంతో సహజంగా చూపిస్తుంది; అర్థపరంగా రెండో భాగం కొనసాగింపుగానే ఉంటుంది.
- source_word: ὁ ταπεινῶν ἑαυτὸν
  choice: తనను తాను తగ్గించుకునే వ్యక్తి
  rationale: స్వచ్ఛంద స్వీయ-వినయాన్ని సూచిస్తూ మొదటి భాగంతో సమాంతర నిర్మాణాన్ని కాపాడుతుంది.
- source_word: ὑψωθήσεται
  choice: హెచ్చించబడతాడు
  rationale: భవిష్యత్ కర్మణి రూపాన్నీ, ὑψῶν తోని పదపునరుక్తి మరియు వ్యతిరేక సమాంతరతనూ నిలుపుతుంది.
theological_decisions:
- issue: భవిష్యత్ కర్మణి క్రియలలో అంతర్లీన కర్త
  choice: ‘దేవునిచేత’ అని చేర్చకుండా కర్మణి రూపాలను ఉంచడం
  alternative: దేవునిచేత తగ్గించబడతాడు / దేవునిచేత హెచ్చించబడతాడు
  rationale: దైవకర్త భావం సందర్భంలో సూచితమైనప్పటికీ గ్రీకు మూలపాఠం కర్తను స్పష్టంగా పేర్కొనదు; అందువల్ల అనువాదం ఆ అర్థాన్ని బహిర్గతంగా చేర్చదు.
- issue: గ్రీకు ఏకవచన పుంలింగ రూపాల సాధారణ ప్రయోగం
  choice: తెలుగులో ‘ప్రతి వ్యక్తి’ మరియు ‘వ్యక్తి’ అనే సాధారణ సూచనలు
  alternative: ‘ప్రతి పురుషుడు’ లేదా లింగాన్ని సూచించే సర్వనామ రూపం
  rationale: తెలుగు క్రియలో వ్యాకరణపరమైన పుంలింగ ఏకవచనం కనిపించినా, ‘వ్యక్తి’ అన్న పదం మూలంలోని సార్వత్రిక ప్రయోగాన్ని సహజంగా తెలియజేస్తుంది; వాక్యం పురుషులకు మాత్రమే పరిమితం కాదని సందర్భం స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామెతవంటి గంభీరతను, రెండు భాగాల సమాంతరతను కాపాడేందుకు ‘హెచ్చించు/తగ్గించు’ పదజంటను ఉపయోగించాం. ‘హెచ్చించు’ కొద్దిగా గ్రంథశైలికి చెందినదైనా బైబిల్ సందర్భంలో అర్థవంతంగా, గౌరవప్రదంగా ఉంది.
