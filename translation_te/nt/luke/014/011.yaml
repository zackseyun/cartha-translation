review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the universal, proverbial force, the reflexive self-action, and the future passive outcomes. However, the Greek coordinating conjunction καὶ is not represented explicitly; a semicolon marks the parallelism but does not translate the coordination as clearly as ‘మరియు.’
  naturalness: The wording is clear, modern standard Telugu, and the paired verbs ‘హెచ్చించు/తగ్గించు’ provide effective formal parallelism in a biblical register. Adding ‘మరియు’ makes the sentence flow naturally while retaining the Greek linkage.
  terminology: ‘హెచ్చించబడతాడు’ and ‘తగ్గించబడతాడు’ appropriately preserve the elevation/humbling contrast and the unspecified passive agent. ‘ప్రతి వ్యక్తి’ correctly communicates the generic scope without artificially restricting the saying to males.
  issues:
  - severity: low
    issue: The conjunction καὶ is rendered only by a semicolon.
    rationale: The semicolon preserves rhetorical parallelism, but the source explicitly coordinates the two clauses. Rendering it as ‘మరియు’ more fully reflects the Greek without adding interpretation.
  revised_text: ఎందుకంటే, తనను తాను హెచ్చించుకునే ప్రతి వ్యక్తి తగ్గించబడతాడు, మరియు తనను తాను తగ్గించుకునే వ్యక్తి హెచ్చించబడతాడు.
  revised_footnotes: []
