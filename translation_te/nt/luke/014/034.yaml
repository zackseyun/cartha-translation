id: LUK.14.34
reference: Luke 14:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καλὸν ⸀οὖν τὸ ἅλας· ἐὰν δὲ ⸀καὶ τὸ ἅλας μωρανθῇ, ἐν τίνι ἀρτυθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/034.yaml
  text: Salt[a], then, is good; but if even the salt becomes tasteless, with what will it be seasoned?
translation:
  language: te
  text: కాబట్టి ఉప్పు మంచిదే. అయితే ఉప్పు కూడా చప్పబడితే[a], దానికి దేనితో రుచి కలిగిస్తారు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు క్రియకు అక్షరార్థంగా ‘మూర్ఖమవడం’ అనే భావం ఉండవచ్చు; అయితే ఇక్కడ ఉప్పు విషయంలో అది ‘రుచి కోల్పోవడం’ లేదా ‘చప్పబడిపోవడం’ అని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καλὸν
  choice: మంచిదే
  rationale: ఉప్పును సాధారణంగా సానుకూలంగా అంచనా వేసే καλός భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘ఉపయోగకరమైనది’ అని భావాన్ని సంకుచితం చేయదు.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందున్న బోధ నుంచి వచ్చే నిర్ధారణాత్మక సంబంధాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: ἅλας
  choice: ఉప్పు
  rationale: మూలంలోని ప్రత్యక్షమైన ఉప్పు రూపకాన్ని వ్యాఖ్యానించకుండా యథాతథంగా ఉంచుతుంది.
- source_word: ἐὰν δὲ καὶ
  choice: అయితే ... ఉప్పే
  rationale: δέ యొక్క వ్యత్యాసాన్ని ‘అయితే’తో, καί యొక్క ‘ఉప్పు కూడా/ఉప్పే’ అనే ఉద్ఘాటనను ‘ఉప్పే’తో సహజమైన తెలుగు వాక్యక్రమంలో నిలుపుతుంది.
- source_word: μωρανθῇ
  choice: చప్పబడిపోతే
  rationale: ఉప్పు సందర్భంలో μωραίνω యొక్క అలంకారిక భావం రుచిలేనిదిగా మారడమే. ‘చప్పబడిపోవడం’ ఆధునిక తెలుగులో ఆ భావాన్ని సహజంగా తెలియజేస్తూ, మార్పును కూడా సూచిస్తుంది.
- source_word: ἐν τίνι
  choice: దేనితో
  rationale: రుచి కలిగించే సాధనం గురించి అడిగే ప్రశ్నను సహజమైన తెలుగు ప్రయోగంలో వ్యక్తం చేస్తుంది.
- source_word: ἀρτυθήσεται
  choice: దానికి ... రుచి కలిగిస్తారు
  rationale: ‘రుచికరంగా చేయడం/రుచి కలిగించడం’ అనే వంటసంబంధ రూపకాన్ని నిలుపుతుంది. గ్రీకు కర్మణి భావాన్ని తెలుగు అనిర్దిష్ట కర్త బహువచన నిర్మాణంతో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ఉప్పు సామెతలోని రూపకార్థం
  choice: శిష్యత్వానికి దాని అన్వయాన్ని ప్రధాన వాక్యంలో వివరించకుండా ఉప్పు రూపకాన్ని అలాగే ఉంచడం
  alternative: ‘శిష్యులు తమ ప్రత్యేకతను కోల్పోతే’ అని వివరణాత్మకంగా విస్తరించడం
  rationale: ఈ వచనం రూపకాన్ని ఇస్తుంది; దాని అన్వయాన్ని పరిసర సందర్భం తెలియజేస్తుంది. అనువాదంలో దాన్ని ముందుగానే ఒకే వ్యాఖ్యానంగా పరిష్కరించకుండా రూపకంలోని భావగాంభీర్యాన్ని నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన సామెతసదృశ శైలిని వాడాం. ‘ఉప్పే’ ద్వారా మూలంలోని ఉద్ఘాటనను, ప్రశ్నార్థక నిర్మాణం ద్వారా అలంకారిక ప్రశ్నను నిలిపాం.
