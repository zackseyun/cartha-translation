id: LUK.14.19
reference: Luke 14:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἕτερος εἶπεν· Ζεύγη βοῶν ἠγόρασα πέντε καὶ πορεύομαι δοκιμάσαι αὐτά· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/019.yaml
  text: And another said[a], ‘I have bought five yoke of oxen, and I am going to test them. I ask you[b], consider me excused.’
translation:
  language: te
  text: మరొకడు, “నేను ఐదు జతల ఎద్దులను[a] కొన్నాను. వాటిని పరీక్షించడానికి వెళ్తున్నాను. నాకు మినహాయింపు ఇవ్వమని నిన్ను కోరుతున్నాను[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, పని కోసం కాడికి కట్టే ఐదు జతలు.
    reason: lexical_alternative
  - marker: b
    text: మూలభాషలో అక్షరార్థంగా, “నన్ను మినహాయించబడినవాడిగా ఉంచు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερος
  choice: మరొకడు
  rationale: సాకులు చెబుతున్న ఆహ్వానితుల వరుసలో ఇంకొక వ్యక్తిని సహజంగా సూచిస్తుంది.
- source_word: Ζεύγη βοῶν πέντε
  choice: ఐదు జతల ఎద్దులను
  rationale: ζεῦγος పని కోసం జతగా కట్టే రెండు ఎద్దులను సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఐదు జతల ఎద్దులు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: ἠγόρασα
  choice: కొన్నాను
  rationale: అప్పుడే ప్రాసంగికమైన కొనుగోలును సరళమైన భూతకాల రూపంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πορεύομαι δοκιμάσαι αὐτά
  choice: వాటిని పరీక్షించడానికి వెళ్తున్నాను
  rationale: ప్రస్తుతం వెళ్లాలనే ఉద్దేశాన్ని, కొత్తగా కొన్న ఎద్దుల పనితీరును పరీక్షించే భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἐρωτῶ σε
  choice: నిన్ను కోరుతున్నాను
  rationale: ఇక్కడ సాధారణ ప్రశ్న కంటే మర్యాదపూర్వక విజ్ఞప్తి భావం ఉంది; ‘కోరుతున్నాను’ దానిని అతిశయింపకుండా తెలియజేస్తుంది.
- source_word: ἔχε με παρῃτημένον
  choice: నాకు మినహాయింపు ఇవ్వు
  rationale: విందుకు రాకుండా తనను మినహాయించమనే సందర్భోచిత అర్థాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. ‘మినహాయింపు’ అనే పదం క్షమాపణకన్నా ఆహ్వానం నుంచి తప్పించమనే సందర్భార్థాన్ని స్పష్టంగా ఉంచుతుంది.
