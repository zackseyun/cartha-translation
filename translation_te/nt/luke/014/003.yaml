id: LUK.14.3
reference: Luke 14:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς τοὺς νομικοὺς καὶ Φαρισαίους λέγων· ⸀Ἔξεστιν τῷ σαββάτῳ ⸂θεραπεῦσαι ἢ οὔ⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/003.yaml
  text: And Jesus answered and said to the lawyers and Pharisees[a], “Is it lawful to heal on the Sabbath, or not?”
translation:
  language: te
  text: 'యేసు స్పందించి, ధర్మశాస్త్ర నిపుణులను, పరిసయ్యులను ఉద్దేశించి ఇలా అన్నాడు: “విశ్రాంతిదినాన స్వస్థపరచడం ధర్మసమ్మతమేనా, కాదా?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν ... λέγων
  choice: అప్పుడు ... అని అడిగాడు
  rationale: గ్రీకు వాక్యంలో ఉన్న ‘జవాబిచ్చి చెప్పాడు’ అనే కథన ప్రయోగం తప్పనిసరిగా పలికిన ప్రశ్నకు సమాధానాన్ని సూచించదు; సందర్భంలోని పరిస్థితికి స్పందించడాన్ని తెలుగులో సహజంగా ‘అప్పుడు ... అడిగాడు’ అని వ్యక్తం చేశాం. λέγωνను ప్రత్యేకంగా పునరుక్తి చేయకుండా ప్రత్యక్ష ప్రశ్నలో కలిపాం.
- source_word: νομικοὺς
  choice: ధర్మశాస్త్ర నిపుణులు
  rationale: ఇక్కడ νομικός ఆధునిక న్యాయవాదిని కాక, యూదుల ధర్మశాస్త్రంలో నిపుణుడిని సూచిస్తుంది. అందువల్ల అపార్థం రాకుండా భావాన్ని స్పష్టంగా తెలిపాం.
- source_word: Φαρισαίους
  choice: పరిసయ్యులు
  rationale: ఈ యూద మతవర్గానికి ఆధునిక ప్రామాణిక తెలుగు రూపాన్ని వాడాం.
- source_word: Ἔξεστιν
  choice: ధర్మశాస్త్రం ప్రకారం సమ్మతమేనా
  rationale: విశ్రాంతిదిన ఆచరణకు సంబంధించిన న్యాయ-మతపరమైన అనుమతి భావాన్ని స్పష్టంగా అందిస్తుంది; కేవలం సాధారణ అనుమతి అన్న భావానికి పరిమితం చేయదు.
- source_word: τῷ σαββάτῳ
  choice: విశ్రాంతిదినాన
  rationale: కాలార్థక దత్తివిభక్తిని సహజమైన తెలుగు కాలప్రయోగంతో అనువదించాం.
- source_word: θεραπεῦσαι
  choice: స్వస్థపరచడం
  rationale: సువార్తలలోని రోగనివారణ సందర్భానికి తగిన, గౌరవప్రదమైన సాధారణ తెలుగు పదం.
- source_word: ἢ οὔ
  choice: కాదా
  rationale: ప్రత్యామ్నాయ ప్రశ్న ముగింపును సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: విశ్రాంతిదిన ధర్మశాస్త్ర ప్రశ్నకు యేసు ఇచ్చే తదుపరి నిర్ధారణను ముందుగానే చేర్చకపోవడం
  choice: “విశ్రాంతిదినాన స్వస్థపరచడం ధర్మశాస్త్రం ప్రకారం సమ్మతమేనా, కాదా?”
  alternative: “విశ్రాంతిదినాన స్వస్థపరచడం అనుమతించబడిందా, లేదా?”
  rationale: మూలవాక్యం ప్రశ్నను మాత్రమే ఉంచుతుంది. కరుణ, అవసరం, లేదా యేసు అధికారాన్ని ఈ వచనంలోనే వివరణగా చేర్చకుండా న్యాయ-మతపరమైన ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గౌరవప్రదమైన బైబిల్ కథన శైలిలో రూపొందించాం. ‘న్యాయవాదులు’ అనే ఆధునిక వృత్తి భావాన్ని నివారించడానికి ‘ధర్మశాస్త్ర నిపుణులు’ ఎంచుకున్నాం. అవసరం లేని పాదసూచిక లేదు.
