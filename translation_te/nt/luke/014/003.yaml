- from: అప్పుడు యేసు ధర్మశాస్త్ర నిపుణులతోను పరిసయ్యులతోను, “విశ్రాంతిదినాన స్వస్థపరచడం ధర్మశాస్త్రం ప్రకారం సమ్మతమేనా, కాదా?” అని అడిగాడు.
  to: 'యేసు స్పందించి, ధర్మశాస్త్ర నిపుణులను, పరిసయ్యులను ఉద్దేశించి ఇలా అన్నాడు: “విశ్రాంతిదినాన స్వస్థపరచడం ధర్మసమ్మతమేనా, కాదా?”'
