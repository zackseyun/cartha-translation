id: LUK.14.27
reference: Luke 14:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ὅστις οὐ βαστάζει τὸν σταυρὸν ⸀ἑαυτοῦ καὶ ἔρχεται ὀπίσω μου, οὐ δύναται εἶναί μου μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/027.yaml
  text: Whoever does not carry his own cross and come after me cannot be my disciple[a][b].
translation:
  language: te
  text: ఎవరైతే తన సొంత సిలువను మోసుకొని[a] నా వెనుక రారో[b], వారు నా శిష్యులు కాలేరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన సొంత సిలువను భరించి.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నా వెనుక రారు’; ఇది ‘నన్ను అనుసరించు’ అనే సాధారణ శిష్యత్వ వ్యక్తీకరణతో పోల్చదగినది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: ఎవడైతే ... వాడు
  rationale: అనిర్దిష్ట సంబంధ సర్వనామం తెలిపే సాధారణ షరతును తెలుగులో సహజమైన సంబంధ–నిర్దేశక నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: βαστάζει
  choice: మోసుకొని
  rationale: ‘మోయు/భరించు’ అనే అర్థాలలో, సిలువ అనే స్పష్టమైన వస్తు-చిత్రానికి ‘మోసుకొని’ సహజంగా సరిపోతూ రూపకాలంకార బలాన్నీ నిలుపుతుంది.
- source_word: τὸν σταυρόν
  choice: సిలువను
  rationale: శిక్షా సాధనాన్నీ, శిష్యత్వపు మూల్యం మరియు అవమానాన్నీ సూచించే స్థిరమైన తెలుగు పదం.
- source_word: ἑαυτοῦ
  choice: తన సొంత
  rationale: ఏకవచన ఆత్మవాచక సర్వనామంలోని స్వకీయ ఉద్ఘాటనను స్పష్టంగా నిలుపుతుంది.
- source_word: ἔρχεται ὀπίσω μου
  choice: నా వెనుక రాడో
  rationale: అక్షరార్థమైన ‘నా వెనుక వస్తాడు’ అనే గమన-చిత్రాన్ని నిలుపుతూ, ప్రతికూల సంబంధ నిర్మాణంలో సహజమైన తెలుగు రూపాన్ని ఉపయోగిస్తుంది.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: నా శిష్యుడు కాలేడు
  rationale: కేవలం నిషేధం కాక, శిష్యుడిగా ఉండలేని అసాధ్యత లేదా అసంగతతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μαθητής
  choice: శిష్యుడు
  rationale: సువార్తల సందర్భంలో గురువును అనుసరించే నిబద్ధ అనుచరుడు/అభ్యాసకుడు అనే భావాన్ని తెలిపే స్థిరమైన పదం.
theological_decisions:
- issue: ఏకవచన పుంలింగ ఆత్మవాచక సర్వనామం యొక్క సాధారణ వర్తింపు
  choice: ‘ఎవడైతే ... తన సొంత ... వాడు’ అనే ఏకవచన పుంలింగ రూపాన్ని నిలుపడం
  alternative: ‘ఎవరైతే తమ సొంత ... వారు’ అనే గౌరవ/లింగ-తటస్థ బహువచన రూపం
  rationale: గ్రీకు వాక్యంలో పుంలింగ ఏకవచన రూపం ప్రతినిధ్యార్థంగా ఉంది. తెలుగు ఏకవచన నిర్మాణం మూలంలోని వ్యాకరణ సంఖ్యనూ ‘తన సొంత’ అనే ఆత్మవాచక ఉద్ఘాటననూ కాపాడుతుంది; ‘ఎవడైతే’ వల్ల వాక్యం సాధారణంగా వర్తిస్తుందని తెలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘నా వెనుక రాడు’ మూలంలోని గమన-చిత్రాన్ని కాపాడుతుంది; ‘శిష్యుడు కాలేడు’ అసమర్థత భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
