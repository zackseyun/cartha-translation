id: LUK.14.18
reference: Luke 14:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἤρξαντο ἀπὸ μιᾶς ⸂πάντες παραιτεῖσθαι⸃. ὁ πρῶτος εἶπεν αὐτῷ· Ἀγρὸν ἠγόρασα καὶ ἔχω ἀνάγκην ⸀ἐξελθὼν ἰδεῖν αὐτόν· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/018.yaml
  text: But they all alike began to excuse themselves[a]. The first said to him, ‘I have bought a field, and I need to go out and see it. I ask you[b], consider me excused.’
translation:
  language: te
  text: అయితే వారందరూ ఒకే విధంగా సాకులు చెప్పడం మొదలుపెట్టారు.[a] మొదటివాడు అతనితో, ‘నేను ఒక పొలం కొన్నాను; బయటికి వెళ్లి దాన్ని చూడాల్సి ఉంది. దయచేసి నన్ను మన్నించు’ అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆహ్వానాన్ని తిరస్కరించడం మొదలుపెట్టారు.” గ్రీకు క్రియ ఒక సాకు చెబుతూ ఆహ్వానాన్ని నిరాకరించడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο ... παραιτεῖσθαι
  choice: సాకులు చెప్పడం మొదలుపెట్టారు
  rationale: మధ్యమ ప్రయోగంలోని క్రియ ఆహ్వానాన్ని ఏదో కారణం చెబుతూ తిరస్కరించడం ప్రారంభించారనే భావాన్ని ఇస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘సాకులు చెప్పడం’ ఆ భావాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: ἀπὸ μιᾶς
  choice: ఒకే విధంగా
  rationale: ‘అందరూ కలిసి/ఒకే తీరుగా’ అనే సామూహిక భావం గల నుడికారాన్ని సహజంగా తెలుపుతుంది; అవసరానికి మించిన సంపూర్ణ ఏకాభిప్రాయాన్ని సూచించదు.
- source_word: πάντες
  choice: వారందరూ
  rationale: ప్రతిస్పందించిన వారిలో ఎవరూ మినహాయింపు కాదనే మూలపాఠంలోని స్పష్టమైన సమగ్రతను నిలుపుతుంది.
- source_word: Ἀγρόν
  choice: ఒక పొలం
  rationale: పొలం లేదా భూభాగాన్ని సూచించే పదానికి నేరుగా సరిపోయే సాధారణ తెలుగు; ‘వ్యవసాయ క్షేత్రం’ వంటి అదనపు భావాన్ని చేర్చదు.
- source_word: ἠγόρασα
  choice: కొన్నాను
  rationale: గతంలో పూర్తయి ప్రస్తుత సందర్భానికి సంబంధించిన కొనుగోలును తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἔχω ἀνάγκην
  choice: చూడాల్సి ఉంది
  rationale: అవసరం లేదా తప్పనిసరితనాన్ని తెలిపే గ్రీకు నుడికారాన్ని సహజమైన తెలుగు క్రియా నిర్మాణంతో అందిస్తుంది.
- source_word: ἐξελθὼν ἰδεῖν αὐτόν
  choice: బయటికి వెళ్లి దాన్ని చూడాల్సి ఉంది
  rationale: వెళ్లడం మరియు చూడడం అనే వరుస చర్యలను నిలుపుతుంది; ‘పరిశీలించాలి’ అని అనువదించి మూలంలో స్పష్టంగా లేని సూక్ష్మ భావాన్ని జోడించదు.
- source_word: ἐρωτῶ σε
  choice: దయచేసి
  rationale: విన్నపాన్ని సూచించే స్పష్టమైన మర్యాదా సూత్రాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἔχε με παρῃτημένον
  choice: నన్ను మన్నించు
  rationale: తన గైర్హాజరును అంగీకరించి క్షమించమని ఆతిథ్యదాతను కోరే నుడికారాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: καὶ
  choice: అయితే
  rationale: ముందటి ఆహ్వానానికి అతిథుల నిరాకరణ వ్యతిరేక మలుపుగా రావడాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: ὁ πρῶτος
  choice: మొదటివాడు
  rationale: తరువాత వరుసగా వచ్చే సాకుల్లో మొదటిదాన్ని చెప్పిన వ్యక్తిని నేరుగా సూచిస్తుంది.
