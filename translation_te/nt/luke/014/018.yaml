translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. సంభాషణను సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా ఉంచుతూ మూలంలోని సామూహిక నిరాకరణ, విన్నప స్వరాన్ని నిలిపాం. అందించిన ఇంగ్లీషు పాఠంలోని రెండో పాదసూచిక గుర్తు స్థానం దాని పాదసూచిక విషయంతో సరిపోలకపోవడంతో, ἀπὸ μιᾶς ను ప్రధాన పాఠంలోనే స్పష్టంగా అనువదించి అనవసర గుర్తును చేర్చలేదు.
