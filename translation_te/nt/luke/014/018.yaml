  source_fidelity: The Telugu accurately conveys the collective beginning of the refusals (καὶ ἤρξαντο ... πάντες παραιτεῖσθαι), the idiom ἀπὸ μιᾶς as a shared manner of response, and each element of the first speaker’s excuse. ‘నన్ను మన్నించు’ idiomatically conveys the request to be excused, without adding doctrinal or contextual detail.
  naturalness: The wording is fluent modern standard Telugu. ‘వారందరూ ఒకే విధంగా సాకులు చెప్పడం మొదలుపెట్టారు’ is clear and appropriately narrative; the direct speech is natural and readable.
