  text: But they kept silent[a]. And taking hold of him[b], he healed him and sent him away.
translation:
  language: te
  text: అయితే వారు మౌనంగా ఉండిపోయారు[a]. ఆయన అతణ్ణి పట్టుకొని, స్వస్థపరిచి, పంపివేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మౌనంగా ఉన్నారు” లేదా “ఏమీ చెప్పలేదు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “వెళ్లనిచ్చాడు” లేదా “విడిచిపెట్టాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: అయితే వారు
  rationale: ముందు ప్రస్తావించిన ధర్మశాస్త్ర బోధకులను, పరిసయ్యులను సూచించే కర్తను తెలుగులో సహజంగా వ్యక్తం చేస్తూ, δέ లోని స్వల్ప వ్యతిరేక భావాన్ని నిలుపుతుంది.
- source_word: ἡσύχασαν
  choice: మౌనంగా ఉండిపోయారు
  rationale: యేసు ప్రశ్నకు వారు జవాబు చెప్పకుండా మౌనం వహించారనే సందర్భార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπιλαβόμενος
  choice: అతణ్ణి పట్టుకొని
  rationale: ἐπιλαμβάνομαι లోని భౌతికంగా పట్టుకోవడం అనే భావాన్ని, పట్టుకున్న విధానాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: ἰάσατο αὐτὸν
  choice: స్వస్థపరిచి
  rationale: శారీరక రోగం నుండి నయం చేసిన కార్యాన్ని గౌరవప్రదమైన, సాధారణ బైబిలు తెలుగులో స్పష్టంగా తెలియజేస్తుంది; కర్మ అయిన అతడు ముందు క్రియతోనే స్పష్టంగా ఉంది.
- source_word: ἀπέλυσεν
  choice: పంపివేశాడు
  rationale: ఈ కథన సందర్భంలో స్వస్థపరచిన తరువాత అతణ్ణి అక్కడి నుండి వెళ్లనిచ్చాడు లేదా పంపాడు అనే భావాన్ని సహజంగా అందిస్తుంది; చట్టపరమైన విడుదల భావాన్ని రుద్దదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. గ్రీకు వాక్యంలోని వరుస చర్యలు—పట్టుకోవడం, స్వస్థపరచడం, పంపివేయడం—తెలుగులో సహజమైన సమాపక క్రియలతో నిలుపబడ్డాయి.
