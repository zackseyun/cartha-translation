    issue: Footnote b includes “వీడ్కోలు చెప్పి పంపాడు.”
    rationale: ἀπέλυσεν means release, dismiss, let go, or send away in this context; it does not state that Jesus bade the man farewell. The alternative adds information and should be replaced with a lexical-contextual alternative.
