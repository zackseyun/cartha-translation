  text: otherwise[a], after he has laid a foundation and is not able to finish, all who see it may begin to mock him,
translation:
  language: te
  text: లేకపోతే[a], అతడు పునాది వేసిన తర్వాత దాన్ని పూర్తి చేయలేకపోతే, అది చూసే వారందరూ అతణ్ణి ఎగతాళి చేయడం మొదలుపెట్టవచ్చు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతడు పునాది వేసి దాన్ని పూర్తి చేయలేకపోయినప్పుడు, అది చూసే వారందరూ అతణ్ణి ఎగతాళి చేయడం మొదలుపెట్టకుండా ఉండేందుకు.’
    reason: ἵνα μήποτε అనే పదబంధాన్ని నివారణార్థక ఉద్దేశ్య-నిర్మాణంగా మరింత అక్షరార్థంగా అనువదించే ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: ἵνα μήποτε
  choice: లేకపోతే
  rationale: నివారించవలసిన ప్రతికూల పరిణామాన్ని సహజమైన ఆధునిక తెలుగులో హెచ్చరిక ధోరణితో తెలియజేస్తుంది.
- source_word: θέντος αὐτοῦ
  choice: అతడు పునాది వేసిన తర్వాత
  rationale: ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచించే జనిటివ్ అబ్సల్యూట్ కాలక్రమాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: θεμέλιον
  choice: పునాది
  rationale: నిర్మాణ సందర్భంలో సహజమైన, సాధారణ తెలుగు పదం; గ్రీకులోని అనిర్దిష్ట భావానికి తెలుగులో ప్రత్యేక నిర్దేశకం అవసరం లేదు.
- source_word: μὴ ἰσχύοντος
  choice: పూర్తి చేయలేకపోతే
  rationale: ఇక్కడ ἰσχύω శారీరక బలం కంటే సామర్థ్యాన్ని సూచిస్తుంది; తదనంతర క్రియతో కలిపి సహజంగా అనువదించబడింది.
- source_word: ἐκτελέσαι
  choice: పూర్తి చేయ
  rationale: నిర్మాణాన్ని అంతం వరకు తీసుకెళ్లే భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: πάντες οἱ θεωροῦντες
  choice: అది చూసే వారందరూ
  rationale: θεωρέω లోని చూడటం లేదా గమనించడం అనే భావాన్ని నిలుపుతుంది; ‘అది’ అసంపూర్తిగా ఉన్న నిర్మాణ పరిస్థితిని సూచిస్తుంది.
- source_word: ἄρξωνται
  choice: మొదలుపెట్టవచ్చు
  rationale: హెచ్చరిక నిర్మాణంలోని సంభావ్య ఫలితాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: αὐτῷ ἐμπαίζειν
  choice: అతణ్ణి ఎగతాళి చేయడం
  rationale: ఎగతాళి చేయడం ἐμπαίζω లోని పరిహాసం లేదా హేళన భావాన్ని సాధారణమైనప్పటికీ గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
