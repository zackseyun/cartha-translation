revisions:
- from: అప్పుడు యజమాని తన దాసునితో, ‘బయటికి వెళ్లి, దారుల దగ్గరా కంచెల వెంబడా ఉన్నవారు లోపలికి వచ్చేలా వారిని బలంగా ఒప్పించు[a]. నా ఇల్లు నిండిపోవాలి’ అన్నాడు.
  to: యజమాని దాసునితో, “బయటికి వెళ్లి, దారులకూ కంచెల దగ్గరకూ వెళ్లి, వారు లోపలికి వచ్చేలా బలవంతం చేయి[a], తద్వారా నా ఇల్లు నిండిపోతుంది” అన్నాడు.
  rationale: The revision restores the strong force of ἀνάγκασον in the main text while retaining a footnote that prevents an unwarranted inference of physical violence. It also renders the paired locations more directly and expresses the ἵνα purpose/result clause naturally in Telugu. ‘యజమాని’ and ‘దాసుడు’ are retained as contextually and lexically appropriate.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:44:11Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies κύριος as the householder/master and δοῦλος as a slave, and it preserves the directional force of ἔξελθε. However, its main-text rendering of ἀνάγκασον ('బలంగా ఒప్పించు') somewhat weakens the strong imperative. The source’s purpose clause is better represented as 'so that my house may be filled' rather than an independent 'నా ఇల్లు నిండిపోవాలి.'
  naturalness: The current Telugu is generally understandable, but 'దారుల దగ్గరా కంచెల వెంబడా ఉన్నవారు' is an unnecessarily heavy expansion of the Greek locations. A more direct imperative sequence is smoother in modern standard Telugu.
  terminology: ‘యజమాని’ is appropriate in this parabolic context, and ‘దాసుడు’ properly retains the bonded-status sense of δοῦλος. ‘కంచెల’ suitably represents φραγμοί. The strong sense of ἀνάγκασον should be retained in the text, with the contextual nonviolent nuance explained in a footnote.
  issues:
  - severity: medium
    issue: The rendering ‘బలంగా ఒప్పించు’ softens ἀνάγκασον.
    rationale: ἀναγκάζω is a strong verb, conventionally ‘compel’ or ‘press.’ The footnote may clarify that physical force is not necessarily meant in this parable, but the main text should retain the verb’s force.
  - severity: low
    issue: The phrase ‘దారుల దగ్గరా కంచెల వెంబడా ఉన్నవారు’ expands and encumbers the source’s simple location phrase.
    rationale: The Greek says ‘into the roads and hedges,’ with the people to be brought in understood from the command. Telugu can express this naturally without defining them as people already ‘located’ there.
  - severity: low
    issue: ‘నా ఇల్లు నిండిపోవాలి’ is less explicit as a purpose clause.
    rationale: 'ἵνα γεμισθῇ expresses the intended result: ‘so that my house may be filled.’'
  revised_text: యజమాని దాసునితో, “బయటికి వెళ్లి, దారులకూ కంచెల దగ్గరకూ వెళ్లి, వారు లోపలికి వచ్చేలా బలవంతం చేయి[a], తద్వారా నా ఇల్లు నిండిపోతుంది” అన్నాడు.
  revised_footnotes:
  - marker: a
    text: లేదా, “వారు లోపలికి వచ్చేలా గట్టిగా ఒత్తిడి చేయి.” గ్రీకు క్రియ బలమైనది (‘బలవంతం చేయు,’ ‘గట్టిగా ఒత్తిడి చేయు’); అయితే ఈ ఉపమానంలో అది తప్పనిసరిగా భౌతిక బలప్రయోగాన్ని సూచించదు.
