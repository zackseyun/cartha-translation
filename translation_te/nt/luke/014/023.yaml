id: LUK.14.23
reference: Luke 14:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ κύριος πρὸς τὸν δοῦλον· Ἔξελθε εἰς τὰς ὁδοὺς καὶ φραγμοὺς καὶ ἀνάγκασον εἰσελθεῖν, ἵνα γεμισθῇ ⸂μου ὁ οἶκος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/023.yaml
  text: And the master said to the servant[a], ‘Go out into the roads and hedges, and compel them to come in, so that my house may be filled.’
translation:
  language: te
  text: యజమాని దాసునితో, “బయటికి వెళ్లి, దారులకూ కంచెల దగ్గరకూ వెళ్లి, వారు లోపలికి వచ్చేలా బలవంతం చేయి[a], తద్వారా నా ఇల్లు నిండిపోతుంది” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు లోపలికి వచ్చేలా గట్టిగా ఒత్తిడి చేయి.” గ్రీకు క్రియ బలమైనది (‘బలవంతం చేయు,’ ‘గట్టిగా ఒత్తిడి చేయు’); అయితే ఈ ఉపమానంలో అది తప్పనిసరిగా భౌతిక బలప్రయోగాన్ని సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: యజమాని
  rationale: ఉపమానంలోని ఇంటి యజమానిని సూచిస్తోంది; ప్రత్యక్ష దైవ బిరుదుగా భావింపజేయకుండా కథలోని సామాజిక పాత్రను సహజంగా తెలియజేస్తుంది.
- source_word: δοῦλον
  choice: దాసుడు
  rationale: δοῦλος సూచించే అధీన స్థితిని ‘సేవకుడు’ కంటే స్పష్టంగా కాపాడుతుంది; ఆధునిక తెలుగు పాఠకునికి అర్థమయ్యే గౌరవప్రదమైన పదం.
- source_word: Ἔξελθε
  choice: బయటికి వెళ్లి
  rationale: ἐξέρχομαι లోని బయటకు వెళ్లే దిశాభావాన్ని నిలుపుతుంది.
- source_word: ὁδοὺς
  choice: దారుల దగ్గర
  rationale: పట్టణం వెలుపల లేదా అంచుల్లోని ప్రయాణ మార్గాలను సహజ తెలుగులో సూచిస్తుంది; తరువాతి φραγμούς తో స్థానార్థకంగా కలుస్తుంది.
- source_word: φραγμοὺς
  choice: కంచెల వెంబడి
  rationale: φραγμός అనే పదంలోని కంచె లేదా పొలిమేర అడ్డంకి భావాన్ని నిలుపుతూ, అక్కడ మనుషులు కనిపించే ప్రదేశాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀνάγκασον
  choice: బలంగా ఒప్పించు
  rationale: క్రియలోని బలమైన ఒత్తిడి లేదా పట్టుదల భావాన్ని నిలుపుతుంది; ‘బలవంతం చేయి’ అనే మాట వల్ల భౌతిక హింస తప్పనిసరిగా ఉద్దేశించబడిందనే అపార్థాన్ని ప్రధాన పాఠ్యంలో తగ్గిస్తుంది. ప్రత్యక్ష ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: εἰσελθεῖν
  choice: లోపలికి వచ్చేలా
  rationale: ఇంటిలోకి ప్రవేశించే భావాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: ἵνα γεμισθῇ
  choice: నిండిపోవాలి
  rationale: ἵνα తో కూడిన ఉద్దేశం లేదా ఆశించిన ఫలితాన్ని యజమాని ప్రత్యక్ష మాటల్లో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: μου ὁ οἶκος
  choice: నా ఇల్లు
  rationale: విందు జరిగే గృహాన్ని నేరుగా సూచిస్తుంది; ‘ఇంటి వారు’ అనే గృహస్థుల సమూహార్థాన్ని అనవసరంగా తీసుకురాదు.
theological_decisions:
- issue: ఉపమానంలో κύριος అనువాదం
  choice: యజమాని
  alternative: ప్రభువు
  rationale: ఇక్కడ పదం కథలోని ఇంటి యజమాని పాత్రను సూచిస్తుంది. ‘యజమాని’ అనడం ప్రత్యక్ష క్రీస్తుశాస్త్రీయ బిరుదును ముందుగానే రుద్దకుండా, ఉపమానపు ఆధ్యాత్మిక ప్రాముఖ్యతను సందర్భం ద్వారా గ్రహించనిస్తుంది.
- issue: ἀνάγκασον యొక్క బలం
  choice: బలంగా ఒప్పించు
  alternative: బలవంతం చేయి
  rationale: మూల క్రియలోని బలాన్ని పూర్తిగా మృదువుచేయకుండా, ఈ ఉపమానంలో భౌతిక బలప్రయోగం తప్పనిసరి అనే అర్థాన్ని రుద్దకుండా ఉంచుతుంది. మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణి కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘దాసుడు’ ద్వారా బంధిత అధీన స్థితి నిలుపబడింది. దారులు–కంచెల దృశ్యం గ్రామీణ లేదా పట్టణ అంచుల ప్రదేశాలుగా సులభంగా అర్థమయ్యేలా స్థానవాచక నిర్మాణం వాడబడింది.
