id: LUK.14.28
reference: Luke 14:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίς γὰρ ἐξ ⸀ὑμῶν θέλων πύργον οἰκοδομῆσαι οὐχὶ πρῶτον καθίσας ψηφίζει τὴν δαπάνην, εἰ ⸀ἔχει εἰς ἀπαρτισμόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/028.yaml
  text: For which of you[a], wanting to build a tower, does not first sit down and calculate the cost[b], whether he has enough to complete it?
translation:
  language: te
  text: ఎందుకంటే, మీలో గోపురం కట్టాలని అనుకునేవాడు, దాన్ని పూర్తి చేయడానికి తన దగ్గర సరిపడినంత ఉందో లేదో తెలుసుకోవడానికి, ముందుగా కూర్చొని ఖర్చును లెక్కించకుండా ఉంటాడా?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίς γὰρ ἐξ ὑμῶν
  choice: ఎందుకంటే, మీలో ఒకడు
  rationale: γάρ ముందరి బోధతో సంబంధాన్ని చూపుతుంది; τίς ἐξ ὑμῶν శ్రోతలను నేరుగా ఉద్దేశించిన అలంకారప్రశ్న. తెలుగులో ‘మీలో ఒకడు ... చేయడు?’ అనే నిర్మాణం సహజంగా సానుకూల సమాధానాన్ని ఆశించే ప్రశ్నను తెలియజేస్తుంది.
- source_word: θέλων
  choice: కట్టాలని అనుకుంటే
  rationale: వర్తమాన కృదంతం వ్యక్తి సంకల్పాన్ని సూచిస్తుంది. ప్రధాన క్రియతో కలిపి ‘కట్టాలని అనుకుంటే’ అని అనువదించడం సహజమైన ఆధునిక తెలుగు.
- source_word: πύργον
  choice: గోపురం
  rationale: πύργος యొక్క ప్రాథమిక అర్థమైన ‘tower’ను రూపకచిత్రం మార్చకుండా నిలుపుతుంది.
- source_word: οἰκοδομῆσαι
  choice: కట్టాలని
  rationale: నిర్మాణం చేయాలనే ఉద్దేశాన్ని సహజమైన తెలుగు క్రియతో వ్యక్తం చేస్తుంది.
- source_word: οὐχὶ
  choice: లెక్కించడు?
  rationale: οὐχί సానుకూల సమాధానాన్ని ఆశించే అలంకారప్రశ్నను సూచిస్తుంది; తెలుగు నిషేధ ప్రశ్నారూపం అదే బలాన్ని నిలుపుతుంది.
- source_word: πρῶτον καθίσας
  choice: ముందుగా కూర్చుని
  rationale: కృదంతం ప్రధాన క్రియకు ముందుగా జరిగే చర్యను సూచిస్తుంది; ఈ క్రమాన్ని తెలుగు సంయుక్త క్రియ సహజంగా తెలియజేస్తుంది.
- source_word: ψηφίζει τὴν δαπάνην
  choice: ఖర్చు లెక్కించడు
  rationale: ψηφίζω ఇక్కడ నిర్మాణ వ్యయాన్ని లెక్కించడం లేదా అంచనా వేయడం; δαπάνη వ్యయం. ‘ఖర్చు లెక్కించు’ సాధారణ పాఠకులకు స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: εἰ ἔχει εἰς ἀπαρτισμόν
  choice: దాన్ని పూర్తి చేయడానికి తన దగ్గర సరిపడా ఉందో లేదో
  rationale: మూలంలో వస్తువు స్పష్టంగా చెప్పబడకపోయినా, పూర్తిచేయడానికి తగిన వనరులు ఉన్నాయా అనేదే సందర్భార్థం. ‘సరిపడా’ గ్రీకు వాక్యంలోని అంతర్నిహిత సమృద్ధి భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘దాన్ని’ నిర్మాణ కార్యాన్ని సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. మూలంలోని అలంకారప్రశ్న, చర్యల క్రమం, నిర్మాణ రూపకం యథాతథంగా నిలిపాం. అవసరం లేని పాదటిప్పణులు చేర్చలేదు.
