  source_fidelity: The draft correctly preserves the rhetorical question, the intended construction of a tower, prior sitting down, calculating the expense, and assessing sufficiency for completion. However, «మీలో ఒకడు» weakens the interrogative force of τίς ἐξ ὑμῶν (“which of you?”), and «ఖర్చు లెక్కించడు» is more naturally expressed with the object marker.
  naturalness: The revised wording uses an idiomatic modern Telugu rhetorical question and makes the action sequence clear without adding meaning.
  terminology: «గోపురం» is retained as the established general Telugu equivalent for πύργος in this context. «ఖర్చును లెక్కించు» naturally represents ψηφίζει τὴν δαπάνην. No theological terminology is involved.
  issues:
  - severity: medium
    issue: «మీలో ఒకడు» does not fully represent τίς ἐξ ὑμῶν.
    rationale: The Greek explicitly asks “which/who among you,” whereas “one among you” is a declarative-style generic expression. A Telugu interrogative expression better preserves the rhetorical address.
  - severity: low
    issue: «ఖర్చు లెక్కించడు» lacks the natural object marking.
    rationale: «ఖర్చును లెక్కించు» is more grammatically complete and idiomatic in standard Telugu.
