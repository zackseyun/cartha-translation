revisions:
- from: ఎందుకంటే, మీలో ఒకడు గోపురం కట్టాలని అనుకుంటే, దాన్ని పూర్తి చేయడానికి తన దగ్గర సరిపడా ఉందో లేదో తెలుసుకోవడానికి ముందుగా కూర్చుని ఖర్చు లెక్కించడు?
  to: ఎందుకంటే, మీలో గోపురం కట్టాలని అనుకునేవాడు, దాన్ని పూర్తి చేయడానికి తన దగ్గర సరిపడినంత ఉందో లేదో తెలుసుకోవడానికి, ముందుగా కూర్చొని ఖర్చును లెక్కించకుండా ఉంటాడా?
  rationale: The revision restores the audience-directed rhetorical force of τίς ἐξ ὑμῶν through «మీలో ... అనుకునేవాడు ... లేకుండా ఉంటాడా?», retains the expected affirmative-answer form of οὐχί, and improves standard Telugu grammar with «ఖర్చును». The implied sufficiency of resources and the implied object of completion remain explicit only to the degree warranted by the construction context and the English audit trail.
