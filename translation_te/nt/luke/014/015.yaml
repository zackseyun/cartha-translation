- from: ఆ మాటలు విన్నప్పుడు, ఆయనతోపాటు భోజనానికి కూర్చున్నవారిలో ఒకడు ఆయనతో, “దేవుని రాజ్యంలో భోజనం చేసేవాడు ధన్యుడు!” అన్నాడు.[a]
  to: 'ఆ మాటలు విని, ఆయనతోపాటు భోజనానికి కూర్చున్నవారిలో ఒకడు ఆయనతో ఇలా అన్నాడు: “దేవుని రాజ్యంలో రొట్టె[a] తినేవాడు ధన్యుడు!”'
  rationale: The revision retains the source’s concrete “bread” and its future-oriented kingdom context without importing “banquet” into the text. The footnote preserves the possible idiomatic meal sense, and its anchor is moved to the expression it explains. The narrative wording remains natural, modern standard Telugu.
