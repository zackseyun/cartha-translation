id: LUK.14.15
reference: Luke 14:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀκούσας δέ τις τῶν συνανακειμένων ταῦτα εἶπεν αὐτῷ· Μακάριος ⸀ὅστις φάγεται ⸀ἄρτον ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/015.yaml
  text: But one of those reclining at the table with him[a], when he heard these things, said to him[b], “Blessed is whoever will eat bread in the kingdom of God.”
translation:
  language: te
  text: 'ఆ మాటలు విని, ఆయనతోపాటు భోజనానికి కూర్చున్నవారిలో ఒకడు ఆయనతో ఇలా అన్నాడు: “దేవుని రాజ్యంలో రొట్టె[a] తినేవాడు ధన్యుడు!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “రొట్టె తినడం.” ఈ గ్రీకు ప్రయోగం భోజనంలో పాలుపంచుకోవడాన్ని కూడా సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀκούσας
  choice: ఆ మాటలు విన్నప్పుడు
  rationale: అయోరిస్ట్ కృదంతంలోని కాలసంబంధ భావాన్ని సహజమైన తెలుగు ఉపవాక్యంగా వ్యక్తం చేస్తుంది; ταῦταను కూడా ఇందులో స్పష్టంగా కలుపుతుంది.
- source_word: δέ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది స్వల్ప కథన మార్పు లేదా స్పందనను సూచిస్తుంది. తెలుగులో వాక్యక్రమమే ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది; ‘అయితే’ చేరిస్తే అవసరానికి మించిన వ్యతిరేక భావం రావచ్చు.
- source_word: τις τῶν συνανακειμένων
  choice: ఆయనతోపాటు భోజనానికి కూర్చున్నవారిలో ఒకడు
  rationale: ఒక గుర్తుతెలియని సహపంక్తి అతిథిని సూచిస్తుంది. ప్రాచీన కాలపు ఆనుకుని భోజనం చేసే భంగిమను అక్షరార్థంగా ముందుకు తేవకుండా, భోజన సందర్భాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: εἶπεν αὐτῷ
  choice: ఆయనతో ... అన్నాడు
  rationale: గ్రీకు వాక్యంలోని సంబోధన దిశను స్పష్టంగా ఉంచే సహజ తెలుగు కథన ప్రయోగం.
- source_word: Μακάριος
  choice: ధన్యుడు
  rationale: కేవలం మానసిక సంతోషాన్ని కాక, దేవుని అనుగ్రహానికి పాత్రమైన శుభస్థితిని సూచించే ధార్మిక బరువును నిలుపుతుంది.
- source_word: ὅστις φάγεται ἄρτον
  choice: భోజనం చేసేవాడు
  rationale: ‘రొట్టె తినడం’ అనే గ్రీకు ప్రయోగం సందర్భంలో భోజనంలో పాలుపంచుకోవడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజ అర్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, అక్షరార్థ చిత్రాన్ని పాదసూచికలో నిలిపాం.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: దేవుని రాజ్యంలో
  rationale: మూలంలోని విభక్తి సంబంధాన్ని సూటిగా నిలుపుతుంది; మూలంలో లేని ‘విందు’ వంటి వివరాన్ని చేర్చదు.
theological_decisions:
- issue: Μακάριος అనే పదానికి అంత్యకాల రాజ్యభోజన సందర్భంలో ఉన్న ధన్యత భావం
  choice: దేవుని రాజ్యంలో భోజనం చేసేవాడు ధన్యుడు
  alternative: దేవుని రాజ్యంలో భోజనం చేసేవాడు సంతోషవంతుడు
  rationale: ‘ధన్యుడు’ దేవుని అనుగ్రహంతో కూడిన శుభస్థితిని నిలుపుతుంది; ‘సంతోషవంతుడు’ అనేది భావోద్వేగ స్థితికే పరిమితమయ్యే అవకాశం ఉంది.
- issue: ἄρτον యొక్క అక్షరార్థం మరియు భోజనార్థక నుడికారం
  choice: ప్రధాన పాఠ్యంలో ‘భోజనం చేసేవాడు’; పాదసూచికలో ‘రొట్టె తినేవాడు’
  alternative: ప్రధాన పాఠ్యంలో ‘రొట్టె తినేవాడు’
  rationale: గ్రీకులో ‘రొట్టె తినడం’ సహభోజనాన్ని సూచించగల సహజ నుడికారం. తెలుగు పాఠకునికి ఉద్దేశిత అర్థాన్ని స్పష్టంగా ఇస్తూనే, మూలంలోని దృశ్యాన్ని పాదసూచికలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. భోజన సందర్భాన్ని స్పష్టంగా ఉంచి, ప్రాచీన ఆనుకుని భోజనం చేసే భంగిమను అనవసరంగా ప్రధానాంశం చేయలేదు. ఆశ్చర్యార్థక చిహ్నం వక్త పలికిన ధన్యత ప్రకటన యొక్క ఉత్సాహాన్ని సూచిస్తుంది.
