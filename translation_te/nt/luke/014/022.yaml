source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ δοῦλος· Κύριε, γέγονεν ⸀ὃ ἐπέταξας, καὶ ἔτι τόπος ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/022.yaml
  text: And the servant said[a], ‘Lord, what you commanded has been done[b], and there is still room.’
translation:
  language: te
  text: అప్పుడు ఆ దాసుడు[a], ‘ప్రభువా[b], మీరు ఆజ్ఞాపించినది జరిగింది; ఇంకా చోటు ఉంది’ అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సేవకుడు’ (δοῦλος).
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘యజమానీ’ (Κύριε).
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: దాసుడు
  rationale: ఈ పదం యజమాని అధికారానికి లోబడిన వ్యక్తిని సూచిస్తుంది. ‘దాసుడు’ మూలపదంలోని బంధిత సేవాస్థితిని కాపాడుతూ, ఉపమాన సందర్భంలో సహజంగా ఉంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: ఇది ఇంటి యజమానిని నేరుగా సంబోధించే సంబోధనారూపం. ‘ప్రభువా’ κύριος యొక్క సాధారణ అర్థాన్ని నిలుపుతుంది; ఈ సందర్భంలో ‘యజమానీ’ కూడా సాధ్యమే.
- source_word: γέγονεν
  choice: జరిగింది
  rationale: γίνομαι యొక్క పరిపూర్ణకాల రూపం ఆజ్ఞ నెరవేరి, దాని ఫలితం ప్రస్తుతం నిలిచి ఉందని తెలియజేస్తుంది. తెలుగులో ‘జరిగింది’ సహజంగా ఈ పూర్తయిన కార్యాన్ని తెలియజేస్తుంది.
- source_word: ὃ ἐπέταξας
  choice: మీరు ఆజ్ఞాపించినది
  rationale: సంబంధసర్వనామం యజమాని ఇంతకు ముందు ఇచ్చిన ఆదేశంలోని విషయాన్ని సూచిస్తుంది; ‘ఆజ్ఞాపించినది’ క్రియలోని అధికార భావాన్ని నిలుపుతుంది.
- source_word: ἔτι
  choice: ఇంకా
  rationale: ఆజ్ఞ అమలైన తరువాత కూడా స్థలం మిగిలి ఉందనే కొనసాగుతున్న స్థితిని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τόπος
  choice: చోటు
  rationale: విందు సందర్భంలో అందుబాటులో ఉన్న స్థలాన్ని సూచిస్తుంది. ‘చోటు’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. గ్రీకు వాక్యంలోని క్రమం మరియు యజమాని–దాసుని సంబంధం సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
