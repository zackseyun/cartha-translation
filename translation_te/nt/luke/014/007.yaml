translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. గ్రీకు వాక్యంలోని కృదంత నిర్మాణాలను తెలుగులో సులభంగా చదవదగిన క్రమంలో అమర్చినా, గమనించడం, ఎంచుకుంటూ ఉండడం, ఉపమానం చెప్పడం అనే భావ సంబంధాలు నిలుపబడ్డాయి. పాదసూచిక గుర్తును దాని వివరణకు సంబంధించిన ‘గౌరవ స్థానాలను’ అన్న పదబంధం వద్ద ఉంచాం.
