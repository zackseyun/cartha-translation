  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ πρὸς τοὺς κεκλημένους παραβολήν, ἐπέχων πῶς τὰς πρωτοκλισίας ἐξελέγοντο, λέγων πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/007.yaml
  text: 'He was telling a parable to those who had been invited[a], noticing how they were choosing the places of honor, saying to them:'
translation:
  language: te
  text: 'ఆహ్వానించబడినవారు గౌరవస్థానాలను[a] ఎలా ఎంచుకుంటున్నారో గమనిస్తూ, ఆయన వారితో ఒక ఉపమానం చెప్పసాగాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రధాన స్థానాలను.’ గ్రీకు పదం విందులో అత్యంత గౌరవనీయమైన స్థానాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: చెబుతూ ఇలా అన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం నేపథ్యంగా కొనసాగుతున్న మాటను సూచిస్తుంది. తెలుగులో తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని సహజంగా పరిచయం చేయడానికి ఈ ప్రయోగం అనుకూలంగా ఉంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప కథన అనుసంధానాన్ని మాత్రమే సూచిస్తుంది; తెలుగులో వాక్యప్రవాహమే ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τοὺς κεκλημένους
  choice: ఆహ్వానించబడినవారు
  rationale: καλέω యొక్క పరిపూర్ణ కృదంతం వారు ఆహ్వానించబడి ఉన్న స్థితిని సూచిస్తుంది; ‘అతిథులు’ అనే అంతర్భావాన్ని అదనంగా చేర్చకుండా మూల భావాన్ని నిలుపుతుంది.
- source_word: παραβολήν
  choice: ఒక ఉపమానం
  rationale: సువార్తల్లో παραβολήకు సాధారణంగా వాడే, ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన పదం.
- source_word: ἐπέχων
  choice: గమనించి
  rationale: వారు చేస్తున్న పనిని యేసు శ్రద్ధగా గమనించడమే తరువాతి ఉపమానానికి సందర్భమని సహజంగా తెలియజేస్తుంది.
- source_word: πῶς
  choice: ఎలా
  rationale: వారు ఏ విధంగా ప్రవర్తిస్తున్నారో తెలిపే మూలంలోని విధానార్థాన్ని నేరుగా అందిస్తుంది.
- source_word: πρωτοκλισίας
  choice: గౌరవ స్థానాలను
  rationale: విందులో సామాజికంగా అత్యంత గౌరవనీయమైన పడక లేదా కూర్చునే స్థానాలను సూచిస్తుంది; ఆధునిక పాఠకులకు దాని ప్రాముఖ్యతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐξελέγοντο
  choice: ఎంచుకుంటున్నారో
  rationale: అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న లేదా పునరావృత చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; మధ్యమ వాచ్యంలోని స్వప్రయోజన ఛాయను సందర్భమే తెలియజేస్తుంది.
- source_word: λέγων πρὸς αὐτούς
  choice: వారితో ... చెబుతూ ఇలా అన్నాడు
  rationale: తరువాత వచ్చే ప్రత్యక్ష బోధను పరిచయం చేస్తూ, ఆయన వారినే ఉద్దేశించి మాట్లాడాడని స్పష్టం చేస్తుంది.
