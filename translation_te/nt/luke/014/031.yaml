id: LUK.14.31
reference: Luke 14:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἢ τίς βασιλεὺς πορευόμενος ⸂ἑτέρῳ βασιλεῖ συμβαλεῖν⸃ εἰς πόλεμον οὐχὶ καθίσας πρῶτον ⸀βουλεύσεται εἰ δυνατός ἐστιν ἐν δέκα χιλιάσιν ⸀ὑπαντῆσαι τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/031.yaml
  text: Or what king[a], going to meet another king in war, will not first sit down and consider whether he is able with ten thousand to oppose the one coming against him with twenty thousand?
translation:
  language: te
  text: లేదా, మరొక రాజుతో యుద్ధానికి వెళ్లే ఏ రాజైనా, తన మీదికి ఇరవై వేల మందితో వస్తున్నవాణ్ణి తాను పదివేల మందితో ఎదుర్కోగలడో లేదో మొదట కూర్చుని ఆలోచించడా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఎదుర్కోగలడో” అనే చోట “ఎదురుగా వెళ్లి కలుసుకోగలడో” అని కూడా అనువదించవచ్చు. గ్రీకు క్రియ అక్షరార్థంగా కలుసుకోవడాన్ని సూచించగలదు; ఇక్కడ యుద్ధానికి వస్తున్న సైన్యాన్ని ఎదుర్కోవడం భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: లేదా
  rationale: యేసు చెప్పే రెండవ ఉపమానాత్మక పోలికను పరిచయం చేస్తూ, వాక్యంలోని ప్రశ్నాత్మక ప్రవాహాన్ని సహజంగా కొనసాగిస్తుంది.
- source_word: τίς βασιλεὺς
  choice: ఏ రాజైనా
  rationale: నిర్దిష్ట రాజును కాక సాధారణంగా ఏ రాజైనా ఇలాగే చేస్తాడనే గ్రీకు ప్రశ్నార్థక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πορευόμενος ἑτέρῳ βασιλεῖ συμβαλεῖν εἰς πόλεμον
  choice: మరొక రాజుతో యుద్ధానికి వెళ్లే
  rationale: ప్రయాణం, ప్రత్యర్థి రాజు, సాయుధ సంఘర్షణ అనే అంశాలను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: οὐχὶ καθίσας πρῶτον βουλεύσεται
  choice: మొదట కూర్చుని ఆలోచించడా?
  rationale: οὐχί ఆశించే సమ్మత జవాబును తెలుగు అలంకారప్రశ్న ద్వారా తెలియజేస్తూ, ముందుగా కూర్చోవడం మరియు యోచించడం అనే క్రమాన్ని కాపాడుతుంది.
- source_word: εἰ δυνατός ἐστιν
  choice: ఎదుర్కోగలడో లేదో
  rationale: సైనిక బలసామర్థ్యాన్ని పరిశీలించే భావాన్ని తెలుగు పరోక్ష ప్రశ్నలో సహజంగా అందిస్తుంది.
- source_word: ἐν δέκα χιλιάσιν
  choice: పదివేల మందితో
  rationale: ἐν యొక్క సహచర్య/సాధన భావాన్ని సైనికుల సంఖ్యగా స్పష్టం చేస్తుంది; ‘మంది’ చేర్చడం తెలుగులో సహజం.
- source_word: ὑπαντῆσαι
  choice: ఎదుర్కోగలడో
  rationale: మూలంగా ‘ఎదురుగా కలవడం’ అనే భావం ఉన్నా, ఈ యుద్ధ సందర్భంలో ప్రతిఘటించేందుకు ఎదురుపడటాన్ని ‘ఎదుర్కోవడం’ సహజంగా తెలియజేస్తుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν
  choice: తన మీదికి ఇరవై వేల మందితో వస్తున్నవాణ్ణి
  rationale: ప్రత్యర్థి రాజు పెద్ద సైన్యంతో శత్రుత్వంగా ముందుకు రావడాన్ని మూలంలోని సంబంధకృదంత నిర్మాణానికి దగ్గరగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన వాక్యశైలితో అనువదించబడింది. అలంకారప్రశ్న స్వరూపం నిలుపబడింది; సైన్యాల సంఖ్యకు సహజమైన ‘మంది’ వాడబడింది.
