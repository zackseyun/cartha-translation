id: LUK.14.12
reference: Luke 14:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τῷ κεκληκότι αὐτόν· Ὅταν ποιῇς ἄριστον ἢ δεῖπνον, μὴ φώνει τοὺς φίλους σου μηδὲ τοὺς ἀδελφούς σου μηδὲ τοὺς συγγενεῖς σου μηδὲ γείτονας πλουσίους, μήποτε καὶ αὐτοὶ ⸂ἀντικαλέσωσίν σε⸃ καὶ γένηται ⸂ἀνταπόδομά σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/012.yaml
  text: And he was also saying to the one who had invited him[a], “When you give a luncheon or a dinner, do not invite your friends or your brothers or your relatives or rich neighbors[c][b], lest they also invite you in return and it become repayment to you.”
translation:
  language: te
  text: 'తనను ఆహ్వానించిన వ్యక్తితో కూడా ఆయన ఇలా అన్నాడు: “నువ్వు మధ్యాహ్న భోజనమైనా రాత్రి భోజనమైనా ఏర్పాటు చేసినప్పుడు, నీ స్నేహితులను గానీ, నీ అన్నదమ్ములను గానీ, నీ బంధువులను గానీ, ధనవంతులైన పొరుగువారిని గానీ ఆహ్వానించవద్దు. ఎక్కడ వారు కూడా నిన్ను తిరిగి ఆహ్వానించి, అది నీకు ప్రతిఫలంగా అవుతుందేమో.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγεν δὲ καὶ
  choice: ఆయన ఇంకా ఇలా అన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న సంభాషణను సూచిస్తుంది. తెలుగులో సహజమైన కథనశైలిని కాపాడుతూ καὶ యొక్క ‘కూడా/ఇంకా’ భావాన్ని ‘ఇంకా’తో వ్యక్తం చేశాం.
- source_word: τῷ κεκληκότι αὐτόν
  choice: తనను ఆహ్వానించిన వ్యక్తితో
  rationale: పర్ఫెక్ట్ పార్టిసిపిల్ గతంలో ఆహ్వానించి ప్రస్తుతం ఆతిథ్యమిస్తున్న వ్యక్తిని సూచిస్తుంది; ‘ఆతిథ్యమిచ్చినవాడు’ కంటే మూలంలోని ఆహ్వాన భావాన్ని ఇది నేరుగా నిలుపుతుంది.
- source_word: Ὅταν ποιῇς
  choice: ఏర్పాటు చేసినప్పుడు
  rationale: భోజన పదాలతో ποιέω అంటే కేవలం వండడం కాదు, భోజనం ఏర్పాటు చేయడం లేదా ఇవ్వడం. సందర్భానికి ‘ఏర్పాటు చేయడం’ సహజంగా సరిపోతుంది.
- source_word: ἄριστον
  choice: మధ్యాహ్న భోజనం
  rationale: ఇది దినపు తొలి భాగంలో తీసుకునే భోజనాన్ని, సాధారణంగా మధ్యాహ్న సమీపంలోని భోజనాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘అల్పాహారం’ అంటే ఉదయపు భోజనం అనే అపార్థం కలగవచ్చు.
- source_word: δεῖπνον
  choice: రాత్రి భోజనం
  rationale: ఇది సాధారణంగా దినపు తరువాతి ప్రధాన భోజనం. ἄριστον‌తో ఉన్న కాలభేదాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: μὴ φώνει
  choice: ఆహ్వానించవద్దు
  rationale: φωνέω అక్షరార్థంగా ‘పిలువు’ అయినా, విందు సందర్భంలో ఉద్దేశం ఆహ్వానించడమే.
- source_word: τοὺς ἀδελφούς σου
  choice: నీ అన్నదమ్ములను
  rationale: మూలంలోని పురుష బహువచన కుటుంబపదాన్ని లింగతటస్థంగా మార్చకుండా, సహజమైన ఆధునిక తెలుగు రూపంలో నిలిపాం.
- source_word: τοὺς συγγενεῖς σου
  choice: నీ బంధువులను
  rationale: సంబంధీకులు లేదా ఒకే వంశానికి చెందినవారు అనే విస్తృత భావానికి ‘బంధువులు’ స్పష్టమైన ఆధునిక సమానం.
- source_word: γείτονας πλουσίους
  choice: ధనవంతులైన పొరుగువారిని
  rationale: πλουσίους నేరుగా γείτονας‌ను విశేషిస్తుంది; తెలుగు పదక్రమంలో ఈ సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: μήποτε
  choice: ఎందుకంటే ... ఆహ్వానించవచ్చు
  rationale: ఇది ప్రతికూల సంభావ్యతతో కూడిన హెచ్చరికను ప్రవేశపెడుతుంది. ‘ఎక్కడ ... చేస్తారో’ అనే అసహజ నిర్మాణం బదులు సంభావ్యతను స్పష్టంగా, సహజంగా తెలిపాం.
- source_word: ἀντικαλέσωσίν σε
  choice: వారు కూడా తిరిగి నిన్ను ఆహ్వానించవచ్చు
  rationale: ἀντι- ఉపసర్గలోని పరస్పర ప్రతిస్పందన భావాన్ని ‘తిరిగి’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: γένηται ἀνταπόδομά σοι
  choice: అప్పుడు నీకు ప్రతిఫలం లభించినట్టవుతుంది
  rationale: మూలంలోని ‘అది నీకు ప్రతిఫలంగా అవుతుంది’ అనే భావాన్ని సహజ తెలుగులో అందిస్తూ, ఆహ్వానానికి బదులుగా ఆహ్వానం లభించడమే పూర్తి ప్రతిఫలం అవుతుందనే అర్థాన్ని నిలిపాం.
theological_decisions:
- issue: స్నేహితులు లేదా బంధువులను ఎప్పటికీ ఆహ్వానించకూడదనే సంపూర్ణ నిషేధమా, లేక ప్రతిఫలం ఆశించే ఆతిథ్యంపై హెచ్చరికా
  choice: ఆజ్ఞను మూలంలోని నేర రూపంలోనే ఉంచాం; దాని పరిధిని అనువాదంలో పరిమితం చేయలేదు.
  alternative: ‘ప్రతిఫలం ఆశిస్తూ ... ఆహ్వానించవద్దు’ అని ఉద్దేశాన్ని వాక్యంలో చేర్చడం.
  rationale: మూల వాక్యం నేరంగా ‘ఆహ్వానించవద్దు’ అంటుంది; ఆశయాన్ని స్పష్టీకరించడం సాధ్యమైన వ్యాఖ్యానం అయినా, దాన్ని అనువాదంలో చేరిస్తే యేసు మాటల ఉద్దేశపూర్వక తీవ్రత తగ్గుతుంది.
- issue: ἀνταπόδομα యొక్క అర్థం
  choice: ప్రతిఫలం
  alternative: తీర్చివేత లేదా బదులు
  rationale: ఇక్కడ ఆర్థిక చెల్లింపు కాదు, సామాజిక పరస్పర ఆహ్వానమే తిరిగి లభించే ప్రతిఫలం. ‘ప్రతిఫలం’ ఈ విస్తృత భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. యేసు ఒక వ్యక్తిని ఉద్దేశిస్తున్నందున ఏకవచన అనౌపచారిక ‘నువ్వు/నీ’ రూపాలు వాడబడ్డాయి. మూలంలో పాఠాంతర లేదా అర్థసందిగ్ధతను తప్పనిసరిగా సూచించాల్సిన స్థాయి లేకపోవడంతో పాదటిప్పణులు ఇవ్వలేదు.
