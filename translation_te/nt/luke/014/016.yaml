  yaml_path: translation/nt/luke/014/016.yaml
  text: But he said to him[a], “A certain man was making a great dinner and invited many,”
translation:
  language: te
  text: 'అయితే ఆయన అతనితో ఇలా అన్నాడు: “ఒక మనిషి పెద్ద విందు[a] ఏర్పాటు చేస్తూ చాలామందిని ఆహ్వానించాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గొప్ప భోజనం,” “పెద్ద రాత్రి భోజనం.” గ్రీకు పదం δεῖπνον సాధారణంగా రోజులోని ప్రధాన భోజనాన్ని సూచిస్తుంది; ఈ సందర్భంలో అది ఆతిథ్యంతో ఏర్పాటు చేసిన విందు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: అయితే ఆయన అతనితో ఇలా అన్నాడు
  rationale: δέ ఇక్కడ మునుపటి మాటకు స్పందనగా సంభాషణలో వచ్చే మృదువైన మలుపును సూచిస్తుంది. ‘అయితే’ దానిని అతిగా విరోధార్థకం చేయకుండా సహజంగా తెలియజేస్తుంది.
- source_word: Ἄνθρωπός τις
  choice: ఒక మనిషి
  rationale: τις తెలిపే అనిర్దిష్టతను ‘ఒక’ సహజంగా వ్యక్తపరుస్తుంది; ‘మనిషి’ మూలంలోని పురుష ఏకవచన రూపాన్ని నిలుపుతుంది.
- source_word: ἐποίει
  choice: ఏర్పాటు చేస్తూ
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న సన్నాహక చర్యను సూచిస్తుంది. విందు సందర్భంలో అక్షరార్థమైన ‘చేస్తూ’ కంటే ‘ఏర్పాటు చేస్తూ’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: δεῖπνον μέγα
  choice: పెద్ద విందు
  rationale: δεῖπνον ప్రధాన భోజనాన్ని, ఈ సందర్భంలో ఆతిథ్యంతో కూడిన భోజనాన్ని సూచిస్తుంది; μέγα దాని ఘనత లేదా పరిమాణాన్ని తెలియజేస్తుంది. ‘పెద్ద విందు’ రెండింటినీ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: καὶ ἐκάλεσεν πολλούς
  choice: చాలామందిని ఆహ్వానించాడు
  rationale: ఆతిథ్య భోజన సందర్భంలో καλέω అంటే ‘పిలిచాడు’ కంటే ‘ఆహ్వానించాడు’ అని అర్థం. πολλούς‌ను ‘చాలామందిని’ సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని కొనసాగుతున్న ἐποίει చర్యను ‘ఏర్పాటు చేస్తూ’ ద్వారా, తరువాతి సంపూర్ణ ఆహ్వాన చర్యను ‘ఆహ్వానించాడు’ ద్వారా వేరు చేసి చూపించాం.
