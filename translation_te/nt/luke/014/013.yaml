source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν ⸂δοχὴν ποιῇς⸃, κάλει πτωχούς, ἀναπείρους, χωλούς, τυφλούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/013.yaml
  text: But whenever you give a banquet[a], invite the poor, the crippled, the lame[b], the blind.
translation:
  language: te
  text: కాని నీవు విందు[a] ఏర్పాటు చేసినప్పుడల్లా, పేదవారిని, శారీరక వైకల్యం ఉన్నవారిని[b], కుంటివారిని, చూపులేనివారిని ఆహ్వానించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భోజన విందు” లేదా “ఆతిథ్య సమావేశం.”
    reason: δοχή అనే పదం సందర్భానుసారం విందు, భోజన విందు లేదా ఆతిథ్య సమావేశాన్ని సూచించగలదు.
  - marker: b
    text: ఈ గ్రీకు పదం శారీరక లేదా అవయవ సంబంధ వైకల్యం ఉన్నవారిని సూచిస్తుంది; “అంగవైకల్యం ఉన్నవారిని” అని కూడా అనువదించవచ్చు.
    reason: ἀναπείρους యొక్క విస్తృత శారీరక వైకల్య భావాన్నీ, తరువాతి ‘కుంటివారు’తో ఉన్న భేదాన్నీ స్పష్టం చేస్తుంది.
lexical_decisions:
- source_word: ἀλλ’
  choice: కాని
  rationale: ముందటి వాక్యంలోని ఆహ్వానించకూడని వారి జాబితాకు విరుద్ధంగా ఈ ఆదేశాన్ని అనుసంధానించే సహజమైన వ్యతిరేకార్థక సంధానం.
- source_word: ὅταν
  choice: చేసినప్పుడల్లా
  rationale: ఉపవాక్యంలోని అనిశ్చితమైన, పునరావృత కాలభావాన్ని వ్యక్తం చేస్తుంది; ఇది ఒక్క సందర్భాన్ని మాత్రమే సూచించదు.
- source_word: δοχὴν ποιῇς
  choice: నీవు విందు ఏర్పాటు చేసినప్పుడు
  rationale: విందు లేదా ఆతిథ్య సమావేశాన్ని నిర్వహించడం అనే గ్రీకు నుడికార భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: κάλει
  choice: ఆహ్వానించు
  rationale: భోజన సందర్భంలో καλέω అంటే కేవలం పిలవడం కాక ఆహ్వానించడం; ఆజ్ఞార్థక రూపాన్ని ఏకవచన ఆదేశంగా నిలుపుతుంది.
- source_word: πτωχούς
  choice: పేదవారిని
  rationale: పేద వ్యక్తులను సూచించే నామవాచకంగా వాడిన విశేషణాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: ἀναπείρους
  choice: శారీరక వైకల్యం ఉన్నవారిని
  rationale: శారీరక లేదా అవయవ సంబంధ వైకల్యం గలవారిని సూచించే పదాన్ని వ్యక్తి-కేంద్రిత ఆధునిక భాషలో అందిస్తూ, తరువాతి χωλούς అనే ప్రత్యేక వర్గంతో పూర్తిగా కలిపివేయదు.
- source_word: χωλούς
  choice: కుంటివారిని
  rationale: నడకలో వైకల్యం ఉన్నవారిని ప్రత్యేకంగా సూచిస్తుంది; ముందున్న విస్తృత శారీరక వైకల్య వర్గం నుంచి గ్రీకు జాబితాలోని భేదాన్ని నిలుపుతుంది.
- source_word: τυφλούς
  choice: చూపులేనివారిని
  rationale: అంధులైన వ్యక్తులను గౌరవప్రదమైన, సాధారణ ఆధునిక తెలుగులో సూచిస్తుంది.
theological_decisions:
- issue: వైకల్యానికి సంబంధించిన రెండు గ్రీకు పదాల భేదాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో నిలుపడం
  choice: ἀναπείρους ను ‘శారీరక వైకల్యం ఉన్నవారు’గా, χωλούς ను ‘కుంటివారు’గా వేర్వేరుగా అనువదించడం
  alternative: రెండింటినీ ‘వికలాంగులు’ అనే ఒకే విస్తృత పదంలో కలపడం, లేదా ἀναπείρους ను ‘అవయవాలు లేనివారు’గా కుదించడం
  rationale: గ్రీకు మూలం రెండు వేరు వర్గాలను వరుసగా పేర్కొంటుంది. మొదటి పదానికి విస్తృత శారీరక వైకల్య భావాన్ని, రెండవదానికి నడకలోని వైకల్య భావాన్ని ఇవ్వడం మూలంలోని జాబితా నిర్మాణాన్నీ సామాజికంగా పక్కకు నెట్టబడినవారికి ఆతిథ్యం ఇవ్వాలనే ఆదేశాన్నీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వ్యక్తి-కేంద్రిత పదజాలం వాడబడింది. గ్రీకు మూలంలోని సంక్షిప్త జాబితా, వ్యతిరేక సంధానం, పునరావృత కాలభావం, ఏకవచన ఆజ్ఞ అన్నీ నిలుపబడ్డాయి.
