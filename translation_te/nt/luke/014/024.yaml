revisions:
- from: 'ఎందుకంటే, మీతో చెబుతున్నాను: ఆహ్వానించబడిన ఆ మనుష్యులలో ఒక్కడైనా నా విందును రుచి చూడడు.[a]'
  to: 'ఎందుకంటే నేను మీతో చెబుతున్నాను: ఆహ్వానించబడిన ఆ పురుషుల్లో ఎవరూ నా విందును రుచి చూడరు.[a]'
  rationale: 'The revision improves natural modern Telugu and makes the male reference explicit, while preserving the Greek syntax and sense: explanatory ‘for,’ direct address, absolute exclusion of the previously invited men, the imagery of tasting, and the host’s first-person possessive. No allegorical interpretation is added.'
