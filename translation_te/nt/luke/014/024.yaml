  text: λέγω γὰρ ὑμῖν ὅτι οὐδεὶς τῶν ἀνδρῶν ἐκείνων τῶν κεκλημένων γεύσεταί μου τοῦ ⸀δείπνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/024.yaml
  text: For I tell you that none of those men who were invited will taste my dinner[a].
translation:
  language: te
  text: 'ఎందుకంటే నేను మీతో చెబుతున్నాను: ఆహ్వానించబడిన ఆ పురుషుల్లో ఎవరూ నా విందును రుచి చూడరు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా భోజనాన్ని’; సంప్రదాయంగా ‘నా రాత్రి భోజనాన్ని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: ఎందుకంటే, మీతో చెబుతున్నాను
  rationale: γάρ యొక్క వివరణాత్మక భావాన్ని ‘ఎందుకంటే’తో, λέγω ... ὑμῖν అనే ప్రత్యక్ష సంబోధనను సహజమైన ఆధునిక తెలుగులో ‘మీతో చెబుతున్నాను’తో నిలిపింది.
- source_word: οὐδεὶς τῶν ἀνδρῶν ἐκείνων
  choice: ఆ మనుష్యులలో ఒక్కడైనా
  rationale: οὐδείς యొక్క సంపూర్ణ నిరాకరణను ‘ఒక్కడైనా ... చూడడు’ అనే తెలుగు నిర్మాణం బలంగా వ్యక్తం చేస్తుంది; ἀνδρῶν లోని పురుషలింగ సూచనను ‘మనుష్యులు’గా నిలిపింది.
- source_word: τῶν κεκλημένων
  choice: ఆహ్వానించబడిన
  rationale: καλέω యొక్క perfect passive participle విందుకు ఇప్పటికే ఆహ్వానం పొందినవారిని సూచిస్తుంది; ఈ సందర్భంలో ‘పిలువబడిన’ కంటే ‘ఆహ్వానించబడిన’ స్పష్టంగా ఉంటుంది.
- source_word: γεύσεταί
  choice: రుచి చూడడు
  rationale: γεύομαι లోని ‘రుచి చూడు’ అనే మూల చిత్రణను నిలుపుతూ, భోజనంలో పాలుపొందకపోవడమనే విస్తృత భావాన్నీ సహజంగా సూచిస్తుంది.
- source_word: μου τοῦ δείπνου
  choice: నా విందును
  rationale: δεῖπνον ప్రధాన భోజనం, సాయంత్రపు భోజనం లేదా విందును సూచించగలదు. ఉపమానంలోని సందర్భానికి ‘విందు’ సహజంగా సరిపోతుంది; μου లోని ప్రథమ పురుష స్వామ్యాన్ని ‘నా’గా నిలిపింది.
theological_decisions:
- issue: ఉపమానంలోని యజమాని మాటను దేవుని విందుగా నేరుగా వ్యాఖ్యానించాలా
  choice: ‘నా విందును’ అని కథలోని ప్రథమ పురుష స్వరాన్నే నిలిపివేయడం
  alternative: ‘దేవుని విందును’ అని స్పష్టీకరించడం
  rationale: గ్రీకు పాఠ్యంలో ఉన్న μου (‘నా’)ను అలాగే ఉంచడం వల్ల ఉపమానాన్ని అనువాదంలోనే సిద్ధాంతపరంగా విప్పకుండా, దాని కథన స్వరం మరియు వ్యాఖ్యానాత్మక ఉద్రిక్తత నిలుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘రుచి చూడడు’ అనే సహజ ప్రయోగం గ్రీకు రూపకాన్ని నిలుపుతుంది.
