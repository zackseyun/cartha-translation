source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ἐλθεῖν αὐτὸν εἰς οἶκόν τινος τῶν ἀρχόντων τῶν Φαρισαίων σαββάτῳ φαγεῖν ἄρτον καὶ αὐτοὶ ἦσαν παρατηρούμενοι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/001.yaml
  text: And it happened that when he went into the house of one of the rulers of the Pharisees on the Sabbath to eat bread[b][a], they were watching him closely.
translation:
  language: te
  text: 'ఇలా జరిగింది: ఒక సబ్బాతు దినాన ఆయన భోజనం చేయడానికి[a] పరిసయ్యుల నాయకులలో ఒకరి ఇంటికి వెళ్లినప్పుడు, వారు ఆయనను నిశితంగా గమనిస్తూ ఉన్నారు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘రొట్టె తినడానికి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆయనను జాగ్రత్తగా పరిశీలిస్తూ ఉన్నారు.’ గ్రీకు పదం అనుమానంతో లేదా విరోధభావంతో గమనించడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: వెళ్లినప్పుడు
  rationale: ఇది లూకా తరచుగా ఉపయోగించే కథనారంభ సూత్రం. తెలుగులో విడిగా ‘ఇలా జరిగింది’ అని పెట్టడం సహజ ప్రవాహాన్ని భారంగా చేయగలదు; కాలసూచక ఉపవాక్యంతో దాని కథన విధి సహజంగా వ్యక్తమవుతుంది.
- source_word: ἐν τῷ ἐλθεῖν αὐτὸν
  choice: ఆయన ... ఇంటికి వెళ్లినప్పుడు
  rationale: ἐν తో కూడిన articular infinitive కాలార్థకమైనది. ‘వెళ్లినప్పుడు’ ఆధునిక తెలుగులో సహజంగా ఆ కాలసంబంధాన్ని తెలియజేస్తుంది.
- source_word: οἶκόν
  choice: ఇంటికి
  rationale: సందర్భంలోని ఆతిథ్య భోజనానికి ‘ఇల్లు/ఇంటి’ నేరమైన, సహజమైన సమానార్థకం.
- source_word: τινος τῶν ἀρχόντων τῶν Φαρισαίων
  choice: పరిసయ్యుల నాయకుల్లో ఒకరి
  rationale: ἀρχόντων ఇక్కడ నాయకత్వ స్థానాల్లో ఉన్నవారిని సూచిస్తుంది. ‘నాయకుల్లో ఒకరు’ అనే రూపం సమూహంలోని ఒకరనే గ్రీకు నిర్మాణాన్ని నిలుపుతుంది.
- source_word: σαββάτῳ
  choice: ఒక విశ్రాంతి దినాన
  rationale: దత్తివిభక్తి కాలాన్ని సూచిస్తుంది; గ్రీకులో article లేకపోవడం వల్ల ‘ఒక’ అనేది సందర్భానికి తగినది. ‘విశ్రాంతి దినం’ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: φαγεῖν ἄρτον
  choice: భోజనం చేయడానికి
  rationale: అక్షరార్థంగా ‘రొట్టె తినడానికి’ అయినా, ఇది భోజనం చేయడాన్ని సూచించే నుడికారం. సహజమైన అర్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: παρατηρούμενοι
  choice: నిశితంగా గమనిస్తూ ఉన్నారు
  rationale: క్రియ శ్రద్ధగా, దగ్గరగా గమనించడాన్ని సూచిస్తుంది; కొన్ని సందర్భాల్లో అనుమానంతో లేదా విరోధభావంతో చూడటం అనే ఛాయ ఉండవచ్చు. ప్రధాన అనువాదం ఆ ఉద్రిక్తతను నిలుపుతూ ఉద్దేశాన్ని అతిగా నిర్ధారించదు.
- source_word: αὐτοὶ
  choice: వారు
  rationale: గ్రీకులో సర్వనామానికి కొంత బలం ఉన్నా, తెలుగులో ‘వారు’ సందర్భానుసారంగా సహజంగా ఉండి అవసరమైన కర్త భేదాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: యేసును గమనించడంలో సూచితమైన విరోధభావం
  choice: వారు ఆయనను నిశితంగా గమనిస్తూ ఉన్నారు
  alternative: వారు ఆయనపై నిఘా పెట్టి ఉన్నారు
  rationale: παρατηρούμενοι అనుమానపూరితమైన లేదా విరోధపూరితమైన పరిశీలనను సూచించవచ్చు; అయితే ఈ వాక్యం వారి దురుద్దేశాన్ని స్పష్టంగా ప్రకటించదు. అందువల్ల ఉద్దేశాన్ని ఖరారు చేయకుండా కథనంలోని ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘భోజనం చేయడానికి’ సాధారణ పాఠకుడికి నుడికారార్థాన్ని స్పష్టంగా ఇస్తుంది; మూలంలోని ‘రొట్టె’ రూపాన్ని పాదసూచికలో భద్రపరిచాం. గమనించడంలోని సాధ్యమైన విరోధ ఛాయను ప్రధాన పాఠ్యంలో అతిశయింపకుండా ఉంచాం.
