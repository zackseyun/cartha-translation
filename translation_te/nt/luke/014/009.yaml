id: LUK.14.9
reference: Luke 14:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ὁ σὲ καὶ αὐτὸν καλέσας ἐρεῖ σοι· Δὸς τούτῳ τόπον, καὶ τότε ἄρξῃ μετὰ αἰσχύνης τὸν ἔσχατον τόπον κατέχειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/009.yaml
  text: and the one who invited both you and him will come and say to you[a], ‘Give this man your place,’ and then you will begin with shame to take the last place.
translation:
  language: te
  text: నిన్నూ అతనినీ ఆహ్వానించినవాడు వచ్చి నీతో, ‘నీ స్థానాన్ని ఇతనికి ఇవ్వు’ అని చెబుతాడు. అప్పుడు నువ్వు సిగ్గుతో చివరి స్థానంలో కూర్చోవడం మొదలుపెడతావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అత్యల్ప గౌరవస్థానంలో.” గ్రీకు పదబంధం τὸν ἔσχατον τόπον విందులో క్రమానుసారంగా చివరి స్థానాన్ని, అందువల్ల అతి తక్కువ గౌరవమున్న స్థానాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σὲ καὶ αὐτὸν καλέσας
  choice: నిన్నూ అతనినీ ఆహ్వానించినవాడు
  rationale: ఆహ్వానించిన వ్యక్తిని సూచించే substantival participle నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతూ, ఇద్దరు ఆహ్వానితుల మధ్య వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: ἐλθὼν ... ἐρεῖ σοι
  choice: వచ్చి ... నీతో చెబుతాడు
  rationale: భవిష్యత్ ప్రధాన క్రియతో అనుసంధానమైన aorist participleను తెలుగులో సహజమైన వరుస చర్యలుగా వ్యక్తపరుస్తుంది.
- source_word: Δὸς τούτῳ τόπον
  choice: ఇతనికి చోటు ఇవ్వు
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్తతను కాపాడుతుంది; విందు సందర్భంలో తన స్థానాన్ని ఇతనికి వదలాలనే భావం స్పష్టమవుతుంది.
- source_word: μετὰ αἰσχύνης
  choice: సిగ్గుతో
  rationale: αἰσχύνηలోని సామాజిక అవమానం, సిగ్గు భావాన్ని సరళంగా, బలహీనపరచకుండా వ్యక్తపరుస్తుంది.
- source_word: τὸν ἔσχατον τόπον
  choice: చివరి చోటును
  rationale: ἔσχατος యొక్క ప్రాథమికమైన ‘చివరి’ భావాన్ని నిలుపుతుంది; విందు సందర్భంలో అది అత్యల్ప గౌరవస్థానాన్ని కూడా సూచించగలదనే అంశాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
- source_word: κατέχειν
  choice: ఆక్రమించడం
  rationale: ఒక స్థానాన్ని స్వీకరించి అక్కడ ఉండడం అనే κατέχω భావాన్ని ‘ఆక్రమించడం’ సముచితంగా వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ప్రత్యక్ష సంభాషణలో సందర్భానుకూల ఏకవచన రూపమైన ‘ఇవ్వు’ను, కథనంలో ‘నువ్వు’ రూపాన్ని ఉపయోగించాం. పాదటిప్పణి సూచిక ప్రధాన వాక్యం చివర ఉంచబడింది.
