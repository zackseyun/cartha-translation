source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν τὸν δοῦλον αὐτοῦ τῇ ὥρᾳ τοῦ δείπνου εἰπεῖν τοῖς κεκλημένοις· Ἔρχεσθε, ὅτι ἤδη ἕτοιμά ⸀ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/017.yaml
  text: And at the hour of the dinner he sent his servant to say to those who had been invited[a], ‘Come, because it is already ready.’
translation:
  language: te
  text: విందు సమయానికి అతడు ఆహ్వానించబడిన వారికి, ‘రండి, ఎందుకంటే అంతా ఇప్పటికే సిద్ధంగా ఉంది[a]’ అని చెప్పడానికి తన సేవకుణ్ణి పంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత నుడికారంగా, “ఇప్పటికే అన్నీ సిద్ధంగా ఉన్నాయి.” గ్రీకులో కర్త స్పష్టంగా చెప్పబడలేదు; నపుంసక బహువచన రూపం సమష్టి భావంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: పంపాడు
  rationale: అయోరిస్ట్ క్రియను సహజమైన ఆధునిక తెలుగులో సూటిగా తెలియజేస్తుంది.
- source_word: δοῦλον
  choice: సేవకుణ్ణి
  rationale: ఈ ఉపమానంలోని గృహ సందర్భంలో అతని కథనపరమైన పాత్ర యజమాని సందేశాన్ని అందించే సేవకునిది; ‘దాసుణ్ణి’ సాధ్యమే అయినా ఇక్కడ అవసరానికి మించిన సామాజిక నుడికారాన్ని ముందుకు తెస్తుంది.
- source_word: τῇ ὥρᾳ τοῦ δείπνου
  choice: విందు సమయం వచ్చినప్పుడు
  rationale: నిర్దిష్టంగా భోజనం సిద్ధమై అతిథులను పిలిచే సమయాన్ని సహజంగా తెలియజేస్తుంది; సందర్భంలోని పెద్ద విందుకు ‘విందు’ సరిపోతుంది.
- source_word: εἰπεῖν
  choice: చెప్పడానికి
  rationale: ‘పంపాడు’ అనే క్రియ తరువాత ఉద్దేశాన్ని తెలిపే గ్రీకు క్రియారూపాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: τοῖς κεκλημένοις
  choice: ఆహ్వానించబడిన వారితో
  rationale: పరిపూర్ణ కర్మణి కృదంతం వారు ఇంతకుముందే ఆహ్వానించబడ్డారని సూచిస్తుంది; ఈ రూపం ఆ ముందస్తు ఆహ్వానాన్ని నిలుపుతుంది.
- source_word: Ἔρχεσθε
  choice: రండి
  rationale: ఆహ్వానపూర్వక ఆజ్ఞను గౌరవసూచకమైన, సహజమైన తెలుగు రూపంలో అందిస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: రమ్మనే పిలుపుకు కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: ἤδη
  choice: ఇప్పుడు
  rationale: సిద్ధత ఈ సమయానికి పూర్తయిందనే భావాన్ని సందర్భానుగుణంగా తెలియజేస్తుంది; తెలుగులో ‘అంతా సిద్ధంగా ఉంది’తో ‘ఇప్పటికే’ కంటే ‘ఇప్పుడు’ సహజంగా ఉంది.
- source_word: ἕτοιμά ἐστιν
  choice: అంతా ఇప్పుడు సిద్ధంగా ఉంది
  rationale: నపుంసక బహువచన విశేషణం, ఏకవచన క్రియతో ఉన్న గ్రీకు సమష్టి ప్రయోగాన్ని సహజ తెలుగులో ‘అంతా’ అని అందిస్తుంది; అంతర్లీన విషయాన్ని ప్రత్యేకంగా ‘భోజనం’ అని నిర్ణయించదు.
theological_decisions:
- issue: ἕτοιμά ἐστιν లో అంతర్లీన కర్త
  choice: అంతా ఇప్పుడు సిద్ధంగా ఉంది
  alternative: భోజనం ఇప్పుడు సిద్ధంగా ఉంది
  rationale: గ్రీకు పాఠం కర్తను స్పష్టంగా చెప్పకుండా సమష్టి నపుంసక బహువచన ప్రయోగాన్ని వాడుతుంది. ‘అంతా’ ఆ విస్తృతతను కాపాడుతుంది; ‘భోజనం’ అని అనువదించడం సందర్భసమ్మతమే అయినా మూలంలో లేని నిర్దిష్టతను చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘విందు సమయం వచ్చినప్పుడు’ సందర్భాన్ని స్పష్టంగా ఉంచుతుంది. ప్రత్యక్ష సంభాషణలో ‘రండి’ ఆహ్వానానికి తగిన మర్యాదను కలిగి ఉంది; మూలంలోని అంతర్లీన కర్తను ‘అంతా’ ద్వారా అతిగా నిర్దిష్టం చేయకుండా నిలిపాం.
