    issue: The conjunction ‘కానీ’ is more adversative than the Greek conjunction καί.
    rationale: καί coordinates the clauses (‘and’). Telugu need not reproduce it with a literal conjunction here, but adding ‘కానీ’ slightly sharpens the contrast beyond the source.
