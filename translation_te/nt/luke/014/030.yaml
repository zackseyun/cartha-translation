source:
  edition: SBLGNT
  text: λέγοντες ὅτι Οὗτος ὁ ἄνθρωπος ἤρξατο οἰκοδομεῖν καὶ οὐκ ἴσχυσεν ἐκτελέσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/030.yaml
  text: saying[a], ‘This man began to build and was not able to finish.’
translation:
  language: te
  text: “ఈ మనిషి కట్టడం మొదలుపెట్టాడు, పూర్తి చేయలేకపోయాడు[a]” అని అంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పూర్తి చేయడానికి అతనికి తగిన బలం లేకపోయింది.”
    reason: ἴσχυσεν ఇక్కడ సామర్థ్యం అనే ప్రధాన భావంతో పాటు తగిన బలం లేకపోవడం అనే సూక్ష్మ భావాన్నీ సూచించగలదు.
lexical_decisions:
- source_word: λέγοντες
  choice: అని అంటారు
  rationale: ఇది ముందటి వచనంలోని అపహాస్యం చేసే వ్యక్తులకు సంబంధించిన వర్తమాన కృదంతం. తెలుగులో స్వతంత్ర వాక్యంగా సహజంగా ఉండేందుకు ‘అని అంటారు’ అని ఇచ్చాం; ఇది వారు పలికే మాటను పరిచయం చేస్తుంది.
- source_word: ὅτι
  choice: ప్రత్యక్ష ఉక్తిని సూచించే ఉద్ధరణ చిహ్నాలు
  rationale: ఇక్కడ ὅτι పలికిన మాటలోని విషయాన్ని పరిచయం చేస్తుంది. ఆధునిక తెలుగులో ప్రత్యక్ష ఉక్తిని ఉద్ధరణ చిహ్నాలతో చూపడం సహజం.
- source_word: Οὗτος ὁ ἄνθρωπος
  choice: ఈ మనిషి
  rationale: సూచక సర్వనామం మరియు పుంలింగ ఏకవచన నామవాచకంలోని బహిరంగంగా వేలెత్తిచూపే ధోరణిని అదనపు అవహేళన జోడించకుండా నిలుపుతుంది.
- source_word: ἤρξατο
  choice: మొదలుపెట్టాడు
  rationale: అనంత క్రియతో కలిసిన ἄρχομαι యొక్క సాధారణ అర్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οἰκοδομεῖν
  choice: కట్టడం
  rationale: నిర్మాణ సందర్భంలో ఉన్న సాధారణ అర్థాన్ని నిలుపుతుంది; గ్రీకులో స్పష్టంగా లేని కర్మను జోడించదు.
- source_word: οὐκ ἴσχυσεν
  choice: చేయలేకపోయాడు
  rationale: ఈ సందర్భంలో ἰσχύω ప్రధానంగా సామర్థ్యాన్ని సూచిస్తుంది. ‘చేయలేకపోయాడు’ సహజంగా ఆ భావాన్ని ఇస్తుంది; శారీరక బలానికే అర్థాన్ని పరిమితం చేయదు.
- source_word: ἐκτελέσαι
  choice: పూర్తి చేయ
  rationale: మొదలుపెట్టిన నిర్మాణాన్ని ముగింపుకు తీసుకురావడం అనే భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన మాటతీరు వాడబడింది. ‘కానీ’ గ్రీకులోని καί వరుస అనుసంధానాన్ని సందర్భానుసారమైన వ్యతిరేక భావంతో సహజంగా వ్యక్తం చేస్తుంది. ప్రత్యక్ష ఉక్తిలోని బహిరంగ అపహాస్య ధోరణి నిలుపబడింది; మూలంలో లేని మరింత అవమానకరమైన పదజాలం జోడించలేదు.
