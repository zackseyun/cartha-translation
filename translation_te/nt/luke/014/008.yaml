review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the invitation, wedding-feast setting, warning, comparative social honor, and the possibility that another guest has already been invited. However, “భోజనానికి ఆనుకోవద్దు” is not idiomatic enough to convey reclining at table, and “గౌరవస్థానం” can understate πρωτοκλισία, the foremost/most honored place.
  naturalness: The first sentence is understandable, but “గౌరవస్థానంలో భోజనానికి ఆనుకోవద్దు” sounds syntactically strained in modern Telugu. “అత్యంత గౌరవస్థానంలో ఆనుకొని భోజనం చేయవద్దు” is clearer and natural while retaining the ancient meal posture. Linking the warning with “లేకపోతే” better reflects μήποτε than an unconnected new sentence.
  terminology: “పెళ్లి విందు,” “ఆహ్వానించు,” and “నీకంటే ఎక్కువ గౌరవనీయుడైన” are appropriate modern-standard Telugu renderings. “అత్యంత గౌరవస్థానం” more fully represents the social-ranking force of πρωτοκλισία.
  issues:
  - severity: medium
    issue: The rendering of κατακλιθῇς is awkward.
    rationale: “భోజనానికి ఆనుకోవద్దు” may sound like merely leaning while eating, rather than taking a reclining dining position. “ఆనుకొని భోజనం చేయవద్దు” communicates the action more naturally.
  - severity: low
    issue: The honor-place expression is somewhat nonspecific.
    rationale: πρωτοκλισία denotes the foremost or most honored dining place. Adding “అత్యంత” prevents the phrase from being heard as any generally honorable seat.
  - severity: low
    issue: The warning relation introduced by μήποτε is weak across the sentence break.
    rationale: “లేకపోతే” naturally expresses the cautionary ‘lest/otherwise’ relation without overstating the Greek subjunctive.
  revised_text: ఎవరైనా నిన్ను పెళ్లి విందుకు ఆహ్వానించినప్పుడు, అత్యంత గౌరవస్థానంలో ఆనుకొని భోజనం చేయవద్దు[a]; లేకపోతే, నీకంటే ఎక్కువ గౌరవనీయుడైన వ్యక్తిని అతడు ఆహ్వానించి ఉండవచ్చు.
  revised_footnotes:
  - marker: a
    text: ప్రాచీన కాలంలోని లాంఛనప్రాయమైన విందుల్లో సాధారణంగా నిటారుగా కూర్చోకుండా, బల్ల దగ్గర ఆనుకొని భోజనం చేసేవారు.
    reason: cultural_note
