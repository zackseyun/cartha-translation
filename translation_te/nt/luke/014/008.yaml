id: LUK.14.8
reference: Luke 14:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὅταν κληθῇς ὑπό τινος εἰς γάμους, μὴ κατακλιθῇς εἰς τὴν πρωτοκλισίαν, μήποτε ἐντιμότερός σου ᾖ κεκλημένος ὑπ’ αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/008.yaml
  text: When you are invited by someone to a wedding feast, do not recline in the place of honor, lest someone more honored than you has been invited by him.
translation:
  language: te
  text: ఎవరైనా నిన్ను పెళ్లి విందుకు ఆహ్వానించినప్పుడు, అత్యంత గౌరవస్థానంలో ఆనుకొని భోజనం చేయవద్దు[a]; లేకపోతే, నీకంటే ఎక్కువ గౌరవనీయుడైన వ్యక్తిని అతడు ఆహ్వానించి ఉండవచ్చు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ప్రాచీన కాలంలోని లాంఛనప్రాయమైన విందుల్లో సాధారణంగా నిటారుగా కూర్చోకుండా, బల్ల దగ్గర ఆనుకొని భోజనం చేసేవారు.
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν κληθῇς ὑπό τινος
  choice: ఎవరైనా నిన్ను ... ఆహ్వానించినప్పుడు
  rationale: విందు సందర్భంలో καλέω అంటే ఆహ్వానించడం. τινος సూచించే అనిర్దిష్ట వ్యక్తిని ‘ఎవరైనా’ సహజంగా వ్యక్తం చేస్తుంది; ὅταν సాధారణంగా సంభవించే పరిస్థితిని సూచిస్తుంది.
- source_word: εἰς γάμους
  choice: పెళ్లి విందుకు
  rationale: బహువచన γάμοι పెళ్లి వేడుకలను, ముఖ్యంగా సందర్భానుసారం విందును సూచించగలదు. తరువాతి భోజనస్థాన ప్రస్తావన వల్ల ‘పెళ్లి విందు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: μὴ κατακλιθῇς
  choice: భోజనానికి ఆనుకోవద్దు
  rationale: κατακλίνω ప్రాచీన విందులో బల్ల దగ్గర ఆనుకొని భోజనం చేయడాన్ని సూచిస్తుంది. కేవలం ‘కూర్చోవద్దు’ అనడం మూల సంస్కృతిక దృశ్యాన్ని కోల్పోతుంది; ‘భోజనానికి ఆనుకోవద్దు’ అర్థాన్ని పాఠకునికి తెలియజేస్తుంది.
- source_word: εἰς τὴν πρωτοκλισίαν
  choice: గౌరవస్థానంలో
  rationale: πρωτοκλισία విందులో అత్యంత గౌరవప్రదమైన స్థానాన్ని సూచిస్తుంది. ‘గౌరవస్థానం’ ఆధునిక తెలుగులో సహజమైనది; ‘మొదటి స్థానం’ అనే అక్షరార్థ అపార్థాన్ని నివారిస్తుంది.
- source_word: μήποτε
  choice: ఒకవేళ ... ఉండవచ్చు
  rationale: ఈ పదం ఆజ్ఞకు కారణమైన సంభావ్య ప్రమాదాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘ఒకవేళ ... ఉండవచ్చు’ హెచ్చరికతో కూడిన సంభావ్యతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐντιμότερός σου
  choice: నీకంటే ఎక్కువ గౌరవనీయుడైన వ్యక్తి
  rationale: సమానతర ἐντιμότερος సామాజిక గౌరవం లేదా హోదాలో అధికుడిని సూచిస్తుంది. ‘ఎక్కువ గౌరవనీయుడు’ మూలంలోని తులనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: ᾖ κεκλημένος ὑπ’ αὐτοῦ
  choice: అతడు ఆహ్వానించి ఉండవచ్చు
  rationale: κεκλημένος పరిపూర్ణ కృదంతం ముందే జరిగిన ఆహ్వానాన్ని సూచిస్తుంది; ᾖ మరియు μήποτε కలిపి సంభావ్య పరిస్థితిని చూపుతాయి. కర్తృవాచ్య తెలుగు నిర్మాణం సహజంగా ఉండి, αὐτοῦను ‘అతడు’గా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ప్రాచీన విందు ఆచారాన్ని మూలపాఠానికి నిబద్ధంగా ప్రధాన వాక్యంలో ఉంచి, అపరిచితమైన ఆచారాన్ని పాదటిప్పణిలో వివరించాం. గ్రీకు వాక్యంలోని సంభావ్యతను ‘ఒకవేళ ... ఉండవచ్చు’తో నిలిపాం.
