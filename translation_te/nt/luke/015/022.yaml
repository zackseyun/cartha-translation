id: LUK.15.22
reference: Luke 15:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ πατὴρ πρὸς τοὺς δούλους αὐτοῦ· ⸀Ταχὺ ⸀ἐξενέγκατε στολὴν τὴν πρώτην καὶ ἐνδύσατε αὐτόν, καὶ δότε δακτύλιον εἰς τὴν χεῖρα αὐτοῦ καὶ ὑποδήματα εἰς τοὺς πόδας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/022.yaml
  text: But the father said to his servants[a], ‘Quickly, bring out the best robe and put it on him[c][b], and put a ring on his hand and sandals on his feet.’
translation:
  language: te
  text: అయితే తండ్రి తన బానిసలతో[a], ‘త్వరగా, ఉత్తమమైన వస్త్రాన్ని[b] బయటికి తెచ్చి ఇతనికి తొడిగించండి. ఇతని చేతికి ఉంగరం[c], కాళ్లకు చెప్పులు వేయండి’ అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బానిసలు’ అని అనువదించిన గ్రీకు పదం (δούλους) ఇంటికి చెందిన బానిసలను లేదా బంధిత సేవకులను సూచిస్తుంది; ‘సేవకులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: పదశః ‘మొదటి వస్త్రం’; సందర్భానుసారం ‘అత్యుత్తమమైన వస్త్రం’ లేదా ‘అన్నిటికంటే ముఖ్యమైన వస్త్రం’ అని భావం కావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకు మూలంలో కేవలం ‘ఉంగరం’ అని ఉంది; ఇది అతని స్థానం తిరిగి స్థాపించబడిందనడానికి సంకేతమైన ముద్ర ఉంగరమని కొందరు అర్థం చేసుకుంటారు.
    reason: interpretive_clarification
lexical_decisions:
- source_word: δούλους
  choice: దాసులు
  rationale: ఈ గ్రీకు పదం ఇంటికి చెందిన బానిసలుగా లేదా బంధిత సేవకులుగా ఉన్నవారిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దాసులు’ అనే పదం వారి అధీన సామాజిక స్థితిని నిలుపుతూ, కథనానికి తగిన గౌరవప్రదమైన శైలిని ఇస్తుంది.
- source_word: Ταχὺ
  choice: త్వరగా
  rationale: ఇది వెంటనే చర్య తీసుకోవాలనే తండ్రి ఆతురతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐξενέγκατε
  choice: బయటికి తెచ్చి
  rationale: లోపల లేదా నిల్వచేసిన చోటు నుంచి వస్త్రాన్ని బయటికి తీసుకురావాలనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: στολὴν τὴν πρώτην
  choice: శ్రేష్ఠమైన వస్త్రం
  rationale: పదశః ‘మొదటి వస్త్రం’ అయినప్పటికీ, సందర్భంలో πρῶτος క్రమంలో మొదటిదానికన్నా అత్యున్నతమైన లేదా ఉత్తమమైన వస్త్రాన్ని సూచించే అవకాశం ఎక్కువ. ‘శ్రేష్ఠమైన’ అనేది నాణ్యతతోపాటు ప్రాధాన్య భావాన్నీ నిలుపుతుంది.
- source_word: ἐνδύσατε αὐτόν
  choice: ఇతనికి తొడిగించండి
  rationale: ఇప్పుడే ప్రస్తావించిన వస్త్రాన్ని అతనికి ధరింపజేయడాన్ని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: δακτύλιον
  choice: ఉంగరం
  rationale: మూలపదం సాధారణంగా ఉంగరాన్నే సూచిస్తుంది; అది ముద్ర ఉంగరమని మూలపాఠం నిర్దిష్టంగా చెప్పదు.
- source_word: εἰς τὴν χεῖρα αὐτοῦ
  choice: ఇతని చేతికి
  rationale: అలంకార వస్తువును ధరింపజేసే సందర్భంలో εἰς భావాన్ని తెలుగులో సహజంగా ‘చేతికి’ అని వ్యక్తం చేయవచ్చు.
- source_word: ὑποδήματα
  choice: చెప్పులు
  rationale: పురాతన మధ్యధరా సందర్భంలోని పాదరక్షలను తెలుగులో సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే ‘చెప్పులు’ అనే పదం సూచిస్తుంది.
- source_word: εἰς τοὺς πόδας
  choice: కాళ్లకు
  rationale: పాదరక్షలు వేయడాన్ని తెలుగులో సహజంగా ‘కాళ్లకు’ అని చెబుతారు.
- source_word: δὲ
  choice: అయితే
  rationale: కొడుకు మాటల నుంచి తండ్రి తీసుకున్న తక్షణ చర్యకు జరిగే స్వల్ప వ్యత్యాసాన్ని, కథన మలుపును తెలియజేస్తుంది.
theological_decisions:
- issue: δούλους అనే పదాన్ని సామాజిక అధీన స్థితిని స్పష్టంగా చూపేలా అనువదించాలా, సాధారణ సేవను సూచించేలా అనువదించాలా
  choice: దాసులు
  alternative: సేవకులు; బానిసలు
  rationale: ‘సేవకులు’ బంధిత స్థితిని మరుగుపరచవచ్చు; ‘బానిసలు’ దానిని అత్యంత ప్రత్యక్షంగా చెబుతుంది. ‘దాసులు’ మూలంలోని అధీన గృహస్థితిని నిలుపుతూ తెలుగు బైబిలు కథన శైలిలో సహజంగా ఉంటుంది. ఇది దాస్యాన్ని సమర్థించే ధార్మిక వాదన కాదు; కథలోని సామాజిక వాస్తవాన్ని మాత్రమే ప్రతిబింబిస్తుంది.
- issue: στολὴν τὴν πρώτην లో πρῶτην ను పదశః ‘మొదటి’గా అనువదించాలా, సందర్భానుసారం ‘శ్రేష్ఠమైన’గా అనువదించాలా
  choice: శ్రేష్ఠమైన వస్త్రం
  alternative: మొదటి వస్త్రం; అత్యుత్తమమైన వస్త్రం
  rationale: ఇక్కడ క్రమంలో మొదటి వస్త్రం కన్నా ప్రాముఖ్యత లేదా నాణ్యతలో ముందున్న వస్త్రమనే భావం సందర్భానికి అనుకూలం. అయితే మూలంలోని ‘మొదటి/ముఖ్యమైన’ భావ విస్తృతిని పాదసూచికలో నిలుపుతున్నాం.
- issue: δακτύλιον ను ‘ముద్ర ఉంగరం’గా విస్తరించాలా
  choice: ఉంగరం
  alternative: ముద్ర ఉంగరం
  rationale: ఉంగరం తిరిగి లభించిన కుమారత్వం లేదా అధికారానికి సంకేతమని అర్థం చేసుకోవచ్చు; అయినా గ్రీకు పదం దానిని ముద్ర ఉంగరమని నిర్దిష్టంగా చెప్పదు. అందువల్ల వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. తండ్రి ఆజ్ఞలలోని అత్యవసరతను నిలుపుతూ బహువచన గౌరవ/ఆజ్ఞారూపాలు ఉపయోగించబడ్డాయి. ‘ఇతనికి/ఇతని’ అనేవి సమీపంలో ఉన్న కుమారుణ్ని దాసులకు చూపిస్తూ పలికిన మాటలకు సహజంగా ఉన్నాయి. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
