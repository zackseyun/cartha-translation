source:
  edition: SBLGNT
  text: δαπανήσαντος δὲ αὐτοῦ πάντα ἐγένετο λιμὸς ⸀ἰσχυρὰ κατὰ τὴν χώραν ἐκείνην, καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/014.yaml
  text: But after he had spent everything[a], a severe famine came upon that country[b], and he began to be in need.
translation:
  language: te
  text: అయితే అతడు అన్నిటినీ ఖర్చు చేసిన తర్వాత, ఆ ప్రాంతమంతటా[a] తీవ్రమైన కరవు వచ్చింది; అతడు కూడా లేమిని అనుభవించడం మొదలుపెట్టాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ దేశమంతటా’ లేదా ‘ఆ ప్రాంతంలో.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతనికి కొరత కలగడం మొదలైంది’ లేదా ‘అతడు అవసరంలో పడసాగాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δαπανήσαντος ... αὐτοῦ πάντα
  choice: అతడు అన్నిటినీ ఖర్చు చేసిన తర్వాత
  rationale: జెనిటివ్ అబ్సల్యూట్‌లోని ఏఓరిస్ట్ కృదంతాన్ని సహజమైన కాలార్థక ఉపవాక్యంగా అనువదించాం. δαπανάωకు ‘ఖర్చు చేయడం’ నేరమైన అర్థం; ఈ వాక్యంలోని క్రియ స్వయంగా సూచించని ‘దుర్వ్యయం చేశాడు’ అనే తీర్పును చేర్చలేదు.
- source_word: δέ
  choice: అయితే
  rationale: కథనంలో సమృద్ధి నుంచి సంక్షోభానికి వచ్చే మలుపు/వ్యతిరేకతను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ἐγένετο
  choice: వచ్చింది
  rationale: కరవు సంభవించడాన్ని తెలిపే గ్రీకు ప్రయోగానికి తెలుగులో ‘కరవు వచ్చింది’ సహజమైన సమానార్థక ప్రయోగం.
- source_word: λιμὸς ἰσχυρά
  choice: తీవ్రమైన కరవు
  rationale: ἰσχυρά ఇక్కడ కరవు తీవ్రతను పెంచి చెబుతుంది; ‘తీవ్రమైన’ అనేది సహజంగా, స్పష్టంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: κατὰ τὴν χώραν ἐκείνην
  choice: ఆ ప్రాంతమంతటా
  rationale: κατά + accusative ఒక ప్రదేశమంతటా వ్యాపించిన పరిధిని సూచించగలదు. χώραకు సందర్భానుసారంగా ‘దేశం’ లేదా ‘ప్రాంతం’ సాధ్యమైనా, ఇక్కడ ‘ప్రాంతం’ సహజంగా ఉంది; ‘అంతటా’ విస్తరణ భావాన్ని నిలుపుతుంది.
- source_word: καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι
  choice: అతనికీ కొరత మొదలైంది
  rationale: ἤρξατο ఆరంభ భావాన్ని, ὑστερεῖσθαι అవసరమైనవి లేకపోవడం/లేమిని సూచిస్తాయి. ‘అతనికీ’ అనేది καὶ αὐτόςలోని అనుసంధాన లేదా స్వల్ప ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
