revisions:
- from: వారిలో చిన్నవాడు తన తండ్రితో, “తండ్రీ, ఆస్తిలో నాకు రావలసిన వాటా నాకు ఇవ్వండి” అన్నాడు. అప్పుడు ఆ తండ్రి తన జీవనాధారమైన ఆస్తిని[a] వారిద్దరికీ పంచి ఇచ్చాడు.
  to: వారిలో వయసులో చిన్నవాడు తన తండ్రితో, “తండ్రీ, ఆస్తిలో నాకు రావలసిన వాటా ఇవ్వండి” అన్నాడు. అప్పుడు తండ్రి తన జీవనాధారాలను[a] వారిద్దరికీ పంచాడు.
  rationale: The revision retains the source’s implicit reference to the younger person rather than adding ‘son,’ makes the comparative age sense explicit, removes an unnecessary Telugu repetition, and uses a more idiomatic collective rendering for βίον. The footnote remains anchored to βίον and explains its contextual reference to the father’s property or resources.
