id: LUK.15.12
reference: Luke 15:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ νεώτερος αὐτῶν τῷ πατρί· Πάτερ, δός μοι τὸ ἐπιβάλλον μέρος τῆς οὐσίας· ⸂ὁ δὲ⸃ διεῖλεν αὐτοῖς τὸν βίον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/012.yaml
  text: And the younger of them said to his father[a], ‘Father[b], give me the share of the estate that falls to me.’ So he divided his livelihood between them.
translation:
  language: te
  text: వారిలో వయసులో చిన్నవాడు తన తండ్రితో, “తండ్రీ, ఆస్తిలో నాకు రావలసిన వాటా ఇవ్వండి” అన్నాడు. అప్పుడు తండ్రి తన జీవనాధారాలను[a] వారిద్దరికీ పంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘తన జీవనం/జీవనాధారాలు’ (βίον); ఇక్కడ తండ్రి జీవించడానికి ఆధారమైన ఆస్తి లేదా వనరులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεώτερος
  choice: చిన్నవాడు
  rationale: ఇది నామవాచకంగా వాడిన తులనాత్మక విశేషణం—‘చిన్నవాడు/వయసులో చిన్నవాడు’. సందర్భం వల్ల కుమారుడు అని స్పష్టమైనా, మూలంలో లేని ‘కుమారుడు’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: δός μοι
  choice: నాకు ఇవ్వండి
  rationale: δίδωμι క్రియ యొక్క ఆజ్ఞార్థక రూపం. తండ్రిని సంబోధించే ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండేందుకు గౌరవ బహువచనం వాడబడింది.
- source_word: τὸ ἐπιβάλλον μέρος
  choice: నాకు రావలసిన వాటా
  rationale: ἐπιβάλλον ఇక్కడ ఒకరికి చెందే లేదా దక్కవలసిన భాగాన్ని సూచిస్తుంది. ‘రావలసిన వాటా’ హక్కుగా దక్కే భాగమనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: οὐσία
  choice: ఆస్తి
  rationale: ఈ కుటుంబ-వారసత్వ సందర్భంలో οὐσία సంపదను లేదా ఆస్తులను సూచిస్తుంది. ‘ఆస్తి’ ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన పదం.
- source_word: διεῖλεν
  choice: పంచి ఇచ్చాడు
  rationale: διαιρέω అంటే విభజించడం లేదా పంచడం. ‘పంచి ఇచ్చాడు’ గ్రహీతలకు భాగాలు కేటాయించిన కార్యాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: αὐτοῖς
  choice: వారిద్దరికీ
  rationale: మూలంలో దత్తివాచక బహువచనం ‘వారికి’ అని ఉంది. సందర్భంలో ఇద్దరు కుమారులు ఉన్నందున ‘వారిద్దరికీ’ అనేది సూచనను స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: βίον
  choice: జీవనాధారమైన ఆస్తిని
  rationale: βίος ఇక్కడ జీవనోపాధి, జీవనాధారాలు లేదా ఆస్తి అనే అర్థ విస్తృతిని కలిగి ఉంది. ‘జీవనాధారమైన ఆస్తి’ దానిని కేవలం ధనంగా పరిమితం చేయకుండా సందర్భార్థాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన కథన శైలి. కుమారుడు తండ్రితో మాట్లాడేటప్పుడు గౌరవ బహువచనం, కథకుడు తండ్రిని సూచించేటప్పుడు ఏకవచనం వాడబడ్డాయి.
