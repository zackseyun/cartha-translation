revisions:
- from: పరిసయ్యులు, శాస్త్రులు—వీరిద్దరూ సణుగుతూ, “ఇతడు పాపులను ఆదరిస్తున్నాడు, వారితో కలిసి భోజనం చేస్తున్నాడు” అని అన్నారు.
  to: పరిసయ్యులూ శాస్త్రులూ ఇద్దరూ, “ఇతడు పాపులను స్వీకరించి వారితో కలిసి తింటున్నాడు” అంటూ సణుగుతూ ఉండేవారు.
  rationale: The revision preserves the correlative ‘both ... and,’ the dismissive force of Οὗτος through ‘ఇతడు,’ and the accusation’s social force. It also represents the ongoing imperfect grumbling without adding interpretation. No footnote is needed because the Telugu wording is clear and no material textual ambiguity is present.
