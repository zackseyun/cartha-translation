id: LUK.15.2
reference: Luke 15:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ διεγόγγυζον οἵ ⸀τε Φαρισαῖοι καὶ οἱ γραμματεῖς λέγοντες ὅτι Οὗτος ἁμαρτωλοὺς προσδέχεται καὶ συνεσθίει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/002.yaml
  text: And both the Pharisees and the scribes were grumbling[a], saying, “This man welcomes sinners and eats with them.”
translation:
  language: te
  text: పరిసయ్యులూ శాస్త్రులూ ఇద్దరూ, “ఇతడు పాపులను స్వీకరించి వారితో కలిసి తింటున్నాడు” అంటూ సణుగుతూ ఉండేవారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεγόγγυζον
  choice: సణుగుతూ ... అన్నారు
  rationale: అసంతృప్తితో గొణుక్కుంటూ ఫిర్యాదు చేయడమనే ప్రతికూల భావాన్ని ‘సణుగుతూ’ సహజంగా తెలియజేస్తుంది. అపూర్ణ భూతకాలంలోని కొనసాగుతున్న చర్యను ఈ క్రియారూపం సందర్భంలో వ్యక్తం చేస్తుంది.
- source_word: οἵ τε Φαρισαῖοι καὶ οἱ γραμματεῖς
  choice: పరిసయ్యులు, శాస్త్రులు—వీరిద్దరూ
  rationale: τε ... καί యొక్క ఉభయ సమూహాల భావాన్ని ‘వీరిద్దరూ’ స్పష్టంగా నిలుపుతుంది; గ్రμματεῖς‌కు సువార్తల సందర్భంలో స్థిరమైన తెలుగు పదం ‘శాస్త్రులు’.
- source_word: λέγοντες
  choice: అని అన్నారు
  rationale: ప్రధాన క్రియతో సమకాలీనమైన మాటల చర్యను సహజ తెలుగు వాక్య నిర్మాణంలో తెలిపింది.
- source_word: Οὗτος
  choice: ఇతడు
  rationale: సూచనాత్మక సర్వనామంలోని కొంత దూరం పెట్టే, తృణీకార సూచన ఉండగల ధ్వనిని ‘ఇతడు’ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἁμαρτωλοὺς
  choice: పాపులను
  rationale: నామవాచకంగా వాడిన విశేషణానికి సహజమైన సమానార్థకం; ఆరోపణలోని సామాజిక-మత వర్గీకరణను అదనపు వివరణ లేకుండా నిలుపుతుంది.
- source_word: προσδέχεται
  choice: ఆదరిస్తున్నాడు
  rationale: వ్యక్తులను అనుకూలంగా స్వీకరించి దగ్గరకు చేర్చుకోవడమనే భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; కేవలం ‘స్వీకరిస్తున్నాడు’ కంటే ఆతిథ్య ధ్వనిని మెరుగుగా అందిస్తుంది.
- source_word: συνεσθίει αὐτοῖς
  choice: వారితో కలిసి భోజనం చేస్తున్నాడు
  rationale: కలిసి తినడం మరియు అందులోని భోజన సహవాసాన్ని స్పష్టంగా, అతివ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: పాపులతో యేసు సహవాసం యొక్క సామాజిక, వేదాంతపరమైన తీవ్రత
  choice: పాపులను ఆదరించడం, వారితో కలిసి భోజనం చేయడం అనే ఆరోపణను నేరుగా నిలుపడం
  alternative: ఇతడు పాపులను స్వీకరించి వారితో కలిసి తింటున్నాడు
  rationale: మతపరంగా, సామాజికంగా ‘పాపులు’గా గుర్తించబడినవారితో యేసు చూపిన ఆతిథ్యం మరియు భోజన సహవాసమే ఫిర్యాదుకు కారణం. వాక్యం సూచించే అభ్యంతరాన్ని మృదువుచేయకుండా, అదనపు సిద్ధాంత వ్యాఖ్యానమూ జోడించకుండా అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘సణుగుతూ’ కొనసాగుతున్న ప్రతికూల ఫిర్యాదును, ‘ఆదరిస్తున్నాడు’ అనుకూలంగా చేర్చుకునే భావాన్ని వ్యక్తం చేస్తాయి. మూలంలో ప్రత్యక్షంగా లేని వివరణను చేర్చలేదు.
