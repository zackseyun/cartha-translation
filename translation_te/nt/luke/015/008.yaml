id: LUK.15.8
reference: Luke 15:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἢ τίς γυνὴ δραχμὰς ἔχουσα δέκα, ἐὰν ἀπολέσῃ δραχμὴν μίαν, οὐχὶ ἅπτει λύχνον καὶ σαροῖ τὴν οἰκίαν καὶ ζητεῖ ἐπιμελῶς ἕως ⸀οὗ εὕρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/008.yaml
  text: Or what woman[a], having ten drachmas, if she loses one drachma[b], does not light a lamp and sweep the house and search carefully until she finds it?
translation:
  language: te
  text: “లేక, పది ద్రాక్మాలు[a] ఉన్న ఏ స్త్రీ అయినా, ఒక ద్రాక్మాను పోగొట్టుకుంటే, దీపం వెలిగించి, ఇల్లు ఊడ్చి, అది దొరికే వరకు జాగ్రత్తగా[b] వెదకదా?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ద్రాక్మా అనేది ఒక గ్రీకు వెండి నాణెం.
    reason: cultural_note
  - marker: b
    text: లేదా “శ్రద్ధగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: లేక
  rationale: ముందున్న ఉపమానానికి సమాంతరంగా మరొక ఉదాహరణను పరిచయం చేసే అనుసంధాన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τίς γυνὴ
  choice: ఏ స్త్రీ అయినా
  rationale: సానుకూల సమాధానాన్ని ఆశించే అలంకారిక ప్రశ్నను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; మూలంలో లేని ‘మీలో’ అనే మాటను చేర్చదు.
- source_word: δραχμὰς / δραχμὴν
  choice: ద్రాక్మాలు / ద్రాక్మాను
  rationale: సాధారణ ‘నాణేలు’ అని సరళీకరించకుండా, ప్రాచీన నాణెం పేరును చారిత్రక నిర్దిష్టతతో నిలుపుతుంది.
- source_word: ἐὰν ἀπολέσῃ
  choice: పోగొట్టుకుంటే
  rationale: సాధారణ షరతును సహజమైన తెలుగు రూపంలో తెలియజేస్తుంది.
- source_word: οὐχὶ
  choice: వెదకదా?
  rationale: సానుకూల సమాధానాన్ని ఆశించే గ్రీకు అలంకారిక ప్రశ్న బలాన్ని తెలుగు ప్రశ్నార్థక ప్రత్యయంతో నిలుపుతుంది.
- source_word: ἅπτει λύχνον
  choice: దీపం వెలిగించి
  rationale: దీపాన్ని మండించడం అనే భావాన్ని స్పష్టమైన, ప్రస్తుత వాడుక తెలుగులో అందిస్తుంది.
- source_word: σαροῖ τὴν οἰκίαν
  choice: ఇల్లు ఊడ్చి
  rationale: ఇంటి అంతర్గత ప్రదేశాన్ని వెదకడానికి ఊడ్చే దృశ్యాన్ని సరళంగా, స్పష్టంగా అందిస్తుంది.
- source_word: ζητεῖ ἐπιμελῶς
  choice: జాగ్రత్తగా వెదకదా
  rationale: శ్రద్ధతో, పట్టుదలగా వెదకడం అనే భావాన్ని అతిశయింపకుండా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἕως οὗ εὕρῃ
  choice: అది దొరికే వరకు
  rationale: వెదకడం ముగిసే హద్దును స్పష్టంగా తెలుపుతుంది; సందర్భం ద్వారా అర్థమయ్యే నాణెాన్ని ‘అది’గా సూచిస్తుంది.
