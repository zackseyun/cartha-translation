source:
  edition: SBLGNT
  text: ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός σου· ποίησόν με ὡς ἕνα τῶν μισθίων σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/019.yaml
  text: I am no longer worthy to be called your son[a]. Make me like one of your hired workers.
translation:
  language: te
  text: ఇకపై నీ కుమారుడని పిలవబడటానికి నేను యోగ్యుణ్ణి కాను. నీ వేతనానికి పనిచేసే వారిలో ఒకనిగా నన్ను చేయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ కూలివారిలో ఒకనిగా.” గ్రీకు పదం ఇంటి బానిసలను కాకుండా వేతనం లేదా కూలి తీసుకుని పనిచేసే వారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: ఇక ... కాను
  rationale: మునుపటి స్థితి ఇప్పుడు లేదనే కాలసంబంధ నిరాకరణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἄξιος
  choice: యోగ్యుణ్ణి
  rationale: కుమారుని హోదాకు తాను తగినవాడిని కాదనే నైతిక, సామాజిక భావాన్ని నిలుపుతుంది.
- source_word: κληθῆναι
  choice: పిలవబడడానికి
  rationale: కర్మణి infinitive భావాన్ని నేరుగా నిలుపుతూ, ఒక హోదాతో గుర్తించబడడాన్ని వ్యక్తం చేస్తుంది.
- source_word: υἱός
  choice: కుమారుడు
  rationale: గ్రీకు పదంలోని పుంలింగ ఏకవచనాన్ని, ఉపమాన కథలోని తండ్రి-కుమార సంబంధాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: ποίησόν
  choice: నన్ను చేసుకో
  rationale: తనను కొత్త, తక్కువ హోదాలో ఉంచమనే ఆజ్ఞార్థక విన్నపాన్ని సహజమైన తెలుగులో బలంగా వ్యక్తం చేస్తుంది; ‘చూడు’ లేదా ‘నడుచుకో’ అనే వ్యాఖ్యాత్మక భావాన్ని చేర్చదు.
- source_word: ὡς
  choice: ఒకడిలా
  rationale: పూర్తి సమానత్వంకన్నా పోలికను సూచించే గ్రీకు ప్రయోగాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἕνα τῶν μισθίων σου
  choice: నీ కూలివారిలో ఒకడు
  rationale: μίσθιος జీతం లేదా కూలి తీసుకుని పనిచేసే వ్యక్తిని సూచిస్తుంది; ఇంటి బానిస అనే భావాన్ని కలపకుండా ఆధునిక పాఠకులకు సులభంగా అర్థమవుతుంది.
theological_decisions:
- issue: కుమారుని ఒప్పుకోలులో హోదా భాష
  choice: ‘యోగ్యుణ్ణి’ మరియు ‘కుమారుడు’ అనే పదాలను మృదువుపరచకుండా నిలుపడం
  alternative: ‘నీ బిడ్డనని పిలవబడే అర్హత నాకు లేదు’
  rationale: ఈ వాక్యం సాధారణ అపరాధభావాన్ని మాత్రమే కాకుండా, కుమారుని సంబంధ హోదాకు తాను తగనివాడినని అతడు భావించడాన్ని వ్యక్తం చేస్తుంది. గ్రీకు పాఠానికి మించి ఎటువంటి సిద్ధాంతపరమైన నిర్ణయాన్నీ చేర్చకుండా సంబంధం మరియు గౌరవ-అవమాన పార్శ్వాలను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలి. ‘కూలివారు’ ద్వారా వేతనానికి పనిచేసేవారు మరియు ఇంటి బానిసల మధ్య ఉన్న మూలపాఠ భేదాన్ని కాపాడాం. ఫుట్‌నోట్ గుర్తు దానికి సంబంధించిన పదబంధం తర్వాత ఉంచబడింది.
