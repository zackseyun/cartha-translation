  text: ὅτι οὗτος ὁ υἱός μου νεκρὸς ἦν καὶ ἀνέζησεν, ⸂ἦν ἀπολωλὼς⸃ καὶ εὑρέθη. καὶ ἤρξαντο εὐφραίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/024.yaml
  text: because this son of mine was dead and has come to life again[a]; he was lost and has been found[b]. And they began to celebrate.
translation:
  language: te
  text: ఎందుకంటే, నా ఈ కుమారుడు చనిపోయి మళ్లీ బ్రతికాడు[a]; తప్పిపోయి దొరికాడు[b].’ అప్పుడు వారు సంబరపడడం మొదలుపెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తిరిగి జీవించాడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘కనుగొనబడ్డాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: తండ్రి సంబరానికి కారణం వివరిస్తున్నందున, ఆధునిక తెలుగులో సహజమైన కారణార్థక అనుసంధానంగా దీనిని ఎంచుకున్నాం.
- source_word: οὗτος ὁ υἱός μου
  choice: నా ఈ కుమారుడు
  rationale: οὗτος లోని నిర్దేశక ఉద్ఘాటనను నిలుపుతూ తెలుగులో సహజమైన పదక్రమాన్ని వాడాం.
- source_word: νεκρὸς ἦν
  choice: చనిపోయి
  rationale: తదుపరి ‘మళ్లీ బ్రతికాడు’తో సహజంగా జతకట్టేలా ఉన్నప్పటికీ, మూలంలోని బలమైన మరణ భాషను మెత్తబరచకుండా నిలిపాం.
- source_word: ἀνέζησεν
  choice: మళ్లీ బ్రతికాడు
  rationale: అఓరిస్ట్ క్రియ యొక్క సరళ గత సంఘటనను, అలాగే ‘తిరిగి జీవించడం’ అనే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἦν ἀπολωλὼς
  choice: తప్పిపోయి
  rationale: లూకా 15లోని తప్పిపోయినది–దొరికినది అనే ప్రధాన రూపకాన్ని నిలుపుతుంది; ‘నాశనమై’ అనడం సందర్భానికి మించిన అర్థాన్ని చేర్చుతుంది.
- source_word: εὑρέθη
  choice: దొరికాడు
  rationale: గ్రీకు కర్మణి రూపాన్ని తెలుగులో సహజమైన అకర్మక వ్యక్తీకరణతో అందిస్తుంది; ఎవరు కనుగొన్నారో నిర్దిష్టంగా చెప్పకుండా మూలంలోని తెరచిన భావాన్ని కాపాడుతుంది.
- source_word: ἤρξαντο εὐφραίνεσθαι
  choice: వారు సంబరపడడం మొదలుపెట్టారు
  rationale: ἤρξαντο లోని ప్రారంభ భావాన్ని ‘మొదలుపెట్టారు’ నిలుపుతుంది; విందు సందర్భంలోని ఉల్లాసాన్ని ‘సంబరపడడం’ సహజ ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ‘చనిపోయి—మళ్లీ బ్రతికాడు’ అనే భాష యొక్క రూపకాల బలం
  choice: మరణం, తిరిగి జీవించడం అనే నేరుగా ఉన్న భాషనే నిలుపడం
  alternative: ‘మాకు చనిపోయినవాడిలా ఉండి ఇప్పుడు తిరిగి వచ్చాడు’ అని వివరణాత్మకంగా మార్చడం
  rationale: కథలో ఇది దూరమైపోవడం నుంచి పునరుద్ధరణకు రూపకం అయినప్పటికీ, గ్రీకు పాఠం ఉద్దేశపూర్వకంగా బలమైన మరణ–జీవ భాషను వాడుతుంది. దానిని వ్యాఖ్యానాత్మకంగా సడలించకుండా theological tension ను నిలిపాం.
- issue: εὑρέθηలో కార్యసాధకుడు పేర్కొనబడకపోవడం
  choice: ‘దొరికాడు’ అని కార్యసాధకుడిని పేర్కొనకుండా ఉంచడం
  alternative: ‘మేము అతణ్ణి కనుగొన్నాం’ అని కార్యసాధకుడిని చేర్చడం
  rationale: మూలపాఠంలోని కర్మణి రూపం ఎవరు కనుగొన్నారో చెప్పదు. దేవుడే కార్యసాధకుడని గానీ కుటుంబమేనని గానీ అనువాదంలో నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. తండ్రి మాట ముగిసే చోట ముగింపు ఉద్ధరణ చిహ్నాన్ని ఉంచాం; ముందరి వచనంతో కలిపి ముద్రించినప్పుడు ప్రారంభ ఉద్ధరణ చిహ్నం అక్కడి నుంచే వస్తుందని భావించాం.
