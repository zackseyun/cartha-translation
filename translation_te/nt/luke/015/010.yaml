id: LUK.15.10
reference: Luke 15:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως, λέγω ὑμῖν, ⸂γίνεται χαρὰ⸃ ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/010.yaml
  text: In the same way[a], I tell you[b], there is joy before the angels of God over one sinner who repents.
translation:
  language: te
  text: 'అలాగే[a], నేను మీకు చెబుతున్నాను: పశ్చాత్తాపపడుతున్న ఒక్క పాపిని బట్టి దేవుని దూతల సమక్షంలో ఆనందం కలుగుతుంది.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఈ విధంగా’ లేదా ‘అలా’.
    reason: lexical_alternative
  - marker: b
    text: ‘దేవుని దూతల సమక్షంలో’ అని మూలపాఠం చెబుతుంది; ఆనందించేవారు దూతలేనని అది స్పష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: అదే విధంగా
  rationale: ముందున్న ఉపమానంలోని పరిస్థితిని ఈ వాక్యానికి అన్వయించే పోలిక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో చెబుతున్నాను
  rationale: ప్రత్యక్ష సంబోధనతో కూడిన గ్రీకు వాక్యసూత్రాన్ని సహజంగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: γίνεται χαρά
  choice: ఆనందం కలుగుతుంది
  rationale: ఆనందం ఉనికిలోకి రావడం లేదా సంభవించడం అనే γίνομαι భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐνώπιον
  choice: సమక్షంలో
  rationale: ఎవరి ఎదుట లేదా సన్నిధిలో అనే స్థల/సాన్నిధ్య భావాన్ని నిలుపుతూ, దూతలే ఆనందానికి కర్తలని స్పష్టంగా చెప్పదు.
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: దేవుని దూతల
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని స్పష్టంగా, సూటిగా అందిస్తుంది.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: ఒక్క పాపి విషయంలో
  rationale: ఆనందానికి సందర్భం లేదా కారణమైన వ్యక్తిని సూచిస్తుంది; ‘విషయంలో’ అనేది కర్తృత్వాన్ని అదనంగా చేర్చకుండా భావాన్ని అందిస్తుంది.
- source_word: μετανοοῦντι
  choice: పశ్చాత్తాపపడే
  rationale: వర్తమాన కృదంతం పాపిని విశేషించే విధానాన్ని నిలుపుతూ, స్థిరపడిన బైబిలు భావాన్ని సిద్ధాంతపరంగా విస్తరించకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: పశ్చాత్తాప భాష యొక్క భావం
  choice: పశ్చాత్తాపపడే
  alternative: మనసు మార్చుకునే / తిరిగి వచ్చే
  rationale: ఈ వచనం పశ్చాత్తాపాన్ని విపులంగా నిర్వచించదు. అందువల్ల దాని విస్తృతమైన బైబిలు భావాన్ని కుదించకుండా సాధారణంగా అర్థమయ్యే పదాన్ని ఉపయోగించాం.
- issue: ఆనందం యొక్క స్థానం లేదా కర్త
  choice: దేవుని దూతల సమక్షంలో ఆనందం కలుగుతుంది
  alternative: దేవుని దూతలు ఆనందిస్తారు
  rationale: గ్రీకు వాక్యం ఆనందం దూతల ఎదుట కలుగుతుందని చెబుతుంది; దూతలే ఆనందించే కర్తలని వ్యాకరణపరంగా స్పష్టంగా చెప్పదు. అందువల్ల మూలంలోని ఉద్దేశపూర్వక అనిశ్చితిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని ‘దూతల సమక్షంలో’ అనే సూక్ష్మ భేదాన్ని నిలుపుతూ, దూతలనే ఆనందానికి కర్తలుగా మార్చలేదు.
