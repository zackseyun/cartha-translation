id: LUK.15.13
reference: Luke 15:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ μετ’ οὐ πολλὰς ἡμέρας συναγαγὼν ⸀πάντα ὁ νεώτερος υἱὸς ἀπεδήμησεν εἰς χώραν μακράν, καὶ ἐκεῖ διεσκόρπισεν τὴν οὐσίαν αὐτοῦ ζῶν ἀσώτως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/013.yaml
  text: And after not many days[a], the younger son gathered everything together and went away to a distant country, and there he squandered his property[c][b], living recklessly.
translation:
  language: te
  text: కొన్ని రోజుల తర్వాత[a], చిన్న కుమారుడు తనకు ఉన్నదంతా సమకూర్చుకొని దూరదేశానికి వెళ్లిపోయాడు. అక్కడ విచ్చలవిడిగా జీవిస్తూ తన ఆస్తిని వృథా చేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొద్ది రోజుల తర్వాత.” గ్రీకు పదబంధం అక్షరార్థంగా, “అనేక రోజులు గడవక తర్వాత” అని ఉంటుంది.
    reason: lexical_alternative
  - marker: b
    text: “విచ్చలవిడిగా” అంటే అదుపు లేకుండా లేదా వృథాగా జీవించడం. ఇక్కడ మూలపాఠం నిర్దిష్టమైన పాపాలను పేర్కొనడం లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολλὰς ἡμέρας
  choice: కొన్ని రోజుల తర్వాత
  rationale: గ్రీకు భాషలో అక్షరార్థంగా ‘ఎక్కువ రోజులు గడవకముందే’ అనే నిషేధాత్మక ప్రయోగం ఉంది. ఆధునిక తెలుగులో ‘కొన్ని రోజుల తర్వాత’ అదే కాలవ్యవధిని సహజంగా తెలియజేస్తుంది; అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: συναγαγὼν πάντα
  choice: తనకు ఉన్నదంతా సమకూర్చుకొని
  rationale: సమకూర్చుకోవడం బయలుదేరడానికి ముందుగా జరిగిన చర్య అని కృదంత రూపం సూచిస్తుంది. πάντα ను సందర్భానుసారంగా కుమారునికి చెందిన సమస్త సంపదగా అర్థమయ్యేలా, దాన్ని నగదుగా మార్చాడని అవసరానికి మించి నిర్దిష్టపరచకుండా అనువదించాం.
- source_word: ὁ νεώτερος υἱός
  choice: చిన్న కుమారుడు
  rationale: ఇద్దరు కుమారులలో వయసులో చిన్నవాడిని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: ἀπεδήμησεν
  choice: వెళ్లిపోయాడు
  rationale: సొంత ప్రాంతాన్ని విడిచి మరొక ప్రాంతానికి వెళ్లడాన్ని సూచిస్తుంది. తరువాత వచ్చే ‘దూరదేశానికి’తో కలిసి మూలపద భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: εἰς χώραν μακράν
  choice: దూరదేశానికి
  rationale: χώρα ఇక్కడ ఒక దూర ప్రాంతం లేదా దేశాన్ని సూచిస్తుంది. ‘దూరదేశం’ సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: διεσκόρπισεν
  choice: వృథా చేశాడు
  rationale: పదానికి ప్రాథమికంగా ‘చెదరగొట్టడం’ అనే భావం ఉన్నా, ఆస్తి సందర్భంలో దాన్ని వ్యర్థంగా ఖర్చుచేసి పోగొట్టడమే ఉద్దేశం.
- source_word: τὴν οὐσίαν αὐτοῦ
  choice: తన ఆస్తిని
  rationale: οὐσία అతనికి చెందిన సంపద, ఆస్తి లేదా జీవనాధారాలను విస్తృతంగా సూచిస్తుంది. ‘ఆస్తి’ సందర్భానికి సరిపోతూ అతిగా నిర్దిష్టపరచదు.
- source_word: ζῶν ἀσώτως
  choice: విచ్చలవిడిగా జీవిస్తూ
  rationale: అతడు తన ఆస్తిని వృథా చేసిన జీవనరీతిని ఇది వివరిస్తుంది. ‘విచ్చలవిడిగా’ బాధ్యతారహితమైన, అదుపులేని జీవనాన్ని తెలియజేస్తుంది; మూలంలో స్పష్టంగా లేని లైంగిక లేదా ఇతర ప్రత్యేక పాపాలను ఇందులో చేర్చదు.
theological_decisions:
- issue: ἀσώτως సూచించే జీవనరీతి
  choice: విచ్చలవిడిగా జీవిస్తూ
  alternative: దురాచారంగా జీవిస్తూ
  rationale: ఈ వచనం నిర్దిష్టమైన పాపాలను పేర్కొనకుండా వ్యర్థమైన, బాధ్యతారహితమైన జీవనరీతినే సూచిస్తుంది. అందువల్ల లైంగిక దురాచారం వంటి సంకుచిత భావాన్ని అనువాదంలోకి తీసుకురాలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని ఉపయోగించాం. వాక్యాన్ని తెలుగు ప్రవాహానికి అనుగుణంగా రెండుగా విభజించాం. భాష గౌరవప్రదంగా, సాధారణ పాఠకులకు సులభంగా ఉండేలా చూసాం.
