id: LUK.15.20
reference: Luke 15:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἦλθεν πρὸς τὸν πατέρα ⸀ἑαυτοῦ. ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος εἶδεν αὐτὸν ὁ πατὴρ αὐτοῦ καὶ ἐσπλαγχνίσθη καὶ δραμὼν ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/020.yaml
  text: And he arose and came to his father[a]. But while he was still far away, his father saw him and was moved with compassion[b], and ran and fell on his neck and kissed him fervently.
translation:
  language: te
  text: అతడు లేచి తన తండ్రి దగ్గరికి వెళ్లాడు. అతడు ఇంకా చాలా దూరంలో ఉండగానే, అతని తండ్రి అతన్ని చూసి కనికరంతో కదిలిపోయాడు. పరుగెత్తి అతని మెడపై పడి, అతన్ని ఆప్యాయంగా ముద్దుపెట్టుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ గ్రీకు క్రియ గాఢమైన ఆప్యాయతను సూచిస్తుంది; ‘పలుమార్లు ముద్దుపెట్టుకున్నాడు’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: లేచి
  rationale: నిర్ణయాత్మకంగా లేచి తదుపరి చర్యకు పూనుకున్న క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἦλθεν πρὸς τὸν πατέρα ἑαυτοῦ
  choice: తన తండ్రి దగ్గరికి వెళ్లాడు
  rationale: ἔρχομαι సందర్భానుసారం ‘వచ్చు/వెళ్లు’ అనే భావాలను ఇస్తుంది. కుమారుని దృష్టికోణంలో ‘వెళ్లాడు’ సహజమైన తెలుగు; ἑαυτοῦ లోని ప్రతిబింబ భావాన్ని ‘తన’ స్పష్టంగా నిలుపుతుంది.
- source_word: ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος
  choice: అతడు ఇంకా చాలా దూరంలో ఉండగానే
  rationale: అతడు దూరంలో ఉన్న సమయంలోనే తండ్రి చర్య మొదలైందనే సమకాలిక పరిస్థితిని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐσπλαγχνίσθη
  choice: కనికరంతో కదిలిపోయాడు
  rationale: కేవలం కనికరం కలిగిందని కాక, లోతైన అంతరంగ అనుకంపతో ప్రభావితుడయ్యాడనే క్రియ యొక్క భావోద్వేగ బలాన్ని నిలుపుతుంది.
- source_word: δραμὼν
  choice: పరుగెత్తి
  rationale: మూలంలోని సూటియైన, వేగవంతమైన చర్యను సహజంగా అందిస్తుంది.
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ
  choice: అతని మెడపై పడి
  rationale: ‘అతని మెడపై పడ్డాడు’ అనే మూలభాషా దృశ్యాన్ని నిలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘చేతులు చుట్టూ వేశాడు’ వంటి వివరాన్ని చేర్చదు.
- source_word: κατεφίλησεν
  choice: ఆప్యాయంగా ముద్దుపెట్టుకున్నాడు
  rationale: καταφιλέω సూచించే గాఢమైన ఆప్యాయతను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ముద్దులు తప్పనిసరిగా పలుమార్లు పెట్టాడని ప్రధాన పాఠ్యంలో అతిగా నిర్దిష్టీకరించదు.
theological_decisions:
- issue: ఉపమానంలోని తండ్రి కనికర చిత్రణ
  choice: తండ్రి స్పందనను భావోద్వేగ బలంతో, అయితే ఉపమానార్థాన్ని విస్తరించకుండా అనువదించడం
  alternative: తండ్రి దేవుణ్ణి సూచిస్తున్నాడని ప్రధాన పాఠ్యంలోనే స్పష్టంగా విస్తరించడం
  rationale: వచనం తండ్రి కనికరాన్ని బలమైన కథన క్రియలతో చూపుతుంది. ఆ బలాన్ని నిలుపుతూ, వచనం స్వయంగా చెప్పని సిద్ధాంతార్థాన్ని అనువాదంలో చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. చిన్న వాక్యాలతో చర్యల వేగం నిలుపబడింది; ‘మెడపై పడి’ అనే పదబంధం మూలంలోని స్పష్టమైన దృశ్యాన్ని ఉద్దేశపూర్వకంగా కాపాడుతుంది.
