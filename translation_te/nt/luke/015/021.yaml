id: LUK.15.21
reference: Luke 15:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂ὁ υἱὸς αὐτῷ⸃· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου, ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/021.yaml
  text: But the son said to him[a], ‘Father, I have sinned against heaven and before you[b]. I am no longer worthy to be called your son.’
translation:
  language: te
  text: 'కాని కుమారుడు అతనితో ఇలా అన్నాడు: “తండ్రీ, నేను పరలోకానికి వ్యతిరేకంగా[a], నీ ఎదుట పాపం చేశాను. ఇక నీ కుమారుడని పిలవబడటానికి నేను యోగ్యుడను కాను[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పరలోకానికి వ్యతిరేకంగా’ అనే గ్రీకు ప్రయోగంలో ‘పరలోకం’ దేవుణ్ణి గౌరవపూర్వకంగా సూచించే పరోక్ష పదం. కొన్ని అనువాదాలు దీనిని భావానువాదంగా ‘దేవునికి వ్యతిరేకంగా’ అని ఇస్తాయి.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రతుల్లో కుమారుని మాటలు, 19వ వచనంతో సరిపోలేలా, ‘నీ కూలివానిగా నన్ను ఉంచుకో’ అనే అర్థమిచ్చే పదాలతో కొనసాగుతాయి. SBLGNT పాఠ్యంలో వాక్యం ‘నీ కుమారుడు’తో ముగుస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: కాని ... అన్నాడు
  rationale: δέ ఒక స్వల్ప అనుసంధాన పదం. ఇక్కడ తండ్రి చేసిన మునుపటి చర్యకు కుమారుని ఒప్పుకోలు కథనపరమైన మలుపుగా రావడంతో ‘కాని’ సహజంగా సరిపోతుంది; దీనికి అతిగా బలమైన విరోధార్థం ఇవ్వలేదు.
- source_word: ὁ υἱὸς αὐτῷ
  choice: కుమారుడు అతనితో
  rationale: గ్రీకు వాక్యంలోని ‘కుమారుడు’ మరియు ‘అతనితో’ అనే సూచనలను అలాగే నిలిపి, సందర్భంలో తండ్రినే సూచిస్తున్నది స్పష్టంగా ఉండే సహజ తెలుగు నిర్మాణాన్ని ఉపయోగించాం.
- source_word: Πάτερ
  choice: తండ్రీ
  rationale: సంబోధనా రూపాన్ని అదనంగా ‘నా’ అని చేర్చకుండా నేరుగా, సహజంగా అనువదించాం.
- source_word: ἥμαρτον
  choice: పాపం చేశాను
  rationale: అయిపోయిన కార్యాన్నీ, ప్రస్తుతం ఒప్పుకుంటున్న దోషాన్నీ తెలుగులో సహజంగా తెలియజేసే ఒప్పుకోలు రూపం.
- source_word: εἰς τὸν οὐρανὸν
  choice: పరలోకానికి విరోధంగా
  rationale: ఇది దేవుణ్ణి గౌరవపూర్వకంగా సూచించే యూదుల ప్రయోగం అయినప్పటికీ, మూలంలోని ‘పరలోకం’ అనే పదాన్ని వ్యాఖ్యానాత్మకంగా ‘దేవుడు’గా మార్చకుండా నిలిపాం.
- source_word: καὶ ἐνώπιόν σου
  choice: నీ ఎదుట
  rationale: ἐνώπιον యొక్క ‘ఎదుట, సమక్షంలో’ అనే భావాన్ని కాపాడుతుంది. ‘నీకు విరోధంగా’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా వ్యక్తిగత సంబంధంలోని అపరాధ భావాన్ని సందర్భమే తెలియజేయనిచ్చాం.
- source_word: οὐκέτι
  choice: ఇక ... లేదు
  rationale: ‘ఇకపై కాదు/ఇక లేదు’ అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἄξιος
  choice: అర్హత
  rationale: ఈ పశ్చాత్తాప సందర్భంలోని నైతిక, సంబంధపరమైన యోగ్యత భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: κληθῆναι
  choice: పిలవబడే
  rationale: καλέω యొక్క కర్మణి భావాన్ని నిలుపుతూ తెలుగులో చదవదగిన నిర్మాణాన్ని ఎంచుకున్నాం.
- source_word: υἱός σου
  choice: నీ కుమారుడు
  rationale: కుమారునిగా తనకున్న సంబంధపరమైన హోదాను తాను ధరించడానికి అర్హుడు కాదని భావిస్తున్న విషయాన్ని మూలానికి అనుగుణంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఒప్పుకోలులో ‘పరలోకం’ అనే పదం అర్థం
  choice: దేవునికి విరోధంగా చేసిన పాపాన్ని గౌరవసూచక పరోక్ష ప్రయోగంతో చెప్పినదిగా గ్రహిస్తూ, ప్రధాన పాఠ్యంలో ‘పరలోకం’ అనే మూలపదాన్ని నిలిపాం.
  alternative: ‘దేవునికి విరోధంగా’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం.
  rationale: గ్రీకు పాఠ్యం నేరుగా ‘పరలోకం’ అని చెబుతుంది. అసలైన పదప్రయోగాన్ని నిలిపి, దాని సూచిత అర్థాన్ని పాదసూచికలో వివరించడం మూలభాష ప్రాధాన్యాన్నీ నిజమైన భాషాపరమైన అంతరాన్నీ కాపాడుతుంది.
- issue: ఈ వచనంలో కుమారుని మాటల పరిమితి
  choice: SBLGNT ప్రకారం కుమారుని మాటలను ‘నీ కుమారుడు’తో ముగించాం.
  alternative: లూకా 15:19తో సరిపోలేలా ‘నీ కూలివారిలో ఒకనిగా నన్ను ఉంచుకో’ అనే దీర్ఘ పాఠాన్ని చేర్చడం.
  rationale: అందించిన మూలపాఠ్యం ఈ వాక్యాన్ని ‘నీ కుమారుడు’తో ముగిస్తుంది. కొన్ని ప్రతుల్లోని దీర్ఘ పాఠాన్ని ప్రధాన వచనంలో కలపకుండా పాదసూచికలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘పరలోకానికి విరోధంగా’ మరియు ‘నీ ఎదుట’ అనే భిన్న సంబంధపదాలను ఉద్దేశపూర్వకంగా నిలిపి, మూలంలోని భావసూక్ష్మతను ఒకే వ్యాఖ్యానంలో కలిపివేయలేదు.
