revisions:
- from: 'కాని కుమారుడు అతనితో ఇలా అన్నాడు: “తండ్రీ, నేను పరలోకానికి విరోధంగా[a], నీ ఎదుట పాపం చేశాను. ఇక నీ కుమారుడని పిలవబడే అర్హత నాకు లేదు[b].”'
  to: 'కాని కుమారుడు అతనితో ఇలా అన్నాడు: “తండ్రీ, నేను పరలోకానికి వ్యతిరేకంగా[a], నీ ఎదుట పాపం చేశాను. ఇక నీ కుమారుడని పిలవబడటానికి నేను యోగ్యుడను కాను[b].”'
  rationale: 'సవరణలు అర్థాన్ని మార్చకుండా రెండు చోట్ల చేశాం: (1) ‘పరలోకానికి విరోధంగా’ను ఆధునిక తెలుగులో సహజమైన ‘పరలోకానికి వ్యతిరేకంగా’గా మార్చాం; (2) ‘అర్హత నాకు లేదు’ను మూలంలోని వ్యక్తిగత యోగ్యత భావాన్ని స్పష్టంగా ప్రతిబింబించే ‘నేను యోగ్యుడను కాను’గా మార్చాం. పాదసూచిక aలో కూడా ప్రధాన పాఠ్యంలోని సంబంధపదానికి అనుగుణంగా ‘వ్యతిరేకంగా’ వాడాం; పాదసూచిక bలో దీర్ఘ పాఠం ఏకవచన భావాన్ని స్పష్టంచేశాం.'
