id: LUK.15.16
reference: Luke 15:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐπεθύμει ⸂γεμίσαι τὴν κοιλίαν αὐτοῦ ἀπὸ⸃ τῶν κερατίων ὧν ἤσθιον οἱ χοῖροι, καὶ οὐδεὶς ἐδίδου αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/016.yaml
  text: And he longed to fill his stomach with the carob pods that the pigs were eating[a], and no one was giving him anything.
translation:
  language: te
  text: పందులు తింటున్న కారబ్ చెట్టు కాయలతో[a] తన కడుపు నింపుకోవాలని అతడు ఎంతో ఆశపడేవాడు, కానీ ఎవరూ అతనికి ఏమీ ఇచ్చేవారు కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదం కారబ్ చెట్టు కాయలను సూచిస్తుంది; ఇవి పశువుల మేతగా కూడా ఉపయోగించబడేవి.
    reason: lexical_explanation
lexical_decisions:
- source_word: ἐπεθύμει
  choice: ఎంతో ఆశపడేవాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న బలమైన కోరికను సూచిస్తుంది; ఈ ప్రయోగం దానిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: γεμίσαι τὴν κοιλίαν αὐτοῦ
  choice: తన కడుపు నింపుకోవాలని
  rationale: మూలంలోని శారీరక ఆకలి చిత్రాన్ని వ్యాఖ్యానాత్మకమైన ‘ఆకలి తీర్చుకోవడం’గా మార్చకుండా నిలుపుతుంది.
- source_word: ἀπὸ τῶν κερατίων
  choice: మిడతచెట్టు కాయలతో
  rationale: ἀπό ఇక్కడ నింపబడే పదార్థాన్ని సూచిస్తుంది; తెలుగులో ‘తో’ సహజంగా ఉంటుంది. κεράτιαకు నిర్దిష్టమైన వృక్షఫలార్థాన్ని ఇస్తుంది.
- source_word: οἱ χοῖροι
  choice: పందులు
  rationale: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, స్పష్టమైన సమానార్థకం.
- source_word: ἤσθιον
  choice: తింటున్న
  rationale: అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న దృశ్యాన్ని సందర్భానుగుణంగా చూపిస్తుంది.
- source_word: οὐδεὶς ἐδίδου αὐτῷ
  choice: ఎవరూ అతనికి ఏమీ ఇచ్చేవారు కాదు
  rationale: ἐδίδου సూచించే కొనసాగుతున్న ఇవ్వకపోవడాన్ని ‘ఇచ్చేవారు కాదు’ నిలుపుతుంది; తెలుగులో వాక్యం సంపూర్ణంగా ఉండేందుకు అంతర్లీన కర్మను ‘ఏమీ’గా వ్యక్తం చేసింది.
theological_decisions: []
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు; ఆకలి యొక్క శారీరక చిత్రణను, కొనసాగుతున్న కోరికను మరియు ఎవరూ సహాయం చేయని స్థితిని మూలంలోని కాలరూపాలకు అనుగుణంగా నిలిపింది. ‘మిడతచెట్టు’ తెలుగు బైబిలు పాఠకులకు పరిచితమైన వృక్షనామం; ‘కారబ్’ను పాదటిప్పణిలో ఇచ్చి వృక్షాన్ని స్పష్టం చేసింది.
