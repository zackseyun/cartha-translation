  terminology: ‘పశ్చాత్తాపపడే’ and ‘పశ్చాత్తాపం’ are established, understandable Telugu biblical terms for μετανοεῖν/μετάνοια. ‘నీతిమంతులు’ faithfully preserves δικαίοις without prematurely deciding whether the contextual effect is straightforward or ironic. ‘పరలోకంలో’ preserves the locative wording and does not specify an unstated rejoicing subject.
