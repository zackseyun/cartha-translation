id: LUK.15.7
reference: Luke 15:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι οὕτως χαρὰ ⸂ἐν τῷ οὐρανῷ ἔσται⸃ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι ἢ ἐπὶ ἐνενήκοντα ἐννέα δικαίοις οἵτινες οὐ χρείαν ἔχουσιν μετανοίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/007.yaml
  text: I tell you[b][a], in the same way there will be joy in heaven over one sinner who has a change of mind than over ninety-nine righteous people who have no need of one.
translation:
  language: te
  text: '“నేను మీతో చెబుతున్నాను: అలాగే[a], పశ్చాత్తాపపడే ఒక్క పాపి విషయంలో, పశ్చాత్తాపం అవసరం లేని తొంభై తొమ్మిది మంది నీతిమంతుల[b] విషయంలో కలిగేదానికంటే ఎక్కువ సంతోషం పరలోకంలో కలుగుతుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఇలా’ లేదా ‘ఈ విధంగా’ అని కూడా అనువదించవచ్చు. ఈ మాట ముందున్న ఉపమానంలోని ముఖ్యాంశంతో పరలోక ఆనందాన్ని అనుసంధానిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: మూలపాఠంలో ‘నీతిమంతులు’ అనే ఉంది. సందర్భంలో దీనిని నేరుగా అర్థం చేసుకోవచ్చు లేదా వ్యంగ్యంగా అర్థం చేసుకోవచ్చు; అనువాదం ఏ అర్థాన్నీ నిర్బంధించకుండా మూలపాఠ పదాన్ని నిలుపుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: నేను మీతో చెబుతున్నాను
  rationale: ప్రత్యక్ష సంబోధనను, గంభీరమైన ప్రకటన స్వరాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: οὕτως
  choice: అలాగే
  rationale: ముందున్న ఉపమానంలోని ఆనందానికీ ఈ ప్రకటనకూ ఉన్న సంబంధాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: χαρὰ ἐν τῷ οὐρανῷ ἔσται
  choice: సంతోషం పరలోకంలో కలుగుతుంది
  rationale: భవిష్యత్ భావాన్ని, ఆనందం కలిగే స్థలాన్ని నిలుపుతుంది; ఆనందించేవారు ఎవరో మూలపాఠం చెప్పనందున వారిని చేర్చలేదు.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: ఒక్క పాపి విషయంలో
  rationale: ἐπί ఇక్కడ ఆనందానికి సందర్భం లేదా కారణమైన వ్యక్తిని సూచిస్తుంది; ‘విషయంలో’ అనేది అతిగా వివరణ చేర్చకుండా ఆ సంబంధాన్ని తెలుగులో తెలియజేస్తుంది.
- source_word: μετανοοῦντι
  choice: పశ్చాత్తాపపడే
  rationale: వర్తమాన కృదంతంలోని క్రియాశీల భావాన్ని సహజమైన తెలుగు విశేషణ వాక్యభాగంగా నిలుపుతుంది.
- source_word: ἢ
  choice: కంటే ఎక్కువ
  rationale: ఇది తులనాత్మక నిర్మాణం. తెలుగులో పోలికను సంపూర్ణంగా, సహజంగా వ్యక్తం చేయడానికి ‘కంటే’తో పాటు అంతర్లీనమైన అధికతను ‘ఎక్కువ’గా స్పష్టం చేయడం అవసరం.
- source_word: ἐνενήκοντα ἐννέα δικαίοις
  choice: తొంభై తొమ్మిది మంది నీతిమంతులు
  rationale: నామవాచకంగా వాడిన విశేషణాన్ని వ్యక్తులను సూచించే సహజ తెలుగు రూపంలో అందిస్తుంది; ‘నీతిమంతులు’ అన్న మూలపాఠ పదాన్ని వ్యాఖ్యానాత్మకంగా మార్చదు.
- source_word: οἵτινες οὐ χρείαν ἔχουσιν μετανοίας
  choice: పశ్చాత్తాపం అవసరం లేని
  rationale: వారి లక్షణాన్ని తెలిపే సంబంధ వాక్యభాగాన్ని సంక్షిప్తంగా, స్పష్టంగా వ్యక్తం చేస్తూ μετανοίας అనే నామవాచకాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘నీతిమంతులు’ నిజంగా నీతిమంతులైనవారిని సూచిస్తుందా, లేక తమను తాము నీతిమంతులుగా భావించేవారిని వ్యంగ్యంగా సూచిస్తుందా?
  choice: మూలపాఠంలోని ‘నీతిమంతులు’ అనే పదాన్నే ఎటువంటి వ్యాఖ్యానాత్మక మార్పూ లేకుండా ఉంచడం.
  alternative: ‘తాము నీతిమంతులమని భావించేవారు’ అని అనువదించడం లేదా వ్యంగ్యాన్ని సూచించే ఉద్ధరణ చిహ్నాలు పెట్టడం.
  rationale: గ్రీకు పాఠం వ్యంగ్యాన్ని బహిరంగంగా గుర్తించదు. సందర్భం ఆ పఠనానికి అవకాశం ఇచ్చినా, అనువాదం ఆ వేదాంతపరమైన ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
- issue: ‘పరలోకంలో’ ఆనందించేవారు ఎవరు?
  choice: ఆనందం కలిగే స్థలాన్ని మాత్రమే పేర్కొని, ఆనందించేవారిని నిర్దిష్టంగా చెప్పకపోవడం.
  alternative: ‘దేవునికి ఆనందం కలుగుతుంది’ లేదా ‘పరలోక దూతలు ఆనందిస్తారు’ అని చెప్పడం.
  rationale: ఈ వచనం ఆనందం పరలోకంలో ఉంటుందని చెబుతుంది గాని దాని కర్తలను స్పష్టంగా పేర్కొనదు; దేవుణ్ణి లేదా దూతలను చేర్చడం మూలపాఠాన్ని మించిన వివరణ అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘పశ్చాత్తాపం’ సాధారణ పాఠకులకు తెలిసిన పదంగా ఉండటంతో పాటు మూలపాఠంలోని మతపరమైన నైతిక భావాన్ని నిలుపుతుంది. తులనాత్మక వాక్యం తెలుగులో స్పష్టంగా ఉండేందుకు మూలంలో అంతర్లీనంగా ఉన్న ‘ఎక్కువ’ చేర్చబడింది.
