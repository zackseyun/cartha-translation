id: LUK.15.31
reference: Luke 15:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Τέκνον, σὺ πάντοτε μετ’ ἐμοῦ εἶ, καὶ πάντα τὰ ἐμὰ σά ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/031.yaml
  text: And he said to him[a], ‘Child, you are always with me, and all that is mine is yours.’
translation:
  language: te
  text: అందుకు అతడు అతనితో, “బిడ్డా[a], నువ్వు ఎల్లప్పుడూ నాతోనే ఉన్నావు; నాకున్నదంతా నీదే” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కుమారుడా.” గ్రీకు పదం “బిడ్డా” అనే అర్థమిచ్చే ఆప్యాయ కుటుంబ సంబోధన.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: బిడ్డా
  rationale: ఏకవచన సంబోధనలోని ఆప్యాయ కుటుంబ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది. సందర్భంలోని వ్యక్తి కుమారుడే అయినప్పటికీ, గ్రీకు పదం υἱός (‘కుమారుడు’) కాదు; అందువల్ల ప్రధాన పాఠంలో లింగాన్ని మరింత నిర్దిష్టం చేయలేదు.
- source_word: πάντοτε
  choice: ఎల్లప్పుడూ
  rationale: ‘అన్ని సమయాల్లో, ఎప్పుడూ’ అనే నిరంతర భావాన్ని సహజంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: μετ’ ἐμοῦ
  choice: నాతోనే
  rationale: μετά + షష్ఠీ విభక్తి తెలిపే సహవాసాన్ని ‘నాతో’గా నేరుగా అందిస్తుంది; ‘నే’ తండ్రి మాటలోని సంబంధబలాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: πάντα τὰ ἐμὰ
  choice: నాకున్నదంతా
  rationale: తండ్రికి చెందిన సమస్త ఆస్తి లేదా సంపదను సమగ్రంగా సూచిస్తూ, తెలుగులో అస్పష్టత లేకుండా సహజంగా వినిపిస్తుంది.
- source_word: σά ἐστιν
  choice: నీదే
  rationale: ‘నీది’ అనే స్వామ్యార్థాన్ని దగ్గరగా నిలుపుతుంది; అది చట్టపరమైన హక్కా, కుటుంబ సంబంధంలోని భాగస్వామ్యమా అనే అంశాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: అందుకు అతడు అతనితో … అన్నాడు
  rationale: δέ ఇక్కడ మృదువైన ప్రతిస్పందన లేదా కథన కొనసాగింపును సూచిస్తుంది. కుమారుని ఫిర్యాదుకు తండ్రి ఇచ్చిన జవాబుగా ‘అందుకు’ ఆధునిక తెలుగులో సహజంగా సరిపోతుంది.
theological_decisions:
- issue: తండ్రి పెద్ద కుమారుణ్ణి సంబోధించిన కుటుంబ పదం
  choice: τέκνον ను ‘బిడ్డా’గా అనువదించడం
  alternative: ‘కుమారుడా’
  rationale: తండ్రి ఆప్యాయత ఈ సంబోధనలో ప్రధానమైనది. అయితే మూలంలో ‘కుమారుడు’ అనే మరింత లింగనిర్దిష్టమైన υἱός లేదు. కాబట్టి ‘బిడ్డా’ మూలంలోని సాన్నిహిత్యాన్ని కాపాడుతూ, పదాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే ఆప్యాయమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. సంభాషణలో సహజత్వం కోసం ‘నువ్వు/నీదే’ వాడబడింది; ఇది తండ్రి–బిడ్డ సాన్నిహిత్యానికి తగినది.
