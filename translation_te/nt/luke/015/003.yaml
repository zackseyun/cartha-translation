  to: 'అప్పుడు ఆయన వారికి ఈ ఉపమానాన్ని ఇలా చెప్పారు:'
  rationale: The revision adds standard accusative marking to the parable as the object of «చెప్పారు» and uses «ఇలా» to reflect λέγων’s function of introducing the ensuing quotation. «అప్పుడు» is retained as a natural narrative rendering of the mild connective δέ in context.
