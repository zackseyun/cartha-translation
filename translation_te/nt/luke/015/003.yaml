  text: 'So he told them this parable[a], saying:'
translation:
  language: te
  text: 'అప్పుడు ఆయన వారికి ఈ ఉపమానాన్ని ఇలా చెప్పారు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: చెప్పారు
  rationale: λέγω క్రియ యొక్క భూతకాల రూపం ఇక్కడ ఉపమానాన్ని పరిచయం చేస్తోంది. ‘ఉపమానం చెప్పారు’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, మాటల ద్వారా తెలియజేసిన భావాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: δέ స్వల్ప అనుసంధాన అవ్యయం. ముందటి ఫిర్యాదుకు యేసు ఇచ్చిన ప్రతిస్పందనగా కథనం ముందుకు సాగుతున్నదని ‘అప్పుడు’ సహజంగా సూచిస్తుంది; అనవసరమైన వ్యతిరేక భావాన్ని కలిగించదు.
- source_word: πρὸς αὐτοὺς
  choice: వారికి
  rationale: πρός + ద్వితీయా విభక్తి సంబోధితులను సూచిస్తుంది. తెలుగులో ‘వారికి ... చెప్పారు’ అనే నిర్మాణం సహజంగా అదే సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: τὴν παραβολὴν ταύτην
  choice: ఈ ఉపమానం
  rationale: సువార్తల సందర్భంలో παραβολήకు స్థిరమైన, సుపరిచితమైన తెలుగు పదం ‘ఉపమానం’; ταύτηνలోని నిర్దేశక భావాన్ని ‘ఈ’ నిలుపుతుంది.
- source_word: λέγων
  choice: ':'
  rationale: λέγων తరువాత వచ్చే ఉపమానంలోని ప్రత్యక్ష వాక్యాలను పరిచయం చేస్తుంది. తెలుగులో ‘చెప్పారు’ తరువాత ద్విబిందువు వాడటం సహజం; ‘అంటూ’ను చేరిస్తే తదుపరి వాక్యంతో కలిపినప్పుడు భారంగా ఉండే అవకాశం ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. యేసును సూచించే క్రియకు గౌరవ బహువచన రూపమైన ‘చెప్పారు’ వాడబడింది. గ్రీకు వాక్యంలోని λέγων భావం తెలుగులో విరామచిహ్నం ద్వారా సహజంగా వ్యక్తమైంది.
