lexical_decisions:
- source_word: εὑρὼν
  choice: కనుగొన్నప్పుడు
  rationale: భూతకాల క్రియావిశేషణ రూపాన్ని తెలుగులో సహజమైన కాలార్థక ఉపవాక్యంగా అనువదించాం. గ్రీకులో అంతర్లీనంగా ఉన్న కర్మను ముందరి సందర్భం ఆధారంగా ‘దాన్ని’ అని స్పష్టం చేశాం.
- source_word: ἐπιτίθησιν
  choice: పెట్టుకుంటాడు
  rationale: వర్తమానకాల ప్రధాన క్రియలోని సజీవ కథనశైలిని నిలుపుతుంది. భుజాల మీద మోసేందుకు ఉంచుకోవడం అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπὶ τοὺς ὤμους
  choice: తన భుజాల మీద
  rationale: ἐπί తో కూడిన ద్వితీయా విభక్తి, భుజాలపైకి ఉంచే కదలికను సూచిస్తుంది; ὤμους బహువచనాన్ని ‘భుజాల’గా నిలిపాం.
- source_word: αὐτοῦ
  choice: తన
  rationale: సర్వనామం కాపరినే సూచిస్తుంది. తెలుగు అన్వయానికి ‘తన’ సహజంగా ఉండి, భుజాలు కాపరివేనని స్పష్టం చేస్తుంది.
- source_word: χαίρων
  choice: సంతోషిస్తూ
  rationale: వర్తమాన క్రియావిశేషణం ప్రధాన చర్యతో పాటు కొనసాగుతున్న ఆనందాన్ని సూచిస్తుంది; క్రియావిశేషణ బలాన్ని కాపాడే సహజ తెలుగు రూపం ఇది.
theological_decisions:
- issue: ‘కనుగొన్నప్పుడు’ అనే క్రియకు కర్మను సరఫరా చేయడం
  choice: ముందరి సందర్భంలోని తప్పిపోయిన గొర్రెను సూచిస్తూ ‘దాన్ని’ చేర్చాం.
  alternative: ‘కనుగొన్నప్పుడు, అతడు సంతోషిస్తూ తన భుజాల మీద పెట్టుకుంటాడు.’
  rationale: గ్రీకులో సందర్భం వల్ల కర్మను చెప్పకుండా వదలవచ్చు; తెలుగులో స్పష్టత, సహజత్వం కోసం దాన్ని సరఫరా చేయడం అవసరం. ఇది కొత్త వేదాంత భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘పెట్టుకుంటాడు’ అనేది కాపరి గొర్రెను తన భుజాలపై ఉంచుకొని మోసే భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
