id: LUK.15.32
reference: Luke 15:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εὐφρανθῆναι δὲ καὶ χαρῆναι ἔδει, ὅτι ὁ ἀδελφός σου οὗτος νεκρὸς ἦν καὶ ⸀ἔζησεν, καὶ ⸀ἀπολωλὼς καὶ εὑρέθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/032.yaml
  text: But it was necessary to celebrate and rejoice[a], because this brother of yours was dead and has come to life again[c][b]; he was lost and has been found.
translation:
  language: te
  text: కానీ, వేడుక చేసుకొని సంతోషించడం అవసరమైంది[a]. ఎందుకంటే నీ ఈ సోదరుడు చనిపోయి మళ్లీ బ్రతికాడు[b]; తప్పిపోయి దొరికాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వేడుక చేసుకొని సంతోషించడం తగినదే.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా ‘బ్రతికాడు’; ఈ ఉపమానకథలో ఇది పునరుద్ధరణను సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘కనుగొనబడ్డాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφρανθῆναι
  choice: వేడుక చేసుకోవడం
  rationale: విందు సందర్భంలోని ఉత్సవభావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘ఉల్లాసపడడం’ కంటే సందర్భానికి స్పష్టంగా సరిపోతుంది.
- source_word: χαρῆναι
  choice: సంతోషించడం
  rationale: εὐφρανθῆναιతో ఉన్న సమీపార్థక జంటను ఒకే పదంగా కుదించకుండా, రెండవ ఆనందవ్యక్తీకరణను నిలుపుతుంది.
- source_word: ἔδει
  choice: అవసరమే
  rationale: నైతిక లేదా సందర్భోచిత ఆవశ్యకతను బలంగా వ్యక్తం చేస్తుంది; గ్రీకు అపూర్ణ భూతకాల రూపానికి అనుగుణంగా గత సందర్భంలోని అవసరాన్ని సూచిస్తుంది.
- source_word: ὁ ἀδελφός σου οὗτος
  choice: నీ ఈ తమ్ముడు
  rationale: సంబంధాన్ని గుర్తుచేసే σου మరియు చూపించే οὗτος రెండింటినీ నిలుపుతుంది. కథా సందర్భంలో అతడు పెద్ద కుమారుని తమ్ముడు కాబట్టి ‘తమ్ముడు’ సహజంగా, నిర్దిష్టంగా ఉంది.
- source_word: νεκρὸς ἦν
  choice: చనిపోయినవాడిగా ఉండి
  rationale: మూలంలోని మరణం–జీవం వ్యతిరేకతను యథాతథంగా నిలుపుతూ, ఉపమానార్థాన్ని పాఠకుడే సందర్భం నుంచి గ్రహించేలా చేస్తుంది.
- source_word: ἔζησεν
  choice: మళ్లీ బ్రతికాడు
  rationale: మూలంలో క్రియ అక్షరార్థంగా ‘బ్రతికాడు’; ముందున్న ‘చనిపోయినవాడు’ అనే వ్యతిరేకత పునర్జీవన భావాన్ని సూచించడంతో తెలుగులో ‘మళ్లీ’ సహజంగా ఉంటుంది.
- source_word: ἀπολωλὼς
  choice: తప్పిపోయినవాడిగా
  rationale: పరిపూర్ణ కృదంతం సూచించే ‘తప్పిపోయిన స్థితి’ని తెలియజేస్తుంది; ‘నశించిన’ అనే అతిబలమైన అర్థాన్ని రుద్దదు.
- source_word: εὑρέθη
  choice: దొరికాడు
  rationale: కర్తరి కాని భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘కనుగొనబడ్డాడు’ కంటే సాధారణ పాఠకులకు సులభంగా ఉంటుంది.
theological_decisions:
- issue: ἔζησενను శారీరక పునరుత్థానంగా లేక పునరుద్ధరణకు రూపకంగా స్పష్టం చేయాలా
  choice: మళ్లీ బ్రతికాడు
  alternative: తిరిగి జీవించాడు / జీవం పొందాడు
  rationale: మరణం–జీవం అనే మూల రూపకాన్ని నిలుపుతుంది; ఇది కేవలం శారీరక పునరుత్థానమని గానీ, రూపకమని గానీ అనువాదంలోనే నిర్ణయించకుండా కథా సందర్భంలోని ఉద్వేగాన్ని కాపాడుతుంది.
- issue: ἔδειలోని ఆవశ్యకతను ‘తగినది’గా మృదువు చేయాలా
  choice: అవసరమే
  alternative: తగినదే
  rationale: ἔδει యొక్క బలమైన ఆవశ్యకతను ప్రధాన పాఠ్యంలో నిలుపుతూ, సందర్భోచితత అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఇస్తుంది.
- issue: ὁ ἀδελφός σου οὗτοςలో బంధుత్వాన్ని సాధారణ ‘సోదరుడు’గా ఉంచాలా
  choice: నీ ఈ తమ్ముడు
  alternative: నీ ఈ సోదరుడు
  rationale: కథలో సంభోదించబడుతున్నవాడు పెద్ద కుమారుడు, తిరిగివచ్చినవాడు అతని తమ్ముడు. తెలుగు బంధుత్వ వాడుకలో ఈ నిర్దిష్టత సహజమైనది; తండ్రి బంధాన్ని నొక్కిచెప్పడమూ నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘వేడుక చేసుకోవడం—సంతోషించడం’ అనే ద్వంద్వ ఆనందవ్యక్తీకరణను, అలాగే ‘చనిపోయి—బ్రతికాడు; తప్పిపోయి—దొరికాడు’ అనే సమాంతర నిర్మాణాన్ని నిలిపింది. ప్రధాన పాఠ్యంలో ఉన్న ప్రతి పాదసూచిక గుర్తు [a], [b], [c] సంబంధిత స్థానంలో ఉంచబడింది.
