id: LUK.15.25
reference: Luke 15:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἦν δὲ ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος ἐν ἀγρῷ· καὶ ὡς ἐρχόμενος ἤγγισεν τῇ οἰκίᾳ, ἤκουσεν συμφωνίας καὶ χορῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/025.yaml
  text: His older son was in the field; and as he came and drew near to the house[a], he heard music and dancing,
translation:
  language: te
  text: అతని పెద్ద కుమారుడు పొలంలో ఉన్నాడు; అతడు వస్తూ ఇంటికి దగ్గరైనప్పుడు, సంగీతాన్నీ నాట్య సందడినీ విన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాద్య సంగీతం మరియు నర్తకుల బృందాలు.” గ్రీకు పదాలు మరింత నిర్దిష్టంగా వాద్య సంగీతాన్ని, నాట్యం చేసే బృందాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ
  choice: ఉన్నాడు
  rationale: δέ కథనంలో దృశ్యమార్పును సూచిస్తుంది; తెలుగులో ప్రత్యేక సంధానపదం చేర్చకుండానే సహజమైన కథన ప్రవాహంలో ఆ భావం వ్యక్తమవుతుంది.
- source_word: ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος
  choice: అతని పెద్ద కుమారుడు
  rationale: πρεσβύτερος తులనాత్మకంగా చిన్న కుమారునికంటే పెద్దవాడని సూచిస్తుంది; తప్పనిసరిగా అందరిలో పెద్దవాడనే అతిశయార్థం కాదు. ఇద్దరు కుమారుల సందర్భంలో ‘పెద్ద కుమారుడు’ సహజమైన తెలుగు.
- source_word: ἐν ἀγρῷ
  choice: పొలంలో
  rationale: ἀγρός ఇక్కడ పొలం లేదా వ్యవసాయ భూమిని సూచిస్తుంది; ‘పొలంలో’ సూటిగా, సహజంగా ఉంది.
- source_word: ὡς ἐρχόμενος
  choice: తిరిగి వస్తూ
  rationale: ఇంటి వైపు సాగుతున్న నిరంతర కదలికను సహజ తెలుగులో తెలియజేస్తుంది. ‘తిరిగి’ అనేది అతడు పొలం నుండి ఇంటివైపు వస్తున్న సందర్భం ద్వారా స్పష్టమయ్యే భావం.
- source_word: ἤγγισεν τῇ οἰκίᾳ
  choice: ఇంటికి సమీపించినప్పుడు
  rationale: ἐγγίζω అంటే దగ్గరకు రావడం లేదా సమీపించడం; దత్తివాచకమైన τῇ οἰκίᾳను ‘ఇంటికి’గా సహజంగా వ్యక్తం చేసింది.
- source_word: ἤκουσεν
  choice: వినిపించాయి
  rationale: గ్రీకులో ‘అతడు విన్నాడు’ అని ఉన్నప్పటికీ, సంగీతం మరియు నాట్యం ఇంటి నుండి వినబడుతున్న దృశ్యాన్ని తెలుగులో ‘వినిపించాయి’ అని సహజంగా వ్యక్తం చేయవచ్చు.
- source_word: συμφωνίας
  choice: సంగీతం
  rationale: సంగీత ధ్వనిని, ప్రత్యేకంగా వాద్య సంగీతాన్ని కూడా సూచించగల పదం; ‘సంగీతం’ సందర్భానికి స్పష్టమైన, అనాకాలికతలేని ఎంపిక.
- source_word: χορῶν
  choice: నాట్యం
  rationale: χορός నాట్యాన్ని లేదా నర్తకుల బృందాన్ని సూచించవచ్చు. సంగీతంతో జతగా ఇక్కడ ‘నాట్యం’ సహజంగా ఉంది; పదంలోని ప్రత్యామ్నాయ వ్యక్తి/బృందార్థాన్ని పాదసూచికలో నిలిపాం.
