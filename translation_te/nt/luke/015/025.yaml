revisions:
- from: అతని పెద్ద కుమారుడు పొలంలో ఉన్నాడు. అతడు తిరిగి వస్తూ ఇంటికి సమీపించినప్పుడు, సంగీతం, నాట్యం వినిపించాయి.[a]
  to: అతని పెద్ద కుమారుడు పొలంలో ఉన్నాడు; అతడు వస్తూ ఇంటికి దగ్గరైనప్పుడు, సంగీతాన్నీ నాట్య సందడినీ విన్నాడు.[a]
  rationale: The revision removes the unsupported ‘returning’ nuance, restores the older son as the one who heard, and uses idiomatic Telugu for the audible aspect of dancing. The footnote continues to preserve the source terms’ possible specific references without presenting either as certain.
