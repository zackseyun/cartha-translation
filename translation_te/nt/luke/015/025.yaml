translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదమైన కథన శైలిలో అనువదించబడింది. గ్రీకు వాక్యంలోని కథన మార్పును తెలుగులో అనవసరమైన ‘ఇప్పుడు’ లేదా బలమైన విరోధ సూచకం లేకుండా వ్యక్తం చేశాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో వాక్యాంతంలో ఉంచబడింది.
