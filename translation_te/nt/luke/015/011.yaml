translation:
  language: te
  text: 'అప్పుడు ఆయన ఇలా చెప్పారు[a]: “ఒక మనిషికి ఇద్దరు కుమారులు ఉండేవారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆయన ఇలా చెప్పారు.” గ్రీకు δέ ఇక్కడ స్వల్పమైన కొనసాగింపు లేదా మార్పును సూచిస్తుంది; దాన్ని తెలుగులో ప్రత్యేక పదంతో చూపకుండా కూడా అనువదించవచ్చు.
    reason: discourse_alternative
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: ఆ తర్వాత ఆయన ఇలా చెప్పాడు
  rationale: δέ ఇక్కడ వ్యతిరేకతను కాక, ప్రసంగంలో కొనసాగింపు లేదా కొత్త దశకు మార్పును సూచిస్తుంది. ‘ఆ తర్వాత’ ఆ ప్రవాహాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘ఇలా’ తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని సులభంగా పరిచయం చేస్తుంది.
- source_word: Ἄνθρωπός τις
  choice: ఒక మనిషి
  rationale: τις ఇచ్చే అనిర్దిష్ట భావాన్ని తెలుగులో ‘ఒక’ సహజంగా వ్యక్తం చేస్తుంది. ‘మనిషి’ పురుష సూచనను నిలుపుతుంది; అతడు ఇద్దరు కుమారుల తండ్రిగా కథలో కనిపిస్తాడు.
- source_word: εἶχεν
  choice: ఉండేవారు
  rationale: అసంపూర్ణ భూతకాల రూపం కథ ప్రారంభంలోని నేపథ్య పరిస్థితిని తెలుపుతుంది. తెలుగులో ‘ఉండేవారు’ సహజంగా ఆ స్థితిని వ్యక్తం చేసి, తండ్రి గురించిన గౌరవప్రద ఏకవచన వాడుకను అనుసరిస్తుంది.
- source_word: δύο υἱούς
  choice: ఇద్దరు కుమారులు
  rationale: వ్యక్తులను లెక్కించడానికి సహజమైన ‘ఇద్దరు’ను వాడి, υἱούς యొక్క పురుషలింగ కుటుంబ సంబంధాన్ని ‘కుమారులు’గా ఖచ్చితంగా నిలిపింది.
theological_decisions:
- issue: Ἄνθρωπός τις యొక్క అనిర్దిష్టమైనా కొంత వ్యక్తీకరించే భావం
  choice: ఒక మనిషి
  alternative: ఒకానొక మనిషి
  rationale: ‘ఒకానొక’ గ్రీకు τις భావాన్ని మరింత బహిరంగంగా చూపగలిగినా, ఆధునిక సాధారణ తెలుగులో కొంత సాహిత్యభరితంగా వినిపిస్తుంది. ‘ఒక మనిషి’ అనిర్దిష్ట పరిచయాన్ని సహజంగా నిలుపుతూ అదనపు ప్రతీకాత్మక అర్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఉండేవారు’ అనే రూపం తెలుగు గౌరవ ఏకవచనానికి అనుగుణంగా ఉంది; మూలంలోని సంఖ్య లేదా అర్థాన్ని మార్చదు.
