source:
  edition: SBLGNT
  text: ὅτε δὲ ὁ υἱός σου οὗτος ὁ καταφαγών σου τὸν βίον ⸀μετὰ πορνῶν ἦλθεν, ἔθυσας αὐτῷ τὸν ⸂σιτευτὸν μόσχον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/030.yaml
  text: But when this son of yours came[a], the one who devoured your livelihood with prostitutes, you slaughtered the fattened calf for him.
translation:
  language: te
  text: కాని వేశ్యలతో కలిసి నీ ఆస్తిని మింగేసిన నీ ఈ కుమారుడు వచ్చినప్పుడు, అతని కోసం కొవ్వించిన దూడను వధించావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీ జీవనాధారాన్ని తినివేసిన’ అని కూడా అనువదించవచ్చు. గ్రీకు క్రియ అక్షరార్థంగా ‘మింగివేయడం’ అనే బలమైన భావాన్ని ఇస్తుంది; నామవాచకం జీవనాధారం, ఆస్తి లేదా సంపదను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: కాని ... వచ్చినప్పుడు
  rationale: δέ లోని స్వల్ప వ్యతిరేక భావాన్ని, ὅτε లోని కాలసూచనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὁ υἱός σου οὗτος
  choice: నీ ఈ కుమారుడు
  rationale: οὗτος ఇచ్చే చూపుడు భావాన్నీ, అన్న అని అనకుండా పెద్ద కుమారుడు చూపే భావదూరాన్నీ వ్యక్తం చేస్తుంది.
- source_word: ὁ καταφαγών
  choice: మింగేసిన
  rationale: κατεσθίω లోని ‘తినివేయడం/మింగివేయడం’ అనే తీవ్ర, సజీవ రూపకాన్ని నిలుపుతుంది; ‘వృథా చేసిన’ అనే వివరణాత్మక అర్థాన్ని నేరుగా చేర్చదు.
- source_word: σου τὸν βίον
  choice: నీ ఆస్తిని
  rationale: ఈ సందర్భంలో βίος జీవితం కన్నా జీవనాధారమైన సంపద లేదా ఆస్తిని సూచిస్తుంది; ‘ఆస్తి’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: μετὰ πορνῶν
  choice: వేశ్యలతో కలిసి
  rationale: పెద్ద కుమారుడు చేసిన నేరుగా ఉన్న ఆరోపణను మృదువుపరచకుండా, ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: ἦλθεν
  choice: వచ్చినప్పుడు
  rationale: మూలంలోని సాధారణ ‘వచ్చాడు’ అనే భావాన్నే ఉంచి, సందర్భం సూచించే ‘తిరిగి వచ్చాడు’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: ἔθυσας
  choice: వధించావు
  rationale: విందు కోసం జంతువును చంపడాన్ని ఖచ్చితంగా తెలుపుతుంది; బలి అర్పణ అనే ఆరాధనా భావాన్ని అనవసరంగా కలిగించదు.
- source_word: τὸν σιτευτὸν μόσχον
  choice: కొవ్వించిన దూడను
  rationale: ప్రత్యేక విందు కోసం మేపి కొవ్వించిన దూడ అనే అర్థాన్ని సహజంగా అందిస్తుంది.
- source_word: αὐτῷ
  choice: అతని కోసం
  rationale: దత్తివిభక్తిలోని ప్రయోజనార్థక భావాన్ని స్పష్టంగా తెలుపుతుంది.
theological_decisions:
- issue: పెద్ద కుమారుడి మాటను నిర్ధారిత వాస్తవంగా చూపాలా, అతని ఆరోపణగానే ఉంచాలా
  choice: మూలంలో ఉన్నట్లే అతని ఆరోపణను ఎలాంటి అర్హతపదాలు లేకుండా నేరుగా అనువదించడం
  alternative: ‘వేశ్యలతో కలిసి నీ ఆస్తిని మింగేశాడని చెప్పబడుతున్న’ లేదా ‘అనైతిక జీవనంలో నీ ఆస్తిని వృథా చేసిన’
  rationale: ఇది కథకుడి స్వతంత్ర నిర్ధారణ కాదు, పెద్ద కుమారుడి మాట. ‘అట’ వంటి పదం చేర్చకుండా అతని మాటను నేరుగా ఉంచడం కథనంలోని ఉద్వేగాన్నీ అనిశ్చితినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; పెద్ద కుమారుడి నిందాస్వరాన్ని ‘నీ ఈ కుమారుడు’ మరియు ‘మింగేసిన’ ద్వారా నిలిపింది. వాక్యాంతంలోని పాదసూచిక [a] ప్రధాన పాఠ్యంలో స్పష్టంగా ఉంచబడింది.
