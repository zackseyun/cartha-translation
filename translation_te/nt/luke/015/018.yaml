id: LUK.15.18
reference: Luke 15:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀναστὰς πορεύσομαι πρὸς τὸν πατέρα μου καὶ ἐρῶ αὐτῷ· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/018.yaml
  text: I will get up and go to my father[a], and I will say to him, ‘Father[b], I have sinned against heaven and before you,’
translation:
  language: te
  text: 'నేను లేచి నా తండ్రి దగ్గరికి వెళ్లి, ఆయనతో ఇలా అంటాను: ‘తండ్రీ, నేను పరలోకానికి విరోధంగా[a], నీ ఎదుట[b] పాపం చేశాను.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవునికి విరోధంగా.’ ఇక్కడ ‘పరలోకం’ దేవునిని గౌరవపూర్వకంగా పరోక్షంగా సూచించే ప్రయోగం అయి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీ దృష్టిలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: నేను లేచి
  rationale: ప్రధాన భవిష్యత్ క్రియకు ముందు జరిగే చర్యను సూచించే ఆరిస్ట్ కృదంతం. తెలుగు సహజ వాక్యనిర్మాణంలో ‘లేచి ... వెళ్లి’ అని వరుస చర్యలుగా చెప్పడం మూల భావాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: πορεύσομαι
  choice: వెళ్లి ... అంటాను
  rationale: తండ్రి వైపు వెళ్లాలనే కుమారుని సంకల్పాన్ని సూచిస్తుంది. తెలుగులో తరువాతి భవిష్యత్ క్రియతో కలిపి ‘వెళ్లి ... అంటాను’ అనడం సహజం; భవిష్యత్ సంకల్పం ప్రధాన క్రియలో వ్యక్తమవుతుంది.
- source_word: πρὸς τὸν πατέρα μου
  choice: నా తండ్రి దగ్గరికి
  rationale: πρός + ద్వితీయా విభక్తి వ్యక్తి వద్దకు సాగే గమనాన్ని సూచిస్తుంది. ‘దగ్గరికి’ అనేది లక్ష్యంగా ఉన్న వ్యక్తిని చేరడాన్ని సహజ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐρῶ αὐτῷ
  choice: ఆయనతో ఇలా అంటాను
  rationale: λέγω భవిష్యత్ రూపం మరియు పరోక్ష కర్మను ప్రతిబింబిస్తుంది. ‘ఇలా’ తరువాత వచ్చే ప్రత్యక్ష మాటలను సహజంగా పరిచయం చేస్తుంది; తండ్రికి గౌరవార్థం ‘ఆయనతో’ వాడబడింది.
- source_word: Πάτερ
  choice: తండ్రీ
  rationale: ప్రత్యక్ష సంబోధన. మూలంలో లేని స్వామ్యార్థాన్ని చేర్చకుండా, గౌరవప్రదమైన సహజ తెలుగు సంబోధనను ఇస్తుంది.
- source_word: ἥμαρτον
  choice: పాపం చేశాను
  rationale: ఆరిస్ట్ క్రియను కుమారుని ఒప్పుకోలుగా సహజ తెలుగులో వ్యక్తపరుస్తుంది; పూర్తయిన కార్యం మరియు దాని ప్రస్తుత నైతిక ప్రాధాన్యం సందర్భం ద్వారా నిలుస్తాయి.
- source_word: εἰς τὸν οὐρανὸν
  choice: పరలోకానికి విరోధంగా
  rationale: εἰς ఇక్కడ పాపం ఎవరికి విరోధంగా జరిగిందో సూచిస్తుంది. οὐρανός‌ను ‘దేవుడు’గా వ్యాఖ్యానించి మార్చకుండా, మూలంలోని గౌరవసూచక పరోక్ష ప్రయోగాన్ని ‘పరలోకం’గా నిలుపుతుంది.
- source_word: ἐνώπιόν σου
  choice: నీ ఎదుట
  rationale: ἐνώπιον + షష్ఠీ ‘ఎదుట, సమక్షంలో, దృష్టిలో’ అనే అర్థాన్ని ఇస్తుంది. ‘నీ ఎదుట’ మూలంలోని ప్రత్యేక పదబంధాన్ని నిలుపుతుంది; దానిని ‘నీకు విరోధంగా’ అని ముందరి పదబంధంతో కలిపి వేయదు.
theological_decisions:
- issue: ‘పరలోకం’ అనే పదాన్ని ప్రధాన పాఠ్యంలోనే ఉంచాలా, లేక ‘దేవుడు’ అని స్పష్టీకరించాలా
  choice: ‘నేను పరలోకానికి విరోధంగా, నీ ఎదుట పాపం చేశాను’ అని మూలంలోని ‘పరలోకం’ పదాన్ని నిలుపడం
  alternative: ‘నేను దేవునికి, నీకు విరోధంగా పాపం చేశాను’
  rationale: οὐρανός ఇక్కడ దేవుని గౌరవపూర్వకంగా పరోక్షంగా సూచించే అవకాశం ఉన్నప్పటికీ, గ్రీకు పాఠ్యం నేరుగా ‘దేవుడు’ అని చెప్పదు. అందువల్ల వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలోకి తీసుకురాకుండా మూలంలోని భావ ఉద్వేగాన్ని, అస్పష్టతను కాపాడడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. కుమారుని నిర్ణయాన్ని ‘లేచి ... వెళ్లి ... అంటాను’ అనే వరుస క్రియలతో సులభంగా వ్యక్తపరిచింది. ప్రత్యక్ష సంబోధనలో ‘తండ్రీ’, తండ్రిని సూచించేటప్పుడు ‘ఆయనతో’ వాడి మర్యాదను నిలిపింది.
