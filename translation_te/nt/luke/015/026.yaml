translation:
  language: te
  text: అతడు పనివారిలో ఒకణ్ణి తన దగ్గరకు పిలిచి, ఇవన్నీ ఏమిటో అని అడిగాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దీనికి అర్థం ఏమిటో?” గ్రీకులో, “ఈ విషయాలన్నీ ఏమై ఉండవచ్చు?” అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: తన దగ్గరికి పిలిచి
  rationale: మధ్యమ వాచకంలోని ఈ అసమాపక క్రియ, అతడు ఒకణ్ణి తనవద్దకు పిలిచిన తరువాత అడిగాడనే క్రమాన్ని సూచిస్తుంది. ‘తన దగ్గరికి పిలిచి’ ఈ భావాన్ని సహజమైన తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: παίδων
  choice: పనివారిలో
  rationale: παῖς అనే పదానికి ‘బాలుడు’ లేదా ‘సేవకుడు’ అనే అర్థాలు ఉండవచ్చు. ఇంటి వేడుక గురించి వివరించగల వ్యక్తిని పిలిచే ఈ సందర్భంలో ‘పనివాడు’ సరిపోతుంది; ‘పిల్లవాడు’ తప్పుదారి పట్టించవచ్చు.
- source_word: ἐπυνθάνετο
  choice: అడిగాడు
  rationale: ఈ అసంపూర్ణ భూతకాల క్రియ విచారించి తెలుసుకోవడాన్ని సూచిస్తుంది. తెలుగులో ‘అడిగాడు’ సహజంగా ఉంది; ఇక్కడ కొనసాగుతున్న క్రియాభావాన్ని ప్రత్యేకంగా ముందుకు తేవాల్సిన అవసరం లేదు.
- source_word: τί ἂν εἴη ταῦτα
  choice: ఇవన్నీ ఏమై ఉంటాయి?
  rationale: τί ἂν εἴη లోని సంభావ్యతను ‘ఏమై ఉంటాయి’ నిలుపుతుంది; ταῦτα అనే బహువచనాన్ని ‘ఇవన్నీ’ ప్రతిబింబిస్తుంది. ఇది ‘దీని అర్థం ఏమిటి?’ అనే వ్యాఖ్యానాత్మక రూపం కంటే మూలపాఠానికి దగ్గరగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘పనివాడు’ ఇంటి సందర్భానికి తగిన సాధారణ పదం; మూలంలోని బహువచనాన్ని, సంభావ్యతను ప్రధాన పాఠంలో నిలిపి, భావానువాద ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
