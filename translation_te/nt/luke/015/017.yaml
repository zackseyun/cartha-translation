translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘కూలికి పనిచేసే వారు’ అనే రూపం μίσθιοι ని ఇంటి బానిసలతో కలపకుండా స్పష్టం చేస్తుంది; ‘తేరుకొని’ అనే సహజ నుడికారంతో మూలంలోని భావాన్ని ఇచ్చి, దాని అక్షరార్థ పదచిత్రాన్ని పాదసూచికలో భద్రపరిచాం.
