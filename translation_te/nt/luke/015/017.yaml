  to: అయితే అతడు తేరుకొని[a], ‘నా తండ్రి దగ్గర కూలికి పనిచేసే ఎంతమందికి తినగా మిగిలేంత రొట్టె ఉందో! నేనేమో ఇక్కడ ఆకలితో నశిస్తున్నాను[c]!’ అన్నాడు.
