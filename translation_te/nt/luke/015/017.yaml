  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰς ἑαυτὸν δὲ ἐλθὼν ⸀ἔφη· Πόσοι μίσθιοι τοῦ πατρός μου ⸀περισσεύονται ἄρτων, ἐγὼ δὲ ⸂λιμῷ ὧδε⸃ ἀπόλλυμαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/017.yaml
  text: But when he came to himself[a], he said, ‘How many of my father’s hired workers have more than enough bread[c][b], but here I am perishing from hunger!’
translation:
  language: te
  text: అయితే అతడు తేరుకొని[a], ‘నా తండ్రి దగ్గర కూలికి పనిచేసే ఎంతమందికి తినగా మిగిలేంత రొట్టె ఉందో! నేనేమో ఇక్కడ ఆకలితో నశిస్తున్నాను[c]!’ అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తెలివి తెచ్చుకొని.’ గ్రీకులో అక్షరార్థంగా ‘తనలోనికి తాను వచ్చి’ అని ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ఆకలితో చనిపోతున్నాను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἑαυτὸν ... ἐλθὼν
  choice: తేరుకొని
  rationale: ఈ గ్రీకు నుడికారం స్పష్టమైన స్వీయ అవగాహనకు లేదా సుబుద్ధికి తిరిగి రావడాన్ని సూచిస్తుంది. తెలుగులో ‘తేరుకొని’ సహజంగా ఈ భావాన్ని తెలియజేస్తుంది; గ్రీకు పదచిత్రాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἔφη
  choice: అన్నాడు
  rationale: కథనంలోని భూతకాల క్రియను తెలుగులో సహజమైన సాధారణ భూతకాలంగా అనువదించాం.
- source_word: μίσθιοι
  choice: కూలికి పనిచేసే వారు
  rationale: ఇది బానిసలను కాకుండా వేతనం కోసం పనిచేసే పనివారిని సూచిస్తుంది.
- source_word: περισσεύονται ἄρτων
  choice: తినగా మిగిలేంత రొట్టె ఉంది
  rationale: περισσεύονται సమృద్ధి లేదా మిగులును సూచిస్తుంది. ఈ తెలుగు రూపం అవసరానికి మించిన రొట్టె ఉన్నదనే భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἄρτων
  choice: రొట్టె
  rationale: గ్రీకులో ఉన్న నిర్దిష్టమైన ‘రొట్టె’ అనే పదాన్ని సాధారణీకరించి ‘ఆహారం’గా మార్చలేదు.
- source_word: λιμῷ
  choice: ఆకలితో
  rationale: ఈ సందర్భంలో λιμός కరువు అనే విస్తృత పరిస్థితికన్నా ఆకలి లేదా పస్తును సూచిస్తుంది.
- source_word: ὧδε
  choice: ఇక్కడ
  rationale: తండ్రి ఇంటి పనివారి స్థితికి విరుద్ధంగా కుమారుని ప్రస్తుత దుస్థితిని ఈ స్థలవాచకం స్పష్టం చేస్తుంది.
- source_word: ἀπόλλυμαι
  choice: నశిస్తున్నాను
  rationale: వర్తమాన రూపం కొనసాగుతున్న నాశనకర స్థితిని సూచిస్తుంది. ‘నశిస్తున్నాను’ తీవ్రతను నిలుపుతూ కేవలం శారీరక మరణానికే భావాన్ని పరిమితం చేయదు.
