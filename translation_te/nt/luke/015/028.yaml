id: LUK.15.28
reference: Luke 15:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὠργίσθη δὲ καὶ οὐκ ἤθελεν εἰσελθεῖν. ὁ ⸀δὲ πατὴρ αὐτοῦ ἐξελθὼν παρεκάλει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/028.yaml
  text: But he became angry and was unwilling to go in[b][a]. So his father came out and pleaded with him.
translation:
  language: te
  text: కాని అతనికి కోపం వచ్చింది; లోపలికి వెళ్లడానికి అతడు ఇష్టపడలేదు.[a] అప్పుడు అతని తండ్రి బయటికి వచ్చి, అతన్ని వేడుకుంటూనే ఉన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘లోపలికి వెళ్లాలని అతడు కోరుకోలేదు’; సందర్భానుసారంగా ‘లోపలికి వెళ్లడానికి నిరాకరించాడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘వేడుకున్నాడు’ అని అనువదించిన క్రియకు ‘నచ్చజెప్పాడు’ లేదా ‘బతిమాలాడు’ అనే అర్థాలు కూడా ఉండవచ్చు. గ్రీకు అపూర్ణ భూతకాల రూపం అతడు విజ్ఞప్తి చేస్తూనే ఉన్నాడనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠργίσθη
  choice: అతనికి కోపం వచ్చింది
  rationale: ఆరిస్ట్ రూపం ఇక్కడ కోపం మొదలైన భావాన్ని సూచిస్తుంది. ఈ ప్రయోగం కేవలం ‘కోపంగా ఉన్నాడు’ అనడం కంటే ఆరంభ భావాన్ని సహజంగా తెలియజేస్తుంది; ‘తీవ్ర ఆగ్రహానికి గురయ్యాడు’ అనే అతిశయాన్ని నివారిస్తుంది.
- source_word: δὲ
  choice: కాని
  rationale: ముందటి సంబరానికి పెద్ద కుమారుని ప్రతిస్పందనను స్వల్ప వ్యతిరేకతతో అనుసంధానిస్తుంది.
- source_word: οὐκ ἤθελεν εἰσελθεῖν
  choice: లోపలికి వెళ్లడానికి అతడు ఇష్టపడలేదు
  rationale: θέλω + క్రియార్థక రూపం సంకల్పం లేదా ఇష్టాన్ని సూచిస్తుంది. ‘నిరాకరించాడు’ అని బాహ్య చర్యను మరింత బలంగా చెప్పకుండా, మూలంలోని ఇష్టరాహిత్యాన్ని నిలుపుతుంది.
- source_word: ὁ δὲ πατὴρ αὐτοῦ
  choice: అప్పుడు అతని తండ్రి
  rationale: రెండవ δέ కుమారుని వైఖరికి ప్రతిస్పందనగా తండ్రి చేసిన తదుపరి చర్యను కథనంలో సహజంగా ముందుకు తీసుకెళ్తుంది.
- source_word: ἐξελθὼν
  choice: బయటికి వచ్చి
  rationale: ఇంటి లోపలి నుంచి బయటికి జరిగిన కదలికను స్పష్టంగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: παρεκάλει
  choice: వేడుకుంటూనే ఉన్నాడు
  rationale: παρακαλέω యొక్క అపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పునరావృతమైన విజ్ఞప్తిని సూచించగలదు. ఈ అనువాదం ఆ నిరంతరతను, విజ్ఞప్తిలోని ఆతురతను రెండింటినీ తెలియజేస్తుంది.
- source_word: αὐτόν
  choice: అతన్ని
  rationale: ఈ సర్వనామం పెద్ద కుమారునినే సూచిస్తుంది.
theological_decisions:
- issue: ఉపమానంలో తండ్రి విజ్ఞప్తి స్వరం
  choice: ‘అతన్ని వేడుకుంటూనే ఉన్నాడు’ అని అనువదించడం
  alternative: ‘అతనికి నచ్చజెప్పుతూనే ఉన్నాడు’ లేదా ‘అతన్ని బతిమాలాడు’
  rationale: ఈ ఎంపిక తండ్రి స్వయంగా బయటికి వచ్చి చేసిన దయగల, హృదయపూర్వక, కొనసాగుతున్న విజ్ఞప్తిని నిలుపుతుంది; అయితే దానికి అదనపు సిద్ధాంతార్థాన్ని జోడించదు. ‘బతిమాలాడు’ కొంత అతిశయంగా ఉండవచ్చు; ‘నచ్చజెప్పాడు’ విజ్ఞప్తి తీవ్రతను తగ్గించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ‘ఇష్టపడలేదు’ మూలంలోని సంకల్ప సంబంధమైన సందిగ్ధతను కాపాడుతుంది; ‘వేడుకుంటూనే ఉన్నాడు’ అపూర్ణ భూతకాలంలోని కొనసాగింపు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
