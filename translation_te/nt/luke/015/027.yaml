id: LUK.15.27
reference: Luke 15:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ ὅτι Ὁ ἀδελφός σου ἥκει, καὶ ἔθυσεν ὁ πατήρ σου τὸν μόσχον τὸν σιτευτόν, ὅτι ὑγιαίνοντα αὐτὸν ἀπέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/027.yaml
  text: He said to him[a], “Your brother has come, and your father slaughtered the fattened calf, because he received him back safe and sound.”
translation:
  language: te
  text: అతడు అతనితో, “నీ తమ్ముడు తిరిగి వచ్చాడు; అతనిని క్షేమంగా తిరిగి పొందినందుకు నీ తండ్రి బాగా కొవ్వించిన దూడను వధించాడు” అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘క్షేమంగా’ అనే మాటకు మూల గ్రీకు పదం ‘ఆరోగ్యంగా’ అని కూడా అర్థం ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥκει
  choice: తిరిగి వచ్చాడు
  rationale: ἥκω ఇక్కడ వచ్చి ఇప్పుడు ఉన్నాడనే భావాన్ని ఇస్తుంది. సందర్భంలోని ఇంటికి తిరిగి రావడాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘తిరిగి వచ్చాడు’ అని అనువదించాం.
- source_word: ἔθυσεν
  choice: వధించాడు
  rationale: θύω భోజనార్థం జంతువును వధించడాన్ని సూచిస్తుంది. ‘బలి అర్పించాడు’ అనే ఆరాధనా సంబంధిత భావాన్ని అనవసరంగా రాకుండా ‘వధించాడు’ అని ఇచ్చాం.
- source_word: μόσχον τὸν σιτευτόν
  choice: కొవ్విన దూడను
  rationale: వేడుక కోసం ప్రత్యేకంగా మేపి కొవ్వించిన దూడ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో ఇది తెలియజేస్తుంది.
- source_word: ὑγιαίνοντα
  choice: క్షేమంగా
  rationale: ఈ కృదంతానికి ‘ఆరోగ్యంగా’ లేదా విస్తృతంగా ‘క్షేమంగా’ అనే అర్థం ఉండవచ్చు. తిరిగి వచ్చిన వ్యక్తి సురక్షితంగా, బాగుండడాన్ని సందర్భానుసారంగా ‘క్షేమంగా’ తెలియజేస్తుంది.
- source_word: ἀπέλαβεν
  choice: తిరిగి దొరికాడు
  rationale: ἀπολαμβάνω ఇక్కడ ఒకరిని తిరిగి పొందడం అనే పునరుద్ధరణ భావాన్ని కలిగి ఉంది. తండ్రి దృష్టికోణాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘తిరిగి దొరికాడు’ అని ఇచ్చాం.
- source_word: ὁ δὲ εἶπεν αὐτῷ ὅτι
  choice: అతడు అతనితో … అన్నాడు
  rationale: δέ ఇక్కడ స్వల్ప అనుసంధానకం; ప్రత్యేకంగా ‘కాని’ అని అనువదించాల్సిన వ్యతిరేకత లేదు. ὅτι ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది కాబట్టి తెలుగు ఉద్ధరణ నిర్మాణాన్ని వాడాం.
- source_word: ὁ ἀδελφός σου
  choice: నీ తమ్ముడు
  rationale: ἀδελφός స్వతహాగా అన్న లేదా తమ్ముడు రెండింటినీ సూచించగలదు; అయితే కథన సందర్భంలో మాట్లాడుతున్న పెద్ద కుమారునికి వచ్చినవాడు చిన్న కుమారుడు కాబట్టి ‘తమ్ముడు’ సహజంగా, సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే కథన శైలిని వాడాం. గ్రీకు వాక్యంలోని తండ్రే తిరిగి పొందినవాడు అనే నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేశాం; [a] సూచికను సంబంధిత వాక్యాంతంలో ఉంచాం.
