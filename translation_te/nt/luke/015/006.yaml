id: LUK.15.6
reference: Luke 15:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὸν οἶκον συγκαλεῖ τοὺς φίλους καὶ τοὺς γείτονας, λέγων αὐτοῖς· Συγχάρητέ μοι ὅτι εὗρον τὸ πρόβατόν μου τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/006.yaml
  text: And when he comes into the house[a], he calls together his friends and neighbors, saying to them, ‘Rejoice with me[c][b], because I have found my sheep that was lost.’
translation:
  language: te
  text: 'అతడు ఇంట్లోకి వచ్చినప్పుడు[a], తన స్నేహితులను, పొరుగువారిని ఒకచోటికి పిలిచి, వారితో ఇలా అంటాడు: “నాతో కలిసి సంతోషించండి[b], ఎందుకంటే తప్పిపోయిన నా గొర్రెను[c] నేను కనుగొన్నాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత నుడికారంగా, “ఇంటికి వచ్చినప్పుడు.” గ్రీకు అక్షరార్థం “ఇంట్లోకి వచ్చినప్పుడు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నా సంతోషంలో పాలుపంచుకోండి.” గ్రీకు ఆజ్ఞకు ఎవరితోనైనా కలిసి సంతోషించడం అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకు పదక్రమాన్ని మరింత అక్షరార్థంగా అనువదిస్తే, “నా గొర్రెను—తప్పిపోయిన దానిని—నేను కనుగొన్నాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν εἰς τὸν οἶκον
  choice: అతడు ఇంట్లోకి వచ్చినప్పుడు
  rationale: కాలార్థకంగా పనిచేస్తున్న భూతకాల కృదంతాన్ని సహజమైన తెలుగు ఉపవాక్యంగా అనువదిస్తూ, εἰς వల్ల వ్యక్తమయ్యే ‘లోపలికి’ అనే గమనాన్ని నిలుపుతుంది.
- source_word: συγκαλεῖ
  choice: ఒకచోటికి పిలిచి
  rationale: ‘కలిసి రావడానికి పిలుచుట’ అనే క్రియార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘సమావేశపరచి’ కంటే ఈ ఆనంద సందర్భానికి తగినది.
- source_word: τοὺς φίλους καὶ τοὺς γείτονας
  choice: తన స్నేహితులను, పొరుగువారిని
  rationale: రెండు సామాజిక వర్గాలనూ నేరుగా, సాధారణ తెలుగులో సూచిస్తుంది. సందర్భానుసారం తెలుగు వాక్యంలో ‘తన’ చేర్చడం సహజం.
- source_word: λέγων αὐτοῖς
  choice: వారితో … అంటాడు
  rationale: గ్రీకు వర్తమాన కృదంతాన్ని ప్రధాన క్రియతో సహజంగా కలిపి, ప్రత్యక్ష సంభాషణను స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: Συγχάρητέ μοι
  choice: నాతో కలిసి సంతోషించండి
  rationale: συγχαίρω లోని ‘ఎవరితోనైనా కలిసి ఆనందించుట’ అనే భావాన్ని, ఆజ్ఞార్థక బహువచనంతో సహా, నేరుగా నిలుపుతుంది.
- source_word: ὅτι
  choice: కాబట్టి
  rationale: ఆహ్వానానికి కారణాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది. ప్రత్యక్ష మాటలో కారణ వాక్యం ముందుగా రావడం తెలుగు వాక్యనిర్మాణానికి అనుకూలం.
- source_word: εὗρον
  choice: నేను కనుగొన్నాను
  rationale: కర్త చేసిన విజయవంతమైన వెదకడం అనే క్రియాశీల భావాన్ని నిలుపుతుంది; పూర్తయిన చర్యను సహజమైన తెలుగు భూతకాలంతో వ్యక్తం చేస్తుంది.
- source_word: τὸ πρόβατόν μου τὸ ἀπολωλός
  choice: తప్పిపోయిన నా గొర్రెను
  rationale: తెలుగులో సహజమైన విశేషణ నిర్మాణాన్ని వాడుతూ, గొర్రెకు చెందిన తప్పిపోయిన స్థితిని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: తిరిగి దొరకడం అనే ఉపమాన చిత్రణ
  choice: ‘తప్పిపోయిన నా గొర్రె’ అనే స్పష్టమైన ఉపమాన చిత్రాన్నే ఉంచడం
  alternative: ఈ వాక్యంలోనే గొర్రెను ‘పాపి’ లేదా దొరకడాన్ని ‘రక్షణ’ అని వివరణాత్మకంగా మార్చడం
  rationale: ఈ వచనం ఉపమానంలోని దృశ్యాన్ని చెబుతుంది; దాని ఆధ్యాత్మిక అన్వయాన్ని పరిసర వచనాలు అందిస్తాయి. కాబట్టి అనువాదం ఆ చిత్రాన్ని ముందుగానే సిద్ధాంత వివరణగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా ఉండి, ఉపమానానికి తగిన గౌరవప్రదమైన కథన శైలిని పాటిస్తుంది. తెలుగు సహజ పదక్రమం కోసం కారణ వాక్యాన్ని ఆజ్ఞకు ముందు ఉంచింది; మూలంలోని అర్థ సంబంధాన్ని మార్చలేదు.
