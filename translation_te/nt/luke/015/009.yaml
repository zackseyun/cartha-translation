  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. ‘స్నేహితురాళ్లు’ ద్వారా మూలంలోని స్త్రీలింగ సూచనను నిలిపి, ‘పొరుగువారు’ వద్ద మూలం అనుమతించే సాధారణతను కాపాడాం.
