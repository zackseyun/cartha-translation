id: LUK.15.9
reference: Luke 15:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εὑροῦσα ⸀συγκαλεῖ τὰς φίλας ⸀καὶ γείτονας λέγουσα· Συγχάρητέ μοι ὅτι εὗρον τὴν δραχμὴν ἣν ἀπώλεσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/009.yaml
  text: And when she has found it[a], she calls together her women friends and neighbors, saying, ‘Rejoice with me, because I found the drachma that I had lost.’
translation:
  language: te
  text: 'ఆమె ఆ నాణెాన్ని కనుగొన్నప్పుడు, తన స్నేహితురాళ్లను, పొరుగువారిని ఒకచోటికి పిలిచి ఇలా అంటుంది: ‘నేను పోగొట్టుకున్న ద్రాక్మా నాణెాన్ని[a] కనుగొన్నాను కాబట్టి, నాతో కలిసి సంతోషించండి.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ద్రాక్మా ఒక గ్రీకు వెండి నాణెం; అనేక సందర్భాల్లో అది ఒక కూలీ ఒక రోజు వేతనానికి దాదాపు సమానంగా ఉండేది.
    reason: cultural_note
lexical_decisions:
- source_word: εὑροῦσα
  choice: ఆ నాణెం దొరికినప్పుడు
  rationale: స్త్రీలింగ ఏకవచన భూతకాల కృదంతాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా అనువదించాం; సందర్భం నుంచి ‘ఆ నాణెం’ను స్పష్టంగా చేర్చాం.
- source_word: συγκαλεῖ
  choice: ఒకచోటికి పిలిచి
  rationale: తన దగ్గరకు సమకూరేలా పిలవడం అనే సంయుక్త క్రియ భావాన్ని సహజంగా తెలుపుతుంది; తరువాతి ‘అంటుంది’తో కలిసి గ్రీకు వర్తమానకాల కథన సజీవతను నిలుపుతుంది.
- source_word: φίλας
  choice: స్నేహితురాళ్లను
  rationale: గ్రీకులోని స్త్రీలింగ బహువచనాన్ని తెలుగులో స్పష్టంగా నిలిపాం.
- source_word: γείτονας
  choice: పొరుగువారిని
  rationale: పొరుగువారిని సూచించే సహజమైన సమావేషక తెలుగు పదం; సందర్భంలోని స్త్రీల సామాజిక వలయాన్ని అనవసరంగా అతివ్యాఖ్యానించదు.
- source_word: λέγουσα
  choice: అంటుంది
  rationale: ప్రత్యక్ష సంభాషణను పరిచయం చేస్తూ, గ్రీకు కథనంలోని సజీవ వర్తమాన భావాన్ని సహజ తెలుగులో ఇస్తుంది.
- source_word: Συγχάρητέ μοι
  choice: నాతో కలిసి సంతోషించండి
  rationale: తన ఆనందంలో ఇతరులు పాలుపంచుకోవాలని కోరే బహువచన ఆజ్ఞార్థక భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: ὅτι
  choice: దొరికింది;
  rationale: ఆనందించాల్సిన కారణాన్ని ప్రత్యక్ష వాక్యంలో ముందుగా చెప్పి, తెలుగు వాక్యక్రమంలో సహజంగా ఆహ్వానంతో అనుసంధానించాం.
- source_word: εὗρον
  choice: దొరికింది
  rationale: పోయిన వస్తువు తిరిగి లభించడాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; మాట్లాడుతున్న స్త్రీకి అది దొరికిందనే భావం సందర్భంలో స్పష్టం.
- source_word: δραχμὴν
  choice: ద్రాక్మా నాణెం
  rationale: ప్రత్యేక నాణెం పేరును నిలిపి, ఆధునిక పాఠకుడికి అది నాణెమని వెంటనే స్పష్టం చేశాం.
- source_word: ἣν ἀπώλεσα
  choice: నేను పోగొట్టుకున్న
  rationale: నాణెాన్ని తానే కోల్పోయిందనే కర్తృత్వాన్ని, దొరకడానికి ముందు జరిగిన చర్యగా సహజ తెలుగు సంబంధకృదంతంతో తెలిపాం.
