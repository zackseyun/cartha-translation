  text: Ἦσαν δὲ ⸂αὐτῷ ἐγγίζοντες⸃ πάντες οἱ τελῶναι καὶ οἱ ἁμαρτωλοὶ ἀκούειν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/001.yaml
  text: All the tax collectors and sinners were drawing near to him to hear him[a].
translation:
  language: te
  text: సుంకం వసూలు చేసేవారందరూ, పాపులందరూ ఆయనను వినడానికి ఆయన దగ్గరకు వస్తూ ఉండేవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన దగ్గరికి సమీపిస్తూ ఉండేవారు.’ గ్రీకు భాషలోని నిర్మాణం కొనసాగుతున్న లేదా పదేపదే జరిగే సమీపించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: ఉండేవారు
  rationale: Ἦσαν అనే అసంపూర్ణ భూతకాల రూపం నేపథ్యంలోని కొనసాగుతున్న పరిస్థితిని సూచిస్తుంది. δέ యొక్క స్వల్ప సంధాన భావాన్ని తెలుగులో ప్రత్యేక పదంతో బలవంతంగా చూపకుండా సహజ వాక్యప్రవాహంలో ఉంచాం.
- source_word: αὐτῷ ἐγγίζοντες
  choice: ఆయన దగ్గరికి వస్తూ
  rationale: Ἦσαν + వర్తమాన కృదంతం అనే పరిభాషాత్మక నిర్మాణం కొనసాగుతున్న లేదా పదేపదే జరుగుతున్న సమీపించడాన్ని సూచిస్తుంది; ‘వస్తూ ఉండేవారు’ దాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: πάντες
  choice: అందరూ
  rationale: ఈ పదం పేర్కొన్న సమూహాల విస్తృతిని నొక్కిచెబుతుంది.
- source_word: οἱ τελῶναι
  choice: సుంకం వసూలు చేసేవారు
  rationale: రోమా పాలనా వ్యవస్థలో పన్నులు లేదా సుంకాలు వసూలు చేసే వారిని సూచిస్తుంది; ఈ సందర్భంలో ‘సుంకం వసూలు చేసేవారు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: οἱ ἁμαρτωλοὶ
  choice: పాపులు
  rationale: సమాజంలో పాపులుగా లేదా నీతిహీనులుగా పరిగణించబడిన వర్గాన్ని వివరణ జోడించకుండా మూలంలోని నామవాచక రూపంలోనే ఉంచుతుంది.
- source_word: ἀκούειν αὐτοῦ
  choice: ఆయన మాట వినడానికి
  rationale: అనంతక్రియ ఉద్దేశాన్ని తెలియజేస్తుంది. కేవలం శబ్దం వినడం కాక ఆయన చెప్పేది వినడానికి వచ్చారనే సందర్భార్థాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ‘సుంకం వసూలు చేసేవారు, పాపులు’ అనే సామాజిక-మతపరమైన జంట వర్గాల భావం
  choice: రెండు వర్గాలనూ వివరణాత్మక విస్తరణ లేకుండా యథాతథంగా ఉంచాం.
  alternative: ‘సుంకం వసూలు చేసేవారు, సమాజం వెలివేసిన ఇతరులు’ లేదా ‘సుంకం వసూలు చేసేవారు, పేరుమోసిన పాపులు’
  rationale: మూలపాఠం రెండు గుర్తించదగిన వర్గాలను మాత్రమే పేర్కొంటుంది. మరింత వివరణ చేర్చడం మూలంలో లేని సామాజిక లేదా నైతిక వ్యాఖ్యానాన్ని దిగుమతి చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. కొనసాగుతున్న గత చర్యను ‘వస్తూ ఉండేవారు’తో వ్యక్తపరిచాం; మూలంలోని వర్గపదాలకు అనవసర వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
