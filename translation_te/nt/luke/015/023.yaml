base_translation:
  language: en
  yaml_path: translation/nt/luke/015/023.yaml
  text: And bring the fattened calf[a], slaughter it, and let us eat and celebrate,
translation:
  language: te
  text: కొవ్వబెట్టిన దూడను తీసుకురండి; దాన్ని వధించండి[a]. మనం తిని సంబరపడుదాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దాన్ని బలిగా అర్పించండి’; గ్రీకు క్రియ జంతువును వధించడాన్ని సూచిస్తుంది; కొన్ని సందర్భాల్లో దానికి బలి సంబంధిత భావఛాయ కూడా ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρετε
  choice: తీసుకురండి
  rationale: బహువచన ఆజ్ఞారూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘ఇక్కడికి’ లేదా ‘బయటికి’ అనే భావాలను మూలంలో లేనందున చేర్చలేదు.
- source_word: μόσχον τὸν σιτευτόν
  choice: కొవ్వబెట్టిన దూడను
  rationale: μόσχος అనే చిన్న పశువు భావాన్నీ, ప్రత్యేక విందుకోసం మేపి కొవ్వబెట్టినదనే σιτευτός భావాన్నీ స్పష్టంగా అందిస్తుంది.
- source_word: θύσατε
  choice: దాన్ని వధించండి
  rationale: విందు కోసం జంతువును చంపే సందర్భానికి ‘వధించండి’ సరిపోతుంది; మూలపదంలో ఉండగల బలి సంబంధిత ఛాయను పాదటిప్పణిలో నిలిపింది.
- source_word: φαγόντες
  choice: మనం తిని
  rationale: గ్రీకు భూతకాల కృదంతాన్ని తెలుగు సహజ వాక్యనిర్మాణంలో ‘తిని’గా అందించి, తరువాతి ఆహ్వానార్థక క్రియతో అనుసంధానించింది.
- source_word: εὐφρανθῶμεν
  choice: సంబరపడుదాం
  rationale: మొదటి పురుష బహువచన ఆహ్వానార్థక భావాన్నీ, విందు సందర్భంలోని ఆనందోత్సవాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ ... καὶ
  choice: ; ... .
  rationale: గ్రీకులోని వరుస అనుసంధానాన్ని తెలుగులో సహజమైన విరామచిహ్నాలు, వరుస క్రియల ద్వారా అందించింది; పదేపదే ‘మరియు’ వాడటం అసహజంగా ఉంటుంది.
theological_decisions:
- issue: θύσατε పదంలోని సంభావ్య బలి భావఛాయ
  choice: ప్రధాన పాఠ్యంలో ‘వధించండి’
  alternative: ‘బలిగా అర్పించండి’
  rationale: కథా సందర్భంలో ఇంటి విందు కోసం జంతువును సిద్ధం చేయడమే ప్రధాన భావం. ‘బలిగా అర్పించండి’ అని ప్రధాన పాఠ్యంలో పెడితే స్పష్టంగా లేని ఆరాధనా లేదా యాజ్ఞిక భావాన్ని దిగుమతి చేసే ప్రమాదం ఉంది; అయినా గ్రీకు పదం కొన్నిసార్లు ఆ భావాన్ని కలిగి ఉండగలదని పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గౌరవప్రదంగా రూపొందించబడింది. విందు సందర్భాన్ని స్పష్టంగా ఉంచుతూ మూలంలోని సంభావ్య యాజ్ఞిక భావఛాయను పాదటిప్పణిలో సంరక్షించింది.
