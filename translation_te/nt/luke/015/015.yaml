- source_word: ἑνὶ τῶν πολιτῶν
  choice: పౌరుల్లో ఒకరిని
  rationale: πολίτης రాజకీయ సమాజానికి చెందిన పౌరుణ్ణి సూచిస్తుంది; ‘పౌరుడు’ దానికి ప్రత్యక్షమైన ఆధునిక తెలుగు సమానం. ‘అంటిపెట్టుకొను’తో సహజ తెలుగు ప్రయోగం కోసం ద్వితీయా విభక్తి వాడబడింది.
- source_word: τῆς χώρας ἐκείνης
  choice: ఆ దేశ
  rationale: χώρα ఇక్కడ దేశం/ప్రాంతం అనే అర్థం కలిగి ఉంది; ముందున్న దూరదేశ నేపథ్యానికి ‘ఆ దేశ’ స్పష్టంగా సరిపోతుంది.
- source_word: ἔπεμψεν
  choice: పంపాడు
  rationale: πέμπω యొక్క సాధారణ అర్థాన్ని నేరుగా అందిస్తుంది; అస్పష్టత రాకుండా కర్తను ‘ఆ పౌరుడు’గా పునరుక్తి చేశాం.
- source_word: εἰς τοὺς ἀγροὺς αὐτοῦ
  choice: తన పొలాలకు
  rationale: ἀγρός యొక్క వ్యవసాయ భూమి/పొలం భావాన్ని, మూలంలోని బహువచనాన్ని నిలుపుతుంది. ‘తన’ సమీప కర్త అయిన పౌరుని సూచిస్తుంది.
- source_word: βόσκειν
  choice: మేపడానికి
  rationale: జంతువులకు మేత వేయడం లేదా వాటిని మేతకు నడిపించడం అనే βόσκω భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: χοίρους
  choice: పందులను
  rationale: χοῖροςకు సాధారణ, ఆధునిక తెలుగు పదం.
