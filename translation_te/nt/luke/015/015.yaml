- source_word: πορευθεὶς
  choice: వెళ్లి
  rationale: అనంతర క్రియకు ముందు జరిగిన కదలికను సూచించే aorist participle‌ను సహజమైన తెలుగు క్రియావిశేషణ రూపంలో అందిస్తుంది.
- source_word: ἐκολλήθη
  choice: అంటిపెట్టుకున్నాడు
