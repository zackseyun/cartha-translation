  language: te
  text: అప్పుడు అతడు వెళ్లి ఆ దేశ పౌరులలో ఒకనితో చేరిపోయాడు[a]. ఆ పౌరుడు పందులను మేపడానికి అతణ్ణి తన పొలాలకు పంపాడు.
  philosophy: optimal-equivalence
  footnotes:
