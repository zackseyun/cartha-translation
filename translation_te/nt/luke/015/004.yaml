revisions:
- from: మీలో ఏ మనిషికైనా వంద గొర్రెలు ఉండి, వాటిలో ఒకటి తప్పిపోతే, అతడు తొంభై తొమ్మిదింటిని బీడుప్రదేశంలో[a] విడిచిపెట్టి, తప్పిపోయినదాన్ని కనుగొనే వరకు దాని వెంట వెళ్లడా?
  to: మీలో వంద గొర్రెలు ఉన్న ఏ మనిషైనా, వాటిలో ఒకటి తప్పిపోయినప్పుడు, తొంభై తొమ్మిది గొర్రెలను బీడుప్రదేశంలో[a] విడిచిపెట్టి, తప్పిపోయిన గొర్రెను కనుగొనే వరకు దాని వెంట వెళ్లడా?
  rationale: The revision represents the aorist participial circumstance more faithfully, improves idiomatic Telugu syntax, and restores explicit sheep referents where Telugu count/neuter forms would sound impersonal. It retains the source’s single rhetorical question, representative masculine wording, and the lexical breadth of ἐρήμῳ through the anchored footnote.
  reviewer_model: gpt-5.6-terra
