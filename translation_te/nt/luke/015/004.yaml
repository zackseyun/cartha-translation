id: LUK.15.4
reference: Luke 15:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τίς ἄνθρωπος ἐξ ὑμῶν ἔχων ἑκατὸν πρόβατα καὶ ⸀ἀπολέσας ⸂ἐξ αὐτῶν ἓν⸃ οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα ἐν τῇ ἐρήμῳ καὶ πορεύεται ἐπὶ τὸ ἀπολωλὸς ἕως εὕρῃ αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/004.yaml
  text: What man among you, having a hundred sheep and losing one of them, does not leave the ninety-nine in the open country and go after the lost one until he finds it?
translation:
  language: te
  text: మీలో వంద గొర్రెలు ఉన్న ఏ మనిషైనా, వాటిలో ఒకటి తప్పిపోయినప్పుడు, తొంభై తొమ్మిది గొర్రెలను బీడుప్రదేశంలో[a] విడిచిపెట్టి, తప్పిపోయిన గొర్రెను కనుగొనే వరకు దాని వెంట వెళ్లడా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అరణ్యంలో’ లేదా ‘బహిరంగ మేతభూమిలో.’ గ్రీకు పదం జనావాసం లేని ప్రదేశాన్ని, బీడుభూమిని లేదా బహిరంగ మేతప్రాంతాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἄνθρωπος ἐξ ὑμῶν
  choice: మీలో ఏ మనిషికైనా
  rationale: ప్రతినిధిగా చెప్పబడిన పుంలింగ ఏకవచన ఉదాహరణను నిలుపుతూ, తెలుగు అలంకారప్రశ్నకు సహజమైన రూపాన్ని ఇస్తుంది.
- source_word: ἔχων ἑκατὸν πρόβατα
  choice: వంద గొర్రెలు ఉండి
  rationale: వర్తమాన కృదంత భావాన్ని సహజమైన తెలుగు అనుసంధాన క్రియారూపంలో వ్యక్తం చేస్తుంది.
- source_word: ἀπολέσας ἐξ αὐτῶν ἓν
  choice: వాటిలో ఒకటి తప్పిపోతే
  rationale: ఇక్కడ ἀπόλλυμι నాశనం చేయడం కాక, ఒక గొర్రె తప్పిపోయిన సందర్భాన్ని సూచిస్తుంది; షరతార్థక తెలుగు నిర్మాణం అలంకారప్రశ్నను సహజంగా మలుస్తుంది.
- source_word: οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα
  choice: అతడు తొంభై తొమ్మిదింటిని ... విడిచిపెట్టి ... వెళ్లడా?
  rationale: οὐతో కూడిన ప్రశ్న ఆశించబడే సానుకూల సమాధానాన్ని సూచిస్తుంది; తెలుగు ‘వెళ్లడా?’ అదే అలంకార బలాన్ని సహజంగా అందిస్తుంది.
- source_word: ἐν τῇ ἐρήμῳ
  choice: బీడుప్రదేశంలో
  rationale: ἔρημος సూచించగల జనావాసం లేని బహిరంగ భూమి లేదా అరణ్యసదృశ ప్రదేశం అనే విస్తృత భావాన్ని కాపాడుతుంది; భావపరిధిని పాదటిప్పణిలో తెలియజేస్తుంది.
- source_word: πορεύεται ἐπὶ τὸ ἀπολωλὸς
  choice: తప్పిపోయినదాన్ని ... దాని వెంట వెళ్లడా
  rationale: తప్పిపోయిన గొర్రె వైపు దానిని వెదుకుతూ వెళ్లే భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἕως εὕρῃ αὐτό
  choice: కనుగొనే వరకు
  rationale: వెదకడం కొనసాగడానికి ఉన్న కాలపరిమితిని మూలానికి దగ్గరగా తెలియజేస్తుంది; కర్మ ముందే స్పష్టంగా ఉన్నందున మళ్లీ సర్వనామం అవసరం లేదు.
theological_decisions:
- issue: ఉపమాన ప్రశ్నలో ప్రతినిధి పుంలింగ భాష
  choice: ‘మనిషి’ అనే పదాన్ని నిలుపడం
  alternative: ‘వ్యక్తి’
  rationale: ἄνθρωπος ఇక్కడ పుంలింగ ఏకవచన ప్రతినిధి ఉదాహరణగా ఉంది. ‘మనిషి’ మూలరూపాన్ని నిలుపుతుంది; సందర్భం దీనిని కేవలం పురుషులకు పరిమితం చేయదు.
- issue: తొంభై తొమ్మిదిని విడిచిపెట్టిన ప్రదేశ స్వభావం
  choice: ‘బీడుప్రదేశం’ అని అనువదించి భావపరిధిని పాదటిప్పణిలో ఉంచడం
  alternative: ‘అరణ్యం’ లేదా ‘బహిరంగ మేతభూమి’
  rationale: ἐρήμος పదం నిర్జన ప్రదేశం, అరణ్యప్రాంతం, సాగుచేయని బహిరంగ భూమి వంటి భావాలను కలిగి ఉండగలదు. సందర్భం మాత్రమే వాటిలో ఒకదాన్ని ఖచ్చితంగా నిర్ణయించదు కాబట్టి అసలులోని విస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని ఒకే అలంకారప్రశ్నను నిలుపుతూ, తెలుగు వాక్యప్రవాహం కోసం కృదంతాలను షరతార్థక మరియు అనుసంధాన క్రియారూపాలతో సహజీకరించాం.
