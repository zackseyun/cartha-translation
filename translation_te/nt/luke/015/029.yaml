id: LUK.15.29
reference: Luke 15:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ πατρὶ ⸀αὐτοῦ· Ἰδοὺ τοσαῦτα ἔτη δουλεύω σοι καὶ οὐδέποτε ἐντολήν σου παρῆλθον, καὶ ἐμοὶ οὐδέποτε ἔδωκας ἔριφον ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/029.yaml
  text: But he answered his father[a], ‘Look, for so many years I have been serving you, and I never disobeyed your command; yet you never gave me even a young goat so that I might celebrate with my friends.’
translation:
  language: te
  text: 'అయితే అతడు తన తండ్రికి ఇలా జవాబిచ్చాడు: “చూడు, ఇన్ని సంవత్సరాలుగా నేను నీకు బానిసలా సేవ చేస్తున్నాను[a]. నీ ఆజ్ఞను ఎన్నడూ మీరలేదు. అయినా నా స్నేహితులతో కలిసి ఆనందించడానికి నువ్వు నాకు ఒక్క మేకపిల్లనైనా ఎన్నడూ ఇవ్వలేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నీకు సేవ చేస్తున్నాను.” గ్రీకు క్రియకు “సేవ చేయడం” అనే అర్థంతో పాటు, బలమైన భావంలో “బానిసగా సేవ చేయడం” అనే అర్థం కూడా ఉండవచ్చు. ఇక్కడ “బానిసలా సేవ చేస్తున్నాను” అనే మాట పెద్ద కుమారుని చేదుతో కూడిన స్వరాన్ని ప్రతిబింబిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν τῷ πατρὶ αὐτοῦ
  choice: తన తండ్రికి ఇలా జవాబిచ్చాడు
  rationale: ‘జవాబిచ్చి చెప్పాడు’ అనే గ్రీకు ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో పునరుక్తి లేకుండా వ్యక్తం చేస్తుంది.
- source_word: Ἰδοὺ
  choice: చూడు
  rationale: తండ్రి దృష్టిని తన ఫిర్యాదుపై నిలిపే బలమైన సంభాషణ సూచికను సహజంగా నిలుపుతుంది.
- source_word: τοσαῦτα ἔτη δουλεύω σοι
  choice: ఇన్ని సంవత్సరాలుగా నేను నీకు బానిసలా సేవ చేస్తున్నాను
  rationale: δουλεύωలోని అధీన సేవ భావాన్నీ, పెద్ద కుమారుని చేదుతో కూడిన స్వీయ అవగాహననూ తెలుగులో సహజంగా తెలియజేస్తుంది; అతడు అక్షరార్థంగా బానిస అని నిర్ధారించదు.
- source_word: οὐδέποτε ἐντολήν σου παρῆλθον
  choice: నీ ఆజ్ఞను ఎన్నడూ మీరలేదు
  rationale: ఆజ్ఞను ఉల్లంఘించడం అనే సందర్భార్థాన్ని సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐμοὶ οὐδέποτε ἔδωκας ἔριφον
  choice: నువ్వు నాకు ఒక్క మేకపిల్లనైనా ఎన్నడూ ఇవ్వలేదు
  rationale: ἔριφοςను స్పష్టంగా ‘మేకపిల్ల’గా అనువదిస్తూ, ఫిర్యాదులోని అల్పీకరణ భావాన్ని ‘ఒక్క...నైనా’ ద్వారా చూపుతుంది.
- source_word: ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ
  choice: నా స్నేహితులతో కలిసి ఆనందించడానికి
  rationale: విందు సందర్భంలోని ఉల్లాసాన్ని సహజమైన తెలుగులో తెలియజేస్తూ ఉద్దేశార్థక నిర్మాణాన్ని కాపాడుతుంది.
theological_decisions:
- issue: δουλεύω పదంలో సేవ మరియు బానిసత్వ భావాల మధ్య ఉద్రిక్తత
  choice: బానిసలా సేవ చేస్తున్నాను
  alternative: సేవ చేస్తున్నాను; బానిసలా పనిచేస్తున్నాను
  rationale: గ్రీకు క్రియలో సాధారణ సేవకన్నా బలమైన అధీనత భావం ఉండవచ్చు. కుమారుని అసంతృప్త స్వరాన్ని నిలుపుతూ, అతడు నిజంగా బానిస అన్న సిద్ధాంతపరమైన నిర్ణయం రాకుండా ఉపమాన రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కుటుంబ సంభాషణకు సహజమైన ‘నువ్వు/నీ’ రూపాలు వాడబడ్డాయి. వాక్యానికి గౌరవప్రదమైన కథనశైలి ఉండగా, పెద్ద కుమారుని తీవ్ర ఫిర్యాదు కూడా స్పష్టంగా నిలుపబడింది.
