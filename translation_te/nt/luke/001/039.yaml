  text: In those days Mary arose and went with haste into the hill country[a], to a town of Judah,
translation:
  language: te
  text: ఆ రోజుల్లో మరియ లేచి, త్వరగా యూదా కొండ ప్రాంతంలోని ఒక పట్టణానికి వెళ్లింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదాలోని ఒక నగరానికి” లేదా “యూదయ పట్టణానికి.” గ్రీకు పదమైన πόλιςకు “పట్టణం” లేదా “నగరం” అనే అర్థాలు రావచ్చు. Ἰούδα యూదా లేదా యూదయ ప్రాంతాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστᾶσα
  choice: లేచి
  rationale: అనంతర ప్రధాన క్రియకు ముందు జరిగిన చర్యను తెలిపే భూతకాల కృదంతం; సహజమైన తెలుగు కథన క్రమాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది స్వల్ప కథన మార్పును సూచిస్తుంది; తెలుగులో వాక్యప్రవాహమే ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: ఆ రోజుల్లో
  rationale: కాలసూచక భావాన్ని సహజమైన ఆధునిక తెలుగులో ఇస్తుంది.
- source_word: ἐπορεύθη
  choice: వెళ్లింది
  rationale: πορεύομαι యొక్క సాధారణ ప్రయాణార్థాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς τὴν ὀρεινὴν
  choice: కొండ ప్రాంతానికి
  rationale: నామవాచకంగా వాడిన ὀρεινή ఎత్తైన లేదా కొండల ప్రాంతాన్ని సూచిస్తుంది.
- source_word: μετὰ σπουδῆς
  choice: త్వరగా
  rationale: σπουδήకి శ్రద్ధ, ఉత్సాహం, త్వర అనే భావాలు ఉండవచ్చు; ఈ ప్రయాణ సందర్భంలో సత్వరత ప్రధానంగా కనిపిస్తుంది.
- source_word: εἰς πόλιν Ἰούδα
  choice: యూదా ప్రాంతంలోని ఒక పట్టణానికి
  rationale: πόλις పట్టణం లేదా నగరం కావచ్చు; Ἰούδα ఇక్కడ వ్యక్తిపేరు కాక ప్రాంతీయ లేదా గోత్ర సంబంధ సూచనగా సహజంగా అర్థమవుతుంది.
theological_decisions:
- issue: Ἰούδα యొక్క గుర్తింపు
  choice: యూదా ప్రాంతం
  alternative: యూదయ ప్రాంతం; యూదా అనే పట్టణం
  rationale: సందర్భంలో Ἰούδα ప్రాంతీయ లేదా గోత్ర సంబంధ నామంగా అర్థం కావడం అత్యంత సహజం. ‘యూదా ప్రాంతం’ మూలరూపానికి దగ్గరగా ఉంటూ, అది పట్టణం పేరు అని అనవసరంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ప్రయాణ గమ్యక్రమాన్ని తెలుగులో స్పష్టత కోసం ‘యూదా ప్రాంతంలోని ఒక పట్టణానికి’ అని సమన్వయించాం; πόλις మరియు Ἰούδα సంబంధిత నిజమైన పదార్థ సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
