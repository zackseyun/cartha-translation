  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καθεῖλεν δυνάστας ἀπὸ θρόνων καὶ ὕψωσεν ταπεινούς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/052.yaml
  text: He has brought down rulers from thrones and exalted the humble[a][b].
translation:
  language: te
  text: పాలకులను సింహాసనాల నుండి దించివేశాడు; దీనులను[a] పైకి లేపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వినయంగలవారిని.’ గ్రీకు పదం వినయంగలవారినీ, తక్కువ సామాజిక స్థితిలో ఉన్నవారినీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεῖλεν
  choice: దించివేశాడు
  rationale: దేవుడు ఉన్నత స్థానం నుంచి తొలగించిన నిర్ణయాత్మక కార్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; హింసాత్మకంగా పడద్రోయడం అనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: δυνάστας
  choice: అధికారులను
  rationale: ఈ పదం శక్తిమంతులను లేదా పాలకులను సూచించగలదు. ‘సింహాసనాల మీదనుంచి’ అనే సందర్భం అధికారాన్ని చేపట్టినవారనే భావాన్ని ముందుకు తెస్తుంది; ‘అధికారులు’ ఆ భావాన్నీ, పదంలోని కొంత విస్తృతతనూ నిలుపుతుంది.
- source_word: ἀπὸ θρόνων
  choice: సింహాసనాల మీదనుంచి
  rationale: మూలంలోని స్పష్టమైన రాజసంబంధ చిత్రాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది; మూలంలో లేని ‘వారి’ అనే పదాన్ని చేర్చలేదు.
- source_word: ὕψωσεν
  choice: పైకి లేపాడు
  rationale: ఉన్నత స్థితికి చేర్చడం అనే సామాజిక, ఆధ్యాత్మిక ప్రతిధ్వనులను రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ταπεινούς
  choice: దీనులను
  rationale: తక్కువ సామాజిక స్థితిలో ఉన్నవారు మరియు వినయంగలవారు అనే పరస్పరం మిళితమయ్యే భావాలకు తెలుగులో ‘దీనులు’ చోటిస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
theological_decisions:
- issue: మహిమగీతంలోని భూతకాల క్రియల కాలాంశం
  choice: తెలుగులో నిర్ణయాత్మకంగా పూర్తయిన కార్యాలను సూచించే సాధారణ భూతకాల రూపాలు (‘దించివేశాడు… పైకి లేపాడు’)
  alternative: కొనసాగుతున్న ఫలితాన్ని స్పష్టంచేసే ‘దించివేశాడు… పైకి లేపి ఉన్నాడు’ వంటి రూపాలు
  rationale: గ్రీకు ఏఓరిస్టులు దేవుని నిర్ణయాత్మక కార్యాలను కీర్తనాత్మకంగా వర్ణిస్తాయి. సహజ తెలుగు సాధారణ భూతకాలం వాటి పూర్తయిన, సజీవమైన బలాన్ని నిలుపుతుంది; అవి ప్రవచనాత్మకమా, సారాంశాత్మకమా, కాలాతీత స్తుతి భాషా అనే ఉద్వేగాన్ని బలవంతంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనాత్మక గౌరవాన్ని నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉండే పదప్రయోగం. వాక్యంలోని సామాజిక స్థితుల తారుమారును స్పష్టంగా చూపేందుకు సమాంతర నిర్మాణం ఉపయోగించబడింది.
