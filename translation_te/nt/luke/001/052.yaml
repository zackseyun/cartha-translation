  terminology: ‘పాలకులు’ accurately conveys the throne-associated sense of δυνάστας without claiming that the Greek is limited to monarchs. ‘దీనులు’ suitably expresses the lowly/humble ambiguity of ταπεινούς; the footnote retains the humility sense explicitly.
