source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὡς ἤκουσεν ⸂τὸν ἀσπασμὸν τῆς Μαρίας ἡ Ἐλισάβετ⸃, ἐσκίρτησεν τὸ βρέφος ἐν τῇ κοιλίᾳ αὐτῆς, καὶ ἐπλήσθη πνεύματος ἁγίου ἡ Ἐλισάβετ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/041.yaml
  text: And it happened that[a], when Elizabeth heard Mary’s greeting, the baby leaped in her womb, and Elizabeth was filled with the Holy Spirit,
translation:
  language: te
  text: 'ఇలా జరిగింది: మరియ పలకరింపును[a] ఎలీసబెతు విన్నప్పుడు, ఆమె గర్భంలోని శిశువు గంతు వేసింది; ఎలీసబెతు పరిశుద్ధాత్మతో నిండిపోయింది,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అభివాదం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ఇలా జరిగింది
  rationale: లూకా రచనలోని కథన సూత్రాన్ని స్పష్టంగా ఉంచుతూ, పాతకాలపు కృత్రిమ వాక్యనిర్మాణం లేకుండా సహజమైన ఆధునిక తెలుగు రూపాన్ని ఇస్తుంది.
- source_word: ὡς
  choice: విన్నప్పుడు
  rationale: అఒరిస్ట్ క్రియతో ఉన్న ఈ సందర్భంలో తక్షణ కాలసంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀσπασμός
  choice: పలకరింపు
  rationale: మరియ పలికిన అభివాదాన్ని సూచించే, సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే ఆధునిక తెలుగు పదం.
- source_word: ἐσκίρτησεν
  choice: గంతులేసింది
  rationale: గర్భంలోని శిశువు అకస్మాత్తుగా ఉత్సాహంగా కదిలిన దృశ్యాన్ని సజీవంగా వ్యక్తం చేస్తుంది; కేవలం ‘కదిలింది’ కంటే మూలపద బలాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: βρέφος
  choice: శిశువు
  rationale: ఇక్కడ గర్భంలో ఉన్న యోహానును సూచిస్తుంది. ‘శిశువు’ సహజమైనదీ, గౌరవప్రదమైనదీ, సందర్భానికి తగినదీ.
- source_word: κοιλία
  choice: గర్భం
  rationale: ఈ సందర్భంలో సాధారణంగా కడుపును కాకుండా గర్భాన్ని ప్రత్యేకంగా సూచిస్తుంది.
- source_word: ἐπλήσθη
  choice: నిండిపోయింది
  rationale: అఒరిస్ట్ కర్మణి రూపాన్ని సహజమైన తెలుగులో అందిస్తూ, దేవుని కార్యాన్ని అదనపు వివరణ లేకుండా సూచిస్తుంది.
- source_word: πνεύματος ἁγίου
  choice: పరిశుద్ధాత్మతో
  rationale: లూకా–అపొస్తలుల కార్యాలు వాడుకలో ఇది దేవుని పరిశుద్ధాత్మను సూచిస్తుంది; తెలుగు క్రైస్తవ వాడుకలో ఈ సమాసరూపం సహజంగా వ్యక్తిగత దైవిక సూచనను తెలియజేస్తుంది.
theological_decisions:
- issue: πνεύματος ἁγίου యొక్క సూచిత వ్యక్తి
  choice: దేవుని పరిశుద్ధాత్మను సూచించే ‘పరిశుద్ధాత్మతో’
  alternative: ‘ఒక పరిశుద్ధ ఆత్మతో’
  rationale: లూకా రచనలలో ఈ పదబంధం సాధారణంగా ప్రవచన ప్రేరణనిచ్చే దేవుని ఆత్మను సూచిస్తుంది. ‘పరిశుద్ధాత్మ’ అనే రూపం సందర్భంలోని వ్యక్తిగత దైవిక సూచనను తెలియజేస్తుంది; పాఠ్యంలో లేని అదనపు సిద్ధాంత వివరణను చేర్చదు.
- issue: గర్భంలోని βρέφος ను ఎలా పేర్కొనాలి
  choice: శిశువు
  alternative: బిడ్డ / పసిబిడ్డ
  rationale: మూలపదం అతి చిన్న బిడ్డను సూచిస్తుంది; ఈ సందర్భంలో గర్భంలో ఉన్న యోహానుకు వర్తిస్తుంది. ‘శిశువు’ ఆ నిర్దిష్ట సూచనను గౌరవప్రదంగా, సహజంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘ఇలా జరిగింది’ ద్వారా లూకా కథన సూత్రం నిలుపబడింది; ‘గంతులేసింది’ మూలంలోని సజీవ కదలికను వ్యక్తం చేస్తుంది. చివరి విరామచిహ్నం తరువాతి వాక్యంతో కథనం కొనసాగుతుందని సూచించేలా మూల సమర్పణను అనుసరిస్తుంది.
