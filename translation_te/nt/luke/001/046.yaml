  yaml_path: translation/nt/luke/001/046.yaml
  text: And Mary said[a], “My soul magnifies the Lord,”
translation:
  language: te
  text: 'మరియ ఇలా చెప్పింది: “నా ప్రాణం ప్రభువు గొప్పతనాన్ని ప్రకటిస్తోంది.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా ప్రాణం ప్రభువును గొప్పవానిగా స్తుతిస్తోంది.”
    reason: μεγαλύνει అనే పదం దేవుని గొప్పతనాన్ని ప్రకటించడం లేదా ఆయనను గొప్పవానిగా స్తుతించడం అనే సమీప భావాలను కలిగి ఉంది.
lexical_decisions:
- source_word: Καὶ
  choice: అప్పుడు
  rationale: గ్రీకు సంధానపదం కథన ప్రవాహాన్ని కొనసాగిస్తోంది; తెలుగులో మాట ప్రారంభాన్ని సహజంగా అనుసంధానించేందుకు ‘అప్పుడు’ వాడబడింది, అయితే ఇది బలమైన కాలసూచనను ఉద్దేశించదు.
- source_word: εἶπεν
  choice: ఇలా చెప్పింది
  rationale: కథన పరిచయంలో λέγω యొక్క భూతకాల రూపానికి సహజమైన తెలుగు; తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని ‘ఇలా’ సులభంగా పరిచయం చేస్తుంది.
- source_word: Μαριάμ
  choice: మరియ
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: Μεγαλύνει
  choice: గొప్పతనాన్ని ప్రకటిస్తోంది
  rationale: μεγαλύνω ఇక్కడ దేవుణ్ణి గొప్పవానిగా స్తుతించడం లేదా ఆయన గొప్పతనాన్ని చాటడం అనే కవితాత్మక భావాన్ని ఇస్తుంది. తెలుగులో ‘మహిమపరుస్తోంది’ కంటే ఈ రూపం మూలంలోని ‘గొప్ప’ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἡ ψυχή μου
  choice: నా ప్రాణం
  rationale: సెమిటిక్-కవితాత్మక వ్యక్తీకరణను ‘నేను’గా కుదించకుండా నిలుపుతుంది; ‘ప్రాణం’ ఆధునిక తెలుగు బైబిలు సందర్భంలో సంపూర్ణ అంతరంగ వ్యక్తిని సూచించగలదు.
- source_word: τὸν κύριον
  choice: ప్రభువు
  rationale: κύριος ఇక్కడ దేవునికి వాడిన భక్తిపూర్వక బిరుదు; ‘ప్రభువు’ దాని ఆధ్యాత్మిక, లేఖన సంబంధమైన బరువును సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: κύριος అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఈ స్తుతిగీత సందర్భంలో పదం దేవుణ్ణి సూచిస్తూ లేఖన స్తోత్రభాషను ప్రతిధ్వనిస్తుంది. ‘యజమాని’ పదం సాధ్యమైనా ఇక్కడ భావాన్ని అనవసరంగా సంకుచితం చేస్తుంది.
- issue: ἡ ψυχή μου అనే మానవస్వరూప వ్యక్తీకరణ
  choice: నా ప్రాణం
  alternative: నేను / నా అంతరంగం
  rationale: ‘నా ప్రాణం’ మూలంలోని కవితాత్మక, దైవశాస్త్రీయ ఉద్వేగాన్ని నిలుపుతుంది; దానిని కేవలం ‘నేను’గా సరళీకరించదు లేదా ‘అంతరంగం’ అనే వ్యాఖ్యాత్మక అర్థానికి పరిమితం చేయదు.
- issue: μεγαλύνει యొక్క స్తుతి భావం
  choice: గొప్పతనాన్ని ప్రకటిస్తోంది
  alternative: మహిమపరుస్తోంది
  rationale: దేవుని పరిమాణాన్ని పెంచడం అనే అక్షరార్థాన్ని సూచించకుండా, ఆయన గొప్పతనాన్ని చాటడం అనే భావాన్ని తెలియజేస్తుంది; స్తుతి మరియు ప్రకటన రెండింటి మధ్యనున్న భావ విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన పరిచయంతో, స్తుతిగీతానికి తగిన గౌరవప్రదమైన కవితాత్మక శైలి పాటించబడింది. ‘నా ప్రాణం’ మరియు ‘ప్రభువు’ అనే బైబిలు పదబంధాలు సామాన్య పాఠకులకు అర్థమయ్యేలా ఉండి మూలంలోని ధార్మిక బరువును నిలుపుతాయి.
