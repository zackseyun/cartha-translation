id: LUK.1.7
reference: Luke 1:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐκ ἦν αὐτοῖς τέκνον, καθότι ⸂ἦν ἡ Ἐλισάβετ⸃ στεῖρα, καὶ ἀμφότεροι προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/007.yaml
  text: And they had no child[a], because Elizabeth was barren, and both of them were advanced in years.
translation:
  language: te
  text: వారికి సంతానం లేదు, ఎందుకంటే ఎలీసబెతు గర్భం ధరించలేకపోయేది; మరియు వారిద్దరూ వయసు మళ్లినవారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘తమ దినాల్లో ముందుకు సాగినవారు.’
    reason: మూలంలోని గౌరవప్రదమైన వయోసూచక నుడికారాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: τέκνον
  choice: సంతానం
  rationale: ఏకవచనమైన τέκνον ఇక్కడ బిడ్డ/సంతానం అనే భావాన్ని సూచిస్తుంది. తెలుగులో ‘వారికి సంతానం లేదు’ అనేది సహజంగా ఉండి, అనవసరంగా బహువచనాన్ని ప్రవేశపెట్టదు.
- source_word: καθότι
  choice: ఎందుకంటే
  rationale: ఇది వారికి సంతానం లేకపోవడానికి కారణాన్ని పరిచయం చేసే స్పష్టమైన, సహజమైన కారణార్థక సంధాయకం.
- source_word: στεῖρα
  choice: గర్భం ధరించలేనిది
  rationale: ఈ పదం కేవలం సంతానం లేని ఫలితాన్ని కాక, గర్భధారణ అసాధ్యతను సూచిస్తుంది. ‘గొడ్రాలు’ కంటే ఈ రూపం ఆధునిక పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: ἀμφότεροι
  choice: వారిద్దరూ
  rationale: జెకర్యా, ఎలీసబెతు ఇద్దరికీ ఈ వివరణ వర్తిస్తుందని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν
  choice: వయసు మళ్లినవారు
  rationale: ‘తమ దినాల్లో ముందుకు సాగినవారు’ అనే గ్రీకు నుడికారానికి ఇది సహజమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం.
- source_word: οὐκ ἦν αὐτοῖς
  choice: వారికి ... లేదు
  rationale: గ్రీకులోని ‘వారికి లేదు’ అనే స్వామ్య నుడికారాన్ని తెలుగులో సహజమైన దత్తివాచక నిర్మాణంతో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి పాటించబడింది. వంధ్యత్వాన్ని సూచించే కఠినమైన సంప్రదాయ పదానికి బదులుగా స్పష్టమైన వివరణాత్మక రూపం వాడబడింది; గ్రీకు వయోసూచక నుడికారం పాదటిప్పణిలో నిలుపబడింది.
