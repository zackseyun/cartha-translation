- from: వారికి సంతానం లేదు; ఎందుకంటే ఎలీసబెతు గర్భం ధరించలేనిది, పైగా వారిద్దరూ వయసు మళ్లినవారు[a].
  to: వారికి సంతానం లేదు, ఎందుకంటే ఎలీసబెతు గర్భం ధరించలేకపోయేది; మరియు వారిద్దరూ వయసు మళ్లినవారు[a].
