- from: 'ప్రజలు జెకర్యా కోసం ఎదురుచూస్తూ ఉన్నారు; అతడు ఆలయంలో[a] ఆలస్యం చేస్తుండడంతో వారు ఆశ్చర్యపోతూ ఉన్నారు.


