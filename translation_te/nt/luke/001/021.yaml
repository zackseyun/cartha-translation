source:
  edition: SBLGNT
  text: Καὶ ἦν ὁ λαὸς προσδοκῶν τὸν Ζαχαρίαν, καὶ ἐθαύμαζον ἐν τῷ χρονίζειν ⸂ἐν τῷ ναῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/021.yaml
  text: And the people were waiting for Zechariah[a], and they were marveling at his delay in the temple.
translation:
  language: te
  text: 'ప్రజలు జెకర్యా కోసం ఎదురుచూస్తూ ఉన్నారు; ఆయన ఆలయంలో[a] ఆలస్యం చేయడంపై వారు ఆశ్చర్యపడుతూ ఉన్నారు.


    [a] ఇంకా కచ్చితంగా, “దేవాలయ పరిశుద్ధస్థలంలో.” ఇక్కడి గ్రీకు పదం దేవాలయ ప్రాంగణాలన్నిటినీ కాకుండా, దేవాలయ పరిశుద్ధస్థలాన్ని సూచిస్తుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇంకా కచ్చితంగా, “దేవాలయ పరిశుద్ధస్థలంలో.” ఇక్కడి గ్రీకు పదం దేవాలయ ప్రాంగణాలన్నిటినీ కాకుండా, దేవాలయ పరిశుద్ధస్థలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαὸς
  choice: ప్రజలు
  rationale: బయట సమకూడిన వారిని సమష్టిగా సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: προσδοκῶν
  choice: ఎదురుచూస్తూ ఉన్నారు
  rationale: ἦν తో కూడిన వర్తమాన కృదంతం కొనసాగుతున్న గత చర్యను తెలియజేస్తుంది; ఈ తెలుగు రూపం ఆ కాలవ్యాప్తిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ζαχαρίαν
  choice: జెకర్యా
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన పేరురూపం.
- source_word: ἐθαύμαζον
  choice: ఆశ్చర్యపోతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న ప్రతిస్పందనను కాపాడుతూ, కేవలం ఆలోచించడం అనే బలహీన భావానికి పరిమితం చేయదు.
- source_word: ἐν τῷ χρονίζειν
  choice: ఆలస్యం చేస్తుండడంతో
  rationale: ఆలస్యమే వారి ఆశ్చర్యానికి సందర్భం లేదా కారణమని సహజమైన తెలుగులో తెలియజేస్తుంది; జరుగుతూ ఉన్న చర్య భావాన్ని కూడా నిలుపుతుంది.
- source_word: ναῷ
  choice: ఆలయంలో
  rationale: సాధారణ పాఠకులకు స్పష్టమైన పదం; గ్రీకు ναός యొక్క మరింత నిర్దిష్టమైన ‘దేవాలయ పరిశుద్ధస్థలం’ అనే భావం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: αὐτόν
  choice: అతడు
  rationale: గ్రీకులో χρονίζειν అనే క్రియార్థక నామానికి కర్తగా ఉన్న సర్వనామాన్ని తెలుగు ఉపవాక్యంలో సహజమైన కర్త రూపంలో ఇచ్చింది.
