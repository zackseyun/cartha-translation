  to: 'ప్రజలు జెకర్యా కోసం ఎదురుచూస్తూ ఉన్నారు; ఆయన ఆలయంలో[a] ఆలస్యం చేయడంపై వారు ఆశ్చర్యపడుతూ ఉన్నారు.


