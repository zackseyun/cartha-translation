  rationale: The revision retains the imperfect, ongoing actions (“ఎదురుచూస్తూ ఉన్నారు,” “ఆశ్చర్యపడుతూ ఉన్నారు”), the established personal name, and the distinction indicated by ναός. It replaces an unnecessarily causal expression with a Telugu construction that more directly conveys their astonishment at Zechariah’s delay and leaves the Greek construction’s precise circumstantial nuance intact.
