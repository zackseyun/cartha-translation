  text: καὶ ἤγειρεν κέρας σωτηρίας ἡμῖν ⸀ἐν οἴκῳ ⸀Δαυὶδ παιδὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/069.yaml
  text: and has raised up a horn of salvation for us in the house of David his servant,[a]
translation:
  language: te
  text: తన సేవకుడైన దావీదు వంశంలో మన కోసం రక్షణ కొమ్మును[a] లేవనెత్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శక్తిమంతుడైన రక్షకుణ్ణి.” అక్షరార్థంగా, “రక్షణ కొమ్మును”; ఇది శక్తివంతమైన విమోచనను సూచించే బైబిలు రూపకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν
  choice: లేవనెత్తాడు
  rationale: గ్రీకు ఏఓరిస్టు దేవుడు చేసిన రక్షణ కార్యాన్ని స్తుతిగీత సందర్భంలో ప్రకటిస్తుంది. ‘లేవనెత్తాడు’ అనేది దేవుడు రక్షక శక్తిని ఉద్భవింపజేశాడనే బైబిలు నుడికారాన్ని నిలుపుతుంది.
- source_word: κέρας σωτηρίας
  choice: రక్షణ కొమ్మును
  rationale: ‘కొమ్ము’ బైబిలు సంప్రదాయంలో బలం, విజయం, శక్తివంతమైన విమోచనకు రూపకం. దాన్ని ‘శక్తిమంతుడైన రక్షకుడు’ అని పూర్తిగా వివరణాత్మకంగా మార్చకుండా మూల చిత్రాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: ἡμῖν
  choice: మన కోసం
  rationale: ఇక్కడి దత్తివిభక్తి ప్రయోజనార్థకంగా ఉంది; రక్షణ కార్యం మన మేలుకోసమని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν οἴκῳ Δαυὶδ
  choice: దావీదు వంశంలో
  rationale: οἶκος అక్షరార్థంగా ‘ఇల్లు’ అయినా ఇక్కడ దావీదు వంశం లేదా రాజవంశాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వంశంలో’ అర్థాన్ని స్పష్టంగా, సహజంగా అందిస్తూ గ్రీకు ἐν భావాన్ని నిలుపుతుంది.
- source_word: παιδὸς αὐτοῦ
  choice: తన సేవకుడైన
  rationale: దావీదుకు సంబంధించి παῖς దేవుని ‘సేవకుడు’ అనే ఒడంబడిక సంబంధిత బైబిలు ప్రయోగం; ‘బాలుడు’ లేదా ‘కుమారుడు’ ఇక్కడ తప్పుదారి పట్టించవచ్చు.
theological_decisions:
- issue: κέρας σωτηρίας అనే రూపకాన్ని నిలపాలా, లేక ‘శక్తిమంతుడైన రక్షకుడు’ అని అర్థాన్ని నేరుగా చెప్పాలా
  choice: ప్రధాన పాఠ్యంలో ‘రక్షణ కొమ్ము’ అనే రూపకాన్ని నిలిపాం.
  alternative: శక్తిమంతుడైన రక్షకుడు
  rationale: ఈ రూపకం పాత నిబంధనలోని రాజరిక, విజయ, విమోచన చిత్రాలతో అనుసంధానమై ఉంది. దాన్ని నిలపడం సాహిత్య, వేదాంత ప్రతిధ్వనులను కాపాడుతుంది; సాధారణ పాఠకుడి కోసం పాదటిప్పణిలో అర్థాన్ని వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ‘దావీదు ఇల్లు’ అనే అసహజ అక్షరానువాదానికి బదులు ‘దావీదు వంశం’ అన్నాం; అయితే ‘రక్షణ కొమ్ము’ అనే ముఖ్యమైన బైబిలు రూపకాన్ని పాదటిప్పణి సహాయంతో నిలిపాం.
