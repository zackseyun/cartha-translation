    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది కథనం ముందుకు సాగడాన్ని సూచించే స్వల్ప అనుసంధాన పదం. తెలుగులో ఇక్కడ ‘ఇక’ లేదా ‘అప్పుడు’ చేరిస్తే మూలంలో లేని స్పష్టమైన కాలార్థం కలగవచ్చు; వాక్యక్రమమే అనుసంధానాన్ని తెలియజేస్తుంది.
- source_word: ἐπλήσθη ὁ χρόνος
  choice: సమయం నిండింది
  rationale: గర్భకాలం పూర్తయిందనే భావాన్ని తెలిపే మూలంలోని ‘సమయం నిండింది/పూర్తయింది’ అనే రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: ఎలిసబెతు ప్రసవించాల్సిన
  rationale: ప్రసవానికి సంబంధించిన కాలం పూర్తయిందనే సంబంధాన్ని స్పష్టంగా, ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. గ్రీకులోని సర్వనామ సూచనను తెలుగులో స్పష్టత కోసం పేరుతో తెలిపింది.
- source_word: ἐγέννησεν
  choice: కన్నది
  rationale: పూర్తయిన ప్రసవ కార్యాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; ‘కుమారుణ్ణి కన్నది’ సాధారణ ఆధునిక తెలుగు ప్రయోగం.
- source_word: υἱόν
  choice: ఒక కుమారుణ్ణి
  rationale: మూలపదం సాధారణంగా బిడ్డను మాత్రమే కాక కుమారుణ్ణి ప్రత్యేకంగా సూచిస్తుంది; ఆ లింగనిర్దిష్ట అర్థాన్ని నిలుపుతుంది.
- source_word: Ἐλισάβετ
  choice: ఎలిసబెతు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన పేరురూపాన్ని అనుసరిస్తుంది.
