  terminology: ‘దాసురాలు’ suitably preserves the feminine and belonging-to-God aspect of δούλη without importing Marian doctrinal claims. ‘దీనస్థితి’ appropriately denotes lowly condition rather than merely inward humility. ‘ధన్యురాలని అంటారు’ naturally conveys μακαριοῦσίν με.
