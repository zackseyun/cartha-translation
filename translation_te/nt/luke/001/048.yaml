id: LUK.1.48
reference: Luke 1:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ἐπέβλεψεν ἐπὶ τὴν ταπείνωσιν τῆς δούλης αὐτοῦ, ἰδοὺ γὰρ ἀπὸ τοῦ νῦν μακαριοῦσίν με πᾶσαι αἱ γενεαί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/048.yaml
  text: because he has looked upon the humble state of his servant[a]. For behold[b], from now on all generations will call me blessed.
translation:
  language: te
  text: ఎందుకంటే ఆయన తన దాసురాలి[a] దీనస్థితిని[b] చూశాడు. ఇదిగో, ఇప్పటి నుండి అన్ని తరాలవారూ నన్ను ధన్యురాలని అంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సేవకురాలు’; మూలపదానికి ‘బానిస స్త్రీ’ అనే అర్థమూ ఉంది.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘అల్పస్థితి’ లేదా ‘అవమానిత స్థితి’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβλεψεν ἐπὶ
  choice: చూశాడు
  rationale: ఈ సందర్భంలో దేవుడు మరియ వైపు దృష్టి పెట్టి అనుగ్రహంతో గమనించాడనే భావం ఉంది. సహజమైన తెలుగు కోసం ‘చూశాడు’ వాడినా, వాక్యసందర్భం దాని అనుకూలమైన భావాన్ని తెలియజేస్తుంది.
- source_word: ταπείνωσιν
  choice: దీనస్థితి
  rationale: ఇది కేవలం అంతరంగ వినయాన్ని కాక, మరియ యొక్క సామాజిక అల్పస్థితిని లేదా తక్కువ స్థాయిని సూచిస్తుంది. ‘దీనస్థితి’ ఆ బాహ్య పరిస్థితిని అతిశయింపకుండా వ్యక్తపరుస్తుంది.
- source_word: δούλης
  choice: దాసురాలు
  rationale: స్త్రీలింగ రూపమైన δούλη దేవునికి చెందిన బానిస/సేవకురాలు అనే భావాన్ని కలిగి ఉంది. ‘దాసురాలు’ ఆధునిక తెలుగులో ఆ చెందినతనం మరియు సేవ రెండింటినీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే, ఉద్ఘాటన కలిగిన మూలపదపు కార్యాన్ని ‘ఇదిగో’ సహజంగానూ గంభీరంగానూ అందిస్తుంది.
- source_word: ἀπὸ τοῦ νῦν
  choice: ఇప్పటినుంచి
  rationale: ఇప్పటి సమయం నుండి ముందుకు కొనసాగే కాలభావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: μακαριοῦσίν με
  choice: నన్ను ధన్యురాలని అంటారు
  rationale: మరియను ధన్యురాలిగా ప్రకటించడం లేదా గుర్తించడం అనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: πᾶσαι αἱ γενεαί
  choice: తరతరాల వారందరూ
  rationale: వరుసగా వచ్చే సమస్త తరాల ప్రజలను సూచించే గ్రీకు నుడికారాన్ని స్పష్టమైన తెలుగులో అందిస్తుంది; ‘భవిష్యత్తు’ అనే పదాన్ని అదనంగా చేర్చలేదు.
theological_decisions:
- issue: మరియ తనను δούλη అని పేర్కొనడం
  choice: దాసురాలు
  alternative: సేవకురాలు; బానిస స్త్రీ
  rationale: దేవునికి పూర్తిగా చెందిన సంబంధాన్ని మృదువుచేయకుండా ఉంచుతూ, తెలుగులో సహజంగా వినిపించే స్త్రీలింగ పదాన్ని ఎంచుకున్నాం. దీనిలో తరువాతి కాలపు మరియ సంబంధిత సిద్ధాంతాలను చేర్చలేదు.
- issue: ταπείνωσις యొక్క భావం
  choice: దీనస్థితి
  alternative: అల్పస్థితి; అవమానిత స్థితి; దీనత్వం
  rationale: ఇక్కడ ప్రధానంగా మరియ యొక్క తక్కువ సామాజిక స్థితి, ప్రాముఖ్యతలేమి ఉద్దేశించబడ్డాయి; దీనిని కేవలం ఆమె అంతరంగ వినయంగా లేదా కేవలం అవమానంగా నిర్ణయించలేదు.
translation_notes:
  register: మరియ స్తోత్రగీతానికి తగిన గంభీరతను ఉంచుతూ, ఆధునిక పాఠకులకు సులభంగా అర్థమయ్యే ప్రామాణిక తెలుగు వాడబడింది. ‘ఇదిగో’ కవితాత్మక ఉద్ఘాటనను నిలుపుతుంది.
