  edition: SBLGNT
  text: καὶ πολλοὺς τῶν υἱῶν Ἰσραὴλ ἐπιστρέψει ἐπὶ κύριον τὸν θεὸν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/016.yaml
  text: And he will turn many of the sons of Israel to the Lord their God[a].
translation:
  language: te
  text: మరియు అతడు ఇశ్రాయేలు కుమారులలో[a] అనేకమందిని వారి దేవుడైన ప్రభువు వైపుకు మళ్లిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలు ప్రజలలో” లేదా “ఇశ్రాయేలీయులలో.” గ్రీకులో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు” అని ఉంది; ఇది సంప్రదాయ ఒడంబడిక-సంబంధమైన వ్యక్తీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: —
  rationale: ఈ వచనం స్వతంత్రంగా చదివినప్పుడు సహజమైన తెలుగుకోసం ప్రారంభ సంధానపదాన్ని ప్రత్యక్షంగా అనువదించలేదు; ముందరి వచనంతో కలిపి చదివితే దాని కొనసాగింపు భావం వాక్యక్రమంలో నిలుస్తుంది.
- source_word: πολλοὺς
  choice: అనేకమందిని
  rationale: విశేషణం వ్యక్తులను సూచించే నామవాచక ప్రయోగంలో ఉండటంతో, తెలుగులో సహజంగా కర్మార్థాన్ని తెలిపే రూపం.
- source_word: τῶν υἱῶν Ἰσραὴλ
  choice: ఇశ్రాయేలు కుమారులలో
  rationale: గ్రీకు మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే సంప్రదాయ నిబంధనాత్మక వ్యక్తీకరణను నిలుపుతూ, πολλούς తో ఉన్న భాగార్థక సంబంధాన్ని ‘లో’ ద్వారా సహజంగా తెలిపింది.
- source_word: ἐπιστρέψει
  choice: తిప్పుతాడు
  rationale: ఇది భవిష్యత్ కాల కర్తరి రూపం; యోహాను అనేకమందిని దేవుని వైపు మళ్లించే కర్తగా ఉన్న సకర్మక భావాన్ని నిలుపుతుంది.
- source_word: ἐπὶ
  choice: వైపు
  rationale: ἐπιστρέφω తో కలిసి వ్యక్తి దిశగా మళ్లింపును సూచిస్తుంది; ‘వైపు’ ఆ దిశాత్మక భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: κύριον
  choice: ప్రభువు
  rationale: ఇక్కడ మానవ యజమానిని కాక ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది; ‘ప్రభువు’ దైవిక, నిబంధనాత్మక గౌరవాన్ని నిలుపుతుంది.
- source_word: τὸν θεὸν αὐτῶν
  choice: వారి దేవుడైన
  rationale: ‘ప్రభువు’కు సమానాధికార వివరణగా ఉన్న గ్రీకు పదబంధాన్ని తెలుగులో సహజమైన విశేషణ రూపంలో అందిస్తుంది.
theological_decisions:
- issue: τῶν υἱῶν Ἰσραὴλ అనే నిబంధనాత్మక వ్యక్తీకరణ
  choice: ఇశ్రాయేలు కుమారులలో
  alternative: ఇశ్రాయేలు ప్రజలలో / ఇశ్రాయేలీయులలో
  rationale: మూలంలోని స్పష్టమైన ‘కుమారులు’ అనే రూపాన్నీ దాని లేఖనాంతర ప్రతిధ్వనినీ ప్రధాన పాఠ్యంలో నిలిపి, మరింత సామూహికమైన సహజ తెలుగు ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చింది.
- issue: κύριον τὸν θεὸν αὐτῶν యొక్క సూచ్యార్థం
  choice: వారి దేవుడైన ప్రభువు
  alternative: వారి దేవుడైన యెహోవా
  rationale: గ్రీకు పాఠ్యంలో κύριος ఉంది; ఇక్కడ అది ఇశ్రాయేలు దేవుణ్ణి సూచించినప్పటికీ, మూలంలో లేని ప్రత్యేక దైవనామాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా ‘ప్రభువు’గా అనువదించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన లేఖన శైలి. ‘తిప్పుతాడు’ అనే సకర్మక క్రియ మూలంలోని కర్తృత్వాన్ని కాపాడుతుంది; ‘వైపు’ ఆధ్యాత్మిక మళ్లింపును అతిగా సిద్ధాంతీకరించకుండా దిశాత్మకంగా వ్యక్తం చేస్తుంది.
