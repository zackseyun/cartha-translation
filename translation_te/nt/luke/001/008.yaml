  yaml_path: translation/nt/luke/001/008.yaml
  text: It happened[a], while he was serving as priest before God in the order of his division,
translation:
  language: te
  text: అతడు తన యాజకవర్గపు సేవాక్రమం ప్రకారం దేవుని సన్నిధిలో యాజకసేవ చేస్తుండగా, ఇలా జరిగింది:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు తన యాజకవర్గానికి కేటాయించిన క్రమంలో దేవుని సన్నిధిలో యాజకసేవ చేస్తున్న సమయంలో.”
    reason: కాలసంబంధ నిర్మాణానికి, అలాగే τάξις (‘క్రమం’) మరియు ἐφημερία (‘యాజకవిభాగం/సేవావంతు’) పదబంధానికి సహజమైన ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ఇలా జరిగింది
  rationale: కథనంలో తదుపరి పరిణామాన్ని పరిచయం చేసే సూత్రప్రయోగం. δέ యొక్క స్వల్ప అనుసంధాన భావాన్ని తెలుగు వాక్యప్రవాహం సహజంగా మోస్తుంది; బలమైన వ్యత్యాసాన్ని చేర్చలేదు.
- source_word: ἐν τῷ ἱερατεύειν αὐτὸν
  choice: అతడు ... యాజకసేవ చేస్తుండగా
  rationale: ἐν తో కూడిన articular infinitive కాలసంబంధమైన ‘చేస్తుండగా’ అనే భావాన్ని ఇస్తుంది. ἱερατεύωను సాధారణ సేవగా కాక నిర్దిష్టమైన యాజకసేవగా అనువదించాం.
- source_word: ἐν τῇ τάξει τῆς ἐφημερίας αὐτοῦ
  choice: తన యాజకవర్గపు సేవాక్రమం ప్రకారం
  rationale: τάξις నిర్దేశిత క్రమాన్ని, ἐφημερία నిర్ణీత సమయాల్లో సేవచేసే యాజకుల విభాగాన్ని సూచిస్తాయి. ఆధునిక పాఠకునికి సంస్థాగత భావం స్పష్టమయ్యేలా ‘యాజకవర్గపు సేవాక్రమం’ ఎంచుకున్నాం.
- source_word: ἔναντι τοῦ θεοῦ
  choice: దేవుని సన్నిధిలో
  rationale: దేవుని సమక్షంలో జరిగే ఆలయసేవను సహజమైన, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: జెకర్యా ఆలయ యాజకసేవకు సంబంధించిన ఆరాధనా పరిభాష
  choice: తన యాజకవర్గపు సేవాక్రమం ప్రకారం దేవుని సన్నిధిలో యాజకసేవ
  alternative: తన వర్గం వంతు ప్రకారం దేవుని ఎదుట యాజకునిగా సేవ
  rationale: చారిత్రక ఆలయసేవా వ్యవస్థను నిలుపుతూ, తరువాతి సంఘ వ్యవస్థలకు చెందిన భావాలను దిగుమతి చేయకుండా మూలంలోని వర్గం మరియు క్రమం అనే రెండు అంశాలనూ వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకునికి అర్థమయ్యేలా, ఆలయసేవ సందర్భానికి తగిన గౌరవప్రదమైన శైలి. ఈ వచనం తరువాతి వాక్యానికి పరిచయంగా ముగుస్తున్నందున ద్విబిందువు వాడబడింది.
