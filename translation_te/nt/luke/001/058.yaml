id: LUK.1.58
reference: Luke 1:58
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ περίοικοι καὶ οἱ συγγενεῖς αὐτῆς ὅτι ἐμεγάλυνεν κύριος τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς, καὶ συνέχαιρον αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/058.yaml
  text: And her neighbors and relatives heard that the Lord had shown great mercy to her[a], and they rejoiced with her.
translation:
  language: te
  text: ఆమె పొరుగువారూ బంధువులూ, ప్రభువు ఆమెపై ఎంతో గొప్ప కనికరం చూపించాడని విని, ఆమెతో కలిసి సంతోషించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίοικοι
  choice: చుట్టుపక్కల నివసించేవారు
  rationale: ఆమె నివసించే పరిసర ప్రాంతంలోని వారిని సూచిస్తుంది; ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: συγγενεῖς
  choice: బంధువులు
  rationale: రక్తసంబంధీకులు లేదా విస్తృత కుటుంబానికి చెందినవారిని సహజంగా సూచించే సాధారణ తెలుగు పదం.
- source_word: ἐμεγάλυνεν
  choice: ఎంతో గొప్పగా చూపించాడు
  rationale: ‘గొప్పచేయడం/మహిమపరచడం’ అనే మూల భావాన్ని ఉంచుతూనే, కనికరంతో కలిసిన ఈ గ్రీకు ప్రయోగాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: సందర్భంలో దేవునికి వాడిన నిర్దిష్ట బిరుదు; తెలుగు బైబిలు భాషలోనూ ఆధునిక ప్రామాణిక వాడుకలోనూ సహజమైన రూపం.
- source_word: ἔλεος
  choice: కనికరం
  rationale: దయతో కూడిన కరుణను సూచిస్తుంది; ఈ సందర్భంలో దేవుని కృపాపూర్వక కార్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: μετ’ αὐτῆς
  choice: ఆమెపట్ల
  rationale: పదశః ‘ఆమెతో’ అయినా, ἐμεγάλυνεν ... ἔλεος అనే ప్రయోగంలో లబ్ధిదారుని సూచిస్తుంది; తెలుగులో ‘ఆమెపట్ల’ అర్థాన్ని సహజంగా అందిస్తుంది.
- source_word: συνέχαιρον αὐτῇ
  choice: ఆమెతో కలిసి సంతోషించారు
  rationale: ఆమె ఆనందంలో ఇతరులు పాలుపంచుకున్నారనే ‘కలిసి ఆనందించడం’ భావాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: ἐμεγάλυνεν ... τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς అనే ప్రయోగం
  choice: ప్రభువు ఆమెపట్ల తన కనికరాన్ని ఎంతో గొప్పగా చూపించాడు
  alternative: ప్రభువు ఆమెకు గొప్ప కనికరం చూపించాడు
  rationale: ఎంచుకున్న రూపం μεγαλύνω యొక్క ‘గొప్ప చేయడం’ అనే అలంకార బలాన్ని కొంత నిలుపుతూ, తెలుగులో అర్థవంతంగా ఉంటుంది. ప్రత్యామ్నాయం మరింత సహజమైనదైనా మూలంలోని క్రియాత్మక బలాన్ని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. మూలంలోని రెండు సమూహాలనూ, కలిసి సంతోషించిన భావాన్నీ స్పష్టంగా నిలిపింది.
