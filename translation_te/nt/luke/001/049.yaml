  edition: SBLGNT
  text: ὅτι ἐποίησέν μοι ⸀μεγάλα ὁ δυνατός, καὶ ἅγιον τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/049.yaml
  text: because the Mighty One has done great things for me[a], and holy is his name.
translation:
  language: te
  text: ఎందుకంటే శక్తిమంతుడు నా కోసం గొప్ప కార్యాలు చేశాడు, ఆయన నామం పవిత్రమైనది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పవిత్రమైనది ఆయన నామం.” గ్రీకులో ఉద్ఘాటన కోసం “పవిత్రమైనది” అనే పదం “ఆయన నామం” కంటే ముందు ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలో మరియ ప్రభువును ఘనపరచడానికి గల కారణాన్ని ఇది పరిచయం చేస్తుంది; కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐποίησέν
  choice: చేశాడు
  rationale: ποιέω యొక్క ఏకకాల భూతరూపం దేవుడు మరియ కోసం చేసిన నిర్ణాయక కార్యాన్ని సూచిస్తుంది. తెలుగులో సాధారణ భూతకాలం పూర్తయిన కార్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μοι
  choice: నా కోసం
  rationale: ఇక్కడ దత్తి విభక్తి ప్రయోజనార్థకంగా ఉంది; దేవుడు మరియకు మేలు కలిగేలా చేసినదాన్ని ‘నా కోసం’ సహజంగా తెలియజేస్తుంది.
- source_word: μεγάλα
  choice: గొప్ప కార్యాలు
  rationale: నపుంసక బహువచన విశేషణం నామవాచకంగా వాడబడింది. ‘గొప్ప కార్యాలు’ దేవుని మహత్తర క్రియలను సూచిస్తూ, సందర్భంలో సహజంగా ఉంటుంది.
- source_word: ὁ δυνατός
  choice: శక్తిమంతుడు
  rationale: ఉపపదంతో ఉన్న విశేషణం ఇక్కడ దేవునికి గౌరవసూచక బిరుదుగా పనిచేస్తుంది. ‘శక్తిమంతుడు’ సంక్షిప్తంగా, సహజంగా, బిరుదు భావాన్ని నిలుపుతుంది.
- source_word: ἅγιον
  choice: పవిత్రమైనది
  rationale: ఇది దేవుని నామాన్ని వర్ణించే విధేయ విశేషణం. ‘పవిత్రమైనది’ నైతిక పరిశుద్ధతతో పాటు ప్రత్యేకంగా దేవునికి చెందినదనే భావాన్ని కూడా మోస్తుంది.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: ఆయన నామం
  rationale: మూలంలోని ‘నామం’ అనే పదాన్ని నిలుపుతూ గౌరవప్రదమైన సహజ తెలుగు రూపాన్ని ఇస్తుంది; సందర్భంలో అది దేవుని వెల్లడైన స్వభావం, ఖ్యాతిని కూడా సూచించవచ్చు.
theological_decisions:
- issue: ὁ δυνατός ను దేవుని బిరుదుగా అనువదించడం
  choice: శక్తిమంతుడు
  alternative: శక్తిగలవాడు
  rationale: గ్రీకులో ఉపపదంతో నామవాచకంగా వాడిన విశేషణం దేవునికి గౌరవసూచక designationగా ఉంది. ‘శక్తిమంతుడు’ అదనపు సిద్ధాంత భావాన్ని చేర్చకుండా ఆ బిరుదు స్వరూపాన్ని నిలుపుతుంది.
- issue: καὶ ἅγιον τὸ ὄνομα αὐτοῦ లో పదక్రమం
  choice: పవిత్రమైనది ఆయన నామం
  alternative: ఆయన నామం పవిత్రమైనది
  rationale: గ్రీకు వాక్యంలో ‘పవిత్రమైనది’ ముందుగా వచ్చి ఉద్ఘాటన పొందుతుంది. ఎంపిక చేసిన తెలుగు రూపం స్తుతిగీత శైలిలో సహజంగా ఉండి ఆ ఉద్ఘాటనను కొంతవరకు నిలుపుతుంది; సాధారణ పదక్రమాన్ని పాదటిప్పణిలో చూపించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన స్తుతిగీత శైలిని ఉపయోగించాం. గ్రీకు పదక్రమంలోని ఉద్ఘాటనను ప్రధాన పాఠ్యంలో నిలుపుతూ, మరింత సాధారణ తెలుగు పదక్రమాన్ని పాదటిప్పణిలో ఇచ్చాం.
