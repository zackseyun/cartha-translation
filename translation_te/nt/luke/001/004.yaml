translation:
  language: te
  text: మీకు బోధించబడిన విషయాల నిశ్చితత్వాన్ని మీరు తెలుసుకోవడానికి[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నమ్మదగినతను”; గ్రీకు నామవాచకం నిశ్చితత్వం, భద్రత లేదా నమ్మదగినతను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “మీకు బోధించబడినవి”; ఈ గ్రీకు క్రియ క్రమబద్ధమైన మౌఖిక బోధను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: తెలుసుకోవడానికి
  rationale: తెలుగులో క్రియార్థక రూపంతో ఉద్దేశార్థక ఉపవాక్యాన్ని సహజంగా వ్యక్తం చేస్తూ, గ్రీకు ἵνα యొక్క ప్రయోజన భావాన్ని నిలుపుతుంది.
- source_word: ἐπιγνῷς
  choice: తెలుసుకోవడానికి
  rationale: ఇది ఉద్దేశార్థక ఉపవాక్యంలోని aorist subjunctive. ‘తెలుసుకోవడం’ అనే సహజమైన తెలుగు ప్రయోగం సరిపోతుంది; ‘పూర్తిగా తెలుసుకోవడం’ అని అనువదిస్తే మూలంలోని భావాన్ని అతిగా తీవ్రపరచే అవకాశం ఉంది.
- source_word: περὶ ὧν … λόγων
  choice: విషయాలు
  rationale: ఇక్కడ λόγων అనేది విడివిడి ‘మాటలు’ కంటే ఉపదేశంలోని సంగతులను లేదా విషయవస్తువును సూచిస్తుంది. ‘విషయాలు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: κατηχήθης
  choice: మీరు ఉపదేశం పొందిన
  rationale: క్రియ యొక్క కర్మణి భావాన్ని నిలుపుతూ, మౌఖికంగా లేదా క్రమబద్ధంగా బోధించబడిన భావాన్ని తెలియజేస్తుంది; తరువాతి కాలంలో ఏర్పడిన ప్రత్యేక సంఘపరమైన సాంకేతిక పదాన్ని ప్రధాన వాక్యంలోకి తీసుకురాదు.
- source_word: τὴν ἀσφάλειαν
  choice: నిశ్చయమైనవని
  rationale: ἀσφάλεια సూచించే నిశ్చితత్వం, భద్రత, నమ్మదగినత అనే భావపరిధిని సందర్భానుసారంగా సహజ తెలుగులో వ్యక్తం చేస్తుంది. ప్రత్యామ్నాయంగా ‘నమ్మదగినవని’ అనే భావం పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: లూకా రచన ఉద్దేశంలో నిశ్చితత్వం స్వభావం
  choice: ముందుగా పొందిన ఉపదేశం నిశ్చయమైనదని తెలుసుకోవడం
  alternative: అంతరంగిక ధైర్యం మాత్రమే; లేదా చారిత్రక నమ్మదగినత మాత్రమే
  rationale: ἀσφάλεια వ్యక్తిగత నిశ్చయాన్నీ, బోధ యొక్క వస్తుగత నమ్మదగినతనూ సూచించగలదు. అనువాదం ఈ రెండింటిలో ఒక్కదానికే భావాన్ని పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంబోధన కోసం ఏకవచన గౌరవార్థక ‘మీరు’ వాడబడింది. వాక్యం ముందున్న లూకా 1:1–3 వాక్యనిర్మాణానికి కొనసాగింపుగా ఉండే ఉద్దేశార్థక భాగం కాబట్టి చివరలో క్రియార్థక ‘తెలుసుకోవడానికి’ రూపం ఉంచబడింది.
