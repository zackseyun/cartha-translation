  text: σωτηρίαν ἐξ ἐχθρῶν ἡμῶν καὶ ἐκ χειρὸς πάντων τῶν μισούντων ἡμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/071.yaml
  text: salvation from our enemies and from the hand of all who hate us,[a]
translation:
  language: te
  text: మన శత్రువుల నుండి, మనలను ద్వేషించే వారందరి చేతిలో నుండి రక్షణను[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మన శత్రువుల నుండి, మనలను ద్వేషించే వారందరి అధికారం నుండి విడుదలను.’
    reason: σωτηρίανకు ‘విడుదల’ అనే సందర్భోచిత ప్రత్యామ్నాయం, ἐκ χειρόςకు ‘అధికారం నుండి’ అనే భావానువాదం ఉన్నాయి.
lexical_decisions:
- source_word: σωτηρίαν
  choice: రక్షణను
  rationale: ‘రక్షణ’ అనే పదం శత్రువుల నుండి విడిపించబడటమనే స్పష్టమైన సందర్భార్థాన్నీ, జెకర్యా ప్రవచనంలోని విస్తృత విమోచన భావాన్నీ నిలుపుతుంది.
- source_word: ἐξ ἐχθρῶν ἡμῶν
  choice: మన శత్రువుల నుండి
  rationale: ἐξ వియోగం లేదా విముక్తి మూలాన్ని సూచిస్తుంది; తెలుగులో ‘నుండి’ సహజమైన, నేరమైన అనువాదం.
- source_word: ἐκ χειρὸς
  choice: చేతిలో నుండి
  rationale: మూలంలోని ‘చేతి’ రూపకాన్ని నిలుపుతూ, అధికారం లేదా అదుపు నుండి విడిపించబడటమనే బైబిలీయ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: πάντων τῶν μισούντων ἡμᾶς
  choice: మనలను ద్వేషించే వారందరి
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేసి, కొనసాగుతున్న లేదా లక్షణాత్మక ద్వేష భావాన్ని నిలుపుతుంది.
- source_word: καὶ
  choice: —
  rationale: తెలుగు సమాంతర నిర్మాణంలో రెండు ‘నుండి’ పదబంధాలను విరామచిహ్నంతో కలపడం సహజంగా ఉంటుంది; అర్థపరంగా రెండవ పదబంధం మొదటిదానికి సమన్వయంగా నిలుస్తుంది.
theological_decisions:
- issue: జెకర్యా ప్రవచనంలో వాగ్దానం చేయబడిన రక్షణ స్వభావం
  choice: ‘రక్షణ’ అనే పదంతో శత్రువుల నుండి స్పష్టమైన విముక్తినీ, విస్తృత రక్షణార్థాన్నీ రెండింటినీ తెరిచి ఉంచడం
  alternative: దీనిని కేవలం రాజకీయ విముక్తిగా లేదా కేవలం పాపం నుండి ఆధ్యాత్మిక రక్షణగా పరిమితం చేయడం
  rationale: వచనం శత్రువులనూ ద్వేషించేవారినీ స్పష్టంగా పేర్కొంటుంది; అయితే లూకా 1లో ‘రక్షణ’కు విస్తృత విమోచన ప్రాధాన్యం కూడా ఉంది. అనువాదం ఈ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘చేతిలో నుండి’ అనే బైబిలీయ రూపకం సాధారణ పాఠకునికి అర్థమయ్యేలా నిలుపబడింది; ప్రత్యామ్నాయ భావానువాదం పాదటిప్పణిలో ఇవ్వబడింది.
