language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀εἰσελθὼν πρὸς αὐτὴν εἶπεν· Χαῖρε, κεχαριτωμένη, ὁ κύριος μετὰ ⸀σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/028.yaml
  text: And coming in to her[a], he said, “Greetings, favored one[b]; the Lord is with you.”
translation:
  language: te
  text: అతడు ఆమె వద్దకు వెళ్లి, “నమస్కారం,[a] అనుగ్రహం పొందినదానా![b] ప్రభువు నీతో ఉన్నాడు” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సంతోషించు” లేదా సంప్రదాయంగా “వందనం.” గ్రీకు పదం రూపంలో ‘సంతోషించు’ అనే ఆజ్ఞార్థకమైనప్పటికీ, ఇక్కడ సాధారణ పలకరింపుగా వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అత్యధిక అనుగ్రహం పొందినదానా,” “అనుగ్రహింపబడినదానా”; సంప్రదాయంగా “అనుగ్రహపూర్ణురాలా.” గ్రీకు పదం అనుగ్రహం లేదా ఆదరణ పొందిన వ్యక్తిని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθὼν πρὸς αὐτὴν
  choice: ఆమె దగ్గరకు వచ్చి
  rationale: అఒరిస్టు కృదంతం ప్రధాన క్రియకు ముందు జరిగిన ప్రవేశం లేదా సమీపించడాన్ని సూచిస్తుంది. సందర్భంలో సహజమైన ఆధునిక తెలుగులో ‘ఆమె దగ్గరకు వచ్చి’ అని చెప్పడం కదలికను స్పష్టంగా తెలియజేస్తుంది; గ్రీకు పదబంధం తప్పనిసరిగా గదిలోకి ప్రవేశించాడని నిర్దిష్టంగా చెప్పదు.
- source_word: Χαῖρε
  choice: శుభం
  rationale: ఈ రూపం అక్షరార్థంగా ‘సంతోషించు’ అనే ఆజ్ఞార్థకమైనప్పటికీ, ఇక్కడ పలకరింపుగా వాడబడింది. ‘శుభం’ ఆధునిక, గౌరవప్రదమైన పలకరింపుగా దాని సందర్భార్థాన్ని అందిస్తుంది.
- source_word: κεχαριτωμένη
  choice: దేవుని అనుగ్రహం పొందినదానా
  rationale: χαριτόω యొక్క పరిపూర్ణ కర్మణి కృదంతం మరియ అనుగ్రహాన్ని పొందిన వ్యక్తి అని సూచిస్తుంది. తెలుగులో కర్తను స్పష్టం చేయడం సహజతకు, భావస్పష్టతకు తోడ్పడుతుంది; ‘దేవుని’ అనేది సందర్భంలో అంతర్లీనమైన అనుగ్రహదాతను తెలియజేస్తుంది.
- source_word: ὁ κύριος
  choice: ప్రభువు
  rationale: దేవునికి సంబంధించిన ప్రమాణ బైబిలు బిరుదును గౌరవప్రదంగా, నిరంతరత్వంతో నిలుపుతుంది.
- source_word: μετὰ σοῦ
  choice: నీకు తోడుగా ఉన్నాడు
  rationale: μετά + షష్ఠీ విభక్తి ‘తోడు/తో’ అనే సాన్నిధ్యాన్ని సూచిస్తుంది. తెలుగులో ‘నీకు తోడుగా ఉన్నాడు’ దైవసాన్నిధ్య భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: మరియను ఉద్దేశించిన κεχαριτωμένη అనే వేదాంతపరంగా సున్నితమైన పదం
  choice: దేవుని అనుగ్రహం పొందినదానా
  alternative: అనుగ్రహపూర్ణురాలా; అత్యధిక అనుగ్రహం పొందినదానా
  rationale: గ్రీకు పరిపూర్ణ కర్మణి కృదంతం మరియ అనుగ్రహానికి గ్రహీత అని తెలియజేస్తుంది. ఈ అనువాదం తరువాతి సిద్ధాంత సూత్రీకరణలను మూలపాఠ్యంలోకి చేర్చకుండా, ఆమెపై దేవుని అనుగ్రహాన్ని బలంగా నిలుపుతుంది. సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచడం చారిత్రక అనువాద పరంపరను గుర్తిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. పలకరింపును పురాతన శైలిలో కాకుండా సాధారణ పాఠకులకు అర్థమయ్యేలా ఇచ్చాం; κεχαριτωμένη యొక్క కర్మణి భావాన్ని స్పష్టంగా నిలిపాం.
