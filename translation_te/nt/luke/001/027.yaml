  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πρὸς παρθένον ⸀ἐμνηστευμένην ἀνδρὶ ᾧ ὄνομα Ἰωσὴφ ἐξ οἴκου Δαυίδ, καὶ τὸ ὄνομα τῆς παρθένου Μαριάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/027.yaml
  text: to a virgin pledged in marriage to a man whose name was Joseph, from the house of David; and the virgin’s name was Mary.
translation:
  language: te
  text: దావీదు వంశానికి చెందిన యోసేపు అనే వ్యక్తితో వివాహం నిశ్చయమైన[a] ఒక కన్య వద్దకు; ఆ కన్య పేరు మరియ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిశ్చితార్థమైన.” గ్రీకు పదం పూర్తి దాంపత్య జీవితం ప్రారంభం కాకముందున్న అధికారికంగా బద్ధమైన స్థితిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో పేరు రూపం “మరియామ్”; తెలుగులో సాధారణంగా “మరియ” అని వాడతారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρθένον / παρθένου
  choice: కన్య
  rationale: ఈ సందర్భంలో గ్రీకు పదానికి ప్రామాణిక అర్థం ‘కన్య’; అదే పదాన్ని వచనంలో మళ్లీ ఉపయోగించడం వల్ల కన్యత్వ భావం స్పష్టంగా నిలుస్తుంది.
- source_word: ἐμνηστευμένην
  choice: వివాహం నిశ్చయమైన
  rationale: ఇది సాధారణ ఆధునిక నిశ్చితార్థం కంటే సామాజికంగా, చట్టపరంగా బలమైన వివాహబద్ధ స్థితిని సూచిస్తుంది. ‘వివాహం నిశ్చయమైన’ అనేది ఆధునిక తెలుగు పాఠకులకు సహజంగా ఉండి ఆ స్థితిని తగినంతగా తెలియజేస్తుంది.
- source_word: ἀνδρὶ
  choice: ఒక వ్యక్తితో
  rationale: ἀνήρ అనే పదానికి ‘పురుషుడు’ లేదా ‘భర్త’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ వివాహం ఇంకా నిశ్చయ స్థితిలో ఉన్నందున ‘భర్త’ అని అనువదించడం వచనం చెప్పేదానికంటే ఎక్కువగా నిర్ధారిస్తుంది; ‘వ్యక్తితో’ సహజమైన తెలుగు.
- source_word: ᾧ ὄνομα Ἰωσὴφ
  choice: యోసేపు అనే
  rationale: గ్రీకు నామకరణ ప్రయోగాన్ని సహజమైన, సంక్షిప్తమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐξ οἴκου Δαυίδ
  choice: దావీదు వంశానికి చెందిన
  rationale: οἶκος ఇక్కడ కుటుంబం లేదా రాజవంశ సంబంధాన్ని సూచిస్తుంది. పదశః ‘ఇల్లు’ కంటే ‘వంశం’ ఆధునిక తెలుగులో ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: Μαριάμ
  choice: మరియ
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన పేరురూపం; గ్రీకు రూపానికి మరింత దగ్గరైన ‘మరియాము’ను పాదసూచికలో ఇస్తున్నాం.
theological_decisions:
- issue: παρθένος పదంలోని కన్యత్వ భావాన్ని నిలుపుకోవడం
  choice: కన్య
  alternative: యువతి
  rationale: లూకా ఉపయోగించిన పదం మరియు సమీప సందర్భం ‘కన్య’ అనే అర్థానికే బలమైన ఆధారం ఇస్తాయి. ‘యువతి’ అని పెడితే మూలపాఠంలోని స్పష్టమైన కన్యత్వ భావం మసకబారుతుంది.
- issue: మరియ వివాహస్థితిని ఎలా వ్యక్తం చేయాలి
  choice: వివాహం నిశ్చయమైన
  alternative: నిశ్చితార్థమైన / పెళ్లి కుదిరిన
  rationale: గ్రీకు పదం పూర్తి వివాహజీవితం ప్రారంభం కాకముందే ఉన్న, అయితే అధికారికంగా బద్ధమైన స్థితిని సూచిస్తుంది. ఎలాంటి ప్రత్యేక వివాహ సిద్ధాంతాన్నీ చేర్చకుండా ఆ ఉద్రిక్తతను ఈ ప్రయోగం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ఇది వచనఖండమే అయినప్పటికీ, తెలుగు వాక్య సంపూర్ణత కోసం ముందరి వచనంలోని ప్రధాన క్రియ ‘దేవదూత పంపబడ్డాడు’ను సందర్భానుసారంగా చేర్చాం; దీనివల్ల కొత్త సమాచారమేమీ చేరదు. ‘దావీదు వంశం’ అనే రూపం రాజవంశ/కుటుంబ భావాన్ని సాధారణ పాఠకుడికి స్పష్టంగా అందిస్తుంది.
