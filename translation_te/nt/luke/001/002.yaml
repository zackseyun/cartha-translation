source:
  edition: SBLGNT
  text: καθὼς παρέδοσαν ἡμῖν οἱ ἀπ’ ἀρχῆς αὐτόπται καὶ ὑπηρέται γενόμενοι τοῦ λόγου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/002.yaml
  text: just as those who from the beginning were eyewitnesses and became servants of the word handed them down to us,[a]
translation:
  language: te
  text: మొదటి నుంచీ ప్రత్యక్ష సాక్షులుగా ఉండి, వాక్యానికి[a] సేవకులైనవారు వాటిని మనకు అందజేసిన ప్రకారమే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సందేశానికి.’ గ్రీకు λόγος అనే పదానికి ‘వాక్యం,’ ‘సందేశం,’ లేదా ‘వృత్తాంతం’ అనే అర్థాలు ఉండవచ్చు; ఇక్కడ అది యేసును గురించిన ప్రకటిత సందేశాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: ప్రకారమే
  rationale: మునుపటి వాక్యంలో చెప్పిన ప్రయత్నాలు ప్రత్యక్ష సాక్షుల పరంపరకు అనుగుణంగా ఉన్నాయని తెలిపే అనుసంధానాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: παρέδοσαν
  choice: అందించిన
  rationale: సమాచారాన్ని లేదా సంప్రదాయాన్ని విశ్వసనీయంగా ఒకరి నుంచి మరొకరికి చేరవేసిన భావాన్ని తెలుపుతుంది; కేవలం భౌతికంగా ‘అప్పగించడం’ అనే అర్థానికి పరిమితం కాదు.
- source_word: ἡμῖν
  choice: మనకు
  rationale: గ్రీకు దత్తివిభక్తిలోని పరోక్ష కర్మను నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἱ ἀπ’ ἀρχῆς
  choice: మొదటినుంచి ... వారు
  rationale: సంఘటనల ఆరంభకాలం నుంచే ఉన్న సమూహాన్ని సూచించే కాలభావాన్ని కాపాడుతుంది.
- source_word: αὐτόπται
  choice: ప్రత్యక్ష సాక్షులు
  rationale: సంఘటనలను స్వయంగా చూసినవారనే ఖచ్చితమైన భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὑπηρέται
  choice: సేవకులు
  rationale: అధికారిక సంఘపదవిని సూచించకుండా, వాక్యానికి సేవ చేసినవారనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: γενόμενοι
  choice: సేవకులైనవారు
  rationale: γενόμενοι లోని ‘అయిన/మారిన’ భావాన్ని కాపాడుతూ, వారు మొదటినుంచి ప్రత్యక్ష సాక్షులుగా ఉండి తరువాత వాక్యసేవకులైనారనే సాధ్యమైన కాలభేదాన్ని బలవంతంగా చెరపదు.
- source_word: τοῦ λόγου
  choice: వాక్యానికి
  rationale: λόγος పదంలోని విస్తృతిని, సంప్రదాయ పరిచయాన్ని కాపాడుతుంది; సందర్భంలో ఇది యేసును గురించిన ప్రకటిత సందేశాన్ని సూచించే అవకాశాన్ని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: τοῦ λόγου యొక్క సూచన
  choice: ప్రధాన పాఠ్యంలో ‘వాక్యం’
  alternative: ‘సందేశం’ లేదా ‘వృత్తాంతం’
  rationale: ఇక్కడ λόγος క్రీస్తుకు ఇచ్చే వ్యక్తిగత బిరుదుగా కాక, యేసును గురించిన ప్రకటిత సందేశంగా ఉండే అవకాశం ఎక్కువ. అయినా మూలపదపు విస్తృతిని తగ్గించకుండా ‘వాక్యం’ ఉంచి, భావార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: γενόμενοι తెలియజేసే స్థితిమార్పు
  choice: ‘ప్రత్యక్ష సాక్షులుగా ఉండి, ... సేవకులైనవారు’
  alternative: ‘ప్రత్యక్ష సాక్షులు, వాక్యసేవకులుగా ఉన్నవారు’
  rationale: మూలంలోని γενόμενοι సూచించే ‘అయినవారు’ అనే భావాన్ని పూర్తిగా సమతలపరచకుండా, ప్రత్యక్ష సాక్షిత్వం మరియు తరువాతి సేవ మధ్య ఉండగల ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఇది లూకా 1:1తో కొనసాగుతున్న ఉపవాక్యం కాబట్టి చివర కామా ఉంచబడింది. ‘వాటిని’ అనే సర్వనామం ముందటి వచనంలోని నెరవేరిన సంగతులను తిరిగి సూచిస్తుంది.
