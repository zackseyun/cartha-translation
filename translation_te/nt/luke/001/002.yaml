revisions:
- from: మొదటినుంచి ప్రత్యక్ష సాక్షులుగా ఉండి, వాక్యానికి[a] సేవకులైనవారు వాటిని మనకు అందించిన ప్రకారమే,
  to: మొదటి నుంచీ ప్రత్యక్ష సాక్షులుగా ఉండి, వాక్యానికి[a] సేవకులైనవారు వాటిని మనకు అందజేసిన ప్రకారమే,
  rationale: 'The revision makes only minor lexical and orthographic improvements: ‘మొదటి నుంచీ’ standardizes the temporal expression, and ‘అందజేసిన’ better reflects the tradition-transmission force of παρέδοσαν. The wording continues to preserve the participial nuance of γενόμενοι (‘సేవకులైనవారు’), the lexical breadth of λόγος, and the verse’s dependence on Luke 1:1.'
