id: LUK.1.13
reference: Luke 1:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ ἄγγελος· Μὴ φοβοῦ, Ζαχαρία, διότι εἰσηκούσθη ἡ δέησίς σου, καὶ ἡ γυνή σου Ἐλισάβετ γεννήσει υἱόν σοι, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/013.yaml
  text: But the angel said to him[a], “Do not be afraid, Zechariah, because your prayer has been heard, and your wife Elizabeth will bear you a son[b], and you shall call his name John.”
translation:
  language: te
  text: 'అయితే దేవదూత అతనితో ఇలా అన్నాడు: “జెకర్యా, భయపడకు. ఎందుకంటే నీ ప్రార్థన వినబడింది; నీ భార్య ఎలిసబేతు నీకు ఒక కుమారుణ్ణి కంటుంది. అతనికి యోహాను అని పేరు పెడతావు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: అయితే ... అన్నాడు
  rationale: δέ స్వల్పమైన కథన మలుపును సూచిస్తుంది. ‘అయితే’ జెకర్యా భయానికి దేవదూత ఇచ్చిన ప్రతిస్పందనను సహజంగా కలుపుతుంది; బలమైన విరోధాన్ని మోపదు.
- source_word: ὁ ἄγγελος
  choice: దేవదూత
  rationale: ఈ సందర్భంలో ἄγγελος పరలోక దూతను సూచిస్తోంది; ఆధునిక ప్రామాణిక తెలుగులో ‘దేవదూత’ స్పష్టమైన, స్థిరమైన పదం.
- source_word: Μὴ φοβοῦ
  choice: భయపడకు
  rationale: ప్రస్తుత నిషేధార్థక ఆజ్ఞను సహజమైన ఏకవచన సంబోధనగా అందిస్తుంది.
- source_word: Ζαχαρία
  choice: జెకర్యా
  rationale: గ్రీకు Ζαχαρία అనే సంబోధన రూపానికి దగ్గరగా ఉండే, తెలుగులో సులభంగా పలకగల రూపం.
- source_word: διότι
  choice: ఎందుకంటే
  rationale: జెకర్యా ఎందుకు భయపడకూడదో తెలిపే కారణ సంబంధాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: εἰσηκούσθη
  choice: వినబడింది
  rationale: గ్రీకులో ఉన్న కర్మణి రూపాన్ని నిలుపుతూ, ఎవరు విన్నారో—సందర్భంలో దేవుడు—అని అనువాదంలో ప్రత్యక్షంగా చేర్చదు.
- source_word: ἡ δέησίς σου
  choice: నీ ప్రార్థన
  rationale: δέησις అనేది అవసరాన్ని బట్టి చేసే మనవి లేదా విజ్ఞాపన. ప్రార్థనా సందర్భంలో ‘ప్రార్థన’ సహజంగా అర్థమవుతుంది.
- source_word: ἡ γυνή σου Ἐλισάβετ
  choice: నీ భార్య ఎలిసబేతు
  rationale: స్వామ్యసూచక σου మరియు కుటుంబ సందర్భం వల్ల γυνή ఇక్కడ ‘భార్య’ అని స్పష్టంగా అర్థమవుతుంది.
- source_word: γεννήσει υἱόν σοι
  choice: నీకు ఒక కుమారుణ్ణి కంటుంది
  rationale: స్త్రీ కర్తగా ఉన్న γεννάω ప్రసవించడాన్ని సూచిస్తుంది; σοι లోని ప్రయోజన/సంబంధ భావాన్ని ‘నీకు’ నిలుపుతుంది.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην
  choice: అతనికి యోహాను అని పేరు పెట్టాలి
  rationale: గ్రీకు నామకరణ ప్రయోగం యొక్క భావాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది. భవిష్యద్రూపం ఇక్కడ దైవ ఆదేశ ఛాయను కలిగి ఉండటంతో ‘పెట్టాలి’ అనుకూలం.
- source_word: Ἰωάννην
  choice: యోహాను
  rationale: నూతన నిబంధన తెలుగు వాడుకలో స్థిరపడిన పేరు; గ్రీకు Ἰωάννης‌కు అనుగుణమైన సంప్రదాయ రూపం.
theological_decisions:
- issue: ‘వినబడింది’ అనే కర్మణి రూపంలోని అంతర్లీన కర్త
  choice: కర్తను పేర్కొనకుండా ‘నీ ప్రార్థన వినబడింది’ అని ఉంచడం
  alternative: ‘దేవుడు నీ ప్రార్థన విన్నాడు’ అని స్పష్టం చేయడం
  rationale: ప్రార్థనా సందర్భంలో దేవుడే విన్నాడని సహజంగా అర్థమైనా, గ్రీకు వాక్యం కర్తను ప్రత్యక్షంగా పేర్కొనదు. అందువల్ల అంతర్లీన దైవ కర్మణి భావాన్ని పరిష్కరించకుండా నిలుపుతుంది.
- issue: καλέσεις యొక్క ఆదేశ ఛాయ
  choice: ‘పేరు పెట్టాలి’
  alternative: ‘పేరు పెడతావు’
  rationale: సూచక భవిష్యద్రూపం ఉన్నప్పటికీ ప్రకటన సందర్భంలో ఇది నామకరణ ఆదేశాన్ని కూడా మోస్తుంది. తెలుగు ‘పెట్టాలి’ ఆ ఛాయను సహజంగా తెలియజేస్తుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. మూలంలోని కర్మణి నిర్మాణం మరియు నామకరణ ఆదేశ ఛాయను సాధ్యమైనంత సహజంగా నిలిపింది.
