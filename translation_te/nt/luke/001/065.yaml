id: LUK.1.65
reference: Luke 1:65
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐπὶ πάντας φόβος τοὺς περιοικοῦντας αὐτούς, καὶ ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας διελαλεῖτο πάντα τὰ ῥήματα ταῦτα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/065.yaml
  text: And fear came upon all those living around them[b][a], and throughout all the hill country of Judea all these things were being talked about.
translation:
  language: te
  text: అప్పుడు వారి చుట్టుపక్కల నివసిస్తున్న వారందరిపై భయం[a] కలిగింది. యూదయ కొండప్రాంతమంతటా ఈ సంగతులన్నీ[b] గురించి ప్రజలు మాట్లాడుకుంటూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘భయం’ అనే మాట దేవుని కార్యం స్పష్టంగా కనిపించినప్పుడు కలిగే విస్మయభరితమైన భక్తిభావాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఈ మాటలన్నీ,’ ‘ఈ విషయాలన్నీ.’ గ్రీకు పదం పలికిన మాటలను గానీ, వాటిలో చెప్పబడిన సంఘటనలను గానీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐπὶ πάντας ... φόβος
  choice: వారందరిపై భయం కలిగింది
  rationale: భయం వారిని ఆవరించినట్లు తెలిపే గ్రీకు ప్రయోగంలోని సంఘటనాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: φόβος
  choice: భయం
  rationale: ఈ పదం భయంతో పాటు దేవుని కార్యం పట్ల విస్మయభరితమైన భక్తిభావాన్ని కూడా సూచించగలదు. ప్రధాన పాఠంలో విస్తరించకుండా నేరుగా ‘భయం’ అని ఉంచడం మూలంలోని భావవిస్తృతిని కాపాడుతుంది.
- source_word: τοὺς περιοικοῦντας αὐτούς
  choice: వారి చుట్టుపక్కల నివసిస్తున్న వారు
  rationale: ‘వారి పొరుగువారు’ అని సంక్షిప్తం చేయకుండా, వారి పరిసరాల్లో నివసించేవారనే మూలపద భావాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας
  choice: యూదయ కొండప్రాంతమంతటా
  rationale: ὀρεινή సూచించే ఎత్తైన లేదా కొండల ప్రాంతాన్ని సహజమైన భౌగోళిక తెలుగులో తెలియజేస్తుంది; ‘అంతటా’ మొత్తం ప్రాంతంలో వ్యాప్తిని వ్యక్తం చేస్తుంది.
- source_word: διελαλεῖτο
  choice: ప్రజలు మాట్లాడుకుంటూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం సూచించే కొనసాగుతున్న, విస్తృతమైన చర్చను సహజ తెలుగులో వ్యక్తం చేస్తుంది. గ్రీకులోని కర్మణి రూపాన్ని తెలుగులో సహజమైన కర్తరి నిర్మాణంగా మార్చింది.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: ఈ సంగతులన్నీ
  rationale: ῥήματα మాటలు, విషయాలు లేదా చెప్పబడుతున్న సంఘటనలను సూచించగలదు. కథన సందర్భంలో ‘సంగతులు’ ఈ భావవిస్తృతిని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: దేవుని కార్యానికి ప్రతిస్పందనగా φόβος యొక్క భావఛాయ
  choice: ప్రధాన పాఠంలో ‘భయం’
  alternative: ‘విస్మయం’ లేదా ‘భక్తిభయం’
  rationale: సందర్భంలో దేవుని స్పష్టమైన కార్యం పట్ల విస్మయం అంతర్లీనంగా ఉండవచ్చు. అయినా దానిని ప్రధాన పాఠంలో వ్యాఖ్యానాత్మకంగా విస్తరించకుండా, మూలంలోని ఉద్వేగాన్ని ‘భయం’ ద్వారా నిలిపి, భావఛాయను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలిని వాడాం. ‘మాట్లాడుకుంటూ ఉన్నారు’ కొనసాగుతున్న ప్రజా చర్చను సహజంగా తెలియజేస్తుంది. పాదసూచిక గుర్తులు రెండూ ప్రధాన పాఠంలో సంబంధిత పదాల వెంట ఉంచబడ్డాయి.
