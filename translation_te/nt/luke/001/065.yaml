  source_fidelity: 'గ్రీకు వాక్యనిర్మాణంలోని రెండు ప్రధాన భాగాలు నమ్మకంగా ప్రతిఫలించాయి: చుట్టుపక్కల నివసించేవారందరిపై భయం కలగడం, యూదయ కొండప్రాంతమంతట ఈ సంగతులు విస్తృతంగా చర్చకు రావడం. ‘ఈ సంగతులన్నీ’ అనేది ῥήματα యొక్క ‘మాటలు/విషయాలు/సంగతులు’ అనే సందర్భానుగుణ విస్తృతిని సముచితంగా కాపాడుతుంది.'
