  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. గ్రీకు మూలంలోని సుమారు కాలవ్యవధిని ‘దాదాపు’తో స్పష్టంగా నిలిపాం.
