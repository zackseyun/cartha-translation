  text: Ἔμεινεν δὲ Μαριὰμ σὺν αὐτῇ ⸀ὡς μῆνας τρεῖς, καὶ ὑπέστρεψεν εἰς τὸν οἶκον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/056.yaml
  text: And Mary stayed with her about three months[a], and returned to her home.
translation:
  language: te
  text: మరియ ఆమెతో దాదాపు మూడు నెలలు ఉండి, తన ఇంటికి తిరిగి వెళ్లింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔμεινεν
  choice: ఉండి
  rationale: μένω యొక్క భూతకాల రూపం ఒక చోట కొంతకాలం కొనసాగి ఉండడాన్ని సూచిస్తుంది; తెలుగులో ‘ఉండి’ సహజంగా, సంక్షిప్తంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ ఇక్కడ స్వల్ప కథన అనుసంధానకం. తెలుగు వాక్యప్రవాహంలో ‘ఉండి ... తిరిగి వెళ్లింది’ అనే నిర్మాణమే అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది; ‘మరియు’ చేర్చడం కృత్రిమంగా ఉంటుంది.
- source_word: Μαριὰμ
  choice: మరియ
  rationale: తెలుగు బైబిలు సంప్రదాయంలో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
- source_word: σὺν αὐτῇ
  choice: ఆమెతో
  rationale: σύν + దత్తివిభక్తి సహవాసాన్ని సూచిస్తుంది. సందర్భంలో ‘ఆమె’ ఎలీసబెతును సూచిస్తుంది; మూలంలోని సర్వనామాన్ని అలాగే నిలిపాం.
- source_word: ὡς μῆνας τρεῖς
  choice: దాదాపు మూడు నెలలు
  rationale: కాల పరిమాణానికి ముందు వచ్చిన ὡς సుమారుతనాన్ని సూచిస్తుంది. ‘దాదాపు’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: ὑπέστρεψεν
  choice: తిరిగి వెళ్లింది
  rationale: ముందున్న స్థలానికి తిరిగి వెళ్లడాన్ని ఈ క్రియ సూచిస్తుంది; ‘తిరిగి వెళ్లింది’ తెలుగు కథనంలో సహజంగా ఉంటుంది.
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: తన ఇంటికి
  rationale: ఇక్కడ οἶκος గృహస్థులను కాక గమ్యస్థలమైన ఇంటిని సూచిస్తుంది. కర్త మరియే కాబట్టి αὐτῆς ను తెలుగులో సహజమైన ప్రతిబింబ సర్వనామం ‘తన’తో వ్యక్తం చేశాం.
