  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ οὐκ ⸀ἐδύνατο λαλῆσαι αὐτοῖς, καὶ ἐπέγνωσαν ὅτι ὀπτασίαν ἑώρακεν ἐν τῷ ναῷ· καὶ αὐτὸς ἦν διανεύων αὐτοῖς, καὶ διέμενεν κωφός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/022.yaml
  text: But when he came out[a], he was not able to speak to them, and they realized that he had seen a vision in the sanctuary[b]. And he kept making signs to them and remained mute.
translation:
  language: te
  text: అయితే అతడు బయటికి వచ్చినప్పుడు వారితో మాట్లాడలేకపోయాడు. అతడు పవిత్రస్థలంలో[a] ఒక దర్శనం చూశాడని వారు గ్రహించారు. అతడు వారికి సైగలు చేస్తూనే ఉండి, మాట్లాడలేని వాడిగానే ఉండిపోయాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవాలయంలో.” ఇక్కడి గ్రీకు పదం దేవాలయ ప్రాంగణమంతటిని కాక, మరింత ప్రత్యేకంగా దేవాలయపు అంతర్గత పవిత్రస్థలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “మూగవాడిగానే ఉండిపోయాడు.” ఇక్కడి గ్రీకు విశేషణం మాట్లాడలేని వ్యక్తిని సూచించవచ్చు; కొన్ని సందర్భాల్లో అది చెవిటితనాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: అతడు బయటికి వచ్చినప్పుడు
  rationale: ప్రధాన క్రియకు ముందున్న aorist participleను సహజమైన కాలార్థక ఉపవాక్యంగా అనువదించి, సంఘటనల క్రమాన్ని నిలుపుతుంది.
- source_word: οὐκ ἐδύνατο λαλῆσαι
  choice: వారితో మాట్లాడలేకపోయాడు
  rationale: δύναμαι + infinitive తెలిపే అసమర్థతను స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπέγνωσαν
  choice: వారు గ్రహించారు
  rationale: కనిపించిన ఆధారాన్ని బట్టి స్పష్టమైన నిర్ధారణకు వచ్చారనే భావాన్ని సందర్భానుగుణంగా తెలియజేస్తుంది.
- source_word: ὀπτασίαν
  choice: ఒక దర్శనం
  rationale: ఈ సందర్భంలో అతీంద్రియమైన లేదా ప్రకటనాత్మకమైన దృశ్యానుభవాన్ని ‘దర్శనం’ సహజంగా తెలియజేస్తుంది.
- source_word: ἐν τῷ ναῷ
  choice: పవిత్రస్థలంలో
  rationale: ναός సాధారణంగా దేవాలయ ప్రాంగణమంతటినీ కాక, దేవాలయపు అంతర్గత పవిత్రస్థలాన్ని సూచిస్తుంది; అందువల్ల మూలంలోని ప్రత్యేకతను నిలుపుతుంది.
- source_word: ἦν διανεύων
  choice: సైగలు చేస్తూనే ఉండి
  rationale: periphrastic imperfect సూచించే కొనసాగుతున్న చర్యను ‘చేస్తూనే’ అనే రూపం స్పష్టంగా అందిస్తుంది.
- source_word: διέμενεν
  choice: ఉండిపోయాడు
  rationale: ఆ స్థితి కొనసాగిందనే imperfect భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: κωφός
  choice: మాట్లాడలేని వాడిగానే
  rationale: ఈ పదం మూగతనాన్ని, కొన్ని సందర్భాల్లో చెవిటితనాన్ని కూడా సూచించగలదు. తక్షణ సందర్భం మాట్లాడలేకపోవడాన్ని స్పష్టంగా ముందుకు తెస్తున్నందున ప్రధాన పాఠ్యంలో అదే భావాన్ని ఉంచి, పదంలోని విస్తృత సాధ్యతను పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: జెకర్యాకు కలిగిన స్థితిని సూచించే κωφός పదార్థం
  choice: ప్రధాన పాఠ్యంలో మాట్లాడలేని స్థితిగా అనువదించడం
  alternative: మూగవాడు; చెవిటి మరియు మూగవాడు
  rationale: ఈ వచనం అతడు మాట్లాడలేకపోవడాన్ని స్పష్టంగా చెబుతుంది; అయితే κωφός కొన్నిసార్లు చెవిటితనాన్ని కూడా సూచించగలదు. ప్రధాన పాఠ్యం తక్షణ సందర్భాన్ని అనుసరిస్తూ, విస్తృత అర్థసాధ్యతను పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘పవిత్రస్థలం’ ద్వారా ναός మరియు మొత్తం దేవాలయ ప్రాంగణం మధ్యనున్న భేదం నిలుపబడింది. κωφός లోని సాధ్యమైన ద్వంద్వార్థాన్ని ప్రధాన పాఠ్యంలో అతిగా నిర్ణయించకుండా పాదసూచికలో భద్రపరచాం.
