  yaml_path: translation/nt/luke/001/009.yaml
  text: according to the custom of the priesthood[a], he was chosen by lot to burn incense when he entered into the temple of the Lord,
translation:
  language: te
  text: యాజకసేవ ఆచారం ప్రకారం, ప్రభువు ఆలయంలోకి ప్రవేశించి ధూపం వేయే బాధ్యత అతనికి చీటి ద్వారా దక్కింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ τὸ ἔθος τῆς ἱερατείας
  choice: యాజక సేవా ఆచారం ప్రకారం
  rationale: κατά + accusative established practiceకు అనుగుణతను తెలియజేస్తుంది; ἱερατεία వ్యక్తిగత యాజకులను మాత్రమే కాక యాజక పదవి/సేవను సూచిస్తుంది. ఈ తెలుగు పదబంధం సంస్థాగతమైన యాజక సేవా విధానాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἔλαχε
  choice: చీటి వేయగా ... అతనికి దక్కింది
  rationale: λαγχάνω చీటి ద్వారా ఒక బాధ్యత లేదా అవకాశం దక్కటాన్ని సూచిస్తుంది. ఈ రూపం చీటి వేసే పద్ధతినీ, ఫలితం అతనికి దక్కిందన్న భావాన్నీ నిలుపుతుంది.
- source_word: τοῦ θυμιᾶσαι
  choice: ధూపం వేయడం
  rationale: θυμιάω ధూపాన్ని కాల్చడం లేదా అర్పించడాన్ని సూచిస్తుంది. తెలుగు ఆరాధనా సందర్భంలో ‘ధూపం వేయడం’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: εἰσελθὼν εἰς τὸν ναὸν
  choice: ఆలయంలోకి ప్రవేశించి
  rationale: Aorist participle ప్రధాన చర్యతో సంబంధమైన ప్రవేశాన్ని తెలియజేస్తుంది. ναόςకు అందరికీ అర్థమయ్యే ‘ఆలయం’ను ప్రధాన పాఠంలో ఉంచి, దాని మరింత నిర్దిష్ట అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: τοῦ κυρίου
  choice: ప్రభువు
  rationale: κύριος ఇక్కడ దేవుణ్ణి సూచిస్తుంది; ‘ప్రభువు’ ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్థిరమైన అనువాదం.
theological_decisions:
- issue: ఆలయ సందర్భంలో ναός అనువాదం
  choice: ఆలయం
  alternative: ఆలయపు పవిత్రస్థలం
  rationale: ναός విస్తృత ఆలయ ప్రాంగణం కంటే ఆలయ భవనాన్ని, సందర్భానుసారం లోపలి పవిత్రస్థలాన్ని సూచించవచ్చు. ధూపార్పణ సందర్భంలో నిర్దిష్టమైన అర్థం సంభావ్యమైనప్పటికీ, ప్రధాన పాఠంలో సులభగ్రాహ్యమైన ‘ఆలయం’ను ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే యాజక సేవ, చీటి, ధూపార్పణ అనే మూలపాఠంలోని ఆచార సంబంధిత వివరాలు నిలుపబడ్డాయి.
