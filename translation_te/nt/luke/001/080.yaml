  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τὸ δὲ παιδίον ηὔξανε καὶ ἐκραταιοῦτο πνεύματι, καὶ ἦν ἐν ταῖς ἐρήμοις ἕως ἡμέρας ἀναδείξεως αὐτοῦ πρὸς τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/080.yaml
  text: And the child kept growing and becoming strong in spirit[c][b][a], and he was in the wilderness until the day of his public appearance to Israel.
translation:
  language: te
  text: ఆ బాలుడు పెరుగుతూ, ఆత్మలో బలపడుతూ ఉండేవాడు.[a] అతడు ఇశ్రాయేలు ప్రజలకు బహిరంగంగా ప్రత్యక్షమయ్యే రోజు వరకు అరణ్య ప్రాంతాల్లో ఉండేవాడు.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అంతరంగంలో బలపడుతూ ఉండేవాడు”; లేదా “పరిశుద్ధాత్మలో బలపడుతూ ఉండేవాడు.” గ్రీకు పదం సాధారణంగా అంతరంగిక లేదా ఆత్మీయ బలాన్ని గానీ, ప్రత్యేకంగా పరిశుద్ధాత్మతో సంబంధాన్ని గానీ సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: గ్రీకులో బహువచనం ఉంది; అక్షరార్థంగా “అరణ్యాల్లో” లేదా “జనావాసం లేని ప్రాంతాల్లో.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “ఇశ్రాయేలు ప్రజల ఎదుట అతడు ప్రత్యక్షమయ్యే రోజు వరకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίον
  choice: ఆ బాలుడు
  rationale: యోహాను బాల్యదశలో ఉన్నాడని సహజంగా తెలియజేస్తుంది; గ్రీకు పదంలోని వయస్సు విస్తృతిని అతిగా నిర్దిష్టం చేయదు.
- source_word: ηὔξανε
  choice: పెరుగుతూ ... ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న ఎదుగుదలను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκραταιοῦτο
  choice: బలపడుతూ ఉన్నాడు
  rationale: కొనసాగుతున్న బలవృద్ధిని చూపుతూ, అది స్వయంగా పెరిగిన బలమా లేక బలపరచబడడమా అన్న మధ్య/కర్మణి రూపంలోని సూక్ష్మతను అతిగా నిర్ణయించదు.
- source_word: πνεύματι
  choice: ఆత్మలో
  rationale: దత్తివిభక్తి సూచించే పరిధి లేదా అంశాన్ని నిలుపుతుంది; ఇది మానవ అంతరాత్మను గానీ పరిశుద్ధాత్మతో సంబంధాన్ని గానీ సూచించే అవకాశాన్ని తెరిచి ఉంచుతుంది.
- source_word: ἐν ταῖς ἐρήμοις
  choice: అరణ్య ప్రాంతాల్లో
  rationale: గ్రీకులోని బహువచనాన్ని నిలుపుతూ, జనావాసం లేని ప్రాంతాలు అనే విస్తృత భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: ἀναδείξεως
  choice: ప్రత్యక్షమయ్యే
  rationale: ప్రజల ముందుకు అధికారికంగా లేదా బహిరంగంగా రావడం అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πρὸς τὸν Ἰσραήλ
  choice: ఇశ్రాయేలు ప్రజల ఎదుట
  rationale: ఇక్కడ ఇశ్రాయేలు దేశభూభాగం కంటే ప్రజలే ఉద్దేశిత ప్రేక్షకులని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యోహాను అభివృద్ధిలో πνεύματι యొక్క భావం
  choice: ఆత్మలో
  alternative: పరిశుద్ధాత్మలో; ఆత్మీయంగా; అంతరంగంలో
  rationale: గ్రీకు పదానికి నిర్దిష్ట ఉపపదం లేదు; కాబట్టి పరిశుద్ధాత్మనే స్పష్టంగా ఉద్దేశించిందని నిర్ధారించకుండా, ఆత్మసంబంధమైన లేదా అంతరంగ బలాన్ని సూచించే నిజమైన సందిగ్ధతను ప్రధాన పాఠం మరియు పాదటిప్పణి నిలుపుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు అసంపూర్ణ భూతకాల క్రియల కొనసాగింపు భావాన్ని ‘పెరుగుతూ, బలపడుతూ ఉన్నాడు’తో తెలిపాం. ‘ఆత్మలో’ అనే పదబంధంలోని ఉద్దేశపూర్వక సందిగ్ధతను పాదటిప్పణిలో వివరించాం; ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠంలో ఉంది.
