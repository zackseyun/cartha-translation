id: LUK.1.17
reference: Luke 1:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ αὐτὸς προελεύσεται ἐνώπιον αὐτοῦ ἐν πνεύματι καὶ δυνάμει Ἠλίου, ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα καὶ ἀπειθεῖς ἐν φρονήσει δικαίων, ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/017.yaml
  text: And he will go before him in the spirit and power of Elijah[a], to turn the hearts of fathers to children, and the disobedient to the wisdom of the righteous[c][b], to prepare for the Lord a people made ready.
translation:
  language: te
  text: అతడు ఏలీయా ఆత్మతోను శక్తితోను ఆయనకు ముందుగా వెళ్తాడు—తండ్రుల హృదయాలను పిల్లలవైపు మళ్లించడానికి, అవిధేయులను నీతిమంతుల వివేకం వైపు మళ్లించడానికి, ప్రభువు కోసం సన్నద్ధమైన ప్రజలను ఏర్పరచడానికి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προελεύσεται ἐνώπιον αὐτοῦ
  choice: ఆయనకు ముందుగా వెళ్తాడు
  rationale: ముందుగా వెళ్లడం అనే కార్యార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తూనే, ‘ఆయన’ ఎవరనే విషయాన్ని మూలపాఠంలాగే సందర్భానికి వదిలివేస్తుంది.
- source_word: ἐν πνεύματι καὶ δυνάμει Ἠλίου
  choice: ఏలీయా ఆత్మతో, శక్తితో
  rationale: ఏలీయాతో సమానమైన ప్రవక్త సేవను, దానికి కలిగిన ఆత్మీయ శక్తిని సూచించే గ్రీకు పదబంధాన్ని పారదర్శకంగా నిలుపుతుంది.
- source_word: ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα
  choice: తండ్రుల హృదయాలను పిల్లలవైపు మళ్లించడానికి
  rationale: మలాకీ 4:6 ప్రతిధ్వనిని, కుటుంబ సంబంధాల పునరుద్ధరణ భావాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: ἀπειθεῖς
  choice: అవిధేయులను
  rationale: ఒప్పుకోకపోవడం, లోబడకపోవడం, తిరుగుబాటు ధోరణి అనే విస్తృత నైతిక భావాన్ని కాపాడుతుంది.
- source_word: ἐν φρονήσει δικαίων
  choice: నీతిమంతుల వివేకంవైపు
  rationale: φρόνησις‌లోని ఆచరణాత్మక అవగాహన, వివేచన భావాలను ‘వివేకం’ తెలియజేస్తుంది; మళ్లించడం అనే క్రియతో దిశార్థాన్ని ‘వైపు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον
  choice: ప్రభువు కోసం సన్నద్ధమైన ప్రజలను ఏర్పరచడానికి
  rationale: κατεσκευασμένον సూచించే సిద్ధస్థితిని ‘సన్నద్ధమైన’ నిలుపుతుంది; ἑτοιμάσαι యొక్క ఉద్దేశాన్ని తెలుగులో అనవసర పునరుక్తి లేకుండా ‘ఏర్పరచడానికి’ తెలియజేస్తుంది.
theological_decisions:
- issue: ఏలీయా భాషలోని వ్యక్తిత్వం, పాత్ర
  choice: ఏలీయా ఆత్మతో, శక్తితో సేవ చేయడం
  alternative: ఏలీయా స్వయంగా అక్షరార్థంగా తిరిగి రావడం
  rationale: మూలపాఠం ‘ఏలీయా ఆత్మతో, శక్తితో’ అని చెబుతుంది; కాబట్టి ప్రవక్తీయ కొనసాగింపు, శక్తి అనే భావాన్ని నిలుపుతూ వ్యక్తిగత గుర్తింపును పాఠ్యంలో చేర్చలేదు.
- issue: ‘ఆయన’ మరియు ‘ప్రభువు’ పదాల నిర్దేశం
  choice: మూలపాఠంలోని సర్వనామాన్ని, బిరుదును యథాతథంగా ఉంచడం
  alternative: ప్రధాన పాఠ్యంలో ‘మెస్సీయ/యేసు’ అని స్పష్టీకరించడం
  rationale: సందర్భం నిర్దేశాన్ని తెలియజేసినా, ఈ వచనం స్వయంగా αὐτοῦ మరియు κυρίῳ అనే రూపాలనే వాడుతుంది; అందువల్ల అసలైన సంక్షిప్తత, భావతీవ్రత కాపాడబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే ప్రవక్తీయ సందర్భానికి తగిన గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని ఉద్దేశార్థక క్రియారూపాలను డాష్ తరువాత ‘మళ్లించడానికి… ఏర్పరచడానికి’ అనే సమాంతర నిర్మాణంతో నిలుపుతూ, తెలుగులో స్పష్టత కోసం చివర ‘అలా వెళ్తాడు’ అని చేర్చబడింది.
