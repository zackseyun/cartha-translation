  text: πεινῶντας ἐνέπλησεν ἀγαθῶν καὶ πλουτοῦντας ἐξαπέστειλεν κενούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/053.yaml
  text: He has filled the hungry with good things[a], and sent the rich away empty.
translation:
  language: te
  text: ఆకలితో ఉన్నవారిని మంచి వాటితో నింపాడు; ధనవంతులను ఖాళీగా[a] పంపివేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేక, ‘వట్టి చేతులతో.’
    reason: κενούς అనే పదానికి సందర్భానుకూలమైన భావానువాద ప్రత్యామ్నాయం; అయితే ‘ఖాళీగా’ మూలంలోని విస్తృత భావాన్ని మరింత నేరుగా నిలుపుతుంది.
lexical_decisions:
- source_word: πεινῶντας
  choice: ఆకలితో ఉన్నవారిని
  rationale: వర్తమాన క్రియావిశేషణం నామవాచకంగా వాడబడింది. ఈ రూపం ఆకలిగొన్న ప్రజలను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది; ఆకలి తీవ్రతను మూలపాఠానికి మించి పెంచదు.
- source_word: ἐνέπλησεν
  choice: నింపాడు
  rationale: ఈ క్రియ యొక్క ప్రాథమిక భావాన్ని నేరుగా నిలుపుతుంది. స్తుతిగీతంలో దేవుని కార్యాన్ని నిర్ణయాత్మకంగా జరిగినదిగా చెప్పే భూతకాల రూపం తెలుగులో సహజంగా ఉంది.
- source_word: ἀγαθῶν
  choice: మంచి వాటితో
  rationale: నింపబడిన దేనితో అన్న విషయాన్ని తెలిపే జనిటివ్‌ను నేరుగా వ్యక్తం చేస్తుంది. ‘బహుమతులు’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని కానుక భావం చేరుతుంది.
- source_word: πλουτοῦντας
  choice: ధనవంతులను
  rationale: నామవాచకంగా వాడిన వర్తమాన క్రియావిశేషణాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తూ ఆకలితో ఉన్నవారితో ఉన్న సామాజిక వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἐξαπέστειλεν
  choice: పంపివేశాడు
  rationale: బయటికి లేదా దూరంగా పంపడం అనే సంయుక్త క్రియ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κενούς
  choice: ఖాళీగా
  rationale: ధనవంతులు పంపబడినప్పుడు వారి స్థితిని తెలిపే విశేషణాన్ని విస్తరించకుండా నిలుపుతుంది. ‘వట్టి చేతులతో’ అనేది సాధ్యమైన భావానువాదం.
theological_decisions:
- issue: మరియ స్తుతిగీతంలోని సామాజిక-దైవిక తారుమారు
  choice: ‘ఆకలితో ఉన్నవారు’, ‘ధనవంతులు’ అనే స్పష్టమైన సామాజిక వ్యత్యాసాన్ని యథాతథంగా ఉంచడం
  alternative: వీటిని కేవలం ఆత్మీయ అవసరంలో ఉన్నవారు, స్వయంతృప్తి గలవారు అని భావానువదించడం
  rationale: గ్రీకు పాఠం ఆకలితో ఉన్న ప్రజలనూ ధనవంతులనూ స్పష్టంగా పేర్కొంటుంది. ఆత్మీయ అన్వయాలు సాధ్యమైనప్పటికీ, అనువాదం సామాజిక అర్థాన్ని తొలగించకుండా దైవిక తారుమారులోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన స్తుతిగీత శైలి. సమాంతర వాక్య నిర్మాణం మరియు సామాజిక వ్యత్యాసం కాపాడబడ్డాయి.
