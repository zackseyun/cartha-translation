translation:
  language: te
  text: పూర్వకాలం నుండి తన పరిశుద్ధ ప్రవక్తల నోటి ద్వారా ఆయన పలికినట్లుగా,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రాచీన కాలం నుండి.” ఈ పదబంధం సుదూర గతాన్ని సూచించవచ్చు. కొందరు దీన్ని “అనాది కాలం నుండి” అనే మరింత బలమైన అర్థంలో తీసుకుంటారు; అయితే ఇక్కడ ప్రవక్తల ప్రస్తావన ఉన్నందున “పూర్వకాలం నుండి” అనే అర్థమే సందర్భానికి ఎక్కువగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: పలికినట్లుగా
  rationale: ముందటి వాక్యంలోని కార్యం దేవుడు గతంలో పలికిన మాటకు అనుగుణంగా జరిగిందనే పోలికను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐλάλησεν
  choice: పలికిన
  rationale: λαλέω యొక్క భూతకాల క్రియను గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే ‘పలికిన’తో అనువదించాం; తరువాత వచ్చే ‘నోటి ద్వారా’ అనే పదబంధంతోనూ ఇది సహజంగా కలుస్తుంది.
- source_word: διὰ στόματος
  choice: నోటి ద్వారా
  rationale: దేవుడు ప్రవక్తలను మాధ్యమంగా చేసుకొని మాట్లాడాడనే బైబిలీయ రూపకాన్ని సరళీకరించకుండా నిలుపుతుంది.
- source_word: τῶν ἁγίων ... προφητῶν
  choice: తన పరిశుద్ధ ప్రవక్తల
  rationale: ἁγίων అనేది προφητῶνను విశేషించే పదం. ‘పరిశుద్ధ ప్రవక్తలు’ వారిని దేవునికి ప్రత్యేకించబడినవారిగా సూచిస్తుంది.
- source_word: ἀπ’ αἰῶνος
  choice: పూర్వకాలం నుండి
  rationale: ఇక్కడ ప్రవక్తల ద్వారా వచ్చిన దీర్ఘకాలిక సాక్ష్యం ఉద్దేశించబడింది. ఈ పదప్రయోగం దూర గతాన్ని తెలియజేస్తూ, తప్పనిసరిగా నిత్యత్వాన్ని నిర్దేశించదు.
- source_word: αὐτοῦ
  choice: తన
  rationale: సందర్భంలో సర్వనామం దేవుణ్ణి సూచిస్తుంది; ప్రవక్తలు ఆయనకు చెందినవారని సహజమైన తెలుగు ప్రతిబింబాత్మక సర్వనామంతో తెలియజేస్తుంది.
theological_decisions:
- issue: ἀπ’ αἰῶνος యొక్క కాలవ్యాప్తి
  choice: రక్షణ చరిత్రలోని పూర్వకాలం
  alternative: అనాది కాలం లేదా నిత్యత్వం నుండి
  rationale: తక్షణ సందర్భంలో ప్రవక్తల ప్రస్తావన ఉండడం వల్ల ఇది చారిత్రకంగా సుదూర గతాన్ని సూచించడం ఎక్కువ సంభావ్యం. అయితే పదబంధానికి ఇవ్వబడే మరింత బలమైన కాలార్థాన్ని పాదసూచికలో ఉంచి అసలులోని వ్యాఖ్యాన అవకాశాన్ని సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ప్రవచన వాక్యానికి తగిన గౌరవప్రదమైన శైలితో అనువదించబడింది. ‘నోటి ద్వారా’ అనే మూలభాషా రూపకం ఉద్దేశపూర్వకంగా నిలుపబడింది.
