id: LUK.1.19
reference: Luke 1:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῷ· Ἐγώ εἰμι Γαβριὴλ ὁ παρεστηκὼς ἐνώπιον τοῦ θεοῦ, καὶ ἀπεστάλην λαλῆσαι πρὸς σὲ καὶ εὐαγγελίσασθαί σοι ταῦτα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/019.yaml
  text: And the angel answered him[a], “I am Gabriel, who stands in the presence of God, and I was sent to speak to you and to bring you this good news.”
translation:
  language: te
  text: 'దేవదూత అతనికి జవాబిచ్చి ఇలా అన్నాడు: “నేను దేవుని సన్నిధిలో నిలిచి ఉండే గబ్రియేలును. నీతో మాట్లాడడానికి, ఈ శుభవార్తను నీకు ప్రకటించడానికి నేను పంపబడ్డాను.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ సంగతులను నీకు శుభవార్తగా ప్రకటించడానికి.” గ్రీకులో అక్షరార్థంగా “నీకు ఈ సంగతులను శుభవార్తగా ప్రకటించడానికి” అని ఉంది; “ఈ సంగతులు” గబ్రియేలు ఇప్పుడే ప్రకటించిన సందేశాన్ని సూచిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: జవాబిచ్చాడు
  rationale: ప్రత్యక్ష సంభాషణను పరిచయం చేసే భూతకాల అసమాపక క్రియను సహజమైన తెలుగు సమాపక క్రియగా వ్యక్తం చేస్తుంది.
- source_word: ἄγγελος
  choice: దేవదూత
  rationale: ఈ సందర్భంలో గబ్రియేలు తనను తాను దేవుని సన్నిధిలో నిలిచేవాడిగా గుర్తిస్తున్నందున, సాధారణ ‘దూత’ కంటే పరలోక దూతను స్పష్టంగా సూచించే పదం సరైనది.
- source_word: Ἐγώ εἰμι Γαβριὴλ
  choice: నేను ... గబ్రియేలును
  rationale: మూలంలోని స్పష్టమైన ἐγώ వల్ల కలిగే స్వీయగుర్తింపు ఉద్ఘాటనను తెలుగు వాక్యం కాపాడుతుంది.
- source_word: ὁ παρεστηκὼς
  choice: నిలిచే
  rationale: పరిపూర్ణ వర్తమాన భాగధాతువు సూచించే స్థిరమైన, కొనసాగుతున్న హోదాను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: దేవుని సన్నిధిలో
  rationale: దేవుని సమక్షంలో ఉండడం అనే భావాన్ని, దైవ రాజసభ నేపథ్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀπεστάλην
  choice: నేను పంపబడ్డాను
  rationale: మూలంలోని భూతకాల కర్మణి రూపాన్ని కాపాడుతూ, పంపినవాడు దేవుడనే సందర్భార్థాన్ని అనవసరంగా వాక్యంలో చేర్చదు.
- source_word: λαλῆσαι πρὸς σὲ
  choice: నీతో మాట్లాడడానికి
  rationale: ఉద్దేశాన్ని తెలిపే క్రియారూపాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: εὐαγγελίσασθαί σοι
  choice: శుభవార్తను నీకు ప్రకటించడానికి
  rationale: εὐαγγελίζω యొక్క ‘మంచి వార్తను ప్రకటించడం’ అనే సాధారణ అర్థాన్ని కాపాడుతూ, ఇక్కడ తరువాతి కాలపు సాంకేతిక పదార్థాన్ని బలవంతంగా మోపదు.
- source_word: ταῦτα
  choice: ఈ శుభవార్తను
  rationale: అక్షరార్థంగా ‘ఈ సంగతులను’; అయితే εὐαγγελίζωతో కలిసి ఇది ఇప్పుడే ప్రకటించిన సందేశాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన సంయుక్త వ్యక్తీకరణను ఉపయోగించి, అక్షరార్థాన్ని పాదటిప్పణిలో నిలుపుతుంది.
theological_decisions:
- issue: εὐαγγελίζωను దేవదూత ప్రకటన సందర్భంలో ఎలా అనువదించాలి
  choice: శుభవార్తను ... ప్రకటించడానికి
  alternative: సువార్తను ప్రకటించడానికి
  rationale: ‘సువార్త’ ఇక్కడ తరువాతి క్రైస్తవ సాంకేతిక పదంలా వినిపించే అవకాశం ఉంది. ‘శుభవార్త’ మూల క్రియ యొక్క సాధారణ భావాన్నీ, దాని సానుకూల ధార్మిక ప్రతిధ్వనినీ కాపాడుతుంది.
- issue: దేవుని చేత పంపబడినట్టు స్పష్టంగా చేర్చాలా
  choice: పంపిన కర్తను వాక్యంలో పేర్కొనకుండా కర్మణి రూపాన్ని నిలుపడం
  alternative: దేవుడు నన్ను పంపాడు
  rationale: సందర్భం పంపినవాడు దేవుడని బలంగా సూచించినా, గ్రీకు వాక్యం కర్తను ప్రత్యక్షంగా పేర్కొనదు; అందువల్ల మూలంలోని నిగూఢతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘గబ్రియేలును’ అనే రూపం స్వీయగుర్తింపు వాక్యానికి సహజ తెలుగు నుడికారాన్ని ఇస్తుంది; ‘సన్నిధిలో’ దైవ సమక్షాన్ని స్పష్టంగా తెలియజేస్తుంది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
