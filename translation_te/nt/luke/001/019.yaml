revisions:
- from: 'అప్పుడు దేవదూత అతనికి జవాబిచ్చాడు: “నేను దేవుని సన్నిధిలో నిలిచే గబ్రియేలును. నీతో మాట్లాడడానికి, ఈ శుభవార్తను నీకు ప్రకటించడానికి నేను పంపబడ్డాను.[a]”'
  to: 'దేవదూత అతనికి జవాబిచ్చి ఇలా అన్నాడు: “నేను దేవుని సన్నిధిలో నిలిచి ఉండే గబ్రియేలును. నీతో మాట్లాడడానికి, ఈ శుభవార్తను నీకు ప్రకటించడానికి నేను పంపబడ్డాను.[a]”'
