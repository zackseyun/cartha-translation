id: LUK.1.72
reference: Luke 1:72
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ποιῆσαι ἔλεος μετὰ τῶν πατέρων ἡμῶν καὶ μνησθῆναι διαθήκης ἁγίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/072.yaml
  text: to show mercy to our fathers and to remember his holy covenant[c][b][a],
translation:
  language: te
  text: మన పితరులపట్ల కనికరం చూపడానికి[a][c], తన పవిత్ర నిబంధనను జ్ఞాపకం చేసుకోవడానికి[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మన పితరులతో కనికరంగా వ్యవహరించడానికి.’ గ్రీకు వ్యక్తీకరణ ఇశ్రాయేలు పూర్వపితరులకు సంబంధించి కనికరం చూపడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: బైబిలీయ నిబంధన భాషలో ‘జ్ఞాపకం చేసుకోవడం’ అంటే కేవలం మనసుకు తెచ్చుకోవడం మాత్రమే కాక, ముందుగా చేసిన వాగ్దానానికి నమ్మకంగా కార్యం చేయడాన్ని కూడా తరచుగా సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: ‘మన పితరులు’ అంటే ఇశ్రాయేలు పూర్వపితరులు; దీనిని ‘మన పూర్వీకులు’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιῆσαι ἔλεος
  choice: కనికరం చూపడానికి
  rationale: ‘కనికరం చేయడం’ అనే మూలభావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తూ, ప్రయోజనార్థక క్రియారూపాన్ని నిలుపుతుంది.
- source_word: μετὰ τῶν πατέρων ἡμῶν
  choice: మన పితరులపట్ల
  rationale: μετά + షష్ఠీ విభక్తి అక్షరార్థంగా ‘తో’ అయినా, కనికరం చూపే సందర్భంలో సంబంధాన్ని తెలుగులో ‘పట్ల’ సహజంగా తెలియజేస్తుంది; ‘పితరులు’ ఇశ్రాయేలు పూర్వపితరుల భావాన్ని నిలుపుతుంది.
- source_word: μνησθῆναι
  choice: జ్ఞాపకం చేసుకోవడానికి
  rationale: దేవుడు తన నిబంధనను ‘జ్ఞాపకం చేసుకోవడం’ అనే బైబిలీయ వ్యక్తీకరణను వ్యాఖ్యానాత్మకంగా ‘నెరవేర్చడం’గా మార్చకుండా నిలుపుతుంది.
- source_word: διαθήκης ἁγίας αὐτοῦ
  choice: తన పవిత్ర నిబంధనను
  rationale: διαθήκηకు రక్షణ-చరిత్ర సందర్భంలో ‘నిబంధన’ సరైన పదం; ἁγίαςను ‘పవిత్ర’గా, αὐτοῦను సహజ తెలుగు ప్రతిబింబక సర్వనామం ‘తన’గా అనువదించింది.
theological_decisions:
- issue: దేవుడు నిబంధనను ‘జ్ఞాపకం చేసుకోవడం’
  choice: తన పవిత్ర నిబంధనను జ్ఞాపకం చేసుకోవడానికి
  alternative: తన పవిత్ర నిబంధన ప్రకారం కార్యం చేయడానికి / దాన్ని నెరవేర్చడానికి
  rationale: బైబిలీయ నిబంధన భాషలో ‘జ్ఞాపకం చేసుకోవడం’ విశ్వసనీయ కార్యాన్ని సూచించవచ్చు; అయినా గ్రీకు పాఠంలోని ఉద్వేగాన్ని, భావవిస్తృతిని నిలుపడానికి ప్రధాన పాఠంలో దానిని వ్యాఖ్యానించి మార్చలేదు.
- issue: πατέρων ἡμῶν యొక్క సూచన
  choice: మన పితరులు
  alternative: మన పూర్వీకులు
  rationale: గ్రీకు పదంలోని పుంలింగ రూపాన్ని, ఇశ్రాయేలు పూర్వపితరులతో ఉన్న నిబంధనాత్మక అనుసంధానాన్ని ‘పితరులు’ నిలుపుతుంది; విస్తృత అర్థాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘పితరులు,’ ‘పవిత్ర నిబంధన,’ ‘జ్ఞాపకం చేసుకోవడం’ వంటి పదాలు బైబిలీయ అంతర్పాఠ సంబంధాలను నిలుపుతాయి. మూలంలోని రెండు సమాంతర ప్రయోజనార్థక క్రియలను ‘-డానికి’ రూపాలతో ప్రతిబింబించింది.
