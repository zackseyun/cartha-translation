id: LUK.1.25
reference: Luke 1:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι Οὕτως μοι ⸀πεποίηκεν κύριος ἐν ἡμέραις αἷς ἐπεῖδεν ⸀ἀφελεῖν ὄνειδός μου ἐν ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/025.yaml
  text: because this is how the Lord has dealt with me in the days when he looked on me[a], to take away my reproach among people.
translation:
  language: te
  text: “ఎందుకంటే, ప్రభువు నన్ను చూసిన రోజుల్లో ప్రజల మధ్య నాకున్న నిందను తొలగించడానికి నాకు ఇలా చేశాడు.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి సందర్భంలో ఎలిసబెతు చెప్పిన మాటకు వివరణాత్మక కారణాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: Οὕτως μοι πεποίηκεν
  choice: నాకు ఇలా చేశాడు
  rationale: దేవుని వ్యక్తిగత కార్యాన్ని సూచించే గ్రీకు ప్రయోగాన్ని సన్నిహితంగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: ఇక్కడ దేవుణ్ణి సూచించే బిరుదుగా ఉన్న κύριοςకు గౌరవప్రదమైన సాధారణ తెలుగు సమానార్థకం.
- source_word: ἐν ἡμέραις αἷς
  choice: రోజుల్లో
  rationale: గ్రీకులోని కాలసంబంధ నిర్మాణాన్ని సంక్షిప్తంగా నిలుపుతుంది; సంబంధార్థం తరువాతి క్రియతో తెలుగులో స్పష్టమవుతుంది.
- source_word: ἐπεῖδεν
  choice: నా వైపు చూసిన
  rationale: శ్రద్ధతో చూడడం అనే భావాన్ని కలిగించే దృశ్యరూపకాన్ని కాపాడుతుంది; ‘కనికరించాడు’ అని అర్థాన్ని అతిగా నిర్ణయించదు.
- source_word: ἀφελεῖν
  choice: తొలగించడానికి
  rationale: ఉద్దేశం లేదా ఫలితాన్ని సూచించే క్రియారూపాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὄνειδός μου
  choice: నాకున్న నిందను
  rationale: వ్యక్తిగత అంతర్భావమైన సిగ్గుకన్నా ఇతరుల మధ్య కలిగిన అపకీర్తి లేదా అవమానం అనే సామాజిక కోణాన్ని ముందుకు తెస్తుంది.
- source_word: ἐν ἀνθρώποις
  choice: ప్రజల మధ్య
  rationale: లింగభేదం లేకుండా మానవ సమాజంలో ఉన్న స్థితిని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: κύριος ఎవరిని సూచిస్తుంది
  choice: దేవుణ్ణి సూచించే బిరుదుగా ‘ప్రభువు’
  alternative: ఈ తక్షణ సందర్భంలో ముఖ్యమైన ప్రత్యామ్నాయం లేదు
  rationale: ఎలిసబెతు తన సంతానలేమి కారణంగా కలిగిన సామాజిక నిందను దేవుడు తొలగించిన కార్యం గురించి మాట్లాడుతోంది; అవసరం లేని ప్రత్యేక క్రీస్తుసంబంధ వ్యాఖ్యానాన్ని చేర్చదు.
- issue: ὄνειδος యొక్క సామాజిక భావం
  choice: నింద
  alternative: అవమానం; సిగ్గు
  rationale: ఈ సందర్భంలో ప్రధానంగా ప్రజల మధ్య ఎదురైన అపకీర్తిని సూచిస్తుంది. ‘నింద’ బాహ్యమైన సామాజిక కోణాన్ని నిలుపుతుంది; ‘సిగ్గు’ అంతర్గత భావోద్వేగాన్ని ఎక్కువగా సూచించవచ్చు.
- issue: ἐπεῖδενలోని దైవ అనుగ్రహ భావం
  choice: నా వైపు చూసిన
  alternative: నన్ను కనికరంగా చూసిన; నన్ను పట్టించుకున్న
  rationale: సందర్భంలో అనుకూలమైన దైవదృష్టి ఉన్నప్పటికీ, గ్రీకు క్రియలోని చూడడం అనే రూపకాన్ని ఉంచి, ‘కనికరం’ వంటి వివరణను ప్రధాన పాఠ్యంలో అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని దృశ్యరూపకం, సామాజిక నింద భావం, ఉద్దేశార్థక సంబంధం కాపాడబడ్డాయి.
