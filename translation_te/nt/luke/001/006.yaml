id: LUK.1.6
reference: Luke 1:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἦσαν δὲ δίκαιοι ἀμφότεροι ⸀ἐναντίον τοῦ θεοῦ, πορευόμενοι ἐν πάσαις ταῖς ἐντολαῖς καὶ δικαιώμασιν τοῦ κυρίου ἄμεμπτοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/006.yaml
  text: And both of them were righteous before God[b][a], walking blamelessly in all the commandments and ordinances of the Lord.
translation:
  language: te
  text: వారిద్దరూ దేవుని ఎదుట[a] నీతిమంతులుగా ఉండేవారు. ప్రభువు ఆజ్ఞలన్నిటినీ విధులన్నిటినీ పాటిస్తూ, నిందకు తావులేకుండా నడుచుకునేవారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని దృష్టిలో.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ప్రభువు ఆజ్ఞలన్నిటిలోను విధులన్నిటిలోను నిందారహితులుగా నడుచుకునేవారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δὲ
  choice: ఉండేవారు
  rationale: δέ ఇక్కడ స్వల్ప కథన అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో ప్రత్యేక సంధానపదం లేకుండానే ముందటి వాక్యంతో సహజంగా అనుసంధానం అవుతుంది. ἦσαν యొక్క బహువచన భావాన్ని ‘ఉండేవారు’ నిలుపుతుంది.
- source_word: δίκαιοι
  choice: నీతిమంతులుగా
  rationale: ఈ పదం దేవుని ఎదుట వారి నైతిక, నిబంధనాత్మక విశ్వాస్యతను సూచిస్తుంది. ‘నీతిమంతులు’ దానిని కేవలం న్యాయపరమైన భావానికి పరిమితం చేయదు.
- source_word: ἀμφότεροι
  choice: వారిద్దరూ
  rationale: జెకర్యా, ఎలిసబెతు ఇద్దరికీ ఈ వర్ణన సమానంగా వర్తిస్తుందనే ఉద్ఘాటనను స్పష్టంగా నిలుపుతుంది.
- source_word: ἐναντίον τοῦ θεοῦ
  choice: దేవుని ఎదుట
  rationale: వారి నీతి మానవుల అంచనా ప్రకారం మాత్రమే కాక దేవుని సమక్షంలో, ఆయన దృష్టిలోనూ నిజమని తెలిపే సంబంధాత్మక, మూల్యాంకన భావాన్ని నిలుపుతుంది.
- source_word: πορευόμενοι
  choice: నడుచుకునేవారు
  rationale: అక్షరార్థమైన ‘నడవడం’ అనే రూపకాన్ని నిలుపుతూ, ఇక్కడ ఉద్దేశించిన జీవన ప్రవర్తనను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν πάσαις ταῖς ἐντολαῖς
  choice: ఆజ్ఞలన్నిటినీ పాటిస్తూ
  rationale: πάσαις యొక్క సమగ్రతను ‘అన్నిటినీ’ నిలుపుతుంది; సందర్భంలో ἐνతో కూడిన πορεύομαι విధేయతతో జీవించడాన్ని సూచిస్తున్నందున ‘పాటిస్తూ’ సహజంగా అర్థాన్ని అందిస్తుంది.
- source_word: δικαιώμασιν
  choice: విధులన్నిటినీ
  rationale: ఆజ్ఞలతో పాటు దేవుడు నిర్దేశించిన శాసనాలు లేదా నియమిత విధులను సూచిస్తుంది; ‘విధులు’ ఈ భేదాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: τοῦ κυρίου
  choice: ప్రభువు
  rationale: ఇక్కడ ఇశ్రాయేలు దేవుణ్ణి నిబంధన ప్రభువుగా సూచించే κύριοςకు ప్రామాణికమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: ἄμεμπτοι
  choice: నిందకు తావులేకుండా
  rationale: ఈ విశేషణాన్ని πορευόμενοιతో సహజంగా అనుసంధానించి, వారి ప్రవర్తన నిందించడానికి ఆధారం ఇవ్వనిదిగా ఉందనే బలమైన భావాన్ని తెలుపుతుంది; సంపూర్ణ పాపరాహిత్యాన్ని అదనంగా ప్రకటించదు.
theological_decisions:
- issue: ἄμεμπτοι సంపూర్ణ పాపరాహిత్యాన్ని సూచిస్తుందా?
  choice: వారి జీవన ప్రవర్తన నిందకు తావులేనిదిగా ఉందని అనువదించబడింది.
  alternative: ‘నిందారహితులు’ అనే పదాన్ని సంపూర్ణ నైతిక పరిపూర్ణతగా అర్థం చేసుకోవచ్చు.
  rationale: సమీప సందర్భం ప్రభువు ఆజ్ఞలు, విధులను విశ్వాసంగా పాటించడాన్ని వివరిస్తుంది. మూలపాఠంలోని బలమైన సానుకూల వర్ణనను నిలుపుతూ, అది చెప్పని సంపూర్ణ పాపరాహిత్య సిద్ధాంతాన్ని అనువాదం జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘నడుచుకునేవారు’ అనే బైబిలీయ జీవన రూపకం సాధారణ పాఠకుడికి అర్థమయ్యేలా నిలుపబడింది; ‘ఆజ్ఞలు’ మరియు ‘విధులు’ అనే రెండు వర్గాల భేదం కూడా కాపాడబడింది.
