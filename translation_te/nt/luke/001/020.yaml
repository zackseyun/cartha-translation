revisions:
- from: ఇదిగో, నీవు నా మాటలను నమ్మలేదు కాబట్టి, ఇవి జరిగే రోజు వరకు నీవు మౌనంగా ఉండి, మాట్లాడలేకపోతావు. ఆ మాటలు వాటికి నియమించబడిన సమయంలో నెరవేరుతాయి.[a]
  to: ఇదిగో, ఇవి జరిగే రోజు వరకు నీవు మౌనంగా ఉంటావు, మాట్లాడలేకపోతావు; ఎందుకంటే నీవు నా మాటలను నమ్మలేదు. ఆ మాటలు వాటి నిర్ణీత సమయంలో నెరవేరుతాయి.[a]
  rationale: 'The revision preserves the full meaning of the Greek while improving idiomatic Telugu and restoring the source text''s sequence: the announced inability to speak, the reason for it, and the assurance that the words will be fulfilled at their appointed time. The footnote retains a legitimate alternative for the nuance of καιρός.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:15:44Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys all major elements of the Greek: the attention signal, imposed silence and inability to speak, the temporal limit, the causal reference to Zechariah''s unbelief, and the future fulfillment of the angel''s words. A small revision restores the source''s clearer progression from judgment to reason and makes the appointed-time expression more idiomatic.'
  naturalness: ‘వాటికి నియమించబడిన సమయంలో’ is understandable but somewhat cumbersome in modern standard Telugu. ‘వాటి నిర్ణీత సమయంలో’ is smoother and retains the fitting/appointed-time sense. Separating ‘మౌనంగా ఉంటావు’ and ‘మాట్లాడలేకపోతావు’ avoids any possible suggestion that the silence is merely voluntary.
  terminology: ‘ఇదిగో,’ appropriately represents ἰδού; ‘నా మాటలను నమ్మలేదు’ accurately renders πιστεύω with λόγοις; and ‘నెరవేరుతాయి’ suitably renders πληρωθήσονται. ‘నిర్ణీత సమయంలో’ preserves καιρός without specifying who appointed it.
  issues:
  - severity: low
    issue: The causal clause is moved before the announced consequence.
    rationale: This does not change the meaning, but restoring the Greek's judgment–reason sequence makes the angelic pronouncement clearer and more rhetorically faithful.
  - severity: low
    issue: ‘వాటికి నియమించబడిన సమయంలో’ is awkwardly phrased.
    rationale: ‘వాటి నిర్ణీత సమయంలో’ is idiomatic modern Telugu and retains the intended sense of an appointed or fitting time.
  - severity: low
    issue: ‘మౌనంగా ఉండి’ may read as a voluntary or sequential action.
    rationale: Using the finite future ‘మౌనంగా ఉంటావు’ alongside ‘మాట్లాడలేకపోతావు’ more directly expresses the imposed ongoing condition in the Greek.
  revised_text: ఇదిగో, ఇవి జరిగే రోజు వరకు నీవు మౌనంగా ఉంటావు, మాట్లాడలేకపోతావు; ఎందుకంటే నీవు నా మాటలను నమ్మలేదు. ఆ మాటలు వాటి నిర్ణీత సమయంలో నెరవేరుతాయి.[a]
