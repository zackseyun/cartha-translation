id: LUK.1.20
reference: Luke 1:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι ἄχρι ἧς ἡμέρας γένηται ταῦτα, ἀνθ’ ὧν οὐκ ἐπίστευσας τοῖς λόγοις μου, οἵτινες πληρωθήσονται εἰς τὸν καιρὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/020.yaml
  text: And behold[a], you will be silent and unable to speak until the day these things happen, because you did not believe my words[b], which will be fulfilled in their appointed time.
translation:
  language: te
  text: ఇదిగో, ఇవి జరిగే రోజు వరకు నీవు మౌనంగా ఉంటావు, మాట్లాడలేకపోతావు; ఎందుకంటే నీవు నా మాటలను నమ్మలేదు. ఆ మాటలు వాటి నిర్ణీత సమయంలో నెరవేరుతాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ మాటలు వాటికి తగిన సమయంలో నెరవేరుతాయి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: దూత ప్రకటనలోని ఆకస్మిక శ్రద్ధాహ్వానాన్ని, గంభీరతను సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι
  choice: నీవు మౌనంగా ఉండి, మాట్లాడలేకపోతావు
  rationale: మౌనస్థితి మరియు మాట్లాడే అసమర్థత అనే రెండు గ్రీకు అంశాలను ఉంచి, ఇది స్వచ్ఛంద నిశ్శబ్దం కాదని స్పష్టం చేస్తుంది.
- source_word: ἄχρι ἧς ἡμέρας γένηται ταῦτα
  choice: ఇవి జరిగే రోజు వరకు
  rationale: కాలపరిమితిని సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀνθ’ ὧν οὐκ ἐπίστευσας τοῖς λόγοις μου
  choice: నీవు నా మాటలను నమ్మలేదు కాబట్టి
  rationale: ἀνθ’ ὧν యొక్క సందర్భానుగుణ కారణార్థాన్ని, πιστεύωతో మాటల దత్తాంశాన్ని నేరుగా కాపాడుతుంది.
- source_word: οἵτινες πληρωθήσονται
  choice: ఆ మాటలు ... నెరవేరుతాయి
  rationale: సంబంధవాచక సూచనను తెలుగులో స్పష్టంగా చేసి, వాగ్దాన మాటలు సాకారమవుతాయనే భావాన్ని నిలుపుతుంది.
- source_word: εἰς τὸν καιρὸν αὐτῶν
  choice: వాటికి నియమించబడిన సమయంలో
  rationale: καιρόςలోని తగిన లేదా నియమిత సమయ భావాన్ని కేవలం సాధారణ కాలంగా తగ్గించకుండా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: జెకర్యాకు విధించబడిన మౌనం స్వభావం
  choice: మాట్లాడలేని విధంగా కలిగిన మౌనస్థితి
  alternative: స్వచ్ఛందంగా నిశ్శబ్దంగా ఉండడం
  rationale: ‘మౌనంగా ఉండి’తో పాటు ‘మాట్లాడలేకపోతావు’ అని మూలపాఠం చెప్పడం వల్ల ఇది కేవలం మౌనంగా ఉండమనే ఆజ్ఞ కాక, విధించబడిన అసమర్థత అని తెలుస్తుంది.
- issue: నెరవేర్పు సమయం
  choice: మాటలకు నియమించబడిన సమయంలో అవి నెరవేరుతాయి
  alternative: సాధారణంగా ఏదో భవిష్యత్ సమయంలో అవి జరుగుతాయి
  rationale: καιρός తగిన లేదా నిర్ణీత సమయాన్ని సూచిస్తుంది; ఎవరు నియమించారో అనవసరంగా చేర్చకుండా దైవిక సమయసూచనను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, దూత ప్రకటనకు తగిన గంభీరతతో రూపొందించబడింది. గ్రీకు వాక్యంలోని కారణ భాగాన్ని తెలుగులో సహజమైన క్రమంలో ముందుకు తెచ్చినా భావసంబంధం మార్చలేదు.
