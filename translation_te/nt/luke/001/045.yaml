  yaml_path: translation/nt/luke/001/045.yaml
  text: And blessed is she who believed that there will be a fulfillment of what was spoken to her by the Lord[a][b].
translation:
  language: te
  text: ప్రభువు నుండి ఆమెకు చెప్పబడిన మాటలు నెరవేరుతాయని నమ్మిన ఆమె ధన్యురాలు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువు నుండి ఆమెకు చెప్పబడిన మాటలు నెరవేరబోతున్నాయి కాబట్టి నమ్మిన ఆమె ధన్యురాలు.” గ్రీకు సంధిపదానికి ఇక్కడ “ఎందుకంటే/కాబట్టి” అనే కారణార్థం కూడా సాధ్యమే; అయితే “అని” అనే విషయార్థమే ఎక్కువ సంభావ్యం.
    reason: alternative_reading
  - marker: b
    text: “నెరవేరడం” అనే పదానికి “పూర్తికావడం” లేదా “సిద్ధించడం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρία
  choice: ధన్యురాలు
  rationale: లూకా రచనలోని మతపరమైన, దైవానుగ్రహ సంబంధమైన భావగాంభీర్యాన్ని నిలుపుతుంది; కేవలం భావోద్వేగపరమైన ‘సంతోషవంతురాలు’ కంటే సముచితం.
- source_word: πιστεύσασα
  choice: నమ్మిన ఆమె
  rationale: ఆర్టికల్‌తో ఉన్న భూతకాల కృదంతాన్ని వ్యక్తిని సూచించే సహజ తెలుగు రూపంలో అందిస్తుంది; దేవుని మాటపై ఆమె ఉంచిన విశ్వాసాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ὅτι
  choice: అని
  rationale: ఇక్కడ ఆమె నమ్మిన విషయాన్ని పరిచయం చేసే content conjunctionగా తీసుకోవడం వాక్యనిర్మాణానికీ సందర్భానికీ అత్యంత సహజం; కారణార్థమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: τελείωσις
  choice: నెరవేరడం
  rationale: చెప్పబడిన దైవవాక్యం పూర్తిగా కార్యరూపం దాల్చడాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοῖς λελαλημένοις αὐτῇ
  choice: తనతో చెప్పించిన మాటలు
  rationale: ఆమెకు ముందుగా తెలియజేయబడిన వాక్యవిషయాన్ని సహజంగా అందిస్తుంది; గ్రీకు perfect passive యొక్క ముందే పలికిన మాట అనే భావాన్ని సందర్భం నిలుపుతుంది.
- source_word: παρὰ κυρίου
  choice: ప్రభువు ... చెప్పించిన
  rationale: παρά + genitive సూచించే మూలం/ఆరంభాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; సందేశం ప్రభువు నుండి వచ్చినదని, మధ్యవర్తి ద్వారా పలికించబడినదనే సందర్భానుకూల భావాన్ని అందిస్తుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: ఈ సందర్భంలో వాగ్దానానికి మూలమైన ఇశ్రాయేలు దేవునిని సూచించే సాధారణమైన, గౌరవప్రదమైన తెలుగు అనువాదం.
theological_decisions:
- issue: మరియ ధన్యతకు ఆమె విశ్వాసంతోనూ ప్రభువు పలికిన వాగ్దానంతోనూ ఉన్న సంబంధం
  choice: ప్రభువు నుండి తనకు వచ్చిన మాటలు నెరవేరుతాయని నమ్మిన ఆమె ధన్యురాలని వాక్యం ప్రకటిస్తుంది.
  alternative: తనతో చెప్పబడిన మాటలు నెరవేరనున్నందువల్ల ఆమె ధన్యురాలు అని ὅτιని కారణార్థకంగా చదవవచ్చు.
  rationale: πιστεύσασα తరువాతి ὅτι వాక్యభాగం ఆమె నమ్మిన విషయాన్ని తెలిపేదిగా తీసుకోవడం వాక్యనిర్మాణానికీ సందర్భానికీ ఎక్కువ సహజం. అయినా కారణార్థక సాధ్యతను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘ధన్యురాలు’ బైబిలు సందర్భంలోని ఆధ్యాత్మిక గాంభీర్యాన్ని నిలుపుతుంది. ప్రధాన పాఠం ὅτιని విషయార్థకంగా తీసుకుంటూ, నిజమైన వాక్యనిర్మాణ సందిగ్ధతను పాదసూచికలో ఉంచింది.
