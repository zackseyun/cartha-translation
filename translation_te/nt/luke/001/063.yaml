id: LUK.1.63
reference: Luke 1:63
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ αἰτήσας πινακίδιον ἔγραψεν λέγων· Ἰωάννης ⸀ἐστὶν ὄνομα αὐτοῦ. καὶ ἐθαύμασαν πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/063.yaml
  text: And after asking for a writing tablet[a], he wrote, saying, “John is his name.” And they all marveled.
translation:
  language: te
  text: అతడు వ్రాసే పలకను అడిగి, “యోహాను అతని పేరు” అని రాశాడు. వారందరూ ఆశ్చర్యపడ్డారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰτήσας
  choice: అడిగి తీసుకొని
  rationale: ప్రధాన క్రియకు ముందు జరిగిన అభ్యర్థనను ఏకకాలికంగా కాకుండా సహజమైన తెలుగు కథన క్రమంలో తెలియజేస్తుంది.
- source_word: πινακίδιον
  choice: వ్రాసే పలకను
  rationale: వ్రాయడానికి ఉపయోగించే చిన్న పలక అనే భావాన్ని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἔγραψεν λέγων
  choice: అని రాశాడు
  rationale: తెలుగులో వ్రాతలోని మాటలను పరిచయం చేయడానికి ‘అని రాశాడు’ సహజం; గ్రీకు λέγων యొక్క పరిచయ విధిని నిలుపుతూ అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: Ἰωάννης ἐστὶν ὄνομα αὐτοῦ
  choice: యోహాను అనేది అతని పేరు
  rationale: ‘యోహాను’ను వాక్యారంభంలో ఉంచి గ్రీకు పదక్రమంలోని పేరుపై గల ఉద్ఘాటనను కాపాడుతుంది; వర్తమాన కాల నిర్ధారణను భవిష్యత్తుగా మార్చదు.
- source_word: ἐθαύμασαν πάντες
  choice: వారందరూ ఆశ్చర్యపోయారు
  rationale: ఆ సమూహమంతటి విస్మయాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: శిశువు పేరుకు సంబంధించిన ప్రకటన యొక్క కాలం మరియు ఉద్ఘాటన
  choice: “యోహాను అనేది అతని పేరు”
  alternative: “అతని పేరు యోహాను” / “అతని పేరు యోహాను అవుతుంది”
  rationale: మొదటి ప్రత్యామ్నాయం సహజమైనదైనా పేరుపై ఉన్న ముందస్తు ఉద్ఘాటనను తగ్గిస్తుంది; రెండవది గ్రీకు వర్తమాన కాలాన్ని భవిష్యత్తుగా వ్యాఖ్యానిస్తుంది. ఎంపిక చేసిన రూపం దైవంగా ఇవ్వబడిన పేరు ఇప్పటికే నిర్ణీతమైందనే దృఢ ప్రకటనను అతిగా వివరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కథన గౌరవాన్ని మరియు మూలంలోని పేరుపై ఉద్ఘాటనను కాపాడే శైలి.
