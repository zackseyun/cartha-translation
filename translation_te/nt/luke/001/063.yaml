revisions:
- from: అతడు వ్రాసే పలకను అడిగి తీసుకొని, “యోహాను అనేది అతని పేరు” అని రాశాడు. అప్పుడు వారందరూ ఆశ్చర్యపోయారు.
  to: అతడు వ్రాసే పలకను అడిగి, “యోహాను అతని పేరు” అని రాశాడు. వారందరూ ఆశ్చర్యపడ్డారు.
  rationale: The revision removes the unsupported implication that Zechariah took the tablet. It also uses a more idiomatic concise Telugu naming formula while preserving the Greek word order’s emphasis on “యోహాను.” No footnote is necessary, since the Telugu wording itself preserves the relevant emphasis without creating ambiguity.
  reviewer_model: gpt-5.6-terra
