revisions:
- from: ఇక నీవు కూడా, చిన్నబిడ్డా, సర్వోన్నతుని ప్రవక్తవని పిలవబడతావు. ఎందుకంటే ప్రభువుకు ముందుగా[a] వెళ్లి, ఆయన మార్గాలను సిద్ధం చేస్తావు[b].
  to: మరి నీవు కూడా, చిన్నబిడ్డా, సర్వోన్నతుని ప్రవక్త అని పిలువబడతావు; ఎందుకంటే నీవు ప్రభువు ముందు వెళ్లి ఆయన మార్గాలను సిద్ధం చేస్తావు.[a][b]
  rationale: The revision removes an unnecessary temporal implication, renders ἐνώπιον κυρίου more precisely and idiomatically, and smooths the explanatory footnote. It retains the Greek plural ‘ways,’ the future sense, the reverential divine titles, and the source text’s deliberate openness concerning the referent of ‘the Lord.’
