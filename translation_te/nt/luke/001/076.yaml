id: LUK.1.76
reference: Luke 1:76
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ σὺ ⸀δέ, παιδίον, προφήτης Ὑψίστου κληθήσῃ, προπορεύσῃ γὰρ ⸀ἐνώπιον κυρίου ἑτοιμάσαι ὁδοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/076.yaml
  text: And you also[a], child, will be called a prophet of the Most High, for you will go before the Lord to prepare his ways[b],
translation:
  language: te
  text: మరి నీవు కూడా, చిన్నబిడ్డా, సర్వోన్నతుని ప్రవక్త అని పిలువబడతావు; ఎందుకంటే నీవు ప్రభువు ముందు వెళ్లి ఆయన మార్గాలను సిద్ధం చేస్తావు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రభువు సన్నిధిలో.’ ఈ మాట ఒకరి కంటే ముందుగా వెళ్లడాన్నిగానీ, వారి సన్నిధిలో సేవ చేయడాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఈ మాటలు ప్రభువు ముందు మార్గాన్ని సిద్ధం చేయడం గురించిన ప్రవచన వాగ్దానాలను ప్రతిధ్వనింపజేస్తాయి (యెషయా 40:3; మలాకీ 3:1 చూడండి). లూకా కథనంలో ఇది యేసుకు ముందుగా యోహాను చేసిన పరిచర్యలో నెరవేరుతుంది.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ σὺ δέ
  choice: ఇక నీవు కూడా
  rationale: సంబోధించబడుతున్న బిడ్డపై ఉన్న ఉద్ఘాటనను, అలాగే మాటలోని మార్పు మరియు చేర్పు భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: παιδίον
  choice: చిన్నబిడ్డా
  rationale: ఇది శిశువైన యోహానును నేరుగా సంబోధించే పదం. ‘చిన్నబిడ్డా’ ఆప్యాయతను, చిన్న వయస్సును సహజంగా తెలియజేస్తుంది.
- source_word: προφήτης Ὑψίστου
  choice: సర్వోన్నతుని ప్రవక్త
  rationale: Ὑψίστου అనే దైవ బిరుదును గౌరవప్రదంగా, జనసామాన్యానికి అర్థమయ్యే విధంగా ‘సర్వోన్నతుడు’ అని అనువదించి, గ్రీకు షష్ఠీ సంబంధాన్ని నిలుపుతుంది.
- source_word: κληθήσῃ
  choice: ప్రవక్తవని పిలవబడతావు
  rationale: భవిష్యత్ కర్మణి రూపంలోని పేరు పెట్టడం లేదా గుర్తింపబడడం అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: προπορεύσῃ
  choice: ముందుగా వెళ్లి
  rationale: ఒకరి కంటే ముందుగా వెళ్లడం అనే అర్థాన్ని నిలుపుతూ, ముందుగా వచ్చి సిద్ధపరిచే వ్యక్తి సందర్భానికి సరిపోతుంది.
- source_word: ἐνώπιον κυρίου
  choice: ప్రభువుకు ముందుగా
  rationale: సందర్భంలో ప్రభువుకు ముందు వెళ్లే భావాన్ని ప్రధాన పాఠంలో స్పష్టంగా ఉంచుతుంది; ‘ప్రభువు సన్నిధిలో’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: ἑτοιμάσαι
  choice: సిద్ధం చేస్తావు
  rationale: గ్రీకులో ఉద్దేశాన్ని తెలిపే క్రియను తెలుగులో ముందు వెళ్లి చేయబోయే కార్యంగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁδοὺς αὐτοῦ
  choice: ఆయన మార్గాలను
  rationale: గ్రీకు బహువచనాన్ని నిలుపుతూ, ప్రవచనాత్మక మార్గ-సిద్ధీకరణ భాషను ప్రతిధ్వనింపజేస్తుంది.
theological_decisions:
- issue: ముందుగా వెళ్లే ప్రవచనంలో ‘ప్రభువు’ అనే పదం ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో సూచిత వ్యక్తిని మరింత సంకుచితం చేయకుండా ‘ప్రభువు’ అని ఉంచడం.
  alternative: పాత నిబంధన నేపథ్యాన్ని బట్టి దేవుడైన ప్రభువు అని స్పష్టీకరించడం; లేదా లూకా కథనంలోని నెరవేర్పును బట్టి యేసు ప్రభువు అని స్పష్టీకరించడం.
  rationale: ఈ మాటలు ప్రభువు మార్గాన్ని సిద్ధం చేయడం గురించి యెషయా, మలాకీ ప్రవచనాలను ప్రతిధ్వనింపజేస్తాయి; అదే సమయంలో లూకా కథనంలో యోహాను యేసుకు ముందుగా సేవ చేస్తాడు. అనువాద పంక్తిలో ‘ప్రభువు’ అని ఉంచడం ఈ ఉద్దేశపూర్వకమైన ధార్మిక ఉద్వేగాన్ని ముందుగానే పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ప్రవచనాత్మక గంభీరత కోసం ‘సర్వోన్నతుడు,’ ‘ప్రభువు,’ ‘మార్గాలు’ వంటి పదాలను నిలిపి, వాక్య నిర్మాణాన్ని సహజమైన తెలుగు ప్రవాహానికి అనుగుణంగా రెండు వాక్యాలుగా ఇచ్చాం.
