id: LUK.1.29
reference: Luke 1:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ δὲ ⸂ἐπὶ τῷ λόγῳ διεταράχθη⸃ καὶ διελογίζετο ποταπὸς εἴη ὁ ἀσπασμὸς οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/029.yaml
  text: But she was greatly troubled at the message[b][a], and kept considering what kind of greeting this might be.
translation:
  language: te
  text: అయితే ఆమె ఆ మాటవల్ల ఎంతో కలవరపడింది[a]; ఈ పలకరింపు ఎలాంటిదో అని ఆలోచిస్తూ ఉంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ సందేశంవల్ల,’ ‘ఆ పలుకువల్ల.’ λόγος అనే గ్రీకు పదానికి ‘మాట,’ ‘పలుకు,’ లేదా ‘సందేశం’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దీర్ఘంగా ఆలోచించింది,’ ‘తనలో తాను విచారిస్తూ ఉంది.’ గ్రీకు అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న ఆలోచనను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: ముందున్న దూత పలకరింపునుంచి మరియ స్పందనకు వచ్చే స్వల్ప వ్యత్యాసాన్ని, కథన పురోగతిని సహజంగా తెలియజేస్తుంది.
- source_word: ἐπὶ τῷ λόγῳ
  choice: ఆ మాటను బట్టి
  rationale: λόγος ఇక్కడ దూత పలికిన మాట లేదా సందేశాన్ని సూచిస్తుంది; ἐπί + చతుర్థీ విభక్తిలోని కారణార్థాన్ని కూడా ఈ ప్రయోగం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: διεταράχθη
  choice: ఎంతో కలవరపడింది
  rationale: ఈ క్రియ తీవ్రమైన అంతరంగ కలవరాన్ని సూచిస్తుంది; 'ఎంతో' దాని బలాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: διελογίζετο
  choice: ఆలోచిస్తూ ఉంది
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న అంతరంగ విచారణను సూచిస్తుంది; ఈ క్రియారూపం ఆ కొనసాగింపును నిలుపుతుంది.
- source_word: ποταπὸς
  choice: ఎలాంటిది
  rationale: పలకరింపు స్వభావం లేదా రకం ఏమిటని ప్రశ్నించే భావాన్ని సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἴη
  choice: అై ఉంటుందో
  rationale: పరోక్ష ప్రశ్నలోని సంభావనాత్మక, అనిశ్చిత ఛాయను సూటిగా తీర్మానించకుండా నిలుపుతుంది.
- source_word: ἀσπασμὸς
  choice: పలకరింపు
  rationale: దూత పలికిన అభివాదాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: οὗτος
  choice: ఈ
  rationale: ఇప్పుడే పలికిన నిర్దిష్ట పలకరింపును సూచిస్తుంది.
theological_decisions:
- issue: మరియ కలవర స్వభావం
  choice: ఆమె దూత పలికిన మాటను బట్టి కలవరపడి, ఆ పలకరింపు అర్థం గురించి ఆలోచించినట్లు అనువదించబడింది.
  alternative: దూత రూపాన్ని చూసి భయపడిందని లేదా ఆమె స్పందన అవిశ్వాసాన్ని సూచిస్తుందని అర్థం చేయడం.
  rationale: గ్రీకు పాఠం కలవరాన్ని ἐπὶ τῷ λόγῳ ద్వారా పలికిన మాటతో అనుసంధానిస్తుంది; ఆమె స్పందనపై పాపం, అవిశ్వాసం లేదా నైతిక తప్పిదం అనే తీర్పును ఇవ్వదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘పలకరింపు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండగా, ‘ఎంతో కలవరపడింది’ మూలంలోని తీవ్రతను అతిశయోక్తి లేకుండా అందిస్తుంది. ప్రధాన పాఠంలో [a], [b] గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
