- from: అయితే ఆమె ఆ మాటను బట్టి ఎంతో కలవరపడింది[a]; ఈ పలకరింపు ఎలాంటిదై ఉంటుందో అని ఆలోచిస్తూ ఉంది[b].
  to: అయితే ఆమె ఆ మాటవల్ల ఎంతో కలవరపడింది[a]; ఈ పలకరింపు ఎలాంటిదో అని ఆలోచిస్తూ ఉంది[b].
