id: LUK.1.59
reference: Luke 1:59
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῇ ⸂ἡμέρᾳ τῇ ὀγδόῃ⸃ ἦλθον περιτεμεῖν τὸ παιδίον, καὶ ἐκάλουν αὐτὸ ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ Ζαχαρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/059.yaml
  text: And it happened that on the eighth day they came to circumcise the child[a], and they were calling him Zechariah[b], after the name of his father.
translation:
  language: te
  text: ఎనిమిదవ రోజున వారు ఆ బిడ్డకు సున్నతి చేయడానికి వచ్చారు. అతనికి అతని తండ్రి పేరును బట్టి జెకర్యా అని పేరు పెడుతున్నారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనిని జెకర్యా అని పిలిచారు.” గ్రీకులోని అసంపూర్ణ భూతకాల క్రియ ఈ నామకరణం కొనసాగుతున్నదని లేదా ప్రయత్నదశలో ఉందని సూచించవచ్చు; తరువాతి వచనంలో వచ్చే సవరణకు ఇది సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అతని తండ్రి పేరును బట్టి అతనిని జెకర్యా అని పిలుస్తున్నారు.” ఇది కుటుంబ సభ్యుని పేరును బిడ్డకు పెట్టే ఆచారాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγένετο
  choice: '[తెలుగులో ప్రత్యేక పదంగా అనువదించలేదు]'
  rationale: ఇది లూకా వాడే కథనారంభ సూత్రం. ‘అప్పుడు జరిగింది ఏమిటంటే’ అని యాంత్రికంగా అనువదించడం కంటే, సహజమైన తెలుగు కాలవాక్యంతో సంఘటనను నేరుగా ప్రారంభించడం దాని కథన విధిని కాపాడుతుంది.
- source_word: ἐν τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: ఎనిమిదవ రోజున
  rationale: నిర్దిష్ట సమయాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἦλθον
  choice: వారు ... వచ్చారు
  rationale: గ్రీకులో కర్త నిర్దిష్టంగా చెప్పని బహువచనం. ఎవరో ఒక వర్గాన్ని అదనంగా చేర్చకుండా అదే అనిర్దిష్టతను ఉంచుతుంది.
- source_word: περιτεμεῖν
  choice: సున్నతి చేయడానికి
  rationale: ఉద్దేశాన్ని తెలిపే గ్రీకు క్రియారూపాన్ని నేరుగా, సాధారణ తెలుగు వాడుకలో అందిస్తుంది.
- source_word: τὸ παιδίον
  choice: ఆ బిడ్డకు
  rationale: సందర్భంలో ఎనిమిది రోజుల శిశువును సూచించేందుకూ, παιδίον యొక్క మృదువైన భావాన్ని అందించేందుకూ ‘బిడ్డ’ సహజంగా ఉంటుంది.
- source_word: ἐκάλουν
  choice: పేరు పెట్టబోయారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా ప్రయత్నదశలో ఉన్న నామకరణాన్ని సూచించవచ్చు. తదుపరి వచనంలోని తల్లి అభ్యంతరానికి సరిపోయేలా, పేరు ఖరారైపోయిందని చెప్పకుండా ఈ భావాన్ని కాపాడుతుంది.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ
  choice: అతని తండ్రి పేరును బట్టి
  rationale: తండ్రి పేరే బిడ్డకు పెట్టే కుటుంబ నామకరణ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: Ζαχαρίαν
  choice: జెకర్యా
  rationale: బైబిలు తెలుగు వాడుకలో పరిచితమైన, మూలనామానికి సమీపమైన రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని అనిర్దిష్ట బహువచన కర్తను అలాగే ఉంచి, ἐκάλουνలోని కొనసాగుతున్న లేదా ప్రయత్నదశ భావాన్ని ప్రధాన పాఠ్యంలో సహజంగా వ్యక్తం చేసింది.
