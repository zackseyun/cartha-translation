    rationale: ఈ రూపం ‘పేరు పెట్టడానికి ఉద్దేశించారు/పెట్టబోతున్నారు’ అనే భావాన్ని ఇస్తుంది. గ్రీకు అసంపూర్ణ భూతకాల క్రియ ἐκάλουν మాత్రం వారు జెకర్యా అని పిలుస్తూ లేదా పేరు పెడుతూ ఉన్న చర్యను సూచిస్తుంది; తరువాతి వచనం దానిని అడ్డుకుంటుంది లేదా సవరిస్తుంది.
