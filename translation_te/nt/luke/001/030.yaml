source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ ἄγγελος αὐτῇ· Μὴ φοβοῦ, Μαριάμ, εὗρες γὰρ χάριν παρὰ τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/030.yaml
  text: And the angel said to her[a], “Do not be afraid, Mary, for you have found favor with God.”
translation:
  language: te
  text: 'దేవదూత ఆమెతో ఇలా చెప్పాడు: “మరియా, భయపడకు, ఎందుకంటే నీవు దేవుని దృష్టిలో అనుకూలత పొందావు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కృప.” గ్రీకు χάρις అనే పదానికి “కృప” లేదా “అనుకూలత” అనే అర్థాలు ఉండవచ్చు. “దేవుని దృష్టిలో అనుకూలత పొందావు” అనే నుడికారం దేవుని అనుకూలమైన దృష్టిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: చెప్పాడు
  rationale: λέγω యొక్క కథన సందర్భంలోని సాధారణ భూతకాల క్రియను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἄγγελος
  choice: దేవదూత
  rationale: లూకా బాల్యవృత్తాంతంలో ఇది పరలోక సంబంధమైన దూతను సూచిస్తుంది; ‘దేవదూత’ సందర్భానుకూలంగా స్పష్టమైన తెలుగు పదం.
- source_word: Μὴ φοβοῦ
  choice: భయపడకు
  rationale: μήతో కూడిన ఆజ్ఞార్థక రూపంలోని నిషేధాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: Μαριάμ
  choice: మరియా
  rationale: గ్రీకు Μαριάμ పేరుకు ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: εὗρες
  choice: నీకు లభించింది
  rationale: అక్షరార్థంగా ‘నీవు కనుగొన్నావు’ అయినా, χάρινతో కూడిన నుడికారంలో పొందిన అనుగ్రహం ఇప్పుడు ఆమెకు ఉందనే ఫలితస్థితిని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: χάριν
  choice: అనుగ్రహం
  rationale: χάριςకు కృప లేదా అనుకూలత అనే భావాలు ఉన్నాయి. ఇక్కడ దేవుని దయాపూర్వక అనుకూలతను సూచిస్తూ, తెలుగు బైబిలు భాషలో సహజంగా ఉండే ‘అనుగ్రహం’ రెండింటి భావపరిధిని కొంతవరకు నిలుపుతుంది.
- source_word: παρὰ τῷ θεῷ
  choice: దేవుని అనుగ్రహం
  rationale: εὑρίσκω χάριν παρά + దత్తివ విభక్తి అనే నుడికారం ‘దేవుని సమక్షంలో/దేవుని వద్ద అనుకూలత పొందడం’ అని అర్థం. తెలుగు వాక్యనిర్మాణంలో సంబంధాన్ని ‘దేవుని అనుగ్రహం’గా సహజంగా వ్యక్తపరచింది.
theological_decisions:
- issue: మరియకు సంబంధించిన సందర్భంలో χάριν అనువాదం
  choice: అనుగ్రహం
  alternative: కృప; దేవుని దృష్టిలో అనుకూలత
  rationale: ఈ నుడికారం దేవుని అనుకూలత పొందడాన్ని సూచిస్తుంది. ‘అనుగ్రహం’ మూలంలోని దయ/అనుకూలత భావాన్ని నిలుపుతూ, తరువాతి కాలపు ప్రత్యేక సిద్ధాంతార్థాన్ని వాక్యంలోకి బలవంతంగా చేర్చదు. ప్రత్యామ్నాయ భావాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సంబోధన, నిషేధం, కారణసూచక భావం నిలుపబడ్డాయి; తెలుగులో సహజ ప్రవాహం కోసం కారణాన్ని సెమికోలన్‌తో అనుసంధానించాం.
