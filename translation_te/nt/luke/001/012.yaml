  text: And Zechariah was troubled when he saw him[a], and fear fell upon him.
translation:
  language: te
  text: జెకర్యా అతన్ని చూసినప్పుడు[a] కలవరపడ్డాడు; భయం అతని మీద పడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతన్ని చూసి’; గ్రీకులోని కృదంతాన్ని ఇలా మరింత అక్షరార్థంగా అనువదించవచ్చు. సందర్భంలో దాని కాలసంబంధ భావాన్ని ‘చూసినప్పుడు’ స్పష్టంగా తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταράχθη
  choice: కలవరపడ్డాడు
  rationale: ఇది అంతరంగంలో కలిగిన కలతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; తరువాత స్పష్టంగా చెప్పిన ‘భయం’ భావాన్ని ముందుగానే అతిశయింపజేయదు.
- source_word: Ζαχαρίας
  choice: జెకర్యా
  rationale: తెలుగులో సుపరిచితమైన బైబిలు వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
- source_word: ἰδών
  choice: అతన్ని చూసినప్పుడు
  rationale: గ్రీకు భూతకాల కృదంతానికి సందర్భంలో ఉన్న కాలసంబంధ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘అతన్ని’ అనేది ముందటి వచనంలోని దేవదూతను సూచిస్తుంది.
- source_word: φόβος
  choice: భయం
  rationale: మూలపదంలోని సాధారణ భయభావాన్ని నేరుగా తెలియజేస్తుంది; ‘భీతి’ లేదా ‘తీవ్ర భయం’ వంటి పదాలతో అనవసరంగా తీవ్రతను పెంచదు.
- source_word: ἐπέπεσεν ἐπ’ αὐτόν
  choice: అతని మీద పడింది
  rationale: మూలంలోని ‘మీద పడడం’ అనే రూపకాన్ని నిలుపుతూ తెలుగులో స్పష్టంగా, గంభీరంగా ఉంటుంది.
theological_decisions:
- issue: ἰδών అనే కృదంతంలో కర్మ ప్రత్యక్షంగా లేకపోవడం
  choice: సందర్భానుసారం ‘అతన్ని’ అని చేర్చి దేవదూతను సూచించడం
  alternative: కర్మను చెప్పకుండా ‘చూసినప్పుడు’ అని అనువదించడం
  rationale: ముందటి వచనంలో కనిపించిన దేవదూతే సహజమైన సూచిత కర్మ; దీన్ని స్పష్టం చేయడం కొత్త భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్యంలోని గంభీరతను మరియు ‘భయం అతని మీద పడింది’ అనే మూల రూపకాన్ని నిలుపుతూ అనువదించబడింది.
