id: LUK.1.61
reference: Luke 1:61
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπαν πρὸς αὐτὴν ὅτι Οὐδείς ἐστιν ⸂ἐκ τῆς συγγενείας⸃ σου ὃς καλεῖται τῷ ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/061.yaml
  text: And they said to her[a], “None of your relatives is called by this name.”
translation:
  language: te
  text: వారు ఆమెతో, “నీ బంధువులలో ఈ పేరుతో పిలువబడే వారు ఎవరూ లేరు” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπαν πρὸς αὐτὴν
  choice: వారు ఆమెతో ... అన్నారు
  rationale: మాట్లాడబడిన వ్యక్తిని సూచించే πρός + accusative నిర్మాణాన్ని సహజమైన తెలుగు సంభాషణా రూపమైన ‘ఆమెతో ... అన్నారు’గా అనువదించాం.
- source_word: Οὐδείς ἐστιν
  choice: ఎవరూ లేరు
  rationale: గ్రీకులోని సంపూర్ణ నిరాకరణను ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐκ τῆς συγγενείας σου
  choice: నీ బంధువుల్లో
  rationale: συγγένεια ఇక్కడ బంధుత్వ వర్గాన్ని సూచిస్తుంది; ‘బంధువుల్లో’ అనే రూపం గ్రీకు partitive భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ὃς καλεῖται
  choice: పిలువబడేవారు
  rationale: పేరుతో పిలవబడటం అనే καλέω యొక్క వర్తమాన కర్మణి భావాన్ని నిలుపుతుంది; తెలుగులో బంధువుల పట్ల గౌరవబహువచనం సహజం.
- source_word: τῷ ὀνόματι τούτῳ
  choice: ఈ పేరుతో
  rationale: τούτῳ సూచించే, అప్పుడే ప్రతిపాదించిన నిర్దిష్ట పేరును ‘ఈ’ స్పష్టంగా ప్రతిబింబిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘బంధుత్వం/బంధువులు’ భావాన్ని ‘కుటుంబం’గా కుదించకుండా నిలిపాం.
