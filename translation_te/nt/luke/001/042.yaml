id: LUK.1.42
reference: Luke 1:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀνεφώνησεν ⸀κραυγῇ μεγάλῃ καὶ εἶπεν· Εὐλογημένη σὺ ἐν γυναιξίν, καὶ εὐλογημένος ὁ καρπὸς τῆς κοιλίας σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/042.yaml
  text: And she cried out with a loud voice and said[a], “Blessed are you among women, and blessed is the fruit of your womb.”
translation:
  language: te
  text: 'ఆమె బిగ్గరగా కేక వేసి ఇలా పలికింది[a]: “స్త్రీలలో నీవు ధన్యురాలివి, నీ గర్భఫలం ధన్యమైనది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమె బిగ్గరగా పలికింది.”
    reason: ἀνεφώνησεν క్రియను ‘బిగ్గరగా పలికింది’గా, κραυγῇ μεγάλῃ పదబంధం తెలిపే గట్టితనాన్ని క్రియలోనే కలిపి చెప్పే సహజమైన ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: ἀνεφώνησεν
  choice: కేకవేసి
  rationale: ఈ క్రియ బిగ్గరగా పలకడం లేదా ఉద్ఘాటనతో గట్టిగా చెప్పడాన్ని సూచిస్తుంది. సందర్భంలో దుఃఖార్తమైన కేకను కాక, ఉత్సాహంతో బిగ్గరగా పలికిన భావాన్ని ఇస్తుంది.
- source_word: κραυγῇ μεγάλῃ
  choice: బిగ్గరగా
  rationale: దత్తి విభక్తిలోని ఈ పదబంధం పలికిన విధానాన్ని తెలుపుతుంది. సహజమైన ఆధునిక తెలుగులో ‘బిగ్గరగా’ దాని తీవ్రతను, వినిపించే స్థాయిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: Εὐλογημένη
  choice: ధన్యురాలివి
  rationale: స్త్రీని ఉద్దేశించిన ఆశీర్వాద ప్రకటనగా ఇది సహజమైన, గౌరవప్రదమైన తెలుగు రూపం; ‘అనుగ్రహించబడినదానవు’ అని మార్చి వేరే పదక్షేత్రాన్ని దిగుమతి చేయదు.
- source_word: ἐν γυναιξίν
  choice: స్త్రీలలో
  rationale: గ్రీకు పాఠంలో లేని ‘అందరి’ అనే పదాన్ని చేర్చకుండా, ఇతర స్త్రీల మధ్య ఆమె విశిష్ట ధన్యతను యథాతథంగా ఉంచుతుంది.
- source_word: εὐλογημένος
  choice: ధన్యమైనది
  rationale: ముందటి ఆశీర్వాద ప్రకటనతో సమాంతరతను కాపాడుతూ, ‘గర్భఫలం’ అనే నపుంసక నామానికి తెలుగులో వ్యాకరణబద్ధంగా సరిపోతుంది.
- source_word: ὁ καρπὸς
  choice: ఫలం
  rationale: మూలంలోని రూపకాన్ని కాపాడుతుంది. ‘శిశువు’ లేదా ‘సంతానం’ కంటే పాఠ్యరూపానికి దగ్గరగా ఉండి, తెలుగులోని బైబిలు భాషలోనూ అర్థమయ్యే పదం.
- source_word: τῆς κοιλίας σου
  choice: నీ గర్భ
  rationale: గర్భధారణ సందర్భంలో κοιλία గర్భాన్ని సూచిస్తుంది. ‘నీ గర్భఫలం’ అనే సమాససదృశ ప్రయోగం సహజంగా ఉండి, మాతృగర్భ చిత్రణను నిలుపుతుంది.
theological_decisions:
- issue: మరియను ఉద్దేశించిన ఆశీర్వాద ప్రకటన
  choice: స్త్రీలలో నీవు ధన్యురాలివి
  alternative: స్త్రీలలో నీవు ఆశీర్వదించబడినదానవు
  rationale: ఈ రూపం పాఠంలోని ఆశీర్వాద ప్రకటనను గౌరవంగా నిలుపుతుంది; మరియ పాత్రను తగ్గించదు, అలాగే తరువాతి కాలపు సిద్ధాంతార్థాలను పాఠంలో అదనంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘ధన్యురాలివి’ మరియు ‘గర్భఫలం’ మూలంలోని ఆశీర్వాద సూత్రాన్నీ రూపకాన్నీ నిలుపుతాయి; పునరుక్తిగా అనిపించకుండా బిగ్గరగా పలికిన భావాన్ని ప్రధాన పాఠం, పాదటిప్పణి రెండింటిలో పారదర్శకంగా చూపించాం.
