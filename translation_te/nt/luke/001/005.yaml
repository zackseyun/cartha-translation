id: LUK.1.5
reference: Luke 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγένετο ἐν ταῖς ἡμέραις ⸀Ἡρῴδου βασιλέως τῆς Ἰουδαίας ἱερεύς τις ὀνόματι Ζαχαρίας ἐξ ἐφημερίας Ἀβιά, ⸀καὶ γυνὴ ⸀αὐτῷ ἐκ τῶν θυγατέρων Ἀαρών, καὶ τὸ ὄνομα αὐτῆς Ἐλισάβετ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/005.yaml
  text: In the days of Herod[a], king of Judea, there was a priest named Zechariah, from the division of Abijah; and he had a wife from the daughters of Aaron[b], and her name was Elizabeth.
translation:
  language: te
  text: యూదయ రాజైన హేరోదు కాలంలో, అబీయా యాజక విభాగానికి చెందిన[a] జెకర్యా అనే ఒక యాజకుడు ఉండేవాడు. అతనికి అహరోను కుమార్తెలలోనుండి వచ్చిన[b] భార్య ఉండేది; ఆమె పేరు ఎలిజబెతు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అబీయా యాజక విభాగం’ అనేది ఆలయ సేవ కోసం ఏర్పాటుచేయబడిన యాజక సేవా బృందాలలో ఒకటి.
    reason: cultural_note
  - marker: b
    text: మూల గ్రీకులో అక్షరార్థంగా ‘అహరోను కుమార్తెలలోనుండి’ అని ఉంది; ఇది అహరోను యాజక వంశానికి చెందిన స్త్రీని సూచించే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: ఉండేవాడు
  rationale: ఇక్కడ ఇది కథనంలో ఒక వ్యక్తిని పరిచయం చేసే సూత్రప్రాయ ప్రయోగం; సహజమైన తెలుగులో అస్తిత్వ భావాన్ని తెలియజేస్తుంది.
- source_word: ἐν ταῖς ἡμέραις Ἡρῴδου βασιλέως τῆς Ἰουδαίας
  choice: యూదయ రాజైన హేరోదు కాలంలో
  rationale: కాలసూచనను, హేరోదు రాజపదవిని, అతని పాలనా ప్రాంతాన్ని సహజమైన ఆధునిక తెలుగులో కాపాడుతుంది.
- source_word: ἱερεύς τις ὀνόματι Ζαχαρίας
  choice: జెకర్యా అనే ఒక యాజకుడు
  rationale: τις లోని అనిర్దిష్ట పరిచయ భావాన్ని ‘ఒక’తో, ὀνόματι అనే నామకరణ ప్రయోగాన్ని ‘అనే’తో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐξ ἐφημερίας Ἀβιά
  choice: అబీయా యాజక విభాగానికి చెందిన
  rationale: ἐφημερία అనేది ఆలయ సేవకు నియమించబడిన యాజకుల విభాగాన్ని సూచిస్తుంది; ప్రధాన పాఠ్యంలో ‘యాజక’ అని చేర్చడం సంస్థాగత భావాన్ని స్పష్టం చేస్తుంది.
- source_word: γυνὴ αὐτῷ
  choice: అతని భార్య
  rationale: αὐτῷ ఇక్కడ స్వామ్యార్థక చతుర్థీ విభక్తి; తెలుగులో ‘అతని భార్య’ సహజమైన సమానార్థకం.
- source_word: ἐκ τῶν θυγατέρων Ἀαρών
  choice: అహరోను కుమార్తెల వంశానికి చెందినది
  rationale: మూలంలోని ‘అహరోను కుమార్తెలలోనుండి’ అనే కుటుంబ రూపకాన్ని నిలుపుతూ, ఇది వంశసంబంధాన్ని సూచిస్తోందని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τὸ ὄνομα αὐτῆς Ἐλισάβετ
  choice: ఆమె పేరు ఎలిజబెతు
  rationale: మూలంలోని నామకరణ సూత్రానికి సూటిగా, సహజంగా సరిపోతుంది.
theological_decisions:
- issue: ఎలిజబెతు యాజక వంశాన్ని తెలిపే పదబంధం
  choice: అహరోను కుమార్తెల వంశానికి చెందినది
  alternative: అహరోను సంతతికి చెందినది
  rationale: గ్రీకు మూలంలోని నిర్దిష్టమైన ‘కుమార్తెలు’ అనే కుటుంబ చిత్రణను కాపాడుతూ, సందర్భంలోని వంశార్థాన్ని స్పష్టం చేస్తుంది; అదనపు సిద్ధాంతార్థాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని అనుసంధానాన్ని తెలుగులో సహజమైన రెండు ఉపవాక్యాలుగా సమన్వయపరిచాం. పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో వాటి సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
