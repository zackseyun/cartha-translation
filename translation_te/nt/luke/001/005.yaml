revisions:
- from: యూదయ రాజైన హేరోదు కాలంలో, అబీయా యాజక విభాగానికి చెందిన జెకర్యా అనే ఒక యాజకుడు ఉండేవాడు.[a] అతని భార్య అహరోను కుమార్తెల వంశానికి చెందినది;[b] ఆమె పేరు ఎలిజబెతు.
  to: యూదయ రాజైన హేరోదు కాలంలో, అబీయా యాజక విభాగానికి చెందిన[a] జెకర్యా అనే ఒక యాజకుడు ఉండేవాడు. అతనికి అహరోను కుమార్తెలలోనుండి వచ్చిన[b] భార్య ఉండేది; ఆమె పేరు ఎలిజబెతు.
  rationale: The revision preserves every source element and the narrative’s ambiguity while replacing an unnatural genealogical construction with a closer Telugu rendering. It also moves the Abijah note marker to its actual referent. No doctrinal interpretation has been added.
