  edition: SBLGNT
  text: ἐν ὁσιότητι καὶ δικαιοσύνῃ ἐνώπιον αὐτοῦ ⸂πάσαις ταῖς ἡμέραις⸃ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/075.yaml
  text: in holiness and righteousness before him all our days[a].
translation:
  language: te
  text: మన రోజులన్నిటిలో ఆయన సన్నిధిలో పవిత్రతతోను నీతితోను[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘న్యాయంతో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν
  choice: -తో
  rationale: సేవ జరిగే విధానాన్ని లేదా లక్షణాన్ని తెలిపే ఈ విభక్తి భావాన్ని తెలుగులో సహజంగా తృతీయా విభక్తి ‘-తో’ ద్వారా వ్యక్తం చేశాం.
- source_word: ὁσιότητι
  choice: పవిత్రతతో
  rationale: దేవునితో సంబంధంలో భక్తిపూర్వకమైన పవిత్రతను సూచిస్తుంది; δικαιοσύνῃతో ఉన్న భేదాన్ని కూడా నిలుపుతుంది.
- source_word: καὶ
  choice: ','
  rationale: తెలుగులో జతగా వచ్చే రెండు సమాన గుణాలను విరామచిహ్నంతో కలపడం సహజం; మూలంలోని సమన్వయ భావం నిలిచింది.
- source_word: δικαιοσύνῃ
  choice: నీతితో
  rationale: ఇక్కడ దేవుని సన్నిధిలోని నైతిక యథార్థత, సత్ప్రవర్తన భావం ప్రధానంగా ఉంది. ‘నీతి’ పవిత్రతతో జతగా సహజంగా ఉండి, ‘న్యాయం’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: ἐνώπιον αὐτοῦ
  choice: ఆయన సన్నిధిలో
  rationale: దేవుని సమక్షంలోను ఆయన దృష్టిలోను అనే సంబంధాత్మక, మూల్యాంకన భావాలను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πάσαις ταῖς ἡμέραις ἡμῶν
  choice: మన రోజులన్నిటిలో
  rationale: జీవితకాలమంతటినీ సూచించే గ్రీకు ప్రయోగాన్ని, మూలంలో లేని ‘జీవితం’ అనే పదాన్ని చేర్చకుండా సహజంగా అందిస్తుంది.
theological_decisions:
- issue: పౌలు రచన కాని నైతిక సందర్భంలో δικαιοσύνη అనువాదం
  choice: నీతి
  alternative: న్యాయం
  rationale: ὁσιότηςతో జతగా, దేవుని సన్నిధిలో ఉండే నైతిక యథార్థతను ఈ పదం సూచిస్తుంది. అందువల్ల ‘నీతి’ సందర్భానికి బాగా సరిపోతుంది; సామాజిక న్యాయ భావాన్ని ముందుకు తెచ్చే ‘న్యాయం’ కూడా సాధ్యమైన పదార్థంగా పాదటిప్పణిలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, గౌరవప్రదంగా రూపొందించబడింది. ఇది ముందున్న క్రియకు అనుసంధానమయ్యే వాక్యభాగం కావడంతో మూలంలోని ఖండ నిర్మాణాన్ని నిలిపింది.
