id: LUK.1.10
reference: Luke 1:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πᾶν τὸ πλῆθος ἦν τοῦ λαοῦ προσευχόμενον ἔξω τῇ ὥρᾳ τοῦ θυμιάματος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/010.yaml
  text: And the whole multitude of the people was praying outside at the hour of the incense offering[a].
translation:
  language: te
  text: ధూపార్పణ వేళలో[a] ప్రజల సమూహమంతా బయట ప్రార్థిస్తూ ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ధూపం వేస్తున్న సమయంలో.’
    reason: θυμίαμα అనే పదాన్ని ధూప పదార్థంగా లేదా సందర్భానుసారం ధూపం వేయడమనే కార్యంగా వ్యక్తపరచవచ్చు.
lexical_decisions:
- source_word: πᾶν τὸ πλῆθος
  choice: ప్రజల సమూహమంతా
  rationale: πᾶν అనే పదం ఏకవచన సమూహవాచకమైన πλῆθος మొత్తాన్ని నొక్కిచెబుతుంది. ‘సమూహమంతా’ ఆ సమష్టి భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τοῦ λαοῦ
  choice: ప్రజల
  rationale: λαός ఇక్కడ ఆలయ పరిసరాల్లో కూడిన ప్రజలను సూచిస్తుంది. మూలపాఠంలో ‘ఇశ్రాయేలు’ అని స్పష్టంగా లేనందున దాన్ని చేర్చలేదు.
- source_word: προσευχόμενον
  choice: ప్రార్థిస్తూ ఉంది
  rationale: ἦν తో కూడిన వర్తమాన కృదంతం కొనసాగుతున్న కార్యాన్ని సూచిస్తుంది. ‘ప్రార్థిస్తూ ఉంది’ ఆ కొనసాగింపు భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘కలిసి’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: ἔξω
  choice: బయట
  rationale: ἔξω అనే పదానికి నేరమైన అర్థం ‘బయట.’ సందర్భం ఆలయం లేదా పరిశుద్ధ స్థలం వెలుపలని సూచించినా, మూలంలో లేని నిర్దిష్టతను ప్రధాన పాఠంలో చేర్చలేదు.
- source_word: τῇ ὥρᾳ
  choice: వేళలో
  rationale: ὥρα ఇక్కడ నిర్ణీత ఆరాధనా సమయాన్ని సూచిస్తుంది. ‘వేళలో’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ సమయ భావాన్ని నిలుపుతుంది.
- source_word: τοῦ θυμιάματος
  choice: ధూపార్పణ
  rationale: θυμίαμα ధూపాన్ని సూచిస్తుంది; ఆలయ సందర్భంలో అది ఆచారబద్ధంగా ధూపం అర్పించడాన్ని సూచిస్తుంది. ‘ధూపార్పణ’ ఆ ఆరాధనా సందర్భాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
theological_decisions:
- issue: θυμίαμα లోని ఆలయ ఆరాధనా పరిభాష
  choice: ధూపార్పణ
  alternative: ధూపం వేయడం
  rationale: ఈ సందర్భం యాజకుడు ఆలయంలో ధూపం అర్పించే నిర్ణీత ఆరాధనా సమయాన్ని సూచిస్తుంది. ‘ధూపార్పణ’ ఆచారబద్ధమైన భావాన్ని నిలుపుతుంది; అయితే తరువాతి సిద్ధాంతపరమైన భావాలను దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. సమూహవాచక కర్తకు అనుగుణంగా ‘ఉంది’ అనే ఏకవచన క్రియారూపం ఉంచబడింది.
