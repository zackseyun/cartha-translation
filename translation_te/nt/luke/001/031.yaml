    reason: καλέσεις τὸ ὄνομα αὐτοῦ అనే నామకరణ సూత్రానికి అక్షరార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని రాబోయే గంభీర ప్రకటనవైపు మళ్లించే ἰδού యొక్క సంభాషణాత్మక బలాన్ని సహజమైన బైబిలీయ తెలుగులో నిలుపుతుంది.
- source_word: συλλήμψῃ ἐν γαστρὶ
  choice: నీవు గర్భం ధరిస్తావు
  rationale: గర్భధారణను సూచించే గ్రీకు వ్యక్తీకరణను ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా అందిస్తుంది; ‘నీ గర్భంలో గర్భం ధరిస్తావు’ అనే అసహజ పునరుక్తిని నివారిస్తుంది.
- source_word: τέξῃ υἱόν
  choice: ఒక కుమారుణ్ణి కంటావు
  rationale: τίκτω యొక్క ప్రసవార్థాన్ని, υἱός యొక్క లింగనిర్దిష్టమైన ‘కుమారుడు’ అర్థాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: ఆయనకు ... అని పేరు పెట్టాలి
  rationale: గ్రీకు నామకరణ సూత్రాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది. భవిష్యదర్థక రూపం సందర్భంలో ఆజ్ఞాత్మక భావాన్ని కలిగి ఉండవచ్చు; తెలుగు ‘పెట్టాలి’ దానిని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: Ἰησοῦν
  choice: యేసు
  rationale: కొత్త నిబంధనలో స్థిరపడిన ప్రామాణిక తెలుగు నామరూపాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: καλέσεις అనే భవిష్యత్ రూపంలోని నామకరణ భావం
  choice: పేరు పెట్టాలి
  alternative: పేరు పెడతావు
  rationale: రూపం వ్యాకరణపరంగా భవిష్యత్తయినా, దేవదూత ప్రకటనలో ఇది నామకరణ ఆదేశంగా వినిపిస్తుంది. ‘పెట్టాలి’ ఆ సందర్భబలాన్ని సహజ తెలుగులో చూపుతుంది; ప్రత్యామ్నాయ భవిష్యత్ పఠనాన్ని పాదసూచికలో ఉంచి అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘ఇదిగో’ ప్రకటన స్వరాన్ని నిలుపుతుంది; నామకరణ వాక్యం సహజ తెలుగు క్రమంలో ఇవ్వబడింది.
