  yaml_path: translation/nt/luke/001/031.yaml
  text: And behold[a], you will conceive in your womb and bear a son, and you will call his name Jesus.
translation:
  language: te
  text: ఇదిగో, నీవు గర్భం ధరించి ఒక కుమారుణ్ణి కంటావు, అతనికి యేసు అని పేరు పెడతావు.[a]
  philosophy: optimal-equivalence
  footnotes:
