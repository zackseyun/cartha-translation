id: LUK.1.79
reference: Luke 1:79
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπιφᾶναι τοῖς ἐν σκότει καὶ σκιᾷ θανάτου καθημένοις, τοῦ κατευθῦναι τοὺς πόδας ἡμῶν εἰς ὁδὸν εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/079.yaml
  text: to shine on those sitting in darkness and the shadow of death[a], to guide our feet into the way of peace.
translation:
  language: te
  text: చీకటిలోను మరణపు నీడలోను[a] కూర్చున్నవారిపై ప్రకాశించడానికి, మన పాదాలను శాంతి మార్గంలోకి నడిపించడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మృత్యుచ్ఛాయలో.” కొందరు ఈ పదబంధాన్ని విస్తృతంగా “గాఢాంధకారంలో” అని అర్థం చేసుకుంటారు; అయితే గ్రీకులో “మరణం” అనే పదం స్పష్టంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφᾶναι
  choice: ప్రకాశించడానికి
  rationale: వెలుగు చీకటిలోకి ప్రసరించే దృశ్యాన్ని నిలుపుతూ, గ్రీకు ఉద్దేశార్థక క్రియారూపాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοῖς ἐν σκότει ... καθημένοις
  choice: చీకటిలో ... కూర్చున్నవారిపై
  rationale: καθημένοις‌లోని ‘కూర్చున్న’ అనే స్పష్టమైన దృశ్యాన్ని ‘నివసిస్తున్న’ అని సడలించకుండా నిలుపుతుంది; దత్తివిభక్తి భావాన్ని ‘వారిపై’ సహజంగా తెలియజేస్తుంది.
- source_word: σκότει
  choice: చీకటిలో
  rationale: పదంలోని ప్రత్యక్ష, రూపకాలంకార అర్థాలు రెండింటినీ ముందుగానే వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: σκιᾷ θανάτου
  choice: మరణపు నీడలో
  rationale: θανάτου అనే ‘మరణం’ భావాన్ని స్పష్టంగా ఉంచి, బైబిలు కవితాత్మక ప్రతిబింబమైన ‘నీడ’ను కూడా కాపాడుతుంది.
- source_word: τοῦ κατευθῦναι
  choice: నడిపించడానికి
  rationale: ఉద్దేశాన్ని తెలిపే గ్రీకు క్రియారూపాన్ని, ‘పాదాలు–మార్గం’ రూపకానికి తగిన సహజమైన తెలుగు క్రియతో అందిస్తుంది.
- source_word: τοὺς πόδας ἡμῶν
  choice: మన పాదాలను
  rationale: శరీర సంబంధమైన కవితాత్మక రూపకాన్ని ‘మనలను’ అని సంక్షిప్తం చేయకుండా యథాతథంగా నిలుపుతుంది.
- source_word: εἰς ὁδὸν εἰρήνης
  choice: శాంతి మార్గంలో
  rationale: ὁδός యొక్క మార్గ రూపకాన్ని కాపాడుతూ, గమనం లేదా దిశను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘శాంతిని కలిగించే మార్గం’ అని కారణార్థాన్ని జోడించదు.
theological_decisions:
- issue: చీకటి సంబంధమైన రూపకాలను వ్యాఖ్యానాత్మకంగా విప్పాలా, యథాతథంగా ఉంచాలా
  choice: చీకటి, మరణపు నీడ, పాదాలు, శాంతి మార్గం అనే రూపకాలను ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘ఆధ్యాత్మిక అజ్ఞానంలో ఉన్నవారికి వెలుగివ్వడానికి’ లేదా ‘శాంతిని కలిగించే జీవనంలో మనలను నడిపించడానికి’ అని వివరణాత్మకంగా అనువదించడం
  rationale: ఈ వాక్యం కవితాత్మకమైనది, పూర్వ గ్రంథభాషను ప్రతిధ్వనింపజేస్తుంది. రూపకాలను ఒకే ఆధ్యాత్మిక లేదా నైతిక వ్యాఖ్యానానికి పరిమితం చేయకుండా మూలంలోని భావ ఉద్వేగాన్ని కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక శైలి. ‘కూర్చున్నవారు,’ ‘పాదాలు,’ ‘మార్గం’ వంటి మూల దృశ్యాలను సరళీకరించకుండా, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలంతో నిలుపబడింది.
