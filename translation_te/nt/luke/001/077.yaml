  yaml_path: translation/nt/luke/001/077.yaml
  text: to give knowledge of salvation to his people in the forgiveness of their sins,[a]
translation:
  language: te
  text: తన ప్రజలకు వారి పాపాల క్షమాపణలో[a] రక్షణ గురించిన జ్ఞానాన్ని ఇవ్వడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి పాపాల క్షమాపణ ద్వారా’; లేదా, ‘వారి పాపాల క్షమాపణవల్ల.’
    reason: ἐν అనే విభక్త్యుపసర్గం ఇక్కడ పరిధి లేదా విధాన భావాన్ని సూచించవచ్చు; దగ్గరి ప్రత్యామ్నాయంగా సాధన/మాధ్యమ భావం కూడా సాధ్యమే.
lexical_decisions:
- source_word: τοῦ δοῦναι
  choice: ఇవ్వడానికి
  rationale: ఈ ఉద్దేశార్థక క్రియారూపం ముందటి వచనంలోని ప్రవచన సేవ ఉద్దేశాన్ని కొనసాగిస్తుంది; తెలుగులో ‘ఇవ్వడానికి’ సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: γνῶσιν
  choice: జ్ఞానాన్ని
  rationale: γνῶσις‌కు నేరమైన సమానార్థకం ‘జ్ఞానం’; ఇది అవగాహన స్వభావాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: σωτηρίας
  choice: రక్షణ జ్ఞానాన్ని
  rationale: ‘రక్షణను గురించిన జ్ఞానం’ అనే సంబంధాన్ని తెలుగులో సహజమైన సమాస నిర్మాణంతో వ్యక్తం చేస్తుంది; లూకా సందర్భంలోని రక్షణార్థాన్ని నిలుపుతుంది.
- source_word: τῷ λαῷ αὐτοῦ
  choice: తన ప్రజలకు
  rationale: సంప్రదాన విభక్తి జ్ఞానాన్ని పొందేవారిని సూచిస్తుంది; αὐτοῦను సందర్భంలోని కర్తకు తిరిగి సూచించే సహజ తెలుగు రూపమైన ‘తన’తో అనువదించాం.
- source_word: ἐν ἀφέσει
  choice: క్షమాపణలో
  rationale: ἐν యొక్క పరిధి లేదా విధాన భావాన్ని ‘లో’ నిలుపుతుంది; దానిని సాధనార్థకంగా మాత్రమే నిర్ణయించదు.
- source_word: ἁμαρτιῶν αὐτῶν
  choice: వారి పాపాల
  rationale: మూలంలోని బహువచనాన్ని, ప్రజలను సూచించే స్వామ్య సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: రక్షణకు పాపక్షమాపణతో ఉన్న సంబంధం
  choice: ‘వారి పాపాల క్షమాపణలో’ అని అనువదించి, రక్షణ జ్ఞానం పాపక్షమాపణతో సన్నిహితంగా అనుసంధానమై ఉందని చూపడం.
  alternative: ‘వారి పాపాల క్షమాపణ ద్వారా’ లేదా ‘వారి పాపాలు క్షమించబడడం వల్ల’.
  rationale: ἐν ἀφέσει అనే పదబంధం పరిధి, విధానం, లేదా సాధనం వంటి దగ్గరి భావాలకు అవకాశం ఇస్తుంది. ‘క్షమాపణలో’ మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతూ ఒకే వ్యాఖ్యానానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ఇది ముందటి వచనంపై ఆధారపడిన ఉద్దేశార్థక వాక్యభాగం కనుక ముగింపులో ‘ఇవ్వడానికి’ ఉంచబడింది.
