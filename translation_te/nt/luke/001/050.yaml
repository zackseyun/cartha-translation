id: LUK.1.50
reference: Luke 1:50
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὸ ἔλεος αὐτοῦ εἰς γενεὰς ⸂καὶ γενεὰς⸃ τοῖς φοβουμένοις αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/050.yaml
  text: And his mercy is for those who fear him from generation to generation[a][b][c].
translation:
  language: te
  text: మరియు ఆయనకు భయపడేవారిపట్ల[b] ఆయన కనికరం తరతరాలపాటు[a] ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తరతరాలపాటు’—గ్రీకులో అక్షరార్థంగా ‘తరాలకు మరియు తరాలకు’; అంటే వరుసగా వచ్చే తరాలన్నిటిలోనూ కొనసాగుతూ అని భావం. ‘తరం నుంచి తరానికి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆయనకు భయపడేవారు’ అంటే దేవునిపట్ల భయభక్తులతో జీవించేవారు; ‘ఆయనను భక్తితో గౌరవించేవారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: కనికరం
  rationale: అవసరంలో ఉన్నవారిపట్ల చూపే దయ, కరుణ అనే భావాన్ని ‘కనికరం’ సహజంగా వ్యక్తపరుస్తుంది; ఈ సందర్భంలోని దేవుని దయను అనవసరంగా మరింత నిర్దిష్టం చేయదు.
- source_word: εἰς γενεὰς καὶ γενεὰς
  choice: తరతరాలపాటు
  rationale: వరుసగా వచ్చే అనేక తరాలన్నిటికీ ఆయన కనికరం కొనసాగుతుందనే భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τοῖς φοβουμένοις αὐτόν
  choice: ఆయనకు భయపడేవారిపై
  rationale: దేవుని విషయంగా φοβέομαι గౌరవభరితమైన భయాన్ని సూచించగలదు. ‘భయపడేవారు’ అనే బైబిలు భావవ్యక్తీకరణను నిలుపుతూ, దత్తివు సూచించే లబ్ధిదారులను ‘పై’ ద్వారా సహజంగా తెలిపింది.
- source_word: καὶ
  choice: —
  rationale: ఈ వాక్యం ముందున్న కవితా పంక్తితో అనుసంధానమై ఉన్నప్పటికీ, తెలుగులో ప్రారంభ ‘మరియు’ లేకుండానే ఆ అనుసంధానం సహజంగా కొనసాగుతుంది.
- source_word: αὐτοῦ / αὐτόν
  choice: ఆయన / ఆయనకు
  rationale: సమీప సందర్భంలో ఈ సర్వనామాలు దేవుణ్ణి సూచిస్తాయి; గౌరవార్థక ఏకవచన రూపాలు తెలుగులో సహజమైనవి.
theological_decisions:
- issue: దేవునికి ‘భయపడడం’ అనే మాట యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో ‘ఆయనకు భయపడేవారు’ అని ఉంచడం
  alternative: ఆయనను భక్తితో గౌరవించేవారు
  rationale: గ్రీకు పదం కేవలం భీతిని మాత్రమే కాక దేవునిపట్ల భయభక్తులను కూడా సూచించగలదు. ‘భయపడేవారు’ అని ఉంచడం మూలంలోని బరువును, కొంత భావవిస్తృతిని కాపాడుతుంది; పాదసూచిక దాని సందర్భార్థాన్ని వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కవితా వాక్యంగా రూపొందించబడింది. ‘కనికరం,’ ‘భయపడేవారు,’ ‘తరతరాలపాటు’ అనే పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని ధార్మిక బరువును నిలుపుతాయి.
