  text: And immediately his mouth was opened[a], and his tongue also, and he began speaking[b], blessing God.
translation:
  language: te
  text: వెంటనే అతని నోరు, అతని నాలుక కూడా తెరుచుకున్నాయి[a]; అతడు దేవుణ్ణి స్తుతిస్తూ మాట్లాడసాగాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని అనువాదాలు ‘అతని నాలుక బంధం విడిపోయింది’ అని ఇస్తాయి. గ్రీకు పాఠంలో ‘విడిపోయింది’ అనే ప్రత్యేక క్రియ లేదు; ‘అతని నాలుక కూడా’ అనే మాటకు ముందున్న ‘తెరుచుకుంది’ అనే క్రియే వర్తిస్తుంది. తెలుగులో వాక్యం పూర్తిగా ఉండేందుకు ఆ ఉమ్మడి క్రియను స్పష్టంగా చూపించాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతడు దేవుణ్ణి స్తుతిస్తూ మాట్లాడుతున్నాడు.’ గ్రీకు అసంపూర్ణ భూతకాల క్రియ మాటల ఆరంభాన్ని గానీ, కొనసాగింపును గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῴχθη
  choice: తెరుచుకుంది
  rationale: ἀνοίγω యొక్క భూతకాల కర్మణి రూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, మాట తిరిగి రావడం అకస్మాత్తుగా జరిగిందని చూపుతుంది; కార్యసాధకుడు ఎవరో అదనంగా నిర్దేశించదు.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప కథన అనుసంధానకము. తెలుగు వాక్యప్రవాహంలో ‘వెంటనే’తో కొత్త ఘట్టం సహజంగా కొనసాగుతుంది; ‘కాని’ అని అనువదిస్తే లేనిపోని వ్యతిరేక భావం వస్తుంది.
- source_word: στόμα
  choice: నోరు
  rationale: మాట తిరిగి వచ్చిన సందర్భానికి సరిపోయే సరళమైన శరీరావయవ పదం.
- source_word: παραχρῆμα
  choice: వెంటనే
  rationale: ఆలస్యం లేకుండా తక్షణమే జరిగినదనే కాలసూచక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: καὶ ἡ γλῶσσα αὐτοῦ
  choice: అతని నాలుక కూడా
  rationale: గ్రీకు వాక్యంలో ‘విడిపోయింది’ అనే క్రియ లేదు. ముందున్న ‘తెరుచుకుంది’ అనే క్రియను భావపూర్వకంగా పంచుకునే గ్రీకు నిర్మాణాన్ని, తెలుగులో అసహజమైన అదనపు క్రియను చేర్చకుండా నిలుపుతుంది.
- source_word: ἐλάλει
  choice: మాట్లాడసాగాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ సందర్భంలో మాటల ఆరంభాన్ని లేదా కొనసాగింపును సూచించగలదు. మూగతనం తొలగిన వెంటనే అనే కథన సందర్భంలో ‘మాట్లాడసాగాడు’ సహజంగా సరిపోతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: εὐλογῶν
  choice: స్తుతిస్తూ
  rationale: దేవుని ఉద్దేశించి వాడినప్పుడు εὐλογέω ఆయనను ఘనపరచడం, కొనియాడడం అనే భావాన్ని ఇస్తుంది. ‘స్తుతిస్తూ’ ఆధునిక తెలుగు పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: τὸν θεόν
  choice: దేవుణ్ణి
  rationale: εὐλογῶν క్రియాభావానికి ప్రత్యక్ష కర్మ; తెలుగులో సహజమైన ద్వితీయా విభక్తితో అనువదించబడింది.
theological_decisions:
- issue: మాట తిరిగి రావడాన్ని వివరించే విధానం
  choice: గ్రీకులో ఉన్న ‘నోరు తెరుచుకుంది, నాలుక కూడా’ అనే సంక్షిప్త నిర్మాణాన్ని నిలిపి, ‘నాలుక విడిపోయింది’ అని ప్రధాన పాఠ్యంలో చేర్చలేదు.
  alternative: ‘అతని నాలుక బంధం విడిపోయింది’ లేదా ‘అతని నాలుక స్వాధీనమైంది’
  rationale: ఆ భావం సందర్భంలో ఉద్దేశించబడినప్పటికీ, మూల గ్రీకు వాక్యంలో ‘విడిపోయింది’ అనే పదం లేదు. అందువల్ల అనువాద సంప్రదాయం ద్వారా వచ్చిన వివరణను మూలపాఠ్యంగా చూపలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్య గౌరవాన్ని నిలుపుతూ రూపొందించబడింది. ‘అతని నాలుక కూడా’ అనే సంక్షిప్త నిర్మాణం తెలుగులో కొంత గుర్తించదగినదైనా, మూలంలోని ఉద్దేశపూర్వక ఎలిప్సిస్‌ను మరియు నిజమైన అనిశ్చితిని కాపాడుతుంది.
