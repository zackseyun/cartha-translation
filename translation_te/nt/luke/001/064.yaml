  naturalness: “వెంటనే అతని నోరు, అతని నాలుక కూడా తెరుచుకున్నాయి” is natural modern Telugu and retains the coordinated reference to both mouth and tongue. “దేవుణ్ణి స్తుతిస్తూ మాట్లాడసాగాడు” is idiomatic and suitably reverent.
  terminology: నోరు, నాలుక, దేవుణ్ణి, and స్తుతిస్తూ are appropriate. “స్తుతిస్తూ” naturally communicates εὐλογῶν in this context without imposing a denominational interpretation.
