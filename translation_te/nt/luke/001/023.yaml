  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὡς ἐπλήσθησαν αἱ ἡμέραι τῆς λειτουργίας αὐτοῦ, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/023.yaml
  text: And it happened that when the days of his service were completed[b][a], he went to his home.
translation:
  language: te
  text: అతని సేవా దినాలు పూర్తయినప్పుడు, అతడు తన ఇంటికి[a] వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘సేవ’ అంటే జెకర్యాకు నియమించబడిన యాజక ఆలయ విధి. ‘ఇంటికి’ అని అనువదించిన గ్రీకు పదం గృహభవనాన్నిగానీ, విస్తృతంగా ఇల్లు లేదా కుటుంబ నివాసాన్నిగానీ సూచించవచ్చు.
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది లూకా తరచుగా ఉపయోగించే కథన సూత్రప్రయోగం. తెలుగులో ‘జరిగిందేమిటంటే’ అని చేర్చడం ఈ చిన్న వాక్యాన్ని అనవసరంగా భారంగా చేస్తుంది; కాలవాచక ఉపవాక్యంతో సహజంగా కథనం కొనసాగుతుంది.
- source_word: ὡς
  choice: ఎప్పుడు
  rationale: ఇక్కడ ఇది కాలసంబంధ ఉపవాక్యాన్ని పరిచయం చేస్తుంది; ‘పూర్తయినప్పుడు’ అనే నిర్మాణం సహజమైన తెలుగు.
- source_word: ἐπλήσθησαν
  choice: పూర్తయినప్పుడు
  rationale: నియమించబడిన దినాలు పూర్తి సంఖ్యకు చేరిన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: λειτουργίας
  choice: సేవా
  rationale: సందర్భంలో జెకర్యా చేసిన నియమిత యాజక ఆలయసేవను సూచిస్తుంది. ప్రధాన పాఠ్యంలో సంక్షిప్తతను కాపాడుతూ, సాంస్కృతిక గమనికలో ప్రత్యేక భావాన్ని వివరిస్తుంది.
- source_word: ἀπῆλθεν
  choice: వెళ్లాడు
  rationale: గమనాన్ని తెలిపే ఈ క్రియకు సరళమైన, సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: తన ఇంటికి
  rationale: οἶκος భౌతిక గృహాన్నీ, విస్తృతంగా ఇల్లు/కుటుంబ నివాసాన్నీ సూచించగలదు. ‘తన ఇంటికి’ తెలుగులో సహజంగా గమ్యాన్ని తెలియజేస్తూ ఆ పరిధిని చాలావరకు నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు కథన సూత్రప్రయోగమైన καὶ ἐγένετοను పదేపదే అనువదించకుండా సహజ తెలుగు వాక్యనిర్మాణానికి ప్రాధాన్యం ఇచ్చాం.
