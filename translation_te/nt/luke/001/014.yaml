  text: καὶ ἔσται χαρά σοι καὶ ἀγαλλίασις, καὶ πολλοὶ ἐπὶ τῇ ⸀γενέσει αὐτοῦ χαρήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/014.yaml
  text: And there will be joy and exultation for you[a], and many will rejoice at his birth.
translation:
  language: te
  text: నీకు ఆనందం, ఉల్లాసం కలుగుతాయి; అతని పుట్టుకను బట్టి[a] చాలామంది సంతోషిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని పుట్టుక సమయంలో.” గ్రీకు పదబంధం సంతోషించే సందర్భాన్నిగానీ దానికి ఆధారమైన కారణాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται
  choice: కలుగుతాయి
  rationale: భవిష్యత్తులో ఆనందం, ఉల్లాసం అనుభవంలోకి వస్తాయని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: χαρά
  choice: ఆనందం
  rationale: χαράకు సాధారణమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: σοι
  choice: నీకు
  rationale: ఆ ఆనందం ఎవరికి కలుగుతుందో సూచించే దత్తివ విభక్తి భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἀγαλλίασις
  choice: ఉల్లాసం
  rationale: χαράతో ఉన్న పదభేదాన్ని కాపాడుతూ, మరింత ఉత్సాహభరితమైన సంతోషాన్ని సూచిస్తుంది.
- source_word: πολλοὶ
  choice: చాలామంది
  rationale: వ్యక్తులను సూచిస్తూ విశేషణం నామవాచకంగా వాడబడిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ τῇ γενέσει αὐτοῦ
  choice: అతని పుట్టుకను బట్టి
  rationale: ἐπίతో దత్తివ విభక్తి సంతోషానికి సందర్భాన్నిగానీ కారణాన్నిగానీ సూచించవచ్చు; ఈ ఎంపిక ఆ ఆధార/కారణ భావాన్ని సహజంగా ఉంచుతుంది.
- source_word: χαρήσονται
  choice: సంతోషిస్తారు
  rationale: χαίρω యొక్క భవిష్యత్ భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: ἐπὶ τῇ γενέσει αὐτοῦలో సంతోషానికి సందర్భమా, కారణమా అనే భావం
  choice: ప్రధాన పాఠ్యంలో “అతని పుట్టుకను బట్టి”
  alternative: “అతని పుట్టుక సమయంలో”
  rationale: గ్రీకు నిర్మాణం సందర్భం లేదా ఆధారం/కారణం రెండింటినీ అనుమతిస్తుంది. ప్రధాన పాఠ్యం కారణ/ఆధార భావాన్ని ఇస్తుండగా, పాదసూచిక సందర్భ భావాన్ని నిలుపుతుంది; ఏ భావాన్నీ సిద్ధాంతపరంగా బలవంతంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. χαρά, ἀγαλλίασις మధ్య భేదాన్ని “ఆనందం, ఉల్లాసం”గా నిలిపింది.
