  edition: SBLGNT
  text: καὶ πόθεν μοι τοῦτο ἵνα ἔλθῃ ἡ μήτηρ τοῦ κυρίου μου πρὸς ⸀ἐμέ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/043.yaml
  text: And why is this granted to me[a], that the mother of my Lord should come to me?
translation:
  language: te
  text: నా ప్రభువు తల్లి నా దగ్గరకు రావడం నాకు ఎలా దక్కింది[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: “ఇది నాకు ఎక్కడి నుండి వచ్చింది—నా ప్రభువు తల్లి నా దగ్గరకు రావడం?” ఇది తనకు ఇంతటి గౌరవం లభించడంపై ఆశ్చర్యాన్ని వ్యక్తం చేసే నుడికారం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόθεν
  choice: ఎలా
  rationale: పదశః ‘ఎక్కడి నుండి’ అని అర్థమైనా, ఇక్కడ ఆశ్చర్యాన్ని వ్యక్తం చేసే నుడికారంలో ‘ఎలా’ సహజమైన ఆధునిక తెలుగు సమానార్థక ప్రయోగం.
- source_word: μοι ... τοῦτο
  choice: నాకు ... దక్కింది
  rationale: ఈ అనూహ్యమైన గౌరవం తనకు లభించడంపై ఎలీసబెతు వ్యక్తం చేసిన ఆశ్చర్యాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘ఇది’ అనే సర్వనామం సూచించే విషయాన్ని తరువాతి వాక్యభాగమే వివరిస్తుంది.
- source_word: ἵνα ἔλθῃ
  choice: రావడం
  rationale: ἵνα ఇక్కడ ఆశ్చర్యానికి కారణమైన సంఘటన యొక్క విషయాన్ని పరిచయం చేస్తుంది. తెలుగు నామీకృత క్రియారూపం వాక్యాన్ని సహజంగా ఉంచుతుంది.
- source_word: ἡ μήτηρ τοῦ κυρίου μου
  choice: నా ప్రభువు తల్లి
  rationale: గ్రీకు పదబంధాన్ని సూటిగా అనువదిస్తూ κύριος యొక్క గౌరవార్థక, క్రీస్తుసంబంధమైన బలాన్ని ‘ప్రభువు’గా నిలుపుతుంది.
- source_word: πρὸς ἐμέ
  choice: నా దగ్గరకు
  rationale: ఎలీసబెతు వైపు రావడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; గ్రీకులో లేని ‘నా ఇంటికి’ అనే వివరాన్ని చేర్చదు.
theological_decisions:
- issue: ἡ μήτηρ τοῦ κυρίου μου లో κυρίου అనువాదం
  choice: నా ప్రభువు
  alternative: నా యజమాని
  rationale: ‘ప్రభువు’ అనే పదం κύριος యొక్క గౌరవార్థక మరియు క్రీస్తుసంబంధమైన భావబలాన్ని నిలుపుతుంది; ఈ వచనం చెప్పేదానికంటే మించిన తరువాతి సిద్ధాంత సూత్రీకరణను చేర్చదు.
- issue: πόθεν μοι τοῦτο అనే నుడికారాన్ని పదశః లేదా సహజంగా అనువదించడం
  choice: నాకు ఎలా దక్కింది
  alternative: ఇది నాకు ఎక్కడి నుండి
  rationale: పదశః రూపం ఆధునిక తెలుగులో అస్పష్టంగా ఉంటుంది. ఎంపిక చేసిన రూపం అనుగ్రహంగా లభించిన గౌరవంపై ఆశ్చర్యాన్ని సహజంగా వ్యక్తం చేస్తూ, పదశః రూపాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం. ‘భాగ్యం’ లేదా ‘గౌరవం’ అనే వివరణాత్మక నామవాచకాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా, గ్రీకు వాక్యంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు నిలిపింది.
