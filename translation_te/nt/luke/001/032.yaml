id: LUK.1.32
reference: Luke 1:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτος ἔσται μέγας καὶ υἱὸς Ὑψίστου κληθήσεται, καὶ δώσει αὐτῷ κύριος ὁ θεὸς τὸν θρόνον Δαυὶδ τοῦ πατρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/032.yaml
  text: He will be great and will be called the Son of the Most High[a], and the Lord God will give him the throne of David his father[c][b],
translation:
  language: te
  text: ఈయన[a] గొప్పవాడవుతాడు; సర్వోన్నతుని కుమారుడని పిలువబడతాడు[b]. ప్రభువైన దేవుడు ఆయన తండ్రియైన దావీదు సింహాసనాన్ని ఆయనకు ఇస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఈయన’ అని అనువదించిన గ్రీకు పదం నిర్దేశక సర్వనామం; అక్షరార్థంగా ‘ఈ వ్యక్తి’ అని కూడా చెప్పవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘సర్వోన్నతుని కుమారుడు అని పేరు పొందుతాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: ఈయన
  rationale: గ్రీకు నిర్దేశక సర్వనామంలోని ‘ఈ వ్యక్తి’ అనే సూచనను నిలుపుతూ, ప్రకటించబడిన శిశువును గౌరవప్రదంగా సూచించే సహజమైన తెలుగు రూపం.
- source_word: ἔσται μέγας
  choice: గొప్పవాడవుతాడు
  rationale: భవిష్యత్ భావాన్ని స్పష్టంగా తెలియజేస్తూ, μέγας లోని విస్తృతమైన ఔన్నత్యం మరియు ప్రాముఖ్యతను పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: υἱὸς Ὑψίστου
  choice: సర్వోన్నతుని కుమారుడు
  rationale: Ὕψιστος అనే దైవ బిరుదును ‘సర్వోన్నతుడు’గా, కుమారత్వ బిరుదును వ్యాఖ్యానాత్మకంగా బలహీనపరచకుండా అనువదిస్తుంది.
- source_word: κληθήσεται
  choice: అని పిలువబడతాడు
  rationale: καλέω యొక్క భవిష్యత్ కర్మణి రూపం ఇక్కడ బిరుదుతో గుర్తించబడడాన్ని సూచిస్తుంది; ఈ రూపం తెలుగులో సహజంగా ఉంటుంది.
- source_word: κύριος ὁ θεὸς
  choice: ప్రభువైన దేవుడు
  rationale: κύριος ను ‘ప్రభువు’గా నిలుపుతూ, మొత్తం పదబంధాన్ని సహజమైన తెలుగు సంబంధ రూపంలో అందిస్తుంది.
- source_word: δώσει αὐτῷ
  choice: ఈయనకు ఇస్తాడు
  rationale: δίδωμι యొక్క సరళమైన భవిష్యత్ అర్థాన్ని, దత్తివ సర్వనామ సూచనతో స్పష్టంగా అందిస్తుంది.
- source_word: τὸν θρόνον Δαυὶδ
  choice: దావీదు సింహాసనం
  rationale: దావీదీయ రాజవాగ్దాన భాషను నిలుపుతూ గ్రీకు సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు సమాసంగా అందిస్తుంది.
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: ఈయన తండ్రియైన
  rationale: πατήρ అనే మూలపదంలోని ‘తండ్రి’ భావాన్ని నిలుపుతుంది; దాని వంశపూర్విక అర్థాన్ని పాదటిప్పణి వివరిస్తుంది.
theological_decisions:
- issue: υἱὸς Ὑψίστου లోని క్రీస్తు సంబంధ బిరుదు
  choice: సర్వోన్నతుని కుమారుడు
  alternative: సర్వోన్నతుని ఒక కుమారుడు
  rationale: ఈ నిర్మాణం బిరుదుగా పనిచేస్తుంది. అనిర్దిష్ట భావాన్ని చేర్చకుండా, కుమారత్వ దావాను వచనం ఉన్నట్టుగానే నిలుపుతుంది.
- issue: κύριος అనే దైవసూచక పదం
  choice: ప్రభువైన దేవుడు
  alternative: యెహోవా దేవుడు
  rationale: గ్రీకు పాఠంలో κύριος ఉంది; దైవనామాన్ని ప్రత్యక్షంగా చేర్చడం మూలపాఠం కంటే అధిక నిర్దిష్టతను కలిగిస్తుంది.
- issue: దావీదును ‘తండ్రి’గా పేర్కొనడం
  choice: ఈయన తండ్రియైన దావీదు
  alternative: ఈయన పూర్వికుడైన దావీదు
  rationale: గ్రీకు πατήρ ను నేరుగా నిలుపుతూ దావీదీయ వంశం, రాజవాగ్దానం మధ్యనున్న భావసంబంధాన్ని చెరపదు; వంశపూర్విక అర్థం పాదటిప్పణిలో స్పష్టమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ‘ఈయన’ రూపాన్ని ఉపయోగించాం. వాక్యం సాధారణ పాఠకులకు సహజంగా ఉండేలా రెండు భాగాలుగా విభజించబడింది; అయితే గ్రీకు వాక్యంలోని భవిష్యత్ ప్రకటనలు, దైవ బిరుదు, దావీదీయ రాజసింహాసన భావం యథాతథంగా నిలుపబడ్డాయి.
