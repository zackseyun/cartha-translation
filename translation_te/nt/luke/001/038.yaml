id: LUK.1.38
reference: Luke 1:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ Μαριάμ· Ἰδοὺ ἡ δούλη κυρίου· γένοιτό μοι κατὰ τὸ ῥῆμά σου. καὶ ἀπῆλθεν ἀπ’ αὐτῆς ὁ ἄγγελος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/038.yaml
  text: And Mary said[a], “Behold, I am the Lord’s servant[b]. May it happen to me according to your word.” And the angel departed from her.
translation:
  language: te
  text: 'మరియ ఇలా అంది: “ఇదిగో, నేను ప్రభువు దాసురాలిని.[a] నీ మాట ప్రకారం నాకు జరుగుగాక.[b]” ఆ దూత ఆమె దగ్గర నుంచి వెళ్లిపోయాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువు బానిసను.” δούλη అనే గ్రీకు పదం బానిస స్త్రీని లేదా సేవకురాలిని సూచించవచ్చు; ఇక్కడ దేవునికి వినయంగా లోబడే భావం ప్రధానంగా ఉంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, “నీ మాట ప్రకారం నాకు అట్లే జరుగుగాక.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ఇలా అంది
  rationale: δὲ ఒక స్వల్ప అనుసంధాన పదం. తెలుగులో ప్రత్యేక కాలసూచనను చేర్చకుండా సహజమైన కథన ప్రవాహం కోసం వాక్య నిర్మాణంలోనే దాని అనుసంధాన భావాన్ని వ్యక్తం చేశాం.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: మరియ తనను తాను గంభీరంగా సమర్పించుకునే భావాన్ని నిలుపుతూ, ఆధునిక తెలుగులో అర్థమయ్యే సాంప్రదాయ పదాన్ని వాడాం.
- source_word: δούλη
  choice: దాసురాలు
  rationale: స్త్రీలింగంలోని ఈ గ్రీకు పదం బానిసను లేదా సేవకురాలిని సూచించగలదు. ‘దాసురాలు’ వినయపూర్వక సమర్పణతో పాటు అధీనత అనే బలమైన భావాన్ని కూడా కొంతవరకు నిలుపుతుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: దేవునికి ఉపయోగించిన బిరుదును తెలుగులో సహజంగా ‘ప్రభువు’ అని అనువదించాం; ‘ప్రభువు దాసురాలు’ అనే సంబంధ నిర్మాణం స్పష్టంగా ఉంది.
- source_word: γένοιτό μοι
  choice: నాకు జరుగుగాక
  rationale: ఆరిస్ట్ మధ్యమ optative రూపం సమ్మతితో కూడిన కోరికను తెలియజేస్తుంది. ‘జరుగుగాక’ ఆ భావాన్ని సంక్షిప్తంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: నీ మాట ప్రకారం
  rationale: దూత పలికిన నిర్దిష్ట ప్రకటనకు అనుగుణంగా జరగాలనే భావాన్ని సహజమైన తెలుగులో నిలిపాం.
- source_word: ἀπῆλθεν ἀπ’ αὐτῆς
  choice: ఆమె దగ్గర నుంచి వెళ్లిపోయాడు
  rationale: దూత ఆమె సమక్షం నుంచి వెళ్లిపోయాడనే కథన ముగింపును స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁ ἄγγελος
  choice: ఆ దూత
  rationale: లూకా బాల్యవృత్తాంత సందర్భంలో ఇది మానవ సందేశకుడు కాక దేవదూతను సూచిస్తుంది; ముందు ప్రస్తావించబడిన వ్యక్తి కాబట్టి ‘ఆ దూత’ సహజంగా ఉంది.
theological_decisions:
- issue: మరియ తనను δούλη అని పేర్కొనడం
  choice: ప్రభువు దాసురాలు
  alternative: ప్రభువు బానిస
  rationale: మూలపదంలో బానిసత్వం లేదా సేవకత్వం రెండింటి పరిధి ఉంది. ఇక్కడ దేవుని చిత్తానికి మరియ వినయంగా లోబడటం ప్రధానంగా ఉన్నప్పటికీ, మూలంలోని బలమైన అధీనత భావాన్ని పూర్తిగా తొలగించకుండా ‘దాసురాలు’ ఎంచుకుని, మరింత ప్రత్యక్షమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: γένοιτό μοι యొక్క భావబలం
  choice: నాకు జరుగుగాక
  alternative: నాకు జరగాలి
  rationale: ఇది కేవలం భవిష్యత్తు ప్రకటన కాదు; సమ్మతితో కూడిన కోరిక. ప్రధాన పాఠంలోని optative ధోరణిని ‘జరుగుగాక’ నిలుపుతుంది; సహజమైన ప్రత్యామ్నాయ వ్యక్తీకరణను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలిని పాటిస్తూ, మరియ మాటలకు తగిన గంభీరత కోసం ‘ఇదిగో’, ‘జరుగుగాక’ వంటి సులభంగా అర్థమయ్యే ఉన్నత పదప్రయోగాలను నిలిపాం. ప్రతి పాదసూచిక గుర్తును సంబంధిత పదబంధం వెంట ఉంచాం.
