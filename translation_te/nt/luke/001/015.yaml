id: LUK.1.15
reference: Luke 1:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔσται γὰρ μέγας ἐνώπιον ⸀τοῦ κυρίου, καὶ οἶνον καὶ σίκερα οὐ μὴ πίῃ, καὶ πνεύματος ἁγίου πλησθήσεται ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/015.yaml
  text: For he will be great before the Lord[a], and he will drink neither wine nor strong drink[c][b], and he will be filled with the Holy Spirit even from his mother’s womb.
translation:
  language: te
  text: ఎందుకంటే అతడు ప్రభువు దృష్టిలో గొప్పవాడవుతాడు. ద్రాక్షారసంగానీ మత్తుపానీయంగానీ అతడు ఎన్నటికీ తాగడు[a]. తన తల్లి గర్భంలో ఉన్నప్పటి నుంచే[b] అతడు పరిశుద్ధాత్మతో నింపబడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకులో ఇది చాలా బలమైన నిరాకరణ: “ద్రాక్షారసంగానీ మత్తుపానీయంగానీ అతడు ఎంతమాత్రమూ తాగడు.” సందర్భం అతని దేవునికి ప్రతిష్ఠితమైన పిలుపును సూచిస్తుంది. “మత్తుపానీయం” అంటే ద్రాక్షారసం కాకుండా మత్తు కలిగించే ఇతర పానీయం.'
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: లేదా “తన తల్లి గర్భం నుంచే”; “తన తల్లి గర్భంలో ఉండగానే” అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέγας
  choice: గొప్పవాడు
  rationale: వ్యక్తి యొక్క ఉన్నత స్థానం, ప్రాముఖ్యత రెండింటినీ అతిగా వివరించకుండా సహజంగా తెలియజేస్తుంది.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: ప్రభువు దృష్టిలో
  rationale: దేవుని ఎదుట ఉన్న స్థితి లేదా ఆయన అంచనాలోని గొప్పతనం అనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: οἶνον καὶ σίκερα
  choice: ద్రాక్షారసంగానీ మత్తుపానీయంగానీ
  rationale: οἶνοςను ద్రాక్షతో చేసిన పానీయంగా గుర్తిస్తూ, σίκεραను ద్రాక్షారసం కాని ఇతర మత్తు కలిగించే పానీయాలకు వర్తించే విస్తృత పదంతో అనువదిస్తుంది.
- source_word: οὐ μὴ πίῃ
  choice: ఎన్నటికీ తాగడు
  rationale: οὐ μήతో కూడిన బలమైన భవిష్యత్ నిరాకరణను నేరుగా కాపాడుతుంది; దానిని కేవలం ఆజ్ఞగా మార్చదు.
- source_word: πνεύματος ἁγίου πλησθήσεται
  choice: పరిశుద్ధాత్మతో నింపబడతాడు
  rationale: దైవిక కర్తృత్వాన్ని సూచించే భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ, లూకా సందర్భంలోని పరిశుద్ధాత్మను వ్యక్తిగత దైవిక సూచనగా అందిస్తుంది.
- source_word: ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: తన తల్లి గర్భంలో ఉన్నప్పటి నుంచే
  rationale: అసాధారణంగా ప్రారంభమైన కాలాన్ని నొక్కిచెప్పే ἔτι, ἐκ పదాల భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: οὐ μὴ πίῃ అనే బలమైన నిరాకరణ ప్రవచనమా లేక విధించిన నిషేధమా
  choice: బలమైన భవిష్యత్ నిరాకరణగా ‘ఎన్నటికీ తాగడు’
  alternative: విధి లేదా నిషేధ భావంతో ‘ఎన్నటికీ తాగకూడదు’
  rationale: గ్రీకు నిర్మాణం చర్య జరగదని బలంగా ప్రకటిస్తుంది. సందర్భంలో ప్రతిష్ఠిత పిలుపు అంతర్లీనంగా ఉన్నా, దానిని వ్యాకరణానికి మించి ప్రత్యక్ష ఆజ్ఞగా మార్చకుండా అసలు ఉద్వేగాన్ని కాపాడాం.
- issue: πνεύματος ἁγίου యొక్క సూచన
  choice: వ్యక్తిగత దైవిక సూచనగా ‘పరిశుద్ధాత్మ’
  alternative: వ్యక్తిత్వరహిత పవిత్ర శక్తి లేదా స్వభావం
  rationale: లూకా రచనలోని సమీప సందర్భం దేవుని ఆత్మనే సూచిస్తుంది; అందువల్ల సంప్రదాయబద్ధమైనప్పటికీ సందర్భాధారితమైన పదాన్ని వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి. ‘ప్రభువు దృష్టిలో’ సహజ తెలుగు ప్రయోగం; పానీయాల జతలో ‘గానీ…గానీ’ వాడి రెండింటి నిరాకరణను స్పష్టం చేశాం. ప్రధాన పాఠంలో ఉన్న ప్రతి పాదసూచిక గుర్తుకు అనుగుణమైన గమనిక ఇచ్చాం.
