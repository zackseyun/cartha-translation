  text: the oath that he swore to Abraham our father[a], to grant to us
translation:
  language: te
  text: మన తండ్రియైన అబ్రాహాముకు ఆయన చేసిన ప్రమాణాన్ని, మనకు అనుగ్రహించుటకై—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మన పూర్వికుడు.” గ్రీకులో అక్షరార్థంగా “మన తండ్రి” అని ఉంది; ఇది అబ్రాహామును గురించిన నిబంధనా భాషను నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅρκον
  choice: ప్రమాణాన్ని
  rationale: మునుపటి వాక్య నిర్మాణం నుంచి కొనసాగుతున్న కర్మ; దేవుడు చేసిన నిర్దిష్ట ప్రమాణాన్ని సూచిస్తుంది.
- source_word: ὃν ὤμοσεν
  choice: ఆయన చేసిన
  rationale: తెలుగులో ‘ప్రమాణం చేశాడు’ అనే సహజ నుడికారంతో గ్రీకు సంబంధవాచక నిర్మాణ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: πρὸς Ἀβραὰμ
  choice: అబ్రాహాముతో
  rationale: ప్రమాణం చేయడం అనే క్రియతో తెలుగులో ‘అబ్రాహాముతో చేసిన ప్రమాణం’ సహజంగా ఉంటుంది; అది ఎవరికి ఉద్దేశించబడిందో స్పష్టపరుస్తుంది.
- source_word: τὸν πατέρα ἡμῶν
  choice: మన తండ్రి
  rationale: అబ్రాహామును గూర్చిన కుటుంబసంబంధమైన, నిబంధనాత్మకమైన మూలభాషా నుడికారాన్ని యథాతథంగా కాపాడుతుంది.
- source_word: τοῦ δοῦναι ἡμῖν
  choice: మనకు అనుగ్రహించడానికి
  rationale: ఈ ఆర్టిక్యులర్ ఇన్ఫినిటివ్ ఉద్దేశం లేదా ఫలితాన్ని సూచించగలదు. ‘అనుగ్రహించడానికి’ గీతంలోని గంభీర శైలికి సరిపోతూ తదుపరి వచనంలో పూర్తయ్యే భావాన్ని తెరిచి ఉంచుతుంది.
theological_decisions:
- issue: అబ్రాహాముకు సంబంధించిన నిబంధనా భాష
  choice: మన తండ్రి
  alternative: మన పూర్వికుడు
  rationale: ‘మన తండ్రి’ అనే పదబంధం గ్రీకు మూలంలోని కుటుంబసంబంధమైన నిబంధనా భాషను నిలుపుతుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: τοῦ δοῦναι యొక్క భావసంబంధం
  choice: అనుగ్రహించడానికి
  alternative: అనుగ్రహించినందున / అనుగ్రహిస్తూ
  rationale: ఉద్దేశం లేదా ఫలితం మధ్య గ్రీకులో ఉన్న కొంత భావ విస్తృతిని నిలుపుతూ, తరువాతి వచనంతో వాక్య కొనసాగింపును సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; జెకర్యా స్తోత్రగీతానికి తగిన గంభీరతను ఉంచి, సాధారణ పాఠకులకు సహజంగా ఉండే పదక్రమం వాడబడింది. వాక్యం తదుపరి వచనంలో కొనసాగుతుందని దీర్ఘ విరామచిహ్నం సూచిస్తుంది.
