id: LUK.1.44
reference: Luke 1:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ ὡς ἐγένετο ἡ φωνὴ τοῦ ἀσπασμοῦ σου εἰς τὰ ὦτά μου, ἐσκίρτησεν ⸂ἐν ἀγαλλιάσει τὸ βρέφος⸃ ἐν τῇ κοιλίᾳ μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/044.yaml
  text: For behold[a], when the sound of your greeting came into my ears, the baby leaped for joy in my womb.
translation:
  language: te
  text: ఎందుకంటే, ఇదిగో, నీ అభివాదపు ధ్వని నా చెవులకు చేరగానే, నా గర్భంలోని శిశువు ఆనందంతో గంతులు వేసింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా గర్భంలోని శిశువు ఉల్లాసంతో గంతులు వేసింది.”
    reason: ἐν ἀγαλλιάσει అనే పదబంధం సూచించే ఆనందభరితమైన ఉల్లాసం లేదా హర్షాతిరేకాన్ని మరింత స్పష్టంగా చూపే పదప్రయోగ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని సజీవంగా ఆకర్షించే సంభాషణ సూచకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి మాటకు ఈ వాక్యం ఇచ్చే వివరణాత్మక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὡς ἐγένετο ... εἰς τὰ ὦτά μου
  choice: నా చెవులకు చేరగానే
  rationale: ధ్వని చెవులకు చేరిన సమయానికే సంఘటన జరిగిందనే భావాన్ని సహజంగా, దిశాసూచక బింబాన్ని కాపాడుతూ వ్యక్తపరుస్తుంది.
- source_word: ἡ φωνὴ τοῦ ἀσπασμοῦ σου
  choice: నీ అభివాద ధ్వని
  rationale: φωνή యొక్క శ్రవణాంశాన్నీ, ἀσπασμός యొక్క సహజ అర్థమైన అభివాదాన్నీ సంక్షిప్తంగా కాపాడుతుంది.
- source_word: ἐσκίρτησεν
  choice: గంతువేసింది
  rationale: గర్భంలోని శిశువు చేసిన అకస్మాత్తైన ఉల్లాసభరిత కదలికను స్పష్టంగా తెలుపుతుంది.
- source_word: ἐν ἀγαλλιάσει
  choice: ఆనందంతో
  rationale: క్రియ జరిగిన ఉల్లాసభరిత విధానాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది; మరింత బలమైన ‘పరవశంతో’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: τὸ βρέφος
  choice: శిశువు
  rationale: గర్భంలో ఉన్న యోహానును సూచించే βρέφοςకు ఖచ్చితమైన, గౌరవప్రదమైన, సహజ తెలుగు సమానార్థకం.
- source_word: ἐν τῇ κοιλίᾳ μου
  choice: నా గర్భంలోని
  rationale: సందర్భంలో κοιλία సూచించే గర్భాన్ని నిర్దిష్టంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: గర్భంలోని యోహానుకు βρέφος పదప్రయోగం
  choice: శిశువు
  alternative: బిడ్డ
  rationale: మూలపాఠం గర్భస్థ యోహానును శిశువుగా వర్ణిస్తుంది. ‘శిశువు’ ఆ పదార్థాన్ని నిలుపుతూ, పాఠానికి మించిన సిద్ధాంతపరమైన నిర్ధారణను చేర్చదు.
- issue: ἐν ἀγαλλιάσει యొక్క భావబలం
  choice: ఆనందంతో
  alternative: పరవశంతో
  rationale: ప్రధాన పాఠంలో సహజమైన తెలుగు వాడుతూ, ‘ఉల్లాసం/పరవశం’ అనే బలమైన భావఛాయను పాదటిప్పణిలో సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘ఇదిగో’ మూలంలోని దృష్టి-ఆకర్షణను నిలుపుతుంది; ‘అభివాద ధ్వని’ శ్రవణ బింబాన్ని కాపాడుతుంది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠంలో పొందుపరచబడింది.
