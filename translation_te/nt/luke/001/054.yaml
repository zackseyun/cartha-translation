  text: He has helped Israel his servant[a], in remembrance of mercy[b],
translation:
  language: te
  text: ఆయన తన సేవకుడైన ఇశ్రాయేలును[a] ఆదుకున్నాడు, కరుణను[b] జ్ఞాపకం చేసుకొని,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన బిడ్డయైన ఇశ్రాయేలును.’ గ్రీకు παῖς (పైస్) అనే పదానికి ‘సేవకుడు’ లేదా ‘బిడ్డ’ అనే అర్థం రావచ్చు. పాత నిబంధనలో ఇశ్రాయేలును దేవుని సేవకునిగా పిలిచే వాడుక కారణంగా ఇక్కడ ‘సేవకుడు’ను ఎంచుకున్నాం.
    reason: lexical_alternative
  - marker: b
    text: ‘కరుణ’ అనే మాటకు ఇక్కడ నిబంధనలో చూపే కరుణ లేదా కనికరంతో కూడిన విశ్వసనీయత అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντελάβετο
  choice: ఆదుకున్నాడు
  rationale: ఈ క్రియ సహాయం చేయడానికి ఒకరిని చేపట్టడం, వారికి అండగా నిలవడం అనే భావాన్ని ఇస్తుంది. ‘ఆదుకున్నాడు’ అనేది దేవుని రక్షణాత్మక సహాయాన్ని సహజమైన తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: Ἰσραὴλ
  choice: ఇశ్రాయేలు
  rationale: ప్రామాణిక తెలుగు లిప్యంతరీకరణను వాడాం; సందర్భంలో ఇది యాకోబు అనే వ్యక్తికంటే ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది.
- source_word: παιδὸς
  choice: సేవకుడైన
  rationale: παῖς అనే పదానికి ‘సేవకుడు’ లేదా ‘బిడ్డ’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ లేఖనాల్లో ఇశ్రాయేలును దేవుని సేవకునిగా పిలిచే నేపథ్యానికి ‘సేవకుడు’ బాగా సరిపోతుంది; నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: αὐτοῦ
  choice: తన
  rationale: ఇశ్రాయేలు దేవునికి చెందిన సేవకుడు అనే స్వామ్య సంబంధాన్ని సహజమైన తెలుగు ప్రతిబింబక సర్వనామంతో తెలియజేస్తుంది.
- source_word: μνησθῆναι
  choice: జ్ఞాపకం చేసుకొని
  rationale: ఈ అనిశ్చిత క్రియారూపం దేవుడు ఇశ్రాయేలును ఆదుకోవడానికీ కరుణను జ్ఞాపకం చేసుకోవడానికీ ఉన్న సంబంధాన్ని తెలియజేస్తుంది. ‘జ్ఞాపకం చేసుకొని’ అనేది దానిని సహజంగా ఉంచుతూ కఠినమైన ఉద్దేశార్థాన్ని బలవంతంగా విధించదు.
- source_word: ἐλέους
  choice: కరుణను
  rationale: ἔλεος యొక్క నేరమైన, విస్తృతమైన తెలుగు సమానార్థం ‘కరుణ’; నిబంధన విశ్వసనీయత అనే సాధ్యమైన అంతర్భావాన్ని ప్రధాన వచనంలో విస్తరించకుండా పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: ఇశ్రాయేలును సూచించే παῖς పదార్థం
  choice: తన సేవకుడైన ఇశ్రాయేలు
  alternative: తన బిడ్డయైన ఇశ్రాయేలు
  rationale: ఇశ్రాయేలును ప్రభువు సేవకునిగా పేర్కొనే పాత నిబంధన, ముఖ్యంగా యెషయా గ్రంథ భాషతో ‘సేవకుడు’ సరిపోతుంది. అయితే ‘బిడ్డ’ కూడా పదకోశపరంగా సాధ్యమే కనుక దాన్ని పాదసూచికలో నిలిపాం.
- issue: μνησθῆναι ἐλέους యొక్క సంబంధం మరియు భావం
  choice: కరుణను జ్ఞాపకం చేసుకొని
  alternative: కరుణను జ్ఞాపకం చేసుకోవడానికి; కరుణను జ్ఞాపకం చేసుకుంటూ
  rationale: ఈ పదబంధం దేవుని కరుణ కార్యరూపంలో వ్యక్తమయ్యే ఆయన జ్ఞాపకాన్ని సూచిస్తుంది. తెలుగు అనువాదం ఉద్దేశం, ఫలితం, లేదా అనుబంధ చర్య అనే వ్యాకరణ సంబంధాన్ని అతిగా నిర్ధారించకుండా ఉంచుతుంది.
- issue: ἔλεοςలోని నిబంధన నేపథ్యం
  choice: కరుణ
  alternative: నిబంధన కరుణ; విశ్వసనీయమైన కనికరం
  rationale: సందర్భంలో నిబంధనాపరమైన అంతర్భావం ఉండవచ్చు, కానీ గ్రీకు పదం స్వయంగా ‘నిబంధన’ అనే పదాన్ని చెప్పదు. అందువల్ల ప్రధాన వచనంలో ‘కరుణ’ను ఉంచి, సాధ్యమైన విస్తృత భావాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కీర్తనాశైలిని అనుసరించాం. ‘ఆదుకున్నాడు’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతూ మూలంలోని సహాయం/అండ భావాన్ని నిలుపుతుంది. వాక్యం తరువాతి వచనంతో వ్యాకరణపరంగా కొనసాగుతున్నందున చివర కామాను ఉంచాం.
