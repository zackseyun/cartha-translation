id: LUK.1.35
reference: Luke 1:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ· Πνεῦμα ἅγιον ἐπελεύσεται ἐπὶ σέ, καὶ δύναμις Ὑψίστου ἐπισκιάσει σοι· διὸ καὶ τὸ γεννώμενον ἅγιον κληθήσεται, υἱὸς θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/035.yaml
  text: And the angel answered and said to her[a], “The Holy Spirit will come upon you, and the power of the Most High will overshadow you[b]; therefore also the holy one being born will be called the Son of God.”
translation:
  language: te
  text: 'అందుకు దేవదూత ఆమెతో ఇలా అన్నాడు: “పరిశుద్ధాత్మ నీ మీదికి వస్తుంది; సర్వోన్నతుని శక్తి నీపై నీడవలె కమ్ముకొంటుంది. అందువల్ల పుట్టబోయే పవిత్రమైన శిశువు[a] దేవుని కుమారుడు[b] అని పిలువబడతాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో అక్షరార్థంగా “పుడుతున్నది” లేదా “పుట్టేది.” సందర్భాన్ని బట్టి ఇక్కడ “పుట్టబోయే శిశువు” అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: మూల గ్రీకులో “కుమారుడు” ముందు నిర్దిష్ట ఉపపదం లేదు. అయినా ఈ సందర్భంలో “దేవుని కుమారుడు” అనేది అనిశ్చిత భావం కాకుండా ఒక బిరుదుగా పనిచేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ
  choice: అందుకు దేవదూత ఆమెతో ఇలా అన్నాడు
  rationale: ἀποκριθείς యొక్క ప్రతిస్పందన భావాన్ని ‘అందుకు’ సహజంగా తెలియజేస్తుంది; ἄγγελος ఇక్కడ పరలోక దూతను సూచించేందున ‘దేవదూత’ సరైనది.
- source_word: Πνεῦμα ἅγιον
  choice: పరిశుద్ధాత్మ
  rationale: లూకా సందర్భంలో ఇది దేవుని ఆత్మను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘పరిశుద్ధాత్మ’ సహజమైన, గౌరవప్రదమైన రూపం.
- source_word: ἐπελεύσεται ἐπὶ σέ
  choice: నీ మీదికి వస్తాడు
  rationale: ἐπίతో కూడిన క్రియలోని ‘మీదికి రావడం’ అనే సక్రియ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: δύναμις Ὑψίστου
  choice: సర్వోన్నతుని శక్తి
  rationale: Ὑψίστουను దేవునికి సంబంధించిన బిరుదుగా ఉంచుతూ గ్రీకు షష్ఠీ సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπισκιάσει σοι
  choice: నిన్ను తన నీడతో కమ్ముతుంది
  rationale: నీడ కమ్మడం అనే మూల రూపకాన్ని నిలుపుతూ దైవిక సన్నిధి, కార్యం గురించిన వాక్య నియంత్రణను కాపాడుతుంది; మూలంలో లేని శారీరక వివరణను చేర్చదు.
- source_word: διὸ καὶ
  choice: అందువల్ల
  rationale: ముందున్న దైవిక కార్యానికి తరువాతి మాటను ఫలితంగా అనుసంధానిస్తుంది. καί యొక్క స్వల్ప అదనపు బలం తెలుగులో సందర్భానుసారంగా అంతర్లీనంగా ఉంటుంది.
- source_word: τὸ γεννώμενον ἅγιον
  choice: పుట్టబోయే పవిత్రమైన శిశువు
  rationale: గ్రీకు పదబంధం అక్షరార్థంగా ‘పుడుతున్నది/పుట్టేది, పవిత్రమైనది’; సందర్భంలోని శిశు సూచనను తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తూ అక్షర రూపాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: κληθήσεται
  choice: అని పిలువబడతాడు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ పేరు మరియు గుర్తింపుకు రెండింటికీ అవకాశం ఇస్తుంది.
- source_word: υἱὸς θεοῦ
  choice: దేవుని కుమారుడు
  rationale: వ్యాసం లేని గ్రీకు రూపం ఈ సందర్భంలో అనిశ్చితార్థకం కాదు; తెలుగులో ఈ పదబంధమే బిరుదు భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: Πνεῦμα ἅγιον యొక్క దైవిక వ్యక్తిగత సూచన
  choice: పరిశుద్ధాత్మ
  alternative: పవిత్ర ఆత్మ / పరిశుద్ధమైన ఆత్మ
  rationale: సందర్భంలో దేవుని ఆత్మ యేసు గర్భధారణలో కార్యనిర్వాహకుడిగా కనిపిస్తాడు. ‘పరిశుద్ధాత్మ’ మూల భావాన్ని వ్యక్తిత్వరహిత శక్తిగా తగ్గించదు.
- issue: ἐπισκιάσει లోని దైవిక కార్య రూపకం
  choice: నిన్ను తన నీడతో కమ్ముతుంది
  alternative: నిన్ను ఆవరించుతుంది
  rationale: మూలంలోని నీడ రూపకాన్ని కాపాడి, గ్రీకు వాక్యం చెప్పని జీవశాస్త్రీయ లేదా లైంగిక ప్రక్రియను అనువాదం చేర్చకుండా ఉంటుంది.
- issue: υἱὸς θεοῦ యొక్క బిరుదు భావం
  choice: దేవుని కుమారుడు
  alternative: దేవుని ఒక కుమారుడు
  rationale: వ్యాసం లేకపోవడం అనిశ్చితార్థాన్ని తప్పనిసరి చేయదు. ప్రకటన సందర్భంలో ఇది క్రీస్తు సంబంధ బిరుదుగా పనిచేస్తుంది; ‘ఒక’ అని చేర్చడం మూలం సమర్థించని భావాన్ని కలిగిస్తుంది.
- issue: τὸ γεννώμενον ἅγιον యొక్క వ్యాకరణ సంబంధం
  choice: పుట్టబోయే పవిత్రమైన శిశువు
  alternative: పుట్టేది పవిత్రమైనదని పిలువబడుతుంది
  rationale: ἅγιονను పుట్టబోయే వానిని విశేషించే పదంగా తీసుకోవడం సహజం; అయితే గ్రీకు నిర్మాణంలోని సంక్షిప్తతను పాదటిప్పణి ద్వారా పాఠకునికి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా వాక్య గౌరవాన్ని మరియు దైవిక నీడ రూపకాన్ని నిలుపుతూ రూపొందించబడింది. పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో రెండూ చేర్చబడ్డాయి.
