revisions:
- from: 'అందుకు దేవదూత ఆమెతో ఇలా అన్నాడు: “పరిశుద్ధాత్మ నీ మీదికి వస్తాడు; సర్వోన్నతుని శక్తి నిన్ను తన నీడతో కమ్ముతుంది. అందువల్ల పుట్టబోయే పవిత్రమైన శిశువు[a] దేవుని కుమారుడు[b] అని పిలువబడతాడు.”'
  to: 'అందుకు దేవదూత ఆమెతో ఇలా అన్నాడు: “పరిశుద్ధాత్మ నీ మీదికి వస్తుంది; సర్వోన్నతుని శక్తి నీపై నీడవలె కమ్ముకొంటుంది. అందువల్ల పుట్టబోయే పవిత్రమైన శిశువు[a] దేవుని కుమారుడు[b] అని పిలువబడతాడు.”'
  rationale: The revision retains the draft’s faithful structure and terminology while rendering ἐπισκιάσει more directly as “నీపై నీడవలె కమ్ముకొంటుంది,” without adding “తన.” It also adopts the grammatically natural Telugu verb form “వస్తుంది” with పరిశుద్ధాత్మ. Footnote anchors and their lexical functions are retained.
  reviewer_model: gpt-5.6-terra
