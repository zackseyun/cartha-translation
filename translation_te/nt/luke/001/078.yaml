id: LUK.1.78
reference: Luke 1:78
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ σπλάγχνα ἐλέους θεοῦ ἡμῶν, ἐν οἷς ⸀ἐπισκέψεται ἡμᾶς ἀνατολὴ ἐξ ὕψους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/078.yaml
  text: because of the tender mercy of our God[a], by which the sunrise from on high will visit us,
translation:
  language: te
  text: మన దేవుని హృదయపూర్వక కనికరాన్ని బట్టి, ఆ కనికరంలోనే పైనుండి ఉదయించే వెలుగు మనలను సందర్శిస్తుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఉషోదయం.” గ్రీకు పాత నిబంధనలో ἀνατολή అనే పదం మెస్సీయకు సంబంధించిన “చిగురు” అనే బిరుదును కూడా ప్రతిధ్వనింపజేయవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ
  choice: బట్టి
  rationale: Accusative construction here marks cause or basis; ‘బట్టి’ naturally preserves that causal force in Telugu.
- source_word: σπλάγχνα ἐλέους
  choice: హృదయపూర్వక కనికరం
  rationale: The literal inward-parts idiom denotes deep, tender compassion. This Telugu expression conveys inward depth without an unnatural anatomical rendering.
- source_word: θεοῦ ἡμῶν
  choice: మన దేవుని
  rationale: Natural Telugu possessive construction corresponding directly to ‘of our God.’
- source_word: ἐν οἷς
  choice: దాన్ని బట్టి (incorporated into the causal phrase)
  rationale: The relative phrase refers back to God’s deep mercy as the basis or sphere of the visitation. Telugu expresses the connection naturally by integrating it with ‘బట్టి,’ avoiding a cumbersome repeated relative construction.
- source_word: ἐπισκέψεται
  choice: దర్శిస్తుంది
  rationale: The future verb denotes visiting or attending to someone, often with gracious intervention. ‘దర్శిస్తుంది’ retains the visitation sense, though the context supplies its saving significance.
- source_word: ἀνατολὴ
  choice: ఉదయించే వెలుగు
  rationale: In the immediate light imagery, the word primarily evokes dawn or sunrise. ‘ఉదయించే వెలుగు’ is natural Telugu and leaves room for the personal, messianic referent.
- source_word: ἐξ ὕψους
  choice: పైనుండి
  rationale: Closely and naturally represents ‘from on high’ without explicitly expanding it to ‘from heaven.’
theological_decisions:
- issue: Messianic meaning of ἀνατολή
  choice: ఉదయించే వెలుగు
  alternative: ఉషోదయం; చిగురు
  rationale: Luke 1:79 makes the dawn/light image primary, while the Greek word may also echo the Septuagint’s messianic title ‘Branch.’ The main text retains the immediate metaphor, and the footnote preserves the possible prophetic resonance.
translation_notes:
  register: Modern standard Telugu in a dignified but accessible register. The idiomatic rendering avoids anatomical literalism in σπλάγχνα while preserving emotional depth; the footnote retains the genuine lexical and messianic ambiguity of ἀνατολή.
