source:
  edition: SBLGNT
  text: καθὼς ἐλάλησεν πρὸς τοὺς πατέρας ἡμῶν, τῷ Ἀβραὰμ καὶ τῷ σπέρματι αὐτοῦ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/055.yaml
  text: just as he spoke to our fathers[b][a], to Abraham and to his offspring forever.
translation:
  language: te
  text: మన పితరులకు[a], అబ్రాహాముకూ ఆయన సంతానానికీ[b] యుగయుగాల వరకు పలికినట్లే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మన పూర్వికులకు.’ గ్రీకులో అక్షరార్థంగా ‘మన పితరులకు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆయన విత్తనానికి.’ గ్రీకులో ‘విత్తనం,’ ‘సంతానం,’ లేదా ‘సంతతి’ అని అర్థమివ్వగల ఏకవచన సమూహవాచక పదం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: పలికినట్లే
  rationale: ముందరి వాక్యంలో చెప్పిన కార్యం దేవుడు పూర్వం పలికిన మాటకు అనుగుణంగా ఉందనే పోలికను ‘అట్లే’ సహజంగా తెలియజేస్తుంది.
- source_word: ἐλάλησεν
  choice: పలికిన
  rationale: దైవిక వాక్కుకు తగిన గౌరవప్రదమైన ఆధునిక తెలుగు రూపం; πρὸς తో ఉన్న సంభాషణ భావాన్ని నిలుపుతుంది.
- source_word: πρὸς τοὺς πατέρας ἡμῶν
  choice: మన పితరులతో
  rationale: గ్రీకు పదబంధంలోని పురుషలింగ, నిబంధన-చరిత్ర సంబంధిత ‘పితరులు’ అనే రూపాన్ని నిలుపుతూ, తెలుగులో ‘పలుకు’తో సహజమైన విభక్తిని వాడింది.
- source_word: τῷ Ἀβραὰμ
  choice: అబ్రాహాముతో
  rationale: ముందున్న ‘పలికిన’ క్రియకు అన్వయిస్తూ వ్యక్తినామాన్ని ప్రామాణిక తెలుగు బైబిలు రూపంలో ఇచ్చింది.
- source_word: τῷ σπέρματι αὐτοῦ
  choice: అతని సంతానంతో
  rationale: σπέρμα యొక్క ఏకవచన సమూహార్థాన్ని సహజమైన తెలుగు ‘సంతానం’ నిలుపుతుంది; ‘విత్తనం’ అనే అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: εἰς τὸν αἰῶνα
  choice: శాశ్వతంగా
  rationale: అంతం లేని కాలాన్ని సూచించే గ్రీకు నుడికారానికి సహజమైన, గౌరవప్రదమైన తెలుగు రూపం.
theological_decisions:
- issue: πατέρας ἡμῶν లోని పురుషలింగ నిబంధనాత్మక భాష
  choice: మన పితరులతో
  alternative: మన పూర్వికులతో
  rationale: మూలంలోని స్పష్టమైన పురుషలింగ పదాన్ని, ఇశ్రాయేలు పితరులతో ముడిపడిన నిబంధనాత్మక ప్రతిధ్వనిని నిలుపుతుంది; సహజమైన లింగ-తటస్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపింది.
- issue: అబ్రాహాము నిబంధన సందర్భంలో σπέρματι αὐτοῦ
  choice: అతని సంతానంతో
  alternative: అతని విత్తనంతో; అతని సంతతివారితో
  rationale: ‘సంతానం’ ఏకవచన సమూహార్థాన్ని మరియు నిబంధన వాగ్దానంలోని భావసంభావ్యతను నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది; ‘విత్తనం’ అనే అక్షరార్థాన్ని పాదసూచికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడింది. ఈ వచనం ముందరి వాక్యానికి కొనసాగింపు కావడంతో మూలంలోని ఉపవాక్య నిర్మాణాన్ని అలాగే ఉంచింది. ‘పితరులు,’ ‘సంతానం’ ద్వారా నిబంధనాత్మక పదసంబంధాలను కాపాడింది.
