id: LUK.1.33
reference: Luke 1:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ βασιλεύσει ἐπὶ τὸν οἶκον Ἰακὼβ εἰς τοὺς αἰῶνας, καὶ τῆς βασιλείας αὐτοῦ οὐκ ἔσται τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/033.yaml
  text: And he will reign over the house of Jacob forever[a], and of his kingdom there will be no end.
translation:
  language: te
  text: ఆయన యాకోబు వంశంపై శాశ్వతంగా[a] రాజ్యమేలుతాడు; ఆయన రాజ్యానికి అంతం ఉండదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యుగయుగాల వరకు.’ εἰς τοὺς αἰῶνας అనే గ్రీకు నుడికారం అంతం లేని కాలవ్యవధిని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεύσει
  choice: రాజ్యమేలుతాడు
  rationale: భవిష్యత్ కాలంలోని βασιλεύω రాజుగా పరిపాలించడాన్ని సూచిస్తుంది. ‘రాజ్యమేలుతాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి రాజరిక భావాన్ని నిలుపుతుంది.
- source_word: ἐπὶ τὸν οἶκον Ἰακώβ
  choice: యాకోబు ఇంటివారిపై
  rationale: ἐπί + ద్వితీయా విభక్తి ఇక్కడ ‘పై’ అనే ఆధిపత్య భావాన్ని ఇస్తుంది. οἶκος వ్యక్తిగత గృహాన్ని మాత్రమే కాక వంశం లేదా కుటుంబ సముదాయాన్ని సూచిస్తున్నందున ‘ఇంటివారు’ తెలుగు పాఠకులకు సహజంగా ఉండి సామూహిక భావాన్ని కాపాడుతుంది.
- source_word: εἰς τοὺς αἰῶνας
  choice: శాశ్వతంగా
  rationale: ఈ గ్రీకు నుడికారం అంతం లేని కాలవ్యవధిని సూచిస్తుంది. ‘శాశ్వతంగా’ దాని భావాన్ని స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: βασιλείας
  choice: రాజ్యం
  rationale: βασιλεία ‘పాలన’ లేదా ‘రాజ్యం’ రెండింటినీ సూచించగలదు. ‘అంతం ఉండదు’ అనే వాక్యంతో ‘రాజ్యం’ సహజంగా సరిపోతూ రాజరికం, నిరంతరత్వం రెండింటినీ నిలుపుతుంది.
- source_word: οὐκ ἔσται τέλος
  choice: అంతం ఉండదు
  rationale: ఇది బలమైన నిరాకరణతో కూడిన భవిష్యత్ అస్తిత్వ నిర్మాణం. ‘అంతం ఉండదు’ సంక్షిప్తంగా, సహజంగా దాని పూర్తి బలాన్ని అందిస్తుంది.
theological_decisions:
- issue: ‘యాకోబు ఇల్లు’ అనే పదబంధపు పరిధి
  choice: ‘యాకోబు ఇంటివారు’గా నిలుపబడింది; ‘ఇశ్రాయేలు ప్రజలు’ లేదా ‘దేవుని ప్రజలు’గా విస్తరించలేదు.
  alternative: యాకోబు ఇల్లు; ఇశ్రాయేలు ప్రజలు; దేవుని ప్రజలు
  rationale: ఇది సాంప్రదాయ ఒడంబడిక సంబంధిత సామూహిక సంబోధన. దాని పరిధిని తరువాతి వేదాంత నిర్ణయాలతో ముందుగానే నిర్వచించకుండా మూలంలోని భావ ఉద్రిక్తతను నిలుపుతుంది.
- issue: రాజ్యపాలన కాలవ్యవధి
  choice: εἰς τοὺς αἰῶνας ను ‘శాశ్వతంగా’ అని, οὐκ ἔσται τέλος ను ‘అంతం ఉండదు’ అని అనువదించబడింది.
  alternative: యుగయుగాల వరకు; యుగాల వరకు
  rationale: వాక్యం ఆయన రాజ్యపాలనకు అంతం లేదని స్పష్టంగా చెబుతుంది. ప్రధాన పాఠంలో సహజ తెలుగు వాడుతూ, మరింత పదశః ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘రాజ్యమేలుతాడు’ రాజరిక భావాన్ని స్పష్టంగా ఉంచుతుంది; ‘యాకోబు ఇంటివారు’ సామూహిక వంశార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
