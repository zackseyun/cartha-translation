id: LUK.1.26
reference: Luke 1:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ ἀπεστάλη ὁ ἄγγελος Γαβριὴλ ⸀ἀπὸ τοῦ θεοῦ εἰς πόλιν τῆς Γαλιλαίας ᾗ ὄνομα Ναζαρὲθ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/026.yaml
  text: In the sixth month[a], the angel Gabriel was sent from God to a city of Galilee named Nazareth[b],
translation:
  language: te
  text: ఆరవ నెలలో[a], దేవుని నుండి గబ్రియేలు అనే దేవదూత గలిలయలోని నజరేతు అనే పట్టణానికి పంపబడ్డాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ఎలిజబెతు గర్భవతిగా ఉన్న ఆరవ నెల; లూకా 1:24, 36 చూడండి.
    reason: cross_reference
  - marker: b
    text: లేదా, “గలిలయకు చెందిన నజరేతు అనే పట్టణానికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ
  choice: ఆరవ నెలలో
  rationale: ἐν + దత్తివిభక్తి కాలాన్ని సూచిస్తుంది. δέ స్వల్ప అనుసంధాన పదం; తెలుగులో విడిగా అనువదించకపోయినా కథన ప్రవాహం సహజంగా నిలుస్తుంది.
- source_word: ἀπεστάλη
  choice: పంపాడు
  rationale: గ్రీకు క్రియ కర్మణి రూపంలో ఉన్నా, సహజమైన తెలుగులో ἀπὸ τοῦ θεοῦ సూచించే పంపినవాడిని కర్తగా ఉంచి ‘దేవుడు ... పంపాడు’ అని అనువదించడం అర్థాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: ὁ ἄγγελος Γαβριὴλ
  choice: గబ్రియేలు అనే దేవదూతను
  rationale: సందర్భంలో ἄγγελος పరలోక దూతను సూచిస్తుంది. Γαβριὴλ పేరుకు ప్రాచుర్యంలో ఉన్న తెలుగు రూపం ‘గబ్రియేలు’ వాడబడింది.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: దేవుడు ... పంపాడు
  rationale: ἀπό మూలం/వచ్చిన స్థానాన్ని ప్రధానంగా సూచించినా, పంపబడిన కార్యంలో దేవుడే పంపినవాడని సందర్భం తెలుపుతుంది. తెలుగులో ఈ కర్తృవాచ్య నిర్మాణం సహజంగా ఉంటుంది.
- source_word: εἰς πόλιν τῆς Γαλιλαίας
  choice: గలిలయలోని ... పట్టణానికి
  rationale: εἰς గమ్యాన్ని సూచిస్తుంది; ప్రాంత సంబంధాన్ని తెలుగులో సహజంగా ‘గలిలయలోని’ అని వ్యక్తపరచడం జరిగింది.
- source_word: ᾗ ὄνομα Ναζαρὲθ
  choice: నజరేతు అనే
  rationale: అక్షరార్థంగా ‘దాని పేరు నజరేతు’; తెలుగులో పట్టణనామాన్ని తెలిపే సహజమైన సంక్షిప్త నిర్మాణం ‘నజరేతు అనే’.
theological_decisions:
- issue: ‘ఆరవ నెల’ దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘ఆరవ నెలలో’ అని మాత్రమే ఉంచి, ఎలిజబెతు గర్భధారణకు సంబంధించినదని పాదసూచికలో వివరించడం.
  alternative: సంవత్సరంలోని ఆరవ నెలగా గ్రహించడం.
  rationale: లూకా 1:24, 36 సందర్భం ఇది ఎలిజబెతు గర్భధారణ ఆరవ నెల అని సూచిస్తుంది; అయితే ఈ వచనంలోని గ్రీకు పాఠ్యం ఆ సంబంధాన్ని మళ్లీ స్పష్టంగా చెప్పదు. అందువల్ల ప్రధాన పాఠ్యంలోని సంక్షిప్తతను కాపాడాం.
- issue: ἀπὸ τοῦ θεοῦలో మూలం మరియు కర్తృత్వం
  choice: సహజ తెలుగు కోసం ‘దేవుడు ... పంపాడు’ అని కర్తృవాచ్యంలో అనువదించడం.
  alternative: ‘దేవుని దగ్గరనుండి పంపబడ్డాడు’ అని మూలాన్ని ప్రత్యక్షంగా చూపించడం.
  rationale: గ్రీకు పదబంధం దేవుని దగ్గరనుండి పంపబడినదనే మూలభావాన్ని ఇస్తుంది; సందర్భంలో దేవుని కర్తృత్వమూ స్పష్టమే. తెలుగు కర్తృవాచ్యం అదనపు సిద్ధాంతార్థం చేర్చకుండా భావాన్ని సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథన శైలిలో అనువదించబడింది. ‘గలిలయలోని’ ప్రాంత సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది; కర్తృవాచ్య నిర్మాణం తెలుగు వాక్యప్రవాహాన్ని మెరుగుపరుస్తుంది.
