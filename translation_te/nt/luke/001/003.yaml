revisions:
- from: అందువల్ల, మొదటి నుంచీ అన్నిటినీ జాగ్రత్తగా పరిశీలించిన నేను కూడా, అత్యంత గౌరవనీయుడైన థెయొఫిలా, వాటిని నీ కోసం క్రమపద్ధతిలో రాయడం మంచిదని భావించాను.[a][b]
  to: మొదటి నుంచీ అన్ని విషయాలను జాగ్రత్తగా పరిశీలించిన నాకు కూడా[a], అత్యంత గౌరవనీయుడైన థెయొఫిలా, వాటిని నీకు క్రమపద్ధతిగా[b] రాయడం మంచిదనిపించింది.
  rationale: The revision removes the added inferential «అందువల్ల», renders σοι as the direct recipient «నీకు», and relocates each footnote marker to the relevant Telugu expression. It preserves the Greek participial background clause, Luke’s inclusion of himself through «నాకు కూడా», the noncommittal sense of καθεξῆς, and the formal vocative address.
