  text: it seemed good to me also[a], having followed all things closely from the beginning, to write them to you in orderly sequence, most excellent Theophilus[b],
translation:
  language: te
  text: మొదటి నుంచీ అన్ని విషయాలను జాగ్రత్తగా పరిశీలించిన నాకు కూడా[a], అత్యంత గౌరవనీయుడైన థెయొఫిలా, వాటిని నీకు క్రమపద్ధతిగా[b] రాయడం మంచిదనిపించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మొదటి నుంచీ అన్ని విషయాలను జాగ్రత్తగా విచారించిన నాకు కూడా.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వరుసగా”; ఈ మాట తప్పనిసరిగా కఠినమైన కాలక్రమాన్ని కాక, క్రమబద్ధమైన అమరికను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔδοξε
  choice: మంచిదని భావించాను
  rationale: ఈ ప్రయోగం ఆలోచించి తీసుకున్న నిర్ణయాన్ని సూచిస్తుంది. తెలుగు సహజత్వాన్ని కాపాడుతూ గ్రీకు వాక్యంలోని అధికారిక భావాన్ని నిలుపుతుంది.
- source_word: κἀμοὶ
  choice: నేను కూడా
  rationale: ముందటి వచనంలో ప్రస్తావించిన ఇతర రచయితలతో పాటు లూకా తనను చేర్చుకుంటున్న అనుసంధానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: παρηκολουθηκότι
  choice: పరిశీలించిన
  rationale: ఈ సందర్భంలో పదం విషయాలను దగ్గరగా అనుసరించడం, జాగ్రత్తగా విచారించడం అనే భావాలను కలిగిస్తుంది; ఆధునిక తెలుగులో ‘పరిశీలించిన’ సహజంగా పరిశోధనాత్మక భావాన్ని అందిస్తుంది.
- source_word: ἄνωθεν
  choice: మొదటి నుంచీ
  rationale: చరిత్రాత్మక ముందుమాటలో ఇది ‘ఆరంభం నుంచి’ అనే అర్థాన్నే సహజంగా ఇస్తుంది.
- source_word: πᾶσιν
  choice: అన్నిటినీ
  rationale: చర్చలో ఉన్న సంఘటనలు, విషయాల సమగ్రతను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἀκριβῶς
  choice: జాగ్రత్తగా
  rationale: ఖచ్చితమైన శ్రద్ధతో పరిశీలించడాన్ని సూచిస్తుంది; ‘పరిశీలించిన’తో సహజంగా జతకడుతుంది.
- source_word: καθεξῆς
  choice: క్రమపద్ధతిలో
  rationale: క్రమబద్ధమైన అమరిక లేదా వరుస రెండింటికీ చోటు ఇస్తుంది; తప్పనిసరిగా కఠిన కాలక్రమాన్ని ప్రకటించదు.
- source_word: σοι γράψαι
  choice: వాటిని నీ కోసం రాయడం
  rationale: దత్తివాచక గ్రహీతను సహజ తెలుగులో ‘నీ కోసం’గా చూపుతూ, సందర్భంలోని విషయాలను ‘వాటిని’ ద్వారా స్పష్టం చేస్తుంది.
- source_word: κράτιστε
  choice: అత్యంత గౌరవనీయుడైన
  rationale: ఉన్నత స్థానమున్న వ్యక్తికి వాడే అధికారిక గౌరవ సంబోధనను ఆధునిక, గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
- source_word: Θεόφιλε
  choice: థెయొఫిలా
  rationale: వ్యక్తి పేరును తెలుగులో లిప్యంతరీకరించి, ప్రత్యక్ష సంబోధనకు తగిన రూపాన్ని ఉపయోగించింది.
theological_decisions:
- issue: καθεξῆς చారిత్రక క్రమాన్ని ఎంతవరకు సూచిస్తుంది
  choice: క్రమపద్ధతిలో
  alternative: కాలక్రమానుసారంగా
  rationale: గ్రీకు పదం క్రమమైన అమరికను లేదా వరుసను సూచించగలదు; అది తప్పనిసరిగా పూర్తిగా కఠినమైన కాలక్రమాన్ని వాదించదు. ఎంపిక చేసిన పదబంధం ఈ అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: లూకా ముందుమాటలోని అధికారిక, గౌరవప్రదమైన శైలిని నిలుపుతూ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యనిర్మాణం వాడబడింది. గ్రీకులోని ప్రధాన వాక్యం చివరికి వచ్చే నిర్మాణాన్ని తెలుగులో సాధ్యమైనంతవరకు నిలిపారు.
