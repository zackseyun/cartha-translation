    issue: The main rendering “శుభాకాంక్షలు తెలిపింది” does not accurately represent ἠσπάσατο.
    rationale: The Greek verb denotes greeting/saluting someone. Telugu “శుభాకాంక్షలు తెలపడం” ordinarily expresses good wishes and may add a congratulatory sense absent from the source.
  - severity: low
    issue: The footnote presents the direct meaning as an alternative while the main text uses the less accurate expression.
    rationale: The principal text should carry the direct lexical sense; a footnote may offer a more formal Telugu alternative such as “అభివాదం చేసింది.”
