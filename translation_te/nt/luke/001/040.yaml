  text: and entered the house of Zechariah and greeted Elizabeth[a][b].
translation:
  language: te
  text: జెకర్యా ఇంటిలోకి ప్రవేశించి ఎలీసబెతును పలకరించింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎలీసబెతుకు అభివాదం చేసింది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: ఇంట్లోకి వెళ్లి
  rationale: εἰσέρχομαι ఒక స్థలంలోకి ప్రవేశించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సందర్భానుగుణంగా ‘ఇంట్లోకి వెళ్లి’ సహజంగా ఉంది; ప్రవేశ భావాన్ని నిలుపుతుంది.
- source_word: οἶκον
  choice: ఇంటి
  rationale: εἰς‌తో కలిసి ఇక్కడ భౌతిక నివాసస్థలమే ఉద్దేశించబడింది. ‘ఇల్లు’ అనే అర్థాన్ని విభక్తితో సహజంగా ‘ఇంట్లోకి’గా వ్యక్తం చేశాం.
- source_word: Ζαχαρίου
  choice: జెకర్యా
  rationale: గ్రీకు వ్యక్తినామానికి తెలుగులో విస్తృతంగా పరిచితమైన బైబిలు రూపాన్ని వాడాం.
- source_word: ἠσπάσατο
  choice: శుభాకాంక్షలు తెలిపింది
  rationale: ἀσπάζομαι ఇక్కడ ఎదురైనప్పుడు పలకరించడం లేదా అభివాదం చేయడం అనే అర్థం ఇస్తుంది. ‘శుభాకాంక్షలు తెలిపింది’ గౌరవప్రదమైన, సహజమైన తెలుగు; మరీ ఆచారబద్ధమైన భావాన్ని చేర్చదు.
- source_word: Ἐλισάβετ
  choice: ఎలీసబెతు
  rationale: గ్రీకు వ్యక్తినామానికి తెలుగులో పరిచితమైన బైబిలు రూపాన్ని స్వీకరించాం.
- source_word: καὶ
  choice: వెళ్లి … తెలిపింది
  rationale: తెలుగులో వరుసగా జరిగిన చర్యలను క్రియావిశేషణ రూపం మరియు ప్రధాన క్రియతో కలపడం సహజం. గ్రీకులోని రెండు καίల సమన్వయ, వరుస చర్యల భావం నిలిచింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలిని వాడాం. ముందు వచనంలోని మరియే కర్త అని తెలుగు స్త్రీలింగ క్రియారూపం ద్వారా స్పష్టమవుతుంది; గ్రీకు క్రియ కూడా సందర్భంలోని అదే కర్తను కొనసాగిస్తుంది.
