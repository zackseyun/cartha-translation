language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ Ζαχαρίας ὁ πατὴρ αὐτοῦ ἐπλήσθη πνεύματος ἁγίου καὶ ⸀ἐπροφήτευσεν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/067.yaml
  text: 'And Zechariah his father was filled with the Holy Spirit and prophesied, saying:'
translation:
  language: te
  text: 'అప్పుడు అతని తండ్రి జెకర్యా పరిశుద్ధాత్మతో నింపబడి, ఇలా ప్రవచించాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: అప్పుడు
  rationale: ఇక్కడి καί కథన కొనసాగింపును సూచిస్తుంది. తెలుగులో ముందరి సంఘటనతో సహజంగా అనుసంధానించేందుకు ‘అప్పుడు’ అని అనువదించాం.
- source_word: Ζαχαρίας
  choice: జెకర్యా
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: అతని తండ్రి
  rationale: గ్రీకు సంబంధబోధక పదబంధాన్ని సహజమైన తెలుగులో ఇచ్చి, జెకర్యా శిశువు తండ్రి అనే గుర్తింపును నిలిపాం.
- source_word: ἐπλήσθη
  choice: నింపబడి
  rationale: πίμπλημι యొక్క భూతకాల కర్మణి భావాన్ని నిలుపుతూ, పరిశుద్ధాత్మతో నింపబడిన సంఘటనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πνεύματος ἁγίου
  choice: పరిశుద్ధాత్మతో
  rationale: πίμπλημι తరువాతి గ్రీకు షష్ఠీ విభక్తిని తెలుగులో సహజమైన ‘తో’తో వ్యక్తం చేశాం; లూకా కథనంలో ఇది దేవుని పరిశుద్ధాత్మను సూచిస్తుంది.
- source_word: ἐπροφήτευσεν
  choice: ప్రవచించాడు
  rationale: ప్రేరేపితమైన ప్రవక్తీయ పలుకును సూచించే προφητεύω క్రియకు సూటిగా, సాధారణ పాఠకులకు అర్థమయ్యే సమానార్థక పదం.
- source_word: λέγων
  choice: ఇలా
  rationale: తరువాత వచ్చే ప్రవచన విషయాన్ని పరిచయం చేసే కృదంతాన్ని తెలుగులో సహజమైన ఉల్లేఖన ప్రవేశికగా మార్చాం.
theological_decisions:
- issue: πνεύματος ἁγίου యొక్క సూచన
  choice: పరిశుద్ధాత్మ
  alternative: ఒక పరిశుద్ధ ఆత్మ
  rationale: లూకా–అపొస్తలుల కార్యములలో దైవ ప్రేరణ సందర్భాల్లో ఈ పదబంధం దేవుని పరిశుద్ధాత్మను సూచిస్తుంది. అందువల్ల అదనపు సిద్ధాంత వివరణను చేర్చకుండా ఆ సూచనను స్పష్టంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగా, సాధారణ పాఠకులకు సులభంగా ఉండే కథన శైలి. ‘అప్పుడు’ కథన అనుసంధానాన్ని సహజీకరిస్తుంది; ‘ఇలా ప్రవచించాడు’ తరువాతి ప్రత్యక్ష వాక్యానికి సుగమమైన ప్రవేశిక.
