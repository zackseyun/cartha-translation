  text: After these days Elizabeth his wife conceived[a], and she kept herself hidden for five months, saying[b],
translation:
  language: te
  text: 'ఆ రోజుల తర్వాత అతని భార్య ఎలీసబెతు గర్భం ధరించింది. ఆమె ఐదు నెలలపాటు తనను తాను దాచుకుంటూ ఇలా చెప్పింది:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ ταύτας τὰς ἡμέρας
  choice: ఆ రోజుల తర్వాత
  rationale: μετά + accusative కాలక్రమంలో ‘తర్వాత’ను సూచిస్తుంది. గతంలో ఇప్పుడే వివరించిన రోజులను సూచించే సందర్భంలో ఆధునిక తెలుగులో ‘ఆ రోజులు’ సహజంగా ఉంది; δέ స్వల్ప అనుసంధాన పదం కావడంతో ప్రత్యేకంగా అనువదించలేదు.
- source_word: συνέλαβεν
  choice: గర్భం ధరించింది
  rationale: ఈ సందర్భంలో συλλαμβάνω బిడ్డను గర్భంలో ధరించడాన్ని సూచిస్తుంది. ‘గర్భం ధరించింది’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వ్యక్తీకరణ.
- source_word: Ἐλισάβετ
  choice: ఎలిసబెతు
  rationale: గ్రీకు వ్యక్తినామానికి తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: జెకర్యా భార్య
  rationale: γυνή ఇక్కడ స్వామ్యసూచక αὐτοῦతో కలిసి ‘అతని భార్య’ అని స్పష్టంగా అర్థమవుతుంది. తెలుగు పాఠకుడికి సూచన స్పష్టంగా ఉండేందుకు పూర్వసందర్భంలోని జెకర్యా పేరును ఉపయోగించాం.
- source_word: περιέκρυβεν ἑαυτὴν
  choice: తనను తాను దాచుకొని
  rationale: ప్రతిబింబార్థాన్ని నిలుపుతూ, గ్రీకు imperfect సూచించే కొనసాగిన స్థితిని ‘ఐదు నెలలపాటు’తో కలిపి సహజంగా వ్యక్తపరుస్తుంది. ఆమె ఎందుకు లేదా ఎక్కడ దాగిందో మూలపాఠం చెప్పనందున అదనపు భావం చేర్చలేదు.
- source_word: μῆνας πέντε
  choice: ఐదు నెలలపాటు
  rationale: కాలవ్యవధిని సూచించే accusative భావాన్ని తెలుగులో ‘పాటు’ సహజంగా స్పష్టం చేస్తుంది.
- source_word: λέγουσα
  choice: 'ఇలా అంది:'
  rationale: తదుపరి వచనంలోని ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే participleను తెలుగులో సహజమైన finite రూపంగా మార్చి, వాక్యం కొనసాగుతుందని ద్విబిందువుతో సూచించాం.
