  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గౌరవప్రదమైన కథన శైలి. మూలంలోని కాలక్రమం, గర్భధారణ, ఐదు నెలలపాటు కొనసాగిన దాచుకోవడం, తదుపరి మాటకు అనుసంధానం అన్నీ నిలుపబడ్డాయి.
