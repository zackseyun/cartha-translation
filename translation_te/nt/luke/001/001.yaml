id: LUK.1.1
reference: Luke 1:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐπειδήπερ πολλοὶ ἐπεχείρησαν ἀνατάξασθαι διήγησιν περὶ τῶν πεπληροφορημένων ἐν ἡμῖν πραγμάτων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/001.yaml
  text: Since many have undertaken to compile an account concerning the matters that have been fulfilled among us,[a]
translation:
  language: te
  text: మన మధ్య నెరవేరిన సంగతుల గురించి ఒక వృత్తాంతాన్ని క్రమబద్ధంగా రచించడానికి చాలామంది పూనుకున్నందున,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπειδήπερ
  choice: '[ఈ వాక్యం తరువాతి వచనాలతో కొనసాగుతున్నందున] ... పూనుకున్నారు'
  rationale: ఈ కారణసూచక అవ్యయం 1:1–4లోని దీర్ఘ వాక్యానికి నేపథ్యాన్ని ఏర్పరుస్తుంది. తెలుగులో సహజమైన వాక్యనిర్మాణం కోసం దాని సంబంధం తరువాతి వచనాలతో కొనసాగనివ్వబడింది; ప్రత్యేకంగా ‘ఎందుకంటే’ అని పెట్టడం అసంపూర్ణంగా వినిపించవచ్చు.
- source_word: πολλοὶ
  choice: చాలామంది
  rationale: గ్రీకులో ఉన్న పరిమాణార్థాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది; ‘ఇతరులు’ అనే భావాన్ని అదనంగా చేర్చదు.
- source_word: ἐπεχείρησαν
  choice: పూనుకున్నారు
  rationale: ఒక రచనా కార్యాన్ని చేపట్టారనే భావాన్ని ఇస్తుంది; ‘ప్రయత్నించారు’ అనడం వల్ల వారు విఫలమయ్యారనే అనవసర సూచన కలగవచ్చు.
- source_word: ἀνατάξασθαι
  choice: క్రమంగా రచించడానికి
  rationale: విషయాలను అమర్చి వృత్తాంతంగా రూపొందించే సాహిత్య కార్యాన్ని స్పష్టంగా తెలియజేస్తుంది. ‘సంకలనం చేయడానికి’ కంటే సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: διήγησιν
  choice: ఒక వృత్తాంతాన్ని
  rationale: సంఘటనలను వివరించే రచిత కథనం లేదా నివేదిక అనే భావాన్ని, గంభీరమైన సాహిత్య శైలిలో అందిస్తుంది.
- source_word: περὶ
  choice: గురించి
  rationale: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, మూలంలోని విషయసంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τῶν πεπληροφορημένων
  choice: నెరవేరిన
  rationale: పూర్తికి తీసుకురాబడిన లేదా సాధించబడిన సంగతులు అనే ప్రధాన సందర్భార్థాన్ని సంక్షిప్తంగా అందిస్తుంది. ‘పూర్తిగా నిర్ధారించబడిన’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: ἐν ἡμῖν
  choice: మన మధ్య
  rationale: సంఘటనలు వక్తతో సంబంధమున్న సమూహం మధ్య జరిగాయనే సమూహార్థాన్ని కాపాడుతుంది; ఆ ‘మనము’ ఎవరన్నది అనవసరంగా నిర్దేశించదు.
- source_word: πραγμάτων
  choice: సంగతులను
  rationale: కార్యాలు, సంఘటనలు, విషయాలు అన్న విస్తృత పరిధిని సహజమైన తెలుగులో నిలుపుతుంది; ‘సంఘటనలు’ కంటే కొద్దిగా విశాలమైన పదం.
theological_decisions:
- issue: లూకా ముందుమాటలో πεπληροφορημένων పదార్థం
  choice: నెరవేరిన
  alternative: సాధించబడిన; మన మధ్య పూర్తిగా నిర్ధారించబడిన
  rationale: πραγμάτωνతో కలిసినప్పుడు ఈ కృదంతం పూర్తి చేయబడిన లేదా నెరవేర్చబడిన కార్యాలను సూచించడం సందర్భానికి బాగా సరిపోతుంది. అయితే ‘పూర్తిగా నిర్ధారించబడిన’ అనే అర్థసాధ్యతను మూసివేయకుండా పాదసూచికలో ఉంచాం.
translation_notes:
  register: లూకా 1:1–4లోని గంభీరమైన సాహిత్య ముందుమాటకు తగిన ఆధునిక, మర్యాదపూర్వక శైలి వాడబడింది. ఈ వచనం మూలంలో దీర్ఘ వాక్యపు ప్రారంభ భాగం కాబట్టి, తెలుగులోనూ తరువాతి వచనాలతో వ్యాకరణ సంబంధం కొనసాగేలా రూపొందించబడింది.
