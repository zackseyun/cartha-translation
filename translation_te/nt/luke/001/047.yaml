  text: καὶ ἠγαλλίασεν τὸ πνεῦμά μου ἐπὶ τῷ θεῷ τῷ σωτῆρί μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/047.yaml
  text: and my spirit has rejoiced in God my Savior[a].
translation:
  language: te
  text: మరియు నా ఆత్మ నా రక్షకుడైన దేవునిలో ఉల్లసించింది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఉప్పొంగి ఆనందించింది.’
    reason: ἠγαλλίασενలోని తీవ్ర ఆనంద భావానికి సహజమైన ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: καὶ
  choice: మరియు
  rationale: ముందటి వచనంలోని సమాంతర కవితా పాదంతో ఈ పాదాన్ని కలిపే సాధారణ సంధాయకాన్ని నిలుపుతుంది.
- source_word: ἠγαλλίασεν
  choice: ఉల్లసించింది
  rationale: ఆరిస్ట్ కర్తరి నిర్దేశక క్రియలో వ్యక్తమయ్యే ఉప్పొంగే ఆనందాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὸ πνεῦμά μου
  choice: నా ఆత్మ
  rationale: ముందటి వచనంలోని ‘నా ప్రాణం’తో ఉన్న కవితా సమాంతరతను కాపాడుతూ, πνεῦμα అనే ప్రత్యేక పదాన్ని వ్యాఖ్యానాత్మకంగా కలిపివేయకుండా నిలుపుతుంది.
- source_word: ἐπὶ τῷ θεῷ
  choice: దేవునిలో
  rationale: ἀγαλλιάωతో కూడిన ἐπί + దత్తివిభక్తి ఆనందానికి ఆధారం లేదా సందర్భాన్ని సూచిస్తుంది; ‘దేవునిలో’ అనేది సంబంధాత్మక భావాన్ని సహజంగా కాపాడుతుంది.
- source_word: σωτῆρί μου
  choice: నా రక్షకుడైన
  rationale: σωτήρకు నూతన నిబంధన సందర్భంలో నేరుగా సరిపోయే ‘రక్షకుడు’ అనే అర్థాన్ని నిలుపుతూ, దేవునితో దాని వ్యాకరణ సంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: దేవుణ్ణి ‘నా రక్షకుడు’గా పేర్కొనడం
  choice: నా రక్షకుడైన దేవుడు
  alternative: నన్ను విడిపించే దేవుడు
  rationale: గ్రీకు పాఠం దేవుణ్ణి నేరుగా మరియ రక్షకునిగా గుర్తిస్తుంది. అదనపు సిద్ధాంత నిర్ధారణలను చేర్చకుండా ఆ వాదనను యథాతథంగా నిలుపుతుంది.
- issue: చుట్టుపక్కల సమాంతరతలో ‘ఆత్మ’కు ‘ప్రాణం’తో ఉన్న సంబంధం
  choice: ‘ఆత్మ’ అనే ప్రత్యేక పదాన్ని నిలుపడం
  alternative: రెండింటినీ ఒకే ‘అంతరంగం’ అనే పదంతో అనువదించడం
  rationale: కవితా సమాంతరత అర్థసామీప్యాన్ని సూచించినా, గ్రీకు వేర్వేరు పదాలను వాడుతుంది; వాటిని నిలపడం వల్ల పాఠంలోని సాహిత్య, వేదాంత ఉద్వేగం పరిష్కరించబడకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా ధోరణి. ‘నా ఆత్మ’ మరియు ‘నా రక్షకుడైన దేవుడు’ అనే రూపాలు మూలంలోని పదభేదాన్నీ వేదాంత బరువునీ నిలుపుతాయి.
