source:
  edition: SBLGNT
  text: Ἐποίησεν κράτος ἐν βραχίονι αὐτοῦ, διεσκόρπισεν ὑπερηφάνους διανοίᾳ καρδίας αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/051.yaml
  text: He has shown strength with his arm[b][a]; he has scattered the proud in the thoughts of their hearts.
translation:
  language: te
  text: ఆయన తన బాహువుతో బలాన్ని ప్రదర్శించాడు; తమ హృదయాలోచనల్లో గర్విష్ఠులైనవారిని చెదరగొట్టాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ హృదయ ఉద్దేశాలనుబట్టి గర్విష్ఠులను చెదరగొట్టాడు,” లేదా “తమ హృదయ ఊహల్లో గర్విష్ఠులైనవారిని చెదరగొట్టాడు.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐποίησεν κράτος
  choice: బలాన్ని ప్రదర్శించాడు
  rationale: గ్రీకు పదబంధం అక్షరార్థంగా ‘బలాన్ని చేశాడు’ అని ఉన్నా, అది శక్తిని కార్యరూపంలో కనబరచడాన్ని సూచించే నుడికారం. సహజమైన తెలుగులో భావాన్ని, పూర్తయిన కార్య స్వరూపాన్ని నిలుపుతుంది.
- source_word: ἐν βραχίονι αὐτοῦ
  choice: తన బాహువుతో
  rationale: ἐν ఇక్కడ సాధనార్థకంగా ఉంది. పాత నిబంధనలో దేవుని శక్తిమంతమైన బాహువు అనే రూపకాన్ని ‘బాహువుతో’ సహజంగా నిలుపుతుంది.
- source_word: διεσκόρπισεν
  choice: చెదరగొట్టాడు
  rationale: ఈ క్రియ చెదరగొట్టడం లేదా చెల్లాచెదురు చేయడం అనే అర్థం ఇస్తుంది; మొదటి పాదంలోని నిర్ణయాత్మక దైవకార్యానికి సమాంతరంగా ఉంటుంది.
- source_word: ὑπερηφάνους
  choice: గర్విష్ఠులైనవారిని
  rationale: నామవాచకంగా వాడిన విశేషణం గర్వం గల వ్యక్తులను సూచిస్తుంది. ఈ రూపం ఆధునిక తెలుగులో స్పష్టంగా, గంభీరంగా ఉంటుంది.
- source_word: διανοίᾳ καρδίας αὐτῶν
  choice: తమ హృదయాలోచనల్లో
  rationale: διάνοια ఆలోచన, మనోభావం లేదా ఉద్దేశాన్ని సూచించగలదు; καρδία అంతరంగానికి కేంద్రం. ‘హృదయాలోచనలు’ అనే సమాసం సెమిటిక్ భావచిత్రాన్ని సహజ తెలుగులో సంరక్షిస్తుంది.
theological_decisions:
- issue: మరియ గీతంలోని గ్రీకు భూతకాల క్రియల కాలభావం
  choice: 'తెలుగులో పూర్తయిన కార్యాన్ని తెలిపే సాధారణ భూతకాలం: ‘ప్రదర్శించాడు,’ ‘చెదరగొట్టాడు’'
  alternative: ‘ప్రదర్శించి ఉన్నాడు,’ ‘చెదరగొట్టి ఉన్నాడు’ వంటి వర్తమాన-పూర్ణ భావం
  rationale: తెలుగులో సాధారణ భూతకాలమే ఈ కవితాత్మక ప్రకటనలో దేవుని నిర్ణయాత్మక కార్యాన్ని సహజంగా తెలియజేస్తుంది. సందర్భంలో అది గత కార్యం, దేవుని స్వభావ కార్యాల సంగ్రహం, లేదా ప్రవచనాత్మక నిశ్చయతగా వినిపించే ఉద్రిక్తతను అనవసరంగా పరిష్కరించదు.
- issue: 'διανοίᾳ యొక్క సంబంధం: పరిధా లేక సాధనమా'
  choice: ‘తమ హృదయాలోచనల్లో’—అంతరంగ ఆలోచనా పరిధిని ముందుకు తెస్తుంది
  alternative: ‘తమ హృదయ ఉద్దేశాలనుబట్టి’ లేదా ‘తమ హృదయ సంకల్పం ద్వారా’
  rationale: గ్రీకు దత్తివిభక్తి పరిధి లేదా సాధనం రెండింటినీ సూచించగలదు. ప్రధాన పాఠ్యం సహజమైన పరిధి భావాన్ని ఇస్తూ, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనా స్వరానికి తగిన గంభీరతతో, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. ‘బాహువు’ అనే బైబిలీయ రూపకాన్ని నిలిపి, అసహజమైన అక్షరానువాదాన్ని నివారించాం.
