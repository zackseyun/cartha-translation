  text: καὶ ἀποκριθεῖσα ἡ μήτηρ αὐτοῦ εἶπεν· Οὐχί, ἀλλὰ κληθήσεται Ἰωάννης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/060.yaml
  text: And his mother answered[a], “No; rather, he shall be called John.”
translation:
  language: te
  text: 'అతని తల్లి జవాబిచ్చింది: “లేదు; బదులుగా అతనిని యోహాను అని పిలుస్తారు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεῖσα
  choice: జవాబిచ్చింది
  rationale: అయోరిస్ట్ కృదంతం ఇక్కడ ప్రత్యక్ష సంభాషణను పరిచయం చేస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో దీనిని సమాపక క్రియగా అనువదించడం స్పష్టంగా ఉంటుంది.
- source_word: μήτηρ αὐτοῦ
  choice: అతని తల్లి
  rationale: గ్రీకు స్వామ్య సంబంధాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: Οὐχί
  choice: లేదు
  rationale: ముందు ప్రతిపాదించిన పేరును గట్టిగా తిరస్కరించే ప్రత్యక్ష, సహజ తెలుగు సమాధానం.
- source_word: ἀλλὰ
  choice: అందుకు …;
  rationale: ἀλλάకు ఉన్న సరిదిద్దే వ్యతిరేక భావాన్ని ‘లేదు’ తరువాతి ప్రత్యామ్నాయ ప్రకటన ద్వారా సహజంగా వ్యక్తం చేస్తుంది; విడిగా ‘కాని’ అనడం తెలుగులో కృత్రిమంగా వినిపించవచ్చు.
- source_word: κληθήσεται
  choice: అతనికి … అని పేరు పెట్టాలి
  rationale: భవిష్యత్ కర్మణి రూపంలోని నామకరణ భావాన్ని సహజ తెలుగు వాడుకలో వ్యక్తం చేస్తుంది. సందర్భంలో తల్లి కేవలం భవిష్యత్తును ఊహించడం కాక, శిశువుకు పెట్టవలసిన పేరును నిశ్చయంగా ప్రకటిస్తోంది.
- source_word: Ἰωάννης
  choice: యోహాను
  rationale: తెలుగు బైబిలు సంప్రదాయంలో స్థిరపడిన ఈ వ్యక్తినామ రూపాన్ని ఉపయోగిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ శైలిని ఉపయోగించాం. గ్రీకు కృదంత నిర్మాణాన్ని సహజ తెలుగు సమాపక వాక్యంగా మార్చాం.
