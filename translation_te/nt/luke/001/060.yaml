  to: 'అతని తల్లి జవాబిచ్చింది: “లేదు; బదులుగా అతనిని యోహాను అని పిలుస్తారు.”'
  rationale: The revision explicitly conveys the corrective ἀλλά with ‘బదులుగా’ and renders the future passive κληθήσεται as a natural Telugu naming declaration. It retains the established name యోహాను and the direct, firm negative response.
