id: LUK.1.66
reference: Luke 1:66
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔθεντο πάντες οἱ ἀκούσαντες ἐν τῇ καρδίᾳ αὐτῶν, λέγοντες· Τί ἄρα τὸ παιδίον τοῦτο ἔσται; καὶ ⸀γὰρ χεὶρ κυρίου ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/066.yaml
  text: And all who heard it laid it up in their hearts[a], saying[b], “What then will this child become?” For the hand of the Lord was with him.
translation:
  language: te
  text: ఇది విన్న వారందరూ ఆ సంగతులను తమ హృదయాల్లో ఉంచుకొని, “అయితే ఈ బిడ్డ ఏమవుతాడో?” అని చెప్పారు.[a] ఎందుకంటే ప్రభువు హస్తం అతనితో ఉంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ బిడ్డ ఏమై ఉండబోతున్నాడు?” గ్రీకు క్రియకు అక్షరార్థంగా “ఉంటాడు” అనే అర్థం ఉంది; అయితే సందర్భంలో ఇది బిడ్డ భవిష్యత్తు స్థితి లేదా పాత్ర గురించిన ప్రశ్న.
    reason: lexical_alternative
  - marker: b
    text: “ప్రభువు హస్తం” అనేది దేవుని క్రియాశీల శక్తి, అనుగ్రహం లేదా నడిపింపును సూచించే బైబిలు నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: ἔθεντο ... ἐν τῇ καρδίᾳ αὐτῶν
  choice: ఆ సంగతులను తమ హృదయాల్లో దాచుకొని
  rationale: ‘తమ హృదయంలో ఉంచుకున్నారు’ అనే మూలరూపకాన్ని నిలుపుతూ, విన్న విషయాలను జాగ్రత్తగా గుర్తుంచుకొని ఆలోచించారనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: πάντες οἱ ἀκούσαντες
  choice: ఇది విన్న వారందరూ
  rationale: ముందు జరిగిన సంగతులను విన్న ప్రజలందరినీ సూచిస్తుంది; సందర్భానుసారంగా ‘ఇది’ను చేర్చడం తెలుగులో సహజం.
- source_word: Τί ἄρα
  choice: అయితే ... ఏమవుతాడో?
  rationale: ἄραలోని పూర్వ సంఘటనల ఆధారంగా తీర్మానించే లేదా ఆశ్చర్యంగా ప్రశ్నించే భావాన్ని ‘అయితే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ παιδίον τοῦτο
  choice: ఈ బిడ్డ
  rationale: వయస్సు లేదా భవిష్యత్తు పాత్రను అనవసరంగా నిర్దిష్టం చేయకుండా παιδίονకు సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: ἔσται
  choice: ఏమవుతాడో
  rationale: క్రియ అక్షరార్థంగా ‘ఉంటాడు’ అయినప్పటికీ, సందర్భంలో బిడ్డ భవిష్యత్తు స్థితి లేదా పాత్ర గురించిన ప్రశ్నను తెలుగులో ‘ఏమవుతాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: καὶ γὰρ
  choice: ఎందుకంటే
  rationale: ప్రజల ప్రశ్నకు కారణాన్ని పరిచయం చేసే సంధాన భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: χεὶρ κυρίου
  choice: ప్రభువు హస్తం
  rationale: దేవుని క్రియాశీల శక్తి, అనుగ్రహం లేదా నడిపింపును సూచించే బైబిలు రూపకాన్ని వ్యాఖ్యానించి కుదించకుండా నిలుపుతుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: ఇక్కడ దేవుణ్ణి సూచించే κύριοςకు గౌరవప్రదమైన, సాధారణ బైబిలు తెలుగు రూపం.
- source_word: μετ’ αὐτοῦ
  choice: అతనికి తోడుగా
  rationale: μετά + genitiveలోని ‘తోడు/వెంట ఉండడం’ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, ‘అతను’ బిడ్డను సూచించేలా ఉంచుతుంది.
theological_decisions:
- issue: ‘ప్రభువు హస్తం అతనికి తోడుగా ఉంది’ అనే ప్రయోగం యొక్క అర్థం
  choice: దైవిక శక్తి, అనుగ్రహం లేదా సన్నిధిని మరింత సంకుచితంగా నిర్వచించకుండా రూపకాన్ని నిలుపడం.
  alternative: ‘ప్రభువు అతనికి సహాయం చేస్తున్నాడు’ లేదా ‘దేవుని శక్తి అతనిమీద ఉంది’ అని వివరణాత్మకంగా అనువదించడం.
  rationale: మూలవాక్యం దేవుడు ఆ బిడ్డ జీవితంలో క్రియాశీలంగా ఉన్నాడని సూచిస్తుంది; అయితే అది ప్రత్యేకంగా రక్షణనా, శక్తినివ్వడమా, అనుగ్రహమా అని తేల్చదు. రూపకాన్ని నిలపడం ఈ విస్తృత భావాన్నీ వేదాంతపరమైన సంయమనాన్నీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘హృదయాల్లో దాచుకొని’ మరియు ‘ప్రభువు హస్తం’ అనే మూలరూపకాలు నిలుపబడ్డాయి; ‘అతనికి తోడుగా’ అన్నది సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే రీతిలో ఉంది.
