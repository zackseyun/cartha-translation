id: LUK.1.18
reference: Luke 1:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν Ζαχαρίας πρὸς τὸν ἄγγελον· Κατὰ τί γνώσομαι τοῦτο; ἐγὼ γάρ εἰμι πρεσβύτης καὶ ἡ γυνή μου προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/018.yaml
  text: And Zechariah said to the angel[a], “How will I know this? For I am an old man, and my wife is advanced in her days.”
translation:
  language: te
  text: జెకర్యా దూతతో, “ఇది నాకు ఎలా తెలుస్తుంది? ఎందుకంటే నేను వృద్ధుణ్ణి; నా భార్య వయసు మళ్లినది[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో అక్షరార్థంగా, “ఆమె తన దినములలో ముందుకు వెళ్లినది”; ఇది వృద్ధాప్యాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: అన్నాడు
  rationale: కథనంలో ప్రత్యక్ష సంభాషణను పరిచయం చేయడానికి సహజమైన ఆధునిక తెలుగు క్రియ.
- source_word: πρὸς τὸν ἄγγελον
  choice: దూతతో
  rationale: మాట్లాడే క్రియతో πρός సంబోధించబడిన వ్యక్తిని సూచిస్తుంది; తెలుగులో ‘దూతతో’ సహజంగా అదే సంబంధాన్ని తెలియజేస్తుంది.
- source_word: Κατὰ τί
  choice: ఎలా
  rationale: ఏ ఆధారం లేదా సూచన ద్వారా తెలుసుకోగలననే ప్రశ్నను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది; సాధనాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: γνώσομαι
  choice: నాకు తెలుస్తుంది
  rationale: భవిష్యత్తులో నిశ్చయంగా తెలుసుకోవడం అనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; కేవలం సామర్థ్యాన్ని సూచించే ‘తెలుసుకోగలను’ అనే భావానికి పరిమితం చేయదు.
- source_word: τοῦτο
  choice: ఇది
  rationale: దూత ప్రకటించిన విషయాన్ని సూచించే సాధారణ సర్వనామ రూపం.
- source_word: πρεσβύτης
  choice: వృద్ధుణ్ణి
  rationale: ఇక్కడ పదం పదవిని కాదు, వయసు మళ్లిన పురుషుణ్ణి సూచిస్తుంది; ‘వృద్ధుణ్ణి’ ప్రత్యక్షమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: γυνή
  choice: భార్య
  rationale: ‘నా’ అనే సంబంధసూచకంతో కూడిన సందర్భంలో ‘స్త్రీ’ కంటే ‘భార్య’ అనే అర్థమే ఉద్దేశించబడింది.
- source_word: προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς
  choice: వయసు మళ్లినది
  rationale: గ్రీకు నుడికారంలోని వృద్ధాప్య భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; మూలంలోని ‘రోజులు’ అనే రూపకాన్ని పాదసూచికలో భద్రపరుస్తుంది.
theological_decisions:
- issue: ἄγγελος పదం అనువాదం
  choice: దూత
  alternative: సందేశవాహకుడు
  rationale: తక్షణ సందర్భంలో మాట్లాడుతున్నది గబ్రియేలు అనే దేవదూత; ‘దూత’ తెలుగు బైబిలు సందర్భంలో సహజంగా ఈ అర్థాన్ని మోస్తుంది, అయితే మూలపదానికి సాధారణంగా ఉన్న సందేశవాహకుడనే భావాన్ని అనవసరంగా విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. జెకర్యా ప్రశ్నలోని ధృవీకరణ కోరికను వివరణాత్మకంగా విస్తరించకుండా ఉంచి, గ్రీకు నుడికారపు అక్షర రూపాన్ని పాదసూచికలో నమోదు చేశాం.
