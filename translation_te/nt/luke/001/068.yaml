id: LUK.1.68
reference: Luke 1:68
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εὐλογητὸς κύριος ὁ θεὸς τοῦ Ἰσραήλ, ὅτι ἐπεσκέψατο καὶ ἐποίησεν λύτρωσιν τῷ λαῷ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/068.yaml
  text: Blessed is the Lord, the God of Israel, because he has visited and brought redemption to his people,
translation:
  language: te
  text: “ఇశ్రాయేలు దేవుడైన ప్రభువు స్తుతింపబడుగాక! ఎందుకంటే ఆయన తన ప్రజలను దర్శించి[a], వారికి విమోచన కలిగించాడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సహాయం చేయడానికి వచ్చాడు.” ఇక్కడ “దర్శించడం” అనేది దేవుడు తన ప్రజల పట్ల శ్రద్ధ చూపుతూ వారి పరిస్థితిలో జోక్యం చేసుకోవడాన్ని సూచించే బైబిలు ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: స్తుతింపబడుగాక
  rationale: దేవుణ్ణి కొనియాడే ఆశీర్వచనంలో ఉన్న స్తుతి భావాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κύριος ὁ θεὸς τοῦ Ἰσραήλ
  choice: ఇశ్రాయేలు దేవుడైన ప్రభువు
  rationale: ‘ప్రభువు’కు ‘ఇశ్రాయేలు దేవుడు’ అనే సమానాధికరణ వివరణను తెలుగులో సహజంగా కలిపి, యూద లేఖనాల ఆరాధనా ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ప్రభువును స్తుతించడానికి కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: ἐπεσκέψατο
  choice: దర్శించి
  rationale: దేవుడు శ్రద్ధతో తన ప్రజల పరిస్థితిలో జోక్యం చేసుకోవడాన్ని సూచించే బైబిలు ‘దర్శన’ ప్రయోగాన్ని నిలుపుతుంది; దానిని కేవలం ‘సహాయం చేశాడు’గా కుదించదు.
- source_word: ἐποίησεν λύτρωσιν
  choice: విమోచన కలిగించాడు
  rationale: అక్షరార్థమైన ‘విమోచన చేశాడు’ అనే అసహజ ప్రయోగాన్ని తప్పిస్తూ, కార్యం మరియు దాని ఫలితాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: λύτρωσιν
  choice: విమోచన
  rationale: విడిపించడం, మూల్యం చెల్లించి విడుదల చేయడం అనే పదంలోని రక్షణాత్మక బరువును నిలుపుతుంది.
- source_word: τῷ λαῷ αὐτοῦ
  choice: తన ప్రజలకు
  rationale: దత్తివును ఆ కార్యం వల్ల ప్రయోజనం పొందేవారిగా సహజమైన తెలుగులో చూపుతుంది.
theological_decisions:
- issue: దైవిక దర్శన భాష
  choice: దర్శించి
  alternative: సహాయం చేయడానికి వచ్చి
  rationale: దేవుని శ్రద్ధగల రక్షణాత్మక జోక్యాన్ని సూచించే లేఖన రూపకాన్ని నిలుపుతూ, దాని భావాన్ని ఒకే వివరణకు పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘స్తుతింపబడుగాక,’ ‘దర్శించి,’ ‘విమోచన’ వంటి పదాలు లేఖన ప్రతిధ్వనిని నిలుపుతూనే సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి.
