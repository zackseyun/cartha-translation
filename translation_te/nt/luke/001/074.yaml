translation:
  language: te
  text: మనం శత్రువుల చేతిలోనుండి విడిపించబడి[a], భయం లేకుండా ఆయనను సేవించునట్లు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శత్రువుల అధికారం నుండి విడుదల పొంది.’
    reason: lexical_alternative
  - marker: b
    text: ‘సేవించునట్లు’ అనే పదాన్ని ‘ఆరాధించునట్లు’ అని కూడా అనువదించవచ్చు; ఇది దేవునికి అర్పించే ఆరాధనాత్మక సేవను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφόβως
  choice: భయం లేకుండా
  rationale: ఈ క్రియావిశేషణానికి ‘భయం లేకుండా’ లేదా ‘నిర్భయంగా’ అనే అర్థాలు ఉన్నాయి. ఇక్కడ ‘ఆయనను సేవించడానికి’ అనే క్రియతో సహజంగా కలుస్తూ మూలంలోని భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐκ χειρὸς
  choice: చేతిలోనుండి
  rationale: ఇది ఒకరి అధికారం లేదా ఆధీనంలోనుండి విడుదల కావడాన్ని తెలిపే నుడికారం. ‘చేతిలోనుండి’ అనే రూపం బైబిలీయ చిత్రాన్ని నిలుపుతూ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా ఉంది.
- source_word: ἐχθρῶν
  choice: శత్రువుల
  rationale: మూలపాఠంలో స్వామ్యసూచక సర్వనామం స్పష్టంగా లేదు. అందువల్ల ‘మన శత్రువుల’ అని పాఠ్యంలో చేర్చకుండా, ‘మనం’ అనే కర్త ద్వారా సందర్భంలోని సమూహ సంబంధాన్ని వ్యక్తం చేశాం.
- source_word: ῥυσθέντας
  choice: విడిపించబడి
  rationale: అయోరిస్టు కర్మణి అసమాపక క్రియ సేవకు ముందు జరిగిన విడుదలను సూచిస్తుంది. ‘విడిపించబడి’ ఆ సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: λατρεύειν
  choice: సేవించడానికి
  rationale: దేవునికి అర్పించే సేవను, ఆరాధనతో కూడిన విధేయతను ఈ పదం సూచించగలదు. ‘సేవించడానికి’ దాని విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: αὐτῷ
  choice: ఆయనను
  rationale: ముందటి సందర్భంలో దేవునిని సూచిస్తుంది. తెలుగులో ‘సేవించు’తో ‘ఆయనను’ సహజమైన కర్మరూపం.
theological_decisions:
- issue: దేవునికి సంబంధించిన λατρεύειν పదపు భావపరిధి
  choice: ఆయనను సేవించడానికి
  alternative: ఆయనను ఆరాధించడానికి
  rationale: ఈ పదం దేవునికి చేసే ఆరాధనాత్మక సేవను సూచిస్తుంది. కేవలం ఆచారపరమైన ఆరాధనకే భావాన్ని పరిమితం చేయకుండా, భక్తి మరియు విధేయత రెండింటినీ నిలుపుకోవడానికి ‘సేవించడానికి’ ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని ‘చేతి’ నుడికారాన్ని నిలిపి, అవసరమైన వివరణను పాదసూచికలో ఇచ్చాం. ἀφόβως‌ను సేవించే విధానంతో అనుసంధానించాం; ‘సేవ’ మరియు ‘ఆరాధన’ మధ్యనున్న భావపరిధిని సంకుచితం చేయలేదు.
