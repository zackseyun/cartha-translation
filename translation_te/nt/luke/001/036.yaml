id: LUK.1.36
reference: Luke 1:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ Ἐλισάβετ ἡ ⸀συγγενίς σου καὶ αὐτὴ ⸀συνείληφεν υἱὸν ἐν γήρει αὐτῆς, καὶ οὗτος μὴν ἕκτος ἐστὶν αὐτῇ τῇ καλουμένῃ στείρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/036.yaml
  text: And look, Elizabeth your relative has also conceived a son in her old age, and this is the sixth month for her who was called barren.
translation:
  language: te
  text: ఇదిగో, నీ బంధువైన ఎలీసబెతు కూడా తన వృద్ధాప్యంలో ఒక కుమారుణ్ణి గర్భం దాల్చింది. సంతానం కనలేనిదిగా పిలువబడిన ఆమెకు ఇప్పుడు ఆరవ నెల.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే గ్రీకు అవ్యయపు బలాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: συγγενίς
  choice: బంధువైన
  rationale: బంధుత్వం యొక్క ఖచ్చిత స్వరూపాన్ని మూలపాఠం నిర్దిష్టంగా చెప్పదు; అందువల్ల విస్తృతమైన ‘బంధువు’ పదాన్ని వాడాం.
- source_word: συνείληφεν υἱὸν
  choice: ఒక కుమారుణ్ణి గర్భం దాల్చింది
  rationale: గర్భధారణను మరియు శిశువు కుమారుడని తెలిపే మూలార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν γήρει αὐτῆς
  choice: తన వృద్ధాప్యంలో
  rationale: ఎలీసబెతు వృద్ధ వయస్సులో గర్భం దాల్చిందనే మూల భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: τῇ καλουμένῃ στείρᾳ
  choice: గొడ్రాలు అని పిలువబడిన ఆమెకు
  rationale: ‘అని పిలువబడిన’ అనే నిష్క్రియ రూపాన్ని కాపాడుతూ, సంతానం కనలేనిదిగా పేరుపొందిన స్థితిని సాంప్రదాయికమైన కానీ అర్థమయ్యే తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ఎలీసబెతుతో మరియ బంధుత్వం
  choice: బంధువు
  alternative: దగ్గరి బంధువు / అక్క
  rationale: συγγενίς బంధుత్వాన్ని మాత్రమే సూచిస్తుంది; దాని స్థాయి లేదా నిర్దిష్ట సంబంధాన్ని ఊహించి చేర్చలేదు.
- issue: ‘గొడ్రాలు’ అనే వర్ణన యొక్క కాలభావం
  choice: గొడ్రాలు అని పిలువబడిన
  alternative: గొడ్రాలైన
  rationale: మూలంలోని καλουμένῃ (‘పిలువబడిన’)ను నిలుపుతూ, గర్భధారణకు ముందు ఇతరులు ఆమెను అలా పిలిచారనే భావాన్ని అనవసరంగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించాం. వాక్యాన్ని తెలుగు పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించినా, మూలంలోని రెండు ప్రధాన ప్రకటనల సంబంధాన్ని యథాతథంగా ఉంచాం.
