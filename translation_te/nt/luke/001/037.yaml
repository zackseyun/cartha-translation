id: LUK.1.37
reference: Luke 1:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἀδυνατήσει παρὰ ⸂τοῦ θεοῦ⸃ πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/037.yaml
  text: For no word from God will be impossible[a].
translation:
  language: te
  text: ఎందుకంటే దేవుని నుండి వచ్చే ఏ మాటా అసాధ్యమవదు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే దేవునికి అసాధ్యమైనది ఏదీ లేదు.”
    reason: παρὰ τοῦ θεοῦను ‘దేవునితో/దేవుని వద్ద’ అనే భావంలో తీసుకొని, πᾶν ῥῆμαను ‘ఏదీ’గా వ్యక్తం చేసే వ్యాకరణపరంగా సాధ్యమైన సంప్రదాయ అనువాదం.
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఈ వాక్యం గబ్రియేలు ఇంతకుముందు చెప్పిన మాటకు కారణాన్ని తెలియజేస్తుంది; అందువల్ల ὅτι లోని వివరణాత్మక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐκ ἀδυνατήσει
  choice: అసాధ్యం కాబోదు
  rationale: ἀδυνατέω భవిష్యత్ రూపంలోని ‘అసాధ్యమవడం’ అనే భావాన్ని, కాలసూచనతో సహా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: παρὰ τοῦ θεοῦ
  choice: దేవుని నుండి వచ్చే
  rationale: జనిటివ్‌తో ఉన్న παρά ఇక్కడ మూలాన్ని సూచించగలదు. ῥῆμαతో కలిపి, దేవుని నుండి వచ్చే మాట అనే భావాన్ని ఇది స్పష్టంగా తెలియజేస్తుంది; ‘దేవునితో’ అనే మరో సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: πᾶν
  choice: ఏ ... మాటా
  rationale: నిషేధ క్రియతో కలిసిన πᾶν యొక్క సార్వత్రిక భావాన్ని తెలుగులో సహజంగా ‘ఏ మాటా ... కాదు’ అనే నిర్మాణం వ్యక్తం చేస్తుంది.
- source_word: ῥῆμα
  choice: మాట
  rationale: ῥῆμα అంటే పలికిన మాట, ప్రకటన లేదా విషయం. సందర్భంలో దేవుడు ప్రకటించిన మాటతో ఉన్న సంబంధాన్ని ‘మాట’ నిలుపుతుంది; ‘విషయం’ విస్తృతమైనది, ‘వాగ్దానం’ అవసరానికి మించిన వ్యాఖ్యానం.
theological_decisions:
- issue: παρὰ τοῦ θεοῦ πᾶν ῥῆμα అనే పదబంధం యొక్క భావం
  choice: దేవుని నుండి వచ్చే ఏ మాటా అసాధ్యం కాబోదు.
  alternative: దేవునికి అసాధ్యమైనది ఏదీ లేదు.
  rationale: రెండు అర్థాలూ వ్యాకరణపరంగా సమర్థించదగినవి. గ్రీకులో ῥῆμα స్పష్టంగా ఉన్నందున ప్రధాన పాఠంలో ‘మాట’ను నిలిపి, గబ్రియేలు ప్రకటించిన దేవుని మాటతో సందర్భ సంబంధాన్ని కాపాడాం. దేవుని సామర్థ్యంపై దృష్టి పెట్టే సంప్రదాయ అర్థాన్ని పాదసూచికలో ఇచ్చి అసలు వాక్యంలోని భావసంభావ్యతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘వచ్చే’ అనేది దేవుని మూలంగా కలిగిన మాటను సహజంగా తెలియజేస్తుంది; ‘కాబోదు’ గ్రీకు భవిష్యత్ క్రియను ప్రతిబింబిస్తుంది.
