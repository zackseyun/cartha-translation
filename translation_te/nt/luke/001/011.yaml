id: LUK.1.11
reference: Luke 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὤφθη δὲ αὐτῷ ἄγγελος κυρίου ἑστὼς ἐκ δεξιῶν τοῦ θυσιαστηρίου τοῦ θυμιάματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/011.yaml
  text: Then an angel of the Lord appeared to him, standing at the right side of the altar of incense.
translation:
  language: te
  text: అప్పుడు ధూపవేదికకు కుడివైపున నిలబడి ఉన్న ప్రభువు దూత అతనికి కనిపించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: కనిపించాడు
  rationale: ὁράω క్రియ యొక్క ఈ కర్మణి రూపం కథన సందర్భంలో ‘ప్రత్యక్షమయ్యాడు/కనిపించాడు’ అనే అకర్మక భావాన్ని ఇస్తుంది. ‘కనిపించాడు’ అనేది సహజమైన ఆధునిక తెలుగు; దూత అతని దృష్టికి వచ్చాడనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ δέ కథన పురోగతిని సూచిస్తుంది; వ్యతిరేకతను అతిగా చూపకుండా సంఘటనల క్రమాన్ని ‘అప్పుడు’ సహజంగా తెలియజేస్తుంది.
- source_word: αὐτῷ
  choice: అతనికి
  rationale: ὤφθηతో వచ్చిన చతుర్థీ విభక్తి ప్రత్యక్షతను చూసిన వ్యక్తిని సూచిస్తుంది; అందువల్ల ‘అతనికి కనిపించాడు’ సరైన సహజ నిర్మాణం.
- source_word: ἄγγελος
  choice: దూత
  rationale: ἄγγελος ప్రాథమికంగా ‘దూత’ అని అర్థం. ఆలయ దర్శన సందర్భం ఇతడు పరలోక దూత అని స్పష్టం చేస్తుంది; తెలుగు బైబిలు భాషలో ‘దూత’ సహజంగాను గౌరవప్రదంగాను ఉంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: ἄγγελος κυρίου అనే షష్ఠీ నిర్మాణాన్ని తెలుగులో సహజంగా ‘ప్రభువు దూత’ అని అందించవచ్చు.
- source_word: ἑστὼς
  choice: నిలబడి ఉన్న
  rationale: ἵστημι యొక్క పరిపూర్ణ కృదంతం దూత కనిపించినప్పుడు ఉన్న భంగిమను, స్థానాన్ని వివరిస్తుంది; ‘నిలబడి ఉన్న’ ఆ కొనసాగుతున్న స్థితిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐκ δεξιῶν
  choice: కుడివైపున
  rationale: ఈ జాతీయ ప్రయోగం కుడి పక్కన ఉన్న స్థానాన్ని సూచిస్తుంది; ‘కుడివైపున’ సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: θυσιαστηρίου
  choice: వేదిక
  rationale: θυσιαστήριον బలులు లేదా ధూపార్పణకు నియమించిన వేదికను సూచిస్తుంది. తరువాతి షష్ఠీ పదంతో కలిసి ‘ధూపవేదిక’ అనే సహజ సమాసం ఏర్పడుతుంది.
- source_word: τοῦ θυμιάματος
  choice: ధూపవేదిక
  rationale: θυμίαμα ఇక్కడ ధూపాన్ని సూచిస్తుంది; షష్ఠీ నిర్మాణం ఇది ధూపం అర్పించే వేదిక అని గుర్తిస్తుంది. తెలుగులో ‘ధూపవేదిక’ స్పష్టమైన, స్థిరమైన పదబంధం.
theological_decisions:
- issue: ἄγγελος κυρίουలో κύριος అనువాదం
  choice: ప్రభువు దూత
  alternative: ప్రభువుకు చెందిన దూత
  rationale: ‘ప్రభువు దూత’ మూలంలోని షష్ఠీ సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది. ఇది ఆ దూత స్వరూపం గురించి మూలం చెప్పనిదేదీ అదనంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని స్థానవివరణను స్పష్టంగా ఉంచుతూ, తెలుగు సహజ పదక్రమం కోసం ‘ధూపవేదికకు కుడివైపున నిలబడి ఉన్న’ అనే విశేషణ భాగాన్ని కర్తకు ముందు ఉంచాం.
