revisions:
- from: అప్పుడు మరియ దూతతో, “ఇది ఎలా జరుగుతుంది? నేను పురుషునితో లైంగిక సంబంధం ఎరుగను కదా?” అని అడిగింది.
  to: అయితే మరియ దూతతో ఇలా అంది, “ఇది ఎలా జరుగుతుంది? ఎందుకంటే నేను పురుషుణ్ణి ఎరుగను[a].”
  rationale: The revision restores εἶπεν as “అంది,” retains the Greek euphemism rather than inserting an explicit expression in the main text, and supplies a footnote for its idiomatic sexual sense. It also renders δέ as a mild discourse turn and preserves the causal force of ἐπεί with “ఎందుకంటే.”
