id: LUK.1.34
reference: Luke 1:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ Μαριὰμ πρὸς τὸν ἄγγελον· Πῶς ἔσται τοῦτο, ἐπεὶ ἄνδρα οὐ γινώσκω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/034.yaml
  text: But Mary said to the angel[a], “How will this be, since I have not known a man?”
translation:
  language: te
  text: అయితే మరియ దూతతో ఇలా అంది, “ఇది ఎలా జరుగుతుంది? ఎందుకంటే నేను పురుషుణ్ణి ఎరుగను[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పురుషుణ్ణి ఎరుగను.” ఇది పురుషునితో లైంగిక సంబంధాలు కలిగి ఉండడాన్ని సూచించే మర్యాదాపూర్వక నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ δὲ గబ్రియేలు ప్రకటన నుంచి మరియ ప్రతిస్పందనకు కథనాన్ని మళ్లిస్తుంది. తెలుగులో ‘అప్పుడు’ సహజంగా ఆ మార్పును చూపుతుంది; గ్రీకులో లేని బలమైన వ్యతిరేకతను ‘కాని’ ద్వారా చేర్చదు.
- source_word: Μαριὰμ
  choice: మరియ
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: πρὸς τὸν ἄγγελον
  choice: దూతతో
  rationale: సందర్భంలో ἄγγελος పరలోక దూతను సూచిస్తుంది. ‘దూతతో’ అనేది εἶπεν ... πρὸς అనే సంభాషణ నిర్మాణాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: Πῶς ἔσται τοῦτο
  choice: ఇది ఎలా జరుగుతుంది?
  rationale: ἔσται అక్షరార్థంగా ‘అవుతుంది’; ప్రకటించిన గర్భధారణ ఎలా సంభవిస్తుందనే ప్రశ్నను ఆధునిక తెలుగులో ‘ఎలా జరుగుతుంది?’ సహజంగా తెలియజేస్తుంది.
- source_word: ἐπεὶ
  choice: కదా
  rationale: మరియ ప్రశ్నకు ఆధారమైన పరిస్థితిని తెలుగులో వాక్యాంత ‘కదా’ సహజంగా సూచిస్తుంది; కఠినమైన ‘ఎందుకంటే’ నిర్మాణాన్ని నివారిస్తుంది.
- source_word: ἄνδρα οὐ γινώσκω
  choice: నేను పురుషునితో లైంగిక సంబంధం ఎరుగను
  rationale: γινώσκω + ἄνδρα ఇక్కడ లైంగిక సంబంధానికి మర్యాదాపూర్వక గ్రీకు నుడికారం. ‘ఎరుగను’ మూలంలోని ‘తెలుసుకోవడం’ భావప్రతిధ్వనిని కొంత నిలుపుతుంది; ‘లైంగిక సంబంధం’ ఆధునిక పాఠకునికి ఉద్దేశిత అర్థాన్ని స్పష్టం చేస్తుంది. ἄνδρα ను ‘భర్త’గా కుదించకుండా ‘పురుషునితో’గా ఇచ్చింది.
theological_decisions:
- issue: మరియ మాట మరియు యేసు కన్యాగర్భధారణ
  choice: ‘నేను పురుషునితో లైంగిక సంబంధం ఎరుగను’ అని అనువదించడం
  alternative: ‘నేను పురుషుణ్ణి ఎరుగను’ లేదా ‘నేను కన్యను’
  rationale: గ్రీకు వాక్యం లైంగిక అనుభవం లేకపోవడాన్ని మర్యాదాపూర్వక నుడికారంతో తెలియజేస్తుంది. ఎంపిక చేసిన రూపం ఆ భావాన్ని స్పష్టం చేస్తుంది, కానీ మూలంలో లేని ‘నేను కన్యను’ అనే నామవాచక ప్రకటనను నేరుగా చేర్చదు; ‘భర్త’ అని కూడా సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకునికి స్పష్టమైన శైలి. గ్రీకు లైంగిక నుడికారాన్ని తెలుగులో కేవలం ‘పురుషుణ్ణి ఎరుగను’గా ఉంచితే సాధారణ పాఠకుడు అక్షరార్థంగా అపార్థం చేసుకునే అవకాశం ఉన్నందున, ప్రధాన పాఠ్యంలోనే మర్యాదగా స్పష్టం చేయబడింది.
