review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the announced event and the sexual sense of ἄνδρα οὐ γινώσκω. However, it changes εἶπεν (“said”) to “asked,” and its explicit wording “లైంగిక సంబంధం” replaces the Greek’s modest idiom rather than retaining it with clarification.
  naturalness: “మరియ దూతతో ... అని అడిగింది” is understandable, but “దూతతో ఇలా అంది” is more natural and precisely represents the speech verb. “పురుషుణ్ణి ఎరుగను” is a recognized elevated Telugu biblical idiom; a footnote makes its intended sense clear for modern readers.
  terminology: “మరియ” and “దూత” are appropriate standard Telugu biblical forms. Retaining “ఎరుగను” preserves the source idiom and suitable reverent register without adding the more explicit phrase “లైంగిక సంబంధం” to the main text.
  issues:
  - severity: medium
    issue: The main verb is rendered as “అడిగింది” (“asked”).
    rationale: The Greek εἶπεν means “said.” Though Mary’s words are a question, the narrative explicitly says that she spoke to the angel; “అంది” preserves this distinction.
  - severity: low
    issue: The draft expands the euphemism into “పురుషునితో లైంగిక సంబంధం.”
    rationale: This conveys the contextual meaning but does not preserve the Greek’s modest expression “know a man.” Telugu can retain the idiom in the text and explain it in a footnote.
  - severity: low
    issue: “అప్పుడు” is more strongly temporal than δέ requires.
    rationale: δέ here marks a responsive narrative turn. “అయితే” reflects that turn without adding a specific temporal sequence.
  revised_text: అయితే మరియ దూతతో ఇలా అంది, “ఇది ఎలా జరుగుతుంది? ఎందుకంటే నేను పురుషుణ్ణి ఎరుగను[a].”
