id: LUK.20.5
reference: Luke 20:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ συνελογίσαντο πρὸς ἑαυτοὺς λέγοντες ὅτι Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/005.yaml
  text: But they reasoned among themselves[a], saying, “If we say, ‘From heaven,’ he will say[b], ‘Why did you not believe him?’”
translation:
  language: te
  text: 'అయితే వారు తమలో తాము ఇలా ఆలోచించుకున్నారు: “మనం ‘పరలోకం నుండి’ అని చెబితే, ‘మీరు అతణ్ణి ఎందుకు నమ్మలేదు[a]?’ అని ఆయన అంటాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీరు అతణ్ణి ఎందుకు విశ్వసించలేదు?’
    reason: πιστεύω అనే గ్రీకు క్రియ సందర్భానుసారం ‘నమ్మడం’ లేదా ‘విశ్వసించడం’ అనే భావాలను ఇవ్వగలదు.
lexical_decisions:
- source_word: συνελογίσαντο πρὸς ἑαυτοὺς
  choice: తమలో తాము ఇలా ఆలోచించుకున్నారు
  rationale: సమూహంగా తమ మధ్య తాము తర్కించి ఒక సమాధానాన్ని పరిశీలించిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; కేవలం సంభాషించారనే అర్థానికి పరిమితం చేయదు.
- source_word: Ἐξ οὐρανοῦ
  choice: పరలోకం నుండి
  rationale: దైవిక మూలం లేదా అధికారాన్ని సూచించే గ్రీకు నుడికారాన్ని ‘దేవుని నుండి’ అని విప్పి చెప్పకుండా యథాతథంగా నిలుపుతుంది.
- source_word: ἐρεῖ
  choice: అని ఆయన అంటాడు
  rationale: తరువాత ప్రశ్న వచ్చినప్పటికీ గ్రీకు క్రియ సాధారణంగా ‘చెబుతాడు/అంటాడు’ అని అర్థం; ‘అడుగుతాడు’ అని ప్రత్యేకీకరించకుండా మూలపాఠాన్ని అనుసరిస్తుంది.
- source_word: ἐπιστεύσατε αὐτῷ
  choice: అతణ్ణి నమ్మలేదు
  rationale: దత్తి విభక్తితో ఉన్న πιστεύω ఇక్కడ యోహాను చెప్పిన మాటను నిజమని స్వీకరించడం లేదా అతణ్ణి విశ్వసించడం అనే భావాన్ని ఇస్తుంది; ‘అతనిలో విశ్వాసముంచడం’ అనే మరింత బలమైన నిర్మాణాన్ని అనవసరంగా సూచించదు.
theological_decisions:
- issue: యోహాను బాప్తిస్మానికి మూలం లేదా అధికారం ‘పరలోకం నుండి’ అని చెప్పడంలోని భావం
  choice: పరలోకం నుండి
  alternative: దేవుని నుండి
  rationale: ఈ నుడికారం దైవిక అధికారాన్ని సూచించినా, మూలపాఠం ‘పరలోకం’ అనే పదాన్నే ఉపయోగిస్తుంది. దానిని నిలుపుకోవడం ద్వారా అంతర్లీన theological భావాన్ని పాఠకుడే సందర్భం నుంచి గ్రహించేలా చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘తమలో తాము’ సమూహ అంతర్గత deliberation‌ను, ‘అంటాడు’ గ్రీకు λέγω యొక్క సాధారణ భావాన్ని నిలుపుతాయి.
