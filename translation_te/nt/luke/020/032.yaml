translation_notes:
  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. మూలంలోని సంక్షిప్త కథనశైలి, సమయక్రమం, ‘కూడా’ అనే సమానతాభావం నిలుపబడ్డాయి.
