lexical_decisions:
- source_word: ὕστερον
  choice: తర్వాత
  rationale: కథన క్రమంలో తరువాతి సమయాన్ని సూచించే క్రియావిశేషణం. ‘తర్వాత’ ఆధునిక తెలుగులో సహజంగా ఉండి, సమయక్రమాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: καὶ
  choice: కూడా
  rationale: ముందటి సందర్భంలో సహోదరులు చనిపోయినట్లే ఆ స్త్రీ సైతం చనిపోయిందనే భావాన్ని ఇక్కడ καί తెలియజేస్తుంది; అందువల్ల ‘కూడా’ సహజమైన, సందర్భోచితమైన అనువాదం.
- source_word: ἡ γυνή
  choice: ఆ స్త్రీ
  rationale: γυνήకి ‘స్త్రీ’ లేదా ‘భార్య’ అనే అర్థాలు ఉండవచ్చు. అనేక సహోదరులతో వరుసగా వివాహబంధంలో ఉన్న వ్యక్తిని సూచిస్తున్నందున, ఒక ప్రత్యేక భర్తతో బంధాన్ని సూచించే ‘భార్య’ కంటే ‘ఆ స్త్రీ’ స్పష్టంగా ఉంటుంది.
- source_word: ἀπέθανεν
  choice: చనిపోయింది
  rationale: ἀποθνῄσκω అనే క్రియ యొక్క భూతకాల సంఘటనను సూటిగా తెలియజేస్తుంది. ‘చనిపోయింది’ గ్రీకు వాక్యంలోని సరళమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో కాపాడుతుంది.
