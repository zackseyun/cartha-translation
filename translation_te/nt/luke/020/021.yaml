id: LUK.20.21
reference: Luke 20:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ὀρθῶς λέγεις καὶ διδάσκεις καὶ οὐ λαμβάνεις πρόσωπον, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/021.yaml
  text: And they questioned him[a], saying, “Teacher, we know that you speak and teach rightly, and you do not show partiality[b], but truly teach the way of God.”
translation:
  language: te
  text: 'వారు ఆయనను ప్రశ్నిస్తూ ఇలా అన్నారు: “బోధకుడా, నీవు సరిగ్గా మాట్లాడి బోధిస్తావనీ, ఎవరి పక్షమూ వహించవనీ,[a] కాని సత్యానుసారంగా[b] దేవుని మార్గాన్ని బోధిస్తావనీ మాకు తెలుసు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ముఖాన్ని స్వీకరించవు”; అంటే వ్యక్తుల హోదా లేదా బాహ్యరూపాన్ని బట్టి మొగ్గుచూపవు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నిజంగా దేవుని మార్గాన్ని బోధిస్తావు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: ప్రశ్నిస్తూ
  rationale: ఈ క్రియ అడగడం లేదా ప్రశ్నించడం అనే భావాన్ని ఇస్తుంది. సందర్భంలో పరీక్షించాలనే ఉద్దేశం ఉన్నప్పటికీ, దానిని అనవసరంగా తీవ్రతరం చేయకుండా ‘ప్రశ్నిస్తూ’ సహజంగా ఉంది.
- source_word: Διδάσκαλε
  choice: బోధకుడా
  rationale: సంబోధన రూపంలోని διδάσκαλος‌కు ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: οἴδαμεν
  choice: మాకు తెలుసు
  rationale: వక్తలు నిశ్చయంగా తెలిసినట్లు చెప్పే భావాన్ని నేరుగా నిలుపుతుంది; అది పొగడ్తగా చెప్పబడిందనే సందర్భార్థాన్ని వచనంలో కలపదు.
- source_word: ὀρθῶς
  choice: సరిగ్గా
  rationale: మాట్లాడడం, బోధించడం రెండింటికీ సహజంగా వర్తిస్తూ, సత్యసంధత మరియు సరైనతకు సంబంధించిన మూలభావాన్ని అందిస్తుంది.
- source_word: λέγεις καὶ διδάσκεις
  choice: మాట్లాడి బోధిస్తావు
  rationale: గ్రీకులోని రెండు సమన్వయ క్రియలను కుదించకుండా నిలుపుతూ తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐ λαμβάνεις πρόσωπον
  choice: పక్షపాతం చూపవు
  rationale: అక్షరార్థంగా ‘ముఖాన్ని స్వీకరించవు’ అనే నుడికారం వ్యక్తి హోదా లేదా బాహ్యరూపాన్ని బట్టి మొగ్గుచూపకపోవడాన్ని సూచిస్తుంది. ‘పక్షపాతం చూపవు’ దాని అర్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἐπ’ ἀληθείας
  choice: సత్యానుసారంగా
  rationale: బోధించే విధానం సత్యానికి అనుగుణంగా ఉందనే భావాన్ని వ్యక్తం చేస్తుంది. ఇది ‘నిజంగా’ అని కేవలం ఉద్ఘాటనగా అర్థమయ్యే అవకాశాన్ని తగ్గిస్తుంది.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: దేవుని మార్గం
  rationale: మూలంలోని నిర్దిష్ట భావాన్ని, దేవుని చిత్తం లేదా ఆయన నిర్దేశించిన జీవనమార్గం అనే ధార్మిక ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: ἀλλ’
  choice: అంతర్నిహిత విరుద్ధ సంబంధం
  rationale: తెలుగు వాక్య నిర్మాణంలో ‘పక్షపాతం చూపవనీ, సత్యానుసారంగా…’ అనే సమన్వయం విరుద్ధ భావాన్ని సహజంగా తెలియజేస్తుంది; ‘కాని’ చేర్చడం ఇక్కడ భారంగా అనిపించవచ్చు.
theological_decisions:
- issue: పక్షపాతరాహిత్యాన్ని తెలిపే నుడికారం
  choice: οὐ λαμβάνεις πρόσωπον ను ‘పక్షపాతం చూపవు’గా అనువదించడం
  alternative: ‘ముఖాన్ని స్వీకరించవు’; ‘బాహ్యరూపాన్ని బట్టి ప్రభావితం కావు’
  rationale: ఈ నుడికారం సామాజిక హోదా లేదా బాహ్యరూపాన్ని బట్టి మొగ్గుచూపకపోవడాన్ని సూచిస్తుంది. అక్షరార్థ రూపం ఆధునిక తెలుగు పాఠకులకు అస్పష్టంగా ఉంటుంది; భావానువాదం యేసు పక్షపాతరహితుడనే నైతిక-దైవశాస్త్రీయ అంశాన్ని స్పష్టంగా ఉంచుతుంది.
- issue: ἐπ’ ἀληθείας యొక్క అన్వయం
  choice: ‘సత్యానుసారంగా’ అనేది బోధించే విధానాన్ని సూచించేలా ఉంచడం
  alternative: ‘నిజంగా దేవుని మార్గాన్ని బోధిస్తావు’
  rationale: గ్రీకు పదబంధం బోధన సత్యానికి అనుగుణంగా ఉండడాన్ని లేదా నిజంగా బోధించడాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో మొదటి భావాన్ని సహజంగా ఇచ్చి, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. మూలంలోని పొగడ్త స్వరాన్ని నిలిపి, అది కపటమని ఈ వచనంలోనే వివరణగా చేర్చలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
