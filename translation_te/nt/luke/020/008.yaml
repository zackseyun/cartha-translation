id: LUK.20.8
reference: Luke 20:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/008.yaml
  text: And Jesus said to them[a], “Neither will I tell you by what authority I do these things.”
translation:
  language: te
  text: 'యేసు వారితో ఇలా అన్నాడు: “నేనూ ఏ అధికారంతో ఈ పనులు చేస్తున్నానో మీకు చెప్పను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: అప్పుడు యేసు వారితో ... అన్నాడు
  rationale: తెలుగు కథన శైలిలో సహజమైన పదక్రమాన్ని ఉపయోగిస్తూ, καί యొక్క సందర్భానుసార కొనసాగింపును ‘అప్పుడు’తో వ్యక్తం చేస్తుంది; αὐτοῖςను ‘వారితో’గా నిలుపుతుంది.
- source_word: Οὐδὲ ἐγὼ
  choice: నేను కూడా ... చెప్పను
  rationale: మునుపటి వచనంలో వారు జవాబు చెప్పనందుకు ప్రతిస్పందనగా ఉన్న οὐδέ యొక్క అనుసంధాన భావాన్ని తెలుగులో ‘కూడా ... చెప్పను’ సహజంగా తెలియజేస్తుంది.
- source_word: λέγω ὑμῖν
  choice: మీకు చెప్పను
  rationale: ఇక్కడ λέγω అనేది సమాచారాన్ని వెల్లడించడం అనే భావంలో ఉంది; అందువల్ల ‘మీకు చెప్పను’ సహజమైన, సందర్భోచితమైన అనువాదం.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: ఏ అధికారంతో
  rationale: ἐν + దత్తివ విభక్తి ఇక్కడ యేసు కార్యాలకు ఆధారమైన లేదా వాటిని చేయడానికి గల అధికారాన్ని సూచిస్తుంది; ‘ఏ అధికారంతో’ తెలుగు వాడుకలో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: ἐξουσίᾳ
  choice: అధికారంతో
  rationale: ἐξουσία ఇక్కడ కేవలం శక్తిని కాక, కార్యాలు చేయడానికి గల హక్కు లేదా అధికారాన్ని సూచిస్తుంది.
- source_word: ταῦτα ποιῶ
  choice: ఈ పనులు చేస్తున్నానో
  rationale: ταῦτα యొక్క బహువచనాన్ని ‘ఈ పనులు’ నిలుపుతుంది; ποιῶ యొక్క వర్తమాన కార్యభావాన్ని సందర్భానికి సహజంగా ‘చేస్తున్నానో’ తెలియజేస్తుంది.
theological_decisions:
- issue: యేసు నాయకులకు జవాబు చెప్పడానికి నిరాకరించడం
  choice: తన అధికార మూలాన్ని వారికి వెల్లడించనని నేరుగా చెప్పినట్లుగా అనువదించడం
  alternative: యేసు ప్రశ్నను తప్పించుకున్నాడని లేదా వారి అవిశ్వాసంపై తీర్పు ప్రకటించాడని అనువాదంలోనే సూచించడం
  rationale: గ్రీకు వాక్యం యేసు వారికి చెప్పనని మాత్రమే స్పష్టంగా పేర్కొంటుంది. నిరాకరణకు సంబంధించిన నైతిక లేదా సిద్ధాంతపరమైన వివరణను వచనంలో చేర్చకుండా దాని వాక్చాతుర్య ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథన శైలిలో రూపొందించబడింది. ఈ తెలుగు రూపంలో ‘ఏ అధికారంతో’ సహజమైన ప్రధాన పఠనం కావడంతో ప్రత్యేక ప్రత్యామ్నాయ పాదటిప్పణి అవసరం లేదు.
