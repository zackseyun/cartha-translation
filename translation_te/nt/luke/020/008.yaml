revisions:
- from: అప్పుడు యేసు వారితో, “నేను కూడా ఏ అధికారంతో ఈ పనులు చేస్తున్నానో మీకు చెప్పను” అన్నాడు.
  to: 'యేసు వారితో ఇలా అన్నాడు: “నేనూ ఏ అధికారంతో ఈ పనులు చేస్తున్నానో మీకు చెప్పను.”'
  rationale: The revision removes an unnecessary sequential interpretation of καί, improves the idiomatic rendering of the responsive negation Οὐδὲ ἐγώ, and retains the source’s ambiguity about the precise basis of authority without adding explanation.
  reviewer_model: gpt-5.6-terra
