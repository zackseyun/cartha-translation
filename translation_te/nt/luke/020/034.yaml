source:
  edition: SBLGNT
  text: ⸀Καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Οἱ υἱοὶ τοῦ αἰῶνος τούτου γαμοῦσιν καὶ ⸀γαμίσκονται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/034.yaml
  text: And Jesus said to them[a], “The sons of this age marry and are given in marriage,”
translation:
  language: te
  text: 'యేసు వారితో ఇలా అన్నాడు: “ఈ యుగానికి చెందినవారు[a] పెళ్లి చేసుకుంటారు, పెళ్లికి ఇవ్వబడతారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా అక్షరార్థంగా, “ఈ యుగపు కుమారులు.” గ్రీకులో ఇది ప్రస్తుత యుగానికి చెందినవారందరినీ సూచించే పుంలింగ బహువచన ప్రతినిధి ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: యేసు వారితో ఇలా అన్నాడు
  rationale: గ్రీకు వాక్యంలోని సాధారణ కథన అనుసంధానాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ, εἶπεν అనే క్రియకు ‘అన్నాడు’ అని నేరుగా అనువదించాం; సందర్భాన్ని బట్టి ‘జవాబిచ్చాడు’ అని అదనపు భావాన్ని చేర్చలేదు.
- source_word: Οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: ఈ యుగపు కుమారులు
  rationale: υἱοὶ అనే పురుష బహువచన రూపాన్ని నిలిపి ఉంచుతూ, అది ఈ ప్రస్తుత యుగానికి చెందినవారిని సూచించే ప్రతినిధి ప్రయోగమని పాదసూచికలో స్పష్టం చేశాం. αἰών భౌతిక ప్రపంచాన్ని కాక ప్రస్తుత యుగవ్యవస్థను సూచిస్తున్నందున ‘యుగం’ అని అనువదించాం.
- source_word: γαμοῦσιν
  choice: పెళ్లి చేసుకుంటారు
  rationale: వివాహం చేసుకోవడాన్ని తెలిపే క్రియకు ఆధునిక తెలుగులో సహజమైన సమానార్థక ప్రయోగం.
- source_word: γαμίσκονται
  choice: పెళ్లికి ఇవ్వబడతారు
  rationale: గ్రీకులోని కర్మణి రూపాన్ని నిలిపి, ముందున్న కర్తరి క్రియతో ఉన్న భేదాన్ని కాపాడాం.
theological_decisions:
- issue: సాధారణ సమూహాన్ని సూచించే లింగవాచక ప్రయోగం
  choice: ఈ యుగపు కుమారులు
  alternative: ఈ యుగపు ప్రజలు / ఈ యుగానికి చెందినవారు
  rationale: మూలంలోని υἱοὶ అనే పురుష బహువచన రూపాన్నీ, ‘ఈ యుగానికి చెందినవారు’ అనే దాని ప్రతినిధి భావాన్నీ రెండింటినీ కాపాడేందుకు మూల రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి వివరణను పాదసూచికలో ఇచ్చాం.
- issue: αἰών అనే పదంలోని అంత్యకాల సంబంధిత యుగభావం
  choice: ఈ యుగం
  alternative: ఈ లోకం
  rationale: తరువాతి వచనాల్లో వచ్చే రాబోయే యుగంతో వ్యత్యాసాన్ని స్పష్టంగా నిలిపేందుకు ‘లోకం’ కంటే ‘యుగం’ మరింత ఖచ్చితమైనది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘పెళ్లి చేసుకుంటారు / పెళ్లికి ఇవ్వబడతారు’ అనే జంట ప్రయోగంతో గ్రీకు కర్తరి–కర్మణి భేదాన్ని నిలిపాం.
