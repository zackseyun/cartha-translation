source:
  edition: SBLGNT
  text: ἰδόντες δὲ αὐτὸν οἱ γεωργοὶ διελογίζοντο πρὸς ⸀ἀλλήλους λέγοντες· Οὗτός ἐστιν ὁ κληρονόμος· ⸀ἀποκτείνωμεν αὐτόν, ἵνα ἡμῶν γένηται ἡ κληρονομία·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/014.yaml
  text: But when the vine-growers saw him[a], they reasoned with one another, saying, ‘This is the heir. Let us kill him, so that the inheritance may become ours.’
translation:
  language: te
  text: 'అయితే ద్రాక్షతోటను సాగుచేసేవారు[a] అతణ్ణి చూసి, ఒకరితో ఒకరు ఇలా ఆలోచించుకున్నారు: ‘ఇతడే వారసుడు. వారసత్వం మనదయ్యేలా ఇతణ్ణి చంపేద్దాం.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రైతులు” లేదా “కౌలుదారులు.” గ్రీకు పదం వ్యవసాయ పని చేసేవారిని సూచిస్తుంది; ఈ ఉపమానంలో వారు ప్రత్యేకంగా ద్రాక్షతోటను సాగుచేసేవారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: ద్రాక్షతోటను సాగుచేసేవారు
  rationale: γεωργοί అనే పదం వ్యవసాయ పనివారిని సూచిస్తుంది; ఈ ఉపమాన సందర్భంలో వారు ద్రాక్షతోటను సాగుచేస్తున్నారు. కౌలుదారులు అనే న్యాయపరమైన భావాన్ని పదంలోకి నేరుగా చేర్చకుండా, సందర్భంలోని వ్యవసాయ ప్రత్యేకతను నిలుపుతుంది.
- source_word: διελογίζοντο
  choice: ఆలోచించుకుంటూ
  rationale: అసంపూర్ణ భూతకాల రూపం వారి మధ్య కొనసాగిన లెక్కగట్టే ఆలోచనను సూచిస్తుంది. ‘వాదించుకున్నారు’ అనడం లేని ఘర్షణను చేర్చుతుంది; ‘చర్చించుకున్నారు’ కంటే ఈ ఎంపిక deliberative భావాన్ని సహజంగా అందిస్తుంది.
- source_word: πρὸς ἀλλήλους
  choice: ఒకరితో ఒకరు
  rationale: పరస్పర చర్యను తెలిపే గ్రీకు నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: κληρονόμος
  choice: వారసుడు
  rationale: న్యాయపరమైన, కథనపరమైన రెండు భావాలకూ సరిపోయే సాధారణ తెలుగు సమానార్థకం.
- source_word: ἀποκτείνωμεν
  choice: చంపేద్దాం
  rationale: మొదటి పురుష బహువచన ప్రోత్సాహక subjunctive బలాన్ని ప్రత్యక్షంగా, సహజంగా అందిస్తుంది; ‘హత్య చేద్దాం’ అనడం క్రియలో నేరుగా లేని నైతిక తీర్పును పదస్థాయిలో చేర్చుతుంది.
- source_word: ἵνα ἡμῶν γένηται ἡ κληρονομία
  choice: అప్పుడు వారసత్వం మనదవుతుంది
  rationale: ἵνα తెలిపే ఉద్దేశ్య-ఫలిత సంబంధాన్నీ, γένηται లోని ‘మనదిగా అవడం’ అనే భావాన్నీ సహజ తెలుగులో నిలుపుతుంది. వారి ఉద్దేశించిన ఫలితంగా పలికిన మాట కావడంతో తెలుగు సంభాషణలో ‘అప్పుడు’ సరళంగా పనిచేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: కథన పురోగతిలోని స్వల్ప వ్యత్యాసాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: ἰδόντες
  choice: చూసి
  rationale: Aorist participle తెలిపే ముందస్తు చర్యను సంక్షిప్తమైన కాలసంబంధ నిర్మాణంతో అందిస్తుంది.
theological_decisions:
- issue: ద్రాక్షతోట సందర్భంలో γεωργοὶ పదానికి అనువాదం
  choice: ద్రాక్షతోటను సాగుచేసేవారు
  alternative: కౌలుదారులు; రైతులు; సాగుదారులు
  rationale: మూలపదం ప్రధానంగా వ్యవసాయ పని చేసేవారిని సూచిస్తుంది. చుట్టుపక్కల కథనం వారు కౌలుకు పనిచేసేవారని సూచించినా, ఆ న్యాయపరమైన పాత్ర ఈ నామవాచకంలోనే స్పష్టంగా లేదు. అందువల్ల ద్రాక్షతోట సందర్భాన్ని నిలుపుతూ, అదనపు న్యాయార్థాన్ని ప్రధాన పాఠ్యంలోకి దిగుమతి చేయలేదు.
- issue: ἵνα వాక్యంలో ఉద్దేశ్యం మరియు ఆశించిన ఫలితం
  choice: అప్పుడు వారసత్వం మనదవుతుంది
  alternative: వారసత్వం మనదయ్యేలా; వారసత్వం మనదవడానికి
  rationale: మాట్లాడేవారి దుష్ట ఉద్దేశాన్ని వారి దృష్టికోణంలో సహజంగా వ్యక్తపరుస్తుంది; అది నిజంగా నెరవేరుతుందని కథకుడు ధృవీకరిస్తున్నట్టు అర్థం కాకుండా సందర్భం నియంత్రిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. ‘అతణ్ణి/ఇతణ్ణి’ రూపాలు సంభాషణ ప్రవాహానికి అనుకూలం. ప్రధాన పాఠ్యంలో [a] గుర్తు సంబంధిత పదబంధం వెంట ఉంచబడింది.
