  terminology: “నీతిమంతులమని నటించే” δίκαιος యొక్క నైతిక-మతపరమైన ఛాయను సరియైన విధంగా కాపాడుతుంది. “గూఢచారులు” ἐγκαθέτουςకు అనుకూలం. ἀρχή మరియు ἐξουσίαను “పరిపాలనకూ అధికారానికీ”గా వేరువేరుగా ఉంచడం సమర్థనీయమే. “అధిపతి” స్థానంలో “గవర్నరు” వాడడం రోమా ప్రాంతీయ అధికారిని మరింత స్పష్టంగా సూచిస్తుంది.
