  to: వారు ఆయనను జాగ్రత్తగా గమనించి, తాము నీతిమంతులమని నటించే గూఢచారులను పంపారు. వారు ఆయన మాటలో ఏదైనా పట్టుకొని[a], ఆ విధంగా ఆయనను గవర్నరు పరిపాలనకూ అధికారానికీ అప్పగించడానికి ఇలా చేశారు.[b]
