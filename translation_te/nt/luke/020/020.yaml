id: LUK.20.20
reference: Luke 20:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ παρατηρήσαντες ἀπέστειλαν ἐγκαθέτους ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι, ἵνα ἐπιλάβωνται αὐτοῦ λόγου, ⸀ὥστε παραδοῦναι αὐτὸν τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ τοῦ ἡγεμόνος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/020.yaml
  text: And after watching him closely[a], they sent spies who pretended to be righteous, so that they might catch him in something he said[b], and thus hand him over to the rule and authority of the governor.
translation:
  language: te
  text: వారు ఆయనను జాగ్రత్తగా గమనించి, తాము నీతిమంతులమని నటించే గూఢచారులను పంపారు. వారు ఆయన మాటలో ఏదైనా పట్టుకొని[a], ఆ విధంగా ఆయనను గవర్నరు పరిపాలనకూ అధికారానికీ అప్పగించడానికి ఇలా చేశారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ఆయన మాటను పట్టుకొని” లేదా “ఆయన పలికిన మాటను ఆధారంగా చేసుకొని.”
    reason: lexical_alternative
  - marker: b
    text: “ఆయనను గవర్నరు యొక్క పాలనా అధికారానికీ అధికార పరిధికీ అప్పగించడానికి” అని కూడా అనువదించవచ్చు. జంటగా ఉన్న ఈ పదాలు గవర్నరు అధికారిక న్యాయపరిధినీ పాలనా శక్తినీ నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρατηρήσαντες
  choice: ఆయనను జాగ్రత్తగా గమనించి
  rationale: ఈ భూతకాల అసమాపక క్రియ ప్రధాన క్రియకు ముందున్న చర్యను సూచిస్తుంది; సందర్భంలోని శత్రుత్వపూర్వక నిఘా భావాన్ని ‘జాగ్రత్తగా గమనించి’ సహజంగా తెలియజేస్తుంది.
- source_word: ἐγκαθέτους
  choice: గూఢచారులను
  rationale: ఉచ్చులో పట్టుకోవడానికి రహస్యంగా నియమించిన వ్యక్తులను సూచించే పదం; ఆధునిక తెలుగులో ‘గూఢచారులు’ సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι
  choice: తాము నీతిమంతులమని నటించే
  rationale: వారి మోసపూరిత స్వప్రదర్శనను తెలుపుతూ, δίκαιος లోని నైతిక-మతపరమైన భావాన్ని ‘నీతిమంతులు’ నిలుపుతుంది.
- source_word: ἵνα ἐπιλάβωνται αὐτοῦ λόγου
  choice: ఆయన మాటలోనే ఆయనను పట్టుకొని
  rationale: గ్రీకు పదబంధంలోని ‘మాటను పట్టుకోవడం’ అనే రూపకాన్ని నిలుపుతూ, ఆయన పలికిన మాట ఆధారంగా ఆయనను చిక్కులో పెట్టాలనే న్యాయపరమైన ఉద్దేశాన్ని సూచిస్తుంది.
- source_word: ὥστε
  choice: ఆ విధంగా
  rationale: మాటలో పట్టుకోవడం ద్వారా కలగాలని వారు ఉద్దేశించిన తదుపరి ఫలితాన్ని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: παραδοῦναι
  choice: అప్పగించాలని
  rationale: న్యాయపరమైన, శత్రుత్వపూర్వక సందర్భంలో ఒకరిని అధికారుల చేతికి అప్పగించడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τῇ ἀρχῇ
  choice: పరిపాలనకు
  rationale: ఇక్కడ ἀρχή ‘ఆరంభం’ కాకుండా పాలనా వ్యవస్థ లేదా అధికార పరిధిని సూచిస్తుంది; తరువాతి ἐξουσίαతో ఉన్న భేదాన్ని కొంతవరకు నిలుపుతుంది.
- source_word: τῇ ἐξουσίᾳ
  choice: అధికారానికి
  rationale: అధికారాన్ని వినియోగించే హక్కు లేదా శక్తిని సూచించే సహజమైన తెలుగు సమానం.
- source_word: τοῦ ἡγεμόνος
  choice: అధిపతి
  rationale: రోమా ప్రాంతీయ పాలకుడిని సూచించే పదం; ‘అధిపతి’ గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే సమానం.
theological_decisions:
- issue: నటించిన నైతిక-మతపరమైన స్థితిలో δίκαιος అనువాదం
  choice: నీతిమంతులు
  alternative: న్యాయవంతులు / మంచివారు
  rationale: ‘నీతిమంతులు’ అనే పదం కేవలం సామాజిక నిజాయితీకి పరిమితం కాకుండా మూలపదంలోని నైతిక-మతపరమైన బరువును నిలుపుతుంది; వారు నిజంగా అలాంటివారని వచనం చెప్పకుండా, నటనను స్పష్టంగా ఉంచుతుంది.
- issue: ἀρχή మరియు ἐξουσία అనే జంట పదాల సంబంధం
  choice: పరిపాలనకూ అధికారానికీ
  alternative: అధికార పరిధికీ అధికారానికీ / పాలక అధికారానికి
  rationale: రెండు పదాలను ఒకే భావంగా కలపకుండా పాలనా వ్యవస్థ మరియు అధికార వినియోగం అనే సన్నిహితమైన కానీ వేరైన కోణాలను నిలుపుతుంది; ఈ జంట అధికారిక న్యాయాధికారాన్ని బలపరుస్తుందనే అవకాశాన్ని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘మాటలోనే పట్టుకొని’ మూలంలోని రూపకాన్ని నిలుపుతుంది; ‘పరిపాలనకూ అధికారానికీ’ గ్రీకు జంట పదాలను కృత్రిమంగా కలపకుండా వాటి మధ్య ఉన్న సూక్ష్మ భేదాన్ని కాపాడుతుంది. పాదసూచిక గుర్తులు [a], [b] ప్రధాన పాఠ్యంలో రెండూ ఉన్నాయి.
