  text: Then some of the scribes answered[a], “Teacher, you have spoken well.”
translation:
  language: te
  text: అప్పుడు శాస్త్రులలో కొందరు, “బోధకా, నీవు బాగా చెప్పావు[a]” అని జవాబిచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు సరిగానే చెప్పావు,” లేదా “నీవు సరిగా మాట్లాడావు.”
    reason: καλῶς అనే పదం ‘బాగా’ అనే విస్తృత ప్రశంసతో పాటు ‘సరిగ్గా’ లేదా ‘సముచితంగా’ అనే భావాన్నీ ఇవ్వగలదు.
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: జవాబిచ్చారు
  rationale: ἀποκρίνομαι యొక్క భూతకాల కృదంత రూపం మాటల ద్వారా ఇచ్చిన ప్రతిస్పందనను పరిచయం చేస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘అని జవాబిచ్చారు’ సహజంగా ఉండి ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: δέ
  choice: అప్పుడు
  rationale: δέ ఇక్కడ స్వల్పమైన కథన మార్పును సూచిస్తుంది. ముందున్న యేసు సమాధానం తర్వాత జరిగిన ప్రతిస్పందనకు ‘అప్పుడు’ సహజమైన అనుసంధానాన్ని ఇస్తుంది; బలమైన వ్యతిరేకతను చేర్చదు.
- source_word: τινες τῶν γραμματέων
  choice: శాస్త్రులలో కొందరు
  rationale: τινες తో కూడిన షష్ఠీ విభక్తి నిర్మాణం మొత్తం శాస్త్రులలో కొందరిని మాత్రమే సూచిస్తుంది. ‘శాస్త్రులలో కొందరు’ ఆ భాగార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: γραμματέων
  choice: శాస్త్రులు
  rationale: సువార్తల సందర్భంలో γραμματεῖς అనే పదానికి ‘శాస్త్రులు’ స్థిరమైన, సంక్షిప్తమైన తెలుగు సమానం; వివరణాత్మక విస్తరణ అవసరం లేదు.
- source_word: Διδάσκαλε
  choice: బోధకా
  rationale: διδάσκαλος సంబోధన రూపానికి ‘బోధకా’ నేరమైన, గౌరవప్రదమైన ఆధునిక తెలుగు అనువాదం.
- source_word: καλῶς
  choice: బాగా
  rationale: καλῶς మాట యొక్క నాణ్యతను లేదా సరియైనదనాన్ని ప్రశంసిస్తుంది. ‘బాగా’ దాని విస్తృత ప్రశంసార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: εἶπας
  choice: చెప్పావు
  rationale: గ్రీకు ఏఓరిస్ట్ ఇక్కడ యేసు ఇప్పుడే పలికిన మాటను సూచిస్తుంది. తెలుగు ప్రత్యక్ష సంభాషణలో ‘చెప్పావు’ సరళంగా, సహజంగా ఉంటుంది.
