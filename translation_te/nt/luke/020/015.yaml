  to: వారు అతన్ని ద్రాక్షతోట నుండి బయటికి తోసివేసి చంపారు. అయితే ద్రాక్షతోట యజమాని[a] వారికి ఏమి చేస్తాడు?
  rationale: ‘ద్రాక్షతోట నుండి బయటికి’ మూలంలోని లోపలి నుండి వెలుపలికి జరిగిన బహిష్కరణను స్పష్టంగా నిలుపుతుంది. ‘అయితే’ τί οὖν యొక్క ప్రశ్నలోని ‘అప్పుడు/అయితే’ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది. κύριος‌కు సందర్భానుగుణమైన ‘యజమాని’ను ఉంచి, ప్రత్యామ్నాయాలను పాదటిప్పణిలో నమోదు చేశాము.
