id: LUK.20.15
reference: Luke 20:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐκβαλόντες αὐτὸν ἔξω τοῦ ἀμπελῶνος ἀπέκτειναν. τί οὖν ποιήσει αὐτοῖς ὁ κύριος τοῦ ἀμπελῶνος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/015.yaml
  text: And after throwing him out of the vineyard[a], they killed him. What then will the owner of the vineyard do to them?
translation:
  language: te
  text: వారు అతన్ని ద్రాక్షతోట నుండి బయటికి తోసివేసి చంపారు. అయితే ద్రాక్షతోట యజమాని[a] వారికి ఏమి చేస్తాడు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ద్రాక్షతోట ప్రభువు’ లేదా ‘ద్రాక్షతోట అధిపతి.’ గ్రీకు పదం క్యూరియోస్ (κύριος) సాధారణంగా బిరుదుగా వచ్చినప్పుడు ‘ప్రభువు’ అని అనువదించబడుతుంది; అయితే ఇక్కడ ఉపమానంలోని ద్రాక్షతోట మానవ యజమానినే సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: బయటికి తోసివేసి
  rationale: అయోరిస్ట్ కృదంతం ప్రధాన క్రియకంటే ముందుగా జరిగిన చర్యను సూచిస్తుంది. ‘తోసివేసి’ బలవంతంగా వెళ్లగొట్టిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: ద్రాక్షతోట బయటికి
  rationale: ఈ పదబంధం తోట లోపలి నుండి బయటికి జరిగిన కదలికను సూచిస్తుంది; ‘బయటికి’ ఆ దిశను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀπέκτειναν
  choice: చంపారు
  rationale: క్రియ యొక్క ప్రత్యక్ష అర్థం ‘చంపడం.’ ‘హత్య చేశారు’ అనడం మూలపదంలో ప్రత్యక్షంగా లేని న్యాయపరమైన లేదా నైతిక ఛాయను మరింతగా జోడించవచ్చు.
- source_word: τί οὖν
  choice: కాబట్టి ... ఏమి
  rationale: οὖν యొక్క నిర్ధారణాత్మక భావాన్ని సహజమైన తెలుగు ప్రశ్నా నిర్మాణంలో ‘కాబట్టి’ తెలియజేస్తుంది.
- source_word: ποιήσει
  choice: ఏమి చేస్తాడు
  rationale: ποιέω ఇక్కడ ఆ యజమాని ప్రతిస్పందనగా తీసుకునే చర్యను విస్తృతంగా సూచిస్తుంది; ‘ఏమి చేస్తాడు’ స్పష్టమైన సహజ సమానార్థకం.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: దత్తివాచక బహువచనాన్ని తెలుగులో ‘వారికి’ సహజంగా వ్యక్తం చేస్తుంది; సందర్భంలో యజమాని ఆ కౌలుదారుల విషయంలో ఏమి చేస్తాడనే భావం ఉంది.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: ద్రాక్షతోట యజమాని
  rationale: κύριος కు ‘ప్రభువు’ లేదా ‘యజమాని’ అనే అర్థాలు ఉండగలవు. ఇక్కడ ఉపమానంలోని ద్రాక్షతోటకు చెందిన మానవ యజమానిని సూచిస్తున్నందున ‘యజమాని’ సందర్భోచితంగా, అపార్థం లేకుండా ఉంటుంది.
theological_decisions:
- issue: ఉపమానంలో మానవ వ్యక్తిని సూచించే κύριος అనువాదం
  choice: యజమాని
  alternative: ప్రభువు / అధిపతి
  rationale: ఈ సందర్భంలో κύριος దైవిక బిరుదుగా కాకుండా ద్రాక్షతోట సొంతదారుని సూచిస్తుంది. అందువల్ల ‘యజమాని’ తక్షణ కథా సందర్భాన్ని స్పష్టంగా అందిస్తుంది; ఉపమానం యొక్క విస్తృత దైవశాస్త్రీయ సూచనను పదంలోనే బలవంతంగా చొప్పించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని చర్యల క్రమం—బయటికి తోసివేయడం, ఆపై చంపడం—తెలుగు సంయుక్త క్రియా నిర్మాణంతో నిలుపబడింది.
