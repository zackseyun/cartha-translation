id: LUK.20.10
reference: Luke 20:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀καὶ καιρῷ ἀπέστειλεν πρὸς τοὺς γεωργοὺς δοῦλον, ἵνα ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος ⸀δώσουσιν αὐτῷ· οἱ δὲ γεωργοὶ ⸂ἐξαπέστειλαν αὐτὸν δείραντες⸃ κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/010.yaml
  text: And at the proper time he sent a servant to the vine-growers[a], so that they would give him some of the fruit of the vineyard[b]. But the vine-growers sent him away empty after beating him.
translation:
  language: te
  text: తగిన సమయానికి అతడు ద్రాక్షతోటను సాగుచేసేవారి దగ్గరకు ఒక దాసుణ్ణి[a] పంపాడు; వారు ద్రాక్షతోట పంటలో కొంత అతనికి ఇవ్వాలనే ఉద్దేశంతో. అయితే ఆ ద్రాక్షతోటను సాగుచేసేవారు అతణ్ణి కొట్టి, ఖాళీ చేతులతో[b] పంపివేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దాసుడు’ అనే పదానికి బదులుగా ‘సేవకుడు’ అని కూడా అనువదించవచ్చు; గ్రీకు పదం δοῦλος రెండువిధాలుగా వాడబడగలిగినా, ఇక్కడ ‘దాసుడు’ యజమానికి బద్ధుడైన స్థితిని మరింత స్పష్టంగా చూపిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, ‘ఖాళీగా’; అంటే ద్రాక్షతోట పంటలో ఏమీ అతనికి ఇవ్వకుండా.
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρῷ
  choice: తగిన సమయానికి
  rationale: దత్తివ విభక్తిలోని καιρός తగిన లేదా నిర్ణీత సమయాన్ని సూచిస్తుంది; మూలంలో స్పష్టంగా లేని ‘కోతకాలం’ అనే భావాన్ని జోడించదు.
- source_word: γεωργούς
  choice: ద్రాక్షతోట కాపులు
  rationale: γεωργοί వ్యవసాయం చేసేవారిని సూచిస్తుంది; ἀμπελών సందర్భంలో ఈ పదబంధం ద్రాక్షతోటను సాగుచేసి చూసుకునేవారిని సహజంగా తెలియజేస్తుంది, కానీ వారి చట్టపరమైన కౌలుదారు హోదాను అనవసరంగా నిర్ధారించదు.
- source_word: δοῦλον
  choice: దాసుణ్ణి
  rationale: δοῦλος ఇక్కడ స్వతంత్ర పనివాడిని కాక యజమానికి బద్ధుడైన వ్యక్తిని సూచిస్తుంది; ‘దాసుడు’ ఆ సామాజిక స్థితిని పారదర్శకంగా నిలుపుతుంది.
- source_word: ἵνα ... δώσουσιν αὐτῷ
  choice: వారు తనకు ఇవ్వాలని
  rationale: ἵναతో కూడిన భవిష్యత్ సూచక క్రియ పంపడంలోని ఉద్దేశాన్ని వ్యక్తం చేస్తుంది; తెలుగు వాక్యంలో ‘ఇవ్వాలని’ సహజంగా ఆ ప్రయోజనాన్ని అందిస్తుంది.
- source_word: ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος
  choice: ద్రాక్షతోట పంటలో కొంత
  rationale: ἀπό + షష్ఠీ విభక్తి పంటలో ఒక భాగాన్ని సూచిస్తుంది; నిర్దిష్ట కౌలు వాటా అనే భావాన్ని జోడించకుండా భాగార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: ἐξαπέστειλαν
  choice: పంపివేశారు
  rationale: ἐξαποστέλλωలోని బయటకు లేదా దూరంగా పంపే భావాన్ని ‘పంపివేశారు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δείραντες
  choice: కొట్టి
  rationale: δέρω కొట్టడం లేదా దెబ్బలు తీయడాన్ని సూచిస్తుంది; ‘కొట్టి’ ప్రత్యేకమైన శిక్షా విధానాన్ని అనవసరంగా సూచించదు.
- source_word: κενόν
  choice: వట్టి చేతులతో
  rationale: κενός అక్షరార్థంగా ‘ఖాళీగా’; ఇక్కడ ఏ పంటా పొందకుండా తిరిగి పంపబడిన భావాన్ని సహజ తెలుగు నుడికారంతో తెలియజేస్తుంది.
