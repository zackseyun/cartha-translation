translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘కాపులు’ వారి పనిని తెలియజేస్తుంది గాని ‘కౌలుదారులు’ అనే చట్టపరమైన హోదాను మూలపదానికి మించి చేర్చదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
