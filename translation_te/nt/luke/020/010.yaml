- from: తగిన సమయానికి అతడు ద్రాక్షతోట కాపులకు ఒక దాసుణ్ణి[a] పంపాడు. ద్రాక్షతోట పంటలో కొంత వారు తనకు ఇవ్వాలని అతడు అలా చేశాడు. అయితే ఆ ద్రాక్షతోట కాపులు అతణ్ణి కొట్టి, వట్టి చేతులతో[b] పంపివేశారు.
