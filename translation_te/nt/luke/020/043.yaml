id: LUK.20.43
reference: Luke 20:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/043.yaml
  text: until I make your enemies a footstool for your feet[a].
translation:
  language: te
  text: నేను నీ శత్రువులను నీ పాదాలకు పాదపీఠంగా చేసేంతవరకు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “నేను నీ శత్రువులను నీ పాదాల పాదపీఠంగా ఉంచేంతవరకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἂν
  choice: చేసేంతవరకు
  rationale: భవిష్యత్తులో జరిగే కార్యం వరకు కొనసాగే కాలపరిమితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: θῶ
  choice: చేసే
  rationale: τίθημι ప్రాథమికంగా ‘పెట్టు/ఉంచు’ అని అర్థమిచ్చినా, పాదపీఠం అనే రూపకంతో ఫలితార్థకంగా ‘చేయు’ అనడం తెలుగులో సహజంగా ఉంటుంది.
- source_word: τοὺς ἐχθρούς σου
  choice: నీ శత్రువులను
  rationale: కర్మ విభక్తి మరియు ఏకవచన స్వామ్యసూచకాన్ని నేరుగా, ఎలాంటి భావమృదుత్వం లేకుండా వ్యక్తపరుస్తుంది.
- source_word: ὑποπόδιον
  choice: పాదపీఠంగా
  rationale: మూలంలోని రాజసంబంధమైన రూపకాన్ని నిలుపుతూ, తెలుగులో ప్రామాణికంగా అర్థమయ్యే పదాన్ని ఉపయోగిస్తుంది.
- source_word: τῶν ποδῶν σου
  choice: నీ పాదాలకు
  rationale: అక్షరార్థంగా ‘నీ పాదాల యొక్క’ అయినా, ‘పాదపీఠం’తో సహజ తెలుగు ప్రయోగం ‘నీ పాదాలకు’; ఇది ‘నీ పాదాల కింద’ అని రూపకాన్ని వివరణాత్మకంగా విస్తరించదు.
theological_decisions:
- issue: కీర్తన 110:1లోని శత్రువుల అణచివేత రూపకం
  choice: ‘నీ శత్రువులను నీ పాదాలకు పాదపీఠంగా చేసేంతవరకు’ అనే రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: ‘నీ శత్రువులను నీ పాదాల కింద ఉంచేంతవరకు’
  rationale: శత్రువుల సంపూర్ణ ఓటమి లేదా ఆధిపత్యం అని విడమరచకుండా, మూలంలోని రాజసంబంధమైన మెస్సీయ రూపకాన్నీ దాని క్రీస్తుసంబంధమైన బలాన్నీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘పాదపీఠం’ అనే బైబిలు రూపకాన్ని వివరణాత్మకంగా మార్చకుండా నిలిపింది; ప్రధాన వాక్యం మునుపటి వాక్యంపై ఆధారపడే ఉద్ధరణ భాగమనే మూల నిర్మాణాన్ని కాపాడింది.
