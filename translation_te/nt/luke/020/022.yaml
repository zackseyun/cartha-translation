  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔξεστιν ⸀ἡμᾶς Καίσαρι φόρον δοῦναι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/022.yaml
  text: Is it lawful for us to pay taxes to Caesar[a], or not?
translation:
  language: te
  text: కైసరుకు పన్ను[a] చెల్లించడం మనకు ధర్మసమ్మతమేనా, కాదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కప్పం.” గ్రీకు పదం పాలక అధికారానికి చెల్లించే పన్నును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστιν
  choice: ధర్మసమ్మతమేనా
  rationale: ఇక్కడ ప్రశ్న కేవలం సాధ్యాసాధ్యాల గురించి కాక, మతపరంగా లేదా చట్టపరంగా అనుమతించదగినదా అన్నది. ‘ధర్మసమ్మతం’ ఆ అనుమతి భావాన్ని తెలియజేస్తూ, ఏ ధర్మశాస్త్రం లేదా చట్టం ఉద్దేశించబడిందో నిర్ధారించదు.
- source_word: ἡμᾶς
  choice: మనకు
  rationale: అనంతక్రియతో కూడిన గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగులో ‘మనకు ... చెల్లించడం’గా ఇచ్చాం; మూలంలో లేని ‘యూదులమైన మనకు’ అనే వివరణను చేర్చలేదు.
- source_word: Καίσαρι
  choice: కైసరుకు
  rationale: రోమా పాలకుని చారిత్రక బిరుదును, రాజకీయ సందర్భాన్ని నిలుపుకోవడానికి సాధారణీకరించిన ‘చక్రవర్తికి’ బదులు ‘కైసరుకు’ అని ఇచ్చాం.
- source_word: φόρον
  choice: పన్ను
  rationale: ఈ పదం పాలక అధికారానికి చెల్లించే పన్ను లేదా కప్పాన్ని సూచిస్తుంది. ప్రధాన వాక్యంలో సహజమైన ఆధునిక తెలుగు కోసం ‘పన్ను’ వాడి, రాజకీయ అధీనతను సూచించే ‘కప్పం’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: δοῦναι
  choice: చెల్లించడం
  rationale: δίδωμι అక్షరార్థంగా ‘ఇవ్వడం’ అయినా, పన్ను సందర్భంలో తెలుగులో ‘చెల్లించడం’ సహజమైనది మరియు ఉద్దేశిత క్రియను ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: ἢ οὔ
  choice: కాదా
  rationale: వికల్ప ప్రశ్న ముగింపును సహజమైన తెలుగు ప్రశ్నారూపంలో తెలిపే ప్రయోగం.
theological_decisions:
- issue: ‘ἔξεστιν’లో ఉద్దేశించిన ప్రమాణం
  choice: ‘ధర్మసమ్మతమేనా’ అని అనువదించి, ఇది రోమా చట్టానికా దేవుని ధర్మశాస్త్రానికా సంబంధించిన ప్రశ్నో నిర్ధారించకుండా ఉంచాం.
  alternative: ‘రోమా చట్టం ప్రకారం చెల్లవచ్చా?’ లేదా ‘దేవుని ధర్మశాస్త్రం ప్రకారం సమ్మతమేనా?’
  rationale: గ్రీకు మూలం అనుమతి లేదా సమ్మతి యొక్క ప్రమాణాన్ని స్పష్టంగా చెప్పదు. సందర్భంలోని మతపరమైన, రాజకీయ ఉత్కంఠను అనువాదం పరిష్కరించకుండా నిలుపుకోవాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రశ్నారూపం. ‘ధర్మసమ్మతం’ మతపరమైన మరియు చట్టపరమైన అనుమతి మధ్య మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది; ‘కైసరు’ చారిత్రక ప్రత్యేకతను కాపాడుతుంది.
