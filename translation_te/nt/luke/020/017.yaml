    reason: మూలభాషలోని నిర్మాణ రూపకం పునాది మూలరాయిని సూచిస్తుందా, భవనం పైభాగంలోని ముగింపు రాయిని సూచిస్తుందా అనేది నిశ్చితం కాదు.
  revision_rationale: The speech verb is corrected from ‘asked’ to ‘said,’ faithfully reflecting εἶπεν. The added intensity in ‘నిశితంగా’ is removed. The architectural metaphor and its ambiguity remain in the main text and footnote without imposing an interpretive identification.
