  to: అయితే ఆయన వారివైపు చూసి, “అలాగైతే, ‘ఇల్లు కట్టేవారు తిరస్కరించిన రాయి—అదే మూలకు తలరాయి అయింది’ అని రాయబడిన ఈ మాట ఏమిటి?” అని అన్నాడు.
