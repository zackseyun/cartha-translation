id: LUK.20.17
reference: Luke 20:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἐμβλέψας αὐτοῖς εἶπεν· Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/017.yaml
  text: 'But he looked at them and said[a], “What then is this that has been written: ‘The stone that the builders rejected, this one has become the head of the corner’?”'
translation:
  language: te
  text: అయితే ఆయన వారివైపు చూసి, “అలాగైతే, ‘ఇల్లు కట్టేవారు తిరస్కరించిన రాయి—అదే మూలకు తలరాయి అయింది’ అని రాయబడిన ఈ మాట ఏమిటి?” అని అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: వారివైపు నిశితంగా చూసి
  rationale: వారిపై ఉద్దేశపూర్వకంగా, సూటిగా చూపు నిలిపిన భావాన్ని తెలియజేస్తుంది; అతిశయమైన తీవ్రతను చేర్చదు.
- source_word: Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο
  choice: అలాగైతే, … అని రాయబడిన ఈ మాట ఏమిటి?
  rationale: οὖν యొక్క తార్కిక అనుసంధానాన్ని, γεγραμμένον యొక్క లిఖితంగా స్థిరపడిన భావాన్ని, ప్రశ్నలోని వాక్చాతుర్యాన్ని కాపాడుతుంది; ‘దీని అర్థమేమిటి?’ అని వ్యాఖ్యానాత్మకంగా మార్చదు.
- source_word: Λίθον
  choice: రాయి
  rationale: కీర్తన ఉల్లేఖనంలోని నిర్దిష్ట రాయిని సహజమైన తెలుగు పదంతో సూచిస్తుంది.
- source_word: ἀπεδοκίμασαν
  choice: తిరస్కరించిన
  rationale: పరిశీలించి పనికిరాదని తోసిపుచ్చిన భావాన్ని సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది.
- source_word: οἱ οἰκοδομοῦντες
  choice: ఇల్లు కట్టేవారు
  rationale: నామవాచకంగా వాడిన కృదంతాన్ని సాధారణ పాఠకులకు స్పష్టమైన సహజ తెలుగులో అందిస్తూ నిర్మాణ రూపకాన్ని నిలుపుతుంది.
- source_word: οὗτος
  choice: అదే
  rationale: గ్రీకు నిర్దేశక సర్వనామంలోని ఉద్ఘాటనను నిలుపుతుంది; వాక్యంలో నేరుగా క్రీస్తును సూచించే పురుష సర్వనామాన్ని దిగుమతి చేయదు.
- source_word: ἐγενήθη εἰς
  choice: అయింది
  rationale: ఒక కొత్త స్థానానికి లేదా పాత్రకు చేరిన ఫలిత భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κεφαλὴν γωνίας
  choice: మూలకు తలరాయి
  rationale: ‘మూలకు శిరస్సు’ అనే పదశః రూపాన్ని తెలుగు నిర్మాణ రూపకంగా అర్థమయ్యేలా ఉంచుతూ, అది పునాది మూలరాయా లేక పైభాగపు ముగింపు రాయా అన్న విషయాన్ని ప్రధాన పాఠ్యంలో పూర్తిగా నిర్ణయించదు.
theological_decisions:
- issue: కీర్తన 118:22 ఉల్లేఖనంలోని నిర్మాణ రూపకం
  choice: మూలకు తలరాయి
  alternative: మూలరాయి; పైభాగపు ముగింపు రాయి
  rationale: κεφαλὴ γωνίας అనే పదబంధంలోని ఖచ్చితమైన నిర్మాణ చిత్రం వివాదాస్పదం. ప్రధాన పాఠ్యం ‘తలరాయి’ అనే పారదర్శక రూపకాన్ని ఉంచి, సాధ్యమైన అర్థాలను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఉల్లేఖనంలోని కవితాత్మక నిర్మాణ రూపకాన్ని నిలుపుతూ, ప్రశ్నను అనవసరంగా వ్యాఖ్యానించలేదు.
