  text: Ἀκούοντος δὲ παντὸς τοῦ λαοῦ εἶπεν τοῖς ⸀μαθηταῖς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/045.yaml
  text: 'And while all the people were listening[a], he said to the disciples:'
translation:
  language: te
  text: 'ప్రజలందరూ వింటుండగా[a], ఆయన శిష్యులతో ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రజలందరూ వింటున్నప్పుడు, ఆయన శిష్యులతో ఇలా అన్నాడు.’ గ్రీకు వాక్యంలో ఆయన మాట్లాడిన సందర్భాన్ని సూచించడానికి genitive absolute నిర్మాణం వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούοντος
  choice: వింటుండగా
  rationale: ἀκούω వర్తమాన కృదంతంతో ఉన్న genitive absolute, ఆయన మాట్లాడిన సమయంలోనే ప్రజలు వింటూ ఉన్నారని సూచిస్తుంది. ‘వింటుండగా’ ఆ సమకాలీన, కొనసాగుతున్న చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: వాక్య నిర్మాణంలో ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప కథన అనుసంధానాన్ని సూచిస్తుంది. తెలుగు వాక్యంలోని ‘వింటుండగా ... అన్నాడు’ అనే నిర్మాణమే ఆ కొనసాగింపును సహజంగా అందిస్తుంది; ‘కానీ’ అని అనువదిస్తే లేని వ్యతిరేక భావం వస్తుంది.
- source_word: παντὸς τοῦ λαοῦ
  choice: ప్రజలందరూ
  rationale: ఏకవచన సమూహవాచకమైన λαός‌తో πᾶς ప్రజల సమూహమంతటినీ సూచిస్తుంది. ‘ప్రజలందరూ’ ఆధునిక తెలుగులో సహజంగా ఉండి, కేవలం గుంపు అనే భావానికి పరిమితం చేయదు.
- source_word: λαοῦ
  choice: ప్రజలు
  rationale: లూకా రచనలో λαός సాధారణంగా ప్రజలను, కొన్నిసార్లు సామూహిక లేదా నిబంధన సంబంధమైన అంతర్భావంతో, సూచిస్తుంది. ఈ సందర్భంలో ‘ప్రజలు’ ప్రత్యక్షమైన సరైన పదం.
- source_word: εἶπεν
  choice: అన్నాడు
  rationale: λέγω యొక్క aorist రూపానికి కథన తెలుగులో ‘అన్నాడు’ సహజమైన, సూటియైన సమానార్థకం.
- source_word: τοῖς μαθηταῖς
  choice: శిష్యులతో
  rationale: μαθηταίకి సువార్తల సందర్భంలో స్థిరమైన తెలుగు పదం ‘శిష్యులు’. గ్రీకులో ‘తన’ అనే స్వామ్యపదం స్పష్టంగా లేకపోవడంతో దానిని చేర్చలేదు. ‘శిష్యులతో ... అన్నాడు’ తెలుగులో సహజమైన ప్రయోగం.
theological_decisions:
- issue: ఈ సందర్భంలోని శ్రోతల మధ్య భేదం
  choice: ప్రజలందరూ వింటుండగా యేసు నేరుగా శిష్యులతో మాట్లాడాడు.
  alternative: యేసు ప్రజలందరినే నేరుగా ఉద్దేశించి మాట్లాడాడు; లేదా ప్రజలకు దూరంగా శిష్యులతో ఏకాంతంగా మాట్లాడాడు.
  rationale: ‘ప్రజలందరూ వింటుండగా’ అనే genitive absolute బహిరంగ సందర్భాన్ని తెలియజేస్తే, ‘శిష్యులతో’ అనే దత్తి ప్రయోగం నేరుగా సంబోధించబడినవారిని గుర్తిస్తుంది. అనువాదం ఈ రెండు అంశాలనూ కలిపివేయకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ప్రజలు’ మరియు ‘శిష్యులు’ సుపరిచితమైన బైబిలు పదాలుగా నిలుపబడ్డాయి; గ్రీకు మూలంలో లేని ‘తన’ అనే పదం చేర్చలేదు.
