id: LUK.20.24
reference: Luke 20:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Δείξατέ μοι δηνάριον· τίνος ἔχει εἰκόνα καὶ ἐπιγραφήν; ⸀ἀποκριθέντες δὲ εἶπαν· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/024.yaml
  text: Show me a denarius. Whose image and inscription does it have? And they answered[a], 'Caesar's.'
translation:
  language: te
  text: “నాకు ఒక దేనారాన్ని[a] చూపించండి. దానిపై ఎవరి రూపం, ఎవరి లేఖనం ఉన్నాయి?” వారు జవాబిచ్చారు, “కైసరువి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: దేనారం ఆ కాలంలో సాధారణంగా వాడిన రోమన్ నాణెం. చారిత్రక నేపథ్యాన్ని కాపాడేందుకు ఆ నాణెం పేరునే ఇక్కడ ఉంచాం.
    reason: cultural_note
lexical_decisions:
- source_word: Δείξατέ μοι
  choice: నాకు చూపించండి
  rationale: దείκνυμι క్రియలోని ప్రత్యక్ష ఆజ్ఞార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: δηνάριον
  choice: ఒక దేనారాన్ని
  rationale: చారిత్రక నాణెం పేరును లిప్యంతరీకరించడం ద్వారా మూలంలోని నిర్దిష్టతను కాపాడుతుంది; దానిని సాధారణంగా ‘నాణెం’ అని మార్చదు.
- source_word: τίνος ἔχει
  choice: దానిపై ఎవరి
  rationale: నాణెంపై కనిపించే రూపం, లేఖనానికి సంబంధించిన అనుబంధాన్ని తెలుగులో సహజమైన ప్రశ్నారూపంలో వ్యక్తం చేస్తుంది.
- source_word: εἰκόνα
  choice: రూపం
  rationale: నాణెంపై ఉన్న వ్యక్తి ప్రతిరూపాన్ని సూచించడానికి స్పష్టమైన, విస్తృతార్థాన్ని నిలిపే పదం.
- source_word: ἐπιγραφήν
  choice: పేరు చెక్కబడి
  rationale: నాణెంపై చెక్కిన లేఖనాన్ని సందర్భానుసారంగా సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; ఇక్కడ అది కైసరును గుర్తించే పేరుగా పనిచేస్తుంది.
- source_word: ἀποκριθέντες δὲ εἶπαν
  choice: వారు ... అని జవాబిచ్చారు
  rationale: గ్రీకు కృదంతం-క్రియా నిర్మాణాన్ని సహజమైన తెలుగు కథన వాక్యంగా అందిస్తుంది.
- source_word: Καίσαρος
  choice: కైసరువి
  rationale: గ్రీకులోని సంక్షిప్త షష్ఠీ విభక్తి జవాబును తెలుగులో కూడా సంక్షిప్తంగా, ముందున్న ‘రూపం’ మరియు ‘పేరు’ రెండింటికీ వర్తించేలా ఉంచుతుంది.
