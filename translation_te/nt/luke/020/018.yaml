id: LUK.20.18
reference: Luke 20:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πᾶς ὁ πεσὼν ἐπ’ ἐκεῖνον τὸν λίθον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ, λικμήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/018.yaml
  text: Everyone who falls on that stone will be broken to pieces[a], but the one on whom it falls[b], it will crush him.
translation:
  language: te
  text: ఆ రాయి మీద పడే ప్రతివాడూ ముక్కలైపోతాడు[a]; అయితే ఆ రాయి ఎవరి మీద పడితే, అతణ్ణి నలిపివేస్తుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చిత్తుచిత్తవుతాడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పొడిచేస్తుంది’ లేదా ‘ధాన్యపు పొట్టులవలె చెల్లాచెదరుగా చేస్తుంది’; గ్రీకు క్రియ కేవలం ఢీకొట్టడం కంటే బలమైన భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ πεσὼν
  choice: పడే ప్రతివాడూ
  rationale: నామవాచకార్థంలో వాడిన కృదంతం సాధారణంగా ప్రతి వ్యక్తినీ సూచిస్తుంది. ‘ప్రతివాడూ’ మూలంలోని సార్వత్రిక పరిధిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐπ’ ἐκεῖνον τὸν λίθον
  choice: ఆ రాయి మీద
  rationale: πίπτωతో కూడిన ἐπί + ద్వితీయా విభక్తి రాయి మీదికి పడే చలనాన్ని సూచిస్తుంది; ἐκεῖνονలోని నిర్దేశక భావాన్ని ‘ఆ’ నిలుపుతుంది.
- source_word: συνθλασθήσεται
  choice: ముక్కలైపోతాడు
  rationale: భవిష్యత్ కర్మణి రూపం పగిలి ముక్కలయ్యే తీవ్రమైన ఫలితాన్ని సూచిస్తుంది. ఈ ఎంపిక ఆ తీవ్రతను స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: అయితే అది ఎవరి మీద పడుతుందో
  rationale: ἄνతో కూడిన అనిర్దిష్ట సంబంధ వాక్యం ‘ఎవరి మీద పడినా/ఎవరి మీద పడుతుందో’ అనే భావాన్ని ఇస్తుంది. ‘అది’ అనే కర్త సందర్భంలోని రాయిని స్పష్టంగా సూచిస్తుంది.
- source_word: λικμήσει
  choice: నలిపివేస్తుంది
  rationale: λικμάω నలిపి పొడిచేయడం లేదా తూర్పారబట్టి చెదరగొట్టడం వంటి బలమైన భావాన్ని కలిగి ఉంది. ప్రధాన పాఠంలో ‘నలిపివేస్తుంది’ సులభంగా అర్థమవుతూ తీర్పు తీవ్రతను నిలుపుతుంది; విస్తృత భావపరిధి పాదసూచికలో ఇవ్వబడింది.
- source_word: αὐτόν
  choice: అతణ్ణి
  rationale: పుంలింగ ఏకవచన సర్వనామం సాధారణార్థక ఏకవచన పూర్వపదాన్ని తిరిగి సూచిస్తుంది. ‘అతణ్ణి’ మూలంలోని వ్యాకరణ రూపాన్నీ ప్రతినిధి భావాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: రాయి ద్వారా వ్యక్తమయ్యే తీర్పు దృశ్యం
  choice: రాయిని వినాశకరమైన తీర్పును అమలు చేసే సాధనంగా చూపే తీవ్రమైన రూపకాన్ని యథాతథంగా నిలుపడం.
  alternative: దీనిని కేవలం తొట్రుపాటు లేదా స్వల్ప గాయంగా మృదువుగా అనువదించడం.
  rationale: ముందున్న ఉల్లేఖన సందర్భంలో రాయి నిర్ణాయక తీర్పును సూచిస్తుంది. συνθλασθήσεται, λικμήσει రెండూ తీవ్రమైన క్రియలు; కాబట్టి వాటి బలాన్ని తగ్గించకూడదు, అలాగే వచనం చెప్పేదానికంటే ఎక్కువ వ్యాఖ్యానాన్ని చేర్చకూడదు.
- issue: సాధారణార్థక పుంలింగ సూచన
  choice: రెండవ భాగంలో ‘అతణ్ణి’ వాడడం.
  alternative: లింగనిరపేక్ష బహువచనంగా మార్చడం లేదా ‘ఆ వ్యక్తిని’ అని మళ్లీ చెప్పడం.
  rationale: గ్రీకు మూలంలో సాధారణార్థంతో పుంలింగ ఏకవచన సర్వనామం ఉంది. ‘అతణ్ణి’ దాని వ్యాకరణ ఏకవచనాన్నీ ప్రతినిధి వినియోగాన్నీ నేరుగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ‘ముక్కలైపోతాడు’ మరియు ‘నలిపివేస్తుంది’ అనే పదాలు రెండు క్రియల మధ్యనున్న తీవ్రతను సాధ్యమైనంతవరకు వేరు చేస్తాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
