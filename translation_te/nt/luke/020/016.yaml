  terminology: ‘కౌలు రైతులు’ γεωργοίకి ఈ ఉపమాన సందర్భంలో సరైన, స్పష్టమైన పదం. ‘ద్రాక్షతోట’ మరియు ‘ఇతరులకు’ కూడా తగినవి. పాదసూచికలు పదప్రత్యామ్నాయాలను, బలమైన నిరాకరణ స్వరూపాన్ని సరిగ్గా వివరిస్తాయి మరియు గుర్తులు సరైన స్థానాల్లో ఉన్నాయి.
