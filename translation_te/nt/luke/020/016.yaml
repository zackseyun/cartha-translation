id: LUK.20.16
reference: Luke 20:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργοὺς τούτους, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις. ἀκούσαντες δὲ εἶπαν· Μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/016.yaml
  text: He will come and destroy these tenant farmers[a], and will give the vineyard to others.” But when they heard this, they said[b], “May it never be!”
translation:
  language: te
  text: అతడు వచ్చి ఈ కౌలు రైతులను[a] నాశనం చేసి, ద్రాక్షతోటను ఇతరులకు ఇస్తాడు.” ఇది విన్నప్పుడు వారు, “అలా ఎన్నటికీ జరగకూడదు!”[b] అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రైతులను,” “కౌలుదారులను.” గ్రీకు పదం ఇతరునికి చెందిన భూమిని సాగుచేసేవారిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అలా కాకూడదు!” లేదా “ఎంతమాత్రం కాదు!” గ్రీకు మాట బలమైన నిరాకరణను వ్యక్తం చేస్తుంది; అక్షరార్థంగా, “అది జరగకూడదు.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεύσεται
  choice: అతడు వచ్చి
  rationale: భవిష్యత్ క్రియ యొక్క భావాన్ని తరువాతి సమాపక క్రియలతో సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది; ‘తిరిగి’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: ἀπολέσει
  choice: నాశనం చేసి
  rationale: తీర్పు తీవ్రతను నిలుపుతూ, చంపడం లేదా పూర్తిగా పాడుచేయడం అనే సందర్భసాధ్య భావాలను ఒక్కదానికే పరిమితం చేయదు.
- source_word: γεωργοὺς
  choice: కౌలు రైతులను
  rationale: ఇతరునికి చెందిన భూమిని సాగుచేసే వారి సామాజిక పాత్రను ఆధునిక పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: τούτους
  choice: ఈ
  rationale: చర్చలో ఉన్న నిర్దిష్ట కౌలు రైతులను సూచించే గ్రీకు సమీపదర్శక సర్వనామ బలాన్ని నిలుపుతుంది.
- source_word: δώσει
  choice: ఇస్తాడు
  rationale: δίδωμι యొక్క సరళమైన అర్థాన్ని కాపాడుతుంది; ‘అప్పగిస్తాడు’ వంటి అదనపు నిర్వహణ భావాన్ని బలవంతంగా చేర్చదు.
- source_word: τὸν ἀμπελῶνα
  choice: ద్రాక్షతోటను
  rationale: ఉపమానంలోని చిత్రణను, పాత నిబంధన ప్రతిధ్వనిని నిలిపే సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: ἄλλοις
  choice: ఇతరులకు
  rationale: వారు ఎవరో గ్రీకు వాక్యం నిర్దిష్టం చేయనట్లే తెలుగులోనూ నిర్దిష్టం చేయదు.
- source_word: ἀκούσαντες
  choice: ఇది విన్నప్పుడు
  rationale: క్రియకు ముందున్న కాలసంబంధ క్రియావిశేషణ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Μὴ γένοιτο
  choice: అలా ఎన్నటికీ జరగకూడదు!
  rationale: గ్రీకు optative లోని తీవ్ర నిరాకరణను, దిగ్భ్రాంతితో కూడిన కోరికరూప స్పందనను తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: Μὴ γένοιτο అనే జనసమూహ స్పందన యొక్క బలం
  choice: అలా ఎన్నటికీ జరగకూడదు!
  alternative: అలా కాకూడదు! / ఎంతమాత్రం కాదు!
  rationale: ఇది కేవలం తార్కిక నిరాకరణ కాక, ప్రకటించిన తీర్పు జరగకూడదనే భావోద్వేగపూరిత ప్రతిస్పందన. కోరికరూపాన్ని నిలుపుతూ అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. అసలు గ్రీకు వాక్యంలోని తీర్పు తీవ్రత, ద్రాక్షతోట రూపకం, శ్రోతల దిగ్భ్రాంతితో కూడిన నిరాకరణ నిలుపబడ్డాయి.
