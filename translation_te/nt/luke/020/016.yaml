  source_fidelity: గ్రీకు భవిష్యత్ క్రియలు, ‘ఈ’ కౌలు రైతులు, ద్రాక్షతోటను ఇతరులకు ఇవ్వడం, మరియు Μὴ γένοιτο యొక్క దిగ్భ్రాంతితో కూడిన బలమైన నిరాకరణ—అన్నీ విశ్వసనీయంగా ప్రతిఫలించాయి. ‘నాశనం చేసి’ ἀπολέσει యొక్క విస్తృతమైన, సందర్భానుకూల తీవ్రతను కాపాడుతుంది; దానిని కేవలం ‘చంపి’ అని అనవసరంగా పరిమితం చేయదు.
