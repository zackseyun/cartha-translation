id: LUK.20.6
reference: Luke 20:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, ⸂ὁ λαὸς ἅπας⸃ καταλιθάσει ἡμᾶς, πεπεισμένος γάρ ἐστιν Ἰωάννην προφήτην εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/006.yaml
  text: But if we say, ‘From men,’ all the people will stone us, for they are convinced that John was a prophet.
translation:
  language: te
  text: “కాని మనం, ‘మనుషుల నుండి’ అని చెబితే, ప్రజలందరూ మనల్ని రాళ్లతో కొట్టి చంపుతారు; ఎందుకంటే యోహాను ప్రవక్త అని వారికి గట్టి నమ్మకం ఉంది.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: కాని మనం … అని చెబితే
  rationale: ἐὰνతో కూడిన aorist subjunctive ఒక సాధ్యమైన షరతును సూచిస్తుంది. సందర్భంలోని వ్యతిరేక భావాన్ని δέ కోసం ‘కాని’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: Ἐξ ἀνθρώπων
  choice: మనుషుల నుండి
  rationale: యోహాను బాప్తిస్మం లేదా అధికారానికి మూలం ఏమిటనే ముందటి ప్రశ్నను సూచించే సంక్షిప్త పదబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: ὁ λαὸς ἅπας
  choice: ప్రజలందరూ
  rationale: λαός యొక్క సమష్టి భావాన్నీ, ἅπας సూచించే సంపూర్ణతనూ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: καταλιθάσει
  choice: మనలను రాళ్లతో కొడతారు
  rationale: క్రియలోని రాళ్లతో కొట్టే భావాన్ని స్పష్టంగా తెలుపుతుంది; మూలంలో లేని ‘చంపేస్తారు’ అనే ఫలితాన్ని అదనంగా చేర్చదు.
- source_word: πεπεισμένος γάρ ἐστιν
  choice: ఎందుకంటే … వారు గట్టిగా నమ్ముతున్నారు
  rationale: ఏకవచన రూపం సమష్టిగా ఉన్న ప్రజలను సూచిస్తుంది. తెలుగులో ‘ప్రజలందరూ … వారు’ అనే బహువచన ప్రయోగం సహజం; perfect రూపంలోని స్థిరమైన నిశ్చయాన్ని ‘గట్టిగా నమ్ముతున్నారు’ తెలియజేస్తుంది.
- source_word: Ἰωάννην προφήτην εἶναι
  choice: యోహాను ప్రవక్త అని
  rationale: తెలుగు ‘అని’ నిర్మాణం εἶναι యొక్క కాలనిర్దేశం లేని infinitive భావాన్ని సహజంగా నిలుపుతుంది; ‘ఉన్నాడు’ లేదా ‘ఉండేవాడు’ అని అనవసరంగా కాలాన్ని నిర్ణయించదు.
theological_decisions:
- issue: యోహాను ప్రవక్త అనే ప్రజల నమ్మకానికి కాలసూచన
  choice: యోహాను ప్రవక్త అని
  alternative: యోహాను ప్రవక్తగా ఉండేవాడని / యోహాను ప్రవక్తగా ఉన్నాడని
  rationale: గ్రీకు εἶναι infinitive స్వయంగా కాలాన్ని నిర్దేశించదు. కాలాన్ని ప్రకటించకుండా ఉండే తెలుగు నిర్మాణం మూలంలోని నిజమైన అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని సంక్షిప్త ‘మనుషుల నుండి’ అనే జవాబును అలాగే ఉంచి, యోహాను ప్రవక్త అనే వాక్యంలో కాలసంబంధమైన అస్పష్టతను సహజమైన తెలుగు నిర్మాణంతో కాపాడింది.
