id: LUK.20.38
reference: Luke 20:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: θεὸς δὲ οὐκ ἔστιν νεκρῶν ἀλλὰ ζώντων, πάντες γὰρ αὐτῷ ζῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/038.yaml
  text: He is not God of the dead[a], but of the living, for all live to him.
translation:
  language: te
  text: ఆయన చనిపోయినవారి దేవుడు కాదు, సజీవుల దేవుడు; ఎందుకంటే అందరూ ఆయన దృష్టిలో సజీవులే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే అందరూ ఆయనకు జీవిస్తున్నారు.”
    reason: αὐτῷ ζῶσιν అనే గ్రీకు పదబంధంలోని సంప్రదాన విభక్తిని మరింత నేరుగా ప్రతిబింబించే ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: θεὸς
  choice: దేవుడు
  rationale: యూదుల ఏకదేవవాద సందర్భంలో నిర్దిష్టంగా దేవుణ్ణే సూచిస్తుంది; తెలుగులో సహజమైన సమానార్థకం ‘దేవుడు’.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది స్వల్ప సంధానాన్ని లేదా వ్యత్యాసాన్ని సూచిస్తుంది; οὐκ ... ἀλλὰ నిర్మాణంలోని ‘కాదు ...’ వ్యత్యాసం తెలుగులో భావాన్ని సహజంగా మోస్తుంది.
- source_word: νεκρῶν
  choice: చనిపోయినవారి
  rationale: నామవాచకార్థంలో వాడిన బహువచన విశేషణం; ‘చనిపోయినవారి దేవుడు’ అనే నిర్మాణం గ్రీకు షష్ఠీ విభక్తి సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ζώντων
  choice: జీవించేవారి
  rationale: నామవాచకార్థంలో వాడిన వర్తమాన కృదంతం; ‘చనిపోయినవారి’తో ఉన్న సంక్షిప్త వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: πάντες
  choice: అందరూ
  rationale: మూలంలోని విస్తృతతను నిలుపుతూ, పితరులకు మాత్రమే అని పాఠ్యంలో లేని పరిమితిని జోడించదు.
- source_word: αὐτῷ
  choice: ఆయనకు
  rationale: గ్రీకు సంప్రదాన విభక్తి యొక్క సంక్షిప్తమైన సంబంధార్థాన్ని నేరుగా నిలుపుతుంది; ‘ఆయన ఎదుట’ వంటి వివరణాత్మక అర్థాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా నిర్ణయించదు.
- source_word: ζῶσιν
  choice: జీవిస్తున్నారు
  rationale: వర్తమాన కర్తరి సూచక క్రియను నేరుగా, సహజంగా తెలుపుతుంది.
theological_decisions:
- issue: πάντες γὰρ αὐτῷ ζῶσιν లో αὐτῷ యొక్క భావం
  choice: ఎందుకంటే అందరూ ఆయనకు జీవిస్తున్నారు
  alternative: ఎందుకంటే అందరూ ఆయన ఎదుట సజీవులే
  rationale: ‘ఆయనకు’ అనే అనువాదం గ్రీకు సంప్రదాన విభక్తిలోని ఉద్దేశపూర్వక సంక్షిప్తతను, దేవునితో సంబంధంలో జీవించడం అనే భావాన్ని నిలుపుతుంది. ప్రత్యామ్నాయం దేవుని దృష్టిలో వారు సజీవులని స్పష్టం చేస్తుంది; అయితే ప్రధాన పాఠ్యంలో ఆ వ్యాఖ్యానాన్ని స్థిరపరచదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘చనిపోయినవారు—జీవించేవారు’ అనే మూల వ్యత్యాసాన్ని, చివరి వాక్యభాగంలోని భావసంక్షిప్తతను కాపాడింది.
