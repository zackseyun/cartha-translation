    text: లేదా, “ఎందుకంటే అందరూ ఆయనకు జీవిస్తున్నారు.”
    reason: αὐτῷ ζῶσιν అనే గ్రీకు పదబంధంలోని సంప్రదాన విభక్తిని మరింత నేరుగా ప్రతిబింబించే ప్రత్యామ్నాయ అనువాదం.
  revision_rationale: The revision makes the final clause natural in modern standard Telugu and avoids the misleading purposive implication of “ఆయనకు జీవిస్తున్నారు.” It retains the source’s contrast and causal force, and the anchored footnote preserves the Greek dative’s less explicit alternative sense without forcing it into the main text.
