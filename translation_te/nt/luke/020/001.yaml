id: LUK.20.1
reference: Luke 20:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ⸀ἡμερῶν διδάσκοντος αὐτοῦ τὸν λαὸν ἐν τῷ ἱερῷ καὶ εὐαγγελιζομένου ἐπέστησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ γραμματεῖς σὺν τοῖς πρεσβυτέροις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/001.yaml
  text: And it happened[a], on one of those days, while he was teaching the people in the temple and proclaiming the good news, that the chief priests and the scribes, together with the elders, came up to him[b],
translation:
  language: te
  text: 'ఆ రోజుల్లో ఒక రోజున ఇలా జరిగింది: ఆయన దేవాలయంలో[a] ప్రజలకు బోధిస్తూ శుభవార్త ప్రకటిస్తుండగా[b], ప్రధాన యాజకులు, శాస్త్రులు పెద్దలతో కలిసి ఆయన దగ్గరికి వచ్చారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “దేవాలయం” అనేది లోపలి పరిశుద్ధ స్థలాన్ని మాత్రమే కాక, మొత్తం దేవాలయ ప్రాంగణాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా, “సువార్త ప్రకటిస్తుండగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: ఇలా జరిగింది
  rationale: లూకా ఉపయోగించే కథన సంధిని నిలుపుతూ, ప్రాచీనంగా వినిపించని సహజమైన ఆధునిక తెలుగు ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  choice: ఆ రోజుల్లో ఒక రోజున
  rationale: కొనసాగుతున్న సంఘటనల క్రమంలోని నిర్దిష్టంగా చెప్పని ఒక రోజును సూచించే భాగార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: διδάσκοντος αὐτοῦ τὸν λαόν
  choice: ఆయన ప్రజలకు బోధిస్తూ
  rationale: జెనిటివ్ అబ్సల్యూట్‌ను ప్రధాన సంఘటనతో సమకాలికమైన చర్యగా చూపుతుంది; λαός‌ను గుంపు అని పరిమితం చేయకుండా ‘ప్రజలు’గా అనువదిస్తుంది.
- source_word: ἐν τῷ ἱερῷ
  choice: దేవాలయంలో
  rationale: ἱερόν దేవాలయ సముదాయాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన సంక్షిప్త పదాన్ని ఉంచి, దాని పరిధిని పాదసూచికలో స్పష్టం చేశాం.
- source_word: εὐαγγελιζομένου
  choice: శుభవార్త ప్రకటిస్తుండగా
  rationale: క్రియారూపంలోని ‘మంచి వార్తను తెలియజేయడం’ అనే భావాన్ని అందుబాటులో ఉండే భాషలో నిలుపుతుంది; తరువాతి సంఘసంబంధ సాంకేతిక అర్థాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: ἐπέστησαν
  choice: ఆయన దగ్గరికి వచ్చారు
  rationale: వారు యేసు వద్దకు నేరుగా రావడాన్ని సహజంగా తెలుపుతుంది; ‘ఎదిరించారు’ అని అనువదించి శత్రుత్వాన్ని మూలపాఠం కంటే బలంగా చేయదు.
- source_word: οἱ ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: ఇది అనేకమంది మహాయాజకులను కాక, ప్రధాన యాజక నాయకవర్గాన్ని సూచించే చారిత్రక బిరుదు.
- source_word: οἱ γραμματεῖς
  choice: శాస్త్రులు
  rationale: యూదులలోని ఈ చారిత్రక వర్గానికి తెలుగులో స్థిరపడిన సంక్షిప్త పదాన్ని ఉపయోగిస్తుంది.
- source_word: σὺν τοῖς πρεσβυτέροις
  choice: పెద్దలతో కలిసి
  rationale: σύν సూచించే సహవాసాన్ని, నాయకవర్గాలు కలసి రావడాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: εὐαγγελιζομένου అనే పదాన్ని కథన సందర్భంలో అనువదించడం
  choice: శుభవార్త ప్రకటిస్తుండగా
  alternative: సువార్త ప్రకటిస్తుండగా
  rationale: యేసు ప్రజలకు మంచి వార్తను ప్రకటిస్తున్న చర్యను స్పష్టంగా చెబుతుంది; తరువాతి కాలపు సంఘపరమైన సాంకేతిక పదజాలాన్ని తప్పనిసరిగా రుద్దదు. సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని దీర్ఘ వాక్య నిర్మాణాన్ని తెలుగులో స్పష్టత కోసం ద్విబిందువుతో క్రమబద్ధం చేశాం; నాయకవర్గాల చారిత్రక పేర్లను సంక్షిప్తంగా నిలిపాం.
