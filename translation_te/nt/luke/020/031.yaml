  text: And the third took her[a], and likewise all seven left no children and died.
translation:
  language: te
  text: మూడవవాడు ఆమెను పెళ్లి చేసుకున్నాడు. అలాగే ఆ ఏడుగురూ సంతానం లేకుండానే చనిపోయారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τρίτος
  choice: మూడవవాడు
  rationale: గ్రీకు పాఠంలో ‘సోదరుడు’ అని మళ్లీ చెప్పకుండా ‘మూడవవాడు’ అనే సందర్భసిద్ధమైన సంక్షిప్త ప్రయోగం ఉంది; తెలుగులోనూ ఇది సహజంగా అర్థమవుతుంది.
- source_word: ἔλαβεν αὐτήν
  choice: ఆమెను పెళ్లి చేసుకున్నాడు
  rationale: ఈ లేవిరేట్ వివాహ సందర్భంలో ‘ఆమెను తీసుకున్నాడు’ అనే గ్రీకు నుడికారం ఆమెను భార్యగా స్వీకరించడాన్ని సూచిస్తుంది. తెలుగులో అక్షరార్థ అనువాదం అసహజంగా లేదా అపార్థకంగా ఉండవచ్చు కాబట్టి సందర్భార్థాన్ని స్పష్టంగా ఇచ్చాం.
- source_word: ὡσαύτως δὲ καὶ
  choice: అలాగే
  rationale: మిగిలినవారికీ అదే పరిణామం సంభవించిందనే కొనసాగింపు మరియు సారూప్య భావాలను సహజంగా తెలియజేస్తుంది.
- source_word: οἱ ἑπτὰ
  choice: ఆ ఏడుగురూ
  rationale: నిర్దిష్టమైన ఏడుగురు సోదరుల సమూహమంతటినీ సూచించే భావాన్ని ‘ఆ ఏడుగురూ’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐ κατέλιπον τέκνα
  choice: పిల్లలను విడిచిపెట్టకుండా
  rationale: καταλείπω అనే క్రియలో మరణానంతరం పిల్లలను వెనుక విడిచి వెళ్లడం అనే భావం ఉంది; ‘పిల్లలు లేకుండానే’ కంటే ఈ అనువాదం మూలపాఠ నిర్మాణాన్ని, భావాన్ని దగ్గరగా నిలుపుతుంది.
- source_word: τέκνα
  choice: పిల్లలు
  rationale: సంతానం అనే సందర్భార్థాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలిపే సహజ పదం.
- source_word: ἀπέθανον
  choice: చనిపోయారు
  rationale: మూలంలోని సూటి మరణార్థాన్ని మృదూకరించకుండా సాధారణ, స్పష్టమైన తెలుగులో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు నుడికారాన్ని అక్షరార్థంగా ‘ఆమెను తీసుకున్నాడు’ అని కాకుండా సందర్భానికి తగిన సహజమైన ‘ఆమెను పెళ్లి చేసుకున్నాడు’ అని ఇచ్చినందున పాదసూచిక అవసరం లేదు.
