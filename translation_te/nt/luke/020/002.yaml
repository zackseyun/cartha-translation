  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃· Εἰπὸν ἡμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς, ἢ τίς ἐστιν ὁ δούς σοι τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/002.yaml
  text: And they said to him, “Tell us, by what authority are you doing these things? Or who is the one who gave you this authority?”
translation:
  language: te
  text: వారు ఆయనతో, “నీవు ఏ అధికారంతో ఇవి చేస్తున్నావు? లేదా ఈ అధికారాన్ని నీకు ఇచ్చినవాడు ఎవరు? మాకు చెప్పు” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: వారు ... అన్నారు
  rationale: తెలుగులో ముందున్న కథనంతో అనుసంధానం సందర్భం ద్వారా సహజంగా స్పష్టమవుతుంది; వాక్యారంభంలో ‘మరియు’ చేర్చడం కృత్రిమంగా ఉంటుంది.
- source_word: εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃
  choice: వారు ఆయనతో ... అన్నారు
  rationale: మూలంలోని మాటల పరిచయాన్ని అర్థపూర్వకంగా నిలుపుతూ, పునరుక్తిగా వినిపించే కృదంత నిర్మాణాన్ని సహజమైన తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంగా మార్చింది.
- source_word: Εἰπὸν ἡμῖν
  choice: మాకు చెప్పు
  rationale: ఏకవచన ఆజ్ఞారూపాన్ని, బహువచన పరోక్ష కర్మను సహజమైన ఆధునిక తెలుగులో ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: ఏ అధికారంతో
  rationale: ఇక్కడ ἐν చర్యకు ఆధారమైన అధికారాన్ని సూచిస్తుంది; ‘ఏ అధికారంతో’ ప్రశ్నలోని సవాలును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ταῦτα ποιεῖς
  choice: ఇవి చేస్తున్నావో
  rationale: ταῦτα యొక్క బహువచనాన్ని ‘ఇవి’గా, వర్తమాన చర్యను ‘చేస్తున్నావు’గా నిలుపుతుంది.
- source_word: ἢ
  choice: లేదా
  rationale: అదే సవాలును మరో విధంగా అడిగే ప్రత్యామ్నాయ ప్రశ్నను స్పష్టంగా కలుపుతుంది.
- source_word: τίς ἐστιν ὁ δούς σοι
  choice: నీకు ఇచ్చినవాడు ఎవరో
  rationale: ὁ δούς అనే నామవాచకసదృశ కృదంత బలాన్ని ‘ఇచ్చినవాడు’గా నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: τὴν ἐξουσίαν ταύτην
  choice: ఈ అధికారాన్ని
  rationale: సందర్భంలోని నిర్దిష్ట అధికారాన్ని సూచిస్తుంది; ἐξουσίαను సామర్థ్యంగా కాక చట్టబద్ధమైన అధికారం అనే భావంలో అందిస్తుంది.
theological_decisions:
- issue: యేసు ఆలయంలో చేసిన కార్యాల సందర్భంలో ἐξουσία భావం
  choice: అధికారం
  alternative: శక్తి; హక్కు
  rationale: నాయకులు యేసు సామర్థ్యాన్ని కాక, ఆయన కార్యాలకు ఉన్న చట్టబద్ధతను మరియు దాని మూలాన్ని ప్రశ్నిస్తున్నారు. ‘అధికారం’ సంస్థాగత, ధార్మిక భావాలను రెండింటినీ అనవసరంగా పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవసూచక తృతీయ పురుష రూపం ‘ఆయన’ను ఉపయోగించి, ప్రత్యక్ష సంభాషణలో మూలంలోని ఏకవచన ద్వితీయ పురుషాన్ని ‘నీవు/నీకు’గా నిలిపాం. ప్రశ్నలోని రెండు భాగాలను ఒకే సహజ వాక్యంగా ఉంచాం.
