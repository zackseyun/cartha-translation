  source_fidelity: 'The Telugu accurately represents the Greek sequence: the owner sends another slave, the tenants beat and dishonor him as well, and send him away empty-handed. “మరొక” adequately carries the additional/distinct force of ἕτερον in context, while “అతణ్ణి కూడా” preserves the parallelism marked by κἀκεῖνον. “వట్టి చేతులతో” is an idiomatic and faithful rendering of κενόν.'
