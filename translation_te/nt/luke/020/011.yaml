id: LUK.20.11
reference: Luke 20:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ προσέθετο ⸂ἕτερον πέμψαι⸃ δοῦλον· οἱ δὲ κἀκεῖνον δείραντες καὶ ἀτιμάσαντες ἐξαπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/011.yaml
  text: And he proceeded to send another servant; but they also beat and dishonored that one[a], and sent him away empty-handed.
translation:
  language: te
  text: అతడు మరొక దాసుణ్ణి[a] పంపాడు. అయితే వారు అతణ్ణి కూడా కొట్టి, అవమానించి, వట్టి చేతులతో పంపివేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సేవకుణ్ణి’; గ్రీకు పదం δοῦλος అధీనంలో ఉన్న దాసుణ్ణి లేదా సేవకుణ్ణి సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο … πέμψαι
  choice: మరొక దాసుణ్ణి పంపాడు
  rationale: ఈ గ్రీకు ప్రయోగం మళ్లీ లేదా కొనసాగింపుగా చేయడాన్ని సూచిస్తుంది. ‘మరొక’ అనే పదంతో ముందటి పంపకానికి కొనసాగింపన్న భావం తెలుగులో సహజంగా వ్యక్తమవుతుంది.
- source_word: ἕτερον
  choice: మరొక
  rationale: ముందు పంపబడిన వ్యక్తికి భిన్నమైన, అదనంగా పంపబడిన వ్యక్తిని సూచిస్తుంది.
- source_word: δοῦλον
  choice: దాసుణ్ణి
  rationale: ద్రాక్షతోట యజమానికి అధీనుడై అతని ప్రతినిధిగా పంపబడిన వ్యక్తి స్థితిని ‘దాసుడు’ స్పష్టంగా నిలుపుతుంది; ‘సేవకుడు’ కంటే మూలపదంలోని బంధిత అధీన స్థితిని మెరుగ్గా తెలియజేస్తుంది.
- source_word: κἀκεῖνον
  choice: అతణ్ణి కూడా
  rationale: ముందటి దాసునికి జరిగినట్లే ఇతనికీ జరిగిందనే సమాంతర భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: δείραντες
  choice: కొట్టి
  rationale: శారీరకంగా కొట్టడాన్ని తెలియజేస్తుంది; మూలంలో లేని నిర్దిష్ట శిక్షా విధానాన్ని చేర్చదు.
- source_word: ἀτιμάσαντες
  choice: అవమానించి
  rationale: గౌరవం లేకుండా, సిగ్గుకరంగా ప్రవర్తించిన సామాజిక అవమాన భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: ἐξαπέστειλαν κενόν
  choice: వట్టి చేతులతో పంపివేశారు
  rationale: ఆశించిన ఫలంలో ఏదీ ఇవ్వకుండా పంపారనే సందర్భోచిత భావాన్ని సహజమైన తెలుగు నుడికారంతో తెలియజేస్తుంది.
theological_decisions:
- issue: ఉపమానంలో δοῦλος పదం అనువాదం
  choice: దాసుడు
  alternative: సేవకుడు
  rationale: ఈ సందర్భంలో యజమానితో ఉన్న అధీన సంబంధం ప్రసక్తమైనది. అందువల్ల ‘దాసుడు’ మూలంలోని సామాజిక స్థితిని నిలుపుతుంది; ప్రత్యేకమైన సిద్ధాంతార్థాన్ని మాత్రం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘వట్టి చేతులతో’ సాధారణ పాఠకులకు స్పష్టమైన నుడికారం; ‘అవమానించి’ మూలంలోని గౌరవహాని భావాన్ని నిలుపుతుంది.
