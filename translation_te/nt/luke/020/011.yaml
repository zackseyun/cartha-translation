  terminology: “దాసుణ్ణి” suitably conveys δοῦλον in this parabolic ownership context. The footnote gives “సేవకుణ్ణి” as a legitimate lexical alternative without weakening the main translation. “అవమానించి” properly reflects the social-shame sense of ἀτιμάσαντες.
