id: LUK.20.42
reference: Luke 20:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂αὐτὸς γὰρ⸃ Δαυὶδ λέγει ἐν βίβλῳ ψαλμῶν· ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/042.yaml
  text: For David himself says in the Book of Psalms[a], ‘The Lord said to my Lord, “Sit at my right hand”’
translation:
  language: te
  text: 'ఎందుకంటే దావీదే కీర్తనల గ్రంథంలో[a] ఇలా అంటున్నాడు: “ప్రభువు నా ప్రభువుతో, ‘నా కుడివైపున కూర్చో’ అని చెప్పాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, కీర్తన 110:1లోని హెబ్రీ పాఠాన్ని అనుసరించి: “యెహోవా నా ప్రభువుతో ఇలా అన్నాడు.”'
    reason: ఆధారమైన హెబ్రీ పాఠంలో మొదటి ‘ప్రభువు’ స్థానంలో יהוה అనే దైవనామం ఉంది.
lexical_decisions:
- source_word: αὐτὸς γὰρ
  choice: ఎందుకంటే దావీదే
  rationale: γάρ ముందున్న వాదనకు వివరణను పరిచయం చేస్తుంది; αὐτός ఇచ్చే ఉద్ఘాటనను దావీదే అనే రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Δαυὶδ λέγει
  choice: దావీదు ... అంటున్నాడు
  rationale: పేరును ప్రామాణిక తెలుగు రూపంలో ఇచ్చి, లేఖన ఉల్లేఖన సూత్రంలోని వర్తమాన కాలాన్ని తెలుగులో సహజమైన వర్తమాన రూపంతో నిలిపాం.
- source_word: ἐν βίβλῳ ψαλμῶν
  choice: కీర్తనల గ్రంథంలో
  rationale: βίβλος అనే ‘గ్రంథం’, ψαλμῶν అనే బహువచన షష్ఠీ భావాలను నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Εἶπεν κύριος τῷ κυρίῳ μου
  choice: ప్రభువు నా ప్రభువుతో ... చెప్పాడు
  rationale: మొదటి κύριος, రెండవ κύριος రెండింటినీ ‘ప్రభువు’గా ఉంచి గ్రీకు పదపునరుక్తిని, దానిలోని ఉద్దేశపూర్వక సంబంధాన్ని కాపాడాం; దత్తివాచకాన్ని ‘తో’ ద్వారా సహజంగా తెలిపాం.
- source_word: Κάθου
  choice: కూర్చో
  rationale: κάθημαι ఆజ్ఞార్థక రూపాన్ని సంక్షిప్తమైన, సహజమైన తెలుగు ఆజ్ఞగా అనువదించాం.
- source_word: ἐκ δεξιῶν μου
  choice: నా కుడివైపున
  rationale: ఈ గ్రీకు నుడికారానికి స్థానం సూచించే సహజ తెలుగు సమానార్థకం; ‘కుడిచేతి వద్ద’ అనే కృత్రిమ పదబంధాన్ని నివారిస్తుంది.
theological_decisions:
- issue: కీర్తన 110:1లోని హెబ్రీ దైవనామానికి బదులుగా గ్రీకు ఉల్లేఖనంలో ఉన్న మొదటి κύριοςను ఎలా ఇవ్వాలి
  choice: ప్రభువు
  alternative: యెహోవా
  rationale: ప్రధాన పాఠం ముందున్న SBLGNT గ్రీకు κύριοςను అనుసరిస్తుంది. అయితే ఆధారమైన హెబ్రీ కీర్తనలో יהוה ఉన్నందున ఆ రూపాన్ని పాదటిప్పణిలో తెలియజేశాం.
- issue: క్రీస్తు సంబంధమైన వాదనలో రెండవ κύριοςను ఎలా ఇవ్వాలి
  choice: నా ప్రభువు
  alternative: నా యజమాని
  rationale: ‘నా ప్రభువు’ గ్రీకు పదాన్ని, మొదటి κύριοςతో ఉన్న పదసంబంధాన్ని, వాక్యంలోని ధార్మిక ఉద్వేగాన్ని కాపాడుతుంది; ‘నా యజమాని’ సాధ్యమైనప్పటికీ ఆ సంబంధాన్ని బలహీనపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘దావీదే’ ద్వారా ఉద్ఘాటనను, రెండు చోట్ల ‘ప్రభువు’ ద్వారా గ్రీకు పాఠంలోని పదపునరుక్తి మరియు ధార్మిక ఉద్వేగాన్ని నిలిపాం.
