source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος τοῦ ἀμπελῶνος· Τί ποιήσω; πέμψω τὸν υἱόν μου τὸν ἀγαπητόν· ἴσως ⸀τοῦτον ἐντραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/013.yaml
  text: Then the owner of the vineyard said[a], ‘What shall I do? I will send my beloved son[b]; perhaps they will respect him.’
translation:
  language: te
  text: అప్పుడు ద్రాక్షతోట యజమాని[a], ‘నేనేం చేయాలి? నా ప్రియమైన కుమారుణ్ణి పంపుతాను. బహుశా అతనిని గౌరవిస్తారు[b]’ అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘ద్రాక్షతోట ప్రభువు’ లేదా ‘ద్రాక్షతోట అధిపతి.’
    reason: lexical_alternative
  - marker: b
    text: ‘గౌరవిస్తారు’ అని అనువదించిన గ్రీకు క్రియకు ‘అతని పట్ల సిగ్గుపడతారు’ లేదా ‘అతనికి మర్యాద చూపుతారు’ అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος τοῦ ἀμπελῶνος
  choice: ద్రాక్షతోట యజమాని
  rationale: ఈ వ్యవసాయ ఉపమాన సందర్భంలో ఈ పదబంధం ద్రాక్షతోటపై అధికారమూ స్వామ్యమూ గల వ్యక్తిని సూచిస్తుంది. ‘యజమాని’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది; కథలోని పాత్రకు అనవసరంగా దైవిక బిరుదును ఆపాదించదు.
- source_word: Τί ποιήσω;
  choice: నేనేం చేయాలి?
  rationale: ఇది తనలో తాను ఆలోచించుకుంటూ వేసుకున్న ప్రశ్న. ‘నేనేం చేయాలి?’ ఆధునిక తెలుగులో సహజంగా ఉండి deliberative subjunctive భావాన్ని నిలుపుతుంది.
- source_word: πέμψω
  choice: పంపుతాను
  rationale: యజమాని నిర్ణయించుకున్న తదుపరి చర్యను సూచించే భవిష్యత్ క్రియను సూటిగా తెలుపుతుంది.
- source_word: τὸν υἱόν μου τὸν ἀγαπητόν
  choice: నాకు ప్రియమైన నా కుమారుణ్ణి
  rationale: υἱός యొక్క పురుషలింగ నిర్దిష్టతను ‘కుమారుడు’ నిలుపుతుంది. ἀγαπητός లోని ఆప్యాయతనూ లూకాలో వినిపించే ప్రియ కుమారుని ప్రతిధ్వనినీ ‘ప్రియమైన’ కాపాడుతుంది.
- source_word: ἴσως
  choice: బహుశా
  rationale: నిశ్చయాన్ని కాక ఆశతో కూడిన సంభావ్యతను సూచించే సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: τοῦτον
  choice: అతనికైనా
  rationale: గ్రీకు నిర్దేశక సర్వనామంలో కుమారునిపై ఉన్న ప్రత్యేక దృష్టిని తెలుగు సందర్భంలో ‘అతనికైనా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐντραπήσονται
  choice: గౌరవం చూపుతారు
  rationale: ఈ సందర్భంలో ఆ క్రియ ఎదుటివాని పట్ల సిగ్గుతో వెనుకంజ వేయడం, మర్యాద లేదా గౌరవం చూపడం అనే భావపరిధి కలిగి ఉంది. ‘గౌరవం చూపుతారు’ ప్రధాన సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది; విస్తృత భావాన్ని పాదటిప్పణి తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుణ్ణి సూచించే ఉపమానపాత్రకు κύριος అనే పదం వాడబడటం
  choice: ద్రాక్షతోట యజమాని
  alternative: ద్రాక్షతోట ప్రభువు / ద్రాక్షతోట అధిపతి
  rationale: తక్షణ కథాస్థాయిలో అతడు తోట యజమాని. ఈ అనువాదం కథార్థాన్ని స్పష్టంగా ఉంచి, ఉపమానంలోని దేవునితో పోలికను పాఠకుడు గ్రహించేందుకు వీలు కల్పిస్తుంది; బిరుదు ద్వారా ఆ పోలికను బలవంతంగా నిర్ధారించదు.
- issue: τὸν υἱόν μου τὸν ἀγαπητόν లోని క్రీస్తుసంబంధ ప్రతిధ్వని
  choice: నాకు ప్రియమైన నా కుమారుణ్ణి
  alternative: నా కుమారుణ్ణి, ఆ ప్రియమైనవాణ్ణి
  rationale: ఈ రూపం ఉపమానంలోని కుటుంబ సంబంధాన్నీ, లూకా రచనలోని ‘ప్రియ కుమారుడు’ భాషతో ఉండగల ప్రతిధ్వనినీ విస్తరించకుండా నిలుపుతుంది.
- issue: యజమాని మాటలోని ἴσως వల్ల కనిపించే అనిశ్చితి
  choice: బహుశా
  alternative: ఏమో, గౌరవిస్తారేమో
  rationale: మూలపాఠంలోని ఆశతో కూడిన అనిశ్చితిని అలాగే ఉంచాలి; దేవుని సర్వజ్ఞత్వంతో దాన్ని సమన్వయపరచేందుకు అనువాదంలో దాన్ని తొలగించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘నేనేం’ వంటి సాధారణ సంక్షిప్త రూపం పఠనసౌలభ్యాన్ని పెంచుతుంది; ‘ప్రియమైన నా కుమారుడు’ వాక్యభాగం మూలంలోని భావబలాన్ని నిలుపుతుంది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో పొందుపరచబడ్డాయి.
