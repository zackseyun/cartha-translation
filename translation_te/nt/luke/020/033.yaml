source:
  edition: SBLGNT
  text: ⸂ἡ γυνὴ οὖν ἐν τῇ⸃ ἀναστάσει τίνος αὐτῶν γίνεται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/033.yaml
  text: In the resurrection[a], then[c][b], whose wife does the woman become? For the seven had her as wife.
translation:
  language: te
  text: అయితే, పునరుత్థానంలో[a] ఆమె వారిలో ఎవరి భార్య అవుతుంది?[b] ఎందుకంటే ఆ ఏడుగురూ ఆమెను భార్యగా కలిగివుండేవారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పునరుత్థానం జరిగినప్పుడు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆమె వారిలో ఎవరికి భార్యగా ఉంటుంది?”
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “ఆమెను భార్యగా కలిగివుండేవారు”; మరొక విధంగా, “ఆమెను పెళ్లి చేసుకున్నారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γυνή
  choice: ఆమె
  rationale: ముందటి సందర్భంలో ప్రస్తావించిన స్త్రీనే సూచిస్తున్నందున, తెలుగులో సహజంగా సర్వనామంతో వ్యక్తమవుతుంది; వాక్యంలోని తరువాతి ‘భార్య’తో అనవసర పునరుక్తి కూడా తప్పుతుంది.
- source_word: οὖν
  choice: అయితే
  rationale: సద్దూకయ్యుల వాదనలో ఇది పర్యవసాన ప్రశ్నను ప్రవేశపెడుతుంది. ‘అయితే’ ఆ అనుమానాత్మక-తార్కిక కొనసాగింపును సహజ తెలుగులో చూపుతుంది.
- source_word: ἐν τῇ ἀναστάσει
  choice: పునరుత్థానంలో
  rationale: మూలంలోని ἐν పదబంధాన్ని సమీపంగా నిలుపుతూ, అదనంగా ‘మృతుల’ అనే వివరణను చేర్చకుండా అనువదిస్తుంది.
- source_word: τίνος αὐτῶν
  choice: వారిలో ఎవరి
  rationale: సంబంధాన్ని అడిగే genitive interrogative భావాన్ని ‘ఎవరి’ నేరుగా తెలియజేస్తుంది; αὐτῶν భావాన్ని ‘వారిలో’ నిలుపుతుంది.
- source_word: γίνεται γυνή
  choice: భార్య అవుతుంది
  rationale: γίνομαι లోని ‘అవడం’ భావాన్నీ, γυνή యొక్క వైవాహిక అర్థమైన ‘భార్య’నూ రెండింటినీ కాపాడుతుంది.
- source_word: οἱ γὰρ ἑπτὰ
  choice: ఎందుకంటే ఆ ఏడుగురూ
  rationale: ఇంతకు ముందు పేర్కొన్న ఏడుగురు అన్నదమ్ములను నిర్దిష్టంగా సూచించడానికి ‘ఆ’ వాడబడింది. తెలుగు ‘ఏడుగురూ’ సమూహంలోని ప్రతి ఒక్కరినీ సూచిస్తుంది; ఇది సందర్భంలోని బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: ఆమెను భార్యగా కలిగివున్నారు
  rationale: ἔχω + accusative + γυναῖκα అనే సంబంధస్థితిని ‘పెళ్లి చేసుకున్నారు’ అనే కార్యరూపానికి మార్చకుండా, మూలానికి సమీపంగా నిలుపుతుంది.
theological_decisions:
- issue: సద్దూకయ్యుల ప్రశ్నలో పునరుత్థాన భాష
  choice: పునరుత్థానం
  alternative: మృతుల పునరుత్థానం
  rationale: ఈ వచనంలో ἀνάστασις మాత్రమే ఉంది. అందువల్ల విస్తృత సందర్భంలోని ‘మృతుల’ అనే మాటను వచనంలో చేర్చకుండా, ప్రశ్నలోని ధార్మిక ఉద్వేగాన్ని అలాగే ఉంచాం.
- issue: పునరుత్థానంలో వైవాహిక స్థితి గురించిన ప్రశ్న
  choice: భార్య అవుతుంది
  alternative: భార్యగా ఉంటుంది
  rationale: γίνεται లోని పరిణామ లేదా ఏర్పడే స్థితి భావాన్ని సాధ్యమైనంతవరకు నిలిపాం; యేసు తరువాత ఇచ్చే సమాధానాన్ని ముందుగానే ఈ ప్రశ్నలో కలపలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ప్రశ్నలోని తార్కిక ప్రవాహాన్ని ‘అయితే’తో చూపించి, మూలంలోని సంబంధస్థితిని ప్రధాన పాఠ్యంలో కాపాడాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
