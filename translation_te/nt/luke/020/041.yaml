id: LUK.20.41
reference: Luke 20:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς αὐτούς· Πῶς λέγουσιν τὸν χριστὸν ⸂εἶναι Δαυὶδ υἱόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/041.yaml
  text: But he said to them[b][a], “How do they say that the Messiah is David’s son?”
translation:
  language: te
  text: 'అయితే ఆయన వారితో ఇలా అన్నాడు: “మెస్సీయ[a] దావీదు కుమారుడని[b] వారు ఎలా అంటున్నారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “క్రీస్తు.” గ్రీకు Χριστός ఇక్కడ ఒక బిరుదు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా “దావీదు కుమారుడు.” దీనిని “దావీదు యొక్క ఒక కుమారుడు” లేదా “దావీదు కుమారుడైనవాడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: ఇది స్వల్పమైన సంభాషణా మలుపును సూచిస్తుంది; ముందటి చర్చనుంచి యేసు ఒక సవాలుతో కూడిన ప్రశ్నకు మారుతున్న సందర్భానికి ‘అయితే’ సహజంగా సరిపోతుంది.
- source_word: πρὸς αὐτούς
  choice: వారితో
  rationale: మాట్లాడడాన్ని సూచించే ఈ నిర్మాణానికి ఆధునిక తెలుగులో ‘వారితో’ సహజమైన సమానార్థకం.
- source_word: Πῶς
  choice: ఎలా
  rationale: ప్రచారంలో ఉన్న వాదన ఏ విధంగా చెప్పబడుతోందో ప్రశ్నిస్తుంది; మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
- source_word: λέγουσιν
  choice: వారు … అంటున్నారు
  rationale: మూలంలో కర్త నిర్దిష్టంగా చెప్పబడని మూడవ పురుష బహువచనం ఉంది. ‘వారు’ ఆ అనిర్దిష్టతను సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: τὸν χριστόν
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός దావీదు వంశానికి చెందినవాడిగా ఎదురుచూసిన రాజసంబంధ విమోచకుని బిరుదుగా వాడబడింది; అందువల్ల ‘మెస్సీయ’ సందర్భోచితం.
- source_word: εἶναι
  choice: అని
  rationale: λέγουσιν‌తో వచ్చిన గ్రీకు పరోక్ష వాక్యాన్ని తెలుగులో ‘… అని అంటున్నారు’ అనే సహజ నిర్మాణంతో వ్యక్తం చేసింది.
- source_word: Δαυὶδ υἱόν
  choice: దావీదు కుమారుడు
  rationale: మూలంలోని సంబంధాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది; ‘ఒక కుమారుడు’ లేదా ప్రత్యేక బిరుదుగా ‘ఆ కుమారుడు’ అని అదనంగా నిర్దిష్టపరచదు.
theological_decisions:
- issue: Χριστός పదానికి అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: దావీదు వంశీయుడైన ఎదురుచూసిన రాజును గురించి ఈ సందర్భం స్పష్టంగా మాట్లాడుతోంది. కాబట్టి బిరుదు భావాన్ని ముందుకు తెచ్చే ‘మెస్సీయ’ను ఎంచుకుంది.
- issue: దావీదు కుమారత్వ భాష
  choice: దావీదు కుమారుడు
  alternative: దావీదు వంశస్థుడు / దావీదు కుమారుడైన ఆ వ్యక్తి
  rationale: తదుపరి వచనాల్లో ప్రశ్నించబడబోయే కుమారత్వ వాదనను మూలంలోని రూపంలోనే ఉంచుతుంది; దానిని కేవలం వంశావళి భావంగా కుదించదు, అలాగే గ్రీకులో స్పష్టంగా లేని నిర్దిష్టతను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ప్రశ్నలోని తాత్త్విక ఉద్వేగాన్ని వివరించి పరిష్కరించకుండా అలాగే నిలుపుకుంది.
