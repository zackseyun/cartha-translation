id: LUK.20.36
reference: Luke 20:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀οὐδὲ γὰρ ἀποθανεῖν ἔτι δύνανται, ἰσάγγελοι γάρ εἰσιν καὶ υἱοί ⸀εἰσιν θεοῦ τῆς ἀναστάσεως υἱοὶ ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/036.yaml
  text: For they cannot die anymore[a], because they are like the angels and are sons of God[b], being sons of the resurrection.
translation:
  language: te
  text: ఎందుకంటే, వారు ఇక చనిపోలేరు; వారు దేవదూతలవంటివారు[a], దేవుని పుత్రులు[b], పునరుత్థాన పుత్రులై ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవదూతలతో సమానమైనవారు.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ‘దేవుని పుత్రులు,’ ‘పునరుత్థాన పుత్రులు’ అని ఉంది. ఇక్కడ పుంలింగ రూపం కేవలం పురుషులను మాత్రమే కాక, హోదా మరియు గుర్తింపును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθανεῖν ἔτι δύνανται
  choice: ఇక చనిపోలేరు
  rationale: δύνανται సామర్థ్యాన్ని సూచిస్తుంది; ἔτι ఇక్కడ ‘ఇకపై/ఇక’ అనే భావంతో మరణశీలత ముగిసిన స్థితిని తెలియజేస్తుంది.
- source_word: ἰσάγγελοι
  choice: దేవదూతలవంటివారు
  rationale: ఈ పదానికి ‘దేవదూతలతో సమానమైనవారు’ లేదా ‘దేవదూతలవంటివారు’ అనే అర్థం ఉంది. ఎంపిక చేసిన రూపం వారే దేవదూతలని చెప్పకుండా పోలికను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: υἱοί ... θεοῦ
  choice: దేవుని పుత్రులు
  rationale: υἱοί అనే పుంలింగ బహువచన రూపాన్ని, అలాగే తరువాత పునరావృతమయ్యే పుత్రత్వ రూపకాన్ని నిలుపుతుంది.
- source_word: τῆς ἀναστάσεως υἱοὶ ὄντες
  choice: పునరుత్థాన పుత్రులుగా ఉండడం వల్ల
  rationale: పుత్రత్వ రూపకాన్ని కాపాడుతూ, ὄντες అనే కృదంతంలో సందర్భానుసారంగా కనిపించే వివరణాత్మక/కారణ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γάρ ... γάρ
  choice: ఎందుకంటే ... ; ... వల్ల
  rationale: మొదటి γάρ ముందరి వాక్యానికి వివరణను కలుపుతుంది; రెండవది కారణ సంబంధాన్ని చూపుతుంది. తెలుగులో ఒకే సంధిపదాన్ని అసహజంగా పునరావృతం చేయకుండా ఆ ప్రవాహాన్ని నిలిపింది.
theological_decisions:
- issue: అంత్యకాల సందర్భంలోని పుత్రత్వ భాష
  choice: ప్రధాన పాఠ్యంలో ‘దేవుని పుత్రులు’, ‘పునరుత్థాన పుత్రులు’ అని నిలుపడం
  alternative: ‘దేవుని పిల్లలు’, ‘పునరుత్థానపు పిల్లలు’
  rationale: గ్రీకు మూలంలో υἱοί రెండుసార్లు వచ్చి అలంకారిక పునరుక్తిని ఏర్పరుస్తుంది. ఇక్కడ అది కేవలం పురుషులనే కాక, పునరుత్థానం ద్వారా కలిగే హోదా మరియు గుర్తింపును సూచిస్తుంది; ఆ సమగ్ర భావాన్ని పాదటిప్పణిలో స్పష్టం చేయడం మూలరూపాన్ని సమతలీకరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘పునరుత్థానం,’ ‘పుత్రులు’ వంటి స్థిరమైన బైబిలు పదాలను మూలంలోని రూపకం మరియు వాక్య సంబంధం నిలిచేలా ఉపయోగించాం.
