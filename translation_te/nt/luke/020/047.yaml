review_pass:
  verdict: revise
  source_fidelity: 'The main sense is conveyed well: rapacious exploitation of widows, hypocritical long prayer, and a comparatively greater adverse judgment are all retained. However, “పైకి భక్తిపరులుగా కనిపించడానికి” reframes προφάσει as an explicit purpose of appearing pious and adds “భక్తిపరులుగా,” whereas the Greek more tersely says that the long prayers are made as a pretext. A closer Telugu expression preserves the source''s compact ambiguity.'
  naturalness: The draft is generally clear and modern. “వితంతువులు” is the more standard formal term for widows in this register than “విధవరాళ్లు.” “నెపంగా సుదీర్ఘంగా ప్రార్థిస్తారు” is natural and more direct than the expanded explanatory wording.
  terminology: “మింగివేస్తారు” aptly preserves the vivid metaphor of κατεσθίουσιν, and “మరింత తీవ్రమైన తీర్పు” appropriately retains κρίμα as ‘judgment’ while communicating its adverse force. The alternatives in the footnotes should correspond accurately to the revised main rendering.
  issues:
  - severity: medium
    issue: The rendering of προφάσει is overly explicative.
    rationale: “పైకి భక్తిపరులుగా కనిపించడానికి” introduces the specific notion of appearing religious and changes the concise ‘as a pretext’ construction into a purpose clause. “నెపంగా” preserves the Greek’s stated pretense without adding that explanatory detail.
  - severity: low
    issue: Use a more standard formal Telugu term for widows.
    rationale: “వితంతువుల” is the usual modern-standard and suitably solemn term here; “విధవరాళ్ల” is more colloquial/regional in feel.
  revised_text: వీరు వితంతువుల ఇళ్లను మింగివేస్తూ, నెపంగా[a] సుదీర్ఘంగా ప్రార్థిస్తారు. వీరు మరింత తీవ్రమైన తీర్పు పొందుతారు.[b]
  revised_footnotes:
