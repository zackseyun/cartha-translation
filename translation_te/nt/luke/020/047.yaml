id: LUK.20.47
reference: Luke 20:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἳ κατεσθίουσιν τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσεύχονται· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/047.yaml
  text: who devour widows’ houses and for a pretense pray at length[b][a]. These will receive greater condemnation.
translation:
  language: te
  text: వీరు వితంతువుల ఇళ్లను మింగివేస్తూ, నెపంగా[a] సుదీర్ఘంగా ప్రార్థిస్తారు. వీరు మరింత తీవ్రమైన తీర్పు పొందుతారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ముసుగుగా.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మరింత తీవ్రమైన శిక్షావిధి” లేదా “ఎక్కువ దండన.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίουσιν
  choice: మింగివేస్తూ
  rationale: అక్షరార్థమైన ‘తినడం’ కాకుండా, దోపిడీ చేయడాన్ని సూచించే బలమైన రూపకాన్ని నిలుపుతుంది.
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: విధవరాళ్ల ఇళ్లను
  rationale: గ్రీకు పదబంధంలోని ‘ఇళ్లు’ అనే రూపాన్ని నిలుపుతూ, సందర్భంలో వారి ఆస్తి లేదా జీవనాధారాన్ని దోచుకోవడం అనే భావాన్ని వినిపిస్తుంది.
- source_word: προφάσει
  choice: పైకి భక్తిపరులుగా కనిపించడానికి
  rationale: వారి సుదీర్ఘ ప్రార్థన నిజమైన భక్తి కాక, దానిని ప్రదర్శించే నెపం లేదా ముసుగు అనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; మరింత రూపనిష్ఠ ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: μακρὰ προσεύχονται
  choice: సుదీర్ఘంగా ప్రార్థిస్తారు
  rationale: μακρά యొక్క క్రియావిశేషణ ప్రయోగాన్ని సహజంగా వ్యక్తం చేసి, ప్రార్థనల దీర్ఘ వ్యవధిని నిలుపుతుంది.
- source_word: λήμψονται
  choice: పొందుతారు
  rationale: దైవిక న్యాయనిర్ణయ ఫలితాన్ని ‘పొందడం’ అనే గంభీరమైన, సహజ ప్రయోగంతో తెలియజేస్తుంది.
- source_word: περισσότερον κρίμα
  choice: మరింత తీవ్రమైన తీర్పు
  rationale: తులనాత్మక తీవ్రతను సహజ తెలుగులో స్పష్టం చేస్తూ, κρίμα యొక్క విస్తృత ‘తీర్పు’ అర్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఈ సందర్భంలో κρίμα స్వభావం
  choice: తీర్పు
  alternative: శిక్షావిధి / దండన
  rationale: సందర్భం ప్రతికూలమైన దైవిక న్యాయనిర్ణయాన్ని స్పష్టంగా సూచించినా, ‘తీర్పు’ అనే అనువాదం గ్రీకు పదపు విస్తృతిని అనవసరంగా కుదించదు. దాని శిక్షాత్మక భావం సందర్భం మరియు ‘మరింత తీవ్రమైన’ అనే పదబంధం ద్వారా స్పష్టమవుతుంది.
- issue: προφάσει సూచించే కపట ఉద్దేశం
  choice: పైకి భక్తిపరులుగా కనిపించడానికి
  alternative: నెపంగా / ముసుగుగా
  rationale: ఇది సుదీర్ఘ ప్రార్థనను కేవలం బహిరంగ ప్రదర్శనగా కాక, దోపిడీని కప్పిపుచ్చే కపట భక్తి ప్రదర్శనగా అర్థమయ్యేలా చేస్తుంది; గ్రీకులోని నెపం/ముసుగు భావాన్ని పాదసూచిక సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘మింగివేస్తూ’ అనే సజీవ రూపకం మూలంలోని తీవ్ర ఖండనను నిలుపుతుంది. పాదసూచిక గుర్తులు రెండూ ప్రధాన పాఠ్యంలో సంబంధిత స్థానాల్లో ఉంచబడ్డాయి.
