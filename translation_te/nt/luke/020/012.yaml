lexical_decisions:
- source_word: προσέθετο
  choice: ఆ తరువాత ... పంపాడు
  rationale: προστίθημι + infinitive అనే గ్రీకు ప్రయోగం మరొక చర్యను కొనసాగించడం లేదా తదుపరి చర్యగా చేయడాన్ని సూచిస్తుంది. సహజమైన తెలుగులో ‘ఆ తరువాత ... పంపాడు’ ఆ క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τρίτον πέμψαι
  choice: మూడవవాణ్ణి పంపాడు
  rationale: గ్రీకులో కర్మ సందర్భం వల్ల విడిచిపెట్టబడింది; ముందటి వచనాల ప్రకారం పంపబడినవాడు దాసుడే. ‘మూడవవాణ్ణి’ అని అనువదించడం సంక్షిప్తంగా ఉండి, సందర్భంలోని సూచనను నిలుపుతుంది.
- source_word: οἱ δὲ
  choice: అయితే వారు
  rationale: δέ యజమాని చేసిన పనినుంచి కౌలుదారుల ప్రతిస్పందనకు వచ్చే వ్యతిరేక మలుపును సూచిస్తుంది. ‘అయితే వారు’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: καὶ τοῦτον
  choice: ఇతణ్ణి కూడా
  rationale: καί ఇక్కడ ముందు పంపబడినవారికి జరిగినట్లే ఇతనికీ జరిగిందనే పునరావృత భావాన్ని తెలియజేస్తుంది.
- source_word: τραυματίσαντες
  choice: గాయపరచి
  rationale: τραυματίζω గాయం కలిగించడాన్ని నేరుగా సూచిస్తుంది; ‘గాయపరచి’ దాని ప్రత్యేక భావాన్ని నిలుపుతుంది.
- source_word: ἐξέβαλον
  choice: బయటికి తోసివేశారు
  rationale: ἐκβάλλω బలవంతంగా బయటికి పంపడం లేదా తోసివేయడం అనే భావం కలిగి ఉంది. ‘బయటికి తోసివేశారు’ హింసాత్మక చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది.
