translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా గౌరవప్రదమైన శైలిలో అనువదించబడింది. మూలంలోని ‘మాటను పట్టుకోవడం’ అనే రూపకం ప్రధాన పాఠ్యంలో నిలుపబడింది; దాని సందర్భార్థం పాదటిప్పణిలో ఇవ్వబడింది.
