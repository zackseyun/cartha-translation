  text: καὶ οὐκ ἴσχυσαν ἐπιλαβέσθαι ⸀τοῦ ῥήματος ἐναντίον τοῦ λαοῦ, καὶ θαυμάσαντες ἐπὶ τῇ ἀποκρίσει αὐτοῦ ἐσίγησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/026.yaml
  text: And they were not able to seize on his statement before the people[a], and marveling at his answer, they became silent.
translation:
  language: te
  text: ప్రజల సమక్షంలో ఆయన మాటను పట్టుకొని ఆయనను చిక్కించుకోవడంలో వారు సఫలులు కాలేకపోయారు.[a] ఆయన జవాబుకు ఆశ్చర్యపడి మౌనంగా ఉండిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజల సమక్షంలో ఆయన మాటను పట్టుకోవడానికి.”
    reason: ἐπιλαβέσθαι τοῦ ῥήματος యొక్క అక్షరానువాదానికి దగ్గరగా ఉండే ప్రత్యామ్నాయం; సందర్భంలో దీని అర్థం ఆయన మాటను ఆధారంగా చేసుకొని ఆయనను చిక్కించుకోవడం.
lexical_decisions:
- source_word: ἴσχυσαν
  choice: సమర్థులు కాలేదు
  rationale: సామర్థ్యం లేదా శక్తి లేకపోవడాన్ని సూచించే క్రియను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπιλαβέσθαι
  choice: పట్టుకోవడానికి
  rationale: మూలంలోని ‘పట్టుకోవడం/చిక్కించుకోవడం’ అనే రూపకాన్ని నిలుపుతూ, ఇక్కడ ఆయన పలికిన మాటను ఆధారంగా చేసుకొని చిక్కించాలని చేసిన ప్రయత్నాన్ని సూచిస్తుంది.
- source_word: τοῦ ῥήματος
  choice: ఆయన మాటను
  rationale: ఇక్కడ ῥῆμα ఒక పలికిన మాట లేదా ప్రకటనను సూచిస్తుంది; సందర్భం వల్ల అది యేసు పలికిన మాట అని స్పష్టమవుతుంది.
- source_word: ἐναντίον τοῦ λαοῦ
  choice: ప్రజల ఎదుట
  rationale: ప్రజల సమక్షంలో అనే భావాన్ని సంక్షిప్తంగా, లూకా వాడిన λαός అనే పదానికి తగినట్లుగా అందిస్తుంది.
- source_word: θαυμάσαντες
  choice: ఆశ్చర్యపడి
  rationale: వారి విస్మయాన్ని సహజమైన తెలుగు క్రియావిశేషణ రూపంలో వ్యక్తం చేస్తుంది.
- source_word: ἀποκρίσει
  choice: జవాబుకు
  rationale: వివాద సందర్భంలో ఇచ్చిన ప్రత్యుత్తరాన్ని నేరుగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐσίγησαν
  choice: మౌనంగా ఉండిపోయారు
  rationale: వారు మాటలాడడం ఆపి మౌనంలోకి వెళ్లిన ఫలిత స్థితిని సహజంగా వ్యక్తం చేస్తుంది.
