- from: 'అప్పుడు ఆయన ప్రజలకు ఈ ఉపమానం చెప్పడం మొదలుపెట్టాడు: “ఒక మనిషి ద్రాక్షతోట నాటి, దాన్ని రైతులకు కౌలుకిచ్చి, చాలాకాలం పాటు దూరంగా వెళ్లిపోయాడు.[a]”'
