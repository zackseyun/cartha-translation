source:
  edition: SBLGNT
  text: Ἤρξατο δὲ πρὸς τὸν λαὸν λέγειν τὴν παραβολὴν ταύτην· ⸀Ἄνθρωπος ἐφύτευσεν ἀμπελῶνα, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν χρόνους ἱκανούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/009.yaml
  text: 'Then he began to tell the people this parable: “A man planted a vineyard[a], and leased it to farmers, and went away for a considerable time.”'
translation:
  language: te
  text: 'అప్పుడు ఆయన ప్రజలకు ఈ ఉపమానం చెప్పడం మొదలుపెట్టాడు: “ఒక మనిషి ద్రాక్షతోటను నాటి, దానిని రైతులకు కౌలుకు ఇచ్చి, చాలాకాలం పాటు దూరంగా వెళ్లాడు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వేరే దేశానికి వెళ్లి చాలాకాలం అక్కడ ఉన్నాడు.” ఈ క్రియ తన స్వస్థలం లేదా సొంత ప్రాంతానికి దూరంగా, కొన్నిసార్లు విదేశంలో, ఉండడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤρξατο δὲ
  choice: అప్పుడు … మొదలుపెట్టాడు
  rationale: δέ కథనంలోని తదుపరి దశను సూచిస్తుంది; ἤρξατο మాట చెప్పడం ప్రారంభించిన భావాన్ని ఇస్తుంది. ఈ తెలుగు నిర్మాణం రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: πρὸς τὸν λαὸν λέγειν
  choice: ప్రజలకు … చెప్పడం
  rationale: πρός ఇక్కడ సంబోధించబడుతున్న శ్రోతలను సూచిస్తుంది; λαός అనే సమష్టి భావాన్ని ‘ప్రజలు’ నిలుపుతుంది. ఉపమానంతో λέγειν వాడబడినందున ‘చెప్పడం’ సహజమైన తెలుగు.
- source_word: τὴν παραβολὴν ταύτην
  choice: ఈ ఉపమానం
  rationale: παραβολήకు సువార్తల సందర్భంలో స్థిరమైన, సుపరిచితమైన తెలుగు పదం ‘ఉపమానం’.
- source_word: Ἄνθρωπος
  choice: ఒక మనిషి
  rationale: కథలో ఒక నిర్దిష్ట పురుష పాత్రను పరిచయం చేస్తున్న ఏకవచన పురుషలింగ నామవాచకాన్ని యథార్థంగా ప్రతిబింబిస్తుంది.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: ద్రాక్షతోట నాటి
  rationale: φυτεύω యొక్క ప్రాథమిక భావం ‘నాటు’; ἀμπελώνతో కలిసి ‘ద్రాక్షతోట నాటు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: దాన్ని రైతులకు కౌలుకిచ్చి
  rationale: ἐκδίδωμι ఇక్కడ ఆస్తిని కౌలుకు ఇవ్వడాన్ని సూచిస్తుంది; γεωργοί సాగుచేసే రైతులు. ‘కౌలుకిచ్చి’ వారి కౌలుదారు సంబంధాన్ని సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: ἀπεδήμησεν
  choice: దూరంగా వెళ్లిపోయాడు
  rationale: ἀποδημέω స్వస్థలం లేదా సొంత ప్రాంతం విడిచి మరొకచోట ఉండేందుకు వెళ్లడాన్ని సూచించగలదు. ‘దూరంగా వెళ్లిపోయాడు’ దేశం అనే వివరాన్ని ప్రధాన పాఠంలో అదనంగా చేర్చకుండా ఆ భావాన్ని నిలుపుతుంది.
- source_word: χρόνους ἱκανούς
  choice: చాలాకాలం పాటు
  rationale: ఈ బహువచన కాలవ్యక్తీకరణ గణనీయమైన నిడివిని సూచిస్తుంది; ‘చాలాకాలం పాటు’ ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
theological_decisions:
- issue: Ἄνθρωπος అనే పురుషలింగ పరిచయ నామవాచకం
  choice: ఒక మనిషి
  alternative: ఒక వ్యక్తి
  rationale: ఈ ఉపమానం సాధారణ మానవజాతిని కాక ఒక నిర్దిష్ట పురుష భూస్వామి పాత్రను పరిచయం చేస్తుంది; అందువల్ల మూలంలోని లింగ సూచనను తటస్థీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘కౌలుకిచ్చి’ వ్యవసాయ భూమిని ఇతరులు సాగుచేయడానికి అప్పగించే సందర్భాన్ని సంక్షిప్తంగా తెలియజేస్తుంది. పాదసూచిక గుర్తును దానికి సంబంధించిన ‘దూరంగా వెళ్లిపోయాడు’ అన్న పదబంధం తరువాత ఉంచాం.
