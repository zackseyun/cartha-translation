id: LUK.20.25
reference: Luke 20:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν ⸂πρὸς αὐτούς· Τοίνυν ἀπόδοτε⸃ τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/025.yaml
  text: But he said to them[a], “Then give back to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: te
  text: అయితే ఆయన వారితో, “కాబట్టి, కైసరుకు చెందినవి కైసరుకు, దేవునికి చెందినవి దేవునికి తిరిగి ఇవ్వండి[a]” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కైసరుకు చెందినవి కైసరుకు, దేవునికి చెందినవి దేవునికి ఇవ్వండి.” గ్రీకు క్రియకు ఇవ్వడం, చెల్లించడం, లేదా హక్కుగా ఉన్నదాన్ని తిరిగి ఇవ్వడం అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: అప్పుడు ఆయన వారితో … అని చెప్పాడు
  rationale: δέ ఇక్కడ స్వల్ప కొనసాగింపును సూచిస్తుంది; ‘అప్పుడు’ సంభాషణ ప్రవాహాన్ని సహజంగా తెలియజేస్తుంది. λέγω πρὸς αὐτούς అనే నిర్మాణానికి ‘వారితో చెప్పాడు’ సహజమైన తెలుగు రూపం.
- source_word: Τοίνυν
  choice: కాబట్టి
  rationale: Τοίνυν ముందున్న విషయంనుంచి తీసిన నిర్ధారణను లేదా తార్కిక పర్యవసానాన్ని సూచిస్తుంది; ‘కాబట్టి’ ఆ భావాన్ని స్పష్టంగా, గంభీరంగా అందిస్తుంది.
- source_word: ἀπόδοτε
  choice: తిరిగి ఇవ్వండి
  rationale: ἀποδίδωμι ఇవ్వడం, చెల్లించడం, బాకీగా లేదా హక్కుగా ఉన్నదాన్ని తిరిగి ఇవ్వడం అనే భావాలను కలిగి ఉంటుంది. ‘తిరిగి ఇవ్వండి’ దానికి ఉన్న ప్రతిదాన భావాన్ని నిలుపుతూ, కేవలం పన్ను చెల్లింపుకే అర్థాన్ని పరిమితం చేయదు.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: కైసరువి కైసరుకు
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్త సమాంతర నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది. ‘కైసరువి’ అనేది కైసరుకు చెందిన వాటన్నిటినీ సూచిస్తుంది; పన్నులకు మాత్రమే పరిమితం చేయదు.
- source_word: Καίσαρος / Καίσαρι
  choice: కైసరు / కైసరుకు
  rationale: Καῖσαρ అనే సామ్రాజ్య బిరుదును అర్థానువాదం చేయకుండా తెలుగులో స్థిరపడిన రూపంలో లిప్యంతరీకరించింది.
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: దేవునివి దేవునికి
  rationale: కైసరుకు సంబంధించిన మొదటి భాగంతో ఉన్న గ్రీకు సమాంతరతను, వ్యత్యాసాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: రాజకీయ అధికారానికి, దేవునికి సంబంధించిన బాధ్యతల పరిధి
  choice: కైసరుకు చెందినవి కైసరుకు, దేవునికి చెందినవి దేవునికి ఇవ్వాలనే సమాంతర బాధ్యతను మాత్రమే వాక్యం పేర్కొనేలా అనువదించబడింది.
  alternative: మతం-రాజ్యం మధ్య సంపూర్ణ విభజనగా, ప్రభుత్వానికి అపరిమిత అధికారానికి మద్దతుగా, లేదా కేవలం పన్ను చెల్లింపు ఆజ్ఞగా స్పష్టీకరించడం.
  rationale: గ్రీకు మూలం ఎవరికీ ఏది చెందుతుందో దాని పూర్తి పరిధిని నిర్వచించదు. కాబట్టి తరువాతి రాజకీయ లేదా సిద్ధాంతపరమైన నిర్ణయాలను వాక్యంలోకి చేర్చకుండా దాని విస్తృతిని, అంతర్గత ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, సంక్షిప్తమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘కైసరువి … దేవునివి’ అనే సమాంతర రూపం మూలంలోని వాక్చాతుర్యాన్ని నిలుపుతుంది.
