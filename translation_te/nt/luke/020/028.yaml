id: LUK.20.28
reference: Luke 20:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγοντες· Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν, ἐάν τινος ἀδελφὸς ἀποθάνῃ ἔχων γυναῖκα, καὶ οὗτος ἄτεκνος ⸀ᾖ, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/028.yaml
  text: saying[a], “Teacher, Moses wrote for us that if someone's brother dies having a wife, and he is childless[b], his brother should take the wife and raise up offspring for his brother.”
translation:
  language: te
  text: 'వారు ఇలా అన్నారు: “బోధకుడా, మోషే మన కోసం ఇలా రాశాడు: ఒకరి సోదరుడు భార్య ఉండగా మరణించి, అతనికి సంతానం లేకపోతే,[a] అతని సోదరుడు ఆ భార్యను తన భార్యగా స్వీకరించి, చనిపోయిన తన సోదరుని కోసం సంతానాన్ని కలుగజేయాలి.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భార్యను వెనుక విడిచి మరణించి.” గ్రీకులో అక్షరార్థంగా, “భార్య ఉండగా మరణించి” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “సంతానాన్ని కలుగజేయాలి” అనే మాట ద్వితీయోపదేశకాండము 25:5లోని న్యాయపరమైన నుడికారాన్ని ప్రతిధ్వనిస్తుంది; అక్షరార్థంగా, “విత్తనాన్ని లేపాలి.”
    reason: cross_reference
lexical_decisions:
- source_word: Διδάσκαλε
  choice: బోధకుడా
  rationale: యేసును నేరుగా సంబోధించే సాధారణమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: Μωϋσῆς ἔγραψεν ἡμῖν
  choice: మోషే మన కోసం ఇలా రాశాడు
  rationale: ἡμῖν ఇక్కడ ప్రత్యక్షంగా ‘మనకు లేఖ రాశాడు’ అనే భావం కంటే, ఇశ్రాయేలీయుల ప్రయోజనం మరియు వర్తింపును సూచిస్తుంది.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: ఒక వ్యక్తి సోదరుడు ... చనిపోయి
  rationale: τινος యొక్క అనిర్దిష్ట, సాధారణ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἔχων γυναῖκα
  choice: భార్య ఉండగానే
  rationale: గ్రీకు పదబంధంలోని ‘భార్యను కలిగి ఉండి’ అనే అక్షరార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘భార్యను విడిచిపెట్టి’ అనే వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: οὗτος ἄτεκνος ᾖ
  choice: సంతానం లేనివాడైతే
  rationale: οὗτος చనిపోయిన సోదరునినే సూచిస్తుంది; ἄτεκνος అంటే పిల్లలు లేదా సంతానం లేని స్థితి.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: అతని సోదరుడు ఆ భార్యను స్వీకరించి
  rationale: లేవిరేట్ వివాహానికి సంబంధించిన న్యాయపరమైన బాధ్యతను తెలియజేస్తూ, ‘పెళ్లి చేసుకోవాలి’ అని మూలంలో అంతర్లీనమైన విషయాన్ని అతిగా విప్పి చెప్పకుండా ఉంచుతుంది.
- source_word: ἐξαναστήσῃ σπέρμα
  choice: సంతానాన్ని కలిగించాలి
  rationale: ‘విత్తనాన్ని లేపాలి’ అనే హీబ్రూ-గ్రీకు న్యాయనుడికార భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: చనిపోయిన తన సోదరుని కోసం
  rationale: దత్తి విభక్తిలోని ప్రయోజన/సంబంధ భావాన్ని తెలుపుతుంది; సందర్భంలో ఏ సోదరుడో అయోమయం రాకుండా ‘చనిపోయిన’ అని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: లేవిరేట్ వివాహ ధర్మశాస్త్ర భాషను తరువాతి సిద్ధాంత లేదా సాంస్కృతిక వివరణలు చేర్చకుండా అనువదించడం
  choice: ఆ భార్యను స్వీకరించి, చనిపోయిన తన సోదరుని కోసం సంతానాన్ని కలిగించాలి
  alternative: ఆ విధవరాలిని పెళ్లి చేసుకొని, తన సోదరుని పేరున పిల్లలను కనాలి
  rationale: ఎంచుకున్న రూపం ధర్మశాస్త్ర ఆజ్ఞ స్వరాన్ని, మరణించిన సోదరుని కోసం వంశాన్ని కొనసాగించే భావాన్ని కాపాడుతుంది; ‘విధవరాలు’, ‘పేరున’ వంటి సందర్భోచిత వివరణలను ప్రధాన పాఠ్యంలో అనవసరంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ధర్మశాస్త్ర ఉల్లేఖనపు న్యాయ స్వరాన్ని నిలుపుతూ, అసహజమైన అక్షరానువాదాన్ని నివారించింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
