  to: 'వారు ఇలా అన్నారు: “బోధకుడా, మోషే మన కోసం ఇలా రాశాడు: ఒకరి సోదరుడు భార్య ఉండగా మరణించి, అతనికి సంతానం లేకపోతే,[a] అతని సోదరుడు ఆ భార్యను తన భార్యగా స్వీకరించి, చనిపోయిన తన సోదరుని కోసం సంతానాన్ని కలుగజేయాలి.[b]”'
  rationale: 'The revision retains the Greek syntax and legal tone while improving Telugu clarity at the two key idioms: taking the deceased brother’s wife as wife, and providing offspring on behalf of the deceased brother. The footnotes remain anchored at the relevant clauses and preserve the stated lexical alternative and Deuteronomy 25:5 allusion.'
