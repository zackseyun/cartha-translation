source:
  edition: SBLGNT
  text: ἑπτὰ οὖν ἀδελφοὶ ἦσαν· καὶ ὁ πρῶτος λαβὼν γυναῖκα ἀπέθανεν ἄτεκνος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/029.yaml
  text: There were seven brothers; and the first[a], having taken a wife, died childless.
translation:
  language: te
  text: అయితే, ఏడుగురు అన్నదమ్ములు ఉండేవారు. మొదటివాడు పెళ్లి చేసుకొని[a], సంతానం లేకుండానే చనిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘భార్యను తీసుకొని.’ ఇది పెళ్లి చేసుకోవడాన్ని సూచించే గ్రీకు నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτὰ
  choice: ఏడుగురు
  rationale: మనుషులను లెక్కించే సహజమైన తెలుగు సంఖ్యారూపం; ఇది ‘అన్నదమ్ములు’ను విశేషిస్తుంది.
- source_word: οὖν
  choice: అయితే
  rationale: ముందున్న మాటకు కొనసాగింపుగా ఊహాత్మక సందర్భాన్ని ప్రవేశపెట్టే అనుసంధాన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; బలమైన తార్కిక నిర్ధారణను రుద్దదు.
- source_word: ἀδελφοὶ
  choice: అన్నదమ్ములు
  rationale: ఈ సందర్భంలో ఒకే కుటుంబానికి చెందిన పురుష సహోదరులను స్పష్టంగా, సహజంగా సూచిస్తుంది.
- source_word: ὁ πρῶτος
  choice: మొదటివాడు
  rationale: క్రమంలో మొదటి సహోదరుణ్ణి సూచిస్తుంది; వయసులో పెద్దవాడని మూలపాఠం స్పష్టంగా చెప్పదు.
- source_word: λαβὼν γυναῖκα
  choice: పెళ్లి చేసుకొని
  rationale: ‘భార్యను తీసుకొని’ అనే గ్రీకు వివాహ సంబంధ నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తూ, కర్తృవాచక క్రియావిశేషణ నిర్మాణంలోని కాలక్రమాన్ని నిలుపుతుంది.
- source_word: γυναῖκα
  choice: పెళ్లి చేసుకొని అనే నుడికారంలో భార్య భావం
  rationale: వివాహ సందర్భంలో γυνή అంటే కేవలం ‘స్త్రీ’ కాదు, ‘భార్య’; తెలుగులో మొత్తం నుడికారాన్ని ‘పెళ్లి చేసుకొని’ అని సహజంగా అనువదించడం సరైనది.
- source_word: ἀπέθανεν
  choice: చనిపోయాడు
  rationale: సూటిగా, సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక తెలుగు వ్యక్తీకరణ.
- source_word: ἄτεκνος
  choice: సంతానం లేకుండానే
  rationale: పిల్లలు కలగకుండానే మరణించాడనే కథనపరమైన, న్యాయపరమైన ప్రాముఖ్యతను సంక్షిప్తంగా తెలియజేస్తుంది.
