  edition: SBLGNT
  text: Τὸ βάπτισμα Ἰωάννου ἐξ οὐρανοῦ ἦν ἢ ἐξ ἀνθρώπων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/004.yaml
  text: Was John's baptism from heaven or from men?[a]
translation:
  language: te
  text: యోహాను బాప్తిస్మం పరలోకం నుండి వచ్చిందా, లేక మనుషుల నుండి వచ్చిందా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని నుండి’; గ్రీకులో అక్షరార్థంగా, ‘పరలోకం నుండి.’ ఇది దైవిక మూలాన్ని లేదా అధికారాన్ని గౌరవసూచకంగా చెప్పే విధానం.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: బాప్తిస్మం
  rationale: యోహానుతో సంబంధమున్న ఆచారాన్ని సూచించే నామవాచకం; ఆధునిక తెలుగు క్రైస్తవ వాడుకలో ఇది స్పష్టమైన, స్థిరపడిన సమానార్థకం.
- source_word: Ἰωάννου
  choice: యోహాను ఇచ్చిన
  rationale: గ్రీకు షష్ఠీ విభక్తి యోహానుతో సంబంధమున్న బాప్తిస్మాన్ని సూచిస్తుంది; తెలుగులో సహజంగా, సందర్భానికి తగినట్లుగా సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐξ οὐρανοῦ
  choice: పరలోకం నుండి
  rationale: అక్షరార్థంగా ‘పరలోకం నుండి’; దేవుని మూలం లేదా అధికారాన్ని గౌరవసూచకంగా తెలిపే యూదీయ నుడికారాన్ని వ్యాఖ్యానించి మార్చకుండా నిలుపుతుంది.
- source_word: ἐξ ἀνθρώπων
  choice: మనుషుల నుండి
  rationale: దైవిక మూలానికి విరుద్ధంగా మానవ మూలం లేదా అధికారాన్ని సూచిస్తుంది; ἀνθρώπων ఇక్కడ లింగనిరపేక్షమైన సాధారణ మానవ సూచన.
- source_word: ἦν
  choice: వచ్చిందా
  rationale: గ్రీకులో ‘ఉండెనా’ అనే సంధానక్రియ ఉన్నప్పటికీ, మూలాన్ని తెలిపే పదబంధాలతో తెలుగులో ‘నుండి వచ్చిందా’ అనడం సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: ἢ
  choice: లేక
  rationale: ప్రశ్నలోని రెండు ప్రత్యామ్నాయాలను సహజమైన తెలుగులో స్పష్టంగా కలుపుతుంది.
theological_decisions:
- issue: యోహాను బాప్తిస్మానికి సంబంధించి ‘పరలోకం నుండి’ అనే మాట భావం
  choice: ప్రధాన పాఠ్యంలో ‘పరలోకం నుండి’ అనే నుడికారాన్ని నిలుపడం
  alternative: ‘దేవుని నుండి’
  rationale: ఈ పదబంధం దైవిక మూలాన్ని లేదా అధికారాన్ని సూచించినా, గ్రీకు పాఠ్యం నేరుగా ‘పరలోకం నుండి’ అంటుంది. దానిని నిలపడం మూలంలోని గౌరవసూచక నుడికారాన్ని, దాని వ్యాఖ్యాన విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ప్రశ్నారూపం వాడబడింది. ‘పరలోకం నుండి’ అనే మూల నుడికారాన్ని ప్రధాన పాఠ్యంలో ఉంచి, దాని దైవిక సూచనను పాదటిప్పణిలో వివరించాం.
