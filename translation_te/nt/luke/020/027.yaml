id: LUK.20.27
reference: Luke 20:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Προσελθόντες δέ τινες τῶν Σαδδουκαίων, οἱ ⸀ἀντιλέγοντες ἀνάστασιν μὴ εἶναι, ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/027.yaml
  text: Then some of the Sadducees[a], who deny that there is a resurrection, came up and questioned him,
translation:
  language: te
  text: అప్పుడు పునరుత్థానం లేదని చెప్పే సద్దూకయ్యులలో కొందరు ఆయన దగ్గరకు వచ్చి ఆయనను ప్రశ్నించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσελθόντες
  choice: దగ్గరికి వచ్చి
  rationale: ప్రధాన క్రియకు ముందు యేసువైపు చేరడాన్ని సూచించే aorist participle భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δέ
  choice: అప్పుడు
  rationale: ఇక్కడ బలమైన వ్యతిరేకత కంటే కథన పురోగతిని సూచిస్తుంది.
- source_word: τινες τῶν Σαδδουκαίων
  choice: సద్దూకయ్యులలో కొందరు
  rationale: గ్రీకులోని partitive నిర్మాణాన్ని తెలుగులో సహజంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: οἱ ἀντιλέγοντες
  choice: వాదిస్తారు
  rationale: ἀντιλέγω యొక్క ‘వ్యతిరేకంగా చెప్పడం/అంగీకరించకపోవడం’ అనే భావాన్ని, తరువాతి μὴ εἶναι వాక్యభాగంతో కలిసి వారి ప్రకటిత స్థితిగా చూపిస్తుంది; కేవలం సంభాషణలో విభేదించడం అనే అర్థానికి పరిమితం కాదు.
- source_word: ἀνάστασιν μὴ εἶναι
  choice: పునరుత్థానం లేదని
  rationale: పునరుత్థానం ఉనికిని వారు నిరాకరించే విషయాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐπηρώτησαν αὐτόν
  choice: ఆయనను ప్రశ్నించారు
  rationale: తరువాతి సందర్భంలోని పరీక్షాత్మక ప్రశ్నను సూచిస్తూ, గ్రీకు క్రియలోని ‘అడగడం/ప్రశ్నించడం’ భావాన్ని గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: పునరుత్థానం గురించి సద్దూకయ్యుల స్థితిని అనువదించడం
  choice: వారు పునరుత్థానం లేదని వాదిస్తారు
  alternative: వారు పునరుత్థానం లేదని చెబుతారు; వారు పునరుత్థానాన్ని నిరాకరిస్తారు
  rationale: గ్రీకు పదబంధం వారి సిద్ధాంతపరమైన అభిప్రాయాన్ని పేర్కొంటుంది. ‘వాదిస్తారు’ ἀντιλέγοντες యొక్క మాటల ద్వారా వ్యతిరేకించే భావాన్ని నిలుపుతూ, మూలం చెప్పనిదాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. మధ్యలోని వివరణను డాష్‌లతో వేరు చేసి గ్రీకు సంబంధవాచక భాగాన్ని స్పష్టంగా ఉంచాం.
