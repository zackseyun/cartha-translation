review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the narrative sequence, the partitive reference to some Sadducees, their rejection of resurrection, and their questioning of Jesus. However, “వాదిస్తారు” can suggest that they merely argue a position; “చెప్పే” more directly reflects οἱ ἀντιλέγοντες together with the content clause and preserves the source’s identifying participial construction.
  naturalness: 'The proposed revision is smoother modern standard Telugu: it places the identifying description directly with “సద్దూకయ్యులలో కొందరు,” avoiding a parenthetical finite clause between dashes.'
  terminology: “సద్దూకయ్యులు” and “పునరుత్థానం” are appropriate established Telugu biblical terms. “ఆయనను ప్రశ్నించారు” suitably renders ἐπηρώτησαν αὐτόν without overstating the hostile or testing character of the question.
  issues:
  - severity: low
    issue: “వాదిస్తారు” is slightly less direct than the Greek identifying description.
    rationale: In this context οἱ ἀντιλέγοντες ἀνάστασιν μὴ εἶναι identifies the Sadducees as those who say/maintain that there is no resurrection. “వాదిస్తారు” is possible but can foreground debate rather than their stated denial.
  - severity: low
    issue: The dash-delimited finite clause is less integrated than the source syntax.
    rationale: Moving the description before the noun phrase naturally represents the Greek attributive participle and improves Telugu flow.
  revised_text: అప్పుడు పునరుత్థానం లేదని చెప్పే సద్దూకయ్యులలో కొందరు ఆయన దగ్గరకు వచ్చి ఆయనను ప్రశ్నించారు.
  revised_footnotes: []
