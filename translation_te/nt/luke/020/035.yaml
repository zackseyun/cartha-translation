  text: οἱ δὲ καταξιωθέντες τοῦ αἰῶνος ἐκείνου τυχεῖν καὶ τῆς ἀναστάσεως τῆς ἐκ νεκρῶν οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/035.yaml
  text: But those who are considered worthy to attain that age and the resurrection from the dead neither marry nor are given in marriage[a][b].
translation:
  language: te
  text: కాని ఆ యుగాన్నీ, మృతులలోనుండి పునరుత్థానాన్నీ పొందడానికి యోగ్యులుగా పరిగణించబడినవారు[a][b] పెళ్లి చేసుకోరు, పెళ్లికి ఇవ్వబడరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యోగ్యులుగా లెక్కించబడినవారు” లేదా “యోగ్యులని భావించబడినవారు.” గ్రీకులో ఇది కర్మణి రూపం; వారు యోగ్యులని తీర్మానించబడినట్లు సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “రాబోయే యుగాన్ని.” అక్షరార్థంగా, “ఆ యుగాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταξιωθέντες
  choice: యోగ్యులుగా ఎంచబడినవారు
  rationale: గ్రీకు పదంలోని కర్మణి భావాన్ని నిలుపుతూ, వారు తమంతట తాము యోగ్యులని ప్రకటించకుండా ఎవరో వారిని యోగ్యులుగా ఎంచారనే లేదా తీర్చారనే భావాన్ని తెలియజేస్తుంది.
- source_word: τοῦ αἰῶνος ἐκείνου
  choice: ఆ యుగాన్ని
  rationale: ἐκείνου అనే నిర్దేశక పదాన్ని నేరుగా నిలుపుతుంది; భావి యుగమనే సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో విప్పి చెప్పకుండా అంత్యకాల సంబంధమైన వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: τυχεῖν
  choice: పొందడానికి
  rationale: γενitive పదాలతో వాడిన τυγχάνω ఇక్కడ పొందడం లేదా భాగం పొందడం అనే అర్థం ఇస్తుంది; తెలుగులో సమన్వయించబడిన ‘ఆ యుగాన్ని’ మరియు ‘పునరుత్థానాన్ని’ రెండింటితో సహజంగా సరిపోతుంది.
- source_word: ἀναστάσεως τῆς ἐκ νεκρῶν
  choice: మృతులలోనుండి పునరుత్థానాన్ని
  rationale: ἐκ అనే పదంలోని ‘మధ్యనుండి/నుండి’ భావాన్ని స్పష్టంగా నిలుపుతూ, తెలుగులో స్థిరమైన బైబిలు పదప్రయోగాన్ని ఉపయోగిస్తుంది.
- source_word: γαμοῦσιν
  choice: పెళ్లి చేసుకోరు
  rationale: వివాహం చేసుకోవడం అనే సాధారణ అర్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: γαμίζονται
  choice: పెళ్లికి ఇవ్వబడరు
  rationale: మొదటి క్రియకు భిన్నంగా ఉన్న కర్మణి రూపాన్ని, ప్రాచీన సామాజిక వివాహ ప్రయోగాన్ని నిలుపుతుంది.
theological_decisions:
- issue: καταξιωθέντες పునరుత్థాన జీవితం వ్యక్తిగత పుణ్యంతో సంపాదించబడుతుందని సూచిస్తుందా?
  choice: ‘యోగ్యులుగా ఎంచబడినవారు’ అని కర్మణి రూపంలో అనువదించడం
  alternative: ‘ఆ యుగానికి యోగ్యులైనవారు’
  rationale: ఎంపిక లేదా తీర్పు అనే గ్రీకు కర్మణి భావాన్ని కాపాడుతుంది; వ్యక్తులు తమ పుణ్యంతో దాన్ని సంపాదిస్తారని చెప్పదు, అదే సమయంలో ఎవరు యోగ్యులుగా ఎంచుతారో పాఠ్యంలో లేని విషయాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘పెళ్లి చేసుకోరు—పెళ్లికి ఇవ్వబడరు’ అనే జత గ్రీకు క్రియల మధ్య వ్యత్యాసాన్ని నిలుపుతుంది. రెండు పాదసూచిక గుర్తులూ సంబంధిత ప్రత్యామ్నాయాలకు వెంటనే ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
