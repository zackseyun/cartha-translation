id: LUK.20.46
reference: Luke 20:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Προσέχετε ἀπὸ τῶν γραμματέων τῶν θελόντων περιπατεῖν ἐν στολαῖς καὶ φιλούντων ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς καὶ πρωτοκλισίας ἐν τοῖς δείπνοις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/046.yaml
  text: Beware of the scribes[a], who want to walk around in long robes, and who love greetings in the marketplaces and the best seats in the synagogues and places of honor at banquets[d][c][b],
translation:
  language: te
  text: పొడవాటి వస్త్రాలు[b] ధరించి తిరగాలని కోరుతూ, సంతస్థలాల్లో వందనాలను, సమాజ మందిరాల్లో ప్రముఖ ఆసనాలను[c], విందుల్లో గౌరవస్థానాలను[d] ఇష్టపడే శాస్త్రుల పట్ల జాగ్రత్తగా ఉండండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శాస్త్రుల విషయంలో అప్రమత్తంగా ఉండండి.’
    reason: lexical_alternative
  - marker: b
    text: ‘పొడవాటి వస్త్రాలు’ అనేవి ప్రతిష్ఠను ప్రదర్శించేలా కనిపించే వస్త్రాలను సూచిస్తాయి.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘సమాజ మందిరాల్లో ముఖ్యాసనాలను.’
    reason: lexical_alternative
  - marker: d
    text: లేదా, ‘విందుల్లో ముఖ్యస్థానాలను’ లేదా ‘ప్రధాన స్థానాలను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: విషయంలో జాగ్రత్తగా ఉండండి
  rationale: హెచ్చరికను తెలిపే బహువచన ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ἀπόతో కూడిన నిర్మాణంలోని ‘వారిపట్ల అప్రమత్తంగా ఉండండి’ అనే భావాన్ని నిలుపుతుంది.
- source_word: γραμματέων
  choice: శాస్త్రులు
  rationale: సువార్తల యూదా సందర్భంలో ధర్మశాస్త్రాన్ని లిఖించి బోధించే వర్గానికి తెలుగులో స్థిరపడిన, సంక్షిప్తమైన పదం.
- source_word: τῶν θελόντων περιπατεῖν
  choice: ధరించి తిరగాలని కోరుకుంటూ
  rationale: θέλωలోని కోరికను, περιπατέωలోని బహిరంగంగా తిరిగే భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἐν στολαῖς
  choice: పొడవాటి అంగీలు ధరించి
  rationale: στολή సూచించే పొడవైన, ప్రతిష్ఠను ప్రదర్శించే వస్త్రాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: φιλούντων
  choice: ఇష్టపడే
  rationale: వారు ప్రజల గౌరవ సూచకాలను బలంగా కోరుకునే స్వభావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀσπασμοὺς ἐν ταῖς ἀγοραῖς
  choice: సంతవీధుల్లో వందనాలను
  rationale: ἀγοράను ప్రజలు కూడే బహిరంగ వాణిజ్య ప్రదేశంగా, ἀσπασμούςను సామాజిక గుర్తింపునిచ్చే వందనాలుగా సంక్షిప్తంగా అందిస్తుంది.
- source_word: πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς
  choice: సమాజ మందిరాల్లో ముఖ్యాసనాలను
  rationale: సమాజ మందిరాల్లో గౌరవప్రధానమైన సీట్లను సూచించే మూలపద భావాన్ని అతిగా వివరణ చేయకుండా నిలుపుతుంది.
- source_word: πρωτοκλισίας ἐν τοῖς δείπνοις
  choice: విందుల్లో గౌరవస్థానాలను
  rationale: ప్రాచీన భోజన ఏర్పాట్లలో అత్యున్నత గౌరవం కలిగిన స్థానాల సామాజిక అర్థాన్ని ఆధునిక పాఠకునికి స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: శాస్త్రులపై సామాజిక-మతపరమైన విమర్శ పరిధి
  choice: పొడవాటి వస్త్రాలు, బహిరంగ వందనలు, ముఖ్యాసనాలు, గౌరవస్థానాలు కోరే లక్షణాలతో శాస్త్రులను వర్ణిస్తూ హెచ్చరికను అనువదించడం
  alternative: ప్రతి శాస్త్రినీ మినహాయింపులేకుండా సంపూర్ణంగా ఖండిస్తున్నట్లు విస్తరించడం
  rationale: గ్రీకు వాక్యంలోని అనుసంధాన విశేషణ భాగాలు విమర్శకు కారణమైన ప్రవర్తనలను తెలియజేస్తాయి. అనువాదం ఆ ఉద్రిక్తతను అలాగే ఉంచి, మూలంలో లేని సమగ్ర doctrinal ఖండనను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి పాటించబడింది. మూలంలోని ఒకే హెచ్చరిక వాక్య నిర్మాణం నిలుపబడింది; జాబితాలోని సమాంతరత స్పష్టంగా ఉంచబడింది. ‘సమాజ మందిరం,’ ‘శాస్త్రులు’ వంటి సువార్త సందర్భానికి పరిచితమైన పదాలను ఉపయోగించి, పాతకాలపు క్లిష్ట రూపాలను నివారించాం.
