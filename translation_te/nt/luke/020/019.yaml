revisions:
- from: అప్పుడు శాస్త్రులు, ముఖ్య యాజకులు ఆ గడియలోనే ఆయన మీద చేతులు వేయాలని చూశారు[a]. అయితే వారు ప్రజలకు భయపడ్డారు. ఎందుకంటే ఆయన ఈ ఉపమానం తమకు వ్యతిరేకంగా చెప్పాడని వారు గ్రహించారు[b].
  to: శాస్త్రులు, ముఖ్య యాజకులు ఆ సమయానికే ఆయన మీద చేతులు వేయాలని యత్నించారు[a]. అయితే వారు ప్రజలకు భయపడ్డారు. ఎందుకంటే ఆయన ఈ ఉపమానం తమకు వ్యతిరేకంగా[b] చెప్పాడని వారు గ్రహించారు.
  rationale: The revision removes an unsupported temporal addition, clarifies the leaders’ intended attempt without stating that it succeeded, and places the alternative-reading footnote directly on the phrase it explains. It preserves the contextual adversative force of πρός αὐτούς while retaining less adversative possibilities in the footnote.
