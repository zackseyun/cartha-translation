id: LUK.20.19
reference: Luke 20:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐζήτησαν οἱ ⸂γραμματεῖς καὶ οἱ ἀρχιερεῖς⸃ ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας ἐν αὐτῇ τῇ ὥρᾳ, καὶ ἐφοβήθησαν ⸂τὸν λαόν⸃, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς ⸂εἶπεν τὴν παραβολὴν ταύτην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/019.yaml
  text: And the scribes and the chief priests sought to lay hands on him in that very hour[a], but they feared the people[b], for they knew that he had told this parable against them.
translation:
  language: te
  text: శాస్త్రులు, ముఖ్య యాజకులు ఆ సమయానికే ఆయన మీద చేతులు వేయాలని యత్నించారు[a]. అయితే వారు ప్రజలకు భయపడ్డారు. ఎందుకంటే ఆయన ఈ ఉపమానం తమకు వ్యతిరేకంగా[b] చెప్పాడని వారు గ్రహించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనను పట్టుకోవాలని’ లేదా ‘ఆయనను అరెస్టు చేయాలని’; అక్షరార్థంగా, ‘ఆయన మీద చేతులు వేయాలని.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తమతో చెప్పాడని’ లేదా ‘తమను గురించి చెప్పాడని.’ సందర్భంలో ఆ ఉపమానం తమను లక్ష్యంగా చేసిందనే భావం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐζήτησαν
  choice: చూశారు
  rationale: వారు అలా చేయాలని ఉద్దేశించి ప్రయత్నించిన భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; కార్యం సఫలమైందని సూచించదు.
- source_word: γραμματεῖς
  choice: శాస్త్రులు
  rationale: సువార్తల చారిత్రక సందర్భంలో ధర్మశాస్త్రాన్ని అధ్యయనం చేసి బోధించే గుర్తించదగిన వర్గానికి ప్రాచుర్యంలో ఉన్న తెలుగు పదం.
- source_word: ἀρχιερεῖς
  choice: ముఖ్య యాజకులు
  rationale: బహువచన రూపం ప్రధాన యాజకత్వ నాయకవర్గాన్ని సూచిస్తుంది; ఒకేసారి అనేకమంది ప్రధాన యాజకులుగా పదవిలో ఉన్నారనే అపార్థాన్ని నివారిస్తుంది.
- source_word: ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: ఆయన మీద చేతులు వేయాలని
  rationale: గ్రీకు నుడికారంలోని దృశ్యరూపాన్ని నిలుపుతూ, పట్టుకోవడం లేదా అరెస్టు చేయడం అనే సందర్భార్థాన్ని అతిగా నిర్దిష్టం చేయకుండా ఉంచుతుంది.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: ఆ గడియలోనే
  rationale: అదే సందర్భంలో వెంటనే చర్య తీసుకోవాలన్న కాలబలాన్ని దగ్గరగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐφοβήθησαν τὸν λαόν
  choice: వారు ప్రజలకు భయపడ్డారు
  rationale: λαός ఇక్కడ కేవలం అక్కడ గుమికూడిన గుంపుకన్నా సాధారణ ప్రజానీకాన్ని సూచిస్తుంది.
- source_word: ἔγνωσαν
  choice: గ్రహించారు
  rationale: ఉపమానం ఎవరిని లక్ష్యంగా చేసిందో వారు గుర్తించిన క్షణాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: πρὸς αὐτοὺς
  choice: తమకు వ్యతిరేకంగా
  rationale: సందర్భంలోని ప్రతికూల, ఎదుర్కొనే భావాన్ని వ్యక్తం చేస్తుంది; మూలంలోని ‘వారి వైపు/వారికి’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: παραβολὴν
  choice: ఉపమానం
  rationale: సినాప్టిక్ సువార్తలలో παραβολήకు స్థిరమైన, సులభంగా అర్థమయ్యే తెలుగు సమానార్థకం.
theological_decisions:
- issue: యేసు చెప్పిన ఉపమానానికి సంబంధించి πρὸς αὐτοὺς యొక్క భావం
  choice: ఆ ఉపమానం మతనాయకులకు వ్యతిరేకంగా చెప్పబడింది.
  alternative: ఆ ఉపమానం వారికి చెప్పబడింది లేదా వారిని గురించి చెప్పబడింది.
  rationale: ముందటి ఉపమానంలో ఖండించబడిన కౌలుదారులు తమనే సూచిస్తున్నారని నాయకులు గ్రహించినట్లు వారి తక్షణ ప్రతిచర్య చూపుతుంది. ‘తమకు వ్యతిరేకంగా’ అనేది సందర్భంలోని ఎదుర్కొనే బలాన్ని కాపాడుతుంది; మరింత అక్షరార్థమైన అవకాశాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘శాస్త్రులు,’ ‘ముఖ్య యాజకులు,’ ‘ఉపమానం’ వంటి సుపరిచిత బైబిలు పదాలను నిలిపి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా ఉంచాం.
