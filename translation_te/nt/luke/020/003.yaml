  source_fidelity: 'ముసాయిదా గ్రీకు భావాన్ని సరిగ్గా ప్రతిబింబిస్తుంది: యేసు ప్రతిస్పందన, ‘నేనూ’లోని పరస్పరత, ఒక ప్రశ్న అడగడం, వారికి తనకు చెప్పమనే ఆజ్ఞ అన్నీ నిలిచాయి. అయితే ἀποκριθεὶς ... εἶπεν అనే పూర్తి వాక్య నిర్మాణాన్ని ‘జవాబిస్తూ’ కంటే ‘జవాబిచ్చి ... అన్నాడు’ అని ఇవ్వడం మరింత నేరుగా, సహజంగా ఉంటుంది.'
  naturalness: ‘అయితే ఆయన వారికి జవాబిస్తూ’ కొంత అసంపూర్ణంగా వినిపిస్తుంది; ‘అయితే ఆయన వారికి జవాబిచ్చి ఇలా అన్నాడు’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన-సంభాషణ రూపం. ముసాయిదాలో తెరిచిన ఉద్ధరణ చిహ్నానికి ముగింపు చిహ్నం లేదు.
