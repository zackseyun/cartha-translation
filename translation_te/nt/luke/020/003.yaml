  yaml_path: translation/nt/luke/020/003.yaml
  text: But in reply he said to them[a], “I also will ask you a question, and you tell me:”
translation:
  language: te
  text: 'అయితే ఆయన వారికి జవాబిచ్చి ఇలా అన్నాడు: “నేనూ మిమ్మల్ని ఒక ప్రశ్న అడుగుతాను; నాకు చెప్పండి:”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν πρὸς αὐτούς
  choice: అయితే ఆయన వారికి జవాబిస్తూ
  rationale: ప్రతిస్పందనను తెలిపే ἀποκριθείς‌ను సహజమైన తెలుగు క్రియావిశేషణ రూపంలో అందిస్తూ, δέ సూచించే స్వల్ప వ్యత్యాసాన్ని ‘అయితే’తో వ్యక్తం చేశాం. గ్రీకులోని ‘జవాబిస్తూ చెప్పాడు’ అనే పునరుక్తిని తెలుగులో సహజంగా కుదించాం.
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ
  choice: నేనూ మిమ్మల్ని ... అడుగుతాను
  rationale: κἀγώలోని ‘నేను కూడా’ అనే పరస్పర ప్రతిస్పందన భావాన్ని ‘నేనూ’ స్పష్టంగా నిలుపుతుంది; ὑμᾶς‌ను ప్రత్యక్ష కర్మగా ‘మిమ్మల్ని’ అని అనువదించాం.
- source_word: λόγον
  choice: ఒక ప్రశ్న
  rationale: λόγος మూలంగా ‘మాట’ లేదా ‘విషయం’ అయినా, ἐρωτάωతో ఈ సందర్భంలో అడిగే విషయాన్ని, అంటే ‘ప్రశ్న’ను సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఒక ప్రశ్న అడుగుతాను’ సహజమైన ప్రయోగం.
- source_word: καὶ εἴπατέ μοι
  choice: నాకు చెప్పండి
  rationale: బహువచన ఆజ్ఞారూపం మరియు μοι యొక్క దత్తివాచక భావం నేరుగా నిలిచాయి. ‘జవాబివ్వండి’ అని భావాన్ని మరింత నిర్దిష్టం చేయకుండా, మూలంలోని ‘చెప్పండి’ను కాపాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి. వచనం తరువాతి ప్రశ్నకు దారితీసే ద్విబిందువుతో ముగుస్తుంది. మూలంలోని భావానికి అవసరం లేని పాదటిప్పణి చేర్చలేదు.
