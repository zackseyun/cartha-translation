id: LUK.20.44
reference: Luke 20:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Δαυὶδ οὖν ⸂αὐτὸν κύριον⸃ καλεῖ, καὶ πῶς ⸂αὐτοῦ υἱός⸃ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/044.yaml
  text: David therefore calls him Lord[a], so how is he his son?
translation:
  language: te
  text: కాబట్టి దావీదు ఆయనను ప్రభువు అని పిలుస్తున్నాడు; అలాంటప్పుడు ఆయన దావీదు కుమారుడు[a] ఎలా అవుతాడు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వంశజుడు.’ గ్రీకులో ‘కుమారుడు’ అని ఉంది; ఈ పదం వంశపారంపర్య భావాన్ని కూడా సూచించగలదు. అయితే ప్రధాన పాఠం వాదనలోని స్పష్టమైన పదాన్ని నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δαυὶδ
  choice: దావీదు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన, మూలనామానికి సరిపడే రూపం.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందున్న కీర్తన ఉల్లేఖనం నుంచి తీసుకునే నిర్ధారణను సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: αὐτὸν κύριον
  choice: ఆయనను ‘ప్రభువు’ అని
  rationale: κύριος యొక్క గౌరవార్థక, మెస్సీయ సంబంధమైన బలాన్ని ‘ప్రభువు’ నిలుపుతుంది; ‘అని’ కలిపి καλεῖ నిర్మాణాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: καλεῖ
  choice: పిలుస్తున్నాడు
  rationale: గ్రీకు వర్తమాన కాలాన్ని, దావీదు వాక్యంలో ఇప్పటికీ కనిపించే సంబోధనగా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: καὶ πῶς
  choice: అలాంటప్పుడు ... ఎలా
  rationale: καί ఇక్కడ ప్రశ్నను ముందరి నిర్ధారణతో అనుసంధానిస్తుంది; ‘అలాంటప్పుడు’ తెలుగులో ఆ తార్కిక ఒత్తిడిని సహజంగా చూపుతుంది.
- source_word: αὐτοῦ υἱός
  choice: దావీదు కుమారుడు
  rationale: గ్రీకులోని ‘అతని కుమారుడు’ అనే స్పష్టమైన బంధపదాన్ని నిలుపుతూ, తెలుగులో సర్వనామ సందిగ్ధత రాకుండా దావీదు పేరును పునరుక్తి చేసింది.
- source_word: ἐστιν
  choice: అవుతాడు
  rationale: తెలుగు గుర్తింపు ప్రశ్నలో ‘ఎలా అవుతాడు?’ అనేది సహజమైన రూపం; గ్రీకు ἐστιν యొక్క భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: మెస్సీయ సంబంధమైన వాదనలో κύριος అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: దావీదు మెస్సీయను తనకంటే ఉన్నతమైన గౌరవస్థానంతో పిలిచే వాదనను ‘ప్రభువు’ నిలుపుతుంది; అదనపు సిద్ధాంతార్థాన్ని వాక్యంలోకి చేర్చదు.
- issue: υἱός పదాన్ని వంశార్థంతో విస్తరించాలా
  choice: కుమారుడు
  alternative: వంశస్థుడు
  rationale: గ్రీకు పాఠం స్పష్టంగా ‘కుమారుడు’ అంటుంది; యేసు ప్రశ్నలోని ఉద్దేశపూర్వక ఉద్రిక్తతను పరిష్కరించకుండా అలాగే నిలుపుతుంది. విస్తృత వంశార్థాన్ని పాదసూచికలో సూచించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన ‘ఆయన’ రూపాన్ని ఉపయోగించింది. వాక్యంలోని తార్కిక, అలంకారిక ప్రశ్నను సహజంగా ఉంచి, ‘కుమారుడు’ అనే మూలపదంలోని ధార్మిక ఉద్రిక్తతను నిలిపింది.
