  text: For they no longer dared to ask him anything.
translation:
  language: te
  text: ఎందుకంటే, వారు ఇక ఆయనను ఏమీ అడగడానికి సాహసించలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκέτι
  choice: ఇక ... లేదు
  rationale: ఇప్పటి నుంచి ఆ చర్య నిలిచిపోయిందనే కాలార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న సందర్భానికి కారణం లేదా వివరణను జోడించే అనుసంధాన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐτόλμων
  choice: సాహసించలేదు
  rationale: τολμάω యొక్క ధైర్యపడడం/తెగించడం అనే భావాన్ని ఇస్తుంది; οὐκέτιతో కలిసి గతంలో ఇక అలా చేయలేకపోయారనే భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: ἐπερωτᾶν
  choice: అడగడానికి
  rationale: ఇక్కడ ప్రశ్న వేయడం అనే సాధారణ భావానికి సహజమైన తెలుగు పదం; సందర్భంలోని సవాలు చేసే స్వభావాన్ని అవసరానికి మించి కఠినతరం చేయదు.
- source_word: αὐτὸν
  choice: ఆయనను
  rationale: యేసును సూచించే సర్వనామాన్ని తెలుగు గౌరవప్రయోగానికి అనుగుణంగా అనువదిస్తుంది.
- source_word: οὐδέν
  choice: ఏమీ
  rationale: నిషేధ వాక్యంలో సంపూర్ణ పరిధిని సహజంగా వ్యక్తం చేస్తూ, ‘ఏ విషయమూ’ అనే భావాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా గౌరవప్రదమైన బైబిలు శైలిని నిలుపుతూ అనువదించబడింది. మూలంలోని వివరణాత్మక γὰρను ‘ఎందుకంటే’గా స్పష్టంగా ఉంచింది.
