  yaml_path: translation/nt/luke/020/007.yaml
  text: So they answered that they did not know where it was from[a].
translation:
  language: te
  text: అప్పుడు వారు, అది ఎక్కడి నుండిదో తమకు తెలియదని జవాబిచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎక్కడి నుండో.” గ్రీకు పదం మూలాన్ని లేదా ఆరంభాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: అప్పుడు
  rationale: సందర్భంలోని కథన కొనసాగింపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; యాంత్రికంగా ‘మరియు’ అని అనువదించలేదు.
- source_word: ἀπεκρίθησαν
  choice: జవాబిచ్చారు
  rationale: ἀποκρίνομαι యొక్క భూతకాల కథనార్థమైన ‘వారు జవాబిచ్చారు’ను సూటిగా, సహజంగా అందిస్తుంది.
- source_word: μὴ εἰδέναι
  choice: తమకు తెలియదని
  rationale: జవాబు చెప్పడాన్ని సూచించే క్రియ తరువాత వచ్చిన నిరాకరణార్థక క్రియార్థక రూపాన్ని తెలుగులో సహజమైన పరోక్ష వాక్యంగా అందిస్తుంది.
- source_word: πόθεν
  choice: ఎక్కడి నుండి వచ్చిందో
  rationale: యోహాను బాప్తిస్మం యొక్క మూలం లేదా ఆరంభం ఎక్కడిదనే భావాన్ని నిలుపుతుంది; సందర్భానికి మించి మూలాన్ని నిర్దిష్టం చేయదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘అది’ మునుపటి వచనంలోని యోహాను బాప్తిస్మాన్ని సూచిస్తుంది; మూలపాఠంలోని సంక్షిప్తతను కాపాడేందుకు దానిని స్పష్టంగా విస్తరించలేదు.
