source:
  edition: SBLGNT
  text: ὅτι δὲ ἐγείρονται οἱ νεκροὶ καὶ Μωϋσῆς ἐμήνυσεν ἐπὶ τῆς βάτου, ὡς λέγει κύριον τὸν θεὸν Ἀβραὰμ ⸀καὶ θεὸν Ἰσαὰκ ⸁καὶ θεὸν Ἰακώβ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/037.yaml
  text: But that the dead are raised[a], even Moses made known in the passage about the bush[b], where he calls the Lord the God of Abraham and the God of Isaac and the God of Jacob.
translation:
  language: te
  text: అయితే మృతులు లేపబడతారనే విషయాన్ని మోషే కూడా పొద గురించిన లేఖన భాగంలో[a] తెలియజేశాడు. అందులో అతడు ప్రభువును అబ్రాహాము దేవుడని, ఇస్సాకు దేవుడని, యాకోబు దేవుడని పిలుస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పొద దగ్గర.” గ్రీకు పదబంధం సంఘటన జరిగిన స్థలాన్ని గానీ, దహించే పొద గురించిన లేఖన భాగాన్ని గానీ సూచించవచ్చు (నిర్గమకాండము 3). ఇక్కడి “ప్రభువు” నిర్గమకాండము 3లోని దైవనామాన్ని సెప్టువజింటు సాధారణంగా అనువదించిన విధానాన్ని ప్రతిబింబిస్తుంది.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ἐγείρονται
  choice: లేపబడతారని
  rationale: వర్తమానకాల కర్మణి రూపాన్ని నిలుపుతూ, మృతుల పునరుత్థానం దేవుని కార్యమనే అంతర్నిహిత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οἱ νεκροὶ
  choice: చనిపోయినవారు
  rationale: వ్యక్తులను సూచించే సమూహార్థక నామవిశేషణానికి ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన సమానం.
- source_word: ἐμήνυσεν
  choice: తెలియజేశాడు
  rationale: ‘తెలియపరచడం, సూచించడం’ అనే భావాన్ని ఇస్తుంది; మోషే అధికారికంగా ప్రకటించాడని అతిశయింపకుండా సాక్ష్యార్థాన్ని నిలుపుతుంది.
- source_word: ἐπὶ τῆς βάτου
  choice: మండుతున్న పొద గురించిన వాక్యభాగంలో
  rationale: ఈ పదబంధం పొద ఉన్న ప్రదేశాన్ని గానీ, నిర్గమకాండము 3లోని పొద గురించిన వాక్యభాగాన్ని గానీ సూచించవచ్చు. ప్రధాన పాఠ్యంలో సందర్భోచితమైన సాహిత్యార్థాన్ని ఇచ్చి, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం. ‘మండుతున్న’ అనేది గుర్తింపుకు సహాయపడే సందర్భస్పష్టీకరణ.
- source_word: ὡς λέγει
  choice: అక్కడ అతడు ... అని పిలుస్తాడు
  rationale: తరువాత వచ్చే ద్వితీయావిభక్తి నిర్మాణానికి అనుగుణంగా, ప్రభువును ఆ విధంగా సంబోధిస్తున్నాడనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κύριον
  choice: ప్రభువును
  rationale: దైవ బిరుదుగా ఉన్న κύριοςకు ప్రాజెక్టు అనుసరించే సాధారణ తెలుగు సమానం; మూల గ్రీకు పాఠ్యాన్ని అనుసరిస్తుంది.
- source_word: θεὸν Ἀβραὰμ καὶ θεὸν Ἰσαὰκ καὶ θεὸν Ἰακώβ
  choice: అబ్రాహాము దేవుడు, ఇస్సాకు దేవుడు, యాకోబు దేవుడు
  rationale: ప్రతి పితరునితో θεόν పునరుక్తిని నిలిపి, యేసు వాదనకు ఆధారమైన నిర్గమకాండపు ఉల్లేఖన లయను కాపాడుతుంది.
theological_decisions:
- issue: సద్దూకయ్యులకు యేసు ఇచ్చిన జవాబులో పునరుత్థాన భాష
  choice: చనిపోయినవారు లేపబడతారని
  alternative: చనిపోయినవారు లేస్తారని
  rationale: కర్మణి రూపాన్ని నిలిపి, లేపే కర్తను పాఠ్యంలో అదనంగా పేర్కొనకుండానే గ్రీకు రూపంలోని దైవకార్య సూచనను కాపాడుతుంది.
- issue: ఇశ్రాయేలు దేవుని గురించిన ఉల్లేఖనంలో κύριος అనువాదం
  choice: ప్రభువు
  alternative: యెహోవా
  rationale: లూకా గ్రీకు పాఠ్యంలో κύριος ఉన్నందున ప్రధాన పాఠ్యంలో ‘ప్రభువు’ అని ఇచ్చాం; నిర్గమకాండములోని దైవనామ నేపథ్యాన్ని పాదసూచికలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. గ్రీకు పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం; ‘వాక్యభాగం’ ద్వారా లేఖనంలోని విభాగ సూచన స్పష్టమవుతుంది.
