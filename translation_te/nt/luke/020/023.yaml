  yaml_path: translation/nt/luke/020/023.yaml
  text: But perceiving their cunning[a], he said to them,
translation:
  language: te
  text: 'అయితే ఆయన వారి కపటయుక్తిని గ్రహించి, వారితో ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατανοήσας
  choice: గ్రహించి
  rationale: ఈ భూతకాల అసమాపక క్రియ యేసు మాట్లాడకముందే వారి ఉద్దేశాన్ని గుర్తించాడనే భావాన్ని ఇస్తుంది. ‘గ్రహించి’ మానసిక అవగాహనను సహజంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ఇక్కడ δέ స్వల్ప వ్యతిరేకతతో కూడిన కథన మలుపును సూచిస్తుంది; ‘అయితే’ ఆధునిక తెలుగులో సహజంగా ఆ సంబంధాన్ని చూపిస్తుంది.
- source_word: αὐτῶν
  choice: వారి
  rationale: πανουργίανను విశేషించే షష్ఠీ విభక్తి సర్వనామానికి తెలుగులో సహజమైన స్వామ్యరూపం.
- source_word: πανουργίαν
  choice: కపటయుక్తిని
  rationale: ఈ పదంలో తెలివిగా పన్నిన, నైతికంగా దురుద్దేశపూరితమైన మోసం అనే భావం ఉంది. ‘కపటయుక్తి’ కపటత్వాన్నీ పన్నాగ స్వభావాన్నీ సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: εἶπεν
  choice: అన్నాడు
  rationale: λέγω యొక్క సాధారణ కథన భూతకాల రూపానికి సహజమైన తెలుగు అనువాదం.
- source_word: πρὸς αὐτούς
  choice: వారితో
  rationale: మాట్లాడే క్రియతో πρός + ద్వితీయా విభక్తి సంబోధితులను సూచిస్తుంది; ‘వారితో ... అన్నాడు’ సహజమైన తెలుగు ప్రయోగం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్తతను నిలిపి ఉంచింది.
