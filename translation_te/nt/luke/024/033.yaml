source:
  edition: SBLGNT
  text: καὶ ἀναστάντες αὐτῇ τῇ ὥρᾳ ὑπέστρεψαν εἰς Ἰερουσαλήμ, καὶ εὗρον ⸀ἠθροισμένους τοὺς ἕνδεκα καὶ τοὺς σὺν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/033.yaml
  text: And rising that very hour[a], they returned to Jerusalem and found the Eleven and those with them gathered together,
translation:
  language: te
  text: అదే గంటలో వారు లేచి యెరూషలేముకు తిరిగి వెళ్లి, కూడి ఉన్న పదకొండుమందిని, వారితో ఉన్నవారిని కనుగొన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేక, “సమావేశమై ఉన్న.” గ్రీకు క్రియావిశేషణం, వారు కనుగొన్నప్పుడు పదకొండుమందీ వారితో ఉన్నవారూ అప్పటికే సమకూడిన స్థితిలో ఉన్నారని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: లేచి
  rationale: ἀνίστημι యొక్క భూతకాల క్రియావిశేషణ రూపం ప్రధాన క్రియకు ముందుగా జరిగిన శారీరక చర్యను సూచిస్తుంది; ‘లేచి’ తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: ఆ గడియలోనే
  rationale: నిర్దిష్టమైన అదే సమయాన్ని, దానిలోని తక్షణత్వపు ఉద్ఘాటనను రెండింటినీ నిలుపుతుంది; కేవలం ‘వెంటనే’ అని భావవిస్తరణ చేయదు.
- source_word: ὑπέστρεψαν
  choice: తిరిగి వెళ్లారు
  rationale: ప్రయాణ సందర్భంలో ὑποστρέφω సూచించే మునుపటి స్థలానికి తిరుగు ప్రయాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Ἰερουσαλήμ
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన స్థలనామ రూపం.
- source_word: εὗρον
  choice: చూశారు
  rationale: ఈ సందర్భంలో వారు అక్కడికి చేరినప్పుడు ఆ సమూహాన్ని ఆ స్థితిలో కనుగొన్నారని సూచిస్తుంది; ‘చూశారు’ సహజమైన తెలుగు కథన రూపం, అయితే ఉద్దేశపూర్వకంగా వెదికి కనుగొన్నారనే అదనపు భావాన్ని చేర్చదు.
- source_word: ἠθροισμένους
  choice: కూడి ఉండడం
  rationale: పరిపూర్ణ కర్మణి క్రియావిశేషణం వారు అప్పటికే సమకూడిన స్థితిలో ఉన్నారని సూచిస్తుంది; ‘కూడి ఉండడం’ ఆ ఫలితస్థితిని నిలుపుతుంది.
- source_word: τοὺς ἕνδεκα
  choice: పదకొండుమంది
  rationale: గ్రీకు మూలంలోని సమూహ సూచనను యథాతథంగా ఉంచుతుంది; మూలంలో లేని ‘అపొస్తలులు’ అనే పదాన్ని చేర్చదు.
- source_word: τοὺς σὺν αὐτοῖς
  choice: వారితో ఉన్నవారు
  rationale: పదకొండుమందితో పాటు ఉన్న ఇతరులను అదనపు గుర్తింపు లేకుండా నేరుగా సూచిస్తుంది.
theological_decisions:
- issue: యూదా లేనందున, బహుశా తోమా కూడా అక్కడ లేకపోయినప్పటికీ ‘పదకొండుమంది’ అనే సూచన
  choice: ‘పదకొండుమంది’ అనే సమూహ నామాన్ని అలాగే ఉంచడం
  alternative: ‘పదకొండుమంది అపొస్తలులు’ లేదా ‘మిగిలిన శిష్యులు’
  rationale: τοὺς ἕνδεκα అనే మూలపాఠం సంప్రదాయ సమూహ సూచనను ఉపయోగిస్తుంది. హాజరైన వారి ఖచ్చిత సంఖ్యను సమన్వయపరచకుండా, మూలంలోని కథన ఉద్రిక్తతను ఇది కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా, అయితే కథన గౌరవాన్ని నిలుపుతూ అనువదించబడింది. గ్రీకు వాక్య నిర్మాణం ప్రకారం ‘కూడి ఉండడం’ అనేది పదకొండుమందినీ వారితో ఉన్నవారినీ కలిపి సూచిస్తుంది. మూలంలో వాక్యం కొనసాగుతున్నందున తుదిలో పూర్తి విరామం పెట్టకుండా వాక్యభాగంగా పరిగణించవచ్చు.
