  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅπως τε παρέδωκαν αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ἄρχοντες ἡμῶν εἰς κρίμα θανάτου καὶ ἐσταύρωσαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/020.yaml
  text: and how our chief priests and rulers handed him over to a sentence of death and crucified him[a][b].
translation:
  language: te
  text: మా ప్రధాన యాజకులూ మా అధికారులూ ఆయనను మరణశిక్ష తీర్పుకు అప్పగించి[a], ఆయనను సిలువ వేశారో కూడా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరణశిక్ష కోసం అప్పగించి” లేక “మరణానికి దోషిగా తీర్పు ఇవ్వడానికి అప్పగించి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆయనను సిలువ వేయించారు”; శిక్షను రోమా అధికారులు అమలు చేశారనే చారిత్రక మధ్యవర్తిత్వాన్ని ఈ అనువాదం మరింత స్పష్టంగా తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως τε
  choice: అంతేకాక, … ఎలా అనే విషయం (తెలుగు వాక్యప్రవాహంలో ప్రత్యక్ష కొనసాగింపుగా)
  rationale: τε ముందటి మాటకు అనుసంధానాన్ని ఇస్తుంది; ὅπως జరిగిన తీరును పరిచయం చేస్తుంది. విడిగా ఉన్న ఈ వచనంలో సహజమైన తెలుగు కొనసాగింపుకోసం ‘అంతేకాక’ వాడబడింది.
- source_word: παρέδωκαν
  choice: అప్పగించి
  rationale: న్యాయపరమైన చర్య కోసం మరొక అధికారానికి ఆయనను అప్పగించారనే భావాన్ని ఇస్తుంది; ‘ద్రోహం చేశారు’ అనే అవసరం లేని సంకుచిత భావాన్ని చేర్చదు.
- source_word: οἱ ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: ఇది అప్పటి ప్రధాన యాజకత్వ నాయకవర్గాన్ని సూచించే స్థిరమైన, స్పష్టమైన తెలుగు పదబంధం.
- source_word: οἱ ἄρχοντες ἡμῶν
  choice: మా అధికారులు
  rationale: ἄρχοντες లోని పాలనా, న్యాయపరమైన అధికార భావాన్ని ‘అధికారులు’ సహజంగా తెలియజేస్తుంది; ἡμῶν లోని ‘మా’ను నిలుపుతుంది.
- source_word: εἰς κρίμα θανάτου
  choice: మరణశిక్ష విధించేలా
  rationale: క్రియాపదబంధం యొక్క న్యాయపరమైన ఫలితాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది. κρίμα లో తీర్పు లేదా శిక్షావిధి భావం ఉంది; ప్రత్యామ్నాయాలను పాదసూచికలో నిలిపాం.
- source_word: ἐσταύρωσαν
  choice: సిలువ వేశారు
  rationale: గ్రీకు భాషలో ఉన్న సకర్మక, ప్రత్యక్ష బాధ్యతను అలాగే నిలుపుతుంది; రోమా అధికారుల ద్వారా చేయించారనే చారిత్రక మధ్యవర్తిత్వాన్ని ప్రధాన పాఠంలో అదనంగా చేర్చదు.
theological_decisions:
- issue: యేసు మరణశిక్ష అమలులో నాయకుల పాత్ర
  choice: ‘ఆయనను సిలువ వేశారు’ అని ప్రత్యక్ష కర్తృత్వంతో అనువదించడం
  alternative: ‘ఆయనను సిలువ వేయించారు’
  rationale: గ్రీకులో ప్రధాన యాజకులు, అధికారులు కర్తలుగా ఉండి క్రియ సకర్మకంగా ఉంది. ప్రత్యక్ష అనువాదం వారి బాధ్యతను బలంగా నిలుపుతుంది; ‘వేయించారు’ అనేది రోమా అధికారులు శిక్షను అమలు చేశారనే చారిత్రక మధ్యవర్తిత్వాన్ని స్పష్టం చేసినా, మూలంలో లేని వివరణను ప్రధాన పాఠంలో చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘మరణశిక్ష’, ‘అప్పగించి’, ‘సిలువ వేశారు’ సాధారణ పాఠకులకు అర్థమయ్యే న్యాయపరమైన మరియు కథన పదాలు. రెండు పాదసూచిక గుర్తులూ ప్రధాన పాఠంలో ఉంచబడ్డాయి.
