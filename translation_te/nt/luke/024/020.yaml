revisions:
- from: అంతేకాక, మా ప్రధాన యాజకులూ అధికారులూ ఆయనకు మరణశిక్ష విధించేలా అప్పగించి[a], ఆయనను సిలువ వేశారు[b].
  to: మా ప్రధాన యాజకులూ మా అధికారులూ ఆయనను మరణశిక్ష తీర్పుకు అప్పగించి[a], ఆయనను సిలువ వేశారో కూడా[b].
  rationale: The revision restores the source’s continuing ‘and how’ syntax, represented in Telugu by the clause-final ‘వేశారో కూడా,’ and replaces the purposive-sounding ‘మరణశిక్ష విధించేలా’ with a legal-sentence expression closer to εἰς κρίμα θανάτου. The direct wording ‘సిలువ వేశారు’ is retained, as the Greek directly attributes the action to the stated leaders; the mediated-agency option remains only in the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T01:35:28Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders παρέδωκαν, ἀρχιερεῖς, ἄρχοντες ἡμῶν, and the direct active force of ἐσταύρωσαν. However, it does not adequately convey ὅπως τε (''and how''): ‘అంతేకాక’ means ‘moreover,’ while the Greek introduces a further narrated event in a dependent ‘how ...’ clause. ‘మరణశిక్ష విధించేలా’ is understandable but shifts εἰς κρίμα θανάτου toward a purpose/result of imposing punishment rather than the judicial sentence or condemnation to which he was handed over.'
  naturalness: ‘ప్రధాన యాజకులు,’ ‘అధికారులు,’ ‘అప్పగించి,’ and ‘సిలువ వేశారు’ are natural modern standard Telugu. A dependent clause ending in ‘వేశారో కూడా’ is appropriate here because the Greek verse itself continues the syntax from the preceding verse. This is more natural and source-faithful than turning the verse into an independent ‘moreover’ statement.
  terminology: ‘ప్రధాన యాజకులు’ accurately represents the plural high-priestly leadership group. ‘మా అధికారులు’ suitably retains both the authority sense of ἄρχοντες and the possessive ἡμῶν. ‘మరణశిక్ష తీర్పు’ preserves the legal sense of κρίμα θανάτου without implying that these leaders themselves formally imposed the penalty.
  issues:
  - severity: medium
    issue: The narrative ‘how’ construction of ὅπως τε is omitted.
    rationale: ‘అంతేకాక’ supplies only an additive connective (‘moreover’). The source says ‘and how our chief priests and rulers ...,’ continuing the report begun in the prior verse. Telugu should retain this with a dependent ‘... వేశారో కూడా’ construction.
  - severity: medium
    issue: ‘మరణశిక్ష విధించేలా’ is less precise for εἰς κρίμα θανάτου.
    rationale: The phrase can suggest handing Jesus over so that the leaders would impose a death penalty. The Greek more directly denotes handing him over in relation to a death judgment/sentence. ‘మరణశిక్ష తీర్పుకు అప్పగించి’ retains the judicial-object sense with less interpretive expansion.
  revised_text: మా ప్రధాన యాజకులూ మా అధికారులూ ఆయనను మరణశిక్ష తీర్పుకు అప్పగించి[a], ఆయనను సిలువ వేశారో కూడా[b].
  revised_footnotes:
  - marker: a
    text: లేదా, “మరణశిక్ష కోసం అప్పగించి” లేక “మరణానికి దోషిగా తీర్పు ఇవ్వడానికి అప్పగించి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆయనను సిలువ వేయించారు”; శిక్షను రోమా అధికారులు అమలు చేశారనే చారిత్రక మధ్యవర్తిత్వాన్ని ఈ అనువాదం మరింత స్పష్టంగా తెలియజేస్తుంది.
    reason: lexical_alternative
  revision_rationale: The revision restores the source’s continuing ‘and how’ syntax, represented in Telugu by the clause-final ‘వేశారో కూడా,’ and replaces the purposive-sounding ‘మరణశిక్ష విధించేలా’ with a legal-sentence expression closer to εἰς κρίμα θανάτου. The direct wording ‘సిలువ వేశారు’ is retained, as the Greek directly attributes the action to the stated leaders; the mediated-agency option remains only in the footnote.
