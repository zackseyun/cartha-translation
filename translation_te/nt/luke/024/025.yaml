revisions:
- from: 'అప్పుడు ఆయన వారితో ఇలా అన్నాడు: “అవివేకులారా,[a] ప్రవక్తలు చెప్పినవన్నీ నమ్మడానికి హృదయంలో ఎంత మందబుద్ధిగలవారిగా ఉన్నారు![b]”'
  to: 'ఆయన వారితో ఇలా అన్నాడు: “ఓ అవివేకులారా,[a] ప్రవక్తలు చెప్పినవన్నిటినీ నమ్మడానికి హృదయంలో ఎంత మందగతిగలవారో![b]”'
  rationale: The revision removes the unsupported temporal addition and replaces ‘మందబుద్ధిగలవారిగా’ with ‘మందగతిగలవారో,’ preserving the Greek contrast between ἀνόητοι and βραδεῖς τῇ καρδίᾳ. It retains the comprehensive ‘ప్రవక్తలు చెప్పినవన్నిటినీ,’ the explicit infinitival sense ‘నమ్మడానికి,’ and the solemn direct-address force of Ὦ.
