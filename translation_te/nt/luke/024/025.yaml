review_pass:
  verdict: revise
  source_fidelity: ‘అప్పుడు’ has no counterpart in the Greek and should not be added. The draft’s ‘మందబుద్ధిగలవారిగా’ shifts βραδεῖς (‘slow/sluggish’) toward intellectual deficiency and partly duplicates ἀνόητοι. A rendering that retains ‘heart’ while expressing slowness in believing is preferable.
  naturalness: The phrase ‘హృదయంలో ఎంత మందబుద్ధిగలవారిగా ఉన్నారు’ is cumbersome in modern standard Telugu. ‘నమ్మడానికి హృదయంలో ఎంత మందగతిగలవారో’ is more idiomatic while maintaining the formal, rebuking register.
  terminology: ‘అవివేకులారా’ suitably conveys ἀνόητοι as lack of understanding, and ‘ప్రవక్తలు’ is the standard term. ‘హృదయం’ should be retained as the source’s designation for the inner person, without making it merely ‘intellect.’
  issues:
  - severity: medium
    issue: The narrative adverb ‘అప్పుడు’ is added.
    rationale: The Greek begins καὶ αὐτὸς εἶπεν, ‘And he said’; it contains no τότε (‘then’). Telugu need not represent καί woodenly, but ‘అప్పుడు’ supplies a temporal nuance absent from the source.
  - severity: medium
    issue: ‘మందబుద్ధిగలవారిగా’ does not accurately represent βραδεῖς τῇ καρδίᾳ.
    rationale: βραδεῖς means slow or sluggish, whereas మందబుద్ధి means dull-witted and overlaps excessively with ἀνόητοι. The source distinguishes lack of understanding from slowness of heart to believe.
  revised_text: 'ఆయన వారితో ఇలా అన్నాడు: “ఓ అవివేకులారా,[a] ప్రవక్తలు చెప్పినవన్నిటినీ నమ్మడానికి హృదయంలో ఎంత మందగతిగలవారో![b]”'
