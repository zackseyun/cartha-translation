source:
  edition: SBLGNT
  text: καὶ αὐτὸς εἶπεν πρὸς αὐτούς· Ὦ ἀνόητοι καὶ βραδεῖς τῇ καρδίᾳ τοῦ πιστεύειν ἐπὶ πᾶσιν οἷς ἐλάλησαν οἱ προφῆται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/025.yaml
  text: And he said to them[a], “O foolish ones[c][b], and slow of heart to believe all that the prophets have spoken!”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “ఓ అవివేకులారా,[a] ప్రవక్తలు చెప్పినవన్నిటినీ నమ్మడానికి హృదయంలో ఎంత మందగతిగలవారో![b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గ్రహింపులేనివారలారా” లేదా “తెలివిలేనివారలారా.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “నమ్మడానికి హృదయంలో మందగతిగలవారు”; దేవుడు చెప్పినదాన్ని అంతరంగంలో విశ్వసించి స్వీకరించడంలో మందకొడిగా ఉండడాన్ని సూచించే నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ αὐτὸς εἶπεν πρὸς αὐτούς
  choice: అప్పుడు ఆయన వారితో ఇలా అన్నాడు
  rationale: కథన కొనసాగింపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; αὐτόςకు అనవసరమైన ప్రత్యేక ఉద్ఘాటనను జోడించదు.
- source_word: Ὦ ἀνόητοι
  choice: అవివేకులారా
  rationale: సంబోధన బలాన్ని నిలుపుతూ, కేవలం నైతిక దుష్టత్వం కాక గ్రహింపులేమిని సూచిస్తుంది.
- source_word: βραδεῖς τῇ καρδίᾳ
  choice: హృదయంలో ఎంత మందబుద్ధిగలవారిగా ఉన్నారు
  rationale: ‘హృదయం’ అనే మూలపాఠ రూపకాన్ని నిలుపుతూ, అంతరంగంలో నమ్మడానికి మందకొడితనాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοῦ πιστεύειν
  choice: నమ్మడానికి
  rationale: βραδεῖς‌తో ఉన్న భావసంబంధాన్ని తెలుగులో సహజమైన ఉద్దేశ్య/సంబంధ రూపంతో అందిస్తుంది.
- source_word: ἐπὶ πᾶσιν οἷς
  choice: చెప్పినవన్నీ
  rationale: ప్రవక్తల మాటలన్నిటినీ కలుపుకొనే సమగ్ర పరిధిని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐλάλησαν
  choice: చెప్పిన
  rationale: ప్రవక్తల పలుకులను సహజ తెలుగులో తెలియజేస్తుంది; ‘మాట్లాడిన’ కంటే ఈ వాక్యనిర్మాణంలో సునిశితంగా ఉంటుంది.
- source_word: οἱ προφῆται
  choice: ప్రవక్తలు
  rationale: ప్రవక్తల సాక్ష్యాన్ని సూచించే ప్రామాణిక తెలుగు పదం.
theological_decisions:
- issue: యేసు చేసిన గద్దింపులోని స్వభావం
  choice: ప్రవక్తల మాటలను గ్రహించి విశ్వసించడంలో ఉన్న అంతరంగ మందకొడితనంపై గద్దింపు
  alternative: కేవలం మేధోపరమైన పొరపాటు లేదా ప్రధానంగా నైతిక దుష్టత్వంపై తీర్పు
  rationale: ἀνόητοι అనే పదాన్ని βραδεῖς τῇ καρδίᾳ మరియు πιστεύειν‌తో కలిపి చదివితే గ్రహింపు, అంతరంగ స్వీకారం, విశ్వాసం అన్నీ దృష్టిలో ఉన్నాయి. అందుకే ‘హృదయం’ మరియు ‘నమ్మడం’ రెండూ నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన గద్దింపు స్వరాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. మూలంలోని ‘హృదయం’ రూపకం పాదటిప్పణి సహాయంతో సంరక్షించబడింది.
