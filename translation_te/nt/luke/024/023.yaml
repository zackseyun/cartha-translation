  verdict: revise
  source_fidelity: The draft correctly takes οἳ λέγουσιν to refer to the angels and retains the present force of λέγουσιν. However, “ఆయన దేహం కనిపించకపోవడంతో” can mean that the body was not visible, rather than that the women did not find it; and “దర్శనం ... కలిగిందని” shifts the perfect infinitive ἑωρακέναι (‘to have seen’) toward an experience that occurred to them. A direct rendering of their not finding and seeing is safer.
  naturalness: The revised sentence is natural modern standard Telugu and avoids the potentially ambiguous passive/causal wording of the draft.
  terminology: “దేహం,” “దేవదూతలు,” “దర్శనం,” and “సజీవంగా ఉన్నాడు” are appropriate to the context and register. The explicit “ఆ దేవదూతలు” correctly resolves the main syntactic reading while the footnote preserves the less likely alternative.
  issues:
