  - severity: medium
    issue: “దేవదూతల దర్శనం కూడా తమకు కలిగిందని” weakens the explicit seeing in ἑωρακέναι.
    rationale: The perfect infinitive reports that the women said they had seen a vision. “దర్శనాన్ని ... చూశామని” preserves this more directly.
