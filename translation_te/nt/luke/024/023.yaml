id: LUK.24.23
reference: Luke 24:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ μὴ εὑροῦσαι τὸ σῶμα αὐτοῦ ἦλθον λέγουσαι καὶ ὀπτασίαν ἀγγέλων ἑωρακέναι, οἳ λέγουσιν αὐτὸν ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/023.yaml
  text: and not finding his body[a], they came saying that they had also seen a vision of angels[b], who say that he is alive.
translation:
  language: te
  text: ఆయన దేహాన్ని కనుగొనక[a], వారు వచ్చి, దేవదూతల దర్శనాన్ని కూడా చూశామని[b], ఆ దేవదూతలు ఆయన సజీవంగా ఉన్నాడని చెబుతున్నారని చెప్పారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'తక్కువ సంభావ్యతగల మరో అన్వయం: “వారు వచ్చి, దేవదూతల దర్శనాన్ని చూశామని, ఆయన సజీవంగా ఉన్నాడని తామే చెబుతున్నామని చెప్పారు.” ఈ అన్వయంలో “చెబుతున్నవారు” దేవదూతలు కాక ఆ స్త్రీలు.'
    reason: alternative_reading
  - marker: b
    text: లేదా, “దేవదూతల దర్శనం సైతం తాము చూశామని.”
    reason: previous_rendering
lexical_decisions:
- source_word: μὴ εὑροῦσαι
  choice: ఆయన దేహం కనిపించకపోవడంతో
  rationale: స్త్రీలనే సూచించే స్త్రీలింగ బహువచన భూతకాల కృదంతాన్ని, ప్రధాన క్రియకు ముందున్న పరిస్థితిగా సహజమైన తెలుగులో కారణ-కాల సంబంధంతో వ్యక్తం చేసింది; μή లోని నిషేధ భావం నిలిచింది.
- source_word: τὸ σῶμα αὐτοῦ
  choice: ఆయన దేహం
  rationale: సమాధి మరియు పునరుత్థాన సందర్భంలో σῶμα యొక్క సాధారణ అర్థాన్ని నేరుగా అందిస్తుంది.
- source_word: ἦλθον λέγουσαι
  choice: వారు వచ్చి … చెప్పారు
  rationale: ἦλθον లోని ‘వచ్చారు’ అనే భావాన్ని ఉంచుతూ, λέγουσαι అనే సహాయక కృదంతాన్ని సహజ తెలుగు వాక్య నిర్మాణంలో ప్రధాన సమాచార క్రియగా వ్యక్తం చేసింది. సందర్భం తిరిగి రావడాన్ని సూచించినా, మూలంలో లేని ‘తిరిగి’ని చేర్చలేదు.
- source_word: καὶ
  choice: కూడా
  rationale: దేహం కనిపించకపోవడమే కాక దేవదూతల దర్శనం కలిగిందనే అదనపు, ఆశ్చర్యకరమైన అంశాన్ని సూచించే అధిరోహక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὀπτασίαν ἀγγέλων
  choice: దేవదూతల దర్శనం
  rationale: ὀπτασία సూచించే అసాధారణ దర్శన భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా ఉంచుతుంది; దర్శనం దేవదూతలకు సంబంధించినదని స్పష్టం చేస్తుంది.
- source_word: ἑωρακέναι
  choice: తమకు కలిగిందని
  rationale: పరోక్ష వాక్యంలో ఉన్న పరిపూర్ణ క్రియారూపాన్ని తెలుగులో సహజమైన దర్శన ప్రయోగంతో అందిస్తుంది; వారు నిజంగా చూసినట్లు చెప్పారనే భావం నిలుస్తుంది.
- source_word: οἳ λέγουσιν
  choice: ఆ దేవదూతలు … చెబుతున్నారని
  rationale: పుంలింగ బహువచన సంబంధసర్వనామానికి సమీప పూర్వపదమైన ‘దేవదూతలు’నే ప్రధాన సూచ్యంగా తీసుకొని, వర్తమాన కాల భావాన్ని ‘చెబుతున్నారు’తో నిలిపింది.
- source_word: αὐτὸν ζῆν
  choice: ఆయన సజీవంగా ఉన్నాడని
  rationale: అనంత క్రియా నిర్మాణాన్ని సహజ తెలుగు పరోక్ష వాక్యంగా మార్చి, ఆయన జీవించి ఉన్నాడనే ప్రకటనను స్పష్టంగా ఉంచింది.
theological_decisions:
- issue: οἳ λέγουσιν అనే సంబంధ ఉపవాక్యపు సూచ్యం
  choice: ‘చెబుతున్నవారు’ దేవదూతలే అని ప్రధాన పాఠ్యంలో స్పష్టం చేయడం
  alternative: ఆ మాట చెబుతున్నవారు స్త్రీలని తీసుకోవడం
  rationale: పుంలింగ బహువచన οἳ కు సమీపంలోని ἀγγέλων సహజమైన వ్యాకరణ పూర్వపదం; ఇది లూకా 24 సందర్భానికీ సరిపోతుంది. తక్కువ సంభావ్యతగల ప్రత్యామ్నాయ అన్వయాన్ని పాదటిప్పణిలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘వచ్చి’ అని మూలంలోని కదలికను ఉంచి, సందర్భం ద్వారా మాత్రమే తెలిసే ‘తిరిగి’ని చేర్చలేదు. ప్రధాన పాఠ్యంలో దేవదూతలనే సూచ్యంగా స్పష్టం చేసినప్పటికీ, అరుదైన ప్రత్యామ్నాయ వాక్యాన్వయాన్ని పాదటిప్పణిలో ఉంచింది.
