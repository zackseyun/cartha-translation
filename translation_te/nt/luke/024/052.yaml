  text: καὶ αὐτοὶ ⸂[προσκυνήσαντες αὐτὸν]⸃ ὑπέστρεψαν εἰς Ἰερουσαλὴμ μετὰ χαρᾶς μεγάλης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/052.yaml
  text: And they[a], after worshiping him, returned to Jerusalem with great joy[b],
translation:
  language: te
  text: వారు ఆయనను ఆరాధించిన తరువాత[a][b], మహా ఆనందంతో యెరూషలేముకు తిరిగి వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘ఆయనను ఆరాధించిన తరువాత’ అనే మాటలు లేవు.
    reason: textual_variant
  - marker: b
    text: లేదా, ‘ఆయనకు సాగిలపడ్డారు’ లేదా ‘ఆయనకు గౌరవవందనం చేశారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτοὶ
  choice: వారు
  rationale: గ్రీకు వాక్యంలోని అనుసంధానాన్ని తెలుగు కథన ప్రవాహంలో సహజంగా ఉంచుతూ, స్పష్టంగా ఉన్న కర్తను ‘వారు’తో తెలిపింది; ‘వారే’ అనడం ఇక్కడ అనవసరమైన ఉద్ఘాటన కలిగిస్తుంది.
- source_word: προσκυνήσαντες αὐτόν
  choice: ఆయనకు సాగిలపడి ఆరాధించిన తరువాత
  rationale: προσκυνέωలో శరీరంతో వంగి గౌరవించడం, ఆరాధించడం అనే భావపరిధి రెండూ ఉన్నాయి. పునరుత్థానానంతర సందర్భంలో ‘ఆరాధించిన’ సముచితం; ‘సాగిలపడి’ చేర్చడం మూలపదంలోని భౌతిక భంగిమను కూడా నిలుపుతుంది. ‘తరువాత’ అఒరిస్టు కృదంత క్రియ ప్రధాన క్రియకు ముందుగా జరిగినదని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ὑπέστρεψαν
  choice: తిరిగి వెళ్లారు
  rationale: వారు ముందున్న స్థలం నుండి యెరూషలేముకు తిరిగిన దిశను సహజ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: εἰς Ἰερουσαλήμ
  choice: యెరూషలేముకు
  rationale: εἰς సూచించే గమ్యాన్ని తెలుగు విభక్తి ‘-కు’ సహజంగా తెలియజేస్తుంది.
- source_word: μετὰ χαρᾶς μεγάλης
  choice: ఎంతో ఆనందంతో
  rationale: χαράను ‘ఆనందం’గా, μεγάλη సూచించే తీవ్రతను ‘ఎంతో’గా సహజమైన, గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: పునరుత్థానుడైన యేసు పట్ల προσκυνέω అర్థం
  choice: సాగిలపడి ఆరాధించిన
  alternative: సాగిలపడిన / గౌరవవందనం చేసిన
  rationale: ఈ సందర్భంలో ‘ఆరాధించిన’ అనే బలమైన అర్థం సముచితమైనప్పటికీ, పదంలోని వంగి నమస్కరించే భావాన్ని ‘సాగిలపడి’ ద్వారా కూడా నిలిపి, దాని భావపరిధిని పూర్తిగా ఒకే సిద్ధాంతపరమైన అర్థానికి కుదించలేదు.
- issue: '[προσκυνήσαντες αὐτόν] పాఠభేదం'
  choice: ప్రధాన పాఠంలో ఉంచి పాదసూచికలో అనిశ్చితిని తెలిపింది
  alternative: ‘ఆయనకు సాగిలపడి ఆరాధించిన తరువాత’ అనే మాటలను ప్రధాన పాఠం నుండి విడిచిపెట్టడం
  rationale: అందించిన SBLGNT పాఠంలో ఈ పదబంధం ఉన్నప్పటికీ దాని పాఠస్థితి అనిశ్చితంగా గుర్తించబడింది. అందుచేత దాన్ని అనువదించి, కొన్ని ప్రాచీన ప్రతుల్లో లేకపోవడాన్ని పాదసూచికలో వెల్లడించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలి. ‘సాగిలపడి ఆరాధించిన’ అనే పదబంధం మూలంలోని భౌతిక భంగిమను, సందర్భానుగుణమైన ఆరాధనా భావాన్ని రెండింటినీ నిలుపుతుంది. పాఠభేదం మరియు పదార్థ ప్రత్యామ్నాయాన్ని ఒకే [a] పాదసూచికలో సంక్షిప్తంగా నమోదు చేసింది.
