- from: వారు ఆయనకు సాగిలపడి ఆరాధించిన తరువాత[a], ఎంతో ఆనందంతో యెరూషలేముకు తిరిగి వెళ్లారు.
  to: వారు ఆయనను ఆరాధించిన తరువాత[a][b], మహా ఆనందంతో యెరూషలేముకు తిరిగి వెళ్లారు.
