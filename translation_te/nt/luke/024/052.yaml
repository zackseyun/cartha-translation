  naturalness: The sentence is fluent modern standard Telugu. The revised wording is more concise and avoids the somewhat redundant combination “సాగిలపడి ఆరాధించిన.” “మహా ఆనందంతో” naturally conveys μετὰ χαρᾶς μεγάλης.
  terminology: “ఆరాధించిన” is suitable here without imposing a theological formulation beyond the contextual sense of προσκυνέω. The lexical ambiguity should be documented separately from the textual-variant note, so readers can distinguish the two issues.
