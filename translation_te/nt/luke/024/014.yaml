  text: And they were talking with one another about all these things that had happened[a].
translation:
  language: te
  text: వారు జరిగిన ఈ విషయాలన్నిటి గురించి ఒకరితో ఒకరు మాట్లాడుకుంటూ ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జరిగిన ఈ సంఘటనలన్నిటి గురించి ఒకరితో ఒకరు సంభాషిస్తూ ఉన్నారు.”
    reason: ὡμίλουν మరియు τῶν συμβεβηκότων కు వరుసగా ‘సంభాషిస్తూ’, ‘సంఘటనలు’ అనే సహజమైన ప్రత్యామ్నాయ పదప్రయోగాలను చూపించడానికి.
lexical_decisions:
- source_word: καὶ
  choice: సందర్భానుసారంగా ప్రత్యేక పదంగా అనువదించలేదు
  rationale: తెలుగులో ముందరి వాక్యంతో కథన సంబంధం సహజంగా కొనసాగుతుంది; ‘మరియు’ అని పెట్టడం అసహజంగా ఉంటుంది, ‘అప్పుడు’ అనడం మూలంలో లేని కాలసూచనను జోడిస్తుంది.
- source_word: αὐτοὶ
  choice: వారు
  rationale: గ్రీకులో కర్త స్పష్టంగా ఉంది. ఇక్కడ స్వల్ప ఉద్ఘాటన ఉన్నప్పటికీ, ‘వారే’ అనడం తెలుగులో అవసరానికి మించిన వ్యత్యాసాన్ని సూచించవచ్చు.
- source_word: ὡμίλουν
  choice: మాట్లాడుకుంటూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న సంభాషణను సూచిస్తుంది. ఈ తెలుగు రూపం పరస్పరంగా సాగుతున్న మాటలను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πρὸς ἀλλήλους
  choice: ఒకరితో ఒకరు
  rationale: ఈ పదబంధం పరస్పర సంభాషణను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ఇది సహజమైన సమానార్థకం.
- source_word: περὶ πάντων
  choice: అన్నిటి గురించి
  rationale: περί సంభాషణ విషయాన్ని సూచిస్తుంది; πάντων ఆ సంఘటనల సమగ్రతను తెలియజేస్తుంది.
- source_word: τῶν συμβεβηκότων τούτων
  choice: జరిగిన ఈ విషయాల
  rationale: సంభవించిన సంఘటనలను సూచించే పరిపూర్ణ కృదంత భావాన్ని ‘జరిగిన’ సహజంగా అందిస్తుంది; ‘ఈ విషయాలు’ మూలంలోని τούτων యొక్క సూచనను నిలుపుతుంది.
