translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కథన గౌరవాన్ని నిలుపుతూ అనువదించబడింది. కొనసాగుతున్న గత చర్యను ‘మాట్లాడుకుంటూ ఉన్నారు’ ద్వారా వ్యక్తం చేసింది.
