- from: అయితే వారంలోని మొదటి రోజున[a], తెల్లవారుజామునే, తాము సిద్ధం చేసిన సుగంధ ద్రవ్యాలను తీసుకొని వారు సమాధి దగ్గరికి వచ్చారు.
  to: అయితే వారంలోని మొదటి రోజున[a], వేకువజామున ఎంతో పొద్దున్నే, వారు తాము సిద్ధం చేసిన సుగంధ ద్రవ్యాలను తీసుకొని సమాధి వద్దకు వచ్చారు.
