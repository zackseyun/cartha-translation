id: LUK.24.1
reference: Luke 24:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῇ δὲ μιᾷ τῶν σαββάτων ὄρθρου βαθέως ⸂ἐπὶ τὸ μνῆμα ἦλθον⸃ φέρουσαι ἃ ἡτοίμασαν ⸀ἀρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/001.yaml
  text: But on the first day of the week[a], at early dawn, they came to the tomb, bringing the spices they had prepared.
translation:
  language: te
  text: అయితే వారంలోని మొదటి రోజున[a], వేకువజామున ఎంతో పొద్దున్నే, వారు తాము సిద్ధం చేసిన సుగంధ ద్రవ్యాలను తీసుకొని సమాధి వద్దకు వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “సబ్బాతులలో మొదటి దినాన”; ఇది వారంలోని మొదటి రోజును సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ μιᾷ τῶν σαββάτων
  choice: అయితే వారంలోని మొదటి రోజున
  rationale: ఇది సెమిటిక్/కొయినే కాలసూచక నుడికారం; సహజమైన తెలుగు అర్థం ‘వారంలోని మొదటి రోజున.’ δέ కథన మలుపును సూచించేందుకు ‘అయితే’గా ఇచ్చాం.
- source_word: ὄρθρου βαθέως
  choice: తెల్లవారుజామునే
  rationale: ఈ పదబంధం అత్యంత వేకువ సమయాన్ని బలంగా సూచిస్తుంది. ‘తెల్లవారుజామునే’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ తీవ్రతను తెలియజేస్తుంది.
- source_word: ἐπὶ τὸ μνῆμα
  choice: సమాధి దగ్గరికి
  rationale: చలనాన్ని సూచించే క్రియతో ἐπί గమ్యస్థానాన్ని తెలియజేస్తుంది. μνῆμαకు ఈ సందర్భంలో ‘సమాధి’ సహజమైన తెలుగు పదం.
- source_word: ἦλθον
  choice: వచ్చారు
  rationale: ఆరిస్టు క్రియ వారి రాకను సాదాసీదాగా నివేదిస్తుంది; తెలుగు కథనంలో ‘వచ్చారు’ సహజం.
- source_word: φέρουσαι
  choice: తీసుకొని
  rationale: ఈ వర్తమాన కృదంతం ప్రధాన క్రియతో సమకాలిక చర్యను సూచిస్తుంది; ‘తీసుకొని ... వచ్చారు’ సహజమైన తెలుగు నిర్మాణం.
- source_word: ἃ ἡτοίμασαν ἀρώματα
  choice: తాము సిద్ధం చేసిన సుగంధ ద్రవ్యాలను
  rationale: ἀρώματα అంత్యక్రియల కోసం ఉపయోగించే సువాసనగల పదార్థాలను సూచిస్తుంది. సంబంధవాచక నిర్మాణాన్ని తెలుగులో సహజమైన క్రమంలో ఇచ్చాం.
theological_decisions:
- issue: పునరుత్థాన సందర్భంలోని τῇ μιᾷ τῶν σαββάτων అనే కాలసూచక నుడికారం
  choice: వారంలోని మొదటి రోజున
  alternative: సబ్బాతులలో మొదటిదానినాడు
  rationale: గ్రీకు పదబంధానికి సాధారణ నుడికారార్థాన్ని ఇచ్చాం. అక్షరానువాదం తెలుగులో అస్పష్టంగా ఉండి, గ్రీకు తప్పనిసరిగా సూచించని ప్రత్యేక కాలగణన భావాన్ని కలిగించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, కథనానికి తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. మూలంలోని స్త్రీల బహువచన సూచనను తెలుగు క్రియారూపం ప్రత్యేకంగా చూపలేకపోయినా, ముందరి సందర్భం ద్వారా అది స్పష్టమవుతుంది.
