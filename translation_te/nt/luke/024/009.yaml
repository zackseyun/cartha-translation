id: LUK.24.9
reference: Luke 24:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὑποστρέψασαι ἀπὸ τοῦ μνημείου ἀπήγγειλαν ταῦτα πάντα τοῖς ἕνδεκα καὶ πᾶσιν τοῖς λοιποῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/009.yaml
  text: And returning from the tomb, they reported all these things to the eleven and to all the rest.
translation:
  language: te
  text: వారు సమాధి నుంచి తిరిగి వచ్చి, ఈ సంగతులన్నిటినీ పదకొండు మందికి, మిగిలిన వారందరికీ తెలియజేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: తిరిగి వచ్చి
  rationale: స్త్రీల బహువచన కర్తను సూచించే ఈ భూతకాల క్రియావిశేష రూపాన్ని తెలుగులో సహజమైన పూర్వకాలిక క్రియారూపంతో వ్యక్తం చేస్తుంది; ప్రధాన క్రియకు ముందుగా వారు తిరిగి వచ్చినట్టు నిలుపుతుంది.
- source_word: μνημείου
  choice: సమాధి
  rationale: యేసును ఉంచిన సమాధి స్థలాన్ని సూచించే ఈ సందర్భంలో ఆధునిక తెలుగు బైబిలు వాడుకలో సహజమైన, స్పష్టమైన పదం.
- source_word: ἀπήγγειλαν
  choice: తెలియజేశారు
  rationale: విన్నదీ చూసినదీ ఇతరులకు నివేదించడం అనే భావాన్ని సహజమైన కథన శైలిలో తెలియజేస్తుంది; ‘ప్రకటించారు’ కంటే ఇక్కడ అనవసరమైన బహిరంగ ప్రకటన భావం రాదు.
- source_word: ταῦτα πάντα
  choice: ఈ సంగతులన్నిటినీ
  rationale: ταῦτα లోని సూచనార్థాన్నీ πάντα లోని సమగ్రతనూ ఒక సహజమైన తెలుగు పదబంధంలో నిలుపుతుంది.
- source_word: τοῖς ἕνδεκα
  choice: పదకొండుమందికి
  rationale: మూలంలో ఉన్న సంప్రదాయ సమూహ designation‌ను మాత్రమే ఇస్తుంది; మూలంలో లేని ‘అపొస్తలులు’ అనే నామవాచకాన్ని చేర్చదు.
- source_word: πᾶσιν τοῖς λοιποῖς
  choice: మిగిలిన వారందరికీ
  rationale: పదకొండుమందికి భిన్నంగా అక్కడున్న విస్తృత శిష్య సమూహంలోని మిగతా వారందరినీ సూచించే భావాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: స్త్రీల బహువచన కర్త
  choice: సందర్భం ద్వారా స్త్రీలనే కర్తగా ఉంచుతూ ‘వారు’ అని అనువదించడం
  alternative: ‘ఆ స్త్రీలు’ అని స్పష్టంగా చేర్చడం
  rationale: ὑποστρέψασαι స్త్రీల బహువచన రూపమైనప్పటికీ, కర్త ముందరి సందర్భం నుంచి స్పష్టమవుతుంది. తెలుగు ‘వారు’ లింగాన్ని వ్యాకరణపరంగా చూపకపోయినా, మూలంలో లేని నామవాచకాన్ని చేర్చకుండా సందర్భ సంబంధాన్ని నిలుపుతుంది.
- issue: అపొస్తలుల సమూహానికి వాడిన designation
  choice: ‘పదకొండుమందికి’ అని మాత్రమే అనువదించడం
  alternative: ‘పదకొండు మంది అపొస్తలులకు’
  rationale: గ్రీకు పాఠం ‘పదకొండుమంది’ అని మాత్రమే చెబుతుంది. ‘అపొస్తలులు’ అని విస్తరించడం సూచ్యార్థాన్ని వివరించినా, మూలపాఠంలో లేని పదాన్ని చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదైనా సాధారణ పాఠకులకు సులభమైన కథన శైలి. వాక్యంలోని వరుస చర్యలు, గ్రహీతల రెండు వర్గాలు స్పష్టంగా నిలుపబడ్డాయి.
