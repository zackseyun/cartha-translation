revisions:
- from: వారు సమాధి దగ్గర నుంచి తిరిగి వచ్చి, ఈ సంగతులన్నిటినీ పదకొండుమందికి, మిగిలిన వారందరికీ తెలియజేశారు.
  to: వారు సమాధి నుంచి తిరిగి వచ్చి, ఈ సంగతులన్నిటినీ పదకొండు మందికి, మిగిలిన వారందరికీ తెలియజేశారు.
  rationale: Changed only ‘సమాధి దగ్గర నుంచి’ to ‘సమాధి నుంచి’ to represent ἀπὸ τοῦ μνημείου precisely, and standardized the spacing in ‘పదకొండు మందికి.’ The feminine-plural subject remains contextually supplied, as in the Greek discourse, without adding an explicit noun absent from this verse.
  reviewer_model: gpt-5.6-terra
