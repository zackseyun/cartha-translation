review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the sequence of returning and reporting, the comprehensive force of ‘all these things,’ and the two recipient groups. However, ‘సమాధి దగ్గర నుంచి’ means ‘from near/by the tomb’ rather than directly ‘from the tomb’ (ἀπὸ τοῦ μνημείου).
  naturalness: The narration is clear and modern. ‘సమాధి నుంచి’ is both more idiomatic in this context and more precise. Spacing ‘పదకొండు మందికి’ follows standard modern Telugu writing practice.
  terminology: ‘సమాధి’ appropriately renders μνημεῖον in this resurrection setting. ‘తెలియజేశారు’ suitably renders ἀπήγγειλαν without adding a public-proclamation nuance. ‘పదకొండు మంది’ retains the source’s unexpanded conventional designation.
  issues:
  - severity: low
    issue: ‘సమాధి దగ్గర నుంచి’ weakens the locative precision of ἀπὸ τοῦ μνημείου.
    rationale: The Greek states that the women returned ‘from the tomb,’ whereas ‘దగ్గర నుంచి’ can indicate departure from the tomb’s vicinity rather than from the tomb itself.
  revised_text: వారు సమాధి నుంచి తిరిగి వచ్చి, ఈ సంగతులన్నిటినీ పదకొండు మందికి, మిగిలిన వారందరికీ తెలియజేశారు.
  revised_footnotes: []
  revision_rationale: Changed only ‘సమాధి దగ్గర నుంచి’ to ‘సమాధి నుంచి’ to represent ἀπὸ τοῦ μνημείου precisely, and standardized the spacing in ‘పదకొండు మందికి.’ The feminine-plural subject remains contextually supplied, as in the Greek discourse, without adding an explicit noun absent from this verse.
