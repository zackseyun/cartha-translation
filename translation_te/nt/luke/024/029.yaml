  text: καὶ παρεβιάσαντο αὐτὸν λέγοντες· Μεῖνον μεθ’ ἡμῶν, ὅτι πρὸς ἑσπέραν ἐστὶν καὶ κέκλικεν ⸀ἤδη ἡ ἡμέρα. καὶ εἰσῆλθεν τοῦ μεῖναι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/029.yaml
  text: But they urged him strongly[a], saying, “Stay with us[b], because it is toward evening and the day has already declined.” And he went in to stay with them.
translation:
  language: te
  text: కానీ వారు ఆయనను, “మాతో ఉండండి; సాయంకాలం సమీపిస్తోంది, పొద్దు ఇప్పటికే వాలిపోయింది[b]” అని ఎంతో పట్టుబట్టారు[a]. మరియు ఆయన వారితో ఉండడానికి లోపలికి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనను గట్టిగా కోరారు”; సాంప్రదాయికంగా, “ఆయనను బలవంతపెట్టారు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పగలు ఇప్పటికే చాలావరకు గడిచిపోయింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβιάσαντο
  choice: ఎంతో పట్టుబట్టారు
  rationale: ఈ సందర్భంలో మధ్యమ వాచక రూపం శారీరక బలవంతాన్ని కాకుండా తీవ్రంగా, పదేపదే కోరడాన్ని సూచిస్తుంది. ‘ఎంతో పట్టుబట్టారు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ తీవ్రతను నిలుపుతుంది.
- source_word: Μεῖνον μεθ’ ἡμῶν
  choice: మాతో ఉండండి
  rationale: ఆతిథ్య సందర్భంలో μένω అంటే అక్కడే ఉండడం; μετά + షష్ఠీ విభక్తి సహవాసాన్ని సూచిస్తుంది. గౌరవార్థక ఏకవచన సంబోధనకు ‘ఉండండి’ సహజమైన తెలుగు రూపం.
- source_word: ὅτι πρὸς ἑσπέραν ἐστὶν
  choice: సాయంకాలం సమీపిస్తోంది
  rationale: πρὸς ἑσπέραν సాయంకాలం ఇంకా పూర్తిగా రాలేదని, అది దగ్గరపడుతోందని సూచిస్తుంది.
- source_word: κέκλικεν ἤδη ἡ ἡμέρα
  choice: పొద్దు ఇప్పటికే వాలిపోయింది
  rationale: κλίνω యొక్క పరిపూర్ణ రూపంలో ఉన్న వాలడం/క్షీణించడం అనే రూపకాన్ని ‘పొద్దు వాలిపోయింది’ అనే సహజ తెలుగు ప్రయోగం నిలుపుతుంది.
- source_word: εἰσῆλθεν τοῦ μεῖναι σὺν αὐτοῖς
  choice: ఆయన వారితో ఉండడానికి లోపలికి వెళ్లాడు
  rationale: εἰσῆλθεν ప్రవేశాన్ని, τοῦ μεῖναι ఉద్దేశాన్ని, σύν సహవాసాన్ని స్పష్టంగా తెలిపే సహజమైన కథన రూపం.
