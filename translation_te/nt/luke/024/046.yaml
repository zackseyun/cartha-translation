    reason: lexical_alternative
  revision_rationale: The revision gives equal syntactic weight to the Messiah’s suffering and rising, matching the coordinated Greek infinitives, while retaining the active sense of ἀναστῆναι. It also uses a natural Telugu scriptural-content construction and smooths the idiomatic resurrection phrase. No doctrinal or modal necessity language has been added.
