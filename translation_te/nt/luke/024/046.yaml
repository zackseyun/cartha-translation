id: LUK.24.46
reference: Luke 24:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὅτι οὕτως ⸀γέγραπται παθεῖν τὸν χριστὸν καὶ ἀναστῆναι ἐκ νεκρῶν τῇ τρίτῃ ἡμέρᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/046.yaml
  text: And he said to them[a], “Thus it is written[b], that the Messiah would suffer and rise from the dead on the third day,”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “ఈ విధంగా రాయబడి ఉంది: మెస్సీయ[a] బాధలు అనుభవిస్తాడు, మూడవ రోజున మృతులలోనుండి[b] లేస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు.” గ్రీకు Χριστός అంటే “అభిషిక్తుడు”; ఇక్కడ అది బిరుదుగా వాడబడింది.
    reason: alternative_reading
  - marker: b
    text: మరింత అక్షరార్థంగా, “మృతుల మధ్యనుండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: రాయబడి ఉంది
  rationale: పరిపూర్ణ కర్మణి రూపం లేఖనంలో రాయబడినది ఇప్పటికీ నిలిచి ఉందనే భావాన్ని సూచిస్తుంది; ఈ తెలుగు ప్రయోగం ఆ కొనసాగుతున్న బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: παθεῖν
  choice: బాధలు అనుభవించి
  rationale: ఇది మెస్సీయకు సంభవించబోయే బాధను తెలిపే అనిశ్చిత క్రియారూపం. ‘బాధలు అనుభవించి’ అనే ప్రయోగం తెలుగులో సహజంగా ఉండి, గ్రీకులో స్పష్టంగా లేని ‘తప్పక’ అనే అవసరార్థాన్ని చేర్చదు.
- source_word: τὸν χριστόν
  choice: మెస్సీయ
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న Χριστός ఇక్కడ వ్యక్తిపేరులా కాక బిరుదుగా పనిచేస్తుంది. ‘మెస్సీయ’ యూదుల లేఖనపరమైన అభిషిక్త రాజు నేపథ్యాన్ని కాపాడుతుంది.
- source_word: ἀναστῆναι
  choice: లేవాలని
  rationale: గ్రీకు రూపం కర్తరి అనిశ్చిత క్రియ; అందువల్ల దాన్ని కర్మణి రూపమైన ‘లేపబడాలని’గా మార్చకుండా, పునరుత్థానాన్ని సూచించే సహజ తెలుగు కర్తరి రూపాన్ని వాడాం.
- source_word: ἐκ νεκρῶν
  choice: మృతులలో నుండి
  rationale: ఇది ‘మృతుల మధ్య నుండి’ అనే గ్రీకు భావాన్ని సన్నిహితంగా కాపాడుతూ తెలుగులో అర్థమయ్యే పునరుత్థాన ప్రయోగం.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: మూడవ రోజున
  rationale: కాలాన్ని సూచించే దత్తివును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὕτως
  choice: ఈ విధంగా
  rationale: రాయబడి ఉన్న విషయాన్ని పరిచయం చేసే గంభీరమైన లేఖన శైలిని, అలాగే ‘ఈ ప్రకారం’ అనే భావాన్ని కాపాడుతుంది.
- source_word: ὅτι
  choice: ':'
  rationale: గ్రీకులో ఇది రాయబడి ఉన్న విషయాన్ని పరిచయం చేస్తుంది. తెలుగులో ద్విబిందువు ఆ విషయాన్ని స్పష్టంగా, సహజంగా ప్రవేశపెడుతుంది.
theological_decisions:
- issue: శ్రమ–పునరుత్థాన సారాంశంలో Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ పదం వ్యక్తిపేరుగా కాక నిర్దిష్ట బిరుదుగా ఉంది. ‘మెస్సీయ’ అనువాదం అభిషిక్తుని గురించిన లేఖన నేపథ్యాన్ని నిలుపుతుంది; ప్రాచుర్యంలో ఉన్న ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో ఇస్తుంది.
- issue: ἀναστῆναι అనే పునరుత్థాన క్రియ యొక్క వాచ్యం
  choice: లేవాలని
  alternative: లేపబడాలని
  rationale: మూలంలోని క్రియ కర్తరి రూపంలో ఉంది. కొత్త నిబంధనలో దేవుడు యేసును లేపాడనే కర్మణి వాక్యాలు ఉన్నప్పటికీ, ఈ వచనంలోని రూపాన్ని మార్చకుండా కర్తరి భావాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. ‘ఇలా అన్నాడు’ సంభాషణను సహజంగా పరిచయం చేస్తుంది; ‘ఈ విధంగా రాయబడి ఉంది’ లేఖన సూత్రప్రయోగాన్ని నిలుపుతుంది.
