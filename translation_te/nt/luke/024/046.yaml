revisions:
- from: 'ఆయన వారితో ఇలా అన్నాడు: “మెస్సీయ[a] బాధలు అనుభవించి, మూడవ రోజున మృతులలో నుండి[b] లేవాలని ఈ విధంగా రాయబడి ఉంది.”'
  to: 'ఆయన వారితో ఇలా అన్నాడు: “ఈ విధంగా రాయబడి ఉంది: మెస్సీయ[a] బాధలు అనుభవిస్తాడు, మూడవ రోజున మృతులలోనుండి[b] లేస్తాడు.”'
  rationale: The revision gives equal syntactic weight to the Messiah’s suffering and rising, matching the coordinated Greek infinitives, while retaining the active sense of ἀναστῆναι. It also uses a natural Telugu scriptural-content construction and smooths the idiomatic resurrection phrase. No doctrinal or modal necessity language has been added.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T01:35:30Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the active resurrection verb and the temporal phrase, but its construction “బాధలు అనుభవించి ... లేవాలని” makes the suffering a completed participial precondition and grammatically attaches the infinitival force chiefly to rising. The two coordinated Greek infinitives should be represented in parallel.
  naturalness: “మృతులలో నుండి” is understandable but “మృతులలోనుండి” is the more natural unified modern Telugu form. A colon after “రాయబడి ఉంది” naturally introduces the content of the scriptural formula.
  terminology: “మెస్సీయ” appropriately renders the titular τὸν χριστόν. The alternative “క్రీస్తు” footnote is suitable. “మృతుల మధ్య నుండి” is a valid more literal alternative, with spelling smoothed to “మృతుల మధ్యనుండి.”
  issues:
  - severity: medium
    issue: The coordinated infinitives are not represented in parallel.
    rationale: παθεῖν and ἀναστῆναι are coordinated under γέγραπται. “బాధలు అనుభవించి ... లేవాలని” instead presents suffering as a prior participial action and makes “లేవాలని” the sole explicitly stated written content. Parallel finite future verbs after a colon preserve the twofold content without importing necessity.
  - severity: low
    issue: Spacing in the resurrection expression is less natural.
    rationale: Modern Telugu normally writes this expression as “మృతులలోనుండి”; the change is stylistic and does not alter meaning.
  revised_text: 'ఆయన వారితో ఇలా అన్నాడు: “ఈ విధంగా రాయబడి ఉంది: మెస్సీయ[a] బాధలు అనుభవిస్తాడు, మూడవ రోజున మృతులలోనుండి[b] లేస్తాడు.”'
  revised_footnotes:
