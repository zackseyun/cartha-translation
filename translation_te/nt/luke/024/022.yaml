lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: అయితే
  rationale: ముందటి నిరాశాభావానికి వ్యతిరేక మలుపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; తరువాతి వాక్యంలోని స్త్రీల ప్రస్తావనే అదనపు ఆశ్చర్యకర అంశాన్ని స్పష్టం చేస్తుంది.
- source_word: γυναῖκές τινες ἐξ ἡμῶν
  choice: మా మధ్యనున్న కొందరు స్త్రీలు
  rationale: ఆ స్త్రీలు శిష్యుల వర్గానికి చెందినవారని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐξέστησαν ἡμᾶς
  choice: మమ్మల్ని ఆశ్చర్యానికి గురిచేశారు
  rationale: తీవ్రమైన ఆశ్చర్యం లేదా కలవరాన్ని కలిగించడం అనే క్రియ బలాన్ని నిలుపుతూ, వారు నమ్మారా లేదా నమ్మలేదా అని ముందుగానే నిర్ణయించదు.
- source_word: γενόμεναι ὀρθριναὶ
  choice: వారు తెల్లవారుజామున ... వెళ్లారు
  rationale: గ్రీకు కృదంత నిర్మాణాన్ని తెలుగులో సహజమైన సమాపక వాక్యంగా మార్చి, ఉదయాన్నే అక్కడికి చేరిన భావాన్ని తెలియజేస్తుంది.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: సమాధి దగ్గరికి
  rationale: ἐπί + accusative లోని గమ్యదిశ భావాన్ని చూపుతుంది; యేసును ఉంచిన సమాధి సందర్భానికి ‘సమాధి’ సహజమైన పదం.
theological_decisions:
- issue: పునరుత్థాన నివేదిక సందర్భంలో ἐξέστησαν యొక్క భావబలం
  choice: ఆశ్చర్యానికి గురిచేశారు
  alternative: దిగ్భ్రాంతికి గురిచేశారు; కలవరపరిచారు
  rationale: స్త్రీల నివేదికకు శిష్యుల ప్రతిస్పందనను బలంగా తెలియజేస్తుంది; అయితే వారి నమ్మకం లేదా అవిశ్వాసాన్ని గ్రీకు వచనం చెప్పినదానికంటే ఎక్కువగా నిర్ధారించకుండా కథనంలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా గ్రీకు కృదంతాన్ని రెండు వాక్యాలుగా వ్యక్తం చేశాం. గౌరవప్రదమైన కథన శైలిని, మూలంలోని అనిశ్చిత ప్రతిస్పందనను నిలిపాం.
