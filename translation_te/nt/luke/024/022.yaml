  text: But also[a], some women from among us astonished us, having gone early in the morning to the tomb[b],
translation:
  language: te
  text: అయితే, మా మధ్యనున్న కొందరు స్త్రీలు కూడా మమ్మల్ని ఆశ్చర్యానికి గురిచేశారు[a]. వారు తెల్లవారుజామున సమాధి వద్దకు వెళ్లారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దిగ్భ్రాంతికి గురిచేశారు,” “కలవరపరిచారు.” గ్రీకు క్రియ తీవ్రమైన ఆశ్చర్యాన్ని లేదా అయోమయాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
