- from: అయితే, మా మధ్యనున్న కొందరు స్త్రీలు మమ్మల్ని ఆశ్చర్యానికి గురిచేశారు[a]. వారు తెల్లవారుజామున సమాధి దగ్గరికి వెళ్లారు[b].
  to: అయితే, మా మధ్యనున్న కొందరు స్త్రీలు కూడా మమ్మల్ని ఆశ్చర్యానికి గురిచేశారు[a]. వారు తెల్లవారుజామున సమాధి వద్దకు వెళ్లారు[b].
  rationale: “కూడా”ను చేర్చి ἀλλὰ καίలోని అదనపు భావాన్ని నిలిపాము. “సమాధి దగ్గరికి” స్థానంలో “సమాధి వద్దకు” వాడి, మూలంలోని సమాధివైపు/సమాధి వద్దకు వెళ్లిన గమ్యార్థాన్ని మరింత ఖచ్చితంగా, సహజంగా వ్యక్తం చేశాము. మిగిలిన పదప్రయోగం మూలార్థాన్ని, కథనంలోని అనిశ్చిత ప్రతిస్పందనను, మరియు ఆధునిక ప్రామాణిక తెలుగు శైలిని చక్కగా నిలుపుతుంది.
