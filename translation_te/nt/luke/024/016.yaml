  yaml_path: translation/nt/luke/024/016.yaml
  text: But their eyes were kept from recognizing him[a].
translation:
  language: te
  text: అయితే, వారి కళ్లకు ఆయనను గుర్తుపట్టకుండా అడ్డుపడింది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి కళ్లు ఆయనను గుర్తుపట్టకుండా అడ్డగించబడ్డాయి,” లేదా “వారు ఆయనను గుర్తుపట్టకుండా నిరోధించబడ్డారు.” గ్రీకు వాక్యం అలా చేసిన కర్త ఎవరో పేర్కొనదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: కాని
  rationale: యేసు వారితో నడుస్తున్నప్పటికీ వారు ఆయనను గుర్తుపట్టలేకపోయారనే కథన విరుద్ధతను సహజంగా సూచిస్తుంది.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: వారి కళ్లూ
  rationale: మూలంలోని స్పష్టమైన శారీరక చిత్రణను నిలుపుతుంది; కేవలం ‘వారు’ అని భావార్థీకరించదు.
- source_word: ἐκρατοῦντο
  choice: నిరోధించబడ్డాయి
  rationale: బాహ్య కారణం వల్ల అదుపులో ఉంచబడటం లేదా అడ్డగించబడటం అనే నిష్క్రియార్థాన్ని కాపాడుతూ, కర్త ఎవరో పేర్కొనదు.
- source_word: τοῦ μὴ ἐπιγνῶναι
  choice: గుర్తుపట్టకుండా
  rationale: ఈ సందర్భంలో ἐπιγινώσκω సాధారణంగా తెలుసుకోవడం కంటే వ్యక్తిని గుర్తించడం అనే అర్థాన్నిస్తుంది; తెలుగు వాక్యంలో ఫలితార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτόν
  choice: ఆయనను
  rationale: సందర్భంలో యేసును సూచించే గౌరవప్రదమైన తెలుగు సర్వనామం.
theological_decisions:
- issue: వారు గుర్తుపట్టకుండా చేసిన కర్త ఎవరో పేర్కొనాలా
  choice: నిష్క్రియ నిర్మాణాన్ని ఉంచి, కర్తను పేర్కొనకపోవడం
  alternative: ‘దేవుడు వారిని ఆయనను గుర్తుపట్టనివ్వలేదు’ అని దైవకర్తను స్పష్టంగా చేర్చడం; లేదా ‘వారు ఆయనను గుర్తుపట్టలేకపోయారు’ అని నిష్క్రియ భావాన్ని తొలగించడం
  rationale: గ్రీకు మూలంలో నిష్క్రియ క్రియ ఉంది, కాని దాని కర్త చెప్పబడలేదు. కాబట్టి దైవకర్తను చేర్చకుండా, అలాగే కేవలం సహజ అసమర్థతగా మార్చకుండా మూలంలోని ఉద్దేశపూర్వక అనిశ్చితిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘కళ్లూ’ అనే రూపం మూలంలోని దృశ్యాత్మకతను కాపాడుతుంది; ‘నిరోధించబడ్డాయి’ నిష్క్రియార్థాన్ని స్పష్టంగా ఉంచుతుంది.
