  rationale: The revision uses the idiomatic Telugu impersonal expression “కళ్లకు … అడ్డుపడింది.” It retains the source’s concrete eye imagery, the sense that recognition was externally hindered, and the deliberate absence of a stated agent, without asserting divine or any other agency.
