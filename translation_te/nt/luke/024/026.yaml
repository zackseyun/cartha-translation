  text: Was it not necessary for the Messiah to suffer these things and to enter into his glory?[a]
translation:
  language: te
  text: మెస్సీయ ఈ బాధలను అనుభవించి తన మహిమలో ప్రవేశించాల్సి ఉండేది కాదా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు.” ఇక్కడ గ్రీకు బిరుదైన Χριστόςను లేఖన నెరవేర్పు సందర్భంలో దాని భావాన్ని నిలుపడానికి “మెస్సీయ” అని అనువదించాం.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχὶ
  choice: అవసరం కాదా?
  rationale: οὐχί అవుననే సమాధానాన్ని ఆశించే ప్రశ్నను సూచిస్తుంది. తెలుగులో ప్రతికూల ప్రశ్నారూపం ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ταῦτα
  choice: ఈ బాధలన్నీ
  rationale: ταῦτα ముందుగా ప్రస్తావించిన శ్రమలను సూచిస్తుంది. సందర్భాన్ని స్పష్టం చేయడానికి సహజమైన తెలుగులో ‘ఈ బాధలన్నీ’ అని అనువదించబడింది.
- source_word: ἔδει
  choice: అవసరం
  rationale: ἔδει ఇక్కడ దేవుని ప్రణాళిక, లేఖన నెరవేర్పుతో ముడిపడిన అవసరాన్ని సూచిస్తుంది; కేవలం బాహ్య బలవంతాన్ని కాదు.
- source_word: παθεῖν
  choice: అనుభవించి
  rationale: πάσχω బాధలు పడడం లేదా అనుభవించడం అనే అర్థం ఇస్తుంది. ‘ఈ బాధలన్నీ అనుభవించి’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: τὸν χριστὸν
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ వ్యక్తినామం కంటే అభిషిక్తుడనే బిరుదుగా, లేఖన నెరవేర్పు సందర్భంలో వాడబడింది.
- source_word: καὶ
  choice: -ి,
  rationale: రెండు క్రియలను తెలుగులో సహజంగా అనుసంధానించేందుకు మొదటి క్రియను పూర్వకాలిక క్రియారూపంగా ఇచ్చాం; గ్రీకులో లేని ‘తర్వాత’ అనే అదనపు క్రమసూచనను చేర్చలేదు.
- source_word: εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ
  choice: తన మహిమలో ప్రవేశించడం
  rationale: εἰς యొక్క ప్రవేశ భావాన్నీ, αὐτοῦ యొక్క స్వామ్య/సంబంధ భావాన్నీ నేరుగా నిలుపుతుంది.
- source_word: δόξαν
  choice: మహిమ
  rationale: δόξαకు పునరుత్థాన–ఉన్నతీకరణ సందర్భంలో ప్రామాణికమైన, దైవశాస్త్రపరంగా తగిన తెలుగు పదం ‘మహిమ’.
- source_word: αὐτοῦ
  choice: తన
  rationale: తెలుగు వాక్య నిర్మాణంలో కర్త అయిన మెస్సీయను తిరిగి సూచించే సహజమైన రూపం ‘తన’; ఇది మూలంలోని సంబంధాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించదు.
theological_decisions:
- issue: Χριστός పదం అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός లేఖన నెరవేర్పు సందర్భంలో ‘అభిషిక్తుడు’ అనే బిరుదుగా పనిచేస్తుంది. ‘మెస్సీయ’ ఆ బిరుదు భావాన్ని స్పష్టంగా నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: ἔδει పదంలోని అవసర భావం
  choice: అవసరం
  alternative: తప్పనిసరిగా చేయవలసి ఉండడం
  rationale: లూకా పునరుత్థాన వృత్తాంతంలో ఈ అవసరం దేవుని విమోచన ప్రణాళికతో, లేఖన నెరవేర్పుతో సంబంధించింది. ప్రధాన వాక్యంలో కారణాన్ని అదనంగా వివరించకుండా ఆ దైవశాస్త్ర ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం ఉపయోగించబడింది. ‘బాధలన్నీ అనుభవించి’ అనే ప్రయోగం మూలంలోని సూచనను సందర్భానుసారంగా స్పష్టం చేస్తుంది; ‘తన మహిమలో ప్రవేశించడం’ మూలంలోని స్వామ్య భావం మరియు ప్రవేశ రూపకాన్ని నిలుపుతుంది.
