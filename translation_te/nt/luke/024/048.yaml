  text: ὑμεῖς ⸀ἐστε μάρτυρες τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/048.yaml
  text: You are witnesses of these things[a].
translation:
  language: te
  text: మీరు ఈ సంగతులకు సాక్షులు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు వీటికి సాక్షులు.” గ్రీకు సూచన సర్వనామం యేసు ఇంతకుముందు చెప్పిన సంఘటనలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: మీరు
  rationale: బహువచన ద్వితీయ పురుష సర్వనామం మూలంలో స్పష్టంగా ఉండి విషయాన్ని నొక్కిచెబుతుంది; తెలుగులో ‘మీరు’ అని ఉంచడం ఆ బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐστε
  choice: సాక్షులు
  rationale: గ్రీకులో ఇది వర్తమానకాల ‘ఉన్నారు/అవుతారు’ భావాన్ని ఇస్తుంది. తెలుగులో నామవాచక విధేయ వాక్యంలో ‘ఉన్నారు’ను వదలడం సహజం; ‘మీరు … సాక్షులు’ అనే నిర్మాణమే ‘you are witnesses’ భావాన్ని పూర్తిగా అందిస్తుంది.
- source_word: μάρτυρες
  choice: సాక్షులు
  rationale: చూసినవి, విన్నవి గురించి సాక్ష్యం చెప్పేవారిని సూచించే సాధారణమైన, సందర్భోచితమైన పదం. తరువాత ఏర్పడిన ‘హతసాక్షి’ భావాన్ని ఇక్కడ అనవసరంగా చేర్చదు.
- source_word: τούτων
  choice: ఈ సంగతులకు
  rationale: బహువచన సూచన సర్వనామం యేసు ఇంతకుముందు చెప్పిన సంఘటనలను వెనక్కి సూచిస్తుంది. ‘ఈ సంగతులకు’ అనేది తెలుగులో సాక్ష్య సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: శిష్యుల μάρτυρες పాత్ర స్వరూపం
  choice: ఇప్పుడే ప్రస్తావించిన యేసు శ్రమలు, పునరుత్థానం, వాటికి సంబంధించిన ప్రకటన గురించి సాక్ష్యం చెప్పేవారిగా శిష్యులను గుర్తించడం
  alternative: తరువాతి క్రైస్తవ వాడుకలోని హతసాక్షిత్వ భావాన్ని కూడా పదంలో నేరుగా వ్యక్తపరచడం
  rationale: తక్షణ సందర్భంలో ప్రధాన భావం జరిగిన వాటికి సాక్ష్యం చెప్పడమే. తరువాత μάρτυς పదానికి వచ్చిన హతసాక్షి అనుబంధాన్ని అనువాదంలో ముందుగానే చేర్చడం మూలపాఠాన్ని మించి పోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘ఈ సంగతులు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండగా, పాదసూచిక గ్రీకు వాక్యంలోని సంక్షిప్త సూచనను కాపాడుతుంది.
