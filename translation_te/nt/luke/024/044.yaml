id: LUK.24.44
reference: Luke 24:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸂πρὸς αὐτούς⸃· Οὗτοι οἱ λόγοι ⸀μου οὓς ἐλάλησα πρὸς ὑμᾶς ἔτι ὢν σὺν ὑμῖν, ὅτι δεῖ πληρωθῆναι πάντα τὰ γεγραμμένα ἐν τῷ νόμῳ Μωϋσέως ⸀καὶ προφήταις καὶ ψαλμοῖς περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/044.yaml
  text: 'Then he said to them[c][b][a], “These are my words that I spoke to you while I was still with you: that everything written about me in the Law of Moses and the Prophets and the Psalms must be fulfilled.”'
translation:
  language: te
  text: 'అప్పుడు ఆయన వారితో ఇలా అన్నాడు: “నేను ఇంకా మీతో ఉన్నప్పుడు మీతో చెప్పిన మాటలు ఇవే: మోషే ధర్మశాస్త్రంలో, ప్రవక్తల గ్రంథాల్లో, కీర్తనల్లో నా గురించి వ్రాయబడినవన్నీ[a] నెరవేరాలి.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వ్రాయబడిన సంగతులన్నీ.”
    reason: lexical_alternative
  - marker: b
    text: “మోషే ధర్మశాస్త్రం, ప్రవక్తల గ్రంథాలు, కీర్తనలు” అనేది ఇశ్రాయేలు లేఖనాల ప్రధాన విభాగాలను సూచించే అవకాశం ఉంది. “కీర్తనలు” ప్రత్యేకంగా కీర్తనల గ్రంథాన్ని లేదా మరింత విస్తృతంగా “రచనలు” అనే విభాగాన్ని సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: Εἶπεν δὲ πρὸς αὐτούς
  choice: అప్పుడు ఆయన వారితో ఇలా అన్నాడు
  rationale: δέ కథనాన్ని ముందుకు నడిపించే సున్నితమైన అనుసంధానం; ‘అప్పుడు’ సహజమైన తెలుగు ప్రవాహాన్ని ఇస్తుంది. πρὸς αὐτούςను ‘వారితో’గా సహజంగా వ్యక్తం చేశాం.
- source_word: Οὗτοι οἱ λόγοι μου οὓς ἐλάλησα πρὸς ὑμᾶς
  choice: మీతో చెప్పిన మాటలు ఇవే
  rationale: λόγοιకి ‘మాటలు’, ἐλάλησα πρὸς ὑμᾶςకు సహజమైన ‘మీతో చెప్పిన’ను వాడాం. ‘ఇవే’ మూలంలోని సూచనాత్మక బలాన్ని నిలుపుతుంది.
- source_word: ἔτι ὢν σὺν ὑμῖν
  choice: నేను ఇంకా మీతో ఉన్నప్పుడు
  rationale: కృదంత నిర్మాణాన్ని కాలార్థక ఉపవాక్యంగా మార్చి, ἔτιలోని ‘ఇంకా’ భావాన్ని స్పష్టంగా నిలిపాం.
- source_word: δεῖ πληρωθῆναι
  choice: నెరవేరాలి
  rationale: δεῖలోని అవసరతను ‘ఆలి’ రూపం నిలుపుతుంది; πληρόωకు లేఖన నెరవేర్పు సందర్భంలో సహజమైన తెలుగు పదం ‘నెరవేరు’.
- source_word: πάντα τὰ γεγραμμένα
  choice: వ్రాయబడినవన్నీ
  rationale: πάντα యొక్క సమగ్రతను ‘అన్నీ’ నిలుపుతుంది; perfect passive participleను ‘వ్రాయబడిన’గా వ్యక్తం చేశాం.
- source_word: ἐν τῷ νόμῳ Μωϋσέως καὶ προφήταις καὶ ψαλμοῖς
  choice: మోషే ధర్మశాస్త్రంలో, ప్రవక్తల గ్రంథాల్లో, కీర్తనల్లో
  rationale: మూడు గుర్తించదగిన లేఖన విభాగాల భావాన్ని సహజ తెలుగులో తెలిపాం. ‘ప్రవక్తలు’ అనే వ్యక్తులకన్నా గ్రంథసముదాయం ఉద్దేశమని స్పష్టపడేందుకు ‘ప్రవక్తల గ్రంథాలు’ అన్నాం; అదనపు సిద్ధాంతార్థం చేర్చలేదు.
- source_word: περὶ ἐμοῦ
  choice: నా గురించి
  rationale: περί + genitive యొక్క సంబంధార్థాన్ని సాధారణ ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: లేఖనాలు నెరవేరవలసిన అవసరత
  choice: ‘నెరవేరాలి’ అని అనువదించడం
  alternative: ‘నెరవేరవలసి ఉంది’ లేదా ‘నిజం కావాలి’
  rationale: మూలంలోని δεῖ యొక్క దైవిక అవసరత బలాన్ని నిలుపుతూ, ఆ నెరవేర్పు ఎలా జరుగుతుందనే సిద్ధాంతాన్ని వాక్యంలోకి చేర్చకుండా ఉంచుతుంది.
- issue: ‘మోషే ధర్మశాస్త్రం, ప్రవక్తలు, కీర్తనలు’ అనే పదబంధం యొక్క పరిధి
  choice: గుర్తించదగిన లేఖన సముదాయాలుగా అనువదించి, ‘కీర్తనలు’ యొక్క ఖచ్చిత పరిధిని పాదసూచికలో తెరిచి ఉంచడం
  alternative: ‘కీర్తనలు’ను తప్పనిసరిగా మొత్తం ‘రచనలు’ విభాగానికి ప్రతినిధిగా నిర్ధారించడం
  rationale: ఈ పదబంధం ఇశ్రాయేలు లేఖనాల ప్రధాన విభాగాలను సూచించే అవకాశం బలంగా ఉన్నా, ‘కీర్తనలు’ కేవలం కీర్తనల గ్రంథాన్నే సూచిస్తుందా లేక విస్తృతమైన రచనల విభాగాన్నా అన్నది వాక్యం తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. గ్రీకు వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుసరించకుండా, భావక్రమం మరియు ‘నెరవేరాలి’ అనే ధార్మిక బలాన్ని నిలిపాం.
