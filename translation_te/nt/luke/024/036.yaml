lexical_decisions:
- source_word: Ταῦτα
  choice: ఈ సంగతులు
  rationale: నపుంసక బహువచన సూచనార్థక పదం; అప్పుడే చర్చిస్తున్న విషయాలను వెనక్కి సూచిస్తుంది. తెలుగు సహజత్వంతో పాటు బహువచన భావాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: మాట్లాడుతున్నప్పుడు
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణంతో కలిసి సమకాలీనంగా జరుగుతున్న చర్యను సూచిస్తుంది; ప్రత్యేక సముచ్చయ పదం కంటే ‘-తున్నప్పుడు’ నిర్మాణం తెలుగులో కాలసంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτῶν λαλούντων
  choice: వారు ... మాట్లాడుతున్నప్పుడు
  rationale: వర్తమాన కృదంతంతో కూడిన జెనిటివ్ అబ్సల్యూట్ కొనసాగుతున్న మాటల మధ్య జరిగిన సంఘటనను తెలియజేస్తుంది.
- source_word: αὐτὸς
  choice: ఆయనే
  rationale: స్పష్టంగా ఉన్న గ్రీకు సర్వనామంలోని ఉద్ఘాటనను ‘-ఏ’ నిపాతంతో నిలుపుతుంది; యేసును సూచించేందుకు గౌరవప్రదమైన ఆధునిక తెలుగు రూపం వాడబడింది.
- source_word: ἔστη
  choice: నిలబడ్డాడు
  rationale: ἵστημι యొక్క ఏఓరిస్ట్ రూపం నిలిచే స్థితిని స్వీకరించడాన్ని నేరుగా తెలియజేస్తుంది; ‘ప్రత్యక్షమయ్యాడు’ అనే అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: ἐν μέσῳ αὐτῶν
  choice: వారి మధ్య
  rationale: గుంపు నడుమ ఆయన ఉనికిని తెలిపే సహజమైన ఆధునిక తెలుగు వ్యక్తీకరణ.
theological_decisions:
- issue: ‘ఆయన వారితో, “మీకు శాంతి కలుగుగాక” అన్నాడు’ అనే దీర్ఘ బైజాంటైన్ పాఠాన్ని ప్రధాన వచనంలో చేర్చాలా?
  choice: ఇచ్చిన SBLGNT పాఠాన్ని అనుసరించి ప్రధాన వచనంలో చేర్చలేదు.
  alternative: ‘ఆయన వారితో, “మీకు శాంతి కలుగుగాక” అన్నాడు’ అని చేర్చడం.
  rationale: అందించిన గ్రీకు మూలపాఠం ‘వారి మధ్య’తో ముగుస్తుంది. పరిచిత అనువాదాలతో సమన్వయం చేయకుండా మూలపాఠానికే ప్రాధాన్యం ఇచ్చి, ప్రాముఖ్యమైన ప్రత్యామ్నాయ పాఠాన్ని పాదసూచికలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఆయనే’ ద్వారా αὐτός ఉద్ఘాటన నిలుపబడింది; ‘నిలబడ్డాడు’ మూలపదానికి దగ్గరగా ఉండి ప్రత్యక్షత గురించి అదనపు భావాన్ని రుద్దదు.
