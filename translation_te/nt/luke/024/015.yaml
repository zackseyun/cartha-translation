  text: καὶ ἐγένετο ἐν τῷ ὁμιλεῖν αὐτοὺς καὶ συζητεῖν καὶ ⸀αὐτὸς Ἰησοῦς ἐγγίσας συνεπορεύετο αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/015.yaml
  text: And it happened that while they were talking and discussing[b][a], Jesus himself came near and was going with them.
translation:
  language: te
  text: వారు మాట్లాడుకుంటూ చర్చించుకుంటున్నప్పుడు[a], యేసు తానే వారి దగ్గరికి వచ్చి వారితో కలిసి నడుస్తూ ఉన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మాట్లాడుకుంటూ వాదించుకుంటున్నప్పుడు’; గ్రీకు పదం మరింత తీవ్రంగా సాగిన చర్చను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దగ్గరికి వచ్చి వారితో కలిసి నడిచాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: —
  rationale: లూకా వాడే కథన-మార్పు సూత్రాన్ని తెలుగులో ప్రత్యేకంగా ‘జరిగిందేమిటంటే’ అని ఉంచితే వాక్యం బరువుగా ఉంటుంది; కాలసూచక ఉపవాక్యంతోనే సహజంగా వ్యక్తమవుతుంది.
- source_word: ἐν τῷ ὁμιλεῖν
  choice: మాట్లాడుకుంటున్నప్పుడు
  rationale: ἐν + articular infinitive యొక్క కాలార్థాన్ని ‘ఉన్నప్పుడు’ సహజంగా తెలియజేస్తుంది; పరస్పర సంభాషణను ‘మాట్లాడుకుంటూ’ సూచిస్తుంది.
- source_word: συζητεῖν
  choice: చర్చించుకుంటున్నప్పుడు
  rationale: పరస్పరంగా గంభీరంగా పరిశీలించడాన్ని తెలియజేస్తుంది; విభేదం లేదా వాగ్వాదం తప్పనిసరిగా ఉందని అతిగా చెప్పదు.
- source_word: αὐτὸς Ἰησοῦς
  choice: యేసు తానే
  rationale: αὐτός ఇచ్చే వ్యక్తిగత, కథనాత్మక ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἐγγίσας
  choice: వారి దగ్గరికి వచ్చి
  rationale: వారి వైపు సమీపించిన కదలికను సహజ ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: συνεπορεύετο
  choice: వారితో కలిసి నడుస్తూ ఉన్నాడు
  rationale: వారితో పాటు ప్రయాణించిన కొనసాగుతున్న చర్యను imperfect రూపానికి అనుగుణంగా తెలియజేస్తుంది; సందర్భం నడక ప్రయాణం కావడంతో ‘నడుస్తూ’ సహజం.
- source_word: καὶ ... καὶ ... καὶ
  choice: మాట్లాడుకుంటూ చర్చించుకుంటున్నప్పుడు ... వచ్చి ... కలిసి
  rationale: గ్రీకు సంధానాల క్రమాన్ని తెలుగులో సహజమైన అసమాపక క్రియలు, కాలసూచక నిర్మాణం ద్వారా నిలుపుతుంది.
theological_decisions:
- issue: సమీపించిన వ్యక్తి ఎవరనే కథన ఉద్ఘాటన
  choice: యేసు తానే వారి దగ్గరికి వచ్చి
  alternative: యేసు వారి దగ్గరికి వచ్చి
  rationale: αὐτὸς Ἰησοῦς అనే రూపం, పునరుత్థానమైన యేసే వ్యక్తిగతంగా వారిని సమీపించాడనే వ్యాకరణ ఉద్ఘాటనను ఇస్తుంది; దానిని అనువాదంలో తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన కథన శైలి. ‘యేసు తానే’ మూలంలోని ఉద్ఘాటనను కాపాడుతుంది. రెండు పాదసూచిక గుర్తులూ సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
