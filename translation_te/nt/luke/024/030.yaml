id: LUK.24.30
reference: Luke 24:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν λαβὼν τὸν ἄρτον εὐλόγησεν καὶ κλάσας ἐπεδίδου αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/030.yaml
  text: And it happened that[a], when he reclined at the table with them, he took the bread, blessed it, and after breaking it[b], began giving it to them.
translation:
  language: te
  text: 'ఆయన వారితో కలిసి భోజనానికి వాలినప్పుడు[a] ఇలా జరిగింది: రొట్టెను తీసుకొని, ఆశీర్వదించి, దాన్ని విరిచి, వారికి ఇవ్వడం మొదలుపెట్టాడు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారితో కలిసి భోజనానికి కూర్చున్నప్పుడు.’ గ్రీకు పదం మరింత నిర్దిష్టంగా, ప్రాచీన కాలంలో భోజనం చేసేటప్పుడు బల్ల దగ్గర వాలుకొని ఉండే పద్ధతిని సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘వారికి ఇస్తూ ఉన్నాడు.’ గ్రీకు అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న చర్యను నొక్కిచెప్పవచ్చు; ‘ఇవ్వడం మొదలుపెట్టాడు’ అనేది ఈ సందర్భంలో ఆ చర్య ఆరంభమైన క్షణాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ఇలా జరిగింది
  rationale: లూకా రచనలోని కథన సంధిని నిలుపుతూ, ప్రాచీనంగా అనిపించని సహజమైన ఆధునిక తెలుగు ప్రయోగాన్ని ఉపయోగించాం.
- source_word: ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν
  choice: ఆయన వారితో కలిసి భోజనానికి వాలినప్పుడు
  rationale: ἐν τῷతో కూడిన క్రియారూపానికి కాలార్థమైన ‘ఎప్పుడు’ భావాన్ని ఇచ్చి, κατακλίνω సూచించే ప్రాచీన భోజన పద్ధతిలో వాలుకొని ఉండడాన్ని నిలిపాం.
- source_word: λαβὼν τὸν ἄρτον
  choice: ఆయన రొట్టెను తీసుకొని
  rationale: క్రియల సహజ క్రమాన్ని తెలుగులో స్పష్టంగా తెలిపి, నిర్దిష్ట ఉపపదం సూచించే వారి ముందున్న రొట్టెను సూచించాం.
- source_word: εὐλόγησεν
  choice: ఆశీర్వదించి
  rationale: εὐλογέωకు నేరమైన సమానార్థకాన్ని ఎంచుకుని, ‘కృతజ్ఞతలు తెలిపాడు’ అని వేరే గ్రీకు క్రియ భావాన్ని దిగుమతి చేయలేదు; ఎవరిని లేదా దేనిని ఆశీర్వదించాడో మూలంలో ఉన్న సంక్షిప్తతను నిలిపాం.
- source_word: κλάσας
  choice: దాన్ని విరిచి
  rationale: రొట్టెను విరిచే చర్య ఇవ్వడానికి ముందు జరిగిందని సహజమైన తెలుగు క్రియాక్రమంలో తెలిపాం.
- source_word: ἐπεδίδου
  choice: వారికి ఇవ్వడం మొదలుపెట్టాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించగల ఆరంభమవుతున్న లేదా కొనసాగుతున్న చర్యలో, ఈ కథన సందర్భానికి సరిపోయే ఆరంభ భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చాం; కొనసాగింపు భావాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: ఈ భోజన చర్యలకు ప్రభుభోజనం లేదా సంస్కార సంబంధమైన అంతర్భావం ఉందా
  choice: ప్రధాన పాఠ్యంలో సాధారణ భోజన చర్యల భాషనే ఉపయోగించడం
  alternative: ప్రభుభోజనాన్ని మరింత స్పష్టంగా గుర్తుచేసే మతపరమైన పదజాలంతో అనువదించడం
  rationale: ‘తీసుకొని—ఆశీర్వదించి—విరిచి—ఇచ్చాడు’ అనే క్రమం ఇతర భోజన వృత్తాంతాలను గుర్తుచేయవచ్చు; అయితే ఈ వచనం దీనిని సంస్కార కర్మగా స్పష్టంగా పేర్కొనదు. అందువల్ల చర్యల క్రమాన్ని నిలుపుతూ ఏ సంప్రదాయానికీ ప్రత్యేకమైన వ్యాఖ్యానాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. ‘భోజనానికి వాలినప్పుడు’ అనే కొంత అసాధారణమైన ప్రయోగం మూలంలోని ప్రాచీన భోజన భంగిమను నిలుపుతుంది; పాదసూచిక దానిని వివరిస్తుంది. ‘ఆశీర్వదించి’ అనే పదం మూలంలోని సంక్షిప్తతను, సంభావ్య అర్థ విస్తృతిని ఉంచుతుంది.
