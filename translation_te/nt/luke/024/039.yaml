revisions:
- from: “నా చేతులనూ నా పాదాలనూ చూడండి; నేనే అని గుర్తించండి.[a] నన్ను తాకి చూడండి.[b] ఆత్మకు మాంసమూ ఎముకలూ ఉండవు; కాని నాకు అవి ఉన్నాయని మీరు చూస్తున్నారు.”[c]
  to: “నా చేతులనూ నా పాదాలనూ చూడండి; నేనేనని తెలుసుకోండి.[a] నన్ను తాకి చూడండి.[b] ఆత్మకు మాంసమూ ఎముకలూ ఉండవు; మీరు చూస్తున్నట్లుగా నాకు ఉన్నాయి.”[c]
  rationale: సవరణలు మూల గ్రీకులోని మొదటి ὅτι యొక్క అర్థసాధ్యతను ప్రధాన పాఠ్యం మరియు పాదటిప్పణి మధ్య కాపాడతాయి; చివరి καθὼς పోలికను నేరుగా ప్రతిబింబిస్తాయి; అలాగే పాదటిప్పణి a లోని అసంపూర్ణ తెలుగు ప్రత్యామ్నాయాన్ని సరిచేస్తాయి. శారీరక పునరుత్థాన వాస్తవికతపై మూలవాక్యంలోని స్పష్టత యథాతథంగా ఉంది; అదనపు సిద్ధాంత వ్యాఖ్యానం చేర్చబడలేదు.
