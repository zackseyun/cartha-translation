id: LUK.24.39
reference: Luke 24:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἴδετε τὰς χεῖράς μου καὶ τοὺς πόδας μου ὅτι ⸂ἐγώ εἰμι αὐτός⸃· ψηλαφήσατέ με καὶ ἴδετε, ὅτι πνεῦμα σάρκα καὶ ὀστέα οὐκ ἔχει καθὼς ἐμὲ θεωρεῖτε ἔχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/039.yaml
  text: Look at my hands and my feet[a], that it is I myself. Touch me and see[d][c][b], because a spirit does not have flesh and bones as you see that I have.
translation:
  language: te
  text: “నా చేతులనూ నా పాదాలనూ చూడండి; నేనేనని తెలుసుకోండి.[a] నన్ను తాకి చూడండి.[b] ఆత్మకు మాంసమూ ఎముకలూ ఉండవు; మీరు చూస్తున్నట్లుగా నాకు ఉన్నాయి.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “నా చేతులనూ నా పాదాలనూ చూడండి; ఎందుకంటే అది నేనే.” గ్రీకులోని వ్యక్తీకరణ వ్యక్తిగత గుర్తింపును బలంగా నొక్కి చెబుతుంది: “నేనే.”'
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నన్ను స్పర్శించి పరిశీలించండి” లేదా “నన్ను చేతితో తట్టి నిర్ధారించుకోండి.”
    reason: lexical_alternative
  - marker: c
    text: ‘ఆత్మ’ అనే గ్రీకు పదాన్ని ఈ సందర్భంలో కొందరు ‘ప్రేతం’ అని అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: చూడండి
  rationale: బహువచన ఆజ్ఞారూపం తక్షణ దృశ్య పరిశీలనకు పిలుస్తుంది; ఆధునిక తెలుగులో ‘చూడండి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: τὰς χεῖράς μου καὶ τοὺς πόδας μου
  choice: నా చేతులనూ నా పాదాలనూ
  rationale: శరీర భాగాలను నేరుగా అనువదిస్తూ, ఎదుట ఉన్న వ్యక్తి యేసే అని గుర్తించడానికి ఇచ్చిన స్పష్టమైన ఆధారాన్ని నిలుపుతుంది.
- source_word: ὅτι ἐγώ εἰμι αὐτός
  choice: నేనే అని గుర్తించండి
  rationale: ἐγώ మరియు αὐτός కలిగించే వ్యక్తిగత గుర్తింపు, నొక్కిచెప్పడాన్ని ‘నేనే’ నిలుపుతుంది. తెలుగులో ముందున్న ‘చూడండి’తో భావసంబంధాన్ని సహజం చేయడానికి ‘గుర్తించండి’ను అంతర్భావంగా వ్యక్తం చేసింది; కారణార్థాన్ని బలవంతంగా నిర్ణయించలేదు.
- source_word: ψηλαφήσατέ με
  choice: నన్ను తాకి చూడండి
  rationale: ఈ క్రియ స్పర్శించి లేదా చేతితో తట్టి పరిశీలించడాన్ని సూచిస్తుంది. ‘తాకి చూడండి’ భౌతిక నిర్ధారణ భావాన్ని సహజ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: πνεῦμα
  choice: ఆత్మ
  rationale: మూలపదానికి నేరమైన సమానార్థకం. సందర్భంలో శరీరరహిత సత్తాను సూచించినా ‘దయ్యం’ వంటి సాంస్కృతికంగా అధిక అర్థభారం గల పదాన్ని చేర్చలేదు.
- source_word: σάρκα καὶ ὀστέα
  choice: మాంసమూ ఎముకలూ
  rationale: ఇది ఇక్కడ రూపకాలంకారం కాకుండా స్పష్టమైన శారీరక పదబంధం; రెండు అంశాలనూ యథార్థంగా నిలుపుతుంది.
- source_word: θεωρεῖτε ἔχοντα
  choice: నాకు అవి ఉన్నాయని మీరు చూస్తున్నారు
  rationale: ἐμέను విశేషించే కృదంతాన్ని తెలుగులో సహజమైన ఉపవాక్యంగా మార్చి, ప్రత్యక్ష పరిశీలన భావాన్ని నిలిపింది.
theological_decisions:
- issue: పునరుత్థానానంతరం యేసు శరీర వాస్తవికత
  choice: చూడడం, తాకడం, ‘మాంసమూ ఎముకలూ’ అనే స్పష్టమైన శారీరక భాషను యథాతథంగా నిలుపడం
  alternative: శరీర సంబంధ వ్యత్యాసాన్ని మృదువుగా లేదా కేవలం దర్శన అనుభవంగా వ్యాఖ్యానించడం
  rationale: గ్రీకు వాక్యం దృష్టి, స్పర్శ, శరీర భాగాల ద్వారా ప్రత్యక్షమైన దేహ వాస్తవికతను నొక్కి చెబుతుంది. అనువాదం దానిని అదనపు సిద్ధాంత వివరణ లేకుండా నిలుపుతుంది.
- issue: మొదటి ὅτι యొక్క సంబంధం
  choice: ‘నేనే అని గుర్తించండి’—చూడడం ద్వారా గుర్తించవలసిన విషయంగా వ్యక్తీకరణ
  alternative: ‘ఎందుకంటే నేనే’—కారణార్థంగా అనువదించడం
  rationale: ὅτι కారణాన్ని గానీ, గ్రహించవలసిన విషయాన్ని గానీ సూచించగలదు. ఈ సందర్భంలో రెండవ భావం బలంగా సాధ్యమైనందున ప్రధాన పాఠ్యంలో సహజ తెలుగుతో దాన్ని ఇచ్చి, కారణార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవ బహువచన ఆజ్ఞారూపాలను వాడింది. వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా చేయడానికి చివరి పోలికను వ్యతిరేకార్థక ‘కాని’తో స్పష్టీకరించినా, ఆత్మకు లేనిది యేసులో కనిపిస్తున్నదనే మూల భావాన్ని మార్చలేదు. భాష గంభీరంగా, సులభగ్రాహ్యంగా ఉంది.
