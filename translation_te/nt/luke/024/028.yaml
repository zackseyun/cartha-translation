revisions:
- from: వారు తాము వెళ్తున్న గ్రామానికి దగ్గరయ్యారు. ఆయన ఇంకా దూరం వెళ్లబోతున్నట్లుగా ప్రవర్తించాడు.
  to: వారు వెళ్తున్న గ్రామానికి చేరువయ్యారు; ఆయన మాత్రం మరింత దూరం వెళ్లబోతున్నట్లుగా ప్రవర్తించాడు.
  rationale: The wording is adjusted only to make the comparative meaning of πορρώτερον explicit and to improve natural Telugu phrasing. The rendering continues to preserve the restrained sense of προσεποιήσατο (‘acted as though’) rather than imposing a theological or moral interpretation.
