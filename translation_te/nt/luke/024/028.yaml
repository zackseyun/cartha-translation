id: LUK.24.28
reference: Luke 24:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἤγγισαν εἰς τὴν κώμην οὗ ἐπορεύοντο, καὶ αὐτὸς ⸀προσεποιήσατο ⸀πορρώτερον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/028.yaml
  text: And they came near to the village where they were going[a], and he acted as though he were going farther.
translation:
  language: te
  text: వారు వెళ్తున్న గ్రామానికి చేరువయ్యారు; ఆయన మాత్రం మరింత దూరం వెళ్లబోతున్నట్లుగా ప్రవర్తించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγγισαν
  choice: దగ్గరయ్యారు
  rationale: ἐγγίζω యొక్క భూతకాల క్రియారూపం ఒక ప్రదేశాన్ని సమీపించడాన్ని సూచిస్తుంది. ‘దగ్గరయ్యారు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం; గమ్యాన్ని ఇంకా చేరలేదనే భావాన్ని నిలుపుతుంది.
- source_word: κώμην
  choice: గ్రామానికి
  rationale: κώμη సాధారణంగా నగరంకన్నా చిన్న నివాస ప్రాంతాన్ని సూచిస్తుంది. అందువల్ల ‘గ్రామం’ తగిన సమానార్థకం.
- source_word: οὗ ἐπορεύοντο
  choice: తాము వెళ్తున్న
  rationale: సంబంధవాచక అవ్యయం οὗ మరియు కొనసాగుతున్న ప్రయాణాన్ని తెలిపే అపూర్ణ భూతకాల ἐπορεύοντο కలిసి వారి గమ్యాన్ని సూచిస్తాయి. ‘తాము వెళ్తున్న’ తెలుగులో సహజంగా ఉండి అదే భావాన్ని అందిస్తుంది.
- source_word: προσεποιήσατο
  choice: వెళ్లబోతున్నట్లుగా ప్రవర్తించాడు
  rationale: προσποιέομαι ఇక్కడ ఒక చర్య చేయబోతున్నట్లు కనిపింపజేయడం లేదా అలా ప్రవర్తించడం అనే భావం ఇస్తుంది. ‘ప్రవర్తించాడు’ అనే పదం ‘నటించాడు/మోసం చేశాడు’ అనే మరింత బలమైన నైతిక తీర్పును అనవసరంగా చేర్చకుండా కథనంలోని ఉద్రిక్తతను నిలుపుతుంది.
- source_word: πορρώτερον
  choice: ఇంకా దూరం
  rationale: ఈ తులనాత్మక క్రియావిశేషణం ప్రస్తుత గమ్యానికి మించి మరింత దూరం ప్రయాణించడాన్ని సూచిస్తుంది. ‘ఇంకా దూరం’ భౌతిక ప్రయాణ సందర్భంలో స్పష్టంగా ఉంటుంది.
- source_word: πορεύεσθαι
  choice: వెళ్లబోతున్న
  rationale: προσεποιήσατοకు పూరకంగా ఉన్న ఈ క్రియారూపం ఆయన ప్రయాణాన్ని కొనసాగించనున్నట్లు కనిపించిన చర్యను తెలియజేస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘వెళ్లబోతున్నట్లుగా’ సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యేసు చర్యకు సంబంధించి προσεποιήσατο అనువాదం
  choice: ఆయన ఇంకా దూరం వెళ్లబోతున్నట్లుగా ప్రవర్తించాడు
  alternative: ఆయన ఇంకా దూరం వెళ్లబోతున్నట్లు నటించాడు / వెళ్లడానికి సిద్ధమైనట్లు చేశాడు
  rationale: గ్రీకు పాఠం యేసు ముందుకు కొనసాగబోతున్నాడనే రూపాన్ని ఇచ్చాడని చెబుతుంది. ‘ప్రవర్తించాడు’ అనే ఎంపిక ఆ కథన భావాన్ని నిలుపుతూ, ఆయన మోసం చేశాడనే బలమైన నైతిక నిర్ధారణను అనువాదంలోకి తీసుకురాదు; మూలంలోని వ్యాఖ్యాన ఉద్రిక్తతను అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలపాఠంలో పాఠకులకు అవసరమైన ప్రత్యేక పాఠాంతర సమాచారం లేకపోవడంతో పాదటిప్పణి చేర్చలేదు.
