revisions:
- from: వారు దీని గురించి దిక్కుతోచక ఉండగా, ఇదిగో, మెరుపులా మెరిసే వస్త్రాలు ధరించిన ఇద్దరు పురుషులు వారి పక్కన నిలిచారు.[a]
  to: వారు ఈ విషయం గురించి ఏమి అర్థం చేసుకోవాలో తోచక ఉండగా, ఇదిగో, మెరుపులా మెరిసే వస్త్రాలు ధరించిన ఇద్దరు పురుషులు వారి పక్కన నిలిచారు.
