id: LUK.24.4
reference: Luke 24:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ⸀ἀπορεῖσθαι αὐτὰς περὶ τούτου καὶ ἰδοὺ ἄνδρες δύο ἐπέστησαν αὐταῖς ἐν ⸂ἐσθῆτι ἀστραπτούσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/004.yaml
  text: And it happened[a], while they were perplexed about this, that behold, two men stood by them in dazzling clothing.
translation:
  language: te
  text: వారు ఈ విషయం గురించి ఏమి అర్థం చేసుకోవాలో తోచక ఉండగా, ఇదిగో, మెరుపులా మెరిసే వస్త్రాలు ధరించిన ఇద్దరు పురుషులు వారి పక్కన నిలిచారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: ప్రత్యేక పదంగా అనువదించకుండా వాక్య నిర్మాణంలో వ్యక్తీకరించబడింది
  rationale: లూకా వాడే ఈ కథన సూత్రాన్ని తెలుగులో ‘జరిగిందేమిటంటే’ అని విడిగా ఉంచడం భారంగా ఉంటుంది; ‘ఉండగా ... నిలిచారు’ అనే సహజ నిర్మాణం దాని సంఘటన-పరిచయ కార్యాన్ని అందిస్తుంది.
- source_word: ἐν τῷ ἀπορεῖσθαι
  choice: దిక్కుతోచక ఉండగా
  rationale: ἐν తో కూడిన articular infinitive కాలార్థాన్ని ఇస్తుంది; ἀπορέω కేవలం ఆశ్చర్యపడటాన్ని కాక, ఏమి అర్థం చేసుకోవాలో తెలియక కలవరపడటాన్ని సూచిస్తుంది.
- source_word: αὐτὰς
  choice: వారు / వారి
  rationale: సందర్భంలోని స్త్రీలను సూచించే సర్వనామాన్ని తెలుగులో సహజంగా లింగభేదం చూపని ‘వారు’తో వ్యక్తీకరించాం.
- source_word: περὶ τούτου
  choice: దీని గురించి
  rationale: ముందు వివరించిన విషయాన్ని నేరుగా సూచించే సహజ ఆధునిక తెలుగు పదబంధం.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: అకస్మాత్తుగా కథలోకి వచ్చే దృశ్యంపై పాఠకుని దృష్టిని ఆకర్షించే గుర్తింపును నిలుపుతుంది.
- source_word: ἄνδρες δύο
  choice: ఇద్దరు పురుషులు
  rationale: ἀνήρ ను ఈ వచనంలోని కథన రూపానికి అనుగుణంగా ‘పురుషులు’గా అనువదించాం; సమీప సందర్భం ఆధారంగా ‘దూతలు’ అని ముందే నిర్ణయించలేదు.
- source_word: ἐπέστησαν αὐταῖς
  choice: వారి పక్కన నిలిచారు
  rationale: క్రియలోని సమీపంగా వచ్చి/ఉండి నిలబడిన స్థలార్థాన్ని కాపాడుతుంది; ‘ప్రత్యక్షమయ్యారు’ అనే వ్యాఖ్యాత్మక భావాన్ని చేర్చదు.
- source_word: ἐν ἐσθῆτι ἀστραπτούσῃ
  choice: మెరుపులా మెరిసే వస్త్రాలు ధరించిన
  rationale: ἀστράπτω లోని మెరుపు-వంటి ప్రకాశ చిత్రాన్ని ప్రధాన పాఠ్యంలోనే సహజ తెలుగులో నిలిపాం; ἐν ἐσθῆτι అనే వస్త్రధారణ భావాన్ని తెలుగులో ‘వస్త్రాలు ధరించిన’గా వ్యక్తీకరించాం.
theological_decisions:
- issue: ఇద్దరు వ్యక్తుల గుర్తింపు
  choice: ఇద్దరు పురుషులు
  alternative: ఇద్దరు దేవదూతలు
  rationale: ఈ వచనం వారిని ἄνδρες δύο, ‘ఇద్దరు పురుషులు’ అని చూపిస్తుంది. విస్తృత సందర్భం వారిని పరలోక సందేశకులుగా అర్థం చేసుకునేలా చేసినా, ఆ గుర్తింపును ఈ వచనంలోకి ముందుగానే చేర్చకుండా మూలంలోని కథన ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన కథన శైలి. ‘ఇదిగో’ ద్వారా మూలంలోని దృష్టి-ఆకర్షణ నిలుపబడింది. గమనిక సూచిక [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
