  verdict: revise
  source_fidelity: The central sequence and the necessity expressed by δεῖ are conveyed, but “తిరిగి” adds an explicit ‘again’ that is not present in ἀναστῆναι. The Greek active infinitive is adequately represented by “లేవాలి” without importing a passive sense. “చేతుల్లోకి” is a more natural Telugu equivalent for εἰς χεῖρας and retains the sense of being handed into others’ power.
  naturalness: The revision uses natural modern Telugu while retaining the solemn, connected sequence of infinitives. “పాపులైన మనుష్యుల చేతుల్లోకి” reads more idiomatically than the singular “చేతికి.”
  terminology: “మనుష్యకుమారుడు,” “అప్పగించబడాలి,” and “సిలువ వేయబడాలి” appropriately retain established Gospel terminology. The footnote properly distinguishes the active Greek form from a passive rendering.
  issues:
  - severity: low
    issue: “తిరిగి” explicitly adds ‘again.’
    rationale: ἀναστῆναι is active, ‘rise,’ and does not itself contain an explicit equivalent of ‘again.’ Resurrection context supports the sense, but omitting the addition more closely follows the source.
  - severity: low
    issue: “చేతికి” is less idiomatic for the plural idiom εἰς χεῖρας.
    rationale: “చేతుల్లోకి” naturally conveys being handed into the hands/power of the sinful men and reflects the Greek plural imagery.
  revised_text: “మనుష్యకుమారుడు పాపులైన మనుష్యుల చేతుల్లోకి అప్పగించబడాలి, సిలువ వేయబడాలి, మూడవ రోజున లేవాలి” అని ఆయన చెప్పాడు.[a]
