reference: Luke 24:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγων ⸂τὸν υἱὸν τοῦ ἀνθρώπου ὅτι δεῖ⸃ παραδοθῆναι εἰς χεῖρας ἀνθρώπων ἁμαρτωλῶν καὶ σταυρωθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/007.yaml
  text: saying that the Son of Man must be delivered into the hands of sinful men and be crucified and on the third day rise again[a][b].
translation:
  language: te
  text: “మనుష్యకుమారుడు పాపులైన మనుష్యుల చేతుల్లోకి అప్పగించబడాలి, సిలువ వేయబడాలి, మూడవ రోజున లేవాలి” అని ఆయన చెప్పాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “లేవాలి” అని అనువదించిన గ్రీకు పదం కర్తరి రూపంలో ఉంది; “లేపబడాలి” అనే కర్మణి రూపంలో కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: అని ఆయన చెప్పాడు
  rationale: ముందటి వచనంలోని జ్ఞాపకం చేసుకోమనే వాక్యంతో సంబంధాన్ని సహజమైన తెలుగులో కొనసాగిస్తుంది; గ్రీకు వర్తమాన కృదంతాన్ని తెలుగు ప్రత్యక్ష ఉద్ధరణ ముగింపు క్రియగా వ్యక్తం చేసింది.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: సువార్తలలో స్థిరపడిన బిరుదును, దాని దానియేలు గ్రంథ సంబంధ ప్రతిధ్వనిని కాపాడుతుంది.
- source_word: ὅτι δεῖ
  choice: అప్పగించబడాలి ... వేయబడాలి ... లేవాలి
  rationale: δεῖ సూచించే దైవిక అవసరతను కేవలం భవిష్యద్వాణిగా తగ్గించకుండా ‘-ాలి’ రూపాలతో నిలుపుతుంది.
- source_word: παραδοθῆναι εἰς χεῖρας
  choice: చేతికి అప్పగించబడాలి
  rationale: అప్పగించబడటం మరియు ఇతరుల అధికారంలో పడటం అనే భావాలను సహజమైన తెలుగు నుడికారంలో నిలుపుతుంది.
- source_word: ἀνθρώπων ἁμαρτωλῶν
  choice: పాపులైన మనుష్యుల
  rationale: ἀνθρώπων అనే నామవాచకాన్ని స్పష్టంగా ఉంచుతూ ἁμαρτωλῶν విశేషణార్థాన్ని అందిస్తుంది; సందర్భంలోని మానవ కార్యసాధకులను సూచిస్తుంది.
- source_word: σταυρωθῆναι
  choice: సిలువ వేయబడాలి
  rationale: సిలువ మరణాన్ని ఖచ్చితంగా తెలిపే ప్రామాణిక ఆధునిక తెలుగు ప్రయోగం.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: మూడవ రోజున
  rationale: కాలసూచక దత్తి విభక్తిని సహజంగా, విస్తరణ లేకుండా అనువదిస్తుంది.
- source_word: ἀναστῆναι
  choice: తిరిగి లేవాలి
  rationale: గ్రీకులోని కర్తరి infinitive భావాన్ని నిలుపుతుంది; ‘లేపబడాలి’ అనే కర్మణి భావాన్ని చేర్చదు. ‘తిరిగి’ పునర్జీవాన్ని సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: యేసు శ్రమల ప్రవచనంలో δεῖ బలం
  choice: ‘-ాలి’ రూపాల ద్వారా దైవిక అవసరత
  alternative: కేవలం ‘జరుగుతుంది’ అనే భవిష్య సూచన
  rationale: లూకా రచనలో δεῖ దేవుని విమోచన ప్రణాళిక నెరవేర్పులోని అవసరతను సూచిస్తుంది; అనువాదం దాన్ని వివరించి పరిష్కరించకుండా వ్యాకరణ రూపంలో నిలుపుతుంది.
- issue: ἀναστῆναι యొక్క కర్తరి రూపం
  choice: తిరిగి లేవాలి
  alternative: లేపబడాలి
  rationale: ఈ వచనంలోని గ్రీకు రూపం కర్తరి ప్రయోగం. ఇతర వచనాల్లోని కర్మణి పునరుత్థాన భాషను ఇక్కడికి దిగుమతి చేయకుండా మూలరూపాన్ని కాపాడింది.
- issue: ἀνθρώπων ἁμαρτωλῶν లో లింగం మరియు మానవ కార్యసాధకత్వం
  choice: పాపులైన మనుష్యులు
  alternative: పాపులు
  rationale: ‘పాపులు’ మాత్రమే అంటే ἀνθρώπων స్పష్టత పోవచ్చు. ‘మనుష్యులు’ మూలంలోని మానవులను సూచించే పదాన్ని నిలుపుతుంది; తెలుగులో సందర్భానుసారంగా ఇది సాధారణ బహువచనంగానూ పనిచేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ముందటి వచనంతో కలిపి చదివినప్పుడు ఉద్ధరణ సహజంగా సాగేలా రూపొందించబడింది. ప్రధాన పాఠంలోని [a] గుర్తు పాదటిప్పణితో సరిపోలుతుంది.
