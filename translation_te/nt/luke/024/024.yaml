revisions:
- from: మాతో ఉన్నవారిలో కొందరు సమాధి దగ్గరికి వెళ్లి, ఆ స్త్రీలు చెప్పినట్లుగానే ఉన్నదని కనుగొన్నారు; కాని ఆయనను చూడలేదు.
  to: మాతో ఉన్నవారిలో కొందరు సమాధికి వెళ్లి, స్త్రీలు చెప్పినట్లుగానే ఉన్నదని కనుగొన్నారు; కానీ ఆయనను చూడలేదు.
  rationale: A minimal lexical correction changes ‘near the tomb’ to ‘to the tomb.’ The revised sentence otherwise retains the source’s narrative ambiguity concerning the unnamed visitors and what precisely they found, while preserving the explicit contrast that they did not see him.
  reviewer_model: gpt-5.6-terra
