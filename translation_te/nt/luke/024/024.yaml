review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the unnamed subset of companions, their journey, the correspondence with the women's report, and the contrast that they did not see Jesus. However, “సమాధి దగ్గరికి” means ‘near/by the tomb’ rather than the Greek destination ‘to the tomb.’
  naturalness: The wording is modern and clear. Replacing “సమాధి దగ్గరికి” with “సమాధికి” is both more precise and more idiomatic for going to a tomb.
  terminology: “సమాధి” appropriately renders μνημεῖον in this burial-and-resurrection context. “ఆయనను” naturally retains the referential pronoun with suitable Telugu respect.
  issues:
  - severity: low
    issue: “సమాధి దగ్గరికి” weakens the destination sense of ἐπὶ τὸ μνημεῖον.
    rationale: దగ్గరికి indicates approaching the vicinity, whereas the Greek says that some went to the tomb. “సమాధికి” directly expresses the destination without adding or reducing narrative detail.
  revised_text: మాతో ఉన్నవారిలో కొందరు సమాధికి వెళ్లి, స్త్రీలు చెప్పినట్లుగానే ఉన్నదని కనుగొన్నారు; కానీ ఆయనను చూడలేదు.
  revised_footnotes: []
  revision_rationale: A minimal lexical correction changes ‘near the tomb’ to ‘to the tomb.’ The revised sentence otherwise retains the source’s narrative ambiguity concerning the unnamed visitors and what precisely they found, while preserving the explicit contrast that they did not see him.
