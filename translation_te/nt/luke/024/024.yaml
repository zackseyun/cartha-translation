id: LUK.24.24
reference: Luke 24:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀπῆλθόν τινες τῶν σὺν ἡμῖν ἐπὶ τὸ μνημεῖον, καὶ εὗρον οὕτως καθὼς ⸀καὶ αἱ γυναῖκες εἶπον, αὐτὸν δὲ οὐκ εἶδον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/024.yaml
  text: And some of those with us went to the tomb and found it just as the women had said, but they did not see him.
translation:
  language: te
  text: మాతో ఉన్నవారిలో కొందరు సమాధికి వెళ్లి, స్త్రీలు చెప్పినట్లుగానే ఉన్నదని కనుగొన్నారు; కానీ ఆయనను చూడలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθόν
  choice: వెళ్లి
  rationale: సమాధి వైపు వెళ్లడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; బయలుదేరడంపై అనవసరమైన బలాన్ని పెట్టదు.
- source_word: τινες τῶν σὺν ἡμῖν
  choice: మాతో ఉన్నవారిలో కొందరు
  rationale: మాట్లాడుతున్నవారితో ఉన్న సమూహంలోని కొందరిని సూచించే గ్రీకు నిర్మాణాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: సమాధి దగ్గరికి
  rationale: ఈ పునరుత్థాన కథనంలో μνημεῖον యేసు దేహాన్ని ఉంచిన సమాధిని సూచిస్తుంది; గమ్యస్థానాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: εὗρον
  choice: కనుగొన్నారు
  rationale: చూసిన పరిస్థితి ముందుగా చెప్పినట్లే ఉందని వారు నిర్ధారించుకున్న భావాన్ని ఇస్తూ, εὗρον యొక్క సాధారణ కథనార్థాన్ని నిలుపుతుంది.
- source_word: οὕτως καθὼς καὶ αἱ γυναῖκες εἶπον
  choice: ఆ స్త్రీలు చెప్పినట్లుగానే ఉన్నదని
  rationale: స్త్రీలు నివేదించినదానికీ సమాధి వద్ద కనిపించిన పరిస్థితికీ ఉన్న సరిపోలికను తెలియజేస్తుంది. καί యొక్క అదనపు/ఉద్ఘాటన భావాన్ని తెలుగులో వేరుగా బలవంతంగా చేర్చకుండా ‘అలాగే’ భావంలో సహజంగా ప్రతిబింబిస్తుంది.
- source_word: αὐτὸν
  choice: ఆయనను
  rationale: సూచన యేసువైపే ఉన్నప్పటికీ పేరును చేర్చకుండా గ్రీకు సర్వనామాన్ని నిలుపుతుంది; గౌరవప్రదమైన తెలుగు రూపాన్ని వాడుతుంది.
- source_word: δὲ
  choice: కాని
  rationale: సమాధి పరిస్థితి స్త్రీలు చెప్పినట్లే కనిపించడానికీ యేసును చూడకపోవడానికీ మధ్య ఉన్న స్వల్ప వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: οὐκ εἶδον
  choice: చూడలేదు
  rationale: ὁράω యొక్క ‘చూడు’ అనే ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది; ‘కనుగొనలేదు’ అని మార్చి మూలంలోని క్రియాభేదాన్ని చెరపదు.
theological_decisions:
- issue: పునరుత్థాన కథనంలోని నివేదిక
  choice: సమాధి పరిస్థితి స్త్రీలు చెప్పినట్లే ఉందని సహచరులు నిర్ధారించారు, కాని యేసును స్వయంగా చూడలేదు.
  alternative: ఇతర సువార్తల వివరాలతో సమన్వయం చేస్తూ ఎవరు వెళ్లారు లేదా అక్కడ ఏమి చూశారో విస్తరించడం.
  rationale: గ్రీకు వాక్యంలో ఉన్న రెండు అంశాలను—స్త్రీల నివేదికకు ధృవీకరణ, యేసును చూడకపోవడం—వేరువేరుగా నిలుపుతూ, సమాంతర కథనాల నుంచి వివరాలను దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే కథన గాంభీర్యం మరియు మూలంలోని వ్యత్యాసం నిలుపబడ్డాయి.
