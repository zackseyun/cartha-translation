- from: కాని ఇశ్రాయేలును విమోచించబోయేవాడు ఈయనే అని మేము ఆశిస్తూ ఉన్నాం.[a] ఇవన్నీ జరిగి, వీటన్నిటికీ తోడు, నేటికి మూడో రోజు అయింది.[b]
  to: కాని, ఇశ్రాయేలును విమోచించబోయేవాడు[a] ఈయనే అని మేము ఆశిస్తూ ఉండేవాళ్లం.[b] అయితే, వీటన్నిటికీ తోడు, ఇవి జరిగి నేటికి మూడో రోజు అయింది.
  rationale: 'The required correction is chiefly temporal: the past imperfect is rendered as మేము ఆశిస్తూ ఉండేవాళ్లం rather than the present ఆశిస్తూ ఉన్నాం. The predicate ఈయనే remains appropriately tenseless in Telugu and therefore does not unnecessarily recast Greek ἐστιν as a past assertion. The second clause is smoothed without adding interpretation, and the two footnotes are reordered and anchored to the expressions they actually explain.'
