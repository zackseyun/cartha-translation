id: LUK.24.21
reference: Luke 24:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἠλπίζομεν ὅτι αὐτός ἐστιν ὁ μέλλων λυτροῦσθαι τὸν Ἰσραήλ· ἀλλά γε ⸀καὶ σὺν πᾶσιν τούτοις τρίτην ταύτην ἡμέραν ⸀ἄγει ἀφ’ οὗ ταῦτα ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/021.yaml
  text: But we were hoping that he is the one who is about to redeem Israel[a]. Yet besides all this[b], it is now the third day since these things happened.
translation:
  language: te
  text: కాని, ఇశ్రాయేలును విమోచించబోయేవాడు[a] ఈయనే అని మేము ఆశిస్తూ ఉండేవాళ్లం.[b] అయితే, వీటన్నిటికీ తోడు, ఇవి జరిగి నేటికి మూడో రోజు అయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఇశ్రాయేలును విమోచించడం” అనేది విస్తృతమైన మెస్సీయ నిరీక్షణను సూచించవచ్చు. అది రాజకీయ విముక్తినా, ఆధ్యాత్మిక రక్షణనా, లేక రెండూనా అని ఈ వాక్యం నిర్దిష్టంగా చెప్పదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఇశ్రాయేలును విమోచించబోయేవాడు ఈయనే అని మేము ఆశించాం.” గ్రీకు క్రియారూపం గతంలో కొనసాగిన ఆశను సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: కాని ... మేము
  rationale: δέ ముందున్న విషయంతో వ్యత్యాసాన్ని చూపుతుంది; ἡμεῖς అనే బలమైన కర్తను ‘మేము’ సహజంగా నిలుపుతుంది.
- source_word: ἠλπίζομεν
  choice: ఆశిస్తూ ఉన్నాం
  rationale: అసంపూర్ణ భూతకాల రూపం గతంలో కొనసాగిన, ఇప్పుడు నిరాశకు గురైన ఆశను సూచిస్తుంది.
- source_word: ὅτι αὐτός ἐστιν
  choice: ఈయనే అని
  rationale: గ్రీకులో గత ఆశలో వర్తమాన ἐστιν నిలిచినా, తెలుగులో ‘ఈయనే’ అనే విధేయ నిర్మాణం కాలాన్ని అనవసరంగా భూతకాలానికి మార్చకుండా ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ὁ μέλλων λυτροῦσθαι
  choice: విమోచించబోయేవాడు
  rationale: μέλλων + infinitive లోని ఎదురుచూసిన లేదా సమీప భవిష్యత్ కార్యభావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: λυτροῦσθαι
  choice: విమోచించు
  rationale: విడుదల, విమోచన అనే విస్తృతమైన నిబంధనాత్మక మరియు రక్షణ సంబంధ ప్రతిధ్వనులను నిలుపుతుంది; కేవలం రాజకీయ లేదా ఆధ్యాత్మిక అర్థానికి పరిమితం చేయదు.
- source_word: τὸν Ἰσραήλ
  choice: ఇశ్రాయేలును
  rationale: నిబంధన ప్రజలను సమష్టిగా సూచించే ప్రత్యక్ష అనువాదం.
- source_word: ἀλλά γε καὶ σὺν πᾶσιν τούτοις
  choice: వీటన్నిటికీ తోడు
  rationale: ముందు చెప్పిన వాటికి మరొక నిరుత్సాహకర అంశాన్ని జోడించే సముచ్చయ బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τρίτην ταύτην ἡμέραν ἄγει
  choice: నేటికి మూడో రోజు అయింది
  rationale: కాలగమనాన్ని తెలిపే గ్రీకు నుడికారాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀφ’ οὗ ταῦτα ἐγένετο
  choice: ఇవన్నీ జరిగి
  rationale: ఈ సంఘటనలు జరిగినప్పటి నుంచి కాలాన్ని లెక్కిస్తున్నారనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలుపుతుంది.
theological_decisions:
- issue: ‘ఇశ్రాయేలును విమోచించు’ అనే మెస్సీయ నిరీక్షణ పరిధి
  choice: ‘ఇశ్రాయేలును విమోచించబోయేవాడు’ అని విస్తృతంగానే ఉంచడం
  alternative: ‘ఇశ్రాయేలును రాజకీయంగా విడిపించేవాడు’ లేదా ‘ఇశ్రాయేలుకు ఆధ్యాత్మిక రక్షణ ఇచ్చేవాడు’
  rationale: మూలపాఠం విమోచన విధానాన్ని రాజకీయమని గానీ, పూర్తిగా ఆధ్యాత్మికమని గానీ నిర్దిష్టం చేయదు; అందువల్ల ఆ ఉద్దేశపూర్వక విస్తృతతను నిలుపుతుంది.
- issue: గతకాల ἠλπίζομεν తరువాత వర్తమాన ἐστιν యొక్క కాలబలం
  choice: ‘ఈయనే అని మేము ఆశిస్తూ ఉన్నాం’
  alternative: ‘ఈయనే అయి ఉంటాడని’ లేదా ‘ఈయనే అని ఆశించాం’
  rationale: ‘ఈయనే’ అనే కాలరహిత తెలుగు విధేయ నిర్మాణం గ్రీకులో వారి గత ఆశ యొక్క అంతర్విషయంగా నిలిచిన వర్తమానాన్ని భూతకాలానికి పూర్తిగా వెనక్కు జరపకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గౌరవప్రదమైన గ్రంథశైలిలో రూపొందించబడింది. మూలంలోని కాలసంబంధ ఉద్రిక్తతను ‘ఈయనే’ ద్వారా నిలిపి, విమోచన స్వభావాన్ని సిద్ధాంతపరంగా కుదించలేదు.
