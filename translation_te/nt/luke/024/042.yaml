lexical_decisions:
- source_word: οἱ δὲ
  choice: అప్పుడు వారు
  rationale: οἱ అనేది నామవాచకార్థంలో ‘వారు’ అని, సమకూడిన శిష్యులను సూచిస్తుంది; δέ స్వల్ప అనుసంధానాన్ని చూపుతుంది. సందర్భంలో సహజమైన కొనసాగింపును తెలిపేందుకు ‘అప్పుడు’ ఎంచుకున్నాం.
- source_word: ἐπέδωκαν
  choice: ఇచ్చారు
  rationale: ἐπιδίδωμι పదం ఇక్కడ ఇవ్వడం లేదా అందించడం అనే అర్థంలో ఉంది; ఆధునిక తెలుగులో ‘ఇచ్చారు’ సహజంగా, నేరుగా ఉంటుంది.
- source_word: αὐτῷ
  choice: ఆయనకు
  rationale: దత్తి విభక్తిలోని పరోక్ష కర్మను తెలుగులో ‘ఆయనకు’ అని సహజంగా వ్యక్తపరచవచ్చు; సందర్భానుసారంగా ఇది యేసును సూచిస్తుంది.
- source_word: ἰχθύος ὀπτοῦ μέρος
  choice: కాల్చిన చేప ముక్కను
  rationale: μέρος ప్రధాన నామవాచకం (‘ముక్క/భాగం’); ἰχθύος ὀπτοῦ అది కాల్చి సిద్ధం చేసిన చేపలోని ముక్క అని వివరిస్తుంది. ‘కాల్చిన చేప ముక్క’ ఖచ్చితమైనదీ సాధారణ పాఠకులకు సహజమైనదీ.
- source_word: ὀπτοῦ
  choice: కాల్చిన
  rationale: ὀπτός నిప్పు లేదా వేడితో కాల్చి/వేయించి సిద్ధం చేసిన ఆహారాన్ని సూచిస్తుంది. వంట విధానాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘కాల్చిన’ మూలార్థాన్ని సులభంగా అందిస్తుంది.
theological_decisions:
- issue: లూకా 24:42 పాఠాంతరం
  choice: SBLGNT పాఠంలో ఉన్న ‘కాల్చిన చేప ముక్కను’ మాత్రమే ప్రధాన వచనంలో అనువదించడం.
  alternative: కొన్ని తరువాతి ప్రతులు ‘తేనెపట్టు ముక్కను కూడా’ అని చేర్చాయి.
  rationale: ఇచ్చిన విమర్శాత్మక గ్రీకు పాఠం μέροςతో ముగుస్తుంది; దీర్ఘ పాఠం అందులో లేదు. అందువల్ల ప్రధాన వచనం మూలపాఠాన్ని అనుసరిస్తూ, పాఠాంతరాన్ని పారదర్శకత కోసం పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘ఆయనకు’ అనే రూపం సందర్భంలోని యేసుకు తగిన గౌరవాన్ని సహజంగా వ్యక్తపరుస్తుంది; పాఠాంతర సూచిక [a] ప్రధాన వచనంలో ఉంచబడింది.
