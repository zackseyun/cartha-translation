- from: అప్పుడు వారు ఆయన చెప్పిన మాటలను జ్ఞాపకం చేసుకున్నారు.[a]
  to: వారు ఆయన మాటలను జ్ఞాపకం చేసుకున్నారు.[a]
  rationale: The revision removes the added temporal implication of “అప్పుడు” and renders τῶν ῥημάτων αὐτοῦ directly as “ఆయన మాటలను.” The footnote preserves the viable lexical range of ῥῆμα without introducing interpretive content.
