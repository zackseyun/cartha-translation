lexical_decisions:
- source_word: καὶ
  choice: అప్పుడు
  rationale: కథన ప్రవాహంలో ముందు జరిగినదానికి తరువాతి ప్రతిస్పందనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; గ్రీకు καὶ యొక్క సాధారణ అనుసంధాన భావాన్ని సందర్భానుగుణంగా అందిస్తుంది.
- source_word: ἐμνήσθησαν
  choice: జ్ఞాపకం చేసుకున్నారు
  rationale: μιμνῄσκομαι యొక్క ఇక్కడి క్రియాశీల భావమైన ‘గుర్తుచేసుకున్నారు/జ్ఞాపకం చేసుకున్నారు’ను సహజంగా, నేరుగా వ్యక్తం చేస్తుంది.
- source_word: τῶν ῥημάτων
  choice: చెప్పిన మాటలను
  rationale: ῥῆμα ఇక్కడ పలికిన మాటలు లేదా చెప్పిన విషయాలను సూచిస్తుంది. ‘చెప్పిన మాటలు’ అనేది తెలుగు పాఠకులకు స్పష్టంగా ఉండి, వాక్యాలనే కాక ఆయన పలికిన విషయాల భావాన్నీ నిలుపుతుంది.
- source_word: αὐτοῦ
  choice: ఆయన
  rationale: గ్రీకులోని స్వామ్యసూచక సర్వనామాన్ని గౌరవప్రదమైన ఆధునిక తెలుగు రూపంలో అందిస్తుంది; సందర్భంలోని సూచిత వ్యక్తి యేసు.
