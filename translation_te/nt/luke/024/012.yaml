revisions:
- from: అయితే పేతురు లేచి సమాధి దగ్గరికి పరుగెత్తాడు. వంగి లోపలికి చూసినప్పుడు, నారబట్టలు మాత్రమే అతనికి కనిపించాయి. జరిగినదాని గురించి ఆశ్చర్యపడుతూ అతడు తన ఇంటికి వెళ్లిపోయాడు.[a]
  to: అయితే పేతురు లేచి సమాధి వద్దకు పరుగెత్తాడు. వంగి లోపలికి తొంగి చూసి, నారవస్త్రాలు మాత్రమే చూశాడు. జరిగినదాన్ని గురించి తనలో తాను ఆశ్చర్యపడుతూ అతడు వెళ్లిపోయాడు.[a]
