review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains Peter’s rising/running, his stooping look, the linen cloths being alone, and his amazement. However, rendering πρὸς ἑαυτόν in the main text as “తన ఇంటికి” selects a possible but overly specific destination that the Greek does not explicitly state. The English audit trail’s “to himself” appropriately retains the phrase’s openness.
  naturalness: The Telugu is generally clear and modern. “వంగి లోపలికి చూసినప్పుడు” is understandable, though the participial sequence is more direct and natural as “వంగి లోపలికి తొంగి చూసి.” “నారవస్త్రాలు” is a more natural and sufficiently precise rendering of ὀθόνια than “నారబట్టలు.”
  terminology: “సమాధి” appropriately renders μνημεῖον. “నారవస్త్రాలు మాత్రమే” retains both the linen-cloth sense and μόνα (“alone/only”). The revised wording avoids making πρὸς ἑαυτόν mean specifically “home” while retaining a footnote for that viable contextual sense.
  issues:
  - severity: medium
    issue: The main text specifies “తన ఇంటికి” for πρὸς ἑαυτόν.
    rationale: The phrase can be understood idiomatically as going to his own place/home, but it may also denote going away inwardly/with himself. Since the source wording does not explicitly say “house,” the main translation should not make that interpretation definitive; the possible home/place sense belongs in a footnote.
  revised_text: అయితే పేతురు లేచి సమాధి వద్దకు పరుగెత్తాడు. వంగి లోపలికి తొంగి చూసి, నారవస్త్రాలు మాత్రమే చూశాడు. జరిగినదాన్ని గురించి తనలో తాను ఆశ్చర్యపడుతూ అతడు వెళ్లిపోయాడు.[a]
  revised_footnotes:
