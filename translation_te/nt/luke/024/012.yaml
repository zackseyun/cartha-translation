source:
  edition: SBLGNT
  text: ⸂Ὁ δὲ Πέτρος ἀναστὰς ἔδραμεν ἐπὶ τὸ μνημεῖον· καὶ παρακύψας βλέπει τὰ ⸀ὀθόνια μόνα· καὶ ἀπῆλθεν πρὸς ⸀αὑτὸν θαυμάζων τὸ γεγονός.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/012.yaml
  text: But Peter got up and ran to the tomb; and stooping to look in, he sees the linen cloths alone, and he went away to himself, marveling at what had happened.
translation:
  language: te
  text: అయితే పేతురు లేచి సమాధి వద్దకు పరుగెత్తాడు. వంగి లోపలికి తొంగి చూసి, నారవస్త్రాలు మాత్రమే చూశాడు. జరిగినదాన్ని గురించి తనలో తాను ఆశ్చర్యపడుతూ అతడు వెళ్లిపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన చోటుకు (లేదా ఇంటికి) వెళ్లిపోయాడు.”
    reason: πρὸς ἑαυτόν అనే పదబంధం ఇక్కడ ‘తనలో తాను’ అనే భావాన్ని లేదా ‘తన చోటుకు/ఇంటికి’ అనే గమ్యస్థాన భావాన్ని సూచించవచ్చు; ప్రధాన పాఠ్యం అస్పష్టతను వీలైనంతవరకు నిలుపుతుంది.
lexical_decisions:
- source_word: μνημεῖον
  choice: సమాధి
  rationale: మృతదేహాన్ని ఉంచే స్థలాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: παρακύψας
  choice: వంగి లోపలికి చూసినప్పుడు
  rationale: సమాధిలోకి తొంగిచూడడానికి వంగిన చర్యను స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὰ ὀθόνια μόνα
  choice: నారబట్టలు మాత్రమే
  rationale: మృతదేహాన్ని చుట్టిన నార వస్త్రాలను సూచిస్తూ μόνα యొక్క ‘మాత్రమే’ భావాన్ని నిలుపుతుంది.
- source_word: βλέπει
  choice: అతనికి కనిపించాయి
  rationale: చారిత్రక వర్తమానాన్ని తెలుగులో సహజమైన కథన భూతకాలంతో అందిస్తూ, అతడు గమనించిన దృశ్యాన్ని తెలియజేస్తుంది.
- source_word: πρὸς αὑτόν
  choice: తన ఇంటికి
  rationale: ఈ సందర్భంలో ‘తన చోటుకు/ఇంటికి’ అనే సాధ్యమైన అర్థాన్ని సహజమైన తెలుగులో అందిస్తుంది; వాక్యంలోని పాఠ్య అస్పష్టతను పాదసూచికలో సూచించాం.
- source_word: θαυμάζων
  choice: ఆశ్చర్యపడుతూ
  rationale: జరిగిన సంఘటనపై పేతురుకు కలిగిన విస్మయాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: πρὸς αὑτόν అనే పదబంధం యొక్క అస్పష్టత
  choice: ప్రధాన పాఠ్యంలో ‘తన ఇంటికి’
  alternative: ‘తనలో తాను’ లేదా ‘తన దారిన’
  rationale: గ్రీకు పదబంధం గమ్యస్థానాన్ని లేదా అంతర్ముఖ ప్రతిస్పందనను సూచించవచ్చు. కథనంలో వెళ్లిపోవడాన్ని అనుసరించి ‘తన ఇంటికి’ సహజంగా ఉంటుంది; ఇతర అర్థాలను పాదసూచికలో భద్రపరచాం.
- issue: βλέπει అనే చారిత్రక వర్తమానం
  choice: తెలుగు కథనంలో భూతకాల రూపం
  alternative: ‘చూస్తున్నాడు/చూస్తాడు’ అనే వర్తమాన రూపం
  rationale: తెలుగులో అకస్మాత్తుగా వర్తమాన కాలానికి మారడం అసహజంగా ఉండవచ్చు; సంఘటనల క్రమాన్ని మార్చకుండా సహజమైన భూతకాల కథనాన్ని ఉపయోగించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా చర్యల క్రమాన్ని కాపాడాం; నిజమైన పాఠ్య అస్పష్టతను పాదసూచికలో నిలిపాం.
