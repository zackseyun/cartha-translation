language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ δύο ἐξ αὐτῶν ⸂ἐν αὐτῇ τῇ ἡμέρᾳ ἦσαν πορευόμενοι⸃ εἰς κώμην ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ, ᾗ ὄνομα Ἐμμαοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/013.yaml
  text: And behold[a], two of them were going that very day to a village sixty stadia from Jerusalem, whose name was Emmaus,
translation:
  language: te
  text: ఇదిగో, వారిలో ఇద్దరు ఆ రోజే యెరూషలేము నుండి అరవై స్టాదియాల[a] దూరంలో ఉన్న ఎమ్మాయు అనే గ్రామానికి వెళ్తూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: స్టాదియం ప్రాచీన దూర ప్రమాణం. అరవై స్టాదియాలు సుమారు 11 కిలోమీటర్లు (7 మైళ్లు).
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: ఇదిగో
  rationale: లూకా పాఠకుని దృష్టిని కొత్త సంఘటనవైపు మళ్లించే కథన సూచికను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; సందర్భంలో ‘Καὶ’ను విడిగా ‘మరియు’ అని అనువదించడం అసహజంగా ఉంటుంది.
- source_word: δύο ἐξ αὐτῶν
  choice: వారిలో ఇద్దరు
  rationale: పెద్ద శిష్యుల లేదా అనుచరుల సమూహంలోనివారు అనే భాగసూచక భావాన్ని అదనపు వివరాలు చేర్చకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: అదే రోజున
  rationale: ‘ఆ రోజునే’ అనే గ్రీకు నొక్కిచెప్పే భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: ἦσαν πορευόμενοι
  choice: వెళ్తున్నారు
  rationale: గత కథన సందర్భంలో కొనసాగుతున్న ప్రయాణాన్ని తెలిపే పరిభాషాత్మక అసంపూర్ణ క్రియ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς κώμην
  choice: గ్రామానికి
  rationale: κώμηను పట్టణంగా కాక గ్రామంగా గుర్తిస్తూ గమ్యస్థాన దిశను సహజంగా తెలుపుతుంది.
- source_word: ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ
  choice: యెరూషలేముకు అరవై స్టాదియాల దూరంలో ఉన్న
  rationale: మూలంలోని ప్రాచీన కొలమానాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, దాని ఆధునిక సమానాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: ᾗ ὄνομα Ἐμμαοῦς
  choice: ఎమ్మావు అనే
  rationale: గ్రీకు నామకరణ నిర్మాణంలోని భావాన్ని అనవసరమైన భారమైన పదబంధం లేకుండా సహజ తెలుగులో అందిస్తుంది.
