translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి వాడబడింది. దూర ప్రమాణానికి సంబంధించిన పాదటిప్పణి గుర్తును దానికి సంబంధించిన ‘స్టాదియాల’ పదం వద్ద ఉంచాం.
