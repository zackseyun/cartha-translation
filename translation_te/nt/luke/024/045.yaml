lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: కథనంలోని సంఘటనల క్రమాన్ని సహజంగా సూచించే కాలవాచక పదం.
- source_word: διήνοιξεν
  choice: తెరిచాడు
  rationale: διανοίγωలోని ‘తెరవడం’ అనే రూపకాన్ని నిలుపుతుంది; కేవలం ‘సామర్థ్యం ఇచ్చాడు’ అని వ్యాఖ్యానాత్మకంగా మార్చదు.
- source_word: αὐτῶν τὸν νοῦν
  choice: వారి మనసులను
  rationale: νοῦς ఇక్కడ గ్రహించే, అర్థం చేసుకునే అంతరంగ సామర్థ్యాన్ని సూచిస్తుంది. సహజమైన తెలుగు ప్రయోగంలో బహువచనం సందర్భానికి సరిపోతుంది.
- source_word: τοῦ συνιέναι
  choice: అర్థం చేసుకునేలా
  rationale: ఈ ఆర్టిక్యులర్ ఇన్ఫినిటివ్‌లోని ఉద్దేశం/ఫలితం భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; రెండింటిలో ఒక్కదానిని అతిగా నిర్ధారించదు.
- source_word: τὰς γραφάς
  choice: లేఖనాలను
  rationale: లూకా-అపొస్తలుల కార్యముల సందర్భంలో ఇది ఇశ్రాయేలు పవిత్ర లేఖనాలను సూచించే స్థిరమైన తెలుగు బైబిలు పదప్రయోగం.
theological_decisions:
- issue: లేఖనాలను అర్థం చేసుకోవడానికి యేసు చేసిన కార్య స్వభావం
  choice: ‘ఆయన వారి మనసులను తెరిచాడు’ అనే ప్రత్యక్ష రూపకాన్ని నిలుపడం
  alternative: ‘వారు అర్థం చేసుకునే సామర్థ్యం ఇచ్చాడు’ లేదా ‘లేఖనాలను వారికి వివరించాడు’
  rationale: గ్రీకు పాఠం యేసు వారి νοῦς‌ను తెరిచాడని నేరుగా చెబుతుంది. ఈ అనువాదం ఆ వాదనను నిలుపుతూ, దానిని తరువాతి సిద్ధాంతపరమైన వివరణగా విస్తరించదు లేదా కేవలం బోధనగా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మనసులను తెరిచాడు’ అనే రూపకం మూలపాఠానికి దగ్గరగా ఉంచబడింది; ‘అర్థం చేసుకునేలా’ ఉద్దేశం/ఫలితం మధ్యనున్న స్వల్ప అస్పష్టతను సహజంగా నిలుపుతుంది.
