  terminology: లేఖనాలు appropriately denotes the sacred Scriptures in this Lukan context. మనస్సులు is preferable to మనసులు here because the referent is understanding/cognition rather than emotion or disposition. The supplied footnote's phrase అవగాహనను తెరిచాడు is less idiomatic and should be replaced with a natural alternative that clearly remains an interpretive lexical rendering.
