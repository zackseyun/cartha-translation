  yaml_path: translation/nt/luke/024/040.yaml
  text: And after saying this[a], he showed them his hands and his feet.
translation:
  language: te
  text: ఇలా చెప్పిన తర్వాత[a], ఆయన వారికి తన చేతులను, పాదాలను చూపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ఈ వాక్యం లేదు.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: —
  rationale: తెలుగు కథన ప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ అని చేర్చకుండా, ‘తర్వాత’తో అనుసంధానం సహజంగా వ్యక్తమవుతుంది.
- source_word: τοῦτο εἰπὼν
  choice: ఇలా చెప్పిన తర్వాత
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచించే భూతకాల కృదంతాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; ‘τοῦτο’ సమీపంలో చెప్పిన మాటలను సూచిస్తుంది.
- source_word: ἔδειξεν
  choice: చూపించాడు
  rationale: కనిపించేలా చూపడం అనే δείκνυμι యొక్క సందర్భార్థాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: పరోక్ష కర్మను తెలుగులో సహజంగా దత్తివిభక్తితో వ్యక్తపరుస్తుంది.
- source_word: τὰς χεῖρας
  choice: తన చేతులను
  rationale: గ్రీకులో నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ, అవి యేసు స్వంత చేతులని తెలుగు వాడుకలో ప్రతిఫలక స్వామ్యరూపం సహజంగా స్పష్టం చేస్తుంది.
- source_word: τοὺς πόδας
  choice: పాదాలను
  rationale: శరీర భాగమైన πόδαςకు గౌరవప్రదమైన, సాధారణ బైబిలు తెలుగు పదం; ముందున్న ‘తన’ రెండు శరీర భాగాలకూ వర్తిస్తుంది.
theological_decisions:
- issue: వాక్యమంతటి పాఠాంతర స్థితి
  choice: ప్రధాన పాఠంలో చేర్చి పాఠాంతర పాదటిప్పణి ఇవ్వడం
  alternative: కొన్ని ప్రాచీన ప్రతుల్లో ఈ వాక్యం లేదు
  rationale: SBLGNT ఈ వాక్యమంతటినీ కోష్ఠకాల్లో ఉంచి గణనీయమైన పాఠసందేహాన్ని సూచిస్తుంది. అందించిన మూలపాఠంలో మాటలు ఉన్నందున వాటిని ప్రధాన పాఠంలో అనువదిస్తూ, పాఠసాక్ష్యంలోని అనిశ్చితిని పాదటిప్పణిలో పారదర్శకంగా నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే సహజమైన, గౌరవప్రదమైన కథన శైలి. పాదటిప్పణి గుర్తు సంబంధిత వాక్యభాగం తర్వాత ఉంచబడింది.
