id: LUK.24.5
reference: Luke 24:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐμφόβων δὲ γενομένων αὐτῶν καὶ κλινουσῶν ⸂τὰ πρόσωπα⸃ εἰς τὴν γῆν εἶπαν πρὸς αὐτάς· Τί ζητεῖτε τὸν ζῶντα μετὰ τῶν νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/005.yaml
  text: And when they became terrified and bowed their faces to the ground[a], they said to them, “Why are you seeking the living one among the dead?”
translation:
  language: te
  text: వారు భయభ్రాంతులై తమ ముఖాలను నేలవైపు వంచగా, ఆ మనుషులు వారితో, “సజీవుడైనవాణ్ణి మృతుల మధ్య ఎందుకు వెదుకుతున్నారు?[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “సజీవుడైనవాణ్ణి మృతులతో ఏమి వెదుకుతున్నారు?” సందర్భంలో భావం: “సజీవుడైనవాణ్ణి మృతుల మధ్య ఎందుకు వెదుకుతున్నారు?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφόβων ... γενομένων
  choice: భయభ్రాంతులై
  rationale: ἔμφοβος యొక్క తీవ్ర భయభావాన్ని, γενομένων సూచించే స్థితిలోకి రావడాన్ని సహజమైన తెలుగులో సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: κλινουσῶν τὰ πρόσωπα εἰς τὴν γῆν
  choice: తమ ముఖాలను నేలవైపు వంచగా
  rationale: ముఖాలను నేలవైపు వంచిన స్పష్టమైన శారీరక కదలికను నిలుపుతూ, గ్రీకు కృదంత నిర్మాణాన్ని సహజమైన తెలుగు కాలసంబంధ ఉపవాక్యంగా అందిస్తుంది.
- source_word: εἶπαν πρὸς αὐτάς
  choice: ఆ మనుషులు వారితో ... అన్నారు
  rationale: స్త్రీలింగ బహువచన సర్వనామాన్ని ‘వారితో’గా నిలుపుతుంది. తెలుగు వాక్యంలో కర్త స్పష్టత కోసం మునుపటి సందర్భంలోని పురుషులను ‘ఆ మనుషులు’గా సూచిస్తుంది; మూలంలోని భావాన్ని మార్చదు.
- source_word: Τί ζητεῖτε
  choice: ఎందుకు వెదుకుతున్నారు?
  rationale: τί అక్షరార్థంగా ‘ఏమి’ అయినా, ఇక్కడ వారి వెదుకులాట తగనిదని ప్రశ్నించే సందర్భార్థం ‘ఎందుకు’తో సహజంగా వ్యక్తమవుతుంది; వర్తమాన క్రియాభావం నిలుస్తుంది.
- source_word: τὸν ζῶντα
  choice: సజీవుడైనవాణ్ణి
  rationale: ఏకవచన వ్యక్తిని సూచించే substantival participle భావాన్ని కాపాడి, యేసు సజీవుడని నేరుగా కానీ వివరణ జోడించకుండా తెలుపుతుంది.
- source_word: μετὰ τῶν νεκρῶν
  choice: మృతుల మధ్య
  rationale: μετά + genitive యొక్క ‘తో/మధ్య’ పరిధిలో, ఈ సందర్భంలోని జీవి–మృతుల వ్యత్యాసాన్ని సహజంగా తెలియజేసే రూపం.
theological_decisions:
- issue: τὸν ζῶντα లోని పునరుత్థాన సూచన
  choice: సజీవుడైనవాణ్ణి
  alternative: జీవిస్తున్నవాణ్ణి
  rationale: యేసు మృతులకు భిన్నంగా సజీవుడని మూలపాఠం చెప్పే బలాన్ని నిలుపుతుంది; ‘పునరుత్థానుడైనవాడు’ వంటి వివరణాత్మక పదాన్ని చేర్చి భావాన్ని ముందుగానే పరిష్కరించదు.
- issue: Τί ζητεῖτε యొక్క ప్రశ్నార్థక బలం
  choice: ఎందుకు వెదుకుతున్నారు?
  alternative: ఏమని సజీవుడైనవాణ్ణి మృతులతో వెదుకుతున్నారు?
  rationale: అక్షరార్థ అస్పష్టతను పాదటిప్పణిలో ఉంచుతూ, ప్రధాన పాఠంలో సందర్భానికి సహజమైన ప్రశ్నను అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘భయభ్రాంతులై,’ ‘నేలవైపు వంచగా,’ ‘మృతుల మధ్య’ అనే రూపాలు మూలంలోని తీవ్రత, దృశ్యరూపం, వ్యత్యాసాన్ని సహజంగా నిలుపుతాయి. పాదటిప్పణి గుర్తు [a] ప్రధాన పాఠంలో ప్రశ్న ముగింపున ఉంచబడింది.
