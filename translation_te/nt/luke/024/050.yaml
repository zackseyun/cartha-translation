source:
  edition: SBLGNT
  text: Ἐξήγαγεν δὲ αὐτοὺς ⸀ἕως ⸀πρὸς Βηθανίαν, καὶ ἐπάρας τὰς χεῖρας αὐτοῦ εὐλόγησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/050.yaml
  text: Then he led them out as far as Bethany[a], and lifting up his hands, he blessed them.
translation:
  language: te
  text: తరువాత ఆయన వారిని బేతనియ వైపు వరకు[a] బయటికి తీసుకువెళ్లి, తన చేతులను పైకెత్తి వారిని ఆశీర్వదించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బేతనియ వరకు”; లేదా “బేతనియ సమీపం వరకు.” గ్రీకులోని ప్రయోగం అక్షరార్థంగా “బేతనియ వైపు ఉన్నంతవరకు” అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξήγαγεν
  choice: బయటికి తీసుకువెళ్లి
  rationale: ἐξάγω అనే క్రియలో బయటికి నడిపించడం లేదా తీసుకువెళ్లడం అనే దిశాభావం ఉంది. తెలుగు వాక్యప్రవాహంలో ‘తీసుకువెళ్లి’ సహజంగా ఉండగా, ‘బయటికి’ ఆ దిశాభావాన్ని స్పష్టం చేస్తుంది.
- source_word: δὲ
  choice: తరువాత
  rationale: ఇక్కడ δέ వ్యతిరేకతకన్నా కథనంలోని తదుపరి సంఘటనను సూచిస్తుంది.
- source_word: ἕως πρὸς Βηθανίαν
  choice: బేతనియ వైపుగా ఉన్న చోటివరకు
  rationale: ἕως πρός అనే కొంత విస్తృతమైన గ్రీకు ప్రయోగం బేతనియ దిశగా లేదా దాని సమీపం వరకు వెళ్లిన భావాన్ని ఇస్తుంది. ప్రధాన పాఠంలో ఆ దిశా-పరిమితి భావాన్ని నిలిపి, ప్రత్యామ్నాయ సహజ అనువాదాలను పాదసూచికలో ఇచ్చాం.
- source_word: Βηθανίαν
  choice: బేతనియ
  rationale: స్థలనామానికి ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: ἐπάρας
  choice: పైకెత్తి
  rationale: అనంతర ప్రధాన క్రియకు ముందు జరిగిన చేతులు ఎత్తే చర్యను సహజమైన తెలుగు క్రియారూపంతో వ్యక్తం చేస్తుంది.
- source_word: τὰς χεῖρας αὐτοῦ
  choice: తన చేతులు
  rationale: బహువచనాన్ని నిలిపి, కర్తనే సూచించే సహజ తెలుగు స్వాధీన రూపం ఉపయోగించబడింది.
- source_word: εὐλόγησεν
  choice: ఆశీర్వదించాడు
  rationale: εὐλογέω ఇక్కడ శిష్యులపై ఆశీర్వాదం పలికే చర్యను సూచిస్తుంది; అదనపు ఆచారపరమైన భావాలను చేర్చకుండా సాధారణమైన పదాన్ని వాడాం.
- source_word: αὐτούς
  choice: వారిని
  rationale: సందర్భంలోని శిష్యులను సూచించే సహజ కర్మరూపం.
theological_decisions:
- issue: యేసు శిష్యులను ఆశీర్వదించిన చర్య స్వభావం
  choice: ‘వారిని ఆశీర్వదించాడు’ అనే సరళమైన క్రియారూపాన్ని నిలిపాం.
  alternative: ‘వారిమీద ఆశీర్వచనం పలికాడు’
  rationale: పైకెత్తిన చేతులతో యేసు చేసిన ఆశీర్వాద చర్యను పాఠం తెలియజేస్తుంది. దానిని తరువాతి సంఘసంబంధమైన లేదా యాజకపరమైన నిర్దిష్ట సూత్రంగా విస్తరించకుండా, అలాగే కేవలం శుభాకాంక్షగా తగ్గించకుండా మూలంలోని ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. స్థలనామాన్ని ‘బేతనియ’గా లిప్యంతరీకరించాం; ఆశీర్వాద చర్యను సరళంగా ఉంచాం.
