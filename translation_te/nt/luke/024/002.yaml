review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the implied plural subject and the passive/resultative sense of ἀποκεκυλισμένον. However, చూశారు means “saw,” whereas εὗρον means “found,” and దగ్గర నుంచి (“from near”) is less precise than ἀπὸ (“from/away from”).
  naturalness: దొర్లించబడి ఉండడం చూశారు is understandable but is somewhat heavy and treats the stone’s state as the object of “saw.” A finite narrative rendering with కనుగొన్నారు is more natural and accurately reflects the Greek verb.
  terminology: సమాధి is an appropriate modern Telugu rendering for μνημεῖον in this burial context. రాయి is appropriate for λίθος. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: εὗρον is rendered చూశారు.
    rationale: The Greek verb means “they found,” not merely “they saw/noticed.” Telugu కనుగొన్నారు preserves the narrative action and agrees with the English audit trail.
  - severity: medium
    issue: ἀπὸ τοῦ μνημείου is rendered సమాధి దగ్గర నుంచి.
    rationale: దగ్గర నుంచి means “from near the tomb,” which weakens the direct spatial relation expressed by ἀπό. సమాధి నుండి directly conveys “from the tomb.”},{
  revised_text: అప్పుడు వారు సమాధి నుండి దొర్లించబడిన రాయిని కనుగొన్నారు.
  revised_footnotes: []
  revision_rationale: కనుగొన్నారు εὗρον యొక్క అర్థాన్ని కాపాడుతుంది. సమాధి నుండి ἀπὸ τοῦ μνημείου యొక్క నేరమైన సంబంధాన్ని తెలియజేస్తుంది. దొర్లించబడిన రాయి పూర్త కర్మణి కృదంతం సూచించే తొలగించబడిన ఫలితస్థితిని సహజ ఆధునిక తెలుగులో అందిస్తుంది. అప్పుడు కథనాన్ని ముందుకు నడిపే δέకు అనుకూలమైన మృదువైన అనుసంధానం.
