  yaml_path: translation/nt/luke/024/002.yaml
  text: And they found the stone rolled away from the tomb,
translation:
  language: te
  text: అప్పుడు వారు సమాధి నుండి దొర్లించబడిన రాయిని కనుగొన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὗρον
  choice: చూశారు
  rationale: ఇక్కడ εὗρον అంటే అక్కడికి చేరుకున్నప్పుడు రాయి ఉన్న స్థితిని గమనించడం. తెలుగులో ‘చూశారు’ సహజంగా ఈ భావాన్ని తెలియజేస్తుంది; ‘కనుగొన్నారు’ కంటే కథన సందర్భానికి సరళంగా ఉంటుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: δέ ఇక్కడ బలమైన వ్యతిరేకతను కాక కథనం ముందుకు సాగడాన్ని సూచిస్తుంది. ఆధునిక తెలుగు కథనంలో ‘అప్పుడు’ సహజమైన అనుసంధానం.
- source_word: τὸν λίθον
  choice: రాయి
  rationale: సమాధి ద్వారాన్ని మూసిన రాయిని సూచిస్తుంది. ముందు వచన సందర్భం వల్ల తెలుగులో ప్రత్యేక నిర్దేశక పదం అవసరం లేదు.
- source_word: ἀποκεκυλισμένον
  choice: దొర్లించబడి ఉండడం
  rationale: పూర్త భూతకాల కర్మణి కృదంతం రాయి దొర్లించబడిన చర్యతో పాటు దాని ఫలిత స్థితిని తెలియజేస్తుంది. ‘దొర్లించబడి ఉండడం’ ఆ కర్మణి భావాన్నీ కొనసాగుతున్న ఫలితాన్నీ నిలుపుతుంది.
- source_word: ἀπὸ τοῦ μνημείου
  choice: సమాధి దగ్గర నుంచి
  rationale: μνημεῖον ఇక్కడ మృతదేహాన్ని ఉంచే సమాధి. ἀπό వేరుచేయబడిన దిశను సూచిస్తుంది; ‘దగ్గర నుంచి’ రాయి సమాధి ప్రవేశస్థానం నుండి తొలగించబడిందనే భావాన్ని సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: గ్రీకులో కర్త ఈ వాక్యంలో మళ్లీ చెప్పబడలేదు
  choice: వారు
  alternative: స్త్రీలు
  rationale: బహువచన క్రియకు కర్త మునుపటి వచనంలోని స్త్రీలే. ‘వారు’ అని ఉంచడం సందర్భ సంబంధాన్ని కాపాడుతుంది; ‘స్త్రీలు’ అని మళ్లీ చెప్పడం మూలంలో లేని స్పష్టీకరణ అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని కర్మణి నిర్మాణం మరియు రాయి తొలగించబడిన ఫలిత స్థితి నిలుపబడ్డాయి.
