translation:
  language: te
  text: “ప్రభువు నిజంగానే లేపబడ్డాడు[a], సీమోనుకు కనిపించాడు!” అని చెబుతూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ప్రభువు నిజంగా లేచాడు” లేదా “ప్రభువు నిజంగానే లేపబడ్డాడు.” గ్రీకు అవ్యయాన్ని, క్రియను దగ్గర భావాలున్న పలు విధాలుగా అనువదించవచ్చు; ప్రధాన పాఠం గ్రీకులోని కర్మణి ప్రయోగాన్ని నిలుపుతుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντας
  choice: అని అంటూ ఉన్నారు
  rationale: ఇది వర్తమాన క్రియావిశేషణ రూపం, పుంలింగ బహువచనం. ముందున్న వాక్యంతో దాని సంబంధాన్ని నిలుపుతూ, తెలుగులో సహజంగా బహువచన కర్తను సూచిస్తుంది.
- source_word: ὅτι
  choice: ప్రత్యక్ష వాక్యాన్ని సూచించే ఉద్ధరణ చిహ్నాలు మరియు ‘అని’
  rationale: ὅτι ఇక్కడ వారు చెప్పిన విషయాన్ని పరిచయం చేస్తుంది. తెలుగులో ప్రత్యక్ష వాక్యానికి ఉద్ధరణ చిహ్నాలు, చివర ‘అని’ సహజమైన నిర్మాణం.
- source_word: ὄντως
  choice: నిజంగానే
  rationale: పునరుత్థాన వార్త వాస్తవమేనని బలంగా ధృవీకరించే అవ్యయార్థాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἠγέρθη
  choice: లేపబడ్డాడు
  rationale: ἐγείρω యొక్క భూతకాల కర్మణి రూపాన్ని నిలుపుతుంది; ‘లేచాడు’ అని మార్చి కర్తరి భావాన్ని చేర్చదు.
- source_word: ὁ κύριος
  choice: ప్రభువు
  rationale: ఇక్కడ యేసుకు క్రీస్తుసంబంధమైన బిరుదుగా ఉన్న κύριος యొక్క గౌరవభరితమైన, స్థిరమైన తెలుగు అనువాదం.
- source_word: καὶ
  choice: వాక్య సమన్వయం కోసం కామా
  rationale: గ్రీకు καὶ కలిపే రెండు ప్రకటనలు తెలుగులో ఒకే కర్తతో వరుసగా సహజంగా వినిపించేందుకు కామాతో సమన్వయించబడ్డాయి; సంబంధం మారదు.
- source_word: ὤφθη
  choice: కనిపించాడు
  rationale: రూపంలో కర్మణి అయినా, పునరుత్థాన ప్రత్యక్షతను సూచించే ఈ వాడుకకు ‘కనిపించాడు’ సహజమైన తెలుగు; ‘చూడబడ్డాడు’ ఇక్కడ కృత్రిమంగా ఉంటుంది.
- source_word: Σίμωνι
  choice: సీమోనుకు
  rationale: దత్తి విభక్తిని ‘-కు’తో చూపిస్తూ, మూలంలో ఉన్న ‘సీమోను’ పేరునే ఉంచుతుంది; ‘పేతురు’ను అదనంగా చేర్చదు.
theological_decisions:
- issue: పునరుత్థాన క్రియ యొక్క ప్రయోగం
  choice: లేపబడ్డాడు
  alternative: లేచాడు / లేపబడెను
  rationale: మూలంలోని కర్మణి ప్రయోగాన్ని నిలుపుతూ, దేవుని చర్యను వాక్యంలో స్పష్టంగా పేర్కొనకుండానే దాని సూచనను కాపాడుతుంది; అదే సమయంలో ఆధునిక తెలుగు రూపాన్ని వాడుతుంది.
- issue: κύριος అనువాదం
  choice: ప్రభువు
  alternative: యజమాని / గురువు
  rationale: ఈ పునరుత్థాన సందర్భంలో ఇది యేసుకు బిరుదుగా ఉంది. ‘ప్రభువు’ దాని క్రీస్తుసంబంధమైన బరువును తగ్గించకుండా సహజంగా తెలియజేస్తుంది.
- issue: ὤφθη యొక్క రూపం మరియు భావం
  choice: కనిపించాడు
  alternative: చూడబడ్డాడు
  rationale: గ్రీకు రూపం కర్మణి అయినప్పటికీ, ప్రత్యక్షతను సూచించే దాని స్థిరమైన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘కనిపించాడు’ ఎంచుకోబడింది; ఎవరు చూశారనే దృష్టికన్నా ఆయన సీమోనుకు ప్రత్యక్షమైన సంగతినే ముందుకు తెస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘నిజంగానే’ మాటలోని బలమైన ధృవీకరణను సహజంగా అందిస్తుంది. వాక్యం ముందరి సందర్భంతో వ్యాకరణపరంగా అనుసంధానమై ఉన్నందున చివర ‘అని అంటూ ఉన్నారు’ ఉపయోగించబడింది.
