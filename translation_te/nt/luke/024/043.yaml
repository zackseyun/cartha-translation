  text: And taking it[a], he ate it before them.
translation:
  language: te
  text: ఆయన దాన్ని తీసుకొని, వారి ఎదుట తిన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో కర్మను ప్రత్యేకంగా చెప్పకుండా, అక్షరార్థంగా ‘తీసుకొని తిన్నాడు’ అని మాత్రమే ఉంది. మునుపటి వచనంలోని చేప ముక్కను సూచిస్తూ ఇక్కడ ‘దాన్ని’ అని చేర్చబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: ఆయన
  rationale: తెలుగులో వాక్యారంభంలో ‘మరియు’ అనడం సహజంగా లేకపోవడంతో, మునుపటి వాక్యంతో కథన సంబంధాన్ని పదక్రమమే తెలియజేస్తుంది; కర్తను స్పష్టపరచడానికి ‘ఆయన’ వాడబడింది.
- source_word: λαβὼν
  choice: దాన్ని తీసుకొని
  rationale: అనంతర క్రియకు ముందుగా జరిగిన సహాయక క్రియను ‘తీసుకొని’ సహజంగా వ్యక్తం చేస్తుంది. గ్రీకులో ప్రత్యక్ష కర్మ లేకపోయినా, మునుపటి వచనంలోని చేప ముక్కను సూచిస్తూ తెలుగులో ‘దాన్ని’ చేర్చడం సహజం.
- source_word: ἐνώπιον αὐτῶν
  choice: వారి ఎదుట
  rationale: వారి కళ్లముందు, వారి సమక్షంలో ఈ చర్య జరిగిందనే భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ἔφαγεν
  choice: తిన్నాడు
  rationale: సంపూర్ణమైన గత చర్యను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది; కర్మ ‘దాన్ని’ ముందటి సహాయక క్రియతో ఇప్పటికే స్పష్టమైంది.
theological_decisions:
- issue: గ్రీకులో సూచితంగా ఉన్న ప్రత్యక్ష కర్మను తెలుగులో స్పష్టపరచాలా
  choice: ‘దాన్ని’ అని ఒక్కసారి స్పష్టపరచడం
  alternative: ‘తీసుకొని, వారి ఎదుట తిన్నాడు’ అని కర్మను సూచితంగానే ఉంచడం
  rationale: గ్రీకు పాఠంలో కర్మ మునుపటి వచనం నుంచి గ్రహించబడుతుంది. తెలుగులో ‘దాన్ని’ చేర్చడం సహజతను పెంచుతుంది; అది చేప ముక్కనే సూచిస్తుందని పాదసూచిక వివరిస్తుంది. యేసు వారి సమక్షంలో నిజంగా ఆహారం తిన్నాడనే కథన సాక్ష్యాన్ని ఇది నిలుపుతుంది, అయితే అదనపు సిద్ధాంత వివరణను పాఠ్యంలోకి తేవదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘వారి ఎదుట’ అనే పదబంధం సంఘటనకు ఉన్న ప్రత్యక్ష సాక్ష్య భావాన్ని సహజంగా కాపాడుతుంది.
