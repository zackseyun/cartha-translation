  yaml_path: translation/nt/luke/024/019.yaml
  text: And he said to them, “What things?” And they said to him, “The things concerning Jesus the Nazarene, who became a man, a prophet mighty in deed and word before God and all the people,”
translation:
  language: te
  text: 'ఆయన వారితో, “ఏ సంగతులు?” అని అడిగాడు. వారు ఆయనతో ఇలా అన్నారు: “నజరేయుడైన[a] యేసును గురించిన సంగతులు. ఆయన దేవుని ఎదుటా ప్రజలందరి ఎదుటా క్రియలోనూ మాటలోనూ శక్తిమంతుడైన ప్రవక్త అయిన మనిషి[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నజరేతుకు చెందిన యేసు”; గ్రీకులో “నజరేయుడైన యేసు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఆయన ఒక మనిషి, ఒక ప్రవక్త”; గ్రీకు క్రియకు అక్షరార్థంగా “అయ్యాడు” లేదా “ఉద్భవించాడు” అనే భావం ఉండవచ్చు, కానీ ఈ సందర్భంలో “ఉన్నాడు” అని సహజంగా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῖα
  choice: ఏ సంగతులు?
  rationale: నపుంసక బహువచన ప్రశ్నార్థక రూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, గ్రీకులోని బహువచన భావాన్ని నిలుపుతుంది.
- source_word: Τὰ περὶ Ἰησοῦ
  choice: యేసును గురించిన సంగతులు
  rationale: περί పదబంధంలోని ‘గురించి’ అనే భావాన్ని నేరుగా నిలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘యేసుకు జరిగినవి’ అనే సంఘటనార్థాన్ని చేర్చదు.
- source_word: Ναζαρηνοῦ
  choice: నజరేయుడైన
  rationale: ఇది స్థలనామాన్ని మాత్రమే చెప్పే ‘నజరేతుకు చెందిన’ కంటే, గ్రీకు విశేషణాత్మక బిరుదును సమీపంగా ప్రతిబింబిస్తుంది.
- source_word: ἐγένετο
  choice: నిలిచిన
  rationale: ఈ సందర్భంలో γίνομαι సూచించే ‘అయ్యాడు/ఉన్నవాడిగా వెల్లడయ్యాడు’ అనే భావాన్ని సహజంగా ఇస్తుంది; ‘మనిషిగా అయ్యాడు’ అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: ἀνὴρ προφήτης
  choice: ప్రవక్తగా నిలిచిన మనిషి
  rationale: ἀνήρ మరియు προφήτης రెండింటినీ స్పష్టంగా ఉంచి, వాటి అన్వయ సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δυνατὸς ἐν ἔργῳ καὶ λόγῳ
  choice: క్రియలోనూ మాటలోనూ శక్తిమంతుడైన
  rationale: కార్యం మరియు వాక్కు అనే జతను, అలాగే δυνατός లోని శక్తి భావాన్ని గౌరవప్రదమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ
  choice: దేవుని ఎదుటా ప్రజలందరి ఎదుటా
  rationale: దేవుని సన్నిధిలోనూ ప్రజల దృష్టిలోనూ ఉన్న బహిరంగ సాక్ష్య భావాన్ని సంక్షిప్తంగా, సమాంతర నిర్మాణంతో తెలియజేస్తుంది.
theological_decisions:
- issue: యేసును సూచించే ἀνὴρ పదాన్ని అనువదించడం
  choice: మనిషి
  alternative: ప్రవక్త అని మాత్రమే అనువదించి ἀνὴρను విడిచిపెట్టడం
  rationale: గ్రీకు మూలంలో ἀνὴρ స్పష్టంగా ఉంది. దానిని నిలుపడం వక్తలు యేసును ఈ సందర్భంలో ఎలా వర్ణించారో నిజాయితీగా ప్రతిబింబిస్తుంది; దీనితో ఇతర క్రీస్తుశాస్త్ర సత్యాలపై అదనపు నిర్ణయం విధించబడదు.
- issue: ἐγένετοను ‘అయ్యాడు’గా నేరుగా అనువదించాలా
  choice: ప్రవక్తగా నిలిచిన
  alternative: మనిషిగా, ప్రవక్తగా అయ్యాడు
  rationale: నేరుగా ‘మనిషిగా అయ్యాడు’ అని చెప్పడం యేసు అంతకుముందు మనిషి కాదన్న అపార్థాన్ని కలిగించవచ్చు. ‘నిలిచిన’ అనేది సందర్భానుసారంగా ఆయన ప్రజల మధ్య ఎలా ప్రత్యక్షమయ్యాడో/ఎలా గుర్తింపబడ్డాడో తెలియజేస్తూ మూల క్రియ యొక్క చలన భావాన్ని పూర్తిగా ‘ఉన్నాడు’గా సపాటుచేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వాక్యంలోని గంభీరతను నిలుపుతూ రూపొందించబడింది. మూల వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివర కామాను ఉంచాం.
