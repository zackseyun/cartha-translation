  to: 'ఆయన వారితో, “ఏ సంగతులు?” అని అడిగాడు. వారు ఆయనతో ఇలా అన్నారు: “నజరేయుడైన[a] యేసును గురించిన సంగతులు. ఆయన దేవుని ఎదుటా ప్రజలందరి ఎదుటా క్రియలోనూ మాటలోనూ శక్తిమంతుడైన ప్రవక్త అయిన మనిషి[b],”'
