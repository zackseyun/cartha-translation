  source_fidelity: 'The translation accurately represents the participial sequence: «దిగ్భ్రాంతి చెంది» conveys πτοηθέντες, and «భయపడిపోయి» conveys their entering a state of fear (ἔμφοβοι γενόμενοι). «అనుకున్నారు» suitably renders the imperfect ἐδόκουν, while «చూస్తున్నామని» appropriately preserves the ongoing/perceived aspect of θεωρεῖν. «ఒక ఆత్మను» is a direct and contextually suitable rendering of πνεῦμα.'
