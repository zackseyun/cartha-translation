  text: πτοηθέντες δὲ καὶ ἔμφοβοι γενόμενοι ἐδόκουν πνεῦμα θεωρεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/037.yaml
  text: But being startled and becoming afraid[a], they thought they were seeing a spirit.
translation:
  language: te
  text: కానీ వారు దిగ్భ్రాంతి చెంది భయపడిపోయి, ఒక ఆత్మను[a] చూస్తున్నామని అనుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక ప్రేతాత్మను.” గ్రీకు పదం πνεῦμα; మరింత అక్షరార్థంగా, “ఆత్మ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πτοηθέντες
  choice: దిగ్భ్రాంతి చెంది
  rationale: ఈ భూతకాల కర్మణి అసమాపక క్రియ ఆకస్మికంగా కలిగిన కలవరాన్ని సూచిస్తుంది. తరువాత స్పష్టంగా చెప్పబడిన భయాన్ని అతిశయింపజేయకుండా, ఆకస్మిక దిగ్భ్రాంతిని ఈ పదబంధం తెలియజేస్తుంది.
- source_word: δὲ
  choice: కానీ
  rationale: ముందటి వచనంలో యేసు ప్రత్యక్షమైన సందర్భానికి, శిష్యుల ప్రతిస్పందనకు మధ్య ఉన్న స్వల్ప వ్యత్యాసాన్ని సహజమైన తెలుగు కథనశైలిలో చూపిస్తుంది.
- source_word: ἔμφοβοι γενόμενοι
  choice: భయపడిపోయి
  rationale: వారు భయస్థితిలోకి వచ్చారనే ఆరంభార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐδόκουν
  choice: అనుకున్నారు
  rationale: వారు పొందిన అభిప్రాయం లేదా చేసిన ఊహను సూచిస్తుంది; గ్రీకు అసంపూర్ణ భూతకాల భావాన్ని వాక్య సందర్భం తగినంతగా మోస్తుంది.
- source_word: πνεῦμα
  choice: ఒక ఆత్మను
  rationale: ఇది πνεῦμαకు నేరమైన పదసమానం. శరీరరహితమైన సత్తా అని వారు పొరపాటుగా భావించిన విషయాన్ని తెలియజేస్తూ, ‘భూతం’ వంటి సాంస్కృతికంగా భారమైన పదాన్ని ప్రధాన పాఠ్యంలో నివారిస్తుంది.
- source_word: θεωρεῖν
  choice: చూస్తున్నామని
  rationale: వర్తమానకాల క్రియార్థాన్ని కొనసాగుతున్న దర్శనంగా చూపించి, ἐδόκουνతో కలిసి ‘తాము చూస్తున్నామని అనుకున్నారు’ అనే సహజమైన తెలుగు నిర్మాణాన్ని ఇస్తుంది.
theological_decisions:
- issue: పునరుత్థాన ప్రత్యక్షత సందర్భంలో πνεῦμα అనువాదం
  choice: ఒక ఆత్మను
  alternative: ఒక ప్రేతాత్మను
  rationale: శిష్యులు పునరుత్థానుడైన యేసును శరీరరహితమైన సత్తాగా పొరపాటుగా భావించిన కథన ఉద్వేగాన్ని ‘ఆత్మ’ కాపాడుతుంది. ఇది గ్రీకు పదానికి మరింత సమీపంగా ఉండి, జానపద భావనలను ప్రధాన పాఠ్యంలోకి అనవసరంగా తీసుకురాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘దిగ్భ్రాంతి చెంది భయపడిపోయి’ అనే క్రమం గ్రీకు అసమాపక క్రియల వరుసను నిలుపుతూ పునరుక్తిని తగ్గిస్తుంది; ‘ఆత్మ’ అనే పదం మూలంలోని ఉద్దేశపూర్వక విస్తృతిని కాపాడుతుంది.
