id: LUK.24.41
reference: Luke 24:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔτι δὲ ἀπιστούντων αὐτῶν ἀπὸ τῆς χαρᾶς καὶ θαυμαζόντων εἶπεν αὐτοῖς· Ἔχετέ τι βρώσιμον ἐνθάδε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/041.yaml
  text: And while they still were disbelieving because of joy and were marveling[a], he said to them, “Do you have anything here to eat?”
translation:
  language: te
  text: వారు సంతోషం వల్ల ఇంకా నమ్మలేక, ఆశ్చర్యపడుతూ ఉండగా[a], ఆయన వారితో, “ఇక్కడ తినడానికి మీ దగ్గర ఏమైనా ఉందా?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు సంతోషం వల్ల ఇంకా విశ్వసించలేక, ఆశ్చర్యపడుతూ ఉండగా.”
    reason: ‘విశ్వసించలేక’ అనేది ἀπιστούντωνకు మరింత ప్రత్యక్షమైన ప్రత్యామ్నాయం; ప్రధాన పాఠంలోని ‘నమ్మలేక’తో సమానంగా, ఇది తాత్కాలికంగా నమ్మడం కష్టమైన భావాన్ని నిలుపుతుంది.
lexical_decisions:
- source_word: ἔτι δὲ
  choice: ఇంకా ... ఉండగా
  rationale: ἔτιలోని కొనసాగింపు భావాన్ని ‘ఇంకా’ తెలియజేస్తుంది; δέను తెలుగు వాక్యప్రవాహంలో ప్రత్యేక సంధాయక పదం లేకుండానే ఉపవాక్య నిర్మాణం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπιστούντων
  choice: నమ్మలేక
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న ప్రతిస్పందనను సందర్భానుగుణంగా తెలియజేస్తుంది; ఇది స్థిరమైన అవిశ్వాసమని కాక, ఆ క్షణంలో నమ్మడానికి వారు పడుతున్న కష్టాన్ని సూచిస్తుంది.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: సంతోషం వల్ల
  rationale: ἀπό ఇక్కడ కారణాన్ని సూచిస్తుంది. ‘వల్ల’ వారి సంతోషమే నమ్మలేకపోవడానికి కారణమైన విరోధాభాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: θαυμαζόντων
  choice: ఆశ్చర్యపడుతూ
  rationale: కొనసాగుతున్న ఆశ్చర్యభరిత ప్రతిస్పందనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Ἔχετέ
  choice: మీ దగ్గర ... ఉందా?
  rationale: ‘కలిగి ఉన్నారా?’ అనే కృత్రిమ రూపం కంటే, సందర్భంలో స్వాధీనతను అడిగే సహజ తెలుగు ప్రశ్నారూపం.
- source_word: τι βρώσιμον
  choice: తినడానికి ... ఏమైనా
  rationale: βρώσιμον యొక్క ‘తినదగినది’ అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ప్రశ్నలో τιకి తగిన ‘ఏమైనా’ను నిలుపుతుంది.
- source_word: ἐνθάδε
  choice: ఇక్కడ
  rationale: స్థలాన్ని సూచించే మూలపదానికి నేరమైన, సహజమైన సమానార్థకం.
theological_decisions:
- issue: పునరుత్థానుడైన యేసును చూసిన శిష్యుల ప్రతిస్పందన స్వభావం
  choice: అధికమైన సంతోషం వల్ల ఆ వాస్తవాన్ని ఇంకా నమ్మలేక, ఆశ్చర్యపడుతున్న తాత్కాలిక స్థితి
  alternative: సంతోషంతో సంబంధం లేని సాధారణ సందేహం లేదా గట్టిపడిన అవిశ్వాసం
  rationale: ἀπιστούντων ... ἀπὸ τῆς χαρᾶς καὶ θαυμαζόντων అనే నిర్మాణం నమ్మలేకపోవడం, సంతోషం, ఆశ్చర్యం అన్నింటినీ కలిపి ఉంచుతుంది. అనువాదం వారిని ఉద్దేశపూర్వకంగా తిరస్కరించినవారిగా చిత్రించకుండా, మూలంలోని భావోద్వేగ మరియు ధార్మిక ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘సంతోషం వల్ల ఇంకా నమ్మలేక’ అనే రూపం మూలంలోని విరోధాభాసాన్ని నిలుపుతుంది.
