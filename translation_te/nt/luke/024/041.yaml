    text: లేదా, “వారు సంతోషం వల్ల ఇంకా విశ్వసించలేక, ఆశ్చర్యపడుతూ ఉండగా.”
    reason: ‘విశ్వసించలేక’ అనేది ἀπιστούντωνకు మరింత ప్రత్యక్షమైన ప్రత్యామ్నాయం; ప్రధాన పాఠంలోని ‘నమ్మలేక’తో సమానంగా, ఇది తాత్కాలికంగా నమ్మడం కష్టమైన భావాన్ని నిలుపుతుంది.
  revision_rationale: The revision corrects the footnote so that it preserves the source’s continuing, situational disbelief rather than suggesting mere non-belief. It also renders εἶπεν with ‘అన్నాడు’ instead of the more specific ‘అడిగాడు.’ The causal joy, ongoing astonishment, direct question, and the ambiguity-free but non-dogmatic sense of the disciples’ response are retained.
