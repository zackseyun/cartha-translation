id: LUK.24.35
reference: Luke 24:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἐξηγοῦντο τὰ ἐν τῇ ὁδῷ καὶ ὡς ἐγνώσθη αὐτοῖς ἐν τῇ κλάσει τοῦ ἄρτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/035.yaml
  text: And they themselves were recounting the things that had happened on the road[b][a], and how he was made known to them in the breaking of the bread.
translation:
  language: te
  text: వారే దారిలో జరిగిన సంగతులనూ, రొట్టెను విరిచినప్పుడు ఆయన వారికి ఎలా తెలిసివచ్చాడో[a] వివరిస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు ఆయనను ఎలా గుర్తించారో.” గ్రీకులో క్రియ కర్మణి రూపంలో ఉంది; అది వారు ఆయనను గుర్తించిన విషయాన్నిగానీ, ఆయన వారికి తెలియజేయబడిన విషయాన్నిగానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτοὶ
  choice: వారు కూడా
  rationale: స్పష్టంగా ఉన్న సర్వనామం ఈ ఇద్దరు శిష్యులు తమ అనుభవాన్ని ప్రతిగా వివరించారని నొక్కిచెబుతుంది; తెలుగులో ‘వారు కూడా’ సందర్భానుసారమైన సహజ బలాన్ని ఇస్తుంది.
- source_word: ἐξηγοῦντο
  choice: వివరించారు
  rationale: ఈ క్రియ జరిగిన సంగతులను క్రమంగా తెలియజేయడం లేదా వర్ణించడం అనే భావాన్ని ఇస్తుంది. తెలుగు కథనంలో ‘వివరించారు’ సహజంగా ఉంది; గ్రీకు imperfect యొక్క కొనసాగుతున్న చర్యను సందర్భం తగినంతగా తెలియజేస్తుంది.
- source_word: τὰ ἐν τῇ ὁδῷ
  choice: దారిలో జరిగిన సంగతులను
  rationale: గ్రీకు పదబంధం సంక్షిప్తంగా ‘దారిలోని సంగతులు’ అని ఉన్నా, తెలుగులో ఉద్దేశించిన సంఘటనల భావాన్ని సహజంగా వ్యక్తం చేయడానికి ‘జరిగిన’ను స్పష్టీకరించాం.
- source_word: ὁδῷ
  choice: దారిలో
  rationale: ఎమ్మావు ప్రయాణ సందర్భంలో ὁδόςకు ఆధునిక తెలుగులో సహజమైన భౌతిక మార్గ సూచన.
- source_word: ὡς
  choice: ఎలా
  rationale: వారి నివేదికలో గుర్తింపు జరిగిన విధానాన్ని లేదా సంగతిని పరిచయం చేస్తుంది.
- source_word: ἐγνώσθη
  choice: తమకు ఎలా తెలియజేయబడ్డాడో
  rationale: గ్రీకు passive రూపాన్ని నిలుపుతూ, ఆయనను వారు కేవలం తమంతట తాము గుర్తించారనే భావానికి పరిమితం చేయకుండా కథనంలోని ఉద్దేశపూర్వక అస్పష్టతను కాపాడుతుంది.
- source_word: ἐν τῇ κλάσει τοῦ ἄρτου
  choice: రొట్టె విరిచినప్పుడు
  rationale: పదశః ‘రొట్టె విరచడంలో’ అనే భావాన్ని ఆధునిక తెలుగులో సహజమైన కాలసూచక నిర్మాణంతో వ్యక్తం చేస్తుంది; నిర్దిష్టమైన ముందటి భోజన సందర్భం ‘రొట్టె’ను సూచిస్తుంది.
- source_word: ἄρτου
  choice: రొట్టె
  rationale: ἄρτοςకు సాధారణమైన, విస్తృతంగా అర్థమయ్యే తెలుగు సమానార్థకం.
theological_decisions:
- issue: ἐγνώσθηను మానవ గుర్తింపుగా మాత్రమే అనువదించాలా, లేక passive భావాన్ని నిలుపుకోవాలా
  choice: ఆయన తమకు ఎలా తెలియజేయబడ్డాడో
  alternative: వారు ఆయనను ఎలా గుర్తించారో
  rationale: గ్రీకు passive రూపం వారి గుర్తింపునూ, ఆయన వారికి తెలియజేయబడటాన్నీ సూచించగలదు. ప్రధాన పాఠంలో passive భావాన్ని నిలిపి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇవ్వడం ద్వారా లూకా కథనంలోని ధార్మిక ఉద్వేగాన్ని పరిష్కరించకుండా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు passive వల్ల ఉన్న అర్థసంభావ్యతను ప్రధాన పాఠం మరియు పాదటిప్పణి ద్వారా నిలిపాం.
