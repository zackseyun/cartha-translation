id: LUK.24.32
reference: Luke 24:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπαν πρὸς ἀλλήλους· Οὐχὶ ἡ καρδία ἡμῶν καιομένη ἦν ⸂ἐν ἡμῖν⸃ ὡς ἐλάλει ἡμῖν ἐν τῇ ὁδῷ, ⸀ὡς διήνοιγεν ἡμῖν τὰς γραφάς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/032.yaml
  text: And they said to one another[a], “Was not our heart burning within us as he was speaking to us on the road[c][b], as he was opening the Scriptures to us?”
translation:
  language: te
  text: 'వారు ఒకరితో ఒకరు ఇలా అన్నారు: “ఆయన దారిలో[b] మనతో మాట్లాడుతూ, లేఖనాలను మనకు తెరుస్తూ[c] ఉన్నప్పుడు, మన హృదయం[a] మనలో మండుతూ ఉండలేదా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మన హృదయాలు”; గ్రీకులో “మన హృదయం” అని ఏకవచనం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ప్రయాణంలో.”
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా “లేఖనాలను తెరుస్తూ”; అంటే వాటి అర్థాన్ని మనకు స్పష్టం చేస్తూ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ἀλλήλους
  choice: ఒకరితో ఒకరు
  rationale: పరస్పర సంభాషణను తెలిపే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: Οὐχὶ
  choice: ఉండలేదా?
  rationale: అవుననే సమాధానాన్ని ఆశించే గ్రీకు అలంకారిక ప్రశ్న బలాన్ని నిలుపుతుంది.
- source_word: ἡ καρδία ἡμῶν
  choice: మన హృదయం
  rationale: గ్రీకులో ఉన్న ఏకవచనాన్ని నిలుపుతూ, వారిద్దరి ఉమ్మడి అంతరంగ అనుభవాన్ని వ్యక్తం చేస్తుంది.
- source_word: καιομένη
  choice: మండుతూ
  rationale: తీవ్రమైన అంతరంగ అనుభవాన్ని సూచించే మూల రూపకాన్ని, దాని భావాన్ని ప్రత్యేకంగా నిర్వచించకుండా, నేరుగా నిలుపుతుంది.
- source_word: ἐν ἡμῖν
  choice: మనలో
  rationale: అంతరంగంలో జరిగిన అనుభవాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἐλάλει
  choice: మాట్లాడుతూ
  rationale: అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న చర్య భావాన్ని తెలుగు క్రియావిశేషణ రూపం నిలుపుతుంది.
- source_word: ἐν τῇ ὁδῷ
  choice: దారిలో
  rationale: ఎమ్మాయికి వెళ్లే మార్గంలోని భౌతిక సందర్భాన్నీ, ‘మార్గంలో/ప్రయాణంలో’ అనే మూల భావాన్నీ సహజంగా అందిస్తుంది.
- source_word: διήνοιγεν
  choice: తెరుస్తూ
  rationale: లేఖనాల అర్థాన్ని వెల్లడించడాన్ని సూచించే ‘తెరవడం’ అనే మూల రూపకాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది; కొనసాగుతున్న చర్యను కూడా వ్యక్తం చేస్తుంది.
- source_word: τὰς γραφάς
  choice: లేఖనాలను
  rationale: ఈ సందర్భంలోని పవిత్ర గ్రంథరచనలను సూచించే స్థిరమైన, గౌరవప్రదమైన తెలుగు పదం.
theological_decisions:
- issue: ‘హృదయం మండడం’ అనే రూపకంలోని భావం
  choice: ‘మన హృదయం మనలో మండుతూ’ అనే రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: ‘మన హృదయాలు ఎంతో కదిలిపోయాయి’ లేదా ‘మనకు ఆధ్యాత్మిక వెలుగు కలిగింది’ అని భావవివరణ చేయడం
  rationale: ఈ మండడం భావోద్వేగమా, ఆధ్యాత్మిక అనుభవమా, జ్ఞానోదయమా అని వాక్యం నిర్దిష్టంగా చెప్పదు. మూల రూపకాన్ని నిలపడం ఆ ఉద్దేశపూర్వక విస్తృతతను, దైవశాస్త్రీయ ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని అలంకారిక ప్రశ్నను, కొనసాగుతున్న చర్యలను, ‘హృదయం మండడం’ మరియు ‘లేఖనాలను తెరవడం’ అనే రూపకాలను నిలిపింది. పాదసూచిక గుర్తులన్నీ సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
