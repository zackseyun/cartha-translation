  text: καὶ ἀρξάμενος ἀπὸ Μωϋσέως καὶ ἀπὸ πάντων τῶν προφητῶν ⸀διερμήνευσεν αὐτοῖς ἐν πάσαις ταῖς γραφαῖς τὰ περὶ ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/027.yaml
  text: And beginning with Moses and all the Prophets[b][a], he interpreted to them in all the Scriptures the things concerning himself.
translation:
  language: te
  text: ఆయన మోషే గ్రంథాలతో ప్రారంభించి, ప్రవక్తల గ్రంథాలన్నిటినీ తీసుకొని, లేఖనాలన్నిటిలో తనను గురించిన సంగతులను వారికి వివరించాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విశదపరిచాడు,’ ‘అర్థం చెప్పాడు,’ లేదా ‘వ్యాఖ్యానించాడు’ అని కూడా అనువదించవచ్చు. గ్రీకు క్రియ విపులంగా వివరించడం లేదా వ్యాఖ్యానించడం అనే భావాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρξάμενος
  choice: మొదలుకొని
  rationale: ప్రధాన క్రియతో అనుసంధానమైన గ్రీకు కృదంత భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἀπὸ Μωϋσέως καὶ ἀπὸ πάντων τῶν προφητῶν
  choice: మోషే మొదలుకొని ప్రవక్తలందరి వరకు
  rationale: లేఖన వివరణ మోషే దగ్గర ప్రారంభమై ప్రవక్తల రచనల అంతటా కొనసాగిందనే క్రమాన్ని సహజంగా తెలియజేస్తుంది; ఇది కేవలం వ్యక్తులతో జరిగిన చర్యగా అపార్థం కాకుండా అనుబంధ పాదటిప్పణి వివరిస్తుంది.
- source_word: διερμήνευσεν
  choice: వివరించాడు
  rationale: అర్థాన్ని విపులంగా వ్యాఖ్యానించడం లేదా విశదపరచడం అనే క్రియాభావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: గ్రీకు దత్తివిభక్తి పరోక్ష కర్మను సంక్షిప్తంగా, సహజంగా అనువదిస్తుంది.
- source_word: ἐν πάσαις ταῖς γραφαῖς
  choice: లేఖనాలన్నిటిలో
  rationale: γραφή ఇక్కడ పవిత్ర లేఖనాలను సూచిస్తుంది; πάσαις తెలిపే విస్తృతిని ‘అన్నిటిలో’ నిలుపుతుంది.
- source_word: τὰ περὶ ἑαυτοῦ
  choice: తనను గురించిన సంగతులను
  rationale: యేసుకు సంబంధించిన విషయాలు, భాగాలు లేదా ఇతివృత్తాలు అనే విస్తృత భావాన్ని నిలిపి, వాటిని కేవలం ప్రత్యక్ష ప్రవచనాలుగా పరిమితం చేయదు.
theological_decisions:
- issue: యేసు చేసిన లేఖన వివరణ పరిధి
  choice: లేఖనాలన్నిటిలో తనను గురించిన సంగతులను
  alternative: కేవలం ప్రత్యక్ష మెస్సీయ ప్రవచనాలు; లేదా ప్రతి పాత నిబంధన వాక్యమూ నేరుగా ఆయననే సూచిస్తుందనే భావం
  rationale: గ్రీకు వాక్యం లేఖనాలలో యేసుకు సంబంధించిన సంగతులను విస్తృతంగా సూచిస్తుంది; అయితే వాటిని ఒక్క వ్యాఖ్యాన వర్గానికి పరిమితం చేయదు, ప్రతి వాక్యానికీ నేర సంబంధాన్ని కూడా స్పష్టంగా ప్రకటించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ‘లేఖనాలు’ అనే పదం పవిత్ర గ్రంథ సముదాయ భావాన్ని నిలుపుతుంది; ‘తనను గురించిన సంగతులు’ మూలంలోని ఉద్దేశపూర్వక విస్తృతిని కాపాడుతుంది.
