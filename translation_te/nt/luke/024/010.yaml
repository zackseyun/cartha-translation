id: LUK.24.10
reference: Luke 24:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἦσαν δὲ ἡ Μαγδαληνὴ Μαρία καὶ Ἰωάννα καὶ Μαρία ⸀ἡ Ἰακώβου καὶ αἱ λοιπαὶ σὺν αὐταῖς· ⸀ἔλεγον πρὸς τοὺς ἀποστόλους ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/010.yaml
  text: They were Mary Magdalene[a], Joanna, Mary the mother of James, and the other women with them; they were telling these things to the apostles.
translation:
  language: te
  text: వారు మగ్దలేనే మరియ, యోవన్నా, యాకోబు తల్లి మరియ[a], ఇంకా వారితో ఉన్న ఇతర స్త్రీలు; వీరు ఈ సంగతులను అపొస్తలులకు చెబుతూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా ‘యాకోబుకు చెందిన మరియ.’ దీని అర్థం బహుశా ‘యాకోబు తల్లి మరియ’; అయితే ‘యాకోబు భార్య మరియ’ అనే అర్థం కూడా సాధ్యమే.
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν δὲ
  choice: ఆ స్త్రీలు ...
  rationale: ముందటి సందర్భంలో ప్రస్తావించిన స్త్రీలను గుర్తిస్తూ జాబితాను పరిచయం చేస్తుంది. δέ స్వల్ప కథన మార్పును సూచిస్తుంది; తెలుగులో ప్రత్యేక అనుసంధాన పదం లేకుండానే సహజంగా వ్యక్తమవుతుంది.
- source_word: ἡ Μαγδαληνὴ Μαρία
  choice: మగ్దలేనే మరియ
  rationale: ఆమె వ్యక్తినామం, ప్రాంతసూచక బిరుదును తెలుగులో సంప్రదాయబద్ధంగా, స్పష్టంగా అందిస్తుంది.
- source_word: Ἰωάννα
  choice: యోహన్న
  rationale: గ్రీకు స్త్రీనామానికి సాధారణ తెలుగు లిప్యంతరీకరణ.
- source_word: Μαρία ἡ Ἰακώβου
  choice: యాకోబు తల్లి మరియ
  rationale: గ్రీకులో సంబంధం సంక్షిప్తంగా ‘యాకోబుకు చెందిన మరియ’ అన్న రూపంలో ఉంది. సువార్తల నామకరణ సందర్భంలో తల్లి అనే అర్థం అత్యంత సంభావ్యమైనది; మిగిలిన అస్పష్టతను పాదసూచికలో ఉంచాం.
- source_word: αἱ λοιπαὶ σὺν αὐταῖς
  choice: ఇంకా వారితో ఉన్న ఇతర స్త్రీలు
  rationale: స్త్రీలింగ బహువచన విశేషణంలో అంతర్లీనంగా ఉన్న ‘స్త్రీలు’ అనే నామవాచకాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἔλεγον
  choice: చెబుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న లేదా పునరావృత చర్య భావాన్ని నిలుపుతుంది.
- source_word: πρὸς τοὺς ἀποστόλους
  choice: అపొస్తలులకు
  rationale: యేసు నియమించిన ప్రత్యేక వర్గాన్ని సూచించే స్థిరమైన, విస్తృతంగా అర్థమయ్యే తెలుగు పదం.
- source_word: ταῦτα
  choice: ఈ సంగతులను
  rationale: ముందు వివరించిన సంఘటనలు, సందేశం వైపు చూపే బహువచన సూచనను సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: Μαρία ἡ Ἰακώβουలో మరియకు యాకోబుతో ఉన్న సంబంధం
  choice: యాకోబు తల్లి మరియ
  alternative: యాకోబుకు చెందిన మరియ; యాకోబు భార్య మరియ
  rationale: మూల గ్రీకు సంబంధాన్ని స్పష్టంగా చెప్పదు. సువార్తల నామకరణ పద్ధతిలో కుమారుని పేరుతో తల్లిని గుర్తించడం అత్యంత సంభావ్యమైనప్పటికీ, ‘భార్య’ అనే అర్థం కూడా వ్యాకరణపరంగా సాధ్యమే; అందుకే ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. అసంపూర్ణ భూతకాల భావాన్ని ‘చెబుతూ ఉన్నారు’తో నిలిపి, మూలంలోని రెండు ప్రధాన వాక్యభాగాలను రెండు తెలుగు వాక్యాలుగా ఇచ్చాం.
