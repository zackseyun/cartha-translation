revisions:
- from: ఇదిగో, నా తండ్రి వాగ్దానం చేసినదాన్ని నేను మీ మీదికి పంపుతున్నాను. అయితే, పైనుండి వచ్చే శక్తిని మీరు ధరించుకునే వరకు నగరంలోనే ఉండండి.
  to: ఇదిగో, నేను నా తండ్రి వాగ్దానాన్ని మీ మీదికి పంపుతున్నాను. అయితే, పైనుండి శక్తిని మీరు ధరించుకొనే వరకు నగరంలో ఉండండి.
