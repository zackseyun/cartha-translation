id: LUK.24.49
reference: Luke 24:49
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἐγὼ ⸀ἐξαποστέλλω τὴν ἐπαγγελίαν τοῦ πατρός μου ἐφ’ ὑμᾶς· ὑμεῖς δὲ καθίσατε ἐν τῇ ⸀πόλει ἕως οὗ ἐνδύσησθε ⸂ἐξ ὕψους δύναμιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/049.yaml
  text: And look, I am sending the promise of my Father upon you. But stay in the city until you are clothed with power from on high.
translation:
  language: te
  text: ఇదిగో, నేను నా తండ్రి వాగ్దానాన్ని మీ మీదికి పంపుతున్నాను. అయితే, పైనుండి శక్తిని మీరు ధరించుకొనే వరకు నగరంలో ఉండండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే గ్రీకు అవ్యయపు బలాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐξαποστέλλω
  choice: పంపుతున్నాను
  rationale: వర్తమాన కాల భావాన్ని నేరుగా నిలుపుతూ, సందర్భంలో సమీప భవిష్య కార్యాన్నీ సహజంగా సూచిస్తుంది.
- source_word: τὴν ἐπαγγελίαν τοῦ πατρός μου
  choice: నా తండ్రి వాగ్దానం చేసినదాన్ని
  rationale: ‘వాగ్దానం’ అనే అమూర్త పదం పంపబడటం తెలుగులో అసహజంగా ఉండవచ్చు; తండ్రి వాగ్దానం చేసిన వరాన్ని సూచించే మూలపాఠ్య సంక్షిప్తార్థాన్ని స్పష్టంగా, కానీ దాని స్వరూపాన్ని అదనంగా నిర్ధారించకుండా వ్యక్తం చేస్తుంది.
- source_word: ἐφ’ ὑμᾶς
  choice: మీ మీదికి
  rationale: ἐπί యొక్క దిశాత్మక భావాన్ని నిలుపుతుంది.
- source_word: καθίσατε ἐν τῇ πόλει
  choice: నగరంలోనే ఉండండి
  rationale: ఇక్కడ καθίζω అక్షరార్థంగా ‘కూర్చోండి’ కంటే ‘ఉండండి/వేచి ఉండండి’ అనే సందర్భార్థంలో ఉంది; ‘నే’ ఆజ్ఞలోని స్థల పరిమితిని సహజంగా తెలియజేస్తుంది.
- source_word: ἐνδύσησθε
  choice: ధరించుకునే
  rationale: శక్తిని వస్త్రంలా ధరించడమనే మూలపాఠ్య రూపకాన్ని కాపాడుతుంది.
- source_word: ἐξ ὕψους δύναμιν
  choice: పైనుండి వచ్చే శక్తిని
  rationale: శక్తి యొక్క పై మూలాన్ని స్పష్టంగా తెలుపుతూ గ్రీకు పదక్రమాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘నా తండ్రి వాగ్దానం’ దేనిని సూచిస్తుందో స్పష్టీకరణ
  choice: ‘నా తండ్రి వాగ్దానం చేసినదాన్ని’ అని మాత్రమే అనువదించడం
  alternative: ‘నా తండ్రి వాగ్దానం చేసిన పరిశుద్ధాత్మను’ అని స్పష్టీకరించడం
  rationale: సందర్భం పరిశుద్ధాత్మను సూచించినప్పటికీ, ఈ వచనంలో మూలపాఠ్యం ఆయనను పేరుపెట్టి చెప్పదు. అందువల్ల మూలంలోని సూచనాత్మకతను, theological tensionను నిలుపుతుంది.
- issue: ‘పైనుండి శక్తిని ధరించడం’ అనే రూపకం
  choice: రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: ‘పైనుండి శక్తిని పొందే వరకు’ అని అర్థవివరణ చేయడం
  rationale: ἐνδύσησθε లోని వస్త్రధారణ రూపకం ఉద్దేశపూర్వకమైనది; దాన్ని సాధారణ ‘పొందడం’గా మార్చకుండా కాపాడడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గంభీరతను మరియు మూలంలోని రూపకాన్ని నిలుపుతూ రూపొందించబడింది. పాదటిప్పణులు అవసరం లేదు.
