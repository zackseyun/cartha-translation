revisions:
- from: వారు నిరంతరం దేవాలయంలో ఉంటూ దేవుణ్ణి స్తుతిస్తూ[a] ఉన్నారు.
  to: వారు నిరంతరం దేవాలయంలో దేవుణ్ణి స్తుతిస్తూ ఉండేవారు.[a]
  rationale: The revision removes a stylistically heavy double-continuative construction while preserving the imperfect, ongoing force (“ఉండేవారు”), the continual sense (“నిరంతరం”), the temple setting, and the idiomatic worship sense of εὐλογοῦντες. The footnote now gives the lexical alternative with its object explicitly stated.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T01:35:36Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the ongoing sense of ἦσαν with διὰ παντός, ἐν τῷ ἱερῷ as “దేవాలయంలో,” and εὐλογοῦντες τὸν θεόν idiomatically as praising God. The lexical alternative in the footnote appropriately preserves the more literal sense of εὐλογέω without suggesting that God needs human-bestowed benefit.
  naturalness: The current paired construction “దేవాలయంలో ఉంటూ దేవుణ్ణి స్తుతిస్తూ ఉన్నారు” is understandable but unnecessarily repetitive and somewhat heavy because it stacks two -తూ forms before “ఉన్నారు.” A single continuous construction is smoother in modern standard Telugu and retains the Greek’s durative sense.
  terminology: “దేవాలయం” suitably renders ἱερόν in this concise context. “దేవుణ్ణి స్తుతిస్తూ” is natural Telugu for worship directed to God; the note’s “దీవిస్తూ” accurately records the closer lexical alternative.
  issues:
  - severity: low
    issue: Repetitive stacked continuative verbs
    rationale: “ఉంటూ ... స్తుతిస్తూ ఉన్నారు” is less idiomatic than a single continuous predicate. Recasting it improves flow without changing the temporal or participial relationship in the Greek.
  revised_text: వారు నిరంతరం దేవాలయంలో దేవుణ్ణి స్తుతిస్తూ ఉండేవారు.[a]
  revised_footnotes:
  - marker: a
    text: మూల గ్రీకు క్రియను అక్షరార్థంగా “దేవుణ్ణి దీవిస్తూ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  revision_rationale: The revision removes a stylistically heavy double-continuative construction while preserving the imperfect, ongoing force (“ఉండేవారు”), the continual sense (“నిరంతరం”), the temple setting, and the idiomatic worship sense of εὐλογοῦντες. The footnote now gives the lexical alternative with its object explicitly stated.
