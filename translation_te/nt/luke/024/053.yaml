  text: καὶ ἦσαν διὰ παντὸς ἐν τῷ ἱερῷ ⸀εὐλογοῦντες τὸν ⸀θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/053.yaml
  text: And they were continually in the temple[a], blessing God.
translation:
  language: te
  text: వారు నిరంతరం దేవాలయంలో దేవుణ్ణి స్తుతిస్తూ ఉండేవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకు క్రియను అక్షరార్థంగా “దేవుణ్ణి దీవిస్తూ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ παντός
  choice: నిరంతరం
  rationale: ఈ నుడికారం కొనసాగే క్రమబద్ధమైన కార్యాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నిరంతరం’ సహజంగా, సంక్షిప్తంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ἐν τῷ ἱερῷ
  choice: దేవాలయంలో
  rationale: ἱερόν అంతర్గత పరిశుద్ధ స్థలాన్ని మాత్రమే కాక దేవాలయ ప్రాంగణ సముదాయాన్ని సూచిస్తుంది; సందర్భంలో ‘దేవాలయంలో’ సహజమైన ప్రామాణిక అనువాదం.
- source_word: εὐλογοῦντες
  choice: స్తుతిస్తూ
  rationale: εὐλογέω అక్షరార్థంగా ‘మంచిగా పలకడం/దీవించడం’; దేవుడు కర్మగా ఉన్నప్పుడు తెలుగులో ‘దేవుణ్ణి స్తుతించడం’ సహజంగా అదే ఆరాధనా భావాన్ని తెలియజేస్తుంది. ‘దేవుణ్ణి దీవించడం’ తెలుగులో ఆయనకు మేలు కలగాలని కోరుతున్న భావాన్ని తప్పుగా కలిగించవచ్చు.
- source_word: τὸν θεόν
  choice: దేవుణ్ణి
  rationale: εὐλογοῦντες క్రియకు ప్రత్యక్ష కర్మ; సాధారణ తెలుగు కర్మరూపం.
- source_word: ἦσαν
  choice: ఉంటూ ... ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగింపు భావాన్ని తెలుగు సంయుక్త క్రియా నిర్మాణం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ
  choice: వారు
  rationale: తెలుగు వాక్యప్రవాహంలో వచనారంభ ‘మరియు’ కృత్రిమంగా అనిపించవచ్చు; పూర్వ కథనంతో అనుసంధానం సందర్భం ద్వారా స్పష్టంగా ఉండగా కర్తతో సహజంగా ప్రారంభించబడింది.
theological_decisions:
- issue: εὐλογοῦντες τὸν θεόν అనే దేవునిపట్ల ఆరాధనా భాష
  choice: దేవుణ్ణి స్తుతిస్తూ
  alternative: దేవుణ్ణి దీవిస్తూ
  rationale: గ్రీకు క్రియ యొక్క మూలభావాన్ని గమనికలో నిలుపుతూ, తెలుగులో దేవునిపట్ల వాడినప్పుడు ఉద్దేశించిన ప్రశంసా/ఆరాధనా భావాన్ని సహజంగా అందించడానికి ‘స్తుతిస్తూ’ ఎంచుకున్నాం. దీనివల్ల దేవునికి ఆశీర్వాదం అవసరమనే అనుచిత భావం రాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే వాక్యానికి తగిన గౌరవభావంతో రూపొందించబడింది. గ్రీకు పదప్రయోగంలోని భిన్న సాధ్యార్థాన్ని పాదగమనికలో భద్రపరిచాం.
