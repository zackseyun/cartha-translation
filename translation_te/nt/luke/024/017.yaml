source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Τίνες οἱ λόγοι οὗτοι οὓς ἀντιβάλλετε πρὸς ἀλλήλους περιπατοῦντες; καὶ ⸀ἐστάθησαν σκυθρωποί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/017.yaml
  text: And he said to them[a], “What are these words that you are exchanging with one another as you walk?” And they stood still[b], looking sad.
translation:
  language: te
  text: ఆయన వారితో ఇలా అన్నాడు, “మీరు నడుస్తూ ఒకరితో ఒకరు మాట్లాడుకుంటున్న ఈ మాటలేమిటి[a]?” అప్పుడు వారు విచారంగా నిలిచిపోయారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు నడుస్తూ ఒకరితో ఒకరు చర్చించుకుంటున్న ఈ సంగతులేమిటి?”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారు దిగులైన ముఖాలతో ఆగిపోయారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: అని అడిగాడు
  rationale: మూల క్రియ సాధారణంగా ‘అన్నాడు’ అని అర్థమిచ్చినా, ఇక్కడ ప్రత్యక్ష వాక్యం ప్రశ్న కావడంతో ఆధునిక తెలుగులో ‘అడిగాడు’ సహజంగా ఉంది; మాట పలికిన భావం నిలుస్తుంది.
- source_word: δὲ
  choice: ఆయన వారితో
  rationale: δέ స్వల్ప కథన అనుసంధానాన్ని సూచిస్తుంది. తెలుగులో ప్రత్యేక సంధాయక పదం లేకుండానే వాక్యక్రమం సహజంగా కథను ముందుకు తీసుకెళ్తుంది.
- source_word: Τίνες οἱ λόγοι οὗτοι
  choice: ఈ మాటలేమిటి
  rationale: λόγοι యొక్క ప్రాథమిక ‘మాటలు’ అనే భావాన్ని నిలుపుతూ, వారు మాట్లాడుకుంటున్న విషయాలను సూచించే సహజమైన తెలుగు ప్రశ్నగా ఇచ్చాం.
- source_word: ἀντιβάλλετε
  choice: మాట్లాడుకుంటున్న
  rationale: ఈ సందర్భంలో పరస్పరం మాటలు పంచుకోవడం లేదా చర్చించుకోవడం అనే భావం ఉంది. ‘మాట్లాడుకుంటున్న’ అనేది పరస్పరతను సహజంగా తెలియజేస్తుంది; వాదిస్తున్నారనే అదనపు భావాన్ని మోపదు.
- source_word: πρὸς ἀλλήλους
  choice: ఒకరితో ఒకరు
  rationale: పరస్పర సంభాషణను స్పష్టంగా, సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: περιπατοῦντες
  choice: నడుస్తూ
  rationale: ప్రధాన చర్యతో ఏకకాలంలో జరుగుతున్న నడకను సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: ἐστάθησαν
  choice: నిలిచిపోయారు
  rationale: వారు నడక ఆపి నిలిచారనే సందర్భోచిత భావాన్ని తెలియజేస్తుంది; కేవలం ‘నిలబడ్డారు’ కంటే ఆకస్మిక విరామాన్ని బాగా చూపిస్తుంది.
- source_word: σκυθρωποί
  choice: విచారంగా
  rationale: వారి ముఖంలో కనిపించిన దిగులు లేదా విషాద భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘ముఖం మాడ్చుకొని’ వంటి అతిగా నిర్దిష్టమైన చిత్రణను నివారిస్తుంది.
