translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ప్రధాన పాఠంలో ‘మాటలు’ అనే మూలానికి దగ్గరైన పదాన్ని నిలిపి, ‘సంగతులు/చర్చించుకోవడం’ అనే సందర్భోచిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
