id: LUK.24.6
reference: Luke 24:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂οὐκ ἔστιν ὧδε, ἀλλὰ ἠγέρθη.⸃ μνήσθητε ὡς ἐλάλησεν ὑμῖν ἔτι ὢν ἐν τῇ Γαλιλαίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/006.yaml
  text: He is not here[a], but has been raised. Remember how he spoke to you while he was still in Galilee,
translation:
  language: te
  text: ఆయన ఇక్కడ లేరు, కాని లేపబడ్డారు.[a] ఆయన ఇంకా గలిలయలో ఉన్నప్పుడు మీతో ఎలా మాట్లాడారో జ్ఞాపకం చేసుకోండి,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆయన లేచారు’ అని కూడా అనువదించవచ్చు. గ్రీకు క్రియ కర్మణి రూపంలో ఉంది; అక్షరార్థంగా ‘లేపబడ్డారు’ అనే భావాన్ని ఇస్తుంది. పునరుత్థాన సంఘటనను తెలుగులో సహజంగా చెప్పడానికి ‘లేచారు’ అనే అకర్మక రూపం కూడా వాడవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: ఆయన ఇక్కడ లేరు
  rationale: గ్రీకులో కర్త స్పష్టంగా లేకపోయినా సందర్భం యేసును సూచిస్తుంది. తెలుగులో సహజమైన స్పష్టత కోసం ‘ఆయన’ చేర్చబడింది; ὧδε కు ‘ఇక్కడ’ సరైన స్థలవాచక అనువాదం.
- source_word: ἀλλὰ
  choice: కాని భావాన్ని తెలిపే విరామచిహ్నం ‘;’
  rationale: తెలుగులో ‘ఆయన ఇక్కడ లేరు; ఆయన లేపబడ్డారు’ అనే నిర్మాణం వ్యతిరేకతను సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది. మూలంలోని ἀλλά భావం నిలిచేలా రెండు ప్రకటనలు పరస్పర విరుద్ధంగా ఉంచబడ్డాయి.
- source_word: ἠγέρθη
  choice: ఆయన లేపబడ్డారు
  rationale: ἐγείρω క్రియ యొక్క భూతకాల కర్మణి రూపాన్ని నిలుపుతూ, పునరుత్థానంలో అంతర్లీనంగా ఉన్న దైవిక కార్యాన్ని స్పష్టంగా పేరు పెట్టకుండా సూచిస్తుంది. ‘ఆయన’కు అనుగుణంగా గౌరవ బహువచన క్రియారూపం వాడబడింది.
- source_word: μνήσθητε
  choice: జ్ఞాపకం చేసుకోండి
  rationale: ఈ ఆజ్ఞారూపం నేరమైన ప్రబోధాన్ని వ్యక్తం చేస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘జ్ఞాపకం చేసుకోండి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ὡς
  choice: ఎలా
  rationale: ὡς ఇక్కడ యేసు మాట్లాడిన విధానాన్ని లేదా ఆయన చెప్పిన విషయాన్ని పరిచయం చేయగలదు. ‘ఎలా’ మూలంలోని విస్తృత భావాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: ἐλάλησεν ὑμῖν
  choice: మీతో మాట్లాడారో
  rationale: λαλέω యొక్క సాధారణ ‘మాట్లాడు/చెప్పు’ భావాన్ని నిలుపుతుంది; ‘మీతో’ అనేది ὑμῖν ను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔτι ὢν
  choice: ఇంకా … ఉన్నప్పుడు
  rationale: ἔτι లోని ‘ఇంకా’ భావాన్ని నిలుపుతూ, వర్తమాన కృదంతాన్ని తెలుగులో సహజమైన కాలవాచక ఉపవాక్యంగా అందిస్తుంది.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: గలిలయలో
  rationale: స్థలవాచక భావాన్ని నేరుగా తెలియజేస్తూ, ప్రదేశనామాన్ని ప్రాచుర్యంలో ఉన్న తెలుగు రూపంలో ఇస్తుంది.
theological_decisions:
- issue: పునరుత్థాన క్రియ ἠγέρθη అనువాదం
  choice: ఆయన లేపబడ్డారు
  alternative: ఆయన లేచారు
  rationale: మూల గ్రీకులోని కర్మణి ప్రయోగాన్ని ప్రధాన పాఠ్యంలో నిలుపడం ద్వారా దైవిక కార్యం అనే అంతర్లీన భావాన్ని కాపాడాం; అదే సమయంలో కర్తను ‘దేవుడు’ అని స్పష్టంగా చేర్చి మూలం చెప్పినదానికంటే ఎక్కువగా నిర్దిష్టం చేయలేదు. సహజమైన అకర్మక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి వాడబడింది. యేసును సూచించడానికి ‘ఆయన’తో పాటు గౌరవ బహువచన క్రియారూపాలు ఉపయోగించబడ్డాయి. తరువాతి వాక్యంతో భావం కొనసాగుతున్నందున చివర కామా ఉంచబడింది.
