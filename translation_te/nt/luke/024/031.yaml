id: LUK.24.31
reference: Luke 24:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: αὐτῶν δὲ διηνοίχθησαν οἱ ὀφθαλμοὶ καὶ ἐπέγνωσαν αὐτόν· καὶ αὐτὸς ἄφαντος ἐγένετο ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/031.yaml
  text: Then their eyes were opened[a], and they recognized him; and he became unseen by them.
translation:
  language: te
  text: అప్పుడు వారి కళ్లు తెరవబడ్డాయి; వారు ఆయనను గుర్తుపట్టారు. ఆయన వారికి కనబడకుండా పోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన వారి దగ్గరనుండి అదృశ్యమయ్యాడు” లేదా “ఆయన వారి చూపుకు కనిపించకుండా పోయాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διηνοίχθησαν
  choice: తెరవబడ్డాయి
  rationale: διανοίγω యొక్క భూతకాల కర్మణి రూపాన్ని సహజమైన తెలుగు కర్మణి ప్రయోగంతో అందిస్తూ, గ్రహించే సామర్థ్యం వారికి కలిగించబడిందనే భావాన్ని నిలుపుతుంది.
- source_word: οἱ ὀφθαλμοὶ
  choice: వారి కళ్లు
  rationale: ముందున్న αὐτῶν అనే సంబంధవాచక సర్వనామంతో కూడిన గ్రీకు కర్తను సహజమైన తెలుగు స్వామ్య నిర్మాణంలో అందిస్తుంది.
- source_word: ἐπέγνωσαν
  choice: గుర్తుపట్టారు
  rationale: ఇంతకుముందు ఎవరో తెలుసుకోలేకపోయిన వ్యక్తిని ఇప్పుడు గుర్తించడాన్ని ἐπιγινώσκω ఇక్కడ సూచిస్తుంది; సందర్భానికి ఇది 'తెలుసుకున్నారు' కంటే స్పష్టమైనది.
- source_word: ἄφαντος
  choice: కనిపించకుండా
  rationale: ἄφαντος యొక్క 'కంటికి కనబడని/దృశ్యం కాని' భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, సంఘటన ఎలా జరిగిందో నిర్దిష్టంగా చెప్పదు.
- source_word: ἐγένετο ἀπ’ αὐτῶν
  choice: వారికి ... అయ్యాడు
  rationale: వారితో సంబంధించి ఆయన ఇక కనిపించలేదనే ἀπό యొక్క సంబంధాత్మక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: δέ ఇక్కడ కథనంలోని తదుపరి పరిణామాన్ని సూచిస్తుంది; 'అప్పుడు' సందర్భోచితమైన ప్రవాహాన్ని ఇస్తుంది.
theological_decisions:
- issue: యేసు కనిపించకుండా పోయిన స్వభావం
  choice: ఆయన వారికి కనిపించకుండా అయ్యాడు
  alternative: ఆయన వారి దగ్గరనుండి అదృశ్యమయ్యాడు / వారి చూపుకు కనిపించకుండా పోయాడు
  rationale: ἄφαντος ἐγένετο ἀπ’ αὐτῶν అనే మాటలు ఆయన వారికి ఇక కనిపించలేదని చెబుతాయి; అది ఎలా జరిగిందనే విధానాన్ని నిర్ధారించకుండా కథనంలోని మర్మాన్ని కాపాడేందుకు ఈ అనువాదం ఎంచుకోబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. 'కళ్లు తెరవబడ్డాయి' అనే కర్మణి నిర్మాణం మూలంలోని భావాన్ని నిలుపుతుంది; చివరి వాక్యం సంఘటన విధానాన్ని అతిగా నిర్దిష్టం చేయదు.
