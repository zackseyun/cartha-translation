revisions:
- from: అప్పుడు వారి కళ్లు తెరవబడ్డాయి; వారు ఆయనను గుర్తుపట్టారు. వెంటనే ఆయన వారికి కనిపించకుండా అయ్యాడు.[a]
  to: అప్పుడు వారి కళ్లు తెరవబడ్డాయి; వారు ఆయనను గుర్తుపట్టారు. ఆయన వారికి కనబడకుండా పోయాడు.[a]
  rationale: Removed the unsupported temporal adverb “వెంటనే” and revised the final clause for natural Telugu. The wording continues to express that Jesus was no longer visible to them, without imposing an explanation of the event.
