review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the opening and recognition clause. However, “వెంటనే” (‘immediately’) has no basis in the Greek and should be removed. The final expression should retain the source’s statement that he became no longer visible to them without specifying a mechanism.
  naturalness: “వారి కళ్లు తెరవబడ్డాయి” and “ఆయనను గుర్తుపట్టారు” are natural modern standard Telugu. “ఆయన వారికి కనిపించకుండా అయ్యాడు” is understandable but less idiomatic than “ఆయన వారికి కనబడకుండా పోయాడు.”
  terminology: “ఆయన” is appropriately respectful narrative usage, and “గుర్తుపట్టారు” precisely conveys ἐπέγνωσαν in context. The revised final clause preserves the ambiguity of ἄφαντος ἐγένετο ἀπ’ αὐτῶν.
  issues:
  - severity: medium
    issue: The word “వెంటనే” adds an unsupported temporal detail.
    rationale: The Greek says καὶ αὐτὸς ἄφαντος ἐγένετο ἀπ’ αὐτῶν (‘and he became unseen/not visible to them’) but does not state that this happened immediately.
  - severity: low
    issue: The final Telugu wording is somewhat non-idiomatic.
    rationale: “కనబడకుండా పోయాడు” is more natural modern Telugu while still communicating that he was no longer visible to them, without defining how this occurred.
  revised_text: అప్పుడు వారి కళ్లు తెరవబడ్డాయి; వారు ఆయనను గుర్తుపట్టారు. ఆయన వారికి కనబడకుండా పోయాడు.[a]
  revised_footnotes:
  - marker: a
    text: లేదా, “ఆయన వారి దగ్గరనుండి అదృశ్యమయ్యాడు” లేదా “ఆయన వారి చూపుకు కనిపించకుండా పోయాడు.”
    reason: lexical_alternative
  revision_rationale: Removed the unsupported temporal adverb “వెంటనే” and revised the final clause for natural Telugu. The wording continues to express that Jesus was no longer visible to them, without imposing an explanation of the event.
