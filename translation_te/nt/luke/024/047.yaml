source:
  edition: SBLGNT
  text: καὶ κηρυχθῆναι ἐπὶ τῷ ὀνόματι αὐτοῦ μετάνοιαν ⸀καὶ ἄφεσιν ἁμαρτιῶν εἰς πάντα τὰ ἔθνη— ⸀ἀρξάμενοι ἀπὸ Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/047.yaml
  text: and that repentance for the forgiveness of sins should be proclaimed in his name to all the nations[b][a], beginning from Jerusalem.
translation:
  language: te
  text: మరియు, ఆయన నామంలో పాపక్షమాపణ కోసం పశ్చాత్తాపం[a] యెరూషలేము నుండి ప్రారంభించి అన్ని జనాంగాలకు[b] ప్రకటించబడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పశ్చాత్తాపం మరియు పాపక్షమాపణ’; గ్రీకులో ఇవి ప్రకటించవలసిన రెండు సమన్వయ అంశాలుగా కూడా అర్థం కావచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘యూదేతరులందరికీ’; గ్రీకు పదం కొన్ని సందర్భాల్లో ‘యూదేతరులు’ అని కూడా అర్థమిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθῆναι
  choice: ప్రకటించబడాలని ఉంది
  rationale: ఈ నిష్క్రియార్థక అనిశ్చిత క్రియారూపం మునుపటి వాక్యంలోని లేఖన నెరవేర్పు భావంపై ఆధారపడి ఉంది. ‘ప్రకటించబడాలి’ అనేది బహిరంగంగా చాటే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: ఆయన నామంలో
  rationale: యేసు వ్యక్తిత్వం, అధికారం ఆధారంగా జరిగే ప్రకటన అనే నుడికార భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: μετάνοιαν
  choice: పశ్చాత్తాపం
  rationale: కేవలం మనస్సు మార్పు మాత్రమే కాక, పాపం నుంచి దేవునివైపు తిరిగే భావాన్ని కలిగిన స్థిరమైన, సాధారణ తెలుగు పదం.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: పాపక్షమాపణ
  rationale: ἄφεσις యొక్క విడుదల/మన్నింపు భావంలో, పాపాల సందర్భానికి ‘పాపక్షమాపణ’ సంక్షిప్తంగా, స్పష్టంగా సరిపోతుంది.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: అన్ని జనాలకు
  rationale: ἔθνη ఇక్కడ ప్రపంచవ్యాప్త ప్రజాసమూహాలను సూచిస్తుంది. ‘జనాలు’ అనే పదం యూదేతరులకు మాత్రమే భావాన్ని కుదించకుండా మూలంలోని విస్తృతిని నిలుపుతుంది.
- source_word: ἀρξάμενοι ἀπὸ Ἰερουσαλήμ
  choice: యెరూషలేము నుంచి మొదలుపెట్టి
  rationale: ἀπό సూచించే ఆరంభస్థానాన్ని నిలుపుతూ, ప్రకటన చేసే వారి చర్యగా ఈ బహువచన కర్తరి కృదంతాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ప్రకటనలో పశ్చాత్తాపం, పాపక్షమాపణల పరస్పర సంబంధం
  choice: పాపక్షమాపణ కోసం పశ్చాత్తాపం
  alternative: పశ్చాత్తాపం, పాపక్షమాపణ
  rationale: ఈ రెండు నామవాచకాలను సమన్వయ అంశాలుగా కూడా గ్రహించవచ్చు; అయితే పాఠంలోని సన్నిహిత సంబంధాన్ని ప్రధాన అనువాదం చూపుతుంది. రక్షణ క్రమాన్ని వాక్యం చెప్పినదానికంటే విస్తరించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
- issue: ἔθνη యొక్క పరిధి
  choice: అన్ని జనాలకు
  alternative: యూదేతరులందరికీ
  rationale: పునరుత్థానానంతర ప్రకటనకు ప్రపంచవ్యాప్త పరిధి ఇక్కడ ప్రధానంగా ఉంది. యూదేతరులు అందులో ఉన్నప్పటికీ, వారికే అర్థాన్ని పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పశ్చాత్తాపం,’ ‘పాపక్షమాపణ,’ ‘ఆయన నామంలో’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని అతిగా ప్రాచీన రూపాలు లేకుండా వాడింది. పాదసూచిక గుర్తులు [a], [b] ప్రధాన పాఠంలో సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
