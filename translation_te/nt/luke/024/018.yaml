language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ⸂εἷς ὀνόματι⸃ Κλεοπᾶς εἶπεν πρὸς αὐτόν· Σὺ μόνος παροικεῖς Ἰερουσαλὴμ καὶ οὐκ ἔγνως τὰ γενόμενα ἐν αὐτῇ ἐν ταῖς ἡμέραις ταύταις;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/018.yaml
  text: Then one of them[a], named Cleopas, answered and said to him, “Are you the only visitor to Jerusalem who does not know the things that have happened there in these days?”
translation:
  language: te
  text: 'అప్పుడు వారిలో ఒకడు, క్లెయొపా అనే వాడు, ఆయనతో ఇలా అన్నాడు: “యెరూషలేములో పరదేశిగా ఉండి[a], ఈ రోజుల్లో అక్కడ జరిగిన సంగతులు తెలియనివాడివి నువ్వొక్కడివేనా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెరూషలేములో స్థానికుడు కానివానిగా లేదా తాత్కాలిక నివాసిగా ఉంటూ.” గ్రీకు క్రియ ఒక చోట బయటి వ్యక్తిగా లేదా తాత్కాలిక నివాసిగా ఉండే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: అప్పుడు … జవాబిచ్చాడు
  rationale: δέ కథనాన్ని ముందుకు నడిపే సున్నితమైన అనుసంధానం; ἀποκριθείς ప్రత్యక్ష సమాధానాన్ని పరిచయం చేస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేందుకు రెండింటినీ ప్రధాన వాక్యంలో కలిపాం.
- source_word: εἷς ὀνόματι Κλεοπᾶς
  choice: వారిలో క్లెయొపా అనే ఒకడు
  rationale: εἷς సందర్భానుసారంగా ఆ ఇద్దరిలో ఒకడిని సూచిస్తుంది; ὀνόματι వ్యక్తి పేరును పరిచయం చేస్తుంది.
- source_word: εἶπεν πρὸς αὐτόν
  choice: ఆయనకు ఇలా … చెప్పాడు
  rationale: πρός + వ్యక్తిని తెలుగులో సహజంగా ‘ఆయనకు’ అని వ్యక్తపరిచాం; ప్రత్యక్ష వాక్యాన్ని పరిచయం చేయడానికి ‘ఇలా’ చేర్చాం.
- source_word: Σὺ μόνος
  choice: నువ్వొక్కడివేనా
  rationale: μόνος లోని ప్రత్యేకతను ప్రశ్నార్థక తెలుగు నిర్మాణంలో స్పష్టంగా నిలిపింది.
- source_word: παροικεῖς
  choice: పరదేశివి
  rationale: ఈ క్రియ ఒక చోట స్థానికుడు కానివానిగా లేదా తాత్కాలిక నివాసిగా ఉండడాన్ని సూచిస్తుంది. సంక్షిప్తమైన ‘పరదేశి’ ఆ బయటి వ్యక్తి భావాన్ని నిలుపుతుంది; నివసించడం అనే క్రియార్థాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: Ἰερουσαλήμ
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన స్థలనామ రూపం.
- source_word: οὐκ ἔγνως
  choice: తెలియని
  rationale: అయోరిస్ట్ రూపం ఇక్కడ ఇటీవలి సంఘటనల గురించి ఇప్పటికీ అవగాహన లేకపోవడాన్ని సూచిస్తుంది; తెలుగు విశేషణీయ నిర్మాణం ప్రశ్నలో సహజంగా ఉంటుంది.
- source_word: τὰ γενόμενα ἐν αὐτῇ
  choice: యెరూషలేములో జరిగిన సంగతులు
  rationale: నగరాన్ని తెలుగులో మళ్లీ పేర్కొనడం ‘దానిలో’ కంటే స్పష్టంగా, సహజంగా ఉంటుంది; τὰ γενόμενα ను ‘జరిగిన సంగతులు’గా ప్రతిబింబించాం.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: ఈ రోజుల్లో
  rationale: ఇప్పుడే గడిచిన రోజుల కాలపరిధిని దగ్గరగా, సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని అనుసరించాం. యేసును ఉద్దేశించిన ప్రత్యక్ష సంభాషణలో సహజమైన ఏకవచన ‘నువ్వు’ వాడాం; కథకుని సూచనలో గౌరవార్థక ‘ఆయన’ ఉంచాం. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో ఉంది.
