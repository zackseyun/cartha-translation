revisions:
- from: 'అప్పుడు వారిలో క్లెయొపా అనే ఒకడు ఆయనకు ఇలా జవాబిచ్చాడు: “ఈ రోజుల్లో యెరూషలేములో జరిగిన సంగతులు తెలియని పరదేశివి నువ్వొక్కడివేనా?”[a]'
  to: 'అప్పుడు వారిలో ఒకడు, క్లెయొపా అనే వాడు, ఆయనతో ఇలా అన్నాడు: “యెరూషలేములో పరదేశిగా ఉండి[a], ఈ రోజుల్లో అక్కడ జరిగిన సంగతులు తెలియనివాడివి నువ్వొక్కడివేనా?”'
  rationale: The revision explicitly renders the residential/sojourning force of παροικεῖς in the main text, keeps μόνος as “నువ్వొక్కడివేనా,” and preserves the question's reference to events that occurred in Jerusalem during the immediately preceding days. The footnote remains a genuine lexical alternative and is anchored directly to the relevant expression.
