  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τί τεταραγμένοι ἐστέ, καὶ διὰ τί διαλογισμοὶ ἀναβαίνουσιν ἐν ⸂τῇ καρδίᾳ⸃ ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/038.yaml
  text: And he said to them[a], “Why are you troubled, and why do doubts arise in your hearts?”
translation:
  language: te
  text: ఆయన వారితో, “మీరు ఎందుకు కలవరపడుతున్నారు? మీ హృదయాల్లో సందేహాలు ఎందుకు తలెత్తుతున్నాయి?[a]” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సందేహాలు’ అనే పదానికి బదులుగా ‘ఆలోచనలు’ లేదా ‘తర్కాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί τεταραγμένοι ἐστέ
  choice: మీరు ఎందుకు కలవరపడుతున్నారు?
  rationale: τί ఇక్కడ కారణాన్ని ప్రశ్నించే క్రియావిశేషణ భావంలో ఉంది. τεταραγμένοι వారి ప్రస్తుత అంతరంగ కలవర స్థితిని సూచిస్తుంది; ‘కలవరపడుతున్నారు’ సహజమైన ఆధునిక తెలుగు.
- source_word: διαλογισμοὶ
  choice: సందేహాలు
  rationale: ఈ సందర్భంలో శిష్యుల అనిశ్చితి, ప్రశ్నించే మనస్థితిని ‘సందేహాలు’ స్పష్టంగా తెలియజేస్తుంది; అయితే ‘ఆలోచనలు/తర్కాలు’ అనే విస్తృత అర్థసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: ἀναβαίνουσιν
  choice: తలెత్తుతున్నాయి
  rationale: అక్షరార్థంగా ‘పైకి వస్తున్నాయి’; అంతరంగ మానసిక కదలికకు తెలుగులో ‘తలెత్తుతున్నాయి’ సహజమైన సమానార్థక ప్రయోగం.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: మీ హృదయాల్లో
  rationale: ఏకవచన καρδίᾳతో బహువచన ὑμῶν ఉన్న విభజనాత్మక నిర్మాణాన్ని తెలుగులో సహజంగా బహువచన ‘మీ హృదయాల్లో’గా వ్యక్తం చేశాం.
- source_word: καρδία
  choice: హృదయం
  rationale: ఇది భావోద్వేగాలకే కాక ఆలోచన, సంకల్పం కలిగిన అంతరంగ వ్యక్తిని సూచిస్తుంది; ‘మనస్సు’ అని అనడం మూలార్థాన్ని సంకుచితం చేస్తుంది.
theological_decisions:
- issue: καρδία అనే మానవ అంతరంగాన్ని సూచించే పదం
  choice: హృదయం
  alternative: మనస్సు; అంతరంగం
  rationale: బైబిలు భాషలో హృదయం ఆలోచనతో పాటు భావన, సంకల్పాన్ని కూడా కలిగి ఉంటుంది. ‘హృదయం’ అనే రూపం ఈ విస్తృత మానవశాస్త్ర భావాన్ని కాపాడుతుంది.
- issue: διαλογισμοί యొక్క సందర్భోచిత ప్రతికూల భావం
  choice: సందేహాలు
  alternative: ఆలోచనలు; తర్కాలు; ప్రశ్నలు
  rationale: పునరుత్థానుడైన యేసును చూసిన శిష్యుల కలవరాన్ని బట్టి ‘సందేహాలు’ సందర్భానికి సరిపోతుంది; అయినా గ్రీకు పదంలోని విస్తృత అర్థాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. రెండు ప్రశ్నలను సహజ తెలుగు వాక్యనిర్మాణంలో ఉంచి, మూలంలోని అంతరంగ కలవరాన్ని మరియు అర్థసందిగ్ధతను కాపాడాం.
