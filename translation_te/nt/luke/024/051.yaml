id: LUK.24.51
reference: Luke 24:51
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ εὐλογεῖν αὐτὸν αὐτοὺς διέστη ἀπ’ αὐτῶν ⸂[καὶ ἀνεφέρετο εἰς τὸν οὐρανόν]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/051.yaml
  text: And it happened that[a], while he was blessing them, he parted from them and was carried up into heaven.
translation:
  language: te
  text: అప్పుడు, ఆయన వారిని ఆశీర్వదిస్తూ ఉండగా, వారి నుండి విడిపోయి, పరలోకానికి ఎత్తబడాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో “పరలోకానికి ఎత్తబడాడు” అనే మాటలు లేవు.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: లూకా వాడే ఈ కథన సూత్రాన్ని తెలుగులో ‘జరిగిందేమిటంటే’ అని యాంత్రికంగా చేర్చితే వాక్యం భారంగా ఉంటుంది; ‘ఉండగా’ నిర్మాణం సంఘటన జరిగిన సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐν τῷ εὐλογεῖν
  choice: ఆశీర్వదిస్తూ ఉండగా
  rationale: ఆయన వారిని ఆశీర్వదిస్తున్న సమయంలోనే తరువాతి చర్య జరిగిందనే సమకాలీన, కొనసాగుతున్న భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: εὐλογεῖν
  choice: ఆశీర్వదిస్తూ
  rationale: ‘ఆశీర్వదించు’ అనేది మూల క్రియకు సహజమైన, ప్రామాణిక ఆధునిక తెలుగు సమానార్థకం.
- source_word: διέστη ἀπ’ αὐτῶν
  choice: వారి దగ్గర నుండి వేరై
  rationale: వారి నుండి భౌతికంగా విడిపోవడం అనే భావాన్ని స్పష్టంగా ఉంచుతుంది; తరువాతి పైకి కొనిపోబడే చర్యతో సహజంగా కలుస్తుంది.
- source_word: ἀνεφέρετο
  choice: పైకి కొనిపోబడ్డాడు
  rationale: పై దిశలో తీసుకుపోబడుతున్నాడనే నిష్క్రియార్థాన్ని నిలుపుతుంది; చర్యకు కర్త ఎవరో పాఠ్యంలో లేనందున దానిని చేర్చదు.
- source_word: εἰς τὸν οὐρανόν
  choice: పరలోకానికి
  rationale: ఈ సందర్భంలో οὐρανός కేవలం కనిపించే ఆకాశాన్ని కాక పరలోకాన్ని సూచిస్తుంది.
theological_decisions:
- issue: ⸂καὶ ἀνεφέρετο εἰς τὸν οὐρανόν⸃ అనే పాఠభేదం
  choice: ‘పరలోకానికి పైకి కొనిపోబడ్డాడు’ అనే భాగాన్ని ప్రధాన పాఠ్యంలో ఉంచి పాదసూచిక జోడించాం.
  alternative: కొన్ని ప్రాచీన ప్రతుల ప్రకారం ఈ భాగాన్ని వదిలివేయడం.
  rationale: SBLGNT ఈ పదబంధాన్ని సందేహసూచక కుండలీకరణలో ఇస్తుంది. అందువల్ల అందించిన మూలపాఠ్యాన్ని ప్రధాన వాక్యంలో అనువదిస్తూ, నిజమైన పాఠ్య అనిశ్చితిని పాదసూచికలో బహిర్గతం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘జరిగిందేమిటంటే’ వంటి మూల నిర్మాణపు యాంత్రిక ప్రతిరూపాన్ని నివారించాం; నిష్క్రియార్థాన్నీ పాఠభేదాన్నీ మాత్రం నిలిపాం.
