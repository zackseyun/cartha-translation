- from: కాని వారు లోపలికి వెళ్లినప్పుడు[a], ఆ దేహం వారికి కనిపించలేదు.
  to: కాని వారు లోపలికి వెళ్లినప్పుడు, వారికి ఆ దేహం దొరకలేదు[a].
