review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the feminine-plural participants, temporal force of εἰσελθοῦσαι, the mild narrative contrast of δέ, and the shorter SBLGNT reading τὸ σῶμα. However, “వారికి కనిపించలేదు” means that the body was not visible to them, rather than that they did not find it (οὐχ εὗρον).
  naturalness: The temporal clause is natural modern Telugu. Replacing “కనిపించలేదు” with “దొరకలేదు” gives the required finding sense in idiomatic narrative Telugu.
  terminology: “దేహం” suitably renders σῶμα and avoids importing “శవం.” The textual-variant footnote is retained but anchored to the affected noun phrase rather than to “entered.”
  issues:
  - severity: medium
    issue: The main verb is rendered as “వారికి కనిపించలేదు.”
    rationale: This expresses non-visibility, whereas εὗρον denotes finding. “దొరకలేదు” accurately conveys that they did not find the body without adding interpretive content.
  - severity: low
    issue: The textual-variant footnote marker is attached to “వెళ్లినప్పుడు.”
    rationale: The variant concerns τὸ σῶμα, specifically the expanded reading “the body of the Lord Jesus”; its anchor should therefore follow “దేహం.”
  - severity: low
    issue: The footnote says “కొన్ని ప్రాచీన ప్రతుల్లో.”
    rationale: The English audit trail states only “Some manuscripts.” “కొన్ని ప్రతుల్లో” preserves that claim without adding an unsupported characterization of their age.
  revised_text: కాని వారు లోపలికి వెళ్లినప్పుడు, వారికి ఆ దేహం దొరకలేదు[a].
  revised_footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో, “ప్రభువైన యేసు దేహం” అని ఉంది.
    reason: textual_variant
  revision_rationale: The revision restores the lexical sense of οὐχ εὗρον (“did not find”), preserves the source text’s unspecified “the body” in the main line, and moves the variant marker to the phrase affected by the expanded manuscript reading.
