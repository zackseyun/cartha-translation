    reason: textual_variant
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: వారు లోపలికి వెళ్లినప్పుడు
  rationale: స్త్రీలనే సూచించే స్త్రీలింగ బహువచన భూతకాల కృదంతాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా అనువదించాం.
- source_word: δὲ
  choice: కాని
  rationale: కథనాన్ని ముందుకు నడిపిస్తూ, వారు సమాధిలోకి వెళ్లినప్పటికీ ఎదురైన అనూహ్య ఫలితాన్ని స్వల్ప వ్యత్యాసంతో చూపిస్తుంది.
- source_word: οὐχ εὗρον
  choice: వారికి కనిపించలేదు
  rationale: వెదకడం అనే అదనపు భావాన్ని చేర్చకుండా, సమాధిలో దేహం వారికి దొరకలేదనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὸ σῶμα
  choice: ఆ దేహం
  rationale: σῶμα యొక్క సాధారణ అర్థమైన ‘దేహం’ను ఉంచి, ‘శవం’ అనే సందర్భాధారిత తీవ్ర పదాన్ని నివారించాం; నిర్దిష్టతను తెలుగులో ‘ఆ’తో తెలిపాం.
theological_decisions:
- issue: ఎవరి దేహమో పాఠ్యంలో స్పష్టంగా పేర్కొనాలా
  choice: ఆ దేహం
  alternative: ప్రభువైన యేసు దేహం
  rationale: ఇచ్చిన SBLGNT పాఠ్యంలో కేవలం τὸ σῶμα (‘ఆ దేహం’) మాత్రమే ఉంది. కొన్ని ప్రతుల్లో కనిపించే విస్తృత పాఠాన్ని ప్రధాన వాక్యంలో చేర్చకుండా పాదసూచికలో తెలిపాం.
translation_notes:
  register: సహజమైన, ఆధునిక ప్రామాణిక తెలుగు; కథన శైలి సరళంగా, గౌరవప్రదంగా ఉంచబడింది. పాదసూచిక గుర్తు సంబంధిత క్రియాభాగం తర్వాత అమర్చబడింది.
