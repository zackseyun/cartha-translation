  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ διεπορεύετο κατὰ πόλεις καὶ κώμας διδάσκων καὶ πορείαν ποιούμενος εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/022.yaml
  text: And he was traveling through towns and villages[a], teaching and making his way toward Jerusalem.
translation:
  language: te
  text: ఆయన పట్టణాల గుండా, గ్రామాల గుండా వెళ్తూ బోధిస్తూ, యెరూషలేము వైపు ప్రయాణం సాగిస్తున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెరూషలేముకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπορεύετο
  choice: వెళ్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న ప్రయాణాన్ని సూచిస్తుంది; తెలుగు సహజ ప్రయోగంలో ‘వెళ్తూ ఉన్నాడు’ ఆ కొనసాగింపు భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: κατὰ πόλεις καὶ κώμας
  choice: పట్టణాల గుండా గ్రామాల గుండా
  rationale: κατά + ద్వితీయా విభక్తి వివిధ స్థలాల గుండా సాగడాన్ని పంపిణీ భావంతో సూచిస్తుంది; పునరుక్త ‘గుండా’ పెద్ద, చిన్న నివాస ప్రాంతాలన్నిటిలో ప్రయాణించిన భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: διδάσκων
  choice: బోధిస్తూ
  rationale: వర్తమాన కృదంతం ప్రయాణంతోపాటు కొనసాగిన కార్యాన్ని తెలుపుతుంది; ‘బోధిస్తూ’ సంక్షిప్తంగా ఆ సమకాలీన భావాన్ని కాపాడుతుంది.
- source_word: πορείαν ποιούμενος
  choice: ప్రయాణం చేస్తూ
  rationale: ‘ప్రయాణం/మార్గం చేయడం’ అనే మూలభాషా నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా, ఉద్దేశపూర్వకంగా ముందుకు సాగుతున్న భావంతో అందిస్తుంది.
- source_word: εἰς Ἱεροσόλυμα
  choice: యెరూషలేము వైపు
  rationale: εἰς సాధారణంగా గమ్యాన్ని సూచించినా, ఇక్కడ కొనసాగుతున్న ప్రయాణ సందర్భంలో ‘వైపు’ దిశను, ఇంకా చేరుకోని ప్రయాణ ప్రగతిని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: Ἱεροσόλυμα
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన స్థలనామ రూపం.
theological_decisions:
- issue: యేసు యెరూషలేముకు సాగుతున్న ప్రయాణ దిశ
  choice: యెరూషలేము వైపు
  alternative: యెరూషలేముకు
  rationale: లూకా ప్రయాణ కథనంలో కొనసాగుతున్న ముందడుగును, తక్షణ చేరిక కాదనే కథన ఉద్వేగాన్ని ‘వైపు’ కాపాడుతుంది. ఇది అనువాద నిర్ణయం మాత్రమే; అదనపు సిద్ధాంతార్థాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని కొనసాగుతున్న ప్రయాణం, దానితోపాటు జరుగుతున్న బోధ, యెరూషలేము దిశగా ఉద్దేశపూర్వక ప్రగతి—ఈ మూడు అంశాలు సహజ తెలుగు క్రమంలో నిలుపబడ్డాయి.
