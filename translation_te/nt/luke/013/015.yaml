id: LUK.13.15
reference: Luke 13:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀δὲ αὐτῷ ὁ κύριος καὶ εἶπεν· Ὑποκριταί, ἕκαστος ὑμῶν τῷ σαββάτῳ οὐ λύει τὸν βοῦν αὐτοῦ ἢ τὸν ὄνον ἀπὸ τῆς φάτνης καὶ ⸀ἀπαγαγὼν ποτίζει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/015.yaml
  text: But the Lord answered him and said[a], “Hypocrites! Does not each of you on the Sabbath untie his ox or donkey from the feeding trough and lead it away to water it?”
translation:
  language: te
  text: 'అయితే ప్రభువు అతనికి జవాబిస్తూ ఇలా అన్నాడు: “కపటులారా! మీలో ప్రతివాడూ సబ్బాతు రోజున తన ఎద్దునో గాడిదనో మేత తొట్టి[a] నుండి విప్పి, దానిని తీసుకువెళ్లి నీళ్లు తాగించడా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మేత పెట్టే స్థలం.” గ్రీకు పదం φάτνη పశువులకు మేత పెట్టే స్థలాన్ని లేదా తొట్టిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: ప్రభువు
  rationale: లూకా కథనంలో యేసుకు వాడిన గౌరవపూర్వకమైన, క్రీస్తుసంబంధ బరువు గల బిరుదును సహజమైన తెలుగు బైబిలు పదంతో నిలుపుతుంది.
- source_word: Ὑποκριταί
  choice: వేషధారులారా
  rationale: బహువచన సంబోధనలోని తీవ్రమైన మందలింపును ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἕκαστος ὑμῶν
  choice: మీలో ప్రతివాడూ
  rationale: ప్రతి వ్యక్తికీ వర్తించే గ్రీకు పదబంధంలోని విభజక భావాన్ని నిలుపుతుంది.
- source_word: τῷ σαββάτῳ
  choice: విశ్రాంతి దినాన
  rationale: యూదుల సబ్బాతును తెలుగులో ప్రాచుర్యంలో ఉన్న, అర్థవంతమైన పదబంధంతో సూచిస్తుంది.
- source_word: λύει
  choice: విప్పి
  rationale: కట్టివున్న పశువును కట్టు నుంచి విడదీయడమనే సందర్భోచిత అర్థాన్ని సహజంగా తెలుపుతుంది.
- source_word: βοῦν
  choice: ఎద్దు
  rationale: వ్యవసాయ పశువు సందర్భంలో βοῦς‌కు సహజమైన తెలుగు సమానం.
- source_word: ὄνον
  choice: గాడిద
  rationale: ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన సాధారణ సమానం.
- source_word: φάτνης
  choice: మేత తొట్టి
  rationale: పశువుకు మేత పెట్టే స్థలం లేదా తొట్టి అనే సందర్భార్థాన్ని సూటిగా తెలియజేస్తుంది; పదంలోని స్వల్ప అర్థవిస్తృతిని పాదసూచికలో ఉంచింది.
- source_word: ἀπαγαγὼν
  choice: తోలుకుపోయి
  rationale: జంతువును అక్కడి నుంచి నడిపించుకొని వెళ్లడాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ క్రియల క్రమాన్ని నిలుపుతుంది.
- source_word: ποτίζει
  choice: నీళ్లు తాగించడానికి
  rationale: జంతువుకు త్రాగడానికి నీరు ఇవ్వడమనే causative భావాన్ని సహజమైన తెలుగులో తెలుపుతుంది.
theological_decisions:
- issue: యేసుకు వర్తించిన కథన బిరుదు κύριος
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఇక్కడ κύριος యేసును సూచించే లూకా కథన బిరుదు. ‘ప్రభువు’ దాని క్రీస్తుసంబంధ ప్రాధాన్యాన్ని నిలుపుతుంది; ‘యజమాని’ సందర్భాన్ని అనవసరంగా తక్కువ స్థాయి అర్థానికి పరిమితం చేయవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. గ్రీకు ప్రశ్నలోని మందలింపు, ప్రతి శ్రోతనూ ఉద్దేశించిన భావం, చర్యల క్రమం నిలుపబడ్డాయి.
