translation:
  language: te
  text: ఆయన విశ్రాంతిదినాన[a] సమాజమందిరాల్లో ఒకదానిలో బోధిస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విశ్రాంతిదినాలలో’; గ్రీకులో బహువచన రూపం ఉంది, అయితే అది సాధారణంగా ‘విశ్రాంతిదినాన’ అనే ఏకవచనార్థంలో నుడికారంగా వాడబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ διδάσκων
  choice: బోధిస్తూ ఉన్నాడు
  rationale: εἰμί యొక్క భూతకాల అసంపూర్ణ రూపం, διδάσκων అనే వర్తమాన కృదంతంతో కలిసి కొనసాగుతున్న గత కార్యాన్ని సూచిస్తుంది. δέ ఇక్కడ స్వల్ప కథన సంధానాన్ని ఇస్తుంది; తెలుగులో ప్రత్యేక సంధాయక పదం చేర్చకపోవడం సహజంగా ఉంది.
- source_word: ἐν μιᾷ τῶν συναγωγῶν
  choice: సమాజమందిరాల్లో ఒకదానిలో
  rationale: ఇది భాగార్థక నిర్మాణాన్ని నేరుగా నిలుపుతుంది. συναγωγή సూచించే నిర్దిష్ట యూదుల కూడిక స్థలానికి ఆధునిక తెలుగు బైబిలు వాడుకలో సహజమైన ‘సమాజమందిరం’ను ఎంచుకున్నాం.
- source_word: ἐν τοῖς σάββασιν
  choice: విశ్రాంతి రోజున
  rationale: σάββασιν రూపరీత్యా బహువచనమైనా, కొయినే గ్రీకులో ఒక విశ్రాంతి దినాన్ని సూచించే ఏకవచనార్థక నుడికారంగా తరచుగా వాడబడుతుంది. సందర్భంలో సహజమైన ఏకవచనాన్ని ప్రధాన పాఠ్యంలో ఉంచి, రూపపరమైన బహువచన అవకాశాన్ని పాదసూచికలో నిలిపాం.
