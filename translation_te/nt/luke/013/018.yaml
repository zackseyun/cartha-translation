- from: 'కాబట్టి ఆయన ఇలా చెబుతూ ఉన్నాడు: “దేవుని రాజ్యం[a] దేనిలా ఉంది? దాన్ని దేనితో పోల్చాలి?”'
  to: 'అప్పుడు ఆయన ఇలా చెప్పసాగాడు: “దేవుని రాజ్యం[a] దేనిలా ఉంది? మరి దానిని దేనితో పోల్చాలి?”'
  rationale: The revision uses a natural continuative rendering for οὖν, gives a smooth imperfective narrative introduction for Ἔλεγεν, and restores the coordination signaled by καὶ. It retains «దేవుని రాజ్యం» and its alternative footnote, preserving the Greek expression’s semantic breadth.
  reviewer_model: gpt-5.6-terra
