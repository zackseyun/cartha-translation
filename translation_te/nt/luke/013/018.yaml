id: LUK.13.18
reference: Luke 13:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔλεγεν ⸀οὖν· Τίνι ὁμοία ἐστὶν ἡ βασιλεία τοῦ θεοῦ, καὶ τίνι ὁμοιώσω αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/018.yaml
  text: So he was saying[a], “What is the kingdom of God like, and to what shall I compare it?”
translation:
  language: te
  text: 'అప్పుడు ఆయన ఇలా చెప్పసాగాడు: “దేవుని రాజ్యం[a] దేనిలా ఉంది? మరి దానిని దేనితో పోల్చాలి?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవుని పరిపాలన”; ఇది రాజ్య పరిధికంటే దేవుడు పరిపాలించే భావాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: ఆయన ఇలా చెబుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న లేదా సందర్భంలో ముందుకు సాగుతున్న మాటను సూచించగలదు; తెలుగు కథనంలో ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సందర్భంతో ఉన్న కొనసాగింపు లేదా నిర్ధారణ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: Τίνι ὁμοία ἐστὶν
  choice: దేనిలా ఉంది?
  rationale: పోలికను అడిగే గ్రీకు ప్రయోగానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: రాజ్య పరిధి, దేవుని పరిపాలన అనే రెండు భావసాధ్యతలనూ పూర్తిగా మూసివేయకుండా నిలిపే స్థిరమైన బైబిలు పదబంధం.
- source_word: καὶ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: వరుసగా వచ్చే రెండు ప్రశ్నల అనుసంధానం తెలుగు విరామచిహ్నాలు మరియు వాక్యక్రమంలో సహజంగా వ్యక్తమవుతుంది; ‘మరి’ చేరిస్తే మూలంలో లేని అదనపు సంభాషణ ఛాయ రావచ్చు.
- source_word: τίνι ὁμοιώσω αὐτήν
  choice: దాన్ని దేనితో పోల్చాలి?
  rationale: భవిష్యత్ రూపంలోని ఆలోచనాత్మక, అలంకారిక ప్రశ్న బలాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ అనువాదం
  choice: దేవుని రాజ్యం
  alternative: దేవుని పరిపాలన
  rationale: ‘రాజ్యం’ స్థిరమైన బైబిలు వ్యక్తీకరణగా ఉండి, పరిధి మరియు పరిపాలన రెండింటి రూపక విస్తృతిని నిలుపుతుంది; పాదటిప్పణి దాని చలనాత్మక పరిపాలన భావాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘చెబుతూ ఉన్నాడు’ ద్వారా imperfect భావం నిలిపి, రెండు సమాంతర ప్రశ్నలను సంక్షిప్తంగా ఉంచాం.
