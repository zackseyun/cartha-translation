id: LUK.13.2
reference: Luke 13:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Δοκεῖτε ὅτι οἱ Γαλιλαῖοι οὗτοι ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο, ὅτι ⸀ταῦτα πεπόνθασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/002.yaml
  text: And answering, he said to them, “Do you think that these Galileans became sinners beyond all the Galileans, because they have suffered these things?”
translation:
  language: te
  text: 'అందుకు ఆయన వారితో ఇలా అన్నాడు: “ఈ గలిలయులు ఈ బాధలు అనుభవించారు కాబట్టి, వారు మిగతా గలిలయులందరికంటే ఎక్కువ పాపులయ్యారని మీరు అనుకుంటున్నారా?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: అందుకు ఆయన వారితో ఇలా అన్నాడు
  rationale: తెలుగులో సహజమైన ప్రతిస్పందన సూత్రంగా అనువదిస్తూ, ‘జవాబిస్తూ అన్నాడు’ అనే కృత్రిమ పునరుక్తిని నివారించింది.
- source_word: ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο
  choice: మిగతా గలిలయులందరికంటే ఎక్కువ పాపులయ్యారు
  rationale: παρά యొక్క తులనాత్మక భావాన్ని ‘కంటే ఎక్కువ’గా, ἐγένοντο యొక్క రూపాన్ని ‘పాపులయ్యారు’గా నిలిపింది; ఇక్కడ భావం వారి బాధ వారిని పాపులుగా మార్చిందని కాదు, ఆ సంఘటన వారిని అసాధారణ పాపులుగా నిరూపించిందా అన్న ప్రశ్న.
- source_word: ταῦτα πεπόνθασιν
  choice: ఇలాంటి బాధలు అనుభవించారు
  rationale: పూర్తికాల ప్రభావంతో ఉన్న ‘ఈ సంగతులు అనుభవించారు’ అనే భావాన్ని సందర్భానుకూలమైన సహజ తెలుగులో తెలిపింది.
theological_decisions:
- issue: విపత్తు తీవ్రతను వ్యక్తిగత పాప తీవ్రతకు నేర సూచికగా చూడాలా అనే ప్రశ్న
  choice: ప్రశ్నారూపాన్ని యథాతథంగా ఉంచి, యేసు అడిగిన తులనాత్మక ప్రశ్నను ముందుగానే సమాధానపరచలేదు.
  alternative: ‘వారు ఇతరులకంటే ఘోర పాపులు కాబట్టే ఇలా జరిగిందని అనుకుంటున్నారా?’
  rationale: మూల వాక్యం ఈ ఊహను ప్రశ్నిస్తుంది; ఈ వచనంలోనే దానికి వ్యాఖ్యాత్మక నిరాకరణను చేర్చకుండా తదుపరి వచనంలోని సమాధానానికి స్థలం ఉంచడం అవసరం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన వాక్యనిర్మాణం. ‘గలిలయులు’ అనే సాంప్రదాయ బైబిలు జాతి/ప్రాంత నామరూపం నిలిపబడింది.
