id: LUK.13.1
reference: Luke 13:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Παρῆσαν δέ τινες ἐν αὐτῷ τῷ καιρῷ ἀπαγγέλλοντες αὐτῷ περὶ τῶν Γαλιλαίων ὧν τὸ αἷμα Πιλᾶτος ἔμιξεν μετὰ τῶν θυσιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/001.yaml
  text: Some were present at that very time reporting to him about the Galileans whose blood Pilate had mixed with their sacrifices[a].
translation:
  language: te
  text: అదే సమయంలో కొందరు పిలాతు వారి రక్తాన్ని వారి బలులతో కలిపిన[a] ఆ గలిలయుల గురించి ఆయనకు తెలియజేస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి బలులతో మేళవించిన.’
    reason: μίγνυμι అనే క్రియకు ‘కలపడం’తో పాటు ‘మేళవించడం’ అనే సమీప ప్రత్యామ్నాయ అర్థం ఉంది.
lexical_decisions:
- source_word: Παρῆσαν
  choice: అక్కడ ఉన్న
  rationale: పారెయిమి అనే క్రియ యొక్క అసంపూర్ణ భూతకాల రూపం ఇక్కడ వారు వచ్చారని కాక, అక్కడ ఉన్న స్థితిని సూచిస్తుంది.
- source_word: δέ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ స్వల్ప సంధిని సూచిస్తుంది; తెలుగులో వాక్యప్రవాహమే ఆ సంధిని సహజంగా తెలియజేస్తుంది. మూలంలో లేని ‘ఇప్పుడు’ వంటి కాలసూచక పదాన్ని చేర్చలేదు.
- source_word: τινες
  choice: కొందరు
  rationale: అనిర్దిష్ట బహువచన భావాన్ని సహజమైన ఆధునిక తెలుగులో ఇస్తుంది.
- source_word: ἐν αὐτῷ τῷ καιρῷ
  choice: అదే సమయంలో
  rationale: ముందరి సందర్భంలోని నిర్దిష్ట సమయంతో ఉన్న సంబంధాన్ని, αὐτῷ యొక్క బలాన్ని నిలుపుతుంది.
- source_word: ἀπαγγέλλοντες αὐτῷ
  choice: ఆయనకు తెలియజేశారు
  rationale: ఒక వార్తను లేదా నివేదికను అందించడమనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: περὶ τῶν Γαλιλαίων
  choice: ఆ గలిలయుల గురించి
  rationale: περί + షష్ఠీ విభక్తి నివేదిక యొక్క అంశాన్ని సూచిస్తుంది; నిర్దిష్ట సమూహాన్ని తెలుపడానికి ‘ఆ’ వాడబడింది.
- source_word: ὧν τὸ αἷμα
  choice: ఎవరి రక్తాన్ని
  rationale: సంబంధవాచక నిర్మాణాన్ని కాపాడుతూ తెలుగు వాక్యక్రమానికి అనుగుణంగా ఇచ్చింది.
- source_word: Πιλᾶτος
  choice: పిలాతు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ἔμιξεν
  choice: కలిపాడో
  rationale: μίγνυμι యొక్క ‘కలపడం’ అనే ప్రత్యక్ష భావాన్ని నిలుపుతుంది; నివేదికకు ముందు జరిగిన సంఘటనను తెలుగు సందర్భం సహజంగా తెలియజేస్తుంది.
- source_word: μετὰ τῶν θυσιῶν αὐτῶν
  choice: వారి బలులతో
  rationale: μετά యొక్క ‘తో’ భావాన్నీ, αὐτῶν యొక్క స్వామ్యసూచననూ కాపాడుతుంది; వారు బలులు అర్పిస్తున్న సమయంలోనే చంపబడ్డారని వచనంలో లేని వివరాన్ని చేర్చదు.
theological_decisions:
- issue: పిలాతు చేసిన కార్యం యొక్క చారిత్రక, నైతిక భావం
  choice: గలిలయుల రక్తాన్ని వారి బలులతో పిలాతు కలిపాడని సూటిగా అనువదించడం
  alternative: ‘వారు బలులు అర్పిస్తుండగా పిలాతు వారిని చంపించాడు’ అని వివరణాత్మకంగా విస్తరించడం
  rationale: మూలవచనం దిగ్భ్రాంతికరమైన సంఘటనను మాత్రమే నివేదిస్తుంది; అది ఎలా జరిగిందో లేదా దాని ధార్మిక అర్థమేమిటో వివరించదు. అందువల్ల అసలు వాక్యంలోని తీవ్రతను, అనిశ్చితిని నిలిపి ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. ‘బలులు’ అనే పదం θυσίαι యొక్క ఆచారపరమైన భావాన్ని స్పష్టంగా ఇస్తుంది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
