revisions:
- from: యెరూషలేమా, యెరూషలేమా, ప్రవక్తలను చంపుతూ, తన దగ్గరికి పంపబడినవారిని రాళ్లతో కొడుతూ ఉన్నదానా—కోడి తన పిల్లలను తన రెక్కల కిందికి చేర్చుకున్నట్టుగా నీ పిల్లలను చేర్చుకోవాలని ఎన్నిసార్లు కోరుకున్నాను! కానీ మీరు ఇష్టపడలేదు.[a]
  to: యెరూషలేమా, యెరూషలేమా, ప్రవక్తలను చంపే, తన దగ్గరకు పంపబడినవారిని రాళ్లతో కొట్టి చంపే నగరమా—పెట్టకోడి తన పిల్లలను తన రెక్కల కిందకు చేర్చుకున్నట్టు నీ పిల్లలను చేర్చుకోవాలని ఎన్నిసార్లు కోరుకున్నాను! కానీ మీరు కోరుకోలేదు.[a]
