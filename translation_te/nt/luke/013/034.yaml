review_pass:
  verdict: revise
  source_fidelity: The draft retains the repeated lamenting address, Jerusalem’s characteristic violence toward prophets and those sent to it, the maternal bird image, and the meaningful shift from singular Jerusalem to plural ‘you.’ However, ‘రాళ్లతో కొడుతూ’ can describe merely striking with stones and does not adequately convey λιθοβολοῦσα, ‘stoning’ (normally stoning to death).
  naturalness: The overall register is modern and readable, but ‘కోడి’ is somewhat nonspecific in Telugu; ‘పెట్టకోడి’ naturally conveys the maternal ‘hen’ image. A finite relative construction also reads more smoothly than ‘కొడుతూ ఉన్నదానా.’
  terminology: ‘పెట్టకోడి,’ ‘రెక్కల కిందకు,’ and ‘కోరుకున్నాను ... కోరుకోలేదు’ preserve the image and the θέλω/ἠθελήσατε volitional contrast clearly. ‘రాళ్లతో కొట్టి చంపే’ makes the stoning sense explicit without adding interpretation.
  issues:
  - severity: medium
    issue: ‘రాళ్లతో కొడుతూ’ understates λιθοβολοῦσα.
    rationale: The Greek verb denotes stoning, conventionally an execution; the Telugu wording can mean only throwing or striking with stones.
  - severity: low
    issue: ‘కోడి’ does not explicitly represent the maternal hen in the simile.
    rationale: Since the source image gathers a bird’s own brood beneath her wings, ‘పెట్టకోడి’ is the clearer natural Telugu equivalent.
  - severity: low
    issue: The two volitional verbs are rendered with different lexical choices.
    rationale: ‘కోరుకున్నాను ... ఇష్టపడలేదు’ is understandable, but ‘కోరుకున్నాను ... కోరుకోలేదు’ more directly retains the deliberate verbal contrast in the Greek.
  revised_text: యెరూషలేమా, యెరూషలేమా, ప్రవక్తలను చంపే, తన దగ్గరకు పంపబడినవారిని రాళ్లతో కొట్టి చంపే నగరమా—పెట్టకోడి తన పిల్లలను తన రెక్కల కిందకు చేర్చుకున్నట్టు నీ పిల్లలను చేర్చుకోవాలని ఎన్నిసార్లు కోరుకున్నాను! కానీ మీరు కోరుకోలేదు.[a]
  revised_footnotes:
  - marker: a
    text: 'మూలభాషలో చివరి క్రియ బహువచనంలో ఉంది: “మీరు కోరుకోలేదు.” యెరూషలేమును ఏకవచనంగా సంబోధించిన తర్వాత, దాని ప్రజలవైపు సంబోధన మారినట్లు ఇది సూచిస్తుంది.'
    reason: grammatical_ambiguity
