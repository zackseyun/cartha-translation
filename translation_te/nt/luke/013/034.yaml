id: LUK.13.34
reference: Luke 13:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυνάξαι τὰ τέκνα σου ὃν τρόπον ὄρνις τὴν ἑαυτῆς νοσσιὰν ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/034.yaml
  text: Jerusalem[a], Jerusalem, the one killing the prophets and stoning those sent to her—how often I wanted to gather your children the way a hen gathers her brood under her wings[b], and you were not willing.
translation:
  language: te
  text: యెరూషలేమా, యెరూషలేమా, ప్రవక్తలను చంపే, తన దగ్గరకు పంపబడినవారిని రాళ్లతో కొట్టి చంపే నగరమా—పెట్టకోడి తన పిల్లలను తన రెక్కల కిందకు చేర్చుకున్నట్టు నీ పిల్లలను చేర్చుకోవాలని ఎన్నిసార్లు కోరుకున్నాను! కానీ మీరు కోరుకోలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మూలభాషలో చివరి క్రియ బహువచనంలో ఉంది: “మీరు కోరుకోలేదు.” యెరూషలేమును ఏకవచనంగా సంబోధించిన తర్వాత, దాని ప్రజలవైపు సంబోధన మారినట్లు ఇది సూచిస్తుంది.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: యెరూషలేమా, యెరూషలేమా
  rationale: నగరాన్ని నేరుగా సంబోధించే విలాప స్వరాన్ని, ఉద్ఘాటనాత్మక పునరుక్తిని తెలుగు సంబోధన విభక్తితో నిలిపింది.
- source_word: ἡ ἀποκτείνουσα ... καὶ λιθοβολοῦσα
  choice: ప్రవక్తలను చంపుతూ ... రాళ్లతో కొడుతూ ఉన్నదానా
  rationale: వర్తమాన కృదంతాలు యెరూషలేము దేవుని దూతల పట్ల చూపే లక్షణాత్మక ప్రవర్తనను సజీవంగా చిత్రిస్తాయి; తెలుగు స్త్రీలింగ సంబోధన నగర వ్యక్తీకరణను కాపాడుతుంది.
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: తన దగ్గరికి పంపబడినవారిని
  rationale: పరిపూర్ణ కర్మణి కృదంతంలోని పంపబడిన స్థితిని సహజమైన తెలుగులో నిలిపింది; నగరాన్ని స్త్రీలింగ వ్యక్తిగా సూచించే భావాన్ని ‘తన’ కొనసాగిస్తుంది.
- source_word: ποσάκις ἠθέλησα
  choice: ఎన్నిసార్లు కోరుకున్నాను
  rationale: విలాపంలోని పదేపదే వ్యక్తమైన కోరికను సహజంగా, భావోద్వేగ బలంతో తెలియజేస్తుంది.
- source_word: ἐπισυνάξαι τὰ τέκνα σου
  choice: నీ పిల్లలను చేర్చుకోవాలని
  rationale: సమకూర్చడం లేదా తన వద్దకు చేర్చుకోవడం అనే భావాన్ని తెలుగులో సహజంగా అందిస్తూ, ‘నీ పిల్లలు’ అనే నగర-మాత వ్యక్తీకరణను వ్యాఖ్యానించకుండా నిలిపింది.
- source_word: ὄρνις τὴν ἑαυτῆς νοσσιὰν ὑπὸ τὰς πτέρυγας
  choice: కోడి తన పిల్లలను తన రెక్కల కిందికి చేర్చుకున్నట్టుగా
  rationale: ὄρνις విస్తృతంగా ‘పక్షి’ కావచ్చినా, పిల్లలను రెక్కల కింద చేర్చే మాతృరూపకంలో ‘కోడి’ అత్యంత సహజం; νοσσιά యొక్క సమూహార్థం తెలుగులో సహజమైన ‘పిల్లలు’తో వ్యక్తమైంది.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: కానీ మీరు ఇష్టపడలేదు
  rationale: ἠθέλησα / ἠθελήσατε మధ్య ఉన్న సంకల్పపరమైన వ్యత్యాసాన్ని కాపాడుతుంది. బహువచన క్రియ నగరానికి చెందిన పిల్లలు లేదా ప్రజల వైపు సంబోధన మార్పును సూచించే మూలభాషా ఉద్రిక్తతను నిలిపింది.
theological_decisions:
- issue: ‘నీ పిల్లలు’ అనే మాట ఎవరిని సూచిస్తుంది?
  choice: ‘నీ పిల్లలు’ అని మాత్రమే అనువదించి నిర్దిష్ట వివరణ ఇవ్వలేదు.
  alternative: యెరూషలేము నివాసులు; నగరం ప్రతినిధ్యం వహించే ఇశ్రాయేలు ప్రజలు
  rationale: మూలపాఠం యెరూషలేమును తల్లి-నగరంగా వ్యక్తీకరిస్తుంది; సూచిత వర్గాన్ని అనువాదంలో కుదించడం తగదు.
- issue: θέλω / ἠθελήσατε లోని సంకల్ప వ్యత్యాసం
  choice: ‘కోరుకున్నాను ... మీరు ఇష్టపడలేదు’
  alternative: ‘ఇష్టపడ్డాను ... మీరు కోరుకోలేదు’; ‘సమ్మతించాను ... మీరు సమ్మతించలేదు’
  rationale: యేసు కోరికను, ఎదుటివారి నిరాకరణను స్పష్టంగా ఉంచుతూ, దైవ సంకల్పం లేదా మానవ స్వేచ్ఛపై విస్తృత సిద్ధాంత నిర్ణయాన్ని వచనంలోకి చేర్చదు.
- issue: ఏకవచన నగర సంబోధన నుంచి బహువచన నిరాకరణకు మార్పు
  choice: ‘ఉన్నదానా ... మీరు ఇష్టపడలేదు’ అని సంఖ్య మార్పును నిలిపింది.
  alternative: చివరలో కూడా నగరాన్ని ఏకవచనంగా ఉద్దేశించి ‘నీవు ఇష్టపడలేదు’
  rationale: గ్రీకులో ἡ ἀποκτείνουσα స్త్రీలింగ ఏకవచనంగా యెరూషలేమును సూచిస్తే, ἠθελήσατε బహువచనంగా ఉంది. ఈ అర్థవంతమైన మార్పును సమతలీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన విలాప శైలిని ఉపయోగించింది. ‘రాళ్లతో కొడుతూ’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి λιθοβολέω యొక్క శిక్షాత్మక చర్యను తెలియజేస్తుంది. నగర వ్యక్తీకరణ కోసం ‘ఉన్నదానా’ను, మూలంలోని బహువచన ముగింపును నిలపడానికి ‘మీరు’ను ఉపయోగించింది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోతుంది.
