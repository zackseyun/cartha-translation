id: LUK.13.11
reference: Luke 13:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀γυνὴ πνεῦμα ἔχουσα ἀσθενείας ἔτη ⸀δεκαοκτώ, καὶ ἦν συγκύπτουσα καὶ μὴ δυναμένη ἀνακύψαι εἰς τὸ παντελές.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/011.yaml
  text: And behold[a], there was a woman who had a spirit of infirmity for eighteen years, and she was bent over and unable to straighten up completely.
translation:
  language: te
  text: ఇదిగో, పద్దెనిమిది సంవత్సరాలుగా బలహీనతకు సంబంధించిన ఆత్మ కలిగిన ఒక స్త్రీ ఉండేది.[a] ఆమె వంగిపోయి, పూర్తిగా నిటారుగా నిలబడలేకపోయేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘బలహీనత యొక్క ఆత్మ కలిగిన స్త్రీ.’ గ్రీకులో ‘ఆత్మ’ అని స్పష్టంగా ఉంది; ఇది ఆమె బాధతో సంబంధం ఉన్న ఆత్మసంబంధ ప్రభావాన్ని సూచించవచ్చు, అయితే ఈ వచనం దానిని మరింత నిర్దిష్టంగా వివరించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: కథనంలో శ్రోత దృష్టిని ఆకర్షించే గ్రీకు అవ్యయపు సజీవతను సహజమైన ఆధునిక తెలుగు పదంతో నిలిపింది.
- source_word: γυνὴ
  choice: ఒక స్త్రీ
  rationale: ఈ సందర్భంలో మొదటిసారి పరిచయమవుతున్న నిర్దిష్టతలేని వ్యక్తిని సహజంగా సూచిస్తుంది.
- source_word: πνεῦμα ἔχουσα ἀσθενείας
  choice: బలహీనపరిచే ఆత్మ పట్టిన
  rationale: πνεῦμα అనే స్పష్టమైన ఆత్మసంబంధ సూచనను నిలుపుతూ, ἀσθενείας తెలిపే శారీరక దుర్బలతను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; దయ్యం పట్టిందని మూలం కంటే నిర్దిష్టంగా చెప్పదు.
- source_word: ἔτη δεκαοκτώ
  choice: పద్దెనిమిది సంవత్సరాలుగా
  rationale: స్థితి కొనసాగిన కాలవ్యవధిని సహజమైన తెలుగు కాలరూపంలో వ్యక్తపరుస్తుంది.
- source_word: συγκύπτουσα
  choice: నడుము వంగిపోయి
  rationale: ఆమె శరీరం ముందుకు వంగిన స్థితిని స్పష్టంగా, అతిశయోక్తి లేకుండా తెలియజేస్తుంది.
- source_word: μὴ δυναμένη ἀνακύψαι εἰς τὸ παντελές
  choice: ఏమాత్రం నిటారుగా నిలబడలేకపోయేది
  rationale: పైకి నిటారుగా కావలేని అసమర్థతను, εἰς τὸ παντελές ఇచ్చే సంపూర్ణతా బలాన్ని కలిపి సహజంగా అందిస్తుంది.
theological_decisions:
- issue: πνεῦμα ἀσθενείας ఆత్మసంబంధ కారణాన్ని సూచిస్తుందా, లేక కేవలం వ్యాధిని సూచిస్తుందా
  choice: ప్రధాన పాఠ్యంలో ‘బలహీనపరిచే ఆత్మ’ అని స్పష్టమైన ఆత్మసంబంధ సూచనను నిలిపింది.
  alternative: ‘బలహీనత కలిగినది’ లేదా ‘వ్యాధిగలది’ అని కేవలం శారీరక స్థితిగా అనువదించడం.
  rationale: గ్రీకు పాఠ్యంలో πνεῦμα స్పష్టంగా ఉంది. అయితే అది దయ్యమని ఈ వచనం తానే నిర్దిష్టంగా చెప్పనందున, ఆ అదనపు నిర్ణయాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథన గౌరవాన్ని నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదప్రయోగం. ‘ఇదిగో’ కథన దృష్ట్యాకర్షణను నిలుపుతుంది; ‘బలహీనపరిచే ఆత్మ’ మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను సాధ్యమైనంత సహజంగా కాపాడుతుంది.
