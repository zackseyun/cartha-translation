id: LUK.13.9
reference: Luke 13:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κἂν μὲν ποιήσῃ καρπὸν ⸂εἰς τὸ μέλλον— εἰ δὲ μήγε,⸃ ἐκκόψεις αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/009.yaml
  text: And if it bears fruit in the future—well and good; but if not[a], you will cut it down.
translation:
  language: te
  text: అది ఇకముందు[a] ఫలిస్తే—మంచిదే; లేకపోతే, దాన్ని నరికివేస్తావు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వచ్చే సంవత్సరం’; కొన్ని అనువాదాలు ముందరి వచనంలోని కాలసూచనను అనుసరించి ఇలా నిర్దిష్టంగా చెబుతాయి. అయితే ఇక్కడి గ్రీకు పదబంధం అక్షరార్థంగా ‘ఇకముందు’ లేదా ‘రాబోయే కాలంలో’ అని ఉంటుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: κἂν μὲν
  choice: అది ... ఫలిస్తే
  rationale: καί + ἐάν షరతును పరిచయం చేస్తుంది; μέν తరువాతి δέతో వ్యత్యాసాన్ని ఏర్పరుస్తుంది. తెలుగులో సహజమైన షరతు నిర్మాణం ద్వారా ఈ భావం వ్యక్తమవుతుంది.
- source_word: ποιήσῃ καρπὸν
  choice: ఫలిస్తే
  rationale: ποιέω + καρπός వ్యవసాయ సందర్భంలో ‘ఫలం కాయడం/ఫలించడం’ అనే నుడికారార్థం ఇస్తుంది. అంజూరపు చెట్టుకు ‘ఫలిస్తే’ సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: εἰς τὸ μέλλον
  choice: ఇకముందు
  rationale: ఈ పదబంధం ‘రాబోయే కాలంలో/భవిష్యత్తులో’ అనే సాధారణ కాలార్థాన్ని ఇస్తుంది; ముందరి వచనం ఆధారంగా ‘వచ్చే సంవత్సరం’ అని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: εἰ δὲ μήγε
  choice: లేకపోతే
  rationale: మొదటి షరతుకు విరుద్ధమైన ఫలితాన్ని తెలుగులో సహజంగా తెలియజేస్తూ δέ యొక్క వ్యత్యాసాన్ని, μήγε యొక్క నిరాకరణను నిలుపుతుంది.
- source_word: ἐκκόψεις αὐτήν
  choice: దాన్ని నరికివేస్తావు
  rationale: తోటపని సందర్భంలో ἐκκόπτω చెట్టును నరికి తొలగించడాన్ని సూచిస్తుంది. రెండవ పురుష ఏకవచన భవిష్యత్ రూపాన్ని ‘నరికివేస్తావు’ నిలుపుతుంది.
theological_decisions:
- issue: యజమాని వాయిదా వేసిన తీర్పుకు సంబంధించిన కాలార్థం
  choice: ప్రధాన పాఠ్యంలో ‘ఇకముందు’ అని సాధారణ రాబోయే కాలాన్ని ఉంచడం
  alternative: ముందరి వచనంలోని ‘ఈ సంవత్సరం’ ఆధారంగా ‘వచ్చే సంవత్సరం’ అని అనువదించడం
  rationale: ఈ వచనంలోని εἰς τὸ μέλλον స్వయంగా ‘వచ్చే సంవత్సరం’ అని చెప్పదు. అందువల్ల ఉపమానంలోని ఆలస్యమైనా సంభవించగల తీర్పును నిలుపుతూ, కాలాన్ని అతిగా నిర్దిష్టం చేయకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. వ్యవసాయ ఉపమానాన్ని సహజమైన ‘ఫలిస్తే’, ‘నరికివేస్తావు’ అనే పదాలతో నిలిపాం. గ్రీకు వాక్యంలో స్పష్టంగా లేని ‘మంచిదే’ భావం సందర్భానుగుణంగా సరఫరా చేయబడింది; డాష్ ఆ అసంపూర్ణ/సంక్షిప్త ఫలిత నిర్మాణాన్ని సూచిస్తుంది.
