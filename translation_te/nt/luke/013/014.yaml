  to: 'అయితే, యేసు విశ్రాంతిదినాన స్వస్థపరిచాడని ఆగ్రహించిన సమాజమందిరపు అధికారి ప్రత్యుత్తరంగా జనసమూహానికి ఇలా అన్నాడు: “పని చేయవలసిన రోజులు ఆరు ఉన్నాయి. కాబట్టి ఆ రోజుల్లో వచ్చి స్వస్థత పొందండి; విశ్రాంతిదినాన కాదు.”'
