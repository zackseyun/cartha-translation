id: LUK.13.14
reference: Luke 13:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἀρχισυνάγωγος, ἀγανακτῶν ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς, ἔλεγεν τῷ ὄχλῳ ⸀ὅτι Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι· ἐν ⸀αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/014.yaml
  text: But the synagogue ruler answered[a], indignant because Jesus had healed on the Sabbath, and said to the crowd, “There are six days in which it is necessary to work; so come on those days and be healed, and not on the day of the Sabbath.”
translation:
  language: te
  text: 'అయితే, యేసు విశ్రాంతిదినాన స్వస్థపరిచాడని ఆగ్రహించిన సమాజమందిరపు అధికారి ప్రత్యుత్తరంగా జనసమూహానికి ఇలా అన్నాడు: “పని చేయవలసిన రోజులు ఆరు ఉన్నాయి. కాబట్టి ఆ రోజుల్లో వచ్చి స్వస్థత పొందండి; విశ్రాంతిదినాన కాదు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρχισυνάγωγος
  choice: సమాజమందిరపు అధికారి
  rationale: సమాజమందిరపు వ్యవహారాలను పర్యవేక్షించే వ్యక్తిని సూచిస్తుంది; పౌరపాలకుడనే భావం రాకుండా పదవిని సహజంగా తెలియజేస్తుంది.
- source_word: ἀγανακτῶν
  choice: ఆగ్రహించి
  rationale: తీవ్రమైన అసంతృప్తి, అభ్యంతర భావాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: τῷ σαββάτῳ
  choice: విశ్రాంతిదినాన
  rationale: యూదుల సబ్బాతు దినాన్ని తెలుగులో అర్థవంతంగా, గౌరవప్రదంగా సూచిస్తుంది.
- source_word: ἐθεράπευσεν
  choice: స్వస్థపరిచాడని
  rationale: θεραπεύω ఇక్కడ రోగం లేదా బలహీనత నుంచి స్వస్థపరచడాన్ని సూచిస్తుంది.
- source_word: ἔλεγεν τῷ ὄχλῳ
  choice: జనసమూహంతో ఇలా అన్నాడు
  rationale: గ్రీకు imperfect సందర్భంలో ప్రసంగాన్ని పరిచయం చేస్తోంది; తెలుగులో కృత్రిమమైన కొనసాగింపు రూపం కన్నా ఈ రూపం సహజంగా ఉంటుంది.
- source_word: Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι
  choice: పని చేయవలసిన రోజులు ఆరు ఉన్నాయి
  rationale: δεῖలోని కర్తవ్య లేదా ఆవశ్యకత భావాన్ని ‘చేయవలసిన’ నిలుపుతుంది; మూల నిర్మాణాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: ἐρχόμενοι θεραπεύεσθε
  choice: వచ్చి స్వస్థత పొందండి
  rationale: ఆజ్ఞార్థక భావాన్ని, ప్రజలు రావడం మరియు స్వస్థత పొందడం అనే రెండు అంశాలను స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: పని మరియు స్వస్థపరచడం గురించి సమాజమందిరపు అధికారి చేసిన నియమబద్ధ అభ్యంతరం
  choice: “పని చేయవలసిన రోజులు ఆరు ఉన్నాయి. కాబట్టి ఆ రోజుల్లో వచ్చి స్వస్థత పొందండి” అని అతని మాటలను నేరుగా నివేదించడం
  alternative: అతని మాటలను కపటత్వంగా ముందుగానే వ్యాఖ్యానించే స్వేచ్ఛానువాదం
  rationale: ఇది ఆ అధికారి దృక్కోణం; వాక్యం దానిని దేవుని ఆమోదంగా చూపదు. అనువాదం వ్యాఖ్యానాన్ని చేర్చకుండా కథనంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథనశైలి. ‘సమాజమందిరం,’ ‘విశ్రాంతిదినం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉపయోగిస్తూ అనవసరమైన ప్రాచీన క్రియారూపాలను నివారించింది.
