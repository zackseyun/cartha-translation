source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς τὸν ἀμπελουργόν· Ἰδοὺ τρία ἔτη ⸂ἀφ’ οὗ⸃ ἔρχομαι ζητῶν καρπὸν ἐν τῇ συκῇ ταύτῃ καὶ οὐχ εὑρίσκω· ⸀ἔκκοψον αὐτήν· ἱνατί καὶ τὴν γῆν καταργεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/007.yaml
  text: Then he said to the vine-dresser[a], ‘Look, for three years now I have come seeking fruit on this fig tree and have found none. Cut it down. Why should it even keep using up the ground?’
translation:
  language: te
  text: అప్పుడు అతడు ద్రాక్షతోటను సాగుచేసేవానితో, “చూడు, మూడేళ్లుగా నేను ఈ అంజూరపు చెట్టులో పండును వెదుకుతూ వస్తున్నాను, కానీ ఏ పండూ దొరకడం లేదు. దీన్ని నరికివేయి. ఇది నేల ప్రయోజనాన్ని కూడా ఎందుకు వృథా చేయాలి?[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇది నేలను కూడా ఎందుకు పనికిరాకుండా చేయాలి?” గ్రీకు క్రియ కేవలం స్థలాన్ని ఆక్రమించడం మాత్రమే కాక, నేలను ఫలించనిదిగా లేదా ఉపయోగం లేనిదిగా చేయడం అనే భావాన్ని కూడా ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμπελουργόν
  choice: ద్రాక్షతోటను సాగుచేసేవాడు
  rationale: ద్రాక్షతోటలో పనిచేసి దానిని సాగుచేసే వ్యక్తిని సూచించే ఖచ్చితమైన, సహజమైన పదబంధం; విస్తృతార్థమున్న ‘తోటమాలి’ కంటే మూలంలోని ద్రాక్షతోట సందర్భాన్ని నిలుపుతుంది.
- source_word: Ἰδοὺ
  choice: చూడు
  rationale: శ్రోత దృష్టిని బలంగా ఆకర్షించే సంభాషణాత్మక ప్రయోగం; ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: τρία ἔτη ἀφ’ οὗ
  choice: మూడేళ్లుగా
  rationale: గతంలో మొదలై ప్రస్తుతంవరకు కొనసాగుతున్న కాలవ్యవధిని తెలుగులో సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἔρχομαι ζητῶν
  choice: పండు కోసం వస్తున్నాను
  rationale: మూడేళ్ల కాలంలో పునరావృతమవుతున్న రావడం, వెదకడం అనే చర్యను సందర్భానుసారంగా వ్యక్తం చేస్తుంది.
- source_word: καρπὸν
  choice: పండు
  rationale: ఉపమాన కథలోని ప్రత్యక్ష వ్యవసాయ అర్థాన్ని నిలుపుతుంది; ఆధ్యాత్మిక భావాన్ని అనువాదంలో ముందుగానే చొప్పించదు.
- source_word: συκῇ
  choice: అంజూరపు చెట్టు
  rationale: మూలపదానికి సాధారణ తెలుగు సమానం.
- source_word: οὐχ εὑρίσκω
  choice: ఏదీ దొరకడం లేదు
  rationale: గ్రీకు వర్తమాన కాలాన్ని, పునరావృతంగా ఫలించని వెదుకులాట ఫలితాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἔκκοψον
  choice: దీన్ని నరికివేయి
  rationale: చెట్టును తొలగించమనే సూటి ఆజ్ఞను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ τὴν γῆν καταργεῖ
  choice: ఇది నేలను కూడా ఎందుకు వృథా చేయాలి?
  rationale: ఫలించని చెట్టు నేల ప్రయోజనాన్ని వ్యర్థం చేస్తున్నదనే సందర్భార్థాన్ని సహజంగా అందిస్తుంది; ‘కూడా’ καί యొక్క అదనపు బలాన్ని నిలుపుతుంది. καταργεῖలోని ‘పనికిరాకుండా చేయడం’ అనే బలమైన ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: ఉపమాన కథలోని వ్యవసాయ చిత్రణకు ఆధ్యాత్మిక వివరణను జోడించాలా
  choice: వ్యవసాయ భాషను యథాతథంగా ఉంచడం
  alternative: ‘ఆత్మీయ ఫలం’ లేదా తీర్పు గురించి వివరణాత్మక పదాలను వాక్యంలో చేర్చడం
  rationale: మూలవాక్యం ఉపమాన చిత్రణనే ఇస్తుంది. దాని ఆధ్యాత్మిక అన్వయాన్ని అనువాదంలో ముందుగానే నిర్ణయించకుండా సందర్భానికి వదిలివేయడం మూలానికి నమ్మకమైనది.
- issue: καταργεῖ అర్థ పరిధి
  choice: నేలను వృథా చేయడం
  alternative: నేలను పనికిరాకుండా చేయడం
  rationale: ప్రధాన పాఠంలో సహజమైన వ్యవసాయ సందర్భార్థాన్ని ఇచ్చి, క్రియలో ఉండగల మరింత బలమైన ‘నిష్ఫలం/పనికిరానిదిగా చేయడం’ అనే భావాన్ని పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ద్రాక్షతోటను సాగుచేసేవాడు’ అనే రూపం సాధారణ పాఠకుడికి అర్థమయ్యేలా ఉండి, మూలంలోని వృత్తి మరియు ద్రాక్షతోట సందర్భం రెండింటినీ నిలుపుతుంది. పాదసూచిక గుర్తు [a] సంబంధిత సందిగ్ధ క్రియ ఉన్న ప్రశ్న వద్ద ఉంచబడింది.
