source:
  edition: SBLGNT
  text: καὶ ἥξουσιν ἀπὸ ἀνατολῶν καὶ δυσμῶν καὶ ⸀ἀπὸ βορρᾶ καὶ νότου καὶ ἀνακλιθήσονται ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/029.yaml
  text: And they will come from east and west[a], and from north and south, and will recline at table in the kingdom of God.
translation:
  language: te
  text: తూర్పు నుంచీ పడమర నుంచీ, ఉత్తరం నుంచీ దక్షిణం నుంచీ వచ్చి, దేవుని రాజ్యంలో విందుకు కూర్చుంటారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకు పదం ప్రాచీన విందులో భోజన బల్ల దగ్గర ఆనుకొని పడుకోవడాన్ని మరింత నిర్దిష్టంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξουσιν
  choice: ప్రజలు వచ్చి
  rationale: ἥκω భవిష్యత్ రూపం ఇక్కడ ‘వస్తారు/చేరుకుంటారు’ అనే భావాన్ని ఇస్తుంది. తెలుగులో తరువాతి క్రియతో సహజంగా అనుసంధానించడానికి ‘వచ్చి’ అని అనువదించాం; గ్రీకులో వ్యక్తులు స్పష్టంగా పేర్కొనబడకపోయినా, బహువచన కర్తను సహజంగా తెలియజేయడానికి ‘ప్రజలు’ చేర్చాం.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: తూర్పు నుంచీ పడమర నుంచీ
  rationale: బహువచన రూపాల్లో ఉన్న ‘సూర్యోదయాలు, సూర్యాస్తమయాలు’ దిక్కులను సూచించే నానుడి. ఆధునిక తెలుగులో సహజమైన దిక్సూచక రూపాలను వాడాం.
- source_word: ἀπὸ βορρᾶ καὶ νότου
  choice: ఉత్తరం నుంచీ దక్షిణం నుంచీ
  rationale: నాలుగు దిక్కులనుంచి వచ్చే విస్తృత సమూహాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνακλιθήσονται
  choice: విందుకు కూర్చుంటారు
  rationale: ἀνακλίνω విందు సందర్భంలో భోజనం కోసం బల్ల దగ్గర ఆనుకొని పడుకోవడాన్ని సూచిస్తుంది. ప్రాచీన భోజన భంగిమను అక్షరార్థంగా చెప్పడం ఆధునిక తెలుగు పాఠకులకు అపార్థం కలిగించవచ్చు; ‘విందుకు కూర్చుంటారు’ భోజన సందర్భాన్ని నిలుపుతూ సహజంగా ఉంటుంది. నిర్దిష్ట సాంస్కృతిక భంగిమను పాదసూచిక వివరిస్తుంది.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: దేవుని రాజ్యంలో
  rationale: దైవ రాజ్యానికి సంబంధించిన ప్రామాణికమైన, పారదర్శకమైన తెలుగు వ్యక్తీకరణ; βασιλεία యొక్క భావాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించదు.
theological_decisions:
- issue: అంత్యకాల రాజ్యంలో విందు చిత్రం
  choice: ‘విందుకు కూర్చుంటారు’ అని భోజన చిత్రాన్ని నిలుపడం
  alternative: ‘దేవుని రాజ్యంలో ప్రవేశిస్తారు’ లేదా కేవలం ‘కూర్చుంటారు’
  rationale: మూలంలోని ἀνακλιθήσονται రాజ్యంలో భాగస్వామ్యాన్ని విందు రూపకంతో చూపుతుంది. ‘ప్రవేశిస్తారు’ అని అనడం ఆ స్పష్టమైన చిత్రాన్ని తొలగిస్తుంది; కేవలం ‘కూర్చుంటారు’ అంటే భోజన సందర్భం మరుగవుతుంది.
- issue: నాలుగు దిక్కుల విస్తృతి
  choice: ప్రజలు నాలుగు దిక్కులనుంచి వస్తారని నేరుగా అనువదించడం
  alternative: వారిని ప్రధాన పాఠ్యంలో అన్యజనులుగా స్పష్టంగా గుర్తించడం
  rationale: వాక్యం విశ్వవ్యాప్త భౌగోళిక విస్తృతిని సూచిస్తుంది గాని, వారి జాతి గుర్తింపును స్వయంగా పేర్కొనదు. అందుచేత అనువాదం ఆ విస్తృతిని కాపాడి, అదనపు గుర్తింపును చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘నుంచీ’ అనే సమాంతర పునరుక్తి నాలుగు దిక్కుల లయను నిలుపుతుంది. ప్రాచీన విందు భంగిమను ప్రధాన పాఠ్యంలో అసహజంగా అక్షరార్థం చేయకుండా, పాదసూచికలో స్పష్టం చేశాం.
