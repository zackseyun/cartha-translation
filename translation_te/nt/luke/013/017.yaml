id: LUK.13.17
reference: Luke 13:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ταῦτα λέγοντος αὐτοῦ κατῃσχύνοντο πάντες οἱ ἀντικείμενοι αὐτῷ, καὶ πᾶς ὁ ὄχλος ἔχαιρεν ἐπὶ πᾶσιν τοῖς ἐνδόξοις τοῖς γινομένοις ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/017.yaml
  text: And as he was saying these things[a], all who were opposing him were put to shame[b], and the whole crowd was rejoicing over all the glorious things being done by him.
translation:
  language: te
  text: ఆయన ఈ మాటలు చెబుతుండగా, ఆయనను ఎదిరిస్తున్న వారందరూ అవమానానికి గురయ్యారు; ఆయనచేత జరుగుతున్న మహిమాన్వితమైన కార్యాలన్నిటిని బట్టి జనసమూహమంతా ఆనందిస్తూ ఉండింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα λέγοντος αὐτοῦ
  choice: ఆయన ఈ మాటలు చెబుతుండగా
  rationale: వర్తమాన కృదంతంతో కూడిన genitive absolute, ఆయన మాట్లాడుతున్న సమయంలోనే తదుపరి ప్రతిస్పందనలు జరుగుతున్నాయని సూచిస్తుంది.
- source_word: κατῃσχύνοντο
  choice: సిగ్గుపడేలా అయ్యారు
  rationale: అసంపూర్ణ భూతకాలంలోని passive/middle భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, వారు కేవలం అంతరంగంలో సిగ్గుపడడం కాక బహిరంగంగా సిగ్గుకు గురయ్యారనే సూచనను నిలుపుతుంది.
- source_word: οἱ ἀντικείμενοι αὐτῷ
  choice: ఆయనను ఎదిరిస్తున్న వారు
  rationale: కృదంతంలోని క్రియాత్మక, కొనసాగుతున్న వ్యతిరేకతను ‘విరోధులు’ అనే సంక్షిప్త నామవాచకం కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: πᾶς ὁ ὄχλος
  choice: జనసమూహమంతా
  rationale: ఏకవచన సమూహార్థక గ్రీకు ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో సమగ్రతతో వ్యక్తం చేస్తుంది.
- source_word: ἔχαιρεν
  choice: సంతోషిస్తూ ఉంది
  rationale: అసంపూర్ణ భూతకాలం సూచించే కొనసాగుతున్న ఆనందాన్ని తెలుగులో durative రూపంతో తెలియజేస్తుంది.
- source_word: ἐπὶ πᾶσιν τοῖς ἐνδόξοις
  choice: మహిమాన్వితమైన కార్యాలన్నిటిని చూసి
  rationale: ἐπί + dative సూచించే ఆనందానికి కారణం/ఆధారాన్ని సహజంగా వ్యక్తం చేస్తూ, ἔνδοξος లోని ‘మహిమాన్వితమైన’ విశాల భావాన్ని నిలుపుతుంది.
- source_word: τοῖς γινομένοις ὑπ’ αὐτοῦ
  choice: ఆయన చేస్తున్న ... కార్యాలు
  rationale: ὑπό + genitive ద్వారా యేసే ఆ కార్యాల కర్త అని నిలుపుతూ, వర్తమాన కృదంతంలోని కొనసాగుతున్న చర్యను సహజమైన క్రియారూపంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘మహిమాన్వితమైన కార్యాలు’ స్వభావం
  choice: మహిమాన్వితమైన కార్యాలు
  alternative: అద్భుత కార్యాలు / ఆశ్చర్యకరమైన కార్యాలు
  rationale: సందర్భంలో స్వస్థత ఉన్నప్పటికీ ἐνδόξοις అనే పదం అద్భుతాలకు మాత్రమే పరిమితం కాదు; మహిమగల, ఘనమైన కార్యాలనే విశాల భావాన్ని అనువాదం నిలుపుతుంది.
- issue: ὑπ’ αὐτοῦలో కర్తృత్వం
  choice: ఆయన చేస్తున్న
  alternative: ఆయన ద్వారా జరుగుతున్న
  rationale: గ్రీకు నిర్మాణం యేసును కార్యాల కర్తగా నేరుగా సూచిస్తుంది; ‘ఆయన చేస్తున్న’ అనే రూపం ఆ కర్తృత్వాన్ని తగ్గించకుండా సహజంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని కొనసాగుతున్న చర్యలను ‘చెబుతుండగా,’ ‘ఎదిరిస్తున్న,’ ‘సంతోషిస్తూ ఉంది’ రూపాలతో నిలిపాం. ఈ వచనానికి పాదటిప్పణి అవసరం లేదు; అందువల్ల ప్రధాన పాఠ్యంలో గుర్తులు లేవు.
