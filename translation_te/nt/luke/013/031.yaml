id: LUK.13.31
reference: Luke 13:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ⸀ὥρᾳ προσῆλθάν τινες Φαρισαῖοι λέγοντες αὐτῷ· Ἔξελθε καὶ πορεύου ἐντεῦθεν, ὅτι Ἡρῴδης θέλει σε ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/031.yaml
  text: At that very hour some Pharisees came up and said to him[a], “Leave and go away from here[b], because Herod wants to kill you.”
translation:
  language: te
  text: అదే వేళ కొందరు పరిసయ్యులు ఆయన దగ్గరకు వచ్చి ఆయనతో, “ఇక్కడి నుంచి బయలుదేరి వెళ్లిపో; ఎందుకంటే హేరోదు నిన్ను చంపాలని కోరుతున్నాడు” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: అదే సమయంలో
  rationale: αὐτῇ గల నిర్దిష్టతను, సందర్భంతో ఉన్న తక్షణ సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; అక్షరార్థమైన ‘అదే గంటలో’ తెలుగు సందర్భంలో కృత్రిమంగా వినిపిస్తుంది.
- source_word: προσῆλθάν
  choice: దగ్గరికి వచ్చి
  rationale: యేసును సమీపించిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τινες Φαρισαῖοι
  choice: కొందరు పరిసయ్యులు
  rationale: τινες లోని అనిర్దిష్ట భావాన్ని నిలుపుతుంది; ఏ పరిసయ్యులని ప్రత్యేకంగా గుర్తించదు.
- source_word: λέγοντες αὐτῷ
  choice: అని ఆయనతో అన్నారు
  rationale: సమకాలిక గ్రీకు కృదంతాన్ని తెలుగులో సహజమైన ప్రధాన క్రియగా అందిస్తుంది.
- source_word: Ἔξελθε καὶ πορεύου ἐντεῦθεν
  choice: ఇక్కడి నుంచి బయలుదేరి వెళ్లిపో
  rationale: రెండు ఆజ్ఞారూప క్రియలైన ‘బయటకు వెళ్లు’ మరియు ‘ప్రయాణించి పో’ అనే కదలికను తెలుగు సహజ ప్రయోగంలో నిలుపుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: హెచ్చరికకు కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: Ἡρῴδης
  choice: హేరోదు
  rationale: తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణమైన లిప్యంతరీకరణ.
- source_word: θέλει
  choice: కోరుతున్నాడు
  rationale: θέλω యొక్క కోరిక లేదా ఇష్ట భావాన్ని నిలుపుతుంది; ‘నిశ్చయించుకున్నాడు’ అని ఉద్దేశపూర్వక ప్రణాళికను అతిగా సూచించదు.
- source_word: ἀποκτεῖναι
  choice: చంపాలని
  rationale: క్రియ యొక్క విస్తృతమైన ‘చంపు’ అర్థాన్ని నేరుగా అందిస్తుంది; అధికారిక మరణశిక్ష భావాన్ని అనవసరంగా జోడించదు.
theological_decisions:
- issue: పరిసయ్యుల హెచ్చరిక వెనుక ఉద్దేశం
  choice: వారి మాటను ఒక హెచ్చరికగా మాత్రమే నేరుగా అనువదించడం
  alternative: వారు యేసును నిజాయితీగా హెచ్చరించారని లేదా భయపెట్టి పంపించాలని చూశారని స్పష్టీకరించడం
  rationale: గ్రీకు వచనం వారి అంతరంగ ఉద్దేశాన్ని వెల్లడించదు. అందువల్ల వారి నిజాయితీ, మోసం, లేదా హేరోదుతో కుమ్మక్కు వంటి వ్యాఖ్యానాలను అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గౌరవప్రదమైన కథన శైలిని నిలిపాం. మూలంలో నిజమైన పాఠభేదం లేదా తెలుగులో తప్పనిసరిగా వివరించాల్సిన ద్వంద్వార్థం లేనందున పాదసూచికలు ఇవ్వలేదు.
