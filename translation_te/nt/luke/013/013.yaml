source:
  edition: SBLGNT
  text: καὶ ἐπέθηκεν αὐτῇ τὰς χεῖρας· καὶ παραχρῆμα ἀνωρθώθη, καὶ ἐδόξαζεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/013.yaml
  text: And he laid his hands on her, and immediately she was made straight again, and she glorified God.
translation:
  language: te
  text: ఆయన ఆమెపై తన చేతులు ఉంచాడు. వెంటనే ఆమె నిటారుగా చేయబడింది[a], దేవుణ్ణి మహిమపరచసాగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిటారుగా నిలబడింది”; లేదా, “నిటారుగా అయింది.”
    reason: ἀνωρθώθη నిష్క్రియ క్రియ సందర్భంలో వంగిపోయిన స్త్రీ నిటారుగా పునరుద్ధరించబడడాన్ని సూచిస్తుంది; తెలుగులో దాని సహజ ఫలితార్థాన్ని వివిధ రీతుల్లో వ్యక్తం చేయవచ్చు.
lexical_decisions:
- source_word: ἐπέθηκεν αὐτῇ τὰς χεῖρας
  choice: ఆమె మీద తన చేతులు ఉంచాడు
  rationale: చేతులు ఉంచడం అనే గ్రీకు ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ‘తన’ అనేది చేతులు యేసువేనని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: παραχρῆμα
  choice: వెంటనే
  rationale: స్వస్థత ఆలస్యం లేకుండా సంభవించిందనే గ్రీకు క్రియావిశేషణ భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ἀνωρθώθη
  choice: నిటారుగా అయి
  rationale: ముందు వంగిపోయిన స్త్రీ శారీరకంగా నిటారైనదనే సందర్భార్థాన్ని తెలుపుతుంది. గ్రీకులో స్పష్టంగా లేని ‘మళ్లీ’ అనే భావాన్ని ప్రధాన పాఠ్యంలో చేర్చదు; రూపాన్ని సహజ తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా ఉంచుతుంది.
- source_word: ἐδόξαζεν
  choice: మహిమపరుస్తూ ఉంది
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న ప్రతిస్పందనను నిలుపుతూ, δοξάζω యొక్క దేవునికి మహిమ చెల్లించే భావాన్ని కాపాడుతుంది.
- source_word: τὸν θεόν
  choice: దేవుణ్ణి
  rationale: క్రియకు ప్రత్యక్ష కర్మగా ఉన్న ‘దేవుడు’ అనే పదానికి సహజమైన తెలుగు ద్వితీయావిభక్తి రూపం.
theological_decisions:
- issue: ἀνωρθώθη వర్ణించే స్వస్థత ఫలితం
  choice: శారీరకంగా ‘నిటారుగా అయి’
  alternative: నిటారుగా చేయబడింది; నిలువుగా నిలబడింది; మళ్లీ నిటారైంది
  rationale: ముందరి సందర్భంలో ఆమె వంగిపోయి తనంతట తాను నిటారుగా కాలేకపోయిందని ఉంది. ఈ ఎంపిక శారీరక స్వస్థతను తెలియజేస్తుంది, కానీ స్వస్థత విధానం గురించి అదనపు సిద్ధాంతార్థాన్ని చేర్చదు; ‘మళ్లీ’ అనే మూలంలో స్పష్టంగా లేని కాలసూచనను కూడా బలవంతంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గౌరవప్రదమైన బైబిలు కథన శైలిలో రూపొందించబడింది. గ్రీకు వాక్యంలోని వరుస ‘మరియు’లను తెలుగులో యాంత్రికంగా పునరావృతం చేయకుండా, సంఘటనల క్రమాన్ని పూర్తి విరామం మరియు ‘వెంటనే’ ద్వారా సహజంగా తెలిపింది.
