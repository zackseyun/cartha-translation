base_translation:
  language: en
  yaml_path: translation/nt/luke/013/005.yaml
  text: No[a], I tell you; but unless you repent, you will all likewise perish.
translation:
  language: te
  text: కాదు, నేను మీతో చెబుతున్నాను; కానీ మీరు పశ్చాత్తాపపడకపోతే, మీరందరూ అలాగే నశిస్తారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అదే విధంగా నశిస్తారు.’ గ్రీకులోని ‘అలాగే’ అనే పదం, ముందటి ఉదాహరణలను దృష్టిలో ఉంచుకొని, ఇలాంటి విధంగా నశించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: కాదు
  rationale: ముందున్న సందర్భంలో అంతర్లీనంగా ఉన్న ప్రశ్నకు ఇచ్చిన దృఢమైన ప్రతికూల జవాబును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: λέγω ὑμῖν
  choice: మీతో చెబుతున్నాను
  rationale: లూకా రచనలో సాధారణంగా కనిపించే ఈ సూత్రప్రాయ వాక్యాన్ని సహజంగా, మూలానికి దగ్గరగా అందిస్తుంది.
- source_word: ἀλλ’ ἐὰν μὴ
  choice: కానీ ... పడకపోతే
  rationale: వ్యతిరేక మలుపుతో కూడిన షరతును సహజ తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: μετανοῆτε
  choice: మీరు పశ్చాత్తాపపడకపోతే
  rationale: దేవుని ఎదుట మనస్సు మరియు దిశ మారడాన్ని సూచించే గంభీరమైన పిలుపును నిలుపుతుంది; దాన్ని కేవలం విచారంగా లేదా మేధోపరమైన అభిప్రాయ మార్పుగా కుదించదు.
- source_word: πάντες
  choice: మీరందరూ
  rationale: హెచ్చరిక శ్రోతలందరికీ వర్తిస్తుందనే సమగ్ర భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ὡσαύτως
  choice: అలాగే
  rationale: ముందు చెప్పిన ఉదాహరణలతో పోలికను సూచిస్తూ, ఆ పోలిక విధానానికా, నిశ్చయతకా, తీర్పుకా సంబంధించినదో అతిగా నిర్దిష్టం చేయదు.
- source_word: ἀπολεῖσθε
  choice: నశిస్తారు
  rationale: ἀπόλλυμι లోని వినాశం లేదా నాశనానికి గురికావడం అనే గంభీర భావాన్ని నిలుపుతూ, దాన్ని కేవలం శారీరక మరణానికి పరిమితం చేయదు.
theological_decisions:
- issue: యేసు హెచ్చరికలో పశ్చాత్తాపం అర్థం
  choice: μετανοῆτε ను ‘పశ్చాత్తాపపడండి’ భావంతో అనువదించడం
  alternative: మనస్సు మార్చుకోండి; తిరిగి రండి
  rationale: ఈ పదాన్ని కేవలం అంతరంగ విచారంగా గానీ, సంపూర్ణ సిద్ధాంత వివరణగా గానీ కుదించకుండా దాని బైబిలీయ గంభీరతను నిలుపుతుంది.
- issue: ὡσαύτως ἀπολεῖσθε యొక్క భావబలం
  choice: ‘అలాగే నశిస్తారు’
  alternative: అదే విధంగా నశిస్తారు; అలాగే చనిపోతారు
  rationale: ముందటి సంఘటనలలోని వారితో పోల్చదగిన తీర్పును సూచిస్తుంది; అయితే పోలిక యొక్క ఖచ్చిత అంశం స్పష్టంగా లేనందున దానిని అనువాదంలో పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన హెచ్చరిక స్వరం. ‘పశ్చాత్తాపపడకపోతే’ అనే స్థిరమైన బైబిలీయ పదప్రయోగాన్ని ఉపయోగిస్తూ దాని భావాన్ని ఏకపక్షంగా సంకుచితం చేయలేదు. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
