source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἰσὶν ἔσχατοι οἳ ἔσονται πρῶτοι, καὶ εἰσὶν πρῶτοι οἳ ἔσονται ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/030.yaml
  text: And behold[a], there are last who will be first, and there are first who will be last.
translation:
  language: te
  text: ఇదిగో, చివరివారిగా ఉన్నవారిలో కొందరు మొదటివారవుతారు; మొదటివారిగా ఉన్నవారిలో కొందరు చివరివారవుతారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రోతల దృష్టిని తరువాతి మాటపై నిలిపే గ్రీకు సంభాషణాత్మక బలాన్ని, ఆధునిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన రీతిలో వ్యక్తం చేస్తుంది.
- source_word: ἔσχατοι
  choice: చివరివారు
  rationale: స్థానం లేదా హోదాలో చివరగా ఉన్నవారనే భావాన్ని ఉంచి, πρῶτοι అనే పదంతో ఉన్న సంక్షిప్త వ్యతిరేక సమాంతరతను కాపాడుతుంది; ‘అల్పులు’ అనే నైతిక అర్థాన్ని అనవసరంగా చేర్చదు.
- source_word: πρῶτοι
  choice: మొదటివారు
  rationale: ἔσχατοι కి నేరమైన వ్యతిరేక పదంగా ఉండి, పలుకుబడిలోని స్థానమార్పు భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: οἳ ἔσονται
  choice: అవుతారు
  rationale: భవిష్యత్ స్థితిని సహజమైన తెలుగు క్రియారూపంలో తెలియజేస్తుంది; ‘ఉంటారు’ కంటే స్థానమార్పు భావాన్ని సందర్భానుసారంగా సులభంగా వ్యక్తం చేస్తుంది.
- source_word: εἰσὶν
  choice: ఉన్న కొందరు
  rationale: గ్రీకులోని అస్తిత్వార్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, విశేషణాన్ని వ్యక్తుల సమూహంగా అర్థమయ్యేలా చేస్తుంది; ఇది అందరూ అని సాధారణీకరించకుండా అనిర్దిష్ట సమూహాన్ని సూచిస్తుంది.
- source_word: καὶ
  choice: ;
  rationale: రెండు సమతుల్యమైన వ్యతిరేక వాక్యభాగాల సంబంధాన్ని తెలుగులో సెమికోలన్ ద్వారా స్పష్టంగా, సంక్షిప్తంగా చూపుతుంది; భావపరంగా గ్రీకు καὶ కలిపే సమాంతరత కొనసాగుతుంది.
theological_decisions:
- issue: స్థానమార్పు వాక్యపు పరిధి
  choice: ఏ జాతి, సామాజిక వర్గం, లేదా తీర్పులోని నిర్దిష్ట స్థాయిని పేర్కొనకుండా సాధారణ స్థానమార్పు సూత్రంగా అనువదించబడింది.
  alternative: దీనిని ప్రత్యేకంగా యూదులు–యూదేతరులు, వినయం–గర్వం, లేదా అంతిమ తీర్పులోని హోదాలకు మాత్రమే పరిమితం చేయడం.
  rationale: సందర్భం దేవుని రాజ్యంలో ప్రవేశాన్ని సూచించినప్పటికీ, గ్రీకు వాక్యం ఉద్దేశపూర్వకంగా సంక్షిప్తంగా మరియు విస్తృతంగా ఉంది. అనువాదంలో ఒకే వ్యాఖ్యానాన్ని చేర్చకుండా ఆ వేదాంతపరమైన విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన, సూత్రవాక్యానికి తగిన సంక్షిప్త శైలి. ‘చివరివారిగా/మొదటివారిగా ఉన్న కొందరు’ అనే నిర్మాణం గ్రీకు బహువచన విశేషణాల వ్యక్తిసూచక ప్రయోగాన్ని తెలుగులో స్పష్టం చేస్తుంది. మూలంలో లేని వ్యాఖ్యానాత్మక వర్గీకరణను చేర్చలేదు.
