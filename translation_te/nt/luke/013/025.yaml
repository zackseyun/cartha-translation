revisions:
- from: ఇంటి యజమాని లేచి తలుపు మూసివేసిన తరువాత[a], మీరు బయట నిలబడి తలుపు తడుతూ, ‘ప్రభువా[b], మాకు తలుపు తెరువు’ అని అనడం మొదలుపెడతారు. అప్పుడు ఆయన, ‘మీరు ఎక్కడివారో నాకు తెలియదు[c]’ అని మీకు జవాబిస్తాడు.
  to: ఇంటి యజమాని లేచి తలుపు మూసివేసిన తరువాత[a], మీరు బయట నిలబడి తలుపు తడుతూ, ‘ప్రభువా[b], మాకు తలుపు తెరువు’ అని అనడం మొదలుపెడతారు. అప్పుడు ఆయన, ‘మిమ్మల్ని నేను ఎరుగను; మీరు ఎక్కడివారో నాకు తెలియదు[c]’ అని మీకు జవాబిస్తాడు.
  rationale: 'సవరణ కేవలం చివరి ప్రత్యుత్తరంలో గ్రీకులో ఉన్న స్పష్టమైన ‘మిమ్మల్ని’ అనే కర్మను పునరుద్ధరిస్తుంది మరియు దానికి సంబంధించిన పాదసూచికను వ్యాకరణపరంగా సరిచేస్తుంది. ‘ఎరుగను’ ఇక్కడ ఉద్దేశపూర్వకంగా పరిమితంగా వాడబడింది: ఇది మూలంలోని ‘I do not know you’ను స్పష్టంగా ఇస్తుంది; రెండవ వాక్యం πόθεν ἐστέలోని మూలం/ఎక్కడి నుండి వచ్చారనే భావాన్ని సహజంగా తెలియజేస్తుంది.'
