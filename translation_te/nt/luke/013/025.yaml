id: LUK.13.25
reference: Luke 13:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀφ’ οὗ ἂν ἐγερθῇ ὁ οἰκοδεσπότης καὶ ἀποκλείσῃ τὴν θύραν, καὶ ἄρξησθε ἔξω ἑστάναι καὶ κρούειν τὴν θύραν λέγοντες· ⸀Κύριε, ἄνοιξον ἡμῖν· καὶ ἀποκριθεὶς ἐρεῖ ὑμῖν· Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/025.yaml
  text: Once the master of the house has risen and shut the door[a], and you begin to stand outside and knock on the door, saying, ‘Lord, open to us,’ then he will answer you, ‘I do not know you[c][b], where you are from.’
translation:
  language: te
  text: ఇంటి యజమాని లేచి తలుపు మూసివేసిన తరువాత[a], మీరు బయట నిలబడి తలుపు తడుతూ, ‘ప్రభువా[b], మాకు తలుపు తెరువు’ అని అనడం మొదలుపెడతారు. అప్పుడు ఆయన, ‘మిమ్మల్ని నేను ఎరుగను; మీరు ఎక్కడివారో నాకు తెలియదు[c]’ అని మీకు జవాబిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదక్షరంగా: ‘ఇంటి యజమాని లేచి తలుపు మూసివేసినప్పటి నుంచి.’'
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పదాన్ని ‘యజమానీ’ లేదా ‘అయ్యా’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: c
    text: 'గ్రీకులో మరింత పదక్షరంగా: ‘మిమ్మల్ని నేను ఎరుగను—మీరు ఎక్కడివారో.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ οὗ ἂν
  choice: '...తరువాత'
  rationale: ఈ నిర్మాణం అనిశ్చిత కాలసూచక ఉపవాక్యాన్ని ప్రవేశపెడుతుంది. సందర్భంలో ‘తరువాత’ సహజంగా ఉండి, ఇంటి యజమాని చర్య అనంతరం జరిగే పరిణామాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐγερθῇ
  choice: లేచి
  rationale: ఇక్కడ అర్థం కూర్చున్న లేదా ఆనుకొని ఉన్న స్థితి నుంచి లేవడం; పునరుత్థానం కాదు. ‘లేచి’ ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: οἰκοδεσπότης
  choice: ఇంటి యజమాని
  rationale: ఇల్లు మరియు దానిపై అధికారం కలిగిన వ్యక్తి అనే భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: ἀποκλείσῃ τὴν θύραν
  choice: తలుపు మూసివేసిన
  rationale: కేవలం తలుపు వేయడం మాత్రమే కాక, బయటివారికి ప్రవేశం నిలిపివేసే నిర్ణయాత్మక భావాన్ని ‘మూసివేసిన’ తెలియజేస్తుంది.
- source_word: ἔξω ἑστάναι
  choice: బయట నిలబడి
  rationale: పరిపూర్ణ క్రియారూపం సూచించే బయట నిలిచి ఉన్న స్థితిని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: κρούειν τὴν θύραν
  choice: తలుపు తడుతూ
  rationale: తలుపుపై ప్రవేశం కోరుతూ మళ్లీ మళ్లీ తట్టే చర్యకు సాధారణ తెలుగు ప్రయోగం.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: κύριος యొక్క ప్రాథమిక గౌరవార్థక, అధికారార్థక భావాన్ని నిలుపుతుంది; లూకా రచనలో ఉండగల విస్తృత ధార్మిక ప్రతిధ్వనిని ముందుగానే పరిమితం చేయదు.
- source_word: ἄνοιξον ἡμῖν
  choice: మాకు తలుపు తెరువు
  rationale: గ్రీకులో ‘తలుపు’ రెండోసారి స్పష్టంగా లేకపోయినా తెలుగులో కర్మను చేర్చడం సహజం; సందర్భంలో ఎలాంటి కొత్త సమాచారమూ చేరదు.
- source_word: ἀποκριθεὶς ἐρεῖ
  choice: జవాబిస్తాడు
  rationale: కృదంతం మరియు ప్రధాన క్రియ కలిగిన గ్రీకు కథన ప్రయోగాన్ని తెలుగులో సహజమైన ఒక క్రియగా అందిస్తుంది.
- source_word: Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: మీరు ఎక్కడివారో నాకు తెలియదు
  rationale: వ్యక్తుల గుర్తింపు మరియు వారి మూలం రెండింటినీ కలిపి చెప్పే గ్రీకు వాక్యాన్ని సహజమైన తెలుగులో అందిస్తుంది; మరింత పదక్షర రూపాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: ఉపమానంలోని సంబోధన κύριος
  choice: ప్రభువా
  alternative: యజమానీ / అయ్యా
  rationale: సందర్భంలో ఇది ఇంటి యజమానికి చేసే గౌరవ సంబోధనగా అర్థమవవచ్చు. అయినా ‘ప్రభువా’ మూలపదపు అధికార భావాన్నీ, లూకా రచనలోని సంభావ్య ధార్మిక ప్రతిధ్వనినీ తెరిచి ఉంచుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచిక తెలియజేస్తుంది.
- issue: οὐκ οἶδα ὑμᾶς πόθεν ἐστέ యొక్క బలం
  choice: మీరు ఎక్కడివారో నాకు తెలియదు
  alternative: మీరు నాకు తెలియదు; మీరు ఎక్కడివారో తెలియదు
  rationale: గ్రీకులో ‘మిమ్మల్ని’ అనే ప్రత్యక్ష కర్మతో పాటు ‘మీరు ఎక్కడివారు’ అనే భాగమూ ఉంది. ప్రధాన పాఠంలోని తెలుగు రెండింటినీ గుర్తింపు/మూలం అనే సహజ వాక్యనిర్మాణంలో కలుపుతుంది; పాదసూచిక మూలరూపంలోని ఉద్రిక్తతను సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు సులభమైన శైలి వాడబడింది. ‘తలుపు తడుతూ’ వంటి సహజ ప్రయోగాలు తీసుకున్నాం; మూలంలోని అసహజమైనా అర్థవంతమైన చివరి వాక్య నిర్మాణాన్ని పాదసూచికలో నిలిపాం.
