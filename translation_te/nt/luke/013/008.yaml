  source_fidelity: గ్రీకు మూలపాఠంలోని సంభాషణ క్రమం, అదనపు సంవత్సరానికి చేసిన విజ్ఞప్తి (καὶ τοῦτο τὸ ἔτος), చెట్టు చుట్టూ తవ్వడం, పేడ వేయడం అన్న స్పష్టమైన వ్యవసాయచిత్రం అన్నీ యథార్థంగా ఉన్నాయి. “దాన్ని అలాగే ఉండనివ్వండి” అనేది ἄφες αὐτήν యొక్క ‘వదిలివేయండి/ఉండనివ్వండి’ భావాన్ని, ‘నరకవద్దు’ వంటి అదనపు వ్యాఖ్యానాన్ని చేర్చకుండా, సరిగ్గా అందిస్తుంది. “అయ్యా” ఇక్కడి ఉపమాన-సందర్భంలోని Κύριεకు సహజమైన గౌరవసంబోధన; పాదటిప్పణి ప్రత్యామ్నాయాన్ని సూచిస్తుంది.
