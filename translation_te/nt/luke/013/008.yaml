source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς λέγει αὐτῷ· Κύριε, ἄφες αὐτὴν καὶ τοῦτο τὸ ἔτος, ἕως ὅτου σκάψω περὶ αὐτὴν καὶ βάλω κόπρια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/008.yaml
  text: But he answered and said to him[a], ‘Lord, leave it alone this year also[b], until I dig around it and put manure on it.’
translation:
  language: te
  text: 'అయితే అతడు అతనికి జవాబుగా ఇలా అన్నాడు: “అయ్యా[a], నేను దాని చుట్టూ తవ్వి పేడ[b] వేసేంతవరకు, ఈ సంవత్సరం కూడా దాన్ని అలాగే ఉండనివ్వండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రభువా”; ఈ ఉపమాన సందర్భంలో “యజమానీ” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అంటే ఎరువుగా ఉపయోగించే పేడ; మరింత సాధారణంగా, “ఎరువు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς λέγει αὐτῷ
  choice: అతడు అతనికి జవాబుగా ఇలా అన్నాడు
  rationale: గ్రీకులోని కృదంతం + ప్రధాన క్రియ నిర్మాణంలోని ‘జవాబిచ్చి చెప్పాడు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: Κύριε
  choice: అయ్యా
  rationale: ఉపమానంలోని తోట యజమానిని గౌరవంగా సంబోధించే పదంగా ఇక్కడ κύριε పనిచేస్తుంది. ‘అయ్యా’ ఆ గౌరవార్థాన్ని సహజంగా వ్యక్తం చేస్తూ, ఈ సందర్భంలో అవసరం లేని దైవార్థాన్ని బలవంతంగా చేర్చదు.
- source_word: ἄφες αὐτὴν
  choice: దాన్ని అలాగే ఉండనివ్వండి
  rationale: చెట్టును ప్రస్తుతానికి తొలగించకుండా ఉన్నచోటే ఉండనివ్వాలనే ἀφίημι భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది; ‘దాన్ని కాపాడండి’ అనడం సందర్భంలో సూచితమైన భావాన్ని క్రియలోనే స్పష్టంగా చేర్చినట్లవుతుంది.
- source_word: καὶ τοῦτο τὸ ἔτος
  choice: ఈ సంవత్సరం కూడా
  rationale: అదనంగా ఈ సంవత్సరమంతా అవకాశం ఇవ్వాలనే గ్రీకు పదబంధపు ప్రత్యక్ష భావాన్ని నిలుపుతుంది.
- source_word: ἕως ὅτου
  choice: వేసేంతవరకు
  rationale: తవ్వడం, పేడ వేయడం అనే చర్యలు పూర్తయ్యే వరకు గడువును సూచించే నిర్మాణాన్ని తెలుగులో సహజంగా కలుపుతుంది.
- source_word: σκάψω περὶ αὐτὴν
  choice: నేను దాని చుట్టూ తవ్వి
  rationale: σκάπτω అనే ‘తవ్వు’ క్రియ యొక్క స్పష్టమైన వ్యవసాయ చిత్రాన్ని వ్యాఖ్యానించి విస్తరించకుండా నిలుపుతుంది.
- source_word: βάλω κόπρια
  choice: పేడ వేసి
  rationale: κόπρια అంటే ఎరువుగా ఉపయోగించే పేడ. సాధారణమైన ‘ఎరువు’ కంటే ‘పేడ’ మూలపాఠంలోని స్పష్టమైన, భౌతిక చిత్రాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఉపమానంలో κύριος అనే సంబోధన
  choice: అయ్యా
  alternative: ప్రభువా; యజమానీ
  rationale: ఇది ఉపమానంలోని తోట యజమానికి చేసిన గౌరవ సంబోధన. ‘అయ్యా’ ఆ సందర్భార్థాన్ని నిలుపుతూ, దేవునికి మాత్రమే వర్తించే బిరుదుగా ముందుగానే నిర్ణయించదు; ‘యజమానీ’ అనడం సంబంధాన్ని మరింత స్పష్టంగా వ్యాఖ్యానిస్తుంది.
- issue: ἄφες లో సూచితమైన చెట్టుకు గడువు ఇవ్వడం
  choice: దాన్ని అలాగే ఉండనివ్వండి
  alternative: దాన్ని కాపాడండి; దాన్ని నరకకుండా ఉంచండి
  rationale: సందర్భంలో చెట్టును నరకకుండా వదలడం ఉద్దేశమైనప్పటికీ, గ్రీకు క్రియ స్వయంగా ‘నరకడం’ అని చెప్పదు. అందువల్ల సూచిత భావాన్ని ప్రధాన పాఠంలో అధికంగా విప్పకుండా ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవపూర్వక కథన శైలి వాడబడింది. సంభాషణలో బహువచన గౌరవ క్రియారూపం ఉపయోగించబడింది; వ్యవసాయ దృశ్యంలోని స్పష్టత కోసం ‘పేడ’ నిలుపబడింది.
