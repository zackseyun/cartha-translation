- from: మీరు అబ్రాహాము, ఇస్సాకు, యాకోబు, ప్రవక్తలందరూ దేవుని రాజ్యంలో ఉండడాన్ని, మిమ్మల్ని మాత్రం బయటికి తోసివేయడాన్ని చూసినప్పుడు, అక్కడ ఏడుపూ పండ్లు కొరకడమూ ఉంటాయి.
  to: అక్కడ ఏడుపూ పళ్లు కొరుక్కోవడమూ ఉంటాయి; మీరు అబ్రాహాము, ఇస్సాకు, యాకోబు, ప్రవక్తలందరూ దేవుని రాజ్యంలో ఉండడాన్ని, మీరు మాత్రం బయటికి తోసివేయబడడాన్ని చూసినప్పుడు.
