id: LUK.13.28
reference: Luke 13:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων, ὅταν ⸀ὄψησθε Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ καὶ πάντας τοὺς προφήτας ἐν τῇ βασιλείᾳ τοῦ θεοῦ, ὑμᾶς δὲ ἐκβαλλομένους ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/028.yaml
  text: There will be weeping and gnashing of teeth there[a], when you see Abraham and Isaac and Jacob and all the prophets in the kingdom of God[c][b], but you yourselves thrown out.
translation:
  language: te
  text: అక్కడ ఏడుపూ పళ్లు కొరుక్కోవడమూ ఉంటాయి; మీరు అబ్రాహాము, ఇస్సాకు, యాకోబు, ప్రవక్తలందరూ దేవుని రాజ్యంలో ఉండడాన్ని, మీరు మాత్రం బయటికి తోసివేయబడడాన్ని చూసినప్పుడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκεῖ
  choice: అక్కడ
  rationale: తిరస్కరించబడి బయట ఉండే స్థలాన్ని సూచించే స్థానవాచక క్రియావిశేషణాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ κλαυθμὸς
  choice: ఏడుపు
  rationale: దుఃఖం, వేదనతో కూడిన రోదనను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; మూలపదం కంటే భావాన్ని అతిశయింపజేయదు.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: పండ్లు కొరకడం
  rationale: తీవ్రమైన వేదన లేదా ఆగ్రహాన్ని చిత్రించే గ్రీకు నుడికారానికి తెలుగులో స్థిరమైన, సులభంగా అర్థమయ్యే వ్యక్తీకరణ.
- source_word: ὅταν ὄψησθε
  choice: మీరు ... చూసినప్పుడు
  rationale: నిర్దిష్టమైన భవిష్యత్ దృశ్యాన్ని పరిచయం చేసే ὅταν మరియు aorist subjunctive భావాన్ని సహజమైన తెలుగు కాలవాక్యంతో అందిస్తుంది.
- source_word: πάντας τοὺς προφήτας
  choice: ప్రవక్తలందరూ
  rationale: πάντας లోని సమగ్రతను ‘అందరూ’ ద్వారా నిలుపుతుంది.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: దేవుని రాజ్యంలో
  rationale: ప్రధాన బైబిలు పదబంధాన్ని నేరుగా, పరిచితమైన రూపంలో నిలుపుతుంది.
- source_word: ὑμᾶς δὲ
  choice: మిమ్మల్ని మాత్రం
  rationale: δέ సూచించే వ్యత్యాసాన్నీ, స్పష్టంగా ఉంచిన ὑμᾶς యొక్క ఉద్ఘాటననూ ‘మాత్రం’ సహజంగా వెల్లడిస్తుంది.
- source_word: ἐκβαλλομένους ἔξω
  choice: బయటికి తోసివేయడాన్ని
  rationale: ἐκβάλλω లోని బలవంతపు బహిష్కరణ భావాన్ని ‘తోసివేయడం’ నిలుపుతుంది; ἔξω ను ‘బయటికి’ స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: తీర్పు దృశ్య స్వభావం
  choice: రాజ్యం నుంచి బలవంతంగా బయటికి పంపబడటం, దానితో కూడిన వేదన అనే స్పష్టమైన చిత్రణను యథాతథంగా నిలుపడం.
  alternative: ‘అంతిమ శిక్ష’ లేదా ‘తీవ్ర దుఃఖం’ వంటి సిద్ధాంతాత్మక వివరణతో విపులీకరించడం.
  rationale: వచనం బహిష్కరణను, వేదనను చిత్రిస్తుంది గాని తీర్పుకు సంబంధించిన పూర్తి సిద్ధాంతాన్ని నిర్వచించదు; అందువల్ల అనువాదం మూల చిత్రణను మించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం వాడబడింది. పేర్లు తెలుగు బైబిలు వాడుకకు అనుగుణంగా ఉంచబడ్డాయి. గ్రీకు వాక్యంలో ఉన్న రాజ్యంలోవారు–బయటికి తోసివేయబడేవారు అనే వ్యత్యాసం ‘మాత్రం’ ద్వారా స్పష్టంగా నిలుపబడింది.
