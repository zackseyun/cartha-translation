review_pass:
  verdict: revise
  source_fidelity: The draft retains the principal scene, the patriarchs and prophets in God’s kingdom, and the contrasting exclusion of the hearers. However, “పండ్లు కొరకడం” ordinarily means biting fruit and does not render βρυγμὸς τῶν ὀδόντων (‘gnashing of teeth’). The final embedded clause also needs a passive construction that makes the hearers, rather than an unspecified act of expulsion, the object of what is seen.
  naturalness: The revised wording is idiomatic modern standard Telugu. “పళ్లు కొరుక్కోవడం” is a clear, conventional way to convey the anguish imagery, and “మీరు మాత్రం బయటికి తోసివేయబడడాన్ని” naturally expresses the contrasting passive participial clause.
  terminology: “దేవుని రాజ్యం,” “అబ్రాహాము,” “ఇస్సాకు,” “యాకోబు,” and “ప్రవక్తలందరూ” are suitable established biblical terminology. “పళ్లు కొరుక్కోవడం” corrects the dental imagery without adding doctrinal interpretation.
  issues:
  - severity: high
    issue: “పండ్లు కొరకడం” is used for βρυγμὸς τῶν ὀδόντων.
    rationale: “పండ్లు” normally denotes fruits in modern Telugu, so the phrase means ‘biting fruits,’ not gnashing teeth. “పళ్లు కొరుక్కోవడం” explicitly conveys the source expression.
  - severity: medium
    issue: The exclusion clause is phrased as “మిమ్మల్ని మాత్రం బయటికి తోసివేయడాన్ని.”
    rationale: This form can foreground an act done to ‘you’ rather than the passive state represented by ἐκβαλλομένους. Recasting it with “మీరు ... తోసివేయబడడాన్ని” preserves the participle’s passive sense and the contrast with those in the kingdom.
  revised_text: అక్కడ ఏడుపూ పళ్లు కొరుక్కోవడమూ ఉంటాయి; మీరు అబ్రాహాము, ఇస్సాకు, యాకోబు, ప్రవక్తలందరూ దేవుని రాజ్యంలో ఉండడాన్ని, మీరు మాత్రం బయటికి తోసివేయబడడాన్ని చూసినప్పుడు.
  revised_footnotes: []
