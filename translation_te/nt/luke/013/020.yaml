id: LUK.13.20
reference: Luke 13:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Καὶ πάλιν εἶπεν· Τίνι ὁμοιώσω τὴν βασιλείαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/020.yaml
  text: And again he said, “To what shall I compare the kingdom of God?”
translation:
  language: te
  text: 'మళ్లీ ఆయన ఇలా అన్నాడు: “దేవుని రాజ్యాన్ని దేనితో పోల్చాలి?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: ఇలా
  rationale: గ్రీకు వాక్యంలోని సాధారణ అనుసంధానాన్ని తెలుగులో సహజమైన ప్రత్యక్ష వాక్య పరిచయంతో వ్యక్తం చేస్తుంది; πάλιν‌తో కలిసి అనవసరమైన ‘మరియు’ను నివారిస్తుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: పునరావృత్తిని నేరుగా, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: εἶπεν
  choice: ఆయన ... అన్నాడు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే λέγω యొక్క కథన ప్రయోగానికి సహజమైన తెలుగు రూపం; సందర్భానుసారంగా కర్తను ‘ఆయన’గా వ్యక్తం చేసింది.
- source_word: Τίνι
  choice: దేనితో
  rationale: ఇది వ్యక్తిని కాక పోలికకు ఆధారమైన దానిని అడిగే నపుంసక ఏకవచన దత్తి రూపం; తెలుగులో ‘దేనితో’ పోలిక నిర్మాణానికి సహజం.
- source_word: ὁμοιώσω
  choice: పోల్చాలి
  rationale: భవిష్యత్ రూపంలోని ఆలోచనాత్మక ప్రశ్నార్థక బలాన్ని తెలుగులో సహజమైన ‘పోల్చాలి?’ ద్వారా అందిస్తుంది; కేవలం బాధ్యతను విధించే భావంగా కాక వక్త తనతోనే ప్రశ్నించుకునే భావంగా చదవబడుతుంది.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: దేవుని రాజాధికారం, పాలన, రాజ్య పరిధి అనే భావ విస్తృతిని నిలుపుకునే స్థిరమైన బైబిలు పదబంధం.
theological_decisions:
- issue: దేవుని పాలనను సూచించే βασιλεία అనువాదం
  choice: దేవుని రాజ్యం
  alternative: దేవుని పరిపాలన
  rationale: ‘రాజ్యం’ అనే పదం దేవుని రాజాధికారాన్నీ దాని పరిధినీ కలిపి సూచించే మూలపద భావ విస్తృతిని మెరుగ్గా నిలుపుతుంది; ‘పరిపాలన’ చలనాత్మక పాలన భావానికే పరిమితం కావచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. చిన్న వాక్యంలోని అలంకారిక ప్రశ్నను సహజంగా ఉంచింది.
