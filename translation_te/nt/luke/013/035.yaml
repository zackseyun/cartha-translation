id: LUK.13.35
reference: Luke 13:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ⸀ὑμῶν. λέγω ⸀δὲ ⸀ὑμῖν, οὐ μὴ ⸂ἴδητέ με⸃ ἕως ⸂ἥξει ὅτε⸃ εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/035.yaml
  text: Look[a], your house is left to you. And I tell you, you will certainly not see me until the time comes when you say[d][c][b], ‘Blessed is the one who comes in the name of the Lord.’
translation:
  language: te
  text: 'ఇదిగో, మీ ఇల్లు మీకే విడిచిపెట్టబడుతోంది.[a] నేను మీతో చెబుతున్నాను: మీరు, ‘ప్రభువు పేరున వచ్చువాడు ధన్యుడు’ అని చెప్పే సమయం వచ్చేవరకు నన్ను ఎంతమాత్రమూ చూడరు.[b][c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విడిచిపెట్టబడుతోంది’ అనే మాటను ‘వదిలివేయబడుతోంది’ లేదా ‘పరిత్యజించబడుతోంది’ అని కూడా అనువదించవచ్చు. గ్రీకు కర్మణి రూపం తీర్పుగా అప్పగించబడడం అనే భావాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘మీ ఇల్లు’ అనేది బహుశా యెరూషలేమును, ముఖ్యంగా దాని దేవాలయాన్ని సూచిస్తుంది; అయితే గ్రీకు పాఠ్యం కేవలం ‘మీ ఇల్లు’ అని మాత్రమే చెప్తుంది.
    reason: alternative_reading
  - marker: c
    text: ‘ప్రభువు పేరున వచ్చువాడు ధన్యుడు’ అనే మాట కీర్తన 118:26ను ప్రతిధ్వనిస్తుంది.
    reason: cross_reference
  - marker: d
    text: కొందరు దీన్ని యేసు విజయప్రవేశాన్ని సూచించేదిగా భావిస్తారు; మరికొందరు భవిష్యత్తులో ఆయనను అంగీకరించడాన్ని సూచించేదిగా భావిస్తారు. గ్రీకు పాఠ్యం ఒక్క నిర్దిష్ట సమయాన్ని తప్పనిసరి చేయదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: గంభీరమైన ప్రకటనవైపు శ్రద్ధను మళ్లించే మూలపద బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἀφίεται
  choice: విడిచిపెట్టబడుతోంది
  rationale: వర్తమానకాల కర్మణి రూపాన్ని నిలుపుతూ, ‘వదిలివేయడం’ లేదా ‘పాడుచేయడం’ అనే భావాల్లో ఒక్కదానిని అతిగా నిర్ణయించదు.
- source_word: ὁ οἶκος ὑμῶν
  choice: మీ ఇల్లు
  rationale: గ్రీకు వాక్యంలోని విస్తృతమైన పదప్రయోగాన్ని యథాతథంగా ఉంచుతుంది; ప్రధాన పాఠ్యంలోనే ‘దేవాలయం’ లేదా ‘యెరూషలేము’ అని వ్యాఖ్యానించదు.
- source_word: λέγω δὲ ὑμῖν
  choice: నేను మీతో చెప్తున్నాను
  rationale: δέ ఇక్కడ సూచించే కొనసాగింపు/మార్పును తెలుగులో అనవసరమైన బలమైన వైరుధ్యం లేకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: οὐ μὴ ἴδητέ με
  choice: మీరు నన్ను ఇక ఎంతమాత్రమూ చూడరు
  rationale: οὐ μή అనే బలమైన భవిష్యత్ నిరాకరణను సహజమైన తెలుగు నుడికారంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἕως ἥξει ὅτε εἴπητε
  choice: మీరు చెప్పే సమయం వచ్చేవరకు
  rationale: మూలంలోని కాలసంబంధ నిర్మాణాన్ని తెలుగులో సులభంగా అర్థమయ్యే విధంగా వ్యక్తపరుస్తుంది.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: వచ్చేవాడు ధన్యుడు
  rationale: కీర్తన 118:26 ప్రతిధ్వనిని నిలుపుతూ, substantival participleను సహజమైన తెలుగు రూపంలో అందిస్తుంది.
- source_word: ἐν ὀνόματι κυρίου
  choice: ప్రభువు పేరట
  rationale: అధికారంతో/ప్రతినిధిగా రావడం అనే బైబిలు నుడికారాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా తెలుపుతుంది.
theological_decisions:
- issue: ‘మీ ఇల్లు’ అనే మాట దేనిని సూచిస్తుంది
  choice: ప్రధాన పాఠ్యంలో ‘మీ ఇల్లు’ అని విస్తృతంగానే ఉంచడం
  alternative: యెరూషలేము, దేవాలయం, లేదా ఇశ్రాయేలు గృహం అని నిర్దిష్టీకరించడం
  rationale: సందర్భం యెరూషలేమును, ముఖ్యంగా దేవాలయాన్ని సూచించే అవకాశం ఉన్నా, గ్రీకు పాఠ్యం కేవలం ‘మీ ఇల్లు’ అంటుంది. అందువల్ల వ్యాఖ్యానాన్ని పాఠ్యంలోకి చేర్చకుండా పాదసూచికలో తెలియజేయబడింది.
- issue: చివరి ఉల్లేఖనం నెరవేరే సమయం
  choice: భవిష్యత్ అంగీకారంగా అనువదించి, నిర్దిష్ట సందర్భాన్ని నిర్ణయించకపోవడం
  alternative: విజయప్రవేశం, యెరూషలేము/ఇశ్రాయేలు భవిష్యత్ పశ్చాత్తాపం, లేదా యేసు తిరిగి రాకడలో అంగీకారం
  rationale: గ్రీకు మాటలు ఒక్క నిర్దిష్ట కాలనిర్ణయాన్ని తప్పనిసరి చేయవు; అందువల్ల మూలంలోని వ్యాఖ్యాన విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సామాన్య పాఠకులకు స్పష్టంగా ఉండే వాక్యనిర్మాణం. ‘ఇదిగో’, ‘ధన్యుడు’, ‘ప్రభువు పేరట’ వంటి బైబిలు ప్రతిధ్వని గల పదాలు అర్థస్పష్టతను కోల్పోకుండా ఉంచబడ్డాయి.
