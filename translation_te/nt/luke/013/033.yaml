source:
  edition: SBLGNT
  text: πλὴν δεῖ με σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ πορεύεσθαι, ὅτι οὐκ ἐνδέχεται προφήτην ἀπολέσθαι ἔξω Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/033.yaml
  text: Nevertheless[a], I must go on my way today and tomorrow and the next day[b], because it is not possible for a prophet to perish outside Jerusalem.
translation:
  language: te
  text: అయినా, నేను ఈ రోజు, రేపు, ఎల్లుండి[a] ప్రయాణం కొనసాగించాలి; ఎందుకంటే యెరూషలేము వెలుపల ఒక ప్రవక్త నశించడం సాధ్యం కాదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఈ రోజు, రేపు, ఎల్లుండి” అనే మాట అక్షరార్థంగా మూడు దినాలను సూచించవచ్చు; లేదా స్వల్పమైన, నిర్ణీత కార్యపథాన్ని సూచించే జాతీయ ప్రయోగం కావచ్చు.
    reason: cultural_note
  - marker: b
    text: లేదా, “జరగడం అసాధ్యం,” “ఊహించలేం.” సందర్భంలో ఈ మాట అసాధ్యతతో పాటు వ్యంగ్యభరితమైన అసంగతతను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: అయినా
  rationale: ముందటి మాటకు బలమైన వ్యతిరేకతను లేదా పరిమితిని సూచిస్తూ, ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: δεῖ με
  choice: నేను … కొనసాగించాలి
  rationale: δεῖ తెలిపే బలమైన అవసరాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది; ఆ అవసరం దైవ నిర్ణయమా లేక పరిస్థితుల బలవంతమా అన్నది అదనంగా నిర్ధారించదు.
- source_word: σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ
  choice: ఈ రోజు, రేపు, ఆ మరుసటి రోజు
  rationale: మూలంలోని మూడు దశల కాలక్రమాన్ని స్పష్టంగా నిలుపుతుంది; అది అక్షరార్థంగా మూడు రోజులా లేక స్వల్పమైన నిర్ణీత కాలానికి జాతీయమా అన్న సందిగ్ధతను పాదసూచిక వివరిస్తుంది.
- source_word: πορεύεσθαι
  choice: నా ప్రయాణాన్ని కొనసాగించాలి
  rationale: సాధారణంగా వెళ్లడం మాత్రమే కాక, ఇప్పటికే సాగుతున్న ప్రయాణంలో ముందుకు కొనసాగడాన్ని సందర్భానుకూలంగా వ్యక్తం చేస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందు చెప్పిన అవసరానికి కారణాన్ని పరిచయం చేసే మూలపద సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: οὐκ ἐνδέχεται
  choice: జరగదు
  rationale: అసాధ్యత లేదా ఊహించలేని అసంగతత అనే పరిధిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; దానిని కఠినమైన తాత్త్విక అసాధ్యతగా మాత్రమే నిర్బంధించదు.
- source_word: προφήτην
  choice: ఒక ప్రవక్త
  rationale: ఆర్టికల్ లేని ఏకవచనాన్ని సామాన్య నియమంలా వినిపించే విధంగా అనువదిస్తుంది.
- source_word: ἀπολέσθαι
  choice: నశించడం
  rationale: చనిపోవడం, సంహరింపబడడం అనే భావపరిధిని కలిగిన గంభీర పదాన్ని నిలుపుతూ, హత్య అనే అర్థాన్ని ప్రధాన పాఠంలో బలవంతంగా చేర్చదు.
- source_word: ἔξω Ἰερουσαλήμ
  choice: యెరూషలేము వెలుపల
  rationale: మూలంలోని ప్రాదేశిక భావాన్ని నేరుగా, స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: ప్రవక్త యెరూషలేము వెలుపల నశించడం ‘జరగదు’ అనే వాక్య బలం
  choice: అసాధ్యత లేదా సంప్రదాయపరంగా ఊహించలేని అసంగతతను సూచించే మాటగా అనువదించడం
  alternative: ‘ఒక ప్రవక్త యెరూషలేము వెలుపల చనిపోవడం అసంభవం’ అని మరింత కఠినంగా, లేదా ‘ఊహించలేం’ అని వ్యంగ్యాన్ని మరింత స్పష్టంగా అనువదించడం
  rationale: οὐκ ἐνδέχεται అక్షర అసాధ్యతతో పాటు సందర్భానుసారమైన అసంగతత లేదా ఊహించలేని విషయాన్ని కూడా సూచించగలదు. ‘జరగదు’ ఈ ఉద్రిక్తతను నిలుపుతూ, యేసు మాటలోని సాధ్యమైన ప్రవక్తీయ వ్యంగ్యాన్ని పాఠకుడు గ్రహించేందుకు వీలు ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘యెరూషలేము’ అనే సుపరిచిత బైబిలు స్థలనామ రూపాన్ని ఉపయోగించాం. మూలంలోని కాలక్రమం, అవసరం, మరియు చివరి వాక్యంలోని ఉద్దేశపూర్వక theological tension నిలుపబడ్డాయి.
