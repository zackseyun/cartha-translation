id: LUK.13.24
reference: Luke 13:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀγωνίζεσθε εἰσελθεῖν διὰ τῆς στενῆς ⸀θύρας, ὅτι πολλοί, λέγω ὑμῖν, ζητήσουσιν εἰσελθεῖν καὶ οὐκ ἰσχύσουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/024.yaml
  text: Strive to enter through the narrow door[a], because many, I tell you, will seek to enter and will not be able.
translation:
  language: te
  text: “ఇరుకైన తలుపు గుండా ప్రవేశించడానికి తీవ్రంగా ప్రయత్నించండి[a]. ఎందుకంటే చాలామంది—నేను మీకు చెబుతున్నాను—ప్రవేశించాలని వెదకుతారు, మరియు వారికి ప్రవేశించడం సాధ్యం కాదు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇరుకైన గుమ్మం గుండా.’ ఇక్కడ లూకా ఉపయోగించిన గ్రీకు పదం θύρα సాధారణంగా ‘తలుపు’ అని అర్థం; మత్తయిలోని సమాంతర వాక్యంలో మాత్రం ‘గుమ్మం’ అనే పదం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγωνίζεσθε
  choice: తీవ్రంగా ప్రయత్నించండి
  rationale: వర్తమాన ఆజ్ఞార్థక రూపం నిరంతరమైన, గంభీరమైన కృషి లేదా పోరాట భావాన్ని తెలియజేస్తుంది. ‘తీవ్రంగా ప్రయత్నించండి’ అనేది సాధారణ ఆధునిక తెలుగులో ఆ బలాన్ని నిలుపుతుంది; కేవలం ‘ప్రయత్నించండి’ అంటే తీవ్రత తగ్గుతుంది.
- source_word: εἰσελθεῖν
  choice: ప్రవేశించడానికి / ప్రవేశించాలని
  rationale: εἰσέρχομαι యొక్క భావాన్ని రెండు చోట్లా సహజమైన తెలుగులో ‘ప్రవేశించు’తో ఏకరీతిగా అందిస్తుంది.
- source_word: διὰ τῆς στενῆς θύρας
  choice: ఇరుకైన తలుపు గుండా
  rationale: θύρα సాధారణంగా ‘తలుపు’ అని అర్థం; ‘ద్వారం’ లేదా మత్తయిలోని సమాంతర వాక్యాన్ని అనుసరించి ‘గుమ్మం’ అని మార్చకుండా లూకా వాడిన పదాన్ని ప్రతిబింబిస్తుంది. στενῆς‌కు స్థలసంబంధమైన ‘ఇరుకైన’ సహజంగా సరిపోతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఆజ్ఞకు కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: πολλοί
  choice: చాలామంది
  rationale: నామవాచకంగా పనిచేస్తున్న విశేషణానికి సరళమైన, సహజమైన తెలుగు రూపం.
- source_word: λέγω ὑμῖν
  choice: మీతో చెబుతున్నాను
  rationale: తెలుగులో సహజమైన సంభాషణ సూత్రంగా ఉండి, యేసు మాటలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ζητήσουσιν
  choice: వెదకుతారు
  rationale: ζητέω యొక్క ప్రాథమిక ‘వెదకు/కోరు’ భావాన్ని నిలిపి, ముందున్న Ἀγωνίζεσθεతో గల పదార్థ భేదాన్ని కాపాడుతుంది. ‘ప్రయత్నిస్తారు’ అని అనువదిస్తే ఆ భేదం చెరిగిపోతుంది.
- source_word: οὐκ ἰσχύσουσιν
  choice: వారికి సాధ్యం కాదు
  rationale: కార్యాన్ని చేయగల శక్తి లేదా సామర్థ్యం ఉండదనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘విజయం సాధించరు’ అనేది ఫలితాన్ని ఎక్కువగా వ్యాఖ్యానిస్తుంది.
theological_decisions:
- issue: మానవ కృషి మరియు రక్షణ భాష
  choice: ‘తీవ్రంగా ప్రయత్నించండి’ అనే బలమైన ఆజ్ఞను యథాతథంగా ఉంచి, పుణ్యం, క్రియలు లేదా రక్షణ విధానంపై అదనపు సిద్ధాంత వివరణను చేర్చలేదు.
  alternative: ‘ప్రవేశించడానికి అన్ని విధాలా కృషి చేయండి’ లేదా ‘ప్రవేశించడానికి ప్రయత్నించండి.’
  rationale: వాక్యం గంభీరమైన కృషిని ఆజ్ఞాపిస్తూ, ప్రవేశించాలని వెదికినా సాధ్యం కానివారి గురించి హెచ్చరిస్తుంది. దేవుని సార్వభౌమత్వం, మానవ బాధ్యత లేదా పుణ్యక్రియలపై విస్తృతమైన సిద్ధాంత చర్చను అనువాదం స్వయంగా పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా గంభీరమైన ఆజ్ఞా ధోరణితో రూపొందించబడింది. ‘వెదకుతారు’ కొద్దిగా అసాధారణంగా వినిపించినా, గ్రీకులోని ζητέωను ముందున్న ‘తీవ్రంగా ప్రయత్నించండి’ నుండి ఉద్దేశపూర్వకంగా వేరుగా ఉంచుతుంది.
