id: LUK.13.19
reference: Luke 13:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔβαλεν εἰς κῆπον ἑαυτοῦ, καὶ ηὔξησεν καὶ ἐγένετο εἰς ⸀δένδρον, καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατεσκήνωσεν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/019.yaml
  text: It is like a mustard seed[a], which a man took and threw into his garden, and it grew and became a tree[b], and the birds of the sky nested in its branches.
translation:
  language: te
  text: అది ఒక ఆవగింజ వంటిది. ఒక మనిషి దాన్ని తీసుకొని తన తోటలో వేశాడు. అది పెరిగి చెట్టుగా అయింది[a]. ఆకాశంలోని పక్షులు దాని కొమ్మల్లో గూళ్లు కట్టుకున్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు మూలపాఠం నేరుగా “చెట్టుగా అయింది” అని చెబుతూ, ఉపమానంలోని విస్తారమైన వృద్ధి చిత్రాన్ని నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία ἐστὶν
  choice: వంటిది
  rationale: ఉపమానాన్ని తెలిపే గ్రీకు ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: κόκκῳ σινάπεως
  choice: ఒక ఆవగింజ
  rationale: κόκκος ఇక్కడ చిన్న విత్తనాన్ని సూచిస్తుంది; ఆవగింజ అనేది తెలుగులో సహజంగా అర్థమయ్యే సమానార్థక పదం.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: ఒక మనిషి దాన్ని తీసుకొని
  rationale: ఉపమానంలోని ఏకవచన పురుష పాత్రను మార్చకుండా, తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా అందిస్తుంది.
- source_word: ἔβαλεν εἰς κῆπον ἑαυτοῦ
  choice: తన తోటలో వేశాడు
  rationale: βάλλω యొక్క ‘వేయడం/పెట్టడం’ భావాన్ని సహజంగా నిలుపుతుంది; మూలంలో లేని ‘విత్తాడు’ అనే ప్రత్యేక వ్యవసాయ క్రియను చేర్చదు. κῆποςను ‘తోట’గా అనువదిస్తుంది.
- source_word: ηὔξησεν
  choice: అది పెరిగి
  rationale: సందర్భంలోని అకర్మక వృద్ధి భావాన్ని సరళంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐγένετο εἰς δένδρον
  choice: చెట్టయింది
  rationale: గ్రీకు వాక్యంలోని ‘చెట్టుగా అయింది’ అనే ఆశ్చర్యకరమైన విస్తరణ చిత్రాన్ని సంక్షిప్తమైన సహజ తెలుగులో యథాతథంగా ఉంచుతుంది.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: ఆకాశ పక్షులు
  rationale: οὐρανός ఇక్కడ పై ఆకాశాన్ని సూచిస్తుంది; ‘ఆకాశ పక్షులు’ మూలానికి దగ్గరగా ఉండటంతో పాటు తెలుగులో గౌరవప్రదంగా, సహజంగా ఉంది.
- source_word: κατεσκήνωσεν ἐν τοῖς κλάδοις αὐτοῦ
  choice: దాని కొమ్మల్లో గూళ్లు కట్టుకున్నాయి
  rationale: పక్షులు కొమ్మల్లో స్థిరపడి నివసించే సందర్భంలో κατεσκήνωσεν భావాన్ని స్పష్టమైన తెలుగు దృశ్యంతో అందిస్తుంది; దాని అనే పదం చెట్టును సూచిస్తుంది.
theological_decisions:
- issue: ἄνθρωποςలోని లింగ సూచన
  choice: ఒక మనిషి
  alternative: ఒకరు
  rationale: ఇది మానవాళిని సాధారణంగా సూచించడం కాక, ఉపమానంలోని ఏకవచన పురుష పాత్రను సూచిస్తుంది; అందువల్ల మూలంలోని నిర్దిష్ట చిత్రాన్ని నిలుపుతుంది.
- issue: ఆవ మొక్కను δένδρονగా వర్ణించడం
  choice: చెట్టు
  alternative: పెద్ద మొక్క / పొద
  rationale: మొక్కల శాస్త్రపరమైన సాధారణీకరణ కోసం ఉపమాన చిత్రాన్ని తగ్గించకుండా, మూలపాఠంలోని δένδρονను నేరుగా అనువదించి అసాధారణ వృద్ధి భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా చిన్న వాక్యాలతో రూపొందించబడింది. ‘విత్తాడు’ అనే వ్యాఖ్యానాత్మక పదానికి బదులుగా ‘వేశాడు’ వాడబడింది; ‘పొద’గా సవరించకుండా మూలంలోని ‘చెట్టు’ చిత్రం కాపాడబడింది.
