source:
  edition: SBLGNT
  text: οὐχί, λέγω ὑμῖν, ἀλλ’ ἐὰν μὴ μετανοῆτε πάντες ⸀ὁμοίως ἀπολεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/003.yaml
  text: No, I tell you; but unless you change your thinking, you will all likewise perish.
translation:
  language: te
  text: “కాదు, నేను మీతో చెబుతున్నాను; కానీ మీరు పశ్చాత్తాపపడకపోతే, మీరందరూ అలాగే[a] నశిస్తారు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అదే విధంగా.” ఇక్కడ “అలాగే” అనేది తప్పనిసరిగా అచ్చంగా అదే మరణరీతిని కాక, అకస్మాత్తుగా వచ్చే అలాంటి తీర్పును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: కాదు
  rationale: ముందటి సందర్భంలో సూచింపబడిన ఊహను బలంగా తిరస్కరిస్తుంది; ఆధునిక తెలుగులో సహజమైన ప్రత్యక్ష నిరాకరణ.
- source_word: λέγω ὑμῖν
  choice: మీతో చెబుతున్నాను
  rationale: లూకాలోని ప్రత్యక్ష, ఉద్ఘాటనాత్మక సంభాషణ సూత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀλλ’
  choice: కానీ
  rationale: తిరస్కరించిన ఊహకు తరువాత వచ్చే హెచ్చరికను వ్యత్యాసంగా కలుపుతుంది.
- source_word: ἐὰν μὴ
  choice: పడకపోతే
  rationale: తెలుగులో ప్రతికూల షరతును సహజంగా వ్యక్తపరుస్తుంది; ఇది μετανοῆτεతో కలిసి ‘పశ్చాత్తాపపడకపోతే’ అవుతుంది.
- source_word: μετανοῆτε
  choice: పశ్చాత్తాపపడకపోతే
  rationale: కేవలం అభిప్రాయం మార్చుకోవడం కాకుండా దేవుని ఎదుట మనస్సు, దిశ మారడాన్ని సూచించే నైతిక-ఆధ్యాత్మిక భావాన్ని సాధారణ తెలుగు బైబిల్ పదప్రయోగంలో కాపాడుతుంది.
- source_word: πάντες
  choice: మీరందరూ
  rationale: హెచ్చరిక యేసు శ్రోతలందరికీ వర్తిస్తుందనే సమగ్రతను స్పష్టంగా ఉద్ఘాటిస్తుంది.
- source_word: ὁμοίως
  choice: అలాగే
  rationale: ముందు ప్రస్తావించిన వారి గతి మరియు శ్రోతలకు ఇచ్చిన హెచ్చరిక మధ్య పోలికను నిలుపుతుంది; పోలిక యొక్క ఖచ్చిత స్వభావాన్ని నిర్ణయించదు.
- source_word: ἀπολεῖσθε
  choice: నశిస్తారు
  rationale: కేవలం శారీరక మరణానికి లేదా స్పష్టంగా నిత్యశిక్షకు పరిమితం చేయకుండా, రాబోయే నాశనం/తీర్పు యొక్క గంభీరతను నిలుపుతుంది.
theological_decisions:
- issue: μετανοέω యొక్క నైతిక-ఆధ్యాత్మిక పరిధి
  choice: పశ్చాత్తాపపడకపోతే
  alternative: మీ ఆలోచన మార్చుకోకపోతే / తిరిగి రాకపోతే
  rationale: ఇక్కడ పదం కేవలం మేధోపరమైన అభిప్రాయ మార్పును కాక దేవుని ఎదుట అంతరంగం మరియు జీవనదిశ మార్పును సూచిస్తుంది. ‘పశ్చాత్తాపపడడం’ ఆ భావాన్ని సంక్షిప్తంగా, పరిచితంగా అందిస్తుంది.
- issue: ἀπολεῖσθε సూచించే నాశనపు పరిధి
  choice: నశిస్తారు
  alternative: చనిపోతారు / నాశనం చేయబడతారు / నిత్యశిక్ష పొందుతారు
  rationale: గ్రీకు పదం తీర్పు మరియు వినాశనాన్ని గంభీరంగా హెచ్చరిస్తుంది; అయితే ఈ వాక్యంలోనే దానిని కేవలం శారీరక మరణంగా గానీ, స్పష్టంగా నిత్యదండనగా గానీ పరిమితం చేయదు.
- issue: ὁμοίωςలోని పోలిక స్వభావం
  choice: అలాగే[a]
  alternative: అదే విధంగా
  rationale: శ్రోతల నాశనం ముందటి ఘటనలోని మరణరీతికి పూర్తిగా సమానమని నిర్బంధించకుండా, పోలికలోని నిజమైన అస్పష్టతను పాదసూచికతో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రత్యక్ష హెచ్చరికగా రూపొందించబడింది. ‘పశ్చాత్తాపపడడం’ సాధారణ పాఠకులకు పరిచితమైన ఆధ్యాత్మిక పదం; ‘నశిస్తారు’ మూలంలోని తీర్పు-సంబంధిత విస్తృతిని కాపాడుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
