  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἢ ἐκεῖνοι οἱ ⸀δεκαοκτὼ ἐφ’ οὓς ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ καὶ ἀπέκτεινεν αὐτούς, δοκεῖτε ὅτι ⸀αὐτοὶ ὀφειλέται ἐγένοντο παρὰ πάντας ⸀τοὺς ἀνθρώπους τοὺς ⸀κατοικοῦντας Ἰερουσαλήμ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/004.yaml
  text: Or those eighteen on whom the tower in Siloam fell and killed them—do you think that they became debtors beyond all the men living in Jerusalem?[a][b]
translation:
  language: te
  text: లేదా, షిలోహములో గోపురం కూలి వారిమీద పడి వారిని చంపిన ఆ పద్దెనిమిది మంది—యెరూషలేములో నివసించే వారందరికంటే వారే ఎక్కువగా ఋణస్థులయ్యారని మీరు అనుకుంటున్నారా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఋణస్థులు” అనే మాటను “పాపులు” లేదా “ఎక్కువ అపరాధులు” అని కూడా అనువదించవచ్చు. గ్రీకులోని ὀφειλέται అనే పదానికి అక్షరార్థం “ఋణస్థులు”; ఇక్కడ అది నైతిక అపరాధబాధ్యతను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: లేదా
  rationale: ముందటి ఉదాహరణకు ప్రత్యామ్నాయంగా మరో ఉదాహరణను ప్రవేశపెట్టే సరళమైన అనుసంధానాన్ని నిలుపుతుంది.
- source_word: ἐκεῖνοι οἱ δεκαοκτώ
  choice: ఆ పద్దెనిమిది మంది
  rationale: సూచక సర్వనామం, సంఖ్య రెండింటినీ సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; ‘మంది’ మానవులను సూచించే తెలుగు సంఖ్యావాచక సహాయక పదం మాత్రమే, పురుషులను మాత్రమే సూచించదు.
- source_word: ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ
  choice: షిలోహములోని గోపురం మీద పడి
  rationale: గోపురం పడిందనే మూల చిత్రాన్ని కాపాడుతూ, స్థలసంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἀπέκτεινεν αὐτούς
  choice: చనిపోయిన
  rationale: తెలుగులో ‘గోపురం వారిని చంపింది’ కంటే ప్రమాద ఫలితాన్ని తెలిపే ఈ సంబంధవాచక నిర్మాణం సహజంగా ఉంటుంది; మరణకారణం మాత్రం స్పష్టంగానే నిలుస్తుంది.
- source_word: δοκεῖτε ὅτι
  choice: అని మీరు అనుకుంటున్నారా?
  rationale: యేసు నేరుగా ప్రశ్నిస్తున్న సవాలు చేసే స్వరాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: αὐτοὶ
  choice: వారే
  rationale: గ్రీకు సర్వనామంలోని ఉద్ఘాటనను ‘ఏ’ ద్వారా వ్యక్తపరుస్తుంది.
- source_word: ὀφειλέται
  choice: అపరాధ ఋణస్థులు
  rationale: పదంలోని ‘ఋణస్థులు’ అనే రూపకాన్ని నిలుపుతూ, సందర్భంలో ఇది ఆర్థిక ఋణం కాక నైతిక అపరాధ బాధ్యత అని ప్రధాన పాఠ్యంలోనే సూచిస్తుంది.
- source_word: ἐγένοντο
  choice: అయ్యారని
  rationale: γίνομαι లోని ‘అవడం/కావడం’ అనే క్రియాభావాన్ని సమతుల్యంగా నిలుపుతుంది.
- source_word: παρὰ πάντας τοὺς ἀνθρώπους
  choice: వారందరికంటే ఎక్కువ
  rationale: παρά తెలిపే పోలికను తెలుగులో సహజమైన ‘కంటే ఎక్కువ’ నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: τοὺς κατοικοῦντας Ἰερουσαλήμ
  choice: యెరూషలేములో నివసించే వారు
  rationale: నగర నివాసులందరినీ సూచించే వర్తమాన కృదంత భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ఈ సందర్భంలో ὀφειλέται అర్థం
  choice: అపరాధ ఋణస్థులు
  alternative: పాపులు; ఎక్కువ అపరాధులు
  rationale: లూకా 13:2లోని ‘పాపులు’ అనే పదానికి భిన్నంగా ఇక్కడ వాడిన ఋణ రూపకాన్ని పూర్తిగా చెరపకుండా, అది నైతిక బాధ్యతను సూచిస్తుందని స్పష్టం చేస్తుంది. ‘ఋణస్థులు’ మాత్రమే అంటే ఆర్థిక అర్థం కలిగే ప్రమాదం ఉండగా, ‘ఎక్కువ అపరాధులు’ మాత్రమే అంటే మూల రూపకం పోతుంది.
- issue: ἀνθρώπους యొక్క పరిధి
  choice: వారు / మంది
  alternative: పురుషులు
  rationale: ఇక్కడ యెరూషలేము నివాసులు సాధారణంగా ఉద్దేశించబడ్డారు; గ్రీకు పదం మానవులందరినీ సూచించగలదు. తెలుగు ‘మంది/వారు’ లింగాన్ని అనవసరంగా పరిమితం చేయకుండా మూల పరిధిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే ప్రశ్నారూపం. ‘షిలోహము’, ‘యెరూషలేము’ అనే స్థలనామాలకు తెలుగు బైబిలు సంప్రదాయంలో పరిచితమైన రూపాలు వాడబడ్డాయి. ‘అపరాధ ఋణస్థులు’ కొద్దిగా అసాధారణమైనా, మూలంలోని నైతిక ఋణ రూపకాన్ని మరియు సందర్భార్థాన్ని రెండింటినీ నిలుపుతుంది.
