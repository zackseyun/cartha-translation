id: LUK.13.23
reference: Luke 13:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δέ τις αὐτῷ· Κύριε, εἰ ὀλίγοι οἱ σῳζόμενοι; ὁ δὲ εἶπεν πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/023.yaml
  text: And someone said to him[a], “Lord, are only a few being saved?” And he said to them[b],
translation:
  language: te
  text: 'అప్పుడు ఒక వ్యక్తి ఆయనతో, “ప్రభువా,[a] రక్షించబడుతున్నవారు కొద్దిమందేనా?” అన్నాడు. ఆయన వారితో ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ప్రభువా” అనే మాటను ఇక్కడ గౌరవపూర్వక సంబోధనగా “అయ్యా” అని కూడా అర్థం చేసుకోవచ్చు; గ్రీకు పదం ఈ సందర్భంలో బిరుదు యొక్క పూర్తి బలాన్ని నిర్ణయించదు.
    reason: alternative_reading
lexical_decisions:
- source_word: δέ
  choice: అప్పుడు
  rationale: కథనాన్ని ముందుకు నడిపించే స్వల్ప అనుసంధానంగా ఉంది; స్పష్టమైన వ్యతిరేకతను సూచించకుండా సహజమైన తెలుగు ప్రవాహాన్ని ఇస్తుంది.
- source_word: τις
  choice: ఒక వ్యక్తి
  rationale: ఎవరనేది తెలియజేయని అనిర్దిష్ట వ్యక్తిని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: αὐτῷ
  choice: ఆయనతో
  rationale: గ్రీకులో ఉన్న సర్వనామాన్ని నిలుపుతూ, ఈ వచనంలో ‘యేసు’ అనే పేరును అదనంగా చేర్చదు.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: గౌరవపూర్వక సంబోధనగానూ, మరింత గంభీరమైన క్రీస్తుసంబంధ భావంతోనూ అర్థమయ్యే అవకాశాన్ని నిలుపుతుంది.
- source_word: εἰ ὀλίγοι
  choice: కొద్దిమందేనా
  rationale: ప్రశ్నలోని కొద్ది సంఖ్యపై దృష్టిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘ఏ’ ద్వారా ‘కొద్దిమందేనా?’ అనే నిర్బంధ భావం వస్తుంది.
- source_word: οἱ σῳζόμενοι
  choice: రక్షించబడుతున్నవారు
  rationale: వర్తమానకాల కర్మణి కృదంతంలోని కొనసాగుతున్న స్థితి లేదా ప్రక్రియను, అలాగే కర్మణి భావాన్ని నిలుపుతుంది.
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: ఆయన వారితో ఇలా అన్నాడు
  rationale: ఏకవచనంగా ప్రశ్నించిన వ్యక్తి నుండి బహువచన శ్రోతల వైపు గ్రీకు వాక్యంలో ఉన్న మార్పును స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: యేసును ఉద్దేశించిన Κύριε సంబోధన బలం
  choice: ప్రభువా
  alternative: అయ్యా
  rationale: ఇది కేవలం మర్యాదపూర్వక సంబోధనా, లేక మరింత ఉన్నతమైన క్రీస్తుసంబంధ బిరుదా అన్న విషయాన్ని గ్రీకు పూర్తిగా నిర్ణయించదు. ‘ప్రభువా’ ఆ భావ విస్తృతిని నిలుపుతుంది; పాదసూచిక ప్రత్యామ్నాయాన్ని తెలియజేస్తుంది.
- issue: σῳζόμενοι యొక్క కాలాంశం
  choice: రక్షించబడుతున్నవారు
  alternative: రక్షణ పొందేవారు
  rationale: వర్తమాన కర్మణి కృదంతం సూచించే కొనసాగుతున్న స్థితి లేదా ప్రక్రియను కాపాడుతూ, నిర్దిష్ట రక్షణశాస్త్ర వ్యవస్థను వాక్యంలోకి తీసుకురాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ప్రశ్నలోని కర్మణి మరియు కొనసాగుతున్న భావం నిలుపబడింది; చివరి బహువచన సర్వనామం ‘వారితో’ యథాతథంగా ఉంచబడింది.
