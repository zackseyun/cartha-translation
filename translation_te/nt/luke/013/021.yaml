id: LUK.13.21
reference: Luke 13:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἔκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/021.yaml
  text: It is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.
translation:
  language: te
  text: అది పులిసిన పిండిలా[a] ఉంది. ఒక స్త్రీ దాన్ని తీసుకొని మూడు సాతాల[b] పిండిలో దాచిపెట్టింది[c]; చివరికి పిండి అంతా పులిసిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పులియబెట్టే ముద్దలా.” ఇక్కడి గ్రీకు పదం పిండిని పులియబెట్టడానికి ఉపయోగించే పులిసిన ముద్దను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'గ్రీకు: “మూడు సాతాలు.” ‘సాతం’ ఒక ప్రాచీన పొడి కొలత; మూడు సాతాలు చాలా పెద్ద పరిమాణం.'
    reason: cultural_note
  - marker: c
    text: లేదా, “కలిపింది.” గ్రీకు క్రియకు అక్షరార్థంగా “దాచిపెట్టింది” అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία
  choice: లా ఉంది
  rationale: ఉపమానాన్ని పరిచయం చేసే విశేషణం; ఆధునిక తెలుగులో ‘లా ఉంది’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ζύμῃ
  choice: పులిసిన పిండి
  rationale: ప్రాచీన కాలంలో కొత్త పిండిని పులియబెట్టడానికి ఉంచిన పులిసిన పిండి ముద్దను సూచిస్తుంది; ఆధునిక వాణిజ్య ‘ఈస్ట్’ అనే భావాన్ని అనవసరంగా రానివ్వదు.
- source_word: λαβοῦσα γυνὴ
  choice: ఒక స్త్రీ దాన్ని తీసుకొని
  rationale: అనిర్దిష్ట స్త్రీని సూచిస్తూ, ముందుగా జరిగిన participial చర్యను సహజ తెలుగు క్రమంలో అందిస్తుంది.
- source_word: ἔκρυψεν
  choice: దాచిపెట్టింది
  rationale: గ్రీకు క్రియలోని ‘దాచింది/కనబడకుండా చేసింది’ అనే ప్రత్యక్ష భావాన్ని నిలుపుతుంది; కలిపింది అనే వివరణాత్మక భావాన్ని ప్రధాన పాఠ్యంలో పెట్టదు.
- source_word: εἰς ἀλεύρου σάτα τρία
  choice: మూడు సాతాల పిండిలో
  rationale: σάτα అనే ప్రాచీన పరిమాణాన్ని లిప్యంతరీకరించి మూలంలోని సాంస్కృతిక నిర్దిష్టతను నిలుపుతుంది; వివరణను పాదసూచికలో ఇస్తుంది.
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: చివరికి పిండి అంతా పులిసిపోయింది
  rationale: ἕως οὗ తెలిపే తుదిస్థితిని సహజ తెలుగులో చూపుతూ, ὅλον లోని సంపూర్ణతను ‘అంతా’తో నిలుపుతుంది.
theological_decisions:
- issue: ఉపమానంలో పులిసిన పిండి సూచించే భావం
  choice: చిహ్నానికి సానుకూల లేదా ప్రతికూల వ్యాఖ్యానాన్ని జోడించకుండా తటస్థంగా అనువదించడం
  alternative: దేవుని రాజ్య విస్తరణకు సానుకూల చిహ్నంగా స్పష్టీకరించడం; లేదా ఇతర వాక్యాల ఆధారంగా ప్రతికూల చిహ్నంగా చూపడం
  rationale: ఈ వచనం ఉపమాన చిత్రాన్ని మాత్రమే ఇస్తుంది. దాని చిహ్నార్థంపై ఉన్న వ్యాఖ్యాన భేదాన్ని అనువాదం స్వయంగా పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ప్రాచీన కొలతను ప్రధాన పాఠ్యంలో నిలిపి పాదసూచికలో వివరించాం. ‘దాచిపెట్టింది’ ద్వారా మూలపాఠంలోని ఉద్దేశపూర్వకమైన, కొంత ఆశ్చర్యకరమైన పదచిత్రం కాపాడబడింది.
