source:
  edition: SBLGNT
  text: καὶ ἐρεῖ ⸀λέγων ὑμῖν· Οὐκ ⸀οἶδα πόθεν ἐστέ· ἀπόστητε ἀπ’ ἐμοῦ, πάντες ⸀ἐργάται ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/027.yaml
  text: And he will say to you[a], ‘I do not know where you are from. Depart from me[c][b], all you workers of unrighteousness.’
translation:
  language: te
  text: 'ఆయన మీతో ఇలా అంటాడు: “మీరు ఎక్కడివారో నాకు తెలియదు. అన్యాయం చేసేవారలారా, మీరందరూ నా నుండి వెళ్లిపోండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρεῖ λέγων ὑμῖν
  choice: ఆయన మీతో ఇలా అంటాడు
  rationale: ప్రధాన క్రియతో పాటు వచ్చిన λέγων గ్రీకులో వాక్యాన్ని పరిచయం చేసే పునరుక్త నిర్మాణం. తెలుగులో దాని కార్యాన్ని ‘ఇలా అంటాడు’లో సహజంగా కలిపి, ὑμῖνను ‘మీతో’గా స్పష్టంగా చూపించాం.
- source_word: οὐκ οἶδα
  choice: నాకు తెలియదు
  rationale: οἶδα యొక్క సాధారణ అర్థమైన ‘తెలుసు’ను నేరుగా నిలుపుతుంది; సందర్భంలో సంబంధాన్ని నిరాకరించే భావం ఉన్నప్పటికీ ‘గుర్తుపట్టను’ అని మరింత నిర్దిష్టం చేయలేదు.
- source_word: πόθεν ἐστέ
  choice: మీరు ఎక్కడివారో
  rationale: πόθεν సూచించే మూలం లేదా వచ్చిన స్థలాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀπόστητε ἀπ’ ἐμοῦ
  choice: నా దగ్గర నుండి వెళ్లిపోండి
  rationale: నిర్ణయాత్మకంగా దూరమవ్వాలనే ఆజ్ఞను సహజమైన, బలమైన ఆధునిక తెలుగు రూపంలో అందిస్తుంది.
- source_word: πάντες ἐργάται ἀδικίας
  choice: అన్యాయం చేసేవారలారా, మీరందరూ
  rationale: ἐργάταιను సందర్భానుసారంగా ‘చేసేవారు’గా, ἀδικίαను విస్తృత నైతిక భావమున్న ‘అన్యాయం’గా అందించి, πάντες యొక్క సమగ్రతను ‘మీరందరూ’తో స్పష్టం చేశాం.
theological_decisions:
- issue: తీర్పు వాక్యంలో ἀδικίας అనువాదం
  choice: అన్యాయం
  alternative: అధర్మం; దుష్కార్యం; అక్రమం
  rationale: ἀδικία అనేది అన్యాయం, నీతివిరుద్ధత, తప్పుచేయడం వంటి విస్తృత భావాన్ని కలిగి ఉంది. ‘అక్రమం’ అనడం νόμος సంబంధిత ‘ధర్మశాస్త్ర విరోధం’ అనే మరింత నిర్దిష్ట భావాన్ని దిగుమతి చేసే అవకాశం ఉంది; ‘అన్యాయం’ మూలంలోని విస్తృత నైతిక నిందను నిలుపుతుంది.
- issue: οὐκ οἶδα లో సంబంధ నిరాకరణ భావం
  choice: నాకు తెలియదు
  alternative: నేను మిమ్మల్ని గుర్తుపట్టను
  rationale: సందర్భం తిరస్కారాన్ని సూచించినా, మూలపాఠం ‘మిమ్మల్ని’ కాదు, ‘మీరు ఎక్కడివారో’ తెలియదని చెబుతుంది. అందువల్ల మూలంలోని ఉద్దేశపూర్వక వాక్యరూపం మరియు ఉద్వేగాన్ని మార్చకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే నేరుగా పలికే శైలి. గ్రీకు పునరుక్త వాక్యప్రారంభాన్ని తెలుగులో సహజంగా సమన్వయపరిచాం.
