id: LUK.13.16
reference: Luke 13:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ταύτην δὲ θυγατέρα Ἀβραὰμ οὖσαν, ἣν ἔδησεν ὁ Σατανᾶς ἰδοὺ δέκα καὶ ὀκτὼ ἔτη, οὐκ ἔδει λυθῆναι ἀπὸ τοῦ δεσμοῦ τούτου τῇ ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/016.yaml
  text: And ought not this woman, being a daughter of Abraham, whom Satan bound for eighteen years—look—be released from this bond on the Sabbath day?
translation:
  language: te
  text: అబ్రాహాము కుమార్తె అయిన ఈమెను—ఇదిగో, సాతాను పద్దెనిమిది సంవత్సరాలుగా బంధించిన ఈమెను—ఈ బంధం నుండి సబ్బాతు దినాన విడిపించడం తగదా?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυγατέρα Ἀβραὰμ
  choice: అబ్రాహాము కుమార్తె
  rationale: మూలంలోని బంధుత్వ రూపకాన్ని యథాతథంగా నిలుపుతూ, అబ్రాహాము వంశానికి చెందిన స్త్రీ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔδησεν / λυθῆναι / δεσμοῦ
  choice: బంధించిన / విడిపించడం / బంధం
  rationale: మూలంలోని కట్టడం–విప్పడం అనే పరస్పర సంబంధిత పదచిత్రాన్ని తెలుగులో ఒకే భావక్షేత్రంతో నిలుపుతుంది.
- source_word: ἰδού
  choice: ఇదిగో
  rationale: శ్రోతల దృష్టిని పద్దెనిమిది సంవత్సరాల దీర్ఘకాలంపై కేంద్రీకరించే మూలంలోని ఉద్ఘాటనను స్పష్టంగా ఉంచుతుంది.
- source_word: δέκα καὶ ὀκτὼ ἔτη
  choice: పద్దెనిమిది సంవత్సరాలుగా
  rationale: కాలవ్యవధిని ఆధునిక, సహజ తెలుగు వాక్యనిర్మాణంలో ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: ఈ విశ్రాంతి దినాన
  rationale: నిర్దిష్టంగా సందర్భంలోని ఆ సబ్బాతు దినాన్ని సూచించేలా demonstrative భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: స్త్రీ బాధకు సాతాను కారణమని వాక్యం చేసే నిర్దిష్ట ఆపాదన
  choice: సాతాను బంధించిన ఈమెను
  alternative: సాతాను బంధంలో ఉన్న ఈమెను
  rationale: ὁ Σατανᾶς అనే స్పష్టమైన కర్తను, ἔδησεν అనే క్రియను బలహీనపరచకుండా అనువదించింది; అయితే దీనిని ప్రతి వ్యాధికి వర్తించే సాధారణ సిద్ధాంతంగా విస్తరించలేదు.
- issue: οὐκ ἔδει లోని నైతిక అవసరం
  choice: విడిపించడం తగదా?
  alternative: విడిపించవలసిన అవసరం లేదా?
  rationale: ప్రతికూల అలంకారప్రశ్నలోని బలమైన సముచితత/అవసర భావాన్ని సహజ తెలుగులో నిలుపుతుంది; దైవిక అనివార్యతను అవసరానికి మించి వివరణాత్మకంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని అలంకారప్రశ్న, ‘ఇదిగో’ అనే ఉద్ఘాటన, బంధించడం–విడిపించడం పదచిత్రం నిలుపబడ్డాయి. పాదటిప్పణులు అవసరం లేదు.
