source:
  edition: SBLGNT
  text: τότε ἄρξεσθε λέγειν· Ἐφάγομεν ἐνώπιόν σου καὶ ἐπίομεν, καὶ ἐν ταῖς πλατείαις ἡμῶν ἐδίδαξας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/026.yaml
  text: Then you will begin to say[a], ‘We ate and drank in your presence, and you taught in our streets.’
translation:
  language: te
  text: 'అప్పుడు మీరు ఇలా చెప్పడం మొదలుపెడతారు: ‘మేము నీ సమక్షంలో తిన్నాము, తాగాము; నీవు మా వీధుల్లో[a] బోధించావు.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మా బహిరంగ కూడళ్లలో’; గ్రీకు పదం పట్టణంలోని విశాల వీధులను లేదా తెరచిన బహిరంగ ప్రదేశాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: సంభాషణలో తరువాత జరిగే చర్యను సూచించే సహజమైన, సంక్షిప్తమైన కాలవాచకం.
- source_word: ἄρξεσθε λέγειν
  choice: మీరు ఇలా చెప్పడం మొదలుపెడతారు
  rationale: ἄρχω యొక్క భవిష్యత్ రూపంతో కూడిన λέγειν సూచించే ఆరంభ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: Ἐφάγομεν ἐνώπιόν σου καὶ ἐπίομεν
  choice: మేము నీ సమక్షంలో తిన్నాము, తాగాము
  rationale: రెండు ఏఓరిస్ట్ క్రియలను సహజమైన భూతకాలంలో అందిస్తూ, ἐνώπιόν σουలోని సమీపం లేదా సాన్నిధ్య దావాను ‘నీ సమక్షంలో’ అని నిలుపుతుంది.
- source_word: ἐν ταῖς πλατείαις ἡμῶν
  choice: మా వీధుల్లో
  rationale: పట్టణంలోని విశాల వీధులు లేదా బహిరంగ ప్రదేశాలను సూచించగల పదానికి ‘వీధులు’ సహజమైన సాధారణ తెలుగు; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: ἐδίδαξας
  choice: బోధించావు
  rationale: ఏఓరిస్ట్ క్రియను సాధారణ భూతకాలంగా అనువదించి, గతంలో జరిగిన బహిరంగ బోధనను సూచిస్తుంది.
theological_decisions:
- issue: మాట్లాడేవారు యేసుతో తమ సంబంధం గురించి చేసే విన్నపం
  choice: ‘నీ సమక్షంలో’ మరియు ‘మా వీధుల్లో’ అనే మాటల ద్వారా బాహ్య సాన్నిధ్యం, పరిచయం గురించిన వారి దావాను మాత్రమే అనువాదం వ్యక్తం చేస్తుంది.
  alternative: దీనిని అంగీకరించబడిన సహవాసం లేదా రక్షణ సంబంధంగా సూచించేలా స్వేచ్ఛగా అనువదించడం.
  rationale: మూలవాక్యం వారి బాహ్య సమీపతను పేర్కొంటుంది గాని, ప్రభువు వారిని తనవారిగా అంగీకరించాడని చెప్పదు; అందువల్ల ఆ ధార్మిక ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవభరితమైన శైలి. ప్రత్యక్ష సంభాషణలో ఏకవచన ద్వితీయ పురుష రూపాలు మూలంలోని σου, ἐδίδαξαςలకు అనుగుణంగా ఉన్నాయి; కథనంలోని బహువచన ‘మీరు’ను కూడా స్పష్టంగా నిలిపింది.
