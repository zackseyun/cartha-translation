  to: 'ఆయన వారితో ఇలా అన్నాడు: “మీరు వెళ్లి ఆ నక్కకు ఇలా చెప్పండి: ‘ఇదిగో, ఈ రోజు, రేపు నేను దయ్యాలను వెళ్లగొడతాను, స్వస్థతలు కలిగిస్తాను; మూడవ రోజున నేను సంపూర్ణతకు చేర్చబడతాను.[a]’”'
  rationale: The revision restores the source’s coordination between casting out demons and accomplishing healings, improves the Telugu indirect-object construction, and smooths the passive expression for τελειοῦμαι without narrowing its semantic or theological scope.
