reference: Luke 13:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἴπατε τῇ ἀλώπεκι ταύτῃ· Ἰδοὺ ἐκβάλλω δαιμόνια καὶ ἰάσεις ⸀ἀποτελῶ σήμερον καὶ αὔριον, καὶ τῇ τρίτῃ τελειοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/032.yaml
  text: And he said to them[a], “Go and tell that fox, ‘Look, I cast out demons and accomplish healings today and tomorrow, and on the third day I am brought to completion.’”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “మీరు వెళ్లి ఆ నక్కకు ఇలా చెప్పండి: ‘ఇదిగో, ఈ రోజు, రేపు నేను దయ్యాలను వెళ్లగొడతాను, స్వస్థతలు కలిగిస్తాను; మూడవ రోజున నేను సంపూర్ణతకు చేర్చబడతాను.[a]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నేను నా లక్ష్యాన్ని చేరుకుంటాను,” “నేను పరిపూర్ణుడనవుతాను,” లేదా “నా కార్యాన్ని ముగిస్తాను.” గ్రీకు పదం పూర్తికి చేర్చబడటాన్ని సూచించగలదు; ఇక్కడ అది యేసుకు నియమించబడిన కార్యం పూర్తికావడాన్ని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλώπεκι
  choice: నక్కతో
  rationale: మూలంలోని జంతు రూపకాన్ని వివరణాత్మక విశేషణాలు చేర్చకుండా యథాతథంగా ఉంచుతుంది; ταύτῃ యొక్క సూచనాత్మక, తృణీకార స్వరం సందర్భం ద్వారా వ్యక్తమవుతుంది.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: తరువాతి మాటపై దృష్టి నిలిపే సహజమైన తెలుగు సూచక పదం.
- source_word: ἐκβάλλω δαιμόνια
  choice: దయ్యాలను వెళ్లగొడుతూ
  rationale: సువార్తల్లో భూతవిమోచన చర్యను తెలిపే బలమైన, సహజమైన తెలుగు ప్రయోగం; వర్తమాన క్రియ యొక్క కొనసాగుతున్న భావాన్ని కూడా మోయగలదు.
- source_word: ἰάσεις ἀποτελῶ
  choice: స్వస్థతలు కలిగిస్తాను
  rationale: ἰάσεις అనే నామవాచక భావాన్నీ, ἀποτελῶలోని ఫలితాన్ని సాధించడం లేదా కలిగించడం అనే భావాన్నీ సహజ తెలుగులో నిలుపుతుంది.
- source_word: σήμερον καὶ αὔριον
  choice: ఈ రోజు, రేపు
  rationale: మూలంలోని కాలజంటను సూటిగా ఉంచి, అది స్వల్పమైన నిర్ణీత కాలాన్ని సూచించే అవకాశం కూడా తెరిచి ఉంచుతుంది.
- source_word: τῇ τρίτῃ
  choice: మూడవ రోజున
  rationale: కాలసూచక దత్తివును స్పష్టమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τελειοῦμαι
  choice: నేను సంపూర్ణతకు తీసుకురాబడతాను
  rationale: వర్తమాన కర్మణి రూపాన్నీ, పూర్తికి లేదా లక్ష్యసిద్ధికి చేర్చబడటం అనే విస్తృత భావాన్నీ కాపాడుతుంది; నైతిక పరిపూర్ణతగా మాత్రమే అర్థాన్ని కుదించదు.
theological_decisions:
- issue: τελειοῦμαι యేసు నియమిత కార్యసంపూర్తిని సూచిస్తుందా, లేక మరణం/పునరుత్థానాన్ని ప్రత్యేకంగా సూచిస్తుందా
  choice: నేను సంపూర్ణతకు తీసుకురాబడతాను
  alternative: నేను నా లక్ష్యాన్ని చేరుకుంటాను; నేను పరిపూర్ణుడనవుతాను; నా కార్యాన్ని ముగిస్తాను
  rationale: గ్రీకు పదం పూర్తికి చేర్చబడటం, లక్ష్యసిద్ధి, లేదా కార్యసంపూర్తి వంటి భావాలను మోయగలదు. ప్రధాన పాఠంలో పునరుత్థానం, మహిమపరచడం లేదా మరణాన్ని స్పష్టంగా చేర్చకుండా ఆ దైవశాస్త్రీయ ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని నక్క రూపకం, కాలక్రమం, τελειοῦμαι యొక్క కర్మణి రూపం మరియు భావసందిగ్ధత సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
