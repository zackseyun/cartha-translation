  rationale: δέ కథన పురోగతితో కూడిన స్వల్ప మలుపును సూచిస్తుంది; ‘అయితే’ ఆ సంబంధాన్ని అతిగా బలపరచకుండా తెలుపుతుంది.
- source_word: προσεφώνησεν
  choice: ఆమెను దగ్గరకు పిలిచి
  rationale: προσφωνέω ఇక్కడ ఆమెను ఉద్దేశించి పిలవడం లేదా తన దగ్గరకు రమ్మని పిలవడం అనే భావాన్ని ఇస్తుంది; సందర్భంలో ‘దగ్గరకు పిలిచి’ సహజంగా ఉంది.
- source_word: Γύναι
  choice: అమ్మా
