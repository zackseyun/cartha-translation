  source_fidelity: ‘దగ్గరకు పిలిచి’ adds an explicit summons to approach that προσεφώνησεν itself does not require; the verb more directly means ‘addressed/called to.’ The perfect passive ἀπολέλυσαι is well conveyed by ‘విడుదల పొందావు,’ and ‘బలహీనత’ appropriately retains the breadth of ἀσθένεια.
  naturalness: The revised wording is natural modern standard Telugu and avoids the unnecessary repetition and slightly cumbersome ‘అని ఆమెతో చెప్పాడు.’ ‘అమ్మా’ is a respectful, idiomatic Telugu direct address here and does not impose a familial relationship.
  terminology: ‘విడుదల పొందావు’ preserves the completed, passive liberation, while ‘బలహీనత’ avoids imposing a specific diagnosis. A lexical-alternative footnote is anchored to the relevant Telugu expression rather than to an unrelated word.
  issues:
  - severity: medium
    issue: ‘ఆమెను దగ్గరకు పిలిచి’ over-specifies προσεφώνησεν.
    rationale: The Greek says that Jesus addressed or called to her; it does not explicitly state that he summoned her to come closer. Removing ‘దగ్గరకు’ preserves the source’s scope.
  - severity: low
    issue: The audit-trail lexical alternative has no Telugu footnote anchor.
    rationale: The alternative for ἀπολέλυσαι should be attached to its corresponding Telugu rendering, not omitted or associated with an unrelated element.
