  alternative: ‘అనారోగ్యం’, ‘అశక్తత’ లేదా ‘రోగం’
  rationale: సందర్భం శారీరక బాధను చూపుతున్నప్పటికీ, గ్రీకు పదం ఒక నిర్దిష్ట వైద్య స్థితికే పరిమితం కాదు. విస్తృత అనువాదం ఆ అస్పష్టతను కాపాడుతుంది.
- issue: ἀπολέλυσαι లోని పూర్తయిన కార్యం మరియు ప్రస్తుత ఫలితం
  choice: ‘విడుదల పొందావు’
  alternative: ‘విడుదల పొందుతున్నావు’ లేదా ‘విడుదల చేయబడ్డావు’
  rationale: గ్రీకు perfect passive పూర్తయిన విముక్తిని, కొనసాగుతున్న ఫలితంతో కలిపి వ్యక్తం చేస్తుంది. తెలుగు సాధారణ భూతరూపం ఈ ప్రకటనను సహజంగా తెలియజేస్తుంది; ప్రగతిశీల వర్తమానం కార్యాన్ని ఇంకా కొనసాగుతున్నదిగా తప్పుగా సూచించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ప్రత్యక్ష సంబోధనలో ‘అమ్మా’ను ఉపయోగించి γύναι యొక్క గౌరవ భావాన్ని నిలిపాం; పదేపదే అనువదించిన ‘స్త్రీ’ వల్ల కలిగే అసహజ కఠినత్వాన్ని నివారించాం.
