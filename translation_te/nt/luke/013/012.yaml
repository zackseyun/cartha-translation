  rationale: ప్రొసెఫోనేసెన్‌కు మూలంలో లేని ‘దగ్గరకు’ అనే కదలిక భావాన్ని తొలగించి, యేసు ఆమెను ఉద్దేశించి పిలిచాడనే అర్థాన్ని నిలిపాం. వాక్యాన్ని ఆధునిక తెలుగు కథనశైలికి అనుగుణంగా ‘ఆమెతో ఇలా అన్నాడు’గా మలిచాం. ἀπολέλυσαιకు సంబంధించిన ప్రత్యామ్నాయాన్ని సరైన పదబంధానికి పాదటిప్పణిగా చేర్చాం.
