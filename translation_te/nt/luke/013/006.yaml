revisions:
- from: 'ఆయన ఈ ఉపమానం చెబుతూ ఉన్నాడు: “ఒక మనిషి తన ద్రాక్షతోటలో ఒక అంజూరపు చెట్టును నాటించి ఉంచాడు[a]. అతడు దానిలో పండు కోసం వెదకడానికి వచ్చాడు, కాని ఏదీ దొరకలేదు.”'
  to: 'ఆయన ఈ ఉపమానం చెబుతూ ఉన్నాడు: “ఒక మనిషికి తన ద్రాక్షతోటలో నాటబడి ఉన్న ఒక అంజూరపు చెట్టు ఉండేది[a]. అతడు దానిమీద పండు కోసం వెదుకుతూ వచ్చాడు, కానీ అతనికి ఏ పండూ దొరకలేదు.”'
  rationale: The revision removes the causative implication introduced by “నాటించి ఉంచాడు” and renders the perfect passive participle as “నాటబడి ఉన్న.” It also uses idiomatic Telugu for fruit on a tree and makes explicit that the man, not an unspecified party, found no fruit. The footnote remains anchored and now accurately explains the passive construction and the alternative possessive formulation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:43:54Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the fig tree, vineyard, indefinite human subject, and fruit-searching action. However, “నాటించి ఉంచాడు” makes the man the one who caused the tree to be planted, whereas πεφυτευμένην is a perfect passive participle and merely describes the tree as having been planted. The source does not identify its planter.
  naturalness: “దానిలో పండు కోసం వెదకడానికి వచ్చాడు” is understandable, but “దానిమీద పండు కోసం వెదుకుతూ వచ్చాడు” is more idiomatic Telugu for fruit borne by a tree. “అతనికి ఏ పండూ దొరకలేదు” clearly retains the active sense that he found none.
  terminology: “ఉపమానం,” “అంజూరపు చెట్టు,” and “ద్రాక్షతోట” are accurate, natural modern-standard Telugu terms. No theological terminology requires adjustment.
  issues:
  - severity: medium
    issue: “నాటించి ఉంచాడు” assigns an unstated planting action to the owner.
    rationale: The Greek πεφυτευμένην is passive (‘having been planted’/‘planted’) and does not say that the man planted or commissioned the planting. The translation should retain the tree’s planted state without specifying an agent.
  - severity: low
    issue: The current wording for the fruit search is less idiomatic.
    rationale: In Telugu, fruit is more naturally sought ‘on’ a tree (దానిమీద) than ‘in’ it (దానిలో), while preserving the intended sense of ἐν αὐτῇ.
