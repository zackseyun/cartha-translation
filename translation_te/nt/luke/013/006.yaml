reference: Luke 13:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ ταύτην τὴν παραβολήν. Συκῆν εἶχέν τις ⸂πεφυτευμένην ἐν τῷ ἀμπελῶνι αὐτοῦ⸃, καὶ ἦλθεν ζητῶν καρπὸν ἐν αὐτῇ καὶ οὐχ εὗρεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/006.yaml
  text: 'And he was telling this parable: “A man had a fig tree planted in his vineyard[a], and he came looking for fruit on it and found none.”'
translation:
  language: te
  text: 'ఆయన ఈ ఉపమానం చెబుతూ ఉన్నాడు: “ఒక మనిషికి తన ద్రాక్షతోటలో నాటబడి ఉన్న ఒక అంజూరపు చెట్టు ఉండేది[a]. అతడు దానిమీద పండు కోసం వెదుకుతూ వచ్చాడు, కానీ అతనికి ఏ పండూ దొరకలేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక మనిషి తన ద్రాక్షతోటలో నాటబడిన ఒక అంజూరపు చెట్టును కలిగి ఉన్నాడు.” గ్రీకులో చెట్టు నాటబడిన స్థితిలో ఉందని మాత్రమే ఉంది; దాన్ని ఎవరు నాటారో చెప్పబడలేదు.
    reason: వ్యాకరణ సంబంధమైన ప్రత్యామ్నాయం
lexical_decisions:
- source_word: Ἔλεγεν
  choice: చెబుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న లేదా కథను పరిచయం చేసే చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: —
  rationale: δέ స్వల్ప అనుసంధాన పదం; తెలుగులో ప్రత్యేక పదం చేర్చకుండానే వాక్యప్రవాహంలో దాని పని సహజంగా వ్యక్తమవుతుంది.
- source_word: παραβολήν
  choice: ఉపమానం
  rationale: యేసు చెప్పే బోధాత్మక రూపక కథకు తెలుగులో స్థిరపడిన, సందర్భోచిత పదం.
- source_word: Συκῆν
  choice: అంజూరపు చెట్టు
  rationale: ఈ నామవాచకం ప్రత్యేకంగా అంజూరపు చెట్టునే సూచిస్తుంది.
- source_word: εἶχέν τις
  choice: ఒక మనిషి ... ఉంచాడు
  rationale: τις అనిర్దిష్ట వ్యక్తిని సూచిస్తుంది; ఉపమాన కథనశైలిలో ‘ఒక మనిషి’ సహజంగా ఉంటుంది.
- source_word: πεφυτευμένην
  choice: నాటించి ఉంచాడు
  rationale: పరిపూర్ణ కర్మణి కృదంతం చెట్టు నాటబడి కొనసాగుతున్న స్థితిని సూచిస్తుంది; తెలుగు causative నిర్మాణం యజమాని స్వయంగా నాటాడని తప్పనిసరిగా చెప్పకుండా ఆ భావాన్ని అందిస్తుంది.
- source_word: ἐν τῷ ἀμπελῶνι αὐτοῦ
  choice: తన ద్రాక్షతోటలో
  rationale: ἀμπελώνకు ‘ద్రాక్షతోట’ ప్రత్యక్ష సమానార్థకం; కర్తవైపు తిరిగే స్వామ్యాన్ని తెలుగులో ‘తన’ సహజంగా తెలియజేస్తుంది.
- source_word: ἦλθεν ζητῶν
  choice: వెదకడానికి వచ్చాడు
  rationale: ప్రధాన క్రియతో కూడిన వర్తమాన కృదంతం తెలిపే ఉద్దేశపూర్వక వెదకడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καρπὸν
  choice: పండు
  rationale: అంజూరపు చెట్టు సందర్భంలో ఏకవచన సమూహార్థక ‘పండు’ సహజంగా ఉండి, తరువాతి రూపక ప్రతిధ్వనిని కూడా నిలుపుతుంది.
- source_word: ἐν αὐτῇ
  choice: దానిలో
  rationale: గ్రీకు ἐν యొక్క రూపాన్ని నిలుపుతూ, చెట్టులో పండు వెదకడం అనే తెలుగు ప్రయోగానికి అనుగుణంగా ఉంది.
- source_word: οὐχ εὗρεν
  choice: ఏదీ దొరకలేదు
  rationale: ముందున్న ‘పండు’ను అనవసరంగా పునరుక్తి చేయకుండా, ఒక్క పండూ లభించలేదనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఉపమానంలోని అనిర్దిష్ట కర్త τις
  choice: ఒక మనిషి
  alternative: ఎవరో ఒకరు
  rationale: మూలపాఠం వ్యక్తిని నిర్దిష్టంగా గుర్తించదు. ‘ఒక మనిషి’ సాధారణ కథనశైలిని కాపాడుతుంది; అదనపు దైవశాస్త్రీయ గుర్తింపును చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన కథనశైలి. ‘నాటించి ఉంచాడు’ ద్వారా పరిపూర్ణ కర్మణి కృదంతంలోని స్థితి భావాన్ని సహజంగా అందిస్తూ, నాటిన వ్యక్తి ఎవరో నిర్ణయించలేదు.
