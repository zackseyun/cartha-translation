id: LUK.3.15
reference: Luke 3:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Προσδοκῶντος δὲ τοῦ λαοῦ καὶ διαλογιζομένων πάντων ἐν ταῖς καρδίαις αὐτῶν περὶ τοῦ Ἰωάννου, μήποτε αὐτὸς εἴη ὁ χριστός,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/015.yaml
  text: As the people were waiting expectantly[a], and all were reasoning in their hearts about John, whether perhaps he might be the Messiah,
translation:
  language: te
  text: ప్రజలు ఆశతో ఎదురుచూస్తుండగా, వారందరూ యోహాను గురించి, ఆయనే మెస్సీయా[a] అయి ఉండవచ్చేమో అని తమ హృదయాల్లో ఆలోచించుకుంటూ ఉండగా,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “క్రీస్తు.” గ్రీకు: హో క్రిస్టోస్.'
    reason: ὁ χριστόςకు సంప్రదాయ ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: Προσδοκῶντος
  choice: నిరీక్షణతో ఎదురుచూస్తూ
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న నిరీక్షణను, అలాగే προσδοκάωలోని ఆశతో కూడిన ఎదురుచూపును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక కథన పురోగతిని సూచించే మృదువైన అనుసంధాన పదం. తెలుగు వాక్య నిర్మాణంలో ‘ఉండగా’ ఆ అనుసంధాన కార్యాన్ని సహజంగా నెరవేరుస్తుంది.
- source_word: τοῦ λαοῦ
  choice: ప్రజలు
  rationale: λαόςను సమష్టిగా సూచించే ప్రత్యక్షమైన, సహజమైన తెలుగు పదం.
- source_word: διαλογιζομένων
  choice: ఆలోచించుకుంటూ
  rationale: ἐν ταῖς καρδίαις αὐτῶνతో కలిసి ఇది అంతరంగ పరిశీలనను, తమలో తాము తర్కించుకోవడాన్ని సూచిస్తుంది; ‘ఆలోచించుకుంటూ’ సాధారణ పాఠకులకు సహజంగా ఉంది.
- source_word: πάντων
  choice: వారందరూ
  rationale: సందర్భంలోని ప్రజలందరినీ సమగ్రంగా సూచిస్తుంది.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: తమ హృదయాల్లో
  rationale: మూలంలోని రూపకాన్ని నిలుపుతుంది; బైబిలు వాడుకలో ‘హృదయం’ అంతరంగ ఆలోచనను కూడా కలిగి ఉంటుంది.
- source_word: περὶ τοῦ Ἰωάννου
  choice: యోహాను గురించి
  rationale: περί + షష్ఠీ విభక్తి యొక్క ‘గురించి’ అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: μήποτε ... εἴη
  choice: అయి ఉండవచ్చేమో అని
  rationale: μήποτεతో కూడిన విధ్యర్థక εἴηలోని సందేహం, సాధ్యత రెండింటినీ పరిష్కరించకుండా తెలుగులో నిలుపుతుంది.
- source_word: ὁ χριστός
  choice: మెస్సీయా
  rationale: ఇక్కడ Χριστός వ్యక్తినామంలా కాక ప్రజలు ఎదురుచూస్తున్న అభిషిక్తుని బిరుదుగా వాడబడింది; ‘మెస్సీయా’ యూదుల నిరీక్షణ నేపథ్యాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయా
  alternative: క్రీస్తు
  rationale: యోహాను ఎవరో అనే ప్రజల ఊహలో ఇది మెస్సీయ సంబంధమైన బిరుదుగా పనిచేస్తోంది. ప్రధాన పాఠంలో ‘మెస్సీయా’ను ఉంచి, ‘క్రీస్తు’ను పాదసూచికలో ఇవ్వడం మూలపద పరిధిని పాఠకునికి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదైనా సాధారణ పాఠకులకు సులభంగా ఉండే వాక్య నిర్మాణం. మూల గ్రీకులో ఈ వాక్యం తరువాతి వచనంలోని యోహాను సమాధానానికి నేపథ్యాన్ని ఏర్పరుస్తూ అసంపూర్ణంగా కొనసాగుతుంది; అందుకే చివర ‘ఉండగా,’తో ఆ కొనసాగింపును నిలిపాం.
