id: LUK.3.21
reference: Luke 3:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν καὶ Ἰησοῦ βαπτισθέντος καὶ προσευχομένου ἀνεῳχθῆναι τὸν οὐρανὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/021.yaml
  text: It happened that when all the people were baptized[a], and Jesus also had been baptized and was praying, heaven was opened,
translation:
  language: te
  text: 'ఇలా జరిగింది: ప్రజలందరూ బాప్తిస్మం పొందినప్పుడు, యేసు కూడా బాప్తిస్మం పొంది ప్రార్థిస్తూ ఉండగా, పరలోకం తెరవబడింది[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆకాశం.’ గ్రీకు పదం కనిపించే ఆకాశాన్నిగానీ పరలోకాన్నిగానీ సూచించగలదు; ఇక్కడి దైవ ప్రత్యక్షత సందర్భానికి ‘పరలోకం’ బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: ఇలా జరిగింది
  rationale: లూకా ఉపయోగించే సంఘటనాత్మక కథన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది కథన పురోగతిని సూచిస్తుంది; ‘ఇలా జరిగింది’ అనే ప్రారంభ నిర్మాణమే ఆ సంధాన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν
  choice: ప్రజలందరూ బాప్తిస్మం పొందినప్పుడు
  rationale: ἐν + ఆర్టిక్యులర్ ఇన్ఫినిటివ్ యొక్క కాలార్థాన్ని ‘పొందినప్పుడు’ సహజంగా వ్యక్తం చేస్తుంది; ἅπαντα τὸν λαὸν సమూహమంతటినీ సూచిస్తుంది.
- source_word: καὶ Ἰησοῦ βαπτισθέντος
  choice: యేసు కూడా బాప్తిస్మం పొంది
  rationale: καί యొక్క చేర్పు భావాన్ని ‘కూడా’ ద్వారా నిలుపుతూ, జెనిటివ్ అబ్సల్యూట్‌ను సహజమైన తెలుగు ఉపవాక్యంగా అందిస్తుంది.
- source_word: καὶ προσευχομένου
  choice: ప్రార్థిస్తూ ఉండగా
  rationale: ప్రధాన సంఘటన జరుగుతున్న సమయంలో కొనసాగుతున్న ప్రార్థనను ఈ రూపం స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀνεῳχθῆναι
  choice: తెరవబడింది
  rationale: గ్రీకు కర్మణి రూపాన్ని నిలుపుతుంది; ‘చీలిపోయింది’ వంటి మరింత బలమైన చిత్రణను మూలంలో లేనప్పుడు చేర్చదు.
- source_word: τὸν οὐρανὸν
  choice: పరలోకం
  rationale: తరువాత వచ్చే ఆత్మ దిగివచ్చడం, దైవ స్వరం వంటి ప్రత్యక్షతా సందర్భంలో దైవిక లోక భావం ప్రధానంగా ఉంది; కనిపించే ఆకాశం అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: బాప్తిస్మ దృశ్యంలో οὐρανός సూచన
  choice: పరలోకం
  alternative: ఆకాశం
  rationale: సందర్భం దైవ ప్రత్యక్షతతో నిండి ఉన్నందున ‘పరలోకం’ ప్రధాన భావాన్ని అందిస్తుంది; అయితే గ్రీకు పదానికి కనిపించే ఆకాశం అనే అర్థం కూడా ఉండగలదని పాదటిప్పణి ద్వారా నిజమైన పదార్థ సందిగ్ధతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘బాప్తిస్మం’ సాధారణ తెలుగు క్రైస్తవ వాడుకకు అనుగుణంగా ఉంది; వాక్య నిర్మాణం మూలంలోని కాల సంబంధాన్ని, యేసు ప్రార్థన కొనసాగుతున్న భావాన్ని కాపాడుతుంది.
