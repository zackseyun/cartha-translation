  yaml_path: translation/nt/luke/003/028.yaml
  text: the son of Melchi[a], the son of Addi, the son of Cosam, the son of Elmadam, the son of Er
translation:
  language: te
  text: మెల్కీ కుమారుడు[a], అద్దీ కుమారుడు, కోసాము కుమారుడు, ఎల్మదాము కుమారుడు, ఏరు కుమారుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు మూలంలో ప్రతి పేరుతో అక్షరార్థంగా ‘యొక్క’ అనే సంబంధమే పునరావృతమవుతుంది; చుట్టూ ఉన్న వంశావళి సందర్భం సూచించే సంబంధాన్ని స్పష్టం చేయడానికి తెలుగులో ‘కుమారుడు’ అని చేర్చాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: కుమారుడు
  rationale: లూకా వంశావళి సందర్భంలో ప్రతి పేరుతో పునరావృతమయ్యే షష్ఠీ విభక్తి సంబంధం సంక్షిప్తంగా ‘కుమారుడు’ అనే వంశసంబంధాన్ని సూచిస్తుంది. తెలుగులో కేవలం ‘యొక్క’ అని ఇవ్వడం అసహజంగా, అస్పష్టంగా ఉంటుంది.
- source_word: Μελχὶ
  choice: మెల్కీ
  rationale: గ్రీకు వ్యక్తినామాన్ని ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: Ἀδδὶ
  choice: అద్దీ
  rationale: గ్రీకు ద్విత్వ వ్యంజనాన్ని, దీర్ఘాంతాన్ని ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: Κωσὰμ
  choice: కోసాము
  rationale: గ్రీకు Κωσὰμ పేరును తెలుగు పఠనానికి సహజంగా లిప్యంతరీకరించాం; చివరి వ్యంజనానికి సహాయక అచ్చును చేర్చాం.
- source_word: Ἐλμαδὰμ
  choice: ఎల్మదాము
  rationale: మూలంలోని వ్యక్తినామ ధ్వనిరూపాన్ని సాధ్యమైనంత దగ్గరగా, తెలుగులో సులభంగా చదవగల రూపంలో ఇచ్చాం.
- source_word: Ἢρ
  choice: ఏరు
  rationale: గ్రీకు పేరులోని దీర్ఘ ఏ ధ్వనిని నిలిపి, తెలుగు ఉచ్చారణకు అవసరమైన సహాయక అచ్చుతో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వినిపించే వంశావళి శైలిని వాడాం. వ్యక్తినామాలను అనువదించకుండా గ్రీకు రూపాల ఆధారంగా లిప్యంతరీకరించాం.
