  yaml_path: translation/nt/luke/003/037.yaml
  text: the son of Methuselah[a], the son of Enoch, the son of Jared, the son of Mahalaleel, the son of Cainan,
translation:
  language: te
  text: మెతూషెలహు కుమారుడు, హనోకు కుమారుడు, యారెదు కుమారుడు, మహలలేలు కుమారుడు, కయినాను[a] కుమారుడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పాఠంలో Καϊνάμ (కైనామ్) ఉంది. దీనిని ‘కైనాము’ అని కూడా రాయవచ్చు; పాత నిబంధన వంశావళులతో సర్దుబాటు చేసి చెప్పినప్పుడు ‘కేనాను’ అని కూడా వాడతారు.
    reason: ప్రత్యామ్నాయ నామరూపాలు
lexical_decisions:
- source_word: τοῦ
  choice: కుమారుడు
  rationale: లూకా వంశావళిలో ప్రతి పేరుకు ముందు పునరావృతమయ్యే సంబంధవిభక్తి సూచక పదం, ముందటి వాక్యాల నుంచి కొనసాగుతున్న ‘కుమారుడు’ అనే భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది. తెలుగులో ప్రతి పేరుతో ‘కుమారుడు’ అని చేర్చడం సంబంధాన్ని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: Μαθουσαλά
  choice: మెతూషెల
  rationale: పాత నిబంధనలోని అదే వ్యక్తిని తెలుగు పాఠకులు గుర్తించగల ప్రాచుర్యంలో ఉన్న బైబిలు నామరూపం.
- source_word: Ἑνώχ
  choice: హనోకు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన, గుర్తించదగిన నామరూపం.
- source_word: Ἰάρετ
  choice: యెరెదు
  rationale: పాత నిబంధన వంశావళిలోని సంబంధిత పేరుతో అనుసరణ కలిగిన సుపరిచిత తెలుగు రూపం.
- source_word: Μαλελεήλ
  choice: మహలలేలు
  rationale: ఆదికాండంలోని సంబంధిత వ్యక్తిని గుర్తించేందుకు అనువైన సంప్రదాయ తెలుగు బైబిలు నామరూపం.
- source_word: Καϊνάμ
  choice: కేయినాను
  rationale: గ్రీకు పేరును తెలుగులో స్పష్టంగా పలికించడంతోపాటు, ప్రాచుర్యంలో ఉన్న తెలుగు బైబిలు నామరూపాన్ని అనుసరిస్తుంది; ఇతర లిప్యంతరీకరణ రూపాలను పాదసూచికలో నమోదు చేశాం.
theological_decisions:
- issue: లూకా వంశావళిలో పునరావృతమయ్యే సంబంధవిభక్తి నిర్మాణం
  choice: ప్రతి పేరుతో ‘కుమారుడు’ అని స్పష్టంగా చేర్చడం
  alternative: ప్రతి పేరును కేవలం సంబంధార్థక విభక్తితో వరుసగా ఇవ్వడం
  rationale: గ్రీకులో సందర్భం ద్వారా అర్థమయ్యే వంశసంబంధాన్ని తెలుగులో స్పష్టంగా చెప్పడం సహజ పఠనానికి తోడ్పడుతుంది; మూలంలోని సంబంధాన్ని మార్చదు.
- issue: Καϊνάμ అనే పేరును ప్రతినిధ్యం చేయడం
  choice: ప్రధాన పాఠంలో ‘కేయినాను’ అని ఉంచడం
  alternative: కైనాము లేదా కేనాను అనే లిప్యంతరీకరణ రూపాలు
  rationale: SBLGNT గ్రీకు పాఠంలో పేరు స్పష్టంగా ఉన్నందున దాన్ని తొలగించకుండా అనువదించాం. భిన్న తెలుగు నామరూపాలు ఒకే గ్రీకు పేరుకు లిప్యంతరీకరణ ప్రత్యామ్నాయాలు మాత్రమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలిని వాడాం. ఈ వాక్యం ముందూ వెనుకా కొనసాగే వంశావళిలో భాగమైనందున చివర కామాను నిలిపాం.
