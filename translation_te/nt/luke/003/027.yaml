  text: the son of Joanan[a], the son of Rhesa, the son of Zerubbabel, the son of Shealtiel, the son of Neri[b],
translation:
  language: te
  text: యోహానాను కుమారుడు[a], రేసా కుమారుడు, జెరుబ్బాబెలు కుమారుడు, షయల్తీయేలు కుమారుడు[b], నేరి కుమారుడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ప్రతి పేరుతో ‘యొక్క’ అనే భావమిచ్చే రూపమే పునరావృతమవుతుంది; వంశావళి నిర్మాణం సూచించే సంబంధాన్ని స్పష్టంగా చూపడానికి ‘కుమారుడు’ అని చేర్చాం.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు రూపం ‘సలతీయేలు’; పాత నిబంధనలో సాధారణంగా ‘షయల్తీయేలు’గా తెలిసిన పేరుతో ఇది సంప్రదాయంగా గుర్తించబడుతుంది.
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ
  choice: కుమారుడు
  rationale: గ్రీకు వాక్యంలో ప్రతి పేరుకు ముందు షష్ఠీ విభక్తి సూచించే పదమే పునరావృతమవుతుంది. అయితే చుట్టుపక్కల వంశావళి నిర్మాణంలో ‘కుమారుడు’ అనే సంబంధం అధ్యాహారంగా ఉంది; సహజమైన తెలుగులో దానిని స్పష్టంగా ఇచ్చాం.
- source_word: Ἰωανὰν
  choice: యోహానాను
  rationale: గ్రీకు వ్యక్తినామాన్ని తెలుగులో గుర్తించదగిన బైబిలు నామరూపంగా లిప్యంతరీకరించాం.
- source_word: Ῥησὰ
  choice: రేసా
  rationale: గ్రీకు వ్యక్తినామానికి సహజమైన తెలుగు లిప్యంతరీకరణ.
- source_word: Ζοροβαβὲλ
  choice: జెరుబ్బాబెలు
  rationale: పాత నిబంధనలోని వ్యక్తితో సంబంధం గుర్తించడానికి ప్రాచుర్యంలో ఉన్న తెలుగు బైబిలు నామరూపాన్ని వాడాం.
- source_word: Σαλαθιὴλ
  choice: షయల్తీయేలు
  rationale: గ్రీకు రూపాన్ని నేరుగా ‘సలతీయేలు’ అని ఇవ్వవచ్చు; అయితే హీబ్రూ సంప్రదాయంలోని అదే బైబిలు పేరుతో సంబంధం స్పష్టంగా ఉండేందుకు గుర్తించదగిన ‘షయల్తీయేలు’ రూపాన్ని ఎంచుకున్నాం.
- source_word: Νηρὶ
  choice: నేరి
  rationale: గ్రీకు వ్యక్తినామాన్ని సూటిగా తెలుగులో లిప్యంతరీకరించాం.
theological_decisions:
- issue: వంశావళిలో అధ్యాహారంగా ఉన్న సంబంధం
  choice: ప్రతి పేరుతో ‘కుమారుడు’ అని స్పష్టంగా చేర్చడం
  alternative: ప్రతి పేరును కేవలం షష్ఠీ సంబంధంలో వరుసగా ఇవ్వడం
  rationale: మూల గ్రీకులో సంబంధం చుట్టుపక్కల వంశావళి నిర్మాణం ద్వారా అధ్యాహారంగా తెలుస్తుంది. తెలుగులో ‘కుమారుడు’ అని చేర్చడం భావాన్ని విస్తరించడం కాదు; సహజంగా వ్యక్తపరచడం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలిని వాడాం. ఇది మధ్య వాక్య భాగం కావడంతో చివర కామాను నిలిపాం.
