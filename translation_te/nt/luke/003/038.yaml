translation:
  language: te
  text: ఎనోషు కుమారుడు[a], షేతు కుమారుడు, ఆదాము కుమారుడు, దేవుని కుమారుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు మూలంలో అక్షరార్థంగా ‘ఎనోషు యొక్క, షేతు యొక్క, ఆదాము యొక్క, దేవుని యొక్క’ అనే షష్ఠీ విభక్తి నిర్మాణమే పునరావృతమవుతుంది; వంశావళిలో స్థిరపడిన వాక్యనిర్మాణాన్ని బట్టి ‘కుమారుడు’ అనే పదాన్ని తెలుగులో చేర్చాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ Ἐνὼς
  choice: ఎనోషు కుమారుడు
  rationale: పునరావృతమయ్యే షష్ఠీ విభక్తి నిర్మాణం మునుపటి వచనాల వంశావళి సూత్రాన్ని కొనసాగిస్తుంది; సందర్భం నుంచి సూచితమైన ‘కుమారుడు’ను తెలుగులో స్పష్టత కోసం చేర్చాం. Ἐνώς అనే పేరును ‘ఎనోషు’గా లిప్యంతరీకరించాం.
- source_word: τοῦ Σὴθ
  choice: షేతు కుమారుడు
  rationale: వంశావళిలోని అదే సంక్షిప్త షష్ఠీ విభక్తి నిర్మాణం పుత్ర సంబంధాన్ని సూచిస్తుంది. Σήθ అనే పేరును ‘షేతు’గా లిప్యంతరీకరించాం.
- source_word: τοῦ Ἀδὰμ
  choice: ఆదాము కుమారుడు
  rationale: అదే వంశావళి నిర్మాణం పుత్ర సంబంధాన్ని కొనసాగిస్తుంది. ఇక్కడ Ἀδάμ వ్యక్తి పేరు కాబట్టి దాన్ని ‘మనిషి’ అని అనువదించకుండా ‘ఆదాము’గా ఉంచాం.
- source_word: τοῦ θεοῦ
  choice: దేవుని కుమారుడు
  rationale: గ్రీకులో ఇది షష్ఠీ విభక్తి పదబంధమే అయినా, వంశావళిలో పునరావృతమయ్యే నిర్మాణం వల్ల ‘కుమారుడు’ సూచితమవుతోంది. ‘దేవుని కుమారుడు’ అనేది సాహిత్య నమూనాను కాపాడుతూ ఆదాము దేవుని నుంచి నేరుగా ఉనికిలోకి వచ్చాడనే ముగింపును వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఆదాము వంశావళి చివరనున్న τοῦ θεοῦ పదబంధం
  choice: దేవుని కుమారుడు
  alternative: దేవునివాడు / దేవుని నుంచి వచ్చినవాడు
  rationale: మూలంలో సంబంధం షష్ఠీ విభక్తి ద్వారానే వ్యక్తమైనప్పటికీ, వంశావళి అంతటా సూచితమైన పుత్ర సంబంధాన్ని ఇక్కడ కూడా నిలుపుకోవడం సాహిత్య నిర్మాణానికీ భావపరమైన ఉద్వేగానికీ న్యాయం చేస్తుంది. అదే సమయంలో ఆదాముకు తరువాతి క్రీస్తుశాస్త్ర సంబంధమైన ప్రత్యేక అర్థాలను అదనంగా ఆపాదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే వంశావళి శైలిని వాడాం. పేర్లకు తెలుగు బైబిలు సంప్రదాయంలో సులభంగా గుర్తించదగిన రూపాలను ఎంచుకున్నాం; మూలంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు కాపాడాం.
