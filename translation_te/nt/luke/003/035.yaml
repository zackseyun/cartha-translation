    text: గ్రీకులో అక్షరార్థంగా, ‘సెరూఖ్ యొక్క, రగౌ యొక్క, ఫాలెక్ యొక్క, ఏబెర్ యొక్క, సాలా యొక్క’ అనే షష్ఠీ విభక్తి పదాల వరుస ఉంది. ఇది వంశావళిలో సంక్షిప్తంగా చెప్పే పద్ధతి; స్పష్టమైన తెలుగుకోసం సందర్భంలో అంతర్లీనంగా ఉన్న ‘కుమారుడు’ అనే పదాన్ని చేర్చాం.
    reason: lexical_alternative
  - marker: b
    text: 'ఇక్కడి పేర్లను పాత నిబంధనలో సాధారణంగా గుర్తించదగిన తెలుగు రూపాల్లో ఇచ్చాం: సెరూగు, రెయూ, పెలెగు, ఏబెరు, షేలహు.'
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ
  choice: కుమారుడు
  rationale: లూకా వంశావళిలో ప్రతి పేరుతో పునరావృతమయ్యే షష్ఠీ విభక్తి రూపం, పరిసర వాక్యాలనుబట్టి తండ్రి–కొడుకు సంబంధాన్ని సూచిస్తుంది. తెలుగులో కేవలం ‘యొక్క’ అని అనడం అసహజంగా, అస్పష్టంగా ఉంటుంది కాబట్టి సందర్భంలో అంతర్లీనంగా ఉన్న ‘కుమారుడు’ను స్పష్టంగా చేర్చాం.
- source_word: Σεροὺχ
  choice: సెరూగు
  rationale: గ్రీకు ‘సెరూఖ్’ రూపానికి మూలమైన పాత నిబంధన పేరుతో గుర్తించడానికి అనుకూలంగా ఉన్న ప్రామాణిక తెలుగు బైబిలు రూపాన్ని వాడాం.
- source_word: Ῥαγαὺ
  choice: రయూ
  rationale: గ్రీకు రూపం ‘రగౌ’; ఇది ఆదికాండంలోని రయూ అనే పితరుని సూచిస్తుంది. రెండు నిబంధనల మధ్య పేరును సులభంగా గుర్తించేందుకు ‘రయూ’ను ఎంచుకున్నాం.
- source_word: Φάλεκ
  choice: పెలెగు
  rationale: గ్రీకు ‘ఫాలెక్’కు సమానమైన ఆదికాండపు పేరు ‘పెలెగు’; తెలుగు పాఠకులకు పాత నిబంధన వంశావళితో సంబంధం స్పష్టమయ్యే రూపం ఇదే.
- source_word: Ἔβερ
  choice: ఏబెరు
  rationale: ఇది ఆదికాండంలోని ఏబెరు అనే పితరుని పేరు. గ్రీకు ఉచ్చారణను, తెలుగు బైబిలు పరిచయాన్ని సమతుల్యం చేసే రూపాన్ని వాడాం.
- source_word: Σαλὰ
  choice: షేలా
  rationale: గ్రీకు ‘సాలా’ ఆదికాండపు వంశావళిలోని షేలా పేరుకు సమానం. పాత నిబంధనతో గుర్తించదగిన సంబంధాన్ని నిలుపుకునేందుకు ‘షేలా’ను వాడాం.
