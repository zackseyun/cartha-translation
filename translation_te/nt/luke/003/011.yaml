id: LUK.3.11
reference: Luke 3:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ⸀ἔλεγεν αὐτοῖς· Ὁ ἔχων δύο χιτῶνας μεταδότω τῷ μὴ ἔχοντι, καὶ ὁ ἔχων βρώματα ὁμοίως ποιείτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/011.yaml
  text: And answering[a], he said to them, “The one who has two tunics must share with the one who has none, and the one who has food must do likewise.”
translation:
  language: te
  text: 'వారికి జవాబిస్తూ ఆయన ఇలా అన్నాడు: “రెండు అంగీలు[a] ఉన్నవాడు, ఒక్కటి కూడా లేనివానికి పంచాలి. ఆహారం ఉన్నవాడు కూడా అలాగే చేయాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అంగీలు” అంటే శరీరానికి దగ్గరగా ధరించే ప్రాథమిక వస్త్రాలు; వీటిని “చొక్కాలు” లేదా “వస్త్రాలు” అని కూడా అనువదించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ἔλεγεν αὐτοῖς
  choice: అందుకు ఆయన వారితో ఇలా అన్నాడు
  rationale: ప్రతిస్పందనను సూచించే ἀποκριθείς, స్వల్ప అనుసంధానకమైన δέ, ప్రధాన క్రియ ἔλεγεν—ఈ మూడింటి భావాన్ని సహజమైన తెలుగు కథన వాక్యంగా వ్యక్తం చేస్తుంది; అపూర్ణ భూతకాల రూపానికి అవసరానికి మించిన పునరావృత్తి భావాన్ని జోడించదు.
- source_word: Ὁ ἔχων δύο χιτῶνας
  choice: రెండు అంగీలు ఉన్నవాడు
  rationale: χιτών శరీరానికి దగ్గరగా ధరించే ప్రాథమిక వస్త్రాన్ని సూచిస్తుంది. ఆధునిక పాఠకులకు అర్థమయ్యే ‘అంగీ’ మూలపదంలోని ప్రాచీన వస్త్ర భావాన్ని సాధ్యమైనంతగా నిలుపుతుంది.
- source_word: μεταδότω
  choice: పంచుకోవాలి
  rationale: మూడవ పురుష ఆజ్ఞార్థక రూపంలోని బలమైన ఉపదేశాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τῷ μὴ ἔχοντι
  choice: ఒక్కటి కూడా లేనివాడితో
  rationale: సందర్భంలో లోపించిన వస్తువు అంగీయే అని స్పష్టం చేస్తూ, దత్తి విభక్తిలోని భాగస్వామ్య సంబంధాన్ని ‘తో’ ద్వారా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: βρώματα
  choice: ఆహారం
  rationale: తినే పదార్థాలను విస్తృతంగా సూచించే బహువచన పదానికి సహజమైన సమూహవాచక తెలుగు సమానార్థకం.
- source_word: ὁμοίως ποιείτω
  choice: కూడా అలాగే చేయాలి
  rationale: మొదటి ఆజ్ఞను ఆహారం విషయంలోనూ వర్తింపజేసే సమాంతర ఆజ్ఞార్థక బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పురుష ఏకవచన కృదంతాల సాధారణ ప్రతినిధి ప్రయోగం
  choice: ఉన్నవాడు ... లేనివాడు ... ఉన్నవాడు
  alternative: ఎవరికి ... వారు / ఎవడైతే ... వాడు
  rationale: గ్రీకు మూలంలోని ఏకవచన ప్రతినిధి నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది. ఇది ఆజ్ఞను పురుషులకు మాత్రమే పరిమితం చేయాలనే ఉద్దేశాన్ని జోడించదు; తెలుగు సాధారణ వాక్యప్రయోగానికి అనుగుణంగా ఉంది.
- issue: ఆజ్ఞార్థక బలం
  choice: పంచుకోవాలి ... చేయాలి
  alternative: పంచుకోవచ్చు ... చేయడం మంచిది
  rationale: μεταδότω, ποιείτω అనే ఆజ్ఞార్థక రూపాలను కేవలం ఐచ్ఛిక సలహాగా బలహీనపరచకుండా స్పష్టమైన నైతిక ఆదేశంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే వాక్య గౌరవం మరియు మూలంలోని సమాంతర ఆజ్ఞ నిర్మాణం నిలిచేలా రూపొందించబడింది.
