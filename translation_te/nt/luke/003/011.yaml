  source_fidelity: 'The central sense is accurately conveyed: John responds with parallel imperatives concerning clothing and food. However, “అందుకు” can sound causal (“therefore”) rather than marking a response, and “లేనివాడితో పంచుకోవాలి” is somewhat less direct than the Greek dative, which directs the sharing to the person who lacks clothing.'
