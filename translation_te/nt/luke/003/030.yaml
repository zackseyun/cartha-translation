lexical_decisions:
- source_word: τοῦ
  choice: కుమారుడు
  rationale: లూకా వంశావళిలో ప్రతి పేరుతో పునరావృతమయ్యే షష్ఠీ విభక్తి సూచక పదం, ముందటి వచనాల నుంచి కొనసాగుతున్న వంశసంబంధ సూత్రంలో ‘కుమారుడు’ అనే భావాన్ని సూచిస్తుంది. తెలుగులో కేవలం ‘యొక్క’ అని అనడం అసహజంగా, సంబంధం అస్పష్టంగా ఉంటుంది.
- source_word: Συμεὼν
