  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἤδη δὲ καὶ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/009.yaml
  text: And already the ax is laid at the root of the trees[c][b][a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: te
  text: ఇప్పటికే గొడ్డలి చెట్ల వేరు దగ్గర పెట్టి ఉంది.[a] కాబట్టి మంచి ఫలం ఫలించని[b] ప్రతి చెట్టూ నరికివేయబడి మంటలో వేయబడుతుంది.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గొడ్డలి చెట్ల వేరు దగ్గర పడి ఉంది.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మంచి ఫలాన్ని ఉత్పత్తి చేయని.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “అగ్నిలో పడవేయబడుతుంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: ఇప్పటికే
  rationale: రాబోయే తీర్పు తక్షణమే సమీపించి ఉందనే కాలసూచక బలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ καὶ
  choice: సందర్భ ప్రవాహంలో ప్రత్యేక పదంగా వ్యక్తపరచలేదు
  rationale: δὲ καὶ కొనసాగింపుతో కూడిన అదనపు ఉద్ఘాటనను ఇస్తుంది; తెలుగులో ‘ఇప్పటికే’ మరియు వాక్యప్రవాహం ఆ భావాన్ని సహజంగా మోస్తాయి. ‘మరియు’ అని యాంత్రికంగా చేరిస్తే వాక్యం కృత్రిమంగా ఉంటుంది.
- source_word: ἡ ἀξίνη
  choice: గొడ్డలి
  rationale: చెట్టును నరికే సాధనాన్ని స్పష్టంగా సూచించే సాధారణ ఆధునిక తెలుగు పదం.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων
  choice: చెట్ల వేరు దగ్గర
  rationale: గొడ్డలి నరకడానికి సిద్ధంగా వేరు వద్ద ఉందనే దృశ్యాన్ని సహజంగా నిలుపుతుంది; మూలంలోని బహువచన ‘చెట్లు’ కూడా నిలిచింది.
- source_word: κεῖται
  choice: పెట్టి ఉంది
  rationale: అక్షరార్థంగా ‘పడి ఉంది/ఉంది’; సందర్భంలో ఎవరో సిద్ధంగా ఉంచిన గొడ్డలి అనే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది, కార్యం ఇంకా జరగకముందే తీర్పు సిద్ధంగా ఉందనే చిత్రాన్ని కాపాడుతుంది.
- source_word: πᾶν οὖν δένδρον
  choice: కాబట్టి ... ప్రతి చెట్టూ
  rationale: οὖν తెలిపే తార్కిక పరిణామాన్ని ‘కాబట్టి’ స్పష్టంగా చూపిస్తుంది; πᾶν యొక్క సమగ్ర బలం ‘ప్రతి’లో నిలుస్తుంది.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: మంచి ఫలం ఫలించని
  rationale: ποιέω అక్షరార్థంగా చేయడం/ఉత్పత్తి చేయడం అయినప్పటికీ, చెట్టు-ఫలం సందర్భంలో ‘ఫలించు’ సహజమైన తెలుగు ప్రయోగం; నైతిక-ఆధ్యాత్మిక రూపకం అలాగే నిలుస్తుంది.
- source_word: ἐκκόπτεται
  choice: నరికివేయబడి
  rationale: చెట్టు రూపకంలో పూర్తిగా నరికివేయబడటాన్ని స్పష్టంగా, సజీవంగా తెలియజేస్తుంది.
- source_word: εἰς πῦρ βάλλεται
  choice: మంటలో వేయబడుతుంది
  rationale: వర్తమానకాల నిష్క్రియ రూపంలోని నిర్ణీత పరిణామాన్ని నిలుపుతూ, ఆధునిక పాఠకులకు సహజంగా అర్థమయ్యే రూపం.
theological_decisions:
- issue: తీర్పును సూచించే రూపకం
  choice: గొడ్డలి, చెట్లు, మంచి ఫలం, మంట అనే వ్యవసాయ రూపకాన్ని యథాతథంగా ఉంచి, సమీపిస్తున్న తీవ్రమైన దైవిక తీర్పు హెచ్చరికగా అనువదించడం
  alternative: ‘మంట’ను ప్రత్యేకంగా నరకం అని లేదా ఈ రూపకాన్ని ఇశ్రాయేలుపై చారిత్రక తీర్పుకే పరిమితం చేసి వివరించడం
  rationale: వచనం తీవ్రమైన, సమీప తీర్పును స్పష్టంగా సూచిస్తుంది; అయితే మంట యొక్క పూర్తి సూచనను అది స్వయంగా పరిమితం చేయదు. కాబట్టి వ్యాఖ్యానాత్మక సిద్ధాంతాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గంభీరమైన ప్రవచనాత్మక స్వరాన్ని నిలుపుతూ రూపొందించబడింది. మూలంలోని వర్తమానకాల నిష్క్రియ రూపాలు తీర్పు యొక్క నిశ్చితత్వాన్ని తెలియజేసే విధంగా కాపాడబడ్డాయి.
