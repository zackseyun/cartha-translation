  text: the son of Cainan[a], the son of Arphaxad, the son of Shem, the son of Noah, the son of Lamech[c][b],
translation:
  language: te
  text: కయినాము కుమారుడు[a], అర్ఫక్సదు కుమారుడు[c], షేము కుమారుడు, నోవహు కుమారుడు, లామెకు కుమారుడు[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ పేరును ‘కైనాము’ అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని పాఠ్య లేదా సమన్వయ సంప్రదాయాలు, వంశావళిని పాత నిబంధనలోని కొన్ని రూపాలకు మరింత దగ్గర చేయడానికి, ఇక్కడ కయినామును విడిచిపెడతాయి.
    reason: textual_variant
  - marker: c
    text: ‘అర్ఫక్సదు’ లూకాలోని గ్రీకు రూపాన్ని ప్రతిబింబిస్తుంది; పాత నిబంధన హీబ్రూ పేరును తరచుగా ‘అర్పక్షదు’ అని రాస్తారు.
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ
  choice: కుమారుడు
  rationale: లూకా వంశావళిలో ప్రతి పేరుతో పునరావృతమయ్యే షష్ఠీ విభక్తి సూచన, చుట్టుపక్కల వచనాలు స్థాపించిన వంశసంబంధంలో ‘కుమారుడు’ అని అర్థమవుతుంది. తెలుగులో సహజమైన వంశావళి శైలికోసం దీనిని స్పష్టంగా ఇచ్చాం.
- source_word: Καϊνὰμ
  choice: కయినాము
  rationale: గ్రీకు పేరుకు దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణను వాడాం.
- source_word: Ἀρφαξὰδ
  choice: అర్పక్సదు
  rationale: లూకాలోని గ్రీకు రూపాన్ని ఆధారంగా తీసుకొని తెలుగులో లిప్యంతరీకరించాం; పాత నిబంధన హీబ్రూ రూపాన్ని ప్రతిబింబించే ‘అర్పక్షదు’ అనే రూపాన్ని ప్రధాన పాఠ్యంలోకి దిగుమతి చేయలేదు.
- source_word: Σὴμ
  choice: షేము
  rationale: గ్రీకు పేరును, తెలుగులో సుపరిచితమైన బైబిలు నామరూపాన్ని దృష్టిలో ఉంచుకొని లిప్యంతరీకరించాం.
- source_word: Νῶε
  choice: నోవహు
  rationale: గ్రీకు Νῶε సూచించే పాత నిబంధన వ్యక్తికి తెలుగులో సుపరిచితమైన ‘నోవహు’ రూపాన్ని వాడాం.
- source_word: Λάμεχ
  choice: లెమెకు
  rationale: గ్రీకు పేరుకు సమీపంగా, తెలుగులో చదవడానికి సహజంగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: అర్పక్సదు మరియు షేము మధ్య కయినామును చేర్చడం
  choice: SBLGNT గ్రీకు పాఠ్యంలో Καϊνὰμ ఉన్నందున ప్రధాన పాఠ్యంలో కయినామును ఉంచాం.
  alternative: కొన్ని పాఠ్య లేదా సమన్వయ సంప్రదాయాలు కొన్ని పాత నిబంధన వంశావళి రూపాలకు దగ్గర చేయడానికి కయినామును విడిచిపెడతాయి.
  rationale: అనువాదం లూకా 3:36లో ఇచ్చిన గ్రీకు పాఠ్యాన్ని అనుసరించాలి; ఆదికాండంలోని కొన్ని రూపాలకు సరిపెట్టేందుకు పాఠ్యాన్ని మౌనంగా మార్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన వంశావళి శైలిని వాడాం. మూలంలోని సంక్షిప్త నామావళిని నిలుపుతూ, సంబంధాన్ని ‘కుమారుడు’ అని స్పష్టం చేశాం. విరామచిహ్నం ఈ వచనం తరువాతి వంశావళితో కొనసాగుతుందని సూచిస్తుంది.
