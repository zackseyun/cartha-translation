  yaml_path: translation/nt/luke/003/010.yaml
  text: And the crowds were asking him[a], saying, “What then should we do?”
translation:
  language: te
  text: జనసమూహాలు ఆయనను, “అయితే, మేము ఏమి చేయాలి?” అని అడుగుతూనే ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτων
  choice: అడుగుతూనే ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పదేపదే జరిగిన ప్రశ్నను సూచిస్తుంది; ఈ తెలుగు ప్రయోగం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: οἱ ὄχλοι
  choice: జనసమూహాలు
  rationale: గ్రీకు పదం బహువచనంలో ఉన్నందున, సమకూడిన ప్రజల గుంపులను సూచించే బహువచన రూపాన్ని నిలిపింది.
- source_word: λέγοντες
  choice: అని
  rationale: తెలుగులో ప్రత్యక్ష ప్రశ్న విషయాన్ని సహజంగా పరిచయం చేయడానికి ‘అని’ సరిపోతుంది; ప్రత్యేకంగా ‘చెబుతూ’ అనడం అనవసరమైన భారాన్ని కలిగిస్తుంది.
- source_word: Τί οὖν
  choice: అయితే మేమేమి
  rationale: οὖν ముందు చెప్పబడిన బోధననుంచి వచ్చే ఆచరణాత్మక నిర్ధారణను సూచిస్తుంది; ‘అయితే’ ఆ తార్కిక సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: ποιήσωμεν
  choice: చేయాలి
  rationale: ఇది ఆలోచనాత్మక ప్రశ్నలోని ఆరిస్ట్ సబ్జంక్టివ్; ‘మేమేమి చేయాలి?’ ప్రాయోగిక మార్గదర్శకత్వం కోరే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. గ్రీకు మూలంలోని బహువచన ‘జనసమూహాలు’ను, అసంపూర్ణ భూతకాలంలోని పునరావృత/కొనసాగింపు భావాన్ని నిలిపింది.
