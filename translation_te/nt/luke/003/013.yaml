  text: And he said to them[a], “Collect no more than what has been ordered for you.”
translation:
  language: te
  text: ఆయన వారితో ఇలా అన్నాడు, “మీకు నిర్దేశించినదానికంటే ఎక్కువ వసూలు చేయవద్దు.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత రూపానుసారంగా: “మీకు నిర్దేశించినదానికంటే ఎక్కువగా ఏమీ చేయవద్దు.” సందర్భంలో ఈ క్రియ వారి సుంకం వసూలు చేసే పనినే సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: అప్పుడు ఆయన
  rationale: δέ స్వల్ప కథన అనుసంధాన పదం. ఇక్కడ స్పష్టమైన వ్యతిరేకతను సూచించకుండా సంభాషణ కొనసాగింపును సహజంగా తెలియజేయడానికి ‘అప్పుడు’ ఎంచుకున్నాం.
- source_word: εἶπεν πρὸς αὐτούς
  choice: వారితో ... అని చెప్పాడు
  rationale: λέγω + πρός నిర్మాణానికి ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన రూపం.
- source_word: Μηδὲν πλέον
  choice: ఎక్కువగా ... చేయవద్దు
  rationale: ఈ పదబంధం అనుమతించిన పరిమితిని మించకూడదనే నిషేధాన్ని వ్యక్తం చేస్తుంది.
- source_word: παρὰ τὸ διατεταγμένον ὑμῖν
  choice: మీకు నిర్ణయించినదానికంటే
  rationale: διατεταγμένον అధికారికంగా నిర్ణయించబడిన లేదా నిర్దేశించబడిన మొత్తాన్ని సూచిస్తుంది; గ్రీకు వాక్యంలోని కర్మణి భావాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: πράσσετε
  choice: వసూలు చేయవద్దు
  rationale: πράσσω సాధారణంగా ‘చేయు’ అని అర్థమైనా, ముందరి వచనంలో సుంకం వసూలు చేసేవారిని ఉద్దేశించినందున ఇక్కడ వారి వసూలు కార్యాన్ని సూచిస్తుంది. ‘వసూలు చేయవద్దు’ సందర్భార్థాన్ని సహజంగా స్పష్టం చేస్తుంది.
theological_decisions:
- issue: πράσσετεలో అంతర్లీనంగా ఉన్న కార్యాన్ని సందర్భానుసారంగా స్పష్టం చేయడం
  choice: వసూలు చేయవద్దు
  alternative: చేయవద్దు
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కాదు. వెంటనే ముందున్న సందర్భంలో సుంకం వసూలు చేసేవారితో మాట్లాడుతున్నందున, అంతర్లీన కార్యాన్ని తెలుగులో స్పష్టం చేయడం సహజంగా ఉంటుంది; అయినప్పటికీ మరింత రూపానుసారమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో అనువదించాం. అధికారిక పరిమితిని మించి వసూలు చేయకూడదనే భావాన్ని స్పష్టంగా ఉంచాం.
