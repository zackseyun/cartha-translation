  yaml_path: translation/nt/luke/003/025.yaml
  text: the son of Mattathias, the son of Amos, the son of Nahum, the son of Esli, the son of Naggai,
translation:
  language: te
  text: మత్తతీయ కుమారుడు, ఆమోసు కుమారుడు, నహూము కుమారుడు, ఎస్లీ కుమారుడు, నగ్గయి కుమారుడు,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: కుమారుడు
  rationale: లూకా వంశావళిలో పునరావృతమయ్యే షష్ఠీ విభక్తి సూచక పదం, పరిసర వాక్యంలోని వంశసంబంధ సూత్రం ప్రకారం ‘కుమారుడు’ అనే భావాన్ని సూచిస్తుంది. తెలుగులో సంబంధాన్ని సహజంగా, స్పష్టంగా తెలియజేయడానికి ప్రతి పేరుతో ‘కుమారుడు’ అని ఇచ్చాం.
- source_word: Ματταθίου
  choice: మత్తతీయ
  rationale: వ్యక్తి పేరును అనువదించకుండా గ్రీకు రూపానికి సమీపంగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: Ἀμὼς
  choice: ఆమోసు
  rationale: ఇది వంశావళిలోని వ్యక్తి పేరు; తెలుగులో సుపరిచితమైన బైబిలు నామరూపాన్ని ఉపయోగించాం.
- source_word: Ναοὺμ
  choice: నాహూము
  rationale: వ్యక్తి పేరును తెలుగులో సుపరిచితమైన బైబిలు నామరూపంలో ఇచ్చాం.
- source_word: Ἑσλὶ
  choice: ఎస్లీ
  rationale: గ్రీకు వ్యక్తి పేరును దాని ధ్వనికి సమీపంగా తెలుగులో లిప్యంతరీకరించాం; గ్రీకు పాఠంలో లేని ఆరంభ ‘హ’ ధ్వనిని చేర్చలేదు.
- source_word: Ναγγαὶ
  choice: నగ్గయి
  rationale: గ్రీకు వ్యక్తి పేరును దాని ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితా లయను నిలుపుతూ సంక్షిప్తంగా రూపొందించబడింది. మూలంలోని షష్ఠీ సంబంధాన్ని తెలుగులో సహజమైన ‘కుమారుడు’తో వ్యక్తం చేశాం.
