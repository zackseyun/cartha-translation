- from: సుంకం వసూలు చేసేవారు కూడా బాప్తిస్మం పొందడానికి వచ్చి, “బోధకుడా, మేము ఏమి చేయాలి?” అని ఆయనను అడిగారు.
  to: 'సుంకం వసూలు చేసేవారు కూడా బాప్తిస్మం పొందడానికి వచ్చి, ఆయనతో ఇలా అన్నారు: “బోధకుడా, మేము ఏమి చేయాలి?”'
