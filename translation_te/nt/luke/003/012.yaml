  verdict: revise
  source_fidelity: The draft accurately renders the tax collectors, their purpose in coming, the address “Teacher,” and the deliberative question. However, εἶπαν πρὸς αὐτόν is specifically “they said to him,” whereas “ఆయనను అడిగారు” shifts the reporting verb to “asked him.” Although idiomatic with a question in Telugu, the source and English audit trail retain the broader verb “said.”
  naturalness: The wording is clear modern standard Telugu. “సుంకం వసూలు చేసేవారు” is accessible, and “బాప్తిస్మం పొందడానికి” naturally conveys the passive purpose infinitive. Recasting the speech introduction as “ఆయనతో ఇలా అన్నారు” remains natural while more closely reflecting the Greek.
  terminology: “సుంకం వసూలు చేసేవారు” suitably renders τελῶναι without importing evaluation. “బాప్తిస్మం,” “బోధకుడా,” and “మేము ఏమి చేయాలి?” are appropriate, clear equivalents. “కూడా” preserves the additive/emphatic force of καί adequately.
  issues:
  - severity: low
    issue: The draft uses “ఆయనను అడిగారు” for εἶπαν πρὸς αὐτόν.
    rationale: The Greek verb is εἶπαν (“they said”), not a verb specifically meaning “asked.” Since the English audit trail deliberately preserves this distinction, Telugu should likewise use a neutral speech verb while retaining the question in direct discourse.
  revised_text: 'సుంకం వసూలు చేసేవారు కూడా బాప్తిస్మం పొందడానికి వచ్చి, ఆయనతో ఇలా అన్నారు: “బోధకుడా, మేము ఏమి చేయాలి?”'
