id: LUK.3.12
reference: Luke 3:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἦλθον δὲ καὶ τελῶναι βαπτισθῆναι καὶ εἶπαν πρὸς αὐτόν· Διδάσκαλε, τί ⸀ποιήσωμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/012.yaml
  text: Even tax collectors came to be baptized[a], and they said to him, “Teacher, what should we do?”
translation:
  language: te
  text: 'సుంకం వసూలు చేసేవారు కూడా బాప్తిస్మం పొందడానికి వచ్చి, ఆయనతో ఇలా అన్నారు: “బోధకుడా, మేము ఏమి చేయాలి?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθον
  choice: వచ్చి
  rationale: ἔρχομαι యొక్క భూతకాల క్రియను సందర్భానుసారంగా సహజమైన తెలుగు అనుసంధాన క్రియారూపంలో ఇచ్చాం.
- source_word: δὲ καὶ τελῶναι
  choice: సుంకం వసూలు చేసేవారు కూడా
  rationale: δέ యొక్క కథన పురోగతిని, καί యొక్క చేర్పు భావాన్ని ‘కూడా’తో నిలిపాం; ‘సుంకం వసూలు చేసేవారు’ సాధారణ పాఠకులకు τελῶναι యొక్క చారిత్రక పాత్రను స్పష్టంగా తెలియజేస్తుంది.
- source_word: βαπτισθῆναι
  choice: బాప్తిస్మం పొందడానికి
  rationale: కర్మణి అనంతక్రియను, రావడానికి గల ఉద్దేశాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἶπαν πρὸς αὐτόν
  choice: అని ఆయనను అడిగారు
  rationale: మూల క్రియ అక్షరార్థంగా ‘ఆయనతో అన్నారు’; అయితే పలికిన మాట ప్రశ్న కావడంతో తెలుగులో ‘అడిగారు’ సహజంగా ఉంటుంది, సంభాషణ భావాన్ని మార్చదు.
- source_word: Διδάσκαλε
  choice: బోధకుడా
  rationale: διδάσκαλος‌ను గౌరవప్రదమైన, ఆధునిక తెలుగు సంబోధనగా అనువదించాం; ‘రబ్బీ’ అనే లిప్యంతరీకరణను నివారించాం.
- source_word: τί ποιήσωμεν
  choice: మేము ఏమి చేయాలి?
  rationale: చర్చాత్మక aorist subjunctive సూచించే తగిన కార్యం గురించిన ప్రశ్నను సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యోహాను పశ్చాత్తాప పిలుపుకు స్పందించిన సామాజికంగా అపఖ్యాతి పొందిన వర్గం
  choice: τελῶναι‌ను ‘సుంకం వసూలు చేసేవారు’గా స్పష్టంగా అనువదించి, వారి చేర్పుకు ఉన్న ఉద్ఘాటనను ‘కూడా’తో నిలిపాం.
  alternative: ‘సుంకం వసూలు చేసేవారు సైతం’ అని మరింత ఆశ్చర్యార్థకంగా అనువదించడం.
  rationale: గ్రీకులోని καί చేర్పు లేదా ఉద్ఘాటన రెండింటినీ సూచించగలదు. ‘కూడా’ ఆ భావాన్ని నిలుపుతూ, వారి నైతిక స్థితిపై అనువాదం అదనపు తీర్పు విధించకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడాం. మూలంలోని καί భావాన్ని ‘కూడా’తో నేరుగా నిలిపినందున ప్రత్యామ్నాయ పాదటిప్పణి అవసరం లేదు.
