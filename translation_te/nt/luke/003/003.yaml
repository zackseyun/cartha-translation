    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν εἰς πᾶσαν περίχωρον τοῦ Ἰορδάνου
  choice: యొర్దాను చుట్టుపక్కల ప్రాంతమంతటా వెళ్లి
  rationale: εἰς తో కూడిన ἦλθεν ఇక్కడ ఆ ప్రాంతంలోకి వెళ్లి దానంతటా సంచరించిన భావాన్ని ఇస్తుంది. సహజమైన తెలుగు కథనంలో ‘వెళ్లి’ దిశను అతిగా నిర్దేశించకుండా సందర్భానికి సరిపోతుంది; πᾶσαν మరియు περίχωρον భావాలు ‘చుట్టుపక్కల ప్రాంతమంతటా’లో నిలిచాయి.
- source_word: κηρύσσων
  choice: ప్రకటిస్తూ ఉన్నాడు
  rationale: ఈ పదం బహిరంగంగా సందేశాన్ని చాటడాన్ని సూచిస్తుంది. ‘ప్రకటిస్తూ’ ఆధునిక తెలుగులో సహజంగా ఉండి, కేవలం సంఘ ప్రసంగం అనే పరిమిత భావాన్ని రానివ్వదు.
- source_word: βάπτισμα
  choice: బాప్తిస్మం
  rationale: ఆచారసంబంధమైన ముంచుట లేదా కడుగుటను సూచించే ఈ నామవాచకానికి తెలుగులో విస్తృతంగా గుర్తించబడిన ప్రమాణ పదం ‘బాప్తిస్మం’.
- source_word: μετανοίας
  choice: పశ్చాత్తాపానికి సంబంధించిన
  rationale: జనిటివ్ సంబంధాన్ని కారణం, ఫలితం లేదా సాధనం అని ఖచ్చితంగా తీర్మానించకుండా, బాప్తిస్మానికి పశ్చాత్తాపంతో ఉన్న సన్నిహిత సంబంధాన్ని నిలుపుతుంది.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: పాపక్షమాపణ కోసం
  rationale: ἄφεσις ఇక్కడ పాపాల క్షమాపణ లేదా విడుదలను సూచిస్తుంది. ‘కోసం’ εἰς యొక్క లక్ష్యసంబంధ భావాన్ని సహజంగా తెలియజేస్తూనే, బాప్తిస్మం క్షమాపణకు ఏ విధంగా సంబంధించినదో అదనంగా నిర్ణయించదు.
theological_decisions:
- issue: బాప్తిస్మం, పశ్చాత్తాపం, పాపక్షమాపణల మధ్య సంబంధం
  choice: ‘పాపక్షమాపణ కోసం పశ్చాత్తాపానికి సంబంధించిన బాప్తిస్మం’ అని పారదర్శకంగా అనువదించడం
  alternative: ‘క్షమాపణకు నడిపించే పశ్చాత్తాపాన్ని సూచించే బాప్తిస్మం’ లేదా ‘క్షమాపణ పొందే సాధనమైన బాప్తిస్మం’
  rationale: βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν అనే నిర్మాణం వీటి సంబంధాన్ని తెలిపినా, అది సాధనమా, సంకేతమా, సాక్ష్యమా అని స్వయంగా స్పష్టంగా తీర్మానించదు. అందువల్ల ఆ ధార్మిక ఉద్వేగాన్ని అనువాదంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. ‘యొర్దాను’, ‘పశ్చాత్తాపం’, ‘పాపక్షమాపణ’, ‘బాప్తిస్మం’ వంటి స్థిరపడిన బైబిలు పదాలను ఉంచి, వాక్యనిర్మాణాన్ని సహజంగా తీర్చిదిద్దాం.
