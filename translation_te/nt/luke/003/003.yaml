- from: అతడు యొర్దాను చుట్టుపక్కల ప్రాంతమంతటా వెళ్లి[a], పాపక్షమాపణ కోసం పశ్చాత్తాపానికి సంబంధించిన బాప్తిస్మాన్ని ప్రకటిస్తూ ఉన్నాడు[b].
