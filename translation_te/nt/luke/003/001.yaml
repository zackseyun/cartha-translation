source:
  edition: SBLGNT
  text: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ τῆς ἡγεμονίας Τιβερίου Καίσαρος, ἡγεμονεύοντος Ποντίου Πιλάτου τῆς Ἰουδαίας, καὶ τετρααρχοῦντος τῆς Γαλιλαίας Ἡρῴδου, Φιλίππου δὲ τοῦ ἀδελφοῦ αὐτοῦ τετρααρχοῦντος τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας, καὶ Λυσανίου τῆς Ἀβιληνῆς τετρααρχοῦντος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/001.yaml
  text: In the fifteenth year of the reign of Tiberius Caesar[a], while Pontius Pilate was governing Judea, and Herod was tetrarch of Galilee, and Philip his brother was tetrarch of the region of Iturea and Trachonitis, and Lysanias was tetrarch of Abilene[b],
translation:
  language: te
  text: తిబెరియ కైసరు పాలనలో పదిహేనవ సంవత్సరంలో[a], పొంతి పిలాతు యూదయను పరిపాలిస్తున్నప్పుడు, హేరోదు గలిలయకు చతుర్థాధిపతిగా ఉండగా, అతని సహోదరుడైన ఫిలిప్పు ఇతూరయ మరియు త్రకొనీతు ప్రాంతానికి చతుర్థాధిపతిగా ఉండగా, లుసానియ అబిలేనేకు చతుర్థాధిపతిగా ఉండగా[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తిబెరియ కైసరు పాలనలో పదిహేనవ సంవత్సరం జరుగుతుండగా.”
    reason: కాలసూచక గ్రీకు నిర్మాణాన్ని తెలుగులో చెప్పగల ప్రత్యామ్నాయ విధానం.
  - marker: b
    text: “చతుర్థాధిపతి” అంటే రోమా అధికారం కింద ఒక ప్రాంతాన్ని పాలించే పాలకుడు.
    reason: మొదటి శతాబ్దపు రాజకీయ బిరుదుకు అవసరమైన సాంస్కృతిక వివరణ.
lexical_decisions:
- source_word: Ἐν ἔτει ... πεντεκαιδεκάτῳ
  choice: పాలనలో పదిహేనవ సంవత్సరంలో
  rationale: కాలాన్ని సూచించే దత్తి విభక్తి నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, లూకా ఇచ్చిన కాలక్రమ చట్రాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది బలమైన వ్యతిరేకతను కాక కథన పురోగతిని సూచిస్తుంది. తెలుగులో వాక్యారంభ నిర్మాణమే ఆ మార్పును సహజంగా తెలియజేస్తుంది; ‘ఇప్పుడు’ అని చేరిస్తే మూలంలో లేని స్పష్టమైన కాలసూచన కలగవచ్చు.
- source_word: ἡγεμονίας
  choice: పాలన
  rationale: చక్రవర్తి అధికార కాలాన్ని తెలుగులో సహజంగా సూచిస్తుంది; ‘రాజ్యం’ కంటే ఇది పాలనా భావాన్ని నేరుగా అందిస్తుంది.
- source_word: ἡγεμονεύοντος
  choice: పరిపాలిస్తున్నప్పుడు
  rationale: క్రియాత్మక వర్తమాన కృదంత భావాన్ని, ప్రధాన కాలసూచనతో సమకాలీన పరిస్థితిగా నిలుపుతుంది; దీనిని కేవలం అధికార బిరుదుగా మార్చదు.
- source_word: τετρααρχοῦντος
  choice: చతుర్థాధిపతిగా ... ఉన్నప్పుడు
  rationale: రోమా అధికారం కింద ఉన్న నిర్దిష్ట చారిత్రక పాలనా పదవిని సాధారణ ‘పాలకుడు’గా సరళీకరించకుండా కాపాడుతుంది.
- source_word: Φιλίππου ... τοῦ ἀδελφοῦ αὐτοῦ
  choice: అతని సహోదరుడు ఫిలిప్పు
  rationale: αὐτοῦ అనే సర్వనామం హేరోదును సూచిస్తుందని సహజంగా తెలియజేస్తూ, మూలంలోని సమానాధికార సంబంధాన్ని నిలుపుతుంది.
- source_word: τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας
  choice: ఇతూరయ మరియు త్రకోనీతు ప్రాంతానికి
  rationale: χώρας లోని భూభాగం లేదా ప్రాంతం అనే భావాన్ని వదలకుండా, ఆధునిక దేశరాజ్యాన్ని సూచించేలా కాకుండా అనువదిస్తుంది.
- source_word: τῆς Ἀβιληνῆς
  choice: అబిలేనేకు
  rationale: ఇది ఒక పాలనా ప్రాంతమని వాక్య నిర్మాణంలో సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: τετρααρχοῦντος అనే రాజకీయ బిరుదు అనువాదం
  choice: ‘చతుర్థాధిపతిగా’ అని నిర్దిష్ట బిరుదును నిలిపాం.
  alternative: ‘పాలకుడిగా’ లేదా ‘పరిపాలిస్తూ’
  rationale: ఇది ప్రధానంగా చారిత్రక అంశమే అయినప్పటికీ, మూలంలోని నిర్దిష్ట అధికార పదవిని సాధారణీకరించకుండా ఉంచడం పాఠ్య ఖచ్చితత్వాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. వ్యక్తి, ప్రాంత నామాలకు తెలుగు బైబిలు వాడుకకు అనుకూలమైన లిప్యంతరీకరణలు ఎంచుకున్నాం. వచనం తరువాతి వాక్యంతో కొనసాగుతున్నందున చివర కామాను నిలిపాం.
