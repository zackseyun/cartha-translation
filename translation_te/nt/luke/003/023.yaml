source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ⸀ἦν Ἰησοῦς ⸂ἀρχόμενος ὡσεὶ ἐτῶν τριάκοντα⸃, ὢν ⸂υἱός, ὡς ἐνομίζετο⸃, Ἰωσὴφ τοῦ Ἠλὶ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/023.yaml
  text: And Jesus himself[a], when he began, was about thirty years old, being the son (as was supposed) of Joseph[c][b], of Heli.
translation:
  language: te
  text: యేసు స్వయంగా, ప్రారంభించుచుండగా, దాదాపు ముప్పై సంవత్సరాల వయస్సులో ఉన్నాడు[a]. ఆయన యోసేపు కుమారుడై ఉన్నాడు—ప్రజలు అనుకున్నట్లుగా[b]—ఆ యోసేపు హేలీ కుమారుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆరంభంలో ఉండగా.’ గ్రీకులో ‘తన సేవను’ అని స్పష్టంగా లేదు; సందర్భం మాత్రం ఆయన ప్రజాసేవ ప్రారంభాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, ప్రజలు యేసును సాధారణంగా యోసేపు కుమారుడిగా భావించేవారు.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ αὐτὸς ἦν Ἰησοῦς
  choice: యేసు తాను
  rationale: αὐτός లోని ఉద్ఘాటనను ‘తాను’తో నిలుపుతూ, Καίని తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా అనువదించకుండా సహజంగా మలిచాం.
- source_word: ἀρχόμενος
  choice: ప్రారంభించినప్పుడు
  rationale: సందర్భం ప్రజాసేవ ప్రారంభాన్ని సూచించినా, మూలంలో ‘సేవ’ అనే నామవాచకం లేదు; అందువల్ల దానిని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: ὡσεὶ ἐτῶν τριάκοντα
  choice: దాదాపు ముప్పై ఏళ్లవాడు
  rationale: ὡσεὶ సూచించే సుమారు అర్థాన్ని ‘దాదాపు’ స్పష్టంగా నిలుపుతుంది.
- source_word: ὢν υἱός, ὡς ἐνομίζετο, Ἰωσὴφ
  choice: ప్రజలు అనుకున్న ప్రకారం ఆయన యోసేపు కుమారుడు
  rationale: ఈ పదబంధం యోసేపు పితృత్వాన్ని రచయిత నేరుగా జీవసంబంధమైన వాస్తవంగా ప్రకటించకుండా, ప్రజల సాధారణ అభిప్రాయంగా చూపుతుంది.
- source_word: τοῦ Ἠλὶ
  choice: యోసేపు హేలీ కుమారుడు
  rationale: గ్రీకు వంశావళిలోని సంక్షిప్త షష్ఠీ విభక్తి గొలుసును తెలుగులో అర్థస్పష్టత కోసం ‘కుమారుడు’ అని పూరించాం.
theological_decisions:
- issue: ‘ὡς ἐνομίζετο’ యేసు–యోసేపు సంబంధాన్ని ఎలా నిర్దేశిస్తుంది
  choice: ‘ప్రజలు అనుకున్న ప్రకారం’ అని సామాజికంగా భావించబడిన కుమారత్వంగా చూపడం
  alternative: కేవలం ‘అనుకున్న ప్రకారం’ అని కర్తను పేర్కొనకుండా ఉంచడం
  rationale: లూకా కన్యాగర్భధారణ కథనంతో ఉన్న ఉద్దేశపూర్వక ఉద్రిక్తతను ఇది కాపాడుతుంది; యోసేపుతో సామాజిక/చట్టబద్ధ సంబంధాన్ని చూపుతూనే జీవసంబంధ పితృత్వాన్ని అదనంగా నిర్ధారించదు.
- issue: ‘ప్రారంభం’కు ‘ప్రజాసేవ’ను చేర్చాలా
  choice: ప్రధాన పాఠ్యంలో ‘సేవ’ను చేర్చకపోవడం
  alternative: ‘తన ప్రజాసేవను ప్రారంభించినప్పుడు’
  rationale: సందర్భార్థం ప్రజాసేవే అయినప్పటికీ, గ్రీకు మూలంలో ఆ నామవాచకం స్పష్టంగా లేదు; అసలైన అస్పష్టతను నిలిపాం.
- issue: హేలీతో సంబంధాన్ని తెలుగులో స్పష్టీకరించడం
  choice: ‘యోసేపు హేలీ కుమారుడు’
  alternative: ‘యోసేపు, హేలీకి చెందినవాడు’
  rationale: వంశావళి సందర్భంలో τοῦ Ἠλί సాధారణంగా ‘హేలీ కుమారుడు’ అనే అర్థాన్ని ఇస్తుంది; తెలుగు పాఠకుడికి సంబంధం స్పష్టంగా ఉండేలా చేశాం, అయితే ఇది యేసు జీవసంబంధ పితృత్వంపై అదనపు తీర్మానం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. మూలంలోని దీర్ఘ వాక్యాన్ని పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించాం; వంశావళి సంబంధాన్ని స్పష్టంగా తెలిపాం.
