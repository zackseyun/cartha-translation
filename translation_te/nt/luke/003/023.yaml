revisions:
- from: యేసు తాను ప్రారంభించినప్పుడు[a] దాదాపు ముప్పై ఏళ్లవాడు. ప్రజలు అనుకున్న ప్రకారం[b] ఆయన యోసేపు కుమారుడు; యోసేపు హేలీ కుమారుడు.
  to: యేసు స్వయంగా, ప్రారంభించుచుండగా, దాదాపు ముప్పై సంవత్సరాల వయస్సులో ఉన్నాడు[a]. ఆయన యోసేపు కుమారుడై ఉన్నాడు—ప్రజలు అనుకున్నట్లుగా[b]—ఆ యోసేపు హేలీ కుమారుడు.
  rationale: The revision replaces an unnatural Telugu construction with a participial expression that reflects ἀρχόμενος without supplying “ministry” or another object. It also keeps the parenthetical qualification adjacent to Josephian sonship and presents the following genealogical relation as a continuing lineage. No doctrinal conclusion beyond the wording of the verse is introduced.
