id: LUK.3.5
reference: Luke 3:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πᾶσα φάραγξ πληρωθήσεται καὶ πᾶν ὄρος καὶ βουνὸς ταπεινωθήσεται, καὶ ἔσται τὰ σκολιὰ εἰς ⸀εὐθείαν καὶ αἱ τραχεῖαι εἰς ὁδοὺς λείας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/005.yaml
  text: Every valley will be filled[a], and every mountain and hill will be made low, and the crooked places will become straight[b], and the rough ways smooth roads.
translation:
  language: te
  text: ప్రతి లోయ నింపబడుతుంది[a]; ప్రతి పర్వతమూ, ప్రతి కొండా తగ్గించబడతాయి. వంకరగా ఉన్నవి నేరుగా మారతాయి[b]; ఎగుడుదిగుడుగా ఉన్నవి సమతలమైన మార్గాలవుతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతి కనుమ నింపబడుతుంది ... వంకరగా ఉన్నవి నేరుగా మారతాయి, ఎగుడుదిగుడుగా ఉన్నవి సమతలమైన మార్గాలవుతాయి.”
    reason: lexical_alternative
  - marker: b
    text: ఈ వాక్యం యెషయా 40:4ను ప్రతిధ్వనింపజేస్తూ, ప్రభువు మార్గాన్ని సిద్ధం చేయడాన్ని రహదారి నిర్మాణ చిత్రణతో వివరిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσα φάραγξ
  choice: ప్రతి లోయ
  rationale: φάραγξ అంటే లోయ, కనుమ లేదా లోతైన గండి కావచ్చు. యెషయా 40:4లోని భూభాగాన్ని సమం చేసే చిత్రణకు సహజంగా సరిపోతూ, ఆధునిక తెలుగు పాఠకులకు సులభంగా అర్థమయ్యే పదం ‘లోయ’.
- source_word: πληρωθήσεται
  choice: పూడ్చబడుతుంది
  rationale: ఇది πληρόω యొక్క భవిష్యత్ కర్మణి రూపం. భూమిలోని పల్లాన్ని మట్టితో నింపి సమం చేసే సందర్భంలో ‘పూడ్చబడుతుంది’ సహజమైన తెలుగు ప్రయోగం.
- source_word: πᾶν ὄρος καὶ βουνός
  choice: ప్రతి పర్వతం, ప్రతి కొండ
  rationale: ὄρος, βουνός సమీపార్థక పదాలైనా పెద్ద పర్వతం, చిన్న కొండ అనే భేదాన్ని సూచించగలవు. మూలంలోని రెండు పదాలనూ, πᾶν యొక్క విస్తృత భావాన్నీ నిలుపుతుంది.
- source_word: ταπεινωθήσεται
  choice: తగ్గించబడతాయి
  rationale: ఈ భౌగోళిక సందర్భంలో ఎత్తైన నేలను కిందికి తగ్గించడమే భావం. ‘తగ్గించబడతాయి’ భౌతిక చిత్రణను కాపాడుతుంది; ‘దీనపరచబడతాయి’ అనే నైతిక అర్థాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: τὰ σκολιά
  choice: వంకరగా ఉన్నవి
  rationale: నపుంసక బహువచన విశేషణం నామవాచకంగా వాడబడింది. గ్రీకు స్పష్టంగా ‘దారులు’ అని చెప్పని చోట దాన్ని చేర్చకుండా మూలంలోని స్వల్ప అస్పష్టతను నిలుపుతుంది.
- source_word: εἰς εὐθείαν
  choice: నేరుగా చేయబడతాయి
  rationale: వంకరగా ఉన్నవి నేరుగా మారే ఫలితాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది. రహదారి సిద్ధపరిచే చిత్రణ కూడా స్పష్టంగా ఉంటుంది.
- source_word: αἱ τραχεῖαι
  choice: ఎగుడుదిగుడుగా ఉన్న దారులు
  rationale: స్త్రీలింగ బహువచన విశేషణం ఇక్కడ అంతర్లీనంగా దారులను సూచిస్తుంది; వెంటనే వచ్చే ὁδοὺς దానిని బలపరుస్తుంది. τραχύς యొక్క అసమమైన, గరుకైన నేల భావాన్ని ‘ఎగుడుదిగుడుగా’ సహజంగా తెలియజేస్తుంది.
- source_word: εἰς ὁδοὺς λείας
  choice: నునుపైన రహదారులవుతాయి
  rationale: ὁδούς స్పష్టంగా రహదారులు/దారులు అని, λείας నునుపైన లేదా సమతలమైనవి అని సూచిస్తుంది. ‘నునుపైన రహదారులు’ మార్గాన్ని సిద్ధం చేసే దృశ్యాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: లూకా ఉటంకించిన యెషయా 40:4లోని ప్రవచనాత్మక భూభాగ-రహదారి చిత్రణ
  choice: భూభాగాన్ని సమం చేసి ప్రభువు మార్గాన్ని సిద్ధం చేసే స్థూల చిత్రణను అలాగే నిలుపడం
  alternative: ‘వినయస్థులు హెచ్చించబడతారు, గర్విష్ఠులు తగ్గించబడతారు’ వంటి నైతిక లేదా ఆధ్యాత్మిక భావానువాదం
  rationale: ఈ చిత్రణకు ఆధ్యాత్మిక అంతరార్థాలు ఉండవచ్చు; అయినా లూకా ఇక్కడ స్థూలమైన భూభాగ, రహదారి పదాలతో యెషయాను ఉటంకిస్తున్నాడు. వాటిని నిలుపడం కవితాత్మక బలాన్ని కాపాడి, ఒక నిర్దిష్ట వ్యాఖ్యానాన్ని అనువాదంలోకి చొప్పించకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే ప్రవచన వాక్యానికి తగిన గంభీరతతో అనువదించబడింది. ‘వంకరగా ఉన్నవి’ అనే పదబంధం మూలంలోని నామవాచకంగా వాడిన విశేషణపు అస్పష్టతను కాపాడుతుంది; చివరి భాగంలో మాత్రమే మూలంలో స్పష్టంగా ఉన్న రహదారి భావాన్ని పేర్కొంది.
