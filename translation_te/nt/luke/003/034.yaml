  text: the son of Jacob[a], the son of Isaac, the son of Abraham, the son of Terah[c][b], the son of Nahor
translation:
  language: te
  text: యాకోబు కుమారుడు, ఇస్సాకు కుమారుడు, అబ్రాహాము కుమారుడు, తెరహు కుమారుడు, నాహోరు కుమారుడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: కుమారుడు
  rationale: లూకా వంశావళిలో ప్రతి పేరుతో పునరావృతమయ్యే సంబంధ విభక్తి రూపం, ముందు సందర్భంలో స్థాపించబడిన పితృపుత్ర సంబంధాన్ని సంక్షిప్తంగా కొనసాగిస్తుంది. తెలుగులో సహజంగా, స్పష్టంగా ఉండేందుకు ‘కుమారుడు’ అని ప్రతి పేరుతో సరఫరా చేయబడింది.
- source_word: Ἰακὼβ
  choice: యాకోబు
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన పితామహుని పేరు; గ్రీకు పేరుకు తగిన స్థిర రూపం.
- source_word: Ἰσαὰκ
  choice: ఇస్సాకు
  rationale: తెలుగు బైబిలు సంప్రదాయంలో విస్తృతంగా గుర్తించబడే పాత నిబంధన పేరు.
- source_word: Ἀβραὰμ
  choice: అబ్రాహాము
  rationale: అదే పితామహునికి తెలుగు పాఠకులకు సుపరిచితమైన స్థిర నామరూపం.
- source_word: Θάρα
  choice: తెరహు
  rationale: గ్రీకు రూపం ‘థారా’కు బదులుగా, అదే వ్యక్తిని సూచించే పాత నిబంధన హీబ్రూ పేరుతో అనుసంధానమయ్యే సుపరిచిత తెలుగు రూపం తీసుకోబడింది.
- source_word: Ναχὼρ
  choice: నాహోరు
  rationale: గ్రీకు ఉచ్చారణను యాంత్రికంగా అనుసరించే రూపానికి బదులుగా, అదే పాత నిబంధన వ్యక్తికి సుపరిచితమైన తెలుగు నామరూపం వాడబడింది.
theological_decisions:
- issue: సంక్షిప్త వంశావళిలో సూచితమైన పితృపుత్ర సంబంధాన్ని స్పష్టంగా చెప్పడం
  choice: ప్రతి సంబంధాన్ని ‘కుమారుడు’ అని వ్యక్తం చేయడం
  alternative: ప్రతి పేరును కేవలం సంబంధ విభక్తితో వరుసగా ఇవ్వడం
  rationale: గ్రీకులో τοῦ + పేరు అనే పునరావృత నిర్మాణం విస్తృత సందర్భంలోని వంశసంబంధాన్ని సూచిస్తుంది. తెలుగులో కేవలం పేర్ల సంబంధ రూపాల వరుస అసహజంగా లేదా అస్పష్టంగా ఉండవచ్చు; ‘కుమారుడు’ చేర్చడం కొత్త సిద్ధాంతార్థాన్ని జోడించకుండా వంశావళి భావాన్ని వెల్లడిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన వంశావళి శైలి. మూలంలో లేని పాదటిప్పణి గుర్తులు చేర్చలేదు; పేర్లకు తెలుగు బైబిలు వాడుకలో సుపరిచిత రూపాలు ఎంచుకోబడ్డాయి.
