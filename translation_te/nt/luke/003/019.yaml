source:
  edition: SBLGNT
  text: ὁ δὲ Ἡρῴδης ὁ τετραάρχης, ἐλεγχόμενος ὑπ’ αὐτοῦ περὶ Ἡρῳδιάδος τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν ὁ Ἡρῴδης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/019.yaml
  text: But Herod the tetrarch[a], being rebuked by him concerning Herodias, his brother’s wife, and concerning all the evil things Herod had done,
translation:
  language: te
  text: అయితే ప్రాంతాధిపతియైన తేత్రార్కు హేరోదు, తన సోదరుని భార్యయైన హేరోదియా విషయమైను, హేరోదు చేసిన చెడు పనులన్నిటి విషయమైను అతనిచేత గద్దించబడుతూ[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మందలించబడుతూ,’ లేదా ‘తప్పులను బయటపెట్టబడుతూ.’ గ్రీకు కృదంతం నైతికంగా గద్దించడం లేదా తప్పును బహిర్గతం చేయడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τετραάρχης
  choice: చతుర్థాధిపతి
  rationale: హేరోదు నిర్వహించిన నిర్దిష్ట చారిత్రక-రాజకీయ పదవిని సాధారణమైన ‘పాలకుడు’గా మార్చకుండా నిలుపుతుంది.
- source_word: ἐλεγχόμενος
  choice: గద్దించబడుతూ
  rationale: కొనసాగుతున్న లేదా సమకాలీన చర్యను సూచించే కృదంత రూపాన్నీ, హేరోదు దుష్కార్యాలపై ఉన్న నైతిక మందలింపు భావాన్నీ నిలుపుతుంది.
- source_word: ὑπ’ αὐτοῦ
  choice: అతనిచేత
  rationale: సందర్భంలో ఇది బాప్తిస్మమిచ్చే యోహానును సూచించినా, మూలపాఠంలోని సర్వనామ రూపాన్ని ప్రధాన వాక్యంలో అలాగే ఉంచుతుంది.
- source_word: περὶ Ἡρῳδιάδος
  choice: హేరోదియా విషయంలోనూ
  rationale: περὶ అనే సంబంధ సూచనను తరువాతి సమాంతర పదబంధంతో సహా సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ
  choice: తన సోదరుని భార్య
  rationale: ఆరోపణకు కేంద్రంగా ఉన్న బంధ సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν ὁ Ἡρῴδης
  choice: హేరోదు చేసిన చెడు పనులన్నిటి విషయంలోనూ
  rationale: హేరోదు చేసిన దుష్కార్యాల సమగ్రతను, περὶ పదబంధాల సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: πονηρῶν
  choice: చెడు పనులు
  rationale: నైతిక దుష్టత్వాన్ని సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా తెలియజేసే సహజమైన పదబంధం.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి కథనంతో ఉన్న వ్యత్యాసాన్ని సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: హేరోదుపై యోహాను చేసిన విమర్శలోని నైతిక బలం
  choice: ‘గద్దించబడుతూ’ అని అనువదించడం
  alternative: ‘మందలించబడుతూ’ లేదా ‘అతని తప్పు బయటపెట్టబడుతూ’
  rationale: ఈ పదం హేరోదు ప్రవర్తనపై ప్రవక్తసదృశమైన నైతిక నిరసనను వ్యక్తపరుస్తుంది; దానిని న్యాయపరమైన ఆరోపణగా గానీ, అదనపు సిద్ధాంత వ్యాఖ్యగా గానీ విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘చతుర్థాధిపతి’ అనే చారిత్రక పదవిపేరును నిలిపి, వాక్యం తదుపరి వచనంలో కొనసాగుతుందనే మూల నిర్మాణాన్ని చివరి కామాతో సూచించాం.
