  text: the son of Matthat[a], the son of Levi, the son of Melchi, the son of Jannai, the son of Joseph,
translation:
  language: te
  text: మత్తతు కుమారుడు[a], లేవి కుమారుడు, మెల్కీ కుమారుడు, యన్నయి కుమారుడు, యోసేపు కుమారుడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత రూపానుగుణంగా: ‘మత్తతుకు చెందినవాడు, లేవికి చెందినవాడు, మెల్కీకి చెందినవాడు, యన్నయికి చెందినవాడు, యోసేపుకు చెందినవాడు.’ గ్రీకులో ప్రతి పేరుతో షష్ఠీ విభక్తి రూపం పునరావృతమవుతుంది; చుట్టుపక్కల సందర్భం నుంచి ‘కుమారుడు’ అనే భావం సూచితమవుతుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: కుమారుడు
  rationale: లూకా వంశావళిలో ప్రతి పేరుతో పునరావృతమయ్యే షష్ఠీ విభక్తి ఆర్టికల్, మునుపటి సందర్భం నుంచి ‘కుమారుడు’ అనే సంబంధాన్ని సూచిస్తుంది. తెలుగులో ఆ సంబంధాన్ని స్పష్టంగా చెప్పడం సహజంగా, అర్థవంతంగా ఉంటుంది.
- source_word: Μαθθὰτ
  choice: మత్తతు
  rationale: గ్రీకు వ్యక్తినామాన్ని ఆధునిక తెలుగు బైబిలు శైలికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: Λευὶ
  choice: లేవి
  rationale: ఈ సుపరిచిత వ్యక్తినామానికి ప్రాచుర్యంలో ఉన్న తెలుగు రూపాన్ని వాడాం.
- source_word: Μελχὶ
  choice: మెల్కీ
  rationale: గ్రీకు Μελχί ధ్వనిని దగ్గరగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: Ἰανναὶ
  choice: యన్నయి
  rationale: గ్రీకు Ἰανναί రూపంలోని అంత్య ద్విస్వరాన్ని నిలుపుతూ తెలుగులో సహజంగా పలికేలా లిప్యంతరీకరించాం.
- source_word: Ἰωσὴφ
  choice: యోసేపు
  rationale: ఈ సుపరిచిత వ్యక్తినామానికి ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో సాధారణమైన రూపాన్ని ఎంచుకున్నాం.
theological_decisions:
- issue: వంశావళిలో అధ్యాహారంగా ఉన్న సంబంధం
  choice: ప్రతి పేరుకు ముందు సందర్భం సూచించే ‘కుమారుడు’ సంబంధాన్ని స్పష్టంగా అందించడం
  alternative: ‘మత్తతుకు చెందినవాడు, లేవికి చెందినవాడు...’ అన్నట్లుగా గ్రీకు షష్ఠీ విభక్తి వరుసను మరింత రూపానుగుణంగా ఉంచడం
  rationale: గ్రీకులో ఈ వచనం చుట్టుపక్కల వంశావళి నిర్మాణంపై ఆధారపడిన సంక్షిప్త వరుస. ‘కుమారుడు’ అని అందించడం మూలంలో సూచితమైన వంశ సంబంధాన్నే తెలుగులో స్పష్టం చేస్తుంది; కొత్త భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి పఠనానికి అనువైన సంక్షిప్తమైన గంభీర శైలి. పేర్లు అనువదించకుండా లిప్యంతరీకరించబడ్డాయి; గ్రీకులో అధ్యాహారంగా ఉన్న బంధాన్ని తెలుగులో స్పష్టంగా తెలిపాం.
