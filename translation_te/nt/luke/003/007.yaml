    reason: ὑποδείκνυμι యొక్క “చూపించు/సూచించు” భావాన్నీ, φυγεῖν కు సందర్భానుగుణమైన “తప్పించుకొను” ప్రత్యామ్నాయాన్నీ సూచిస్తుంది.
