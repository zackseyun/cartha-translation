id: LUK.3.7
reference: Luke 3:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔλεγεν οὖν τοῖς ἐκπορευομένοις ὄχλοις βαπτισθῆναι ὑπ’ αὐτοῦ· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/007.yaml
  text: So he was saying to the crowds coming out to be baptized by him[a], “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: te
  text: 'అతనిచేత బాప్తిస్మం పొందడానికి బయటకు వస్తున్న జనసమూహాలకు అతడు ఇలా చెబుతుండేవాడు: “విషసర్పాల సంతానమా![a] రాబోయే కోపం నుండి పారిపోవాలని మిమ్మల్ని హెచ్చరించినవాడెవడు?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సర్పసంతానమా!”
    reason: γέννημα యొక్క “సంతానం” అనే భావాన్ని ఉంచుతూ, ἐχίδναι యొక్క మరింత సాధారణ పదప్రయోగాన్ని చూపించే ప్రత్యామ్నాయం.
  - marker: b
    text: లేదా “రానున్న కోపం నుండి తప్పించుకోవాలని మీకు చూపించినవాడెవడు?”
    reason: ὑποδείκνυμι యొక్క “చూపించు/సూచించు” భావాన్నీ, φυγεῖν కు సందర్భానుగుణమైన “తప్పించుకొను” ప్రత్యామ్నాయాన్నీ సూచిస్తుంది.
lexical_decisions:
- source_word: Ἔλεγεν
  choice: చెబుతూ ఉండేవాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న లేదా పునరావృతమైన మాటలను సూచించగలదు; ఈ రూపం ఆ కాలాంశాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందున్న సందర్భం నుంచి వచ్చే కథనాత్మక, తార్కిక కొనసాగింపును సూచిస్తుంది.
- source_word: τοῖς ἐκπορευομένοις ὄχλοις
  choice: బయటకు వస్తున్న జనసమూహాలతో
  rationale: కృదంతం జనసమూహాలను విశేషిస్తూ, వారు యోహాను వద్దకు బయలుదేరి వస్తున్న దృశ్యాన్ని తెలియజేస్తుంది.
- source_word: βαπτισθῆναι ὑπ’ αὐτοῦ
  choice: తన చేత బాప్తిస్మం పొందడానికి
  rationale: కర్మణి భావాన్నీ ఉద్దేశాన్నీ నిలుపుతూ, αὐτοῦను పేరుతో భర్తీ చేయకుండా సర్వనామ భావాన్ని కాపాడుతుంది.
- source_word: Γεννήματα ἐχιδνῶν
  choice: సర్పసంతానమా
  rationale: γέννημα యొక్క పుట్టినది లేదా సంతానం అనే భావాన్ని సహజమైన తెలుగు సంబోధనలో నిలుపుతుంది; ἔχιδνα విషసర్పాన్ని సూచించినా, సాధారణ పాఠకునికి సహజంగా ఉండేందుకు ‘సర్ప’ వాడబడింది.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: మీకు హెచ్చరించినవాడెవడు?
  rationale: రాబోయే ప్రమాదం సందర్భంలో ὑποδείκνυμι కేవలం చూపించడం కంటే హెచ్చరించడం అనే భావాన్ని ఇస్తుంది.
- source_word: φυγεῖν
  choice: పారిపోవాలని
  rationale: ప్రమాదం నుంచి పరుగెత్తి తప్పించుకునే సజీవ రూపకాన్ని నిలుపుతుంది.
- source_word: ἀπὸ τῆς μελλούσης ὀργῆς
  choice: రాబోయే ఉగ్రత నుండి
  rationale: μέλλουσα రానున్నదాన్ని సూచిస్తుంది; ὀργή యొక్క తీవ్ర కోపం లేదా తీర్పు భావాన్ని ‘ఉగ్రత’ విస్తృతంగా నిలుపుతుంది.
theological_decisions:
- issue: ὀργή యొక్క స్వభావం
  choice: రాబోయే ఉగ్రత
  alternative: రాబోయే దైవిక తీర్పు
  rationale: సందర్భం దేవుని తీర్పును సూచించినప్పటికీ, మూలపాఠం ‘తీర్పు’ అనే పదాన్ని నేరుగా ఉపయోగించదు. అందువల్ల నిర్దిష్ట అంత్యకాల సిద్ధాంతాన్ని చేర్చకుండా విస్తృత పదాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన ప్రవచన ధోరణి ఉంచబడింది. ‘బాప్తిస్మం’ విస్తృతంగా గుర్తించబడే బైబిలు పదంగా ఉంచబడింది; సంబోధనలోని కఠినత తగ్గించబడలేదు.
