  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπηρώτων δὲ αὐτὸν καὶ στρατευόμενοι λέγοντες· ⸂Τί ποιήσωμεν καὶ ἡμεῖς⸃; καὶ εἶπεν ⸀αὐτοῖς· Μηδένα διασείσητε μηδὲ συκοφαντήσητε, καὶ ἀρκεῖσθε τοῖς ὀψωνίοις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/014.yaml
  text: And soldiers also were asking him[a], saying, “What should we also do?” And he said to them, “Do not extort money from anyone, nor accuse anyone falsely[c][b], and be content with your wages.”
translation:
  language: te
  text: 'సైనికులు కూడా ఆయనను, “మరి మేమూ ఏమి చేయాలి?” అని అడుగుతూ ఉన్నారు.[a] ఆయన వారితో ఇలా అన్నాడు: “ఎవరి దగ్గర నుంచీ బలవంతంగా డబ్బు గుంజవద్దు[b]; ఎవరిపైనా తప్పుడు ఆరోపణ చేయవద్దు; మీ జీతంతో తృప్తిపడండి.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మూల గ్రీకులో ‘మేము కూడా’ అనే మాటకు ప్రత్యేక ఉద్ఘాటన ఉంది; భావం: “మేము కూడా ఏమి చేయాలి?”'
    reason: lexical_alternative
  - marker: b
    text: “బలవంతంగా డబ్బు గుంజడం” అనే క్రియకు అక్షరార్థంగా ఎవరినైనా కుదిపివేయడం లేదా బెదిరించడం అనే ఛాయ ఉంది; ఇక్కడ లాభం కోసం బలప్రయోగం లేదా అధికార దుర్వినియోగం చేయడం భావం.
    reason: lexical_alternative
  - marker: c
    text: “జీతం” అనే పదాన్ని “భత్యం” లేదా “వేతనం” అని కూడా అనువదించవచ్చు; గ్రీకు పదం సైనికులకు ఇచ్చే జీతం లేదా సరఫరాల విషయంలో తరచుగా వాడబడేది.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατευόμενοι
  choice: సైనిక సేవలో ఉన్నవారు
  rationale: ఈ వర్తమాన కృదంతం సైనిక సేవ చేస్తున్నవారిని సూచిస్తుంది. ‘సైనికులు’ సహజమైన ప్రత్యామ్నాయం అయినా, మూలంలోని కృదంత భావాన్ని ఈ రూపం స్పష్టంగా నిలుపుతుంది.
- source_word: Τί ποιήσωμεν καὶ ἡμεῖς
  choice: మరి మేమేం చేయాలి?
  rationale: తెలుగులో ‘మరి’ మరియు ‘మేము’పై సహజంగా పడే ఉద్ఘాటన, ఇతర వర్గాలతోపాటు ‘మేము కూడా’ అనే καὶ ἡμεῖς భావాన్ని సునాయాసంగా తెలియజేస్తాయి.
- source_word: διασείσητε
  choice: బలవంతంగా డబ్బు గుంజవద్దు
  rationale: ఈ క్రియ అక్షరార్థంగా కుదిపివేయడం లేదా బెదిరించడం అనే భావం కలిగినప్పటికీ, ఇక్కడ అధికారాన్ని దుర్వినియోగం చేసి లాభం కోసం డబ్బు గుంజడాన్ని సూచిస్తుంది.
- source_word: συκοφαντήσητε
  choice: తప్పుడు నేరం మోపవద్దు
  rationale: ఇక్కడ అన్యాయంగా లేదా అబద్ధంగా ఆరోపించడం ప్రధాన భావం. ‘తప్పుడు నేరం మోపడం’ ఆధునిక తెలుగులో స్పష్టంగా, సందర్భోచితంగా ఉంటుంది; ‘బ్లాక్‌మెయిల్ చేయడం’ మూలభావాన్ని అవసరానికి మించి సంకుచితం చేస్తుంది.
- source_word: ἀρκεῖσθε
  choice: తృప్తిపడండి
  rationale: వర్తమాన ఆజ్ఞారూపం నిరంతరమైన సంతృప్తి వైఖరిని కోరుతుంది; ‘తృప్తిపడండి’ ఆ నైతిక బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὀψωνίοις
  choice: జీతం
  rationale: ఈ పదం సైనికులకు ఇచ్చే వేతనం లేదా సరఫరాలను సూచించేది; ఈ సందర్భంలో ఆధునిక పాఠకునికి ‘జీతం’ అత్యంత స్పష్టమైనది. ‘భత్యం’ కూడా సాధ్యమే.
theological_decisions:
- issue: సైనికులకు ఇచ్చిన నైతిక ఉపదేశం
  choice: యోహాను వారి సైనిక సేవను విడిచిపెట్టమని చెప్పకుండా, అధికార దుర్వినియోగం, తప్పుడు ఆరోపణ, దురాశలను నిషేధిస్తున్నట్లు పాఠ్యాన్ని నేరుగా అనువదించడం.
  alternative: ఈ వాక్యం సైనిక సేవనే పరోక్షంగా ఖండిస్తుందని అనువాదంలో సూచించడం.
  rationale: మూలపాఠం వారిని సైనిక సేవలో ఉన్నవారిగానే సంబోధించి నిర్దిష్టమైన నైతిక ఆజ్ఞలు ఇస్తుంది. అంతకుమించిన సిద్ధాంత నిర్ణయాన్ని అనువాదంలో చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘మరి మేమేం చేయాలి?’ సంభాషణలో సహజంగా ఉండి మూలంలోని ఉద్ఘాటనను నిలుపుతుంది. నిషేధాలు స్పష్టంగా, నేరుగా ఇవ్వబడ్డాయి.
