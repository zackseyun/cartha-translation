  language: en
  yaml_path: translation/nt/luke/003/029.yaml
  text: the son of Jeshua, the son of Eliezer, the son of Jorim, the son of Matthat, the son of Levi,
translation:
  language: te
  text: యెషూవా కుమారుడు, ఎలీయెజెరు కుమారుడు, యోరీము కుమారుడు, మత్తతు కుమారుడు, లేవి కుమారుడు;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦ
  choice: యేషూవ
  rationale: వంశావళిలోని ఈ వ్యక్తి పేరును యేసుక్రీస్తు పేరుతో గందరగోళం కాకుండా, మూలంలోని Ἰησοῦకు సాధ్యమైన సెమిటిక్ నామరూపాన్ని ప్రతిబింబించేలా లిప్యంతరీకరించాం.
- source_word: Ἐλιέζερ
  choice: ఎలీయెజెరు
  rationale: గ్రీకు నామరూపానికి దగ్గరగా ఉండే, తెలుగులో సహజంగా చదవగల లిప్యంతరీకరణ.
- source_word: Ἰωρὶμ
  choice: యోరీము
  rationale: గ్రీకు ఉచ్చారణను తెలుగులో స్పష్టంగా ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: Μαθθὰτ
  choice: మత్తతు
  rationale: ద్విత్వ వ్యంజనాన్ని నిలుపుతూ గ్రీకు నామరూపాన్ని తెలుగుకు అనుకూలంగా లిప్యంతరీకరించాం.
- source_word: Λευὶ
  choice: లేవి
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపం; గ్రీకు Λευίని సముచితంగా ప్రతిబింబిస్తుంది.
- source_word: τοῦ
  choice: కుమారుడు
  rationale: గ్రీకులో కేవలం సంబంధాన్ని సూచించే షష్ఠీ విభక్తి శ్రేణి ఉన్నా, లూకా 3 వంశావళి సందర్భంలో అంతర్లీనంగా ఉన్న ‘కుమారుడు’ అనే సంబంధాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి పఠనానికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. ఇది ముందూ వెనుకా కొనసాగే వంశావళి శ్రేణిలోని భాగమని సూచించేందుకు చివర సెమీకోలన్ ఉంచాం.
