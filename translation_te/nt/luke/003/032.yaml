  terminology: “కుమారుడు” suitably represents the genealogical filial relation in this context. The transliterations “యెష్షయి,” “యోబేలు,” “బోయజు,” and “సాలా” are acceptable for the supplied Greek forms; no doctrinal or cross-reference harmonization is introduced.
