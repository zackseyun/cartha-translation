id: LUK.3.32
reference: Luke 3:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦ Ἰεσσαὶ τοῦ Ἰωβὴλ τοῦ Βόος τοῦ ⸀Σαλὰ τοῦ Ναασσὼν
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/032.yaml
  text: the son of Jesse, the son of Jobed, the son of Boaz, the son of Sala, the son of Nahshon,
translation:
  language: te
  text: యెష్షయి కుమారుడు, యోబేలు కుమారుడు, బోయజు కుమారుడు, సాలా కుమారుడు, నాస్సోను కుమారుడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰεσσαί
  choice: యెష్షయి
  rationale: గ్రీకు పేరుకు దగ్గరగా ఉండే, తెలుగులో సులభంగా గుర్తించగల రూపం.
- source_word: Ἰωβήλ
  choice: యోబేలు
  rationale: ఇచ్చిన SBLGNT మూలపాఠంలోని పేరును నేరుగా లిప్యంతరీకరించింది; సంప్రదాయంగా పరిచితమైన ‘ఓబేదు’ రూపాన్ని మూలంలో లేని విధంగా ప్రతిస్థాపించలేదు.
- source_word: Βόος
  choice: బోయజు
  rationale: గ్రీకు రూపం సూచించే, తెలుగులో విస్తృతంగా గుర్తించబడే బోయజు పేరును ఉపయోగించింది.
- source_word: Σαλά
  choice: సాలా
  rationale: ఇచ్చిన గ్రీకు రూపాన్ని యథాతథంగా ప్రతిబింబించింది; ఇతర వంశావళుల్లోని ‘శల్మా/సల్మోను’ రూపంతో సమన్వయం చేయలేదు.
- source_word: Ναασσών
  choice: నయస్సోను
  rationale: గ్రీకు ఉచ్చారణకు సమీపంగా, సహజమైన తెలుగు లిప్యంతరీకరణను ఎంచుకుంది.
- source_word: τοῦ
  choice: కుమారుడు
  rationale: ఈ వంశావళి సందర్భంలో వరుస షష్ఠీ రూపాలు ‘ఫలానివాని కుమారుడు’ అనే సంబంధాన్ని సూచిస్తున్నాయి; తెలుగులో ప్రతి పేరుతో ఆ సంబంధాన్ని స్పష్టంగా తెలిపింది.
theological_decisions:
- issue: వంశావళి సంబంధ స్వభావం
  choice: కుమారుడు
  alternative: వంశస్థుడు
  rationale: లూకా 3:23లో ప్రారంభమైన ‘కుమారుడు’ అనే నిర్మాణాన్ని ఈ వరుస షష్ఠీ రూపాలు కొనసాగిస్తున్నాయి. ‘వంశస్థుడు’ అని విస్తరించడం సాధ్యమైనప్పటికీ, మూలంలోని సమీప సంబంధ భాషను నిలిపివేసింది.
- issue: ఇతర బైబిలు వంశావళులతో పేర్ల సమన్వయం
  choice: ఈ వచనంలోని గ్రీకు పేర్లనే అనుసరించడం
  alternative: ఓబేదు, శల్మా/సల్మోను వంటి సమాంతర వంశావళి రూపాలను ఉపయోగించడం
  rationale: మూలపాఠంలో ఉన్న ప్రత్యేక రూపాలను ఇతర వచనాలకు అనుగుణంగా మార్చకుండా, పాఠ్య భేదం లేదా వంశావళుల మధ్య ఉన్న ఉద్రిక్తతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలి. పేర్లను అనవసరంగా తెలుగీకరించకుండా, చదవడానికి సహజంగా లిప్యంతరీకరించాం.
