id: LUK.3.17
reference: Luke 3:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ ⸀διακαθᾶραι τὴν ἅλωνα αὐτοῦ καὶ ⸀συναγαγεῖν τὸν σῖτον εἰς τὴν ἀποθήκην αὐτοῦ, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/017.yaml
  text: His winnowing fork is in his hand to thoroughly clear his threshing floor and to gather the wheat into his storehouse[c][b][a], but the chaff he will burn up with unquenchable fire.
translation:
  language: te
  text: ఆయన చేతిలో తూర్పారబట్టే చేట[a] ఉంది; తన కళ్లాన్ని పూర్తిగా శుభ్రపరచడానికి, గోధుమలను తన గిడ్డంగిలో[b] పోగుచేయడానికి అది ఉంది. అయితే పొట్టును ఆయన ఆర్పలేని అగ్నితో[c] కాల్చివేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తూర్పారబట్టే పార’ అని కూడా అనువదించవచ్చు. గింజలను పొట్టు నుంచి వేరు చేయడానికి ధాన్యాన్ని గాలిలోకి ఎగరవేసే పనిముట్టును గ్రీకు పదం సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ధాన్యాగారం’ లేదా ‘కొట్టం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘ఆరని అగ్నితో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: తూర్పారబట్టే చేట
  rationale: ధాన్యాన్ని గాలిలోకి ఎగరవేసి గింజలను పొట్టు నుంచి వేరు చేయడానికి ఉపయోగించే వ్యవసాయ పనిముట్టును సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా పనిని కూడా స్పష్టంచేసే పదబంధం ఎంచుకోబడింది.
- source_word: διακαθᾶραι
  choice: పూర్తిగా శుభ్రం చేసి
  rationale: సమ్మిళిత క్రియలోని సంపూర్ణంగా శుభ్రపరచడం లేదా పూర్తిగా వేరు చేయడం అనే బలాన్ని నిలుపుతుంది; కళ్లం సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: ἅλωνα
  choice: కళ్లాన్ని
  rationale: ధాన్యాన్ని నూర్చి తూర్పారబట్టే ప్రదేశానికి ప్రామాణికమైన తెలుగు వ్యవసాయ పదం.
- source_word: συναγαγεῖν
  choice: పోగుచేయడానికి
  rationale: వేరుచేసిన ధాన్యాన్ని ఒకచోట చేర్చడం అనే సాధారణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: σῖτον
  choice: గోధుమలను
  rationale: ఈ తూర్పారబట్టే దృశ్యంలో పొట్టుకు విరుద్ధంగా నిలిచే ఉపయోగకరమైన ధాన్యాన్ని సూచిస్తుంది; సందర్భంలో గోధుమలు సహజమైన నిర్దిష్ట అర్థం.
- source_word: ἀποθήκην
  choice: గిడ్డంగిలో
  rationale: నిల్వచేసే స్థలాన్ని నిర్మాణ స్వరూపాన్ని అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
- source_word: ἄχυρον
  choice: పొట్టును
  rationale: తూర్పారబట్టేటప్పుడు గింజల నుంచి వేరయ్యే పనికిరాని తేలిక భాగాన్ని సూచిస్తుంది; ‘గడ్డి’ కంటే ఈ సందర్భానికి ఖచ్చితమైనది.
- source_word: κατακαύσει
  choice: పూర్తిగా కాల్చివేస్తాడు
  rationale: ఉపసర్గతో కూడిన క్రియ తెలియజేసే సంపూర్ణ దహన భావాన్ని నిలుపుతుంది.
- source_word: πυρὶ ἀσβέστῳ
  choice: ఆరని అగ్నితో
  rationale: ఆ అగ్ని ఆరిపోదు లేదా ఆర్పబడదు అనే బలమైన తీర్పు చిత్రాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: οὗ
  choice: ఆయన
  rationale: రాబోయే వ్యక్తిని సూచించే సంబంధబోధక సర్వనామాన్ని తెలుగులో సహజమైన స్వతంత్ర వాక్యంగా మార్చి, పనిముట్టు ఆయనదేననే సంబంధాన్ని ‘ఆయన చేతిలో’ ద్వారా నిలిపింది.
theological_decisions:
- issue: వ్యవసాయ రూపకంలోని తీర్పు మరియు వేర్పాటు
  choice: గోధుమలను పోగుచేయడం, పొట్టును ఆరని అగ్నితో పూర్తిగా కాల్చివేయడం అనే రక్షణ-తీర్పు చిత్రాలను వాటి పూర్తి బలంతో నిలుపడం.
  alternative: ఇది కేవలం ఇశ్రాయేలుపై తాత్కాలిక తీర్పు అని పరిమితం చేయడం లేదా ఈ ఒక్క వచనంలోనే అంతిమ నరక సిద్ధాంతం మొత్తం వివరించబడిందని విస్తరించడం.
  rationale: మూలపాఠం నిర్ణయాత్మకమైన వేర్పాటు, సంరక్షణ, దహనం గురించి స్పష్టంగా చెబుతుంది. అయితే ఆ తీర్పు ఎలా, ఎప్పుడు పూర్తిగా అమలవుతుందో ఈ వచనం వివరించదు; కాబట్టి అనవసరమైన సిద్ధాంత నిర్దిష్టతను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. వ్యవసాయ రూపకాన్ని నిలుపుతూ ‘తూర్పారబట్టే చేట,’ ‘కళ్లం,’ ‘పొట్టు’ వంటి సందర్భోచిత పదాలు వాడబడ్డాయి. గ్రీకు వాక్యంలోని ఉద్దేశ భావం తెలుగులో స్పష్టంగా ఉండేందుకు రెండవ వాక్యంలో ‘పోగుచేయడానికి అది ఆయన చేతిలో ఉంది’ అని వ్యక్తం చేయబడింది.
