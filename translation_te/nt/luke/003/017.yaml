review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the agricultural imagery, the thorough cleansing of the threshing floor, gathering the wheat, and the unquenchable-fire judgment. However, the clause “పోగుచేయడానికి అది ఆయన చేతిలో ఉంది” awkwardly makes the implement the grammatical subject/purpose bearer and is not a natural Telugu rendering of the Greek infinitival purpose clauses.
  naturalness: “తూర్పారబట్టే చేట,” “కళ్లం,” “గిడ్డంగి,” and “పొట్టు” are understandable modern-standard Telugu agricultural terms. Recasting the sentence so that the implement is in his hand for the stated actions removes the repetition and restores fluent syntax. “ఆర్పలేని” more precisely expresses ἀσβέστῳ ('unable to be quenched') than “ఆరని,” which can imply merely not going out on its own.
  terminology: Retain “తూర్పారబట్టే చేట” for πτύον, with “తూర్పారబట్టే పార” as an alternative. “కళ్లం,” “గోధుమలు,” “గిడ్డంగి,” and “పొట్టు” suitably preserve the source image. “ఆర్పలేని అగ్ని” preserves the theological force without expanding the verse’s judgment imagery.
  issues:
  - severity: medium
    issue: The second clause says “పోగుచేయడానికి అది ఆయన చేతిలో ఉంది.”
    rationale: This is syntactically unnatural and assigns the purpose construction to “it” (the winnowing implement). In Greek, the implement is in his hand, while he is the implied agent who clears the floor and gathers the wheat.
  - severity: low
    issue: “ఆరని అగ్ని” is less exact than “ఆర్పలేని అగ్ని.”
    rationale: ἀσβέστῳ denotes fire that cannot be extinguished; “ఆర్పలేని” directly conveys this passive/functional sense.
  revised_text: ఆయన చేతిలో తూర్పారబట్టే చేట[a] ఉంది; తన కళ్లాన్ని పూర్తిగా శుభ్రపరచడానికి, గోధుమలను తన గిడ్డంగిలో[b] పోగుచేయడానికి అది ఉంది. అయితే పొట్టును ఆయన ఆర్పలేని అగ్నితో[c] కాల్చివేస్తాడు.
