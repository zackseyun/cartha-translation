id: LUK.3.22
reference: Luke 3:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ καταβῆναι τὸ πνεῦμα τὸ ἅγιον σωματικῷ εἴδει ⸀ὡς περιστερὰν ἐπ’ αὐτόν, καὶ φωνὴν ἐξ οὐρανοῦ ⸀γενέσθαι· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/022.yaml
  text: 'and the Holy Spirit descended on him in bodily form like a dove[a], and a voice came from heaven: “You are my beloved Son; in you I am well pleased.”'
translation:
  language: te
  text: 'పరిశుద్ధాత్మ పావురంలా కనిపించే శారీరక రూపంలో ఆయనపై దిగివచ్చింది; అప్పుడు ఆకాశం నుండి ఒక స్వరం వినిపించింది: “నీవు నా ప్రియమైన కుమారుడవు; నీలో నేను సంతోషించాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταβῆναι
  choice: దిగివచ్చాడు
  rationale: క్రిందికి రావడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; కథనంలోని సంఘటనల క్రమాన్నీ నిలుపుతుంది.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: పరిశుద్ధాత్మ
  rationale: నిర్దిష్ట గ్రీకు పదబంధానికి ఆధునిక ప్రామాణిక తెలుగులో స్థిరమైన, స్పష్టమైన రూపం.
- source_word: σωματικῷ εἴδει
  choice: శరీర రూపంలో
  rationale: కనిపించే రూపంలో జరిగిన ప్రత్యక్షతను సూటిగా తెలియజేస్తుంది; కేవలం అంతరంగిక అనుభవమని భావించేలా చేయదు.
- source_word: ὡς περιστερὰν
  choice: పావురంలాంటి
  rationale: ὡς సూచించే పోలికను నిలుపుతుంది; ఆత్మ అక్షరార్థంగా పావురంగా మారాడని చెప్పదు.
- source_word: ἐπ’ αὐτόν
  choice: ఆయన మీదికి
  rationale: యేసు మీదికి జరిగిన దిగివచ్చే కదలికను సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: φωνὴν ἐξ οὐρανοῦ γενέσθαι
  choice: పరలోకం నుండి ఒక స్వరం వినిపించింది
  rationale: స్వరం సంభవించిందనే గ్రీకు సంఘటనాభివ్యక్తిని తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: Σὺ εἶ
  choice: నీవు ... కుమారుడవు
  rationale: ప్రత్యక్ష సంబోధనను సహజంగా నిలుపుతుంది; గ్రీకులోని స్పష్ట సర్వనామం ఇచ్చే ఉద్ఘాటన తెలుగులో ‘నీవు’ ద్వారా వ్యక్తమవుతుంది.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: నా ప్రియ కుమారుడవు
  rationale: సంబంధాన్ని, ప్రేమకు పాత్రుడనే భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: ἐν σοὶ
  choice: నీలో
  rationale: ἐν అనే విభక్త్యర్థాన్ని సూటిగా కాపాడుతుంది; ‘నీ విషయంలో’ లేదా ‘నీ పట్ల’ అని వ్యాఖ్యానాత్మకంగా మార్చదు.
- source_word: εὐδόκησα
  choice: నేను ఆనందించాను
  rationale: గ్రీకు ఏఒరిస్ట్ రూపంలోని గతకాల దృష్టిని నిలుపుతూ, εὐδοκέω యొక్క సంతోషం/ఇష్టపడటం అనే భావాన్ని సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: పరిశుద్ధాత్మ ప్రత్యక్షమైన స్వభావం
  choice: పరిశుద్ధాత్మ పావురంలాంటి శరీర రూపంలో దిగివచ్చాడని అనువదించడం
  alternative: పరిశుద్ధాత్మ నిజమైన పావురంగా దిగివచ్చాడని అనువదించడం
  rationale: σωματικῷ εἴδει కనిపించే శరీర రూపాన్ని సూచిస్తే, ὡς περιστερὰν పోలికను సూచిస్తుంది. అందువల్ల రూపం నిజమైనదని చెబుతూనే ఆత్మ అక్షరార్థంగా పావురంగా మారాడనే అదనపు వాదనను అనువాదం చేయదు.
- issue: εὐδόκησα యొక్క కాలబలం
  choice: “నీలో నేను ఆనందించాను” అని గతకాల రూపంలో ఉంచడం
  alternative: “నీలో నేను ఆనందిస్తున్నాను” లేదా “నీ పట్ల నేను ఎంతో సంతోషంగా ఉన్నాను”
  rationale: గ్రీకు ఏఒరిస్ట్‌ను తెలుగులో సహజమైన గతకాలంతో నేరుగా ప్రతిబింబిస్తుంది. ఈ ప్రకటన నిరంతర దైవానుగ్రహాన్ని నిరాకరిస్తుందని గానీ, నిర్దిష్ట గత సంఘటనకే పరిమితం చేస్తుందని గానీ అదనంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే దైవప్రకటనకు తగిన గౌరవభరిత శైలి. గ్రీకు ὡς లోని పోలికను కాపాడేందుకు ‘పావురంలాంటి’ వాడబడింది. εὐδόκησα యొక్క ఏఒరిస్ట్‌ను ప్రధాన పాఠ్యంలో గతకాలంగానే ఉంచినందున పాదటిప్పణి అవసరం లేదు.
