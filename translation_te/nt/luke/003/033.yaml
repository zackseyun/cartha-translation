translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి లయను నిలుపుతూ ప్రతి పేరుకు ‘కుమారుడు’ అని పునరావృతం చేయబడింది. వ్యక్తుల పేర్లు గౌరవప్రదమైన, బైబిలు పఠనంలో గుర్తించదగిన తెలుగు రూపాల్లో ఇవ్వబడ్డాయి; ప్రధాన పాఠంలోని నిజమైన పాఠభేదం పాదసూచికలో భద్రపరచబడింది.
