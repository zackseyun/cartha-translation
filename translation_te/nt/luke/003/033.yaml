base_translation:
  language: en
  yaml_path: translation/nt/luke/003/033.yaml
  text: the son of Amminadab[a], the son of Admin, the son of Arni, the son of Hezron, the son of Perez, the son of Judah,
translation:
  language: te
  text: అమ్మీనాదాబు కుమారుడు[a], అద్మీను కుమారుడు, అర్నీ కుమారుడు, హెస్రోను కుమారుడు, పెరెసు కుమారుడు, యూదా కుమారుడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘అమ్మీనాదాబు కుమారుడు, అద్మీను కుమారుడు, అరాము కుమారుడు’ అని ఉంది; మరికొన్ని ప్రతుల్లో ‘అద్మీను’ లేకుండా ‘అమ్మీనాదాబు కుమారుడు, అరాము కుమారుడు’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ
  choice: కుమారుడు
  rationale: లూకా వంశావళిలో ప్రతి పేరుతో పునరావృతమయ్యే షష్ఠీ విభక్తి సూచక పదం, ముందు వచనం నుంచి కొనసాగుతున్న వంశసంబంధ సూత్రంలో ‘కుమారుడు’ అనే భావాన్ని అంతర్లీనంగా కలిగివుంది. తెలుగులో కేవలం ‘యొక్క’ అని అనడం అసహజం; ‘కుమారుడు’ అని స్పష్టీకరించడం వంశావళి నిర్మాణాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: Ἀμιναδάβ
  choice: అమ్మీనాదాబు
  rationale: గ్రీకు పేరుకు దగ్గరగా ఉండి, తెలుగు బైబిలు నామరూపాల శైలికి అనుగుణమైన లిప్యంతరీకరణ.
- source_word: Ἀδμίν
  choice: అద్మీను
  rationale: అందించిన SBLGNT ప్రధాన పాఠంలోని గ్రీకు నామానికి ప్రత్యక్ష తెలుగు లిప్యంతరీకరణ.
- source_word: Ἀρνί
  choice: అర్నీ
  rationale: SBLGNT ప్రధాన పాఠంలో ఉన్న నామరూపాన్ని నేరుగా ప్రతిబింబిస్తుంది. ‘అరాము’ అనే పాఠాంతరం పాదసూచికలో ఉంచబడింది.
- source_word: Ἑσρώμ
  choice: హెస్రోను
  rationale: గ్రీకు రూపాన్ని ప్రతిబింబిస్తూ, పాత నిబంధన వంశావళులతో గుర్తించదగిన సంప్రదాయ తెలుగు నామరూపం.
- source_word: Φαρές
  choice: పెరెసు
  rationale: పాత నిబంధనలోని అదే వ్యక్తితో సంబంధం స్పష్టంగా ఉండేందుకు సెమిటిక్ మూలానికి అనుగుణమైన, తెలుగులో గుర్తించదగిన రూపం.
- source_word: Ἰούδα
  choice: యూదా
  rationale: ఇది వంశపిత యూదాను సూచిస్తున్నందున, కొత్త నిబంధనలోని యూదా అనే ఇతర వ్యక్తులతో సందర్భానుసారంగా వేరుచేయగల స్థిరమైన తెలుగు నామరూపం.
