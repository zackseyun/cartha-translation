id: LUK.3.16
reference: Luke 3:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίνατο ⸂λέγων πᾶσιν ὁ Ἰωάννης⸃· Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς· ἔρχεται δὲ ὁ ἰσχυρότερός μου, οὗ οὐκ εἰμὶ ἱκανὸς λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ καὶ πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/016.yaml
  text: John answered them all[a], saying, “I indeed baptize you with water, but one stronger than I is coming, whose sandal strap I am not worthy to untie[d][c][b]. He will baptize you in the Holy Spirit and fire.”
translation:
  language: te
  text: 'యోహాను వారందరికీ ఇలా జవాబిచ్చాడు: “నేను మిమ్మల్ని నీటితో బాప్తిస్మమిస్తున్నాను. అయితే నాకంటే బలవంతుడు వస్తున్నాడు; ఆయన చెప్పుల పట్టీని విప్పడానికి నేను అర్హుణ్ణి కాను. ఆయనే మిమ్మల్ని పరిశుద్ధాత్మలోను అగ్నిలోను బాప్తిస్మమిస్తాడు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పరిశుద్ధాత్మలోను అగ్నిలోను” అనే గ్రీకు మాటను “పరిశుద్ధాత్మతోను అగ్నితోను” అని కూడా అనువదించవచ్చు. ఇక్కడ “అగ్ని” శుద్ధిని, తీర్పును, లేదా ఆత్మ-అగ్ని బాప్తిస్మం అనే ఒకే చిత్రంలోని అంశాన్ని సూచించవచ్చు; వాక్యం దానిని స్పష్టంగా తేల్చదు.
    reason: lexical_and_interpretive_alternative
lexical_decisions:
- source_word: ἀπεκρίνατο λέγων πᾶσιν ὁ Ἰωάννης
  choice: యోహాను వారందరికీ ఇలా జవాబిచ్చాడు
  rationale: గ్రీకు జవాబు-ప్రారంభ సూత్రంలోని ప్రతిస్పందన భావాన్ని, πᾶσιν లోని ‘అందరికీ’ భావాన్ని సహజమైన తెలుగు కథన శైలిలో నిలుపుతుంది.
- source_word: Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς
  choice: నేను మిమ్మల్ని నీటితో బాప్తిస్మమిస్తున్నాను
  rationale: μέν తరువాతి వ్యత్యాసానికి పునాది వేస్తుంది; తెలుగులో ‘అయితే’తో ప్రారంభమయ్యే తరువాతి వాక్యం ఆ వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది. ὕδατι సాధనం లేదా మూలకాన్ని సూచించగలదు; ‘నీటితో’ సాధారణ తెలుగు వాడుక.
- source_word: βαπτίζω / βαπτίσει
  choice: బాప్తిస్మమిస్తున్నాను / బాప్తిస్మమిస్తాడు
  rationale: సువార్తల సందర్భంలో స్థిరపడిన, విస్తృతంగా అర్థమయ్యే పదప్రయోగం; ‘ముంచడం’ అని పెట్టి విధానపరమైన ప్రత్యేకతను అనవసరంగా రుద్దదు.
- source_word: ὁ ἰσχυρότερός μου
  choice: నాకంటే బలవంతుడు
  rationale: తులనాత్మక భావాన్ని నేరుగా, సహజంగా నిలుపుతుంది; ‘అధిక శక్తిమంతుడు’ కంటే సాధారణ పాఠకుడికి సులభం.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: ఆయన చెప్పుల పట్టీ విప్పడానికి కూడా నేను తగినవాణ్ణి కాను
  rationale: ἱκανός లోని యోగ్యత/అర్హత భావాన్ని ‘తగినవాణ్ణి కాను’ సహజంగా అందిస్తుంది. ‘కూడా’ మూలంలోని ప్రత్యేక పదం కాకపోయినా, ఈ అల్పమైన సేవకు సైతం తాను తగనని వినయసూత్రంలోని భావాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: αὐτὸς
  choice: ఆయనే
  rationale: యోహానుతో వస్తున్నవానిని పోల్చే emphatic భావాన్ని తెలుగు ఏకారంతో స్పష్టంగా నిలుపుతుంది.
- source_word: ἐν πνεύματι ἁγίῳ καὶ πυρί
  choice: పరిశుద్ధాత్మలోను అగ్నిలోను
  rationale: ἐν యొక్క పరిధి, సాధనం, లేదా మూలకం అనే సూక్ష్మతను ముందే తేల్చకుండా ‘లో’ ద్వారా మూల నిర్మాణానికి దగ్గరగా ఉంచుతుంది; καί కలిపే రెండు పదాలను సమాంతరంగా అందిస్తుంది.
theological_decisions:
- issue: ‘పరిశుద్ధాత్మలోను అగ్నిలోను బాప్తిస్మమిస్తాడు’ అనే మాటలో ‘అగ్ని’ అర్థం
  choice: ‘అగ్ని’ని వివరణ జోడించకుండా అలాగే ఉంచడం
  alternative: శుద్ధి చేసే అగ్నిగా మాత్రమే లేదా తీర్పు అగ్నిగా మాత్రమే స్పష్టీకరించడం
  rationale: వాక్యం అగ్ని శుద్ధిని సూచిస్తుందా, తీర్పును సూచిస్తుందా, లేక ఆత్మ-అగ్ని అనే ఒకే సంయుక్త చిత్రంలో భాగమా అన్నది నేరుగా తేల్చదు. అనువాదం ఆ ధార్మిక ఉద్రిక్తతను నిలుపుతుంది.
- issue: πνεῦμα ἅγιον యొక్క సూచన
  choice: దైవిక వ్యక్తిని సూచించే ‘పరిశుద్ధాత్మ’
  alternative: ‘పరిశుద్ధమైన ఆత్మ’ లేదా ‘పవిత్ర భావం’
  rationale: లూకా సందర్భంలో ఈ పదబంధం దేవుని పరిశుద్ధాత్మను సూచిస్తుంది; అందువల్ల తెలుగులో స్థిరమైన వ్యక్తినామ రూపం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవదగిన కథన శైలి. ‘చెప్పుల పట్టీ’ సాధారణ పాఠకుడికి స్పష్టం; ‘బాప్తిస్మం’ సంఘపరంగా స్థిరపడిన పదమైనప్పటికీ ఏ ప్రత్యేక బాప్తిస్మ విధానాన్నీ నిర్ణయించదు.
