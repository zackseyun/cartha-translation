lexical_decisions:
- source_word: ὄψεται
  choice: చూస్తారు
  rationale: ὁράω యొక్క భవిష్యత్ రూపం ఇక్కడ నేరుగా ‘చూస్తారు’ అనే అర్థాన్నిస్తుంది. ఈ ఎంపిక మూలంలోని దృశ్య భాషను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: πᾶσα σὰρξ
  choice: శరీరులందరూ
  rationale: అక్షరార్థంగా ‘సమస్త శరీరం’ అయిన ఈ ప్రవచనాత్మక జాతీయ ప్రయోగం మనుషులందరినీ సూచిస్తుంది. ‘శరీరులందరూ’ అనే రూపం దాని మానవ వ్యాప్తిని తెలుగులో స్పష్టం చేస్తూనే ‘శరీరం’ అనే మూలచిత్రాన్నీ, యెషయా 40:5 ప్రతిధ్వనినీ నిలుపుతుంది.
- source_word: σωτήριον
  choice: రక్షణను
  rationale: నామవాచకంగా వాడిన σωτήριον దేవుని రక్షించే కార్యాన్ని విస్తృతంగా సూచిస్తుంది. ‘రక్షణ’ స్థిరమైన, సహజమైన తెలుగు పదం; ‘విడుదల’ కంటే అర్థపరిధిని బాగా కాపాడుతుంది.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: గ్రీకు షష్ఠీ విభక్తిని ‘దేవుని రక్షణ’గా సూటిగా నిలిపాం. ఇది రక్షణ దేవునికి చెందినదని లేదా ఆయన నుండే వస్తుందని సూచించగలదు; ‘దేవుని నుండి’ అనే భావాన్ని పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చాం.
theological_decisions:
- issue: πᾶσα σὰρξ అనే జాతీయ ప్రయోగపు పరిధి
  choice: ఇది మనుషులందరినీ సూచిస్తుంది; అయితే మూలంలోని ‘శరీరం’ అనే చిత్రాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
  alternative: ‘మనుషులందరూ’ లేదా ‘మానవాళి అంతా’ అని పూర్తిగా భావానువాదం చేయడం.
  rationale: యెషయా ప్రవచనంతో ఉన్న అంతర్పాఠ్య సంబంధాన్ని, విశ్వవ్యాప్త మానవ పరిధిని రెండింటినీ కాపాడటానికి ‘శరీరులందరూ’ను ఎంచుకున్నాం.
- issue: τοῦ θεοῦ అనే షష్ఠీ విభక్తి సంబంధం
  choice: ‘దేవుని రక్షణ’—మూలంలోని సంబంధాన్ని తెరిచి ఉంచే రూపం.
  alternative: ‘దేవుని నుండి వచ్చే రక్షణ’—దేవుడే మూలమని స్పష్టీకరించే రూపం.
  rationale: షష్ఠీ విభక్తి స్వామ్యాన్ని లేదా మూలాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో దానిని ఒక్క భావానికి పరిమితం చేయకుండా, మూలార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండేలా బహువచన క్రియను వాడాం. ‘శరీరులందరూ’ కొంత ప్రవచనాత్మక గంభీరత కలిగిన రూపమే అయినా, పాదసూచిక సహాయంతో సాధారణ పాఠకుడికి స్పష్టంగా ఉంటుంది; అదే సమయంలో మూలంలోని శరీర-చిత్రాన్ని కాపాడుతుంది.
