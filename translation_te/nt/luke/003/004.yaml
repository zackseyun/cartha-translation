reference: Luke 3:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς γέγραπται ἐν βίβλῳ λόγων Ἠσαΐου τοῦ ⸀προφήτου· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/004.yaml
  text: 'as it is written in the book of the words of Isaiah the prophet[a], “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: te
  text: 'ప్రవక్తయైన యెషయా మాటల గ్రంథంలో ఇలా రాసి ఉంది: “అరణ్యంలో బిగ్గరగా పిలుస్తున్నవాని స్వరం[a]: ‘ప్రభువు[b] మార్గాన్ని సిద్ధం చేయండి; ఆయన దారులను నేరుగా చేయండి.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“అరణ్యంలో” అనే మాటను ఇక్కడ “బిగ్గరగా పిలుస్తున్నవాని”తో కలిపి అర్థం చేసుకోవచ్చు. లేదా తర్వాతి ఆజ్ఞతో కలిపి, “బిగ్గరగా పిలుస్తున్నవాని స్వరం: ‘అరణ్యంలో ప్రభువు మార్గాన్ని సిద్ధం చేయండి’” అని కూడా అర్థం చేసుకోవచ్చు.'
    reason: alternative_reading
  - marker: b
    text: లేదా, “యెహోవా.” యెషయా 40:3లోని హెబ్రీ పాఠ్యంలో ఇక్కడ దేవుని నామమైన YHWH ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: ఇలా రాసి ఉంది
  rationale: లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే గ్రీకు పరిపూర్ణ కర్మణి రూపంలోని కొనసాగుతున్న ఫలిత భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: βίβλῳ λόγων
  choice: మాటల గ్రంథంలో
  rationale: Luke ఉపయోగించిన రెండు నామవాచకాలనూ నిలుపుతూ, ప్రాచీన గ్రంథపు రూపాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా సహజంగా అనువదిస్తుంది.
- source_word: Ἠσαΐου τοῦ προφήτου
  choice: ప్రవక్తయైన యెషయా
  rationale: యెషయాను ప్రవక్తగా గుర్తించే సమాసార్థాన్ని స్పష్టమైన, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: Φωνὴ βοῶντος
  choice: బిగ్గరగా పిలుస్తున్నవాని స్వరం
  rationale: βοῶντος లోని వ్యక్తిగత కర్తను, బిగ్గరగా ప్రకటించే భావాన్ని నిలుపుతుంది.
- source_word: ἐν τῇ ἐρήμῳ
  choice: అరణ్యంలో
  rationale: ప్రవచన నేపథ్యానికీ యోహాను ఉన్న ప్రదేశానికీ సరిపోయే సాధారణ తెలుగు పదం; ప్రధాన పాఠ్యంలో దీనిని ‘పిలుస్తున్నవాని’తో అనుసంధానించాం.
- source_word: Ἑτοιμάσατε
  choice: సిద్ధం చేయండి
  rationale: బహువచన ఆజ్ఞార్థక బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: τὴν ὁδὸν κυρίου
  choice: ప్రభువు మార్గాన్ని
  rationale: రాబోయే ప్రభువు కోసం మార్గాన్ని సిద్ధం చేసే ప్రవచన రూపకాన్ని కాపాడుతుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: గ్రీకు κύριος ను నేరుగా బిరుదుగా అనువదిస్తుంది; యెషయా 40:3లోని YHWH నేపథ్యాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: εὐθείας ποιεῖτε
  choice: నేరుగా చేయండి
  rationale: విశేషణం-క్రియ నిర్మాణంలోని ఆజ్ఞను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὰς τρίβους αὐτοῦ
  choice: ఆయన దారులను
  rationale: ‘మార్గం’తో సమాంతరంగా ఉండే రహదారి రూపకాన్ని సహజమైన పదంతో నిలుపుతుంది.
theological_decisions:
- issue: మూల హెబ్రీలో YHWHను సూచించే యెషయా ఉల్లేఖనంలో κύριος అనువాదం
  choice: ప్రభువు
  alternative: యెహోవా / YHWH
  rationale: లూకా గ్రీకు పాఠ్యంలో κύριος ఉన్నందున ప్రధాన పాఠ్యం ‘ప్రభువు’ అని అనువదిస్తుంది. అయితే యెషయా 40:3లోని దైవనామ నేపథ్యాన్ని పాదసూచికలో ఉంచడం ద్వారా క్రైస్తవార్థాన్ని అతిగా నిర్దిష్టం చేయకుండా అసలు పాఠ్య సంబంధాన్ని కాపాడుతుంది.
- issue: ἐν τῇ ἐρήμῳ ఏ వాక్యభాగంతో అనుసంధానించాలి
  choice: '‘బిగ్గరగా పిలుస్తున్నవాని’తో: ‘అరణ్యంలో బిగ్గరగా పిలుస్తున్నవాని స్వరం’'
  alternative: 'తర్వాతి ఆజ్ఞతో: ‘అరణ్యంలో ప్రభువు మార్గాన్ని సిద్ధం చేయండి’'
  rationale: లూకా ఉల్లేఖనంలోని సాధారణ గ్రీకు విరామ అవగాహనను ప్రధాన పాఠ్యంలో అనుసరించాం; వ్యాకరణపరంగా సాధ్యమైన మరొక అనుసంధానాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ప్రవచన శైలిని వాడాం. ‘రాసి ఉంది,’ ‘సిద్ధం చేయండి,’ ‘దారులు’ వంటి ప్రస్తుత వాడుక పదాలను ఎంచుకుని, అతిగా ప్రాచీనమైన రూపాలను నివారించాం.
