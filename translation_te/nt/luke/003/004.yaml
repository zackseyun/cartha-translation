  to: 'ప్రవక్తయైన యెషయా మాటల గ్రంథంలో ఇలా రాసి ఉంది: “అరణ్యంలో బిగ్గరగా పిలుస్తున్నవాని స్వరం[a]: ‘ప్రభువు[b] మార్గాన్ని సిద్ధం చేయండి; ఆయన దారులను నేరుగా చేయండి.’”'
  rationale: ప్రధాన పాఠ్యానికి మార్పు అవసరం లేదు. పాదసూచిక bలో మాత్రమే ‘ప్రభువు’కు ప్రత్యామ్నాయంగా యెషయా ఉల్లేఖనంలోని దైవనామ నేపథ్యాన్ని స్పష్టంగా చూపించే అనువాదాన్ని చేర్చాం. అరణ్యానికి సంబంధించిన సందిగ్ధ అనుసంధానాన్ని పాదసూచిక a యథావిధిగా కాపాడుతుంది.
