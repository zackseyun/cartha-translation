    rationale: ప్రధాన పాఠం సందర్భాన్ని బట్టి ‘చెడు పనులు’ అని స్పష్టం చేస్తుంది. పాదటిప్పణి ‘వాటన్నిటికీ’ అనే మరింత సన్నిహిత రూపాన్ని ఇచ్చి, ఆ ‘వాటి’ సూచనను ఇతర చెడు పనులుగా వివరిస్తే స్పష్టత పెరుగుతుంది.
