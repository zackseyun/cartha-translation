base_translation:
  language: en
  yaml_path: translation/nt/luke/003/020.yaml
  text: 'He added this also to them all: he locked John up in prison[a].'
translation:
  language: te
  text: 'హేరోదు తన చెడు పనులన్నిటికీ దీనినీ జోడించాడు: యోహానును చెరసాలలో బంధించాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “వాటన్నిటికీ దీనినీ జోడించాడు.” అంటే హేరోదు తన ఇతర చెడు పనులన్నిటికి ఈ కార్యాన్ని కూడా జోడించాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθηκεν
  choice: చేర్చాడు
  rationale: ఈ సందర్భంలో προστίθημι మునుపటి కార్యాలకు మరొక కార్యాన్ని జోడించడం అనే సంచిత భావాన్ని ఇస్తుంది. ‘చేర్చాడు’ సహజంగా, సంక్షిప్తంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: τοῦτο
  choice: దీనిని కూడా
  rationale: τοῦτο తరువాత చెప్పబడే నిర్దిష్ట కార్యాన్ని సూచిస్తుంది; καί లోని అదనపు భావాన్ని ‘కూడా’ వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ πᾶσιν
  choice: తన చెడు పనులన్నిటికీ
  rationale: ఈ ప్రయోగం ‘మునుపటి వాటన్నిటికీ అదనంగా’ అనే భావాన్ని ఇస్తుంది. 19వ వచనంలోని κακῶν సందర్భం వల్ల అంతర్లీనంగా ఉన్న ‘చెడు పనులు’ తెలుగులో స్పష్టం చేయబడింది.
- source_word: κατέκλεισεν
  choice: బంధించాడు
  rationale: κατακλείω అంటే లోపల నిర్బంధించడం లేదా చెరలో ఉంచడం. ‘చెరసాలలో’తో కలిసి ‘బంధించాడు’ సహజమైన ఆధునిక తెలుగు.
- source_word: Ἰωάννην
  choice: యోహానును
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగించింది.
- source_word: ἐν φυλακῇ
  choice: చెరసాలలో
  rationale: φυλακή ఇక్కడ నిర్బంధ స్థలాన్ని సూచిస్తుంది. ‘చెరసాలలో’ గౌరవప్రదమైన, సులభంగా అర్థమయ్యే తెలుగు రూపం.
theological_decisions:
- issue: ἐπὶ πᾶσιν యొక్క సూచన మరియు భావం
  choice: హేరోదు ఈ కార్యాన్ని తన మునుపటి చెడు పనులన్నిటికీ అదనంగా చేర్చాడు.
  alternative: ‘వాటన్నిటిమీద దీనిని కూడా చేర్చాడు’ లేదా ‘వీటన్నిటికీ అదనంగా దీనిని కూడా చేశాడు.’
  rationale: 3:19–20 సమీప సందర్భం హేరోదు చేసిన చెడు పనులను పేర్కొని, యోహానును చెరసాలలో బంధించడాన్ని మరో చెడు కార్యంగా చూపుతుంది. అనువాదం ఈ సంచిత భావాన్ని స్పష్టం చేస్తుంది; కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘అయితే’ పూర్వ సందర్భంతో వ్యతిరేక-సంచిత అనుసంధానాన్ని వ్యక్తం చేస్తుంది; ‘తన చెడు పనులు’ అనేది 3:19లోని సందర్భం ద్వారా అంతర్లీనంగా ఉన్న సూచనను స్పష్టం చేస్తుంది.
