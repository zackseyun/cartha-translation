- from: 'అయితే హేరోదు తన చెడు పనులన్నిటికీ దీనిని కూడా చేర్చాడు: యోహానును చెరసాలలో బంధించాడు.[a]'
  to: 'హేరోదు తన చెడు పనులన్నిటికీ దీనినీ జోడించాడు: యోహానును చెరసాలలో బంధించాడు.[a]'
  rationale: అనవసరమైన వ్యతిరేకార్థక ‘అయితే’ను తొలగించాము. ἐπὶ πᾶσιν యొక్క సంచిత భావాన్ని సందర్భానుసారంగా ‘తన చెడు పనులన్నిటికీ’ ద్వారా నిలిపి, προσέθηκεν కు ‘జోడించాడు,’ κατέκλεισεν ἐν φυλακῇ కు ‘చెరసాలలో బంధించాడు’ అని అనువదించాము. పాదటిప్పణి మూలంలోని సంక్షిప్త, సందర్భాధారిత సూచనను తెలియజేస్తుంది.
