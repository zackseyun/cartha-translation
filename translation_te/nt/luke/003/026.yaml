  text: the son of Maath[a], the son of Mattathias, the son of Semein, the son of Josech, the son of Joda,
translation:
  language: te
  text: మాథ్ కుమారుడు[a], మత్తతీయాస్ కుమారుడు, సెమెయిన్ కుమారుడు, యోసేఖ్ కుమారుడు, యోదా కుమారుడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పాఠంలో ప్రతి పేరుతో షష్ఠీవిభక్తి నిర్దిష్టార్థకం మాత్రమే పునరావృతమవుతుంది; చుట్టూ ఉన్న వంశావళి సందర్భంలో అంతర్లీనంగా ఉన్న సంబంధాన్ని స్పష్టం చేయడానికి తెలుగులో ‘కుమారుడు’ అని చేర్చాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: కుమారుడు
  rationale: లూకా వంశావళిలో పునరావృతమయ్యే షష్ఠీవిభక్తి సూచకమైన τοῦ, ముందున్న సందర్భం నుంచి ‘కుమారుడు’ అనే సంబంధాన్ని అధ్యాహారంగా కొనసాగిస్తుంది. తెలుగులో కేవలం ‘యొక్క’ అని చెప్పడం అసహజంగా, అస్పష్టంగా ఉంటుంది కాబట్టి ఆ అంతర్లీన సంబంధాన్ని స్పష్టంగా తెలిపాం.
- source_word: Μάαθ
  choice: మాయత్
  rationale: గ్రీకు వ్యక్తినామంలోని దీర్ఘ అచ్చుల క్రమాన్ని, చివరి థీటా ధ్వనిని సాధ్యమైనంత దగ్గరగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: Ματταθίου
  choice: మత్తతీయ
  rationale: ఇది Ματταθίας అనే వ్యక్తినామపు షష్ఠీవిభక్తి రూపం. తెలుగు పాఠకులకు సహజంగా ఉండేలా మూల నామరూపాన్ని ‘మత్తతీయ’గా లిప్యంతరీకరించాం.
- source_word: Σεμεῒν
  choice: సెమెయిన్
  rationale: గ్రీకు రూపాన్ని నేరుగా అనుసరించి, చివరి నాసిక్య ధ్వనితో సహా లిప్యంతరీకరించాం.
- source_word: Ἰωσὴχ
  choice: యోసేఖ్
  rationale: SBLGNTలోని Ἰωσήχ రూపాన్ని అనుసరించి, చివరి ఖీ ధ్వనిని ‘ఖ్’తో చూపించాం; ఇతర నామరూపాలతో సమన్వయం చేయలేదు.
- source_word: Ἰωδὰ
  choice: యోదా
  rationale: గ్రీకు Ἰωδά రూపానికి నేరుగా సరిపోయే తెలుగు లిప్యంతరీకరణ; హెబ్రీయ శైలికి అనుగుణంగా విస్తరించిన ప్రత్యామ్నాయ రూపాన్ని తీసుకోలేదు.
