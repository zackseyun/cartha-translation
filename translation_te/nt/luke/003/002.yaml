id: LUK.3.2
reference: Luke 3:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα, ἐγένετο ῥῆμα θεοῦ ἐπὶ Ἰωάννην τὸν Ζαχαρίου υἱὸν ἐν τῇ ἐρήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/002.yaml
  text: during the high priesthood of Annas and Caiaphas[a], the word of God came to John, the son of Zechariah, in the wilderness.
translation:
  language: te
  text: అన్నా, కయఫాల ప్రధానయాజకత్వంలో[a], జెకర్యా కుమారుడైన యోహానుకు దేవుని వాక్యం అరణ్యంలో వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘అన్నా, కయఫాల ప్రధానయాజకత్వంలో.’ పదవిని సూచించే గ్రీకు పదం ఏకవచనంలో ఉన్నప్పటికీ లూకా ఇద్దరి పేర్లను పేర్కొంటున్నాడు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα
  choice: అన్న, కయపల ప్రధానయాజకత్వ కాలంలో
  rationale: ἐπί + షష్ఠీ విభక్తి ఇక్కడ కాలాన్ని సూచిస్తుంది. గ్రీకులో ἀρχιερέως ఏకవచనంలో ఉన్నప్పటికీ ఇద్దరి పేర్లు ఉన్నాయి; అందువల్ల ఇద్దరూ ఒకేసారి అధికారిక ప్రధానయాజకులని చెప్పకుండా, ఏకవచన సంస్థాగత భావాన్ని ‘ప్రధానయాజకత్వ కాలంలో’ అని నిలిపాం.
- source_word: ἐγένετο ῥῆμα θεοῦ
  choice: దేవుని వాక్యం వచ్చింది
  rationale: ఇది ప్రవక్తకు దేవుని సందేశం అందడాన్ని తెలిపే సుపరిచితమైన బైబిలు నుడికారం. ἐγένετοను యాంత్రికంగా ‘జరిగింది’ అనకుండా, తెలుగులో సహజమైన ‘వచ్చింది’ అని అనువదించాం.
- source_word: ἐπὶ Ἰωάννην
  choice: యోహానుకు
  rationale: ప్రకటన లేదా సందేశం ఒక వ్యక్తికి చేరడాన్ని ఇక్కడ ἐπί + ద్వితీయా విభక్తి సూచిస్తుంది. ఆధునిక తెలుగులో ‘యోహానుకు’ సహజంగా ఉంది.
- source_word: τὸν Ζαχαρίου υἱὸν
  choice: జెకర్యా కుమారుడు యోహాను
  rationale: ఈ వివరణ ఏ యోహాను ఉద్దేశించబడ్డాడో గుర్తిస్తుంది. తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా బంధసూచక పదబంధాన్ని పేరుకు ముందు ఉంచాం.
- source_word: ἐν τῇ ἐρήμῳ
  choice: అరణ్యంలో ఉన్న
  rationale: ἔρημος జనావాసం తక్కువగా ఉన్న అరణ్య ప్రాంతాన్ని సూచిస్తుంది; అది తప్పనిసరిగా ఇసుక ఎడారి కాదు. ఈ పదబంధాన్ని యోహానుతో సహజంగా అనుసంధానించాం.
theological_decisions:
- issue: ఏకవచన ἀρχιερέωςతో అన్న, కయప అనే ఇద్దరిని లూకా పేర్కొనడం
  choice: ఏకవచన సంస్థాగత భావాన్ని ‘అన్న, కయపల ప్రధానయాజకత్వ కాలంలో’ అని నిలుపుకోవడం
  alternative: ‘అన్న, కయప ప్రధానయాజకులుగా ఉన్నప్పుడు’
  rationale: ప్రత్యామ్నాయం ఇద్దరూ ఒకేసారి అధికారికంగా ప్రధానయాజకులని స్పష్టీకరించి, మూలంలోని చారిత్రక-సాహిత్య ఉద్రిక్తతను సరిచేసినట్లవుతుంది. ఎంపిక చేసిన రూపం గ్రీకు ఏకవచనాన్ని, ఇద్దరి పేర్లను రెండింటినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే కథన శైలిని వాడాం. ‘ప్రధానయాజకత్వం’ అనే సంస్థాగత పదం మూలంలోని ఏకవచనాన్ని కాపాడుతుంది; పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
