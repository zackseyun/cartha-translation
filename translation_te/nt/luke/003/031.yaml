translation:
  language: te
  text: మెలెయా కుమారుడు[a], మెన్నా కుమారుడు[b], మత్తతా కుమారుడు, నాతాను కుమారుడు, దావీదు కుమారుడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకులో అక్షరాలా: “మెలెయాకు చెందినవాడు, మెన్నాకు చెందినవాడు, మత్తతాకు చెందినవాడు, నాతానుకు చెందినవాడు, దావీదుకు చెందినవాడు.” లూకా వంశావళిలో పునరావృతమయ్యే ఈ నిర్మాణం సాధారణంగా “కుమారుడు” అనే సంబంధాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: కొన్ని అనువాద సంప్రదాయాల్లో “మెన్నా” స్థానంలో “మెనాన్” అనే రూపం ఉంది; అది పేరు యొక్క వేరొక పాఠరూపాన్ని ప్రతిబింబిస్తుంది. ఇక్కడ అనుసరించిన SBLGNT గ్రీకు పాఠంలో Μεννά (“మెన్నా”) ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ
  choice: కుమారుడు
  rationale: లూకా వంశావళిలో పునరావృతమయ్యే షష్ఠీవిభక్తి నిర్మాణం సందర్భానుసారంగా ‘కుమారుడు’ అనే సంబంధాన్ని సూచిస్తుంది. సహజమైన తెలుగుకోసం ప్రతి పేరుతో దానిని స్పష్టంగా ఇచ్చాం.
- source_word: Μελεὰ
  choice: మెలెయ
  rationale: గ్రీకు Μελεά పేరుకు దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణ.
- source_word: Μεννὰ
  choice: మెన్నా
  rationale: SBLGNTలోని Μεννά రూపాన్ని నేరుగా ప్రతిబింబించే లిప్యంతరీకరణ; ‘మెనాను’ వంటి ప్రత్యామ్నాయ రూపాన్ని మూలపాఠంలోకి చేర్చలేదు.
- source_word: Ματταθὰ
  choice: మత్తతా
  rationale: గ్రీకు Ματταθά పేరుకు సహజమైన తెలుగు లిప్యంతరీకరణ.
- source_word: Ναθὰμ
  choice: నాతాను
  rationale: ఈ బైబిలు పేరుకు తెలుగులో సుపరిచితమైన రూపాన్ని వాడాం; ఇది గ్రీకు Ναθάμను సూచిస్తుంది.
- source_word: Δαυὶδ
  choice: దావీదు
  rationale: గ్రీకు Δαυίδకు తెలుగులో స్థిరపడిన బైబిలు పేరు.
theological_decisions:
- issue: వంశావళిలో అధ్యాహారం
  choice: ప్రతి పేరుతో ‘కుమారుడు’ అని సరఫరా చేయడం
  alternative: ‘మెలెయకు చెందినవాడు, మెన్నాకు చెందినవాడు…’ వంటి కేవలం షష్ఠీ సంబంధాన్ని చూపడం
  rationale: గ్రీకులో పేర్ల ముందు పునరావృతమయ్యే τοῦ రూపాలు విస్తృత వంశావళి వాక్యనిర్మాణంపై ఆధారపడినవి. ‘కుమారుడు’ అని ఇవ్వడం సందర్భం స్పష్టంగా సూచించే వంశసంబంధాన్ని మాత్రమే వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన గౌరవప్రదమైన సరళ శైలి. పేర్లను గ్రీకు మూలానికి దగ్గరగా ఉంచుతూ, నాతాను మరియు దావీదు వంటి స్థిరపడిన తెలుగు బైబిలు రూపాలను ఉపయోగించాం.
