review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the inferential force of οὖν, the imperative to produce conduct corresponding to repentance, the warning against reliance on Abrahamic ancestry, and God’s power to provide Abraham with children from the stones. ‘పుట్టించగలడు’ is understandable, but ‘సంతానాన్ని కలుగజేయగలడు’ more directly expresses the sense of ἐγεῖραι τέκνα τῷ Ἀβραάμ without suggesting Abraham himself would father them.
  naturalness: ‘ఫలాలు ఫలించండి’ is a redundant and somewhat wooden collocation in modern standard Telugu. ‘ఫలాలను కనబరచండి’ is natural, keeps the plural, and clearly refers to observable conduct. A semicolon better reflects the close connection in the Greek than a full stop after the first command.
  terminology: ‘మారుమనస్సు’ is an established Telugu biblical term for μετάνοια and appropriately preserves more than mere intellectual change. ‘మీలో మీరు’ properly retains the source phrase’s ambiguity between inward self-talk and speech within one’s group. ‘సంతానం’ is natural here for τέκνα while retaining the relation to Abraham.
  issues:
  - severity: medium
    issue: Redundant expression ‘ఫలాలు ఫలించండి’
    rationale: Although intelligible, the noun and verb repeat the same root and sound unnatural in contemporary prose. The Greek ποιήσατε καρπούς calls for producing or showing fruits, not a tautological Telugu expression.
  - severity: low
    issue: ‘పిల్లలను పుట్టించగలడు’ may over-specify the idiom
    rationale: It can be heard as God causing Abraham to father children. The Greek says God can raise up children for Abraham; ‘అబ్రాహాముకు సంతానాన్ని కలుగజేయగలడు’ is closer and idiomatic.
  - severity: low
    issue: Full stop interrupts two closely linked commands
    rationale: The Greek uses a semicolon before the negative command. Telugu punctuation can preserve the rhetorical linkage with a semicolon.
  revised_text: కాబట్టి మారుమనస్సుకు తగిన ఫలాలను కనబరచండి[a]; ‘అబ్రాహాము మాకు తండ్రిగా ఉన్నాడు’ అని మీలో మీరు చెప్పుకోవడం మొదలుపెట్టవద్దు[b]. ఎందుకంటే, ఈ రాళ్లనుంచి అబ్రాహాముకు సంతానాన్ని కలుగజేయగల శక్తి దేవునికి ఉందని నేను మీతో చెబుతున్నాను.
