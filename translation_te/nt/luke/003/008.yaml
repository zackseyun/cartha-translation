id: LUK.3.8
reference: Luke 3:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ποιήσατε οὖν καρποὺς ἀξίους τῆς μετανοίας· καὶ μὴ ἄρξησθε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/008.yaml
  text: Therefore produce fruits worthy of repentance[a], and do not begin to say among yourselves[b], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: te
  text: కాబట్టి మారుమనస్సుకు తగిన ఫలాలను కనబరచండి[a]; ‘అబ్రాహాము మాకు తండ్రిగా ఉన్నాడు’ అని మీలో మీరు చెప్పుకోవడం మొదలుపెట్టవద్దు[b]. ఎందుకంటే, ఈ రాళ్లనుంచి అబ్రాహాముకు సంతానాన్ని కలుగజేయగల శక్తి దేవునికి ఉందని నేను మీతో చెబుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మారుమనస్సుకు తగిన ఫలాన్ని కనబరచండి’ లేదా ‘మారుమనస్సుకు అనుగుణమైన ఫలాలను కనబరచండి.’ గ్రీకులో ‘ఫలాలు’ బహువచనంలో ఉంది; నిజమైన మారుమనస్సుకు సరిపోయే ప్రవర్తనను ఇది నొక్కి చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మీ అంతరంగంలో’ లేదా ‘ఒకరితో ఒకరు.’ ఈ పదబంధం మనసులో అనుకోవడాన్నిగానీ, తమ సమూహంలో పరస్పరం చెప్పుకోవడాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε οὖν
  choice: కాబట్టి ... ఫలించండి
  rationale: οὖν ముందున్న హెచ్చరికనుంచి వచ్చే నిర్ధారణను సూచిస్తుంది. ποιέω + καρπούς అనే గ్రీకు ప్రయోగానికి తెలుగులో ‘ఫలాలు ఫలించండి’ సహజంగా ఉండి ఆజ్ఞ తీవ్రతను నిలుపుతుంది.
- source_word: καρποὺς ἀξίους τῆς μετανοίας
  choice: మారుమనస్సుకు తగిన ఫలాలు
  rationale: καρπούς అనే బహువచనాన్ని ‘ఫలాలు’గా ఉంచి, ἀξίους సూచించే అనురూపతను ‘తగిన’తో వ్యక్తం చేసింది. μετάνοιαను కేవలం మానసిక అభిప్రాయ మార్పుగా కుదించకుండా, నైతిక-ఆధ్యాత్మిక మళ్లింపును తెలిపే ‘మారుమనస్సు’గా అనువదించింది.
- source_word: μὴ ἄρξησθε λέγειν
  choice: చెప్పుకోవడం మొదలుపెట్టవద్దు
  rationale: ‘మొదలుపెట్టవద్దు’ మూలంలోని ἄρξησθε బలాన్ని స్పష్టంగా నిలుపుతుంది; ఆత్మసమర్థనగా ఈ మాటను చెప్పుకోవద్దనే హెచ్చరికను సహజ తెలుగులో అందిస్తుంది.
- source_word: ἐν ἑαυτοῖς
  choice: మీలో మీరు
  rationale: ఈ పదబంధం అంతరంగ స్వగతాన్నీ, తమ సమూహంలో పరస్పరం చెప్పుకోవడాన్నీ సూచించవచ్చు. ‘మీలో మీరు’ ఈ రెండింటికీ చోటు ఇస్తూ మూలంలోని సందిగ్ధతను కాపాడుతుంది.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: అబ్రాహాము మాకు తండ్రిగా ఉన్నాడు
  rationale: అబ్రాహాముతో తమ వంశసంబంధాన్ని భద్రతకు ఆధారంగా చూపే వాదనను సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ἐγεῖραι τέκνα τῷ Ἀβραάμ
  choice: అబ్రాహాముకు పిల్లలను పుట్టించగలడు
  rationale: ἐγείρω ఇక్కడ ఉనికిలోకి తేవడం లేదా సంతానాన్ని కలుగజేయడం అనే భావాన్ని కలిగి ఉంది. ‘పుట్టించగలడు’ ఆ భావాన్ని తెలుగులో సహజంగా అందిస్తుంది; ‘లేపగలడు’ అనే అక్షరార్థ రూపం ఇక్కడ అపార్థానికి దారితీయవచ్చు.
- source_word: ἐκ τῶν λίθων τούτων
  choice: ఈ రాళ్లనుంచి
  rationale: ἐκ సూచించే మూలం లేదా ఆరంభస్థానాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: మారుమనస్సుకు తగిన ఫలాల అర్థం
  choice: నిజమైన మారుమనస్సుకు అనుగుణంగా ఉండే, దానిని వెల్లడించే ప్రవర్తన
  alternative: ‘మారుమనస్సుకు యోగ్యమైన ఫలం’ లేదా ‘మారుమనస్సుకు అనుగుణమైన ఫలాలు’
  rationale: గ్రీకు పదబంధం మారుమనస్సు మరియు ప్రవర్తన మధ్య తగిన అనురూపతను నొక్కి చెబుతుంది. ఈ అనువాదం క్రియలు క్షమాపణను సంపాదిస్తాయని చేర్చకుండా ఆ నైతిక ఉద్రిక్తతను నిలుపుతుంది.
- issue: అబ్రాహాము సంతానమనే వంశపారంపర్య హక్కు
  choice: దేవుని ఎదుట భద్రతకు శారీరక వంశసంబంధమే సరిపోతుందనే నమ్మకాన్ని యోహాను తిరస్కరిస్తున్నాడు
  alternative: అబ్రాహాముతో ఉన్న శారీరక వంశసంబంధానికే ఎలాంటి ప్రాముఖ్యత లేదని విస్తరించి చెప్పడం
  rationale: వచనం వంశగర్వాన్ని సవాలు చేస్తూ, అబ్రాహాముకు పిల్లలను కలుగజేయడంలో దేవుని స్వాతంత్ర్యాన్నీ శక్తినీ ప్రకటిస్తుంది; దానికంటే విస్తృతమైన సిద్ధాంత నిర్ణయాన్ని అనువాదంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. ‘మారుమనస్సు’ బైబిలు వాడుకలో స్థిరపడిన పదమైనప్పటికీ, దాని నైతిక-ఆధ్యాత్మిక మళ్లింపు భావం సందర్భం మరియు పాదసూచిక ద్వారా స్పష్టమవుతుంది.
