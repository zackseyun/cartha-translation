revisions:
- from: కాబట్టి మారుమనస్సుకు తగిన ఫలాలు ఫలించండి.[a] ‘అబ్రాహాము మాకు తండ్రిగా ఉన్నాడు’ అని మీలో మీరు చెప్పుకోవడం మొదలుపెట్టవద్దు.[b] ఎందుకంటే, దేవుడు ఈ రాళ్లనుంచి అబ్రాహాముకు పిల్లలను పుట్టించగలడని మీతో చెబుతున్నాను.
  to: కాబట్టి మారుమనస్సుకు తగిన ఫలాలను కనబరచండి[a]; ‘అబ్రాహాము మాకు తండ్రిగా ఉన్నాడు’ అని మీలో మీరు చెప్పుకోవడం మొదలుపెట్టవద్దు[b]. ఎందుకంటే, ఈ రాళ్లనుంచి అబ్రాహాముకు సంతానాన్ని కలుగజేయగల శక్తి దేవునికి ఉందని నేను మీతో చెబుతున్నాను.
  rationale: The revision improves idiomatic modern Telugu while preserving the Greek plural ‘fruits,’ the imperative force, and the deliberate ambiguity of ἐν ἑαυτοῖς. It also renders God’s raising up children for Abraham in a way that is natural and does not add a specific biological implication. Footnote anchors and both alternative senses remain intact.
