translation:
  language: te
  text: ఈ విధంగా, యోహాను అనేక ఇతర ఉపదేశాలతో ప్రబోధిస్తూ, ప్రజలకు శుభవార్తను ప్రకటించేవాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అనేక ఇతర విషయాలతో ప్రబోధిస్తూ.” గ్రీకులో ‘అనేక’ అనే పదానికి సంబంధించిన నామవాచకం స్పష్టంగా చెప్పబడలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ ... καὶ ἕτερα
  choice: ఇంకా అనేక విధాలుగా
  rationale: నపుంసక బహువచన విశేషణాలు నామవాచకాలుగా వాడబడ్డాయి; వాటి కర్మ గ్రీకులో స్పష్టంగా లేదు. తెలుగు సహజత్వం కోసం దానిని ‘అనేక విధాలుగా’ అని వ్యక్తపరుస్తూ, ప్రత్యామ్నాయ నిర్మాణాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: μὲν οὖν
  choice: కాబట్టి
  rationale: ముందటి వాక్యాలతో కొనసాగింపును, సంగ్రహాత్మక పరివర్తనను సూచిస్తుంది; తెలుగులో ‘కాబట్టి’ ఈ ప్రవాహాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: παρακαλῶν
  choice: ప్రోత్సహిస్తూ
  rationale: παρακαλέωకు ప్రోత్సహించడం, బోధించడం, బలంగా కోరడం వంటి భావాలు ఉన్నాయి. ఇక్కడ యోహాను చేసిన నైతిక పిలుపులో ఆదరణతో కూడిన ప్రేరణను ‘ప్రోత్సహిస్తూ’ నిలుపుతుంది.
- source_word: εὐηγγελίζετο
  choice: శుభవార్త ప్రకటిస్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న గత కార్యాన్ని సూచిస్తుంది; ‘శుభవార్త ప్రకటిస్తూ ఉన్నాడు’ ఆ దురేటివ్ భావాన్నీ, శుభవార్త స్వరూపాన్నీ నిలుపుతుంది.
- source_word: τὸν λαόν
  choice: ప్రజలను / వారికి
  rationale: λαόςను విస్తృతంగా ‘ప్రజలు’గా అనువదించాం; వచనంలో లేని ‘ఇశ్రాయేలు ప్రజలు’ లేదా ‘జనం’ అనే పరిమితిని చేర్చలేదు.
theological_decisions:
- issue: యోహాను పరిచర్యకు సంబంధించి εὐηγγελίζετο బలం
  choice: శుభవార్త ప్రకటిస్తూ ఉన్నాడు
  alternative: ప్రసంగిస్తూ ఉన్నాడు / ప్రకటిస్తూ ఉన్నాడు
  rationale: గ్రీకు వచనం యోహాను హెచ్చరికలతో కూడిన సందేశాన్నే శుభవార్త ప్రకటనగా వర్ణిస్తుంది. ఆ అంతర్గత ఉద్రిక్తతను సాధారణ ‘ప్రసంగం’గా చదును చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. యోహాను అనే కర్త సందర్భం ద్వారా తెలిసినా, తెలుగు వాక్యం స్వతంత్రంగా స్పష్టంగా ఉండేందుకు పేరును చేర్చాం.
