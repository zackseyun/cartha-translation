id: LUK.22.56
reference: Luke 22:56
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδοῦσα δὲ αὐτὸν παιδίσκη τις καθήμενον πρὸς τὸ φῶς καὶ ἀτενίσασα αὐτῷ εἶπεν· Καὶ οὗτος σὺν αὐτῷ ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/056.yaml
  text: Then a certain servant girl[a], seeing him seated by the light and looking intently at him, said, “This man also was with him.”
translation:
  language: te
  text: అప్పుడు ఒక పనిపిల్ల, వెలుగు దగ్గర కూర్చున్న అతణ్ణి చూసి, అతణ్ణి తదేకంగా గమనించి, “ఇతడు కూడా అతనితో ఉన్నాడు” అంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοῦσα
  choice: చూసి
  rationale: ὁράω యొక్క భూతకాల క్రియావిశేషణ రూపం పనిపిల్ల పేతురును గమనించడాన్ని సూచిస్తుంది. తెలుగు కథన ప్రవాహంలో ‘చూసి’ సహజంగా ఉంటుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక కథనంలోని తదుపరి ఘట్టాన్ని సూచిస్తుంది.
- source_word: παιδίσκη τις
  choice: ఒక పనిపిల్ల
  rationale: παιδίσκη యువ సేవకురాలు లేదా బానిస బాలికను సూచించగలదు; ఈ సందర్భంలో ఆమె బానిస స్థితిని అతిగా ముందుకు తేవకుండా, τις యొక్క అనిర్దిష్టతను కూడా ఉంచే సహజమైన ఎంపిక ఇది.
- source_word: καθήμενον
  choice: కూర్చున్న
  rationale: పేతురు ఉన్న భంగిమను సహజమైన తెలుగు విశేషణ క్రియారూపంతో తెలియజేస్తుంది.
- source_word: πρὸς τὸ φῶς
  choice: వెలుగు దగ్గర[a]
  rationale: πρός ఇక్కడ వెలుగు మూలానికి సమీప స్థానాన్ని లేదా వెలుతురు పడే ప్రదేశాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో స్థాన సంబంధాన్ని నేరుగా ఉంచి, మరో సాధ్యార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: ἀτενίσασα αὐτῷ
  choice: అతని వైపు తదేకంగా చూస్తూ
  rationale: ἀτενίζω కేంద్రీకృతంగా, నిశితంగా చూడడాన్ని సూచిస్తుంది; ‘తదేకంగా’ ఆ బలాన్ని సహజంగా అందిస్తుంది.
- source_word: Καὶ οὗτος
  choice: ఇతడు కూడా
  rationale: οὗτος యొక్క చూపించే బలాన్ని ‘ఇతడు’, καί యొక్క సమ్మిళిత భావాన్ని ‘కూడా’ తెలియజేస్తాయి.
- source_word: σὺν αὐτῷ ἦν
  choice: అతనితో ఉన్నాడు
  rationale: సహవాసం లేదా తోడుగా ఉండడాన్ని సూచించే σύν + దత్తి నిర్మాణానికి సరళమైన, నేరమైన అనువాదం.
