  to: అప్పుడు ఒక పనిపిల్ల, వెలుగు దగ్గర కూర్చున్న అతణ్ణి చూసి, అతణ్ణి తదేకంగా గమనించి, “ఇతడు కూడా అతనితో ఉన్నాడు” అంది.
