translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలిని వాడాం. ‘పనిపిల్ల’ యువ మహిళా సేవకురాలు అనే మూలపద భావాన్ని ఉంచుతుంది. చివరి వాక్యంలో మూలంలోని సాధారణ సర్వనామాన్ని అనుసరించి ‘అతనితో’ అని వాడాం; మూలంలో లేని గౌరవ సూచక రూపాన్ని చేర్చలేదు.
