id: LUK.22.35
reference: Luke 22:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἶπεν αὐτοῖς· Ὅτε ἀπέστειλα ὑμᾶς ἄτερ βαλλαντίου καὶ πήρας καὶ ὑποδημάτων, μή τινος ὑστερήσατε; οἱ δὲ εἶπαν· Οὐθενός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/035.yaml
  text: And he said to them[a], “When I sent you out without a money bag and a travel bag and sandals, did you lack anything?” And they said, “Nothing.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “నేను మిమ్మల్ని డబ్బు సంచీ, ప్రయాణపు సంచీ[a], చెప్పులు లేకుండా పంపినప్పుడు, మీకు ఏదైనా కొరత కలిగిందా?” వారు “ఏమీ లేదు” అన్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వీపు సంచీ.”
    reason: πήρα అనే పదం ప్రయాణ సామగ్రి లేదా ఆహారం తీసుకెళ్లే సంచిని సూచించగలదు; దాని ఖచ్చిత రూపం నిర్దిష్టం కాదు.
lexical_decisions:
- source_word: ἄτερ
  choice: లేకుండా
  rationale: ఏదైనా వెంట లేకపోవడాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: βαλλαντίου
  choice: డబ్బు సంచీ
  rationale: డబ్బు తీసుకెళ్లే చిన్న సంచిని స్పష్టంగా సూచిస్తుంది; ఆధునిక పాఠకులకు సులభంగా అర్థమవుతుంది.
- source_word: πήρας
  choice: ప్రయాణపు సంచీ
  rationale: ప్రయాణంలో అవసరమైన వస్తువులు లేదా ఆహారం తీసుకెళ్లే సంచి అనే సందర్భార్థాన్ని సహజంగా వ్యక్తపరుస్తుంది; ఖచ్చితమైన ఆకారాన్ని అనవసరంగా నిర్ధారించదు.
- source_word: ὑποδημάτων
  choice: చెప్పులు
  rationale: పాదరక్షలను సూచించే సహజమైన సాధారణ తెలుగు పదం; ప్రాచీన ప్రయాణ సందర్భానికి సరిపోతుంది.
- source_word: μή τινος ὑστερήσατε
  choice: మీకు ఏమైనా కొదువ కలిగిందా?
  rationale: μή వల్ల ప్రతికూల సమాధానం ఆశించబడుతున్న ప్రశ్నను బలవంతంగా వెల్లడించకుండా, ὑστερέω యొక్క కొరత లేదా లోటు భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: Οὐθενός
  choice: ఏదీ లేదు
  rationale: గ్రీకులోని సంక్షిప్త సమాధానాన్ని తెలుగులో సహజంగా, అదే సంక్షిప్తతతో అందిస్తుంది.
- source_word: ἀπέστειλα
  choice: పంపినప్పుడు
  rationale: శిష్యులను కార్యనిమిత్తం పంపిన భావం సందర్భంలో స్పష్టంగా ఉంది; తెలుగులో అనవసర పదభారం లేకుండా మూల క్రియను అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. మూలంలోని ప్రశ్న-సమాధాన సంక్షిప్తతను నిలుపుతూ, ప్రయాణ సామగ్రికి సహజమైన తెలుగు పదాలు ఎంచుకోబడ్డాయి.
