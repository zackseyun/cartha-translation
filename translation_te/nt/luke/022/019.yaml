  text: καὶ λαβὼν ἄρτον εὐχαριστήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς λέγων· Τοῦτό ἐστιν τὸ σῶμά μου ⸂[τὸ ὑπὲρ ὑμῶν διδόμενον· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/019.yaml
  text: And taking bread[a], after giving thanks he broke it and gave it to them, saying, “This is my body, which is given for you[c][b]. Keep doing this in remembrance of me.”
translation:
  language: te
  text: 'ఆయన రొట్టెను తీసుకొని, కృతజ్ఞతలు తెలిపి, దాన్ని విరిచి వారికి ఇచ్చి ఇలా అన్నాడు: “ఇది నా శరీరం[c]; ఇది మీ కోసం ఇవ్వబడుతున్నది[b]. దీన్ని నా జ్ఞాపకార్థం చేస్తూ ఉండండి.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో “ఇది మీ కోసం ఇవ్వబడుతున్నది. దీన్ని నా జ్ఞాపకార్థం చేస్తూ ఉండండి” అనే మాటలు లేవు.
    reason: textual_variant
  - marker: b
    text: లేదా “మీ కోసం ఇవ్వబడేది.”
    reason: lexical_alternative
  - marker: c
    text: “ఇది నా శరీరం” అని మూలంలో ఉన్నట్లే అనువదించబడింది. కొందరు దీన్ని “ఇది నా శరీరాన్ని సూచిస్తుంది” అని అర్థం చేసుకుంటారు; అయితే గ్రీకు పాఠంలో “ఉంది” అనే నేర అనుసంధాన క్రియ ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν ἄρτον
  choice: రొట్టెను తీసుకొని
  rationale: గ్రీకు భూతకాల అసమాపక క్రియ సూచించే చర్యల క్రమాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: εὐχαριστήσας
  choice: కృతజ్ఞతలు తెలిపి
  rationale: రొట్టెను విరవడానికి ముందు జరిగిన కృతజ్ఞతా చర్యను తెలియజేస్తుంది; గ్రీకులో స్పష్టంగా లేని కర్మను అనువాదంలో చేర్చదు.
- source_word: ἔκλασεν καὶ ἔδωκεν αὐτοῖς
  choice: దాన్ని విరిచి వారికి ఇచ్చి
  rationale: రొట్టెను సూచించే కర్మను తెలుగులో స్పష్టంగా ఉంచి, వరుస చర్యలను సహజంగా కలుపుతుంది.
- source_word: Τοῦτό ἐστιν τὸ σῶμά μου
  choice: ఇది నా శరీరం
  rationale: ἐστιν అనే అనుసంధాన క్రియను ‘అయి సూచిస్తుంది’ లేదా ‘ప్రతీక’గా వ్యాఖ్యానించకుండా, మూలంలోని నేర ప్రకటనను కాపాడుతుంది.
- source_word: τὸ ὑπὲρ ὑμῶν διδόμενον
  choice: మీ కోసం ఇవ్వబడుతున్నది
  rationale: వర్తమాన కర్మణి కృదంతంలోని కొనసాగుతున్న భావాన్ని, అలాగే ὑπέρ యొక్క ప్రయోజనార్థక విస్తృతిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοῦτο ποιεῖτε
  choice: దీన్ని చేస్తూ ఉండండి
  rationale: వర్తమాన ఆజ్ఞార్థక రూపం సూచించగల పునరావృత లేదా కొనసాగుతున్న ఆచరణను తెలుగులో కనిపించేలా చేస్తుంది.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: నన్ను జ్ఞాపకం చేసుకోవడానికి
  rationale: వ్యక్తిగత స్మరణకే పరిమితం చేయకుండా, జ్ఞాపకార్థంగా జరిగే చర్యను సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రభుభోజన సందర్భంలో ‘ఇది నా శరీరం’ అనే మాట అర్థం
  choice: ‘ఇది నా శరీరం’ అనే నేరమైన వాక్యరూపాన్ని నిలిపాము.
  alternative: ‘ఇది నా శరీరాన్ని సూచిస్తుంది’ లేదా ‘ఇది నా శరీరానికి ప్రతీక’
  rationale: గ్రీకు పాఠం ἐστιν (‘ఉంది/అయి ఉంది’) అనే నేర అనుసంధానాన్ని వాడుతుంది. దాని భావాన్ని ఒక నిర్దిష్ట ప్రభుభోజన సిద్ధాంతానికి అనుగుణంగా అనువాదంలోనే నిర్ణయించలేదు.
- issue: లూకా 22:19లో దీర్ఘ పాఠభేదం
  choice: కోష్ఠకాల్లో ఉన్న దీర్ఘ భాగాన్ని ప్రధాన పాఠంలో చేర్చాము.
  alternative: ‘ఇది నా శరీరం’తో వచనాన్ని ముగించే సంక్షిప్త పాఠం
  rationale: ఇచ్చిన SBLGNT పాఠంలో దీర్ఘ భాగం పాఠసంబంధ సందేహాన్ని సూచించే గుర్తుతో ఉన్నప్పటికీ ప్రధాన పాఠంగా ముద్రించబడింది; ముఖ్యమైన సంక్షిప్త పాఠభేదాన్ని పాదసూచికలో తెలిపాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కథన శైలిని వాడాము. సంప్రదాయబద్ధమైన ‘చేయుడి’కి బదులుగా ‘చేస్తూ ఉండండి’ అని ఇచ్చి వర్తమాన ఆజ్ఞార్థకంలోని పునరావృత భావాన్ని వెల్లడించాము; ఏ ప్రత్యేక సంఘ సంప్రదాయ పదజాలాన్నీ చేర్చలేదు.
