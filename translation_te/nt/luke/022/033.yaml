  to: 'అయితే అతడు ఆయనతో ఇలా అన్నాడు: “ప్రభువా, జైలుకైనా, మరణానికైనా నీతోపాటు వెళ్లడానికి నేను సిద్ధంగా ఉన్నాను.”'
  rationale: The revision replaces a comparatively dated term for prison with the modern-standard ‘జైలు’ and smooths the quotation introduction. It retains the mild contrast of δέ, the respectful direct address ‘ప్రభువా,’ Peter’s readiness, accompaniment with Jesus, and the parallel willingness to go to prison and to death. No footnote is needed.
