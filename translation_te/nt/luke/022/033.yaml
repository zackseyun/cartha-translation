id: LUK.22.33
reference: Luke 22:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Κύριε, μετὰ σοῦ ἕτοιμός εἰμι καὶ εἰς φυλακὴν καὶ εἰς θάνατον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/033.yaml
  text: But he said to him, “Lord, I am ready to go with you both to prison and to death.”
translation:
  language: te
  text: 'అయితే అతడు ఆయనతో ఇలా అన్నాడు: “ప్రభువా, జైలుకైనా, మరణానికైనా నీతోపాటు వెళ్లడానికి నేను సిద్ధంగా ఉన్నాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: అయితే అతడు
  rationale: ὁ ఇక్కడ మునుపు ప్రస్తావించిన పేతురును సూచించే సర్వనామార్థక ప్రయోగం; δέ యేసు మునుపు చెప్పిన మాటకు పేతురు ఇచ్చిన విరుద్ధ ధీమాభరిత ప్రతిస్పందనను సున్నితంగా చూపుతుంది.
- source_word: εἶπεν αὐτῷ
  choice: ఆయనతో ... అన్నాడు
  rationale: αὐτῷ యొక్క పరోక్ష కర్మ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతూ, గౌరవార్థక ‘ఆయన’ సందర్భంలోని యేసును సూచిస్తుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: యేసును నేరుగా సంబోధించే κύριεకు గౌరవాన్ని, బిరుదులోని దైవశాస్త్రీయ ప్రతిధ్వనిని రెండింటినీ కాపాడే సాధారణ తెలుగు రూపం.
- source_word: μετὰ σοῦ
  choice: నీతోపాటు
  rationale: μετά + షష్ఠీ విభక్తి సహవాసాన్ని సూచిస్తుంది; ‘నీతోపాటు’ పేతురు యేసుతో కలిసి వెళ్లాలనే భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἕτοιμός εἰμι
  choice: నేను సిద్ధంగా ఉన్నాను
  rationale: సన్నద్ధతతోపాటు స్వచ్ఛంద అంగీకారాన్ని తెలిపే గ్రీకు ప్రయోగానికి నేరమైన, సహజమైన సమానం.
- source_word: καὶ ... καὶ
  choice: '... వెళ్లడానికైనా, ... వెళ్లడానికైనా'
  rationale: జైలు మరియు మరణం అనే రెండు పరిణామాలనూ స్వీకరించేందుకు సిద్ధమనే సమాంతర ఉద్ఘాటనను తెలుగు ‘కైనా ... కైనా’ నిర్మాణం సహజంగా తెలియజేస్తుంది.
- source_word: εἰς φυλακὴν
  choice: చెరసాలకు
  rationale: φυλακή ఇక్కడ కాపలా స్థలంకన్నా నిర్బంధం లేదా జైలును సూచిస్తుంది; ‘చెరసాలకు’ దిశార్థక εἰς భావాన్నీ నిలుపుతుంది.
- source_word: εἰς θάνατον
  choice: మరణానికి
  rationale: మరణం వరకు వెళ్లేందుకు సిద్ధమనే భావాన్ని, చెరసాలతో ఉన్న మూలపాఠ సమాంతర నిర్మాణాన్ని కాపాడుతుంది.
- source_word: πορεύεσθαι
  choice: వెళ్లడానికి
  rationale: సిద్ధతకు పూరకంగా ఉన్న ఈ క్రియకు సందర్భానుగుణమైన సాధారణ తెలుగు రూపం; ప్రయాణం అనే అనవసర ప్రత్యేక భావాన్ని చేర్చదు.
theological_decisions:
- issue: యేసుకు బిరుదుగా κύριος అనువాదం
  choice: ప్రభువు
  alternative: బోధకుడు / యజమాని
  rationale: ‘ప్రభువు’ నేర సంబోధనలోని గౌరవాన్నీ, బిరుదు యొక్క క్రీస్తుసంబంధ ప్రతిధ్వనినీ కాపాడుతుంది; అదే సమయంలో సందర్భం చెప్పిన దానికంటే అధికంగా అర్థాన్ని నిర్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. పేతురు మాటలోని గట్టి స్వీయనమ్మకాన్ని ‘నేను సిద్ధంగా ఉన్నాను’ ద్వారా నిలిపాం. పాదటిప్పణులు అవసరం లేదు.
