translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ముందున్న చర్యకు ప్రతిస్పందనను సూచించే καίను ‘అందుకు’గా వ్యక్తం చేశాం; మిగిలిన రెండు καίల వరుసను తెలుగులో సహజమైన అసమాపక క్రియ నిర్మాణంతో అందించాం.
