id: LUK.22.26
reference: Luke 22:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ οὐχ οὕτως, ἀλλ’ ὁ μείζων ἐν ὑμῖν ⸀γινέσθω ὡς ὁ νεώτερος, καὶ ὁ ἡγούμενος ὡς ὁ διακονῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/026.yaml
  text: But you are not to be like that[a]. Instead, let the greater among you become like the younger[b], and the one who leads like the one who serves.
translation:
  language: te
  text: కానీ మీరు అలా ఉండకూడదు.[a] అందుకు బదులుగా, మీలో గొప్పవాడు చిన్నవానిలా అవ్వాలి; నాయకత్వం వహించేవాడు సేవ చేసేవానిలా ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కానీ మీ విషయంలో అలా కాదు.” గ్రీకు వాక్యం సంక్షిప్తంగా ఉండి, ఇప్పుడే వివరించిన హోదా కోసం తాపత్రయపడే ధోరణికి యేసు శిష్యులు పూర్తి భిన్నంగా ఉండాలని బలంగా సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς δὲ οὐχ οὕτως
  choice: కానీ మీరు అలా ఉండకూడదు
  rationale: ὑμεῖς δὲ అనే బలమైన వ్యత్యాసాన్ని, సందర్భంలో సూచితమైన నిషేధ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ముందటి వచనంలోని అధికార ధోరణినే ‘అలా’ సూచిస్తుంది.
- source_word: ἀλλ’
  choice: అందుకు బదులుగా
  rationale: యేసు చెప్పే ప్రత్యామ్నాయ ప్రవర్తనకు ఉన్న బలమైన వ్యతిరేక మలుపును స్పష్టంగా చూపిస్తుంది.
- source_word: ὁ μείζων ἐν ὑμῖν
  choice: మీలో గొప్పవాడు
  rationale: మείζων యొక్క తులనాత్మక భావాన్ని ‘అందరికంటే గొప్పవాడు’గా అతిశయింపకుండా, సమూహంలో ఉన్నత స్థానం కలవాడనే భావంతో నిలుపుతుంది.
- source_word: γινέσθω
  choice: ఉండాలి
  rationale: గ్రీకు ఆజ్ఞార్థక బలాన్ని సహజమైన తెలుగు విధ్యర్థక రూపంలో అందిస్తుంది; ఇక్కడ కోరబడిన పాత్ర లేదా వైఖరిని స్వీకరించాలనే భావం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: ὡς ὁ νεώτερος
  choice: చిన్నవాడిలా
  rationale: νεώτερος యొక్క తులనాత్మక భావాన్ని నిలుపుతూ, కేవలం వయస్సులో చిన్నవాడనే అర్థంతో పాటు సామాజికంగా జూనియర్ స్థితిని కూడా సందర్భానుసారంగా అనుమతిస్తుంది.
- source_word: ὁ ἡγούμενος
  choice: నాయకత్వం వహించేవాడు
  rationale: సమాజంలో ముందుండి నడిపించే వ్యక్తిని సూచిస్తుంది; కఠినమైన రాజకీయ పాలనను గానీ, తరువాతి కాలపు సంస్థాగత పదవిని గానీ అనవసరంగా దిగుమతి చేయదు.
- source_word: ὡς ὁ διακονῶν
  choice: సేవ చేసేవాడిలా
  rationale: διακονῶν లోని క్రియాశీల సేవాభావాన్ని నిలుపుతుంది; సంస్థాగతమైన ‘పరిచారకుడు’ వంటి పదం కంటే సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
theological_decisions:
- issue: హోదా మరియు నాయకత్వంపై యేసు బోధ స్వభావం
  choice: శిష్యుల సమాజంలో ఉన్నత హోదాను వినయపూర్వక సేవగా తలకిందులు చేసే నైతిక పిలుపుగా అనువదించడం
  alternative: పదవి, పాలన లేదా సంఘ సంస్థాగత అధికారాన్ని మరింత బలంగా సూచించే భాష వాడడం
  rationale: గ్రీకు వాక్యం ‘గొప్పవాడు’ మరియు ‘నాయకత్వం వహించేవాడు’ అనే వారిని ‘చిన్నవాడు’ మరియు ‘సేవ చేసేవాడు’తో పోలుస్తుంది. అందువల్ల వినయసేవకు పిలుపును నిలుపుతూ, తరువాతి సంఘ వ్యవస్థలను వచనంలోకి చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మీలో గొప్పవాడు’ తులనాత్మక సామాజిక హోదాను, ‘నాయకత్వం వహించేవాడు’ సంస్థాగత ప్రత్యేకార్థం లేకుండా నాయకత్వాన్ని, ‘సేవ చేసేవాడు’ క్రియాశీల సేవను తెలియజేస్తాయి.
