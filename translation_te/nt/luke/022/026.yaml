review_pass:
  verdict: revise
  source_fidelity: The main sense and contrast are accurate. However, γινέσθω is a present imperative meaning ‘become’/‘come to be’; rendering it as ‘ఉండాలి’ weakens this dynamic nuance. ‘చిన్నవాడు’ appropriately retains the comparative ‘younger’ and can carry the contextual implication of junior status, which should be clarified in a footnote.
  naturalness: The draft is clear modern standard Telugu. Replacing ‘ఉండాలి’ with ‘అవ్వాలి’ in the first comparison is equally natural and better reflects the Greek. The parallel second clause remains idiomatic.
  terminology: ‘గొప్పవాడు,’ ‘నాయకత్వం వహించేవాడు,’ and ‘సేవ చేసేవాడు’ are suitable, non-institutional renderings of the Greek expressions. The footnote preserves the social-status aspect of ‘చిన్నవాడు’ without replacing its age-related comparative sense in the text.
  issues:
  - severity: low
    issue: The rendering ‘ఉండాలి’ for γινέσθω does not explicitly express becoming.
    rationale: γινέσθω is an imperative of γίνομαι. ‘అవ్వాలి’ preserves the call to take on the posture of the junior person more closely.
  - severity: low
    issue: The cultural nuance of ὁ νεώτερος lacks the corresponding footnote.
    rationale: In context, ‘the younger’ denotes not only age but the socially junior person. A brief note helps prevent an exclusively age-based reading.
  revised_text: కానీ మీరు అలా ఉండకూడదు.[a] అందుకు బదులుగా, మీలో గొప్పవాడు చిన్నవానిలా అవ్వాలి; నాయకత్వం వహించేవాడు సేవ చేసేవానిలా ఉండాలి.
