revisions:
- from: కానీ మీరు అలా ఉండకూడదు.[a] అందుకు బదులుగా, మీలో గొప్పవాడు చిన్నవాడిలా ఉండాలి; నాయకత్వం వహించేవాడు సేవ చేసేవాడిలా ఉండాలి.
  to: కానీ మీరు అలా ఉండకూడదు.[a] అందుకు బదులుగా, మీలో గొప్పవాడు చిన్నవానిలా అవ్వాలి; నాయకత్వం వహించేవాడు సేవ చేసేవానిలా ఉండాలి.
  rationale: ‘అవ్వాలి’ ద్వారా γινέσθω యొక్క ఆజ్ఞార్థక, పరివర్తనాత్మక భావాన్ని స్పష్టంగా నిలిపాం. ‘చిన్నవానిలా’ అనేది νεώτερος యొక్క తులనాత్మక పదప్రయోగాన్ని సహజంగా కాపాడుతుంది; దాని సామాజిక అర్థసూచనను ఫుట్‌నోట్‌లో వివరించాం. ఇతర పదప్రయోగాలు మూలానికి నమ్మకంగా, ఆధునిక తెలుగులో సహజంగా ఉన్నాయి.
