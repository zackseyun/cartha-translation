source:
  edition: SBLGNT
  text: Ἦλθεν δὲ ἡ ἡμέρα τῶν ἀζύμων, ⸀ᾗ ἔδει θύεσθαι τὸ πάσχα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/007.yaml
  text: Then the day of Unleavened Bread came[a], on which the Passover had to be sacrificed.
translation:
  language: te
  text: అప్పుడు పులియని రొట్టెల పండుగ రోజు వచ్చింది. ఆ రోజున పస్కా[a]ను బలిగా అర్పించవలసి ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పస్కా గొర్రెపిల్లను”; లేదా, “పస్కా బలిని.” గ్రీకు పదం పస్కా ఆచరణను సూచించవచ్చు; ఈ సందర్భంలో అది ప్రత్యేకంగా బలిపశువును సూచిస్తుంది.
    reason: πάσχα పదంలోని సందర్భానుసారమైన అర్థభేదాన్ని ప్రధాన పాఠ్యంలో అతిగా నిర్దిష్టం చేయకుండా తెలియజేయడం.
lexical_decisions:
- source_word: Ἦλθεν
  choice: వచ్చింది
  rationale: కాలం లేదా రోజు రావడాన్ని సూచించే గ్రీకు ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి పరిణామాన్ని సూచిస్తుంది; సందర్భంలో కేవలం వ్యతిరేక భావం లేదు.
- source_word: ἡ ἡμέρα τῶν ἀζύμων
  choice: పులియని రొట్టెల పండుగ రోజు
  rationale: గ్రీకులోని ఏకవచన ‘రోజు’ను నిలుపుతూ, ‘పులియనివి’ అనే సంక్షిప్త నామానికి పండుగసంబంధ అర్థాన్ని సాధారణ పాఠకునికి స్పష్టం చేస్తుంది.
- source_word: ᾗ
  choice: ఆ రోజున
  rationale: ముందున్న ‘రోజు’ను తిరిగి సూచించే కాలార్థక సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἔδει
  choice: అర్పించవలసి ఉండేది
  rationale: పండుగ నియమానుసారమైన అవసరాన్ని సూచించే అసంపూర్ణ భూతకాల భావాన్ని తెలుగులో తెలియజేస్తుంది.
- source_word: θύεσθαι
  choice: బలిగా అర్పించబడటం
  rationale: కేవలం వధించడం కాక, ఆచారబద్ధమైన బలి సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది; వాక్యంలో సహజత్వం కోసం ‘బలిగా అర్పించవలసి’గా రూపాంతరం చెందింది.
- source_word: τὸ πάσχα
  choice: పస్కా
  rationale: మూలంలోని విస్తృతార్థక పండుగపదాన్ని నిలుపుతుంది; ఈ సందర్భంలో బలిపశువు అనే నిర్దిష్ట భావాన్ని క్రియ మరియు పాదసూచిక తెలియజేస్తాయి.
theological_decisions:
- issue: బలి సందర్భంలో τὸ πάσχα దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘పస్కా’ అని ఉంచి, బలి భావాన్ని ‘బలిగా అర్పించవలసి’ ద్వారా తెలియజేయడం.
  alternative: ‘పస్కా గొర్రెపిల్ల’ లేదా ‘పస్కా బలి’
  rationale: πάσχα పండుగను, భోజనాన్ని, లేదా బలిపశువును సూచించగలదు. θύεσθαι ఇక్కడ బలి భావాన్ని నిర్ధారించినా, ‘గొర్రెపిల్ల’ అని ప్రధాన పాఠ్యంలో చేర్చడం మూలంలో లేని నిర్దిష్టతను పెంచుతుంది. అందువల్ల ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకునికి స్పష్టంగా ఉండేలా ‘పులియనివి’కి బదులు ‘పులియని రొట్టెల పండుగ’ వాడబడింది. ‘పస్కా’ అనే స్థిరమైన బైబిలు పదం నిలుపబడింది. గంభీరతను కాపాడుతూ వాక్యాన్ని రెండు భాగాలుగా విభజించడం ద్వారా సహజమైన తెలుగు ప్రవాహం సాధించబడింది.
