id: LUK.22.4
reference: Luke 22:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀπελθὼν συνελάλησεν τοῖς ἀρχιερεῦσιν καὶ στρατηγοῖς τὸ πῶς ⸂αὐτοῖς παραδῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/004.yaml
  text: And he went away and discussed with the chief priests and officers how he might hand him over to them[a][b].
translation:
  language: te
  text: అతడు వెళ్లి, ప్రధాన యాజకులతోనూ అధికారులతోనూ ఆయనను వారికి ఎలా అప్పగించాలో చర్చించాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనకు ద్రోహం చేయడం.” గ్రీకు క్రియకు “అప్పగించడం,” “ఇతరుల చేతికి ఇవ్వడం,” లేదా ఈ సందర్భంలో “ద్రోహం చేయడం” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి “అధికారులు” బహుశా ఆలయ అధికారులు లేదా ఆలయ కాపలా దళానికి చెందినవారు; రోమా సైనికులు కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπελθὼν
  choice: వెళ్లి
  rationale: ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచించే గ్రీకు భూతకాల కృదంతాన్ని తెలుగులో సహజమైన పూర్వకాలిక క్రియారూపంతో వ్యక్తం చేస్తుంది.
- source_word: συνελάλησεν
  choice: చర్చించాడు
  rationale: కేవలం మాట్లాడడమే కాక, కలిసి ఆలోచించి సంప్రదించిన భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἀρχιερεῦσιν
  choice: ప్రధాన యాజకులు
  rationale: ఇది ఒకే ప్రధాన యాజకుని పదవిని కాక, ప్రముఖ యాజక అధికారుల సమూహాన్ని సూచిస్తుంది.
- source_word: στρατηγοῖς
  choice: అధికారులు
  rationale: ఈ సందర్భంలో రోమా సైనికాధికారులకన్నా ఆలయ భద్రతతో సంబంధమున్న అధికారులను సూచించే విస్తృతమైన పదం; సందర్భ విశేషం పాదసూచికలో ఇవ్వబడింది.
- source_word: τὸ πῶς
  choice: ఎలా … అనే విషయం గురించి
  rationale: చర్చలోని విషయాన్ని పరిచయం చేసే గ్రీకు నుడికారాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παραδῷ
  choice: అప్పగించాలనే
  rationale: క్రియ యొక్క ప్రాథమిక భావమైన ‘ఇతరుల చేతికి అప్పగించడం’ను నిలుపుతుంది; ఈ సందర్భంలోని ‘ద్రోహం చేయడం’ అనే భావాన్ని పాదసూచికలో సూచిస్తుంది.
- source_word: αὐτοῖς ... αὐτόν
  choice: ఆయనను వారికి
  rationale: కర్మ అయిన యేసును గౌరవార్థక ఏకవచనంతో, స్వీకర్తలైన ప్రధాన యాజకులు మరియు అధికారులను బహువచనంతో స్పష్టంగా వేరు చేస్తుంది.
theological_decisions:
- issue: యూదా చర్యలో παραδῷ అనువాదం
  choice: ఆయనను వారికి అప్పగించడం
  alternative: ఆయనకు ద్రోహం చేయడం
  rationale: సందర్భం యూదా ద్రోహాన్ని స్పష్టంగా సూచించినప్పటికీ, గ్రీకు క్రియకు ‘అప్పగించడం’ అనే విస్తృతమైన అర్థం ఉంది. ప్రధాన పాఠం ఆ పదార్థాన్ని నిలుపుతూ, సందర్భానుగుణ ప్రత్యామ్నాయాన్ని పాదసూచికలో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘ఆయనను’ అనే రూపం యేసును సూచించడంలో సాధారణ తెలుగు బైబిల్ గౌరవశైలిని పాటిస్తుంది; ‘అధికారులు’ అనే పదంలోని సందర్భ విశేషాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
