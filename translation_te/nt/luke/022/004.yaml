revisions:
- from: అతడు వెళ్లి, ఆయనను వారికి ఎలా అప్పగించాలనే విషయం గురించి ప్రధాన యాజకులతోనూ అధికారులతోనూ చర్చించాడు[a][b].
  to: అతడు వెళ్లి, ప్రధాన యాజకులతోనూ అధికారులతోనూ ఆయనను వారికి ఎలా అప్పగించాలో చర్చించాడు[a][b].
  rationale: 'The revision removes only an avoidable Telugu circumlocution and keeps every source-text relation intact: Judas goes away, confers with both groups, and discusses how to hand Jesus over to them. Footnote anchors and their content are retained.'
