  text: But if I ask[a], you will certainly not answer.
translation:
  language: te
  text: కానీ నేను అడిగితే, మీరు ఎంతమాత్రమూ జవాబు ఇవ్వరు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: అడిగినా
  rationale: ἐὰν తో కూడిన షరతును తెలుగులో సహజంగా ‘-ఇనా’ రూపంలో వ్యక్తం చేస్తుంది; ఇక్కడ సందర్భానుసారంగా ‘ఒకవేళ’ అని విడిగా చేర్చాల్సిన అవసరం లేదు.
- source_word: δὲ
  choice: కానీ
  rationale: ముందున్న మాటతో ఉన్న వ్యతిరేక భావాన్ని స్పష్టంగా చూపిస్తుంది.
- source_word: ἐρωτήσω
  choice: నేను మిమ్మల్ని అడిగినా
  rationale: ἐρωτάω యొక్క విస్తృతమైన ‘అడుగు/ప్రశ్నించు’ భావాన్ని సహజంగా అందిస్తుంది; శత్రుత్వపూరిత విచారణ అనే అదనపు భావాన్ని చేర్చదు. క్రియలో అంతర్లీనంగా ఉన్న కర్మను సందర్భం ప్రకారం ‘మిమ్మల్ని’ అని స్పష్టం చేసింది.
- source_word: οὐ μὴ
  choice: ఎంతమాత్రమూ ... జవాబివ్వరు
  rationale: οὐ μή యొక్క బలమైన నిరాకరణను ఆధునిక, సహజమైన తెలుగులో నిలుపుతుంది; కేవలం ‘జవాబివ్వరు’ కంటే నిశ్చయాత్మక బలం ఎక్కువగా ఉంటుంది.
- source_word: ἀποκριθῆτε
  choice: జవాబివ్వరు
  rationale: న్యాయసభ సంభాషణ సందర్భంలో ‘answer/respond’ అనే అర్థాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. మూలంలోని సంక్షిప్తతను, షరతును, బలమైన నిరాకరణను నిలిపింది.
