translation:
  language: te
  text: అయితే నా శోధనలలో[a] నాతో నిలిచి ఉన్నవారు మీరే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా ప్రలోభాలలో,’ లేదా ‘నా పరీక్షలలో.’ గ్రీకు పదం ప్రలోభాన్ని, పరీక్షను, లేదా కష్టపరిస్థితిని సూచించగలదు; ఇక్కడ అది బహుశా యేసు ఎదుర్కొన్న కఠిన పరిస్థితులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: మీరే
  rationale: వాక్యారంభంలోని బహువచన సర్వనామానికి ఉన్న ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో ‘మీరే’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: δέ
  choice: అయితే
  rationale: ముందటి సందర్భంతో ఉన్న వ్యత్యాసాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: οἱ διαμεμενηκότες
  choice: నిలిచి ఉన్నవారు
  rationale: διαμένω యొక్క పరిపూర్ణకాల కృదంతం గతంలో మొదలై ఇప్పటివరకు కొనసాగిన స్థిరత్వాన్ని సూచిస్తుంది; ‘నిలిచి ఉన్నవారు’ ఆ కొనసాగింపునూ వ్యక్తుల సమూహాన్ని సూచించే రూపాన్నీ కాపాడుతుంది.
- source_word: μετ’ ἐμοῦ
  choice: నాతో
  rationale: సహవాసం లేదా తోడుగా ఉండడాన్ని సూచించే μετά + షష్ఠీ విభక్తికి సహజమైన తెలుగు సమానం.
- source_word: ἐν τοῖς πειρασμοῖς μου
  choice: నా శోధనలలో
  rationale: πειρασμός పరీక్ష, కష్టపరిస్థితి, లేదా ప్రలోభం అనే అర్థాలు కలిగి ఉండగలదు. ‘శోధనలు’ ఈ అర్థవిస్తృతిని కొంతవరకు నిలుపుతూ యేసు ఎదుర్కొన్న పరీక్షాత్మక కష్టాలను సందర్భానుసారంగా సూచిస్తుంది.
theological_decisions:
- issue: యేసుకు సంబంధించిన πειρασμοῖς యొక్క అర్థం
  choice: శోధనలు—యేసు ఎదుర్కొన్న పరీక్షాత్మక కష్టాలు
  alternative: ప్రలోభాలు లేదా పరీక్షలు
  rationale: సందర్భంలో శిష్యులు యేసు ఎదుర్కొన్న విరోధాలు, కష్టాల్లో ఆయనతో నిలిచిన విషయమే ప్రధానంగా ఉంది. అయినా గ్రీకు పదంలో ‘ప్రలోభాలు’ అనే సాధ్యార్థాన్ని తొలగించకుండా పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదంగా ఉంది. ‘మీరే’ ద్వారా మూలంలోని ఉద్ఘాటనను, ‘నిలిచి ఉన్నవారు’ ద్వారా కొనసాగిన నిబద్ధతను కాపాడాం.
