source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἀπὸ τῆς προσευχῆς ἐλθὼν πρὸς τοὺς μαθητὰς εὗρεν ⸂κοιμωμένους αὐτοὺς⸃ ἀπὸ τῆς λύπης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/045.yaml
  text: And after rising from prayer[a], he came to the disciples and found them sleeping from sorrow.
translation:
  language: te
  text: ఆయన ప్రార్థన ముగించుకొని లేచి, శిష్యుల దగ్గరకు వచ్చాడు. వారిని దుఃఖం వల్ల నిద్రపోతూ ఉండగా కనుగొన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς ἀπὸ τῆς προσευχῆς
  choice: ప్రార్థన ముగించి లేచి
  rationale: ἀναστὰς ప్రధాన క్రియకు ముందున్న చర్యను సూచిస్తుంది; ἀπὸ τῆς προσευχῆς ప్రార్థన నుండి లేవడాన్ని తెలియజేస్తుంది. సహజమైన తెలుగులో ‘ప్రార్థన ముగించి లేచి’ ఆ క్రమాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἐλθὼν πρὸς τοὺς μαθητὰς
  choice: శిష్యుల దగ్గరికి వచ్చాడు
  rationale: πρός వారి వైపు చేరడాన్ని సూచిస్తుంది; μαθηταίకు సువార్తల సందర్భంలో స్థిరమైన, సహజమైన పదం ‘శిష్యులు’.
- source_word: εὗρεν
  choice: చూశాడు
  rationale: εὑρίσκω ఇక్కడ చేరుకున్నప్పుడు వారిని ఒక స్థితిలో కనుగొనడాన్ని సూచిస్తుంది. తెలుగులో ‘వారు ... ఉండడం చూశాడు’ సహజంగా ఉండి ఆ భావాన్ని అందిస్తుంది.
- source_word: κοιμωμένους αὐτούς
  choice: వారు ... నిద్రపోతూ ఉండడం
  rationale: వర్తమాన కృదంతం ఆయన వచ్చినప్పుడు కొనసాగుతున్న వారి నిద్ర స్థితిని/చర్యను చూపుతుంది.
- source_word: ἀπὸ τῆς λύπης
  choice: దుఃఖం వల్ల
  rationale: ఇక్కడ ἀπό కారణాన్ని తెలియజేస్తుంది; λύπηకి ‘దుఃఖం’ సాధారణ ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
theological_decisions:
- issue: శిష్యుల నిద్రకు దుఃఖంతో ఉన్న సంబంధం
  choice: వారి నిద్ర దుఃఖం వల్ల కలిగిందని కారణార్థకంగా అనువదించడం
  alternative: వారు దుఃఖంతో ఉన్న సమయంలో నిద్రపోతున్నారని మాత్రమే చెప్పడం
  rationale: ἀπὸ τῆς λύπης సహజంగా కారణాన్ని సూచిస్తుంది. పాఠ్యంలో ఉన్నదానికంటే ఎక్కువ మానసిక లేదా సిద్ధాంతపరమైన వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని చర్యల క్రమాన్ని నిలుపుతూ, తెలుగులో భారంగా అనిపించే కృదంత నిర్మాణాలను సహజమైన వాక్య నిర్మాణంగా మార్చాం.
