  source_fidelity: The temporal arrival clause, the address to the disciples, and the prayer imperative are accurately represented. However, ‘శోధనలో ప్రవేశించకుండా’ is not the clearest modern Telugu expression of the warning. In present-day usage, ‘శోధన’ commonly suggests investigation/research and can obscure πειρασμός. ‘ప్రలోభంలో పడకుండా’ naturally conveys the primary contextual sense, while the footnote retains the Greek word’s broader possible sense of testing or trial.
  naturalness: The draft is generally grammatical and appropriately respectful, but ‘శోధనలో ప్రవేశించకుండా’ is noticeably formal and unnatural in modern standard Telugu. The revision uses an idiomatic Telugu collocation without adding a doctrinal interpretation.
  terminology: Replace ‘శోధన’ with ‘ప్రలోభం’ in the main text for the immediate contextual sense of πειρασμός. Retain ‘పరీక్ష’ and ‘కష్టపరీక్ష’ as lexical alternatives in the footnote, preserving the source term’s semantic range.
  issues:
  - severity: medium
    issue: ‘శోధన’ is potentially misleading in modern Telugu.
    rationale: For many modern readers, ‘శోధన’ primarily means research or investigation. In this verse it can also sound like inherited religious diction, but it does not communicate temptation as clearly as ‘ప్రలోభం’.
  - severity: low
    issue: ‘శోధనలో ప్రవేశించకుండా’ is overly literal and less idiomatic.
    rationale: The Greek preserves an ‘enter into’ expression, but Telugu naturally says ‘ప్రలోభంలో పడకుండా’ in this context. This retains the warning’s force without an obscure literalism.
