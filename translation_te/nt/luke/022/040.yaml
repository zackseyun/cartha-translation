language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γενόμενος δὲ ἐπὶ τοῦ τόπου εἶπεν αὐτοῖς· Προσεύχεσθε μὴ εἰσελθεῖν εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/040.yaml
  text: When he came to the place[a], he said to them, “Pray that you may not enter into temptation.”
translation:
  language: te
  text: 'ఆయన ఆ స్థలానికి వచ్చినప్పుడు వారితో ఇలా అన్నాడు: “మీరు ప్రలోభంలో[a] పడకుండా ప్రార్థించండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పరీక్షలో” లేదా “కష్టపరీక్షలో.” గ్రీకు పదం నైతిక ప్రలోభాన్ని గానీ, మరింత విస్తృతమైన పరీక్షాకాలాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος
  choice: చేరుకున్నప్పుడు
  rationale: γίνομαι అనే భూతకాల కృదంతం ἐπὶ τοῦ τόπουతో కలిసి ఒక ప్రదేశానికి చేరుకోవడాన్ని సూచిస్తుంది. ‘చేరుకున్నప్పుడు’ రాకను, ప్రధాన క్రియకు ముందున్న కాలసంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించకుండా కాలసంబంధ నిర్మాణంలో వ్యక్తీకరించబడింది
  rationale: ఇక్కడ δέ కథనాన్ని స్వల్పంగా కొనసాగిస్తుంది. తెలుగు వాక్యంలో ‘చేరుకున్నప్పుడు’ అనే నిర్మాణమే ఆ అనుసంధానాన్ని సహజంగా అందిస్తుంది; అదనంగా ‘అప్పుడు’ చేరిస్తే అనవసర పునరుక్తి అవుతుంది.
- source_word: ἐπὶ τοῦ τόπου
  choice: ఆ స్థలానికి
  rationale: సందర్భంలో ముందే తెలిసిన నిర్దిష్ట ప్రదేశాన్ని ఈ పదబంధం సూచిస్తుంది. చేరుకునే భావంతో ‘ఆ స్థలానికి’ సహజంగా సరిపోతుంది.
- source_word: εἶπεν αὐτοῖς
  choice: వారితో అన్నాడు
  rationale: λέγω యొక్క సాధారణ అర్థమైన ‘చెప్పు/అను’ను పారదర్శకంగా ఉంచుతూ, ఆజ్ఞార్థక భావాన్ని క్రియలో అదనంగా పెంచకుండా ‘వారితో అన్నాడు’ అని అనువదించబడింది.
- source_word: Προσεύχεσθε
  choice: ప్రార్థించండి
  rationale: వర్తమాన ఆజ్ఞారూపం ప్రార్థనను కొనసాగించే లేదా అలవాటుగా చేసే భావాన్ని కలిగి ఉండవచ్చు. అయితే తెలుగులో ‘ప్రార్థించండి’ సహజమైన ఆజ్ఞగా ఉండి, సందర్భంలో ఆ భావాన్ని మోయగలదు.
- source_word: μὴ εἰσελθεῖν
  choice: ప్రవేశించకుండా
  rationale: εἰσέρχομαι యొక్క ‘ప్రవేశించు’ అనే మూలభావాన్ని నిలుపుతుంది. ‘పడకుండా’ మరింత సహజంగా ఉన్నా, గ్రీకు క్రియలో లేని రూపక విస్తరణను చేర్చుతుంది.
- source_word: πειρασμόν
  choice: శోధన
  rationale: ఈ సందర్భంలో శిష్యులు ఆధ్యాత్మికంగా విఫలమయ్యే ప్రలోభాన్ని ఎదుర్కొనబోతున్నందున ‘శోధన’ సరిపోతుంది. అయితే ఈ గ్రీకు పదం విస్తృతంగా ‘పరీక్ష’ లేదా ‘కష్టపరీక్ష’ను కూడా సూచించగలదు; ఆ భావాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: యేసు హెచ్చరికలో πειρασμός యొక్క అర్థం
  choice: శోధన
  alternative: పరీక్ష లేదా కష్టపరీక్ష
  rationale: తక్షణ సందర్భం శిష్యులు ప్రలోభానికి లోనై ఆధ్యాత్మికంగా విఫలమయ్యే ప్రమాదాన్ని సూచిస్తుంది కాబట్టి ‘శోధన’ ప్రధాన పాఠంలో సరిపోతుంది. అయినప్పటికీ, గ్రీకు పదం విస్తృత పరీక్షాకాలాన్ని కూడా సూచించగలదు; ఆ అర్థసందిగ్ధతను పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘శోధనలో ప్రవేశించకుండా’ అనే పదబంధం సాధారణ సంభాషణకంటే కొద్దిగా సాంద్రమైనది, కానీ మూలంలోని εἰσέρχομαι రూపకాన్ని మరియు ఉద్దేశపూర్వక అర్థసందిగ్ధతను నిలుపుతుంది.
