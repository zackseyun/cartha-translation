  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ περὶ αὐτὸν τὸ ἐσόμενον ⸀εἶπαν· Κύριε, εἰ πατάξομεν ἐν μαχαίρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/049.yaml
  text: And when those around him saw what was about to happen[a], they said, “Lord, shall we strike with the sword?”
translation:
  language: te
  text: ఆయన చుట్టూ ఉన్నవారు జరగబోయేదాన్ని చూసి, “ప్రభువా, మేము కత్తితో[a] కొట్టాలా?” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదం పొట్టి కత్తిని లేదా బాకును కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: చూసి
  rationale: అనంతరం జరిగిన మాటతో కాలసంబంధాన్ని సహజమైన తెలుగు అసమాపక క్రియ ద్వారా వ్యక్తం చేస్తుంది.
- source_word: οἱ περὶ αὐτὸν
  choice: ఆయన చుట్టూ ఉన్నవారు
  rationale: యేసుతో ఉన్నవారిని సూచించే గ్రీకు నుడికారాన్ని, వారు శిష్యులేనని పాఠంలో అదనంగా నిర్దేశించకుండా, సహజంగా అందిస్తుంది.
- source_word: τὸ ἐσόμενον
  choice: జరగబోయేదాన్ని
  rationale: సమీపంలో సంభవించనున్న ఘటనను సూచించే భవిష్యత్ కృదంత భావాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἶπαν
  choice: అని అన్నారు
  rationale: ప్రశ్నార్థక ప్రత్యక్ష వాక్యం ఉన్నప్పటికీ λέγω యొక్క సాధారణ అర్థమైన ‘అన్నారు’ను నిలుపుతుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: యేసును నేరుగా సంబోధించే κύριος పదంలోని గౌరవాన్ని, బిరుదు భావాన్ని నిలుపుతుంది.
- source_word: εἰ πατάξομεν
  choice: మేము ... కొట్టాలా?
  rationale: εἰతో వచ్చిన ఆలోచనాత్మక ప్రశ్నను తెలుగులో సహజమైన అనుమతి/నిర్ణయ ప్రశ్నగా అందిస్తూ, πατάσσω యొక్క ‘కొట్టు’ భావాన్ని కాపాడుతుంది.
- source_word: ἐν μαχαίρῃ
  choice: కత్తితో
  rationale: ἐνను సాధనార్థకంగా, μάχαιραను సాధారణ ఆధునిక తెలుగు పదంతో అనువదిస్తుంది; గ్రీకులోని నిర్దిష్టతలేని రూపాన్ని తెలుగులో సహజంగానే అస్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: యేసును సంబోధించేటప్పుడు κύριος అనువాదం
  choice: ప్రభువా
  alternative: బోధకుడా / యజమానీ
  rationale: ఈ సందర్భంలో గౌరవసూచక ప్రత్యక్ష సంబోధనతో పాటు బిరుదుకు ఉన్న వేదాంతపరమైన బరువును కూడా ‘ప్రభువా’ నిలుపుతుంది; కేవలం సామాజిక గౌరవార్థానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘కత్తితో కొట్టాలా?’ అనే రూపం యుద్ధసందర్భాన్ని అతిగా వివరిస్తూ ‘దాడి చేయాలా?’ అని మార్చకుండా మూలంలోని క్రియను నిలుపుతుంది.
