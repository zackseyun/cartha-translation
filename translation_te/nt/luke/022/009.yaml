translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు, గౌరవప్రదమైన సంభాషణా శైలి. గ్రీకు వాక్యంలోని ప్రశ్న రూపాన్ని, కర్తల సంబంధాన్ని నిలుపుకుంటూనే తెలుగులో సహజమైన పదక్రమాన్ని ఉపయోగించాం.
