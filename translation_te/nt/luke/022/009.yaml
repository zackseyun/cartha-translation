  text: They said to him[a], “Where do you want us to prepare it?”
translation:
  language: te
  text: వారు ఆయనతో, “దానిని[a] మేము ఎక్కడ సిద్ధం చేయాలని మీరు కోరుతున్నారు?” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో “దానిని” అనే పదం లేదు. ముందరి సందర్భం ప్రకారం ఇది పస్కా భోజనాన్ని సూచిస్తుంది. ఈ మాటను “మేము ఎక్కడ ఏర్పాట్లు చేయాలని” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: వారు
  rationale: నామవాచకంగా వాడిన బహువచన article సందర్భంలోని శిష్యులను సూచిస్తుంది. δέ ఇక్కడ స్వల్ప అనుసంధాన పదం; సహజమైన తెలుగులో దానిని ప్రత్యేకంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: εἶπαν αὐτῷ
  choice: ఆయనతో ... అన్నారు
  rationale: εἶπαν యొక్క ప్రాథమిక అర్థం ‘అన్నారు’; αὐτῷ అనే దత్తివాచక సర్వనామాన్ని తెలుగులో సహజంగా ‘ఆయనతో’ అని వ్యక్తం చేశాం.
- source_word: Ποῦ
  choice: ఎక్కడ
  rationale: ఇది స్థలాన్ని అడిగే ప్రశ్నార్థక క్రియావిశేషణం.
- source_word: θέλεις
  choice: మీరు కోరుతున్నారు
  rationale: θέλω కోరికను లేదా ఉద్దేశాన్ని సూచిస్తుంది. ‘కోరుతున్నారు’ అనేది గౌరవసూచకంగా, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: ἑτοιμάσωμεν
  choice: మేము ... సిద్ధం చేయాలని
  rationale: θέλεις తరువాత వచ్చిన ప్రథమ పురుష బహువచన aorist subjunctiveను తెలుగులో ‘మేము ... సిద్ధం చేయాలని మీరు కోరుతున్నారు’ అనే సహజ నిర్మాణంతో వ్యక్తం చేశాం. సిద్ధం చేయబడేది ఏమిటో గ్రీకులో స్పష్టంగా చెప్పలేదు; ముందరి సందర్భం ఆధారంగా ‘దానిని’ చేర్చాం.
