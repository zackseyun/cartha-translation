  text: And when the hour came[a], he reclined at the table, and the apostles with him.
translation:
  language: te
  text: ఆ సమయం వచ్చినప్పుడు, ఆయన అపొస్తలులతో కలిసి భోజనానికి ఆనుకొని కూర్చున్నాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, అప్పటి భోజన ఆచారం ప్రకారం ఆనుకొని కూర్చుని భోజనం చేశాడు.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡ ὥρα
  choice: ఆ సమయం వచ్చినప్పుడు
  rationale: నిర్దిష్టంగా నిర్ణయించబడిన సందర్భాన్ని సూచించే గ్రీకు పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. తెలుగులో ‘గంట వచ్చినప్పుడు’ అనడం ఈ సందర్భంలో అసహజం కాబట్టి, ὥρα యొక్క సందర్భార్థాన్ని ‘సమయం’గా ఇచ్చాం.
- source_word: ἀνέπεσεν
  choice: భోజనానికి వాలికూర్చున్నాడు
  rationale: ప్రాచీన భోజనాచారం ప్రకారం ఆనుకొని లేదా వాలి భోజనం చేసే భంగిమను ఈ క్రియ సూచిస్తుంది. ‘కూర్చున్నాడు’ మాత్రమే అంటే చారిత్రక భంగిమ కనుమరుగవుతుంది; ‘భోజనానికి’ అని చేర్చడం సందర్భాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: οἱ ἀπόστολοι
  choice: అపొస్తలులు
  rationale: నిర్దిష్టమైన, ముందే తెలిసిన యేసు అపొస్తలుల సమూహాన్ని నేరుగా సూచిస్తుంది. మూలంలో లేని ‘ఆయన అపొస్తలులు’ అనే స్వామ్య భావాన్ని చేర్చలేదు.
- source_word: σὺν αὐτῷ
  choice: ఆయనతోపాటు
  rationale: సύν తెలిపే సహవాసాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: Καὶ
  choice: ఆ
  rationale: గ్రీకులోని సాధారణ కథన సంధిని తెలుగులో పదశః ‘మరియు’తో ప్రారంభించడం అసహజం. ‘ఆ సమయం’ ముందరి కథనంతో అనుసంధానాన్ని సహజంగా కొనసాగిస్తుంది.
theological_decisions:
- issue: పస్కా భోజన సందర్భంలోని శరీర భంగిమ
  choice: భోజనానికి వాలికూర్చున్నాడు
  alternative: భోజనానికి కూర్చున్నాడు
  rationale: గ్రీకు ἀναπίπτω సూచించే చారిత్రక భోజన భంగిమను నిలుపుకుంది. ఇది సిద్ధాంతపరమైన విస్తరణ కాదు; పదార్థం మరియు సంస్కృతికి సంబంధించిన స్పష్టీకరణ మాత్రమే.
- issue: క్రియ రెండవ కర్తకు వర్తించే విధానం
  choice: అపొస్తలులు కూడా ఆయనతోపాటు వాలికూర్చున్నారు
  alternative: ఆయన వాలికూర్చున్నాడు, అపొస్తలులు ఆయనతో ఉన్నారు
  rationale: గ్రీకు వాక్యంలో రెండవ ఉపవాక్యంలో క్రియ అధ్యాహారంగా ఉంది; అపొస్తలులు కూడా అదే భోజన భంగిమలో ఉన్నారనే భావాన్ని తెలుగులో సహజంగా స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘వాలికూర్చు’ చారిత్రక భోజన భంగిమను సంక్షిప్తంగా తెలియజేస్తుంది; పాదసూచిక దానిని వివరిస్తుంది.
