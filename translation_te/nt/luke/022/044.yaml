  text: καὶ γενόμενος ἐν ἀγωνίᾳ ἐκτενέστερον προσηύχετο· ⸄καὶ ἐγένετο⸅ ὁ ἱδρὼς αὐτοῦ ὡσεὶ θρόμβοι αἵματος καταβαίνοντες ἐπὶ τὴν γῆν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/044.yaml
  text: And being in agony[a], he was praying more intensely[c][b]; and his sweat became like drops of blood falling to the ground.
translation:
  language: te
  text: ఆయన తీవ్రమైన వేదనలో ఉండి, మరింత తీవ్రంగా ప్రార్థిస్తూ ఉన్నాడు;[a] ఆయన చెమట నేలమీద పడుతున్న రక్తపు బొట్లలా అయింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో లూకా 22:43–44 లేవు; మరికొన్నింటిలో ఉన్నాయి. ఈ పాఠ్య అనిశ్చితిని సూచించడానికి SBLGNT ఈ వచనాలను బ్రాకెట్లలో ముద్రిస్తుంది.
    reason: textual_variant
  - marker: b
    text: గ్రీకులో ‘రక్తపు బొట్లు/గడ్డలలా.’ ఇది చెమట రక్తమే అని నేరుగా చెప్పకుండా, దానిని రక్తపు బొట్లు లేదా గడ్డలతో పోలుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος ἐν ἀγωνίᾳ
  choice: తీవ్రమైన వేదనలో ఉండి
  rationale: γενόμενος సందర్భానుసారంగా ఆయన ఉన్న స్థితిని పరిచయం చేస్తుంది; ἀγωνία తీవ్రమైన అంతరంగ పోరాటం, వ్యాకులత లేదా వేదనను సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో తీవ్రతను నిలుపుతుంది.
- source_word: ἐκτενέστερον
  choice: మరింత తీవ్రంగా
  rationale: తులనాత్మక క్రియావిశేషణంలోని పెరిగిన తీవ్రతను నేరుగా వ్యక్తం చేస్తుంది; ప్రార్థన యొక్క నిజాయితీ లేదా భక్తి గురించి అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: προσηύχετο
  choice: ప్రార్థిస్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం సూచించే కొనసాగుతున్న క్రియను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐγένετο
  choice: అయింది
  rationale: చెమట రక్తపు బొట్లను పోలిన స్థితికి వచ్చినట్లు తెలిపే క్రియాబలాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ὁ ἱδρὼς αὐτοῦ
  choice: ఆయన చెమట
  rationale: మూలంలోని స్వామ్య సంబంధాన్ని సహజంగా, నేరుగా అనువదిస్తుంది.
- source_word: ὡσεὶ θρόμβοι αἵματος
  choice: రక్తపు బొట్లలా
  rationale: ὡσεὶ సూచించే పోలికను స్పష్టంగా నిలుపుతుంది. θρόμβοι గడ్డలు లేదా దట్టమైన బొట్లు అనే భావం ఇవ్వగలిగినా, కింద పడుతున్న దృశ్యంలో ‘బొట్లు’ సహజంగా ఉంది; విస్తృత అర్థాన్ని పాదటీకలో సూచించాం.
- source_word: καταβαίνοντες ἐπὶ τὴν γῆν
  choice: నేలమీద పడుతున్న
  rationale: కిందికి కదలి నేలను చేరుతున్న దృశ్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘రక్తపు బొట్లలా’ అనే వాక్యంలో పోలిక స్వభావం
  choice: చెమట రక్తపు బొట్లలా అయిందనే ఉపమానాన్ని నిలుపడం
  alternative: చెమట నిజంగా రక్తమే అయిందని అనువదించడం
  rationale: ὡσεὶ స్పష్టంగా పోలికను సూచిస్తుంది. కాబట్టి మూలం నిర్బంధంగా చెప్పని వైద్యపరమైన లేదా అద్భుత సంబంధమైన నిర్ణయాన్ని అనువాదం చేర్చకుండా, దృశ్య తీవ్రతనూ అస్పష్టతనూ నిలుపుతుంది.
- issue: లూకా 22:43–44 యొక్క పాఠాంతర స్థితి
  choice: వచనాన్ని ప్రధాన పాఠ్యంలో ఉంచి పాదటీకలో ప్రాచీన ప్రతుల అనిశ్చితిని తెలియజేయడం
  alternative: ఈ వచనాన్ని ప్రధాన పాఠ్యం నుంచి తొలగించడం లేదా పాఠాంతరాన్ని తెలియజేయకుండా ముద్రించడం
  rationale: SBLGNT ఈ వచనాలను పాఠ్య అనిశ్చితిని సూచించే బ్రాకెట్లలో ముద్రిస్తుంది. అనువాదం అందిన మూలపాఠ్యాన్ని అనుసరిస్తూనే పాఠకునికి ముఖ్యమైన ప్రతుల ఆధారాన్ని పారదర్శకంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘తీవ్రమైన వేదన’ ἀγωνία యొక్క బలాన్ని నిలుపుతుంది; ‘మరింత తీవ్రంగా’ తులనాత్మక భావాన్ని కాపాడుతుంది. వాక్య నిర్మాణం కొనసాగుతున్న ప్రార్థనను, ఆ తరువాత చెమట గురించిన దృశ్యాన్ని వరుసగా చూపుతుంది.
