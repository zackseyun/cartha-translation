  text: But he denied it[a], saying, “I do not know him[b], woman.”
translation:
  language: te
  text: కానీ అతడు దాన్ని నిరాకరిస్తూ[a], “అమ్మా, నాకు ఆయన తెలియదు”[b] అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “కానీ అతడు నిరాకరిస్తూ … అన్నాడు.” గ్రీకులో ‘నిరాకరించాడు’ అనే క్రియకు కర్మ చెప్పబడలేదు; సహజమైన తెలుగుకోసం ‘దాన్ని’ చేర్చబడింది.
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, “స్త్రీ, నాకు ఆయన తెలియదు.” “అమ్మా” అనేది స్త్రీని నేరుగా సంబోధించే γύναιకు సహజమైన తెలుగు అనువాదం; గ్రీకులో αὐτόνకు ‘ఆయన’ అనే సర్వనామమే ఉంది, ‘ఎవరో’ లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρνήσατο
  choice: దాన్ని ఖండిస్తూ
  rationale: క్రియకు గ్రీకులో స్పష్టమైన కర్మ లేదు; సందర్భంలో ఆ స్త్రీ చేసిన ఆరోపణనే పేతురు ఖండిస్తున్నాడు. సహజమైన తెలుగుకోసం ‘దాన్ని’ చేర్చబడింది.
- source_word: λέγων
  choice: అన్నాడు
  rationale: ఈ వర్తమాన అసమాపక క్రియ ఖండనలోని మాటలను పరిచయం చేస్తుంది; తెలుగు వాక్యనిర్మాణంలో ప్రత్యక్ష ఉక్తి తర్వాత ‘అన్నాడు’ సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: Οὐκ οἶδα
  choice: నాకు తెలియదు
  rationale: οἶδα అనే తెలుసుకొనే క్రియకు ఇది సహజమైన ఆధునిక తెలుగు రూపం; నిరాకరణను స్పష్టంగా ఉంచుతుంది.
- source_word: αὐτόν
  choice: ఆయన ఎవరో
  rationale: సర్వనామం యేసును సూచిస్తుంది. తెలుగులో ఒక వ్యక్తితో పరిచయం లేదని చెప్పేటప్పుడు ‘ఆయన ఎవరో నాకు తెలియదు’ అనడం సహజం; ‘ఆయన’ గౌరవ సూచకమైన సాధారణ ప్రయోగం.
- source_word: γύναι
  choice: అమ్మా
  rationale: స్త్రీని నేరుగా సంబోధించే γύναιకు ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ప్రత్యక్ష సంబోధన ‘అమ్మా’; ఇది ‘మేడమ్’ వంటి విదేశీ మర్యాదా పదాన్ని దిగుమతి చేయదు.
theological_decisions:
- issue: పేతురు చేసిన ఖండనకు స్పష్టమైన కర్మను చేర్చాలా
  choice: సందర్భంలోని ఆరోపణను సూచిస్తూ ‘దాన్ని’ చేర్చడం
  alternative: ‘అయితే అతడు ఖండిస్తూ’ లేదా ‘అతడు ఆయనను నిరాకరిస్తూ’
  rationale: గ్రీకు ἠρνήσατοకు స్పష్టమైన కర్మ లేదు. తెలుగులో ‘దాన్ని’ అనేది ముందున్న వాదనను సూచించి సహజతనిస్తుంది; ‘ఆయనను నిరాకరించాడు’ అనడం మూలంలో లేని కర్మను నిర్దిష్టం చేసి భావాన్ని అతిగా నిర్ణయిస్తుంది.
- issue: αὐτόνను సాధారణ సర్వనామంగా ఉంచాలా, పరిచయం లేదనే తెలుగు నుడికారంతో వ్యక్తపరచాలా
  choice: ‘ఆయన ఎవరో నాకు తెలియదు’
  alternative: ‘ఆయన నాకు తెలియదు’
  rationale: రెండూ యేసుతో పరిచయాన్ని నిరాకరించడాన్నే సూచిస్తాయి. ఎంచుకున్న రూపం ఆధునిక తెలుగులో సహజంగా ఉండి, పేతురు చెప్పిన నిరాకరణను బలపరుస్తుంది; అయినా ‘ఎవరో’ మూలంలో విడిగా లేదని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ప్రత్యక్ష సంభాషణ. ‘అమ్మా’ను సహజమైన స్త్రీ సంబోధనగా వాడి, ‘మేడమ్/లేడీ’ వంటి అన్వయాత్మక లేదా విదేశీ పదాలను నివారించాం.
