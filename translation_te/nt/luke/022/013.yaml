  yaml_path: translation/nt/luke/022/013.yaml
  text: So they went and found it just as he had told them[a], and they prepared the Passover.
translation:
  language: te
  text: వారు వెళ్లి, ఆయన వారికి చెప్పినట్లుగానే ఉన్నట్లు కనుగొన్నారు; పస్కాను[a] సిద్ధం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పస్కా భోజనాన్ని’; లేదా ‘పస్కా గొర్రెపిల్లను.’ గ్రీకు పదం విస్తృతంగా పస్కా ఆచరణను, మరింత నిర్దిష్టంగా దాని భోజనాన్ని లేదా బలి సంబంధమైన అంశాలను సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπελθόντες δὲ
  choice: కాబట్టి వారు వెళ్లి
  rationale: అయోరిస్ట్ కృదంతాన్ని సహజమైన తెలుగు క్రియాక్రమంగా మార్చాం. δέ ఇక్కడ బలమైన వ్యతిరేకతను కాక, ముందటి ఆదేశాలకు అనుసంధానంగా కథను కొనసాగిస్తుంది; అందుకే ‘కాబట్టి’ వాడాం.
- source_word: εὗρον
  choice: అక్కడ కనుగొన్నారు
  rationale: గ్రీకులో కర్మ స్పష్టంగా లేదు; సందర్భం యేసు వివరించిన పరిస్థితులు అలాగే కనిపించాయని సూచిస్తుంది. తెలుగులో అస్పష్టమైన ‘దానిని’ చేర్చకుండా, సహజత కోసం స్థలసూచకమైన ‘అక్కడ’ను ఉపయోగించాం.
- source_word: καθὼς εἰρήκει αὐτοῖς
  choice: ఆయన తమతో చెప్పినట్లుగానే
  rationale: καθώς తెలిపే ఖచ్చితమైన అనురూపతను ‘చెప్పినట్లుగానే’ సహజంగా వ్యక్తపరుస్తుంది. ప్లూపర్‌ఫెక్ట్‌లోని పూర్వకాల భావం తెలుగు సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: ἡτοίμασαν
  choice: సిద్ధం చేశారు
  rationale: సిద్ధపరచడం లేదా అవసరమైన ఏర్పాట్లు చేయడం అనే క్రియార్థాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὸ πάσχα
  choice: పస్కాను
  rationale: πάσχα అనే పదం పండుగ ఆచరణను, భోజనాన్ని, లేదా బలి గొర్రెపిల్లను సూచించగలదు. ప్రధాన పాఠంలో విస్తృతమైన పదాన్ని ఉంచి మూలంలోని భావపరిధిని కాపాడాం.
theological_decisions:
- issue: πάσχα పదం యొక్క సందర్భార్థ పరిధి
  choice: పస్కాను
  alternative: పస్కా భోజనాన్ని; పస్కా గొర్రెపిల్లను
  rationale: సమీప సందర్భం పస్కా తినడానికి చేసే ఏర్పాట్లను సూచించినా, గ్రీకు పదం మరింత విస్తృతార్థం కలది. ప్రధాన పాఠంలో దాన్ని సంకుచితం చేయకుండా, ప్రత్యామ్నాయ నిర్దిష్ట అర్థాలను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘పస్కా’ అనే స్థిరపడిన బైబిలు పదాన్ని ఉంచి, దాని భావపరిధిని పాదసూచికలో వివరించాం.
