review_pass:
  verdict: revise
  source_fidelity: The question and plural imperatives are accurately represented. However, the Greek purpose clause ἵνα μὴ εἰσέλθητε should be rendered as the purpose of praying ('so that/in order that you may not enter'), rather than as a resulting assurance ('then you will not enter').
  naturalness: The Telugu is generally clear and idiomatic. Recasting the final clause as a purpose clause makes the sentence both more natural and more faithful to the Greek syntax.
  terminology: ‘శోధన’ suitably preserves the broad sense of πειρασμός, which can encompass testing and temptation. ‘శోధనలోకి ప్రవేశించు’ retains the source’s ‘enter into’ imagery without forcing a narrower interpretation.
  issues:
  - severity: medium
    issue: The phrase ‘అప్పుడు మీరు శోధనలోకి ప్రవేశించకుండా ఉంటారు’ presents the final clause as a temporal/resultative outcome.
    rationale: ἵνα μὴ introduces the purpose for the commands to rise and pray. ‘అప్పుడు’ (‘then’) and ‘ఉంటారు’ (‘will be’) can imply a guaranteed result rather than the stated purpose.
  revised_text: ఆయన వారితో, “మీరు ఎందుకు నిద్రపోతున్నారు? మీరు శోధనలోకి ప్రవేశించకుండేందుకు లేచి ప్రార్థించండి” అని చెప్పాడు.
