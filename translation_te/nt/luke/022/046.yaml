id: LUK.22.46
reference: Luke 22:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τί καθεύδετε; ἀναστάντες προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/046.yaml
  text: And he said to them, “Why are you sleeping? Get up and pray, so that you may not enter into temptation.”
translation:
  language: te
  text: ఆయన వారితో, “మీరు ఎందుకు నిద్రపోతున్నారు? మీరు శోధనలోకి ప్రవేశించకుండేందుకు లేచి ప్రార్థించండి” అని చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθεύδετε
  choice: నిద్రపోతున్నారు
  rationale: వర్తమాన క్రియ యొక్క సహజమైన తెలుగు రూపం; శిష్యుల అప్పటి స్థితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀναστάντες
  choice: లేచి
  rationale: ఆజ్ఞార్థక భావంతో అనుసంధానమైన క్రియావిశేషణ రూపాన్ని సహజంగా, సంక్షిప్తంగా ప్రతిబింబిస్తుంది.
- source_word: προσεύχεσθε
  choice: ప్రార్థించండి
  rationale: బహువచన ఆజ్ఞను గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగులో అందిస్తుంది.
- source_word: εἰσέλθητε εἰς πειρασμόν
  choice: శోధనలోకి ప్రవేశించకుండా
  rationale: మూలంలోని ‘లోనికి ప్రవేశించు’ రూపకాన్ని నిలుపుతూ, πειρασμός లోని పరీక్ష/ప్రలోభం అనే విస్తృత భావాన్ని ‘శోధన’తో సంరక్షిస్తుంది.
theological_decisions:
- issue: ἵνα μὴ నిర్మాణంలోని ఉద్దేశం/ఫలితం
  choice: అప్పుడు మీరు శోధనలోకి ప్రవేశించకుండా ఉంటారు
  alternative: మీరు శోధనలోకి ప్రవేశించకుండేందుకు
  rationale: ప్రార్థనకు ఇచ్చిన ఉద్దేశాన్ని సహజ తెలుగులో తెలియజేస్తుంది; అయితే దానిని యాంత్రిక హామీగా అతిగా బలపరచకుండా మూల భావాన్ని కాపాడుతుంది.
- issue: πειρασμός యొక్క భావ పరిధి
  choice: శోధన
  alternative: ప్రలోభం; పరీక్ష
  rationale: సందర్భంలో పరీక్ష మరియు పాపానికి ప్రలోభం రెండూ సూచితమయ్యే అవకాశాన్ని ఒకే అర్థానికి పరిమితం చేయకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా, అదే సమయంలో గంభీరమైన గ్రంథశైలిని నిలిపింది. మూలంలోని ప్రశ్న, ఆజ్ఞ, ఉద్దేశ వాక్య నిర్మాణం సంరక్షించబడ్డాయి.
