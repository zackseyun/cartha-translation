  text: Καὶ ὡς ἐγένετο ἡμέρα, συνήχθη τὸ πρεσβυτέριον τοῦ λαοῦ, ἀρχιερεῖς ⸀τε καὶ γραμματεῖς, καὶ ⸀ἀπήγαγον αὐτὸν εἰς τὸ συνέδριον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/066.yaml
  text: And when day came[a], the council of the elders of the people gathered together, both chief priests and scribes, and they led him away into their Sanhedrin[b],
translation:
  language: te
  text: తెల్లవారినప్పుడు[a], ప్రజల పెద్దల మండలి—ప్రధాన యాజకులూ శాస్త్రులూ—కూడింది. వారు ఆయనను తమ మహాసభలోకి తీసుకువెళ్లారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పగలు కాగానే’; లేదా ‘తెల్లవారుజామున.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తమ మహాసభ ఎదుటికి’ లేదా ‘తమ మండలిలోకి.’ ఇక్కడి గ్రీకు పదం మండలిని, దాని అధికారిక సమావేశాన్ని, లేదా సమావేశ స్థలాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐγένετο ἡμέρα
  choice: తెల్లవారినప్పుడు
  rationale: గ్రీకు వాక్యబంధంలోని కాలసూచనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘పగలు కాగానే’ అనే అక్షరార్థ ఛాయను పాదసూచికలో ఉంచుతుంది.
- source_word: συνήχθη
  choice: సమావేశమైంది
  rationale: మండలి ఒకచోట కూడినదనే కర్మణి భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ πρεσβυτέριον τοῦ λαοῦ
  choice: ప్రజల పెద్దల మండలి
  rationale: πρεσβυτέριον వ్యక్తిగత పెద్దలను మాత్రమే కాక, వారు ఏర్పరచిన అధికారిక సమూహాన్ని సూచిస్తుంది; ‘మండలి’ ఆ సంస్థాగత భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἀρχιερεῖς τε καὶ γραμματεῖς
  choice: ప్రధాన యాజకులూ శాస్త్రులూ
  rationale: τε καί కలిపి పేర్కొన్న రెండు వర్గాలనూ ‘-లూ ... -లూ’ నిర్మాణంతో సహజంగా నిలుపుతుంది; ఇవి తెలుగులో స్థిరపడిన పారదర్శక పదాలు.
- source_word: ἀπήγαγον
  choice: తీసుకువెళ్లారు
  rationale: ఒక స్థలం లేదా అధికారిక సమక్షానికి ఆయనను వెంట తీసుకుపోయారనే దిశాభావాన్ని తెలియజేస్తుంది; హింసను అవసరానికి మించి సూచించదు.
- source_word: εἰς τὸ συνέδριον αὐτῶν
  choice: తమ మహాసభ ఎదుటికి
  rationale: συνέδριον ఇక్కడ పాలక మండలిని లేదా దాని అధికారిక సమావేశాన్ని సూచించగలదు. ‘ఎదుటికి’ న్యాయవిచారణ సందర్భంలో సహజంగా ఉండి, అది తప్పనిసరిగా ఒక సభాభవనమేనని నిర్ణయించదు.
theological_decisions:
- issue: యూదుల పాలక మండలికి సంబంధించిన సంస్థాగత పదజాలం
  choice: πρεσβυτέριον ను ‘పెద్దల మండలి’గా, συνέδριον ను ‘మహాసభ’గా వేరు చేసి అనువదించడం
  alternative: రెండింటినీ ‘మండలి’గా అనువదించడం; లేదా συνέδριον ను ‘సన్హెద్రిన్’గా లిప్యంతరీకరించడం
  rationale: మూలపాఠం సంబంధమున్నప్పటికీ వేర్వేరు రెండు పదాలను ఉపయోగిస్తుంది. వాటి భేదాన్ని తెలుగులో నిలపడం మూలానికి జవాబుదారీతనాన్ని కాపాడుతుంది; ‘సన్హెద్రిన్’ అనే లిప్యంతరీకరణ సాధారణ పాఠకునికి తక్కువ పారదర్శకంగా ఉంటుంది.
- issue: εἰς τὸ συνέδριον యొక్క స్థల లేదా సమక్ష భావం
  choice: ‘మహాసభ ఎదుటికి’
  alternative: ‘మహాసభలోకి’ లేదా ‘సభామందిరంలోకి’
  rationale: εἰς సందర్భానుసారంగా సభ సమక్షానికి తీసుకురావడాన్ని సూచించగలదు; συνέδριον మండలినీ, సమావేశాన్నీ, దాని స్థలాన్నీ సూచించగలందున నిర్దిష్ట భౌతిక గదిగా అర్థాన్ని కుదించలేదు.
