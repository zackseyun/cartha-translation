  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే న్యాయ-మతపరమైన సందర్భానికి తగిన గౌరవప్రదమైన శైలి. రెండు గ్రీకు సంస్థాగత పదాల భేదాన్ని ‘పెద్దల మండలి’ మరియు ‘మహాసభ’గా నిలిపింది.
