id: LUK.22.11
reference: Luke 22:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐρεῖτε τῷ οἰκοδεσπότῃ τῆς οἰκίας· Λέγει σοι ὁ διδάσκαλος· Ποῦ ἐστιν τὸ κατάλυμα ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/011.yaml
  text: And you will say to the master of the house[a], ‘The Teacher says to you, “Where is the guest room where I may eat the Passover with my disciples?”’
translation:
  language: te
  text: 'మీరు ఆ ఇంటి యజమానితో, ‘బోధకుడు నీతో ఇలా చెబుతున్నాడు: “నేను నా శిష్యులతో కలిసి పస్కా భోజనం చేయడానికి అతిథి గది ఎక్కడ ఉంది?”’ అని చెప్పాలి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతిథి గది’కు ‘బస చేసే స్థలం’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం κατάλυμα బస చేసే స్థలాన్ని లేదా అతిథి గదిని సూచిస్తుంది; ఇక్కడ అది ప్రత్యేకంగా ‘సత్రం’ అని అర్థం కాదు. ‘మేడగది’ అనే వివరము తరువాతి వచనంలో వస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδεσπότῃ τῆς οἰκίας
  choice: ఆ ఇంటి యజమానితో
  rationale: οἰκοδεσπότης ఇంటి లేదా కుటుంబపు అధిపతిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఆ ఇంటి యజమాని’ సహజంగా ఉండి, సందర్భంలోని అధికార భావాన్ని నిలుపుతుంది.
- source_word: ὁ διδάσκαλος
  choice: బోధకుడు
  rationale: διδάσκαλος ఇక్కడ యేసుకు గుర్తింపుగా వాడిన బిరుదు. ‘బోధకుడు’ మూలార్థాన్ని నేరుగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: κατάλυμα
  choice: అతిథి గది
  rationale: κατάλυμα బస చేసే స్థలాన్ని లేదా అతిథుల కోసం ఉన్న గదిని సూచించగలదు. ఇంటి సందర్భంలో ‘అతిథి గది’ సహజం; ‘సత్రం’ అని లేదా తరువాతి వచనంలోని వివరాన్ని ముందుగానే చేర్చి ‘మేడగది’ అని అనడం తగదు.
- source_word: τὸ πάσχα
  choice: పస్కా భోజనం
  rationale: πάσχα పండుగను లేదా పస్కా భోజనాన్ని సూచించగలదు. φάγω (‘తినడం/భోజనం చేయడం’) ఉన్న ఈ సందర్భంలో భోజనమే ప్రత్యేకంగా ఉద్దేశించబడినందున ‘పస్కా భోజనం’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: నా శిష్యులతో కలిసి
  rationale: μαθητής కేవలం విద్యార్థిని కాక, గురువును అనుసరించి నేర్చుకునే వ్యక్తిని సూచిస్తుంది; సువార్తల సందర్భంలో ‘శిష్యుడు’ స్థిరమైన, అర్థవంతమైన పదం.
- source_word: φάγω
  choice: భోజనం చేయడానికి
  rationale: ὅπου తో వచ్చిన aorist subjunctive ఇక్కడ ఉద్దేశించిన కార్యానికి స్థలాన్ని అడుగుతోంది. తెలుగులో ‘చేయడానికి’ ఆ ప్రయోజన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐρεῖτε
  choice: చెప్పాలి
  rationale: భవిష్యత్ సూచకరూపం ఈ సందర్భంలో శిష్యులకు ఆదేశంగా పనిచేస్తోంది. తెలుగులో ‘చెప్పాలి’ ఆ ఆదేశాత్మక ప్రయోజనాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: διδάσκαλος అనే యేసు బిరుదు అనువాదం
  choice: బోధకుడు
  alternative: గురువు; ప్రభువు
  rationale: మూలపదం బోధించే వ్యక్తిని సూచిస్తుంది. ‘బోధకుడు’ బిరుదును అర్థానుసారంగా అనువదిస్తూ, మూలంలో లేని అధిపత్య లేదా దైవ బిరుదు భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ప్రత్యక్ష సంభాషణలోని గౌరవం మరియు బిరుదు భావం నిలుపబడ్డాయి. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
