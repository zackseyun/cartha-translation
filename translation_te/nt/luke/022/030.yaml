source:
  edition: SBLGNT
  text: ἵνα ⸀ἔσθητε καὶ πίνητε ἐπὶ τῆς τραπέζης μου ⸂ἐν τῇ βασιλείᾳ μου⸃, καὶ ⸀καθήσεσθε ἐπὶ θρόνων ⸂τὰς δώδεκα φυλὰς κρίνοντες⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/030.yaml
  text: so that you may eat and drink at my table in my kingdom[a], and you will sit on thrones judging the twelve tribes of Israel.
translation:
  language: te
  text: మీరు నా రాజ్యంలో నా బల్ల వద్ద తిని తాగేందుకు, మరియు మీరు సింహాసనాలపై కూర్చొని ఇశ్రాయేలు పన్నెండు గోత్రాలకు తీర్పు తీరుస్తారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలు పన్నెండు గోత్రాలను పరిపాలిస్తారు’ లేదా ‘ఏలుతారు.’
    reason: క్రίνoντες అనే పదం సందర్భానుసారంగా న్యాయతీర్పు చేయడాన్ని, అలాగే పాలించడం లేదా అధికారాన్ని నిర్వహించడాన్ని కూడా సూచించగలదు.
lexical_decisions:
- source_word: ἵνα
  choice: —ేందుకు
  rationale: ముందటి వాక్యంలోని వాగ్దానానికి సంబంధించిన ఉద్దేశం లేదా ఫలితాన్ని తెలుగులో సహజంగా తెలిపే క్రియార్థక నిర్మాణం.
- source_word: ἔσθητε καὶ πίνητε
  choice: మీరు ... తిని తాగేందుకు
  rationale: ἵνα కింద ఉన్న రెండు సంభావనార్థక క్రియలను ఒకే సమన్విత తెలుగు నిర్మాణంలో ఉంచి, భోజన సహవాస భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ τῆς τραπέζης μου
  choice: నా బల్ల దగ్గర
  rationale: భోజన బల్ల వద్ద సహవాసాన్ని సూచించే సహజమైన ఆధునిక తెలుగు; స్థలార్థాన్ని కాపాడుతుంది.
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: నా రాజ్యంలో
  rationale: βασιλείαలోని రాజ్యం/రాజపాలన భావాలలో, విందు మరియు సింహాసనాల సందర్భానికి అనుగుణంగా స్థలార్థమైన ‘రాజ్యం’ను ప్రధాన పాఠ్యంలో ఉంచుతుంది.
- source_word: καθήσεσθε ἐπὶ θρόνων
  choice: సింహాసనాల మీద కూర్చొని
  rationale: భవిష్యత్తులో వారికి కలిగే రాజసంబంధమైన స్థానాన్ని నేరుగా నిలుపుతుంది; ἵναకు అనుసంధానమైన సమాంతర ఉద్దేశ నిర్మాణంలో సహజంగా సరిపోతుంది.
- source_word: κρίνοντες
  choice: తీర్పు తీర్చేందుకు
  rationale: κρίνω యొక్క ప్రాథమిక న్యాయపరమైన భావాన్ని నిలుపుతుంది; పరిపాలించడం అనే విస్తృత భావాన్ని ప్రధాన పాఠ్యంలోకి బలవంతంగా చేర్చదు.
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: ఇశ్రాయేలు పన్నెండు గోత్రాలకు
  rationale: ఇశ్రాయేలు పన్నెండు గోత్రాలనే నిబంధనాత్మక సూచనను పారదర్శకంగా కాపాడుతుంది; తెలుగు ‘తీర్పు తీర్చు’ ప్రయోగానికి దత్తివిభక్తి సహజం.
theological_decisions:
- issue: ఇశ్రాయేలు పన్నెండు గోత్రాలకు సంబంధించి శిష్యుల భవిష్యత్తు పాత్ర స్వభావం
  choice: ప్రధాన పాఠ్యంలో ‘తీర్పు తీర్చడం’ అనే న్యాయపరమైన భాషను నిలుపడం
  alternative: ‘పరిపాలించడం’ లేదా ‘ఏలడం’
  rationale: κρίνω న్యాయనిర్ణయం చేయడం అనే ప్రత్యక్ష భావంతో పాటు పాలనా అధికారాన్ని కూడా సూచించగలదు. పాత్రను శిక్ష విధించడానికే లేదా పరిపాలనకే పరిమితం చేయకుండా ప్రధాన పాఠ్యం ప్రత్యక్ష భావాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ఇది ముందటి వాక్యంపై ఆధారపడిన ἵνα ఉపవాక్యం కావడంతో తెలుగులో కూడా అసంపూర్ణ వాక్యఖండ రూపాన్ని ఉద్దేశపూర్వకంగా నిలిపాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
