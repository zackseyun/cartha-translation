id: LUK.22.16
reference: Luke 22:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ⸀ὅτι οὐ μὴ φάγω ⸀αὐτὸ ἕως ὅτου πληρωθῇ ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/016.yaml
  text: For I tell you that I will certainly not eat it until it is fulfilled in the kingdom of God[a][b].
translation:
  language: te
  text: ఎందుకంటే నేను మీతో చెప్పేది ఏమిటంటే, దేవుని రాజ్యంలో అది నెరవేరే వరకు నేను దానిని ఎంతమాత్రమూ తినను[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని రాజ్యంలో అది నెరవేరే వరకు నేను దానిని ఇక ఎంతమాత్రమూ తినను.” గ్రీకు భవిష్యత్తులో తినడాన్ని బలంగా నిరాకరిస్తుంది. సందర్భాన్ని బట్టి “ఇక” అనే భావాన్ని గ్రహించవచ్చు; అయితే ఆ పదం గ్రీకులో ప్రత్యక్షంగా లేదు.
    reason: lexical_alternative
  - marker: b
    text: “అది/దానిని” అనేది ముందటి వచనంలో ప్రస్తావించిన పస్కా ఆచరణను లేదా పస్కా భోజనాన్ని సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: ఎందుకంటే, నేను మీతో చెబుతున్నాను
  rationale: γάρ మునుపటి వాక్యంతో ఉన్న వివరణాత్మక సంబంధాన్ని చూపుతుంది; λέγω ὑμῖν అనే మాటల సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὅτι
  choice: ':'
  rationale: గ్రీకు వాక్యంలో ఇది చెప్పబోయే విషయాన్ని పరిచయం చేస్తుంది. తెలుగులో ద్విబిందువు అదే నిర్మాణాన్ని సహజంగా సూచిస్తుంది.
- source_word: οὐ μὴ φάγω
  choice: నేను ... ఇక ఎంతమాత్రమూ తినను
  rationale: οὐ μή మరియు aorist subjunctive కలయిక భవిష్యత్తును గట్టిగా నిరాకరిస్తుంది. సందర్భం దృష్ట్యా ‘ఇక’ సహజంగా ఉన్నా, అది గ్రీకులో ప్రత్యక్షంగా లేదని పాదసూచికలో తెలుపబడింది.
- source_word: αὐτό
  choice: దానిని
  rationale: ఈ సర్వనామం ముందు వచనంలో ప్రస్తావించిన పస్కాను సూచిస్తుంది; ప్రధాన పాఠ్యంలో దాని సంక్షిప్తతను నిలుపుతుంది.
- source_word: ἕως ὅτου
  choice: వరకు
  rationale: కాలపరమైన హద్దును సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: πληρωθῇ
  choice: నెరవేరే
  rationale: ఈ కర్మణి రూపం నెరవేర్పు లేదా పరిపూర్తి భావాన్ని కలిగి ఉంది. ‘నెరవేరు’ రక్షణచరిత్ర సంబంధమైన ప్రతిధ్వనిని కాపాడుతుంది.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: దేవుని రాజ్యంలో
  rationale: βασιλείαలోని పాలన మరియు రాజ్య పరిధి అనే రెండు అనుబంధ భావాలను ‘రాజ్యం’ కాపాడుతుంది; గ్రీకు సంబంధ విభక్తి నిర్మాణం తెలుగులో సహజంగా వ్యక్తమవుతుంది.
theological_decisions:
- issue: αὐτό (‘దానిని’) యొక్క సూచన
  choice: ముందటి వచనంలో ప్రస్తావించిన పస్కా భోజనం లేదా ఆచరణను సూచించే సర్వనామంగానే ఉంచడం
  alternative: ప్రధాన పాఠ్యంలో ‘ఈ పస్కా భోజనాన్ని’ అని స్పష్టీకరించడం
  rationale: తక్షణ సందర్భం పస్కాను సూచించినప్పటికీ, గ్రీకు వచనం సర్వనామాన్నే వాడుతుంది. అందువల్ల ప్రధాన పాఠ్యం దాని సంక్షిప్తతను, సూచనలోని స్వల్ప విస్తృతిని కాపాడుతుంది.
- issue: ‘దేవుని రాజ్యంలో నెరవేరడం’ యొక్క అర్థం
  choice: నెరవేర్పు భాషను వివరించకుండా యథాతథంగా నిలుపడం
  alternative: దేవుని రాజ్యం రావడం ద్వారా లేదా మెస్సీయ విందులో అది నెరవేరుతుందని నిర్దిష్టీకరించడం
  rationale: గ్రీకు వచనం నెరవేర్పు ఏ విధంగా లేదా ఏ సంఘటనలో జరుగుతుందో చెప్పదు. అందువల్ల అనువాదం అంత్యకాల సంబంధమైన భావాన్ని నిలుపుతూ, దానిని ఒక ప్రత్యేక సిద్ధాంత వివరణకు పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు బలమైన నిరాకరణను ‘ఎంతమాత్రమూ ... తినను’తో వ్యక్తం చేసి, సందర్భసూచితమైన ‘ఇక’ గురించి పాదసూచికలో పారదర్శకత కల్పించబడింది.
