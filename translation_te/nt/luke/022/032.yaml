id: LUK.22.32
reference: Luke 22:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἐδεήθην περὶ σοῦ ἵνα μὴ ἐκλίπῃ ἡ πίστις σου· καὶ σύ ποτε ἐπιστρέψας ⸀στήρισον τοὺς ἀδελφούς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/032.yaml
  text: But I have prayed for you[a], that your faith may not fail; and you, when you have turned back[b], strengthen your brothers.
translation:
  language: te
  text: అయితే నేను నీకోసం ప్రార్థించాను—నీ విశ్వాసం[a] విఫలం కాకూడదని. నీవు తిరిగి వచ్చినప్పుడు[b] నీ సహోదరులను బలపరచు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ విశ్వసనీయత విఫలం కాకూడదని,’ లేదా ‘నీ నమ్మకం విఫలం కాకూడదని.’ గ్రీకు పదంలో ఈ భావాలు ఒకదానితో ఒకటి కలిసివుండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘నీవు మళ్లీ తిరిగినప్పుడు.’ ఈ మాటలు పేతురు రాబోయే వైఫల్యం తరువాత అతడు తిరిగి రావడాన్ని లేదా పునరుద్ధరించబడడాన్ని సూచిస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθην
  choice: ప్రార్థించాను
  rationale: ఈ క్రియ హృదయపూర్వకమైన విన్నపాన్ని సూచిస్తుంది. సందర్భంలో యేసు చేసిన మధ్యవర్తిత్వ ప్రార్థనను సహజంగా, గౌరవప్రదంగా తెలియజేయడానికి ‘ప్రార్థించాను’ సరిపోతుంది.
- source_word: περὶ σοῦ
  choice: నీకోసం
  rationale: ప్రార్థనను సూచించే క్రియతో περί + షష్ఠీ విభక్తి ఒకరి పక్షంగా చేసే ప్రార్థనను తెలియజేస్తుంది; తెలుగులో ‘నీకోసం’ సహజమైన సమానార్థకం.
- source_word: ἵνα μὴ ἐκλίπῃ
  choice: విఫలం కాకూడదని
  rationale: ἐκλείπω అంటే విఫలమవడం, క్షీణించడం లేదా అంతరించిపోవడం కావచ్చు. పేతురు రాబోయే నిరాకరణను దృష్టిలో ఉంచుకొని, అతని విశ్వాసం పూర్తిగా నశించిందని అతిశయంగా చెప్పకుండా ‘విఫలం కాకూడదని’ భావాన్ని నిలుపుతుంది.
- source_word: πίστις
  choice: విశ్వాసం
  rationale: ఈ పదంలో నమ్మకం, విశ్వసనీయత అనే భావాలు పరస్పరం కలిసివుండగలవు. ప్రధాన పాఠ్యంలో ‘విశ్వాసం’ దాని విస్తృతమైన భావపరిధిని నిలుపుతుంది.
- source_word: ποτε
  choice: అప్పుడు
  rationale: ఇక్కడ ποτέ భవిష్యత్తులోని ఒక అనిర్దిష్ట సమయాన్ని సూచిస్తుంది. ἐπιστρέψας‌తో కలిసి తెలుగులో ‘తిరిగి వచ్చినప్పుడు’ అనే నిర్మాణంలో ‘అప్పుడు’ భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: ἐπιστρέψας
  choice: తిరిగి వచ్చినప్పుడు
  rationale: ఈ అసమాపక క్రియ తిరగడం లేదా తిరిగి రావడం అనే భావాన్ని ఇస్తుంది; పేతురు వైఫల్యం తరువాత పునరుద్ధరణను సూచించగలిగినా, ‘పశ్చాత్తాపపడినప్పుడు’ అని మరీ సంకుచితం చేయకుండా దిశాత్మక రూపకాన్ని నిలుపుతుంది.
- source_word: στήρισον
  choice: బలపరచు
  rationale: ఇతరులను స్థిరంగా, దృఢంగా చేయమనే ఆజ్ఞను ఆధునిక తెలుగులో ‘బలపరచు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀδελφούς
  choice: సహోదరులను
  rationale: గ్రీకు పదం పుంలింగ బహువచనం; తక్షణ సందర్భంలో యేసు పురుష శిష్యులనే సూచిస్తుంది. ‘సహోదరులు’ ఆధునిక, గౌరవప్రదమైన తెలుగు పదం.
theological_decisions:
- issue: πίστις పదంలో ‘విశ్వాసం,’ ‘విశ్వసనీయత,’ ‘నమ్మకం’ అనే భావాల కలయిక
  choice: విశ్వాసం
  alternative: విశ్వసనీయత; నమ్మకం
  rationale: పేతురు పరీక్షలో నిలిచే సందర్భంలో విశ్వసనీయత అనే ఛాయ ఉన్నా, గ్రీకు పదం ఆ ఒక్క భావానికే పరిమితం కాదు. ప్రధాన పాఠ్యంలో ‘విశ్వాసం’ ఉంచి ఇతర సాధ్య భావాలను పాదసూచికలో తెలిపాం.
- issue: ἐπιστρέψας పేతురు భవిష్యత్తు స్థితిని ఎలా సూచిస్తుంది
  choice: తిరిగి వచ్చినప్పుడు
  alternative: మళ్లీ తిరిగినప్పుడు; పశ్చాత్తాపపడినప్పుడు
  rationale: ఈ పదం పేతురు వైఫల్యం తరువాత తిరిగి రావడం లేదా పునరుద్ధరణను సూచిస్తుంది. ‘తిరిగి వచ్చినప్పుడు’ రూపకాన్నీ theological tensionనూ నిలుపుతూ, మూలంలో నేరుగా లేని సాంకేతిక పశ్చాత్తాప పదాన్ని చేర్చదు.
- issue: ἀδελφούς యొక్క సందర్భానుసార లింగ సూచన
  choice: సహోదరులను
  alternative: తోటి విశ్వాసులను; సహోదర సహోదరీలను
  rationale: తక్షణ సందర్భంలో పురుష శిష్యుల వర్గమే ఉద్దేశించబడినందున పుంలింగ సూచనను నిలిపాం; మిశ్రమ సమూహాన్ని సూచించే విస్తృత రూపం ఇక్కడ అనవసర సాధారణీకరణ అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘అయితే’ δέ యొక్క వ్యత్యాసాన్ని చూపుతుంది. వాక్యంలోని ప్రార్థన ఉద్దేశాన్ని డ్యాష్‌తో స్పష్టపరిచినా మూల భావక్రమం నిలుపబడింది. ‘తిరిగి వచ్చినప్పుడు’ పశ్చాత్తాపం లేదా పునరుద్ధరణ అనే భావాన్ని బలవంతంగా నిర్ణయించకుండా అసలు గ్రీకు పదంలోని విస్తృతిని కాపాడుతుంది.
