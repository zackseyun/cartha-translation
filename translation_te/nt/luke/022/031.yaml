  naturalness: The proposed revision is fluent modern standard Telugu. “గట్టిగా అడిగాడు” expresses the force of ἐξῃτήσατο naturally, and “గోధుమలను జల్లించినట్లుగా” makes the agricultural comparison clear.
  terminology: “సాతాను,” “సీమోను,” and “జల్లించడానికి” are appropriate. The plural note is retained and slightly tightened to explain the grammatical feature without overstating it.
  issues:
  - severity: medium
    issue: “అనుమతి కోరుకున్నాడు” adds an explicit permission concept.
    rationale: ἐξῃτήσατο conveys an urgent or insistent request/demand, but neither the verb nor this verse explicitly says “permission.” The revision avoids supplying an unstated theological or narrative implication while retaining the verb’s force.
  - severity: low
    issue: The draft’s opening quotation mark has no closing quotation mark.
    rationale: The complete revised text supplies matching Telugu quotation punctuation.
