id: LUK.22.31
reference: Luke 22:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Σίμων Σίμων, ἰδοὺ ὁ Σατανᾶς ἐξῃτήσατο ὑμᾶς τοῦ σινιάσαι ὡς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/031.yaml
  text: 'Simon, Simon, look: Satan has demanded to have all of you, to sift you like wheat.'
translation:
  language: te
  text: “సీమోనూ, సీమోనూ, ఇదిగో! మిమ్మల్ని గోధుమలను జల్లించినట్లుగా జల్లించడానికి సాతాను గట్టిగా అడిగాడు.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σίμων Σίμων
  choice: సీమోనూ, సీమోనూ
  rationale: సంబోధనను సహజమైన తెలుగు రూపంలో ఉంచి, రెండుసార్లు పలకడంలోని గంభీరమైన వ్యక్తిగత హెచ్చరికను నిలిపింది.
- source_word: ἰδοὺ
  choice: ఇదిగో!
  rationale: శ్రద్ధను వెంటనే ఆకర్షించే గ్రీకు సూచనను ఆధునిక, సహజ తెలుగులో బలంగా వ్యక్తం చేస్తుంది.
- source_word: ἐξῃτήσατο
  choice: అనుమతి కోరుకున్నాడు
  rationale: ఈ క్రియలోని బలమైన అభ్యర్థన భావాన్ని తెలియజేస్తుంది; ఎవరి వద్ద కోరాడో మూలపాఠం స్పష్టంగా చెప్పనందున తెలుగులోనూ చెప్పలేదు.
- source_word: ὑμᾶς
  choice: మిమ్మల్ని
  rationale: గ్రీకులో ఇది బహువచనం; సీమోనును ఉద్దేశించి మాట్లాడుతున్నప్పటికీ అభ్యర్థన శిష్యులందరినీ గురించినదని తెలుపుతుంది.
- source_word: τοῦ σινιάσαι ὡς τὸν σῖτον
  choice: గోధుమల్లా జల్లించడానికి
  rationale: ధాన్యాన్ని జల్లెడతో జల్లించే వ్యవసాయ రూపకాన్ని సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: సాతాను చేసిన అభ్యర్థన యొక్క బలం
  choice: అనుమతి కోరుకున్నాడు
  alternative: మిమ్మల్ని తనకు అప్పగించాలని పట్టుబట్టాడు
  rationale: ἐξῃτήσατο బలమైన కోరిక లేదా డిమాండ్‌ను సూచించగలదు. అయితే దేవుని అనుమతి అనే సందర్భార్థాన్ని అతిగా సిద్ధాంతీకరించకుండా, మూలంలోని అభ్యర్థన భావాన్ని ఈ ఎంపిక కాపాడుతుంది.
- issue: ὑμᾶς యొక్క వచనం
  choice: బహువచనార్థాన్ని ప్రధాన పాఠంలో ఉంచడం
  alternative: నిన్ను
  rationale: యేసు సీమోనును ఏకవచన సంబోధనతో పిలిచినా, ὑμᾶς బహువచనం. కాబట్టి శిష్యుల సమూహం ఉద్దేశించబడిన విషయాన్ని దాచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ప్రత్యక్ష సంబోధనలోని అత్యవసరతను, ధాన్యం జల్లించే రూపకాన్ని నిలిపింది.
