- from: ఆయన ఒక పానపాత్రను[a] అందుకొని, కృతజ్ఞతలు చెల్లించి, “దీనిని తీసుకొని మీలో మీరు పంచుకోండి[b]” అని చెప్పాడు.
  to: ఆయన ఒక పానపాత్రను[a] అందుకొని, కృతజ్ఞతలు చెప్పి, “దీనిని తీసుకొని మీ మధ్య పంచుకోండి[b]” అని చెప్పాడు.
  rationale: 'The revision makes two limited idiomatic improvements: it uses “కృతజ్ఞతలు చెప్పి” for natural modern narration and “మీ మధ్య పంచుకోండి” for the reciprocal distribution commanded by διαμερίσατε εἰς ἑαυτούς. The Greek’s anarthrous “a cup,” the unexpanded demonstrative “this,” and the nontechnical register are preserved.'
