id: LUK.22.17
reference: Luke 22:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ δεξάμενος ποτήριον εὐχαριστήσας εἶπεν· Λάβετε τοῦτο καὶ διαμερίσατε ⸂εἰς ἑαυτούς⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/017.yaml
  text: And after receiving a cup and giving thanks[a], he said[b], “Take this and divide it among yourselves.”
translation:
  language: te
  text: ఆయన ఒక పానపాత్రను[a] అందుకొని, కృతజ్ఞతలు చెప్పి, “దీనిని తీసుకొని మీ మధ్య పంచుకోండి[b]” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పానపాత్రను.” గ్రీకులో ‘పానపాత్ర’ అనే నామవాచకానికి నిర్దేశక ఉపపదం లేదు; అయితే భోజన సందర్భం ఒక నిర్దిష్ట పాత్రను సూచిస్తుండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దీనిని మీ మధ్య విభజించుకోండి,” లేదా “మీ మధ్య పంచిపెట్టుకోండి.” సందర్భంలో ఈ క్రియకు విభజించడం లేదా పంచిపెట్టడం అనే అర్థం రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεξάμενος
  choice: అందుకొని
  rationale: δέχομαι అనే క్రియ యొక్క భూతకాలిక కృదంత రూపం ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచిస్తుంది. ‘అందుకొని’ అనేది ‘స్వీకరించి’ కంటే ఈ భోజన సందర్భంలో సహజంగా ఉండి, మరొకరి నుండి పాత్రను పొందిన భావాన్ని నిలుపుతుంది.
- source_word: ποτήριον
  choice: ఒక పానపాత్రను
  rationale: గ్రీకులో నిర్దేశక ఉపపదం లేదు. ‘ఒక’ అనే పదం ఆ అనిర్దిష్ట రూపాన్ని తెలుగులో సాధ్యమైనంత స్పష్టంగా చూపుతుంది; ‘పానపాత్ర’ ద్రవం తాగే పాత్రను ఖచ్చితంగా సూచిస్తుంది.
- source_word: εὐχαριστήσας
  choice: కృతజ్ఞతలు చెల్లించి
  rationale: ఈ కృదంతం మాట్లాడకముందు కృతజ్ఞతలు తెలిపిన చర్యను సూచిస్తుంది. ఈ సాధారణ వర్ణనాత్మక పదబంధం తరువాతి ఆచార సంబంధ సాంకేతిక భావాన్ని అనవసరంగా చేర్చదు.
- source_word: εἶπεν
  choice: అని చెప్పాడు
  rationale: గ్రీకులో పరోక్ష కర్మ స్పష్టంగా లేదు. కాబట్టి ‘వారితో’ అనే పదాన్ని చేర్చకుండా మూలంలోని సంక్షిప్తతను నిలిపింది.
- source_word: Λάβετε
  choice: తీసుకొని
  rationale: ఇది λαμβάνω యొక్క ఆజ్ఞార్థక రూపం. తెలుగులో తరువాతి ‘పంచుకోండి’తో కలిపి ‘తీసుకొని ... పంచుకోండి’ అని చెప్పడం ఈ భోజన సందర్భంలో సహజమైన ఆజ్ఞగా ఉంటుంది.
- source_word: τοῦτο
  choice: దీనిని
  rationale: ఈ సూచన సర్వనామం ముందుగా చెప్పిన పానపాత్రను సూచిస్తుంది; మూలంలో నామవాచకం మళ్లీ లేదు కనుక ‘ఈ పానపాత్రను’ అని విస్తరించలేదు.
- source_word: διαμερίσατε
  choice: పంచుకోండి
  rationale: ఈ క్రియకు విభజించడం, పంచిపెట్టడం అనే అర్థాలు ఉన్నాయి. ‘మీలో మీరు’తో కలిసి ‘పంచుకోండి’ అనేది పరస్పర పంపిణీ భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: εἰς ἑαυτούς
  choice: మీలో మీరు
  rationale: సందర్భంలో ఇది సమూహంలోని సభ్యుల మధ్య పంపిణీని సూచిస్తుంది. ‘మీ కోసం’ అని అనువదిస్తే స్వాధీనపరచుకోవడం అనే తప్పు భావం కలగవచ్చు.
theological_decisions:
- issue: εὐχαριστήσας మరియు ποτήριον పదాలను తరువాతి ప్రభుభోజన ఆచారానికి ప్రత్యేకమైన పరిభాషతో అనువదించాలా?
  choice: ‘ఒక పానపాత్ర’ మరియు ‘కృతజ్ఞతలు చెల్లించి’ అనే సాధారణ కథన భాషను ఉపయోగించడం
  alternative: ‘ఆ పానపాత్ర’ అని నిర్దిష్టంగా చెప్పడం లేదా ప్రత్యేక ఆచార సంబంధ పరిభాషను ఉపయోగించడం
  rationale: ఈ వచనం యేసు భోజన సమయంలో చేసిన కార్యాన్ని వర్ణిస్తుంది. గ్రీకు వచనం స్పష్టంగా చెప్పని తరువాతి సంఘ ఆచార భావాలను అనువాదంలో చేర్చకుండా, చారిత్రక దృశ్యాన్ని మరియు మూలంలోని రూపాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘పానపాత్ర’ సాధారణ ‘పాత్ర’ కంటే మూలపదంలోని తాగే పాత్ర భావాన్ని స్పష్టంగా ఇస్తుంది. ‘మీలో మీరు పంచుకోండి’ సామూహిక పంపిణీని సులభంగా అర్థమయ్యేలా తెలియజేస్తుంది.
