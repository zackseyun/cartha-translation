  yaml_path: translation/nt/luke/022/003.yaml
  text: Then Satan entered into Judas[a], the one called Iscariot[c][b], who was of the number of the twelve.
translation:
  language: te
  text: అప్పుడు సాతాను, పన్నెండుమందిలో ఒకడైన ఇస్కరియోతు అని పిలువబడే యూదాలోకి ప్రవేశించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘పన్నెండుమంది లెక్కలో ఉన్నవాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσῆλθεν δὲ
  choice: అప్పుడు … ప్రవేశించాడు
  rationale: δέ ఇక్కడ కథన పురోగతిని సూచిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు అనుసంధానం. εἰσῆλθεν యొక్క భూతకాల క్రియను ‘ప్రవేశించాడు’ స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: Σατανᾶς
  choice: సాతాను
  rationale: కొత్త నిబంధన వాడుకలోని వ్యక్తినామం/బిరుదుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: εἰς Ἰούδαν
  choice: యూదాలోకి
  rationale: εἰς సూచించే లోపలికి ప్రవేశించే దిశను ‘లోకి’ నిలుపుతుంది; కేవలం ప్రభావితం చేశాడనే బలహీన భావంగా మార్చదు.
- source_word: τὸν καλούμενον Ἰσκαριώτην
  choice: ఇస్కరియోతు అని పిలువబడే
  rationale: καλούμενον అనే విశేషణాత్మక కృదంతం యూదాను గుర్తించే పేరును తెలియజేస్తుంది; ఈ రూపం తెలుగులో సహజంగా ఉండి గ్రీకు నిర్మాణ భావాన్ని కాపాడుతుంది.
- source_word: ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα
  choice: పన్నెండుమందిలో ఒకడైన
  rationale: ఆ పన్నెండుమంది గుంపులో యూదా సభ్యుడని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ‘లెక్కలో’ అనే మూలపాఠపు రూపాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: యూదాలో సాతాను చేసిన కార్య స్వభావం
  choice: ‘యూదాలోకి ప్రవేశించాడు’ అని బలమైన మూలపాఠ పదప్రయోగాన్ని యథాతథ భావంతో నిలపడం
  alternative: ‘యూదాను ప్రభావితం చేశాడు’ లేదా ‘యూదాను పట్టుకున్నాడు’
  rationale: εἰσῆλθεν … εἰς ప్రవేశాన్ని ప్రత్యక్షంగా తెలియజేస్తుంది. ఇది కేవలం మానసిక ప్రభావమని బలహీనపరచకుండా, అదే సమయంలో దయ్యం పట్టడం లేదా యూదా బాధ్యత గురించి అదనపు సిద్ధాంత వివరణను చేర్చకుండా వాక్యంలోని ఉద్రిక్తతను నిలుపుతుంది.
- issue: ‘పన్నెండుమంది’ ఒక గుర్తింపు పొందిన అపొస్తలుల గుంపుగా సూచించబడటం
  choice: ‘పన్నెండుమంది’
  alternative: ప్రత్యేక నామంలా ‘పన్నెండుమంది’ని ముద్రణా శైలితో ప్రత్యేకీకరించడం
  rationale: తెలుగులో పెద్ద అక్షరాల భేదం లేదు. సందర్భమే ఇది యేసు ఏర్పరచిన ప్రత్యేక గుంపని తెలియజేస్తుంది; అదనపు బిరుదును చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘యూదాలోకి’ మూలంలోని εἰς బలాన్ని నిలుపుతుంది; ‘పన్నెండుమందిలో ఒకడైన’ సాధారణ పాఠకుడికి వెంటనే అర్థమయ్యే రూపం.
