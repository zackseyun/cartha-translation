source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἀπεσπάσθη ἀπ’ αὐτῶν ὡσεὶ λίθου βολήν, καὶ θεὶς τὰ γόνατα προσηύχετο
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/041.yaml
  text: And he withdrew from them about a stone’s throw[a], and kneeling down[b], he was praying.
translation:
  language: te
  text: ఆయన వారి దగ్గర నుండి దాదాపు ఒక రాయి విసిరినంత దూరం వెళ్లి[a], మోకాళ్లూని[b] ప్రార్థిస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక రాయి విసిరితే చేరేంత దూరం.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మోకాళ్లు ఉంచి’; అంటే, మోకరించి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεσπάσθη
  choice: వారి దగ్గర నుండి ... దూరం వెళ్లి
  rationale: వ్యాకరణ రూపం నిష్క్రియాత్మకంగా ఉన్నప్పటికీ, సందర్భంలో శిష్యుల నుండి వేరుగా వెళ్లడాన్ని సహజంగా వ్యక్తం చేస్తుంది. ‘దూరం వెళ్లి’ అనేది ఉద్దేశపూర్వకంగా కొంత దూరం తొలగిన భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా ఇస్తుంది.
- source_word: ὡσεὶ λίθου βολήν
  choice: దాదాపు ఒక రాయి విసిరినంత దూరం
  rationale: ఇది సుమారు దూరాన్ని తెలిపే నానుడి. ‘దాదాపు’ ὡσεὶ లోని అంచనా భావాన్ని, ‘ఒక రాయి విసిరినంత దూరం’ మూలంలోని దృశ్యరూపాన్ని కాపాడుతాయి.
- source_word: θεὶς τὰ γόνατα
  choice: మోకాళ్లూని
  rationale: అక్షరార్థంగా ‘మోకాళ్లు ఉంచి’ అనే ఈ ప్రయోగం మోకరించి కూర్చోవడాన్ని సూచిస్తుంది. ‘మోకాళ్లూని’ శరీర భంగిమను సహజమైన, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: προσηύχετο
  choice: ప్రార్థిస్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న క్రియాభావాన్ని ‘ప్రార్థిస్తూ ఉన్నాడు’ నిలుపుతుంది; కేవలం ‘ప్రార్థించాడు’ అనడం ఆ కాలవ్యాప్తిని తగ్గిస్తుంది.
- source_word: αὐτὸς
  choice: ఆయన
  rationale: సర్వనామంలోని స్వల్ప ఉద్ఘాటనను తెలుగులో విడిగా ‘ఆయనే’ అని బలపరచడం అవసరం లేదు; గౌరవప్రదమైన ‘ఆయన’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: καὶ
  choice: వాక్య క్రమసంధానంగా అంతర్లీనంగా ఉంచబడింది
  rationale: తెలుగు కథన ప్రవాహంలో ప్రారంభ ‘మరియు’ కృత్రిమంగా వినిపిస్తుంది. వరుస క్రియలను ‘వెళ్లి ... ప్రార్థిస్తూ’ అని అనుసంధానించడం καὶ యొక్క కథన సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ప్రార్థనా భంగిమ మరియు క్రీస్తు చిత్రణ
  choice: యేసు శిష్యుల నుండి కొంత దూరం వెళ్లి, మోకాళ్లూని ప్రార్థిస్తున్న దృశ్యాన్ని నేరుగా అనువదించడం
  alternative: ఈ చర్యకు అదనపు భక్తిపరమైన లేదా సిద్ధాంతపరమైన వివరణను జోడించడం
  rationale: మూల వాక్యం ఆయన కదలిక, శరీర భంగిమ, కొనసాగుతున్న ప్రార్థనను మాత్రమే వర్ణిస్తుంది. అనువాదం ఆ గంభీర దృశ్యాన్ని అలంకరణ లేకుండా నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘మోకాళ్లూని’ సాధారణ పాఠకులకు అర్థమయ్యే విధంగా ప్రార్థనా భంగిమను తెలియజేస్తుంది; ‘ప్రార్థిస్తూ ఉన్నాడు’ కొనసాగుతున్న క్రియను నిలుపుతుంది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
