source:
  edition: SBLGNT
  text: καὶ περικαλύψαντες ⸂αὐτὸν ἐπηρώτων⸃ λέγοντες· Προφήτευσον, τίς ἐστιν ὁ παίσας σε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/064.yaml
  text: And after covering him[a], they kept asking, saying, “Prophesy! Who is the one who struck you?”
translation:
  language: te
  text: ఆయనను కప్పి[a], “ప్రవచించు! నిన్ను కొట్టినవాడు ఎవరు?” అని వారు పదేపదే అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆయన కళ్లకు గంతలు కట్టి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περικαλύψαντες
  choice: ఆయనను కప్పి
  rationale: క్రియారూపం ఆయనను కప్పడం లేదా ముసుగు వేయడం అనే విస్తృత భావాన్ని ఇస్తుంది; చూపును అడ్డగించారని సందర్భం సూచించినా, ప్రధాన పాఠంలో దానిని మరీ నిర్దిష్టంగా చేయలేదు.
- source_word: ἐπηρώτων
  choice: వారు పదేపదే అడిగారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగిన లేదా పునరావృత చర్యను ‘పదేపదే అడిగారు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λέγοντες
  choice: అని
  rationale: వారి ప్రశ్నలోని మాటలను తెలుగులో సహజంగా పరిచయం చేస్తూ గ్రీకు కృదంత భావాన్ని తెలియజేస్తుంది.
- source_word: Προφήτευσον
  choice: ప్రవచించు!
  rationale: ఇది అపహాస్యంగా పలికిన ప్రత్యక్ష ఆజ్ఞ; ‘ప్రవచించు!’ దాని సంక్షిప్తతను, వ్యంగ్యాన్ని నిలుపుతుంది.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: నిన్ను కొట్టినవాడు ఎవరు?
  rationale: ὁ παίσας అనే నామవాచకార్థక కృదంతాన్ని ‘కొట్టినవాడు’గా సహజంగా, ప్రత్యక్షంగా అనువదిస్తుంది.
theological_decisions:
- issue: యేసు కళ్లకు గంతలు కట్టారని ప్రధాన పాఠంలో స్పష్టంగా చెప్పాలా
  choice: ప్రధాన పాఠంలో విస్తృతమైన ‘ఆయనను కప్పి’ అనే పదప్రయోగాన్ని ఉంచడం
  alternative: ‘ఆయన కళ్లకు గంతలు కట్టి’ అని అనువదించడం
  rationale: సందర్భం చూపును అడ్డగించడాన్ని సూచిస్తుంది; అయితే గ్రీకు పదం స్వయంగా కప్పడం లేదా ముసుగు వేయడం అనే విస్తృత భావమే ఇస్తుంది. అందువల్ల మూలం చెప్పినదానికంటే ఎక్కువ నిర్దిష్టతను ప్రధాన పాఠంలో చేర్చకుండా, సాధారణంగా అర్థం చేసుకునే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘పదేపదే’ ద్వారా గ్రీకు అసంపూర్ణ భూతకాలంలోని పునరావృత భావం నిలుపబడింది; ‘కప్పి’ మూలంలోని ఉద్దేశపూర్వక విస్తృతతను కాపాడుతుంది.
