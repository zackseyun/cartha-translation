id: LUK.22.10
reference: Luke 22:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἰδοὺ εἰσελθόντων ὑμῶν εἰς τὴν πόλιν συναντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ εἰς τὴν οἰκίαν ⸂εἰς ἣν⸃ εἰσπορεύεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/010.yaml
  text: And he said to them[a], “Look, when you enter the city, a man carrying a jar of water will meet you[b]. Follow him into the house that he enters.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “చూడండి, మీరు పట్టణంలోకి ప్రవేశిస్తున్నప్పుడు, నీళ్ల కుండ మోస్తున్న ఒక మనిషి మీకు ఎదురవుతాడు.[a] అతడు ప్రవేశించే ఇంటిలోకి అతని వెంట వెళ్లండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కుండ” అనే పదానికి మూలంలోని κεράμιον ప్రత్యేకంగా మట్టిపాత్రను సూచించవచ్చు; అందువల్ల “నీళ్ల మట్టికుండ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: చూడండి
  rationale: సంభాషణలో శ్రద్ధను ఆకర్షించే సహజమైన ఆధునిక తెలుగు ప్రయోగం; మూలంలోని నిర్దేశక బలాన్ని నిలుపుతుంది.
- source_word: εἰσελθόντων ὑμῶν εἰς τὴν πόλιν
  choice: మీరు పట్టణంలోకి ప్రవేశిస్తున్నప్పుడు
  rationale: జెనిటివ్ అబ్సల్యూట్‌ను కాలార్థకంగా చూపుతూ, వారు పట్టణంలోకి ప్రవేశించే సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: συναντήσει ὑμῖν
  choice: మీకు ఎదురవుతాడు
  rationale: తెలుగులో అనుకోకుండా లేదా సూచించిన సందర్భంలో ఒక వ్యక్తి ఎదురుపడటాన్ని సహజంగా తెలిపే ప్రయోగం.
- source_word: ἄνθρωπος
  choice: ఒక మనిషి
  rationale: ఇక్కడ నిర్దిష్ట పురుష వ్యక్తిని సూచిస్తున్నందున లింగార్థాన్ని కచ్చితంగా నిలుపుతుంది.
- source_word: κεράμιον ὕδατος
  choice: నీళ్ల కుండ
  rationale: సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే రూపం; పాత్ర మట్టితో చేసినదై ఉండవచ్చనే భావాన్ని ప్రధాన వచనంలో అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: βαστάζων
  choice: మోస్తున్న
  rationale: ఆ వ్యక్తి కొనసాగిస్తూ చేస్తున్న చర్యను సహజమైన తెలుగు వర్తమాన విశేషణ రూపంలో తెలియజేస్తుంది.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: అతని వెంట వెళ్లండి
  rationale: ప్రత్యక్ష ఆజ్ఞను సహజంగా వ్యక్తం చేస్తూ, అతడిని అనుసరించాలనే అర్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: οἰκίαν
  choice: ఇంటి
  rationale: దిశను సూచించే ఈ సందర్భంలో οἰκία యొక్క స్థూలమైన అర్థమైన ‘ఇల్లు’ను నిలుపుతుంది.
- source_word: εἰς ἣν εἰσπορεύεται
  choice: అతడు ప్రవేశించే ఇంటిలోకి
  rationale: అతడు ఏ ఇంటిలోకి వెళ్తాడో అదే ఇంటిని సంబంధవాచక భావంతో స్పష్టంగా గుర్తిస్తుంది; మూలంలోని దిశార్థాన్ని నిలుపుతుంది.
