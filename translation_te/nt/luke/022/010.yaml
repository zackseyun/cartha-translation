translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి ఉపయోగించబడింది. ప్రధాన వచనంలోని [a] సూచిక సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
