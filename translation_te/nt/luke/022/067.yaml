- from: వారు, “నీవు మెస్సీయవైతే[a], మాతో చెప్పు” అన్నారు. అయితే ఆయన వారితో, “నేను మీతో చెప్పినా మీరు ఎంతమాత్రమూ నమ్మరు;” అన్నాడు.
  to: వారు, “నీవు మెస్సీయవైతే[a], మాతో చెప్పు” అన్నారు. అయితే ఆయన వారితో, “నేను మీతో చెప్పితే మీరు ఎంతమాత్రమూ నమ్మరు;” అన్నాడు.
