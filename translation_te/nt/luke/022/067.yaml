id: LUK.22.67
reference: Luke 22:67
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγοντες· Εἰ σὺ εἶ ὁ χριστός, εἰπὸν ἡμῖν. εἶπεν δὲ αὐτοῖς· Ἐὰν ὑμῖν εἴπω οὐ μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/067.yaml
  text: saying[a], “If you are the Messiah, tell us.” But he said to them, “If I tell you, you will certainly not believe;”
translation:
  language: te
  text: వారు, “నీవు మెస్సీయవైతే[a], మాతో చెప్పు” అన్నారు. అయితే ఆయన వారితో, “నేను మీతో చెప్పితే మీరు ఎంతమాత్రమూ నమ్మరు;” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “క్రీస్తువైతే.”
    reason: Χριστός అనే గ్రీకు బిరుదుకు ప్రాచుర్యంలో ఉన్న ప్రత్యామ్నాయ రూపాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: λέγοντες
  choice: అన్నారు
  rationale: ఈ వర్తమాన కృదంతం ముందరి వాక్యంలోని సభాసభ్యుల మాటలను పరిచయం చేస్తుంది. తెలుగులో స్వతంత్ర ప్రత్యక్ష వాక్యానికి చివర ‘అన్నారు’ అని పెట్టడం సహజంగా ఉండి, ముందరి కథనంతో సంబంధాన్ని నిలుపుతుంది.
- source_word: Εἰ σὺ εἶ
  choice: నీవు … వైతే
  rationale: గ్రీకులోని స్పష్టమైన షరతు రూపాన్ని ప్రశ్నగా మార్చకుండా తెలుగులో సహజమైన షరతు నిర్మాణంతో నిలిపింది.
- source_word: ὁ χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ ఇది యూదుల అభిషిక్త విమోచకుని బిరుదు. ‘క్రీస్తు’ అనే ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో ఇచ్చి బిరుదు యొక్క సంప్రదాయ రూపాన్నీ తెలియజేసింది.
- source_word: εἰπὸν ἡμῖν
  choice: మాతో చెప్పు
  rationale: దత్తివాచక సర్వనామంతో ఉన్న ఆజ్ఞార్థక λέγωను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἶπεν δὲ αὐτοῖς
  choice: అయితే ఆయన వారితో … అన్నాడు
  rationale: δέలోని స్వల్ప వ్యతిరేకతను లేదా ప్రతిస్పందనాత్మక మార్పును ‘అయితే’ సహజంగా తెలియజేస్తుంది.
- source_word: Ἐὰν ὑμῖν εἴπω
  choice: నేను మీతో చెప్పినా
  rationale: గ్రీకు షరతు భావాన్ని సహజమైన తెలుగు నిర్మాణంతో నిలుపుతుంది; ‘చెప్పినప్పటికీ’ అనే అంతర్నిహిత వ్యతిరేక భావాన్ని అతిగా విస్తరించదు.
- source_word: οὐ μὴ πιστεύσητε
  choice: మీరు ఎంతమాత్రమూ నమ్మరు
  rationale: οὐ μήతో కూడిన బలమైన నిరాకరణను స్పష్టమైన, ప్రస్తుత ప్రామాణిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: విచారణ సందర్భంలో ఈ పదం యూదుల మెస్సీయ నిరీక్షణకు సంబంధించిన బిరుదుగా ఉంది. ప్రధాన పాఠంలో ‘మెస్సీయ’ ఆ నేపథ్యాన్ని స్పష్టం చేస్తుంది; ‘క్రీస్తు’ను నిజమైన ప్రత్యామ్నాయ బిరుదు రూపంగా పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ప్రత్యక్ష సంభాషణ. గ్రీకు షరతు నిర్మాణం మరియు బలమైన నిరాకరణ రెండూ నిలుపబడ్డాయి.
