id: LUK.22.24
reference: Luke 22:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ καὶ φιλονεικία ἐν αὐτοῖς, τὸ τίς αὐτῶν δοκεῖ εἶναι μείζων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/024.yaml
  text: A dispute also arose among them as to which of them was considered to be greater[a].
translation:
  language: te
  text: తమలో ఎవరు గొప్పవారిగా పరిగణించబడుతున్నారనే విషయంపై వారి మధ్య వివాదం కూడా తలెత్తింది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమలో ఎవరు గొప్పవారిగా కనిపిస్తున్నారో అనే విషయంపై.” గ్రీకు క్రియకు “కనిపించడం” లేదా “పరిగణించబడడం” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: తలెత్తింది
  rationale: ఇక్కడ γίνομαι ఒక పరిస్థితి ఉద్భవించడాన్ని సూచిస్తుంది. వివాదం మొదలైందనే భావాన్ని ‘తలెత్తింది’ సహజంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ కథనంలోని తదుపరి పరిణామాన్ని సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో ప్రత్యేక సంధానపదం లేకుండానే ఈ మార్పు సహజంగా వ్యక్తమవుతుంది; మూలంలో లేని కాలసూచక పదాన్ని చేర్చలేదు.
- source_word: καὶ
  choice: కూడా
  rationale: ఈ సంఘటనను ముందటి కథనానికి అదనంగా చూపించే καί యొక్క సంకలన భావాన్ని నిలుపుతుంది.
- source_word: φιλονεικία
  choice: వివాదం
  rationale: φιλονεικίαలో వాదనతో పాటు పోటీతత్వం ఉన్నప్పటికీ, ఈ సందర్భంలో ‘వివాదం’ స్పష్టమైన, సహజమైన ఆధునిక తెలుగు పదం.
- source_word: ἐν αὐτοῖς
  choice: వారి మధ్య
  rationale: వివాదం ఆ సమూహంలోనే జరిగిందనే సామాజిక సంబంధ భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τὸ τίς αὐτῶν
  choice: తమలో ఎవరు … అనే విషయంపై
  rationale: నిర్దిష్ట ఉపపదం τὸ పరోక్ష ప్రశ్నను వివాదపు విషయంగా చూపుతుంది; ఈ తెలుగు నిర్మాణం అదే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: δοκεῖ
  choice: పరిగణించబడుతున్నారు
  rationale: ఈ సందర్భంలో δοκέω సమూహంలో ఒకరి స్థాయి గురించి ఇతరుల అంచనాను సూచించవచ్చు. అయితే ‘కనిపిస్తున్నారు’ అనే అర్థమూ సాధ్యమే కాబట్టి దానిని పాదసూచికలో ఉంచాం.
- source_word: εἶναι
  choice: గొప్పవారిగా
  rationale: δοκεῖకి పూరకంగా ఉన్న εἶναι భావం తెలుగులో ‘-గా’ నిర్మాణంలో సహజంగా అంతర్భవిస్తుంది.
- source_word: μείζων
  choice: గొప్పవారు
  rationale: ఇది తులనాత్మక రూపం. తెలుగు సందర్భంలో ‘తమలో ఎవరు’ అనే నిర్మాణమే పోలికను తెలియజేస్తుంది; ‘అందరికంటే గొప్పవారు’ అని అనువదిస్తే మూలంలోని తులనాత్మకాన్ని స్పష్టమైన అత్యుత్తమ స్థాయిగా మార్చే ప్రమాదం ఉంది.
theological_decisions:
- issue: శిష్యుల మధ్య స్థాయి సూచించే భాష
  choice: గొప్పవారు
  alternative: అందరికంటే గొప్పవారు / ఎక్కువ ప్రాముఖ్యమైనవారు
  rationale: గ్రీకులో μείζων తులనాత్మక రూపం; స్పష్టమైన అత్యుత్తమ రూపం కాదు. కాబట్టి మూలపాఠం చెప్పినదానికంటే భావాన్ని తీవ్రం చేయకుండా స్థాయి పోలికను నిలిపాం.
- issue: δοκεῖలోని అర్థసందిగ్ధత
  choice: పరిగణించబడుతున్నారు
  alternative: కనిపిస్తున్నారు
  rationale: శిష్యుల మధ్య స్థాయి గురించి జరుగుతున్న వివాదంలో సామాజిక అంచనా అనే భావం సందర్భానికి సరిపోతుంది. అయినప్పటికీ ‘కనిపించు/అనిపించు’ అనే నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలిని ఉపయోగించాం. ‘వారి మధ్య వివాదం తలెత్తింది’ అనే సహజ ప్రయోగాన్ని ఎంచుకుని, δοκεῖ యొక్క అర్థసందిగ్ధతను పాదసూచికలో నిలిపాం.
