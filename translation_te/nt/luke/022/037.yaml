source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ⸀ὅτι τοῦτο τὸ γεγραμμένον δεῖ τελεσθῆναι ἐν ἐμοί, τό· Καὶ μετὰ ἀνόμων ἐλογίσθη· καὶ γὰρ ⸀τὸ περὶ ἐμοῦ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/037.yaml
  text: 'For I tell you that this which is written must be fulfilled in me: ‘And he was counted with the lawless.’ For what concerns me has its fulfillment[a][b].'
translation:
  language: te
  text: 'ఎందుకంటే, రాసి ఉన్న ఈ వాక్యం నాలో నెరవేరాలని నేను మీతో చెబుతున్నాను: ‘ఆయన చట్టవిరోధులతో కలిసి లెక్కించబడ్డాడు.’[a] ఎందుకంటే, నా గురించినది ముగింపుకు చేరుతోంది.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, సంప్రదాయబద్ధంగా: “ఆయన అతిక్రమకులతో కలిసి లెక్కించబడ్డాడు” (యెషయా 53:12).'
    reason: alternative_reading
  - marker: b
    text: 'లేదా: “నా గురించినది నెరవేర్పు పొందుతోంది,” లేదా “పూర్తవుతోంది.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: ఎందుకంటే నేను మీతో చెప్తున్నాను
  rationale: λέγω + ὑμῖνను సహజమైన ఆధునిక తెలుగులో ‘మీతో చెప్తున్నాను’గా ఇచ్చి, γάρ సూచించే వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’తో నిలిపాం.
- source_word: τοῦτο τὸ γεγραμμένον
  choice: రాసి ఉన్న ఈ మాట
  rationale: ‘లేఖనం’ అని స్పష్టీకరించకుండా, సూచక సర్వనామం మరియు రాయబడినదనే భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: δεῖ τελεσθῆναι ἐν ἐμοί
  choice: నాలో నెరవేరాలి
  rationale: δεῖ యొక్క అవసరతను ‘నెరవేరాలి’ నిలుపుతుంది; ప్రవచన సందర్భంలో τελεσθῆναιకు ‘నెరవేరు’ తగినది; ἐν ἐμοίని వ్యాఖ్యానించి మార్చకుండా ‘నాలో’గా ఉంచాం.
- source_word: Καὶ μετὰ ἀνόμων ἐλογίσθη
  choice: ఆయన చట్టవిరోధులలో ఒకడిగా లెక్కించబడ్డాడు
  rationale: ἀνόμωνకు ‘చట్టవిరోధులు’ మూలార్థానికి దగ్గరగా ఉంది; μετὰ యొక్క సహవర్గ భావాన్ని సహజ తెలుగులో ‘వారిలో ఒకడిగా’ తెలియజేస్తుంది; ἐλογίσθη యొక్క కర్మణి భావం నిలిచింది.
- source_word: τὸ περὶ ἐμοῦ
  choice: నా గురించి రాసి ఉన్నది
  rationale: ‘నా గురించినది’ కంటే సహజంగా ఉండేందుకు సందర్భంలో గ్రీకు ఆర్టిక్యులర్ పదబంధం సూచించే రాతవిషయాన్ని స్వల్పంగా స్పష్టం చేస్తుంది.
- source_word: τέλος ἔχει
  choice: ముగింపుకు వస్తోంది
  rationale: ఈ నుడికారంలోని ముగింపు/పూర్తి అనే ద్వంద్వ ఛాయను పూర్తిగా ‘నెరవేరుతోంది’గా పరిమితం చేయకుండా, నిర్ణీత పరిణామం సమీపిస్తున్న భావంతో అందిస్తుంది.
theological_decisions:
- issue: యెషయా 53:12 ఉల్లేఖనంలో ἀνόμων అనువాదం
  choice: చట్టవిరోధులలో ఒకడిగా లెక్కించబడ్డాడు
  alternative: అతిక్రమకులతో కూడ లెక్కించబడ్డాడు
  rationale: ముఖ్య పాఠంలో గ్రీకు ἀνόμωνకు సన్నిహితమైన అర్థాన్ని ఉంచి, తెలుగు బైబిలు సంప్రదాయంలో పరిచితమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: τέλος ἔχει యొక్క భావం
  choice: ముగింపుకు వస్తోంది
  alternative: నెరవేర్పు పొందుతోంది / పూర్తవుతోంది
  rationale: ఈ పదబంధం అంతం, పూర్తి, నెరవేర్పు అనే ఛాయలను కలిగి ఉండవచ్చు. శ్రమల సందర్భంలో పూర్తి భావం బలంగా ఉన్నప్పటికీ, ప్రధాన పాఠం ఆ అర్థాన్ని అతిగా నిర్దేశించకుండా ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ఉల్లేఖన సంప్రదాయాన్ని పాదసూచికలో కాపాడుతూ మూల గ్రీకు పదాలకు ప్రాధాన్యం ఇచ్చాం.
