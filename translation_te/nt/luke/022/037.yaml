revisions:
- from: 'ఎందుకంటే నేను మీతో చెప్తున్నాను: ‘ఆయన చట్టవిరోధులలో ఒకడిగా లెక్కించబడ్డాడు’ అని రాసి ఉన్న ఈ మాట నాలో నెరవేరాలి.[a] నిజానికి, నా గురించి రాసి ఉన్నది ముగింపుకు వస్తోంది.[b]'
  to: 'ఎందుకంటే, రాసి ఉన్న ఈ వాక్యం నాలో నెరవేరాలని నేను మీతో చెబుతున్నాను: ‘ఆయన చట్టవిరోధులతో కలిసి లెక్కించబడ్డాడు.’[a] ఎందుకంటే, నా గురించినది ముగింపుకు చేరుతోంది.[b]'
  rationale: The revision removes an unsupported repetition of “written” from the final clause, improves the rendering of the quoted association, and relocates the quotation-related footnote anchor. “ముగింపుకు చేరుతోంది” preserves the completion/end nuance of τέλος ἔχει without forcing a single theological interpretation.
