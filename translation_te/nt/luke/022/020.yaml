id: LUK.22.20
reference: Luke 22:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸄καὶ τὸ ποτήριον ὡσαύτως⸅ μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐν τῷ αἵματί μου, τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/020.yaml
  text: And likewise the cup after supper[a], saying, “This cup is the new covenant in my blood[b], which is poured out for you.”
translation:
  language: te
  text: 'అలాగే, భోజనం తర్వాత ఆయన పాత్రను గురించి ఇలా అన్నారు: “ఈ పాత్ర నా రక్తంలో ఉన్న నూతన నిబంధన[a]; అది మీ కొరకు చిందించబడుతోంది[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నూతన నిబంధన’ అని అనువదించిన గ్రీకు పదబంధాన్ని సంప్రదాయ అనువాదంలో ‘కొత్త వీలునామా’ అని కూడా అనువదిస్తారు.
    reason: alternative_reading
  - marker: b
    text: గ్రీకులో ‘మీ కొరకు చిందించబడుతున్నది’ అనే మాటలు మొత్తం వాక్యభాగం చివర వస్తాయి. వ్యాకరణపరంగా అది ‘పాత్ర’తో సరిపోలవచ్చు; అయితే సందర్భంలో అత్యంత సహజమైన భావం యేసు రక్తమే వారి కొరకు చిందించబడుతోందనేది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποτήριον
  choice: పాత్ర
  rationale: త్రాగడానికి ఉపయోగించే పాత్రను సూచించే సహజమైన, గౌరవప్రదమైన పదం; ప్రత్యేక ఆరాధనా సంప్రదాయాన్ని సూచించే పదాన్ని చేర్చదు.
- source_word: ὡσαύτως
  choice: అలాగే
  rationale: మునుపటి వచనంలో రొట్టెతో చేసిన కార్యానికి ఉన్న అనుసంధానాన్ని సహజంగా నిలుపుతుంది.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: భోజనం చేసిన తర్వాత
  rationale: కాలక్రమాన్ని స్పష్టంగా తెలియజేస్తూ గ్రీకు క్రియారూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: λέγων
  choice: ఇలా అన్నాడు
  rationale: గ్రీకులోని అసమాపక క్రియ అనుసంధానాన్ని తెలుగులో సహజమైన ప్రత్యక్ష వాక్య పరిచయంగా అందిస్తుంది.
- source_word: καινὴ διαθήκη
  choice: నూతన నిబంధన
  rationale: పాత నిబంధన నేపథ్యంలోని ఒడంబడిక భావాన్ని నిలుపుతూ తెలుగులో స్థిరపడిన బైబిలు పదబంధాన్ని ఉపయోగిస్తుంది.
- source_word: ἐν τῷ αἵματί μου
  choice: నా రక్తంలో ఏర్పడే
  rationale: ἐν యొక్క సంబంధాన్ని పూర్తిగా సాధనార్థకంగా మాత్రమే నిర్ణయించకుండా, తెలుగులో వాక్యార్థం గ్రాహ్యంగా ఉండేలా నిబంధనకు రక్తంతో ఉన్న ఆధార సంబంధాన్ని తెలియజేస్తుంది.
- source_word: τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον
  choice: ఆ రక్తం మీ కోసం చిందించబడుతోంది
  rationale: సందర్భంలో సహజంగా ఉద్దేశించబడిన యేసు రక్తాన్ని స్పష్టం చేస్తుంది; ὑπὲρ ను ‘మీ కోసం’ అని అనువదించి ప్రతినిధిత్వం లేదా బలి సిద్ధాంతాన్ని అవసరానికి మించి నిర్వచించదు.
theological_decisions:
- issue: διαθήκη అనే పదాన్ని ప్రభుభోజన సందర్భంలో అనువదించడం
  choice: నూతన నిబంధన
  alternative: కొత్త వీలునామా / నూతన నిబంధన పత్రం
  rationale: రక్తంతో స్థాపించబడే నిబంధన అనే పాత నిబంధన నేపథ్యమే ఈ సందర్భంలో ప్రధానమైనది; అందువల్ల ‘నిబంధన’ సరైనది. చారిత్రకంగా సాధ్యమైన ‘వీలునామా’ భావాన్ని పాదసూచికలో ఉంచాం.
- issue: ἐκχυννόμενον అనే అసమాపక క్రియకు పూర్వపదం
  choice: అర్థపరంగా ‘నా రక్తం’తో అనుసంధానించి ‘ఆ రక్తం మీ కోసం చిందించబడుతోంది’ అని అనువదించడం
  alternative: వ్యాకరణ రూపాన్ని అనుసరించి ‘పాత్ర’తో మరింత నేరుగా అనుసంధానించడం
  rationale: నపుంసకలింగ రూపం ‘పాత్ర’తో వ్యాకరణపరంగా సరిపోలగలిగినా, బలి మరియు నిబంధన సందర్భంలో చిందించబడేది యేసు రక్తమే అన్నది అత్యంత సహజమైన భావం. గ్రీకు వాక్యనిర్మాణంలోని ఉద్రిక్తతను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్యంలోని నిబంధన మరియు బలి భావాలకు తగిన గౌరవప్రద శైలి. గ్రీకులో క్రియ స్పష్టంగా లేని ప్రారంభ వాక్యభాగాన్ని తెలుగులో సహజంగా చేయడానికి ‘పాత్రను తీసుకొని’ అని సందర్భానుసారంగా పూరించాం.
