source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν Πέτρον καὶ Ἰωάννην εἰπών· Πορευθέντες ἑτοιμάσατε ἡμῖν τὸ πάσχα ἵνα φάγωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/008.yaml
  text: And he sent Peter and John[a], saying, “Go and prepare the Passover for us, so that we may eat it.”
translation:
  language: te
  text: 'ఆయన పేతురును యోహానును పంపి, ఇలా చెప్పాడు: “మీరు వెళ్లి, మనం తినడానికి మన కోసం పస్కాను[a] సిద్ధం చేయండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పస్కా భోజనాన్ని.” గ్రీకు పదం పస్కాను విస్తృతంగా సూచించగలదు; అయితే సిద్ధం చేయడం, తినడం అనే ఈ సందర్భం పస్కా భోజనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: పంపుతూ ... చెప్పాడు
  rationale: ప్రధాన క్రియ ‘పంపాడు’ అనే భావాన్ని, εἰπώνతో ఉన్న అనుబంధాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో ‘పంపుతూ ... చెప్పాడు’గా వ్యక్తం చేస్తుంది.
- source_word: Πορευθέντες
  choice: మీరు వెళ్లి
  rationale: ఆజ్ఞ సందర్భంలో ఈ భూతకాల కృదంతం ముందుగా చేయవలసిన చర్యను సూచిస్తుంది; ‘వెళ్లి’ సహజంగా ఆ బలాన్ని తెలియజేస్తుంది.
- source_word: ἑτοιμάσατε
  choice: సిద్ధం చేయండి
  rationale: ఆచరణాత్మక ఏర్పాట్లు చేయాలనే ఆజ్ఞను స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἡμῖν
  choice: మన కోసం
  rationale: లబ్ధిదారుని సూచించే దత్తివును సహజంగా వ్యక్తం చేస్తుంది; మూలంలో లేని ‘అందరి’ వంటి అదనపు భావాన్ని చేర్చదు.
- source_word: τὸ πάσχα
  choice: పస్కాను
  rationale: గ్రీకు పదం పండుగను విస్తృతంగా, భోజనాన్ని లేదా సంబంధిత బలిని సూచించగలదు. సందర్భం భోజనాన్ని బలంగా సూచించినా, ‘పస్కా’ మూలపదంలోని విస్తృతిని కాపాడుతుంది.
- source_word: ἵνα φάγωμεν
  choice: మనం భోజనం చేయడానికి
  rationale: ἵναతో కూడిన సంభావనార్థక క్రియ ఉద్దేశాన్ని సూచిస్తుంది. తెలుగులో ‘భోజనం చేయడానికి’ సహజంగా ఉద్దేశాన్ని తెలియజేస్తుంది; పస్కాను తినడమే ఉద్దేశమని సందర్భం స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ‘పస్కా’ అనే పదం దేనిని సూచిస్తుంది
  choice: మూలంలోని విస్తృతిని నిలుపుతూ ‘పస్కా’ అని అనువదించడం
  alternative: ‘పస్కా భోజనం’ లేదా ‘పస్కా గొర్రెపిల్ల’
  rationale: సిద్ధం చేసి భోజనం చేయడం అనే సందర్భం పస్కా భోజనాన్ని బలంగా సూచిస్తుంది. అయినా πάσχα పదం స్వయంగా మరింత విస్తృత అర్థపరిధి కలిగి ఉండగలదు కాబట్టి ప్రధాన పాఠ్యంలో దానిని కుదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘పేతురు,’ ‘యోహాను,’ ‘పస్కా’ అనే సుపరిచిత బైబిలు నామరూపాలు ఉపయోగించబడ్డాయి. గ్రీకు వాక్యంలోని ఆజ్ఞాత్మక క్రమాన్ని ‘మీరు వెళ్లి ... సిద్ధం చేయండి’గా నిలుపుకున్నాం.
