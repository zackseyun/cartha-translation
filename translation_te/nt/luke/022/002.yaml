  terminology: Key terms are consistent and suitable. “చంపాలో” is a direct, non-euphemistic rendering of ἀνέλωσιν; “హతమార్చాలో” in the note is a legitimate more formal lexical alternative. No doctrinal or interpretive expansion has been introduced.
