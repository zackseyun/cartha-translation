id: LUK.22.2
reference: Luke 22:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὸ πῶς ἀνέλωσιν αὐτόν, ἐφοβοῦντο γὰρ τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/002.yaml
  text: And the chief priests and the scribes were seeking how they might kill him[a], for they were afraid of the people.
translation:
  language: te
  text: ప్రధాన యాజకులూ శాస్త్రులూ ఆయనను ఎలా చంపాలో వెదుకుతూ ఉన్నారు[a]. ఎందుకంటే వారు ప్రజలకు భయపడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనను ఎలా హతమార్చాలో.”
    reason: ἀνέλωσινకు సాధ్యమైన మరింత అధికారిక తెలుగు పదప్రయోగాన్ని తెలియజేస్తుంది.
lexical_decisions:
- source_word: ἐζήτουν
  choice: వెదుకుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం గతంలో కొనసాగుతున్న ప్రయత్నాన్ని సూచిస్తుంది; ఈ తెలుగు ప్రయోగం ఆ కొనసాగింపు భావాన్ని నిలుపుతుంది.
- source_word: ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: యెరూషలేములోని యాజక నాయకత్వాన్ని సూచించే సహజమైన, స్థిరపడిన తెలుగు పదబంధం.
- source_word: γραμματεῖς
  choice: శాస్త్రులు
  rationale: సువార్తల సందర్భంలో ధర్మశాస్త్ర సంబంధిత లేఖకులు, పండితులను సూచించే నేరుగా స్థిరపడిన తెలుగు పదం; వివరణాత్మక విస్తరణను నివారిస్తుంది.
- source_word: τὸ πῶς
  choice: ఎలా
  rationale: గ్రీకు నుడికారంలోని ‘ఎలా’ లేదా ‘ఏ విధంగా’ అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνέλωσιν
  choice: చంపాలో
  rationale: ఈ సందర్భంలో ἀναιρέω ప్రాణం తీయడాన్ని స్పష్టంగా సూచిస్తుంది. ‘చంపాలో’ ఉద్దేశంలోని తీవ్రతను మృదువుపరచకుండా సహజంగా తెలియజేస్తుంది.
- source_word: ἐφοβοῦντο
  choice: భయపడ్డారు
  rationale: ప్రజల ప్రతిస్పందన పట్ల నాయకులకు ఉన్న భయాన్ని సహజమైన తెలుగు కథన శైలిలో తెలియజేస్తుంది.
- source_word: τὸν λαόν
  choice: ప్రజలు
  rationale: λαός సూచించే సమష్టి ప్రజానీకాన్ని నిలుపుతుంది; దానిని అక్కడ కూడిన ఒక నిర్దిష్ట గుంపుకు మాత్రమే పరిమితం చేయదు.
theological_decisions:
- issue: నాయకుల ఉద్దేశంలో ἀνέλωσιν పదానికి ఉన్న తీవ్రత
  choice: ఆయనను చంపడం
  alternative: ఆయనను హతమార్చడం
  rationale: వారి ప్రాణాంతక ఉద్దేశాన్ని స్పష్టంగా ఉంచుతూ, ఈ దశలో అధికారిక న్యాయప్రక్రియ లేదా మరణశిక్షను ప్రత్యేకంగా సూచించదు.
- issue: λαός ఎవరిని సూచిస్తుంది
  choice: ప్రజలు
  alternative: జనసమూహం
  rationale: ప్రజల ప్రతిస్పందనకు నాయకులు భయపడుతున్నారనే కథన ఉద్రిక్తతను నిలుపుతూ, సూచనను అక్కడి గుంపుకు మాత్రమే కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ‘ప్రధాన యాజకులు’, ‘శాస్త్రులు’ వంటి స్థిరపడిన బైబిలు పదజాలం ఉంచబడింది; వాక్య నిర్మాణం మాత్రం సహజమైన ఆధునిక తెలుగులో ఉంది.
