source:
  edition: SBLGNT
  text: καὶ ἐπάταξεν εἷς τις ἐξ αὐτῶν ⸂τοῦ ἀρχιερέως τὸν δοῦλον⸃ καὶ ἀφεῖλεν ⸂τὸ οὖς αὐτοῦ⸃ τὸ δεξιόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/050.yaml
  text: And one of them struck the high priest’s servant and cut off his right ear[a].
translation:
  language: te
  text: వారిలో ఒకడు ప్రధాన యాజకుని బానిసను[a] కొట్టి, అతని కుడి చెవిని నరికివేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రధాన యాజకుని సేవకుణ్ణి.” గ్రీకు పదమైన δοῦλος (దూలొస్) సందర్భాన్ని బట్టి ‘బానిస’ లేదా ‘సేవకుడు’ అని అర్థమివ్వగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπάταξεν
  choice: కొట్టి
  rationale: πατάσσω ఇక్కడ బలంగా కొట్టడాన్ని సూచిస్తుంది. ‘కొట్టి’ అనేది సహజమైన ఆధునిక తెలుగు పదం; దాడి యొక్క స్పష్టమైన చర్యను నిలుపుతుంది.
- source_word: εἷς τις ἐξ αὐτῶν
  choice: వారిలో ఒకడు
  rationale: εἷς τις అనిశ్చితంగా ఒక వ్యక్తిని సూచిస్తుంది. ‘వారిలో ఒకడు’ లూకా ఉంచిన అజ్ఞాతత్వాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: τοῦ ἀρχιερέως τὸν δοῦλον
  choice: ప్రధాన యాజకుని బానిసను
  rationale: δοῦλος ఇక్కడ ప్రధాన యాజకుని అధీనంలోని వ్యక్తి యొక్క సామాజిక స్థితిని సూచిస్తుంది. ‘బానిస’ ఆ బంధిత స్థితిని మృదువుచేయకుండా తెలియజేస్తుంది; ‘సేవకుడు’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ἀφεῖλεν
  choice: నరికివేశాడు
  rationale: ἀφαιρέω ప్రాథమికంగా ‘తీసివేయడం’ అని అర్థమైనా, చెవికి కలిగిన ఈ గాయం సందర్భంలో ‘నరికివేశాడు’ ఫలితాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ οὖς αὐτοῦ τὸ δεξιόν
  choice: అతని కుడి చెవిని
  rationale: ఈ రూపం గాయపడిన శరీర భాగాన్నీ, అది కుడివైపుదేనన్న వివరాన్నీ స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: δοῦλος పదం అనువాదం
  choice: బానిస
  alternative: సేవకుడు
  rationale: ఈ వచనంలో δοῦλος ఒక రూపకాలంకారంగా కాక వాస్తవ సామాజిక సంబంధాన్ని సూచిస్తుంది. ‘బానిస’ బంధిత అధీన స్థితిని స్పష్టంగా ఉంచుతుంది; సందర్భాన్ని కొంత మృదువుగా చూపగల ‘సేవకుడు’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని సంక్షిప్త కథన గమనాన్ని నిలిపి, δοῦλος పదంలోని అర్థపరిధిని పాదటిప్పణి ద్వారా పారదర్శకంగా ఉంచాం.
