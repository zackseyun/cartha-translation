source:
  edition: SBLGNT
  text: καὶ διαστάσης ὡσεὶ ὥρας μιᾶς ἄλλος τις διϊσχυρίζετο λέγων· Ἐπ’ ἀληθείας καὶ οὗτος μετ’ αὐτοῦ ἦν, καὶ γὰρ Γαλιλαῖός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/059.yaml
  text: And after about one hour had passed[a], another man insisted, saying, “Truly, this man also was with him, for he too is a Galilean.”
translation:
  language: te
  text: 'దాదాపు ఒక గంట గడిచిన తర్వాత, మరొకడు[a] గట్టిగా నొక్కిచెబుతూ ఇలా అన్నాడు: “నిజంగానే, ఇతడు కూడా ఆయనతో ఉన్నాడు; ఎందుకంటే ఇతడూ గలిలయుడే.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మరొక వ్యక్తి.” ἄλλος τις అనేది అనిర్దిష్టమైన పదబంధం; ఇక్కడ అది పురుషలింగ రూపంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαστάσης ὡσεὶ ὥρας μιᾶς
  choice: దాదాపు ఒక గంట గడిచిన తరువాత
  rationale: కాలం గడవడాన్ని సూచించే genitive absolute భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ὡσεὶ లోని సుమారు అనే భావాన్నీ నిలుపుతుంది.
- source_word: ἄλλος τις
  choice: మరొకడు
  rationale: గ్రీకు పదబంధం నిర్దిష్టతలేని ‘మరొకరు/వేరొకరు’ అనే భావం ఇస్తుంది. సందర్భంలోని పురుష వక్తను తెలుగులో సహజంగా సూచించడానికి ‘మరొకడు’ ఎంచుకోబడింది; మూలంలోని అనిర్దిష్టతను పాదసూచిక తెలియజేస్తుంది.
- source_word: διϊσχυρίζετο
  choice: గట్టిగా వాదిస్తూ
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న లేదా బలమైన నొక్కిచెప్పడాన్ని ఈ ప్రయోగం పట్టుకుంటుంది.
- source_word: Ἐπ’ ἀληθείας
  choice: నిజంగా
  rationale: వాక్యంలోని సత్యనిశ్చయాన్ని బలంగా ప్రకటించే ఈ నుడికారానికి సంక్షిప్తమైన, సహజమైన తెలుగు సమానం.
- source_word: οὗτος
  choice: ఇతడు
  rationale: పేతురును చూపిస్తూ, కొంత ఆరోపణాత్మకంగా సూచించే demonstrative బలాన్ని సాధారణ సర్వనామం కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: μετ’ αὐτοῦ ἦν
  choice: ఆయనతో ఉన్నాడు
  rationale: సహవాసం లేదా అనుబంధం గురించిన వాదనను అదనపు వ్యాఖ్యానం లేకుండా నేరుగా వ్యక్తం చేస్తుంది.
- source_word: καὶ γὰρ
  choice: ఎందుకంటే ఇతడు కూడా
  rationale: γάρ తెలిపే కారణాన్ని ‘ఎందుకంటే’తో, καί తెలిపే ‘కూడా’ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: Γαλιλαῖός ἐστιν
  choice: గలిలయుడే
  rationale: పేతురు గలిలయ ప్రాంతానికి చెందినవాడని నేరుగా గుర్తిస్తుంది; ‘-ఏ’ వక్త నొక్కిచెప్పే స్వరాన్ని సహజంగా ప్రతిబింబిస్తుంది.
