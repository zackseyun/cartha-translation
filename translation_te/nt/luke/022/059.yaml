translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. యేసును సూచించే αὐτοῦ కు సందర్భానుగుణంగా ‘ఆయన’ వాడబడింది; మూలంలోని ఆరోపణాత్మక ప్రత్యక్ష సూచనను ‘ఇతడు’ నిలుపుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
