  verdict: revise
  source_fidelity: The draft preserves the action sequence, the title ‘ప్రభువు,’ Peter’s recollection, the timing ‘ఈ రోజు,’ and the threefold denial. However, ‘నేరుగా చూశాడు’ places the possible intensifying/direct nuance of ἐνέβλεψεν in the main text, whereas the Greek need not require it. The more explicit future-denial wording also better represents ἀπαρνήσῃ με.
  naturalness: The narrative is clear and modern. Recasting ‘ఎరుగనంటావు’ as ‘ఎరుగనని చెబుతావు’ is slightly more neutral and standard in a formal Bible register.
  terminology: ‘ప్రభువు,’ ‘పేతురు,’ ‘మాట,’ and ‘జ్ఞాపకం చేసుకున్నాడు’ are appropriate. ‘ఎరుగనని చెబుతావు’ accurately conveys denial in this narrative context without importing a theological interpretation.
  issues:
