id: LUK.22.61
reference: Luke 22:61
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ στραφεὶς ὁ κύριος ἐνέβλεψεν τῷ Πέτρῳ, καὶ ὑπεμνήσθη ὁ Πέτρος τοῦ ⸀λόγου τοῦ κυρίου ὡς εἶπεν αὐτῷ ὅτι Πρὶν ἀλέκτορα φωνῆσαι ⸀σήμερον ἀπαρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/061.yaml
  text: And the Lord turned and looked at Peter[a], and Peter remembered the word of the Lord, how he had said to him, “Before a rooster crows today, you will deny me three times.”
translation:
  language: te
  text: ప్రభువు తిరిగి పేతురువైపు చూశాడు[a]. పేతురు, “ఈ రోజు కోడి కూయకముందే నీవు నన్ను ఎరుగనని మూడుసార్లు చెబుతావు” అని ప్రభువు తనతో చెప్పిన మాటను జ్ఞాపకం చేసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పేతురువైపు దృష్టి నిలిపి చూశాడు”; గ్రీకు క్రియ నేరుగా లేదా తదేకంగా చూడడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: తిరిగి
  rationale: ఆరిస్ట్ కృదంతం ప్రభువు ముందుగా తిరిగి, ఆపై పేతురువైపు చూశాడనే క్రియాక్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: యేసుకు వాడిన బిరుదు యొక్క కథనపరమైన వాడుకను, క్రీస్తుసంబంధమైన బలాన్ని కాపాడుతుంది.
- source_word: ἐνέβλεψεν τῷ Πέτρῳ
  choice: పేతురువైపు నేరుగా చూశాడు
  rationale: ἐμβλέπω సాధారణంగా చూడడానికంటే ప్రత్యక్షమైన, దృష్టి నిలిపిన చూపును సూచించగలదు; ‘నేరుగా చూశాడు’ ఆ భావాన్ని అతిశయింపకుండా ప్రధాన పాఠ్యంలో అందిస్తుంది.
- source_word: ὑπεμνήσθη
  choice: జ్ఞాపకం చేసుకున్నాడు
  rationale: రూపం ‘జ్ఞాపకం చేయబడ్డాడు’ అనే భావానికి వీలిచ్చినా, సందర్భంలో పేతురు ప్రభువు మాటను గుర్తుచేసుకోవడమే ప్రధానాంశం; ఈ రూపం సహజ తెలుగు.
- source_word: λόγου
  choice: మాటను
  rationale: ఇక్కడ λόγος యేసు పలికిన నిర్దిష్ట వాక్యాన్ని సూచిస్తుంది; తెలుగులో ‘ప్రభువు చెప్పిన మాట’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ὡς εἶπεν αὐτῷ
  choice: అని ప్రభువు తనతో చెప్పిన
  rationale: ὡς ఇక్కడ పేతురు జ్ఞాపకం చేసుకున్న మాట యొక్క విషయాన్ని పరిచయం చేస్తుంది; తెలుగు ప్రత్యక్ష ఉద్ధరణతో ‘అని ... చెప్పిన’ సహజంగా ఉంటుంది.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: కోడి కూయకముందే
  rationale: πρίν + infinitive పూర్వకాల సంబంధాన్ని సూచిస్తుంది. అనిర్దిష్టమైన ἀλέκτοραను తెలుగులో ఆర్టికల్ లేకుండా ‘కోడి’గా సహజంగా వ్యక్తపరచవచ్చు.
- source_word: σήμερον
  choice: ఈ రోజు
  rationale: σήμερον యొక్క సమయసూచనను స్పష్టమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: ἀπαρνήσῃ με
  choice: నన్ను ... ఎరుగనంటావు
  rationale: ఈ శ్రమవృత్తాంత సందర్భంలో క్రియ వ్యక్తిని తెలిసిన సంబంధాన్ని నిరాకరించడాన్ని సూచిస్తుంది; ‘ఎరుగనంటావు’ పేతురు చేసిన నిరాకరణ స్వరూపాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τρίς
  choice: మూడుసార్లు
  rationale: ఆధునిక తెలుగులో సంఖ్యను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యేసుకు κύριος అనే బిరుదు
  choice: ప్రభువు
  alternative: బోధకుడు / యజమాని
  rationale: ‘ప్రభువు’ అనే పదం కథనంలోని బిరుదును, దాని క్రీస్తుసంబంధమైన భావబలాన్ని నిలుపుతుంది; మరింత పరిమితమైన అర్థాన్ని బలవంతంగా రుద్దదు.
- issue: ἀπαρνέομαι యొక్క భావం
  choice: ఎరుగనని చెప్పడం
  alternative: నిరాకరించడం / తృణీకరించడం
  rationale: సందర్భంలో పేతురు యేసును తెలిసినవాడిననే సంబంధాన్ని మాటలతో తిరస్కరించాడు. అందువల్ల ‘ఎరుగనంటావు’ సంఘటనకు స్పష్టంగా సరిపోతుంది; సిద్ధాంతపరమైన అదనపు అర్థాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. కథన వాక్యానికి ‘ప్రభువు’ను, పేతురుతో పలికిన ప్రత్యక్ష మాటకు సహజమైన ఏకవచన సంబోధనను వాడాం. గ్రీకు వాక్యంలోని క్రియాక్రమం, ‘ఈ రోజు’ అనే తక్షణత్వం, మూడుసార్ల నిరాకరణ అన్నీ నిలుపబడ్డాయి.
