    issue: ‘నేరుగా’ is stronger than the unmarked main sense of ἐνέβλεψεν.
    rationale: The verb can imply a fixed or intent gaze, but ‘చూశాడు’ preserves the base meaning in the text; the stronger nuance belongs in the existing lexical-alternative footnote.
  - severity: low
    issue: ‘ఎరుగనంటావు’ is somewhat contracted/colloquial for the selected register.
    rationale: ‘ఎరుగనని చెబుతావు’ is clearer modern-standard Telugu and directly expresses the predicted verbal denial.
