  source_fidelity: గ్రీకు పాఠంలోని కథన-పురోగతి (δέ), ‘ఆయనకు ప్రత్యక్షమయ్యాడు’ అనే ὤφθη నిర్మాణం, పరలోక మూలం, అలాగే దేవదూత యేసును బలపరిచిన చర్య—అన్నీ అనువాదంలో నమ్మకంగా ఉన్నాయి. ‘కనిపించి, ... బలపరిచాడు’ అనే తెలుగు నిర్మాణం గ్రీకు వర్తమాన కృదంతం సూచించే సహచర చర్యను సహజంగా తెలియజేస్తుంది.
