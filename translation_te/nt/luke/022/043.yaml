  text: ⸂ὤφθη δὲ αὐτῷ ἄγγελος ⸀ἀπ’ οὐρανοῦ ἐνισχύων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/043.yaml
  text: Then an angel from heaven appeared to him[a], strengthening him.
translation:
  language: te
  text: అప్పుడు పరలోకం నుండి ఒక దేవదూత ఆయనకు కనిపించి,[a] ఆయనను బలపరిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో 43–44 వచనాలు లేవు.
    reason: textual_variant
lexical_decisions:
- source_word: ὤφθη
  choice: కనిపించి
  rationale: ὁράω కర్మణి రూపం ఇక్కడ ప్రత్యక్షతను తెలిపే సాధారణ ప్రయోగం; యాంత్రికంగా ‘చూడబడ్డాడు’ అనడం కంటే ‘కనిపించాడు’ సహజంగా అర్థాన్ని అందిస్తుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: δέ ఇక్కడ విరోధాన్ని కాక కథనంలోని తదుపరి క్రమాన్ని సూచిస్తుంది; ‘అప్పుడు’ ఆ పురోగతిని సహజంగా తెలియజేస్తుంది.
- source_word: αὐτῷ
  choice: ఆయనకు
  rationale: ὤφθηతో వచ్చిన దత్తి విభక్తి, ప్రత్యక్షత ఎవరికైందో సూచిస్తుంది; గౌరవప్రదమైన సర్వనామాన్ని ఉపయోగించాం.
- source_word: ἄγγελος
  choice: ఒక దేవదూత
  rationale: పరలోక సందర్భంలో ‘సందేశకుడు’ అనే సాధారణ భావం కంటే దైవిక దూత అనే అర్థమే స్పష్టం; నిర్దిష్ట ఉపపదం లేకపోవడాన్ని ‘ఒక’ తెలియజేస్తుంది.
- source_word: ἀπ’ οὐρανοῦ
  choice: పరలోకం నుండి
  rationale: ఈ పదబంధం దూత వచ్చిన మూలాన్ని సూచిస్తుంది; ‘పరలోకం నుండి’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన రూపం.
- source_word: ἐνισχύων
  choice: బలపరిచాడు
  rationale: వర్తమాన కృదంతం ప్రత్యక్షమవడంతో పాటు జరిగిన చర్యను తెలియజేస్తుంది. తెలుగులో సమాపక క్రియగా మార్చడం సహజ వాక్యనిర్మాణాన్ని ఇస్తూ ‘శక్తినివ్వడం’ అనే భావాన్ని కాపాడుతుంది.
- source_word: αὐτόν
  choice: ఆయనను
  rationale: ఇది యేసును సూచించే ప్రత్యక్ష కర్మ; గౌరవప్రదమైన సర్వనామంతో అనువదించాం.
theological_decisions:
- issue: లూకా 22:43 వచనపు పాఠ్యస్థితి
  choice: అందించిన SBLGNT పాఠం ప్రకారం వచనాన్ని ప్రధాన పాఠ్యంలో చేర్చడం.
  alternative: కొన్ని ప్రతుల్లో 43–44 వచనాలు లేవు.
  rationale: అందించిన గ్రీకు మూలపాఠ్యంలో ఈ వచనం ఉంది కాబట్టి దానిని అనువదించాం. అయితే ప్రతుల పరంపరలోని ముఖ్యమైన పాఠాంతరాన్ని పరిష్కరించినట్లు చూపకుండా పాదసూచికలో స్పష్టంగా నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. యేసును సూచించే సర్వనామాలకు గౌరవ రూపాలు వాడబడ్డాయి.
