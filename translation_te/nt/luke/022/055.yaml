id: LUK.22.55
reference: Luke 22:55
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀περιαψάντων δὲ πῦρ ἐν μέσῳ τῆς αὐλῆς καὶ ⸀συγκαθισάντων ἐκάθητο ὁ Πέτρος ⸀μέσος αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/055.yaml
  text: And after they had kindled a fire in the middle of the courtyard and sat down together[a], Peter was sitting among them.
translation:
  language: te
  text: వారు ఆ ప్రాంగణం మధ్యలో మంట వెలిగించి, కలిసి కూర్చున్న తరువాత, పేతురు వారి మధ్య కూర్చొని ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పేతురు వారి మధ్య కూర్చున్నాడు.’ గ్రీకు అసంపూర్ణ భూతకాల క్రియను సరళంగా ‘కూర్చున్నాడు’ అని కూడా అనువదించవచ్చు; ‘కూర్చొని ఉన్నాడు’ అనేది కొనసాగుతున్న దృశ్యాన్ని మరింత స్పష్టంగా తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιαψάντων
  choice: మంట వేసి
  rationale: ఈ భూతకాల అసమాపక క్రియ ప్రధాన క్రియకు ముందున్న చర్యను సూచిస్తుంది. సందర్భంలో సహజమైన ఆధునిక తెలుగు ప్రయోగం ‘మంట వేసి’.
- source_word: πῦρ
  choice: మంట
  rationale: ఇక్కడ చలి కాచుకోవడానికి వెలిగించిన నిర్దిష్టమైన మంట ఉద్దేశించబడింది; తెలుగులో ‘మంట’ సహజంగా ఉంటుంది.
- source_word: ἐν μέσῳ τῆς αὐλῆς
  choice: ఆ ప్రాంగణం మధ్యలో
  rationale: స్థలాన్ని స్పష్టంగా సూచించే ఈ పదబంధం మూలంలోని concrete spatial senseను నిలుపుతుంది. αὐλή ఇక్కడ ప్రధాన యాజకుని నివాస ప్రాంగణాన్ని సూచిస్తుంది.
- source_word: συγκαθισάντων
  choice: కలిసి కూర్చున్నప్పుడు
  rationale: σύν ఉపసర్గ వారంతా కలిసి కూర్చున్న భావాన్ని ఇస్తుంది; సమాంతర aorist participleను తెలుగులో కాలసంబంధ ఉపవాక్యంగా సహజంగా వ్యక్తం చేశాం.
- source_word: ἐκάθητο
  choice: కూర్చొని ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న దృశ్యాన్ని సూచిస్తుంది; ‘కూర్చొని ఉన్నాడు’ ఆ aspectను తెలుగులో నిలుపుతుంది.
- source_word: μέσος αὐτῶν
  choice: వారి మధ్య
  rationale: పేతురు ఆ గుంపులోనే ఉన్న స్థానాన్ని సహజంగా, మూలానికి దగ్గరగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ స్వల్ప కథన అనుసంధానకం. ఈ వాక్య నిర్మాణంలో తెలుగులో ప్రత్యేకంగా ‘అప్పుడు/మరి’ చేర్చకపోయినా కథన పురోగతి సహజంగా వ్యక్తమవుతుంది.
