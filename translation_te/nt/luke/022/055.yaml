- from: వారు ఆ ప్రాంగణం మధ్యలో మంట వేసి, కలిసి కూర్చున్నప్పుడు, పేతురు వారి మధ్య కూర్చొని ఉన్నాడు.[a]
  to: వారు ఆ ప్రాంగణం మధ్యలో మంట వెలిగించి, కలిసి కూర్చున్న తరువాత, పేతురు వారి మధ్య కూర్చొని ఉన్నాడు.[a]
