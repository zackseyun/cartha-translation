id: LUK.22.25
reference: Luke 22:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οἱ βασιλεῖς τῶν ἐθνῶν κυριεύουσιν αὐτῶν καὶ οἱ ἐξουσιάζοντες αὐτῶν εὐεργέται καλοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/025.yaml
  text: But he said to them[a], “The kings of the Gentiles lord it over them[b], and those exercising authority over them are called benefactors.”
translation:
  language: te
  text: 'అయితే ఆయన వారితో ఇలా అన్నాడు: “యూదేతర ప్రజల[a] రాజులు వారిపై పెత్తనం చెలాయిస్తారు; వారిపై అధికారాన్ని చెలాయించేవారు ‘ఉపకారులు’[b] అని పిలవబడతారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేశాల” లేదా “జనాల.”
    reason: lexical_alternative
  - marker: b
    text: “ఉపకారులు” అనేది ప్రజలకు మేలు చేసేవారిగా పేరుపొందిన పాలకులకు లేదా శక్తిమంతమైన పోషకులకు వాడే గౌరవ బిరుదు.
    reason: cultural_note
lexical_decisions:
- source_word: βασιλεῖς
  choice: రాజులు
  rationale: ఈ నామవాచకం సాధారణ పాలకులను కాక ప్రత్యేకంగా రాజులను సూచిస్తుంది; అందువల్ల నిర్దిష్ట రాజకీయ పదాన్ని నిలిపాం.
- source_word: τῶν ἐθνῶν
  choice: యూదేతరుల
  rationale: లూకా–అపొస్తలుల కార్యములలో ఈ పదం సాధారణంగా యూదులు కాని ప్రజలను సూచిస్తుంది; సందర్భంలో అదే ప్రధాన భావం. ‘దేశాల’ అనే అర్థసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: κυριεύουσιν
  choice: ప్రభువుల్లా అధికారం చెలాయిస్తారు
  rationale: కేవలం పరిపాలించడమే కాక, ఆధిపత్య ధోరణితో అధికారాన్ని వినియోగించే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐξουσιάζοντες
  choice: అధికారం ప్రయోగించేవారు
  rationale: వారికి అధికారం ఉందనే స్థితికన్నా దానిని క్రియాశీలంగా వినియోగిస్తున్నారనే గ్రీకు కృదంత భావాన్ని నిలుపుతుంది.
- source_word: εὐεργέται
  choice: ఉపకారులు
  rationale: ప్రజలకు మేలు చేసేవారిగా పరిగణించబడిన పాలకులు లేదా శక్తిమంతమైన పోషకులకు వాడిన గౌరవ బిరుదును సంక్షిప్తంగా సూచిస్తుంది.
- source_word: καλοῦνται
  choice: అని పిలవబడతారు
  rationale: వారికి ఆ బిరుదు ఇతరులు ఇస్తారనే కర్మణి రూపాన్ని నేరుగా నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వచనంలోని శిష్యుల వాదనకు యేసు మాటలు చూపే స్వల్ప వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఈ సందర్భంలో ἐθνῶν భావం
  choice: యూదేతరులు
  alternative: దేశాలు / జనాలు
  rationale: ఈ మాటలో యేసు తన శిష్యుల నాయకత్వ విధానాన్ని యూదేతర ప్రపంచంలోని రాజకీయ ఆధిపత్య పద్ధతితో వ్యత్యాసపరుస్తున్నాడు. ‘యూదేతరులు’ సాధారణ నూతన నిబంధన వాడుకను ప్రతిబింబిస్తుంది; విస్తృతమైన పదార్థాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలిని వాడాం. ‘ప్రభువుల్లా అధికారం చెలాయిస్తారు’ అనే రూపం ఆధిపత్య భావాన్ని, ‘అధికారం ప్రయోగించేవారు’ అనే రూపం క్రియాశీల అధికార వినియోగాన్ని వేర్వేరుగా నిలుపుతాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
