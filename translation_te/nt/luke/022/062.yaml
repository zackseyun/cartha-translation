translation:
  language: te
  text: అతడు బయటికి వెళ్లి[a] తీవ్ర వేదనతో ఏడ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత రూపానుసారంగా, ‘అతడు బయటికి వెళ్లిన తరువాత తీవ్ర వేదనతో ఏడ్చాడు.’
    reason: ἐξελθὼν అనే ఏఓరిస్ట్ కృదంతంలో ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను మరింత స్పష్టంగా చూపే ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: καὶ
  choice: (ప్రత్యేక పదంగా అనువదించకుండా వాక్యక్రమంలో వ్యక్తీకరించబడింది)
  rationale: తెలుగులో ‘వెళ్లి … ఏడ్చాడు’ అనే వరుస క్రియల నిర్మాణమే సాధారణ కథన అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది; ‘మరియు’ అని చేరిస్తే వాక్యం కృత్రిమంగా ఉంటుంది, ‘అప్పుడు’ అని చేరిస్తే గ్రీకులో స్పష్టంగా లేని కాలసూచన బలపడుతుంది.
- source_word: ἐξελθὼν
  choice: వెళ్లి
  rationale: ἐξέρχομαι అనే క్రియ యొక్క ఏఓరిస్ట్ కృదంతం ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచిస్తుంది. తెలుగు వరుస క్రియా నిర్మాణమైన ‘వెళ్లి’ దీన్ని సహజంగా, సంక్షిప్తంగా వ్యక్తీకరిస్తుంది.
- source_word: ἔξω
  choice: బయటికి
  rationale: బయట ఉన్న ప్రదేశం వైపు వెళ్లడాన్ని సూచించే సహజ ఆధునిక తెలుగు రూపం.
- source_word: ἔκλαυσεν
  choice: ఏడ్చాడు
  rationale: κλαίω యొక్క సాధారణ అర్థమైన ఏడవడాన్ని నేరుగా తెలియజేస్తుంది; సందర్భానికి తగిన గంభీరతను కూడా నిలుపుతుంది.
- source_word: πικρῶς
  choice: తీవ్ర వేదనతో
  rationale: ఇక్కడ πικρῶς శారీరక ‘చేదు’ను కాక, లోతైన దుఃఖంతో కూడిన ఏడుపును సూచిస్తుంది. ‘తీవ్ర వేదనతో’ ఆధునిక తెలుగులో ఆ భావాన్ని సహజంగా తెలియజేస్తూ, ఏడుపు విధానాన్ని అతిగా నిర్దిష్టం చేయదు.
