  text: κἀγὼ διατίθεμαι ὑμῖν, καθὼς διέθετό μοι ὁ πατήρ μου βασιλείαν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/029.yaml
  text: And I appoint to you, just as my Father appointed to me, a kingdom.
translation:
  language: te
  text: నేనూ మీకు ఒక రాజ్యాన్ని కేటాయిస్తున్నాను[a]; నా తండ్రి నాకు కేటాయించినట్లే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను మీకు ఒక రాజ్యాన్ని నిబంధనగా ఇస్తున్నాను.” గ్రీకు క్రియకు కేటాయించడం లేదా అనుగ్రహించడం అనే భావంతో పాటు నిబంధనగా స్థిరపరచడం అనే భావం కూడా ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: κἀγὼ
  choice: నేను
  rationale: καί + ἐγώలోని వ్యక్తిగత ఉద్ఘాటనను తెలుగు వాక్యప్రవాహంలో సహజంగా ఉంచుతుంది; ముందు సందర్భంతో అనుసంధానం విరామచిహ్నం మరియు వాక్యక్రమం ద్వారా స్పష్టమవుతుంది.
- source_word: διατίθεμαι
  choice: నియమిస్తున్నాను
  rationale: ఏర్పాటు చేయడం, అప్పగించడం, నిబంధనగా స్థిరపరచడం వంటి విస్తృత భావపరిధిని కలిగిన క్రియ. ఇక్కడ రాజ్యాన్ని అధికారికంగా కేటాయించే భావాన్ని కాపాడుతూ, ప్రధాన పాఠ్యంలో నిబంధన భావాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: ὑμῖν
  choice: మీకు
  rationale: కేటాయింపును పొందేవారిని సూచించే దత్తివును నేరుగా, సహజంగా తెలుపుతుంది.
- source_word: καθὼς
  choice: అలాగే / ...నట్లే
  rationale: యేసు చేసే కార్యానికి, తండ్రి ముందుగా చేసిన కార్యానికి మధ్య ఉన్న సమాంతరాన్ని స్పష్టంగా చూపుతుంది.
- source_word: διέθετό
  choice: నియమించిన
  rationale: మొదటి క్రియతో ఉన్న గ్రీకు పదసామ్యాన్ని తెలుగులోనూ కాపాడుతుంది; భూతకాల కార్యాన్ని సూచిస్తుంది.
- source_word: μοι
  choice: నాకు
  rationale: స్వీకర్తను సూచించే దత్తివుకు సహజమైన తెలుగు రూపం.
- source_word: ὁ πατήρ μου
  choice: నా తండ్రి
  rationale: కుమారుడు–తండ్రి సంబంధాన్ని సూటిగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: βασιλείαν
  choice: రాజ్యాన్ని
  rationale: సందర్భంలో రాజ్యాధికారమూ రాజ్యపాలనమూ అంతర్లీనంగా ఉన్నప్పటికీ, తదుపరి వచనంలోని బల్ల మరియు సింహాసనాల దృశ్యంతో ‘రాజ్యం’ సహజంగా సరిపోతుంది.
theological_decisions:
- issue: διατίθεμαι అనే క్రియను స్పష్టమైన నిబంధన పదజాలంతో అనువదించాలా
  choice: నియమిస్తున్నాను
  alternative: నిబంధనగా ఇస్తున్నాను / అప్పగిస్తున్నాను
  rationale: ఈ క్రియకు నిబంధన సంబంధమైన ఛాయ ఉండవచ్చు; అయితే βασιλείανతో కూడిన నిర్మాణంలో అధికారిక కేటాయింపు అనే విస్తృత భావమూ బలంగా ఉంది. అందువల్ల ప్రధాన పాఠ్యంలో దానిని అతిగా సిద్ధాంతీకరించకుండా, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: βασιλείαν రెండు క్రియలకూ పంచబడిన కర్మగా ఉన్న గ్రీకు నిర్మాణాన్ని ఎలా చూపాలి
  choice: మొదటి వాక్యభాగంలో ‘రాజ్యాన్ని’ ఉంచి, రెండవ భాగంలో ‘దాన్ని’తో సమాంతరాన్ని స్పష్టం చేయడం
  alternative: ‘నా తండ్రి నాకు నియమించినట్లే, నేను మీకు రాజ్యాన్ని నియమిస్తున్నాను’ అని ఒకే కర్మను చివర ఉంచడం
  rationale: గ్రీకులో కర్మ చివర ఉన్నప్పటికీ, తెలుగులో అచ్చంగా అదే దీర్ఘ నిర్మాణం అసహజంగా లేదా క్షణికంగా సందిగ్ధంగా వినిపించవచ్చు. ‘దాన్ని’ భావాన్ని మార్చకుండా రెండవ క్రియకు కర్మను స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ప్రదానం’ కంటే ‘నియమించడం’ను ఎంచుకొని గ్రీకు క్రియలోని అధికారిక కేటాయింపు భావాన్ని, రెండు క్రియల పదసామ్యాన్ని నిలిపాం.
