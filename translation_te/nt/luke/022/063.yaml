revisions:
- from: ఆయనను అదుపులో ఉంచిన మనుషులు[a] ఆయనను కొడుతూ ఎగతాళి చేశారు.
  to: ఆయనను అదుపులో ఉంచిన పురుషులు[a] ఆయనను కొడుతూ ఎగతాళి చేశారు.
  rationale: A limited lexical revision changes మనుషులు to పురుషులు in order to represent ἄνδρες more precisely. The rest of the wording faithfully and naturally renders the Greek, including the simultaneous beating expressed by δέροντες.
