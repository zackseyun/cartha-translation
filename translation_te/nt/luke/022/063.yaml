source:
  edition: SBLGNT
  text: Καὶ οἱ ἄνδρες οἱ συνέχοντες ⸀αὐτὸν ἐνέπαιζον αὐτῷ δέροντες,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/063.yaml
  text: And the men who were holding him mocked him while beating him,[a]
translation:
  language: te
  text: ఆయనను అదుపులో ఉంచిన పురుషులు[a] ఆయనను కొడుతూ ఎగతాళి చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనను పట్టుకొని ఉంచిన పురుషులు.’
    reason: సυνέχοντες అనే పదం శారీరకంగా పట్టుకొని ఉండడం లేదా అదుపులో ఉంచడం అనే భావాల్లో అర్థం కావచ్చు.
lexical_decisions:
- source_word: συνέχοντες
  choice: అదుపులో ఉంచిన
  rationale: ఇక్కడ συνέχω అనే క్రియ యేసును తమ అధీనంలో ఉంచి నిర్బంధించడాన్ని సూచిస్తుంది. ‘అదుపులో ఉంచిన’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, అధికారిక కారాగార నిర్బంధమని అతిగా నిర్దిష్టం చేయదు.
- source_word: ἐνέπαιζον
  choice: ఎగతాళి చేశారు
  rationale: ἐμπαίζω ఇక్కడ శత్రుభావంతో అవమానిస్తూ అపహాస్యం చేయడాన్ని సూచిస్తుంది. ‘ఎగతాళి చేశారు’ ఆ భావాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: αὐτῷ
  choice: ఆయనను
  rationale: గ్రీకులో కర్మ దత్తి విభక్తిలో ఉన్నప్పటికీ, తెలుగులో ‘ఎగతాళి చేయు’ అనే క్రియకు వ్యక్తిని ప్రత్యక్ష కర్మగా చెప్పడం సహజం.
- source_word: δέροντες
  choice: కొడుతూ
  rationale: ఈ వర్తమాన కృదంతం ఎగతాళితో పాటు కొనసాగిన శారీరక దాడిని సూచిస్తుంది. ‘కొడుతూ’ ఆ సహవర్తి, కొనసాగుతున్న చర్యను తెలియజేస్తుంది; ‘కొరడాలతో కొడుతూ’ అనడం గ్రీకులో లేని నిర్దిష్టతను చేర్చుతుంది.
- source_word: ἄνδρες
  choice: మనుషులు
  rationale: గ్రీకు పాఠం వారి హోదాను ‘కాపలాదారులు’ లేదా ‘సైనికులు’ అని నిర్దిష్టం చేయకుండా సాధారణంగా ἄνδρες అని చెబుతుంది. ‘మనుషులు’ ఆ సాధారణ సూచనను నిలుపుతుంది.
- source_word: Καὶ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: తెలుగు కథన ప్రవాహంలో వాక్యారంభ ‘మరియు’ అసహజంగా అనిపిస్తుంది. ముందటి వాక్యంతో సంబంధం సందర్భం ద్వారానే స్పష్టంగా ఉండడంతో సంధానార్థం నిలిచినా ప్రత్యేక పదం అవసరం లేదు.
theological_decisions:
- issue: యేసును హింసించినవారి గుర్తింపు
  choice: ఆయనను అదుపులో ఉంచిన మనుషులు
  alternative: ఆయనను అదుపులో ఉంచిన కాపలాదారులు
  rationale: సందర్భం వారు నిర్బంధ బాధ్యతలో ఉన్నవారని సూచించినా, మూలపాఠం సాధారణమైన ἄνδρες అనే పదాన్నే వాడుతుంది. అందువల్ల వారి హోదాను అనువాదంలో మరింత నిర్దిష్టం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. యేసును సూచించడానికి గౌరవార్థక ‘ఆయన’ ఉపయోగించబడింది. మూలంలోని వర్తమాన కృదంత భావాన్ని ‘కొడుతూ’ ద్వారా నిలిపి, హింస మరియు ఎగతాళి ఒకేసారి జరుగుతున్నట్లు వ్యక్తం చేయబడింది.
