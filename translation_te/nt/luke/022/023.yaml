id: LUK.22.23
reference: Luke 22:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἤρξαντο συζητεῖν πρὸς ἑαυτοὺς τὸ τίς ἄρα εἴη ἐξ αὐτῶν ὁ τοῦτο μέλλων πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/023.yaml
  text: And they began to discuss among themselves which one of them might be the one about to do this[a].
translation:
  language: te
  text: అప్పుడు వారిలో ఎవరు ఈ పని చేయబోయేవారో అని వారు తమలో తాము చర్చించుకోవడం మొదలుపెట్టారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమలో ఎవరు ఈ పని చేయబోయేవారో అని.” ఇక్కడ “ఈ పని” అనేది ముందటి వచనంలో చెప్పబడిన ద్రోహం చేసే కార్యాన్ని సూచిస్తుంది.
    reason: పదబంధ నిర్మాణానికి ప్రత్యామ్నాయ సహజ అనువాదాన్ని ఇవ్వడం, అలాగే ‘ఈ పని’ అనే సూచనను సందర్భపరంగా వివరించడం.
lexical_decisions:
- source_word: ἤρξαντο
  choice: మొదలుపెట్టారు
  rationale: అనంతక్రియతో వచ్చిన ἄρχω చర్య ఆరంభాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మొదలుపెట్టారు’ సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: συζητεῖν
  choice: చర్చించుకోవడం
  rationale: ఇక్కడ శిష్యులు ఎవరు ఆ పని చేస్తారో పరస్పరం విచారిస్తున్నారు; ‘చర్చించుకోవడం’ శత్రుత్వపూర్వక వాదనను అనవసరంగా సూచించకుండా పరస్పర సంభాషణను తెలియజేస్తుంది.
- source_word: πρὸς ἑαυτούς
  choice: తమలో తాము
  rationale: ఈ నుడికారం గుంపులోని పరస్పర చర్యను సూచిస్తుంది; ‘తమలో తాము’ సహజమైన తెలుగు ప్రయోగం.
- source_word: τὸ τίς ἄρα εἴη ἐξ αὐτῶν
  choice: వారిలో ఎవరు ... అని
  rationale: తెలుగులో పరోక్ష ప్రశ్నకు ఈ నిర్మాణం సహజం. ἄρα మరియు optative εἴη తెలిపే విచారణాత్మక అనిశ్చితి ప్రశ్నారూప సందర్భంలో నిలుస్తుంది; విడిగా కృత్రిమమైన పదాన్ని చేర్చలేదు.
- source_word: μέλλων πράσσειν
  choice: చేయబోతున్నారో
  rationale: μέλλω + infinitive సమీప భవిష్యత్తు లేదా జరగబోయే చర్యను సూచిస్తుంది; ‘చేయబోతున్నారు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: τοῦτο
  choice: ఈ పని
  rationale: τοῦτο ముందటి వచనంలో చెప్పిన చర్యను సూచిస్తుంది. తెలుగులో ‘ఇది చేయడం’ కంటే ‘ఈ పని చేయడం’ సహజమైనప్పటికీ, ద్రోహం అని స్పష్టీకరించకుండా మూలంలోని పరోక్షతను కాపాడుతుంది.
theological_decisions:
- issue: ‘ఈ పని’ అంటే ద్రోహమని ప్రధాన పాఠ్యంలో స్పష్టంగా చెప్పాలా
  choice: మూలంలోని పరోక్షమైన ‘ఈ పని చేయడం’నే ఉంచడం
  alternative: ‘ఆయనను అప్పగించడం’ లేదా ‘ఆయనకు ద్రోహం చేయడం’ అని విస్తరించడం
  rationale: సందర్భం ద్రోహాన్ని స్పష్టంగా సూచించినా, ఈ వచనంలో గ్రీకు τοῦτο μέλλων πράσσειν అనే సాధారణ వ్యక్తీకరణనే వాడుతుంది. అందువల్ల ప్రధాన పాఠ్యంలో లేని వివరణను చేర్చకుండా, సూచితార్థాన్ని పాదసూచికలో తెలియజేయడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని పరోక్ష ప్రశ్నను సహజ తెలుగు పదక్రమంలో ఇచ్చి, ద్రోహం అనే సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో అనవసరంగా విస్తరించలేదు.
