    text: లేదా, “తమలో ఎవరు ఈ పని చేయబోయేవారో అని.” ఇక్కడ “ఈ పని” అనేది ముందటి వచనంలో చెప్పబడిన ద్రోహం చేసే కార్యాన్ని సూచిస్తుంది.
    reason: పదబంధ నిర్మాణానికి ప్రత్యామ్నాయ సహజ అనువాదాన్ని ఇవ్వడం, అలాగే ‘ఈ పని’ అనే సూచనను సందర్భపరంగా వివరించడం.
