id: LUK.22.38
reference: Luke 22:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Κύριε, ἰδοὺ μάχαιραι ὧδε δύο. ὁ δὲ εἶπεν αὐτοῖς· Ἱκανόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/038.yaml
  text: And they said[a], “Lord, look, here are two swords.” And he said to them, “It is enough.”
translation:
  language: te
  text: అప్పుడు వారు, “ప్రభువా, ఇదిగో, ఇక్కడ రెండు కత్తులు ఉన్నాయి” అన్నారు. ఆయన వారితో, “అది చాలు[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చాలు, ఇక ఈ మాట వద్దు.” అంటే రెండు కత్తులు సరిపోతాయని కాకుండా, ఈ సంభాషణను ముగించమని యేసు చెప్పి ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: అప్పుడు వారు … అన్నారు
  rationale: δέ స్వల్ప కథన అనుసంధానాన్ని సూచిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా ఉంటుంది, అనవసరమైన వ్యతిరేక భావాన్ని జోడించదు.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: యేసును నేరుగా సంబోధించే κύριεకు, కొత్త నిబంధనలోని బిరుదు భావాన్ని కూడా నిలుపుతూ ‘ప్రభువా’ సరిపోతుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: చూపిస్తూ దృష్టిని ఆకర్షించే ἰδού భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఇదిగో’ వ్యక్తం చేస్తుంది.
- source_word: μάχαιραι
  choice: కత్తులు
  rationale: μάχαιρα ఒక పదునైన ఆయుధాన్ని సూచిస్తుంది. దాని ఖచ్చిత రూపాన్ని అతిగా నిర్దేశించకుండా సాధారణ తెలుగు పదమైన ‘కత్తి’ వాడబడింది.
- source_word: ὧδε δύο
  choice: ఇక్కడ రెండు … ఉన్నాయి
  rationale: ὧδε యొక్క స్థానసూచక భావాన్నీ δύο అనే సంఖ్యనూ సహజ తెలుగు వాక్యక్రమంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: Ἱκανόν ἐστιν
  choice: అది చాలు
  rationale: ἱκανός యొక్క ‘సరిపోవడం/చాలు’ అనే భావాన్ని సంక్షిప్తంగా ఇస్తుంది. ‘అది’ అనేది రెండు కత్తులను సూచించవచ్చు లేదా సంభాషణను ముగించే మాటగా ఉండవచ్చు; అందువల్ల మూలంలోని సందిగ్ధత నిలుస్తుంది.
theological_decisions:
- issue: Ἱκανόν ἐστιν అనే యేసు జవాబులోని వ్యాఖ్యాన సందిగ్ధత
  choice: అది చాలు
  alternative: చాలు, ఇక ఈ మాట వద్దు
  rationale: గ్రీకు మాటను రెండు కత్తులు సరిపోతాయనే అర్థంలోనూ, సంభాషణ ఇక చాలనే అర్థంలోనూ గ్రహించవచ్చు. ప్రధాన పాఠం ఈ రెండింటిలో ఒకదాన్ని ఖరారు చేయకుండా సందిగ్ధతను నిలుపుతుంది; ప్రత్యామ్నాయ భావం పాదటిప్పణిలో ఇవ్వబడింది.
translation_notes:
  register: సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు; ప్రత్యక్ష సంభాషణలో సహజత్వం, గౌరవభావం నిలుపబడ్డాయి. ‘అది చాలు’ మూలంలోని సంక్షిప్తతను, వ్యాఖ్యాన సందిగ్ధతను కాపాడుతుంది.
