source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ἐᾶτε ἕως τούτου· καὶ ἁψάμενος τοῦ ⸀ὠτίου ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/051.yaml
  text: But Jesus answered, “Enough of this!” And he touched his ear and healed him.
translation:
  language: te
  text: 'అయితే యేసు స్పందిస్తూ ఇలా అన్నాడు: “ఇంతటితో చాలు!” అప్పుడు ఆయన అతని చెవిని తాకి అతనిని స్వస్థపరిచాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: అయితే యేసు … అని చెప్పి
  rationale: ἀποκρίνομαι అనే పదం తప్పనిసరిగా ప్రశ్నకు జవాబు ఇవ్వడాన్ని మాత్రమే సూచించదు; ఇక్కడ జరుగుతున్న చర్యకు యేసు స్పందించడాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపింది.
- source_word: Ἐᾶτε ἕως τούτου
  choice: ఇక చాలు!
  rationale: పదబద్ధంగా ఇది ‘ఇంతవరకు వదలండి/అనుమతించండి’ అనే సంక్షిప్త, సందర్భానుసారంగా కొంత సందిగ్ధమైన ఆజ్ఞ. శిష్యుల హింసాత్మక చర్యను నిలిపివేసే సందర్భంలో ‘ఇక చాలు!’ సహజంగా, బలంగా అర్థాన్ని అందిస్తుంది; ఆజ్ఞ ఎవరిని ఉద్దేశించిందో అదనంగా నిర్ధారించదు.
- source_word: ἁψάμενος τοῦ ὠτίου
  choice: అతని చెవిని తాకి
  rationale: ὠτίον అనే పదానికి ‘చెవి/చెవి భాగం’ అనే భావం ఉంది. సందర్భంలోని వ్యక్తిని ‘అతని’ అని తెలుపుతూ, గ్రీకు పాఠంలోని సరళ చర్యను నిలిపింది.
- source_word: ἰάσατο αὐτόν
  choice: స్వస్థపరిచాడు
  rationale: ἰάομαι యొక్క ప్రత్యక్ష స్వస్థత భావాన్ని గౌరవప్రదమైన, సాధారణ తెలుగు పదంతో తెలిపింది.
theological_decisions:
- issue: Ἐᾶτε ἕως τούτου అనే మాట యొక్క అర్థం మరియు ఉద్దేశిత శ్రోతలు
  choice: “ఇక చాలు!”
  alternative: “ఇంతటితో ఆపండి!” / “ఇంతవరకు అనుమతించండి!”
  rationale: గ్రీకు వాక్యం సంక్షిప్తంగా ఉండి, ‘వారిని ఇంతవరకు చేయనివ్వండి,’ ‘నన్ను ఇంతవరకు అనుమతించండి,’ లేదా ‘ఇక చాలు’ వంటి వివరణలకు అవకాశం ఇస్తుంది. కథా సందర్భం మరియు ఆడిట్ చేసిన ఆంగ్ల సంప్రదింపును అనుసరించి హింసను ఆపే బలమైన మాటగా అనువదించాం; కానీ శ్రోతలను లేదా చర్యను వివరణాత్మకంగా చేర్చి సందిగ్ధతను కృత్రిమంగా తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా సంక్షిప్తమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని వేగవంతమైన చర్యల క్రమాన్ని ఒక సహజ తెలుగు వాక్యంలో నిలిపింది.
