id: LUK.22.58
reference: Luke 22:58
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ μετὰ βραχὺ ἕτερος ἰδὼν αὐτὸν ἔφη· Καὶ σὺ ἐξ αὐτῶν εἶ· ὁ δὲ Πέτρος ⸀ἔφη· Ἄνθρωπε, οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/058.yaml
  text: And after a little while[a], another man, seeing him, said, “You also are one of them.” But Peter said, “Man, I am not.”
translation:
  language: te
  text: కొద్దిసేపటి తర్వాత మరొకడు అతణ్ణి చూసి, “నువ్వు కూడా వారిలో ఒకడివే” అన్నాడు. అయితే పేతురు, “అయ్యా, నేను కాదు[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత స్పష్టంగా, “నేను వారిలో ఒకడిని కాదు.” గ్రీకులో కేవలం “నేను కాదు” అని ఉంది; దేనిని కాదంటున్నాడో ముందున్న ఆరోపణనుంచి అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ βραχὺ
  choice: కొద్దిసేపటి తర్వాత
  rationale: కొద్ది కాలవ్యవధి గడిచిన తరువాత అని తెలిపే సహజమైన తెలుగు ప్రయోగం.
- source_word: ἕτερος
  choice: మరొకడు
  rationale: మరొక వ్యక్తిని సూచిస్తుంది; తెలుగు పుంలింగ ఏకవచన రూపం సందర్భంలోని వ్యక్తిని స్పష్టంగా చూపుతుంది.
- source_word: ἰδὼν αὐτὸν
  choice: అతణ్ణి చూసి
  rationale: గ్రీకు భూతకృదంతం తెలిపే నేపథ్య/అనుబంధ చర్యను సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: ἔφη
  choice: అన్నాడు
  rationale: కథనంలో సాధారణ వాక్యప్రవేశక క్రియగా ఉన్న φημίకి సహజమైన తెలుగు సమానం.
- source_word: Καὶ σὺ ἐξ αὐτῶν εἶ
  choice: నువ్వు కూడా వారిలో ఒకడివే
  rationale: ἐξ αὐτῶν ఇక్కడ మూలాన్ని కాక యేసుతో ఉన్న గుంపులో సభ్యత్వాన్ని సూచిస్తుంది; ‘వారిలో ఒకడివే’ ఆ ఆరోపణను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ἄνθρωπε
  choice: అయ్యా
  rationale: పురుషుణ్ణి నేరుగా సంబోధించే పదానికి ఆధునిక తెలుగులో సహజమైన సమానం; ‘మనిషీ’ అనే అక్షరానువాదపు కృత్రిమతను నివారిస్తుంది.
- source_word: οὐκ εἰμί
  choice: నేను కాదు
  rationale: గ్రీకులో విధేయపదం మునుపటి ఆరోపణనుంచి గ్రహించాల్సి ఉంటుంది. ‘నేను కాదు’ ఆ సంక్షిప్తతను, ఉద్దేశపూర్వక అసంపూర్ణతను నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. పేతురు జవాబులోని గ్రీకు వాక్య సంక్షిప్తతను ప్రధాన పాఠంలో నిలిపి, అంతర్భావిత అర్థాన్ని పాదసూచికలో ఇచ్చాం.
