  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Πέτρος· Ἄνθρωπε, οὐκ οἶδα ὃ λέγεις. καὶ παραχρῆμα ἔτι λαλοῦντος αὐτοῦ ἐφώνησεν ἀλέκτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/060.yaml
  text: But Peter said[a], “Man, I do not know what you are saying.” And immediately, while he was still speaking, a rooster crowed.
translation:
  language: te
  text: అయితే పేతురు, “మనిషీ, నువ్వు ఏమి చెబుతున్నావో నాకు తెలియదు” అన్నాడు. అతడు ఇంకా మాట్లాడుతుండగానే, ఒక కోడిపుంజు వెంటనే కూసింది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, కోడి కూసింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి ఆరోపణకు పేతురు ఇచ్చిన విరుద్ధ ప్రతిస్పందనను, అలాగే కథనంలోని మలుపును సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: Ἄνθρωπε
  choice: మనిషీ
  rationale: ఏకవచన సంబోధనను నేరుగా నిలుపుతూ, ‘అయ్యా’లో ఉండగల గౌరవార్థాన్ని అనవసరంగా చేర్చకుండా పేతురు మాటలోని మొరటైన సూటితనాన్ని కాపాడుతుంది.
- source_word: οὐκ οἶδα
  choice: నాకు తెలియదు
  rationale: వర్తమానార్థంలో ఉన్న οἶδα క్రియకు సహజమైన, సూటి తెలుగు రూపం.
- source_word: ὃ λέγεις
  choice: నువ్వు ఏమి చెబుతున్నావో
  rationale: పేతురు చేసిన నిరాకరణను ‘నీ ఉద్దేశం ఏమిటో’ వంటి వివరణాత్మక భావంగా మార్చకుండా, గ్రీకు మాటల సూటి అర్థాన్ని సహజంగా అందిస్తుంది.
- source_word: παραχρῆμα
  choice: వెంటనే
  rationale: ఏ ఆలస్యమూ లేకుండా జరిగిన చర్యను స్పష్టంగా తెలియజేసే సాధారణ ఆధునిక తెలుగు పదం.
- source_word: ἔτι λαλοῦντος αὐτοῦ
  choice: అతడు ఇంకా మాట్లాడుతుండగానే
  rationale: పేతురు మాట్లాడటం పూర్తికాకముందే కోడి కూసిందనే సమకాలీనతను, ἔτι ఇచ్చే నొక్కిచెప్పడాన్ని నిలుపుతుంది.
- source_word: ἐφώνησεν ἀλέκτωρ
  choice: ఒక కోడి కూసింది
  rationale: కోడిపుంజు చేసే శబ్దానికి తెలుగులో సహజంగా వాడే వ్యక్తీకరణ; ἀλέκτωρ సూచించే మగకోడిని సందర్భం స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కథన శైలి పాటించబడింది. ‘మనిషీ’ కొంత అసాధారణంగా వినిపించినా, మూలంలోని నేరమైన సంబోధనను మరియు దాని కఠిన స్వరాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది.
