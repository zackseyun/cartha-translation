revisions:
- from: అయితే పేతురు, “మనిషీ, నువ్వు ఏమి చెబుతున్నావో నాకు తెలియదు” అన్నాడు. అతడు ఇంకా మాట్లాడుతుండగానే, వెంటనే ఒక కోడి[a] కూసింది.
  to: అయితే పేతురు, “మనిషీ, నువ్వు ఏమి చెబుతున్నావో నాకు తెలియదు” అన్నాడు. అతడు ఇంకా మాట్లాడుతుండగానే, ఒక కోడిపుంజు వెంటనే కూసింది[a].
