id: LUK.22.42
reference: Luke 22:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγων· Πάτερ, εἰ βούλει ⸀παρένεγκε ⸂τοῦτο τὸ ποτήριον⸃ ἀπ’ ἐμοῦ· πλὴν μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/042.yaml
  text: saying[a], “Father, if you are willing, take this cup away from me. Nevertheless, not my will[c][b], but yours be done.”
translation:
  language: te
  text: 'ఇలా అన్నాడు: “తండ్రీ, నీకు ఇష్టమైతే, ఈ పాత్రను[b] నా నుండి తొలగించు.[a] అయినా నా చిత్తం కాదు, నీ చిత్తమే నెరవేరాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఈ పాత్రను నా నుండి తీసివేయి.”
    reason: lexical_alternative
  - marker: b
    text: ‘పాత్ర’ అనేది బైబిలులో ఒకరికి నిర్ణయించబడిన భాగానికి, ముఖ్యంగా బాధకు లేదా తీర్పుకు, రూపకంగా వాడబడుతుంది.
    reason: cross_reference
lexical_decisions:
- source_word: λέγων
  choice: ఇలా అన్నాడు
  rationale: వర్తమాన కృదంతం ప్రార్థనలోని మాటలను పరిచయం చేస్తుంది. తెలుగులో సహజమైన వాక్యప్రవాహం కోసం కర్తను సందర్భం నుండి గ్రహించే విధంగా క్రియారూపంగా ఇచ్చాం.
- source_word: Πάτερ
  choice: తండ్రీ
  rationale: దేవునికి నేరుగా చేసే సంబోధనను ఆధునిక, గౌరవప్రదమైన తెలుగు సంబోధనారూపం సరిగ్గా వ్యక్తం చేస్తుంది.
- source_word: εἰ βούλει
  choice: నీకు ఇష్టమైతే
  rationale: βούλομαι ఇక్కడ సంకల్పం లేదా సమ్మతిని సూచిస్తుంది; షరతుతో కూడిన విజ్ఞప్తిని ఈ రూపం సహజంగా నిలుపుతుంది.
- source_word: παρένεγκε ... ἀπ’ ἐμοῦ
  choice: నా దగ్గర నుండి తొలగించు
  rationale: పాత్రను తన నుండి దూరం చేయమనే విజ్ఞప్తిని స్పష్టంగా తెలియజేస్తుంది; ‘తీసివేయి’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: τοῦτο τὸ ποτήριον
  choice: ఈ పాత్రను
  rationale: బాధ లేదా తీర్పులో నియమించబడిన భాగాన్ని సూచించే బైబిలు రూపకాన్ని వ్యాఖ్యానించి సమతలపరచకుండా యథాతథంగా నిలిపాం.
- source_word: πλὴν
  choice: అయినా
  rationale: మొదటి విజ్ఞప్తి నుండి తండ్రి చిత్తానికి లోబడటానికి వచ్చే బలమైన వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో చూపుతుంది.
- source_word: μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν
  choice: నా చిత్తం కాదు, నీ చిత్తమే
  rationale: గ్రీకు మూలంలోని నామవాచక నిర్మాణాన్ని నిలుపుతూ, ‘మే’ ద్వారా వ్యత్యాసానికి తగిన ఉద్ఘాటన ఇచ్చాం.
- source_word: γινέσθω
  choice: నెరవేరాలి
  rationale: తండ్రి చిత్తం కార్యరూపం దాల్చాలని తెలిపే మూడవ పురుష ఆజ్ఞార్థ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యేసు చిత్తానికి తండ్రి చిత్తానికి మధ్య సంబంధం
  choice: “నా చిత్తం కాదు, నీ చిత్తమే నెరవేరాలి” అని నేరుగా అనువదించడం
  alternative: “నేను కోరేది కాదు, నీవు కోరేదే జరగాలి”
  rationale: మూలవాక్యం యేసు తన చిత్తాన్ని తండ్రి చిత్తం నుండి వేరుగా పేర్కొంటూనే దానికి లోబడటాన్ని చూపుతుంది. తరువాతి సిద్ధాంత వివరణను చేర్చకుండా ఈ ఉద్వేగాన్ని నిలిపాం.
- issue: ‘పాత్ర’ అనే రూపకపు భావం
  choice: ప్రధాన పాఠ్యంలో ‘పాత్ర’ అనే రూపకాన్ని నిలుపడం
  alternative: “ఈ బాధను” లేదా “ఈ శ్రమను”
  rationale: బాధ లేదా తీర్పుతో సంబంధమున్న బైబిలు ప్రతిధ్వనులను ఈ రూపకం మోస్తుంది. దాన్ని ప్రధాన పాఠ్యంలోనే వ్యాఖ్యానించడం మూలంలోని బహుళార్థ గాఢతను తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలిని ఉపయోగించాం. సాంప్రదాయికమైనప్పటికీ ఇప్పటికీ సులభంగా అర్థమయ్యే ‘తండ్రీ’, ‘చిత్తం’, ‘పాత్ర’ పదాలను నిలిపాం; మూలంలోని సంక్షిప్తతను, రూపకాన్ని, ధార్మిక ఉద్వేగాన్ని కాపాడాం.
