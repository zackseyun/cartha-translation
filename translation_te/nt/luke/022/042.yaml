  to: 'ఇలా అన్నాడు: “తండ్రీ, నీకు ఇష్టమైతే, ఈ పాత్రను[b] నా నుండి తొలగించు.[a] అయినా నా చిత్తం కాదు, నీ చిత్తమే నెరవేరాలి.”'
