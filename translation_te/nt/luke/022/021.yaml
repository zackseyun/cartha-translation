  text: πλὴν ἰδοὺ ἡ χεὶρ τοῦ παραδιδόντος με μετ’ ἐμοῦ ἐπὶ τῆς τραπέζης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/021.yaml
  text: But look, the hand of the one betraying me is with me on the table.
translation:
  language: te
  text: అయితే ఇదిగో, నన్ను అప్పగిస్తున్నవాని చెయ్యి నాతోపాటు బల్ల మీద ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: అయితే
  rationale: ముందున్న మాటకు వ్యతిరేక మలుపును సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రోతల దృష్టిని వెంటనే ఆకర్షించే ఆజ్ఞార్థక ఉద్ఘాటనను నిలుపుతుంది.
- source_word: τοῦ παραδιδόντος με
  choice: నన్ను అప్పగిస్తున్నవాని
  rationale: వర్తమాన కృదంత రూపాన్ని నిలుపుతూ, παραδίδω యొక్క ప్రాథమిక భావమైన ‘అప్పగించు’ను ఇస్తుంది; సందర్భంలో ద్రోహార్థం స్పష్టంగా ఉన్నా దానిని పదంలోనే అధికంగా వివరించదు.
- source_word: μετ’ ἐμοῦ ἐπὶ τῆς τραπέζης
  choice: నాతోపాటు బల్ల మీద
  rationale: సహవాసం మరియు బల్లపై చెయ్యి ఉన్న దృశ్యాన్ని మూలానికి దగ్గరగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: παραδίδω పదంలోని అప్పగింత మరియు ద్రోహం మధ్య భావసంబంధం
  choice: అప్పగిస్తున్నవాని
  alternative: నాకు ద్రోహం చేస్తున్నవాని
  rationale: మూలపదం అప్పగించడాన్ని నేరుగా సూచిస్తుంది; ఈ సందర్భం దాని ద్రోహపూరిత స్వభావాన్ని తెలియజేస్తుంది. అందువల్ల వ్యాఖ్యానాన్ని పదంలోనే చేర్చకుండా మూలంలోని ఉద్వేగాన్ని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్యనిర్మాణం. ‘చెయ్యి’ సహజ ఆధునిక రూపం; ‘బల్ల’ సాధారణంగా అర్థమయ్యే పదం.
