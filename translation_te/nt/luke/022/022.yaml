id: LUK.22.22
reference: Luke 22:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ὅτι ὁ υἱὸς μὲν⸃ τοῦ ἀνθρώπου ⸂κατὰ τὸ ὡρισμένον πορεύεται⸃, πλὴν οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ παραδίδοται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/022.yaml
  text: For the Son of Man indeed goes as it has been determined[a], but woe to that man through whom he is betrayed.
translation:
  language: te
  text: ఎందుకంటే మనుష్యకుమారుడు నిర్ణయించబడిన ప్రకారమే వెళ్తున్నాడు; అయితే, ఎవరి ద్వారా ఆయన అప్పగించబడుతున్నాడో[a] ఆ మనిషికి అయ్యో!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఎవరి ద్వారా ఆయన ద్రోహం చేయబడుతున్నాడో.” గ్రీకు క్రియ సందర్భాన్ని బట్టి “అప్పగించు” లేదా “ద్రోహం చేయు” అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు కారణాన్ని పరిచయం చేసే అనుసంధాన పదంగా సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: యేసు తనను తాను సూచించుకోవడానికి వాడిన బిరుదును, దాని గ్రంథాంతర ప్రతిధ్వనితో సహా నిలుపుతుంది.
- source_word: μέν … πλὴν
  choice: …; అయినా,
  rationale: మొదటి వాక్యభాగాన్ని అంగీకరిస్తూనే రెండవ భాగంలోని బలమైన వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; μέν‌ను విడిగా భారంగా అనువదించకుండా దాని వ్యత్యాస పాత్రను వాక్య నిర్మాణంలో నిలుపుతుంది.
- source_word: κατὰ τὸ ὡρισμένον
  choice: నిర్ణయించబడిన ప్రకారమే
  rationale: ముందుగా జరిగిన నిర్ణయానికి అనుగుణంగా అనే భావాన్ని, నిర్ణయించిన వ్యక్తిని వచనంలో అదనంగా పేర్కొనకుండా, గ్రీకు కర్మణి భావంతో నిలుపుతుంది.
- source_word: πορεύεται
  choice: వెళ్తున్నాడు
  rationale: యేసు మరణం వైపు సాగుతున్న గమనాన్ని సూచించే సరళమైన, సందర్భోచితమైన వర్తమాన రూపం.
- source_word: οὐαὶ
  choice: అయ్యో!
  rationale: విలాపాన్నీ రాబోయే తీర్పు ప్రకటననూ కలిగిన ప్రవచనాత్మక బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τῷ ἀνθρώπῳ ἐκείνῳ
  choice: ఆ మనిషికి
  rationale: సందర్భంలో నిర్దిష్టమైన పురుష వ్యక్తిని సూచించే గ్రీకు పదబంధాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: δι’ οὗ
  choice: ఎవరి ద్వారా
  rationale: διά + షష్ఠీ విభక్తి తెలిపే మధ్యవర్తిత్వం లేదా కర్తృత్వ భావాన్ని దగ్గరగా నిలుపుతుంది.
- source_word: παραδίδοται
  choice: అప్పగించబడుతున్నాడో
  rationale: పదానికి ప్రాథమికమైన ‘అప్పగించు’ భావాన్ని నిలుపుతూ, ఈ సందర్భంలో ఉన్న ద్రోహ భావాన్ని పాదసూచికలో తెలియజేస్తుంది; తద్వారా మూలంలోని అర్థ విస్తృతిని అనవసరంగా కుదించదు.
theological_decisions:
- issue: దైవ నిర్ణయానికీ మానవ బాధ్యతకీ మధ్య సంబంధం
  choice: మనుష్య కుమారుని గమనం నిర్ణయించబడిన ప్రకారమే జరుగుతుందని, అదే సమయంలో ఆయనను అప్పగించే మనిషిపై ‘అయ్యో’ అనే ప్రకటన నిలుస్తుందని రెండింటినీ పక్కపక్కనే ఉంచడం.
  alternative: దైవ నిర్ణయాన్ని మృదువుగా చేయడం, లేదా అప్పగించే వ్యక్తి బాధ్యతను తగ్గించడం.
  rationale: గ్రీకు వాక్యం ముందుగా నిర్ణయించబడిన ప్రణాళికనూ, దానిలో పనిచేసే మనిషిపై నైతిక తీర్పునూ స్పష్టంగా ఎదురెదురుగా ఉంచుతుంది. అనువాదం ఏదో ఒక సిద్ధాంత వ్యవస్థకు అనుగుణంగా ఈ ఉద్రిక్తతను పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి వాడబడింది. ‘అయ్యో’ ప్రవచనాత్మక విలాపం/తీర్పు బలాన్ని నిలుపుతుంది. పాదసూచిక గుర్తు సంబంధిత క్రియ తర్వాతే ఉంచబడింది.
