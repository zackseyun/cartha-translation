revisions:
- from: ఎందుకంటే మనుష్య కుమారుడు నిర్ణయించబడిన ప్రకారమే వెళ్తున్నాడు; అయినా, ఎవరి ద్వారా ఆయన అప్పగించబడుతున్నాడో[a] ఆ మనిషికి అయ్యో!
  to: ఎందుకంటే మనుష్యకుమారుడు నిర్ణయించబడిన ప్రకారమే వెళ్తున్నాడు; అయితే, ఎవరి ద్వారా ఆయన అప్పగించబడుతున్నాడో[a] ఆ మనిషికి అయ్యో!
  rationale: The revision standardizes the established biblical title ‘మనుష్యకుమారుడు’ and recasts the lexical-alternative footnote in idiomatic Telugu. It continues to preserve the source text’s juxtaposition of prior determination and woe upon the responsible man, without resolving that tension.
