translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘మేడగది’ సాధారణ పాఠకులకు అర్థమయ్యేలా పై అంతస్తు గదిని సూచిస్తుంది; ἐστρωμένονలోని అర్థ విస్తృతిని ప్రధాన పాఠ్యం మరియు పాదసూచిక కలిసి కాపాడుతున్నాయి.
