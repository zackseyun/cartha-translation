translation:
  language: te
  text: అతడు మీకు అమర్చబడి ఉన్న పెద్ద పై అంతస్తు గదిని చూపిస్తాడు[a]. అక్కడ సిద్ధం చేయండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సిద్ధంగా ఉన్న పెద్ద పై అంతస్తు గదిని,’ లేదా, ‘పరుపులు/ఆసనాలు పరచి అమర్చిన పెద్ద పై అంతస్తు గదిని.’
    reason: ἐστρωμένον అనే పదం గది సిద్ధంగా ఉండడాన్ని లేదా భోజనానికి పరుపులు/ఆసనాలు అమర్చబడి ఉండడాన్ని సూచించవచ్చు.
lexical_decisions:
- source_word: κἀκεῖνος
  choice: అప్పుడు అతడు
  rationale: καί + ἐκεῖνος ఇక్కడ ముందుగా ప్రస్తావించిన ఇంటి యజమానిని సూచిస్తూ ఆదేశాల క్రమాన్ని కొనసాగిస్తుంది. తెలుగులో ‘అప్పుడు అతడు’ సహజంగా ఆ కొనసాగింపును తెలియజేస్తుంది.
- source_word: ὑμῖν δείξει
  choice: మీకు ... చూపిస్తాడు
  rationale: దత్తివాచక సర్వనామంతో కూడిన δείκνυμι భవిష్యత్ రూపాన్ని తెలుగులో సహజంగా ‘మీకు చూపిస్తాడు’ అని అనువదించాం.
- source_word: ἀνάγαιον μέγα
  choice: ఒక పెద్ద మేడగదిని
  rationale: ἀνάγαιον పై అంతస్తులోని గదిని సూచిస్తుంది; ‘మేడగది’ ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని ఇస్తుంది. μέγα పరిమాణాన్ని ‘పెద్ద’గా తెలుపుతుంది.
- source_word: ἐστρωμένον
  choice: అమర్చబడి ఉన్న
  rationale: στρώννυμι యొక్క సంపూర్ణ కర్మణి కృదంతం గది పరచబడి లేదా భోజన ఏర్పాట్లతో అమర్చబడి ఉన్న స్థితిని సూచిస్తుంది. ‘అమర్చబడి ఉన్న’ మూలంలోని విస్తృత భావాన్ని నిలుపుతూ, కేవలం పూర్తిగా సిద్ధమైందని అతిగా నిర్ధారించదు.
- source_word: ἐκεῖ ἑτοιμάσατε
  choice: అక్కడ సిద్ధం చేయండి
  rationale: ἐκεῖను ‘అక్కడ’గా, బహువచన ఆజ్ఞార్థకమైన ἑτοιμάσατεను గౌరవ/బహువచన రూపంలో ‘సిద్ధం చేయండి’గా నేరుగా అందించాం; సందర్భంలో పస్కా భోజన ఏర్పాట్లు అర్థమవుతాయి.
