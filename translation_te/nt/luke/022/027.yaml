id: LUK.22.27
reference: Luke 22:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίς γὰρ μείζων, ὁ ἀνακείμενος ἢ ὁ διακονῶν; οὐχὶ ὁ ἀνακείμενος; ἐγὼ δὲ ⸂ἐν μέσῳ ὑμῶν εἰμι⸃ ὡς ὁ διακονῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/027.yaml
  text: For who is greater[a], the one reclining at the table or the one serving? Is it not the one reclining at the table? But I am among you as one who serves.
translation:
  language: te
  text: ఎందుకంటే, ఎవరు గొప్పవాడు—బల్ల దగ్గర భోజనం చేస్తూ వాలుకొని ఉన్నవాడా,[a] లేక సేవ చేసేవాడా? బల్ల దగ్గర భోజనం చేస్తూ వాలుకొని ఉన్నవాడే కదా? అయితే నేను మీ మధ్య సేవ చేసేవాడిగా ఉన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థానికి దగ్గరగా, “వాలుకొని ఉన్నవాడు.” ప్రాచీన విందులలో భోజనం చేసేవారు బల్ల దగ్గర పరుపులపై వాలుకొని భోజనం చేసేవారు; పరిచారకులు వారికి సేవ చేసేవారు.
    reason: cultural_note
lexical_decisions:
- source_word: τίς γὰρ μείζων
  choice: ఎందుకంటే, ఎవరు గొప్పవారు
  rationale: γὰρ ముందున్న మాటకు వివరణాత్మక ఆధారాన్ని సూచిస్తుంది; μείζων హోదా లేదా ప్రాముఖ్యతలో తులనను తెరిచి ఉంచుతుంది.
- source_word: ὁ ἀνακείμενος
  choice: భోజనానికి వాలుకొని కూర్చున్నవారు
  rationale: ప్రాచీన విందు ఆచారంలో భోజనం చేసేవారు ఆనుకొని లేదా వాలుకొని ఉండడాన్ని ఈ క్రియ సూచిస్తుంది. తెలుగు పాఠకుడికి భోజన సందర్భం స్పష్టమయ్యేలా స్వల్ప విస్తరణ చేయబడింది.
- source_word: ὁ διακονῶν
  choice: సేవ చేస్తున్నవారు
  rationale: వర్తమాన కృదంతం భోజనం చేస్తున్న వ్యక్తికి విరుద్ధంగా పరిచర్య చేస్తున్న వ్యక్తిని సూచిస్తుంది. నామవాచకమైన ‘సేవకుడు’ కంటే క్రియాత్మక భావాన్ని ఇది నిలుపుతుంది.
- source_word: οὐχὶ ὁ ἀνακείμενος
  choice: భోజనానికి వాలుకొని కూర్చున్నవారే కదా?
  rationale: οὐχί అంగీకార సమాధానాన్ని ఆశించే అలంకారప్రశ్న; ‘వారే కదా?’ సహజమైన ఆధునిక తెలుగులో ఆ బలాన్ని అందిస్తుంది.
- source_word: ἐγὼ δὲ
  choice: అయితే నేను
  rationale: δέ సాధారణ సామాజిక అంచనాకు యేసు ప్రవర్తనకు మధ్య ఉన్న వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: ἐν μέσῳ ὑμῶν εἰμι
  choice: నేను మీ మధ్య ... ఉన్నాను
  rationale: సమూహం మధ్యలో ఉన్న ఉనికిని సహజమైన తెలుగులో ‘మీ మధ్య’గా వ్యక్తం చేస్తుంది.
- source_word: ὡς ὁ διακονῶν
  choice: సేవ చేస్తున్నవాడిలా
  rationale: ὡς విధానం లేదా పోలికను సూచిస్తుంది; క్రియాత్మక సేవాభావాన్ని నిలుపుతూ δοῦλος అనే బానిస/దాసుడు భావాన్ని అనవసరంగా చేర్చదు.
theological_decisions:
- issue: యేసు తనను తాను సేవతో వర్ణించుకోవడం
  choice: అయితే నేను మీ మధ్య సేవ చేస్తున్నవాడిలా ఉన్నాను.
  alternative: అయితే నేను మీ మధ్య సేవకుడిగా ఉన్నాను.
  rationale: గ్రీకులో నామవాచకం కాకుండా διακονῶν అనే కృదంతం ఉంది. అందువల్ల ‘సేవ చేస్తున్నవాడు’ అనే రూపం భోజన సందర్భంలోని క్రియాత్మక విరుద్ధతను కాపాడుతుంది; బానిసత్వ హోదానో సంఘపదవినో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘వాలుకొని కూర్చున్నవారు’ అనే సహజ తెలుగు ప్రయోగంతో ప్రాచీన భోజన భంగిమను తెలియజేసి, పాదసూచికలో సాంస్కృతిక నేపథ్యాన్ని వివరించాం.
