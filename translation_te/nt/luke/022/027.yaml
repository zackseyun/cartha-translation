revisions:
- from: ఎందుకంటే, ఎవరు గొప్పవారు—భోజనానికి వాలుకొని కూర్చున్నవారా,[a] లేక సేవ చేస్తున్నవారా? భోజనానికి వాలుకొని కూర్చున్నవారే కదా? అయితే నేను మీ మధ్య సేవ చేస్తున్నవాడిలా ఉన్నాను.
  to: ఎందుకంటే, ఎవరు గొప్పవాడు—బల్ల దగ్గర భోజనం చేస్తూ వాలుకొని ఉన్నవాడా,[a] లేక సేవ చేసేవాడా? బల్ల దగ్గర భోజనం చేస్తూ వాలుకొని ఉన్నవాడే కదా? అయితే నేను మీ మధ్య సేవ చేసేవాడిగా ఉన్నాను.
  rationale: The revision retains the explanatory connection of γάρ, the social-status comparison of μείζων, and the rhetorical force of οὐχί. It uses singular representative forms corresponding to the Greek participles and replaces the potentially attenuating comparison “వాడిలా” with a role expression that naturally conveys “among you as one who serves.” The cultural footnote remains correctly anchored to the reclining-at-table expression.
