review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the rhetorical comparison, the expected affirmative answer, and Jesus' contrasting self-description. However, its plural/honorific forms blur the Greek's singular participles, and “సేవ చేస్తున్నవాడిలా ఉన్నాను” can mean that Jesus is merely like someone serving rather than that he is present among them in the role of one who serves.
  naturalness: The Telugu is generally clear, but singular forms make the paired comparison more precise and idiomatic. “బల్ల దగ్గర ... వాలుకొని ఉన్నవాడు” expresses the ancient dining posture naturally without the somewhat heavy “వాలుకొని కూర్చున్నవారు.”
  terminology: “సేవ చేసేవాడు” appropriately renders διακονῶν as a participial service term, avoiding the stronger and lexically unwarranted noun “దాసుడు.” “గొప్పవాడు” preserves the status comparison of μείζων.
  issues:
  - severity: medium
    issue: Plural/honorific forms are used for singular Greek participants.
    rationale: ὁ ἀνακείμενος and ὁ διακονῶν are singular substantival participles. The Telugu wording “వాలుకొని కూర్చున్నవారా/సేవ చేస్తున్నవారా” and the repeated plural form can be read as groups or honorific plurals, whereas the verse contrasts two representative individuals.
  - severity: medium
    issue: “సేవ చేస్తున్నవాడిలా ఉన్నాను” weakens the force of Jesus' self-description.
    rationale: 'The suffix “-లా” can suggest mere resemblance. ὡς ὁ διακονῶν identifies the manner/role in which Jesus is among them: as one serving. “సేవ చేసేవాడిగా ఉన్నాను” more directly preserves this.'
  revised_text: ఎందుకంటే, ఎవరు గొప్పవాడు—బల్ల దగ్గర భోజనం చేస్తూ వాలుకొని ఉన్నవాడా,[a] లేక సేవ చేసేవాడా? బల్ల దగ్గర భోజనం చేస్తూ వాలుకొని ఉన్నవాడే కదా? అయితే నేను మీ మధ్య సేవ చేసేవాడిగా ఉన్నాను.
