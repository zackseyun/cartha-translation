revisions:
- from: అంతేకాక, ఆయనను దూషిస్తూ ఇంకా అనేక మాటలు అన్నారు.[a][b]
  to: వారు ఆయనను[a] దూషిస్తూ[b] ఇంకా అనేక మాటలు అంటూనే ఉన్నారు.
  rationale: The revision restores the ongoing/repeated force of ἔλεγον, uses an unmarked Telugu connective rather than an overly emphatic equivalent of καὶ, and retains the lexical breadth of βλασφημοῦντες. Footnote anchors have been placed directly after the Telugu expressions corresponding to εἰς αὐτόν and βλασφημοῦντες, and the footnotes have been rewritten in idiomatic Telugu without resolving the lexical ambiguity dogmatically.
