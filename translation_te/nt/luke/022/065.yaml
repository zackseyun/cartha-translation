  text: καὶ ἕτερα πολλὰ βλασφημοῦντες ἔλεγον εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/065.yaml
  text: And they were saying many other blasphemous things against him[a][b].
translation:
  language: te
  text: వారు ఆయనను[a] దూషిస్తూ[b] ఇంకా అనేక మాటలు అంటూనే ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనకు” లేదా “ఆయన వైపుగా.” గ్రీకు పదబంధం అక్షరార్థంగా దిశను సూచిస్తుంది; ఈ సందర్భంలో ఆయనకు విరోధంగా మాట్లాడారనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నిందిస్తూ,” “అవమానిస్తూ,” లేదా “దేవదూషణపూర్వకంగా మాట్లాడుతూ.” గ్రీకు పదం విస్తృతంగా దూషణ లేదా అవమానకరమైన మాటలను సూచించగలదు; సందర్భాన్ని బట్టి మరింత బలమైన భావాన్నీ కలిగించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: అంతేకాక
  rationale: ముందటి హింసాత్మక అవమానాలకు ఈ వాక్యం మరిన్ని మాటలను జోడిస్తున్నందున, అనుసంధాన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἕτερα πολλὰ
  choice: ఇంకా అనేక మాటలు
  rationale: ఇంతకుముందు చేసినవాటితో పాటు మరెన్నో మాటలు అన్న భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: βλασφημοῦντες
  choice: దూషిస్తూ
  rationale: βλασφημέω ఇక్కడ నిందించడం, దుర్భాషలాడడం, దైవదూషణ చేయడం వంటి విస్తృత భావపరిధి కలిగి ఉంది. సందర్భంలోని శత్రుత్వపూరిత మాటలను సహజంగా తెలిపేందుకు ‘దూషిస్తూ’ ఎంచుకోబడింది; బలమైన ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: ἔλεγον
  choice: అన్నారు
  rationale: గ్రీకు అసంపూర్ణ భూతకాలం కొనసాగిన లేదా పునరావృతమైన మాటలను సూచించగలదు. ‘దూషిస్తూ ... అన్నారు’ అనే నిర్మాణం ఆ కొనసాగుతున్న చర్యను తెలుగులో సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: εἰς αὐτόν
  choice: ఆయనను
  rationale: శత్రుత్వపూరిత వాక్కుతో కూడిన εἰς αὐτόν భావాన్ని తెలుగులో ‘ఆయనను దూషిస్తూ’ అనే కర్మక నిర్మాణం సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: βλασφημοῦντες అనే పదానికి సాధారణ దూషణ భావమా, ప్రత్యేకంగా దైవదూషణ భావమా ఇవ్వాలి?
  choice: ప్రధాన పాఠ్యంలో ‘దూషిస్తూ’ అని ఉంచి, ‘దైవదూషణ చేస్తూ’ అనే బలమైన భావాన్ని పాదసూచికలో నిలుపుట
  alternative: దైవదూషణ చేస్తూ
  rationale: గ్రీకు పదం రెండూ సూచించగలదు. యేసును దూషించడం ఈ సందర్భంలో తీవ్రమైనదే అయినప్పటికీ, పదం స్వయంగా తప్పనిసరిగా సాంకేతిక అర్థంలోని దైవదూషణకే పరిమితం కాదు. అందువల్ల మూలంలోని భావసందిగ్ధతను పరిష్కరించకుండా నిలుపుతున్నాం.
- issue: εἰς αὐτόν ను ‘ఆయనతో’నా, ‘ఆయనకు విరోధంగా’నా వ్యక్తం చేయాలి?
  choice: ప్రధాన పాఠ్యంలో ‘ఆయనను దూషిస్తూ’
  alternative: ఆయనకు విరోధంగా / ఆయనతో
  rationale: εἰς యొక్క దిశార్థం ఇక్కడ శత్రుత్వపూరిత వాక్కుతో కలిసి ఉంది. తెలుగు కర్మక నిర్మాణం సందర్భార్థాన్ని సహజంగా అందిస్తుంది; మరింత అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ఆయన’ ద్వారా యేసును గౌరవసూచకంగా పేర్కొన్నాం. రెండు పాదసూచిక సూచికలూ ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
