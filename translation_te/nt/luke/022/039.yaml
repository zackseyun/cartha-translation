reference: Luke 22:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ἐπορεύθη κατὰ τὸ ἔθος εἰς τὸ Ὄρος τῶν Ἐλαιῶν· ἠκολούθησαν δὲ αὐτῷ καὶ οἱ ⸀μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/039.yaml
  text: And going out[a], he went as was his custom to the Mount of Olives, and the disciples also followed him.
translation:
  language: te
  text: ఆయన బయటికి వెళ్లి, అలవాటుచొప్పున ఒలీవల కొండకు వెళ్లాడు; శిష్యులు కూడా ఆయనను అనుసరించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθὼν
  choice: బయటికి వెళ్లి
  rationale: అనంతర ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచించే aorist participle భావాన్ని సహజమైన తెలుగు కృదంత నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: ἐπορεύθη
  choice: వెళ్లాడు
  rationale: πορεύομαι అనే సాధారణ గమన క్రియకు ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: κατὰ τὸ ἔθος
  choice: అలవాటు ప్రకారం
  rationale: గ్రీకులో వ్యక్తిని సూచించే స్వామ్యపదం లేదు; ఈ రూపం ఆ సంక్షిప్తతను నిలుపుతూ ఆచరణ అలవాటైనదని స్పష్టంగా చెబుతుంది.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ఒలీవల కొండకు
  rationale: గుర్తింపుపొందిన భౌగోళిక నామాన్ని సహజమైన తెలుగు స్థలనామ రూపంలో అందిస్తుంది.
- source_word: ἠκολούθησαν
  choice: వెంబడించారు
  rationale: ἀκολουθέωలోని ఒకరి వెనుక వెళ్లడం అనే ప్రాథమిక భావాన్ని, శిష్య సంబంధానికి అనవసరమైన వివరణ జోడించకుండా నిలుపుతుంది.
- source_word: οἱ μαθηταί
  choice: శిష్యులు
  rationale: నిర్దిష్టత సందర్భం ద్వారా స్పష్టమవుతుంది; గ్రీకులో లేని ‘ఆయన శిష్యులు’ అనే స్వామ్యభావాన్ని జోడించలేదు.
- source_word: καὶ ... δὲ ... καὶ
  choice: '... . ... కూడా'
  rationale: మొదటి రెండు సంధానాల కథన కొనసాగింపును తెలుగు వాక్య విభజనతో సహజంగా తెలిపి, చివరి καί యొక్క సముచ్చయ బలాన్ని ‘కూడా’తో నిలుపుతుంది.
theological_decisions:
- issue: ఆ అలవాటు యేసుదేనని స్వామ్యపదంతో స్పష్టీకరించాలా
  choice: ‘అలవాటు ప్రకారం’ అని మాత్రమే అనువదించడం
  alternative: ‘తన అలవాటు ప్రకారం’ లేదా ‘ఆయన అలవాటు ప్రకారం’
  rationale: సందర్భంలో అది యేసు అలవాటని స్పష్టమైనప్పటికీ, గ్రీకు పదబంధంలో స్వామ్యపదం లేదు. అందువల్ల మూలంలోని సంక్షిప్తతను కాపాడి, తెలుగులో అర్థమయ్యే రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: 'ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి. గ్రీకు వాక్యంలోని వరుస ‘వెళ్లడం’ క్రియలను ఉద్దేశపూర్వకంగా నిలిపాం: మొదటిది అక్కడి నుంచి బయటికి రావడాన్ని, రెండవది ఒలీవల కొండకు వెళ్లడాన్ని సూచిస్తుంది.'
