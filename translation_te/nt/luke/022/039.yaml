revisions:
- from: ఆయన బయటికి వెళ్లి, అలవాటు ప్రకారం ఒలీవల కొండకు వెళ్లాడు. శిష్యులు కూడా ఆయనను వెంబడించారు.
  to: ఆయన బయటికి వెళ్లి, అలవాటుచొప్పున ఒలీవల కొండకు వెళ్లాడు; శిష్యులు కూడా ఆయనను అనుసరించారు.
  rationale: The sole substantive change replaces a potentially misleading Telugu verb with the ordinary neutral verb for following. ‘అలవాటుచొప్పున’ keeps the source’s concise customary sense without making ‘his’ explicit. No footnote is required because no disputed or materially alternative rendering is introduced.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T01:34:47Z'
review_pass:
  verdict: revise
  source_fidelity: ‘వెంబడించారు’ can denote pursuing or chasing someone in modern Telugu, which is unsuitable as the unmarked rendering of ἠκολούθησαν in this narrative. ‘అనుసరించారు’ accurately conveys that the disciples followed him. ‘అలవాటుచొప్పున’ naturally represents κατὰ τὸ ἔθος without adding an explicit possessive.
  naturalness: The revision is fluent modern standard Telugu. Retaining the two distinct movement actions (‘బయటికి వెళ్లి’ / ‘కొండకు వెళ్లాడు’) preserves the Greek narrative sequence, while a semicolon keeps the related clauses in one sentence.
  terminology: ‘ఒలీవల కొండ’ is an established and recognizable Telugu form for the Mount of Olives. ‘శిష్యులు’ appropriately renders μαθηταί. ‘అనుసరించారు’ is the natural neutral narrative equivalent of ἀκολουθέω here.
  issues:
  - severity: medium
    issue: ‘వెంబడించారు’ for ἠκολούθησαν
    rationale: In current Telugu, ‘వెంబడించు’ commonly carries the sense of chase, pursue, or persecute. The Greek simply states that the disciples followed Jesus; ‘అనుసరించారు’ avoids the unintended hostile nuance.
  revised_text: ఆయన బయటికి వెళ్లి, అలవాటుచొప్పున ఒలీవల కొండకు వెళ్లాడు; శిష్యులు కూడా ఆయనను అనుసరించారు.
  revised_footnotes: []
  revision_rationale: The sole substantive change replaces a potentially misleading Telugu verb with the ordinary neutral verb for following. ‘అలవాటుచొప్పున’ keeps the source’s concise customary sense without making ‘his’ explicit. No footnote is required because no disputed or materially alternative rendering is introduced.
