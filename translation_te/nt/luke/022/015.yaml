source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Ἐπιθυμίᾳ ἐπεθύμησα τοῦτο τὸ πάσχα φαγεῖν μεθ’ ὑμῶν πρὸ τοῦ με παθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/015.yaml
  text: And he said to them[b][a], “I have earnestly desired to eat this Passover with you before I suffer.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “నేను బాధలు అనుభవించకముందు, మీతో కలిసి ఈ పస్కా భోజనం[b] చేయాలని ఎంతో ఆత్రంగా కోరుకున్నాను.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “కోరికతో కోరుకున్నాను”; యేసు కోరిక తీవ్రతను నొక్కిచెప్పడానికి గ్రీకులో ఒకే మూలానికి చెందిన నామవాచకాన్ని, క్రియను కలిపి వాడారు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఈ పస్కా”; ఇక్కడ అది ప్రత్యేకంగా పస్కా భోజనాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτούς
  choice: ఆయన వారితో ఇలా అన్నాడు
  rationale: πρός + కర్మవిభక్తితో కూడిన సాధారణ సంభాషణా సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: Ἐπιθυμίᾳ ἐπεθύμησα
  choice: ఎంతో ఆత్రంగా కోరుకున్నాను
  rationale: ఒకే మూలానికి చెందిన నామవాచకం, క్రియ కలిసి కోరిక తీవ్రతను నొక్కిచెప్పే గ్రీకు నిర్మాణం. పదేపదే అనువదించి అసహజత కలిగించకుండా, దాని బలాన్ని ఈ తెలుగు ప్రయోగం నిలుపుతుంది.
- source_word: τοῦτο τὸ πάσχα
  choice: ఈ పస్కా భోజనం
  rationale: πάσχα పండుగను లేదా పస్కా భోజనాన్ని సూచించగలదు. ఇక్కడ φαγεῖν (‘తినడం’) ఉండడంతో భోజనమే తక్షణ సందర్భం; అందువల్ల తెలుగులో స్పష్టత, సహజత్వం కోసం ‘భోజనం’ చేర్చబడింది.
- source_word: φαγεῖν
  choice: భోజనం చేయాలని
  rationale: తెలుగులో ‘భోజనం చేయడం’ అంటే భోజనం తినడం అనే సహజమైన ప్రయోగం; గ్రీకు క్రియ అర్థాన్ని సరళంగా అందిస్తుంది.
- source_word: μεθ’ ὑμῶν
  choice: మీతో కలిసి
  rationale: సహవాసాన్ని సూచించే గ్రీకు పదబంధానికి నేరమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: πρὸ τοῦ με παθεῖν
  choice: నేను బాధలు అనుభవించకముందు
  rationale: πρόతో కూడిన articular infinitive ముందరి కాలాన్ని సూచిస్తుంది. πάσχωను రాబోయే బాధలుగా సహజమైన తెలుగులో వ్యక్తపరుస్తూ, సంఘటనలను అవసరానికి మించి నిర్దిష్టపరచదు.
theological_decisions:
- issue: ఈ సందర్భంలో πάσχα అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘ఈ పస్కా భోజనం’
  alternative: ఈ పస్కా
  rationale: గ్రీకులో అక్షరార్థంగా ‘ఈ పస్కా’ ఉన్నప్పటికీ, ‘తినడం’ అనే క్రియ వల్ల ఇక్కడ పస్కా భోజనం ఉద్దేశించబడిందని సందర్భం చూపుతుంది. ‘భోజనం’ అనేది సిద్ధాంతపరమైన విస్తరణ కాకుండా తెలుగులో భావాన్ని స్పష్టంగా చెప్పే సందర్భోచిత పదం; మూలరూపం పాదసూచికలో ఇవ్వబడింది.
- issue: Ἐπιθυμίᾳ ἐπεθύμησα యొక్క నొక్కి చెప్పే బలం
  choice: ఎంతో ఆత్రంగా కోరుకున్నాను
  alternative: కోరికతో కోరుకున్నాను
  rationale: యేసు తన బాధలకు ముందు వ్యక్తం చేసిన బలమైన కోరికను నిలుపుతూ, గ్రీకు cognate construction‌ను తెలుగులో కృత్రిమంగా పునరుత్పత్తి చేయకుండా సహజంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘పస్కా’ అనే బైబిలు-చారిత్రక పదాన్ని నిలుపుతూ, తక్షణ భోజన సందర్భాన్ని సహజంగా స్పష్టం చేసింది.
