id: LUK.22.48
reference: Luke 22:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂Ἰησοῦς δὲ⸃ εἶπεν αὐτῷ· Ἰούδα, φιλήματι τὸν υἱὸν τοῦ ἀνθρώπου παραδίδως;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/048.yaml
  text: But Jesus said to him[a], “Judas, are you betraying the Son of Man with a kiss?”
translation:
  language: te
  text: అయితే యేసు అతనితో, “యూదా, ముద్దుతో మనుష్యకుమారుణ్ణి అప్పగిస్తున్నావా?[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ముద్దుతో మనుష్యకుమారుణ్ణి ద్రోహంగా అప్పగిస్తున్నావా?”
    reason: παραδίδως అనే పదానికి ఈ సందర్భంలో ఉన్న బలమైన ద్రోహార్థాన్ని ప్రత్యామ్నాయంగా తెలియజేయడం; మూలపాఠంలోని ప్రత్యక్ష కర్మను నిలుపుతుంది.
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: δέ స్వల్ప అనుసంధాన పదం; సందర్భంలో యూదా చర్యకు యేసు స్పందనను సూచించే మృదువైన వ్యతిరేక భావాన్ని ‘అయితే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἶπεν αὐτῷ
  choice: అతనితో ... అన్నాడు
  rationale: αὐτῷ అనే స్పష్టమైన దత్తివ సర్వనామాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజమైన ప్రత్యక్ష సంభాషణ నిర్మాణాన్ని వాడింది.
- source_word: Ἰούδα
  choice: యూదా
  rationale: సంబోధన విభక్తిలో ఉన్న వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు నామరూపంలో ఇచ్చింది.
- source_word: φιλήματι
  choice: ముద్దుతో
  rationale: కరణార్థక దత్తివాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేసి, నిర్దిష్టమైన చర్యను యథాతథంగా నిలుపుతుంది.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుణ్ణి
  rationale: యేసు తనను గురించి వాడిన స్థిరమైన బిరుదును, దాని దానియేలు గ్రంథ సంబంధ ప్రతిధ్వనితో సహా, సంప్రదాయబద్ధమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: παραδίδως
  choice: అప్పగిస్తున్నావా
  rationale: వర్తమాన కాలంలోని తక్షణ చర్యను చూపుతుంది; ‘ద్రోహం చేస్తున్నావా’ అనే సందర్భార్థాన్ని బలవంతంగా ముందుకు తేవకుండా, గ్రీకు పదంలోని ‘అప్పగించు’ మరియు ‘ద్రోహంగా అప్పగించు’ భావాల మధ్య ఉద్వేగాన్ని కాపాడుతుంది.
theological_decisions:
- issue: τὸν υἱὸν τοῦ ἀνθρώπου అనువాదం
  choice: మనుష్యకుమారుడు
  alternative: మానవ కుమారుడు / మానవుడు
  rationale: ఇది సువార్తల్లో యేసు తనను సూచించుకోవడానికి వాడిన క్రీస్తుసంబంధ బిరుదు. ‘మనుష్యకుమారుడు’ గ్రీకు నిర్మాణాన్నీ, దాని అంతర్గ్రంథ ప్రాధాన్యాన్నీ వ్యాఖ్యానంతో చదును చేయకుండా కాపాడుతుంది.
- issue: παραδίδως లోని నైతిక భావఛాయ
  choice: అప్పగిస్తున్నావా
  alternative: ద్రోహం చేస్తున్నావా
  rationale: సందర్భం ద్రోహాన్ని స్పష్టంగా సూచించినా, మూల క్రియ ప్రాథమికంగా ‘అప్పగించు’ అని కూడా అర్థమిస్తుంది. ప్రధాన పాఠంలో దాని పదబంధ సంబంధాన్ని నిలిపి, బలమైన సందర్భార్థాన్ని పాదటిప్పణిలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే సహజమైన వాక్యనిర్మాణంతో పాటు గంభీరతను నిలిపింది. ప్రశ్నలోని గద్దింపు స్వరాన్ని అదనపు వ్యాఖ్యానం లేకుండా కాపాడింది.
