source:
  edition: SBLGNT
  text: εἶπαν δὲ πάντες· Σὺ οὖν εἶ ὁ υἱὸς τοῦ θεοῦ; ὁ δὲ πρὸς αὐτοὺς ἔφη· Ὑμεῖς λέγετε ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/070.yaml
  text: Then they all said[a], “So you are the Son of God?” And he said to them, “You say that I am.”
translation:
  language: te
  text: అప్పుడు వారందరూ, “అయితే నీవు దేవుని కుమారుడివా?” అన్నారు. ఆయన వారితో, “నేనే అని మీరే అంటున్నారు” అన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత నుడికారంగా, “మీరే అలా అంటున్నారు” లేదా “మీరు అన్నట్టే” అని అనువదించవచ్చు. సందర్భంలో యేసు మాటలు అంగీకార సమాధానంగా పనిచేస్తాయి; అయితే గ్రీకులో అక్షరార్థంగా, “నేనే అని మీరే అంటున్నారు” అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: వారందరూ
  rationale: ఈ విశేషణం నామవాచకంగా పనిచేసి, అక్కడున్న సమూహమంతటినీ సూచిస్తుంది; ‘వారందరూ’ ఆ సమష్టి భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: οὖν
  choice: అయితే
  rationale: ముందటి సంభాషణనుంచి వారు తీసుకున్న నిర్ధారణను ప్రశ్నగా ఉంచుతున్నారు; ఈ సందర్భంలో ‘అయితే’ ఆ అనుమానాత్మక-నిర్ధారణ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: దేవుని కుమారుడు
  rationale: ఇది క్రీస్తును సూచించే బిరుదు; మూలంలోని గంభీరతను, నిర్దిష్టతను నిలుపుతుంది.
- source_word: ἔφη
  choice: అన్నాడు
  rationale: సందర్భంలో ప్రత్యేకమైన క్రియాభావాన్ని బలపరచాల్సిన అవసరం లేదు; సాధారణ సంభాషణకు ‘అన్నాడు’ సహజమైన సమానం.
- source_word: Ὑμεῖς
  choice: మీరే
  rationale: మూలంలో సర్వనామం స్పష్టంగా ఉండటం వల్ల కలిగే ఉద్ఘాటనను ‘మీరే’ తెలియజేస్తుంది; మాటను ప్రశ్నించినవారివైపే తిరిగి ఉంచుతుంది.
- source_word: λέγετε
  choice: అంటున్నారు
  rationale: వర్తమానకాల బహువచన క్రియను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὅτι
  choice: అని
  rationale: వారు చెప్పిన మాటలోని విషయాన్ని పరిచయం చేసే మూలంలోని conjunction‌కు ‘అని’ సహజమైన తెలుగు సమానం.
- source_word: ἐγώ εἰμι
  choice: నేనే
  rationale: తెలుగులో అసంపూర్ణంగా వినిపించే ‘నేను ఉన్నాను’ అనే అక్షరానువాదాన్ని నివారిస్తూ, సందర్భంలో ‘ఆ వ్యక్తిని నేనే’ అనే సంక్షిప్త భావాన్ని నిలుపుతుంది; సమాధానాన్ని విస్తరించి స్పష్టమైన ఒప్పుకోలుగా మార్చదు.
theological_decisions:
- issue: యేసు సమాధానాన్ని స్పష్టమైన ఒప్పుకోలుగా అనువదించాలా, లేక మూలంలోని పరోక్షమైన రూపాన్ని నిలుపాలా
  choice: “నేనే అని మీరే అంటున్నారు” అని మూల నిర్మాణానికి దగ్గరగా ఉంచడం
  alternative: “మీరు అన్నట్టే” లేదా “అవును, నేనే దేవుని కుమారుణ్ణి”
  rationale: సందర్భంలో ఈ మాట అంగీకార సమాధానంగా పనిచేసినా, గ్రీకు వాక్యం మాటను ప్రశ్నించినవారివైపు తిరిగి ఉంచుతుంది. అందువల్ల దాని వాక్చాతుర్యాన్ని, దైవశాస్త్రీయ ఉద్రిక్తతను ప్రధాన పాఠంలో నిలిపి, సహజమైన ప్రత్యామ్నాయాలను అధస్సూచనలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన సంభాషణ శైలిని వాడాం. ప్రశ్నలో ‘అయితే’ ద్వారా తార్కిక నిర్ధారణను, సమాధానంలో ‘మీరే’ ద్వారా మూలంలోని ఉద్ఘాటనను నిలిపాం.
