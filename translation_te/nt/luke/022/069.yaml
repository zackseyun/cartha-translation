id: LUK.22.69
reference: Luke 22:69
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπὸ τοῦ νῦν ⸀δὲ ἔσται ὁ υἱὸς τοῦ ἀνθρώπου καθήμενος ἐκ δεξιῶν τῆς δυνάμεως τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/069.yaml
  text: But from now on the Son of Man will be seated at the right hand of the power of God[a].
translation:
  language: te
  text: అయితే ఇకనుండి మనుష్యకుమారుడు దేవుని శక్తి కుడిపార్శ్వాన ఆసీనుడై ఉంటాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శక్తి కుడిపార్శ్వాన.” ఇక్కడ ‘శక్తి’ దేవునికి భక్తిపూర్వక సూచనగా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τοῦ νῦν
  choice: ఇప్పటి నుండి
  rationale: ముందుకు కొనసాగే కాలస్థితికి ఆరంభబిందువును సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: δὲ
  choice: అయితే
  rationale: యేసు జవాబులోని వ్యత్యాసాన్ని, తదుపరి మలుపును సహజంగా తెలియజేస్తుంది.
- source_word: ἔσται
  choice: ఉంటాడు
  rationale: రాబోయే మహిమాస్థితిని సూచించే εἰμί భవిష్యద్రూపాన్ని నేరుగా వ్యక్తపరుస్తుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: యేసు వాడిన స్థిరమైన స్వీయనామాన్ని, దానియేలు గ్రంథసంబంధ ప్రతిధ్వనిని మరియు దాని భావవిస్తృతిని కాపాడే సాహిత్యానుకూల పదబంధం.
- source_word: καθήμενος
  choice: ఆసీనుడై
  rationale: కేవలం కూర్చోవడం కాకుండా రాజాధికారంతో సింహాసనస్థుడై ఉండే భావాన్ని గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
- source_word: ἐκ δεξιῶν
  choice: కుడిపక్కన
  rationale: అత్యున్నత గౌరవం, అధికార స్థానాన్ని సూచించే బైబిలీయ ప్రయోగాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: τῆς δυνάμεως
  choice: శక్తి
  rationale: δύναμις అనే సాధారణ నామవాచకానికి నేరమైన అనువాదం; దేవుని అధికారశక్తి అనే భావాన్ని తదనంతర షష్ఠీవిభక్తి స్పష్టం చేస్తుంది.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: ఆ శక్తి ఎవరిదో గ్రీకు మూలంలోని షష్ఠీవిభక్తి ప్రకారం స్పష్టంగా తెలుపుతుంది.
theological_decisions:
- issue: మహిమపరచబడిన మనుష్య కుమారుని దైవాధికార స్థానాన్ని వ్యక్తపరచడం
  choice: మనుష్య కుమారుడు దేవుని శక్తి కుడిపక్కన ఆసీనుడై ఉంటాడు
  alternative: మనుష్య కుమారుడు ‘శక్తి’ కుడిపక్కన ఆసీనుడై ఉంటాడు
  rationale: ప్రధాన పాఠం గ్రీకులోని ‘దేవుని శక్తి’ అనే పూర్తి పదబంధాన్ని నిలుపుతూ, కీర్తన 110 మరియు దానియేలు 7 ప్రతిధ్వనించే గౌరవాధికార స్థానాన్ని అతివ్యాఖ్యానం చేయకుండా వ్యక్తపరుస్తుంది. ‘శక్తి’ దేవునికి భక్తిపూర్వక పర్యాయసూచన కావచ్చనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన బైబిలీయ శైలి. ‘ఆసీనుడై’ అనే పదం రాజాధికార భావాన్ని కాపాడుతుంది; పాదటిప్పణి గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
