source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, ⸀οὐ μὴ πίω ἀπὸ τοῦ ⸂νῦν ἀπὸ τοῦ⸃ γενήματος τῆς ἀμπέλου ἕως ⸀οὗ ἡ βασιλεία τοῦ θεοῦ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/018.yaml
  text: For I tell you[a], from now on I will certainly not drink from the fruit of the vine until the kingdom of God comes.
translation:
  language: te
  text: 'ఎందుకంటే నేను మీతో చెబుతున్నాను: ఇకపై దేవుని రాజ్యం వచ్చేవరకు ద్రాక్షావల్లి ఫలం నుండి నేను అసలు తాగను.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ద్రాక్షామద్యం.’ గ్రీకులో అక్షరార్థంగా ‘ద్రాక్షావల్లి ఫలం’ అని ఉంది; సాధారణంగా ద్రాక్షామద్యం అని చెప్పే పదం వాడబడలేదు. ఈ వ్యక్తీకరణ పానపాత్రలోని దానినే సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: ఎందుకంటే నేను మీతో చెబుతున్నాను
  rationale: γάρ ముందున్న మాటతో ఉన్న వివరణాత్మక సంబంధాన్ని చూపుతుంది; λέγω ὑμῖν అనే ప్రత్యక్ష సంబోధన సూత్రానికి ఇది సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: οὐ μὴ πίω
  choice: నేను అసలు తాగను
  rationale: οὐ μή తో కూడిన aorist subjunctive బలమైన భవిష్యత్ నిరాకరణను వ్యక్తం చేస్తుంది. ‘అసలు తాగను’ ఆ ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది; తరువాతి ‘వరకు’ దాని కాలపరిమితిని తెలియజేస్తుంది.
- source_word: ἀπὸ τοῦ νῦν
  choice: ఇప్పటినుంచి
  rationale: ప్రస్తుత క్షణం మొదలుకొని అనే కాలారంభ భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ τοῦ γενήματος τῆς ἀμπέλου
  choice: ద్రాక్షావల్లి ఫలరసాన్ని
  rationale: γένημα అంటే పుట్టినది లేదా ఫలం. పానపాత్ర సందర్భంలో తెలుగులో ‘ఫలరసం’ సహజంగా దానిలోని పానీయాన్ని సూచిస్తుంది; అయితే మూలంలోని విస్తృతమైన ‘ద్రాక్షావల్లి ఫలం’ అనే భావాన్ని ‘ద్రాక్షారసం’ లేదా ‘ద్రాక్షామద్యం’గా అతిగా నిర్దిష్టం చేయదు.
- source_word: ἕως οὗ
  choice: వరకు
  rationale: నిరాకరణకు భవిష్యత్ కాలపరిమితిని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: ‘రాజ్యం’ అనే పదం βασιλεία లోని రాజపాలన మరియు రాజ్య సంబంధిత భావాలు రెండింటినీ తెరిచి ఉంచుతూ సువార్తలలోని స్థిరమైన పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: ἔλθῃ
  choice: వచ్చేవరకు
  rationale: ἕως οὗ తరువాతి భవిష్యదర్థక aorist subjunctive ను తెలుగులో సహజమైన కాలసంబంధ క్రియారూపంతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: γενήματος τῆς ἀμπέλου ను ‘ద్రాక్షామద్యం’గా చెప్పాలా, లేక మూలంలోని విస్తృతమైన వ్యక్తీకరణను నిలుపాలా
  choice: ద్రాక్షావల్లి ఫలరసం
  alternative: ద్రాక్షామద్యం; ద్రాక్షావల్లి ఫలం
  rationale: గ్రీకు పదబంధం సాధారణ ‘ద్రాక్షామద్యం’ అనే పదాన్ని వాడకుండా ద్రాక్షావల్లి ఉత్పత్తిని సూచిస్తుంది. ప్రధాన పాఠంలో పానపాత్రలోని ద్రవాన్ని సహజంగా సూచిస్తూ, పాదసూచికలో మరింత అక్షరార్థాన్ని తెలియజేయడం మూలాన్ని అతిగా సంకుచితం చేయదు.
- issue: దేవుని రాజ్యం రావడం ఏ దశను లేదా విధానాన్ని సూచిస్తుందో అనువాదంలో నిర్దిష్టం చేయాలా
  choice: దేవుని రాజ్యం వచ్చేవరకు
  alternative: దేవుని రాజ్యం సంపూర్ణంగా వచ్చేవరకు; దేవుని పరిపాలన స్థాపించబడేవరకు
  rationale: మూలపాఠం భవిష్యత్ కాలపరిమితిని చెబుతుంది గాని, రాజ్యం రావడంలోని ఖచ్చితమైన దశను లేదా విధానాన్ని వివరించదు. కాబట్టి ఆ అంత్యకాల సంబంధిత ఉద్వేగాన్ని పరిష్కరించకుండా అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన వాక్య నిర్మాణం. బలమైన నిరాకరణకు ‘అసలు’ వాడబడింది. మూలంలోని పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, ‘ఇప్పటినుంచి ... వచ్చేవరకు’ అనే సహజ తెలుగు కాలచట్రం ఉపయోగించబడింది.
