id: LUK.22.36
reference: Luke 22:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ αὐτοῖς· Ἀλλὰ νῦν ὁ ἔχων βαλλάντιον ἀράτω, ὁμοίως καὶ πήραν, καὶ ὁ μὴ ἔχων ⸀πωλησάτω τὸ ἱμάτιον αὐτοῦ καὶ ⸀ἀγορασάτω μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/036.yaml
  text: But now[a], let the one who has a money bag take it, and likewise a travel bag[b]; and let the one who does not have one sell his cloak and buy a sword.
translation:
  language: te
  text: 'అయితే ఆయన వారితో ఇలా అన్నాడు: “కానీ ఇప్పుడు, డబ్బు సంచి ఉన్నవాడు దానిని తీసుకెళ్లాలి; అలాగే ప్రయాణ సంచినీ తీసుకెళ్లాలి. కత్తి లేనివాడు తన పైవస్త్రాన్ని అమ్మి ఒక కత్తి కొనాలి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλλὰ νῦν
  choice: కానీ ఇప్పుడు
  rationale: మునుపటి ఆదేశాలకు ఇప్పటి పరిస్థితిని బలంగా వ్యతిరేకంగా చూపే ἀλλά యొక్క భావాన్నీ, νῦν యొక్క కాలసూచననూ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: βαλλάντιον
  choice: డబ్బు సంచి
  rationale: డబ్బు పెట్టుకొని తీసుకెళ్లే సంచిని స్పష్టంగా సూచిస్తుంది; ఆధునిక పాఠకులకు సహజంగా అర్థమవుతుంది.
- source_word: ἀράτω
  choice: తీసుకెళ్లాలి
  rationale: ప్రయాణానికి వెంట తీసుకొని వెళ్లడం అనే సందర్భానుగుణ భావాన్ని వ్యక్తం చేస్తూ ఆజ్ఞార్థక బలాన్ని నిలుపుతుంది.
- source_word: πήραν
  choice: ప్రయాణ సంచి
  rationale: ప్రయాణికుడు సామాను లేదా ఆహారం తీసుకెళ్లే సంచి అనే కార్యాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘సంచి’ అనే విస్తృత అర్థాన్ని పాదటిప్పణి సూచిస్తుంది.
- source_word: ὁ μὴ ἔχων
  choice: కత్తి లేనివాడు
  rationale: గ్రీకులో కర్మ తెలుపకపోయినా, వెంటనే వచ్చే ‘కత్తి కొనాలి’ అనే ఆజ్ఞ దృష్ట్యా తెలుగులో అవసరమైన కర్మను సందర్భానుసారంగా సరఫరా చేస్తుంది.
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: తన పైవస్త్రాన్ని
  rationale: ἱμάτιον సాధారణంగా బయట ధరించే ముఖ్యమైన వస్త్రాన్ని సూచిస్తుంది; ‘పైవస్త్రం’ చారిత్రక రూపాన్ని అతిగా నిర్దిష్టం చేయకుండా భావాన్ని అందిస్తుంది.
- source_word: μάχαιραν
  choice: కత్తి
  rationale: μάχαιρα ఖడ్గాన్నీ, పొట్టి కత్తి వంటి ఆయుధాన్నీ సూచించగలదు. తెలుగు ‘కత్తి’ ఈ అర్థపరిధిని అవసరానికి మించి కుదించకుండా సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: కత్తి కొనాలనే యేసు ఆజ్ఞను రూపకంగా మార్చాలా లేదా దాని ప్రత్యక్ష పదబలాన్ని నిలుపాలా
  choice: ‘ఒక కత్తి కొనాలి’ అని ప్రత్యక్షంగా అనువదించడం
  alternative: ‘ప్రమాదానికి సిద్ధపడాలి’ వంటి రూపకార్థ వివరణను వచనంలో చేర్చడం
  rationale: మూలపాఠంలో μάχαιρα అనే స్పష్టమైన నామవాచకంతో ప్రత్యక్ష ఆజ్ఞ ఉంది. ఇది అక్షరార్థమా, సందర్భోచిత సంకేతమా అనే వ్యాఖ్యాన సమస్యను అనువాదం ముందుగానే పరిష్కరించకుండా వచనంలోని ఉద్రిక్తతను నిలుపుతుంది.
- issue: ὁ μὴ ἔχων లో చెప్పని కర్మను ఎలా చూపాలి
  choice: తరువాతి ఆజ్ఞ ఆధారంగా ‘కత్తి లేనివాడు’ అని స్పష్టం చేయడం
  alternative: ‘లేనివాడు’ అని మాత్రమే ఉంచి గ్రీకు సంక్షిప్తతను యథాతథంగా అనుకరించడం
  rationale: తెలుగులో కర్మ లేకుండా ‘లేనివాడు’ అనడం అతనికి ఏమీ లేదనే విస్తృతమైన, తప్పుదారి పట్టించే భావాన్ని కలిగించవచ్చు. తరువాత వచ్చే ‘కత్తి కొనాలి’ అనే మాట వల్ల ‘కత్తి’ సహజంగా గ్రహించబడుతుంది; దీనితో హింస గురించిన విస్తృత వ్యాఖ్యానాన్ని మాత్రం జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం ఉపయోగించబడింది. రెండు సంచుల విషయంలోని సమాంతర నిర్మాణాన్ని సహజమైన తెలుగులో స్పష్టం చేశాం; కత్తి గురించిన ఆజ్ఞను మెత్తబరచకుండా లేదా తీవ్రతరం చేయకుండా మూలపాఠపు ప్రత్యక్షతను నిలిపాం.
