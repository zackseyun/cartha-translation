review_pass:
  verdict: revise
  source_fidelity: The draft conveys the arrest/custody, movement to the high priest’s house, and Peter’s continuing following. However, «కొంత దూరంగా» adds a minimizing/quantifying nuance (‘a little/some distance’) not present in μακρόθεν, which simply denotes distance or ‘from afar.’
  naturalness: The draft is generally clear modern Telugu. Recasting the two movement verbs as ‘నడిపించి’ and ‘లోపలికి తీసుకువెళ్లారు’ gives a more natural distinction between ἤγαγον and εἰσήγαγον, while ‘దూరం నుంచే వెంబడిస్తూ ఉన్నాడు’ naturally expresses the continuing action.
  terminology: ‘ప్రధాన యాజకుడు’ is appropriate for ἀρχιερεύς, and ‘పేతురు’ is the established Telugu form. ‘అదుపులోకి తీసుకొని’ accurately conveys the custodial sense of Συλλαβόντες without importing interpretation.
  issues:
  - severity: low
    issue: ‘కొంత దూరంగా’ adds an unwarranted degree/quantity.
    rationale: μακρόθεν means ‘at/from a distance’ or ‘afar’; it does not specify that the distance was only ‘some’ or ‘a little.’
  revised_text: వారు ఆయనను అదుపులోకి తీసుకొని, నడిపించి, ప్రధాన యాజకుని ఇంట్లోకి తీసుకువెళ్లారు; అయితే పేతురు దూరం నుంచే[a] వెంబడిస్తూ ఉన్నాడు.
