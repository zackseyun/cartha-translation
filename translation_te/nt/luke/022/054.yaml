revisions:
- from: వారు ఆయనను పట్టుకొని తీసుకెళ్లి, ప్రధాన యాజకుని ఇంట్లోకి తీసుకువచ్చారు. అయితే పేతురు కొంత దూరంగా[a] వెంబడిస్తూ వచ్చాడు.
  to: వారు ఆయనను అదుపులోకి తీసుకొని, నడిపించి, ప్రధాన యాజకుని ఇంట్లోకి తీసుకువెళ్లారు; అయితే పేతురు దూరం నుంచే[a] వెంబడిస్తూ ఉన్నాడు.
  rationale: ‘కొంత’ను తొలగించి మూలంలోని నిర్దిష్టం కాని దూరభావాన్ని నిలుపాము. ‘నడిపించి’ మరియు ‘ఇంట్లోకి తీసుకువెళ్లారు’ వరుసగా ἤγαγον, εἰσήγαγονలలోని సాధారణంగా నడిపించడం మరియు లోపలికి తీసుకెళ్లడం అనే వ్యత్యాసాన్ని సహజ తెలుగు కథనశైలిలో తెలియజేస్తాయి. ‘వెంబడిస్తూ ఉన్నాడు’ అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న చర్యను, ఎలాంటి ఉద్దేశం లేదా మనోభావాన్ని జోడించకుండా, కాపాడుతుంది.
