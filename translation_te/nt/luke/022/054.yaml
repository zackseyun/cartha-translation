id: LUK.22.54
reference: Luke 22:54
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Συλλαβόντες δὲ αὐτὸν ἤγαγον καὶ ⸀εἰσήγαγον εἰς ⸂τὴν οἰκίαν⸃ τοῦ ἀρχιερέως· ὁ δὲ Πέτρος ἠκολούθει μακρόθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/054.yaml
  text: After arresting him[a], they led him away and brought him into the high priest’s house; but Peter was following at a distance.
translation:
  language: te
  text: వారు ఆయనను అదుపులోకి తీసుకొని, నడిపించి, ప్రధాన యాజకుని ఇంట్లోకి తీసుకువెళ్లారు; అయితే పేతురు దూరం నుంచే[a] వెంబడిస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దూరంగా”; సంప్రదాయంగా, “దూరాన.”
    reason: మాక్రోథెన్ (μακρόθεν) అనే క్రియావిశేషణానికి సాధ్యమైన సహజ తెలుగు ప్రత్యామ్నాయాలను తెలియజేయడం.
lexical_decisions:
- source_word: Συλλαβόντες
  choice: పట్టుకొని
  rationale: సυλλαμβάνω ఇక్కడ యేసును అదుపులోకి తీసుకోవడాన్ని సూచిస్తుంది. తెలుగు కథనశైలిలో ‘పట్టుకొని’ సహజంగా ఉండి, ప్రధాన క్రియలకు ముందుగా జరిగిన చర్యను తెలియజేస్తుంది.
- source_word: ἤγαγον
  choice: తీసుకెళ్లి
  rationale: ἄγω సూచించే అదుపులో నడిపించుకొని వెళ్లే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; తరువాతి ‘ఇంట్లోకి తీసుకువచ్చారు’ అనే దిశాసూచక క్రియతో తేడాను నిలుపుతుంది.
- source_word: εἰσήγαγον
  choice: ఇంట్లోకి తీసుకువచ్చారు
  rationale: εἰσάγωలోని లోపలికి తీసుకురావడం అనే దిశాభావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: οἰκίαν
  choice: ఇంటి
  rationale: οἰκία ఇక్కడ భౌతిక నివాస స్థలాన్ని సూచిస్తుంది; ‘ఇల్లు’ ఆధునిక తెలుగులో నేరుగా, సహజంగా ఉంటుంది.
- source_word: ἀρχιερέως
  choice: ప్రధాన యాజకుని
  rationale: ἀρχιερεύςకు స్థిరమైన, అర్థస్పష్టమైన తెలుగు సమానార్థకం ‘ప్రధాన యాజకుడు.’
- source_word: ἠκολούθει
  choice: వెంబడిస్తూ వచ్చాడు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న చర్యను ‘వెంబడిస్తూ వచ్చాడు’ సహజమైన తెలుగు కథనరీతిలో వ్యక్తం చేస్తుంది.
- source_word: μακρόθεν
  choice: కొంత దూరంగా
  rationale: స్థలపరమైన దూరాన్ని స్పష్టంగా తెలుపుతుంది. ‘కొంత’ మూలంలో ఖచ్చితమైన దూరం చెప్పలేదనే విషయాన్ని సహజంగా ప్రతిబింబిస్తుంది; ప్రత్యామ్నాయ రూపాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: δὲ
  choice: అయితే
  rationale: యేసును లోపలికి తీసుకువెళ్లడం మరియు పేతురు దూరంగా వెంబడించడం మధ్యనున్న స్వల్ప వ్యత్యాసాన్ని సహజంగా చూపిస్తుంది.
theological_decisions:
- issue: అరెస్టు సమయంలో యేసుతో పేతురుకు ఉన్న సంబంధాన్ని కథనం ఎలా వర్ణిస్తుంది
  choice: ‘వెంబడిస్తూ వచ్చాడు’ అని మాత్రమే అనువదించి, అతని ఉద్దేశం లేదా మనోభావంపై తీర్పు చెప్పలేదు.
  alternative: ‘భయంతో వెంబడించాడు’ లేదా ‘రహస్యంగా వెంబడించాడు’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం.
  rationale: వచనం పేతురు భౌతికంగా కొంత దూరం పాటిస్తూ వెంబడించాడని చెబుతుంది; అతని ప్రేరణను స్పష్టంగా వివరించదు. అందువల్ల కథనంలోని ఉద్విగ్నతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. మూలంలోని వరుస కదలికలను, పేతురు కొనసాగిస్తూ వెంబడించిన భావాన్ని నిలుపుతూ అనవసరమైన మానసిక లేదా సిద్ధాంతపరమైన వ్యాఖ్యానాన్ని చేర్చలేదు.
