- from: పస్కా అని పిలిచే పులియని రొట్టెల పండుగ[a] సమీపిస్తూ ఉంది.
  to: పస్కా అని పిలువబడే పులియని రొట్టెల పండుగ[a] సమీపిస్తోంది.
  rationale: 'The revision makes two minor idiomatic improvements only: it uses the natural passive attributive form for “which is called” and a smoother narrative expression for “was drawing near.” The source’s explanatory association of Passover with the Feast of Unleavened Bread, including its historical ambiguity, remains intact. The footnote is lightly smoothed for natural Telugu without changing its content.'
