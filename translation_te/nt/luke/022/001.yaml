id: LUK.22.1
reference: Luke 22:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἤγγιζεν δὲ ἡ ἑορτὴ τῶν ἀζύμων ἡ λεγομένη Πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/001.yaml
  text: The Feast of Unleavened Bread[a], which is called Passover, was drawing near.
translation:
  language: te
  text: పస్కా అని పిలువబడే పులియని రొట్టెల పండుగ[a] సమీపిస్తోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పస్కా పండుగకు, పులియని రొట్టెల పండుగకు సన్నిహిత సంబంధం ఉంది. యూదుల వాడుకలో వాటిని కలిపి ప్రస్తావించడం లేదా ఒకదానితో మరొకటి అతివ్యాప్తి చెందే పేర్లతో పిలవడం జరిగేది.
    reason: cultural_note
lexical_decisions:
- source_word: Ἤγγιζεν
  choice: సమీపిస్తూ ఉంది
  rationale: అసంపూర్ణ భూతకాల రూపం పండుగ క్రమంగా సమీపిస్తున్న భావాన్ని తెలియజేస్తుంది; తెలుగు కథనశైలిలో ఈ రూపం ఆ కొనసాగుతున్న సమీపతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది స్వల్ప కథన సంధి మాత్రమే; తెలుగులో వాక్యప్రవాహమే ఆ పనిని చేస్తుంది. ‘అయితే’ అని పెడితే మూలంలో లేని వ్యతిరేక భావం బలపడవచ్చు.
- source_word: ἑορτὴ
  choice: పండుగ
  rationale: మతపరమైన ఉత్సవాన్ని సూచించే సహజమైన, ఆధునిక తెలుగు పదం.
- source_word: τῶν ἀζύμων
  choice: పులియని రొట్టెల
  rationale: ἄζυμα అంటే పులియబెట్టని రొట్టెలు; పండుగ పేరులో దాని అర్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: ἡ λεγομένη
  choice: అని పిలిచే
  rationale: పండుగకు వాడే మరో పేరును వివరించే భాగస్వామ్య క్రియారూప భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: Πάσχα
  choice: పస్కా
  rationale: యూదుల పండుగకు తెలుగులో స్థిరపడిన పేరును వాడి, దానిని పులియని రొట్టెల పండుగతో లూకా చేసిన విధంగానే అనుసంధానిస్తుంది.
theological_decisions:
- issue: ‘పులియని రొట్టెల పండుగ’కు ‘పస్కా’కు మధ్య సంబంధం
  choice: “పస్కా అని పిలిచే పులియని రొట్టెల పండుగ” అని రెండింటినీ లూకా ఇచ్చిన వివరణాత్మక గుర్తింపుగా ఉంచడం
  alternative: రెండింటినీ సాంకేతికంగా పూర్తిగా వేర్వేరు ఆచారాలుగా చూపేలా అనువదించడం
  rationale: మూల వాక్యం పండుగ కాలాన్ని ఈ రెండు పేర్లతో అనుసంధానిస్తుంది. అనువాదం వాటి మధ్య ఉన్న చారిత్రక వ్యత్యాసాన్ని చెరపకుండా, లూకా వాక్యంలోని పేర్ల అతివ్యాప్తిని కూడా కృత్రిమంగా విడదీయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కథనశైలిని వాడాం. మూలంలోని పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, ‘పస్కా అని పిలిచే’ అనే వివరణ ఏ పండుగను సూచిస్తుందో స్పష్టంగా ఉండే తెలుగు క్రమాన్ని ఎంచుకున్నాం.
