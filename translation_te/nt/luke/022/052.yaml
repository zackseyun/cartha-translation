id: LUK.22.52
reference: Luke 22:52
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ Ἰησοῦς πρὸς τοὺς παραγενομένους ἐπ’ αὐτὸν ἀρχιερεῖς καὶ στρατηγοὺς τοῦ ἱεροῦ καὶ πρεσβυτέρους· Ὡς ἐπὶ λῃστὴν ⸀ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/052.yaml
  text: But Jesus said to the chief priests[a], the officers of the temple, and the elders who had come against him, “Have you come out as against a robber, with swords and clubs?”
translation:
  language: te
  text: 'అప్పుడు యేసు తన మీదికి వచ్చిన ముఖ్య యాజకులతో, దేవాలయ భద్రతాధికారులతో, పెద్దలతో ఇలా అన్నాడు: “దోపిడీదారుని[a] పట్టుకోవడానికి వచ్చినట్టు కత్తులతో, దుడ్డుకర్రలతో బయలుదేరి వచ్చారా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బందిపోటును.” గ్రీకు పదం దోపిడీదారుని, బందిపోటును, లేదా తిరుగుబాటుతో సంబంధమున్న నేరస్థుణ్ణి సూచించవచ్చు. ఇక్కడ అలాంటి వ్యక్తిని పట్టుకోవడానికి ఉపయోగించే బలంతో వారు రావడాన్ని యేసు ప్రశ్నిస్తున్నాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ ఇది కథనంలోని తదుపరి చర్యకు మార్పును సూచిస్తుంది; తెలుగులో ‘అప్పుడు’ సహజంగా ఆ మార్పును తెలియజేస్తుంది, బలమైన వ్యతిరేకతను అనవసరంగా చేర్చదు.
- source_word: παραγενομένους ἐπ’ αὐτόν
  choice: తన మీదికి వచ్చిన
  rationale: ἐπί + accusative ఈ అరెస్టు సందర్భంలో యేసుకు వ్యతిరేకంగా ఉద్దేశపూర్వకంగా రావడాన్ని సూచిస్తుంది; ‘మీదికి’ ఆ శత్రుభావ దిశను సహజంగా నిలుపుతుంది.
- source_word: ἀρχιερεῖς
  choice: ముఖ్య యాజకులు
  rationale: ప్రధాన యాజక అధికారుల సమూహాన్ని సూచించే ప్రామాణికమైన, స్పష్టమైన తెలుగు పదబంధం.
- source_word: στρατηγοὺς τοῦ ἱεροῦ
  choice: దేవాలయ భద్రతాధికారులు
  rationale: దేవాలయ క్రమశిక్షణ, భద్రత బాధ్యత వహించిన అధికారులను ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; సైనిక సేనాధిపతులనే అపార్థాన్ని నివారిస్తుంది.
- source_word: πρεσβυτέρους
  choice: పెద్దలు
  rationale: ఇక్కడ వయోవృద్ధులను మాత్రమే కాక గుర్తింపు పొందిన యూదు నాయకులను సూచిస్తుంది; ‘పెద్దలు’ ఆ సంస్థాగత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: నేను దోపిడీదారుణ్ణి అన్నట్టు
  rationale: ఆయుధాలతో ప్రమాదకర నేరస్థుని పట్టుకోవడానికి వచ్చినట్టుగా వారు వ్యవహరించారనే యేసు ప్రశ్నలోని వ్యంగ్యపూర్వక సవాలును సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἐξήλθατε
  choice: బయలుదేరి వచ్చారా
  rationale: వారు యేసును పట్టుకోవడానికి సాయుధంగా బయలుదేరి అక్కడికి వచ్చిన పూర్తయిన చర్యను ప్రశ్న రూపంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: μαχαιρῶν
  choice: కత్తులు
  rationale: అరెస్టు సందర్భంలో ఆయుధాలుగా వాడే ఖడ్గాలు లేదా పొట్టి కత్తులకు సాధారణంగా అర్థమయ్యే తెలుగు పదం.
- source_word: ξύλων
  choice: దుడ్డుకర్రలు
  rationale: అక్షరార్థంగా చెక్క వస్తువులైనా, ఇక్కడ కొట్టడానికి తెచ్చిన కర్ర ఆయుధాలను సూచిస్తుంది; ‘దుడ్డుకర్రలు’ ఆ భావాన్ని స్పష్టంగా ఇస్తుంది.
theological_decisions:
- issue: λῃστής పదంలోని నేరపరమైన మరియు తిరుగుబాటుదారుని సూచించే భావవ్యాప్తి
  choice: ప్రధాన పాఠ్యంలో ‘దోపిడీదారుడు’
  alternative: ‘బందిపోటు’ లేదా ‘తిరుగుబాటుదారుడైన నేరస్థుడు’
  rationale: మూలపదం దొంగతనం చేసే వ్యక్తి, బందిపోటు, లేదా హింసాత్మక తిరుగుబాటుదారుని సూచించగలదు. సందర్భం ఖచ్చితమైన వర్గాన్ని నిర్ణయించదు కాబట్టి ప్రధాన పాఠ్యంలో సాధారణ నేరపరమైన భావాన్ని ఉంచి, విస్తృత భావాన్ని పాదటిప్పణిలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘భద్రతాధికారులు’ ద్వారా దేవాలయ అధికారుల విధిని స్పష్టం చేశాం; ప్రశ్నలోని ఆరోపణాత్మక, వ్యంగ్య ధ్వనిని సహజంగా నిలిపాం.
