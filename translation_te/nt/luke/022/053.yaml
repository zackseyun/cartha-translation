id: LUK.22.53
reference: Luke 22:53
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν ὄντος μου μεθ’ ὑμῶν ἐν τῷ ἱερῷ οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ· ἀλλ’ αὕτη ⸂ἐστὶν ὑμῶν⸃ ἡ ὥρα καὶ ἡ ἐξουσία τοῦ σκότους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/053.yaml
  text: Day after day[a], while I was with you in the temple, you did not lay hands on me. But this is your hour[b], and the authority of darkness.
translation:
  language: te
  text: నేను ప్రతిరోజూ మీతో దేవాలయ ప్రాంగణంలో ఉన్నప్పుడు, మీరు నాపై చేతులు చాపలేదు.[a] కానీ ఇది మీ సమయం, చీకటి అధికారం కూడా.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీరు నాపై చేయి వేయలేదు.’ ఈ గ్రీకు నుడికారం శత్రుత్వ చర్యను సూచిస్తుంది; ఇక్కడ సందర్భం అరెస్టు చేయడం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘చీకటి శక్తి.’
    reason: alternative_reading
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: ప్రతిరోజూ
  rationale: రోజు రోజుకూ పునరావృతమైన కార్యాన్ని సూచించే విభక్తిపూర్వక గ్రీకు ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὄντος μου μεθ’ ὑμῶν
  choice: నేను ... మీతో పాటు ... ఉన్నప్పుడు
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణంలోని కాలసంబంధ భావాన్ని సహజమైన తెలుగు ఉపవాక్యంగా అందిస్తుంది.
- source_word: ἐν τῷ ἱερῷ
  choice: దేవాలయ ప్రాంగణంలో
  rationale: ἱερόν ఇక్కడ అంతర్గర్భాలయాన్ని మాత్రమే కాక దేవాలయ సముదాయాన్ని సూచిస్తుంది; ‘ప్రాంగణంలో’ ఆ పరిధిని స్పష్టం చేస్తుంది.
- source_word: οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ
  choice: మీరు నాపై చేతులు చాపలేదు
  rationale: శత్రుత్వ చర్యకు, సందర్భంలో అరెస్టుకు, సూచనగా ఉన్న మూలభాషా నుడికారాన్ని రూపకంతో సహా నిలుపుతుంది.
- source_word: ἀλλ’ αὕτη ἐστὶν ὑμῶν ἡ ὥρα
  choice: అయితే ఇది మీ గడియ
  rationale: ὥρα సూచించే నిర్ణీతమైన, గంభీరమైన క్షణాన్ని ‘మీ గడియ’ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἐξουσία
  choice: అధికారం
  rationale: హక్కు, అధికార పరిధి లేదా కార్యరూపంలో ఉన్న ఆధిపత్యం అనే భావాన్ని ముడి బలం కంటే సముచితంగా వ్యక్తం చేస్తుంది.
- source_word: τοῦ σκότους
  choice: చీకటి
  rationale: చీకటితో లక్షణీకరించబడిన శక్తి లేదా పరిధి అనే రూపకాత్మక, ధార్మిక బరువును వివరణాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
theological_decisions:
- issue: ‘చీకటి అధికారం’ను సాతాను అధికారమని లేదా దుష్టత్వ ఆధిపత్యమని స్పష్టీకరించాలా
  choice: మూలంలోని ‘చీకటి’ రూపకాన్నే ఉంచడం
  alternative: సాతాను అధికారం / దుష్టత్వ ఆధిపత్యం
  rationale: వచనం సాతానును నేరుగా పేర్కొనదు. మూల రూపకాన్ని నిలపడం ద్వారా ఆధ్యాత్మిక భావసూచనను కాపాడుతూ, వచనం స్పష్టంగా చెప్పని సిద్ధాంతార్థాన్ని చేర్చకుండా ఉంటుంది.
- issue: ὑμῶν ἡ ὥρα καὶ ἡ ἐξουσία τοῦ σκότους మధ్య సంబంధం
  choice: ‘మీ గడియ’ మరియు ‘చీకటి అధికారం చెలాయించే సమయం’గా సమన్వయంగా అనువదించడం
  alternative: ‘మీ గడియ మరియు చీకటి అధికారం’ అని పదానుపదంగా ఉంచడం
  rationale: గ్రీకులో రెండు నామవాచక పదబంధాలు καίతో కలుస్తాయి; తెలుగులో పదానుపద రూపం అసహజంగా, సంబంధం అస్పష్టంగా ఉంటుంది. ‘సమయం’ను పూరించడం భావసంబంధాన్ని సహజంగా తెలియజేస్తుంది, అయితే ఆ వ్యక్తులకూ చీకటికీ మధ్య ఖచ్చిత సంబంధాన్ని మరింతగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘దేవాలయ ప్రాంగణం’ ద్వారా ἱερόν యొక్క విస్తృత సముదాయ భావం తెలియజేయబడింది. ప్రధాన వాక్యంలో సహజత్వం కోసం చివరి సమన్వయ నిర్మాణాన్ని కొద్దిగా విప్పి చెప్పగా, పాదసూచికలో పదానుపద రూపం నిలుపబడింది.
