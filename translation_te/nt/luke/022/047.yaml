revisions:
- from: ఆయన ఇంకా మాట్లాడుతుండగా, ఇదిగో, ఒక జనసమూహం వచ్చింది. పన్నెండుమందిలో ఒకడైన యూదా అనబడేవాడు వారికి ముందుగా నడుస్తూ వచ్చాడు[a]. అతడు యేసును ముద్దుపెట్టుకోవడానికి ఆయన దగ్గరికి వచ్చాడు.
