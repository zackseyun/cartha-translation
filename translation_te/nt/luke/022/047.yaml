  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Ἔτι αὐτοῦ λαλοῦντος ἰδοὺ ὄχλος, καὶ ὁ λεγόμενος Ἰούδας εἷς τῶν δώδεκα προήρχετο αὐτούς, καὶ ἤγγισεν τῷ Ἰησοῦ φιλῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/047.yaml
  text: While he was still speaking[a], behold, a crowd came, and the one called Judas, one of the twelve, was going before them, and he came near to Jesus to kiss him.
translation:
  language: te
  text: ఆయన ఇంకా మాట్లాడుతుండగా, ఇదిగో, ఒక జనసమూహం వచ్చింది; పన్నెండుమందిలో ఒకడైన, యూదా అనబడే వాడు వారికంటే ముందుగా వెళ్తున్నాడు[a]. అతడు యేసును ముద్దుపెట్టుకోవడానికి ఆయన దగ్గరకు చేరుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారిని నడిపిస్తూ వచ్చాడు’ / ‘వారికంటే ముందుకు వెళ్లాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: ఆయన ఇంకా మాట్లాడుతుండగా
  rationale: వర్తమాన కృదంతంతో కూడిన genitive absolute ప్రధాన సంఘటనతో ఏకకాలంలో కొనసాగుతున్న చర్యను సూచిస్తుంది; ‘ఇంకా మాట్లాడుతుండగా’ ἔτι యొక్క కాలభావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: అకస్మాత్తుగా కనిపించిన జనసమూహంపై దృష్టి ఆకర్షించే కథన సూచికను నిలుపుతుంది.
- source_word: ὄχλος
  choice: ఒక జనసమూహం వచ్చింది
  rationale: ὄχλος అంటే జనసమూహం; గ్రీకులో సూచితమైన రాకను తెలుగులో సంపూర్ణమైన, సహజ వాక్యంగా ‘వచ్చింది’తో వ్యక్తపరచడం జరిగింది.
- source_word: ὁ λεγόμενος Ἰούδας
  choice: యూదా అనబడేవాడు
  rationale: వ్యక్తిని గుర్తించే participial designation‌ను అదనపు ప్రతికూల భావం చేర్చకుండా దగ్గరగా అనువదిస్తుంది.
- source_word: εἷς τῶν δώδεκα
  choice: పన్నెండుమందిలో ఒకడైన
  rationale: యూదా పన్నెండుమందిలో సభ్యుడనే గుర్తింపును, దానిలోని కథన విరోధాభాసాన్ని నిలుపుతుంది.
- source_word: προήρχετο αὐτούς
  choice: వారికి ముందుగా నడుస్తూ వచ్చాడు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న చర్యను నిలుపుతూ, అతడు సమూహానికి ముందుగా వెళ్తున్నాడనే భావాన్ని వ్యక్తపరుస్తుంది; అధికారిక నాయకత్వాన్ని అనవసరంగా బలపరచదు.
- source_word: ἤγγισεν τῷ Ἰησοῦ
  choice: యేసును … ఆయన దగ్గరికి వచ్చాడు
  rationale: ἐγγίζω లోని సమీపించడమనే దిశాత్మక భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: φιλῆσαι αὐτόν
  choice: ఆయనను ముద్దుపెట్టుకోవడానికి
  rationale: ఈ సందర్భంలో φιλέω యొక్క సూటి అర్థమైన ముద్దుపెట్టుకోవడాన్ని నిలుపుతూ, ‘అభివాదం చేయడానికి’ లేదా ‘ద్రోహం చేయడానికి’ వంటి వివరణను మూలపాఠంలోకి చేర్చదు.
theological_decisions:
- issue: యూదా చర్యకు కథనంలో ఇచ్చిన రూపం
  choice: అతడు సమీపించి ముద్దుపెట్టుకోవడానికి వచ్చినట్లు సూటిగా అనువదించడం
  alternative: ‘ముద్దుతో ఆయనకు ద్రోహం చేయడానికి’ అని వివరణాత్మకంగా విస్తరించడం
  rationale: చుట్టుపక్కల సందర్భం ద్రోహాన్ని స్పష్టం చేసినప్పటికీ, ఈ వచనం స్వయంగా సమీపించడాన్ని, ఉద్దేశించిన ముద్దును మాత్రమే వర్ణిస్తుంది. అందువల్ల మూలంలో లేని నైతిక లేదా ధార్మిక వివరణను చేర్చలేదు.
- issue: προήρχετο αὐτούς లో నాయకత్వ భావం
  choice: ‘వారికి ముందుగా నడుస్తూ వచ్చాడు’
  alternative: ‘వారిని నడిపిస్తూ వచ్చాడు’
  rationale: క్రియకు సమూహాన్ని నడిపించే భావం సందర్భంలో సాధ్యమే అయినా, ‘ముందుగా వెళ్లడం’ అనే ప్రాథమిక భావాన్ని ప్రధాన పాఠంలో ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘ఇదిగో’ అనే గుర్తింపుగల కథన సూచికను మూలంలోని ἰδοὺ యొక్క సజీవత కోసం నిలిపాం. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠంలో చేర్చబడింది.
