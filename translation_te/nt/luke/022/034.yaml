id: LUK.22.34
reference: Luke 22:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Λέγω σοι, Πέτρε, οὐ ⸀φωνήσει σήμερον ἀλέκτωρ ⸀ἕως τρίς ⸂με ἀπαρνήσῃ εἰδέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/034.yaml
  text: But he said[a], “I tell you, Peter, a rooster will not crow today until you deny three times that you know me.”
translation:
  language: te
  text: అయితే ఆయన, “పేతురూ, ఈ రోజు కోడి కూయకముందే నీవు నన్ను తెలియదని మూడుసార్లు నిరాకరిస్తావని నీతో చెబుతున్నాను” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: అయితే ఆయన ... అన్నాడు
  rationale: δέ ఇక్కడ సంభాషణలో స్వల్ప వ్యతిరేకతను సూచిస్తుంది; ‘అయితే’ దానిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: Λέγω σοι
  choice: నీతో చెబుతున్నాను
  rationale: ప్రత్యక్షంగా, గంభీరంగా చెప్పే వర్తమానకాల సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Πέτρε
  choice: పేతురూ
  rationale: వ్యక్తి పేరును తెలుగు లిపిలో ధ్వన్యనుసారంగా ఇచ్చి, సంబోధనను ‘పేతురూ’గా చూపించాం.
- source_word: φωνήσει ... ἀλέκτωρ
  choice: కోడి కూయదు
  rationale: ἀλέκτωρ కర్తగా ఉన్నప్పుడు φωνέωకు సందర్భానుసారమైన అర్థం ‘కూయడం’; తెలుగులో ‘కోడి కూయడం’ సహజమైన ప్రయోగం.
- source_word: σήμερον
  choice: ఈ రోజు
  rationale: కాలాన్ని స్పష్టంగా తెలిపే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ἕως
  choice: వరకు
  rationale: నిషేధిత క్రియ కొనసాగని కాలపు సరిహద్దును గ్రీకు వాక్యనిర్మాణానికి దగ్గరగా కాపాడుతుంది.
- source_word: τρίς
  choice: మూడుసార్లు
  rationale: గ్రీకు క్రియావిశేషణానికి స్పష్టమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: με ἀπαρνήσῃ εἰδέναι
  choice: నీవు నన్ను ఎరుగనని ... నిరాకరించే
  rationale: εἰδέναιను విడిచిపెట్టకుండా, పేతురు యేసు తనకు తెలుసనే విషయాన్ని నిరాకరిస్తాడనే నిర్దిష్ట భావాన్ని నిలుపుతుంది; ‘ఎరుగు’ ఈ సందర్భంలో వ్యక్తిని తెలుసుకోవడాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పేతురు చేయబోయే నిరాకరణ స్వభావం
  choice: ‘నీవు నన్ను ఎరుగనని మూడుసార్లు నిరాకరించే వరకు’
  alternative: ‘నీవు నన్ను మూడుసార్లు నిరాకరించే వరకు’
  rationale: గ్రీకులోని εἰδέναιను అనువాదంలో నిలిపి, నిరాకరణను యేసుతో పరిచయం లేదని చెప్పడానికే నిర్దిష్టం చేశాం; దానిని విస్తృతమైన విధేయతా-త్యాగంగా వ్యాఖ్యానించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన ప్రత్యక్ష సంభాషణ. ‘ఎరుగు’ కొంత సాహిత్య గౌరవాన్ని కలిగి ఉన్నా ఈ సందర్భంలో స్పష్టంగా, సంక్షిప్తంగా ఉంది; వాక్యంలోని జ్ఞానం/పరిచయం అనే భావాన్ని కాపాడుతుంది.
