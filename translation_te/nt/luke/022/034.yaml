review_pass:
  verdict: revise
  source_fidelity: 'The draft retains all essential elements of the Greek: Jesus addresses Peter, predicts that a rooster will not crow today, and specifies Peter’s threefold denial of knowing him. The temporal relation governed by οὐ ... ἕως is also preserved.'
  naturalness: The sentence is understandable, but “నీవు నన్ను ఎరుగనని” is somewhat literary/archaic for a modern-standard Telugu base text. “నన్ను ఎరుగనని” is idiomatic enough in elevated Telugu, yet “నన్ను తెలియదని” is more current and immediately accessible in this context. Reordering the prediction also makes the direct speech flow more naturally.
  terminology: “పేతురూ,” “కోడి కూయడం,” and “మూడుసార్లు” are appropriate. “తెలియదు” accurately conveys the denial of acquaintance expressed by με ... εἰδέναι without expanding it into a denial of loyalty or discipleship.
  issues:
  - severity: low
    issue: 'Slightly archaic wording: “నన్ను ఎరుగనని.”'
    rationale: Although accurate, “ఎరుగు” is less common in modern standard Telugu. “నన్ను తెలియదని” is natural contemporary Telugu and retains the specific content of the denial.
  - severity: low
    issue: The main assertion is somewhat more naturally ordered with the rooster clause before the denial clause.
    rationale: Placing “ఈ రోజు కోడి కూయకముందే” first makes the prediction readily intelligible while remaining semantically equivalent to the Greek negated-until construction.
  revised_text: అయితే ఆయన, “పేతురూ, ఈ రోజు కోడి కూయకముందే నీవు నన్ను తెలియదని మూడుసార్లు నిరాకరిస్తావని నీతో చెబుతున్నాను” అన్నాడు.
  revised_footnotes:
