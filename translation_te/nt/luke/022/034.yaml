    text: లేదా, “నీవు నన్ను తెలియదని మూడుసార్లు నిరాకరించే వరకు ఈ రోజు కోడి కూయదు.”
    reason: గ్రీకులో నిషేధ వాక్యంతో వచ్చిన ἕως‌ను అక్షరానువాదంగా ‘వరకు’ అని వ్యక్తం చేయవచ్చు; ప్రధాన అనువాదంలోని ‘కూయకముందే’ అదే కాలసంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
