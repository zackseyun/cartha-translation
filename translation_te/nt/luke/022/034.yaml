- from: అయితే ఆయన, “పేతురూ, నీవు నన్ను ఎరుగనని మూడుసార్లు నిరాకరించే వరకు ఈ రోజు కోడి కూయదని[a] నీతో చెబుతున్నాను” అన్నాడు.
  to: అయితే ఆయన, “పేతురూ, ఈ రోజు కోడి కూయకముందే నీవు నన్ను తెలియదని మూడుసార్లు నిరాకరిస్తావని నీతో చెబుతున్నాను” అన్నాడు.
  rationale: The revision uses current Telugu for Peter’s denial of acquaintance and adopts the natural Telugu ‘before the rooster crows’ ordering. It preserves the Greek prediction’s content, including today, the rooster, three denials, and the explicit denial of knowing Jesus. The footnote retains the more structurally close ‘until’ alternative.
  reviewer_model: gpt-5.6-terra
