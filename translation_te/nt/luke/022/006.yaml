  text: καὶ ἐξωμολόγησεν, καὶ ἐζήτει εὐκαιρίαν τοῦ παραδοῦναι αὐτὸν ⸂ἄτερ ὄχλου αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/006.yaml
  text: And he agreed[a], and began seeking an opportunity to hand him over to them apart from the crowd.
translation:
  language: te
  text: అతడు అంగీకరించి, జనసమూహం లేకుండా ఆయనను వారికి అప్పగించడానికి[a] అనుకూలమైన అవకాశం కోసం వెదకసాగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనకు ద్రోహం చేయడానికి.’ గ్రీకు క్రియకు అక్షరార్థంగా ‘అప్పగించడం’ లేదా ‘చేతికి ఇవ్వడం’ అని అర్థం; యూదా పాత్ర సందర్భంలో ‘ద్రోహం చేయడం’ కూడా సముచితమైన భావానువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξωμολόγησεν
  choice: అంగీకరించి
  rationale: మునుపటి వచనాల సందర్భంలో యూదా ప్రధాన యాజకులు, అధికారుల ప్రతిపాదనకు సమ్మతించాడనే భావం ఉంది. ‘అంగీకరించి’ ఆధునిక తెలుగులో సహజంగా ఆ సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: ἐζήτει
  choice: వెదకసాగాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న లేదా ఆరంభమైన ప్రయత్నాన్ని సూచించగలదు. అంగీకరించిన తరువాత అతడు అవకాశం కోసం వెదకడం మొదలుపెట్టాడనే కథన గమనాన్ని ‘వెదకసాగాడు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εὐκαιρίαν
  choice: తగిన అవకాశం
  rationale: ఈ పదం అనుకూలమైన సమయం లేదా సరైన సందర్భాన్ని సూచిస్తుంది. ‘తగిన అవకాశం’ చర్యకు అనువైన సందర్భం అనే భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: τοῦ παραδοῦναι
  choice: అప్పగించడానికి
  rationale: παραδίδωμι యొక్క ప్రాథమిక భావం ఒకరిని మరొకరి చేతికి అప్పగించడం. యూదా సందర్భంలో ‘ద్రోహం చేయడం’ సందర్భోచిత అర్థమైనా, ‘అప్పగించడం’ గ్రీకు పదంలోని విస్తృత భావాన్నీ శ్రమకథనంలోని పదసామ్యాన్నీ కాపాడుతుంది.
- source_word: ἄτερ ὄχλου
  choice: జనసమూహం లేనప్పుడు
  rationale: ἄτερ అంటే ‘లేకుండా/వేరుగా.’ ఇక్కడ ప్రజలు చుట్టూ లేని సమయాన్ని యూదా వెదికాడనే ఉద్దేశాన్ని ఈ సహజమైన తెలుగు ప్రయోగం తెలియజేస్తుంది.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: దత్తివిభక్తి అప్పగింపును స్వీకరించేవారిని సూచిస్తుంది; సమీప సందర్భంలో వారు ప్రధాన యాజకులు మరియు అధికారులే.
theological_decisions:
- issue: παραδοῦναι అనే క్రియను ‘అప్పగించడం’గా లేదా ‘ద్రోహం చేయడం’గా అనువదించడం
  choice: ప్రధాన పాఠ్యంలో ‘అప్పగించడానికి’
  alternative: ‘ఆయనకు ద్రోహం చేయడానికి’
  rationale: ‘అప్పగించడం’ మూలపదానికి మరింత సమీపంగా ఉండి, యూదా చర్యలోని ద్రోహభావాన్ని సందర్భమే తెలియజేయనిస్తుంది. ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచడం ద్వారా నైతిక, కథన భావం కూడా పాఠకునికి అందుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘ఆయన’ యేసును గౌరవసూచకంగా సూచిస్తుంది; ‘అతడు’ యూదాను స్పష్టంగా వేరు చేస్తుంది. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
