id: LUK.22.71
reference: Luke 22:71
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Τί ἔτι ⸂ἔχομεν μαρτυρίας χρείαν⸃; αὐτοὶ γὰρ ἠκούσαμεν ἀπὸ τοῦ στόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/071.yaml
  text: Then they said[a], “Why do we still need testimony? For we ourselves have heard it from his own mouth.”
translation:
  language: te
  text: 'అప్పుడు వారు ఇలా అన్నారు: “మనకు ఇంకా సాక్ష్యం ఎందుకు అవసరం? ఎందుకంటే మనమే అతని నోటి నుండి విన్నాము.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: అప్పుడు వారు … అన్నారు
  rationale: δέ ఇక్కడ కథనాన్ని ముందుకు నడిపించే స్వల్ప అనుసంధాన పదం; ‘అప్పుడు’ సహజమైన తెలుగు క్రమాన్ని తెలియజేస్తుంది, అనవసరమైన వైరుధ్యాన్ని జోడించదు.
- source_word: Τί ἔτι ἔχομεν μαρτυρίας χρείαν
  choice: మనకు ఇంకా సాక్ష్యం ఎందుకు?
  rationale: χρείαν ἔχειν అంటే ‘అవసరం ఉండడం’; τί ἔτι తో కలసి ఇది ‘ఇంకా ఎందుకు?’ అనే అలంకారప్రశ్నగా సహజంగా వ్యక్తమవుతుంది. న్యాయసందర్భంలో μαρτυρίαకు ‘సాక్ష్యం’ సరిపోతుంది.
- source_word: αὐτοὶ γὰρ ἠκούσαμεν
  choice: మనమే విన్నాం కదా
  rationale: αὐτοὶ లోని ఉద్ఘాటనను ‘మనమే’ నిలుపుతుంది. γάρ ఇచ్చే కారణభావాన్ని తెలుగులో సహజమైన ‘కదా’ వ్యక్తపరుస్తుంది.
- source_word: ἀπὸ τοῦ στόματος αὐτοῦ
  choice: ఇతని నోటినుండే
  rationale: వారు యేసును ప్రత్యక్షంగా ఉద్దేశించి మాట్లాడుతున్న సందర్భంలో αὐτοῦ ను ‘ఇతని’గా ఇవ్వడం సహజం; ‘నోటినుండే’ ప్రత్యక్షంగా ఆయన పలికిన మాటలను తామే విన్నామనే బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: వారు విన్నదేమిటో స్పష్టంగా పేరుపెట్టాలా?
  choice: ‘మనమే విన్నాం’ అని కర్మను పేర్కొనకుండా ఉంచడం
  alternative: ‘ఆ సాక్ష్యాన్ని మనమే విన్నాం’ లేదా ‘ఇతని వాదనను మనమే విన్నాం’
  rationale: గ్రీకులో ἠκούσαμεν తర్వాత కర్మ స్పష్టంగా లేదు. ‘సాక్ష్యం’ లేదా ‘వాదన’ అని చేర్చడం విన్న మాటల స్వభావాన్ని వ్యాఖ్యానించినట్లవుతుంది; మూలంలోని సంక్షిప్తతను, న్యాయపరమైన ఉద్వేగాన్ని నిలిపాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయసభ సందర్భానికి తగిన గౌరవప్రదమైన, సూటి సంభాషణ. ‘కదా’ అలంకారప్రశ్నలోని నిర్ధారణాత్మక బలాన్ని సహజంగా అందిస్తుంది.
