  text: Συνιόντος δὲ ὄχλου πολλοῦ καὶ τῶν κατὰ πόλιν ἐπιπορευομένων πρὸς αὐτὸν εἶπεν διὰ παραβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/004.yaml
  text: 'And when a large crowd was gathering[a], and people from town after town were coming to him, he spoke by a parable:'
translation:
  language: te
  text: 'పెద్ద జనసమూహం కూడుకుంటూ ఉండగా, ఒక్కో పట్టణం నుండి ప్రజలు ఆయన దగ్గరికి వస్తుండగా, ఆయన ఒక ఉపమానం ద్వారా[a] ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక ఉపమానంలో ఇలా చెప్పాడు.’ గ్రీకు పదబంధం సాధనాన్ని లేదా చెప్పిన విధానాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιόντος
  choice: కూడుకుంటూ ఉండగా
  rationale: జనసమూహం ఒకచోటికి చేరుతున్న కొనసాగుతున్న చర్యను సూచించే జనిటివ్ అబ్సల్యూట్ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: వాక్య నిర్మాణంలో ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక కథన కొనసాగింపును సూచిస్తుంది; తెలుగులో సందర్భం మరియు ‘ఉండగా’ నిర్మాణమే ఆ కొనసాగింపును సహజంగా తెలియజేస్తాయి.
- source_word: ὄχλου πολλοῦ
  choice: పెద్ద జనసమూహం
  rationale: ὄχλος అంటే జనసమూహం; πολύς దాని పెద్ద పరిమాణాన్ని సూచిస్తుంది.
- source_word: τῶν κατὰ πόλιν ἐπιπορευομένων
  choice: ఒక్కో పట్టణం నుంచి కూడా ప్రజలు … వస్తుండగా
  rationale: κατὰ πόλιν లోని పంపిణీ భావాన్ని ‘ఒక్కో పట్టణం నుంచి’ నిలుపుతుంది; వర్తమాన కృదంతంలోని కొనసాగుతున్న రాకను ‘వస్తుండగా’ తెలియజేస్తుంది.
- source_word: πρὸς αὐτόν
  choice: ఆయన దగ్గరికి
  rationale: యేసు వైపు కదలికను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἶπεν
  choice: ఇలా చెప్పాడు
  rationale: తరువాత వచ్చే ఉపమాన వాక్యాలకు పరిచయంగా తెలుగులో సహజమైన కథన ప్రయోగం.
- source_word: διὰ παραβολῆς
  choice: ఒక ఉపమానం ద్వారా
  rationale: διά + జనిటివ్ సూచించే సాధనం లేదా విధాన భావాన్ని నేరుగా నిలుపుతుంది; ‘ఒక ఉపమానంలో’ అనే విధానార్థక పఠనం కూడా సాధ్యమే.
