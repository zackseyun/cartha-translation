  yaml_path: translation/nt/luke/008/034.yaml
  text: When the herdsmen saw what had happened[b][a], they fled and reported it in the city and in the countryside.
translation:
  language: te
  text: జరిగినదాన్ని చూసిన పందుల కాపరులు పారిపోయి, పట్టణంలోనూ చుట్టుపక్కల పల్లెప్రాంతాల్లోనూ[a] ఆ సంగతి తెలియజేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘పొలాల్లోనూ’; ఇక్కడ పట్టణం చుట్టూ ఉన్న గ్రామీణ ప్రాంతాలు ఉద్దేశించబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδόντες
  choice: చూసిన
  rationale: అనంతర క్రియలతో కాలసంబంధాన్ని సహజమైన తెలుగులో చూపే భూతకాల అసమాపక క్రియారూపం.
- source_word: οἱ βόσκοντες
  choice: పందుల కాపరులు
  rationale: వ్యాకరణపరంగా ‘మేపుతున్నవారు’; సందర్భంలో వారు పందులను మేపుతున్నారు కాబట్టి స్పష్టత కోసం ‘పందుల కాపరులు’ అని అనువదించబడింది.
- source_word: τὸ γεγονός
  choice: జరిగినదాన్ని
  rationale: γίνομαι యొక్క సంపూర్ణకృదంత నామీకృత ప్రయోగం; పూర్తయిన సంఘటనను సహజంగా సూచిస్తుంది.
- source_word: ἔφυγον
  choice: పారిపోయి
  rationale: φεύγω యొక్క ‘పారిపోవడం’ అనే సూటి అర్థాన్ని కథన క్రమంలో సహజంగా నిలుపుతుంది.
- source_word: ἀπήγγειλαν
  choice: ఆ సంగతి తెలియజేశారు
  rationale: సంఘటన గురించి ఇతరులకు నివేదించారనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; కర్మ సందర్భం నుంచి సరఫరా చేయబడింది.
- source_word: εἰς τὴν πόλιν
  choice: పట్టణంలోనూ
  rationale: εἰς దిశను సూచించినా, నివేదిక వ్యాపించిన స్థలాన్ని తెలుగులో సహజంగా స్థానార్థకంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ εἰς τοὺς ἀγρούς
  choice: చుట్టుపక్కల పల్లెప్రాంతాల్లోనూ
  rationale: ἀγροί అక్షరార్థంగా ‘పొలాలు’; పట్టణానికి వ్యతిరేకంగా ఇక్కడ చుట్టుపక్కల గ్రామీణ ప్రాంతాలను సూచిస్తుంది.
