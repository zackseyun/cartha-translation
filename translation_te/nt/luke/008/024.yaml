id: LUK.8.24
reference: Luke 8:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: προσελθόντες δὲ διήγειραν αὐτὸν λέγοντες· Ἐπιστάτα ἐπιστάτα, ἀπολλύμεθα· ὁ δὲ ⸀διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ τῷ κλύδωνι τοῦ ὕδατος, καὶ ἐπαύσαντο, καὶ ἐγένετο γαλήνη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/024.yaml
  text: Then they came and woke him[a], saying, “Master, Master, we are perishing!” And he, having awakened, rebuked the wind and the surging of the water, and they ceased, and there was a calm.
translation:
  language: te
  text: అప్పుడు వారు ఆయన దగ్గరకు వచ్చి ఆయనను లేపి, “అధిపతీ, అధిపతీ, మేము నశించిపోతున్నాం!” అన్నారు. ఆయన మేల్కొని గాలిని, నీటి ఉద్ధృతిని[a] గద్దించాడు. అవి ఆగిపోయాయి; ప్రశాంతత ఏర్పడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఎగసిపడుతున్న అలలను.”
    reason: κλύδωνι τοῦ ὕδατος నీటి ఉద్ధృతిని లేదా ఎగసిపడే అలలను సూచించవచ్చు.
lexical_decisions:
- source_word: προσελθόντες
  choice: ఆయన దగ్గరకు వచ్చి
  rationale: యేసు వైపు వారు కదిలి వచ్చిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, తరువాతి క్రియకు ముందు జరిగిన అనుబంధ చర్యను నిలుపుతుంది.
- source_word: διήγειραν
  choice: ఆయనను లేపి
  rationale: నిద్రలో ఉన్న వ్యక్తిని మేల్కొలిపే సకర్మక భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ἐπιστάτα
  choice: గురువా
  rationale: లూకా సువార్తలో యేసును గౌరవంతో, ఆయన అధికారాన్ని గుర్తిస్తూ సంబోధించే పదంగా సహజంగా వినిపిస్తుంది; ‘ప్రభువా’ అని అనువదించి κύριοςతో పూర్తిగా కలిపివేయదు.
- source_word: ἀπολλύμεθα
  choice: మేము నశించిపోతున్నాం
  rationale: సమీపిస్తున్న ప్రాణాపాయాన్ని, గ్రీకు వర్తమాన కాలంలోని కొనసాగుతున్న తీవ్రతను నిలుపుతుంది.
- source_word: διεγερθεὶς
  choice: ఆయన మేల్కొని
  rationale: క్రియల క్రమాన్ని సహజంగా అందిస్తూ, ఆయన తనంతట తానే మేల్కొన్నాడా లేక వారు లేపినందువల్ల మేల్కొన్నాడా అనే విషయాన్ని అవసరానికి మించి నిర్ధారించదు.
- source_word: ἐπετίμησεν
  choice: గద్దించాడు
  rationale: గాలి, నీటి ఉప్పొంగుదలపై యేసు ప్రదర్శించిన బలమైన అధికారపూర్వక నిరోధాన్ని సువార్తల శైలికి తగిన విధంగా తెలియజేస్తుంది.
- source_word: κλύδωνι τοῦ ὕδατος
  choice: నీటి ఉప్పొంగుదలను
  rationale: κλύδωνలోని ఎగసిపడే, ఉద్ధృతంగా పొంగే నీటి భావాన్ని నిలుపుతూ దాన్ని కేవలం ‘అలలు’గా కుదించదు.
- source_word: ἐπαύσαντο
  choice: అవి ఆగిపోయాయి
  rationale: బహువచన క్రియను నిలుపుతూ, గాలి మరియు నీటి ఉప్పొంగుదల రెండూ ఆగిపోయాయని సహజంగా సూచిస్తుంది.
- source_word: ἐγένετο γαλήνη
  choice: అంతా ప్రశాంతమైంది
  rationale: తుఫాను ఆగిన ఫలితంగా ఏర్పడిన నిశ్చలతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: Ἐπιστάτα అనే సంబోధనలో యేసు అధికార భావం
  choice: గురువా
  alternative: ప్రభువా; అధిపతీ
  rationale: శిష్యులు యేసు అధికారాన్ని గౌరవంగా గుర్తిస్తున్న భావాన్ని ఉంచుతుంది. అదే సమయంలో మూలంలో లేని κύριος అనే ప్రత్యేక బిరుదుతో దీనిని పూర్తిగా సమానం చేయదు; ‘అధిపతీ’ కంటే సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- issue: ἐπετίμησενలో సృష్టిపై యేసు అధికారం
  choice: గద్దించాడు
  alternative: ఆజ్ఞాపించాడు; అదుపు చేశాడు
  rationale: గాలి, నీటిని యేసు నేరుగా అధికారంతో నిలువరించిన క్రియాబలాన్ని నిలుపుతుంది; ఆ అధికారానికి సంబంధించిన అదనపు సిద్ధాంత వివరణను వాక్యంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. సంభాషణలోని అత్యవసరతను పునరుక్త సంబోధనతో నిలిపి, గ్రీకు వాక్యంలోని వరుస చర్యలను సంక్షిప్తంగా అందించాం.
