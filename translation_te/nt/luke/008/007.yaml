  yaml_path: translation/nt/luke/008/007.yaml
  text: And other seed fell among the thorns[b][a], and the thorns grew up with it and choked it.
translation:
  language: te
  text: మరొక విత్తనం ముళ్ల మధ్య పడింది; దానితోపాటు పెరిగిన ముళ్లు దాన్ని అణచివేశాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερον
  choice: మరొక విత్తనం
  rationale: నపుంసక ఏకవచన విశేషణం ఇక్కడ నామవాచకంగా వాడబడి, ముందటి వచనాల్లోని విత్తనాన్ని సూచిస్తుంది. తెలుగులో భావస్పష్టత కోసం ‘విత్తనం’ను చేర్చడం సహజం.
- source_word: ἔπεσεν
  choice: పడింది
  rationale: πίπτω క్రియ యొక్క సరళమైన భూతకాల కథన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐν μέσῳ τῶν ἀκανθῶν
  choice: ముళ్ల మధ్య
  rationale: ἐν μέσῳ ఇక్కడ ‘మధ్య/నడుమ’ అనే స్థానార్థాన్ని ఇస్తుంది; ‘ముళ్ల మధ్య’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని స్థల భావాన్ని కాపాడుతుంది.
- source_word: ἀκανθῶν / αἱ ἄκανθαι
  choice: ముళ్లు
  rationale: ἄκανθα ముళ్లుగల మొక్కలను సూచిస్తుంది. ‘ముళ్లు’ వ్యవసాయ రూపకంలో సహజమైన, సంప్రదాయబద్ధమైన సంక్షిప్త పదం.
- source_word: συμφυεῖσαι
  choice: దానితోపాటు పెరిగిన
  rationale: συμφύομαι విత్తనంతో కలిసి లేదా దాని పక్కనే పెరగడాన్ని సూచిస్తుంది. ఈ అనువాదం సమకాలిక, పోటీ పెరుగుదల భావాలను రెండింటినీ సహజంగా అందిస్తుంది.
- source_word: ἀπέπνιξαν
  choice: అణచివేశాయి
  rationale: ἀποπνίγω ఉక్కిరిబిక్కిరి చేయడం లేదా ఎదగనీయకుండా అణచడం అనే భావాన్ని ఇస్తుంది. మొక్కల సందర్భంలో ‘అణచివేశాయి’ సహజంగా ఉండి రూపకాన్ని అతిగా వివరించదు.
- source_word: αὐτό
  choice: దాన్ని
  rationale: ఈ సర్వనామం ముందు సూచించిన విత్తనాన్ని తిరిగి సూచిస్తుంది; తెలుగులో ‘దాన్ని’ సహజమైన అనుసంధానం.
