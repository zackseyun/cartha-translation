id: LUK.8.23
reference: Luke 8:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πλεόντων δὲ αὐτῶν ἀφύπνωσεν. καὶ κατέβη λαῖλαψ ἀνέμου εἰς τὴν λίμνην, καὶ συνεπληροῦντο καὶ ἐκινδύνευον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/023.yaml
  text: And as they were sailing[a], he fell asleep. And a windstorm came down on the lake, and they were being swamped and were in danger.
translation:
  language: te
  text: వారు పడవలో వెళ్తుండగా ఆయన నిద్రపోయాడు. ఒక పెనుగాలి సరస్సు మీదికి దిగివచ్చింది. పడవ నీటితో నిండిపోతూ ఉండగా[a] వారు ప్రమాదంలో ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు నీటితో నిండిపోతూ ఉన్నారు”; అంటే, పడవ నీటితో నిండిపోతూ ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεόντων δὲ αὐτῶν
  choice: వారు పడవలో వెళ్తుండగా
  rationale: వర్తమాన కృదంతంతో కూడిన genitive absolute, అదే సమయంలో కొనసాగుతున్న ప్రయాణాన్ని నేపథ్య చర్యగా సూచిస్తుంది. ‘పడవలో వెళ్తుండగా’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: ἀφύπνωσεν
  choice: ఆయన నిద్రపోయాడు
  rationale: Aorist ఇక్కడ నిద్రలోకి వెళ్లడాన్ని సూచిస్తుంది. సందర్భం ప్రకారం కర్త యేసు; గౌరవార్థక ఏకవచనాన్ని వాడాం.
- source_word: κατέβη
  choice: దిగివచ్చింది
  rationale: గాలి సరస్సు మీదికి పై ప్రాంతాల నుంచి దిగివచ్చిన దృశ్యాన్ని మూలంలోని ‘దిగింది’ అనే భావానికి దగ్గరగా ఉంచుతుంది.
- source_word: λαῖλαψ ἀνέμου
  choice: పెనుగాలి
  rationale: తీవ్రమైన గాలి తుఫానును సూచించే గ్రీకు పదబంధానికి ‘పెనుగాలి’ సంక్షిప్తమైన, సహజమైన తెలుగు సమానం.
- source_word: εἰς τὴν λίμνην
  choice: సరస్సు మీదికి
  rationale: εἰς అక్షరార్థంగా ‘లోనికి’ అయినా, వాతావరణ సంఘటనతో కలిసి ఇక్కడ సరస్సు మీదికి గాలి దిగివచ్చిందనే సహజ స్థలార్థాన్ని ఇస్తుంది.
- source_word: συνεπληροῦντο
  choice: పడవ నీటితో నిండిపోతూ ఉండడంతో
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న నిండిపోవడాన్ని సూచిస్తుంది. గ్రీకులో కర్త బహువచనంగా ఉన్నప్పటికీ భావం పడవలో ఉన్నవారు, పడవ నీటితో నిండిపోవడం వల్ల ముంపునకు గురవుతున్నారని సూచించవచ్చు; తెలుగులో దృశ్యాన్ని స్పష్టంగా చెప్పి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ἐκινδύνευον
  choice: వారు ప్రమాదంలో పడ్డారు
  rationale: కొనసాగుతున్న ప్రాణాపాయ స్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
