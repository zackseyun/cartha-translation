- from: వారు పడవలో వెళ్తుండగా ఆయన నిద్రపోయాడు. అప్పుడు సరస్సు మీదికి పెనుగాలి దిగివచ్చింది. పడవ నీటితో నిండిపోతూ ఉండడంతో[a] వారు ప్రమాదంలో పడ్డారు.
  to: వారు పడవలో వెళ్తుండగా ఆయన నిద్రపోయాడు. ఒక పెనుగాలి సరస్సు మీదికి దిగివచ్చింది. పడవ నీటితో నిండిపోతూ ఉండగా[a] వారు ప్రమాదంలో ఉన్నారు.
  rationale: The revision retains the source’s ongoing action and danger by using ‘నిండిపోతూ ఉండగా’ and ‘ప్రమాదంలో ఉన్నారు.’ It avoids making the relationship between the two imperfect clauses explicitly causal while retaining the natural Telugu clarification that the boat was filling with water. ‘ఒక’ renders the Greek indefinite article-like sense more directly without affecting meaning.
