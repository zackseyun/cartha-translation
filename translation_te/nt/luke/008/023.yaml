translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని వరుస సంఘటనలు, కొనసాగుతున్న చర్య, ప్రమాద తీవ్రత నిలుపబడ్డాయి.
