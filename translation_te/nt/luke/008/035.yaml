id: LUK.8.35
reference: Luke 8:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐξῆλθον δὲ ἰδεῖν τὸ γεγονὸς καὶ ἦλθον πρὸς τὸν Ἰησοῦν, καὶ εὗρον καθήμενον τὸν ἄνθρωπον ἀφ’ οὗ τὰ δαιμόνια ⸀ἐξῆλθεν ἱματισμένον καὶ σωφρονοῦντα παρὰ τοὺς πόδας τοῦ Ἰησοῦ, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/035.yaml
  text: Then they went out to see what had happened[a], and they came to Jesus and found the man from whom the demons had gone out sitting, clothed, and in his right mind at Jesus's feet[b], and they were afraid.
translation:
  language: te
  text: అప్పుడు వారు జరిగినదాన్ని చూడటానికి బయలుదేరి యేసు వద్దకు వచ్చారు. ఎవరిలోనుంచి దయ్యాలు బయటికి వెళ్లిపోయాయో[a] ఆ మనిషి బట్టలు ధరించి, స్వస్థబుద్ధితో[b] యేసు పాదాల దగ్గర కూర్చొని ఉండగా వారు అతనిని కనుగొన్నారు; వారు భయపడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో క్రియ బహువచనంలో ఉంది (‘దయ్యాలు బయటికి వెళ్లిపోయాయి’). ముద్రిత గ్రీకు పాఠంలో బహువచన కర్తతో ఏకవచన క్రియ ఉంది; భావంలో మార్పు లేదు.
    reason: textual_variant
  - marker: b
    text: లేదా ‘మతి స్థిమితంగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: బయలుదేరి
  rationale: జరిగినదాన్ని చూడటానికి ప్రజలు తమ స్థలం నుంచి బయటికి కదలడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὸ γεγονός
  choice: జరిగినదాన్ని
  rationale: పూర్తయిన సంఘటనను సూచించే substantival perfect participle భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: ἀφ’ οὗ τὰ δαιμόνια ἐξῆλθεν
  choice: ఎవరిలోనుంచి దయ్యాలు బయటికి వెళ్లిపోయాయో
  rationale: దయ్యాలు ఆ మనిషిలోనుంచి నిష్క్రమించాయని స్పష్టంగా తెలుపుతుంది; కథనంలోని భూతోచ్చాటన భావాన్ని రూపకంగా మార్చదు.
- source_word: ἱματισμένον
  choice: బట్టలు వేసుకుని
  rationale: ముందటి నగ్నస్థితికి విరుద్ధమైన అతని పునరుద్ధరించబడిన స్థితిని సాధారణ ఆధునిక తెలుగులో చూపుతుంది.
- source_word: σωφρονοῦντα
  choice: మతి స్థిమితంగా
  rationale: స్వస్థమైన ఆలోచన, ఆత్మనిగ్రహం, మానసిక స్థిరత్వం అనే భావాలను ఆధునిక వైద్యపరమైన నిర్ధారణను చొప్పించకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: యేసు పాదాల దగ్గర
  rationale: యేసుకు సమీపంగా ఆయన పాదాల వద్ద ఉన్న స్థానాన్ని సహజంగా తెలుపుతుంది; శిష్యత్వ భావాన్ని పాఠ్యంలోకి బలవంతంగా చేర్చదు.
theological_decisions:
- issue: δαιμόνια పదాన్ని భూతోచ్చాటన సందర్భంలో అనువదించడం
  choice: దయ్యాలు
  alternative: దుష్టాత్మలు
  rationale: మూలపాఠంలోని వ్యక్తిగతమైన అతీంద్రియ శక్తుల భావాన్ని నేరుగా నిలుపుతుంది; దాన్ని కేవలం వ్యాధిగా లేదా రూపకంగా మార్చదు.
- issue: σωφρονοῦντα ద్వారా పునరుద్ధరించబడిన స్థితి
  choice: మతి స్థిమితంగా
  alternative: స్వస్థబుద్ధితో
  rationale: దయ్యాల పీడన తర్వాత అతనికి తిరిగి వచ్చిన మానసిక స్థిరత్వం, స్వాధీనతను తెలియజేస్తూ ఆధునిక క్లినికల్ వర్గీకరణను దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి. మూలంలోని రెండు సమన్వయ క్రియలను తెలుగులో సహజమైన రెండు వాక్యాలుగా విభజించాం; సంఘటనల క్రమం, అన్ని భావాంశాలు నిలుపబడ్డాయి.
