id: LUK.8.29
reference: Luke 8:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀παρήγγελλεν γὰρ τῷ πνεύματι τῷ ἀκαθάρτῳ ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου. πολλοῖς γὰρ χρόνοις συνηρπάκει αὐτόν, καὶ ⸀ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις φυλασσόμενος, καὶ διαρρήσσων τὰ δεσμὰ ἠλαύνετο ⸀ὑπὸ τοῦ ⸀δαιμονίου εἰς τὰς ἐρήμους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/029.yaml
  text: For he had commanded the unclean spirit to come out of the man[a]. For many times it had seized him, and he was kept bound with chains and shackles, being guarded, and breaking the bonds[c][b], he was driven by the demon into the desolate places.
translation:
  language: te
  text: ఎందుకంటే, ఆ అపవిత్రాత్మ ఆ మనిషిలోనుండి బయటికి రావాలని ఆయన ఆజ్ఞాపించాడు. అది అతణ్ణి చాలాసార్లు[a] పట్టుకుంది. అతణ్ణి గొలుసులతో, కాళ్ల సంకెళ్లతో బంధించి కాపలా ఉంచేవారు; అతడు బంధనాలను తెంచుతూ[c], ఆ దయ్యం చేత నిర్జన ప్రదేశాల్లోకి[b] తరిమివేయబడేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చాలాకాలంగా.” గ్రీకు పదబంధం దీర్ఘకాలాన్ని సూచించగలదు; సందర్భం పునరావృత సంఘటనలకు కూడా అనుకూలంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అరణ్య ప్రాంతాల్లోకి.” గ్రీకులో ఇది బహువచనం; అక్షరార్థంగా “నిర్జన ప్రదేశాల్లోకి.”
    reason: lexical_alternative
  - marker: c
    text: 'మరింత అక్షరానువాదంగా: “బంధనాలను తెంచుతూ, ఆ దయ్యం చేత నిర్జన ప్రదేశాల్లోకి తరిమివేయబడేవాడు.”'
    reason: formal_alternative
lexical_decisions:
- source_word: παρήγγελλεν
  choice: ఆజ్ఞాపించాడు
  rationale: వివరణాత్మకమైన γάρతో ఈ ఆజ్ఞ ముందుగా జరిగిన నేపథ్య చర్యగా నిలుస్తుంది. తెలుగు భూతకాల రూపం సందర్భంలో సహజంగా దీనిని తెలియజేస్తుంది.
- source_word: πνεύματι τῷ ἀκαθάρτῳ
  choice: ఆ అపవిత్రాత్మ
  rationale: కొత్త నిబంధనలోని అపవిత్రత భావంతో ఉన్న పదసంబంధాన్ని నిలుపుతూ, సహజమైన తెలుగు దయ్యసంబంధ పదబంధాన్ని ఇస్తుంది.
- source_word: ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου
  choice: ఆ మనిషిలోనుండి బయటికి రావాలని
  rationale: ἀπό యొక్క విడిపోవడం/బయటకు రావడం అనే స్థలార్థాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: πολλοῖς γὰρ χρόνοις
  choice: చాలాసార్లు
  rationale: బహువచన χρόνοις మరియు పునరావృత నిర్బంధ చర్యల సందర్భం, కేవలం దీర్ఘకాలం కన్నా పునరావృత సందర్భాలను సూచించడానికి అనుకూలంగా ఉన్నాయి; కాలవ్యాప్తి ప్రత్యామ్నాయాన్ని పాదటీపులో ఉంచాం.
- source_word: συνηρπάκει
  choice: పట్టుకుంది
  rationale: ఆత్మ అతణ్ణి బలవంతంగా అదుపులోకి తీసుకున్న భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: ἐδεσμεύετο
  choice: బంధించి ... ఉంచేవారు
  rationale: అసంపూర్ణ భూతకాలంలోని పునరావృత లేదా అలవాటైన మానవ నిర్బంధ చర్యను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἁλύσεσιν καὶ πέδαις
  choice: గొలుసులతో, కాళ్ల సంకెళ్లతో
  rationale: రెండు వేర్వేరు నిర్బంధ సాధనాలను స్పష్టంగా వేరు చేస్తుంది; πέδαις ప్రత్యేకంగా కాళ్లకు వేసే సంకెళ్లను సూచిస్తుంది.
- source_word: φυλασσόμενος
  choice: కాపలా ఉంచేవారు
  rationale: అతడు బంధించబడిన సమయంలో పర్యవేక్షణలో ఉండేవాడనే పరిస్థితిని సహజమైన క్రియారూపంలో అందిస్తుంది.
- source_word: διαρρήσσων τὰ δεσμὰ
  choice: బంధనాలను తెంచేసేవాడు
  rationale: δεσμάను ముందున్న గొలుసులకే పరిమితం చేయకుండా సాధారణ నిర్బంధాలుగా అనువదిస్తుంది; διαρρήσσωνలోని బలమైన ఛేదన భావాన్ని ‘తెంచేసేవాడు’ తెలియజేస్తుంది.
- source_word: ἠλαύνετο
  choice: తరిమేది
  rationale: అతడు స్వచ్ఛందంగా వెళ్లడం కాక దయ్యం బలవంతంగా నడిపించిందనే నిష్క్రియాత్మక, పునరావృత భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ὑπὸ τοῦ δαιμονίου
  choice: ఆ దయ్యం
  rationale: వ్యక్తిగత దయ్యసంబంధ కార్యసాధకత్వాన్ని మృదువుచేయకుండా సూటిగా అనువదిస్తుంది.
- source_word: εἰς τὰς ἐρήμους
  choice: నిర్జన ప్రదేశాల్లోకి
  rationale: గ్రీకు బహువచనాన్ని నిలుపుతూ, జనావాసంలేని ప్రాంతాల భావాన్ని భూభాగ స్వరూపాన్ని అతిగా నిర్దేశించకుండా అందిస్తుంది.
theological_decisions:
- issue: దయ్యసంబంధ పదాల అనువాదం
  choice: ἀκάθαρτον πνεῦμαను ‘అపవిత్రాత్మ’గా, δαιμόνιονను ‘దయ్యం’గా సూటిగా అనువదించడం
  alternative: ‘దుష్టాత్మ’ లేదా మానసిక/రూపకాల వివరణ
  rationale: వాక్యం వ్యక్తిగత దయ్యసంబంధ కార్యసాధకత్వాన్ని కథన వాస్తవంగా ప్రతిపాదిస్తుంది. దానిని మానసిక స్థితిగా మార్చకుండా, అదే సమయంలో పాఠ్యంలో లేని అదనపు సిద్ధాంత వివరణను చేర్చకుండా మూలంలోని భేదాన్ని కాపాడాం.
- issue: καὶ ముందు అంతర్లీన విరుద్ధ భావం
  choice: సహజ తెలుగు కోసం ‘అయినా’ ఉపయోగించడం
  alternative: కేవలం ‘మరియు’తో సమన్వయం చేయడం
  rationale: గ్రీకులో καὶ సాధారణ సముచ్చయం అయినప్పటికీ, బంధించి కాపలా ఉంచడం మరియు అతడు బంధనాలను తెంచడం మధ్య సందర్భసిద్ధమైన విరుద్ధత ఉంది. ‘అయినా’ కొత్త సిద్ధాంతార్థం జోడించకుండా తెలుగు ప్రవాహాన్ని స్పష్టం చేస్తుంది; మరింత అక్షరానువాద ప్రత్యామ్నాయం పాదటీపులో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన కథన శైలి. దీర్ఘమైన గ్రీకు వాక్యాన్ని తెలుగు స్పష్టత కోసం చిన్న వాక్యాలుగా విభజించాం. ‘అతణ్ణి/అతడు’ రూపాలు సహజ కథన ప్రవాహానికి, ‘కాళ్ల సంకెళ్లు’ రెండు నిర్బంధ పదాల భేదానికి ఉపయోగించబడ్డాయి.
