id: LUK.8.37
reference: Luke 8:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀ἠρώτησεν αὐτὸν ἅπαν τὸ πλῆθος τῆς περιχώρου τῶν ⸀Γερασηνῶν ἀπελθεῖν ἀπ’ αὐτῶν, ὅτι φόβῳ μεγάλῳ συνείχοντο· αὐτὸς δὲ ἐμβὰς ⸀εἰς πλοῖον ὑπέστρεψεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/037.yaml
  text: And the whole crowd from the surrounding region of the Gerasenes asked him to depart from them[a], because they were gripped by great fear. So he got into a boat and returned.
translation:
  language: te
  text: గెరాసేనీయుల పరిసర ప్రాంతంలోని జనసమూహమంతా తమ దగ్గర నుండి వెళ్లిపోవాలని ఆయనను కోరారు; ఎందుకంటే గొప్ప భయం వారిని పట్టుకుంది.[a] అప్పుడు ఆయన ఒక పడవ ఎక్కి తిరిగి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గొప్ప భయం వారిని ఆవరించింది.’
    reason: సునείχοντο అనే పదానికి ‘పట్టుకుంది’తో పాటు ‘ఆవరించింది’ అనే సహజమైన భావవ్యక్తీకరణ కూడా సాధ్యమని చూపే పదార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: ἠρώτησεν
  choice: కోరారు
  rationale: ఇక్కడ ἐρωτάω ఒక అభ్యర్థనను సూచిస్తుంది. ‘కోరారు’ అనేది తీవ్రతను అతిగా చూపకుండా సహజమైన ఆధునిక తెలుగులో ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: ἅπαν τὸ πλῆθος
  choice: జనసమూహమంతా
  rationale: ἅπαν యొక్క సమగ్రతను, πλῆθος యొక్క సామూహిక భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: τῆς περιχώρου τῶν Γερασηνῶν
  choice: గెరాసేనీయుల చుట్టుపక్కల ప్రాంతమంతటి నుండి వచ్చిన
  rationale: περίχωρος చుట్టుపక్కల ప్రాంతాన్ని సూచిస్తుంది; సంబంధాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో స్పష్టంచేయడానికి ‘నుండి వచ్చిన’ ఉపయోగించబడింది. Γερασηνῶν అనే SBLGNT పాఠాన్ని ‘గెరాసేనీయులు’గా లిప్యంతరీకరించాం.
- source_word: ἀπελθεῖν ἀπ’ αὐτῶν
  choice: తమ దగ్గర నుండి వెళ్లిపోవాలని
  rationale: వారు యేసును ఏమి చేయమని కోరారో తెలిపే infinitive నిర్మాణాన్ని, ἀπό యొక్క దూరమయ్యే భావంతో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: φόβῳ μεγάλῳ
  choice: గొప్ప భయం
  rationale: పరిమాణం లేదా తీవ్రతను సూచించే μέγας భావాన్ని వ్యాఖ్యానం జోడించకుండా నేరుగా నిలుపుతుంది.
- source_word: συνείχοντο
  choice: వారిని పట్టుకుంది
  rationale: συνέχω ఇక్కడ భయం వారిని బలంగా ఆవరించి అదుపులో ఉంచిన భావాన్ని ఇస్తుంది; ‘పట్టుకుంది’ ఆధునిక తెలుగులో సహజంగా ఆ రూపక బలాన్ని కాపాడుతుంది.
- source_word: ἐμβὰς εἰς πλοῖον
  choice: ఒక పడవ ఎక్కి
  rationale: పడవలో ప్రవేశించి ప్రయాణానికి సిద్ధపడిన క్రియను సహజమైన తెలుగు కథనశైలిలో అందిస్తుంది; గ్రీకులో నిర్దిష్ట ఉపపదం లేనందున ‘ఒక’ వాడబడింది.
- source_word: ὑπέστρεψεν
  choice: తిరిగి వెళ్లిపోయాడు
  rationale: ὑποστρέφω యొక్క తిరిగి పోవడం అనే భావాన్ని కథన సందర్భంలో స్పష్టంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: యేసు వెళ్లిపోవాలని గెరాసేనీయుల జనసమూహం కోరడానికి కారణమైన భయం యొక్క స్వభావం
  choice: భయమే వారిని ప్రేరేపించిందని మాత్రమే తెలుపుతూ, ఆ భయ స్వభావాన్ని నిర్వచించలేదు.
  alternative: అది దైవిక శక్తిపట్ల భక్తిపూర్వక విస్మయం అని, లేదా ఆర్థిక నష్టం/సామాజిక కల్లోలంపై విరోధభావమని నిర్దిష్టంగా చెప్పడం.
  rationale: మూలపాఠం ‘గొప్ప భయం’ అని మాత్రమే చెబుతుంది. అది భక్తిపూర్వకమా, విరోధపూర్వకమా, లేక మిశ్రమమా అని నిర్ణయించదు; కాబట్టి ఆ ఉద్విగ్న అస్పష్టతను అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘గెరాసేనీయులు’ అనే రూపం అందించిన SBLGNT పాఠాన్ని అనుసరిస్తుంది. భయానికి గల ఉద్దేశాన్ని వివరించే అదనపు వ్యాఖ్యానం చేర్చలేదు.
