id: LUK.8.39
reference: Luke 8:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὑπόστρεφε εἰς τὸν οἶκόν σου, καὶ διηγοῦ ὅσα ⸂σοι ἐποίησεν⸃ ὁ θεός. καὶ ἀπῆλθεν καθ’ ὅλην τὴν πόλιν κηρύσσων ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/039.yaml
  text: Return to your house, and tell what great things God has done for you. And he went away, proclaiming throughout the whole city what Jesus had done for him.
translation:
  language: te
  text: “నీ ఇంటికి తిరిగి వెళ్లి, దేవుడు నీకు చేసినవన్నీ వివరంగా చెప్పు.” అతడు వెళ్లిపోయి, యేసు తనకు చేసినవన్నీ పట్టణమంతటా ప్రకటించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπόστρεφε εἰς τὸν οἶκόν σου
  choice: నీ ఇంటికి తిరిగి వెళ్లి
  rationale: ὑποστρέφω ముందున్న చోటుకు తిరిగి వెళ్లడాన్ని సూచిస్తుంది; εἰς τὸν οἶκόν σου ఇక్కడ సహజమైన తెలుగులో ‘నీ ఇంటికి’ అవుతుంది.
- source_word: διηγοῦ
  choice: వివరంగా చెప్పు
  rationale: διηγέομαι కేవలం ప్రస్తావించడం కాకుండా జరిగినదాన్ని వివరించి చెప్పే భావాన్ని కలిగి ఉంది.
- source_word: ὅσα σοι ἐποίησεν ὁ θεός
  choice: దేవుడు నీకు చేసినవన్నీ
  rationale: ὅσα అనే పదంలోని ‘అన్నీ/ఎన్నెన్ని’ భావాన్ని నిలుపుతుంది; మూలంలో లేని ‘గొప్ప కార్యాలు’ అనే విశేషణాన్ని చేర్చదు.
- source_word: ἀπῆλθεν
  choice: వెళ్లిపోయి
  rationale: ἀπέρχομαι ఆ ప్రదేశం నుంచి వెళ్లిపోవడాన్ని సూచిస్తుంది; తరువాతి క్రియతో సహజంగా అనుసంధానించేందుకు తెలుగు క్రియావిశేషణ రూపం వాడబడింది.
- source_word: καθ’ ὅλην τὴν πόλιν
  choice: పట్టణమంతటా
  rationale: κατά ఇక్కడ విస్తరణార్థకంగా ఉండి, పట్టణమంతటా జరిగిన బహిరంగ ప్రకటనను సూచిస్తుంది.
- source_word: κηρύσσων
  choice: ప్రకటించాడు
  rationale: κηρύσσω బహిరంగంగా చాటిచెప్పే భావాన్ని ఇస్తుంది; ‘ప్రకటించాడు’ ఆ బలాన్ని మతపరమైన అదనపు భావం లేకుండా అందిస్తుంది.
- source_word: ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς
  choice: యేసు తనకు చేసినవన్నీ
  rationale: ముందటి ‘దేవుడు నీకు చేసినవన్నీ’ అనే వాక్యభాగంతో లూకా ఉంచిన సమాంతర నిర్మాణాన్ని కాపాడుతుంది.
theological_decisions:
- issue: యేసు ఆజ్ఞలో ‘దేవుడు’, స్వస్థత పొందినవాని ప్రకటనలో ‘యేసు’ అనే సమాంతరత
  choice: ‘దేవుడు నీకు చేసినవన్నీ / యేసు తనకు చేసినవన్నీ’ అని యథాతథంగా నిలుపడం
  alternative: రెండు చోట్లా ‘దేవుడు’ లేదా రెండు చోట్లా ‘యేసు’ అని సమన్వయపరచడం; లేక ‘అంటే యేసు’ అని వివరణ చేర్చడం
  rationale: మూలపాఠం దేవుడు మరియు యేసు చేసిన కార్యాలను ఉద్దేశపూర్వకమైన కథన సమాంతరతలో ఉంచుతుంది. దాని ధార్మిక బలాన్ని వివరణతో పరిష్కరించకుండా అనువాదం అలాగే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘వివరంగా చెప్పు’ మరియు ‘ప్రకటించాడు’ ద్వారా వ్యక్తిగతంగా తెలియజేయడం, బహిరంగంగా చాటిచెప్పడం మధ్య ఉన్న క్రియాభేదం నిలుపబడింది.
