  source_fidelity: 'Greek imperatives are accurately represented: తిరిగి వెళ్లి conveys Ὑπόστρεφε, and వివరంగా చెప్పు suitably renders διηγοῦ. చేసినవన్నీ preserves ὅσα without adding the unsupported qualifier ‘great.’ The departure, city-wide scope, public-proclamation sense, and the deliberate God/Jesus parallel are all retained.'
