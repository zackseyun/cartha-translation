id: LUK.8.19
reference: Luke 8:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Παρεγένετο δὲ πρὸς αὐτὸν ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ, καὶ οὐκ ἠδύναντο συντυχεῖν αὐτῷ διὰ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/019.yaml
  text: Then his mother and his brothers came to him[b][a], but they were not able to reach him because of the crowd.
translation:
  language: te
  text: అప్పుడు ఆయన తల్లి, ఆయన సోదరులు[a] ఆయన దగ్గరకు వచ్చారు, కానీ జనసమూహం వల్ల వారు ఆయనను చేరుకోలేకపోయారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘సోదరులు’ అని ఉంది; కొందరు దీనిని విస్తృతార్థంలో ‘బంధువులు’ అని అర్థం చేసుకుంటారు, కానీ పాఠం స్వయంగా ‘సోదరులు’ అని చెబుతోంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘ఆయనను కలుసుకోలేకపోయారు’ లేదా ‘ఆయన దగ్గరికి వెళ్లలేకపోయారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρεγένετο
  choice: వచ్చారు
  rationale: యేసు తల్లి, సోదరులు అక్కడికి రావడాన్ని సూచిస్తుంది. తెలుగులో బహువచన కర్తకు అనుగుణంగా ‘వచ్చారు’ సహజంగా ఉంటుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి సంఘటనకు మార్పును సహజంగా సూచిస్తుంది.
- source_word: πρὸς αὐτὸν
  choice: ఆయన దగ్గరికి
  rationale: ఒక వ్యక్తి వైపు రావడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘ఆయనను చూడడానికి’ అని ఉద్దేశాన్ని అదనంగా చేర్చదు.
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: ఆయన తల్లి, ఆయన సోదరులు
  rationale: బంధుత్వ పదాలను నేరుగా అనువదిస్తూ, αὐτοῦ సూచించే సంబంధాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: οὐκ ἠδύναντο
  choice: చేరుకోలేకపోయారు
  rationale: అసమర్థతను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: συντυχεῖν αὐτῷ
  choice: ఆయనను చేరుకోలేకపోయారు
  rationale: జనసమూహం అడ్డుగా ఉండడం అనే సందర్భంలో, ఆయన వద్దకు వెళ్లి సంప్రదించలేకపోవడం అనే ప్రాయోగిక భావాన్ని ఇస్తుంది; గ్రీకు పదానికి ‘కలుసుకోవడం’ అనే అర్థం కూడా సాధ్యమే.
- source_word: διὰ τὸν ὄχλον
  choice: జనసమూహం కారణంగా
  rationale: διά + accusative తెలిపే కారణార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘ఆయన సోదరులు’ అనే బంధుత్వ సూచన
  choice: గ్రీకు ἀδελφοί ప్రకారం ‘ఆయన సోదరులు’ అని నేరుగా అనువదించడం
  alternative: ‘ఆయన బంధువులు’ లేదా ‘ఆయన జ్ఞాతులు’
  rationale: ఈ వచనం సంబంధం యొక్క ఖచ్చిత స్వరూపాన్ని మరింత వివరించదు. జీవసంబంధ సోదరులా, సవతి సోదరులా, లేక విస్తృత బంధువులా అనే సిద్ధాంతపరమైన చర్చను అనువాదంలో పరిష్కరించకుండా, మూలపాఠంలోని సాధారణ పదాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, గౌరవప్రదమైన ‘ఆయన’ రూపాన్ని ఉపయోగించాం. వాక్యాన్ని రెండు భాగాలుగా విభజించడం ద్వారా భావస్పష్టతను పెంచాం; మూలంలోని బంధుత్వ మరియు సంప్రదింపు సంబంధిత అర్థసంభావ్యతలను పాదటిప్పణుల్లో నిలిపాం.
