  text: But he took her by the hand and called out[a], saying, “Child, arise.”
translation:
  language: te
  text: అయితే ఆయన ఆమె చెయ్యి పట్టుకొని, “బిడ్డా, లే!” అని పిలిచాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బాలికా, లే!” గ్రీకు పదం παῖςకు “బిడ్డ” అనే సాధారణ అర్థం ఉండవచ్చు; ఈ సందర్భంలో అది బాలికను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ
  choice: అయితే ఆయన
  rationale: δέ ఇక్కడ కథనంలో స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది; αὐτόςను సహజమైన తెలుగు సర్వనామంతో వ్యక్తం చేశాం.
- source_word: κρατήσας τῆς χειρὸς αὐτῆς
  choice: ఆమె చెయ్యి పట్టుకొని
  rationale: చేతిని పట్టుకోవడం అనే స్పష్టమైన శారీరక చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐφώνησεν λέγων
  choice: అని బిగ్గరగా పిలిచాడు
  rationale: φωνέωలోని వినిపించేలా పిలిచే భావాన్ని ‘బిగ్గరగా పిలిచాడు’ తెలియజేస్తుంది; λέγωνను తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలోని ‘అని’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ἡ παῖς
  choice: బాలికా
  rationale: సందర్భంలో యాయీరు కుమార్తెను ఉద్దేశిస్తున్నందున లింగాన్ని స్పష్టపరిచే గౌరవప్రదమైన సంబోధన; పదానికి సాధారణంగా ‘బిడ్డ’ అనే అర్థం కూడా సాధ్యమే.
- source_word: ἔγειρε
  choice: లే
  rationale: నేరుగా ఇచ్చిన ఆజ్ఞను సహజమైన, సంక్షిప్తమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; సందర్భంలో లేచి నిలబడడం లేదా జీవంతో లేవడం రెండింటి ప్రతిధ్వని నిలుస్తుంది.
theological_decisions:
- issue: యేసు ఆ బాలికను సంబోధించిన విధానం
  choice: బాలికా
  alternative: బిడ్డా
  rationale: παῖς విస్తృతంగా ‘బిడ్డ’ అని అర్థమవగలిగినా, ఈ సందర్భంలో స్త్రీలింగ బాలికను సూచిస్తుంది. ‘బాలికా’ సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి మూలపద విస్తృతిని కాపాడాం.
- issue: ἔγειρε అనే ఆజ్ఞలోని భావం
  choice: లే
  alternative: లేచి నిలబడు
  rationale: మూలంలోని సంక్షిప్త ఆజ్ఞాత్మక బలాన్ని కాపాడుతుంది; పునరుజ్జీవ సందర్భాన్ని వివరణాత్మకంగా విస్తరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. ప్రత్యక్ష సంబోధనను సంక్షిప్తంగా ఉంచి, మూలంలోని పిలుపు తీవ్రతను ‘బిగ్గరగా’ ద్వారా వ్యక్తం చేశాం.
