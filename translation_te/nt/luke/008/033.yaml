id: LUK.8.33
reference: Luke 8:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐξελθόντα δὲ τὰ δαιμόνια ἀπὸ τοῦ ἀνθρώπου εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν λίμνην καὶ ἀπεπνίγη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/033.yaml
  text: Then the demons came out of the man and entered the pigs[a], and the herd rushed down the steep bank into the lake and drowned.
translation:
  language: te
  text: అప్పుడు దయ్యాలు ఆ మనిషిలోనుంచి బయటికి వచ్చి పందుల్లోకి ప్రవేశించాయి. ఆ మంద నిటారైన గట్టు వెంట కిందికి[a] సరస్సులోకి వేగంగా దూసుకుపోయి మునిగి చనిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కొండచరియ వెంట కిందికి” లేదా “నిటారైన అంచు దాటి”; గ్రీకు పదబంధం నిటారుగా కిందికి దిగడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντα
  choice: బయటికి వచ్చి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను సహజమైన తెలుగు క్రమంలో తెలియజేస్తుంది; కృదంత రూపాన్ని కృత్రిమంగా అనుకరించదు.
- source_word: δαιμόνια
  choice: దయ్యాలు
  rationale: గ్రీకు పదం ప్రత్యేకంగా ‘దయ్యాలు’ అని సూచిస్తుంది; సంబంధితమైనప్పటికీ వేరైన ‘అపవిత్రాత్మలు’ అనే పదాన్ని ఇక్కడ ప్రవేశపెట్టదు.
- source_word: ἀπὸ τοῦ ἀνθρώπου
  choice: ఆ మనిషిలోనుంచి
  rationale: ముందుగా ప్రస్తావించిన నిర్దిష్ట మనిషినే సూచిస్తూ, అతనిలోనుంచి అవి బయటికి వచ్చిన భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: పందుల్లోకి ప్రవేశించాయి
  rationale: లోపలికి వెళ్లిన చలనాన్ని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: χοίρους
  choice: పందులు
  rationale: సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే ప్రస్తుత తెలుగు పదం.
- source_word: ὥρμησεν
  choice: వేగంగా దూసుకుపోయి
  rationale: ఆకస్మికమైన, బలమైన చలనాన్ని తెలియజేస్తుంది; జంతువుల ఉద్దేశాన్ని అనవసరంగా ఊహించదు.
- source_word: ἡ ἀγέλη
  choice: ఆ మంద
  rationale: పందుల సమూహాన్ని సూచించే సహజమైన సమూహవాచకం; గ్రీకులోని ఏకవచన వ్యాకరణాన్ని కొనసాగిస్తుంది.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: నిటారైన గట్టు మీదుగా కిందికి
  rationale: నిటారుగా దిగే భూభాగం వెంట లేదా దాని మీదుగా కిందికి జరిగిన చలనాన్ని తెలియజేస్తుంది; తప్పనిసరిగా నిలువైన కొండచరియ అని అతిశయింపదు.
- source_word: λίμνην
  choice: సరస్సు
  rationale: λίμνη యొక్క సాధారణ అర్థమైన ‘సరస్సు’ను కాపాడుతుంది; ‘సముద్రం’గా మార్చదు.
- source_word: ἀπεπνίγη
  choice: మునిగి చనిపోయింది
  rationale: నీటిలో మునిగి ప్రాణం పోయిన ఫలితాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలుపుతుంది; సమూహవాచకమైన ‘మంద’కు అనుగుణంగా ఏకవచనం వాడబడింది.
theological_decisions:
- issue: దయ్యం పట్టిన మనిషి కథనంలో δαιμόνια పదానికి అనువాదం
  choice: దయ్యాలు
  alternative: అపవిత్రాత్మలు
  rationale: ఈ వచనంలో ఉన్న పదం δαιμόνια. అందువల్ల సంబంధితమైనా వేరైన పదబంధాన్ని దాని స్థానంలో పెట్టకుండా మూలపాఠంలోని పదభేదాన్ని కాపాడాం.
- issue: κρημνός సూచించే భూభాగం ఎంత నిటారుగా ఉందో వ్యక్తీకరించడం
  choice: నిటారైన గట్టు
  alternative: కొండచరియ; నిటారైన అంచు
  rationale: మూలపదం నిటారైన దిగువ ప్రదేశాన్ని సూచిస్తుంది, కాని అది తప్పనిసరిగా నిలువైన కొండచరియనే అని నిర్ధారించదు. అందువల్ల సంఘటనను అలంకరించకుండా భౌగోళిక భావాన్ని నిలిపాం.
- issue: ἀπεπνίγηలోని మరణ ఫలితాన్ని తెలుగులో వ్యక్తీకరించడం
  choice: మునిగి చనిపోయింది
  alternative: మునిగిపోయింది; ఊపిరాడక చనిపోయింది
  rationale: సందర్భంలో నీటిలో మునిగి మరణించడమే భావం. ‘మునిగిపోయింది’ మాత్రమే అనడం మరణాన్ని అస్పష్టంగా ఉంచవచ్చు; ‘ఊపిరాడక’ అనడం అవసరానికి మించిన విధాన వివరణ కావచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. పొడవైన గ్రీకు వాక్యాన్ని స్పష్టత కోసం రెండు తెలుగు వాక్యాలుగా విభజించాం. మూలపాఠంలోని ‘దయ్యాలు’, ‘పందులు’, ‘సరస్సు’ అనే నిర్దిష్ట పదభేదాలు నిలుపబడ్డాయి. అందించిన ఆంగ్ల పాఠంలో [a] గుర్తు ‘pigs’ తర్వాత ఉన్నప్పటికీ, ఆ పాదటిప్పణి κρημνόςకు సంబంధించినందున తెలుగులో సంబంధిత ‘నిటారైన గట్టు మీదుగా కిందికి’ అన్న పదబంధం తర్వాత ఉంచబడింది.
