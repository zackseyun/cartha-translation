translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని కారణ సంబంధం, ‘అందరూ’ అనే ఉద్ఘాటన, ఎదురుచూడటం అనే కొనసాగుతున్న చర్య అన్నీ నిలుపబడ్డాయి. పాఠాంతర లేదా భావపరమైన ముఖ్య సందిగ్ధతకు ప్రత్యేక పాదటిప్పణి అవసరం లేదు.
