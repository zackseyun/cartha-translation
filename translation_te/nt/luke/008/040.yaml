source:
  edition: SBLGNT
  text: ⸂Ἐν δὲ⸃ τῷ ⸀ὑποστρέφειν τὸν Ἰησοῦν ἀπεδέξατο αὐτὸν ὁ ὄχλος, ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/040.yaml
  text: When Jesus returned[a], the crowd welcomed him[b], for they were all waiting for him.
translation:
  language: te
  text: యేసు తిరిగి వచ్చినప్పుడు, జనసమూహం ఆయనకు స్వాగతం పలికింది; ఎందుకంటే వారంతా ఆయన కోసం ఎదురుచూస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῷ ὑποστρέφειν
  choice: తిరిగి వచ్చినప్పుడు
  rationale: ἐν + articular infinitive కాలసూచక ఉపవాక్యంగా ఉంది. ఆధునిక తెలుగులో ‘వచ్చినప్పుడు’ సహజంగా ఉంటుంది; δέ యొక్క స్వల్ప కథన-మార్పును ప్రత్యేక పదంతో అతిగా అనువదించలేదు.
- source_word: ὑποστρέφειν
  choice: తిరిగి వచ్చినప్పుడు
  rationale: ὑποστρέφω అంటే తిరిగి రావడం లేదా వెనక్కి వెళ్లడం. సందర్భంలో యేసు మళ్లీ ప్రజల దగ్గరకు రావడం ఉద్దేశం.
- source_word: ἀπεδέξατο
  choice: స్వాగతం పలికింది
  rationale: ἀποδέχομαι ఇక్కడ అనుకూలంగా స్వీకరించడం అనే భావాన్ని ఇస్తుంది. ‘స్వాగతం పలికింది’ ఆధునిక తెలుగులో ఆ సానుకూల భావాన్ని సహజంగా తెలియజేస్తుంది; మూలంలో లేని ‘సంతోషంగా’ వంటి పదాన్ని చేర్చలేదు.
- source_word: ὁ ὄχλος
  choice: జనసమూహం
  rationale: ὄχλος ఒకచోట కూడిన ప్రజల సమూహాన్ని సూచిస్తుంది. ‘జనసమూహం’ గౌరవప్రదమైన, సాధారణ ఆధునిక తెలుగు పదం.
- source_word: ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν
  choice: ఎందుకంటే వారంతా ఆయన కోసం ఎదురుచూస్తూ ఉన్నారు
  rationale: γάρ ముందరి స్వాగతానికి కారణాన్ని తెలుపుతుంది. προσδοκάωలో ఎదురుచూడడం, ఆశించడం అనే భావాలు రెండూ సాధ్యమైనా, రాక కోసం వేచి ఉన్న కథన సందర్భానికి ‘ఎదురుచూస్తూ ఉన్నారు’ సరిపోతుంది; కొనసాగుతున్న చర్య భావాన్ని కూడా నిలుపుతుంది.
- source_word: πάντες
  choice: వారంతా
  rationale: సమూహంలోని అందరూ ఎదురుచూస్తున్నారనే మూలంలోని ఉద్ఘాటనను స్పష్టంగా నిలుపుతుంది.
- source_word: Ἰησοῦν
  choice: యేసు
  rationale: వ్యక్తినామాన్ని ప్రామాణిక తెలుగు బైబిలు రూపంలో ఇచ్చాం.
