source:
  edition: SBLGNT
  text: καὶ γυνὴ οὖσα ἐν ῥύσει αἵματος ἀπὸ ἐτῶν δώδεκα, ἥτις ⸂ἰατροῖς προσαναλώσασα ὅλον τὸν βίον⸃ οὐκ ἴσχυσεν ⸀ἀπ’ οὐδενὸς θεραπευθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/043.yaml
  text: And a woman who had been in a flow of blood for twelve years[a], and who had spent her whole livelihood on physicians, was not able to be healed by anyone[c][b],
translation:
  language: te
  text: పన్నెండేళ్లుగా రక్తస్రావంతో ఉన్న ఒక స్త్రీ[a], వైద్యులపై తన జీవనాధారమంతా ఖర్చు చేసి కూడా[b][c], ఎవరి చేతనూ నయం పొందలేకపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రక్తం కారే స్థితిలో ఉన్న ఒక స్త్రీ.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘జీవనాధారం’ అంటే ఆమె బతుకుదెరువుకు ఉన్న ఆస్తి లేదా వనరులన్నీ; ఆమె జీవితం అని కాదు.
    reason: lexical_alternative
  - marker: c
    text: కొన్ని ప్రాచీన ప్రతుల్లో ‘వైద్యులపై తన జీవనాధారమంతా ఖర్చు చేసి కూడా’ అనే వాక్యభాగం లేదు.
    reason: textual_variant
lexical_decisions:
- source_word: γυνὴ οὖσα
  choice: బాధపడుతున్న ఒక స్త్రీ
  rationale: గ్రీకు కృదంత నిర్మాణాన్ని కథన నేపథ్యాన్ని తెలిపే సహజమైన తెలుగు విశేషణబంధంగా మలిచాం; ‘బాధపడుతున్న’ అనే పదం స్థితి కొనసాగుతున్నదని స్పష్టం చేస్తుంది.
- source_word: ἐν ῥύσει αἵματος
  choice: రక్తస్రావంతో
  rationale: శరీరస్థితిని స్పష్టంగా, మర్యాదపూర్వకంగా తెలిపే ఆధునిక ప్రామాణిక తెలుగు పదం; గ్రీకులోని రక్తప్రవాహ భావాన్ని అతిగా వివరించదు.
- source_word: ἀπὸ ἐτῶν δώδεκα
  choice: పన్నెండేళ్లుగా
  rationale: ఈ సందర్భంలో ἀπό కాలవ్యవధిని సూచిస్తుంది; తెలుగులో కొనసాగుతున్న వ్యవధికి ‘-గా’ సహజమైన సమానం.
- source_word: ἰατροῖς προσαναλώσασα
  choice: వైద్యుల కోసం ... ఖర్చు చేసినా
  rationale: వైద్యులపై వనరులను పూర్తిగా వెచ్చించిన ముందస్తు చర్యను సహజమైన తెలుగులో తెలుపుతుంది; ‘చేసినా’ తరువాతి విఫల ఫలితంతో ఉన్న వ్యత్యాసాన్ని వ్యక్తం చేస్తుంది.
- source_word: ὅλον τὸν βίον
  choice: తన జీవనాధారమంతా
  rationale: βίος ఇక్కడ జీవితం అనే జీవశాస్త్రీయ అర్థంలో కాక, బతుకుదెరువు కోసం ఉన్న ఆస్తి లేదా వనరుల అర్థంలో ఉంది.
- source_word: οὐκ ἴσχυσεν ἀπ’ οὐδενὸς θεραπευθῆναι
  choice: ఎవరివల్లా నయం పొందలేకపోయింది
  rationale: ఆమెను ఎవరూ నయం చేయలేకపోయారనే నిషేధిత సామర్థ్య భావాన్నీ, θεραπεύω యొక్క చికిత్స/నయం భావాన్నీ సహజమైన తెలుగు నిర్మాణంలో నిలుపుతుంది.
