  text: ⸂Ἐγένετο δὲ⸃ ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ, καὶ εἶπεν πρὸς αὐτούς· Διέλθωμεν εἰς τὸ πέραν τῆς λίμνης, καὶ ἀνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/022.yaml
  text: It happened on one of those days that he got into a boat[a], and his disciples with him, and he said to them[b], “Let us go across to the other side of the lake.” And they set out.
translation:
  language: te
  text: ఆ రోజుల్లో ఒక రోజున యేసు తన శిష్యులతో కలిసి ఒక పడవ ఎక్కాడు. ఆయన వారితో, “సరస్సు అవతలి ఒడ్డుకు వెళ్దాం” అన్నాడు. అప్పుడు వారు పడవలో బయలుదేరారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు పడవను తీరంనుండి బయలుదేరదీశారు.” గ్రీకు క్రియకు పడవను తీరంనుండి విడిచిపెట్టి ప్రయాణం మొదలుపెట్టడం అనే నావికా అర్థం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ ἐν μιᾷ τῶν ἡμερῶν
  choice: ఆ రోజుల్లో ఒక రోజు
  rationale: లూకా వాడే కథన పరివర్తనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, నిర్దిష్ట కాలవ్యవధిలోని ఒక అనిర్దిష్ట రోజనే భావాన్ని నిలుపుతుంది.
- source_word: καὶ αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ
  choice: యేసు తన శిష్యులతో కలిసి ఒక పడవ ఎక్కాడు
  rationale: గ్రీకులో పేరు కాక సర్వనామం ఉన్నప్పటికీ, తెలుగు వచనం స్వతంత్రంగా స్పష్టంగా ఉండేందుకు సందర్భానుసారంగా ‘యేసు’ అని పేర్కొంది. సముచ్చయ నిర్మాణం సూచించే ఉమ్మడి పడవ ఎక్కే చర్యను ‘కలిసి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Διέλθωμεν
  choice: వెళ్దాం
  rationale: ప్రథమ పురుష బహువచన hortatory subjunctive‌ను సహజమైన ప్రతిపాదనగా వ్యక్తం చేస్తుంది; గమ్యదిశను తరువాతి ‘అవతలి ఒడ్డుకు’ స్పష్టం చేస్తుంది.
- source_word: εἰς τὸ πέραν τῆς λίμνης
  choice: సరస్సు అవతలి ఒడ్డుకు
  rationale: λίμνηను ‘సరస్సు’గా, τὸ πέρανను తెలుగులో సహజమైన ‘అవతలి ఒడ్డు’గా అనువదించింది.
- source_word: ἀνήχθησαν
  choice: వారు పడవను బయలుదేరదీశారు
  rationale: ఈ క్రియకు ఇక్కడ ఉన్న నావికా అర్థమైన పడవను తీరం నుంచి బయలుదేరదీయడాన్ని స్పష్టంగా తెలుపుతుంది; కేవలం ‘బయలుదేరారు’ కంటే మూలంలోని నావికా ఛాయను మెరుగ్గా నిలుపుతుంది.
