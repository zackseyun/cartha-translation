translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. యేసును సూచించడానికి ‘ఆయన’, యాయీరును సూచించడానికి ‘అతను’ వాడి సూచనలో స్పష్టత ఉంచబడింది. మూలంలోని బహువచన ‘జనసమూహాలు’ మరియు కొనసాగుతున్న చర్యల భావం నిలుపబడ్డాయి.
