source:
  edition: SBLGNT
  text: ὅτι θυγάτηρ μονογενὴς ἦν αὐτῷ ὡς ἐτῶν δώδεκα καὶ αὐτὴ ἀπέθνῃσκεν. Ἐν δὲ τῷ ὑπάγειν αὐτὸν οἱ ὄχλοι συνέπνιγον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/042.yaml
  text: because he had an only daughter[a], about twelve years old, and she was dying. And as he went[c][b], the crowds were pressing in on him.
translation:
  language: te
  text: ఎందుకంటే అతనికి దాదాపు పన్నెండేళ్ల వయసున్న ఒక్కగానొక్క కుమార్తె[a][b] ఉంది; ఆమె చనిపోతూ ఉంది. ఆయన వెళ్తుండగా జనసమూహాలు ఆయనను బలంగా నొక్కివేస్తున్నాయి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఏకైక కుమార్తె.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో, ‘సుమారు పన్నెండేళ్ల వయసు.’
    reason: lexical_alternative
  - marker: c
    text: గ్రీకు క్రియ జనసమూహాలు ఆయనను నలిపివేసేంతగా, దాదాపు ఊపిరాడనంతగా నొక్కుతున్నాయనే భావాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μονογενὴς
  choice: ఒక్కగానొక్క
  rationale: θυγάτηρ‌తో కలిసినప్పుడు ఇది జనన విధానాన్ని కాక, అతనికి ఆమె ఒక్కతే కుమార్తె అనే ప్రత్యేక కుటుంబ సంబంధాన్ని సూచిస్తుంది.
- source_word: ὡς ἐτῶν δώδεκα
  choice: దాదాపు పన్నెండేళ్ల వయసున్న
  rationale: ὡς సంఖ్యతో కలిసి సుమారు అనే భావాన్ని ఇస్తుంది; తెలుగు వాక్యంలో వయస్సును సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀπέθνῃσκεν
  choice: చనిపోతూ ఉంది
  rationale: అసంపూర్ణ భూతకాల రూపం పూర్తయిన మరణాన్ని కాక, కొనసాగుతున్న మరణస్థితిని చిత్రిస్తుంది.
- source_word: Ἐν δὲ τῷ ὑπάγειν αὐτὸν
  choice: ఆయన వెళ్తుండగా
  rationale: ἐν‌తో కూడిన articular infinitive సమకాలిక చర్యను సూచిస్తుంది; గమ్యాన్ని మూల వాక్యం ఇక్కడ మళ్లీ స్పష్టంగా చెప్పదు.
- source_word: οἱ ὄχλοι
  choice: జనసమూహాలు
  rationale: గ్రీకు బహువచనాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: συνέπνιγον
  choice: ఊపిరాడనంతగా నొక్కుతూ ఉన్నాయి
  rationale: కేవలం దగ్గరగా గుమికూడడం కంటే, ఉక్కిరిబిక్కిరి చేసేంత తీవ్రమైన ఒత్తిడిని ఈ క్రియ సూచిస్తుంది; సందర్భానుసారంగా దాని బలాన్ని నిలుపుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: మునుపటి వచనంలోని యాయీరు విన్నపానికి కారణాన్ని స్పష్టంగా అనుసంధానిస్తుంది.
- source_word: αὐτῷ
  choice: అతనికి ... ఉంది
  rationale: ἦν‌తో కూడిన దత్తి విభక్తి స్వామ్యాన్ని సూచిస్తుంది; తెలుగులో ఈ నిర్మాణం సహజమైనది.
