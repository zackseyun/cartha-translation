  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ κατεγέλων αὐτοῦ, εἰδότες ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/053.yaml
  text: And they were laughing at him, because they knew that she had died.
translation:
  language: te
  text: ఆమె చనిపోయిందని వారికి తెలుసు కాబట్టి, వారు ఆయనను ఎగతాళి చేస్తూ నవ్వుతూనే ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεγέλων
  choice: ఎగతాళిగా నవ్వుతూ ఉన్నారు
  rationale: ఈ క్రియలోని అపహాస్య భావాన్ని ‘ఎగతాళిగా’ తెలియజేస్తుంది; అపూర్ణ భూతకాల రూపం సూచించే కొనసాగుతున్న చర్యను ‘నవ్వుతూ ఉన్నారు’ ప్రతిబింబిస్తుంది.
- source_word: αὐτοῦ
  choice: ఆయనను చూసి
  rationale: καταγελάω క్రియతో వచ్చిన సంబంధ విభక్తి సర్వనామం ఎవరిని ఎగతాళి చేశారో సూచిస్తుంది. తెలుగులో ‘ఆయనను చూసి ... నవ్వడం’ సహజమైన ప్రయోగం.
- source_word: εἰδότες
  choice: వారికి తెలుసు కాబట్టి
  rationale: మూలంలో ఇది ‘తెలిసినవారై/తెలుసుకొని’ అనే కృదంత రూపమైనా, సందర్భంలో వారి ఎగతాళికి కారణాన్ని తెలియజేస్తుంది. కారణార్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేయడానికి ఈ రూపం ఎంచుకోబడింది.
- source_word: ὅτι
  choice: అని
  rationale: వారికి తెలిసిన విషయం ఏమిటో పరిచయం చేసే పదంగా ఇక్కడ పనిచేస్తుంది.
- source_word: ἀπέθανεν
  choice: చనిపోయిందని
  rationale: అయిపోయిన మరణ సంఘటనను సూచించే భూతకాల క్రియను సహజమైన తెలుగులో ఇలా వ్యక్తం చేశాం; ‘చనిపోయి ఉంది’ అని స్థితిగా మార్చలేదు.
theological_decisions:
- issue: మూల వాక్యంలో కర్తకు ప్రత్యేక నామవాచకం లేకపోయినా సందర్భంలోని బాలికను తెలుగులో ఎలా సూచించాలి
  choice: ‘ఆమె చనిపోయిందని’ అని సందర్భానుసారమైన సర్వనామంతో అనువదించడం
  alternative: ‘ఆ బాలిక చనిపోయిందని’
  rationale: మూలంలో నామవాచకం చేర్చబడలేదు. సందర్భంలో సూచిత వ్యక్తి స్పష్టంగా ఉన్నందున ‘ఆమె’ మూలంలోని సంక్షిప్తతను కాపాడుతుంది; ‘ఆ బాలిక’ అని అదనపు నామవాచకాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా, అయితే కథనానికి తగిన గౌరవప్రదమైన శైలి పాటించబడింది. ‘ఆయన’ యేసును గౌరవంగా సూచిస్తుంది; ‘ఎగతాళిగా నవ్వుతూ ఉన్నారు’ అపహాస్య భావాన్నీ కొనసాగుతున్న చర్యనూ కలిపి తెలియజేస్తుంది.
