id: LUK.8.41
reference: Luke 8:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἦλθεν ἀνὴρ ᾧ ὄνομα Ἰάϊρος, καὶ ⸀οὗτος ἄρχων τῆς συναγωγῆς ὑπῆρχεν, καὶ πεσὼν παρὰ τοὺς πόδας ⸀τοῦ Ἰησοῦ παρεκάλει αὐτὸν εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/041.yaml
  text: And behold, a man named Jairus came, and he was a ruler of the synagogue; and falling at Jesus's feet, he begged him to come into his house,
translation:
  language: te
  text: ఇదిగో, యాయీరు అనే ఒక వ్యక్తి వచ్చాడు. అతడు సమాజమందిరపు అధికారి. అతడు యేసు పాదాల దగ్గర పడి, తన ఇంటికి రావాలని ఆయనను వేడుకున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: కథనంలో కొత్త వ్యక్తి అకస్మాత్తుగా ప్రవేశించడంపై దృష్టి నిలిపే మూలపాఠంలోని సూచనను సహజమైన తెలుగు పదంతో నిలిపింది.
- source_word: ἀνὴρ
  choice: ఒక వ్యక్తి
  rationale: ఇక్కడ వయోజన పురుషుణ్ని సూచిస్తున్నప్పటికీ, తెలుగు కథనంలో సహజంగా వ్యక్తిని పరిచయం చేస్తుంది; పేరు వెంటనే రావడం వల్ల అర్థం స్పష్టంగా ఉంటుంది.
- source_word: ἄρχων τῆς συναγωγῆς
  choice: సమాజమందిరపు అధికారి
  rationale: స్థానిక యూదుల సమాజమందిరంలో నాయకత్వ బాధ్యత గల పదవిని సూచిస్తుంది; రాజకీయ పాలకుడు అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: πεσὼν παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: యేసు పాదాల దగ్గర పడి
  rationale: παρά యొక్క సమీప భావాన్ని అలాగే ఉంచుతూ వినయపూర్వకమైన అత్యవసర విన్నపాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: παρεκάλει
  choice: వేడుకున్నాడు
  rationale: అసంపూర్ణ కాలరూపంలోని గాఢమైన అభ్యర్థన భావాన్ని సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ
  choice: తన ఇంటికి రావాలని
  rationale: అక్షరార్థంగా ‘తన ఇంటిలోకి ప్రవేశించాలని’; గమనం సందర్భంలో తెలుగు సహజ ప్రయోగమైన ‘ఇంటికి రావాలని’ అదే భావాన్ని అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. గ్రీకు వాక్యంలోని వరుస ‘καὶ’లను యాంత్రికంగా పునరావృతం చేయకుండా చిన్న వాక్యాలుగా విభజించి ప్రవాహాన్ని సహజం చేశాం; సమాచారమంతా నిలిపాం.
