  edition: SBLGNT
  text: ἐδεῖτο δὲ αὐτοῦ ὁ ἀνὴρ ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια εἶναι σὺν αὐτῷ· ἀπέλυσεν δὲ ⸀αὐτὸν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/038.yaml
  text: The man from whom the demons had gone out was begging him to be with him, but he sent him away, saying,
translation:
  language: te
  text: 'దయ్యాలు తనలోనుండి వెళ్లిపోయిన ఆ మనిషి, ఆయనతో ఉండాలని ఆయనను వేడుకుంటూ ఉన్నాడు. అయితే ఆయన అతనిని పంపివేసి ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεῖτο
  choice: వేడుకుంటూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పదేపదే చేసిన గాఢమైన విన్నపాన్ని సూచిస్తుంది; ఈ తెలుగు ప్రయోగం ఆ తీవ్రతను సహజంగా నిలుపుతుంది.
- source_word: ὁ ἀνὴρ
  choice: ఆ మనిషి
  rationale: ఇది ముందుగా ప్రస్తావించిన పురుషుణ్ణి సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఆ మనిషి’ సహజమైన నిర్దిష్ట సూచన.
- source_word: ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια
  choice: దయ్యాలు వెళ్లిపోయిన
  rationale: ప్లూపర్ఫెక్ట్ రూపం ప్రధాన చర్యకు ముందే పూర్తయిన ఘటనను సూచిస్తుంది. తెలుగు సంబంధవాచక నిర్మాణంలో ఈ కాలసంబంధం సహజంగా వ్యక్తమవుతుంది.
- source_word: τὰ δαιμόνια
  choice: దయ్యాలు
  rationale: మూలంలోని వ్యక్తిగత దుష్ట ఆత్మిక సత్తలను నేరుగా సూచించే, సాధారణ పాఠకులకు సుపరిచితమైన పదం.
- source_word: εἶναι σὺν αὐτῷ
  choice: తనను ఆయనతో ఉండనివ్వమని
  rationale: తెలుగులో విన్నపం యొక్క విషయాన్ని సహజంగా వ్యక్తపరుస్తూ, ‘ఆయనతో ఉండడం’ అనే మూల భావాన్ని అదనపు అర్థం లేకుండా నిలుపుతుంది.
- source_word: ἀπέλυσεν
  choice: పంపివేస్తూ
  rationale: తరువాతి ఆదేశంతో కూడిన సందర్భంలో, అతని విన్నపాన్ని అంగీకరించకుండా మరొకచోటికి పంపిన కథన భావాన్ని ఇది తెలియజేస్తుంది.
- source_word: λέγων
  choice: ఇలా అన్నాడు
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని ఆధునిక తెలుగులో సహజంగా పరిచయం చేస్తుంది.
theological_decisions:
- issue: భూతవైద్య సందర్భంలో δαιμόνια పదం అనువాదం
  choice: దయ్యాలు
  alternative: దుష్టాత్మలు
  rationale: పాఠ్యం వ్యక్తిగతమైన దుష్ట ఆత్మిక సత్తలు మనిషి నుండి వెళ్లిపోయాయని చెబుతుంది. ‘దయ్యాలు’ మూల పదానికి నేరమైన, సాధారణ తెలుగు సమానార్థకం; దీనిని అస్పష్టమైన మానసిక లేదా రూపకాల భావంగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన ‘ఆయన’ సర్వనామంతో యేసును సూచించింది. గ్రీకులోని δέ వ్యత్యాసాన్ని ‘అయితే’ ద్వారా నిలిపింది. వాక్యం తదుపరి ప్రత్యక్ష మాటకు దారితీసేలా ద్విబిందువుతో ముగుస్తుంది.
