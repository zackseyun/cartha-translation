source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἀκούσας ἀπεκρίθη ⸀αὐτῷ· Μὴ φοβοῦ, μόνον ⸀πίστευσον, καὶ σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/050.yaml
  text: But Jesus[a], hearing this, answered him, “Do not fear; only believe[b], and she will be saved.”
translation:
  language: te
  text: 'అయితే యేసు అది విని అతనికి ఇలా జవాబిచ్చాడు: “భయపడకు; కేవలం నమ్ము[a], ఆమె రక్షించబడుతుంది[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విశ్వాసం ఉంచు” లేదా “నమ్మకం ఉంచు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆమె స్వస్థపరచబడుతుంది” లేదా “ఆమె స్వస్థమవుతుంది.” ఇక్కడి గ్రీకు క్రియకు రక్షించడం, కాపాడడం, స్వస్థపరచడం అనే అర్థాలు ఉండవచ్చు; ఈ సందర్భంలో అది మరణపు అంచు నుంచి జీవానికి, సంపూర్ణ క్షేమానికి పునరుద్ధరించడాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: అది విని
  rationale: అయోరిస్టు కృదంతం ప్రధాన క్రియకు ముందున్న చర్యను సూచిస్తుంది. గ్రీకు పాఠ్యంలో కర్మ స్పష్టంగా లేకపోయినా, సందర్భంలోని వార్తను సూచించేందుకు ‘అది’ సహజమైన తెలుగు వ్యక్తీకరణ.
- source_word: ἀπεκρίθη αὐτῷ
  choice: అతనికి ఇలా జవాబిచ్చాడు
  rationale: దత్తివాచక సర్వనామంతో ఉన్న ἀποκρίνομαι భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: Μὴ φοβοῦ
  choice: భయపడకు
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞార్థక రూపంలోని నిషేధాన్ని సంక్షిప్తంగా, గంభీరంగా తెలియజేస్తుంది.
- source_word: μόνον
  choice: కేవలం
  rationale: తరువాతి ఆజ్ఞనే ప్రత్యేకంగా పరిమితం చేసే μόνον భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: πίστευσον
  choice: నమ్ము
  rationale: πιστεύω యొక్క అయోరిస్టు ఆజ్ఞార్థక రూపానికి నేరమైన, సాధారణ తెలుగు సమానం. విశ్వాసం ఉంచడం లేదా ఆధారపడడం అనే సంబంధాత్మక ఛాయను పాదసూచికలో నిలిపాం.
- source_word: σωθήσεται
  choice: ఆమె రక్షించబడుతుంది
  rationale: σῴζω యొక్క భవిష్యత్ కర్మణి రూపాన్ని విస్తృతమైన ‘రక్షించు’ పదకుటుంబంతో అనుసంధానిస్తుంది. స్త్రీలింగ కర్తను సందర్భం నుంచి తెలుగులో స్పష్టంగా తెలిపాం; స్వస్థత లేదా క్షేమస్థితికి పునరుద్ధరణ అనే సందర్భార్థాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: యేసు ఆజ్ఞలో πιστεύω అనువాదం
  choice: నమ్ము
  alternative: విశ్వాసముంచు; నాపై నమ్మకముంచు
  rationale: ‘నమ్ము’ గ్రీకు క్రియకు నేరమైన సమానం; అది కేవలం మేధోపరమైన అంగీకారంలా వినిపించే అవకాశాన్ని దృష్టిలో ఉంచి, విశ్వాసం మరియు ఆధారపడడం అనే ప్రత్యామ్నాయ ఛాయలను పాదసూచికలో ఉంచాం. గ్రీకు పాఠ్యంలో లేని ‘నాపై’ అనే కర్మను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: స్వస్థపరచడం/జీవానికి పునరుద్ధరించడం అనే సందర్భంలో σωθήσεται అనువాదం
  choice: ఆమె రక్షించబడుతుంది
  alternative: ఆమె స్వస్థపరచబడుతుంది; ఆమె క్షేమంగా ఉంటుంది
  rationale: ‘రక్షించబడుతుంది’ అనేది σῴζω పదంలోని రక్షణ, విమోచన, స్వస్థత అనే విస్తృత అర్థసామర్థ్యాన్ని నిలుపుతుంది. తక్షణ సందర్భం శారీరక స్వస్థతను, మరణం నుంచి పునరుద్ధరణను సూచిస్తున్నందున ఆ సన్నని సందర్భార్థాలను పాదసూచికలో ఇచ్చాం; ప్రధాన పాఠ్యంలో ఉన్న భావపరమైన ఉద్వేగాన్ని సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్య గంభీరత నిలిచేలా అనువదించాం. ‘కేవలం నమ్ము’ అనే సంక్షిప్త ఆజ్ఞ మూలంలోని తీవ్రతను నిలుపుతుంది. ప్రధాన పాఠ్యంలో ‘రక్షించబడుతుంది’ అనే కొద్దిగా విస్తృతమైన పదాన్ని ఉంచి, సందర్భానికి దగ్గరైన ‘స్వస్థపరచబడుతుంది’ అనే భావాన్ని పాదసూచికలో పరిరక్షించాం.
