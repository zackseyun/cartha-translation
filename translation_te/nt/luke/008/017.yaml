revisions:
- from: ఎందుకంటే, బయటపడకుండా ఉండే దాగినది ఏదీ లేదు; అలాగే తెలిసిపోకుండా, వెలుగులోకి రాకుండా ఉండే రహస్యమైనది ఏదీ లేదు.[a]
  to: ఎందుకంటే, బయటపడని దాగినది ఏదీ లేదు; అలాగే, తెలియబడకుండా వెలుగులోకి రాకుండా ఉండే రహస్యమైనది ఏదీ లేదు.[a]
  rationale: The revision improves idiomatic Telugu and replaces the faulty footnote while preserving the Greek syntax's broad, future-oriented disclosure principle. It does not narrow the saying to a particular occasion or theological timetable.
