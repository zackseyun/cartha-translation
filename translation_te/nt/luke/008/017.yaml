review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys the two parallel negative-relative assertions: no hidden thing remains undisclosed, and no secret remains unknown and out of the open. However, the current footnote''s first alternative (“స్పష్టమయ్యేది కాని దాగినది”) reverses or obscures the required negative-relative sense and is not a valid alternative rendering. The revision retains the future/general disclosure sense without specifying its timing.'
  naturalness: The main wording is understandable, but “బయటపడకుండా ఉండే దాగినది” is heavier than necessary. “బయటపడని దాగినది” is more idiomatic modern standard Telugu. In the second clause, retaining “ఉండే” makes clear that the paired phrases describe a secret that remains both unknown and unrevealed.
  terminology: ‘దాగినది’ and ‘రహస్యమైనది’ preserve the lexical parallel and modest distinction between κρυπτόν and ἀπόκρυφον. ‘తెలియబడకుండా’ appropriately reflects the passive γνωσθῇ, while ‘వెలుగులోకి రాకుండా’ naturally renders εἰς φανερὸν ἔλθῃ. ‘బయటపడని’ is a natural equivalent for φανερὸν γενήσεται in this negative-relative construction.
  issues:
  - severity: medium
    issue: The existing footnote alternative is semantically malformed.
    rationale: “స్పష్టమయ్యేది కాని దాగినది” does not express ‘nothing hidden that will not become manifest’; it can instead suggest something simultaneously manifest and hidden. “తప్పకుండా తెలియబడకుండా” also risks conveying that it certainly will remain unknown, the reverse of the Greek construction's force.
  - severity: low
    issue: The first-clause phrasing is unnecessarily cumbersome.
    rationale: “బయటపడకుండా ఉండే దాగినది” is comprehensible but less natural than “బయటపడని దాగినది,” with no loss of the source meaning.
  revised_text: ఎందుకంటే, బయటపడని దాగినది ఏదీ లేదు; అలాగే, తెలియబడకుండా వెలుగులోకి రాకుండా ఉండే రహస్యమైనది ఏదీ లేదు.[a]
  revised_footnotes:
  - marker: a
    text: 'లేదా: “స్పష్టమవని దాగినది ఏదీ లేదు; అలాగే, తెలియబడకుండా బహిరంగంలోకి రాకుండా ఉండే రహస్యమైనది ఏదీ లేదు.” రెండవ భాగంలోని గ్రీకు బలమైన నిరాకరణ ఏ రహస్యమూ తెలియకుండా మిగలదనే భావాన్ని ఇస్తుంది.'
    reason: lexical_alternative
