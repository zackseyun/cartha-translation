id: LUK.8.17
reference: Luke 8:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν κρυπτὸν ὃ οὐ φανερὸν γενήσεται, οὐδὲ ἀπόκρυφον ὃ οὐ ⸂μὴ γνωσθῇ⸃ καὶ εἰς φανερὸν ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/017.yaml
  text: For nothing is hidden that will not become evident[c][b][a], nor is anything secret that will not be known and come to light.
translation:
  language: te
  text: ఎందుకంటే, బయటపడని దాగినది ఏదీ లేదు; అలాగే, తెలియబడకుండా వెలుగులోకి రాకుండా ఉండే రహస్యమైనది ఏదీ లేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “స్పష్టమవని దాగినది ఏదీ లేదు; అలాగే, తెలియబడకుండా బహిరంగంలోకి రాకుండా ఉండే రహస్యమైనది ఏదీ లేదు.” రెండవ భాగంలోని గ్రీకు బలమైన నిరాకరణ ఏ రహస్యమూ తెలియకుండా మిగలదనే భావాన్ని ఇస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτὸν
  choice: దాగినది
  rationale: దాచబడి ఉన్నదనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: φανερὸν γενήσεται
  choice: బయటపడకుండా ఉండే
  rationale: దాగి ఉన్నది బహిర్గత స్థితికి రావడాన్ని తెలుగు ప్రతికూల సంబంధవాక్య నిర్మాణంలో సహజంగా తెలియజేస్తుంది.
- source_word: ἀπόκρυφον
  choice: రహస్యమైనది
  rationale: మొదటి పదమైన ‘దాగినది’తో సమాంతరతను నిలుపుతూ స్వల్ప పదభేదాన్ని కాపాడుతుంది.
- source_word: οὐ μὴ γνωσθῇ
  choice: తెలిసిపోకుండా
  rationale: గ్రీకు బలమైన నిరాకరణను, ఏ రహస్యమూ తెలియకుండా మిగలదనే భావంతో సహజంగా అందిస్తుంది.
- source_word: εἰς φανερὸν ἔλθῃ
  choice: వెలుగులోకి రాకుండా
  rationale: బహిర్గతం కావడం అనే గ్రీకు నుడికారానికి తెలుగులో సహజమైన సమానార్థక నుడికారం.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి ఈ వాక్యం కారణం లేదా వివరణగా అనుసంధానమవుతుందని స్పష్టంగా చూపుతుంది.
theological_decisions:
- issue: బయటపడటం గురించిన వాక్యపు పరిధి
  choice: దాగినదంతా చివరకు బహిర్గతమవుతుందనే విస్తృత సూత్రంగా ఉంచడం
  alternative: దీనిని కేవలం అంతిమ తీర్పులో జరిగే బయల్పాటుగా లేదా కేవలం యేసు బోధ బయల్పడటంగా పరిమితం చేయడం
  rationale: వచనం కాలాన్నీ, నిర్దిష్ట సందర్భాన్నీ స్పష్టంగా పరిమితం చేయదు; అందువల్ల దాని ఉద్దేశపూర్వక విస్తృతతను అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన శైలి. రెండు సమాంతర ప్రతికూల సంబంధవాక్యాలు గ్రీకు వాక్యంలోని బలమైన ‘ఏదీ మిగలదు’ అనే భావాన్ని నిలుపుతాయి.
