id: LUK.8.10
reference: Luke 8:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τοῦ θεοῦ, τοῖς δὲ λοιποῖς ἐν παραβολαῖς, ἵνα βλέποντες μὴ βλέπωσιν καὶ ἀκούοντες μὴ συνιῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/010.yaml
  text: And he said[a], “To you it has been given to know the mysteries of the kingdom of God, but to the rest in parables, so that seeing they may not see[c][b], and hearing they may not understand.”
translation:
  language: te
  text: 'ఆయన ఇలా అన్నాడు: “దేవుని రాజ్య మర్మాలను[a] తెలుసుకోవడం మీకు అనుగ్రహించబడింది; మిగిలినవారికి మాత్రం ఉపమానాల రూపంలో[b] బోధించబడుతుంది, వారు చూస్తున్నా చూడకుండా, వింటున్నా అర్థం చేసుకోకుండా ఉండేలా[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మర్మాలు’ అనే గ్రీకు పదం కొందరికి మరుగై ఉండి, మరికొందరికి వెల్లడించబడే దేవుని రాజ్య సత్యాలను సూచిస్తుంది. ‘రహస్యాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మూలంలో ఈ భాగం సంక్షిప్తంగా, ‘మిగిలినవారికి మాత్రం ఉపమానాలలో’ అని ఉంది. తెలుగులో భావం స్పష్టంగా ఉండేందుకు ‘బోధించబడుతుంది’ అనే సూచిత పదం చేర్చబడింది.
    reason: source_ellipsis
  - marker: c
    text: ‘వారు చూస్తున్నా చూడకుండా, వింటున్నా అర్థం చేసుకోకుండా ఉండేలా’ అనే మాటలు యెషయా 6:9–10ను ప్రతిధ్వనింపజేస్తాయి. ఇవి దైవిక ఉద్దేశాన్ని, న్యాయతీర్పు ఫలితాన్ని, లేదా రెండింటినీ సూచించవచ్చు.
    reason: cross_reference
lexical_decisions:
- source_word: δέδοται
  choice: అనుగ్రహించబడింది
  rationale: గ్రీకు పరిపూర్ణ కర్మణి రూపం గతంలో ఇవ్వబడి ఇప్పుడు కొనసాగుతున్న స్థితిని సూచిస్తుంది. కర్తను పేర్కొనకుండా ఉంచడం ద్వారా మూలంలోని దైవిక కర్మణి భావం నిలుస్తుంది.
- source_word: γνῶναι
  choice: తెలుసుకోవడం
  rationale: ఇది నేరుగా ‘తెలుసుకోవడం’ అనే భావాన్ని ఇస్తుంది; వాక్యాంతంలోని συνιῶσιν‌కు వాడిన ‘అర్థం చేసుకోవడం’తో ఉన్న పదభేదాన్ని కూడా కాపాడుతుంది.
- source_word: μυστήρια
  choice: మర్మాలు
  rationale: దేవుడు దాచిపెట్టి తరువాత వెల్లడించే సత్యాలనే బైబిలు సందర్భంలో సూచిస్తుంది. ‘రహస్యాలు’ కూడా సాధ్యమే కాని ‘మర్మాలు’ దైవిక ప్రకటన భావాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: βασιλείας τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: దేవుని పరిపాలన, రాజ్య పరిధి అనే రెండు భావాలకూ చోటిచ్చే సుపరిచితమైన, సహజమైన పదబంధం.
- source_word: τοῖς δὲ λοιποῖς
  choice: మిగిలినవారికి మాత్రం
  rationale: λοιπός అంటే మిగిలినవారు. మార్కు సువార్త సమాంతర వాక్యంలోని ‘బయటివారు’ అనే పదాన్ని ఇక్కడికి దిగుమతి చేయలేదు.
- source_word: ἐν παραβολαῖς
  choice: ఉపమానాల రూపంలోనే
  rationale: బోధ వారికి చేరే రూపం లేదా విధానాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἵνα
  choice: తద్వారా … ఉండునట్లు
  rationale: ఉద్దేశం లేదా ఫలితం అనే రెండింటికీ వీలిచ్చేలా మూలంలోని ఉద్విగ్నతను నిలుపుతుంది; దాన్ని కేవలం కారణంగా గానీ కేవలం ఫలితంగా గానీ పరిమితం చేయదు.
- source_word: βλέποντες μὴ βλέπωσιν
  choice: చూస్తూ కూడా చూడకుండునట్లు
  rationale: ఒకే గ్రీకు క్రియ పునరుక్తిని తెలుగులోనూ కాపాడి, చూడటం మరియు నిజంగా గ్రహించేలా చూడటం మధ్యనున్న విరోధాన్ని వ్యాఖ్యానంతో పరిష్కరించదు.
- source_word: ἀκούοντες μὴ συνιῶσιν
  choice: వింటూ కూడా అర్థం చేసుకోకుండునట్లు
  rationale: వినడానికీ గ్రహించడానికీ మధ్య వ్యత్యాసాన్ని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: యెషయా 6:9–10 ప్రతిధ్వనిలో ἵνα పదబంధం ఉద్దేశాన్నా, న్యాయతీర్పు ఫలితాన్నా సూచిస్తుంది?
  choice: ‘తద్వారా … ఉండునట్లు’ అని ఉద్దేశం/ఫలితం రెండింటికీ వీలుండేలా అనువదించడం
  alternative: ‘దాని ఫలితంగా’ అని కేవలం ఫలితాన్ని నొక్కిచెప్పడం, లేదా ‘ఎందుకంటే’ అని ఉద్దేశ భావాన్ని తగ్గించడం
  rationale: గ్రీకు ἵνα సాధారణంగా ఉద్దేశం లేదా ఫలితాన్ని సూచించగలదు. ఉపమానాలు, ప్రకటన, తీర్పు మధ్యనున్న వేదాంత ఉద్విగ్నతను అనువాదమే ముందుగా పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘ఉండునట్లు’ అనే స్వల్ప సాహిత్య రూపం యెషయా ప్రతిధ్వనిలోని గంభీరతను, ἵνα పదబంధంలోని ఉద్దేశం/ఫలితం అనిశ్చితిని నిలుపుతుంది; మిగతా వాక్య నిర్మాణం ప్రస్తుత వాడుకకు దగ్గరగా ఉంచబడింది.
