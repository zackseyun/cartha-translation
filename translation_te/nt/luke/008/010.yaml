revisions:
- from: 'ఆయన ఇలా అన్నాడు: “దేవుని రాజ్య మర్మాలను[a] తెలుసుకోవడం మీకు అనుగ్రహించబడింది. మిగిలినవారికి మాత్రం అవి ఉపమానాల రూపంలోనే[b] ఉంటాయి. తద్వారా వారు చూస్తూ కూడా చూడకుండునట్లు, వింటూ కూడా అర్థం చేసుకోకుండునట్లు[c] ఉంటుంది.”'
  to: 'ఆయన ఇలా అన్నాడు: “దేవుని రాజ్య మర్మాలను[a] తెలుసుకోవడం మీకు అనుగ్రహించబడింది; మిగిలినవారికి మాత్రం ఉపమానాల రూపంలో[b] బోధించబడుతుంది, వారు చూస్తున్నా చూడకుండా, వింటున్నా అర్థం చేసుకోకుండా ఉండేలా[c].”'
  rationale: The revision retains the perfect passive sense of δέδοται and the distinction between knowing (γνῶναι) and understanding (συνιῶσιν). It supplies a single communication verb for Luke’s elliptical ‘to the rest in parables,’ rather than suggesting that the mysteries themselves ‘are’ parables. The final clause remains linked to parabolic instruction and preserves ἵνα’s purpose/result tension without resolving the theological question.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:42:36Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the key terms and preserves the contrast between those granted knowledge and ‘the rest.’ However, it turns the Greek ellipsis into two independent Telugu clauses: ‘అవి ... ఉంటాయి’ and then ‘... ఉండునట్లు ఉంటుంది.’ This creates an unclear referent (‘అవి’ can mean the mysteries) and leaves the ἵνα clause syntactically detached from the parabolic mode of communication.'
  naturalness: ‘ఉపమానాల రూపంలోనే ఉంటాయి’ is understandable but unnatural in this context, since it implies that the mysteries themselves exist in parable form. A single sentence with an explicit, contextually supplied communication verb is clearer and natural modern Telugu. ‘ఉండునట్లు’ is also unnecessarily literary when a modern equivalent can retain the purpose/result tension.
  terminology: ‘దేవుని రాజ్య మర్మాలు,’ ‘అనుగ్రహించబడింది,’ and ‘అర్థం చేసుకోకుండా’ are suitable. ‘మర్మాలు’ appropriately retains the biblical sense of μυστήρια; the lexical footnote properly supplies ‘రహస్యాలు’ as an alternative.
  issues:
  - severity: medium
    issue: The supplied verb and pronoun in the second sentence obscure the Greek construction.
    rationale: ‘మిగిలినవారికి మాత్రం అవి ఉపమానాల రూపంలోనే ఉంటాయి’ makes ‘అవి’ most naturally refer to ‘మర్మాలను,’ whereas Greek ἐν παραβολαῖς describes the form/mode in which the message is given to the rest. The following ‘తద్వారా ... ఉండునట్లు ఉంటుంది’ is syntactically awkward and lacks a clear antecedent.
  - severity: low
    issue: The translation overstates exclusivity with ‘నే.’
    rationale: The Greek contrast is expressed by δέ and the distinction between ‘you’ and ‘the rest’; it does not contain an explicit equivalent of ‘only.’ Omitting ‘నే’ more closely reflects the source while retaining the contrast.
  revised_text: 'ఆయన ఇలా అన్నాడు: “దేవుని రాజ్య మర్మాలను[a] తెలుసుకోవడం మీకు అనుగ్రహించబడింది; మిగిలినవారికి మాత్రం ఉపమానాల రూపంలో[b] బోధించబడుతుంది, వారు చూస్తున్నా చూడకుండా, వింటున్నా అర్థం చేసుకోకుండా ఉండేలా[c].”'
