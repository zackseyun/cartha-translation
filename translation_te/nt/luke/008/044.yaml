id: LUK.8.44
reference: Luke 8:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ, καὶ παραχρῆμα ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/044.yaml
  text: Coming up behind him[a], she touched the fringe of his garment, and immediately her flow of blood stopped.
translation:
  language: te
  text: ఆమె వెనుకనుంచి వచ్చి, ఆయన వస్త్రపు అంచును[a] తాకింది. వెంటనే ఆమె రక్తస్రావం ఆగిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “జూలును” లేదా “కుచ్చును.”
    reason: κράσπεδον అనే గ్రీకు పదం వస్త్రపు అంచుతో పాటు దాని అంచున ఉండే జూలు లేదా కుచ్చును కూడా సూచించగలదు.
lexical_decisions:
- source_word: προσελθοῦσα ὄπισθεν
  choice: వెనుకనుంచి వచ్చి
  rationale: యేసు వెనుక వైపు నుంచి ఆయనను సమీపించి, ఆ తరువాత తాకిన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἥψατο
  choice: తాకింది
  rationale: ఈ సందర్భంలో ἅπτω మధ్యమ రూపానికి సాధారణ అర్థమైన ‘తాకడం’ను ఇస్తుంది; పట్టుకున్నదనే అదనపు భావాన్ని చేర్చదు.
- source_word: τοῦ κρασπέδου
  choice: అంచును
  rationale: κράσπεδον వస్త్రపు అంచు, అంచున ఉన్న జూలు, లేదా కుచ్చును సూచించవచ్చు. ప్రధాన పాఠ్యంలో ‘అంచు’ విస్తృతమైన, సహజమైన పదం; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: ఆయన వస్త్రపు
  rationale: ἱμάτιονను నిర్దిష్టంగా అంగీ లేదా పైవస్త్రమని పరిమితం చేయకుండా సాధారణమైన ‘వస్త్రం’గా అనువదిస్తుంది.
- source_word: παραχρῆμα
  choice: వెంటనే
  rationale: ఫలితం ఏ ఆలస్యమూ లేకుండా సంభవించిందనే కాలసూచక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἔστη
  choice: ఆగిపోయింది
  rationale: రక్తప్రవాహం నిలిచిపోయిందనే సందర్భానుగుణ అర్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἡ ῥύσις τοῦ αἵματος αὐτῆς
  choice: ఆమె రక్తస్రావం
  rationale: కొనసాగుతున్న రక్తప్రవాహాన్ని ఆధునిక, స్పష్టమైన వైద్యసంబంధ పదంతో సంక్షిప్తంగా తెలియజేస్తుంది.
theological_decisions:
- issue: κράσπεδονలో ఉండగల యూదుల వస్త్రపు కుచ్చు/జూలు భావం
  choice: ప్రధాన పాఠ్యంలో ‘అంచు’
  alternative: ‘జూలు’ లేదా ‘కుచ్చు’
  rationale: ఈ పదం సాధారణంగా వస్త్రపు అంచును గానీ, ధర్మశాస్త్రంతో సంబంధమున్న అంచు కుచ్చును గానీ సూచించవచ్చు. వచనం స్వయంగా నిర్దిష్ట సూచనను బలవంతం చేయదు కాబట్టి ప్రధాన పాఠ్యం విశాలార్థాన్ని ఉంచి, మరింత నిర్దిష్టమైన అవకాశాలను పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘రక్తస్రావం’ సాధారణ పాఠకులకు అర్థమయ్యే స్పష్టమైన పదం. మూలంలోని రెండు క్రియాభాగాల క్రమాన్ని తెలుగులో ‘వచ్చి... తాకింది’గా నిలిపాం.
