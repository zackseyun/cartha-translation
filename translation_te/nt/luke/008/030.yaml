id: LUK.8.30
reference: Luke 8:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπηρώτησεν δὲ αὐτὸν ὁ ⸀Ἰησοῦς· Τί σοι ⸂ὄνομά ἐστιν⸃; ὁ δὲ εἶπεν· Λεγιών, ὅτι ⸂εἰσῆλθεν δαιμόνια πολλὰ⸃ εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/030.yaml
  text: Then Jesus asked him[a], “What is your name?” And he said[b], “Legion,” because many demons had entered into him.
translation:
  language: te
  text: అప్పుడు యేసు అతణ్ణి, “నీ పేరు ఏమిటి?” అని అడిగాడు. అతడు, “లెగియోను”[a] అన్నాడు; ఎందుకంటే అనేక దయ్యాలు అతనిలో ప్రవేశించాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “లెగియోను” అనేది పెద్ద రోమా సైనిక దళాన్ని సూచించే లాటిన్ మూలపదం; ఇక్కడ ఆ మనిషిలో అనేక దయ్యాలు ఉన్నాయని ఈ పేరు సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: అడిగాడు
  rationale: ప్రత్యక్ష ప్రశ్నను పరిచయం చేసే సాధారణ కథన క్రియగా సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: δὲ
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి చర్యను సూచించే δέ యొక్క స్వల్ప కొనసాగింపు భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: Τί σοι ὄνομά ἐστιν
  choice: నీ పేరు ఏమిటి?
  rationale: గ్రీకు నుడికారానికి అర్థసహజమైన, సాధారణ తెలుగు ప్రశ్నారూపం.
- source_word: Λεγιών
  choice: లెగియోను
  rationale: రోమా సైనిక విభాగాన్ని సూచించే లాటిన్ మూలపదాన్ని పేరుగా లిప్యంతరీకరించి, దాని నేపథ్యాన్ని పాదసూచికలో వివరించాం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ‘లెగియోను’ అనే సమాధానానికి కారణాన్ని తెలిపే స్పష్టమైన కారణార్థక అనుసంధానం.
- source_word: εἰσῆλθεν
  choice: ప్రవేశించాయి
  rationale: గ్రీకు ఏకవచన క్రియకు కర్తానంతర నిర్మాణ ప్రభావం ఉన్నప్పటికీ, తెలుగులో ‘అనేక దయ్యాలు’ అనే బహువచన కర్తతో సహజమైన బహువచన క్రియను వాడాం; ప్రవేశ దిశను నిలిపాం.
- source_word: δαιμόνια πολλὰ
  choice: అనేక దయ్యాలు
  rationale: వ్యక్తిగత దుష్ట ఆత్మిక ప్రాణులను సూచించే పదాన్ని నేరుగా, సాధారణ తెలుగులో అనువదిస్తూ వాటి అధిక సంఖ్యను నిలిపాం.
- source_word: εἰς αὐτόν
  choice: అతనిలో
  rationale: తెలుగులో ‘అతనిలో ప్రవేశించాయి’ అనేది εἰς యొక్క లోపలికి కదలిక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: δαιμόνια ను దయ్యాల ఆవహింపు సందర్భంలో ఎలా అనువదించాలి
  choice: దయ్యాలు
  alternative: దుష్టాత్మలు
  rationale: గ్రీకు పదం సూచించే దుష్ట ఆత్మిక ప్రాణులను నేరుగా తెలియజేస్తుంది; వాక్యంలోని అలౌకిక వాదనను మృదుపరచదు.
- issue: εἰσῆλθεν సూచించే కాలసంబంధం
  choice: ప్రవేశించాయి
  alternative: ప్రవేశించి ఉన్నాయి
  rationale: గ్రీకు భూతకాల క్రియను నేరుగా ఉంచాం. కారణ వాక్యమే అవి ముందుగా ప్రవేశించాయని సందర్భపరంగా తెలియజేస్తుంది; తెలుగులో అదనపు కాలరూపంతో అర్థాన్ని అతిగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘అతణ్ణి’ సంభాషణలో సహజత్వాన్ని, ‘లెగియోను’ లిప్యంతరీకరణ మూలపద స్వరూపాన్ని నిలుపుతాయి. మూలపాఠంలోని కారణార్థకతను స్పష్టంగా ఉంచుతూ, అవసరం లేని సిద్ధాంతపరమైన వివరణను ప్రధాన వాక్యంలో చేర్చలేదు.
