reference: Luke 8:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Τίς ὁ ἁψάμενός μου; ἀρνουμένων δὲ πάντων εἶπεν ὁ ⸀Πέτρος· Ἐπιστάτα, οἱ ὄχλοι συνέχουσίν σε καὶ ⸀ἀποθλίβουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/045.yaml
  text: And Jesus said[a], “Who is the one who touched me?” And while everyone was denying it, Peter said, “Master, the crowds are hemming you in and pressing against you.”
translation:
  language: te
  text: యేసు, “నన్ను తాకిన వ్యక్తి ఎవరు?” అని అడిగాడు. అందరూ తాము కాదని చెబుతుండగా, పేతురు, “గురువా, జనసమూహాలు నిన్ను చుట్టుముట్టి, నీపై ఒత్తిడి చేస్తున్నాయి[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ చుట్టూ కమ్ముకొని, నీపై ఒత్తిడి చేస్తున్నాయి.”
    reason: συνέχω మరియు ἀποθλίβω పదజంటలోని చుట్టుముట్టడం, ఒత్తిడి చేయడం అనే భావాలకు సమీపమైన ప్రత్యామ్నాయ రూపం.
lexical_decisions:
- source_word: ἁψάμενός
  choice: తాకింది
  rationale: ఈ సందర్భంలో మధ్యమ ప్రయోగంలోని ἅπτω శారీరక స్పర్శను సూచిస్తుంది. ‘తాకింది’ సహజమైన ఆధునిక తెలుగు; ప్రశ్నలో ఆ వ్యక్తి ఎవరో ఇంకా తెలియని భావాన్ని కూడా నిలుపుతుంది.
- source_word: ἀρνουμένων δὲ πάντων
  choice: అందరూ తాము కాదని అంటుండగా
  rationale: వర్తమాన కృదంతం తెలిపే కొనసాగుతున్న నిరాకరణను ‘అంటుండగా’ నిలుపుతుంది. తెలుగులో కేవలం ‘నిరాకరిస్తుండగా’ అనడం కంటే ‘తాము కాదని’ అనడం సందర్భాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: Ἐπιστάτα
  choice: గురువా
  rationale: లూకా రచనలో ఇది యేసు అధికారాన్ని గౌరవంగా అంగీకరిస్తూ సంబోధించే పదం. ‘గురువా’ ఆధునిక తెలుగులో సహజమైన గౌరవ సంబోధన; మూలంలో κύριος లేనందున ‘ప్రభువా’ అనే మరింత బలమైన బిరుదును వాడలేదు.
- source_word: ὄχλοι
  choice: జనసమూహాలు
  rationale: గ్రీకు బహువచనాన్ని నిలుపుతూ, అనేక మంది యేసును చుట్టుముట్టిన దృశ్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: συνέχουσίν
  choice: చుట్టుముట్టి
  rationale: ఇక్కడ పదం చుట్టూ చేరి కదలడానికి చోటులేకుండా చేయడాన్ని సూచిస్తుంది. ‘చుట్టుముట్టి’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἀποθλίβουσιν
  choice: నీ మీదికి ఒత్తుకుంటున్నాయి
  rationale: జనసమూహం వల్ల కలిగే తీవ్రమైన శారీరక ఒత్తిడిని తెలియజేస్తుంది; ‘నలిపేస్తున్నాయి’ అని అతిశయింపకుండా ముందున్న క్రియతో తేడాను నిలుపుతుంది.
theological_decisions:
- issue: Ἐπιστάτα అనే సంబోధన బిరుదు
  choice: గురువా
  alternative: ప్రభువా; నాయకా
  rationale: ఇక్కడ మూలపదం κύριος కాదు. కాబట్టి పాఠ్యంలో స్పష్టంగా లేని మరింత బలమైన క్రీస్తు సంబంధ బిరుదును చేర్చకుండా, గౌరవం మరియు అధికార గుర్తింపును తెలిపే సహజ తెలుగు సంబోధనను ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన సరళమైన, గౌరవప్రదమైన శైలి. గ్రీకు క్రియల కొనసాగుతున్న భావం మరియు జనసమూహాల బహువచనం నిలుపబడ్డాయి.
