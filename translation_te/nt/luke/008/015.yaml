id: LUK.8.15
reference: Luke 8:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸ δὲ ἐν τῇ καλῇ γῇ, οὗτοί εἰσιν οἵτινες ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ ἀκούσαντες τὸν λόγον κατέχουσιν καὶ καρποφοροῦσιν ἐν ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/015.yaml
  text: But the seed in the good soil—these are the ones who[a], having heard the word with a good and noble heart, hold fast to it and bear fruit with perseverance.
translation:
  language: te
  text: అయితే మంచి నేలలో పడిన విత్తనం—వీరు మంచి, ఉదాత్తమైన హృదయంతో[a] వాక్యాన్ని విని, దాన్ని గట్టిగా పట్టుకొని, పట్టుదలతో ఫలాన్ని ఇస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిజాయితీగల మరియు మంచి హృదయంతో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... ἐν τῇ καλῇ γῇ
  choice: మంచి నేలలో పడిన విత్తనం
  rationale: గ్రీకు వాక్యంలో నపుంసకలింగ సూచన సందర్భానుసారంగా విత్తనాన్ని సూచిస్తుంది. తెలుగులో భావం స్పష్టంగా ఉండేందుకు ‘విత్తనం’ను, విత్తే ఉపమాన సందర్భాన్ని సహజంగా తెలియజేయడానికి ‘పడిన’ను చేర్చాం.
- source_word: καλῇ γῇ
  choice: మంచి నేల
  rationale: వ్యవసాయ ఉపమానంలో γῆ సాగుకు అనువైన మట్టిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మంచి నేల’ సహజంగా ఉండి ఉపమానంలోని వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: οὗτοί εἰσιν οἵτινες
  choice: వీరు ... వారు
  rationale: ఈ నిర్మాణం మంచి నేలకు సంబంధించిన వ్యక్తుల వర్గాన్ని గుర్తిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ‘వీరు ... వారు’ అనే రూపం ఆ వివరణాత్మక బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ
  choice: మంచి, యోగ్యమైన హృదయంతో
  rationale: καλή, ἀγαθή అనే సమీపార్థక విశేషణాల రెండింటినీ ఒకే పదంతో కలపకుండా రెండు విధాల నైతిక ప్రశంసగా నిలిపాం. ‘యోగ్యమైన’ అనేది ఇక్కడ శ్రేష్ఠమైన, సత్ప్రవృత్తిగల అంతరంగాన్ని సూచిస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: ἀκούσαντες τὸν λόγον
  choice: వాక్యాన్ని విని
  rationale: అనిశ్చిత భూతక్రియారూపం ప్రధాన క్రియలకు ముందుగా జరిగే వినడాన్ని సూచిస్తుంది; ‘విని’ అనే తెలుగు అసమాపక క్రియ ఆ క్రమాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: κατέχουσιν
  choice: దాన్ని గట్టిగా పట్టుకొని
  rationale: ఇది కేవలం ఉంచుకోవడం కాక దృఢంగా నిలుపుకోవడాన్ని సూచిస్తుంది. ‘దాన్ని’ అనేది ముందున్న వాక్యాన్ని స్పష్టంగా తిరిగి సూచిస్తుంది.
- source_word: καρποφοροῦσιν
  choice: ఫలిస్తారు
  rationale: వ్యవసాయ చిత్రణతో పాటు రూపకాల భావాన్నీ నిలిపే సహజమైన తెలుగు క్రియ ఇది.
- source_word: ἐν ὑπομονῇ
  choice: పట్టుదలతో
  rationale: ὑπομονή ఒత్తిడి లేదా కాలవ్యవధిలో స్థిరంగా కొనసాగడాన్ని సూచిస్తుంది. ‘పట్టుదలతో’ ఫలించే విధానాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; కేవలం నిష్క్రియాత్మక సహనానికి పరిమితం చేయదు.
theological_decisions:
- issue: వాక్యాన్ని స్వీకరించే హృదయానికి ఇచ్చిన నైతిక వర్ణన
  choice: మంచి, యోగ్యమైన హృదయంతో
  alternative: నిజాయితీగల మంచి హృదయంతో
  rationale: వాక్యం వినేవారి అంతరంగ స్వభావాన్ని ప్రశంసిస్తుంది గాని అలాంటి హృదయం ఎలా ఏర్పడిందో సిద్ధాంతపరంగా వివరించదు. అనువాదం ఆ సానుకూల నైతిక వర్ణనను నిలుపుతూ సహజ మంచితనం, పునర్జన్మ క్రమం లేదా పుణ్యార్జన గురించి పాఠ్యంలో లేని నిర్ణయాలను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. ఉపమానంలోని వ్యవసాయ చిత్రణను నిలిపి, గ్రీకులోని రెండు హృదయ-విశేషణాల మధ్య స్వల్ప భేదాన్ని పాఠ్యంలోను ప్రత్యామ్నాయాన్ని పాదటిప్పణిలోను సంరక్షించాం.
