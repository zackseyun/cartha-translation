id: LUK.8.3
reference: Luke 8:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ Ἰωάννα γυνὴ Χουζᾶ ἐπιτρόπου Ἡρῴδου καὶ Σουσάννα καὶ ἕτεραι πολλαί, αἵτινες διηκόνουν αὐτοῖς ⸀ἐκ τῶν ὑπαρχόντων αὐταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/003.yaml
  text: and Joanna[a], the wife of Chuza, Herod’s steward, and Susanna, and many others[b], who were serving them out of their possessions.
translation:
  language: te
  text: హేరోదు గృహనిర్వాహకుడైన కూజా భార్య యోహన్నా, సూసన్నా, ఇంకా అనేకమంది స్త్రీలు—వీరు తమకున్న సొత్తులోనుంచి వారికి[a] సేవ చేస్తూ ఉండేవారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో “వారికి” బదులుగా “ఆయనకు” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: లేదా “తమకున్న వనరులతో”; లేదా “తమకున్న ఆస్తిలోనుంచి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ Χουζᾶ
  choice: కూజా భార్య
  rationale: వ్యక్తి పేరుతో కూడిన షష్ఠీ విభక్తి తరువాత γυνή ఇక్కడ సహజంగా ‘భార్య’ అనే సంబంధాన్ని సూచిస్తుంది.
- source_word: ἐπιτρόπου Ἡρῴδου
  choice: హేరోదు గృహనిర్వాహకుడైన
  rationale: ἐπίτροπος మరొకరి వ్యవహారాలు లేదా ఆస్తిని పర్యవేక్షించే అధికారిని సూచిస్తుంది. రాజసభ/గృహ సందర్భంలో ‘గృహనిర్వాహకుడు’ సాధారణ పాఠకుడికి స్పష్టంగా ఉంటుంది; ఆధునిక వ్యాపార ధ్వని గల ‘మేనేజరు’ను నివారిస్తుంది.
- source_word: ἕτεραι πολλαί
  choice: ఇంకా అనేకమంది స్త్రీలు
  rationale: గ్రీకు రూపం స్త్రీలింగ బహువచనం; తెలుగులో సూచిత వ్యక్తులను స్పష్టంగా తెలియజేయడానికి ‘స్త్రీలు’ను వ్యక్తంగా చేర్చడం సహజం.
- source_word: αἵτινες
  choice: వీరు
  rationale: ముందు పేర్కొన్న స్త్రీల గురించి వివరణాత్మక ఉపవాక్యాన్ని తెలుగులో సహజంగా ప్రారంభిస్తుంది.
- source_word: διηκόνουν
  choice: సేవ చేస్తూ ఉండేవారు
  rationale: క్రియ యొక్క విస్తృత ‘సేవ చేయడం’ భావాన్ని నిలుపుతుంది; తరువాతి పదబంధం ఆ సేవకు వారి ఆస్తి ఆధారమని తెలియజేస్తుంది. సంఘపరమైన ప్రత్యేక హోదాను సూచించే పదాన్ని దిగుమతి చేయదు.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: ఇచ్చిన SBLGNT పాఠంలోని బహువచనాన్ని అనుసరిస్తుంది; సందర్భంలో యేసు మరియు ఆయనతో ఉన్నవారిని సూచించడం సహజం.
- source_word: ἐκ τῶν ὑπαρχόντων αὐταῖς
  choice: తమకున్న ఆస్తితో
  rationale: వారికి చెందిన వనరులు లేదా ఆస్తి నుంచే సేవ చేశారనే భావాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో తెలియజేస్తుంది; అది కేవలం నగదు అని పరిమితం చేయదు.
theological_decisions:
- issue: αὐτοῖς అనే సర్వనామం యొక్క సంఖ్య మరియు సూచన
  choice: 'బహువచనం: వారు యేసుకూ ఆయనతో ఉన్నవారికీ సేవ చేశారు'
  alternative: 'ఏకవచనం: వారు యేసుకు సేవ చేశారు'
  rationale: ఇచ్చిన గ్రీకు మూలపాఠంలో αὐτοῖς బహువచనంగా ఉంది. అందువల్ల ప్రధాన పాఠం దానినే అనుసరిస్తుంది; కొన్ని ప్రతుల ఏకవచన పాఠాన్ని పాదసూచికలో నమోదు చేస్తుంది.
- issue: ἐκ τῶν ὑπαρχόντων αὐταῖς యొక్క పరిధి
  choice: తమకున్న ఆస్తితో
  alternative: తమకున్న వనరులతో / తమ సొత్తులోనుంచి
  rationale: ఈ పదబంధం స్త్రీల స్వంత వనరులు లేదా ఆస్తి నుండి వచ్చిన సహాయాన్ని సూచిస్తుంది. సహాయం కేవలం డబ్బే అని లేదా కేవలం వస్తువులే అని అనవసరంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. పేర్ల జాబితా సహజంగా ప్రవహించేలా నిర్మించబడింది. ‘గృహనిర్వాహకుడు’ రాజసభ లేదా ఎస్టేట్ వ్యవహారాలను పర్యవేక్షించే ἐπίτροπος భావాన్ని తెలియజేస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
