- from: అయితే యేసు, “ఎవరో నన్ను ముట్టుకున్నారు; ఎందుకంటే నాలోనుంచి శక్తి బయటికి వెళ్లిందని నాకు తెలిసింది” అన్నాడు.
  to: అయితే యేసు, “ఎవరో నన్ను తాకారు; ఎందుకంటే శక్తి నా నుండి వెళ్లిపోయిందని నేను తెలుసుకున్నాను” అన్నాడు.
  rationale: The revision preserves the source text’s ambiguity about the manner by which Jesus knew, while explicitly retaining the first-person ‘I knew.’ It also uses direct and idiomatic equivalents for ‘touched me’ and ‘from me,’ without adding theological explanation.
