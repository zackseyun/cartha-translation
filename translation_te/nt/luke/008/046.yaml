id: LUK.8.46
reference: Luke 8:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἥψατό μού τις, ἐγὼ γὰρ ἔγνων δύναμιν ⸀ἐξεληλυθυῖαν ἀπ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/046.yaml
  text: But Jesus said, “Someone touched me, for I knew that power had gone out from me.”
translation:
  language: te
  text: అయితే యేసు, “ఎవరో నన్ను తాకారు; ఎందుకంటే శక్తి నా నుండి వెళ్లిపోయిందని నేను తెలుసుకున్నాను” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἥψατό μού τις
  choice: ఎవరో నన్ను ముట్టుకున్నారు
  rationale: ἅπτομαι ఇక్కడ శారీరకంగా తాకడం లేదా ముట్టుకోవడాన్ని సూచిస్తుంది; τις యొక్క అనిర్దిష్టతను ‘ఎవరో’ నిలుపుతుంది.
- source_word: ἔγνων
  choice: నాకు తెలిసింది
  rationale: γινώσκω యొక్క aorist రూపం ఇక్కడ యేసు గ్రహించిన లేదా తెలుసుకున్న విషయాన్ని తెలియజేస్తుంది. తాజా పాఠ్య నిర్ణయానికి అనుగుణంగా ‘తెలిసింది’ను ఎంచుకుని, ‘అనుభూతి చెందాను’ వంటి అదనపు భావాన్ని చేర్చలేదు.
- source_word: δύναμιν
  choice: శక్తి
  rationale: δύναμις యొక్క సాధారణ అర్థాన్ని సహజమైన ఆధునిక తెలుగు పదంతో అందిస్తుంది; సందర్భంలోని స్వస్థపరిచే ప్రభావాన్ని పాఠకుడు పరిసర వచనాల ద్వారా గ్రహించగలడు.
- source_word: ἐξεληλυθυῖαν ἀπ’ ἐμοῦ
  choice: నాలోనుంచి శక్తి బయటికి వెళ్లిందని
  rationale: perfect participle జరిగిన కార్యం వల్ల ఏర్పడిన స్థితిని సూచిస్తుంది. తెలుగులో సహజంగా ఉండే విధంగా ‘బయటికి వెళ్లింది’ అని అనువదించి, మూలపాఠంలోని ‘నా నుండి’ సంబంధాన్ని ‘నాలోనుంచి’తో నిలిపింది.
theological_decisions:
- issue: యేసు శక్తి బయటికి వెళ్లినదాన్ని ఎలా తెలుసుకున్నాడనే అంశం
  choice: ‘నాకు తెలిసింది’ అని మాత్రమే అనువదించడం
  alternative: ‘నేను అనుభూతి చెందాను’ లేదా ‘నేను గ్రహించాను’
  rationale: ἔγνων తెలుసుకోవడం లేదా గుర్తించడం అనే భావాన్ని ఇస్తుంది; అది ఏ విధమైన అంతర్గత అనుభూతి ద్వారా తెలిసిందో మూలపాఠం స్పష్టంగా చెప్పదు. అందువల్ల ఆ విధానాన్ని నిర్దేశించకుండా అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా, సాధారణ పాఠకులకు స్పష్టంగా రూపొందించబడింది. మూలంలోని వ్యతిరేక సంధిని ‘అయితే’తో, ప్రత్యక్ష వాక్యాన్ని సహజ తెలుగు పదక్రమంతో అందించాం.
