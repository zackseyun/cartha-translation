  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἕτερον ἔπεσεν εἰς τὴν γῆν τὴν ἀγαθήν, καὶ φυὲν ἐποίησεν καρπὸν ἑκατονταπλασίονα. ταῦτα λέγων ἐφώνει· Ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/008.yaml
  text: And another fell into the good soil[a], and when it grew, it produced fruit a hundredfold. As he said these things, he called out, “He who has ears to hear[c][b], let him hear.”
translation:
  language: te
  text: మరొకటి మంచి నేలలో[a] పడింది. అది పెరిగి నూరింతల పంటను ఇచ్చింది. ఆయన ఈ మాటలు చెబుతూ, “వినడానికి చెవులు ఉన్నవాడు వినాలి!” అని బిగ్గరగా పలికాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మంచి భూమిలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: మరొకటి
  rationale: విత్తనాన్ని సూచించే నపుంసక ఏకవచన రూపాన్ని, ఉపమానంలోని వరుసను సహజంగా కొనసాగించేలా అనువదించబడింది.
- source_word: γῆν τὴν ἀγαθήν
  choice: మంచి నేలలో
  rationale: వ్యవసాయ సందర్భంలో γῆ అనే పదానికి ‘నేల’ సహజమైన, స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: φυὲν
  choice: అది మొలిచి
  rationale: φύω యొక్క భూతకాల కృదంతం ప్రధాన క్రియకు ముందు జరిగిన మొలకెత్తడం లేదా పెరుగుదలను సూచిస్తుంది; ‘మొలిచి’ విత్తనం సందర్భంలో సహజంగా ఉంటుంది.
- source_word: ἐποίησεν καρπὸν ἑκατονταπλασίονα
  choice: నూరింతల ఫలాన్ని ఇచ్చింది
  rationale: అసాధారణంగా విస్తారమైన దిగుబడిని తెలిపే నూరింతల పరిమాణాన్ని, ఫలించడం అనే వ్యవసాయ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ταῦτα λέγων
  choice: ఆయన ఈ మాటలు చెబుతూ
  rationale: కృదంతం మరియు ప్రధాన క్రియ ఒకే సమయంలో జరుగుతున్న భావాన్ని ‘చెబుతూ’ సహజంగా నిలుపుతుంది.
- source_word: ἐφώνει
  choice: బిగ్గరగా పలికాడు
  rationale: φωνέω ఇక్కడ గట్టిగా, అందరికీ వినిపించేలా పలకడాన్ని సూచిస్తుంది; స్వరాన్ని అతిగా ‘అరిచాడు’గా చూపకుండా ఉద్ఘాటనను నిలుపుతుంది.
- source_word: Ὁ ἔχων ὦτα ἀκούειν ἀκουέτω
  choice: వినడానికి చెవులు ఉన్నవాడు వినాలి
  rationale: ఆజ్ఞార్థక పిలుపును సహజమైన తెలుగు రూపంలో నిలుపుతూ, ‘ఉన్నవాడు’ను సాధారణ ప్రతినిధి అర్థంలో ఉపయోగిస్తుంది.
theological_decisions:
- issue: యేసు చేసిన సాధారణ ప్రతినిధి పిలుపు
  choice: వినడానికి చెవులు ఉన్నవాడు వినాలి
  alternative: వినడానికి చెవులు ఉన్న ప్రతివాడూ వినాలి
  rationale: గ్రీకు వాక్యం ఏకవచన ప్రతినిధి నిర్మాణాన్ని ఉపయోగిస్తుంది. ‘ఉన్నవాడు’ ఆ ఏకవచన బలాన్ని నిలుపుతుంది; ఇది పురుషులకు మాత్రమే పరిమితమైన అర్థాన్ని తెలుగులో తప్పనిసరిగా సూచించదు.
- issue: ἀκουέτω అనే మూడవ పురుష ఏకవచన ఆజ్ఞార్థకం
  choice: వినాలి
  alternative: వినుగాక
  rationale: ‘వినాలి’ ఆధునిక సాధారణ తెలుగులో గంభీరమైన ఆజ్ఞ లేదా ప్రబోధాన్ని సహజంగా తెలియజేస్తుంది; ‘వినుగాక’ మరింత సంప్రదాయబద్ధమైన రూపం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి ఉపయోగించబడింది. విత్తనం సందర్భంలో ‘నేల’, ‘మొలిచి’, ‘ఫలాన్ని ఇచ్చింది’ వంటి సాధారణ వ్యవసాయ పదాలు ఎంచుకోబడ్డాయి; చివరి పిలుపులోని గంభీరతను ‘బిగ్గరగా పలికాడు’ మరియు ‘వినాలి’ నిలుపుతున్నాయి.
