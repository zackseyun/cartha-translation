revisions:
- from: మరొకటి మంచి నేలలో[a] పడింది. అది మొలిచి, నూరింతల ఫలాన్ని ఇచ్చింది. ఆయన ఈ మాటలు చెబుతూ, “వినడానికి చెవులు ఉన్నవాడు వినాలి!” అని బిగ్గరగా పలికాడు.
  to: మరొకటి మంచి నేలలో[a] పడింది. అది పెరిగి నూరింతల పంటను ఇచ్చింది. ఆయన ఈ మాటలు చెబుతూ, “వినడానికి చెవులు ఉన్నవాడు వినాలి!” అని బిగ్గరగా పలికాడు.
