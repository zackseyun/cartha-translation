revisions:
- from: ఆయన ఇంకా మాట్లాడుతుండగా, సమాజమందిరపు నాయకుని దగ్గరనుంచి[a] ఒకరు వచ్చి, “నీ కుమార్తె చనిపోయింది; ఇక బోధకుణ్ణి ఇబ్బంది పెట్టవద్దు[b]” అన్నారు.
  to: ఆయన ఇంకా మాట్లాడుతుండగా, సమాజమందిరపు నాయకుని వద్దనుంచి ఒక వ్యక్తి వచ్చి, “నీ కుమార్తె చనిపోయింది; ఇక గురువును ఇబ్బంది పెట్టవద్దు” అని చెప్పాడు.
  rationale: 'The revision improves idiomatic modern Telugu and keeps the Greek syntax and sense intact: a single unidentified messenger comes from Jairus, reports that the daughter has died, and advises that the teacher should no longer be troubled. Footnote anchors should remain on “సమాజమందిరపు నాయకుని వద్దనుంచి” (a) and “ఇబ్బంది పెట్టవద్దు” (b). The English audit trail’s footnote anchor placement appears inconsistent with its stated alternatives, but the Telugu footnote set is anchored to the relevant words.'
