id: LUK.8.49
reference: Luke 8:49
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχεταί τις παρὰ τοῦ ἀρχισυναγώγου ⸀λέγων ὅτι Τέθνηκεν ἡ θυγάτηρ σου, ⸀μηκέτι σκύλλε τὸν διδάσκαλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/049.yaml
  text: While he was still speaking[a], someone came from the synagogue leader, saying, “Your daughter has died[b]; do not trouble the teacher any longer.”
translation:
  language: te
  text: ఆయన ఇంకా మాట్లాడుతుండగా, సమాజమందిరపు నాయకుని వద్దనుంచి ఒక వ్యక్తి వచ్చి, “నీ కుమార్తె చనిపోయింది; ఇక గురువును ఇబ్బంది పెట్టవద్దు” అని చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: ఆయన ఇంకా మాట్లాడుతుండగా
  rationale: జనిటివ్ అబ్సల్యూట్ సమకాలీన చర్యను తెలియజేస్తుంది; ἔτι లోని ‘ఇంకా’ అనే కాలభావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἔρχεταί τις
  choice: ఒకరు వచ్చి
  rationale: కథనంలోని చారిత్రక వర్తమాన కాలాన్ని తెలుగులో సహజమైన భూతకాలంగా ఇచ్చాం. τις అనిర్దిష్ట వ్యక్తిని సూచిస్తుంది; గౌరవపూర్వకమైన ‘ఒకరు’ లింగాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: παρὰ τοῦ ἀρχισυναγώγου
  choice: సమాజమందిరపు నాయకుని దగ్గరనుంచి
  rationale: παρά + షష్ఠీ విభక్తి మూలాన్ని లేదా ఎవరినుంచి వచ్చారో సూచిస్తుంది. ἀρχισυνάγωγος సమాజమందిరాన్ని పర్యవేక్షించే నాయకుడిని సూచిస్తుంది.
- source_word: λέγων
  choice: అన్నారు
  rationale: సందేశంలోని మాటలను పరిచయం చేసే కృదంతాన్ని తెలుగులో సహజమైన ప్రధాన క్రియగా ఇచ్చాం.
- source_word: Τέθνηκεν
  choice: చనిపోయింది
  rationale: గ్రీకు పర్ఫెక్ట్ మరణం సంభవించి, దాని ఫలితస్థితి కొనసాగుతోందని సూచిస్తుంది. సందర్భంలో ‘చనిపోయింది’ ఈ రెండు భావాలను సహజంగా తెలియజేస్తుంది.
- source_word: ἡ θυγάτηρ σου
  choice: నీ కుమార్తె
  rationale: మూలంలోని ప్రత్యక్ష సంబోధనను, స్వామ్యసూచనను సరళంగా నిలుపుతుంది.
- source_word: μηκέτι
  choice: ఇక
  rationale: ఈ దశ నుంచి ఆ చర్యను కొనసాగించవద్దనే నిలుపుదల భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: σκύλλε
  choice: ఇబ్బంది పెట్టవద్దు
  rationale: σκύλλω ఇక్కడ ఎవరినైనా శ్రమకు లేదా ఇబ్బందికి గురిచేయడం అనే భావంలో ఉంది. ఈ ఎంపిక ఆధునిక తెలుగులో స్పష్టంగా ఉండి, మాటలోని గౌరవభావాన్ని నిలుపుతుంది.
- source_word: τὸν διδάσκαλον
  choice: బోధకుణ్ణి
  rationale: διδάσκαλος యొక్క సాధారణ అర్థం ‘బోధకుడు/ఉపదేశకుడు.’ ఇక్కడ మూలంలో లేని ఉన్నత బిరుదును చేర్చకుండా సాధారణ బిరుదుగానే అనువదించాం.
theological_decisions:
- issue: యాయీరు సంబంధంగా ἀρχισυνάγωγος పదవి పేరు
  choice: సమాజమందిరపు నాయకుడు
  alternative: సమాజమందిరపు అధికారి
  rationale: ఇది మతసిద్ధాంతపరమైన బిరుదు కాక సంస్థాగత బాధ్యతను సూచించే పదం. ‘నాయకుడు’ ఆధునిక పాఠకులకు పాత్రను స్పష్టంగా తెలియజేస్తుంది; తరువాతి సంఘపాలనా పదజాలాన్ని ఇందులోకి తీసుకురాదు.
- issue: διδάσκαλος అనువాదం
  choice: బోధకుడు
  alternative: గురువు
  rationale: గ్రీకు పదం సాధారణంగా బోధించే వ్యక్తిని సూచిస్తుంది. ‘బోధకుడు’ మూలంలోని సాధారణ బిరుదును నిలుపుతూ, ఈ వాక్యంలో స్పష్టంగా లేని అదనపు క్రీస్తుతత్వ భావాన్ని బలవంతంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన కథనశైలి, అయితే సందర్భానికి తగిన గంభీరతను నిలుపుకుంది. గ్రీకు వాక్యంలోని కాలసంబంధం, సందేశపు ఆకస్మికత, మరణం వల్ల ఏర్పడిన పరిస్థితి యథాతథంగా వ్యక్తమయ్యాయి.
