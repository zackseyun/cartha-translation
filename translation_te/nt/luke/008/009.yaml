  terminology: ‘శిష్యులు’ మరియు ‘ఉపమానం’ సువార్తా సందర్భానికి స్థిరమైన, సముచితమైన పదాలు. గౌరవసూచకమైన ‘ఆయన’ వాడకం స్థిరంగా ఉంది. పాదటిప్పణి εἴηతో కూడిన మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని తగిన విధంగా సూచిస్తుంది.
