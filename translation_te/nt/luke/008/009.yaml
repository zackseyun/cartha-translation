translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే ప్రత్యక్ష ప్రశ్నా నిర్మాణం ఉపయోగించబడింది. మూలంలోని పరోక్ష ప్రశ్నను తెలుగులో సహజమైన ప్రత్యక్ష ప్రశ్నగా మార్చినా, అర్థభేదాన్ని పాదటిప్పణిలో నిలిపాం.
