revisions:
- from: బండ మీద పడిన విత్తనాలు ఎవరంటే, వాక్యాన్ని విన్నప్పుడు దాన్ని సంతోషంగా స్వీకరించేవారు. అయితే వీరికి వేరు ఉండదు. వీరు కొంతకాలం నమ్ముతారు; పరీక్ష సమయం వచ్చినప్పుడు[a] తొలగిపోతారు.
  to: బండ నేల మీదివారు ఎవరంటే, వారు విన్నప్పుడు వాక్యాన్ని సంతోషంతో స్వీకరిస్తారు. అయితే వీరికి వేరు లేదు. వీరు కొంతకాలం నమ్ముతారు; పరీక్ష సమయంలో[a] వైదొలగిపోతారు.
  rationale: The revision preserves the Greek image without unnecessarily supplying “seeds,” makes the people-reference clear and natural in Telugu, and strengthens the final verb to communicate departure from belief. It retains “నమ్ముతారు” as theologically neutral and keeps the lexical breadth of πειρασμός in the footnote.
  reviewer_model: gpt-5.6-terra
