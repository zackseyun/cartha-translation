  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ ἐπὶ τῆς πέτρας οἳ ὅταν ἀκούσωσιν μετὰ χαρᾶς δέχονται τὸν λόγον, καὶ οὗτοι ῥίζαν οὐκ ἔχουσιν, οἳ πρὸς καιρὸν πιστεύουσιν καὶ ἐν καιρῷ πειρασμοῦ ἀφίστανται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/013.yaml
  text: And the ones on the rock are those who[a], when they hear, receive the word with joy. But these have no root; they believe for a time, and in a time of testing they fall away.
translation:
  language: te
  text: బండ నేల మీదివారు ఎవరంటే, వారు విన్నప్పుడు వాక్యాన్ని సంతోషంతో స్వీకరిస్తారు. అయితే వీరికి వేరు లేదు. వీరు కొంతకాలం నమ్ముతారు; పరీక్ష సమయంలో[a] వైదొలగిపోతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శోధన సమయంలో” లేదా “కష్టపరీక్ష సమయంలో.” గ్రీకు పదం సందర్భాన్ని బట్టి పరీక్షను, కష్టపరీక్షను, లేదా ప్రలోభాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῆς πέτρας
  choice: బండ మీద పడిన విత్తనాలు
  rationale: గ్రీకు వాక్యంలో ఉన్న ‘బండ మీద’ అనే ఏకవచన, స్పష్టమైన దృశ్యాన్ని నిలుపుతూ, ఉపమాన సందర్భంలో తెలుగులో సూచితమైన విత్తనాలను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀκούσωσιν
  choice: విన్నప్పుడు
  rationale: ὅταν తో కూడిన సాధారణ కాలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μετὰ χαρᾶς
  choice: సంతోషంగా
  rationale: ఆనందంతో స్వీకరించడాన్ని సహజంగా, భావబలం కోల్పోకుండా వ్యక్తం చేస్తుంది.
- source_word: δέχονται τὸν λόγον
  choice: వాక్యాన్ని ... స్వీకరించేవారు
  rationale: δέχομαι యొక్క స్వీకరణ భావాన్నీ, λόγος యొక్క బైబిలు సంబంధమైన ‘వాక్యం’ వాడుకనూ నిలుపుతుంది.
- source_word: ῥίζαν οὐκ ἔχουσιν
  choice: వీరికి వేరు ఉండదు
  rationale: గ్రీకులోని ఏకవచన ‘వేరు’ రూపకాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: πρὸς καιρὸν
  choice: కొంతకాలం
  rationale: పరిమిత వ్యవధిని సహజమైన తెలుగులో స్పష్టంగా తెలుపుతుంది.
- source_word: πιστεύουσιν
  choice: నమ్ముతారు
  rationale: విశ్వాసం యొక్క స్వభావాన్ని సిద్ధాంతపరంగా ముందే నిర్ణయించకుండా πιστεύω ను నేరుగా అనువదిస్తుంది.
- source_word: ἐν καιρῷ πειρασμοῦ
  choice: పరీక్ష సమయం వచ్చినప్పుడు
  rationale: πειρασμός లోని పరీక్ష, శోధన, కష్టపరీక్ష అనే విస్తృత భావాన్ని ప్రధాన పాఠ్యంలో సాధ్యమైనంత వరకు నిలుపుతుంది; ఇతర భావసాధ్యతలు పాదసూచికలో ఉన్నాయి.
- source_word: ἀφίστανται
  choice: తొలగిపోతారు
  rationale: ముందు నమ్మిన స్థితి నుంచి వైదొలగడాన్ని తెలియజేస్తూ, ‘మతభ్రష్టులు అవుతారు’ వంటి సాంకేతిక లేదా సిద్ధాంతభారం గల పదాన్ని నివారిస్తుంది.
theological_decisions:
- issue: πιστεύουσιν తాత్కాలిక నమ్మకం నిజమైన రక్షణ విశ్వాసమా కాదా
  choice: ‘నమ్ముతారు’ అని తటస్థంగా అనువదించడం
  alternative: ‘పైపైకి నమ్ముతారు’ లేదా ‘నిజంగా విశ్వసించి తరువాత తొలగిపోతారు’
  rationale: వారు కొంతకాలం నమ్మి తరువాత తొలగిపోతారని వచనం చెబుతుంది; అయితే ఆ నమ్మకం యొక్క సిద్ధాంతపరమైన స్వభావాన్ని అది ఇక్కడ తేల్చదు. అందువల్ల అంతర్లీన ఉద్రిక్తతను అలాగే ఉంచాం.
- issue: πειρασμός యొక్క భావపరిధి
  choice: ప్రధాన పాఠ్యంలో ‘పరీక్ష’
  alternative: ‘శోధన’ లేదా ‘కష్టపరీక్ష’
  rationale: ఈ గ్రీకు పదం సందర్భానుసారం పరీక్ష, కష్టపరీక్ష, లేదా ప్రలోభపరిచే శోధనను సూచించగలదు. ‘పరీక్ష’ విస్తృతమైన ప్రధాన అనువాదం; ప్రత్యామ్నాయాలు పాదసూచికలో ఇవ్వబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఉపమానంలోని బండ, విత్తనం, వేరు రూపకాలను స్పష్టంగా నిలిపి, విశ్వాసం మరియు తొలగిపోవడం గురించిన సిద్ధాంతపరమైన ఉద్రిక్తతను పరిష్కరించకుండా ఉంచింది.
