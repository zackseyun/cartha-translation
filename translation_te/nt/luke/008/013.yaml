    text: లేదా, “శోధన సమయంలో” లేదా “కష్టపరీక్ష సమయంలో.” గ్రీకు పదం సందర్భాన్ని బట్టి పరీక్షను, కష్టపరీక్షను, లేదా ప్రలోభాన్ని సూచించవచ్చు.
    reason: lexical_alternative
