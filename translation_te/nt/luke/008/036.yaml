  text: ἀπήγγειλαν δὲ ⸀αὐτοῖς οἱ ἰδόντες πῶς ἐσώθη ὁ δαιμονισθείς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/036.yaml
  text: And those who had seen it reported to them how the demon-possessed man had been saved[a].
translation:
  language: te
  text: జరిగినదాన్ని చూసినవారు, దయ్యం పట్టినవాడు ఎలా రక్షించబడ్డాడో వారికి తెలియజేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దయ్యం పట్టినవాడు ఎలా స్వస్థపరచబడ్డాడో” లేదా “ఎలా విడిపించబడ్డాడో.” గ్రీకు క్రియ సందర్భాన్ని బట్టి రక్షించడం, స్వస్థపరచడం, లేదా విడిపించడం అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: తెలియజేశారు
  rationale: ἀπαγγέλλω అనే క్రియ ఇక్కడ చూసిన విషయాన్ని ఇతరులకు నివేదించడం లేదా చెప్పడం అనే భావాన్ని ఇస్తుంది. ‘తెలియజేశారు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: δὲ
  choice: వాక్య నిర్మాణంలోని విరామంతో సూచించబడింది
  rationale: δέ ఇక్కడ స్వల్ప కథన అనుసంధానకం. తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని చేర్చడం కంటే వాక్య ప్రవాహంలోనే దాని పని సహజంగా వ్యక్తమవుతుంది.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: నివేదికను విన్నవారిని సూచించే దత్తివాచక సర్వనామానికి నేరమైన తెలుగు రూపం.
- source_word: οἱ ἰδόντες
  choice: జరిగినదాన్ని చూసినవారు
  rationale: ఈ విశేషణాత్మక కృదంతం సంఘటనను ప్రత్యక్షంగా చూసినవారిని సూచిస్తుంది. గ్రీకులో కర్మ స్పష్టంగా లేకున్నా, తెలుగులో ‘జరిగినదాన్ని’ అనడం సందర్భసహజం; అనవసరంగా ‘ప్రత్యక్ష సాక్షులు’ అనే సాంకేతిక పదాన్ని రుద్దదు.
- source_word: πῶς
  choice: ఎలా
  rationale: సంఘటన జరిగిన విధానాన్ని లేదా దాని వాస్తవాన్ని పరిచయం చేసే సాధారణ, నేరమైన సమానార్థకం.
- source_word: ἐσώθη
  choice: రక్షించబడ్డాడో
  rationale: σῴζω యొక్క కర్మణి రూపం. ఈ సందర్భంలో స్వస్థత లేదా దయ్యపు పీడన నుంచి విముక్తి భావం ఉండవచ్చు; ప్రధాన పాఠంలో ‘రక్షించబడ్డాడు’ ఉంచడం మూలపదపు విస్తృత భావపరిధిని కాపాడుతుంది.
- source_word: ὁ δαιμονισθείς
  choice: దయ్యం పట్టినవాడు
  rationale: దయ్యపు ప్రభావానికి లోనైన పురుషుణ్ని సూచించే substantival participle. ‘దయ్యం పట్టినవాడు’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అర్థమయ్యే, సందర్భానికి తగిన రూపం.
theological_decisions:
- issue: దయ్యపు పీడన నుంచి విముక్తి సందర్భంలో ἐσώθη (σῴζω) అనువాదం
  choice: రక్షించబడ్డాడో
  alternative: స్వస్థపరచబడ్డాడో; విడిపించబడ్డాడో
  rationale: గ్రీకు క్రియ రక్షించడం, స్వస్థపరచడం, విడిపించడం అనే భావాలను సందర్భానుసారం కలిగి ఉంటుంది. ప్రధాన పాఠంలోని ‘రక్షించబడ్డాడు’ ఆ పదపు విస్తృతమైన భావాన్ని నిలుపుతుంది; సందర్భానికి సాధ్యమైన ‘స్వస్థపరచబడ్డాడు’, ‘విడిపించబడ్డాడు’ రూపాలను పాదసూచికలో ఇవ్వడం ద్వారా భావాన్ని ఒక్క సిద్ధాంతపరమైన అర్థానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘దయ్యం పట్టినవాడు’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది. మూలంలోని πῶς‌ను ‘ఎలా’గా, σῴζω పదంలోని ఉద్దేశపూర్వక భావవిస్తృతిని ప్రధాన పాఠం మరియు పాదసూచిక కలిపి నిలుపుకున్నాయి.
