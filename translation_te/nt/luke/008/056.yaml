- from: ఆమె తల్లిదండ్రులు ఆశ్చర్యంతో మునిగిపోయారు[a]. అయితే జరిగినదాన్ని ఎవరికీ చెప్పవద్దని ఆయన వారికి ఆజ్ఞాపించాడు[b].
  to: ఆమె తల్లిదండ్రులు ఎంతో ఆశ్చర్యపోయారు[a]. అయితే, జరిగిన సంగతి ఎవరికీ చెప్పవద్దని ఆయన వారికి ఆజ్ఞాపించాడు[b][c].
  rationale: The revision replaces an unnecessarily figurative expression for the parents' astonishment with natural standard Telugu, while retaining the strong reaction expressed by ἐξέστησαν. It preserves the mild narrative contrast of δέ, the directive force of παρήγγειλεν, the unrestricted 'no one,' and the neutral wording of the event without explaining the motive or duration of the command. Footnote anchors now cover the documented lexical alternatives for astonishment, the directive, and the event.
