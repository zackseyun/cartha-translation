id: LUK.8.56
reference: Luke 8:56
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐξέστησαν οἱ γονεῖς αὐτῆς· ὁ δὲ παρήγγειλεν αὐτοῖς μηδενὶ εἰπεῖν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/056.yaml
  text: And her parents were astonished[c][b][a], but he instructed them to tell no one what had happened.
translation:
  language: te
  text: ఆమె తల్లిదండ్రులు ఎంతో ఆశ్చర్యపోయారు[a]. అయితే, జరిగిన సంగతి ఎవరికీ చెప్పవద్దని ఆయన వారికి ఆజ్ఞాపించాడు[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విస్మయచకితులయ్యారు” లేదా “తమను తాము మరచిపోయినంతగా ఆశ్చర్యపోయారు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆదేశించాడు” లేదా “నిర్దేశించాడు.”
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “జరిగినది” లేదా “జరిగిన సంఘటన.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  choice: ఆశ్చర్యంతో మునిగిపోయారు
  rationale: ఈ సందర్భంలో క్రియ తీవ్రమైన ఆశ్చర్యానికి లోనవడాన్ని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం ఆ స్పందన తీవ్రతను సహజంగా తెలియజేస్తుంది.
- source_word: γονεῖς
  choice: తల్లిదండ్రులు
  rationale: γονεῖς అనే సాధారణ బహువచన పదానికి ఆధునిక తెలుగులో నేరుగా సరిపడే పదం.
- source_word: παρήγγειλεν
  choice: ఆజ్ఞాపించాడు
  rationale: παραγγέλλω ఇక్కడ అధికారపూర్వకమైన నిర్దేశాన్ని సూచిస్తుంది. 'ఆజ్ఞాపించాడు' నిషేధంలోని బలాన్ని నిలుపుతుంది; అనవసరంగా కఠినత్వాన్ని చేర్చదు.
- source_word: μηδενὶ
  choice: ఎవరికీ
  rationale: నిషేధార్థక క్రియతో కలిసి 'ఎవరికీ చెప్పవద్దు' అనేది μηδενὶ యొక్క సహజమైన తెలుగు రూపం.
- source_word: εἰπεῖν
  choice: చెప్పవద్దని
  rationale: వ్యక్తిని పరోక్ష కర్మగా తీసుకున్న ఈ సందర్భంలో 'చెప్పడం' అనేది సహజమైన సంభాషణార్థక అనువాదం.
- source_word: τὸ γεγονός
  choice: జరిగినదాన్ని
  rationale: పూర్తికృదంతం నామవాచకంగా వాడబడి జరిగిన సంఘటనను సూచిస్తుంది. 'జరిగినదాన్ని' సంక్షిప్తంగా, సహజంగా ఆ అర్థాన్ని అందిస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: తల్లిదండ్రుల ఆశ్చర్యానికి, ఆ తరువాత ఆయన ఇచ్చిన నిర్దేశానికి మధ్యనున్న స్వల్ప వ్యత్యాసాన్ని సహజంగా చూపిస్తుంది.
theological_decisions:
- issue: మెస్సీయ సంబంధిత రహస్య భావన / యేసు ఆదేశపు పరిధి
  choice: జరిగినదాన్ని ఎవరికీ చెప్పవద్దనే ఆదేశంగా నేరుగా అనువదించడం
  alternative: దీనిని విస్తృతమైన 'మెస్సీయ రహస్య' సిద్ధాంతంతో అనుసంధానించడం, లేదా ఆదేశం తాత్కాలికమని లేదా పరిమిత వర్గానికేనని స్పష్టీకరించడం
  rationale: ఈ వచనం ఆ ఆదేశానికి కారణమో కాలపరిమితియో చెప్పదు. అందువల్ల అనువాదం ఎటువంటి సిద్ధాంతపరమైన వివరణను చేర్చకుండా వాక్యంలోని ఉద్వేగాన్ని, అనిశ్చితిని అలాగే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని స్వల్ప వ్యత్యాసాన్ని 'అయితే' ద్వారా, ఆదేశ బలాన్ని 'ఆజ్ఞాపించాడు' ద్వారా నిలిపాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
