  naturalness: తల్లిదండ్రులు ఎంతో ఆశ్చర్యపోయారు is clear, modern standard Telugu narrative prose and conveys the strong reaction naturally. జరిగిన సంగతి is an idiomatic way to refer to 'what had happened.'
