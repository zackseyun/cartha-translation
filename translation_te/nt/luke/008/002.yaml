id: LUK.8.2
reference: Luke 8:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ γυναῖκές τινες αἳ ἦσαν τεθεραπευμέναι ἀπὸ πνευμάτων πονηρῶν καὶ ἀσθενειῶν, Μαρία ἡ καλουμένη Μαγδαληνή, ἀφ’ ἧς δαιμόνια ἑπτὰ ἐξεληλύθει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/002.yaml
  text: 'and some women who had been healed from evil spirits and sicknesses: Mary[a], called Magdalene, from whom seven demons had gone out[b],'
translation:
  language: te
  text: 'దుష్టాత్మల నుండీ రోగాల నుండీ స్వస్థత పొందిన కొందరు స్త్రీలు కూడా ఆయనతో ఉన్నారు: మగ్దలేనే అని పిలువబడే మరియ, ఆమె నుండి ఏడు దయ్యాలు వెళ్లిపోయి ఉండేవి,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυναῖκές τινες
  choice: కొందరు స్త్రీలు
  rationale: τινες బహువచన నామవాచకంతో కలిసి నిర్దిష్టంగా పేర్కొనని ఒక ఉపసమూహాన్ని సూచిస్తుంది; ‘కొందరు స్త్రీలు’ సహజమైన ఆధునిక తెలుగు.
- source_word: τεθεραπευμέναι
  choice: స్వస్థత పొందిన
  rationale: ἦσαν తో కూడిన perfect passive participle, ఇంతకు ముందు జరిగిన స్వస్థతను మరియు దాని కొనసాగుతున్న ఫలితాన్ని సూచిస్తుంది; తెలుగు వాక్య నిర్మాణంలో ‘స్వస్థత పొందిన’ సహజంగా ఉంటుంది.
- source_word: ἀπὸ πνευμάτων πονηρῶν
  choice: దుష్టాత్మల నుండి
  rationale: πονηρός అంటే దుష్టమైన/చెడ్డది; మూలంలో ἀκάθαρτος లేదు కాబట్టి ‘అపవిత్రాత్మలు’ అని మార్చకుండా ‘దుష్టాత్మలు’ అని అనువదించాం.
- source_word: καὶ ἀσθενειῶν
  choice: రోగాల నుండి
  rationale: ἀσθένεια ఇక్కడ శారీరక అనారోగ్యాలను సూచిస్తుంది; ‘రోగాలు’ స్పష్టమైన, సాధారణ తెలుగు పదం.
- source_word: ἡ καλουμένη Μαγδαληνή
  choice: మగ్దలేనే అని పిలువబడే
  rationale: καλουμένη మరియకు ఉన్న గుర్తింపు పేరును తెలియజేస్తుంది; స్థలనామంతో సంబంధమున్న గ్రీకు రూపాన్ని పేరుగానే ఉంచాం.
- source_word: ἀφ’ ἧς
  choice: ఆమె నుండి
  rationale: ἀπό విడిపోవడం లేదా బయటికి వెళ్లడాన్ని సూచిస్తుంది; తెలుగులో ‘ఆమె నుండి’ సహజంగా ఉండి మూల సంబంధాన్ని కాపాడుతుంది.
- source_word: δαιμόνια ἑπτὰ
  choice: ఏడుగురు దయ్యాలు
  rationale: δαιμόνια ప్రత్యేకంగా దయ్యాలను సూచిస్తుంది; ముందు వచ్చిన విస్తృతమైన ‘దుష్టాత్మలు’ అనే పదంతో దీని భేదాన్ని నిలిపాం. వ్యక్తిగత ఆత్మిక సత్తలను సూచిస్తూ తెలుగు వాడుకకు అనుగుణంగా ‘ఏడుగురు’ వాడాం.
- source_word: ἐξεληλύθει
  choice: వెళ్లిపోయాయి
  rationale: ἐξέρχομαι యొక్క pluperfect రూపం కథన సమయానికి ముందే అవి బయటికి వెళ్లిపోయిన పూర్తయిన సంఘటనను సూచిస్తుంది; ‘వెళ్లిపోయాయి’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: దయ్యాల వల్ల కలిగిన బాధను సూచించే భాష
  choice: ‘దుష్టాత్మలు,’ ‘దయ్యాలు’ అనే వ్యక్తిగత ఆత్మిక సత్తలను సూచించే భాషను నిలిపాం.
  alternative: మానసిక లేదా శారీరక రుగ్మతలకు రూపకాలుగా మార్చడం.
  rationale: గ్రీకు పాఠం πνεύματα πονηρά, δαιμόνια అనే ఆత్మిక బాధలను ἀσθένειαι అనే రోగాల నుండి వేరుగా పేర్కొంటుంది. అనువాదం అదనపు వివరణ లేకుండా ఆ భేదాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఈ వచనం ముందు, తరువాతి వచనాలతో కలిసే వాక్య భాగం కావడంతో చివర డ్యాష్ ఉంచబడింది. మూలంలో లేని పాఠభేద సూచనలను చేర్చలేదు; అందువల్ల పాదటిప్పణులు లేవు.
