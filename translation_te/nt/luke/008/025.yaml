id: LUK.8.25
reference: Luke 8:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· ⸀Ποῦ ἡ πίστις ὑμῶν; φοβηθέντες δὲ ἐθαύμασαν, λέγοντες πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ τοῖς ἀνέμοις ἐπιτάσσει καὶ τῷ ὕδατι, καὶ ὑπακούουσιν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/025.yaml
  text: Then he said to them[a], “Where is your faith?” And being afraid, they marveled, saying to one another, “Who then is this, that he commands even the winds and the water, and they obey him?”
translation:
  language: te
  text: అప్పుడు ఆయన వారితో, “మీ విశ్వాసం[a] ఎక్కడ ఉంది?” అన్నాడు. వారు భయపడి ఆశ్చర్యపోయి ఒకరితో ఒకరు, “అయితే ఈయన ఎవరు? గాలులకు, నీటికి సైతం ఆజ్ఞాపిస్తున్నాడు, అవి ఆయనకు లోబడుతున్నాయి!” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నమ్మకం.” యేసు ప్రశ్నను “మీ నమ్మకం ఎక్కడ ఉంది?” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῦ
  choice: ఎక్కడ ఉంది
  rationale: విశ్వాసం ఉనికి లేదా స్థానం గురించి అడిగే గ్రీకు ప్రశ్నలోని ప్రత్యక్షతను నిలుపుతుంది; ‘మీకు విశ్వాసం ఎందుకు లేదు?’ అనే వ్యాఖ్యానాత్మక విస్తరణను నివారిస్తుంది.
- source_word: πίστις
  choice: విశ్వాసం
  rationale: సందర్భంలో యేసుపై నమ్మకం అనే భావం ఉన్నప్పటికీ, విస్తృతమైన మరియు ప్రామాణికమైన అర్థాన్ని ‘విశ్వాసం’ నిలుపుతుంది.
- source_word: φοβηθέντες δὲ ἐθαύμασαν
  choice: వారు భయపడి ఆశ్చర్యపోతూ
  rationale: భయం మరియు ఆశ్చర్యం రెండింటినీ సహజమైన తెలుగు క్రియారూపాల్లో వ్యక్తపరుస్తూ, గ్రీకులోని సందర్భసూచక కృదంత భావాన్ని నిలుపుతుంది.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: ఈయన ఎవరు?
  rationale: ἄρα సూచించే విస్మయపూర్వక నిర్ధారణను సందర్భం మరియు ప్రశ్న స్వరమే తెలుగులో సహజంగా తెలియజేస్తాయి.
- source_word: ἐπιτάσσει
  choice: ఆజ్ఞాపిస్తున్నాడు
  rationale: ఈ వాక్యంలో ఉన్న ‘ఆజ్ఞాపించు’ అనే ప్రత్యక్ష భావాన్ని ఇస్తుంది; మునుపటి వాక్యంలోని ‘గద్దించు’ అనే పదాన్ని ఇక్కడికి దిగుమతి చేయదు.
- source_word: τοῖς ἀνέμοις ... καὶ τῷ ὕδατι
  choice: గాలులకు, నీటికి
  rationale: లూకా ఉపయోగించిన బహువచన ‘గాలులు’ మరియు ఏకవచన ‘నీరు’లను యథాశక్తి నేరుగా నిలుపుతుంది; ‘అలలు’ లేదా ‘సముద్రం’ అని వ్యాఖ్యానించదు.
- source_word: ὑπακούουσιν αὐτῷ
  choice: అవి ఆయనకు లోబడుతున్నాయి
  rationale: సృష్టి ఆయన ఆజ్ఞను పాటిస్తున్నదనే వ్యక్తీకృత విధేయతను సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ఈ సందర్భంలో πίστις పదానికి విశ్వాసం లేదా నమ్మకం అనే అనువాదం
  choice: విశ్వాసం
  alternative: నమ్మకం
  rationale: ‘విశ్వాసం’ మూలపదపు విస్తృత ధార్మిక మరియు సంబంధాత్మక పరిధిని నిలుపుతుంది; ప్రమాద సమయంలో యేసుపై నమ్మకం అనే సందర్భార్థాన్ని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ప్రత్యక్ష ప్రశ్నను, భయం-ఆశ్చర్యం కలిసిన ప్రతిస్పందనను, ‘గాలులు మరియు నీరు’ అనే లూకా పదప్రయోగాన్ని నిలిపింది.
