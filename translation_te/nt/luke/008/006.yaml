  text: καὶ ἕτερον ⸀κατέπεσεν ἐπὶ τὴν πέτραν, καὶ φυὲν ἐξηράνθη διὰ τὸ μὴ ἔχειν ἰκμάδα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/006.yaml
  text: And another fell on the rock[a], and after it sprang up, it withered because it had no moisture.
translation:
  language: te
  text: మరొకటి బండమీద[a] పడింది. అది మొలిచిన తర్వాత, తేమ లేకపోవడంతో ఎండిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ బండమీద.’ గ్రీకులో ‘బండ’ ఏకవచనంలో ఉంది; ‘రాతినేల’ అనే విస్తృత పదబంధానికి బదులు విత్తనం బండ ఉపరితలంపై పడిన దృశ్యాన్ని ఇది నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: మరొకటి
  rationale: నపుంసక ఏకవచన విశేషణం ఇక్కడ నామవాచకంగా వాడబడింది; ఉపమానంలోని తదుపరి విత్తనాన్ని సహజంగా సూచిస్తుంది.
- source_word: κατέπεσεν
  choice: పడింది
  rationale: καταπίπτω యొక్క భూతకాల రూపం విత్తనం పడటాన్ని సూటిగా తెలియజేస్తుంది; తెలుగులో అదనపు బలార్థం అవసరం లేదు.
- source_word: ἐπὶ τὴν πέτραν
  choice: బండమీద
  rationale: πέτρα ఏకవచనంలోని ‘బండ’; ‘రాతినేల’ అనే విస్తృత భావాన్ని చేర్చకుండా మూలంలోని స్పష్టమైన దృశ్యాన్ని నిలుపుతుంది.
- source_word: φυὲν
  choice: అది మొలిచిన తర్వాత
  rationale: φύω యొక్క భూతకాల కృదంతం ప్రధాన క్రియకు ముందున్న కాలక్రమాన్ని సూచిస్తుంది; విత్తన సందర్భంలో ‘మొలిచిన’ సహజమైన తెలుగు.
- source_word: ἐξηράνθη
  choice: ఎండిపోయింది
  rationale: మొక్క తేమ కోల్పోయి వాడిపోవడాన్ని ఈ సందర్భంలో సహజంగా తెలియజేస్తుంది; గ్రీకు నిష్క్రియాత్మక రూపానికి ఇక్కడ అకర్మక ఫలితార్థం ఉంది.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: లేకపోవడంతో
  rationale: διά తో కూడిన నామీకృత infinitive కారణాన్ని వ్యక్తం చేస్తుంది; తెలుగు కారణార్థక నిర్మాణం దాన్ని సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది.
- source_word: ἰκμάδα
  choice: తేమ
  rationale: మొక్క ఎదుగుదలకు అవసరమైన తడిని సూచించే సరళమైన, సందర్భోచిత ఆధునిక తెలుగు పదం.
