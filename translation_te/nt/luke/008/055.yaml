id: LUK.8.55
reference: Luke 8:55
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐπέστρεψεν τὸ πνεῦμα αὐτῆς, καὶ ἀνέστη παραχρῆμα, καὶ διέταξεν αὐτῇ δοθῆναι φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/055.yaml
  text: And her spirit returned[a], and she rose immediately[b], and he directed that food be given to her.
translation:
  language: te
  text: ఆమె ఆత్మ తిరిగి వచ్చింది[a]. వెంటనే ఆమె లేచింది. ఆమెకు తినడానికి ఏమైనా ఇవ్వాలని ఆయన ఆదేశించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమె ఊపిరి తిరిగి వచ్చింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: తిరిగి వచ్చింది
  rationale: ἐπιστρέφω ఇక్కడ బాలిక జీవం పునరుద్ధరింపబడిన సందర్భంలో ‘తిరిగి రావడం’ అనే సహజమైన భావాన్ని ఇస్తుంది.
- source_word: τὸ πνεῦμα αὐτῆς
  choice: ఆమె ఆత్మ
  rationale: πνεῦμαకు ‘ఆత్మ’ లేదా ‘ఊపిరి’ అనే అర్థాలు సాధ్యమైనా, మరణం నుండి లేపబడిన ఈ సందర్భంలో ‘ఆమె ఆత్మ’ మూలపాఠంలోని విస్తృతమైన భావాన్నీ ధార్మిక ఉద్వేగాన్నీ కాపాడుతుంది.
- source_word: ἀνέστη
  choice: ఆమె లేచింది
  rationale: ἀνίστημι సూచించే లేవడం అనే శారీరక చర్యను ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: παραχρῆμα
  choice: వెంటనే
  rationale: అద్భుతం జరిగిన తక్షణత్వాన్ని స్పష్టంగా తెలియజేసే సహజ తెలుగు పదం.
- source_word: διέταξεν
  choice: ఆదేశించాడు
  rationale: διατάσσωలోని అధికారపూర్వక సూచన భావాన్ని అతిగా కఠినం చేయకుండా తెలియజేస్తుంది.
- source_word: αὐτῇ δοθῆναι φαγεῖν
  choice: ఆమెకు తినడానికి ఏమైనా ఇవ్వాలని
  rationale: δοθῆναι మరియు φαγεῖν రెండింటినీ స్పష్టంగా ప్రతిబింబిస్తూ, తెలుగులో సహజమైన పరోక్ష ఆజ్ఞ నిర్మాణాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: పునరుజ్జీవ సందర్భంలో πνεῦμα అర్థం
  choice: ఆమె ఆత్మ తిరిగి వచ్చింది
  alternative: ఆమె ఊపిరి తిరిగి వచ్చింది
  rationale: ‘ఆత్మ’ అనే ఎంపిక πνεῦμα యొక్క విస్తృత భావాన్నీ కథనంలోని మరణం నుండి జీవానికి తిరిగివచ్చే సందర్భాన్నీ కాపాడుతుంది; ‘ఊపిరి’ కూడా పదార్థపరంగా సాధ్యమే కాబట్టి పాదసూచికలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని వరుస చర్యలను స్పష్టమైన తెలుగు వాక్యాలుగా ఇచ్చి, πνεῦμαలోని నిజమైన అర్థసందిగ్ధతను పాదసూచికలో నిలిపాం.
