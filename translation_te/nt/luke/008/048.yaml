source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· πορεύου εἰς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/048.yaml
  text: But he said to her[a], “Daughter, your faith has saved you; go in peace.”
translation:
  language: te
  text: అయితే ఆయన ఆమెతో, “కుమార్తె, నీ విశ్వాసం నిన్ను రక్షించింది[a]; సమాధానంతో వెళ్లు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిన్ను బాగుచేసింది,” లేదా “నిన్ను స్వస్థపరిచింది.” గ్రీకు క్రియ రక్షణను మాత్రమే కాక, స్వస్థపరచడాన్ని కూడా సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: Θυγάτηρ
  choice: కుమారీ
  rationale: సంబోధన రూపంలోని ‘కుమార్తె’ భావాన్ని సహజమైన, ఆప్యాయమైన ఆధునిక తెలుగు సంబోధనగా అందిస్తుంది; ‘స్త్రీ’ అనే అనువాదం మూలంలోని బంధసూచక సున్నితత్వాన్ని కోల్పోతుంది.
- source_word: πίστις
  choice: విశ్వాసం
  rationale: ఈ సందర్భంలో యేసుపై ఆమె ఉంచిన నమ్మకాన్ని సూచిస్తూ, పదంలోని ధార్మిక ప్రాధాన్యాన్ని కూడా నిలుపుతుంది.
- source_word: σέσωκέν
  choice: రక్షించింది
  rationale: σῴζω పదానికి శారీరక స్వస్థతతోపాటు విస్తృతమైన రక్షణ భావం ఉండగలదు. ప్రధాన పాఠంలో విస్తృత భావాన్ని నిలిపి, సందర్భానుగుణమైన స్వస్థత భావాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: πορεύου
  choice: వెళ్లు
  rationale: ఆజ్ఞార్థక క్రియకు సహజమైన, సంక్షిప్తమైన ఆధునిక తెలుగు రూపం.
- source_word: εἰς εἰρήνην
  choice: సమాధానంతో
  rationale: వెళ్లేటప్పుడు సమాధానం ఆమెతో ఉండాలనే ఆశీర్వాద భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; అక్షరార్థమైన ‘సమాధానంలోకి’ ఇక్కడ అసహజంగా ఉంటుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి భయభక్తులతో కూడిన ఒప్పుకోలుకు యేసు ఇచ్చిన ఆదరణభరిత సమాధానాన్ని స్వల్ప వ్యత్యాసంతో కలిపే సంధిగా పనిచేస్తుంది.
theological_decisions:
- issue: స్వస్థత సందర్భంలో σῴζω పద పరిధి
  choice: ప్రధాన పాఠంలో ‘రక్షించింది’
  alternative: ‘బాగుచేసింది’ లేదా ‘స్వస్థపరిచింది’
  rationale: ఈ సంఘటనలో శారీరక స్వస్థత స్పష్టంగా ఉన్నప్పటికీ, మూలపదం దానికంటే విస్తృతమైన రక్షణ భావాన్ని కూడా మోయగలదు. ‘రక్షించింది’ ఆ భావవిస్తృతిని నిలుపుతుంది; స్వస్థత అనే సందర్భార్థాన్ని పాదటిప్పణి స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘కుమారీ’ ఆప్యాయ సంబోధనను నిలుపుతుంది. ‘సమాధానంతో వెళ్లు’ ఆశీర్వాదసూచక ప్రయాణ ఆజ్ఞను సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
