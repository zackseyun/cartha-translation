revisions:
- from: విత్తేవాడు తన విత్తనాన్ని విత్తడానికి బయలుదేరాడు. అతడు విత్తుతుండగా, కొంత విత్తనం దారి పక్కన పడింది. అది తొక్కబడింది; ఆకాశ పక్షులు దాన్ని మింగివేశాయి.
  to: విత్తేవాడు తన విత్తనాన్ని విత్తడానికి బయలుదేరాడు. అతడు విత్తుతుండగా, కొంత విత్తనం దారి పక్కన పడింది. అది తొక్కబడింది; ఆకాశ పక్షులు దాన్ని తినివేశాయి.
  rationale: 'A single lexical correction restores the explicit eating/devouring sense of κατέφαγεν without adding the more specific idea of swallowing. No footnote is necessary: “ఆకాశ పక్షులు” adequately renders τὰ πετεινὰ τοῦ οὐρανοῦ in natural Telugu.'
