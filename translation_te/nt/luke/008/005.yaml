id: LUK.8.5
reference: Luke 8:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐξῆλθεν ὁ σπείρων τοῦ σπεῖραι τὸν σπόρον αὐτοῦ. καὶ ἐν τῷ σπείρειν αὐτὸν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ κατεπατήθη καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/005.yaml
  text: The sower went out to sow his seed. And as he was sowing[a], some fell beside the path and was trampled, and the birds of the sky devoured it.
translation:
  language: te
  text: విత్తేవాడు తన విత్తనాన్ని విత్తడానికి బయలుదేరాడు. అతడు విత్తుతుండగా, కొంత విత్తనం దారి పక్కన పడింది. అది తొక్కబడింది; ఆకాశ పక్షులు దాన్ని తినివేశాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξῆλθεν
  choice: బయలుదేరాడు
  rationale: ἐξέρχομαι యొక్క భూతకాల రూపం ఇక్కడ బయటకు వెళ్లి కార్యానికి పూనుకోవడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘బయలుదేరాడు’ సహజంగా ఉంది.
- source_word: ὁ σπείρων
  choice: విత్తేవాడు
  rationale: నామవాచకంగా పనిచేసే ఈ కృదంతానికి ‘విత్తేవాడు’ సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: τοῦ σπεῖραι
  choice: విత్తడానికి
  rationale: చలన క్రియ తర్వాత వచ్చిన ఈ నిర్మాణం ఉద్దేశాన్ని తెలియజేస్తుంది.
- source_word: τὸν σπόρον αὐτοῦ
  choice: తన విత్తనాన్ని
  rationale: αὐτοῦ కర్తనే సూచిస్తున్నందున తెలుగులో ‘తన’ సహజం; σπόρος వ్యవసాయ సందర్భంలో ‘విత్తనం’.
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: అతడు విత్తుతుండగా
  rationale: ఈ నిర్మాణం ప్రధాన చర్యతో సమకాలంలో కొనసాగుతున్న చర్యను సూచిస్తుంది.
- source_word: ὃ μὲν
  choice: కొంత విత్తనం
  rationale: విత్తనంలోని ఒక భాగాన్ని పంపిణీ భావంతో సూచిస్తుంది; తెలుగులో సూచ్య నామవాచకాన్ని మళ్లీ చేర్చడం స్పష్టతనిస్తుంది.
- source_word: ἔπεσεν παρὰ τὴν ὁδόν
  choice: దారి పక్కన పడింది
  rationale: παρά ఇక్కడ దారి పక్కనున్న స్థానాన్ని సూచిస్తుంది; ఈ రూపం ఆధునిక తెలుగులో స్పష్టం.
- source_word: κατεπατήθη
  choice: తొక్కబడింది
  rationale: మూలంలోని కర్మణి రూపాన్ని, కర్తను పేర్కొనకుండా, తెలుగులోనూ నిలుపుతుంది.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: ఆకాశ పక్షులు
  rationale: ‘ఆకాశానికి చెందిన పక్షులు’ అనే మూల నుడికారాన్ని సహజమైన తెలుగు సమాసంతో నిలుపుతుంది.
- source_word: κατέφαγεν αὐτό
  choice: దాన్ని మింగివేశాయి
  rationale: κατεσθίωలోని పూర్తిగా తినివేయడం అనే బలమైన భావాన్ని ‘మింగివేశాయి’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే ఉపమాన కథకు తగిన గౌరవప్రదమైన శైలిలో అనువదించబడింది. మూలంలోని వరుస చర్యలు స్పష్టంగా ఉండేందుకు రెండో వాక్యాన్ని రెండు స్వతంత్ర భాగాలుగా విభజించాం; భావాన్ని జోడించలేదు.
