  verdict: revise
  source_fidelity: The draft accurately renders the lamp, container, bed, lampstand, and purpose clause. However, the Greek adversative ἀλλά ('but/rather') is not explicit in Telugu, and the punctuation leaves the contrast between the negative actions and the proper action less clear than in the source.
  naturalness: The wording is generally modern and clear. Adding an explicit adversative produces a more natural, coherent Telugu proverbial sentence and removes the abrupt shift after the semicolon.
  terminology: దీపం, పాత్ర, మంచం, దీపస్తంభం, and లోపలికి వచ్చేవారు are suitable modern-standard renderings. No theological terminology is involved.
  issues:
  - severity: medium
    issue: The explicit adversative ἀλλά is omitted.
    rationale: The source contrasts covering/placing under a bed with placing on a lampstand. The draft separates the clauses with a semicolon but does not state 'but/rather,' which should be represented for the source’s rhetorical contrast.
  revised_text: ఎవ్వరూ దీపం వెలిగించి దానిని ఒక పాత్రతో కప్పరు లేదా మంచం కింద పెట్టరు; కానీ లోపలికి వచ్చేవారు వెలుగును చూసేలా దానిని దీపస్తంభం మీద పెడతారు.
  revised_footnotes: []
  revision_rationale: The revision retains all of the draft’s sound lexical choices while explicitly translating the Greek adversative ἀλλά with కానీ. It also joins the two negative alternatives into one coherent construction and preserves the purpose clause without adding interpretation.
