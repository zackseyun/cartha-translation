id: LUK.8.16
reference: Luke 8:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐδεὶς δὲ λύχνον ἅψας καλύπτει αὐτὸν σκεύει ἢ ὑποκάτω κλίνης τίθησιν, ἀλλ’ ἐπὶ λυχνίας ⸀τίθησιν, ἵνα οἱ εἰσπορευόμενοι βλέπωσιν τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/016.yaml
  text: No one, after lighting a lamp, covers it with a container or puts it under a bed, but puts it on a lampstand, so that those who come in may see the light.
translation:
  language: te
  text: ఎవ్వరూ దీపం వెలిగించి దానిని ఒక పాత్రతో కప్పరు లేదా మంచం కింద పెట్టరు; కానీ లోపలికి వచ్చేవారు వెలుగును చూసేలా దానిని దీపస్తంభం మీద పెడతారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύχνον
  choice: దీపం
  rationale: నూనె దీపాన్ని సూచించే గ్రీకు పదానికి సహజమైన, విస్తృతంగా అర్థమయ్యే తెలుగు సమానం.
- source_word: σκεύει
  choice: ఒక పాత్రతో
  rationale: σκεῦος అనేది సాధారణంగా పాత్ర లేదా సామాను; ఇక్కడ దీపాన్ని కప్పగల వస్తువు అనే సందర్భంలో ‘పాత్ర’ సహజం, కానీ మూలంలోని అనిర్దిష్టతను ‘ఒక’ నిలుపుతుంది.
- source_word: κλίνης
  choice: మంచం
  rationale: పడుకునే మంచం లేదా పీటను సూచిస్తుంది; ఆధునిక సాధారణ తెలుగులో ‘మంచం’ స్పష్టం.
- source_word: λυχνίας
  choice: దీపస్తంభం
  rationale: దీపాన్ని ఎత్తుగా ఉంచే ఆధారాన్ని సూచించే పదం; ‘దీపస్తంభం’ మూలార్థాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: οἱ εἰσπορευόμενοι
  choice: లోపలికి వచ్చేవారు
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న లేదా సాధారణ ప్రవేశ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన సామెత శైలి. ప్రారంభంలోని δέకు ప్రత్యేకంగా ‘ఇప్పుడు’ వంటి కాలసూచక పదం చేర్చలేదు; తెలుగు ప్రవాహంలో విరామచిహ్నాలు వ్యతిరేక నిర్మాణాన్ని సహజంగా చూపిస్తాయి. మూలంలోని ఏకవచన క్రియల సాధారణ సత్యార్థాన్ని తెలుగులో గౌరవార్థక/సామాన్య బహువచన క్రియలతో వ్యక్తం చేశాం.
