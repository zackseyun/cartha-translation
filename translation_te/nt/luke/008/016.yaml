- from: ఎవ్వరూ దీపం వెలిగించి, దాన్ని ఒక పాత్రతో కప్పరు; మంచం కింద పెట్టరు. లోపలికి వచ్చేవారు వెలుగును చూసేలా దాన్ని దీపస్తంభం మీద పెడతారు.
