review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the inferential οὖν, the emphasis on the manner of hearing (πῶς ἀκούετε), the indefinite proverbial contrast, the implied increase in δοθήσεται, and the ambiguity of δοκεῖ. No unwarranted theological specification is introduced. A small idiomatic revision better expresses βλέπετε with the following indirect question in modern Telugu.
  naturalness: ‘మీరు ఎలా వింటున్నారో జాగ్రత్తగా చూసుకోండి’ is understandable, but ‘జాగ్రత్తగా గమనించండి’ is more natural Telugu in this context and avoids the overly visual sense of చూసుకోండి. ‘అతని నుండి తీసివేయబడుతుంది’ is also more direct than ‘అతని దగ్గర నుండి తీసివేయబడుతుంది.’
  terminology: The generic masculine-singular reference is consistently preserved as ‘అతనికి/అతడు/అతని.’ ‘ఉంది/లేదు’ appropriately leaves the object unspecified, as does the Greek. The footnote appropriately preserves the viable ‘seems to have’ sense of δοκεῖ.
  issues:
  - severity: low
    issue: The rendering ‘జాగ్రత్తగా చూసుకోండి’ can sound visually literal or slightly awkward when followed by ‘మీరు ఎలా వింటున్నారో.’
    rationale: βλέπετε here is an idiomatic warning to take heed. ‘జాగ్రత్తగా గమనించండి’ naturally conveys this warning while retaining the focus on how one listens.
  - severity: low
    issue: ‘అతని దగ్గర నుండి’ is less concise than needed for ἀπ’ αὐτοῦ.
    rationale: ‘అతని నుండి’ idiomatically conveys removal from the person and matches the Greek prepositional expression without changing meaning.
  revised_text: కాబట్టి, మీరు ఎలా వింటున్నారో జాగ్రత్తగా గమనించండి. ఎందుకంటే, ఎవరికైతే ఉందో అతనికి ఇంకా ఇవ్వబడుతుంది; ఎవరికైతే లేదో, తనకు ఉందని అతడు అనుకునేది కూడా[a] అతని నుండి తీసివేయబడుతుంది.
