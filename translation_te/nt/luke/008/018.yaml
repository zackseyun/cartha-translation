id: LUK.8.18
reference: Luke 8:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: βλέπετε οὖν πῶς ἀκούετε· ὃς ⸂ἂν γὰρ⸃ ἔχῃ, δοθήσεται αὐτῷ, καὶ ὃς ⸀ἂν μὴ ἔχῃ, καὶ ὃ δοκεῖ ἔχειν ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/018.yaml
  text: Therefore[a], pay attention to how you listen. For whoever has, more will be given to him, and whoever does not have, even what he thinks he has will be taken away from him.
translation:
  language: te
  text: కాబట్టి, మీరు ఎలా వింటున్నారో జాగ్రత్తగా గమనించండి. ఎందుకంటే, ఎవరికైతే ఉందో అతనికి ఇంకా ఇవ్వబడుతుంది; ఎవరికైతే లేదో, తనకు ఉందని అతడు అనుకునేది కూడా[a] అతని నుండి తీసివేయబడుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తనకు ఉన్నట్లు కనిపించేది కూడా.”
    reason: δοκέω అనే పదానికి ‘అనుకోవడం’తో పాటు ‘కనిపించడం’ అనే అర్థమూ ఉండవచ్చు; మూలంలోని పదార్థసందిగ్ధతను భద్రపరచడానికి ఈ ప్రత్యామ్నాయం ఇచ్చాం.
lexical_decisions:
- source_word: βλέπετε
  choice: జాగ్రత్తగా చూసుకోండి
  rationale: ఇక్కడ దృశ్యంగా ‘చూడండి’ అనే అర్థం కాకుండా అప్రమత్తంగా శ్రద్ధ వహించాలనే ఆజ్ఞ ఉంది; తెలుగు సహజ ప్రయోగంలో ‘జాగ్రత్తగా చూసుకోండి’ ఆ హెచ్చరిక స్వరాన్ని తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందున్న వినడం, వెలుగు, ప్రతిస్పందన గురించిన బోధన నుంచి వచ్చే నిర్ధారణను స్పష్టంగా కలుపుతుంది.
- source_word: πῶς ἀκούετε
  choice: మీరు ఎలా వింటున్నారో
  rationale: πῶς వినే విధానాన్ని నొక్కి చెబుతుంది; ‘వింటున్నారో’ కేవలం శబ్దం వినిపించుకోవడం కంటే శ్రద్ధతో స్వీకరించే భావాన్నీ సందర్భంలో మోయగలదు.
- source_word: ὃς ἂν ... ἔχῃ
  choice: ఎవరికైతే ఉందో
  rationale: ἄνతో కూడిన సంభావ్య సాధారణ సంబంధవాక్యాన్ని సహజమైన తెలుగు రూపంలో వ్యక్తం చేస్తూ, ఏమి ఉందనే విషయాన్ని మూలంలాగే పేర్కొనకుండా ఉంచుతుంది.
- source_word: δοθήσεται αὐτῷ
  choice: అతనికి ఇంకా ఇవ్వబడుతుంది
  rationale: గ్రీకులో కర్మ స్పష్టంగా లేకపోయినా, విరుద్ధ సమాంతర నిర్మాణం పెరుగుదలను సూచిస్తుంది; ‘ఇంకా’ తెలుగు పాఠకునికి ఆ భావాన్ని సహజంగా తెలియజేస్తుంది, అయితే ఇవ్వబడేది ఏమిటో నిర్దిష్టం చేయదు.
- source_word: ὃς ἂν μὴ ἔχῃ
  choice: ఎవరికైతే లేదో
  rationale: మొదటి భాగంలోని సాధారణ, అనిర్దిష్ట నిర్మాణానికి సరితూగేలా వ్యతిరేక భావాన్ని నిలుపుతుంది.
- source_word: ὃ δοκεῖ ἔχειν
  choice: తనకు ఉందని అతడు అనుకునేది
  rationale: δοκέωకు ‘అనుకోవడం’ లేదా ‘కనిపించడం’ అనే రెండు సాధ్యార్థాలున్నాయి. ప్రధాన పాఠంలో వ్యక్తి భావించే స్వాధీనతను సహజంగా వ్యక్తం చేసి, మరో సాధ్యార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: అతని దగ్గర నుండి తీసివేయబడుతుంది
  rationale: భవిష్యత్ కర్మణి రూపంలోని తొలగింపు లేదా కోల్పోయేలా చేయడం అనే భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: αὐτῷ / αὐτοῦ
  choice: అతనికి / అతని దగ్గర నుండి
  rationale: గ్రీకు ఏకవచన పుంలింగ సాధారణ ప్రయోగాన్ని తెలుగులో నిలుపుతూ, వాక్యంలోని వ్యక్తిగత ఏకవచన అనుసంధానాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ఉన్నవాడు, లేనివాడు అనే సామెతసదృశ వాక్యపు భావం
  choice: యేసు మాటను ఎలా వింటారనే తక్షణ సందర్భంలోనే వాక్యాన్ని ఉంచి, ‘ఉండడం’ దేనిని సూచిస్తుందో అనువాదంలో నిర్దిష్టం చేయలేదు.
  alternative: దీనిని ముందే నిర్ణయించబడడం, వ్యక్తిగత యోగ్యత, భౌతిక సంపద, సాధారణ ఆధ్యాత్మిక స్వీకారశక్తి, లేదా బాధ్యతాయుత నిర్వహణ అనే ఏదో ఒక సిద్ధాంతంగా స్పష్టీకరించడం.
  rationale: మూలవాక్యం వినే విధానంతో ముడిపడిన విరోధాభాస సూత్రాన్ని చెబుతుంది గాని దాని పరిధిని ఈ వచనంలో పూర్తిగా నిర్వచించదు. అందువల్ల దాని ధార్మిక ఉద్వేగాన్నీ సందర్భసంబంధమైన అనిశ్చితినీ అలాగే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన హెచ్చరిక స్వరం వాడబడింది. ‘ఏమి ఉంది’ మరియు ‘ఏమి ఇవ్వబడుతుంది’ అనే విషయాలను అనవసరంగా సిద్ధాంతీకరించకుండా మూలంలోని సూచిత భావాన్ని నిలిపాం; పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో సంబంధిత పదబంధం వద్ద ఉంచబడింది.
