id: LUK.8.47
reference: Luke 8:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδοῦσα δὲ ἡ γυνὴ ὅτι οὐκ ἔλαθεν τρέμουσα ἦλθεν καὶ προσπεσοῦσα αὐτῷ δι’ ἣν αἰτίαν ἥψατο αὐτοῦ ⸀ἀπήγγειλεν ἐνώπιον παντὸς τοῦ λαοῦ καὶ ὡς ἰάθη παραχρῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/047.yaml
  text: And when the woman saw that she had not escaped notice[a], she came trembling, and falling down before him[b], declared before all the people why she had touched him and how she had been healed immediately.
translation:
  language: te
  text: ఆ స్త్రీ తాను దాగి ఉండలేదని గ్రహించి, వణుకుతూ వచ్చి, ఆయన ఎదుట పడి[a], తాను ఆయనను ఎందుకు తాకిందో, వెంటనే ఎలా స్వస్థత పొందిందో ప్రజలందరి సమక్షంలో తెలిపింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన ఎదుట సాగిలపడి.’ గ్రీకు పాఠంలో ‘పాదాల దగ్గర’ అని స్పష్టంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα ... ὅτι οὐκ ἔλαθεν
  choice: తాను ఎవరి కంటా పడకుండా ఉండలేదని గ్రహించి
  rationale: స్త్రీ తన పని దాగి ఉండలేదని తెలుసుకున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది. ἰδοῦσα ఇక్కడ కేవలం కంటితో చూడడం కంటే పరిస్థితిని గ్రహించడాన్ని సూచిస్తుంది; λανθάνω యొక్క ‘గమనింపబడకుండా ఉండడం’ అనే భావాన్ని నిలుపుతుంది.
- source_word: τρέμουσα ἦλθεν
  choice: వణుకుతూ వచ్చి
  rationale: ఆమె శారీరక, భావోద్వేగ స్థితిని స్పష్టంగా ఉంచుతుంది; దీనిని కేవలం ‘భయపడి’ అని వ్యాఖ్యానించదు.
- source_word: προσπεσοῦσα αὐτῷ
  choice: ఆయన ఎదుట సాగిలపడి
  rationale: ప్రార్థనాత్మకంగా లేదా గౌరవంతో ఎదుట పడే భంగిమను సహజ తెలుగులో తెలియజేస్తుంది; గ్రీకులో స్పష్టంగా లేని ‘పాదాల దగ్గర’ అనే అంశాన్ని చేర్చదు.
- source_word: δι’ ἣν αἰτίαν ἥψατο αὐτοῦ
  choice: తాను ఆయనను ఎందుకు తాకిందో
  rationale: కారణాన్ని సూచించే గ్రీకు పదబంధాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది; ἅπτομαι యొక్క సాధారణ అర్థమైన ‘తాకడం’ను ఉంచుతుంది.
- source_word: ἀπήγγειλεν ἐνώπιον παντὸς τοῦ λαοῦ
  choice: ప్రజలందరి సమక్షంలో తెలిపింది
  rationale: బహిరంగంగా నివేదించిన భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; అవసరానికి మించిన గంభీరతను జోడించదు.
- source_word: καὶ ὡς ἰάθη παραχρῆμα
  choice: వెంటనే ఎలా స్వస్థత పొందిందో
  rationale: ὡς యొక్క ‘ఎలా’ అనే భావాన్నీ, παραχρῆμα సూచించే తక్షణత్వాన్నీ నిలుపుతుంది. స్వస్థత ఆమె చెప్పడానికి ముందే జరిగినదని సందర్భం స్పష్టం చేస్తుంది.
theological_decisions:
- issue: స్త్రీ సాగిలపడిన భంగిమ మరియు బహిరంగ ప్రకటన స్వభావం
  choice: వచనాన్ని గౌరవం లేదా వేడుకోలు సూచించగల కథనాత్మక వర్ణనగానే అనువదించడం
  alternative: ఆమె పశ్చాత్తాపంతో ఒప్పుకుందని లేదా స్పష్టంగా ఆరాధించిందని అనువదించడం
  rationale: గ్రీకు పాఠం ఆమె వణుకుతూ వచ్చి ఆయన ఎదుట పడిందనీ, తాకిన కారణం మరియు స్వస్థతను ప్రజల ముందు తెలిపిందనీ చెబుతుంది. పశ్చాత్తాపం లేదా ఆరాధనను స్పష్టంగా పేర్కొనదు; కాబట్టి ఆ సిద్ధాంతార్థాలను అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, అయితే గౌరవప్రదమైన కథన శైలి. ‘సాగిలపడి’ భంగిమను సహజంగా తెలియజేస్తుంది; పాదాలు, ఆరాధన లేదా పశ్చాత్తాపం వంటి వివరాలను అదనంగా చేర్చలేదు.
