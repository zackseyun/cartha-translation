  terminology: దేవుని వాక్యం appropriately renders τὸν λόγον τοῦ θεοῦ. సోదరులు faithfully reflects ἀδελφοί, while the footnote responsibly records the possible broader application without altering the source-shaped main text. ఆచరించేవారు is an accurate, idiomatic rendering of ποιoῦντες in this context.
