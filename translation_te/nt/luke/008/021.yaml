id: LUK.8.21
reference: Luke 8:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Μήτηρ μου καὶ ἀδελφοί μου οὗτοί εἰσιν οἱ τὸν λόγον τοῦ θεοῦ ἀκούοντες καὶ ⸀ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/021.yaml
  text: But he answered and said to them[b][a], “My mother and my brothers are those who hear the word of God and do it.”
translation:
  language: te
  text: అయితే ఆయన వారికి జవాబుగా, “నా తల్లీ నా సోదరులూ[a] వీరే—దేవుని వాక్యాన్ని విని దాన్ని ఆచరించేవారు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా సోదరసోదరీలు.” గ్రీకులో అక్షరార్థంగా “సోదరులు” అని ఉంది; అయితే ఈ మాట యొక్క అన్వయం పురుషులకు మాత్రమే పరిమితం కాకపోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: జవాబుగా ... అన్నాడు
  rationale: గ్రీకు కథనంలోని ‘జవాబిచ్చి చెప్పాడు’ అనే జంట క్రియల భావాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా వినిపించే నిర్మాణాన్ని ఉపయోగిస్తుంది.
- source_word: πρὸς αὐτούς
  choice: వారికి
  rationale: మాట ఎవరిని ఉద్దేశించి చెప్పబడిందో సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: Μήτηρ μου
  choice: నా తల్లి
  rationale: ఏకవచన నామవాచకాన్ని, స్వామ్యార్థాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: ἀδελφοί μου
  choice: నా సోదరులు
  rationale: గ్రీకులోని పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; విస్తృత అన్వయాన్ని పాదటిప్పణిలో సూచిస్తుంది.
- source_word: οὗτοί εἰσιν
  choice: వీరే
  rationale: οὗτοι లోని సూచనాత్మక, నొక్కిచెప్పే బలాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: οἱ ... ἀκούοντες καὶ ποιοῦντες
  choice: విని దాన్ని ఆచరించేవారు
  rationale: వర్తమాన కృదంతాలు సూచించే నిరంతర లక్షణాన్ని చూపుతుంది. ‘ఆచరించేవారు’ అనేది విన్న వాక్యాన్ని కార్యరూపంలో పెట్టడాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: దేవుని వాక్యం
  rationale: λόγος యొక్క ‘వాక్యం/సందేశం’ భావాన్నీ, మూలంలోని సంబంధ నిర్మాణాన్నీ, దైవశాస్త్రీయ ప్రతిధ్వనినీ నిలుపుతుంది.
theological_decisions:
- issue: యేసు కొత్తగా నిర్వచించిన కుటుంబ పరిధి
  choice: దేవుని వాక్యాన్ని విని ఆచరించేవారిని యేసు తన తల్లిగా, సోదరులుగా గుర్తిస్తున్నాడు.
  alternative: యేసు తన శారీరక కుటుంబాన్ని పూర్తిగా తిరస్కరిస్తున్నాడు; లేదా ఆయన కేవలం పురుష శిష్యులను మాత్రమే ఉద్దేశిస్తున్నాడు.
  rationale: ఈ వాక్యం దేవుని వాక్యానికి స్పందించడంపై ఆధారపడిన బంధుత్వాన్ని ప్రకటిస్తుంది; అయితే యేసు తన శారీరక కుటుంబాన్ని తిరస్కరించాడని పాఠ్యం స్పష్టంగా చెప్పదు. గ్రీకు పుంలింగ రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సాధ్యమైన విస్తృత అన్వయాన్ని పాదటిప్పణిలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘వీరే’ ద్వారా మూలంలోని సూచనాత్మక నొక్కును నిలిపి, దీర్ఘవిరామంతో తరువాతి వివరణను స్పష్టంగా కలిపాం.
