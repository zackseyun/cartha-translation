  text: Καὶ κατέπλευσαν εἰς τὴν χώραν τῶν ⸀Γερασηνῶν, ἥτις ἐστὶν ἀντιπέρα τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/026.yaml
  text: And they sailed down to the region of the Gerasenes, which is opposite Galilee.
translation:
  language: te
  text: వారు పడవలో గెరాసీయుల[a] ప్రాంతానికి చేరుకున్నారు. అది గలిలయకు ఎదురుగా ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లోను, సమాంతర సువార్త భాగాల్లోను ఇక్కడ ‘గదరీయులు’ లేదా ‘గెర్గెసీయులు’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: κατέπλευσαν
  choice: పడవలో వెళ్లారు
  rationale: καταπλέω నీటిమార్గంలో ఒక ప్రదేశానికి ప్రయాణించడాన్ని సూచిస్తుంది. సందర్భంలో ఒడ్డుకు చేరుకోవడం అంతర్లీనంగా ఉన్నా, దానిని ప్రత్యేకంగా జోడించకుండా సహజమైన తెలుగులో ‘పడవలో వెళ్లారు’ అని అనువదించాం.
- source_word: χώραν
  choice: ప్రాంతం
  rationale: χώρα ఇక్కడ ఆధునిక దేశాన్ని కాక ఒక భూభాగాన్ని లేదా జిల్లాను సూచిస్తుంది; అందువల్ల ‘ప్రాంతం’ సహజంగాను కచ్చితంగాను ఉంది.
- source_word: Γερασηνῶν
  choice: గెరాసీయులు
  rationale: జాతివాచక బహువచన రూపాన్ని తెలుగులో ఆ ప్రాంత ప్రజలను సూచించే ‘గెరాసీయులు’గా లిప్యంతరీకరించాం; షష్ఠీ సంబంధాన్ని ‘గెరాసీయుల ప్రాంతం’ తెలియజేస్తుంది.
- source_word: ἥτις
  choice: అది
  rationale: ఇది ముందున్న ‘ప్రాంతం’ను తిరిగి సూచిస్తూ వివరణాత్మక ఉపవాక్యాన్ని ప్రారంభిస్తుంది. ఆధునిక తెలుగులో వాక్యాన్ని విడదీసి ‘అది’ అనడం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: ἀντιπέρα
  choice: ఎదురుగా
  rationale: ἀντιπέρα అవతల లేదా ఎదురుగా ఉండటాన్ని సూచిస్తుంది. ‘గలిలయకు ఎదురుగా’ మూలంలోని భౌగోళిక సంబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: Γαλιλαίας
  choice: గలిలయ
  rationale: స్థలనామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణను ఉపయోగించాం.
theological_decisions:
- issue: సమాంతర సువార్తలు, ప్రతులలోని స్థలనామ పాఠభేదం
  choice: గెరాసీయులు
  alternative: గదరీయులు లేదా గెర్గెసీయులు
  rationale: SBLGNT ప్రధాన పాఠం Γερασηνῶν అని చదువుతుంది కాబట్టి ప్రధాన వచనంలో ‘గెరాసీయులు’ను ఉంచాం. ఇతర ప్రతులు, సమాంతర సువార్త భాగాల్లో కనిపించే పేర్లను సమన్వయపరచకుండా పాదసూచికలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. పొడవైన సంబంధవాచక నిర్మాణం కంటే రెండు సహజ వాక్యాలను ఉపయోగించాం; మూలపాఠంలోని స్థలనామ పాఠభేదాన్ని పాదసూచికలో నిలిపాం.
