id: LUK.8.28
reference: Luke 8:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδὼν δὲ τὸν ⸀Ἰησοῦν ἀνακράξας προσέπεσεν αὐτῷ καὶ φωνῇ μεγάλῃ εἶπεν· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; δέομαί σου, μή με βασανίσῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/028.yaml
  text: But when he saw Jesus[a], he cried out, fell down before him, and said with a loud voice, “What do you have to do with me, Jesus, Son of the Most High God? I beg you, do not torment me.”
translation:
  language: te
  text: 'అతడు యేసును చూసి, కేక వేసి, ఆయన ముందు పడి, బిగ్గరగా ఇలా అన్నాడు: “యేసూ, సర్వోన్నతుడైన దేవుని కుమారుడా, నాతో నీకేమిటి?[a] నన్ను యాతన పెట్టవద్దని నిన్ను వేడుకుంటున్నాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “నాకూ నీకూ మధ్య ఏముంది?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: చూసి
  rationale: అనంతర ప్రధాన క్రియలకు ముందున్న పరిస్థితిని తెలిపే aorist participle‌ను తెలుగులో సహజమైన పూర్వకాలిక క్రియారూపంతో అందించింది.
- source_word: ἀνακράξας
  choice: కేక వేసి
  rationale: ఒక్కసారిగా వెలువడిన గట్టి అరుపును సూచిస్తుంది; తరువాతి φωνῇ μεγάλῃ అనే పదబంధాన్ని వేరుగా నిలుపుతుంది.
- source_word: προσέπεσεν αὐτῷ
  choice: ఆయన ముందు పడి
  rationale: సమర్పణ లేదా తీవ్ర విన్నప భంగిమలో ఒకరి ముందు పడటాన్ని సూచిస్తుంది; ‘పాదాల దగ్గర’ అని మూలంలో లేని నిర్దిష్టతను చేర్చదు.
- source_word: φωνῇ μεγάλῃ
  choice: బిగ్గరగా
  rationale: తెలుగులో సహజంగా manner‌ను తెలియజేస్తూ గట్టి స్వరాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: నాతో నీకేమిటి?
  rationale: సంబంధాన్ని నిరాకరించే లేదా జోక్యాన్ని వ్యతిరేకించే సెమిటిక్ ప్రభావిత నుడికారాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో నిలుపుతుంది; మరింత వివరణాత్మక అర్థాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: సర్వోన్నతుడైన దేవుని కుమారుడా
  rationale: ‘అత్యున్నతుడైన దేవుడు’ అనే బిరుదు భావాన్ని సహజమైన సంబోధనలో నిలుపుతూ, అదనపు సిద్ధాంత వివరణను చేర్చదు.
- source_word: δέομαί σου
  choice: నిన్ను వేడుకుంటున్నాను
  rationale: తీవ్రమైన విన్నపాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: μή με βασανίσῃς
  choice: నన్ను బాధించవద్దు
  rationale: βασανίζω సూచించే తీవ్రమైన యాతన భావాన్ని సందర్భానుకూలంగా అందిస్తుంది; కేవలం శారీరక చిత్రహింసగా అతిగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: దయ్యం పలికిన యేసు గుర్తింపు
  choice: సర్వోన్నతుడైన దేవుని కుమారుడా, యేసూ
  alternative: అత్యున్నతుడైన దేవుని కుమారుడా, యేసూ
  rationale: మూలంలోని క్రీస్తు సంబంధిత సంబోధనను పూర్తిగా నిలుపుతూ, దాన్ని తగ్గించకుండా లేదా తరువాతి సిద్ధాంత సూత్రాలతో విస్తరించకుండా ఉంచుతుంది.
- issue: Τί ἐμοὶ καὶ σοί అనే నుడికారంలోని సంబంధ నిరాకరణ
  choice: నాతో నీకేమిటి?
  alternative: నాకూ నీకూ మధ్య ఏముంది?
  rationale: మూలంలోని సంక్షిప్తతను, ప్రతిఘటనను నిలుపుతుంది; దాని ఉద్దేశాన్ని ఒకే నిర్దిష్ట వ్యాఖ్యానంగా మార్చకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనంలో సహజమైన క్రియాక్రమం, సంబోధనలో గౌరవప్రదమైనప్పటికీ తీవ్రమైన స్వరం. మూలంలోని పునరుక్త గట్టిస్వర భావాలు ‘కేక వేసి’ మరియు ‘బిగ్గరగా’గా వేరువేరుగా నిలుపబడ్డాయి.
