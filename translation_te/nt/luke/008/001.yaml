  source_fidelity: ‘ఆ తర్వాత కొద్దికాలానికే’ అనే పదబంధం ἐν τῷ καθεξῆςలో ఉన్న క్రమానుగత ‘తరువాత/అనంతరం’ భావానికి మించిన సమీపకాల భావాన్ని నిర్దిష్టంగా చేర్చుతుంది. దాన్ని ‘ఆ తరువాత’గా మార్చడం మూలంలోని కాలసంబంధాన్ని మరింత జాగ్రత్తగా ప్రతిబింబిస్తుంది. మిగతా వాక్యం ప్రయాణంలోని పునరావృత/కొనసాగుతున్న భావాన్ని, ప్రకటన మరియు శుభవార్త తెలియజేయడం అనే రెండు క్రియల భేదాన్ని, అలాగే ‘పన్నెండుగురు’ అనే సమూహనామాన్ని తగినట్లుగా నిలుపుతుంది.
  naturalness: సవరించిన వాక్యం ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని కాపాడుతుంది. ‘పట్టణం పట్టణం, గ్రామం గ్రామం’ అనే పునరుక్తి పంపిణీ/పునరావృత భావాన్ని స్పష్టంగా తెలియజేస్తుంది. ‘దేవుని రాజ్యం గురించిన శుభవార్త’ ప్రస్తుత ‘దాని గురించిన’ కంటే సూచన అస్పష్టత లేకుండా సహజంగా ఉంటుంది.
