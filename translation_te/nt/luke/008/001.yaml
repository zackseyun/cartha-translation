id: LUK.8.1
reference: Luke 8:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ καθεξῆς καὶ αὐτὸς διώδευεν κατὰ πόλιν καὶ κώμην κηρύσσων καὶ εὐαγγελιζόμενος τὴν βασιλείαν τοῦ θεοῦ, καὶ οἱ δώδεκα σὺν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/001.yaml
  text: And it happened soon afterward that he was traveling through city after city and village after village[a], proclaiming and bringing the good news of the kingdom of God[c][b], and the Twelve were with him.
translation:
  language: te
  text: 'ఆ తరువాత ఇలా జరిగింది: ఆయన పట్టణం పట్టణం, గ్రామం గ్రామం[a] తిరుగుతూ, దేవుని రాజ్యాన్ని[b] ప్రకటిస్తూ, దేవుని రాజ్యం గురించిన శుభవార్తను తెలియజేస్తూ ఉన్నాడు. పన్నెండుగురు ఆయనతో ఉన్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక పట్టణం నుంచి మరో పట్టణానికి, ఒక గ్రామం నుంచి మరో గ్రామానికి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దేవుని పరిపాలనను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ καθεξῆς
  choice: ఆ తర్వాత కొద్దికాలానికే ఇలా జరిగింది
  rationale: లూకా ఉపయోగించిన కథన-కాలసూచక సూత్రంలో సంఘటనల వరుసతో పాటు సమీప కాలానంతర భావం ఉంది. ‘ఇలా జరిగింది’ ἐγένετοను నిలుపుతుంది; ‘ఆ తర్వాత కొద్దికాలానికే’ కాలక్రమాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: αὐτὸς
  choice: ఆయన
  rationale: గ్రీకులో కర్త స్పష్టంగా ఉన్నా ఇక్కడ తప్పనిసరి ఆత్మవాచక ఉద్ఘాటన లేదు. యేసును సూచించడానికి గౌరవప్రదమైన సాధారణ తెలుగు సర్వనామం వాడబడింది.
- source_word: διώδευεν
  choice: తిరుగుతూ ... ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పునరావృత ప్రయాణాన్ని సూచిస్తుంది. వివిధ ప్రాంతాల గుండా సాగిన ప్రయాణాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: κατὰ πόλιν καὶ κώμην
  choice: పట్టణం పట్టణం, గ్రామం గ్రామం
  rationale: ఏకవచన నామాలతో కూడిన విభజనార్థక κατά ఒక చోటు తర్వాత మరో చోటుకు పునరావృతంగా వెళ్లడాన్ని సూచిస్తుంది. తెలుగు పునరుక్తి ఆ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: κηρύσσων
  choice: ప్రకటిస్తూ
  rationale: κηρύσσωలోని బహిరంగ ప్రకటన భావాన్ని ‘ప్రకటిస్తూ’ స్పష్టంగా తెలియజేస్తుంది; దానిని కేవలం ప్రసంగం లేదా బోధకు పరిమితం చేయదు.
- source_word: εὐαγγελιζόμενος
  choice: దాని గురించిన శుభవార్తను తెలియజేస్తూ
  rationale: ఇది κηρύσσωνకు భిన్నమైన క్రియ. ‘శుభవార్త’ దాని సువార్తార్థాన్ని నిలుపుతుండగా, ‘తెలియజేస్తూ’ రెండు క్రియలను ఒకే పదంగా కలిపివేయకుండా కాపాడుతుంది.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: దేవుని రాజ్యాన్ని
  rationale: ‘రాజ్యం’ βασιλείαలోని రాజ్యపరిధి మరియు రాజపాలన అనే రెండు సాధ్యమైన కోణాలను పూర్తిగా ఒకదానికే పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: οἱ δώδεκα
  choice: పన్నెండుగురు
  rationale: ఇది గుర్తింపు పొందిన సమూహానికి వాడిన సంక్షిప్త బిరుదు. మూలంలో లేని ‘శిష్యులు’ లేదా ‘అపొస్తలులు’ అనే పదాలను చేర్చలేదు.
- source_word: σὺν αὐτῷ
  choice: ఆయనతో ఉన్నారు
  rationale: సహవాసం లేదా వెంట ఉండడాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ అనువాదం
  choice: దేవుని రాజ్యం
  alternative: దేవుని పరిపాలన
  rationale: βασιλεία దేవుని పాలనను సూచించగలిగినా, ‘పరిపాలన’ అని మాత్రమే అనువదిస్తే దాని భావపరిధి ఒక కోణానికే కుదించబడుతుంది. ‘దేవుని రాజ్యం’ ఆ పదంలోని స్థల/సమాజ మరియు క్రియాశీల రాజపాలన భావాల మధ్య ఉన్న విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, కథనానికి తగిన శైలి వాడబడింది. ‘పట్టణం పట్టణం, గ్రామం గ్రామం’ సాధారణ పాఠకులకు అర్థమయ్యేలా విభజనార్థక పునరావృతిని నిలుపుతుంది. రెండు గ్రీకు క్రియలైన κηρύσσων మరియు εὐαγγελιζόμενος మధ్య తేడా తెలుగులో ‘ప్రకటిస్తూ’ మరియు ‘శుభవార్తను తెలియజేస్తూ’ అని కాపాడబడింది.
