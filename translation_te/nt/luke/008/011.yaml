base_translation:
  language: en
  yaml_path: translation/nt/luke/008/011.yaml
  text: 'This is the parable: the seed is the word of God[a].'
translation:
  language: te
  text: '“ఈ ఉపమానం ఇదే: విత్తనం దేవుని వాక్యం.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ ఉపమానం యొక్క అర్థం ఇదే.” గ్రీకు పాఠం మరింత అక్షరార్థంగా, “ఈ ఉపమానం ఇదే” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔστιν
  choice: ఇదే
  rationale: గ్రీకు సంధాన క్రియను సహజమైన తెలుగు గుర్తింపు వాక్య నిర్మాణంలో చూపిస్తుంది; ‘అర్థం’ అనే వివరణాత్మక పదాన్ని చేర్చదు.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది స్వల్ప విషయమార్పును సూచిస్తుంది. ఈ చిన్న తెలుగు వాక్యంలో ప్రత్యేకంగా ‘ఇక’ లేదా ‘అయితే’ అని చేర్చితే మూలంలో లేని కాలసూచన లేదా వ్యతిరేక భావం బలపడవచ్చు; సందర్భమే మార్పును స్పష్టం చేస్తుంది.
- source_word: αὕτη ἡ παραβολή
  choice: ఈ ఉపమానం
  rationale: మూలంలోని పదబంధాన్ని నేరుగా కాపాడుతుంది. సందర్భంలో భావవివరణ మొదలవుతున్నప్పటికీ, మూలంలో లేని ‘అర్థం’ అనే నామవాచకాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: ὁ σπόρος
  choice: విత్తనం
  rationale: ఏకవచన రూపాన్నీ, ఉపమానంలోని వ్యవసాయ చిత్రాన్నీ సహజంగా నిలుపుతుంది.
- source_word: ὁ λόγος
  choice: వాక్యం
  rationale: ఇక్కడ దేవుడు తెలియజేసిన మాట లేదా సందేశాన్ని సూచిస్తుంది. ‘వాక్యం’ మూలపదానికి దగ్గరగా ఉండి, బైబిలు సంబంధిత ప్రతిధ్వనిని కూడా నిలుపుతుంది.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: గ్రీకు షష్ఠీ విభక్తి సంబంధాన్ని సహజమైన తెలుగు స్వామ్యరూపంలో నేరుగా వ్యక్తం చేస్తుంది; ‘దేవుని నుండి వచ్చిన’ అని విస్తరించదు.
theological_decisions:
- issue: παραβολή అనే పదాన్ని ‘ఉపమానం’గా ఉంచాలా, లేక సందర్భానుసారం ‘ఉపమానం యొక్క అర్థం/వివరణ’గా విస్తరించాలా
  choice: ఉపమానం
  alternative: ఉపమానం యొక్క అర్థం
  rationale: యేసు ఇక్కడ ఉపమానాన్ని వివరిస్తున్నప్పటికీ, గ్రీకు పాఠం అక్షరార్థంగా ‘ఈ ఉపమానం ఇదే’ అని చెబుతుంది. అందువల్ల మూలంలోని సంక్షిప్తతను, దానిలోని భావ ఉద్రిక్తతను ప్రధాన పాఠ్యంలో నిలిపి, వివరణాత్మక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘వాక్యం’ అనే పదం సాధారణ పాఠకునికి అర్థమయ్యేలా ఉండటంతో పాటు మూలంలోని λόγος పదానికి దగ్గరగా ఉంటుంది. మూలపాఠంలోని సంక్షిప్త గుర్తింపు నిర్మాణాన్ని కాపాడేందుకు వాక్యాన్ని అనవసరంగా విస్తరించలేదు.
