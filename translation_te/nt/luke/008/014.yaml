revisions:
- from: ముళ్ల మధ్య పడినది—వీరు విన్నవారు. అయితే వారు తమ దారిన సాగుతుండగా, ఈ జీవితపు చింతలు[a], సంపద, సుఖభోగాల వల్ల ఉక్కిరిబిక్కిరి అవుతారు; పరిపక్వతకు వచ్చేలా ఫలించరు.[b]
  to: ముళ్ల మధ్య పడినది—వీరు విన్నవారు. అయితే వారు తమ దారిన సాగుతుండగా, చింతలు[a], సంపద, జీవితపు సుఖభోగాల వల్ల ఉక్కిరిబిక్కిరి అవుతారు; పరిపక్వ ఫలాన్ని ఇవ్వరు.[b]
  rationale: The revision attaches “జీవితపు” directly to “సుఖభోగాలు,” corresponding to ἡδονῶν τοῦ βίου, and replaces the less idiomatic final expression with “పరిపక్వ ఫలాన్ని ఇవ్వరు.” It preserves the source’s imagery, ongoing-process nuance, and doctrinal openness.
