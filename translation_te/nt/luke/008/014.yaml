id: LUK.8.14
reference: Luke 8:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸ δὲ εἰς τὰς ἀκάνθας πεσόν, οὗτοί εἰσιν οἱ ἀκούσαντες, καὶ ὑπὸ μεριμνῶν καὶ πλούτου καὶ ἡδονῶν τοῦ βίου πορευόμενοι συμπνίγονται καὶ οὐ τελεσφοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/014.yaml
  text: And the one that fell among the thorns—these are those who have heard[a], but as they go on their way they are choked by the cares and riches and pleasures of life[b], and they do not bear fruit to maturity.
translation:
  language: te
  text: ముళ్ల మధ్య పడినది—వీరు విన్నవారు. అయితే వారు తమ దారిన సాగుతుండగా, చింతలు[a], సంపద, జీవితపు సుఖభోగాల వల్ల ఉక్కిరిబిక్కిరి అవుతారు; పరిపక్వ ఫలాన్ని ఇవ్వరు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బెంగలు” లేదా “ఆందోళనలు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఫలాన్ని పరిపక్వతకు చేర్చరు” లేదా “పూర్తిగా ఫలించరు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... εἰς τὰς ἀκάνθας πεσόν
  choice: ముళ్ల మధ్య పడినది
  rationale: మూలంలోని నపుంసక ఏకవచన ప్రయోగం ఉపమానంలోని విత్తనాన్ని సూచిస్తుంది; అయితే ఇక్కడ లేని ‘విత్తనం’ అనే నామవాచకాన్ని చేర్చకుండా సూచనను అలాగే ఉంచింది.
- source_word: οὗτοί εἰσιν οἱ ἀκούσαντες
  choice: వీరు విన్నవారు
  rationale: ఏమి విన్నారో ఈ వాక్యంలో మళ్లీ స్పష్టంగా చెప్పలేదు; కాబట్టి సందర్భంలో అర్థమయ్యే కర్మను తెలుగులోనూ జోడించలేదు.
- source_word: μεριμνῶν
  choice: చింతలు
  rationale: ఈ పదం చింతలు, బెంగలు, ఆందోళనలు అనే భావపరిధిని కలిగి ఉంది. సాధారణ ఆధునిక తెలుగులో ‘చింతలు’ సహజంగా ఉండి విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: πλούτου
  choice: సంపద
  rationale: భౌతిక ఐశ్వర్యం లేదా ధనసమృద్ధిని సూచించే సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: ἡδονῶν τοῦ βίου
  choice: ఈ జీవితపు ... సుఖభోగాలు
  rationale: βίος ఇక్కడ భౌతిక లేదా ప్రాపంచిక జీవితాన్ని సూచిస్తుంది; ‘ఈ జీవితపు’ అనే రూపం ఆ భావాన్ని స్పష్టం చేస్తుంది. ἡδοναίకు ‘సుఖభోగాలు’ నైతిక తీర్పును అతిగా చేర్చకుండా ఇంద్రియానందాల భావాన్ని తెలియజేస్తుంది.
- source_word: πορευόμενοι
  choice: వారు తమ దారిన సాగుతుండగా
  rationale: కొనసాగుతున్న గమనాన్ని తెలిపే వర్తమాన కృదంత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; దానిని మొత్తం జీవితయాత్రగా అతిగా వ్యాఖ్యానించదు.
- source_word: συμπνίγονται
  choice: ఉక్కిరిబిక్కిరి అవుతారు
  rationale: ముళ్లు మొక్కను అణచి ఎదగనివ్వని చిత్రాన్ని బలంగా నిలుపుతుంది; మూలంలోని కర్మణి భావానికి తెలుగులో సహజమైన రూపం.
- source_word: οὐ τελεσφοροῦσιν
  choice: పరిపక్వతకు వచ్చేలా ఫలించరు
  rationale: ఫలించడం మొదలుకాదనే భావం మాత్రమే కాక, ఫలం పూర్తి పరిపక్వతకు చేరకపోవడాన్ని కూడా తెలియజేస్తుంది; వ్యవసాయ రూపకాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ముళ్ల నేలలోని శ్రోతల వైఫల్య స్వభావం
  choice: లోకసంబంధమైన ప్రభావాల వల్ల ఉక్కిరిబిక్కిరి అయి, పరిపక్వతకు వచ్చేలా ఫలించకపోవడం అనే వ్యవసాయ రూపకాన్నే నిలుపడం
  alternative: వీరు నిజంగా విశ్వసించనివారు అని, నిజమైన విశ్వాసులే అయినా నిష్ఫలులయ్యారని, లేదా విశ్వాసం నుండి పూర్తిగా తొలగిపోయారని స్పష్టీకరించడం
  rationale: ఈ వాక్యం వారి ఫలహీనతను వివరిస్తుంది గాని పునర్జన్మ, విశ్వాసభ్రంశం, రక్షణ కోల్పోవడం వంటి తరువాతి సిద్ధాంత వివాదాలను స్వయంగా పరిష్కరించదు. అందువల్ల మూలంలోని theological tension‌ను అనువాదం అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. వాక్య నిర్మాణాన్ని సహజంగా చేయడానికి రెండు వాక్యాలుగా విభజించినా, మూలంలోని కారణాల వరుసను మరియు వ్యవసాయ రూపకాన్ని నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
