source:
  edition: SBLGNT
  text: ἔκλαιον δὲ πάντες καὶ ἐκόπτοντο αὐτήν. ὁ δὲ εἶπεν· Μὴ κλαίετε, ⸂οὐ γὰρ⸃ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/052.yaml
  text: And they were all weeping and mourning for her. But he said[a], “Do not weep, for she has not died, but is sleeping.”
translation:
  language: te
  text: అందరూ ఏడుస్తూ, ఆమెకోసం గుండెలు బాదుకుంటూ ఉన్నారు. అయితే ఆయన, “ఏడవకండి; ఎందుకంటే ఆమె చనిపోలేదు, నిద్రపోతోంది[a]” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిద్రలో ఉంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαιον
  choice: ఏడుస్తూ
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: πάντες
  choice: అందరూ
  rationale: విలపిస్తున్నవారందరినీ సమగ్రంగా సూచించే సహజమైన తెలుగు రూపం.
- source_word: ἐκόπτοντο αὐτήν
  choice: ఆమెకోసం గుండెలు బాదుకుంటున్నారు
  rationale: శోకసందర్భంలో κόπτομαι సూచించే విలాపాన్ని, దానితో ముడిపడిన శరీరచేష్టను ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: Μὴ κλαίετε
  choice: ఏడవకండి
  rationale: కొనసాగుతున్న ఏడుపును ఆపమనే భావాన్ని అతిగా వ్యాఖ్యానించకుండా సహజమైన నిషేధాజ్ఞగా అందిస్తుంది.
- source_word: οὐ γὰρ
  choice: ఎందుకంటే ... లేదు
  rationale: యేసు ఇచ్చిన ఆజ్ఞకు γάρ తెలిపే కారణ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἀπέθανεν
  choice: చనిపోలేదు
  rationale: మరణం సంభవించలేదనే వాక్యరూపాన్ని సహజమైన తెలుగులో ఉంచి, తరువాతి ‘నిద్రపోతోంది’ అనే మాటతో ఉన్న వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: καθεύδει
  choice: నిద్రపోతోంది
  rationale: వర్తమానకాల క్రియను క్రియాత్మకంగానే అనువదించి, యేసు ఉపయోగించిన నిద్ర రూపకాన్ని యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: బాలిక ‘చనిపోలేదు, నిద్రపోతోంది’ అని యేసు చెప్పడం
  choice: యేసు పలికిన విరుద్ధతతో కూడిన మాటలను ప్రధాన పాఠ్యంలో వివరణ లేకుండా నిలుపడం
  alternative: ‘ఆమె శాశ్వతంగా చనిపోలేదు’ లేదా ‘ఆమె నిజానికి కేవలం నిద్రలో ఉంది’ అని వివరణాత్మకంగా అనువదించడం
  rationale: మూలపాఠం బాలిక స్థితిని యేసు ‘నిద్ర’గా వర్ణించిన theological tensionను ఉంచుతుంది. దానిని సాధారణ నిద్రగా గానీ, తాత్కాలిక మరణంగా గానీ అనువాదంలోనే నిర్ణయించడం తగదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘గుండెలు బాదుకోవడం’ శోకవిలాప సందర్భాన్ని సజీవంగా తెలియజేస్తుంది; ‘నిద్రపోతోంది’ మూలంలోని రూపకాన్నీ దాని ఉద్దేశపూర్వక ఉద్వేగాన్నీ కాపాడుతుంది.
