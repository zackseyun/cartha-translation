  yaml_path: translation/nt/luke/008/031.yaml
  text: And they were begging him not to command them to go into the abyss[a].
translation:
  language: te
  text: తమను అగాధంలోకి వెళ్లమని ఆజ్ఞాపించవద్దని అవి ఆయనను పదేపదే వేడుకుంటూ ఉన్నాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అపార లోతు.’ గ్రీకు పదం గొప్ప లోతును సూచించగలదు; ఇక్కడ అది దుష్టాత్మలను నిర్బంధించే స్థలాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: పదేపదే వేడుకుంటూ ఉన్నాయి
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పునరావృతమైన వేడుకోలును సూచిస్తుంది. దయ్యాలను సూచించే నపుంసక బహువచనానికి అనుగుణంగా ‘ఉన్నాయి’ వాడబడింది.
- source_word: ἐπιτάξῃ
  choice: ఆజ్ఞాపించవద్దని
  rationale: ఈ క్రియ అధికారపూర్వకమైన ఆదేశాన్ని సూచిస్తుంది; యేసుకు వాటిపై ఉన్న అధికారబలాన్ని నిలుపుతుంది.
- source_word: ἄβυσσον
  choice: అగాధం
  rationale: గ్రీకు పదం అపారమైన లోతును లేదా అగాధాన్ని సూచించగలదు. ఇక్కడ దయ్యాల నిర్బంధానికి సంబంధించిన అతీంద్రియ సందర్భాన్ని అతిగా నిర్వచించకుండా ‘అగాధం’ సహజంగా నిలుపుతుంది.
- source_word: ἀπελθεῖν
  choice: వెళ్లమని
  rationale: గమ్యస్థానం స్పష్టంగా ఉన్నందున సాధారణ గమనార్థకమైన ‘వెళ్లు’ సహజమైన తెలుగు రూపం.
- source_word: ἵνα μὴ
  choice: ఆజ్ఞాపించవద్దని
  rationale: వేడుకోలు క్రియ తరువాత ఇది అభ్యర్థనలోని విషయాన్ని తెలియజేస్తుంది; తెలుగులో నిషేధార్థక పరోక్ష వాక్యరూపం సహజంగా ఉంటుంది.
- source_word: αὐτοῖς
  choice: తమను
  rationale: ఆజ్ఞకు లోబడే వారే వేడుకునే దయ్యాలు కాబట్టి, పరోక్ష వాక్యంలో ఆ సంబంధాన్ని ‘తమను’ స్పష్టంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దయ్యాల సందర్భంలో ἄβυσσος అర్థం
  choice: దుష్టాత్మల నిర్బంధం లేదా తీర్పుతో సంబంధమున్న అతీంద్రియ అగాధం
  alternative: సాధారణ స్థలార్థంలో అపారమైన లోతు
  rationale: సందర్భంలో దయ్యాలు యేసు అధికారపూర్వక ఆజ్ఞకు భయపడుతున్నాయి. ‘అగాధం’ అనే పదం ఆ ఆధ్యాత్మిక-విశ్వ సంబంధిత భావాన్ని నిలుపుతూ, లూకా చెప్పినదానికంటే ఎక్కువ వివరాన్ని పాఠ్యంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని కొనసాగుతున్న వేడుకోలు భావాన్ని ‘పదేపదే వేడుకుంటూ ఉన్నాయి’ ద్వారా వ్యక్తపరిచింది; ‘అగాధం’లోని ఉద్దేశపూర్వక అస్పష్టతను పాదసూచికతో నిలిపింది.
