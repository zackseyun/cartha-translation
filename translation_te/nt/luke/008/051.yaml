source:
  edition: SBLGNT
  text: ἐλθὼν δὲ εἰς τὴν οἰκίαν οὐκ ἀφῆκεν εἰσελθεῖν ⸂τινα σὺν αὐτῷ⸃ εἰ μὴ Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον καὶ τὸν πατέρα τῆς παιδὸς καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/051.yaml
  text: When he came into the house[a], he did not allow anyone to enter with him except Peter and John and James, and the girl's father and mother.
translation:
  language: te
  text: ఆయన ఇంట్లోకి వచ్చినప్పుడు, పేతురు, యోహాను, యాకోబు, ఆ బాలిక తండ్రి, తల్లి తప్ప ఇంకెవరినీ తనతో పాటు లోపలికి ప్రవేశించనివ్వలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ బిడ్డ తండ్రి, తల్లి.’ గ్రీకు పదానికి ‘బిడ్డ’ అనే విస్తృత అర్థం ఉండవచ్చు; అయితే సందర్భం ఆమెను బాలికగా గుర్తిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν δὲ εἰς τὴν οἰκίαν
  choice: ఆయన ఇంటికి వచ్చినప్పుడు
  rationale: Aorist participle యొక్క కాలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; δέ ఇక్కడ స్వల్ప కథన కొనసాగింపును సూచిస్తుంది, దాన్ని ప్రత్యేక సంధాయకంతో తప్పనిసరిగా అనువదించాల్సిన అవసరం లేదు.
- source_word: οὐκ ἀφῆκεν εἰσελθεῖν τινα σὺν αὐτῷ
  choice: మరెవరినీ తనతోపాటు లోపలికి రానివ్వలేదు
  rationale: నిరాకరణలో τινα కు ‘మరెవరినీ’ అనే సాధారణ వ్యాప్తి సరిపోతుంది. ἀφῆκεν + infinitive అనుమతించకపోవడాన్ని సూచిస్తుంది; σὺν αὐτῷ ప్రవేశించే చర్యతో సహజంగా అనుసంధానించబడింది.
- source_word: εἰ μὴ
  choice: తప్ప
  rationale: ముందున్న నిరాకరణ తర్వాత ఇది షరతును కాక మినహాయింపును సూచిస్తుంది.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: పేతురును, యోహానును, యాకోబును
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన పేర్ల రూపాలను ఉపయోగిస్తూ, జాబితాను సహజమైన తెలుగు విరామచిహ్నాలతో అందిస్తుంది.
- source_word: τὸν πατέρα τῆς παιδὸς καὶ τὴν μητέρα
  choice: ఆ బాలిక తండ్రిని, తల్లిని
  rationale: παῖς సాధారణంగా ‘బిడ్డ’ అని కూడా అర్థమవుతుంది; అయితే సమీప సందర్భం ఆమెను కుమార్తెగా గుర్తిస్తుంది. ‘బాలిక’ ఆ సందర్భసూచనను సహజంగా తెలియజేస్తుంది; తండ్రి, తల్లి ఇద్దరినీ విడివిడిగా పేర్కొనడం మూలానికి అనుగుణం.
theological_decisions:
- issue: παῖς యొక్క సందర్భానుసార లింగ నిర్దిష్టత
  choice: ఆ బాలిక తండ్రిని, తల్లిని
  alternative: ఆ బిడ్డ తండ్రిని, తల్లిని
  rationale: παῖς పదం స్వతహాగా ‘బిడ్డ’ అనే విస్తృత అర్థాన్ని కలిగి ఉండగలిగినా, ఈ కథన సందర్భం యాయీరు కుమార్తెను స్పష్టంగా సూచిస్తుంది. అందువల్ల ‘బాలిక’ అనేది అర్థాన్ని సిద్ధాంతపరంగా విస్తరించకుండా సందర్భాన్ని స్పష్టపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. మూలంలోని మినహాయింపు నిర్మాణం, వ్యక్తుల విడివిడి ప్రస్తావన నిలుపబడ్డాయి.
