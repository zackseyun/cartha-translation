id: LUK.8.12
reference: Luke 8:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ παρὰ τὴν ὁδόν εἰσιν οἱ ⸀ἀκούσαντες, εἶτα ἔρχεται ὁ διάβολος καὶ αἴρει τὸν λόγον ἀπὸ τῆς καρδίας αὐτῶν, ἵνα μὴ πιστεύσαντες σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/012.yaml
  text: And those beside the road are the ones who have heard[a]; then the devil comes and takes away the word from their hearts[b], so that they may not believe and be saved.
translation:
  language: te
  text: దారి పక్కన ఉన్నవారు అంటే వాక్యాన్ని విన్నవారు. ఆ తరువాత అపవాది వచ్చి, వారు నమ్మి రక్షణ పొందకుండా ఉండేందుకు వారి హృదయాల్లోనుండి వాక్యాన్ని[a] తీసివేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “వాక్యం” అంటే ఉపమానంలో ప్రకటించబడిన దేవుని సందేశం.
    reason: cross_reference
lexical_decisions:
- source_word: παρὰ τὴν ὁδόν
  choice: దారి పక్కన ఉన్నవారు
  rationale: παράతో కూడిన స్థలార్థాన్ని సహజమైన ఆధునిక తెలుగులో చూపిస్తుంది; ఉపమానంలోని దారి చిత్రాన్ని నిలుపుతుంది.
- source_word: ἀκούσαντες
  choice: వాక్యాన్ని విన్నవారు
  rationale: భూతకాల క్రియావిశేషణాన్ని తెలుగులో వ్యక్తులను వివరించే సహజ నామవాచక రూపంగా అందిస్తుంది; సందర్భం ద్వారా వారు విన్నది వాక్యమని స్పష్టం చేస్తుంది.
- source_word: εἶτα
  choice: ఆ తరువాత
  rationale: తరువాత జరిగే చర్యను స్పష్టమైన క్రమసూచక పదబంధంతో తెలియజేస్తుంది.
- source_word: ὁ διάβολος
  choice: అపవాది
  rationale: ఇక్కడ వ్యక్తిగత దుష్టుని సూచించే సాంప్రదాయికమైనప్పటికీ అర్థవంతమైన తెలుగు పదం; కేవలం అపనింద చేసేవాడనే సాధారణ భావానికి పరిమితం చేయదు.
- source_word: αἴρει
  choice: తీసివేస్తాడు
  rationale: తొలగించడం లేదా తీసుకుపోవడం అనే మూలభావాన్ని, లేని హింసాత్మక ఛాయను చేర్చకుండా వ్యక్తపరుస్తుంది.
- source_word: τὸν λόγον
  choice: వాక్యం
  rationale: ఉపమాన సందర్భంలో ప్రకటించబడిన దేవుని సందేశాన్ని సూచించే బైబిలు వాడుకను నిలుపుతుంది; అర్థాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: ἀπὸ τῆς καρδίας αὐτῶν
  choice: వారి హృదయాల్లోనుండి
  rationale: గ్రీకు బహువచన సర్వనామానికి అనుగుణంగా సహజమైన తెలుగు బహువచనాన్ని వాడి, ఆలోచన, సంకల్పం, స్పందనల కేంద్రం అనే బైబిలు హృదయ భావాన్ని కాపాడుతుంది.
- source_word: ἵνα μὴ πιστεύσαντες σωθῶσιν
  choice: వారు నమ్మి రక్షణ పొందకుండా ఉండేందుకు
  rationale: అపవాది చర్యలోని ఉద్దేశ్యాన్ని చూపిస్తూ, πιστεύσαντες మరియు σωθῶσιν మధ్య క్రమాన్ని సహజమైన తెలుగు క్రియాక్రమంలో నిలుపుతుంది.
- source_word: πιστεύσαντες
  choice: నమ్మి
  rationale: πιστεύω యొక్క ప్రత్యక్షమైన, సాధారణ తెలుగు సమానార్థకం; సందర్భంలో విశ్వాస స్పందనను సూచిస్తుంది.
- source_word: σωθῶσιν
  choice: రక్షణ పొందకుండా
  rationale: లూకా రచనలోని సంపూర్ణ రక్షణార్థాన్ని తెలియజేసే స్పష్టమైన తెలుగు ప్రయోగం.
theological_decisions:
- issue: నమ్మడం మరియు రక్షణ పొందడం మధ్య సంబంధం
  choice: “వారు నమ్మి రక్షణ పొందకుండా” అని అనువదించి, నమ్మడం నుండి రక్షణ పొందడం వైపు వాక్యంలో ఉన్న క్రమాన్ని నిలిపాం.
  alternative: విశ్వాసం, పిలుపు, పట్టుదల లేదా కేవలం మేధోసమ్మతి గురించి ఏదైనా ప్రత్యేక సంప్రదాయ వివరణను అనువాదంలో చేర్చడం.
  rationale: అపవాది వాక్యాన్ని తీసివేయడంలోని ఉద్దేశ్యాన్ని గ్రీకు పాఠం నమ్మడం మరియు రక్షణ పొందడాన్ని అడ్డుకోవడంగా చెబుతుంది. విస్తృత సిద్ధాంత వివాదాలను పరిష్కరించకుండా ఆ ఉద్రిక్తతను అనువాదం అలాగే ఉంచుతుంది.
- issue: ἵνα μή యొక్క ఉద్దేశ్య/ఫలిత ఛాయ
  choice: “ఉండేందుకు” అనే ఉద్దేశ్యార్థక నిర్మాణం
  alternative: “అలా వారు నమ్మరు, రక్షణ పొందరు” అనే కేవలం ఫలితార్థక వాక్యం
  rationale: ఈ సందర్భంలో అపవాది చర్య వెనుక ఉద్దేశ్యాన్ని ప్రధానంగా వ్యక్తపరుస్తూ, ఉద్దేశ్యం మరియు ఫలితం మధ్య గ్రీకు నిర్మాణంలోని సన్నిహిత సంబంధాన్ని అతిగా వివరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. “అపవాది,” “వాక్యం,” “హృదయాలు,” “రక్షణ” వంటి బైబిలు పదాలు నిలుపబడినా, వాక్యం సాధారణ పాఠకులకు అర్థమయ్యేలా నిర్మించబడింది.
