id: LUK.8.32
reference: Luke 8:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἦν δὲ ἐκεῖ ἀγέλη χοίρων ἱκανῶν ⸀βοσκομένη ἐν τῷ ὄρει· καὶ ⸀παρεκάλεσαν αὐτὸν ἵνα ἐπιτρέψῃ αὐτοῖς εἰς ἐκείνους εἰσελθεῖν· καὶ ἐπέτρεψεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/032.yaml
  text: There was a large herd of pigs feeding there on the mountain[a], and they begged him to permit them to enter those pigs[c][b], and he permitted them.
translation:
  language: te
  text: అక్కడ కొండమీద[b] చాలా పందుల మంద[a] మేస్తూ ఉంది. ఆ పందులలోకి ప్రవేశించడానికి తమకు అనుమతి ఇవ్వమని వారు[c] ఆయనను వేడుకున్నారు; ఆయన వారికి అనుమతి ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అనేక పందుల మంద’ లేదా ‘గణనీయమైన పందుల మంద.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘కొండవాలులో.’
    reason: lexical_alternative
  - marker: c
    text: ‘వారు’ అనేది చుట్టుపక్కల సందర్భంలో చెప్పబడిన దయ్యాలను/అపవిత్రాత్మలను సూచిస్తుంది; కొన్ని అనువాదాలు దీన్ని వాక్యంలోనే స్పష్టంగా పేర్కొంటాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγέλη χοίρων ἱκανῶν
  choice: చాలా పందుల మంద
  rationale: ἱκανῶν అనేది χοίρωνతో వ్యాకరణపరంగా ఏకీభవిస్తూ పందుల సంఖ్య గణనీయమని సూచిస్తుంది. సహజమైన తెలుగులో ‘చాలా పందుల మంద’ ఈ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: βοσκομένη
  choice: మేస్తూ ఉంది
  rationale: మంద అక్కడ ఆహారం తింటూ ఉన్న చర్యను తెలిపే సహజమైన తెలుగు ప్రయోగం; ‘మేపబడుతూ’ అనే కర్మణి భావాన్ని అనవసరంగా చేర్చదు.
- source_word: ἐν τῷ ὄρει
  choice: కొండమీద
  rationale: ὄροςకు దగ్గరైన, సహజమైన స్థలవాచక అనువాదం. సందర్భాన్ని బట్టి ‘కొండవాలులో’ అనే భావమూ సాధ్యమే.
- source_word: παρεκάλεσαν
  choice: వేడుకున్నారు
  rationale: అనుమతి కోసం వారు గట్టిగా అభ్యర్థించిన భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπιτρέψῃ / ἐπέτρεψεν
  choice: అనుమతి ఇవ్వమని / అనుమతి ఇచ్చాడు
  rationale: విన్నపం మరియు దానికి వచ్చిన స్పందనలో మూలపాఠంలోని ఒకే క్రియకు సంబంధించిన పదసామ్యాన్ని తెలుగులోనూ నిలుపుతుంది.
- source_word: εἰς ἐκείνους εἰσελθεῖν
  choice: ఆ పందులలోకి ప్రవేశించడానికి
  rationale: ἐκείνους యొక్క స్పష్టమైన సూచనను, εἰς ... εἰσελθεῖνలోని లోనికి ప్రవేశించే భావాన్ని కాపాడుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δὲ కథనాన్ని ముందుకు నడిపే స్వల్ప అనుసంధానకం. తెలుగులో వాక్యక్రమమే ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది; ‘ఇప్పుడు’ అని చేరిస్తే మూలంలో లేని కాలసూచన కలగవచ్చు.
theological_decisions:
- issue: ‘వారు ఆయనను వేడుకున్నారు’ అనే వాక్యంలో బహువచన కర్త ఎవరనే ప్రశ్న
  choice: మూలపాఠంలాగే ‘వారు’ అని మాత్రమే ఉంచి, సూచిత కర్తను సందర్భం ద్వారా గ్రహించేలా చేయడం
  alternative: ‘దయ్యాలు ఆయనను వేడుకున్నాయి’ అని కర్తను స్పష్టంగా పేర్కొనడం
  rationale: చుట్టుపక్కల సందర్భంలో కర్త దయ్యాలు/అపవిత్రాత్మలు అని తెలుస్తుంది; అయితే ఈ వచనంలో గ్రీకు పాఠం వాటి పేరును మళ్లీ చెప్పకుండా బహువచన క్రియను మాత్రమే వాడుతుంది. అందువల్ల మూలంలోని పరోక్షతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన కథన శైలిలో అనువదించబడింది. మూలంలోని బహువచన కర్తను వివరణాత్మకంగా విస్తరించకుండా నిలుపుకుంది.
