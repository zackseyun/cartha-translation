  source_fidelity: 'The Telugu accurately represents the Greek: a considerable herd of pigs was feeding on the mountain; the contextually identified plural speakers asked permission to enter the pigs; and permission was granted. The light connective force of δέ is naturally carried by Telugu narrative flow without introducing an unwarranted temporal ‘now.’'
  naturalness: The wording is clear, idiomatic modern standard Telugu. ‘చాలా పందుల మంద మేస్తూ ఉంది’ and ‘వేడుకున్నారు’ fit a readable narrative register. The semicolon appropriately separates the request from Jesus’ response.
  terminology: ‘పందుల మంద,’ ‘ప్రవేశించడానికి,’ and the paired ‘అనుమతి ఇవ్వమని / అనుమతి ఇచ్చాడు’ preserve both the sense and the verbal correspondence of the Greek. The implicit ‘వారు’ properly preserves the source’s contextual, rather than explicitly repeated, identification of the demons/unclean spirits.
