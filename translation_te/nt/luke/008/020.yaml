id: LUK.8.20
reference: Luke 8:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ἀπηγγέλη δὲ⸃ ⸀αὐτῷ· Ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἑστήκασιν ἔξω ἰδεῖν ⸂σε θέλοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/020.yaml
  text: And it was reported to him[a], “Your mother and your brothers are standing outside, wanting to see you.”
translation:
  language: te
  text: అప్పుడు ఆయనకు, “నీ తల్లి, నీ సోదరులు[a] నిన్ను చూడాలని బయట నిలబడి ఉన్నారు” అని సమాచారం అందింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సందర్భంలో ἀδελφοί అనే పదాన్ని విస్తృతార్థంలో గ్రహిస్తే, ‘బంధువులు.’ అయితే గ్రీకు పదానికి సాధారణ అర్థం ‘సోదరులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπηγγέλη
  choice: సమాచారం అందింది
  rationale: ἀπαγγέλλω యొక్క భూతకాల కర్మణి రూపం యేసుకు ఒక సమాచారం తెలియజేయబడిందనే భావాన్ని ఇస్తుంది. తెలుగు సహజ వాడుకలో ‘సమాచారం అందింది’ కర్మణి భావాన్ని సులభంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ δέ కథనాన్ని ముందుకు నడిపించే స్వల్ప అనుసంధాన పదం; ‘అప్పుడు’ సందర్భానుసారంగా సహజంగా ఉంది, విరోధార్థాన్ని అనవసరంగా చేర్చదు.
- source_word: αὐτῷ
  choice: ఆయనకు
  rationale: దత్తివిభక్తిలోని పరోక్ష కర్మను తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: μήτηρ
  choice: తల్లి
  rationale: ప్రామాణికమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: ἀδελφοί
  choice: సోదరులు
  rationale: గ్రీకు పదం పుంలింగ బహువచనం; సాధారణంగా ‘సోదరులు’ అని అర్థం. కుటుంబ సంబంధంపై సిద్ధాంతపరమైన వివరణను అనువాదంలో చేర్చకుండా మూలంలోని సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: ἑστήκασιν
  choice: నిలబడి ఉన్నారు
  rationale: పూర్తికాల రూపంలోని వర్తమాన స్థితి భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἔξω
  choice: బయట
  rationale: స్థలాన్ని సూచించే సూటి పదం; మూలంలో లేని ‘ఇంటి బయట’ వంటి వివరాన్ని చేర్చదు.
- source_word: ἰδεῖν
  choice: చూడాలని
  rationale: ὁράω క్రియ యొక్క ప్రాథమిక అర్థమైన ‘చూడడం’ను నిలుపుతుంది; ‘కలవాలని’ వంటి విస్తృత వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: θέλοντες
  choice: చూడాలని
  rationale: ‘కోరుతూ/ఇష్టపడుతూ’ అనే సమకాలిక కోరిక భావాన్ని తెలుగు ఉద్దేశార్థక నిర్మాణంలో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: యేసు కుటుంబానికి సంబంధించి ἀδελφοί అనే పదం సూచన
  choice: ‘సోదరులు’ అని అనువదించడం
  alternative: ‘బంధువులు’ అని విస్తృతంగా అనువదించడం
  rationale: ఈ వచనంలో ἀδελφοί అనే సాధారణ పదమే ఉంది. యేసు కుటుంబ సంబంధాలపై ఉన్న సిద్ధాంతపరమైన వివాదాన్ని ఈ వచనమే పరిష్కరించనందున, అనువాదం సాధారణ పదార్థాన్ని నిలుపుతూ వ్యాఖ్యానాత్మక సమన్వయాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘సోదరులు’ అనే పదం మూలంలోని పుంలింగ బహువచనాన్ని, దాని సాధారణ కుటుంబార్థాన్ని నిలుపుతుంది; ప్రత్యామ్నాయ విస్తృతార్థం పాదసూచికలో ఇవ్వబడింది.
