id: LUK.8.27
reference: Luke 8:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐξελθόντι δὲ αὐτῷ ἐπὶ τὴν γῆν ⸀ὑπήντησεν ἀνήρ τις ἐκ τῆς πόλεως ⸀ἔχων δαιμόνια· ⸂καὶ χρόνῳ ἱκανῷ οὐκ ἐνεδύσατο ἱμάτιον⸃, καὶ ἐν οἰκίᾳ οὐκ ἔμενεν ἀλλ’ ἐν τοῖς μνήμασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/027.yaml
  text: And when he came out onto the land[a], a certain man from the city met him, who had demons. And for a considerable time he had not put on clothing[b], and he did not stay in a house but among the tombs.
translation:
  language: te
  text: ఆయన నేలపైకి దిగినప్పుడు[a], దయ్యాలు ఉన్న[b] పట్టణానికి చెందిన ఒక మనిషి ఆయనను కలిశాడు. అతడు చాలా కాలంగా బట్టలు వేసుకోలేదు; ఇంట్లో ఉండేవాడు కాదు, సమాధుల మధ్య ఉండేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత నుడికారంగా, ‘ఆయన ఒడ్డుకు దిగినప్పుడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దయ్యాలు పట్టిన.’ గ్రీకు పాఠం అక్షరార్థంగా ‘దయ్యాలు ఉన్న’ అని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντι ... αὐτῷ ἐπὶ τὴν γῆν
  choice: ఆయన నేల మీదికి వచ్చినప్పుడు
  rationale: దత్తి విభక్తిలోని కృదంత నిర్మాణాన్ని యేసుకు సంబంధించిన కాలసూచక ఉపవాక్యంగా అనువదించింది. ‘నేల మీదికి’ అనేది గ్రీకు పదబంధాన్ని దగ్గరగా ప్రతిబింబిస్తుంది; పడవనుంచి దిగడాన్ని ప్రధాన పాఠంలో అతిగా స్పష్టీకరించదు.
- source_word: ὑπήντησεν
  choice: ఆయనకు ఎదురయ్యాడు
  rationale: కథనంలోని నేరుగా కలుసుకోవడం లేదా ఎదురుపడడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀνήρ τις
  choice: ఒక వ్యక్తి
  rationale: τις లోని అనిర్దిష్టతను ‘ఒక’ తెలియజేస్తుంది. సందర్భం పురుషుణ్ని సూచిస్తున్నప్పటికీ, తెలుగులో ‘వ్యక్తి’ సహజమైన కథన పదం.
- source_word: ἐκ τῆς πόλεως
  choice: పట్టణానికి చెందిన
  rationale: ఈ పదబంధం అతని మూలం లేదా పట్టణంతో అతనికున్న సంబంధాన్ని సూచించవచ్చు. ‘పట్టణానికి చెందిన’ అనేది అతడు ఆ క్షణంలో పట్టణం నుంచి వచ్చాడని అనవసరంగా నిర్ధారించదు.
- source_word: ἔχων δαιμόνια
  choice: దయ్యాలు ఉన్న
  rationale: గ్రీకు వాక్యం అక్షరార్థంగా ‘దయ్యాలు కలిగి ఉన్న’ అని చెబుతుంది. ‘దయ్యాలు పట్టిన’ అనే మరింత వ్యాఖ్యానాత్మకమైన తెలుగు నుడికారాన్ని ప్రధాన పాఠంలో పెట్టకుండా మూలంలోని నిర్మాణాన్ని నిలుపుతుంది.
- source_word: χρόνῳ ἱκανῷ
  choice: చాలా కాలంగా
  rationale: గణనీయమైన కాలవ్యవధిని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: οὐκ ἐνεδύσατο ἱμάτιον
  choice: బట్టలు వేసుకోలేదు
  rationale: ἐνδύω మధ్యమప్రయోగంలోని ‘ధరించుకోవడం’ అనే క్రియాభావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. ఏకవచన ἱμάτιον ఇక్కడ వస్త్రధారణను సాధారణంగా సూచిస్తుంది.
- source_word: ἐν οἰκίᾳ οὐκ ἔμενεν
  choice: ఇంట్లో ఉండేవాడు కాదు
  rationale: అసంపూర్ణ భూతకాలంలోని అలవాటుగా కొనసాగిన స్థితిని చూపిస్తూ, μένω లోని ‘ఉండు’ భావాన్ని నిలుపుతుంది.
- source_word: ἀλλ’ ἐν τοῖς μνήμασιν
  choice: సమాధుల మధ్య ఉండేవాడు
  rationale: μνήμασιν అనేది సమాధులు లేదా శవాలను ఉంచే స్థలాలను సూచిస్తుంది. ‘సమాధుల మధ్య’ ఆ ప్రదేశాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: δαιμόνια అనే పదానికి అనువాదం
  choice: దయ్యాలు
  alternative: అపవిత్రాత్మలు
  rationale: ఇక్కడి గ్రీకు పదం δαιμόνια; πνεύματα ἀκάθαρτα కాదు. కాబట్టి వేరే గ్రీకు వ్యక్తీకరణతో దీనిని కలపకుండా నేరుగా ‘దయ్యాలు’ అని అనువదించింది.
- issue: ἔχων δαιμόνια ను స్వాధీనతను సూచించే నుడికారంగా అనువదించాలా
  choice: దయ్యాలు ఉన్న
  alternative: దయ్యాలు పట్టిన
  rationale: మూలపాఠం అక్షరార్థంగా అతడు దయ్యాలను ‘కలిగి ఉన్నాడు’ అని చెబుతుంది. ‘దయ్యాలు పట్టిన’ సహజమైన తెలుగు నుడికారం అయినప్పటికీ, అది స్వాధీనత భావాన్ని మరింత స్పష్టంగా నిర్ధారిస్తుంది; అందువల్ల దానిని పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించింది. మూలంలోని వరుస ‘మరియు’లను యాంత్రికంగా అన్నిచోట్లా పునరావృతం చేయకుండా తెలుగు వాక్యప్రవాహానికి అనుగుణంగా విరామచిహ్నాలు వాడింది; అయినా భావసంబంధాన్ని మార్చలేదు. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదసూచికలతో సరిగా జతచేయబడ్డాయి.
