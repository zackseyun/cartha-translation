id: LUK.7.13
reference: Luke 7:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδὼν αὐτὴν ὁ κύριος ἐσπλαγχνίσθη ἐπ’ αὐτῇ καὶ εἶπεν αὐτῇ· Μὴ κλαῖε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/013.yaml
  text: And when the Lord saw her[a], he was moved with compassion for her and said to her, “Do not weep.”
translation:
  language: te
  text: ప్రభువు ఆమెను చూసి, ఆమెపై కనికరపడి, ఆమెతో, “ఏడవకు”[a] అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఏడవడం ఆపు.” గ్రీకు మాటను సాధారణ నిషేధంగానైనా, అప్పటికే కొనసాగుతున్న ఆమె ఏడుపును ఆపమనే మాటగానైనా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: చూసి
  rationale: ὁράω అనే క్రియ యొక్క భూతకాల క్రియావిశేషణ రూపం ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచిస్తుంది. తెలుగులో ‘చూసి’ సహజంగా, సంక్షిప్తంగా ఆ కాలసంబంధాన్ని తెలియజేస్తుంది.
- source_word: ὁ κύριος
  choice: ప్రభువు
  rationale: లూకా కథనంలో ఇది యేసుకు ఉపయోగించిన గౌరవపూర్వకమైన క్రీస్తుసంబంధ బిరుదు. ‘ప్రభువు’ మూలపదంలోని బిరుదు స్వభావాన్ని కాపాడుతుంది.
- source_word: ἐσπλαγχνίσθη
  choice: కనికరపడి
  rationale: ఈ క్రియ లోతైన అంతరంగ కరుణను సూచిస్తుంది. ‘కనికరపడి’ ఆధునిక తెలుగులో సహజంగా ఉండి, భావోద్వేగ బలాన్ని నిలుపుతుంది.
- source_word: ἐπ’ αὐτῇ
  choice: ఆమెపై
  rationale: ἐπί + దత్తి విభక్తి కనికరం ఎవరిపట్ల చూపబడిందో సూచిస్తుంది. ‘ఆమెపై’ తెలుగులో సహజమైన ప్రయోగం.
- source_word: εἶπεν αὐτῇ
  choice: ఆమెతో అన్నాడు
  rationale: λέγω అనే సాధారణ ‘చెప్పు/అను’ క్రియకు ‘ఆమెతో అన్నాడు’ మూలానికి దగ్గరగా ఉండే సహజ తెలుగు రూపం.
- source_word: Μὴ κλαῖε
  choice: ఏడవకు
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞార్థకం సాధారణ నిషేధంగానూ, అప్పటికే జరుగుతున్న ఏడుపును ఆపమనే మాటగానూ వినిపించవచ్చు. ‘ఏడవకు’ ఆ రెండు అవకాశాలను అనవసరంగా తేల్చకుండా ఉంచుతుంది.
theological_decisions:
- issue: యేసుకు κύριος అనే బిరుదు
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఇక్కడ కథకుడు యేసును సూచించేందుకు ఉపయోగించిన ఉన్నతమైన బిరుదును ‘ప్రభువు’ కాపాడుతుంది; ‘యజమాని’ ఈ సందర్భంలో క్రీస్తుసంబంధ కథన బలాన్ని తగ్గించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘ప్రభువు’ అనే స్థిరమైన బైబిలు బిరుదును నిలిపి, మిగతా వాక్యాన్ని సరళంగా ఉంచాం.
