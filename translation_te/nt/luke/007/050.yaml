review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the principal sense of the verse: Jesus addresses the woman, attributes her salvation to her faith, and dismisses her in peace. The perfect σέσωκέν is appropriately represented by ‘రక్షించింది.’ A minor revision better reflects δέ as simple continuation without adding the more specifically temporal force of ‘అప్పుడు,’ and preserves the lexical alternative for πίστις reflected in the English audit trail.'
  naturalness: The direct-speech form ‘ఆయన ఆ స్త్రీతో … అన్నాడు’ and the idiom ‘సమాధానంతో వెళ్లు’ are natural, modern standard Telugu. ‘సమాధానంతో’ suitably communicates the idiomatic force of πορεύου εἰς εἰρήνην.
  terminology: ‘విశ్వాసం’ is the appropriate main rendering for πίστις in this context, and ‘రక్షించింది’ rightly retains the salvation/forgiveness weight of σῴζω. The footnotes retain viable alternatives without reducing the main text to a merely therapeutic meaning.
  issues:
