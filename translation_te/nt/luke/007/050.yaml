id: LUK.7.50
reference: Luke 7:50
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς τὴν γυναῖκα· Ἡ πίστις σου σέσωκέν σε· πορεύου εἰς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/050.yaml
  text: And he said to the woman[a], “Your faith has saved you[b]; go in peace.”
translation:
  language: te
  text: ఆయన ఆ స్త్రీతో, “నీ విశ్వాసం[a] నిన్ను రక్షించింది[b]; సమాధానంతో వెళ్లు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీ నమ్మకం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘నిన్ను స్వస్థపరిచింది’ అని కూడా అనువదించవచ్చు. గ్రీకు క్రియకు ‘రక్షించు,’ ‘విడిపించు,’ లేదా ‘స్వస్థపరచు’ అనే అర్థాలు ఉండవచ్చు; అయితే ఇక్కడి సందర్భంలో పాపక్షమాపణ, రక్షణ ప్రధానంగా ఉన్నాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: అప్పుడు … అన్నాడు
  rationale: δέ ఇక్కడ కథన కొనసాగింపును సూచిస్తుంది; తెలుగులో సహజమైన కథన శైలికి ‘అప్పుడు’ సరిపోతుంది. εἶπεν‌కు ‘అన్నాడు’ ప్రత్యక్ష సంభాషణలో సహజంగా ఉంది.
- source_word: πρὸς τὴν γυναῖκα
  choice: ఆ స్త్రీతో
  rationale: సందర్భంలో ముందే ప్రస్తావించబడిన స్త్రీని సూచిస్తుంది; γυνή ఇక్కడ ‘భార్య’ అనే అర్థంలో కాదు.
- source_word: Ἡ πίστις σου
  choice: నీ విశ్వాసం
  rationale: πίστις ఇక్కడ యేసుపట్ల ఆమె ఉంచిన నమ్మకాన్ని సూచిస్తుంది. ‘విశ్వాసం’ మూలపదంలోని మతపరమైన మరియు సంబంధపరమైన భావవిస్తృతిని నిలుపుతుంది.
- source_word: σέσωκέν σε
  choice: నిన్ను రక్షించింది
  rationale: σῴζω యొక్క పరిపూర్ణ కాలరూపం పూర్తయి కొనసాగుతున్న ఫలితమున్న చర్యను సూచిస్తుంది. పాపక్షమాపణ ప్రధానమైన ఈ సందర్భంలో ‘రక్షించింది’ అత్యంత తగినది; ‘స్వస్థపరిచింది’ అనే అర్థసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: πορεύου εἰς εἰρήνην
  choice: సమాధానంతో వెళ్లు
  rationale: మూలంలోని εἰς εἰρήνην అక్షరార్థంగా ‘సమాధానంలోకి’ అయినప్పటికీ, ఇది వెళ్లేటప్పుడు మరియు ఇకముందు సమాధాన స్థితిలో ఉండడాన్ని తెలిపే ఆశీర్వాదసదృశ ప్రయోగం. ‘సమాధానంతో వెళ్లు’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: πίστις యొక్క భావం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: ఈ సందర్భంలో యేసుపట్ల స్త్రీ ఉంచిన నమ్మకమే ప్రధాన భావం. ‘విశ్వసనీయత’ వ్యాకరణపరంగా సాధ్యమైనా సందర్భపరంగా తక్కువ సంభావ్యమైనది.
- issue: σῴζω పాపక్షమాపణతో సంబంధం
  choice: రక్షించింది
  alternative: స్వస్థపరిచింది; బాగుచేసింది
  rationale: లూకా 7:36–50లో పాపక్షమాపణ మరియు విశ్వాసపూర్వక స్పందన ప్రధానంగా ఉన్నాయి. అందువల్ల ‘రక్షించింది’ సందర్భానికి సరిపోతుంది; అయితే క్రియకు చికిత్స/స్వస్థత భావం కూడా ఉండగలదనే అంశాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన ప్రత్యక్ష సంభాషణ శైలి. ‘సమాధానం’ అనే పదం కేవలం గొడవలేమిని కాక, సంపూర్ణ శ్రేయస్సు మరియు దేవునితో శాంతి అనే విస్తృత బైబిలు భావాన్ని మోయగలదు.
