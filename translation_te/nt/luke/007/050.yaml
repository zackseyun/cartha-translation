    rationale: δέ here is a connective marking narrative continuation, not necessarily a temporal ‘then.’ Omitting an explicit Telugu connective is more natural than adding a temporal nuance.
  - severity: low
    issue: No footnote is provided for the ‘faith/trust’ lexical alternative.
    rationale: The English audit trail preserves ‘trust’ as a viable nuance of πίστις. Adding a concise Telugu footnote retains that alternative while keeping ‘విశ్వాసం’ in the text.
