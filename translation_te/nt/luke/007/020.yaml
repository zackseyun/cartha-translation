id: LUK.7.20
reference: Luke 7:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ πρὸς αὐτὸν οἱ ἄνδρες εἶπαν· Ἰωάννης ὁ βαπτιστὴς ⸀ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/020.yaml
  text: When the men came to him[a], they said, “John the Baptist has sent us to you, saying, ‘Are you the one who is to come, or should we expect another?’”
translation:
  language: te
  text: ఆ మనుషులు ఆయన దగ్గరికి వచ్చి, “బాప్తిస్మమిచ్చే యోహాను మమ్మల్ని నీ దగ్గరికి పంపి, ‘రాబోయేవాడు నువ్వేనా? లేక మరొకరి కోసం మేము ఎదురుచూడాలా?’ అని అడిగాడు” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι δὲ πρὸς αὐτὸν
  choice: ఆయన దగ్గరికి వచ్చి
  rationale: సందర్భంలో వారి రాకను, ఆయనను సమీపించడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οἱ ἄνδρες
  choice: ఆ మనుషులు
  rationale: ఇక్కడ నిర్దిష్టమైన పురుష దూతలను సూచిస్తుంది; సందర్భంలో ముందే ప్రస్తావించబడిన వారనే భావాన్ని ‘ఆ’ నిలుపుతుంది.
- source_word: Ἰωάννης ὁ βαπτιστής
  choice: బాప్తిస్మమిచ్చే యోహాను
  rationale: క్రియాత్మకమైన గ్రీకు బిరుదును స్పష్టంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా అందిస్తుంది.
- source_word: ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων
  choice: మమ్మల్ని నీ దగ్గరికి పంపి ... అని అడిగాడు
  rationale: λέγων ఇక్కడ పంపిన సందేశంలోని ప్రశ్నను పరిచయం చేస్తుంది; తెలుగులో ‘అని అడిగాడు’ సహజంగా ఉండి భావాన్ని కాపాడుతుంది.
- source_word: ὁ ἐρχόμενος
  choice: రాబోయేవాడు
  rationale: నిర్దిష్ట ఆర్టికల్‌తో ఉన్న వర్తమాన కృదంతం యొక్క బిరుదుసదృశ భావాన్ని కాపాడుతూ, దానిని వివరణాత్మక సిద్ధాంతపదంగా మార్చదు.
- source_word: ἄλλον προσδοκῶμεν
  choice: మరొకరి కోసం మేము ఎదురుచూడాలా
  rationale: προσδοκάω లోని నిరీక్షణ/ఎదురుచూపు భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; deliberative subjunctive భావాన్ని ‘ఆలా’ నిలుపుతుంది.
theological_decisions:
- issue: ὁ ἐρχόμενος లోని మెస్సీయ సంబంధిత బిరుదు భావం
  choice: రాబోయేవాడు
  alternative: రావలసినవాడు
  rationale: ‘రాబోయేవాడు’ గ్రీకు పదబంధంలోని రాక మరియు నిరీక్షణ భావాన్ని నేరుగా నిలుపుతుంది. సందర్భంలో ఉన్న మెస్సీయ సంబంధిత ప్రతిధ్వనిని పాఠకుడు గ్రహించేందుకు వీలు ఇస్తుంది; దానిని అనువాదంలోనే స్పష్టీకరించి ఉద్రిక్తతను తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. ప్రత్యక్ష సంభాషణలో సహజమైన ఏకవచన ‘నీ/నువ్వేనా’ వాడబడింది. మూలపాఠంలో పాఠాంతర సూచన అవసరం లేనందున పాదటిప్పణి జోడించలేదు.
