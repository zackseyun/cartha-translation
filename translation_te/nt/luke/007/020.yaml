  naturalness: The overall register is modern and clear. Revising the question to “రాబోయేవాడు నువ్వేనా?” makes the titular participial expression natural in Telugu and preserves the direct-speech rhythm.
  terminology: “బాప్తిస్మమిచ్చే యోహాను” is clear and suitable for modern standard Telugu. “రాబోయేవాడు” preserves the open, expectant force of ὁ ἐρχόμενος without doctrinal over-specification.
