id: LUK.7.19
reference: Luke 7:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔπεμψεν πρὸς τὸν ⸀κύριον λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ⸀ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/019.yaml
  text: He sent to the Lord, saying, “Are you the Coming One, or should we expect another?”
translation:
  language: te
  text: అతడు ప్రభువు దగ్గరికి వారిని పంపి, “రాబోవువాడు నీవేనా,[a] లేక మేము మరొకరి కోసం ఎదురుచూడాలా?” అని అడిగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వస్తున్నవాడు.” గ్రీకు పదబంధాన్ని సాధారణ వర్ణనగా కూడా అర్థం చేసుకోవచ్చు; అయితే ఇక్కడ అది నిరీక్షించబడుతున్న మెస్సీయను సూచించే బిరుదుగా పనిచేస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεμψεν
  choice: వారిని పంపి
  rationale: πέμπω యొక్క భూతకాల కథన చర్యను సహజమైన తెలుగులో తెలిపింది. ముందు వచనంలోని దూతలే కర్మ అని సందర్భం సూచిస్తుంది; తెలుగు వాక్యంలో స్పష్టత కోసం ‘వారిని’ చేర్చబడింది.
- source_word: πρὸς τὸν κύριον
  choice: ప్రభువు దగ్గరికి
  rationale: πρός + accusative వ్యక్తివైపు దిశను సూచిస్తుంది. κύριοςకు క్రీస్తును సూచించే గౌరవభరితమైన సాధారణ అనువాదంగా ‘ప్రభువు’ నిలుపబడింది.
- source_word: λέγων
  choice: అని అడిగించాడు
  rationale: గ్రీకు వర్తమాన కృదంతం సందేశంలోని మాటలను పరిచయం చేస్తుంది. అతడు పంపిన వారి ద్వారా ప్రశ్న వేయించిన భావాన్ని సహజ తెలుగులో ‘అని అడిగించాడు’ తెలియజేస్తుంది.
- source_word: Σὺ εἶ
  choice: నీవేనా
  rationale: రూపపరంగా ‘నీవు ఉన్నావు’ అయినా, ప్రత్యామ్నాయ ప్రశ్న సందర్భంలో తెలుగు ప్రశ్నార్థక రూపం అవసరం. Σὺకు ఉన్న ఉద్ఘాటనను ‘నీవేనా’ వ్యక్తం చేస్తుంది.
- source_word: ὁ ἐρχόμενος
  choice: రాబోవువాడు
  rationale: నిర్దిష్ట ఆర్టికల్‌తో ఉన్న substantival participleను సంక్షిప్తంగా, సహజంగా అనువదిస్తూ, సందర్భంలోని నిరీక్షిత వ్యక్తి/మెస్సీయ సంబంధిత బిరుదు భావాన్ని కాపాడుతుంది.
- source_word: ἄλλον
  choice: మరొకరి
  rationale: ‘another’ అనే ప్రత్యామ్నాయ వ్యక్తిని తెలుగులో సహజంగా సూచిస్తుంది; ‘కోసం’తో కలిసినందున విభక్తి రూపం వాడబడింది.
- source_word: προσδοκῶμεν
  choice: మేము … ఎదురుచూడాలా
  rationale: వర్తమాన కాలంలోని నిరీక్షణ భావాన్ని మరియు deliberative questionను సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: యేసుకు κύριος అనే బిరుదు
  choice: ప్రభువు
  alternative: యజమాని
  rationale: లూకా కథనంలో κύριος గౌరవార్థకంగాను క్రీస్తుసంబంధమైన బరువుతోనూ ఉంది. ‘యజమాని’ ఇక్కడ ఆ భావాన్ని తగ్గించవచ్చు.
- issue: ὁ ἐρχόμενος బిరుదా లేక సాధారణ వర్ణనా
  choice: రాబోవువాడు
  alternative: వస్తున్నవాడు
  rationale: ఈ సందర్భంలో నిరీక్షించబడుతున్న ప్రత్యేక వ్యక్తిని సూచించే భావాన్ని ‘రాబోవువాడు’ కాపాడుతుంది; అయితే గ్రీకు పదబంధాన్ని సాధారణ వర్ణనగా కూడా చదవవచ్చనే అస్పష్టతను పాదటిప్పణి నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘రాబోవువాడు’ బైబిలు సందర్భంలోని నిరీక్షణ భావాన్ని నిలుపుతూ అతిగా పాతకాలపు రూపాన్ని నివారిస్తుంది.
