id: LUK.7.49
reference: Luke 7:49
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἤρξαντο οἱ συνανακείμενοι λέγειν ἐν ἑαυτοῖς· Τίς οὗτός ἐστιν ὃς καὶ ἁμαρτίας ἀφίησιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/049.yaml
  text: And those reclining at the table with him began to say among themselves[a], “Who is this, who even forgives sins?”
translation:
  language: te
  text: ఆయనతో కలిసి భోజనానికి కూర్చున్నవారు తమలో తాము[a], “పాపాలను కూడా క్షమిస్తున్న ఇతను ఎవరు?” అని చెప్పుకోవడం మొదలుపెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమలో తాము చెప్పుకోవడం.’ గ్రీకు ప్రయోగం వ్యక్తిగత అంతరంగ మాటను గానీ అతిథుల మధ్య సంభాషణను గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: మొదలుపెట్టారు
  rationale: ἄρχω క్రియతో కూడిన infinitive చర్య ఆరంభాన్ని సూచిస్తుంది; ‘మొదలుపెట్టారు’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: οἱ συνανακείμενοι
  choice: ఆయనతో కలిసి భోజనానికి కూర్చున్నవారు
  rationale: ఈ participle యేసుతో కలిసి విందులో ఉన్నవారిని సూచిస్తుంది. ప్రాచీన కాలపు ఆనుకొని భోజనం చేసే శరీర భంగిమను యథాతథంగా చెప్పడం తెలుగులో అసహజంగా ఉండవచ్చు; ఈ రూపం భోజన సందర్భాన్నీ συν-లోని సహవాస భావాన్నీ స్పష్టంగా ఉంచుతుంది.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: తమలో తాము … చెప్పుకోవడం
  rationale: గ్రీకు ప్రయోగం అంతరంగ ఆలోచనను గానీ అతిథుల మధ్య పరస్పర సంభాషణను గానీ సూచించవచ్చు. ‘తమలో తాము’ ఆ రెండు అవకాశాలనూ కొంతవరకు నిలుపుతుంది; సందిగ్ధతను పాదసూచిక వివరిస్తుంది.
- source_word: Τίς οὗτός ἐστιν
  choice: ఇతడు ఎవరు?
  rationale: గ్రీకులో ‘మనిషి’ అనే పదం లేదు. ‘ఇతడు ఎవరు?’ ప్రశ్నలోని క్లుప్తతను, సూటితనాన్ని నిలుపుతుంది.
- source_word: καὶ
  choice: కూడా
  rationale: ఇక్కడ καί ఆశ్చర్యాన్ని బలపరిచే ascensive అర్థంలో ఉంది. తెలుగు వాక్య నిర్మాణంలో ‘పాపాలను కూడా’ ఆ విస్తృతి పట్ల వారి ఆశ్చర్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἁμαρτίας ἀφίησιν
  choice: పాపాలను … క్షమిస్తున్న
  rationale: ఈ సందర్భంలో ἀφίημι పాపక్షమాపణకు వాడే స్థిరమైన ప్రయోగం. ‘క్షమిస్తున్న’ స్పష్టమైన, సాధారణమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: పాపాలను క్షమించే యేసు అధికారంపై అంతర్భావం
  choice: “పాపాలను కూడా క్షమిస్తున్న ఇతడు ఎవరు?” అనే అతిథుల ప్రశ్నను వివరణ జోడించకుండా నిలుపడం
  alternative: ఆయన దైవాధికారాన్ని ప్రశ్నలోనే స్పష్టంగా వివరించడం
  rationale: వచనం క్రీస్తు గుర్తింపు గురించి ప్రశ్నను లేవనెత్తుతుంది గాని దానికి వివరణాత్మక సమాధానం ఇవ్వదు. అందువల్ల మూలంలోని ఆశ్చర్యాన్నీ వేదాంతపరమైన ఉద్రిక్తతనూ పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ప్రాచీన భోజన భంగిమను అక్షరార్థంగా ‘ఆనుకొని ఉన్నవారు’ అని కాకుండా, సాధారణ పాఠకులకు స్పష్టంగా ‘భోజనానికి కూర్చున్నవారు’ అని వ్యక్తీకరించాం. ప్రశ్నలోని ఆశ్చర్యం, మూలంలోని ఉద్దేశపూర్వక వేదాంత సందిగ్ధత నిలుపబడ్డాయి.
