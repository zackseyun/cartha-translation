revisions:
- from: '“ఇతని గురించే ఇలా వ్రాయబడి ఉంది: ‘ఇదిగో, నేను నా సందేశకుణ్ణి నీ ముఖానికి ముందుగా పంపుతున్నాను[a]; అతడు నీకు ముందుగా నీ మార్గాన్ని సిద్ధం చేస్తాడు.’”'
  to: '“ఇతనే, ఇతని గురించే వ్రాయబడి ఉంది: ‘ఇదిగో, నేను నా సందేశకుణ్ణి నీ ముఖం ఎదుట[a] పంపుతున్నాను; అతడు నీ మార్గాన్ని నీ ముందు సిద్ధం చేస్తాడు.’”'
  rationale: The revision restores “ఇతనే” for οὗτός ἐστιν and improves the Telugu rendering of πρὸ προσώπου σου. It preserves the distinct repeated spatial phrases in the Greek—first “నీ ముఖం ఎదుట,” then “నీ ముందు”—and leaves the citation’s theological application unexpanded.
