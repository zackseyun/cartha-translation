id: LUK.7.27
reference: Luke 7:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτός ἐστιν περὶ οὗ γέγραπται· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/027.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face[b], who will prepare your way before you.’'
translation:
  language: te
  text: '“ఇతనే, ఇతని గురించే వ్రాయబడి ఉంది: ‘ఇదిగో, నేను నా సందేశకుణ్ణి నీ ముఖం ఎదుట[a] పంపుతున్నాను; అతడు నీ మార్గాన్ని నీ ముందు సిద్ధం చేస్తాడు.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత సహజంగా, “నీకు ముందుగా.” గ్రీకులో అక్షరార్థంగా “నీ ముఖం ఎదుట” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν περὶ οὗ γέγραπται
  choice: ఇతని గురించే ఇలా వ్రాయబడి ఉంది
  rationale: యోహానును స్పష్టంగా సూచించే నిర్దేశక బలాన్ని నిలుపుతూ, లేఖన ఉల్లేఖన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: ప్రవచన ఉల్లేఖనంలోని శ్రద్ధాకర్షకమైన, గంభీరమైన ధ్వనిని సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἀποστέλλω
  choice: పంపుతున్నాను
  rationale: గ్రీకు వర్తమాన కాలంలోని సజీవ తక్షణత్వాన్ని తెలుగులో సహజంగా ప్రతిబింబిస్తుంది.
- source_word: τὸν ἄγγελόν μου
  choice: నా సందేశకుణ్ణి
  rationale: ἄγγελος అనే పదానికి ‘దూత’ అనే అర్థం కూడా ఉన్నప్పటికీ, ఇక్కడ మానవ సందేశకుడైన యోహాను ఉద్దేశించబడ్డాడు; ‘సందేశకుడు’ ఆ సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: πρὸ προσώπου σου
  choice: నీ ముఖానికి ముందుగా
  rationale: గ్రీకులోని concrete imageryను, పాత నిబంధన ఉల్లేఖన ధ్వనిని నిలుపుతుంది; సహజమైన తెలుగు ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: ὃς κατασκευάσει τὴν ὁδόν σου
  choice: అతడు ... నీ మార్గాన్ని సిద్ధం చేస్తాడు
  rationale: భవిష్యత్ కార్యాన్ని స్పష్టంగా తెలిపి, ‘మార్గం’ అనే ప్రవచనాత్మక రూపకాన్ని కాపాడుతుంది.
- source_word: ἔμπροσθέν σου
  choice: నీకు ముందుగా
  rationale: చివరి స్థానసూచక పదబంధాన్ని సహజ తెలుగులో ఇస్తూ, ముందున్న ‘నీ ముఖానికి ముందుగా’ అనే పదబంధంతో ఉన్న భేదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: మలాకీ/నిర్గమకాండ భాషలోని ఉల్లేఖనాన్ని యేసు యోహానుకు వర్తింపజేయడం
  choice: ‘నీ ముఖం,’ ‘నీ మార్గం,’ ‘నీకు ముందు’ అనే ద్వితీయ పురుష సూచనలను వివరణాత్మక విస్తరణ లేకుండా నిలుపడం
  alternative: సందేశకుడు ప్రభువు లేదా మెస్సీయకు మార్గం సిద్ధం చేస్తాడని స్పష్టంగా పేరుపెట్టి అనువదించడం
  rationale: గ్రీకు వచనం చేసే ప్రత్యక్ష వర్తింపును అలాగే ఉంచి, దాని క్రీస్తుశాస్త్రీయ బలాన్ని వ్యాఖ్యానంతో ముందుగానే పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; లేఖన ఉల్లేఖనానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ప్రధాన వాక్యంలో ‘సందేశకుడు’ వాడటం వల్ల పరలోక దూత అనే అనవసర అపార్థం నివారించబడింది.
