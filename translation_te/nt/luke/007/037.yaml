id: LUK.7.37
reference: Luke 7:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ ⸂ἥτις ἦν ἐν τῇ πόλει⸃ ἁμαρτωλός, ⸀καὶ ἐπιγνοῦσα ὅτι ⸀κατάκειται ἐν τῇ οἰκίᾳ τοῦ Φαρισαίου, κομίσασα ἀλάβαστρον μύρου
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/037.yaml
  text: And behold[a], a woman in the city, who was a sinner, having learned that he was reclining at table in the Pharisee’s house[c][b], brought an alabaster jar of perfume.
translation:
  language: te
  text: ఇదిగో, ఆ పట్టణంలో పాపిగా ఉన్న ఒక స్త్రీ[a], ఆయన పరిసయ్యుని ఇంట్లో భోజనానికి బల్లవద్ద ఆనుకొని ఉన్నాడని తెలుసుకొని[b], పరిమళ ద్రవ్యపు అలబాస్టర్ పాత్రను[c] తీసుకొచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో కేవలం “పాపి” అని ఉంది; ఆమె చేసిన పాపం ఏమిటో చెప్పబడలేదు.
    reason: lexical_alternative
  - marker: b
    text: ఆ కాలంలో విందు భోజనం చేసేటప్పుడు బల్లవద్ద ఆనుకొని ఉండడం సాధారణ పద్ధతి.
    reason: cultural_note
  - marker: c
    text: లేదా “సువాసన లేపనపు అలబాస్టర్ పాత్ర.” అలబాస్టర్ అనేది పాత్రలు చేయడానికి ఉపయోగించే లేతరంగు రాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: కథనంలో కొత్త వ్యక్తిని ఆశ్చర్యభరితంగా, సజీవంగా పరిచయం చేసే గ్రీకు సంభాషణా సూచక బలాన్ని నిలుపుతుంది.
- source_word: γυνὴ ἥτις ἦν ἐν τῇ πόλει ἁμαρτωλός
  choice: ఆ పట్టణంలో పాపిగా పేరున్న ఒక స్త్రీ
  rationale: ἐν τῇ πόλει అనే స్థానిక భావాన్ని నిలుపుతూ, ἁμαρτωλός ఆమె గురించి పట్టణంలో తెలిసిన సామాజిక గుర్తింపును సూచించే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ఆమె చేసిన నిర్దిష్ట పాపాన్ని చెప్పదు.
- source_word: ἐπιγνοῦσα
  choice: తెలుసుకొని
  rationale: ప్రధాన క్రియకు ముందు ఆమెకు సమాచారం తెలిసిందనే పూర్వకాలిక భాగార్థాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κατάκειται
  choice: భోజనానికి బల్లవద్ద ఆనుకొని ఉన్నాడు
  rationale: ప్రాచీన విందు భోజనంలో బల్లవద్ద ఆనుకొని భుజించే ఆచారాన్ని తెలియజేస్తుంది; కేవలం ‘కూర్చున్నాడు’ అని మార్చదు.
- source_word: οἰκίᾳ τοῦ Φαρισαίου
  choice: పరిసయ్యుని ఇంట్లో
  rationale: నిర్దిష్ట పరిసయ్యుని గృహాన్ని సహజమైన తెలుగు స్వామ్య నిర్మాణంతో సూచిస్తుంది.
- source_word: κομίσασα
  choice: తీసుకొచ్చింది
  rationale: ఆ వస్తువును తనతో తీసుకొని రావడమనే భాగార్థక క్రియ భావాన్ని ప్రధాన తెలుగు వాక్యంలో సహజంగా అందిస్తుంది.
- source_word: ἀλάβαστρον μύρου
  choice: పరిమళ తైలంతో నిండిన స్ఫటికశిల పాత్ర
  rationale: μύρονను సువాసనగల అభ్యంగన తైలంగా, ἀλάβαστρονను దానిని ఉంచే అలబాస్టర్ రాతి పాత్రగా సాధారణ పాఠకుడికి అర్థమయ్యేలా అందిస్తుంది.
theological_decisions:
- issue: స్త్రీకి ఇచ్చిన నైతిక వర్ణన
  choice: పాపిగా పేరున్న ఒక స్త్రీ
  alternative: పాపాత్మురాలైన ఒక స్త్రీ; వ్యభిచారిణి
  rationale: ἁμαρτωλός ఆమెను ‘పాపి’గా గుర్తిస్తుంది గాని పాపం ఏదో చెప్పదు. అందువల్ల ఆమెను వ్యభిచారిణిగా లేదా వేశ్యగా నిర్దిష్టీకరించలేదు; అదే సమయంలో కథనంలోని బహిరంగ సామాజిక గుర్తింపు భావాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ‘ఇదిగో’ లూకా కథనంలోని దృష్టి ఆకర్షణను నిలుపుతుంది. ‘పాపిగా పేరున్న’ అనేది నిర్దిష్ట లైంగిక పాపాన్ని దిగుమతి చేయకుండా, సందర్భంలోని బహిరంగ గుర్తింపును సహజంగా తెలియజేస్తుంది. ప్రధాన వాక్యంలో ఉన్న [a], [b], [c] గుర్తులు సంబంధిత పాదసూచనలతో సరిపోతాయి.
