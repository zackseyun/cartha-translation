revisions:
- from: ఇదిగో, ఆ పట్టణంలో పాపిగా పేరున్న ఒక స్త్రీ[a], ఆయన పరిసయ్యుని ఇంట్లో భోజనానికి బల్లవద్ద ఆనుకొని ఉన్నాడని తెలుసుకొని[b], పరిమళ తైలంతో నిండిన స్ఫటికశిల పాత్రను[c] తీసుకొచ్చింది.
  to: ఇదిగో, ఆ పట్టణంలో పాపిగా ఉన్న ఒక స్త్రీ[a], ఆయన పరిసయ్యుని ఇంట్లో భోజనానికి బల్లవద్ద ఆనుకొని ఉన్నాడని తెలుసుకొని[b], పరిమళ ద్రవ్యపు అలబాస్టర్ పాత్రను[c] తీసుకొచ్చింది.
  rationale: The revision removes the unsupported implication that the woman had a public reputation as a sinner, corrects the material identification of the vessel, and avoids adding that the container was filled. It preserves the Greek ambiguity concerning her sin and retains the cultural meaning of reclining at a formal meal. Footnote markers remain correctly anchored and all three markers have matching notes.
