revisions:
- from: 'అందుచేత నేను నీతో చెబుతున్నాను: ఆమె అనేక పాపాలు క్షమించబడ్డాయి; ఎందుకంటే ఆమె ఎంతో ప్రేమ చూపించింది.[a] అయితే కొంచెం క్షమించబడినవాడు కొంచెమే ప్రేమిస్తాడు.'
  to: 'అందుచేత నేను నీతో చెబుతున్నాను: ఆమె చేసిన అనేక పాపాలు క్షమించబడ్డాయి, ఎందుకంటే ఆమె ఎంతో ప్రేమించింది.[a] అయితే ఎవరికి కొంచెం క్షమించబడుతుందో, అతడు కొంచెమే ప్రేమిస్తాడు.'
  rationale: సురక్షితమైన స్వల్ప సవరణలు మాత్రమే చేశాం. ‘ప్రేమ చూపించింది’ స్థానంలో ‘ప్రేమించింది’ను పెట్టి ἠγάπησενను నేరుగా ప్రతిబింబించాం. స్వామ్యాన్ని ‘ఆమె చేసిన అనేక పాపాలు’గా స్పష్టం చేశాం. చివరి భాగంలో ‘ఎవరికి ... క్షమించబడుతుందో’ అనే సంబంధ నిర్మాణం ᾧ యొక్క సాధారణ, లింగనిరపేక్ష సూచనను సహజంగా ఇస్తుంది; తెలుగు వాక్యసమ్మతికి ‘అతడు’ ఉపయోగించబడింది. ὅτιలోని కారణార్థం మరియు పాదసూచికలోని ప్రత్యామ్నాయ సందర్భార్థం యథాతథంగా కాపాడబడ్డాయి.
  reviewer_model: gpt-5.6-terra
