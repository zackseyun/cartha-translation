source:
  edition: SBLGNT
  text: οὗ χάριν, λέγω σοι, ἀφέωνται αἱ ἁμαρτίαι αὐτῆς αἱ πολλαί, ὅτι ἠγάπησεν πολύ· ᾧ δὲ ὀλίγον ἀφίεται, ὀλίγον ἀγαπᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/047.yaml
  text: For this reason I tell you[a], her many sins have been forgiven, because she loved much. But the one who is forgiven little loves little.
translation:
  language: te
  text: 'అందుచేత నేను నీతో చెబుతున్నాను: ఆమె చేసిన అనేక పాపాలు క్షమించబడ్డాయి, ఎందుకంటే ఆమె ఎంతో ప్రేమించింది.[a] అయితే ఎవరికి కొంచెం క్షమించబడుతుందో, అతడు కొంచెమే ప్రేమిస్తాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అందుచేత ఆమె ఎంతో ప్రేమించింది.” గ్రీకు సంధానపదాన్ని, ఆమె ప్రేమ క్షమాపణకు కారణమని కాక, ఆమె క్షమించబడిన స్థితికి సాక్ష్యమని ఉద్ఘాటించే విధంగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗ χάριν
  choice: అందుచేత
  rationale: ముందున్న ఉపమానంతో ఈ నిర్ధారణకు ఉన్న కారణాత్మక/నిగమన సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀφέωνται
  choice: క్షమించబడ్డాయి
  rationale: పూర్తయిన క్రియ వల్ల కొనసాగుతున్న ఫలితాన్ని సూచించే పరిపూర్ణ కర్మణి రూపాన్ని సందర్భానుగుణంగా వ్యక్తపరుస్తుంది.
- source_word: ἁμαρτίαι αὐτῆς αἱ πολλαί
  choice: ఆమె అనేక పాపాలు
  rationale: గ్రీకు పదక్రమంలోని ఉద్ఘాటనను సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: గ్రీకులోని సాధారణ కారణార్థాన్ని కాపాడుతూ, సందర్భంలో ఉన్న అర్థసంబంధ ఉద్రిక్తతను వ్యాఖ్యానంతో తొలగించదు.
- source_word: ἠγάπησεν πολύ
  choice: ఆమె ఎంతో ప్రేమ చూపించింది
  rationale: ప్రేమను కార్యరూపంలో వ్యక్తం చేసిన సందర్భాన్ని సహజంగా తెలుపుతూ, aorist క్రియ యొక్క గత సూచనను నిలుపుతుంది.
- source_word: ᾧ δὲ
  choice: అయితే ... వాడు
  rationale: విరుద్ధతను స్పష్టంగా చూపిస్తూ, సాధారణ వ్యక్తిని సూచించే సంబంధ వాక్యాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ὀλίγον ἀφίεται
  choice: కొంచెం క్షమించబడినవాడు
  rationale: క్షమించబడిన పరిమాణాన్ని తెలిపే ὀλίγονను కాపాడి, గ్రీకు వర్తమాన కర్మణి భావాన్ని సహజమైన తెలుగు నిర్మాణంలో ఇస్తుంది.
- source_word: ὀλίγον ἀγαπᾷ
  choice: కొంచెమే ప్రేమిస్తాడు
  rationale: ముందరి ‘కొంచెం’తో సమాంతరతను, సూక్తి వంటి సంక్షిప్త బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ὅτι వల్ల ఆ స్త్రీ ప్రేమే క్షమాపణకు సంపాదక కారణమని అర్థమవుతుందా?
  choice: ὅτιను ‘ఎందుకంటే’ అని అనువదించి, వాక్యంలోని కారణార్థ/సాక్ష్యార్థ ఉద్రిక్తతను ప్రధాన పాఠ్యంలోనే నిలుపడం.
  alternative: ‘కాబట్టి ఆమె ఎంతో ప్రేమ చూపించింది’ అని అనువదించి, ప్రేమను క్షమించబడిన స్థితికి ఫలితం లేదా సాక్ష్యంగా స్పష్టీకరించడం.
  rationale: గ్రీకు సంధానపదానికి కారణార్థం సహజమైనదే; అయితే ముందున్న ఉపమానం మరియు 50వ వచనం క్షమాపణ ప్రేమకు ముందుందని సూచిస్తాయి. అందువల్ల ప్రధాన పాఠ్యం గ్రీకు నిర్మాణాన్ని కాపాడగా, పాదసూచిక సాధ్యమైన సందర్భార్థాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘ప్రేమ చూపించింది’ అనే ప్రయోగం భోజన సందర్భంలో ఆమె చేసిన కార్యాల ద్వారా వ్యక్తమైన ప్రేమను సహజంగా తెలియజేస్తుంది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత వాక్యం తర్వాత ఉంచబడింది.
