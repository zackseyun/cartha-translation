id: LUK.7.12
reference: Luke 7:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς δὲ ἤγγισεν τῇ πύλῃ τῆς πόλεως, καὶ ἰδοὺ ἐξεκομίζετο τεθνηκὼς ⸂μονογενὴς υἱὸς⸃ τῇ μητρὶ αὐτοῦ, καὶ αὐτὴ ⸀ἦν χήρα, καὶ ὄχλος τῆς πόλεως ἱκανὸς ⸁ἦν σὺν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/012.yaml
  text: As he came near to the gate of the city[a], behold, a dead man was being carried out, the only son of his mother, and she was a widow, and a considerable crowd from the city was with her.
translation:
  language: te
  text: ఆయన పట్టణ ద్వారం దగ్గరకు వచ్చినప్పుడు, ఇదిగో, చనిపోయిన ఒక వ్యక్తిని బయటికి మోసుకువెళ్తున్నారు. అతడు తన తల్లికి ఏకైక కుమారుడు; ఆమె విధవరాలు. పట్టణంలోని గణనీయమైన జనసమూహం ఆమెతో ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἤγγισεν
  choice: ఆయన ... దగ్గరికి వచ్చినప్పుడు
  rationale: కాలసంబంధమైన ఉపవాక్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, ἤγγισεν సూచించే సమీపించడాన్ని నిలుపుతుంది. δέ యొక్క స్వల్ప కథన అనుసంధానం తెలుగు వాక్యప్రవాహంలో అంతర్లీనంగా ఉంది.
- source_word: τῇ πύλῃ τῆς πόλεως
  choice: పట్టణ ద్వారం దగ్గరికి
  rationale: పట్టణ ప్రవేశ ద్వారాన్ని స్పష్టంగా, సహజంగా సూచిస్తుంది.
- source_word: καὶ ἰδοὺ
  choice: ఇదిగో
  rationale: అకస్మాత్తుగా కనిపించిన దృశ్యంపై పాఠకుని దృష్టిని నిలిపే ἰδού యొక్క కథన బలాన్ని కాపాడుతుంది.
- source_word: ἐξεκομίζετο
  choice: బయటకు మోసుకువస్తున్నారు
  rationale: అసంపూర్ణ భూతకాల కర్మణి రూపం సూచించే, అప్పటికే కొనసాగుతున్న శవయాత్ర చర్యను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τεθνηκώς
  choice: చనిపోయిన ఒక వ్యక్తిని
  rationale: మరణించిన స్థితిలో ఉన్న వ్యక్తిని సూచించే పరిపూర్ణ కృదంత భావాన్ని సూటిగా వ్యక్తపరుస్తుంది.
- source_word: μονογενὴς υἱός
  choice: ఏకైక కుమారుడు
  rationale: ఈ కుటుంబ సందర్భంలో μονογενής ఆ తల్లికి మరొక కుమారుడు లేడనే అర్థాన్ని ఇస్తుంది; యోహాను రచనలలో కనిపించే ప్రత్యేక క్రీస్తుసంబంధ ధ్వనిని ఇక్కడ అనవసరంగా చేర్చదు.
- source_word: τῇ μητρὶ αὐτοῦ
  choice: తన తల్లికి
  rationale: సంబంధాన్ని తెలిపే గ్రీకు చతుర్థీ విభక్తిని తెలుగులో సహజమైన సంబంధ ప్రయోగంతో అందిస్తుంది.
- source_word: καὶ αὐτὴ ἦν χήρα
  choice: ఆమె విధవరాలు
  rationale: αὐτή ద్వారా తల్లిపై పడే ఉద్ఘాటనను నిలుపుతూ ఆమె దుఃఖభరిత పరిస్థితిని సంక్షిప్తంగా తెలుపుతుంది.
- source_word: ὄχλος τῆς πόλεως ἱκανός
  choice: పట్టణం నుండి వచ్చిన పెద్ద జనసమూహం
  rationale: ἱκανός సూచించే గణనీయమైన సంఖ్యను అతిశయించకుండా, సాధారణ పాఠకులకు సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἦν σὺν αὐτῇ
  choice: ఆమె వెంట ఉంది
  rationale: అంత్యక్రియల ఊరేగింపులో ఆమెతో పాటు వెళ్తున్నారనే సహవాస భావాన్ని సందర్భానుకూలంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: క్రీస్తుసంబంధం కాని సందర్భంలో μονογενής అనువాదం
  choice: ఏకైక కుమారుడు
  alternative: ఆమెకు ఒక్కడే కుమారుడు
  rationale: ఇక్కడ ఈ పదం విధవరాలి కుటుంబ సంబంధాన్ని వివరిస్తూ, ఆమెకు ఇతడే ఒక్క కుమారుడని సూచిస్తుంది. ప్రత్యేక సిద్ధాంతార్థాన్ని చేర్చకుండా సందర్భంలోని సాధారణ భావాన్నే అనువాదం అనుసరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇదిగో’ ద్వారా మూలంలోని దృష్టి ఆకర్షణ నిలుపబడింది; ‘ఆమె వెంట’ అనే ప్రయోగం శవయాత్ర సందర్భాన్ని స్పష్టంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా చేస్తుంది.
