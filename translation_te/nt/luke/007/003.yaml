  source_fidelity: 'ముసాయిదా మూలంలోని ప్రధాన అంశాలను సరిగ్గా అందిస్తుంది: యేసు గురించి వినడం, యూదుల పెద్దలను పంపడం, యేసు రావాలని విన్నవించడం, బానిసను కాపాడడం. అయితే “యేసును వేడుకుంటూ ... పెద్దలను ... పంపాడు” అనే నిర్మాణం, శతాధిపతి యేసును స్వయంగా వేడుకుంటూనే పెద్దలను పంపాడనే అసహజమైన లేదా స్వల్పంగా గందరగోళపరిచే భావాన్ని కలిగిస్తుంది. పెద్దలను పంపిన ఉద్దేశ్యం యేసును వేడుకోవడమే అని తెలుగులో స్పష్టపరచడం అవసరం. అలాగే ἐλθώνలోని ‘వచ్చి’ భావం స్పష్టంగా ఉండాలి.'
