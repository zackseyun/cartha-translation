id: LUK.7.3
reference: Luke 7:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ ἀπέστειλεν πρὸς αὐτὸν πρεσβυτέρους τῶν Ἰουδαίων, ἐρωτῶν αὐτὸν ὅπως ἐλθὼν διασώσῃ τὸν δοῦλον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/003.yaml
  text: When he heard about Jesus[a], he sent to him elders of the Jews, asking him to come and save his servant.
translation:
  language: te
  text: అతడు యేసు గురించి విని, వచ్చి తన బానిసను[a] కాపాడమని యేసును వేడుకోమని యూదుల పెద్దలను ఆయన దగ్గరకు పంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సేవకుణ్ణి.” గ్రీకు పదం దూలొస్; సందర్భాన్ని బట్టి దీనికి “బానిస” లేదా “సేవకుడు” అని అర్థం రావచ్చు. ఇక్కడ ఆ వ్యక్తి బంధిత స్థితిని స్పష్టంగా చూపడానికి “బానిస” అని అనువదించబడింది.
    reason: δοῦλος పదానికి సందర్భానుసారంగా సాధ్యమైన ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ
  choice: అతడు యేసు గురించి విని
  rationale: ἀκούσας అనే భూతకాల క్రియావిశేషణం ప్రధాన క్రియకు ముందున్న సందర్భాన్ని తెలియజేస్తుంది. δέ ఇక్కడ స్వల్ప అనుసంధాన పదం; సహజమైన తెలుగులో ప్రత్యేకంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: ἀπέστειλεν πρὸς αὐτὸν
  choice: ఆయన దగ్గరికి పంపాడు
  rationale: ప్రత్యక్ష కర్మగా తరువాత వచ్చే ‘యూదుల పెద్దలను’ ఉంచి, πρὸς αὐτόν సూచించే గమ్యాన్ని సహజమైన తెలుగులో తెలిపింది; సందర్భంలో ‘ఆయన’ యేసును సూచిస్తుంది.
- source_word: πρεσβυτέρους τῶν Ἰουδαίων
  choice: యూదుల పెద్దలను
  rationale: πρεσβύτεροι ఇక్కడ కేవలం వృద్ధులను కాక సమాజంలో గుర్తింపు పొందిన నాయకులను సూచిస్తుంది. ‘పెద్దలు’ ఈ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἐρωτῶν αὐτὸν
  choice: యేసును వేడుకుంటూ
  rationale: ἐρωτάω ఇక్కడ మర్యాదపూర్వకమైన విన్నపాన్ని సూచిస్తుంది. సర్వనామ గందరగోళాన్ని నివారించడానికి తెలుగులో ‘యేసును’ అని స్పష్టం చేయబడింది.
- source_word: ὅπως ἐλθὼν
  choice: రావాలని
  rationale: ὅπως మరియు ἐλθών కలిపి విన్నపంలోని ఉద్దేశాన్ని తెలియజేస్తాయి; ‘రావాలని’ ఆధునిక తెలుగులో సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: διασώσῃ
  choice: కాపాడడానికి
  rationale: διασῴζωకు కాపాడడం, రక్షించడం, సురక్షితంగా బయటపడేయడం, సందర్భానుసారంగా స్వస్థపరచడం అనే భావాలు ఉన్నాయి. తీవ్రమైన అనారోగ్య సందర్భానికి సరిపోతూనే ‘స్వస్థపరచడం’ కంటే మూలపదంలోని విస్తృత భావాన్ని ‘కాపాడడం’ నిలుపుతుంది.
- source_word: τὸν δοῦλον αὐτοῦ
  choice: తన బానిసను
  rationale: δοῦλος ఈ గృహసంబంధ సందర్భంలో శతాధిపతి అధికారానికి, యాజమాన్యానికి లోబడిన వ్యక్తిని సూచిస్తుంది. ‘బానిస’ ఆ బంధిత సామాజిక స్థితిని స్పష్టంగా నిలుపుతుంది; సంప్రదాయ ప్రత్యామ్నాయం ‘సేవకుడు’ పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: గృహసంబంధ కథనంలో δοῦλος పదం అనువాదం
  choice: బానిస
  alternative: సేవకుడు; దాసుడు
  rationale: ఈ సందర్భంలో పదం కేవలం సేవచేసే వ్యక్తినే కాక శతాధిపతి అధికారానికి బంధితుడైన గృహాధీన వ్యక్తిని సూచిస్తుంది. అందువల్ల సామాజిక వాస్తవాన్ని మరుగుపరచకుండా ‘బానిస’ను ప్రధాన పాఠంలో ఉంచి, సేవను ప్రధానంగా చూపే సంప్రదాయ అనువాదాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. వరుస సర్వనామాల వల్ల ఎవరు ఎవరిని వేడుకున్నారనే సందిగ్ధత రాకుండా రెండోసారి ‘యేసును’ అని పేర్కొనబడింది; అయినా మూలంలోని విన్నప నిర్మాణం నిలుపబడింది.
