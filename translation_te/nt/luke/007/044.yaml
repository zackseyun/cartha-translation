translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి వాడబడింది. ‘పాదాలు’ అనే పదం సందర్భానికి తగిన గంభీరతను కాపాడుతుంది; ‘నీళ్లు’ సహజమైన ఆధునిక వాడుక.
