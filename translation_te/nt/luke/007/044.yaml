id: LUK.7.44
reference: Luke 7:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ στραφεὶς πρὸς τὴν γυναῖκα τῷ Σίμωνι ἔφη· Βλέπεις ταύτην τὴν γυναῖκα; εἰσῆλθόν σου εἰς τὴν οἰκίαν, ὕδωρ ⸀μοι ἐπὶ ⸀πόδας οὐκ ἔδωκας· αὕτη δὲ τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας καὶ ταῖς ⸀θριξὶν αὐτῆς ἐξέμαξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/044.yaml
  text: And turning toward the woman[a], he said to Simon, “Do you see this woman? I entered your house; you gave me no water for my feet, but she wet my feet with her tears and wiped them with her hair.”
translation:
  language: te
  text: 'ఆ స్త్రీ వైపు తిరిగి, సీమోనుతో ఇలా అన్నాడు: “ఈ స్త్రీని చూస్తున్నావా? నేను నీ ఇంట్లోకి వచ్చాను; నా పాదాల కోసం నీవు నీళ్లు ఇవ్వలేదు[a]. కాని ఈమె తన కన్నీళ్లతో నా పాదాలను తడిపి, తన జుట్టుతో వాటిని తుడిచింది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నా పాదాల మీద నీళ్లు ఇవ్వలేదు.” ఇక్కడ పాదాలు కడుక్కోవడానికి నీళ్లు సమకూర్చే ఆచారం ఉద్దేశించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς πρὸς τὴν γυναῖκα
  choice: ఆ స్త్రీ వైపు తిరిగి
  rationale: స్త్రీ వైపు భౌతికంగా తిరిగిన చర్యను సహజమైన తెలుగు కథన శైలిలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: τῷ Σίμωνι ἔφη
  choice: సీమోనుతో ఇలా అన్నాడు
  rationale: మాట సీమోనును ఉద్దేశించినదని, దాని తరువాత ప్రత్యక్ష సంభాషణ వస్తుందని సహజంగా సూచిస్తుంది.
- source_word: Βλέπεις ταύτην τὴν γυναῖκα;
  choice: ఈ స్త్రీని చూస్తున్నావా?
  rationale: వర్తమానకాల ప్రశ్నను, ταύτην అనే నిర్దేశక పదం ఇచ్చే ప్రత్యక్ష సూచనను నిలుపుతుంది.
- source_word: εἰσῆλθόν σου εἰς τὴν οἰκίαν
  choice: నేను నీ ఇంట్లోకి వచ్చినప్పుడు
  rationale: ప్రవేశించిన సంఘటనను సహజమైన తెలుగులో అందిస్తుంది; తరువాతి ఆతిథ్య లోపంతో కాలసంబంధాన్ని స్పష్టంగా చేస్తుంది.
- source_word: ὕδωρ μοι ἐπὶ πόδας οὐκ ἔδωκας
  choice: నా పాదాలకు నీళ్లు ఇవ్వలేదు
  rationale: గ్రీకు వాక్యంలో ఉన్నట్లే నీళ్లు ఇవ్వడాన్ని మాత్రమే చెబుతుంది; పాదాలు కడగడం అనే ఉద్దేశాన్ని ప్రధాన పాఠ్యంలో అదనంగా చేర్చదు.
- source_word: αὕτη δὲ
  choice: కాని ఈమె
  rationale: సీమోను చేసినదానికీ ఈ స్త్రీ చేసినదానికీ మధ్య ఉన్న బలమైన వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας
  choice: తన కన్నీళ్లతో నా పాదాలను తడిపి
  rationale: కన్నీళ్లు సాధనంగా ఉపయోగించబడిన భావాన్ని, βρέχω యొక్క ‘తడపడం’ అనే సాధారణ అర్థాన్ని ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: ταῖς θριξὶν αὐτῆς ἐξέμαξεν
  choice: తన జుట్టుతో వాటిని తుడిచింది
  rationale: ἐκμάσσω తెలిపే తుడిచే చర్యను సహజంగా అందిస్తుంది; ‘వాటిని’ అనేది పాదాలను సూచిస్తుంది.
