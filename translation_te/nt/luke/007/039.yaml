id: LUK.7.39
reference: Luke 7:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Φαρισαῖος ὁ καλέσας αὐτὸν εἶπεν ἐν ἑαυτῷ λέγων· Οὗτος εἰ ⸀ἦν προφήτης, ἐγίνωσκεν ἂν τίς καὶ ποταπὴ ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ, ὅτι ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/039.yaml
  text: When the Pharisee who had invited him saw this[a], he said to himself, “If this man were a prophet, he would know who and what sort of woman this is who is touching him[b], because she is a sinner.”
translation:
  language: te
  text: 'తనను భోజనానికి ఆహ్వానించిన పరిసయ్యుడు అది చూసి, తనలో తాను ఇలా అనుకున్నాడు: “ఇతడు ప్రవక్త అయివుంటే, తనను తాకుతున్న ఈ స్త్రీ ఎవరో, ఎలాంటిదో[a] తెలుసుకొని ఉండేవాడు; ఎందుకంటే ఆమె పాపిని[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఎవరో, ఎలాంటిదో’—గ్రీకులో ఆమె గుర్తింపుతో పాటు ఆమె స్వభావం లేదా పేరుప్రతిష్ఠ కూడా నొక్కి చెప్పబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆమె పాపిని అని తెలుసుకొని ఉండేవాడు.” గ్రీకు వాక్యభాగాన్ని అతడు తెలుసుకునే విషయంగా గానీ, ఆమె గురించి అతని నిర్ణయానికి కారణంగా గానీ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: అది చూసి
  rationale: అనిశ్చిత భూతకాల కృదంతం ప్రధాన క్రియకు సందర్భాన్ని ఇస్తుంది. ముందరి వచనంలో జరిగిన కార్యాన్ని సూచించేందుకు తెలుగులో సహజంగా ‘అది’ చేర్చబడింది; δέకు ప్రత్యేకమైన ‘ఇప్పుడు’ అనే కాలార్థం లేదు.
- source_word: ὁ Φαρισαῖος ὁ καλέσας αὐτὸν
  choice: తనను భోజనానికి ఆహ్వానించిన పరిసయ్యుడు
  rationale: భోజన సందర్భంలో καλέω అంటే కేవలం ‘పిలుచుట’ కాక ‘ఆహ్వానించుట’. ‘భోజనానికి’ అనేది సందర్భస్పష్టత కోసం చేర్చబడింది.
- source_word: εἶπεν ἐν ἑαυτῷ λέγων
  choice: తనలో తాను ఇలా అనుకున్నాడు
  rationale: ఈ గ్రీకు నుడికారం బయట పలికిన మాటకంటే అంతరంగ సంభాషణను సూచిస్తుంది. తెలుగు వాడుకలో ‘అనుకున్నాడు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: Οὗτος
  choice: ఇతడు
  rationale: ఈ సూచన సర్వనామం యేసును కొంత దూరంగా, సందేహభావంతో ప్రస్తావిస్తుంది; ‘ఇతడు’ ఆ స్వరాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: εἰ ἦν προφήτης … ἐγίνωσκεν ἂν
  choice: ప్రవక్త అయివుంటే … తెలుసుకొని ఉండేవాడు
  rationale: εἰతో కూడిన భూతకాల రూపం, ఫలవాక్యంలో ἄνతో కూడిన అపూర్ణభూత రూపం—పరిసయ్యుడు నిజం కాదని భావించిన షరతును సూచిస్తాయి. తెలుగు సంభావ్య-వ్యతిరేక నిర్మాణం అదే భావాన్ని అందిస్తుంది.
- source_word: τίς καὶ ποταπὴ
  choice: ఎవరో, ఎలాంటిదో
  rationale: జతగా వచ్చిన ప్రశ్నార్థక పదాలు ఆ స్త్రీ గుర్తింపునూ, ఆమె స్వభావం లేదా పేరుప్రతిష్ఠనూ రెండింటినీ నొక్కిచెబుతాయి.
- source_word: ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ
  choice: తనను తాకుతున్న ఈ స్త్రీ
  rationale: ἅπτεται వర్తమాన కాలం ఆ సమయంలో కొనసాగుతున్న స్పర్శను సూచిస్తుంది. ‘తాకుతున్న’ ఆ దృశ్యంలోని కొనసాగుతున్న చర్యను నిలుపుతుంది.
- source_word: ὅτι ἁμαρτωλός ἐστιν
  choice: ఎందుకంటే ఆమె పాపిని
  rationale: ప్రధాన పాఠ్యంలో ὅτιని పరిసయ్యుని నిర్ణయానికి కారణాన్ని తెలిపేదిగా తీసుకున్నాం. అయితే దాన్ని ప్రవక్త తెలుసుకునే విషయవిషయక వాక్యంగా కూడా గ్రహించవచ్చు; ఆ అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: యేసు ప్రవక్త అనే షరతు యొక్క భావం
  choice: 'పరిసయ్యుని దృష్టిలో వాస్తవానికి విరుద్ధమైన సందేహపూర్వక షరతుగా అనువదించబడింది: ‘ఇతడు ప్రవక్త అయివుంటే … తెలుసుకొని ఉండేవాడు.’'
  alternative: 'మరింత తటస్థంగా: ‘ఇతడు ప్రవక్త అయితే … తెలుసుకునేవాడు.’'
  rationale: εἰ ἦν … ἐγίνωσκεν ἂν నిర్మాణం సాధారణంగా వాస్తవానికి విరుద్ధమైన షరతును తెలియజేస్తుంది. ఇది పరిసయ్యుని అభిప్రాయాన్ని చూపుతుంది గాని కథకుడు దానిని సమర్థిస్తున్నట్టు చేయదు.
- issue: ὅτι వాక్యభాగం జ్ఞానానికి విషయమా, లేక తీర్పుకు కారణమా
  choice: 'ప్రధాన పాఠ్యంలో కారణార్థం: ‘ఎందుకంటే ఆమె పాపిని.’'
  alternative: 'విషయార్థం: ‘ఆమె పాపిని అని తెలుసుకొని ఉండేవాడు.’'
  rationale: గ్రీకు వాక్యనిర్మాణం రెండు విధాలుగా వినిపించగలదు. ప్రధాన పాఠ్యం సందర్భంలోని కారణభావాన్ని సహజంగా ఇస్తుండగా, పాదటిప్పణి మరొక నిజమైన అవకాశాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘పరిసయ్యుడు’, ‘ప్రవక్త’, ‘పాపిని’ వంటి సుపరిచిత బైబిలు పదాలు నిలుపబడ్డాయి. అంతరంగ సంభాషణకు ‘తనలో తాను ఇలా అనుకున్నాడు’ అనే సాధారణ ఆధునిక ప్రయోగం ఎంచుకోబడింది.
