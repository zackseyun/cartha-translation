id: LUK.7.33
reference: Luke 7:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐλήλυθεν γὰρ Ἰωάννης ὁ βαπτιστὴς ⸀μὴ ⸂ἐσθίων ἄρτον μήτε πίνων οἶνον⸃, καὶ λέγετε· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/033.yaml
  text: For John the Baptist has come eating no bread and drinking no wine[a], and you say, ‘He has a demon.’
translation:
  language: te
  text: ఎందుకంటే, రొట్టె తినకుండా, ద్రాక్షామద్యం తాగకుండా ఉండే బాప్తిస్మమిచ్చే యోహాను వచ్చాడు; అయినా మీరు, “అతనికి దయ్యం పట్టింది[a]” అంటున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మూలంలో మరింత పదశః: “అతనికి దయ్యం ఉంది.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: వచ్చాడు
  rationale: గ్రీకు పరిపూర్ణ కాలం యోహాను రావడం మరియు దాని ప్రస్తుత ప్రాసంగికతను సూచిస్తుంది. తెలుగులో ఈ సందర్భంలో సహజమైన భూతకాల రూపమైన ‘వచ్చాడు’ ఆ భావాన్ని సందర్భం ద్వారా స్పష్టంగా మోస్తుంది; ‘వచ్చి ఉన్నాడు’ ఇక్కడ అసహజంగా ఉంటుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను పరిచయం చేస్తుంది. ఆధునిక తెలుగులో ‘ఎందుకంటే’ ఈ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: Ἰωάννης ὁ βαπτιστὴς
  choice: బాప్తిస్మమిచ్చే యోహాను
  rationale: ὁ βαπτιστής అనే క్రియాత్మక బిరుదును పారదర్శకంగా అందిస్తూ, యోహాను చేసిన బాప్తిస్మమిచ్చే కార్యాన్ని తెలియజేస్తుంది.
- source_word: μὴ ἐσθίων ἄρτον μήτε πίνων οἶνον
  choice: రొట్టె తినకుండా, ద్రాక్షారసం తాగకుండా
  rationale: యోహాను పాటించిన నియమబద్ధమైన జీవన విధానాన్ని తెలిపే భాగధేయ క్రియారూపాలను సహజమైన తెలుగులో అందిస్తుంది. ἄρτον అనే నిర్దిష్ట పదాన్ని సాధారణీకరించి ‘ఆహారం’ అనకుండా ‘రొట్టె’గానే ఉంచింది; οἶνονను సందర్భానుకూలంగా ‘ద్రాక్షారసం’గా అనువదించింది.
- source_word: λέγετε
  choice: మీరు … అంటున్నారు
  rationale: వర్తమాన కాలంలోని, శ్రోతల లక్షణాత్మక ప్రతిస్పందనను సహజమైన తెలుగు వర్తమాన రూపంలో వ్యక్తపరుస్తుంది.
- source_word: Δαιμόνιον ἔχει
  choice: అతనికి దయ్యం పట్టింది
  rationale: గ్రీకు నుడికారంలోని దయ్యపు ఆధీనత అనే ఆరోపణను సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది. పదశః రూపాన్ని పాదసూచికలో ఇచ్చి మూలంలోని నిర్మాణాన్ని కూడా చూపించింది.
theological_decisions:
- issue: యోహానుపై చేసిన ఆరోపణలో δαιμόνιον అనువాదం
  choice: దయ్యం
  alternative: అపవిత్రాత్మ
  rationale: ఈ వాక్యంలో δαιμόνιον అనే పదమే ఉంది. ‘అపవిత్రాత్మ’ అనేది సంబంధితమైనా వేరే గ్రీకు పదబంధానికి సరిపోతుంది; కాబట్టి ఇక్కడ పదజాలాన్ని సమన్వయపరచకుండా ‘దయ్యం’గా ఉంచడం సముచితం.
- issue: Δαιμόνιον ἔχει అనే నుడికారం
  choice: అతనికి దయ్యం పట్టింది
  alternative: అతనికి దయ్యం ఉంది
  rationale: ఎంచుకున్న రూపం తెలుగులో దయ్యపు ఆధీనత అనే ఆరోపణను సహజంగా తెలియజేస్తుంది. అయితే గ్రీకు వాక్యనిర్మాణం పదశః ‘దయ్యం ఉంది’ అనే రూపానికి దగ్గరగా ఉన్నందున దానిని పాదసూచికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘బాప్తిస్మమిచ్చే యోహాను’ అనే రూపం సంప్రదాయ గుర్తింపును నిలుపుతూ గ్రీకు బిరుదు యొక్క క్రియాత్మక భావాన్ని స్పష్టం చేస్తుంది. ‘రొట్టె’ మరియు ‘ద్రాక్షారసం’ అనే నిర్దిష్ట పదాలు మూలంలోని దృశ్యమైన, నియమబద్ధ జీవన చిత్రణను కాపాడుతాయి.
