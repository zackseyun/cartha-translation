id: LUK.7.14
reference: Luke 7:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ἥψατο τῆς σοροῦ, οἱ δὲ βαστάζοντες ἔστησαν, καὶ εἶπεν· Νεανίσκε, σοὶ λέγω, ἐγέρθητι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/014.yaml
  text: And coming up[a], he touched the bier, and the men carrying it stood still, and he said, “Young man, I say to you, arise.”
translation:
  language: te
  text: ఆయన పాడె దగ్గరకు వచ్చి దానిని తాకాడు; దానిని మోస్తున్నవారు ఆగిపోయారు. అప్పుడు ఆయన, “యువకుడా, నేను నీకు చెబుతున్నాను, లే!” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθὼν
  choice: దగ్గరికి వచ్చి
  rationale: యేసు ఊరేగింపులోని పాడె వద్దకు చేరుకున్న క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἥψατο
  choice: తాకాడు
  rationale: ఇక్కడ ἅπτω రూపం తాకడాన్ని సూచిస్తుంది; పట్టుకున్నాడని అనవసరంగా బలపరచదు.
- source_word: σοροῦ
  choice: పాడెను
  rationale: σορός అనేది మృతదేహాన్ని మోసే అంత్యక్రియల పాడె లేదా మోసే చట్రాన్ని సూచిస్తుంది; ఆధునిక మూసిన శవపేటికను తప్పనిసరిగా సూచించదు.
- source_word: οἱ δὲ βαστάζοντες
  choice: దానిని మోస్తున్నవారు
  rationale: మోసేవారిని స్పష్టంగా, లింగాన్ని మూలపాఠం కంటే ఎక్కువగా నిర్దేశించకుండా అనువదిస్తుంది.
- source_word: ἔστησαν
  choice: ఆగిపోయారు
  rationale: వారు ముందుకు కదలడం నిలిపారనే సందర్భార్థాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: Νεανίσκε
  choice: యువకుడా
  rationale: యువ పురుషునికి చేసిన ప్రత్యక్ష సంబోధనను గౌరవప్రదమైన సాధారణ తెలుగులో నిలుపుతుంది.
- source_word: σοὶ λέγω
  choice: నీతో చెబుతున్నాను
  rationale: σοί అనే స్పష్టమైన సర్వనామం ఇచ్చే ప్రత్యక్షతను, ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἐγέρθητι
  choice: లే
  rationale: మృతుడైన యువకునికి ఇచ్చిన ప్రత్యక్ష ఆజ్ఞగా సహజంగా వినిపిస్తుంది; కర్తరి/కర్మణి రూపంపై గ్రీకు రూపం కలిగించే సాధ్యమైన వ్యాకరణ చర్చను సిద్ధాంతపరంగా విస్తరించదు.
theological_decisions:
- issue: మృతుడైన యువకునికి యేసు ఇచ్చిన ఆజ్ఞ స్వరం
  choice: “లే!”
  alternative: “లేచి నిలబడు!” లేదా “లేపబడుము!”
  rationale: “లే” అనేది సంక్షిప్తమైన, గంభీరమైన ప్రత్యక్ష ఆజ్ఞ. ఇది అద్భుత అధికారాన్ని అదనపు సిద్ధాంత వివరణతో విస్తరించకుండా కథనంలోనే ఉంచుతుంది; “లేపబడుము” తెలుగులో అసహజంగా ఉండి కర్మణి భావాన్ని అతిగా ముందుకు తెస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. “పాడె” చారిత్రక సందర్భానికి సరిపడే సాధారణ పదం; అపార్థాన్ని నివారించేందుకు పాదసూచిక ఇచ్చాం. చిన్న వాక్యాలు సంఘటనల క్రమాన్ని స్పష్టంగా ఉంచుతాయి.
