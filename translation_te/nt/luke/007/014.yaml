revisions:
- from: ఆయన దగ్గరికి వచ్చి, పాడెను[a] తాకాడు. దానిని మోస్తున్నవారు ఆగిపోయారు. అప్పుడు ఆయన, “యువకుడా, నీతో చెబుతున్నాను, లే!” అన్నాడు.
  to: ఆయన పాడె దగ్గరకు వచ్చి దానిని తాకాడు; దానిని మోస్తున్నవారు ఆగిపోయారు. అప్పుడు ఆయన, “యువకుడా, నేను నీకు చెబుతున్నాను, లే!” అన్నాడు.
  rationale: The revision corrects the Telugu case relation in Jesus’ direct statement and specifies that he approached the bier. It otherwise retains the draft’s accurate lexical choices, historical clarification, and elevated but natural narrative register.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:24:09Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the approach, touch, funeral bier, halted bearers, direct address, and command. However, “నీతో చెబుతున్నాను” normally means “I am speaking with you” in modern Telugu, whereas σοὶ λέγω means “I say/tell you”; “నీకు చెబుతున్నాను” is required. Explicitly identifying the bier as the object approached also removes a small ambiguity absent from the Greek context.
  naturalness: The narrative is clear and appropriately dignified. “పాడె” is an effective historical term, and “లే!” is concise, natural direct speech in this context. The revised wording is more idiomatic modern standard Telugu.
  terminology: “పాడె” appropriately renders σορός without implying a modern enclosed coffin. “యువకుడా” and “లే!” preserve the direct, solemn register without doctrinal expansion.
  issues:
  - severity: medium
    issue: “నీతో చెబుతున్నాను” is not the natural Telugu equivalent of σοὶ λέγω.
    rationale: In modern Telugu, “నీతో” is ordinarily comitative (“with you”), while the Greek dative here marks the person addressed (“to you”). “నేను నీకు చెబుతున్నాను” preserves both the explicit first-person subject and direct address.
  - severity: low
    issue: “ఆయన దగ్గరికి వచ్చి” leaves the approached object implicit.
    rationale: The Greek participle is contextually directed toward the bier. “పాడె దగ్గరకు వచ్చి” makes the sequence explicit and reads more naturally.
  revised_text: ఆయన పాడె దగ్గరకు వచ్చి దానిని తాకాడు; దానిని మోస్తున్నవారు ఆగిపోయారు. అప్పుడు ఆయన, “యువకుడా, నేను నీకు చెబుతున్నాను, లే!” అన్నాడు.
  revised_footnotes:
  - marker: a
    text: లేదా “శవాన్ని మోసే మంచం.” గ్రీకు పదం అంత్యక్రియల ఊరేగింపులో మృతదేహాన్ని మోసే పాడె లేదా చట్రాన్ని సూచిస్తుంది; అది ఆధునిక మూసిన శవపేటికనే తప్పనిసరిగా సూచించదు.
    reason: lexical_alternative
  revision_rationale: The revision corrects the Telugu case relation in Jesus’ direct statement and specifies that he approached the bier. It otherwise retains the draft’s accurate lexical choices, historical clarification, and elevated but natural narrative register.
