id: LUK.7.30
reference: Luke 7:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι καὶ οἱ νομικοὶ τὴν βουλὴν τοῦ θεοῦ ἠθέτησαν εἰς ἑαυτούς, μὴ βαπτισθέντες ὑπ’ αὐτοῦ.)
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/030.yaml
  text: But the Pharisees and the lawyers rejected God's purpose for themselves[b][a], not having been baptized by him.
translation:
  language: te
  text: అయితే పరిసయ్యులూ ధర్మశాస్త్ర నిపుణులూ అతని[b] చేత బాప్తిస్మం పొందక, తమ విషయంలో దేవుని సంకల్పాన్ని[a] తిరస్కరించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమకు వ్యతిరేకంగా దేవుని ఆలోచనను,” లేదా “తమను గురించిన దేవుని ప్రణాళికను.”
    reason: alternative_reading
  - marker: b
    text: అంటే, బాప్తిస్మమిచ్చే యోహాను చేత.
    reason: cross_reference
lexical_decisions:
- source_word: νομικοὶ
  choice: ధర్మశాస్త్ర నిపుణులు
  rationale: ఇక్కడ ఈ పదం మోషే ధర్మశాస్త్రంలో నిపుణులైనవారిని సూచిస్తుంది. ఆధునిక న్యాయవాదులు అనే అపార్థం రాకుండా, వేరే వర్గమైన శాస్త్రులతో కలపకుండా ఈ రూపం స్పష్టంగా తెలియజేస్తుంది.
- source_word: βουλὴν
  choice: సంకల్పాన్ని
  rationale: βουλή అనే పదంలోని ఉద్దేశం, ప్రణాళిక, ఆలోచన అనే భావపరిధిని ‘సంకల్పం’ సహజంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: ἠθέτησαν
  choice: తిరస్కరించారు
  rationale: వారు దేవుని సంకల్పాన్ని అంగీకరించకుండా తోసిపుచ్చారనే సందర్భార్థాన్ని ఇది నేరుగా తెలియజేస్తుంది; ‘రద్దు చేశారు’ అనడం దేవుని సంకల్పాన్నే నిర్వీర్యం చేశారనే అదనపు భావాన్ని కలిగించవచ్చు.
- source_word: εἰς ἑαυτούς
  choice: తమ విషయంలో
  rationale: ఈ గ్రీకు పదబంధం తమ కోసం, తమను గురించి, లేదా తమకు వ్యతిరేకంగా అనే భావసాధ్యతలను కలిగి ఉంది. ‘తమ విషయంలో’ వ్యక్తిగత సంబంధాన్ని తెలియజేస్తూ, అనవసరంగా ఒక్క అర్థానికే పరిమితం చేయదు.
- source_word: μὴ βαπτισθέντες ὑπ’ αὐτοῦ
  choice: అతని చేత బాప్తిస్మం పొందక
  rationale: నిషేధార్థక భూతకాల కర్మణి కృదంతాన్ని సహజమైన తెలుగు అసమాపక క్రియగా ఇచ్చి, అది కారణమా, సాధనమా, లేక అనుబంధ పరిస్థితియా అన్నది అతిగా నిర్ణయించకుండా ఉంచుతుంది.
- source_word: αὐτοῦ
  choice: అతని
  rationale: మూలంలోని సర్వనామాన్ని నిలుపుతూ, సందర్భంలో అది బాప్తిస్మమిచ్చే యోహానును సూచిస్తుందని పాదసూచికలో స్పష్టం చేయబడింది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వచనంలో యోహాను బాప్తిస్మాన్ని స్వీకరించినవారితో ఇక్కడివారి మధ్య ఉన్న వ్యత్యాసాన్ని సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: పరిసయ్యులు, ధర్మశాస్త్ర నిపుణులకు సంబంధించి దేవుని βουλή భావం
  choice: తమ విషయంలో దేవుని సంకల్పం
  alternative: తమకు వ్యతిరేకంగా దేవుని ఆలోచన; తమను గురించిన దేవుని ప్రణాళిక
  rationale: వారు తమకు సంబంధించిన దేవుని ఉద్దేశాన్ని తిరస్కరించారని వచనం చెబుతుంది. దేవుని నిర్ణయాత్మక చిత్తం సంపూర్ణంగా భంగమైందని గానీ, ఇక్కడ కేవలం సలహా మాత్రమే ఉందని గానీ అదనంగా తీర్మానించకుండా మూలంలోని వేదాంత ఉద్రిక్తతను ఈ అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘న్యాయవాదులు’కు బదులు ‘ధర్మశాస్త్ర నిపుణులు’ అని ఇచ్చి ప్రాచీన యూద ధర్మశాస్త్ర సందర్భాన్ని స్పష్టం చేశాం. అసమాపక క్రియారూపమైన ‘పొందక’ మూలంలోని కృదంత సంబంధాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
