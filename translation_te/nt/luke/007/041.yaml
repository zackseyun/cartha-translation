  text: δύο χρεοφειλέται ἦσαν δανιστῇ τινι· ὁ εἷς ὤφειλεν δηνάρια πεντακόσια, ὁ δὲ ἕτερος πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/041.yaml
  text: 'Two debtors owed a certain moneylender: one owed five hundred denarii[a], and the other fifty.'
translation:
  language: te
  text: “ఒక రుణదాతకు ఇద్దరు అప్పుదారులు ఉన్నారు. ఒకడు ఐదువందల దేనారాలు[a] బాకీ ఉండేవాడు, మరొకడు యాభై దేనారాలు బాకీ ఉండేవాడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: దేనారం ఒక ప్రామాణిక రోమా వెండి నాణెం; సాధారణంగా అది ఒక కూలీ ఒక రోజు సంపాదించే వేతనానికి దాదాపు సమానంగా ఉండేది.
    reason: cultural_note
lexical_decisions:
- source_word: χρεοφειλέται
  choice: రుణగ్రస్తులు
  rationale: అప్పు చెల్లించవలసిన వ్యక్తులను సూచించే గ్రీకు నామవాచకానికి ఇది నేరుగా సరిపోయే, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: δανιστῇ τινι
  choice: ఒక వడ్డీ వ్యాపారికి
  rationale: δανιστής డబ్బు అప్పుగా ఇచ్చే వ్యక్తిని సూచిస్తుంది; τινι కథలో నిర్దిష్టత తెలియని ఒక వ్యక్తిని పరిచయం చేస్తుంది. ‘వడ్డీ వ్యాపారి’ సాధారణ పాఠకుడికి సహజంగా అర్థమవుతుంది.
- source_word: ὤφειλεν
  choice: బాకీ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం అప్పటి కొనసాగుతున్న రుణస్థితిని తెలియజేస్తుంది; తెలుగులో ‘బాకీ ఉన్నారు’ సహజమైన కథన ప్రయోగం.
- source_word: δηνάρια
  choice: దేనారాలు
  rationale: ఇది నిర్దిష్టమైన రోమా నాణెం/ద్రవ్య ప్రమాణం కాబట్టి సాధారణ ‘నాణేలు’గా మార్చకుండా చారిత్రక పదాన్ని లిప్యంతరీకరించాం; వివరణను పాదసూచికలో ఇచ్చాం.
- source_word: πεντακόσια
  choice: ఐదువందల
  rationale: δηνάριαను విశేషించే సంఖ్యకు నేరమైన తెలుగు రూపం.
- source_word: ἕτερος
  choice: మరొకడు
  rationale: ὁ εἷςతో ఉన్న జత వ్యత్యాసాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: πεντήκοντα
  choice: యాభై దేనారాలు
  rationale: మూలంలో నాణెం పేరు రెండో భాగంలో అధ్యాహారంగా ఉన్నా, తెలుగులో స్పష్టత కోసం దాన్ని పునరుక్తి చేశాం.
