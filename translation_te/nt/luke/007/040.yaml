source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν· Σίμων, ἔχω σοί τι εἰπεῖν. ὁ δέ· ⸂Διδάσκαλε, εἰπέ, φησίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/040.yaml
  text: And Jesus answered and said to him[a], “Simon, I have something to say to you.” And he said, “Teacher, say it.”
translation:
  language: te
  text: 'యేసు అతనికి జవాబుగా ఇలా అన్నాడు: “సీమోనూ, నేను నీతో ఒక మాట చెప్పాలి.” అందుకు అతడు, “బోధకుడా, చెప్పండి” అన్నాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν πρὸς αὐτόν
  choice: అప్పుడు యేసు అతనితో ... అన్నాడు
  rationale: ἀποκριθείς ఇక్కడ తరువాతి మాటకు ప్రతిస్పందనాత్మక ప్రవేశాన్ని ఇస్తుంది. తెలుగులో ‘జవాబిచ్చి అన్నాడు’ అనేది భారంగా ఉండటంతో, సందర్భానుకూలమైన ‘అప్పుడు’తో సహజ కథనశైలిలో వ్యక్తం చేశాం; πρὸς αὐτόν ను ‘అతనితో’గా నిలిపాం.
- source_word: Σίμων
  choice: సీమోనూ
  rationale: వ్యక్తిపేరును తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో లిప్యంతరీకరించి, ప్రత్యక్ష సంబోధనకు అనుగుణంగా సంబోధన విభక్తిని వాడాం.
- source_word: ἔχω σοί τι εἰπεῖν
  choice: నేను నీతో ఒక మాట చెప్పాలి
  rationale: గ్రీకు నుడికారానికి సహజమైన ఆధునిక తెలుగు సమానార్థకం. σοί లోని వ్యక్తిగత ఉద్దేశాన్ని ‘నీతో’ స్పష్టంగా తెలియజేస్తుంది; τι ను ‘ఒక మాట’గా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Διδάσκαλε
  choice: బోధకుడా
  rationale: διδάσκαλος యొక్క ప్రధాన అర్థం బోధించే వ్యక్తి. ‘ప్రభువా’ లేదా ‘యజమానీ’ వంటి అధిక అధికార సూచనలను చేర్చకుండా మూలార్థాన్ని కాపాడుతుంది.
- source_word: εἰπέ
  choice: చెప్పండి
  rationale: రెండవ పురుష ఏకవచన ఆజ్ఞారూపాన్ని తెలుగు సంభాషణలో గౌరవసూచకంగా సహజంగా పలికే రూపంలో ఇచ్చాం. మూలంలో స్పష్టమైన కర్మ లేకపోవడంతో ‘దాన్ని’ చేర్చలేదు.
- source_word: φησίν
  choice: అన్నాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని తెలుగు కథనంలో సహజమైన భూతకాల రూపంగా అందించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణా శైలి. యేసును ఉద్దేశించిన క్రియలో గౌరవ బహువచనాన్ని వాడినా, మూలంలోని వ్యక్తిసూచన మారదు. గ్రీకు వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా దాని భావం, సంభాషణ గతి నిలిపాం.
