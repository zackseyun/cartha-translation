id: LUK.7.29
reference: Luke 7:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: (καὶ πᾶς ὁ λαὸς ἀκούσας καὶ οἱ τελῶναι ἐδικαίωσαν τὸν θεόν, βαπτισθέντες τὸ βάπτισμα Ἰωάννου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/029.yaml
  text: And all the people[a], when they heard this, including the tax collectors, declared God to be righteous[b], having been baptized with John's baptism.
translation:
  language: te
  text: ప్రజలందరూ—సుంకం వసూలు చేసేవారు కూడా—ఇది విని, యోహాను బాప్తిస్మం పొందినవారై, దేవుడు న్యాయవంతుడని అంగీకరించారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత పదానుసారంగా, ‘దేవుణ్ణి సమర్థించారు.’ అంటే దేవునిదే న్యాయమని వారు అంగీకరించారు.
    reason: lexical_alternative
  - marker: b
    text: 'ఈ కృదంతాన్ని కారణార్థకంగా కూడా అర్థం చేసుకోవచ్చు: ‘యోహాను బాప్తిస్మం పొందినందువల్ల.’'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: ప్రజలందరూ
  rationale: ఏకవచన సమూహార్థక గ్రీకు పదబంధంలోని విస్తృత భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀκούσας
  choice: ఇది విని
  rationale: భూతకాల కృదంతాన్ని సందర్భానుసారమైన కాలార్థంలో అందిస్తుంది; ‘ఇది’ అనే కర్మ ముందున్న మాటలను సూచిస్తుంది.
- source_word: οἱ τελῶναι
  choice: సుంకం వసూలు చేసేవారు
  rationale: ఆ కాలంలో అధికారుల తరఫున సుంకాలు వసూలు చేసినవారిని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేసే ఆధునిక పదబంధం.
- source_word: ἐδικαίωσαν τὸν θεόν
  choice: దేవుడు న్యాయవంతుడని అంగీకరించారు
  rationale: మనుషులు దేవుణ్ణి న్యాయవంతునిగా చేస్తున్నారనే అపార్థం రాకుండా, దేవుడు న్యాయమైనవాడని వారు ఒప్పుకున్న భావాన్ని వ్యక్తం చేస్తూ δικαιόω యొక్క న్యాయపరమైన ఛాయను నిలుపుతుంది.
- source_word: βαπτισθέντες
  choice: బాప్తిస్మం పొందినవారై
  rationale: కృదంతాన్ని స్పష్టంగా కారణార్థకంగా మార్చకుండా, వారి ప్రతిస్పందనకు సంబంధించిన నేపథ్య పరిస్థితిగా తటస్థంగా ఉంచుతుంది.
- source_word: τὸ βάπτισμα Ἰωάννου
  choice: యోహాను ఇచ్చిన బాప్తిస్మం
  rationale: యోహానుతో సంబంధమున్న బాప్తిస్మాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; యోహానే ఆ ఆచారాన్ని నిర్వహించాడనే సందర్భార్థాన్ని అందిస్తుంది.
theological_decisions:
- issue: ‘దేవుణ్ణి సమర్థించారు’ (ἐδικαίωσαν τὸν θεόν) అనే పదబంధం భావం
  choice: దేవుడు న్యాయవంతుడని వారు అంగీకరించారు
  alternative: దేవుణ్ణి సమర్థించారు
  rationale: ఈ వాక్యం దేవుని స్థితిలో మనుషులు మార్పు తెచ్చారని కాదు, దేవునిదే న్యాయమని వారు ఒప్పుకున్నారని చెబుతుంది. ప్రధాన పాఠం ఆ భావాన్ని స్పష్టంగా ఉంచగా, పాదసూచిక మరింత రూపానుగుణమైన అనువాదాన్ని ఇస్తుంది.
- issue: βαπτισθέντες కృదంతం యొక్క సంబంధం
  choice: పరిస్థితి లేదా నేపథ్యాన్ని తెలిపే తటస్థ కృదంత రూపం
  alternative: ‘యోహాను ఇచ్చిన బాప్తిస్మం పొందారు కాబట్టి’ అనే కారణార్థక పఠనం
  rationale: సందర్భంలో కారణార్థం సాధ్యమైనప్పటికీ గ్రీకు కృదంతం దానిని తప్పనిసరి చేయదు. అందువల్ల ప్రధాన పాఠం అనిశ్చితిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘కూడా’ గ్రీకులోని సాధారణ సమన్వయాన్ని మాత్రమే తెలియజేస్తుంది; అవసరానికి మించిన ఆశ్చర్యం లేదా ప్రత్యేక ఉద్ఘాటనను చేర్చదు. రెండు పాదసూచిక గుర్తులు సంబంధిత వాక్యాంతంలో ఉంచబడ్డాయి.
