id: LUK.7.2
reference: Luke 7:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἑκατοντάρχου δέ τινος δοῦλος κακῶς ἔχων ἤμελλεν τελευτᾶν, ὃς ἦν αὐτῷ ἔντιμος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/002.yaml
  text: A certain centurion’s servant[a], who was sick and about to die, was highly valued by him.
translation:
  language: te
  text: ఒక శతాధిపతికి చెందిన దాసుడు[a] జబ్బుపడి చనిపోబోతున్నాడు. అతడు ఆ శతాధిపతికి ఎంతో విలువైనవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సేవకుడు.” గ్రీకు పదమైన doulos సందర్భాన్ని బట్టి “దాసుడు” లేదా “సేవకుడు” అని అర్థమివ్వవచ్చు. ఇక్కడ యజమాని ఆధీనంలో ఉన్న సంబంధాన్ని స్పష్టంగా చూపడానికి “దాసుడు” అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑκατοντάρχου ... τινος
  choice: ఒక శతాధిపతికి చెందిన
  rationale: సంబంధ విభక్తిలోని యజమాని సంబంధాన్ని, τινος సూచించే అనిర్దిష్టతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δέ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది స్వల్ప కథన మార్పును సూచిస్తుంది; తెలుగులో వాక్యప్రవాహమే ఆ మార్పును సహజంగా తెలియజేస్తుంది. ‘ఇప్పుడు’ అని చేరిస్తే మూలంలో లేని కాలార్థం బలపడవచ్చు.
- source_word: δοῦλος
  choice: దాసుడు
  rationale: మొదటి శతాబ్దపు యజమాని–బానిస సంబంధంలోని ఆధీన స్థితిని ‘సేవకుడు’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: κακῶς ἔχων
  choice: జబ్బుపడి
  rationale: ‘దయనీయ స్థితిలో ఉండడం’ అనే గ్రీకు నుడికారాన్ని ఈ వైద్య సందర్భంలో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἤμελλεν τελευτᾶν
  choice: చనిపోబోతున్నాడు
  rationale: μέλλω మరియు క్రియారూపం తెలియజేసే సమీప మరణాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: ὃς ἦν αὐτῷ ἔντιμος
  choice: అతడు ఆ శతాధిపతికి ఎంతో విలువైనవాడు
  rationale: ἔντιμος లోని గౌరవం/విలువ భావాన్ని నిలుపుతూ, మూలం కంటే ఎక్కువ భావోద్వేగాన్ని చేర్చకుండా ఉంటుంది.
theological_decisions:
- issue: గృహ దాస్య సందర్భంలో δοῦλος అనువాదం
  choice: దాసుడు
  alternative: సేవకుడు
  rationale: ఈ సందర్భంలో ఆధీనత, యజమాని సంబంధం పదార్థంలో భాగం. ‘దాసుడు’ ఆ చారిత్రక సామాజిక వాస్తవాన్ని నిలుపుతుంది; ‘సేవకుడు’ సాధ్యమైన విస్తృత అర్థంగా పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. పొడవైన గ్రీకు వాక్యాన్ని రెండు సహజ తెలుగు వాక్యాలుగా విభజించి, సర్వనామ సూచనలో సందిగ్ధత రాకుండా రెండో వాక్యంలో ‘ఆ శతాధిపతికి’ అని స్పష్టం చేయబడింది.
