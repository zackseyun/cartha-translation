id: LUK.7.7
reference: Luke 7:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὸ οὐδὲ ἐμαυτὸν ἠξίωσα πρὸς σὲ ἐλθεῖν· ἀλλὰ εἰπὲ λόγῳ, καὶ ⸀ἰαθήτω ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/007.yaml
  text: Therefore I did not even consider myself worthy to come to you. But say the word[a], and let my servant be healed.
translation:
  language: te
  text: అందుకే నీ దగ్గరకు రావడానికి కూడా నన్ను నేను అర్హుడిగా భావించలేదు. అయితే ఒక్క మాట చెప్పు; నా సేవకుడు[a] స్వస్థపడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా బాలుడు,’ ‘నా బిడ్డ.’ గ్రీకు పదం సందర్భాన్ని బట్టి బిడ్డను, యువకుణ్ణి లేదా సేవకుణ్ణి సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: అందుకే
  rationale: ముందటి వాక్యంలో చెప్పిన కారణం నుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో చూపిస్తుంది.
- source_word: οὐδὲ
  choice: కూడా ... భావించలేదు
  rationale: తాను రావడానికి సైతం తగినవాడిగా ఎంచుకోలేదనే బలమైన నిరాకరణను వ్యక్తం చేస్తుంది.
- source_word: ἐμαυτὸν ἠξίωσα
  choice: నేను తగినవాడినని భావించలేదు
  rationale: తనను తాను అర్హుడిగా లేదా తగినవాడిగా ఎంచడం అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: πρὸς σὲ ἐλθεῖν
  choice: నీ దగ్గరకు రావడానికి
  rationale: యేసును వ్యక్తిగతంగా సమీపించడాన్ని సాధారణ, స్పష్టమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀλλὰ
  choice: అయితే
  rationale: మునుపటి నిరాకరణకు భిన్నంగా ఇప్పుడు చేస్తున్న అభ్యర్థనను సూచిస్తుంది.
- source_word: εἰπὲ λόγῳ
  choice: మాటతోనే చెప్పు
  rationale: λόγῳ అనే దత్తివిభక్తి రూపాన్ని ‘మాట ద్వారా’ అనే సాధనార్థంలో తీసుకుని, యేసు అధికారపూర్వక వాక్కు చాలు అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; గ్రీకులో నిర్దిష్ట ఉపపదం లేనందున ‘ఆ మాట’ అని చేయలేదు.
- source_word: ἰαθήτω
  choice: స్వస్థపరచబడాలి
  rationale: మూడవ పురుష ఏకవచన అఓరిస్ట్ కర్మణి ఆజ్ఞార్థక రూపాన్ని భవిష్యదర్థక వాక్యంగా మార్చకుండా, కోరిన ఫలితాన్ని సూచించే ఆజ్ఞార్థక భావంతో నిలుపుతుంది.
- source_word: ὁ παῖς μου
  choice: నా సేవకుడు
  rationale: παῖς అనే పదానికి బాలుడు, బిడ్డ, సేవకుడు అనే అర్థాలు ఉండగలవు. శతాధిపతి గృహాధికార సందర్భంలో ‘సేవకుడు’ ప్రధాన పాఠానికి అత్యంత స్పష్టంగా సరిపోతుంది; మిగతా సాధ్యార్థాలు పాదసూచికలో ఉన్నాయి.
theological_decisions:
- issue: శతాధిపతి వృత్తాంతంలో παῖς పదానికి అనువాదం
  choice: నా సేవకుడు
  alternative: నా బాలుడు / నా బిడ్డ
  rationale: సందర్భం శతాధిపతి అధికారంలో ఉన్న గృహసభ్యుణ్ణి సూచిస్తుంది కాబట్టి ‘సేవకుడు’ అనుకూలంగా ఉంది. అయితే మూలపదంలో ఉండగల వయస్సు లేదా ఆప్యాయత భావాన్ని ఖచ్చితంగా తొలగించకుండా ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
- issue: ἰαθήτω యొక్క విధి
  choice: స్వస్థపరచబడాలి
  alternative: స్వస్థపడతాడు
  rationale: మూలంలోని కర్మణి ఆజ్ఞార్థక రూపాన్ని భవిష్యత్ సూచక రూపంగా సవరించకుండా, దాని అసాధారణమైనప్పటికీ నిజమైన ఆజ్ఞార్థక ఉద్వేగాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘మాటతోనే’ యేసు వాక్కు యొక్క అధికారాన్ని సహజంగా చూపిస్తుంది. [a] గుర్తు ప్రధాన పాఠంలో ‘సేవకుడు’ వెంట ఉంచబడింది.
