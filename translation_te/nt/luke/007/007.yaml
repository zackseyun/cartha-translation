review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the inference (διὸ), intensified self-disqualification (οὐδὲ ἐμαυτὸν ἠξίωσα), approach to Jesus, and the lexical contextual sense of παῖς as ‘servant.’ However, ‘మాటతోనే చెప్పు’ is less idiomatic and shifts the sense toward speaking by means of a word. ‘ఒక్క మాట చెప్పు’ naturally conveys εἰπὲ λόγῳ. ‘స్వస్థపరచబడాలి’ is a stiff passive and can suggest obligation; ‘స్వస్థపడాలి’ is natural Telugu while retaining the third-person imperative/resultative request.
  naturalness: The revised wording uses modern standard Telugu and maintains the centurion’s respectful direct address without unnecessarily elevating the register. Explicitly rendering the reflexive sense as ‘నన్ను నేను’ improves clarity.
  terminology: ‘సేవకుడు’ is contextually sound for παῖς and the footnote appropriately preserves the possible child/youth senses. ‘స్వస్థపడాలి’ is the ordinary modern expression for being healed/recovering and avoids an unnatural periphrastic passive.
  issues:
  - severity: low
    issue: ‘మాటతోనే చెప్పు’ is awkward for εἰπὲ λόγῳ.
    rationale: In Telugu, ‘మాటతో’ more readily means ‘with/by a word’ rather than the idiomatic request to issue a command. ‘ఒక్క మాట చెప్పు’ is direct and natural, without making λόγος definite.
  - severity: medium
    issue: ‘స్వస్థపరచబడాలి’ is unnaturally passive and may carry a sense of obligation.
    rationale: The Greek is a third-person passive imperative. Telugu idiom normally expresses the desired healing as ‘స్వస్థపడాలి’; in this imperative context it retains the requested-result force more naturally.
  - severity: low
    issue: The reflexive force of ἐμαυτόν is only implicit.
    rationale: ‘నన్ను నేను అర్హుడిగా భావించలేదు’ explicitly reflects the Greek reflexive object and is natural modern Telugu.
  revised_text: అందుకే నీ దగ్గరకు రావడానికి కూడా నన్ను నేను అర్హుడిగా భావించలేదు. అయితే ఒక్క మాట చెప్పు; నా సేవకుడు[a] స్వస్థపడాలి.
  revised_footnotes:
  - marker: a
    text: లేదా ‘నా బాలుడు,’ ‘నా బిడ్డ.’ గ్రీకు పదం సందర్భాన్ని బట్టి బిడ్డను, యువకుణ్ణి లేదా సేవకుణ్ణి సూచించగలదు.
    reason: lexical_alternative
  revision_rationale: The revision retains the draft’s contextual rendering of παῖς and its lexical footnote, while making the command/request idiomatic in modern Telugu. It also replaces a cumbersome passive with the standard Telugu healing expression and makes the source reflexive explicit. No disputed textual issue is involved.
