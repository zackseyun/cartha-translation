  source_fidelity: మూలంలోని పరిపూర్ణ క్రియకు ‘వచ్చాడు’ సందర్భానుకూలమైన తెలుగు రూపం. అయితే ‘ద్రాక్షారసం’ సాధారణంగా మత్తులేని పానీయాన్ని సూచిస్తుంది; οἰνοπότης లోని wine/మద్య భావాన్ని అది తప్పుగా మార్చుతుంది. ‘అప్పుడు’ అనే కాలసూచకం మూలంలో లేదు. ἄνθρωπος ను పూర్తిగా వదలకుండా ఉంచడం ఆరోపణ యొక్క రూపాన్ని మరింత నిష్ఠగా ప్రతిబింబిస్తుంది.
