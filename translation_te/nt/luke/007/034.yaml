id: LUK.7.34
reference: Luke 7:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐλήλυθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγετε· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, φίλος τελωνῶν καὶ ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/034.yaml
  text: The Son of Man has come eating and drinking[a], and you say, ‘Look, a glutton and a drunkard, a friend of tax collectors and sinners!’
translation:
  language: te
  text: మనుష్యకుమారుడు తింటూ తాగుతూ వచ్చాడు, అయినా మీరు, ‘ఇదిగో, ఒక మనిషి—తిండిపోతు, తాగుబోతు; పన్ను వసూలు చేసేవారికీ పాపులకూ స్నేహితుడు!’ అంటున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: వచ్చాడు
  rationale: గ్రీకు పరిపూర్ణ కాలం ఆయన వచ్చి ఉన్నాడనే భావాన్ని కలిగిస్తుంది; తెలుగులో సహజంగా ‘వచ్చాడు’ అని చెప్పడం సందర్భంలో ఆ భావాన్ని అందిస్తుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: యేసు తనను గురించి వాడిన స్థిరమైన బిరుదును, దాని గ్రంథాంతర మరియు క్రీస్తుసంబంధ ప్రతిధ్వనులను కాపాడుతుంది.
- source_word: ἐσθίων καὶ πίνων
  choice: తింటూ తాగుతూ
  rationale: క్రియతో పాటు జరిగే విధానాన్ని తెలిపే గ్రీకు వర్తమాన కృదంతాలను సహజమైన తెలుగు కృదంత నిర్మాణంతో అందిస్తుంది.
- source_word: λέγετε
  choice: మీరు … అంటున్నారు
  rationale: వర్తమాన కాలంలోని ప్రత్యక్ష సంబోధనను సహజంగా, కొనసాగుతున్న ఆరోపణ భావంతో వ్యక్తపరుస్తుంది.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: దృష్టిని ఆకర్షించే ఆశ్చర్యార్థక, సూచనాత్మక బలాన్ని ఆధునిక గౌరవప్రద తెలుగులో నిలుపుతుంది.
- source_word: ἄνθρωπος
  choice: ఇతడు
  rationale: అక్షరార్థంగా ‘మనిషి’ ఉన్నప్పటికీ, తెలుగు ఆరోపణ వాక్యంలో ‘ఇతడు’ సహజంగా వ్యక్తిని సూచించి తదనంతర నామవాచకాలను అనుసంధానిస్తుంది.
- source_word: φάγος
  choice: తిండిపోతు
  rationale: అతిగా తినేవాడని దూషించే పదునైన నిందార్థాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: οἰνοπότης
  choice: ద్రాక్షారసం తాగేవాడు
  rationale: పదశః ‘ద్రాక్షారసం తాగేవాడు’; మూలంలోని పానీయాన్ని స్పష్టంగా ఉంచి, ‘తాగుబోతు’ అనే మరింత వ్యాఖ్యానాత్మక పదాన్ని ప్రధాన పాఠ్యంలో నివారిస్తుంది.
- source_word: φίλος
  choice: స్నేహితుడు
  rationale: ఆరోపణల వరుసలోని విధేయ నామవాచకాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: τελωνῶν
  choice: పన్ను వసూలు చేసేవారు
  rationale: రోమా పరిపాలనా సందర్భంలోని పన్ను సేకరణ వృత్తిని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἁμαρτωλῶν
  choice: పాపులు
  rationale: వ్యతిరేకులు ఉపయోగించిన సామాజిక-మతపరమైన ముద్రను నేరుగా కాపాడుతుంది.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου అనే యేసు బిరుదు
  choice: మనుష్యకుమారుడు
  alternative: మానవుడు
  rationale: దీనిని సాధారణ మానవ సూచనగా కుదించకుండా, బిరుదు స్వభావాన్ని మరియు సంభావ్య దానియేలు గ్రంథ ప్రతిధ్వనిని నిలుపుతుంది.
- issue: యేసుపై చేసిన ఆరోపణల బలం
  choice: తిండిపోతు, ద్రాక్షారసం తాగేవాడు
  alternative: తిండిబోతు, తాగుబోతు
  rationale: ఇవి విరోధులు చేసిన దూషణలని స్పష్టంగా ఉంచుతూ φάγος యొక్క నిందార్థాన్ని కాపాడుతుంది; οἰνοπότης విషయంలో మూలంలోని ‘ద్రాక్షారసం’ భావాన్ని ప్రధాన పాఠ్యంలో నిలిపి, మరింత ప్రయోగాత్మక ప్రత్యామ్నాయాన్ని పాదటీకలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. ప్రత్యక్ష ఉక్తిలోని దూషణ పదును తగ్గించలేదు; అదే సమయంలో మూలంలోని పదార్థాన్ని అతిగా వ్యాఖ్యానించకుండా ఉంచాం.
