  to: యేసు వారితో కలిసి వెళ్లాడు. ఆయన అప్పటికే ఇంటికి చాలా దూరంలో లేనప్పుడు, శతాధిపతి తన స్నేహితులను ఆయన దగ్గరికి పంపి, “ప్రభువా,[a] మీరు శ్రమ తీసుకోవద్దు. ఎందుకంటే, నా ఇంటి కప్పు కిందకు మీరు ప్రవేశించడానికి నేను యోగ్యుణ్ణి కాను.[b]” అని చెప్పించాడు.
