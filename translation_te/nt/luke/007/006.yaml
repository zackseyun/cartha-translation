id: LUK.7.6
reference: Luke 7:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐπορεύετο σὺν αὐτοῖς. ἤδη δὲ αὐτοῦ οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας ἔπεμψεν ⸂φίλους ὁ ἑκατοντάρχης⸃ λέγων αὐτῷ· Κύριε, μὴ σκύλλου, οὐ γὰρ ⸂ἱκανός εἰμι⸃ ἵνα ὑπὸ τὴν στέγην μου εἰσέλθῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/006.yaml
  text: So Jesus went with them[a]. But when he was already not far from the house, the centurion sent friends, saying to him, “Lord, do not trouble yourself[b], for I am not worthy that you should come under my roof.”
translation:
  language: te
  text: యేసు వారితో కలిసి వెళ్లాడు. ఆయన అప్పటికే ఇంటికి చాలా దూరంలో లేనప్పుడు, శతాధిపతి తన స్నేహితులను ఆయన దగ్గరికి పంపి, “ప్రభువా,[a] మీరు శ్రమ తీసుకోవద్దు. ఎందుకంటే, నా ఇంటి కప్పు కిందకు మీరు ప్రవేశించడానికి నేను యోగ్యుణ్ణి కాను.[b]” అని చెప్పించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అయ్యా.” గ్రీకులో κύριε అనే పదం గౌరవపూర్వక సంబోధనగా ఉండవచ్చు; యేసు అధికారాన్ని గుర్తిస్తున్న భావాన్ని కూడా సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా “తగినవాణ్ణి కాను” లేదా “అర్హుణ్ణి కాను.” గ్రీకు పదం తగినతనాన్ని, సామర్థ్యాన్ని లేదా యోగ్యతను సూచించగలదు; ఇక్కడ అది యేసు ఎదుట శతాధిపతి చూపిన వినయాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύετο
  choice: వెళ్లాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే ప్రయాణాన్ని సందర్భానుసారంగా సహజమైన తెలుగు కథన శైలిలో తెలియజేస్తుంది.
- source_word: σὺν αὐτοῖς
  choice: వారితో కలిసి
  rationale: యేసు వారితో పాటు వెళ్లాడనే సహచర్య భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἤδη ... οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας
  choice: ఆయన అప్పటికే ఇంటికి ఎంతో దూరంలో లేనప్పుడు
  rationale: కాలాన్ని సూచించే గ్రీకు నిర్మాణాన్నీ, ‘దూరంలో లేడు’ అనే మూలపాఠపు వ్యక్తీకరణనూ సాధ్యమైనంత దగ్గరగా కాపాడుతుంది.
- source_word: ἔπεμψεν φίλους
  choice: తన స్నేహితులను ... పంపి
  rationale: φίλους అనే బహువచన నామవాచకానికి సహజమైన తెలుగు రూపం; సందర్భం వల్ల వారు శతాధిపతి స్నేహితులని స్పష్టం చేయబడింది.
- source_word: ὁ ἑκατοντάρχης
  choice: శతాధిపతి
  rationale: రోమా సైన్యంలోని ఈ హోదాకు తెలుగులో ప్రామాణికంగా, సంక్షిప్తంగా వాడే పదం.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: గౌరవపూర్వక సంబోధనను, అలాగే యేసు అధికారాన్ని గుర్తించే లోతైన భావానికి ఉన్న అవకాశాన్ని నిలుపుతుంది.
- source_word: μὴ σκύλλου
  choice: మీరు శ్రమ తీసుకోవద్దు
  rationale: ఇక్కడి గ్రీకు జాతీయానికి తగిన గౌరవపూర్వకమైన, సహజమైన తెలుగు వ్యక్తీకరణ.
- source_word: ἱκανός εἰμι
  choice: నేను యోగ్యుణ్ణి కాను
  rationale: ἱκανόςకు సామర్థ్యం, తగినతనం, యోగ్యత అనే భావాలు ఉండవచ్చు; ఇక్కడ శతాధిపతి చూపే వినయాన్ని ‘యోగ్యుడు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα ... εἰσέλθῃς
  choice: మీరు ... రావడానికి
  rationale: తాను దేనికి యోగ్యుడు కాదని శతాధిపతి భావిస్తున్నాడో తెలిపే ἵνα ఉపవాక్య భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ὑπὸ τὴν στέγην μου
  choice: నా ఇంటి కప్పు కిందికి
  rationale: ‘నా ఇంటిలోకి’ అని పూర్తిగా భావానువాదం చేయకుండా, మూలంలోని స్పష్టమైన ‘కప్పు కింద’ రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యేసును నేరుగా సంబోధించిన κύριος పదం
  choice: ప్రభువా
  alternative: అయ్యా
  rationale: ఈ సందర్భంలో ఇది గౌరవ సంబోధనగా ఉండవచ్చు; అదే సమయంలో యేసు అధికారాన్ని మరింత లోతుగా గుర్తించే భావానికీ అవకాశం ఉంది. ‘ప్రభువా’ ఆ రెండవ అవకాశాన్ని తొలగించకుండా ఉంచుతుంది; అయితే పూర్తిగా వికసించిన క్రీస్తు సంబంధమైన ఒప్పుకోలును బలవంతంగా మోపదు.
- issue: ἱκανός పదంలోని యోగ్యత–తగినతనం భావవ్యాప్తి
  choice: యోగ్యుణ్ణి కాను
  alternative: తగినవాణ్ణి కాను / అర్హుణ్ణి కాను
  rationale: సందర్భంలో శతాధిపతి వినయం ప్రధానంగా వినిపిస్తుంది. అయినా మూలపదంలోని ‘తగినతనం’ భావాన్ని పాదసూచిక ద్వారా నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘శతాధిపతి,’ ‘ప్రభువా,’ ‘యోగ్యుణ్ణి’ వంటి పరిచితమైన బైబిలు పదాలను కొనసాగిస్తూ, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సులభంగా ఉంచాం. పాదసూచిక గుర్తులు సంబంధిత పదాల వెంటనే ఉంచబడ్డాయి.
