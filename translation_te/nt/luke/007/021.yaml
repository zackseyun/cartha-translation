id: LUK.7.21
reference: Luke 7:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν ⸀ἐκείνῃ τῇ ὥρᾳ ἐθεράπευσεν πολλοὺς ἀπὸ νόσων καὶ μαστίγων καὶ πνευμάτων πονηρῶν, καὶ τυφλοῖς πολλοῖς ⸀ἐχαρίσατο βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/021.yaml
  text: In that hour he healed many from diseases and afflictions and evil spirits[c][b][a], and to many blind people he granted sight.
translation:
  language: te
  text: ఆ సమయంలో ఆయన అనేక మందిని రోగాల నుండీ, తీవ్రమైన పీడల నుండీ,[a] దుష్టాత్మల నుండీ స్వస్థపరిచాడు; చూపులేని అనేక మందికి చూసే శక్తిని అనుగ్రహించాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కొరడా దెబ్బల నుండీ’ లేదా ‘వ్యాధిపీడల నుండీ.’ గ్రీకు పదం అక్షరార్థంగా కొరడా దెబ్బలను, విస్తృతార్థంగా తీవ్రమైన శారీరక పీడలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘చూడడానికి అనుగ్రహించాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: ఆ సమయంలోనే
  rationale: గ్రీకు పదబంధంలోని నిర్దిష్ట కాలసూచనను, సందర్భంలోని తక్షణత్వాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐθεράπευσεν
  choice: స్వస్థపరిచాడు
  rationale: సువార్తలలో స్వస్థత కలిగించే కార్యానికి సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: πολλοὺς
  choice: అనేక మందిని
  rationale: గ్రీకులో వ్యక్తులు సూచితులై ఉన్నందున తెలుగులో కర్మను స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀπὸ νόσων
  choice: రోగాల నుండీ
  rationale: ἀπό సూచించే బాధాకర స్థితి నుండి విముక్తిని నేరుగా నిలుపుతుంది.
- source_word: μαστίγων
  choice: తీవ్రమైన బాధల నుండీ
  rationale: మూలపదానికి కొరడా దెబ్బలు అనే అక్షరార్థం ఉన్నా, ఇక్కడ తీవ్రమైన శారీరక పీడలు లేదా వ్యాధిబాధలు అనే విస్తృతార్థం సందర్భోచితం.
- source_word: πνευμάτων πονηρῶν
  choice: దుష్టాత్మల నుండీ
  rationale: πονηρός యొక్క ‘దుష్టమైన’ భావాన్ని నేరుగా కాపాడి, దీనిని కేవలం అనారోగ్యానికి రూపకంగా మార్చదు.
- source_word: τυφλοῖς πολλοῖς
  choice: చూపులేని అనేక మందికి
  rationale: దత్తివిభక్తిలోని లబ్ధిదారులను స్పష్టంగా చూపుతూ, లింగాన్ని అనవసరంగా పరిమితం చేయని సహజమైన వ్యక్తీకరణ.
- source_word: ἐχαρίσατο
  choice: అనుగ్రహించాడు
  rationale: ఉచితంగా, కృపతో ఇవ్వడం అనే χαρίζομαι భావఛాయను నిలుపుతుంది.
- source_word: βλέπειν
  choice: చూసే శక్తిని
  rationale: అక్షరార్థమైన ‘చూడడానికి’ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, చూపు పొందడాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: దుష్టాత్మల పట్ల యేసు చేసిన కార్యం యొక్క స్వభావం
  choice: దుష్టాత్మల నుండి ప్రజలను స్వస్థపరిచినట్లు వచనాన్ని అనువదించడం
  alternative: దుష్టాత్మలను కేవలం మానసిక లేదా శారీరక వ్యాధులకు రూపకంగా చూపడం
  rationale: πνευμάτων πονηρῶν అనేది దుష్టాత్మలను నేరుగా సూచిస్తుంది; అందువల్ల మూలంలోని వ్యక్తిగత-ఆత్మసంబంధ భావాన్ని తగ్గించకుండా నిలుపబడింది.
- issue: ἐχαρίσατο లోని కృపాపూర్వక దాన భావం
  choice: అనుగ్రహించాడు
  alternative: ఇచ్చాడు లేదా చూపు కలిగించాడు
  rationale: ఈ క్రియలో ఉన్న ఉచితంగా, దయతో ప్రసాదించే భావఛాయను అతిశయోక్తి లేకుండా తెలుగులో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ఆ సమయంలోనే’ తక్షణత్వాన్ని సహజంగా సూచిస్తుంది; ‘చూపులేని’ అనే రూపం లింగనిరపేక్షంగా ఉంది. సమాంతరమైన ‘నుండీ’ రూపాలు మూడు విముక్తి మూలాలను స్పష్టంగా కలుపుతాయి.
