revisions:
- from: 'యేసు ఈ మాటలు విని అతనిని చూసి ఆశ్చర్యపోయాడు. తరువాత తనను వెంబడిస్తున్న జనసమూహం వైపు తిరిగి, “నేను మీతో చెబుతున్నాను: ఇంతటి విశ్వాసం ఇశ్రాయేలులో కూడా నాకు కనిపించలేదు[a]” అన్నాడు.'
  to: 'యేసు ఈ మాటలు విని అతని గురించి ఆశ్చర్యపడ్డాడు. తనను వెంబడిస్తున్న జనసమూహం వైపు తిరిగి, “నేను మీతో చెబుతున్నాను: ఇంతటి విశ్వాసం[a] ఇశ్రాయేలులో కూడా నేను కనుగొనలేదు” అన్నాడు.'
  rationale: The revision removes the unsupported and contextually problematic implication that Jesus saw the centurion, restores the direct sense of εὗρον, and places a focused lexical footnote at the term it explains. No doctrinal interpretation has been added.
