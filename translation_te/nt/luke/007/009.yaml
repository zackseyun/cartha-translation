  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ταῦτα ὁ Ἰησοῦς ἐθαύμασεν αὐτόν, καὶ στραφεὶς τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ εἶπεν· Λέγω ὑμῖν, ⸀οὐδὲ ἐν τῷ Ἰσραὴλ τοσαύτην πίστιν εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/009.yaml
  text: When Jesus heard these things[a], he marveled at him, and turning to the crowd following him, he said, “I tell you[b], not even in Israel have I found such faith.”
translation:
  language: te
  text: 'యేసు ఈ మాటలు విని అతని గురించి ఆశ్చర్యపడ్డాడు. తనను వెంబడిస్తున్న జనసమూహం వైపు తిరిగి, “నేను మీతో చెబుతున్నాను: ఇంతటి విశ్వాసం[a] ఇశ్రాయేలులో కూడా నేను కనుగొనలేదు” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నమ్మకం”; గ్రీకు పదం తరచూ “విశ్వాసం” అని అనువదించబడుతుంది.
    reason: πίστιςకు సందర్భానుకూలమైన ప్రత్యామ్నాయ అనువాదాన్ని సూచించడానికి.
lexical_decisions:
- source_word: ἀκούσας δὲ ταῦτα
  choice: ఈ మాటలు విని
  rationale: Aorist participle ప్రధాన క్రియకు ముందున్న సందర్భాన్ని తెలియజేస్తుంది; δέ స్వల్ప కథన మార్పును సూచిస్తుంది కాబట్టి తెలుగులో ప్రత్యేక సంధాయకం లేకుండానే సహజంగా ఉంది. ταῦτα ఇక్కడ శతాధిపతి పంపినవారు చెప్పిన మాటలను సూచిస్తుంది.
- source_word: ἐθαύμασεν αὐτόν
  choice: అతనిని చూసి ఆశ్చర్యపోయాడు
  rationale: θαυμάζω ఆశ్చర్యం లేదా విస్మయాన్ని సూచిస్తుంది. αὐτόν శతాధిపతిని సూచిస్తుంది; తెలుగు వాక్యప్రయోగంలో ‘అతనిని చూసి’ అని చెప్పడం సంబంధాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: στραφεὶς
  choice: వైపు తిరిగి
  rationale: కథనంలో ఈ aorist participle‌ను సహజ తెలుగు క్రమంలో తదుపరి చర్యగా వ్యక్తం చేస్తుంది.
- source_word: τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ
  choice: తనను వెంబడిస్తున్న జనసమూహం
  rationale: Present participle కొనసాగుతున్న చర్యను సూచిస్తుంది; ‘వెంబడిస్తున్న’ అనేది శిష్యత్వార్థాన్ని బలవంతంగా చేర్చకుండా ప్రత్యక్ష అర్థాన్ని ఇస్తుంది.
- source_word: Λέγω ὑμῖν
  choice: నేను మీతో చెబుతున్నాను
  rationale: ప్రత్యక్ష సంబోధన బలాన్ని నిలుపుతూ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంది.
- source_word: οὐδὲ ἐν τῷ Ἰσραὴλ
  choice: ఇశ్రాయేలులో కూడా ... లేదు
  rationale: οὐδέ లోని ‘not even’ బలాన్ని తెలుగు ప్రతికూల నిర్మాణంలో ‘కూడా ... లేదు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοσαύτην πίστιν
  choice: ఇంతటి విశ్వాసం
  rationale: τοσαύτην పరిమాణం లేదా స్థాయి యొక్క విశేషతను తెలియజేస్తుంది. πίστις ఇక్కడ యేసు అధికారంపై శతాధిపతికి ఉన్న నమ్మకాన్ని సూచిస్తుంది; ‘విశ్వాసం’ సాధారణ బైబిలు పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: εὗρον
  choice: నాకు కనిపించలేదు
  rationale: అక్షరార్థంగా ‘నేను కనుగొనలేదు’; ఈ సందర్భంలో ఎవరిలోనూ అలాంటి విశ్వాసం తారసపడలేదనే అనుభవార్థాన్ని ‘నాకు కనిపించలేదు’ సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: πίστις యొక్క అనువాదం
  choice: విశ్వాసం
  alternative: నమ్మకం
  rationale: సందర్భం శతాధిపతికి యేసు అధికారంపై ఉన్న నమ్మకాన్ని సూచిస్తుంది. ‘విశ్వాసం’ మూలపదానికి సాధారణమైన ధార్మిక విస్తృతిని నిలుపుతుంది; ‘నమ్మకం’ కూడా సందర్భానుకూల ప్రత్యామ్నాయం.
- issue: యేసు ఆశ్చర్యపడినట్లు తెలిపే ἐθαύμασεν
  choice: ఆశ్చర్యపోయాడు
  alternative: విస్మయపడ్డాడు
  rationale: మూలపాఠం నిజమైన ఆశ్చర్యాన్ని వర్ణిస్తుంది. దాని తాత్త్విక ఉద్రిక్తతను తగ్గించకుండా లేదా యేసు జ్ఞానం గురించి అదనపు వివరణను చేర్చకుండా నేరుగా అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని వాక్యక్రమాన్ని అవసరమైనంతవరకు నిలుపుతూ సహజ తెలుగు ప్రవాహానికి స్వల్ప పునర్వ్యవస్థీకరణ చేశాం. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
