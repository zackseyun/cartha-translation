id: LUK.7.16
reference: Luke 7:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔλαβεν δὲ φόβος πάντας, καὶ ἐδόξαζον τὸν θεὸν λέγοντες ὅτι Προφήτης μέγας ⸀ἠγέρθη ἐν ἡμῖν, καὶ ὅτι Ἐπεσκέψατο ὁ θεὸς τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/016.yaml
  text: And fear seized them all[a], and they were glorifying God, saying, “A great prophet has arisen among us[c][b], and God has visited his people.”
translation:
  language: te
  text: అయితే వారందరినీ భయం ఆవరించింది. వారు దేవుణ్ణి మహిమపరుస్తూ, “మన మధ్య ఒక గొప్ప ప్రవక్త ఉద్భవించాడు; దేవుడు తన ప్రజలను సందర్శించాడు” అని ఇలా అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβεν ... φόβος πάντας
  choice: వారందరినీ భయం ఆవరించింది
  rationale: భయం వారిని అకస్మాత్తుగా పూర్తిగా పట్టుకున్నదనే గ్రీకు నుడికార బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది. ‘భక్తిపూర్వక విస్మయం’ అని అనువదిస్తే φόβος లోని భయం–విస్మయం ఉద్రిక్తత ముందుగానే పరిష్కారమవుతుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: కథన ప్రవాహంలో స్వల్ప అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది; దీనికి అధిక విరోధార్థాన్ని ఇవ్వదు.
- source_word: ἐδόξαζον τὸν θεὸν
  choice: దేవుణ్ణి మహిమపరుస్తూ
  rationale: δοξάζω యొక్క ‘మహిమపరచు’ భావాన్ని నేరుగా నిలుపుతూ, అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న చర్యను ‘-తూ’ రూపం వ్యక్తపరుస్తుంది.
- source_word: λέγοντες
  choice: అని అన్నారు
  rationale: వారు దేవుణ్ణి మహిమపరచిన మాటల విషయాన్ని సహజమైన తెలుగు ప్రత్యక్ష ఉక్తిగా పరిచయం చేస్తుంది.
- source_word: Προφήτης μέγας
  choice: ఒక గొప్ప ప్రవక్త
  rationale: μέγας యొక్క విలువనిర్ణయ బలాన్ని సరళంగా, సహజంగా అందిస్తుంది.
- source_word: ἠγέρθη
  choice: ఉద్భవించాడు
  rationale: ఒక ప్రవక్త వారి మధ్య ప్రత్యక్షమయ్యాడు లేదా లేపబడ్డాడు అనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది. గ్రీకు నిష్క్రియ రూపంలోని సంభావ్య దైవిక కర్తృత్వాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐν ἡμῖν
  choice: మన మధ్య
  rationale: సమాజం మధ్యలో అనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలుపుతుంది.
- source_word: Ἐπεσκέψατο
  choice: దర్శించాడు
  rationale: దేవుడు తన ప్రజలవైపు శ్రద్ధతో వచ్చి కార్యం చేశాడనే బైబిలు సందర్శన నుడికారాన్ని, దానిని కేవలం ‘సహాయం చేశాడు’గా కుదించకుండా నిలుపుతుంది.
- source_word: τὸν λαὸν αὐτοῦ
  choice: తన ప్రజలను
  rationale: స్వకీయతను, నిబంధన సంబంధ సూచనను సహజమైన తెలుగులో కాపాడుతుంది.
theological_decisions:
- issue: అద్భుతం తరువాత φόβος యొక్క భావం
  choice: భయం
  alternative: భక్తిపూర్వక విస్మయం
  rationale: మూలపదంలోని బలమైన స్పందనను నిలుపుతుంది. సందర్భం దానిలో భక్తిపూర్వక విస్మయం ఉందని సూచించవచ్చు గాని, ప్రధాన పాఠ్యంలో ఆ అర్థానికే పరిమితం చేయలేదు.
- issue: ప్రవక్తను గురించి ἠγέρθη యొక్క నిష్క్రియ రూపం
  choice: ఉద్భవించాడు
  alternative: లేపబడ్డాడు
  rationale: తెలుగులో సహజమైన ప్రవక్త ప్రత్యక్షత భావాన్ని ఇస్తుంది; అదే సమయంలో దేవుడు ప్రవక్తను లేపాడనే సంభావ్య సూచనను పాదసూచికలో సంరక్షిస్తుంది. ‘లేపబడ్డాడు’ ప్రధాన పాఠ్యంలో పునరుత్థాన భావాన్ని అనవసరంగా ముందుకు తేవవచ్చు.
- issue: దేవుని చర్యగా Ἐπεσκέψατο
  choice: తన ప్రజలను దర్శించాడు
  alternative: తన ప్రజలకు సహాయం చేయడానికి వచ్చాడు
  rationale: లూకా రచనలోని సందర్శన భాషకు ఉన్న రక్షణాత్మక, శ్రద్ధాపూర్వక విస్తృతిని నిలుపుతుంది; దానిని ఒక్క ‘సహాయం’ భావంగా పరిమితం చేయదు.
- issue: రెండు ὅτι ఉపవాక్యాల ఉక్తి నిర్మాణం
  choice: ఒకే ఉక్తిలో రెండు ప్రకటనలు
  alternative: రెండు వేర్వేరు ఉక్తులు
  rationale: గ్రీకులో రెండుసార్లు ὅτι రావడం రెండు ప్రకటనలను స్పష్టంగా వేరు చేస్తుంది, కాని అవి ఒకే నిరంతర ఉక్తిలో భాగాలుగా కూడా చదవవచ్చు. ప్రధాన పాఠ్యం సహజమైన ఏకీకృత ఉక్తిని వాడి, ప్రత్యామ్నాయ విరామచిహ్నాన్ని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళంగా, అయితే గంభీరతను నిలుపుతూ రూపొందించబడింది. ‘మహిమపరుస్తూ,’ ‘ప్రవక్త,’ ‘దర్శించాడు’ వంటి బైబిలు భావభారం గల పదాలను సందర్భం మరియు పాదసూచికల సహాయంతో ఉంచాం.
