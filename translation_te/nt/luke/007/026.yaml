source:
  edition: SBLGNT
  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; προφήτην; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/026.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: te
  text: అయితే మీరు దేనిని చూడడానికి బయలుదేరి వెళ్లారు? ఒక ప్రవక్తనా? అవును, నేను మీతో చెబుతున్నాను, ప్రవక్తకన్నా గొప్పవానినే[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రవక్తకన్నా గొప్పదాన్ని.” గ్రీకులోని తులనాత్మక పదం నపుంసకలింగంలో ఉంది; అయితే సందర్భంలో అది యోహానునే సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: మునుపటి అలంకారిక ప్రశ్నతో వ్యత్యాసాన్ని చూపుతూ, ఆధునిక తెలుగులో సహజమైన సంధానంగా ఉంది.
- source_word: τί
  choice: దేనిని
  rationale: ἰδεῖν అనే క్రియకు కర్మగా ఉన్న నపుంసకలింగ ప్రశ్నార్థక సర్వనామాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: ἐξήλθατε
  choice: బయలుదేరి వెళ్లారు
  rationale: గతంలో శ్రోతలు బయటికి వెళ్లిన చర్యను గౌరవబహువచనంతో సహజంగా తెలియజేస్తుంది.
- source_word: ἰδεῖν
  choice: చూడడానికి
  rationale: బయలుదేరి వెళ్లడంలోని ఉద్దేశాన్ని తెలిపే గ్రీకు అనిశ్చిత క్రియారూపాన్ని సహజమైన తెలుగు ప్రయోజనార్థక రూపంలో అందిస్తుంది.
- source_word: προφήτην
  choice: ఒక ప్రవక్తనా?
  rationale: అధ్యాహార క్రియతో కూడిన అలంకారిక ప్రశ్నను సంక్షిప్తంగా, సహజంగా ఉంచుతుంది.
- source_word: ναί
  choice: అవును
  rationale: ప్రశ్నకు నేరమైన బలమైన సమ్మతిని తెలియజేస్తుంది.
- source_word: λέγω ὑμῖν
  choice: మీతో చెబుతున్నాను
  rationale: శ్రోతలను నేరుగా ఉద్దేశించే సువార్తలలోని సాధారణ వాక్యసూత్రాన్ని సహజ తెలుగు రూపంలో నిలుపుతుంది.
- source_word: καὶ
  choice: మరియు అంతకంటే ముందుకు తీసుకెళ్లే భావం
  rationale: తెలుగు వాక్య నిర్మాణంలో ప్రత్యేకంగా ‘మరియు’ చేర్చడం కృత్రిమంగా ఉండేందున, ‘అవును ... ప్రవక్తకంటే గొప్పవాణ్ణి’ అనే క్రమంలో దాని సంయోజక-ఉద్ధాటన భావం అంతర్లీనంగా వ్యక్తమవుతుంది.
- source_word: περισσότερον προφήτου
  choice: ప్రవక్తకంటే గొప్పవాణ్ణి
  rationale: గ్రీకు తులనాత్మక పదబంధాన్ని యోహాను వ్యక్తిని సూచించే సందర్భానికి అనుగుణంగా సహజ తెలుగులో అందిస్తూ, అతని గొప్పతనం ఏ విధమైనదో వివరించి చెప్పదు.
theological_decisions:
- issue: యోహాను బాప్తిస్మమిచ్చువాని స్థానం
  choice: అతడు ప్రవక్త, అంతేకాక ప్రవక్తకంటే గొప్పవాడు అని మాత్రమే చెప్పడం
  alternative: అతడే అత్యంత గొప్ప ప్రవక్త అని లేదా అంత్యకాల దూత అని ఈ వాక్యంలోనే విస్తరించడం
  rationale: మూల వాక్యం అతని ఆధిక్య స్వభావాన్ని ఈ వచనంలో వివరించదు; అందువల్ల సంక్షిప్తతను, వేదాంతపరమైన ఉద్వేగాన్ని అలాగే ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవబహువచనం, సహజమైన అలంకారిక ప్రశ్నలు, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన శైలి. తెలుగు అనువాదంలో ప్రత్యేకంగా వివరణ అవసరం లేనందున పాదసూచిక చేర్చలేదు.
