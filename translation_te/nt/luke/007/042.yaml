id: LUK.7.42
reference: Luke 7:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ ⸀ἐχόντων αὐτῶν ἀποδοῦναι ἀμφοτέροις ἐχαρίσατο. τίς οὖν ⸀αὐτῶν πλεῖον ⸂ἀγαπήσει αὐτόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/042.yaml
  text: Since they did not have the means to repay[a], he graciously forgave both. So which of them will love him more?
translation:
  language: te
  text: తిరిగి చెల్లించడానికి వారి దగ్గర ఏమీ లేకపోవడంతో, అతడు ఇద్దరి అప్పులనూ దయతో మాఫీ చేశాడు.[a] కాబట్టి వారిలో ఎవరు అతణ్ణి ఎక్కువగా ప్రేమిస్తారు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు ఇద్దరినీ దయతో క్షమించాడు.” గ్రీకు క్రియ ఉచితంగా అనుగ్రహించడం, క్షమించడం, లేదా చెల్లించవలసిన బాకీని మాఫీ చేయడం అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἐχόντων αὐτῶν ἀποδοῦναι
  choice: తిరిగి చెల్లించడానికి వారి దగ్గర ఏమీ లేకపోవడంతో
  rationale: జనిటివ్ అబ్సల్యూట్ నిర్మాణం అప్పు తీర్చలేని పరిస్థితిని తెలియజేస్తుంది. అప్పు సందర్భంలో ἀποδοῦναι కి ‘తిరిగి చెల్లించడం’ సహజమైన అర్థం; ‘ఏమీ లేకపోవడంతో’ వారి చెల్లింపు అసమర్థతను సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀμφοτέροις ἐχαρίσατο
  choice: అతడు ఇద్దరి అప్పులనూ దయతో మాఫీ చేశాడు
  rationale: χαρίζομαι ఉచితంగా అనుగ్రహించడం లేదా బాకీని మన్నించడం అనే భావాలను కలిగి ఉంది. అప్పుల ఉపమానంలో ‘అప్పులను మాఫీ చేశాడు’ ఆర్థిక సందర్భాన్ని స్పష్టంగా ఉంచగా, ‘దయతో’ క్రియలోని అనుగ్రహ భావాన్ని ప్రతిబింబిస్తుంది.
- source_word: τίς οὖν αὐτῶν
  choice: కాబట్టి వారిలో ఎవరు
  rationale: οὖν ముందున్న పరిస్థితి నుంచి వచ్చే నిర్ధారణను సూచిస్తుంది; ‘కాబట్టి’ ఆ తార్కిక సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: πλεῖον ἀγαπήσει αὐτόν
  choice: అతణ్ణి ఎక్కువగా ప్రేమిస్తారు
  rationale: πλεῖον తులనాత్మకంగా ‘ఎక్కువగా’ అని, ἀγαπήσει నేరుగా ‘ప్రేమిస్తారు’ అని అనువదించబడ్డాయి. ప్రశ్నలోని అనిశ్చితిని అలాగే ఉంచుతుంది.
theological_decisions:
- issue: అప్పు సందర్భంలో χαρίζομαι అనువాదం
  choice: అతడు ఇద్దరి అప్పులనూ దయతో మాఫీ చేశాడు
  alternative: అతడు ఇద్దరినీ దయతో క్షమించాడు
  rationale: తక్షణ సందర్భం ఇద్దరు రుణగ్రస్తుల అప్పుల గురించి కాబట్టి ‘అప్పులను మాఫీ చేశాడు’ స్పష్టమైన సందర్భార్థాన్ని ఇస్తుంది. ‘దయతో’ అనే పదం χαρίζομαι లోని ఉచిత అనుగ్రహ భావాన్ని నిలుపుతుంది; అయితే ఉపమానం సూచించే ఆధ్యాత్మిక అన్వయాన్ని వచనంలో అదనంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘తిరిగి చెల్లించడం,’ ‘అప్పులను మాఫీ చేయడం’ సాధారణ పాఠకులకు స్పష్టమైన ఆర్థిక పదబంధాలు. గ్రీకు క్రియలోని క్షమాపణ–అప్పు మాఫీ విస్తృతిని పాదటిప్పణిలో నిలుపుకున్నాం.
