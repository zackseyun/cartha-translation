  naturalness: The Telugu is fluent, clear, and suitably modern in register. “తిరిగి చెల్లించడానికి వారి దగ్గర ఏమీ లేకపోవడంతో” and “ఎక్కువగా ప్రేమిస్తారు” are natural and readily understood.
  terminology: “అప్పులనూ ... మాఫీ చేశాడు” is contextually precise for χαρίζομαι in this debt parable, while “దయతో” reasonably represents its freely/graciously granted nuance. The footnote responsibly preserves the broader forgiveness/remission range without imposing a theological interpretation.
