id: LUK.7.1
reference: Luke 7:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Ἐπειδὴ ἐπλήρωσεν πάντα τὰ ῥήματα αὐτοῦ εἰς τὰς ἀκοὰς τοῦ λαοῦ, εἰσῆλθεν εἰς Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/001.yaml
  text: When he had finished all his words in the hearing of the people[a], he entered Capernaum.
translation:
  language: te
  text: ఆయన తన మాటలన్నిటినీ ప్రజలు వింటుండగా చెప్పడం ముగించిన తరువాత, కపెర్నహూములోకి ప్రవేశించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπειδὴ
  choice: తరువాత
  rationale: ఇక్కడ ఇది కారణాన్ని కాకుండా, ప్రధాన క్రియకు ముందుగా పూర్తయిన చర్యను సూచించే కాలసంబంధ ఉపవాక్యాన్ని ప్రవేశపెడుతుంది.
- source_word: ἐπλήρωσεν
  choice: చెప్పడం ముగించిన
  rationale: ῥήματα తో వచ్చిన ఈ సందర్భంలో ‘నింపాడు/నెరవేర్చాడు’ కంటే మాటలను చెప్పి పూర్తిచేశాడనే భావమే సహజం.
- source_word: πάντα τὰ ῥήματα αὐτοῦ
  choice: తన మాటలన్నిటినీ
  rationale: గ్రీకు పదబంధంలోని ‘అతని మాటలన్నీ’ అనే భావాన్ని సహజమైన తెలుగులో సన్నిహితంగా నిలుపుతుంది.
- source_word: εἰς τὰς ἀκοὰς τοῦ λαοῦ
  choice: ప్రజలు వింటుండగా
  rationale: అక్షరార్థమైన ‘ప్రజల చెవులలోకి’ అనే ప్రయోగం లక్ష్యభాషలో అసహజం; బోధ ప్రజలకు వినిపించేలా బహిరంగంగా చెప్పబడిందనే భావాన్ని ఇది సహజంగా తెలియజేస్తుంది.
- source_word: λαοῦ
  choice: ప్రజలు
  rationale: సమూహాన్ని సూచించే λαός కు సాధారణమైన, అతిగా నిర్దిష్టం కాని తెలుగు సమానార్థకం.
- source_word: εἰσῆλθεν
  choice: ప్రవేశించాడు
  rationale: పట్టణంలోకి వెళ్లడాన్ని సంక్షిప్తంగా, గౌరవప్రదమైన కథన శైలిలో తెలియజేస్తుంది.
- source_word: Καφαρναούμ
  choice: కపెర్నహూము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన, గ్రీకు స్థలనామానికి గుర్తుపట్టదగిన లిప్యంతరీకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. గ్రీకులోని కాలక్రమాన్ని ‘ముగించిన తరువాత’ ద్వారా స్పష్టంగా ఉంచి, εἰς τὰς ἀκοὰς అనే ఇడియమ్‌ను అక్షరానువాదం చేయకుండా దాని శ్రవణసాక్ష్య భావాన్ని నిలిపాం.
