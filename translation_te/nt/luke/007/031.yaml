id: LUK.7.31
reference: Luke 7:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τίνι οὖν ὁμοιώσω τοὺς ἀνθρώπους τῆς γενεᾶς ταύτης, καὶ τίνι εἰσὶν ὅμοιοι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/031.yaml
  text: To what, then, shall I compare the men of this generation, and what are they like?
translation:
  language: te
  text: “అయితే, ఈ తరంలోని మనుషులను నేను దేనితో పోల్చాలి? వారు దేనితో పోలి ఉన్నారు?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίνι ... ὁμοιώσω
  choice: దేనితో పోల్చాలి?
  rationale: గ్రీకు ప్రశ్నలోని పోలిక భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది. మొదటి పురుష ఏకవచనాన్ని తెలుగులో సందర్భానుగుణంగా వ్యక్తపరచగల ‘పోల్చాలి’ ద్వారా సంక్షిప్తంగా ఉంచింది.
- source_word: τοὺς ἀνθρώπους τῆς γενεᾶς ταύτης
  choice: ఈ తరం మనుషులను
  rationale: ἀνθρώπους ఇక్కడ సమూహంలోని మానవులను సూచిస్తుంది; లింగపరంగా కేవలం పురుషులకే పరిమితం చేయకుండా ‘మనుషులను’ అని అనువదించడం మూలార్థానికి తగినది. γενεᾶς ను ‘తరం’గా అందించింది.
- source_word: καὶ τίνι εἰσὶν ὅμοιοι
  choice: వారు దేనిలా ఉన్నారు?
  rationale: రెండవ సమాంతర ప్రశ్నను మూలంలోని పునరుక్తి, వాక్చాతుర్యాన్ని నిలుపుతూ సహజంగా అనువదించింది.
- source_word: οὖν
  choice: అయితే
  rationale: ముందటి సందర్భం నుంచి తీసుకునే నిర్ధారణాత్మక లేదా సంధాన భావాన్ని తెలుగులో స్పష్టంగా సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే యేసు వాక్యానికి తగిన గంభీరతతో ప్రశ్నల సమాంతర నిర్మాణం నిలుపబడింది.
