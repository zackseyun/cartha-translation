id: LUK.7.8
reference: Luke 7:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν τασσόμενος, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/008.yaml
  text: For I too am a man placed under authority[a], with soldiers under me; and I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: te
  text: ఎందుకంటే నేను కూడా అధికారానికి లోబడి నియమించబడిన మనిషినే; నా కింద సైనికులు ఉన్నారు. నేను ఇతనితో, ‘వెళ్లు’ అని చెబితే, అతడు వెళ్తాడు; మరొకనితో, ‘రా’ అని చెబితే, అతడు వస్తాడు; నా దాసునితో[a], ‘ఇది చెయ్యి’ అని చెబితే, అతడు చేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సేవకునితో.” గ్రీకు పదం దాసత్వంలో లేదా యజమాని ఆధీనంలో ఉన్న వ్యక్తిని సూచిస్తుంది; కొన్ని సందర్భాల్లో దీనిని సాధారణంగా “సేవకుడు” అని కూడా అనువదించవచ్చు.
    reason: δοῦλος అనే పదంలోని సామాజిక స్థితిని ప్రధాన పాఠంలో కాపాడుతూ, సందర్భపరంగా సాధ్యమైన విస్తృత ప్రత్యామ్నాయాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ఎందుకంటే
  rationale: శతాధిపతి తన మాటకు కారణాన్ని వివరిస్తున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; καίను విడిగా అనువదించకపోయినా సందర్భంలోని అనుసంధానం నిలుస్తుంది.
- source_word: ἐγὼ ἄνθρωπός εἰμι
  choice: నేను కూడా ... మనిషినే
  rationale: ἐγώలోని ఉద్ఘాటనను ‘నేను’, καίలోని పోలికను ‘కూడా’, వాక్యంలోని వ్యక్తిగత పురుష సూచనను ‘మనిషినే’ సహజంగా వ్యక్తం చేస్తాయి.
- source_word: ὑπὸ ἐξουσίαν τασσόμενος
  choice: అధికారానికి లోబడి నియమించబడిన
  rationale: τασσόμενοςలోని నియామక/క్రమంలో ఉంచబడిన నిష్క్రియ భావాన్నీ, ὑπὸ ἐξουσίανలోని పై అధికారానికి లోబడిన స్థితినీ కాపాడుతుంది.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: నా కింద సైనికులు ఉన్నారు
  rationale: సైనిక అధికార క్రమాన్ని ‘నా కింద’ అనే సహజమైన తెలుగుతో నేరుగా తెలియజేస్తుంది.
- source_word: λέγω τούτῳ
  choice: నేను ఒకనితో ... అంటే
  rationale: తెలుగు సంభాషణలో ఆజ్ఞ-ఫలిత నమూనాను సహజంగా నిర్మిస్తుంది. τούτῳ యొక్క నిర్దేశక భావం సందర్భంలో ‘ఒకనితో’ ద్వారా సరిపడా వ్యక్తమవుతుంది.
- source_word: Πορεύθητι / πορεύεται
  choice: ‘వెళ్లు’ / వాడు వెళ్తాడు
  rationale: ఆజ్ఞకు వెంటనే కలిగే ప్రతిస్పందనను సరళంగా, సమాంతర నిర్మాణంతో చూపుతుంది.
- source_word: Ἔρχου / ἔρχεται
  choice: ‘రా’ / వాడు వస్తాడు
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్త ఆజ్ఞను, దానికి అనుగుణమైన చర్యను సహజ తెలుగులో కాపాడుతుంది.
- source_word: τῷ δούλῳ μου
  choice: నా దాసునితో
  rationale: δοῦλος సూచించే యజమానికి చెందిన, ఆధీన స్థితిని ‘దాసుడు’ స్పష్టంగా నిలుపుతుంది; సందర్భానుసారంగా ‘సేవకుడు’ అనే విస్తృత అర్థం సాధ్యమని పాదసూచికలో ఉంచబడింది.
- source_word: Ποίησον τοῦτο, καὶ ποιεῖ
  choice: ‘ఇది చెయ్యి’ అంటే వాడు చేస్తాడు
  rationale: మూలంలోని ఆజ్ఞ-అమలు సమాంతరతను సాధారణ ఆధునిక తెలుగు రూపంలో నిలుపుతుంది.
theological_decisions:
- issue: శతాధిపతి ఉదాహరణలో δοῦλος అనువాదం
  choice: దాసుడు
  alternative: సేవకుడు
  rationale: ఈ ఉపమానంలో అధికారానికి పూర్తిగా లోబడిన స్థితి ప్రధానమైనందున ‘దాసుడు’ మూలపదంలోని సామాజిక ఆధీనతను మరింత స్పష్టంగా కాపాడుతుంది. అయితే కొన్ని సందర్భాల్లో ఈ పదం ఇంటి సేవకుని సూచించగలదనే అర్థసాధ్యతను పాదసూచికలో నిలిపాం.
- issue: ὑπὸ ἐξουσίαν τασσόμενοςలోని అధికార సంబంధం
  choice: అధికారానికి లోబడి నియమించబడిన
  alternative: అధికారం కింద ఉన్న
  rationale: శతాధిపతి తనకు పై అధికారం ఉందనీ, తన కింద సైనికులు ఉన్నారనీ చెప్పే ద్విముఖ అధికార నిర్మాణాన్ని మూలంలోని నిష్క్రియ భావంతో సహా కాపాడుతుంది; దీనిని యేసు అధికార స్వభావంపై అదనపు సిద్ధాంత వివరణగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే మాటతీరు. ఆజ్ఞలలో ‘వెళ్లు, రా, చెయ్యి’ అనే సహజ ఏకవచన రూపాలు సైనిక/గృహ అధికార సంబంధాన్ని చూపుతాయి. ‘వాడు’ పునరుక్తి ఆజ్ఞ-ప్రతిస్పందన సమాంతరతను స్పష్టంగా ఉంచుతుంది.
