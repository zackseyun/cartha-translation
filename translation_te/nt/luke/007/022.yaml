revisions:
- from: 'అప్పుడు ఆయన వారికి ఇలా జవాబిచ్చాడు: “మీరు వెళ్లి చూసినవాటినీ విన్నవాటినీ యోహానుకు తెలియజేయండి: చూపులేనివారు చూపు పొందుతున్నారు[a], కుంటివారు నడుస్తున్నారు, కుష్ఠరోగులు శుద్ధులవుతున్నారు, చెవిటివారు వింటున్నారు, చనిపోయినవారు లేపబడుతున్నారు, పేదలకు శుభవార్త ప్రకటించబడుతోంది[b].”'
  to: 'ఆయన వారికి జవాబుగా ఇలా అన్నాడు: “మీరు వెళ్లి చూసినవాటినీ విన్నవాటినీ యోహానుకు తెలియజేయండి: చూపులేనివారు చూపు పొందుతున్నారు[a], కుంటివారు నడుస్తున్నారు, కుష్ఠరోగులు శుద్ధి చేయబడుతున్నారు, చెవిటివారు వింటున్నారు, మృతులు లేపబడుతున్నారు, పేదలకు శుభవార్త ప్రకటించబడుతోంది[b].”'
