id: LUK.7.22
reference: Luke 7:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ εἴδετε καὶ ἠκούσατε· ⸀τυφλοὶ ἀναβλέπουσιν, χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται, ⸀κωφοὶ ἀκούουσιν, νεκροὶ ἐγείρονται, πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/022.yaml
  text: 'And answering[a], he said to them, “Go and report to John what you have seen and heard: the blind receive sight, the lame walk, lepers are cleansed, the deaf hear, the dead are raised[b], the poor have good news proclaimed to them.”'
translation:
  language: te
  text: 'ఆయన వారికి జవాబుగా ఇలా అన్నాడు: “మీరు వెళ్లి చూసినవాటినీ విన్నవాటినీ యోహానుకు తెలియజేయండి: చూపులేనివారు చూపు పొందుతున్నారు[a], కుంటివారు నడుస్తున్నారు, కుష్ఠరోగులు శుద్ధి చేయబడుతున్నారు, చెవిటివారు వింటున్నారు, మృతులు లేపబడుతున్నారు, పేదలకు శుభవార్త ప్రకటించబడుతోంది[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చూపు తిరిగి పొందుతున్నారు.” గ్రీకు క్రియ సందర్భాన్ని బట్టి చూపు పొందడం లేదా తిరిగి పొందడం అనే అర్థాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: 'లేదా, “పేదలకు సువార్త బోధించబడుతోంది.” గ్రీకులో ఇది కర్మణి రూపం: పేదలకు శుభవార్త ప్రకటించబడుతోంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: జవాబిచ్చాడు
  rationale: ఈ కృదంతం యేసు వారి ప్రశ్నకు స్పందించినట్లు తెలియజేస్తుంది. తెలుగులో ‘ఇలా జవాబిచ్చాడు’ సహజంగా ఉండి స్పందన భావాన్ని నిలుపుతుంది.
- source_word: Πορευθέντες
  choice: మీరు వెళ్లి
  rationale: ప్రధాన ఆజ్ఞతో కలిసి పనిచేసే ఈ కృదంతాన్ని తెలుగులో సహజమైన అనుక్రమ క్రియగా అనువదించాం.
- source_word: ἀπαγγείλατε
  choice: తెలియజేయండి
  rationale: వారు గమనించిన విషయాలను యోహానుకు తిరిగి నివేదించాలనే భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἃ εἴδετε καὶ ἠκούσατε
  choice: చూసినవాటినీ విన్నవాటినీ
  rationale: సాక్షులు స్వయంగా చూసి విన్న విషయాలనే తెలియజేయాలన్న మూలపాఠ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: చూపులేనివారు చూపు పొందుతున్నారు
  rationale: ἀναβλέπω ఇక్కడ చూపు పొందడం లేదా తిరిగి పొందడం అనే భావాన్ని ఇవ్వగలదు. ప్రధాన పాఠం రెండింటికీ సరిపడే విస్తృత రూపాన్ని ఉపయోగిస్తుంది.
- source_word: χωλοὶ περιπατοῦσιν
  choice: కుంటివారు నడుస్తున్నారు
  rationale: విశేషణ-కర్త మరియు క్రియను సూటిగా, సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: λεπροὶ καθαρίζονται
  choice: కుష్ఠరోగులు శుద్ధులవుతున్నారు
  rationale: καθαρίζονται వైద్య స్వస్థతకే పరిమితం కాకుండా శుద్ధి మరియు సమాజ-ఆరాధనా పునరుద్ధరణ భావాన్నీ కలిగి ఉంది; ‘శుద్ధులవుతున్నారు’ ఆ విస్తృతిని నిలుపుతుంది.
- source_word: κωφοὶ ἀκούουσιν
  choice: చెవిటివారు వింటున్నారు
  rationale: κωφός సందర్భానుసారం చెవిటి లేదా మూగ అనే అర్థం ఇవ్వగలిగినా, ἀκούουσινతో ఇక్కడ వినలేనివారు వినడం స్పష్టంగా ఉద్దేశించబడింది.
- source_word: νεκροὶ ἐγείρονται
  choice: చనిపోయినవారు లేపబడుతున్నారు
  rationale: గ్రీకు కర్మణి రూపాన్ని నిలిపి, కార్యసాధకుడు ఎవరో అనువాదంలో అదనంగా నిర్దేశించలేదు.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: పేదలకు శుభవార్త ప్రకటించబడుతోంది
  rationale: కర్మణి భావాన్నీ, శుభవార్త వారికి ప్రకటించబడుతుందనే దిశనూ సహజ తెలుగులో నిలుపుతుంది; మతపరమైన సాంకేతిక పదజాలాన్ని తప్పిస్తుంది.
theological_decisions:
- issue: అద్భుతాల జాబితా యేసు గుర్తింపు మరియు సేవకు సాక్ష్యంగా ఉండటం
  choice: పునరుద్ధరణ కార్యాలను ప్రత్యక్షంగా గమనించగల వాస్తవాలుగా అనువదించి, ప్రధాన పాఠంలో ‘మెస్సీయ’ అనే వివరణను జోడించలేదు.
  alternative: యెషయా ప్రవచనాల నెరవేర్పును బహిరంగంగా పేర్కొనే విధంగా అనువదించడం.
  rationale: ఈ వచనం యోహానుకు తెలియజేయవలసిన కార్యాలనే ఇస్తుంది. ప్రవచన ప్రతిధ్వనులను పదప్రయోగం ద్వారా నిలిపినా, వచనంలో లేని వ్యాఖ్యానాన్ని చేర్చలేదు.
- issue: జాబితాలోని కర్మణి క్రియల కార్యసాధకుడు
  choice: ‘శుద్ధులవుతున్నారు,’ ‘లేపబడుతున్నారు,’ ‘ప్రకటించబడుతోంది’ వంటి కర్మణి రూపాలను ఉపయోగించాం.
  alternative: ‘దేవుడు లేపుతున్నాడు’ లేదా ‘నేను ప్రకటిస్తున్నాను’ వంటి క్రియాశీల రూపాలతో కార్యసాధకుణ్ణి స్పష్టపరచడం.
  rationale: మూల గ్రీకు కర్మణి రూపాలను ఉపయోగిస్తుంది. కార్యసాధకుణ్ణి అనువాదంలో చేర్చడం మూలంలో లేని వ్యాఖ్యానాన్ని జోడిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని వరుస జాబితా, వర్తమాన కాల భావం, కర్మణి నిర్మాణాలు సాధ్యమైనంతవరకు నిలుపబడ్డాయి. ‘కుష్ఠరోగులు’ అనే సందర్భానుకూల పదాన్ని ఉపయోగించినప్పటికీ అవమానార్థం రాకుండా వ్యక్తులను సూచించే బహువచన నిర్మాణంలో ఉంచాం.
