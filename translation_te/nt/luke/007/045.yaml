id: LUK.7.45
reference: Luke 7:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: φίλημά μοι οὐκ ἔδωκας· αὕτη δὲ ἀφ’ ἧς εἰσῆλθον οὐ διέλιπεν καταφιλοῦσά μου τοὺς πόδας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/045.yaml
  text: You gave me no kiss[a], but from the time I came in[b], she has not stopped kissing my feet.
translation:
  language: te
  text: నువ్వు నన్ను ముద్దుపెట్టలేదు[a]. కానీ నేను లోపలికి వచ్చినప్పటి నుండి ఈమె నా పాదాలను ముద్దుపెట్టడం మానలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పలకరింపుగా ముద్దు’; ముద్దుతో పలకరించడం ఆ కాలంలో సాధారణ ఆతిథ్య మర్యాద.
    reason: cultural_note
  - marker: b
    text: 'ఈ క్రియ ఆప్యాయంగా లేదా పదేపదే ముద్దుపెట్టడాన్ని సూచించవచ్చు: ‘నా పాదాలను ముద్దులతో ముంచెత్తడం మానలేదు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλημά
  choice: ముద్దు
  rationale: φίλημα ఇక్కడ ఆతిథ్య సందర్భంలోని పలకరింపు ముద్దును సూచిస్తుంది. మూలంలో ఉన్న సరళమైన చర్యను ప్రధాన పాఠ్యంలో అలాగే ఉంచి, ఆచార సంబంధమైన భావాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: μοι
  choice: నాకు
  rationale: దత్తి విభక్తి పరోక్ష కర్మను సూచిస్తుంది; తెలుగులో ‘నాకు ముద్దు ఇవ్వలేదు’ సహజంగా ఉంటుంది.
- source_word: ἔδωκας
  choice: ఇవ్వలేదు
  rationale: δίδωμι యొక్క ప్రాథమిక భావమైన ‘ఇవ్వడం’ను కాపాడుతూ, గ్రీకు నిషేధంతో కలిపి సహజమైన తెలుగు రూపం వాడాం.
- source_word: αὕτη δὲ
  choice: కానీ ... ఈమె
  rationale: యేసుకు ఆతిథ్య ముద్దు ఇవ్వని సంబోధితునికీ, ఆయన పాదాలను ముద్దుపెట్టిన స్త్రీకీ మధ్యనున్న స్పష్టమైన వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἀφ’ ἧς
  choice: వచ్చినప్పటి నుండి
  rationale: ఈ పదబంధం ప్రారంభ సమయాన్ని సూచిస్తుంది; ‘అప్పటి నుండి’ ఆ కాలార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: εἰσῆλθον
  choice: నేను లోపలికి వచ్చిన
  rationale: εἰσέρχομαι అంటే లోనికి ప్రవేశించడం. ఈ ఆతిథ్య సందర్భంలో ‘లోపలికి వచ్చిన’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: οὐ διέλιπεν
  choice: మానలేదు
  rationale: διαλείπω అంటే ఆపడం లేదా మానడం. గతంలో మొదలై మాట చెప్పే సమయం వరకు కొనసాగిన చర్యను తెలుగులో ‘మానలేదు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καταφιλοῦσά
  choice: ముద్దుపెట్టడం
  rationale: καταφιλέω ఆప్యాయంగా లేదా పదేపదే ముద్దుపెట్టడాన్ని సూచించవచ్చు. ప్రధాన పాఠ్యంలో సహజమైన పదాన్ని వాడి, దాని బలమైన పునరావృత భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: μου τοὺς πόδας
  choice: నా పాదాలను
  rationale: గ్రీకులోని బహువచనాన్ని నిలుపుతూ, గౌరవప్రదమైన ఆధునిక తెలుగు పదప్రయోగాన్ని ఎంచుకున్నాం.
theological_decisions:
- issue: పలకరింపు ముద్దులో అంతర్లీనమైన ఆతిథ్య ఆచారం
  choice: ప్రధాన పాఠ్యంలో చర్యను మాత్రమే సరళంగా అనువదించి, ఆచార వివరణను పాదటిప్పణిలో ఇవ్వడం.
  alternative: ‘ఆతిథ్య పలకరింపుగా ముద్దు ఇవ్వలేదు’ అని ప్రధాన పాఠ్యంలో విస్తరించడం.
  rationale: వాక్యం ఆతిథ్యమిచ్చిన వ్యక్తి చేయని పనిని, స్త్రీ చూపిన భక్తిపూర్వక చర్యతో వ్యత్యాసపరుస్తుంది. అయితే గ్రీకు పాఠ్యం ఆ ఆచారాన్ని వివరించదు; కాబట్టి వివరణను ప్రధాన అనువాదంలో చేర్చకుండా పాదటిప్పణిలో ఉంచడం మూలానికి నిబద్ధంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. సందర్భంలోని ప్రత్యక్ష సంబోధనకు ‘నువ్వు’ను, స్త్రీని సూచించడానికి స్పష్టమైన ‘ఈమె’ను ఎంచుకున్నాం. ‘పాదాలు’ బైబిలు వచనానికి తగిన గౌరవభరితమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదం.
