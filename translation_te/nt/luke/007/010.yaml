id: LUK.7.10
reference: Luke 7:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὑποστρέψαντες ⸂εἰς τὸν οἶκον οἱ πεμφθέντες⸃ εὗρον ⸀τὸν δοῦλον ὑγιαίνοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/010.yaml
  text: And when those who had been sent returned to the house[a], they found the servant healthy.
translation:
  language: te
  text: పంపబడినవారు ఇంటికి తిరిగి వచ్చినప్పుడు, ఆ బానిస ఆరోగ్యంగా ఉన్నాడని కనుగొన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: తిరిగి వచ్చినప్పుడు
  rationale: Aorist participle ప్రధాన క్రియకు ముందున్న కాలసంబంధ చర్యను సూచిస్తుంది; ‘తిరిగి వచ్చినప్పుడు’ తెలుగులో ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἰς τὸν οἶκον
  choice: ఇంటికి
  rationale: εἰς + accusative గమ్యస్థానంవైపు కదలికను సూచిస్తుంది. ‘ఇంటికి’ స్థలాన్ని సహజంగా, అదనపు వ్యాఖ్యానం లేకుండా వ్యక్తం చేస్తుంది.
- source_word: οἱ πεμφθέντες
  choice: పంపబడినవారు
  rationale: Articular aorist passive participle లోని కర్మణి భావాన్ని నిలుపుతుంది; ‘దూతలు’ వంటి మూలంలో లేని నామవాచకాన్ని చేర్చదు.
- source_word: εὗρον
  choice: చూశారు
  rationale: ఈ దృశ్య సందర్భంలో εὑρίσκω అంటే తిరిగి వచ్చి ఒక స్థితిలో ఉన్నవానిని కనుగొనడం. ‘చూశారు’ తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: τὸν δοῦλον
  choice: ఆ బానిస
  rationale: δοῦλος ఇక్కడ శతాధిపతి అధీనంలో ఉన్న వ్యక్తి సామాజిక స్థితిని సూచిస్తుంది. ‘బానిస’ ఆ బంధిత స్థితిని స్పష్టంగా నిలుపుతుంది; సంప్రదాయ ప్రత్యామ్నాయం ‘సేవకుడు’ను పాదసూచికలో ఉంచాం.
- source_word: ὑγιαίνοντα
  choice: ఆరోగ్యంగా ఉండడం
  rationale: ὑγιαίνω యొక్క present participle ఆరోగ్యంగా ఉన్న స్థితిని తెలియజేస్తుంది. ఇది సందర్భం సూచించే స్వస్థతను ‘స్వస్థపరచబడ్డాడు’ అని మరింత బలంగా వ్యాఖ్యానించకుండా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: స్వస్థత కథనంలో δοῦλος అనువాదం
  choice: బానిస
  alternative: సేవకుడు
  rationale: ఈ సందర్భంలో పదం కేవలం వేతన సేవకునికంటే అధీన/బంధిత సామాజిక స్థితిని సూచిస్తుంది. అందువల్ల ప్రధాన పాఠ్యంలో ‘బానిస’ను ఉంచి, తెలుగు బైబిలు వాడుకలో పరిచితమైన ‘సేవకుడు’ను ప్రత్యామ్నాయంగా పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలి వాడబడింది. మూలంలోని కర్మణి భావం, చర్యల క్రమం, δοῦλος పదంలోని సామాజిక తీవ్రత, ὑγιαίνω సూచించే ఆరోగ్యస్థితి నిలుపబడ్డాయి.
