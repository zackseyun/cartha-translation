id: LUK.7.25
reference: Luke 7:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον; ἰδοὺ οἱ ἐν ἱματισμῷ ἐνδόξῳ καὶ τρυφῇ ὑπάρχοντες ἐν τοῖς βασιλείοις εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/025.yaml
  text: But what did you go out to see? A man dressed in soft clothing? Look[b][a], those who are in splendid clothing and luxury are in royal palaces.
translation:
  language: te
  text: అయితే మీరు ఏమి చూడటానికి బయలుదేరి వెళ్లారు? మెత్తని వస్త్రాలు ధరించిన మనిషినా?[a] ఇదిగో, వైభవమైన వస్త్రాలు ధరించి విలాసంగా జీవించేవారు రాజభవనాల్లో ఉంటారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మెత్తని వస్త్రాలు” అంటే విలాసానికి సంబంధించిన సున్నితమైన, నాణ్యమైన వస్త్రాలు; నైతిక బలహీనత అని కాదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “రాజుల ఆస్థానాల్లో.” గ్రీకు పదం రాజనివాసాలను లేదా రాజాస్థాన పరిసరాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: ముందున్న అలంకారిక ప్రశ్నను కొనసాగిస్తూ వ్యత్యాసాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన అనుసంధానం.
- source_word: ἐξήλθατε ἰδεῖν
  choice: ఏమి చూడటానికి బయలుదేరి వెళ్లారు
  rationale: ἰδεῖν అనే ప్రయోజనార్థక క్రియారూపాన్ని, ἐξήλθατε అనే గత చర్యను స్పష్టంగా మరియు సహజంగా తెలియజేస్తుంది.
- source_word: ἄνθρωπον
  choice: మనిషినా
  rationale: సందర్భంలో యోహానును ఉద్దేశించిన ఏకవచన పురుష వ్యక్తిని సూచిస్తుంది.
- source_word: ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον
  choice: మెత్తని వస్త్రాలు ధరించిన
  rationale: μαλακοῖς యొక్క స్పర్శసంబంధమైన అర్థాన్ని నిలుపుతూ, నైతిక బలహీనత అనే భావాన్ని చేర్చకుండా విలాసవంతమైన సున్నిత వస్త్రాల చిత్రాన్ని అందిస్తుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: తరువాతి వివరణపై శ్రద్ధను ఆకర్షించే గ్రీకు సూచనార్థక అవ్యయానికి గౌరవప్రదమైన, సుపరిచితమైన తెలుగు రూపం.
- source_word: ἐν ἱματισμῷ ἐνδόξῳ
  choice: వైభవమైన వస్త్రాలు ధరించి
  rationale: ἐνδόξῳ ఇక్కడ వస్త్రాల శోభ, ఘనత, సామాజిక వైభవాన్ని సూచిస్తుంది; 'వైభవమైన' ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τρυφῇ ὑπάρχοντες
  choice: విలాసంగా జీవించేవారు
  rationale: τρυφή కేవలం ఒక వస్తువును కాక విలాసవంతమైన జీవనస్థితిని సూచిస్తుంది; క్రియాత్మక తెలుగు రూపం వాక్యాన్ని సహజంగా చేస్తుంది.
- source_word: ἐν τοῖς βασιλείοις
  choice: రాజభవనాల్లో
  rationale: బహువచనంలోని రాజనివాసాలు లేదా రాజాస్థాన పరిసరాలను సంక్షిప్తంగా సూచిస్తుంది.
theological_decisions:
- issue: ఈ సందర్భంలో μαλακοῖς యొక్క భావం
  choice: మెత్తని లేదా సున్నితమైన విలాసవస్త్రాలకు సూచన
  alternative: నైతిక బలహీనతను లేదా ఆడంబరమైన పురుషత్వలేమిని సూచించడం
  rationale: అరణ్యంలోని యోహాను జీవనశైలికి రాజభవనాల విలాసాన్ని ఎదురుగా ఉంచడమే తక్షణ సందర్భం; అందువల్ల వ్యక్తిత్వంపై నైతిక తీర్పును అనువాదంలో చేర్చలేదు.
- issue: βασιλείοις సూచించే సామాజిక ప్రదేశం
  choice: రాజభవనాలు
  alternative: రాజుల ఆస్థానాలు
  rationale: మూలపదం రాజనివాసాలను లేదా రాజాస్థాన వాతావరణాన్ని సూచించగలదు; ప్రధాన పాఠంలో సహజమైన 'రాజభవనాలు' ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. వరుస అలంకారిక ప్రశ్నల ధోరణి నిలుపబడింది. 'ఇదిగో' మూలంలోని ἰδοὺ దృష్ట్యాకర్షణను పరిరక్షిస్తుంది; విలాసం-అరణ్యం మధ్య సామాజిక వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతూ అదనపు నైతిక తీర్పును చేర్చలేదు.
