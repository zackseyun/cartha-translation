id: LUK.7.28
reference: Luke 7:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν, μείζων ἐν γεννητοῖς γυναικῶν ⸀Ἰωάννου οὐδείς ἐστιν· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τοῦ θεοῦ μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/028.yaml
  text: I tell you[a], among those born of women no one is greater than John[c][b]; yet the least in the kingdom of God is greater than he is.
translation:
  language: te
  text: '“నేను మీతో చెబుతున్నాను: స్త్రీలకు పుట్టినవారిలో యోహాను కంటే గొప్పవాడు ఎవరూ లేరు.[a] అయినా, దేవుని రాజ్యంలో అత్యల్పుడైనవాడు అతని కంటే గొప్పవాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “స్త్రీలకు పుట్టినవారు” అనేది సాధారణంగా మానవులను సూచించే నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: నేను మీతో చెబుతున్నాను
  rationale: ప్రత్యక్షంగా, గంభీరంగా చెప్పే గ్రీకు సంభాషణ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μείζων
  choice: గొప్పవాడు
  rationale: పోలిక భావాన్ని నిలుపుతూ, గొప్పతనం ఏ విషయంలోనో అనవసరంగా నిర్ధారించదు.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: స్త్రీలకు పుట్టినవారిలో
  rationale: మానవులను సాధారణంగా సూచించే మూలభాషలోని నుడికార రూపాన్ని స్పష్టంగా, సన్నిహితంగా నిలుపుతుంది.
- source_word: Ἰωάννου οὐδείς ἐστιν
  choice: యోహాను కంటే గొప్పవాడు ఎవరూ లేరు
  rationale: గ్రీకులోని పోలికను సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: ὁ δὲ μικρότερος
  choice: అయినా ... అత్యల్పుడైనవాడు
  rationale: δέ లోని వ్యతిరేక మలుపును ‘అయినా’ తెలియజేస్తుంది; ఆర్టికల్‌తో substantival గా ఉన్న comparative ను సందర్భానుసారంగా ‘అత్యల్పుడైనవాడు’గా అందిస్తుంది.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: దేవుని రాజ్యంలో
  rationale: βασιλεία τοῦ θεοῦ అనే సుపరిచిత బైబిలు పదబంధాన్ని, ἐν యొక్క స్థానార్థంతో సహా, సహజ తెలుగులో నిలుపుతుంది.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: అతని కంటే గొప్పవాడు
  rationale: αὐτοῦ యోహానును సూచిస్తుందని స్పష్టంగా ఉంచి, పోలిక యొక్క ఆధారాన్ని మాత్రం వివరించకుండా వదిలేస్తుంది.
theological_decisions:
- issue: యోహానుతో ‘దేవుని రాజ్యంలో అత్యల్పుడు’ చేయబడిన పోలిక యొక్క భావం
  choice: ‘గొప్పవాడు’ అనే పోలికను వివరణ లేకుండా యథాతథంగా నిలుపడం
  alternative: ఇది నిబంధన సంబంధమైన ఆధిక్యం, ఆధ్యాత్మిక లేదా నైతిక గొప్పతనం, విమోచన చరిత్రలో స్థానం, లేదా గౌరవానికి సంబంధించిన అతిశయోక్తి అని నిర్దిష్టంగా చెప్పడం
  rationale: గ్రీకు వాక్యం పోలికను చెబుతుంది గాని గొప్పతనం ఏ పరిమాణంలో ఉందో నిర్దేశించదు; అందువల్ల దాని వేదాంతపరమైన ఉద్వేగం, అస్పష్టత నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన వాక్యశైలి వాడబడింది. ‘స్త్రీలకు పుట్టినవారిలో’ అనే మూలభాషా నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని సాధారణ భావాన్ని పాదసూచికలో తెలిపాం. ‘గొప్పవాడు’ అనే పదం పోలికకు ఆధారం ఏమిటో నిర్ణయించకుండా ఉంచుతుంది.
