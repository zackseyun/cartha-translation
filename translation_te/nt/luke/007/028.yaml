  terminology: “యోహాను,” “దేవుని రాజ్యం,” and “గొప్పవాడు” are suitable established Telugu biblical terms. “అత్యల్పుడైనవాడు” appropriately conveys the substantival expression ὁ μικρότερος without forcing a theological interpretation.
