  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐδικαιώθη ἡ σοφία ἀπὸ ⸂πάντων τῶν τέκνων αὐτῆς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/035.yaml
  text: Yet wisdom was vindicated by all her children[a][b][c].
translation:
  language: te
  text: అయినా జ్ఞానం తన పిల్లలందరిచేత సరైనదని నిరూపించబడింది.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘న్యాయమైనదని అంగీకరించబడింది,’ లేదా ‘సరైనదని రుజువైంది.’
    reason: lexical_alternative
  - marker: b
    text: ‘పిల్లలు’ అనేది జ్ఞానానికి అనుగుణంగా స్పందించడం లేదా జీవించడం ద్వారా అది సరైనదని చూపించేవారిని సూచించే రూపకం.
    reason: lexical_alternative
  - marker: c
    text: మత్తయి 11:19లో, ‘జ్ఞానం తన కార్యాలచేత సరైనదని నిరూపించబడింది’ అని ఉంది.
    reason: cross_reference
lexical_decisions:
- source_word: ἐδικαιώθη
  choice: సరైనదని నిరూపించబడింది
  rationale: ఇక్కడ δικαιόω న్యాయస్థాన సంబంధమైన ‘నీతిమంతునిగా తీర్చడం’ అనే భావంలో కాక, జ్ఞానం సరైనదని దాని పిల్లల ద్వారా వెల్లడైందనే భావంలో ఉంది. ఈ రూపం గ్రీకు కర్మణి ప్రయోగాన్ని, బహిరంగంగా రుజువయ్యే భావాన్ని నిలుపుతుంది.
- source_word: σοφία
  choice: జ్ఞానం
  rationale: σοφίαకు సహజమైన ప్రామాణిక తెలుగు పదం. ‘తన పిల్లలు’ అనే రూపకం ద్వారా జ్ఞానానికి వ్యక్తిత్వారోపణ కూడా నిలుస్తుంది.
- source_word: ἀπὸ πάντων
  choice: అందరిచేత
  rationale: కర్మణి క్రియతో వాడిన ἀπό ఇక్కడ కర్తృత్వం లేదా ఆధారాన్ని సూచిస్తుంది. ‘అందరిచేత’ అనేది ఆ భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τέκνων
  choice: పిల్లలు
  rationale: τέκνον యొక్క ప్రత్యక్ష అర్థాన్ని ఉంచి, దాన్ని ‘కార్యాలు,’ ‘ఫలితాలు’ లేదా ‘అనుచరులు’ అని ప్రధాన పాఠ్యంలో వ్యాఖ్యానించలేదు; అందువల్ల మూలంలోని రూపకార్థపు విస్తృతి నిలుస్తుంది.
- source_word: αὐτῆς
  choice: తన
  rationale: αὐτῆς జ్ఞానాన్నే సూచిస్తుంది. తెలుగులో ‘తన పిల్లలు’ అనడం సహజంగా ఉండి, వారు జ్ఞానానికి చెందినవారనే సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: καὶ
  choice: అయినా
  rationale: ముందున్న తరాన్ని గూర్చిన విమర్శకు విరుద్ధంగా వచ్చే స్వల్ప వ్యతిరేక భావాన్ని ‘అయినా’ సహజంగా వ్యక్తం చేస్తుంది; καί యొక్క సందర్భానుగుణ సంబంధాన్ని అతిగా వ్యాఖ్యానించదు.
theological_decisions:
- issue: జ్ఞానం యొక్క ‘పిల్లలు’ ఎవరు లేదా ఏమిటి?
  choice: ప్రధాన పాఠ్యంలో మూలరూపకాన్ని ‘పిల్లలు’గానే ఉంచడం
  alternative: దీనిని జ్ఞానానికి అనుగుణంగా స్పందించేవారు, జ్ఞానం కలిగించే ఫలితాలు లేదా మత్తయి 11:19లోని ‘కార్యాలు’ అని నేరుగా అనువదించడం
  rationale: లూకా గ్రీకు పాఠ్యంలో τέκνων (‘పిల్లలు’) ఉంది. కాబట్టి రూపకాన్ని ముందుగానే ఒకే వివరణకు పరిమితం చేయకుండా, జ్ఞానం సరైనదని దానితో అనుబంధమున్నవారి ద్వారా వెల్లడవుతుందనే వేదాంతపరమైన ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘పిల్లలు’ అనే సులభ పదంతో మూలంలోని వ్యక్తిత్వారోపణను, రూపకాన్ని కాపాడాం; వివరణను ప్రధాన పాఠ్యంలో చేర్చకుండా పాదసూచికకు పరిమితం చేశాం.
