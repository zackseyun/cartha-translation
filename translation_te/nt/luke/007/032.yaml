id: LUK.7.32
reference: Luke 7:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅμοιοί εἰσιν παιδίοις τοῖς ἐν ἀγορᾷ καθημένοις καὶ προσφωνοῦσιν ἀλλήλοις, ⸂ἃ λέγει⸃· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκλαύσατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/032.yaml
  text: 'They are like children sitting in the marketplace and calling to one another[a], who say: ‘We played the flute for you, and you did not dance; we sang a lament[b], and you did not weep.’'
translation:
  language: te
  text: 'వారు సంతలో కూర్చొని ఒకరినొకరు పిలుచుకుంటూ ఇలా చెప్పే పిల్లల్లా ఉన్నారు:


    ‘మేము మీకు వేణువు వాయించాము, మీరు నాట్యం చేయలేదు;

    మేము విలాపగీతం పాడాము, మీరు ఏడవలేదు.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅμοιοί εἰσιν
  choice: పిల్లల్లా ఉన్నారు
  rationale: ఉపమానాన్ని సహజమైన ఆధునిక తెలుగు రూపంలో వ్యక్తపరుస్తుంది.
- source_word: παιδίοις
  choice: పిల్లలు
  rationale: వయస్సు లేదా లింగాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: ἐν ἀγορᾷ
  choice: సంత వీధిలో
  rationale: ἀγορά సూచించే ప్రజలు కూడే బహిరంగ మార్కెట్ ప్రదేశాన్ని సాధారణ తెలుగు పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: καθημένοις
  choice: కూర్చొని
  rationale: పిల్లల భంగిమను సరళంగా, సహజంగా తెలియజేస్తుంది.
- source_word: προσφωνοῦσιν ἀλλήλοις
  choice: ఒకరినొకరు పిలుచుకుంటూ
  rationale: పరస్పరం పిలిచే భావాన్ని, దృశ్యంలోని చలాకీతనాన్ని నిలుపుతుంది.
- source_word: ἃ λέγει
  choice: అని చెప్పుకునే
  rationale: గ్రీకు వాక్యంలోని సమూహార్థక ఏకవచన క్రియను తెలుగులో సహజమైన పరస్పర/బహువచన భావంతో అందిస్తుంది.
- source_word: Ηὐλήσαμεν ὑμῖν
  choice: మేము మీ కోసం పిల్లనగ్రోవి ఊదాం
  rationale: αὐλέωలోని వేణువు లేదా గొట్టపు వాద్యం వాయించే నిర్దిష్ట భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: οὐκ ὠρχήσασθε
  choice: మీరు నాట్యం చేయలేదు
  rationale: క్రియ యొక్క ప్రత్యక్ష అర్థాన్ని వ్యాఖ్యానించకుండా సహజంగా అందిస్తుంది.
- source_word: ἐθρηνήσαμεν
  choice: మేము విలాపగీతం పాడాం
  rationale: కేవలం దుఃఖించడం కంటే, సందర్భంలోని ప్రదర్శనాత్మకమైన శోకగీత భావాన్ని మరియు మొదటి పాదంతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: οὐκ ἐκλαύσατε
  choice: మీరు ఏడవలేదు
  rationale: κλαίω యొక్క ప్రత్యక్ష అర్థాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: పిల్లల పరస్పర విరుద్ధమైన ఆటలను యేసు ఉపమాన ప్రయోజనాన్ని ముందుగానే వివరించకుండా అనువదించడం
  choice: ‘పిల్లనగ్రోవి ఊదాం,’ ‘నాట్యం చేయలేదు,’ ‘విలాపగీతం పాడాం,’ ‘ఏడవలేదు’ అనే మూర్తమైన క్రియలను ఉంచడం
  alternative: ‘సంతోషించాం/వేడుక చేసాం’ మరియు ‘దుఃఖించాం’ వంటి వ్యాఖ్యానాత్మక పదాలను వాడడం
  rationale: ఈ వచనం ఉపమాన దృశ్యాన్ని ఇస్తుంది గాని దాని అన్వయాన్ని ఈ మాటల్లోనే వివరించదు. అందువల్ల మూర్తమైన చిత్రణను నిలిపి, పాఠకుని కోసం భావాన్ని ముందుగానే నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకునికి అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిలో రూపొందించబడింది. మూలంలో ఉన్న కవితాత్మక సమాంతరతను పాద విభజనతో నిలిపింది.
