  rationale: మునుపటి విజ్ఞప్తికి పెద్దలు చెప్పిన కారణాన్ని సహజమైన తెలుగులో అనుసంధానిస్తుంది.
- source_word: τὸ ἔθνος ἡμῶν
  choice: మన ప్రజలను
  rationale: ఇక్కడ యూదుల జాతి సముదాయాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మన ప్రజలు’ సహజంగా ఉండి, రాజకీయ రాజ్యార్థాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: τὴν συναγωγήν
  choice: సమాజమందిరాన్ని
  rationale: యూదుల ఆరాధన, సమావేశ స్థలమైన synagogue అనే నిర్దిష్ట సంస్థను తెలుగులో స్థిరంగా సూచిస్తుంది; గ్రీకులో స్వామ్యసూచక పదం లేనందున ‘మన సమాజమందిరం’ అని చేర్చలేదు.
- source_word: αὐτὸς
  choice: అతడే
  rationale: కర్తపై ఉన్న గ్రీకు ఉద్ఘాటనను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ᾠκοδόμησεν
  choice: కట్టించాడు
  rationale: శతాధిపతి స్వయంగా శారీరకంగా కట్టాడని నిర్బంధించకుండా, అతని ఆధ్వర్యం లేదా పోషకత్వంలో నిర్మాణం జరిగిందనే సహజమైన తెలుగు భావాన్ని ఇస్తుంది; గ్రీకు క్రియలోని విస్తృత అర్థాన్ని గమనికలో స్పష్టం చేశాం.
- source_word: ἡμῖν
  choice: మన కోసం
  rationale: సమాజ ప్రయోజనాన్ని తెలిపే దత్తివాచక భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
