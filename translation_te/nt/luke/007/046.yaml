id: LUK.7.46
reference: Luke 7:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐλαίῳ τὴν κεφαλήν μου οὐκ ἤλειψας· αὕτη δὲ μύρῳ ἤλειψεν ⸂τοὺς πόδας μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/046.yaml
  text: You did not anoint my head with oil[a], but she has anointed my feet with perfume.
translation:
  language: te
  text: నీవు నా తలకు నూనె పూయలేదు; కానీ ఈమె నా పాదాలకు సుగంధ తైలం[a] పూసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సుగంధ తైలం’కు ‘పరిమళ నూనె’ లేదా ‘సువాసనగల లేపనం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλαίῳ
  choice: నూనె
  rationale: ఇది సాధనార్థక చతుర్థీ విభక్తిలో ఉన్న ἔλαιον. సందర్భంలో సాధారణ అతిథి సత్కారానికి ఉపయోగించే నూనెను సూచిస్తుంది; ‘ఒలీవ నూనె’ అని మరింత నిర్దిష్టంగా చెప్పడం అవసరం లేదు.
- source_word: ἤλειψας / ἤλειψεν
  choice: పూయలేదు / పూసింది
  rationale: ἀλείφω అంటే నూనె లేదా లేపనాన్ని శరీరంపై పూయడం. ‘పూయడం’ ఆధునిక తెలుగులో సహజంగా ఉండి, రెండు ఉపవాక్యాల్లోని ఒకే గ్రీకు క్రియను ఒకే విధంగా ప్రతిబింబిస్తుంది; ‘అభిషేకించడం’ వల్ల కలగగల అదనపు ఆచారపరమైన భావాన్ని నివారిస్తుంది.
- source_word: τὴν κεφαλήν μου
  choice: నా తలకు
  rationale: స్వామ్య సర్వనామంతో కూడిన ప్రత్యక్ష, సహజ తెలుగు రూపం.
- source_word: αὕτη δὲ
  choice: కానీ ఈమె
  rationale: αὕτη అక్కడున్న స్త్రీని స్పష్టంగా చూపిస్తూ, ముందున్న ‘నువ్వు’తో గట్టి వ్యత్యాసాన్ని ఏర్పరుస్తుంది. ‘ఈమె’ ఆ సూచనాత్మక బలాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: μύρῳ
  choice: సుగంధ తైలం
  rationale: μύρον సువాసనగల నూనె లేదా లేపనాన్ని సూచిస్తుంది. ‘సుగంధ తైలం’ సాధారణ నూనెతో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τοὺς πόδας μου
  choice: నా పాదాలకు
  rationale: బహువచన ప్రత్యక్షార్థాన్ని సహజ తెలుగు ప్రయోగంలో నిలుపుతుంది; గౌరవప్రదమైన సందర్భానికి ‘పాదాలు’ సరిపోతుంది.
theological_decisions:
- issue: యేసు చేసిన అతిథి సత్కార సంబంధమైన వ్యత్యాసం
  choice: ‘పూయడం’ అనే సాధారణ క్రియతో సీమోను చేయనిదాన్ని, స్త్రీ చేసిన విశేష గౌరవాన్ని నేరుగా వ్యత్యాసపరచడం
  alternative: ‘అభిషేకించడం’ వంటి ఆచారపరంగా లేదా ధార్మికంగా మరింత భారమున్న పదాన్ని ఉపయోగించడం
  rationale: తక్షణ సందర్భం అతిథి సత్కారంలో సీమోను విస్మరించిన మర్యాదను, స్త్రీ చూపిన విస్తారమైన గౌరవాన్ని పోలుస్తుంది. మూలపాఠం అనుమతించేదానికంటే ఎక్కువగా అధికారిక ప్రతిష్ఠాపన లేదా సంస్కారార్థాన్ని అనువాదంలో చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. గ్రీకులో రెండు చోట్ల వచ్చిన ἀλείφωను ‘పూయడం’తో సమాంతరంగా ఉంచి, సాధారణ నూనె మరియు విలువైన సుగంధ తైలం మధ్య వ్యత్యాసాన్ని కాపాడింది.
