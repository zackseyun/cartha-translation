  text: καὶ μακάριός ἐστιν ὃς ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/023.yaml
  text: And blessed is the one who is not caused to stumble by me[a].
translation:
  language: te
  text: నన్నుబట్టి తడబడని వ్యక్తి ధన్యుడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నన్నుబట్టి అభ్యంతరపడని వ్యక్తి’; లేదా, ‘నా కారణంగా విశ్వాసం నుండి తొలగిపోని వ్యక్తి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: ధన్యుడు
  rationale: యేసు పలికిన ధన్యతా వాక్యాలకు తగిన ఆధ్యాత్మిక, దైవానుగ్రహ భావాన్ని ‘ధన్యుడు’ సహజంగా నిలుపుతుంది; ‘సంతోషవంతుడు’ భావాన్ని మరీ కుదిస్తుంది.
- source_word: ὃς
  choice: వ్యక్తి
  rationale: లింగపరంగా పరిమితం చేయకుండా, ఏ వ్యక్తికైనా వర్తించే ఏకవచన ప్రతినిధి భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐὰν μὴ
  choice: తడబడని
  rationale: అనిశ్చిత సాధారణ షరతును తెలుగులో సహజమైన నిషేధ విశేషణ రూపంలో తెలియజేస్తుంది.
- source_word: σκανδαλισθῇ
  choice: అభ్యంతరపడి తడబడని
  rationale: కేవలం మనస్తాపపడటం అనే ఆధునిక అర్థానికి పరిమితం కాకుండా, యేసును బట్టి అభ్యంతరపడి విశ్వాసంలో తడబడే రూపకార్థాన్ని నిలుపుతుంది. కర్తపై ప్రభావం పడే గ్రీకు నిష్క్రియ రూప భావం తెలుగు సందర్భంలో ఈ నిర్మాణం ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: ἐν ἐμοί
  choice: నా విషయంలో
  rationale: యేసే అభ్యంతరానికి లేదా తడబాటుకు సందర్భమవుతున్నాడనే భావాన్ని సహజంగా తెలియజేస్తుంది; ‘నాలో’ అనే అక్షరార్థ రూపం తెలుగులో అస్పష్టంగా ఉండవచ్చు.
theological_decisions:
- issue: యేసును బట్టి కలిగే అభ్యంతరం మరియు తడబాటు మధ్య ఉన్న భావ ఉద్రిక్తత
  choice: ‘అభ్యంతరపడి తడబడని’ అని రెండు భావాలను కలిపి నిలుపడం
  alternative: ‘నా వల్ల అభ్యంతరపడని వ్యక్తి ధన్యుడు’ లేదా ‘నా కారణంగా విశ్వాసం విడిచిపెట్టని వ్యక్తి ధన్యుడు’
  rationale: మొదటి ప్రత్యామ్నాయం భావాన్ని కేవలం మనస్తాపానికి పరిమితం చేయవచ్చు; రెండవది దానిని పూర్తిగా విశ్వాసత్యాగంగా నిర్ణయిస్తుంది. ఎంపిక చేసిన రూపం అభ్యంతరం నుంచి ఆధ్యాత్మిక తడబాటు వరకు ఉన్న మూలపద విస్తృతిని, వాక్యంలోని హెచ్చరికను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ధన్యతా వాక్యానికి తగిన గంభీరతతో. ‘ధన్యుడు’ సంప్రదాయబద్ధమైనప్పటికీ ఇప్పటికీ విస్తృతంగా గ్రాహ్యమైన పదం.
