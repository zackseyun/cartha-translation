  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ στᾶσα ⸂ὀπίσω παρὰ τοὺς πόδας αὐτοῦ⸃ κλαίουσα, ⸂τοῖς δάκρυσιν ἤρξατο βρέχειν τοὺς πόδας αὐτοῦ⸃ καὶ ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς ἐξέμασσεν, καὶ κατεφίλει τοὺς πόδας αὐτοῦ καὶ ἤλειφεν τῷ μύρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/038.yaml
  text: and standing behind him at his feet[a], weeping, she began to wet his feet with her tears, and was wiping them with the hair of her head[b], and was kissing his feet and anointing them with the perfume.
translation:
  language: te
  text: ఆమె ఆయన వెనుక, ఆయన పాదాల దగ్గర నిలబడి ఏడుస్తూ, తన కన్నీళ్లతో ఆయన పాదాలను తడపడం మొదలుపెట్టింది. తన తల వెంట్రుకలతో వాటిని తుడుస్తూ, ఆయన పాదాలను ముద్దుపెట్టుకుంటూ[a], పరిమళ తైలంతో[b] వాటిని అభిషేకిస్తూ ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆయన పాదాలను పదేపదే ముద్దుపెట్టుకుంటూ’; గ్రీకు క్రియలో బలమైన భావం ఉంది, ఇంపర్ఫెక్ట్ కాలం పునరావృత చర్యను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సుగంధ లేపనంతో’; గ్రీకు పదం పరిమళమున్న నూనెను లేదా లేపనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: στᾶσα
  choice: నిలబడి
  rationale: ఆరిస్ట్ కృదంతం దృశ్యానికి నేపథ్య చర్యను సూచిస్తుంది; ఆధునిక తెలుగులో ‘నిలబడి’ సహజంగా ఉంటుంది.
- source_word: ὀπίσω παρὰ τοὺς πόδας αὐτοῦ
  choice: ఆయన వెనుక, ఆయన పాదాల దగ్గర
  rationale: ὀπίσω అనే ‘వెనుక’ భావాన్నీ, παρά + ద్వితీయా విభక్తి తెలిపే పాదాల సమీప స్థానాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: κλαίουσα
  choice: ఏడుస్తూ
  rationale: కొనసాగుతున్న రోదనను సహజమైన ఆధునిక తెలుగు పదబంధంతో వ్యక్తం చేస్తుంది.
- source_word: τοῖς δάκρυσιν ἤρξατο βρέχειν
  choice: తన కన్నీళ్లతో ... తడపడం మొదలుపెట్టింది
  rationale: ἤρξατο చర్య ఆరంభాన్ని, βρέχειν ‘తడపడం’ అనే ప్రాథమిక భావాన్ని తెలియజేస్తాయి.
- source_word: ἐξέμασσεν
  choice: తుడుస్తూ
  rationale: ఇంపర్ఫెక్ట్ రూపంలోని కొనసాగుతున్న చర్యను నిలుపుతుంది; ఫలితాన్ని అతిగా నిర్దేశించే ‘ఆరబెట్టింది’ కంటే ఇది సముచితం.
- source_word: ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς
  choice: తన తల వెంట్రుకలతో
  rationale: గ్రీకు వాక్యంలోని స్పష్టమైన శరీర సంబంధ చిత్రణను సహజ తెలుగులో నిలుపుతుంది.
- source_word: κατεφίλει
  choice: ముద్దుపెట్టుకుంటూ
  rationale: ఇంపర్ఫెక్ట్ కాలం సూచించే కొనసాగుతున్న లేదా పునరావృత చర్యను తెలుగు క్రియారూపం తెలియజేస్తుంది; తీవ్రతను ప్రధాన పాఠ్యంలో అతిగా విస్తరించదు.
- source_word: ἤλειφεν
  choice: అభిషేకిస్తూ ఉంది
  rationale: కొనసాగుతున్న చర్యనూ, ఈ సందర్భంలో ἀλείφω యొక్క సాంస్కృతికంగా పరిచితమైన అర్థాన్నీ నిలుపుతుంది.
- source_word: τῷ μύρῳ
  choice: పరిమళ తైలంతో
  rationale: μύρον సుగంధభరితమైన నూనె లేదా లేపనాన్ని సూచిస్తుంది; ‘పరిమళ తైలం’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి దాని స్వరూపాన్ని అతిగా నిర్దేశించదు.
theological_decisions:
- issue: యేసు పాదాల పట్ల ఆ స్త్రీ చేసిన చర్యల చిత్రణ
  choice: ఏడవడం, కన్నీళ్లతో తడపడం, వెంట్రుకలతో తుడవడం, ముద్దుపెట్టుకోవడం, పరిమళ తైలంతో అభిషేకించడం అనే స్పష్టమైన శారీరక చర్యలను యథాతథంగా ఉంచడం
  alternative: ‘భక్తిని చూపింది’ వంటి వ్యాఖ్యానాత్మక సంక్షిప్తీకరణ లేదా ముద్దుల పునరావృతతను తగ్గించే మృదువైన పదప్రయోగం
  rationale: గ్రీకు పాఠ్యం వినయపూర్వకమైన, భావోద్వేగభరితమైన చర్యలను సజీవంగా వర్ణిస్తుంది. వాటికి పాఠ్యంలో లేని భక్తిశాస్త్ర వ్యాఖ్యానాన్ని జోడించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సహజమైన కథన శైలి. గ్రీకు ఇంపర్ఫెక్ట్ క్రియల కొనసాగుతున్న స్వభావాన్ని తెలుగు ‘-తూ’ రూపాలతో వ్యక్తం చేశాం. మూలంలోని భావోద్వేగ తీవ్రతను నిలుపుతూ అదనపు భక్తిపరమైన వ్యాఖ్యానం చేర్చలేదు.
