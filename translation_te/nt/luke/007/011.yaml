id: LUK.7.11
reference: Luke 7:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ἑξῆς ⸀ἐπορεύθη εἰς πόλιν καλουμένην Ναΐν, καὶ συνεπορεύοντο αὐτῷ οἱ μαθηταὶ ⸀αὐτοῦ καὶ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/011.yaml
  text: And it happened on the next day that he went into a town called Nain[a], and his disciples and a large crowd were going with him.
translation:
  language: te
  text: 'ఆ మరుసటి రోజు[a] ఇలా జరిగింది: ఆయన నాయీను అనే పట్టణానికి వెళ్లారు. ఆయన శిష్యులూ పెద్ద జనసమూహమూ ఆయనతో పాటు వెళ్తూ ఉన్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో ‘మరుసటి రోజు’కు బదులుగా ‘కొద్దికాలం తర్వాత’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ ἑξῆς
  choice: ఆ మరుసటి రోజు
  rationale: లూకా కథనంలోని సంఘటన-పరిచయ సూత్రాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, SBLGNT పాఠంలోని కాలసూచనను ‘మరుసటి రోజు’గా నిలుపుతుంది; ἐγένετοను విడిగా అనువదిస్తే తెలుగులో అనవసరమైన భారంగా ఉంటుంది.
- source_word: ἐπορεύθη
  choice: వెళ్లారు
  rationale: πορεύομαι యొక్క సాధారణ ప్రయాణార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: εἰς πόλιν
  choice: పట్టణానికి
  rationale: πόλις ఇక్కడ నాయీను వంటి చిన్న నివాసస్థలాన్ని సూచించగలదు; ‘పట్టణం’ సహజంగా ఉంది. గ్రీకు εἰς తెలిపే గమ్యాన్ని తెలుగు దత్తివిభక్తి సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καλουμένην Ναΐν
  choice: నాయీను అనే
  rationale: καλουμένηνకు సహజమైన తెలుగు నిర్మాణం ‘అనే’; స్థలనామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: συνεπορεύοντο αὐτῷ
  choice: ఆయనతో పాటు వెళ్తున్నారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న సహప్రయాణ భావాన్ని నిలుపుతుంది.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ఆయన శిష్యులు
  rationale: సువార్తల సందర్భంలో μαθηταίకు స్థిరమైన, సులభంగా అర్థమయ్యే తెలుగు పదం ‘శిష్యులు’.
- source_word: ὄχλος πολύς
  choice: పెద్ద జనసమూహం
  rationale: ὄχλος యొక్క సమూహార్థాన్నీ πολύς సూచించే పరిమాణాన్నీ స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
