  to: 'ఆ మరుసటి రోజు[a] ఇలా జరిగింది: ఆయన నాయీను అనే పట్టణానికి వెళ్లారు. ఆయన శిష్యులూ పెద్ద జనసమూహమూ ఆయనతో పాటు వెళ్తూ ఉన్నారు.'
