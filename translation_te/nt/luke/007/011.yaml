translation_notes:
  register: సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు; యేసును సూచించేటప్పుడు గౌరవ బహువచనం వాడబడింది. గ్రీకు వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా, దాని కథన ప్రవాహం మరియు కొనసాగుతున్న సహప్రయాణ భావం నిలుపబడ్డాయి.
