id: LUK.7.17
reference: Luke 7:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ὁ λόγος οὗτος ἐν ὅλῃ τῇ Ἰουδαίᾳ περὶ αὐτοῦ ⸀καὶ πάσῃ τῇ περιχώρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/017.yaml
  text: And this report about him went out through all Judea and all the surrounding region[a].
translation:
  language: te
  text: ఆయనను గురించిన ఈ వార్త యూదయ అంతటా, చుట్టుపక్కల ప్రాంతమంతటా వ్యాపించింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆయనను గురించిన ఈ సమాచారం’ లేదా ‘ఆయనను గురించిన ఈ మాట.’
    reason: λόγος అనే గ్రీకు పదం ఈ సందర్భంలో ‘వార్త,’ ‘సమాచారం,’ లేదా ‘మాట’ అనే భావాలను కలిగి ఉండవచ్చు.
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: వ్యాపించింది
  rationale: వార్త ఒక ప్రాంతమంతటికి వెళ్లడాన్ని తెలుగులో సహజంగా తెలిపే క్రియ. మూలంలోని ‘బయలుదేరింది/వెలుపలికి వెళ్లింది’ అనే చిత్రాన్ని అక్షరార్థంగా ఉంచడం కంటే సందర్భంలోని ప్రచార భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ὁ λόγος οὗτος
  choice: ఈ వార్త
  rationale: ఇక్కడ λόγος ఒకే మాటను కాక, యేసును గురించిన విషయం లేదా నివేదికను సూచిస్తుంది. ‘ఈ వార్త’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ
  choice: యూదయ అంతటా
  rationale: ὅλῃ యొక్క విస్తృత, పంపిణీ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: περὶ αὐτοῦ
  choice: ఆయనను గురించిన
  rationale: περί + షష్ఠీ విభక్తి ఇక్కడ ‘ఆయన గురించి/ఆయనను గురించిన’ అనే అర్థం ఇస్తుంది. గౌరవప్రదమైన తెలుగు కథన శైలికి ‘ఆయనను గురించిన’ సరిపోతుంది.
- source_word: πάσῃ τῇ περιχώρῳ
  choice: చుట్టుపక్కల ప్రాంతమంతటా
  rationale: περίχωρος అనే పదంలోని పరిసర ప్రాంత భావాన్ని, πάσῃ యొక్క సమగ్రతను రెండింటినీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: καὶ ... καὶ
  choice: …, …
  rationale: గ్రీకు వాక్యంలోని సమన్వయాన్ని తెలుగులో కామాతో సహజంగా కలిపాం; రెండు భౌగోళిక పరిధుల కూడిక భావం నిలిచింది.
