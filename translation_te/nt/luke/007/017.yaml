  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘వ్యాపించింది’ అనే సహజ ప్రయోగం వార్త విస్తరించిన భావాన్ని అందిస్తుంది; [a] గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
