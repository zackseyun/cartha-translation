base_translation:
  language: en
  yaml_path: translation/nt/luke/007/036.yaml
  text: One of the Pharisees was asking him to eat with him[a], and after entering the Pharisee’s house[b], he reclined at the table.
translation:
  language: te
  text: పరిసయ్యులలో ఒకడు తనతో భోజనం చేయమని ఆయనను అడుగుతూ ఉన్నాడు[a]. ఆయన ఆ పరిసయ్యుని ఇంట్లోకి వెళ్లి, భోజనానికి పక్కకు ఒరిగి కూర్చున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “తనతో కలిసి తినేలా ఆయనను అడుగుతూ ఉన్నాడు.”
    reason: lexical_alternative
  - marker: b
    text: అంటే, ఆ కాలంలోని ఆచారం ప్రకారం అధికారిక భోజనానికి నిటారుగా కూర్చోకుండా, బల్ల దగ్గర పక్కకు ఒరిగి కూర్చున్నాడు.
    reason: cultural_note
lexical_decisions:
- source_word: Ἠρώτα
  choice: అడుగుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న గత చర్యను నిలుపుతుంది; సందర్భంలో ఇది ఆహ్వానం అయినప్పటికీ, మూలంలోని ‘అడగడం’ అనే భావానికి దగ్గరగా ఉంటుంది.
- source_word: δέ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది కథనాన్ని ముందుకు నడిపే స్వల్ప అనుసంధాన అవ్యయం. తెలుగులో వాక్యక్రమమే ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది; ‘అప్పుడు’ వంటి కాలార్థాన్ని అనవసరంగా చేర్చలేదు.
- source_word: τις τῶν Φαρισαίων
  choice: పరిసయ్యులలో ఒకడు
  rationale: భాగార్థక షష్ఠీ విభక్తి భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἵνα φάγῃ μετ’ αὐτοῦ
  choice: తనతో భోజనం చేయమని
  rationale: ἵνα తో కూడిన సంభావనార్థక క్రియ తెలిపే ఉద్దేశాన్ని సహజమైన తెలుగు పరోక్ష అభ్యర్థన రూపంలో అందిస్తుంది.
- source_word: εἰσελθὼν εἰς τὸν οἶκον τοῦ Φαρισαίου
  choice: ఆ పరిసయ్యుని ఇంట్లోకి వెళ్లి
  rationale: అనంతర ప్రధాన క్రియకు ముందు జరిగిన ప్రవేశాన్ని క్రియావిశేషణాత్మక అసమాపక క్రియతో సహజంగా తెలియజేస్తుంది.
- source_word: κατεκλίθη
  choice: భోజనానికి పక్కకు ఒరిగి కూర్చున్నాడు
  rationale: మొదటి శతాబ్దపు విందులో బల్ల దగ్గర పక్కకు ఒరిగి భోజనం చేసే భంగిమను తెలియజేస్తుంది; కేవలం ‘కూర్చున్నాడు’ అని చెప్పి చారిత్రక చిత్రాన్ని కోల్పోకుండా ఉంటుంది.
