id: LUK.7.24
reference: Luke 7:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀπελθόντων δὲ τῶν ἀγγέλων Ἰωάννου ἤρξατο λέγειν ⸂πρὸς τοὺς ὄχλους⸃ περὶ Ἰωάννου· Τί ⸀ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/024.yaml
  text: 'After John''s messengers had gone away[a], he began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed shaken by the wind?”'
translation:
  language: te
  text: 'యోహాను సందేశకులు వెళ్లిపోయిన తరువాత, ఆయన యోహాను గురించి జనసమూహాలకు మాట్లాడడం మొదలుపెట్టాడు: “మీరు అరణ్యంలోకి దేనిని చూసేందుకు[a] వెళ్లారు? గాలికి ఊగుతున్న రెల్లునా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చూడడానికి” లేదా “తిలకించడానికి.”
    reason: θεάσασθαι అనే క్రియకు సాధారణంగా చూడడం అనే అర్థంతో పాటు శ్రద్ధగా వీక్షించడం అనే భావం కూడా ఉండవచ్చు.
lexical_decisions:
- source_word: Ἀπελθόντων
  choice: వెళ్లిపోయిన తరువాత
  rationale: జనిటివ్ అబ్సల్యూట్‌లోని భూతకాల కృదంతాన్ని కాలసంబంధంగా అనువదించి, సందేశకులు వెళ్లిన తరువాత యేసు మాట్లాడడం మొదలుపెట్టాడనే క్రమాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἀγγέλων Ἰωάννου
  choice: యోహాను పంపిన సందేశకులు
  rationale: ఈ సందర్భంలో ἀγγέλων పరలోక దూతలను కాక యోహాను పంపిన మనుష్యులను సూచిస్తుంది. ‘పంపిన సందేశకులు’ అనే రూపం ఆ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἤρξατο λέγειν
  choice: మాట్లాడడం మొదలుపెట్టాడు
  rationale: ఈ ఆరంభార్థక నిర్మాణం ప్రసంగం మొదలైనదని సూచిస్తుంది; జనసమూహాలను ఉద్దేశించి చెప్పే సందర్భంలో ఈ తెలుగు రూపం సహజంగా ఉంటుంది.
- source_word: πρὸς τοὺς ὄχλους
  choice: జనసమూహాలతో
  rationale: బహువచనమైన ὄχλουςను నిలుపుతూ, మాట్లాడే క్రియతో సహజమైన ఆధునిక తెలుగు ప్రయోగాన్ని ఉపయోగిస్తుంది.
- source_word: περὶ Ἰωάννου
  choice: యోహాను గురించి
  rationale: జనిటివ్‌తో వచ్చిన περίకు ఈ సందర్భంలో సాధారణమైన ‘గురించి’ అనే అర్థాన్ని ఇస్తుంది.
- source_word: Τί ἐξήλθατε
  choice: దేనిని ... వెళ్లారు?
  rationale: τί ఇక్కడ ప్రధానంగా వెళ్లడానికి గల కారణాన్ని కాక, వారు చూడటానికి వెళ్లిన వస్తువును ప్రశ్నిస్తుంది; ‘దేనిని’ తరువాత వచ్చే ‘రెల్లునా?’ అనే ప్రశ్నకు సహజంగా అనుసంధానమవుతుంది.
- source_word: εἰς τὴν ἔρημον
  choice: అరణ్యంలోకి
  rationale: యోహాను పరిచర్య చేసిన జనావాసాలు తక్కువగా ఉన్న ప్రాంతాన్ని సూచించే స్థిరమైన, సందర్భోచితమైన తెలుగు పదం.
- source_word: θεάσασθαι
  choice: చూసేందుకు
  rationale: శ్రద్ధగా చూడటం లేదా తిలకించడం అనే భావాన్ని అతిగా వ్యాఖ్యానించకుండా, సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κάλαμον
  choice: రెల్లును
  rationale: అస్థిరంగా ఊగగల రెల్లు మొక్క అనే మూల చిత్రాన్ని నిలుపుతుంది.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: గాలికి ఊగుతున్న
  rationale: గాలి ప్రభావంతో రెల్లు కదిలే సజీవ చిత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: యోహాను గురించి గాలికి ఊగే రెల్లు అనే అలంకారిక ప్రశ్న
  choice: ‘గాలికి ఊగుతున్న రెల్లునా?’ అనే మూల చిత్రాన్ని వివరణ లేకుండా నిలుపడం
  alternative: ‘స్థిరత్వం లేని మనిషినినా?’ అని భావార్థాన్ని నేరుగా చెప్పడం
  rationale: యేసు ఉపయోగించిన రూపకాన్ని పాఠకులే గ్రహించేలా మూలవాక్యం వదిలేస్తుంది. యోహాను బలహీనుడా లేదా చంచలుడా అనే భావాన్ని అనువాదంలో ముందుగానే పరిష్కరించకుండా ఆ అలంకారిక ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘సందేశకులు’ అనే పదం సందర్భంలోని మానవ ప్రతినిధులను స్పష్టం చేస్తుంది; రూపకాన్ని మాత్రం వ్యాఖ్యానించకుండా యథాతథంగా ఉంచింది.
