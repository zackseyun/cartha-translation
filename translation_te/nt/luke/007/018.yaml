lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: తెలియజేశారు
  rationale: సమాచారాన్ని మరొకరికి చేరవేయడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Ἰωάννῃ
  choice: యోహానుకు
  rationale: దత్తివిభక్తిలో ఉన్న పరోక్ష కర్మను తెలుగులో సహజంగా ‘కు’ ప్రత్యయంతో తెలిపింది.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ఆయన శిష్యులు
  rationale: μαθηταίలోని గురువు-శిష్య సంబంధాన్ని స్థిరమైన సువార్త పరిభాషలో నిలుపుతుంది; αὐτοῦ సూచించే వ్యక్తి సందర్భానుసారం యోహాను.
- source_word: περὶ πάντων τούτων
  choice: ఈ విషయాలన్నిటి గురించి
  rationale: περίని ‘గురించి’తో స్పష్టంగా చూపుతూ, πάντων మరియు τούτων యొక్క సమగ్రతను, సూచనను కాపాడుతుంది.
- source_word: προσκαλεσάμενος
  choice: పిలిచి
  rationale: యోహాను వారిని తన వద్దకు పిలిపించిన చర్యను సహజంగా వ్యక్తం చేసే క్రియావిశేష రూపం; మూలంలో లేని ‘తన దగ్గరకు’ను అనవసరంగా చేర్చదు.
- source_word: δύο τινὰς τῶν μαθητῶν αὐτοῦ
  choice: తన శిష్యుల్లో ఇద్దరిని
  rationale: భాగార్థక షష్ఠిని ‘శిష్యుల్లో’తో స్పష్టపరుస్తుంది. τινάς యొక్క అనిర్దిష్ట ఎంపిక తెలుగులో ‘ఇద్దరిని’ అనే సహజ ప్రయోగంలో తగినంతగా వ్యక్తమవుతుంది; ‘కొందరిలో ఇద్దరు నిర్దిష్ట వ్యక్తులను’ వంటి కృత్రిమ పదబంధాన్ని నివారిస్తుంది.
- source_word: ὁ Ἰωάννης
  choice: యోహాను
  rationale: గ్రీకులో స్పష్టంగా పునరుక్తమైన కర్తను తెలుగులోనూ పేర్కొని, రెండో వాక్యభాగపు కర్తను నిర్దిష్టం చేస్తుంది.
