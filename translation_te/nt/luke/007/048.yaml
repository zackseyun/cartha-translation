  text: Then he said to her[a], “Your sins are forgiven.”
translation:
  language: te
  text: 'అప్పుడు ఆయన ఆమెతో ఇలా అన్నాడు: “నీ పాపాలు క్షమించబడ్డాయి[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరానువాదంగా, “నీ పాపాలు క్షమించబడి ఉన్నాయి.” గ్రీకు పరిపూర్ణ కర్మణి క్రియారూపం పూర్తయిన కార్యాన్ని, దాని ఫలితంగా కొనసాగుతున్న స్థితిని నొక్కిచెప్పగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: అని అన్నాడు
  rationale: λέγω యొక్క భూతకాల రూపాన్ని ప్రత్యక్ష వాక్యంతో సహజమైన ఆధునిక తెలుగులో ‘అని అన్నాడు’గా ఇచ్చాం.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ δέ స్పష్టమైన వ్యతిరేకతను కాక కథనాన్ని ముందుకు నడిపే స్వల్ప అనుసంధానాన్ని సూచిస్తుంది; ‘అప్పుడు’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: αὐτῇ
  choice: ఆమెతో
  rationale: స్త్రీలింగ ఏకవచన దత్తి సర్వనామాన్ని ‘ఆమెతో’గా అనువదించడం ‘చెప్పు’ అనే క్రియతో సహజమైన తెలుగు ప్రయోగం.
- source_word: Ἀφέωνταί
  choice: క్షమించబడ్డాయి
  rationale: ἀφίημι యొక్క పరిపూర్ణ కర్మణి రూపం పూర్తయిన క్షమాపణను, దాని కొనసాగుతున్న ఫలితాన్ని సూచిస్తుంది. ‘క్షమించబడ్డాయి’ సహజంగా ఉండి ఆ భావాన్ని మోస్తుంది.
- source_word: σου
  choice: నీ
  rationale: రెండవ పురుష ఏకవచన షష్ఠీ సర్వనామాన్ని పాపాలతో సంబంధం చూపే సహజమైన స్వామ్యరూపం ‘నీ’గా ఇచ్చాం.
- source_word: αἱ ἁμαρτίαι
  choice: పాపాలు
  rationale: ఈ సందర్భంలో ἁμαρτίαι దేవుని ఎదుట నైతిక అపరాధాలను సూచిస్తుంది; తెలుగు స్వామ్య నిర్మాణంలో గ్రీకు నిర్దేశక ఉపపదాన్ని విడిగా చూపనవసరం లేదు.
theological_decisions:
- issue: క్షమాపణ ప్రకటనలో Ἀφέωνταί అనే పరిపూర్ణ కర్మణి రూపం యొక్క బలం
  choice: ‘నీ పాపాలు క్షమించబడ్డాయి’ అని పూర్తయిన కార్యాన్ని, దాని ప్రస్తుత ఫలితాన్ని సూచించే ప్రకటనగా అనువదించడం.
  alternative: ‘నీ పాపాలు క్షమించబడి ఉన్నాయి.’
  rationale: గ్రీకు పరిపూర్ణ కర్మణి రూపం పూర్తయిన కార్యాన్నీ, దాని ఫలితంగా కొనసాగుతున్న స్థితినీ సూచించగలదు. ప్రధాన పాఠంలోని రూపం సహజమైన తెలుగులో రెండింటినీ సూచిస్తుంది; క్షమాపణ జరిగిన సమయం లేదా దానిని చేసిన కర్త గురించి మూలపాఠం చెప్పనిదాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ప్రత్యక్ష వాక్య నిర్మాణం వాడబడింది. ‘ఆమెతో’ సాధారణ తెలుగు నుడికారానికి అనుగుణం; ‘క్షమించబడ్డాయి’ మూలంలోని కర్మణి భావాన్ని నిలుపుతుంది.
