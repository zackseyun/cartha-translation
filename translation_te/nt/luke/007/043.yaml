id: LUK.7.43
reference: Luke 7:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἀποκριθεὶς Σίμων εἶπεν· Ὑπολαμβάνω ὅτι ᾧ τὸ πλεῖον ἐχαρίσατο. ὁ δὲ εἶπεν αὐτῷ· Ὀρθῶς ἔκρινας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/043.yaml
  text: Simon answered[a], “I suppose the one to whom he forgave more.” And he said to him[b], “You have judged rightly.”
translation:
  language: te
  text: సీమోను జవాబిచ్చి, “ఎవరికైతే అతడు ఎక్కువగా మాఫీ చేశాడో, అతడే అని నేను అనుకుంటున్నాను[a]” అన్నాడు. ఆయన అతనితో, “నీవు సరిగానే నిర్ణయించావు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అని ఊహిస్తున్నాను” లేదా “అని భావిస్తున్నాను”; గ్రీకు పదం జాగ్రత్తతో చేసిన, కొంత అనిశ్చితమైన నిర్ధారణను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: జవాబిస్తూ ... అన్నాడు
  rationale: గ్రీకులోని కృదంతం–సమాపక క్రియా నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో ప్రతిస్పందనను పరిచయం చేసే విధంగా ఉంచుతుంది.
- source_word: Ὑπολαμβάνω
  choice: అని అనుకుంటున్నాను
  rationale: ఇది దృఢ నిశ్చయంకన్నా జాగ్రత్తతో చేసిన ఊహాత్మక నిర్ధారణను వ్యక్తం చేస్తుంది.
- source_word: ᾧ τὸ πλεῖον ἐχαρίσατο
  choice: ఎవరికి అతడు ఎక్కువగా మాఫీ చేశాడో
  rationale: సాపేక్ష సర్వనామంలోని పరోక్ష కర్మ భావాన్ని నిలుపుతూ, అప్పును కృపతో రద్దు చేయడాన్ని సందర్భానుసారంగా ‘మాఫీ చేశాడు’ అని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ὀρθῶς
  choice: సరిగానే
  rationale: సీమోను ఇచ్చిన అంచనా సరైనదని ధృవీకరించే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἔκρινας
  choice: తీర్పు చెప్పావు
  rationale: κρίνω యొక్క నిర్ణయాత్మక/మూల్యాంకన భావాన్ని నిలుపుతూ, ఇప్పుడే చెప్పిన సమాధానంపై చేసిన అంచనాను సూచిస్తుంది.
theological_decisions:
- issue: ఉపమానంలో ἐχαρίσατο సూచించే మాఫీ స్వభావం
  choice: మాఫీ చేశాడు
  alternative: అప్పును రద్దు చేశాడు / కృపగా విడిచిపెట్టాడు
  rationale: తక్షణ సందర్భం అప్పు రద్దు గురించినదైనా, విస్తృత సందర్భం పాపక్షమాపణతో దానికి ఉన్న సంబంధాన్ని చూపుతుంది. ‘మాఫీ చేశాడు’ రెండింటికీ అనువుగా ఉండి, పాఠ్యంలో లేని అదనపు సిద్ధాంత నిర్ధారణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. అప్పు సందర్భంలో ‘మాఫీ’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, తరువాతి క్షమాపణ భావంతోనూ అనుసంధానమవుతుంది.
