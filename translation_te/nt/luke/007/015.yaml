  yaml_path: translation/nt/luke/007/015.yaml
  text: And the dead man sat up and began to speak[a], and he gave him to his mother.
translation:
  language: te
  text: చనిపోయినవాడు లేచి కూర్చుని మాట్లాడడం మొదలుపెట్టాడు. యేసు అతణ్ణి అతని తల్లికి ఇచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యేసు అతణ్ణి అతని తల్లికి తిరిగి ఇచ్చాడు.’ గ్రీకు పాఠ్యం సరళంగా ‘అతణ్ణి అతని తల్లికి ఇచ్చాడు’ అని చెబుతుంది; తిరిగి ఇచ్చాడనే భావం సందర్భం ద్వారా తెలుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεκάθισεν
  choice: లేచి కూర్చుని
  rationale: పడుకున్న స్థితి నుండి లేచి కూర్చోవడాన్ని ఈ క్రియ సూచిస్తుంది. ఆధునిక తెలుగులో ‘లేచి కూర్చుని’ సహజంగా ఉండి, గ్రీకు పదం తెలిపేదానికంటే ఎక్కువ అర్థాన్ని చేర్చదు.
- source_word: ὁ νεκρός
  choice: చనిపోయినవాడు
  rationale: అక్షరార్థంగా ‘చనిపోయినవాడు’ అనే వ్యక్తిగత సూచనను నిలుపుతుంది. ‘శవం’ అనడం వ్యక్తిని వస్తువులా చూపించవచ్చు; సందర్భంలోని యువకుణ్ణి సూచించడానికి ఈ రూపం సహజం.
- source_word: ἤρξατο λαλεῖν
  choice: మాట్లాడడం మొదలుపెట్టాడు
  rationale: ἄρχομαιతో కూడిన infinitive క్రియారంభాన్ని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం స్పష్టంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: λαλεῖν
  choice: మాట్లాడడం
  rationale: λαλέωకు ‘మాట్లాడు/పలుకు’ అనే అర్థం ఉంది. ఇక్కడ ‘మాట్లాడడం’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ
  choice: అతణ్ణి అతని తల్లికి అప్పగించాడు
  rationale: గ్రీకులో ‘అతణ్ణి అతని తల్లికి ఇచ్చాడు’ అని సరళంగా ఉంది. తెలుగులో ఒక వ్యక్తిని మరొకరి సంరక్షణకు ఇవ్వడం అనే సందర్భంలో ‘అప్పగించాడు’ సహజంగా ఉంటుంది; ‘తిరిగి’ అనే మాటను ప్రధాన పాఠ్యంలో చేర్చకుండా పునరుద్ధరణ భావాన్ని సందర్భానికే వదిలేస్తుంది.
theological_decisions:
- issue: యేసు కుమారుణ్ణి తల్లికి పునరుద్ధరించాడనే భావాన్ని ‘తిరిగి’ అని స్పష్టంగా చేర్చాలా?
  choice: ప్రధాన పాఠ్యంలో ‘అతని తల్లికి అప్పగించాడు’ అని ఉంచడం
  alternative: ‘అతణ్ణి అతని తల్లికి తిరిగి అప్పగించాడు’ లేదా ‘అతణ్ణి అతని తల్లికి తిరిగి ఇచ్చాడు’
  rationale: సందర్భం పునరుద్ధరణను స్పష్టంగా సూచించినా, గ్రీకు δίδωμιలో ‘తిరిగి’ అనే భావాన్ని తెలిపే ప్రత్యేక పదం లేదు. కాబట్టి మూలంలోని సరళతను ప్రధాన పాఠ్యంలో నిలిపి, సందర్భసిద్ధమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘అప్పగించాడు’ వ్యక్తిని తల్లి సంరక్షణకు ఇవ్వడాన్ని సహజంగా వ్యక్తం చేస్తుంది. కర్త గందరగోళం రాకుండా చివరి వాక్యంలో ‘యేసు’ను స్పష్టంగా పేర్కొన్నాం; ఇది సందర్భం ద్వారా నిర్దిష్టమైన కర్తను తెలుగులో సహజంగా వ్యక్తీకరించడం.
