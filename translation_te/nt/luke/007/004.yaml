id: LUK.7.4
reference: Luke 7:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ παραγενόμενοι πρὸς τὸν Ἰησοῦν παρεκάλουν αὐτὸν σπουδαίως λέγοντες ὅτι Ἄξιός ἐστιν ᾧ ⸀παρέξῃ τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/004.yaml
  text: When they came to Jesus[a], they earnestly appealed to him, saying, “He is worthy that you should grant this to him.”
translation:
  language: te
  text: వారు యేసు దగ్గరకు వచ్చి, ఆయనను ఎంతో శ్రద్ధగా వేడుకుంటూ, “మీరు అతనికోసం ఈ మేలు చేయడానికి అతడు అర్హుడు” అన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీరు అతనికి దీనిని అనుగ్రహించడానికి అతడు అర్హుడు.”
    reason: παρέξῃ అనే పదానికి సందర్భాన్ని బట్టి ‘చేయు’తో పాటు ‘అందించు/అనుగ్రహించు’ అనే భావమూ సాధ్యమని చూపే పదార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: παραγενόμενοι
  choice: దగ్గరికి వచ్చి
  rationale: ఈ సందర్భంలో ఈ కృదంతం యేసు దగ్గరికి వచ్చి చేరడాన్ని సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో ‘దగ్గరికి వచ్చి’ సహజంగా ఉంది.
- source_word: παρεκάλουν
  choice: వేడుకున్నారు
  rationale: ఇక్కడ పెద్దలు గౌరవంతోనూ పట్టుదలతోనూ అభ్యర్థిస్తున్నారు. ‘వేడుకున్నారు’ అభ్యర్థన తీవ్రతను తెలియజేస్తుంది; ‘బతిమాలారు’ కంటే సందర్భానికి తగిన గౌరవభావాన్ని నిలుపుతుంది.
- source_word: σπουδαίως
  choice: ఎంతో మనఃపూర్వకంగా
  rationale: ఈ క్రియావిశేషణం శ్రద్ధతో కూడిన గంభీరమైన పట్టుదలను వ్యక్తం చేస్తుంది. ‘ఎంతో మనఃపూర్వకంగా’ ఆధునిక తెలుగులో సహజంగా ఆ తీవ్రతను అందిస్తుంది.
- source_word: Ἄξιός
  choice: అర్హుడు
  rationale: ἄξιοςలోని యోగ్యత లేదా అర్హత అనే మూల్యనిర్ణయ భావాన్ని ‘అర్హుడు’ నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: ᾧ
  choice: అతనికి
  rationale: సంబంధ సర్వనామం శతాధిపతిని సూచించే దత్తి విభక్తిలో ఉంది; తెలుగులో ‘అతనికి’ అని స్పష్టంగా వ్యక్తమవుతుంది.
- source_word: παρέξῃ
  choice: చేయడానికి
  rationale: παρέχω ఇక్కడ కోరిన సహాయాన్ని అందించడం లేదా చేయడం అనే విస్తృత భావంలో ఉంది. ‘ఇది చేయడానికి’ మూలంలోని అర్థవ్యాప్తిని అనవసరంగా ‘అనుగ్రహించు’ వంటి ప్రత్యేక భావానికి పరిమితం చేయదు.
- source_word: τοῦτο
  choice: ఇది
  rationale: ఈ సూచన సర్వనామం ముందు సందర్భంలో కోరిన కార్యాన్ని సూచిస్తుంది; ‘ఇది’ మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
theological_decisions:
- issue: శతాధిపతి ‘అర్హుడు’ అనే పెద్దల మూల్యనిర్ణయం
  choice: వక్తల మాటగా ‘అతడు అర్హుడు’ అని యథాతథంగా ఉంచడం
  alternative: దేవుని ఎదుట అతడు నీతిమంతుడని వివరణాత్మకంగా మార్చడం
  rationale: ఈ వచనం పెద్దలు యేసుతో చెప్పిన అంచనాను మాత్రమే నమోదు చేస్తుంది; దానిని రచయిత యొక్క సంపూర్ణ ధార్మిక తీర్పుగా మార్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ‘మీరు’ రూపాన్ని ఉపయోగించాం. వాక్యం సాధారణ పాఠకులకు సహజంగా ఉండేలా నిర్మించబడింది; అదే సమయంలో అభ్యర్థనలోని గౌరవం, పట్టుదల, మరియు ‘అర్హుడు’ అనే మూల్యనిర్ణయం నిలుపబడ్డాయి.
