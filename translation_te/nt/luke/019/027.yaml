revisions:
- from: అయితే, నేను తమపై రాజుగా పరిపాలించడం[a] ఇష్టపడని నా శత్రువులైన వీరిని ఇక్కడికి తీసుకొచ్చి, నా ఎదుట వధించండి[b].
  to: అయితే, వారిపై నేను రాజుగా పరిపాలించడం[a] ఇష్టపడని ఈ నా శత్రువులను ఇక్కడికి తీసుకొచ్చి, నా ఎదుట వధించండి[b].
  rationale: The revision removes the inappropriate honorific plural pronoun, makes the demonstrative force natural with ‘ఈ నా శత్రువులను,’ and corrects footnote b so that it reflects the severity of κατασφάζω without adding an unwarranted detail about the method of killing. No theological interpretation has been added.
