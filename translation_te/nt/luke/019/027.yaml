id: LUK.19.27
reference: Luke 19:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πλὴν τοὺς ἐχθρούς μου ⸀τούτους τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς ἀγάγετε ὧδε καὶ κατασφάξατε ⸀αὐτοὺς ἔμπροσθέν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/027.yaml
  text: But as for these enemies of mine[a], who did not want me to reign over them[b], bring them here and slaughter them in front of me.
translation:
  language: te
  text: అయితే, వారిపై నేను రాజుగా పరిపాలించడం[a] ఇష్టపడని ఈ నా శత్రువులను ఇక్కడికి తీసుకొచ్చి, నా ఎదుట వధించండి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారికి నేను రాజుగా ఉండడం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘సంహరించండి’ లేదా ‘చంపివేయండి.’ మూలపదం సాధారణంగా ‘చంపండి’ అనేదానికంటే బలమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: అయితే
  rationale: చివరి, తీవ్రమైన ఆజ్ఞవైపు మళ్లించే వ్యతిరేక-సంధాన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τοὺς ἐχθρούς μου τούτους
  choice: నా శత్రువులైన వీరిని
  rationale: ἐχθρούς అనే వ్యక్తిగత విరోధ భావాన్నీ, τούτους ఇచ్చే నిర్దిష్ట ఉద్ఘాటననూ నిలుపుతుంది.
- source_word: τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς
  choice: నేను తమపై రాజుగా పరిపాలించడం ఇష్టపడని
  rationale: కర్తృవాచక కృదంత పదబంధాన్ని తెలుగులో సహజమైన విశేషణ ఉపవాక్యంగా మార్చి, θέλωలోని ఇష్టపడకపోవడాన్నీ βασιλεύωలోని రాజుగా పాలించే భావాన్నీ నిలుపుతుంది.
- source_word: ἀγάγετε ὧδε
  choice: ఇక్కడికి తీసుకొచ్చి
  rationale: వ్యక్తులను వక్త ఉన్న చోటికి రప్పించాలనే ఆజ్ఞను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κατασφάξατε
  choice: వధించండి
  rationale: సాధారణంగా ‘చంపండి’ అనేదానికంటే బలమైన, హింసాత్మక భావాన్ని కలిగి ఉండి, న్యాయపరమైన ‘మరణశిక్ష విధించండి’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: ἔμπροσθέν μου
  choice: నా ఎదుట
  rationale: వక్త సమక్షంలో, అతని కళ్లముందు జరగాలనే స్థలికమైన మరియు వ్యక్తిగతమైన భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: ఉపమానంలోని వక్త ఆజ్ఞకు ఉన్న సంబంధం
  choice: హింసాత్మక ఆజ్ఞను మృదువుచేయకుండా, దానిని ఉపమానంలోని రాజవంశీయుని ప్రత్యక్ష మాటగానే అనువదించడం
  alternative: ఇది కేవలం ఉపమాన చిత్రణ మాత్రమే అని అనువాదంలోనే స్పష్టంగా దూరం పెట్టడం
  rationale: గ్రీకు పాఠం ఈ మాటను ఉపమానంలోని వక్త నేరుగా పలికిన ఆజ్ఞగా ఇస్తుంది. కాబట్టి దాని తీవ్రతను నిలుపుతూ, ఉపమానం వెలుపల యేసు ఇచ్చిన ప్రత్యక్ష ఆజ్ఞగా కూడా అదనంగా గుర్తించకుండా theological tensionను యథాతథంగా ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి. ‘వధించండి’ హింసను మృదువుచేయకుండా మూలంలోని తీవ్రతను అందిస్తుంది; వాక్యం ఉపమానంలోని రాజవంశీయుని మాటగా ఎటువంటి వివరణాత్మక చేర్పులూ లేకుండా ఉంచబడింది.
