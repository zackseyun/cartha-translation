source:
  edition: SBLGNT
  text: καὶ οὐχ ⸀εὕρισκον τὸ τί ποιήσωσιν, ὁ λαὸς γὰρ ἅπας ἐξεκρέματο αὐτοῦ ἀκούων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/048.yaml
  text: And they could not find what they might do[a], because all the people were hanging on his words as they listened.
translation:
  language: te
  text: వారు ఏమి చేయాలో కనుగొనలేకపోయారు, ఎందుకంటే ప్రజలందరూ ఆయన మాటలను ఎంతో ఆసక్తిగా వింటూ ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ప్రజలందరూ ఆయనకు వేలాడుతూ, వింటున్నారు.” ఇది గ్రీకు నుడికారం; ప్రజలు యేసుపై పూర్తిగా దృష్టి నిలిపి అత్యంత ఆసక్తితో వింటున్నారని సూచిస్తుంది. ప్రధాన పాఠంలో ‘ఆయన మాటలను’ అనే పదాలు ఈ నుడికార భావాన్ని సహజంగా తెలియజేయడానికి చేర్చబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐχ εὕρισκον
  choice: కాని ... వారికి తోచలేదు
  rationale: ప్రతికూల అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న విఫలయత్నాన్ని లేదా కార్యమార్గం కనుగొనలేని స్థితిని సూచిస్తుంది. సందర్భంలో సహజమైన తెలుగు కోసం ‘వారికి తోచలేదు’ అని అనువదించాం; καί ఇక్కడ ముందున్న విషయానికి వ్యతిరేక మలుపును కలిపే ‘కాని’గా వచ్చింది.
- source_word: τὸ τί ποιήσωσιν
  choice: ఏమి చేయాలో
  rationale: τίతో కూడిన aorist subjunctive ఆలోచించి నిర్ణయించవలసిన కార్యమార్గాన్ని సూచిస్తుంది. ‘ఏమి చేయాలో’ ఆ deliberative భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ὁ λαὸς γὰρ ἅπας
  choice: ఎందుకంటే ప్రజలందరూ
  rationale: γάρ కారణాన్ని తెలియజేస్తుంది; ἅπας సమస్తతను బలపరుస్తుంది. అందువల్ల ‘ఎందుకంటే ప్రజలందరూ’ అని అనువదించాం.
- source_word: ἐξεκρέματο αὐτοῦ ἀκούων
  choice: ఆయన చెప్పేది ఎంతో ఆసక్తిగా వింటూ ఉన్నారు
  rationale: ἐκκρέμαμαι + genitive యేసుపై పూర్తిగా దృష్టి నిలిపి, ఉత్కంఠతో వినడాన్ని తెలిపే నుడికారం. ‘ఆయన చెప్పేది ఎంతో ఆసక్తిగా వింటూ ఉన్నారు’ అనే రూపం ἀκούωνను కూడా సహజంగా కలిపి ఆ భావాన్ని స్పష్టంగా అందిస్తుంది; ‘చెప్పేది’ మూలంలో ప్రత్యక్షంగా లేకపోవడం పాదటిప్పణిలో సూచించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి పాటించబడింది. అక్షరార్థంగా అసహజంగా వినిపించే గ్రీకు నుడికారాన్ని భావస్పష్టతతో ప్రధాన పాఠంలో ఇచ్చి, దాని రూపాన్ని పాదటిప్పణిలో నిలిపాం.
