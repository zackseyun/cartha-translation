reference: Luke 19:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: σταθεὶς δὲ Ζακχαῖος εἶπεν πρὸς τὸν κύριον· Ἰδοὺ τὰ ⸀ἡμίσιά ⸂μου τῶν ὑπαρχόντων⸃, κύριε, ⸂τοῖς πτωχοῖς δίδωμι⸃, καὶ εἴ τινός τι ἐσυκοφάντησα ἀποδίδωμι τετραπλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/008.yaml
  text: But Zacchaeus stood and said to the Lord[a], “Look, Lord, I give half of my possessions to the poor, and if I have extorted anything from anyone[b], I repay it fourfold.”
translation:
  language: te
  text: అయితే జక్కయ్య నిలబడి ప్రభువుతో, “ఇదిగో ప్రభువా, నా ఆస్తిలో సగాన్ని పేదలకు ఇస్తాను; ఎవరి నుంచైనా ఏదైనా బలవంతంగా వసూలు చేసి ఉంటే[a], నాలుగింతలు తిరిగి చెల్లిస్తాను[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎవరినైనా ఏ విషయంలోనైనా మోసం చేసి ఉంటే.” గ్రీకు క్రియ బలవంతంగా గుంజడం, దోచుకోవడం లేదా తప్పుడు ఆరోపణతో మోసం చేయడం అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులోని వర్తమాన కాల క్రియలను “ఇస్తున్నాను ... తిరిగి చెల్లిస్తున్నాను” అని ప్రస్తుత ఆచరణకు సూచనగా కూడా అర్థం చేసుకోవచ్చు. తెలుగు “ఇస్తాను ... చెల్లిస్తాను” అనే రూపాలు తక్షణ సంకల్పాన్ని కూడా వ్యక్తం చేయగలవు.
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: నిలబడి
  rationale: ఇక్కడ ἵστημι అకర్మక భావంలో కథన చర్యను సూచిస్తుంది; భంగిమను అతిగా వివరించకుండా సహజంగా అనువదిస్తుంది.
- source_word: κύριον / κύριε
  choice: ప్రభువు / ప్రభువా
  rationale: యేసును ఉద్దేశించిన గౌరవసూచక బిరుదును, లూకా సందర్భంలో దానికి ఉండగల మరింత లోతైన భావాన్ని తగ్గించకుండా నిలుపుతుంది.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: మాటపై ప్రత్యేక శ్రద్ధను ఆకర్షించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: τὰ ἡμίσιά μου τῶν ὑπαρχόντων
  choice: నా ఆస్తిలో సగం
  rationale: ὑπάρχοντα ఇక్కడ ఆస్తిపాస్తులను సూచిస్తుంది; భాగార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τοῖς πτωχοῖς
  choice: పేదలకు
  rationale: ఆర్థికంగా పేదవారిని సూచించే సంక్షిప్తమైన, సాధారణ తెలుగు రూపం.
- source_word: δίδωμι
  choice: ఇస్తాను
  rationale: తెలుగులో ఈ రూపం అలవాటుగా చేసే పనినీ, తక్షణ సంకల్పాన్నీ సందర్భానుసారం సూచించగలదు; గ్రీకు వర్తమాన కాలంలోని భావసందిగ్ధతను సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: ἐσυκοφάντησα
  choice: బలవంతంగా వసూలు చేసి ఉంటే
  rationale: అధికార దుర్వినియోగంతో డబ్బు గుంజడం లేదా మోసపూర్వకంగా తీసుకోవడం అనే క్రియ భావాన్ని సుంకపు వసూలుదారుడి సందర్భంలో స్పష్టంగా తెలియజేస్తుంది; ఇతర సాధ్యార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: ἀποδίδωμι
  choice: తిరిగి చెల్లిస్తాను
  rationale: తీసుకున్నదానికి పరిహారంగా తిరిగి ఇవ్వడం అనే న్యాయపరమైన పునఃచెల్లింపు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τετραπλοῦν
  choice: నాలుగింతలు
  rationale: నాలుగు రెట్లు పరిహారం చెల్లించడం అనే పరిమాణాన్ని ఖచ్చితంగా తెలియజేస్తుంది.
theological_decisions:
- issue: δίδωμι, ἀποδίδωμι అనే వర్తమాన కాల క్రియల భావం
  choice: ‘ఇస్తాను ... తిరిగి చెల్లిస్తాను’ అని అనువదించి, కొనసాగుతున్న ఆచరణ లేదా తక్షణ సంకల్పం అనే రెండింటికీ అవకాశం ఉంచడం
  alternative: ‘ఇస్తున్నాను ... తిరిగి చెల్లిస్తున్నాను’ అని కొనసాగుతున్న చర్యగా స్పష్టీకరించడం
  rationale: గ్రీకు వర్తమాన సూచక క్రియలు జక్కయ్య తన ప్రస్తుత ఆచరణను వివరిస్తున్నాడా, అప్పటికప్పుడే సంకల్పాన్ని ప్రకటిస్తున్నాడా అనే విషయాన్ని తేల్చవు. అతని మాటలు గత నీతికి నిదర్శనమా లేక కొత్త పశ్చాత్తాప ఫలమా అనే వేదాంత నిర్ణయాన్ని అనువాదంలో ముందుగానే విధించకుండా ఈ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ప్రభువు/ప్రభువా’ అనే రూపాలు κύριος యొక్క బిరుదు భావాన్ని నిలుపుతున్నాయి; వర్తమాన క్రియల వ్యాఖ్యాన భేదం ప్రధాన పాఠ్యంలో బలవంతంగా పరిష్కరించబడలేదు.
