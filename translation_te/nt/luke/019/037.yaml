id: LUK.19.37
reference: Luke 19:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγγίζοντος δὲ αὐτοῦ ἤδη πρὸς τῇ καταβάσει τοῦ Ὄρους τῶν Ἐλαιῶν ἤρξαντο ἅπαν τὸ πλῆθος τῶν μαθητῶν χαίροντες αἰνεῖν τὸν θεὸν φωνῇ μεγάλῃ περὶ ⸀πασῶν ὧν εἶδον δυνάμεων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/037.yaml
  text: And as he was already drawing near[a], at the descent of the Mount of Olives, the whole multitude of the disciples began rejoicing and praising God with a loud voice for all the mighty works that they had seen,
translation:
  language: te
  text: ఆయన అప్పటికే ఒలీవ కొండ దిగే మార్గానికి చేరువవుతుండగా, శిష్యుల సమూహమంతా తాము చూసిన శక్తివంతమైన కార్యాలన్నిటినిబట్టి[a] సంతోషిస్తూ, పెద్ద స్వరంతో దేవుణ్ణి స్తుతించడం మొదలుపెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అద్భుతాలన్నిటినిబట్టి” లేక “మహత్కార్యాలన్నిటినిబట్టి.” గ్రీకు పదం శక్తిని, అలాగే ఆ శక్తి వ్యక్తమైన కార్యాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζοντος δὲ αὐτοῦ ἤδη
  choice: ఆయన అప్పటికే ... సమీపిస్తుండగా
  rationale: జెనిటివ్ అబ్సల్యూట్ ఇచ్చే కాలపరమైన నేపథ్యాన్ని, సమీపిస్తూ ఉన్న కదలికను సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: πρὸς τῇ καταβάσει τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: ఒలీవ కొండ దిగే చోటుకు
  rationale: దిగువ వైపు వెళ్లే ప్రదేశాన్ని సూచిస్తుంది; ఖచ్చితమైన భౌగోళిక రూపాన్ని అవసరానికి మించి నిర్ణయించకుండా తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἅπαν τὸ πλῆθος τῶν μαθητῶν
  choice: శిష్యుల సమూహమంతా
  rationale: ఇది సాధారణ ప్రజల గుంపు కాదని, శిష్యులతో కూడిన మొత్తం సమూహమని స్పష్టంగా తెలియజేస్తుంది.
- source_word: χαίροντες αἰνεῖν τὸν θεὸν
  choice: సంతోషిస్తూ ... దేవుణ్ణి స్తుతించడం
  rationale: χαίροντες అనే సహచర క్రియాభావాన్ని నిలుపుతూ, వారు సంతోషంతో స్తుతించడం ప్రారంభించారనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: φωνῇ μεγάλῃ
  choice: పెద్ద స్వరంతో
  rationale: గ్రీకు భాషలోని స్పష్టమైన ధ్వని-వ్యక్తీకరణను సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: περὶ πασῶν ὧν εἶδον δυνάμεων
  choice: తాము చూసిన శక్తికార్యాలన్నిటినిబట్టి
  rationale: δύναμιςలోని ‘శక్తి’ భావాన్ని నిలుపుతూ, వారు చూసిన దైవశక్తి వ్యక్తమైన కార్యాలను సూచిస్తుంది; ‘అద్భుతాలు’ అనే మరింత సంకుచిత అర్థానికి మాత్రమే పరిమితం చేయదు.
- source_word: ἤρξαντο
  choice: మొదలుపెట్టారు
  rationale: తదనంతర స్తుతి కార్యం ఆ సమయంలో ప్రారంభమైందనే భావాన్ని స్పష్టంగా తెలుపుతుంది.
theological_decisions:
- issue: అద్భుత సందర్భంలో δύναμις పదానికి అనువాదం
  choice: శక్తికార్యాలు
  alternative: అద్భుతాలు; శక్తివంతమైన కార్యాలు; మహత్కార్యాలు
  rationale: మూలపదం శక్తినీ, ఆ శక్తి వ్యక్తమైన కార్యాలనూ సూచించగలదు. ‘శక్తికార్యాలు’ దైవశక్తి కార్యరూపంలో వెల్లడైన భావాన్ని కాపాడుతుంది; దానిని కేవలం సాంకేతిక అర్థంలోని ‘అద్భుతాలు’గా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఒలీవ కొండ’ ప్రాచుర్యంలో ఉన్న స్థలనామ రూపంగా ఉంచబడింది. పాదసూచిక గుర్తు అది వివరిస్తున్న ‘శక్తికార్యాలు’ వద్దనే పెట్టబడింది.
