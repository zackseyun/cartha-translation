id: LUK.19.34
reference: Luke 19:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν ⸀ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/034.yaml
  text: And they said[a], “The Lord has need of it.”
translation:
  language: te
  text: వారు, “ప్రభువుకు దాని అవసరం ఉంది” అని అన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, κύριος అనే పదాన్ని యేసుకు బిరుదుగా కాకుండా యజమాని అనే అర్థంలో తీసుకుంటే, “యజమానికి దాని అవసరం ఉంది.”
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: అందుకు వారు
  rationale: δέ స్వల్ప అనుసంధానాన్ని సూచిస్తుంది; ఇక్కడ ముందటి ప్రశ్నకు వారి మాటను సహజంగా కలిపేందుకు ‘అందుకు’ సరిపోతుంది. οἱ నామవాచకార్థకంగా వాడబడి, ముందుగా ప్రస్తావించిన శిష్యులను సూచిస్తుంది.
- source_word: εἶπαν
  choice: చెప్పారు
  rationale: λέγω క్రియ యొక్క భూతకాల రూపం ఇక్కడ నేరుగా ‘చెప్పారు’ అనే అర్థాన్నిస్తుంది; ‘జవాబిచ్చారు’ అనడం సందర్భానికి సరిపోయినా, మూలక్రియలో లేని భావాన్ని కొంత స్పష్టంగా చేర్చుతుంది.
- source_word: ὅτι
  choice: ప్రత్యక్ష ఉల్లేఖనం మరియు ‘అని’ ద్వారా వ్యక్తీకరించబడింది
  rationale: ὅτι ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది. తెలుగులో ఉల్లేఖన చిహ్నాలతో పాటు వాక్యాంతంలోని ‘అని’ ఈ పనిని సహజంగా నిర్వహిస్తుంది.
- source_word: Ὁ κύριος
  choice: ప్రభువు
  rationale: κύριοςకు ప్రాజెక్టు ప్రామాణిక అనువాదమైన ‘ప్రభువు’ను ఉంచడం ద్వారా యేసును సూచించే బిరుదు నిలుస్తుంది. ‘యజమాని’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో భద్రపరిచాం.
- source_word: αὐτοῦ
  choice: అది
  rationale: ఈ సర్వనామం ముందుగా ప్రస్తావించిన గాడిదపిల్లను సూచిస్తుంది. తెలుగులో ‘అది’ అని చెప్పడం సహజంగా, మూలంలోని సర్వనామ స్వభావాన్ని నిలుపుతుంది.
- source_word: χρείαν ἔχει
  choice: అవసరం
  rationale: ఈ గ్రీకు నుడికారం అక్షరార్థంగా ‘అవసరం కలిగి ఉన్నాడు’ అని ఉన్నా, ‘ప్రభువుకు అది అవసరం’ అనేది సహజమైన ఆధునిక తెలుగు; అదే భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
theological_decisions:
- issue: శిష్యుల మాటలో κύριος ఎవరిని సూచిస్తుంది?
  choice: ‘ప్రభువు’ అని అనువదించి, సందర్భంలో యేసును సూచించే బిరుదుగా ఉంచాం.
  alternative: ‘యజమాని’—గాడిదపిల్ల యజమానిని సూచించవచ్చు.
  rationale: లూకా కథన సందర్భంలో ఇది యేసు ముందుగా శిష్యులకు చెప్పిన సమాధానం; లూకా κύριοςను యేసుకు బిరుదుగా తరచుగా వాడతాడు. అయితే ఈ పదానికి ‘యజమాని’ అనే అర్థం కూడా సాధ్యమే కాబట్టి, ఆ నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలి వాడబడింది. ‘ప్రభువు’ అనే గౌరవప్రదమైన బిరుదును నిలిపి, మూలంలోని ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో స్పష్టంగా ఇచ్చాం.
