  yaml_path: translation/nt/luke/019/018.yaml
  text: And the second came, saying, ‘Your mina, Lord, has made five minas.’
translation:
  language: te
  text: రెండవవాడు వచ్చి, ‘ప్రభువా, మీ మినా ఐదు మినాలను సంపాదించింది’ అని చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: రెండవవాడు
  rationale: క్రమంలో రెండవ దాసుణ్ణి సూచించే సహజమైన తెలుగు రూపం.
- source_word: κύριε
  choice: ప్రభువా
  rationale: ప్రత్యక్ష సంబోధనను గౌరవపూర్వకంగా నిలుపుతుంది; ఈ ఉపమాన సందర్భంలో యజమానిని ఉద్దేశించిన మాట.
- source_word: μνᾶ
  choice: మినా
  rationale: ప్రాచీన గ్రీకు ద్రవ్య/బరువు ప్రమాణానికి లిప్యంతరీకరణ; ఆధునిక నాణెం విలువను అనవసరంగా రుద్దదు.
- source_word: ἐποίησεν
  choice: సంపాదించింది
  rationale: అక్షరార్థంగా ‘చేసింది/ఉత్పత్తి చేసింది’; పెట్టుబడి ద్వారా అదనపు మొత్తాన్ని పొందిన భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: κύριε అనే సంబోధనకు దైవార్థమా లేక యజమాని అనే అర్థమా
  choice: ప్రభువా
  alternative: అయ్యా / యజమానీ
  rationale: గ్రీకు పదంలోని గౌరవార్థక విస్తృతిని ఉంచుతూ, ఉపమానంలోని యజమాని సంబోధనను సందర్భమే నిర్ధారించనిస్తుంది; ప్రత్యేక సిద్ధాంతార్థాన్ని వచనంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవపూర్వక ప్రత్యక్ష సంభాషణ కోసం ‘మీ’ వాడబడింది. వాక్యం సంక్షిప్తంగా, కథనశైలిలో ఉంచబడింది.
