  source_fidelity: ‘రెండవవాడు వచ్చి’ accurately represents καὶ ἦλθεν ὁ δεύτερος, with the implied servant naturally supplied by context. ‘ప్రభువా’ preserves the direct vocative κύριε without forcing a divine interpretation. ‘మీ మినా ఐదు మినాలను సంపాదించింది’ conveys the personified subject and resulting gain of ἐποίησεν πέντε μνᾶς; ‘సంపాదించింది’ is a contextually apt rendering for the investment outcome.
