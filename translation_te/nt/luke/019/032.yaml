- from: పంపబడినవారు వెళ్లి, ఆయన తమతో చెప్పినట్టే కనుగొన్నారు.[a]
  to: పంపబడినవారు వెళ్లి, ఆయన వారికి చెప్పినట్టే కనుగొన్నారు.[a]
  rationale: The revision changes only the case marking for αὐτοῖς, from “తమతో” to the idiomatic dative “వారికి.” It preserves the Greek’s unstated object in the main text and retains the contextual alternative in the footnote.
  reviewer_model: gpt-5.6-terra
