  text: So those who were sent went away and found it just as he had told them[a].
translation:
  language: te
  text: పంపబడినవారు వెళ్లి, ఆయన వారికి చెప్పినట్టే కనుగొన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సందర్భంలో సూచించబడిన కర్మను స్పష్టంగా చేర్చి, “ఆయన వారికి చెప్పినట్టే దానిని కనుగొన్నారు”; ఇక్కడ ‘దానిని’ అంటే యేసు వివరించిన గాడిదపిల్ల.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθόντες
  choice: వెళ్లి
  rationale: ἀπέρχομαι అనే క్రియ యొక్క భూతకాల క్రియావిశేషణ రూపం; వారు అక్కడి నుంచి వెళ్లిన చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ కథన పురోగతిని సూచిస్తుంది. తెలుగు వాక్యక్రమంలో ‘వెళ్లి’ అనే అనుసంధానం ఆ పురోగతిని సహజంగానే వ్యక్తం చేస్తుంది; ‘అప్పుడు’ లేదా ‘కాబట్టి’ చేరిస్తే మూలంలో లేని కాల లేదా ఫలిత భావం బలపడవచ్చు.
- source_word: οἱ ἀπεσταλμένοι
  choice: పంపబడినవారు
  rationale: ఆర్టికల్‌తో ఉన్న పరిపూర్ణ కర్మణి క్రియావిశేషణాన్ని నామవాచకార్థంలో ప్రతిబింబిస్తూ, ఎవరు పంపారో మూలవాక్యంలాగే ప్రత్యక్షంగా పేర్కొనదు.
- source_word: εὗρον
  choice: కనుగొన్నారు
  rationale: మూల గ్రీకులో కర్మ స్పష్టంగా లేదు. సందర్భం గాడిదపిల్లను సూచించినప్పటికీ, ప్రధాన పాఠంలో కర్మను చేర్చకుండా మూలంలోని సంక్షిప్తతను నిలుపుతుంది.
- source_word: καθὼς
  choice: చెప్పినట్టే
  rationale: καθώς తెలిపే అనురూపతను ‘-ట్టే’ సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: εἶπεν αὐτοῖς
  choice: ఆయన తమతో చెప్పిన
  rationale: λέγω యొక్క సాధారణ ‘చెప్పు’ అర్థాన్ని ఉంచుతుంది; αὐτοῖςను సహజమైన ప్రతిఫల సర్వనామ ప్రయోగంతో ‘తమతో’గా వ్యక్తం చేస్తుంది. కనుగొనడానికి ముందే చెప్పిన సంగతి తెలుగు సందర్భం ద్వారా స్పష్టమవుతుంది.
