  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలో εὗρονకు ప్రత్యక్ష కర్మ లేకపోవడాన్ని ప్రధాన పాఠంలో నిలిపి, సందర్భానుసారంగా కర్మను చేర్చే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
