id: LUK.19.21
reference: Luke 19:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐφοβούμην γάρ σε ὅτι ἄνθρωπος αὐστηρὸς εἶ, αἴρεις ὃ οὐκ ἔθηκας καὶ θερίζεις ὃ οὐκ ἔσπειρας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/021.yaml
  text: 'for I was afraid of you[a], because you are a severe man: you take what you did not put down[b], and you reap what you did not sow.'
translation:
  language: te
  text: ఎందుకంటే నేను మీకు భయపడేవాడిని; మీరు కఠినమైన[a] మనిషి. మీరు ఉంచనిదాన్ని తీసుకుంటారు[b], విత్తనిదాన్ని కోస్తారు.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కఠిన స్వభావం గల’ లేదా ‘నిర్దాక్షిణ్యమైన.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మీరు ఉంచనిదాన్ని తీసుకుంటారు.’ సందర్భాన్ని మరింత వివరణాత్మకంగా చూపడానికి, ‘మీరు పెట్టనిదాన్ని ఎత్తుకుంటారు’ లేదా ‘మీరు జమచేయనిదాన్ని వసూలు చేస్తారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβούμην
  choice: నేను నీకు భయపడ్డాను
  rationale: అసంపూర్ణ భూతకాల క్రియ సేవకుడు గతంలో అనుభవించిన భయస్థితిని సూచిస్తుంది. ఈ రూపం ఆధునిక తెలుగులో సహజంగా ఉండి ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి మాటకు కారణాన్ని పరిచయం చేసే వివరణాత్మక సంబంధాన్ని స్పష్టంగా చూపిస్తుంది.
- source_word: αὐστηρὸς
  choice: కఠినమైన
  rationale: ఈ పదంలోని నిర్దాక్షిణ్యమైన, ఎక్కువగా కోరే స్వభావాన్ని నిలుపుతుంది; అయితే సేవకుని ఆరోపణను దాటి యజమాని స్వభావంపై తీర్పు ఇవ్వదు.
- source_word: ἄνθρωπος
  choice: మనిషి
  rationale: ఉపమానంలోని నిర్దిష్ట పురుషుణ్ణి సూచిస్తుంది; తెలుగులో ‘మనిషి’ సహజమైన సమానార్థకం.
- source_word: αἴρεις
  choice: తీసుకుంటావు
  rationale: ‘తీసుకోవడం’ లేదా ‘ఎత్తుకోవడం’ అనే విస్తృత అర్థాన్ని సహజంగా అందిస్తూ, గ్రీకు పదం చెప్పనంత ప్రత్యేకమైన ఆర్థిక భావాన్ని చేర్చదు.
- source_word: ὃ οὐκ ἔθηκας
  choice: పెట్టనిదాన్ని
  rationale: τίθημι అనే క్రియలోని ‘పెట్టు/ఉంచు’ అనే ప్రత్యక్ష చిత్రాన్ని నిలుపుతుంది; ‘జమచేయు’ వంటి మరింత నిర్దిష్టమైన వాణిజ్య పదాన్ని అనవసరంగా చేర్చదు.
- source_word: θερίζεις
  choice: కోస్తావు
  rationale: పంట కోయడం అనే వ్యవసాయ రూపకాన్ని సహజమైన తెలుగులో వ్యక్తం చేసి, విత్తడం–కోయడం అనే సమాంతరతను కాపాడుతుంది.
- source_word: ὃ οὐκ ἔσπειρας
  choice: విత్తనిదాన్ని
  rationale: σπείρω యొక్క ‘విత్తు’ అనే ప్రత్యక్ష అర్థాన్ని, దానికి జతగా ఉన్న కోత రూపకాన్ని యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: సేవకుడు యజమానిని వర్ణించిన మాటలను, యజమాని ప్రతిష్ఠను కాపాడటానికి మృదువుగా అనువదించాలా?
  choice: సేవకుని ఆరోపణాత్మక మాటల బలాన్ని తగ్గించకుండా ఉంచడం
  alternative: ‘నియమబద్ధమైన’ లేదా ‘ఎక్కువగా ఆశించే’ వంటి మృదువైన పదాలతో ప్రతికూల భావాన్ని తగ్గించడం
  rationale: ఇది సేవకుడు చెప్పిన వివరణ మరియు ఆరోపణ. ఆ ఆరోపణ నిజమా కాదా అని అనువాదమే తీర్పు చెప్పకుండా, కథనంలోని ధార్మిక ఉద్రిక్తతను నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సేవకుడు యజమానితో నేరుగా మాట్లాడే సందర్భానికి తగిన ఏకవచన సంబోధనను వాడాం. వాక్యానికి గౌరవప్రదమైన కథన శైలి ఉన్నప్పటికీ, ఆరోపణలోని సూటితనాన్ని మరియు ‘విత్తడం–కోయడం’ రూపక సమాంతరతను నిలిపాం.
