review_pass:
  verdict: revise
  source_fidelity: The core sense is retained, including the servant's accusatory characterization and the two parallel clauses. However, the imperfect ἐφοβούμην is better represented as a continuing past state, and the relative clauses should explicitly retain the subject ‘you’ to avoid ambiguity in Telugu.
  naturalness: The draft is generally understandable, but ‘పెట్టనిదాన్ని’ can sound elliptical and potentially obscure who did not put it. ‘మీరు’ is the natural respectful singular address for a servant speaking to his master in modern standard Telugu, while retaining the accusation's force.
  terminology: ‘కఠినమైన’ suitably renders αὐστηρός without resolving whether the servant's accusation is true. ‘విత్తు/కోయు’ preserves the agricultural parallelism. ‘ఉంచనిదాన్ని’ is clearer than ‘పెట్టనిదాన్ని’ while remaining noncommercial and close to τίθημι.
  issues:
  - severity: medium
    issue: The imperfect verb ἐφοβούμην is rendered by the simple past ‘నేను నీకు భయపడ్డాను.’
    rationale: Although possible, this does not naturally convey the ongoing past state expressed by the imperfect. ‘నేను మీకు భయపడేవాడిని’ more directly preserves that aspect.
  - severity: medium
    issue: ‘పెట్టనిదాన్ని’ leaves the subject of ‘did not put/place’ implicit.
    rationale: The Greek explicitly says ‘what you did not put/place.’ ‘మీరు ఉంచనిదాన్ని’ is idiomatic Telugu and preserves the explicit subject and nontechnical wording.
  - severity: low
    issue: The singular familiar address ‘నువ్వు/నీకు’ is too informal for a servant addressing his master in modern standard Telugu.
    rationale: Using respectful singular ‘మీరు/మీకు’ fits the narrative register without weakening the servant’s blunt accusation.
  revised_text: ఎందుకంటే నేను మీకు భయపడేవాడిని; మీరు కఠినమైన[a] మనిషి. మీరు ఉంచనిదాన్ని తీసుకుంటారు[b], విత్తనిదాన్ని కోస్తారు.’
