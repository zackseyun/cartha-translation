  to: ఎందుకంటే నేను మీకు భయపడేవాడిని; మీరు కఠినమైన[a] మనిషి. మీరు ఉంచనిదాన్ని తీసుకుంటారు[b], విత్తనిదాన్ని కోస్తారు.’
  rationale: The revision preserves the servant’s reported accusation and the source’s ambiguity about the master’s character. It improves fidelity to the imperfect tense, makes the subject in the first relative clause explicit, and uses natural respectful singular address appropriate to the narrative setting. The verse-initial ‘ఎందుకంటే’ retains γάρ’s explanatory connection to the preceding statement.
