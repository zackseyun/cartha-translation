revisions:
- from: జనసమూహంలో ఉన్న పరిసయ్యులలో కొందరు ఆయనతో, “బోధకుడా, నీ శిష్యులను గద్దించు” అన్నారు.
  to: జనసమూహంలోనుండి పరిసయ్యులలో కొందరు ఆయనతో, “గురువా, నీ శిష్యులను గద్దించు” అన్నారు.
  rationale: The revision restores the directional/source force of ἀπὸ τοῦ ὄχλου and uses a more natural Telugu form of direct address for Διδάσκαλε. No footnotes are needed because the translation does not require explanation and the Greek ambiguity is adequately retained.
  reviewer_model: gpt-5.6-terra
