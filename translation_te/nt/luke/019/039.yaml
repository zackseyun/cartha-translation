id: LUK.19.39
reference: Luke 19:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καί τινες τῶν Φαρισαίων ἀπὸ τοῦ ὄχλου εἶπαν πρὸς αὐτόν· Διδάσκαλε, ἐπιτίμησον τοῖς μαθηταῖς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/039.yaml
  text: And some of the Pharisees from the crowd said to him[a], “Teacher[b], rebuke your disciples.”
translation:
  language: te
  text: జనసమూహంలోనుండి పరిసయ్యులలో కొందరు ఆయనతో, “గురువా, నీ శిష్యులను గద్దించు” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινες τῶν Φαρισαίων
  choice: పరిసయ్యులలో కొందరు
  rationale: τινες తో వచ్చిన భాగసూచక షష్ఠీ విభక్తి, పరిసయ్యులలో నిర్దిష్టంగా చెప్పని కొందరిని సూచిస్తుంది. ఈ తెలుగు రూపం ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: జనసమూహంలో ఉన్న
  rationale: ἀπό మూలం లేదా ఏ సమూహం నుంచి వచ్చారో సూచిస్తుంది; సందర్భంలో వారు జనసమూహంలో భాగంగా ఉన్నారని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: εἶπαν πρὸς αὐτόν
  choice: ఆయనతో ... అన్నారు
  rationale: ఇది సాధారణ కథన సంభాషణా సూత్రం; ఆధునిక ప్రామాణిక తెలుగులో సహజమైన రూపం.
- source_word: Διδάσκαλε
  choice: బోధకుడా
  rationale: διδάσκαλος యొక్క సంబోధన రూపం. బోధించే వ్యక్తి అనే ప్రధాన భావాన్ని నిలుపుతూ, అనవసరమైన అధిపత్య లేదా క్రీస్తు సంబంధిత భావాన్ని చేర్చదు.
- source_word: ἐπιτίμησον
  choice: గద్దించు
  rationale: తీవ్రంగా మందలించమనే ఆజ్ఞార్థక భావాన్ని వ్యక్తపరుస్తుంది; కేవలం ‘నిశ్శబ్దం చేయి’ అని సందర్భార్థాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: τοῖς μαθηταῖς σου
  choice: నీ శిష్యులను
  rationale: μαθητής లోని బోధకుడు-శిష్యుడు సంబంధాన్ని ‘శిష్యులు’ నిలుపుతుంది. తెలుగు క్రియ వాడుకకు అనుగుణంగా కర్మరూపం వాడబడింది.
theological_decisions:
- issue: యేసును సంబోధించే Διδάσκαλε అనే బిరుదు
  choice: బోధకుడా
  alternative: ప్రభువా / యజమానుడా
  rationale: ఇక్కడ పదం ప్రధానంగా బోధించే వ్యక్తిని సూచిస్తుంది; మూలపాఠం చెప్పేదానికంటే బలమైన అధికార లేదా క్రీస్తు సంబంధిత ఒప్పుకోలును అనువాదంలో చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా దాని సంబంధాలను స్పష్టంగా నిలిపింది.
