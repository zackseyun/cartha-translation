  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἀνὴρ ὀνόματι ⸀καλούμενος Ζακχαῖος, καὶ αὐτὸς ἦν ἀρχιτελώνης καὶ ⸀αὐτὸς πλούσιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/002.yaml
  text: And behold[a], a man named Zacchaeus; he was a chief tax collector and was rich.
translation:
  language: te
  text: ఇదిగో, జక్కయ్య అనే ఒక మనిషి ఉన్నాడు; అతడు ప్రధాన సుంకపు వసూలుదారుడు, ధనవంతుడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: కథనంలో పాఠకుని దృష్టిని కొత్త వ్యక్తిపై కేంద్రీకరించే లూకా ప్రయోగాన్ని సహజమైన తెలుగు సూచక పదంతో నిలిపింది.
- source_word: ἀνὴρ
  choice: ఒక మనిషి
  rationale: నిర్దిష్ట పురుష వ్యక్తిని సూచించే మూలపదానికి స్పష్టమైన, సహజమైన తెలుగు రూపం.
- source_word: ὀνόματι καλούμενος
  choice: అనే
  rationale: ‘పేరుతో పిలువబడే’ అనే గ్రీకు ప్రయోగానికి ఆధునిక తెలుగులో సహజమైన నామపరిచయ రూపం; అర్థాన్ని అనవసర పదబాహుళ్యం లేకుండా అందిస్తుంది.
- source_word: Ζακχαῖος
  choice: జక్కయ్య
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: αὐτὸς ἦν
  choice: అతడు
  rationale: విషయాన్ని తిరిగి ఎత్తిచూపే సర్వనామాన్ని సహజంగా వ్యక్తపరుస్తుంది; ‘అతడే’ అని అతిగా బలపరచదు.
- source_word: ἀρχιτελώνης
  choice: ముఖ్య సుంకపు వసూలుదారుడు
  rationale: ἀρχι-లోని నాయకత్వ లేదా ఉన్నతస్థాయి భావాన్ని ‘ముఖ్య’తో, τελώνης వృత్తిని సామాన్య పాఠకునికి స్పష్టంగా ‘సుంకపు వసూలుదారుడు’తో అందిస్తుంది.
- source_word: αὐτὸς πλούσιος
  choice: ధనవంతుడు కూడా
  rationale: πλούσιος యొక్క సంపద భావాన్ని నేరుగా తెలుపుతూ, పునరుక్త αὐτός వల్ల కనిపించే స్వల్ప అదనపు ఉద్ఘాటనను ‘కూడా’ సహజంగా ప్రతిబింబిస్తుంది.
