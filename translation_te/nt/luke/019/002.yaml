translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే కథన శైలి. మూలంలో లేని స్థలసూచక భావాన్ని చేర్చలేదు.
