  text: καὶ τοῖς παρεστῶσιν εἶπεν· Ἄρατε ἀπ’ αὐτοῦ τὴν μνᾶν καὶ δότε τῷ τὰς δέκα μνᾶς ἔχοντι—
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/024.yaml
  text: And he said to those standing by[a], ‘Take the mina from him and give it to the one who has the ten minas.’
translation:
  language: te
  text: మరియు ఆయన అక్కడ నిలబడి ఉన్నవారితో, “ఇతని దగ్గరనుండి ఆ మినాను[a] తీసుకుని, పది మినాలు ఉన్నవానికి ఇవ్వండి” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మినా అనేది ప్రాచీన ద్రవ్య యూనిట్; సాంప్రదాయకంగా దీనిని “పౌండు” అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς παρεστῶσιν
  choice: దగ్గర నిలబడి ఉన్నవారితో
  rationale: పక్కనే ఉండి నిలబడినవారిని సూచించే గ్రీకు కృదంతంలోని దృశ్యాత్మక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: Ἄρατε ἀπ’ αὐτοῦ
  choice: ఇతని దగ్గర నుంచి ... తీసుకుని
  rationale: αἴρω మరియు ἀπό కలిపి ఇక్కడ అతని అధీనంలోనుంచి దానిని తీసివేయడాన్ని సూచిస్తాయి; ఈ ఆజ్ఞ తెలుగులో సహజంగా వినిపించేలా అనువదించబడింది.
- source_word: τὴν μνᾶν
  choice: ఆ మినాను
  rationale: ముందుగా ప్రస్తావించిన నిర్దిష్ట నాణ్యపు మొత్తాన్ని గ్రీకు నిర్దేశక పదం సూచిస్తుంది. ప్రాచీన ద్రవ్య ప్రమాణాన్ని ఆధునిక నాణ్యంతో భర్తీ చేయకుండా ‘మినా’గా లిప్యంతరీకరించాం.
- source_word: δότε
  choice: ఇవ్వండి
  rationale: బదిలీ చేయమనే సరళమైన బహువచన ఆజ్ఞను నేరుగా తెలియజేస్తుంది.
- source_word: τῷ τὰς δέκα μνᾶς ἔχοντι
  choice: పది మినాలు ఉన్నవానికి
  rationale: లింగాన్ని అదనంగా చేర్చకుండా, గ్రీకులోని నామవాచకార్థక కృదంతాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: μνᾶ అనే ప్రాచీన ద్రవ్య ప్రమాణం అనువాదం
  choice: మినా
  alternative: పౌండు
  rationale: ‘మినా’ మూలంలోని ప్రాచీన ద్రవ్య ప్రమాణాన్ని చారిత్రకంగా నిలుపుతుంది; ‘పౌండు’ ఆధునిక లేదా ఖచ్చితమైన సమాన విలువను తప్పుగా సూచించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ఆజ్ఞలు బహువచన గౌరవ/సమూహ రూపంలో ఉన్నాయి; మూలంలో లేని లింగ సూచనను చేర్చలేదు.
