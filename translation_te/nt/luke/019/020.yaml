id: LUK.19.20
reference: Luke 19:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀ὁ ἕτερος ἦλθεν λέγων· Κύριε, ἰδοὺ ἡ μνᾶ σου ἣν εἶχον ἀποκειμένην ἐν σουδαρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/020.yaml
  text: And the other came[a], saying, ‘Lord, look, here is your mina, which I kept laid away in a cloth.’
translation:
  language: te
  text: 'ఆ మరొకడు వచ్చి ఇలా అన్నాడు: ‘ప్రభువా, ఇదిగో, నేను ఒక గుడ్డలో[b] దాచిపెట్టి ఉంచిన నీ మీనా[a].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మీనా’ అనేది ప్రాచీన కాలంలోని ద్రవ్య ప్రమాణం.
    reason: ప్రాచీన ద్రవ్య ప్రమాణంపై పాఠకునికి అవసరమైన వివరణ.
  - marker: b
    text: లేదా, ‘చేతి రుమాలులో.’ ఇక్కడి గ్రీకు పదం సాధారణంగా ముఖం లేదా చెమట తుడుచుకోవడానికి ఉపయోగించే గుడ్డను సూచిస్తుంది.
    reason: మూలపదంలోని మరింత నిర్దిష్టమైన అర్థ ప్రత్యామ్నాయాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: ὁ ἕτερος
  choice: ఆ మరొకడు
  rationale: నిర్దిష్ట సూచకంతో ఉన్న ఈ పదబంధం, ముందుగా వచ్చిన సేవకులకు భిన్నంగా ఇప్పుడు వస్తున్న మిగిలిన సేవకుణ్ణి సూచిస్తుంది. ‘ఆ మరొకడు’ ఆ వ్యత్యాసాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἦλθεν λέγων
  choice: వచ్చి … అన్నాడు
  rationale: గ్రీకు కృదంత నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు కథన శైలిలో వ్యక్తం చేస్తూ, రావడం తరువాత మాట్లాడడం అనే క్రమాన్ని నిలుపుతుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: ఇక్కడ ఉపమానంలోని అధిపతిని నేరుగా సంబోధిస్తున్నారు. ‘ప్రభువా’ κύριος పదానికి స్థిరమైన సమానార్థాన్ని ఇస్తూ, సందర్భంలోని గౌరవార్థక సంబోధనను కూడా కాపాడుతుంది.
- source_word: ἰδοὺ ἡ μνᾶ σου
  choice: ఇదిగో నీ మీనా
  rationale: ‘ఇదిగో’ శ్రద్ధను ఆకర్షిస్తూ వస్తువును చూపించే ἰδού భావాన్ని సహజంగా అందిస్తుంది. ‘మీనా’ ప్రాచీన ద్రవ్య ప్రమాణాన్ని తప్పుదారి పట్టించే ఆధునిక సమాన విలువతో మార్చకుండా లిప్యంతరీకరిస్తుంది.
- source_word: ἣν εἶχον ἀποκειμένην
  choice: దాన్ని నేను … దాచి ఉంచాను
  rationale: εἶχον మరియు ἀποκειμένην కలిపి తెలిపే కొనసాగిన భద్రపరిచిన స్థితిని ‘దాచి ఉంచాను’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν σουδαρίῳ
  choice: ఒక గుడ్డలో
  rationale: σουδάριον ముఖం లేదా చెమట తుడుచుకోవడానికి ఉపయోగించే చిన్న గుడ్డను సూచించవచ్చు. ప్రధాన పాఠ్యంలో విస్తృతమైన ‘గుడ్డ’ను వాడి, మరింత నిర్దిష్ట భావాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: ఉపమానంలో κύριος అనే సంబోధన
  choice: ప్రభువా
  alternative: అయ్యా / యజమానీ
  rationale: తక్షణ సందర్భంలో ఇది ఉపమానంలోని అధిపతికి చేసిన సంబోధనే అయినా, ‘ప్రభువా’ మూలపదానికి స్థిరమైన అనువాదాన్ని నిలుపుతూ దాని విస్తృత ప్రతిధ్వనిని ముందుగానే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ప్రాచీన ‘మీనా’ పదాన్ని నిలిపి వివరణ ఇచ్చాం; గుడ్డ స్వరూపాన్ని ప్రధాన పాఠ్యంలో అతిగా నిర్దిష్టం చేయకుండా పాదసూచికలో స్పష్టం చేశాం.
