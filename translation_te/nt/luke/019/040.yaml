id: LUK.19.40
reference: Luke 19:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀εἶπεν· Λέγω ὑμῖν, ⸀ὅτι ἐὰν οὗτοι ⸀σιωπήσουσιν, οἱ λίθοι ⸀κράξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/040.yaml
  text: And answering[a], he said, “I tell you, if these become silent, the stones will cry out.”
translation:
  language: te
  text: 'అందుకు ఆయన జవాబుగా ఇలా అన్నాడు: “నేను మీతో చెప్తున్నాను, వీరు మౌనమైతే[a], రాళ్లు కేకలు వేస్తాయి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిశ్శబ్దంగా ఉంటే” లేదా “మౌనంగా ఉండిపోతే.”
    reason: σιωπάω ఇక్కడ మాట్లాడడం ఆపడం, నిశ్శబ్దంగా ఉండడం, లేదా మౌనంగా కొనసాగడం అనే దగ్గరి భావాలను అనుమతిస్తుంది.
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: జవాబుగా ఇలా అన్నాడు
  rationale: గ్రీకులోని ‘జవాబిస్తూ/జవాబిచ్చి’ అనే కృదంత భావాన్నీ, ప్రధాన క్రియ అయిన ‘అన్నాడు’ అనే భావాన్నీ సహజమైన తెలుగులో కలిపి వ్యక్తం చేస్తుంది; స్పందన భావాన్ని కోల్పోకుండా అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: Λέγω ὑμῖν
  choice: నేను మీతో చెప్తున్నాను
  rationale: యేసు మాటలోని ప్రత్యక్షమైన, అధికారపూర్వక ఉద్ఘాటనను ఆధునిక సహజ తెలుగులో నిలుపుతుంది.
- source_word: οὗτοι
  choice: వీరు
  rationale: సందర్భంలోని శిష్యులను సూచించే సమీప సూచన సర్వనామాన్ని అలాగే ఉంచుతుంది; ‘ఈ ప్రజలు’ వంటి వివరణాత్మక పదాలను అదనంగా చేర్చదు.
- source_word: σιωπήσουσιν
  choice: మౌనమైతే
  rationale: ప్రస్తుతం స్తుతిస్తున్నవారు మాట్లాడడం ఆపే పరిస్థితిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది. గ్రీకు భవిష్యత్ రూపం షరతు వాక్యంలో ఉన్నందున తెలుగులో సహజమైన షరతు రూపాన్ని వాడింది.
- source_word: οἱ λίθοι
  choice: రాళ్లు
  rationale: λίθοι అనే స్పష్టమైన దృశ్యపదానికి నేరమైన తెలుగు సమానం; గ్రీకు నిర్దిష్ట ఉపపదాన్ని తెలుగులో విడిగా చూపడం సహజం కాదు.
- source_word: κράξουσιν
  choice: కేకలు వేస్తాయి
  rationale: బిగ్గరగా అరవడం లేదా మొరపెట్టడం అనే κράζω పదబలాన్ని, ఈ సజీవ ప్రవచనాత్మక చిత్రంలో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: రాళ్లు కేకలు వేయడం అలంకారమా, అద్భుత సాధ్యతా, లేక సృష్టి సాక్ష్యమా అని స్పష్టీకరించాలా?
  choice: ‘రాళ్లు కేకలు వేస్తాయి’ అనే యథార్థ చిత్రాన్ని వివరణ లేకుండా నిలుపడం.
  alternative: ‘సృష్టే దేవుణ్ణి స్తుతిస్తుంది’ లేదా ‘రాళ్లు సాక్ష్యమిస్తాయి’ అని భావార్థాన్ని స్పష్టీకరించడం.
  rationale: గ్రీకు వాక్యం ఈ బలమైన చిత్రాన్ని వ్యాఖ్యానించకుండా ఇస్తుంది. దాన్ని అలాగే ఉంచడం వల్ల అతిశయోక్తి, ప్రవచనాత్మక చిత్రం, అద్భుత సాధ్యత అనే భావాల మధ్యనున్న ఉద్దేశపూర్వక ఉద్వేగం పరిష్కరించబడకుండా నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవభరితమైన శైలిని వాడింది. ‘జవాబుగా ఇలా అన్నాడు’ గ్రీకు నిర్మాణంలోని స్పందన భావాన్ని నిలుపుతుంది; ‘రాళ్లు కేకలు వేస్తాయి’ అనే పదునైన చిత్రాన్ని మృదువుపరచలేదు. పాదసూచిక గుర్తు [a] సంబంధిత పదబంధం వెంట ప్రధాన పాఠ్యంలో ఉంచబడింది.
