  yaml_path: translation/nt/luke/019/004.yaml
  text: So he ran on ahead and climbed up into a sycamore tree so that he might see him[a], because he was about to pass that way.
translation:
  language: te
  text: అతడు ముందుకు పరుగెత్తి, యేసును చూడాలని ఒక మేడి చెట్టు[a] ఎక్కాడు; ఎందుకంటే యేసు ఆ దారిన వెళ్లబోతున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత నిర్దిష్టంగా, ‘సికమోర్ అత్తి చెట్టు’; ఇది అత్తి జాతికి చెందిన చెట్టు.
    reason: lexical_alternative
lexical_decisions:
- source_word: προδραμὼν εἰς τὸ ἔμπροσθεν
  choice: ముందుకు పరుగెత్తి
  rationale: పరుగెత్తి ఇతరులకంటే ముందున్న చోటుకు చేరడమనే సంయుక్త భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀνέβη ἐπὶ
  choice: ఎక్కాడు
  rationale: చెట్టు సందర్భంలో పైకి ఎక్కడాన్ని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: συκομορέαν
  choice: మేడి చెట్టు
  rationale: Ficus sycomorus అనే అత్తి జాతి చెట్టుకు తెలుగు బైబిలు వాడుకలో పరిచితమైన పేరు; వృక్షశాస్త్రపరమైన మరింత నిర్దిష్టతను పాదసూచికలో ఉంచాం.
- source_word: ἵνα ἴδῃ αὐτόν
  choice: యేసును చూడాలని
  rationale: ἵναతో వ్యక్తమయ్యే ఉద్దేశాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; సర్వనామానికి బదులుగా యేసు పేరును వాడడం తెలుగు కథనంలో సూచనను స్పష్టం చేస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: జక్కయ్య చెట్టు ఎక్కడానికి కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: ἐκείνης
  choice: ఆ దారిన
  rationale: గ్రీకులో అధ్యాహారంగా ఉన్న దారి లేదా మార్గం భావాన్ని అతిగా నిర్దిష్టం చేయకుండా సహజంగా అందిస్తుంది.
- source_word: ἤμελλεν διέρχεσθαι
  choice: వెళ్లబోతున్నాడు
  rationale: త్వరలో ఆ మార్గం గుండా వెళ్లనున్నాడనే సమీప భవిష్యత్తు భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
