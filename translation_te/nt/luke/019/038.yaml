source:
  edition: SBLGNT
  text: λέγοντες· Εὐλογημένος ὁ ἐρχόμενος ⸀βασιλεὺς ἐν ὀνόματι κυρίου· ⸂ἐν οὐρανῷ εἰρήνη⸃ καὶ δόξα ἐν ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/038.yaml
  text: saying[b][a], “Blessed is the King who comes in the name of the Lord! Peace in heaven and glory in the highest!”
translation:
  language: te
  text: 'వారు ఇలా అన్నారు: “ప్రభువు నామంలో వస్తున్న రాజు ధన్యుడు![a] పరలోకంలో శాంతి, అత్యున్నత స్థలాల్లో మహిమ!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని అనువాదాలు, “ప్రభువు నామంలో వచ్చేవాడు ధన్యుడు” అనే మరింత సుపరిచితమైన రూపాన్ని అనుసరిస్తాయి; అయితే ఇక్కడి గ్రీకు పాఠంలో “రాజు” అనే పదం స్పష్టంగా ఉంది.
    reason: alternative_reading
  - marker: b
    text: ఇది లూకా 2:14ను ప్రతిధ్వనిస్తుంది; అయితే అక్కడ “భూమిమీద శాంతి” అని ఉండగా, ఇక్కడ “పరలోకంలో శాంతి” అని ఉంది.
    reason: cross_reference
lexical_decisions:
- source_word: λέγοντες
  choice: వారు ఇలా అన్నారు
  rationale: ముందటి వచనంలోని జనసమూహపు చర్యతో సంబంధాన్ని కొనసాగిస్తూ, వర్తమాన క్రియావిశేషణాన్ని ఆధునిక తెలుగులో సహజమైన ఉక్తి-పరిచయంగా వ్యక్తపరుస్తుంది.
- source_word: Εὐλογημένος
  choice: ధన్యుడు
  rationale: కీర్తనాత్మక ఆశీర్వచన ధ్వనిని, విజయప్రవేశ సందర్భంలోని గంభీరతను కాపాడే సుపరిచితమైన తెలుగు పదం.
- source_word: ὁ ἐρχόμενος
  choice: వస్తున్న
  rationale: వర్తమాన క్రియావిశేషణ భావాన్ని నిలుపుతూ, ‘రాజు’ను సహజంగా విశేషిస్తుంది; ‘రాబోవువాడు’ వంటి అధిక వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: βασιλεὺς
  choice: రాజు
  rationale: లూకా పాఠంలో ఉన్న స్పష్టమైన రాజరిక సూచనను తొలగించకుండా నిలుపుతుంది.
- source_word: ἐν ὀνόματι κυρίου
  choice: ప్రభువు నామంలో
  rationale: సెమిటిక్ నేపథ్యమున్న మూల నుడికారాన్ని కాపాడుతూ, ప్రభువు అధికారంతో లేదా ఆయన ప్రతినిధిగా రావడం అనే భావవిస్తృతిని ఒక్క అర్థానికి పరిమితం చేయదు.
- source_word: ἐν οὐρανῷ εἰρήνη
  choice: పరలోకంలో శాంతి
  rationale: క్రియలేని సంక్షిప్త జయధ్వని రూపాన్ని నిలుపుతుంది; ‘భూమిమీద శాంతి’గా సమన్వయం చేయకుండా మూలంలోని ‘పరలోకంలో’ అనే స్థానాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: δόξα ἐν ὑψίστοις
  choice: అత్యున్నత స్థలాల్లో మహిమ
  rationale: ὑψίστοις అనే బహువచన స్థానార్థక నుడికారాన్ని సహజమైన తెలుగులో ప్రతిబింబిస్తూ, లూకా 2:14తో ఉన్న ప్రతిధ్వనిని కాపాడుతుంది.
theological_decisions:
- issue: విజయప్రవేశంలోని రాజరిక లేదా మెస్సీయ సంబంధిత జయధ్వని
  choice: βασιλεὺς పదాన్ని స్పష్టంగా ‘రాజు’ అని అనువదించడం
  alternative: ‘ప్రభువు నామంలో వచ్చేవాడు ధన్యుడు’ అని మాత్రమే అనువదించడం
  rationale: మూలపాఠంలో రాజు అనే పదం ఉంది. దానిని నిలుపడం లూకా ఉద్దేశించిన రాజరిక ప్రాధాన్యాన్ని కాపాడుతుంది; అయితే ‘మెస్సీయ’ వంటి వివరణాత్మక పదాన్ని అదనంగా చేర్చదు.
- issue: లూకా 2:14తో సంబంధం
  choice: ‘పరలోకంలో శాంతి’ అని మూలపాఠానుసారం అనువదించడం
  alternative: ‘భూమిమీద శాంతి’ అని లూకా 2:14తో సమన్వయం చేయడం
  rationale: ఈ వచనంలో స్థలం స్పష్టంగా పరలోకం. అందువల్ల లూకా 2:14తో ఉన్న ప్రతిధ్వనినీ, స్థానభేదం వల్ల ఏర్పడే భావ ఉద్రిక్తతనూ యథాతథంగా ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, అయితే జయధ్వనికి తగిన గంభీరతతో అనువదించబడింది. ‘ప్రభువు,’ ‘ధన్యుడు,’ ‘మహిమ’ వంటి విస్తృతంగా అర్థమయ్యే బైబిలు పదజాలాన్ని ఉపయోగించగా, పాతకాలపు క్రియారూపాలు మరియు మతశాఖ-ప్రత్యేక పదప్రయోగాలు నివారించబడ్డాయి.
