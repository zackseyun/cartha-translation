id: LUK.19.22
reference: Luke 19:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀λέγει αὐτῷ· Ἐκ τοῦ στόματός σου κρίνω σε, πονηρὲ δοῦλε· ᾔδεις ὅτι ἐγὼ ἄνθρωπος αὐστηρός εἰμι, αἴρων ὃ οὐκ ἔθηκα καὶ θερίζων ὃ οὐκ ἔσπειρα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/022.yaml
  text: He said to him[a], ‘Out of your own mouth I will judge you, wicked servant. You knew that I am a harsh man[d][c][b], taking up what I did not lay down and reaping what I did not sow?’
translation:
  language: te
  text: 'అతడు అతనితో ఇలా అన్నాడు: “దుష్ట దాసుడా! నీ నోటి మాటనుబట్టే నీకు తీర్పు తీరుస్తాను.[a] నేను పెట్టనిదాన్ని తీసుకునే, విత్తనిదాన్ని కోసే కఠినమైన మనిషినని నీకు తెలుసు కదా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నీ సొంత మాటలతోనే నీకు తీర్పు తీరుస్తాను.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκ τοῦ στόματός σου
  choice: నీ నోటి మాటనుబట్టే
  rationale: గ్రీకు నుడికారంలోని ‘నీ నోటినుంచి’ అనే చిత్రాన్ని నిలుపుతూ, ఆ దాసుడు పలికిన మాటలే తీర్పుకు ఆధారమని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: κρίνω σε
  choice: నీకు తీర్పు తీరుస్తాను
  rationale: భవిష్యత్ సూచనను నిలుపుతుంది; సందర్భం శిక్షాత్మకమైనప్పటికీ, ‘ఖండిస్తాను’ అని అర్థాన్ని అనవసరంగా సంకుచితం చేయదు.
- source_word: πονηρὲ δοῦλε
  choice: దుష్ట దాసుడా
  rationale: ‘దుష్ట’ నైతిక నిందను స్పష్టంగా తెలియజేస్తుంది. ‘దాసుడు’ యజమాని ఆధీనంలోని సామాజిక స్థితిని సూచిస్తూ, తెలుగులో గౌరవప్రదమైన గ్రంథశైలికి సహజంగా ఉంటుంది.
- source_word: αὐστηρός
  choice: కఠినమైన
  rationale: ఇక్కడ దాసుడు యజమానికి ఆపాదించిన కఠోరమైన, అధికంగా కోరే స్వభావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αἴρων ὃ οὐκ ἔθηκα
  choice: నేను పెట్టనిదాన్ని తీసుకునేవాడిని
  rationale: ‘పెట్టడం/ఉంచడం’ మరియు ‘తీసుకోవడం’ అనే గ్రీకు క్రియల విస్తృత భావాన్ని నిలుపుతుంది; దీనిని తప్పనిసరిగా సాంకేతిక ఆర్థిక ‘డిపాజిట్’గా పరిమితం చేయదు.
- source_word: θερίζων ὃ οὐκ ἔσπειρα
  choice: విత్తనిదాన్ని కోసుకునేవాడిని
  rationale: వ్యవసాయ రూపకాన్ని నిలుపుతూ, గ్రీకులో ఉన్న ‘ఎక్కడ’ కాక ‘దేన్ని/దానిని’ అనే కర్మార్థ సంబంధాన్ని ప్రతిబింబిస్తుంది.
- source_word: ᾔδεις ὅτι
  choice: తెలుసు కదా?
  rationale: యజమాని దాసుని సొంత వాదనను అతనిపైనే ప్రయోగిస్తున్న ప్రశ్నార్థక, వాక్చాతుర్య ధోరణిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఉపమానంలోని δοῦλος పదం సామాజిక స్థితిని ఎలా చూపించాలి
  choice: దాసుడు
  alternative: బానిస
  rationale: ఈ సందర్భంలో యజమాని ఆధీనస్థితి స్పష్టమైనా, ‘దాసుడు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి మూలపదంలోని సేవకుడు/బానిస భావవిస్తృతిని పూర్తిగా ఒకే దిశగా కుదించదు.
- issue: యజమాని తనను ‘కఠినమైన మనిషి’గా చెప్పడం వాస్తవ నిర్ధారణా, లేక దాసుని మాటను వాక్చాతుర్యంగా తిరిగి ప్రయోగించడమా
  choice: మూలంలోని ప్రత్యక్ష ‘నీకు తెలుసు కదా?’ రూపాన్ని నిలుపడం
  alternative: ‘నేను కఠినుడినని నువ్వు అంటున్నావు కదా?’ అని వ్యాఖ్యానాత్మకంగా విస్తరించడం
  rationale: వాక్యం దాసుని ముందరి మాటను అతనిపైనే ప్రయోగిస్తున్నట్టు సందర్భం సూచించినా, మూలం స్పష్టంగా జోడించని ‘నువ్వు అంటున్నావు’ అనే వ్యాఖ్యను ప్రధాన పాఠ్యంలో చేర్చలేదు. అందువల్ల యజమాని స్వభావంపై ఉన్న వ్యాఖ్యాన ఉద్రిక్తత నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరత కలిగిన ప్రత్యక్ష సంభాషణ వాడబడింది. ‘దుష్ట దాసుడా’ అనే సంబోధన మూలంలోని నైతిక నిందను, ఆధీన సంబంధాన్ని నిలుపుతుంది. చివరి ప్రశ్నార్థక రూపం గ్రీకు వాక్యంలోని వాక్చాతుర్య బలాన్ని సహజంగా అందిస్తుంది.
