  to: 'అతడు అతనితో ఇలా అన్నాడు: “దుష్ట దాసుడా! నీ నోటి మాటనుబట్టే నీకు తీర్పు తీరుస్తాను.[a] నేను పెట్టనిదాన్ని తీసుకునే, విత్తనిదాన్ని కోసే కఠినమైన మనిషినని నీకు తెలుసు కదా?”'
  rationale: ప్రధాన పాఠ్యంలోని చివరి భాగాన్ని మాత్రమే సవరించాం. దీనివల్ల αἴρων మరియు θερίζων యొక్క కొనసాగుతున్న విశేషణాత్మక భావం, అలాగే రెండు సంబంధ వాక్యాల సమాంతరత నిలిచి, తెలుగు వాక్యం మరింత సహజంగా మారింది. ప్రశ్నార్థక వాక్యరూపం మూలపాఠంలోని ప్రశ్నచిహ్నానికి, సందర్భంలోని వాక్చాతుర్యానికి తగినదే. ఫుట్‌నోట్ గుర్తు మరియు పాఠ్యం యథాతథంగా సరైన చోట ఉన్నాయి.
