  text: And he said to this one also[a], ‘And you, be over five cities.’
translation:
  language: te
  text: అతడు అతనితో కూడా, “నీవు కూడా ఐదు పట్టణాలపై అధికారిగా ఉండు[a]” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఐదు పట్టణాలపై అధికారం కలిగి ఉండు”; లేదా, “ఐదు పట్టణాలపై నియమించబడుము.”
    reason: ἐπάνω γίνου అనే పదబంధం అధికార స్థానంలో ఉండడం, అధికారాన్ని కలిగి ఉండడం, లేదా ఆ స్థానానికి నియమించబడడం అనే భావాలను సందర్భానుసారం సూచించవచ్చు.
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: అన్నాడు
  rationale: సాధారణ కథన సంభాషణలో εἶπενను ‘అన్నాడు’ అని సహజంగా అనువదించవచ్చు; δέ ఇక్కడ స్వల్ప కథన అనుసంధానాన్ని చూపుతుంది, దానిని తెలుగు వాక్యప్రవాహంలో ప్రత్యేక పదం లేకుండానే వ్యక్తం చేయవచ్చు.
- source_word: καὶ τούτῳ
  choice: ఇతనితో కూడా
  rationale: τούτῳలోని సూచనార్థాన్ని ‘ఇతనితో’ నిలుపుతూ, καίలోని ‘కూడా’ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: Καὶ σὺ
  choice: నీవు కూడా
  rationale: వ్యక్తిగత సంబోధనలోని ఉద్ఘాటనను, ముందటి సేవకునితో ఉన్న సమాంతరతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐπάνω γίνου
  choice: మీద అధికారిగా ఉండు
  rationale: ἐπάνωతో కూడిన γίνου ఇక్కడ అధికార స్థానంలో నియామకాన్ని సూచిస్తుంది. ‘అధికారిగా ఉండు’ అనేది కేవలం స్థానాన్ని కాక పాలనా బాధ్యతను కూడా సహజంగా తెలియజేస్తుంది.
- source_word: πέντε πόλεων
  choice: ఐదు పట్టణాల
  rationale: πόλιςకు సందర్భానుకూలమైన ఆధునిక తెలుగు పదం ‘పట్టణం’; షష్ఠీ విభక్తి అధికార పరిధిని సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు మూలంలోని సూచనార్థం, ‘కూడా’ అనే సమాంతర భావం, అధికార నియామక సూచన నిలుపబడ్డాయి.
