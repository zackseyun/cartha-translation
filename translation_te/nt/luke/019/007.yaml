id: LUK.19.7
reference: Luke 19:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδόντες πάντες διεγόγγυζον λέγοντες ὅτι Παρὰ ἁμαρτωλῷ ἀνδρὶ εἰσῆλθεν καταλῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/007.yaml
  text: And when they all saw it[a], they began to grumble, saying, “He has gone in to stay with a sinful man.”
translation:
  language: te
  text: అది చూసిన వారందరూ, “పాపి అయిన ఒక మనిషి దగ్గర బస చేయడానికి ఈయన లోపలికి వెళ్లాడు” అని సణుగుకోవడం మొదలుపెట్టారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: అది చూసిన
  rationale: అఒరిస్ట్ కృదంతాన్ని సందర్భానుసారమైన కాలార్థంతో సహజ తెలుగులో ఇచ్చాం. ‘అది’ అనేది యేసు జక్కయ్యతో వెళ్లడాన్ని సూచిస్తూ సందర్భం నుంచి పూరించబడింది.
- source_word: πάντες
  choice: వారందరూ
  rationale: జనసమూహంలోని అందరి ప్రతిస్పందనను గ్రీకు పదంలోని సమగ్ర భావానికి అనుగుణంగా స్పష్టంగా నిలుపుతుంది.
- source_word: διεγόγγυζον
  choice: సణుగుకోవడం మొదలుపెట్టారు
  rationale: అసంతృప్తితో గొణిగే భావాన్ని, అలాగే ఇంపర్ఫెక్ట్ క్రియలో సాధ్యమైన ఆరంభ/కొనసాగింపు ఛాయను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λέγοντες
  choice: అని
  rationale: వారి సణుగుడు విషయాన్ని ప్రత్యక్ష వాక్యంగా సహజ తెలుగు నిర్మాణంలో పరిచయం చేస్తుంది.
- source_word: παρὰ ἁμαρτωλῷ ἀνδρὶ
  choice: పాపాత్ముడైన ఒక మనిషి ఇంట్లో
  rationale: ἁμαρτωλῷ అనే విశేషణాన్నీ ἀνδρί అనే పురుషవాచక నామాన్నీ నిలుపుతూ, παρά దత్తివిభక్తి ఇక్కడ సూచించే వ్యక్తి వద్ద/ఇంట్లో బస అనే సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰσῆλθεν
  choice: వెళ్లాడు
  rationale: జక్కయ్య ఇంటిలోకి ప్రవేశించడానికి వెళ్లిన చర్యను తెలుగు ఫిర్యాదు వాక్యంలో సహజంగా తెలుపుతుంది; ‘ఇంట్లో’తో కలిపి ప్రవేశ భావం స్పష్టమవుతుంది.
- source_word: καταλῦσαι
  choice: బస చేయడానికి
  rationale: ఇక్కడ అతిథిగా ఉండడం లేదా తాత్కాలికంగా బస చేయడం అనే అర్థాన్ని, ‘రాత్రి గడపడం’ అనే అవసరానికి మించిన నిర్దిష్టత లేకుండా అందిస్తుంది.
theological_decisions:
- issue: జక్కయ్యను జనసమూహం వర్ణించిన తీరు
  choice: పాపాత్ముడైన ఒక మనిషి
  alternative: పాపి
  rationale: గ్రీకులోని విశేషణం + పురుషవాచక నామం నిర్మాణాన్ని నిలుపుతుంది. ఇది జనసమూహపు తృణీకార తీర్పును తెలియజేస్తుంది గాని అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన వచనం. ‘సణుగుకోవడం’ అసంతృప్తితో కూడిన మర్మరాన్ని సూచిస్తుంది; ‘బస చేయడం’ καταλῦσαι యొక్క అతిథిగా ఉండే భావాన్ని సహజంగా అందిస్తుంది.
