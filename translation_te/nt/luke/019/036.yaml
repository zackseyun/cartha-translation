  edition: SBLGNT
  text: πορευομένου δὲ αὐτοῦ ὑπεστρώννυον τὰ ἱμάτια ⸀ἑαυτῶν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/036.yaml
  text: And as he went[a], they were spreading their cloaks on the road.
translation:
  language: te
  text: ఆయన వెళ్తుండగా, వారు తమ పైవస్త్రాలను దారిపై పరుస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορευομένου δὲ αὐτοῦ
  choice: ఆయన వెళ్తుండగా
  rationale: వర్తమానకాల మధ్యమ కృదంతంతో ఉన్న genitive absolute, ప్రధాన క్రియతో సమకాలంలో జరుగుతున్న చర్యను సూచిస్తుంది. ‘వెళ్తుండగా’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δέ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప కథన సంధానంగా పనిచేస్తుంది. తెలుగు వాక్య నిర్మాణంలో ‘-గా’తో ముందరి సందర్భానికి సహజంగా అనుసంధానం కలుగుతుంది; ‘మరియు’ చేర్చితే కృత్రిమంగా ఉంటుంది.
- source_word: ὑπεστρώννυον
  choice: పరుస్తూ వచ్చారు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న లేదా పునరావృతమవుతున్న చర్యను చూపుతుంది. ‘పరుస్తూ వచ్చారు’ ఆ దృశ్యంలోని కొనసాగింపును సహజంగా తెలియజేస్తుంది.
- source_word: τὰ ἱμάτια ἑαυτῶν
  choice: తమ పైవస్త్రాలను
  rationale: ἱμάτια సాధారణంగా వస్త్రాలను, సందర్భానుసారంగా వెలుపల ధరించే వస్త్రాలను సూచిస్తుంది. దారిపై పరచే ఈ సందర్భంలో ‘పైవస్త్రాలు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: ἐν τῇ ὁδῷ
  choice: దారిపై
  rationale: ἐν తో దత్తివిభక్తి ఇక్కడ స్థలాన్ని సూచిస్తుంది. వస్త్రాలను ప్రయాణ మార్గం మీద పరచడాన్ని తెలుగులో ‘దారిపై’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. గ్రీకు అసంపూర్ణ భూతకాలంలోని కొనసాగింపు భావాన్ని నిలిపి ఉంచింది.
