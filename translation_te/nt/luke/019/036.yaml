revisions:
- from: ఆయన వెళ్తుండగా, వారు తమ పైవస్త్రాలను దారిపై పరుస్తూ వచ్చారు.
  to: ఆయన వెళ్తుండగా, వారు తమ పైవస్త్రాలను దారిపై పరుస్తూ ఉన్నారు.
  rationale: Replacing ‘పరుస్తూ వచ్చారు’ with ‘పరుస్తూ ఉన్నారు’ preserves the progressive force of the imperfect while avoiding the added sense of coming along. No footnote is necessary in Telugu for this verse.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T01:18:05Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the temporal genitive absolute ('ఆయన వెళ్తుండగా'), the reflexive possession ('తమ'), the outer garments ('పైవస్త్రాలను'), and the location ('దారిపై'). However, 'పరుస్తూ వచ్చారు' adds the idea that the people themselves came along while spreading the garments, which is not expressed by ὑπεστρώννυον.
  naturalness: The revised wording is natural modern standard Telugu and retains the Greek imperfect's ongoing scene without introducing an additional motion event.
  terminology: ‘పైవస్త్రాలు’ is an appropriate contextual rendering of ἱμάτια. No theological terminology is involved. The mild connective δέ may be left implicit in idiomatic Telugu.
  issues:
  - severity: medium
    issue: ‘పరుస్తూ వచ్చారు’ introduces an unexpressed motion nuance.
    rationale: The Greek imperfect ὑπεστρώννυον means that they were spreading/laying down their garments. It does not say that they were coming along; ‘వచ్చారు’ therefore expands the event beyond the source.
  revised_text: ఆయన వెళ్తుండగా, వారు తమ పైవస్త్రాలను దారిపై పరుస్తూ ఉన్నారు.
  revised_footnotes: []
  revision_rationale: Replacing ‘పరుస్తూ వచ్చారు’ with ‘పరుస్తూ ఉన్నారు’ preserves the progressive force of the imperfect while avoiding the added sense of coming along. No footnote is necessary in Telugu for this verse.
