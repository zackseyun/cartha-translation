  - severity: low
    issue: Less idiomatic passive expression for concealment
    rationale: ‘నీ కళ్లకు మరుగుచేయబడ్డాయి’ is understandable but stiff. ‘నీ కళ్ల నుండి దాచబడ్డాయి’ is natural Telugu and faithfully conveys ἀπὸ ὀφθαλμῶν σου while preserving the agentless passive.
