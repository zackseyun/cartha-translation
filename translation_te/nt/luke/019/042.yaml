id: LUK.19.42
reference: Luke 19:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγων ὅτι Εἰ ἔγνως ⸂ἐν τῇ ἡμέρᾳ ταύτῃ καὶ σὺ⸃ τὰ πρὸς ⸀εἰρήνην— νῦν δὲ ἐκρύβη ἀπὸ ὀφθαλμῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/042.yaml
  text: saying[a], “If you had known on this day, even you[c][b], the things that make for peace—but now they have been hidden from your eyes.”
translation:
  language: te
  text: ఇలా అంటూ, “ఈ రోజున నీవైనా శాంతికి దారితీసే వాటిని[b] తెలుసుకొని ఉంటే—కానీ ఇప్పుడు అవి నీ కళ్ల నుండి దాచబడ్డాయి.”[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ రోజున నీవైనా శాంతికి దారితీసే వాటిని తెలుసుకొని ఉంటే ఎంత బాగుండేది!” గ్రీకులో షరతు వాక్యానికి రావలసిన ఫలితభాగం చెప్పకుండా విడిచిపెట్టబడింది.
    reason: lexical_alternative
  - marker: b
    text: ‘శాంతికి దారితీసే వాటిని’—గ్రీకులో అక్షరార్థంగా ‘శాంతి వైపున్న విషయాలను’; అంటే శాంతికి సంబంధించిన లేదా శాంతికి నడిపించే విషయాలను.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకు క్రియ రూపం ఏకవచనంలో ఉంది. అందువల్ల భావపరంగా “కానీ ఇప్పుడు అది నీ కళ్ల నుండి దాచబడింది” అని కూడా అనువదించవచ్చు; ఇక్కడ ముందున్న ‘వాటిని’ సూచిస్తూ బహువచనంగా అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: ఇలా అంటూ
  rationale: వర్తమాన కృదంత రూపాన్ని నిలిపి, ముందున్న కథన వాక్యంతో దీని అనుసంధానాన్ని సహజమైన తెలుగులో చూపిస్తుంది.
- source_word: Εἰ ἔγνως
  choice: తెలుసుకొని ఉంటే—!
  rationale: ఇది నెరవేరని షరతుతో కూడిన విలాపం. గ్రీకులో ఫలిత వాక్యం చెప్పకుండా ఆపివేయబడిన భావోద్వేగ నిర్మాణాన్ని డాష్, ఆశ్చర్యార్థకం ద్వారా నిలిపి ఉంచుతుంది; మూలంలో లేని ‘ఎంత బాగుండేది’ వంటి మాటలను ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: ఈ రోజున
  rationale: కాలాన్ని సూచించే ఈ పదబంధానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: καὶ σὺ
  choice: నీవైనా
  rationale: యెరూషలేమును నేరుగా ఉద్దేశించిన విలాపంలోని ఒత్తిడిని, ఆశ్చర్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὰ πρὸς εἰρήνην
  choice: శాంతికి దారితీసే వాటిని
  rationale: అక్షరార్థంగా ‘శాంతి వైపున్న విషయాలు’; శాంతికి సంబంధించినవి లేదా శాంతికి నడిపించేవి అనే భావాన్ని, బహువచన స్వరూపాన్ని కాపాడుతూ స్పష్టంగా తెలుపుతుంది.
- source_word: εἰρήνην
  choice: శాంతి
  rationale: ఈ సందర్భంలోని సమాధానం, క్షేమం, రాబోయే తీర్పును తప్పించే మార్గం వంటి భావవిస్తృతిని ముందుగానే ఒకే వివరణకు పరిమితం చేయని సాధారణ సమానార్థకం.
- source_word: νῦν δὲ
  choice: కానీ ఇప్పుడు
  rationale: తెలుసుకోవలసిన అవకాశం మరియు ప్రస్తుత మరుగుదల మధ్య ఉన్న తీవ్రమైన వ్యత్యాసాన్ని చూపిస్తుంది.
- source_word: ἐκρύβη
  choice: అవి ... మరుగుచేయబడ్డాయి
  rationale: గ్రీకు క్రియ ఏకవచనంలో ఉన్నప్పటికీ, దాని భావసంబంధ అంశం ముందున్న నపుంసక బహువచన పదబంధం. తెలుగులో ఆ సంబంధాన్ని స్పష్టంగా ఉంచేందుకు ‘అవి’ వాడబడింది; కర్మణి రూపం కూడా నిలుపబడింది.
- source_word: ἀπὸ ὀφθαλμῶν σου
  choice: నీ కళ్లకు
  rationale: చూడటం ద్వారా గ్రహించడం అనే మూలంలోని రూపకాన్ని సహజమైన తెలుగు నుడికారంలో నిలుపుతుంది.
theological_decisions:
- issue: షరతుతో కూడిన విలాపం మరియు చెప్పకుండా విడిచిన ఫలిత వాక్యం
  choice: ‘తెలుసుకొని ఉంటే—!’ అని అసంపూర్ణ నిర్మాణాన్ని నిలుపుట
  alternative: ‘తెలుసుకొని ఉంటే ఎంత బాగుండేది!’
  rationale: సందర్భంలో ‘అయ్యో, తెలుసుకొని ఉంటే బాగుండేది’ అనే విలాపభావం ఉన్నప్పటికీ, గ్రీకు పాఠ్యంలో ఫలిత వాక్యం వ్యక్తంగా లేదు. అందువల్ల భావోద్వేగ ఒత్తిడిని చూపిస్తూ, చెప్పని విషయాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: ἐκρύβη యొక్క భావసంబంధ అంశం
  choice: మరుగుచేయబడినవి ‘శాంతికి దారితీసే విషయాలు’ అని బహువచనంగా స్పష్టం చేయుట
  alternative: ‘అది నీ కళ్లకు మరుగైంది’ అనే భావ ఏకవచనం
  rationale: గ్రీకులో నపుంసక బహువచన అంశంతో ఏకవచన క్రియ రావచ్చు. ముందున్న τὰ πρὸς εἰρήνην తో సంబంధమే సందర్భపరంగా బలమైనది; తెలుగు పాఠకునికి ఆ సంబంధం అస్పష్టంగా కాకుండా ‘అవి’ అని ఇచ్చాం.
- issue: కర్మణి ప్రయోగంలో కార్యనిర్వాహకుడు చెప్పబడకపోవడం
  choice: ‘మరుగుచేయబడ్డాయి’ అని కర్మణి రూపాన్ని ఉంచి, ఎవరు మరుగుచేశారో చెప్పకపోవడం
  alternative: దేవుడే వాటిని మరుగుచేశాడని స్పష్టీకరించడం లేదా అవే మరుగయ్యాయని అకర్మకంగా అనువదించడం
  rationale: మూలపాఠ్యం కార్యనిర్వాహకుణ్ణి పేర్కొనదు. దేవుని కార్యం కావచ్చనే సూచనను తొలగించకుండానే, దానిని అనువాదంలో నిర్ధారించకుండా నిజమైన అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకునికి అర్థమయ్యే శైలి. ‘నీవైనా’ విలాపంలోని ఒత్తిడిని మోస్తుంది. డాష్‌తో అసంపూర్ణ షరతు నిర్మాణాన్ని ఉద్దేశపూర్వకంగా నిలిపి, మూలంలోని భావోద్వేగ విరామాన్ని కాపాడాం. ‘మరుగుచేయబడ్డాయి’ అనే కర్మణి రూపం కార్యనిర్వాహకుని గురించిన మూలంలోని మౌనాన్ని అలాగే ఉంచుతుంది.
