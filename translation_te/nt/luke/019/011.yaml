revisions:
- from: వారు ఈ మాటలు వింటుండగా, ఆయన ఇంకొక ఉపమానం చెప్పారు. ఎందుకంటే ఆయన యెరూషలేముకు దగ్గరగా ఉన్నాడు; అంతేకాక, దేవుని రాజ్యం వెంటనే ప్రత్యక్షం కాబోతుందని వారు అనుకున్నారు.[a]
  to: వారు ఈ మాటలు వింటుండగా, ఆయన ఇంకా ఒక ఉపమానం చెప్పారు; ఆయన యెరూషలేముకు దగ్గరగా ఉన్నందున, దేవుని రాజ్యం వెంటనే ప్రత్యక్షం కాబోతుందని వారు అనుకున్నందున ఇలా చెప్పారు.[a]
  rationale: “ఇంకొక ఉపమానం” స్థానంలో “ఇంకా ఒక ఉపమానం” వాడడం ద్వారా ప్రసంగాన్ని కొనసాగిస్తూ ఉపమానం చెప్పాడనే προσθεὶς εἶπεν భావం నిలుస్తుంది; అంతకుముందు ఉపమానం ఉందని అనవసరంగా సూచించదు. రెండు “-నందున” కారణవాచక పదబంధాలు గ్రీకులో సమన్వయంగా ఉన్న కారణాలను స్పష్టంగా ప్రతిబింబిస్తాయి. రాజ్యం ప్రత్యక్షమయ్యే విధానాన్ని నిర్దిష్టీకరించకుండా మూలంలోని ఉద్దేశపూర్వక అస్పష్టత కాపాడబడింది.
