source:
  edition: SBLGNT
  text: Ἀκουόντων δὲ αὐτῶν ταῦτα προσθεὶς εἶπεν παραβολὴν διὰ τὸ ἐγγὺς ⸂εἶναι Ἰερουσαλὴμ αὐτὸν⸃ καὶ δοκεῖν αὐτοὺς ὅτι παραχρῆμα μέλλει ἡ βασιλεία τοῦ θεοῦ ἀναφαίνεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/011.yaml
  text: As they were hearing these things[a], he went on and told a parable, because he was near Jerusalem and because they supposed that the kingdom of God was about to appear immediately.
translation:
  language: te
  text: వారు ఈ మాటలు వింటుండగా, ఆయన ఇంకా ఒక ఉపమానం చెప్పారు; ఆయన యెరూషలేముకు దగ్గరగా ఉన్నందున, దేవుని రాజ్యం వెంటనే ప్రత్యక్షం కాబోతుందని వారు అనుకున్నందున ఇలా చెప్పారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వెంటనే వెల్లడికాబోతుందని.” ఈ క్రియ కనిపించడం లేదా బహిర్గతం కావడం అనే భావాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκουόντων δὲ αὐτῶν ταῦτα
  choice: వారు ఈ మాటలు వింటుండగా
  rationale: వర్తమాన కృదంతంతో కూడిన genitive absolute సమకాలీనంగా కొనసాగుతున్న వినికిడిని సూచిస్తుంది; ఈ తెలుగు రూపం ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: προσθεὶς εἶπεν παραβολὴν
  choice: ఆయన ఇంకొక ఉపమానం చెప్పారు
  rationale: ప్రసంగాన్ని కొనసాగిస్తూ మరొక విషయం చెప్పడాన్ని సూచించే గ్రీకు ప్రయోగాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; παραβολήకు సువార్తల్లో స్థిరమైన పదం ‘ఉపమానం’.
- source_word: διὰ τὸ ἐγγὺς εἶναι Ἰερουσαλὴμ αὐτὸν
  choice: ఎందుకంటే ఆయన యెరూషలేముకు దగ్గరగా ఉన్నాడు
  rationale: διάతో కూడిన articular infinitive కారణాన్ని తెలియజేస్తుంది; యెరూషలేముకు దగ్గరగా ఉన్నది యేసేనని నిర్మాణం స్పష్టం చేస్తుంది.
- source_word: δοκεῖν αὐτοὺς
  choice: వారు అనుకున్నారు
  rationale: వారి అభిప్రాయం లేదా నిరీక్షణను సూచిస్తుంది; అనవసరంగా నిశ్చయార్థాన్ని చేర్చదు.
- source_word: παραχρῆμα
  choice: వెంటనే
  rationale: తక్షణత్వాన్ని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μέλλει ... ἀναφαίνεσθαι
  choice: ప్రత్యక్షం కాబోతుందని
  rationale: μέλλωలోని సమీప భవిష్యత్తు భావాన్నీ, ἀναφαίνεσθαιలోని కనిపించడం లేదా వెల్లడికావడం అనే భావాన్నీ కలిపి నిలుపుతుంది.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: గ్రీకు పదబంధానికి సహజమైన, స్థిరమైన తెలుగు అనువాదం; లూకా కథనంలోని ధార్మిక కొనసాగింపును కాపాడుతుంది.
theological_decisions:
- issue: దేవుని రాజ్యం ఏ విధంగా ప్రత్యక్షమవుతుందని వారు ఆశించారు?
  choice: ‘దేవుని రాజ్యం వెంటనే ప్రత్యక్షం కాబోతుందని’ మాత్రమే చెప్పడం
  alternative: రాజ్యం రాజకీయంగా స్థాపించబడబోతుందని లేదా అంత్యకాలంలో సంపూర్ణంగా వెల్లడికాబోతుందని నిర్దిష్టీకరించడం
  rationale: వచనం రాజ్యం తక్షణమే ప్రత్యక్షమవుతుందనే వారి నిరీక్షణను మాత్రమే తెలియజేస్తుంది; అది రాజకీయమా, అపోకలిప్టికా, ఆధ్యాత్మికమా అనే విధానాన్ని నిర్వచించదు. అందువల్ల మూలంలోని ధార్మిక ఉద్వేగం, అస్పష్టత నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. కారణాన్ని తెలిపే రెండు అంశాలను స్పష్టంగా వేరు చేయడానికి అర్ధవిరామం వాడబడింది. ‘ప్రత్యక్షం’ అనే పదం సాధారణ పాఠకులకు అర్థమయ్యేంత పరిచితంగా ఉండి, మూలంలోని కనిపించడం/వెల్లడికావడం అనే ద్వంద్వ అవకాశాన్ని కాపాడుతుంది.
