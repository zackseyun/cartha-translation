source:
  edition: SBLGNT
  text: οἱ δὲ πολῖται αὐτοῦ ἐμίσουν αὐτόν, καὶ ἀπέστειλαν πρεσβείαν ὀπίσω αὐτοῦ λέγοντες· Οὐ θέλομεν τοῦτον βασιλεῦσαι ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/014.yaml
  text: But his citizens hated him[a], and sent a delegation after him, saying, ‘We do not want this man to reign over us.’
translation:
  language: te
  text: అయితే అతని పౌరులు అతన్ని ద్వేషించేవారు; అతని వెంబడి ఒక ప్రతినిధి బృందాన్ని[a] పంపి, “ఈ మనిషి మాపై రాజుగా పరిపాలించడాన్ని మేము కోరము” అని తెలియజేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాయబార బృందాన్ని.” గ్రీకు పదం అధికారిక కార్యం కోసం పంపబడిన ప్రతినిధుల బృందాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολῖται
  choice: పౌరులు
  rationale: రాజకీయ సమాజంలో సభ్యత్వాన్ని సూచించే పౌర సంబంధ భావాన్ని నిలుపుతుంది; ‘ప్రజలు’ కంటే నిర్దిష్టం, ‘అధీనులు’ అంటే వారు తిరస్కరిస్తున్న రాజాధికారాన్ని ముందుగానే ఆపాదించినట్లవుతుంది.
- source_word: ἐμίσουν
  choice: ద్వేషించారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా స్వభావసిద్ధమైన విరోధాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన భూతకాల రూపం ఈ భావాన్ని సందర్భంలో తగినంతగా తెలియజేస్తుంది.
- source_word: ἀπέστειλαν
  choice: పంపించి
  rationale: కథనంలోని భూతకాల చర్యను సహజంగా వ్యక్తం చేస్తూ, తరువాతి λέγοντες‌తో ఉన్న సంబంధాన్ని తెలుగులో స్పష్టంగా కలుపుతుంది.
- source_word: πρεσβείαν
  choice: ఒక ప్రతినిధి బృందాన్ని
  rationale: అధికారిక సందేశంతో పంపబడిన ప్రతినిధుల సమూహం అనే రాజకీయ భావాన్ని ఆధునిక పాఠకులకు సహజంగా అందిస్తుంది.
- source_word: ὀπίσω αὐτοῦ
  choice: అతని వెనుక
  rationale: అతడు వెళ్లిన తరువాత అతన్ని అనుసరించేలా బృందాన్ని పంపారనే సందర్భార్థాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: λέγοντες
  choice: అని చెప్పించారు
  rationale: ప్రతినిధి బృందం ద్వారా పంపిన సందేశ విషయాన్ని తెలుగులో సహజంగా పరిచయం చేస్తుంది; సందేశం పంపిన పౌరులే దాని మూలమని స్పష్టంగా ఉంటుంది.
- source_word: Οὐ θέλομεν
  choice: మాకు ఇష్టం లేదు
  rationale: వారి కోరికలేమినే కాక సంకల్పపూర్వక నిరాకరణను కూడా సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τοῦτον
  choice: ఇతడు
  rationale: దగ్గర సూచనతో కూడిన కొంత దూరీకరణ లేదా తిరస్కార ధోరణిని, అనవసరంగా అవమానకర పదజాలం చేర్చకుండా నిలుపుతుంది.
- source_word: βασιλεῦσαι ἐφ’ ἡμᾶς
  choice: మాపై రాజుగా పరిపాలించడం
  rationale: సాధారణ అధికారాన్ని మాత్రమే సూచించే ‘పాలించడం’తో సరిపెట్టకుండా, βασιλεύωలోని స్పష్టమైన రాజరిక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఉపమానంలోని రాజకీయ/రాజరిక భావం
  choice: ‘మాపై రాజుగా పరిపాలించడం’ అని స్పష్టమైన రాజరిక భాషను ఉంచడం
  alternative: ‘మమ్మల్ని పాలించడం’ లేదా ‘మాపై అధికారం చేయడం’
  rationale: ఉపమానంలో రాజత్వాన్ని తిరస్కరించడమే ప్రధాన ఉద్రిక్తత. సాధారణ అధికార భాషగా చదును చేయకుండా రాజరిక చిత్రణను కాపాడుతుంది; అదే సమయంలో ఉపమానానికి మించిన సిద్ధాంతార్థాన్ని అనువాదంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘పౌరులు,’ ‘ప్రతినిధి బృందం,’ ‘రాజుగా పరిపాలించడం’ అనే పదబంధాలు మూలంలోని పౌర-రాజకీయ వాతావరణాన్ని నిలుపుతాయి. పాదసూచిక గుర్తు అది వివరిస్తున్న ‘ప్రతినిధి బృందం’ వద్ద ఉంచబడింది.
