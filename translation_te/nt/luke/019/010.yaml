source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ζητῆσαι καὶ σῶσαι τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/010.yaml
  text: For the Son of Man came to seek and to save the lost[a].
translation:
  language: te
  text: ఎందుకంటే మనుష్యకుమారుడు పోయినదాన్ని వెదకడానికీ రక్షించడానికీ వచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తప్పిపోయినవారిని.” గ్రీకులో ఈ పదబంధం నపుంసక ఏకవచనంలో ఉంది; దాన్ని సాధారణ లేదా సమూహార్థంలో కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: వచ్చాడు
  rationale: కథన సందర్భంలోని aorist సూచించే పూర్తయిన రాకను సహజమైన తెలుగు భూతకాలంతో వ్యక్తపరుస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు కారణం లేదా వివరణను పరిచయం చేసే γάρ సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: యేసు తనను తాను సూచించడానికి ఉపయోగించిన ఈ బిరుదును పారాఫ్రేజ్ చేయకుండా, దాని దానియేలు గ్రంథ సంబంధిత మరియు ధార్మిక ప్రతిధ్వనులను నిలుపుతుంది.
- source_word: ζητῆσαι
  choice: వెదకి
  rationale: ἦλθεν తరువాత ఉద్దేశాన్ని తెలిపే infinitiveను సహజమైన తెలుగు క్రియారూపంలో వ్యక్తపరుస్తుంది; ఉద్దేశపూర్వక అన్వేషణ భావాన్ని నిలుపుతుంది.
- source_word: σῶσαι
  choice: రక్షించడానికి
  rationale: లూకా సందర్భంలో శారీరక కాపాడటాన్ని మించిన రక్షణార్థక విస్తృతిని నిలుపుతుంది; 19:9లోని రక్షణ భావంతోనూ అనుసంధానమవుతుంది.
- source_word: τὸ ἀπολωλός
  choice: పోయినదాన్ని
  rationale: గ్రీకు నపుంసక ఏకవచన participleను సాధ్యమైనంత సమీపంగా ప్రతిబింబిస్తూ, ఒక వ్యక్తికే పరిమితం చేయకుండా సాధారణ లేదా సమూహార్థానికి చోటిస్తుంది.
theological_decisions:
- issue: τὸ ἀπολωλός యొక్క పరిధి మరియు సూక్ష్మభావం
  choice: పోయినదాన్ని
  alternative: తప్పిపోయినవారిని
  rationale: నపుంసక ఏకవచన గ్రీకు రూపాన్ని నిలుపుతూ, జక్కయ్యను తక్షణ సందర్భంలో సూచించే అవకాశంతో పాటు యేసు విస్తృత కార్యాన్ని సూచించే సాధారణార్థాన్నీ తెరిచి ఉంచుతుంది. ‘తప్పిపోయినవారిని’ సహజమైన సమూహార్థం ఇస్తుంది గానీ మూలంలోని ఏకవచన రూపాన్ని స్పష్టంగా చూపదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘మనుష్య కుమారుడు’ అనే స్థిరమైన బిరుదు నిలుపబడింది; మూలంలోని ఏకవచన అస్పష్టతను ప్రధాన పాఠం మరియు పాదటిప్పణి ద్వారా సంరక్షించాం.
