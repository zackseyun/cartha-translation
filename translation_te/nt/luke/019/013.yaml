id: LUK.19.13
reference: Luke 19:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καλέσας δὲ δέκα δούλους ἑαυτοῦ ἔδωκεν αὐτοῖς δέκα μνᾶς καὶ εἶπεν πρὸς αὐτούς· ⸀Πραγματεύσασθε ⸂ἐν ᾧ⸃ ἔρχομαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/013.yaml
  text: After calling ten of his own servants[a], he gave them ten minas and said to them[c][b], “Do business until I come.”
translation:
  language: te
  text: తర్వాత అతడు తన సొంత దాసులైన పదిమందిని పిలిచి, వారికి పది మినాలు[a] ఇచ్చి, ‘నేను తిరిగి వచ్చేంతవరకు వీటితో వ్యాపారం చేయండి[b]’ అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మినా అనేది ప్రాచీన కాలంలోని ఒక ద్రవ్య ప్రమాణం.
    reason: cultural_note
  - marker: b
    text: లేదా, “నేను తిరిగి వచ్చేంతవరకు వీటితో వర్తకం చేయండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καλέσας
  choice: పిలిచి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచించే aorist participleను సహజమైన తెలుగు క్రమంలో ‘పిలిచి’ అని అనువదించాం.
- source_word: δούλους ἑαυτοῦ
  choice: తన దాసులలో
  rationale: δοῦλος యజమానికి లోబడిన దాసుణ్ణి లేదా సేవకుణ్ణి సూచించగలదు; ἑαυτοῦలోని స్వీయసంబంధ భావాన్ని ‘తన’ నిలుపుతుంది. పదిమంది అనే ఎంపికను సహజంగా తెలిపేందుకు ‘తన దాసులలో పదిమందిని’ వాడాం.
- source_word: δέκα μνᾶς
  choice: పది మినాలు
  rationale: మినా ప్రాచీన ద్రవ్య ప్రమాణం; ఆధునిక కరెన్సీతో తప్పుదారి పట్టించే సమానీకరణ చేయకుండా పేరును లిప్యంతరీకరించాం.
- source_word: Πραγματεύσασθε
  choice: వీటితో వ్యాపారం చేయండి
  rationale: ఈ ఆజ్ఞ అప్పగించిన ధనంతో వాణిజ్య కార్యకలాపం చేయాలని సూచిస్తుంది. తెలుగులో కర్మ స్పష్టత కోసం సందర్భం నుంచి ‘వీటితో’ చేర్చాం; పెట్టుబడి విధానాన్ని అతిగా నిర్దిష్టం చేయలేదు.
- source_word: ἐν ᾧ ἔρχομαι
  choice: నేను తిరిగి వచ్చేంతవరకు
  rationale: ఈ కాలసూచక నుడికారం అతడు వచ్చే లేదా తిరిగి వచ్చే సమయం వరకు అనే భావం ఇస్తుంది; కథా సందర్భంలో ‘తిరిగి’ సహజంగా గమ్యమవుతుంది.
theological_decisions:
- issue: యజమాని–దాసుల ఉపమాన సందర్భంలో δοῦλος అనువాదం
  choice: దాసులు
  alternative: సేవకులు
  rationale: ἑαυτοῦతో కూడిన యజమాని అధీన సంబంధాన్ని ‘దాసులు’ మరింత స్పష్టంగా నిలుపుతుంది. అయితే ఈ పదం సందర్భానుసారం సేవకులను కూడా సూచించగలదని ప్రత్యామ్నాయాన్ని గమనించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘దాసులు’ ద్వారా ప్రాచీన యజమాని–దాస సంబంధాన్ని నిలిపి, ‘మినాలు’కు సాంస్కృతిక వివరణను పాదటిప్పణిలో ఇచ్చాం.
