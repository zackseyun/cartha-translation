    reason: lexical_alternative
  revision_rationale: The revision removes a possible partitive implication in the description of the ten slaves and makes the lexical-alternative footnote structurally and semantically complete. It otherwise preserves the draft’s faithful rendering of the Greek and its historical terminology.
