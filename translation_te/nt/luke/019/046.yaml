id: LUK.19.46
reference: Luke 19:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· Γέγραπται· ⸂Καὶ ἔσται⸃ ὁ οἶκός μου οἶκος ⸀προσευχῆς, ὑμεῖς δὲ αὐτὸν ἐποιήσατε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/046.yaml
  text: saying to them[a], “It is written[b], ‘And my house shall be a house of prayer,’ but you have made it a den of robbers.”
translation:
  language: te
  text: 'వారితో ఇలా అన్నాడు: “ఇలా వ్రాయబడి ఉంది: ‘నా ఇల్లు[a] ప్రార్థనా గృహం అవుతుంది.’ కానీ మీరు దాన్ని దొంగల గుహగా[b] చేశారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నా ఇల్లు.” సందర్భంలో ఇది దేవాలయాన్ని సూచిస్తుంది; యెషయా 56:7ను ప్రతిధ్వనిస్తుంది.
    reason: lexical_alternative_and_cross_reference
  - marker: b
    text: “దొంగల గుహ” అనే మాట యిర్మియా 7:11ను ప్రతిధ్వనిస్తుంది. “దొంగలు” అనే పదాన్ని “దోపిడీదారులు” లేదా “బందిపోట్లు” అని కూడా అనువదించవచ్చు.
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: వారితో ఇలా అన్నాడు
  rationale: గ్రీకు వర్తమాన కృదంతం ముందున్న కథనంతో అనుసంధానమై ఉంది. తెలుగులో సహజమైన కథన ప్రవాహం కోసం సమాపక క్రియగా అనువదించబడింది.
- source_word: Γέγραπται
  choice: ఇలా రాయబడి ఉంది
  rationale: లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే గ్రీకు పూర్ణ నిష్క్రియ సూత్రప్రయోగం యొక్క కొనసాగుతున్న అధికార భావాన్ని నిలుపుతుంది.
- source_word: Καὶ ἔσται
  choice: ఉంటుంది
  rationale: ఉల్లేఖనంలోని భవిష్యత్ భావాన్ని సహజ తెలుగులో ఇస్తుంది. వాక్యారంభంలోని καί తెలుగులో కృత్రిమంగా వినిపించకుండా సందర్భానుగుణంగా అంతర్లీనమైంది.
- source_word: ὁ οἶκός μου
  choice: నా ఇల్లు
  rationale: οἶκος యొక్క ప్రాథమిక అర్థమైన ‘ఇల్లు’ను నిలుపుతూ యెషయా 56:7తో ఉన్న ప్రతిధ్వనిని కాపాడుతుంది; సందర్భంలో ఇది దేవాలయాన్ని సూచిస్తుంది.
- source_word: οἶκος προσευχῆς
  choice: ప్రార్థన మందిరం
  rationale: తెలుగులో సహజంగా, గౌరవప్రదంగా వినిపించే విధంగా ప్రార్థనకు అంకితమైన స్థలమనే గుణార్థక సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: ὑμεῖς δὲ
  choice: కానీ మీరు
  rationale: δὲ యొక్క వ్యతిరేకతను, ὑμεῖς అనే స్పష్ట సర్వనామంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἐποιήσατε
  choice: చేశారు
  rationale: వారు కలిగించిన ఫలితస్థితిని సందర్భం స్పష్టం చేస్తుంది; తెలుగులో సాధారణ భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: σπήλαιον
  choice: గుహ
  rationale: ప్రాథమిక రూపకాన్ని నిలుపుతుంది; యిర్మియా 7:11 సందర్భంలో దొంగలు దాక్కునే స్థలమనే భావం స్పష్టమవుతుంది.
- source_word: λῃστῶν
  choice: దొంగల
  rationale: λῃστήςకు దొంగలు, దోపిడీదారులు, బందిపోట్లు అనే పరిధి ఉంది. ‘దొంగలు’ ప్రవచనాత్మక రూపకాన్ని సహజంగా నిలుపుతూ రాజకీయ భావాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: దేవాలయాన్ని ‘ఇల్లు’గా అనువదించడం
  choice: నా ఇల్లు
  alternative: నా దేవాలయం
  rationale: గ్రీకు మూలంలో οἶκος (‘ఇల్లు’) ఉంది. దానిని నిలుపడం యెషయా 56:7తో అంతర్గ్రంథ సంబంధాన్ని, దేవుని ఇల్లు అనే భావబలాన్ని కాపాడుతుంది; సందర్భం దేవాలయ సూచనను స్పష్టం చేస్తుంది.
- issue: λῃστῶν యొక్క భావపరిధి
  choice: దొంగల
  alternative: దోపిడీదారుల / బందిపోట్ల
  rationale: మూలపదంలో దోపిడీ లేదా బందిపోటుతనం కూడా ఉండవచ్చు. ప్రధాన పాఠంలో విస్తృతమైన, సహజమైన ‘దొంగలు’ను ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలియజేయడం అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష వాక్య శైలి. ‘నా ఇల్లు’ ద్వారా మూలంలోని రూపకాన్ని నిలిపి, ‘ప్రార్థన మందిరం’ ద్వారా తెలుగులో సహజమైన గుణార్థక నిర్మాణాన్ని ఉపయోగించింది.
