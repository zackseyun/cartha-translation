lexical_decisions:
- source_word: Καὶ
  choice: —
  rationale: తెలుగు కథన ప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ అని అనువదించకుండా, క్రియల అనుసంధానంతో సాధారణ సమన్వయాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: εἰσελθὼν
  choice: ప్రవేశించి
  rationale: అనంతర ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచించే అఓరిస్ట్ కృదంతాన్ని సహజమైన తెలుగు పూర్వకాలిక క్రియారూపంతో అందించాం.
- source_word: διήρχετο
  choice: గుండా వెళ్తూ ఉన్నాడు
  rationale: ఇంపెర్ఫెక్ట్ రూపంలోని కొనసాగుతున్న లేదా ప్రక్రియలో ఉన్న కదలికను నిలుపుతుంది.
- source_word: τὴν Ἰεριχώ
  choice: యెరికోలో ... దాని గుండా
  rationale: స్థలనామాన్ని తెలుగు ప్రాచుర్య రూపంలో ఉంచి, నగరంలో ప్రవేశించి దాని గుండా సాగుతున్న భావాన్ని సహజంగా వ్యక్తం చేశాం.
