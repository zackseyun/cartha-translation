  text: And he was trying to see who Jesus was[a], but he could not because of the crowd, because he was small in stature.
translation:
  language: te
  text: అతడు యేసు ఎవరో చూడాలని ప్రయత్నిస్తున్నాడు, కానీ జనసమూహం వల్ల చూడలేకపోయాడు; ఎందుకంటే అతడు పొట్టివాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకు మాటను అక్షరార్థంగా అనువదిస్తే, ‘ఎత్తులో చిన్నవాడు.’ ఈ సందర్భంలో అది వయస్సును కాకుండా శరీర ఎత్తును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτει
  choice: ప్రయత్నిస్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న ప్రయత్నాన్ని సూచిస్తుంది; కేవలం కోరికను కాకుండా అతడు చేస్తున్న ప్రయత్నాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἰδεῖν
  choice: చూడడానికి
  rationale: ζητέωతో కూడిన ఈ అనిశ్చిత క్రియారూపం అతని ప్రయత్న లక్ష్యాన్ని సూచిస్తుంది.
- source_word: τίς ἐστιν
  choice: యేసు ఎవరో
  rationale: ఈ మాట గుర్తింపును లేదా ఆయన ఎలాంటి వ్యక్తో సూచించవచ్చు. ‘యేసు ఎవరో’ అనే అనువాదం మూలంలోని సంక్షిప్తతను, కొంత భావ విస్తృతిని కాపాడుతుంది.
- source_word: οὐκ ἠδύνατο
  choice: చూడలేకపోయాడు
  rationale: తెలుగులో సందర్భానికి తగిన సహజ ప్రయోగం; చూడగల సామర్థ్యం పరిస్థితివల్ల అడ్డుపడిందని తెలియజేస్తుంది.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: జనసమూహం వల్ల
  rationale: ఇక్కడ ἀπό అడ్డంకిగా ఉన్న కారణాన్ని సూచిస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: అతడు చూడలేకపోవడానికి గల కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: τῇ ἡλικίᾳ μικρὸς ἦν
  choice: అతడు పొట్టి వాడు
  rationale: ἡλικία వయస్సు లేదా శరీర ఎత్తును సూచించగలిగినా, జనసమూహం వల్ల చూడలేని సందర్భంలో శరీర ఎత్తే ఉద్దేశం. ‘పొట్టి వాడు’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
