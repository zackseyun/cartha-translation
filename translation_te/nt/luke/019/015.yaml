id: LUK.19.15
reference: Luke 19:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ἐπανελθεῖν αὐτὸν λαβόντα τὴν βασιλείαν καὶ εἶπεν φωνηθῆναι αὐτῷ τοὺς δούλους τούτους οἷς ⸀δεδώκει τὸ ἀργύριον, ἵνα ⸀γνοῖ τί ⸀διεπραγματεύσαντο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/015.yaml
  text: And it happened[a], when he returned after receiving the kingdom, that he ordered these servants to whom he had given the money to be called to him[b], so that he might know what they had gained by trading.
translation:
  language: te
  text: 'అతడు రాజ్యాధికారం[a] పొంది తిరిగి వచ్చినప్పుడు ఇలా జరిగింది: తాను డబ్బు ఇచ్చిన ఆ దాసులను[b] తన దగ్గరకు పిలిపించమని ఆజ్ఞాపించాడు; వారు వ్యాపారం చేసి ఏమి సంపాదించారో[c] తెలుసుకోవడానికి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రాజ్యం.” ఇక్కడ గ్రీకు పదం రాజుగా పాలించే అధికారం లేదా రాజరిక హోదాను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “సేవకులను.” గ్రీకు పదం సందర్భానుసారం దాసులను లేదా సేవకులను సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా “వ్యాపారంలో ఏమి సాధించారో,” “ఎంత లాభం పొందారో.” గ్రీకు క్రియ వ్యాపారం చేయడాన్నీ దాని ఫలితాన్నీ సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ఇలా జరిగింది
  rationale: లూకా వాడే కథన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐν τῷ ἐπανελθεῖν αὐτὸν
  choice: అతడు ... తిరిగి వచ్చినప్పుడు
  rationale: ἐν తో కూడిన articular infinitive ఇక్కడ కాలసంబంధ భావాన్ని ఇస్తుంది; తెలుగులో ‘వచ్చినప్పుడు’ సహజంగా ఉంది.
- source_word: λαβόντα τὴν βασιλείαν
  choice: రాజ్యాధికారం పొంది
  rationale: కృదంతం ప్రధాన చర్యకు ముందుగా జరిగిన విషయాన్ని సూచిస్తుంది. ఈ ఉపమానంలోని రాజకీయ సందర్భంలో βασιλεία కేవలం భూభాగం కంటే రాజుగా పాలించే అధికారం అనే భావాన్ని కలిగిస్తుంది.
- source_word: φωνηθῆναι αὐτῷ
  choice: తన దగ్గరకు పిలిపించమని
  rationale: ఇక్కడ φωνέω కేవలం పేరు పెట్టి పిలవడం కాక, తన సమక్షానికి రప్పించడం అనే అర్థం ఇస్తుంది.
- source_word: δούλους
  choice: దాసులను
  rationale: వారు ఆ ప్రభువు అధికారానికి లోబడినవారని ‘దాసులు’ స్పష్టపరుస్తుంది; సందర్భానుసారం ‘సేవకులు’ అనే అర్థం కూడా సాధ్యమే.
- source_word: δεδώκει τὸ ἀργύριον
  choice: డబ్బు ఇచ్చిన
  rationale: Pluperfect ముందే పూర్తయిన చర్యను సూచిస్తుంది. ἀργύριον సాధారణంగా వెండి లేదా డబ్బును సూచిస్తుంది; ఈ వచనంలో ‘డబ్బు’ సహజం.
- source_word: ἵνα γνοῖ
  choice: తెలుసుకోవాలని
  rationale: Purpose clause భావాన్ని సంక్షిప్తమైన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τί διεπραγματεύσαντο
  choice: వ్యాపారం చేసి ఏమి సంపాదించారో
  rationale: క్రియలో వ్యాపారం చేయడం, దాని ద్వారా ఫలితం సాధించడం రెండూ ఉన్నాయి. ‘ఏమి’ అనే పదం ఫలితాన్ని అతిగా ‘ఎంత’గా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: ఉపమానంలోని δοῦλος పదానికి సామాజిక సంబంధాన్ని ఎలా చూపాలి
  choice: దాసులు
  alternative: సేవకులు
  rationale: యజమాని అధికారానికి లోబడి, అతని ధనాన్ని నిర్వహించే వారి బంధిత స్థితిని ‘దాసులు’ మెరుగ్గా చూపుతుంది. అయితే గ్రీకు పదం సందర్భానుసారం సేవకులనూ సూచించగలదని పాదసూచికలో తెలిపాం; దీనికి ప్రత్యేక మతపరమైన భావాన్ని జోడించలేదు.
- issue: βασιλεία ను భూభాగమా లేక పాలనాధికారమా అని అనువదించడం
  choice: రాజ్యాధికారం
  alternative: రాజ్యం
  rationale: ఈ కథలో ఉన్నత వంశస్థుడు పొందేది రాజుగా పాలించే హోదా లేదా అధికారం. ‘రాజ్యాధికారం’ ఈ రాజకీయ భావాన్ని స్పష్టపరుస్తుంది; ‘రాజ్యం’ అనే సాంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: διεπραγματεύσαντο లో వ్యాపార చర్య, లాభఫలితం మధ్య ఉన్న భావ విస్తృతి
  choice: వ్యాపారం చేసి ఏమి సంపాదించారో
  alternative: వ్యాపారంలో ఏమి సాధించారో / ఎంత లాభం పొందారో
  rationale: మూలపదం వ్యాపారంలో పాల్గొనడాన్నీ దాని ఫలితాన్నీ సూచించగలదు. అనువాదం రెండింటినీ కలిపి చూపుతుంది; సాధ్యమైన ఇతర నుడికారాలను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇలా జరిగింది’ మూలంలోని లూకా కథన సూత్రాన్ని నిలుపుతుంది. ‘రాజ్యాధికారం,’ ‘దాసులు,’ ‘వ్యాపారం’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండగా, మూలంలోని సామాజిక-రాజకీయ భావాలను కూడా కాపాడుతాయి.
