revisions:
- from: 'ఇలా అన్నాడు: “మీకు ఎదురుగా ఉన్న గ్రామంలోకి వెళ్లండి. మీరు దానిలో ప్రవేశిస్తుండగా, కట్టివేయబడిన ఒక గాడిదపిల్ల మీకు కనిపిస్తుంది. దానిమీద ఇంతవరకు ఏ మనిషీ కూర్చోలేదు. దాన్ని విప్పి తీసుకురండి.”'
  to: 'ఇలా అన్నాడు: “మీకు ఎదురుగా ఉన్న గ్రామంలోకి వెళ్లండి. మీరు దానిలో ప్రవేశిస్తుండగా, కట్టివేయబడిన ఒక పశుపిల్ల మీకు దొరుకుతుంది. దానిమీద ఇంతవరకు ఏ మనిషీ కూర్చోలేదు. దాన్ని విప్పి తీసుకురండి.”'
  rationale: The revision changes only the species-specific “గాడిదపిల్ల” to the non-specific “పశుపిల్ల,” preserving the Greek term’s breadth rather than resolving it from parallel accounts. It also uses “దొరుకుతుంది” for the direct future sense of “you will find.” All other wording is retained because it is faithful and idiomatic.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T01:18:05Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the destination, the discovery upon entering, the tied state, the statement that no human has ever sat on the animal, and the two commands. However, γῶλον/πῶλον is rendered as “గాడిదపిల్ల,” which specifies a donkey. In this verse the Greek term itself is not species-specific enough to require that narrowing; the English audit trail likewise retains “colt.”
  naturalness: The Telugu is clear, modern, and readable. “మీకు కనిపిస్తుంది” is acceptable, though “దొరుకుతుంది” more directly renders εὑρήσετε (“you will find”). “పశుపిల్ల” is a natural enough general term in this context and avoids assigning a species absent from this verse.
  terminology: No doctrinal terminology is involved. The animal term should remain non-species-specific in accordance with the Greek wording. No footnote is required because the general Telugu wording preserves the source ambiguity directly.
  issues:
  - severity: medium
    issue: “గాడిదపిల్ల” specifies the species of πῶλον.
    rationale: πῶλον denotes a young riding/pack animal or colt and, in this verse considered on its own, does not explicitly identify it as a donkey. Specifying donkey imports information from parallel/contextual material rather than translating Luke’s lexical choice.
  revised_text: 'ఇలా అన్నాడు: “మీకు ఎదురుగా ఉన్న గ్రామంలోకి వెళ్లండి. మీరు దానిలో ప్రవేశిస్తుండగా, కట్టివేయబడిన ఒక పశుపిల్ల మీకు దొరుకుతుంది. దానిమీద ఇంతవరకు ఏ మనిషీ కూర్చోలేదు. దాన్ని విప్పి తీసుకురండి.”'
  revised_footnotes: []
  revision_rationale: The revision changes only the species-specific “గాడిదపిల్ల” to the non-specific “పశుపిల్ల,” preserving the Greek term’s breadth rather than resolving it from parallel accounts. It also uses “దొరుకుతుంది” for the direct future sense of “you will find.” All other wording is retained because it is faithful and idiomatic.
