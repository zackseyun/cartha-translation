  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀λέγων· Ὑπάγετε εἰς τὴν κατέναντι κώμην, ἐν ᾗ εἰσπορευόμενοι εὑρήσετε πῶλον δεδεμένον, ἐφ’ ὃν οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν, ⸀καὶ λύσαντες αὐτὸν ἀγάγετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/030.yaml
  text: saying, “Go into the village opposite you, in which, as you enter, you will find a colt tied up, on which no one among men has ever sat. Untie it and bring it.”
translation:
  language: te
  text: 'ఇలా అన్నాడు: “మీకు ఎదురుగా ఉన్న గ్రామంలోకి వెళ్లండి. మీరు దానిలో ప్రవేశిస్తుండగా, కట్టివేయబడిన ఒక పశుపిల్ల మీకు దొరుకుతుంది. దానిమీద ఇంతవరకు ఏ మనిషీ కూర్చోలేదు. దాన్ని విప్పి తీసుకురండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὴν κατέναντι κώμην
  choice: మీకు ఎదురుగా ఉన్న గ్రామం
  rationale: κατέναντι యొక్క ఎదురుగా/ఎదుట అనే స్థలార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: πῶλον
  choice: గాడిదపిల్ల
  rationale: πῶλος సాధారణంగా చిన్న స్వారీ జంతువును సూచించగలిగినా, ఈ సందర్భంలో సమాంతర సువార్త వృత్తాంతం మరియు తరువాతి వచనాల నేపథ్యం గాడిదపిల్లను స్పష్టం చేస్తాయి.
- source_word: δεδεμένον
  choice: కట్టివేయబడిన
  rationale: పర్ఫెక్ట్ పాసివ్ భావాన్ని—అది కట్టి ఉన్న స్థితిని—కాపాడుతుంది.
- source_word: οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν
  choice: దానిమీద ఇంతవరకు ఏ మనిషీ కూర్చోలేదు
  rationale: సంపూర్ణ నిరాకరణను, కాలభావాన్ని, ἀνθρώπων అనే మానవ సూచనను నేరుగా నిలుపుతుంది.
- source_word: λύσαντες αὐτὸν ἀγάγετε
  choice: దాన్ని విప్పి తీసుకురండి
  rationale: రెండు వరుస క్రియలను సహజమైన తెలుగు ఆజ్ఞారూపంలో కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే ప్రత్యక్ష వాక్య నిర్మాణం. మూలంలోని ప్రవేశించే సమయంలో కనుగొనడం అనే భావక్రమం నిలుపబడింది.
