id: LUK.19.26
reference: Luke 19:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν ὅτι παντὶ τῷ ἔχοντι δοθήσεται, ἀπὸ δὲ τοῦ μὴ ἔχοντος καὶ ὃ ἔχει ⸀ἀρθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/026.yaml
  text: I tell you that to everyone who has[a], more will be given; but from the one who does not have, even what he has will be taken away.
translation:
  language: te
  text: 'నేను మీతో చెబుతున్నాను: కలిగిన ప్రతి ఒక్కరికీ ఇంకా ఇవ్వబడుతుంది[a]; కాని కలిగి లేనివాని నుండి, అతనికి ఉన్నది కూడా తీసివేయబడుతుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇవ్వబడుతుంది.’ గ్రీకు మూలంలో ‘ఇంకా’ అనే మాట స్పష్టంగా లేదు; అయితే ఈ సందర్భంలో పెరుగుదల భావం సాధారణంగా అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: నేను మీతో చెబుతున్నాను
  rationale: ప్రత్యక్ష ప్రకటనను పరిచయం చేసే వర్తమానకాల రూపాన్ని సహజమైన, గంభీరమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: παντὶ τῷ ἔχοντι
  choice: కలిగిన ప్రతి ఒక్కరికీ
  rationale: నామవాచకంగా పనిచేసే గ్రీకు కృదంతం సూచించే సాధారణ, సమగ్ర పరిధిని నిలుపుతుంది.
- source_word: δοθήσεται
  choice: ఇంకా ఇవ్వబడుతుంది
  rationale: గ్రీకులోని భవిష్యత్ కర్మణి రూపం అక్షరార్థంగా ‘ఇవ్వబడుతుంది.’ సందర్భంలోని పెరుగుదల భావాన్ని తెలుగులో స్పష్టంగా చేయడానికి ‘ఇంకా’ చేర్చబడింది; పాదటిప్పణి మూలంలోని సంక్షిప్త రూపాన్ని తెలియజేస్తుంది.
- source_word: ἀπὸ δὲ τοῦ μὴ ἔχοντος
  choice: కాని కలిగి లేనివాని దగ్గర నుండి
  rationale: δέ యొక్క వ్యతిరేక భావాన్నీ, సాధారణ వ్యక్తిని సూచించే కృదంత నిర్మాణాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: καὶ ὃ ἔχει
  choice: అతనికి ఉన్నది కూడా
  rationale: ఇక్కడ καί బలవర్ధకంగా ‘కూడా’ అనే భావాన్ని ఇస్తుంది; వ్యక్తికి ప్రస్తుతం ఉన్నదాన్ని సంబంధ వాక్యం సూచిస్తుంది.
- source_word: ἀρθήσεται
  choice: తీసివేయబడుతుంది
  rationale: αἴρω యొక్క భవిష్యత్ కర్మణి రూపం ఇక్కడ తొలగింపు లేదా దూరం చేయబడటాన్ని సూచిస్తుంది.
theological_decisions:
- issue: ఈ సూక్తిలోని పెరుగుదల మరియు నష్టం అనే సూత్రం యొక్క వ్యాఖ్యాన పరిధి
  choice: రక్షణ, యోగ్యత, ముందే నిర్ణయించడం వంటి సిద్ధాంత వివరణలను పద్యంలో చేర్చకుండా సూక్తిని సూటిగా అనువదించడం
  alternative: దీనిని ప్రత్యేకంగా అప్పగింతల నిర్వహణ గురించిన సూత్రంగా లేదా విస్తృతమైన దేవుని రాజ్య సూత్రంగా అనువాదంలోనే స్పష్టం చేయడం
  rationale: వచనం సిద్ధాంతపరమైన కార్యవిధానాన్ని పేర్కొనదు. కాబట్టి దాని సంక్షిప్తతను, సందర్భానుసారంగా అన్వయించగల ఉద్వేగాన్ని అనువాదం అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వాక్యపు గంభీరత మరియు సూక్తిరూప సంక్షిప్తత నిలిచేలా రూపొందించబడింది.
