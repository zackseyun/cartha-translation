  text: Then the first came, saying, ‘Lord, your mina has earned ten minas.’
translation:
  language: te
  text: అప్పుడు మొదటివాడు వచ్చి, ‘ప్రభువా,[a] మీ మీనా పది మీనాలను అదనంగా సంపాదించింది’ అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యజమానా.” గ్రీకు κύριε అనే సంబోధనకు “ప్రభువా” అనే అర్థంతోపాటు, ఉన్నత స్థానంలోని వ్యక్తిని గౌరవంగా సంబోధించే అర్థమూ ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: παρεγένετο
  choice: వచ్చి
  rationale: παραγίνομαι ఇక్కడ యజమాని ఎదుటకు రావడాన్ని సూచిస్తుంది; తెలుగు కథన ప్రవాహంలో ‘వచ్చి’ సహజంగా ఉంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: δέ ఇక్కడ కథనంలోని తదుపరి ఘట్టాన్ని సూచిస్తుంది; ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὁ πρῶτος
  choice: మొదటివాడు
  rationale: లెక్క చెప్పడానికి వరుసగా వచ్చిన సేవకులలో మొదటివాణ్ణి సూచిస్తుంది.
- source_word: λέγων
  choice: అని చెప్పాడు
  rationale: ప్రధాన క్రియతో సమకాలికమైన ఈ కృదంతాన్ని సహజమైన తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంగా మార్చింది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: κύριε గౌరవపూర్వక సంబోధన; ‘ప్రభువా’ మూలపద పరిధిని నిలుపుతుంది. ఈ ఉపమాన సందర్భంలో ‘యజమానా’ కూడా సాధ్యమని పాదసూచికలో తెలిపింది.
- source_word: ἡ μνᾶ σου
  choice: మీ మీనా
  rationale: μνᾶ అనే చారిత్రక ద్రవ్య ప్రమాణాన్ని ఆధునిక కరెన్సీతో భర్తీ చేయకుండా లిప్యంతరీకరించింది; σου యజమానికి చెందినదని ‘మీ’ తెలియజేస్తుంది.
- source_word: δέκα προσηργάσατο μνᾶς
  choice: పది మీనాలను సంపాదించింది
  rationale: προσεργάζομαι శ్రమ లేదా వ్యాపారం ద్వారా లాభాన్ని సంపాదించడాన్ని సూచిస్తుంది. మూలంలోని ఫలితాన్ని స్పష్టంగా ఉంచుతూ, మూలధనానికి అదనంగా వచ్చిన లాభమనే భావం సందర్భం ద్వారా తెలుస్తుంది.
theological_decisions:
- issue: ఉపమానంలోని κύριος సంబోధన
  choice: ప్రభువా
  alternative: యజమానా
  rationale: ఇది నేరుగా క్రీస్తు గురించిన విశ్వాస ప్రకటన కాదు; ఉన్నత స్థానంలోని వ్యక్తికి గౌరవ సంబోధన కూడా కావచ్చు. అయినా κύριος యొక్క విస్తృత అర్థపరిధిని నిలుపడానికి ప్రధాన పాఠంలో ‘ప్రభువా’ ఉంచి, సందర్భోచిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలిని, సేవకుడు యజమానితో మాట్లాడే గౌరవ సూచక బహువచనాన్ని ఉపయోగించింది. ‘మీనా’ అనే చారిత్రక ద్రవ్య ప్రమాణాన్ని అనువదించకుండా లిప్యంతరీకరించింది.
