id: LUK.19.35
reference: Luke 19:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἤγαγον αὐτὸν πρὸς τὸν Ἰησοῦν, καὶ ἐπιρίψαντες ⸀αὐτῶν τὰ ἱμάτια ἐπὶ τὸν πῶλον ἐπεβίβασαν τὸν Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/035.yaml
  text: And they brought it to Jesus[a], and after throwing their cloaks on the colt[b], they put Jesus on it.
translation:
  language: te
  text: వారు ఆ గాడిద పిల్లను[a] యేసు దగ్గరికి తీసుకొచ్చి, దానిమీద తమ పైవస్త్రాలు వేసి, యేసును దానిపై ఎక్కించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకు పదానికి సాధారణంగా ‘చిన్న వాహన జంతువు’ లేదా ‘పిల్ల’ అనే అర్థం ఉంది; ఈ సందర్భంలో అది గాడిద పిల్లను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγον
  choice: తీసుకొచ్చి
  rationale: ఇక్కడ ἄγω అనే క్రియ గాడిద పిల్లను యేసు దగ్గరికి తీసుకురావడాన్ని సూచిస్తుంది. ‘తీసుకొచ్చి’ అనేది సందర్భానికి తగిన సహజమైన తెలుగు ప్రయోగం.
- source_word: αὐτὸν
  choice: ఆ గాడిద పిల్లను
  rationale: గ్రీకులోని పురుషలింగ సర్వనామం ముందుగా ప్రస్తావించిన πῶλος‌ను సూచిస్తుంది. తెలుగులో సూచిత విషయాన్ని స్పష్టంగా తెలియజేయడానికి నామవాచకాన్ని పునరుక్తి చేయడం సహజం.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: యేసు దగ్గరికి
  rationale: πρός + ద్వితీయా విభక్తి ఒక వ్యక్తి వైపు కదలికను సూచిస్తుంది. ‘యేసు దగ్గరికి’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: ἐπιρίψαντες
  choice: వేసి
  rationale: ఈ భూతకాల అసమాపక క్రియ ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచిస్తుంది. తెలుగు వరుస క్రియారూపమైన ‘వేసి’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: αὐτῶν τὰ ἱμάτια
  choice: తమ పైవస్త్రాలు
  rationale: ἱμάτια సాధారణంగా వెలుపల ధరించే వస్త్రాలను సూచిస్తుంది. ‘పైవస్త్రాలు’ అర్థాన్ని స్పష్టంగా ఉంచుతుంది; ‘తమ’ ద్వారా వస్త్రాలు అదే కర్తలకు చెందినవని తెలుస్తుంది.
- source_word: πῶλον
  choice: గాడిద పిల్లను
  rationale: πῶλος ఒక చిన్న వాహన జంతువును సూచించగలదు; సమీప సందర్భం అది గాడిద పిల్ల అని నిర్ధారిస్తుంది. తెలుగులో కేవలం ‘పిల్ల’ అని అనడం అస్పష్టంగా ఉండేందున సందర్భసిద్ధమైన జంతువు పేరును చేర్చాం.
- source_word: ἐπεβίβασαν
  choice: ఎక్కించారు
  rationale: ఈ క్రియ ఒకరిని వాహన జంతువుపై ఎక్కేలా చేయడం అనే causative భావాన్ని కలిగిస్తుంది. ‘ఎక్కించారు’ ఆ భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: τὸν Ἰησοῦν
  choice: యేసును
  rationale: Ἰησοῦς అనే వ్యక్తిపేరుకు ప్రామాణిక తెలుగు రూపం ‘యేసు’; వాక్యంలో కర్మగా ఉన్నందున ‘యేసును’ అని ఇచ్చాం.
