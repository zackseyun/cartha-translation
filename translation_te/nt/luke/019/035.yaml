  source_fidelity: 'The Telugu accurately represents the Greek sequence: they brought the colt to Jesus, laid their own outer garments on it, and caused Jesus to mount it. Making αὐτόν explicit as “ఆ గాడిద పిల్లను” is contextually justified by the immediately preceding narrative. “ఎక్కించారు” preserves the causative force of ἐπεβίβασαν.'
