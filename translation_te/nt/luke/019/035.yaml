  terminology: “పైవస్త్రాలు” appropriately conveys ἱμάτια as outer garments, and “గాడిద పిల్ల” is contextually accurate for πῶλος. The name “యేసు” is standard. The footnote is compatible with the source’s lexical breadth while explaining the contextual identification.
