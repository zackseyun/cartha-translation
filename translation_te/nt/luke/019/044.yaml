id: LUK.19.44
reference: Luke 19:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐδαφιοῦσίν σε καὶ τὰ τέκνα σου ἐν σοί, καὶ οὐκ ἀφήσουσιν ⸂λίθον ἐπὶ λίθον ἐν σοί⸃, ἀνθ’ ὧν οὐκ ἔγνως τὸν καιρὸν τῆς ἐπισκοπῆς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/044.yaml
  text: and they will level you to the ground[a], and your children within you, and they will not leave one stone upon another within you, because you did not recognize the time of your visitation.
translation:
  language: te
  text: నిన్నూ, నీలో ఉన్న నీ పిల్లలనూ వారు నేలమట్టం చేస్తారు; నీలో ఒక రాయి మీద మరొక రాయి నిలిచి ఉండనివ్వరు. ఎందుకంటే నిన్ను సందర్శించిన సమయాన్ని[a] నీవు గుర్తించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిన్ను పరిశీలించిన సమయాన్ని.’ గ్రీకు పదం సందర్శనను లేదా పరిశీలనను సూచించగలదు; ముఖ్యంగా, కరుణనైనా తీర్పునైనా తీసుకురాగల దైవిక సందర్శనాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδαφιοῦσίν
  choice: నేలమట్టం చేస్తారు
  rationale: నేల వరకు కూలదోయడం, పూర్తిగా ధ్వంసం చేయడం అనే బలమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: σε
  choice: నిన్ను
  rationale: యెరూషలేమును వ్యక్తిగా సంబోధిస్తున్న గ్రీకు ద్వితీయ పురుష ఏకవచనాన్ని యథాతథంగా నిలుపుతుంది; ‘నీ పట్టణాన్ని’ అని వివరణాత్మకంగా మార్చదు.
- source_word: τὰ τέκνα σου ἐν σοί
  choice: నీలో ఉన్న నీ పిల్లలను
  rationale: τέκνα యొక్క ‘పిల్లలు’ అనే అక్షరార్థాన్నీ, తల్లిగా వ్యక్తీకరించబడిన పట్టణం అనే రూపకాన్నీ నిలుపుతుంది; సందర్భంలోని నివాసులను సూచించినా దానిని ‘నివాసులు’గా చదును చేయదు.
- source_word: οὐκ ἀφήσουσιν λίθον ἐπὶ λίθον ἐν σοί
  choice: నీలో ఒక రాయి మీద మరొక రాయి నిలిచి ఉండనివ్వరు
  rationale: సంపూర్ణ విధ్వంసాన్ని తెలిపే నుడికారాన్ని సహజంగా అందిస్తూ, ἐν σοί అనే ‘నీలో’ను స్పష్టంగా ఉంచుతుంది.
- source_word: ἀνθ’ ὧν
  choice: ఎందుకంటే
  rationale: ఇక్కడ రాబోయే తీర్పుకు కారణాన్ని పరిచయం చేసే ప్రయోగాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἔγνως
  choice: గుర్తించలేదు
  rationale: దేవుని నిర్ణాయక కార్యాన్ని గ్రహించకపోవడం లేదా గుర్తుపట్టకపోవడం అనే సందర్భోచిత భావాన్ని ‘తెలుసుకోలేదు’ కంటే స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: καιρὸν
  choice: సమయాన్ని
  rationale: ప్రాముఖ్యమైన లేదా నియమిత సందర్భం అనే καιρός భావాన్ని సందర్భమే వెల్లడించేలా సంక్షిప్తంగా, సహజంగా అనువదిస్తుంది.
- source_word: τῆς ἐπισκοπῆς σου
  choice: నిన్ను దర్శించిన
  rationale: σουతో సంబంధమున్న ἐπισκοπήని సహజ తెలుగులో వ్యక్తం చేస్తూ, దైవిక దర్శనం దయనో తీర్పునో తెచ్చే అవకాశమున్న మూలపద విస్తృతిని ప్రధాన పాఠ్యంలో అతిగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: తీర్పు సందర్భంలో ἐπισκοπή అర్థం
  choice: ‘నిన్ను దర్శించిన సమయం’ అని అనువదించి, దైవిక దర్శనం అనే సూచనను అంతర్లీనంగా ఉంచడం
  alternative: ‘నిన్ను తనిఖీ చేసిన సమయం’ లేదా ‘దేవుడు నిన్ను దర్శించిన సమయం’
  rationale: ఈ పదం కృపకోసం లేదా తీర్పుకోసం జరిగే దైవిక దర్శనాన్ని సూచించగలదు. ఇక్కడి సందర్భం యెరూషలేముపై తీర్పును సూచించినా, గ్రీకు నామవాచకం దేవుణ్ణి స్పష్టంగా పేర్కొనదు. అందువల్ల theological tension‌ను అతిగా పరిష్కరించకుండా ‘దర్శించిన’ అని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. యెరూషలేమును వ్యక్తిగా, తల్లిగా సంబోధించే రూపకాన్ని ‘నిన్ను,’ ‘నీలో,’ ‘నీ పిల్లలు’ ద్వారా నిలుపుకుంది. [a] గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
