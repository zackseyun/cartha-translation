  text: And as he drew near[a], seeing the city, he wept over it,
translation:
  language: te
  text: ఆయన చేరువకు రాగానే, ఆ నగరాన్ని చూసి దానికోసం ఏడ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘దానికోసం’ అనే స్థానంలో స్త్రీలింగ సర్వనామం ఉంది; అది ‘నగరం’ అనే పదంతో వ్యాకరణపరంగా సరిపోతుంది. యెరూషలేమును వ్యక్తీకరిస్తూ ‘ఆమె కోసం’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: గ్రీకు స్త్రీలింగ సర్వనామం మరియు యెరూషలేము వ్యక్తీకరణకు ఉన్న సాధ్యమైన సూచనను భద్రపరచడానికి.
lexical_decisions:
- source_word: ὡς ἤγγισεν
  choice: ఆయన సమీపానికి వచ్చినప్పుడు
  rationale: ἐγγίζω అంటే సమీపించడం లేదా దగ్గరకు రావడం. గ్రీకులో దేనికి సమీపించాడో స్పష్టంగా చెప్పలేదు; సందర్భం దాన్ని తెలియజేస్తుంది కాబట్టి తెలుగులోనూ అదనంగా ‘నగరానికి’ అని చేర్చలేదు.
- source_word: ἰδὼν
  choice: ఆ నగరాన్ని చూసి
  rationale: ఈ భూతకాల క్రియావిశేష రూపం ప్రధాన క్రియకు ముందు లేదా దానితో సన్నిహితంగా జరిగిన చూడడాన్ని సూచిస్తుంది. ‘చూసి’ తెలుగు వాక్యప్రవాహంలో ఆ సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: τὴν πόλιν
  choice: ఆ నగరాన్ని
  rationale: πόλις అంటే ‘నగరం.’ సందర్భంలో అది యెరూషలేము అని స్పష్టంగా ఉన్నందున, మూలంలోని సంక్షిప్తతను కాపాడుతూ పేరును విస్తరించి చేర్చలేదు.
- source_word: ἔκλαυσεν
  choice: కన్నీరు పెట్టుకున్నాడు
  rationale: κλαίω ఏడవడం లేదా కన్నీరు కార్చడాన్ని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం భావోద్వేగ గంభీరతను సహజంగా తెలియజేస్తుంది; మూలంలో స్పష్టంగా లేని అదనపు తీవ్రతను చేర్చదు.
- source_word: ἐπ’ αὐτήν
  choice: దాని గురించి
  rationale: κλαίωతో కూడిన ἐπί + accusative ఎవరి లేదా దేని విషయంగా దుఃఖించి ఏడవడాన్ని సూచిస్తుంది. ‘దాని గురించి’ ఆధునిక తెలుగులో నగరాన్ని సూచిస్తూ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: πόλιςకు అనుగుణంగా ఉన్న స్త్రీలింగ సర్వనామాన్ని వ్యక్తీకరణగా చూపాలా
  choice: నగరాన్ని సూచించడానికి ‘దాని’ వాడటం
  alternative: యెరూషలేమును స్త్రీగా వ్యక్తీకరిస్తూ ‘ఆమె గురించి’ అనడం
  rationale: గ్రీకులో αὐτήν స్త్రీలింగంలో ఉండటం πόλις అనే వ్యాకరణ స్త్రీలింగ నామవాచకంతో సాధారణ అన్వయం. తెలుగు ‘నగరం’ నపుంసకలింగం కాబట్టి ‘దాని’ సహజం. ఈ వాక్యం ఒక్కటే స్త్రీ వ్యక్తీకరణను తప్పనిసరి చేయదు; అయితే తరువాతి విలాప సందర్భంలో యెరూషలేము వ్యక్తీకరణగా వినిపించే అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని క్రమాన్ని యథాశక్తి నిలుపుతూ తెలుగు సహజత్వం కోసం అసమాపక క్రియ ‘చూసి’ వాడబడింది.
