id: LUK.19.31
reference: Luke 19:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμᾶς ἐρωτᾷ· Διὰ τί λύετε; οὕτως ⸀ἐρεῖτε ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/031.yaml
  text: 'And if anyone asks you[a], ‘Why are you untying it?’ you shall say this: ‘The Lord has need of it.’'
translation:
  language: te
  text: ఎవరైనా మిమ్మల్ని, “దాన్ని ఎందుకు విప్పుతున్నారు?” అని అడిగితే, “ప్రభువుకు అది అవసరం” అని చెప్పండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యజమానికి అది అవసరం.”
    reason: κύριος అనే పదానికి ఈ సందర్భంలో ‘ప్రభువు’తో పాటు ‘యజమాని’ అనే సాధ్యమైన అర్థం కూడా ఉంది. ఈ పాదసూచిక ఆ పదంలోని అస్పష్టతను మాత్రమే సూచిస్తుంది; αὐτοῦను గాడిదపిల్లను సూచించే ‘అది’గానే ఉంచుతుంది.
lexical_decisions:
- source_word: ἐρωτᾷ
  choice: అడిగితే
  rationale: ప్రత్యక్ష ప్రశ్న అడగడాన్ని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: Διὰ τί
  choice: ఎందుకు
  rationale: కారణాన్ని అడిగే గ్రీకు పదబంధానికి సహజమైన తెలుగు ప్రశ్నార్థక రూపం.
- source_word: λύετε
  choice: దాన్ని ... విప్పుతున్నారు
  rationale: కట్టివున్న గాడిదపిల్లను విడదీయడమే సందర్భార్థం; గ్రీకులో అంతర్లీనంగా ఉన్న కర్మను తెలుగులో స్పష్టత కోసం ‘దాన్ని’గా వ్యక్తం చేశాం.
- source_word: οὕτως ἐρεῖτε
  choice: '... అని చెప్పండి'
  rationale: భవిష్యత్ సూచనకు ఉన్న ఆదేశాత్మక బలాన్ని సహజమైన తెలుగు ఆజ్ఞారూపంలో వ్యక్తం చేస్తుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: యేసును సూచించే బిరుదు మరియు దాని ధార్మిక ప్రతిధ్వని రెండింటినీ నిలుపుతుంది; ‘యజమాని’ అనే సాధ్యమైన సాధారణ అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: αὐτοῦ
  choice: అది
  rationale: సమీప సందర్భంలోని గాడిదపిల్లనే సర్వనామం సహజంగా సూచిస్తుంది.
- source_word: χρείαν ἔχει
  choice: అవసరం
  rationale: ‘అవసరం కలిగి ఉన్నాడు’ అనే కృత్రిమ పదక్షర నిర్మాణం కాకుండా, గ్రీకు నుడికారాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: Ὁ κύριος యొక్క భావం, సూచ్యుడు
  choice: ప్రభువు
  alternative: యజమాని
  rationale: లూకా కథనంలో ఇది యేసును సూచించే బిరుదుగా వినిపించే అవకాశం బలంగా ఉంది. అయితే κύριος పదానికి ఈ సందర్భంలో ‘యజమాని’ అనే వ్యవహారిక భావం కూడా సాధ్యమే; ఆ అస్పష్టతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. బహువచన సంబోధనకు ‘మిమ్మల్ని/విప్పుతున్నారు’ వాడి, ఆదేశాన్ని ‘చెప్పండి’గా సహజీకరించాం.
