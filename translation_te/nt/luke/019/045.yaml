lexical_decisions:
- source_word: εἰσελθὼν
  choice: ప్రవేశించి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచించే భూతకాల క్రియావిశేషణాన్ని సహజమైన ఆధునిక తెలుగులో క్రమాన్ని నిలుపుతూ అనువదిస్తుంది.
- source_word: ἱερὸν
  choice: దేవాలయ ప్రాంగణం
  rationale: ἱερόν అనేది అంతర్గత పరిశుద్ధ స్థలాన్ని మాత్రమే కాక, విస్తృత దేవాలయ సముదాయాన్ని సూచిస్తుంది. సంఘటన జరిగిన బాహ్య ప్రాంగణాల భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἤρξατο
  choice: మొదలుపెట్టాడు
  rationale: అనంతరూప క్రియతో కూడిన ἄρχομαι యొక్క ఆరంభార్థాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐκβάλλειν
  choice: వెళ్లగొట్టడం
  rationale: బలవంతంగా బయటకు పంపే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: πωλοῦντας
  choice: అక్కడ అమ్ముతున్నవారిని
  rationale: అమ్మే పనిలో నిమగ్నమైన వ్యక్తులను సూచించే వర్తమాన కృదంత భావాన్ని నిలుపుతుంది; వారు ఏమి అమ్ముతున్నారో మూలవచనం చెప్పనందున దానిని చేర్చదు. 'అక్కడ' అనేది తెలుగు వాక్య సహజత్వం కోసం సందర్భస్థలాన్ని తిరిగి సూచిస్తుంది.
theological_decisions:
- issue: యేసు చేసిన చర్యకు సంబంధించి ἱερόν యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘దేవాలయ ప్రాంగణం’
  alternative: ‘దేవాలయం’; ‘దేవాలయ ఆవరణ’; ‘పరిశుద్ధ స్థలం’
  rationale: గ్రీకు ἱερόν సాధారణంగా మొత్తం దేవాలయ సముదాయాన్ని సూచిస్తుంది; అంతర్గత పరిశుద్ధ స్థలానికి ప్రత్యేకంగా వాడే ναός భావాన్ని దీనిపై మోపకుండా ‘దేవాలయ ప్రాంగణం’ స్థలపరమైన పరిధిని స్పష్టంగా నిలుపుతుంది.
