translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. స్థలనామాలు ‘బేత్ఫగే’, ‘బేతనియ’గా లిప్యంతరీకరించబడ్డాయి. మూలంలోని దీర్ఘ వాక్య సంబంధాన్ని నిలుపుతూ, తెలుగు పఠన సౌలభ్యం కోసం మధ్యలో డాష్‌లతో వివరణాత్మక భాగాన్ని వేరు చేసింది.
