revisions:
- from: ఆయన బేత్ఫగేకు, బేతనియకు సమీపించినప్పుడు—అవి ఒలీవులని పిలిచే కొండ వైపున ఉన్నాయి[a]—శిష్యులలో ఇద్దరిని పంపాడు.
  to: ఆయన ఒలీవల కొండ వైపున ఉన్న బేత్ఫగే, బేతనియల దగ్గరకు వచ్చినప్పుడు, శిష్యులలో ఇద్దరిని పంపాడు.
  rationale: The revision removes the unsupported parenthetical location statement and expresses the geographical relation in the narrative clause. It uses the standard Telugu place designation "ఒలీవల కొండ," preserves the temporal clause, and retains the source's indefinite partitive expression.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T01:18:06Z'
review_pass:
  verdict: revise
  source_fidelity: The draft incorrectly turns the phrase about the Mount of Olives into a parenthetical assertion that Bethphage and Bethany "are" located there. In Greek, πρὸς τὸ ὄρος modifies Jesus' approach, and τὸ καλούμενον introduces the mountain's designation. The revision retains the narrative sequence and the partitive sense of "two of the disciples."
  naturalness: The draft's dash-bound parenthesis is syntactically awkward and disrupts the narrative. The revised sentence uses fluent modern standard Telugu while keeping the single-sentence structure.
  terminology: '"ఒలీవల కొండ" is the natural established Telugu designation for the Mount of Olives. "శిష్యులలో ఇద్దరు" accurately represents δύο τῶν μαθητῶν without inserting "his."'
  issues:
  - severity: high
    issue: The main text changes the syntactic and narrative relationship of the locations to the mountain.
    rationale: '"అవి ఒలీవులని పిలిచే కొండ వైపున ఉన్నాయి" makes Bethphage and Bethany the subject and states that they are situated toward a mountain. The Greek says Jesus came near Bethphage and Bethany in the direction of the mount called Olives.'
  - severity: medium
    issue: The phrase "ఒలీవులని పిలిచే కొండ" is not a natural Telugu rendering of the proper designation.
    rationale: It can sound as though the mountain itself is called "olives" rather than conveying the conventional place-name "Mount of Olives." "ఒలీవల కొండ" is clear and idiomatic.
  - severity: medium
    issue: The footnote repeats the changed syntax and does not provide a valid lexical alternative for the source phrase.
    rationale: The source phrase concerns the mountain's name, not a proposition that the two villages are located toward it; the misleading note should be removed.
  revised_text: ఆయన ఒలీవల కొండ వైపున ఉన్న బేత్ఫగే, బేతనియల దగ్గరకు వచ్చినప్పుడు, శిష్యులలో ఇద్దరిని పంపాడు.
  revised_footnotes: []
  revision_rationale: The revision removes the unsupported parenthetical location statement and expresses the geographical relation in the narrative clause. It uses the standard Telugu place designation "ఒలీవల కొండ," preserves the temporal clause, and retains the source's indefinite partitive expression.
