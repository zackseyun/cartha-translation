  edition: SBLGNT
  text: Καὶ ἐγένετο ὡς ἤγγισεν εἰς Βηθφαγὴ καὶ Βηθανίαν πρὸς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν, ἀπέστειλεν δύο τῶν ⸀μαθητῶν
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/029.yaml
  text: And it happened that[a], as he came near to Bethphage and Bethany, toward the mount called Olives, he sent two of the disciples
translation:
  language: te
  text: ఆయన ఒలీవల కొండ వైపున ఉన్న బేత్ఫగే, బేతనియల దగ్గరకు వచ్చినప్పుడు, శిష్యులలో ఇద్దరిని పంపాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: ప్రత్యేక పదబంధంగా అనువదించకుండా సహజ కథన వాక్య నిర్మాణంలో వ్యక్తీకరించబడింది
  rationale: లూకా ఉపయోగించే ఈ కథన సూత్రాన్ని తెలుగులో అక్షరార్థంగా ‘అలా జరిగింది’ అని ఉంచితే వాక్యం అసహజంగా ఉంటుంది. కాలవాచక ఉపవాక్యంతో కథనం సహజంగా ముందుకు సాగుతుంది.
- source_word: ὡς
  choice: …సమీపించినప్పుడు
  rationale: ఇక్కడ ὡς కాలసంబంధాన్ని సూచిస్తుంది. ‘సమీపిస్తుండగా’ కూడా సాధ్యమే; అయితే అఓరిస్టు క్రియతో ‘సమీపించినప్పుడు’ సహజమైన ఆధునిక తెలుగు.
- source_word: ἤγγισεν εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: బేత్ఫగేకు, బేతనియకు సమీపించినప్పుడు
  rationale: ἐγγίζω యొక్క ‘దగ్గరకు రావడం’ అనే భావాన్ని, εἰς తో ఉన్న స్థలనామాలను తెలుగులో సహజంగా ‘-కు సమీపించు’ నిర్మాణంతో వ్యక్తం చేసింది.
- source_word: πρὸς τὸ ὄρος
  choice: కొండ వైపున
  rationale: πρός ఇక్కడ ఆ ప్రదేశాలు కొండకు సంబంధించి ఉన్న దిశ/స్థానాన్ని సూచిస్తుంది. ὄρος కు సందర్భానుకూలంగా ‘కొండ’ సాధారణ పాఠకులకు సహజం.
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: ఒలీవులని పిలిచే కొండ
  rationale: గ్రీకులోని సంక్షిప్త ‘ఒలీవులని పిలువబడే’ రూపాన్ని సాధ్యమైనంత దగ్గరగా నిలిపింది; ప్రసిద్ధ విస్తృత రూపం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: ἀπέστειλεν
  choice: పంపాడు
  rationale: సాధారణ కథన అఓరిస్టుకు సహజమైన, ఖచ్చితమైన తెలుగు క్రియ.
- source_word: δύο τῶν μαθητῶν
  choice: శిష్యులలో ఇద్దరిని
  rationale: భాగార్థక షష్ఠీ నిర్మాణాన్ని సహజ తెలుగులో తెలిపింది. గ్రీకులో స్పష్టంగా లేని ‘తన’ అనే స్వామ్యపదాన్ని చేర్చలేదు.
