source:
  edition: SBLGNT
  text: λυόντων δὲ αὐτῶν τὸν πῶλον εἶπαν οἱ κύριοι αὐτοῦ πρὸς αὐτούς· Τί λύετε τὸν πῶλον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/033.yaml
  text: And as they were untying the colt[a], its owners said to them, “Why are you untying the colt?”
translation:
  language: te
  text: 'వారు ఆ గాడిదపిల్లను విప్పుతుండగా, దాని యజమానులు వారితో ఇలా అన్నారు: “మీరు ఆ గాడిదపిల్లను ఎందుకు విప్పుతున్నారు?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λυόντων
  choice: విప్పుతుండగా
  rationale: వర్తమాన కృదంతంతో కూడిన genitive absolute ప్రధాన క్రియతో సమకాలీనమైన చర్యను సూచిస్తుంది. కట్టివున్న జంతువును విడదీయడాన్ని సహజంగా తెలిపేందుకు ‘విప్పు’ సరిపోతుంది; తరువాతి λύετεతో పదసామ్యమూ నిలుస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప కథన అనుసంధానకంగా ఉంది. తెలుగులో ‘వారు…ఉండగా’ అనే నిర్మాణమే ప్రవాహాన్ని సహజంగా కొనసాగిస్తుంది; ‘అయితే’ అనడం లేని వ్యత్యాసాన్ని బలపరుస్తుంది.
- source_word: αὐτῶν
  choice: వారు
  rationale: ఇది ముందటి సందర్భంలోని ఇద్దరు శిష్యులను సూచించే సర్వనామం. సందర్భంలో లేనిదాన్ని చేర్చకుండా సాధారణ సర్వనామాన్ని ఉంచాం.
- source_word: πῶλον
  choice: గాడిదపిల్లను
  rationale: πῶλος సాధారణంగా చిన్న వయస్సు జంతువును సూచించినా, ముందటి సందర్భం ఇది గాడిదపిల్ల అని నిర్దిష్టం చేస్తుంది. ఆధునిక తెలుగులో ‘గాడిదపిల్ల’ స్పష్టమైన, సహజమైన పదం.
- source_word: εἶπαν
  choice: అన్నారు
  rationale: λέγω యొక్క సాధారణ అర్థం ‘చెప్పు/అను.’ మాట ప్రశ్న రూపంలో ఉన్నప్పటికీ మూలంలోని సాధారణ speech verbను నిలిపాం.
- source_word: οἱ κύριοι αὐτοῦ
  choice: దాని యజమానులు
  rationale: κύριοι ఇక్కడ దైవిక బిరుదు కాదు; గాడిదపిల్లపై హక్కుగల మానవులను సూచిస్తుంది. బహువచనాన్ని నిలుపుతూ ‘యజమానులు’ సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: πρὸς αὐτούς
  choice: వారితో
  rationale: మాట్లాడే క్రియతో πρός + accusative ఇక్కడ సంబోధితులను సూచిస్తుంది. తెలుగులో ‘వారితో … అన్నారు’ సహజ నిర్మాణం.
- source_word: Τί
  choice: ఎందుకు
  rationale: పదశః ‘ఏమి?’ అయినా ఈ ప్రశ్నలో చర్యకు కారణాన్ని అడుగుతోంది; తెలుగులో ‘ఎందుకు’ దాని ప్రయోగార్థాన్ని సరిగ్గా తెలియజేస్తుంది.
- source_word: λύετε
  choice: విప్పుతున్నారు
  rationale: వర్తమానకాల ప్రశ్నలో కొనసాగుతున్న చర్యను తెలుపుతుంది. ముందటి λυόντωνకు వాడిన ‘విప్పు’నే పునరావృతం చేసి మూలంలోని పదబంధ సంబంధాన్ని నిలిపాం.
theological_decisions:
- issue: దైవిక బిరుదుగా తరచు వాడే κύριοι పదాన్ని ఇక్కడ మానవ యాజమాన్య సందర్భంలో అనువదించడం
  choice: యజమానులు
  alternative: ప్రభువులు / అధిపతులు
  rationale: ఇక్కడ οἱ κύριοι αὐτοῦ గాడిదపిల్లకు చెందిన మానవ యజమానులను సూచిస్తుంది. ‘ప్రభువులు’ అనవసరమైన దైవిక ప్రతిధ్వనిని కలిగించవచ్చు; ‘అధిపతులు’ ఈ సాధారణ సందర్భంలో కృత్రిమంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని బహువచన ‘యజమానులు,’ సమకాలీన చర్య, అలాగే λυόντων/λύετε పదపునరావృతం నిలుపబడ్డాయి. అనువాదంలో ఫుట్‌నోట్ అవసరం లేదు; అందువల్ల ప్రధాన పాఠ్యంలో ఫుట్‌నోట్ సూచిక లేదు.
