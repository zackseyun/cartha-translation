id: LUK.19.25
reference: Luke 19:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπαν αὐτῷ· Κύριε, ἔχει δέκα μνᾶς—
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/025.yaml
  text: And they said to him[a], ‘Lord[b], he has ten minas—’
translation:
  language: te
  text: వారు అతనితో, “ప్రభువా,[a] ఇతనికి పది మినాలు[b] ఉన్నాయి—” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అయ్యా” లేదా “యజమానీ.”
    reason: lexical_alternative
  - marker: b
    text: మినా అనేది ప్రాచీన ద్రవ్య ప్రమాణం; అది సుమారు వంద రోజుల కూలికి సమానం.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: అప్పుడు
  rationale: సరళమైన కథన అనుసంధానాన్ని సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది; గ్రీకులో స్పష్టమైన విరోధార్థం లేదు.
- source_word: εἶπαν αὐτῷ
  choice: వారు అతనితో … అన్నారు
  rationale: అనిర్దిష్ట బహువచన కర్తను, పరోక్ష కర్మను సహజమైన తెలుగు వాక్యక్రమంలో నిలుపుతుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: κύριος సంబోధనా రూపంలోని అధికార, గౌరవ భావాలను కాపాడుతుంది; ఉపమానంలోని సందర్భంలో ఇది గౌరవ సంబోధనగానూ అర్థం కావచ్చు.
- source_word: ἔχει
  choice: ఇతనికి … ఉన్నాయి
  rationale: స్వాధీనాన్ని తెలిపే వర్తమాన క్రియకు సహజమైన తెలుగు ప్రయోగం; మూలంలో లేని ‘ఇప్పటికే’ వంటి అదనపు ఉద్ఘాటనను చేర్చదు.
- source_word: δέκα
  choice: పది
  rationale: సంఖ్యను నేరుగా అనువదిస్తుంది.
- source_word: μνᾶς
  choice: మినాలు
  rationale: ప్రాచీన ద్రవ్య ప్రమాణాన్ని ఆధునిక కరెన్సీతో తప్పుదారి పట్టించేలా సమానీకరించకుండా లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: ఉపమానంలోని ప్రత్యక్ష సంబోధనలో κύριος అనువాదం
  choice: ప్రభువా
  alternative: అయ్యా; యజమానీ
  rationale: అధికార భావంతో కూడిన మూల పదానికి ప్రధాన సమానార్థాన్ని నిలుపుతుంది. అయితే ఇది తప్పనిసరిగా క్రీస్తును గూర్చిన విశ్వాస ప్రకటన అని నిర్ణయించకుండా, సందర్భానుసారమైన గౌరవ సంబోధన కావచ్చనే సందిగ్ధతను పాదటిప్పణిలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. అసంపూర్ణంగా నిలిచే అభ్యంతరాన్ని సూచించే మూలంలోని విరామాన్ని దీర్ఘరేఖతో కాపాడాం.
