  text: Καὶ εἰπὼν ταῦτα ἐπορεύετο ἔμπροσθεν ἀναβαίνων εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/028.yaml
  text: And after saying these things, he went on ahead, going up to Jerusalem.
translation:
  language: te
  text: ఈ మాటలు చెప్పిన తరువాత, ఆయన యెరూషలేముకు పైకి వెళ్తూ ముందుకు సాగాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: తెలుగులో వాక్యారంభంలోని ‘మరియు’ సహజంగా ఉండదు. ముందున్న సంఘటనతో క్రమసంబంధం ‘చెప్పిన తరువాత’ అనే నిర్మాణంలో స్పష్టంగా ఉంది.
- source_word: εἰπὼν ταῦτα
  choice: ఆ మాటలు చెప్పిన తరువాత
  rationale: Aorist participle ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచిస్తుంది. ‘ఆ మాటలు’ అనేది ముందటి ప్రసంగాన్ని సహజంగా సూచిస్తూ, కేవలం ఒకే మాటగా అర్థాన్ని కుదించదు.
- source_word: ἐπορεύετο
  choice: సాగిపోయాడు
  rationale: Imperfect రూపంలోని కొనసాగుతున్న ప్రయాణ భావాన్ని తెలుగులో సహజమైన కథనశైలితో వ్యక్తం చేస్తుంది.
- source_word: ἔμπροσθεν
  choice: ముందుగా
  rationale: ఇతరుల కంటే ముందు నడిచిన భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; మూలంలో స్పష్టంగా లేని కర్మను చేర్చదు.
- source_word: ἀναβαίνων
  choice: ఎక్కి వెళ్తూ
  rationale: యెరూషలేమువైపు ఉన్న ఆరోహణ భావాన్ని తొలగించకుండా, ప్రధాన క్రియతో ఏకకాలంలో సాగుతున్న చర్యగా చూపుతుంది.
- source_word: εἰς Ἱεροσόλυμα
  choice: యెరూషలేముకు
  rationale: ఇక్కడ εἰς గమ్యస్థానంవైపు ప్రయాణాన్ని సూచిస్తుంది; నగరంలోకి ప్రవేశించాడని అవసరానికి మించి చెప్పదు.
theological_decisions:
- issue: యెరూషలేముకు వెళ్లడాన్ని ఆరోహణ భాషతో నిలుపాలా?
  choice: ‘యెరూషలేముకు ఎక్కి వెళ్తూ’ అని అనువదించడం
  alternative: ‘యెరూషలేముకు ప్రయాణిస్తూ’ / ‘యెరూషలేముకు వెళ్తూ’
  rationale: ἀναβαίνων లోని ‘పైకి వెళ్లడం’ అనే నిజమైన భావాన్ని ఇది నిలుపుతుంది. దానికి భౌగోళిక మరియు కథనపరమైన ప్రతిధ్వనులు ఉన్నా, అనువాదం అదనపు ధార్మిక వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని రెండు participle నిర్మాణాల కాలసంబంధాన్ని ‘చెప్పిన తరువాత’ మరియు ‘ఎక్కి వెళ్తూ’ ద్వారా స్పష్టంగా నిలిపాం.
