source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς ὅτι Σήμερον σωτηρία τῷ οἴκῳ τούτῳ ἐγένετο, καθότι καὶ αὐτὸς υἱὸς Ἀβραάμ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/009.yaml
  text: And Jesus said to him[a], “Today salvation has come to this house, because he too is a son of Abraham.”
translation:
  language: te
  text: 'యేసు అతనితో ఇలా అన్నాడు: “ఈ రోజు ఈ ఇంటికి[a] రక్షణ వచ్చింది, ఎందుకంటే ఇతడూ అబ్రాహాము కుమారుడే.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ ఇంటివారికి రక్షణ వచ్చింది.” గ్రీకు పదం ఇంటినే గానీ, ఆ ఇంటితో అనుబంధమైన ఇంటివారిని గానీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: అప్పుడు ... అన్నాడు
  rationale: δέ స్వల్ప కథన అనుసంధానాన్ని సూచిస్తుంది. తెలుగులో ‘అప్పుడు’ సహజమైన కథన ప్రవాహాన్ని ఇస్తుంది; బలమైన వ్యతిరేక భావాన్ని చేర్చదు.
- source_word: πρὸς αὐτὸν
  choice: అతనితో
  rationale: గ్రీకు మూలంలోని సర్వనామాన్ని అలాగే ఉంచి, ఈ వచనంలో లేని ‘జక్కయ్య’ అనే పేరును చేర్చలేదు.
- source_word: Σήμερον
  choice: ఇవాళ
  rationale: ముందుభాగంలో ఉన్న కాల ప్రాధాన్యాన్ని నిలిపే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: σωτηρία
  choice: రక్షణ
  rationale: లూకా రచనలో ఈ పదానికి సాధారణ విడిపింపు కంటే విస్తృతమైన ఆధ్యాత్మిక, దైవసంబంధ భావభారం ఉంది; ‘రక్షణ’ దానిని నిలుపుతుంది.
- source_word: τῷ οἴκῳ τούτῳ
  choice: ఈ ఇంటికి
  rationale: దత్తి విభక్తి భావాన్ని ‘ఇంటికి’ సహజంగా వ్యక్తపరుస్తుంది. οἶκος భవనాన్నీ, దానితో అనుబంధమైన ఇంటివారినీ సూచించగల అస్పష్టతను ప్రధాన పాఠంలో ‘ఇల్లు’ ద్వారా ఉంచి, పాదసూచికలో వివరిస్తుంది.
- source_word: ἐγένετο
  choice: వచ్చింది
  rationale: γίνομαι యొక్క ‘సంభవించింది/కలిగింది’ భావాన్ని, σωτηρίαతో కలిసిన సందర్భంలో సహజమైన తెలుగు నుడికారంగా ‘రక్షణ వచ్చింది’ వ్యక్తపరుస్తుంది.
- source_word: καθότι
  choice: ఎందుకంటే
  rationale: యేసు చేసిన ప్రకటనకు కారణాన్ని స్పష్టంగా, ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: καὶ αὐτὸς
  choice: ఇతడు కూడా
  rationale: καί యొక్క చేర్పు ప్రాధాన్యాన్ని సహజంగా నిలుపుతుంది; ప్రత్యక్ష ఉక్తిలో సూచిత వ్యక్తిని ‘ఇతడు’ అనడం తెలుగు నుడికారానికి అనుకూలం.
- source_word: υἱὸς Ἀβραάμ
  choice: అబ్రాహాము కుమారుడు
  rationale: మూలంలోని ఏకవచన పుంలింగ బంధుత్వ రూపకాన్ని, దాని వంశ మరియు నిబంధన సంబంధ ప్రతిధ్వనులతో సహా నిలుపుతుంది.
theological_decisions:
- issue: ‘అబ్రాహాము కుమారుడు’ అనే మాట యొక్క భావం
  choice: వంశసంబంధం, నిబంధన సమాజంలో చెందినవాడనే భావం, లేదా రెండింటిలో ఏదో ఒకదానిగా పరిమితం చేయకుండా మూల నుడికారాన్ని ఉంచడం
  alternative: ‘అబ్రాహాము వంశస్థుడు’ లేదా ‘అబ్రాహాము విశ్వాస కుటుంబానికి చెందినవాడు’ అని స్పష్టీకరించడం
  rationale: ఈ వచనం ఒక్కటే ఆ భావాన్ని జాతిపరమైన వంశానికో, విశ్వాస సంబంధిత సభ్యత్వానికో పరిమితం చేయదు. ‘అబ్రాహాము కుమారుడు’ అనే రూపం ఆ వేదాంతపరమైన ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇవాళ,’ ‘అతనితో,’ ‘ఇతడు కూడా’ వంటి రూపాలు సాధారణ పాఠకులకు స్పష్టంగా ఉంటాయి. పాదసూచిక గుర్తును సంబంధిత వాక్యం చివర ఉంచి, οἶκος యొక్క భావ పరిధిని నమోదు చేశాం.
