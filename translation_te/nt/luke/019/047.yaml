id: LUK.19.47
reference: Luke 19:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἦν διδάσκων τὸ καθ’ ἡμέραν ἐν τῷ ἱερῷ· οἱ δὲ ἀρχιερεῖς καὶ οἱ γραμματεῖς ἐζήτουν αὐτὸν ἀπολέσαι καὶ οἱ πρῶτοι τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/047.yaml
  text: And he was teaching day by day in the temple. But the chief priests and the scribes[a], and the leading men of the people, were seeking to destroy him,
translation:
  language: te
  text: ఆయన ప్రతిరోజూ దేవాలయంలో బోధిస్తూ ఉండేవాడు. అయితే ప్రధాన యాజకులు, శాస్త్రులు, ప్రజల నాయకులు ఆయనను నాశనం చేయడానికి ప్రయత్నిస్తున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν διδάσκων
  choice: బోధిస్తూ ఉండేవాడు
  rationale: ఈ పరిభాషాత్మక అసంపూర్ణ భూతకాల రూపం గతంలో కొనసాగిన లేదా పదేపదే జరిగిన కార్యాన్ని సూచిస్తుంది.
- source_word: τὸ καθ’ ἡμέραν
  choice: ప్రతిరోజూ
  rationale: రోజురోజుకూ జరిగే పునరావృత కార్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν τῷ ἱερῷ
  choice: దేవాలయంలో
  rationale: ἱερόν అంతర్గర్భాలయాన్ని మాత్రమే కాక దేవాలయ ప్రాంగణ సముదాయాన్ని సూచించగలదు; సంక్షిప్తమైన ‘దేవాలయంలో’ ఆ విస్తృత అర్థాన్ని తెరిచి ఉంచుతుంది.
- source_word: οἱ ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: యాజక నాయకవర్గాన్ని సూచించే స్థిరమైన, సహజమైన తెలుగు పదబంధం.
- source_word: οἱ γραμματεῖς
  choice: శాస్త్రులు
  rationale: గ్రంథధర్మంలో నిపుణులైన లేఖక-బోధక వర్గాన్ని సూచించే సంప్రదాయబద్ధమైన ప్రత్యక్ష పదం; ‘ధర్మశాస్త్ర బోధకులు’ కంటే తక్కువ వ్యాఖ్యానాత్మకం.
- source_word: ἐζήτουν
  choice: ప్రయత్నిస్తూ ఉన్నారు
  rationale: సందర్భంలో ఇది వెదకడం కంటే ఏదో సాధించడానికి నిరంతరం ప్రయత్నించడాన్ని సూచిస్తుంది; అసంపూర్ణ భూతకాలంలోని కొనసాగింపు భావాన్ని నిలుపుతుంది.
- source_word: ἀπολέσαι
  choice: నాశనం చేయాలని
  rationale: ఇక్కడ యేసును చంపాలనే శత్రుత్వ ఉద్దేశం ఉన్నప్పటికీ, మూలపదంలోని ‘నాశనం చేయు/తొలగించు’ అనే విస్తృత భావాన్ని ముందుగానే ‘చంపు’గా కుదించదు.
- source_word: οἱ πρῶτοι τοῦ λαοῦ
  choice: ప్రజల్లో ప్రముఖులైనవారు
  rationale: అక్షరార్థంగా ‘ప్రజలలో మొదటివారు’; సామాజికంగా లేదా రాజకీయంగా పలుకుబడి గల ప్రముఖులను సూచిస్తుంది. తెలుగు బహువచన రూపం సహజంగా ఉండి మూలంలోని వర్గార్థాన్ని అందిస్తుంది.
theological_decisions:
- issue: οἱ πρῶτοι τοῦ λαοῦ లోని పుంలింగ బహువచన సూచన
  choice: ప్రజల్లో ప్రముఖులైనవారు
  alternative: ప్రజలలో ప్రముఖ పురుషులు
  rationale: గ్రీకు వ్యాకరణ రూపం పుంలింగ బహువచనమైనప్పటికీ, తెలుగు సాధారణ వర్గనామంలో లింగాన్ని తప్పనిసరిగా ప్రకటించాల్సిన అవసరం లేదు. ‘ప్రముఖ పురుషులు’ అనడం మూలం స్పష్టంగా చెప్పిన దానికంటే జీవశాస్త్రీయ లింగాన్ని ఎక్కువగా ముందుకు తెస్తుంది; ఎంచుకున్న రూపం చారిత్రక నాయకవర్గ సూచనను సహజంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన వాక్య నిర్మాణం. ‘అయితే’ విరోధ సంబంధాన్ని స్పష్టం చేస్తుంది. మూల వాక్యం తరువాతి వచనంలో కొనసాగినప్పటికీ, తెలుగు ప్రచురణ కోసం పూర్తి విరామంతో స్వతంత్ర వచనంగా ఇచ్చాం.
