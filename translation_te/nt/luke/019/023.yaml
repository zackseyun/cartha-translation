  text: And why did you not put my money in the bank? Then when I came[a], I would have collected it with interest.
translation:
  language: te
  text: మరి నా డబ్బును బ్యాంకులో[a] ఎందుకు జమ చేయలేదు? అలా చేసి ఉంటే, నేను వచ్చాక దాన్ని వడ్డీతో సహా వసూలు చేసుకునేవాడిని.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా డబ్బును బ్యాంకర్ల దగ్గర ఎందుకు జమ చేయలేదు?” అక్షరార్థంగా, “నా డబ్బును బల్లపై ఎందుకు పెట్టలేదు?”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί
  choice: ఎందుకు
  rationale: కారణాన్ని ప్రశ్నిస్తూ మందలించే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔδωκάς ... ἐπὶ τράπεζαν
  choice: బ్యాంకులో ... జమ చేయలేదు
  rationale: అక్షరార్థంగా డబ్బును ‘బల్ల మీద ఇవ్వడం’ అనే ఈ పదబంధం ఆర్థిక సందర్భంలో బ్యాంకింగ్ ఏర్పాటును సూచిస్తుంది. ‘బ్యాంకులో జమ చేయడం’ ఉద్దేశించిన చర్యను ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; ప్రాచీన పదచిత్రాన్ని పాదసూచికలో ఉంచాం.
- source_word: μου τὸ ἀργύριον
  choice: నా డబ్బును
  rationale: ἀργύριον అక్షరార్థంగా వెండిని సూచించగలిగినా, ఈ వ్యాపార సందర్భంలో చలామణి డబ్బు అనే అర్థమే సహజం.
- source_word: κἀγὼ ἐλθὼν
  choice: నేను వచ్చాక
  rationale: గ్రీకు క్రియావిశేషణ రూపాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా అందిస్తుంది.
- source_word: σὺν τόκῳ
  choice: వడ్డీతో సహా
  rationale: జమ చేసిన డబ్బుపై వచ్చే వడ్డీని స్పష్టంగా, విలువ తీర్పును జోడించకుండా తెలియజేస్తుంది.
- source_word: αὐτὸ ἔπραξα
  choice: దాన్ని ... వసూలు చేసుకునేవాడిని
  rationale: ఇక్కడ πράσσωకు రావలసిన మొత్తాన్ని వసూలు చేసుకోవడం అనే వాణిజ్యార్థం ఉంది. ἄν సూచించే జరగని సంభావ్య ఫలితాన్ని ‘చేసుకునేవాడిని’ కాపాడుతుంది.
