id: LUK.19.43
reference: Luke 19:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ἥξουσιν ἡμέραι ἐπὶ σὲ καὶ ⸀παρεμβαλοῦσιν οἱ ἐχθροί σου χάρακά σοι καὶ περικυκλώσουσίν σε καὶ συνέξουσίν σε πάντοθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/043.yaml
  text: For days will come upon you when your enemies will build an embankment against you and surround you and hem you in on every side,[a]
translation:
  language: te
  text: ఎందుకంటే నీ శత్రువులు నీకు వ్యతిరేకంగా ముట్టడి గట్టు కట్టి, నిన్ను చుట్టుముట్టి, అన్ని వైపుల నుండీ నిన్ను దిగ్బంధించే రోజులు నీ మీదికి వస్తాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీకు వ్యతిరేకంగా ముట్టడి ప్రాకారాన్ని నిర్మించి.”
    reason: χάραξ అనే పదానికి ఈ ముట్టడి సందర్భంలో ‘ముట్టడి గట్టు’ లేదా ‘ముట్టడి ప్రాకారం’ అనే పదార్థ ప్రత్యామ్నాయాలు ఉన్నాయి.
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న యేసు విలాపానికి, రాబోయే తీర్పును తెలిపే మాటలకు మధ్యనున్న కారణ సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἥξουσιν ἡμέραι ἐπὶ σὲ
  choice: రోజులు నీ మీదికి వస్తాయి
  rationale: రాబోయే విపత్తు యెరూషలేమును ముంచుకొస్తుందనే ప్రవచనాత్మక నుడికారాన్ని కాపాడుతుంది.
- source_word: παρεμβαλοῦσιν ... χάρακά σοι
  choice: నీకు ఎదురుగా ముట్టడి గట్టు కట్టి
  rationale: ఈ సైనిక సందర్భంలో క్రియ, నామవాచకం కలిసి ముట్టడి నిర్మాణాన్ని ఏర్పరచడాన్ని సూచిస్తాయి; ‘ముట్టడి గట్టు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: οἱ ἐχθροί σου
  choice: నీ శత్రువులు
  rationale: గ్రీకు స్వామ్యసూచక పదబంధానికి నేరమైన, సహజమైన అనువాదం.
- source_word: περικυκλώσουσίν σε
  choice: నిన్ను చుట్టుముట్టి
  rationale: నగరాన్ని సైనికంగా పూర్తిగా చుట్టివేయడాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: συνέξουσίν σε πάντοθεν
  choice: అన్ని వైపుల నుండీ నిన్ను ఇరుకున పెట్టే
  rationale: అన్ని దిక్కుల నుంచి ఒత్తిడి చేసి తప్పించుకునే మార్గం లేకుండా చేయడమనే ముట్టడి భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: యేసు విలాపంలో ఏకవచన ద్వితీయ పురుష సర్వనామాల సూచితార్థం
  choice: యెరూషలేమును వ్యక్తిగా సంబోధిస్తూ ఏకవచన ‘నీ/నిన్ను’ రూపాలు నిలుపబడ్డాయి.
  alternative: నగరవాసులందరినీ ఉద్దేశించిన బహువచన రూపాలతో విస్తరించడం.
  rationale: గ్రీకు మూలంలోని ఏకవచన సర్వనామాలు సమీప సందర్భంలో యెరూషలేమును వ్యక్తీకరించి సంబోధిస్తున్నాయి. వాటిని అలాగే ఉంచడం ప్రవచనాత్మక, కవితాత్మక ఉద్వేగాన్ని కాపాడుతుంది; సూచితార్థాన్ని అనవసరంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ప్రవచనంలోని గంభీరతను నిలుపుతూ అనువదించబడింది. ‘ముట్టడి గట్టు’ సైనిక సందర్భాన్ని స్పష్టం చేస్తుంది; ‘ఇరుకున పెట్టే’ సంపూర్ణ దిగ్బంధాన్ని సహజంగా తెలియజేస్తుంది.
