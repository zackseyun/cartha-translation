    reason: 'పదప్రయోగ ప్రత్యామ్నాయం: σπεύσας, κατέβη, ὑπεδέξατο, χαίρων పదాల మరింత రూపసామ్యమైన అనువాదాన్ని చూపుతుంది.'
lexical_decisions:
- source_word: σπεύσας
  choice: త్వరగా
  rationale: ఈ భూతకాల కృదంతం వెంటనే, ఆత్రుతతో చేసిన చర్యను సూచిస్తుంది. ఆధునిక తెలుగులో ‘త్వరగా’ సహజంగా ఉండి ఆ సత్వరతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: κατέβη
  choice: కిందికి దిగి
  rationale: చెట్టు మీద ఉన్న సందర్భంలో κατέβη సూచించే కిందికి వచ్చే దిశను ‘కిందికి దిగి’ సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ὑπεδέξατο
  choice: ఆహ్వానించాడు
  rationale: ὑποδέχομαι ఇక్కడ స్వాగతించి అతిథిగా చేర్చుకోవడం అనే ఆతిథ్య భావాన్ని కలిగి ఉంది. ‘ఆహ్వానించాడు’ సందర్భానుగుణంగా ఆ భావాన్ని తెలియజేస్తుంది; ‘స్వాగతించాడు’ కూడా సాధ్యమైన అనువాదం.
- source_word: αὐτόν
  choice: ఆయనను
  rationale: ఈ సర్వనామం యేసును సూచిస్తుంది. తెలుగు గౌరవ వాడుకకు అనుగుణంగా ‘ఆయనను’ అని అనువదించబడింది.
- source_word: χαίρων
  choice: ఆనందంతో
  rationale: వర్తమాన కృదంతమైన χαίρων, ఆహ్వానించే చర్యతో పాటు ఉన్న ఆనంద స్థితిని సూచిస్తుంది. ‘ఆనందంతో’ మూలంలోని విధాన భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: καὶ ... καὶ
  choice: అతడు ... దిగి, ... ఆహ్వానించాడు
  rationale: పునరుక్త καί చర్యల వరుసను కలుపుతుంది. తెలుగులో వాక్యారంభ సంధాన పదాన్ని తప్పించి, కృదంత నిర్మాణం మరియు కామాతో అదే సహజ క్రమాన్ని తెలియజేయడం సులభంగా చదవబడుతుంది.
