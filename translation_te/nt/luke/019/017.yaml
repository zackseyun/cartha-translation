id: LUK.19.17
reference: Luke 19:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· ⸀Εὖγε, ἀγαθὲ δοῦλε, ὅτι ἐν ἐλαχίστῳ πιστὸς ἐγένου, ἴσθι ἐξουσίαν ἔχων ἐπάνω δέκα πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/017.yaml
  text: And he said to him[a], “Well done, good servant; because you were faithful in a very small matter, have authority over ten cities.”
translation:
  language: te
  text: 'అతడు అతనితో ఇలా అన్నాడు: “శభాష్, మంచి సేవకుడా![a] నీవు అత్యల్పమైన విషయంలో నమ్మకంగా ఉన్నావు కాబట్టి, పది పట్టణాలపై అధికారం కలిగి ఉండు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మంచి దాసుడా!” గ్రీకు పదం δοῦλος సందర్భాన్ని బట్టి “సేవకుడు” లేదా “దాసుడు” అని అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὖγε
  choice: బాగుంది
  rationale: ప్రశంసను తెలిపే సహజమైన తెలుగు ఉద్గారం; సందర్భంలోని ఆమోదాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀγαθὲ
  choice: మంచి
  rationale: δοῦλεను నేరుగా విశేషించే సంబోధన; మూలంలోని సాధారణ ప్రశంసాత్మక అర్థాన్ని నిలుపుతుంది.
- source_word: δοῦλε
  choice: సేవకుడా
  rationale: యజమాని–అధీనుడు సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘దాసుడా’ అనే బలమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ἐν ἐλαχίστῳ
  choice: అతి కొంచెమైన దానిలో
  rationale: అత్యల్పంగా అప్పగించబడిన విషయం లేదా మొత్తమనే భావాన్ని, దానిని అవసరానికి మించి నిర్దిష్టం చేయకుండా వ్యక్తపరుస్తుంది.
- source_word: πιστὸς ἐγένου
  choice: నమ్మకంగా ఉన్నావు
  rationale: ἐγένουతో కూడిన πιστόςను సహజంగా తెలియజేస్తూ, ‘నిన్ను నీవు నమ్మకస్థుడిగా నిరూపించుకున్నావు’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: ἴσθι ἐξουσίαν ἔχων
  choice: అధికారం కలిగి ఉండు
  rationale: అధికారాన్ని కలిగి ఉండమనే పరిభాషాత్మక ఆజ్ఞారూప భావాన్ని దగ్గరగా, స్పష్టంగా నిలుపుతుంది.
- source_word: ἐπάνω δέκα πόλεων
  choice: పది పట్టణాల మీద
  rationale: పాలనా సందర్భంలో ἐπάνωను ‘మీద’గా, πόλειςను సహజమైన తెలుగు ‘పట్టణాలు’గా అందిస్తుంది.
theological_decisions:
- issue: ఉపమానంలోని యజమాని–δοῦλος సంబంధాన్ని ఎలా అనువదించాలి
  choice: సేవకుడు
  alternative: దాసుడు
  rationale: ఈ సందర్భంలో అధీన సంబంధం స్పష్టంగానే ఉన్నప్పటికీ బానిసత్వ స్థితిని ప్రత్యేకంగా ముందుకు తేవడం ప్రధాన ఉద్దేశం కాదు. అందువల్ల ప్రధాన వచనంలో సహజమైన ‘సేవకుడు’ను వాడి, మూలపదానికి సాధ్యమైన బలమైన అర్థాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని ప్రశంస, కారణవాక్యం, అధికారాన్ని అప్పగించే ఆజ్ఞ అన్నీ నిలుపబడ్డాయి.
