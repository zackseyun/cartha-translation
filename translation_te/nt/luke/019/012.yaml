id: LUK.19.12
reference: Luke 19:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν οὖν· Ἄνθρωπός τις εὐγενὴς ἐπορεύθη εἰς χώραν μακρὰν λαβεῖν ἑαυτῷ βασιλείαν καὶ ὑποστρέψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/012.yaml
  text: So he said[a], “A certain nobleman went to a distant country to receive a kingdom for himself and return.”
translation:
  language: te
  text: 'అందుకు ఆయన ఇలా చెప్పాడు: “ఉన్నత వంశానికి చెందిన ఒక వ్యక్తి తన కోసం రాజ్యాధికారాన్ని[a] పొందడానికి, తిరిగి రావడానికి దూరదేశానికి వెళ్లాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రాజ్యం,” “రాజరికం.” గ్రీకు పదం βασιλεία రాజ్యాన్ని, రాజపాలనను, లేదా రాజాధికారాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: అందుకు
  rationale: మునుపటి సందర్భానికి ఈ ఉపమానం ఇచ్చిన ప్రతిస్పందనను, అలాగే కథనంలోని తార్కిక కొనసాగింపును సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: Ἄνθρωπός τις
  choice: ఒక వ్యక్తి
  rationale: ఉపమానంలో నిర్దిష్టంగా పేరు చెప్పని పాత్రను పరిచయం చేస్తుంది; వెంటనే వచ్చే εὐγενής అతని సామాజిక స్థితిని వివరిస్తుంది.
- source_word: εὐγενὴς
  choice: ఉన్నత వంశానికి చెందిన
  rationale: మూలపదం ఉన్నత జన్మ లేదా వంశస్థితిని సూచిస్తుంది. ‘ప్రభువు’ వంటి పదం లేని బిరుదును లేదా మతపరమైన భావాన్ని చేర్చే ప్రమాదం ఉన్నందున ఈ వివరణాత్మక రూపం ఎంచుకోబడింది.
- source_word: ἐπορεύθη
  choice: వెళ్లాడు
  rationale: సాధారణ గమనాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς χώραν μακρὰν
  choice: దూరదేశానికి
  rationale: దూరంగా ఉన్న ప్రాంతం లేదా దేశానికి చేసిన ప్రయాణాన్ని సంక్షిప్తమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: λαβεῖν
  choice: పొందుకొని
  rationale: ఈ రాజకీయ సందర్భంలో బలవంతంగా స్వాధీనం చేసుకోవడం కంటే, రాజ్యపాలనకు అధికారాన్ని పొందడం అనే భావాన్ని ఇస్తుంది; తరువాతి తిరుగు ప్రయాణంతో సమన్వయమైన క్రియారూపం.
- source_word: ἑαυτῷ
  choice: తన కోసం
  rationale: రాజ్యాధికారం ఆ వ్యక్తికే లభించబోతున్నదనే ఆత్మార్థక దత్తివు భావాన్ని నిలుపుతుంది.
- source_word: βασιλείαν
  choice: రాజ్యాధికారం
  rationale: ఈ సందర్భంలో దూరదేశానికి వెళ్లి తిరిగి రావడానికి ముందు గుర్తింపు పొందిన రాజపాలనా హక్కు లేదా అధికారం స్వీకరించడం ప్రధాన భావం. ఈ తెలుగు పదం రాజ్యం అనే భూభాగం మరియు రాజరిక పాలన మధ్య సందర్భానుకూలంగా రెండవ భావాన్ని స్పష్టం చేస్తుంది; పదంలోని విస్తృతార్థం పాదటిప్పణిలో ఉంచబడింది.
- source_word: ὑποστρέψαι
  choice: తిరిగి రావడానికి
  rationale: λαβεῖνతో సమన్వయమైన ఉద్దేశ్య క్రియగా, వెళ్లిన తర్వాత తిరిగి రావడాన్ని సహజంగా వ్యక్తం చేస్తుంది; మూలంలో లేని అదనపు కాలసంధాన పదం చేర్చలేదు.
theological_decisions:
- issue: రాజకీయంగా భావగర్భితమైన ఉపమానంలో βασιλείαν యొక్క భావపరిధి
  choice: రాజ్యాధికారం
  alternative: రాజ్యం; రాజరికం
  rationale: βασιλεία అనేది రాజ్యం అనే పరిధినీ, రాజరిక పాలన లేదా రాజాధికారాన్నీ సూచించగలదు. ఇక్కడ ఉన్నత వంశస్థుడు దూరదేశానికి వెళ్లి అధికారాన్ని పొంది తిరిగి రావడం రాజకీయ గుర్తింపు పొందిన పాలనను సూచిస్తున్నట్లు కనిపిస్తుంది. అందువల్ల ప్రధాన పాఠ్యంలో ‘రాజ్యాధికారం’ వాడి, నిజమైన పదార్థ వైవిధ్యాన్ని పాదటిప్పణిలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఉన్నత వంశానికి చెందిన’ అనేది εὐγενής‌లోని జన్మస్థితిని బిరుదుగా మార్చకుండా తెలియజేస్తుంది. మూలంలోని రెండు ఉద్దేశ్య క్రియలను తెలుగులో ‘పొందుకొని తిరిగి రావడానికి’గా సహజంగా అనుసంధానించాం; మూలంలో లేని ‘తర్వాత’ వంటి పదాన్ని చేర్చలేదు.
