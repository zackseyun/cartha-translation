reference: Luke 19:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὡς ἦλθεν ἐπὶ τὸν τόπον, ἀναβλέψας ὁ ⸀Ἰησοῦς εἶπεν πρὸς αὐτόν· Ζακχαῖε, σπεύσας κατάβηθι, σήμερον γὰρ ἐν τῷ οἴκῳ σου δεῖ με μεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/005.yaml
  text: And when Jesus came to the place[a], he looked up and said to him, “Zacchaeus, hurry and come down[b], because today I must stay at your house.”
translation:
  language: te
  text: యేసు ఆ చోటికి వచ్చినప్పుడు, పైకి చూసి అతనితో, “జక్కయ్యా, త్వరగా దిగిరా; ఎందుకంటే ఈ రోజు నేను నీ ఇంట్లో ఉండాలి[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఉండాలి’ అని అనువదించిన గ్రీకు పదం (δεῖ) యేసు కార్యం లేదా దేవుని ఉద్దేశంతో ముడిపడిన అవసరతను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: వచ్చినప్పుడు
  rationale: కథన క్రమంలో ὡς కాలసూచక ఉపవాక్యాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ‘వచ్చినప్పుడు’ సహజంగా ఉంటుంది.
- source_word: ἐπὶ τὸν τόπον
  choice: ఆ చోటికి
  rationale: సందర్భంలో జక్కయ్య ఉన్న నిర్దిష్ట స్థలాన్ని సూచిస్తుంది; ‘ఆ చోటికి’ సహజమైన స్థానార్థక అనువాదం.
- source_word: ἀναβλέψας
  choice: పైకి చూసి
  rationale: చెట్టుపై ఉన్న జక్కయ్యవైపు యేసు చూపు ఎత్తడాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: εἶπεν πρὸς αὐτόν
  choice: అతనితో ... అన్నాడు
  rationale: తెలుగులో ప్రత్యక్ష సంభాషణకు సహజమైన మాటల సూత్రం.
- source_word: Ζακχαῖε
  choice: జక్కయ్యా
  rationale: పేరును ప్రామాణిక తెలుగు రూపంలో ఇచ్చి, గ్రీకు సంబోధనను ‘-ఆ’తో వ్యక్తం చేశాం.
- source_word: σπεύσας κατάβηθι
  choice: త్వరగా దిగిరా
  rationale: క్రియావిశేషణాత్మక కృదంతం మరియు ఆజ్ఞ కలిపి తెలిపే అత్యవసరతను సహజమైన తెలుగు ఆజ్ఞగా వ్యక్తం చేస్తుంది.
- source_word: σήμερον γὰρ
  choice: ఎందుకంటే ఈ రోజు
  rationale: γάρ ఆజ్ఞకు కారణాన్ని ఇస్తుంది; ఈ అనుసంధానం తెలుగులో కారణ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἐν τῷ οἴκῳ σου
  choice: నీ ఇంట్లో
  rationale: యేసు జక్కయ్య నివాసంలో ఉండడాన్ని సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: δεῖ
  choice: ఉండాలి
  rationale: బలమైన అవసరాన్ని వ్యక్తం చేస్తూ, అది సాధారణ అవసరమా లేక దైవ ఉద్దేశంతో ముడిపడినదా అన్న విషయాన్ని ప్రధాన వాక్యంలో అతిగా నిర్దిష్టం చేయదు.
- source_word: μεῖναι
  choice: ఉండు
  rationale: ఈ సందర్భంలో ఒకరి ఇంటిలో నిలిచి ఉండడం లేదా బస చేయడం అనే విస్తృత భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: లూకా కథనంలో δεῖ పదానికి ఉన్న అవసరత భావం
  choice: ‘ఉండాలి’ అని అనువదించి బలమైన అవసరతను నిలిపాం.
  alternative: ‘ఉండవలసి ఉంది’ లేదా ‘తప్పక ఉండాలి’
  rationale: లూకా రచనలో δεῖ తరచుగా యేసు కార్యం లేదా దేవుని ఉద్దేశంతో ముడిపడిన అవసరతను సూచించగలదు. అయితే ఈ వచనం ఆ సంబంధాన్ని పూర్తిగా వివరిస్తుండదు; కాబట్టి అనువాదం ఆ భావసంభావ్యతను నిలిపి, దానిని సిద్ధాంతపరంగా తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవభరితమైన కథన శైలిలో అనువదించబడింది. ప్రత్యక్ష సంబోధనలో ‘జక్కయ్యా’, ఆజ్ఞలో ‘దిగిరా’ వాడటం సందర్భంలోని వ్యక్తిగత ప్రత్యక్షతను సహజంగా నిలుపుతుంది.
