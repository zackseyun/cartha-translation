  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ προσέχοντες Ἰουδαϊκοῖς μύθοις καὶ ἐντολαῖς ἀνθρώπων ἀποστρεφομένων τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/014.yaml
  text: not paying attention to Jewish myths and commandments of people who turn away from the truth[a].
translation:
  language: te
  text: యూదుల కల్పిత కథలకూ, సత్యం నుండి తిరిగిపోతున్న మనుషుల ఆజ్ఞలకూ శ్రద్ధ చూపకుండా ఉండాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదుల కల్పిత కథలకూ, సత్యం నుండి తిరిగిపోతున్న మనుషుల ఆజ్ఞలకూ మనస్సు నిలపకుండా ఉండాలి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ προσέχοντες
  choice: చెవి పెట్టకుండా ఉండాలి
  rationale: ప్రస్తుతకాల క్రియావిశేషణ రూపం ముందటి వాక్యంలోని ఉపదేశాన్ని కొనసాగిస్తూ, వాటిపై శ్రద్ధ నిలపకూడదనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Ἰουδαϊκοῖς μύθοις
  choice: యూదుల కల్పిత కథలకు
  rationale: μῦθος ఇక్కడ వాస్తవాధారం లేని కల్పిత కథలు లేదా కట్టుకథలను సూచిస్తుంది; Ἰουδαϊκοῖς వాటి యూదు సంబంధ స్వభావాన్ని తెలియజేస్తుంది.
- source_word: ἐντολαῖς ἀνθρώπων
  choice: మనుషుల ఆజ్ఞలకు
  rationale: ἐντολαῖς అంటే ఆజ్ఞలు; ἀνθρώπων అంటే మనుషుల లేదా ప్రజల. ఇది దైవసత్యానికి విరుద్ధంగా ఉన్న కేవలం మానవ ఆదేశాలను సూచిస్తుంది.
- source_word: ἀποστρεφομένων
  choice: విడిచిపెడుతున్నవారి
  rationale: మూలంలోని వర్తమాన క్రియావిశేషణం సత్యం నుండి తిరిగిపోతున్న చర్యను వ్యక్తం చేస్తుంది; సమీపంలోని ἀνθρώπωνను విశేషిస్తుంది.
- source_word: τὴν ἀλήθειαν
  choice: సత్యాన్ని
  rationale: మూలపదానికి నేరమైన, సహజమైన అనువాదం; సువార్త సత్యం అనే సందర్భార్థాన్ని వచనంలో అదనంగా చేర్చలేదు.
theological_decisions:
- issue: ἀποστρεφομένων అనే షష్ఠీ విభక్తి క్రియావిశేషణం దేనిని సూచిస్తుంది?
  choice: ‘సత్యాన్ని విడిచిపెడుతున్న మనుషులు’ అని ἀνθρώπωνను విశేషించేలా అనువదించడం
  alternative: సత్యం నుండి తొలగినవారితో సంబంధమున్న ‘కల్పిత కథలు’ మరియు ‘ఆజ్ఞలు’ రెండింటికీ దీనిని విస్తృతంగా అనుసంధానించడం
  rationale: షష్ఠీ బహువచనంలో ఉన్న ἀποστρεφομένωνకు అదే విభక్తిలో సమీపంగా ఉన్న ἀνθρώπωνతో అనుసంధానం వ్యాకరణపరంగా అత్యంత సహజం. అదనపు సిద్ధాంతార్థాన్ని చేర్చకుండా ఈ సంబంధాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన శైలిని వాడాం. అయితే ప్రధాన వాక్యంలో పదక్రమం మూలంలోని జాబితా క్రమాన్ని మార్చింది; ‘చెవి పెట్టడం’ శ్రద్ధ చూపడాన్ని సహజంగా తెలియజేస్తుంది.
