id: TIT.1.7
reference: Titus 1:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δεῖ γὰρ τὸν ἐπίσκοπον ἀνέγκλητον εἶναι ὡς θεοῦ οἰκονόμον, μὴ αὐθάδη, μὴ ὀργίλον, μὴ πάροινον, μὴ πλήκτην, μὴ αἰσχροκερδῆ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/007.yaml
  text: For an overseer must be above reproach as God's steward[a], not self-willed, not quick-tempered, not given to wine, not violent, not greedy for shameful gain[b],
translation:
  language: te
  text: ఎందుకంటే దేవుని గృహనిర్వాహకుడిగా పర్యవేక్షకుడు[a] నిందకు తావులేనివాడై ఉండాలి; తన ఇష్టానుసారంగా నడుచుకునేవాడై ఉండకూడదు, త్వరగా కోపపడేవాడై ఉండకూడదు, మద్యపానంలో మితిమీరేవాడై ఉండకూడదు, హింసాత్మకుడై ఉండకూడదు, అవమానకరమైన లాభానికి ఆశపడేవాడై ఉండకూడదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బిషప్.’ గ్రీకు పదానికి ఇతరులను పర్యవేక్షించేవాడు అనే అర్థం ఉంది; ‘పర్యవేక్షకుడు’ అనే అనువాదం తరువాతి కాలపు నిర్దిష్ట సంఘపదవి భావాలను రుద్దకుండా ఉంటుంది.
    reason: ప్రత్యామ్నాయ అనువాదం
  - marker: b
    text: లేదా, ‘నీచమైన లాభానికి ఆశపడకూడదు.’ గ్రీకు పదం నైతికంగా అవమానకరమైన రీతిలో కోరే లాభాన్ని సూచిస్తుంది.
    reason: పదార్థ ప్రత్యామ్నాయం
lexical_decisions:
- source_word: δεῖ
  choice: ఉండాలి
  rationale: అవసరతతో కూడిన బాధ్యతను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: మునుపటి వాక్యంతో ఉన్న వివరణాత్మక సంబంధాన్ని నిలుపుతుంది.
- source_word: ἐπίσκοπον
  choice: పర్యవేక్షకుడు
  rationale: తరువాతి కాలపు సంఘపదవుల భావాలను రుద్దకుండా, ఇతరులను పర్యవేక్షించే బాధ్యత అనే గ్రీకు పదపు ప్రాథమిక అర్థాన్ని ఇస్తుంది.
- source_word: ἀνέγκλητον
  choice: నిందకు తావులేనివాడు
  rationale: ఏ సముచితమైన ఆరోపణకూ అవకాశం ఇవ్వని వ్యక్తి అనే భావాన్ని, సంపూర్ణ పాపరాహిత్యాన్ని సూచించకుండా వ్యక్తం చేస్తుంది.
- source_word: ὡς θεοῦ οἰκονόμον
  choice: దేవుని గృహనిర్వాహకుడిగా
  rationale: దేవునికి చెందిన వ్యవహారాలను ఆయనకు జవాబుదారీగా నిర్వహించే బాధ్యతను οἰκονόμος పదంలోని గృహనిర్వహణ రూపకంతో సహా నిలుపుతుంది.
- source_word: αὐθάδη
  choice: స్వేచ్ఛాపరుడు
  rationale: తన ఇష్టమే నెరవేరాలని పట్టుబట్టే, ఇతరులను లెక్కచేయని స్వభావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ὀργίλον
  choice: త్వరగా కోపపడేవాడు
  rationale: ఒకే కోపక్రియను కాక, కోపానికి సులభంగా లోనయ్యే స్వభావాన్ని సూచిస్తుంది.
- source_word: πάροινον
  choice: మద్యానికి బానిస
  rationale: మద్యపానానికి లోబడిన లేదా దానితో లక్షణీకరించబడిన ప్రవర్తనను సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: πλήκτην
  choice: దౌర్జన్యంగా ప్రవర్తించేవాడు
  rationale: కొట్టే లేదా కలహప్రియమైన హింసాత్మక ప్రవర్తనను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: αἰσχροκερδῆ
  choice: నీచమైన లాభానికి ఆశపడేవాడు
  rationale: కేవలం చట్టవిరుద్ధమైన సంపాదనకే పరిమితం చేయకుండా, నైతికంగా అవమానకరమైన లాభాపేక్షను తెలియజేస్తుంది.
theological_decisions:
- issue: సంఘ బాధ్యత సందర్భంలో ἐπίσκοπος అనువాదం
  choice: పర్యవేక్షకుడు
  alternative: బిషప్
  rationale: గ్రీకు పదంలోని పర్యవేక్షణ భావాన్ని నేరుగా అందిస్తూ, తరువాత ఏర్పడిన నిర్దిష్ట సంఘపదవి లేదా శ్రేణి నిర్మాణాన్ని వాక్యంలోకి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని అవసరతను, వరుస ప్రతికూల అర్హతలను నిలుపుతూ, తరువాతి సంఘవ్యవస్థల ప్రత్యేక అర్థాలను నివారించింది.
