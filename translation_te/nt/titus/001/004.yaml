id: TIT.1.4
reference: Titus 1:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τίτῳ γνησίῳ τέκνῳ κατὰ κοινὴν πίστιν· χάρις ⸀καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ ⸂Χριστοῦ Ἰησοῦ⸃ τοῦ σωτῆρος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/004.yaml
  text: 'To Titus[b][a], my true child according to our common faith: grace and peace from God the Father and Messiah Jesus our Savior.'
translation:
  language: te
  text: 'మన ఉమ్మడి విశ్వాసం[a] ప్రకారం నా నిజమైన బిడ్డ అయిన తీతుకు: తండ్రియైన దేవుని నుండీ, మన రక్షకుడైన మెస్సీయ[b] యేసు నుండీ కృప, శాంతి కలుగుగాక.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మనమందరం పంచుకునే విశ్వాసం.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ‘క్రీస్తు యేసు’; Χριστός ఇక్కడ బిరుదుగా ఉన్నందున ‘మెస్సీయ’ అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: γνησίῳ τέκνῳ
  choice: నా నిజమైన బిడ్డ
  rationale: ఇది శారీరక సంతానాన్ని కాక, పౌలుతో తీతుకు ఉన్న యథార్థమైన ఆత్మీయ కుటుంబ సంబంధాన్ని సూచిస్తుంది. ‘బిడ్డ’ τέκνον యొక్క విస్తృత కుటుంబ రూపకాన్ని నిలుపుతుంది.
- source_word: κατὰ κοινὴν πίστιν
  choice: మన ఉమ్మడి విశ్వాసం ప్రకారం
  rationale: κατά ఇక్కడ సంబంధం లేదా ప్రమాణాన్ని, κοινήν ఇద్దరికీ ఉమ్మడిగా ఉన్నదాన్ని సూచిస్తాయి. తెలుగు వాక్యసౌలభ్యం కోసం సందర్భంలో అంతర్లీనంగా ఉన్న ‘మన’ చేర్చబడింది.
- source_word: χάρις καὶ εἰρήνη
  choice: కృప, శాంతి
  rationale: పౌలు పత్రికల ఆశీర్వాదంలో వచ్చే రెండు ప్రధాన భావాలను సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: θεοῦ πατρὸς
  choice: తండ్రియైన దేవుడు
  rationale: గ్రీకులో πατρόςతో ‘మన’ లేదు; అందువల్ల ‘మన తండ్రియైన దేవుడు’ అని అదనంగా చేర్చకుండా మూలపాఠాన్ని అనుసరిస్తుంది.
- source_word: Χριστοῦ Ἰησοῦ
  choice: మెస్సీయ యేసు
  rationale: Χριστόςను కేవలం పేరులో భాగంలా లిప్యంతరీకరించకుండా, అభిషిక్త రాజు అనే బిరుదు భావాన్ని ‘మెస్సీయ’గా నిలుపుతుంది.
- source_word: σωτῆρος ἡμῶν
  choice: మన రక్షకుడు
  rationale: ఈ బిరుదు వెంటనే ముందు ఉన్న మెస్సీయ యేసును గుర్తిస్తున్నందున ‘మన రక్షకుడైన మెస్సీయ యేసు’ అని స్పష్టంగా అనుసంధానించబడింది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో బిరుదు యొక్క అర్థాన్ని స్పష్టంగా అందించడానికి ‘మెస్సీయ’ వాడబడింది; సంప్రదాయ లిప్యంతరీకరణను పాదసూచికలో తెలిపాం.
- issue: τοῦ σωτῆρος ἡμῶν ఎవరిని సూచిస్తుంది
  choice: మెస్సీయ యేసును ‘మన రక్షకుడు’గా గుర్తిస్తుంది
  alternative: సమన్వయించబడిన మొత్తం మూలపదబంధంతో మరింత సడలుగా అనుసంధానించినట్లు వినవచ్చు
  rationale: Χριστοῦ Ἰησοῦ తరువాత నేరుగా వచ్చిన ఆర్టికల్‌తో కూడిన τοῦ σωτῆρος ἡμῶν పదబంధం సహజంగా యేసుకు సమానాధికరణంగా ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన పత్రికా-ఆశీర్వాద శైలి వాడబడింది. మూలంలో క్రియ లేకపోయినా, తెలుగులో ఆశీర్వాద వాక్యం సంపూర్ణంగా ఉండేందుకు ‘కలుగుగాక’ చేర్చబడింది. ‘మెస్సీయ యేసు’ పదక్రమం గ్రీకు బిరుదు-పేరు క్రమాన్ని నిలుపుతుంది.
