id: TIT.1.5
reference: Titus 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τούτου χάριν ⸀ἀπέλιπόν σε ἐν Κρήτῃ ἵνα τὰ λείποντα ἐπιδιορθώσῃ, καὶ καταστήσῃς κατὰ πόλιν πρεσβυτέρους, ὡς ἐγώ σοι διεταξάμην,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/005.yaml
  text: For this reason I left you in Crete[a], so that you might set in order what remained and appoint elders in every city[c][b], as I directed you.
translation:
  language: te
  text: ఇంకా మిగిలి ఉన్న విషయాలను[a] నీవు సరిచేసి, నేను నీకు ఆదేశించినట్లుగా ప్రతి పట్టణంలో[b] పెద్దలను నియమించాలనే ఉద్దేశంతోనే నేను నిన్ను క్రేతులో విడిచిపెట్టాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేక, “లోటుగా ఉన్న విషయాలను.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “పట్టణం పట్టణంలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτου χάριν
  choice: కారణం ఇదే
  rationale: గ్రీకు ప్రయోజనార్థక-కారణ సూచనను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀπέλιπόν σε ἐν Κρήτῃ
  choice: నిన్ను క్రేతులో విడిచిపెట్టిన
  rationale: పౌలు తీతును క్రేతులో ఉండేలా వదిలి వెళ్లిన భావాన్ని అతిశయోక్తి లేకుండా నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα
  choice: నీవు ... నియమించాలి
  rationale: తెలుగు వాక్య నిర్మాణంలో ఉద్దేశాన్ని సహజంగా తెలిపేందుకు ‘కారణం ఇదే’తో అనుసంధానించిన విధేయ రూపం వాడబడింది.
- source_word: τὰ λείποντα
  choice: ఇంకా మిగిలివున్న వాటిని
  rationale: ఇంకా పూర్తికాని లేదా లోటుగా ఉన్న విషయాలనే సూచించే గ్రీకు పదబంధంలోని అస్పష్టతను కొంతవరకు నిలుపుతుంది.
- source_word: ἐπιδιορθώσῃ
  choice: చక్కదిద్ది
  rationale: అసంపూర్ణంగా ఉన్న వాటిని సరిచేసి క్రమంలో పెట్టడం అనే దిద్దుబాటు మరియు నిర్వహణ భావాలను సంక్షిప్తంగా అందిస్తుంది.
- source_word: καταστήσῃς
  choice: నియమించాలి
  rationale: వ్యక్తులను గుర్తింపు పొందిన బాధ్యతలో నియమించడం అనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: κατὰ πόλιν
  choice: ప్రతి పట్టణంలో
  rationale: κατά యొక్క విభజనాత్మక భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: πρεσβυτέρους
  choice: పెద్దలను
  rationale: ఇక్కడ సంఘ నాయకులను సూచించే పదాన్ని తరువాతి కాలపు ఏ ప్రత్యేక సంఘపాలనా వ్యవస్థనూ అనువాదంలోకి తేవకుండా అందిస్తుంది.
- source_word: ὡς ἐγώ σοι διεταξάμην
  choice: నేను నీకు ఆదేశించినట్లుగా
  rationale: διατάσσωలోని అధికారపూర్వక నిర్దేశ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ఇది కేవలం సాధారణ సూచనకన్నా బలమైనది, కాని ‘ఆజ్ఞాపించినట్లుగా’ కంటే తక్కువ కఠినంగా వినిపిస్తుంది.
theological_decisions:
- issue: πρεσβυτέρους అనే సంఘపరమైన పదవి పదం
  choice: పెద్దలను
  alternative: ప్రెస్బిటర్లను; వయోవృద్ధులను
  rationale: సందర్భం గుర్తింపు పొందిన సంఘ నాయకత్వాన్ని సూచిస్తుంది. ‘పెద్దలు’ అనే పదం మూలార్థాన్ని కాపాడుతూ తరువాతి సంప్రదాయాల్లో ఏర్పడిన ప్రత్యేక పదవీ నిర్మాణాన్ని ముందుగానే నిర్ణయించదు.
- issue: διεταξάμην యొక్క అధికార బలం
  choice: ఆదేశించినట్లుగా
  alternative: ఆజ్ఞాపించినట్లుగా; సూచించినట్లుగా
  rationale: మూలపదంలో అధికారపూర్వక నిర్దేశం ఉంది. ‘ఆదేశించు’ ఆ అధికారాన్ని నిలుపుతూ, సందర్భం నిర్బంధించని మరింత కఠినమైన ధ్వనిని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని ఉద్దేశ సంబంధాన్ని సహజ తెలుగు నిర్మాణంలో నిలిపి, సంఘపాలనా విషయమై ఏ ప్రత్యేక సంప్రదాయాన్నీ రుద్దలేదు.
