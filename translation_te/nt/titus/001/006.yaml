- from: ఎవరైనా నిందకు ఆస్కారం లేనివాడై, ఒకే భార్యకు భర్తగా[b], విశ్వసనీయులైన పిల్లలను[a] కలిగి ఉండాలి. అతని పిల్లలపై విచ్చలవిడి జీవితం గడుపుతున్నారనే నింద ఉండకూడదు; వారు అవిధేయులుగా ఉండకూడదు.[c]
