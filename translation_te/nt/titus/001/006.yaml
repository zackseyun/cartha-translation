  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἴ τίς ἐστιν ἀνέγκλητος, μιᾶς γυναικὸς ἀνήρ, τέκνα ἔχων πιστά, μὴ ἐν κατηγορίᾳ ἀσωτίας ἢ ἀνυπότακτα.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/006.yaml
  text: if anyone is above reproach[a], the husband of one wife[c][b], having faithful children not under accusation of debauchery or insubordinate.
translation:
  language: te
  text: ఎవరైనా నిందకు ఆస్కారం లేనివాడై, ఒకే భార్యకు భర్తగా[b], విచ్చలవిడి జీవితం[c] గడుపుతున్నారనే ఆరోపణకు గురికాని, అవిధేయులు కాని విశ్వసనీయులైన పిల్లలను[a] కలిగి ఉంటే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విశ్వాసులైన పిల్లలను.’ గ్రీకు పదం విశ్వసనీయులు లేదా విశ్వాసులు అనే రెండు అర్థాలనూ ఇవ్వగలదు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘ఒక స్త్రీకే నిబద్ధుడైన పురుషుడు.’
    reason: lexical_alternative
  - marker: c
    text: ‘విచ్చలవిడి జీవితం’ అనే మాటకు ‘అదుపులేని జీవితం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέγκλητος
  choice: నిందకు ఆస్కారం లేనివాడు
  rationale: పాపరహితుడు అనే సంపూర్ణ భావాన్ని కలిగించకుండా, సముచితమైన ఆరోపణకు గురికానివాడు అనే అర్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: μιᾶς γυναικὸς ἀνήρ
  choice: ఒకే భార్యకు భర్త
  rationale: గ్రీకు పదబంధంలోని పురుష-నిర్దిష్ట రూపాన్ని, దాని వివాదాస్పద అన్వయాలను ముందుగానే నిర్ణయించకుండా పారదర్శకంగా నిలుపుతుంది.
- source_word: τέκνα
  choice: పిల్లలు
  rationale: కుటుంబ సందర్భంలో సహజమైన, సాధారణ ఆధునిక తెలుగు పదం.
- source_word: πιστά
  choice: విశ్వసనీయులైన
  rationale: నమ్మదగినవారు లేదా నమ్మకంగా ప్రవర్తించేవారు అనే విస్తృత భావాన్ని ఇస్తుంది; 'విశ్వాసులైన' అనే సాధ్యమైన మతవిశ్వాసార్థాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: κατηγορίᾳ
  choice: నింద
  rationale: ἐν κατηγορίᾳ అనే ప్రయోగంలోని ఆరోపణ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀσωτίας
  choice: విచ్చలవిడి జీవితం
  rationale: వ్యర్థమైన, అదుపులేని, నైతిక నియంత్రణలేని ప్రవర్తనను సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀνυπότακτα
  choice: అవిధేయులు
  rationale: తగిన అధికారానికి లోబడకపోవడం లేదా క్రమానికి తిరస్కారంగా ఉండడం అనే భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: τέκνα ἔχων πιστά లో πιστά యొక్క అర్థం
  choice: విశ్వసనీయులైన పిల్లలు
  alternative: విశ్వాసులైన పిల్లలు
  rationale: πιστά అనే పదం ఇక్కడ నమ్మకమైన/విశ్వసనీయమైన అని గానీ, విశ్వసించే/విశ్వాసులైన అని గానీ అర్థమవవచ్చు. ప్రధాన పాఠ్యంలో విస్తృతమైన అర్థాన్ని ఉంచి, మతవిశ్వాసార్థాన్ని పాదసూచికలో భద్రపరచడం అసలు భాషలోని సందిగ్ధతను నిలుపుతుంది.
- issue: μιᾶς γυναικὸς ἀνήρ యొక్క భావబలం
  choice: ఒకే భార్యకు భర్త
  alternative: ఒక స్త్రీకే నిబద్ధుడైన పురుషుడు
  rationale: ఈ గ్రీకు నుడికారం వివాహస్థితి, లైంగిక విశ్వసనీయత, పునర్వివాహం వంటి అంశాలకు ఎలా వర్తిస్తుందనే విషయంలో వివాదం ఉంది. పారదర్శకమైన అనువాదం ఏ ప్రత్యేక సంఘపరమైన నిర్ణయాన్నీ పాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. పొడవైన గ్రీకు షరతు వాక్యాన్ని తెలుగు సహజత్వం కోసం రెండు వాక్యాలుగా విభజించాం; అర్హతలన్నీ ఒకే వ్యక్తిని సూచిస్తున్న సంబంధం నిలుపబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
