translation:
  language: te
  text: కానీ, అతిథులను ఆదరించేవాడై[a], మంచిని ప్రేమించేవాడై, వివేకశీలుడై[b], న్యాయవంతుడై[c], పవిత్రుడై[d], ఆత్మనిగ్రహం గలవాడై[e] ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలపదానికి అక్షరార్థంగా ‘అపరిచితులను ప్రేమించేవాడు’ అనే భావం ఉంది; అంటే అతిథులను ఆహ్వానించి ఆదరించేవాడు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సుబుద్ధిగలవాడై’ లేదా ‘సంయమనం గలవాడై.’ ఇక్కడి పదం వివేకంతో కూడిన సమతుల్య ప్రవర్తనను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘నీతిమంతుడై.’
    reason: lexical_alternative
  - marker: d
    text: లేదా ‘భక్తిపరుడై.’ ఇక్కడి పదం పవిత్రమైనదానికి తగిన భక్తి, దేవనిష్ఠ అనే భావాన్ని కూడా కలిగి ఉంది.
    reason: lexical_alternative
  - marker: e
    text: లేదా ‘తనను తాను అదుపులో ఉంచుకునేవాడై’ లేదా ‘సంయమనం గలవాడై.’ ఈ పదం కోరికలు, ప్రేరణలపై స్వాధీనతను సూచిస్తుంది; ముందున్న ‘వివేకశీలుడై’ అనే పదంతో సంబంధమున్నప్పటికీ దాని కంటే వేరైన గుణం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: మునుపటి వచనంలోని నిషేధాత్మక లక్షణాలకు భిన్నంగా, ఇక్కడ చెప్పే సానుకూల లక్షణాలను పరిచయం చేసే వ్యతిరేకార్థక సంధానంగా సహజంగా పనిచేస్తుంది.
- source_word: φιλόξενον
  choice: అతిథులను ఆదరించేవాడై
  rationale: అపరిచితులను, అతిథులను ఆహ్వానించి ఆదరించే స్వభావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: φιλάγαθον
  choice: మంచిని ప్రేమించేవాడై
  rationale: ‘మంచిని ప్రేమించేవాడు’ అనే సమాసపదపు భావాన్ని స్పష్టంగా, నేరుగా నిలుపుతుంది.
- source_word: σώφρονα
  choice: వివేకశీలుడై
  rationale: సుబుద్ధి, సమతుల్యమైన తీర్పు, మితమైన ప్రవర్తన అనే భావాలను తెలియజేస్తుంది; చివరలోని ἐγκρατῆతో ఉన్న భేదాన్ని కూడా నిలుపుతుంది.
- source_word: δίκαιον
  choice: న్యాయవంతుడై
  rationale: సరైనది, న్యాయమైనది చేసేవాడనే నైతిక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘నీతిమంతుడు’ కూడా సాధ్యమైన అనువాదం.
- source_word: ὅσιον
  choice: పవిత్రుడై
  rationale: దేవునికి తగిన భక్తిపూర్వకమైన, పవిత్రమైన జీవన స్వభావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἐγκρατῆ
  choice: ఆత్మనిగ్రహం గలవాడై
  rationale: కోరికలు, ప్రేరణలపై తనను తాను అదుపులో ఉంచుకునే సామర్థ్యాన్ని వ్యక్తం చేస్తుంది; σώφρονα అనే సమీప గుణంతో కలిపివేయదు.
theological_decisions:
- issue: σώφρονα మరియు ἐγκρατῆ అనే దగ్గరి భావాలుగల రెండు గుణాల మధ్య భేదం
  choice: σώφρονα ను ‘వివేకశీలుడై,’ ἐγκρατῆ ను ‘ఆత్మనిగ్రహం గలవాడై’ అని అనువదించడం
  alternative: ‘నిగ్రహం గలవాడై’ మరియు ‘తనను తాను అదుపులో ఉంచుకునేవాడై’ వంటి పరస్పరం దగ్గరగా వినిపించే పదబంధాలను ఉపయోగించడం
  rationale: మొదటి పదం సుబుద్ధి, సంయమిత తీర్పును; రెండవది కోరికలు, ప్రేరణలపై స్వాధీనతను ప్రధానంగా సూచిస్తుంది. మూలంలోని సంబంధితమైనా వేరైన రెండు గుణాలను ఈ ఎంపిక స్పష్టంగా నిలుపుతుంది.
- issue: δίκαιον యొక్క నైతిక పరిధి
  choice: ‘న్యాయవంతుడై’
  alternative: ‘నీతిమంతుడై’
  rationale: ఈ గుణాల జాబితాలో వ్యక్తి న్యాయంగా, సరిగా ప్రవర్తించడాన్ని ముందుకు తెస్తుంది; అయినా మూలపదానికి ‘నీతిమంతుడు’ అనే విస్తృత నైతిక భావం కూడా సాధ్యమే.
- issue: ὅσιον యొక్క పవిత్రత-భక్తి భావం
  choice: ‘పవిత్రుడై’
  alternative: ‘భక్తిపరుడై’
  rationale: మూలపదం పవిత్రమైనదానికి తగిన భక్తి, దేవనిష్ఠను సూచించగలదు. ప్రధాన పాఠంలో దాని బలమైన పవిత్రత భావాన్ని ఉంచి, భక్తి అనే ప్రత్యామ్నాయ ఛాయను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సంఘ నాయకునికి కావలసిన గుణాల జాబితిగా గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే నిర్మాణం వాడబడింది. ప్రతి విశేషణానికి ‘-డై’ రూపం ఇచ్చి, ముందరి సందర్భం నుండి కొనసాగుతున్న ‘ఉండాలి’ అనే విధిని చివరలో ఉంచాం.
