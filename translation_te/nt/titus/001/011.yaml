id: TIT.1.11
reference: Titus 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὓς δεῖ ἐπιστομίζειν, οἵτινες ὅλους οἴκους ἀνατρέπουσιν διδάσκοντες ἃ μὴ δεῖ αἰσχροῦ κέρδους χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/011.yaml
  text: They must be silenced[c][b][a], since they are upsetting whole households by teaching what they ought not for the sake of shameful gain.
translation:
  language: te
  text: వారిని మౌనింపజేయాలి[a]. ఎందుకంటే వారు సిగ్గుచేటైన లాభం కోసం బోధించకూడని వాటిని బోధిస్తూ, మొత్తం కుటుంబాలను[b] అస్తవ్యస్తం చేస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా, ‘వారి నోళ్లు మూయించాలి.’ ఇది వారి హానికరమైన బోధను నిలిపివేయాలనే భావాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘మొత్తం కుటుంబాలను’ అనేది కేవలం ఇళ్లను కాదు; ఒక ఇంటికి చెందిన కుటుంబ సభ్యులు మరియు వారిపై ఆధారపడినవారితో కూడిన గృహసమూహాలను సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: οὓς δεῖ ἐπιστομίζειν
  choice: వారి నోళ్లు మూయించాలి
  rationale: ἐπιστομίζειν అక్షరార్థంగా ‘నోరు మూయించడం’; సందర్భంలో హానికరమైన బోధను ఆపించడాన్ని సూచిస్తుంది. ‘మూయించాలి’ δεῖ తెలిపే అవసరతను, క్రియ యొక్క బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: οἵτινες
  choice: ఎందుకంటే వారు
  rationale: ఈ సంబంధవాచక రూపం ముందున్న అవసరానికి వివరణాత్మక కారణాన్ని పరిచయం చేస్తుంది.
- source_word: ὅλους οἴκους
  choice: కుటుంబాలకు కుటుంబాలనే
  rationale: οἶκος ఇక్కడ భవనాలకన్నా గృహసమూహాలు లేదా కుటుంబాలను సూచించే అవకాశం ఎక్కువ. ఈ తెలుగు ప్రయోగం మొత్తం కుటుంబాలు ప్రభావితమవుతున్నాయనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνατρέπουσιν
  choice: అస్తవ్యస్తం చేస్తున్నారు
  rationale: ఈ క్రియలో తలకిందులు చేయడం, చెదరగొట్టడం, పాడుచేయడం వంటి బలమైన భావం ఉంది. ‘అస్తవ్యస్తం చేస్తున్నారు’ సంపూర్ణ నాశనాన్ని అనవసరంగా ప్రకటించకుండా తీవ్రమైన భంగాన్ని తెలియజేస్తుంది.
- source_word: διδάσκοντες ἃ μὴ δεῖ
  choice: బోధించకూడని వాటిని బోధిస్తూ
  rationale: కృదంతం వారి చర్యకు సాధనం లేదా అనుబంధ పరిస్థితిని తెలుపుతుంది; μὴ δεῖ బోధనలోని అనుచితత్వాన్ని సూచిస్తుంది.
- source_word: αἰσχροῦ κέρδους χάριν
  choice: నీచమైన లాభం కోసం
  rationale: αἰσχρός నైతికంగా సిగ్గుచేటైన లేదా హీనమైన స్వభావాన్ని సూచిస్తుంది. ‘నీచమైన లాభం’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, ఆ లాభప్రేరణపై ఉన్న నైతిక ఖండనను నిలుపుతుంది.
theological_decisions:
- issue: అబద్ధ బోధకులను ఆపించాలనే ఆదేశం స్వభావం
  choice: వారి నోళ్లు మూయించాలి
  alternative: వారిని మౌనంగా చేయాలి
  rationale: గ్రీకు నుడికారం బలంగా ఉన్నప్పటికీ, వారిని ఎలా ఆపాలో—శారీరకంగా, పౌరపరంగా లేదా మరే విధంగానో—నిర్దేశించదు. ఈ అనువాదం వారి హానికరమైన బోధను నిలిపివేయాలనే భావాన్ని ఉంచుతూ, పాఠ్యంలో లేని శిక్షావిధానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరతను కాపాడే శైలి. గ్రీకు వాక్యంలోని కారణసంబంధం, బోధన వల్ల కలిగే కుటుంబవ్యాప్త భంగం, నీచ లాభప్రేరణ స్పష్టంగా ఉంచబడ్డాయి.
