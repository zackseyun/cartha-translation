  source_fidelity: 'గ్రీకు వాక్యనిర్మాణంలోని ప్రధాన అంశాలన్నీ సరిగ్గా ప్రతిఫలించాయి: ‘వారిలో ఒకడు’ (εἶπέν τις ἐξ αὐτῶν), ‘వారి సొంత ప్రవక్తే’ (ἴδιος αὐτῶν προφήτης), అలాగే ఉల్లేఖనంలోని మూడు కఠినమైన విశేషణాత్మక నిందలు. ‘సోమరి తిండిపోతులు’ అనేది γαστέρες ἀργαί యొక్క భావార్థాన్ని సహజంగా తెలియజేస్తూ, పాదటిప్పణిలోని పదశః ప్రత్యామ్నాయంతో సమతుల్యం చేస్తుంది.'
