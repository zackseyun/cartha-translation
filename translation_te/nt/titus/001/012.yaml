  terminology: ‘క్రేతీయులు’ ప్రామాణిక జాతినామం. ‘ప్రవక్త,’ ‘దుష్ట మృగాలు,’ మరియు ‘సోమరి తిండిపోతులు’ సందర్భానుకూలంగా ఉన్నాయి. [a] గుర్తు γαστέρες ἀργαίకి తగిన చోటే ఉంది; పాదటిప్పణి పదశః అర్థాన్ని సరిగ్గా ఇస్తుంది.
