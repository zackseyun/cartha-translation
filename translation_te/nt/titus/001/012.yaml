id: TIT.1.12
reference: Titus 1:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπέν τις ἐξ αὐτῶν, ἴδιος αὐτῶν προφήτης, Κρῆτες ἀεὶ ψεῦσται, κακὰ θηρία, γαστέρες ἀργαί·
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/012.yaml
  text: One of them[a], their own prophet, said, “Cretans are always liars, evil beasts, lazy gluttons.”
translation:
  language: te
  text: 'వారిలో ఒకడు, వారి సొంత ప్రవక్తే, ఇలా అన్నాడు: “క్రేతీయులు ఎప్పుడూ అబద్ధికులు, దుష్ట మృగాలు, సోమరి తిండిపోతులు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, “సోమరి కడుపులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπέν τις ἐξ αὐτῶν
  choice: వారిలో ఒకడు ... అన్నాడు
  rationale: τις ἐξ αὐτῶν అనే పదబంధం అనిర్దిష్ట వ్యక్తిని సూచిస్తూనే, అతడు ఆ సమూహంలోనివాడనే భాగార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἴδιος αὐτῶν προφήτης
  choice: వారి సొంత ప్రవక్తే
  rationale: ἴδιος అతడు క్రేతీయులకే చెందిన ప్రవక్త అని నొక్కిచెబుతుంది; ‘ఏ’ చేర్పు ఆ ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: Κρῆτες
  choice: క్రేతీయులు
  rationale: క్రేతు ద్వీపానికి చెందిన ప్రజలను సూచించే ప్రామాణిక తెలుగు జాతినామం.
- source_word: ἀεὶ ψεῦσται
  choice: ఎప్పుడూ అబద్ధికులు
  rationale: ἀεί యొక్క నిరంతర భావాన్ని ‘ఎప్పుడూ,’ ψεῦσται యొక్క నేరుగా ఉన్న అర్థాన్ని ‘అబద్ధికులు’ వ్యక్తం చేస్తాయి.
- source_word: κακὰ θηρία
  choice: దుష్ట మృగాలు
  rationale: ఈ రూపకం యొక్క జంతు చిత్రణను, κακά లోని నైతిక ప్రతికూలతను రెండింటినీ నేరుగా నిలుపుతుంది.
- source_word: γαστέρες ἀργαί
  choice: సోమరి తిండిపోతులు
  rationale: పదశః ‘సోమరి కడుపులు’; తెలుగులో వ్యక్తులపై చేసే ఈ నింద యొక్క భావం సహజంగా అర్థమయ్యేలా ‘సోమరి తిండిపోతులు’ అని ఇచ్చాం.
theological_decisions:
- issue: పౌలు ఉదహరించిన జాతివర్గంపై కఠినమైన సామెత
  choice: ఇది వారి సొంత ప్రవక్త పలికిన ఉల్లేఖనమని స్పష్టంగా ఉంచుతూ, ప్రతికూల పదాలను మృదువుచేయకుండా అనువదించడం
  alternative: జాతివర్గంపై ఉన్న కఠినతను తగ్గించేలా వ్యాఖ్యానాత్మకంగా మార్చడం
  rationale: గ్రీకు వాక్యం ఈ మాటలను క్రేతీయులలోని ఒకరి, వారి సొంత ప్రవక్త యొక్క ఉల్లేఖనంగా చూపుతుంది. అనువాదం ఆ వక్తృత్వ సందర్భాన్నీ కఠినతనాన్నీ నిలుపాలి; దీనిని సందర్భాతీతంగా క్రేతీయులందరిపై స్వతంత్ర సిద్ధాంత ప్రకటనగా విస్తరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ఉల్లేఖనంలోని గంభీరమైన మరియు కఠినమైన ధోరణిని నిలుపుతూ రూపొందించబడింది.
