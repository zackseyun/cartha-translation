revisions:
- from: అయితే తాను నిర్ణయించిన కాలాల్లో[a] ఆయన తన వాక్యాన్ని ప్రకటన[b] ద్వారా వెల్లడిచేశాడు; మన రక్షకుడైన దేవుని ఆజ్ఞ ప్రకారం ఆ ప్రకటన నాకు అప్పగించబడింది[c].
  to: అయితే తన సొంత కాలాల్లో[a] ఆయన తన వాక్యాన్ని ప్రకటన[b] ద్వారా వెల్లడించాడు; మన రక్షకుడైన దేవుని ఆజ్ఞ ప్రకారం ఆ ప్రకటన నాకు అప్పగించబడింది[c].
  rationale: The revision restores the possessive expression in καιροῖς ἰδίοις directly in the translation, rather than making the contextual inference of divine appointment explicit. It also uses a more idiomatic modern Telugu verb form. The syntactic ambiguity of ὃ is preserved in footnote c, and all existing footnote anchors remain correctly matched.
