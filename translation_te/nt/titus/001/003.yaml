id: TIT.1.3
reference: Titus 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐφανέρωσεν δὲ καιροῖς ἰδίοις, τὸν λόγον αὐτοῦ ἐν κηρύγματι ὃ ἐπιστεύθην ἐγὼ κατ’ ἐπιταγὴν τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/003.yaml
  text: but in his own times he revealed his word through the proclamation with which I was entrusted[a], according to the command of God our Savior[c][b],
translation:
  language: te
  text: అయితే తన సొంత కాలాల్లో[a] ఆయన తన వాక్యాన్ని ప్రకటన[b] ద్వారా వెల్లడించాడు; మన రక్షకుడైన దేవుని ఆజ్ఞ ప్రకారం ఆ ప్రకటన నాకు అప్పగించబడింది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా “తన సొంత కాలాల్లో.” “తగిన కాలాల్లో” అని కూడా అనువదించవచ్చు; ఇవి దేవుడు నియమించిన కాలాలను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “ప్రకటించడం ద్వారా” అని కూడా అనువదించవచ్చు. ఈ పదం ప్రకటించే కార్యాన్నిగానీ, ప్రకటించబడిన సందేశాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ఈ సంబంధవాక్యాన్ని “నాకు అప్పగించబడిన తన వాక్యాన్ని” అని ‘తన వాక్యం’తో కూడా అన్వయించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφανέρωσεν
  choice: వెల్లడిచేశాడు
  rationale: ఇంతకు ముందు తెలియకుండా ఉన్నదాన్ని బహిరంగంగా తెలియజేయడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; కర్తగా ముందరి సందర్భంలోని దేవుడే సూచించబడ్డాడు.
- source_word: καιροῖς ἰδίοις
  choice: తాను నిర్ణయించిన కాలాల్లో
  rationale: దేవునికి చెందిన, ఆయన ఉద్దేశానుసారం ఏర్పాటైన కాలాలు అనే గ్రీకు నుడికార భావాన్ని సహజమైన తెలుగులో అందిస్తుంది. అక్షరార్థంలోని స్వామ్యభావాన్ని పాదసూచికలో ఉంచాం.
- source_word: τὸν λόγον αὐτοῦ
  choice: తన వాక్యాన్ని
  rationale: λόγος దేవుడు తెలియజేసిన సందేశాన్ని సూచిస్తుంది; ‘వాక్యం’ మూలపదంతో ఉన్న భావసంబంధాన్ని నిలుపుతూ తెలుగు బైబిలు పఠనంలో సహజంగా ఉంటుంది.
- source_word: ἐν κηρύγματι
  choice: ప్రకటన ద్వారా
  rationale: ఇక్కడ ἐν సాధనార్థకంగా ఉంది. κήρυγμα ప్రకటించే కార్యాన్నీ, ప్రకటించబడిన సందేశాన్నీ సూచించగలదు; ‘ప్రకటన’ ఆ రెండు అవకాశాలను సాధ్యమైనంతవరకు తెరిచి ఉంచుతుంది.
- source_word: ὃ
  choice: ఆ ప్రకటన
  rationale: నపుంసక ఏకవచన సంబంధసర్వనామానికి అత్యంత సమీప పూర్వపదం κήρυγμα. తెలుగులో సంబంధవాక్యాన్ని స్పష్టంగా చూపేందుకు రెండో ఉపవాక్యంలో ‘ఆ ప్రకటన’ అని పునరుక్తి చేశాం.
- source_word: ἐπιστεύθην
  choice: నాకు అప్పగించబడింది
  rationale: ఈ కర్మణి ప్రయోగంలో πιστεύω ‘నమ్మాను’ అని కాక, బాధ్యతగా ఒకటి అప్పగించబడిందని అర్థం.
- source_word: κατ’ ἐπιταγὴν
  choice: ఆజ్ఞ ప్రకారం
  rationale: అధికారపూర్వకమైన ఆదేశానికి అనుగుణంగా లేదా దాని ఆధారంగా జరిగినదనే κατά భావాన్ని కచ్చితంగా తెలియజేస్తుంది.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: మన రక్షకుడైన దేవుని
  rationale: ‘దేవుడు’ మరియు ‘మన రక్షకుడు’ ఒకే వ్యక్తిని సూచించే అన్వయాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంతో నిలుపుతుంది.
theological_decisions:
- issue: ἐφανέρωσεν అనే క్రియలో అంతర్లీనంగా ఉన్న కర్త, καιροῖς ἰδίοις లోని స్వామ్యభావం
  choice: దేవుడే కర్త; ఆయన నిర్ణయించిన కాలాల్లో ఆయన వెల్లడిచేశాడు.
  alternative: ‘తగిన కాలంలో అది వెల్లడైంది’ అనే కర్తను స్పష్టంగా చెప్పని అనువాదం.
  rationale: ముందరి సందర్భంలో అబద్ధమాడని దేవుడు వాగ్దానం చేశాడని ఉంది; ఇప్పుడు అదే దేవుడు తన వాక్యాన్ని వెల్లడించాడనే ఆలోచనా ప్రవాహం సహజంగా కొనసాగుతుంది.
- issue: సంబంధసర్వనామమైన ὃ దేనిని సూచిస్తుంది?
  choice: అది అత్యంత సమీపంలోని ‘ప్రకటన’ (κήρυγμα)ను సూచిస్తుంది.
  alternative: అది ‘తన వాక్యం’ (τὸν λόγον αὐτοῦ)ను సూచిస్తూ, ‘నాకు అప్పగించబడిన తన వాక్యం’ అని అర్థం కావచ్చు.
  rationale: వ్యాకరణపరంగా సమీప పూర్వపదం κήρυγμα; అయితే ‘వాక్యం’ అనే పూర్వపదంతో అన్వయించే అవకాశం కూడా ఉన్నందున దాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. పొడవైన గ్రీకు వాక్యాన్ని అర్థస్పష్టత కోసం అర్ధవిరామంతో రెండు అనుబంధ ఉపవాక్యాలుగా అమర్చాం. ‘వెల్లడిచేశాడు’ మరియు ‘ప్రకటన’ అనే వేర్వేరు పదాలను వాడి ἐφανέρωσεν, κήρυγμα మధ్య తేడాను కాపాడాం.
