- from: బోధకు అనుగుణంగా ఉన్న నమ్మదగిన వాక్యాన్ని[a] అతడు గట్టిగా పట్టుకొని ఉండాలి. అప్పుడు ఆరోగ్యకరమైన బోధతో ప్రజలను ప్రోత్సహించడానికీ, దానిని ఎదిరించి మాట్లాడేవారిని గద్దించడానికీ[b] అతడు సమర్థుడై ఉంటాడు.
