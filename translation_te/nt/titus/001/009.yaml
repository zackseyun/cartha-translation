id: TIT.1.9
reference: Titus 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀντεχόμενον τοῦ κατὰ τὴν διδαχὴν πιστοῦ λόγου, ἵνα δυνατὸς ᾖ καὶ παρακαλεῖν ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ καὶ τοὺς ἀντιλέγοντας ἐλέγχειν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/009.yaml
  text: holding firmly to the trustworthy word in accordance with the teaching[b][a], so that he may be able both to exhort by sound teaching and to rebuke those who contradict it.
translation:
  language: te
  text: బోధకు అనుగుణమైన నమ్మదగిన వాక్యాన్ని[a] అతడు దృఢంగా పట్టుకొని ఉండాలి. తద్వారా, స్వస్థమైన బోధతో ప్రోత్సహించడానికీ, దానిని వ్యతిరేకించేవారిని గద్దించడానికీ[b] అతడు సమర్థుడై ఉండగలడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బోధ ప్రకారం నమ్మకమైన వాక్యాన్ని.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దానిని వ్యతిరేకించేవారి వాదన తప్పని నిరూపించడానికి.” గ్రీకు క్రియలో తప్పును బయటపెట్టడం, ఒకరు చెప్పేది తప్పని నిరూపించడం, లేదా గద్దించడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντεχόμενον
  choice: గట్టిగా పట్టుకొని ఉండాలి
  rationale: విడువకుండా దృఢంగా అనుసరించే క్రియాశీల భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πιστοῦ λόγου
  choice: నమ్మదగిన వాక్యాన్ని
  rationale: πιστός ఇక్కడ విశ్వసనీయమైనది, ఆధారపడదగినది అనే భావాన్ని ఇస్తుంది; λόγος‌కు ‘వాక్యం’ను ఉంచడం ద్వారా సందేశం అనే భావం నిలుస్తుంది.
- source_word: κατὰ τὴν διδαχήν
  choice: బోధకు అనుగుణంగా ఉన్న
  rationale: κατά పదం ప్రమాణానికి లేదా బోధతో గల సారూప్యతకు సూచన. నిర్దిష్టంగా గుర్తించబడిన బోధ అనే భావాన్ని కూడా నిలుపుతుంది.
- source_word: παρακαλεῖν
  choice: ప్రోత్సహించడానికి
  rationale: సందర్భంలో అధికారపూర్వకంగా పురికొల్పడం, హితవు చెప్పడం అనే విస్తృత భావం ఉంది. ‘ప్రోత్సహించడం’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది; ఇది కేవలం ఓదార్పు అనే అర్థంలో ఇక్కడ వాడబడలేదు.
- source_word: ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ
  choice: ఆరోగ్యకరమైన బోధతో
  rationale: ὑγιαίνωలోని ఆరోగ్యం/స్వస్థత రూపకాన్ని నిలుపుతూ, తప్పులేని శ్రేయస్కరమైన బోధ అనే భావాన్ని తెలియజేస్తుంది.
- source_word: ἀντιλέγοντας
  choice: దానిని ఎదిరించి మాట్లాడేవారిని
  rationale: వారు విశ్వసనీయమైన వాక్యాన్ని లేదా ఆరోగ్యకరమైన బోధను మాటలతో వ్యతిరేకిస్తున్నారనే భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐλέγχειν
  choice: గద్దించడానికి
  rationale: తప్పును బయటపెట్టి సరిదిద్దే బలమైన మందలింపు భావాన్ని అందిస్తుంది; వాదనను తప్పని నిరూపించడం అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: δυνατὸς ᾖ
  choice: సమర్థుడై ఉంటాడు
  rationale: ἵνα తెలిపే ఉద్దేశం లేదా ఫలితంలో అవసరమైన సామర్థ్యాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ‘బోధ’కు, ‘నమ్మదగిన వాక్యం’కు ఉన్న సూచన
  choice: సంఘ నాయకులకు అప్పగించబడిన, గుర్తించబడిన క్రైస్తవ బోధను సూచించేలా అనువదించబడింది.
  alternative: సాధారణ నైతిక ఉపదేశాన్ని మాత్రమే సూచించవచ్చు.
  rationale: διδαχήకు ఉన్న నిర్దిష్ట ఉపపదం, కాపరి పత్రికలలో πιστοῦ λόγου వాడుక—ఇవి స్థిరమైన బోధాసారాన్ని సూచిస్తాయి. అయితే తరువాతి కాలపు సాంకేతిక సిద్ధాంత పదజాలాన్ని వచనంలోకి తీసుకురాలేదు.
- issue: వ్యతిరేకించేవారి విషయంలో ἐλέγχειν భావం
  choice: గద్దించడం
  alternative: వారు చెప్పేది తప్పని నిరూపించడం
  rationale: ఈ వచనం సానుకూలంగా ప్రోత్సహించడాన్నీ, ప్రతికూలతను సరిదిద్దడాన్నీ కలిపి చెబుతుంది. ప్రధాన పాఠంలో కాపరి సంబంధమైన మందలింపు బలం నిలిపి, వాదనాత్మకంగా తప్పని నిరూపించే భావాన్ని పాదసూచికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. ‘ఆరోగ్యకరమైన బోధ’ ద్వారా మూలంలోని ఆరోగ్యం అనే రూపకం నిలుపబడింది. మొదటి వాక్యంలో విధిని, రెండవ వాక్యంలో దాని ఉద్దేశం/ఫలితాన్ని స్పష్టంగా చూపేందుకు గ్రీకు దీర్ఘ వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించాం.
