revisions:
- from: పవిత్రులైనవారికి అన్నీ పవిత్రమే; అయితే అపవిత్రులై నమ్మని వారికి[a] ఏదీ పవిత్రం కాదు. దానికి బదులు, వారి మనస్సూ మనస్సాక్షీ రెండూ అపవిత్రమై ఉన్నాయి.
  to: శుద్ధులైనవారికి అన్నీ శుద్ధమే; అయితే కలుషితులై నమ్మనివారికి[a] ఏదీ శుద్ధం కాదు. కానీ వారి మనస్సూ మనస్సాక్షీ రెండూ కలుషితమై ఉన్నాయి.
  rationale: The revision consistently renders καθαρός with ‘శుద్ధం,’ avoiding the more specifically holiness-oriented sense of ‘పవిత్రం.’ It renders the related defilement forms with ‘కలుషిత,’ retains the source’s paired emphasis on mind and conscience, and keeps the lexical-alternative footnote anchored in the same clause.
