id: TIT.1.15
reference: Titus 1:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀πάντα καθαρὰ τοῖς καθαροῖς· τοῖς δὲ μεμιαμμένοις καὶ ἀπίστοις οὐδὲν καθαρόν, ἀλλὰ μεμίανται αὐτῶν καὶ ὁ νοῦς καὶ ἡ συνείδησις.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/015.yaml
  text: All things are pure to the pure; but to those who are defiled and unbelieving[a], nothing is pure. Instead, both their mind and their conscience are defiled.
translation:
  language: te
  text: శుద్ధులైనవారికి అన్నీ శుద్ధమే; అయితే కలుషితులై నమ్మనివారికి[a] ఏదీ శుద్ధం కాదు. కానీ వారి మనస్సూ మనస్సాక్షీ రెండూ కలుషితమై ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ వచనమంతటా ‘పవిత్రం’; గ్రీకు పదాలు ఆచారపరమైన శుద్ధతనూ నైతిక స్వచ్ఛతనూ సూచించగలవు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: అన్నీ
  rationale: నపుంసక బహువచన రూపం సమగ్ర భావాన్ని ఇస్తుంది; తెలుగు సూక్తి నిర్మాణంలో ‘అన్నీ’ సహజంగా, విస్తృతంగా వినిపిస్తుంది.
- source_word: καθαρά / καθαρόν / καθαροῖς
  choice: పవిత్రం / పవిత్రులు
  rationale: καθαρός ఆచారపరమైన శుద్ధతనూ నైతిక పవిత్రతనూ సూచించగలదు. ‘పవిత్రం’ ఈ రెండు భావాలకు చోటు ఇస్తుంది; విశేషణాన్ని నామవాచకంగా వాడిన τοῖς καθαροῖς ను ‘పవిత్రులైనవారికి’గా సహజంగా అనువదించాం.
- source_word: τοῖς δὲ μεμιαμμένοις
  choice: అపవిత్రులైన వారికి
  rationale: పర్ఫెక్ట్ పార్టిసిపిల్ గతంలో కలిగిన కలుషం ఫలితంగా కొనసాగుతున్న స్థితిని సూచిస్తుంది; ‘అపవిత్రులై’ ఆ స్థితిని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἀπίστοις
  choice: నమ్మని
  rationale: ఈ సందర్భంలో ప్రధాన వ్యత్యాసం విశ్వాసానికి సంబంధించినది; ‘నమ్మని’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: οὐδὲν καθαρόν
  choice: ఏదీ పవిత్రం కాదు
  rationale: మొదటి ఉపవాక్యంలోని విస్తృత వాక్యనిర్మాణాన్ని ప్రతిబింబిస్తూ అదే శుద్ధత/పవిత్రత భావక్షేత్రాన్ని నిలుపుతుంది.
- source_word: ἀλλὰ
  choice: దానికి బదులు
  rationale: బాహ్య వస్తువులకన్నా వారి అంతరంగ సామర్థ్యాలే అపవిత్రమయ్యాయని తెలిపే బలమైన వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
- source_word: μεμίανται
  choice: అపవిత్రమై ఉన్నాయి
  rationale: పర్ఫెక్ట్ రూపంలోని ఫలితస్థితిని, ముందు వచ్చిన μεμιαμμένοις తోని పదసంబంధాన్ని నిలుపుతుంది.
- source_word: νοῦς
  choice: మనస్సు
  rationale: ఆలోచన, గ్రహణ సామర్థ్యాన్ని సూచించే సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: συνείδησις
  choice: మనస్సాక్షి
  rationale: నైతిక స్వీయ అవగాహనను, తీర్పు చెప్పే అంతరంగ సామర్థ్యాన్ని సూచించే స్థిరమైన తెలుగు సమానార్థకం.
- source_word: καὶ ... καὶ
  choice: మనస్సూ మనస్సాక్షీ రెండూ
  rationale: జతగా వచ్చిన καὶ ... καὶ రెండు అంతరంగ సామర్థ్యాలూ ప్రభావితమయ్యాయని నొక్కిచెబుతుంది; ‘రెండూ’ ఆ బలాన్ని సహజ తెలుగులో చూపుతుంది.
theological_decisions:
- issue: శుద్ధత భాష యొక్క పరిధి
  choice: καθαρός ను పద్యమంతటా ‘పవిత్రం/పవిత్రులు’గా అనువదించడం
  alternative: పద్యమంతటా ‘శుద్ధం/శుద్ధులు’గా అనువదించి ఆచారపరమైన పరిశుద్ధతను ఎక్కువగా ముందుకు తేవడం
  rationale: సమీప సందర్భంలో యూదుల నియమాలు, శుద్ధత సంబంధిత వివాదాలు ఉన్నప్పటికీ, ఈ మాట బాహ్య విషయాలకే పరిమితం కాక వ్యక్తి మనస్సు, మనస్సాక్షి స్థితికి విస్తరిస్తుంది. ‘పవిత్రం’ ఆచారపరమైన మరియు నైతిక భావాల మధ్యనున్న ఉద్రిక్తతను పూర్తిగా తొలగించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మొదటి రెండు ఉపవాక్యాల సూక్తి స్వరూపాన్ని, చివరి ఉపవాక్యంలోని అంతరంగ వ్యత్యాసాన్ని నిలిపాం. ‘మనస్సూ మనస్సాక్షీ రెండూ’ అనే నిర్మాణం గ్రీకు జత-ఉద్ఘాటనను సహజంగా ప్రతిబింబిస్తుంది.
