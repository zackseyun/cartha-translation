id: TIT.1.13
reference: Titus 1:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ μαρτυρία αὕτη ἐστὶν ἀληθής. δι’ ἣν αἰτίαν ἔλεγχε αὐτοὺς ἀποτόμως, ἵνα ὑγιαίνωσιν ἐν τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/013.yaml
  text: This testimony is true. For this reason[a], rebuke them sharply, so that they may be sound in the faith,
translation:
  language: te
  text: ఈ సాక్ష్యం నిజం. అందుచేత, వారు విశ్వాసంలో[a] సుస్థిరంగా ఉండేలా వారిని కఠినంగా గద్దించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ విశ్వాసంలో సుస్థిరంగా.” గ్రీకు పదబంధం వారు వ్యక్తిగతంగా నమ్మే విశ్వాసంలో సుస్థిరంగా ఉండడాన్నీ, లేదా బోధల సమాహారమైన క్రైస్తవ విశ్వాసంలో సుస్థిరంగా ఉండడాన్నీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρία
  choice: సాక్ష్యం
  rationale: ముందటి వచనంలో ఉదహరించిన క్రీటీయుల గురించిన వాక్యాన్ని ఆధారసహితమైన సాక్ష్యంగా సూచించే భావాన్ని నిలుపుతుంది.
- source_word: ἀληθής
  choice: నిజం
  rationale: ఆ సాక్ష్యం వాస్తవానికి అనుగుణమైనదని తెలిపే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: δι’ ἣν αἰτίαν
  choice: అందుచేత
  rationale: ముందటి నిర్ధారణనుంచి వచ్చే కారణపూర్వక ఆదేశాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἔλεγχε
  choice: గద్దించు
  rationale: తప్పును నేరుగా ఎదుర్కొని దిద్దే ఆజ్ఞలోని బలాన్ని ‘సరిదిద్దు’ కంటే స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀποτόμως
  choice: కఠినంగా
  rationale: గద్దింపు తీవ్రంగా, రాజీపడకుండా ఉండాలనే భావాన్ని అతిశయోక్తి లేకుండా తెలియజేస్తుంది.
- source_word: ὑγιαίνωσιν
  choice: ఆరోగ్యంగా ఉండేలా
  rationale: క్రియలోని ఆరోగ్య రూపకాన్ని నిలుపుతూ, విశ్వాస సంబంధమైన సవ్యస్థితిని సూచిస్తుంది.
- source_word: πίστει
  choice: విశ్వాసంలో
  rationale: గ్రీకు పదబంధం వ్యక్తిగతంగా నమ్మడాన్నీ, విశ్వాస బోధల సమాహారాన్నీ సూచించగలదు; తెలుగు రూపం ఆ రెండు అవకాశాలను తెరిచి ఉంచుతుంది.
theological_decisions:
- issue: ἐν τῇ πίστει అనే పదబంధం యొక్క భావం
  choice: విశ్వాసంలో
  alternative: తమ విశ్వాసంలో; క్రైస్తవ విశ్వాస సత్యంలో
  rationale: సందర్భం తప్పుడు బోధను ఎదుర్కోవడం గురించినదైనందున విశ్వాస బోధల సమాహారం ప్రధాన అవకాశంగా కనిపిస్తుంది. అయినా, గ్రీకు పదబంధం వారి వ్యక్తిగత విశ్వాస స్థితిని కూడా సూచించవచ్చు; అందువల్ల ప్రధాన పాఠంలో అస్పష్టతను నిలిపి, రెండు భావాలను పాదటిప్పణిలో పేర్కొన్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. ‘ఆరోగ్యంగా’ అనే పదం మూలంలోని ఆరోగ్య రూపకాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది; ‘కఠినంగా గద్దించు’ మూలంలోని నేరుగా ఎదుర్కొనే తీవ్రతను వ్యక్తం చేస్తుంది.
