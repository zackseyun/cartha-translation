revisions:
- from: ఈ సాక్ష్యం నిజం. అందుచేత వారు విశ్వాసంలో[a] ఆరోగ్యంగా ఉండేలా వారిని కఠినంగా గద్దించు.
  to: ఈ సాక్ష్యం నిజం. అందుచేత, వారు విశ్వాసంలో[a] సుస్థిరంగా ఉండేలా వారిని కఠినంగా గద్దించు.
  rationale: The revision improves modern Telugu idiom for the figurative health language while retaining the corrective purpose of the command. It preserves the ambiguity of ἐν τῇ πίστει in the main text and explicitly retains both viable readings in the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:02:45Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the assertion, causal inference, imperative, severity, and purpose clause. ‘విశ్వాసంలో’ appropriately leaves open the debated scope of ἐν τῇ πίστει while the footnote records the alternatives. ‘ఆరోగ్యంగా’ retains the source verb’s health metaphor, but the resulting Telugu expression is less idiomatic in this figurative context.
  naturalness: The clause ‘విశ్వాసంలో ఆరోగ్యంగా ఉండేలా’ is understandable but sounds calqued in modern standard Telugu. ‘విశ్వాసంలో సుస్థిరంగా ఉండేలా’ is more natural and communicates the intended figurative sense of being sound/healthy in faith. The reordered purpose clause also reads more smoothly.
  terminology: ‘సాక్ష్యం,’ ‘నిజం,’ ‘కఠినంగా గద్దించు,’ and ‘విశ్వాసం’ are suitable. The footnote’s ‘సవ్యంగా ఉండడం’ is not a natural or precise description here; ‘సుస్థిరంగా ఉండడం’ better corresponds to the revised rendering and to the figurative force of ὑγιαίνωσιν.
  issues:
  - severity: low
    issue: Figurative rendering of ὑγιαίνωσιν is somewhat unnatural in the main text.
    rationale: ‘విశ్వాసంలో ఆరోగ్యంగా’ preserves the literal metaphor but is not the most idiomatic modern Telugu expression. A natural figurative equivalent is preferable without changing the sense.
  - severity: low
    issue: Footnote wording is stylistically awkward and does not align well with the intended sense.
    rationale: ‘క్రైస్తవ విశ్వాసంలో సవ్యంగా ఉండడం’ is less natural than ‘క్రైస్తవ విశ్వాసంలో సుస్థిరంగా ఉండడం.’
  revised_text: ఈ సాక్ష్యం నిజం. అందుచేత, వారు విశ్వాసంలో[a] సుస్థిరంగా ఉండేలా వారిని కఠినంగా గద్దించు.
  revised_footnotes:
