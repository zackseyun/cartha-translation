id: TIT.1.10
reference: Titus 1:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἰσὶν γὰρ πολλοὶ ⸀καὶ ἀνυπότακτοι, ματαιολόγοι καὶ φρεναπάται, μάλιστα οἱ ἐκ ⸀τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/010.yaml
  text: For there are many rebellious people[a], empty talkers and deceivers, especially those of the circumcision,
translation:
  language: te
  text: ఎందుకంటే, లోబడనివారు, వ్యర్థమైన మాటలు మాట్లాడేవారు, మోసగించేవారు చాలామంది ఉన్నారు—ముఖ్యంగా సున్నతి పొందినవారిలోనివారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సున్నతి వర్గానికి చెందినవారు” లేదా “సున్నతికి చెందినవారు.” ఈ మాట యూదులనో, యూదా ఆచారాలను ప్రోత్సహించిన ప్రత్యర్థులనో సూచించే అవకాశం ఉంది; అయితే గ్రీకు మూలం అంత స్పష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని ఆదేశానికి కారణాన్ని వివరిస్తున్న అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగులో చూపిస్తుంది.
- source_word: πολλοὶ
  choice: చాలామంది
  rationale: సందర్భంలో వ్యక్తులను సూచించే గ్రీకు విశేషణాన్ని తెలుగులో సహజంగా నామవాచక రూపంలో వ్యక్తపరుస్తుంది.
- source_word: ἀνυπότακτοι
  choice: లోబడని వారు
  rationale: తగిన అధికారానికి విధేయులుగా ఉండకపోవడం అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది; అతిగా వ్యాఖ్యానించే ‘తిరుగుబాటుదారులు’ కంటే మూలానికి దగ్గరగా ఉంటుంది.
- source_word: ματαιολόγοι
  choice: వ్యర్థమైన మాటలు మాట్లాడేవారు
  rationale: ఫలితం లేదా విలువ లేని మాటలు మాట్లాడేవారు అనే సమాసపద భావాన్ని సాధారణ పాఠకులకు సహజంగా అందిస్తుంది.
- source_word: φρεναπάται
  choice: మోసగించేవారు
  rationale: మనస్సును తప్పుదారి పట్టించడం అనే అంతర్భావాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: μάλιστα
  choice: ముఖ్యంగా
  rationale: పెద్ద సమూహంలోని ఒక వర్గానికి ప్రత్యేక ప్రాధాన్యం ఇస్తున్న భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: οἱ ἐκ τῆς περιτομῆς
  choice: సున్నతికి చెందినవారు
  rationale: అక్షరార్థంగా ‘సున్నతి నుండి/సున్నతికి చెందినవారు’ అనే అస్పష్టతను నిలుపుతుంది; మూలంలో లేని ‘వర్గం,’ ‘యూదులు’ లేదా ‘యూదా మతాచారవాదులు’ వంటి స్పష్టీకరణలను ప్రధాన పాఠ్యంలో చేర్చదు.
theological_decisions:
- issue: ‘οἱ ἐκ τῆς περιτομῆς’ ఎవరిని సూచిస్తుంది?
  choice: సున్నతికి చెందినవారు
  alternative: సున్నతి వర్గానికి చెందినవారు; యూదులలోనివారు; సున్నతిని బోధించే వర్గానికి చెందినవారు
  rationale: ఈ పదబంధం యూదులనో, యూదా ఆచారాలను బలపరిచే ప్రత్యర్థులనో సూచించే అవకాశం ఉన్నప్పటికీ, గ్రీకు మూలం అంత స్పష్టంగా చెప్పదు. అందువల్ల ప్రధాన పాఠ్యం మూలంలోని సంక్షిప్తతనూ చారిత్రక అస్పష్టతనూ కాపాడుతుంది; వివరణను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. జాబితాలోని మూడు వర్ణనలకు సమాంతర నిర్మాణం ఉంచబడింది. చివరి పదబంధంలో మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతూ పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
