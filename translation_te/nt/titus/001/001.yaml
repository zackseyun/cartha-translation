  text: Παῦλος δοῦλος θεοῦ, ἀπόστολος δὲ Ἰησοῦ Χριστοῦ κατὰ πίστιν ἐκλεκτῶν θεοῦ καὶ ἐπίγνωσιν ἀληθείας τῆς κατ’ εὐσέβειαν
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/001.yaml
  text: Paul[a], a servant of God and an apostle of Jesus the Messiah, for the faith of God’s chosen ones and the knowledge of the truth that accords with godliness[c][b],
translation:
  language: te
  text: దేవుని దాసుడును, యేసు మెస్సీయ యొక్క అపొస్తలుడును అయిన పౌలు—దేవుడు ఎన్నుకున్నవారి విశ్వాసం కోసమూ[a], దైవభక్తికి అనుగుణమైన సత్యజ్ఞానం కోసమూ[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుడు ఎన్నుకున్నవారి విశ్వాసానికి అనుగుణంగానూ.’
    reason: κατά లక్ష్యం లేదా ప్రమాణం/అనుగుణతను సూచించగలదు.
  - marker: b
    text: లేదా, ‘సత్యాన్ని సంపూర్ణంగా తెలుసుకోవడం కోసమూ.’
    reason: ἐπίγνωσις సాధారణ జ్ఞానం కంటే సమగ్రమైన లేదా సంపూర్ణమైన అవగాహన ఛాయను కలిగి ఉండవచ్చు.
  - marker: c
    text: లేదా, ‘దైవభక్తికి నడిపించే సత్యజ్ఞానం కోసమూ.’
    reason: κατ’ εὐσέβειαν సత్యం దైవభక్తిని కలిగించే దిశను సూచిస్తుందని కూడా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: δοῦλος θεοῦ
  choice: దేవుని దాసుడిని
  rationale: δοῦλος దేవునికి పూర్తిగా చెందినవాడనే భావాన్ని కలిగి ఉంది. ఆధునిక తెలుగులో ‘బానిస’ అనవసరంగా అవమానకరమైన సామాజిక ఛాయను ముందుకు తెస్తుంది; ‘దాసుడు’ మాత్రం చెందినత్వం, సేవ రెండింటినీ గౌరవప్రదంగా నిలుపుతుంది.
- source_word: ἀπόστολος δὲ Ἰησοῦ Χριστοῦ
  choice: మెస్సీయ అయిన యేసు అపొస్తలుడిని
  rationale: ἀπόστολος నియమించి పంపబడిన అధికారిక ప్రతినిధిని సూచిస్తుంది; సంఘ వాడుకలో స్థిరపడిన ‘అపొస్తలుడు’ సరైనది. Χριστόςను పేరులో భాగంగా కాక ‘మెస్సీయ’ అనే బిరుదుగా స్పష్టంచేశాం.
- source_word: κατὰ πίστιν
  choice: విశ్వాసం కోసమూ
  rationale: κατά ఇక్కడ పౌలు అపొస్తలత్వం ఏ లక్ష్యానికి లేదా దిశకు సంబంధించినదో సూచించవచ్చు. ‘కోసం’ అనే రూపం ఆ సేవ దేవుడు ఎన్నుకున్నవారి విశ్వాసాన్ని లక్ష్యంగా కలిగిందనే సహజ పఠనాన్ని ఇస్తుంది; ప్రత్యామ్నాయ సంబంధాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐκλεκτῶν θεοῦ
  choice: దేవుడు ఎన్నుకున్నవారి
  rationale: దేవుని ఎంపికను స్పష్టంగా ఉంచుతూ, సిద్ధాంతపరమైన సాంకేతిక పదజాలాన్ని రుద్దకుండా సాధారణ పాఠకులకు సహజంగా ఉంది.
- source_word: ἐπίγνωσιν ἀληθείας
  choice: సత్యాన్ని వారు తెలుసుకోవడం
  rationale: తెలుగులో ‘సత్యజ్ఞానం’ కంటే ఈ క్రియాత్మక రూపం సహజంగా ఉంది. ἐπίγνωσιςలో ఉండగల మరింత సంపూర్ణమైన జ్ఞాన భావాన్ని పాదసూచికలో సూచించాం.
- source_word: τῆς κατ’ εὐσέβειαν
  choice: దైవభక్తికి అనుగుణమైన
  rationale: κατάను ‘అనుగుణమైన’ అని అనువదించడం సత్యం మరియు దైవభక్తి మధ్య ఉన్న సంబంధాన్ని నిలుపుతుంది; కారణార్థకంగా ‘దైవభక్తికి నడిపించే’ అని మాత్రమే నిర్ణయించదు.
theological_decisions:
- issue: κατὰ πίστιν ... καὶ ἐπίγνωσιν పౌలు అపొస్తలత్వంతో కలిగిన సంబంధం
  choice: అపొస్తలత్వం దేవుడు ఎన్నుకున్నవారి విశ్వాసం మరియు సత్యజ్ఞానం కోసం ఉద్దేశించబడింది
  alternative: అపొస్తలత్వం వారి విశ్వాసం మరియు సత్యజ్ఞానానికి అనుగుణంగా ఉంది
  rationale: గ్రీకు నిర్మాణం సంక్షిప్తంగా ఉండి లక్ష్యం, సంబంధం, ప్రమాణం అనే ఛాయలను అనుమతిస్తుంది. సందర్భంలో లక్ష్యార్థం సహజమైనదైనా, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- issue: τῆς κατ’ εὐσέβειανలో κατά సంబంధం
  choice: సత్యం దైవభక్తికి అనుగుణంగా ఉంటుంది
  alternative: సత్యం దైవభక్తికి నడిపిస్తుంది
  rationale: మూలపాఠం సంబంధాన్ని చెబుతుంది కానీ దానిని తప్పనిసరిగా ఫలితార్థకంగా పరిమితం చేయదు. అందువల్ల ప్రధాన పాఠంలో విస్తృతమైన సంబంధార్థాన్ని ఉంచాం.
- issue: ἐκλεκτῶν θεοῦ యొక్క సిద్ధాంతపరమైన వ్యక్తీకరణ
  choice: దేవుడు ఎన్నుకున్నవారు
  alternative: దేవుని ఎన్నికైనవారు
  rationale: దైవ ఎంపికను యథాతథంగా ఉంచి, ఒక ప్రత్యేక సంప్రదాయానికి చెందిన సాంకేతిక పదంగా వినిపించే రూపాన్ని నివారించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన పత్రికా-ప్రారంభ శైలిని వాడాం. మూల వాక్యం తదుపరి వచనాల్లో కొనసాగుతున్నందున చివర కామాను ఉంచాం. ‘మెస్సీయ అయిన యేసు’ బిరుదును స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది; ‘దాసుడు’ చెందినత్వాన్ని నిలుపుతూ ‘బానిస’ అనే ఆధునిక అవమాన ఛాయను నివారిస్తుంది. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠంలో ఉన్నాయి.
