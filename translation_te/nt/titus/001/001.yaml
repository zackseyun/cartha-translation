- from: దేవుని దాసుడిని, మెస్సీయ అయిన యేసు అపొస్తలుడిని అయిన పౌలు—దేవుడు ఎన్నుకున్నవారి విశ్వాసం కోసమూ[a], దైవభక్తికి అనుగుణమైన[c] సత్యాన్ని వారు తెలుసుకోవడం కోసమూ[b],
