translation:
  language: te
  text: నిత్యజీవ నిరీక్షణలో—అబద్ధం చెప్పని దేవుడు ఆ జీవాన్ని యుగకాలాలకు ముందే[a] వాగ్దానం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కాలం మొదలుకాకముందే.” గ్రీకు పదబంధం అక్షరార్థంగా “యుగకాలాలకు ముందు” అని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπ’ ἐλπίδι
  choice: నిరీక్షణపై ఆధారపడి ఉంది
  rationale: ἐπί + దత్తివ విభక్తి ఆధారం, పరిస్థితి లేదా పరిధిని సూచించగలదు. ముందటి వాక్యంతో దీని సంబంధాన్ని తెలుగులో స్పష్టంగా ఉంచుతూ, కేవలం కారణార్థానికే పరిమితం చేయకుండా ఈ రూపం ఎంచుకున్నాం.
- source_word: ζωῆς αἰωνίου
  choice: నిత్యజీవం గురించిన
  rationale: ఇక్కడ షష్ఠీ విభక్తి నిరీక్షణ యొక్క విషయాన్ని సూచిస్తుంది. ‘నిత్యజీవం’ వ్యవధినీ కొత్త నిబంధనలోని వేదాంతపరమైన ప్రతిధ్వనినీ సహజంగా నిలుపుతుంది.
- source_word: ἣν
  choice: ఆ జీవాన్ని
  rationale: స్త్రీలింగ ఏకవచన సంబంధసర్వనామం సమీపంలోని ‘నిత్యజీవం’ను సూచించడం అత్యంత సహజం. తెలుగులో సూచన సందిగ్ధం కాకుండా ‘ఆ జీవాన్ని’ అని వ్యక్తం చేశాం.
- source_word: ἐπηγγείλατο
  choice: వాగ్దానం చేశాడు
  rationale: ἐπαγγέλλομαι యొక్క భూతకాల భావాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది; గ్రీకు మధ్యమ ప్రయోగాన్ని కృత్రిమంగా విస్తరించలేదు.
- source_word: ὁ ἀψευδὴς θεὸς
  choice: అబద్ధమాడని దేవుడు
  rationale: ἀψευδής నేరుగా ‘అబద్ధం చెప్పని, సత్యవంతుడైన’ అనే భావం ఇస్తుంది. ‘అబద్ధమాడలేని’ అని అనువదిస్తే మూలంలోని విశేషణం కంటే బలమైన తాత్త్విక వాదనను చేర్చినట్లవుతుంది.
- source_word: πρὸ χρόνων αἰωνίων
  choice: యుగయుగాల కాలాలకు ముందే
  rationale: χρόνων αἰωνίων అనే అసాధారణ కాలవ్యక్తీకరణలోని ‘యుగాలు/దీర్ఘకాలాలు’ భావాన్ని నిలుపుతూ, వాగ్దానం చరిత్రాతీత పూర్వకాలానికి చెందినదని తెలుగులో తెలియజేస్తుంది. ‘కాలం మొదలుకాకముందే’ అనే సులభ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: πρὸ χρόνων αἰωνίων అనే కాలపదబంధం మరియు దేవుని వాగ్దానం
  choice: ‘యుగయుగాల కాలాలకు ముందే’ అని ఉంచి, ఆ వాగ్దానం ఎవరికి చేయబడిందో లేదా దాని తాత్త్విక విధానం ఏమిటో నిర్దేశించలేదు.
  alternative: ‘కాలం మొదలుకాకముందే’; ‘అనాదికాలానికి ముందే’; ‘నిత్యత్వం నుంచే’
  rationale: గ్రీకు వాక్యం వాగ్దానాన్ని యుగాలకు ముందుంచుతుంది; అయితే దానిని త్రిత్వంలోని అంతర్గత వాగ్దానంగా, దైవ నిర్ణయంగా లేదా పూర్వకాల సంకల్పంగా వివరించదు. అనువాదం ఆ ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
- issue: దేవుని ἀψευδής అని వర్ణించడం
  choice: ‘అబద్ధమాడని దేవుడు’
  alternative: ‘అబద్ధమాడలేని దేవుడు’; ‘సత్యవంతుడైన దేవుడు’
  rationale: ఇది మూలంలోని నైతిక వర్ణనను నేరుగా అందిస్తుంది. ‘అబద్ధమాడలేని’ అనేది మూలపదం కంటే బలమైన సామర్థ్యసంబంధ తాత్త్విక నిర్ధారణను చేర్చవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఇది తీతు 1:1లో మొదలైన దీర్ఘ వాక్యానికి కొనసాగింపు కావడంతో మొదటి భాగంలో ‘ఆధారపడి ఉంది’ అని సంబంధాన్ని వ్యక్తం చేశాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత కాలపదబంధం వద్ద ఉంచబడింది.
