  text: θεὸν ὁμολογοῦσιν εἰδέναι, τοῖς δὲ ἔργοις ἀρνοῦνται, βδελυκτοὶ ὄντες καὶ ἀπειθεῖς καὶ πρὸς πᾶν ἔργον ἀγαθὸν ἀδόκιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/016.yaml
  text: They profess to know God[a], but by their works they deny him[d][c][b], being detestable and disobedient and unfit for every good work.
translation:
  language: te
  text: వారు దేవుణ్ణి తెలుసని చెప్పుకుంటారు[a], కానీ తమ క్రియల ద్వారా ఆయనను నిరాకరిస్తారు[b]; వారు అసహ్యమైనవారు[c], అవిధేయులు, ప్రతి మంచి కార్యానికీ అనర్హులు[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తాము దేవుణ్ణి ఎరిగినవారమని ప్రకటిస్తారు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తమ చేతలతో ఆయనను నిరాకరిస్తారు.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఏవగింపదగినవారు.”
    reason: lexical_alternative
  - marker: d
    text: లేదా, “ప్రతి మంచి కార్యానికీ పనికిరానివారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν
  choice: దేవుణ్ణి
  rationale: ὁμολογοῦσιν εἰδέναι అనే క్రియాసముదాయానికి ప్రత్యక్ష కర్మ; తెలుగులో సహజమైన ద్వితీయా విభక్తి రూపం.
- source_word: ὁμολογοῦσιν
  choice: చెప్పుకుంటారు
  rationale: మాటలతో చేసే వాదనను, తరువాత క్రియలతో కనిపించే విరుద్ధతను సహజ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఇక్కడ ‘ఒప్పుకుంటారు’ అనే అర్థం కంటే ‘తాము అలా ఉన్నామని చెప్పుకుంటారు’ అనేదే సందర్భోచితం.
- source_word: εἰδέναι
  choice: ఎరిగినవారమని
  rationale: దేవునితో వ్యక్తిగత పరిచయం లేదా జ్ఞానం ఉందనే వారి వాదనను గౌరవప్రదమైన, బైబిలు సందర్భానికి తగిన తెలుగులో తెలియజేస్తుంది.
- source_word: τοῖς δὲ ἔργοις
  choice: కాని తమ క్రియల ద్వారా
  rationale: దత్తివిభక్తి ఇక్కడ సాధనం లేదా ఆధారాన్ని సూచిస్తుంది; వారి ప్రవర్తనే నిరాకరణకు మాధ్యమమని స్పష్టం చేస్తుంది.
- source_word: ἀρνοῦνται
  choice: ఆయనను నిరాకరిస్తారు
  rationale: మొదటి ఉపవాక్యంలోని ‘దేవుణ్ణి’ అనే కర్మను సహజంగా కొనసాగిస్తూ, మాటలలోని ప్రకటనకు బలమైన వ్యతిరేకతను నిలుపుతుంది.
- source_word: βδελυκτοὶ
  choice: అసహ్యులు
  rationale: నైతికంగా ఏవగింపదగినవారు అనే తీవ్రమైన భావాన్ని ఆధునిక, సులభమైన తెలుగులో అందిస్తుంది.
- source_word: ὄντες
  choice: వారు ...
  rationale: గ్రీకు వర్తమాన కృదంతాన్ని తెలుగులో వేరొక సహజ వాక్యంగా వ్యక్తం చేశాం; వివరణాత్మక సంబంధం నిలిచింది.
- source_word: ἀπειθεῖς
  choice: అవిధేయులు
  rationale: కేవలం నమ్మకపోవడం కాక, లోబడటానికి నిరాకరించే నైతిక భావాన్ని కాపాడుతుంది.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: ప్రతి మంచి కార్యానికీ
  rationale: πρός ఇక్కడ యోగ్యత లేదా అనుకూలతకు సంబంధించిన భావాన్ని ఇస్తుంది; ἀδόκιμοιతో కలిపి సహజ తెలుగు నిర్మాణం.
- source_word: ἀδόκιμοι
  choice: పనికిరానివారు
  rationale: పరీక్షలో ఆమోదం పొందక, మంచి కార్యానికి తగనివారు అనే సందర్భార్థాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది; ‘అనర్హులు’ అనే ప్రత్యామ్నాయం కూడా సాధ్యం.
theological_decisions:
- issue: మాటలలో దేవుణ్ణి ఎరుగుదుమనే ప్రకటనకు, క్రియలలో ఆయనను నిరాకరించడానికి మధ్య సంబంధం
  choice: వారు దేవుణ్ణి ఎరిగినవారమని మాటలతో చెప్పుకుంటారు; వారి క్రియలే ఆయనను నిరాకరిస్తాయి.
  alternative: రెండవ ఉపవాక్యాన్ని దేవుణ్ణి స్వయంగా నిరాకరించడం కాక, దేవుని సత్యాన్ని సాధారణంగా నిరాకరించడం అని విస్తరించవచ్చు.
  rationale: మొదటి ఉపవాక్యంలోని ప్రత్యక్ష కర్మ θεόν రెండవ ఉపవాక్యంలో సహజంగా కొనసాగుతుంది. మూలంలో ఉన్న నైతిక-దైవశాస్త్రీయ ఉద్రిక్తతను వివరణతో తగ్గించకుండా అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘ఎరిగినవారమని’ బైబిలు సందర్భానికి తగిన గంభీరతను నిలుపుతుండగా, ‘చెప్పుకుంటారు’ బాహ్య ప్రకటనకు మరియు వాస్తవ ప్రవర్తనకు మధ్య వ్యత్యాసాన్ని సహజంగా చూపుతుంది. మూలంలోని మూడు సమాంతర విశేషణ భావాలు స్పష్టంగా నిలుపబడ్డాయి.
