revisions:
- from: వారు దేవుణ్ణి ఎరిగినవారమని చెప్పుకుంటారు[a]; కాని తమ క్రియల ద్వారా ఆయనను నిరాకరిస్తారు[b]. వారు అసహ్యులు[c], అవిధేయులు, ప్రతి మంచి కార్యానికీ పనికిరానివారు[d].
