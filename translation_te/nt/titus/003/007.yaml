id: TIT.3.7
reference: Titus 3:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα δικαιωθέντες τῇ ἐκείνου χάριτι κληρονόμοι ⸀γενηθῶμεν κατ’ ἐλπίδα ζωῆς αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/007.yaml
  text: so that[a], having been justified by his grace[b], we might become heirs according to the hope of eternal life.
translation:
  language: te
  text: తద్వారా, ఆయన కృపచేత మనం నీతిమంతులుగా తీర్చబడి[a], నిత్యజీవ నిరీక్షణ ప్రకారం వారసులమవునట్లు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీతిమంతులుగా తీర్చబడి’ అనే మాటను ‘నీతిమంతులని ప్రకటించబడి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నిత్యజీవ నిరీక్షణలో వారసులమవునట్లు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: తద్వారా
  rationale: ముందటి వాక్యంలో చెప్పిన రక్షణ కార్యం యొక్క ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో రెండింటికీ తగిన సహజమైన అనుసంధానం.
- source_word: δικαιωθέντες
  choice: నీతిమంతులుగా తీర్చబడి
  rationale: భూతకాలిక నిష్క్రియార్థక అసమాపక క్రియను నిలుపుతూ, δικαιόω అనే రక్షణసంబంధ పదానికి పరిచితమైన తెలుగు సమానార్థాన్ని ఇస్తుంది.
- source_word: τῇ ἐκείνου χάριτι
  choice: ఆయన కృపవల్ల
  rationale: కృపను సాధనంగా చూపే దత్తివిభక్తి భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ἐκείνου ఎవరిని సూచిస్తుందో పేరుపెట్టి పరిమితం చేయదు.
- source_word: κληρονόμοι
  choice: వారసులు
  rationale: స్వాస్థ్యం పొందే వారి రూపకాన్ని స్పష్టంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: γενηθῶμεν
  choice: మనం ... కావాలి
  rationale: ἵνα తరువాతి భూతకాలిక సంభావనార్థక రూపం లక్ష్యంగా ఏర్పడే స్థితిని సూచిస్తుంది; తెలుగులో ఉద్దేశార్థక వాక్యనిర్మాణానికి ఇది సహజం, అయితే నైతిక ఆజ్ఞగా అర్థం చేసుకోకూడదు.
- source_word: κατ’ ἐλπίδα
  choice: నిరీక్షణకు అనుగుణంగా
  rationale: κατά యొక్క సంబంధార్థాన్ని సాధ్యమైనంతగా నిలుపుతుంది; ‘నిరీక్షణలో’ అనే భావం కూడా సాధ్యమే కాబట్టి దాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: ζωῆς αἰωνίου
  choice: నిత్యజీవం గురించిన
  rationale: నిరీక్షణ యొక్క విషయాన్ని సూచించే షష్ఠీవిభక్తి సంబంధాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: δικαιωθέντες యొక్క రక్షణసంబంధ భావం
  choice: నీతిమంతులుగా తీర్చబడి
  alternative: నీతిమంతులని ప్రకటించబడి
  rationale: మొదటి రూపం మూలపదంతో ఉన్న సంప్రదాయ ధార్మిక అనుసంధానాన్ని నిలుపుతుంది; ప్రత్యామ్నాయం న్యాయస్థాన ప్రకటన భావాన్ని మరింత స్పష్టంగా చేస్తుంది గాని మూలంలోని భావపరిధిని కుదించే అవకాశం ఉంది.
- issue: ἐκείνου సూచించే వ్యక్తి
  choice: ఆయన
  alternative: దేవుడు / యేసు క్రీస్తు అని స్పష్టీకరించడం
  rationale: గ్రీకు సర్వనామం ఇక్కడ పేరును మళ్లీ చెప్పదు. ‘ఆయన’ అని ఉంచడం ద్వారా తక్షణ సందర్భంలోని సూచనను నిలుపుతూ, అనవసరంగా ఒకే గుర్తింపును బలవంతం చేయదు.
- issue: ἵνα ... γενηθῶμεν లో ఉద్దేశం మరియు ఫలితం
  choice: తద్వారా ... కావాలి
  alternative: '... కావడానికి'
  rationale: ఈ నిర్మాణం ఉద్దేశం లేదా ఆశించిన ఫలితం రెండింటినీ అనుమతిస్తుంది. స్వతంత్ర వచనంగా చదవడానికి ‘తద్వారా’ సహజమైనప్పటికీ, ‘కావాలి’ని ఆజ్ఞార్థంగా కాక ఉద్దేశార్థంగా గ్రహించాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘కృప’, ‘నీతిమంతులు’, ‘వారసులు’, ‘నిత్యజీవం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉంచి, క్లిష్టమైన గ్రీకు సంబంధాన్ని పాదసూచికతో వివరించాం.
