id: TIT.3.12
reference: Titus 3:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὅταν πέμψω Ἀρτεμᾶν πρὸς σὲ ἢ Τυχικόν, σπούδασον ἐλθεῖν πρός με εἰς Νικόπολιν, ἐκεῖ γὰρ κέκρικα παραχειμάσαι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/012.yaml
  text: When I send Artemas or Tychicus to you[a], make every effort to come to me at Nicopolis[b], for I have decided to spend the winter there.
translation:
  language: te
  text: నేను అర్తెమాను గాని తుకికును గాని నీ దగ్గరికి పంపినప్పుడు, నికొపొలిలో నా దగ్గరికి రావడానికి శాయశక్తులా ప్రయత్నించు[a]. ఎందుకంటే అక్కడ చలికాలం గడపాలని నేను నిర్ణయించుకున్నాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా దగ్గరికి రావడంలో శ్రద్ధ చూపు”; లేదా, “నా దగ్గరికి రావడానికి నీ వంతు కృషి చేయి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అక్కడ చలికాలం గడపాలని నేను నిశ్చయించుకున్నాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν πέμψω
  choice: నేను … పంపినప్పుడు
  rationale: ὅταν తో కూడిన aorist subjunctive ఒక నిరీక్షిత భవిష్యత్ సందర్భాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘పంపినప్పుడు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: Ἀρτεμᾶν … ἢ Τυχικόν
  choice: అర్తెమాను గాని తుకికును గాని
  rationale: వ్యక్తుల పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, ἢ సూచించే ప్రత్యామ్నాయాన్ని ‘గాని … గాని’తో తెలిపింది.
- source_word: σπούδασον
  choice: శాయశక్తులా ప్రయత్నించు
  rationale: ఈ ఆజ్ఞలోని శ్రద్ధ, ఉత్సాహం, కార్యసిద్ధికి చేసే గట్టి ప్రయత్నం అన్న భావాలను అందిస్తుంది; కేవలం వేగాన్ని మాత్రమే సూచించే ‘త్వరపడు’ కంటే విస్తృతమైనది.
- source_word: ἐλθεῖν πρός με εἰς Νικόπολιν
  choice: నికొపొలిలో నా దగ్గరికి రావడానికి
  rationale: కదలిక పౌలు వైపుకు ఉన్నందున ‘రావడానికి’ వాడింది; గమ్యస్థానాన్ని సహజమైన తెలుగులో ‘నికొపొలిలో నా దగ్గరికి’గా వ్యక్తం చేసింది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి ఆదేశానికి కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: κέκρικα παραχειμάσαι
  choice: చలికాలం గడపాలని నేను నిర్ణయించుకున్నాను
  rationale: κέκρικα లోని స్థిరపడిన, ప్రస్తుతం వర్తించే నిర్ణయ భావాన్ని ‘నిర్ణయించుకున్నాను’ తెలియజేస్తుంది; παραχειμάσαι అంటే ఒక చోట చలికాలం గడపడం.
