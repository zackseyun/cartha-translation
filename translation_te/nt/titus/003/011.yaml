translation:
  language: te
  text: అలాంటి వాడు[a] దారి తప్పిన స్థితిలో ఉన్నాడనీ[b], పాపం చేస్తూ ఉన్నాడనీ, తనను తానే దోషిగా తీర్చుకున్నవాడనీ[c] తెలుసుకో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో ‘అలాంటి వాడు’ అనే పుంలింగ ఏకవచన ప్రయోగం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘వక్రమైపోయాడు,’ ‘పెడదారి పట్టాడు’ అని కూడా అనువదించవచ్చు. గ్రీకు పూర్ణకాల క్రియ, గతంలో జరిగిన దారి తప్పుదల వల్ల ఏర్పడి కొనసాగుతున్న స్థితిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘తన క్రియలవల్ల తానే దోషిగా నిలిచినవాడు’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: తెలుసుకో
  rationale: ఈ కృదంతం ముందటి వచనంలోని ఆదేశంతో అనుసంధానమై ఉంది. స్వతంత్ర వచనంగా తెలుగులో సహజంగా ఉండేందుకు సంబోధితునికి ఉద్దేశించిన ‘తెలుసుకో’ అని అనువదించాం; కారణార్థమా మరేదైనా అనేది విస్తరించి చెప్పలేదు.
- source_word: ἐξέστραπται
  choice: దారి తప్పిన స్థితిలో ఉన్నాడు
  rationale: పూర్ణకాల రూపం గతంలో జరిగిన మళ్లింపు వల్ల కొనసాగుతున్న స్థితిని సూచిస్తుంది. ఈ అనువాదం ‘దారి తప్పాడు’ అనే సంఘటనకన్నా ఆ ప్రస్తుత స్థితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὁ τοιοῦτος
  choice: అలాంటి వ్యక్తి
  rationale: ఇది ముందటి వచనంలోని విభేదాలు కలిగించే వ్యక్తిని సూచించే పుంలింగ ఏకవచన ప్రయోగం. ఆధునిక తెలుగులో ‘అలాంటి వ్యక్తి’ సహజంగా ఉండి, సూచిత వ్యక్తిని నిర్దిష్టంగా తెలియజేస్తుంది.
- source_word: ἁμαρτάνει
  choice: పాపం చేస్తూ ఉన్నాడు
  rationale: వర్తమానకాల రూపంలోని కొనసాగుతున్న క్రియ భావాన్ని అనవసరమైన వ్యాఖ్యానం లేకుండా వ్యక్తం చేస్తుంది.
- source_word: ὢν
  choice: పొందినవాడు
  rationale: చివరి విశేషణాన్ని ఆ వ్యక్తి స్థితిగా ప్రధాన వాక్యంతో అనుసంధానించేలా తెలుగులో సహజంగా కలిపాం.
- source_word: αὐτοκατάκριτος
  choice: తనకు తానే దోషిగా తీర్పు పొందినవాడు
  rationale: ఆ వ్యక్తి తన క్రియల ద్వారా తనమీదకే దోషనిర్ణయం తెచ్చుకున్నాడనే ప్రతికర్తృక భావాన్ని కాపాడుతుంది; అంతిమ తీర్పు గురించిన అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
theological_decisions:
- issue: ὁ τοιοῦτος లోని పుంలింగ సూచన
  choice: అలాంటి వ్యక్తి
  alternative: అలాంటి వాడు / అలాంటి మనిషి
  rationale: గ్రీకు రూపం పుంలింగ ఏకవచనమైనప్పటికీ, తెలుగులో ‘వ్యక్తి’ సందర్భంలోని నిర్దిష్ట వ్యక్తిని సహజంగా సూచిస్తుంది. అతని గురించిన తరువాతి పుంలింగ క్రియారూపాలు ఆ సూచనను నిలుపుతాయి.
- issue: αὐτοκατάκριτος యొక్క భావం
  choice: తనకు తానే దోషిగా తీర్పు పొందినవాడు
  alternative: తనను తానే దోషిగా తీర్చుకున్నవాడు / స్వదోషనిర్ణీతుడు
  rationale: వ్యక్తి పరిస్థితి, ప్రవర్తన అతనినే దోషిగా నిలబెడతాయనే బలాన్ని కాపాడుతూ, అతడు తనపై అధికారికంగా తీర్పు ప్రకటించాడని లేదా ఇది తప్పనిసరిగా అంతిమ తీర్పని అధికంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా, దాని కొనసాగుతున్న క్రియ మరియు ఫలితస్థితి భావాలను సహజమైన తెలుగులో నిలిపాం.
