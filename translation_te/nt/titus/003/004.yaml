lexical_decisions:
- source_word: ὅτε δὲ
  choice: అయితే ... అయినప్పుడు
  rationale: ὅτε కాలసంబంధ ఉపవాక్యాన్ని సూచిస్తుంది; δέ ముందటి మానవ పాపస్థితికి దేవుని రక్షణకార్యానికి మధ్య సున్నితమైన వ్యత్యాసాన్ని చూపుతుంది.
- source_word: χρηστότης
  choice: దయ
  rationale: సంబంధపూర్వకమైన మంచితనం, దయాగుణం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; తరువాతి ‘ప్రేమ’తో పూర్తిగా కలిసిపోదు.
- source_word: φιλανθρωπία
  choice: మానవులపట్ల ప్రేమ
  rationale: మనుషులపట్ల ఉండే ప్రేమ, హితభావం అనే గ్రీకు పదార్థాన్ని స్పష్టంగా నిలుపుతుంది; లింగపరంగా పరిమితంగా వినిపించే పదజాలాన్ని నివారిస్తుంది.
- source_word: ἐπεφάνη
  choice: ప్రత్యక్షమైనప్పుడు
  rationale: కనిపించడం లేదా వెల్లడికావడం అనే ప్రత్యక్షత భావాన్ని అతివ్యాఖ్యానం లేకుండా వ్యక్తం చేస్తుంది.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: మన రక్షకుడైన దేవుని
  rationale: ‘దేవుడు’ మరియు ‘మన రక్షకుడు’ మధ్యనున్న బిరుదు/విశేషణ సంబంధాన్ని సహజమైన తెలుగు క్రమంలో నిలుపుతుంది.
theological_decisions:
- issue: ‘మన రక్షకుడైన దేవుడు’ అనే పదబంధపు సూచన
  choice: ఈ వచనంలో పదబంధాన్ని దేవునికి వర్తించే రక్షక బిరుదుగానే అనువదించి, వ్యక్తి ఎవరనే విషయాన్ని అనువాదంలో అదనంగా వివరించలేదు.
  alternative: సందర్భం ఆధారంగా దీనిని ప్రత్యేకంగా తండ్రియైన దేవునిగా విప్పి అనువదించడం.
  rationale: మూల వాక్యం ‘దేవుడు మన రక్షకుడు’ అనే బిరుదును స్పష్టంగా ఇస్తుంది; 6వ వచనం యేసు క్రీస్తును వేరుగా ప్రస్తావించినప్పటికీ, ఆ సందర్భానుమానాన్ని 4వ వచనపు పాఠ్యంలో చేర్చకుండా మూలంలోని సంక్షిప్తతను, theological tensionను కాపాడటం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే గంభీరతను నిలుపుకునేలా రూపొందించబడింది. ప్రధాన పాఠ్యంలో [a] సూచిక చేర్చబడింది.
