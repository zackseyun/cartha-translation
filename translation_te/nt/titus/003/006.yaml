lexical_decisions:
- source_word: οὗ
  choice: ఆయనను
  rationale: ఈ సంబంధ సర్వనామం మునుపటి వచనంలోని పరిశుద్ధాత్మను సూచిస్తుంది. గ్రీకులో రూపం వ్యాకరణపరంగా నపుంసక/పుంలింగ సాధ్యతను కలిగి ఉన్నా, తెలుగులో వ్యక్తిని సూచించే ‘ఆయనను’ సహజంగా ఉంటుంది; తక్కువ వ్యక్తిగతమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐξέχεεν
  choice: కుమ్మరించాడు
  rationale: ἐκχέω యొక్క ప్రాథమిక భావమైన ‘పోయడం/కుమ్మరించడం’ను నిలుపుతూ, పరిశుద్ధాత్మను కుమ్మరించడం అనే బైబిలు ప్రయోగానికి సరిపోతుంది.
- source_word: ἐφ’ ἡμᾶς
  choice: మన మీద
  rationale: ἐπί + accusative ఇక్కడ దిశను, పైకి/మీదికి చేరడాన్ని సూచిస్తుంది; ‘మన మీద’ ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: πλουσίως
  choice: సమృద్ధిగా
  rationale: పరిమాణ సమృద్ధి, విస్తారత అనే క్రియావిశేషణ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: διὰ
  choice: ద్వారా
  rationale: Genitiveతో వచ్చిన διά సాధనం లేదా మధ్యవర్తిత్వాన్ని సూచిస్తుంది; ‘ద్వారా’ సంక్షిప్తమైన సహజ అనువాదం.
- source_word: Ἰησοῦ Χριστοῦ
  choice: మెస్సీయ యేసు
  rationale: Χριστόςను స్థిర నామభాగంగా కాక ‘మెస్సీయ’ అనే బిరుదుగా వ్యక్తపరుస్తుంది. తెలుగులో ‘మెస్సీయ యేసు’ బిరుదు-పేరు నిర్మాణంగా గౌరవప్రదంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: τοῦ σωτῆρος ἡμῶν
  choice: మన రక్షకుడైన
  rationale: σωτήρ అనే బిరుదును, ἡμῶν యొక్క స్వామ్య భావాన్ని తెలుగులో సహజమైన విశేషణ నిర్మాణంగా తెలియజేస్తుంది; ఇది మెస్సీయ యేసును విశేషిస్తుంది.
theological_decisions:
- issue: οὗ అనే సంబంధ సర్వనామం దేనిని సూచిస్తుంది?
  choice: మునుపటి వచనంలో పేర్కొన్న పరిశుద్ధాత్మను వ్యక్తిగతంగా సూచిస్తూ ‘ఆయనను’ అని అనువదించడం.
  alternative: వ్యాకరణ లింగాన్ని లేదా మరింత అమూర్త భావాన్ని ముందుకు తెచ్చి ‘దానిని’ అని అనువదించడం.
  rationale: అతి సమీప పూర్వపదం ‘పరిశుద్ధాత్మ’; ఈ వాక్యంలో దేవుడు పరిశుద్ధాత్మను విశ్వాసుల మీద కుమ్మరించాడనే భావం ఉంది. అయితే గ్రీకు రూపం వల్ల కనిపించే తక్కువ వ్యక్తిగత అనువాద సాధ్యతను పాదసూచికలో నిలిపాం.
- issue: Χριστοῦను ఎలా అనువదించాలి?
  choice: బిరుదు భావాన్ని స్పష్టపరుస్తూ ‘మెస్సీయ’.
  alternative: సాంప్రదాయ రూపమైన ‘క్రీస్తు’.
  rationale: ఈ సందర్భంలో Χριστός ‘మన రక్షకుడు’ అనే మరో బిరుదుతో కలిసి యేసును గుర్తిస్తుంది; అందువల్ల దాని బిరుదు భావాన్ని అనువదించడం సముచితం. పరిచితమైన సాంప్రదాయ రూపాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని వాక్యక్రమాన్ని పూర్తిగా యాంత్రికంగా అనుసరించకుండా, ‘మన రక్షకుడైన’ అనే పదబంధం ఎవరిని విశేషిస్తుందో స్పష్టంగా ఉండేలా అమర్చాం. మునుపటి వచనంపై ఆధారపడే సంబంధ సర్వనామ నిర్మాణాన్ని అలాగే నిలిపాం.
