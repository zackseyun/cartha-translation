id: TIT.3.9
reference: Titus 3:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μωρὰς δὲ ζητήσεις καὶ γενεαλογίας καὶ ⸀ἔρεις καὶ μάχας νομικὰς περιΐστασο, εἰσὶν γὰρ ἀνωφελεῖς καὶ μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/009.yaml
  text: But avoid foolish controversies and genealogies and strife and quarrels about the law[b][a], for they are unprofitable and futile.
translation:
  language: te
  text: అయితే అవివేకమైన వాదవివాదాలను[a], వంశావళులను, కలహాలను, ధర్మశాస్త్రం గురించిన పోట్లాటలను[b] తప్పించుకో; ఎందుకంటే అవి ప్రయోజనం లేనివి, వ్యర్థమైనవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వివాదాస్పద విచారణలను’ లేదా ‘ఊహాగానాలను’.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘ధర్మశాస్త్ర సంబంధమైన పోట్లాటలను’; అంటే ధర్మశాస్త్రం గురించిన పోట్లాటలను.
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς ζητήσεις
  choice: బుద్ధిహీనమైన వాదవివాదాలు
  rationale: ζητήσεις ఇక్కడ తటస్థమైన ప్రశ్నలను కాక వివాదాస్పద విచారణలను సూచిస్తుంది; μωράς వాటి అవివేకమైన, ప్రయోజనరహిత స్వభావాన్ని తెలియజేస్తుంది.
- source_word: γενεαλογίας
  choice: వంశావళులు
  rationale: నిర్దిష్టమైన యూద లేదా జ్ఞానవాద నేపథ్యాన్ని ఊహించకుండా గ్రీకు పదంలోని సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: ἔρεις
  choice: కలహాలు
  rationale: వర్గాల మధ్య విరోధం, కలహం అనే భావాన్ని ఇస్తూ తరువాతి μάχας అనే పదం నుండి సాధ్యమైనంతగా భేదాన్ని నిలుపుతుంది.
- source_word: μάχας νομικὰς
  choice: ధర్మశాస్త్రం గురించిన పోట్లాటలు
  rationale: ఇది న్యాయస్థాన వివాదాలను కాక ధర్మశాస్త్రానికి సంబంధించిన మాటల పోట్లాటలను సూచిస్తుందని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: περιΐστασο
  choice: తప్పించుకో
  rationale: ఇలాంటి వాటికి దూరంగా ఉండమనే మధ్యమ పురుష ఏకవచన ఆజ్ఞార్థక భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνωφελεῖς
  choice: ప్రయోజనం లేనివి
  rationale: ఎలాంటి మేలు లేదా ఉపయోగం కలిగించనివి అనే అర్థాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఇస్తుంది.
- source_word: μάταιοι
  choice: వ్యర్థమైనవి
  rationale: ఖాళీగా, ఫలితం లేకుండా ఉండే స్వభావాన్ని తెలియజేస్తూ ἀνωφελεῖς తో ఉన్న భావసామీప్యాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘వంశావళులు’, ‘ధర్మశాస్త్రం గురించిన పోట్లాటలు’ అనే పదాల చారిత్రక స్వరూపం
  choice: ప్రధాన పాఠ్యంలో ఈ పదాలను సాధారణంగానే అనువదించడం
  alternative: వాటిని ప్రత్యేకంగా యూద వంశచర్చలుగా లేదా ఆది జ్ఞానవాద ఊహాగానాలుగా వివరించడం
  rationale: వచనం వాటి నిర్దిష్ట వ్యవస్థను గుర్తించడానికి తగిన వివరాలు ఇవ్వదు. సాధారణ పదాలను నిలపడం మూలంలోని అనిశ్చితిని కాపాడి, ఒక ప్రత్యేక చారిత్రక లేదా సిద్ధాంతపరమైన వివరణను పాఠ్యంలోకి దిగుమతి చేయకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ధర్మశాస్త్రం’ బైబిలు సందర్భంలోని νόμος భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘పోట్లాటలు’ ఇక్కడ శారీరక యుద్ధం కాక మాటల ఘర్షణ అని సందర్భం ద్వారా సహజంగా అర్థమవుతుంది.
