id: TIT.3.3
reference: Titus 3:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἦμεν γάρ ποτε καὶ ἡμεῖς ἀνόητοι, ἀπειθεῖς, πλανώμενοι, δουλεύοντες ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις, ἐν κακίᾳ καὶ φθόνῳ διάγοντες, στυγητοί, μισοῦντες ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/003.yaml
  text: For we ourselves also were once foolish[a], disobedient, being led astray, enslaved to various desires and pleasures, spending our lives in malice and envy, hateful[b], hating one another.
translation:
  language: te
  text: ఎందుకంటే, ఒకప్పుడు మనం కూడా అవివేకులుగా, అవిధేయులుగా, దారితప్పించబడుతూ[a], వివిధమైన కోరికలకూ సుఖభోగాలకూ బానిసలై, దుష్టత్వంలోనూ అసూయలోనూ జీవిస్తూ, అసహ్యకరమైనవారిగా[b], ఒకరినొకరు ద్వేషిస్తూ ఉండేవారం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మోసపోతూ.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ద్వేషించబడినవారిగా.’ గ్రీకు విశేషణాన్ని ‘అసహ్యకరమైనవారు’ అనే భావంలోనూ, ‘ద్వేషించబడినవారు’ అనే భావంలోనూ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦμεν γάρ ποτε καὶ ἡμεῖς
  choice: ఎందుకంటే, ఒకప్పుడు మనం కూడా ... ఉండేవారం
  rationale: γάρ మునుపటి వాక్యంతో కారణ సంబంధాన్ని చూపుతుంది; καὶ ἡμεῖς సమ్మిళిత ఉద్ఘాటనను, ποτε గతకాల స్థితిని తెలియజేస్తాయి. తెలుగులో సహజమైన వాక్యనిర్మాణం కోసం ప్రధాన క్రియను చివర ఉంచాం.
- source_word: ἀνόητοι
  choice: అవివేకులుగా
  rationale: అర్థగ్రహణం, నైతిక వివేచన లోపం అనే భావాలను సహజంగా వ్యక్తం చేస్తుంది; కేవలం మేధాశక్తి లోపంగా పరిమితం చేయదు.
- source_word: ἀπειθεῖς
  choice: అవిధేయులుగా
  rationale: వినడానికి లేదా ఒప్పుకోవడానికి నిరాకరించి లోబడకపోవడం అనే సందర్భోచిత భావాన్ని ఇస్తుంది.
- source_word: πλανώμενοι
  choice: దారితప్పించబడుతూ
  rationale: ఈ వర్తమాన కృదంతంలోని కర్మణి భావాన్ని కాపాడుతూ, కేవలం బౌద్ధిక మోసానికి అర్థాన్ని పరిమితం చేయకుండా తప్పుదారిలో నడిపించబడడాన్ని సూచిస్తుంది.
- source_word: δουλεύοντες
  choice: బానిసలై
  rationale: ఇక్కడ కోరికలు, సుఖభోగాల ఆధీనంలో ఉన్న బంధిత స్థితి ప్రధానమైనది; సాధారణంగా ‘సేవిస్తూ’ అనడం కంటే గ్రీకు పదంలోని బానిసత్వ బలాన్ని ఇది నిలుపుతుంది.
- source_word: ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις
  choice: రకరకాల కోరికలకూ సుఖభోగాలకూ
  rationale: ἐπιθυμίαις అన్నది లైంగిక వాంఛలకు మాత్రమే పరిమితం కానందున ‘కోరికలు’ అని ఇచ్చాం. ἡδοναῖς సందర్భంలో ఇంద్రియానందాలను సూచించేందుకు ‘సుఖభోగాలు’ సహజంగా ఉంది; ποικίλαις రెండింటికీ భావపరంగా వర్తించేలా ‘రకరకాల’ అని ఇచ్చాం.
- source_word: ἐν κακίᾳ καὶ φθόνῳ διάγοντες
  choice: దుర్బుద్ధితోనూ అసూయతోనూ జీవిస్తూ
  rationale: διάγοντες జీవితం గడపడాన్ని సూచిస్తుంది. పరస్పర సంబంధ దోషాల జాబితాలో κακίαను సాధారణ ‘చెడు’గా కాక, ఇతరులకు కీడు కోరే ‘దుర్బుద్ధి’గా వ్యక్తం చేశాం; φθόνοςకు ‘అసూయ’ సరిపోతుంది.
- source_word: στυγητοί
  choice: అసహ్యులుగా
  rationale: ఈ విశేషణం ‘అసహ్యకరమైనవారు’ అనే క్రియాశీల/గుణవాచక భావాన్నీ, ‘ద్వేషించబడినవారు’ అనే కర్మణి భావాన్నీ అనుమతిస్తుంది. ప్రధాన పాఠంలో దోషాల జాబితికి సరిపోయే మొదటి భావాన్ని ఎంచుకుని, రెండవదాన్ని పాదసూచికలో ఉంచాం.
- source_word: μισοῦντες ἀλλήλους
  choice: ఒకరినొకరు ద్వేషిస్తూ
  rationale: కృదంతాన్నీ పరస్పర సర్వనామాన్నీ నేరుగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: వ్యక్తులు కాని ‘కోరికలు, సుఖభోగాలు’ యజమానులుగా ఉన్నప్పుడు δουλεύοντεςలోని బంధిత భావం
  choice: రకరకాల కోరికలకూ సుఖభోగాలకూ బానిసలై
  alternative: రకరకాల కోరికలనూ సుఖభోగాలనూ సేవిస్తూ
  rationale: వాక్యం పూర్వ జీవితం నైతిక బంధంలో ఉన్నదిగా చిత్రిస్తుంది. ‘బానిసలై’ అనేది ఆ బలమైన రూపకాన్ని నిలుపుతుంది; అయితే పాఠం చెప్పిన దానిని మించి ఏ ప్రత్యేక సిద్ధాంత వ్యవస్థనూ చేర్చదు.
- issue: στυγητοίలో క్రియాశీల లేదా కర్మణి భావం
  choice: అసహ్యులుగా
  alternative: ద్వేషించబడేవారిగా
  rationale: గ్రీకు విశేషణానికి రెండు అర్థాలూ సాధ్యమే. దోషలక్షణాల వరుసలో ‘అసహ్యులుగా’ సహజంగా సరిపోతుంది; వెంటనే వచ్చే ‘ఒకరినొకరు ద్వేషిస్తూ’తో కూడా భావసంబంధం ఏర్పడుతుంది. అయినా కర్మణి అర్థాన్ని పాదసూచికలో స్పష్టంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన గ్రంథశైలిని నిలుపుతూ అనువదించాం. గ్రీకు వాక్యంలోని దోషాల వరుసను తెలుగులో ఒకే సమన్విత వాక్యంగా ఉంచాం. ‘బానిసలై’ మూలంలోని బలమైన బంధిత రూపకాన్ని, ‘దారితప్పించబడుతూ’ కర్మణి సంభావ్యతను కాపాడుతాయి.
