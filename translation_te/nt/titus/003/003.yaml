  to: ఎందుకంటే, ఒకప్పుడు మనం కూడా అవివేకులుగా, అవిధేయులుగా, దారితప్పించబడుతూ[a], వివిధమైన కోరికలకూ సుఖభోగాలకూ బానిసలై, దుష్టత్వంలోనూ అసూయలోనూ జీవిస్తూ, అసహ్యకరమైనవారిగా[b], ఒకరినొకరు ద్వేషిస్తూ ఉండేవారం.
