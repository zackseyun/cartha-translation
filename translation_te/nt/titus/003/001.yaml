id: TIT.3.1
reference: Titus 3:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὑπομίμνῃσκε αὐτοὺς ⸀ἀρχαῖς ἐξουσίαις ὑποτάσσεσθαι πειθαρχεῖν, πρὸς πᾶν ἔργον ἀγαθὸν ἑτοίμους εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/001.yaml
  text: Remind them to be subject to rulers and authorities[a], to be obedient, to be ready for every good work,
translation:
  language: te
  text: 'వారికి గుర్తుచేస్తూ ఉండు: పాలకులకు, అధికారులకు లోబడాలని, విధేయులుగా ఉండాలని, ప్రతి మంచి పనికి సిద్ధంగా ఉండాలని.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπομίμνῃσκε
  choice: గుర్తుచేస్తూ ఉండు
  rationale: వర్తమానకాల ఆజ్ఞారూపంలోని కొనసాగింపు లేదా పునరావృత భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: αὐτοὺς
  choice: వారికి
  rationale: తీతు ద్వారా ఉపదేశం పొందుతున్న క్రేతు విశ్వాసులను సూచించే బహువచన సర్వనామానికి సందర్భానుగుణమైన రూపం.
- source_word: ἀρχαῖς
  choice: పాలకులకు
  rationale: ఈ పౌర సందర్భంలో పరిపాలించే వ్యక్తులు లేదా పాలనా నాయకత్వాన్ని సూచిస్తుంది; విశ్వ సంబంధమైన శక్తులను కాదు.
- source_word: ἐξουσίαις
  choice: అధికారులకు
  rationale: ἀρχαῖςతో జతగా వచ్చి అధికార స్థానాల్లో ఉన్నవారిని సూచిస్తుంది; మూలంలోని ద్వంద్వ వ్యక్తీకరణను నిలుపుతుంది.
- source_word: ὑποτάσσεσθαι
  choice: లోబడి
  rationale: క్రమబద్ధమైన అధీనతను సహజంగా తెలియజేస్తుంది; బానిసత్వం లేదా హద్దులేని విధేయతను స్వయంగా సూచించదు.
- source_word: πειθαρχεῖν
  choice: విధేయులుగా ఉండాలని
  rationale: అధికారంలో ఉన్నవారి మాటకు లోబడే భావాన్ని తెలియజేస్తుంది. ముందున్న ‘లోబడి’తో కలిపి తెలుగు వాక్యంలో సహజంగా ప్రవహిస్తుంది.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: ప్రతి మంచి పని చేయడానికి
  rationale: మంచి కార్యం వైపు సిద్ధత లేదా దానిని చేయడానికి సంసిద్ధత అనే πρός భావాన్ని స్పష్టమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἑτοίμους εἶναι
  choice: సిద్ధంగా ఉండాలని
  rationale: సంసిద్ధ స్థితిలో ఉండాలనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పౌర పాలనా వ్యవస్థలకు లోబడడం యొక్క పరిధి
  choice: పాలకులకు, అధికారులకు లోబడి విధేయులుగా ఉండాలనే సాధారణ ఉపదేశంగా అనువదించబడింది.
  alternative: ప్రతి పరిస్థితిలోనూ పాలకులకు హద్దుల్లేకుండా విధేయత చూపాలని అర్థం వచ్చే బలమైన అనువాదం.
  rationale: మూలపాఠం పౌర పాలకులు, అధికారుల పట్ల లోబడడాన్ని స్పష్టంగా బోధిస్తుంది; అయితే ఆ విధేయత సంపూర్ణమైనదని లేదా మినహాయింపులేనిదని అదనంగా చెప్పదు. అందువల్ల మూలంలోని ధార్మిక ఉద్వేగాన్ని అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గౌరవప్రదమైన బైబిలు శైలిలో రూపొందించబడింది. గ్రీకు వర్తమాన ఆజ్ఞారూపంలోని కొనసాగింపు భావాన్ని ‘గుర్తుచేస్తూ ఉండు’ ద్వారా స్పష్టపరిచాం. పాలకులు–అధికారులు అనే రెండు పదాల భేదాన్ని నిలిపాం.
