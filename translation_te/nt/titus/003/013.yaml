revisions:
- from: న్యాయశాస్త్ర నిపుణుడైన జేనాను, అపొల్లోను శ్రద్ధగా ప్రయాణానికి సాగనంపు[a]. వారికి ఏదీ కొరత లేకుండా చూడు.
  to: న్యాయశాస్త్ర నిపుణుడైన జేనాస్‌ను, అపొల్లోను శ్రద్ధగా ప్రయాణానికి సాగనంపు[a]. వారికి ఏదీ కొరత లేకుండా ఉండేలా చూడు.
  rationale: జేనా స్థానంలో జేనాస్‌ను వాడి వ్యక్తిపేరు యొక్క మూలరూపాన్ని సరిచేశాం. చివరి వాక్యంలో “ఉండేలా” చేర్చి గ్రీకు ఉద్దేశ్యార్థక ఉపవాక్యాన్ని స్పష్టంగా నిలిపాం. మిగిలిన పదప్రయోగాలు మూలపాఠానికి నమ్మకంగా, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉన్నాయి.
