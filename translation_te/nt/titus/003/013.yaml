id: TIT.3.13
reference: Titus 3:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ζηνᾶν τὸν νομικὸν καὶ ⸀Ἀπολλῶν σπουδαίως πρόπεμψον, ἵνα μηδὲν αὐτοῖς λείπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/013.yaml
  text: Diligently send Zenas the lawyer and Apollos on their way[a], so that they may lack nothing.
translation:
  language: te
  text: న్యాయశాస్త్ర నిపుణుడైన జేనాస్‌ను, అపొల్లోను శ్రద్ధగా ప్రయాణానికి సాగనంపు[a]. వారికి ఏదీ కొరత లేకుండా ఉండేలా చూడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జేనాస్‌కు, అపొల్లోకు వారి ప్రయాణంలో శ్రద్ధగా సహాయం చేయి.” ఇక్కడి క్రియ కేవలం వీడ్కోలు చెప్పి పంపడమే కాక, ప్రయాణానికి అవసరమైన ఏర్పాట్లు, సహాయం చేయడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηνᾶν
  choice: జేనా
  rationale: గ్రీకు వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: τὸν νομικὸν
  choice: న్యాయశాస్త్ర నిపుణుడు
  rationale: νομικός అనే పదం న్యాయంలో ప్రావీణ్యం కలవాడిని సూచించగలదు. సందర్భంలో ఇది జేనాకు వృత్తి లేదా నైపుణ్య సూచనగా ఉంది; ‘ధర్మశాస్త్ర ఉపదేశకుడు’ వంటి ప్రత్యేక మతపరమైన అర్థాన్ని అనవసరంగా రుద్దదు.
- source_word: Ἀπολλῶν
  choice: అపొల్లో
  rationale: గ్రీకు వ్యక్తి పేరును తెలుగులో సహజంగా లిప్యంతరీకరించాం.
- source_word: σπουδαίως
  choice: శ్రద్ధగా
  rationale: ఈ క్రియావిశేషణం ఆతురతకన్నా గంభీరమైన శ్రద్ధను, జాగ్రత్తను సూచిస్తుంది; ప్రయాణ సహాయం విషయంలో తెలుగు వాక్యంలో ‘శ్రద్ధగా’ సహజంగా ఉంది.
- source_word: πρόπεμψον
  choice: ప్రయాణానికి సాగనంపు
  rationale: προπέμπω కేవలం పంపివేయడం మాత్రమే కాక, ప్రయాణానికి అవసరమైన సహాయం చేసి ముందుకు పంపడాన్ని సూచించగలదు. ‘ప్రయాణానికి సాగనంపు’ ఆ సందర్భార్థాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἵνα μηδὲν αὐτοῖς λείπῃ
  choice: వారికి ఏదీ కొరత లేకుండా చూడు
  rationale: గ్రీకు ఉద్దేశ్య వాక్యాన్ని సహజమైన తెలుగు ఆజ్ఞారూప నిర్మాణంతో వ్యక్తపరుస్తూ, అవసరమైన దేనిలోనూ లోటు ఉండకూడదనే విస్తృత అర్థాన్ని కాపాడుతుంది.
theological_decisions:
- issue: νομικός పదం లౌకిక న్యాయవేత్తనా, మోషే ధర్మశాస్త్ర నిపుణుడా అన్న అనిశ్చితి
  choice: న్యాయశాస్త్ర నిపుణుడు
  alternative: ధర్మశాస్త్ర నిపుణుడు; న్యాయవాది
  rationale: సందర్భం అతని నైపుణ్య స్వరూపాన్ని స్పష్టంగా నిర్ణయించదు. ‘న్యాయశాస్త్ర నిపుణుడు’ విస్తృతంగా ఉండి, ఆధునిక కోర్టు న్యాయవాది అని గానీ యూద ధర్మశాస్త్ర బోధకుడని గానీ ఏకపక్షంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడాం. ‘సాగనంపు’కు ప్రయాణ సహాయ భావం ఉన్నప్పటికీ, ఆ భావ విస్తృతిని పాదసూచికలో స్పష్టం చేశాం.
