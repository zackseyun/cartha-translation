id: TIT.3.5
reference: Titus 3:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ ⸀ἃ ἐποιήσαμεν ἡμεῖς ἀλλὰ κατὰ ⸂τὸ αὐτοῦ ἔλεος⸃ ἔσωσεν ἡμᾶς διὰ λουτροῦ παλιγγενεσίας καὶ ἀνακαινώσεως πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/005.yaml
  text: not from works done in righteousness, which we ourselves did, but according to his mercy he saved us, through the washing of regeneration and renewal by the Holy Spirit,
translation:
  language: te
  text: మనం స్వయంగా నీతిగా చేసిన క్రియలవల్ల కాదు[a], తన కనికరాన్ని బట్టే ఆయన మనలను రక్షించాడు—పునర్జన్మకు సంబంధించిన కడుగుదల[b] మరియు పరిశుద్ధాత్మ కలిగించే నూతనీకరణ[c] ద్వారా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీతిగా చేసిన’కు బదులుగా ‘న్యాయంగా చేసిన’ అని కూడా అనువదించవచ్చు. గ్రీకు పదానికి ‘నీతి,’ ‘న్యాయం’ అనే రెండు భావాలూ ఉండగలవు; పౌలు వాడుకను దృష్టిలో ఉంచుకొని ప్రధాన పాఠంలో ‘నీతి’ ఉంచాం.
    reason: alternative_reading
  - marker: b
    text: ‘కడుగుదల’ బాప్తిస్మాన్ని, శుద్ధీకరణను సూచించే రూపకాన్ని, లేదా రెండింటినీ సూచించవచ్చు. గ్రీకు పదమే ఈ అర్థాల్లో ఒక్కదాన్ని తప్పనిసరిగా ఎంచుకోమని నిర్దేశించదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘పరిశుద్ధాత్మ యొక్క నూతనీకరణ.’ గ్రీకు వాక్యనిర్మాణం ‘పరిశుద్ధాత్మ’కు ‘నూతనీకరణ’తో ఉన్న సంబంధాన్ని కొద్దిగా భిన్నంగా వ్యక్తం చేయడానికి వీలు కల్పిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ
  choice: నీతి సంబంధమైన క్రియల మూలంగా కాదు
  rationale: ἐκ సూచించే మూలం లేదా ఆధారాన్ని ‘మూలంగా’ తెలియజేస్తుంది. δικαιοσύνηకి పౌలు వాడుకకు తగిన సాధారణ పదం ‘నీతి’; ఇక్కడ క్రియలు నీతి స్వభావం గలవని భావం.
- source_word: ἃ ἐποιήσαμεν ἡμεῖς
  choice: మనం స్వయంగా చేసిన
  rationale: గ్రీకులోని స్పష్టమైన ἡμεῖς నొక్కిచెప్పే భావాన్ని ‘స్వయంగా’ నిలుపుతుంది.
- source_word: κατὰ τὸ αὐτοῦ ἔλεος
  choice: తన కనికరాన్ని బట్టే
  rationale: κατά ఇక్కడ ప్రమాణం లేదా ఆధారాన్ని సూచిస్తుంది. ‘బట్టే’ అనేది క్రియలకు విరుద్ధంగా కనికరమే రక్షణకు ఆధారమని సహజమైన తెలుగులో నొక్కిచెబుతుంది.
- source_word: ἔσωσεν ἡμᾶς
  choice: ఆయన మనలను రక్షించాడు
  rationale: ఈ రక్షణశాస్త్ర సందర్భంలో σῴζωకి ‘రక్షించాడు’ సహజమైన, స్థిరమైన సమానార్థకం.
- source_word: διὰ λουτροῦ
  choice: కడుగుదల ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సాధనం లేదా మాధ్యమాన్ని సూచిస్తుంది. λουτρόνను ‘కడుగుదల’గా అనువదించడం బాప్తిస్మం, శుద్ధీకరణ రూపకం, లేదా రెండూ అనే అవకాశాలను తెరిచి ఉంచుతుంది.
- source_word: παλιγγενεσίας
  choice: పునర్జన్మ
  rationale: παλιγγενεσία కొత్త జననం లేదా మళ్లీ జన్మించడాన్ని సూచిస్తుంది; ‘పునర్జన్మ’ సంక్షిప్తంగా theological weightను నిలుపుతుంది, అయితే తెలుగు ఇతర మతపర వాడుక వల్ల ‘కొత్త జననం’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: ἀνακαινώσεως
  choice: నూతనీకరణ
  rationale: నామవాచకమైన ἀνακαίνωσιςకు సమాంతర నామరూపాన్ని నిలిపే గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: πνεύματος ἁγίου
  choice: పరిశుద్ధాత్మ కలిగించే
  rationale: షష్ఠీ సంబంధాన్ని కర్త లేదా మూలంగా గ్రహించి, నూతనీకరణను పరిశుద్ధాత్మ కలిగిస్తాడనే సంభావ్య భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: δικαιοσύνη భావం
  choice: నీతి
  alternative: న్యాయం
  rationale: పౌలు వాడుకలో ‘నీతి’ ప్రధాన భావాన్ని బాగా నిలుపుతుంది; పదానికి ‘న్యాయం’ అనే భావమూ ఉండగలదని పాదసూచికలో ఉంచాం.
- issue: λουτροῦ παλιγγενεσίας యొక్క బాప్తిస్మ సంబంధం
  choice: పునర్జన్మ కడుగుదల
  alternative: బాప్తిస్మ కడుగుదల / శుద్ధీకరణ
  rationale: మూలపాఠం బాప్తిస్మాన్ని, శుద్ధీకరణ రూపకాన్ని, లేదా రెండింటినీ సూచించవచ్చు. ప్రధాన పాఠంలో ‘బాప్తిస్మం’ను చేర్చి వివాదాన్ని ముందే పరిష్కరించలేదు.
- issue: πνεύματος ἁγίου మరియు ἀνακαινώσεως మధ్య సంబంధం
  choice: పరిశుద్ధాత్మ కలిగించే నూతనీకరణ
  alternative: పరిశుద్ధాత్మ యొక్క నూతనీకరణ
  rationale: πνεύματος ἁγίου వెంటనే ముందున్న ἀνακαινώσεωςతో సంబంధించడాన్ని ప్రధాన పాఠం సహజంగా చూపుతుంది; షష్ఠీకి వేరే విధంగా అర్థం చెప్పగల అవకాశాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘మనం స్వయంగా’ మానవ క్రియలపై ఉన్న నొక్కును నిలుపుతుంది; అర్ధవిరామం మరియు దీర్ఘవిరామం గ్రీకు విరుద్ధతను, రక్షణ సాధనాల వివరణను స్పష్టంగా విడదీస్తాయి.
