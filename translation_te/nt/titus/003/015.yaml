id: TIT.3.15
reference: Titus 3:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀσπάζονταί σε οἱ μετ’ ἐμοῦ πάντες. ἄσπασαι τοὺς φιλοῦντας ἡμᾶς ἐν πίστει. ἡ χάρις μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/015.yaml
  text: All who are with me greet you[a]. Greet those who love us in faith. Grace be with all of you.
translation:
  language: te
  text: నాతో ఉన్న వారందరూ నీకు వందనాలు చెబుతున్నారు. విశ్వాసంలో[a] మనలను ప్రేమించేవారికి వందనాలు చెప్పు. కృప మీ అందరితో ఉండుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “ఆ విశ్వాసంలో”; మరో సాధ్యమైన అర్థం: “విశ్వసనీయతతో.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονταί
  choice: వందనాలు చెబుతున్నారు
  rationale: పత్రిక ముగింపులో ἀσπάζομαιకు సహజమైన అభివాదార్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: οἱ μετ’ ἐμοῦ πάντες
  choice: నాతో ఉన్న వారందరూ
  rationale: πάντες అనే ‘అందరూ’ భావాన్ని, μετά + సంబంధవిభక్తి తెలిపే సహవాసాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: ἄσπασαι
  choice: వందనాలు చెప్పు
  rationale: ఏకవచన ఆజ్ఞారూపాన్ని సహజమైన తెలుగు పత్రికా అభివాదంగా అందిస్తుంది.
- source_word: φιλοῦντας
  choice: ప్రేమించేవారికి
  rationale: φιλέωలోని వ్యక్తిగత అనురాగాన్ని సరళంగా, అతివ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
- source_word: ἐν πίστει
  choice: విశ్వాసంలో
  rationale: πίστιςకు ప్రాథమికంగా ‘విశ్వాసం’ అనే అర్థాన్ని ఉంచి, ప్రేమకు సంబంధించిన ఉమ్మడి పరిధి లేదా ఆధారాన్ని సూచిస్తుంది; ఇతర సాధ్యార్థాలు పాదసూచికలో ఉన్నాయి.
- source_word: ἡ χάρις
  choice: కృప
  rationale: పౌలు పత్రికల ఆశీర్వచనాల్లోని దైవకృప భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: μετὰ πάντων ὑμῶν
  choice: మీ అందరితో ఉండుగాక
  rationale: గ్రీకులో అంతర్భావంగా ఉన్న ఆశీర్వచన క్రియను తెలుగులో వ్యక్తం చేస్తూ πάντων అనే ‘అందరూ’ భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ἐν πίστειలో πίστις పదానికి అర్థం
  choice: విశ్వాసంలో
  alternative: ‘ఆ విశ్వాసంలో’; లేదా ‘విశ్వసనీయతతో’
  rationale: ఈ ముగింపు అభివాదంలో విశ్వాసుల ఉమ్మడి విశ్వాస పరిధిని సూచించడం అత్యంత సహజం. అయితే గ్రీకు పదబంధం ‘ఆ విశ్వాసంలో’ లేదా ‘విశ్వసనీయతతో’ అనే అర్థాలకు కూడా అవకాశం ఇస్తుంది; అందువల్ల ఆ సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పత్రిక ముగింపుకు తగిన గౌరవప్రదమైన సరళ శైలి వాడబడింది. తీతును ఉద్దేశించిన ఏకవచన ‘నీకు/చెప్పు’ మరియు సమూహాన్ని ఉద్దేశించిన బహువచన ‘మీ అందరితో’ మధ్య గ్రీకు సంఖ్యాభేదం నిలుపబడింది.
