id: TIT.3.14
reference: Titus 3:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μανθανέτωσαν δὲ καὶ οἱ ἡμέτεροι καλῶν ἔργων προΐστασθαι εἰς τὰς ἀναγκαίας χρείας, ἵνα μὴ ὦσιν ἄκαρποι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/014.yaml
  text: And let our people also learn to engage in good works for necessary needs[c][b][a], so that they may not be unfruitful.
translation:
  language: te
  text: మనవారు[a] కూడా అవసరమైన వాటిని సమకూర్చడానికి మంచి పనులకు తమను అంకితం చేసుకోవడం[b] నేర్చుకోవాలి[c], తద్వారా వారు ఫలహీనులుగా ఉండకుండునట్లు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మన సొంతవారు’ లేదా ‘మన సొంత ప్రజలు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘మంచి పనులు చేయడంలో నిమగ్నమవడం’ లేదా ‘మంచి పనుల్లో ముందుండడం.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘అత్యవసరమైన అవసరాల కోసం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μανθανέτωσαν
  choice: నేర్చుకోవాలి
  rationale: వర్తమానకాల తృతీయ పురుష బహువచన ఆజ్ఞార్థక రూపం. తెలుగులో ‘నేర్చుకోవాలి’ సహజంగా ఉండి, ఉపదేశాత్మక ఆజ్ఞ బలాన్ని నిలుపుతుంది.
- source_word: οἱ ἡμέτεροι
  choice: మనవారు
  rationale: అక్షరార్థంగా ‘మనకు చెందినవారు.’ ఇక్కడ పౌలు, తీతుతో సంబంధమున్న విశ్వాసుల సమాజాన్ని సూచిస్తుంది; స్త్రీపురుషులిద్దరినీ సహజంగా కలుపుతుంది.
- source_word: καλῶν ἔργων
  choice: మంచి పనులు
  rationale: తీతు పత్రికలో పునరావృతమయ్యే నైతికంగా మేలైన కార్యాల భావాన్ని స్పష్టంగా, సాధారణ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: προΐστασθαι
  choice: చేయడంలో నిమగ్నమవడం
  rationale: ఈ క్రియకు ముందుండడం, శ్రద్ధ వహించడం, నిమగ్నమవడం వంటి అర్థాలు సాధ్యం. ఇక్కడ సంఘ నాయకత్వం కంటే మంచి పనుల్లో చురుకైన, నిరంతర భాగస్వామ్యం ప్రధాన భావం.
- source_word: εἰς τὰς ἀναγκαίας χρείας
  choice: అవసరమైన అవసరాలను తీర్చడానికి
  rationale: εἰς ఉద్దేశాన్ని, χρείας వాస్తవ అవసరాలను సూచిస్తాయి. తెలుగు వాక్యంలో మంచి పనులు ఆ అవసరాలను తీర్చే దిశగా ఉన్నాయని స్పష్టం చేయడానికి ‘తీర్చడానికి’ చేర్చబడింది.
- source_word: ἵνα μὴ ὦσιν ἄκαρποι
  choice: అప్పుడు వారు ఫలించనివారిగా ఉండరు
  rationale: ἵνα ఉద్దేశం లేదా ఆశించిన ఫలితాన్ని సూచిస్తుంది. ἄκαρποι లోని ‘ఫలం లేని’ రూపకాన్ని ‘ఫలించనివారు’ నిలుపుతుంది.
theological_decisions:
- issue: οἱ ἡμέτεροι యొక్క పరిధి
  choice: మనవారు—పౌలు, తీతుతో సంబంధమున్న క్రైస్తవ సమాజ సభ్యులు
  alternative: మన సొంతవారు; బయటి వారితో భేదంగా మనవారు
  rationale: ఈ పదబంధం సంబంధాత్మకమైన సామూహిక సూచన; పురుషులకు మాత్రమే పరిమితం చేయడానికి మూలపాఠంలో ఆధారం లేదు.
- issue: προΐστασθαι యొక్క భావం
  choice: మంచి పనులు చేయడంలో నిమగ్నమవడం
  alternative: మంచి పనుల్లో ముందుండడం
  rationale: ‘ముందుండడం’ సాధ్యమైన అర్థమే అయినా, ఇక్కడ అధికారిక నాయకత్వాన్ని అనవసరంగా సూచించవచ్చు. ప్రధాన పాఠం చురుకైన ఆచరణను ఇస్తూ, ప్రత్యామ్నాయాన్ని అడుగుజాడలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ‘ఫలించనివారు’ ద్వారా మూలంలోని ఫల రూపకం నిలుపబడింది. అడుగుజాడ గుర్తులు ప్రధాన పాఠంలో సంబంధిత పదబంధం తరువాత వరుసగా ఉంచబడ్డాయి.
