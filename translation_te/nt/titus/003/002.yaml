source:
  edition: SBLGNT
  text: μηδένα βλασφημεῖν, ἀμάχους εἶναι, ἐπιεικεῖς, πᾶσαν ἐνδεικνυμένους πραΰτητα πρὸς πάντας ἀνθρώπους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/002.yaml
  text: to slander no one[a], to be peaceable, gentle[c][b], showing all meekness toward all people.
translation:
  language: te
  text: ఎవరినీ దూషించకుండా[a], కలహాలకు దిగకుండా, సౌమ్యులుగా ఉండాలని, ప్రజలందరి పట్ల అన్ని విధాలైన మృదుత్వాన్ని చూపాలని.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎవరి గురించి చెడుగా మాట్లాడకుండా.’ ఇక్కడి క్రియ అబద్ధపు అపవాదుకే పరిమితం కాకుండా, అవమానకరంగా మాట్లాడడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδένα βλασφημεῖν
  choice: ఎవరినీ దూషించకుండా
  rationale: మనుషులను ఉద్దేశించిన ఈ నైతిక సందర్భంలో βλασφημεῖν అంటే దేవదూషణ కంటే, ఒకరి గురించి అవమానకరంగా లేదా చెడుగా మాట్లాడడం. ‘దూషించకుండా’ ఈ విస్తృత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἀμάχους εἶναι
  choice: కలహాలకు దిగకుండా ... ఉండాలని
  rationale: ἀμάχους పోరాటం లేదా వాగ్వివాదానికి సిద్ధపడని స్వభావాన్ని సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో ప్రతికూల రూపాన్ని నిలుపుతూ ‘కలహాలకు దిగకుండా’ సహజంగా ఉంటుంది.
- source_word: ἐπιεικεῖς
  choice: సౌమ్యులుగా
  rationale: ἐπιεικήςలో సౌమ్యత, సహనం, ఇతరుల విషయంలో పట్టువిడుపు అనే భావ పరిధి ఉంది. ‘సౌమ్యులుగా’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, తరువాతి πραΰτηςకు వాడిన ‘మృదుత్వం’తో పదభేదాన్ని నిలుపుతుంది.
- source_word: πᾶσαν ἐνδεικνυμένους πραΰτητα
  choice: సంపూర్ణమైన మృదుత్వాన్ని చూపాలని
  rationale: ἐνδεικνυμένουςను ‘చూపాలని’ అని సహజంగా అనువదించాం. πᾶσαν πραΰτητα ఇక్కడ ఆ గుణం సంపూర్ణంగా, అన్ని విధాలా వ్యక్తమవ్వాలని బలపరుస్తుంది; ‘సంపూర్ణమైన మృదుత్వం’ ఆ తీవ్రతను తెలియజేస్తుంది.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: ప్రజలందరి పట్ల
  rationale: πρός దిశ లేదా వైఖరిని సూచిస్తుంది; ἀνθρώπους ఇక్కడ స్త్రీపురుషులందరినీ సూచించే సాధారణ మానవ పదం. ‘ప్రజలందరి పట్ల’ దాని విశ్వవ్యాప్తిని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: πάντας ἀνθρώπους యొక్క సమగ్ర మానవ సూచన
  choice: ప్రజలందరి పట్ల
  alternative: మనుష్యులందరి పట్ల
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పుంలింగ రూపంలో ఉన్నా, సందర్భంలో మానవులందరినీ సూచిస్తుంది. ‘ప్రజలందరి’ లింగపరంగా సమగ్రంగా, సహజంగా ఉంది.
- issue: ἐπιεικεῖς మరియు πραΰτητα మధ్య భావసామీప్యం
  choice: సౌమ్యులుగా ... మృదుత్వాన్ని
  alternative: మృదువుగా ... సాత్వికతను
  rationale: రెండు గ్రీకు పదాల భావాలు దగ్గరగా ఉన్నప్పటికీ అవి ఒకే పదం కావు. రెండు వేర్వేరు తెలుగు పదాలతో అనువదించడం మూలంలోని పదభేదాన్ని నిలుపుతుంది; వాటి అర్థాలను కృత్రిమంగా పూర్తిగా వేరుచేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ఈ వచనం 3:1లోని జ్ఞాపకం చేయించు అనే ఆదేశంపై ఆధారపడిన వరుసలో భాగమైనందున, ‘ఉండాలని/చూపాలని’ రూపాలు వాక్య సంబంధాన్ని నిలుపుతున్నాయి.
