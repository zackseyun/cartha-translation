  rationale: The revision makes the two-warning sequence idiomatic and explicit in modern standard Telugu. It also standardizes the footnote’s factional alternative. The rendering retains the source’s generic individual reference, its likely sense of divisiveness rather than later technical heresy, and the imperative force of παραιτοῦ.
