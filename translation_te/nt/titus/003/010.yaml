  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: αἱρετικὸν ἄνθρωπον μετὰ μίαν καὶ δευτέραν νουθεσίαν παραιτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/010.yaml
  text: Reject a divisive person after a first and second warning,[a]
translation:
  language: te
  text: విభేదాలు కలిగించే వ్యక్తిని మొదటి, రెండవ హెచ్చరికల తరువాత తిరస్కరించు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వర్గాలు ఏర్పరచే వ్యక్తిని”; సాంప్రదాయ అనువాదాల్లో “మతవిరోధి వ్యక్తిని.” గ్రీకు పదం బహుశా సంఘంలో పక్షాలు ఏర్పరచి విభేదాలు సృష్టించే వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱρετικὸν
  choice: విభేదాలు కలిగించే
  rationale: ఈ సందర్భంలో ఈ పదం తరువాతి కాలంలో ఏర్పడిన సాంకేతిక భావమైన ‘మతవిరోధి’ కంటే, పక్షాలు లేదా వర్గ విభేదాలు సృష్టించే వ్యక్తిని సూచించే అవకాశం ఎక్కువ. ఈ అనువాదం సంఘంపై పడే ప్రభావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἄνθρωπον
  choice: వ్యక్తిని
  rationale: ఇక్కడ ఒక వ్యక్తిని సాధారణంగా సూచిస్తోంది. ‘వ్యక్తి’ అనే పదం మూలంలోని మానవ వ్యక్తి భావాన్ని సహజ తెలుగులో కాపాడుతుంది; సందర్భం తప్పనిసరిగా పురుషుడికే పరిమితం చేస్తుందని స్పష్టంగా నిర్ధారించదు.
- source_word: μετὰ μίαν καὶ δευτέραν νουθεσίαν
  choice: ఒకసారి, రెండవసారి హెచ్చరించిన తరువాత
  rationale: చర్య తీసుకునే ముందు వరుసగా రెండుసార్లు దిద్దుబాటు ఉద్దేశంతో హెచ్చరించాలనే భావాన్ని ఇది స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παραιτοῦ
  choice: తిరస్కరించు
  rationale: మధ్యమ వాచక ఆజ్ఞారూపం అటువంటి వ్యక్తిని ఇక అంగీకరించకపోవడం లేదా అతనితో సంబంధాన్ని నిరాకరించడం అనే నిర్ణయాత్మక భావాన్ని ఇస్తుంది. ‘దూరంగా ఉండు’ కంటే ‘తిరస్కరించు’ దాని బలాన్ని మెరుగ్గా నిలుపుతుంది.
theological_decisions:
- issue: αἱρετικὸν అనే పదాన్ని తరువాతి కాలపు సిద్ధాంతపరమైన ‘మతవిరోధి’ భావంతో అనువదించాలా, లేక విభేదాలు సృష్టించే వ్యక్తిగా అనువదించాలా
  choice: విభేదాలు కలిగించే
  alternative: వర్గాలు కట్టే; సాంప్రదాయ అనువాదాల్లో ‘మతవిరోధి’
  rationale: ఈ సందర్భం పదేపదే హెచ్చరించిన తరువాత సంఘ క్రమశిక్షణను అమలు చేయడం గురించి మాట్లాడుతోంది. ‘విభేదాలు కలిగించే’ అనేది మొదటి శతాబ్దపు సాధ్యమైన భావపరిధిని కాపాడుతూ, మూలపాఠంలో స్పష్టంగా లేని తరువాతి సాంకేతిక మతసిద్ధాంత భావాన్ని చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా ఆజ్ఞ యొక్క గంభీరతను నిలుపుతూ రూపొందించబడింది. ‘హెచ్చరించిన తరువాత’లో దిద్దుబాటు ఉద్దేశం ఉంది; ‘తిరస్కరించు’లో నిర్ణయాత్మక సంఘ క్రమశిక్షణ భావం నిలుస్తుంది.
