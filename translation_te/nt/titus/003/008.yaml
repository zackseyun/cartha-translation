id: TIT.3.8
reference: Titus 3:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πιστὸς ὁ λόγος, καὶ περὶ τούτων βούλομαί σε διαβεβαιοῦσθαι, ἵνα φροντίζωσιν καλῶν ἔργων προΐστασθαι οἱ πεπιστευκότες θεῷ. ταῦτά ⸀ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/008.yaml
  text: This saying is trustworthy[a], and concerning these things I want you to insist confidently, so that those who have believed God may be careful to devote themselves to good works[b]. These things are good and beneficial for people.
translation:
  language: te
  text: ఈ మాట నమ్మదగినది. ఈ విషయాల గురించి నీవు దృఢంగా నొక్కిచెప్పాలని నేను కోరుతున్నాను[a], తద్వారా దేవుణ్ణి నమ్మినవారు[b] మంచి పనుల్లో నిమగ్నమై ఉండడానికి శ్రద్ధ వహిస్తారు. ఇవి మనుషులకు మంచివి, ప్రయోజనకరమైనవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దృఢంగా ధ్రువీకరించాలని” లేదా “గట్టిగా నొక్కిచెప్పాలని.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దేవునిపై విశ్వాసముంచినవారు” లేదా “దేవునిపై భరోసా ఉంచినవారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: ఈ మాట నమ్మదగినది
  rationale: పాస్టరల్ పత్రికలలో కనిపించే సూత్రప్రాయమైన వాక్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; λόγος ఇక్కడ ఒక్క పదం కంటే ముందున్న సందేశాన్ని సూచిస్తుంది.
- source_word: περὶ τούτων
  choice: ఈ విషయాలను
  rationale: ముందు చెప్పిన విషయాలతో అనుసంధానాన్ని స్పష్టంగా ఉంచుతూ, తెలుగు వాక్య నిర్మాణానికి సహజంగా ఉంది.
- source_word: βούλομαί σε διαβεβαιοῦσθαι
  choice: నువ్వు దృఢంగా నొక్కిచెప్పాలని నేను కోరుతున్నాను
  rationale: βούλομαιలోని వ్యక్తిగత కోరికను, διαβεβαιοῦσθαιలోని బలమైన మరియు ధైర్యమైన నిర్ధారణను రెండింటినీ వ్యక్తం చేస్తుంది.
- source_word: ἵνα φροντίζωσιν
  choice: తద్వారా ... శ్రద్ధ వహిస్తారు
  rationale: ἵνα తెలిపే ఉద్దేశం లేదా ఫలిత సంబంధాన్ని, φροντίζω తెలిపే జాగ్రత్తతో కూడిన శ్రద్ధను సహజమైన తెలుగులో అందిస్తుంది.
- source_word: καλῶν ἔργων προΐστασθαι
  choice: మంచి పనులు చేయడానికి తమను తాము అంకితం చేసుకోవడం
  rationale: ప్రధానత్వం వహించడం అనే సంస్థాగత భావాన్ని బలవంతంగా చేర్చకుండా, మంచి పనులలో స్థిరంగా నిమగ్నమయ్యే అర్థాన్ని తెలియజేస్తుంది.
- source_word: οἱ πεπιστευκότες θεῷ
  choice: దేవుణ్ణి నమ్మినవారు
  rationale: θεῷ అనే సంప్రదాన విభక్తి నిర్మాణాన్ని సమీపంగా అనుసరిస్తూ, పూర్తయి కొనసాగుతున్న విశ్వాస స్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις
  choice: మనుషులకు మంచివి, ప్రయోజనకరమైనవి
  rationale: నైతికమైన మంచితనాన్ని, ఆచరణాత్మక ప్రయోజనాన్ని వేర్వేరుగా నిలుపుతుంది; ἀνθρώποιςను లింగభేదం లేకుండా సాధారణ మానవులను సూచించేలా అనువదిస్తుంది.
theological_decisions:
- issue: విశ్వాసం మరియు మంచి పనుల మధ్య సంబంధం
  choice: ముందుగా దేవుణ్ణి నమ్మినవారు దాని ఫలితంగా మంచి పనులకు అంకితమవాలని వాక్యం చూపే క్రమాన్ని నిలిపాం.
  alternative: మంచి పనులను రక్షణకు ఆధారంగా లేదా ప్రతిఫలార్హమైన సాధనగా చూపడం.
  rationale: గ్రీకు వాక్యంలో విశ్వాసులు మంచి పనులపై శ్రద్ధ పెట్టడం ఉద్దేశిత ఫలితంగా ఉంది; రక్షణకు కారణంగా లేదు.
- issue: πιστεύωకు θεῷ అనే సంప్రదాన విభక్తి కర్మ
  choice: దేవుణ్ణి నమ్మినవారు
  alternative: దేవునిపై విశ్వాసముంచినవారు; దేవునిపై భరోసా ఉంచినవారు
  rationale: మూలంలోని ప్రత్యక్ష నిర్మాణాన్ని నిలుపుతూ, 'దేవుడు చెప్పినదాన్ని నమ్మడం' మరియు 'దేవునిపై విశ్వాసం ఉంచడం' మధ్యనున్న భావ పరిధిని పూర్తిగా మూసివేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. తీతుకు ఉద్దేశించిన ఏకవచన సంబోధనకు సహజమైన “నువ్వు” వాడబడింది. వాక్యంలోని దీర్ఘ గ్రీకు నిర్మాణాన్ని తెలుగులో స్పష్టత కోసం మూడు వాక్యాలుగా విభజించాం.
