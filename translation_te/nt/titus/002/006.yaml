translation:
  language: te
  text: యువకులను కూడా[a] స్వీయనిగ్రహంతో ఉండమని[b] ఉద్బోధించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యువ పురుషులను.” గ్రీకు పదం సాధారణంగా యువత అందరినీ కాక, ప్రత్యేకంగా చిన్నవయసు పురుషులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
