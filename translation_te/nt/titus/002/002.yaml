  to: వృద్ధ పురుషులు మితశీలులుగా, గౌరవానికి తగినవారుగా, ఆత్మనిగ్రహం కలవారుగా, విశ్వాసంలో[a], ప్రేమలో, సహనంలో స్థిరంగా ఉండాలి.
