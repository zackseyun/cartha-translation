id: TIT.2.2
reference: Titus 2:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πρεσβύτας νηφαλίους εἶναι, σεμνούς, σώφρονας, ὑγιαίνοντας τῇ πίστει, τῇ ἀγάπῃ, τῇ ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/002.yaml
  text: Older men are to be temperate[a], dignified, self-controlled, sound in faith, in love, and in steadfastness.
translation:
  language: te
  text: వృద్ధ పురుషులు మితశీలులుగా, గౌరవానికి తగినవారుగా, ఆత్మనిగ్రహం కలవారుగా, విశ్వాసంలో[a], ప్రేమలో, సహనంలో స్థిరంగా ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విశ్వసనీయతలో.” గ్రీకు పదం πίστις సందర్భానుసారం “విశ్వాసం” లేదా “విశ్వసనీయత” అని అర్థమివ్వగలదు.
    reason: ప్రత్యామ్నాయ అర్థాన్ని, మూలపాఠంలోని నిజమైన సందిగ్ధతను పరిరక్షించడం.
lexical_decisions:
- source_word: πρεσβύτας
  choice: వృద్ధ పురుషులు
  rationale: ఇంటి సభ్యుల వివిధ వయోవర్గాలకు ఇచ్చే ఉపదేశ సందర్భంలో ఇది సంఘపెద్దల పదవిని కాకుండా వయసులో పెద్దవారైన పురుషులను సూచిస్తుంది.
- source_word: νηφαλίους
  choice: మితశీలులుగా
  rationale: ఈ పదానికి మత్తులేకుండా మెలకువగా ఉండడం అనే అర్థంతో పాటు ప్రవర్తనలో సంయమనం పాటించడం అనే విస్తృత నైతిక భావం ఉంది; ‘మితశీలులు’ ఆ విస్తృత భావాన్ని తెలియజేస్తుంది.
- source_word: σεμνούς
  choice: గౌరవానికి తగినవారిగా
  rationale: గంభీరత, నైతిక హుందాతనం వల్ల గౌరవం పొందదగిన స్వభావాన్ని ఈ పదం సూచిస్తుంది; కేవలం దిగులుగా లేదా కఠినంగా ఉండడం అనే అపార్థాన్ని ఇది నివారిస్తుంది.
- source_word: σώφρονας
  choice: ఆత్మనిగ్రహం గలవారిగా
  rationale: వివేకంతో తన కోరికలను, ప్రవర్తనను అదుపులో ఉంచుకునే లక్షణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὑγιαίνοντας
  choice: దృఢంగా
  rationale: మూలపదం అక్షరార్థంగా ‘ఆరోగ్యంగా ఉండడం’ను సూచించినా ఇక్కడ విశ్వాసం, ప్రేమ, సహనం అనే గుణాల విషయంలో లోపంలేక స్థిరంగా ఉండే భావం రూపకాలంకారంగా ఉంది; తెలుగులో ‘దృఢంగా’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: τῇ πίστει
  choice: విశ్వాసంలో
  rationale: πίστιςకు ఇక్కడ ‘విశ్వాసం’ లేదా ‘విశ్వసనీయత’ అనే భావాలు సాధ్యమైనప్పటికీ, ప్రధాన పాఠంలో సాధారణమైన ‘విశ్వాసం’ ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో పరిరక్షించాం.
- source_word: τῇ ἀγάπῃ
  choice: ప్రేమలో
  rationale: ἀγάπηకు సహజమైన, విస్తృతంగా అర్థమయ్యే తెలుగు సమానార్థకం ‘ప్రేమ’; దత్తివిభక్తి భావాన్ని ‘లో’తో వ్యక్తం చేశాం.
- source_word: τῇ ὑπομονῇ
  choice: సహనంలో
  rationale: కష్టాల మధ్య ఓర్పుతో నిలిచి ఉండడాన్ని ὑπομονή సూచిస్తుంది; ‘సహనం’ సాధారణ పాఠకులకు సహజంగా ఉండి, సందర్భంలోని నిలకడ భావాన్ని ‘దృఢంగా’తో కలిసి తెలియజేస్తుంది.
- source_word: εἶναι
  choice: ఉండాలి
  rationale: ఈ క్రియారూపం ముందటి వాక్యంలో ఉన్న ఉపదేశానికి ఆధారపడినప్పటికీ, తెలుగులో ఆ ఆదేశాత్మక భావాన్ని ‘ఉండాలి’ స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: గుణాల జాబితాలో πίστις అర్థం
  choice: విశ్వాసం
  alternative: విశ్వసనీయత
  rationale: ‘విశ్వాసం, ప్రేమ, సహనం’ అనే త్రయంలో πίστις దేవునిపై విశ్వాసాన్ని లేదా వ్యక్తిగత విశ్వసనీయతను సూచించవచ్చు. మూలంలోని సందిగ్ధతను బలవంతంగా పరిష్కరించకుండా ప్రధాన పాఠంలో ‘విశ్వాసం’ ఉంచి, మరొక సాధ్యమైన అర్థాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన ఉపదేశ శైలిని వాడాం. గుణాల జాబితాలో సమాంతర నిర్మాణాన్ని నిలిపి, ‘విశ్వాసంలో, ప్రేమలో, సహనంలో’ అనే మూలంలోని త్రయాన్ని కాపాడాం.
