  text: For the grace of God has appeared[b][a], bringing salvation to all people.
translation:
  language: te
  text: ఎందుకంటే ప్రజలందరికీ[b] రక్షణ కలిగించే దేవుని కృప ప్రత్యక్షమైంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రజలందరినీ రక్షిస్తూ ప్రత్యక్షమైంది’; లేదా ‘ప్రజలందరికీ ప్రత్యక్షమైంది.’ గ్రీకులోని σωτήριος (‘రక్షణ కలిగించే,’ ‘రక్షించేది’) అనే విశేషణాన్ని, πᾶσιν ἀνθρώποις అనే పదబంధాన్ని వ్యాకరణపరంగా కొద్దిగా భిన్న విధాలుగా అన్వయించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ప్రజలు’ అని అనువదించిన గ్రీకు పదం ఇక్కడ పురుషులను మాత్రమే కాక మానవులందరినీ సాధారణంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεφάνη
  choice: ప్రత్యక్షమైంది
  rationale: ἐπιφαίνω యొక్క ఇక్కడి అకర్మక భావాన్ని ‘ప్రత్యక్షమైంది’ సహజంగా, గంభీరంగా వ్యక్తం చేస్తుంది; కృప వెల్లడైన చారిత్రక సంఘటనను సూచిస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న ఉపదేశానికి కారణం లేదా ఆధారాన్ని γάρ పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ‘ఎందుకంటే’ ఈ సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: దేవుని కృప
  rationale: మూలంలోని సంబంధవాచక నిర్మాణాన్ని సంక్షిప్తంగా నిలుపుతూ, χάρις లోని దైవ అనుగ్రహ భావాన్ని ‘కృప’ సముచితంగా తెలియజేస్తుంది.
- source_word: σωτήριος
  choice: రక్షణ కలిగించే
  rationale: ఈ విశేషణం కృపను రక్షణను అందించేదిగా వర్ణిస్తుంది. ‘రక్షణ కలిగించే’ అనేది తెలుగులో సహజంగా ఉండి, అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- source_word: πᾶσιν ἀνθρώποις
  choice: ప్రజలందరికీ
  rationale: ἄνθρωποι ఇక్కడ పురుషులను మాత్రమే కాక మానవులందరినీ సాధారణంగా సూచిస్తుంది. ‘ప్రజలందరికీ’ మూలంలోని విశాల పరిధిని ఏ సిద్ధాంతపరమైన సంకుచితీకరణ లేకుండా నిలుపుతుంది.
theological_decisions:
- issue: πᾶσιν ἀνθρώποις అనే మాటకు రక్షణతో ఉన్న సంబంధం
  choice: ‘ప్రజలందరికీ రక్షణ కలిగించే’ అని అనువదించి, వాక్యంలోని సార్వత్రిక పరిధిని నిలిపాం.
  alternative: ‘ప్రజలందరినీ రక్షిస్తూ ప్రత్యక్షమైంది’ లేదా ‘ప్రజలందరికీ ప్రత్యక్షమైంది.’
  rationale: గ్రీకు విశేషణమైన σωτήριος మరియు చతుర్థీ విభక్తి పదబంధమైన πᾶσιν ἀνθρώποις మధ్య సంబంధాన్ని వ్యాకరణపరంగా ఒకటి కంటే ఎక్కువ విధాలుగా గ్రహించవచ్చు. ప్రధాన పాఠం కృప రక్షణ కలిగించేదని చెబుతుంది; అయితే ‘అందరూ’ అన్నది ప్రతి వ్యక్తినేనా లేక అన్ని వర్గాల ప్రజలనినా అనే సిద్ధాంతపరమైన వివాదాన్ని అనువాదం తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్య నిర్మాణం వాడబడింది. ‘కృప,’ ‘రక్షణ,’ ‘ప్రత్యక్షమైంది’ అనే స్థిరమైన బైబిలు పదజాలాన్ని సాధారణ పాఠకులకు అర్థమయ్యే రీతిలో నిలిపాం; మూలంలోని వ్యాకరణ సందిగ్ధతను పాదటిప్పణిలో భద్రపరిచాం.
