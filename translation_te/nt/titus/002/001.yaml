id: TIT.2.1
reference: Titus 2:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Σὺ δὲ λάλει ἃ πρέπει τῇ ὑγιαινούσῃ διδασκαλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/001.yaml
  text: But as for you[a], speak the things that are fitting for sound teaching.
translation:
  language: te
  text: కాని నీవు స్వస్థమైన బోధకు[a] తగిన విషయాలు చెప్పు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘స్వస్థమైన సిద్ధాంతానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ
  choice: నీవు
  rationale: గ్రీకులో సర్వనామం స్పష్టంగా ఉండి, ముందున్న అబద్ధ బోధకులకు భిన్నంగా తీతును నొక్కిచెబుతోంది. తెలుగు వాక్యంలో ‘నీవు’ను ఉంచడం ఆ వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: కాని
  rationale: మునుపటి సందర్భంలోని అబద్ధ బోధకులకు తీతు విరుద్ధంగా ప్రవర్తించాలని సూచించే వ్యత్యాసాన్ని ‘కాని’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: λάλει
  choice: చెప్పు
  rationale: λαλέω సాధారణంగా మాట్లాడడం లేదా చెప్పడం అనే విస్తృత అర్థం ఇస్తుంది. ‘చెప్పు’ అనే పదం ఆజ్ఞను సహజ తెలుగులో అందిస్తూ, దానిని కేవలం అధికారిక బోధనకే పరిమితం చేయదు.
- source_word: ἃ
  choice: విషయాలు
  rationale: నపుంసక బహువచన సంబంధ సర్వనామం తీతు చెప్పవలసిన వాటిని సూచిస్తుంది. ‘విషయాలు’ దాని బహువచన భావాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: πρέπει
  choice: తగిన
  rationale: πρέπω అనుకూలంగా, యుక్తంగా లేదా సరిపడే విధంగా ఉండడాన్ని సూచిస్తుంది. ‘తగిన’ ఈ భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: ὑγιαινούσῃ
  choice: స్వస్థమైన
  rationale: ఇక్కడ ఈ పదం శారీరక ఆరోగ్యాన్ని రూపకంగా ఉపయోగించి బోధ యొక్క ఆరోగ్యకరమైన, లోపరహిత స్వభావాన్ని సూచిస్తుంది. ‘స్వస్థమైన’ ఆ రూపకాన్ని నిలుపుతుంది.
- source_word: διδασκαλίᾳ
  choice: బోధ
  rationale: διδασκαλία బోధించే కార్యాన్నీ, బోధ యొక్క విషయాన్నీ సూచించగలదు. ‘బోధ’ రెండింటికీ వీలిస్తూ, సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది.
theological_decisions:
- issue: τῇ ὑγιαινούσῃ διδασκαλίᾳ అనే పదబంధం
  choice: స్వస్థమైన బోధ
  alternative: స్వస్థమైన సిద్ధాంతం
  rationale: ‘స్వస్థమైన బోధ’ మూలంలోని ఆరోగ్య రూపకాన్ని, అపొస్తలిక ఉపదేశంలోని విషయార్థాన్ని నిలుపుతూ, దానిని సాంకేతిక మతపరమైన పదజాలానికి పరిమితం చేయదు. ‘సిద్ధాంతం’ సాధ్యమైన అర్థమైనా, διδασκαλίαలోని బోధన భావాన్ని కొంత సంకుచితం చేయవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. ‘కాని నీవు’ గ్రీకు వాక్యంలోని వ్యత్యాసాత్మక నొక్కును నిలుపుతుంది; ‘స్వస్థమైన బోధ’ మూలంలోని రూపకాన్నీ భావపరమైన విస్తృతినీ కాపాడుతుంది.
