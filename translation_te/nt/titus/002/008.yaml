id: TIT.2.8
reference: Titus 2:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λόγον ὑγιῆ ἀκατάγνωστον, ἵνα ὁ ἐξ ἐναντίας ἐντραπῇ μηδὲν ἔχων ⸂λέγειν περὶ ἡμῶν⸃ φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/008.yaml
  text: sound speech that cannot be condemned[a], so that the one who opposes us may be put to shame[c][b], having nothing evil to say about us.
translation:
  language: te
  text: ఎవరూ ఖండించలేని హితమైన మాటను పలుకు[a]. తద్వారా ఎదిరించే వాడు[b] మన గురించి చెడుగా చెప్పడానికి ఏమీ లేక సిగ్గుపడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎవరూ తప్పుపట్టలేని స్వస్థమైన వాక్కు’; ‘మాట’కు ‘వాక్కు’ లేదా ‘సందేశం’ అని కూడా అనువదించవచ్చు.
    reason: λόγος మరియు ὑγιῆకు సాధ్యమైన సందర్భానుసార ప్రత్యామ్నాయాలను తెలియజేయడానికి.
  - marker: b
    text: అక్షరార్థంగా, ‘ఎదురు పక్షానికి చెందినవాడు’; అంటే ప్రత్యర్థి.
    reason: ὁ ἐξ ἐναντίας అనే గ్రీకు ప్రయోగం యొక్క అక్షరార్థం మరియు సందర్భార్థాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: λόγον ὑγιῆ
  choice: ఆరోగ్యకరమైన మాట
  rationale: λόγος ఇక్కడ బోధనలోని మాట లేదా సందేశాన్ని సూచిస్తుంది; ὑγιής దాని సిద్ధాంతపరమైన, నైతికమైన ఆరోగ్యాన్ని రూపకంగా తెలియజేస్తుంది. ‘ఆరోగ్యకరమైన మాట’ ఆ రూపకాన్ని నిలుపుతూ ఆధునిక తెలుగులో అర్థమయ్యేలా ఉంది.
- source_word: ἀκατάγνωστον
  choice: ఖండించడానికి వీలులేని
  rationale: న్యాయంగా తప్పుపట్టడానికి లేదా దోషిగా నిర్ధారించడానికి ఆధారం లేని మాట అనే భావాన్ని సహజమైన తెలుగు ఉపవాక్యంతో వ్యక్తం చేస్తుంది.
- source_word: ἵνα
  choice: అప్పుడు
  rationale: ముందు చెప్పిన ప్రవర్తన వల్ల కలగవలసిన ఉద్దేశ్యపూర్వక ఫలితాన్ని తెలుగులో సహజంగా అనుసంధానిస్తుంది; గ్రీకు వాక్యంలోని ఉద్దేశ్యం–ఫలితం సంబంధాన్ని కాపాడుతుంది.
- source_word: ὁ ἐξ ἐναντίας
  choice: ఎదిరించే వాడు
  rationale: అక్షరార్థంగా ‘ఎదురు పక్షానికి చెందినవాడు’; సందర్భంలో ప్రత్యర్థిని సూచిస్తుంది. ఎవరికీ లేదా దేనికి విరోధి అనేది అనవసరంగా విస్తరించకుండా ఉంచబడింది.
- source_word: ἐντραπῇ
  choice: సిగ్గుపడతాడు
  rationale: ప్రత్యర్థి సిగ్గుకు గురవడం లేదా సిగ్గుపడడం అనే సామాజిక–నైతిక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: μηδὲν ἔχων λέγειν περὶ ἡμῶν φαῦλον
  choice: మన గురించి చెడుగా చెప్పడానికి ఏమీ లేక
  rationale: గ్రీకు భాగస్వామ్య నిర్మాణాన్ని సహజమైన కారణ/పరిస్థితి నిర్మాణంగా అందిస్తూ, περὶ ἡμῶν లోని ప్రథమ పురుష బహువచనాన్ని యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: περὶ ἡμῶν లోని ‘మన’ పరిధి
  choice: ‘మన గురించి’ అని మాత్రమే అనువదించడం
  alternative: ‘నీ గురించి’, ‘క్రైస్తవులమైన మన గురించి’, లేదా ‘మన బోధ గురించి’
  rationale: గ్రీకు పాఠంలో ప్రథమ పురుష బహువచనం ఉంది; అది పౌలు, తీతు, లేదా విస్తృత విశ్వాస సమాజంలో ఎవరిని ఎంతవరకు చేర్చుతుందో అనువాదంలో నిర్ణయించకుండా అసలు అనిశ్చితిని నిలుపుతుంది.
- issue: ἐντραπῇ యొక్క స్వరూపం
  choice: ‘సిగ్గుపడతాడు’
  alternative: ‘సిగ్గుపడేలా చేయబడతాడు’ లేదా ‘అవమానానికి గురవుతాడు’
  rationale: క్రియలో సిగ్గుకు గురికావడం మరియు సిగ్గుపడడం రెండింటి ఛాయలూ సాధ్యమైనందున, తెలుగులో సహజంగా ఉండే రూపాన్ని ఎంచుకుని శిక్షాత్మక లేదా బలవంతపు భావాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ముందటి వచనంలో ప్రారంభమైన ఉపదేశ నిర్మాణాన్ని తెలుగులో పూర్తి చేయడానికి ‘పలుకు’ చేర్చబడింది; ఇది λόγον యొక్క సందర్భార్థాన్ని స్పష్టం చేస్తుంది గాని కొత్త సిద్ధాంత విషయాన్ని జోడించదు.
