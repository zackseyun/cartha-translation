  to: ఎవరూ ఖండించలేని హితమైన మాటను పలుకు[a]. తద్వారా ఎదిరించే వాడు[b] మన గురించి చెడుగా చెప్పడానికి ఏమీ లేక సిగ్గుపడతాడు.
  rationale: The revision retains the supplied imperative and the Greek ambiguity concerning ‘us,’ while making the sound/wholesome metaphor idiomatic in Telugu. It replaces the merely temporal connector with a purposive-result connector and refines the footnotes for lexical clarity. No doctrinal interpretation has been added.
