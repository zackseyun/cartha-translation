- from: అన్నివిధాలా[a] మంచి పనులకు నిన్ను నీవు మాదిరిగా[b] చూపించుకుంటూ, నీ బోధలో[c] నిష్కల్మషతను[d], గౌరవప్రదమైన గంభీరతను[e] కనబరచు.
  to: అన్నివిధాలా[a] మంచి పనుల్లో ఆదర్శంగా[b] నిన్ను నీవు చూపించుకో; నీ బోధలో[c] కలుషరాహిత్యాన్ని[d], గంభీరతను[e] కనబరచు.
