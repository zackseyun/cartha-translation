    reason: lexical_alternative
  - marker: d
    text: లేదా, ‘స్వచ్ఛతను,’ ‘సమగ్రతను,’ లేదా మరింత అక్షరార్థంగా ‘చెడిపోనితనం.’
    reason: lexical_alternative
  - marker: e
