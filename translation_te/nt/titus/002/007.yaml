  text: in every way presenting yourself as an example of good works[a]; in your teaching, purity, dignity[e][d][c][b],
translation:
  language: te
  text: అన్నివిధాలా[a] మంచి పనుల్లో ఆదర్శంగా[b] నిన్ను నీవు చూపించుకో; నీ బోధలో[c] కలుషరాహిత్యాన్ని[d], గంభీరతను[e] కనబరచు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అన్నిటిలో.’ గ్రీకు పదబంధాన్ని మరింత అక్షరార్థంగా ‘అన్ని విషయాల్లో’ అని కూడా అనువదించవచ్చు.
