  text: παιδεύουσα ἡμᾶς, ἵνα ἀρνησάμενοι τὴν ἀσέβειαν καὶ τὰς κοσμικὰς ἐπιθυμίας σωφρόνως καὶ δικαίως καὶ εὐσεβῶς ζήσωμεν ἐν τῷ νῦν αἰῶνι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/012.yaml
  text: training us[a], so that, having renounced ungodliness and worldly desires, we might live self-controlled, righteous, and godly lives in the present age[c][b],
translation:
  language: te
  text: భక్తిహీనతను, లోకసంబంధమైన కోరికలను త్యజించి, ప్రస్తుత యుగంలో ఆత్మనిగ్రహంతో, నీతిగా, దైవభక్తితో జీవించేలా మనకు శిక్షణ ఇస్తుంది[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మనకు ఉపదేశం చేస్తూ’ లేదా ‘మనలను క్రమశిక్షణలో పెడుతూ’; గ్రీకు పదంలో బోధించి, తీర్చిదిద్దే శిక్షణ భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘లోకసంబంధమైన వాంఛలను.’
    reason: lexical_alternative
  - marker: c
    text: గ్రీకులో ‘ఆత్మనిగ్రహంతో, నీతిగా, దైవభక్తితో’ అనే మూడు క్రియావిశేషణాలు ఉన్నాయి. అంటే ఆత్మనిగ్రహం, నీతి, దైవభక్తి గుర్తులుగా ఉన్న జీవితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύουσα
  choice: శిక్షణ ఇస్తూ
  rationale: ఈ పదంలో బోధనతోపాటు నైతికంగా తీర్చిదిద్దడం అనే భావం ఉంది. ‘శిక్షణ ఇస్తూ’ ఆ నిర్మాణాత్మక ప్రక్రియను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἵνα
  choice: జీవించేలా చేస్తుంది
  rationale: గ్రీకు ఉద్దేశ్యార్థక నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, కృప ఇచ్చే శిక్షణ దేనికి దారితీస్తుందో చూపిస్తుంది.
- source_word: ἀρνησάμενοι
  choice: త్యజించి
  rationale: ముఖ్య క్రియకు ముందు జరిగే నిర్ణయాత్మక తిరస్కరణను సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀσέβειαν
  choice: భక్తిహీనతను
  rationale: దేవునిపట్ల భక్తి, గౌరవం లేని వైఖరి మరియు జీవనాన్ని సూచించే మతనైతిక భావాన్ని కాపాడుతుంది.
- source_word: κοσμικὰς ἐπιθυμίας
  choice: లోకసంబంధమైన కోరికలను
  rationale: ప్రస్తుత లోకవ్యవస్థతో రూపుదిద్దుకున్న కోరికలను సూచిస్తుంది; ‘లోకసంబంధమైన’ అనేది ‘లౌకిక’ కంటే ఇక్కడ తక్కువ అపార్థకరం.
- source_word: σωφρόνως
  choice: ఆత్మనిగ్రహంతో
  rationale: తీతు పత్రికలో ప్రముఖమైన వివేకపూర్వక స్వీయనియంత్రణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δικαίως
  choice: నీతిగా
  rationale: సరైనదానికి అనుగుణమైన ప్రవర్తనను, అలాగే పదంలోని నైతిక-దైవశాస్త్రీయ ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: εὐσεβῶς
  choice: దైవభక్తితో
  rationale: దేవునివైపు మళ్లిన భక్తిపూర్వక జీవనాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ζήσωμεν
  choice: జీవించేలా
  rationale: ἵνα కింద ఉన్న సంభావనార్థక క్రియను తెలుగులో ఉద్దేశ్యం లేదా ఆశించిన ఫలితంగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: ప్రస్తుత యుగంలో
  rationale: రాబోయే యుగానికి భిన్నమైన ఇప్పటి యుగం అనే అంత్యకాల సంబంధిత సూచనను కాపాడుతుంది.
theological_decisions:
- issue: σωφρόνως καὶ δικαίως καὶ εὐσεβῶς అనే మూడు క్రియావిశేషణాలు
  choice: ఆత్మనిగ్రహంతో, నీతిగా, దైవభక్తితో జీవించడం
  alternative: వివేకంగా, న్యాయంగా, భక్తిగా జీవించడం
  rationale: మూడు గ్రీకు క్రియావిశేషణాల ప్రత్యేకతను నిలుపుతూ, వ్యక్తిగత స్వీయనియంత్రణ, ఇతరులపట్ల నీతియుత ప్రవర్తన, దేవునిపట్ల భక్తి అనే త్రిముఖ నైతిక రూపాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- issue: ἀρνησάμενοι యొక్క కాలసంబంధ భావం
  choice: త్యజించి
  alternative: తిరస్కరిస్తూ
  rationale: గ్రీకు ఏఓరిస్ట్ కృదంతం ప్రధాన జీవనక్రియకు సంబంధించి ముందుగా లేదా నిర్ణయాత్మకంగా జరిగే విరమణను సూచిస్తుంది; అయితే అది ఒకే చారిత్రక క్షణానికి పరిమితమని అనవసరంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ఈ వాక్యం ముందరి వచనంలోని ‘దేవుని కృప’ను కర్తగా కొనసాగిస్తుంది; అందువల్ల మూలంలో లేని కొత్త కర్తను చేర్చలేదు. ‘జీవించేలా చేస్తుంది’ అనే సహజ తెలుగు నిర్మాణం గ్రీకు ἵνα యొక్క ఉద్దేశ్య/ఫలిత బలాన్ని వ్యక్తం చేస్తుంది.
