source:
  edition: SBLGNT
  text: σώφρονας, ἁγνάς, ⸀οἰκουργούς, ἀγαθάς, ὑποτασσομένας τοῖς ἰδίοις ἀνδράσιν, ἵνα μὴ ὁ λόγος τοῦ θεοῦ βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/005.yaml
  text: self-controlled[a], pure, working at home, kind, being subject to their own husbands[c][b], so that the word of God may not be slandered.
translation:
  language: te
  text: స్వీయనిగ్రహం కలిగినవారుగా, పవిత్రులుగా, ఇంటి పనుల్లో నిమగ్నులుగా[a], మంచివారుగా, తమ సొంత భర్తలకు లోబడి ఉండేవారుగా[b] ఉండాలి; దేవుని వాక్యం దూషించబడకుండా ఉండేందుకు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ఇంటిని చూసుకునేవారుగా.” గ్రీకు పదం అరుదైనది; ఇంటికి సంబంధించిన పనిలో నిమగ్నమై ఉండడాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: “తమ సొంత భర్తలకు తమను తాము లోబరచుకునేవారుగా.”'
    reason: lexical_alternative
  - marker: c
    text: 'లేదా: “దేవుని వాక్యం దూషించబడకుండునట్లు.” “దూషించబడటం” అనే పదానికి “అపనిందకు గురికావడం” లేదా “చెడుగా మాట్లాడబడటం” అనే భావమూ ఉండవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σώφρονας
  choice: నిగ్రహం కలవారిగా
  rationale: వివేకంతో కూడిన స్వీయనియంత్రణను సూచించే ఈ పదానికి ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉండే రూపం.
- source_word: ἁγνάς
  choice: పవిత్రంగా
  rationale: నైతిక పరిశుద్ధత అనే విస్తృత భావాన్ని నిలుపుతుంది; కేవలం లైంగిక శీలానికే పరిమితం చేయదు.
- source_word: οἰκουργούς
  choice: ఇంటి పనుల్లో నిమగ్నులుగా
  rationale: అరుదైన ఈ గ్రీకు పదంలోని ‘ఇల్లు’ మరియు ‘పని’ భావాలను రెండింటినీ వ్యక్తం చేస్తుంది; ఇంటికే పరిమితమై ఉండాలనే అదనపు భావాన్ని చేర్చదు.
- source_word: ἀγαθάς
  choice: మంచివారిగా
  rationale: గ్రీకు పదంలోని విస్తృతమైన నైతిక మంచితనాన్ని నిలుపుతుంది; ‘దయగలవారిగా’ అనే సందర్భోచిత భావం సాధ్యమైనా అది కొంత సంకుచితమైనది.
- source_word: ὑποτασσομένας
  choice: లోబడి ఉండేవారిగా
  rationale: సంబంధంలోని క్రమబద్ధమైన లోబడుటను తెలుపుతూ, స్వచ్ఛందత లేదా బలవంతం గురించి మూలపాఠం చెప్పని అదనపు భావాన్ని చేర్చదు.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: తమ సొంత భర్తలకు
  rationale: గృహసంబంధ సందర్భంలో ἀνήρ అంటే ‘భర్త’; ἰδίοιςను ‘సొంత’గా ఉంచడం ద్వారా ఈ మాట వివాహ సంబంధానికే పరిమితమని స్పష్టం అవుతుంది.
- source_word: ἵνα μὴ
  choice: అప్పుడు ... దూషించబడదు
  rationale: తెలుగులో సహజమైన ఫలిత/ఉద్దేశ నిర్మాణంతో ప్రతికూల ప్రయోజనాన్ని తెలియజేస్తుంది; ‘దూషించబడకుండా ఉండేందుకు’ అనే మరింత ప్రత్యక్ష రూపం కూడా సాధ్యం.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: దేవుని వాక్యం
  rationale: దేవుని సందేశాన్ని సూచించే స్థిరమైన, విస్తృతంగా అర్థమయ్యే తెలుగు వ్యక్తీకరణ.
- source_word: βλασφημῆται
  choice: దూషించబడదు
  rationale: దేవుని వాక్యం అపకీర్తికి లేదా అవమానకరమైన మాటలకు గురికావడాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: οἰκουργούς అనే గృహపని పదం ఇంటికే పరిమితం కావాలని సూచిస్తుందా?
  choice: ఇంటి పనుల్లో నిమగ్నులుగా
  alternative: ఇంటిని చూసుకునేవారిగా
  rationale: మూలపదం గృహసంబంధమైన శ్రమను నొక్కిచెబుతుంది; స్త్రీలు ఇంటి వెలుపల పని చేయకూడదనే సిద్ధాంతాన్ని అది స్పష్టంగా చెప్పదు. అందువల్ల పనిని నిలుపుతూ, నిర్బంధాన్ని చేర్చని అనువాదం ఎంచుకోబడింది.
- issue: ὑποτασσομέναςలోని వివాహసంబంధ లోబడుట
  choice: తమ సొంత భర్తలకు లోబడి ఉండేవారిగా
  alternative: తమ సొంత భర్తలకు తమను తాము లోబరచుకునేవారిగా
  rationale: వివాహ సంబంధంలోని లోబడుటను మూలపాఠం ప్రకారం నిలుపుతుంది; అయితే విస్తృతమైన ఏ లింగపాత్ర సిద్ధాంతాన్నీ ఈ ఒక్క వాక్యంలోకి దిగుమతి చేయదు. ‘తమ సొంత’ అనేది పరిధిని ఆయా స్త్రీల భర్తలకే పరిమితం చేస్తుంది.
- issue: ἵνα μὴ యొక్క ఉద్దేశ/ఫలిత సంబంధం
  choice: అప్పుడు దేవుని వాక్యం దూషించబడదు
  alternative: దేవుని వాక్యం దూషించబడకుండా ఉండేందుకు
  rationale: గ్రీకు ἵνα సాధారణంగా ఉద్దేశాన్ని సూచించినా, ఈ సందర్భంలో ఆశించిన ఫలిత ఛాయ కూడా ఉంది. ప్రధాన పాఠం సహజమైన తెలుగును ఉపయోగిస్తుంది; పాదసూచిక మరింత ప్రత్యక్షమైన ఉద్దేశ నిర్మాణాన్ని ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఈ వచనం ముందున్న ఆజ్ఞకు కొనసాగింపుగా ఉన్నందున గుణాల జాబితాను ‘-గా’ రూపాలతో నిర్మించి చివర ‘ఉండాలి’తో పూర్తి చేశాం. ‘ఇంటి పనుల్లో నిమగ్నులుగా’ అనేది గృహశ్రమను తెలియజేస్తుంది గాని ఇంటికే నిర్బంధించబడటాన్ని సూచించదు.
