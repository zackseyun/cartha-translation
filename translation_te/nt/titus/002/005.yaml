- from: నిగ్రహం కలవారిగా, పవిత్రంగా, ఇంటి పనుల్లో నిమగ్నులుగా[a], మంచివారిగా, తమ సొంత భర్తలకు లోబడి ఉండేవారిగా[b] ఉండాలి. అప్పుడు దేవుని వాక్యం దూషించబడదు[c].
