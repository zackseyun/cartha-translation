id: TIT.2.3
reference: Titus 2:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πρεσβύτιδας ὡσαύτως ἐν καταστήματι ἱεροπρεπεῖς, μὴ διαβόλους ⸀μηδὲ οἴνῳ πολλῷ δεδουλωμένας, καλοδιδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/003.yaml
  text: Older women likewise are to be reverent in behavior[a], not slanderers nor enslaved to much wine, teachers of what is good[b],
translation:
  language: te
  text: అలాగే వృద్ధ స్త్రీలు తమ ప్రవర్తనలో పవిత్రతకు తగినవారిగా ఉండాలి; అపవాదులు చెప్పేవారిగా గానీ, ఎక్కువ ద్రాక్షారసానికి బానిసలుగా గానీ ఉండక, మంచిని బోధించేవారిగా ఉండాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρεσβύτιδας
  choice: వృద్ధ స్త్రీలు
  rationale: πρεσβῦτις వయసులో పెద్దవారైన స్త్రీలను సూచిస్తుంది; ముందటి వచనంలోని వృద్ధ పురుషులకు సమాంతరంగా ఈ వయోసూచనను స్పష్టంగా ఉంచుతుంది.
- source_word: ὡσαύτως
  choice: అలాగే
  rationale: ముందటి ఉపదేశంతో ఉన్న అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν καταστήματι ἱεροπρεπεῖς
  choice: తమ ప్రవర్తనలో పవిత్రతకు తగినవారిగా
  rationale: κατάστημα సూచించే నడవడి లేదా బాహ్య ప్రవర్తనను, ἱεροπρεπής సూచించే పవిత్రమైన దానికి తగిన గౌరవప్రద స్వభావాన్ని కలిపి వ్యక్తం చేస్తుంది.
- source_word: μὴ διαβόλους
  choice: అపవాదులు చెప్పేవారిగా గానీ
  rationale: ఇక్కడ διάβολος అపవాది అయిన వ్యక్తులను సూచిస్తుంది, అపవాదిని అనే ప్రత్యేక నామాన్ని కాదు. ఈ ఎంపిక అబద్ధమైన లేదా హానికరమైన నిందల భావాన్ని సహజంగా ఇస్తుంది.
- source_word: μηδὲ οἴνῳ πολλῷ δεδουλωμένας
  choice: మితిమీరిన ద్రాక్షారసానికి బానిసలుగా గానీ
  rationale: δεδουλωμένας లోని బానిసత్వం లేదా ఆధీనత చిత్రాన్ని నిలుపుతుంది; οἴνῳ πολλῷను కేవలం పరిమాణాత్మకమైన అసహజ పదబంధంగా కాక, అతిగా సేవించే ద్రాక్షారసం అనే సందర్భార్థంతో వ్యక్తం చేస్తుంది.
- source_word: καλοδιδασκάλους
  choice: మంచిని బోధించేవారిగా
  rationale: సమాసపదం బోధనా నైపుణ్యాన్ని కాక, బోధించే విషయము మంచిదని సూచిస్తుంది; తెలుగు క్రియాత్మక రూపం జాబితాలో సహజంగా సరిపోతుంది.
theological_decisions:
- issue: ద్రాక్షారసం ఆధిపత్యాన్ని తెలిపే δουλόω బానిసత్వ రూపకం
  choice: బానిసలుగా
  alternative: వ్యసనపరులుగా
  rationale: గ్రీకు పరిపూర్ణ కర్మణి కృదంతం ద్రాక్షారసం చేత ఆధీనపరచబడిన స్థితిని బలంగా చిత్రిస్తుంది. 'వ్యసనపరులు' సందర్భార్థాన్ని ఇస్తున్నా, మూలంలోని బానిసత్వ రూపకాన్ని కోల్పోతుంది; అందువల్ల దానిని నిలిపాం.
- issue: ἱεροπρεπεῖς లోని పవిత్రతకు తగిన నడవడి
  choice: పవిత్రతకు తగినవారిగా
  alternative: భక్తిపూర్వకంగా
  rationale: ఈ పదం కేవలం అంతరంగ భక్తిని కాక, పవిత్రమైన దానికి సముచితమైన బాహ్య నడవడిని సూచిస్తుంది. ఎంపిక ఆ నైతిక ఉద్వేగాన్ని అతి వివరణ లేకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన వాక్యనిర్మాణం. గ్రీకు వాక్యంలోని సమాంతర నిషేధాలను 'గానీ ... గానీ'తో, చివరి సానుకూల లక్షణాన్ని స్పష్టమైన క్రియాత్మక రూపంతో అందించాం. ఈ ముసాయిదాలో పాదటిప్పణులు అవసరం కాలేదు.
