source:
  edition: SBLGNT
  text: μὴ νοσφιζομένους, ἀλλὰ ⸂πᾶσαν πίστιν⸃ ἐνδεικνυμένους ἀγαθήν, ἵνα τὴν διδασκαλίαν ⸀τὴν τοῦ σωτῆρος ἡμῶν θεοῦ κοσμῶσιν ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/010.yaml
  text: not pilfering[a], but showing all good faith, so that in everything they may adorn the teaching of God our Savior.
translation:
  language: te
  text: దొంగిలించకుండా, అన్ని విధాలా మంచి విశ్వసనీయతను[a] చూపించాలి, తద్వారా వారు అన్ని విషయాల్లో మన రక్షకుడైన దేవుని బోధకు శోభ చేకూర్చుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థానికి దగ్గరగా, “మంచి విశ్వాసమంతటినీ చూపిస్తూ”; ఇక్కడ గ్రీకు పదం ప్రవర్తనలోని నమ్మకత్వం, విశ్వసనీయత అనే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: νοσφιζομένους
  choice: దొంగిలించకుండా
  rationale: ఇతరులకు చెందినదాన్ని తమ కోసం తీసుకోవడం లేదా దాచుకోవడం అనే భావాన్ని ఈ సందర్భంలో సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: πᾶσαν πίστιν ἐνδεικνυμένους ἀγαθήν
  choice: తాము పూర్తిగా నమ్మదగినవారమని చూపించాలి
  rationale: ఈ యజమాని–దాసుల సందర్భంలో πίστις విశ్వాస సిద్ధాంతం కంటే ప్రవర్తనలోని నమ్మకత్వం లేదా విశ్వసనీయతను సూచిస్తుంది. πᾶσαν మరియు ἀγαθήν కలిపి తెలిపే సంపూర్ణమైన, మంచి నమ్మకత్వాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κοσμῶσιν
  choice: శోభ కలిగిస్తారు
  rationale: అలంకరించడం లేదా అందంగా చేయడం అనే గ్రీకు రూపకాన్ని తెలుగులో అర్థమయ్యే విధంగా నిలుపుతుంది.
- source_word: διδασκαλίαν
  choice: బోధ
  rationale: ‘సిద్ధాంతం’ కంటే సాధారణ పాఠకులకు సహజంగా ఉండి, διδασκαλία యొక్క అర్థాన్ని కచ్చితంగా తెలియజేస్తుంది.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: మన రక్షకుడైన దేవుని
  rationale: ఈ వాక్యంలో ఉన్న బిరుదును నేరుగా నిలుపుతూ, పాఠంలో స్పష్టంగా లేని మరొక క్రీస్తుసంబంధ నిర్ధారణను చేర్చదు.
- source_word: ἐν πᾶσιν
  choice: అన్ని విషయాల్లో
  rationale: వారి ప్రవర్తన అంతటినీ సూచించే విస్తృత పరిధిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: నైతిక సందర్భంలో πίστις అనువాదం
  choice: ప్రధాన పాఠంలో ‘పూర్తిగా నమ్మదగినవారు’
  alternative: ‘పూర్తి నమ్మకత్వం’ లేదా అక్షరార్థానికి దగ్గరగా ‘మంచి విశ్వాసమంతా’
  rationale: యజమానుల పట్ల నిజాయితీ, విశ్వసనీయత ఇక్కడ ప్రధాన భావం. అయినా πίστις అనే పదానికి ‘విశ్వాసం’ అనే విస్తృత భావం ఉండటాన్ని పాదసూచికలో భద్రపరచాం.
- issue: ‘మన రక్షకుడైన దేవుడు’ అనే పదబంధం ఎవరిని సూచిస్తుంది
  choice: వాక్యంలో ఉన్నట్లే దేవునికి వర్తించే బిరుదుగా అనువదించడం
  alternative: పాస్టరల్ పత్రికల విస్తృత సందర్భంలో ‘రక్షకుడు’ అనే బిరుదు క్రీస్తుకూ వర్తిస్తుందని గ్రహించడం
  rationale: ఈ వాక్యం స్పష్టంగా చెప్పిన దానిని మాత్రమే ప్రధాన పాఠంలో ఉంచి, దాని కంటే ఎక్కువ క్రీస్తుసంబంధ వివరణను అనువాదంలోకి దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. ముందు వచనంలోని ఆజ్ఞాత్మక నిర్మాణం కొనసాగుతున్నందున ‘చూపించాలి’ అని ఇచ్చాం; ἵνα తెలిపే ఉద్దేశం/ఫలితాన్ని సహజంగా ‘అప్పుడు’ అనే అనుసంధానంతో వ్యక్తం చేశాం.
