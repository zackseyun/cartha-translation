id: TIT.2.15
reference: Titus 2:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ταῦτα λάλει καὶ παρακάλει καὶ ἔλεγχε μετὰ πάσης ἐπιταγῆς· μηδείς σου περιφρονείτω.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/015.yaml
  text: Speak these things[a], and exhort and rebuke with all authority. Let no one disregard you.
translation:
  language: te
  text: ఈ సంగతులను చెప్పు, ప్రోత్సహించు, గద్దించు—ఇవన్నీ సంపూర్ణ అధికారంతో చేయు. ఎవరూ నిన్ను చిన్నచూపు చూడకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎవరూ నిన్ను నిర్లక్ష్యం చేయకూడదు’; ‘ఎవరూ నిన్ను తృణీకరించకూడదు.’
    reason: περιφρονέω అనే పదానికి ఎవరినైనా తక్కువగా ఎంచడం, నిర్లక్ష్యం చేయడం, లేదా తృణీకరించడం అనే సంబంధిత భావాలు ఉన్నాయి.
lexical_decisions:
- source_word: Ταῦτα
  choice: ఈ సంగతులు
  rationale: ముందున్న అధ్యాయంలోని ఉపదేశాలన్నిటినీ సూచించే నపుంసక బహువచన సర్వనామం. విషయాన్ని అనవసరంగా కుదించకుండా విస్తృత సూచనను నిలుపుతుంది.
- source_word: λάλει
  choice: బోధిస్తూ
  rationale: అక్షరార్థంగా ‘మాట్లాడు/చెప్పు’ అయినా, ఈ పాస్టరల్ సందర్భంలో ముందున్న సంగతులను నిరంతరం తెలియజేయడాన్ని సూచిస్తుంది. తెలుగులో ‘ఈ సంగతులు మాట్లాడు’ సహజంగా లేకపోవడంతో ‘బోధిస్తూ’ సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παρακάλει
  choice: ప్రోత్సహించు
  rationale: ఈ క్రియకు ప్రోత్సహించు, బతిమాలు, పురికొల్పు అనే అర్థపరిధి ఉంది. ఇక్కడ నైతికంగా కార్యానికి పురికొల్పే భావాన్ని, గద్దింపుతో ఉన్న సమతుల్యతను ‘ప్రోత్సహించు’ తెలియజేస్తుంది.
- source_word: ἔλεγχε
  choice: గద్దించు
  rationale: తప్పును బయటపెట్టి సరిదిద్దే ఉద్దేశంతో మందలించడాన్ని సూచిస్తుంది. ‘గద్దించు’ ఆజ్ఞాత్మక పాస్టరల్ సందర్భంలోని బలాన్ని నిలుపుతుంది.
- source_word: μετὰ πάσης ἐπιταγῆς
  choice: సంపూర్ణ అధికారంతో
  rationale: ἐπιταγή ఆజ్ఞ లేదా అధికారాన్ని సూచించగలదు; πάσης దాని సంపూర్ణతను బలపరుస్తుంది. ఈ మాటలు కేవలం ఆజ్ఞాపూర్వక స్వరాన్ని కాక, ఈ కార్యాల నిర్వహణలోని పూర్తి అధికారబలాన్ని తెలియజేస్తాయి.
- source_word: μηδείς
  choice: ఎవరూ
  rationale: నిషేధ వాక్యంలోని అనిర్దిష్ట ప్రతికూల కర్తకు సహజమైన తెలుగు సమానం.
- source_word: σου
  choice: నిన్ను
  rationale: περιφρονείτωతో కలిసి తీతునే చిన్నచూపు చూడకూడదని సూచిస్తుంది; తెలుగులో కర్మరూపం సహజంగా ఉంటుంది.
- source_word: περιφρονείτω
  choice: చిన్నచూపు చూడనివ్వకు
  rationale: ఎవరినైనా తక్కువగా ఎంచడం, నిర్లక్ష్యం చేయడం, ధిక్కరించడం అనే అర్థపరిధిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. గ్రీకు తృతీయ పురుష ఆజ్ఞార్థక నిషేధాన్ని తెలుగు ప్రయోగంలో స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: μετὰ πάσης ἐπιταγῆςలో తీతు పరిచర్యాధికారం
  choice: బోధించడం, ప్రోత్సహించడం, గద్దించడం అనే కార్యాలను తీతు సంపూర్ణ అధికారంతో చేయాలి.
  alternative: ఇది కేవలం ఆజ్ఞాపూర్వక స్వరాన్ని సూచిస్తుంది; లేదా అధికారం సందేశానికే చెందుతుంది, తీతు పాత్రకు కాదు.
  rationale: ఈ పదబంధం సమీప ఆజ్ఞలను సహజంగా విశేషిస్తూ, వాటిని పూర్తి అధికారబలంతో నిర్వహించాలని చెబుతుంది. అయితే ఈ అధికారాన్ని స్వతంత్ర వ్యక్తిగత అధికారంగా అనువాదం విస్తరించదు; సందర్భంలో అది అప్పగించబడిన పరిచర్యాధికారంగా నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే పాస్టరల్ ఆజ్ఞల గంభీరతను నిలుపుతూ రూపొందించబడింది. మూడు క్రియల క్రమం మరియు ఆజ్ఞాత్మక బలం కాపాడబడ్డాయి.
