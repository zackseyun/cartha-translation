id: TIT.2.9
reference: Titus 2:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Δούλους ἰδίοις δεσπόταις ὑποτάσσεσθαι ἐν πᾶσιν, εὐαρέστους εἶναι, μὴ ἀντιλέγοντας,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/009.yaml
  text: Servants are to submit to their own masters in everything[a], to be pleasing, not argumentative[b],
translation:
  language: te
  text: బానిసలు[a] అన్ని విషయాల్లో తమ యజమానులకు లోబడి ఉండాలి; వారికి నచ్చేలా ఉండాలి; ఎదురు మాట్లాడకూడదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సేవకులు’ లేదా ‘బంధిత సేవకులు’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం doulous సేవలో ఉన్నవారిని సూచించగలదు; అయితే ఇక్కడ బంధిత స్థితి ఉద్దేశించబడినట్లు కనిపిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘వాదించకూడదు,’ ‘వ్యతిరేకంగా మాట్లాడకూడదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Δούλους
  choice: బానిసలు
  rationale: δοῦλος అనే పదం సేవకులను లేదా బానిసలను సూచించగలదు. అయితే ఇక్కడ δεσπόταις (‘యజమానులు’) కింద ఉన్న బంధిత సామాజిక స్థితి ప్రధానంగా కనిపిస్తున్నందున ‘బానిసలు’ మూలపాఠంలోని కఠిన వాస్తవాన్ని మృదువుచేయకుండా తెలియజేస్తుంది.
- source_word: ἰδίοις δεσπόταις
  choice: తమ యజమానులకు
  rationale: δεσπότης యాజమాన్యంతో కూడిన అధికారాన్ని సూచిస్తుంది; ఈ గృహసంబంధ సందర్భంలో ‘యజమానులు’ సహజమైన తెలుగు పదం. ‘తమ’ అనే పదం ἰδίοις లోని స్వకీయ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: ὑποτάσσεσθαι
  choice: లోబడి ఉండాలి
  rationale: ఈ వర్తమాన మధ్యమ/కర్మణి క్రియారూపం అధికార క్రమానికి స్వయంగా లోబడే నిరంతర వైఖరిని సూచిస్తుంది. ‘లోబడి ఉండాలి’ ఆ ఆదేశాత్మక భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ἐν πᾶσιν
  choice: అన్ని విషయాల్లో
  rationale: ఈ సమగ్ర పదబంధం లోబడవలసిన పరిధిని విస్తృతంగా సూచిస్తుంది. ‘అన్ని విషయాల్లో’ మూలంలోని విస్తృతతను అలాగే ఉంచుతుంది.
- source_word: εὐαρέστους εἶναι
  choice: వారికి నచ్చేలా ఉండాలి
  rationale: εὐάρεστος అంటే ప్రీతికరంగా లేదా ఆమోదయోగ్యంగా ఉండడం. సందర్భంలో యజమానులకు నచ్చే ప్రవర్తన ఉద్దేశించబడింది; ఈ అనువాదం సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: μὴ ἀντιλέγοντας
  choice: ఎదురు మాట్లాడకూడదు
  rationale: ἀντιλέγω అంటే ఎదురు పలకడం, విభేదిస్తూ మాట్లాడడం లేదా ఖండించడం. ఈ సామాజిక సందర్భంలో మాటతో ఎదురుతిరగకపోవడమే ప్రధాన భావం; ‘ఎదురు మాట్లాడకూడదు’ దానిని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: గృహనియమాల సందర్భంలో δοῦλος అనువాదం
  choice: బానిసలు
  alternative: సేవకులు; బంధిత సేవకులు
  rationale: ఈ వాక్యం δεσπόταις కింద వాస్తవంగా బంధిత స్థితిలో ఉన్నవారిని ఉద్దేశిస్తుంది. కాబట్టి ‘సేవకులు’ అని మృదువుచేయకుండా ‘బానిసలు’ అని అనువదించడం చారిత్రక సామాజిక వాస్తవాన్ని నిలుపుతుంది; ఇది బానిసత్వ వ్యవస్థను సమర్థిస్తున్నట్లు మాత్రం భావించరాదు.
- issue: ἐν πᾶσιν యొక్క విస్తృత ఆదేశం
  choice: అన్ని విషయాల్లో
  alternative: ప్రతి విషయంలో; అన్ని విధాలా
  rationale: మూలపాఠంలోని విస్తృత భాషను పరిమితం చేయకుండా ఉంచాం. ఈ ఒక్క వాక్యంలో చెప్పని నైతిక మినహాయింపులను అనువాదంలో చేర్చలేదు; తద్వారా పాఠంలోని ఉద్రిక్తతను అలాగే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని వాడాం. మూలంలోని వరుస క్రియాభావాలను తెలుగులో స్పష్టమైన విధ్యర్థక వాక్యాలుగా ఇచ్చాం. ‘బానిసలు’ అనే కఠిన పదాన్ని చారిత్రక స్థితిని దాచకుండా ఉంచి, ప్రత్యామ్నాయ అర్థాలను పాదసూచికలో తెలిపాం.
