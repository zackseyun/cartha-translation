id: TIT.2.14
reference: Titus 2:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς ἔδωκεν ἑαυτὸν ὑπὲρ ἡμῶν ἵνα λυτρώσηται ἡμᾶς ἀπὸ πάσης ἀνομίας καὶ καθαρίσῃ ἑαυτῷ λαὸν περιούσιον, ζηλωτὴν καλῶν ἔργων.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/014.yaml
  text: who gave himself for us[a], so that he might redeem us from all lawlessness and purify for himself a people for his own possession, zealous for good works.
translation:
  language: te
  text: ఆయన మన కోసం తనను తాను అర్పించుకున్నాడు; సమస్త అధర్మం నుండి మనలను విమోచించి, మంచి పనుల పట్ల ఉత్సాహం గల తనకు ప్రత్యేకంగా చెందిన ప్రజలను తన కొరకు శుద్ధిపరచడానికి ఆయన అలా చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన అమూల్యమైన ప్రజలను’ లేక ‘తన ప్రత్యేక ప్రజలను.’ గ్రీకు పదబంధం ఆయనకు ప్రత్యేకంగా చెందిన నిబంధన ప్రజలు అనే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν ἑαυτὸν
  choice: తనను తాను అర్పించుకున్నాడు
  rationale: స్వచ్ఛందమైన స్వీయ సమర్పణను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; గ్రీకు ఆత్మార్థక బలాన్ని నిలుపుతుంది.
- source_word: ὑπὲρ ἡμῶν
  choice: మన కోసం
  rationale: ప్రయోజనార్థక భావాన్ని స్పష్టంగా తెలియజేస్తూ, ప్రతినిధిత్వం లేదా స్థానాపన్నత అనే ఒక్క ప్రాయశ్చిత్త నమూనాకు భావాన్ని పరిమితం చేయదు.
- source_word: ἵνα λυτρώσηται
  choice: విమోచించి
  rationale: వెల చెల్లించి విడిపించడం లేదా బంధం నుండి విడుదల చేయడం అనే λυτρόομαι భావాన్ని, ధార్మిక ప్రతిధ్వనితో సహా, సులభమైన తెలుగులో అందిస్తుంది.
- source_word: ἀπὸ πάσης ἀνομίας
  choice: సమస్త ధర్మవిరోధం నుండి
  rationale: ἀνομίαలోని నియమం లేదా ధర్మానికి విరుద్ధత అనే నిర్దిష్ట భావాన్ని ‘దుష్టత్వం’ వంటి విస్తృత పదం కంటే మెరుగుగా కాపాడుతుంది.
- source_word: καθαρίσῃ
  choice: పవిత్రపరచుకోవడానికి
  rationale: καθαρίζω యొక్క శుద్ధిచేయడం అనే భావాన్ని నైతిక-నిబంధనాత్మక సందర్భంలో సహజంగా తెలియజేస్తుంది; తెలుగులో ‘శుద్ధపరచు’ కూడా సాధ్యమే.
- source_word: ἑαυτῷ
  choice: తన సొంత
  rationale: ప్రజలు ఆయనకే ప్రత్యేకంగా చెందుతారనే స్వాధీన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: λαὸν περιούσιον
  choice: తన సొంత ప్రజలు
  rationale: ప్రత్యేకంగా ఆయనకు చెందిన ప్రజలు అనే నిబంధనాత్మక స్వాధీన భావాన్ని కాపాడుతుంది; పాదసూచికలో ‘అమూల్యమైన ప్రజలు’ అనే ప్రత్యామ్నాయం ఇవ్వబడింది.
- source_word: ζηλωτὴν καλῶν ἔργων
  choice: మంచి పనులు చేయడంలో ఆసక్తిగల
  rationale: మంచి క్రియల పట్ల ఉత్సాహభరితమైన నిబద్ధతను సాధారణ ఆధునిక తెలుగు పాఠకులకు సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: క్రీస్తు స్వీయ సమర్పణలో ὑπὲρ ἡμῶν భావం
  choice: మన కోసం
  alternative: మన పక్షంగా; మన స్థానంలో
  rationale: గ్రీకు ప్రయోజనార్థక భావాన్నీ, సందర్భానుసారంగా ఉండగల స్థానాపన్న భావాన్నీ మోయగలదు. ఈ వచనం ఒక్కటే స్పష్టంగా నిర్దేశించని ఒక నిర్దిష్ట ప్రాయశ్చిత్త సిద్ధాంతానికి అనువాదాన్ని పరిమితం చేయలేదు.
- issue: λαὸν περιούσιονలోని నిబంధనాత్మక భావం
  choice: తన సొంత ప్రజలు
  alternative: తన అమూల్యమైన ప్రజలు; ప్రత్యేకమైన ప్రజలు
  rationale: దేవునికి ప్రత్యేకంగా చెందిన ప్రజలు అనే పాత నిబంధన ప్రతిధ్వనిని సహజమైన తెలుగులో నిలుపుతుంది; ‘ప్రత్యేకమైన’ కంటే స్వాధీన భావాన్ని స్పష్టంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్య నిర్మాణం. పొడవైన గ్రీకు ఉద్దేశ్య ఉపవాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; ఉద్దేశ్య సంబంధాన్ని ‘కే’ ద్వారా నిలిపాం.
