    text: లేదా, ‘తన అమూల్యమైన ప్రజలను’ లేక ‘తన ప్రత్యేక ప్రజలను.’ గ్రీకు పదబంధం ఆయనకు ప్రత్యేకంగా చెందిన నిబంధన ప్రజలు అనే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
