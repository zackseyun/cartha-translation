source:
  edition: SBLGNT
  text: προσδεχόμενοι τὴν μακαρίαν ἐλπίδα καὶ ἐπιφάνειαν τῆς δόξης τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/013.yaml
  text: as we await the blessed hope and the appearing of the glory of our great God and Savior[a], Jesus the Messiah,
translation:
  language: te
  text: ఆ ధన్యమైన నిరీక్షణను, మన గొప్ప దేవుడూ రక్షకుడూ అయిన యేసు మెస్సీయ మహిమ ప్రత్యక్షమవడాన్ని ఎదురుచూస్తూ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσδεχόμενοι
  choice: ఎదురుచూస్తూ
  rationale: కొనసాగుతున్న, ఆసక్తితో కూడిన నిరీక్షణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఇది సందర్భంలోని ముందరి వాక్యంతో అనుసంధానమయ్యే అసమాపక క్రియారూపాన్ని కూడా నిలుపుతుంది.
- source_word: μακαρίαν ἐλπίδα
  choice: ధన్యమైన నిరీక్షణను
  rationale: ‘ధన్యమైన’ అనే పదం ఆధ్యాత్మిక, అంత్యకాల సందర్భానికి తగిన గౌరవభరితమైన అర్థాన్ని ఇస్తుంది; ‘నిరీక్షణ’ ఇక్కడ కేవలం కోరికను కాక, నిశ్చయంతో ఎదురుచూసే భవిష్యత్ వాస్తవాన్ని సూచిస్తుంది.
- source_word: ἐπιφάνειαν
  choice: ప్రత్యక్షమవడాన్ని
  rationale: కనిపించే విధంగా వెల్లడికావడం అనే అంత్యకాల భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; సాంకేతిక పదమైన ‘ఎపిఫనీ’ని నివారిస్తుంది.
- source_word: δόξης
  choice: మహిమ
  rationale: మూలంలోని సాధారణ ధార్మిక భావాన్ని నేరుగా నిలుపుతుంది. ‘మహిమ ప్రత్యక్షమవడం’ అనే నిర్మాణం τὴν ... ἐπιφάνειαν τῆς δόξης భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν
  choice: మన గొప్ప దేవుడూ రక్షకుడూ
  rationale: ఒకే ఉపపదం కింద ఉన్న రెండు ఏకవచన వ్యక్తివాచక నామాలను ఒకే వ్యక్తికి చెందిన సమన్విత బిరుదులుగా సహజంగా చదివే గ్రీకు నిర్మాణాన్ని నిలుపుతుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστόςను కేవలం సంప్రదాయ లిప్యంతరీకరణగా కాక, అభిషిక్తుడైన ‘మెస్సీయ’ అనే బిరుదుగా అనువదిస్తుంది.
theological_decisions:
- issue: ‘మన గొప్ప దేవుడూ రక్షకుడూ, యేసు మెస్సీయ’ అన్నది ఒకే వ్యక్తిని సూచిస్తుందా, లేక తండ్రి దేవుడు మరియు యేసు అనే ఇద్దరిని సూచిస్తుందా?
  choice: ‘దేవుడు’, ‘రక్షకుడు’ అనే రెండు బిరుదులూ యేసు మెస్సీయ అనే ఒకే వ్యక్తిని సూచించేలా ప్రధాన పాఠం రూపొందించబడింది.
  alternative: ‘గొప్ప దేవుడు’ మరియు ‘మన రక్షకుడైన యేసు మెస్సీయ’ అనే ఇద్దరు వేర్వేరు వ్యక్తులను సూచించే పఠనం.
  rationale: గ్రీకులో ఒకే నిర్దేశక ఉపపదం రెండు ఏకవచన వ్యక్తివాచక నామాలను నియంత్రిస్తుంది; వెంటనే ‘యేసు మెస్సీయ’ అనే పేరు వస్తుంది. అందువల్ల ఒకే వ్యక్తిని సూచించే పఠనం అత్యంత సహజమైనది. అయినప్పటికీ, సాధ్యమైన రెండవ పఠనాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్యంలోని అంత్యకాల మరియు క్రీస్తు సంబంధిత గంభీరతను నిలుపుతూ గౌరవభరితమైన శైలి వాడబడింది. ఈ వచనం ముందరి వాక్యాన్ని కొనసాగిస్తుందనే సంగతిని ‘ఎదురుచూస్తూ’ అనే రూపం చూపిస్తుంది.
