reference: 2 Thessalonians 3:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ κύριος κατευθύναι ὑμῶν τὰς καρδίας εἰς τὴν ἀγάπην τοῦ θεοῦ καὶ εἰς τὴν ὑπομονὴν τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/005.yaml
  text: May the Lord direct your hearts into the love of God and into the steadfastness of Messiah[a][b][c].
translation:
  language: te
  text: ప్రభువు మీ హృదయాలను దేవుని ప్రేమవైపుకు[a], మెస్సీయ ఓర్పువైపుకు[b][c] నడిపించుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేవునిపట్ల ప్రేమవైపుకు.’ గ్రీకు పదబంధానికి ‘దేవుడు చూపే ప్రేమవైపుకు’ అనే అర్థం కూడా ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘మెస్సీయ చూపిన ఓర్పువైపుకు,’ లేదా ‘మెస్సీయ కొరకు ఓర్పుతో నిలిచేలా.’
    reason: alternative_reading
  - marker: c
    text: గ్రీకులో ‘క్రీస్తు’; ఇక్కడ అది బిరుదుగా ఉన్నందున ‘మెస్సీయ’ అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: ప్రభువు
  rationale: దైవిక లేదా క్రీస్తుసంబంధ బిరుదుగా ఉన్న κύριος యొక్క ప్రామాణిక తెలుగు అనువాదం; మూలపాఠం పేర్కొనని నిర్దిష్ట సూచ్యాన్ని ఇది అదనంగా నిర్ణయించదు.
- source_word: κατευθύναι
  choice: నడిపించుగాక
  rationale: ఈ క్రియలోని ప్రార్థనాత్మక ఆకాంక్షను ‘-గాక’ రూపం సహజంగా వ్యక్తం చేస్తుంది; హృదయాలను ఒక లక్ష్యం వైపు నేరుగా నడిపించే భావాన్నీ నిలుపుతుంది.
- source_word: καρδίας
  choice: హృదయాలను
  rationale: ఆలోచన, సంకల్పం, అనురాగం కలిగిన అంతరంగ కేంద్రానికి సంబంధించిన మూలరూపకాన్ని నిలుపుతుంది.
- source_word: ἀγάπην
  choice: ప్రేమ
  rationale: ἀγάπηకి సరళమైన, ప్రస్తుత ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: ‘దేవుని ప్రేమ’ అనే నిర్మాణం మూలంలోని సంబంధార్థక రూపాన్ని దగ్గరగా అనుసరిస్తుంది; ప్రేమ దేవునిదా లేక దేవునిపట్లదా అనే అవకాశాలను పాదటిప్పణిలో ఉంచుతుంది.
- source_word: ὑπομονὴν
  choice: దృఢసహనం
  rationale: ఒత్తిడి లేదా కష్టంలో నిలకడగా సహించే భావాన్ని ‘సహనం’ కంటే స్పష్టంగా తెలియజేస్తూ, వ్యక్తిత్వగుణాన్ని సూచిస్తుంది.
- source_word: τοῦ Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తున్నందున దాని అర్థాన్ని తెలిపే ‘మెస్సీయ’ను వాడాం; సంబంధార్థక విభక్తిలోని భిన్న అవకాశాలను పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: τὴν ἀγάπην τοῦ θεοῦ లోని సంబంధార్థక విభక్తి సందిగ్ధత
  choice: దేవుని ప్రేమ
  alternative: దేవునిపట్ల ప్రేమ; దేవుడు చూపే ప్రేమ
  rationale: మూలంలోని సంబంధార్థకం కర్తృార్థకంగా, కర్మార్థకంగా, లేదా దైవిక ప్రేమ పరిధిని సూచించేలా అర్థమవవచ్చు. ప్రధాన పాఠం దాన్ని సిద్ధాంతపరంగా ఒకే విధంగా నిర్ణయించదు; పాదటిప్పణి అవకాశాలను వివరిస్తుంది.
- issue: τὴν ὑπομονὴν τοῦ Χριστοῦ లోని సంబంధార్థక విభక్తి సందిగ్ధత
  choice: మెస్సీయ దృఢసహనం
  alternative: మెస్సీయ చూపిన దృఢసహనం; మెస్సీయ కోసం దృఢంగా సహించడం; మెస్సీయను ఎదురుచూస్తూ దృఢంగా సహించడం
  rationale: ఈ పదబంధం మెస్సీయ స్వయంగా చూపిన సహనాన్నీ, ఆయనపట్ల లేదా ఆయనకొరకు చూపే సహనాన్నీ సూచించవచ్చు. ప్రధాన పాఠం మూలనిర్మాణాన్ని అనుసరిస్తూ, ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇస్తుంది.
- issue: Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: Χριστός ఇక్కడ పేరులా మాత్రమే కాక బిరుదుగా పనిచేస్తుంది; ‘మెస్సీయ’ దాని బిరుదార్థాన్ని పాఠకునికి నేరుగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రార్థనాత్మక, గౌరవప్రద శైలిని వాడాం. ‘నడిపించుగాక’ మూలంలోని ఆకాంక్షార్థాన్ని సహజంగా ఇస్తుంది. ‘ప్రేమవైపుకు,’ ‘దృఢసహనం వైపుకు’ అనే సమాంతర నిర్మాణం εἰς ... καὶ εἰς ... ను ప్రతిబింబిస్తుంది. మూలంలో లేని ‘ఇప్పుడు’ వంటి సంధాన పదాన్ని చేర్చలేదు.
