id: 2TH.3.16
reference: 2 Thessalonians 3:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος τῆς εἰρήνης δῴη ὑμῖν τὴν εἰρήνην διὰ παντὸς ἐν παντὶ τρόπῳ. ὁ κύριος μετὰ πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/016.yaml
  text: May the Lord of peace himself give you peace at all times in every way[b][a]. The Lord be with all of you.
translation:
  language: te
  text: సమాధాన ప్రభువు తానే మీకు ఎల్లప్పుడూ[a] ప్రతి విధంగానూ[b] సమాధానాన్ని అనుగ్రహించుగాక. ప్రభువు మీ అందరితో ఉండుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిరంతరం.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ప్రతి రీతిలోనూ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: ప్రభువైనవాడే
  rationale: αὐτός యొక్క గాఢతను తెలుగు సహజ ప్రయోగంలో ‘-ఏ’ ద్వారా వ్యక్తం చేసి, సమాధానం ఇచ్చేది ప్రభువే అని నొక్కిచెప్పింది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకత కాక, ముగింపు ఆశీర్వాదానికి స్వల్ప మార్పును సూచిస్తుంది; తెలుగులో ప్రత్యేక సంధానపదం చేర్చకుండా వాక్యప్రవాహం సహజంగా ఉంటుంది.
- source_word: ὁ κύριος τῆς εἰρήνης
  choice: సమాధానానికి ప్రభువైనవాడు
  rationale: గ్రీకు సంబంధార్థక నిర్మాణాన్ని సాధ్యమైనంత దగ్గరగా ఉంచుతూ, ఆధునిక తెలుగులో సహజంగా వినిపించేలా చేసింది; ‘సమాధానాన్ని ఇచ్చే ప్రభువు’ అని వివరణాత్మకంగా విస్తరించలేదు.
- source_word: δῴη
  choice: అనుగ్రహించుగాక
  rationale: ఆశీర్వాదం/ప్రార్థనగా ఉన్న optative భావాన్ని తెలుగు ఆశీర్వచన రూపం స్పష్టంగా వ్యక్తం చేస్తుంది; ‘ఇవ్వుగాక’ కంటే సందర్భానికి తగిన గౌరవభావం కలిగివుంది.
- source_word: τὴν εἰρήνην
  choice: సమాధానం
  rationale: εἰρήνη యొక్క ప్రాథమిక భావాన్ని మతపరమైన అదనపు వివరణ లేకుండా సహజ తెలుగులో అందిస్తుంది.
- source_word: διὰ παντὸς
  choice: ఎల్లప్పుడూ
  rationale: కాలవ్యాప్తి, నిరంతరత్వం రెండింటినీ సంక్షిప్తంగా తెలిపే సహజ తెలుగు పదం.
- source_word: ἐν παντὶ τρόπῳ
  choice: ప్రతి విధంగానూ
  rationale: τρόπος యొక్క విధం/రీతి భావాన్ని విస్తృతంగానే ఉంచి, ‘ప్రతి సాధనం ద్వారా’ అనే కారణార్థక వ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: μετὰ πάντων ὑμῶν
  choice: మీ అందరితో
  rationale: πάντων యొక్క సమగ్రతను స్పష్టంగా, సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
theological_decisions:
- issue: ఆశీర్వాదంలోని ‘ప్రభువు’ ఎవరిని సూచిస్తున్నాడు
  choice: పాఠ్యంలో ఉన్నట్లే ‘ప్రభువు’ అని మాత్రమే ఉంచడం
  alternative: ‘ప్రభువైన యేసు’ అని స్పష్టీకరించడం లేదా సాధారణంగా దేవునిని సూచిస్తున్నట్లు విస్తరించడం
  rationale: గ్రీకు పాఠ్యం ὁ κύριος అని మాత్రమే చెబుతుంది. సందర్భంలో ప్రభువైన యేసును సూచించే అవకాశం బలంగా ఉన్నా, మూలపాఠ్యం చెప్పినదానికంటే అనువాదం ఎక్కువగా నిర్దిష్టం చేయకూడదు.
- issue: చివరి క్రియారహిత వాక్యభాగం యొక్క భావం
  choice: ‘ప్రభువు మీ అందరితో ఉండుగాక’ అనే ఆశీర్వచనంగా అనువదించడం
  alternative: ‘ప్రభువు మీ అందరితో ఉన్నాడు’ అనే సూచనార్థక ప్రకటన
  rationale: గ్రీకులో క్రియ స్పష్టంగా లేకపోయినా, సందర్భంలో ఇది ప్రకటన కాక ముగింపు ఆశీర్వాదం; అందువల్ల తెలుగు ఆశీర్వచన రూపం తగినది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఆశీర్వచన శైలి వాడబడింది. రెండు పాదాల్లోనూ ‘ఉండుగాక/అనుగ్రహించుగాక’ రూపాలు ప్రార్థనాత్మక స్వరాన్ని నిలుపుతాయి. ప్రధాన పాఠ్యంలో ప్రతి పాదటిప్పణి సూచిక [a], [b] చేర్చబడింది.
