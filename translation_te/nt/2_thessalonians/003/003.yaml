id: 2TH.3.3
reference: 2 Thessalonians 3:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πιστὸς δέ ἐστιν ὁ κύριος, ὃς στηρίξει ὑμᾶς καὶ φυλάξει ἀπὸ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/003.yaml
  text: But the Lord is faithful[a], who will strengthen you and guard you from the evil one.
translation:
  language: te
  text: అయితే ప్రభువు నమ్మదగినవాడు. ఆయన మిమ్మల్ని బలపరుస్తాడు, దుష్టుని నుండి[a] కాపాడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “చెడు నుండి.” గ్రీకులోని τοῦ πονηροῦ అనే పదబంధాన్ని పుంలింగంగా “దుష్టుని” అనీ, నపుంసకలింగంగా “చెడు” అనీ అర్థం చేసుకోవచ్చు.'
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: నమ్మదగినవాడు
  rationale: ప్రభువు విశ్వసనీయుడని, ఆయనపై ఆధారపడవచ్చని తెలిపే సహజమైన ఆధునిక తెలుగు పదప్రయోగం; ముందున్న వాక్యంలో మనుషులకు విశ్వాసం లేకపోవడంతో ఉన్న వ్యత్యాసాన్నీ స్పష్టంగా ఉంచుతుంది.
- source_word: δέ
  choice: అయితే
  rationale: ముందటి వాక్యంలో అందరికీ విశ్వాసం లేదన్న మాటకు విరుద్ధంగా ప్రభువు నమ్మదగినవాడని చూపే వ్యతిరేక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ κύριος
  choice: ప్రభువు
  rationale: κύριος అనే బిరుదును సాధారణ బైబిలు తెలుగు వాడుకలో నిలుపుతుంది; ఇక్కడ ఎవరిని సూచిస్తుందో అనవసరంగా మరింత నిర్దిష్టం చేయదు.
- source_word: στηρίξει
  choice: బలపరచి
  rationale: స్థిరపరచడం, దృఢపరచడం అనే భావాన్ని సందర్భానుకూలమైన సహజ తెలుగులో తెలియజేస్తుంది; తదుపరి కాపాడే కార్యంతో సులభంగా అనుసంధానమవుతుంది.
- source_word: φυλάξει
  choice: కాపాడతాడు
  rationale: కాపలా కాయడం, సంరక్షించడం అనే క్రియాశీల రక్షణ భావాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: ἀπὸ
  choice: నుండి
  rationale: తదుపరి చెప్పబడిన ప్రమాదం నుంచి రక్షణ అనే మూల భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: τοῦ πονηροῦ
  choice: దుష్టుని
  rationale: వ్యక్తిని సూచించే పుంలింగ పఠనాన్ని ప్రధాన పాఠ్యంలో ఉంచుతుంది; గ్రీకు రూపానికి సాధ్యమైన నపుంసకలింగ ‘చెడు’ పఠనాన్ని పాదసూచికలో భద్రపరుస్తుంది.
theological_decisions:
- issue: τοῦ πονηροῦ అనే పదబంధం ఎవరిని లేదా దేనిని సూచిస్తుంది
  choice: దుష్టుని
  alternative: చెడు నుండి
  rationale: గ్రీకు రూపం పుంలింగంగా ‘దుష్టుడు’ అనీ, నపుంసకలింగంగా ‘చెడు’ అనీ అర్థమవగలదు. కొత్త నిబంధన వాడుకలో సహజమైన వ్యక్తిగత పఠనాన్ని ప్రధాన పాఠ్యంలో తీసుకుని, నిజమైన వ్యాకరణ అస్పష్టతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. చిన్న గ్రీకు వాక్యంలోని వ్యతిరేకతను ‘అయితే’తో, భవిష్యత్ వాగ్దానాన్ని ‘బలపరచి… కాపాడతాడు’తో స్పష్టంగా ఉంచాం. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో సంబంధిత అస్పష్ట పదబంధం వెంట ఉంది.
