revisions:
- from: అయితే ప్రభువు నమ్మదగినవాడు. ఆయన మిమ్మల్ని బలపరచి, దుష్టుని నుండి[a] కాపాడతాడు.
  to: అయితే ప్రభువు నమ్మదగినవాడు. ఆయన మిమ్మల్ని బలపరుస్తాడు, దుష్టుని నుండి[a] కాపాడతాడు.
  rationale: Parallel finite future verbs (“బలపరుస్తాడు, ... కాపాడతాడు”) preserve the source's two coordinated assurances while retaining the draft's natural modern Telugu and its footnoted grammatical ambiguity.
