id: 2TH.3.6
reference: 2 Thessalonians 3:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Παραγγέλλομεν δὲ ὑμῖν, ἀδελφοί, ἐν ὀνόματι τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ Χριστοῦ στέλλεσθαι ὑμᾶς ἀπὸ παντὸς ἀδελφοῦ ἀτάκτως περιπατοῦντος καὶ μὴ κατὰ τὴν παράδοσιν ἣν ⸀παρελάβοσαν παρ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/006.yaml
  text: We command you[a], brothers, in the name of our Lord Jesus the Messiah[e][d][c][b], to keep away from every brother who is walking disorderly and not according to the tradition that they received from us.
translation:
  language: te
  text: సోదరులారా,[a] క్రమశిక్షణ లేకుండా జీవిస్తూ, మా నుండి వారు స్వీకరించిన సంప్రదాయం ప్రకారం నడుచుకోని ప్రతి సోదరుని నుండి దూరంగా ఉండాలని[b] మన ప్రభువైన యేసు మెస్సీయ నామంలో మేము మీకు ఆజ్ఞాపిస్తున్నాం.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సోదరులారా” అని అనువదించిన గ్రీకు పదం పుంలింగ బహువచనంలో ఉంది; పౌలు ఇక్కడ సంఘమంతటినీ సంబోధిస్తున్నాడు.
    reason: lexical_alternative
  - marker: b
    text: “దూరంగా ఉండాలి” అనే మాటను “సన్నిహిత సహవాసం నుండి వెనక్కి తగ్గాలి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: కొన్ని ప్రతుల్లో “మీరు మా నుండి స్వీకరించిన” లేదా “అతడు మా నుండి స్వీకరించిన” అని ఉంది. ఇక్కడ అనుసరించిన ముద్రిత గ్రీకు పాఠంలో “వారు మా నుండి స్వీకరించిన” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: Παραγγέλλομεν
  choice: మేము మీకు ఆజ్ఞాపిస్తున్నాం
  rationale: ఇది కేవలం ప్రోత్సాహం కాక, అధికారపూర్వకమైన ఆదేశాన్ని సూచిస్తుంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకు పుంలింగ బహువచన సంబోధనను నిలుపుతుంది; సందర్భంలో ఇది సంఘమంతటికీ ఉద్దేశించిన సంబోధన.
- source_word: ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: మన ప్రభువైన యేసు మెస్సీయ పేరట
  rationale: ‘పేరట’ అనే సహజ తెలుగు ప్రయోగం మూలంలోని గంభీరమైన అధికార భావాన్ని నిలుపుతుంది; Χριστός ఇక్కడ బిరుదుగా ఉన్నందున ‘మెస్సీయ’ అని అనువదించబడింది.
- source_word: στέλλεσθαι ὑμᾶς ἀπὸ
  choice: దూరంగా ఉండాలని
  rationale: సన్నిహిత సహవాసం నుండి తమను తాము వెనక్కి తీసుకోవాలనే భావాన్ని ఇస్తుంది; దీన్ని అధికారిక బహిష్కరణగా అతిగా నిర్దిష్టం చేయదు.
- source_word: ἀτάκτως περιπατοῦντος
  choice: క్రమశిక్షణ లేకుండా జీవిస్తూ
  rationale: ‘నడవడం’ అనే రూపకానికి ఇక్కడ జీవన ప్రవర్తన అనే అర్థం ఉంది; ἀτάκτως యొక్క విస్తృతమైన క్రమరాహిత్య భావాన్ని ‘సోమరిగా’ అని కుదించకుండా నిలుపుతుంది.
- source_word: μὴ κατὰ τὴν παράδοσιν
  choice: సంప్రదాయం ప్రకారం నడుచుకోని
  rationale: παράδοσις అనేది అందించబడినదాన్ని సూచిస్తుంది; ‘సంప్రదాయం’ ప్రత్యక్ష సమానార్థక పదం, ఇక్కడ అది అపొస్తలుల నుండి అందినదిగా వాక్యమే నిర్దిష్టం చేస్తుంది.
- source_word: ἣν παρελάβοσαν παρ’ ἡμῶν
  choice: మా దగ్గర నుండి వారు స్వీకరించిన
  rationale: SBLGNTలోని మూడవ పురుష బహువచన పాఠం παρελάβοσανను యథాతథంగా ప్రతిబింబిస్తుంది; ముందున్న ఏకవచనంతో ఏర్పడే అసాధారణతను సరిచేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: Χριστοῦ అనే క్రీస్తు సంబంధిత బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సంయుక్త బిరుదులో Χριστόςను బిరుదుగానే స్పష్టంగా చూపిస్తూ, దాని అభిషిక్త రాజు భావాన్ని నిలుపుతుంది.
- issue: στέλλεσθαι ὑμᾶς ἀπὸ ఆజ్ఞలోని వేరుపాటు పరిధి
  choice: దూరంగా ఉండాలని
  alternative: వారితో సహవాసం మానుకోవాలని
  rationale: క్రమరాహిత్యంగా జీవించే విశ్వాసితో సన్నిహిత సంబంధం నుండి వెనక్కి తగ్గే క్రమశిక్షణాత్మక బలాన్ని నిలుపుతుంది; అయితే మూలంలో స్పష్టంగా లేని అధికారిక సంఘ బహిష్కరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘మెస్సీయ’, ‘సంప్రదాయం’ వంటి మూలపదాల భావాన్ని నిలిపి, అసాధారణమైన బహువచన పాఠాన్ని పాదటీపుతో భద్రపరిచింది.
