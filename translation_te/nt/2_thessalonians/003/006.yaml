  verdict: revise
  source_fidelity: The draft accurately conveys the authoritative command, the disciplinary distancing (without importing excommunication), disorderly conduct, and the SBLGNT third-person-plural reading παρελάβοσαν (“they received”). A minor adjustment makes the separation construction more direct in Telugu and places footnote anchors at their relevant words.
