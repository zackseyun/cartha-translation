id: 2TH.3.17
reference: 2 Thessalonians 3:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου, ὅ ἐστιν σημεῖον ἐν πάσῃ ἐπιστολῇ· οὕτως γράφω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/017.yaml
  text: The greeting is by my own hand—Paul's—which is a sign in every letter[a]; this is how I write.
translation:
  language: te
  text: నా స్వహస్తంతో రాసిన ఈ వందనం పౌలునైన నాది; ప్రతి లేఖలోనూ ఇది ఒక గుర్తు[a]. నేను ఈ విధంగా రాస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నా స్వహస్తంతో రాసిన ఈ వందనం పౌలునైన నాది—ప్రతి లేఖలోనూ ఒక గుర్తు; ఇలా రాస్తున్నాను.” చివరి మాటలను మరింత అక్షరార్థంగా “ఈ విధంగా రాస్తాను” అని కూడా అనువదించవచ్చు.'
    reason: οὕτως γράφω అనే చివరి వాక్యభాగం విధానాన్ని లేదా ప్రస్తుత రచనా చర్యను సూచించగలదు; వాక్య విభజనలోనూ స్వల్ప భేదం సాధ్యం.
lexical_decisions:
- source_word: Ὁ ἀσπασμὸς
  choice: వందనం
  rationale: పత్రిక ముగింపులోని అభివందనాన్ని సూచించే సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: పౌలను నేను నా స్వహస్తంతో రాసే
  rationale: దాతృవిభక్తి ప్రయోగం పౌలు స్వయంగా చేతితో రాయడాన్ని సూచిస్తుంది; Παύλου అనే స్వపరిచయాన్ని తెలుగులో సహజంగా ‘పౌలను నేను’ అని వ్యక్తం చేశాం.
- source_word: σημεῖον
  choice: గుర్తు
  rationale: ఇక్కడ పత్రిక ప్రామాణికతను గుర్తించేందుకు ఉపయోగపడే గుర్తు అనే భావం ఉంది; ‘సూచన’ కంటే ‘గుర్తు’ సాధారణ పాఠకులకు సహజం.
- source_word: ἐν πάσῃ ἐπιστολῇ
  choice: ప్రతి పత్రికలోనూ
  rationale: πάσῃ యొక్క సమగ్ర భావాన్ని ‘ప్రతి’ నిలుపుతుంది; ἐπιστολήకి సందర్భోచితమైన తెలుగు ‘పత్రిక’.
- source_word: οὕτως γράφω
  choice: నేను ఈ విధంగా రాస్తాను
  rationale: οὕτως యొక్క విధానార్థాన్ని స్పష్టంగా ఉంచుతూ, ఇది చేతిరాత గుర్తును సూచిస్తుందనే భావాన్ని అతిగా నిర్ధారించకుండా అనువదిస్తుంది.
theological_decisions:
- issue: పౌలు స్వహస్తంతో రాసిన భాగం యొక్క ప్రామాణికత సూచించే పాత్ర
  choice: ‘ప్రతి పత్రికలోనూ ఇదే గుర్తు’ అని అనువదించి, స్వహస్త వందనం గుర్తింపునిచ్చే చిహ్నమని చూపించాం.
  alternative: చివరి వాక్యాన్ని ప్రస్తుత వందనానికే పరిమితం చేస్తూ ‘ఇలా రాస్తున్నాను’ అని తీసుకోవచ్చు.
  rationale: సమీప సందర్భంలోని ‘గుర్తు’ మరియు ‘ప్రతి పత్రికలో’ అనే మాటలు ప్రామాణికతను గుర్తించే ఆచారాన్ని సూచిస్తాయి; అయినా οὕτως γράφω లోని విధాన/ప్రస్తుత చర్య మధ్య స్వల్ప సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పత్రికా సందర్భానికి తగిన గౌరవప్రదమైన సరళ శైలి. ‘స్వహస్తంతో’ అనే పదం వ్యక్తిగత చేతిరాతను సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
