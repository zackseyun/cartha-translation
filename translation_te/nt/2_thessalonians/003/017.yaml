revisions:
- from: పౌలను నేను నా స్వహస్తంతో రాసే వందనం ఇది. ప్రతి పత్రికలోనూ ఇదే గుర్తు[a]; నేను ఈ విధంగా రాస్తాను.
  to: నా స్వహస్తంతో రాసిన ఈ వందనం పౌలునైన నాది; ప్రతి లేఖలోనూ ఇది ఒక గుర్తు[a]. నేను ఈ విధంగా రాస్తాను.
  rationale: The revision corrects the rendering of Παύλου, replaces the potentially misleading “పత్రిక” with “లేఖ,” and retains the source’s ambiguity in οὕτως γράφω through the footnote. It does not expand the authentication statement beyond what the Greek says.
  reviewer_model: gpt-5.6-terra
