  text: And do not regard him as an enemy[b][a], but admonish him as a brother.
translation:
  language: te
  text: అతణ్ణి శత్రువుగా భావించకండి; కానీ అతనిని సహోదరునిగా భావించి హెచ్చరించండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘సహోదరుడు’ అనేది తోటి విశ్వాసిని సూచిస్తుంది; క్రైస్తవ సమాజంలోని ఒక సభ్యునికి ప్రాతినిధ్య పదంగా కూడా దీనిని ఉపయోగించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγεῖσθε
  choice: భావించకండి
  rationale: ఈ మధ్యమ ప్రయోగ ఆజ్ఞారూపం ఒక వ్యక్తిని ఒక నిర్దిష్ట రీతిలో పరిగణించడం లేదా భావించడం అనే అర్థాన్ని ఇస్తుంది. ‘భావించకండి’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని మూల్యాంకన భావాన్ని నిలుపుతుంది.
- source_word: ἐχθρὸν
  choice: శత్రువుగా
  rationale: ὡς తో వచ్చిన ఈ పదం ఆ వ్యక్తిని శత్రువు అనే వర్గంలో ఉంచకూడదని సూచిస్తుంది; ‘శత్రువుగా’ స్పష్టమైన, ప్రామాణిక సమానార్థకం.
- source_word: νουθετεῖτε
  choice: బుద్ధి చెప్పండి
  rationale: νουθετέωలో తప్పును సరిదిద్దే ఉద్దేశంతో హెచ్చరించడం, ఉపదేశించడం అనే భావాలు కలిసున్నాయి. ‘బుద్ధి చెప్పండి’ సాధారణ ఆధునిక తెలుగులో ఆ దిద్దుబాటు ఉద్దేశాన్నీ, సంబంధపూర్వక స్వరాన్నీ వ్యక్తం చేస్తుంది.
- source_word: ἀδελφόν
  choice: సహోదరుడిగా
  rationale: మూలంలో ఏకవచన పుంలింగ నామవాచకం ఉంది. దాని రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, క్రైస్తవ సమాజంలోని తోటి విశ్వాసిని సూచించే విస్తృత ప్రయోగాన్ని పాదసూచికలో తెలిపాం.
- source_word: ὡς
  choice: గా
  rationale: రెండు భాగాల్లోనూ ὡς ఒక వ్యక్తిని ఏ హోదాలో భావించాలో లేదా అతనితో ఏ హోదాలో వ్యవహరించాలో సూచిస్తుంది; తెలుగులో ‘గా’ దీనిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ μὴ ... ἀλλὰ
  choice: '...కండి; బదులుగా, ...ండి'
  rationale: ఈ నిర్మాణం ముందున్న క్రమశిక్షణ సూచనతో అనుసంధానమై బలమైన వ్యత్యాసాన్ని చూపుతుంది. తెలుగులో ‘బదులుగా’ ఆ వ్యత్యాసాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: అవిధేయుడైన విశ్వాసి పట్ల క్రమశిక్షణ వైఖరి
  choice: ఆ వ్యక్తిని శత్రువుగా చూడకుండా, సమాజ సంబంధం కొనసాగుతున్న సహోదరుడిగా దిద్దుబాటు చేయాలని వాక్యం చెబుతుంది.
  alternative: దీనిని సంఘ క్రమశిక్షణకు ప్రత్యేకంగా కాకుండా, సాధారణ వ్యక్తిగత విభేదాల విషయంలో ఇచ్చిన సలహాగా చదవవచ్చు.
  rationale: 2 థెస్సలొనీకయులు 3:14–15 సందర్భంలో పౌలు సమాజంలో ఉన్న అవిధేయుడిని గుర్తించి, అతడు సిగ్గుపడేలా కొంత దూరం పాటించడం గురించి మాట్లాడుతున్నాడు. అయినా ‘సహోదరుడు’ అనే పదం అతణ్ణి శత్రువుగా వెలివేయకుండా తోటి విశ్వాసిగా గుర్తించాలని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘అతణ్ణి/అతనికి’ అనే సహజ రూపాలు ఏకవచన పురుష సూచనను నిలుపుతాయి. ‘బుద్ధి చెప్పండి’ అనేది కేవలం సమాచారం ఇవ్వడం కాక, ప్రేమతో కూడిన దిద్దుబాటు భావాన్ని అందిస్తుంది.
