id: 2TH.3.1
reference: 2 Thessalonians 3:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τὸ λοιπὸν προσεύχεσθε, ἀδελφοί, περὶ ἡμῶν, ἵνα ὁ λόγος τοῦ κυρίου τρέχῃ καὶ δοξάζηται καθὼς καὶ πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/001.yaml
  text: Finally[a], brothers, pray for us, that the word of the Lord may spread rapidly and be honored, just as it was among you[b],
translation:
  language: te
  text: చివరిగా, సహోదరులారా,[a] మా కొరకు ప్రార్థించండి, తద్వారా మీ మధ్య జరిగినట్లుగానే ప్రభువు వాక్యం వేగంగా వ్యాపించి గౌరవించబడునట్లు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సహోదర సహోదరీలారా”; గ్రీకులో “సహోదరులారా” అని ఉంది; ఇది మొత్తం సంఘాన్ని ప్రతినిధిగా ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “పరుగెత్తి మహిమపరచబడునట్లు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπὸν
  choice: చివరిగా
  rationale: పత్రికలో ముగింపు భాగాన్ని పరిచయం చేసే సహజమైన సంభాషణ సూచికగా అనువదించబడింది.
- source_word: προσεύχεσθε
  choice: ప్రార్థించండి
  rationale: రెండవ పురుష బహువచన ఆజ్ఞను సహజమైన ఆధునిక తెలుగు ఆజ్ఞారూపంలో వ్యక్తం చేస్తుంది; కొనసాగింపునకు సంబంధించిన భావాన్ని సందర్భం మోస్తుంది.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: గ్రీకు పుంలింగ బహువచన సంబోధనను నేరుగా నిలుపుతుంది; ఇది మొత్తం సంఘాన్ని ప్రతినిధిగా ఉద్దేశించి ఉండవచ్చని పాదటిప్పణి వివరిస్తుంది.
- source_word: περὶ ἡμῶν
  choice: మా కోసం
  rationale: ప్రార్థన అనే క్రియతో περί + షష్ఠీ విభక్తి భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: ప్రభువు వాక్యం
  rationale: జనిటివ్ సంబంధాన్ని సహజంగా చూపుతూ బైబిలు పదబంధమైన ‘వాక్యం’ను నిలుపుతుంది.
- source_word: τρέχῃ
  choice: వేగంగా వ్యాపించి
  rationale: అక్షరార్థంగా ‘పరుగెత్తు’; ఇక్కడ ప్రభువు వాక్యం త్వరగా ముందుకు సాగి వ్యాపించడాన్ని సూచించే రూపకాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: δοξάζηται
  choice: ఘనత పొందాలని
  rationale: కర్మణి భావాన్ని నిలుపుతూ, వాక్యం గౌరవంగా స్వీకరించబడే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: καθὼς καὶ πρὸς ὑμᾶς
  choice: మీ మధ్య జరిగినట్లే
  rationale: థెస్సలొనీకయుల అనుభవంలో ఇప్పటికే జరిగిన దానితో పోలికను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; καί యొక్క ‘కూడా/అలాగే’ భావం ‘తట్లే’లో ప్రతిఫలిస్తుంది.
theological_decisions:
- issue: సంఘ సంబోధనలో ἀδελφοί యొక్క పరిధి
  choice: సహోదరులారా
  alternative: సహోదర సహోదరీలారా
  rationale: మూలంలోని వ్యాకరణపరమైన పుంలింగ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది మొత్తం సంఘాన్ని ప్రతినిధిగా ఉద్దేశించి ఉండవచ్చనే భావాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
- issue: ప్రభువు వాక్యానికి వర్తించిన τρέχῃ రూపకం
  choice: వేగంగా వ్యాపించి
  alternative: పరుగెత్తి
  rationale: సందేశం వేగంగా, అడ్డంకులేకుండా ముందుకు సాగడమే సందర్భార్థం. అక్షరార్థ రూపకాన్ని పాదటిప్పణిలో ఉంచి, ప్రధాన పాఠ్యంలో స్పష్టమైన భావాన్ని అందిస్తుంది.
- issue: δοξάζηται యొక్క అనువాదం
  choice: ఘనత పొందాలని
  alternative: మహిమపరచబడాలని
  rationale: ‘వాక్యం’ ప్రజలచే గౌరవంగా స్వీకరించబడే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; అయితే మూలంలోని ‘మహిమపరచబడుట’ అనే పదబంధాన్ని పాదటిప్పణి నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. పొడవైన గ్రీకు వాక్యాన్ని స్పష్టత కోసం రెండు తెలుగు వాక్యాలుగా విభజించి, ప్రార్థన అభ్యర్థనను రెండవ వాక్యంలో సహజంగా పునరుద్ఘాటించింది.
