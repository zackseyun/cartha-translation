review_pass:
  verdict: revise
  source_fidelity: 'The main lexical choices accurately convey the Greek: Τὸ λοιπὸν as “చివరిగా,” the congregational vocative ἀδελφοί as “సహోదరులారా,” περί ἡμῶν as “మా కొరకు,” and the paired purpose subjunctives as the Lord’s word spreading rapidly and receiving honor. The draft’s second independent “ప్రార్థించండి” unnecessarily turns the purpose of the requested prayer into a further command; the Greek has one imperative followed by a ἵνα purpose/content clause. “మీ మధ్య జరిగినట్లే” is better placed with the full paired outcome it compares.'
  naturalness: The revised wording is fluent modern standard Telugu and preserves the single-sentence flow and dependency of the Greek without needless repetition. “గౌరవించబడునట్లు” is a natural passive expression for the word being honored/received with esteem.
  terminology: “ప్రభువు వాక్యం” appropriately retains the biblical register of ὁ λόγος τοῦ κυρίου. “సహోదరులారా” retains the masculine Greek form, while footnote a responsibly notes its possible representative congregational reference. The literal footnote for b correctly preserves both the running metaphor and the passive “be glorified.”
  issues:
  - severity: medium
    issue: The draft repeats “ప్రార్థించండి” as a second independent imperative.
    rationale: προσεύχεσθε occurs only once. The ἵνα clause expresses what the requested prayer seeks, rather than issuing a second command.
  - severity: low
    issue: The comparison phrase is attached awkwardly to “మీ మధ్య జరిగినట్లే.”
    rationale: καθὼς καὶ πρὸς ὑμᾶς compares the stated advance and honoring of the word with the Thessalonians’ experience; placing it before the full outcome makes that scope clear.
  revised_text: చివరిగా, సహోదరులారా,[a] మా కొరకు ప్రార్థించండి, తద్వారా మీ మధ్య జరిగినట్లుగానే ప్రభువు వాక్యం వేగంగా వ్యాపించి గౌరవించబడునట్లు.[b]
