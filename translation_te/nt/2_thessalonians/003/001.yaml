- from: చివరిగా, సహోదరులారా,[a] మా కోసం ప్రార్థించండి. ప్రభువు వాక్యం మీ మధ్య జరిగినట్లే వేగంగా వ్యాపించి ఘనత పొందాలని ప్రార్థించండి.[b]
  to: చివరిగా, సహోదరులారా,[a] మా కొరకు ప్రార్థించండి, తద్వారా మీ మధ్య జరిగినట్లుగానే ప్రభువు వాక్యం వేగంగా వ్యాపించి గౌరవించబడునట్లు.[b]
  rationale: The revision restores the Greek syntax by retaining one prayer command and making the spread and honoring of the Lord’s word the expressed aim of that prayer. It also clarifies that “just as among you” qualifies the whole paired outcome. No doctrinal expansion has been introduced.
