id: 2TH.3.4
reference: 2 Thessalonians 3:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πεποίθαμεν δὲ ἐν κυρίῳ ἐφ’ ὑμᾶς, ὅτι ἃ ⸀παραγγέλλομεν καὶ ποιεῖτε καὶ ποιήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/004.yaml
  text: And we have confidence in the Lord about you, that you are doing and will do what we command.
translation:
  language: te
  text: మీ గురించి ప్రభువులో మాకు నమ్మకం ఉంది—మేము ఆజ్ఞాపిస్తున్నవాటిని మీరు చేస్తున్నారని, ఇక ముందూ చేస్తారని.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεποίθαμεν
  choice: మాకు నమ్మకం ఉంది
  rationale: పూర్తయిన స్థితి యొక్క వర్తమాన ఫలితాన్ని తెలియజేసే గ్రీకు రూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐν κυρίῳ ἐφ’ ὑμᾶς
  choice: మీ గురించి ప్రభువులో మాకు నమ్మకం ఉంది
  rationale: నమ్మకానికి ఆధారం లేదా పరిధి ‘ప్రభువులో’ ఉందని, అది పాఠకుల గురించి కలిగిన నమ్మకమని రెండింటినీ నిలుపుతుంది.
- source_word: παραγγέλλομεν
  choice: మేము ఆజ్ఞాపిస్తున్నవాటిని
  rationale: అపొస్తలుల అధికారపూర్వక ఆదేశాన్ని సూచించే పదబలాన్ని ‘చెబుతున్నవి’గా సడలించకుండా కాపాడుతుంది.
- source_word: ποιεῖτε καὶ ποιήσετε
  choice: మీరు చేస్తున్నారని, ఇక ముందూ చేస్తారని
  rationale: వర్తమాన కార్యాన్నీ భవిష్యత్తులో కొనసాగింపునూ స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: పౌలు నమ్మకానికి ఆధారం
  choice: ప్రభువులో
  alternative: ప్రభువు కారణంగా / ప్రభువును బట్టి
  rationale: ἐν κυρίῳ అనే మూలభాషా పదబంధాన్ని వివరణాత్మకంగా కుదించకుండా, దాని సంబంధాత్మక మరియు దైవాధార భావ విస్తృతిని నిలుపుతుంది.
- issue: విశ్వాసుల విధేయతపై నమ్మకం
  choice: మీ గురించి ... నమ్మకం
  alternative: మీపై ... నమ్మకం
  rationale: ἐφ’ ὑμᾶς యొక్క లక్ష్యసంబంధ భావాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, నమ్మకం స్వతంత్రంగా మనుషులపైనే ఆధారపడుతున్నట్లు అనిపించకుండా ‘ప్రభువులో’ అనే అంశంతో అనుసంధానిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే అపొస్తలీయ ఆజ్ఞ మరియు ‘ప్రభువులో’ ఉన్న నమ్మకం అనే గంభీరతను నిలుపుతూ అనువదించబడింది.
