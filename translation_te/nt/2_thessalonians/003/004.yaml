review_pass:
  verdict: approve
  source_fidelity: 'The draft accurately reflects πεποίθαμεν (“we have confidence”), ἐν κυρίῳ (“in the Lord”), ἐφ’ ὑμᾶς (“concerning/about you”), and the complementary ὅτι clause. It preserves the present and future contrast in ποιεῖτε καὶ ποιήσετε: the readers are doing, and will do, what is commanded.'
  naturalness: The Telugu is clear, idiomatic modern standard usage. “మీ గురించి ప్రభువులో మాకు నమ్మకం ఉంది” retains both the Lord-centered basis/sphere of confidence and its reference to the recipients. The paired “చేస్తున్నారని, ఇక ముందూ చేస్తారని” is natural and communicates the intended temporal sequence.
  terminology: “ప్రభువులో” is an appropriately close rendering of ἐν κυρίῳ, without importing a narrower theological explanation. “ఆజ్ఞాపిస్తున్నవాటిని” suitably conveys παραγγέλλομεν and preserves the authoritative register of the apostolic instruction. No footnotes are required.
