  yaml_path: translation/nt/2_thessalonians/003/002.yaml
  text: and that we may be delivered from wicked and evil men[b][a], for not all have faith.
translation:
  language: te
  text: మరియు వక్రమైన, దుష్టులైన మనుష్యుల నుంచి మేము విడిపించబడాలని ప్రార్థించండి[a]. ఎందుకంటే అందరికీ విశ్వాసం లేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అసమంజసంగా ప్రవర్తించే దుష్ట మనుష్యుల నుంచి.’ గ్రీకు విశేషణానికి ‘అనుచితమైన,’ ‘అసంబద్ధమైన,’ లేదా ‘వివేకరహితమైన’ అనే అర్థాలు రావచ్చు; ఈ సందర్భంలో అది నైతికంగా దారి తప్పిన ప్రత్యర్థులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఎందుకంటే అందరూ విశ్వసనీయులు కారు.’ గ్రీకులో అక్షరార్థంగా, ‘విశ్వాసం అందరిది కాదు.’
    reason: alternative_reading
lexical_decisions:
- source_word: ῥυσθῶμεν
  choice: మేము రక్షించబడాలని
  rationale: ἵνα తరువాత ఉన్న భూతకాలాంశ నిష్క్రియార్థక సంభావనారూపం ప్రార్థనలో ఉద్దేశాన్ని తెలియజేస్తుంది. ‘రక్షించబడాలని’ అనేది శత్రుత్వం చూపే మనుష్యుల చేతిలోనుంచి విడిపించబడే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀτόπων
  choice: వక్రమైనవారూ
  rationale: ఈ పదానికి ‘అనుచితమైన,’ ‘అసంబద్ధమైన,’ ‘వివేకరహితమైన’ అనే పరిధి ఉంది. πονηρῶνతో కలిసివచ్చిన ఈ సందర్భంలో ‘వక్రమైనవారు’ నైతికంగా దారి తప్పిన ప్రత్యర్థులను సూచిస్తూ, తరువాతి ‘దుష్టులు’తో పూర్తిగా ఒకే అర్థంగా మారకుండా ఉంటుంది.
- source_word: πονηρῶν
  choice: దుష్టులూ
  rationale: స్పష్టమైన నైతిక చెడును సూచించే సాధారణ పదం; ఆధునిక తెలుగు బైబిలు శైలిలో సహజంగా, గంభీరంగా ఉంటుంది.
- source_word: ἀνθρώπων
  choice: మనుష్యుల
  rationale: ఇక్కడ అపొస్తలుల కార్యాన్ని వ్యతిరేకించే వ్యక్తులను సూచిస్తుంది. ‘మనుష్యులు’ మూలపదాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: πίστις
  choice: విశ్వాసం
  rationale: ఈ సందర్భంలో πίστιςకు ప్రధానమైన అర్థం ‘విశ్వాసం.’ ‘విశ్వసనీయత’ అనే అర్థసాధ్యతను పాదసూచికలో నిలిపి ఉంచాం.
- source_word: οὐ γὰρ πάντων ἡ πίστις
  choice: ఎందుకంటే అందరికీ విశ్వాసం లేదు
  rationale: గ్రీకులో అక్షరార్థంగా ‘విశ్వాసం అందరిది కాదు’ అనే సంక్షిప్త నిర్మాణం ఉంది. తెలుగులో ‘అందరికీ విశ్వాసం లేదు’ సహజంగా ఉండి, మూలంలోని భావాన్ని అతిశయింపజేయదు.
theological_decisions:
- issue: πίστις అనే పదం విశ్వాసాన్నా, విశ్వసనీయతనూ సూచిస్తుందా?
  choice: విశ్వాసం
  alternative: అందరూ విశ్వసనీయులు కారు
  rationale: శత్రుత్వంతో అపొస్తలుల కార్యాన్ని అడ్డుకునేవారి సందర్భంలో ‘అందరికీ విశ్వాసం లేదు’ అనేది ఎక్కువ సంభావ్యమైన అర్థం. అయినా πίστις ‘విశ్వసనీయత’ను కూడా సూచించగలదు కాబట్టి ఆ నిజమైన అర్థసాధ్యతను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రార్థనా వాక్యంగా రూపొందించాం. ముందు వాక్యంతో ఉన్న καί సంబంధాన్ని ‘కూడా’ ద్వారా నిలిపాం. రెండు గ్రీకు విశేషణాల మధ్య తేడాను ‘వక్రమైనవారు,’ ‘దుష్టులు’ అని కాపాడాం; genuine ambiguityలను పాదసూచికల్లో ఉంచాం.
