id: 2TH.3.12
reference: 2 Thessalonians 3:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῖς δὲ τοιούτοις παραγγέλλομεν καὶ παρακαλοῦμεν ⸂ἐν κυρίῳ Ἰησοῦ Χριστῷ⸃ ἵνα μετὰ ἡσυχίας ἐργαζόμενοι τὸν ἑαυτῶν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/012.yaml
  text: To such people we command and urge in the Lord Jesus the Messiah that[a], working quietly[c][b], they should eat their own bread.
translation:
  language: te
  text: 'అలాంటి వారికి మేము ప్రభువైన యేసు మెస్సీయలో[a] ఆజ్ఞాపిస్తున్నాము మరియు కోరుతున్నాము: వారు ప్రశాంతంగా[b] పనిచేస్తూ తమ సొంత రొట్టె తినాలి[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రభువైన యేసు క్రీస్తులో.’ గ్రీకు Χριστός అంటే ‘మెస్సీయ’; ఇక్కడ అది బిరుదుగా పనిచేస్తోంది.
    reason: alternative_reading
  - marker: b
    text: ‘ప్రశాంతంగా’ అంటే ఇతరులకు కలత కలిగించకుండా, స్థిరంగా తమ పని తాము చేసుకుంటూ అని భావం.
    reason: lexical_clarification
  - marker: c
    text: సందర్భంలో, ‘తమ సొంత రొట్టె తినాలి’ అనేది ఇతరులపై ఆధారపడకుండా తాము పనిచేసి సంపాదించుకున్న ఆహారం తినడాన్ని సూచిస్తుంది.
    reason: idiom_clarification
lexical_decisions:
- source_word: τοῖς δὲ τοιούτοις
  choice: అలాంటి వారికి
  rationale: ముందటి వచనంలో పేర్కొన్న క్రమం తప్పి నడుచుకుంటున్నవారిని ఇది తిరిగి సూచిస్తుంది. δέ ఇక్కడ స్వల్ప అనుసంధానాన్ని చూపుతుంది; తెలుగులో ప్రత్యేక సంధాయక పదం లేకుండానే సహజంగా వ్యక్తమవుతుంది.
- source_word: παραγγέλλομεν καὶ παρακαλοῦμεν
  choice: మేము ... ఆజ్ఞాపిస్తూ గట్టిగా కోరేది
  rationale: మొదటి క్రియలోని అధికారపూర్వక ఆజ్ఞను, రెండవ క్రియలోని earnest appeal ను రెండింటినీ నిలుపుతుంది. ‘గట్టిగా కోరేది’ ఆధునిక తెలుగులో సహజంగా ఉండి, ఆజ్ఞను బలహీనపరచదు.
- source_word: ἐν κυρίῳ Ἰησοῦ Χριστῷ
  choice: ప్రభువైన యేసు మెస్సీయలో
  rationale: ἐν ను ‘లో’గా ఉంచడం ద్వారా ప్రభువుతో సంబంధం, ఆయన అధికార పరిధి అనే విస్తృత భావాన్ని ఒకే అర్థానికి పరిమితం చేయకుండా నిలుపుతుంది. Χριστός ఇక్కడ బిరుదుగా పనిచేస్తున్నందున ‘మెస్సీయ’గా అనువదించబడింది.
- source_word: μετὰ ἡσυχίας ἐργαζόμενοι
  choice: ప్రశాంతంగా పనిచేస్తూ
  rationale: ἡσυχία శబ్దం చేయకపోవడాన్ని మాత్రమే కాక, కలత కలిగించకుండా స్థిరంగా తన పని చేసుకోవడాన్ని సూచిస్తుంది. క్రియావిశేషణ రూపం తెలుగులో సహజంగా ఉంది; వర్తమాన కృదంత భావాన్ని ‘పనిచేస్తూ’ నిలుపుతుంది.
- source_word: τὸν ἑαυτῶν ἄρτον
  choice: తమ సొంత రొట్టె
  rationale: ἄρτος యొక్క స్పష్టమైన ‘రొట్టె’ రూపకాన్ని నిలుపుతుంది; సందర్భంలో అది ఇతరులపై ఆధారపడకుండా తాము సంపాదించుకున్న జీవనోపాధి లేదా ఆహారాన్ని సూచిస్తుంది.
- source_word: ἐσθίωσιν
  choice: తినాలి
  rationale: ἵνα తరువాతి subjunctive ఇక్కడ ఆజ్ఞలోని విషయాన్ని, బాధ్యతను తెలియజేస్తుంది. తెలుగు విధ్యర్థక రూపం ‘తినాలి’ ఆ బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός యేసుకు చెందిన సజీవ బిరుదుగా ఉంది; అందువల్ల దాని అర్థాన్ని ప్రత్యక్షంగా తెలిపే ‘మెస్సీయ’ను వాడాం. సుపరిచితమైన ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- issue: ἐν κυρίῳ అనే పదబంధం యొక్క భావం
  choice: ప్రభువైన యేసు మెస్సీయలో
  alternative: ప్రభువైన యేసు మెస్సీయ అధికారంతో
  rationale: గ్రీకు ἐν అనేది ఐక్యత/సంబంధ పరిధిని గానీ అధికారాన్ని గానీ సూచించగలదు. ‘లో’ అనే రూపం ఈ ఉద్దేశపూర్వక విస్తృతతను నిలుపుతుంది; కేవలం సాధనార్థక అర్థానికి పరిమితం చేయదు.
- issue: అపొస్తలీయ ఉపదేశంలోని ద్వంద్వ స్వరం
  choice: ఆజ్ఞాపిస్తూ గట్టిగా కోరేది
  alternative: ఉపదేశించేది
  rationale: మూలంలోని παραγγέλλομεν మరియు παρακαλοῦμεν అధికారపూర్వక ఆజ్ఞను, హృదయపూర్వక విజ్ఞప్తిని కలిపి ఉంచుతాయి. వాటిని ఒక్క సాధారణ క్రియగా కుదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘గట్టిగా కోరేది ఏమిటంటే’ ద్వారా అధికారమూ విజ్ఞప్తీ రెండూ సహజంగా కలుస్తాయి. ‘రొట్టె’ అనే మూలంలోని స్పష్ట రూపకం ప్రధాన వాక్యంలో నిలుపబడి, దాని జీవనోపాధి భావం పాదసూచికలో వివరించబడింది.
