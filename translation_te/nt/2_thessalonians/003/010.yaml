id: 2TH.3.10
reference: 2 Thessalonians 3:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε ἦμεν πρὸς ὑμᾶς, τοῦτο παρηγγέλλομεν ὑμῖν, ὅτι εἴ τις οὐ θέλει ἐργάζεσθαι μηδὲ ἐσθιέτω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/010.yaml
  text: 'For even when we were with you, we kept commanding you this: if anyone is not willing to work, neither let him eat.'
translation:
  language: te
  text: 'ఎందుకంటే, మేము మీతో ఉన్నప్పుడు కూడా మీకు ఇలా ఆజ్ఞాపిస్తూ ఉండేవాళ్లం: “ఎవరైనా పని చేయడానికి ఇష్టపడకపోతే[b], అతడు తినకూడదు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతణ్ణి తిననివ్వకూడదు.”
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు మూలపాఠంలో “పని చేయడానికి ఇష్టపడకపోతే” అని ఉంది. ఇది పని చేయడానికి ఇష్టంలేకపోవడాన్ని సూచిస్తుంది, పని చేయలేకపోవడాన్ని కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ఎందుకంటే ... కూడా
  rationale: γάρ యొక్క వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’ తెలియజేస్తుంది; καί ఇచ్చే అదనపు ఉద్ఘాటనను ‘కూడా’ సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: ὅτε ἦμεν πρὸς ὑμᾶς
  choice: మేము మీతో ఉన్నప్పుడు
  rationale: πρός ఇక్కడ వారి సహవాసంలో, సన్నిధిలో ఉండడాన్ని సూచిస్తుంది; ‘మీతో ఉన్నప్పుడు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: τοῦτο παρηγγέλλομεν ὑμῖν
  choice: మీకు ఇలా ఆజ్ఞాపిస్తూ ఉండేవాళ్లం
  rationale: τοῦτο ముందుకు వచ్చే ఆజ్ఞ విషయాన్ని సూచిస్తుంది; παρηγγέλλομεν అనే అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న లేదా అలవాటైన చర్య భావాన్ని ‘ఆజ్ఞాపిస్తూ ఉండేవాళ్లం’ వ్యక్తపరుస్తుంది.
- source_word: εἴ τις
  choice: ఎవరైనా
  rationale: నిర్దిష్ట వ్యక్తిని కాక సాధారణంగా ఎవరికైనా వర్తించే షరతును సహజంగా తెలియజేస్తుంది.
- source_word: οὐ θέλει ἐργάζεσθαι
  choice: పని చేయడానికి ఇష్టపడకపోతే
  rationale: θέλει సామర్థ్యాన్ని కాక సంకల్పం లేదా ఇష్టాన్ని సూచిస్తుంది. కాబట్టి పని చేయలేని స్థితిని ఈ అనువాదం ఉద్దేశించదు.
- source_word: μηδὲ ἐσθιέτω
  choice: అతడు తిననూ కూడదు
  rationale: μηδέ లోని ‘కూడా కాదు’ అనే అనుసంధాన భావాన్ని ‘తిననూ’ నిలుపుతుంది; మూడవ పురుష ఏకవచన ఆజ్ఞార్థక ఫలితాన్ని ‘కూడదు’ సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ఈ మాట పని చేయలేని వ్యక్తిని ఉద్దేశిస్తుందా, పని చేయడానికి ఇష్టపడని వ్యక్తిని ఉద్దేశిస్తుందా?
  choice: పని చేయడానికి ఇష్టపడని వ్యక్తి
  alternative: పని చేయలేని వ్యక్తి
  rationale: θέλει సంకల్పం లేదా ఇష్టానికి సంబంధించిన క్రియ. అసమర్థతను చేర్చడం మూలపాఠంలో లేని కఠినమైన సామాజిక నియమాన్ని దిగుమతి చేస్తుంది.
- issue: μηδὲ ἐσθιέτω లోని ఆజ్ఞార్థక ఫలితాన్ని ఎలా వ్యక్తపరచాలి?
  choice: అతడు తిననూ కూడదు
  alternative: అతణ్ణి తిననివ్వకూడదు
  rationale: ముఖ్య పాఠం గ్రీకు మూడవ పురుష ఏకవచన ఆజ్ఞార్థక రూపాన్ని నేరుగా, సహజంగా వ్యక్తపరుస్తుంది. ప్రత్యామ్నాయ రూపం ఇతరులు అతనికి అనుమతి నిరాకరించాలనే భావాన్ని కొంత స్పష్టంగా చేస్తుంది; అందువల్ల దాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘ఆజ్ఞాపిస్తూ ఉండేవాళ్లం’ అసంపూర్ణ భూతకాలంలోని కొనసాగింపు లేదా పునరావృత భావాన్ని నిలుపుతుంది. ‘అతడు’ ప్రతినిధి ఏకవచనంగా వాడబడింది; ఇది పురుషులకు మాత్రమే పరిమితమని ఉద్దేశం కాదు.
