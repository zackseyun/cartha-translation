  terminology: ‘ఆజ్ఞాపిస్తూ’ suitably renders the authoritative sense of παρηγγέλλομεν, and ‘పని చేయడానికి ఇష్టపడకపోతే’ correctly preserves willingness rather than ability. The footnote on unwillingness is accurate and pastorally necessary for lexical precision.
