  source_fidelity: The draft accurately conveys the explanatory-emphatic force of καὶ γάρ, the presence sense of πρὸς ὑμᾶς, the imperfect/repeated force of παρηγγέλλομεν, and especially the volitional—not incapacity-related—sense of οὐ θέλει. The conditional consequence retains the singular representative force of ἐσθιέτω.
