  to: 'ఎందుకంటే, మేము మీతో ఉన్నప్పుడు కూడా మీకు ఇలా ఆజ్ఞాపిస్తూ ఉండేవాళ్లం: “ఎవరైనా పని చేయడానికి ఇష్టపడకపోతే[b], అతడు తినకూడదు[a].”'
  rationale: The revision is limited to replacing the awkward ‘తిననూ కూడదు’ with idiomatic ‘తినకూడదు.’ This preserves the Greek third-person present imperative’s prohibitive consequence without adding an agent or changing the condition’s focus on unwillingness. Footnote anchors and their associated notes remain intact.
