review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the emphatic ‘you yourselves,’ the personal object ‘us,’ the setting ‘among you,’ and the broad rather than narrowly ‘idle’ sense of ἀτακτέω. However, ‘ఎలా అనుకరించాలో’ by itself can merely mean ‘how to imitate’ and does not clearly convey δεῖ (‘ought/must’).
  naturalness: ‘క్రమశిక్షణ లేకుండా ప్రవర్తించలేదు’ is understandable but somewhat cumbersome. ‘క్రమం తప్పి ప్రవర్తించలేదు’ is more idiomatic modern Telugu while retaining the broad sense of disorderly conduct.
  terminology: ‘అనుకరించవలెనో’ explicitly retains the obligation in δεῖ without adding doctrinal interpretation. The contextual ‘idle’ alternative remains appropriately confined to the footnote.
  issues:
  - severity: medium
    issue: The obligation expressed by δεῖ is underrepresented.
    rationale: The construction ‘మమ్మల్ని ఎలా అనుకరించాలో’ can express manner alone. ‘ఎలా అనుకరించవలెనో’ makes clear that this is how they ought to imitate the apostles.
  - severity: low
    issue: The rendering of ἀτακτέω is stylistically heavy.
    rationale: ‘క్రమం తప్పి ప్రవర్తించలేదు’ is a more natural modern Telugu expression for conduct that is disorderly or out of order, without restricting it to idleness.
  revised_text: ఎందుకంటే, మమ్మల్ని ఎలా అనుకరించవలెనో మీకే తెలుసు; మేము మీ మధ్య క్రమం తప్పి ప్రవర్తించలేదు[a].
  revised_footnotes:
  - marker: a
    text: 'లేదా, ఈ సందర్భంలో మరింత నిర్దిష్టంగా: “మేము మీ మధ్య సోమరిగా ఉండలేదు.”'
    reason: lexical_alternative
  revision_rationale: The revision explicitly renders the necessity/obligation of δεῖ and improves the idiomatic expression of ἀτακτέω. It preserves the source’s broad wording in the main text, retains the contextually narrower ‘idle’ alternative in the footnote, and places the footnote anchor directly after the relevant expression.
