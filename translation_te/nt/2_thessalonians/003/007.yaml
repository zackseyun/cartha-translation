id: 2TH.3.7
reference: 2 Thessalonians 3:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: αὐτοὶ γὰρ οἴδατε πῶς δεῖ μιμεῖσθαι ἡμᾶς, ὅτι οὐκ ἠτακτήσαμεν ἐν ὑμῖν
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/007.yaml
  text: For you yourselves know how you ought to imitate us[a], because we did not behave disorderly among you.
translation:
  language: te
  text: ఎందుకంటే, మమ్మల్ని ఎలా అనుకరించవలెనో మీకే తెలుసు; మేము మీ మధ్య క్రమం తప్పి ప్రవర్తించలేదు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ఈ సందర్భంలో మరింత నిర్దిష్టంగా: “మేము మీ మధ్య సోమరిగా ఉండలేదు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: మీకే
  rationale: కర్తలో అంతర్లీనంగా ఉన్న ‘మీరు’ను αὐτοὶ బలపరుస్తుంది. ‘మీకే’ ఆ ఉద్ఘాటనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి ఉపదేశానికి కారణం లేదా వివరణను పరిచయం చేసే అనుసంధానంగా పనిచేస్తుంది.
- source_word: οἴδατε
  choice: తెలుసు
  rationale: రూపంలో perfect అయినప్పటికీ οἶδα సాధారణంగా వర్తమానార్థాన్ని ఇస్తుంది.
- source_word: πῶς δεῖ μιμεῖσθαι ἡμᾶς
  choice: మమ్మల్ని ఎలా అనుకరించాలో
  rationale: δεῖ తెలియజేసే బాధ్యతను తెలుగు ‘-ఆలో’ నిర్మాణం సహజంగా వ్యక్తం చేస్తుంది; μιμεῖσθαι యొక్క వ్యక్తిగత కర్మ ‘మమ్మల్ని’ను అలాగే ఉంచుతుంది.
- source_word: ὅτι
  choice: ;
  rationale: ఇక్కడ ὅτι తదుపరి వాక్యాన్ని వివరణాత్మక ఆధారంగా పరిచయం చేస్తుంది. తెలుగులో పునరుక్తమైన కారణసూచకాన్ని బలవంతంగా చేర్చకుండా అర్ధవిరామంతో ఆ సంబంధాన్ని సహజంగా ఉంచాం.
- source_word: οὐκ ἠτακτήσαμεν
  choice: క్రమశిక్షణ లేకుండా ప్రవర్తించలేదు
  rationale: ἀτακτέω యొక్క విస్తృత భావమైన క్రమరాహిత్య లేదా నియమరహిత ప్రవర్తనను నిలుపుతుంది; సందర్భంలో ఉన్న సోమరితనం అనే సన్నని భావానికి ప్రధాన పాఠాన్ని పరిమితం చేయదు.
- source_word: ἐν ὑμῖν
  choice: మీ మధ్య
  rationale: థెస్సలొనీకయుల సమూహంలో వారి ప్రవర్తనను సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: సమీప సందర్భంలో ἀτακτέω అర్థం
  choice: క్రమశిక్షణ లేకుండా ప్రవర్తించడం అనే విస్తృత భావం
  alternative: మీ మధ్య సోమరిగా ఉండడం
  rationale: ఈ అధ్యాయంలో పని చేయకపోవడం ప్రధాన సందర్భాంశమైనప్పటికీ, పదం యొక్క అర్థపరిధి దానికంటే విస్తృతం. అందుచేత ప్రధాన పాఠంలో విస్తృత భావాన్ని ఉంచి, సందర్భానుగుణమైన సన్నని అర్థాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘అనుకరించాలో’ బాధ్యతను సంక్షిప్తంగా తెలియజేస్తుంది; ‘క్రమశిక్షణ లేకుండా’ మూలపదంలోని విస్తృత భావాన్ని కాపాడుతుంది.
