revisions:
- from: ఎందుకంటే, మమ్మల్ని ఎలా అనుకరించాలో మీకే తెలుసు; మేము మీ మధ్య క్రమశిక్షణ లేకుండా ప్రవర్తించలేదు.[a]
  to: ఎందుకంటే, మమ్మల్ని ఎలా అనుకరించవలెనో మీకే తెలుసు; మేము మీ మధ్య క్రమం తప్పి ప్రవర్తించలేదు[a].
  rationale: The revision explicitly renders the necessity/obligation of δεῖ and improves the idiomatic expression of ἀτακτέω. It preserves the source’s broad wording in the main text, retains the contextually narrower ‘idle’ alternative in the footnote, and places the footnote anchor directly after the relevant expression.
  reviewer_model: gpt-5.6-terra
