  text: ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/018.yaml
  text: The grace of our Lord Jesus Christ be with all of you[a].
translation:
  language: te
  text: మన ప్రభువైన యేసు క్రీస్తు కృప మీ అందరితో ఉండుగాక.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో ‘మీ అందరితో’ స్థానంలో ‘మీతో’ అని ఉంది.
    reason: 'పాఠాంతరం: SBLGNTలో ὑμῶν ముందు ఉన్న ⸀ గుర్తు ఈ స్థానంలో పాఠభేదాన్ని సూచిస్తుంది; πάντων పదం లేని పఠనం కూడా సాక్ష్యాల్లో ఉంది.'
lexical_decisions:
- source_word: χάρις
  choice: కృప
  rationale: పౌలు పత్రికల ఆశీర్వచనాల్లో దేవుడు క్రీస్తు ద్వారా చూపే అనుగ్రహాన్ని సూచించే స్థిరమైన పదం; తెలుగు క్రైస్తవ వాడుకలో సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: క్రీస్తు అధికారాన్నీ గౌరవాన్నీ తెలియజేసే బిరుదుగా κύριοςకు సాధారణమైన, సముచితమైన తెలుగు రూపం.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు క్రీస్తు
  rationale: Ἰησοῦςను పేరుగా ‘యేసు’ అని, Χριστόςను తెలుగు పాఠకులకు సుపరిచితమైన బిరుదు రూపం ‘క్రీస్తు’ అని ఇచ్చాం. ఇక్కడ సూత్రబద్ధమైన ముగింపు ఆశీర్వచనంలో ‘క్రీస్తు’ పేరు భాగంలా కూడా వినిపించినప్పటికీ దాని బిరుదు నేపథ్యం నిలిచి ఉంటుంది.
- source_word: μετὰ πάντων ὑμῶν
  choice: మీ అందరితో ఉండుగాక
  rationale: μετά + షష్ఠీ విభక్తిలోని ‘తో’ భావాన్ని, πάντων యొక్క సమగ్రతను నిలిపి, గ్రీకులో అధ్యాహారంగా ఉన్న ఆశీర్వచన క్రియను తెలుగులో ‘ఉండుగాక’తో సహజంగా వ్యక్తం చేశాం.
theological_decisions:
- issue: ముగింపు ఆశీర్వచనంలో Χριστοῦ అనువాదం
  choice: క్రీస్తు
  alternative: మెస్సీయ
  rationale: Χριστός మూలంగా ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదే అయినా, ఈ స్థిరమైన పౌలు ఆశీర్వచనంలో అది యేసు పేరుతో సన్నిహితంగా కలిసివుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘యేసు క్రీస్తు’ సహజంగా, గౌరవప్రదంగా ఉండి మూలపాఠంలోని క్రీస్తు బిరుదును సంప్రదాయంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; పత్రిక ముగింపుకు తగిన గౌరవప్రదమైన ఆశీర్వచన శైలి. ‘ఉండుగాక’ కొద్దిగా ఔపచారికమైనదైనా ఈ సందర్భంలో సహజం. పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
