translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘నడుచుకోవడం’ అనే మూల రూపకాన్ని యాంత్రికంగా ఉంచకుండా దాని జీవనవిధాన భావాన్ని ‘జీవించడం’తో తెలిపాం. ἀτάκτως యొక్క విస్తృత అర్థాన్ని ప్రధాన పాఠంలో ఉంచి, ‘పనిపాట లేకుండా’ అనే సన్నని ప్రత్యామ్నాయాన్ని పాదసూచనలో నిలిపాం.
