id: 2TH.3.11
reference: 2 Thessalonians 3:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀκούομεν γάρ τινας περιπατοῦντας ἐν ὑμῖν ἀτάκτως, μηδὲν ἐργαζομένους ἀλλὰ περιεργαζομένους·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/011.yaml
  text: For we hear that some among you are walking disorderly[a], doing no work at all[b], but meddling.
translation:
  language: te
  text: ఎందుకంటే, మీలో కొందరు క్రమశిక్షణ లేకుండా జీవిస్తున్నారని[a] మేము వింటున్నాం. వారు ఏ పనీ చేయకుండా[b], కాని ఇతరుల విషయాల్లో తలదూరుస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పనిపాట లేకుండా జీవిస్తున్నారని,” లేదా “క్రమం తప్పి ప్రవర్తిస్తున్నారని.” ఈ గ్రీకు పదం సంఘం ఆశించే క్రమానికి విరుద్ధమైన లేదా పనికి దూరంగా ఉండే ప్రవర్తనను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: 'గ్రీకులో ఇక్కడ పదచమత్కారం ఉంది: వారు “ఏ పనీ చేయడం లేదు,” కానీ తమకు సంబంధం లేని విషయాల చుట్టూ “పని చేస్తున్నారు”—అంటే ఇతరుల వ్యవహారాల్లో జోక్యం చేసుకుంటున్నారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούομεν
  choice: మేము వింటున్నాం
  rationale: వర్తమానకాలంలోని ప్రస్తుత సమాచారం లేదా కొనసాగుతున్న నివేదిక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి ఉపదేశానికి ఈ వాక్యం కారణం లేదా వివరణ ఇస్తున్న సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: τινας
  choice: కొందరు
  rationale: సమాజంలోని నిర్దిష్టంగా పేర్లు చెప్పని కొంతమందిని సూచిస్తుంది.
- source_word: περιπατοῦντας
  choice: జీవిస్తున్నారని
  rationale: ఇక్కడ ‘నడవడం’ అనేది జీవనవిధానం లేదా ప్రవర్తనకు రూపకం; ఆధునిక తెలుగులో అర్థం సహజంగా అందేందుకు ‘జీవిస్తున్నారు’ అని ఇచ్చాం.
- source_word: ἐν ὑμῖν
  choice: మీలో
  rationale: థెస్సలొనీక సంఘం మధ్య ఉన్నవారిని సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: ἀτάκτως
  choice: క్రమశిక్షణ లేకుండా
  rationale: క్రమానికి విరుద్ధంగా, అదుపు లేకుండా లేదా బాధ్యతారహితంగా ప్రవర్తించే విస్తృత భావాన్ని నిలుపుతుంది; కేవలం సోమరితనానికే పరిమితం చేయదు.
- source_word: μηδὲν ἐργαζομένους
  choice: ఏ పనీ చేయకుండా
  rationale: μηδέν ఇచ్చే సంపూర్ణ నిరాకరణను సహజమైన తెలుగులో బలంగా వ్యక్తం చేస్తుంది.
- source_word: ἀλλὰ
  choice: కాని భావాన్ని విరామచిహ్నం మరియు తదుపరి విరుద్ధ వాక్యభాగంతో వ్యక్తం చేయడం
  rationale: తెలుగు వాక్యంలో ‘చేయకుండా, ... తలదూరుస్తున్నారు’ అనే నిర్మాణమే పని చేయకపోవడం మరియు అనుచిత కార్యకలాపం మధ్య బలమైన వ్యత్యాసాన్ని సహజంగా చూపుతుంది.
- source_word: περιεργαζομένους
  choice: ఇతరుల విషయాల్లో తలదూరుస్తున్నారు
  rationale: ఇతరులకు సంబంధించిన వ్యవహారాల్లో అనవసరంగా జోక్యం చేసుకోవడం అనే భావాన్ని ప్రస్తుత సాధారణ తెలుగులో తెలియజేస్తుంది; ἐργάζομαιతో ఉన్న గ్రీకు పదచమత్కారం పాదసూచనలో వివరించబడింది.
