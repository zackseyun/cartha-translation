translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిని నిలుపుతూ అనువదించబడింది. ‘రొట్టె’ అనే మూలంలోని స్పష్టమైన పదాన్ని ప్రధాన పాఠ్యంలో ఉంచి, దాని విస్తృత సందర్భార్థాన్ని పాదటిప్పణిలో తెలిపింది.
