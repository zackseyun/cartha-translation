id: 2TH.3.8
reference: 2 Thessalonians 3:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδὲ δωρεὰν ἄρτον ἐφάγομεν παρά τινος, ἀλλ’ ἐν κόπῳ καὶ μόχθῳ ⸂νυκτὸς καὶ ἡμέρας⸃ ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/008.yaml
  text: nor did we eat bread from anyone free of charge[a], but with labor and hardship, working night and day so as not to burden any of you.
translation:
  language: te
  text: మేము ఎవరి నుండీ ఉచితంగా రొట్టె తినలేదు[a]; అయితే, మీలో ఎవరికీ భారంగా ఉండకూడదని రాత్రింబగళ్లు కష్టంతోనూ ప్రయాసతోనూ పనిచేశాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మేము ఎవరి రొట్టెనూ ఊరికే తినలేదు.” గ్రీకులో “రొట్టె” అని అక్షరార్థంగా ఉంది; అయితే అది విస్తృతంగా ఆహారాన్ని లేదా జీవనాధార సహాయాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δωρεὰν
  choice: ఉచితంగా
  rationale: ప్రతిఫలం లేదా చెల్లింపు లేకుండా పొందడం అనే ఆర్థిక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἄρτον
  choice: రొట్టె
  rationale: మూలంలోని నిర్దిష్టమైన ‘రొట్టె’ అనే రూపకాన్ని నిలుపుతుంది; సందర్భంలో ఇది ఆహారం లేదా జీవనాధార సహాయాన్ని విస్తృతంగా సూచించవచ్చు.
- source_word: παρά τινος
  choice: ఎవరి దగ్గరా
  rationale: παρά + షష్ఠీ విభక్తిలోని మూలం లేదా వ్యక్తి నుండి అనే భావాన్ని, నిరాకరణతో కలిపి సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν κόπῳ καὶ μόχθῳ
  choice: కష్టంతోనూ ప్రయాసతోనూ
  rationale: రెండు సమీపార్థక పదాల సంచిత బలాన్ని ఉంచుతూ శ్రమ తీవ్రతను, దానితో కూడిన ఇబ్బందిని తెలియజేస్తుంది.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: రాత్రింబగళ్లు
  rationale: రాత్రి, పగలు అంతటా కొనసాగిన శ్రమను తెలిపే సహజమైన తెలుగు నుడికారం.
- source_word: ἐργαζόμενοι
  choice: పనిచేశాము
  rationale: స్వయంపోషణకు సంబంధించిన సందర్భంలో క్రియాత్మక శ్రమను సూటిగా తెలియజేస్తుంది; గ్రీకు అసమాపక క్రియను తెలుగులో సహజమైన సమాపక వాక్యంగా మార్చింది.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί
  choice: భారంగా ఉండకూడదని
  rationale: ఉద్దేశాన్ని స్పష్టంగా వ్యక్తం చేస్తూ, ఇతరులపై ఆర్థిక లేదా భౌతిక భారం మోపకపోవడం అనే సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: τινα ὑμῶν
  choice: మీలో ఎవరికీ
  rationale: ఒక్క వ్యక్తికైనా అనే పంపిణీ భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: οὐδὲ ... ἀλλ’
  choice: తినలేదు ... దానికి బదులుగా
  rationale: ఉచిత సహాయం స్వీకరించకపోవడానికి, స్వయంగా తీవ్రంగా పనిచేయడానికి మధ్యనున్న బలమైన వ్యత్యాసాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
