  yaml_path: translation/nt/2_thessalonians/003/013.yaml
  text: But as for you[a], brothers, do not grow weary in doing good.
translation:
  language: te
  text: అయితే, సహోదరులారా,[a] మీరు మేలు చేయడంలో అలసిపోకండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సహోదర సహోదరీలారా”; గ్రీకులో “సహోదరులారా” అని ఉంది; ఈ పదం మొత్తం విశ్వాస సమాజాన్ని ఉద్దేశించి సమ్మిళిత అర్థంలో వాడబడవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: అయితే … మీరు
  rationale: δέ ముందున్న సోమరుల గురించిన చర్చకు భేదాన్ని సూచిస్తుంది; ముందుకు వచ్చిన ὑμεῖςకు ఉన్న ఉద్ఘాటనను ‘మీరు’తో నిలుపుతూ, తెలుగులో సహజమైన వాక్యక్రమాన్ని వాడాం.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: గ్రీకు సంబోధన బహువచనం అక్షరార్థంగా ‘సోదరులు’; గౌరవప్రదమైన ఆధునిక తెలుగు సంఘ సంబోధనగా ‘సహోదరులారా’ ఎంచుకున్నాం. ఇది మొత్తం విశ్వాస సమాజాన్ని ఉద్దేశించవచ్చని పాదటిప్పణిలో తెలిపాం.
- source_word: μὴ ἐγκακήσητε
  choice: అలసిపోకండి
  rationale: μήతో ఉన్న aorist subjunctive నిషేధాన్ని వ్యక్తం చేస్తుంది. ἐγκακέω కొనసాగుతున్న పనిలో అలసిపోవడం లేదా ధైర్యం కోల్పోవడం అనే భావాన్ని ఇక్కడ ఇస్తుంది; సందర్భానికి ‘అలసిపోకండి’ సహజంగా సరిపోతుంది.
- source_word: καλοποιοῦντες
  choice: మేలు చేయడంలో
  rationale: వర్తమాన కృదంతం వారు నిరంతరం కొనసాగించవలసిన మంచి కార్యాల పరిధిని సూచిస్తుంది; ‘మేలు చేయడంలో’ ఆ కొనసాగింపు భావాన్ని సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: సంఘాన్ని ఉద్దేశించిన ἀδελφοί అనువాదం
  choice: సహోదరులారా
  alternative: సహోదర సహోదరీలారా
  rationale: గ్రీకు రూపం పుంలింగ బహువచనమైనప్పటికీ, పౌలు వాడుకలో అది స్త్రీపురుషులతో కూడిన మొత్తం విశ్వాస సమాజాన్ని చేర్చవచ్చు. మూల రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని సమ్మిళిత ప్రయోగాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంఘ సంబోధనను వాడాం. మూలంలోని భేద సూచన, ఉద్ఘాటన, కొనసాగుతున్న మేలు చేసే కార్యం అన్నింటినీ సంక్షిప్తంగా నిలిపాం.
