source:
  edition: SBLGNT
  text: οὐχ ὅτι οὐκ ἔχομεν ἐξουσίαν, ἀλλ’ ἵνα ἑαυτοὺς τύπον δῶμεν ὑμῖν εἰς τὸ μιμεῖσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/009.yaml
  text: not because we do not have the right, but in order to give ourselves to you as an example for you to imitate us.
translation:
  language: te
  text: మాకు హక్కు[a] లేదని కాదు; మీరు మమ్మల్ని అనుకరించడానికి మమ్మల్ని మేమే మీకు మాదిరిగా[b] చూపించేందుకే మేము అలా చేశాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అధికారం’ లేదా ‘శక్తి.’ ఈ సందర్భంలో న్యాయంగా పొందగల అర్హత అనే భావమే ఎక్కువగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నమూనాగా’ లేదా ‘ఆదర్శంగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: ఆ హక్కు
  rationale: సందర్భం భౌతిక సహాయం పొందడానికి వారికి ఉన్న న్యాయమైన అర్హతను సూచిస్తుంది; సాధారణ అధికారాన్ని లేదా శక్తిని కాదు. ‘ఆ’ అనేది ముందున్న సందర్భంలోని సహాయం పొందే హక్కును సూచిస్తుంది.
- source_word: ἑαυτοὺς
  choice: మమ్మల్ని మేమే
  rationale: పౌలు, అతని సహచరులు తమనే ఉద్దేశిస్తున్న ప్రతిబింబ సర్వనామ బలాన్ని నిలుపుతుంది.
- source_word: τύπον
  choice: ఒక మాదిరిగా
  rationale: అనుసరించదగిన ప్రవర్తనా నమూనా అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δῶμεν
  choice: చూపించాలనే
  rationale: ἑαυτοὺς τύπον δῶμεν అనే గ్రీకు నుడికారాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, తమను తాము అనుసరించదగిన మాదిరిగా సమర్పించుకోవడం అనే భావాన్ని నిలుపుతుంది.
- source_word: εἰς τὸ μιμεῖσθαι ἡμᾶς
  choice: మీరు మమ్మల్ని అనుకరించేలా
  rationale: అనుకరించడం అనే ప్రత్యక్ష భావంతో పాటు ఉద్దేశాన్ని కూడా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐχ ὅτι οὐκ ... ἀλλ’ ἵνα
  choice: లేదని కాదు; ... అనే
  rationale: కారణాన్ని నిరాకరించి అసలు ఉద్దేశాన్ని తెలిపే గ్రీకు వ్యతిరేక నిర్మాణాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ἐξουσίαν సూచించే హక్కు స్వభావం
  choice: పౌలు, అతని సహచరులు భౌతిక సహాయం పొందడానికి తమకు న్యాయమైన హక్కు ఉందని చెబుతున్నారు.
  alternative: ఇది విస్తృతమైన అపొస్తల అధికారాన్ని లేదా శక్తిని సూచిస్తుందని అర్థం చేసుకోవచ్చు.
  rationale: తక్షణ సందర్భంలో ఇతరులకు భారంగా ఉండకుండా పనిచేయడం గురించే ఉంది. కాబట్టి ఇక్కడ సహాయం పొందే న్యాయమైన హక్కు ప్రధాన భావం; విస్తృతమైన అధికార సిద్ధాంతాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ముందరి వచనంలో చెప్పిన పనిచేయడాన్ని సూచించడానికి చివర ‘అలా చేశాము’ అని స్పష్టపరచబడింది; ఇది కొత్త కార్యాన్ని చేర్చకుండా గ్రీకు వాక్యంలో సందర్భానుసారంగా ఉన్న క్రియను తెలుగులో పూర్తిచేస్తుంది.
