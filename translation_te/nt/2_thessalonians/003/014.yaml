revisions:
- from: ఎవరైనా ఈ పత్రిక ద్వారా తెలియజేసిన మా మాటకు లోబడకపోతే, అతణ్ణి గుర్తుపెట్టుకోండి[b]; అతనితో సహవాసం చేయకండి[c], తద్వారా అతడు సిగ్గుపడతాడు[a].
  to: ఎవరైనా ఈ పత్రిక ద్వారా తెలియజేసిన మా మాటకు లోబడకపోతే, అతణ్ణి గుర్తించండి[b]; అతనితో సహవాసం చేయకండి[c], అతనికి సిగ్గు కలిగేలా[a].
  rationale: The revision retains the draft's sound rendering of the letter as the means through which the apostolic instruction is communicated and its non-technical rendering of social disassociation. It corrects the purpose-force of ἵνα ἐντραπῇ with ‘అతనికి సిగ్గు కలిగేలా’ and sharpens the rendering of σημειοῦσθε to ‘అతణ్ణి గుర్తించండి.’ Footnote anchors remain valid and each has a corresponding footnote.
  reviewer_model: gpt-5.6-terra
