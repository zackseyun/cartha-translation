reference: 2 Thessalonians 3:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἰ δέ τις οὐχ ὑπακούει τῷ λόγῳ ἡμῶν διὰ τῆς ἐπιστολῆς, τοῦτον σημειοῦσθε, ⸀μὴ ⸀συναναμίγνυσθαι αὐτῷ, ἵνα ἐντραπῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/014.yaml
  text: And if anyone does not obey our word through this letter[a], take note of that person; do not associate with him[d][c][b], so that he may be ashamed.
translation:
  language: te
  text: ఎవరైనా ఈ పత్రిక ద్వారా తెలియజేసిన మా మాటకు లోబడకపోతే, అతణ్ణి గుర్తించండి[b]; అతనితో సహవాసం చేయకండి[c], అతనికి సిగ్గు కలిగేలా[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతడు సిగ్గుపడేలా.’ ఇక్కడి గ్రీకు క్రియ సిగ్గు కలగడం లేదా సిగ్గుపడే స్థితికి రావడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతణ్ణి గుర్తుపెట్టుకోండి’ లేదా ‘అతనిపై దృష్టి ఉంచండి.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘అతనితో కలిసిమెలిసి ఉండకండి.’ దీని ఉద్దేశం సరిదిద్దడమే; 15వ వచనంలో అతణ్ణి ఇంకా ‘సహోదరునిగా’ హెచ్చరించాలని ఉంది.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ὑπακούει
  choice: లోబడకపోతే
  rationale: ὑπακούω ఇక్కడ అధికారంతో ఇచ్చిన ఉపదేశానికి విధేయత చూపడాన్ని సూచిస్తుంది; ‘లోబడు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: τῷ λόγῳ ἡμῶν
  choice: మా మాటకు
  rationale: λόγος ఇక్కడ అపొస్తలుల ఉపదేశాన్ని సూచిస్తుంది. ‘మా మాట’ గ్రీకు రూపాన్ని నిలుపుతూ తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: διὰ τῆς ἐπιστολῆς
  choice: ఈ పత్రిక ద్వారా తెలియజేసిన
  rationale: διά + షష్ఠీ విభక్తి సాధనం లేదా మాధ్యమాన్ని సూచిస్తుంది. ‘ఈ పత్రిక ద్వారా తెలియజేసిన’ అనే నిర్మాణం ఆ మాట పత్రిక మాధ్యమంగా అందిందనే సంబంధాన్ని స్పష్టం చేస్తుంది; ‘ఈ’ అనేది ప్రస్తుత పత్రికను సందర్భానుసారంగా సూచిస్తుంది.
- source_word: σημειοῦσθε
  choice: గుర్తుపెట్టుకోండి
  rationale: మధ్యమపద ఆజ్ఞారూపం ఆ వ్యక్తిని గుర్తించి గమనంలో ఉంచాలని చెబుతుంది. ‘గుర్తుపెట్టుకోండి’ అనవసరంగా శిక్షాత్మక భావం కలిగించకుండా ఆ ఆదేశాన్ని అందిస్తుంది.
- source_word: τοῦτον
  choice: అతణ్ణి
  rationale: ఈ సూచన సర్వనామం విధేయత చూపని నిర్దిష్ట వ్యక్తిని తిరిగి సూచిస్తుంది.
- source_word: μὴ συναναμίγνυσθαι αὐτῷ
  choice: అతనితో సహవాసం చేయకండి
  rationale: συναναμίγνυμι కలిసిమెలిసి ఉండడం లేదా సాంగత్యం చేయడాన్ని సూచిస్తుంది. ‘సహవాసం చేయకండి’ సంఘసంబంధమైన దూరాన్ని తెలియజేస్తుంది గాని తరువాతి కాలపు సాంకేతిక బహిష్కరణ పదజాలాన్ని రుద్దదు.
- source_word: ἐντραπῇ
  choice: అతడు సిగ్గుపడతాడు
  rationale: నిష్క్రియార్థక సంభావనారూపం ఇక్కడ ఉద్దేశించిన ఫలితాన్ని సూచిస్తుంది. తెలుగు ఉద్దేశార్థక ‘తద్వారా’ నిర్మాణంలో ‘సిగ్గుపడతాడు’ సహజంగా ఉండి, అవమానించడమే లక్ష్యమని అతిశయింపదు.
- source_word: τις
  choice: ఎవరైనా
  rationale: అనిర్దిష్ట సర్వనామం సాధారణ షరతును వ్యక్తం చేస్తుంది; ‘ఎవరైనా’ దాని విస్తృత పరిధిని సహజంగా నిలుపుతుంది.
- source_word: αὐτῷ
  choice: అతనితో
  rationale: గ్రీకు పుంలింగ ఏకవచన సర్వనామం τις ద్వారా సూచించిన వ్యక్తినే తిరిగి సూచిస్తుంది.
theological_decisions:
- issue: μὴ συναναμίγνυσθαι αὐτῷ ఆజ్ఞలోని క్రమశిక్షణ చర్య స్వభావం
  choice: అవిధేయుడైన విశ్వాసిని సరిదిద్దడానికి ఉద్దేశించిన సంఘసంబంధమైన సహవాస నిరాకరణ
  alternative: అత్యంత అధికారిక భావంలో సంపూర్ణ బహిష్కరణ; లేదా సంఘపరమైన అర్థం లేని సాధారణ వ్యక్తిగత దూరం
  rationale: తక్షణ సందర్భంలో, ముఖ్యంగా 15వ వచనంలో, అతణ్ణి శత్రువుగా కాక సహోదరునిగా హెచ్చరించాలని ఉంది. అందువల్ల ‘సహవాసం చేయకండి’ సరిదిద్దే గంభీరతను నిలుపుతూ తరువాతి సంఘ న్యాయపరమైన సాంకేతిక వర్గీకరణను చేర్చదు.
- issue: ἐντραπῇ యొక్క ఉద్దేశార్థం
  choice: సరిదిద్దడానికి దారితీసే సిగ్గు కలగడం
  alternative: అవమానించడమే అంతిమ లక్ష్యంగా బహిరంగ పరాభవం
  rationale: ఉద్దేశార్థక వాక్యం మరియు తరువాతి వచనం ఈ సిగ్గును పరిహారాత్మకంగా చూపుతాయి. అనువాదం నైతిక గంభీరతను నిలుపుతూ ప్రతీకార అవమాన భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పత్రిక’, ‘లోబడు’, ‘సహవాసం’ వంటి బైబిలు సందర్భానికి తగిన పరిచిత పదాలను ఉపయోగించాం; సాంకేతిక సంఘన్యాయ పదజాలాన్ని నివారించాం. ప్రధాన పాఠంలోని ప్రతి పాదసూచిక గుర్తుకు అనుగుణమైన పాదసూచిక ఇవ్వబడింది.
