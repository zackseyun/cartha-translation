revisions:
- from: సోదరులారా,[a] మీ విషయమై మేము ఎల్లప్పుడూ దేవునికి కృతజ్ఞతలు చెల్లించాలి. అలా చేయడం సముచితమే. ఎందుకంటే మీ విశ్వాసం అపారంగా వృద్ధి చెందుతోంది,[b] మీలో ప్రతి ఒక్కరూ ఒకరిపట్ల ఒకరు చూపే ప్రేమ అంతకంతకు పెరుగుతోంది.[c]
  to: సోదరులారా,[a] మీ విషయమై మేము ఎల్లప్పుడూ దేవునికి కృతజ్ఞతలు చెల్లించాలి. అలా చేయడం సముచితమే. ఎందుకంటే మీ విశ్వాసం అపారంగా వృద్ధి చెందుతోంది,[b] మీలో ప్రతి ఒక్కరూ ఒకరిపట్ల ఒకరు చూపే ప్రేమ అంతకంతకు పెరుగుతోంది.[c]
  rationale: ప్రధాన పాఠ్యానికి సురక్షితమైన మార్పు అవసరం లేదు. గ్రీకులోని ἑνὸς ἑκάστου πάντων ὑμῶν యొక్క ‘ప్రతి ఒక్కరి’ అనే స్వత్వార్థాన్ని పాదటిప్పణి [c]లో స్పష్టంగా సవరించాం; ఈ మార్పు నిర్మాణాత్మకంగానూ అర్థపరంగానూ పాదటిప్పణిని మెరుగుపరుస్తుంది.
