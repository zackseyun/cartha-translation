id: 2TH.1.3
reference: 2 Thessalonians 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εὐχαριστεῖν ὀφείλομεν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοί, καθὼς ἄξιόν ἐστιν, ὅτι ὑπεραυξάνει ἡ πίστις ὑμῶν καὶ πλεονάζει ἡ ἀγάπη ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/003.yaml
  text: We ought always to give thanks to God for you[a], brothers, as is fitting, because your faith is growing abundantly and the love of each and every one of you for one another is increasing[c][b],
translation:
  language: te
  text: సోదరులారా,[a] మీ విషయమై మేము ఎల్లప్పుడూ దేవునికి కృతజ్ఞతలు చెల్లించాలి. అలా చేయడం సముచితమే. ఎందుకంటే మీ విశ్వాసం అపారంగా వృద్ధి చెందుతోంది,[b] మీలో ప్రతి ఒక్కరూ ఒకరిపట్ల ఒకరు చూపే ప్రేమ అంతకంతకు పెరుగుతోంది.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సోదర సోదరీమణులారా.” గ్రీకులో “సోదరులు” అని ఉంది; ఈ సంబోధన స్త్రీపురుషులతో కూడిన విశ్వాస సమాజమంతటినీ ఉద్దేశించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీ విశ్వసనీయత అపారంగా వృద్ధి చెందుతోంది.” గ్రీకు పదానికి “విశ్వాసం,” “నమ్మకం,” లేదా “విశ్వసనీయత” అనే అర్థాలు ఉండవచ్చు; ఇక్కడ “విశ్వాసం” ప్రధాన అనువాదం.
    reason: alternative_reading
  - marker: c
    text: మరింత అక్షరార్థంగా, “మీ అందరిలో ప్రతి ఒక్కరి ఒకరిపట్ల ఒకరికి ఉన్న ప్రేమ.”
    reason: previous_rendering
lexical_decisions:
- source_word: Εὐχαριστεῖν ὀφείλομεν
  choice: మేము ... కృతజ్ఞతలు చెల్లించాలి
  rationale: కృతజ్ఞతలు తెలపడం తమ బాధ్యత, సముచిత కర్తవ్యం అని వక్తలు భావిస్తున్నారనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ὀφείλομεν ను సంపూర్ణ అనివార్యతగా అతిశయింపజేయదు.
- source_word: πάντοτε περὶ ὑμῶν
  choice: మీ విషయమై ... ఎల్లప్పుడూ
  rationale: περί ఇక్కడ కృతజ్ఞతార్పణ సూత్రంలో వారి నిమిత్తం లేదా వారి విషయమై అనే భావం ఇస్తుంది; తెలుగు వాక్యంలో ‘మీ విషయమై’ మూలంలోని సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: మూలంలోని పుంలింగ బహువచన సంబోధనను నిలుపుతుంది; ఇది విశ్వాస సమాజమంతటికీ వర్తించగల ప్రతినిధి సంబోధన అనే విషయాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: καθὼς ἄξιόν ἐστιν
  choice: అలా చేయడం సముచితమే
  rationale: ఇక్కడ ἄξιον కృతజ్ఞతలు చెల్లించడం తగినది, యుక్తమైనది అనే భావాన్ని ఇస్తుంది. ‘సముచితం’ గౌరవప్రదమైనదిగానూ సాధారణ పాఠకులకు అర్థమయ్యేదిగానూ ఉంది.
- source_word: ὑπεραυξάνει ἡ πίστις ὑμῶν
  choice: మీ విశ్వాసం అపారంగా వృద్ధి చెందుతోంది
  rationale: ὑπεραυξάνει లోని సాధారణ పెరుగుదలను మించిన తీవ్రతను ‘అపారంగా వృద్ధి చెందుతోంది’ తెలియజేస్తుంది; πίστις కు సందర్భానుగుణ సాధారణ ఎంపికగా ‘విశ్వాసం’ వాడబడింది.
- source_word: πλεονάζει ἡ ἀγάπη
  choice: ప్రేమ అంతకంతకు పెరుగుతోంది
  rationale: ప్రేమ సమృద్ధిగా అధికమవుతోందనే వర్తమాన, కొనసాగుతున్న భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους
  choice: మీలో ప్రతి ఒక్కరూ ఒకరిపట్ల ఒకరు చూపే
  rationale: గ్రీకులోని ప్రతి వ్యక్తినీ విడివిడిగా నొక్కిచెప్పే భావాన్ని ‘ప్రతి ఒక్కరూ’ నిలుపుతుంది; εἰς ἀλλήλους లోని పరస్పర దిశను ‘ఒకరిపట్ల ఒకరు’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: πίστις యొక్క అర్థం
  choice: విశ్వాసం
  alternative: విశ్వసనీయత; నమ్మకం
  rationale: ఈ సందర్భంలో థెస్సలొనీకయుల విశ్వాసం వృద్ధి చెందడమే సహజమైన భావం. అయితే πίστις పదానికి విశ్వసనీయత లేదా నమ్మకం అనే భావ ఛాయలు కూడా ఉండగలవు కాబట్టి వాటిని పాదటిప్పణిలో నిలిపాం.
- issue: మిశ్రిత విశ్వాస సమాజానికి ἀδελφοί అనే సంబోధన
  choice: సోదరులారా
  alternative: సోదర సోదరీమణులారా
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది స్త్రీపురుషులతో కూడిన విశ్వాస సమాజమంతటినీ ఉద్దేశించగలదనే సమగ్ర పరిధిని పాదటిప్పణిలో స్పష్టం చేశాం.
- issue: ἑνὸς ἑκάστου πάντων ὑμῶν లోని ఉద్ఘాటన
  choice: మీలో ప్రతి ఒక్కరూ
  alternative: మీ అందరిలో ఒక్కొక్కరి ప్రేమ
  rationale: గ్రీకు పదబంధంలోని విస్తృతమైన పునరుక్తిని తెలుగులో అక్షరాలా అనుసరిస్తే వాక్యం కృతకంగా ఉంటుంది. ‘మీలో ప్రతి ఒక్కరూ’ ప్రతి సభ్యుడినీ మినహాయింపు లేకుండా నొక్కిచెప్పే భావాన్ని సహజంగా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సంఘ పఠనానికి అనువైన శైలి. మూలంలోని రెండు పెరుగుదల క్రియల తీవ్రతను ‘అపారంగా వృద్ధి చెందుతోంది’ మరియు ‘అంతకంతకు పెరుగుతోంది’ అనే వేర్వేరు సహజ ప్రయోగాలతో నిలిపాం. పొడవైన గ్రీకు వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం.
