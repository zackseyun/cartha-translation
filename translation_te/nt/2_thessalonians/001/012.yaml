  terminology: “ప్రభువు,” “నామం,” “మహిమపరచబడుట,” “కృప,” and “మెస్సీయ” are appropriate. The final coordinated genitive is retained compactly, and the footnote continues to document the disputed scope without deciding it in the main text.
