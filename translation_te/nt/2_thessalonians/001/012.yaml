id: 2TH.1.12
reference: 2 Thessalonians 1:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅπως ἐνδοξασθῇ τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν ὑμῖν, καὶ ὑμεῖς ἐν αὐτῷ, κατὰ τὴν χάριν τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/012.yaml
  text: so that the name of our Lord Jesus may be glorified in you[a], and you in him[c][b], according to the grace of our God and the Lord Jesus the Messiah.
translation:
  language: te
  text: మన ప్రభువైన యేసు నామం మీలో[a] మహిమపరచబడునట్లుగాను, మీరు ఆయనలో మహిమపరచబడునట్లుగాను, మన దేవుని మరియు ప్రభువైన యేసు మెస్సీయ[b] కృపను బట్టి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మీలో” అనే గ్రీకు వ్యక్తీకరణకు ఈ సందర్భంలో “మీ మధ్య” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “మెస్సీయ” స్థానంలో “క్రీస్తు” అని కూడా అనువదించవచ్చు. గ్రీకు బిరుదు Χριστός.
    reason: alternative_reading
  - marker: c
    text: చివరి గ్రీకు పదబంధాన్ని “మన దేవుడు మరియు ప్రభువు అయిన యేసు మెస్సీయ” అని ఒకే వ్యక్తితో సన్నిహితంగా అనుసంధానించిన భావంలోనూ, “మన దేవుడు” మరియు “ప్రభువైన యేసు మెస్సీయ” అని వేర్వేరు సూచనలుగానూ అర్థం చేసుకోవచ్చు. ప్రధాన పాఠం ఈ ప్రశ్నను బలవంతంగా తేల్చదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: ఇది జరుగాలని
  rationale: ముందటి వచనంలోని ప్రార్థనకు ఉద్దేశం లేదా ఆశించిన ఫలితాన్ని సూచిస్తుంది. తెలుగు వాక్యాంతంలోని ఈ రూపం గ్రీకు ఉద్దేశార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐνδοξασθῇ
  choice: మహిమపరచబడటానికి
  rationale: అయోరిస్ట్ పాసివ్ సబ్జంక్టివ్ భావాన్ని, అలాగే δοξ- పదకుటుంబంలోని గంభీరమైన దైవశాస్త్రార్థాన్ని నిలుపుతుంది.
- source_word: τὸ ὄνομα
  choice: నామం
  rationale: వ్యక్తి వెల్లడైన స్వరూపం, ప్రతిష్ఠ అనే విస్తృత బైబిలు భావం ఉన్నప్పటికీ, మూలంలోని ‘నామం’ అనే రూపకాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: మన ప్రభువైన యేసు
  rationale: κύριοςను ‘ప్రభువు’గా ఉంచుతూ, స్వామ్యసంబంధం మరియు బిరుదును సహజమైన తెలుగు క్రమంలో వ్యక్తం చేస్తుంది.
- source_word: ἐν ὑμῖν
  choice: మీలో
  rationale: వ్యక్తులలోనూ సమూహం మధ్యనూ అనే రెండు సందర్భోచిత ఛాయలను తెలుగు ‘మీలో’ కొంతవరకు మోయగలదు; ప్రత్యామ్నాయ భావం పాదసూచికలో ఇవ్వబడింది.
- source_word: καὶ ὑμεῖς ἐν αὐτῷ
  choice: మీరు ఆయనలో
  rationale: పరస్పర మహిమపరచబడే సమాంతర నిర్మాణాన్ని నిలుపుతుంది. αὐτῷ పుంలింగ రూపం కావడం వల్ల అది ప్రభువైన యేసును సూచిస్తుందని తీసుకోబడింది.
- source_word: κατὰ τὴν χάριν
  choice: కృపకు అనుగుణంగా
  rationale: κατά ఇక్కడ ప్రమాణం లేదా ఆధారాన్ని సూచిస్తుంది. ‘అనుగుణంగా’ అనేది సాధనార్థాన్ని అనవసరంగా బలవంతం చేయకుండా సహజమైన తెలుగులో భావాన్ని అందిస్తుంది.
- source_word: χάριν
  choice: కృప
  rationale: పౌలు పత్రికల సందర్భంలో χάριςకు స్థిరమైన, దైవశాస్త్రపరంగా తగిన తెలుగు పదం.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός బిరుదుగా పనిచేస్తుంది; ‘మెస్సీయ’ దాని అభిషిక్తుడనే బిరుదార్థాన్ని నిలుపుతుంది.
- source_word: τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ
  choice: మన దేవుని మరియు ప్రభువైన యేసు మెస్సీయ
  rationale: గ్రీకు పదబంధంలోని సన్నిహిత అనుసంధానాన్ని ఉంచి, ఒకే వ్యక్తిని సూచిస్తుందా లేక ఇద్దరిని వేరుగా సూచిస్తుందా అనే చర్చనీయాంశాన్ని ప్రధాన పాఠంలో అదనపు వివరణతో బలవంతంగా తేల్చదు.
theological_decisions:
- issue: Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో పదం స్థిరనామం కంటే బిరుదుగా పనిచేస్తుంది; అందువల్ల బిరుదు భావాన్ని వెల్లడించే ‘మెస్సీయ’ను ఎంచుకున్నాం.
- issue: αὐτῷ ఎవరిని సూచిస్తుంది
  choice: ఆయనలో—ప్రభువైన యేసులో
  alternative: దానిలో—నామంలో
  rationale: పుంలింగ సర్వనామం మరియు ప్రభువు విశ్వాసులలో, విశ్వాసులు ఆయనలో మహిమపరచబడే సమాంతర నిర్మాణం యేసునే సూచించే పఠనానికి బలమైన ఆధారం ఇస్తాయి.
- issue: చివరి షష్ఠీ విభక్తి పదబంధం యొక్క సంబంధం
  choice: గ్రీకు పదబంధంలోని సన్నిహిత అనుసంధానాన్ని నిర్ణయాత్మక విస్తరణ లేకుండా ఉంచడం
  alternative: ‘మన దేవుడు’ మరియు ‘ప్రభువైన యేసు మెస్సీయ’ అనే ఇద్దరు వేరు సూచితులుగా స్పష్టీకరించడం
  rationale: ఒకే ఆర్టికల్‌తో θεοῦ మరియు κυρίου Ἰησοῦ Χριστοῦను καί కలపడం సన్నిహిత వ్యాకరణ సంబంధాన్ని కలిగిస్తుంది; అయినా దాని సూచనపై చర్చ ఉన్నందున తెలుగు పాఠం ప్రశ్నను మౌనంగా తీర్చకుండా, పాదసూచికలో రెండు అవగాహనలను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే పత్రికా శైలికి తగిన గౌరవభరితమైన ధోరణితో రూపొందించబడింది. ‘నామం’, ‘ప్రభువు’, ‘కృప’, ‘మహిమపరచబడటం’ వంటి స్థిర బైబిలు పదజాలాన్ని ఉంచి, వాక్య నిర్మాణాన్ని తెలుగు సహజత్వానికి అనుగుణంగా మార్చాం.
