  source_fidelity: 'The draft accurately represents the central reciprocal purpose: the Lord Jesus’ name is glorified in the recipients and they in him. However, the added terminal phrase “ఇది జరుగాలని” is not represented in Greek and makes the purpose construction syntactically less direct. A finite Telugu purpose form better reflects ὅπως with the two passive subjunctives.'
