  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: te
  text: తండ్రియైన దేవుని నుండియు ప్రభువైన యేసు మెస్సీయ[a] నుండియు మీకు కృప, సమాధానం కలుగుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యేసు క్రీస్తు.’ గ్రీకు Χριστός అనే బిరుదును ‘క్రీస్తు’ లేదా ‘మెస్సీయ’ అని అనువదించవచ్చు; ఇక్కడ ‘మెస్సీయ’ దాని బిరుదు భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: కృప
  rationale: పౌలు శుభవచనాలలో ఇది అభివాద భావాన్నీ, దేవుని అనుగ్రహమనే వేదాంతపరమైన భావాన్నీ నిలుపుతుంది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: ఆశీర్వాద శుభవచనంలో గ్రీకు చతుర్థీ విభక్తికి సహజమైన తెలుగు రూపం.
- source_word: εἰρήνη
  choice: సమాధానం
  rationale: శాంతితోపాటు క్షేమం, సంపూర్ణ మేలు అనే నేపథ్య భావాన్ని మోసే స్థిరమైన బైబిలు పదం.
- source_word: ἀπὸ
  choice: నుండియు
  rationale: కృపకూ సమాధానానికీ మూలాన్ని సూచిస్తుంది; సముచ్చయ నిర్మాణాన్ని తెలుగులో స్పష్టంగా ఉంచేందుకు రెండు సంబంధిత నామబంధాలతో పునరుక్తి చేయబడింది.
- source_word: θεοῦ πατρὸς
  choice: తండ్రియైన దేవుడు
  rationale: ముద్రిత గ్రీకు పాఠంలో ‘మన’ అనే పదం లేదు. తెలుగు వ్యాకరణానికి అది అవసరం కానందున జోడించకుండా, తండ్రి అనే సంబంధపూర్వక బిరుదును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριος యొక్క బిరుదు భావాన్నీ, నూతన నిబంధనలో స్థిరపడిన ప్రయోగాన్నీ నిలుపుతుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστόςను కేవలం పేరులో భాగంగా కాక, అభిషిక్తుడనే బిరుదుగా అర్థవంతంగా చూపుతుంది.
theological_decisions:
- issue: గ్రీకు పాఠంలో స్పష్టంగా లేని ‘మన’ అనే సర్వనామాన్ని ‘తండ్రి’ ముందు చేర్చాలా
  choice: ‘మన’ను చేర్చకుండా ‘తండ్రియైన దేవుడు’ అని అనువదించడం
  alternative: ‘మన తండ్రియైన దేవుడు’
  rationale: SBLGNT పాఠంలో ἡμῶν లేదు; తెలుగులో సహజమైన వాక్యానికి సర్వనామాన్ని సరఫరా చేయాల్సిన అవసరం లేదు. అందువల్ల సంబంధ భావాన్ని నిలుపుతూ పాఠానికి మించిన స్పష్టీకరణను నివారిస్తుంది.
- issue: Χριστόςను ఎలా వ్యక్తం చేయాలి
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ వ్యక్తి బిరుదు భావం ఇంకా గ్రాహ్యంగా ఉంది. ‘మెస్సీయ’ ఆ బిరుదు అర్థాన్ని ముందుకు తెస్తుంది; సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన పత్రికా-శుభవచన శైలి. మూలంలోని నామవాక్య ఆశీర్వాదాన్ని తెలుగులో సహజంగా పూర్తిచేయడానికి ‘కలుగుగాక’ ఉపయోగించబడింది. ‘మన’ను జోడించలేదు; మూలంలోని రెండు దాతల సమన్వయాన్ని స్పష్టంగా చూపేందుకు ‘నుండియు’ పునరుక్తమైంది.
