source:
  edition: SBLGNT
  text: ἐν ⸂φλογὶ πυρός⸃, διδόντος ἐκδίκησιν τοῖς μὴ εἰδόσι θεὸν καὶ τοῖς μὴ ὑπακούουσιν τῷ εὐαγγελίῳ τοῦ κυρίου ἡμῶν Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/008.yaml
  text: in flaming fire[a], inflicting vengeance on those who do not know God and on those who do not obey the gospel of our Lord Jesus[b],
translation:
  language: te
  text: మండుతున్న అగ్నిలో[a], దేవుణ్ణి తెలియని వారికి, మన ప్రభువైన యేసు సువార్తకు లోబడని వారికి ఆయన ప్రతీకారాన్ని విధిస్తాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అగ్నిజ్వాలలో.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ప్రతీకారాన్ని అమలు చేస్తాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν φλογὶ πυρός
  choice: మండుతున్న అగ్నిలో
  rationale: అగ్నిజ్వాల అనే సజీవమైన, తీవ్రమైన చిత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; ఈ పదబంధం మునుపటి వచనంలోని ప్రభువు ప్రత్యక్షతతో అనుసంధానమై ఉంది.
- source_word: διδόντος ἐκδίκησιν
  choice: ప్రతీకారం తీర్చుకుంటాడు
  rationale: అక్షరార్థంగా ‘ప్రతీకారం ఇవ్వడం’ అయిన గ్రీకు న్యాయనిర్ణయ సంబంధిత నుడికారాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది. కర్త మునుపటి వచనంలోని ప్రభువైన యేసు కావడంతో తెలుగు వాక్యంలో స్పష్టత కోసం ‘ఆయన’ చేర్చబడింది.
- source_word: τοῖς μὴ εἰδόσι θεὸν
  choice: దేవుణ్ణి ఎరుగనివారికి
  rationale: οἶδα యొక్క వర్తమాన స్థితి భావాన్ని కాపాడుతూ, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే తెలుగు ప్రయోగాన్ని ఉపయోగిస్తుంది.
- source_word: τοῖς μὴ ὑπακούουσιν
  choice: లోబడనివారికి
  rationale: ὑπακούω సూచించే వినడం ద్వారా విధేయత చూపే భావాన్ని సహజంగా అందిస్తుంది; మూలంలో స్పష్టంగా లేని ఉద్దేశపూర్వక తిరస్కార భావాన్ని అదనంగా చేర్చదు.
- source_word: τῷ εὐαγγελίῳ
  choice: సువార్తకు
  rationale: పౌలు రచనల్లో స్థిరంగా వినిపించే ‘సువార్త’ అనే పదం గ్రీకు పదానికి ఖచ్చితమైన, సులభంగా అర్థమయ్యే సమానార్థకం.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: మన ప్రభువైన యేసు
  rationale: κύριος అనే బిరుదును ‘ప్రభువు’గా కాపాడి, సంబంధాన్ని సహజ తెలుగు క్రమంలో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దైవిక తీర్పులో ἐκδίκησις స్వభావం
  choice: ప్రతీకారం
  alternative: ప్రతిఫలం / శిక్ష
  rationale: ఈ పదం ప్రభువు అమలు చేసే న్యాయపరమైన ప్రతికారాన్ని సూచిస్తుంది. ‘ప్రతీకారం’ మూలపాఠంలోని తీవ్రతను తగ్గించదు; అదే సమయంలో ఇది సందర్భానుసారంగా దైవిక న్యాయతీర్పు, పాపపూరిత మానవ కక్ష కాదు.
- issue: దేవుణ్ణి ఎరుగనివారు మరియు సువార్తకు లోబడనివారు అనే రెండు వర్గాల సంబంధం
  choice: రెండు సమాంతర వర్ణనలను విడిగా ఉంచడం
  alternative: రెండింటినీ ఒకే వర్గానికి చెందిన వివరణలుగా స్పష్టీకరించడం
  rationale: καί రెండు దత్తి పదబంధాలను కలుపుతుంది; అవి పూర్తిగా వేర్వేరు వర్గాలా, పరస్పరం ఆవరించే వర్ణనలా అన్నది మూలపాఠం తేల్చదు. అనువాదం ఆ అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన న్యాయతీర్పు ధోరణిని నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉండే నిర్మాణం. వచనం మునుపటి వాక్యంపై వ్యాకరణపరంగా ఆధారపడినందున తెలుగులో కర్తను ‘ఆయన’గా స్పష్టం చేశాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
