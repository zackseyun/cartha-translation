  source_fidelity: 'పాఠం గ్రీకు మూలాన్ని విశ్వసనీయంగా ప్రతిబింబిస్తుంది: ముగ్గురు పంపినవారు, థెస్సలొనీకయుల సంఘం అనే జనసంబంధిత షష్ఠీ ప్రయోగం, అలాగే దేవునిలోను ప్రభువైన యేసు మెస్సీయలోను ఉన్న సంఘం అనే ἐν-సంబంధం అన్నీ నిలిచాయి. ‘మన తండ్రియైన దేవుడు’లో ἡμῶν యొక్క స్వామ్యభావం కూడా స్పష్టంగా ఉంది.'
