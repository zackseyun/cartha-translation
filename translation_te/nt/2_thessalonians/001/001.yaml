  terminology: ‘సంఘం,’ ‘ప్రభువు,’ ‘మెస్సీయ’ పదాలు సందర్భానికి తగినవే. Σιλουανόςకు ‘సిల్వాను’ పూర్తి పేరును కాపాడుతుంది; ‘సీల’గా సమన్వయం చేయలేదు. Χριστόςను ‘మెస్సీయ’గా అనువదించడం బిరుదు భావాన్ని నిలుపుతుంది; ‘క్రీస్తు’ ప్రత్యామ్నాయం పాదసూచికలో సరిగ్గా అందించబడింది.
