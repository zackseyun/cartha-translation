id: 2TH.1.1
reference: 2 Thessalonians 1:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God our Father and the Lord Jesus the Messiah:'
translation:
  language: te
  text: పౌలు, సిల్వాను, తిమోతి—మన తండ్రియైన దేవునిలోను ప్రభువైన యేసు మెస్సీయలోను ఉన్న థెస్సలొనీకయుల సంఘానికి:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రభువైన యేసు క్రీస్తులోను.’ గ్రీకు బిరుదైన Χριστόςను ‘మెస్సీయ’ అని లేదా సంప్రదాయబద్ధంగా ‘క్రీస్తు’ అని అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: పౌలు
  rationale: Παῦλος అనే వ్యక్తి పేరుకు తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: Σιλουανὸς
  choice: సిల్వాను
  rationale: గ్రీకు పాఠంలోని పూర్తి పేరు Σιλουανόςను నేరుగా ప్రతిబింబిస్తుంది; అపొస్తలుల కార్యములలో కనిపించే సంక్షిప్త రూపమైన ‘సీల’తో సమన్వయం చేయలేదు.
- source_word: Τιμόθεος
  choice: తిమోతి
  rationale: Τιμόθεος అనే వ్యక్తి పేరుకు తెలుగులో సహజంగా స్థిరపడిన రూపం.
- source_word: ἐκκλησίᾳ
  choice: సంఘానికి
  rationale: పౌలు పత్రికల సందర్భంలో విశ్వాసుల సమాజాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: Θεσσαλονικέων
  choice: థెస్సలొనీకయుల
  rationale: ఈ బహువచన షష్ఠీ రూపం పట్టణాన్ని కాక ప్రజలను నేరుగా సూచిస్తుంది; అందువల్ల ‘థెస్సలొనీకలోని’ అని స్థలార్థంగా మార్చలేదు.
- source_word: ἐν
  choice: లోను … లోను ఉన్న
  rationale: సంబంధం, ఐక్యత, లేదా ఆధ్యాత్మిక పరిధి అనే భావాలను ముందుగానే ఒక్క అర్థానికి పరిమితం చేయకుండా గ్రీకు ἐν యొక్క సంక్షిప్తతను నిలుపుతుంది.
- source_word: θεῷ πατρὶ ἡμῶν
  choice: మన తండ్రియైన దేవుని
  rationale: ἡμῶνలోని ‘మన’ అనే స్వామ్య భావాన్ని స్పష్టంగా కాపాడుతూ తెలుగులో సహజమైన సంబంధరూపాన్ని వాడింది.
- source_word: κυρίῳ
  choice: ప్రభువైన
  rationale: యేసుకు వర్తించిన κύριος బిరుదుకు సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: Χριστῷ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ యేసుకు జతచేసిన బిరుదుగా ఉంది; అందువల్ల పేరులా కేవలం లిప్యంతరీకరించకుండా బిరుదు భావాన్ని తెలిపే ‘మెస్సీయ’ను ఎంచుకున్నాం.
theological_decisions:
- issue: Ἰησοῦ Χριστῷలో Χριστός యొక్క అనువాదం
  choice: యేసు మెస్సీయ
  alternative: యేసు క్రీస్తు
  rationale: ఈ అభివాదంలో Χριστόςకు బిరుదు భావం నిలిచి ఉంది. ‘మెస్సీయ’ ఆ బిరుదును వెల్లడిస్తుంది; సంప్రదాయ ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో ఉంచాం.
- issue: ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ తెలిపే సంబంధం
  choice: మన తండ్రియైన దేవునిలోను ప్రభువైన యేసు మెస్సీయలోను ఉన్న
  alternative: మన తండ్రియైన దేవునికి, ప్రభువైన యేసు మెస్సీయకు చెందిన
  rationale: ‘లో’ అనే రూపం సంఘం దేవునితోను యేసుతోను కలిగిన సంబంధాన్ని పరిధి, ఐక్యత, ఆధారం వంటి ఒకే వివరణకు పరిమితం చేయకుండా మూలంలోని ἐνను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన పత్రికా-అభివాద శైలి. పేర్ల జాబితా తరువాత దీర్ఘవిరామం పెట్టి పంపినవారిని గ్రహీతల నుండి స్పష్టంగా వేరు చేశాం. గ్రీకు వాక్యంలోని చివరి విరామాన్ని అనుసరించి తదుపరి అభివాద వాక్యానికి దారితీసే ద్విబిందువును ఉంచాం.
