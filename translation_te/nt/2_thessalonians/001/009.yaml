id: 2TH.1.9
reference: 2 Thessalonians 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἵτινες δίκην τίσουσιν ὄλεθρον αἰώνιον ἀπὸ προσώπου τοῦ κυρίου καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/009.yaml
  text: These will pay the penalty of eternal destruction[a], away from the presence of the Lord and from the glory of his might,
translation:
  language: te
  text: వీరు ప్రభువు సన్నిధికీ, ఆయన శక్తి మహిమకూ దూరంగా ఉండి, నిత్య నాశనమనే దండనను అనుభవిస్తారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువు సన్నిధి నుండీ ఆయన శక్తి మహిమ నుండీ వచ్చే నిత్య నాశనమనే దండనను అనుభవిస్తారు.” గ్రీకు ఉపసర్గం వియోగాన్ని (“దూరంగా”) లేదా మూలాన్ని (“నుండి వచ్చేది”) సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: οἵτινες
  choice: వీరు
  rationale: మునుపటి వచనంలో చెప్పబడిన వారిని తిరిగి సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన నిర్దేశక రూపం.
- source_word: δίκην τίσουσιν
  choice: శిక్షను అనుభవిస్తారు
  rationale: ఈ గ్రీకు పదబంధం న్యాయపరమైన దండనను పొందడాన్ని సూచిస్తుంది. తెలుగులో ‘శిక్షను అనుభవిస్తారు’ సహజంగా ఉండి న్యాయతీర్పు భావాన్ని నిలుపుతుంది.
- source_word: ὄλεθρον αἰώνιον
  choice: నిత్య నాశనం
  rationale: తీర్పు యొక్క తీవ్రతను, అంతిమత్వాన్ని తెలియజేస్తుంది; అయితే నాశనం యొక్క ఖచ్చిత స్వరూపంపై ఏ ప్రత్యేక సిద్ధాంతాన్నీ అనువాదంలో చేర్చదు.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: ప్రభువు సన్నిధికి దూరంగా
  rationale: ἀπόను వియోగం లేదా వెలివేత భావంలో తీసుకుంది; πρόσωπονకు ఈ సందర్భంలో సహజమైన తెలుగు సమానార్థకం ‘సన్నిధి’.
- source_word: ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ
  choice: ఆయన బలప్రభావ మహిమకు దూరంగా
  rationale: δόξα యొక్క ‘మహిమ’ భావాన్నీ, ἰσχύς యొక్క శక్తి/బలం భావాన్నీ ‘బలప్రభావ మహిమ’ సహజంగా కలిపి వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: తుది తీర్పు సందర్భంలో ἀπό యొక్క అర్థం
  choice: 'వియోగం/వెలివేత: ‘ప్రభువు సన్నిధికి ... దూరంగా’'
  alternative: 'మూలం/ఉద్భవం: ప్రభువు సన్నిధి నుండీ ఆయన బలప్రభావ మహిమ నుండీ వచ్చే నాశనం'
  rationale: ἀπό వియోగాన్నీ మూలాన్నీ సూచించగలదు. ప్రధాన పాఠంలో సందర్భానుకూలమైన వియోగ భావాన్ని ఉంచి, వ్యాకరణపరంగా సాధ్యమైన మూలార్థాన్ని పాదసూచికలో భద్రపరిచాం.
- issue: ‘నిత్య నాశనం’ యొక్క సిద్ధాంతపరమైన పరిధి
  choice: నాశనం యొక్క విధానాన్ని మరింత నిర్వచించకుండా మూలపాఠంలోని పదబంధాన్ని నిలుపడం
  alternative: పూర్తి నిర్మూలనగా లేదా నిత్య సచేతన శిక్షగా స్పష్టీకరించడం
  rationale: ఈ పదబంధం శిక్ష యొక్క నిత్యమైన స్వభావాన్ని చెబుతుంది గాని, విస్తృత సిద్ధాంత వివాదాన్ని ఈ వచనం ఒక్కటే తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘సన్నిధి,’ ‘మహిమ,’ ‘నిత్య నాశనం’ వంటి బైబిలు సందర్భానికి పరిచితమైన పదాలను ఉంచుతూ, వాక్యాన్ని సాధారణ పాఠకులకు స్పష్టంగా నిర్మించాం.
