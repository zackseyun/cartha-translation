source:
  edition: SBLGNT
  text: εἴπερ δίκαιον παρὰ θεῷ ἀνταποδοῦναι τοῖς θλίβουσιν ὑμᾶς θλῖψιν
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/006.yaml
  text: since it is just before God to repay affliction to those who afflict you[a]
translation:
  language: te
  text: ఎందుకంటే మిమ్మల్ని శ్రమ కలిగించేవారికి శ్రమను తిరిగి ఇవ్వడం దేవుని దృష్టిలో న్యాయమైనది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒకవేళ నిజంగానే మిమ్మల్ని శ్రమ కలిగించేవారికి శ్రమను తిరిగి ఇవ్వడం దేవుని దృష్టిలో న్యాయమైనదైతే.’
    reason: εἴπερ యొక్క షరతు రూపాన్ని ప్రత్యామ్నాయంగా చూపిస్తుంది.
lexical_decisions:
- source_word: εἴπερ
  choice: ఎందుకంటే
  rationale: ఇక్కడ ఇది సందేహాస్పదమైన షరతును కాక, నిజమని భావించి ముందుంచిన ఆధారాన్ని సూచిస్తుంది; సందర్భంలోని తార్కిక సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: δίκαιον
  choice: న్యాయమే
  rationale: దేవుని తీర్పులో నైతికంగా సముచితమైనదనే న్యాయపరమైన భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: παρὰ θεῷ
  choice: దేవుని దృష్టిలో
  rationale: దేవునికి సంబంధించిన మూల్యాంకనం లేదా ఆయన ప్రమాణం ప్రకారం అనే భావాన్ని సహజంగా అందిస్తుంది; ‘దేవుని యొద్ద’ అనే అసహజ అక్షరానువాదాన్ని నివారిస్తుంది.
- source_word: ἀνταποδοῦναι
  choice: ప్రతిఫలంగా ఇవ్వడం
  rationale: చేసినదానికి తగినదాన్ని తిరిగి ఇవ్వడం అనే ప్రతికారాత్మక భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοῖς θλίβουσιν ὑμᾶς
  choice: మిమ్మల్ని శ్రమపెడుతున్నవారికి
  rationale: బాధ, ఒత్తిడి, హింస కలిగించడం అనే భావాన్ని తెలియజేస్తూ, θλῖψιν‌తో ఉన్న మూలపద సంబంధాన్ని ‘శ్రమ’ ద్వారా నిలుపుతుంది.
- source_word: θλῖψιν
  choice: శ్రమను
  rationale: వారు కలిగించిన బాధకు ప్రతిగా వచ్చే బాధను సూచిస్తుంది; అదే వాక్యంలోని θλίβουσιν‌తో పదబంధ సంబంధాన్ని తెలుగులోనూ కాపాడుతుంది.
theological_decisions:
- issue: దైవ ప్రతిఫల తీర్పు స్వభావం
  choice: దేవుడు శ్రమపెట్టేవారికి శ్రమను ప్రతిఫలంగా ఇవ్వడం న్యాయమని వాక్యం సాధారణంగా చెబుతుంది; దాని సమయాన్ని లేదా విధానాన్ని ఈ ఉపవాక్యం నిర్దిష్టం చేయదు.
  alternative: ఇది పూర్తిగా అంత్యకాల తీర్పును మాత్రమే సూచిస్తుంది; లేదా ప్రస్తుత చారిత్రక తీర్పులతో పాటు అంతిమ తీర్పునూ సూచిస్తుంది.
  rationale: గ్రీకు పాఠం దైవ ప్రతిఫలంలోని న్యాయాన్ని ధృవీకరిస్తుంది, కాని అది ఎప్పుడు లేదా ఎలా అమలవుతుందో ఈ ఉపవాక్యంలో తేల్చదు. అందువల్ల అనువాదం ఏ సంకుచిత సిద్ధాంత నిర్ణయాన్నీ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘శ్రమపెడుతున్నవారు/శ్రమ’ అనే పదసామ్యంతో గ్రీకు θλίβουσιν/θλῖψιν సంబంధం నిలుపబడింది.
