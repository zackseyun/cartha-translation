id: 2TH.1.11
reference: 2 Thessalonians 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰς ὃ καὶ προσευχόμεθα πάντοτε περὶ ὑμῶν, ἵνα ὑμᾶς ἀξιώσῃ τῆς κλήσεως ὁ θεὸς ἡμῶν καὶ πληρώσῃ πᾶσαν εὐδοκίαν ἀγαθωσύνης καὶ ἔργον πίστεως ἐν δυνάμει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/011.yaml
  text: To this end also we always pray for you[a], that our God may count you worthy of the calling and may fulfill every good resolve and work of faith with power[c][b],
translation:
  language: te
  text: 'ఈ ఉద్దేశంతో మేము కూడా మీ కోసం ఎల్లప్పుడూ ప్రార్థిస్తున్నాం: మన దేవుడు మిమ్మల్ని ఆ పిలుపుకు తగినవారిగా పరిగణించాలని[a], మంచితనంతో కూడిన ప్రతి సంకల్పాన్నీ[b], విశ్వాస కార్యాన్నీ[c] శక్తితో నెరవేర్చాలని.


    [a] లేదా, “ఆ పిలుపుకు తగినవారిగా చేయాలని.” గ్రీకు క్రియకు “తగినవారిగా పరిగణించడం,” “తగినవారిగా చేయడం” అనే రెండు అర్థాలూ ఉండవచ్చు.


    [b] లేదా, “మంచితనానికి సంబంధించిన ప్రతి ఉద్దేశాన్ని,” “మంచి చేయాలనే ప్రతి సంకల్పాన్ని.”


    [c] “విశ్వాస కార్యం” అనే మాటను “విశ్వాసం వల్ల కలిగే కార్యం” అని కూడా అర్థం చేసుకోవచ్చు. ఇక్కడ “విశ్వాసం” అనే పదానికి సందర్భానుసారంగా “విశ్వసనీయత” అనే అర్థం కూడా ఉండవచ్చు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ పిలుపుకు తగినవారిగా చేయాలని.” గ్రీకు క్రియకు “తగినవారిగా పరిగణించడం,” “తగినవారిగా చేయడం” అనే రెండు అర్థాలూ ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “మంచితనానికి సంబంధించిన ప్రతి ఉద్దేశాన్ని,” “మంచి చేయాలనే ప్రతి సంకల్పాన్ని.”
    reason: lexical_alternative
  - marker: c
    text: “విశ్వాస కార్యం” అనే మాటను “విశ్వాసం వల్ల కలిగే కార్యం” అని కూడా అర్థం చేసుకోవచ్చు. ఇక్కడ “విశ్వాసం” అనే పదానికి సందర్భానుసారంగా “విశ్వసనీయత” అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ καὶ
  choice: ఈ ఉద్దేశంతోనే
  rationale: ముందటి వాక్యభాగాన్ని తిరిగి సూచిస్తూ లక్ష్యాన్ని తెలిపే గ్రీకు ప్రయోగాన్ని సహజమైన తెలుగులో అందిస్తుంది; καὶ లోని అదనపు ఉద్ఘాటనను ‘నే’ తెలియజేస్తుంది.
- source_word: προσευχόμεθα πάντοτε περὶ ὑμῶν
  choice: మేము మీ కోసం ఎల్లప్పుడూ ప్రార్థిస్తున్నాం
  rationale: వర్తమాన క్రియలోని నిరంతర అలవాటును, περὶ ὑμῶν లోని వారి పక్షాన ప్రార్థించే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀξιώσῃ
  choice: తగినవారిగా పరిగణించాలని
  rationale: క్రియలోని ‘యోగ్యులుగా ఎంచడం/పరిగణించడం’ అనే మూల్యాంకన భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ‘తగినవారిగా చేయడం’ అనే సాధ్యమైన కారణార్థాన్ని పాదసూచికలో నిలిపింది.
- source_word: τῆς κλήσεως
  choice: ఆ పిలుపుకు
  rationale: గ్రీకులో స్వామ్యసూచక సర్వనామం లేదు. నిర్దిష్ట ఉపపదం సూచించే, ఇప్పటికే తెలిసిన పిలుపును ‘ఆ’ ద్వారా తెలుపుతూ అనవసరంగా ‘ఆయన పిలుపు’ లేదా ‘మీ పిలుపు’ అని చేర్చలేదు.
- source_word: πληρώσῃ
  choice: నెరవేర్చాలని
  rationale: సంకల్పానికీ కార్యానికీ సరిపోయేలా, పూర్తిగా సాధించడం అనే భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: πᾶσαν εὐδοκίαν ἀγαθωσύνης
  choice: మంచితనంతో కూడిన ప్రతి సంకల్పాన్నీ
  rationale: εὐδοκία లోని ఉద్దేశం లేదా దృఢసంకల్పం అనే భావాన్ని, ἀγαθωσύνης లోని నైతిక మంచితనంతో కలిపి సహజంగా వ్యక్తం చేస్తుంది; ఇతర సాధ్యమైన సంబంధాలను పాదసూచికలో ఉంచింది.
- source_word: ἔργον πίστεως
  choice: విశ్వాస కార్యాన్నీ
  rationale: గ్రీకు షష్ఠీ సంబంధంలోని సంక్షిప్తతను, అది విశ్వాసం వల్ల కలిగిన కార్యమా లేక విశ్వాసంతో లక్షణీకరించబడిన కార్యమా అనే విస్తృతిని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: ἐν δυνάμει
  choice: శక్తితో
  rationale: కార్యసాధన విధానాన్ని తెలిపే గ్రీకు పదబంధాన్ని అదనపు స్వామ్యసూచకం చేర్చకుండా నేరుగా అనువదిస్తుంది.
theological_decisions:
- issue: దేవుని పిలుపుకు సంబంధించి ἀξιώσῃ యొక్క భావం
  choice: తగినవారిగా పరిగణించాలని
  alternative: తగినవారిగా చేయాలని
  rationale: గ్రహీతలు తమ సొంత యోగ్యతను సంపాదించుకుంటారని సూచించకుండా మూలంలోని మూల్యాంకన భావాన్ని నిలుపుతుంది. అదే సమయంలో గ్రీకు క్రియలో సాధ్యమైన ‘యోగ్యులుగా చేయడం’ అనే భావాన్ని పాదసూచికలో ఉంచి వేదాంతపరమైన ఉద్రిక్తతను పరిష్కరించకుండా కాపాడుతుంది.
- issue: ἔργον πίστεως లో πίστις భావం
  choice: విశ్వాసం
  alternative: విశ్వసనీయత
  rationale: πίστις కు సాధారణ ప్రధాన అనువాదమైన ‘విశ్వాసం’ను వాడింది. కార్యం విశ్వాసం వల్ల కలిగిందనే భావాన్నీ, విశ్వసనీయతతో కూడిన కార్యమనే సాధ్యతనూ పాదసూచికలో తెలియజేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. మూలంలోని ఒకే దీర్ఘ ప్రార్థనా నిర్మాణాన్ని ద్విబిందువు ద్వారా స్పష్టంచేసి, చివర ‘ప్రార్థిస్తున్నాం’ను పునరుక్తి చేయడం ద్వారా తెలుగులో సహజత్వం సాధించబడింది. ‘పిలుపు,’ ‘విశ్వాసం,’ ‘శక్తి’ వంటి స్థిరమైన బైబిలు పదజాలం నిలుపబడింది.
