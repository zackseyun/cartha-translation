  revision_rationale: సవరణ మూలభావాన్ని మార్చదు. ‘మేము కూడా’ ద్వారా εἰς ὃ καὶ లోని అదనపు భావం స్పష్టమవుతుంది. వాక్యాంతంలోని పునరుక్త ‘ప్రార్థిస్తున్నాం’ తొలగించడం ద్వారా ἵνα-ఉపవాక్యం తెలుగులో సహజంగా, మూలంలోని ఒకే ప్రార్థనా క్రియకు అనుగుణంగా ఉంటుంది. పాదసూచికల గుర్తులు మరియు వాటి ప్రత్యామ్నాయ అర్థాలు యథాతథంగా, సరైన స్థానాల్లో నిలిపబడ్డాయి.
