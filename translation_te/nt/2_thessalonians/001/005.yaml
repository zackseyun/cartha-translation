id: 2TH.1.5
reference: 2 Thessalonians 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔνδειγμα τῆς δικαίας κρίσεως τοῦ θεοῦ, εἰς τὸ καταξιωθῆναι ὑμᾶς τῆς βασιλείας τοῦ θεοῦ, ὑπὲρ ἧς καὶ πάσχετε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/005.yaml
  text: This is evidence of the righteous judgment of God[a], so that you may be counted worthy of the kingdom of God, for which you are also suffering[c][b],
translation:
  language: te
  text: ఇది దేవుని నీతియుక్తమైన తీర్పుకు నిదర్శనం[a]; మీరు దేవుని రాజ్యానికి తగినవారిగా పరిగణించబడేందుకు[b] అది జరుగుతోంది. ఆ రాజ్యం కోసమే మీరు బాధలు కూడా అనుభవిస్తున్నారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని నీతియుక్తమైన తీర్పుకు రుజువు’ లేదా ‘సూచన’.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మీరు దేవుని రాజ్యానికి తగినవారిగా పరిగణించబడేలా’. గ్రీకు నిర్మాణం ఉద్దేశాన్ని లేదా ఫలితాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: c
    text: లేదా, ‘ఆ రాజ్యం నిమిత్తమే’ లేదా ‘ఆ రాజ్యం పక్షంగా’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδειγμα
  choice: నిదర్శనం
  rationale: ఈ పదం ఒక వాస్తవాన్ని చూపించే లేదా దానికి సాక్ష్యంగా నిలిచే దానిని సూచిస్తుంది. ‘నిదర్శనం’ సహజమైన తెలుగులో ఆ సూచనాత్మక బలాన్ని నిలుపుతుంది; ‘నిరూపణ’కన్నా అతిగా నిర్ణయాత్మకం కాదు. గ్రీకు వాక్యభాగం క్రియలేనిది, ముందటి వచనంపై ఆధారపడినది కాబట్టి ‘ఇది ...’ అని పూరించబడింది.
- source_word: δικαίας κρίσεως
  choice: నీతియుక్తమైన తీర్పు
  rationale: దేవుని తీర్పులోని నైతిక న్యాయత్వాన్ని స్పష్టంగా తెలియజేస్తూ మూలంలోని విశేషణ–నామవాచక సంబంధాన్ని కాపాడుతుంది.
- source_word: εἰς τὸ καταξιωθῆναι
  choice: దాని ఫలితంగా ... తగినవారిగా ఎంచబడతారు
  rationale: εἰς τὸ తో కూడిన infinitive ఉద్దేశాన్ని గానీ ఫలితాన్ని గానీ సూచించవచ్చు. ప్రధాన పాఠ్యంలో ఫలిత భావాన్ని సహజ తెలుగులో ఇచ్చి, ఉద్దేశ భావాన్ని పాదటిప్పణిలో నిలిపాం. Passive καταξιόω అంతర్గతంగా యోగ్యులుగా చేయడం కాక, తగినవారిగా ఎంచడం లేదా పరిగణించడం అనే భావం ఇస్తుంది.
- source_word: βασιλείας τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: సంబంధ విభక్తి పదబంధానికి సూటిగా, తెలుగులో స్థిరపడిన బైబిలు ప్రయోగం.
- source_word: ὑπὲρ ἧς
  choice: ఆ రాజ్యం కోసమే
  rationale: ὑπέρ + genitive ఇక్కడ ‘దాని నిమిత్తం/దాని పక్షంగా’ అనే ప్రయోజనార్థక సంబంధాన్ని సూచిస్తుంది. ‘కోసమే’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: καὶ πάσχετε
  choice: మీరు బాధలు కూడా అనుభవిస్తున్నారు
  rationale: వర్తమాన కాలంలోని కొనసాగుతున్న బాధను ‘అనుభవిస్తున్నారు’ తెలియజేస్తుంది; καί ను ‘కూడా’గా నిలిపి ముందటి వచనంలోని హింసలతో అనుసంధానించింది.
theological_decisions:
- issue: బాధలకు, దేవుని రాజ్యానికి తగినవారిగా ఎంచబడటానికి మధ్య సంబంధం
  choice: విశ్వాసులు అనుభవిస్తున్న బాధలు దేవుని నీతియుక్త తీర్పుకు నిదర్శనంగా ఉన్నాయి; దాని ఉద్దేశం లేదా ఫలితంగా వారు రాజ్యానికి తగినవారిగా ఎంచబడతారు.
  alternative: వారి బాధలు రాజ్యంలో ప్రవేశించడానికి అర్హతను సంపాదిస్తాయి.
  rationale: Passive καταξιωθῆναι అంటే ‘తగినవారిగా ఎంచబడటం/పరిగణించబడటం’; బాధలే అర్హతకు ప్రతిఫల ధర అని మూలపాఠ్యం చెప్పదు. εἰς τὸ నిర్మాణంలోని ఉద్దేశ–ఫలిత సందిగ్ధతను పాదటిప్పణి కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని క్రియలేని ప్రారంభ భాగాన్ని తెలుగులో సంపూర్ణ వాక్యంగా చేశాం. ఉద్దేశం–ఫలితం మధ్య నిజమైన వ్యాకరణ సందిగ్ధతను ప్రధాన పాఠ్యం మరియు పాదటిప్పణి ద్వారా సంరక్షించాం.
