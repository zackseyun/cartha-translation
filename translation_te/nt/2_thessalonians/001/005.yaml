- from: ఇది దేవుని నీతియుక్తమైన తీర్పుకు నిదర్శనం[a]. దాని ఫలితంగా మీరు దేవుని రాజ్యానికి తగినవారిగా ఎంచబడతారు[b]; ఆ రాజ్యం కోసమే మీరు బాధలు కూడా అనుభవిస్తున్నారు[c].
