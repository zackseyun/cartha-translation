  rationale: The revision replaces ‘ఎంచబడతారు’ with ‘పరిగణించబడేందుకు’ to render καταξιωθῆναι accurately as being counted or considered worthy, rather than being selected. It also expresses the εἰς τὸ infinitive directly in Telugu while retaining the purpose/result ambiguity in footnote b. The other lexical choices and all footnote anchors are retained and aligned with their respective phrases.
