id: 2TH.1.7
reference: 2 Thessalonians 1:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὑμῖν τοῖς θλιβομένοις ἄνεσιν μεθ’ ἡμῶν ἐν τῇ ἀποκαλύψει τοῦ κυρίου Ἰησοῦ ἀπ’ οὐρανοῦ μετ’ ἀγγέλων δυνάμεως αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/007.yaml
  text: and to you who are being afflicted[a], relief with us at the revelation of the Lord Jesus from heaven with his mighty angels.
translation:
  language: te
  text: మరియు, బాధలకు గురవుతున్న మీకూ మాతోపాటు ఉపశమనం—ప్రభువైన యేసు తన శక్తికి చెందిన దూతలతో పరలోకం నుండి బయలుపడే సమయంలో.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλιβομένοις
  choice: బాధలకు గురవుతున్న
  rationale: వర్తమాన కర్మణి భావాన్ని నిలుపుతూ, ప్రస్తుతం ఒత్తిడి లేదా బాధ అనుభవిస్తున్నవారిని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ἄνεσιν
  choice: ఉపశమనం
  rationale: బాధల ఒత్తిడి తొలగిపోవడం లేదా సడలడం అనే భావాన్ని తెలియజేస్తుంది; కేవలం అంతరంగ విశ్రాంతి అనే భావానికి పరిమితం కాదు.
- source_word: μεθ’ ἡμῶν
  choice: మాతోపాటు
  rationale: పౌలు మరియు అతని సహచరులు కూడా అదే ఉపశమనంలో పాలుపంచుకుంటారనే సహవాస భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ ἀποκαλύψει
  choice: ప్రత్యక్షమయ్యే సమయంలో
  rationale: ἐν యొక్క కాలసూచక భావాన్ని స్పష్టంగా తెలియజేస్తూ, యేసు బయలుపడే అంత్యకాల సంఘటనను సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ἀπ’ οὐρανοῦ
  choice: పరలోకం నుండి
  rationale: ἀπό సూచించే మూలం లేదా ఆరంభస్థానాన్ని సూటిగా నిలుపుతుంది.
- source_word: μετ’ ἀγγέλων δυνάμεως αὐτοῦ
  choice: తన శక్తిగల దూతలతో
  rationale: గ్రీకు షష్ఠీ నిర్మాణంలోని సంక్షిప్తతను కొంతవరకు నిలుపుతూ, దూతలు శక్తిమంతులని లేదా ఆయన శక్తితో సంబంధం గలవారని అర్థమయ్యే వీలును ఉంచుతుంది.
theological_decisions:
- issue: ἀγγέλων δυνάμεως αὐτοῦ అనే షష్ఠీ పదబంధం
  choice: తన శక్తిగల దూతలతో
  alternative: తన శక్తిమంతులైన దూతలతో; తన శక్తికి చెందిన దూతలతో
  rationale: గ్రీకు పదబంధం ‘శక్తిమంతులైన దూతలు’ అనే గుణవాచక భావాన్నీ, ఆయన శక్తితో సంబంధమున్న దూతలు అనే భావాన్నీ అనుమతిస్తుంది. ప్రధాన పాఠం సహజంగా ఉండడమే కాక ఈ సంబంధాన్ని పూర్తిగా ఒకే అర్థానికి కుదించదు; మరింత వాడుకైన ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
- issue: ἐν τῇ ἀποκαλύψει యొక్క కాలసూచక భావం
  choice: ప్రత్యక్షమయ్యే సమయంలో
  alternative: ప్రత్యక్షతలో; బయలుపడినప్పుడు
  rationale: వాగ్దానం చేసిన ఉపశమనం యేసు అంత్యకాల ప్రత్యక్షతతో కాలపరంగా ముడిపడి ఉందని స్పష్టపరుస్తుంది; ‘ప్రత్యక్షమయ్యే’ అన్నది సంఘటన యొక్క బయలుపాటు భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ఈ వచనం ముందరి వచనంలోని వాక్యనిర్మాణాన్ని కొనసాగిస్తున్నందున, మూలంలోని అసంపూర్ణ వాక్య సంబంధాన్ని దీర్ఘవిరామంతో నిలిపాం.
