id: 2TH.1.4
reference: 2 Thessalonians 1:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥστε ⸂αὐτοὺς ἡμᾶς⸃ ἐν ὑμῖν ⸀ἐγκαυχᾶσθαι ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ ὑπὲρ τῆς ὑπομονῆς ὑμῶν καὶ πίστεως ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν αἷς ἀνέχεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/004.yaml
  text: so that we ourselves boast about you among the churches of God because of your perseverance and faith in all your persecutions and afflictions that you are enduring,[a]
translation:
  language: te
  text: కాబట్టి దేవుని సంఘాల మధ్య మేమే మీ గురించి గొప్పగా చెప్పుకుంటున్నాం—మీరు సహిస్తున్న హింసలన్నిటి, కష్టాలన్నిటి మధ్య మీ పట్టుదల, విశ్వాసం గురించి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నమ్మకత్వం’; πίστις అనే గ్రీకు పదం విశ్వాసాన్ని లేదా, ముఖ్యంగా బాధల సందర్భంలో, నిలకడైన నమ్మకత్వాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: అందువల్ల
  rationale: ముందటి వాక్యంలో చెప్పిన దానికి ఫలితాన్ని సూచిస్తుంది; తెలుగులో సహజమైన అన్వయాన్ని ఇస్తుంది.
- source_word: αὐτοὺς ἡμᾶς
  choice: మేమే
  rationale: పౌలు మరియు అతని సహచరులపై ఉన్న ఉద్ఘాటనను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ἐν ὑμῖν ἐγκαυχᾶσθαι
  choice: మీ గురించి గొప్పగా చెప్పుకుంటున్నాం
  rationale: ఇక్కడ ἐν వ్యక్తులను గర్వానికి విషయంగా సూచిస్తుంది; ἐγκαυχᾶσθαι యొక్క బలమైన భావాన్ని అతిగా మృదువుచేయకుండా సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ
  choice: దేవుని సంఘాల మధ్య
  rationale: దేవునికి చెందిన అనేక స్థానిక విశ్వాస సమాజాల మధ్య ఈ మాట చెప్పబడుతోందనే భావాన్ని నిలుపుతుంది.
- source_word: ὑπὲρ
  choice: ఎందుకంటే ... మేము గర్విస్తున్నాం
  rationale: వారి గురించి గొప్పగా చెప్పుకోవడానికి ఆధారమైన కారణాన్ని తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: ὑπομονῆς
  choice: పట్టుదల
  rationale: ఒత్తిడి, బాధ మధ్య నిలకడగా కొనసాగడాన్ని ఆధునిక సాధారణ తెలుగులో తెలియజేస్తుంది.
- source_word: πίστεως
  choice: విశ్వాసం
  rationale: దేవునిపై నమ్మకం అనే ప్రధాన భావాన్ని నిలుపుతుంది; ఈ సందర్భంలో నమ్మకత్వం అనే భావసంభావ్యతను పాదటిప్పణిలో ఉంచింది.
- source_word: διωγμοῖς
  choice: హింసలు
  rationale: విశ్వాసం కారణంగా ఎదురయ్యే శత్రుత్వపూర్వక పీడనను స్పష్టంగా సూచిస్తుంది.
- source_word: θλίψεσιν
  choice: కష్టాలు
  rationale: ఒత్తిళ్లు, బాధలు, ఇబ్బందులు అనే విస్తృత భావాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తూ, హింసలతో ఉన్న భేదాన్ని ఉంచుతుంది.
- source_word: αἷς ἀνέχεσθε
  choice: మీరు సహిస్తున్న
  rationale: ప్రస్తుతం కొనసాగుతున్న భరింపును సంబంధవాచక నిర్మాణంతో సహజ తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: బాధల సందర్భంలో πίστις పదానికి ‘విశ్వాసం’ లేదా ‘నమ్మకత్వం’ అనే అర్థం
  choice: విశ్వాసం
  alternative: నమ్మకత్వం; విశ్వసనీయత
  rationale: పదం దేవునిపై విశ్వాసాన్నీ పరీక్షల్లో నిలిచే నమ్మకత్వాన్నీ సూచించగలదు. ప్రధాన పాఠ్యంలో సాధారణమైన ‘విశ్వాసం’ ఉంచి, నిజమైన అర్థసంభావ్యతను పాదటిప్పణిలో సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన శైలి. ‘మేమే’ ద్వారా మూలంలోని ఉద్ఘాటనను, ‘హింసలు—కష్టాలు’ ద్వారా రెండు గ్రీకు పదాల భేదాన్ని నిలిపింది.
