  rationale: గర్వించడం/గొప్పగా చెప్పుకోవడం అనే ఒకే ప్రధాన క్రియను మాత్రమే ఉంచి, ὑπὲρ τῆς ὑπομονῆς ὑμῶν καὶ πίστεως ను ‘మీ పట్టుదల, విశ్వాసం గురించి’గా దానికి అనుసంధానించాం. ‘హింసలన్నిటి, కష్టాలన్నిటి మధ్య’ అనే నిర్మాణం ἐν πᾶσιν τοῖς διωγμοῖς ... καὶ ταῖς θλίψεσιν యొక్క సందర్భాత్మక భావాన్ని సహజంగా నిలుపుతుంది.
