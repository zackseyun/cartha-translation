revisions:
- from: అందువల్ల దేవుని సంఘాల మధ్య మేమే మీ గురించి గొప్పగా చెప్పుకుంటున్నాం. ఎందుకంటే మీరు సహిస్తున్న హింసలన్నిటిలో, కష్టాలన్నిటిలో మీ పట్టుదలకూ విశ్వాసానికీ[a] మేము గర్విస్తున్నాం.
