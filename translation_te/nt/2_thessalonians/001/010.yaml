  source_fidelity: 'ముసాయిదా మూలార్థాన్ని ప్రధానంగా సరిగానే అందిస్తుంది: క్రీస్తు రాక, ఆయన పరిశుద్ధులతో/వారిలో మహిమపరచబడటం, విశ్వసించిన వారందరిలో ఆశ్చర్యంతో ప్రశంసించబడటం, మరియు అపొస్తలుల సాక్ష్యం విశ్వసించబడటం అన్నీ నిలిచాయి. అయితే ప్రధాన వాక్యంలో ‘ఆయన వచ్చినప్పుడు ... వస్తాడు’ అనే పునరుక్తి గ్రీకులో లేదు; ἔλθῃకు ఒకే ‘వచ్చినప్పుడు’ సరిపోతుంది.'
  naturalness: ‘ఆయన వచ్చినప్పుడు ... వస్తాడు’ ఆధునిక తెలుగులో అసహజంగా, అర్థపరంగా పునరుక్తిగా ఉంది. దాన్ని తొలగించడం వాక్యాన్ని సహజంగా చేస్తుంది. θαυμασθῆναιకు ‘ఆశ్చర్యంతో ప్రశంసించబడటానికి’ అనేది ‘ఆశ్చర్యంతో కొనియాడబడటానికి’ కంటే కొంచెం సూటిగా, సహజంగా ఉంది.
  terminology: ‘పరిశుద్ధులు,’ ‘మహిమపరచబడటం,’ ‘విశ్వసించిన వారు,’ ‘సాక్ష్యం’ తగిన పౌలీన పదజాలమే. పాదటిప్పణి aలో prepositionను ‘గ్రీకు విభక్త్యర్థక పదం’ అని పిలవడం సాంకేతికంగా సరికాదు; ‘గ్రీకు ἐν అనే ఉపసర్గ’ అని చెప్పాలి.
