id: 2TH.1.10
reference: 2 Thessalonians 1:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅταν ἔλθῃ ἐνδοξασθῆναι ἐν τοῖς ἁγίοις αὐτοῦ καὶ θαυμασθῆναι ἐν πᾶσιν τοῖς πιστεύσασιν, ὅτι ἐπιστεύθη τὸ μαρτύριον ἡμῶν ἐφ’ ὑμᾶς, ἐν τῇ ἡμέρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/010.yaml
  text: on that day when he comes to be glorified among his saints and to be marveled at among all who have believed[b][a], because our testimony to you was believed.
translation:
  language: te
  text: ఆ రోజున ఆయన తన పరిశుద్ధుల మధ్య మహిమపరచబడటానికీ[a], విశ్వసించిన వారందరి మధ్య ఆశ్చర్యంతో ప్రశంసించబడటానికీ వచ్చినప్పుడు, ఎందుకంటే మీకు మేమిచ్చిన సాక్ష్యం నమ్మబడింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన పరిశుద్ధులలో మహిమపరచబడటానికి.” గ్రీకు ἐν అనే ఉపసర్గ ఆయన తన పరిశుద్ధుల మధ్య మహిమపరచబడతాడనే భావాన్నీ, ఆయన మహిమ వారిలో ప్రత్యక్షమవుతుందనే భావాన్నీ ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: 'గ్రీకు వాక్యక్రమాన్ని మరింత దగ్గరగా అనుసరిస్తే: “ఆయన తన పరిశుద్ధుల మధ్య మహిమపరచబడటానికీ, విశ్వసించిన వారందరి మధ్య ఆశ్చర్యంతో ప్రశంసించబడటానికీ వచ్చినప్పుడు—ఎందుకంటే మీకు మేమిచ్చిన సాక్ష్యం నమ్మబడింది—ఆ రోజున.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ὅταν ἔλθῃ
  choice: ఆ రోజున ఆయన వచ్చినప్పుడు
  rationale: ὅταν తో కూడిన aorist subjunctive ఇక్కడ నిర్దిష్టమైన భవిష్య సంఘటనను సూచిస్తుంది. ‘వచ్చినప్పుడు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం; చివరనున్న కాలవాచకాన్ని ముందుకు తెచ్చి సంఘటనకు స్పష్టమైన చట్రం ఇచ్చాం.
- source_word: ἐνδοξασθῆναι
  choice: మహిమపరచబడటానికి
  rationale: దైవిక మహిమ భావాన్ని నిలుపుతూ passive infinitive ను ప్రయోజనార్థకంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τοῖς ἁγίοις αὐτοῦ
  choice: తన పరిశుద్ధుల మధ్య
  rationale: ἐν ఇక్కడ ‘మధ్య’ లేదా ‘లో’ అనే రెండు భావాలకు వీలు ఇస్తుంది. ప్రధాన పాఠంలో సహజమైన సామూహిక భావానికి ‘మధ్య’ ఎంచుకుని, ‘వారిలో’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: θαυμασθῆναι
  choice: ఆశ్చర్యంతో కొనియాడబడటానికి
  rationale: కేవలం ‘ఆరాధించబడటం’ లేదా ‘మెచ్చుకోబడటం’ కంటే, ఆశ్చర్యం కలిసిన ప్రశంసను ఈ పదబంధం సహజంగా తెలియజేస్తుంది.
- source_word: ἐν πᾶσιν τοῖς πιστεύσασιν
  choice: విశ్వసించిన వారందరి మధ్య
  rationale: Participial రూపంలోని క్రియాత్మక భావాన్ని ‘విశ్వసించిన వారు’గా నిలిపి, ముందున్న ἐν పదబంధంతో సమాంతరతను కాపాడాం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: థెస్సలొనీకయులు విశ్వసించినవారిలో చేరడానికి కారణాన్ని తెలిపే causal సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπιστεύθη
  choice: నమ్మబడింది
  rationale: τὸ μαρτύριον కర్తగా ఉన్న passive రూపాన్ని నేరుగా, స్పష్టంగా అనువదిస్తుంది.
- source_word: τὸ μαρτύριον ἡμῶν
  choice: మేమిచ్చిన సాక్ష్యం
  rationale: అపొస్తలుల సాక్ష్యప్రకటన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘మా సాక్ష్యం’ కంటే గ్రహీతల వైపు దాని ప్రసారాన్ని కొద్దిగా స్పష్టం చేస్తుంది.
- source_word: ἐφ’ ὑμᾶς
  choice: మీకు
  rationale: సాక్ష్యం థెస్సలొనీకయులకు అందించబడిన దిశను సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: ఆ రోజున
  rationale: భవిష్యత్తులోని ఆ నిర్ణాయక దినాన్ని సూచించే ప్రామాణిక కాలవాచక ప్రయోగం.
theological_decisions:
- issue: అంత్యకాల సందర్భంలో ‘తన పరిశుద్ధులు’ అనే పదబంధం యొక్క సూచన మరియు ἐν యొక్క భావం
  choice: క్రీస్తుకు చెందిన పరిశుద్ధ ప్రజలను సూచిస్తూ ‘తన పరిశుద్ధుల మధ్య’ అని అనువదించాం.
  alternative: ‘తన పరిశుద్ధులలో’—ఆయన మహిమ వారిలో ప్రత్యక్షమవుతుందనే భావాన్ని ముందుకు తెస్తుంది.
  rationale: వెంటనే వచ్చే ‘విశ్వసించిన వారందరు’ అనే సమాంతర పదబంధం విశ్వాసులనే సూచనగా బలపరుస్తుంది. అయితే ἐν లోని ‘లో’ భావాన్ని పూర్తిగా తొలగించకుండా పాదటిప్పణిలో భద్రపరిచాం.
- issue: πιστεύσασιν మరియు ἐπιστεύθη ద్వారా అపొస్తలుల ప్రకటనకు విశ్వాసంతో స్పందించడం
  choice: ‘విశ్వసించిన వారు’ మరియు ‘సాక్ష్యం నమ్మబడింది’ అనే సాధారణ విశ్వాస భాషను వాడాం.
  alternative: ‘నమ్మిక ఉంచిన వారు’ లేదా ‘సాక్ష్యాన్ని విశ్వాసంతో స్వీకరించారు.’
  rationale: మూలపాఠం ఇక్కడ ప్రత్యేక సిద్ధాంతపరమైన సాంకేతిక అర్థాన్ని బలవంతం చేయదు. రెండు συγγεν పదాల విశ్వాస భావాన్ని స్పష్టంగా నిలిపాం.
- issue: ἐνδοξασθῆναι మరియు θαυμασθῆναι యొక్క purpose/result సంబంధం
  choice: ఆయన రాక యొక్క ఉద్దేశం లేదా ఫలితంగా ‘మహిమపరచబడటానికి’ మరియు ‘ఆశ్చర్యంతో కొనియాడబడటానికి’ అని ఇచ్చాం.
  alternative: ‘మహిమపరచబడతాడు, ఆశ్చర్యానికి గురిచేస్తాడు’ అని ఫలిత వాక్యాలుగా ఇవ్వడం.
  rationale: Infinitive నిర్మాణాల సమాంతరతను నిలుపుతూ, ఉద్దేశం మరియు ఫలితం మధ్య మూలంలోని సున్నితమైన విస్తృతిని అతిగా నిర్ణయించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పరిశుద్ధులు,’ ‘మహిమపరచబడటం,’ ‘సాక్ష్యం’ వంటి పౌలీన పదజాలాన్ని నిలిపి, క్లిష్టమైన గ్రీకు వాక్యక్రమాన్ని తెలుగులో సహజంగా అమర్చాం. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠంలో ఉంది.
