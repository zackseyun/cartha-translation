revisions:
- from: దానికే ఆయన మా సువార్త ద్వారా మిమ్మల్ని పిలిచాడు—మన ప్రభువైన యేసు మెస్సీయ[a] మహిమను పొందడానికి[b].
  to: దాని కోసం ఆయన మా సువార్త ద్వారా మిమ్మల్ని పిలిచాడు—మన ప్రభువైన యేసు మెస్సీయ యొక్క మహిమను పొందడానికి[b].
  rationale: The revision removes the unmarked emphasis and improves idiomatic Telugu while retaining the source's purposive ambiguity. It also makes the possessive relation of ‘glory’ to the Lord Jesus Messiah explicit. Footnote b is adjusted so its alternative ‘share in’ rendering retains the source's specified glory.
