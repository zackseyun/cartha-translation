id: 2TH.2.14
reference: 2 Thessalonians 2:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰς ⸀ὃ ἐκάλεσεν ὑμᾶς διὰ τοῦ εὐαγγελίου ἡμῶν, εἰς περιποίησιν δόξης τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/014.yaml
  text: to which he called you through our gospel[b][a], for obtaining the glory of our Lord Jesus the Messiah.
translation:
  language: te
  text: దాని కోసం ఆయన మా సువార్త ద్వారా మిమ్మల్ని పిలిచాడు—మన ప్రభువైన యేసు మెస్సీయ యొక్క మహిమను పొందడానికి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘మహిమను పొందడానికి’ అనే మాటను ‘మహిమను స్వాధీనం చేసుకోవడానికి’ లేదా ‘మన ప్రభువైన యేసు మెస్సీయ మహిమలో పాలుపొందడానికి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: దానికే
  rationale: ఈ సంబంధవాచక ప్రయోగం ముందటి వచనంలో చెప్పిన రక్షణ, పరిశుద్ధీకరణ, సత్యవిశ్వాసం వైపు తిరిగి చూపుతుంది. ‘దానికే’ ఉద్దేశాన్ని సూచిస్తూ, దాని పూర్వపదాన్ని అనవసరంగా ఒకే అంశానికి పరిమితం చేయదు.
- source_word: ἐκάλεσεν
  choice: పిలిచాడు
  rationale: దేవుని రక్షణ సంబంధమైన పిలుపును తెలిపే పౌలు వాడుకకు ‘పిలిచాడు’ సహజమైనది; ఇది ఆ పిలుపు స్వభావాన్ని ఒక నిర్దిష్ట సిద్ధాంత పద్ధతిలో వివరించదు.
- source_word: διὰ τοῦ εὐαγγελίου ἡμῶν
  choice: మా సువార్త ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సాధనాన్ని సూచిస్తుంది. ‘మా సువార్త’ అపొస్తలులు ప్రకటించిన సువార్త అనే పౌలు ప్రయోగాన్ని సంక్షిప్తంగా నిలుపుతుంది; అది వారికి చెందిన వేరొక సువార్త అని సూచించదు.
- source_word: εἰς περιποίησιν
  choice: పొందడానికి
  rationale: περιποίησις పొందడం, స్వాధీనం చేసుకోవడం, కలిగియుండడం వంటి భావాలను కలిగి ఉంది. ‘పొందడానికి’ ఉద్దేశార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, భావాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: δόξης
  choice: మహిమను
  rationale: περιποίησιςకు పూరకంగా ఉన్న షష్ఠీ రూపాన్ని తెలుగులో కర్మరూపంగా సహజంగా వ్యక్తం చేస్తుంది; ‘మహిమ’ కొత్త నిబంధనలో స్థిరమైన, గౌరవప్రదమైన పదం.
- source_word: τοῦ κυρίου ἡμῶν
  choice: మన ప్రభువైన
  rationale: κύριοςకు ‘ప్రభువు’ అనే స్థిరమైన తెలుగు పదాన్ని ఉంచి, సంబంధాన్ని సహజమైన విశేషణ నిర్మాణంలో తెలిపింది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదు భావాన్ని కలిగి ఉన్నందున ‘మెస్సీయ’ అని అనువదించబడింది. సాంప్రదాయిక ‘క్రీస్తు’ రూపం పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: పౌలు రక్షణశాస్త్రంలో దేవుని పిలుపు స్వభావం
  choice: ‘పిలిచాడు’ అని మాత్రమే అనువదించడం
  alternative: ‘ఫలప్రదంగా పిలిచాడు’ లేదా ‘ఆహ్వానించాడు’
  rationale: మూలపాఠం దేవుడు సువార్త ద్వారా పిలిచాడని చెబుతుంది; ఆ పిలుపును తప్పనిసరిగా ఫలించే పిలుపుగా గానీ, కేవలం ఆహ్వానంగా గానీ అనువాదంలో నిర్ణయించకుండా వాక్యంలోని theological tension నిలుపబడింది.
- issue: Χριστοῦ పదం బిరుదా, స్థిరనామమా
  choice: ప్రధాన పాఠ్యంలో ‘మెస్సీయ’
  alternative: ‘క్రీస్తు’
  rationale: ఈ సందర్భంలో Χριστός యొక్క అభిషిక్తుడనే బిరుదు భావం ఇంకా స్పష్టంగా ఉంది. అయితే తెలుగు క్రైస్తవ సంప్రదాయంలో పరిచితమైన ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో నిలిపాం.
- issue: ప్రభువు మహిమను ‘పొందడం’ అనే సంబంధం
  choice: మూలంలోని విస్తృతమైన ‘పొందడానికి’ అనే భావాన్ని నిలుపడం
  alternative: ‘మహిమలో పాలుపొందడానికి’ లేదా ‘మహిమను స్వాధీనం చేసుకోవడానికి’
  rationale: మూలంలోని περιποίησις మరియు షష్ఠీ నిర్మాణం పొందడం, స్వాధీనం, పాలుపంచుకోవడం వంటి భావాలకు వీలు ఇస్తుంది. ప్రధాన పాఠ్యం వాటిలో ఒక్కదానిని సిద్ధాంతపరంగా ఖరారు చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘దానికే’ ముందటి సందర్భంతో అనుసంధానాన్ని ఉంచుతుంది. విరామచిహ్నంగా దీర్ఘ గీత ఉద్దేశం/లక్ష్యాన్ని స్పష్టంగా చూపుతుంది. ‘మా సువార్త’ పౌలు వాడుకను నిలుపుతున్నప్పటికీ, సాధారణ పాఠకునికి కూడా అర్థమయ్యే స్థిరమైన బైబిలు పదబంధం.
