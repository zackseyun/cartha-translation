id: 2TH.2.15
reference: 2 Thessalonians 2:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄρα οὖν, ἀδελφοί, στήκετε, καὶ κρατεῖτε τὰς παραδόσεις ἃς ἐδιδάχθητε εἴτε διὰ λόγου εἴτε δι’ ἐπιστολῆς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/015.yaml
  text: So then[a], brothers, stand firm and hold fast to the traditions that you were taught, whether by word or by our letter.
translation:
  language: te
  text: కాబట్టి, సహోదరులారా,[a] స్థిరంగా నిలబడండి; మాట ద్వారా గానీ మా లేఖ ద్వారా గానీ మీకు బోధించబడిన సంప్రదాయాలను గట్టిగా పట్టుకోండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సహోదర సహోదరీలారా’; గ్రీకులో ‘సహోదరులు’ అని ఉంది, అయితే ఈ సంబోధన సంఘమంతటినీ ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: కాబట్టి
  rationale: రెండు అనుమానార్థక కణాలు ముందటి వాదన నుంచి వచ్చే బలమైన నిర్ధారణను సూచిస్తున్నాయి. ఆధునిక తెలుగులో ‘కాబట్టి’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: గ్రీకు పదం పుంలింగ బహువచన సంబోధన. మూలరూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, సంఘమంతటికీ వర్తించే సంభావ్య సమగ్ర అర్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: στήκετε
  choice: స్థిరంగా నిలబడండి
  rationale: వర్తమాన ఆజ్ఞార్థకం నిరంతర దృఢత్వాన్ని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం నిలకడగా కొనసాగాలనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: κρατεῖτε
  choice: గట్టిగా పట్టుకోండి
  rationale: ఏదో ఒకదాన్ని దృఢంగా నిలుపుకొని దానికి కట్టుబడి ఉండడాన్ని ఈ క్రియ సూచిస్తుంది; ‘గట్టిగా పట్టుకోండి’ ఆ ఆజ్ఞ బలాన్ని కాపాడుతుంది.
- source_word: παραδόσεις
  choice: సంప్రదాయాలను
  rationale: παράδοσις అనేది అందించబడిన లేదా అప్పగించబడిన దానిని సూచిస్తుంది. ‘సంప్రదాయాలు’ ఆ మూలభావాన్ని కాపాడి, ఇక్కడి మౌఖిక-లిఖిత బోధనల రెండింటికీ సరిపోతుంది.
- source_word: ἐδιδάχθητε
  choice: నేర్చుకున్న
  rationale: రూపరీత్యా ఇది ‘మీకు బోధించబడిన’ అనే కర్మణి భావం. అయితే తెలుగులో ‘మీరు నేర్చుకున్న’ అనేది సహజంగా ఉండి, వారు అందుకున్న బోధనే ఉద్దేశమని సందర్భం స్పష్టం చేస్తుంది.
- source_word: διὰ λόγου
  choice: మా మాట ద్వారా
  rationale: పత్రికతో ఉన్న వ్యత్యాసం వల్ల λόγος ఇక్కడ మౌఖికంగా చెప్పిన మాటను సూచిస్తుంది. ‘మా’ అనేది తరువాతి ἡμῶν రెండింటికీ భావపరంగా వర్తించేలా తెలుగులో స్పష్టతనిస్తుంది.
- source_word: δι’ ἐπιστολῆς ἡμῶν
  choice: మా పత్రిక ద్వారా
  rationale: ఈ పదబంధం అపొస్తలుల లిఖిత సమాచారాన్ని సూచిస్తుంది. ‘మా పత్రిక’ గ్రీకు స్వామ్యార్థాన్ని మరియు మౌఖిక బోధనతోని వ్యత్యాసాన్ని కాపాడుతుంది.
theological_decisions:
- issue: అపొస్తల సంప్రదాయం గురించిన వాదోపవాదాల్లో παράδοσις పదానికి అనువాదం
  choice: సంప్రదాయాలను
  alternative: బోధలను; ఉపదేశాలను
  rationale: గ్రీకు పదం అప్పగించబడిన విషయాలనే స్పష్టంగా సూచిస్తుంది; ఈ వచనంలో అవి మౌఖికంగానూ పత్రిక ద్వారానూ అందించబడ్డాయి. ‘సంప్రదాయాలు’ అనే అనువాదం తరువాతి సంఘ సంబంధ సిద్ధాంత వివాదాలను నిర్ణయించకుండా మూలపద భావాన్ని నిలుపుతుంది.
- issue: మిశ్రమ సంఘాన్ని ఉద్దేశించే అవకాశం ఉన్న ἀδελφοί సంబోధన
  choice: సహోదరులారా
  alternative: సహోదర సహోదరీలారా
  rationale: ప్రధాన పాఠ్యంలో గ్రీకు పుంలింగ బహువచన రూపాన్ని కాపాడాం. ఇది సంఘంలోని స్త్రీపురుషులందరినీ ఉద్దేశించి ఉండవచ్చనే భావాన్ని పాదసూచికలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపాలు వాడబడ్డాయి. ‘స్థిరంగా నిలబడండి’ మరియు ‘గట్టిగా పట్టుకోండి’ అనే జంట ప్రయోగాలు గ్రీకు ఆజ్ఞల బలాన్ని నిలుపుతాయి. ‘సంప్రదాయాలు’ పదం మతపరమైన తరువాతి వివాదాలను ముందుగానే పరిష్కరించకుండా మూలంలోని అప్పగించబడిన బోధ భావాన్ని కాపాడుతుంది.
