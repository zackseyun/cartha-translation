source:
  edition: SBLGNT
  text: οὗ ἐστιν ἡ παρουσία κατ’ ἐνέργειαν τοῦ Σατανᾶ ἐν πάσῃ δυνάμει καὶ σημείοις καὶ τέρασιν ψεύδους
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/009.yaml
  text: whose coming is according to the working of Satan[b][a], with all power and signs and wonders of falsehood.
translation:
  language: te
  text: అతని రాక సాతాను కార్యాచరణకు అనుగుణంగా ఉంటుంది; అది సమస్త శక్తితోను, అబద్ధంతో కూడిన సూచక క్రియలతోను అద్భుతాలతోను కూడి ఉంటుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అబద్ధపు సూచక క్రియలతోను అద్భుతాలతోను.” మూలంలో అక్షరార్థంగా, “అబద్ధం యొక్క సూచక క్రియలు మరియు అద్భుతాలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: అతని
  rationale: ముందటి వచనంలోని ‘అక్రమపురుషుని’ని సూచించే సంబంధవాచక సర్వనామం. తెలుగులో ‘అతని రాక’ సహజంగా ఉండి షష్ఠీ సంబంధాన్ని నిలుపుతుంది.
- source_word: παρουσία
  choice: రాక
  rationale: ఈ అంత్యకాల సందర్భంలో కేవలం ఉనికికన్నా ప్రత్యక్షమవుతూ రావడం అనే భావం ప్రధానంగా ఉంది.
- source_word: κατ’ ἐνέργειαν
  choice: కార్యశక్తికి అనుగుణంగా
  rationale: κατά ఇక్కడ విధానాన్ని లేదా అనురూపతను, ἐνέργεια పనిచేసే ప్రభావశీల శక్తిని తెలియజేస్తాయి. ఈ పదబంధం సాతాను క్రియాశీల కార్యంతో ఆ రాకకు ఉన్న సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: τοῦ Σατανᾶ
  choice: సాతాను
  rationale: కొత్త నిబంధనలోని పేరుకు సాధారణ తెలుగు రూపం; షష్ఠీ భావం ‘సాతాను కార్యశక్తి’ అనే నిర్మాణంలో వ్యక్తమవుతుంది.
- source_word: ἐν πάσῃ δυνάμει
  choice: సమస్త శక్తితో
  rationale: ἐν ఇక్కడ తోడు లేదా సాధన భావాన్ని ఇస్తుంది; πάσῃ సమగ్రతను సూచిస్తుంది. δύναμις‌ను ముందుగానే ‘అద్భుత క్రియలు’గా పరిమితం చేయకుండా ‘శక్తి’గా ఉంచాం.
- source_word: σημείοις
  choice: సూచక క్రియలతో
  rationale: σημεῖον కేవలం గుర్తు కాక, ఏదో విషయాన్ని సూచించే అసాధారణ క్రియను ఇక్కడ తెలియజేస్తుంది.
- source_word: τέρασιν
  choice: అద్భుతాలతో
  rationale: ఆశ్చర్యాన్ని కలిగించే అసాధారణ ఘటనలను సూచించే సాధారణ, సహజ తెలుగు పదం.
- source_word: ψεύδους
  choice: అబద్ధానికి చెందిన
  rationale: షష్ఠీ రూపాన్ని సాధ్యమైనంతగా నిలిపి, ఇవి కేవలం నకిలీవని తేల్చకుండా అబద్ధం లేదా మోసంతో వాటి సంబంధాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సాతాను సంబంధమైన శక్తి, సూచక క్రియలు, అద్భుతాల స్వభావం
  choice: అవి అబద్ధానికి చెందినవని లేదా అబద్ధంతో లక్షణీకరించబడినవని తెలిపి, అవి పూర్తిగా నకిలీవా లేక వాస్తవమైన అసాధారణ శక్తి ప్రదర్శనలా అన్నది నిర్ధారించలేదు.
  alternative: ‘నకిలీ అద్భుతాలు’ లేదా ‘అబద్ధమాడే అద్భుతాలు’ అని అనువదించడం.
  rationale: ψεύδους అనే షష్ఠీ అబద్ధం/మోసంతో సంబంధాన్ని స్పష్టం చేస్తుంది; అయితే ఆ ఘటనల metaphysical స్వభావాన్ని నిర్ణయించదు. అందువల్ల మూలంలోని theological tension‌ను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి. ‘కార్యశక్తి’ ἐνέργεια యొక్క క్రియాశీల ప్రభావాన్ని సంక్షిప్తంగా అందిస్తుంది. మూలంలోని వరుస నిర్మాణాన్ని పూర్తిగా యాంత్రికంగా అనుకరించకుండా, తెలుగు పఠనసౌలభ్యం కోసం రెండు ఉపవాక్యాలుగా మలిచాం.
