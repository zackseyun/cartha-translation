id: 2TH.2.11
reference: 2 Thessalonians 2:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ διὰ τοῦτο ⸀πέμπει αὐτοῖς ὁ θεὸς ἐνέργειαν πλάνης εἰς τὸ πιστεῦσαι αὐτοὺς τῷ ψεύδει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/011.yaml
  text: And because of this[a], God sends them a working of delusion so that they may believe the lie,
translation:
  language: te
  text: దీని కారణంగా, దేవుడు వారికి భ్రమ కలిగించే ప్రభావాన్ని[a] పంపుతున్నాడు, వారు ఆ అబద్ధాన్ని నమ్మేలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మోసపు కార్యాన్ని,’ ‘భ్రమలోకి నడిపించే ప్రభావాన్ని’; సంప్రదాయంగా ‘బలమైన భ్రమను.’
    reason: ἐνέργειαν πλάνης అనే పదబంధం ప్రభావవంతంగా పనిచేసే భ్రమ/మోసాన్ని సూచిస్తుంది. ప్రధాన అనువాదం సహజమైన తెలుగులో ఆ భావాన్ని ఇస్తుంది; ప్రత్యామ్నాయాలు ‘కార్యం,’ ‘ప్రభావం,’ ‘భ్రమ’ అనే సమీప ఛాయలను సూచిస్తాయి.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: దీని కారణంగా
  rationale: ముందటి వచనంలో సత్యాన్ని ప్రేమించడానికి వారు నిరాకరించిన విషయాన్ని కారణంగా సూచిస్తుంది. కేవలం నిర్ధారణను కాకుండా గ్రీకు పదబంధంలోని స్పష్టమైన కారణార్థాన్ని నిలుపుతుంది.
- source_word: πέμπει
  choice: పంపుతున్నాడు
  rationale: వర్తమాన కాలంలోని ప్రత్యక్ష దైవిక చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; దాన్ని కేవలం అనుమతిగా బలహీనపరచదు.
- source_word: ἐνέργειαν πλάνης
  choice: భ్రమలో పడవేసే కార్యశక్తిని
  rationale: ἐνέργεια లోని పనిచేసే, ప్రభావం చూపే శక్తి భావాన్ని ‘కార్యశక్తి’ నిలుపుతుంది; πλάνη లోని భ్రమ, మోసం, తప్పుదారి భావాన్ని ‘భ్రమలో పడవేసే’ తెలియజేస్తుంది. గ్రీకు పదబంధం సూచించే క్రియాశీల ప్రభావాన్ని సహజమైన తెలుగులో ఇస్తూ, అది అంతర్గత ప్రభావమా బాహ్య కార్యమా అన్నది అతిగా నిర్ణయించదు.
- source_word: εἰς τὸ πιστεῦσαι
  choice: నమ్మేలా
  rationale: ఈ నిర్మాణంలోని ఉద్దేశం లేదా ఫలితం అనే రెండు సాధ్య ఛాయలనూ కఠినంగా వేరు చేయకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τῷ ψεύδει
  choice: ఆ అబద్ధాన్ని
  rationale: πιστεύω తో వచ్చే దత్తి విభక్తిని తెలుగులో సహజమైన కర్మరూపంగా అనువదించింది. ఏకవచన నిర్దిష్ట ఉపపదం సందర్భంలో ముందున్న ప్రత్యేక మోసాన్ని సూచించే అవకాశాన్ని ‘ఆ’ నిలుపుతుంది.
theological_decisions:
- issue: తీర్పులో భ్రమకు సంబంధించిన దేవుని ప్రత్యక్ష కార్యం
  choice: దేవుడు వారికి … పంపుతున్నాడు
  alternative: దేవుడు భ్రమ వారిపైకి రావడానికి అనుమతిస్తున్నాడు
  rationale: గ్రీకులో ὁ θεός అనే కర్త πέμπει (‘పంపుతున్నాడు’) అనే క్రియను ప్రత్యక్షంగా చేస్తాడు. దాన్ని కేవలం అనుమతిగా మార్చకుండా, మానవులు సత్యాన్ని తిరస్కరించడానికీ దేవుని తీర్పుకూ మధ్య వచనంలో ఉన్న ఉద్రిక్తతను అలాగే ఉంచాం.
- issue: εἰς τὸ πιστεῦσαι లో ఉద్దేశం–ఫలితం సంబంధం
  choice: వారు … నమ్మేలా
  alternative: దాని ఫలితంగా వారు … నమ్ముతారు
  rationale: గ్రీకు నిర్మాణం ఉద్దేశాన్నీ ఫలితాన్నీ సూచించగలదు. ‘నమ్మేలా’ ఈ రెండింటిలో ఒక్కదానినే తప్పనిసరిగా నిర్ణయించకుండా వాక్య సంబంధాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. ‘కార్యశక్తి’ కొంత సాంద్రమైన పదమైనా ἐνέργεια యొక్క క్రియాశీల, ప్రభావవంతమైన భావాన్ని నిలుపుతుంది; జోడించిన వివరణాత్మక భాగం దాన్ని సాధారణ పాఠకునికి స్పష్టంచేస్తుంది.
