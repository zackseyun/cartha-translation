id: 2TH.2.12
reference: 2 Thessalonians 2:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα κριθῶσιν ⸀πάντες οἱ μὴ πιστεύσαντες τῇ ἀληθείᾳ ἀλλὰ εὐδοκήσαντες ⸀τῇ ἀδικίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/012.yaml
  text: so that all may be judged who did not believe the truth but took pleasure in unrighteousness[a].
translation:
  language: te
  text: సత్యాన్ని నమ్మలేదు కానీ అనీతిలో ఆనందించిన వారందరూ తీర్పు పొందేలా[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దోషులుగా తీర్పు పొందేలా.’ సందర్భంలో గ్రీకు క్రియ ప్రతికూల తీర్పును సూచించగలదు; అయితే దాని మరింత అక్షరార్థం ‘తీర్పు పొందడం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: …లా
  rationale: ముందటి వాక్యంతో ఉద్దేశం లేదా ఫలిత సంబంధాన్ని సహజమైన తెలుగులో కలుపుతుంది; ఈ రెండింటిలో ఏ భావమో అతిగా నిర్ధారించదు.
- source_word: κριθῶσιν
  choice: తీర్పు పొందే
  rationale: κρίνω యొక్క ప్రాథమిక న్యాయపరమైన భావాన్ని నిలుపుతుంది. సందర్భంలో ప్రతికూల తీర్పు సూచితమైనా, ప్రధాన పాఠంలో ‘శిక్షకు గురి’ అని మరింత స్పష్టీకరించదు.
- source_word: πάντες
  choice: వారందరూ
  rationale: తర్వాతి రెండు క్రియావిశేషణ రూపాలతో సూచించబడిన సమూహమంతటినీ సహజంగా తెలుపుతుంది.
- source_word: οἱ μὴ πιστεύσαντες
  choice: నమ్మకుండా
  rationale: సత్యాన్ని నమ్మని వారిని సూచించే గ్రీకు విశేషణార్థక కృదంతాన్ని, సమాంతరమైన εὐδοκήσαντες తో కలిపి సహజ తెలుగు నిర్మాణంలో అందిస్తుంది.
- source_word: τῇ ἀληθείᾳ
  choice: సత్యాన్ని
  rationale: πιστεύω తో ఉన్న దత్తి విభక్తిని తెలుగు సకర్మక ప్రయోగంలో అందిస్తుంది; నిర్దిష్టమైన సువార్త సత్యాన్ని సూచించే భావాన్ని కాపాడుతుంది.
- source_word: ἀλλὰ
  choice: …కుండా,
  rationale: ‘నమ్మకుండా’ అనే వ్యతిరేక క్రియారూపాన్ని ‘ఆనందించిన’తో జతచేయడం ద్వారా ‘కాని’ అనే విరోధ భావం తెలుగులో సహజంగా వ్యక్తమవుతుంది.
- source_word: εὐδοκήσαντες
  choice: ఆనందించిన
  rationale: కేవలం సమ్మతించడం కాక, ఇష్టంతో సంతోషించడం అనే భావోద్వేగపూర్వక మరియు సంకల్పపూర్వక భావాన్ని తెలుపుతుంది.
- source_word: τῇ ἀδικίᾳ
  choice: అనీతిలో
  rationale: ἀδικία లోని విస్తృత నైతిక-దైవశాస్త్రీయ భావాన్ని గౌరవప్రదమైన, సాధారణ ఆధునిక తెలుగు పదంతో నిలుపుతుంది.
theological_decisions:
- issue: κριθῶσιν ను సాధారణ ‘తీర్పు పొందడం’గా అనువదించాలా, మరింత వివరణాత్మకమైన ‘దోషులుగా తీర్పు పొందడం’గా అనువదించాలా
  choice: తీర్పు పొందే
  alternative: దోషులుగా తీర్పు పొందే
  rationale: సందర్భం ప్రతికూల తీర్పును బలంగా సూచించినా, κρίνω స్వతహాగా విస్తృతంగా ‘తీర్పు తీర్చడం’ను సూచిస్తుంది. అందువల్ల ప్రధాన పాఠం మూలంలోని భావ ఉద్రిక్తతను నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ఇది ముందటి వచనంపై ఆధారపడే ἵνα ఉపవాక్యం కాబట్టి ముగింపులో ‘…లా’ ఉంచబడింది. [a] గుర్తు ప్రధాన పాఠంలో సంబంధిత పదబంధం వెంట ఉంది.
