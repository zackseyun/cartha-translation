  to: సత్యాన్ని నమ్మలేదు కానీ అనీతిలో ఆనందించిన వారందరూ తీర్పు పొందేలా[a].
  rationale: The revision explicitly renders ἀλλά with “కానీ,” while preserving the dependent-clause force of ἵνα through “తీర్పు పొందేలా.” “తీర్పు పొందడం” remains appropriately broader than “దోషులుగా తీర్పు పొందడం,” which is retained only in the footnote as a contextually possible alternative.
