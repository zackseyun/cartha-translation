id: 2TH.2.7
reference: 2 Thessalonians 2:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸ γὰρ μυστήριον ἤδη ἐνεργεῖται τῆς ἀνομίας· μόνον ὁ κατέχων ἄρτι ἕως ἐκ μέσου γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/007.yaml
  text: For the mystery of lawlessness is already at work[b][a]; only the one who now restrains will do so until he is out of the way.
translation:
  language: te
  text: ఎందుకంటే అధర్మపు మర్మం ఇప్పటికే పనిచేస్తోంది. ఇప్పుడు అడ్డుకొంటున్నవాడు[a], అతడు మధ్యనుండి తొలగే వరకు[b], అలాగే అడ్డుకొంటూనే ఉంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇప్పుడు వెనక్కి పట్టి ఉంచుతున్నవాడు.’ అడ్డుకొంటున్నవాడు ఎవరో గ్రీకు పాఠం గుర్తించదు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘అతడు తొలగించబడే వరకు.’ ఇది ఎలా జరుగుతుందో, లేదా ఎవరు చేస్తారో గ్రీకు పాఠం స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: మర్మం
  rationale: పౌలు వాడిన ఈ పదం కేవలం పరిష్కరించాల్సిన చిక్కును కాక, దాగి ఉన్నప్పటికీ ఇప్పుడు కార్యరూపంలో ఉన్న వాస్తవాన్ని సూచిస్తుంది. ‘మర్మం’ ఆ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐνεργεῖται
  choice: పనిచేస్తోంది
  rationale: అధర్మపు మర్మం ఇప్పటికే చురుకుగా కార్యం చేస్తున్నదనే వర్తమాన, కొనసాగుతున్న భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀνομίας
  choice: అధర్మపు
  rationale: దేవుని ధర్మానికీ క్రమానికీ విరుద్ధంగా ఉండే స్థితిని సూచిస్తూ, పరిసర వచనాల్లోని భావసంబంధాన్ని కాపాడుతుంది.
- source_word: μόνον
  choice: అయితే
  rationale: ముందటి ప్రకటనకు పరిమితి విధించే మలుపును సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది; కొనసాగుతున్న నిరోధాన్ని ‘వరకు’ మరియు ‘అడ్డగిస్తూనే’ కలిపి వ్యక్తం చేస్తాయి.
- source_word: ὁ κατέχων
  choice: ఇప్పుడు అడ్డగిస్తున్నవాడు
  rationale: వ్యక్తి ఎవరో నిర్ణయించకుండా, గ్రీకు వర్తమాన కృదంతంలోని నిరోధించడం లేదా వెనక్కి పట్టి ఉంచడం అనే భావాన్ని నిలుపుతుంది.
- source_word: ἄρτι
  choice: ఇప్పుడు
  rationale: అడ్డగించే కార్యం ప్రస్తుతం జరుగుతోందని నేరుగా సూచిస్తుంది.
- source_word: ἕως ἐκ μέσου γένηται
  choice: అతడు అడ్డునుండి తొలగే వరకు
  rationale: అతడు ఇక మధ్యలో లేదా అడ్డుగా లేని స్థితికి చేరడాన్ని తెలుపుతుంది; ఎవరో అతణ్ణి తొలగిస్తారని గ్రీకు స్పష్టంగా చెప్పనందున బాహ్య కర్తను చేర్చదు.
theological_decisions:
- issue: ὁ κατέχων అనే అడ్డగించేవాని గుర్తింపు
  choice: ‘ఇప్పుడు అడ్డగిస్తున్నవాడు’ అని మాత్రమే చెప్పి అతని గుర్తింపును నిర్ధారించలేదు.
  alternative: రోమా ప్రభుత్వం, మానవ ప్రభుత్వం, పరిశుద్ధాత్మ, దేవదూత, పౌలు లేదా అపొస్తలుల సువార్త ప్రకటనగా గుర్తించడం.
  rationale: ఈ వచనంలోని గ్రీకు పాఠం అడ్డగించే వ్యక్తిని పేర్కొంటుంది గాని అతడు ఎవరో వెల్లడించదు. అందువల్ల వివాదాస్పద అంత్యకాల వ్యాఖ్యానాన్ని అనువాదంలో చేర్చకుండా అస్పష్టతను కాపాడాం.
- issue: ἕως ἐκ μέσου γένηται లో తొలగింపుకు కర్త
  choice: ‘అతడు అడ్డునుండి తొలగే వరకు’ అని, బాహ్య కర్తను పేర్కొనకుండా అనువదించాం.
  alternative: ‘అతడు తొలగించబడే వరకు’ లేదా ‘ఎవరో అతణ్ణి అడ్డునుండి తీసివేసే వరకు.’
  rationale: γένηται అనే రూపం అతడు అడ్డునుండి వెలుపల ఉండే స్థితికి చేరడాన్ని సూచించగలదు; అతణ్ణి ఎవరు లేదా ఏ విధంగా తొలగిస్తారో పాఠం స్పష్టంగా చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని వాడాం. గ్రీకు వాక్యంలోని సంక్షిప్తతను తెలుగులో స్పష్టంచేయడానికి చివర ‘అడ్డగిస్తూనే ఉంటాడు’ అనే భావసహాయక పదబంధాన్ని చేర్చాం; ఇది సందర్భంలోని కొనసాగుతున్న నిరోధాన్ని తెలియజేస్తుంది, అడ్డగించేవాని గుర్తింపునో తొలగింపుకు కర్తనో నిర్ణయించదు.
