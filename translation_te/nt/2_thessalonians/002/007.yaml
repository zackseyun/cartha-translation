revisions:
- from: ఎందుకంటే, అధర్మపు మర్మం ఇప్పటికే పనిచేస్తోంది. అయితే ఇప్పుడు అడ్డగిస్తున్నవాడు[a], అతడు అడ్డునుండి తొలగే వరకు[b], అడ్డగిస్తూనే ఉంటాడు.
  to: ఎందుకంటే అధర్మపు మర్మం ఇప్పటికే పనిచేస్తోంది. ఇప్పుడు అడ్డుకొంటున్నవాడు[a], అతడు మధ్యనుండి తొలగే వరకు[b], అలాగే అడ్డుకొంటూనే ఉంటాడు.
  rationale: The revision replaces the less idiomatic restraint verb with standard modern Telugu and renders ἐκ μέσου without implying that the restrainer is himself an obstruction. It retains the source text’s unresolved identity of the restrainer and its lack of explicit agency for his departure/removal. Footnote markers remain correctly attached to the restrainer and the final temporal clause respectively.
