revisions:
- from: మీ హృదయాలను ప్రోత్సహించి[a], ప్రతి మంచి పనిలోనూ మంచి మాటలోనూ మిమ్మల్ని స్థిరపరచుగాక[b].
  to: మీ హృదయాలను ప్రోత్సహించుగాక[a], ప్రతి మంచి పనిలోను మాటలోను మిమ్మల్ని స్థిరపరచుగాక[b].
  rationale: The revision restores the coordinated prayer-wish force of both Greek optatives, retains the source’s work–word pairing and the scope of ‘good,’ and adjusts the first footnote so that its alternative sense reflects παρακαλέω rather than teaching.
  reviewer_model: gpt-5.6-terra
