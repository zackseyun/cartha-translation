base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/017.yaml
  text: encourage your hearts and strengthen them in every good work and word[a][b].
translation:
  language: te
  text: మీ హృదయాలను ప్రోత్సహించుగాక[a], ప్రతి మంచి పనిలోను మాటలోను మిమ్మల్ని స్థిరపరచుగాక[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీ హృదయాలను ఓదార్చుగాక’; παρακαλέσαι అనే పదానికి ‘ఓదార్చడం’ లేదా ‘హెచ్చరించడం’ అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ప్రతి మంచి పనిలోను మాటలోను మిమ్మల్ని బలపరచుగాక’ లేదా ‘దృఢపరచుగాక.’
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: ప్రోత్సహించి
  rationale: παρακαλέω అనే పదానికి ప్రోత్సహించడం, ఓదార్చడం, బోధించడం అనే భావాలు ఉండవచ్చు. 16వ వచనంలోని నిత్య ప్రోత్సాహంతో ఉన్న సంబంధాన్ని నిలుపుతూ, ఇక్కడి విస్తృత భావాన్ని ‘ప్రోత్సహించి’ సహజంగా తెలియజేస్తుంది.
- source_word: ὑμῶν τὰς καρδίας
  choice: మీ హృదయాలను
  rationale: καρδία సూచించే అంతరంగ వ్యక్తిత్వాన్ని కేవలం భావోద్వేగాలకు లేదా బుద్ధికి పరిమితం చేయకుండా బైబిలీయ రూపకాన్ని నిలుపుతుంది.
- source_word: στηρίξαι
  choice: స్థిరపరచుగాక
  rationale: στηρίζωలోని దృఢంగా చేయడం, నిలకడ కలిగించడం అనే భావాన్ని నేరుగా తెలియజేస్తుంది; ప్రార్థనాభిలాషను ‘గాక’ రూపం వ్యక్తం చేస్తుంది.
- source_word: ἐν παντὶ ἔργῳ καὶ λόγῳ ἀγαθῷ
  choice: ప్రతి మంచి పనిలోనూ మంచి మాటలోనూ
  rationale: ἐν సూచించే కార్యక్షేత్రాన్ని ‘లోనూ’తో చూపిస్తూ, ἀγαθῷ భావం పని, మాట రెండింటికీ వర్తిస్తుందని తెలుగులో స్పష్టంగా ఉండేందుకు ‘మంచి’ని పునరుక్తి చేసింది.
theological_decisions:
- issue: καρδίαను ఆధునిక మానసిక వర్గంగా వివరణాత్మకంగా అనువదించాలా
  choice: హృదయాలను
  alternative: అంతరంగాలను; మనసులను
  rationale: మూలంలోని బైబిలీయ మానవస్వరూప రూపకాన్ని కాపాడి, దానిని భావోద్వేగం లేదా బుద్ధి అనే ఒకే విభాగానికి పరిమితం చేయదు.
- issue: στηρίξαιను బలం కలిగించడంగా లేదా స్థిరత్వం కలిగించడంగా అనువదించాలా
  choice: స్థిరపరచుగాక
  alternative: బలపరచుగాక; దృఢపరచుగాక
  rationale: మూల క్రియలోని దృఢంగా నిలబెట్టడం అనే భావాన్ని ‘స్థిరపరచు’ నేరుగా నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో అందించడం ద్వారా భావపరిధిని చూపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే ప్రార్థనాభిలాష శైలి. ‘ప్రతి మంచి పనిలోనూ మంచి మాటలోనూ’ అనే సమాంతర నిర్మాణం మూలంలోని పని–మాట జంటను స్పష్టంగా నిలుపుతుంది.
