id: 2TH.2.6
reference: 2 Thessalonians 2:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ νῦν τὸ κατέχον οἴδατε, εἰς τὸ ἀποκαλυφθῆναι αὐτὸν ἐν τῷ ⸀ἑαυτοῦ καιρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/006.yaml
  text: And now you know what is restraining him[b][a], so that he may be revealed in his own time.
translation:
  language: te
  text: అతడు తన సొంత సమయంలో[b] బయలుపరచబడేలా, ఇప్పుడు అతణ్ణి అడ్డగిస్తున్నది ఏమిటో మీకు తెలుసు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతణ్ణి వెనక్కి నిలిపి ఉంచుతున్నది.” గ్రీకులో ఇది నపుంసకలింగ పదబంధం; అడ్డగిస్తున్నది ఎవరో లేదా ఏమిటో ఇక్కడ గుర్తించబడలేదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తనకు నియమించబడిన సమయంలో.” గ్రీకు పదబంధం తగిన లేదా నియమిత సమయం అనే భావాన్ని కూడా ఇవ్వవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ κατέχον
  choice: అతణ్ణి అడ్డగిస్తున్నది
  rationale: నపుంసకలింగంలో ఉన్న గ్రీకు కృదంతాన్ని వ్యక్తిగా గుర్తించకుండా, నిరోధించడం లేదా వెనక్కి నిలిపి ఉంచడం అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: οἴδατε
  choice: మీకు తెలుసు
  rationale: వర్తమానార్థం కలిగిన ఈ క్రియను సూటిగా అనువదిస్తూ, పాఠకులు ముందే పొందిన బోధను పౌలు జ్ఞాపకం చేస్తున్న భావాన్ని నిలుపుతుంది.
- source_word: εἰς τὸ ἀποκαλυφθῆναι
  choice: బయలుపరచబడేలా
  rationale: ఉద్దేశం లేదా ఫలితం అనే రెండు ఛాయలనూ బలవంతంగా విడదీయకుండా, గ్రీకు నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν τῷ ἑαυτοῦ καιρῷ
  choice: తన సొంత సమయంలో
  rationale: ἑαυτοῦలోని ‘తన సొంత’ భావాన్ని నిలుపుతూ, καιρόςను ‘నియమించబడిన సమయం’ అని మరింత నిర్దిష్టంగా వ్యాఖ్యానించకుండా అనువదిస్తుంది.
- source_word: νῦν
  choice: ఇప్పుడు
  rationale: కాలాన్ని సూచించే సాధారణ అవ్యయానికి సహజమైన సూటి అనువాదం.
- source_word: αὐτόν
  choice: అతణ్ణి / అతడు
  rationale: ముందు ప్రస్తావించబడిన బయలుపరచబడబోయే పురుష వ్యక్తిని సూచిస్తుంది; అతని గుర్తింపును అనువాదంలో అదనంగా నిర్ధారించదు.
theological_decisions:
- issue: అడ్డగిస్తున్న శక్తి లేదా వ్యక్తి ఎవరు?
  choice: ‘అతణ్ణి అడ్డగిస్తున్నది’ అని తటస్థంగా అనువదించి, దాని గుర్తింపును నిర్ధారించలేదు.
  alternative: రోమా ప్రభుత్వం, పరిశుద్ధాత్మ, దేవదూత సంబంధమైన శక్తి, లేదా దేవుని నిర్ణయం అని పేర్కొనడం.
  rationale: ఈ వచనం అడ్డగిస్తున్నదాని గుర్తింపును చెప్పదు; τὸ κατέχον నపుంసకలింగంలో ఉంది. కాబట్టి దీర్ఘకాలంగా చర్చించబడుతున్న వ్యాఖ్యానాల్లో దేనినీ అనువాదంలో చేర్చకుండా మూలపాఠంలోని అనిశ్చితిని నిలిపాం.
- issue: అంత్యకాల సందర్భంలో καιρός భావం
  choice: ‘తన సొంత సమయంలో’
  alternative: ‘తనకు నియమించబడిన సమయంలో’ లేదా ‘తగిన సమయంలో’
  rationale: καιρόςకు నియమితమైన లేదా తగిన సమయం అనే ఛాయ ఉండవచ్చు; అయితే ‘సొంత సమయంలో’ అనే అనువాదం మూలపాఠానికి దగ్గరగా ఉండి, ఈ సందర్భంలో లేని అదనపు నిర్దిష్టతను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. ‘అడ్డగిస్తున్నది’ అనే నపుంసక రూపం మూలంలోని అస్పష్టతను నిలుపుతుంది; రెండో వాక్యంలో ‘అది’ను పునరుక్తి చేయడం ద్వారా గ్రీకు ఉద్దేశం/ఫలితం నిర్మాణాన్ని తెలుగులో సంపూర్ణంగా, సహజంగా వ్యక్తం చేశాం.
