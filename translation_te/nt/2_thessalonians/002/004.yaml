id: 2TH.2.4
reference: 2 Thessalonians 2:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ἀντικείμενος καὶ ὑπεραιρόμενος ἐπὶ πάντα λεγόμενον θεὸν ἢ σέβασμα, ὥστε αὐτὸν εἰς τὸν ναὸν τοῦ ⸀θεοῦ καθίσαι ἀποδεικνύντα ἑαυτὸν ὅτι ἔστιν θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/004.yaml
  text: the one who opposes and exalts himself over every so-called god or object of worship[a], so that he takes his seat in the temple of God[b], displaying himself as being God.
translation:
  language: te
  text: దేవుడని పిలువబడే ప్రతి దానినీ లేదా పూజించబడే ప్రతి దానినీ ఎదిరిస్తూ, వాటన్నిటికంటే తనను తాను హెచ్చించుకునేవాడు; అలా అతడు దేవుని ఆలయంలో[a] కూర్చొని, తానే దేవుడని[b] తనను తాను చూపించుకుంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవుని పవిత్రస్థలంలో.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “తాను ఒక దేవుడినని.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀντικείμενος
  choice: ఎదిరిస్తూ ... వాడు
  rationale: వర్తమానకాల మధ్యమ కృదంతం ఉపపదంతో వ్యక్తిని సూచిస్తోంది. సాంకేతిక బిరుదును చేర్చకుండా, కొనసాగుతున్న వ్యతిరేకతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὑπεραιρόμενος
  choice: తనను తాను హెచ్చించుకునేవాడు
  rationale: ఈ రూపంలోని స్వీయోన్నతి భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐπὶ πάντα λεγόμενον θεὸν
  choice: దేవుడని పిలువబడే ప్రతిదానికంటే
  rationale: ἐπί ఇక్కడ ఆధిక్యాన్ని సూచిస్తుంది; λεγόμενον ఆ వస్తువు నిజంగా దేవుడని వచనం ధృవీకరించకుండా, దానికి ఇవ్వబడే పేరును మాత్రమే తెలియజేస్తుంది.
- source_word: ἢ σέβασμα
  choice: పూజించబడే ప్రతిదానినీ
  rationale: σέβασμα దేవతను మాత్రమే కాక మతపరంగా పూజింపబడే ఏ వస్తువునైనా సూచించగలదు; ఈ విస్తృతిని అనువాదం నిలుపుతుంది.
- source_word: ὥστε
  choice: చివరికి
  rationale: ముందున్న వ్యతిరేకత, స్వీయోన్నతి ఎటువంటి పరాకాష్ఠకు లేదా ఫలితానికి దారితీస్తాయో సహజమైన తెలుగు వాక్యప్రవాహంలో తెలియజేస్తుంది.
- source_word: εἰς τὸν ναὸν τοῦ θεοῦ
  choice: దేవుని ఆలయంలో
  rationale: ναός ప్రత్యేకంగా ఆలయం లేదా దాని పవిత్ర అంతర్భాగాన్ని సూచించగలదు. ప్రధాన పాఠంలో సహజమైన ‘ఆలయం’ను ఉంచి, మరింత నిర్దిష్టమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: καθίσαι
  choice: కూర్చొని
  rationale: ఫలితాన్ని తెలిపే నిర్మాణంలో అతడు ఆలయంలో స్థానం ఆక్రమించడాన్ని సూటిగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀποδεικνύντα ἑαυτὸν
  choice: చూపించుకుంటాడు
  rationale: బహిరంగంగా తనను ఒక నిర్దిష్ట స్థితిలో ఉన్నవానిగా చూపించుకోవడం అనే భావాన్ని నిలుపుతుంది; అధికారిక ప్రకటన చేశాడనే అదనపు భావాన్ని చేర్చదు.
- source_word: ὅτι ἔστιν θεός
  choice: తానే దేవుడని
  rationale: ఆలయంలో కూర్చోవడం అనే సందర్భంలో ఉన్న అత్యున్నత దైవిక హక్కుదావా యొక్క తీవ్రతను వ్యక్తం చేస్తుంది. θεός నిర్దిష్ట ఉపపదం లేకుండా ఉండడం వల్ల ‘ఒక దేవుడు’ అనే అర్థసాధ్యతను పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: చివరి θεός ను ‘దేవుడు’గా అనువదించాలా, ‘ఒక దేవుడు’గా అనువదించాలా
  choice: తానే దేవుడని
  alternative: తాను ఒక దేవుడినని
  rationale: దేవుని ఆలయంలో కూర్చుని తనను చూపించుకోవడం అనే సందర్భం అత్యున్నత దైవిక హక్కుదావాను సూచిస్తుంది. అయితే θεός కు నిర్దిష్ట ఉపపదం లేనందున ‘ఒక దేవుడు’ అనే వ్యాకరణపరమైన సాధ్యతను పాదసూచికలో నిలిపాం.
- issue: ναός ను సాధారణంగా ‘ఆలయం’గా అనువదించాలా, మరింత నిర్దిష్టంగా ‘పవిత్రస్థలం’గా అనువదించాలా
  choice: దేవుని ఆలయం
  alternative: దేవుని పవిత్రస్థలం
  rationale: ‘ఆలయం’ సాధారణ పాఠకునికి స్పష్టంగా ఉండి, పౌలు ఉద్దేశించినది అక్షరార్థ ఆలయమా లేక రూపకాలంకారమైన పవిత్ర పరిధియా అనే వ్యాఖ్యాన ప్రశ్నను ముందుగానే పరిష్కరించదు. ναός యొక్క మరింత నిర్దిష్ట అర్థాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని వ్యక్తి-వర్ణనను తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా అమర్చాం; వ్యతిరేకత, స్వీయోన్నతి, ఆలయంలో కూర్చోవడం, దైవిక హక్కుదావా అనే క్రమాన్ని నిలిపాం.
