id: 2TH.2.3
reference: 2 Thessalonians 2:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μή τις ὑμᾶς ἐξαπατήσῃ κατὰ μηδένα τρόπον· ὅτι ἐὰν μὴ ἔλθῃ ἡ ἀποστασία πρῶτον καὶ ἀποκαλυφθῇ ὁ ἄνθρωπος τῆς ⸀ἀνομίας, ὁ υἱὸς τῆς ἀπωλείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/003.yaml
  text: Let no one deceive you in any way[a], because that day will not come unless the rebellion comes first and the man of lawlessness is revealed[b], the son of destruction.
translation:
  language: te
  text: ఎవ్వరూ మిమ్మల్ని ఏ విధంగానూ మోసగించనివ్వకండి. ఎందుకంటే, మొదట తిరుగుబాటు[a] వచ్చి, అధర్మపు మనిషి[b]—నాశన పుత్రుడు—బయలుపరచబడితే తప్ప ఆ రోజు రాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విశ్వాస పరిత్యాగం’ లేదా ‘తొలగిపోవడం’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం నిర్ణయాత్మకమైన తిరుగుబాటును సూచించగలదు; చాలాసార్లు అది మతవిశ్వాసాన్ని విడిచిపెట్టడంగా అర్థం చేసుకోబడుతుంది.
    reason: alternative_reading
  - marker: b
    text: కొన్ని ప్రతులలో ‘అధర్మపు మనిషి’కు బదులుగా ‘పాపపు మనిషి’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ἐξαπατήσῃ
  choice: మోసగించనివ్వకండి
  rationale: క్రియకు ‘మోసగించడం, తప్పుదారి పట్టించడం’ అనే భావం ఉంది. నిషేధార్థక నిర్మాణంలో ఈ రూపం సహజమైన ఆధునిక తెలుగు హెచ్చరికగా ఉంటుంది.
- source_word: κατὰ μηδένα τρόπον
  choice: ఏ విధంగానూ
  rationale: ఎలాంటి పద్ధతిలోనూ మోసానికి లోనుకావద్దనే బలమైన నిషేధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న హెచ్చరికకు కారణాన్ని పరిచయం చేసే సంబంధాన్ని సహజంగా చూపిస్తుంది.
- source_word: ἐὰν μὴ ἔλθῃ
  choice: వచ్చి ... బయలుపరచబడితే తప్ప ఆ రోజు రాదు
  rationale: గ్రీకులో మునుపటి వచనం నుంచి అర్థమయ్యే ‘ఆ రోజు’ అనే కర్తను తెలుగులో స్పష్టత కోసం చేర్చి, ముందుగా జరగవలసిన షరతును నిలుపుతుంది.
- source_word: ἀποστασία
  choice: తిరుగుబాటు
  rationale: ఈ పదం తిరుగుబాటు, మతవిశ్వాస పరిత్యాగం లేదా తొలగిపోవడం అనే భావాలను కలిగి ఉండగలదు. ప్రధాన పాఠ్యంలో విస్తృత భావాన్ని నిలుపుతూ, ప్రత్యేక మతాంతరార్థాన్ని ముందుగానే నిర్ణయించకుండా ‘తిరుగుబాటు’ ఎంచుకోబడింది.
- source_word: πρῶτον
  choice: మొదట
  rationale: సంఘటనల క్రమాన్ని సూటిగా తెలియజేస్తుంది.
- source_word: ἀποκαλυφθῇ
  choice: బయలుపరచబడితే
  rationale: ఆ వ్యక్తి ప్రత్యక్షపరచబడతాడనే కర్మణి భావాన్ని, ప్రకటనాత్మక ఛాయను నిలుపుతుంది.
- source_word: ὁ ἄνθρωπος τῆς ἀνομίας
  choice: ధర్మవిరోధి అయిన మనిషి
  rationale: ἀνομίαలోని ధర్మాన్ని ఉల్లంఘించే, ధర్మానికి విరోధమైన స్థితిని సహజ తెలుగులో తెలియజేస్తూ, ఒక నిర్దిష్ట పురుష వ్యక్తిని సూచించే ఏకవచనాన్ని నిలుపుతుంది.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: నాశన పుత్రుడు
  rationale: నాశనంతో లక్షణాత్మకంగా లేదా గమ్యపరంగా సంబంధమున్న వ్యక్తిని సూచించే సెమిటిక్ శైలిని సాధ్యమైనంతవరకు నిలుపుతుంది.
theological_decisions:
- issue: ‘రాదు’ అనే క్రియకు గ్రీకులో వ్యక్తంగా లేని కర్త
  choice: మునుపటి వచనం నుంచి అర్థమయ్యే ‘ఆ రోజు’ను ప్రధాన పాఠ్యంలో చేర్చడం
  alternative: వాక్యాన్ని ‘ఎందుకంటే, మొదట తిరుగుబాటు వచ్చి... తప్ప’ అని అసంపూర్ణంగా వదలడం
  rationale: 2వ వచనంలోని ప్రభువు దినమే ఇక్కడ ఉద్దేశించబడింది. తెలుగులో వాక్యం స్పష్టంగా, సంపూర్ణంగా ఉండేందుకు ‘ఆ రోజు’ చేర్చబడింది; ఇది కొత్త వ్యాఖ్యానాన్ని ప్రవేశపెట్టదు.
- issue: ἀποστασία యొక్క అర్థపరిధి
  choice: తిరుగుబాటు
  alternative: విశ్వాస పరిత్యాగం; తొలగిపోవడం
  rationale: పదం విస్తృత తిరుగుబాటునూ, ప్రత్యేకంగా మతవిశ్వాసాన్ని విడిచిపెట్టడాన్నీ సూచించగలదు. వివాదాస్పద అంత్యకాల వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో ముందుగానే నిర్ణయించకుండా విస్తృత పదాన్ని ఉపయోగించి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: τῆς ἀνομίας వద్ద పాఠాంతరం
  choice: SBLGNT పాఠమైన ‘ధర్మవిరోధి’ని అనుసరించడం
  alternative: కొన్ని ప్రతులలోని ‘పాపపు మనిషి’
  rationale: అందించిన మూలపాఠం ἀνομίας అని ఉంది. ప్రసిద్ధమైన ἁμαρτίας పాఠాంతరాన్ని పరిశీలనకు వీలుగా పాదసూచికలో తెలిపాం.
- issue: ὁ υἱὸς τῆς ἀπωλείας అనే సెమిటిక్ వ్యక్తీకరణ
  choice: నాశన పుత్రుడు
  alternative: నాశనానికి పాత్రుడైనవాడు; నాశనానికి నియమించబడినవాడు
  rationale: మూలంలోని రూపక నిర్మాణాన్ని నిలుపుతూ, ఆ వ్యక్తి నాశనంతో గాఢంగా సంబంధించాడనే భావాన్ని ఇస్తుంది; అతని గమ్యంపై అవసరానికి మించిన వివరణను ప్రధాన పాఠ్యంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. వాక్య నిర్మాణం సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఉంచినా, ‘నాశన పుత్రుడు’ అనే మూలంలోని సెమిటిక్ రూపకం మరియు ἀποστασία చుట్టూ ఉన్న అర్థసందిగ్ధత నిలుపబడ్డాయి.
