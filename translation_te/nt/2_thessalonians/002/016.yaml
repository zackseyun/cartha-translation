id: 2TH.2.16
reference: 2 Thessalonians 2:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς καὶ ⸀θεὸς ⸀ὁ πατὴρ ἡμῶν, ὁ ἀγαπήσας ἡμᾶς καὶ δοὺς παράκλησιν αἰωνίαν καὶ ἐλπίδα ἀγαθὴν ἐν χάριτι,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/016.yaml
  text: May our Lord Jesus the Messiah himself[a], and God our Father, who loved us and gave us eternal encouragement and good hope by grace,
translation:
  language: te
  text: ఇక మన ప్రభువైన యేసు మెస్సీయ తానే, మనలను ప్రేమించి కృపచేత శాశ్వతమైన ప్రోత్సాహాన్ని[a], మంచి నిరీక్షణను అనుగ్రహించిన మన తండ్రియైన దేవుడూ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘శాశ్వతమైన ఆదరణను’ లేదా ‘శాశ్వతమైన ఓదార్పును.’
    reason: παράκλησις అనే గ్రీకు పదం ప్రోత్సాహం, ఆదరణ, ఓదార్పు అనే పరస్పర సంబంధిత భావాలను వ్యక్తం చేయగలదు.
lexical_decisions:
- source_word: Αὐτὸς
  choice: తానే
  rationale: తీవ్రతను సూచించే αὐτός, ప్రభువైన యేసు మెస్సీయ వ్యక్తిగత కార్యాన్ని నొక్కిచెబుతుంది; తెలుగులో ‘తానే’ సహజంగా ఆ ఉద్ఘాటనను నిలుపుతుంది.
- source_word: δὲ
  choice: ఇక
  rationale: δέ ఇక్కడ బలమైన వ్యతిరేకతను కాకుండా ప్రార్థనాత్మక ఆశీర్వాదానికి మృదువైన మార్పును సూచిస్తుంది; ‘ఇక’ ఆ సంభాషణాత్మక మార్పును సహజంగా తెలియజేస్తుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: క్రీస్తుకు సంబంధించిన బిరుదుగా κύριοςకు ప్రామాణికమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: Ἰησοῦς Χριστὸς
  choice: యేసు మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదు భావాన్ని కలిగి ఉంది; ‘మెస్సీయ’ మూలపదంలోని అభిషిక్త రాజు భావాన్ని పారదర్శకంగా నిలుపుతుంది.
- source_word: θεὸς ὁ πατὴρ ἡμῶν
  choice: మన తండ్రియైన దేవుడు
  rationale: θεός మరియు πατήρ రెండింటినీ నిలుపుతూ, తెలుగులో సహజమైన అన్వయాన్ని ఇస్తుంది.
- source_word: ὁ ἀγαπήσας
  choice: మనలను ప్రేమించి
  rationale: ఆర్టికల్‌తో కూడిన భూతకాల కృదంతాన్ని తెలుగులో సహజమైన పూర్వకాల క్రియారూపంగా వ్యక్తం చేస్తుంది; ప్రేమ యొక్క చర్యను అదనపు కాలవ్యాఖ్య లేకుండా నిలుపుతుంది.
- source_word: δοὺς
  choice: అనుగ్రహించిన
  rationale: ‘ఇచ్చిన’ అనే ప్రాథమిక భావాన్ని నిలుపుతూ, దేవుడు కృపతో ఇచ్చే వరాల సందర్భంలో గౌరవప్రదమైన సహజ తెలుగు పదాన్ని ఉపయోగిస్తుంది.
- source_word: παράκλησιν
  choice: ప్రోత్సాహం
  rationale: సందర్భంలో విశ్వాసుల హృదయాలను బలపరచడం ప్రధానంగా కనిపిస్తుంది. అయినా ఈ పదానికి ఆదరణ లేదా ఓదార్పు అనే అర్థాలూ సాధ్యమైనందున వాటిని పాదసూచికలో నిలుపుతున్నాం.
- source_word: αἰωνίαν
  choice: శాశ్వతమైన
  rationale: అంతం లేని, నిలిచివుండే స్వభావాన్ని సూచించే αἰώνιος భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἐλπίδα ἀγαθὴν
  choice: మంచి నిరీక్షణ
  rationale: మూలంలోని విశేషణ-నామవాచక నిర్మాణాన్ని సహజమైన తెలుగులో నేరుగా నిలుపుతుంది.
- source_word: ἐν χάριτι
  choice: కృపచేత
  rationale: ἐν ఇక్కడ సాధనార్థకంగా లేదా కారణార్థకంగా ఉంది; ప్రోత్సాహం, నిరీక్షణ కృప మూలంగా అనుగ్రహించబడ్డాయని ‘కృపచేత’ సంక్షిప్తంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ప్రేమించి… అనుగ్రహించిన’ అనే ఏకవచన గ్రీకు కృదంతాలకు, ‘ప్రభువైన యేసు మెస్సీయ’ మరియు ‘మన తండ్రియైన దేవుడు’ అనే సమన్విత కర్తలతో ఉన్న సంబంధం
  choice: వివరణాత్మక విస్తరణ చేయకుండా, తండ్రియైన దేవుడికి సమీపంగా ఉండే ఒకే కృదంత శ్రేణిగా అనువదించడం
  alternative: ప్రేమించడం, అనుగ్రహించడం అనే చర్యలను యేసు మెస్సీయకూ తండ్రియైన దేవునికీ స్పష్టంగా వర్తింపజేస్తూ బహువచనంగా విస్తరించడం
  rationale: గ్రీకు వాక్యంలో ఇద్దరు సమన్విత కర్తల తరువాత ఏకవచన కృదంతాలు ఉన్నాయి. తెలుగు అనువాదం వాటిని బహువచనంగా మార్చి ఒక నిర్దిష్ట సిద్ధాంత నిర్ణయాన్ని బలవంతంగా చేర్చదు; అదే సమయంలో ఇద్దరు కర్తలతో కూడిన ప్రార్థనాత్మక నిర్మాణాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఇది 17వ వచనంలో పూర్తయ్యే ప్రార్థనాత్మక వాక్యభాగం కాబట్టి చివర కామా ఉంచబడింది; ‘దేవుడూ’ అనే సముచ్చయ రూపం తరువాతి వచనంలోని ప్రధాన క్రియతో అన్వయిస్తుంది.
