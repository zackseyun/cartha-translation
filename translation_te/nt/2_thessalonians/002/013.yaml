id: 2TH.2.13
reference: 2 Thessalonians 2:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ ὀφείλομεν εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου, ὅτι εἵλατο ὑμᾶς ὁ θεὸς ⸀ἀπαρχὴν εἰς σωτηρίαν ἐν ἁγιασμῷ πνεύματος καὶ πίστει ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/013.yaml
  text: But we ought always to give thanks to God for you[a], brothers beloved by the Lord, because God chose you as firstfruits for salvation through sanctification by the Spirit and faith in the truth[b],
translation:
  language: te
  text: అయితే ప్రభువు ప్రేమించిన సహోదరులారా[b], మీ విషయమై మేము ఎల్లప్పుడూ దేవునికి కృతజ్ఞతలు చెల్లించాలి. ఎందుకంటే ఆత్మచేత పవిత్రీకరణ ద్వారా, సత్యంపై విశ్వాసం ద్వారా రక్షణ పొందడానికి దేవుడు మిమ్మల్ని ప్రథమఫలంగా[a] ఎన్నుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో, “దేవుడు మిమ్మల్ని ఆదినుంచి రక్షణ కోసం ఎన్నుకున్నాడు” అని ఉంది. ప్రధాన పాఠం ἀπαρχήν (“ప్రథమఫలంగా”) అనే పాఠాన్ని అనుసరిస్తుంది; ప్రత్యామ్నాయ పాఠం ἀπ’ ἀρχῆς (“ఆదినుంచి”).
    reason: textual_variant
  - marker: b
    text: “సహోదరులు” అనేది పుంలింగ బహువచనమైన ἀδελφοίకు అనువాదం; ఈ సంబోధన విశ్వాసులైన స్త్రీపురుషులందరినీ కలుపుకొని ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: అయితే ... మేము
  rationale: δέ ముందున్న వర్గంతో వ్యత్యాసాన్ని సూచిస్తుంది; స్పష్టంగా ఉన్న Ἡμεῖςకు తగిన ఉద్ఘాటనను ‘మేము’ నిలుపుతుంది.
- source_word: ὀφείλομεν
  choice: చెల్లించాలి
  rationale: కృతజ్ఞతలు తెలపడం సముచితమైన నైతిక బాధ్యత అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν
  choice: మీ విషయమై మేము ఎల్లప్పుడూ దేవునికి కృతజ్ఞతలు చెల్లించాలి
  rationale: పౌలు వాడే కృతజ్ఞతా ప్రయోగాన్ని సహజంగా అందిస్తూ, πάντοτε మరియు περὶ ὑμῶν భావాలను నిలుపుతుంది.
- source_word: ἀδελφοὶ
  choice: సహోదరులారా
  rationale: సంబోధనను, గ్రీకు పుంలింగ బహువచన రూపాన్ని నేరుగా నిలుపుతుంది; సంఘమంతా ఉద్దేశించబడి ఉండవచ్చనే విషయాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
- source_word: ἠγαπημένοι ὑπὸ κυρίου
  choice: ప్రభువు ప్రేమించిన
  rationale: కర్తృవాచక ὑπόతో కూడిన భూతకృదంత భావాన్ని స్పష్టంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: εἵλατο
  choice: ఎన్నుకున్నాడు
  rationale: αἱρέομαι మధ్యమరూపానికి ఇక్కడ ఉన్న ‘ఎంచుకోవడం’ అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యేక ఎన్నిక సిద్ధాంతాన్ని అదనంగా చేర్చదు.
- source_word: ἀπαρχὴν
  choice: ప్రథమఫలంగా
  rationale: SBLGNTలోని ἀπαρχήν పాఠాన్ని అనుసరించి మొదట అర్పించే పంటఫలం అనే రూపకాన్ని నిలుపుతుంది; ప్రత్యామ్నాయ పాఠాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: εἰς σωτηρίαν
  choice: రక్షణ పొందడానికి
  rationale: εἰς సూచించే లక్ష్యాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: ఆత్మచేత పవిత్రీకరణ ద్వారా
  rationale: ἐν యొక్క సాధనార్థక భావాన్ని ‘ద్వారా’తో, πνεύματος యొక్క కర్తృత్వాన్ని ‘చేత’తో చూపుతుంది; ‘ఆత్మ’ అనే రూపం మూలంలోని సాధ్యమైన అర్థసూక్ష్మతను పూర్తిగా తొలగించదు.
- source_word: καὶ πίστει ἀληθείας
  choice: సత్యంపై విశ్వాసం ద్వారా
  rationale: ἀληθείαςను πίστις యొక్క విషయంగా తీసుకుని ‘సత్యంపై విశ్వాసం’ అని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ἐν ἁγιασμῷ πνεύματοςలో πνεύματος అర్థం
  choice: రక్షణ సందర్భంలో దేవుని ఆత్మ పవిత్రీకరించే కర్తగా ప్రధానంగా గ్రహించబడే ‘ఆత్మచేత’
  alternative: మానవ ఆత్మకు సంబంధించిన పవిత్రీకరణ
  rationale: పౌలు రక్షణ గురించి మాట్లాడే ఈ సందర్భం పరిశుద్ధాత్మ కార్యాన్ని బలంగా సూచిస్తుంది. అయినా మూలంలో ప్రత్యేక విశేషణం లేకపోవడంతో తెలుగు ప్రధాన పాఠంలో ‘పరిశుద్ధాత్మ’ అని విస్తరించకుండా ‘ఆత్మ’ అని ఉంచి కొంత అర్థసూక్ష్మతను కాపాడింది.
- issue: εἵλατο ὑμᾶς ὁ θεὸς యొక్క సిద్ధాంతపరమైన పరిధి
  choice: దేవుడు మిమ్మల్ని ఎన్నుకున్నాడు
  alternative: దేవుడు మిమ్మల్ని తనకొరకు తీసుకున్నాడు / నియమించాడు
  rationale: క్రియ యొక్క నేర అర్థాన్ని మాత్రమే తెలియజేస్తుంది; ఎన్నిక విధానం లేదా క్రమం గురించి పాఠంలో లేని ఏ మతశాఖా వివరణను చేర్చదు.
- issue: ἀπαρχήν మరియు ἀπ’ ἀρχῆς అనే పాఠభేదం
  choice: SBLGNT పాఠమైన ‘ప్రథమఫలంగా’
  alternative: ‘ఆదినుంచి’
  rationale: ఇచ్చిన మూలపాఠాన్ని ప్రధాన పాఠంలో అనుసరిస్తూ, ప్రాచీన ప్రతులలో ఉన్న ముఖ్యమైన ప్రత్యామ్నాయ పాఠాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సంఘపఠనానికి అనువైన శైలి వాడబడింది. ‘ప్రథమఫలం,’ ‘పవిత్రీకరణ,’ ‘విశ్వాసం’ వంటి కీలక బైబిలు భావపదాలను నిలుపుతూ, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా తీర్చిదిద్దాం. పాదటిప్పణి గుర్తులను అవి వివరించే పదాల దగ్గర ఉంచాం.
