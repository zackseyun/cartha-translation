id: 2TH.2.2
reference: 2 Thessalonians 2:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰς τὸ μὴ ταχέως σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς ⸀μηδὲ θροεῖσθαι μήτε διὰ πνεύματος μήτε διὰ λόγου μήτε δι’ ἐπιστολῆς ὡς δι’ ἡμῶν, ὡς ὅτι ἐνέστηκεν ἡ ἡμέρα τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/002.yaml
  text: that you not be quickly shaken from your mind or alarmed[a], either by a spirit or by a message or by a letter as if from us[b], to the effect that the day of the Lord has come.
translation:
  language: te
  text: మీరు మీ స్థిరబుద్ధి నుంచి త్వరగా కదిలిపోకండి, కలవరపడకండి—ప్రభువు దినం వచ్చిందని[b] చెప్పే ఆత్మ[a] ద్వారానైనా, సందేశం ద్వారానైనా, లేదా మా నుంచి వచ్చినట్టుగా చెప్పబడే ఉత్తరం ద్వారానైనా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆధ్యాత్మిక సందేశం,’ లేదా ‘ప్రవచనాత్మక ప్రకటన.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఇప్పటికే వచ్చి ఉంది,’ లేదా ‘ప్రస్తుతం ఉంది.’ గ్రీకు పరిపూర్ణ క్రియ, ప్రభువు దినం ఇప్పటికే వచ్చి ఇప్పుడు ఉన్నదని కొందరు చెబుతున్న భావాన్ని వ్యక్తం చేయగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ταχέως
  choice: త్వరగా
  rationale: హెచ్చరికకు వెంటనే లేదా సులభంగా ప్రభావితమవడం అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς
  choice: మీ స్థిరబుద్ధి నుంచి కదిలిపోకండి
  rationale: σαλεύω లోని ‘కదిలించడం’ అనే రూపకాన్ని నిలుపుతూ, νοῦς ఇక్కడ సూచించే స్థిరమైన ఆలోచనా స్థితిని స్పష్టం చేస్తుంది.
- source_word: θροεῖσθαι
  choice: కలవరపడకండి
  rationale: భయాందోళనకు గురికావడం లేదా తీవ్రంగా చెదరిపోవడం అనే భావాన్ని అతిశయించకుండా తెలుపుతుంది.
- source_word: πνεύματος
  choice: ఆత్మ
  rationale: గ్రీకు పదానికి దగ్గరగా ఉండి, ఇది ఆత్మను సూచిస్తుందా లేక ఆధ్యాత్మిక/ప్రవచన ప్రకటనను సూచిస్తుందా అనే సందర్భసిద్ధమైన సందిగ్ధతను నిలుపుతుంది.
- source_word: λόγου
  choice: సందేశం
  rationale: ఉత్తరంతో పోల్చబడిన మౌఖిక సమాచారం లేదా బోధ అనే సందర్భార్థాన్ని ‘మాట’ కంటే స్పష్టంగా అందిస్తుంది.
- source_word: ἐπιστολῆς
  choice: ఉత్తరం
  rationale: వ్రాతపూర్వక సమాచారానికి ఆధునిక తెలుగులో సహజమైన పదం.
- source_word: ὡς δι’ ἡμῶν
  choice: మా నుంచి వచ్చినట్టుగా ఉన్న
  rationale: ఆ ఉత్తరాన్ని పౌలు మరియు అతని సహచరులకు తప్పుగా ఆపాదిస్తున్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐνέστηκεν
  choice: వచ్చేసింది
  rationale: ఆ దినం ఇప్పటికే వచ్చి ప్రస్తుతం ఉన్నదనే గ్రీకు పరిపూర్ణ క్రియ భావాన్ని సాధారణ పాఠకుడికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἡ ἡμέρα τοῦ κυρίου
  choice: ప్రభువు దినం
  rationale: ఇది వారపు ఆరాధన దినం కాక, స్థిరమైన అంత్యకాల సంబంధ పదబంధం అని తెలియజేసే సాంప్రదాయికమైన, స్పష్టమైన అనువాదం.
theological_decisions:
- issue: ἐνέστηκεν అనే క్రియలోని అంత్యకాల సంబంధ భావం
  choice: వచ్చేసింది
  alternative: ఇప్పటికే వచ్చి ఉంది / ప్రస్తుతం ఉంది
  rationale: పరిపూర్ణ క్రియ రాకతో ఏర్పడిన ప్రస్తుత వాస్తవాన్ని సూచించగలదు. ప్రధాన పాఠం ఆ దినం ఇప్పటికే వచ్చిందనే వాదనను సహజంగా తెలుపుతుంది; ‘ప్రస్తుతం ఉంది’ అనే మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: πνεύματος అనే పదం సూచించే మూలం
  choice: ఆత్మ
  alternative: ఆధ్యాత్మిక ఉచ్చారణ / ప్రవచన ప్రకటన / ఆత్మీయ సందేశం
  rationale: నిర్దేశక ఉపపదం లేని ఈ నామవాచకం సందర్భంలో ప్రకటించబడిన ఆధ్యాత్మిక లేదా ప్రవచన ప్రకటనను సూచించవచ్చు; అయితే దాన్ని ప్రధాన పాఠంలోనే నిర్దిష్టంగా తీర్మానించకుండా అక్షరార్థాన్ని నిలిపి, వివరణాత్మక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘స్థిరబుద్ధి నుంచి కదిలిపోవడం’ ద్వారా మూలంలోని రూపకాన్ని ఉంచి దాని సందర్భార్థాన్ని స్పష్టం చేశాం. గ్రీకు వాక్యంలోని దీర్ఘ నిర్మాణాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించి చదవడానికి సులభం చేశాం; భావసంబంధాన్ని ‘అలా జరగనివ్వకండి’తో నిలిపాం.
