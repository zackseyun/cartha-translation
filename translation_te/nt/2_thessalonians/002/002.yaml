  to: మీరు మీ స్థిరబుద్ధి నుంచి త్వరగా కదిలిపోకండి, కలవరపడకండి—ప్రభువు దినం వచ్చిందని[b] చెప్పే ఆత్మ[a] ద్వారానైనా, సందేశం ద్వారానైనా, లేదా మా నుంచి వచ్చినట్టుగా చెప్పబడే ఉత్తరం ద్వారానైనా.
  rationale: అనవసరమైన చివరి ఆజ్ఞను తొలగించి, ఆత్మ/సందేశం/ఉత్తరం అనే మూలాల త్రయాన్ని నేరుగా ‘కదిలిపోకండి, కలవరపడకండి’ అనే హెచ్చరికకు కలిపాం. “మా నుంచి వచ్చినట్టుగా చెప్పబడే ఉత్తరం” అనేది ὡς δι’ ἡμῶνకు సహజమైన తెలుగు రూపం. పాదసూచిక aను ఆధునిక వాడుకకు అనుగుణంగా మార్చాం; పాదసూచిక b పరిపూర్ణ క్రియలోని ప్రత్యామ్నాయ ‘ప్రస్తుతం ఉంది’ భావాన్ని నిలుపుతుంది.
