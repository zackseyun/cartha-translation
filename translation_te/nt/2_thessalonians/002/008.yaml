id: 2TH.2.8
reference: 2 Thessalonians 2:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τότε ἀποκαλυφθήσεται ὁ ἄνομος, ὃν ὁ κύριος ⸀Ἰησοῦς ⸀ἀνελεῖ τῷ πνεύματι τοῦ στόματος αὐτοῦ καὶ καταργήσει τῇ ἐπιφανείᾳ τῆς παρουσίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/008.yaml
  text: And then the lawless one will be revealed[a], whom the Lord Jesus will slay with the breath of his mouth and bring to nothing by the appearance of his coming[b],
translation:
  language: te
  text: అప్పుడు ఆ ధర్మవిరోధి బయలుపరచబడతాడు; ప్రభువైన యేసు అతణ్ణి తన నోటి ఊపిరితో[a] చంపి, తన రాక ప్రత్యక్షత ద్వారా[b] నిర్వీర్యం చేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన నోటి ఆత్మతో.” ఇక్కడి గ్రీకు పదానికి “ఊపిరి,” “ఆత్మ” అనే రెండు అర్థాలూ సాధ్యమే; ఈ నుడికారంలో “ఊపిరి” మరింత సహజంగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తన సన్నిధి ప్రత్యక్షత ద్వారా.” ఇక్కడ παρουσία అనే గ్రీకు పదానికి ఈ సందర్భంలో సాధారణంగా “రాక” అనే భావం ఉన్నా, “సన్నిధి” అనే అర్థం కూడా దాని భావపరిధిలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκαλυφθήσεται
  choice: బయలుపరచబడతాడు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ, ఆ ధర్మవిరోధి ప్రత్యక్షంగా తెలియజేయబడతాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁ ἄνομος
  choice: ఆ ధర్మవిరోధి
  rationale: నామవాచకంగా వాడిన విశేషణాన్ని వ్యక్తిని సూచించే రూపంలో అనువదిస్తుంది; ఈ వచనంలో లేని ‘మనుష్యుడు’ అనే పదాన్ని చేర్చదు. నిర్దిష్ట ఉపపద భావాన్ని ‘ఆ’ తెలియజేస్తుంది.
- source_word: ὁ κύριος Ἰησοῦς
  choice: ప్రభువైన యేసు
  rationale: κύριος అనే స్థిరమైన బిరుదును ‘ప్రభువు’గా, వ్యక్తినామాన్ని ప్రామాణిక తెలుగు రూపమైన ‘యేసు’గా అందిస్తుంది.
- source_word: ἀνελεῖ
  choice: చంపి
  rationale: ఈ సందర్భంలో ἀναιρέω ప్రాణం తీయడాన్ని సూచిస్తుంది. ‘చంపి’ స్పష్టమైన, సహజమైన ఆధునిక తెలుగు; మూలంలోని క్రియాబలాన్ని తగ్గించదు.
- source_word: τῷ πνεύματι τοῦ στόματος αὐτοῦ
  choice: తన నోటి ఊపిరితో
  rationale: ఈ పదబంధంలో πνεῦμαకు ‘ఊపిరి’ అనే అర్థం సహజంగా సరిపోతుంది; ప్రవచనాత్మక తీర్పు చిత్రణను కూడా నిలుపుతుంది. ‘ఆత్మతో’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: καταργήσει
  choice: నిర్వీర్యం చేస్తాడు
  rationale: పనికిరాకుండా చేయడం, శక్తిని తొలగించడం, అంతం చేయడం అనే καταργέω భావాన్ని వ్యక్తం చేస్తుంది; ‘నాశనం చేస్తాడు’ అని సంపూర్ణ వినాశనాన్ని అవసరానికి మించి నిర్దేశించదు.
- source_word: τῇ ἐπιφανείᾳ
  choice: ప్రత్యక్షమవడం ద్వారా
  rationale: ἐπιφάνεια సూచించే కనబడే ప్రత్యక్షత లేదా ఆవిర్భావాన్ని సహజమైన తెలుగు క్రియానామ రూపంలో అందిస్తుంది.
- source_word: τῆς παρουσίας αὐτοῦ
  choice: తన రాక
  rationale: అంత్యకాల సందర్భంలో παρουσία సాధారణంగా రాకను లేదా ఆగమనాన్ని సూచిస్తుంది. ‘సన్నిధి’ అనే విస్తృత నిఘంటు అర్థాన్ని పాదసూచికలో భద్రపరిచాం.
theological_decisions:
- issue: అంత్యకాల ధర్మవిరోధి వ్యక్తి గుర్తింపు, వర్ణన
  choice: ఆ ధర్మవిరోధి
  alternative: ధర్మవిరోధి మనుష్యుడు
  rationale: ఈ వచనంలో ὁ ἄνομος అనే నామవాచకంగా వాడిన విశేషణమే ఉంది; సమీప వచనంలోని విస్తృత పదబంధాన్ని ఇక్కడికి దిగుమతి చేయకుండా మూల రూపానికి దగ్గరగా ఉంది.
- issue: ప్రభువైన యేసు విజయానికి సాధనం
  choice: తన నోటి ఊపిరితో
  alternative: తన నోటి ఆత్మతో
  rationale: ఈ నుడికారంలో ‘ఊపిరి’ అత్యంత సహజమైన అర్థం; అయినా πνεῦμαకు ‘ఆత్మ’ అనే అర్థం కూడా సాధ్యమైనందున దానిని పాదసూచికలో నిలిపాం.
- issue: παρουσία యొక్క అంత్యకాల భావం
  choice: రాక
  alternative: సన్నిధి
  rationale: ఈ సందర్భంలో ‘రాక’ ప్రధాన భావాన్ని సహజంగా తెలియజేస్తుంది; పదానికి సాధ్యమైన ‘సన్నిధి’ అర్థాన్ని పాదసూచికలో ఉంచడం ద్వారా భావపరిధిని అనవసరంగా మూసివేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని భావక్రమాన్ని నిలుపుతూ తెలుగు సహజత్వం కోసం రెండు వాక్యాలుగా విభజించాం. ‘నిర్వీర్యం చేస్తాడు’ అనేది నిర్ణయాత్మకంగా శక్తిహీనంచేయడాన్ని తెలియజేస్తూ, మూలం నిర్దేశించని సంపూర్ణ నిర్మూలన భావాన్ని చేర్చకుండా ఉంటుంది.
