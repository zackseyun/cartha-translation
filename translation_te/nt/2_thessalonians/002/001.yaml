source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, ὑπὲρ τῆς παρουσίας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ ἡμῶν ἐπισυναγωγῆς ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/001.yaml
  text: We ask you[a], brothers, concerning the coming of our Lord Jesus the Messiah and our gathering together to him[b],
translation:
  language: te
  text: సోదరులారా, మన ప్రభువైన యేసు మెస్సీయ రాకను గూర్చి, ఆయన దగ్గరకు మనం సమకూడడం గూర్చి మిమ్మల్ని వేడుకుంటున్నాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యేసు మెస్సీయ’కు సంప్రదాయ అనువాదం ‘యేసు క్రీస్తు.’ ‘సోదరులారా’ అనేది పౌలు వాడిన సంబోధన; సందర్భంలో ఆయన విశ్వాస సమాజమంతటినీ—స్త్రీలను కూడా—ఉద్దేశించి ఉండవచ్చు.
    reason: alternative_reading_and_lexical_scope
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: మిమ్మల్ని వేడుకుంటున్నాం
  rationale: ఇక్కడ ఈ క్రియ ఆజ్ఞను కాక సౌమ్యమైనప్పటికీ గంభీరమైన విజ్ఞప్తిని పరిచయం చేస్తుంది. ‘వేడుకుంటున్నాం’ ఆధునిక తెలుగులో ఆ విజ్ఞప్తి భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ ఇక్కడ బలమైన వ్యతిరేకతను కాక విషయమార్పును సూచిస్తుంది. తెలుగులో వాక్యప్రవాహమే ఆ మార్పును సహజంగా తెలియజేస్తుంది; ‘ఇప్పుడు’ అని పెడితే మూలంలో లేని కాలార్థం వినిపించవచ్చు.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: మూలంలోని పుంలింగ సంబోధనను నిలుపుతుంది. పౌలు వాడుకలో ఇది విశ్వాస సమాజమంతటికీ వర్తించే సంబోధన కావచ్చు.
- source_word: ὑπὲρ
  choice: గూర్చి
  rationale: ఇక్కడ చర్చకు తీసుకొస్తున్న విషయాన్ని సూచిస్తుంది; ప్రయోజనార్థకమైన ‘కొరకు’ అనే భావం కాదు.
- source_word: παρουσίας
  choice: రాకను
  rationale: παρουσίαకు ‘ఉనికి’ అనే సాధారణ అర్థం ఉన్నా, ఇక్కడ యేసు భవిష్యత్తులో రావడాన్ని సూచించే అంత్యకాల సంబంధమైన వాడుక స్పష్టంగా ఉంది.
- source_word: κυρίου
  choice: ప్రభువైన
  rationale: κύριος యొక్క అధికారపూర్వకమైన, స్థిరమైన నూతన నిబంధన బిరుదును సహజమైన తెలుగు నిర్మాణంలో నిలుపుతుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదు భావాన్ని కలిగి ఉంది. తెలుగులో ‘మెస్సీయ’ ఇప్పటికే బిరుదుగా గుర్తించబడేందున ‘యేసు మెస్సీయ’ సహజంగా, మూలానికి దగ్గరగా ఉంటుంది.
- source_word: ἐπισυναγωγῆς
  choice: మనం సమకూడడం
  rationale: విశ్వాసులు క్రీస్తు దగ్గరకు ఒకటిగా కూడడాన్ని సూచించే సమూహార్థాన్ని తెలియజేస్తుంది; సంస్థాగత ‘సభ’ అనే అదనపు భావాన్ని మోపదు.
- source_word: ἐπ’ αὐτόν
  choice: ఆయన దగ్గరకు
  rationale: ἐπί + accusative ఇక్కడ క్రీస్తువైపు కదలిక లేదా దిశను సూచిస్తుంది. ‘ఆయన దగ్గరకు’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: Χριστοῦ అనే క్రీస్తు సంబంధిత బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός పేరు వంటి స్థిరరూపం కంటే బిరుదుగా పనిచేస్తుంది; అందువల్ల దాని అర్థాన్ని తెలియజేసే ‘మెస్సీయ’ను ప్రధాన పాఠ్యంలో ఉంచాం. సంప్రదాయ ‘క్రీస్తు’ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: ἀδελφοί యొక్క పరిధి
  choice: సోదరులారా
  alternative: సోదర సోదరీమణులారా
  rationale: మూలంలోని వ్యాకరణపరమైన పుంలింగ సంబోధనను ప్రధాన పాఠ్యంలో నిలిపి, సందర్భంలో విశ్వాస సమాజమంతటినీ ఉద్దేశించి ఉండవచ్చనే విషయాన్ని పాదటిప్పణిలో తెలిపాం.
- issue: ప్రభువు రాకకూ విశ్వాసులు ఆయన దగ్గరకు సమకూడడానికీ మధ్య సంబంధం
  choice: రెండింటినీ ‘గూర్చి ... గూర్చి’ అని సమన్వయంగా ఉంచడం
  alternative: ఆయన రాక సమయంలో మనం సమకూడడం
  rationale: గ్రీకు పాఠ్యం καί ద్వారా రెండింటినీ కలుపుతుంది గాని వాటి ఖచ్చితమైన కాల లేదా తార్కిక సంబంధాన్ని నిర్వచించదు. కాబట్టి ప్రత్యేక అంత్యకాల పద్ధతిని చేర్చకుండా ఆ అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘గూర్చి’ స్వల్పంగా సాహిత్య గంభీరతను ఉంచినా సాధారణ పాఠకుడికి స్పష్టమే. మూలంలోని రెండు అంశాల సమన్వయాన్ని పునరుక్త ‘గూర్చి’తో స్పష్టంగా నిలిపాం.
