  yaml_path: translation/nt/2_thessalonians/002/005.yaml
  text: Do you not remember that while I was still with you, I was telling you these things?
translation:
  language: te
  text: నేను ఇంకా మీతో ఉన్నప్పుడు ఈ విషయాలను మీకు చెబుతూ ఉండేవాడినని మీకు గుర్తులేదా?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνημονεύετε
  choice: గుర్తులేదా
  rationale: వర్తమాన సూచక క్రియతో ఉన్న అలంకారప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, వారు మునుపటి బోధను జ్ఞాపకంలో ఉంచుకున్నారా అని అడుగుతుంది.
- source_word: ἔτι
  choice: ఇంకా
  rationale: పౌలు ఆ సమయంలో వారి దగ్గరే కొనసాగి ఉన్నాడనే కాలార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὢν πρὸς ὑμᾶς
  choice: మీతో ఉన్నప్పుడు
  rationale: πρός తో కూడిన ఈ ప్రయోగం వారి మధ్య పౌలు వ్యక్తిగతంగా ఉన్న కాలాన్ని సూచిస్తుంది; కాలార్థక అసమాపక భావాన్ని ‘ఉన్నప్పుడు’ స్పష్టంగా అందిస్తుంది.
- source_word: ταῦτα
  choice: ఈ విషయాలను
  rationale: బహువచన సూచనను నిలుపుతూ, సందర్భంలోని మునుపటి బోధాంశాలను సహజంగా సూచిస్తుంది.
- source_word: ἔλεγον
  choice: చెబుతూ ఉండేవాడినని
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగిన లేదా పునరావృతమైన బోధనా భావాన్ని తెలుగు అలవాటు భూతకాల రూపంతో అందిస్తుంది.
- source_word: οὐ ... ὅτι
  choice: …అని మీకు గుర్తులేదా?
  rationale: ὅτι జ్ఞాపకం చేసుకోవలసిన విషయాన్ని పరిచయం చేస్తుంది; తెలుగు పరోక్ష వాక్య నిర్మాణంలో ‘అని’ దానికి సహజ సమానం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన అలంకారప్రశ్న. గ్రీకు అసంపూర్ణ భూతకాలంలోని కొనసాగింపు/పునరావృతి భావాన్ని ‘చెబుతూ ఉండేవాడిని’ ద్వారా నిలిపింది; అవసరం లేని వ్యాఖ్యానాన్ని జోడించలేదు.
