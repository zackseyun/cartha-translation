id: 2TH.2.10
reference: 2 Thessalonians 2:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐν πάσῃ ἀπάτῃ ⸀ἀδικίας τοῖς ἀπολλυμένοις, ἀνθ’ ὧν τὴν ἀγάπην τῆς ἀληθείας οὐκ ἐδέξαντο εἰς τὸ σωθῆναι αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/010.yaml
  text: and with every deception of unrighteousness for those who are perishing[d][c][b][a], because they did not accept the love of the truth so as to be saved.
translation:
  language: te
  text: మరియు నశించిపోతున్నవారి మధ్య[b] అన్ని విధాలైన దుర్నీతి మోసంతో[a]—ఎందుకంటే, వారు రక్షించబడేలా[d] సత్యంపట్ల ప్రేమను వారు స్వీకరించలేదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అన్ని విధాలైన అనీతియుక్త వంచనతో.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నశించిపోతున్నవారి పట్ల’ లేదా ‘నశించిపోతున్నవారికి.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘స్వీకరించలేదు’ లేదా ‘ఆహ్వానపూర్వకంగా అంగీకరించలేదు.’
    reason: lexical_alternative
  - marker: d
    text: లేదా, ‘వారు రక్షించబడడానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτῃ
  choice: మోసంతో
  rationale: ‘మోసం’ క్రియాశీలంగా తప్పుదారి పట్టించే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ἐν తో వచ్చిన సాధన/పరిధి భావాన్ని ‘-తో’ నిలుపుతుంది.
- source_word: ἀδικίας
  choice: దుర్నీతికరమైన
  rationale: ἀδικία యొక్క నైతిక దుష్టత్వాన్ని తెలియజేస్తూ, తెలుగులో సహజంగా ‘మోసం’ను విశేషిస్తుంది. ‘అన్యాయం’ ఇక్కడ భావాన్ని అనవసరంగా సామాజిక న్యాయానికి పరిమితం చేయవచ్చు.
- source_word: τοῖς ἀπολλυμένοις
  choice: నశించిపోతున్నవారి మధ్య
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న స్థితిని ‘నశించిపోతున్న’గా నిలిపి, దత్తివిభక్తి యొక్క పరిధి/సంబంధ భావాన్ని ‘మధ్య’తో సహజంగా వ్యక్తం చేస్తుంది; వారిని ముందే ‘శాపగ్రస్తులు’గా నిర్ణయించే వ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: ἀνθ’ ὧν
  choice: ఎందుకంటే
  rationale: ఈ సందర్భంలో వారి స్థితికి కారణాన్ని పరిచయం చేసే భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: τὴν ἀγάπην τῆς ἀληθείας
  choice: సత్యంపట్ల ప్రేమను
  rationale: గ్రీకు షష్ఠీ సంబంధం సందర్భంలో ముఖ్యంగా సత్యాన్ని ప్రేమగా స్వీకరించడాన్ని సూచిస్తుంది. తెలుగు ‘సత్యంపట్ల ప్రేమ’ ఈ భావాన్ని సహజంగా తెలుపుతుంది.
- source_word: ἐδέξαντο
  choice: స్వీకరించలేదు
  rationale: δέχομαι లోని పొందడం, అంగీకరించడం, ఆహ్వానపూర్వకంగా చేర్చుకోవడం అనే భావాలకు ‘స్వీకరించు’ తగిన విస్తృత సమానార్థకం.
- source_word: εἰς τὸ σωθῆναι αὐτούς
  choice: తాము రక్షించబడేలా
  rationale: εἰς తో కూడిన ఆర్టిక్యులర్ ఇన్ఫినిటివ్‌లోని ఉద్దేశం లేదా ఫలిత భావాన్ని నిర్ణయాత్మకంగా ఒక్కదానికే పరిమితం చేయకుండా తెలుగులో సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘నశించిపోతున్నవారు’ అనేది స్థిరంగా విధించబడిన గమ్యమా, కొనసాగుతున్న స్థితియా?
  choice: నశించిపోతున్నవారు
  alternative: నాశనానికి విధించబడినవారు
  rationale: ἀπολλυμένοις వర్తమాన మధ్యమ/కర్మణి కృదంతం. అందువల్ల కొనసాగుతున్న స్థితిని చూపడం మూలానికి దగ్గరగా ఉండి, ప్రత్యేక రక్షణసిద్ధాంతాన్ని వచనంలోకి దిగుమతి చేయదు.
- issue: ‘సత్యపు ప్రేమ’ అంటే సత్యంపట్ల వారి ప్రేమా, లేక సత్యం వారిని ప్రేమించడమా?
  choice: సత్యంపట్ల ప్రేమ
  alternative: సత్యపు ప్రేమ
  rationale: గ్రీకు షష్ఠీ వ్యాకరణపరంగా కొంత విస్తృతమైనప్పటికీ, వారు దానిని స్వీకరించలేదనే సందర్భం సత్యంపట్ల ప్రేమనే బలంగా సూచిస్తుంది. తెలుగు అక్షరానువాదం ‘సత్యపు ప్రేమ’ అనవసర అస్పష్టతను కలిగిస్తుంది.
- issue: εἰς τὸ σωθῆναι αὐτούς ఉద్దేశాన్నా ఫలితాన్నా సూచిస్తుంది?
  choice: తాము రక్షించబడేలా
  alternative: తాము రక్షించబడడానికి
  rationale: ‘రక్షించబడేలా’ అనే రూపం ఉద్దేశం/ఫలితం మధ్య ఉన్న నిజమైన భావవిస్తృతిని పూర్తిగా మూసివేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ఈ వచనం ముందటి వచనంలోని క్రియపై ఆధారపడే గ్రీకు వాక్యభాగం కాబట్టి, మూలంలో లేని కొత్త ప్రధాన క్రియను చేర్చకుండా ప్రారంభంలోని ‘మరియు’ను, మధ్యలో దీర్ఘవిరామాన్ని ఉంచాం. పాదసూచిక గుర్తులన్నీ సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉన్నాయి.
