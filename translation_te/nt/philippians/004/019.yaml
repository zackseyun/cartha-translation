id: PHP.4.19
reference: Philippians 4:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ θεός μου πληρώσει πᾶσαν χρείαν ὑμῶν κατὰ ⸂τὸ πλοῦτος⸃ αὐτοῦ ἐν δόξῃ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/019.yaml
  text: And my God will supply every need of yours according to his riches in glory in Messiah Jesus[a][b][c][d].
translation:
  language: te
  text: అయితే నా దేవుడు తన ఐశ్వర్యానికి తగినట్లుగా మహిమలో మెస్సీయ యేసులో మీ ప్రతి అవసరాన్నీ తీర్చుతాడు.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “క్రీస్తు యేసులో.”'
    reason: lexical_alternative
  - marker: b
    text: “తన ఐశ్వర్యానికి తగినట్లుగా” అంటే దేవుని సమకూర్పుకు ఆయన ఐశ్వర్యమే కొలత లేదా ప్రమాణం; ఆయన ఐశ్వర్యం నుండి కొంత ఇవ్వడం మాత్రమే కాదు.
    reason: alternative_reading
  - marker: c
    text: “మహిమలో” అని ఉన్నదాన్ని “మహిమాన్వితంగా” అని కూడా అర్థం చేసుకోవచ్చు. గ్రీకు వాక్యంలో “మహిమలో” మరియు “మెస్సీయ యేసులో” అనే పదబంధాల పరస్పర సంబంధం కొంత అస్పష్టంగా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ θεός μου
  choice: అయితే నా దేవుడు
  rationale: δέ ఇక్కడ మునుపటి సందర్భంతో స్వల్ప సంధానాన్ని లేదా వ్యత్యాసాన్ని సూచిస్తుంది; ‘అయితే’ సహజంగా ఆ సంబంధాన్ని నిలుపుతుంది, ‘నా దేవుడు’ అనే వ్యక్తిగత భావాన్నీ కాపాడుతుంది.
- source_word: πληρώσει
  choice: తీర్చుతాడు
  rationale: ఈ సందర్భంలో πληρόω లోటుగా ఉన్నదాన్ని సమకూర్చి అవసరాన్ని తీర్చడం అనే అర్థం ఇస్తుంది; తెలుగులో ‘అవసరాన్ని తీర్చుతాడు’ సహజమైన, స్పష్టమైన ప్రయోగం.
- source_word: πᾶσαν χρείαν ὑμῶν
  choice: మీ ప్రతి అవసరాన్నీ
  rationale: χρεία అవసరం లేదా ఆవశ్యకతను సూచిస్తుంది; πᾶσαν యొక్క పంపిణీయ బలాన్ని ‘ప్రతి’ నిలుపుతుంది.
- source_word: κατὰ τὸ πλοῦτος αὐτοῦ
  choice: తన ఐశ్వర్యానికి తగినట్లుగా
  rationale: accusativeతో κατά ఇక్కడ మూలాన్ని మాత్రమే కాక ప్రమాణాన్ని లేదా కొలతను సూచిస్తుంది. ‘తగినట్లుగా’ దేవుని ఐశ్వర్యమే సమకూర్పుకు ప్రమాణమని వ్యక్తం చేస్తుంది.
- source_word: ἐν δόξῃ
  choice: మహిమలో
  rationale: గ్రీకు విభక్త్యర్థంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతూ, దానిని ‘మహిమగా’ అని పూర్తిగా క్రియావిశేషణంగా నిర్ణయించకుండా ఉంచుతుంది.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసులో
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తుంది; ‘మెస్సీయ’ దాని అర్థాన్ని తెలియజేస్తుంది. ‘యేసులో’ అనేది ἐν యొక్క ఐక్యత/పరిధి భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦ లో Χριστός అనువాదం
  choice: మెస్సీయ యేసులో
  alternative: క్రీస్తు యేసులో
  rationale: Χριστός బిరుదు యొక్క అర్థాన్ని ప్రధాన పాఠ్యంలో ‘మెస్సీయ’గా వ్యక్తం చేశాం; తెలుగు క్రైస్తవ వాడుకలో ప్రసిద్ధమైన ‘క్రీస్తు’ రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: ἐν δόξῃ యొక్క సంబంధం మరియు భావం
  choice: మహిమలో
  alternative: మహిమాన్వితంగా; లేదా ‘మహిమలో మెస్సీయ యేసులో’ అనే నిరంతర పదబంధం
  rationale: ఈ పదబంధం సమకూర్చే విధానాన్నా, పరిధినినా, లేక తరువాతి ἐν Χριστῷ Ἰησοῦతో సన్నిహితంగా కలుస్తుందా అన్నది గ్రీకులో పూర్తిగా నిర్ణీతం కాదు. ప్రధాన పాఠ్యం ఆ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సామాన్య పాఠకులకు సులభమైన శైలి. ‘ఐశ్వర్యం’, ‘మహిమ’, ‘మెస్సీయ’ వంటి బైబిలు భావపదాలను ఉంచి, వాక్య నిర్మాణాన్ని సహజ తెలుగు క్రమానికి మార్చాం. ప్రధాన పాఠ్యంలోని [a], [b], [c] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోతాయి.
