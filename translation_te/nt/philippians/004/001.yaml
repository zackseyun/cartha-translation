id: PHP.4.1
reference: Philippians 4:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥστε, ἀδελφοί μου ἀγαπητοὶ καὶ ἐπιπόθητοι, χαρὰ καὶ στέφανός μου, οὕτως στήκετε ἐν κυρίῳ, ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/001.yaml
  text: So then[a], my beloved and longed-for brothers, my joy and crown, stand firm in the Lord in this way[b], beloved.
translation:
  language: te
  text: కాబట్టి, నేను ప్రేమించే, చూడాలని ఎంతో తపించే నా సహోదరులారా[a], నా ఆనందమూ నా విజయకిరీటమూ[b] అయిన ప్రియులారా, ఈ విధంగా ప్రభువులో స్థిరంగా నిలబడండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సహోదరులారా” అనేది గ్రీకులోని పుంలింగ రూపాన్ని అనువదిస్తుంది; ఈ సందర్భంలో పౌలు కేవలం పురుషులను మాత్రమే కాక, సంఘంలోని తోటి విశ్వాసులందరినీ ఉద్దేశిస్తున్నాడు.
    reason: cultural_note
  - marker: b
    text: గ్రీకు పదం పోటీలో గెలిచినవారికి బహుమతిగా ఇచ్చే మాల లేదా కిరీటాన్ని సూచిస్తుంది; ఇది రాజకిరీటం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: కాబట్టి
  rationale: ముందటి వాదననుంచి వచ్చే నిర్ధారణాత్మక ప్రోత్సాహాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: గ్రీకులోని పుంలింగ సంబోధన రూపాన్ని నిలుపుతుంది; సందర్భంలో సంఘంలోని స్త్రీపురుష విశ్వాసులందరూ ఉద్దేశించబడ్డారని పాదసూచిక వివరిస్తుంది.
- source_word: ἀγαπητοὶ
  choice: ప్రియులారా / నేను ప్రేమించే
  rationale: రెండు సందర్భాల్లోనూ ప్రేమ భావాన్ని నిలుపుతూ, తెలుగు వాక్యప్రవాహానికి అనుగుణంగా మొదటిదాన్ని సంబంధవాచక రూపంలో, చివరిదాన్ని ప్రత్యక్ష సంబోధనగా ఇచ్చాం.
- source_word: ἐπιπόθητοι
  choice: చూడాలని ఎంతో తపించే
  rationale: లోతైన ఆపేక్షను సహజ తెలుగులో వ్యక్తపరుస్తుంది; కేవలం ‘గుర్తుకొచ్చే’ అనే బలహీన భావానికి పరిమితం చేయదు.
- source_word: χαρά
  choice: ఆనందం
  rationale: ఫిలిప్పీయులే పౌలు ఆనందమని చెప్పే రూపకాత్మక ప్రకటనను నేరుగా నిలుపుతుంది.
- source_word: στέφανος
  choice: విజయకిరీటం
  rationale: రాజకిరీటం కంటే పోటీలో గెలిచినవారికి ఇచ్చే పుష్పమాల లేదా కిరీటం అనే గ్రీకు సాంస్కృతిక చిత్రాన్ని ప్రధాన పాఠ్యంలో స్పష్టం చేస్తుంది.
- source_word: οὕτως
  choice: ఈ విధంగా
  rationale: ముందు చెప్పిన ప్రోత్సాహాన్ని అనుసరించి ఎలా స్థిరంగా నిలవాలో సూచించే విధానార్థక బలాన్ని కాపాడుతుంది.
- source_word: στήκετε
  choice: స్థిరంగా నిలబడండి
  rationale: దృఢంగా కొనసాగాలనే వర్తమాన ఆజ్ఞార్థక భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: పౌలు తరచుగా వాడే స్థానిక/సంబంధాత్మక పదబంధాన్ని అదనపు వ్యాఖ్యానం లేకుండా నిలుపుతుంది.
theological_decisions:
- issue: ἀδελφοί పదం సూచించే పరిధి
  choice: ప్రధాన పాఠ్యంలో పుంలింగ రూపమైన ‘సహోదరులారా’ ఉంచి, అది సంఘంలోని తోటి విశ్వాసులందరినీ ఉద్దేశిస్తుందని పాదసూచికలో తెలియజేయడం.
  alternative: ‘సహోదర సహోదరీలారా’ లేదా ‘తోటి విశ్వాసులారా’ అని ప్రధాన పాఠ్యంలో ఇవ్వడం.
  rationale: మూలంలోని వ్యాకరణ రూపాన్ని కాపాడుతూనే, పత్రిక మొత్తం సంఘానికి ఉద్దేశించబడిన సందర్భోచిత సమగ్రతను పాదసూచిక ద్వారా స్పష్టం చేస్తుంది.
- issue: στέφανος యొక్క రూపక స్వభావం
  choice: ‘విజయకిరీటం’ అని అనువదించడం.
  alternative: సాధారణంగా ‘కిరీటం’ లేదా అక్షరార్థానికి దగ్గరగా ‘విజయమాల’ అని ఇవ్వడం.
  rationale: ఇది రాజాధికార కిరీటం కాదని, విజేతకు ఇచ్చే మాల/కిరీటం చిత్రమని స్పష్టం చేస్తూ పౌలు గౌరవం, సంతోషం అనే రూపకాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, ఆప్యాయమైన సంబోధనను వాడాం. పౌలు ప్రేమాభిమానాల పునరుక్తిని సాధ్యమైనంతవరకు నిలిపి, పొడవైన సంబోధన సహజంగా వినిపించేలా తెలుగు వాక్య నిర్మాణాన్ని అమర్చాం.
