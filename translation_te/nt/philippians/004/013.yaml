  yaml_path: translation/nt/philippians/004/013.yaml
  text: I am able to do all things through the one who strengthens me[a][b].
translation:
  language: te
  text: నన్ను బలపరచేవాని ద్వారా నేను అన్నిటినీ చేయగలను[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అన్నిటికీ నేను సమర్థుణ్ణి.’ సందర్భంలో, ప్రతి విధమైన పరిస్థితిలో నిలబడగల సామర్థ్యం అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పాఠ్యంలో ‘నన్ను బలపరచేవాని’ అని ఉంది; ఈ వచనంలో ‘క్రీస్తు’ అనే పేరు స్పష్టంగా లేదు, అయితే సందర్భం ఆయననే సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: అన్నిటినీ
  rationale: ఈ నపుంసక బహువచన కర్మరూపం విస్తృతంగా ‘అన్నిటినీ’ అని అర్థమిస్తుంది. సందర్భం వివిధ పరిస్థితులను సూచిస్తున్నా, మూలంలోని విస్తృత భావాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: ἰσχύω
  choice: చేయగలను
  rationale: ఈ క్రియ బలం కలిగి ఉండడం లేదా సమర్థుడై ఉండడం అనే భావాన్ని ఇస్తుంది. πάνταతో కలిపి వచ్చినప్పుడు ‘అన్నిటినీ చేయగలను’ అనేది సహజమైన తెలుగు; ఇది స్వతంత్ర సామర్థ్యాన్ని కాక, తరువాత చెప్పిన బలపరచేవానిపై ఆధారపడిన సామర్థ్యాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐν
  choice: ద్వారా
  rationale: అక్షరార్థంగా ‘లో’ అనే భావం ఉన్నా, వ్యక్తిని సూచించే కృదంత పదబంధంతో ఇక్కడ సాధనం లేదా కార్యసాధక సంబంధం వ్యక్తమవుతుంది. తెలుగులో ‘ద్వారా’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τῷ ἐνδυναμοῦντί με
  choice: నన్ను బలపరచేవాని
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న వర్తమాన కృదంతాన్ని వ్యక్తిని సూచించే పదబంధంగా అనువదించింది. ఇది కొనసాగుతున్న బలపరచే కార్యాన్ని నిలుపుతూ, గ్రీకు వాక్యంలో లేని పేరు లేదా బిరుదును చేర్చదు.
theological_decisions:
- issue: ‘నన్ను బలపరచేవాని’ అనే పదబంధం సూచించే వ్యక్తి
  choice: ప్రధాన పాఠ్యంలో ‘క్రీస్తు’ లేదా ‘మెస్సీయ’ అని చేర్చకుండా మూలంలోని వ్యక్తిసూచక కృదంత పదబంధాన్నే నిలుపడం.
  alternative: ‘నన్ను బలపరచే క్రీస్తు ద్వారా’ లేదా ‘నన్ను బలపరచే మెస్సీయ ద్వారా’.
  rationale: సమీప మరియు విస్తృత సందర్భం యేసు మెస్సీయనే సూచిస్తున్నప్పటికీ, ఈ వచనంలోని గ్రీకు పాఠ్యం ఆయన పేరును స్పష్టంగా చెప్పదు. అందువల్ల ప్రధాన పాఠ్యం మూలంలో స్పష్టంగా ఉన్నదానినే అనువదిస్తుంది; సందర్భసంబంధ సూచనను పాదటీపులో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించబడింది. ‘నన్ను బలపరచేవాని’ అనే రూపం మూలంలోని వ్యక్తిసూచక కృదంతాన్ని నిలుపుతుంది; ‘అన్నిటినీ చేయగలను’ అనే సహజ వాక్యనిర్మాణం సందర్భపు పరిమితిని పాదటీపుతో స్పష్టం చేస్తుంది.
