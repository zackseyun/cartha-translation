    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: కృప
  rationale: పౌలు ఆశీర్వచనాల్లో వాడే ఈ పదానికి ఉన్న దేవుని అనుగ్రహం, దయ అనే విస్తృత భావాన్ని తెలుగులో స్థిరంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: κυρίου
  choice: ప్రభువైన
  rationale: ఇక్కడ κύριος యేసుకు చెందిన బిరుదు; ‘ప్రభువైన’ అనే రూపం తెలుగు వాక్యంలో సహజంగా పేరుతో అనుసంధానమవుతుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు క్రీస్తు
  rationale: తెలుగు క్రైస్తవ వాడుకలో గుర్తింపు పొందిన పేరూ బిరుదూ కలిసిన రూపం; ఈ పౌలు ఆశీర్వచన సూత్రంలో Χριστός పేరుతో సన్నిహితంగా కలిసివున్నప్పటికీ దాని బిరుదు నేపథ్యాన్ని ‘క్రీస్తు’ నిలుపుతుంది.
- source_word: μετὰ
  choice: తో
  rationale: షష్ఠీ విభక్తితో వచ్చిన μετά ఇక్కడ సహవాసం లేదా సన్నిధిని సూచిస్తుంది; తెలుగులో ‘తో’ సహజ సమానార్థకం.
- source_word: πνεύματος
  choice: ఆత్మ
  rationale: ఇక్కడ పరిశుద్ధాత్మను స్పష్టంగా సూచించడం లేదు; విశ్వాసుల అంతరంగ జీవాన్ని సమష్టిగా సూచించే ఏకవచనంగా అర్థం చేసుకోవడం సహజం.
- source_word: ὑμῶν
  choice: మీ
  rationale: ఇది బహువచన ద్వితీయ పురుష సర్వనామం; ఆధునిక ప్రామాణిక తెలుగులో ‘మీ’ ఆ బహువచన భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: Χριστοῦను ‘మెస్సీయ’గా అనువదించాలా, ‘క్రీస్తు’గా ఉంచాలా
  choice: క్రీస్తు
  alternative: మెస్సీయ
  rationale: Χριστόςకు బిరుదు భావం ఉన్నప్పటికీ, ఈ స్థిరమైన పౌలు ఆశీర్వచనంలో అది ‘యేసు’తో పేరులా సన్నిహితంగా కలిసివుంది. ఆధునిక తెలుగు పాఠకులకు ‘యేసు క్రీస్తు’ సహజంగా, స్పష్టంగా ఉండి బిరుదు భావాన్నీ పూర్తిగా తొలగించదు.
- issue: ‘మీ ఆత్మ’ పరిశుద్ధాత్మనా లేక పాఠకుల మానవ ఆత్మనా
  choice: పాఠకుల సమష్టి అంతరంగ జీవాన్ని సూచించే ‘మీ ఆత్మ’
  alternative: పరిశుద్ధాత్మ
  rationale: πνεύματοςకు ὑμῶν నేరుగా సంబంధించి ఉండటం వల్ల ‘మీ ఆత్మ’ అనే మానవ/సమష్టి భావమే వ్యాకరణపరంగా సహజం; మూలంలో లేని స్పష్టీకరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు, గౌరవప్రదమైన ఆశీర్వచన శైలి. ‘ఉండుగాక’ సాధారణ సంభాషణలో అరుదైనా ప్రార్థన/ఆశీర్వచన సందర్భంలో సహజంగా, సంక్షిప్తంగా ఉంటుంది. పాదసూచిక గుర్తు ప్రధాన వచనంలో చేర్చబడింది.
