id: PHP.4.8
reference: Philippians 4:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί, ὅσα ἐστὶν ἀληθῆ, ὅσα σεμνά, ὅσα δίκαια, ὅσα ἁγνά, ὅσα προσφιλῆ, ὅσα εὔφημα, εἴ τις ἀρετὴ καὶ εἴ τις ἔπαινος, ταῦτα λογίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/008.yaml
  text: Finally[a], brothers, whatever is true, whatever is honorable, whatever is just, whatever is pure, whatever is lovely, whatever is commendable—if there is any virtue and if there is any praise—think about these things.
translation:
  language: te
  text: చివరిగా, సహోదరులారా,[a] సత్యమైనవేవో, గౌరవనీయమైనవేవో, న్యాయమైనవేవో, స్వచ్ఛమైనవేవో, మనోహరమైనవేవో, మంచి పేరు పొందినవేవో—ఏదైనా సద్గుణం ఉంటే, ఏదైనా ప్రశంస ఉంటే—వీటిని గురించి ఆలోచించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సహోదర సహోదరీలారా”; గ్రీకులోని “సహోదరులు” అనే పదం విశ్వాస సమాజమంతటినీ ఉద్దేశించగలదు.
    reason: cultural_note
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: చివరిగా
  rationale: ముగింపు భాగంలోని ఉపదేశానికి మార్పును సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం; ‘ఇక మిగిలిన విషయంగా’ అనే భావం కూడా సాధ్యమే.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: గ్రీకు పురుష బహువచన సంబోధనను రూపపరంగా నిలుపుతూ, సంఘమంతటినీ ఉద్దేశించగల వాడుకను పాదసూచికలో తెలిపింది.
- source_word: ὅσα
  choice: …వేవో
  rationale: పునరావృతమయ్యే సంబంధవాచక నిర్మాణాన్ని తెలుగులో సహజంగా, జాబితా లయను కాపాడుతూ వ్యక్తం చేస్తుంది.
- source_word: ἀληθῆ
  choice: సత్యమైనవి
  rationale: నిజమైనది, సత్యసంబంధమైనది అనే విస్తృత భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: σεμνά
  choice: గౌరవనీయమైనవి
  rationale: గంభీరత, నైతిక ఘనత, గౌరవానికి తగిన స్వభావం అనే భావాలను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: δίκαια
  choice: న్యాయమైనవి
  rationale: ఈ నైతిక జాబితాలో న్యాయబద్ధమైన, సరిగా ఉన్న అనే భావాన్ని అందిస్తుంది; ‘నీతియుక్తమైనవి’ కూడా సాధ్యం.
- source_word: ἁγνά
  choice: పవిత్రమైనవి
  rationale: నైతిక స్వచ్ఛతను సూచించే సహజమైన బైబిలీయ తెలుగు పదం; ‘నిర్మలమైనవి’ ప్రత్యామ్నాయం.
- source_word: προσφιλῆ
  choice: మనోహరమైనవి
  rationale: ప్రేమను లేదా అనురాగాన్ని కలిగించే, హృదయానికి ఇంపైన విషయాల భావాన్ని సహజంగా అందిస్తుంది.
- source_word: εὔφημα
  choice: మంచి పేరు పొందినవి
  rationale: మంచిగా చెప్పబడే, మంచి ఖ్యాతి గల అనే మూలభావాన్ని ‘ప్రశంసనీయమైనవి’తో కలపకుండా కాపాడుతుంది.
- source_word: εἴ τις ἀρετὴ
  choice: ఏదైనా సద్గుణం ఉంటే
  rationale: ἀρετήలోని నైతిక శ్రేష్ఠత లేదా సద్గుణం అనే సంక్షిప్త నామవాచక భావాన్ని నిలుపుతుంది.
- source_word: εἴ τις ἔπαινος
  choice: ఏదైనా ప్రశంసనీయమైనది ఉంటే
  rationale: ప్రశంసకు పాత్రమైనది అనే సందర్భోచిత భావాన్ని సహజ తెలుగులో అందిస్తుంది; మూలంలోని ‘ప్రశంస’ నామవాచక నిర్మాణానికి దగ్గరగా ‘ఏదైనా ప్రశంస ఉంటే’ అనవచ్చు.
- source_word: ταῦτα λογίζεσθε
  choice: వాటిని గురించి ఆలోచిస్తూ ఉండండి
  rationale: కేవలం క్షణికంగా తలచడం కాక, ఉద్దేశపూర్వకంగా నిరంతరం మనస్సు నిలపాలనే వర్తమాన ఆజ్ఞ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἀδελφοί సంబోధనలో లింగ సమావిష్కరణ
  choice: ప్రధాన పాఠ్యంలో ‘సహోదరులారా’ అని రూపాన్ని నిలిపి, సంఘంలోని స్త్రీపురుషులందరినీ ఉద్దేశించగలదని పాదసూచికలో తెలిపింది.
  alternative: సహోదర సహోదరీలారా
  rationale: మూల గ్రీకు పదం వ్యాకరణపరంగా పురుష బహువచనం; పౌలు వాడుకలో అది విశ్వాస సమాజమంతటినీ సంబోధించగలదు. రూపం మరియు సందర్భవ్యాప్తి రెండింటినీ పారదర్శకంగా ఉంచడం సముచితం.
- issue: εἴ τις ἀρετὴ καὶ εἴ τις ἔπαινος నిర్మాణం
  choice: రెండు షరతు వాక్యాలనూ విడిగా నిలిపింది.
  alternative: శ్రేష్ఠమైనదీ ప్రశంసకు పాత్రమైనదీ ఏదైనా ఉంటే
  rationale: మూలంలోని పునరుక్త εἴ τις నిర్మాణం అలంకారాత్మక సమాహారాన్ని, స్వల్ప భావ ఉద్వేగాన్ని కలిగి ఉంది; దాన్ని ఒకే పదబంధంగా కుదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. మూలంలోని పునరావృత జాబితా లయను ‘…వేవో’ నిర్మాణంతో నిలిపి, చివరి ఆజ్ఞలో నిరంతర మనోనిబద్ధతను ‘ఆలోచిస్తూ ఉండండి’తో వ్యక్తం చేసింది.
