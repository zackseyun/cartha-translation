translation:
  language: te
  text: ఎందుకంటే, థెస్సలొనీకలో కూడా మీరు నా అవసరం కోసం ఒక్కసారి మాత్రమే కాదు, రెండుసార్లు కూడా పంపించారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత నుడికారంగా, “ఒకటి కంటే ఎక్కువసార్లు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న మాటకు కారణాన్ని వివరించే ఉపవాక్యాన్ని సహజమైన ఆధునిక తెలుగులో పరిచయం చేస్తుంది.
- source_word: ἐν Θεσσαλονίκῃ
  choice: నేను థెస్సలొనీకలో ఉన్నప్పుడు
  rationale: గ్రీకు పదబంధం అక్షరార్థంగా స్థలాన్ని సూచించినా, సందర్భంలో పౌలు అక్కడ ఉన్న కాలాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: καὶ ἅπαξ καὶ δὶς
  choice: ఒకటికి రెండుసార్లు
  rationale: ఒక్కసారి మాత్రమే కాక మళ్లీ పంపారనే గ్రీకు నుడికార భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: εἰς τὴν χρείαν μοι
  choice: నా అవసరం కోసం
  rationale: χρεία ఏకవచనాన్ని నిలుపుతూ, పంపినది పౌలు అవసరాన్ని తీర్చడానికి ఉద్దేశించబడిందనే భావాన్ని అదనపు వస్తువును చేర్చకుండా తెలియజేస్తుంది.
- source_word: ἐπέμψατε
  choice: మీరు ... పంపించారు
  rationale: గ్రీకులో కర్మ స్పష్టంగా లేకపోవడాన్ని అలాగే ఉంచి, ‘సహాయం’ లేదా ‘ధనం’ అని వ్యాఖ్యానాత్మకంగా చేర్చదు.
