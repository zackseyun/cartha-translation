id: PHP.4.18
reference: Philippians 4:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπέχω δὲ πάντα καὶ περισσεύω· πεπλήρωμαι δεξάμενος παρὰ Ἐπαφροδίτου τὰ παρ’ ὑμῶν, ὀσμὴν εὐωδίας, θυσίαν δεκτήν, εὐάρεστον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/018.yaml
  text: But I have received everything[a], and I abound. I am fully supplied, having received from Epaphroditus what came from you—a fragrant aroma, an acceptable sacrifice, pleasing to God.
translation:
  language: te
  text: అయితే, నేను అన్నీ పొందాను[a]; నేను సమృద్ధిగా ఉన్నాను. ఎపఫ్రొదితు ద్వారా మీ నుండి వచ్చిన వాటిని పొందినందున, నాకు పూర్తిగా సమకూరింది. అవి సువాసనగల పరిమళం, అంగీకారయోగ్యమైన బలి, దేవునికి ప్రీతికరమైనవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాకు అన్నీ పూర్తిగా ఉన్నాయి”; లేదా వ్యాపార లావాదేవీ భావంలో, “నాకు పూర్తి చెల్లింపు అందింది.”
    reason: ἀπέχω అనే క్రియ ఇక్కడ సాధారణంగా పొందడం అనే అర్థంతో పాటు, పూర్తిగా చేతిలో ఉండడం లేదా రసీదు/పూర్తి చెల్లింపు అనే వాణిజ్య ఛాయను కూడా కలిగి ఉండవచ్చు.
lexical_decisions:
- source_word: ἀπέχω
  choice: నాకు ... అందింది
  rationale: సహాయం అందిన సందర్భంలో ఈ క్రియకు ‘అందుకున్నాను,’ ‘పూర్తిగా పొందాను,’ లేదా చెల్లింపు రసీదు భాషలో ‘అందింది’ అనే భావాలు ఉండవచ్చు. ప్రధాన పాఠంలో సహజమైన ‘అందింది’ను ఉంచి, పూర్తి స్వీకరణ లేదా వాణిజ్య ఛాయను పాదసూచికలో నిలిపాం.
- source_word: πάντα
  choice: సమస్తమూ
  rationale: ఫిలిప్పీయులు పంపినదంతటినీ సమగ్రంగా సూచిస్తుంది; ఆధునిక గౌరవప్రద తెలుగు శైలికి ‘సమస్తమూ’ సరిపోతుంది.
- source_word: περισσεύω
  choice: నాకు సమృద్ధిగా ఉంది
  rationale: అవసరానికి మించి సమృద్ధి ఉన్న భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; అతిశయార్థాన్ని తగ్గించదు.
- source_word: πεπλήρωμαι
  choice: ఇప్పుడు నాకు ఏ కొదువా లేదు
  rationale: పరిపూర్ణ కాలం సూచించే, బహుమతి అందిన ఫలితంగా ప్రస్తుతం పూర్తిగా సమకూరిన స్థితిని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: δεξάμενος
  choice: అందుకొని
  rationale: పౌలుకు ఏ విధంగా కొదువ లేకుండా అయిందో తెలిపే భాగవాచక సంబంధాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: παρὰ Ἐπαφροδίτου
  choice: ఎపఫ్రొదితు ద్వారా
  rationale: బహుమతి ఫిలిప్పీయుల నుంచి ఉద్భవించి, ఎపఫ్రొదితు దానిని తీసుకొచ్చిన మధ్యవర్తి అనే సందర్భార్థాన్ని తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: τὰ παρ’ ὑμῶν
  choice: మీరు పంపినవి
  rationale: వారి వద్ద నుంచి వచ్చిన సహాయాన్ని సహజంగా వ్యక్తపరుస్తుంది; మూలంలోని నామీకృత నిర్మాణాన్ని తెలుగు వాక్యరీతికి తగినట్లు మార్చుతుంది.
- source_word: ὀσμὴν εὐωδίας
  choice: సువాసనగల పరిమళం
  rationale: బలుల గురించి వాడే పాత నిబంధన ఆరాధనా ప్రతిధ్వనిని నిలుపుతూ, ఆధునిక పాఠకుడికి స్పష్టమైన చిత్రాన్ని ఇస్తుంది.
- source_word: θυσίαν δεκτήν
  choice: దేవుడు అంగీకరించే బలి
  rationale: బహుమతిని ఆరాధనాత్మక బలిగా చూపే రూపకాన్ని, అంగీకరించేవాడు దేవుడే అనే సంబంధంతో స్పష్టంగా కాపాడుతుంది.
- source_word: εὐάρεστον τῷ θεῷ
  choice: ఆయనకు ప్రీతికరమైన అర్పణ
  rationale: దేవునికి సంతోషకరమైనదనే మూలభావాన్ని గౌరవప్రదంగా తెలియజేస్తుంది. తెలుగులో ముగింపు సహజంగా ఉండేందుకు ‘అర్పణ’ను పూరక నామవాచకంగా వాడినా, అది ముందు ఉన్న బలి రూపకాన్నే సూచిస్తుంది.
theological_decisions:
- issue: ఫిలిప్పీయుల ఆర్థిక సహాయానికి బలి సంబంధమైన రూపకం
  choice: ‘సువాసనగల పరిమళం, దేవుడు అంగీకరించే బలి, ఆయనకు ప్రీతికరమైన అర్పణ’ అంటూ ఆరాధనా రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: దీనిని కేవలం కృతజ్ఞత లేదా ‘దేవుడు సంతోషంగా స్వీకరించే కానుక’గా సరళీకరించడం
  rationale: పౌలు వారి సహాయాన్ని ఉద్దేశపూర్వకంగా దేవాలయ బలి భాషలో చిత్రిస్తున్నాడు. పరిమళం, బలి, దేవుని ప్రీతి అనే వరుసను నిలపడం ద్వారా అదనపు సిద్ధాంతాన్ని చేర్చకుండా వచనంలోని ఆరాధనా బలం కాపాడబడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. పౌలు ఉపయోగించిన సమృద్ధి–పూర్ణత పునరుక్తిని కొంతవరకు నిలిపి, బలి సంబంధమైన ఆరాధనా చిత్రాన్ని సరళీకరించకుండా కాపాడాం. [a] గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
