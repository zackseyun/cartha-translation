revisions:
- from: అయితే, నాకు సమస్తమూ అందింది[a]; నాకు సమృద్ధిగా ఉంది. ఎపఫ్రొదితు ద్వారా మీరు పంపినవి అందుకొని, ఇప్పుడు నాకు ఏ కొదువా లేదు. అవి సువాసనగల పరిమళం, దేవుడు అంగీకరించే బలి, ఆయనకు ప్రీతికరమైన అర్పణ.
