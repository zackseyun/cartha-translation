id: PHP.4.15
reference: Philippians 4:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἴδατε δὲ καὶ ὑμεῖς, Φιλιππήσιοι, ὅτι ἐν ἀρχῇ τοῦ εὐαγγελίου, ὅτε ἐξῆλθον ἀπὸ Μακεδονίας, οὐδεμία μοι ἐκκλησία ἐκοινώνησεν εἰς λόγον δόσεως καὶ λήμψεως εἰ μὴ ὑμεῖς μόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/015.yaml
  text: And you yourselves also know[a], Philippians, that at the beginning of the gospel, when I departed from Macedonia, no church shared with me in the matter of giving and receiving except you alone.
translation:
  language: te
  text: ఫిలిప్పీయులారా, సువార్త ప్రారంభ దశలో, నేను మాసిదోనియా నుండి బయలుదేరినప్పుడు, ఇచ్చిపుచ్చుకునే విషయంలో[a] మీరొక్కరే తప్ప మరే సంఘమూ నాతో భాగస్వామ్యం చేయలేదని మీరు కూడా తెలుసుకుంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇచ్చుట, పొందుటల లెక్కలో.”
    reason: λόγος అనే పదానికి ఇక్కడ ‘లెక్క’ లేదా ‘ఖాతా’ అనే వాణిజ్య సంబంధిత భావం ఉండవచ్చు.
lexical_decisions:
- source_word: Οἴδατε
  choice: మీకు ... తెలుసు
  rationale: οἶδα అనే స్థితిని తెలిపే క్రియకు సందర్భానుకూలమైన సహజ వర్తమాన తెలుగు రూపం.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ బలమైన వ్యతిరేకత లేకుండా వాక్యప్రవాహాన్ని కొనసాగిస్తుంది; తెలుగులో పదక్రమమే ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: καὶ ὑμεῖς
  choice: మీకు కూడా
  rationale: καί యొక్క సముచ్చయార్థాన్ని ‘కూడా’తో, ὑμεῖς సూచించే సంబోధితుల ప్రాధాన్యాన్ని సందర్భం మరియు చివరి ‘మీరొక్కరే’తో నిలిపింది.
- source_word: Φιλιππήσιοι
  choice: ఫిలిప్పీయులారా
  rationale: పట్టణనామం ఆధారంగా ఏర్పడిన సంబోధనను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ἐν ἀρχῇ τοῦ εὐαγγελίου
  choice: సువార్త ప్రారంభమైన కాలంలో
  rationale: పౌలు సువార్త సేవలోని ఆరంభ దశను సూచించే అవకాశాన్ని తెలియజేస్తూ, ‘సువార్త యొక్క ఆరంభంలో’ అనే అసహజ పదానువాదాన్ని నివారిస్తుంది.
- source_word: ἐξῆλθον ἀπὸ Μακεδονίας
  choice: నేను మాసిదోనియ నుండి బయలుదేరినప్పుడు
  rationale: ἐξέρχομαι యొక్క కదలికను, ἀπό సూచించే బయలుదేరిన ప్రాంతాన్ని స్పష్టంగా మరియు గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: οὐδεμία ... ἐκκλησία
  choice: మరే సంఘమూ ... లేదు
  rationale: ‘ఒక్క సంఘమూ కాదు’ అనే గ్రీకు నిరాకరణను సహజ తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: μοι ... ἐκοινώνησεν
  choice: నాతో పాలుపంచుకోలేదు
  rationale: κοινωνέω సూచించే భాగస్వామ్యాన్ని నిలుపుతూ, కేవలం డబ్బు పంపడం అనే అర్థానికి పరిమితం చేయదు.
- source_word: εἰς λόγον δόσεως καὶ λήμψεως
  choice: ఇచ్చిపుచ్చుకునే విషయంలో
  rationale: δόσις, λῆμψις అనే పరస్పర ఇచ్చుట-పుచ్చుకొనుట భావాలను సహజంగా అందిస్తుంది; λόγος లో ఉండగల లెక్క లేదా ఖాతా భావం పాదసూచికలో నిలిపింది.
- source_word: εἰ μὴ ὑμεῖς μόνοι
  choice: మీరొక్కరే తప్ప
  rationale: ὑμεῖς μόνοι లోని స్పష్టమైన ప్రత్యేకతను సహజమైన తెలుగు పదబంధంతో బలంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘ఇచ్చిపుచ్చుకోవడం’ ఎవరి మధ్య జరిగినదనే భావం
  choice: ప్రధాన పాఠ్యంలో సంబంధాన్ని మరింత నిర్దిష్టంగా నిర్వచించలేదు
  alternative: ఫిలిప్పీయులు పౌలుకు ఇచ్చిన ఆర్థిక సహాయం అని విస్తరించడం
  rationale: సందర్భం భౌతిక సహాయాన్ని సూచించినప్పటికీ, గ్రీకు వాక్యం ఇచ్చుట-పుచ్చుకొనుట అనే విస్తృత భాగస్వామ్య/ఖాతా భాషను ఉపయోగిస్తుంది; అనువాదం ఆ ఉద్దేశపూర్వక విస్తృతతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన పత్రికా శైలిని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలను వాడింది. ‘పాలుపంచుకోవడం’ భాగస్వామ్య భావాన్ని, ‘ఇచ్చిపుచ్చుకోవడం’ ఆర్థిక సందర్భంలోని పరస్పర భాషను కాపాడుతాయి.
