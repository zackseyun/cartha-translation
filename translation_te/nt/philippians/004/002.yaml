- from: 'యువొదియను నేను వేడుకుంటున్నాను; సుంటుకేను కూడా నేను వేడుకుంటున్నాను: ప్రభువులో ఒకే మనస్సు కలిగి ఉండండి.[a]'
  to: 'యూవొదియను నేను వేడుకుంటున్నాను, సుంటుకేను నేను వేడుకుంటున్నాను: ప్రభువులో ఒకే మనస్సుతో ఉండమని.[a]'
  rationale: The personal name is corrected to “యూవొదియ.” The request is recast with “ఉండమని” to reflect the Greek construction in which Paul repeats “I urge” for each named woman and then supplies one shared infinitival appeal. No interpretive narrowing of the requested unity has been introduced.
