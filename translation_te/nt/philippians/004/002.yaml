  text: Εὐοδίαν παρακαλῶ καὶ Συντύχην παρακαλῶ τὸ αὐτὸ φρονεῖν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/002.yaml
  text: I urge Euodia[a], and I urge Syntyche, to think the same way in the Lord.
translation:
  language: te
  text: 'యూవొదియను నేను వేడుకుంటున్నాను, సుంటుకేను నేను వేడుకుంటున్నాను: ప్రభువులో ఒకే మనస్సుతో ఉండమని.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువులో ఒకే విధంగా ఆలోచించమని”; “ప్రభువులో ఏకీభవించమని” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐοδίαν
  choice: యువొదియ
  rationale: వ్యక్తి పేరును అర్థానువాదం చేయకుండా, గ్రీకు ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: παρακαλῶ
  choice: నేను వేడుకుంటున్నాను
  rationale: ఈ సందర్భంలోని వ్యక్తిగతమైన, హృదయపూర్వకమైన విజ్ఞప్తి భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. పౌలు ఇద్దరిలో ప్రతి ఒక్కరినీ విడివిడిగా వేడుకుంటున్నాడని చూపేందుకు క్రియ పునరుక్తిని నిలిపాం.
- source_word: Συντύχην
  choice: సుంటుకే
  rationale: వ్యక్తి పేరును అనువదించకుండా, గ్రీకు రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: τὸ αὐτὸ φρονεῖν
  choice: ఒకే మనస్సు కలిగి ఉండండి
  rationale: τὸ αὐτό లోని ఏకత్వాన్ని, φρονεῖν లోని ఆలోచనా ధోరణి మరియు వైఖరి భావాన్ని రెండింటినీ ఈ పదబంధం నిలుపుతుంది. కేవలం ‘ఏకీభవించండి’ అనడం కంటే ఇది విస్తృతమైన భావాన్ని ఇస్తుంది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: వారి ఏకమనస్సు ప్రభువుతో ఉన్న సంబంధంలో ఆధారపడిందని సూచించే మూలభాషా సంక్షిప్తతను నిలిపాం.
theological_decisions:
- issue: τὸ αὐτὸ φρονεῖν అనే పదబంధం సూచించే ఐక్యత స్వభావం
  choice: ఒకే మనస్సు కలిగి ఉండండి
  alternative: ప్రభువులో ఏకీభవించండి
  rationale: మూలంలోని φρονεῖν కేవలం ఒక అంశంపై ఒప్పందాన్ని కాక, మనోభావం లేదా ఆలోచనా ధోరణిని కూడా సూచించగలదు. అందువల్ల భావాన్ని సంకుచితం చేయకుండా విస్తృతతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. παρακαλῶ పునరుక్తిని నిలిపి, ఇద్దరు స్త్రీలకూ సమానంగా చేసిన వ్యక్తిగత విజ్ఞప్తిని స్పష్టపరిచాం. ప్రధాన వాక్యంలో ఫుట్‌నోట్ సూచిక [a] చేర్చబడింది.
