  - marker: c
    text: లేదా, ‘దేవుని సన్నిధిలో.’
    reason: lexical_alternative
  revision_rationale: 'The revision retains the draft''s meaning while more closely reproducing the source''s syntax and lexical distinctions: requests are to be made known to God by prayer and petition, with thanksgiving. Footnote b is omitted because the revised wording no longer has the participial form ‘విన్నవిస్తూ’ to which its stated alternative (‘వేడుకుంటూ’) refers. No disputed textual or theological issue requires further qualification.'
