revisions:
- from: దేనిగురించీ ఆందోళన చెందకండి[a]. బదులుగా, ప్రతి విషయంలోనూ కృతజ్ఞతతో ప్రార్థిస్తూ, విన్నవిస్తూ[b], మీ మనవులను దేవునికి[c] తెలియజేయండి.
  to: దేనిగురించీ ఆందోళన చెందకండి[a]. బదులుగా, ప్రతి విషయంలోనూ ప్రార్థనతోను విన్నపంతోను కృతజ్ఞతతో మీ అభ్యర్థనలను దేవునికి[c] తెలియజేయండి.
  rationale: 'The revision retains the draft''s meaning while more closely reproducing the source''s syntax and lexical distinctions: requests are to be made known to God by prayer and petition, with thanksgiving. Footnote b is omitted because the revised wording no longer has the participial form ‘విన్నవిస్తూ’ to which its stated alternative (‘వేడుకుంటూ’) refers. No disputed textual or theological issue requires further qualification.'
