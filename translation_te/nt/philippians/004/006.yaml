id: PHP.4.6
reference: Philippians 4:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μηδὲν μεριμνᾶτε, ἀλλ’ ἐν παντὶ τῇ προσευχῇ καὶ τῇ δεήσει μετ’ εὐχαριστίας τὰ αἰτήματα ὑμῶν γνωριζέσθω πρὸς τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/006.yaml
  text: Do not be anxious about anything[a], but in everything, by prayer and petition with thanksgiving[c][b], let your requests be made known to God.
translation:
  language: te
  text: దేనిగురించీ ఆందోళన చెందకండి[a]. బదులుగా, ప్రతి విషయంలోనూ ప్రార్థనతోను విన్నపంతోను కృతజ్ఞతతో మీ అభ్యర్థనలను దేవునికి[c] తెలియజేయండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేనిగురించీ చింతించకండి.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘దేవుని సన్నిధిలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν μεριμνᾶτε
  choice: దేనిగురించీ ఆందోళన చెందకండి
  rationale: నిషేధంతో కూడిన μηδὲνను తెలుగులో సహజంగా ‘దేనిగురించీ’ అని, ఆందోళనతో కూడిన చింతను సూచించే μεριμνάωను ‘ఆందోళన చెందడం’ అని అందించింది.
- source_word: ἀλλ’ ἐν παντὶ
  choice: బదులుగా, ప్రతి విషయంలోనూ
  rationale: ἀλλά సూచించే స్పష్టమైన వ్యత్యాసాన్ని ‘బదులుగా’ తెలియజేస్తుంది; ἐν παντί యొక్క సమగ్ర పరిధిని ‘ప్రతి విషయంలోనూ’ నిలుపుతుంది.
- source_word: τῇ προσευχῇ καὶ τῇ δεήσει
  choice: ప్రార్థిస్తూ, విన్నవిస్తూ
  rationale: ప్రార్థన అనే విస్తృత భావానికి, నిర్దిష్ట అవసరాన్ని దేవుని ఎదుట ఉంచే విన్నపానికి మధ్య ఉన్న భేదాన్ని సహజమైన తెలుగు క్రియారూపాలతో నిలిపింది.
- source_word: μετ’ εὐχαριστίας
  choice: కృతజ్ఞతతో
  rationale: ప్రార్థన, విన్నపం కృతజ్ఞతతో కూడి ఉండాలనే సహచర్య భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τὰ αἰτήματα ὑμῶν
  choice: మీ మనవులను
  rationale: αἴτημα సూచించే నిర్దిష్టంగా కోరబడే విషయాలను ‘మనవులు’ గౌరవప్రదమైన, సాధారణంగా అర్థమయ్యే తెలుగులో తెలియజేస్తుంది.
- source_word: γνωριζέσθω
  choice: తెలియజేయండి
  rationale: గ్రీకు వర్తమాన కర్మణి ఆజ్ఞారూపాన్ని తెలుగులో యాంత్రికంగా కర్మణి రూపంలో పెడితే అసహజంగా ఉంటుంది; అందుచేత దాని ఆజ్ఞార్థాన్ని సహజమైన కర్తరి రూపంలో తెలిపింది.
- source_word: πρὸς τὸν θεόν
  choice: దేవునికి
  rationale: γνωρίζωతో కలిసి πρὸς యొక్క లక్ష్యార్థాన్ని నేరుగా వ్యక్తపరుస్తుంది; ‘దేవుని సన్నిధిలో’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: ఆందోళనపడవద్దనే ఆజ్ఞ యొక్క పరిధి
  choice: ‘దేనిగురించీ’ అనే సంపూర్ణ పరిధిని యథాతథంగా ఉంచడం
  alternative: ‘అతిగా ఆందోళన చెందకండి’ అని పరిమితం చేయడం
  rationale: మూలంలోని μηδέν ఎటువంటి స్పష్టమైన మినహాయింపునూ ఇవ్వదు; కాబట్టి అనువాదం స్వయంగా పరిమితిని చేర్చదు.
- issue: πρὸς τὸν θεόν యొక్క సంబంధార్థం
  choice: దేవునికి
  alternative: దేవుని సన్నిధిలో
  rationale: ‘దేవునికి తెలియజేయడం’ ప్రధాన వాక్య నిర్మాణంలో అత్యంత సహజం; అయితే దేవుని ఎదుట ఉంచడం అనే స్థలాత్మక/సంబంధాత్మక ఛాయ కూడా సాధ్యమే కనుక దాన్ని పాదసూచికలో సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించింది. గ్రీకు నామవాచక నిర్మాణాన్ని తెలుగులో సులభంగా చదవదగిన క్రియారూపాలుగా మార్చినా, ప్రార్థన–నిర్దిష్ట విన్నపం మధ్య భావభేదాన్ని నిలిపింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
