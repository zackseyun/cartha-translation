  edition: SBLGNT
  text: Χαίρετε ἐν κυρίῳ πάντοτε· πάλιν ἐρῶ, χαίρετε.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/004.yaml
  text: Rejoice in the Lord always[a]; again I will say[b], rejoice.
translation:
  language: te
  text: ప్రభువులో ఎల్లప్పుడూ ఆనందించండి[a]; మళ్లీ చెబుతాను, ఆనందించండి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రభువులో ఎల్లప్పుడూ సంతోషించండి.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మళ్లీ నేను చెబుతాను, ఆనందించండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Χαίρετε
  choice: ఆనందించండి
  rationale: వర్తమానకాల క్రియాశీల ఆజ్ఞార్థక బహువచన రూపం. ‘ఆనందించండి’ ఆజ్ఞ యొక్క బలాన్ని, పౌలు ఇచ్చే ప్రోత్సాహంలోని భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν
  choice: లో
  rationale: ఇక్కడ ఈ విభక్త్యర్థక పదం ప్రభువుతో ఉన్న సంబంధం లేదా ఆ సంబంధ పరిధిని సూచించడం అత్యంత సహజం. ‘లో’ అనే రూపం ఆ విస్తృతిని అనవసరంగా కారణార్థానికో సాధనార్థానికో పరిమితం చేయదు.
- source_word: κυρίῳ
  choice: ప్రభువులో
  rationale: κύριος ఇక్కడ పౌలు వాడుక ప్రకారం క్రీస్తును సూచిస్తుంది. ‘ప్రభువు’ ఆధునిక తెలుగు క్రైస్తవ సందర్భంలో గౌరవప్రదంగా, స్పష్టంగా ఉంటుంది.
- source_word: πάντοτε
  choice: ఎల్లప్పుడూ
  rationale: ఈ క్రియావిశేషణంలోని నిరంతర కాలవ్యాప్తిని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: తదుపరి ఆజ్ఞను బలంగా పునరుక్తి చేస్తున్న భావాన్ని ‘మళ్లీ’ సహజంగా తెలియజేస్తుంది.
- source_word: ἐρῶ
  choice: చెబుతాను
  rationale: ఇది λέγω క్రియ యొక్క భవిష్యత్ క్రియాశీల సూచనార్థక రూపం. ‘చెబుతాను’ భవిష్యత్ భావాన్ని మార్చకుండా సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: χαίρετε
  choice: ఆనందించండి
  rationale: పౌలు చేసిన ఉద్దేశపూర్వక పునరుక్తి, వాక్యంలోని ఉద్ఘాటన నిలిచేలా మొదటి ఆజ్ఞకు వాడిన పదాన్నే తిరిగి వాడాం.
theological_decisions:
- issue: ‘ప్రభువులో’ అనే పదబంధం యొక్క భావం
  choice: విశ్వాసులు ప్రభువుతో ఉన్న సంబంధంలో, ఆయనతో ఐక్యత పరిధిలో ఆనందించాలని ఇచ్చిన ఆజ్ఞ.
  alternative: ప్రభువు కలిగించే శక్తి ద్వారా ఆనందించండి; లేదా ప్రభువు కారణంగా ఆనందించండి.
  rationale: పౌలు రచనల్లో ἐν κυρίῳ సాధారణంగా సంబంధం లేదా పరిధిని సూచిస్తుంది. ‘ప్రభువులో’ అనే అనువాదం కారణార్థం, సాధనార్థం వంటి సాధ్యమైన సూక్ష్మభావాలను పూర్తిగా తిరస్కరించకుండా మూలంలోని వేదాంతపరమైన విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపాన్ని వాడాం. ‘ప్రభువునందు’ అనే సాంప్రదాయిక రూపానికి బదులుగా సాధారణ పాఠకులకు సులభమైన ‘ప్రభువులో’ ఎంచుకున్నాం; అయితే మూలంలోని సంబంధ/పరిధి భావాన్ని అలాగే ఉంచాం.
