id: PHP.4.11
reference: Philippians 4:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐχ ὅτι καθ’ ὑστέρησιν λέγω, ἐγὼ γὰρ ἔμαθον ἐν οἷς εἰμι αὐτάρκης εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/011.yaml
  text: Not that I am speaking from need[a], for I have learned to be content in whatever circumstances I am in.
translation:
  language: te
  text: నాకు కొరత ఉన్నందున నేను ఇలా చెప్పడం లేదు. ఎందుకంటే నేను ఏ పరిస్థితిలో ఉన్నా సంతృప్తిగా[a] ఉండడం నేర్చుకున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తనకు తానే సరిపడేవాడిగా’ లేదా ‘స్వయంసమృద్ధిగా.’ గ్రీకు పదం తనలోనే తగినంత కలిగి ఉండడం అనే భావాన్ని కూడా సూచించగలదు; అయితే ఇక్కడ సందర్భానుసారంగా ‘సంతృప్తిగా’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ὑστέρησιν
  choice: కొరతలో ఉన్నందువల్ల
  rationale: ఈ పదబంధం లోటు లేదా అవసరం కారణంగా మాట్లాడడాన్ని సూచిస్తుంది. పౌలు తన వ్యక్తిగత కొరతే ఈ మాటలకు ప్రేరణ కాదని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: λέγω
  choice: ఇలా చెప్పడం
  rationale: వర్తమాన సందర్భంలో పౌలు చేస్తున్న ప్రకటనను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἔμαθον
  choice: నేర్చుకున్నాను
  rationale: గతంలో జరిగిన అభ్యాసం వల్ల ఇప్పుడు కొనసాగుతున్న స్థితిని తెలుగు భూతకాల రూపం సందర్భానుసారంగా సహజంగా తెలియజేస్తుంది.
- source_word: ἐν οἷς εἰμι
  choice: ఏ పరిస్థితిలో ఉన్నా
  rationale: ఇది కేవలం స్థలాన్ని కాక, పౌలు ఎదుర్కొనే వివిధ పరిస్థితులను సూచించే నుడికార సంబంధమైన పదబంధం.
- source_word: αὐτάρκης
  choice: సంతృప్తిగా
  rationale: ఈ సందర్భంలో పరిస్థితులు ఎలా ఉన్నా సరిపెట్టుకుని ఉండే నేర్చుకున్న వైఖరిని తెలియజేస్తుంది; స్వతంత్ర స్వయంసమృద్ధి అనే తాత్విక భావాన్ని ప్రధాన వచనంపై రుద్దదు.
theological_decisions:
- issue: αὐτάρκης పదంలోని తాత్విక లేదా స్వయంసమృద్ధి భావఛాయ
  choice: ప్రధాన వచనంలో ‘సంతృప్తిగా’
  alternative: ‘స్వయంసమృద్ధిగా’ లేదా ‘తనకు తానే సరిపడేవాడిగా’
  rationale: సందర్భం పౌలు వివిధ పరిస్థితుల్లో నేర్చుకున్న సంతృప్తిని వివరిస్తుంది. ‘సంతృప్తిగా’ అనేది సందర్భానికి సరిపోతూ, దేవునితో సంబంధం లేని స్వతంత్ర స్వావలంబన భావాన్ని అతిగా సూచించదు; అసలు గ్రీకు పదంలోని ప్రత్యామ్నాయ భావం పాదటిప్పణిలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మొదటి వాక్యంలోని ‘ఇలా’ మునుపటి సందర్భంలోని పౌలు మాటలను సూచిస్తుంది. ‘ఏ పరిస్థితిలో ఉన్నా’ అనే రూపం గ్రీకు సంబంధవాచక పదబంధంలోని విస్తృత పరిస్థితి భావాన్ని స్పష్టంగా, అతివ్యాఖ్యానం లేకుండా అందిస్తుంది.
