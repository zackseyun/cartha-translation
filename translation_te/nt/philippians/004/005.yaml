source:
  edition: SBLGNT
  text: τὸ ἐπιεικὲς ὑμῶν γνωσθήτω πᾶσιν ἀνθρώποις. ὁ κύριος ἐγγύς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/005.yaml
  text: Let your graciousness be known to all people[b][a]. The Lord is near.
translation:
  language: te
  text: మీ దయాశీలత అందరికీ తెలియనివ్వండి.[a] ప్రభువు సమీపమే.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సౌమ్యత,” “సహనశీలత,” లేదా “పట్టువిడుపుతో కూడిన వివేకం.”
    reason: lexical_alternative
  - marker: b
    text: “ప్రభువు సమీపమే” అంటే ప్రభువు దగ్గరలోనే ఉన్నాడని, ఆయన రాక సమీపించిందని, లేదా ఈ రెండు భావాలనూ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιεικές
  choice: దయాశీలత
  rationale: ఈ పదం కేవలం మృదువైన స్వభావాన్ని మాత్రమే కాక, ఇతరులపట్ల దయతో, పట్టువిడుపుతో, పరిగణనతో ప్రవర్తించే విస్తృత నైతిక లక్షణాన్ని సూచిస్తుంది. “దయాశీలత” ఆధునిక తెలుగులో ఆ విస్తృత భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: γνωσθήτω
  choice: తెలియనివ్వండి
  rationale: అఓరిస్ట్ పాసివ్ ఆజ్ఞార్థక రూపంలోని ఆజ్ఞా బలాన్ని, అలాగే “తెలియబడాలి” అనే భావాన్ని ఈ ప్రయోగం నిలుపుతుంది.
- source_word: πᾶσιν ἀνθρώποις
  choice: అందరికీ
  rationale: ఈ పదబంధం సమస్త ప్రజలను సూచిస్తుంది; “అందరికీ” ఆధునిక తెలుగులో సహజమైన, లింగభేదం లేని సమగ్ర ప్రయోగం.
- source_word: κύριος
  choice: ప్రభువు
  rationale: κύριος అనే బిరుదుకు సహజమైన తెలుగు సమానార్థకం; దాని వేదాంతపరమైన గంభీరతను నిలుపుతుంది.
- source_word: ἐγγύς
  choice: సమీపమే
  rationale: ప్రభువు సన్నిధిలో దగ్గరగా ఉన్నాడనే భావాన్నీ, ఆయన రాక సమీపించిందనే కాలసంబంధ భావాన్నీ నిర్దిష్టంగా ఒకదానికే పరిమితం చేయకుండా గ్రీకు పదంలోని ఉద్దేశపూర్వక సందిగ్ధతను నిలుపుతుంది.
theological_decisions:
- issue: ὁ κύριος ἐγγύς అనే వాక్యభాగం యొక్క భావం
  choice: ప్రభువు సమీపమే
  alternative: ప్రభువు దగ్గరలోనే ఉన్నాడు / ప్రభువు త్వరలో రానున్నాడు
  rationale: గ్రీకు వాక్యం ప్రభువు ప్రస్తుతం దగ్గరగా ఉన్నాడనే స్థలసంబంధ లేదా సన్నిధి భావానికీ, ఆయన రాక సమీపించిందనే కాలసంబంధ భావానికీ అవకాశం ఇస్తుంది. ప్రధాన పాఠం ఈ రెండింటిలో ఒకదానిని మాత్రమే నిర్ణయించకుండా ఆ వేదాంతపరమైన ఉద్విగ్నతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. “దయాశీలత” ద్వారా ἐπιεικές యొక్క విస్తృత సంబంధాత్మక భావాన్ని, “సమీపమే” ద్వారా ἐγγύς యొక్క స్థలసంబంధ–కాలసంబంధ సందిగ్ధతను నిలిపాం.
