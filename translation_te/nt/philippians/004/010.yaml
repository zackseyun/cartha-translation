  text: Ἐχάρην δὲ ἐν κυρίῳ μεγάλως ὅτι ἤδη ποτὲ ἀνεθάλετε τὸ ὑπὲρ ἐμοῦ φρονεῖν, ἐφ’ ᾧ καὶ ἐφρονεῖτε ἠκαιρεῖσθε δέ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/010.yaml
  text: I rejoiced greatly in the Lord that now at last you have revived your concern for me[a]; indeed, you were concerned[b], but you lacked opportunity.
translation:
  language: te
  text: ప్రభువులో నేను ఎంతో సంతోషించాను. ఎందుకంటే, ఇంతకాలానికి నాపట్ల మీ శ్రద్ధ మళ్లీ చిగురించింది[a]. నిజానికి, మీరు నాపట్ల శ్రద్ధ కలిగి ఉన్నారు[b], కానీ మీకు అవకాశం లేకపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నా విషయంలో మీరు మళ్లీ చిగురించారు” లేదా “మళ్లీ వికసించారు.” ఇది నాపట్ల వారి శ్రద్ధ మళ్లీ పుష్పించినట్లు చెప్పే రూపకం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీరు నా గురించి ఆలోచిస్తూనే ఉన్నారు.” గ్రీకు క్రియకు ఆలోచించడం, ఒకరి పట్ల మనసు కలిగి ఉండడం, లేదా శ్రద్ధ చూపడం అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην
  choice: నేను సంతోషించాను
  rationale: χαίρω క్రియ యొక్క భూతకాల భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, పౌలు పొందిన ఆనందాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: పౌలు ఆనందించిన ఆధ్యాత్మిక పరిధి లేదా ఆధారాన్ని సూచించే సాధారణ పౌలు ప్రయోగాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: μεγάλως
  choice: ఎంతో
  rationale: ఆనందం యొక్క తీవ్రతను సహజమైన తెలుగు క్రియావిశేషణంతో తెలియజేస్తుంది.
- source_word: ἤδη ποτὲ
  choice: ఇంతకాలానికి
  rationale: కొంత విరామం తర్వాత ఇప్పుడు మళ్లీ వారి శ్రద్ధ కార్యరూపంలో కనిపించిందనే భావాన్ని తెలియజేస్తుంది; వారిని నిందిస్తున్నట్టు అనవసరంగా సూచించదు.
- source_word: ἀνεθάλετε
  choice: మళ్లీ చిగురింపజేశారు
  rationale: ‘తిరిగి వికసించడం/చిగురించడం’ అనే మూల రూపకాన్ని తెలుగులో సహజంగా నిలుపుతూ, వారి శ్రద్ధ మళ్లీ వ్యక్తమైందనే సందర్భార్థాన్ని అందిస్తుంది.
- source_word: τὸ ὑπὲρ ἐμοῦ φρονεῖν
  choice: నాపట్ల మీ శ్రద్ధను
  rationale: ఇక్కడ φρονέω కేవలం ఆలోచించడమే కాక, పౌలు పట్ల శ్రద్ధతో ఉండడాన్ని సూచిస్తుంది.
- source_word: ἐφ’ ᾧ
  choice: నిజానికి
  rationale: వారి శ్రద్ధ కొత్తగా పుట్టలేదని పౌలు చేస్తున్న వివరణను సహజంగా పరిచయం చేస్తుంది.
- source_word: ἐφρονεῖτε
  choice: మీరు నాపట్ల శ్రద్ధగానే ఉన్నారు
  rationale: ముందటి φρονεῖν‌తో పదార్థ సంబంధాన్ని నిలుపుతూ, వారి శ్రద్ధ కొనసాగిందని స్పష్టం చేస్తుంది.
- source_word: ἠκαιρεῖσθε
  choice: దాన్ని చూపించడానికి మీకు అవకాశం దొరకలేదు
  rationale: వారికి కోరిక లేదా శ్రద్ధ లేదని కాక, దానిని కార్యరూపంలో వ్యక్తం చేసే తగిన సందర్భం లేదని తెలియజేస్తుంది.
