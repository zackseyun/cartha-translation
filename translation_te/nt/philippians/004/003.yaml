  to: 'అవును, నిజమైన సహచరుడా[a], నేను నిన్ను కూడా అడుగుతున్నాను: ఈ స్త్రీలకు సహాయం చేయి. వీరు క్లెమెంటుతోను నా మిగిలిన తోటి పనివారితోను కలిసి సువార్తలో[b] నాతోపాటు పోరాడారు. వారి పేర్లు జీవగ్రంథంలో ఉన్నాయి.'
  rationale: The revision makes one necessary lexical correction, changing “నమ్మకమైన” to “నిజమైన” for γνήσιε. It also corrects the explanatory imagery in footnote a so that it does not specify oxen where the Greek does not. The syntax preserves the source’s broad connection of the women, Clement, and Paul’s other fellow workers, while “సువార్తలో” retains the intentionally broad force of ἐν τῷ εὐαγγελίῳ.
