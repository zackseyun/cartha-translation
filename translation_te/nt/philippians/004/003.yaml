id: PHP.4.3
reference: Philippians 4:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ναὶ ἐρωτῶ καὶ σέ, ⸂γνήσιε σύζυγε⸃, συλλαμβάνου αὐταῖς, αἵτινες ἐν τῷ εὐαγγελίῳ συνήθλησάν μοι μετὰ καὶ Κλήμεντος καὶ τῶν λοιπῶν συνεργῶν μου, ὧν τὰ ὀνόματα ἐν βίβλῳ ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/003.yaml
  text: Yes[a], I ask you also, true companion, help these women, who contended alongside me in the gospel[b], together with Clement and the rest of my fellow workers, whose names are in the book of life.
translation:
  language: te
  text: 'అవును, నిజమైన సహచరుడా[a], నేను నిన్ను కూడా అడుగుతున్నాను: ఈ స్త్రీలకు సహాయం చేయి. వీరు క్లెమెంటుతోను నా మిగిలిన తోటి పనివారితోను కలిసి సువార్తలో[b] నాతోపాటు పోరాడారు. వారి పేర్లు జీవగ్రంథంలో ఉన్నాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నిజమైన కాడి-సహచరుడా,” అంటే ఒకే కాడి మోసే సహచరుడా. దీనిని కొందరు “సుజుగస్” అనే వ్యక్తిపేరుగా కూడా భావిస్తారు.
    reason: alternative_reading
  - marker: b
    text: “సువార్త కోసం” లేదా “సువార్త సేవలో” అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναί
  choice: అవును
  rationale: పౌలు విజ్ఞప్తిని బలపరుస్తూ నేరుగా ప్రారంభించిన విధానాన్ని నిలుపుతుంది.
- source_word: ἐρωτῶ
  choice: నేను ... అడుగుతున్నాను
  rationale: వ్యక్తిగతమైన విజ్ఞప్తి ధోరణిని అతిగా బలపరచకుండా, పదానికి ఉన్న సాధారణ అర్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: γνήσιε σύζυγε
  choice: నమ్మకమైన సహచరుడా
  rationale: σύζυγος‌ను వ్యక్తిపేరుగా కాక, పౌలుతో కలిసి బాధ్యత మోసే సహచరుణ్ణి సూచించే సంబోధనగా తీసుకుంటుంది. γνήσιος ఇక్కడ యథార్థతతో పాటు విశ్వసనీయతను సూచించగలదని భావించి ‘నమ్మకమైన’ అని అనువదించబడింది.
- source_word: συλλαμβάνου αὐταῖς
  choice: ఈ స్త్రీలకు సహాయం చేయి
  rationale: ఆజ్ఞలో కోరబడిన క్రియాశీల సహకారాన్ని స్పష్టంగా తెలియజేస్తూ, స్త్రీలింగ బహువచన సర్వనామాన్ని సందర్భానుసారంగా బయటపెడుతుంది.
- source_word: συνήθλησάν μοι
  choice: నాతోపాటు పోరాడారు
  rationale: సాధారణంగా ‘పనిచేశారు’ అని చదును చేయకుండా, συναθλέωలోని పక్కపక్కనే పోటీపడి శ్రమించే రూపకాన్ని నిలుపుతుంది.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: సువార్తలో
  rationale: గ్రీకు విభక్తి సంబంధాన్ని సమీపంగా అనుసరిస్తూ, ‘సువార్త కోసం’ లేదా ‘సువార్త సేవలో’ అనే భావాల్లో ఒక్కదానికే పరిమితం చేయకుండా మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
- source_word: συνεργῶν
  choice: తోటి పనివారు
  rationale: పౌలుతో కలిసి పనిచేసినవారనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: βίβλῳ ζωῆς
  choice: జీవగ్రంథం
  rationale: స్థిరపడిన బైబిలు పదబంధాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా అందిస్తుంది.
theological_decisions:
- issue: γνήσιε σύζυγε యొక్క అర్థం
  choice: పేరు తెలియని ఒక పురుష సహచరునికి చేసిన ‘నమ్మకమైన సహచరుడా’ అనే వర్ణనాత్మక సంబోధన
  alternative: ‘నిజమైన జోడెద్దు సహచరుడా’ అనే మరింత అక్షరార్థ రూపకం; లేదా ‘సూజుగస్’ అనే వ్యక్తిపేరు
  rationale: γνήσιε అనే విశేషణంతో ఉన్న సంబోధనను సాధారణ నామవాచకంగా గ్రహించడం సందర్భానికి సహజంగా సరిపోతుంది. అయినా σύζυγος రూపకప్రయోగమా, వ్యక్తిపేరా అన్నది పూర్తిగా నిశ్చితం కానందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచబడింది.
- issue: ἐν τῷ εὐαγγελίῳ యొక్క సంబంధం
  choice: ‘సువార్తలో’ అని మూలంలోని విస్తృత భావాన్ని నిలుపడం
  alternative: ‘సువార్త కోసం’ లేదా ‘సువార్త సేవలో’
  rationale: ἐν అనే విభక్తి ప్రయోగం పరిధి, సేవా సందర్భం, లేదా సంబంధాన్ని సూచించగలదు; ఒకే వివరణను ప్రధాన పాఠ్యంలో బలవంతంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని క్రీడా/పోరాట రూపకాన్ని ‘నాతోపాటు పోరాడారు’ ద్వారా నిలిపి, ‘సువార్తలో’ అనే సంక్షిప్త ప్రయోగంలోని ఉద్దేశపూర్వక విస్తృతిని పరిష్కరించకుండా ఉంచబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధాల వెంట ఉన్నాయి.
