  text: To our God and Father be the glory forever and ever[a]. Amen.
translation:
  language: te
  text: మన దేవుడైన తండ్రికి యుగయుగాల వరకు మహిమ కలుగుగాక.[a] ఆమేన్.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘యుగాల యుగాల వరకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది ముగింపు స్తుతివాక్యానికి స్వల్ప అనుసంధానాన్ని ఇస్తుంది; తెలుగులో ప్రత్యేకంగా ‘ఇప్పుడు’ లేదా ‘అయితే’ అని చేరిస్తే మూలంలో లేని కాలార్థం లేదా వ్యతిరేక భావం అధికమవుతుంది.
- source_word: θεῷ καὶ πατρὶ ἡμῶν
  choice: మన దేవుడును తండ్రియునైన ఆయనకు
  rationale: θεῷ మరియు πατρὶ ఒకే వ్యక్తిని సూచించే ఏకీకృత సంబోధనగా సహజ తెలుగులో వ్యక్తపరుస్తుంది; ‘మన’ అనే భావం రెండింటికీ వర్తిస్తుంది.
- source_word: ἡ δόξα
  choice: మహిమ కలుగుగాక
  rationale: గ్రీకులో క్రియ లేని స్తుతి సూత్రాన్ని తెలుగులో ప్రార్థనాత్మక దైవస్తుతి రూపంగా సహజంగా పూరిస్తుంది.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: యుగయుగాల వరకు
  rationale: అంతం లేని కాలాన్ని సూచించే గ్రీకు నుడికారానికి గంభీరమైన, సుపరిచితమైన తెలుగు సమానార్థకం.
- source_word: ἀμήν
  choice: ఆమేన్
  rationale: క్రైస్తవ ఆరాధనా వాడుకలో స్థిరపడిన ధ్వన్యనువాద రూపాన్ని నిలుపుతుంది.
theological_decisions:
- issue: క్రియలేని స్తుతివాక్యంలో అంతర్భూత క్రియను పూరించడం
  choice: మహిమ కలుగుగాక
  alternative: మహిమ ఆయనదే / మహిమ చెందును గాక
  rationale: మూల గ్రీకు వాక్యంలో క్రియ లేదు; సందర్భంలోని స్తుతి, ఆశీర్వాద ధోరణికి ‘కలుగుగాక’ సరిపోతుంది. ఇది ‘మహిమ ఆయనదే’ అనే నిశ్చయార్థ అవకాశాన్ని పూర్తిగా నిరాకరించకుండానే వాక్యపు ప్రార్థనాత్మక శైలిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా అర్థమయ్యేలా, దైవస్తుతికి తగిన గౌరవభరిత శైలిని వాడాం. ‘దేవుడును తండ్రియునైన’ అనే నిర్మాణం ఒకే వ్యక్తిని సూచిస్తుందని స్పష్టపరుస్తుంది; పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
