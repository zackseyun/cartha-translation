id: PHP.4.7
reference: Philippians 4:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ θεοῦ ἡ ὑπερέχουσα πάντα νοῦν φρουρήσει τὰς καρδίας ὑμῶν καὶ τὰ νοήματα ὑμῶν ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/007.yaml
  text: And the peace of God[a], which surpasses all understanding, will guard your hearts and your minds in Messiah Jesus.
translation:
  language: te
  text: దేవుని శాంతి—సమస్త అవగాహనను మించిన ఆ శాంతి—మెస్సీయ యేసులో[a] మీ హృదయాలనూ మీ ఆలోచనలనూ కాపాడుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “క్రీస్తు యేసులో.”
    reason: Χριστόςను అర్థానువాదంగా ‘మెస్సీయ’ అని లేదా తెలుగులో సంప్రదాయంగా స్థిరపడిన రూపంలో ‘క్రీస్తు’ అని ఇవ్వవచ్చు.
lexical_decisions:
- source_word: εἰρήνη
  choice: శాంతి
  rationale: ఆధునిక తెలుగులో ‘శాంతి’ అంతరంగ ప్రశాంతతతోపాటు దేవునితోను ఇతరులతోను ఉన్న క్షేమ సంబంధాన్ని సూచించగల సహజమైన పదం; ‘సమాధానం’ అనే పదానికి ‘జవాబు’ అనే సాధారణ అర్థం కూడా ఉండడం వల్ల ఇక్కడ అది అస్పష్టంగా మారవచ్చు.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: గ్రీకు షష్ఠీ విభక్తిని మూలం లేదా స్వామ్యార్థం అని ప్రత్యేకంగా నిర్ణయించకుండా నేరుగా నిలుపుతుంది.
- source_word: ἡ ὑπερέχουσα πάντα νοῦν
  choice: సమస్త అవగాహనను మించిన ఆ శాంతి
  rationale: ὑπερέχουσα యొక్క ‘మించుట’ భావాన్ని, νοῦς యొక్క గ్రహణశక్తి/అవగాహన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; దేవుని శాంతి మానవ అవగాహనకు అతీతమనే భావాన్ని అనవసరంగా విస్తరించదు.
- source_word: φρουρήσει
  choice: కాపాడుతుంది
  rationale: కావలి కాసి రక్షించే క్రియలోని బలమైన సంరక్షణ భావాన్ని సరళంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τὰς καρδίας ὑμῶν
  choice: మీ హృదయాలను
  rationale: వ్యక్తి అంతరంగం, భావాలు, సంకల్పం అనే బైబిలీయ విస్తృతిని ‘హృదయాలు’ నిలుపుతుంది.
- source_word: τὰ νοήματα ὑμῶν
  choice: మీ ఆలోచనలను
  rationale: νοήματα ఇక్కడ మనస్సులోని ఆలోచనలు లేదా మానసిక క్రియలను సూచిస్తుంది; ‘ఆలోచనలు’ అనేది ‘హృదయాలు’తో అనవసరంగా కలిసిపోకుండా వాటి జ్ఞాన సంబంధ కోణాన్ని చూపుతుంది.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసులో
  rationale: Χριστόςను బిరుదుగా అనువదిస్తూ, ἐν ద్వారా వ్యక్తమయ్యే ఐక్యత లేదా జీవన-రక్షణ పరిధిని ‘లో’ అనే రూపంతో నిలుపుతుంది.
theological_decisions:
- issue: పౌలు వాడిన ἐν Χριστῷ Ἰησοῦలో Χριστῷను ఎలా తెలుగులో ఇవ్వాలి
  choice: మెస్సీయ యేసులో
  alternative: క్రీస్తు యేసులో
  rationale: Χριστόςకు ఇక్కడ అభిషిక్త రాజు అనే బిరుదు భావం ఉన్నందున ‘మెస్సీయ’ దానిని స్పష్టంగా నిలుపుతుంది; అయితే తెలుగు క్రైస్తవ వాడుకలో స్థిరపడిన ‘క్రీస్తు’ కూడా సాధ్యమైన రూపం కావడంతో పాదటిప్పణిలో ఇచ్చాం.
- issue: దేవుని శాంతి మరియు మానవ అవగాహన మధ్య సంబంధం
  choice: సమస్త అవగాహనను మించినది
  alternative: ప్రతి మనస్సును మించినది
  rationale: πάντα νοῦν అనే పదబంధం ప్రతి మానవ మనస్సునో లేక సమస్త గ్రహణశక్తినో సూచించగలదు. ప్రధాన పాఠం సందర్భానుసారంగా అవగాహన భావాన్ని ఇస్తూనే, ‘మానవ తర్కానికి విరుద్ధం’ వంటి అదనపు సిద్ధాంత నిర్ణయాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. సంబంధవాచక నిర్మాణం భారంగా కాకుండా ఉండేందుకు మధ్య విరామాలతో పునరుక్తి ఉపయోగించబడింది. ‘హృదయాలు’ మరియు ‘ఆలోచనలు’ అనే రెండు వేర్వేరు పదాలను ఉంచి మూలంలోని అంతరంగ-జ్ఞాన సంబంధ జతను నిలిపాం.
