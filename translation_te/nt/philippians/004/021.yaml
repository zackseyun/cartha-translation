id: PHP.4.21
reference: Philippians 4:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀσπάσασθε πάντα ἅγιον ἐν Χριστῷ Ἰησοῦ. ἀσπάζονται ὑμᾶς οἱ σὺν ἐμοὶ ἀδελφοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/021.yaml
  text: Greet every saint in Messiah Jesus[b][a]. The brothers with me greet you.
translation:
  language: te
  text: మెస్సీయ యేసులో[a] ఉన్న ప్రతి పరిశుద్ధునికి వందనాలు చెప్పండి. నాతో ఉన్న సోదరులు[b] మీకు వందనాలు చెబుతున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు యేసులో.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “సోదరులు” అనే పదం పౌలుతో ఉన్న తోటి విశ్వాసులందరినీ, స్త్రీపురుషులు కలిసిన సమూహాన్ని కూడా, సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: వందనాలు చెప్పండి
  rationale: లేఖ ముగింపులో ఇతరులకు అభివాదాలు తెలియజేయమనే ఆజ్ఞను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πάντα ἅγιον
  choice: ప్రతి పరిశుద్ధునికి
  rationale: ఏకవచనంతో కూడిన πᾶς యొక్క పంపిణీ భావాన్ని ‘ప్రతి’ నిలుపుతుంది; ἅγιος విశ్వాసుల పరిశుద్ధమైన, దేవునికి ప్రత్యేకపరచబడిన గుర్తింపును సూచిస్తుంది.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసులో
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉన్నందున ‘మెస్సీయ’ అని అనువదించబడింది; ἐν యొక్క సంబంధాత్మక భావాన్ని ‘లో’ నేరుగా నిలుపుతుంది.
- source_word: ἀσπάζονται
  choice: వందనాలు చెబుతున్నారు
  rationale: లేఖా సందర్భంలో గ్రీకు మధ్యమ రూపం తెలుగులో సహజమైన కర్తరి ప్రయోగంతో వ్యక్తమవుతుంది.
- source_word: οἱ σὺν ἐμοὶ ἀδελφοί
  choice: నాతో ఉన్న సోదరులు
  rationale: σὺν ἐμοὶ భావాన్ని సహజంగా తెలుపుతూ, ἀδελφοί యొక్క వ్యాకరణపరమైన పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠంలో నిలుపుతుంది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: గ్రీకు Χριστός అభిషిక్తుడనే బిరుదు; దాని బిరుదు స్వభావాన్ని పాఠకునికి స్పష్టంగా ఉంచడానికి ‘మెస్సీయ’ ఎంచుకోబడింది. సుపరిచితమైన సంప్రదాయ రూపం పాదసూచికలో ఇవ్వబడింది.
- issue: ἀδελφοί సూచించే వర్గం
  choice: సోదరులు
  alternative: సోదర సోదరీమణులు / తోటి విశ్వాసులు
  rationale: మూలంలోని వ్యాకరణపరమైన పుంలింగ బహువచనాన్ని ప్రధాన పాఠం నిలుపుతుంది; సందర్భంలో మిశ్రమ విశ్వాసుల సమూహం ఉద్దేశించబడి ఉండగల అవకాశాన్ని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన లేఖా శైలి వాడబడింది. ‘వందనాలు చెప్పండి/చెబుతున్నారు’ అనే సమాంతర పదప్రయోగం గ్రీకు క్రియల పునరావృతాన్ని సహజంగా నిలుపుతుంది.
