  source_fidelity: The Telugu accurately represents both imperatives of ἀσπάζομαι, the distributive singular πάντα ἅγιον as “ప్రతి పరిశుద్ధునికి,” the locative/relational phrase ἐν Χριστῷ Ἰησοῦ, and οἱ σὺν ἐμοὶ ἀδελφοί. The shift to a Telugu dative (“ప్రతి పరిశుద్ధునికి”) is the natural construction required by the verb and does not alter the sense.
  naturalness: “వందనాలు చెప్పండి/చెబుతున్నారు” is natural, clear modern Telugu for epistolary greetings. The wording maintains the parallelism of the two Greek greeting verbs without sounding wooden.
  terminology: “మెస్సీయ యేసు” appropriately renders Χριστῷ Ἰησοῦ in line with the stated title-based policy, while footnote a gives the established alternative “క్రీస్తు యేసులో.” “పరిశుద్ధుడు” faithfully retains the set-apart believer designation. “సోదరులు” reflects the masculine plural ἀδελφοί, and footnote b responsibly notes the possible broader contextual reference without imposing it on the text.
