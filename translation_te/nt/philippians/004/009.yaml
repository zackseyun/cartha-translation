id: PHP.4.9
reference: Philippians 4:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἃ καὶ ἐμάθετε καὶ παρελάβετε καὶ ἠκούσατε καὶ εἴδετε ἐν ἐμοί, ταῦτα πράσσετε· καὶ ὁ θεὸς τῆς εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/009.yaml
  text: What you also learned and received and heard and saw in me—practice these things[b][a], and the God of peace will be with you.
translation:
  language: te
  text: మీరు నేర్చుకున్నవి, స్వీకరించినవి, విన్నవి, నాలో చూసినవి[b]—వాటిని ఆచరిస్తూ ఉండండి.[a] అప్పుడు కాదు, శాంతి దేవుడు మీతో ఉంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వీటిని చేస్తూ ఉండండి.”
    reason: lexical_alternative
  - marker: b
    text: “నాలో చూసినవి” అనే మాటను “నా మాదిరిలో చూసినవి” లేదా “నా జీవితంలో చూసినవి” అని కూడా చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: వాటిని
  rationale: నపుంసక బహువచన సంబంధసర్వనామం సూచించే అనేక విషయాలను తెలుగులో వరుసగా వచ్చే క్రియలతో సహజంగా వ్యక్తం చేయడానికి ‘వాటిని’ ఉపయోగించబడింది.
- source_word: ἐμάθετε
  choice: నేర్చుకున్న
  rationale: ఫిలిప్పీయులు పౌలు ద్వారా గతంలో నేర్చుకున్న విషయాలను సూచించే సహజమైన సమానార్థకం.
- source_word: παρελάβετε
  choice: స్వీకరించిన
  rationale: బోధను లేదా అందించబడిన సంప్రదాయాన్ని స్వీకరించడం అనే పౌలు వాడుకలోని విస్తృత భావాన్ని, ‘సంప్రదాయం’ అని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: ἠκούσατε
  choice: విన్న
  rationale: మూలంలోని సమాంతర క్రియల వరుసను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: εἴδετε ἐν ἐμοί
  choice: నాలో ... చూసిన
  rationale: పౌలులోనే గమనించిన విషయాలు అనే మూలపాఠానికి సన్నిహితమైన భావాన్ని నిలుపుతుంది; ‘నా మాదిరిలో’ అని ప్రధాన పాఠంలో వ్యాఖ్యానాత్మకంగా విస్తరించలేదు.
- source_word: ταῦτα πράσσετε
  choice: ఆచరిస్తూ ఉండండి
  rationale: πράσσετε వర్తమాన ఆజ్ఞారూపం సూచించే కొనసాగుతున్న, అలవాటైన ఆచరణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: సమాధానానికి మూలమైన దేవుడు
  rationale: గ్రీకు సంబంధ విభక్తి పదబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ దేవునికి సమాధానంతో ఉన్న అంతరంగ సంబంధాన్ని సూచిస్తుంది; దేవుడు సమాధానాన్ని అనుగ్రహించేవాడు అనే భావం ఇందులో ఉంటుంది.
- source_word: ἔσται μεθ’ ὑμῶν
  choice: మీతో ఉంటాడు
  rationale: దేవుని సన్నిధి గురించిన భవిష్యత్ హామీని నేరుగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: విధేయతకు దేవుని సన్నిధికి మధ్య సంబంధం
  choice: ఉపదేశం తరువాత వచ్చే హామీగా ‘అప్పుడు ... మీతో ఉంటాడు’ అని అనువదించబడింది; ఇది సందర్భంలోని అనుసంధానాన్ని స్పష్టం చేస్తుంది.
  alternative: ‘మరియు సమాధాన దేవుడు మీతో ఉంటాడు’ అని గ్రీకు καί రూపాన్ని మరింత అక్షరార్థంగా ఉంచడం.
  rationale: గ్రీకులో స్పష్టమైన షరతు వాక్యం లేదు; అందువల్ల యాంత్రిక కారణ-ఫలిత సంబంధాన్ని చేర్చలేదు. అయితే తెలుగులో ఉపదేశం-హామీ క్రమాన్ని సహజంగా తెలియజేయడానికి ‘అప్పుడు’ వాడబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. క్రియల వరుసను నిలుపుతూ, తెలుగులో సహజమైన నామీకృత నిర్మాణం ఉపయోగించబడింది. అడిక్కురుల గుర్తులు రెండూ ప్రధాన పాఠంలో ఉన్నాయి.
