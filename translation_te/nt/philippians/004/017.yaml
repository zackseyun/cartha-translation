id: PHP.4.17
reference: Philippians 4:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐχ ὅτι ἐπιζητῶ τὸ δόμα, ἀλλὰ ἐπιζητῶ τὸν καρπὸν τὸν πλεονάζοντα εἰς λόγον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/017.yaml
  text: Not that I seek the gift[a], but I seek the fruit that increases to your account.
translation:
  language: te
  text: నేను కానుకను కోరుతున్నానని కాదు; మీ ఖాతాకు సమృద్ధిగా చేరే ఫలాన్ని కోరుతున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “మీ ఖాతాలో సమృద్ధిగా పెరుగుతున్న ఫలాన్ని.”'
    reason: πλεονάζοντα ను ‘సమృద్ధిగా పెరుగుతున్నది’గా, εἰς λόγον ὑμῶν ను ‘మీ ఖాతాలో’గా కూడా అనువదించవచ్చు; రెండూ మూలంలోని ఫలము–ఖాతా రూపకాలను నిలుపుతాయి.
lexical_decisions:
- source_word: ἐπιζητῶ
  choice: కోరుతున్నాను
  rationale: ఈ క్రియ చురుకుగా వెదకడం లేదా ఆశించడాన్ని సూచిస్తుంది. ఇక్కడ సహజమైన తెలుగులో ‘కోరుతున్నాను’ అని అనువదించడం ద్వారా రెండుసార్లు వచ్చే క్రియతో ఏర్పడే వ్యత్యాసం నిలుస్తుంది.
- source_word: δόμα
  choice: బహుమతిని
  rationale: ఫిలిప్పీయులు పౌలుకు ఇచ్చిన కానుకను ఈ పదం సూచిస్తుంది. ‘బహుమతి’ ప్రత్యక్షమైనది, సాధారణ పాఠకులకు సహజమైనది.
- source_word: καρπὸν
  choice: ఫలాన్ని
  rationale: ఈ రూపక పదం ఫలితం లేదా దిగుబడిని సూచించగలదు. ‘ఫలం’ అనే రూపకాన్ని నిలిపి ఉంచడం వల్ల దాని వెంట వచ్చే లెక్కల భాషతో ఉన్న ఉద్దేశపూర్వక ఉద్వేగం చెదరదు.
- source_word: πλεονάζοντα
  choice: పెరుగుతూ ఉండే
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న పెరుగుదల లేదా సమృద్ధిని సూచిస్తుంది. ‘పెరుగుతూ ఉండే’ ఆ కొనసాగుతున్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἰς λόγον ὑμῶν
  choice: మీ లెక్కలో
  rationale: ఈ సందర్భంలో λόγος లెక్క లేదా ఖాతా అనే వాణిజ్య రూపకాన్ని కలిగి ఉంది. ‘మీ లెక్కలో’ ఆ రూపకాన్ని కాపాడుతూ, వారికి జమయ్యే ప్రయోజనాన్ని అతిగా వివరణ చేయకుండా తెలియజేస్తుంది.
- source_word: οὐχ ὅτι ... ἀλλὰ
  choice: …అని కాదు; …
  rationale: ఈ నిర్మాణం వివరణాత్మక వ్యత్యాసాన్ని చూపుతుంది. తెలుగులో ‘అని కాదు; … కోరుతున్నాను’ పౌలు వాక్యంలోని ప్రతివ్యతిరేక నిర్మాణాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘ఫలం’ మరియు ‘లెక్క’ మధ్య రూపకాల కలయిక
  choice: రెండు రూపకాలనూ యథాతథంగా నిలుపడం
  alternative: ‘మీకు కలిగే ప్రయోజనం’ అని భావాన్ని విప్పి చెప్పడం
  rationale: గ్రీకు పాఠం వ్యవసాయ రూపకమైన ‘ఫలం’ను వాణిజ్య లెక్కల భాషతో కలుపుతుంది. దాన్ని ఒకే వివరణాత్మక భావంగా మార్చడం మూలంలోని ఉద్దేశపూర్వక రూపక ఉద్వేగాన్ని తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘ఫలం’, ‘లెక్క’ అనే మూల రూపకాలు రెండూ నిలుపబడ్డాయి; అర్థాన్ని ఏదైనా ప్రత్యేక సిద్ధాంత దిశగా విస్తరించలేదు.
