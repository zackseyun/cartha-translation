id: PHP.4.12
reference: Philippians 4:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἶδα καὶ ταπεινοῦσθαι, οἶδα καὶ περισσεύειν· ἐν παντὶ καὶ ἐν πᾶσιν μεμύημαι, καὶ χορτάζεσθαι καὶ πεινᾶν, καὶ περισσεύειν καὶ ὑστερεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/012.yaml
  text: 'I know how to be brought low, and I know how to abound. In every circumstance and in all things I have learned the secret: both to be well fed and to be hungry, both to abound and to be in need.'
translation:
  language: te
  text: 'దీనస్థితిలో ఎలా ఉండాలో నాకు తెలుసు; సమృద్ధిగా ఎలా ఉండాలో కూడా నాకు తెలుసు. ప్రతి పరిస్థితిలోనూ, అన్ని విషయాల్లోనూ నేను రహస్యాన్ని నేర్చుకున్నాను[a]: కడుపునిండా తినడానికైనా ఆకలితో ఉండడానికైనా, సమృద్ధిగా ఉండడానికైనా కొరతలో ఉండడానికైనా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నేను దీక్ష పొందాను.” ఒక రహస్యాన్ని నేర్చుకోవడం అనే భావంలో పౌలు దీక్షకు సంబంధించిన భాషను రూపకంగా ఉపయోగిస్తున్నాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: ఎలా ఉండాలో నాకు తెలుసు
  rationale: తరువాత వచ్చే క్రియారూపాలతో కలిపి, అనుభవం ద్వారా పొందిన ఆచరణాత్మక అవగాహనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ταπεινοῦσθαι
  choice: దీనస్థితిలో ఉండడం
  rationale: బాహ్య పరిస్థితుల్లో తగ్గించబడిన లేదా అణగారిన స్థితిని సూచిస్తుంది; కేవలం వినయ స్వభావానికి పరిమితం చేయదు.
- source_word: περισσεύειν
  choice: సమృద్ధిగా ఉండడం
  rationale: అవసరానికి మించి కలిగి ఉండే విస్తృత భావాన్ని, భౌతిక సంపదకే పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: ἐν παντὶ καὶ ἐν πᾶσιν
  choice: ప్రతి పరిస్థితిలోనూ, అన్ని విషయాల్లోనూ
  rationale: మూలంలోని జతపదాల అలంకారపూర్వక సంపూర్ణతను తెలుగులో స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: μεμύημαι
  choice: అవసరమైన రహస్యాన్ని నేర్చుకున్నాను
  rationale: దీక్ష పొందడాన్ని సూచించే రూపక భాషను సందర్భానుగుణంగా, జీవన పరిస్థితులను ఎదుర్కొనే రహస్యాన్ని నేర్చుకోవడంగా తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: χορτάζεσθαι
  choice: కడుపునిండా తినడం
  rationale: ఆకలితో ఉండడానికి ఎదురుగా ఉన్న ఆహారసంబంధ భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: πεινᾶν
  choice: ఆకలితో ఉండడం
  rationale: సూటిగా, సహజంగా ఉండి χορτάζεσθαιతోని వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ὑστερεῖσθαι
  choice: కొరతలో ఉండడం
  rationale: ధనాభావానికే పరిమితం కాకుండా, లోటు లేదా అవసరంలో ఉండే విస్తృత భావాన్ని తెలియజేస్తుంది.
