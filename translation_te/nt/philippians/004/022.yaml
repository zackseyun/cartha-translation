source:
  edition: SBLGNT
  text: ἀσπάζονται ὑμᾶς πάντες οἱ ἅγιοι, μάλιστα δὲ οἱ ἐκ τῆς Καίσαρος οἰκίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/022.yaml
  text: All the saints greet you[a], especially those of Caesar’s household.
translation:
  language: te
  text: పరిశుద్ధులందరూ మీకు వందనాలు చెబుతున్నారు; ముఖ్యంగా కైసరు గృహానికి చెందినవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కైసరు గృహవ్యవస్థకు చెందినవారు.” ఈ పదబంధం కైసరు కుటుంబ సభ్యులనే తప్పనిసరిగా సూచించదు; సామ్రాజ్య గృహవ్యవస్థతో అనుబంధమున్న వారినీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζονται
  choice: వందనాలు చెబుతున్నారు
  rationale: పత్రికా సందర్భంలోని అభివాదాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; మూలంలోని వర్తమాన క్రియ భావాన్ని నిలుపుతుంది.
- source_word: πάντες οἱ ἅγιοι
  choice: పరిశుద్ధులందరూ
  rationale: పౌలు విశ్వాసులను సూచించడానికి సాధారణంగా వాడే ἅγιοι పదానికి స్థిరమైన, గౌరవప్రదమైన తెలుగు రూపం; ప్రత్యేక శ్రేణి వారికే పరిమితం చేయదు.
- source_word: μάλιστα δὲ
  choice: ముఖ్యంగా
  rationale: పెద్ద సమూహంలో ఒక వర్గానికి ప్రత్యేక ప్రాధాన్యం ఇస్తున్న భావాన్ని సహజంగా అందిస్తుంది.
- source_word: οἱ ἐκ τῆς Καίσαρος οἰκίας
  choice: కైసరు ఇంటివారు
  rationale: కైసరు గృహవ్యవస్థతో అనుబంధమున్న వారిని సంక్షిప్తంగా, సహజంగా సూచిస్తుంది; రక్తసంబంధ కుటుంబ సభ్యులనే తప్పనిసరిగా సూచించదు.
- source_word: Καίσαρος
  choice: కైసరు
  rationale: గ్రీకు మూలంలోని చారిత్రక బిరుదు/పేరును నిలుపుతుంది; వ్యాఖ్యాత్మకంగా ‘చక్రవర్తి’ అని మార్చదు.
theological_decisions:
- issue: పౌలు వాడుకలో ‘పరిశుద్ధులు’ అనే పదం అర్థం
  choice: విశ్వాసుల సమాజాన్ని సూచించే పదంగా ‘పరిశుద్ధులు’ అని అనువదించడం
  alternative: దేవుని ప్రజలు; విశ్వాసులు
  rationale: ఇక్కడ ఈ పదం అసాధారణ పవిత్రతగల ప్రత్యేక వర్గాన్ని సూచించదు. అయినా మూలంలోని ధార్మిక పదాన్ని వివరణాత్మక పదబంధంతో భర్తీ చేయకుండా నిలుపుతుంది.
- issue: ‘కైసరు ఇంటివారు’ పరిధి
  choice: కైసరు గృహవ్యవస్థతో అనుబంధమున్న వ్యక్తులు
  alternative: కైసరు కుటుంబ సభ్యులు మాత్రమే
  rationale: ἐκ τῆς Καίσαρος οἰκίας అనే పదబంధం కుటుంబ సభ్యులతో పాటు సేవకులు, విముక్తులు లేదా అధికారులతో కూడిన సామ్రాజ్య గృహవ్యవస్థకు చెందినవారిని సూచించవచ్చు; అందువల్ల దానిని రక్తసంబంధ కుటుంబానికే పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన పత్రికా శైలి. ‘కైసరు ఇంటివారు’ పాఠ్యంలో సులభంగా అర్థమయ్యే రూపం; దాని విస్తృత చారిత్రక భావాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
