id: PHP.3.12
reference: Philippians 3:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐχ ὅτι ἤδη ἔλαβον ἢ ἤδη τετελείωμαι, διώκω δὲ εἰ καὶ καταλάβω, ἐφ’ ᾧ καὶ κατελήμφθην ὑπὸ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/012.yaml
  text: Not that I have already received it or have already been perfected[c][b][a], but I press on to see if I may also take hold of that for which I too was taken hold of by Christ.
translation:
  language: te
  text: నేను ఇప్పటికే దాన్ని పొందేశానని[a] గానీ, ఇప్పటికే సంపూర్ణతకు చేర్చబడ్డానని[b] గానీ కాదు. కానీ, క్రీస్తు[c] చేత నేను కూడా దేని కోసం పట్టుకోబడ్డానో, దానిని నేనూ పట్టుకోగలనేమో అని వెంబడిస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దాన్ని సాధించేశాను’; గ్రీకులో కర్మ చెప్పబడలేదు, అది చుట్టుపక్కల సందర్భం ద్వారా అర్థమవుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఇప్పటికే పరిపూర్ణుణ్ణి చేయబడ్డాను’ లేదా ‘ఇప్పటికే సంపూర్ణుణ్ణి అయ్యాను.’
    reason: lexical_alternative
  - marker: c
    text: 'గ్రీకు: క్రిస్టోస్; మరో అనువాదం ‘మెస్సీయ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβον
  choice: దాన్ని పొందేశాను
  rationale: గ్రీకులో కర్మ ప్రత్యక్షంగా లేకపోయినా, ముందున్న సందర్భంలోని లక్ష్యాన్ని సూచిస్తుంది. తెలుగులో స్పష్టత కోసం ‘దాన్ని’ చేర్చబడింది; ‘పొందేశాను’ సాధించిన స్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: τετελείωμαι
  choice: సంపూర్ణతకు చేర్చబడ్డాను
  rationale: పర్ఫెక్ట్ పాసివ్ రూపంలోని చేయబడిన స్థితి భావాన్ని నిలుపుతూ, పాపరహిత పరిపూర్ణత వంటి తరువాతి సిద్ధాంతార్థాన్ని వాక్యంలోకి దిగుమతి చేయదు.
- source_word: διώκω
  choice: ముందుకు సాగుతున్నాను
  rationale: ఈ సందర్భంలో లక్ష్యాన్ని వెంబడిస్తూ నిరంతరం కృషి చేయడాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καταλάβω
  choice: పట్టుకోగలనేమో
  rationale: καταλαμβάνω లోని బలమైన ‘పట్టుకోవడం/స్వాధీనం చేసుకోవడం’ భావాన్ని ఉంచుతుంది; తరువాతి పాసివ్ రూపంతో ఉన్న పదబంధ సంబంధాన్నీ కాపాడుతుంది.
- source_word: ἐφ’ ᾧ
  choice: దేని కోసం
  rationale: ఈ పదబంధాన్ని ఉద్దేశం లేదా లక్ష్యాన్ని సూచించేదిగా తీసుకుంటుంది; కారణార్థం సాధ్యమైనా, సందర్భంలో లక్ష్యార్థం మెరుగ్గా సరిపోతుంది.
- source_word: κατελήμφθην
  choice: నేనూ ... చేత పట్టుకోబడ్డాను
  rationale: పాసివ్ భావాన్ని స్పష్టంగా ఉంచి, καταλάβω తో ఉన్న ఉద్దేశపూర్వక పదప్రయోగాన్ని ‘పట్టుకో’ ద్వారా నిలుపుతుంది.
- source_word: Χριστοῦ
  choice: క్రీస్తు
  rationale: పౌలు వాడుకలో ఇది బిరుదుగానూ పేరు వలెనూ పనిచేస్తుంది. ‘క్రీస్తు’ సుపరిచితమైన సహజ రూపం; ‘మెస్సీయ’ అనే బిరుదార్థాన్ని పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: τετελείωμαι పాపరహిత పరిపూర్ణతను సూచించేలా అనువదించాలా
  choice: సంపూర్ణతకు చేర్చబడ్డాను
  alternative: పరిపూర్ణుణ్ణి చేయబడ్డాను / సంపూర్ణుణ్ణి అయ్యాను
  rationale: పౌలు తాను పూర్తయిన స్థితికి ఇప్పటికే చేరలేదని నిరాకరిస్తున్నాడు; అయితే ఆ స్థితిని తరువాతి సిద్ధాంత వ్యవస్థల ప్రకారం నిర్వచించడం లేదు. అందువల్ల పాసివ్ మరియు ఫలితస్థితి భావాన్ని ఉంచి, వేదాంతపరమైన ఉద్రిక్తతను పరిష్కరించకుండా వదిలింది.
- issue: ἐφ’ ᾧ యొక్క సంబంధం ఉద్దేశమా లేక కారణమా
  choice: దేని కోసం
  alternative: దాని కారణంగా / ఎందుకంటే
  rationale: సందర్భంలోని లక్ష్యాన్ని వెంబడించడం మరియు ఒకదాన్ని పట్టుకోవడం అనే భావప్రవాహానికి ఉద్దేశార్థం సరిపోతుంది; అయినా గ్రీకు నిర్మాణానికి కారణార్థ వివరణ కూడా సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘పట్టుకోగలనేమో / పట్టుకోబడ్డాను’ అనే పునరుక్తి గ్రీకులోని καταλάβω / κατελήμφθην పదప్రయోగాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది. మొదటి వాక్యంలో ‘గానీ ... గానీ కాదు’ నిర్మాణం రెండు నిరాకరణలను స్పష్టంగా కలుపుతుంది.
