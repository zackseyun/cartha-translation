source:
  edition: SBLGNT
  text: Βλέπετε τοὺς κύνας, βλέπετε τοὺς κακοὺς ἐργάτας, βλέπετε τὴν κατατομήν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/002.yaml
  text: Watch out for the dogs[a]; watch out for the evil workers[c][b]; watch out for the mutilation.
translation:
  language: te
  text: ఆ కుక్కల పట్ల జాగ్రత్తగా ఉండండి; ఆ దుష్టులైన పనివారి పట్ల జాగ్రత్తగా ఉండండి; ఆ వికృత ఛేదనం పట్ల జాగ్రత్తగా ఉండండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వికృత ఛేదనం’ అని అనువదించిన గ్రీకు పదానికి అక్షరార్థం ‘కోసివేయడం’ లేదా ‘అవయవఛ్ఛేదం.’ తరువాతి వచనంలోని ‘సున్నతి’ అనే పదానికి విరుద్ధంగా పౌలు దీనిని అవమానకరమైన పదచమత్కారంగా వాడాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: విషయంలో జాగ్రత్తగా ఉండండి
  rationale: వర్తమాన ఆజ్ఞార్థక క్రియ ఇక్కడ మూడుసార్లు పునరుక్తమై అత్యవసర హెచ్చరికను ఇస్తుంది. తెలుగులో ఒకే నిర్మాణాన్ని మూడుసార్లు ఉంచడం ఆ బలాన్నీ లయనూ నిలుపుతుంది.
- source_word: τοὺς κύνας
  choice: ఆ కుక్కలు
  rationale: కఠినమైన రూపకాన్ని వ్యాఖ్యానించి మృదువుచేయకుండా యథాతథంగా నిలుపుతుంది; గ్రీకులో లేని విశేషణాన్ని చేర్చదు.
- source_word: τοὺς κακοὺς ἐργάτας
  choice: ఆ దుష్ట పనివారు
  rationale: κακούς లోని నైతిక తీవ్రతను, ἐργάτας లోని సాధారణ ‘పనివారు’ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: τὴν κατατομήν
  choice: ఆ అవయవఛ్ఛేదం చేసేవారు
  rationale: κατατομή అనే నామవాచకం అక్షరార్థంగా ‘కోసివేయడం/అవయవఛ్ఛేదం’ అని సూచిస్తుంది. వ్యక్తుల గురించి వరుసగా వస్తున్న హెచ్చరికలో తెలుగుకు సహజంగా ఉండేలా కార్యం చేసేవారిని సూచించే రూపం వాడబడింది; తరువాతి వచనంలోని ‘సున్నతి’తో ఉన్న అవమానకర పదచమత్కారం పాదసూచికలో స్పష్టం చేయబడింది.
theological_decisions:
- issue: చుట్టుపక్కల సందర్భంలోని సున్నతి భాషకు సంబంధించి κατατομήν ను ఎలా అనువదించాలి
  choice: సాధారణ ‘సున్నతి’గా మృదువుచేయకుండా ‘అవయవఛ్ఛేదం చేసేవారు’ అనే అవమానకర ప్రతిపదంతో అనువదించడం
  alternative: ‘అవయవఛ్ఛేదం’; ‘నకిలీ సున్నతి చేసేవారు’
  rationale: పౌలు సాధారణంగా సున్నతిని సూచించే περιτομή అనే పదానికి బదులుగా ఉద్దేశపూర్వకంగా κατατομή అనే కఠినమైన పదాన్ని వాడాడు. ‘నకిలీ’ వంటి మూలంలో లేని వివరణను చేర్చకుండా ఆ వాక్చాతుర్యపు తీవ్రతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, నేరుగా హెచ్చరించే శైలి. గ్రీకు వాక్యంలోని మూడుసార్ల పునరుక్తిని నిలిపి, కఠినమైన రూపకాల్ని మృదువుచేయలేదు.
