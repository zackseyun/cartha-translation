revisions:
- from: ఆ కుక్కల విషయంలో జాగ్రత్తగా ఉండండి; ఆ దుష్ట పనివారి విషయంలో జాగ్రత్తగా ఉండండి; ఆ అవయవఛ్ఛేదం చేసేవారి విషయంలో జాగ్రత్తగా ఉండండి.[a]
  to: ఆ కుక్కల పట్ల జాగ్రత్తగా ఉండండి; ఆ దుష్టులైన పనివారి పట్ల జాగ్రత్తగా ఉండండి; ఆ వికృత ఛేదనం పట్ల జాగ్రత్తగా ఉండండి.[a]
  rationale: The revision retains the threefold imperative and the harsh polemical imagery, while restoring the Greek abstract noun κατατομήν rather than recasting it as people who perform an action. The note supplies the necessary explanation of the deliberate contrast with ‘circumcision’ in the following verse without importing that interpretation into the main text.
  reviewer_model: gpt-5.6-terra
