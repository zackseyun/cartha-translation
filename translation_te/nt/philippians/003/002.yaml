review_pass:
  verdict: revise
  source_fidelity: The repeated imperative is retained, and the first two objects are represented appropriately. However, κατατομήν is an abstract noun ('mutilation/cutting') in the Greek, whereas the draft changes it into an agent noun, 'those who perform mutilation.' This is a substantive shift and should be corrected.
  naturalness: The threefold warning is clear and suitably emphatic in modern standard Telugu. Replacing 'విషయంలో' with 'పట్ల' is more direct and idiomatic for a warning directed at persons or a practice.
  terminology: ‘ఆ కుక్కలు’ preserves the harsh metaphor. ‘దుష్ట పనివారు’ is understandable, though ‘దుష్టులైన పనివారు’ more naturally conveys morally evil workers. ‘అవయవఛ్ఛేదం’ can suggest amputation and is less suitable here; ‘వికృత ఛేదనం’ preserves the polemical force of κατατομή while retaining its abstract form and allowing the wordplay with ‘సున్నతి’ to be explained in the note.
  issues:
  - severity: high
    issue: The abstract noun κατατομήν is rendered as an agent expression.
    rationale: ‘అవయవఛ్ఛేదం చేసేవారు’ means ‘those who perform mutilation,’ but the Greek says ‘the mutilation.’ The source’s parallel rhetoric does not license changing the noun into persons.
  - severity: medium
    issue: ‘అవయవఛ్ఛేదం’ is overly specific.
    rationale: It commonly evokes removal of a limb or organ, while κατατομή is a derogatory term for mutilating cutting. A less anatomically specific Telugu expression better preserves the source’s polemical ambiguity.
  revised_text: ఆ కుక్కల పట్ల జాగ్రత్తగా ఉండండి; ఆ దుష్టులైన పనివారి పట్ల జాగ్రత్తగా ఉండండి; ఆ వికృత ఛేదనం పట్ల జాగ్రత్తగా ఉండండి.[a]
  revised_footnotes:
