    reason: alternative_reading
  - marker: b
    text: “నీతి” ఉన్న రెండు చోట్లా “న్యాయం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported addition “కోరుకుంటున్నాను” and retains the Greek’s context-dependent subjunctive through “కనబడాలని.” It renders ἐν αὐτῷ directly as “ఆయనలో,” preserves the contrast governed by μὴ ἔχων, and keeps both the faith/faithfulness ambiguity and the righteousness/justice lexical alternative in appropriately anchored footnotes.
