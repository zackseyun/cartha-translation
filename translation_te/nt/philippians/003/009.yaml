id: PHP.3.9
reference: Philippians 3:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εὑρεθῶ ἐν αὐτῷ, μὴ ἔχων ἐμὴν δικαιοσύνην τὴν ἐκ νόμου ἀλλὰ τὴν διὰ πίστεως Χριστοῦ, τὴν ἐκ θεοῦ δικαιοσύνην ἐπὶ τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/009.yaml
  text: and be found in him[a], not having my own righteousness from the law[b], but that which is through faith in Messiah—the righteousness from God based on faith.
translation:
  language: te
  text: ఆయనలో కనబడాలని—ధర్మశాస్త్రం నుండి వచ్చే నా స్వంత నీతిని[b] కలిగియుండక, మెస్సీయపై విశ్వాసం ద్వారా వచ్చే నీతిని[a], అంటే విశ్వాసం ఆధారంగా దేవుని నుండి వచ్చే నీతిని[b] కలిగియుండాలని.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మెస్సీయ నమ్మకత్వం ద్వారా వచ్చే నీతిని.”
    reason: alternative_reading
  - marker: b
    text: “నీతి” ఉన్న రెండు చోట్లా “న్యాయం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρεθῶ
  choice: కనబడాలని
  rationale: అఒరిస్టు కర్మణి సబ్జంక్టివ్ భావాన్ని సహజమైన తెలుగు ఆశా/ఉద్దేశ నిర్మాణంలో వ్యక్తం చేస్తుంది; ముందరి వచనంలోని పౌలు ఆకాంక్షకు అనుసంధానంగా ‘కోరుకుంటున్నాను’ స్పష్టీకరించబడింది.
- source_word: ἐν αὐτῷ
  choice: ఆయనలో ఉన్నవాడిగా
  rationale: పౌలు వాడే క్రీస్తుతో ఐక్యతకు సంబంధించిన విస్తృతమైన ‘ఆయనలో’ భావాన్ని కాపాడుతూ, తెలుగులో ‘కనబడడం’తో సహజంగా కలిసేలా ‘ఉన్నవాడిగా’ ఉపయోగించబడింది.
- source_word: μὴ ἔχων
  choice: కలిగినవాడిగా కాక
  rationale: పౌలు ఏ స్థితిలో కనబడాలని కోరుతున్నాడో తెలిపే వర్తమాన కృదంత భావాన్ని నిలుపుతుంది.
- source_word: δικαιοσύνην
  choice: నీతి
  rationale: పౌలు సందర్భంలో దేవునితో సరైన సంబంధం/న్యాయస్థితి సహా పదంలోని విస్తృత ధార్మిక భావాన్ని మోసే సాంప్రదాయికమైన, సహజమైన తెలుగు పదం; ‘న్యాయం’ అనే ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
- source_word: τὴν ἐκ νόμου
  choice: ధర్మశాస్త్రం నుండి వచ్చే
  rationale: ἐκ సూచించే మూలం లేదా ఉద్భవాన్ని స్పష్టంగా తెలియజేస్తుంది; νόμος ఇక్కడ మోషే ధర్మశాస్త్రాన్ని సూచించే సందర్భానుకూల ప్రయోగం.
- source_word: διὰ πίστεως Χριστοῦ
  choice: మెస్సీయపై విశ్వాసం ద్వారా
  rationale: వివాదాస్పదమైన πίστις Χριστοῦ నిర్మాణానికి ప్రధాన పాఠ్యంలో కర్మణి-షష్ఠీ భావాన్ని ఇస్తుంది; మెస్సీయ నమ్మకత్వం అనే కర్తరి-షష్ఠీ భావం పాదటిప్పణిలో భద్రపరచబడింది.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός యొక్క బిరుదు స్వభావాన్ని పేరు మాత్రంగా మార్చకుండా నిలుపుతుంది.
- source_word: τὴν ἐκ θεοῦ δικαιοσύνην
  choice: దేవుని నుండి వచ్చే నీతి
  rationale: నీతి యొక్క మూలం దేవుడే అని తెలిపే గ్రీకు సంక్షిప్త నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ τῇ πίστει
  choice: విశ్వాసంపై ఆధారపడిన
  rationale: ἐπί + దత్తివు సూచించే ఆధారం లేదా ప్రాతిపదిక భావాన్ని స్పష్టంగా, ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: πίστεως Χριστοῦ యొక్క భావం
  choice: మెస్సీయపై విశ్వాసం
  alternative: మెస్సీయ నమ్మకత్వం
  rationale: షష్ఠీ విభక్తి సంబంధం నిజంగా సందిగ్ధమైనది. ప్రధాన పాఠ్యం మెస్సీయపై ఉంచే విశ్వాసం అనే పఠనాన్ని తీసుకుంటుంది; మెస్సీయ యొక్క నమ్మకత్వం అనే సాధ్యమైన పఠనాన్ని పాదటిప్పణిలో ఉంచి ధార్మిక ఉద్రిక్తతను కాపాడుతుంది.
- issue: δικαιοσύνη యొక్క అనువాదం
  choice: నీతి
  alternative: న్యాయం
  rationale: ఈ పౌలు సందర్భంలో ‘నీతి’ సహజమైన ప్రధాన అనువాదం; అయితే మూలపదంలోని న్యాయం/న్యాయబద్ధత భావపరిధి కనిపించేలా ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం ఉపయోగించబడింది. వచనం ముందరి వాక్యంలోని పౌలు ఆకాంక్షను కొనసాగిస్తున్నందున, తెలుగులో సంపూర్ణత కోసం ‘కోరుకుంటున్నాను’ చేర్చబడింది. ‘ఆయనలో’ అనే పౌలు ప్రయోగం వివరణాత్మకంగా కుదించకుండా అలాగే నిలుపబడింది.
