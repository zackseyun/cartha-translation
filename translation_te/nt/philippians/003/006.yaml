id: PHP.3.6
reference: Philippians 3:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κατὰ ⸀ζῆλος διώκων τὴν ἐκκλησίαν, κατὰ δικαιοσύνην τὴν ἐν νόμῳ γενόμενος ἄμεμπτος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/006.yaml
  text: as to zeal[a], persecuting the church; as to righteousness under the law[b], having become blameless.
translation:
  language: te
  text: ఉత్సాహం విషయానికి వస్తే, సంఘాన్ని హింసించేవాడిని; ధర్మశాస్త్రంలో ఉన్న[a] నీతి విషయానికి వస్తే, నిందలేనివాడినయ్యాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ధర్మశాస్త్రంలో ఉన్న.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: విషయానికొస్తే
  rationale: κατά ఇక్కడ పౌలు తనను అంచనా వేసే ఒక్కొక్క అంశాన్ని పరిచయం చేస్తుంది. పునరావృతమైన వాక్య నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ζῆλος
  choice: ఆసక్తి
  rationale: మతపరమైన గాఢ నిబద్ధతను, కార్యోన్ముఖ ఉత్సాహాన్ని సూచిస్తుంది; సందర్భంలో కేవలం భావోద్వేగాన్ని కాక పౌలు గత ప్రవర్తనను ప్రేరేపించిన తీవ్ర ఆసక్తిని తెలియజేస్తుంది.
- source_word: διώκων
  choice: హింసించినవాడిని
  rationale: ఈ సందర్భంలో క్రైస్తవ సమాజంపై శత్రుత్వపూర్వక చర్యను స్పష్టంగా సూచిస్తుంది. గ్రీకు వర్తమాన కృదంతం పౌలు గత పరిచయ లక్షణాల జాబితాలో ఉన్నందున తెలుగులో గతకాల వర్ణన సహజం.
- source_word: τὴν ἐκκλησίαν
  choice: సంఘాన్ని
  rationale: పౌలు వాడుకలో ఇది సాధారణ సభను కాక క్రీస్తును విశ్వసించే సమాజాన్ని సూచిస్తుంది; ‘సంఘం’ ఆధునిక తెలుగు బైబిలు భాషలో స్పష్టమైన పదం.
- source_word: δικαιοσύνην
  choice: నీతి
  rationale: δικαιοσύνη ఇక్కడ ధర్మశాస్త్ర ప్రమాణంతో అంచనా వేయబడే సదాచార స్థితిని సూచిస్తుంది. ‘నీతి’ theological మరియు న్యాయసంబంధ భావవ్యాప్తిని అతి సంకుచితం చేయకుండా మోస్తుంది.
- source_word: ἐν νόμῳ
  choice: ధర్మశాస్త్రంలోని
  rationale: గ్రీకు పదబంధంలోని ‘లో’ అనే పరిధి భావాన్ని నేరుగా నిలుపుతూ, ఆ నీతి ధర్మశాస్త్ర పరిధిలో లేదా దాని ప్రమాణం ప్రకారం చెప్పబడుతోందని తెలియజేస్తుంది.
- source_word: γενόμενος
  choice: ఉన్నాను
  rationale: γενόμενος అక్షరార్థంగా ‘అయినవాడిగా/కలిగినవాడిగా’ ఉన్నా, ఈ స్వీయవివరణలో ‘నిందలేనివాడిగా ఉన్నాను’ సహజమైన తెలుగు. ఫలిత స్థితిని తెలియజేస్తూ అసహజమైన పదప్రయోగాన్ని నివారిస్తుంది.
- source_word: ἄμεμπτος
  choice: నిందలేనివాడిగా
  rationale: పేర్కొన్న ధర్మశాస్త్ర సంబంధ ప్రమాణంలో తనపై తప్పు మోపలేని స్థితిని సూచిస్తుంది; సంపూర్ణ పాపరాహిత్యాన్ని తప్పనిసరిగా ప్రకటించదు.
theological_decisions:
- issue: పౌలు చెప్పుకున్న నిందలేనితనం యొక్క పరిధి
  choice: ధర్మశాస్త్రంలోని నీతి విషయంగా పౌలు నిందలేనివాడిగా ఉన్నానని చెబుతున్నాడు.
  alternative: దేవుని ఎదుట సంపూర్ణంగా పాపరహితుడినని పౌలు చెబుతున్నాడు.
  rationale: ἄμεμπτος అనే పదం κατὰ δικαιοσύνην τὴν ἐν νόμῳ అనే నిర్దిష్ట ప్రమాణానికి వ్యాకరణపరంగా అనుసంధానమై ఉంది. అందువల్ల వాక్యం సంపూర్ణ నైతిక పరిపూర్ణతకన్నా ధర్మశాస్త్ర సంబంధ అంచనా పరిధిలోని నిందారాహిత్యాన్ని చెబుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. రెండు κατὰ పదబంధాల సమాంతర వాక్య నిర్మాణాన్ని ‘విషయానికొస్తే’ అనే పునరుక్తితో నిలిపాం. మూలపాఠంలో లేని ‘న్యాయం’ ప్రత్యామ్నాయ పాదటిప్పణిని చేర్చలేదు; అందించిన ఆంగ్ల పాదటిప్పణుల గుర్తులు విషయపరంగా మారినట్లు కనిపిస్తున్నందున, ἐν νόμῳ యొక్క అక్షరార్థ ప్రత్యామ్నాయానికే [a] ఇచ్చాం.
