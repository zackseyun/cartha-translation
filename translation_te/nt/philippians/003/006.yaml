revisions:
- from: ఆసక్తి విషయానికొస్తే, సంఘాన్ని హింసించినవాడిని; ధర్మశాస్త్రంలోని[a] నీతి విషయానికొస్తే, నిందలేనివాడిగా ఉన్నాను.
  to: ఉత్సాహం విషయానికి వస్తే, సంఘాన్ని హింసించేవాడిని; ధర్మశాస్త్రంలో ఉన్న[a] నీతి విషయానికి వస్తే, నిందలేనివాడినయ్యాను.
  rationale: ‘ఆసక్తి’ స్థానంలో ‘ఉత్సాహం’ పెట్టడం ద్వారా ζῆλος యొక్క గాఢమైన మతపరమైన ఉత్సాహాన్ని స్పష్టంగా వ్యక్తం చేశాం. ‘నిందలేనివాడినయ్యాను’ ద్వారా γενόμενος యొక్క పూర్తయిన/ఫలితస్థితి భావాన్ని నిలిపాం. నీతి ధర్మశాస్త్రానికి సంబంధించినదనే పరిమితి ప్రధాన వాక్యంలోనే ఉంది; కాబట్టి ఇది సంపూర్ణ పాపరాహిత్యాన్ని సూచించదు.
