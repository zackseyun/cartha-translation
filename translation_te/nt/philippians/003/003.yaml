  text: ఎందుకంటే దేవుని ఆత్మ ద్వారా[a] ఆరాధిస్తూ, మెస్సీయ[b] యేసులో అతిశయిస్తూ, శరీరంలో[c] నమ్మకం ఉంచని మనమే సున్నతి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో, “ఆత్మలో దేవుణ్ణి ఆరాధిస్తూ” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: “మెస్సీయ” అనేది Χριστός (క్రిస్టోస్) అనే బిరుదుకు అనువాదం.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ “శరీరం” అనేది సున్నతి లేదా సామాజిక, మతపరమైన హోదా వంటి శారీరక లేదా మానవ అర్హతలను నమ్మకానికి ఆధారంగా చేసుకోవడాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: περιτομή
  choice: సున్నతి
  rationale: పౌలు ఉద్దేశపూర్వకంగా ఉపయోగించిన స్పష్టమైన నిబంధన-గుర్తింపు పదాన్ని అలాగే ఉంచుతుంది; ‘నిజంగా సున్నతి పొందినవారు’ అని విపులీకరించి మూలంలో లేని పదాన్ని చేర్చదు.
- source_word: πνεύματι θεοῦ
  choice: దేవుని ఆత్మ ద్వారా
  rationale: SBLGNT పాఠంలోని θεοῦ ప్రకారం ఇది దేవుని ఆత్మను సూచిస్తుంది. ‘ద్వారా’ అనే ప్రయోగం ఆరాధనకు ఆత్మ సాధనం లేదా శక్తి అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: λατρεύοντες
  choice: ఆరాధిస్తూ
  rationale: దేవునికి చేసే పవిత్ర సేవ అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καυχώμενοι
  choice: అతిశయిస్తూ
  rationale: మానవ ఆధారాలపై నమ్మకానికి విరుద్ధంగా మెస్సీయ యేసునే గర్వకారణంగా చేసుకోవడం అనే పౌలు వాక్చాతుర్యాన్ని నిలుపుతుంది.
- source_word: Χριστῷ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉన్నందున దాని మెస్సీయ సంబంధ అర్థాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: σαρκί
  choice: శరీరంపై
  rationale: సున్నతి, వంశం, మతపరమైన అర్హతలు వంటి శరీర సంబంధమైన లేదా మానవ ఆధారాలను సూచించే సందర్భార్థాన్ని నిలుపుతూ, దానిని కేవలం ‘పాప స్వభావం’గా పరిమితం చేయదు.
- source_word: πεποιθότες
  choice: నమ్మకం పెట్టుకోని
  rationale: స్థిరంగా ఆధారపడకపోవడం అనే పరిపూర్ణ కృదంత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందరి హెచ్చరికకు ఈ వాక్యం ఇచ్చే వివరణాత్మక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
theological_decisions:
- issue: ఈ వాక్యంలో σάρξ అర్థం
  choice: శరీరం అనేది సున్నతి, వంశం, హోదా వంటి శారీరక లేదా మానవ అర్హతలపై ఆధారపడటాన్ని ప్రధానంగా సూచిస్తుంది
  alternative: అంతర్గత నైతిక శక్తిగా పాప స్వభావం
  rationale: తదుపరి వచనాల్లో పౌలు సున్నతి, జాతి, ధర్మశాస్త్ర ఆచరణ, హోదా వంటి తన మానవ అర్హతలను వరుసగా పేర్కొంటాడు. కాబట్టి ఇక్కడి సందర్భం ‘పాప స్వభావం’కన్నా మానవ గర్వాధారాలను సూచిస్తుంది.
- issue: πνεύματι θεοῦ యొక్క భావం
  choice: దేవుని ఆత్మ ఆరాధనకు సాధనం లేదా కార్యక్షేత్రం
  alternative: మానవ ఆత్మలో ఆరాధించడం లేదా ఆత్మీయంగా దేవుణ్ణి ఆరాధించడం
  rationale: SBLGNTలోని θεοῦ పాఠం ఈ పదబంధాన్ని దేవుని ఆత్మకు సహజంగా అన్వయిస్తుంది; అయినా సాధనం మరియు కార్యక్షేత్రం మధ్య స్వల్ప భావవిస్తృతిని అనువాదం పూర్తిగా మూసివేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. గ్రీకు వాక్యంలోని మూడు సమాంతర కృదంతాలను ‘ఆరాధిస్తూ—అతిశయిస్తూ—నమ్మకం పెట్టుకోని’ రూపాల్లో నిలిపి, చివరలో ‘మనమే సున్నతి’ అనే పౌలు ఉద్దేశపూర్వకమైన బలమైన వాక్యాన్ని ఉంచాం.
