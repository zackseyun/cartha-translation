  source_fidelity: మూలంలోని γάρ యొక్క వివరణాత్మక సంబంధం ‘ఎందుకంటే’తో, πολλοί యొక్క వ్యక్తి-సూచక భావం ‘చాలామంది’తో, మరియు περιπατοῦσιν యొక్క జీవనశైలి రూపకం ‘నడుచుకుంటున్నారు’తో నిలిచాయి. πολλάκις ἔλεγον యొక్క పునరావృత గత భావం ‘చాలాసార్లు చెప్పాను’లో, νῦν δὲ καὶ κλαίων λέγω యొక్క వర్తమాన, భావోద్వేగ ఉద్ఘాటన ‘ఇప్పుడు ఏడుస్తూ కూడా చెబుతున్నాను’లో సరిగ్గా ఉంది. చివరి ‘వారు మెస్సీయ సిలువకు శత్రువులు’ మూలంలోని ఆలస్యంగా వచ్చే ἐχθρούς ఉద్ఘాటనను సహజమైన తెలుగులో సమర్థంగా తెలియజేస్తుంది.
