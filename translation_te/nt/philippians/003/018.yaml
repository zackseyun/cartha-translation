  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ περιπατοῦσιν οὓς πολλάκις ἔλεγον ὑμῖν, νῦν δὲ καὶ κλαίων λέγω, τοὺς ἐχθροὺς τοῦ σταυροῦ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/018.yaml
  text: For many walk[a], whom I often told you about, and now even weeping I say, are enemies of the cross of Messiah,
translation:
  language: te
  text: ఎందుకంటే, చాలామంది నడుచుకుంటున్నారు[a]—వారి గురించి నేను మీకు చాలాసార్లు చెప్పాను; ఇప్పుడు ఏడుస్తూ కూడా చెబుతున్నాను—వారు మెస్సీయ సిలువకు శత్రువులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘నడుచుకోవడం’ అంటే జీవించడం లేదా ప్రవర్తించడం.
    reason: రూపకార్థ వివరణ
lexical_decisions:
- source_word: πολλοὶ
  choice: చాలామంది
  rationale: వ్యక్తులను సూచించే నామవాచక ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న ఉపదేశానికి ఈ వాక్యం కారణం లేదా వివరణ ఇస్తున్న సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: περιπατοῦσιν
  choice: నడుచుకుంటున్నారు
  rationale: పౌలు ఉపయోగించిన ‘నడవడం’ అనే జీవనశైలి రూపకాన్ని నిలుపుతుంది; ఇక్కడ అది ప్రవర్తన లేదా జీవన విధానాన్ని సూచిస్తుందని పాదటిప్పణి వివరిస్తుంది.
- source_word: πολλάκις ἔλεγον ὑμῖν
  choice: నేను మీకు చాలాసార్లు చెప్పాను
  rationale: πολλάκις తో కూడిన అసంపూర్ణ భూతకాల క్రియలోని పునరావృత గత చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: νῦν δὲ καὶ κλαίων λέγω
  choice: ఇప్పుడు ఏడుస్తూ కూడా చెబుతున్నాను
  rationale: మాట్లాడుతున్న సమయంలోనే పౌలు ఏడుస్తున్నాడనే వర్తమాన కృదంత భావాన్ని, καί ఇచ్చే ‘కూడా’ అనే ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἐχθροὺς
  choice: శత్రువులు
  rationale: తీవ్రమైన వ్యతిరేకతను మూలపదానికి సమానమైన బలంతో తెలియజేస్తుంది.
- source_word: τοῦ σταυροῦ
  choice: సిలువకు
  rationale: ఇక్కడ సిలువ యేసు మరణాన్ని, దాని సువార్త సంబంధమైన ప్రాముఖ్యతను సూచిస్తుంది; ‘సిలువ’ ప్రామాణిక ప్రత్యక్ష పదం.
- source_word: τοῦ Χριστοῦ
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός బిరుదుగా పనిచేస్తున్నందున దాని ‘అభిషిక్తుడు/మెస్సీయ’ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: τοῦ Χριστοῦ ను సంప్రదాయ రూపమైన ‘క్రీస్తు’గా లేదా బిరుదు భావాన్ని తెలిపే ‘మెస్సీయ’గా అనువదించడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός వ్యక్తినామంలా తప్పనిసరిగా పనిచేయదు; బిరుదుగా సహజంగా చదవబడుతుంది. అందువల్ల అర్థాన్ని అనువదించే ‘మెస్సీయ’ను ఎంచుకున్నాం.
- issue: ‘సిలువకు శత్రువులు’ అనే మాటను వారి ఉద్దేశంగా లేదా కేవలం ప్రవర్తన ఫలితంగా విప్పి చెప్పడం
  choice: మూలంలోని బలమైన, వివరణ ఇవ్వని వర్ణనను అలాగే ఉంచడం
  alternative: సిలువ సందేశాన్ని ఉద్దేశపూర్వకంగా ఎదిరించేవారు అని విప్పి చెప్పడం
  rationale: మూలపాఠం వారు ఏ విధంగా లేదా ఏ ఉద్దేశంతో శత్రువులయ్యారో నిర్దిష్టంగా చెప్పదు; ఆ ధార్మిక ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం. మూలంలోని మధ్యలో చొప్పించిన సంబంధ వాక్యాన్ని డాష్‌లతో నిలిపి, చివరలో వచ్చే ‘శత్రువులు’ అనే ఉద్ఘాటనను కాపాడాం.
