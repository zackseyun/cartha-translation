source:
  edition: SBLGNT
  text: περιτομῇ ὀκταήμερος, ἐκ γένους Ἰσραήλ, φυλῆς Βενιαμίν, Ἑβραῖος ἐξ Ἑβραίων, κατὰ νόμον Φαρισαῖος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/005.yaml
  text: circumcised on the eighth day, from the people of Israel, of the tribe of Benjamin, a Hebrew from Hebrews; according to the law, a Pharisee,
translation:
  language: te
  text: ఎనిమిదవ రోజున సున్నతి పొందినవాడిని; ఇశ్రాయేలు సంతతికి చెందినవాడిని; బెన్యామీను గోత్రానికి చెందినవాడిని; హెబ్రీయుల నుండి వచ్చిన హెబ్రీయుడిని[a]; ధర్మశాస్త్రం విషయానికొస్తే పరిసయ్యుడిని.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హెబ్రీయులకు పుట్టిన హెబ్రీయుడిని”; ఇది పౌలు హెబ్రీయ పూర్వీకత్వాన్ని, గుర్తింపును నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομῇ ὀκταήμερος
  choice: ఎనిమిదవ రోజున సున్నతి పొందినవాడిని
  rationale: గ్రీకులోని సంక్షిప్త ప్రయోగాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, యూదుల నిబంధన గుర్తైన సున్నతిని మరియు దాని సమయాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐκ γένους Ἰσραήλ
  choice: ఇశ్రాయేలు సంతతికి చెందినవాడిని
  rationale: γένος ఇక్కడ జాతి లేదా పూర్వీకుల వంశసంబంధాన్ని సూచిస్తుంది; ‘సంతతి’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: φυλῆς Βενιαμίν
  choice: బెన్యామీను గోత్రానికి చెందినవాడిని
  rationale: ఈ సంబంధ విభక్తి పదబంధం పౌలు గోత్ర వంశాన్ని గుర్తిస్తుంది; ‘గోత్రం’ φυλήకు స్థిరమైన, స్పష్టమైన తెలుగు పదం.
- source_word: Ἑβραῖος ἐξ Ἑβραίων
  choice: హెబ్రీయులలోనుండి వచ్చిన హెబ్రీయుడిని
  rationale: ἐξ అనే మూలం/ఉద్భవ భావాన్ని నిలుపుతూ, పౌలు హెబ్రీయ పూర్వీకత్వం మరియు గుర్తింపును నొక్కిచెప్పే గ్రీకు పదబంధంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు కాపాడుతుంది.
- source_word: κατὰ νόμον
  choice: ధర్మశాస్త్రం విషయానికొస్తే
  rationale: κατά ఇక్కడ ఒక ప్రమాణం లేదా సంబంధిత అంశాన్ని పరిచయం చేస్తుంది. ఈ తెలుగు ప్రయోగం తరువాతి ‘పరిసయ్యుడు’ అనే గుర్తింపుతో సహజంగా అనుసంధానమవుతుంది.
- source_word: Φαρισαῖος
  choice: పరిసయ్యుడిని
  rationale: యూద మతవర్గాన్ని సూచించే పేరుకు తెలుగులో స్థిరపడిన రూపాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: Ἑβραῖος ἐξ Ἑβραίων అనే పదబంధం పూర్వీకత్వాన్నా, భాషా-సాంస్కృతిక గుర్తింపునా, లేక రెండింటినీ సూచిస్తుందా
  choice: హెబ్రీయులలోనుండి వచ్చిన హెబ్రీయుడిని
  alternative: హెబ్రీయులకు పుట్టిన హెబ్రీయుడిని
  rationale: ముఖ్య పాఠం గ్రీకు పదబంధంలోని మూలం/ఉద్భవ భావాన్ని ఉంచి, దానిని కేవలం జన్మ లేదా తల్లిదండ్రుల వంశానికే పరిమితం చేయదు; మరింత స్పష్టమైన వంశార్థాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకులోని వరుస స్వీయవివరణలను తెలుగులో స్పష్టంగా చూపేందుకు అర్ధవిరామాలు వాడబడ్డాయి; వాక్యం సందర్భానుసారం జాబితా రూపాన్ని నిలుపుకుంది.
