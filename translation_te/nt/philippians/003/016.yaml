  naturalness: The sentence is clear and modern, but “దానికి అనుగుణంగా నడుచుకుందాం” is more idiomatic for a continuing communal exhortation and better carries the verbal metaphor.
  terminology: “స్థాయి” appropriately renders the figurative point of progress. “అయితే” is a suitable concise rendering of πλήν in this corrective transition. The footnote appropriately identifies interpretive renderings that make the implicit standard explicit.
