id: PHP.3.16
reference: Philippians 3:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πλὴν εἰς ὃ ἐφθάσαμεν, τῷ αὐτῷ ⸀στοιχεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/016.yaml
  text: Only[a], let us keep in step with what we have attained.
translation:
  language: te
  text: అయితే, మనం ఏ స్థాయికి చేరుకున్నామో, దానికి అనుగుణంగా నడుచుకుందాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “అదే నియమం ప్రకారం నడుద్దాం”; “అదే ప్రమాణాన్ని పాటిద్దాం.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πλήν
  choice: అయితే
  rationale: ఇక్కడ ఈ పదం మినహాయింపును కాక, ముందున్న ఆలోచనను పరిమితం చేస్తూ ఆచరణాత్మక ప్రబోధానికి మళ్లించే సంధిగా పనిచేస్తుంది.
- source_word: εἰς ὃ
  choice: ఏ స్థాయికి
  rationale: ఇప్పటికే చేరుకున్న స్థాయి లేదా బిందువును సూచిస్తుంది; తెలుగులో ఇది సహజంగా, స్పష్టంగా అర్థమవుతుంది.
- source_word: ἐφθάσαμεν
  choice: చేరుకున్నామో
  rationale: ఇప్పటివరకు సాధించిన పురోగతి స్థాయిని సూచిస్తుంది; మూలంలోని ‘చేరడం’ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: τῷ αὐτῷ
  choice: దానికి అనుగుణంగా
  rationale: గ్రీకు పాఠంలో నియమం లేదా ప్రమాణం అనే నామవాచకం స్పష్టంగా లేదు. ఇప్పటికే చేరుకున్నదానితో సరిపోలే నడవడిని ఈ పదబంధం సహజంగా తెలియజేస్తుంది.
- source_word: στοιχεῖν
  choice: అడుగులు వేద్దాం
  rationale: వరుసలో లేదా ఒక ప్రమాణానికి అనుగుణంగా నడిచే రూపకాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజమైన సమూహ ప్రబోధంగా ఉంటుంది.
theological_decisions:
- issue: τῷ αὐτῷతో ‘నియమం’ లేదా ‘ప్రమాణం’ వంటి నామవాచకాన్ని స్పష్టంగా చేర్చాలా?
  choice: ప్రధాన పాఠంలో అలాంటి నామవాచకాన్ని చేర్చకుండా, ‘దానికి అనుగుణంగా అడుగులు వేద్దాం’ అని అనువదించడం.
  alternative: ‘అదే నియమం ప్రకారం నడుద్దాం’ లేదా ‘అదే ప్రమాణాన్ని పాటిద్దాం.’
  rationale: SBLGNTలోని సంక్షిప్త పాఠం ప్రమాణాన్ని అంతర్లీనంగా ఉంచుతుంది. ప్రధాన పాఠంలో నామవాచకాన్ని చేర్చడం మూలం కంటే భావాన్ని ఎక్కువగా నిర్దిష్టం చేస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచడం పాఠభేదం/వ్యాఖ్యాన సంప్రదాయాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సామాన్య పాఠకులకు సులభంగా ఉండేలా రూపొందించబడింది. ‘అడుగులు వేద్దాం’ అనే ప్రయోగం στοιχεῖνలోని నడక/వరుస రూపకాన్ని నిలుపుతుంది.
