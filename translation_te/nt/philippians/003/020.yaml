id: PHP.3.20
reference: Philippians 3:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡμῶν γὰρ τὸ πολίτευμα ἐν οὐρανοῖς ὑπάρχει, ἐξ οὗ καὶ σωτῆρα ἀπεκδεχόμεθα κύριον Ἰησοῦν Χριστόν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/020.yaml
  text: For our citizenship is in heaven[a], from where we also eagerly await a Savior[d][c][b], the Lord Jesus the Messiah.
translation:
  language: te
  text: ఎందుకంటే మన పౌరసత్వం[a] పరలోకంలో[b] ఉంది; అక్కడి నుండి రక్షకునిగా ప్రభువైన యేసు మెస్సీయను[c] మనం కూడా ఎంతో ఆశతో ఎదురుచూస్తున్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మన పౌర సముదాయం.”
    reason: πολίτευμα అనే పదానికి పౌర హోదాతో పాటు పౌర సమాజం లేదా రాజ్య సముదాయం అనే భావం కూడా ఉండవచ్చు.
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా “పరలోకాలలో.”
    reason: మూలపాఠంలో οὐρανοῖς బహువచన రూపంలో ఉంది; సహజమైన తెలుగు కోసం ప్రధాన పాఠ్యంలో ఏకవచనం వాడబడింది.
  - marker: c
    text: లేదా “క్రీస్తు.”
    reason: Χριστός అంటే ‘మెస్సీయ’; సంప్రదాయ తెలుగు రూపం ‘క్రీస్తు’ కూడా విస్తృతంగా వాడుకలో ఉంది.
lexical_decisions:
- source_word: πολίτευμα
  choice: పౌరసత్వం
  rationale: ఈ పదంలోని పౌర, రాజ్యసంబంధ భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; సందర్భంలో భూసంబంధమైన మనస్తత్వానికి విరుద్ధంగా విశ్వాసుల నిజమైన పౌర అనుబంధాన్ని సూచిస్తుంది.
- source_word: ἐν οὐρανοῖς
  choice: పరలోకంలో
  rationale: గ్రీకులో బహువచన రూపం ఉన్నప్పటికీ, సూచించబడిన దివ్య లోకాన్ని ఆధునిక తెలుగులో సహజంగా ఏకవచన రూపంతో వ్యక్తం చేస్తారు.
- source_word: ὑπάρχει
  choice: ఉంది
  rationale: నిజమైన ప్రస్తుత ఉనికిని తెలుగులో సహజంగా, నేరుగా తెలియజేస్తుంది.
- source_word: ἐξ οὗ
  choice: అక్కడి నుంచే
  rationale: ఇది ముందున్న పరలోకాన్ని సూచిస్తూ రక్షకుడు వచ్చే స్థలాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘నుంచే’ మూలంలోని సంబంధాన్ని బలంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: σωτῆρα
  choice: రక్షకుడైన
  rationale: రక్షణనిచ్చే వ్యక్తి అనే క్రీస్తుసంబంధమైన భావాన్ని కాపాడుతుంది; తరువాతి నామపదబంధంతో తెలుగులో సహజమైన అన్వయాన్ని ఏర్పరుస్తుంది.
- source_word: ἀπεκδεχόμεθα
  choice: ఎంతో ఆశతో ఎదురుచూస్తున్నాం
  rationale: కొనసాగుతున్న, ఆత్రుతతో కూడిన నిరీక్షణను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: κύριον
  choice: ప్రభువు
  rationale: కొత్త నిబంధనలో యేసుకు వర్తించే ఈ బిరుదుకు గౌరవప్రదమైన, ప్రామాణిక తెలుగు రూపం.
- source_word: Χριστόν
  choice: మెస్సీయ
  rationale: ఇక్కడ పదం యేసు పేరుతో ఉన్నప్పటికీ, ఎదురుచూస్తున్న అంత్యకాల రక్షకుని బిరుదుగా తన భావబలాన్ని నిలుపుకుంటుంది.
theological_decisions:
- issue: κύριον Ἰησοῦν Χριστόν అనే క్రీస్తుసంబంధ బిరుదుల సముదాయంలో Χριστόν అనువాదం
  choice: ప్రభువు యేసు మెస్సీయ
  alternative: ప్రభువు యేసు క్రీస్తు
  rationale: Χριστός ఇక్కడ కేవలం పేరులో భాగంగా కాక, దేవుడు అభిషేకించిన రక్షకుడనే బిరుదు భావంతో పనిచేస్తుంది. ‘మెస్సీయ’ ఆ భావాన్ని ప్రధాన పాఠ్యంలో వెల్లడిస్తుండగా, సంప్రదాయ ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో ఉంచడం వల్ల రెండు సాధ్యమైన గ్రహింపులూ కనిపిస్తాయి.
- issue: πολίτευμα యొక్క వ్యక్తిగత లేదా సామూహిక పౌర భావం
  choice: పౌరసత్వం
  alternative: పౌర సమాజం / రాజ్య సముదాయం
  rationale: ఈ నామవాచకం పౌర హోదా లేదా పౌర సముదాయం రెండింటినీ సూచించగలదు. సందర్భంలో వ్యక్తుల పౌర అనుబంధం ప్రధానంగా కనిపించినా, సామూహిక భావాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. సెమీకోలన్ వాక్యంలోని కారణ ప్రకటనను, పరలోకం నుంచి రక్షకుని నిరీక్షణను స్పష్టంగా అనుసంధానిస్తుంది. మూలంలోని καὶ భావాన్ని ‘కూడా’తో నిలిపాం.
