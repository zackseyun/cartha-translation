id: PHP.3.19
reference: Philippians 3:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὧν τὸ τέλος ἀπώλεια, ὧν ὁ θεὸς ἡ κοιλία καὶ ἡ δόξα ἐν τῇ αἰσχύνῃ αὐτῶν, οἱ τὰ ἐπίγεια φρονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/019.yaml
  text: Their end is destruction[a], their god is the belly[b], and their glory is in their shame—their minds are set on earthly things.
translation:
  language: te
  text: వారి అంతం నాశనం; వారి దేవుడు వారి కడుపు[a]; వారి సిగ్గులోనే వారి మహిమ ఉంది. వారు భూసంబంధమైన వాటిపైన మనసు పెడతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి ఆకలే వారి దేవుడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: అంతం
  rationale: గ్రీకు పదంలోని ముగింపు, తుదిఫలితం అనే రెండింటి భావసాధ్యతను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἀπώλεια
  choice: నాశనం
  rationale: తీవ్రమైన తుదివినాశ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κοιλία
  choice: కడుపు
  rationale: అమూర్తమైన ‘ఆకలి/కోరిక’ అని వివరణాత్మకంగా మార్చకుండా గ్రీకులోని స్పష్టమైన శరీర రూపకాన్ని నిలుపుతుంది.
- source_word: δόξα
  choice: మహిమ
  rationale: సిగ్గుకరమైన దానినే విలువైనదిగా భావించడంలోని వ్యంగ్యాన్ని నిలుపుతుంది.
- source_word: αἰσχύνη
  choice: సిగ్గుపడవలసిన దాని
  rationale: తెలుగులో ‘వారి మహిమ వారి సిగ్గులో ఉంది’ అనే అసహజ నిర్మాణాన్ని నివారిస్తూ, అవమానం మరియు నైతిక సిగ్గు భావాలను తెలియజేస్తుంది.
- source_word: τὰ ἐπίγεια
  choice: భూసంబంధమైన వాటి
  rationale: భూమికి చెందిన విషయాలు అనే గ్రీకు నపుంసక బహువచన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: φρονοῦντες
  choice: మనసు పెడతారు
  rationale: కేవలం అప్పుడప్పుడు ఆలోచించడాన్ని కాక, కొనసాగుతున్న మానసిక ధోరణిని వ్యక్తం చేస్తుంది.
- source_word: ὧν ... ὧν
  choice: వారి ... వారి
  rationale: మునుపటి వచనంలోని వ్యక్తులను సూచించే పునరుక్త సంబంధ సర్వనామాన్ని తెలుగులో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ‘వారి దేవుడు కడుపు’ అనే రూపకం
  choice: ప్రధాన పాఠ్యంలో ‘వారి దేవుడు వారి కడుపు’ అని స్పష్టమైన రూపకాన్ని నిలిపాం.
  alternative: వారి ఆకలే/శరీర కోరికలే వారి దేవుడు
  rationale: ఈ రూపకం నీచమైన కోరికలు లేదా ఇంద్రియాసక్తిని సూచించవచ్చు; అయితే దాన్ని ఒకే వ్యాఖ్యానానికి పరిమితం చేయకుండా పౌలు వాడిన బలమైన చిత్రాన్ని నిలుపడం సముచితం.
- issue: ‘వారి మహిమ వారి సిగ్గులో’ అనే వ్యంగ్య నిర్మాణం
  choice: ‘వారు సిగ్గుపడవలసిన దానిలోనే తమ మహిమను చూసుకుంటారు’
  alternative: వారి మహిమ వారి సిగ్గులోనే ఉంది
  rationale: గ్రీకు వాక్యంలోని వ్యంగ్యమైన theological tension‌ను నిలుపుతూ ఆధునిక తెలుగులో అర్థవంతంగా చేశాం; ‘గర్విస్తారు’ అని మార్చి δόξα భావాన్ని పూర్తిగా కుదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని వరుస తీర్పులను సెమికోలన్లతో నిలిపి, చివరి participial clause‌ను స్వతంత్ర సహజ వాక్యంగా ఇచ్చాం.
