review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the verse’s repeated characterization: τέλος as “అంతం,” ἀπώλεια as “నాశనం,” and κοιλία as the concrete “కడుపు.” The footnote appropriately supplies “ఆకలి” as a lexical alternative without replacing the metaphor. A small revision better preserves the Greek nominal expression “their glory [is] in their shame” and avoids adding exclusive emphasis (“-నే”) to the final clause, which is not explicit in τὰ ἐπίγεια φρονοῦντες.'
  naturalness: The Telugu is clear and suitably serious in modern standard usage. “వారి సిగ్గులోనే వారి మహిమ ఉంది” is a direct, intelligible rendering of the Greek irony. “భూసంబంధమైన వాటిపైన మనసు పెడతారు” naturally conveys a settled mental orientation.
  terminology: “మహిమ” suitably retains the δόξα/glory wording and its irony; “సిగ్గు” directly reflects αἰσχύνη. “కడుపు” maintains the concrete metaphor, while the footnote’s “ఆకలి” identifies the permissible figurative alternative. “భూసంబంధమైన వాటి” and “మనసు పెడతారు” are appropriate for earthly things and ongoing orientation.
  issues:
  - severity: low
    issue: The clause “వారు సిగ్గుపడవలసిన దానిలోనే తమ మహిమను చూసుకుంటారు” slightly explicates and recasts the Greek nominal statement.
    rationale: Greek states compactly that “their glory [is] in their shame.” The revision retains the irony and ambiguity without specifying that the shame is necessarily something they ought to be ashamed of or recasting glory as an act of viewing.
  - severity: low
    issue: The final “వాటిపైనే” adds an exclusive nuance.
    rationale: The Greek says that they are oriented toward earthly things, but does not explicitly say “on earthly things alone.” Removing “-నే” is closer while retaining natural Telugu.
  revised_text: వారి అంతం నాశనం; వారి దేవుడు వారి కడుపు[a]; వారి సిగ్గులోనే వారి మహిమ ఉంది. వారు భూసంబంధమైన వాటిపైన మనసు పెడతారు.
  revised_footnotes:
  - marker: a
    text: లేదా, “వారి ఆకలే వారి దేవుడు.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek’s concise series of judgments, especially the ironic nominal predicate concerning glory and shame. It also removes an unmarked exclusivity in the final clause. No doctrinal interpretation is introduced, and the belly metaphor remains in the main text.
