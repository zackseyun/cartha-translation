id: PHP.3.17
reference: Philippians 3:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Συμμιμηταί μου γίνεσθε, ἀδελφοί, καὶ σκοπεῖτε τοὺς οὕτω περιπατοῦντας καθὼς ἔχετε τύπον ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/017.yaml
  text: Brothers[a], join in imitating me, and keep your eyes on those who walk this way[b], just as you have us as a pattern.
translation:
  language: te
  text: సోదరులారా[a], మీరంతా కలిసి నన్ను అనుకరించండి. మేము మీకు మాదిరిగా[b] ఉన్నట్లే, ఈ విధంగా నడుచుకునేవారిని జాగ్రత్తగా గమనించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సోదర సోదరీమణులారా”; గ్రీకులోని రూపం పుంలింగ బహువచనమైనప్పటికీ, పౌలు బహుశా సంఘమంతటినీ ఉద్దేశించి మాట్లాడుతున్నాడు.
    reason: cultural_note
  - marker: b
    text: లేదా, “ఉదాహరణగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Συμμιμηταί μου γίνεσθε
  choice: మీరంతా కలిసి నన్ను అనుకరించేవారిగా ఉండండి
  rationale: Συμμιμηταί అనే నామవాచకంలోని సామూహిక అనుకరణ భావాన్ని ‘మీరంతా కలిసి’ తెలియజేస్తుంది; γίνεσθε యొక్క ఆజ్ఞార్థక బలాన్ని ‘ఉండండి’ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పుంలింగ బహువచన సంబోధన. ప్రధాన పాఠంలో దాని రూపాన్ని నిలిపి, సంఘమంతటికీ వర్తించే సంభావ్య భావాన్ని పాదసూచికలో స్పష్టం చేశాం.
- source_word: σκοπεῖτε
  choice: జాగ్రత్తగా గమనించండి
  rationale: ఈ క్రియ శ్రద్ధగా దృష్టి పెట్టడం, గమనిస్తూ ఉండడం అనే భావాన్ని ఇస్తుంది. ‘జాగ్రత్తగా గమనించండి’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὕτω περιπατοῦντας
  choice: ఈ విధంగా నడుచుకునేవారిని
  rationale: περιπατέωలోని ‘నడవడం’ అనే రూపకాన్ని నిలుపుతూ, ఇక్కడ అది జీవన ప్రవర్తనను సూచిస్తుందని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τύπον
  choice: మాదిరిగా
  rationale: ఇక్కడ τύπος అనుసరించదగిన నమూనా లేదా ఉదాహరణను సూచిస్తుంది. ‘మాదిరి’ సాధారణ పాఠకులకు సహజంగా ఉండి ఆ భావాన్ని నిలుపుతుంది.
- source_word: ἡμᾶς
  choice: మేము
  rationale: మూలంలోని బహువచన సర్వనామాన్ని ఏకవచనంగా మార్చకుండా నిలిపాం; పౌలు తనతోపాటు తన సహచరులను కూడా చేర్చుతున్నాడు.
theological_decisions:
- issue: ἀδελφοί యొక్క సమగ్ర సంబోధన భావం
  choice: ప్రధాన పాఠంలో ‘సోదరులారా’ అని ఉంచి, మొత్తం సంఘాన్ని ఉద్దేశించి ఉండవచ్చని పాదసూచికలో తెలియజేయడం
  alternative: ప్రధాన పాఠంలోనే ‘సోదర సోదరీమణులారా’ అని అనువదించడం
  rationale: గ్రీకు రూపం పుంలింగ బహువచనం; అయితే సందర్భంలో ఈ సంబోధన స్త్రీపురుషులందరితో కూడిన సంఘానికి వర్తించే అవకాశం ఉంది. పాదసూచిక ఈ రెండింటినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘నడుచుకోవడం’ అనే పౌలు ఉపయోగించిన జీవన రూపకం నిలుపబడింది; సామూహిక అనుకరణ భావం ‘మీరంతా కలిసి’ ద్వారా స్పష్టమైంది.
