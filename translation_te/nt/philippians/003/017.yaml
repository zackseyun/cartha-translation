review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the shared force of Συμμιμηταί, the imperative, the plural ἡμᾶς, and the command to observe people whose manner of life accords with the apostolic pattern. The relation expressed by καθὼς ἔχετε τύπον ἡμᾶς is retained more clearly by making ‘we are an example to you’ the natural Telugu comparison clause.
  naturalness: ‘మీరంతా కలిసి నన్ను అనుకరించేవారిగా ఉండండి’ is understandable but unnecessarily cumbersome in modern Telugu. ‘మీరంతా కలిసి నన్ను అనుకరించండి’ is direct and natural. The original word order ‘మీకు మేము మాదిరిగా’ is awkward; ‘మేము మీకు మాదిరిగా’ is idiomatic.
  terminology: ‘సోదరులారా,’ ‘అనుకరించండి,’ ‘జాగ్రత్తగా గమనించండి,’ ‘నడుచుకునేవారు,’ and ‘మాదిరి’ are suitable modern-standard Telugu choices. The inclusive-congregational footnote for ἀδελφοί and lexical alternative for τύπος are appropriate.
  issues:
  - severity: low
    issue: Cumbersome rendering of the opening imperative
    rationale: The phrase ‘అనుకరించేవారిగా ఉండండి’ is more literal in form but less natural than a direct Telugu imperative; the collective sense is already conveyed by ‘మీరంతా కలిసి.’
  - severity: low
    issue: Awkward order in the pattern clause
    rationale: ‘మీకు మేము మాదిరిగా ఉన్నట్లే’ is understandable, but ‘మేము మీకు మాదిరిగా ఉన్నట్లే’ is the normal Telugu order and more clearly conveys that Paul and his associates are the pattern.
  revised_text: సోదరులారా[a], మీరంతా కలిసి నన్ను అనుకరించండి. మేము మీకు మాదిరిగా[b] ఉన్నట్లే, ఈ విధంగా నడుచుకునేవారిని జాగ్రత్తగా గమనించండి.
