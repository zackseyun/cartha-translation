- from: సోదరులారా[a], మీరంతా కలిసి నన్ను అనుకరించేవారిగా ఉండండి. మీకు మేము మాదిరిగా[b] ఉన్నట్లే, ఈ విధంగా నడుచుకునేవారిని జాగ్రత్తగా గమనించండి.
  to: సోదరులారా[a], మీరంతా కలిసి నన్ను అనుకరించండి. మేము మీకు మాదిరిగా[b] ఉన్నట్లే, ఈ విధంగా నడుచుకునేవారిని జాగ్రత్తగా గమనించండి.
