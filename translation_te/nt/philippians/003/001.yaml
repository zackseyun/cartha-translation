- from: ఇక మీదట[a], నా సహోదరులారా[b], ప్రభువులో ఆనందించండి. అవే విషయాలను మీకు రాయడం నాకు ఇబ్బందికరం కాదు[c]; అది మీకు భద్రమైనది[d].
  to: చివరగా[a], నా సహోదరులారా[b], ప్రభువులో ఆనందించండి. అదే విషయాలను మీకు రాయడం నాకు ఇబ్బందికరం కాదు[c]; అది మీకు క్షేమకరం[d].
  rationale: The revision uses “చివరగా” for the primary discourse-transition sense of Τὸ λοιπόν while preserving other defensible senses in the footnote. It also replaces the less idiomatic predicate “మీకు భద్రమైనది” with “మీకు క్షేమకరం,” which conveys ἀσφαλές naturally and without theological or interpretive expansion. All anchors are retained and the remaining wording continues to preserve the source's ambiguity and register.
