id: PHP.3.1
reference: Philippians 3:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί μου, χαίρετε ἐν κυρίῳ. τὰ αὐτὰ γράφειν ὑμῖν ἐμοὶ μὲν οὐκ ὀκνηρόν, ὑμῖν δὲ ἀσφαλές.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/001.yaml
  text: Finally[a], my brothers, rejoice in the Lord. To write the same things to you is not troublesome for me[d][c][b], and is safe for you.
translation:
  language: te
  text: చివరగా[a], నా సహోదరులారా[b], ప్రభువులో ఆనందించండి. అదే విషయాలను మీకు రాయడం నాకు ఇబ్బందికరం కాదు[c]; అది మీకు క్షేమకరం[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇక మిగిలిన విషయాలకు వస్తే” లేదా “ఇక మీదట.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “సహోదరులు” అనే సంబోధన సంఘమంతటినీ, అంటే సహోదరులనూ సహోదరీలనూ ఉద్దేశిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా “నాకు భారమైనది కాదు” లేదా “నాకు విసుగు కలిగించదు.”
    reason: lexical_alternative
  - marker: d
    text: లేదా “అది మీకు రక్షణగా ఉంటుంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: ఇక మీదట
  rationale: ఇది ప్రసంగంలో తదుపరి అంశానికి మార్పును సూచించే పదబంధం. ఉత్తరానికి ముగింపు వచ్చిందని తప్పనిసరిగా సూచించకుండా, ‘ఇక మీదట’ అనే సహజమైన ఆధునిక తెలుగు రూపం గ్రీకు పదబంధంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: ἀδελφοί μου
  choice: నా సహోదరులారా
  rationale: గ్రీకులోని పుంలింగ బహువచన సంబోధనను ప్రధాన పాఠంలో నేరుగా నిలిపి, సంఘమంతటికీ వర్తించే సమ్మిళిత భావాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: χαίρετε
  choice: ఆనందించండి
  rationale: బహువచన ఆజ్ఞార్థక రూపంలోని ప్రోత్సాహక బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: ఆనందం ప్రభువుతో ఉన్న సంబంధంలో నెలకొన్నదనే పౌలు వాడిన వేదాంతపరమైన నిర్మాణాన్ని నేరుగా నిలుపుతుంది.
- source_word: τὰ αὐτά
  choice: అవే విషయాలను
  rationale: దేనిని తిరిగి ప్రస్తావిస్తున్నాడో స్పష్టీకరించకుండా, గ్రీకు మూలంలోని విస్తృతమైన సూచనను అలాగే ఉంచుతుంది.
- source_word: γράφειν
  choice: రాయడం
  rationale: గ్రీకు క్రియారూపాన్ని ఈ తెలుగు వాక్య నిర్మాణంలో సహజమైన క్రియానామంగా అందిస్తుంది.
- source_word: οὐκ ὀκνηρόν
  choice: నాకు ఇబ్బందికరం కాదు
  rationale: అదే విషయాలు రాయడం పౌలుకు భారమో వెనుకంజ వేయించే పనో కాదనే భావాన్ని, కేవలం విసుగుకు పరిమితం చేయకుండా తెలియజేస్తుంది.
- source_word: ἀσφαλές
  choice: మీకు భద్రమైనది
  rationale: ‘భద్రమైనది’ అనే విశేషణ రూపం మూలంలోని భద్రత లేదా సురక్షితత్వ భావాన్ని అదనపు రూపకం లేకుండా నిలుపుతుంది.
theological_decisions:
- issue: సంఘాన్ని ఉద్దేశించిన లింగసూచక సంబోధన
  choice: నా సహోదరులారా
  alternative: నా సహోదర సహోదరీలారా
  rationale: గ్రీకు రూపం వ్యాకరణపరంగా పుంలింగ బహువచనం కాబట్టి ప్రధాన పాఠంలో దాన్ని నిలిపాం; అయితే సంబోధన సంఘంలోని విశ్వాసులందరికీ వర్తిస్తుందనే విషయాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
- issue: పౌలు మళ్లీ రాయడం కలిగించే రక్షణాత్మక ప్రయోజనం
  choice: మీకు భద్రమైనది
  alternative: మీకు రక్షణగా ఉంటుంది
  rationale: ప్రధాన పాఠం ἀσφαλές అనే విశేషణపు నేర భావాన్ని నిలుపుతుంది; మరింత రూపకాత్మకమైన ‘రక్షణగా’ అనే భావాన్ని ప్రత్యామ్నాయంగా పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. సంబోధనలో ‘సహోదరులారా,’ ఆజ్ఞలో గౌరవ బహువచనమైన ‘ఆనందించండి’ వాడాం. మూలంలోని రెండు వాక్యభాగాల తార్కిక వ్యత్యాసాన్ని అర్థవిరామంతో స్పష్టంగా చూపించాం.
