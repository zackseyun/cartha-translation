id: PHP.3.4
reference: Philippians 3:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καίπερ ἐγὼ ἔχων πεποίθησιν καὶ ἐν σαρκί. Εἴ τις δοκεῖ ἄλλος πεποιθέναι ἐν σαρκί, ἐγὼ μᾶλλον·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/004.yaml
  text: Though I myself have confidence even in the flesh. If anyone else thinks he has confidence in the flesh[a], I have more.
translation:
  language: te
  text: అయినప్పటికీ, నాకు శరీరంలోనూ నమ్మకం ఉంది. మరెవరైనా శరీరంలో నమ్మకం ఉంచుకున్నానని[a] అనుకుంటే, నాకైతే ఇంకా ఎక్కువ ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “శరీరంలో.” ఇక్కడ సందర్భాన్ని బట్టి ఇది పాప స్వభావాన్ని కాకుండా మానవ అర్హతలు, వంశం, మతపరమైన హోదా, బాహ్య సాధనలు వంటి వాటిపై ఆధారపడిన నమ్మకాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  choice: అయినప్పటికీ
  rationale: వాక్యారంభంలోని concessive భావాన్ని సహజమైన ఆధునిక తెలుగులో బలంగా వ్యక్తపరుస్తుంది.
- source_word: ἔχων πεποίθησιν
  choice: నేను ... నమ్మకం పెట్టుకోగలను
  rationale: పౌలుకు అలాంటి నమ్మకానికి ఆధారాలు ఉన్నాయనే సందర్భార్థాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; గ్రీకు వర్తమాన స్థితిని సామర్థ్యంగా అతిగా మార్చకుండా సందర్భంలోని వాదనను మోస్తుంది.
- source_word: ἐν σαρκί
  choice: శరీర సంబంధమైన వాటిలో
  rationale: ‘శరీరంలో’ అనే కఠిన పదానువాదం తెలుగులో అస్పష్టంగా ఉండవచ్చు. వెంట వచ్చే వంశం, సున్నతి, ధర్మశాస్త్రాచరణ వంటి బాహ్య మానవ ఆధారాలను సూచించేలా మూలపదమైన ‘శరీరం’ను నిలుపుతుంది.
- source_word: δοκεῖ
  choice: అనుకుంటే
  rationale: ఇక్కడ తనకు అలాంటి నమ్మకం ఉందని ఎవరైనా భావించడాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: μᾶλλον
  choice: అంతకంటే ఎక్కువగా
  rationale: పౌలు చేస్తున్న సంక్షిప్త తులనాత్మక వాదనను స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ఫిలిప్పీయులు 3:4లో σάρξ అర్థం
  choice: ‘శరీర సంబంధమైన వాటిలో’ అని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘మానవ అర్హతలపై’ లేదా ‘బాహ్య హోదాపై’; ‘పాప స్వభావంలో’
  rationale: 3:5–6లోని సున్నతి, వంశం, ధర్మశాస్త్ర సంబంధిత స్థానం, ఆసక్తి వంటి జాబితా ఇక్కడ పాప స్వభావం కాకుండా బాహ్య మానవ అర్హతలు, హోదా, సాధనలను సూచిస్తుంది. అయినా σάρξ అనే మూల రూపకాన్ని పూర్తిగా తొలగించకుండా నిలుపబడింది.
- issue: πεποίθησις‌ను నమ్మకమా లేక నమ్మకానికి ఆధారాలా అనువదించడం
  choice: ‘నమ్మకం పెట్టుకోగలను’
  alternative: ‘నమ్మకానికి ఆధారాలు ఉన్నాయి’
  rationale: మూలంలోని ‘నమ్మకం’ భావాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, సందర్భంలో పౌలు తన బాహ్య అర్హతలను ఉద్దేశిస్తున్నాడనే విషయాన్ని పాదటిప్పణిలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని ‘శరీరం’ రూపకాన్ని సందర్భోచితంగా నిలిపి, దాని భావాన్ని పాదటిప్పణిలో స్పష్టం చేసింది.
