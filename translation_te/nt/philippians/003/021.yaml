id: PHP.3.21
reference: Philippians 3:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς μετασχηματίσει τὸ σῶμα τῆς ταπεινώσεως ⸀ἡμῶν σύμμορφον τῷ σώματι τῆς δόξης αὐτοῦ κατὰ τὴν ἐνέργειαν τοῦ δύνασθαι αὐτὸν καὶ ὑποτάξαι ⸀αὑτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/021.yaml
  text: who will transform our lowly body to be like the body of his glory[c][b][a], by the power that enables him even to subject all things to himself.
translation:
  language: te
  text: ఆయన మన దీనమైన శరీరాన్ని తన మహిమగల శరీరానికి సమరూపమైనదిగా మారుస్తాడు[a][b]. సమస్తాన్ని తనకు లోబరచగల ఆయన శక్తి కార్యాచరణకు అనుగుణంగా ఆయన ఇలా చేస్తాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మన దీనస్థితి యొక్క శరీరం.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “తన మహిమ యొక్క శరీరానికి సమరూపమైనదిగా.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “సమస్తాన్ని తనకు లోబరచగల ఆయన సామర్థ్యపు కార్యాచరణ ప్రకారం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετασχηματίσει
  choice: మారుస్తాడు
  rationale: ఈ క్రియ రూపం లేదా స్థితిలో నిజమైన పరివర్తనను సూచిస్తుంది. భవిష్యత్ కార్యాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ σῶμα τῆς ταπεινώσεως ἡμῶν
  choice: మన దీనస్థితిలో ఉన్న శరీరం
  rationale: అక్షరార్థమైన ‘మన దీనస్థితి యొక్క శరీరం’ తెలుగులో అసహజంగా ఉంటుంది. ఈ రూపం ప్రస్తుత శరీరపు దీనమైన స్థితిని తెలియజేస్తూ గ్రీకు సంబంధార్థాన్ని నిలుపుతుంది.
- source_word: σύμμορφον
  choice: సమరూపంగా
  rationale: కేవలం సాధారణ పోలికకన్నా బలమైన, రూపసంబంధమైన అనురూపతను ఈ పదం కాపాడుతుంది.
- source_word: τῷ σώματι τῆς δόξης αὐτοῦ
  choice: తన మహిమగల శరీరానికి
  rationale: ‘తన మహిమ యొక్క శరీరం’ అనే అక్షరార్థ నిర్మాణాన్ని సహజ తెలుగులో శరీరాన్ని విశేషించే విధంగా తెలిపింది.
- source_word: κατὰ τὴν ἐνέργειαν
  choice: తన కార్యశక్తి ప్రకారం
  rationale: ἐνέργεια క్రియాశీలంగా పనిచేసే ప్రభావవంతమైన శక్తిని సూచిస్తుంది; ‘కార్యశక్తి’ శక్తి మరియు దాని కార్యసాధకత రెండింటినీ నిలుపుతుంది.
- source_word: τοῦ δύνασθαι αὐτὸν καὶ ὑποτάξαι αὑτῷ τὰ πάντα
  choice: సమస్తాన్ని తనకు లోబరచుకోగల
  rationale: క్రీస్తు సామర్థ్యాన్ని మరియు τὰ πάντα యొక్క సమగ్ర పరిధిని సంక్షిప్తంగా, సహజంగా కాపాడుతుంది.
theological_decisions:
- issue: ప్రస్తుత శరీరపు దీనస్థితికి, భవిష్యత్ మహిమకు మధ్య సంబంధం
  choice: విశ్వాసుల ప్రస్తుత దీనస్థితిలోని శరీరం క్రీస్తు మహిమగల శరీరానికి సమరూపంగా మారుతుందని తెలిపింది; పునరుత్థాన విధానాన్ని అదనంగా వివరించలేదు.
  alternative: ‘పునరుత్థాన శరీరం’ అని స్పష్టంగా చేర్చడం.
  rationale: గ్రీకు వాక్యం శరీర పరివర్తనను, క్రీస్తు శరీరానికి సమరూపతను స్పష్టంగా చెబుతుంది; అయితే దాని ప్రక్రియను ఇక్కడ వివరించదు.
- issue: κατὰ τὴν ἐνέργειαν యొక్క సంబంధం
  choice: పరివర్తన ఆయన కార్యశక్తికి అనుగుణంగా జరుగుతుందని తెలిపింది.
  alternative: ‘ఆయనను సమస్తాన్ని లోబరచుకునేలా చేసే శక్తిచేత’ అని అనువదించడం.
  rationale: ‘ప్రకారం’ గ్రీకు κατὰ ను దగ్గరగా నిలుపుతుంది; శక్తి క్రీస్తుకు వెలుపలి నుంచి సామర్థ్యాన్ని ఇచ్చినట్లు అనిపించే భావాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గంభీరంగా రూపొందించబడింది. ‘సమరూపంగా,’ ‘కార్యశక్తి,’ ‘లోబరచుకోగల’ వంటి పదాలు మూలంలోని బలమైన రూపసామ్యం, ప్రభావవంతమైన శక్తి, సార్వత్రిక అధికారాన్ని కాపాడుతాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
