revisions:
- from: ఆయన మన దీనస్థితిలో ఉన్న శరీరాన్ని తన మహిమగల శరీరానికి సమరూపంగా మారుస్తాడు[a][b]. సమస్తాన్ని తనకు లోబరచుకోగల తన కార్యశక్తి ప్రకారం ఆయన ఇలా చేస్తాడు[c].
  to: ఆయన మన దీనమైన శరీరాన్ని తన మహిమగల శరీరానికి సమరూపమైనదిగా మారుస్తాడు[a][b]. సమస్తాన్ని తనకు లోబరచగల ఆయన శక్తి కార్యాచరణకు అనుగుణంగా ఆయన ఇలా చేస్తాడు[c].
  rationale: The revision retains the draft’s modern standard Telugu and its faithful theological restraint. It improves the Telugu result construction for σύμμορφον and more closely represents the syntactic and semantic connection of κατὰ τὴν ἐνέργειαν with Christ’s ability to subject all things to himself. Footnote anchors are retained and each note now corresponds clearly to its marked expression.
