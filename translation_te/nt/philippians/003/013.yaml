source:
  edition: SBLGNT
  text: ἀδελφοί, ἐγὼ ἐμαυτὸν ⸀οὐ λογίζομαι κατειληφέναι· ἓν δέ, τὰ μὲν ὀπίσω ἐπιλανθανόμενος τοῖς δὲ ἔμπροσθεν ἐπεκτεινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/013.yaml
  text: 'Brothers[a], I do not consider myself to have taken hold of it. But one thing: forgetting the things behind and reaching forward to the things ahead,'
translation:
  language: te
  text: 'సోదరులారా[a], నేను దానిని సాధించానని భావించడం లేదు. అయితే ఒక్కటి: వెనుక ఉన్నవాటిని మరచిపోతూ, ముందున్నవాటి వైపు చాచుకుంటూ,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సోదరులారా’ అనేది పుంలింగ గ్రీకు సంబోధన పదమైన adelphoiకి అనువాదం; పౌలు ఈ పదాన్ని స్త్రీలతో సహా విశ్వాస సమాజమంతటినీ ఉద్దేశించి తరచుగా వాడుతాడు.
    reason: cultural_note
lexical_decisions:
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకు పుంలింగ సంబోధన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అది స్త్రీలతో సహా విశ్వాస సమాజమంతటికీ వాడబడగలదనే విషయాన్ని పాదసూచికలో తెలిపింది.
- source_word: λογίζομαι
  choice: భావించడం లేదు
  rationale: వ్యక్తి తన గురించి చేసుకునే అంచనా లేదా నిర్ధారణను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κατειληφέναι
  choice: అందుకున్నానని
  rationale: పట్టుకోవడం లేదా స్వాధీనం చేసుకోవడం అనే క్రియాత్మక భావాన్ని తెలుగులో సహజంగా అందిస్తుంది; గ్రీకులో వ్యక్తంగా లేని కర్మను సందర్భానుసారంగా ‘దానిని’ అని చేర్చింది.
- source_word: ἓν δέ
  choice: అయితే ఒక్కటి
  rationale: ‘నేను చేసేది’ వంటి గ్రీకులో లేని మాటలను చేర్చకుండా, మూలంలోని అకస్మాత్తైన అసంపూర్ణ సంధిని నిలుపుతుంది.
- source_word: τὰ μὲν ὀπίσω
  choice: వెనుక ఉన్నవాటిని
  rationale: బహువచన ‘వాటిని’ మరియు వెనుక–ముందు స్థానిక రూపకాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐπιλανθανόμενος
  choice: మరచిపోతూ
  rationale: క్రియ యొక్క సాధారణ నిఘంటు అర్థాన్ని, కొనసాగుతున్న క్రియను సూచించే కృదంత ప్రవాహంతో అందిస్తుంది.
- source_word: τοῖς δὲ ἔμπροσθεν
  choice: ముందున్నవాటి వైపు
  rationale: ‘వెనుక ఉన్నవాటి’తో సమాంతరమైన వ్యతిరేకతను సహజంగా చూపుతుంది.
- source_word: ἐπεκτεινόμενος
  choice: చాచుకుంటూ
  rationale: ముందుకు శరీరాన్ని లేదా తనను చాపే చలన రూపకాన్ని అతిశయింపకుండా నిలుపుతుంది.
theological_decisions:
- issue: κατειληφέναι అనే క్రియకు వ్యక్తంగా చెప్పని కర్మ
  choice: ‘దానిని’ అని సందర్భానుసార కర్మను చేర్చడం
  alternative: కర్మ లేకుండా ‘అందుకున్నానని’ అని మాత్రమే అనడం
  rationale: గ్రీకులో కర్మ సందర్భం నుండి గ్రహించబడుతుంది; తెలుగులో వాక్య స్పష్టత కోసం ‘దానిని’ అవసరం, కాని అది ఏమిటో వివరణాత్మకంగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని కృదంతాల ప్రవాహం, అకస్మాత్తైన ‘అయితే ఒక్కటి’ అనే అసంపూర్ణ నిర్మాణం, అలాగే వెనుక–ముందు రూపకం నిలుపబడ్డాయి.
