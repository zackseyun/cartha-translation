id: PHP.3.15
reference: Philippians 3:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅσοι οὖν τέλειοι, τοῦτο φρονῶμεν· καὶ εἴ τι ἑτέρως φρονεῖτε, καὶ τοῦτο ὁ θεὸς ὑμῖν ἀποκαλύψει·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/015.yaml
  text: Therefore[a], all of us who are mature should think this way; and if you think differently about anything[b], God will reveal this also to you.
translation:
  language: te
  text: కాబట్టి, మనలో పరిణతి చెందినవారందరం[a] ఇదే విధంగా ఆలోచిద్దాం; ఏ విషయంలోనైనా మీరు భిన్నంగా ఆలోచిస్తే, ఈ విషయాన్ని కూడా దేవుడు మీకు వెల్లడిస్తాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనలో పరిపూర్ణులమైన వారందరం.” గ్రీకు పదం సంపూర్ణతను కూడా సూచించగలదు; ఇక్కడ అది ఆత్మీయ పరిణతిని సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఈ మనోభావాన్ని కూడా దేవుడు మీకు వెల్లడిస్తాడు.”
    reason: referential_ambiguity
lexical_decisions:
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాదననుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ὅσοι
  choice: మనమందరం
  rationale: సమూహాన్ని ఉద్దేశించిన సమగ్ర భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τέλειοι
  choice: పరిణతి చెందిన
  rationale: సందర్భంలో సంపూర్ణ పాపరాహిత్యంకన్నా ఆత్మీయ పరిపక్వత భావం ప్రధానంగా ఉంది; అయినా ‘పరిపూర్ణులు’ అనే పదార్థాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: τοῦτο φρονῶμεν
  choice: ఇదే విధంగా ఆలోచిద్దాం
  rationale: τοῦτο ముందటి మనోభావాన్ని సూచిస్తుంది; hortatory subjunctive భావాన్ని ‘ఆలోచిద్దాం’ సహజంగా తెలియజేస్తుంది.
- source_word: εἴ τι ἑτέρως φρονεῖτε
  choice: ఏ విషయంలోనైనా మీరు వేరుగా ఆలోచిస్తే
  rationale: షరతును, ఏ అంశమైనా కావచ్చనే విస్తృతిని, భిన్నమైన దృక్పథాన్ని కాపాడుతుంది.
- source_word: ἀποκαλύψει
  choice: వెల్లడిస్తాడు
  rationale: దేవుని ద్వారా కలిగే ప్రకటన అనే భావాన్ని నేరుగా, దైవశాస్త్రీయ బరువును అతిశయింపకుండా అందిస్తుంది.
theological_decisions:
- issue: τέλειοι పదానికి ఇక్కడి అర్థం
  choice: పరిణతి చెందిన
  alternative: పరిపూర్ణులు
  rationale: ముందటి వచనాల్లో పౌలు తాను ఇప్పటికే పరిపూర్ణత పొందలేదని చెబుతూ ముందుకు సాగుతున్నాడు. అందువల్ల ఇక్కడ ఆత్మీయ పరిణతి ప్రధాన భావం; అయితే గ్రీకు పదంలోని ‘పరిపూర్ణులు’ అనే నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం సందర్భంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను కాపాడుతుంది.
- issue: దేవుడు వెల్లడించేది ఏమిటి
  choice: దానిని కూడా
  alternative: ఈ మనోభావాన్ని కూడా
  rationale: καὶ τοῦτο యొక్క సూచన కొంత సంక్షిప్తంగా, సందిగ్ధంగా ఉంది. ప్రధాన పాఠ్యంలో దాన్ని అతిగా నిర్దిష్టం చేయకుండా ఉంచి, ప్రత్యామ్నాయ అవగాహనను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఆలోచిద్దాం’ ద్వారా సమూహాన్ని కలుపుకొనే ప్రోత్సాహం నిలుపబడింది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
