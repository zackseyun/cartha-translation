source:
  edition: SBLGNT
  text: Ἀλλὰ ἅτινα ἦν μοι κέρδη, ταῦτα ἥγημαι διὰ τὸν Χριστὸν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/007.yaml
  text: But whatever things were gains to me[b][a], these I have considered loss because of Messiah.
translation:
  language: te
  text: అయితే నాకు లాభాలుగా ఉన్నవి ఏవేవో, వాటిని మెస్సీయ కారణంగా నష్టంగా పరిగణించాను.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నష్టంగా లెక్కించాను.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “క్రీస్తు కారణంగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: అయితే
  rationale: ముందటి వాక్యాలలో పేర్కొన్న ఆధారాలకు బలమైన వ్యతిరేక మలుపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἅτινα
  choice: ఉన్నవాటినన్నిటినీ
  rationale: పౌలు ఇంతకుముందు పేర్కొన్న ప్రయోజనాల సమూహమంతటినీ సూచించే అనిర్దిష్ట సంబంధార్థాన్ని కాపాడుతుంది.
- source_word: κέρδη
  choice: లాభాలుగా
  rationale: ζημίανతో ఉన్న లెక్కల రూపకాన్ని నిలుపుతూ, పూర్వపు ప్రయోజనాలను లాభాలుగా వర్ణిస్తుంది.
- source_word: ἥγημαι
  choice: పరిగణించాను
  rationale: పూర్తయిన పునర్మూల్యాంకనాన్ని, దాని ఫలితంగా ఏర్పడిన స్థిరమైన అభిప్రాయాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: διὰ τὸν Χριστόν
  choice: మెస్సీయ కారణంగా
  rationale: διά + accusative ఇక్కడ తెలిపే కారణ భావాన్ని కాపాడుతూ, Χριστόςను బిరుదుగా అర్థానువాదం చేస్తుంది.
- source_word: ζημίαν
  choice: నష్టంగా
  rationale: బహువచనంలోని లాభాలకు ఎదురుగా ఏకవచన నష్టాన్ని ఉంచి మూలంలోని ఆర్థిక రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: Χριστόν అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός బిరుదుగా పనిచేస్తున్నందున దాని అర్థాన్ని తెలిపే ‘మెస్సీయ’ను ప్రధాన పాఠ్యంలో వాడాం; తెలుగు క్రైస్తవ వాడుకలో సాధారణమైన ‘క్రీస్తు’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చాం.
- issue: ἥγημαι యొక్క కాలభావం
  choice: పరిగణించాను
  alternative: లెక్కించాను / పరిగణిస్తున్నాను
  rationale: గ్రీకు perfect రూపం గతంలో జరిగిన పునర్మూల్యాంకనంతో ఏర్పడిన ప్రస్తుత స్థిర నిర్ణయాన్ని సూచిస్తుంది. తెలుగు ప్రధాన పాఠ్యంలో సహజంగా ‘పరిగణించాను’ అని ఉంచి, లెక్కల రూపకాన్ని మరింత ప్రత్యక్షంగా చూపే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘లాభాలు—నష్టం’ అనే మూలంలోని లెక్కల వ్యతిరేకతను నిలిపి, వాక్య నిర్మాణాన్ని తెలుగు సహజ ప్రవాహానికి అనుగుణంగా మార్చాం.
