id: PHP.3.8
reference: Philippians 3:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ ⸀μενοῦνγε καὶ ἡγοῦμαι πάντα ζημίαν εἶναι διὰ τὸ ὑπερέχον τῆς γνώσεως Χριστοῦ Ἰησοῦ τοῦ κυρίου μου δι’ ὃν τὰ πάντα ἐζημιώθην, καὶ ἡγοῦμαι ⸀σκύβαλα ἵνα Χριστὸν κερδήσω
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/008.yaml
  text: More than that[a], I consider all things to be loss because of the surpassing value of the knowledge of Messiah Jesus my Lord, for whose sake I have suffered the loss of all things and consider them rubbish[c][b], so that I may gain Messiah.
translation:
  language: te
  text: అంతేకాదు, నా ప్రభువైన మెస్సీయ యేసును[b] తెలుసుకోవడంలోని అసమానమైన గొప్పతనం కారణంగా నేను అన్నిటినీ నష్టంగానే భావిస్తున్నాను. ఆయన నిమిత్తం నేను అన్నిటినీ కోల్పోయాను; మెస్సీయను సంపాదించుకోవడానికి వాటన్నిటినీ చెత్తగా[a] భావిస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “చెత్త” అని అనువదించిన గ్రీకు పదం బలమైన తిరస్కార పదం; దానికి “వ్యర్థపదార్థం,” “మురికి,” లేదా “పేడ” అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “మెస్సీయ యేసు” అనే మాటను “క్రీస్తు యేసు” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ μενοῦνγε καὶ
  choice: అంతేకాదు
  rationale: మునుపటి మాటను బలపరుస్తూ వాదనను ముందుకు తీసుకెళ్లే ఈ కణసమూహాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἡγοῦμαι
  choice: ఎంచుతున్నాను
  rationale: కేవలం అభిప్రాయం కాక, విలువను తూచి నిర్ణయించడాన్ని సూచిస్తుంది; రెండు సందర్భాల్లోనూ ఒకే పదాన్ని ఉంచడం మూలంలోని పునరుక్తిని కాపాడుతుంది.
- source_word: πάντα / τὰ πάντα
  choice: అన్నిటినీ
  rationale: గ్రీకు పదబంధంలోని విస్తృతమైన, సమగ్ర పరిధిని నిలుపుతుంది.
- source_word: ζημίαν
  choice: నష్టంగా
  rationale: లాభనష్టాల రూపకాన్ని స్పష్టంగా కొనసాగించే సహజమైన తెలుగు పదం.
- source_word: διὰ τὸ ὑπερέχον τῆς γνώσεως
  choice: తెలుసుకోవడంలోని సాటిలేని విలువ కారణంగా
  rationale: γνῶσις లోని జ్ఞాన/వ్యక్తిగతంగా తెలుసుకొనే భావాన్ని సహజంగా వ్యక్తం చేస్తూ, ὑπερέχον సూచించే మించిన విలువను నిలుపుతుంది.
- source_word: Χριστοῦ Ἰησοῦ
  choice: మెస్సీయ యేసు
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉన్న అర్థాన్ని అనువదిస్తుంది; సంప్రదాయ రూపమైన ‘క్రీస్తు యేసు’ను పాదసూచికలో ఇస్తుంది.
- source_word: τοῦ κυρίου μου
  choice: నా ప్రభువైన
  rationale: వ్యక్తిగత సంబంధాన్ని తెలిపే possessive భావాన్నీ, κύριος యొక్క క్రీస్తుసంబంధ గంభీరతనూ కాపాడుతుంది.
- source_word: δι’ ὃν
  choice: ఆయన నిమిత్తం
  rationale: వ్యక్తిగత కారణం మరియు త్యాగభావం రెండింటినీ సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: ἐζημιώθην
  choice: నేను అన్నిటినీ కోల్పోయాను
  rationale: నష్టాన్ని అనుభవించిన భావాన్ని సహజమైన తెలుగులో తెలుపుతుంది; సందర్భంలోని లాభనష్టాల రూపకాన్ని కొనసాగిస్తుంది.
- source_word: σκύβαλα
  choice: చెత్తగా
  rationale: తిరస్కారభరితమైన బలమైన పదాన్ని సాధారణ పాఠకుడికి అర్థమయ్యేలా ఇస్తుంది; మరింత కఠినమైన భావవ్యాప్తిని పాదసూచికలో పేర్కొంటుంది.
- source_word: ἵνα Χριστὸν κερδήσω
  choice: మెస్సీయను సంపాదించుకోవడానికి
  rationale: ἵνα తెలిపే ఉద్దేశాన్ని, κερδαίνω కొనసాగించే లాభనష్టాల రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పౌలు వాడుకలో Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ వాక్యంలో పదానికి బిరుదు భావం సజీవంగా ఉంది. అందువల్ల దాని అర్థాన్ని ‘మెస్సీయ’గా అనువదించి, తెలుగులో సుపరిచితమైన ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో ఉంచాం.
- issue: γνῶσις యొక్క భావం
  choice: తెలుసుకోవడం
  alternative: జ్ఞానం
  rationale: ఇక్కడ వ్యక్తిని సంబంధపూర్వకంగా తెలుసుకోవడం మరియు ఆయన గురించిన జ్ఞానం రెండూ సాధ్యమైన భావాలు. ప్రధాన పాఠంలో సహజమైన వ్యక్తిగత భావాన్ని ఎంచుకున్నా, దానిని కేవలం సమాచారజ్ఞానంగా లేదా ఒక ప్రత్యేక ఆధ్యాత్మిక సిద్ధాంతంగా పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన శైలిని పాటించాం. ‘నష్టం—సంపాదన’ అనే లెక్కల రూపకాన్ని, అలాగే ἡγοῦμαι పునరుక్తిని నిలిపాం. ‘చెత్త’ మూలపద బలాన్ని మృదువుచేయకుండా పాఠయోగ్యంగా ఉంచి, దాని కఠినమైన ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
