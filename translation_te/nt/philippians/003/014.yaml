  yaml_path: translation/nt/philippians/003/014.yaml
  text: I press on toward the goal for the prize of the upward call of God in Messiah Jesus[a][b].
translation:
  language: te
  text: లక్ష్యాన్ని గురిగా చేసుకొని, మెస్సీయ యేసులో దేవుని పై పిలుపు బహుమతి కోసం నేను పట్టుదలగా ముందుకు సాగుతున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పరలోక పిలుపు” లేదా “పైనుంచి వచ్చే పిలుపు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ σκοπόν
  choice: లక్ష్యం వైపు
  rationale: పందెపు రూపకంలో నిర్ణీత గమ్యం వైపు సాగడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: διώκω
  choice: నేను ముందుకు సాగుతున్నాను
  rationale: సాధారణంగా ‘వెంబడించు’ అనే అర్థం ఉన్నా, ఇక్కడ శ్రమతో ముందుకు కొనసాగే పందెపు భావాన్ని సందర్భానుగుణంగా అందిస్తుంది.
- source_word: εἰς τὸ βραβεῖον
  choice: బహుమతి కోసం
  rationale: ప్రయత్నపు లక్ష్యాన్ని సూచించే εἰς భావాన్ని అనవసరమైన పదాలను చేర్చకుండా స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἄνω
  choice: పై
  rationale: పైకి అనే స్థలసంబంధ భావాన్ని నిలుపుతూ, దేవుని వద్దనుంచి వచ్చే పిలుపు అనే సాధ్యమైన భావాన్నీ తెరిచి ఉంచుతుంది.
- source_word: κλήσεως τοῦ θεοῦ
  choice: దేవుడు ఇచ్చే ... పిలుపు
  rationale: τοῦ θεοῦను పిలుపుకు మూలమైన దేవునిగా సహజ తెలుగులో వ్యక్తపరుస్తుంది; అసహజమైన ‘దేవుని పిలుపు యొక్క’ నిర్మాణాన్ని నివారిస్తుంది.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: క్రీస్తు యేసులో
  rationale: ἐν యొక్క సంఘటిత సంబంధభావాన్ని నేరుగా నిలుపుతుంది; ‘క్రీస్తు’ తెలుగులో స్థిరపడిన బిరుదు రూపం.
theological_decisions:
- issue: ἄνω κλήσεως యొక్క భావం
  choice: పై పిలుపు
  alternative: పరలోక పిలుపు; పైనుంచి వచ్చే పిలుపు
  rationale: ‘పై’ అనే అనువాదం మూలంలోని స్థలసంబంధ అస్పష్టతను కాపాడుతుంది; పిలుపు పైకి నడిపించేదా, పైనుంచి వచ్చేదా, పరలోక సంబంధమైనదా అన్న విషయాన్ని అనవసరంగా తేల్చదు.
- issue: τοῦ θεοῦ అనే సంబంధవిభక్తి
  choice: దేవుడు ఇచ్చే పిలుపు
  alternative: దేవుని పిలుపు
  rationale: దేవుడే పిలిచేవాడు లేదా పిలుపుకు మూలం అనే సహజమైన అవగాహనను తెలియజేస్తుంది; స్వామ్యార్థానికి మాత్రమే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. పందెపు రూపకాన్ని ‘లక్ష్యం’, ‘బహుమతి’, ‘ముందుకు సాగుతున్నాను’ ద్వారా నిలుపుతూ, ἄνω యొక్క నిజమైన అస్పష్టతను పాదసూచికలో చూపించాం.
