id: PHP.3.10
reference: Philippians 3:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦ γνῶναι αὐτὸν καὶ τὴν δύναμιν τῆς ἀναστάσεως αὐτοῦ καὶ ⸀κοινωνίαν παθημάτων αὐτοῦ, ⸀συμμορφιζόμενος τῷ θανάτῳ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/010.yaml
  text: to know him[a], and the power of his resurrection, and the fellowship of his sufferings, being conformed to his death[b],
translation:
  language: te
  text: ఆయనను, ఆయన పునరుత్థానపు శక్తిని, ఆయన శ్రమలలో భాగస్వామ్యాన్ని[a] తెలుసుకోవాలని, ఆయన మరణానికి అనురూపమవుతూ[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన శ్రమలలో పాలుపంచుకోవడాన్ని”; లేదా, “ఆయన శ్రమలతో సహవాసాన్ని.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆయన మరణానికి అనుగుణంగా మారుతూ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναι
  choice: తెలుసుకోవాలని
  rationale: ఇది పౌలు ఉద్దేశాన్ని తెలిపే అనిశ్చిత క్రియారూపం. ‘తెలుసుకోవడం’ అనే పదం వ్యక్తిగతమైన, అనుభవపూర్వకమైన జ్ఞానాన్ని అతిగా వివరణ చేయకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: δύναμιν
  choice: శక్తిని
  rationale: δύναμις పదానికి సందర్భానుకూలమైన సూటి సమానార్థకం; క్రీస్తు పునరుత్థానంలో వెల్లడైన కార్యసాధక శక్తిని సూచిస్తుంది.
- source_word: ἀναστάσεως
  choice: పునరుత్థాన
  rationale: మరణం నుండి లేవడం అనే నిర్దిష్ట సంఘటనకు ఆధునిక ప్రామాణిక తెలుగు క్రైస్తవ వాడుకలో స్పష్టమైన పదం.
- source_word: κοινωνίαν
  choice: భాగస్వామ్యాన్ని
  rationale: కేవలం సానుభూతి లేదా సహవాసం కాక, క్రీస్తు శ్రమలలో నిజంగా పాలుపంచుకోవడం అనే భావాన్ని నామవాచక రూపంలో నిలుపుతుంది.
- source_word: παθημάτων
  choice: శ్రమలలో
  rationale: πάθημα సూచించే బాధలు, కష్టాలను సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది; κοινωνίαతో కలిపి తెలుగులో ‘శ్రమలలో భాగస్వామ్యం’ సహజంగా ఉంటుంది.
- source_word: συμμορφιζόμενος
  choice: అనురూపంగా రూపుదిద్దుకుంటూ
  rationale: వర్తమాన కృదంతం తెలిపే కొనసాగుతున్న ప్రక్రియను, అలాగే మరొక నమూనాకు అనుగుణంగా మారడం అనే భావాన్ని కాపాడుతుంది.
- source_word: τῷ θανάτῳ αὐτοῦ
  choice: ఆయన మరణానికి
  rationale: συμμορφιζόμενοςకు పూరకంగా ఉన్న దత్తివిభక్తి భావాన్ని సూటిగా నిలిపి, దృష్టిని క్రీస్తు మరణంపైనే ఉంచుతుంది.
theological_decisions:
- issue: κοινωνίαν παθημάτων αὐτοῦ యొక్క భావం
  choice: క్రీస్తు శ్రమలలో నిజమైన భాగస్వామ్యం
  alternative: ఆయన శ్రమలతో మరింత అమూర్తమైన సహవాసం
  rationale: గ్రీకు పదబంధం మరియు విస్తృత పౌలు సందర్భం క్రీస్తు శ్రమల నమూనాలో పాలుపంచుకోవడాన్ని సూచిస్తాయి. అనువాదం దానిని ఏదైనా ప్రత్యేక సిద్ధాంత వ్యవస్థకు పరిమితం చేయదు.
- issue: సమμορφιζόμενοςలో ప్రక్రియ మరియు కర్తృత్వం
  choice: కొనసాగుతున్న అనురూపీకరణను సూచించే ‘రూపుదిద్దుకుంటూ’
  alternative: ‘ఆయన మరణంలా అవుతూ’ లేదా ‘ఆయన మరణానికి అనురూపం చేయబడుతూ’
  rationale: గ్రీకు మధ్య/కర్మణి రూపం కర్తృత్వాన్ని పూర్తిగా నిర్ధారించకుండా కొనసాగుతున్న మార్పును తెలియజేస్తుంది; తెలుగు రూపం ఆ అనిశ్చితిని సాధ్యమైనంతవరకు నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని వాక్యఖండ స్వరూపాన్ని చివరి దీర్ఘవిరామంతో నిలిపింది; γνῶναιకు సమాంతర కర్మలైన ‘ఆయనను’, ‘శక్తిని’, ‘భాగస్వామ్యాన్ని’ ఒకే నిర్మాణంలో ఉంచింది.
