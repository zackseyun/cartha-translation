  text: οἱ πάντες γὰρ τὰ ἑαυτῶν ζητοῦσιν, οὐ τὰ ⸂Ἰησοῦ Χριστοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/021.yaml
  text: For they all seek their own interests[a], not those of Jesus the Messiah.
translation:
  language: te
  text: ఎందుకంటే వారందరూ తమ సొంత ప్రయోజనాలనే వెదుకుతున్నారు, యేసు మెస్సీయకు సంబంధించిన ప్రయోజనాలను కాదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు క్రీస్తుకు సంబంధించిన ప్రయోజనాలను కాదు.”
    reason: Χριστόςను బిరుదు-అర్థంతో ‘మెస్సీయ’గా లేదా సంప్రదాయ పేరు-రూపంలో ‘క్రీస్తు’గా వ్యక్తం చేయగల ప్రత్యామ్నాయాన్ని నమోదు చేయడం.
lexical_decisions:
- source_word: οἱ πάντες
  choice: వారందరూ
  rationale: నిర్దిష్ట బహువచన రూపం సందర్భంలోని వ్యక్తులందరినీ సమష్టిగా సూచిస్తుంది; ‘వారందరూ’ ఆ ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని తెలిపే వివరణాత్మక సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τὰ ἑαυτῶν
  choice: తమ సొంత ప్రయోజనాలనే
  rationale: నపుంసక బహువచన నుడికారం తమకు సంబంధించిన విషయాలు లేదా ప్రయోజనాలను సూచిస్తుంది. సందర్భంలోని స్వార్థపూరిత వ్యత్యాసాన్ని ‘ప్రయోజనాలు’ సహజంగా తెలియజేస్తుంది; ‘నే’ వ్యత్యాసాన్ని బలపరుస్తుంది.
- source_word: ζητοῦσιν
  choice: వెదుకుతున్నారు
  rationale: ‘కోరడం/అన్వేషించడం/పట్టించుకోవడం’ అనే భావపరిధిని కలిగిన క్రియకు సమీపమైన రూపం; రెండు పక్షాల మధ్య ఉన్న నైతిక వ్యత్యాసాన్ని అతిగా విస్తరించకుండా నిలుపుతుంది.
- source_word: τὰ Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ ప్రయోజనాలను
  rationale: పునరుక్త నపుంసక బహువచన వ్యాసం ముందున్న ‘ప్రయోజనాలు’ అనే భావాన్ని సూచిస్తుంది. తెలుగులో స్పష్టత కోసం ఆ నామవాచకాన్ని పునరుక్తం చేశాం; Χριστόςను ఇక్కడ బిరుదుగా ‘మెస్సీయ’ అని అనువదించాం.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦలో Χριστοῦ అనువాదం
  choice: యేసు మెస్సీయ
  alternative: యేసు క్రీస్తు
  rationale: Χριστός ఇక్కడ యేసుకు సంబంధించిన బిరుదుగా అర్థవంతంగా ఉంది కాబట్టి ‘మెస్సీయ’ మూలార్థాన్ని నిలుపుతుంది. అయితే తెలుగులో స్థిరపడిన పేరు-రూపమైన ‘యేసు క్రీస్తు’ను పాఠకుల కోసం పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని కారణసంబంధాన్ని, సమష్టి ఉద్ఘాటనను, ‘తమవి—యేసు మెస్సీయవి’ అనే వ్యత్యాసాన్ని నిలిపాం. తెలుగు సహజత్వం మరియు స్పష్టత కోసం రెండవ భాగంలో ‘ప్రయోజనాలు’ను పునరుక్తం చేశాం.
