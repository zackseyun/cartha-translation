id: PHP.2.16
reference: Philippians 2:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λόγον ζωῆς ἐπέχοντες, εἰς καύχημα ἐμοὶ εἰς ἡμέραν Χριστοῦ, ὅτι οὐκ εἰς κενὸν ἔδραμον οὐδὲ εἰς κενὸν ἐκοπίασα.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/016.yaml
  text: holding fast the word of life[a], for a boast to me in the day of Messiah[b], that I did not run in vain or labor in vain.
translation:
  language: te
  text: జీవ వాక్యాన్ని గట్టిగా పట్టుకొని ఉండడం ద్వారా, మెస్సీయ దినాన నాకు అతిశయించడానికి మీరు కారణమవుతారు; అప్పుడు నేను వ్యర్థంగా పరుగెత్తలేదని, వ్యర్థంగా శ్రమించలేదని చెప్పగలను.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “జీవ వాక్యాన్ని ముందుకు చాచుతూ” లేదా “జీవ వాక్యాన్ని ఇతరులకు అందిస్తూ.”
    reason: lexical_alternative
  - marker: b
    text: 'సాంప్రదాయ అనువాదం: “క్రీస్తు దినాన.”'
    reason: alternative_reading
lexical_decisions:
- source_word: λόγον ζωῆς
  choice: జీవవాక్యాన్ని
  rationale: ‘జీవవాక్యం’ అనే సంక్షిప్త రూపం జీవాన్ని ఇచ్చే వాక్యం, జీవాన్ని గురించిన సందేశం అనే రెండు భావసాధ్యతలనూ నిలుపుతుంది.
- source_word: ἐπέχοντες
  choice: గట్టిగా పట్టుకొని ఉండండి
  rationale: ముందున్న స్థిరమైన విధేయత, నిందారహిత జీవితం అనే సందర్భంలో ‘గట్టిగా పట్టుకోవడం’ ప్రధాన భావంగా సరిపోతుంది; ఇతరులకు అందించడం అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: καύχημα
  choice: అతిశయకారణం
  rationale: ఫిలిప్పీయులు పౌలు సముచితంగా అతిశయించడానికి కారణమవుతారనే నామవాచక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἡμέραν Χριστοῦ
  choice: మెస్సీయ దినాన
  rationale: ఇక్కడ Χριστός బిరుదుగా ఉండి అంత్యకాల, రాజసంబంధ భావాన్ని కలిగి ఉంది; అందువల్ల ‘మెస్సీయ’ అని అనువదించాం.
- source_word: οὐκ εἰς κενὸν
  choice: వ్యర్థంగా ... లేదు
  rationale: ఫలించకపోవడం, ప్రయోజనం లేకపోవడం అనే గ్రీకు నుడికారాన్ని సంక్షిప్తంగా, రెండు క్రియల సమాంతరతను కాపాడుతూ తెలుపుతుంది.
- source_word: ἔδραμον
  choice: పరుగెత్తలేదు
  rationale: పౌలు తన పరిచర్యా ప్రయాసను పరుగుతో పోల్చిన రూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: ἐκοπίασα
  choice: శ్రమించలేదు
  rationale: κοπιάω సూచించే తీవ్రమైన కష్టపడటాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: అంత్యకాల బిరుదు పదబంధంలో Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ‘మెస్సీయ దినం’ అనే పదబంధంలో Χριστός కేవలం పేరులా కాక బిరుదుగా, రాబోయే రాజు మరియు ఆయన తీర్పు/ప్రత్యక్షత దినాన్ని సూచిస్తుంది. సాంప్రదాయ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: ἐπέχοντες యొక్క అంతర్ముఖ లేదా బాహ్య భావం
  choice: వాక్యాన్ని గట్టిగా పట్టుకొని ఉండడం
  alternative: వాక్యాన్ని ముందుకు చాచడం లేదా ఇతరులకు అందించడం
  rationale: తక్షణ సందర్భంలోని విధేయత, స్థిరత్వం ప్రధాన ఎంపికకు మద్దతిస్తాయి; అయినా గ్రీకు క్రియలోని ప్రచారాత్మక సాధ్యతను తొలగించకుండా పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. గ్రీకులోని కృదంతాన్ని తెలుగు సందర్భానికి తగిన ఆజ్ఞారూపంగా వ్యక్తం చేశాం; తరువాతి ఫలితాన్ని ‘అప్పుడు’తో అనుసంధానించాం. పరుగెత్తడం–శ్రమించడం అనే పౌలు సమాంతర రూపకాలను కాపాడాం.
