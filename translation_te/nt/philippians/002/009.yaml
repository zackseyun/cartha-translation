id: PHP.2.9
reference: Philippians 2:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὸ καὶ ὁ θεὸς αὐτὸν ὑπερύψωσεν, καὶ ἐχαρίσατο αὐτῷ ⸀τὸ ὄνομα τὸ ὑπὲρ πᾶν ὄνομα,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/009.yaml
  text: Therefore God also highly exalted him and graciously gave him the name that is above every name[b][a],
translation:
  language: te
  text: అందుచేత దేవుడు కూడా ఆయనను ఎంతో ఉన్నతంగా హెచ్చించి, ప్రతి పేరుకంటే పైగా ఉన్న పేరును[b] ఆయనకు కృపతో ఇచ్చాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆయనకు అనుగ్రహించాడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘పేరు’ అనేది పలికే పేరునే కాకుండా హోదా, స్థానం లేదా బిరుదును కూడా సూచించవచ్చు; అయితే ఈ వచనం ఏ పేరు ఉద్దేశించబడిందో ఇంకా నిర్దిష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: అందుచేత ... కూడా
  rationale: διό లోని కారణ-ఫలిత భావాన్ని ‘అందుచేత,’ καί లోని చేర్పు భావాన్ని ‘కూడా’ సహజమైన తెలుగు వాక్యక్రమంలో నిలుపుతుంది.
- source_word: ὁ θεὸς
  choice: దేవుడు
  rationale: గ్రీకులో కర్త స్పష్టంగా, నిర్దిష్టంగా ఉంది; ఆధునిక ప్రామాణిక తెలుగులో ఇది సహజమైన దైవసూచన.
- source_word: ὑπερύψωσεν
  choice: ఎంతో ఉన్నతంగా హెచ్చించి
  rationale: ὑπερ- ఉపసర్గలోని తీవ్రతను ‘ఎంతో ఉన్నతంగా’ తెలియజేస్తూ, ‘అత్యున్నత స్థానం’ వంటి వివరణను మూలపాఠంలో లేనివిధంగా చేర్చదు.
- source_word: ἐχαρίσατο
  choice: కృపతో ఇచ్చాడు
  rationale: χάρις తో ఉన్న పదసంబంధంలోని కృపాభావాన్ని స్పష్టంగా ఉంచుతుంది; సాధారణ పాఠకులకు కూడా సహజంగా అర్థమవుతుంది.
- source_word: τὸ ὄνομα
  choice: పేరు
  rationale: మూలపాఠం నేరుగా ‘పేరు’ అంటుంది; దానిని ప్రధాన పాఠ్యంలో ‘బిరుదు’ లేదా ‘హోదా’గా నిర్దిష్టపరచదు.
- source_word: τὸ ὑπὲρ πᾶν ὄνομα
  choice: ప్రతి పేరుకంటే పైగా ఉన్న పేరు
  rationale: గ్రీకు తులనాత్మక నిర్మాణాన్ని కాపాడుతూ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: ‘పేరు’ యొక్క గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో ఏ పేరు అని నిర్దిష్టపరచకుండా ‘పేరు’గానే ఉంచడం
  alternative: ‘యేసు’ అనే పేరు అని లేదా తరువాతి వచనాల్లో కనిపించే ‘ప్రభువు’ అనే దైవిక బిరుదు అని స్పష్టీకరించడం
  rationale: ఈ వచనం ఆ పేరును స్వయంగా గుర్తించదు. కాబట్టి 2:10–11 ఆధారంగా ఒక వ్యాఖ్యానాన్ని ముందుగానే ప్రధాన పాఠ్యంలో చేర్చకుండా, మూలంలోని తెరచిన భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘ఎంతో ఉన్నతంగా హెచ్చించి’ తీవ్రతను నిలుపుతుంది; ‘కృపతో ఇచ్చాడు’ ἐχαρίσατο లోని కృపాభావాన్ని కనిపించేలా చేస్తుంది. రెండు పాదటిప్పణి సూచికలూ సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
