  revision_rationale: The revised wording uses parallel finite imperatives to express the Greek exhortation naturally and clearly. It preserves the repeated φρονέω vocabulary as “ఒకే విధంగా ఆలోచించండి” and “ఒకే విషయాన్ని ఆలోచించండి,” while “ఏకప్రాణులై” provides an idiomatic rendering of σύμψυχοι. The footnotes give lexical alternatives without adding an interpretive gloss as part of the translation.
