id: PHP.2.2
reference: Philippians 2:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πληρώσατέ μου τὴν χαρὰν ἵνα τὸ αὐτὸ φρονῆτε, τὴν αὐτὴν ἀγάπην ἔχοντες, σύμψυχοι, τὸ ἓν φρονοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/002.yaml
  text: complete my joy[a], so that you may think the same way, having the same love, being united in soul[c][b], thinking one thing.
translation:
  language: te
  text: 'నా ఆనందాన్ని పరిపూర్ణం చేయండి: మీరందరూ ఒకే విధంగా ఆలోచించండి, ఒకే ప్రేమ కలిగి ఉండండి, ఏకప్రాణులై[a], ఒకే విషయాన్ని ఆలోచించండి.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒకే ప్రాణం గలవారై”; లేదా, “ఆత్మలో ఒక్కటై.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఒకే లక్ష్యంపై మనసు నిలిపి ఉండండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πληρώσατέ μου τὴν χαρὰν
  choice: నా ఆనందాన్ని పరిపూర్ణం చేయండి
  rationale: పౌలు ఆనందాన్ని పూర్తి స్థాయికి తీసుకురావాలనే ‘నింపడం/పూర్తిచేయడం’ అనే రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἵνα
  choice: 'ఇలా … :'
  rationale: ఇక్కడ ἵνα ఆజ్ఞ నెరవేరే విధానాన్ని లేదా దాని విషయాన్ని పరిచయం చేస్తుంది. ‘ఇలా’ మరియు ద్విబిందువు తెలుగు వాక్యప్రవాహంలో ఆ సంబంధాన్ని స్పష్టంగా చూపుతాయి; దాన్ని కేవలం ఉద్దేశంగా మాత్రమే పరిమితం చేయవు.
- source_word: τὸ αὐτὸ φρονῆτε
  choice: మీరందరూ ఒకే విధంగా ఆలోచిస్తూ
  rationale: φρονέω కేవలం మేధోచర్యను కాక మనోవైఖరిని కూడా సూచించగలదు. ‘ఒకే విధంగా ఆలోచిస్తూ’ ఆ విస్తృతిని సాధారణ పాఠకునికి సహజంగా తెలియజేస్తుంది.
- source_word: τὴν αὐτὴν ἀγάπην ἔχοντες
  choice: ఒకే ప్రేమ కలిగి
  rationale: గ్రీకు కృదంత నిర్మాణాన్నీ, పరస్పర ఐక్యతను తెలిపే సమాంతర పదబంధాలనూ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: σύμψυχοι
  choice: ఒకే ప్రాణంగా ఏకమై
  rationale: σύν మరియు ψυχή కలయికలోని ఉమ్మడి అంతరంగ జీవితం అనే సజీవ రూపకాన్ని నిలుపుతూ, తెలుగులో కేవలం శారీరక ‘ప్రాణం’ అనే అపార్థం రాకుండా ‘ఏకమై’ అని స్పష్టం చేస్తుంది.
- source_word: τὸ ἓν φρονοῦντες
  choice: ఒకటే ఆలోచిస్తూ ఉండండి
  rationale: ముందున్న φρονῆτεతో పదపునరుక్తిని నిలిపి, వాక్యంలోని ఐక్యత పిలుపును బలపరుస్తుంది. ‘ఒకే లక్ష్యం’ అని అనువదించి అర్థాన్ని ముందుగానే సంకుచితం చేయదు.
theological_decisions:
- issue: రెండుసార్లు వచ్చిన φρονέω పదాన్ని ఎలా ప్రతిబింబించాలి
  choice: ‘ఒకే విధంగా ఆలోచిస్తూ’ … ‘ఒకటే ఆలోచిస్తూ’ అని ఒకే పదకుటుంబాన్ని పునరావృతం చేయడం
  alternative: ‘ఒకే మనోభావం కలిగి’ … ‘ఒకే లక్ష్యంపై దృష్టి పెట్టి’
  rationale: మూలంలోని పునరుక్తి మరియు వైవిధ్యాన్ని నిలుపుతుంది; ఐక్యతను సంస్థాగత ఏకరూపతగా గానీ, ఒక నిర్దిష్ట కార్యలక్ష్యంగా గానీ అనవసరంగా నిర్ణయించదు.
- issue: σύμψυχοιలోని ψυχή భావం
  choice: ‘ఒకే ప్రాణంగా ఏకమై’
  alternative: ‘ఒకే మనసుగలవారై’ లేదా ‘ఆత్మలో ఒక్కటై’
  rationale: మూలంలోని ‘సహ-ప్రాణం/ఆత్మ’ రూపకాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది. ‘ఆత్మ’ అని వాడితే పరిశుద్ధాత్మను సూచిస్తుందనే అదనపు భావం రావచ్చు; ‘మనసు’ అని వాడితే పక్కనున్న φρονέωతో తేడా మసకబారుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం వాడబడింది. మూలంలోని వరుస ఐక్యతాభివ్యక్తులు, రెండు φρονέω రూపాల ప్రతిధ్వని, σύμψυχοιలోని సజీవ రూపకం నిలుపబడ్డాయి. ‘ఇలా’తో పాటు ద్విబిందువు వాక్యాన్ని సహజంగా ఉంచి, ἵναలోని విషయం/ఫలిత సంబంధాన్ని తెరిచి ఉంచుతుంది.
