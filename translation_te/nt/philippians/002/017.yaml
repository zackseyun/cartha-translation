  to: అయితే, మీ విశ్వాసం[c]కు సంబంధించిన బలి మరియు ఆరాధనా సేవ[b]పై నేను పానార్పణగా[a] పోయబడుతున్నా కూడా, నేను ఆనందిస్తున్నాను; మీ అందరితో కలిసి ఆనందిస్తున్నాను.
