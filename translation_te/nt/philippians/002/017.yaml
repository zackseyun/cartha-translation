source:
  edition: SBLGNT
  text: ἀλλὰ εἰ καὶ σπένδομαι ἐπὶ τῇ θυσίᾳ καὶ λειτουργίᾳ τῆς πίστεως ὑμῶν, χαίρω καὶ συγχαίρω πᾶσιν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/017.yaml
  text: But even if I am being poured out as a drink offering upon the sacrifice and service of your faith[c][b][a], I rejoice and rejoice with all of you.
translation:
  language: te
  text: అయితే, మీ విశ్వాసం[c]కు సంబంధించిన బలి మరియు ఆరాధనా సేవ[b]పై నేను పానార్పణగా[a] పోయబడుతున్నా కూడా, నేను ఆనందిస్తున్నాను; మీ అందరితో కలిసి ఆనందిస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ద్రవార్పణగా పోయబడుతున్నాను.’
    reason: lexical_alternative
  - marker: b
    text: ‘ఆరాధనా సేవ’ అనే మాటను ‘సేవ’ లేదా ‘పరిచర్య’ అని కూడా అనువదించవచ్చు; ఇక్కడ గ్రీకు పదం బలి ఆరాధన నేపథ్యాన్ని కలిగి ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘నమ్మకత్వం.’
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: పానార్పణగా పోయబడుతున్నాను
  rationale: బలి ఆరాధనలో ద్రవాన్ని అర్పణగా పోసే చిత్రాన్ని స్పష్టంగా నిలుపుతుంది; వర్తమాన కర్మణి రూపాన్ని కూడా కాపాడుతుంది.
- source_word: ἐπὶ
  choice: మీద
  rationale: దత్తి విభక్తితో ఉన్న ఈ సందర్భంలో పౌలు పానార్పణగా వారి బలి అర్పణ మీద పోయబడుతున్నాడనే బలి చిత్రాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: θυσίᾳ
  choice: బలి అర్పణ
  rationale: θυσία లోని బలి సంబంధమైన భావాన్ని ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: λειτουργίᾳ
  choice: ఆరాధనా సేవ
  rationale: సాధారణ సేవ అనే అర్థాన్ని ఉంచుతూనే, చుట్టూ ఉన్న బలి పదజాలం సూచించే ఆరాధనా నేపథ్యాన్ని నిలుపుతుంది; ‘యాజక సేవ’ అని చెప్పి కర్తను అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: πίστεως
  choice: విశ్వాసం
  rationale: ఇక్కడ ప్రధానంగా దేవునిపై వారి నమ్మకాన్ని సూచించే సహజమైన ఎంపిక; ‘నమ్మకత్వం’ అనే భావం సాధ్యమైనందున దానిని పాదసూచికలో ఉంచాం.
- source_word: χαίρω
  choice: నేను ఆనందిస్తున్నాను
  rationale: ఫిలిప్పీయులకు రాసిన పత్రికలో పునరావృతమయ్యే ఆనంద భావాన్ని, వర్తమాన కాల ప్రకటనను నిలుపుతుంది.
- source_word: συγχαίρω
  choice: మీ అందరితో కలిసి ఆనందిస్తున్నాను
  rationale: σύν ఉపసర్గ సూచించే సహ-ఆనందాన్ని నేరుగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πᾶσιν ὑμῖν
  choice: మీ అందరితో
  rationale: సమాజంలోని ప్రతి ఒక్కరినీ కలుపుతున్న పౌలు ఉద్దేశపూర్వక సమగ్రతను కాపాడుతుంది.
theological_decisions:
- issue: పౌలు సంభవించగల మరణానికి సంబంధించిన బలి రూపకం
  choice: పౌలు తనను వారి విశ్వాసపు బలి అర్పణ, ఆరాధనా సేవ మీద పోయబడే పానార్పణగా వర్ణిస్తున్నాడు.
  alternative: తన జీవితం వారి సేవతో పాటు వెచ్చించబడుతోందని, బలి తీవ్రత లేని సాధారణ సేవా భాషగా అర్థం చేసుకోవడం.
  rationale: σπένδομαι, θυσία, λειτουργία అనే పదాల సమూహం బలి-ఆరాధన రూపకాన్ని బలంగా సూచిస్తుంది; అందువల్ల దాన్ని సాధారణ సేవగా చదును చేయలేదు.
- issue: τῆς πίστεως ὑμῶν యొక్క సంబంధం
  choice: తెలుగు వాక్యంలో వారి విశ్వాసాన్ని బలి అర్పణతో స్పష్టంగా అనుసంధానించి, ఆరాధనా సేవను కూడా వారిదిగా చూపించాం.
  alternative: ‘మీ విశ్వాసానికి సంబంధించిన బలి అర్పణ మరియు సేవ’ అని రెండు నామవాచకాలనూ ఒకే జనిటివ్‌కు సమంగా కట్టడం.
  rationale: గ్రీకు వ్యాకరణంలో πίστεως రెండు సమన్విత నామవాచకాలతో సంబంధం కలిగి ఉండవచ్చు. ప్రధాన పాఠ్యం అర్థవంతమైన సహజ తెలుగును ఇస్తుంది; అయితే విశ్వాసమే అర్పణ అనే బలి రూపకాన్ని అతిగా సిద్ధాంతీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘పానార్పణ,’ ‘బలి అర్పణ,’ ‘ఆరాధనా సేవ’ అనే పదాలు మూలంలోని ఆరాధనా రూపకాన్ని నిలుపుతాయి. పునరుక్తిగా అనిపించినా χαίρω–συγχαίρω పదబంధాన్ని ‘ఆనందిస్తున్నాను; ... కలిసి ఆనందిస్తున్నాను’గా ఉంచి మూలంలోని వాక్చాతుర్యాన్ని కాపాడాం.
