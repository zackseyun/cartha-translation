  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πέποιθα δὲ ἐν κυρίῳ ὅτι καὶ αὐτὸς ταχέως ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/024.yaml
  text: I am confident in the Lord that I myself will also come soon.
translation:
  language: te
  text: ప్రభువులో, నేను కూడా స్వయంగా త్వరలోనే వస్తానని నాకు నమ్మకం ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ‘ప్రభువులో నేను నమ్మకంగా ఉన్నాను: నేను కూడా స్వయంగా త్వరలోనే వస్తాను.’'
    reason: πέποιθα అనే పరిపూర్ణ రూపాన్ని ‘నాకు నమ్మకం ఉంది’కి బదులుగా స్థిరమైన నమ్మకస్థితిని సూచించే ‘నేను నమ్మకంగా ఉన్నాను’గా కూడా వ్యక్తపరచవచ్చు.
lexical_decisions:
- source_word: πέποιθα
  choice: నాకు నమ్మకం ఉంది
  rationale: పరిపూర్ణ కాల రూపం స్థిరపడిన ప్రస్తుత నమ్మకస్థితిని సూచిస్తుంది; ఈ తెలుగు ప్రయోగం సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: —
  rationale: ఇది స్వల్ప అనుసంధాన అవ్యయం; తెలుగులో ప్రత్యేక పదంగా అనువదించకుండా వాక్యప్రవాహంలో దాని కొనసాగింపు భావాన్ని ఇమిడ్చాం.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: పౌలు సాధారణంగా వాడే ఈ ప్రయోగం నమ్మకానికి ప్రభువే పరిధి లేదా ఆధారం అనే భావాన్ని నిలుపుతుంది.
- source_word: ὅτι
  choice: ':'
  rationale: పౌలు నమ్ముతున్న విషయాన్ని సహజమైన తెలుగు నిర్మాణంలో ద్విబిందువు పరిచయం చేస్తుంది.
- source_word: καὶ αὐτὸς
  choice: నేను కూడా … స్వయంగా
  rationale: καί లోని అదనపు భావాన్నీ, αὐτός లోని వ్యక్తిగత ఉద్ఘాటననూ రెండింటినీ నిలుపుతుంది; తిమోతితో పాటు పౌలు స్వయంగా రావడాన్ని సూచిస్తుంది.
- source_word: ταχέως
  choice: త్వరలోనే
  rationale: ఇక్కడ ప్రయాణ వేగం కంటే కాలసామీప్యం ఉద్దేశించబడింది; ‘త్వరలోనే’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐλεύσομαι
  choice: వస్తాను
  rationale: ἔρχομαι యొక్క భవిష్యత్ రూపానికి సాధారణ అర్థం ‘వస్తాను’; ఫిలిప్పీయుల వైపు పౌలు రానున్నాడనే మూలపాఠ దృక్కోణాన్ని నిలుపుతుంది.
- source_word: κυρίῳ
  choice: ప్రభువు
  rationale: κύριος కు గౌరవప్రదమైన, సాధారణ క్రైస్తవ తెలుగు సమానార్థకం ‘ప్రభువు’; పౌలు వాడుకకు ఇక్కడ సరిపోతుంది.
theological_decisions:
- issue: పౌలు నమ్మకానికి ‘ప్రభువులో’ అనే మాటతో ఉన్న సంబంధం
  choice: ‘ప్రభువులో నాకు నమ్మకం ఉంది’ అని అనువదించి, పౌలు ఆశ ప్రభువులో ఆధారపడినదని నిలుపాం.
  alternative: ‘నేను ప్రభువును నమ్ముతున్నాను—నేను కూడా త్వరలోనే స్వయంగా వస్తానని’
  rationale: గ్రీకు పదబంధం ప్రభువుతో ఏకత్వంలోని పరిధిని లేదా ప్రభువుపై ఆధారపడిన నమ్మకాన్ని సూచించవచ్చు. ఎంచుకున్న అనువాదం దీనిని వ్యక్తిగత ఆశావాదంగా తగ్గించదు; అదే సమయంలో ఇది నేరుగా లభించిన దైవిక ప్రకటన అని అతిగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘నేను కూడా … స్వయంగా’ ద్వారా καὶ αὐτός లోని అదనపు భావం మరియు వ్యక్తిగత ఉద్ఘాటన రెండూ స్పష్టంగా నిలిచాయి; ‘ప్రభువులో’ అనే పౌలు శైలిని యథాతథంగా సంరక్షించాం.
