translation:
  language: te
  text: తద్వారా యేసు నామంలో[a] పరలోకంలో ఉన్నవారిలోనూ, భూమిమీద ఉన్నవారిలోనూ, భూమి కింద ఉన్నవారిలోనూ ప్రతి మోకాలు వంగేలా[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యేసు నామం ఎదుట.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘పరలోక సంబంధులు, భూసంబంధులు, భూమి కిందివారు’; వీరు ఎవరనే విషయాన్ని గ్రీకు పాఠం మరింత స్పష్టంగా నిర్దేశించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: తద్వారా … వంగేలా
  rationale: ముందటి వాక్యం నుంచి వచ్చే ఉద్దేశం లేదా ఫలితాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; గ్రీకు పదంలోని ఉద్దేశార్థాన్ని అనవసరంగా ఒకే విధంగా పరిమితం చేయదు.
- source_word: ἐν τῷ ὀνόματι Ἰησοῦ
  choice: యేసు నామం ఎదుట
  rationale: నమస్కార చర్యతో కలిసివచ్చిన ఈ సందర్భంలో యేసు నామానికి ప్రతిస్పందనగా చూపే గౌరవాన్ని సహజంగా వ్యక్తం చేస్తుంది. ‘యేసు నామంలో’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: πᾶν γόνυ
  choice: ప్రతి మోకాలు
  rationale: సార్వత్రిక విధేయతను చూపే స్పష్టమైన శారీరక రూపకాన్ని యథాతథంగా నిలుపుతుంది; ‘ప్రతి వ్యక్తి’ అని వివరణాత్మకంగా మార్చదు.
- source_word: κάμψῃ
  choice: వంగేలా
  rationale: ἵνα తరువాత వచ్చిన అయోరిస్ట్ సబ్జంక్టివ్‌ను తెలుగు ప్రయోజన/ఫలిత నిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది; ఇక్కడ ‘వంగడం’ గౌరవపూర్వక నమస్కారాన్ని సూచిస్తుంది.
- source_word: ἐπουρανίων
  choice: పరలోకంలో ఉన్నవారిలోనూ
  rationale: విశేషణాన్ని వ్యక్తులను సూచించే నామవాచక ప్రయోగంగా గుర్తిస్తూ, వారి ఖచ్చితమైన గుర్తింపును నిర్దేశించకుండా పరలోక పరిధిని తెలియజేస్తుంది.
- source_word: ἐπιγείων
  choice: భూమిమీద ఉన్నవారిలోనూ
  rationale: మూడు భాగాల సమాంతర నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతూ భూలోక పరిధిని వ్యక్తం చేస్తుంది.
- source_word: καταχθονίων
  choice: భూమి కింద ఉన్నవారిలోనూ
  rationale: ‘పాతాళం’ వంటి మరింత వ్యాఖ్యానాత్మక పదాన్ని చేర్చకుండా గ్రీకులోని స్థలసంబంధ చిత్రాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων అనే మూడు భాగాల పరిధి
  choice: సృష్టి అంతటినీ ఆవరించే విశ్వవ్యాప్త పరిధిని నిలుపుతూ, ఆయా వర్గాల్లో ఉన్నవారు ఎవరనే విషయాన్ని వాక్యం చెప్పినదానికంటే ఎక్కువగా నిర్దేశించలేదు.
  alternative: దేవదూతలు, మనుషులు, మృతులు లేదా దయ్యాలు అని వర్గాలను స్పష్టంగా పేరు పెట్టడం.
  rationale: వాక్యం యేసుకు జరిగే సార్వత్రిక నమస్కారాన్ని ప్రధానంగా చెబుతుంది. గ్రీకు పాఠం నిర్బంధించని గుర్తింపులను అనువాదంలో చేర్చకపోవడం దాని విస్తృతిని, ఉద్వేగాన్ని కాపాడుతుంది.
- issue: ἐν τῷ ὀνόματι అనే ప్రయోగంలోని సంబంధం
  choice: ప్రధాన పాఠంలో ‘యేసు నామం ఎదుట’ అని ఇచ్చి, ‘యేసు నామంలో’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం.
  alternative: ‘యేసు నామంలో’ అని మాత్రమే అనువదించి, అధికారంతో లేదా ప్రతినిధిత్వంతో చేసే చర్యగా పాఠకుడు గ్రహించే అవకాశాన్ని తెరవడం.
  rationale: నమస్కార సందర్భంలో ‘నామం ఎదుట’ గౌరవప్రతిస్పందనను బాగా తెలియజేస్తుంది; అయితే ἐν యొక్క నిజమైన భాషాత్మక సాధ్యతను తొలగించకుండా ప్రత్యామ్నాయాన్ని నమోదు చేయాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవభరితమైన శైలి. ‘ప్రతి మోకాలు’ అనే మూలపాఠ చిత్రాన్ని నిలిపి, మూడు వర్గాలకు ‘ఉన్నవారిలోనూ’ అనే సమాంతర రూపం వాడబడింది. ఈ వచనం ముందటి వాక్యంపై ఆధారపడే ఉపవాక్యం కావడంతో చివర కామా ఉంచబడింది.
