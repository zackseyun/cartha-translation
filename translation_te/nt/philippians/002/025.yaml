id: PHP.2.25
reference: Philippians 2:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀναγκαῖον δὲ ἡγησάμην Ἐπαφρόδιτον τὸν ἀδελφὸν καὶ συνεργὸν καὶ συστρατιώτην μου, ὑμῶν δὲ ἀπόστολον καὶ λειτουργὸν τῆς χρείας μου, πέμψαι πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/025.yaml
  text: But I considered it necessary to send to you Epaphroditus—my brother and fellow worker and fellow soldier[b][a], and your messenger and minister to my need—
translation:
  language: te
  text: అయితే, నా సహోదరుడూ, తోటి పనివాడూ, తోటి సైనికుడూ, మీ దూతా, నా అవసరానికి సేవచేసేవాడూ అయిన ఎపఫ్రొదితును మీ దగ్గరికి పంపడం అవసరమని నేను భావించాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναγκαῖον
  choice: అవసరమని
  rationale: ἡγησάμηνతో కలిసి, పౌలు దానిని అవసరమైనదిగా నిర్ణయించుకున్నాడనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἡγησάμην
  choice: నేను భావించాను
  rationale: ఇది కేవలం ఒక ఊహను కాక, పౌలు చేసిన ఆలోచనాత్మక అంచనాను సూచిస్తుంది.
- source_word: πέμψαι
  choice: పంపడం
  rationale: మూలపాఠంలో ఉన్న ‘పంపడం’ అనే అర్థాన్నే ఉంచి, సందర్భం ఆధారంగా ‘తిరిగి పంపడం’ అని విస్తరించలేదు.
- source_word: ἀδελφὸν
  choice: సహోదరుడు
  rationale: తోటి విశ్వాసిని సూచించే కుటుంబసంబంధ రూపకాన్ని నేరుగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: συνεργὸν
  choice: తోటి పనివాడు
  rationale: పౌలుతో కలిసి సేవలో శ్రమించే వ్యక్తిని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: συστρατιώτην
  choice: తోటి సైనికుడు
  rationale: గ్రీకు పాఠంలోని సైనిక రూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: ἀπόστολον
  choice: మీ దూత
  rationale: ఇక్కడ ఫిలిప్పీయులు పంపిన ప్రతినిధి అనే విస్తృత అర్థం సందర్భానికి సరిపోతుంది; అధికారిక అపొస్తల పదవిని అనవసరంగా ఆపాదించదు.
- source_word: λειτουργὸν
  choice: సేవచేసేవాడు
  rationale: ఆధునిక సంఘపదవిని సూచించకుండా, అవసరాన్ని తీర్చే గౌరవప్రదమైన సేవను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τῆς χρείας μου
  choice: నా అవసరంలో నాకు
  rationale: ఎపఫ్రొదితు చేసిన సేవ పౌలు అవసరానికి సంబంధించినదని స్పష్టంగా తెలియజేస్తుంది; మూలంలోని సంబంధాన్ని అతిగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: ἀπόστολον అనే పదాన్ని అధికారిక అర్థంలో ‘అపొస్తలుడు’గా అనువదించాలా, లేక విస్తృత అర్థంలో ‘దూత’గా అనువదించాలా
  choice: మీ దూత
  alternative: మీ అపొస్తలుడు—అంటే, మీరు పంపినవాడు
  rationale: తక్షణ సందర్భంలో ఎపఫ్రొదితు ఫిలిప్పీయులచేత పౌలు దగ్గరకు పంపబడిన ప్రతినిధి. ‘దూత’ అనే అనువాదం పంపబడిన వ్యక్తి అనే భావాన్ని నిలుపుతూ, పన్నెండు అపొస్తలులతో సమానమైన అధికారిక పదవిని సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. గ్రీకు వాక్యంలోని వరుస గౌరవసూచక పదాలను నిలుపుతూ, తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా ప్రధాన క్రియను చివర ఉంచాం. ‘తోటి సైనికుడు’ అనే రూపకాన్ని సున్నితపరచకుండా అలాగే నిలిపాం.
