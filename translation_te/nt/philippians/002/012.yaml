id: PHP.2.12
reference: Philippians 2:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὥστε, ἀγαπητοί μου, καθὼς πάντοτε ὑπηκούσατε, μὴ ὡς ἐν τῇ παρουσίᾳ μου μόνον ἀλλὰ νῦν πολλῷ μᾶλλον ἐν τῇ ἀπουσίᾳ μου, μετὰ φόβου καὶ τρόμου τὴν ἑαυτῶν σωτηρίαν κατεργάζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/012.yaml
  text: So then[a], my beloved, just as you have always obeyed—not only in my presence, but now much more in my absence—work out your own salvation with fear and trembling[c][b],
translation:
  language: te
  text: కాబట్టి, నా ప్రియులారా, మీరు ఎల్లప్పుడూ విధేయత చూపినట్లే—నేను మీతో ఉన్నప్పుడు మాత్రమే కాదు, ఇప్పుడు నేను మీతో లేనప్పుడు మరింతగా[a]—భయంతోను వణుకుతోను[c] మీ సొంత రక్షణను కార్యరూపంలోకి తీసుకురండి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను మీతో లేనప్పుడు ఇంకెంతో ఎక్కువగా.”
    reason: lexical_alternative
  - marker: b
    text: “కార్యరూపంలోకి తీసుకురండి” అంటే రక్షణను సంపాదించుకోవడం కాదు; దానిని జీవితంలో ఆచరణలో వ్యక్తపరచడం.
    reason: alternative_reading
  - marker: c
    text: “భయంతోను వణుకుతోను” అనేది దేవుని ఎదుట భక్తిగౌరవంతో కూడిన విస్మయాన్ని, గంభీరమైన వినయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: కాబట్టి
  rationale: ముందున్న క్రీస్తు గురించిన బోధన నుంచి ఈ ఆజ్ఞకు వచ్చే తార్కిక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ἀγαπητοί μου
  choice: నా ప్రియులారా
  rationale: పౌలు చూపే ఆప్యాయమైన సంబోధనను గౌరవప్రదంగా, సహజంగా నిలుపుతుంది.
- source_word: καθὼς πάντοτε ὑπηκούσατε
  choice: మీరు ఎప్పుడూ విధేయత చూపినట్లే
  rationale: వారి గత ప్రవర్తనలో స్థిరంగా కనిపించిన విధేయతను, ప్రస్తుతం ఇచ్చే ప్రోత్సాహంతో అనుసంధానిస్తుంది.
- source_word: παρουσίᾳ / ἀπουσίᾳ
  choice: నేను మీ దగ్గర ఉన్నప్పుడు / ఇప్పుడు నేను దూరంగా ఉన్నప్పుడు
  rationale: గ్రీకు నామవాచకాల మధ్యనున్న వ్యతిరేకతను తెలుగులో సహజమైన వాక్యరూపంతో స్పష్టంగా అందిస్తుంది.
- source_word: πολλῷ μᾶλλον
  choice: మరింతగా
  rationale: ఆయన లేని సమయంలో వారి విధేయత ఇంకా ఎక్కువగా ఉండాలనే తీవ్రతను సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: భయంతో, వణకుతో
  rationale: మూలంలోని గంభీరతను తగ్గించకుండా, స్థిరపడిన జంటపదాల భావాన్ని నిలుపుతుంది.
- source_word: τὴν ἑαυτῶν σωτηρίαν
  choice: మీ సొంత రక్షణను
  rationale: σωτηρία యొక్క ధార్మిక ప్రాధాన్యాన్ని ‘రక్షణ’తోను, ἑαυτῶνలోని స్వీయ బాధ్యత ఉద్ఘాటనను ‘సొంత’తోను నిలుపుతుంది; ఇది ఒంటరి వ్యక్తివాదాన్ని తప్పనిసరిగా సూచించదు.
- source_word: κατεργάζεσθε
  choice: కార్యరూపంలో కొనసాగించండి
  rationale: రక్షణను కేవలం సంపాదించమనే భావం రాకుండా, దానిని జీవితంలో ఆచరణకు తీసుకువచ్చి కొనసాగించాలనే క్రియాశీల భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ‘మీ సొంత రక్షణను కార్యరూపంలో కొనసాగించండి’ అనే ఆజ్ఞ యొక్క భావం
  choice: రక్షణను జీవితంలో ఆచరణకు తీసుకువచ్చి కొనసాగించాలనే ఉద్బోధగా అనువదించబడింది.
  alternative: మానవ ప్రయత్నంతో రక్షణను సంపాదించుకోండి లేదా సాధించండి.
  rationale: κατεργάζεσθε ఏదో ఒకదాన్ని కార్యసిద్ధికి తీసుకురావడం లేదా ఆచరణలో కొనసాగించడం అనే భావాన్ని కలిగి ఉంది; తదుపరి వచనం దేవుడు వారిలో పనిచేస్తున్నాడని చెబుతుంది. అయినా, మూలపాఠంలోని మానవ బాధ్యత మరియు దేవుని కార్యం మధ్యనున్న ఉద్వేగాన్ని పూర్తిగా పరిష్కరించకుండా ఉంచాం.
- issue: ‘భయంతో, వణకుతో’ అనే పదబంధం యొక్క బలం
  choice: దేవుని ఎదుట గాఢమైన భక్తిగౌరవం, గంభీరత, వినయాన్ని మోసే మూలపదబంధాన్ని యథాతథ భావంతో నిలిపాం.
  alternative: కేవలం భయభ్రాంతి; లేదా భావోద్వేగ బలం లేని సాధారణ గౌరవం.
  rationale: φόβος καὶ τρόμος అనే జంటపదం బలమైన గంభీరతను వ్యక్తం చేస్తుంది. దాన్ని మృదువుగా మార్చకుండా ఉంచి, ఉద్దేశించిన భావపరిధిని పాదసూచికలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ఆప్యాయతతో కూడిన, గౌరవప్రదమైన ఉపదేశ శైలి వాడబడింది. పొడవైన గ్రీకు వాక్య నిర్మాణాన్ని డాష్‌లతో స్పష్టంచేసి, ‘సన్నిధి/అనుపస్థితి’ వంటి పాండిత్య పదాల బదులు సాధారణ పాఠకులకు సహజమైన ‘దగ్గర ఉన్నప్పుడు/దూరంగా ఉన్నప్పుడు’ రూపాలు ఎంచుకున్నాం.
