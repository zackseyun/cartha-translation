revisions:
- from: కాబట్టి, నా ప్రియులారా, మీరు ఎప్పుడూ విధేయత చూపినట్లే—నేను మీ దగ్గర ఉన్నప్పుడు మాత్రమే కాదు, ఇప్పుడు నేను దూరంగా ఉన్నప్పుడు మరింతగా[a]—భయంతో, వణకుతో[c] మీ సొంత రక్షణను కార్యరూపంలో కొనసాగించండి[b].
  to: కాబట్టి, నా ప్రియులారా, మీరు ఎల్లప్పుడూ విధేయత చూపినట్లే—నేను మీతో ఉన్నప్పుడు మాత్రమే కాదు, ఇప్పుడు నేను మీతో లేనప్పుడు మరింతగా[a]—భయంతోను వణుకుతోను[c] మీ సొంత రక్షణను కార్యరూపంలోకి తీసుకురండి[b].
  rationale: The revision removes the added durative nuance in 'కొనసాగించండి,' clarifies the presence/absence contrast, and uses idiomatic Telugu for 'fear and trembling.' Footnote anchors are retained and placed directly after the expressions they explain. The explanatory footnote continues to distinguish 'work out' from earning salvation without making that interpretation part of the verse itself.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:03:49Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the inferential transition, affectionate address, established obedience, the contrast between Paul’s presence and absence, personal responsibility ('your own'), and the solemn phrase 'with fear and trembling.' However, 'కార్యరూపంలో కొనసాగించండి' adds an explicit continuing sense not supplied by κατεργάζεσθε and is less idiomatic for the imperative here. 'దూరంగా ఉన్నప్పుడు' can suggest physical distance rather than Paul's absence from them.
  naturalness: 'The revision uses natural modern-standard Telugu: ''నేను మీతో ఉన్నప్పుడు/లేనప్పుడు'' clearly conveys presence and absence, and ''భయంతోను వణుకుతోను'' is the idiomatic paired expression. ''కార్యరూపంలోకి తీసుకురండి'' is clearer and more natural than ''కార్యరూపంలో కొనసాగించండి.'''
  terminology: '''రక్షణ'' appropriately retains the theological force of σωτηρία. ''నా ప్రియులారా'' is a warm, suitable vocative. The revised wording does not resolve the theological tension of the command beyond the explanatory footnote.'
  issues:
  - severity: medium
    issue: The rendering of κατεργάζεσθε includes 'కొనసాగించండి.'
    rationale: The Greek imperative calls readers to effect, carry through, or work out their salvation; it does not explicitly state 'continue.' This addition can narrow the verb’s semantic range.
  - severity: low
    issue: '''దూరంగా ఉన్నప్పుడు'' is not the clearest equivalent for ἐν τῇ ἀπουσίᾳ μου.'
    rationale: It can mean merely being geographically far away. 'నేను మీతో లేనప్పుడు' directly expresses Paul's absence while retaining natural Telugu.
  - severity: low
    issue: The form 'వణకుతో' is less idiomatic in this paired expression.
    rationale: '''వణుకుతో'' is the standard natural form for ''with trembling.'''
  revised_text: కాబట్టి, నా ప్రియులారా, మీరు ఎల్లప్పుడూ విధేయత చూపినట్లే—నేను మీతో ఉన్నప్పుడు మాత్రమే కాదు, ఇప్పుడు నేను మీతో లేనప్పుడు మరింతగా[a]—భయంతోను వణుకుతోను[c] మీ సొంత రక్షణను కార్యరూపంలోకి తీసుకురండి[b].
