translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘సమమనస్కుడు’ కొంత సాహిత్య ఛాయ కలిగినప్పటికీ ἰσόψυχον యొక్క అరుదైన, గాఢమైన భావాన్ని నిలుపుతుంది; పాదసూచి దాని అర్థాన్ని వివరిస్తుంది. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
