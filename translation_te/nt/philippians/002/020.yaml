  yaml_path: translation/nt/philippians/002/020.yaml
  text: For I have no one like him who will genuinely care about your welfare[b][a],
translation:
  language: te
  text: ఎందుకంటే, మీ సంగతుల గురించి నిజంగా శ్రద్ధ వహించే[b] సమమనస్కుడు[a] నాకు ఎవరూ లేరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరొక విధంగా: “నాతో ఒకే మనోభావం గలవాడు”; అక్షరార్థంగా, “సమాన ఆత్మ గలవాడు.”'
    reason: lexical_alternative
  - marker: b
    text: 'మరొక విధంగా: “మీకు సంబంధించిన విషయాల పట్ల నిజంగా శ్రద్ధ వహించేవాడు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న సందర్భానికి ఈ వాక్యం ఇచ్చే వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: οὐδένα ... ἔχω
  choice: నాకు మరెవరూ లేరు
  rationale: తిమోతిని గురించి కొనసాగుతున్న సందర్భంలో గ్రీకు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘మరెవరూ’ అనేది సందర్భసిద్ధమైన అర్థాన్ని స్పష్టం చేస్తుంది.
- source_word: ἰσόψυχον
  choice: సమమనస్కుడు
  rationale: ‘సమానమైన ఆత్మ/మనస్సు గలవాడు’ అనే అరుదైన సమాసపద భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా తెలుపుతుంది; పౌలుతో తిమోతికి ఉన్న అంతరంగ దృక్పథ సారూప్యతను కాపాడుతుంది.
- source_word: ὅστις
  choice: చూపగల
  rationale: ఇక్కడ అటువంటి వ్యక్తి యొక్క లక్షణాన్ని తెలిపే సంబంధవాచక నిర్మాణాన్ని తెలుగులో సహజంగా కలుపుతుంది.
- source_word: γνησίως
  choice: నిజమైన
  rationale: కృత్రిమం కాని, హృదయపూర్వకమైన శ్రద్ధ అనే భావాన్ని అందిస్తుంది.
- source_word: τὰ περὶ ὑμῶν
  choice: మీ సంగతుల గురించి
  rationale: ‘మిమ్మల్ని గురించిన విషయాలు’ అనే గ్రీకు విస్తృతతను కాపాడుతుంది; కేవలం క్షేమానికే భావాన్ని పరిమితం చేయదు.
- source_word: μεριμνήσει
  choice: శ్రద్ధ చూపగల
  rationale: ఈ సందర్భంలో ఆందోళనకన్నా సానుకూలమైన పాస్టరల్ ఆసక్తి, శ్రద్ధ అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
