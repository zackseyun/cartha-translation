id: PHP.2.8
reference: Philippians 2:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐταπείνωσεν ἑαυτὸν γενόμενος ὑπήκοος μέχρι θανάτου, θανάτου δὲ σταυροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/008.yaml
  text: he humbled himself[b][a], becoming obedient to the point of death—even death on a cross.
translation:
  language: te
  text: మరణం వరకు—అదీ, సిలువపై మరణం వరకు—విధేయుడై, ఆయన తనను తాను తగ్గించుకున్నాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరణానికి లోనయ్యేంతగా”; ఆయన విధేయత మరణం దాకా, మరణానికే లోనయ్యే వరకు సాగిందని ఈ మాట సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మరణం—అదీ సిలువది”; భావం, “అదీ సిలువపై మరణం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταπείνωσεν
  choice: తగ్గించుకొని
  rationale: కర్త స్వచ్ఛందంగా తనను తాను తగ్గించుకున్నాడనే క్రియాశీల భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἑαυτὸν
  choice: తనను తాను
  rationale: మూలంలోని స్పష్టమైన ఆత్మవాచక సర్వనామాన్ని నిలిపి, స్వచ్ఛంద స్వయంతగ్గింపును నొక్కిచెబుతుంది.
- source_word: γενόμενος
  choice: విధేయుడయ్యాడు
  rationale: γενόμενος ὑπήκοος అనే భాగాన్ని తెలుగులో సహజంగా ఏకీకరించి, ‘విధేయుడిగా అయ్యాడు’ అనే భావాన్ని అందిస్తుంది.
- source_word: ὑπήκοος
  choice: విధేయుడు
  rationale: ఆజ్ఞకు లోబడే గుణాన్ని స్పష్టంగా తెలిపే ప్రామాణిక, గౌరవప్రదమైన తెలుగు పదం.
- source_word: μέχρι θανάτου
  choice: మరణం వరకు
  rationale: విధేయత మరణం దాకా విస్తరించిందనే భావాన్ని సహజంగా ఉంచుతుంది; ‘మరణానికి దారితీసేలా’ అనే సాధ్యమైన సూక్ష్మభావాన్ని పాదసూచికలో సూచిస్తుంది.
- source_word: δὲ
  choice: అదీ
  rationale: సాధారణ మరణం మాత్రమే కాదు, ప్రత్యేకంగా సిలువ మరణమే అనే ఉద్ధాటనను తెలుగు వాక్చాతుర్యంతో తెలియజేస్తుంది.
- source_word: σταυροῦ
  choice: సిలువ మరణం
  rationale: సంక్షిప్తమైన గ్రీకు ‘సిలువకు చెందిన మరణం’ అనే నిర్మాణాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, సిలువ వేయబడటంలోని స్పష్టతను నిలుపుతుంది.
theological_decisions:
- issue: μέχρι θανάτου యొక్క పరిధి
  choice: మరణం వరకు
  alternative: మరణానికి లోనయ్యేంతగా / మరణం దాకా
  rationale: విధేయత మరణం వరకు సాగిందనే ప్రధాన భావాన్ని నిలుపుతూ, మరణమే ఆ విధేయతకు పరాకాష్ఠ అన్న ఉద్వేగాన్ని కాపాడుతుంది.
- issue: θανάτου δὲ σταυροῦ యొక్క బలం
  choice: అదీ సిలువ మరణం వరకు
  alternative: అవును, సిలువ మరణం వరకు / సిలువపై మరణం వరకు
  rationale: δέ ఇక్కడ కలిగించే ఉద్ధాటనను ‘అదీ’ సహజంగా వ్యక్తం చేస్తుంది; అదనపు సిద్ధాంత వివరణను చేర్చకుండా సిలువ మరణంలోని దిగ్భ్రాంతికర పరాకాష్ఠను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘తనను తాను’ మూలంలోని స్వచ్ఛంద స్వయంతగ్గింపును స్పష్టంగా ఉంచుతుంది; ‘అదీ’ చివరి పదబంధంలోని ఉద్ధాటనను కాపాడుతుంది.
