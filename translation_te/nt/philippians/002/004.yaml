translation:
  language: te
  text: మీలో ప్రతివాడూ తన సొంత ప్రయోజనాలను మాత్రమే చూసుకోకుండా, ఇతరుల ప్రయోజనాలను కూడా చూసుకోవాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “ప్రతివాడూ తన సొంత విషయాలనే మాత్రమే గమనించకుండా, ఇతరుల విషయాలను కూడా గమనించాలి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοποῦντες
  choice: చూసుకోవాలి
  rationale: ఇక్కడ σκοπέω శ్రద్ధను, శ్రేయస్సుపట్ల జాగ్రత్తను సూచిస్తుంది. ‘చూసుకోవాలి’ ఆధునిక తెలుగులో ఆ క్రియాశీల శ్రద్ధను సహజంగా తెలియజేస్తుంది.
- source_word: τὰ ἑαυτῶν
  choice: తన సొంత ప్రయోజనాలను
  rationale: నపుంసక బహువచన ప్రయోగం కేవలం ఆస్తులను కాకుండా వ్యక్తికి సంబంధించిన విషయాలు, అవసరాలు, ప్రయోజనాలు అన్నింటినీ విస్తృతంగా సూచిస్తుంది.
- source_word: ἕκαστοι
  choice: మీలో ప్రతివాడూ
  rationale: ἕκαστοι సమూహంలోని ఒక్కొక్కరిని విడివిడిగా ఉద్దేశించే విభజనాత్మక భావాన్ని కలిగిస్తుంది.
- source_word: ἀλλὰ καὶ
  choice: మాత్రమే ... కాకుండా ... కూడా
  rationale: ఈ తెలుగు నిర్మాణం వ్యత్యాసాన్నీ, అదనపు బాధ్యతనూ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὰ ἑτέρων
  choice: ఇతరుల ప్రయోజనాలను
  rationale: ఈ పదబంధం ఇతరులకు చెందిన వస్తువులకే పరిమితం కాకుండా వారి అవసరాలు, విషయాలు, శ్రేయస్సును విస్తృతంగా సూచిస్తుంది.
theological_decisions:
- issue: సొంత ప్రయోజనాల పట్ల శ్రద్ధను పూర్తిగా నిషేధిస్తున్నదా?
  choice: ‘మాత్రమే ... కాకుండా ... కూడా’ అని అనువదించి, సొంత ప్రయోజనాలతో పాటు ఇతరుల ప్రయోజనాలను చూడాలనే భావాన్ని తెలిపింది.
  alternative: ‘తన సొంత విషయాలను చూడకుండా, ఇతరుల విషయాలను చూడాలి’
  rationale: గ్రీకు పాఠంలోని μὴ ... ἀλλὰ καὶ నిర్మాణంలో καὶ ఇతరుల విషయాల పట్ల శ్రద్ధను అదనంగా చేర్చుతుంది; అందువల్ల సొంత అవసరాలన్నిటినీ విస్మరించాలనే అర్థాన్ని బలవంతంగా రుద్దకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ప్రయోజనాలు’ అనేది ‘విషయాలు’ కంటే సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది; అక్షరార్థ రూపాన్ని పాదటిప్పణిలో నిలిపాం.
