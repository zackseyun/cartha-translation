  text: σπουδαιοτέρως οὖν ἔπεμψα αὐτὸν ἵνα ἰδόντες αὐτὸν πάλιν χαρῆτε κἀγὼ ἀλυπότερος ὦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/028.yaml
  text: Therefore I sent him all the more eagerly, so that when you see him again you may rejoice, and I may be less distressed.
translation:
  language: te
  text: కాబట్టి, మీరు అతన్ని మళ్లీ చూసి సంతోషించాలనీ, నేను కూడా తక్కువ దుఃఖంతో ఉండాలనీ, అతన్ని మరింత ఉత్సాహంతో పంపాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπουδαιοτέρως
  choice: మరింత ఆతురతతో
  rationale: తులనాత్మక క్రియావిశేషణంలోని అధిక ఆసక్తి, త్వరగా పంపాలనే తపన రెండింటినీ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాక్యాలతో ఉన్న తార్కిక అనుసంధానాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἔπεμψα
  choice: నేను అతన్ని ... పంపాను
  rationale: గ్రీకు ఏకకాల భూతరూపాన్ని సందర్భానుకూలమైన సాధారణ భూతకాలంతో అనువదిస్తుంది.
- source_word: ἵνα
  choice: '...అనీ'
  rationale: తెలుగులో ఉద్దేశాన్ని సహజంగా తెలిపే నిర్మాణం; తరువాతి రెండు ఆశించిన ఫలితాలను కలుపుతుంది.
- source_word: ἰδόντες
  choice: మీరు అతన్ని ... చూసి
  rationale: ఉద్దేశ వాక్యంలో χαρῆτεకు సంబంధించిన పూర్వకాలిక పరిస్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: ఎపఫ్రొదితును తిరిగి చూడడాన్ని సూటిగా సూచిస్తుంది.
- source_word: χαρῆτε
  choice: సంతోషించాలనీ
  rationale: ఉద్దేశార్థక విధిని నిలుపుతూ χαίρω యొక్క ఆనంద భావాన్ని సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: κἀγὼ
  choice: నా
  rationale: ‘మరియు నేను’ అనే సమన్వయ భావాన్ని తెలుగులో రెండవ ఉద్దేశ వాక్యాన్ని సహజంగా కలపడం ద్వారా వ్యక్తం చేస్తుంది.
- source_word: ἀλυπότερος
  choice: నా దుఃఖం కొంత తగ్గాలని
  rationale: ‘తక్కువ దుఃఖంతో ఉండడం’ అనే తులనాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; దుఃఖాన్ని ఆందోళనగా మాత్రమే పరిమితం చేయదు.
- source_word: ὦ
  choice: '...తగ్గాలని'
  rationale: ‘నేను తక్కువ దుఃఖంతో ఉండాలి’ అనే గ్రీకు స్థితిని తెలుగులో సహజమైన భావవాచక నిర్మాణంతో అందిస్తుంది.
