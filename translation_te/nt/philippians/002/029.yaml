  text: So welcome him in the Lord with all joy[a], and hold people like him in honor.
translation:
  language: te
  text: కాబట్టి ప్రభువులో అతణ్ణి పూర్తి ఆనందంతో స్వాగతించండి, అలాంటి వారిని గౌరవించండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు మూలంలో ఇక్కడ పురుషలింగ బహువచన రూపం ఉంది; దీనిని ‘అలాంటి పురుషులను’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέχεσθε
  choice: స్వాగతించండి
  rationale: ఇది కేవలం అంగీకరించడం కాకుండా, ఆప్యాయంగా చేర్చుకోవాలనే ఆజ్ఞ యొక్క భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందున్న విషయాల నుంచి వచ్చే నిర్ధారణాత్మక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: పౌలు వాడే సంక్షిప్తమైన సంబంధాత్మక, ఆధ్యాత్మిక పదబంధాన్ని వ్యాఖ్యానించి పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: μετὰ πάσης χαρᾶς
  choice: సంపూర్ణ ఆనందంతో
  rationale: πᾶς సూచించే సంపూర్ణతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘ఎంతో ఆనందంతో’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: τοὺς τοιούτους
  choice: అలాంటి వారిని
  rationale: ఎపఫ్రొదితు వంటి స్వభావం, సేవ కలిగిన వ్యక్తులను సూచించే వర్గార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐντίμους ἔχετε
  choice: గౌరవనీయులుగా ఎంచండి
  rationale: వారిని గౌరవానికి పాత్రులుగా భావించి ఆదరించాలనే భావాన్ని మూలంలోని ‘కలిగి ఉండండి/పరిగణించండి’ నిర్మాణానికి దగ్గరగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపాలు వాడబడ్డాయి. ‘ప్రభువులో’ అనే పౌలు ప్రత్యేక పదబంధం వివరణాత్మక విస్తరణ లేకుండా నిలుపబడింది. ప్రధాన పాఠంలోని ‘అలాంటి వారు’ సహజంగా సమూహాన్ని సూచిస్తుండగా, గ్రీకు పురుషలింగ రూపం పాదటిప్పణిలో నమోదు చేయబడింది.
