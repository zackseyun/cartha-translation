  source_fidelity: The draft accurately conveys Epaphroditus’s illness, his proximity to death without asserting death, God’s mercy toward both him and Paul, and the purpose of preventing Paul’s compounded grief. A small wording adjustment better reflects the formal, public-scripture register while retaining the Greek ambiguity and purpose clause.
