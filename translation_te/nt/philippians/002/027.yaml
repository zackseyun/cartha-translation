id: PHP.2.27
reference: Philippians 2:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ γὰρ ἠσθένησεν παραπλήσιον ⸀θανάτῳ· ἀλλὰ ὁ θεὸς ⸂ἠλέησεν αὐτόν⸃, οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ, ἵνα μὴ λύπην ἐπὶ λύπην σχῶ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/027.yaml
  text: For indeed he was sick[a], nearly to death; but God had mercy on him, and not on him only but also on me[b], so that I might not have sorrow upon sorrow.
translation:
  language: te
  text: ఎందుకంటే అతడు నిజంగానే అనారోగ్యపడి, మరణానికి దగ్గరయ్యాడు[a]. అయితే దేవుడు అతని మీద కనికరం చూపించాడు; అతని మీద మాత్రమే కాదు, నా మీద కూడా కనికరం చూపించాడు—నాకు దుఃఖం మీద దుఃఖం కలగకుండా ఉండేలా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరణానికి చాలా దగ్గరగా ఉన్నాడు” లేదా “మరణం వరకు అనారోగ్యపడ్డాడు.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “దుఃఖం మీద దుఃఖం.” ఇది ఒక దుఃఖానికి మరొక దుఃఖం తోడవడాన్ని సూచించే నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: ἠσθένησεν
  choice: జబ్బుపడి
  rationale: సందర్భంలో ἀσθενέω శారీరక అనారోగ్యాన్ని సూచిస్తుంది. ‘జబ్బుపడి’ అనేది సహజమైన ఆధునిక తెలుగు ప్రయోగం; సాధారణ బలహీనత అనే భావాన్ని కలిగించదు.
- source_word: παραπλήσιον θανάτῳ
  choice: చావుకు దగ్గరయ్యాడు
  rationale: ఈ పదబంధం మరణానికి అత్యంత సమీపమైన స్థితిని సూచిస్తుంది. ‘చావుకు దగ్గరయ్యాడు’ సహజంగా ఉండి, అతడు నిజంగా చనిపోయాడనే అర్థాన్ని ఇవ్వదు.
- source_word: ἠλέησεν
  choice: కనికరం చూపించాడు
  rationale: దేవుని కరుణాపూర్వక చర్యను స్పష్టంగా వ్యక్తం చేస్తూ, ἐλεάω యొక్క ధార్మిక బరువును నిలుపుతుంది.
- source_word: οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ
  choice: అతని మీద మాత్రమే కాదు, నా మీద కూడా కనికరం చూపించాడు
  rationale: ముందున్న క్రియను తెలుగులో మళ్లీ పలకడం ద్వారా దేవుని కనికరం ఎపఫ్రొదితుకూ పౌలుకూ వర్తించిందని స్పష్టమవుతుంది; గ్రీకు వ్యత్యాస ఉద్ఘాటన కూడా నిలుస్తుంది.
- source_word: ἵνα μὴ
  choice: కలగకుండా ఉండేందుకు
  rationale: ప్రతికూల ఉద్దేశాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఫలితంగా మాత్రమే చదివేలా చేయకుండా ఉద్దేశార్థాన్ని కాపాడుతుంది.
- source_word: λύπην ἐπὶ λύπην
  choice: దుఃఖం మీద దుఃఖం
  rationale: మూలంలోని పునరుక్తిని, క్రమంగా పెరిగే దుఃఖ భావాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: σχῶ
  choice: కలగకుండా
  rationale: ἔχω యొక్క సందర్భార్థమైన ‘దుఃఖాన్ని కలిగి ఉండడం/అనుభవించడం’ను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుడు చూపిన కనికరం పౌలుకు ఎలా వర్తిస్తుంది
  choice: ఎపఫ్రొదితు స్వస్థత వల్ల పౌలుకు మరొక దుఃఖం కలగకుండా దేవుడు అతని మీద కూడా కనికరం చూపించినట్లు వాక్య నిర్మాణాన్ని నిలుపడం
  alternative: పౌలుపై కనికరం అనేది ప్రత్యేకమైన మరో దైవకార్యమని విడిగా వివరించడం
  rationale: గ్రీకు వాక్యం కనికరాన్ని ఇద్దరికీ అన్వయించినా, దాని కార్యవిధానాన్ని మరింతగా నిర్వచించదు. అందువల్ల మూలంలోని సంబంధాన్ని మాత్రమే నిలిపి, అదనపు సిద్ధాంత వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ఎందుకంటే, నిజంగానే’ ద్వారా καὶ γάρ యొక్క నిర్ధారణాత్మక భావం వ్యక్తమైంది. మూలంలోని ‘దుఃఖం మీద దుఃఖం’ అనే ఉద్దేశపూర్వక పునరుక్తి ప్రధాన పాఠ్యంలోనే నిలుపబడింది; [b] గమనిక దాని నుడికారార్థాన్ని వివరిస్తుంది.
