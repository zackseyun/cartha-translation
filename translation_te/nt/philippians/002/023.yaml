translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. మూలంలోని భవిష్యత్ అనిశ్చితి ‘ఎలా ఉంటుందో’ ద్వారా నిలుపబడింది.
