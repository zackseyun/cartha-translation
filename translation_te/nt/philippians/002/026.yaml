source:
  edition: SBLGNT
  text: ἐπειδὴ ἐπιποθῶν ἦν πάντας ⸀ὑμᾶς, καὶ ἀδημονῶν διότι ἠκούσατε ὅτι ἠσθένησεν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/026.yaml
  text: since he was longing for all of you and was deeply distressed because you heard that he was sick[a].
translation:
  language: te
  text: ఎందుకంటే అతడు మీ అందరి కోసం ఎంతో ఆరాటపడుతూ ఉన్నాడు; అతడు అనారోగ్యానికి గురయ్యాడని మీరు విన్నందువల్ల తీవ్రంగా కలత చెందుతూ ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తాను అనారోగ్యానికి గురయ్యాడని మీరు విన్నారని అతడు విన్నందుకు.”
    reason: కొన్ని వ్యాఖ్యానాలలో ప్రధాన పాఠంలోని ἠκούσατε (‘మీరు విన్నారు’) వెనుక అతడు ఆ సంగతి విన్నాడనే భావం సందర్భం ద్వారా పూరించబడుతుంది; అయితే గ్రీకు పాఠంలో అదనపు ‘అతడు విన్నాడు’ అనే క్రియ స్పష్టంగా లేదు.
lexical_decisions:
- source_word: ἐπειδὴ
  choice: ఎందుకంటే
  rationale: ఎపఫ్రొదితును తిరిగి పంపడానికి గల కారణాన్ని పరిచయం చేసే కారణార్థక ప్రయోగాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπιποθῶν ἦν
  choice: చూడాలని ఎంతో ఆరాటపడుతూ ఉన్నాడు
  rationale: వర్తమాన కృదంతం, εἰμί యొక్క భూతకాల రూపంతో కూడిన పరిభాషాత్మక నిర్మాణం గతంలో కొనసాగిన బలమైన ఆకాంక్షను సూచిస్తుంది. తెలుగులో సందర్భానుగుణంగా ‘చూడాలని’ జోడించడం సహజంగా ఉంది.
- source_word: πάντας ὑμᾶς
  choice: మీ అందరినీ
  rationale: πάντας లోని సమగ్ర ఉద్ఘాటనను స్పష్టంగా నిలుపుతుంది.
- source_word: ἀδημονῶν
  choice: తీవ్రంగా కలత చెందుతూ ఉన్నాడు
  rationale: సాధారణ చింతకన్నా గాఢమైన మానసిక వేదనను సూచించే పదబలాన్ని అతిశయోక్తి లేకుండా వ్యక్తం చేస్తుంది.
- source_word: διότι
  choice: విన్నందుకు
  rationale: అతని కలతకు కారణాన్ని సహజమైన తెలుగు కారణార్థక నిర్మాణంలో తెలియజేస్తుంది.
- source_word: ἠκούσατε
  choice: మీరు విన్నందుకు
  rationale: గ్రీకు కర్తను రెండవ పురుష బహువచనంగానే నిలుపుతూ, సరళ భూతార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: ὅτι ἠσθένησεν
  choice: తాను అనారోగ్యానికి గురయ్యాడని
  rationale: ἀσθενέω ఇక్కడ శారీరక అనారోగ్యాన్ని సూచిస్తుంది; ఆరిస్ట్ రూపంలోని అనారోగ్యానికి లోనైన భావాన్ని సహజంగా తెలియజేస్తుంది.
