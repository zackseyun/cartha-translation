revisions:
- from: ఎందుకంటే, అతడు మీ అందరినీ చూడాలని ఎంతో ఆరాటపడుతూ ఉన్నాడు; తాను అనారోగ్యానికి గురయ్యాడని మీరు విన్నందుకు తీవ్రంగా కలత చెందుతూ ఉన్నాడు.[a]
  to: ఎందుకంటే అతడు మీ అందరి కోసం ఎంతో ఆరాటపడుతూ ఉన్నాడు; అతడు అనారోగ్యానికి గురయ్యాడని మీరు విన్నందువల్ల తీవ్రంగా కలత చెందుతూ ఉన్నాడు.[a]
  rationale: The revision removes the unsupported specification ‘to see’ while preserving the source’s ongoing, intense longing. It also makes the subject of the second clause explicit for smooth Telugu comprehension. The alternative footnote is retained and phrased more directly, without presenting its contextual completion as explicit Greek wording.
