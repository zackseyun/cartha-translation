translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. కొనసాగుతున్న గతస్థితులను ‘ఆరాటపడుతూ ఉన్నాడు’, ‘కలత చెందుతూ ఉన్నాడు’ అని వ్యక్తం చేసి గ్రీకు పరిభాషాత్మక నిర్మాణం యొక్క కాలాంశాన్ని నిలిపాం. పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
