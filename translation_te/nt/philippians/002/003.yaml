source:
  edition: SBLGNT
  text: μηδὲν κατ’ ἐριθείαν ⸂μηδὲ κατὰ⸃ κενοδοξίαν, ἀλλὰ τῇ ταπεινοφροσύνῃ ἀλλήλους ἡγούμενοι ὑπερέχοντας ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/003.yaml
  text: Do nothing from selfish ambition or empty conceit[a], but in humility regard one another as more important than yourselves[b],
translation:
  language: te
  text: స్వార్థపూరిత ఆశయంతో గానీ, వ్యర్థమైన గర్వంతో గానీ ఏమీ చేయకండి. బదులుగా, వినయంతో ఒకరినొకరు మీకంటే గొప్పవారిగా భావించండి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా, “ఒకరినొకరు మీకంటే ఎక్కువ ప్రాముఖ్యమున్నవారిగా భావించండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν
  choice: ఏమీ చేయకండి
  rationale: గ్రీకు వాక్యంలో క్రియ అధ్యాహారంగా ఉన్నా, సందర్భంలోని ఉపదేశాత్మక నిషేధాన్ని ఆధునిక తెలుగులో సహజంగా స్పష్టం చేస్తుంది.
- source_word: κατ’ ἐριθείαν
  choice: స్వార్థపూరిత ఆశతో
  rationale: ἐριθείαలోని స్వప్రయోజనాన్ని వెదికే పోటీభావం లేదా పక్షపాత ధోరణిని సంక్షిప్తంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా తెలియజేస్తుంది.
- source_word: κατὰ κενοδοξίαν
  choice: వ్యర్థమైన గర్వంతో
  rationale: ‘శూన్యమైన మహిమ’ అనే మూలభావంలోని నిరర్థకమైన స్వీయ అతిశయాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; సమీప ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచింది.
- source_word: τῇ ταπεινοφροσύνῃ
  choice: వినయంతో
  rationale: దత్తివిభక్తిలోని విధానం లేదా మనోవైఖరి భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀλλήλους ἡγούμενοι
  choice: ఒకరినొకరు … భావించండి
  rationale: ἡγέομαι యొక్క పరిశీలించి విలువ కట్టే భావాన్ని, పరస్పర సంబంధాన్ని నిలుపుతూ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ὑπερέχοντας ἑαυτῶν
  choice: మీకంటే గొప్పవారిగా
  rationale: ὑπερέχωలోని ‘మించియున్న’ లేదా ‘ఉన్నతమైన’ తులనాత్మక భావాన్ని అతిగా వివరణ జోడించకుండా నిలుపుతుంది; ‘ఎక్కువ ప్రాముఖ్యమున్నవారిగా’ అనే సందర్భానుకూల భావాన్ని పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: ఇతరులను ‘మీకంటే గొప్పవారిగా’ భావించడం వారి అంతస్తు గురించిన నిరపేక్ష ప్రకటననా, లేక వినయపూర్వకమైన విలువ నిర్ణయమా?
  choice: గ్రీకు తులనాత్మక పదబంధాన్ని ‘మీకంటే గొప్పవారిగా భావించండి’ అని నేరుగా ఉంచడం
  alternative: ‘మీ కంటే ఎక్కువ ప్రాముఖ్యమున్నవారిగా భావించండి’
  rationale: మూలంలోని తులనాత్మక బలాన్ని, దాని నైతిక ఉద్వేగాన్ని నిలుపుతూ అది సత్తాపరమైన శ్రేష్ఠత అని వ్యాఖ్యానించదు; సందర్భానుకూల ప్రత్యామ్నాయాన్ని పాదసూచికలో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవపూర్వక బహువచన ఉపదేశ శైలిని ఉపయోగించింది. వాక్యాన్ని సహజంగా చదవడానికి గ్రీకులో అధ్యాహారంగా ఉన్న ‘చేయడం’ అనే క్రియను తెలుగులో స్పష్టం చేసింది. పదజాలం సామాన్య పాఠకులకు అర్థమయ్యేలా ఉండగా, మూలంలోని వినయం, పరస్పరత, తులనాత్మక ఉద్వేగం నిలిచేలా చూసింది.
