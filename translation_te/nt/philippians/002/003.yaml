review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prohibition, the two motivating dispositions, humility, reciprocal regard, and the comparative force of ὑπερέχοντας ἑαυτῶν. However, “స్వార్థపూరిత ఆశ” is more readily understood as a selfish desire or hope than as ἐριθεία, which denotes self-seeking ambition/rivalrous ambition.
  naturalness: The sentence is clear and modern, but “ఆశయంతో” is the more idiomatic and semantically exact Telugu expression for ‘ambition.’ Spacing “గానీ” as a separate particle also improves standard written presentation.
  terminology: “వ్యర్థమైన గర్వం” is a natural rendering of κενοδοξία, and “వినయంతో” appropriately renders ταπεινοφροσύνη. “మీకంటే గొప్పవారిగా భావించండి” preserves the source’s comparative wording without turning it into a doctrinal claim about inherent status.
  issues:
  - severity: medium
    issue: స్వార్థపూరిత ఆశతో
    rationale: This can mean ‘with selfish desire/hope’; it underrepresents the ambition/self-seeking-rivalry nuance of ἐριθεία. “స్వార్థపూరిత ఆశయంతో” better preserves that nuance in modern standard Telugu.
  - severity: low
    issue: తోగాని / గర్వంతోగాని
    rationale: Writing the particle separately (“తో గానీ”) is preferable in standard Telugu prose and makes the coordination easier to read.
  revised_text: స్వార్థపూరిత ఆశయంతో గానీ, వ్యర్థమైన గర్వంతో గానీ ఏమీ చేయకండి. బదులుగా, వినయంతో ఒకరినొకరు మీకంటే గొప్పవారిగా భావించండి.[b]
