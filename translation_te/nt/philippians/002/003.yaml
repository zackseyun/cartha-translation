revisions:
- from: స్వార్థపూరిత ఆశతోగాని, వ్యర్థమైన గర్వంతోగాని[a] ఏమీ చేయకండి. బదులుగా, వినయంతో ఒకరినొకరు మీకంటే గొప్పవారిగా భావించండి[b].
  to: స్వార్థపూరిత ఆశయంతో గానీ, వ్యర్థమైన గర్వంతో గానీ ఏమీ చేయకండి. బదులుగా, వినయంతో ఒకరినొకరు మీకంటే గొప్పవారిగా భావించండి.[b]
  rationale: Replaced “ఆశ” with “ఆశయం” to communicate the self-seeking ambition denoted by ἐριθεία, and regularized particle spacing. The [a] anchor is retained after “వ్యర్థమైన గర్వంతో,” where its alternatives apply; the [b] anchor remains after the comparative expression. No interpretive expansion has been added.
