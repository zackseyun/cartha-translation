review_pass:
  verdict: revise
  source_fidelity: 'The principal sequence and key terms are retained well: ἐκένωσεν is represented metaphorically, μορφή and σχῆμα are distinguished, δοῦλος is appropriately rendered as దాసుడు, and ὁμοίωμα remains ‘పోలిక.’ However, ‘రూపంలో మనిషిగా కనబడినప్పుడు’ turns the final participle into an explicitly temporal subordinate clause (‘when he appeared’). A Telugu participial continuation better reflects καὶ σχήματι εὑρεθεὶς ὡς ἄνθρωπος and preserves the connection into verse 8.'
  naturalness: The register is modern and suitably dignified. ‘మనుషుల పోలికలో అయ్యాడు’ is somewhat literal but understandable and preserves the source’s deliberate formulation. Recasting the final segment as ‘బాహ్య రూపంలో మనిషిగా కనిపించి—’ is more natural in a verse-continuing Telugu sentence than ‘కనబడినప్పుడు.’
  terminology: ‘దాసుని స్వరూపం’ fittingly conveys μορφὴν δούλου, while ‘బాహ్య రూపం’ for σχῆμα helps retain its distinction from the earlier స్వరూపం. ‘పోలిక’ properly preserves ὁμοίωμα without prejudging its Christological implications. The existing notes are accurate and their anchors remain valid.
  issues:
  - severity: medium
    issue: The phrase ‘రూపంలో మనిషిగా కనబడినప్పుడు’ makes εὑρεθεὶς explicitly temporal.
    rationale: The Greek has a coordinated aorist participle, ‘and being found in appearance as a human.’ Telugu can convey this more closely and smoothly with a participial phrase, while the dash continues the unfinished sentence into 2:8.
  - severity: low
    issue: ‘రూపం’ alone for σχῆμα does not clearly mark the visible/outward nuance in contrast with the earlier ‘స్వరూపం’ for μορφή.
    rationale: Adding ‘బాహ్య’ represents σχῆμα’s outward appearance and preserves Paul’s lexical contrast without adding theological interpretation.
  revised_text: కాని తనను తాను ఖాళీ చేసుకున్నాడు[a]; దాసుని స్వరూపాన్ని ధరించి, మనుషుల పోలికలో అయ్యాడు[b]; బాహ్య రూపంలో మనిషిగా కనిపించి—
