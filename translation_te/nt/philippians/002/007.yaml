revisions:
- from: కాని తనను తాను ఖాళీ చేసుకున్నాడు[a]; దాసుని స్వరూపాన్ని ధరించి, మనుషుల పోలికలో అయ్యాడు[b]; రూపంలో మనిషిగా కనబడినప్పుడు—
  to: కాని తనను తాను ఖాళీ చేసుకున్నాడు[a]; దాసుని స్వరూపాన్ని ధరించి, మనుషుల పోలికలో అయ్యాడు[b]; బాహ్య రూపంలో మనిషిగా కనిపించి—
  rationale: The revision changes only the final clause. ‘బాహ్య రూపంలో’ captures σχῆμα as visible appearance, distinct from μορφή (‘స్వరూపం’), and ‘కనిపించి’ retains a participial flow that leads naturally into the next verse. No doctrinal explanation has been introduced, and the translation continues to preserve the source text’s nuanced wording about likeness and appearance.
  reviewer_model: gpt-5.6-terra
