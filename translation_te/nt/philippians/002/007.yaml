  text: ἀλλὰ ἑαυτὸν ἐκένωσεν μορφὴν δούλου λαβών, ἐν ὁμοιώματι ἀνθρώπων γενόμενος· καὶ σχήματι εὑρεθεὶς ὡς ἄνθρωπος
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/007.yaml
  text: but emptied himself[a], taking the form of a servant, becoming in the likeness of men[d][c][b]; and being found in appearance as a man
translation:
  language: te
  text: కాని తనను తాను ఖాళీ చేసుకున్నాడు[a]; దాసుని స్వరూపాన్ని ధరించి, మనుషుల పోలికలో అయ్యాడు[b]; బాహ్య రూపంలో మనిషిగా కనిపించి—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తనను తాను ఏమీ కానివానిగా చేసుకున్నాడు.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మనుషుల పోలికలో అయ్యాడు.” ఇక్కడ “పోలిక” అనే మాట ఆయన నిజమైన మానవత్వాన్ని నిరాకరించదు.
    reason: source_clarification
lexical_decisions:
- source_word: ἀλλὰ
  choice: కాని
  rationale: ముందటి వాక్యభాగంతో ఉన్న బలమైన వ్యత్యాసాన్ని సహజంగా సూచిస్తుంది.
- source_word: ἑαυτὸν ἐκένωσεν
  choice: తనను తాను ఖాళీ చేసుకున్నాడు
  rationale: κενόω లోని ‘ఖాళీ చేయడం’ అనే రూపకాన్ని నిలుపుతుంది; దాని భావాన్ని తరువాతి కృదంతాలే వివరించనిస్తుంది.
- source_word: μορφὴν δούλου λαβών
  choice: దాసుని స్వరూపాన్ని ధరించి
  rationale: μορφήకు ‘స్వరూపం’ అని ఇచ్చి సమీప సందర్భంలోని సమాంతరతను కాపాడుతుంది; δοῦλος యొక్క అధీనస్థితిని ‘దాసుడు’ స్పష్టంగా తెలియజేస్తుంది; λαβώνను సహజ తెలుగులో ‘ధరించి’ అని వ్యక్తం చేస్తుంది.
- source_word: ἐν ὁμοιώματι ἀνθρώπων γενόμενος
  choice: మనుషుల పోలికలో అయ్యాడు
  rationale: γενόμενοςను నేరుగా ‘అయ్యాడు’ అని, ὁμοίωμαను ‘పోలిక’ అని అనువదించి గ్రీకు వాక్యంలోని ఉద్దేశపూర్వక ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచుతుంది.
- source_word: σχήματι εὑρεθεὶς ὡς ἄνθρωπος
  choice: రూపంలో మనిషిగా కనబడినప్పుడు
  rationale: σχῆμα సూచించే కనిపించే రూపాన్ని ‘రూపం’తో తెలియజేస్తూ, εὑρεθείς భావాన్ని ‘కనబడినప్పుడు’గా సహజంగా అందిస్తుంది; ἄνθρωπος ఇక్కడ సాధారణ మానవార్థంలో ఉంది.
theological_decisions:
- issue: ‘తనను తాను ఖాళీ చేసుకున్నాడు’ అనే క్రీస్తుశాస్త్ర సంబంధ రూపకం
  choice: రూపకాన్ని యథాతథంగా ఉంచి, తరువాతి కృదంతాలు దాని విధానాన్ని వివరించనివ్వడం
  alternative: ‘తనను తాను ఏమీ కానివానిగా చేసుకున్నాడు’ అని అనువదించడం లేదా దైవిక గుణాలను విడిచిపెట్టాడని వ్యాఖ్యానించడం
  rationale: మూలపాఠం ఖాళీ చేసుకోవడాన్ని దాసుని స్వరూపం ధరించడం, మనుషుల పోలికలో అవడం ద్వారా వివరిస్తుంది; అనువాదం ప్రత్యేక కెనోసిస్ సిద్ధాంతాన్ని చేర్చకూడదు.
- issue: ‘మనుషుల పోలికలో’ అనే మాట యొక్క భావం
  choice: ὁμοίωμα లోని ‘పోలిక’ భావాన్ని నిలుపుతూ నిజమైన మానవత్వాన్ని నిరాకరించే వ్యాఖ్యానాన్ని చేర్చకపోవడం
  alternative: కేవలం మానవునిలా కనిపించాడని లేదా మూలపాఠం కంటే బలంగా సంపూర్ణ సమానత్వాన్ని ప్రకటించడం
  rationale: పౌలు ఉపయోగించిన పదబంధంలోని ఉద్దేశపూర్వక సున్నితత్వాన్ని అలాగే ఉంచాలి; తరువాతి వాక్యభాగం దానిని పూరిస్తుంది గాని తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ἐκένωσεν రూపకం, μορφή–σχῆμα భేదం, ὁμοίωμα లోని ఉద్దేశపూర్వక ఉద్వేగం సాధ్యమైనంతవరకు నిలుపబడ్డాయి. వాక్యం 2:8లో కొనసాగుతున్నందున చివర దీర్ఘ విరామచిహ్నం ఉంచబడింది.
