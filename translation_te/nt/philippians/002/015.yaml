revisions:
- from: మీరు నిందారహితులుగా, నిర్మలమైనవారుగా, వంకరైనదీ వక్రమైనదీ అయిన తరం[b] మధ్య మచ్చలేని దేవుని పిల్లలుగా కావాలి. ఆ తరం ప్రజల మధ్య మీరు లోకంలో జ్యోతులవలె[c] ప్రకాశిస్తున్నారు[a].
  to: మీరు నిందారహితులుగాను నిర్మలులుగాను, వంకరైన, వక్రీకృతమైన తరం[b] మధ్య మచ్చలేని దేవుని పిల్లలుగా అయ్యేలా, ఆ తరం ప్రజల మధ్య మీరు లోకంలో వెలుగులవలె[c] ప్రకాశిస్తున్నారు[a].
  rationale: The revision corrects the purpose-clause force of ἵνα γένησθε, improves the paired moral description of the generation, and supplies a lexically broader alternative for φωστῆρες. It keeps «మచ్చలేని» directly with «దేవుని పిల్లలు» and retains the cross-reference without making the allusion explicit in the main text.
