id: PHP.2.15
reference: Philippians 2:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα γένησθε ἄμεμπτοι καὶ ἀκέραιοι, τέκνα θεοῦ ⸂ἄμωμα μέσον⸃ γενεᾶς σκολιᾶς καὶ διεστραμμένης, ἐν οἷς φαίνεσθε ὡς φωστῆρες ἐν κόσμῳ
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/015.yaml
  text: so that you may become blameless and pure[a], children of God without blemish in the midst of a crooked and twisted generation[c][b], among whom you shine as lights in the world
translation:
  language: te
  text: మీరు నిందారహితులుగాను నిర్మలులుగాను, వంకరైన, వక్రీకృతమైన తరం[b] మధ్య మచ్చలేని దేవుని పిల్లలుగా అయ్యేలా, ఆ తరం ప్రజల మధ్య మీరు లోకంలో వెలుగులవలె[c] ప్రకాశిస్తున్నారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కనిపిస్తున్నారు.”
    reason: lexical_alternative
  - marker: b
    text: “వంకరైన, వక్రీకృతమైన తరం” అనే మాటలు ద్వితీయోపదేశకాండము 32:5ను ప్రతిధ్వనింపజేస్తున్నట్లు కనిపిస్తున్నాయి; అక్కడ దేవుని పిల్లలకు చెడిపోయిన తరానికి మధ్య వ్యత్యాసం ఉంది.
    reason: cross_reference
  - marker: c
    text: లేదా, “జ్యోతులవలె.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα γένησθε
  choice: కావాలి
  rationale: ἵνα సూచించే ఉద్దేశం/ఫలితాన్ని ముందరి వాక్యంతో అనుసంధానిస్తూ, γένησθε లోని ‘అలా అవడం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἄμεμπτοι
  choice: నిందారహితులుగా
  rationale: నైతికంగా నింద మోపడానికి కారణం లేని స్థితిని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀκέραιοι
  choice: నిర్మలమైనవారుగా
  rationale: కల్తీలేని స్వచ్ఛత, నైతిక యథార్థత అనే భావాన్ని సాధారణ పాఠకులకు సహజంగా అందిస్తుంది.
- source_word: τέκνα θεοῦ
  choice: దేవుని పిల్లలుగా
  rationale: τέκνα స్త్రీపురుషులందరినీ కలుపుకొనే ‘పిల్లలు’ అనే అర్థం కలిగి ఉంది.
- source_word: ἄμωμα
  choice: మచ్చలేని
  rationale: ముందున్న ἄμεμπτοι నుండి పదచిత్రాన్ని వేరుగా ఉంచి, లోపం లేదా మచ్చ లేని స్థితిని మరియు బలిసంబంధమైన ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: μέσον γενεᾶς σκολιᾶς καὶ διεστραμμένης
  choice: వంకరైనదీ వక్రమైనదీ అయిన తరం మధ్య
  rationale: μέσον యొక్క ‘మధ్య’ భావాన్నీ, రెండు బలమైన నైతిక విశేషణాల సమాంతరత్వాన్నీ నిలుపుతుంది.
- source_word: ἐν οἷς
  choice: ఆ తరం ప్రజల మధ్య
  rationale: సర్వనామం సూచించేది ఆ తరానికి చెందిన ప్రజలని తెలుగులో అసందిగ్ధంగా, సహజంగా తెలియజేస్తుంది.
- source_word: φαίνεσθε
  choice: ప్రకాశిస్తున్నారు
  rationale: φωστῆρες తో కలిసి ఉన్న సందర్భంలో వెలుగు వెదజల్లడం అనే భావం సహజమైనది; ‘కనిపిస్తున్నారు’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: φωστῆρες
  choice: జ్యోతులవలె
  rationale: వెలుగునిచ్చే వాటిని సూచించే విస్తృత పదచిత్రాన్ని నిలుపుతూ, ‘నక్షత్రాలు’ అని అనవసరంగా పరిమితం చేయదు.
- source_word: ἐν κόσμῳ
  choice: లోకంలో
  rationale: మానవ లోకాన్ని సూచించే సాధారణ బైబిలీయ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ‘మచ్చలేని’ అనే మాటకు ‘దేవుని పిల్లలు’తో ఉన్న సంబంధం మరియు ద్వితీయోపదేశకాండము 32:5 ప్రతిధ్వని
  choice: ‘వంకరైనదీ వక్రమైనదీ అయిన తరం మధ్య మచ్చలేని దేవుని పిల్లలు’ అని అనువదించడం
  alternative: ‘మచ్చలేని’ అనే మాటను మొత్తం వాక్యానికి సాధారణ విశేషణంగా తీసుకోవడం
  rationale: గ్రీకు పదక్రమం ἄμωμα ను τέκνα θεοῦ తో సన్నిహితంగా కలుపుతుంది. ఇది దేవుని పిల్లలకు ఆ వక్ర తరానికి మధ్య ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది; అంతర్గ్రంథ సూచనను ప్రధాన పాఠ్యంలో అతిగా వివరిచకుండా పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ἄμεμπτοι, ἀκέραιοι, ἄμωμα అనే మూడు పదాల భిన్న ఛాయలను వరుసగా ‘నిందారహితులు,’ ‘నిర్మలమైనవారు,’ ‘మచ్చలేని’ అని వేరుగా నిలిపాం. గ్రీకులోని పొడవైన ఉద్దేశ్యవాక్యాన్ని తెలుగులో చదవడానికి సులభంగా రెండు వాక్యాలుగా విభజించాం.
