reference: Philippians 2:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀θεὸς γάρ ἐστιν ὁ ἐνεργῶν ἐν ὑμῖν καὶ τὸ θέλειν καὶ τὸ ἐνεργεῖν ὑπὲρ τῆς εὐδοκίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/013.yaml
  text: For God is the one working in you both to will and to work for his good pleasure[a][b].
translation:
  language: te
  text: ఎందుకంటే, తన ఇష్టప్రకారం మీలో ఇష్టపడడానికీ చేయడానికీ కార్యం చేస్తున్నది దేవుడే[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన సంతోషం కోసం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఇష్టపడటమును, చేయటమును.’
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందున్న ప్రోత్సాహానికి కారణాన్ని వివరిస్తున్న అనుసంధానాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁ ἐνεργῶν
  choice: పనిచేస్తున్నవాడు
  rationale: నిర్దిష్టార్థక వర్తమాన కృదంతంలోని కొనసాగుతున్న క్రియాభావాన్ని నిలుపుతుంది.
- source_word: ἐν ὑμῖν
  choice: మీలో
  rationale: ఇది వ్యక్తుల అంతరంగంలోనూ సమూహం మధ్యలోనూ అనే పరిధిని సూచించగలదు; ‘మీలో’ ఆ సందిగ్ధతను నిలుపుతుంది.
- source_word: τὸ θέλειν
  choice: కోరడాన్ని
  rationale: నిశ్చయపూర్వకమైన ఇచ్ఛ లేదా సంకల్పాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘కోరడం’ సహజంగా అర్థమవుతుంది.
- source_word: τὸ ἐνεργεῖν
  choice: కార్యం చేయడాన్ని
  rationale: చర్యను సూచిస్తూ, ముందున్న ἐνεργῶνతో ఉన్న పదసంబంధాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: ὑπὲρ τῆς εὐδοκίας
  choice: తన సంతోషకరమైన సంకల్పం కోసం
  rationale: ὑπέρ యొక్క ఉద్దేశం/ప్రయోజన భావాన్నీ, εὐδοκίαలోని సంతోషకరమైన ఇష్ట భావాన్నీ సహజమైన తెలుగులో తెలియజేస్తుంది; ‘తన’ అనేది దేవుణ్ణి సూచిస్తుంది.
theological_decisions:
- issue: దైవ కార్యసాధకత్వం మరియు మానవుని కోరడం/చేయడం
  choice: కోరడాన్నీ కార్యం చేయడాన్నీ కలిగిస్తూ పనిచేస్తున్నవాడు దేవుడే
  alternative: కోరికనూ కార్యసామర్థ్యాన్నీ ఇచ్చేవాడు దేవుడే
  rationale: మూలపాఠం దేవుడు విశ్వాసులలో ఇచ్ఛ మరియు క్రియ రెండింటి స్థాయిలో పనిచేస్తున్నాడని చెబుతుంది. ‘సామర్థ్యం’ అని మార్చకుండా, కోరడం మరియు చేయడం రెండింటినీ నిలిపి ఉంచడం ద్వారా వాక్యంలోని దైవ-మానవ కార్య సంబంధపు ఉద్రిక్తతను పరిష్కరించకుండా సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘దేవుడే’ గ్రీకు వాక్యంలోని దేవునిపై ఉన్న ఉద్ఘాటనను తెలియజేస్తుంది. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత ప్రత్యామ్నాయాలను సూచిస్తాయి.
