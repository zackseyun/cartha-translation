revisions:
- from: ప్రతి నాలుకా “మెస్సీయ అయిన యేసు ప్రభువు” అని ఒప్పుకోవాలి[a]; ఇది తండ్రియైన దేవుని మహిమ కోసం.
  to: మరియు ప్రతి నాలుకా తండ్రియైన దేవుని మహిమ కోసం “మెస్సీయ అయిన యేసు ప్రభువు” అని ఒప్పుకోవాలి[a].
  rationale: ‘మరియు’ ద్వారా καὶని పునరుద్ధరించాం. ‘తండ్రియైన దేవుని మహిమ కోసం’ అనే εἰς δόξαν పదబంధాన్ని ఒప్పుకోలు క్రియతో నేరుగా కలిపి, మూలంలోని ఉద్దేశ/ఫలిత సంబంధాన్ని నిలిపాం. ఇతర పదజాలం మరియు పాదటిప్పణి సురక్షితంగా ఉన్నాయి.
