source:
  edition: SBLGNT
  text: καὶ πᾶσα γλῶσσα ἐξομολογήσηται ὅτι κύριος Ἰησοῦς Χριστὸς εἰς δόξαν θεοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/011.yaml
  text: and every tongue should confess that Jesus the Messiah is Lord[b][a], to the glory of God the Father.
translation:
  language: te
  text: మరియు ప్రతి నాలుకా తండ్రియైన దేవుని మహిమ కోసం “మెస్సీయ అయిన యేసు ప్రభువు” అని ఒప్పుకోవాలి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “క్రీస్తైన యేసు ప్రభువు” అని ఒప్పుకోవాలి.'
    reason: Χριστόςకు సాంప్రదాయ తెలుగు రూపమైన ‘క్రీస్తు’ అనే ప్రత్యామ్నాయాన్ని అందిస్తుంది.
lexical_decisions:
- source_word: πᾶσα γλῶσσα
  choice: ప్రతి నాలుకా
  rationale: సార్వత్రిక ఒప్పుకోలును తెలిపే మూలంలోని శరీరాంగ రూపకాన్ని నిలుపుతూ, తెలుగులో సహజంగా ఉండే వ్యక్తీకరణ.
- source_word: ἐξομολογήσηται
  choice: ఒప్పుకోవాలి
  rationale: బహిరంగంగా అంగీకరించి ప్రకటించే భావాన్ని అదనపు వివరణ లేకుండా తెలియజేస్తుంది; సందర్భంలోని ఉద్దేశార్థక సంభావనను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: క్రైస్తవ ఒప్పుకోలులోని బలాన్ని, అలాగే సార్వత్రిక ఆరాధనను సూచించే లేఖన ప్రతిధ్వనిని కాపాడే ప్రామాణిక తెలుగు పదం.
- source_word: Ἰησοῦς Χριστός
  choice: మెస్సీయ అయిన యేసు
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తున్నందున దాని మెస్సీయ భావాన్ని స్పష్టంగా ఉంచి, తెలుగులో సహజమైన పదక్రమాన్ని అనుసరిస్తుంది.
- source_word: εἰς δόξαν
  choice: మహిమ కోసం
  rationale: εἰς తెలిపే లక్ష్య లేదా ఫలిత భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: θεοῦ πατρός
  choice: తండ్రియైన దేవుని
  rationale: దేవుని తండ్రిగా గుర్తించే గ్రీకు పదబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: Χριστόςను క్రీస్తు సంబంధమైన ఒప్పుకోలులో ఎలా అనువదించాలి
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός బిరుదు భావం సజీవంగా ఉంది. ‘మెస్సీయ’ ఆ వాగ్దత్త రాజు/అభిషిక్తుని భావాన్ని నిలుపుతుంది; సాంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదటిప్పణిలో ఇస్తుంది.
- issue: κύριος Ἰησοῦς Χριστός అనే ఒప్పుకోలు పదక్రమం
  choice: మెస్సీయ అయిన యేసు ప్రభువు
  alternative: ప్రభువైన యేసు మెస్సీయ
  rationale: ‘ప్రభువు’నే వాక్యంలోని విధేయ పదంగా ఉంచి, యేసు ప్రభువని ఒప్పుకునే గ్రీకు వాక్య బలాన్ని కాపాడుతుంది; Χριστόςను యేసుకు సంబంధించిన బిరుదుగా చూపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన ఆరాధనా శైలిని ఉపయోగించాం. మూలంలోని ‘నాలుక’ రూపకాన్ని నిలిపాం. ఈ వచనం 10వ వచనంలో మొదలైన ఉద్దేశ వాక్యానికి కొనసాగింపు; తెలుగులో స్వతంత్రంగా చదివినా సహజంగా ఉండేందుకు ‘ఒప్పుకోవాలి’ అని ఇచ్చాం.
