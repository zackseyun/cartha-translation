id: PHP.2.19
reference: Philippians 2:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐλπίζω δὲ ἐν κυρίῳ Ἰησοῦ Τιμόθεον ταχέως πέμψαι ὑμῖν, ἵνα κἀγὼ εὐψυχῶ γνοὺς τὰ περὶ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/019.yaml
  text: But I hope in the Lord Jesus to send Timothy to you soon[a], so that I too may be encouraged when I learn the things concerning you.
translation:
  language: te
  text: అయితే, ప్రభువైన యేసులో తిమోతిని త్వరలో మీ దగ్గరకు పంపాలని నేను ఆశిస్తున్నాను, తద్వారా మీ సంగతులు తెలుసుకొని నేనూ ఉత్సాహం పొందగలను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλπίζω
  choice: నేను నిరీక్షిస్తూ ... అనుకుంటున్నాను
  rationale: వర్తమానకాలంలోని పౌలు ఆశతో కూడిన ఉద్దేశాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; కేవలం నిశ్చిత నిరీక్షణగా మార్చదు.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి సందర్భంతో ఉన్న స్వల్ప సంధి లేదా వ్యత్యాసాన్ని సహజంగా సూచిస్తుంది.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: ప్రభువైన యేసులో
  rationale: ἐν యొక్క సంబంధాత్మక, ఆధారపడే భావాన్ని నిలుపుతూ κύριος అనే క్రీస్తుసంబంధ బిరుదును ‘ప్రభువు’గా అందిస్తుంది.
- source_word: Τιμόθεον
  choice: తిమోతిని
  rationale: వ్యక్తి పేరుకు ప్రామాణిక తెలుగు లిప్యంతరీకరణను, కర్మవిభక్తితో ఉపయోగిస్తుంది.
- source_word: ταχέως
  choice: త్వరలో
  rationale: చర్య వేగం కంటే పంపడం జరగబోయే సమీప కాలాన్ని ఈ సందర్భంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: πέμψαι ὑμῖν
  choice: మీ దగ్గరికి పంపాలని
  rationale: తెలుగులో గమ్యాన్ని సహజంగా తెలియజేస్తూ, infinitive యొక్క ఉద్దేశ భావాన్ని నిలుపుతుంది.
- source_word: ἵνα
  choice: అప్పుడు ... పొందగలను
  rationale: పంపాలనే ఆశకు సంబంధించిన ఉద్దేశం లేదా ఆశించిన ఫలితాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో చూపుతుంది.
- source_word: κἀγὼ
  choice: నేను కూడా
  rationale: κἀγώలోని ‘నేనూ’ అనే చేర్పు-ప్రాధాన్యాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: εὐψυχῶ
  choice: ధైర్యం పొందగలను
  rationale: ‘మంచి మనోస్థితిలో ఉండడం, ఉత్సాహపడడం’ అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: γνοὺς
  choice: తెలుసుకొని
  rationale: అయోరిస్ట్ పార్టిసిపిల్‌ను సహజంగా అనుసంధానిస్తూ, తెలుసుకోవడం వల్ల కలిగే ప్రోత్సాహాన్ని చూపుతుంది.
- source_word: τὰ περὶ ὑμῶν
  choice: మీ సంగతులు
  rationale: ‘మీకు సంబంధించిన విషయాలు’ అనే విస్తృతమైన మూలభాషా భావాన్ని, కేవలం ఆరోగ్యం లేదా స్థితికి పరిమితం చేయకుండా సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: ἐν κυρίῳ Ἰησοῦలో κύριος అనువాదం
  choice: ప్రభువైన యేసులో
  alternative: యజమానుడైన యేసులో
  rationale: కొత్త నిబంధనలో యేసుకు వర్తించే κύριος అనే క్రీస్తుసంబంధ బిరుదుకు ‘ప్రభువు’ సహజమైన, స్థిరమైన తెలుగు రూపం; ‘యజమాని’ ఈ సందర్భంలో అనుచితంగా పరిమిత భావాన్ని ఇస్తుంది.
- issue: ἐν κυρίῳ Ἰησοῦలో ἐν యొక్క భావం
  choice: యేసులో
  alternative: యేసు ద్వారా
  rationale: పౌలు ఆశ ప్రభువుతో తన సంబంధంలోను ఆయనపై ఆధారపడటంలోను ఉందనే మూలపాఠంలోని ఉద్వేగాన్ని నిలుపుతుంది; సాధనార్థక ‘ద్వారా’గా మాత్రమే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘మీ సంగతులు’ మూలంలోని τὰ περὶ ὑμῶν విస్తృతిని సహజంగా నిలుపుతుంది.
