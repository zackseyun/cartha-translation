id: PHP.2.1
reference: Philippians 2:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἴ τις οὖν παράκλησις ἐν Χριστῷ, εἴ τι παραμύθιον ἀγάπης, εἴ τις κοινωνία πνεύματος, εἴ τις σπλάγχνα καὶ οἰκτιρμοί,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/001.yaml
  text: So if there is any encouragement in Messiah[a], if any comfort from love, if any fellowship of the Spirit, if any affection and compassion,
translation:
  language: te
  text: కాబట్టి, మెస్సీయలో ఏదైనా ప్రోత్సాహం ఉంటే, ప్రేమనుంచి ఏదైనా ఓదార్పు ఉంటే, ఆత్మతో ఏదైనా సహవాసం ఉంటే[a], ఏదైనా వాత్సల్యమూ కనికరమూ ఉంటే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆత్మలో భాగస్వామ్యం’; తక్కువ సంభావ్యతతో, ‘ఆత్మీయ సహవాసం.’
    reason: πνεύματος అనే పదం పవిత్రాత్మను సూచించడమూ, κοινωνίαతో దాని సంబంధమూ సంక్షిప్తంగా ఉండడం వల్ల ఉన్న ప్రత్యామ్నాయ అర్థాలను నిలుపుట.
lexical_decisions:
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందున్న సందర్భం నుంచి తీసుకునే నిర్ధారణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: παράκλησις
  choice: ప్రోత్సాహం
  rationale: ఇక్కడ ఐక్యతకు దారితీసే బలపరచే, ధైర్యపరచే భావం ప్రధానంగా ఉంది; ‘ఓదార్పు’తో మాత్రమే పరిమితం చేయకుండా, తదుపరి παραμύθιονతోనూ తేడాను నిలుపుతుంది.
- source_word: ἐν Χριστῷ
  choice: మెస్సీయలో
  rationale: Χριστός ఇక్కడ బిరుదు భావాన్ని కలిగి ఉంది; ἐν యొక్క ప్రాథమిక సంబంధాన్ని ‘లో’ నిలుపుతుంది.
- source_word: παραμύθιον
  choice: ఓదార్పు
  rationale: ఆదరించే మాట లేదా సాంత్వన అనే భావాన్ని సహజంగా తెలుపుతూ, παράκλησιςకు వాడిన ‘ప్రోత్సాహం’తో పదభేదాన్ని కాపాడుతుంది.
- source_word: ἀγάπης
  choice: ప్రేమనుంచి
  rationale: ఈ షష్ఠీ విభక్తిని ప్రేమ మూలంగా కలిగే ఓదార్పు అనే సహజమైన మూలార్థ సంబంధంతో వ్యక్తం చేస్తుంది.
- source_word: κοινωνία
  choice: సహవాసం
  rationale: సందర్భంలోని పరస్పర సంబంధం, పంచుకోవడం, భాగస్వామ్యం అనే భావవ్యాప్తిని సాధారణ పాఠకులకు పరిచితమైన పదంతో అందిస్తుంది.
- source_word: πνεύματος
  choice: ఆత్మతో
  rationale: ఇది పవిత్రాత్మను సూచించే అవకాశమే బలమైనది. κοινωνίαతో ఉన్న సంబంధాన్ని సహవాస భావంలో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ఇతర సాధ్యమైన సంబంధాలను పాదటిప్పణిలో ఉంచింది.
- source_word: σπλάγχνα
  choice: వాత్సల్యం
  rationale: శరీర అంతర్భాగాలు అనే అక్షరార్థం ఇక్కడ లోతైన మమకారం, ఆప్యాయతను సూచించే నుడికారంగా ఉంది; ‘వాత్సల్యం’ ఆ భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: οἰκτιρμοί
  choice: కనికరం
  rationale: ఇతరుల బాధపట్ల కరుణతో స్పందించే భావాన్ని సహజంగా తెలుపుతుంది; ‘వాత్సల్యం’తో జతగా మూలంలోని భావజంటను నిలుపుతుంది.
theological_decisions:
- issue: πνεύματος పవిత్రాత్మను సూచిస్తుందా, κοινωνίαతో దాని షష్ఠీ సంబంధాన్ని ఎలా వ్యక్తం చేయాలి
  choice: ఆత్మతో ఏదైనా సహవాసం
  alternative: ఆత్మలో భాగస్వామ్యం; లేదా, ఆత్మ సంబంధమైన సహవాసం
  rationale: పౌలు వాడుకలోనూ, క్రైస్తవ ఆశీర్వాదాల వరుసలోనూ ఇది పవిత్రాత్మను సూచించే అవకాశమే ఎక్కువ. అయితే గ్రీకు షష్ఠీ సంబంధం సహవాసానికి మూలం, దానిలో భాగస్వామ్యం, లేదా దానితో సహవాసం అనే అర్థాల్లో ఏదో ఒకదాన్ని పూర్తిగా నిర్దేశించదు; అందువల్ల ప్రధాన పాఠ్యంలో అత్యంత సంభావ్యమైన భావాన్ని ఇచ్చి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. వాక్యం తదుపరి వచనంలో పూర్తయ్యే షరతుల వరుస కాబట్టి చివర కామాను ఉంచాం. పాదటిప్పణి సూచికను అది వివరిస్తున్న ‘ఆత్మతో...సహవాసం’ పదబంధం వద్ద ఉంచాం.
