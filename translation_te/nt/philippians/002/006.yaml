id: PHP.2.6
reference: Philippians 2:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς ἐν μορφῇ θεοῦ ὑπάρχων οὐχ ἁρπαγμὸν ἡγήσατο τὸ εἶναι ἴσα θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/006.yaml
  text: who[a], though he was in the form of God, did not consider equality with God something to be grasped[c][b],
translation:
  language: te
  text: ఆయన దేవుని రూపంలో ఉన్నప్పటికీ[a], దేవునితో సమానంగా ఉండడాన్ని[c] తన ప్రయోజనానికి ఉపయోగించుకోవలసినదిగా[b] భావించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని రూపంలో ఉంటూ.” ὑπάρχων అనే పదబంధాన్ని వ్యత్యాసార్థకంగా (“ఉన్నప్పటికీ”) లేదా స్థితివాచకంగా (“ఉంటూ”) అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పట్టుకోవలసినదిగా,” “చేజిక్కించుకోవలసినదిగా,” లేదా “గట్టిగా పట్టుకొని ఉంచుకోవలసినదిగా.”
    reason: alternative_reading
  - marker: c
    text: అక్షరార్థంగా, “దేవునితో సమానంగా ఉండడాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν μορφῇ θεοῦ
  choice: దేవుని రూపంలో
  rationale: μορφή అనే గ్రీకు పదాన్ని ‘రూపం’గా నిలుపుతూ, దానిని ‘స్వభావం’ వంటి మరింత నిర్దిష్టమైన తాత్త్విక వ్యాఖ్యానంగా మార్చలేదు.
- source_word: ὑπάρχων
  choice: ఉన్నప్పటికీ
  rationale: తదుపరి వాక్యంలోని తనను తాను తగ్గించుకోవడంతో ఉన్న వ్యత్యాసాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి concessive భావాన్ని ఎంచుకున్నాం; ‘ఉంటూ/ఉన్నవాడై’ అనే స్థితివాచక అర్థం కూడా సాధ్యమేనని పాదటిప్పణిలో ఉంచాం.
- source_word: ἁρπαγμὸν
  choice: తన ప్రయోజనానికి ఉపయోగించుకోవలసినదిగా
  rationale: సందర్భంలో స్వప్రయోజనం కోసం ఒక హోదాను వాడుకోకపోవడం అనే భావం బలంగా కనిపిస్తుంది. అయితే ‘పట్టుకోవలసినది/చేజిక్కించుకోవలసినది’ అనే అర్థం కూడా నిజమైన ప్రత్యామ్నాయం కాబట్టి పాదటిప్పణిలో భద్రపరిచాం.
- source_word: ἡγήσατο
  choice: భావించలేదు
  rationale: ἡγέομαι యొక్క ‘పరిగణించు, భావించు’ అనే అర్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὸ εἶναι ἴσα θεῷ
  choice: దేవునితో సమానంగా ఉండడాన్ని
  rationale: గ్రీకు articular infinitive పదబంధాన్ని తెలుగులో సహజంగా, అదే సమయంలో సమానత్వం అనే భావాన్ని స్పష్టంగా నిలుపుతూ అనువదిస్తుంది.
theological_decisions:
- issue: ἐν μορφῇ θεοῦ యొక్క క్రీస్తు సంబంధిత భావబలం
  choice: దేవుని రూపంలో
  alternative: దేవుని స్వభావంలో; స్వభావరీత్యా దేవుడై
  rationale: పౌలు ఉపయోగించిన ‘రూపం’ అనే వ్యక్తీకరణను నిలుపుతూ, తరువాతి సిద్ధాంతపరమైన పదజాలాన్ని వాక్యంలోకి నేరుగా చేర్చలేదు; అయినా మూలపాఠంలోని ఉన్నత క్రీస్తు దృక్పథాన్ని తగ్గించలేదు.
- issue: దేవునితో సమానత్వానికి సంబంధించి ἁρπαγμός అర్థం
  choice: తన ప్రయోజనానికి ఉపయోగించుకోవలసినదిగా
  alternative: పట్టుకోవలసినదిగా; చేజిక్కించుకోవలసినదిగా; గట్టిగా పట్టుకొని ఉంచుకోవలసినదిగా
  rationale: తదుపరి వచనంలోని స్వయంత్యాగ గమనానికి ‘స్వప్రయోజనానికి వాడుకోవడం’ అనే అర్థం సరిపోతుంది. అయితే ἁρπαγμός వివాదాస్పదమైన పదం కాబట్టి సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచి వ్యాఖ్యాన ఉద్రిక్తతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘స్వరూపం’ కంటే మూలంలోని μορφήను నేరుగా ప్రతిబింబించే ‘రూపం’ను ఎంచుకున్నాం. వాక్యం ముందరి సందర్భానికి అనుసంధానమైన సంబంధవాచక నిర్మాణం అయినప్పటికీ, తెలుగులో సహజంగా చదవడానికి ‘ఆయన’తో ప్రారంభించాం.
