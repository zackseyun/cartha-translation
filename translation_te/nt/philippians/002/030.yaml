  to: ఎందుకంటే, మెస్సీయ[a] పని కోసం[c] అతడు తన ప్రాణాన్ని పణంగా పెట్టి మరణానికి చేరువయ్యాడు; మీరు నాకు అందించే సేవలోని లోటును పూరించడానికి ఇలా చేశాడు.
  rationale: 'వాక్యాన్ని మూలార్థానికి నిబద్ధంగా ఉంచుతూ చివరి భాగాన్ని సహజమైన ఆధునిక తెలుగులో సవరించాం. పాదసూచిక bలోని వివరణను నిలిపాం, కానీ సవరించిన వచనంలో ఆ పాదసూచికకు సూచిక లేకపోవడం నిర్మాణపరంగా తప్పు అవుతుంది; కాబట్టి లోటు అనే పదానికి [b] సూచికను వచనంలో చేర్చాలి. సరిచేసిన పూర్తి వచనం: “ఎందుకంటే, మెస్సీయ[a] పని కోసం[c] అతడు తన ప్రాణాన్ని పణంగా పెట్టి మరణానికి చేరువయ్యాడు; మీరు నాకు అందించే సేవలోని లోటును[b] పూరించడానికి ఇలా చేశాడు.”'
