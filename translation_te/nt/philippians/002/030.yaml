id: PHP.2.30
reference: Philippians 2:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι διὰ τὸ ἔργον ⸀Χριστοῦ μέχρι θανάτου ἤγγισεν, ⸀παραβολευσάμενος τῇ ψυχῇ ἵνα ἀναπληρώσῃ τὸ ὑμῶν ὑστέρημα τῆς πρός με λειτουργίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/030.yaml
  text: because for the work of Messiah he came near to death[c][b][a], risking his life to make up for what was lacking in your service to me.
translation:
  language: te
  text: ఎందుకంటే, మెస్సీయ[a] పని కోసం[c] అతడు తన ప్రాణాన్ని పణంగా పెట్టి మరణానికి చేరువయ్యాడు; మీరు నాకు అందించే సేవలోని లోటును పూరించడానికి ఇలా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘క్రీస్తు.’
    reason: alternative_reading
  - marker: c
    text: లేదా ‘మెస్సీయ పని కారణంగా.’
    reason: alternative_rendering
lexical_decisions:
- source_word: διὰ τὸ ἔργον Χριστοῦ
  choice: మెస్సీయ పని కోసం
  rationale: διά + accusative ఇక్కడ కారణం లేదా నిమిత్తాన్ని సూచిస్తుంది. ‘పని కోసం’ అనేది అతడు మెస్సీయకు సంబంధించిన పని నిమిత్తం ఈ ప్రమాదాన్ని ఎదుర్కొన్నాడనే భావాన్ని సహజంగా తెలియజేస్తుంది; ‘కారణంగా’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా వినిపిస్తుంది. అందువల్ల దాని అర్థబలాన్ని నిలుపుతూ ‘మెస్సీయ’ అని ఇచ్చాం; తెలుగు క్రైస్తవ వాడుకలో సాధారణమైన ‘క్రీస్తు’ను ప్రత్యామ్నాయంగా పాదసూచికలో పేర్కొన్నాం.
- source_word: μέχρι θανάτου ἤγγισεν
  choice: మరణానికి చేరువయ్యాడు
  rationale: అతడు మరణించే స్థితికి ఎంతో దగ్గరగా వచ్చాడనే గ్రీకు నుడికారాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: παραβολευσάμενος τῇ ψυχῇ
  choice: తన ప్రాణాన్ని పణంగా పెట్టి
  rationale: ఈ కృదంతం ప్రమాదానికి ఉద్దేశపూర్వకంగా తనను తాను గురిచేసుకోవడాన్ని సూచిస్తుంది. ఇక్కడ ψυχή అంటే భౌతిక జీవితం లేదా ప్రాణం; అమూర్తమైన ఆత్మ కాదు.
- source_word: ἵνα ἀναπληρώσῃ
  choice: భర్తీ చేయడానికి
  rationale: ἵνα ఉద్దేశాన్ని సూచిస్తుంది; ἀναπληρόω ఇక్కడ అందుబాటులో లేనిదాన్ని పూరించడం లేదా భర్తీ చేయడం అనే భావంలో ఉంది.
- source_word: τὸ ὑμῶν ὑστέρημα
  choice: కొరవగా ఉన్నదాన్ని
  rationale: ఈ మాట నైతిక వైఫల్యాన్ని తప్పనిసరిగా సూచించదు; వారు దూరంగా ఉండడం వల్ల ఆచరణలో చేయలేకపోయిన సేవను సూచిస్తుంది.
- source_word: τῆς πρός με λειτουργίας
  choice: నాకు మీరు చేసే సేవలో
  rationale: λειτουργία ఇక్కడ పౌలుకు అందించిన ఆచరణాత్మక సహాయం లేదా సేవను సూచిస్తుంది. ‘సేవ’ అనే పదం సందర్భానికి సరిపోతూ పదం యొక్క విస్తృత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పౌలు వాడిన Χριστοῦ అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός కేవలం పేరులా కాక బిరుదుగా కూడా పనిచేస్తుంది. ‘మెస్సీయ’ దాని అర్థాన్ని ప్రత్యక్షంగా వినిపిస్తుంది; అయితే ‘క్రీస్తు’ అనే సంప్రదాయ తెలుగు రూపం కూడా సాధ్యమే కాబట్టి పాదసూచికలో ఇచ్చాం.
- issue: ఫిలిప్పీయుల సేవలో ‘కొరవ’ యొక్క స్వభావం
  choice: వారు దూరంగా ఉండడం వల్ల ప్రత్యక్షంగా అందించలేకపోయిన సేవ
  alternative: వారి నిర్లక్ష్యం లేదా ఇష్టలేమి వల్ల ఏర్పడిన లోపం
  rationale: సందర్భంలో ఎపఫ్రొదితు వారి తరఫున పౌలుకు సేవ చేశాడు. కాబట్టి ὑστέρημα వారిపై నైతిక నింద మోపకుండా, వారి గైర్హాజరు వల్ల మిగిలిన ఆచరణాత్మక కొరవను సూచించేలా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడాం. ‘తన ప్రాణాన్ని పణంగా పెట్టి’ సహజమైన తెలుగు నుడికారం; అది మూలంలోని ప్రమాదకరమైన స్వీయ సమర్పణ భావాన్ని నిలుపుతుంది. కారణార్థకమైన διά యొక్క ‘కోసం/కారణంగా’ వైవిధ్యాన్ని పాదసూచిక ద్వారా కాపాడాం.
