id: PHP.2.22
reference: Philippians 2:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὴν δὲ δοκιμὴν αὐτοῦ γινώσκετε, ὅτι ὡς πατρὶ τέκνον σὺν ἐμοὶ ἐδούλευσεν εἰς τὸ εὐαγγέλιον.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/022.yaml
  text: But you know his proven character[b][a], that as a child with his father he served with me for the gospel.
translation:
  language: te
  text: 'అయితే, అతని పరీక్షల ద్వారా రుజువైన స్వభావం మీకు తెలుసు[a]: తండ్రితో కలిసి సేవచేసే బిడ్డలాగా, అతడు నాతో కలిసి సువార్త కొరకు సేవ చేశాడు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలపదం పరీక్ష ద్వారా నిజమైనదిగా రుజువైన గుణాన్ని లేదా యోగ్యతను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “తండ్రితో బిడ్డలాగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: సందర్భంలోని స్వల్ప వ్యత్యాసాన్ని లేదా విషయమార్పును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: δοκιμὴν αὐτοῦ
  choice: అతడు పరీక్షకు నిలిచినవాడు
  rationale: δοκιμή సూచించే పరీక్ష ద్వారా రుజువైన గుణాన్ని సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే వ్యక్తి-కేంద్రిత రూపంలో వ్యక్తపరుస్తుంది.
- source_word: γινώσκετε
  choice: మీకు తెలుసు
  rationale: ఫిలిప్పీయులకు తిమోతి గురించి ఇప్పటికే ఉన్న పరిజ్ఞానాన్ని వర్తమాన సూచక క్రియకు అనుగుణంగా నేరుగా తెలుపుతుంది.
- source_word: ὅτι
  choice: తదుపరి వాక్యంతో వివరణాత్మక సంబంధం
  rationale: వారు తెలిసికొన్న రుజువైన స్వభావాన్ని తరువాతి వాక్యం వివరిస్తుంది; తెలుగులో బలవంతమైన ‘అని’ ఉపవాక్య నిర్మాణం కంటే వాక్య విభజన సహజంగా ఉంది.
- source_word: ὡς πατρὶ τέκνον
  choice: ఒక బిడ్డ తన తండ్రితో కలిసి సేవ చేసినట్లే
  rationale: τέκνονను లింగనిర్దిష్టమైన ‘కుమారుడు’గా కాక ‘బిడ్డ’గా ఉంచి, ὡς యొక్క ఉపమాన భావాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: σὺν ἐμοὶ
  choice: నాతో కలిసి
  rationale: పౌలుతో తిమోతి కలసి చేసిన సేవను సరళంగా వ్యక్తపరుస్తుంది.
- source_word: ἐδούλευσεν
  choice: సేవ చేశాడు
  rationale: δουλεύωలోని సేవాభావాన్ని నిలుపుతూ, ఈ పరిచర్య సందర్భంలో అసహజంగా కఠినమైన ‘దాసునిగా పనిచేశాడు’ అనే రూపాన్ని నివారిస్తుంది.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: సువార్త కోసం
  rationale: సేవ యొక్క లక్ష్యాన్ని లేదా దిశను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పౌలు–తిమోతి సంబంధంలోని కుటుంబ ఉపమానం
  choice: బిడ్డ తన తండ్రితో కలిసి సేవ చేసినట్లే
  alternative: కుమారుడు తన తండ్రికి సేవ చేసినట్లే
  rationale: మూలపాఠంలోని τέκνον లింగనిరపేక్షమైనది; అలాగే πατρί దత్తివిభక్తిని ‘తండ్రికి’ అని తీసుకుని అధీన సేవ భావాన్ని చేర్చకుండా, σύν ἐμοίతో సమాంతరంగా సహకార భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన శైలి. ‘బిడ్డ’ ద్వారా మూలంలోని లింగనిరపేక్షతను, ‘చేసినట్లే’ ద్వారా ఉపమాన స్వరూపాన్ని కాపాడింది; రెండు పాదాలుగా విభజించడం తెలుగులో స్పష్టతను పెంచుతుంది.
