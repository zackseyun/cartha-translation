  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐμοὶ γὰρ τὸ ζῆν Χριστὸς καὶ τὸ ἀποθανεῖν κέρδος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/021.yaml
  text: For to me[a], to live is Christ, and to die is gain.
translation:
  language: te
  text: ఎందుకంటే, నా విషయానికైతే జీవించడం క్రీస్తే[a], చనిపోవడం లాభం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మెస్సీయే.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοὶ
  choice: నా విషయానికైతే
  rationale: దత్తివ విభక్తిలోని వ్యక్తిగత దృష్టికోణాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; పౌలు తన విషయంగా చెబుతున్నాడనే ఉద్ఘాటనను నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి ఆలోచనకు ఈ వాక్యం వివరణ లేదా కారణం ఇస్తున్న సంబంధాన్ని తెలుగులో సహజంగా చూపిస్తుంది.
- source_word: τὸ ζῆν
  choice: జీవించడం
  rationale: నామవాచకంగా పనిచేసే ధాతురూపాన్ని సహజంగా అనువదిస్తూ, తరువాతి ‘చనిపోవడం’తో ఉన్న సమాంతర నిర్మాణాన్ని కాపాడుతుంది.
- source_word: Χριστὸς
  choice: క్రీస్తే
  rationale: పౌలు వాడుకలో బిరుదుగానూ పేరువలెనూ పనిచేసే Χριστόςకు స్థిరమైన తెలుగు రూపం ‘క్రీస్తు’; ‘-ఏ’ వాక్యంలోని సంక్షిప్త విధేయ ఉద్ఘాటనను తెలియజేస్తుంది.
- source_word: τὸ ἀποθανεῖν
  choice: చనిపోవడం
  rationale: మరణించడాన్ని సూచించే నామీకృత ధాతురూపంగా సహజంగా ఉండి, ‘జీవించడం’తో సమతూకాన్ని నిలుపుతుంది.
- source_word: κέρδος
  choice: లాభం
  rationale: ప్రయోజనం లేదా పొందిక అనే భావాన్ని సంక్షిప్తంగా, సాధారణ పాఠకులకు అర్థమయ్యే విధంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: Χριστός అనే పదంలోని పేరు/బిరుదు భావం
  choice: ప్రధాన పాఠ్యంలో ‘క్రీస్తు’
  alternative: ‘మెస్సీయ’ లేదా ‘అభిషిక్తుడు’
  rationale: ఇక్కడ Χριστός పౌలు వాక్యంలో పేరు వలె సహజంగా పనిచేయవచ్చు; అయినా దాని బిరుదు భావాన్ని తొలగించకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన వాక్య నిర్మాణం. గ్రీకు మూలంలోని రెండు నామీకృత ధాతురూపాల సమాంతరతను ‘జీవించడం / చనిపోవడం’తో కాపాడి, వ్యక్తిగత ఉద్ఘాటనను ‘నా విషయానికైతే’తో వ్యక్తపరిచాం.
