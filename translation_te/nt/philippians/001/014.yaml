source:
  edition: SBLGNT
  text: καὶ τοὺς πλείονας τῶν ἀδελφῶν ἐν κυρίῳ πεποιθότας τοῖς δεσμοῖς μου περισσοτέρως τολμᾶν ἀφόβως τὸν ⸀λόγον λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/014.yaml
  text: And most of the brothers[a], having become confident in the Lord because of my chains, dare all the more to speak the word fearlessly.
translation:
  language: te
  text: నా సంకెళ్ల కారణంగా ప్రభువులో ధైర్యం పొందిన సహోదరులలో ఎక్కువమంది[a], వాక్యాన్ని నిర్భయంగా పలికేందుకు మరింతగా సాహసిస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సహోదర సహోదరీలు’; ఇక్కడ ఈ పదం విస్తృతంగా తోటి విశ్వాసులను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείονας
  choice: ఎక్కువమంది
  rationale: నిర్దిష్ట ఉపపదం మరియు విభక్తి సంబంధంతో ఈ పదం కేవలం ‘మరింతమంది’ అని కాక, సహోదరులలో ‘ఎక్కువమంది’ లేదా అత్యధిక భాగాన్ని సూచిస్తుంది.
- source_word: ἀδελφῶν
  choice: సహోదరులు
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పుంలింగ బహువచనం. మూలరూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, ఇది విస్తృతంగా తోటి విశ్వాసులను సూచించవచ్చని పాదసూచికలో తెలిపాం.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: పౌలు రచనల్లో సాధారణమైన ఈ ప్రయోగాన్ని నేరుగా నిలిపాం; ఇక్కడ నమ్మకం నెలకొనే పరిధి లేదా ఆధారాన్ని ఇది సూచిస్తుంది.
- source_word: πεποιθότας
  choice: నమ్మకం పొందిన
  rationale: పరిపూర్ణ కృదంతం గతంలో ఏర్పడి ప్రస్తుతం కొనసాగుతున్న స్థిరమైన నమ్మకస్థితిని సూచిస్తుంది.
- source_word: τοῖς δεσμοῖς μου
  choice: నా సంకెళ్ల కారణంగా
  rationale: δεσμοί అనే పదంలోని స్పష్టమైన ‘సంకెళ్లు’ అనే చిత్రాన్ని నిలిపి, సందర్భంలోని కారణార్థాన్ని ‘కారణంగా’ ద్వారా వ్యక్తం చేశాం.
- source_word: περισσοτέρως
  choice: మరింతగా
  rationale: పోలికను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τολμᾶν
  choice: సాహసిస్తున్నారు
  rationale: భయం ఉన్న పరిస్థితిలోనూ ధైర్యంగా ముందుకు రావడం అనే క్రియాభావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀφόβως
  choice: నిర్భయంగా
  rationale: ఈ క్రియావిశేషణం భయం లేకపోవడాన్ని స్పష్టంగా సూచిస్తుంది; సాధారణమైన ‘ధైర్యంగా’ కంటే మూలార్థానికి దగ్గరగా ఉంది.
- source_word: τὸν λόγον
  choice: వాక్యాన్ని
  rationale: సందర్భంలో ఇది ప్రకటించబడే సువార్త సందేశాన్ని సూచించే అవకాశమున్నా, గ్రీకులో లేని ‘దేవుని’ లేదా ‘సువార్త’ అనే పదాలను చేర్చకుండా మూలంలోని సంక్షిప్తతను నిలిపాం.
- source_word: λαλεῖν
  choice: పలకడానికి
  rationale: ఇది సాధారణంగా మాట్లాడడాన్ని సూచించే క్రియ; ‘ప్రకటించడానికి’ వంటి మరింత నిర్దిష్ట భావాన్ని మూలంలోకి చేర్చకుండా, తెలుగులో గౌరవప్రదంగా మరియు సహజంగా ఉండే రూపాన్ని ఎంచుకున్నాం.
theological_decisions:
- issue: ἀδελφοί పదం సూచించే పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘సహోదరులు’ అని అనువదించి, విస్తృతంగా తోటి విశ్వాసులను సూచించే అవకాశాన్ని పాదసూచికలో తెలిపాం.
  alternative: ‘సహోదర సహోదరీలు’ లేదా ‘తోటి విశ్వాసులు’
  rationale: గ్రీకు రూపం పుంలింగ బహువచనం కాబట్టి దాని భాషారూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం. అయితే సందర్భంలో స్త్రీపురుష విశ్వాసులందరూ ఉద్దేశించబడి ఉండవచ్చనే భావాన్ని పాదసూచిక సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే శైలిని ఉపయోగించాం. ‘ప్రభువులో,’ ‘సంకెళ్లు,’ ‘వాక్యం’ వంటి మూలంలోని ముఖ్య రూపకాలు మరియు పౌలు వాడే పదబంధాలను నిలిపాం.
