revisions:
- from: మిమ్మల్ని జ్ఞాపకం చేసుకున్న ప్రతిసారీ నేను నా దేవునికి కృతజ్ఞతలు చెల్లిస్తున్నాను.[a]
  to: మిమ్మల్ని జ్ఞాపకం చేసుకునే ప్రతిసారీ నేను నా దేవునికి కృతజ్ఞతలు తెలుపుతున్నాను.[a]
  rationale: This limited revision preserves the Greek present and recurring sense more closely, improves modern Telugu idiom, and retains the footnoted alternative for the syntactic nuance of ἐπὶ with the dative. The ambiguity is preserved without theological interpretation.
