id: PHP.1.3
reference: Philippians 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εὐχαριστῶ τῷ θεῷ μου ἐπὶ πάσῃ τῇ μνείᾳ ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/003.yaml
  text: I thank my God at every remembrance of you,[a]
translation:
  language: te
  text: మిమ్మల్ని జ్ఞాపకం చేసుకునే ప్రతిసారీ నేను నా దేవునికి కృతజ్ఞతలు తెలుపుతున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ గురించిన ప్రతి జ్ఞాపకానికీ నేను నా దేవునికి కృతజ్ఞతలు తెలుపుతున్నాను.”
    reason: ἐπὶ ఇక్కడ కృతజ్ఞత తెలిపే సందర్భాన్ని (‘ప్రతిసారీ’) లేదా దాని ఆధారం/సందర్భాన్ని (‘ప్రతి జ్ఞాపకానికీ’) సూచించగలదు.
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: కృతజ్ఞతలు చెల్లిస్తున్నాను
  rationale: వర్తమానకాల, కర్తరి ప్రయోగ, ఉత్తమ పురుష ఏకవచన క్రియను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; దేవునికి ఉద్దేశించిన కృతజ్ఞతాభావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τῷ θεῷ μου
  choice: నా దేవునికి
  rationale: εὐχαριστέω క్రియతో వచ్చిన చతుర్థీ విభక్తిని తెలుగులో సహజంగా ‘దేవునికి’ అని వ్యక్తపరచి, μου లోని స్వామ్యార్థాన్ని ‘నా’తో నిలుపుతుంది.
- source_word: ἐπὶ πάσῃ τῇ μνείᾳ
  choice: జ్ఞాపకం చేసుకున్న ప్రతిసారీ
  rationale: ἐπὶ ఇక్కడ కృతజ్ఞత చెల్లించే సందర్భాన్ని సూచించగలదు; πάσῃ తో కూడిన ఏకవచన μνείᾳ యొక్క పంపిణీ భావాన్ని ‘ప్రతిసారీ’ సహజంగా తెలియజేస్తుంది. నామవాచక నిర్మాణాన్ని తెలుగులో సులభంగా చదవదగిన క్రియా నిర్మాణంగా మార్చింది.
- source_word: ὑμῶν
  choice: మిమ్మల్ని
  rationale: ὑμῶν బహువచనాన్ని సందర్భానుసారంగా గౌరవసూచక బహువచన రూపమైన ‘మిమ్మల్ని’తో వ్యక్తపరుస్తుంది; ఇది జ్ఞాపకం యొక్క విషయాన్ని సూచించే సాధారణ పఠనాన్ని అనుసరిస్తుంది.
theological_decisions:
- issue: ἐπὶ πάσῃ τῇ μνείᾳ ὑμῶν అనే పదబంధం కృతజ్ఞతకు సందర్భాన్నా లేక కారణాన్నా సూచిస్తుందా?
  choice: మిమ్మల్ని జ్ఞాపకం చేసుకున్న ప్రతిసారీ
  alternative: మీ గురించిన ప్రతి జ్ఞాపకానికీ
  rationale: ప్రధాన పాఠం సందర్భార్థాన్ని సహజమైన తెలుగులో ఇస్తుంది; ప్రత్యామ్నాయం ἐπὶ యొక్క కారణార్థాన్నీ గ్రీకు నామవాచక నిర్మాణాన్నీ మరింత దగ్గరగా ప్రతిబింబిస్తుంది. ఏ ప్రత్యేక సిద్ధాంతపరమైన నిర్ధారణనూ దీనిపై మోపలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘స్తుతిస్తున్నాను’ కంటే మూలంలోని కృతజ్ఞత భావాన్ని కచ్చితంగా చూపేందుకు ‘కృతజ్ఞతలు చెల్లిస్తున్నాను’ ఎంచుకోబడింది. పాదసూచిక గుర్తు ప్రధాన పాఠంలో [a]గా ఉంచబడింది.
