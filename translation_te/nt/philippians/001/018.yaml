id: PHP.1.18
reference: Philippians 1:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τί γάρ; πλὴν ⸀ὅτι παντὶ τρόπῳ, εἴτε προφάσει εἴτε ἀληθείᾳ, Χριστὸς καταγγέλλεται, καὶ ἐν τούτῳ χαίρω· ἀλλὰ καὶ χαρήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/018.yaml
  text: What then? Only that in every way[a], whether in pretense or in truth, Messiah is being proclaimed, and in this I rejoice. Yes[b], and I will rejoice.
translation:
  language: te
  text: అయితే ఏమిటి? ఏ విధంగానైనా—కపటంగానైనా, నిజాయితీతోనైనా—మెస్సీయ[a] ప్రకటించబడుతున్నాడు; అంతే ముఖ్యం. దీనిలో నేను ఆనందిస్తున్నాను. అవును, నేను కూడా ఆనందిస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “క్రీస్తు.”
    reason: theological_lexical_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: అయితే ఏమిటి?
  rationale: పౌలు చేస్తున్న సంక్షిప్త ప్రశ్నార్థక మలుపును అతిగా వివరణ చేర్చకుండా సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: πλὴν ὅτι
  choice: అంతే ముఖ్యం
  rationale: ప్రచారకుల ఉద్దేశాలు ఎలా ఉన్నా, మెస్సీయ ప్రకటించబడుతున్నాడనే విషయానికే పౌలు ప్రాధాన్యం ఇస్తున్న సంకోచక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παντὶ τρόπῳ
  choice: ఏ విధంగానైనా
  rationale: ప్రతి పద్ధతిలో లేదా ప్రతి పరిస్థితిలో అనే విస్తృత పంపిణీ భావాన్ని కాపాడుతుంది.
- source_word: προφάσει
  choice: కపటంగా
  rationale: నిజమైన ఉద్దేశం కాని బాహ్య ప్రదర్శన లేదా మిథ్యా ఉద్దేశాన్ని సూచిస్తుంది; సందర్భం కంటే ఎక్కువ వివరాన్ని చేర్చదు.
- source_word: ἀληθείᾳ
  choice: నిజాయితీతో
  rationale: προφάσειతో ఉన్న ఉద్దేశపూర్వక వ్యత్యాసాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: ఇక్కడ ఇది ప్రకటించబడుతున్న వ్యక్తి యొక్క బిరుదుగా పనిచేస్తోంది; గ్రీకు పదంలోని అభిషిక్తుడు అనే బిరుదు భావాన్ని నిలుపుతుంది.
- source_word: καταγγέλλεται
  choice: ప్రకటించబడుతున్నాడు
  rationale: వర్తమాన కాలంలోని కొనసాగుతున్న భావాన్నీ, కర్మణి రూపాన్నీ, బహిరంగ ప్రకటన భావాన్నీ నిలుపుతుంది.
- source_word: ἐν τούτῳ χαίρω
  choice: దీనిలో నేను ఆనందిస్తున్నాను
  rationale: పౌలు ఆనందానికి ముందు చెప్పిన మెస్సీయ ప్రకటననే ప్రత్యక్ష ఆధారంగా ఉంచుతుంది.
- source_word: ἀλλὰ καὶ χαρήσομαι
  choice: అవును, ఇకముందూ ఆనందిస్తాను
  rationale: ἀλλὰ καί యొక్క బలపరిచే, చేర్చే శక్తిని సహజంగా తెలుపుతూ భవిష్యత్ కాలాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ వాక్యంలో Χριστός పేరు వలె కాక, ప్రకటించబడుతున్న బిరుదుగల వ్యక్తిని సూచిస్తుంది. అందువల్ల ‘మెస్సీయ’ మూలంలోని బిరుదు భావాన్ని మరింత ప్రత్యక్షంగా అందిస్తుంది; సుపరిచితమైన ‘క్రీస్తు’ రూపాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని సంక్షిప్త ప్రశ్న, కపటం–నిజాయితీ వ్యత్యాసం, వర్తమాన ఆనందం నుంచి భవిష్యత్ ఆనందానికి మార్పు నిలుపబడ్డాయి.
