- from: వీరు ప్రేమతో అలా చేస్తున్నారు; శుభవార్తను సమర్థించడానికి నేను నియమించబడ్డానని వారికి తెలుసు.
  to: మొదటివారు ప్రేమతో అలా చేస్తున్నారు; శుభవార్తను సమర్థించడానికి నేను నియమించబడ్డానని వారికి తెలుసు.
