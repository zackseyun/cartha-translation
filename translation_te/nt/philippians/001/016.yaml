id: PHP.1.16
reference: Philippians 1:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ μὲν ἐξ ⸂ἀγάπης, εἰδότες ὅτι εἰς ἀπολογίαν τοῦ εὐαγγελίου κεῖμαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/016.yaml
  text: The former do so out of love[a], knowing that I am appointed for the defense of the good news[b],
translation:
  language: te
  text: మొదటివారు ప్రేమతో అలా చేస్తున్నారు; శుభవార్తను సమర్థించడానికి నేను నియమించబడ్డానని వారికి తెలుసు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ μὲν
  choice: వీరు ... అలా చేస్తున్నారు
  rationale: తరువాతి వచనంలోని οἱ δέతో ఉన్న వ్యత్యాసాన్ని చూపుతూ, పరిసర సందర్భంలో సూచితమైన క్రియను సహజమైన తెలుగులో ‘అలా చేస్తున్నారు’ అని వ్యక్తపరుస్తుంది.
- source_word: ἐξ ἀγάπης
  choice: ప్రేమతో
  rationale: ἐξ ఇక్కడ ప్రేరణ లేదా ఉద్దేశాన్ని సూచిస్తుంది; ‘ప్రేమతో’ ఆధునిక తెలుగులో సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: εἰδότες
  choice: తెలుసు
  rationale: ప్రేమతో చేసే కార్యానికి ఆధారమైన జ్ఞానాన్ని తెలుపుతుంది; తెలుగు వాక్యనిర్మాణంలో ‘అని వారికి తెలుసు’ సహజంగా ఉంది.
- source_word: εἰς ἀπολογίαν
  choice: సమర్థించడానికి
  rationale: ἀπολογίαలోని న్యాయపరమైన లేదా హేతుబద్ధమైన ప్రతివాద భావాన్ని, εἰς యొక్క ఉద్దేశార్థంతో కలిపి స్పష్టంగా అందిస్తుంది.
- source_word: τοῦ εὐαγγελίου
  choice: శుభవార్తను
  rationale: εὐαγγέλιον యొక్క మూల భావాన్ని సాధారణ ఆధునిక పాఠకులకు పారదర్శకంగా అందిస్తుంది.
- source_word: κεῖμαι
  choice: నేను నియమించబడ్డాను
  rationale: ఇక్కడ భౌతికంగా ‘ఉంచబడ్డాను’ అనే భావం కంటే ఒక ఉద్దేశం కోసం స్థాపించబడిన లేదా నియమించబడిన స్థితిని సూచించే సందర్భోచిత భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: పౌలు చెరలో ఉన్న సందర్భంలో κεῖμαι యొక్క భావం
  choice: నేను నియమించబడ్డాను
  alternative: నేను ఇందుకోసం ఉంచబడ్డాను
  rationale: పౌలు ప్రస్తుత పరిస్థితి శుభవార్తను సమర్థించే ఉద్దేశానికి సంబంధించినదని తెలియజేస్తుంది; అయితే ఎవరు నియమించారో వచనంలో లేనందున దానిని స్పష్టంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని అధ్యాహార క్రియను తెలుగులో స్పష్టంచేసి, తరువాతి వచనంతో ఉన్న వ్యత్యాసాన్ని నిలిపింది.
