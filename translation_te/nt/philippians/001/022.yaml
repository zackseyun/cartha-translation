- from: అయితే శరీరంలో జీవిస్తూ ఉండడమే నాకు ఫలభరితమైన పని అయితే[a][b], దేనిని ఎంచుకోవాలో నాకు తెలియదు.
  to: కానీ శరీరంలో జీవిస్తూ ఉండడం నాకు ఫలభరితమైన పని అయితే[a][b]—దేనిని ఎంచుకుంటానో నాకు తెలియదు.
