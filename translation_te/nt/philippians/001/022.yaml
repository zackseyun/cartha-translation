source:
  edition: SBLGNT
  text: εἰ δὲ τὸ ζῆν ἐν σαρκί, τοῦτό μοι καρπὸς ἔργου— καὶ τί αἱρήσομαι οὐ γνωρίζω·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/022.yaml
  text: But if to go on living in the flesh means fruitful labor for me[b][a], yet which I will choose I do not know.
translation:
  language: te
  text: కానీ శరీరంలో జీవిస్తూ ఉండడం నాకు ఫలభరితమైన పని అయితే[a][b]—దేనిని ఎంచుకుంటానో నాకు తెలియదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా “మాంసంలో.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “పని ఫలం” లేదా “ఫలవంతమైన పని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ζῆν
  choice: జీవిస్తూ ఉండడం
  rationale: వర్తమాన శారీరక జీవితాన్ని కొనసాగించడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν σαρκί
  choice: శరీరంలో
  rationale: ఈ సందర్భంలో σάρξ పాప స్వభావాన్ని కాక భౌతిక శరీర జీవితాన్ని సూచిస్తుంది; తెలుగులో ‘శరీరంలో’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: καρπὸς ἔργου
  choice: ఫలభరితమైన పని
  rationale: గ్రీకు పదబంధంలోని సంక్షిప్తతను సహజమైన తెలుగులో వ్యక్తం చేస్తూ, ప్రయోజనకరమైన సేవ/పని అనే భావాన్ని నిలుపుతుంది.
- source_word: αἱρήσομαι
  choice: ఎంచుకోవాలో
  rationale: రెండు అవకాశాల మధ్య ఎంపికను ఈ సందర్భంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὐ γνωρίζω
  choice: నాకు తెలియదు
  rationale: ఇక్కడ γνωρίζω అనిశ్చితిని తెలిపే ప్రయోగం; ‘నాకు తెలియదు’ సందర్భానికి సహజమైన అనువాదం.
theological_decisions:
- issue: ఈ వచనంలో σάρξ అర్థం
  choice: భౌతిక శరీర జీవితం (‘శరీరంలో’)
  alternative: పాప స్వభావం
  rationale: సందర్భం భూమిపై శరీరంతో జీవించడం కొనసాగించడాన్ని, వెళ్లిపోయి క్రీస్తుతో ఉండడాన్ని పరస్పరం ఉంచుతుంది; కాబట్టి ఇది నైతిక భ్రష్టత్వాన్ని సూచించదు.
- issue: εἰ δὲ ... καὶ నిర్మాణంలోని అసంపూర్ణత/ఉద్వేగం
  choice: ‘అయితే ... అయితే, దేనిని ... నాకు తెలియదు’ అనే స్వల్పంగా విరిగిన వాక్య ప్రవాహాన్ని నిలుపడం
  alternative: ‘అప్పుడు’ వంటి పదంతో పూర్తిగా సవ్యమైన షరతు-ఫలిత వాక్యంగా మార్చడం
  rationale: గ్రీకు వాక్యం సంక్షిప్తంగా, కొంత అసంపూర్ణ నిర్మాణంతో ఉంది; దానిని మౌనంగా ఒకే నిర్దిష్ట తార్కిక సంబంధంగా పరిష్కరించకుండా భావ ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన శైలిలో. ‘శరీరంలో’ అనేది తెలుగులో ‘మాంసంలో’ కంటే ఈ భౌతిక-జీవిత సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది. గ్రీకు వాక్య నిర్మాణంలోని స్వల్ప అసంపూర్ణతను పూర్తిగా సాఫీ చేయకుండా పరిరక్షించాం.
