id: PHP.1.6
reference: Philippians 1:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πεποιθὼς αὐτὸ τοῦτο ὅτι ὁ ἐναρξάμενος ἐν ὑμῖν ἔργον ἀγαθὸν ἐπιτελέσει ἄχρι ἡμέρας ⸂Χριστοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/006.yaml
  text: 'I am confident of this very thing: that he who began a good work among you will bring it to completion at the day of Messiah Jesus.'
translation:
  language: te
  text: 'ఈ విషయమై నాకు దృఢమైన నమ్మకం ఉంది: మీ మధ్య మంచి కార్యాన్ని ప్రారంభించినవాడు మెస్సీయ యేసు[c] దినానికి[b] దానిని పూర్తి చేస్తాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీలో.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మెస్సీయ యేసు దినం వరకు.”
    reason: lexical_alternative
  - marker: c
    text: సాంప్రదాయంగా, “క్రీస్తు యేసు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς αὐτὸ τοῦτο
  choice: ఈ విషయం గురించి నాకు పూర్తి నమ్మకం ఉంది
  rationale: కృదంతానికి సందర్భానుసారంగా పౌలు ప్రథమ పురుష దృక్కోణాన్ని స్పష్టంగా వ్యక్తం చేస్తూ, αὐτὸ τοῦτο లోని ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ὁ ἐναρξάμενος
  choice: ప్రారంభించినవాడు
  rationale: వ్యక్తిగత కర్తను నిలుపుతుంది; సందర్భంలో కర్త దేవుడని సూచితమైనా, మూలంలో లేని ‘దేవుడు’ అనే పదాన్ని చేర్చదు.
- source_word: ἐν ὑμῖν
  choice: మీ మధ్య
  rationale: ὑμῖν బహువచనం మరియు ఫిలిప్పీ సంఘానికి ఉద్దేశించిన సామూహిక సంబోధన దృష్ట్యా ‘మీ మధ్య’ ప్రధాన పాఠంలో సరిపోతుంది; ‘మీలో’ కూడా వ్యాకరణపరంగా సాధ్యమే.
- source_word: ἔργον ἀγαθὸν
  choice: మంచి కార్యాన్ని
  rationale: మూలంలోని సాధారణ, విస్తరింపబడని భావాన్ని నేరుగా అందిస్తుంది.
- source_word: ἐπιτελέσει
  choice: దానిని పూర్తి చేస్తాడు
  rationale: ప్రారంభించిన కార్యాన్ని విజయవంతంగా ముగింపుకు తీసుకురావడం అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἄχρι ἡμέρας
  choice: దినాన
  rationale: తెలుగులో పూర్తి చేయబడే అంత్యకాల లక్ష్యదినాన్ని సహజంగా సూచిస్తుంది; అయితే ἄχρι యొక్క ప్రత్యక్ష కాలపరిమితి భావం ‘దినం వరకు’గా కూడా అనువదించవచ్చు.
- source_word: Χριστοῦ Ἰησοῦ
  choice: మెస్సీయ యేసు
  rationale: Χριστόςను ఇక్కడ బిరుదుగా భావించి దాని అర్థాన్ని ‘మెస్సీయ’గా అందిస్తుంది; సాంప్రదాయ లిప్యంతరీకరణ ‘క్రీస్తు’ను పాదసూచికలో ఉంచుతుంది.
theological_decisions:
- issue: దేవుని కార్యానికి వ్యక్తిగత పరిధా, సామూహిక పరిధా
  choice: సంఘాన్ని ఉద్దేశించిన బహువచన సంబోధనను ప్రతిబింబిస్తూ ‘మీ మధ్య’
  alternative: ‘మీలో’; ఇది ప్రతి వ్యక్తిలో జరిగే కార్యాన్ని మరింత బలంగా వినిపించవచ్చు
  rationale: లేఖా సందర్భం సామూహిక భావానికి మద్దతిస్తుంది; అయినా వ్యక్తిగత అన్వయాన్ని నిరాకరించకుండా మూలంలోని సాధ్యమైన ద్వంద్వార్థాన్ని పాదసూచికలో నిలుపుతుంది.
- issue: ἄχρι ἡμέρας సూచించే కాల సంబంధం
  choice: ‘దినాన’—ఆ దినాన్ని కార్యసంపూర్తి లక్ష్యంగా చూపడం
  alternative: ‘దినం వరకు’—ప్రక్రియ ఆ దినం దాకా కొనసాగుతుందని మరింత ప్రత్యక్షంగా చూపడం
  rationale: ఎస్కటాలజికల్ సంపూర్తిని సహజ తెలుగులో తెలియజేస్తూనే, గ్రీకు ఉపసర్గకు దగ్గరైన ప్రత్యామ్నాయాన్ని పాదసూచికలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘పూర్తి నమ్మకం’, ‘మంచి కార్యం’, ‘పూర్తి చేస్తాడు’ వంటి సాధారణంగా అర్థమయ్యే పదబంధాలు వాడబడ్డాయి. మూలంలోని సామూహిక/వ్యక్తిగత మరియు ‘దినాన’/‘దినం వరకు’ అనే భావసాధ్యతలను పాదసూచికలతో నిలిపాం.
