revisions:
- from: 'ఒక్కటే: మీరు మెస్సీయ సువార్తకు తగిన విధంగా ప్రవర్తించండి.[a] అప్పుడు, నేను వచ్చి మిమ్మల్ని చూసినా లేదా దూరంగా ఉండి మీ గురించి విన్నా, మీరు ఒకే ఆత్మలో[b] స్థిరంగా నిలిచి, ఒకే ప్రాణంతో[c] సువార్త విశ్వాసం కోసం[d] కలిసి పోరాడుతున్నారని తెలుసుకుంటాను.'
  to: 'ఒక్కటే: మీరు మెస్సీయ యొక్క సువార్తకు తగిన విధంగా ప్రవర్తించండి.[a] అప్పుడు నేను వచ్చి మిమ్మల్ని చూసినా, లేదా గైర్హాజరుగా ఉన్నా, మీరు ఒకే ఆత్మలో[b] స్థిరంగా నిలిచి, ఒకే మనస్సుతో[c] సువార్తకు సంబంధించిన విశ్వాసం కోసం[d] కలిసి పోరాడుతున్నారని మీ గురించి నేను వినగలుగుతాను.'
  rationale: The revision corrects the scope of Paul’s present/absent alternatives and removes the added temporal force. It uses idiomatic modern Telugu for united purpose while documenting the literal ψυχή imagery. It retains the lexical civic nuance of πολιτεύεσθε, the title ‘మెస్సీయ,’ and the unresolved possibilities in πνεύματι and the gospel-faith genitive.
  reviewer_model: gpt-5.6-terra
