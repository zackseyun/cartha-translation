  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μόνον ἀξίως τοῦ εὐαγγελίου τοῦ Χριστοῦ πολιτεύεσθε, ἵνα εἴτε ἐλθὼν καὶ ἰδὼν ὑμᾶς εἴτε ἀπὼν ⸀ἀκούω τὰ περὶ ὑμῶν, ὅτι στήκετε ἐν ἑνὶ πνεύματι, μιᾷ ψυχῇ συναθλοῦντες τῇ πίστει τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/027.yaml
  text: Only conduct yourselves in a manner worthy of the gospel of Messiah[a], so that whether I come and see you or am absent, I may hear about you that you are standing firm in one spirit, with one soul striving together for the faith of the gospel[e][d][c][b],
translation:
  language: te
  text: 'ఒక్కటే: మీరు మెస్సీయ యొక్క సువార్తకు తగిన విధంగా ప్రవర్తించండి.[a] అప్పుడు నేను వచ్చి మిమ్మల్ని చూసినా, లేదా గైర్హాజరుగా ఉన్నా, మీరు ఒకే ఆత్మలో[b] స్థిరంగా నిలిచి, ఒకే మనస్సుతో[c] సువార్తకు సంబంధించిన విశ్వాసం కోసం[d] కలిసి పోరాడుతున్నారని మీ గురించి నేను వినగలుగుతాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి గ్రీకు క్రియకు పౌరులుగా జీవించడం అనే ఛాయ కూడా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఒకే పరిశుద్ధాత్మలో.”
    reason: alternative_reading
  - marker: c
    text: అక్షరార్థంగా, “ఒకే ప్రాణంతో” లేదా “ఒకే ఆత్మతో.”
    reason: lexical_alternative
  - marker: d
    text: లేదా, “సువార్తపై విశ్వాసం కోసం.”
    reason: alternative_reading
lexical_decisions:
- source_word: Μόνον
  choice: ఒక్కటే
  rationale: వాక్యారంభంలోని ఉద్ఘాటనను సహజమైన తెలుగులో చూపిస్తూ, పౌలు చెప్పబోయే ప్రధాన ఆదేశంపై దృష్టి నిలుపుతుంది.
- source_word: ἀξίως
  choice: తగిన విధంగా
  rationale: జీవన ప్రవర్తన సువార్తకు అనుగుణంగా ఉండాలనే క్రియావిశేషణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πολιτεύεσθε
  choice: ప్రవర్తించండి
  rationale: సందర్భంలో ఉద్దేశించిన సామూహిక జీవన ప్రవర్తనను ఆధునిక తెలుగులో స్పష్టంగా తెలుపుతుంది; పౌరజీవన ఛాయను పాదసూచికలో ఉంచింది.
- source_word: τοῦ εὐαγγελίου τοῦ Χριστοῦ
  choice: మెస్సీయ సువార్తకు
  rationale: Χριστόςను బిరుదుగా ‘మెస్సీయ’ అని అనువదిస్తూ, జనిటివ్ సంబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: στήκετε
  choice: స్థిరంగా నిలిచి
  rationale: దృఢంగా నిలబడటం, వెనుకడుగు వేయకపోవటం అనే భావాన్ని కాపాడుతుంది.
- source_word: ἐν ἑνὶ πνεύματι
  choice: ఒకే ఆత్మలో
  rationale: సమాజంలోని ఏకత్వ భావానికి సరిపోతుంది; పరిశుద్ధాత్మను సూచించే అవకాశం పాదసూచికలో నిలుపబడింది.
- source_word: μιᾷ ψυχῇ
  choice: ఒకే ప్రాణంతో
  rationale: ψυχή యొక్క సజీవమైన రూపకాన్ని కాపాడుతూ, ఏకమనస్కమైన సమష్టి ప్రయత్నాన్ని సూచిస్తుంది.
- source_word: συναθλοῦντες
  choice: కలిసి పోరాడుతున్నారని
  rationale: కలిసి పోటీ పడటం లేదా శ్రమించటం అనే సమష్టి పోరాట చిత్రాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: τῇ πίστει τοῦ εὐαγγελίου
  choice: సువార్త విశ్వాసం కోసం
  rationale: గ్రీకు జనిటివ్ నిర్మాణంలోని సంబంధాన్ని పూర్తిగా ఒకే అర్థానికి పరిమితం చేయకుండా కాపాడుతుంది.
- source_word: ἀκούω τὰ περὶ ὑμῶν
  choice: మీ గురించి విన్నా
  rationale: గ్రీకు నుడికారాన్ని సహజమైన తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: πνεύματι అనేది పరిశుద్ధాత్మను సూచిస్తుందా, లేక విశ్వాసుల ఉమ్మడి అంతరాత్మ లేదా వైఖరిని సూచిస్తుందా?
  choice: ఒకే ఆత్మలో
  alternative: ఒకే ఆత్మలో—అంటే ఒకే పరిశుద్ధాత్మలో
  rationale: తర్వాతి ‘ఒకే ప్రాణంతో’ అనే సమాంతర పదబంధం విశ్వాసుల ఏకత్వాన్ని ముందుకు తెస్తుంది; అయినా పరిశుద్ధాత్మకు సూచన ఉండే అవకాశాన్ని పాదసూచికలో కాపాడింది.
- issue: τῇ πίστει τοῦ εὐαγγελίουలోని జనిటివ్ సంబంధం
  choice: సువార్త విశ్వాసం కోసం
  alternative: సువార్తపై విశ్వాసం కోసం
  rationale: ఇది సువార్తకు సంబంధించిన విశ్వాససత్యాన్ని లేదా సువార్తపై ఉంచే విశ్వాసాన్ని సూచించవచ్చు; ప్రధాన పాఠం సంబంధాన్ని తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘ప్రవర్తించండి’ సహజత్వాన్ని కాపాడగా, πολιτεύεσθεలోని పౌరసంబంధ ఛాయ పాదసూచికలో నిలుపబడింది. ‘ఆత్మ’ మరియు ‘సువార్త విశ్వాసం’ వద్ద మూలంలోని నిజమైన అర్థసందిగ్ధత పరిష్కరించకుండా ఉంచబడింది.
