  edition: SBLGNT
  text: τὸ δὲ ἐπιμένειν ⸀ἐν τῇ σαρκὶ ἀναγκαιότερον δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/024.yaml
  text: But to remain in the flesh is more necessary for your sake[a].
translation:
  language: te
  text: అయితే, శరీరంలో ఉండడం మీ కొరకు మరింత అవసరం[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేహంలో జీవిస్తూ ఉండడం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἐπιμένειν
  choice: కొనసాగడం
  rationale: ఆర్టికల్‌తో ఉన్న క్రియావాచక రూపం వాక్యంలో నామవాచకంగా పనిచేస్తోంది. ‘కొనసాగడం’ పౌలు తన ప్రస్తుత భౌతిక జీవితంలో ఇంకా ఉండడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వచనంలోని క్రీస్తుతో ఉండటానికి వెళ్లిపోవాలనే ఆలోచనకు ఇది వ్యత్యాసాన్ని సూచిస్తుంది; ‘అయితే’ ఆ మలుపును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ σαρκὶ
  choice: శరీరంలోనే
  rationale: ఇక్కడ σάρξ పాపస్వభావాన్ని కాక, భౌతిక దేహంతో కూడిన ఈ లోక జీవితాన్ని సూచిస్తుంది. ‘శరీరంలోనే’ మూలంలోని రూపకాన్ని కాపాడుతూ సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: ἀναγκαιότερον
  choice: మరింత అవసరం
  rationale: గ్రీకు పదంలోని తులనాత్మక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: δι’ ὑμᾶς
  choice: మీ నిమిత్తం
  rationale: ఇది ఫిలిప్పీయుల ప్రయోజనార్థమైన ఉద్దేశాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ఈ వచనంలో σάρξ అర్థం
  choice: భౌతిక దేహంతో కూడిన ఈ లోక జీవితం (‘శరీరంలోనే’)
  alternative: నైతిక రూపకార్థమైన ‘పాపస్వభావంలో’; లేదా విస్తరించిన ‘ఈ లోకంలో బ్రతికి ఉండడం’
  rationale: సందర్భంలో పౌలు క్రీస్తుతో ఉండటానికి వెళ్లిపోవడాన్ని, ఫిలిప్పీయుల ప్రయోజనం కోసం తన ప్రస్తుత దేహసహిత జీవితాన్ని కొనసాగించడాన్ని పరస్పరం పోలుస్తున్నాడు. నైతిక అర్థాన్ని ఇక్కడ చేర్చడానికి సందర్భాధారం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘శరీరంలోనే’ అనే పదబంధం మూలంలోని σάρξ రూపాన్ని నిలుపుతుంది; పాదసూచిక దాని సందర్భార్థాన్ని స్పష్టం చేసే సహజ ప్రత్యామ్నాయాన్ని ఇస్తుంది.
