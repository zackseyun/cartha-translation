id: PHP.1.10
reference: Philippians 1:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰς τὸ δοκιμάζειν ὑμᾶς τὰ διαφέροντα, ἵνα ἦτε εἰλικρινεῖς καὶ ἀπρόσκοποι εἰς ἡμέραν Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/010.yaml
  text: so that you may approve the things that are excellent[a], in order that you may be pure and blameless for the day of Messiah[b],
translation:
  language: te
  text: ఏవి శ్రేష్ఠమైనవో వివేచించి గుర్తించేలా[a], మెస్సీయ దినానికై మీరు నిర్మలులుగానూ నిందకు తావులేనివారుగానూ ఉండేలా[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ముఖ్యమైనవాటిని వివేచించి గుర్తించేలా,” “శ్రేష్ఠమైనవాటిని ఆమోదించేలా”; మరింత అక్షరార్థంగా: “భిన్నమైనవాటిని పరీక్షించేలా.”'
    reason: lexical_alternative
  - marker: b
    text: 'సంప్రదాయ అనువాదం: “క్రీస్తు దినానికై.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δοκιμάζειν
  choice: పరీక్షించి ఆమోదించేలా
  rationale: ఈ క్రియలో పరీక్షించడం, పరిశీలించడం, పరీక్షించిన తరువాత ఆమోదించడం అనే భావాలు ఉన్నాయి. సంయుక్త పదబంధం ఆ రెండు పార్శ్వాలనూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τὰ διαφέροντα
  choice: శ్రేష్ఠమైనవాటిని
  rationale: అక్షరార్థంగా ‘భిన్నమైనవి’ అయినప్పటికీ, ఈ సందర్భంలో ఈ పదబంధం ఎక్కువ విలువగల లేదా ఉత్తమమైన విషయాలను సూచించే తులనాత్మక భావాన్ని కలిగి ఉంది.
- source_word: εἰλικρινεῖς
  choice: నిర్మలులుగా
  rationale: ఈ విశేషణం స్వచ్ఛత లేదా నిష్కపటత్వాన్ని సూచించగలదు. నైతిక సమగ్రతను తెలియజేస్తూ తరువాతి విశేషణంతో సహజంగా జతపడేందుకు ‘నిర్మలులు’ ఎంచుకున్నాం.
- source_word: ἀπρόσκοποι
  choice: నిందకు తావులేనివారుగా
  rationale: ఈ పదం తాము తడబడకపోవడం లేదా ఇతరులకు ఆటంకం కలిగించకపోవడం అనే భావాలను కలిగి ఉండవచ్చు. ఇక్కడ వ్యక్తి జీవితం అభ్యంతరానికి లేదా నిందకు అవకాశం ఇవ్వనిదిగా ఉండాలనే విస్తృత నైతిక భావాన్ని ఈ అనువాదం అందిస్తుంది.
- source_word: εἰς ἡμέραν Χριστοῦ
  choice: మెస్సీయ దినం కోసం
  rationale: εἰς లక్ష్యం లేదా దిశను సూచిస్తుంది; అందువల్ల ‘కోసం’ సహజంగా సరిపోతుంది. Χριστοῦ ఇక్కడ బిరుదుగా వాడబడినందున దాని అర్థాన్ని నిలుపుతూ ‘మెస్సీయ’ అని అనువదించాం.
theological_decisions:
- issue: εἰς ἡμέραν Χριστοῦ అనే అంత్యకాల పదబంధంలో Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: Χριστός ఇక్కడ బిరుదు స్వభావంతో ఉండి ‘అభిషిక్తుడు/మెస్సీయ’ అనే అర్థాన్ని కలిగి ఉంది. సుపరిచితమైన సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ఈ వచనం ముందు వాక్యంపై ఆధారపడే ఉద్దేశార్థక ఉపవాక్యం కాబట్టి చివర కామాను నిలిపాం. మూలంలోని పరీక్ష–ఆమోద భావసమ్మేళనాన్ని, τὰ διαφέροντα లోని తులనాత్మక అస్పష్టతను పాదటిప్పణితో సంరక్షించాం.
