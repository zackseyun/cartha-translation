id: PHP.1.15
reference: Philippians 1:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τινὲς μὲν καὶ διὰ φθόνον καὶ ἔριν, τινὲς δὲ καὶ δι’ εὐδοκίαν τὸν Χριστὸν κηρύσσουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/015.yaml
  text: Some indeed proclaim the Messiah because of envy and rivalry[a], but others because of goodwill.
translation:
  language: te
  text: కొందరు అసూయతో, పోటీతో క్రీస్తును[a] ప్రకటిస్తున్నారు; మరికొందరు మంచి ఉద్దేశంతో క్రీస్తును ప్రకటిస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మెస్సీయను.’ గ్రీకు బిరుదు Χριστός (క్రిస్టోస్); దీని అర్థం ‘అభిషిక్తుడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Τινὲς μὲν … τινὲς δὲ
  choice: కొందరు … మరికొందరు
  rationale: రెండు భిన్న గుంపుల మధ్య ఉన్న μέν … δέ వ్యత్యాసాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: διὰ φθόνον
  choice: అసూయతో
  rationale: διά + accusative ఇక్కడ కారణాన్ని లేదా ప్రేరణను సూచిస్తుంది; ‘అసూయతో’ ఆ ఉద్దేశాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔριν
  choice: పోటీ భావంతో
  rationale: సందర్భంలో ἔρις కేవలం కలహం కంటే వ్యక్తుల మధ్య పోటీతత్వం, విరోధపూరిత పోటీని సూచిస్తుంది; ‘పోటీ భావం’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: δι’ εὐδοκίαν
  choice: సదుద్దేశంతో
  rationale: అసూయ, పోటీ భావాలకు విరుద్ధమైన మంచి ఉద్దేశాన్ని సూచిస్తుంది. ‘సదుద్దేశంతో’ ఆధునిక తెలుగులో సహజమైన కారణ/ప్రేరణ భావాన్ని ఇస్తుంది.
- source_word: τὸν Χριστόν
  choice: క్రీస్తును
  rationale: Χριστός అభిషిక్తుడు/మెస్సీయ అనే బిరుదు; తెలుగులో స్థిరపడ్డ ‘క్రీస్తు’ రూపం సహజంగా, గౌరవప్రదంగా ఉంటుంది. మూల బిరుదు భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: κηρύσσουσιν
  choice: ప్రకటిస్తున్నారు
  rationale: κηρύσσωలోని బహిరంగంగా చాటిచెప్పే భావాన్ని ‘ప్రకటించు’ స్పష్టంగా అందిస్తుంది; సంస్థాగత బోధన భావాన్ని అనవసరంగా చేర్చదు.
theological_decisions:
- issue: Χριστόςను పేరు వలెనా, బిరుదు వలెనా చూపాలి
  choice: ప్రధాన పాఠ్యంలో ‘క్రీస్తు’; పాదసూచికలో ‘మెస్సీయ’ అనే అర్థం
  alternative: ప్రధాన పాఠ్యంలో ‘మెస్సీయ’
  rationale: గ్రీకులో articleతో ఉన్న Χριστός బిరుదు స్వభావాన్ని కలిగి ఉంది. అయితే ఆధునిక తెలుగు బైబిలు వాడుకలో ‘క్రీస్తు’ సహజమైన స్థిర రూపం; పాదసూచిక మూల బిరుదు భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదంగా మరియు సంక్షిప్తంగా రూపొందించబడింది. గ్రీకు వాక్యంలోని రెండు గుంపుల వ్యత్యాసం నిలుపబడింది; పునరుక్త క్రియను తెలుగులో స్పష్టత కోసం రెండు భాగాల్లోనూ ఉంచాం.
