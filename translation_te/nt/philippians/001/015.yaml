revisions:
- from: కొందరు అసూయతో, పోటీ భావంతో క్రీస్తును[a] ప్రకటిస్తున్నారు; మరికొందరు సదుద్దేశంతో ప్రకటిస్తున్నారు.
  to: కొందరు అసూయతో, పోటీతో క్రీస్తును[a] ప్రకటిస్తున్నారు; మరికొందరు మంచి ఉద్దేశంతో క్రీస్తును ప్రకటిస్తున్నారు.
  rationale: The revision maintains the Greek’s twofold contrast and repeated predicate while using more direct modern Telugu for rivalry and positive motive. The established term ‘క్రీస్తు’ is retained in the text, with the footnote preserving ‘మెస్సీయ’ as the titular lexical alternative.
