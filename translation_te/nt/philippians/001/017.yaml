revisions:
- from: అయితే మరికొందరు స్వార్థపూరిత పోటీభావంతో మెస్సీయను[a] ప్రకటిస్తున్నారు. వారు చిత్తశుద్ధితో అలా చేయడం లేదు; నేను బంధాల్లో[b] ఉండగా నాకు బాధ కలిగించాలని అనుకుంటున్నారు.
  to: అయితే ఇతరులు స్వార్థపూరిత ఆశయంతో మెస్సీయను[a] ప్రకటిస్తున్నారు. వారు చిత్తశుద్ధితో అలా చేయడం లేదు; నా చెరస్థితిలో[b] నాకు శ్రమ కలిగించాలని అనుకుంటున్నారు.
  rationale: The revision preserves the source’s contrast and the opponents’ motive while improving the rendering of τοῖς δεσμοῖς μου. It also uses a more natural, semantically centered expression for ἐριθεία. Footnote anchors remain attached to the relevant terms, and no disputed interpretive claim is introduced.
