id: PHP.1.17
reference: Philippians 1:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ ἐξ ⸂ἐριθείας τὸν Χριστὸν καταγγέλλουσιν, οὐχ ἁγνῶς, οἰόμενοι θλῖψιν ἐγείρειν τοῖς δεσμοῖς μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/017.yaml
  text: But the others proclaim the Messiah out of selfish ambition[a], not sincerely[b], thinking to raise up affliction for me in my imprisonment.
translation:
  language: te
  text: అయితే ఇతరులు స్వార్థపూరిత ఆశయంతో మెస్సీయను[a] ప్రకటిస్తున్నారు. వారు చిత్తశుద్ధితో అలా చేయడం లేదు; నా చెరస్థితిలో[b] నాకు శ్రమ కలిగించాలని అనుకుంటున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “క్రీస్తును.”
    reason: alternative_reading
  - marker: b
    text: పదశః “నా బంధాల్లో” లేదా “నా సంకెళ్లలో”; అంటే, నా చెరస్థితిలో.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐριθείας
  choice: స్వార్థపూరిత పోటీభావంతో
  rationale: ఈ పదం కేవలం స్వార్థాన్ని కాక, స్వప్రయోజనం కోసం తలెత్తే పోటీ లేదా పక్షపాత ఆశయాన్ని సూచిస్తుంది. ఈ తెలుగు పదబంధం ఆ రెండు భావాలనూ సహజంగా అందిస్తుంది.
- source_word: Χριστόν
  choice: మెస్సీయను
  rationale: ఇక్కడ యేసు యొక్క అభిషిక్తుని హోదానే ప్రకటనలో ప్రధానంగా ఉంది; అందువల్ల పేరులా వాడే ‘క్రీస్తు’ కంటే బిరుదును స్పష్టం చేసే ‘మెస్సీయ’ను ఎంచుకున్నాం.
- source_word: καταγγέλλουσιν
  choice: ప్రకటిస్తున్నారు
  rationale: బహిరంగంగా తెలియజేయడం లేదా చాటిచెప్పడం అనే విస్తృత భావాన్ని ఇది సహజంగా అందిస్తుంది; దీనిని అధికారిక ప్రసంగానికి మాత్రమే పరిమితం చేయదు.
- source_word: ἁγνῶς
  choice: చిత్తశుద్ధితో
  rationale: ఈ సందర్భంలో క్రియావిశేషణం ఉద్దేశంలోని స్వచ్ఛతను సూచిస్తుంది. నిషేధంతో కలిపి ‘చిత్తశుద్ధితో ... లేదు’ అనడం వారి ఉద్దేశం నిజాయితీ లేనిదని తెలియజేస్తుంది.
- source_word: οἰόμενοι
  choice: అనుకుంటున్నారు
  rationale: వారు ఆశించిన లేదా తలంచిన ఫలితాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: θλῖψιν ἐγείρειν
  choice: బాధ కలిగించాలని
  rationale: ‘బాధను లేపడం’ అనే పదశః రూపం తెలుగులో అసహజం. ఈ ఎంపిక శ్రమ లేదా వేదనను రేకెత్తించాలనే శత్రుభావ ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τοῖς δεσμοῖς μου
  choice: నేను బంధాల్లో ఉండగా
  rationale: δεσμοί పదశః ‘బంధాలు/సంకెళ్లు’; సందర్భంలో అది పౌలు చెరలో ఉన్న స్థితిని సూచిస్తుంది. ప్రధాన పాఠం మూలంలోని రూపకాన్ని నిలుపుతూ, వాక్య నిర్మాణం దాని సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: Χριστός పదాన్ని ఎలా అనువదించాలి
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός ప్రకటన యొక్క విషయంగా వచ్చి యేసు యొక్క అభిషిక్తుని హోదాను ముందుకు తెస్తుంది. అయినా ‘క్రీస్తు’ అనే సాంప్రదాయ రూపం సాధ్యమైన ప్రత్యామ్నాయమని పాదటిప్పణిలో ఉంచాం.
- issue: ప్రత్యర్థుల ఉద్దేశాన్ని ఎంత స్పష్టంగా చెప్పాలి
  choice: చిత్తశుద్ధితో కాదు; బాధ కలిగించాలని అనుకుంటున్నారు
  alternative: నిజాయితీగా కాదు; బాధను రేపుతున్నామని భావిస్తూ
  rationale: ἁγνῶς ఉద్దేశంలోని స్వచ్ఛతను, οἰόμενοι వారి తలంపు లేదా సంకల్పాన్ని తెలియజేస్తాయి. వారు నిజంగా బాధ కలిగించగలిగారా అనే ప్రశ్నను పరిష్కరించకుండా వారి ఉద్దేశాన్నే అనువాదం తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని వ్యతిరేకతను ‘అయితే మరికొందరు’ ద్వారా, వారి అపవిత్ర ఉద్దేశాన్ని ‘చిత్తశుద్ధితో ... లేదు’ ద్వారా నిలిపాం. అన్ని పాదటిప్పణి సూచికలు వాటికి సంబంధించిన పదాల దగ్గర ప్రధాన పాఠంలో ఉంచబడ్డాయి.
