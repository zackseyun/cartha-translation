translation:
  language: te
  text: మీరు నాలో చూసిన, ఇప్పుడు నా విషయమై వింటున్న అదే పోరాటాన్ని మీరూ ఎదుర్కొంటున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγῶνα
  choice: పోరాటాన్ని
  rationale: ఇక్కడ ఈ పదం విశ్వాసం కోసం ఎదురయ్యే ప్రతిఘటన, శ్రమతో కూడిన సంఘర్షణను సూచిస్తుంది; ఆధునిక తెలుగులో ‘పోరాటం’ సహజంగా, విస్తృతార్థంతో దీనిని తెలియజేస్తుంది.
- source_word: ἔχοντες
  choice: ఎదుర్కొంటున్నారు
  rationale: ‘కలిగి ఉండడం’ అనే అక్షరార్థం తెలుగులో ఈ సందర్భంలో అసహజంగా ఉంటుంది; ఒక పోరాటంలో నిమగ్నమై ఉండడాన్ని ‘ఎదుర్కొంటున్నారు’ స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: νῦν ἀκούετε ἐν ἐμοί
  choice: ఇప్పుడు కూడా నేను ఎదుర్కొంటున్నానని వింటున్న
  rationale: పౌలు గతంలో ఎదుర్కొన్న పోరాటమే ప్రస్తుతం అతనిలో కొనసాగుతోందని వారు వింటున్నారనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘కూడా’ కొనసాగింపును సూచిస్తుంది.
theological_decisions:
- issue: పౌలు మరియు ఫిలిప్పీయుల పోరాటం ఒకటే కావడం
  choice: ‘అదే పోరాటాన్ని మీరూ ఎదుర్కొంటున్నారు’
  alternative: ‘అలాంటి పోరాటాన్ని మీరూ ఎదుర్కొంటున్నారు’
  rationale: τὸν αὐτὸν అనేది కేవలం పోలికను కాకుండా ‘అదే’ పోరాటమని బలంగా చెబుతుంది; అందువల్ల మూలంలోని భాగస్వామ్య సంఘర్షణ భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. గ్రీకు వాక్యంలోని participial నిర్మాణం ముందరి వచనంపై ఆధారపడినా, విడిగా చదివినప్పుడు కూడా అర్థమయ్యేలా పూర్తి వాక్యంగా అందించబడింది.
