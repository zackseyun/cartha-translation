  yaml_path: translation/nt/philippians/001/029.yaml
  text: For it has been graciously granted to you on behalf of Messiah not only to believe in him[a], but also to suffer for him[d][c][b],
translation:
  language: te
  text: ఎందుకంటే, మెస్సీయ నిమిత్తం మీకు అనుగ్రహించబడినది ఏమిటంటే—ఆయనపై విశ్వాసం ఉంచడం మాత్రమే కాదు, ఆయన నిమిత్తం బాధపడడం కూడా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: మునుపటి వాక్యంలో చెప్పిన నిర్భయమైన స్థితికి కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది.
- source_word: ἐχαρίσθη
  choice: అనుగ్రహించబడింది
  rationale: కేవలం అనుమతించబడిందనే భావం కాకుండా, కృపతో ఉచితంగా ఇవ్వబడిందనే χαρίζομαι భావాన్ని నిలుపుతుంది; కర్తను పేర్కొనని గ్రీకు కర్మణి ప్రయోగాన్నీ కాపాడుతుంది.
- source_word: τὸ ὑπὲρ Χριστοῦ
  choice: మెస్సీయ నిమిత్తం
  rationale: ὑπέρ ఇక్కడ మెస్సీయతో సంబంధించి, ఆయన కారణంగా లేదా ఆయన పక్షంగా అనే భావాన్ని ఇస్తుంది. ఈ పదబంధం తరువాతి రెండు క్రియారూపాలనూ పరిధిలోకి తీసుకునేలా ఉంచబడింది.
- source_word: πιστεύειν εἰς αὐτόν
  choice: ఆయనను విశ్వసించడం
  rationale: ఒక వ్యక్తిపై విశ్వాసం ఉంచడాన్ని తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: πάσχειν
  choice: బాధపడడం
  rationale: గ్రీకు క్రియ యొక్క నేరమైన భావాన్ని అలంకరించకుండా నిలుపుతుంది.
- source_word: ὑπὲρ αὐτοῦ
  choice: ఆయన నిమిత్తం
  rationale: ఆయన కారణంగా, ఆయన కొరకు, లేదా ఆయన పక్షంగా బాధపడడమనే సంబంధాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: విశ్వసించడం, బాధపడడం రెండూ అనుగ్రహించబడినవిగా చెప్పబడటాన్ని మృదువుగా చేయాలా?
  choice: రెండింటినీ ఒకే ‘అనుగ్రహించబడింది’ అనే క్రియ పరిధిలో స్పష్టంగా ఉంచడం
  alternative: ‘మీకు అనుమతి లభించింది’ అని బలహీనపరచడం లేదా దైవిక అనుగ్రహ భావం కనబడకుండా వాక్యాన్ని మార్చడం
  rationale: గ్రీకు వాక్యంలో విశ్వసించడం మాత్రమే కాక బాధపడడం కూడా అనుగ్రహించబడిన దానిలో భాగమే. ఆ ధార్మిక ఉద్రిక్తతను పరిష్కరించకుండా అనువాదం యథాతథంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘అనుగ్రహించబడింది’ అనే పదం కృపతో ఇచ్చిన వరం అనే మూలభావాన్ని కాపాడుతుంది. దీర్ఘవిరామం తరువాతి రెండు సమాంతర అంశాలు ముందున్న అనుగ్రహానికి వివరణలని స్పష్టం చేస్తుంది.
