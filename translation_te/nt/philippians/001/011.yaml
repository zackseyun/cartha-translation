- from: మెస్సీయ అయిన యేసు[b] ద్వారా కలిగే నీతి[a] ఫలంతో నిండినవారై, దేవుని మహిమకూ స్తుతికీ కారణమవాలి.
  to: మెస్సీయ అయిన యేసు[b] ద్వారా కలిగే నీతి[a] ఫలంతో నిండినవారై, దేవుని మహిమకూ స్తుతికీ ఉండునట్లు.
