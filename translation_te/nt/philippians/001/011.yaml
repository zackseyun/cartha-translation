id: PHP.1.11
reference: Philippians 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πεπληρωμένοι ⸂καρπὸν δικαιοσύνης τὸν⸃ διὰ Ἰησοῦ Χριστοῦ εἰς δόξαν καὶ ἔπαινον θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/011.yaml
  text: filled with the fruit of righteousness that comes through Jesus the Messiah[b][a], to the glory and praise of God.
translation:
  language: te
  text: మెస్సీయ అయిన యేసు[b] ద్వారా కలిగే నీతి[a] ఫలంతో నిండినవారై, దేవుని మహిమకూ స్తుతికీ ఉండునట్లు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘న్యాయపు ఫలం.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ‘యేసు క్రీస్తు’; ఇక్కడ ‘మెస్సీయ’ అనేది క్రిస్టోస్ అనే బిరుదుకు అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένοι
  choice: నిండినవారై
  rationale: పరిపూర్ణకాల కర్మణి అసమాపక క్రియ సూచించే, నింపబడి ఆ స్థితిలో ఉన్న భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ముందున్న వాక్యభాగంతో వ్యాకరణ సంబంధాన్ని నిలుపుతుంది.
- source_word: καρπὸν
  choice: ఫలం
  rationale: నైతిక, ఆత్మీయ ఫలితాన్ని సూచించే పౌలు రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: δικαιοσύνης
  choice: నీతి
  rationale: ఈ సందర్భంలో నైతిక సత్ప్రవర్తన లేదా సరైన జీవన స్వభావాన్ని సహజంగా సూచిస్తుంది; షష్ఠీ విభక్తి సంబంధాన్ని అతిగా నిర్ధారించకుండా ‘నీతి ఫలం’గా ఉంచుతుంది.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: మెస్సీయ అయిన యేసు ద్వారా కలిగే
  rationale: διά + షష్ఠీ సాధనం లేదా మధ్యవర్తిత్వాన్ని సూచిస్తుంది. ‘ద్వారా కలిగే’ అనే రూపం ఫలం యేసు ద్వారా ఉత్పన్నమవుతుందని స్పష్టంగా, సహజంగా చెబుతుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός లోని అభిషిక్త రాజు అనే బిరుదు భావాన్ని ‘క్రీస్తు’ అనే పేరులాంటి రూపం కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: εἰς δόξαν καὶ ἔπαινον θεοῦ
  choice: దేవుని మహిమకూ స్తుతికీ కారణమవాలి
  rationale: εἰς సూచించే లక్ష్యం లేదా ఫలితాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ఈ పదబంధం ముందున్న ప్రార్థనాభావంతో అనుసంధానమవుతుంది.
theological_decisions:
- issue: ‘నీతి ఫలం’ అనే షష్ఠీ సంబంధం
  choice: నీతి లక్షణం గల, మెస్సీయ అయిన యేసు ద్వారా కలిగే ఫలం
  alternative: నీతియే ఫలంగా ఉండడం; నీతిగా ఎంచబడే ఫలం
  rationale: గ్రీకు షష్ఠీ అనేక సంబంధాలను అనుమతిస్తుంది. ‘నీతి ఫలం’ అనే సంక్షిప్త రూపం నైతిక/ఆత్మీయ ఫలితాన్ని సూచిస్తూనే, అది నీతిని కలిగించే ఫలమా, నీతితో లక్షణీకరించబడిన ఫలమా, లేక నీతియే ఫలమా అనే సూక్ష్మభేదాన్ని పూర్తిగా మూసివేయదు.
- issue: Ἰησοῦ Χριστοῦ లో Χριστός స్థితి
  choice: ‘మెస్సీయ అయిన యేసు’ అని బిరుదుగా అనువదించడం
  alternative: ‘యేసు క్రీస్తు’ అని సాంప్రదాయిక పేరులాంటి రూపంలో అనువదించడం
  rationale: Χριστός యొక్క ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదార్థాన్ని పాఠకునికి కనిపించేలా ఉంచుతుంది; యేసును మెస్సీయగా గుర్తించే క్రైస్తవ ప్రకటనను వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఇది ముందున్న వాక్యానికి కొనసాగింపు కావడంతో ‘నిండినవారై’ అనే అసమాపక రూపం ఉంచబడింది. ‘కారణమవాలి’ ద్వారా εἰς యొక్క లక్ష్య/ఫలిత భావం తెలుగులో సహజంగా వ్యక్తమైంది.
