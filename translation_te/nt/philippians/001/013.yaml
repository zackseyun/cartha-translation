id: PHP.1.13
reference: Philippians 1:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥστε τοὺς δεσμούς μου φανεροὺς ἐν Χριστῷ γενέσθαι ἐν ὅλῳ τῷ πραιτωρίῳ καὶ τοῖς λοιποῖς πᾶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/013.yaml
  text: so that my chains in Messiah have become known throughout the whole imperial guard and to all the rest[b][a],
translation:
  language: te
  text: దాని ఫలితంగా, మెస్సీయలో[a] ఉన్న నా సంకెళ్లు సామ్రాజ్య రక్షక దళమంతటికీ[b], మిగిలిన వారందరికీ బహిరంగంగా తెలిసాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మెస్సీయ కారణంగా నేను సంకెళ్లలో ఉన్నానని.”
    reason: alternative_reading
  - marker: b
    text: లేదా, “ప్రేటోరియం అంతటా.” ఈ పదం సామ్రాజ్య రక్షక దళాన్ని గానీ, సామ్రాజ్య ప్రధాన కార్యాలయం లేదా నివాసాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: దాని ఫలితంగా
  rationale: ముందటి వాక్యంలో చెప్పిన పరిస్థితి వల్ల కలిగిన ఫలితాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τοὺς δεσμούς μου
  choice: నా సంకెళ్ల సంగతి
  rationale: δεσμούς అనే పదంలోని ప్రత్యక్షమైన ‘సంకెళ్లు’ అనే రూపకాన్ని నిలుపుతూ, అవి పౌలు చెరస్థితిని సూచిస్తున్నాయని సందర్భం ద్వారా స్పష్టమయ్యేలా చేస్తుంది.
- source_word: φανεροὺς ... γενέσθαι
  choice: తెలిసింది
  rationale: ఒక విషయం బహిరంగంగా తెలిసిపోయిందనే ఫలితార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν Χριστῷ
  choice: మెస్సీయలో
  rationale: గ్రీకు పదబంధంలోని ఉద్దేశపూర్వక సంక్షిప్తతను, దాని సంబంధార్థం లేదా కారణార్థం మధ్య ఉన్న అస్పష్టతను ప్రధాన పాఠంలో నిలుపుతుంది.
- source_word: Χριστῷ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉన్నందున దాని అర్థాన్ని ‘మెస్సీయ’గా వ్యక్తం చేస్తుంది.
- source_word: ἐν ὅλῳ τῷ πραιτωρίῳ
  choice: సామ్రాజ్య రక్షక దళమంతటికీ
  rationale: ఈ సందర్భంలో πραιτώριον అనే పదానికి సాధ్యమైన ప్రధాన సూచన అయిన సామ్రాజ్య రక్షక దళాన్ని స్పష్టంగా తెలియజేస్తుంది; స్థలం లేదా ప్రధాన కార్యాలయం అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: మిగిలిన వారందరికీ
  rationale: రక్షక దళం అవతల ఉన్న ఇతరులందరినీ చేర్చే గ్రీకు పదబంధపు విస్తృతిని దగ్గరగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: పౌలు సంకెళ్లతో ἐν Χριστῷకు ఉన్న సంబంధం
  choice: ప్రధాన పాఠంలో ‘మెస్సీయలో నా సంకెళ్లు’ అని ఉంచి గ్రీకు నిర్మాణంలోని ఉద్విగ్నతను నిలుపడం
  alternative: ‘మెస్సీయ కారణంగా నేను సంకెళ్లలో ఉన్నాను’ లేదా ‘మెస్సీయ నిమిత్తం నా సంకెళ్లు’
  rationale: ఈ పదబంధం పౌలు మెస్సీయతో ఏకత్వంలో సంకెళ్లు భరిస్తున్నాడనే పరిధి భావాన్ని గానీ, మెస్సీయపట్ల అతని నిబద్ధత కారణంగానే అతడు చెరలో ఉన్నాడనే కారణ భావాన్ని గానీ సూచించవచ్చు. ప్రధాన పాఠం దానిని నిర్ణయించకుండా ఉంచి, స్పష్టీకరించే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘సంకెళ్లు’ అనే స్పష్టమైన చిత్రాన్ని నిలిపి, ‘మెస్సీయలో’ అనే మూలపాఠపు నిజమైన అస్పష్టతను పాదటిప్పణితో సంరక్షించాం.
