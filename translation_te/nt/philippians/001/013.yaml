revisions:
- from: దాని ఫలితంగా, మెస్సీయలో నా సంకెళ్ల సంగతి[a] సామ్రాజ్య రక్షక దళమంతటికీ[b], మిగిలిన వారందరికీ తెలిసింది.
  to: దాని ఫలితంగా, మెస్సీయలో[a] ఉన్న నా సంకెళ్లు సామ్రాజ్య రక్షక దళమంతటికీ[b], మిగిలిన వారందరికీ బహిరంగంగా తెలిసాయి.
  rationale: The revision restores ‘నా సంకెళ్లు’ as the subject corresponding to τοὺς δεσμούς μου and adds ‘బహిరంగంగా’ for φανερούς, while retaining the source ambiguity of ἐν Χριστῷ in the main text and preserving the causal reading in footnote a. The πραιτώριον footnote remains properly anchored and retains the lexical uncertainty.
