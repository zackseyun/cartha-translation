id: PHP.1.25
reference: Philippians 1:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τοῦτο πεποιθὼς οἶδα ὅτι μενῶ καὶ ⸀παραμενῶ πᾶσιν ὑμῖν εἰς τὴν ὑμῶν προκοπὴν καὶ χαρὰν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/025.yaml
  text: And convinced of this[a], I know that I will remain and continue with all of you for your progress and joy in the faith,
translation:
  language: te
  text: ఈ నమ్మకంతో, మీ అభివృద్ధి కోసం, విశ్వాసంలో మీ ఆనందం[a] కోసం నేను నిలిచి ఉంటాననీ, మీ అందరితోనూ కొనసాగుతాననీ నాకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విశ్వాసపు ఆనందం,” లేదా “విశ్వాసం వల్ల కలిగే ఆనందం.”
    reason: χαρὰν τῆς πίστεωςలోని షష్ఠీవిభక్తి సంబంధం ఒకటి కంటే ఎక్కువ విధాలుగా అర్థమవుతుంది.
lexical_decisions:
- source_word: πεποιθὼς
  choice: ఈ నమ్మకంతో
  rationale: పరిపూర్ణ కృదంతం స్థిరపడిన నమ్మకస్థితిని సూచిస్తుంది. సందర్భంలోని ముందరి ఆలోచనను సూచించే τοῦτο భావాన్ని కూడా ‘ఈ’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μενῶ
  choice: నేను నిలిచి ఉంటాను
  rationale: μένω యొక్క ‘ఉండిపోవడం/నిలిచి ఉండడం’ అనే భావాన్ని భవిష్యత్ రూపంలో వ్యక్తం చేస్తుంది; తరువాతి παραμενῶతో ఉన్న భేదాన్ని నిలుపుతుంది.
- source_word: παραμενῶ
  choice: మీ అందరితోనూ కొనసాగుతాను
  rationale: παραμένωలో కేవలం జీవించి ఉండడం మాత్రమే కాక, వారితో పాటు కొనసాగడం అనే అదనపు భావం ఉంది. ఈ అనువాదం ముందున్న μενῶతో దానిని వేరుచేస్తుంది.
- source_word: πᾶσιν ὑμῖν
  choice: మీ అందరితోనూ
  rationale: దత్తివిభక్తి ఇక్కడ వారితో పాటు ఉండడాన్ని సూచిస్తుంది; πᾶσινలోని సమగ్రతను ‘అందరితోనూ’ స్పష్టంగా నిలుపుతుంది.
- source_word: προκοπὴν
  choice: అభివృద్ధి
  rationale: προκοπή ముందుకు సాగడం లేదా పురోగతిని సూచిస్తుంది. ఆధునిక తెలుగులో వ్యక్తిగత లేదా ఆత్మీయ ఎదుగుదలకు ‘అభివృద్ధి’ సహజంగా సరిపోతుంది.
- source_word: χαρὰν τῆς πίστεως
  choice: విశ్వాసంలో మీ ఆనందం
  rationale: షష్ఠీవిభక్తి సంబంధాన్ని పూర్తిగా ఒకే విధంగా నిర్ణయించకుండా, విశ్వాసంతో ముడిపడిన ఆనందాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ఇతర సాధ్య భావాలను పాదసూచికలో ఉంచాం.
- source_word: πίστεως
  choice: విశ్వాసం
  rationale: ఈ సందర్భంలో πίστις ఫిలిప్పీయుల నమ్మే జీవితం లేదా క్రైస్తవ విశ్వాసాన్ని సూచిస్తుంది; ‘విశ్వాసం’ ఆధునిక ప్రామాణిక తెలుగులో సరైన పదం.
theological_decisions:
- issue: χαρὰν τῆς πίστεωςలోని షష్ఠీవిభక్తి భావం
  choice: విశ్వాసంలో మీ ఆనందం
  alternative: విశ్వాసపు ఆనందం; విశ్వాసం వల్ల కలిగే ఆనందం
  rationale: గ్రీకు పదబంధం సంబంధార్థకంగానూ, మూలం లేదా కారణాన్ని సూచించేదిగానూ అర్థమయ్యే అవకాశం ఉంది. ప్రధాన పాఠం సహజంగా ఉండడంతో పాటు ఆ సంబంధాన్ని అతిగా నిర్దిష్టం చేయదు; ఇతర సాధ్య భావాలను పాదసూచిక కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. μενῶ మరియు παραμενῶ మధ్య ఉన్న భావభేదాన్ని ‘నిలిచి ఉంటాను’ మరియు ‘మీ అందరితోనూ కొనసాగుతాను’ ద్వారా కాపాడాం.
