id: PHP.1.20
reference: Philippians 1:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κατὰ τὴν ἀποκαραδοκίαν καὶ ἐλπίδα μου ὅτι ἐν οὐδενὶ αἰσχυνθήσομαι, ἀλλ’ ἐν πάσῃ παρρησίᾳ ὡς πάντοτε καὶ νῦν μεγαλυνθήσεται Χριστὸς ἐν τῷ σώματί μου, εἴτε διὰ ζωῆς εἴτε διὰ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/020.yaml
  text: in keeping with my eager expectation and hope that I will not be put to shame in anything[a], but that with all boldness, as always, even now Messiah will be magnified in my body[b], whether through life or through death.
translation:
  language: te
  text: నా ఆతుర నిరీక్షణకు, ఆశకు అనుగుణంగా, నేను ఏ విషయంలోనూ అవమానానికి గురికాను[a]; కానీ ఎప్పటిలాగే ఇప్పుడూ సంపూర్ణ ధైర్యంతో, జీవం ద్వారానైనా మరణం ద్వారానైనా, నా దేహంలో[b] మెస్సీయ ఘనపరచబడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను ఏ విషయంలోనూ సిగ్గుపడను.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా దేహం ద్వారా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: అనుగుణంగా
  rationale: పౌలు ఆతుర నిరీక్షణకూ ఆశకూ అనుగుణంగా జరిగే ఫలితాన్ని సూచించే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀποκαραδοκίαν
  choice: ఆతుర నిరీక్షణ
  rationale: తీవ్రమైన, ముందుకు చూస్తూ ఎదురుచూసే భావాన్ని అతిశయోక్తి లేకుండా నిలుపుతుంది.
- source_word: ἐλπίδα
  choice: ఆశ
  rationale: పౌలు వాడుకలోని నమ్మకంతో కూడిన ఆశను తెలిపే సహజమైన తెలుగు పదం.
- source_word: ἐν οὐδενὶ
  choice: ఏ విషయంలోనూ
  rationale: ఎలాంటి పరిస్థితిలోనూ మినహాయింపు లేదనే సంపూర్ణ నిరాకరణను స్పష్టంగా తెలుపుతుంది.
- source_word: αἰσχυνθήσομαι
  choice: అవమానానికి గురికాకుండా
  rationale: క్రియలో ఉండగల బహిరంగంగా అవమానపరచబడటం లేదా నిరాశపరచబడటం అనే నిష్క్రియాత్మక ఛాయను కాపాడుతుంది; ‘సిగ్గుపడకుండా’ అనే అంతర్గత భావం ప్రత్యామ్నాయంగా పాదటిప్పణిలో ఉంచబడింది.
- source_word: παρρησίᾳ
  choice: ధైర్యంతో
  rationale: బహిరంగ సాక్ష్యంలో సంకోచం లేని సాహసాన్ని సందర్భానుసారంగా సహజంగా తెలుపుతుంది.
- source_word: μεγαλυνθήσεται
  choice: ఘనపరచబడతాడు
  rationale: ‘గొప్పగా చేయడం లేదా గొప్పవాడిగా చూపడం’ అనే నిష్క్రియాత్మక భావాన్ని తెలుగులో గౌరవప్రదంగా, స్పష్టంగా అందిస్తుంది.
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός బిరుదుగా అర్థభరితంగా ఉన్నందున దాని అభిషిక్త రాజు భావాన్ని నిలుపుతుంది.
- source_word: ἐν τῷ σώματί μου
  choice: నా దేహంలో
  rationale: గ్రీకు ἐν పదబంధాన్ని సూటిగా నిలుపుతూ, పౌలు జీవించినా మరణించినా అతని శరీరసంబంధ సాక్ష్యాన్ని వ్యక్తం చేస్తుంది.
- source_word: εἴτε διὰ ζωῆς εἴτε διὰ θανάτου
  choice: జీవించడం ద్వారానైనా చనిపోవడం ద్వారానైనా
  rationale: διά యొక్క సాధనం లేదా పరిస్థితి భావాన్ని సమాంతర నిర్మాణంతో సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: పౌలు పత్రికలో Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ వాక్యంలో పదం కేవలం వ్యక్తినామంలా కాక బిరుదు భావాన్ని ఇంకా మోస్తోంది; అందువల్ల అర్థాన్ని అనువదించే ‘మెస్సీయ’ను ఎంచుకున్నాం.
- issue: μεγαλυνθήσεται యొక్క నిష్క్రియాత్మక భావం
  choice: ఘనపరచబడతాడు
  alternative: గొప్పవాడిగా కనబడతాడు
  rationale: కర్త ఎవరో వాక్యం స్పష్టంగా చెప్పదు. నిష్క్రియాత్మక రూపాన్ని నిలపడం ద్వారా దేవుడే ఘనపరుస్తాడా, లేక పౌలు దేహంలో మెస్సీయ గొప్పతనం వెల్లడవుతుందా అనే భావ పరిధిని సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. మూల వాక్యం ముందున్న సందర్భంపై ఆధారపడినా, తెలుగులో వాక్యం సహజంగా పూర్తవడానికి ‘నేను ఆశిస్తున్నాను’ అని చివర చేర్చబడింది; ఇది ἐλπίδα యొక్క భావాన్ని విప్పి చెబుతుంది. ‘దేహం’ అనే పదం శరీరసంబంధ సాక్ష్యాన్ని నిలుపుతుంది; జీవితం–మరణం మధ్య ఉన్న ఉద్దేశపూర్వక ఉద్రిక్తతను పరిష్కరించలేదు.
