id: PHP.1.26
reference: Philippians 1:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα τὸ καύχημα ὑμῶν περισσεύῃ ἐν Χριστῷ Ἰησοῦ ἐν ἐμοὶ διὰ τῆς ἐμῆς παρουσίας πάλιν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/026.yaml
  text: so that your boasting in Messiah Jesus may abound because of me through my coming to you again[a][b][c][d].
translation:
  language: te
  text: నేను మళ్లీ మీ దగ్గరకు రావడం ద్వారా, నా కారణంగా మెస్సీయ యేసులో మీరు చేసుకునే అతిశయం సమృద్ధిగా పెరగడానికి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నాలో”; ఇక్కడ “నా కారణంగా” లేదా “నన్నుబట్టి” అనే భావం.
    reason: lexical_alternative
  - marker: b
    text: “మీరు అతిశయించడానికి గల కారణం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: …అధికమయ్యేలా
  rationale: ముందటి వాక్యంలో చెప్పిన పరిణామం లేదా ఉద్దేశాన్ని తెలిపే ἵνα భావాన్ని తెలుగులో సహజంగా కొనసాగిస్తుంది.
- source_word: τὸ καύχημα ὑμῶν
  choice: మీ అతిశయం
  rationale: καύχημα అనేది అతిశయించే క్రియను గానీ, అతిశయించడానికి గల కారణాన్ని గానీ సూచించవచ్చు. ‘అతిశయం’ ఈ సంక్షిప్తతను కొంతవరకు నిలుపుతుంది; సాధ్యమైన మరొక భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: περισσεύῃ
  choice: మరింత అధికమయ్యేలా
  rationale: ‘సమృద్ధిగా కావడం/విస్తరించడం’ అనే మూలభావంతో పాటు ἵνα తరువాతి సంభావనాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: క్రీస్తు యేసులో
  rationale: తెలుగులో విస్తృతంగా అర్థమయ్యే స్థిరమైన రూపం; ἐν అనే సంబంధాన్ని ‘లో’ ద్వారా నిలుపుతుంది.
- source_word: ἐν ἐμοὶ
  choice: నా కారణంగా
  rationale: అక్షరార్థంగా ‘నాలో’ అయినా, ఇక్కడ పౌలు వారి అతిశయానికి కారణం లేదా సందర్భం కావడాన్ని సూచిస్తుంది. తెలుగులో ‘నా కారణంగా’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: διὰ τῆς ἐμῆς παρουσίας πάλιν πρὸς ὑμᾶς
  choice: నేను మళ్లీ మీ దగ్గరకు రావడం ద్వారా
  rationale: παρουσία ఇక్కడ పౌలు తిరిగి వారి వద్దకు రావడాన్ని సూచిస్తుంది; διά యొక్క సాధనార్థక సంబంధాన్ని ‘ద్వారా’ నిలుపుతుంది.
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦ దేనితో అనుసంధానమవుతుంది?
  choice: ‘క్రీస్తు యేసులో మీ అతిశయం’గా అనుసంధానించడం
  alternative: ‘మీ అతిశయం క్రీస్తు యేసులో అధికమవడం’గా క్రియతో మరింత సన్నిహితంగా అనుసంధానించడం
  rationale: పదక్రమం మరియు పౌలు వాడే ‘క్రీస్తులో అతిశయించడం’ అనే భావం ఎంపిక చేసిన అనుసంధానానికి మద్దతిస్తాయి; అయితే గ్రీకు నిర్మాణంలో స్వల్ప అనిశ్చితి మిగులుతుంది.
- issue: Χριστός పదరూపం
  choice: క్రీస్తు
  alternative: అభిషిక్తుడు / మెస్సీయ
  rationale: ‘క్రీస్తు యేసు’ ఆధునిక తెలుగు క్రైస్తవ వాడుకలో సహజంగా, విస్తృతంగా గుర్తించబడే రూపం. మూలపదం ‘అభిషిక్తుడు’ అనే బిరుదు భావాన్ని కలిగి ఉన్నప్పటికీ, ఈ సంయుక్త రూపంలో పేరు వంటి స్థిరత్వం కూడా ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పౌలు వాక్యప్రవాహానికి అనుసంధానమయ్యే ఉపవాక్య రూపం ఉంచబడింది. ‘అతిశయం’ గంభీరమైన బైబిలు వాడుకకు సరిపోతూనే సాధారణ పాఠకులకు అర్థమయ్యే పదం; దాని భావవ్యాప్తిని పాదసూచిక వివరిస్తుంది.
