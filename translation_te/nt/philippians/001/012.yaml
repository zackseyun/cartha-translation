source:
  edition: SBLGNT
  text: Γινώσκειν δὲ ὑμᾶς βούλομαι, ἀδελφοί, ὅτι τὰ κατ’ ἐμὲ μᾶλλον εἰς προκοπὴν τοῦ εὐαγγελίου ἐλήλυθεν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/012.yaml
  text: I want you to know[a], brothers, that what has happened to me has actually advanced the good news[b],
translation:
  language: te
  text: సోదరులారా,[a] నాకు జరిగినవి నిజానికి సువార్త[b] పురోగతికి దోహదపడ్డాయని మీరు తెలుసుకోవాలని కోరుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సోదర సోదరీమణులారా”; గ్రీకులో “సోదరులు” అని ఉంది; అది విశ్వాస సమాజమంతటినీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “శుభవార్త.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Γινώσκειν ... ὑμᾶς βούλομαι
  choice: మీరు తెలుసుకోవాలని కోరుతున్నాను
  rationale: తెలియజేయడానికి పౌలు ఉపయోగించిన సహజ పత్రికా శైలిని, ఆయన వ్యక్తిగత ఉద్దేశాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది బలమైన వ్యతిరేకతకన్నా స్వల్ప విషయాంతరాన్ని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ఆ మార్పు సహజంగానే వ్యక్తమవుతుంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకు పుంలింగ బహువచన సంబోధనను ప్రధాన పాఠ్యంలో నిలిపి, అది విశ్వాస సమాజమంతటినీ సూచించవచ్చనే భావాన్ని పాదసూచికలో తెలిపింది.
- source_word: τὰ κατ’ ἐμὲ
  choice: నాకు జరిగినవి
  rationale: పౌలు పరిస్థితులు, అతనికి సంభవించిన పరిణామాలు అనే విస్తృత భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: μᾶλλον
  choice: నిజానికి
  rationale: ఊహించిన దానికి విరుద్ధంగా అనుకోని సానుకూల ఫలితం కలిగిందనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: εἰς προκοπὴν
  choice: పురోగతికే దోహదపడ్డాయి
  rationale: ‘పురోగతి వైపు/పురోగతి కోసం’ అనే నామవాచక నిర్మాణాన్ని సహజమైన తెలుగు క్రియారూపంలో వ్యక్తం చేస్తూ, గమ్యార్థాన్ని నిలుపుతుంది.
- source_word: τοῦ εὐαγγελίου
  choice: సువార్త
  rationale: εὐαγγέλιον యొక్క ‘మంచి వార్త’ భావాన్ని మోసే, ఆధునిక తెలుగు క్రైస్తవ వాడుకలో సహజంగా అర్థమయ్యే ప్రామాణిక పదం.
- source_word: ἐλήλυθεν
  choice: దోహదపడ్డాయి
  rationale: గతంలో జరిగిన పరిణామాల వల్ల ప్రస్తుతం నిలిచివున్న ఫలితాన్ని తెలుగు సంపూర్ణ భావంలో సహజంగా తెలియజేస్తుంది.
