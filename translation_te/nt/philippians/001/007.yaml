id: PHP.1.7
reference: Philippians 1:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καθώς ἐστιν δίκαιον ἐμοὶ τοῦτο φρονεῖν ὑπὲρ πάντων ὑμῶν, διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς, ἔν τε τοῖς δεσμοῖς μου καὶ ἐν τῇ ἀπολογίᾳ καὶ βεβαιώσει τοῦ εὐαγγελίου συγκοινωνούς μου τῆς χάριτος πάντας ὑμᾶς ὄντας·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/007.yaml
  text: For it is right for me to think this about all of you[a], because I have you in my heart, since both in my chains and in the defense and confirmation of the gospel[b], all of you are fellow partakers with me of grace.
translation:
  language: te
  text: మీ అందరి గురించి నేను ఇలా భావించడం నాకు సముచితమే. ఎందుకంటే నేను మిమ్మల్ని నా హృదయంలో ఉంచుకున్నాను.[a] నా సంకెళ్లలోనూ, సువార్తను సమర్థించడంలోను దృఢపరచడంలోను, మీ అందరూ నాతో కలిసి కృపలో భాగస్వాములై ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు నన్ను మీ హృదయంలో ఉంచుకున్నారు.” గ్రీకు వాక్య నిర్మాణాన్ని రెండు విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιον
  choice: న్యాయమే
  rationale: ఇక్కడ ఈ పదం పౌలు వైఖరి సముచితమైనదని, న్యాయమైనదని సూచిస్తుంది. ‘న్యాయమే’ నైతిక భావాన్ని నిలుపుతూ సహజమైన తెలుగులో ఉంది.
- source_word: φρονεῖν
  choice: ఇలా భావించడం
  rationale: ఈ క్రియ కేవలం ఆలోచననే కాక మనోవైఖరిని కూడా సూచించగలదు. ‘భావించడం’ ఈ విస్తృత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: మీ అందరి గురించి
  rationale: φρονεῖνతో కలిసినప్పుడు ὑπέρ ఇక్కడ వారి గురించిన పౌలు అభిప్రాయం లేదా వైఖరిని సూచిస్తుంది.
- source_word: διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς
  choice: ఎందుకంటే నేను మిమ్మల్ని నా హృదయంలో ఉంచుకున్నాను
  rationale: సందర్భంలో పౌలు ఫిలిప్పీయుల పట్ల కలిగిన ప్రేమకు ఇది సహజమైన కొనసాగింపు. అయితే గ్రీకు వాక్య నిర్మాణంలోని నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపాము.
- source_word: δεσμοῖς
  choice: సంకెళ్లలో
  rationale: పౌలు నిర్బంధాన్ని సూచించే స్పష్టమైన సంకెళ్ల చిత్రాన్ని ఇది నిలుపుతుంది.
- source_word: ἀπολογίᾳ
  choice: సమర్థించి
  rationale: సువార్తకు అనుకూలంగా జవాబు చెప్పడం లేదా దానిని సమర్థించడం అనే భావాన్ని సందర్భానుకూలమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: βεβαιώσει
  choice: స్థిరపరచడంలో
  rationale: సువార్త సత్యత్వాన్ని బలపరచడం, దృఢంగా స్థాపించడం అనే భావాన్ని అందిస్తుంది.
- source_word: συγκοινωνούς
  choice: నాతో కలిసి ... పాలుపంచుకుంటున్నారు
  rationale: ఉమ్మడి భాగస్వామ్యం అనే పదబలాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: χάριτος
  choice: కృపలో
  rationale: χάρις అనే ప్రధాన దైవశాస్త్ర పదాన్ని ప్రామాణిక తెలుగు రూపమైన ‘కృప’తో అనువదించి, పౌలుతో కలిసి దానిలో పాలుపొందడాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: హృదయానికి సంబంధించిన ఉపవాక్యంలో వాక్యనిర్మాణ సందిగ్ధత
  choice: నేను మిమ్మల్ని నా హృదయంలో ఉంచుకున్నాను
  alternative: మీరు నన్ను మీ హృదయంలో ఉంచుకున్నారు
  rationale: మొదటి పఠనం పౌలు ప్రేమాభిమానాల తక్షణ సందర్భానికి చక్కగా సరిపోతుంది. అయితే με, ὑμᾶς రెండూ కర్మవిభక్తి రూపాల్లో ఉండడం వల్ల రెండవ పఠనమూ వ్యాకరణపరంగా సాధ్యమే; అందువల్ల దాన్ని పాదసూచికలో భద్రపరిచాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాము. గ్రీకు వాక్యంలోని పొడవైన నిర్మాణాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించినప్పటికీ, సంకెళ్లు, సువార్త సమర్థన-స్థిరీకరణ, కృపలో ఉమ్మడి భాగస్వామ్యం మధ్య ఉన్న భావసంబంధాన్ని నిలిపాము.
