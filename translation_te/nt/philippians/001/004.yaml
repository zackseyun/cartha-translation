translation:
  language: te
  text: మీ అందరి కోసం నేను చేసే ప్రతి ప్రార్థనలో ఎల్లప్పుడూ ఆనందంతో ప్రార్థిస్తూ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντοτε
  choice: ఎల్లప్పుడూ
  rationale: కాలవ్యాప్తిని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν πάσῃ δεήσει μου
  choice: నేను చేసే ప్రతి ప్రార్థనలో
  rationale: πάσῃ యొక్క సమగ్ర భావాన్ని ‘ప్రతి’గా, δεήσει యొక్క వినతి-ప్రార్థన భావాన్ని సందర్భానుకూలంగా ‘ప్రార్థన’గా అందిస్తుంది.
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: మీ అందరి కోసం
  rationale: సమూహంలోని ప్రతి ఒక్కరినీ కలుపుకునే πάντων భావాన్ని కాపాడుతుంది.
- source_word: μετὰ χαρᾶς
  choice: ఆనందంతో
  rationale: సహజంగా, నేరుగా ‘joy’ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: τὴν δέησιν ποιούμενος
  choice: ప్రార్థిస్తూ
  rationale: గ్రీకు వాక్యంలోని participial నిర్మాణాన్ని తెలుగులో సహజమైన క్రియావిశేషణ రూపంగా అందిస్తుంది; పదశః ‘ప్రార్థనను చేస్తూ’ అనే అసహజతను నివారిస్తుంది.
