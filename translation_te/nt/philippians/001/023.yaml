id: PHP.1.23
reference: Philippians 1:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: συνέχομαι δὲ ἐκ τῶν δύο, τὴν ἐπιθυμίαν ἔχων εἰς τὸ ἀναλῦσαι καὶ σὺν Χριστῷ εἶναι, πολλῷ ⸀γὰρ μᾶλλον κρεῖσσον,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/023.yaml
  text: But I am hard pressed between the two[a], having the desire to depart and be with Messiah[b], for that is far better.
translation:
  language: te
  text: అయితే ఈ రెండింటి మధ్య నేను నలిగిపోతున్నాను. వెళ్లిపోయి[a] మెస్సీయతో[b] ఉండాలనే కోరిక నాకు ఉంది; ఎందుకంటే అదే ఎంతో మేలైనది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చనిపోవడం.’ అక్షరార్థంగా ‘వెళ్లిపోవడం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘క్రీస్తుతో.’ గ్రీకులో ‘మెస్సీయతో.’
    reason: alternative_reading
lexical_decisions:
- source_word: συνέχομαι
  choice: నలిగిపోతున్నాను
  rationale: రెండు ప్రత్యామ్నాయాల ఒత్తిడిలో చిక్కుకొని ఉండడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; అంతరంగ సంఘర్షణను అతిగా వివరిస్తూ పోదు.
- source_word: ἐκ τῶν δύο
  choice: ఈ రెండింటి మధ్య
  rationale: గ్రీకు పదబంధం సందర్భంలో రెండు ప్రత్యామ్నాయాల మధ్య ఒత్తిడికి గురికావడాన్ని సూచిస్తుంది.
- source_word: τὴν ἐπιθυμίαν ἔχων
  choice: ఉండాలనే కోరిక నాకు ఉంది
  rationale: ἐπιθυμία అనే నామవాచకంలోని ‘కోరిక’ భావాన్ని స్పష్టంగా నిలుపుతూ తెలుగులో సహజంగా అమర్చింది.
- source_word: ἀναλῦσαι
  choice: వెళ్లిపోయి
  rationale: మరణాన్ని సూచించే గ్రీకు సభ్యోక్తిని ‘చనిపోవడం’ అని బాహాటంగా మార్చకుండా, దాని ‘వెళ్లిపోవడం’ రూపకాన్ని నిలుపుతుంది.
- source_word: Χριστῷ
  choice: మెస్సీయతో
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉన్నందున ‘మెస్సీయ’ అని అనువదించబడింది; ‘క్రీస్తు’ ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: πολλῷ γὰρ μᾶλλον κρεῖσσον
  choice: ఎందుకంటే అదే ఎంతో మేలైనది
  rationale: పోలికను బలపరిచే గ్రీకు వ్యక్తీకరణను సహజమైన తెలుగులో ‘ఎంతో మేలైనది’గా అందిస్తుంది.
theological_decisions:
- issue: మరణానంతరం మెస్సీయతో సహవాసం అనే సూచన
  choice: వెళ్లిపోయి మెస్సీయతో ఉండడం
  alternative: చనిపోయి వెంటనే పరలోకానికి వెళ్లడం
  rationale: గ్రీకు పాఠం స్పష్టంగా చెప్పే ‘వెళ్లిపోవడం’ మరియు ‘మెస్సీయతో ఉండడం’ అనే మాటలనే అనువాదం నిలుపుతుంది; సమయం, స్థలం లేదా మరణానంతర స్థితి గురించి పాఠంలో లేని సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘నలిగిపోతున్నాను’ రెండు ఎంపికల ఒత్తిడిని వ్యక్తం చేస్తుంది; ‘వెళ్లిపోయి’ మూలంలోని సభ్యోక్తిని కాపాడుతుంది. పాదసూచిక గుర్తులు అవి వివరిస్తున్న పదాల వెంటనే ఉంచబడ్డాయి.
