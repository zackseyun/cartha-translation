id: PHP.1.9
reference: Philippians 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τοῦτο προσεύχομαι ἵνα ἡ ἀγάπη ὑμῶν ἔτι μᾶλλον καὶ μᾶλλον περισσεύῃ ἐν ἐπιγνώσει καὶ πάσῃ αἰσθήσει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/009.yaml
  text: 'And this I pray: that your love may abound still more and more in knowledge and all discernment[b][a],'
translation:
  language: te
  text: 'ఇదే నేను ప్రార్థిస్తున్నాను: మీ ప్రేమ జ్ఞానంలోను, అన్ని విధాలైన వివేచనలోను[a] ఇంకా ఇంకా ఎక్కువగా వృద్ధి చెందాలని.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘జ్ఞానంతోను, అన్ని విధాలైన వివేచనతోను’; గ్రీకులోని విభక్తి ప్రయోగం సన్నిహిత సహచర్యం లేదా సాధన భావంలోనూ అర్థం కావచ్చు. ‘వివేచన’కు బదులుగా ‘అంతర్దృష్టి’ లేదా ‘నైతిక గ్రహణశక్తి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τοῦτο
  choice: మరి ... ఇదే
  rationale: καί యొక్క అనుసంధాన భావాన్ని సహజమైన తెలుగులో ‘మరి’తో, τοῦτο యొక్క నిర్దేశక బలాన్ని ‘ఇదే’తో నిలుపుతుంది.
- source_word: προσεύχομαι
  choice: నేను ప్రార్థించేది
  rationale: వర్తమానకాలంలోని కొనసాగుతున్న ప్రార్థన భావాన్ని సహజ తెలుగు వాక్య నిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: ἵνα
  choice: '... అని'
  rationale: ప్రార్థనలోని విషయాన్ని పరిచయం చేసే ἵνα భావాన్ని తెలుగులో సహజమైన పూరక నిర్మాణంతో అందిస్తుంది; ఉద్దేశార్థాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: ἡ ἀγάπη ὑμῶν
  choice: మీ ప్రేమ
  rationale: మూలంలోని స్వామ్య నిర్మాణాన్ని సంక్షిప్తంగా, నేరుగా నిలుపుతుంది.
- source_word: ἔτι μᾶλλον καὶ μᾶλλον
  choice: ఇంకా మరింతగా
  rationale: ἔτι యొక్క కొనసాగింపు భావాన్ని, పునరుక్త μᾶλλον యొక్క పెరుగుదల తీవ్రతను సహజ తెలుగులో తెలియజేస్తుంది; కృత్రిమమైన పదపునరుక్తిని నివారిస్తుంది.
- source_word: περισσεύῃ
  choice: వృద్ధి చెందాలని
  rationale: సమృద్ధిగా పెరుగుట అనే భావాన్ని సాధారణ పాఠకులకు సహజంగా అందిస్తుంది. ‘పొంగిపొర్లాలి’ అనే రూపకం సాధ్యమైనా, ఇక్కడ ప్రేమ జ్ఞానం మరియు వివేచనలో పెరుగుతుందనే సంబంధానికి ‘వృద్ధి చెందు’ స్పష్టంగా సరిపోతుంది.
- source_word: ἐν ἐπιγνώσει
  choice: జ్ఞానంలోను
  rationale: ἐν అనే విభక్తి సంబంధాన్ని ‘లో’తో నిలుపుతూ, ἐπίγνωσις‌ను అతిగా సాంకేతికం చేయకుండా ‘జ్ఞానం’గా అందిస్తుంది.
- source_word: πάσῃ αἰσθήσει
  choice: సమస్త వివేచనలోను
  rationale: αἴσθησις యొక్క సందర్భానుగుణమైన నైతిక/ఆచరణాత్మక గ్రహణశక్తిని ‘వివేచన’గా, πάσῃ యొక్క విస్తృతిని ‘సమస్త’గా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ప్రేమ జ్ఞానం మరియు వివేచనతో ఉన్న సంబంధం
  choice: ‘జ్ఞానంలోను, సమస్త వివేచనలోను’ అని ἐν నిర్మాణాన్ని నిలుపుట
  alternative: ‘జ్ఞానంతోను, సమస్త వివేచనతోను’
  rationale: గ్రీకు ἐν సాధనం, పరిధి, లేదా సన్నిహిత సంబంధాన్ని సూచించగలదు. ప్రధాన పాఠంలో ‘లో’ను ఉంచి మూల నిర్మాణాన్ని కాపాడుతూ, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది; తద్వారా ప్రేమకు జ్ఞానం కేవలం సాధనమా లేక అది పెరిగే పరిధియా అన్నదాన్ని ముందుగానే తీర్మానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగానూ సాధారణ పాఠకులకు సులభంగానూ ఉండే శైలి. ‘మరి’ ముందున్న కృతజ్ఞతా భాగం నుంచి ప్రార్థనకు మార్పును సూచిస్తుంది. పాదసూచిక సూచిక [a] ప్రధాన పాఠంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
