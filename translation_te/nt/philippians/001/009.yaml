  to: 'ఇదే నేను ప్రార్థిస్తున్నాను: మీ ప్రేమ జ్ఞానంలోను, అన్ని విధాలైన వివేచనలోను[a] ఇంకా ఇంకా ఎక్కువగా వృద్ధి చెందాలని.'
