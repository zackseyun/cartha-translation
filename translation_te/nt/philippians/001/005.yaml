id: PHP.1.5
reference: Philippians 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπὶ τῇ κοινωνίᾳ ὑμῶν εἰς τὸ εὐαγγέλιον ἀπὸ ⸀τῆς πρώτης ἡμέρας ἄχρι τοῦ νῦν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/005.yaml
  text: because of your partnership in the gospel from the first day until now,[a]
translation:
  language: te
  text: మొదటి రోజు నుంచి ఇప్పటివరకు సువార్తలో మీ భాగస్వామ్యం కారణంగా,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సువార్త కోసం.” గ్రీకు పదబంధం వారు కలిసి పాలుపంచుకున్న పరిధినిగానీ, దాని లక్ష్యం లేదా ఉద్దేశాన్నిగానీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ κοινωνίᾳ
  choice: మీ భాగస్వామ్యం కారణంగా
  rationale: ἐπί + దత్తి విభక్తి ఇక్కడ పరిసర వాక్యంలోని కృతజ్ఞతకు కారణాన్ని సూచిస్తుంది; κοινωνία అనేది కేవలం సహవాసం కాక, క్రియాశీలంగా కలిసి పాలుపంచుకోవడాన్ని సూచిస్తుంది.
- source_word: ὑμῶν
  choice: మీ
  rationale: ఈ సర్వనామం ఫిలిప్పీయులే ఆ భాగస్వామ్యంలో పాల్గొన్నవారని సూచిస్తుంది.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: సువార్తలో
  rationale: ఈ పదబంధం వారి భాగస్వామ్యం జరిగే పరిధిని లేదా దాని లక్ష్యాన్ని సూచించగలదు; ప్రధాన పాఠంలో సహజమైన 'సువార్తలో'ను ఉంచి, ఉద్దేశార్థాన్ని పాదసూచికలో నిలిపాము.
- source_word: εὐαγγέλιον
  choice: సువార్త
  rationale: పౌలు రచనల సందర్భంలో స్థిరపడిన, భావభారం గల సహజ తెలుగు పదం.
- source_word: ἀπὸ τῆς πρώτης ἡμέρας
  choice: మొదటి రోజు నుంచి
  rationale: ఫిలిప్పీయుల భాగస్వామ్యం ప్రారంభమైన కాలబిందువును నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἄχρι τοῦ νῦν
  choice: ఇప్పటివరకు
  rationale: ఆ భాగస్వామ్యం ప్రస్తుత సమయం వరకు కొనసాగిందనే కాలార్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: εἰς τὸ εὐαγγέλιον యొక్క పరిధి లేదా ఉద్దేశం
  choice: సువార్తలో
  alternative: సువార్త కోసం
  rationale: గ్రీకు పదబంధం భాగస్వామ్యపు పరిధినీ, దాని లక్ష్యం లేదా ఉద్దేశాన్నీ సూచించగలదు. ఈ నిజమైన సందిగ్ధతను ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా పరిరక్షించాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఈ వచనం పరిసర వాక్యానికి కారణార్థక భాగంగా ఉన్నందున ముగింపులో కామాను ఉంచాం.
