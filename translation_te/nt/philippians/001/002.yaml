id: PHP.1.2
reference: Philippians 1:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].
translation:
  language: te
  text: మన తండ్రియైన దేవుని నుండి, ప్రభువైన యేసు మెస్సీయ[a][b] నుండి మీకు కృప, శాంతి కలుగుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, క్రీస్తు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ప్రభువైన యేసు మెస్సీయ.
    reason: previous_rendering
lexical_decisions:
- source_word: χάρις
  choice: కృప
  rationale: పౌలు పలకరింపులో χάριςకు సాధారణమైన, దాని సంబంధాత్మక మరియు ధార్మిక భావభారాన్ని నిలుపుకునే తెలుగు పదం.
- source_word: ὑμῖν
  choice: మీకు
  rationale: ఆశీర్వాద లేదా పలకరింపు సూత్రంలో దత్తివిభక్తిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: εἰρήνη
  choice: శాంతి
  rationale: గ్రీకు మరియు యూదీయ పలకరింపు నేపథ్యాలలోని సంపూర్ణ క్షేమ భావాన్ని కోల్పోకుండా సహజంగా అనువదిస్తుంది.
- source_word: ἀπὸ
  choice: నుండియు
  rationale: మూలాన్ని సూచించే ἀπό భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది; రెండు సమాన మూలపదబంధాల సంబంధాన్ని కూడా సహజంగా చూపిస్తుంది.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: మన తండ్రియైన దేవుడు
  rationale: ఈ పదబంధంలోని అన్వయార్థాన్ని—దేవుడు మన తండ్రి—స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριοςకు స్థిరమైన తెలుగు సమానం; నూతన నిబంధనలోని క్రీస్తుసంబంధ గౌరవార్థాన్ని నిలుపుతుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστόςలోని అభిషిక్త రాజు అనే బిరుదు భావాన్ని పారదర్శకంగా నిలుపుతుంది; సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: పౌలు పలకరింపు సూత్రంలో Χριστοῦను అనువదించడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో పదం పేరులా స్థిరపడిన రూపంగానూ వినిపించగలిగినా, బిరుదు భావం ఇంకా గ్రాహ్యమే. అందువల్ల ప్రధాన పాఠ్యంలో ‘మెస్సీయ’ ఉంచి, సంప్రదాయ లిప్యంతరీకరణను పాదసూచికలో నిలిపాం.
- issue: θεοῦ ... καὶ κυρίου ద్వారా కృప, శాంతి యొక్క మూలం
  choice: దేవుని నుండియు ప్రభువైన యేసు మెస్సీయ నుండియు
  alternative: మన తండ్రియైన దేవుని మరియు ప్రభువైన యేసు మెస్సీయ యొక్క కృప, శాంతి
  rationale: గ్రీకు ἀπό రెండు వ్యక్తులతో అనుసంధానమై ఒకే ఆశీర్వాద మూలసూత్రాన్ని నిర్మిస్తుంది. తెలుగులో ‘నుండియు’ పునరుక్తి సంబంధాన్ని స్పష్టపరుస్తుంది; అయితే వ్యక్తుల పరస్పర సంబంధంపై వాక్యానికి మించిన సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన పత్రికా-ఆశీర్వాద శైలి. ‘కలుగుగాక’ గ్రీకులో ప్రత్యక్ష క్రియ లేకున్నా, తెలుగు పలకరింపులో ఆశీర్వాద భావాన్ని సహజంగా పూర్తిచేస్తుంది. ‘నుండియు’ కొద్దిగా ఔపచారికమైనా వాక్య గౌరవాన్ని, రెండు మూలపదబంధాల సమాంతరతను నిలుపుతుంది.
