revisions:
- from: మెస్సీయ యేసు దాసులైన పౌలు, తిమోతి ఫిలిప్పీలో ఉండి మెస్సీయ యేసులో పవిత్రులైన వారందరికీ, పర్యవేక్షకులతోనూ పరిచారకులతోనూ సహా, వ్రాయునది:[a][b][c]
  to: మెస్సీయ యేసు దాసులైన పౌలు, తిమోతి,[b] ఫిలిప్పీలో ఉన్న, మెస్సీయ యేసులోని పవిత్రులైన వారందరికీ,[a] పర్యవేక్షకులు మరియు పరిచారకులతో కలిసి:[c]
  rationale: The revision removes the unsupported added verb, makes the two distinct ἐν-phrases syntactically clear in modern Telugu, and relocates each footnote anchor to its relevant word or phrase. It otherwise retains the draft's source-sensitive terminology and its non-denominational renderings of the church roles.
