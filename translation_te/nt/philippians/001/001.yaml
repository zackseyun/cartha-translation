id: PHP.1.1
reference: Philippians 1:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Παῦλος καὶ Τιμόθεος δοῦλοι ⸂Χριστοῦ Ἰησοῦ⸃ πᾶσιν τοῖς ἁγίοις ἐν Χριστῷ Ἰησοῦ τοῖς οὖσιν ἐν Φιλίπποις σὺν ἐπισκόποις καὶ διακόνοις·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/001.yaml
  text: 'Paul and Timothy[a], servants of Messiah Jesus, to all the saints in Messiah Jesus who are in Philippi[c][b], together with the overseers and deacons:'
translation:
  language: te
  text: మెస్సీయ యేసు దాసులైన పౌలు, తిమోతి,[b] ఫిలిప్పీలో ఉన్న, మెస్సీయ యేసులోని పవిత్రులైన వారందరికీ,[a] పర్యవేక్షకులు మరియు పరిచారకులతో కలిసి:[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మెస్సీయ యేసు”కు బదులుగా “క్రీస్తు యేసు” అని కూడా అనువదించవచ్చు. గ్రీకు Χριστός అంటే “అభిషిక్తుడు.”
    reason: alternative_reading
  - marker: b
    text: “దాసులు”కు “సేవకులు” లేదా “బానిసలు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “పర్యవేక్షకులు”కు “బిషప్పులు” అని కూడా అనువదించవచ్చు; “పరిచారకులు”కు “డీకన్లు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: దాసులు
  rationale: గ్రీకు పదంలోని అధీనత, యజమానికి చెందినవారనే భావాన్ని నిలుపుతూ, ఆధునిక గౌరవప్రదమైన తెలుగు లేఖా శైలిలో సహజంగా ఉంటుంది; ‘సేవకులు’ కంటే మూలపదానికి దగ్గరగా ఉంది.
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసు / మెస్సీయ యేసులో
  rationale: Χριστός మొదట బిరుదు; ‘మెస్సీయ’ దాని అభిషిక్త రాజు భావాన్ని కాపాడుతుంది. పేరును ‘యేసు’గా లిప్యంతరీకరించాం.
- source_word: πᾶσιν τοῖς ἁγίοις
  choice: పవిత్రులైన వారందరికీ
  rationale: ἅγιοι యొక్క ‘పవిత్రంగా ప్రత్యేకించబడినవారు’ అనే అర్థాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది; తరువాతి కాలపు ప్రత్యేక పుణ్యాత్ముల భావాన్ని అనవసరంగా రప్పించదు.
- source_word: ἐν
  choice: లో
  rationale: ఫిలిప్పీలో భౌగోళిక ఉనికినీ, మెస్సీయ యేసులోని సంబంధం/ఐక్యతనూ ఒకే మూల ఉపసర్గకు తగిన విధంగా నిలుపుతుంది.
- source_word: τοῖς οὖσιν ἐν Φιλίπποις
  choice: ఫిలిప్పీలో ఉండి
  rationale: గ్రీకు వర్తమాన కృదంత నిర్మాణాన్ని సహజమైన తెలుగు ఉపవాక్యంగా వ్యక్తం చేస్తుంది.
- source_word: σὺν
  choice: తోనూ … తోనూ సహా
  rationale: ప్రధాన స్వీకర్తలతో పర్యవేక్షకులు, పరిచారకులు కలిసి ఉన్నారనే సహవాస భావాన్ని స్పష్టంగా చూపుతుంది.
- source_word: ἐπισκόποις
  choice: పర్యవేక్షకులు
  rationale: మూలపదపు కార్యార్థాన్ని పారదర్శకంగా తెలుపుతుంది; తరువాతి సంఘవ్యవస్థలోని ‘బిషప్పులు’ అనే నిర్దిష్ట హోదాను మూలంలోకి దిగుమతి చేయదు.
- source_word: διακόνοις
  choice: పరిచారకులు
  rationale: ఇక్కడ పర్యవేక్షకులతో జతగా గుర్తించబడిన సేవా బాధ్యతగల వర్గాన్ని సూచిస్తుంది; ‘డీకన్లు’ అనే ప్రత్యామ్నాయం కూడా సాధ్యమే.
theological_decisions:
- issue: పౌలు పలకరింపులో Χριστός అనువాదం
  choice: మెస్సీయ యేసు
  alternative: క్రీస్తు యేసు
  rationale: ఇక్కడ Χριστός బిరుదుగా ఉన్న మూలార్థాన్ని ‘మెస్సీయ’ స్పష్టంగా నిలుపుతుంది; సంప్రదాయ తెలుగు రూపమైన ‘క్రీస్తు’ను పాదటిప్పణిలో ఇస్తున్నాం.
- issue: ఫిలిప్పీయులు 1:1లో δοῦλοι అనువాదం
  choice: దాసులు
  alternative: సేవకులు; బానిసలు
  rationale: ఈ పదం యజమానికి చెందిన స్థితిని సూచిస్తుంది. ‘దాసులు’ ఆ అధీనతను నిలుపుతూ తెలుగు ఆధ్యాత్మిక-లేఖా సందర్భంలో గౌరవప్రదంగా ఉంటుంది; ‘సేవకులు’ బంధిత స్థితిని బలహీనపరచవచ్చు, ‘బానిసలు’ ఆధునిక తెలుగులో ప్రధానంగా బలవంతపు సామాజిక దాస్యాన్ని ముందుకు తెస్తుంది.
- issue: ἐπισκόποις సూచించే సంఘ బాధ్యత
  choice: పర్యవేక్షకులు
  alternative: బిషప్పులు
  rationale: మొదటి శతాబ్దపు పదాన్ని తరువాతి నిర్దిష్ట హోదాతో ముందుగానే సమానం చేయకుండా దాని కార్యార్థాన్ని అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన లేఖా ప్రారంభ శైలి. గ్రీకు వాక్యంలో స్పష్టమైన ‘వ్రాయునది’ క్రియ లేకపోయినా, తెలుగులో స్వీకర్తల విభక్తిని సహజంగా పూర్తిచేయడానికి లేఖా సూత్రంగా దాన్ని ఇటాలిక్స్ లేకుండా చేర్చాం. పాదటిప్పణి గుర్తులన్నీ ప్రధాన వచనంలో ఉన్నాయి.
