id: PHP.1.28
reference: Philippians 1:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ μὴ πτυρόμενοι ἐν μηδενὶ ὑπὸ τῶν ἀντικειμένων (ἥτις ⸂ἐστὶν αὐτοῖς⸃ ἔνδειξις ἀπωλείας, ⸀ὑμῶν δὲ σωτηρίας, καὶ τοῦτο ἀπὸ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/028.yaml
  text: and not being frightened in anything by those who oppose you[a]. This is a sign to them of destruction[c][b], but of your salvation—and this from God.
translation:
  language: te
  text: మిమ్మల్ని ఎదిరించేవారిచేత ఏ విషయంలోనూ బెదిరిపోకుండా[a] ఉండండి. ఇది వారికి నాశనం కలుగుతుందనడానికి, మీకు రక్షణ కలుగుతుందనడానికి సూచన[b]—ఇది దేవుని నుండి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘భయపడకుండా’ లేదా ‘భయభ్రాంతులకు లోనుకాకుండా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆధారం’ లేదా ‘సంకేతం.’
    reason: lexical_alternative
  - marker: c
    text: ‘ఇది దేవుని నుండి’ అనే మాట ప్రత్యేకంగా రక్షణను సూచించవచ్చు; లేదా ముందుగా చెప్పిన మొత్తం సూచనను మరింత విస్తృతంగా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: πτυρόμενοι
  choice: బెదిరిపోకుండా
  rationale: ఈ క్రియ హఠాత్తుగా భయపడడం లేదా ప్రత్యర్థులవల్ల బెదిరింపుకు లోనవడం అనే భావాన్ని ఇస్తుంది. సందర్భంలోని ప్రతిఘటనను దృష్టిలో ఉంచితే ‘బెదిరిపోకుండా’ సహజంగా, బలంగా ఉంది.
- source_word: ἐν μηδενί
  choice: ఏ విషయంలోనూ
  rationale: ‘దేనిలోనూ/ఏ విధంగానూ కాదు’ అనే సంపూర్ణ భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: τῶν ἀντικειμένων
  choice: మిమ్మల్ని ఎదిరించేవారు
  rationale: నామవాచకంగా వాడిన కృదంతం వారిని వ్యతిరేకిస్తూ ఉన్న వ్యక్తులను సూచిస్తుంది; సంబంధ భావాన్ని స్పష్టంగా చేయడానికి ‘మిమ్మల్ని’ చేర్చబడింది.
- source_word: ἔνδειξις
  choice: సూచన
  rationale: ఒక వాస్తవాన్ని తెలియజేసే ఆధారం లేదా సంకేతం అనే భావాన్ని ‘సూచన’ సహజంగా వ్యక్తం చేస్తుంది; ‘రుజువు’ కంటే తక్కువ నిర్దిష్టతను మోపుతుంది.
- source_word: ἀπωλείας
  choice: నాశనం
  rationale: వినాశం, తీర్పుతో కూడిన అంతం అనే విస్తృత భావాన్ని అదనపు సిద్ధాంత నిర్దిష్టత లేకుండా నిలుపుతుంది.
- source_word: σωτηρίας
  choice: రక్షణ
  rationale: పౌలు వాడుకలోని దేవుని రక్షించే కార్యానికి సంబంధించిన వేదాంతపరమైన బరువును తెలుగులో స్థిరంగా వ్యక్తం చేస్తుంది.
- source_word: τοῦτο ἀπὸ θεοῦ
  choice: ఇది దేవుని నుంచే
  rationale: ‘ఇది’ అనే సూచన సర్వనామాన్ని స్పష్టంగా ఉంచుతూ, అది కేవలం రక్షణనో లేక ముందున్న మొత్తం సూచననో ఉద్దేశిస్తుందనే అస్పష్టతను పరిష్కరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: τοῦτο (‘ఇది’) యొక్క పూర్వపదం
  choice: ‘ఇది దేవుని నుంచే’ అని ఉద్దేశాన్ని విస్తృతంగానే ఉంచడం
  alternative: ‘ఇది’ ప్రత్యేకంగా విశ్వాసుల రక్షణను సూచిస్తుంది; లేదా వారి నిర్భయత వెల్లడించే మొత్తం సూచనను సూచిస్తుంది
  rationale: గ్రీకు వాక్యం ఒకే పూర్వపదాన్ని నిర్బంధంగా నిర్ణయించదు. అందువల్ల మూలంలోని వేదాంతపరమైన ఉద్రిక్తతను అనువాదంలో అలాగే ఉంచాం.
- issue: ἥτις సూచించే విషయం
  choice: ముందున్న నిర్భయ స్థితిని ‘ఇది’తో సూచించడం
  alternative: సర్వనామాన్ని ‘ఈ నిర్భయత’ అని వివరణాత్మకంగా విస్తరించడం
  rationale: ‘ఇది’ మూలంలోని సంబంధాన్ని నిలుపుతూ, పౌలు ఉద్దేశించిన సూచనను అనువాదమే అతిగా వివరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి వాడబడింది. ‘మాత్రం’ δέ యొక్క వ్యత్యాసాన్ని సహజంగా చూపుతుంది. చివరి విభాగంలో డాష్ వాక్యంలోని బలమైన ముగింపును, zugleich మూలంలోని సంబంధ అస్పష్టతను నిలుపుతుంది.
