id: PHP.1.19
reference: Philippians 1:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι τοῦτό μοι ἀποβήσεται εἰς σωτηρίαν διὰ τῆς ὑμῶν δεήσεως καὶ ἐπιχορηγίας τοῦ πνεύματος Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/019.yaml
  text: For I know that this will turn out for my deliverance through your prayer and the provision of the Spirit of Jesus the Messiah[b][a],
translation:
  language: te
  text: ఎందుకంటే, మీ ప్రార్థన ద్వారా, యేసు మెస్సీయ యొక్క ఆత్మ సమకూర్పు ద్వారా, ఇది నా విమోచనకు[a] దారితీస్తుందని నాకు తెలుసు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రక్షణకు”; లేదా “నిర్దోషిగా నిరూపించబడడానికి.”
    reason: alternative_reading
  - marker: b
    text: 'గ్రీకులో: “యేసు మెస్సీయ యొక్క ఆత్మ సమకూర్పు.” దీనికి “ఆత్మను సమకూర్చడం” లేదా “ఆత్మ సమకూర్చే సహాయం” అనే అర్థాలు ఉండవచ్చు.'
    reason: source_ambiguity
lexical_decisions:
- source_word: οἶδα
  choice: నాకు తెలుసు
  rationale: రూపంలో పరిపూర్ణ కాలమైనా వర్తమానార్థం కలిగిన ఈ క్రియ పౌలు నిశ్చయాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τοῦτό
  choice: ఇది
  rationale: ఏకవచన సూచక సర్వనామం పౌలు ప్రస్తుత పరిస్థితి మొత్తాన్ని సూచిస్తుంది; దాని పరిధిని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: ἀποβήσεται εἰς
  choice: దారితీస్తుంది
  rationale: ఏదో ఒక ఫలితానికి చేరడాన్ని సూచించే గ్రీకు ప్రయోగానికి ఇది సహజమైన తెలుగు రూపం.
- source_word: σωτηρίαν
  choice: విడుదల
  rationale: చెరసాల సందర్భంలో తక్షణ భావం విడుదల లేదా క్షేమకరమైన పరిణామం; అయితే రక్షణ, నిర్దోషిత్వ నిరూపణ అనే విస్తృత భావాలను పాదసూచికలో ఉంచాం.
- source_word: δεήσεως
  choice: ప్రార్థన
  rationale: విన్నపంతో కూడిన ప్రార్థనను సాధారణ పాఠకులకు స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐπιχορηγίας
  choice: సహాయం
  rationale: సమకూర్చబడే తోడ్పాటు లేదా సరఫరా అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది; సంబంధిత జన్యార్థ సందిగ్ధతను పాదసూచికలో కాపాడాం.
- source_word: πνεύματος Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ ఆత్మ
  rationale: Χριστόςను బిరుదుగా ‘మెస్సీయ’ అని అనువదిస్తూ, ఆత్మకు యేసు మెస్సీయతో ఉన్న సంబంధాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: చెరసాల సందర్భంలో σωτηρίαν యొక్క అర్థం
  choice: విడుదల
  alternative: రక్షణ; నిర్దోషిత్వ నిరూపణ
  rationale: తక్షణ సందర్భం పౌలు బంధాలు మరియు వాటి ఫలితాన్ని గురించి ఉంది కాబట్టి ‘విడుదల’ ప్రధాన పాఠ్యంలో సరిపోతుంది. అయినా ఈ పదానికి విస్తృత రక్షణార్థం, న్యాయపరమైన సమర్థనార్థం కూడా ఉండగలవు కాబట్టి వాటిని పాదసూచికలో నిలిపాం.
- issue: ἐπιχορηγίας τοῦ πνεύματος అనే జన్యార్థ సంబంధం
  choice: యేసు మెస్సీయ ఆత్మ యొక్క సహాయం
  alternative: యేసు మెస్సీయ ఆత్మను సమకూర్చడం; యేసు మెస్సీయ ఆత్మ సమకూర్చే సహాయం
  rationale: గ్రీకు పదబంధం ఆత్మే సమకూర్చబడుతున్నాడా లేక ఆత్మ సహాయం సమకూరుస్తున్నాడా అన్నది పూర్తిగా నిర్దిష్టం చేయదు. ప్రధాన పాఠ్యం ఆ సంబంధాన్ని విస్తృతంగా ఉంచి, రెండు అవకాశాలను పాదసూచికలో తెలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడాం. కారణాన్ని తెలిపే γάρను ‘ఎందుకంటే’గా ముందుంచాం. ప్రధాన వాక్యంలో సందర్భానుకూలమైన ‘విడుదల’ను ఎంచుకుని, మూలపదంలోని రక్షణాత్మక మరియు న్యాయపరమైన విస్తృతిని పాదసూచికలో కాపాడాం.
