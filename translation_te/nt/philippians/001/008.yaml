id: PHP.1.8
reference: Philippians 1:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μάρτυς γάρ ⸀μου ὁ θεός, ὡς ἐπιποθῶ πάντας ὑμᾶς ἐν σπλάγχνοις ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/008.yaml
  text: For God is my witness[b][a], how I long for all of you with the affections of Messiah Jesus.
translation:
  language: te
  text: ఎందుకంటే, మెస్సీయ యేసు[a] ప్రేమానురాగంతో[b] మీ అందరి కోసం నేను ఎంతగా ఆరాటపడుతున్నానో దేవుడే నాకు సాక్షి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “క్రీస్తు యేసు.”'
    reason: alternative_reading
  - marker: b
    text: 'లేదా: “కనికరంతో.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυς
  choice: సాక్షి
  rationale: ‘దేవుడు నాకు సాక్షి’ అనే సహజమైన తెలుగు ప్రయోగం, పౌలు తన నిజాయితీకి దేవుణ్ణి సాక్షిగా పిలుస్తున్న గంభీర భావాన్ని నిలుపుతుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలో వ్యక్తమైన ప్రేమాభిమానానికి ఈ వాక్యం కారణం లేదా వివరణ ఇస్తున్న అనుసంధానాన్ని స్పష్టంగా చూపుతుంది.
- source_word: ὡς
  choice: ఎంతగా … తహతహలాడుతున్నానో
  rationale: ఇది కేవలం వాస్తవాన్ని కాక పౌలు కోరిక యొక్క తీవ్రతను పరిచయం చేస్తుంది; తెలుగు ‘ఎంతగా … ఓ’ నిర్మాణం ఆ బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπιποθῶ
  choice: చూడాలని … తహతహలాడుతున్నాను
  rationale: వ్యక్తుల కోసం గాఢంగా ఆరాటపడే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘చూడాలని’ అనేది సందర్భంలో వ్యక్తుల సాన్నిధ్యాన్ని కోరుకోవడాన్ని స్పష్టం చేసే సహజ తెలుగు వ్యక్తీకరణ.
- source_word: πάντας ὑμᾶς
  choice: మీ అందరినీ
  rationale: πάντας లోని సమగ్ర ప్రాధాన్యాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: σπλάγχνοις
  choice: వాత్సల్యంతో
  rationale: అంతరంగ అవయవాలను గాఢ భావోద్వేగాల స్థానంగా సూచించే గ్రీకు రూపకాన్ని పదశః కాకుండా, దాని లోతైన అనురాగ భావంతో తెలుగులో అందిస్తుంది.
- source_word: Χριστοῦ Ἰησοῦ
  choice: మెస్సీయ యేసు
  rationale: Χριστός యొక్క బిరుదు భావాన్ని ‘మెస్సీయ’గా నిలుపుతూ, Ἰησοῦ అనే పేరును ‘యేసు’గా ఇస్తుంది; తెలుగులో సంబంధాన్ని సహజంగా చూపేందుకు ‘మెస్సీయ యేసుకున్న’ అనే రూపం వాడబడింది.
theological_decisions:
- issue: పౌలు వాడిన Χριστοῦ Ἰησοῦ అనే బిరుదు-పేరు సమాసాన్ని అనువదించడం
  choice: మెస్సీయ యేసు
  alternative: క్రీస్తు యేసు
  rationale: ఈ సందర్భంలో Χριστός బిరుదు భావం గ్రహించదగినదిగా ఉన్నందున దాని అర్థాన్ని ‘మెస్సీయ’గా వ్యక్తం చేశాం; సంప్రదాయబద్ధమైన ‘క్రీస్తు యేసు’ రూపాన్ని పాదసూచికలో ఉంచాం.
- issue: ἐν σπλάγχνοις Χριστοῦ Ἰησοῦ లో భావోద్వేగ సంబంధం
  choice: మెస్సీయ యేసుకున్న వాత్సల్యంతో
  alternative: మెస్సీయ యేసుకున్న కనికరంతో
  rationale: ఈ మాట పౌలు స్వంత భావాల మూలం లేదా స్వభావాన్ని యేసు మెస్సీయ యొక్క అంతరంగ అనురాగంతో అనుసంధానిస్తుంది. ‘వాత్సల్యం’ అనురాగాన్ని ముందుకు తెస్తుంది; ‘కనికరం’ కూడా సాధ్యమైన భావ ఛాయగా పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. గ్రీకు వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, ‘దేవుడే నాకు సాక్షి’ అనే ప్రధాన వాక్యాన్ని చివర ఉంచడం ద్వారా తెలుగు సహజత్వం మరియు గంభీరత రెండూ నిలుపబడ్డాయి. ‘చూడాలని తహతహలాడుతున్నాను’ అనేది వ్యక్తుల కోసం కలిగిన గాఢమైన ఆరాటాన్ని సహజంగా తెలియజేస్తుంది.
