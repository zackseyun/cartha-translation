id: 1TI.4.5
reference: 1 Timothy 4:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἁγιάζεται γὰρ διὰ λόγου θεοῦ καὶ ἐντεύξεως.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/005.yaml
  text: for it is sanctified through the word of God and prayer[a][b].
translation:
  language: te
  text: ఎందుకంటే అది దేవుని వాక్యం ద్వారా, ప్రార్థన ద్వారా పవిత్రపరచబడుతుంది.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పరిశుద్ధపరచబడుతుంది.’
    reason: lexical_alternative
  - marker: b
    text: ‘ప్రార్థన’కు బదులుగా ‘విన్నపం’ లేదా ‘మధ్యవర్తిత్వ ప్రార్థన’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁγιάζεται
  choice: పవిత్రపరచబడుతుంది
  rationale: వర్తమానకాల కర్మణి రూపాన్ని నిలుపుతూ, ముందు వచనంలోని ఆహారం దేవునికి అంగీకారమైన వినియోగానికి ప్రత్యేకపరచబడుతుందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు కారణాన్ని తెలిపే వివరణాత్మక సంధానాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: διὰ
  choice: ద్వారా
  rationale: షష్ఠీ విభక్తితో ఉన్న διά సాధనం లేదా మాధ్యమాన్ని సూచిస్తుంది; ‘ద్వారా’ ఆ సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: λόγου θεοῦ
  choice: దేవుని వాక్యం
  rationale: మూలంలోని షష్ఠీ సంబంధాన్ని సూటిగా వ్యక్తం చేస్తూ, ఇది లేఖన ప్రకటననా, సృష్టిలో దేవుని పలుకా, లేక విస్తృతమైన దైవిక అనుమతినా అన్న విషయాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: ἐντεύξεως
  choice: ప్రార్థన
  rationale: ఈ సందర్భంలో కృతజ్ఞతతో ఆహారాన్ని స్వీకరించేటప్పుడు చేసే ప్రార్థనను విస్తృతంగా, సహజంగా సూచిస్తుంది; ‘విన్నపం’ లేదా ‘మధ్యవర్తిత్వ ప్రార్థన’ అనే ప్రత్యేక ఛాయలను పాదటిప్పణిలో ఉంచుతుంది.
theological_decisions:
- issue: సందర్భంలో పవిత్రపరచబడటం అనే భాష యొక్క పరిధి
  choice: వచనం ఆహారం దేవునికి అంగీకారమైన వినియోగానికి ప్రత్యేకపరచబడటాన్ని సూచించేలా, కర్మణి పవిత్రత భాషను యథాతథంగా ఉంచడం.
  alternative: దీనిని నైతిక శుద్ధీకరణగా, రక్షణ సంబంధమైన పవిత్రీకరణగా, లేదా ఒక నిర్దిష్ట ఆచార సిద్ధాంతంగా వివరించడం.
  rationale: తక్షణ సందర్భం (1 తిమోతి 4:3–4) కృతజ్ఞతతో స్వీకరించే ఆహారాల గురించి మాట్లాడుతుంది. అనువాదం ‘పవిత్రపరచబడుతుంది’ అనే అసలు ఉద్వేగాన్ని నిలుపుతుంది; దాని నిర్దిష్ట పరిధిని సందర్భమే నియంత్రించేలా వదిలి, మూలంలో లేని సిద్ధాంతపరమైన నిర్ధారణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన బైబిలు శైలి. ‘పవిత్రపరచబడుతుంది’ కర్మణి నిర్మాణాన్ని కాపాడుతుంది. రెండు పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో స్పష్టంగా చేర్చబడ్డాయి.
