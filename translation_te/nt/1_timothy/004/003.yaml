source:
  edition: SBLGNT
  text: κωλυόντων γαμεῖν, ἀπέχεσθαι βρωμάτων ἃ ὁ θεὸς ἔκτισεν εἰς μετάλημψιν μετὰ εὐχαριστίας τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/003.yaml
  text: forbidding marriage and requiring abstinence from foods that God created to be received with thanksgiving by those who believe and have come to know the truth[a].
translation:
  language: te
  text: వివాహం చేసుకోవద్దని నిషేధిస్తూ, విశ్వాసులైన సత్యాన్ని తెలుసుకున్నవారు కృతజ్ఞతతో స్వీకరించడానికి దేవుడు సృష్టించిన ఆహారపదార్థాలకు దూరంగా ఉండాలని ఆదేశిస్తారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “వివాహం చేసుకోవడాన్ని నిషేధిస్తూ, ఆహారపదార్థాలకు దూరంగా ఉండమని [ఆదేశిస్తూ].” మూలంలోని సంక్షిప్త నిర్మాణంలో, ఈ బోధకులు కొన్ని ఆహారపదార్థాలకు దూరంగా ఉండాలని ఆదేశిస్తున్నారనే భావం సందర్భం ద్వారా తెలుస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλυόντων
  choice: నిషేధిస్తూ
  rationale: వర్తమాన కృదంతం మునుపటి వచనంలోని వర్ణనను కొనసాగిస్తుంది; తెలుగులో ‘నిషేధిస్తూ’ ఆ కొనసాగింపును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: γαμεῖν
  choice: వివాహం చేసుకోవద్దని
  rationale: మూలంలో ‘వివాహం చేసుకోవడం’ అనే క్రియార్థక రూపం ఉంది; నిషేధపు భావంతో కలిపి తెలుగులో సహజంగా ప్రతికూల ఆదేశరూపంలో ఇచ్చాం.
- source_word: ἀπέχεσθαι
  choice: దూరంగా ఉండాలని ఆదేశిస్తారు
  rationale: పదానికి ‘దూరంగా ఉండడం/మానుకోవడం’ అని అర్థం. సమాంతర నిర్మాణంలో అబద్ధ బోధకులు దీనిని విధిస్తున్నారనే అంతర్నిహిత భావాన్ని స్పష్టం చేశాం.
- source_word: βρωμάτων
  choice: ఆహారపదార్థాలకు
  rationale: మూలంలోని బహువచన భావాన్ని సహజమైన ఆధునిక తెలుగు పదంతో నిలిపాం.
- source_word: ἃ
  choice: దేవుడు సృష్టించిన
  rationale: సంబంధబోధక సర్వనామం ఆహారపదార్థాలను సూచిస్తుంది; తెలుగులో సంబంధ కృదంత నిర్మాణం సహజం.
- source_word: ἔκτισεν
  choice: సృష్టించిన
  rationale: κτίζωలోని సృష్టి సంబంధిత బలాన్ని ‘చేసిన’ కంటే ‘సృష్టించిన’ స్పష్టంగా నిలుపుతుంది.
- source_word: εἰς μετάλημψιν
  choice: స్వీకరించడానికి
  rationale: ఈ పదబంధం ఉద్దేశాన్ని సూచిస్తుంది; ఆహారాన్ని పుచ్చుకోవడం/భుజించడం అనే సందర్భార్థాన్ని ‘స్వీకరించడానికి’ గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: μετὰ εὐχαριστίας
  choice: కృతజ్ఞతతో
  rationale: దేవునికి కృతజ్ఞత చెల్లిస్తూ స్వీకరించడమనే భావాన్ని సంక్షిప్తంగా, పారదర్శకంగా నిలుపుతుంది.
- source_word: τοῖς πιστοῖς
  choice: విశ్వసించి
  rationale: πιστοῖς ఇక్కడ విశ్వాసులను సూచిస్తుంది; తరువాతి లక్షణంతో ఒకే సమూహాన్ని తెలుగులో సహజంగా అనుసంధానించేందుకు క్రియావిశేషణ కృదంత రూపం వాడాం.
- source_word: ἐπεγνωκόσι τὴν ἀλήθειαν
  choice: సత్యాన్ని తెలుసుకున్నవారు
  rationale: పూర్ణకాల కృదంతం సత్యాన్ని తెలుసుకొని ఆ జ్ఞానస్థితిలో ఉన్నవారిని సూచిస్తుంది; ‘తెలుసుకున్నవారు’ ఆ ఫలితస్థితిని నిలుపుతుంది.
theological_decisions:
- issue: τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν ఒకే సమూహాన్నా లేక రెండు సమూహాలనా సూచిస్తుంది?
  choice: విశ్వసించి సత్యాన్ని తెలుసుకున్న ఒకే సమూహం
  alternative: విశ్వాసులు మరియు సత్యాన్ని తెలుసుకున్నవారు అనే రెండు వేర్వేరు సమూహాలు
  rationale: పంచుకున్న articleతో సమన్వయంగా వచ్చిన రెండు వర్ణనలు ఒకే ప్రజలను రెండు లక్షణాలతో గుర్తించడం వ్యాకరణపరంగా సహజం; తెలుగు నిర్మాణం దీనిని బలవంతపు సిద్ధాంతీకరణ లేకుండా ప్రతిబింబిస్తుంది.
- issue: ἀπέχεσθαιపై κωλυόντων ప్రభావం
  choice: అబద్ధ బోధకులు ఆహారాలకు దూరంగా ఉండాలని ఆదేశిస్తున్నారనే భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టం చేయడం
  alternative: ‘వివాహం చేసుకోవడాన్ని, ఆహారాలకు దూరంగా ఉండడాన్ని నిషేధిస్తూ’ అని కఠిన పదక్రమంతో అనువదించడం
  rationale: మూలంలోని సంక్షిప్త అసమమిత నిర్మాణాన్ని అక్షరార్థంగా తీసుకుంటే ఆహార విరమణనే నిషేధిస్తున్నట్లు తప్పుగా అర్థమవుతుంది. సందర్భం ఆ బోధకులు విరమణను విధిస్తున్నారని స్పష్టం చేస్తుంది; పాదటిప్పణి రూపపరమైన క్లిష్టతను భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. వాక్యం 4:1–3లో కొనసాగుతున్న వర్ణనలో భాగమని చూపేందుకు ‘నిషేధిస్తూ’ తరువాత ప్రధాన క్రియను ‘ఆదేశిస్తారు’గా ఇచ్చాం. ‘ఆహారపదార్థాలు’ బహువచనాన్ని, ‘సృష్టించిన’ సృష్టి భాషను నిలుపుతాయి.
