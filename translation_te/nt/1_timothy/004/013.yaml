- from: నేను వచ్చే వరకు, బహిరంగ పఠనానికి[a], ప్రోత్సాహానికి, బోధకు నిన్ను నీవు అంకితం చేసుకో.
  to: నేను వచ్చే వరకు, బహిరంగ పఠనానికి[a], ప్రబోధానికి, బోధకు నిన్ను నీవు అంకితం చేసుకో.
  rationale: The revision changes only the rendering of παράκλησις, restoring its exhortative pastoral force. The contextual rendering ‘బహిరంగ పఠనం’ and its footnote are retained, since the Greek does not explicitly state the object of the reading.
