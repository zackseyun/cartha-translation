id: 1TI.4.13
reference: 1 Timothy 4:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἕως ἔρχομαι πρόσεχε τῇ ἀναγνώσει, τῇ παρακλήσει, τῇ διδασκαλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/013.yaml
  text: Until I come[a], devote yourself to the public reading, to exhortation, to teaching.
translation:
  language: te
  text: నేను వచ్చే వరకు, బహిరంగ పఠనానికి[a], ప్రబోధానికి, బోధకు నిన్ను నీవు అంకితం చేసుకో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లేఖన పఠనానికి.’ గ్రీకు మూలంలో కేవలం ‘పఠనానికి’ అని ఉంది; అయితే సందర్భంలో ఇది సంఘంలో లేఖనాలను బహిరంగంగా చదవడాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔρχομαι
  choice: నేను వచ్చే వరకు
  rationale: ἕως కాలపరిమితిని సూచిస్తుంది; సందర్భంలో ἔρχομαι భవిష్యదర్థంలో ఉంది. ఈ రెండింటినీ సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: πρόσεχε
  choice: నిన్ను నీవు అంకితం చేసుకో
  rationale: ఇది కేవలం గమనించమనే భావం కాకుండా, నిరంతర శ్రద్ధతో నిమగ్నమై ఉండాలనే ఆజ్ఞను తెలియజేస్తుంది.
- source_word: τῇ ἀναγνώσει
  choice: బహిరంగ పఠనానికి
  rationale: ἀνάγνωσις అంటే పఠనం. సంఘ పరిచర్య సందర్భం బహిరంగంగా చదవడాన్ని సూచించే అవకాశమున్నా, మూలపాఠం చదివే విషయాన్ని స్పష్టంగా పేర్కొనదు.
- source_word: τῇ παρακλήσει
  choice: ప్రోత్సాహానికి
  rationale: παράκλησις ప్రోత్సాహం, ఉపదేశపూర్వక ప్రేరణ లేదా హెచ్చరికను సూచించగలదు. ‘ప్రోత్సాహం’ దాని విస్తృతమైన కాపరి పరిచర్య భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: τῇ διδασκαλίᾳ
  choice: బోధకు
  rationale: διδασκαλία ఇక్కడ బోధించే కార్యాన్ని లేదా బోధను సూచిస్తుంది. ‘బోధ’ స్పష్టమైన, సహజమైన పదం; వ్యవస్థీకృత సిద్ధాంతం అనే సంకుచిత భావాన్ని అనవసరంగా చేర్చదు.
theological_decisions:
- issue: ἀνάγνωσιςను ప్రధాన పాఠంలో లేఖన పఠనమని స్పష్టంగా పేర్కొనాలా?
  choice: బహిరంగ పఠనం
  alternative: లేఖన పఠనం; పఠనం
  rationale: సంఘ జీవితం, పరిచర్య గురించి ఉన్న సందర్భం లేఖనాలను బహిరంగంగా చదవడాన్ని బలంగా సూచిస్తుంది. అయితే గ్రీకు మూలపాఠంలో ‘లేఖనం’ అనే కర్మ లేదు. అందువల్ల ప్రధాన పాఠం సందర్భసూచితమైన బహిరంగతను తెలియజేస్తూ, చెప్పని కర్మను చేర్చకుండా ఉంటుంది; మరింత స్పష్టమైన భావాన్ని పాదసూచికలో ఉంచుతుంది.
- issue: παράκλησιςలోని ప్రోత్సాహం–హెచ్చరిక భావవిస్తృతి
  choice: ప్రోత్సాహం
  alternative: హెచ్చరిక; ఉపదేశపూర్వక ప్రేరణ
  rationale: ఈ పదం ఓదార్పు లేదా ప్రోత్సాహంతో పాటు గట్టిగా పురికొల్పడం, విజ్ఞప్తి చేయడం అనే భావాలనూ కలిగి ఉండవచ్చు. సందర్భం ఒక్క భావానికే పరిమితం చేయదు; అందువల్ల విస్తృతంగా అర్థమయ్యే ‘ప్రోత్సాహం’ ఎంచుకోబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా పరిచర్య ఆజ్ఞకు తగిన గౌరవప్రదమైన శైలిలో ఉంది. మూడు సమాంతర అంశాల నిర్మాణం నిలుపబడింది.
