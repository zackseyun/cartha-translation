lexical_decisions:
- source_word: ἐν
  choice: ద్వారా
  rationale: ముందటి వాక్యభాగంతో సంబంధంలో సాధనం లేదా మాధ్యమాన్ని సూచించే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὑποκρίσει
  choice: వేషధారణ
  rationale: నిజ స్వభావాన్ని దాచుతూ వేరొక రూపాన్ని నటించడం అనే ὑπόκρισις భావాన్ని ఆధునిక, సాధారణ తెలుగులో అందిస్తుంది.
- source_word: ψευδολόγων
  choice: అబద్ధాలు చెప్పేవారి
  rationale: అబద్ధపు మాటలు చెప్పడం వారి లక్షణమని సూచించే గ్రీకు సమాసపదాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κεκαυστηριασμένων
  choice: వాత వేయబడినదిగా ఉంది
  rationale: కాల్చి ముద్రవేయడం లేదా కాల్చి స్పందనలేనిదిగా చేయడం అనే గ్రీకు రూపకాన్ని నిలుపుతుంది; perfect participle సూచించే కొనసాగుతున్న ఫలితస్థితిని ‘ఉంది’ తెలియజేస్తుంది.
- source_word: τὴν ἰδίαν συνείδησιν
  choice: వారి సొంత మనస్సాక్షి
  rationale: గ్రీకులోని ఏకవచనాన్ని, ἰδίαν యొక్క ‘సొంత’ అనే బలాన్ని నిలుపుతూ తెలుగులో సమూహానికి పంపిణీగా వర్తించేలా అనువదించబడింది.
theological_decisions:
- issue: κεκαυστηριασμένων అనే రూపకపు ఖచ్చిత భావం
  choice: మనస్సాక్షి ‘వాత వేయబడినది’ అని రూపకాన్ని నిలుపడం
  alternative: మనస్సాక్షి మొద్దుబారిపోయింది; మనస్సాక్షిపై కాల్చి ముద్ర వేయబడింది; మనస్సాక్షి కాల్చివేయబడింది
  rationale: గ్రీకు చిత్రం కాల్చి ముద్రవేయడాన్నీ, కాల్చడం వల్ల స్పందన కోల్పోవడాన్నీ సూచించవచ్చు. ప్రధాన పాఠం ఈ రెండింటిలో ఒకదానిని ఖచ్చితంగా నిర్ణయించకుండా రూపకాన్నీ దాని ధార్మిక ఉద్రిక్తతనూ నిలుపుతుంది; తిరుగులేని ఆధ్యాత్మిక స్థితి అనే సిద్ధాంతాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘వాత వేయబడినది’ రూపకాన్ని సహజంగా ఉంచుతుంది; అస్పష్టతను పాదసూచిక వివరిస్తుంది.
