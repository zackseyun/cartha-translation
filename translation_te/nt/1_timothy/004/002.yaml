revisions:
- from: అబద్ధాలు చెప్పేవారి వేషధారణ ద్వారా—వారి సొంత మనస్సాక్షి వాత వేయబడినదిగా ఉంది.[a]
  to: తమ సొంత మనస్సాక్షి వాతపెట్టబడిన అబద్ధికుల కపటత్వం ద్వారా,[a]
  rationale: 'సవరణ గ్రీకు వాక్యనిర్మాణాన్ని కాపాడుతుంది: అబద్ధికులకే వారి సొంత మనస్సాక్షి వాతపెట్టబడినదనే విశేషణం వర్తిస్తుంది. ‘కపటత్వం ద్వారా’ సాధనార్థకమైన ἐνను, ‘తమ సొంత’ ἰδίαν యొక్క ఉద్ఘాటనను నిలుపుతాయి. ప్రధాన పాఠం వాతపెట్టడం అనే రూపకాన్ని ఉంచగా, పాదసూచిక ముద్రవేయడం మరియు కాల్చివేయడం అనే ప్రత్యామ్నాయ చిత్రాలను సిద్ధాంతపరంగా నిర్ధారించకుండా అందిస్తుంది.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:00:00Z'
review_pass:
  verdict: revise
  source_fidelity: ‘అబద్ధాలు చెప్పేవారి వేషధారణ ద్వారా’ broadly conveys ἐν ὑποκρίσει ψευδολόγων, but the participial phrase κεκαυστηριασμένων should modify the liars, not stand as a separate finite assertion. ‘వాత వేయబడినదిగా ఉంది’ also weakens the Greek perfect-passive participle’s syntactic connection.
  naturalness: ‘వాత వేయబడినదిగా ఉంది’ is awkward in modern standard Telugu. A relative-participial construction, with ‘వాతపెట్టబడిన’ written as one verb, is more idiomatic and accurately connects the conscience image to the liars.
  terminology: ‘కపటత్వం’ is a more direct and current equivalent for ὑπόκρισις than ‘వేషధారణ,’ which can suggest merely costume or outward appearance. ‘మనస్సాక్షి’ and ‘తమ సొంత’ appropriately preserve the moral sense and emphatic possessive force.
  issues:
  - severity: medium
    issue: The searing/cauterizing phrase is syntactically detached from ‘liars.’
    rationale: κεκαυστηριασμένων is a genitive plural participle associated with ψευδολόγων. Telugu should express this as ‘తమ సొంత మనస్సాక్షి వాతపెట్టబడిన అబద్ధికుల,’ rather than as an independent clause.
  - severity: medium
    issue: ‘వాత వేయబడినదిగా ఉంది’ is unnatural and imprecise in form.
    rationale: The expression is cumbersome, and the separate ‘ఉంది’ does not naturally reproduce the participle. ‘వాతపెట్టబడిన’ is the standard compact passive expression and retains the cauterizing/searing image.
  - severity: low
    issue: ‘వేషధారణ’ is less exact for ὑπόκρισις.
    rationale: ‘కపటత్వం’ directly denotes hypocrisy/pretence in the ethical-religious register, whereas ‘వేషధారణ’ can be read more literally as disguise.
  revised_text: తమ సొంత మనస్సాక్షి వాతపెట్టబడిన అబద్ధికుల కపటత్వం ద్వారా,[a]
