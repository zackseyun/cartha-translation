id: 1TI.4.14
reference: 1 Timothy 4:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ ἀμέλει τοῦ ἐν σοὶ χαρίσματος, ὃ ἐδόθη σοι διὰ προφητείας μετὰ ἐπιθέσεως τῶν χειρῶν τοῦ πρεσβυτερίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/014.yaml
  text: Do not neglect the gift that is in you[b][a], which was given to you through prophecy with the laying on of the hands of the eldership.
translation:
  language: te
  text: నీలో ఉన్న వరాన్ని నిర్లక్ష్యం చేయకు. అది ప్రవచనం ద్వారా[a], పెద్దల సమూహం నీపై చేతులు ఉంచడంతో పాటు నీకు ఇవ్వబడింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రవచన వాక్కు ద్వారా.’ ఈ మాట వరం ఇవ్వబడేటప్పుడు ప్రవచనం తోడుగా పలికిందని గానీ, దాని ప్రదానానికి మాధ్యమమైందని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పెద్దల మండలి.’ మూలపదం పెద్దల సమష్టిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀμέλει
  choice: నిర్లక్ష్యం చేయకు
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞార్థకం కొనసాగుతున్న నిర్లక్ష్యాన్ని నిషేధిస్తుంది. ఈ తెలుగు పదబంధం స్పష్టంగా, సహజంగా ఉంది.
- source_word: τοῦ ἐν σοὶ χαρίσματος
  choice: నీలో ఉన్న వరాన్ని
  rationale: χάρισμαను అదనపు విశేషణం లేకుండా ‘వరం’గా అనువదించి, ἐν σοὶలోని ‘నీలో’ అనే స్థానార్థాన్ని నిలిపింది.
- source_word: ἐδόθη σοι
  choice: నీకు ఇవ్వబడింది
  rationale: కర్మణి ప్రయోగాన్ని అలాగే ఉంచి, గ్రీకు పాఠం స్పష్టంగా పేర్కొనని దాతను అనువాదంలో చేర్చలేదు.
- source_word: διὰ προφητείας
  choice: ప్రవచనం ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సాధనం లేదా మాధ్యమాన్ని సూచించగలదు. ‘ద్వారా’ ఆ భావాన్ని నిలుపుతుంది; ప్రవచనం ఏ విధంగా సంబంధించిందో పూర్తిగా నిర్ణయించదు.
- source_word: μετὰ ἐπιθέσεως τῶν χειρῶν
  choice: చేతులు ఉంచడంతో
  rationale: చేతులు ఉంచే కార్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, అది వరం ఇవ్వబడిన సందర్భంతో కలిసి జరిగినదనే μετὰ భావాన్ని తెలియజేస్తుంది.
- source_word: τοῦ πρεσβυτερίου
  choice: పెద్దల సమూహం
  rationale: ఈ పదం ఒక్క పెద్దను కాక పెద్దల సమష్టిని సూచిస్తుంది. ‘సమూహం’ తరువాతి కాలపు ప్రత్యేక సంఘపాలనా పదజాలాన్ని రుద్దకుండా ఆ సమష్టి భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: χάρισμαకు నిర్దిష్ట ఆధ్యాత్మిక లేదా పరిచర్య సంబంధిత అర్థాన్ని చేర్చాలా
  choice: వరం
  alternative: ఆత్మీయ వరం; కృపావరం
  rationale: సందర్భంలో ఇది పరిచర్యకు సంబంధించిన వరమై ఉండవచ్చు; అయితే మూలపాఠంలో ‘ఆత్మీయ’ అనే విశేషణం లేదు. కాబట్టి అర్థాన్ని అనవసరంగా కుదించలేదు.
- issue: διὰ προφητείαςలో ప్రవచనం వరప్రదానానికి మాధ్యమమా లేక దానితో పాటు పలికిన ప్రవచన వాక్కా
  choice: ప్రవచనం ద్వారా
  alternative: ప్రవచన వాక్కు ద్వారా
  rationale: ‘ద్వారా’ సాధనార్థాన్ని ప్రతిబింబిస్తుంది; పాదసూచిక ప్రవచనం తోడుగా పలికిందా లేదా వరప్రదానానికి మాధ్యమమైందా అనే నిజమైన అస్పష్టతను తెలియజేస్తుంది.
- issue: πρεσβυτέριονను తరువాతి సంఘపాలనా వ్యవస్థకు చెందిన సాంకేతిక పదంగా చూపాలా
  choice: పెద్దల సమూహం
  alternative: పెద్దల మండలి; ప్రెస్బిటరీ
  rationale: మూలపాఠం పెద్దల సమష్టిని సూచిస్తుంది. ఎంపిక చేసిన పదబంధం ఏ ప్రత్యేక మతశాఖ పాలనా నమూనానూ పాఠంలోకి తీసుకురాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి వాడబడింది. ‘వరం,’ ‘ప్రవచనం,’ ‘చేతులు ఉంచడం’ వంటి పరిచిత పదాలను నిలిపి, మతశాఖ-ప్రత్యేక సాంకేతిక పదజాలాన్ని నివారించాం.
