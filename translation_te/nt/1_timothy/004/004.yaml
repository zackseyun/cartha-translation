id: 1TI.4.4
reference: 1 Timothy 4:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι πᾶν κτίσμα θεοῦ καλόν, καὶ οὐδὲν ἀπόβλητον μετὰ εὐχαριστίας λαμβανόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/004.yaml
  text: For every creation of God is good[a], and nothing is to be rejected if it is received with thanksgiving[b],
translation:
  language: te
  text: ఎందుకంటే దేవుడు సృష్టించిన ప్రతిదీ మంచిదే[a]; కృతజ్ఞతతో స్వీకరిస్తే ఏదీ తిరస్కరించదగినది కాదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవుని ప్రతి సృష్టి మంచిదే.” గ్రీకు κτίσμα అనే పదానికి “సృష్టించబడినది,” “జీవి,” లేదా విస్తృతంగా “సృష్టి” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “కృతజ్ఞతతో స్వీకరించినప్పుడు ఏదీ తిరస్కరించదగినది కాదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న వాక్యానికి కారణం లేదా వివరణను పరిచయం చేసే సంధానపదంగా సహజమైన తెలుగులో అనువదించబడింది.
- source_word: πᾶν κτίσμα θεοῦ
  choice: దేవుడు సృష్టించిన ప్రతిదీ
  rationale: ఏకవచనంతో ఉన్న πᾶν యొక్క విభాజక భావాన్ని, κτίσμα యొక్క ‘సృష్టించబడినది’ అనే విస్తృత అర్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; సందర్భాన్ని బట్టి దీనిని కేవలం ఆహారానికి మాత్రమే పరిమితం చేయదు.
- source_word: καλόν
  choice: మంచిదే
  rationale: సృష్టి మంచిదనే భావాన్ని స్పష్టంగా తెలియజేస్తూ, మూలంలోని ఉద్ఘాటనకు తెలుగు ‘ఏ’ నిపాతం సహజంగా సరిపోతుంది.
- source_word: οὐδὲν ἀπόβλητον
  choice: ఏదీ తిరస్కరించదగినది కాదు
  rationale: ἀπόβλητον అనే విశేషణంలోని ‘తిరస్కరించదగినది’ అనే భావాన్ని, సంపూర్ణ నిరాకరణతో నేరుగా కాపాడుతుంది.
- source_word: μετὰ εὐχαριστίας
  choice: కృతజ్ఞతతో
  rationale: కృతజ్ఞతతో స్వీకరించడం అనే స్పష్టమైన భావాన్ని సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: λαμβανόμενον
  choice: స్వీకరిస్తే
  rationale: వర్తమాన కర్మణి కృదంతం తెలిపే పరిస్థితిని తెలుగులో సహజమైన షరతు రూపంలో వ్యక్తం చేస్తుంది; ‘స్వీకరించినప్పుడు’ అనే కాలసూచక పఠనం కూడా సాధ్యమేనని పాదసూచికలో ఉంచబడింది.
theological_decisions:
- issue: ఆహార నియమాలు, తపోనిష్ఠ నిషేధాల సందర్భంలో κτίσμα యొక్క పరిధి
  choice: దేవుడు సృష్టించిన ప్రతిదీ
  alternative: దేవుని ప్రతి జీవి; దేవుడు సృష్టించిన ప్రతి వస్తువు; దేవుడు సృష్టించిన ఆహారమంతా
  rationale: తక్షణ సందర్భం ఆహారాన్ని గురించి ఉన్నప్పటికీ, గ్రీకు పదబంధం మరింత విస్తృతమైనది. అందువల్ల వాక్యాన్ని కేవలం ఆహారానికి పరిమితం చేయకుండా, సృష్టికి సంబంధించిన విస్తృత ఆధారాన్ని నిలుపుతుంది.
- issue: λαμβανόμενον μετὰ εὐχαριστίας యొక్క పరిస్థితి లేదా కాలసూచక భావం
  choice: కృతజ్ఞతతో స్వీకరిస్తే
  alternative: కృతజ్ఞతతో స్వీకరించినప్పుడు; కృతజ్ఞతతో స్వీకరించబడుతూ
  rationale: సృష్టించబడినదాన్ని తిరస్కరించకపోవడం కృతజ్ఞతతో స్వీకరించడానికి అనుసంధానమై ఉందని స్పష్టం చేస్తుంది. అయితే కృదంతం ‘స్వీకరించినప్పుడు’ అనే భావాన్నీ అనుమతిస్తుంది; ఆ నిజమైన భాషాత్మక అవకాశాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్య నిర్మాణం, అయితే ‘కృతజ్ఞత,’ ‘తిరస్కరించదగినది’ వంటి గౌరవప్రదమైన బైబిలు సందర్భానికి తగిన పదజాలం ఉపయోగించబడింది.
