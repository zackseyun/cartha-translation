lexical_decisions:
- source_word: Παράγγελλε
  choice: ఆజ్ఞాపిస్తూ
  rationale: వర్తమానకాల ఆజ్ఞార్థక రూపం కొనసాగుతూ ఉండే అధికారపూర్వక నిర్దేశాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో తదుపరి ఆజ్ఞార్థక క్రియతో సహజంగా అనుసంధానించేందుకు ‘ఆజ్ఞాపిస్తూ’ అని అనువదించాం.
- source_word: ταῦτα
  choice: ఈ సంగతులను
  rationale: నపుంసక బహువచన సూచన సర్వనామం ముందున్న బోధలను లేదా ఆదేశాలను సూచిస్తుంది; ‘ఈ సంగతులను’ దాని బహువచన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: καὶ
  choice: క్రియల అనుసంధానంగా ‘-తూ’ నిర్మాణం
  rationale: రెండు ఆజ్ఞలను కలిపే సాధారణ సంధాయకాన్ని తెలుగులో సహజంగా వ్యక్తపరచడానికి మొదటి క్రియను ‘ఆజ్ఞాపిస్తూ’ అనే అనుసంధాన రూపంలో ఇచ్చాం.
- source_word: δίδασκε
  choice: బోధించు
  rationale: వర్తమానకాల ఆజ్ఞార్థకం నిరంతర బోధనను సూచిస్తుంది. ‘ఈ సంగతులను’ రెండు క్రియలకూ ఉమ్మడి కర్మగా పనిచేస్తుంది కాబట్టి ప్రత్యేకంగా ‘వాటిని’ చేర్చలేదు.
theological_decisions:
- issue: παραγγέλλω సూచించే కాపరి అధికార స్వభావం
  choice: ‘ఆజ్ఞాపిస్తూ’ అనే అధికారపూర్వక పదాన్ని వాడటం
  alternative: ‘ఉపదేశిస్తూ’ లేదా ‘నిర్దేశిస్తూ’
  rationale: గ్రీకు క్రియ కేవలం సలహా లేదా సాధారణ బోధ కంటే బలమైన నిర్దేశాన్ని తెలియజేస్తుంది. అయితే ఈ పదం ద్వారా పాఠ్యంలో లేని అదనపు సంఘపాలనా సిద్ధాంతాలను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, గౌరవప్రదంగా రూపొందించబడింది. రెండు వర్తమాన ఆజ్ఞార్థకాల కొనసాగింపు భావాన్ని తెలుగు సందర్భంలో సహజమైన ‘ఆజ్ఞాపిస్తూ బోధించు’ నిర్మాణం ద్వారా వ్యక్తం చేసింది; పాదటిప్పణిలో రెండు సమాంతర ఆజ్ఞల రూపాన్ని చూపించింది.
