  revision_rationale: The revision replaces the participial construction with two parallel imperative verbs, preserving the coordination of Παράγγελλε … καὶ δίδασκε. It retains the plural “ఈ సంగతులను,” the authoritative directive force, and a concise modern Telugu register.
