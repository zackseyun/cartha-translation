lexical_decisions:
- source_word: πιστὸς
  choice: నమ్మదగినది
  rationale: ఇక్కడ విశేషణం ఆ మాట విశ్వసించదగినదని, ఆధారపడదగినదని తెలియజేస్తుంది. ఆధునిక తెలుగులో ‘నమ్మదగినది’ సహజంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: ὁ λόγος
  choice: ఈ మాట
  rationale: ఈ పత్రికా సూత్రప్రయోగంలో λόγος ఒక నిర్దిష్టమైన ఉక్తి లేదా ప్రకటనను సూచిస్తుంది. ‘ఈ మాట’ సూత్రంలోని నిర్దిష్టతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: πάσης
  choice: పూర్తిగా
  rationale: πάσης ἀποδοχῆς అనే పదబంధం సంపూర్ణ అంగీకారాన్ని సూచిస్తుంది. క్రియావిశేషణ రూపమైన ‘పూర్తిగా’ తెలుగులో సహజంగా ఆ సంపూర్ణతను వ్యక్తం చేస్తుంది.
- source_word: ἀποδοχῆς
  choice: అంగీకరించదగినది
  rationale: ἀποδοχή స్వీకారం లేదా అంగీకారాన్ని సూచిస్తుంది. ἄξιοςతో కలిపి తెలుగులో ‘అంగీకరించదగినది’ అనడం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: ἄξιος
  choice: దగినది
  rationale: ἄξιος జనిటివ్‌తో ‘దానికి యోగ్యమైనది/అర్హమైనది’ అనే భావం ఇస్తుంది. ‘అంగీకరించదగినది’ అనే సంయుక్త రూపంలో ఆ భావం సంక్షిప్తంగా నిలుస్తుంది.
