id: 1TI.4.1
reference: 1 Timothy 4:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τὸ δὲ πνεῦμα ῥητῶς λέγει ὅτι ἐν ὑστέροις καιροῖς ἀποστήσονταί τινες τῆς πίστεως, προσέχοντες πνεύμασι πλάνοις καὶ διδασκαλίαις δαιμονίων
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/001.yaml
  text: The Spirit explicitly says that in later times some will depart from the faith[a], paying attention to deceitful spirits and teachings of demons[c][b],
translation:
  language: te
  text: 'అయితే ఆత్మ స్పష్టంగా చెబుతోంది: మున్ముందు కాలాల్లో[b] కొందరు విశ్వాసం నుంచి తొలగిపోతారు[c]; వారు మోసపరిచే ఆత్మలకూ[a] దయ్యాల బోధలకూ శ్రద్ధ చూపుతూ ఉంటారు.


    [a] లేదా, “మోసకరమైన ఆత్మలు.”


    [b] లేదా, “తరువాతి కాలాల్లో.”


    [c] లేదా, “విశ్వాసం నుంచి వైదొలగిపోతారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మోసకరమైన ఆత్మలు.”
    reason: πλάνοις ను తప్పుదారి పట్టించే క్రియాశీల భావంతో ‘మోసపరిచే’ అని, లేదా మోసపూరిత గుణాన్ని సూచిస్తూ ‘మోసకరమైన’ అని అనువదించవచ్చు.
  - marker: b
    text: లేదా, “తరువాతి కాలాల్లో.”
    reason: ὑστέροις καιροῖς రచయిత కాలం తరువాతి కాలాలను సూచిస్తుంది; ఈ ప్రత్యామ్నాయం అదే కాలసంబంధ భావాన్ని మరింత అక్షరార్థంగా ఇస్తుంది.
  - marker: c
    text: లేదా, “విశ్వాసం నుంచి వైదొలగిపోతారు.”
    reason: ἀποστήσονται దూరమవడం, విడిచిపెట్టడం లేదా వైదొలగడం అనే భావాలను కలిగి ఉంది.
lexical_decisions:
- source_word: Τὸ ... πνεῦμα
  choice: ఆత్మ
  rationale: నిర్దిష్ట ఉపపదంతోను పౌలు సందర్భంతోను ఇది పరిశుద్ధాత్మను సూచించడం అత్యంత సహజం. మూలంలో లేనందున అనువాదంలో ‘పరిశుద్ధ’ అనే విశేషణాన్ని చేర్చలేదు.
- source_word: δὲ
  choice: అయితే
  rationale: ఇది బలమైన వ్యతిరేకతకన్నా స్వల్పమైన భావమార్పును సూచిస్తుంది; ‘అయితే’ ఆ సంధిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ῥητῶς λέγει
  choice: స్పష్టంగా చెబుతున్నదేమిటంటే
  rationale: ῥητῶς లోని బహిరంగమైన, సందేహరహితమైన ప్రకటన భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; వర్తమాన కాల భావాన్ని కూడా నిలుపుతుంది.
- source_word: ἐν ὑστέροις καιροῖς
  choice: మున్ముందు కాలాల్లో
  rationale: రచయిత కాలానికి తరువాత వచ్చే కాలాలను సూచిస్తుంది; తప్పనిసరిగా అంత్యకాలం మాత్రమే అని సంకుచితం చేయదు.
- source_word: ἀποστήσονταί τινες τῆς πίστεως
  choice: కొందరు ... విశ్వాసం నుంచి తొలగిపోతారు
  rationale: ἀφίσταμαι లోని దూరమవడం లేదా విడిచిపెట్టడం అనే భావాన్ని సిద్ధాంతపరంగా మరీ నిర్వచించకుండా నిలుపుతుంది. సందర్భంలో ‘విశ్వాసం’ క్రైస్తవ విశ్వాస విషయాన్ని ప్రధానంగా సూచించినా, తెలుగు పదం మూలంలోని కొంత అర్థవిస్తృతిని కాపాడుతుంది.
- source_word: προσέχοντες
  choice: వైపు ... మనసు పెట్టి
  rationale: కేవలం వినడమే కాక వాటిని పట్టించుకొని అనుసరించే వైఖరిని సహజమైన తెలుగులో తెలియజేస్తుంది; ఈ క్రియ వారి తొలగిపోవడానికి సంబంధించిన విధానాన్ని సూచిస్తుంది.
- source_word: πνεύμασι πλάνοις
  choice: మోసకరమైన ఆత్మలు
  rationale: πλάνος లోని తప్పుదారి పట్టించే లేదా మోసపూరిత గుణాన్ని విశేషణ రూపంలో నిలుపుతుంది; క్రియాశీల భావం గల ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: διδασκαλίαις δαιμονίων
  choice: దయ్యాల బోధలు
  rationale: ఈ బోధలు దయ్యాల నుంచి ఉద్భవించినవి లేదా వాటితో సంబంధం గలవి అనే మూలంలోని జనిటివ్ సంబంధాన్ని సంక్షిప్తంగా, పారదర్శకంగా ఉంచుతుంది.
theological_decisions:
- issue: ‘ఆత్మ’ ఎవరిని సూచిస్తుంది?
  choice: పరిశుద్ధాత్మ
  alternative: ప్రవచనాత్మ లేదా మానవ ఆత్మ
  rationale: లేఖా సందర్భంలో ప్రవచనాత్మకంగా మాట్లాడే ‘ఆత్మ’ పరిశుద్ధాత్మను సూచించడం అత్యంత సహజం. అయితే మూలంలో లేని ‘పరిశుద్ధ’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు; ఆయన ఎలా వెల్లడించాడో కూడా నిర్దిష్టం చేయలేదు.
- issue: τῆς πίστεως యొక్క భావం
  choice: విశ్వాస విషయసారం లేదా క్రైస్తవ విశ్వాసం
  alternative: వ్యక్తిగత నమ్మకం లేదా నమ్మకత్వం
  rationale: నిర్దిష్ట ఉపపదం మరియు తప్పుడు బోధల సందర్భం కలిపి విశ్వాస విషయసారాన్ని ప్రధానంగా సూచిస్తాయి. అయినా, ఏ ప్రత్యేక సంప్రదాయపు మతభ్రష్టత సిద్ధాంతాన్నీ వాక్యంలోకి దిగుమతి చేయలేదు.
- issue: δαιμονίων జనిటివ్ సంబంధం
  choice: దయ్యాల నుంచి వచ్చే లేదా వాటికి సంబంధించిన బోధలు
  alternative: దయ్యాల గురించి బోధలు
  rationale: సందర్భంలో మూలం లేదా అనుబంధం అనే భావమే బలంగా ఉంది; కేవలం దయ్యాలను అంశంగా చేసుకున్న బోధలు అనే అర్థం తక్కువ సహజం. ‘దయ్యాల బోధలు’ అనే రూపం సంబంధాన్ని కొంత తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. గ్రీకు వాక్యంలోని ప్రధాన ప్రకటనను తెలుగులో సహజంగా చేయడానికి ‘చెబుతున్నదేమిటంటే’ నిర్మాణం వాడబడింది. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల వెంట ఉంచాం.
