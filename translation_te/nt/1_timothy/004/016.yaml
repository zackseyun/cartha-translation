id: 1TI.4.16
reference: 1 Timothy 4:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ· ἐπίμενε αὐτοῖς· τοῦτο γὰρ ποιῶν καὶ σεαυτὸν σώσεις καὶ τοὺς ἀκούοντάς σου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/016.yaml
  text: Pay close attention to yourself and to the teaching[a]; persist in these things[b]. For by doing this you will save both yourself and those who listen to you.
translation:
  language: te
  text: నిన్ను నీవు, బోధను జాగ్రత్తగా గమనించు. ఈ విషయాల్లో పట్టుదలగా కొనసాగు[a]. ఇలా చేయడం ద్వారా నిన్ను నీవూ, నిన్ను వినేవారినీ రక్షిస్తావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వీటిలో కొనసాగు’ లేదా ‘వీటిలో నిలకడగా ఉండు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘కాపాడుతావు’; గ్రీకు పదం సందర్భాన్ని బట్టి రక్షించడం, కాపాడడం లేదా రక్షణ పొందేలా చేయడం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεχε
  choice: జాగ్రత్త వహించు
  rationale: ఈ ఆజ్ఞ క్షణికంగా గమనించడాన్ని కాక, నిరంతరం శ్రద్ధగా కాపుకాయడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘జాగ్రత్త వహించు’ సహజంగా ఉండి ఆ నిరంతర అప్రమత్తతను తెలియజేస్తుంది.
- source_word: σεαυτῷ
  choice: నీ విషయంలోనూ
  rationale: దత్తివిభక్తిలోని ఆత్మవాచక సర్వనామం శ్రద్ధకు గురయ్యే వ్యక్తిని సూచిస్తుంది. మూలంలోని ‘నిన్ను నీవు’ అనే భావాన్ని అనవసరంగా ‘నీ జీవితం’ అని విస్తరించకుండా ఈ రూపం నిలుపుతుంది.
- source_word: τῇ διδασκαλίᾳ
  choice: బోధ విషయంలోనూ
  rationale: διδασκαλία బోధించే క్రియను లేదా బోధలోని విషయాన్ని సూచించగలదు. ‘బోధ’ ఈ రెండింటికీ తగినంత విస్తృతంగా ఉండి, ‘సిద్ధాంతం’ కంటే సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: ἐπίμενε
  choice: పట్టుదలగా కొనసాగు
  rationale: ఈ ఆజ్ఞ స్థిరంగా, శ్రమతో కొనసాగడాన్ని సూచిస్తుంది. ‘పట్టుదలగా కొనసాగు’ దాని నిరంతరతనూ దృఢతనూ సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: αὐτοῖς
  choice: ఈ విషయాల్లో
  rationale: నపుంసక బహువచన సర్వనామం ముందున్న శ్రద్ధకు సంబంధించిన విషయాలన్నిటినీ సమష్టిగా తిరిగి సూచిస్తుంది. ‘ఈ విషయాల్లో’ తెలుగులో దాని సూచనను స్పష్టంగా చేస్తుంది.
- source_word: τοῦτο γὰρ ποιῶν
  choice: ఇలా చేయడం ద్వారా
  rationale: వర్తమాన కృదంత నిర్మాణం సాధనాన్ని లేదా దానితో కూడిన చర్యను సూచిస్తుంది. ‘ఇలా చేయడం ద్వారా’ ఆ సాధనార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: σώσεις
  choice: రక్షిస్తావు
  rationale: σῴζω యొక్క ప్రధానమైన ‘రక్షించు’ భావాన్ని నిలుపుతుంది; దానిని కేవలం తాత్కాలిక భద్రతకు లేదా ప్రత్యేకంగా అంతిమ రక్షణకు మాత్రమే పరిమితం చేయదు.
- source_word: τοὺς ἀκούοντάς σου
  choice: నీ మాట వినేవారిని
  rationale: వర్తమాన కృదంతం తిమోతి బోధను వింటూ ఉండేవారిని సూచిస్తుంది. ‘నీ మాట వినేవారు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ కొనసాగుతున్న వినికిడిని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: కాపరి సేవకు ఇచ్చిన హెచ్చరికలో ‘రక్షిస్తావు’ అనే మాట యొక్క పరిధి
  choice: ప్రధాన పాఠంలో ‘రక్షిస్తావు’ అని ఉంచి, దానిని అంతిమ రక్షణకు మాత్రమే గానీ కేవలం సంరక్షణకు మాత్రమే గానీ పరిమితం చేయలేదు.
  alternative: ‘కాపాడుకుంటావు/కాపాడుతావు’ అని అనువదించి ఆచరణాత్మక లేదా ఆధ్యాత్మిక సంరక్షణను ముందుకు తేవడం.
  rationale: ఈ వాక్యం తిమోతి తన విషయంలోనూ బోధ విషయంలోనూ నిలకడగా ఉండటాన్ని అతనికీ అతని శ్రోతలకీ కలిగే రక్షణతో అనుసంధానిస్తుంది. ఇది స్వయంకృషితో సంపాదించే రక్షణ అని పాఠం చెప్పదు; అదే సమయంలో σώσεις యొక్క బలమైన రక్షణార్థాన్ని తగ్గించకూడదు. అందువల్ల మూలంలోని దైవశాస్త్రీయ ఉద్వేగాన్ని అలాగే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ఏకవచన ఆజ్ఞారూపాన్ని వాడాం. మూలంలోని ‘నీ విషయంలోనూ, బోధ విషయంలోనూ’ అనే సమాంతర నిర్మాణాన్ని నిలిపి, ‘నీ జీవితం’ వంటి వివరణాత్మక విస్తరణను చేర్చలేదు. సంప్రదింపుకు ఇచ్చిన ఆంగ్ల పాఠంలో పాదసూచిక గుర్తులు వాటి విషయాలతో సరిపోలనందున, మూలపాఠం ప్రకారం [a]ను ἐπίμενε దగ్గర, [b]ను σώσεις దగ్గర ఉంచాం.
