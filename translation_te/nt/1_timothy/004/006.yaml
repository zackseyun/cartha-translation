- from: ఈ విషయాలను సహోదరుల[a] ముందు ఉంచుతూ, విశ్వాసపు మాటలతో[c], నీవు అనుసరించిన మంచి బోధతో పోషించబడుతూ ఉంటే, మెస్సీయ అయిన యేసుకు[b] మంచి సేవకుడవై ఉంటావు.
