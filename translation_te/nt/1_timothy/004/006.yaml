id: 1TI.4.6
reference: 1 Timothy 4:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ταῦτα ὑποτιθέμενος τοῖς ἀδελφοῖς καλὸς ἔσῃ διάκονος ⸂Χριστοῦ Ἰησοῦ⸃, ἐντρεφόμενος τοῖς λόγοις τῆς πίστεως καὶ τῆς καλῆς διδασκαλίας ᾗ παρηκολούθηκας,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/006.yaml
  text: By putting these things before the brothers[a], you will be a good servant of Messiah Jesus[c][b], being nourished by the words of the faith and of the good teaching that you have followed.
translation:
  language: te
  text: ఈ విషయాలను సహోదరుల[a] ఎదుట ఉంచి, విశ్వాసపు మాటలలో[c] మరియు నీవు అనుసరించిన మంచి బోధలో పోషణ పొందుతూ, నీవు మెస్సీయ యేసుకు[b] మంచి సేవకుడవుతావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సహోదరులు’ అనే మాట సందర్భానుసారం స్త్రీలతో సహా తోటి విశ్వాసులందరినీ సూచించవచ్చు.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘క్రీస్తు యేసుకు.’ గ్రీకు Χριστός అనే బిరుదుకు ‘మెస్సీయ’ అని అర్థం.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘విశ్వాసపు మాటల ద్వారా.’ ఇక్కడ ‘విశ్వాసం’ అనేది విశ్వాసులు అంగీకరించిన బోధ విషయసారాన్ని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: ఈ విషయాలను
  rationale: ముందు చెప్పిన హెచ్చరికలు, ఉపదేశాలను సూచించే నపుంసక బహువచన సర్వనామం; తెలుగు బహువచన సూచనను నిలుపుతుంది.
- source_word: ὑποτιθέμενος
  choice: ముందు ఉంచుతూ
  rationale: సమాజం ఎదుట విషయాలను ఉంచడం లేదా వారికి గుర్తుచేయడం అనే రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τοῖς ἀδελφοῖς
  choice: సహోదరుల
  rationale: గ్రీకు పదంలోని పుంలింగ బహువచన రూపాన్ని నిలుపుతూ, సందర్భంలో తోటి విశ్వాసులనే సూచించే అవకాశం గమనికలో వివరించబడింది.
- source_word: διάκονος
  choice: సేవకుడు
  rationale: ఇక్కడ అధికారిక సంఘపదవికన్నా యేసుకు సేవచేసే వ్యక్తి అనే కార్యాత్మక భావమే ప్రధానంగా ఉంది.
- source_word: Χριστοῦ Ἰησοῦ
  choice: మెస్సీయ అయిన యేసుకు
  rationale: Χριστός అనే బిరుదులోని మెస్సీయ భావాన్ని స్పష్టంగా ఉంచుతూ, తెలుగు వాక్య నిర్మాణానికి సహజంగా ‘అయిన’ చేర్చబడింది.
- source_word: ἐντρεφόμενος
  choice: పోషించబడుతూ ఉంటే
  rationale: విశ్వాసపు మాటలు, మంచి బోధ తిమోతిని నిరంతరం పోషిస్తున్నాయనే మధ్యమ/కర్మణి భావాన్ని నిలుపుతుంది.
- source_word: τοῖς λόγοις τῆς πίστεως
  choice: విశ్వాసపు మాటలతో
  rationale: λόγοις ను ‘మాటలు’గా ఉంచి, πίστις ను ‘విశ్వాసం’గా అనువదిస్తుంది; ఇది విశ్వాస విషయసారాన్ని సూచించే అవకాశాన్ని గమనికలో తెలుపుతుంది.
- source_word: τῆς καλῆς διδασκαλίας
  choice: మంచి బోధతో
  rationale: καλή లోని విలువనిర్ణయాన్ని ‘మంచి’గా, διδασκαλία ను సాధారణ ఆధునిక తెలుగు ‘బోధ’గా అందిస్తుంది.
- source_word: ᾗ παρηκολούθηκας
  choice: నీవు అనుసరించిన
  rationale: సంబంధ సర్వనామం సమీపంలోని ‘మంచి బోధ’ను సూచిస్తుంది; క్రియలోని శ్రద్ధగా వెంబడించడం, కట్టుబడి కొనసాగడం అనే విస్తృత భావాన్ని ‘అనుసరించిన’ నిలుపుతుంది.
theological_decisions:
- issue: Χριστός అనే బిరుదు
  choice: మెస్సీయ అయిన యేసు
  alternative: క్రీస్తు యేసు
  rationale: గ్రీకు బిరుదు యొక్క అర్థాన్ని ప్రధాన పాఠ్యంలో స్పష్టపరుస్తూ, సంప్రదాయ తెలుగు రూపాన్ని గమనికలో ఉంచింది.
- issue: τοῖς ἀδελφοῖς లో లింగం, పరిధి
  choice: సహోదరులు
  alternative: సహోదర సహోదరీలు / తోటి విశ్వాసులు
  rationale: గ్రీకు పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపింది; సందర్భానుసారం మొత్తం విశ్వాస సమాజాన్ని కలుపుకొనే వాడుకను గమనికలో తెలిపింది.
- issue: τῆς πίστεως లో πίστις భావం
  choice: విశ్వాసపు
  alternative: విశ్వాసానికి సంబంధించిన / క్రైస్తవ విశ్వాస విషయసారానికి చెందిన
  rationale: ‘విశ్వాసం’ అనే మూల భావాన్ని ఉంచి, ఇక్కడ గుర్తింపుపొందిన విశ్వాస విషయసారాన్ని సూచించే సంభావ్యతను గమనికలో వివరించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘ముందు ఉంచుతూ’ అనే మూల రూపకం, ‘పోషించబడుతూ’ అనే నిరంతర రూపక భావం నిలుపబడ్డాయి; అధికారిక సంఘపదవిని అనవసరంగా సూచించకుండా διάκονος కు ‘సేవకుడు’ వాడబడింది.
