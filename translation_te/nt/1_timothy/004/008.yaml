id: 1TI.4.8
reference: 1 Timothy 4:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ γὰρ σωματικὴ γυμνασία πρὸς ὀλίγον ἐστὶν ὠφέλιμος, ἡ δὲ εὐσέβεια πρὸς πάντα ὠφέλιμός ἐστιν, ἐπαγγελίαν ἔχουσα ζωῆς τῆς νῦν καὶ τῆς μελλούσης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/008.yaml
  text: For bodily training is beneficial for a little while[a], but godliness is beneficial for all things[c][b], since it holds promise for the present life and the coming one.
translation:
  language: te
  text: శారీరక సాధన కొంతవరకే ప్రయోజనకరంగా ఉంటుంది[a]; అయితే దైవభక్తి అన్నిటికీ ప్రయోజనకరంగా ఉంటుంది, ఎందుకంటే అది ప్రస్తుత జీవితానికీ రాబోయే జీవితానికీ వాగ్దానాన్ని కలిగి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కొద్దికాలం మాత్రమే.’ గ్రీకు పదబంధం పరిమిత పరిమాణాన్ని గానీ పరిమిత కాలాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: σωματικὴ γυμνασία
  choice: శారీరక సాధన
  rationale: γυμνασίαలోని శిక్షణ లేదా క్రమబద్ధమైన అభ్యాస భావాన్ని ‘సాధన’ సహజంగా తెలియజేస్తుంది; σωματική యొక్క శరీరసంబంధ భావాన్ని ‘శారీరక’ నిలుపుతుంది.
- source_word: πρὸς ὀλίγον
  choice: కొంతవరకే
  rationale: ఈ గ్రీకు పదబంధం స్వల్ప పరిమాణాన్ని లేదా స్వల్ప కాలాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో పరిమిత ప్రయోజనం అనే భావాన్ని సహజంగా ఇచ్చి, కాలార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: ὠφέλιμος
  choice: ప్రయోజనకరంగా
  rationale: రెండు ఉపవాక్యాల్లోనూ ఒకే పదాన్ని వాడటం ద్వారా గ్రీకులోని ప్రత్యక్ష పోలికను నిలుపుతుంది; ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: εὐσέβεια
  choice: దైవభక్తి
  rationale: దేవునిపట్ల భయభక్తులతో కూడిన, దేవుని వైపు మళ్లిన జీవన ధోరణిని సూచిస్తుంది; కేవలం ఆచారపరమైన భక్తి అనే సంకుచిత భావాన్ని నివారిస్తుంది.
- source_word: πρὸς πάντα
  choice: అన్నిటికీ
  rationale: గ్రీకు పదబంధంలోని సమగ్ర విస్తృతిని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ἐπαγγελίαν ἔχουσα
  choice: వాగ్దానాన్ని కలిగి ఉంది
  rationale: కృదంత పదబంధాన్ని సహజ తెలుగు వాక్యంగా మార్చి, దైవభక్తి ప్రయోజనకరంగా ఉండటానికి ఇచ్చిన ఆధారాన్ని నిలుపుతుంది.
- source_word: ζωῆς τῆς νῦν καὶ τῆς μελλούσης
  choice: ప్రస్తుత జీవితం గురించిన వాగ్దానాన్నీ, రాబోయే జీవితం గురించిన వాగ్దానాన్నీ
  rationale: రెండవ భాగంలో గ్రీకులో అధ్యాహారంగా ఉన్న ζωήని తెలుగులో స్పష్టపరుస్తూ, ప్రస్తుత మరియు రాబోయే జీవితాల మధ్య సమాంతరతను నిలుపుతుంది.
theological_decisions:
- issue: శారీరక సాధన ప్రయోజనపు పరిధి
  choice: శారీరక సాధనకు పరిమిత ప్రయోజనం ఉంది
  alternative: శారీరక సాధన కొద్దికాలం మాత్రమే ప్రయోజనకరం
  rationale: ఈ వాక్యం శారీరక సాధనను వ్యర్థమని లేదా చెడ్డదని చెప్పదు; దాని పరిమిత ప్రయోజనాన్ని దైవభక్తి యొక్క సమగ్ర ప్రయోజనంతో పోలుస్తుంది. πρὸς ὀλίγονలోని కాలం/పరిమాణం సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
- issue: జీవితం గురించిన వాగ్దానం
  choice: వాగ్దానం ప్రస్తుత జీవితానికీ రాబోయే జీవితానికీ సంబంధించినదిగా అనువదించడం
  alternative: దైవభక్తే ప్రస్తుత మరియు రాబోయే జీవితాలను వాగ్దానం చేస్తుందని భావింపజేయడం
  rationale: ἐπαγγελίαν ἔχουσα అనే మాటను దగ్గరగా అనుసరిస్తూ, వాగ్దానానికి దేవుడే అంతిమ మూలమనే విషయాన్ని వాక్యంలో అదనంగా చేర్చలేదు; గ్రీకు వాక్యంలోని సంబంధాన్ని మాత్రమే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘దైవభక్తి’ని పత్రికలోని ముఖ్య భావపదంగా నిలిపాం. గ్రీకులోని రెండు ప్రధాన ఉపవాక్యాల సమాంతర నిర్మాణం తెలుగులోనూ కనిపించేలా ‘ప్రయోజనకరంగా ఉంటుంది’ అనే పదబంధాన్ని పునరావృతం చేశాం.
