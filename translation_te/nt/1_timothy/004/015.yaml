  text: Practice these things; be in them[a], so that your progress may be evident to all.
translation:
  language: te
  text: నీ పురోగతి అందరికీ స్పష్టంగా కనిపించేలా, వీటిని అభ్యసించు; వీటిలో నిమగ్నమై ఉండు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘వీటిలో ఉండు’; ఈ మాట వాటిలో పూర్తిగా నిమగ్నమై ఉండడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: వీటిని
  rationale: ముందటి వచనాల్లో పౌలు ఇచ్చిన ఉపదేశాలు, బాధ్యతలను సూచించే బహువచన సర్వనామం.
- source_word: μελέτα
  choice: అభ్యసించు
  rationale: ఆలోచనతోపాటు నిరంతర ఆచరణను సూచిస్తుంది; ఈ సందర్భంలో తిమోతికి అప్పగించిన బాధ్యతలను శ్రద్ధగా సాధన చేయడం భావం.
- source_word: ἐν τούτοις ἴσθι
  choice: వీటిలోనే నిమగ్నమై ఉండు
  rationale: అక్షరార్థంగా ‘వీటిలో ఉండు’; తెలుగులో సహజంగా ఉండేలా, ఆ పనుల్లో సంపూర్ణంగా పాలుపంచుకోవడాన్ని ‘నిమగ్నమై ఉండు’ తెలియజేస్తుంది. ‘నే’ లోతైన నిమగ్నతను బలపరుస్తుంది.
- source_word: ἵνα
  choice: అప్పుడు
  rationale: గ్రీకు నిర్మాణంలోని ఉద్దేశం లేదా ఫలిత సంబంధాన్ని సహజమైన తెలుగు వాక్యసంధిగా వ్యక్తపరుస్తుంది.
- source_word: σου ἡ προκοπή
  choice: నీ అభివృద్ధి
  rationale: తిమోతి బోధ, ప్రవర్తన, పరిచర్యలో కనిపించే విస్తృతమైన పురోగతిని ఒకే రంగానికి పరిమితం చేయకుండా సూచిస్తుంది.
- source_word: φανερὰ ᾖ πᾶσιν
  choice: అందరికీ స్పష్టంగా కనిపిస్తుంది
  rationale: అభివృద్ధి బహిరంగంగా అందరికీ గ్రాహ్యమవ్వాలనే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: తిమోతి అభివృద్ధి పరిధి
  choice: బోధ, ప్రవర్తన, పరిచర్య మొదలైన ముందుగా చెప్పిన బాధ్యతల్లో కనిపించే విస్తృత అభివృద్ధి
  alternative: కేవలం ఆధ్యాత్మిక ఎదుగుదల లేదా కేవలం పరిచర్య నైపుణ్యం
  rationale: προκοπή అనే పదమూ పరిసర సందర్భమూ ఒకే కోణానికి పరిమితం చేయవు; అందువల్ల ‘అభివృద్ధి’ అనే విస్తృత పదాన్ని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని సంక్షిప్త ఆజ్ఞలను నిలుపుతూ, గ్రీకు నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తపరిచాం.
