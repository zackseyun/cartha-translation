  source_fidelity: The draft accurately represents the Greek purpose phrase, strenuous labor, passive experience of reproach, settled hope in the living God, and the unqualified scope and particular emphasis of “Savior of all people, especially of believers.” A small revision improves the Telugu expression of the perfect ἠλπίκαμεν and the naturalness of the connected clauses without resolving the interpretive tension.
