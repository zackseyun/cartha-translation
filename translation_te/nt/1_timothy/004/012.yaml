review_pass:
  verdict: revise
  source_fidelity: The verse’s prohibitive exhortation, contrast, recipient group, and fivefold virtue list are represented accurately. However, “పవిత్రత” can primarily suggest holiness/sacredness, whereas ἁγνεία denotes moral purity (with possible sexual-purity nuance); “శుద్ధత” better preserves the source term’s sense without narrowing it.
  naturalness: The Telugu is modern, fluent, and appropriately exhortative. “ఎవరూ నిన్ను చిన్నచూపు చూడనివ్వకు” is idiomatic in direct address, and the repeated “-లో” structure clearly reflects the Greek list.
  terminology: “విశ్వాసం,” with the alternative “నమ్మకత్వం” footnoted, appropriately preserves the contextual breadth of πίστις. “మాదిరిగా ఉండు” and “విశ్వాసులకు” are suitable renderings of τύπος γίνου τῶν πιστῶν. Revising “పవిత్రత” to “శుద్ధత” distinguishes ἁγνεία from terms more directly denoting holiness.
  issues:
  - severity: medium
    issue: ἁγνείᾳ is rendered “పవిత్రతలో.”
    rationale: “పవిత్రత” often conveys holiness or sanctity in Telugu, while ἁγνεία here denotes purity, particularly ethical/moral purity. “శుద్ధతలో” is broader and closer to the lexical sense, without making the sexual dimension explicit in the main text.
  revised_text: నీ యౌవనాన్ని బట్టి ఎవరూ నిన్ను చిన్నచూపు చూడనివ్వకు. అయితే మాటలో, ప్రవర్తనలో, ప్రేమలో, విశ్వాసంలో[a], శుద్ధతలో విశ్వాసులకు మాదిరిగా ఉండు.
