revisions:
- from: నీ యౌవనాన్ని బట్టి ఎవరూ నిన్ను చిన్నచూపు చూడనివ్వకు. అయితే మాటలో, ప్రవర్తనలో, ప్రేమలో, విశ్వాసంలో[a], పవిత్రతలో విశ్వాసులకు మాదిరిగా ఉండు.
  to: నీ యౌవనాన్ని బట్టి ఎవరూ నిన్ను చిన్నచూపు చూడనివ్వకు. అయితే మాటలో, ప్రవర్తనలో, ప్రేమలో, విశ్వాసంలో[a], శుద్ధతలో విశ్వాసులకు మాదిరిగా ఉండు.
