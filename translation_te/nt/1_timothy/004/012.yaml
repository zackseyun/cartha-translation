id: 1TI.4.12
reference: 1 Timothy 4:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μηδείς σου τῆς νεότητος καταφρονείτω, ἀλλὰ τύπος γίνου τῶν πιστῶν ἐν λόγῳ, ἐν ἀναστροφῇ, ἐν ⸀ἀγάπῃ, ἐν πίστει, ἐν ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/012.yaml
  text: Let no one look down on your youth[a], but be an example for the believers in speech, in conduct, in love, in faith, in purity.
translation:
  language: te
  text: నీ యౌవనాన్ని బట్టి ఎవరూ నిన్ను చిన్నచూపు చూడనివ్వకు. అయితే మాటలో, ప్రవర్తనలో, ప్రేమలో, విశ్వాసంలో[a], శుద్ధతలో విశ్వాసులకు మాదిరిగా ఉండు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నమ్మకత్వంలో.” ఇక్కడి గ్రీకు పదం విశ్వాసాన్ని లేదా నమ్మకంగా ఉండే గుణాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: μηδείς ... καταφρονείτω
  choice: ఎవరూ ... చిన్నచూపు చూడనివ్వకు
  rationale: గ్రీకు మూడవ పురుష ఆజ్ఞార్థక నిషేధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, καταφρονέωలోని తక్కువగా చూడటం లేదా తృణీకరించడం అనే సామాజిక భావాన్ని నిలుపుతుంది.
- source_word: σου τῆς νεότητος
  choice: నీ యౌవనాన్ని బట్టి
  rationale: νεότης అంటే యౌవనం లేదా చిన్న వయస్సు. సందర్భంలో తిమోతిని అతని యౌవనం కారణంగా చిన్నచూపు చూడటాన్ని ఈ రూపం సహజంగా తెలియజేస్తుంది.
- source_word: ἀλλὰ
  choice: అయితే
  rationale: మొదటి నిషేధానికి తరువాతి సానుకూల ఆజ్ఞను వ్యతిరేకంగా అనుసంధానిస్తుంది; తెలుగులో జాబితి ప్రవాహాన్ని సహజంగా ఉంచుతుంది.
- source_word: τύπος γίνου
  choice: మాదిరిగా ఉండు
  rationale: τύπος ఇక్కడ ఇతరులు అనుసరించదగిన ఆదర్శ నమూనాను సూచిస్తుంది; γίνουతో కలిపి ఇది స్పష్టమైన, సహజమైన ప్రబోధంగా ఉంటుంది.
- source_word: τῶν πιστῶν
  choice: విశ్వాసులకు
  rationale: జనిటివ్ ఇక్కడ తిమోతి ఎవరికి మాదిరిగా ఉండాలో సూచిస్తుంది. 'విశ్వాసులకు' అనేది ఆ సంబంధాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐν λόγῳ
  choice: మాటలో
  rationale: λόγος ఈ సద్గుణాల జాబితిలో మాట్లాడే తీరు లేదా పలుకులను సూచిస్తుంది; 'మాటలో' సాధారణ ఆధునిక తెలుగు.
- source_word: ἐν ἀναστροφῇ
  choice: ప్రవర్తనలో
  rationale: ἀναστροφή జీవన నడవడి లేదా ప్రవర్తనను సూచిస్తుంది; ఈ జాబితికి 'ప్రవర్తనలో' స్పష్టంగా సరిపోతుంది.
- source_word: ἐν ἀγάπῃ
  choice: ప్రేమలో
  rationale: ἀγάπηకు సహజమైన మరియు విస్తృతమైన తెలుగు సమానార్థకం 'ప్రేమ'; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- source_word: ἐν πίστει
  choice: విశ్వాసంలో
  rationale: πίστιςకు ప్రాథమికంగా 'విశ్వాసం' అని ఇచ్చి, దేవునిపై నమ్మకం అనే భావాన్ని నిలుపుతుంది; ఈ సందర్భంలో సాధ్యమైన 'నమ్మకత్వం' అనే గుణార్థాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: ἐν ἁγνείᾳ
  choice: పవిత్రతలో
  rationale: ἁγνεία నైతిక స్వచ్ఛతను, ఈ సందర్భంలో లైంగిక స్వచ్ఛతను కూడా సూచించవచ్చు. 'పవిత్రత' విస్తృత భావాన్ని నిలిపి, అనవసరంగా అర్థాన్ని సంకుచితం చేయదు.
theological_decisions:
- issue: సద్గుణాల జాబితిలో πίστις అర్థం
  choice: విశ్వాసం
  alternative: నమ్మకత్వం
  rationale: ఈ సందర్భంలో πίστις దేవునిపై విశ్వాసాన్నిగానీ వ్యక్తిగత నమ్మకత్వాన్నిగానీ సూచించవచ్చు. ప్రధాన పాఠంలో సాధారణ అనువాదమైన 'విశ్వాసం' ఉంచి, నిజమైన పదార్థ సందిగ్ధతను పాదటిప్పణిలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ప్రబోధ శైలిని ఉపయోగించాం. మూలంలోని ఐదు ἐν పదబంధాల సమాంతర నిర్మాణాన్ని '-లో' రూపాలతో నిలిపాం.
