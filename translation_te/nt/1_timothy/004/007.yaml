id: 1TI.4.7
reference: 1 Timothy 4:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοὺς δὲ βεβήλους καὶ γραώδεις μύθους παραιτοῦ. γύμναζε δὲ σεαυτὸν πρὸς εὐσέβειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/007.yaml
  text: But reject profane and old-womanish myths[a], and train yourself for godliness.
translation:
  language: te
  text: కానీ అపవిత్రమైన, ముసలమ్మల కథలవంటి కల్పిత కథలను[a] తిరస్కరించు; దైవభక్తి కోసం నిన్ను నీవు తీర్చిదిద్దుకో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ముసలి స్త్రీలకు లక్షణమైన కల్పిత కథలు.’ ఇది తక్కువచేసే భావం గల గ్రీకు వ్యక్తీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβήλους
  choice: అపవిత్రమైన
  rationale: పవిత్రమైనదానికి విరుద్ధంగా, సామాన్యమైన లేదా భక్తిహీనమైన స్వభావాన్ని ఈ పదం సూచిస్తుంది; ‘అపవిత్రమైన’ అనే పదం ఆ పవిత్ర–అపవిత్ర వ్యత్యాసాన్ని సహజంగా నిలుపుతుంది.
- source_word: γραώδεις
  choice: ముసలమ్మల కథల్లాంటి
  rationale: ఈ విశేషణం అక్షరార్థంగా ‘ముసలి స్త్రీలకు తగిన/వారికి లక్షణమైన’ అనే తక్కువచేసే భావం కలిగి ఉంది. తెలుగులో అక్షరానువాదపు కృత్రిమతను తగ్గిస్తూ ఆ ప్రత్యేక చిత్రణను నిలుపుతుంది.
- source_word: μύθους
  choice: కల్పిత కథలను
  rationale: ఇక్కడ ఈ పదం కల్పించబడిన లేదా ఆధారంలేని కథలను సూచిస్తుంది. ఆధునిక తెలుగులో ‘కల్పిత కథలు’ అర్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: παραιτοῦ
  choice: తిరస్కరించు
  rationale: మధ్యమవాచక ఆజ్ఞారూపం వాటిని అంగీకరించకుండా నిరాకరించమనే బలమైన సూచన ఇస్తుంది; ‘తిరస్కరించు’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: γύμναζε
  choice: శిక్షణ ఇచ్చుకో
  rationale: ఈ క్రియలో వ్యాయామ లేదా క్రీడా శిక్షణ రూపకం ఉంది. ‘శిక్షణ ఇచ్చుకో’ ఆ రూపకాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: σεαυτόν
  choice: నీకు నీవే
  rationale: తిమోతే తననే శిక్షణకు గురిచేసుకోవాలని సూచించే ఆత్మవాచక సర్వనామ బలాన్ని ఇది స్పష్టంగా నిలుపుతుంది.
- source_word: πρὸς εὐσέβειαν
  choice: దైవభక్తి కోసం
  rationale: πρός ఇక్కడ లక్ష్యాన్ని సూచిస్తుంది; εὐσέβεια దేవునిపట్ల భక్తి, గౌరవం ప్రతిఫలించే జీవనాన్ని సూచిస్తుంది. ‘దైవభక్తి కోసం’ లక్ష్యార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δὲ ... δὲ
  choice: అయితే ... ;
  rationale: మొదటి δέ ముందరి సందర్భంతో వ్యత్యాసాన్ని చూపుతుంది. రెండవది ప్రతికూల ఆజ్ఞకు సానుకూల ప్రత్యామ్నాయాన్ని జతచేస్తుంది; తెలుగులో అర్ధవిరామంతో ఈ మలుపు సహజంగా వ్యక్తమవుతుంది.
theological_decisions:
- issue: γραώδεις μύθους అనే తక్కువచేసే పదబంధం అనువాదం
  choice: ‘ముసలమ్మల కథల్లాంటి కల్పిత కథలు’ అని ప్రధాన పాఠ్యంలో ప్రత్యేక సాంస్కృతిక చిత్రణను నిలుపడం
  alternative: ‘ముసలమ్మల కథలు’ లేదా ‘వెర్రి కథలు’
  rationale: ‘వెర్రి కథలు’ అనడం మూలంలోని ముసలి స్త్రీలతో ముడిపడిన ప్రత్యేకమైన, తక్కువచేసే చిత్రణను తొలగిస్తుంది. ‘ముసలమ్మల కథలు’ అనడం అవే కథకులని నిర్దిష్టంగా చెప్పినట్టు వినిపించవచ్చు. ‘కథల్లాంటి’ అనేది గ్రీకు విశేషణ సంబంధాన్ని కొంత సహజంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆజ్ఞారూపం ఏకవచనంలో ఉంచబడింది. మూలంలోని కఠినమైన సాంస్కృతిక వ్యక్తీకరణను మృదువుచేయకుండా, తెలుగులో అర్థమయ్యేలా ‘ముసలమ్మల కథల్లాంటి’ అని ఇచ్చి వివరణను పాదసూచికలో ఉంచాం.
