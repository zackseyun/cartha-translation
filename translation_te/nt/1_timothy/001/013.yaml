  text: formerly a blasphemer and a persecutor and a violent man[a]; but I was shown mercy, because I acted ignorantly in unbelief[d][c][b],
translation:
  language: te
  text: గతంలో నేను దేవదూషకుడిని, హింసించేవాడిని, దౌర్జన్యంగా ప్రవర్తించేవాడిని[a]. అయినా నేను అవిశ్వాసంలో తెలియకనే చేశాను గనుక నాకు కనికరం చూపబడింది[b][c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అవమానిస్తూ హింసించేవాడిని” లేదా “క్రూరంగా ప్రవర్తించేవాడిని.” గ్రీకు పదం కేవలం గర్వాన్ని కాక, అవమానకరమైన హద్దుమీరిన హింసాత్మక ప్రవర్తనను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నేను కనికరం పొందాను.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “అజ్ఞానంతో” లేదా “తెలియనివాడిగా ఉండి.”
    reason: lexical_alternative
  - marker: d
    text: లేదా “విశ్వాసరాహిత్యంలో.” ఇక్కడ ఉద్దేశం ఒడంబడిక పట్ల నమ్మకద్రోహం కంటే విశ్వాసం లేకపోవడమే కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πρότερον ὄντα
  choice: గతంలో నేను
  rationale: మునుపటి స్థితిని సూచించే కాలభావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; కృదంతాన్ని కృత్రిమంగా అనుకరించదు.
- source_word: βλάσφημον
  choice: దేవదూషకుణ్ణి
  rationale: వ్యక్తిని వర్ణించే నామవాచక ప్రయోగాన్ని నేరుగా, స్పష్టంగా అందిస్తుంది.
- source_word: διώκτην
  choice: హింసించేవాణ్ణి
  rationale: పౌలు సంఘాన్ని వెంటాడి హింసించిన పూర్వ ప్రవర్తనను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ὑβριστήν
  choice: దౌర్జన్యంగా ప్రవర్తించేవాణ్ణి
  rationale: అవమానకరమైన, హద్దుమీరిన హింసాత్మక ప్రవర్తన అనే పదబలాన్ని కేవలం గర్వంగా కుదించకుండా అందిస్తుంది.
- source_word: ἠλεήθην
  choice: నాపై కనికరం చూపబడింది
  rationale: గ్రీకు కర్మణి రూపాన్ని నిలుపుతూ, పౌలు కనికరానికి పాత్రుడయ్యాడనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὅτι
  choice: గనుక
  rationale: ఇక్కడి కారణార్థక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἀγνοῶν ἐποίησα
  choice: తెలియక అలా చేశాను
  rationale: అజ్ఞాన స్థితిలోనే అతడు ఆ కార్యాలు చేశాడనే కృదంత సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది; 'అలా' మునుపటి ప్రవర్తనలను సూచిస్తుంది.
- source_word: ἐν ἀπιστίᾳ
  choice: అవిశ్వాసంలో
  rationale: ఈ సందర్భంలో ప్రధానంగా విశ్వాసం లేకపోవడాన్ని సూచిస్తుంది; ఉద్దేశపూర్వక ఒడంబడికా అవిశ్వాస్యతగా భావాన్ని ముందే నిర్ణయించదు.
theological_decisions:
- issue: ὅτι పరిచయం చేసే వాక్యభాగానికి కనికరంతో ఉన్న సంబంధం
  choice: తెలియక అవిశ్వాసంలో చేసినందువల్ల కనికరం చూపబడిందని కారణార్థకంగా అనువదించడం
  alternative: ఇది కనికరానికి కారణం కాక కేవలం దాని సందర్భాన్ని వివరిస్తుందని అనువదించడం
  rationale: ὅτι సహజంగా కారణాన్ని లేదా వివరణాత్మక ఆధారాన్ని సూచిస్తుంది. అయితే అజ్ఞానం కనికరాన్ని సంపాదించిందని పాఠ్యంలో చేర్చకుండా, మూలంలోని దైవశాస్త్రీయ ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే గంభీరతను నిలిపాం. మూలంలోని మూడు పూర్వ స్వభావవర్ణనల సమాంతరతను సాధ్యమైనంతవరకు కాపాడాం.
