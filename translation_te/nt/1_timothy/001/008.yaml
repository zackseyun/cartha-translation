id: 1TI.1.8
reference: 1 Timothy 1:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι καλὸς ὁ νόμος ἐάν τις αὐτῷ νομίμως χρῆται,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/008.yaml
  text: We know that the law is good[a], if one uses it lawfully,
translation:
  language: te
  text: అయితే ధర్మశాస్త్రాన్ని ఎవరైనా ధర్మశాస్త్రబద్ధంగా[a] ఉపయోగిస్తే, అది మంచిదని మనకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దాన్ని సరిగా ఉపయోగిస్తే” లేదా “దాన్ని సముచితంగా ఉపయోగిస్తే.”
    reason: νομίμως అనే పదానికి ‘ధర్మశాస్త్రబద్ధంగా’ అనే పదసంబంధ అనువాదంతో పాటు సందర్భానుసారంగా ‘సరిగా, సముచితంగా’ అనే భావాలు కూడా సాధ్యమైనవి.
lexical_decisions:
- source_word: Οἴδαμεν
  choice: మనకు తెలుసు
  rationale: οἶδα పరిపూర్ణ రూపంలో ఉన్నా వర్తమాన భావంతో స్థిరమైన జ్ఞానాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగులో ‘మనకు తెలుసు’ సహజంగా ఉంది.
- source_word: δὲ
  choice: అయితే
  rationale: δέ ఇక్కడ బలమైన వ్యతిరేకతకన్నా స్వల్ప సంధిని లేదా విషయ మలుపును సూచిస్తుంది; ‘అయితే’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὅτι
  choice: అని
  rationale: తెలిసిన విషయాన్ని పరిచయం చేసే ὅτιకి తెలుగు పరోక్ష వాక్య నిర్మాణంలో ‘అని’ సరైన సమానం.
- source_word: καλὸς
  choice: మంచిది
  rationale: ధర్మశాస్త్రపు సానుకూల గుణాన్ని విస్తృతంగా, అతివ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
- source_word: ὁ νόμος
  choice: ధర్మశాస్త్రం
  rationale: పౌలు సందర్భంలో νόμος గుర్తింపబడిన దైవిక ధర్మశాస్త్రాన్ని సూచిస్తుంది; ‘ధర్మశాస్త్రం’ ప్రామాణికమైన తెలుగు బైబిలు పదం, అయితే ప్రధాన వాక్యంలో దానిని మోషే ధర్మశాస్త్రమని మరింత సంకుచితం చేయదు.
- source_word: ἐάν τις
  choice: ఎవరైనా … ఉపయోగిస్తే
  rationale: గ్రీకు సాధారణ ఏకవచన షరతును తెలుగులో సహజంగా, లింగనిరపేక్షంగా ‘ఎవరైనా’ వ్యక్తపరుస్తుంది.
- source_word: αὐτῷ
  choice: ధర్మశాస్త్రాన్ని
  rationale: χράομαιతో వచ్చిన సర్వనామం νόμοςను తిరిగి సూచిస్తుంది; తెలుగులో అస్పష్టమైన ‘దాన్ని’ కంటే నామవాచకాన్ని పునరుక్తి చేయడం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: νομίμως
  choice: ధర్మశాస్త్రబద్ధంగా
  rationale: νομίμως యొక్క ‘నియమానికి అనుగుణంగా/సరైన విధంగా’ అనే భావంతో పాటు νόμοςతో ఉన్న పదబంధ సంబంధాన్ని కూడా సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: χρῆται
  choice: ఉపయోగిస్తే
  rationale: χράομαι అంటే ఉపయోగించడం లేదా వినియోగించడం; షరతు నిర్మాణంలో ‘ఉపయోగిస్తే’ సంక్షిప్తంగా, సహజంగా ఉంది.
theological_decisions:
- issue: ‘ధర్మశాస్త్రం’ యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘ధర్మశాస్త్రం’ అని మాత్రమే అనువదించబడింది.
  alternative: ‘మోషే ధర్మశాస్త్రం’ లేదా సాధారణంగా ‘చట్టం’
  rationale: సందర్భం ముఖ్యంగా మోషే ధర్మశాస్త్రాన్ని సూచించే అవకాశం ఉన్నప్పటికీ, గ్రీకు పాఠ్యం ὁ νόμος అని మాత్రమే చెబుతుంది. అందువల్ల పాఠ్యం చెప్పినదానికంటే సంకుచితమైన సిద్ధాంత నిర్ధారణను అనువాదంలో చేర్చలేదు.
- issue: νομίμως యొక్క భావం మరియు νόμοςతో పదప్రయోగం
  choice: ‘ధర్మశాస్త్రబద్ధంగా’
  alternative: ‘సరిగా’ లేదా ‘సముచితంగా’
  rationale: ‘సరిగా’ మరింత సామాన్యంగా వినిపించినా, ‘ధర్మశాస్త్రబద్ధంగా’ మూలంలోని νόμος—νομίμως పదసంబంధాన్ని మరియు ‘నియమానుసారంగా’ అనే భావాన్ని నిలుపుతుంది. ప్రత్యామ్నాయ సహజ భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు స్పష్టమైన శైలి. తెలుగు వాక్యప్రవాహం కోసం షరతు భాగాన్ని ముందుంచాం. మూలంలోని νόμος—νομίμως పదసంబంధాన్ని ‘ధర్మశాస్త్రం—ధర్మశాస్త్రబద్ధంగా’ ద్వారా నిలుపుతూ, సహజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
