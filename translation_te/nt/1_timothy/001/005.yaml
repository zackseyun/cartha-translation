lexical_decisions:
- source_word: τέλος
  choice: లక్ష్యం
  rationale: ఇక్కడ ముగింపు అనే భావం కంటే ఉపదేశం ఉద్దేశించే గమ్యం లేదా ప్రయోజనం అనే భావమే సందర్భానికి సరిపోతుంది.
- source_word: παραγγελίας
  choice: ఉపదేశం
  rationale: ఈ పదానికి ఆజ్ఞ, బాధ్యతగా అప్పగించిన నిర్దేశం అనే భావాలు ఉన్నా, 3–4 వచనాల్లోని బోధనా సందర్భంలో ‘ఉపదేశం’ సహజంగా ఉంటుంది.
- source_word: ἀγάπη
  choice: ప్రేమ
  rationale: మూలపదంలోని నైతిక, సంబంధాత్మక భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: ἐκ
  choice: నుండి పుట్టే
  rationale: ἐκ ఇక్కడ ప్రేమ ఉద్భవించే అంతర్గత మూలాన్ని సూచిస్తుంది; తెలుగులో మూడు అంశాలతో సంబంధం స్పష్టంగా ఉండేందుకు ‘నుండి పుట్టే’ అని ఇచ్చాం.
- source_word: καθαρᾶς καρδίας
  choice: పవిత్రమైన హృదయం
  rationale: నైతికంగా శుద్ధమైన అంతరంగం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: συνειδήσεως ἀγαθῆς
  choice: మంచి మనస్సాక్షి
  rationale: ἀγαθῆς అనే విశేషణాన్ని వ్యాఖ్యానాత్మకమైన ‘నిర్మలమైన’ కంటే నేరుగా ‘మంచి’ అని అనువదిస్తుంది.
- source_word: πίστεως
  choice: విశ్వాసం
  rationale: ఇక్కడ నిజమైన విశ్వాసం ప్రధాన భావంగా కనిపిస్తుంది; నమ్మకం లేదా విశ్వసనీయత అనే సాధ్యమైన భావాలను పాదసూచికలో ఉంచాం.
- source_word: ἀνυποκρίτου
  choice: కపటంలేని
  rationale: ‘వేషధారణలేని, యథార్థమైన’ అనే మూలభావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ స్వల్పమైన సంధి లేదా విషయమార్పును సూచిస్తుంది. ఈ ఒక్క వచనంలో తెలుగులో ప్రత్యేక సంధిపదం చేర్చకపోయినా ప్రవాహం సహజంగా ఉండి మూలార్థం కోల్పోదు.
theological_decisions:
- issue: πίστεως ἀνυποκρίτου అనే పదబంధంలో πίστις భావం
  choice: కపటంలేని విశ్వాసం
  alternative: యథార్థమైన నమ్మకం; కపటంలేని విశ్వసనీయత
  rationale: సందర్భంలో నిజమైన క్రైస్తవ విశ్వాసం సహజమైన పఠనం. అయితే πίστις పదానికి నమ్మకం లేదా విశ్వసనీయత అనే భావాలు కూడా కొన్ని సందర్భాల్లో ఉండగలవు కాబట్టి వాటిని పూర్తిగా తొలగించకుండా పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూడు ἐκ పదబంధాలు ప్రేమకు మూలాలుగా ఉన్న నిర్మాణాన్ని తెలుగులో స్పష్టంగా ఉంచాం; మూలంలోని స్వల్ప సంధిపదమైన δέను అనవసరంగా ‘ఇప్పుడు’ అని కాలసూచకంగా మార్చలేదు.
