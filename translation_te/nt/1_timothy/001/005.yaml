  text: τὸ δὲ τέλος τῆς παραγγελίας ἐστὶν ἀγάπη ἐκ καθαρᾶς καρδίας καὶ συνειδήσεως ἀγαθῆς καὶ πίστεως ἀνυποκρίτου,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/005.yaml
  text: The goal of the instruction is love from a pure heart and a good conscience and sincere faith[c][b][a],
translation:
  language: te
  text: ఈ ఉపదేశం యొక్క లక్ష్యం శుద్ధమైన హృదయం, మంచి మనస్సాక్షి, కపటంలేని విశ్వాసం నుండి వచ్చే ప్రేమ.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘లక్ష్యం’కు బదులుగా ‘ఉద్దేశం’ లేదా ‘ఫలితం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఉపదేశం’కు బదులుగా ‘ఆజ్ఞ’ లేదా ‘ఆదేశం’ అని కూడా అనువదించవచ్చు.
