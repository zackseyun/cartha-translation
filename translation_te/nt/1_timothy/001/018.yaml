id: 1TI.1.18
reference: 1 Timothy 1:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ταύτην τὴν παραγγελίαν παρατίθεμαί σοι, τέκνον Τιμόθεε, κατὰ τὰς προαγούσας ἐπὶ σὲ προφητείας, ἵνα ⸀στρατεύῃ ἐν αὐταῖς τὴν καλὴν στρατείαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/018.yaml
  text: This charge I entrust to you[a], child Timothy, in accordance with the prophecies previously made about you, so that by them you may wage the good warfare[c][b],
translation:
  language: te
  text: 'తిమోతీ, నా బిడ్డా, నీ గురించి[a] ఇంతకుముందు పలికిన ప్రవచనాలకు అనుగుణంగా ఈ ఆదేశాన్ని నీకు అప్పగిస్తున్నాను; వాటి ద్వారా[b] నీవు మంచి యుద్ధాన్ని[c] సాగించడానికి ఇలా చేస్తున్నాను.


    [a] లేదా, “నీకు సంబంధించిన”; “నీ మీద పలికిన” అనే భావం కూడా సాధ్యమే.


    [b] లేదా, “వాటి మూలంగా” లేదా “వాటిలో”; గ్రీకు పదబంధం సాధనాన్ని గానీ, పరిధిని గానీ సూచించవచ్చు.


    [c] సంప్రదాయ అనువాదం: “మంచి పోరాటాన్ని పోరాడు.” గ్రీకులో మరింత అక్షరార్థంగా, “మంచి యుద్ధాన్ని సాగించు” అని ఉంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీకు సంబంధించిన”; “నీ మీద పలికిన” అనే భావం కూడా సాధ్యమే.
    reason: ἐπὶ σὲ అనే పదబంధం సూచనను లేదా ఒకరి మీద పలకడాన్ని వ్యక్తం చేయవచ్చు.
  - marker: b
    text: లేదా, “వాటి మూలంగా” లేదా “వాటిలో”; గ్రీకు పదబంధం సాధనాన్ని గానీ, పరిధిని గానీ సూచించవచ్చు.
    reason: ἐν αὐταῖς సాధనార్థకంగా లేదా పరిధిని సూచించే విధంగా అర్థం కావచ్చు.
  - marker: c
    text: 'సంప్రదాయ అనువాదం: “మంచి పోరాటాన్ని పోరాడు.” గ్రీకులో మరింత అక్షరార్థంగా, “మంచి యుద్ధాన్ని సాగించు” అని ఉంది.'
    reason: στρατεύῃ మరియు στρατείαν అనే సమూల పదాలు ఒక్క పోరాటం కంటే యుద్ధం లేదా సైనిక కార్యాచరణ అనే విస్తృత రూపకాన్ని కలిగి ఉన్నాయి.
lexical_decisions:
- source_word: παραγγελίαν
  choice: ఆదేశం
  rationale: అధికారంతో ఇచ్చే నిర్దేశం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; “ఉపదేశం” కంటే బాధ్యత అప్పగించే గంభీరతను మెరుగుగా నిలుపుతుంది.
- source_word: παρατίθεμαί
  choice: అప్పగిస్తున్నాను
  rationale: ఒక బాధ్యతను మరొకరి సంరక్షణకు, నిర్వర్తనకు ఉంచడం అనే మధ్యమవాచక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τέκνον
  choice: నా బిడ్డా
  rationale: ఆప్యాయమైన ఆధ్యాత్మిక కుటుంబ సంబోధనను నిలుపుతుంది; గ్రీకులో లేని లింగనిర్దిష్టమైన “కుమారుడా” అనే పదాన్ని తప్పిస్తుంది. తెలుగులో సంబోధన సహజంగా ఉండేందుకు సంబంధసూచకమైన “నా” వాడబడింది.
- source_word: κατὰ
  choice: అనుగుణంగా
  rationale: ముందుగా పలికిన ప్రవచనాలకు ఈ ఆదేశం అనుసరణలో లేదా సరిపోలికలో ఉందనే సంబంధాన్ని తెలియజేస్తుంది.
- source_word: προαγούσας
  choice: ఇంతకుముందు పలికిన
  rationale: అక్షరార్థమైన “ముందుగా వెళ్లిన” అనే రూపం బదులు, ఈ సందర్భంలోని కాలసూచక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἐπὶ σὲ
  choice: నీ గురించి
  rationale: తిమోతిని ఉద్దేశించిన లేదా అతనికి సంబంధించిన ప్రవచనాలు అనే ప్రధాన భావాన్ని స్పష్టంగా ఇస్తుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో నిలుపుతుంది.
- source_word: προφητείας
  choice: ప్రవచనాలు
  rationale: ప్రవక్తృత్వ సందేశాలను సూచించే ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: ἐν αὐταῖς
  choice: వాటి ద్వారా
  rationale: ప్రవచనాలు తిమోతి యుద్ధసేవకు సాధనం లేదా మార్గదర్శకం అనే సాధనార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది; పరిధి భావమైన “వాటిలో” అనే సాధ్యతను పాదసూచికలో ఉంచుతుంది.
- source_word: στρατεύῃ
  choice: సాగించగలిగేలా
  rationale: στρατείανతో కలిసి సైనిక కార్యాచరణను కొనసాగించడం అనే భావాన్ని ఇస్తుంది; ἵναతో ఉన్న ఉద్దేశార్థక నిర్మాణాన్ని “గలిగేలా” ద్వారా నిలుపుతుంది.
- source_word: τὴν καλὴν στρατείαν
  choice: మంచి యుద్ధాన్ని
  rationale: సైనిక రూపకాన్ని స్పష్టంగా నిలుపుతుంది. సాధారణమైన “మంచి పోరాటం” కంటే στρατεία సూచించే యుద్ధయాత్ర లేదా సైనిక సేవ భావానికి దగ్గరగా ఉంటుంది.
theological_decisions:
- issue: ప్రవచనాల ద్వారా తిమోతికి వచ్చిన నియామక స్వభావం
  choice: ముందుగా తిమోతి గురించి పలికిన ప్రవచనాలు పౌలు అప్పగిస్తున్న ఆదేశానికి ఆధారంగా, అతని సేవకు మార్గదర్శకంగా ఉన్నాయని మాత్రమే వచనం చెబుతున్నట్లు అనువదించబడింది.
  alternative: ఆ ప్రవచనాలే తిమోతిని అధికారికంగా అభిషేకించాయి లేదా అవి కేవలం వ్యక్తిగత ప్రోత్సాహవాక్యాలు మాత్రమే అని నిర్దిష్టీకరించడం.
  rationale: గ్రీకు పాఠ్యం ప్రవచనాలు, ప్రస్తుత ఆదేశం, తిమోతి సాగించాల్సిన యుద్ధం మధ్య సంబంధాన్ని చూపుతుంది; అయితే నిర్దిష్టమైన అభిషేక లేదా సంఘపాలనా సిద్ధాంతాన్ని ఈ వచనం స్వయంగా వివరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ఆప్యాయమైనా గంభీరమైన సంబోధనను వాడింది. సైనిక రూపకాన్ని మృదువుగా మార్చకుండా నిలిపింది. రెండు తెలుగు వాక్యాలుగా విభజించడం ద్వారా దీర్ఘమైన గ్రీకు వాక్యంలోని ఉద్దేశ సంబంధాన్ని స్పష్టంగా, సాధారణ పాఠకులకు సహజంగా అందించింది.
