  to: 'తిమోతీ, నా బిడ్డా, నీ గురించి[a] ఇంతకుముందు పలికిన ప్రవచనాలకు అనుగుణంగా ఈ ఆదేశాన్ని నీకు అప్పగిస్తున్నాను; వాటి ద్వారా[b] నీవు మంచి యుద్ధాన్ని[c] సాగించడానికి ఇలా చేస్తున్నాను.


