id: 1TI.1.3
reference: 1 Timothy 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καθὼς παρεκάλεσά σε προσμεῖναι ἐν Ἐφέσῳ, πορευόμενος εἰς Μακεδονίαν, ἵνα παραγγείλῃς τισὶν μὴ ἑτεροδιδασκαλεῖν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/003.yaml
  text: Just as I urged you to remain in Ephesus when I was going into Macedonia[a], so that you might instruct certain people not to teach different doctrine,
translation:
  language: te
  text: నేను మాసిదోనియకు వెళ్తున్నప్పుడు నిన్ను ఎఫెసులో ఉండమని కోరినట్లుగా, కొంతమందికి భిన్నమైన బోధను బోధించవద్దని ఆజ్ఞాపించమని—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καθὼς
  choice: కోరినట్లే
  rationale: ముందుగా చేసిన విజ్ఞప్తిని గుర్తుచేస్తూ వాక్యాన్ని కొనసాగించే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: παρεκάλεσά σε
  choice: నిన్ను కోరాను
  rationale: పదం ప్రోత్సహించడం, వేడుకోవడం, గట్టిగా కోరడం వంటి భావాలను కలిగి ఉంటుంది. ఇక్కడ అధికారపూర్వకమైనప్పటికీ ఆజ్ఞగా అతిశయింపని ‘కోరాను’ తగినది.
- source_word: προσμεῖναι ἐν Ἐφέσῳ
  choice: ఎఫెసులోనే ఉండమని
  rationale: ప్రదేశంలో కొనసాగి ఉండాలనే భావాన్ని ‘ఉండమని’ తెలియజేస్తుంది; ‘నే’ అక్కడే ఉండడంపై ఉన్న సందర్భోచిత బలాన్ని సహజంగా చూపుతుంది.
- source_word: πορευόμενος εἰς Μακεδονίαν
  choice: నేను మాసిదోనియకు వెళ్తున్నప్పుడు
  rationale: కర్త పౌలేనని తెలుగులో స్పష్టం చేసి, కృదంతం సూచించే కాలసంబంధాన్ని నిలుపుతుంది.
- source_word: ἵνα παραγγείλῃς
  choice: ఆజ్ఞాపించు
  rationale: ἵνα తెలిపే ఉద్దేశం తెలుగు వాక్య నిర్మాణంలో సందర్భం ద్వారా వ్యక్తమవుతుంది; παραγγέλλω లోని అధికారపూర్వక నిర్దేశాన్ని ‘ఆజ్ఞాపించు’ స్పష్టంగా నిలుపుతుంది.
- source_word: τισὶν
  choice: కొందరు … వారికి
  rationale: పేర్లు చెప్పని నిర్దిష్ట వ్యక్తులను సూచించే అనిర్దిష్ట బహువచన భావాన్ని సహజమైన తెలుగులో ఇస్తుంది.
- source_word: μὴ ἑτεροδιδασκαλεῖν
  choice: భిన్నమైన బోధను బోధించవద్దని
  rationale: అపొస్తలిక ప్రమాణానికి భిన్నమైన బోధ అనే మూలపద భావాన్ని నిలుపుతుంది; మూలంలో నేరుగా లేని ‘తప్పుడు’ అనే తీర్పును చేర్చదు.
theological_decisions:
- issue: సంఘ సవరణ సందర్భంలో παραγγείλῃς యొక్క అధికార బలం
  choice: ‘ఆజ్ఞాపించు’ అని అనువదించడం
  alternative: ‘నిర్దేశించు’ లేదా ‘ఉపదేశించు’
  rationale: ఈ క్రియ అధికారంతో ఇచ్చే ఆదేశాన్ని సూచిస్తుంది. ‘ఉపదేశించు’ తెలుగులో బోధించడం అనే వేరొక భావంతో కలిసిపోవచ్చు; ‘ఆజ్ఞాపించు’ సందర్భంలోని అప్పగించబడిన అధికారాన్ని స్పష్టంగా ఉంచుతుంది.
- issue: ἑτεροδιδασκαλεῖν యొక్క మూల్యాంకన బలం
  choice: ‘భిన్నమైన బోధను బోధించు’
  alternative: ‘తప్పుడు బోధను బోధించు’ లేదా ‘వేరే సిద్ధాంతాన్ని బోధించు’
  rationale: సమాసక్రియ ప్రధానంగా వేరొకటి లేదా భిన్నమైనది బోధించడాన్ని సూచిస్తుంది. ‘తప్పుడు’ అనడం సందర్భానికి అనుగుణమైన భావవ్యాఖ్య అయినప్పటికీ పదంలో ఉన్న దానికన్నా తీర్పును బలపరుస్తుంది; అందువల్ల మూలంలోని ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యం తదుపరి భావంతో కొనసాగే అసంపూర్ణ నిర్మాణాన్ని తెలుగులో ఆజ్ఞారూపంతో చదవదగిన విధంగా మలిచాం; సిద్ధాంతపరమైన అదనపు తీర్పును చేర్చలేదు.
