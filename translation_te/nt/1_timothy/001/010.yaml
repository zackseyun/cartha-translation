  rationale: The revision broadens the slavery-related term to include human trafficking/enslavement rather than sale alone, improves contemporary Telugu idiom, and retains the source’s male-specific sexual reference and its unresolved lexical scope in the footnote. The inherited “కోసం ... నియమించబడింది” construction is retained because this verse continues the preceding statement about the law.
