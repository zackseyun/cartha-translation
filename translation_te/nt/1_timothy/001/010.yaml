id: 1TI.1.10
reference: 1 Timothy 1:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πόρνοις, ἀρσενοκοίταις, ἀνδραποδισταῖς, ψεύσταις, ἐπιόρκοις, καὶ εἴ τι ἕτερον τῇ ὑγιαινούσῃ διδασκαλίᾳ ἀντίκειται,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/010.yaml
  text: the sexually immoral, men who have sex with men,[a] servant traders, liars, perjurers, and whatever else is opposed to sound teaching,
translation:
  language: te
  text: లైంగిక దుర్నీతికి పాల్పడేవారికోసం, పురుషులతో లైంగిక సంబంధాలు పెట్టుకునే పురుషులకోసం,[a] మనుషులను బానిసలుగా వ్యాపారం చేసేవారికోసం, అబద్ధాలు చెప్పేవారికోసం, అబద్ధ ప్రమాణాలు చేసేవారికోసం, ఇంకా స్వస్థమైన బోధకు విరుద్ధమైన మరేదైనా ఉంటే దానికోసం నియమించబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్వలింగ లైంగిక ప్రవర్తనలో పాల్గొనే పురుషులు.” ἀρσενοκοῖται అనే గ్రీకు పదం అరుదైనది; దాని ఖచ్చిత పరిధిపై చర్చ ఉంది. అయితే అది పురుషుల మధ్య లైంగిక చర్యను సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: πόρνοις
  choice: లైంగిక దుర్నీతికి పాల్పడేవారికోసం
  rationale: ఈ పదం లైంగిక అవినీతిలో నిమగ్నమయ్యే వారిని విస్తృతంగా సూచిస్తుంది; కేవలం ఒక నిర్దిష్ట లైంగిక పాపానికి పరిమితం చేయదు.
- source_word: ἀρσενοκοίταις
  choice: పురుషులతో లైంగిక సంబంధాలు పెట్టుకునే పురుషులకోసం
  rationale: అరుదైన ఈ పదంలోని పురుష-పురుష లైంగిక సూచనను వ్యక్తిత్వం లేదా ఆధునిక గుర్తింపు వర్గాన్ని దిగుమతి చేయకుండా, ప్రవర్తనకే పరిమితమైన సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἀνδραποδισταῖς
  choice: మనుషులను బానిసలుగా అమ్మేవారికోసం
  rationale: మనుషులను పట్టుకొని లేదా సంపాదించి బానిసలుగా వ్యాపారం చేసేవారిని సూచిస్తుంది; సాధారణ అపహరణకన్నా బానిస వ్యాపార భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ψεύσταις
  choice: అబద్ధికులకోసం
  rationale: అబద్ధాలు చెప్పేవారిని సూచించే సూటి, సహజమైన బహువచన నామరూపం.
- source_word: ἐπιόρκοις
  choice: అబద్ధ ప్రమాణాలు చేసేవారికోసం
  rationale: తప్పుడు ప్రమాణం చేసే లేదా ప్రమాణాన్ని భంగం చేసే భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: καὶ εἴ τι ἕτερον
  choice: ఇంకా ... మరేదైనా ఉంటే
  rationale: జాబితాను ఇలాంటి ఇతర విషయాలన్నిటికీ విస్తరించే గ్రీకు వాక్యప్రయోగంలోని తెరచిన భావాన్ని కాపాడుతుంది.
- source_word: τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: ఆరోగ్యకరమైన బోధకు
  rationale: ὑγιαίνω లోని ఆరోగ్యం/స్వస్థత రూపకాన్ని కాపాడుతూ, ఆధునిక తెలుగులో అర్థమయ్యేలా ఉంది.
- source_word: ἀντίκειται
  choice: విరుద్ధమైనది
  rationale: ఎదురుగా నిలవడం లేదా వ్యతిరేకంగా ఉండడం అనే భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἀρσενοκοίταις అనే అరుదైన, వివాదిత పదానికి అనువాదం
  choice: పురుషులతో లైంగిక సంబంధాలు పెట్టుకునే పురుషులు
  alternative: స్వలింగ లైంగిక ప్రవర్తనలో పాల్గొనే పురుషులు
  rationale: గ్రీకు పదంలోని పురుష-నిర్దిష్టమైన లైంగిక ప్రవర్తనను తెలియజేస్తూ, ఆధునిక లైంగిక గుర్తింపు అనే విస్తృత భావాన్ని పాఠ్యంలోకి చేర్చదు. పదం యొక్క ఖచ్చిత పరిధిపై చర్చ ఉన్నందున ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఈ వచనం మునుపటి వాక్యంలో ఉన్న ‘ధర్మశాస్త్రం ... నియమించబడింది’ అనే క్రియాభావాన్ని కొనసాగిస్తుందనే కారణంగా ‘కోసం’ అనే సమాంతర నిర్మాణాన్ని వాడింది. ‘ఆరోగ్యకరమైన బోధ’ ద్వారా మూలంలోని ఆరోగ్య రూపకాన్ని నిలిపింది.
