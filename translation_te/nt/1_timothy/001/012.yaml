id: 1TI.1.12
reference: 1 Timothy 1:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Χάριν ἔχω τῷ ἐνδυναμώσαντί με Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν, ὅτι πιστόν με ἡγήσατο θέμενος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/012.yaml
  text: I give thanks to Messiah Jesus our Lord[a], who has strengthened me, because he considered me faithful, appointing me to ministry[b],
translation:
  language: te
  text: నన్ను బలపరచిన మన ప్రభువైన మెస్సీయ యేసుకు[a] నేను కృతజ్ఞతలు చెల్లిస్తున్నాను. ఎందుకంటే ఆయన నన్ను నమ్మకమైనవాడిగా భావించి, పరిచర్యకు[b] నియమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘క్రీస్తు యేసు.’ గ్రీకు బిరుదైన Χριστόςను దాని అర్థానుసారం ‘మెస్సీయ’ అని లేదా సంప్రదాయ రూపంలో ‘క్రీస్తు’ అని అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘సేవకు’ లేదా ‘సేవలో.’ గ్రీకు διακονία అనే పదం సాధారణంగా సేవను లేదా పరిచర్యను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω
  choice: నేను కృతజ్ఞతలు చెల్లిస్తున్నాను
  rationale: ఈ గ్రీకు నుడికారం కృతజ్ఞతను వ్యక్తం చేయడాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ఇది సహజంగానూ గౌరవప్రదంగానూ ఉంది.
- source_word: ἐνδυναμώσαντί με
  choice: నన్ను బలపరచిన
  rationale: క్రీస్తు పౌలును శక్తిమంతుణ్ణి చేసి, తన సేవకు సామర్థ్యం ఇచ్చాడనే భావాన్ని అతిగా నిర్దిష్టీకరించకుండా వ్యక్తం చేస్తుంది.
- source_word: Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసుకు
  rationale: Χριστός ఇక్కడ బిరుదుగా అర్థవంతంగా ఉంది; అందువల్ల దాని భావాన్ని తెలిపే ‘మెస్సీయ’ను ఉపయోగించాం. సంప్రదాయ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: τῷ κυρίῳ ἡμῶν
  choice: మన ప్రభువైన
  rationale: యేసు అధికారాన్ని తెలిపే క్రైస్తవ బిరుదును సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: πιστόν
  choice: నమ్మకమైనవాడిగా
  rationale: ఈ సందర్భంలో అప్పగించబడిన సేవలో విశ్వసనీయత లేదా నమ్మకత్వాన్ని సూచిస్తుంది; ‘నమ్మకమైన’ అనే పదం ఆ భావవ్యాప్తిని కాపాడుతుంది.
- source_word: ἡγήσατο
  choice: భావించి
  rationale: ‘పరిగణించాడు/ఎంచాడు’ అనే అర్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; న్యాయతీర్పు భావాన్ని అనవసరంగా చేర్చదు.
- source_word: θέμενος
  choice: నియమించాడు
  rationale: అక్షరార్థంగా ‘ఉంచి’ అయినప్పటికీ, సేవకు ఉంచడం అనే సందర్భార్థం నియామకాన్ని సూచిస్తుంది.
- source_word: εἰς διακονίαν
  choice: పరిచర్యకు
  rationale: διακονία సేవ లేదా పరిచర్య అనే విస్తృత భావాన్ని కలిగి ఉంది. ఇక్కడ అప్పగించబడిన సేవను సూచించడానికి ‘పరిచర్య’ సరిపోతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ యేసు
  alternative: క్రీస్తు యేసు
  rationale: ఇక్కడ Χριστός కేవలం పేరులో భాగంగా కాక, అభిషిక్తుడనే బిరుదు భావంతో ఉంది. ‘మెస్సీయ’ ఆ భావాన్ని ప్రత్యక్షంగా నిలుపుతుంది; సుపరిచితమైన ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో ఉంచాం.
- issue: పౌలు పరిచర్యకు నియమించబడిన విధానం
  choice: నన్ను నమ్మకమైనవాడిగా భావించి, పరిచర్యకు నియమించాడు
  alternative: నన్ను నమ్మదగినవాడిగా ఎంచి, సేవలో ఉంచాడు
  rationale: క్రీస్తు పౌలును విశ్వసనీయుడిగా పరిగణించి సేవకు ఉంచాడనే వాక్య సంబంధాన్ని కాపాడుతుంది; తరువాతి కాలపు నిర్దిష్ట సంఘపదవిని పాఠ్యంలోకి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. గ్రీకు వాక్యంలోని కృతజ్ఞత, బలపరచడం, నమ్మకత్వంగా భావించడం, సేవకు నియమించడం అనే సంబంధాలను స్పష్టంగా ఉంచాం; అనవసరమైన మతశాఖాపరమైన పదజాలాన్ని నివారించాం.
