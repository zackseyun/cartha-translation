id: 1TI.1.9
reference: 1 Timothy 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰδὼς τοῦτο, ὅτι δικαίῳ νόμος οὐ κεῖται, ἀνόμοις δὲ καὶ ἀνυποτάκτοις, ἀσεβέσι καὶ ἁμαρτωλοῖς, ἀνοσίοις καὶ βεβήλοις, πατρολῴαις καὶ μητρολῴαις, ἀνδροφόνοις,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/009.yaml
  text: 'understanding this: the law is not laid down for a righteous man, but for the lawless and rebellious, the ungodly and sinful, the unholy and profane, those who kill their fathers and those who kill their mothers, murderers,'
translation:
  language: te
  text: 'ఈ సంగతి తెలిసి: ధర్మశాస్త్రం నీతిమంతుని కోసం విధించబడలేదు; ధర్మశాస్త్రాన్ని లెక్కచేయనివారి కోసం, లోబడనివారి కోసం, దైవభక్తి లేనివారి కోసం, పాపుల కోసం, అపవిత్రుల కోసం, పవిత్రమైనవాటిని అవమానించేవారి కోసం, తండ్రులను చంపేవారి కోసం, తల్లులను చంపేవారి కోసం[a], హంతకుల కోసం విధించబడింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తండ్రులను కొట్టేవారు, తల్లులను కొట్టేవారు.” ఈ గ్రీకు పదాలు తల్లిదండ్రులపై హింసాత్మక దాడిని కూడా సూచించగలవు; అయితే ఈ సందర్భంలో “చంపేవారు” అనే అర్థం ఎక్కువగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς τοῦτο
  choice: ఈ సంగతి తెలుసుకోవాలి
  rationale: ముందున్న ఉపదేశానికి ఆధారమైన విషయాన్ని పరిచయం చేసే కృదంత భావాన్ని, విడిగా చదివినా సహజంగా అర్థమయ్యే ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δικαίῳ
  choice: నీతిమంతుని కోసం
  rationale: ఏకవచన రూపాన్నీ, ప్రతినిధికమైన వ్యక్తి భావాన్నీ నిలుపుతుంది.
- source_word: νόμος οὐ κεῖται
  choice: ధర్మశాస్త్రం ... కోసం విధించబడలేదు
  rationale: κεῖται లోని ‘నియమించబడడం/స్థాపించబడడం’ అనే న్యాయపరమైన భావాన్ని కాపాడుతుంది; ‘వర్తించదు’ అని అతిగా వ్యాఖ్యానించదు.
- source_word: ἀνόμοις
  choice: ధర్మశాస్త్రాన్ని లెక్కచేయనివారు
  rationale: నియమాన్ని పట్టించుకోని ‘ధర్మవిరోధ’ భావాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: ἀνυποτάκτοις
  choice: లోబడనివారు
  rationale: అధికారానికి లేదా క్రమానికి తలవంచని భావాన్ని సూటిగా వ్యక్తం చేస్తుంది.
- source_word: ἀσεβέσι
  choice: దైవభక్తి లేనివారు
  rationale: దేవునిపట్ల భక్తి, గౌరవం లేని భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: ἁμαρτωλοῖς
  choice: పాపులు
  rationale: తెలుగులో సుపరిచితమైన, సంక్షిప్తమైన సమానార్థకం.
- source_word: ἀνοσίοις
  choice: అపవిత్రులు
  rationale: పవిత్రతకు విరుద్ధమైన భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: βεβήλοις
  choice: పవిత్రమైనవాటిని అవమానించేవారు
  rationale: పవిత్రమైనదాన్ని సామాన్యంగా లేదా అగౌరవంగా చూసే భావాన్ని తెలియజేసి, ἀνοσίοις నుండి తేడాను కాపాడుతుంది.
- source_word: πατρολῴαις / μητρολῴαις
  choice: తండ్రులను చంపేవారు / తల్లులను చంపేవారు
  rationale: ఈ అరుదైన పదాలు కొట్టడం లేదా చంపడం రెండింటినీ సూచించగలవు; ఇక్కడ వెంటనే ‘హంతకులు’ రావడం వల్ల బలమైన ‘చంపడం’ భావాన్ని ప్రధాన పాఠ్యంలో ఎంచుకొని, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἀνδροφόνοις
  choice: హంతకులు
  rationale: అన్యాయంగా మనుషులను చంపేవారిని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
theological_decisions:
- issue: δικαίῳ లోని ఏకవచన ప్రతినిధిక ప్రయోగం
  choice: నీతిమంతుని కోసం
  alternative: నీతిమంతుల కోసం; నీతిగల వ్యక్తి కోసం
  rationale: మూలంలోని ఏకవచనాన్ని నిలుపుతూ, సందర్భంలో అది సాధారణ ప్రతినిధిక ప్రయోగమనే అవకాశాన్ని మూసివేయదు.
- issue: πατρολῴαις / μητρολῴαις యొక్క అర్థ పరిధి
  choice: తండ్రులను చంపేవారు / తల్లులను చంపేవారు
  alternative: తండ్రులను కొట్టేవారు / తల్లులను కొట్టేవారు
  rationale: మాతాపితలపై తీవ్రమైన హింస లేదా హత్య అనే రెండు అర్థాలు సాధ్యమే. ఈ జాబితాలో ‘హంతకులు’ అనే పదానికి సమీపంగా ఉండటం వల్ల ‘చంపేవారు’ను ఎంచుకున్నాం; నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. దోషాల జాబితిలో సమాంతరత కోసం ‘వారి కోసం’ నిర్మాణాన్ని పునరావృతం చేశాం. మూలవాక్యంలోని అపూర్ణ జాబితా భావాన్ని తెలుగులో సహజంగా పూర్తి చేయడానికి చివర ‘విధించబడింది’ని పునరుక్తం చేశాం.
