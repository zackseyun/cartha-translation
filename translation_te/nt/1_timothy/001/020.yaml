revisions:
- from: వారిలో హుమెనైయు, అలెక్సాందరు ఉన్నారు. వారు దైవదూషణ చేయకుండా శిక్షణ పొందాలని వారిని సాతానుకు అప్పగించాను.[a][b]
  to: వారిలో హుమెనైయు, అలెక్సాందరు ఉన్నారు; వారు దైవదూషణ చేయకుండా శిక్షణ పొందేలా వారిని సాతానుకు అప్పగించాను.[a][b]
  rationale: The revision makes only safe idiomatic adjustments. It retains the source text’s literal ‘handed over to Satan,’ avoids specifying an ecclesial or physical mechanism, and renders παιδευθῶσι with a natural Telugu purpose construction that can encompass instruction and corrective discipline. Both footnote anchors remain present and correctly correspond to their notes.
