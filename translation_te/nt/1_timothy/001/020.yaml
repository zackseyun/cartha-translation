id: 1TI.1.20
reference: 1 Timothy 1:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὧν ἐστιν Ὑμέναιος καὶ Ἀλέξανδρος, οὓς παρέδωκα τῷ Σατανᾷ ἵνα παιδευθῶσι μὴ βλασφημεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/020.yaml
  text: among whom are Hymenaeus and Alexander[b][a], whom I have handed over to Satan so that they may be taught not to blaspheme.
translation:
  language: te
  text: వారిలో హుమెనైయు, అలెక్సాందరు ఉన్నారు; వారు దైవదూషణ చేయకుండా శిక్షణ పొందేలా వారిని సాతానుకు అప్పగించాను.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సాతానుకు అప్పగించాను’ అనే ఈ పదబంధం తీవ్రమైన సరిదిద్దే క్రమశిక్షణను సూచించవచ్చు; ఇది అంతిమ ఖండన తీర్పు అని పాఠ్యం చెప్పదు.
    reason: theological_clarification
  - marker: b
    text: ‘శిక్షణ పొందేలా’ అనే మాటను ‘క్రమశిక్షణ ద్వారా దిద్దబడేలా’ లేదా ‘నేర్చుకునేలా’ అని కూడా అనువదించవచ్చు; గ్రీకు పదంలో బోధనతో కూడిన దిద్దుబాటు భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ἐστιν
  choice: వారిలో ... ఉన్నారు
  rationale: ముందు ప్రస్తావించిన సమూహంలో వీరిద్దరూ భాగమనే గ్రీకు విభాగార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Ὑμέναιος καὶ Ἀλέξανδρος
  choice: హుమెనైయు, అలెక్సాందరు
  rationale: గ్రీకు పేర్ల ఉచ్చారణకు దగ్గరగా ఉండే, తెలుగు బైబిలు వాడుకకు అనుకూలమైన లిప్యంతరీకరణ.
- source_word: παρέδωκα
  choice: అప్పగించాను
  rationale: παραδίδωμι యొక్క ‘చేతికి/అధీనానికి అప్పగించడం’ అనే బలాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: τῷ Σατανᾷ
  choice: సాతానుకు
  rationale: కొత్త నిబంధనలోని వ్యక్తిగత నామసూచనను సాధారణ తెలుగు రూపంలో ఇస్తుంది.
- source_word: ἵνα παιδευθῶσι
  choice: శిక్షణ పొందాలని
  rationale: παιδεύωలోని బోధన, క్రమశిక్షణ, దిద్దుబాటు అనే పరిధిని ఒక్క శిక్షకే పరిమితం చేయకుండా, సరిదిద్దే ఉద్దేశాన్ని తెలియజేస్తుంది.
- source_word: μὴ βλασφημεῖν
  choice: దైవదూషణ చేయకుండా
  rationale: ఈ సందర్భంలో βλασφημέωకు ఉన్న దేవుని లేదా విశ్వాసాన్ని అవమానించే మాటల గంభీరతను స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘సాతానుకు అప్పగించడం’ అనే పదబంధం అర్థం
  choice: పదబంధాన్ని ప్రధాన పాఠ్యంలో యథాతథంగా ఉంచి, దాని సరిదిద్దే ఉద్దేశాన్ని ఉద్దేశ్యవాక్యం ద్వారా నిలుపడం
  alternative: సంఘబహిష్కరణగా స్పష్టీకరించడం; శారీరక బాధ కలిగించే అద్భుత చర్యగా అర్థం చేయడం; తుది శాపతీర్పుగా చూపడం
  rationale: ἵνα ఉద్దేశ్యవాక్యం దైవదూషణ మానేందుకు దిద్దుబాటు పొందడాన్ని సూచిస్తుంది. అయితే చర్య యొక్క ఖచ్చితమైన విధానాన్ని గ్రీకు పాఠ్యం చెప్పదు; అందువల్ల అనిశ్చితిని పరిష్కరించకుండా ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన శైలి. గ్రీకు వాక్యంలోని కఠినమైన రూపకాన్ని నిలుపుతూ, వివరణను పాదటిప్పణులకు పరిమితం చేసింది.
