id: 1TI.1.14
reference: 1 Timothy 1:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑπερεπλεόνασεν δὲ ἡ χάρις τοῦ κυρίου ἡμῶν μετὰ πίστεως καὶ ἀγάπης τῆς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/014.yaml
  text: But the grace of our Lord overflowed all the more[a], with faith and love that are in Messiah Jesus.
translation:
  language: te
  text: అయితే మన ప్రభువు కృప, మెస్సీయ[a] యేసులో ఉన్న విశ్వాసంతోనూ ప్రేమతోనూ కలిసి, మరింతగా పొంగిపొర్లింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు యేసు.”
    reason: Χριστός అనే గ్రీకు బిరుదును తెలుగులో సంప్రదాయంగా ‘క్రీస్తు’ అని కూడా పలుకుతారు.
lexical_decisions:
- source_word: ὑπερεπλεόνασεν
  choice: మరింతగా పొంగిపొర్లింది
  rationale: ఈ బలవర్థక సంయుక్త క్రియ సాధారణంగా ‘సమృద్ధి చెందడం’ కంటే మించిన అపార సమృద్ధిని సూచిస్తుంది. ‘మరింతగా పొంగిపొర్లింది’ అనే మాట ఆ తీవ్రతను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వచనాల్లో చెప్పిన అవిశ్వాసం, పాపం అనే నేపథ్యానికి ప్రభువు కృపను వ్యతిరేకంగా నిలుపుతున్న భావాన్ని ఇది తెలియజేస్తుంది.
- source_word: χάρις
  choice: కృప
  rationale: దేవుని అనుగ్రహపూర్వకమైన దయను సూచించే, తెలుగు క్రైస్తవ వాడుకలో స్పష్టంగా స్థిరపడిన పదం.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριος అనే బిరుదుకు సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: μετὰ
  choice: తోనూ … తోనూ కలిసి
  rationale: కృప పొంగిపొర్లడం విశ్వాసం, ప్రేమలతో కూడి ఉన్నదని μετά యొక్క సహచర్య భావాన్ని స్పష్టం చేస్తుంది; అవి కృపకు కారణమని అనవసరంగా చెప్పదు.
- source_word: πίστεως
  choice: విశ్వాసం
  rationale: ఈ సందర్భంలో πίστις యొక్క సూటియైన అర్థం ‘విశ్వాసం’; ఇది వివాదాస్పదమైన πίστις Χριστοῦ నిర్మాణం కాదు.
- source_word: ἀγάπης
  choice: ప్రేమ
  rationale: ἀγάπηకి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసులో ఉన్న
  rationale: ఏకవచన స్త్రీలింగ ఆర్టికల్ సమీపంలోని ἀγάπηςతో వ్యాకరణపరంగా సరిపోతున్నప్పటికీ, ఈ పదబంధం విశ్వాసం మరియు ప్రేమ రెండింటినీ వర్ణిస్తున్నదిగా సహజంగా గ్రహించవచ్చు. తెలుగు నిర్మాణం ఈ పరిధిని కృత్రిమంగా సంకుచితం చేయదు.
- source_word: Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసు
  rationale: Χριστόςలోని అభిషిక్త రాజు అనే బిరుదు భావాన్ని ‘మెస్సీయ’ నిలుపుతుంది; పాఠకులకు సుపరిచితమైన ‘క్రీస్తు యేసు’ రూపాన్ని పాదసూచికలో ఇస్తున్నాం.
theological_decisions:
- issue: ‘విశ్వాసంతోనూ ప్రేమతోనూ’ అనే పదబంధానికి కృపతో ఉన్న సంబంధం
  choice: ప్రభువు కృప విశ్వాసం, ప్రేమలతో కలిసి పొంగిపొర్లిందని అనువదించాం.
  alternative: విశ్వాసం, ప్రేమ కృపవల్ల పౌలులో కలిగిన ఫలితాలని వివరణాత్మకంగా అనువదించడం.
  rationale: μετά సహచర్యాన్ని నేరుగా వ్యక్తపరుస్తుంది. కృప వీటిని ఉత్పత్తి చేసిందనే భావం సందర్భంలో సాధ్యమైనా, గ్రీకు వాక్యం కారణ-ఫలిత సంబంధాన్ని స్పష్టంగా నిర్దేశించదు; అందువల్ల ఆ ఉద్రిక్తతను పరిష్కరించకుండా ఉంచాం.
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: గ్రీకు బిరుదులోని ‘అభిషిక్తుడు’ అనే అర్థాన్ని ‘మెస్సీయ’ వెల్లడిస్తుంది. సంప్రదాయ రూపాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పొంగిపొర్లింది’ మూలక్రియలోని తీవ్ర సమృద్ధిని సజీవంగా తెలియజేస్తుంది; ‘కలిసి’ μετά యొక్క సహచర్యాన్ని స్పష్టం చేస్తుంది.
