id: 1TI.1.17
reference: 1 Timothy 1:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῷ δὲ βασιλεῖ τῶν αἰώνων, ἀφθάρτῳ, ἀοράτῳ, ⸀μόνῳ θεῷ, τιμὴ καὶ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/017.yaml
  text: To the King of the ages[a], immortal, invisible, the only God, be honor and glory forever and ever. Amen.
translation:
  language: te
  text: యుగాల రాజైన, నశించని, అదృశ్యుడైన ఏకైక దేవునికి ఘనతా మహిమలు యుగయుగాల వరకు కలుగుగాక. ఆమేన్.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλεῖ τῶν αἰώνων
  choice: యుగాల రాజైన
  rationale: గ్రీకు షష్ఠీ విభక్తి నిర్మాణాన్ని సాధ్యమైనంత స్పష్టంగా నిలుపుతూ, దేవుడు అన్ని యుగాలపై రాజుగా ఉన్నాడనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘నిత్యరాజు’ అనే మరింత వ్యాఖ్యానాత్మక రూపాన్ని స్వీకరించలేదు.
- source_word: ἀφθάρτῳ
  choice: నాశనం లేని
  rationale: క్షయం, నాశనం, మరణం ఆయనకు వర్తించవనే భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేసే సహజమైన తెలుగు రూపం.
- source_word: ἀοράτῳ
  choice: అదృశ్యుడైన
  rationale: కంటికి కనిపించనివాడు అనే మూలార్థాన్ని గంభీరమైన స్తోత్ర శైలిలో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: μόνῳ θεῷ
  choice: ఏకైక దేవునికి
  rationale: SBLGNTలో ఉన్న μόνῳ θεῷను నేరుగా ప్రతిబింబిస్తుంది; పాఠంలో లేని ‘జ్ఞానవంతుడైన’ అనే పదాన్ని ప్రధాన వచనంలో చేర్చదు.
- source_word: τιμὴ καὶ δόξα
  choice: ఘనత, మహిమ
  rationale: స్తుతి సందర్భంలో τιμήకు ‘ఘనత’, δόξαకు ‘మహిమ’ సహజమైన, స్థిరమైన తెలుగు సమానార్థకాలు.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: యుగయుగాలూ
  rationale: అంతంలేని కాలాన్ని సూచించే గ్రీకు నుడికారానికి సహజమైన తెలుగు బైబిలు-శైలి రూపం.
- source_word: ἀμήν
  choice: ఆమేన్
  rationale: తెలుగు క్రైస్తవ వాడుకలో స్థిరపడిన సంప్రదాయ లిప్యంతరీకరణ.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δὲ స్తోత్ర వాక్యానికి మార్పును సూచిస్తుంది. తెలుగులో ముందుగా ‘ఇప్పుడు’ లేదా ‘అయితే’ చేర్చడం మూలంలో లేని కాల లేదా విరోధ భావాన్ని కలిగించవచ్చు; వాక్య నిర్మాణమే మార్పును సహజంగా మోస్తుంది.
theological_decisions:
- issue: μόνῳ θεῷలోని ఏకదైవ భావాన్ని ఎలా నిలుపాలి
  choice: ఏకైక దేవునికి
  alternative: దేవునికే
  rationale: మూలపాఠంలోని స్పష్టమైన ఏకదైవ ప్రకటనను నేరుగా నిలుపుతుంది; విస్తృత క్రైస్తవ దైవశాస్త్ర సంబంధాలను వివరించడానికి లేదా పరిష్కరించడానికి అదనపు పదాలను చేర్చదు.
- issue: μόνῳ తరువాత σοφῷ (‘జ్ఞానవంతుడైన’) ఉన్న పాఠాంతరం
  choice: ప్రధాన వచనంలో ‘జ్ఞానవంతుడైన’ అనే పదాన్ని చేర్చలేదు
  alternative: ఏకైక జ్ఞానవంతుడైన దేవునికి
  rationale: అందించిన SBLGNT మూలపాఠంలో σοφῷ లేదు. పరిచితమైన దీర్ఘ పాఠాన్ని ప్రధాన వచనంలో కాకుండా పాఠాంతర సూచనగా పాదటిప్పణిలో ఉంచడం మూలభాషా ఆధారానికి ప్రాధాన్యం ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన స్తోత్ర శైలి వాడబడింది. విశేషణాల వరుసను తెలుగులో సహజంగా ఉండేలా దేవునితో అనుసంధానించి, ‘కలుగుగాక’ ద్వారా గ్రీకులో అంతర్లీనంగా ఉన్న ఆశీర్వచన భావాన్ని వ్యక్తం చేశాం.
