- from: యుగాల రాజైన, నాశనం లేని, అదృశ్యుడైన ఏకైక దేవునికి[a] ఘనత, మహిమ యుగయుగాలూ కలుగుగాక. ఆమేన్.
  to: యుగాల రాజైన, నశించని, అదృశ్యుడైన ఏకైక దేవునికి ఘనతా మహిమలు యుగయుగాల వరకు కలుగుగాక. ఆమేన్.
  rationale: The revision retains the source text’s sequence and doxological register, while replacing an awkward expression for ἀφθάρτῳ and making the final duration phrase syntactically clear. The footnote continues to mark the manuscript reading that adds “wise,” without treating it as the main-text reading.
