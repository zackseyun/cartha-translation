id: 1TI.1.11
reference: 1 Timothy 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κατὰ τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ, ὃ ἐπιστεύθην ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/011.yaml
  text: according to the gospel of the glory of the blessed God[a], which was entrusted to me.
translation:
  language: te
  text: ఇది ధన్యుడైన దేవుని మహిమకు సంబంధించిన సువార్త[a] ప్రకారం ఉంది; ఆ సువార్త నాకు అప్పగించబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత సహజంగా: “ధన్యుడైన దేవుని మహిమాన్వితమైన సువార్త.”'
    reason: τῆς δόξης అనే షష్ఠీ నిర్మాణాన్ని విశేషణార్థకంగా అర్థం చేసుకునే సాధ్యమైన, సుపరిచితమైన ప్రత్యామ్నాయాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: κατὰ
  choice: ప్రకారం
  rationale: కర్మకారకంతో వచ్చిన κατά, ముందున్న విషయాలకు ప్రమాణాన్ని లేదా అనుగుణతను సూచిస్తుంది; ‘ప్రకారం’ సహజమైన, సూటియైన తెలుగు రూపం.
- source_word: εὐαγγέλιον
  choice: సువార్త
  rationale: పౌలు సందర్భంలో εὐαγγέλιονకు స్థిరపడిన, సాధారణ పాఠకులకు అర్థమయ్యే తెలుగు పదం.
- source_word: τῆς δόξης
  choice: మహిమను గురించిన
  rationale: గ్రీకు షష్ఠీ విభక్తి సంబంధాన్ని కేవలం ‘మహిమాన్వితమైన’ అనే విశేషణంగా మార్చకుండా, దేవుని మహిమ సువార్తలోని విషయం లేదా దానితో గల సంబంధం కావచ్చనే విస్తృతిని నిలుపుతుంది.
- source_word: μακαρίου
  choice: ధన్యుడైన
  rationale: దేవునికి వర్తించిన μακάριοςను ‘సంతోషంగల’ లేదా ‘అదృష్టవంతుడైన’ అని కాకుండా గౌరవప్రదంగా, తెలుగు బైబిల్ భాషలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: θεοῦ
  choice: దేవుని
  rationale: θεός యొక్క షష్ఠీ రూపాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ὃ ἐπιστεύθην ἐγώ
  choice: ఆ సువార్త నాకు అప్పగించబడింది
  rationale: ఇక్కడ πιστεύω యొక్క కర్మణి రూపం ‘నమ్మాను’ అని కాక ‘అప్పగించబడింది’ అనే భావం ఇస్తుంది. తెలుగులో క్రియకు స్పష్టమైన కర్త అవసరమైనందున సంబంధసర్వనామాన్ని ‘ఆ సువార్త’గా సహజంగా వ్యక్తం చేశాం; ‘నాకు’ ద్వారా ἐγώ యొక్క వ్యక్తిగత బాధ్యత కూడా నిలుస్తుంది.
theological_decisions:
- issue: τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦలో షష్ఠీ సంబంధం
  choice: ధన్యుడైన దేవుని మహిమను గురించిన సువార్త
  alternative: ధన్యుడైన దేవుని మహిమాన్వితమైన సువార్త
  rationale: మూలంలోని ‘మహిమ యొక్క సువార్త’ అనే నిర్మాణాన్ని తెలుగులో అర్థవంతంగా ఉంచుతూ, షష్ఠీని తప్పనిసరిగా విశేషణార్థకంగా నిర్ణయించకుండా ‘గురించిన’ అని ఇచ్చాం. సహజమైన విశేషణ రూపాన్ని పాదసూచికలో ఉంచాం.
- issue: ἐπιστεύθην యొక్క భావం
  choice: నాకు అప్పగించబడింది
  alternative: నేను నమ్మాను
  rationale: ఈ సందర్భంలో కర్మణి రూపం ఒక బాధ్యత లేదా సందేశం పౌలుకు అప్పగించబడిందని సూచిస్తుంది; సాధారణమైన ‘నమ్ము’ భావం సందర్భానికి సరిపోదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఈ వాక్యం 10వ వచనం నుంచి కొనసాగుతున్నదని చూపడానికి ‘ఇది ఉంది’ చేర్చబడింది; సెమీకోలన్ దీర్ఘ సంబంధాన్ని స్పష్టంగా విభజిస్తుంది. మూలంలోని షష్ఠీ సంబంధం ప్రధాన పాఠ్యంలో సాధ్యమైనంతవరకు నిలుపబడింది.
