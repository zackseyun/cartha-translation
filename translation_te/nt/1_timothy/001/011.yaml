revisions:
- from: ధన్యుడైన దేవుని మహిమను గురించిన సువార్త ప్రకారం ఇది ఉంది; ఆ సువార్త నాకు అప్పగించబడింది.[a]
  to: ఇది ధన్యుడైన దేవుని మహిమకు సంబంధించిన సువార్త[a] ప్రకారం ఉంది; ఆ సువార్త నాకు అప్పగించబడింది.
  rationale: The revision retains the contextual completion needed for the verse’s dependent opening while replacing a restrictive topical interpretation of τῆς δόξης with a broader, natural Telugu expression. It also relocates the footnote anchor to the relevant noun phrase. No doctrinal interpretation has been added.
