id: 1TI.1.15
reference: 1 Timothy 1:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος, ὅτι Χριστὸς Ἰησοῦς ἦλθεν εἰς τὸν κόσμον ἁμαρτωλοὺς σῶσαι· ὧν πρῶτός εἰμι ἐγώ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/015.yaml
  text: 'The saying is trustworthy and worthy of full acceptance: that Messiah Jesus came into the world to save sinners[b][a], of whom I am the foremost.'
translation:
  language: te
  text: 'ఈ మాట నమ్మదగినది, సంపూర్ణ అంగీకారానికి యోగ్యమైనది: పాపులను రక్షించడానికి మెస్సీయ యేసు[a] లోకంలోకి వచ్చాడు; వారిలో నేనే మొదటివాణ్ణి[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘క్రీస్తు యేసు.’
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘అత్యంత ఘోరమైనవాణ్ణి’ లేదా ‘ప్రధానమైనవాణ్ణి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς ὁ λόγος
  choice: ఈ మాట నమ్మదగినది
  rationale: పాస్టరల్ పత్రికల్లో ఈ పదబంధం విశ్వసనీయమైన సారాంశ ప్రకటనను పరిచయం చేసే సూత్రవాక్యంగా పనిచేస్తుంది. ‘మాట’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండి, λόγοςను అనవసరంగా విస్తరించదు.
- source_word: πάσης ἀποδοχῆς ἄξιος
  choice: సంపూర్ణ అంగీకారానికి యోగ్యమైనది
  rationale: ἀποδοχήలోని ‘అంగీకారం/స్వీకారం’ భావాన్ని, πάσης ఇచ్చే సంపూర్ణతను ఈ పదబంధం గౌరవప్రదమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: ὅτι
  choice: ద్విబిందువు తరువాత ప్రత్యక్ష విషయవాక్యం
  rationale: ఇక్కడ ὅτι కారణాన్ని కాక, నమ్మదగిన మాటలోని విషయాన్ని పరిచయం చేస్తుంది. తెలుగులో ద్విబిందువు తరువాత దానిని ప్రత్యేక సంధానపదం లేకుండా చెప్పడం సహజం.
- source_word: Χριστὸς Ἰησοῦς
  choice: మెస్సీయ యేసు[a]
  rationale: Χριστόςకు ఇక్కడ బిరుదు భావం నిలిచి ఉంది; అందువల్ల ‘మెస్సీయ’ అని అనువదించాం. సంప్రదాయ ‘క్రీస్తు యేసు’ రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἦλθεν εἰς τὸν κόσμον
  choice: లోకంలోకి వచ్చాడు
  rationale: మూలంలోని గమన భావాన్ని, దాని అవతార సంబంధ ప్రతిధ్వనిని అదనపు వివరణ లేకుండా కాపాడే సహజ తెలుగు రూపం.
- source_word: ἁμαρτωλοὺς σῶσαι
  choice: పాపులను రక్షించడానికి
  rationale: ἁμαρτωλούς ఇక్కడ వ్యక్తులను సూచించే నామవాచక ప్రయోగం; σῶσαιకు ఈ రక్షణ సందర్భంలో ‘రక్షించడానికి’ స్థిరమైన, స్పష్టమైన సమానం.
- source_word: ὧν πρῶτός εἰμι ἐγώ
  choice: వారిలో నేనే మొదటివాణ్ణి[b]
  rationale: πρῶτοςలోని ‘మొదటి/అగ్రస్థానంలోని’ రూపకాన్ని నిలుపుతూ, ‘అత్యంత ఘోరమైనవాడు’ అనే వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చదు. ‘నేనే’ ἐγώలోని ఉద్ఘాటనను తెలుపుతుంది.
theological_decisions:
- issue: Χριστόςను బిరుదుగా లేదా పేరులో భాగంగా చూపడం
  choice: మెస్సీయ యేసు
  alternative: క్రీస్తు యేసు
  rationale: ఈ ఒప్పుకోలు స్వభావమున్న ప్రకటనలో అభిషిక్తుడనే బిరుదు భావం స్పష్టంగా ఉంది; అయితే పేరులాంటి సంప్రదాయ ప్రయోగం సాధ్యమే కాబట్టి దాన్ని పాదసూచికలో ఇచ్చాం.
- issue: పౌలు తనను πρῶτος అని పిలుచుకోవడంలోని భావం
  choice: మొదటివాణ్ణి
  alternative: అత్యంత ఘోరమైనవాణ్ణి లేదా ప్రధానమైనవాణ్ణి
  rationale: మూల పదం స్థానం లేదా ప్రాధాన్యాన్ని సూచించగలదు. ప్రధాన పాఠ్యం ఆ రూపక అస్పష్టతను కాపాడుతుంది; నైతిక తీవ్రతను స్పష్టపరిచే ప్రత్యామ్నాయాన్ని పాదసూచికకు పరిమితం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. సూత్రవాక్య గంభీరతను నిలుపుతూ వాక్య నిర్మాణాన్ని సహజంగా ఉంచాం.
