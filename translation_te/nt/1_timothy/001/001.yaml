id: 1TI.1.1
reference: 1 Timothy 1:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ κατ’ ἐπιταγὴν θεοῦ σωτῆρος ἡμῶν καὶ ⸂Χριστοῦ Ἰησοῦ⸃ τῆς ἐλπίδος ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the command of God our Savior and Messiah Jesus our hope[b],
translation:
  language: te
  text: మన రక్షకుడైన దేవుని మరియు మన నిరీక్షణయైన మెస్సీయ[a] యేసు ఆజ్ఞ ప్రకారం, మెస్సీయ యేసు అపొస్తలుడైన పౌలు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ వచనంలోని రెండు చోట్లా ‘క్రీస్తు యేసు.’ గ్రీకు Χριστός అనే బిరుదు ‘మెస్సీయ’ అనే అనువాద బిరుదుగానూ, కొన్ని సందర్భాల్లో పేరులా వాడబడే ‘క్రీస్తు’గానూ పనిచేయగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: పౌలు
  rationale: తెలుగు బైబిల్ వాడుకలో స్థిరపడిన గ్రీకు వ్యక్తినామ రూపం.
- source_word: ἀπόστολος
  choice: అపొస్తలుడు
  rationale: ఆదిమ క్రైస్తవ పరిచర్యలోని అధికారిక పాత్రను సూచించే స్థిరమైన తెలుగు పదం; సాధారణమైన ‘దూత’ కంటే ప్రత్యేక భావాన్ని నిలుపుతుంది.
- source_word: Χριστοῦ Ἰησοῦ
  choice: మెస్సీయ యేసు / మెస్సీయ యేసుకు
  rationale: Χριστός అనే బిరుదును అర్థానువాదంగా ‘మెస్సీయ’ అని ఇచ్చి, Ἰησοῦ అనే పేరును ‘యేసు’గా ఉంచింది. విభక్తిని తెలుగు వాక్య సంబంధానికి అనుగుణంగా వ్యక్తం చేసింది.
- source_word: κατ’ ἐπιταγήν
  choice: ఆజ్ఞ ప్రకారం
  rationale: అధికారపూర్వకమైన దైవ ఆదేశమే పౌలు అపొస్తలత్వానికి ఆధారమని తెలిపే సహజమైన, మూలానికి దగ్గరైన తెలుగు ప్రయోగం.
- source_word: θεοῦ σωτῆρος ἡμῶν
  choice: మన రక్షకుడైన దేవుని
  rationale: σωτήρ అనే బిరుదు దేవునికే వర్తిస్తున్న అన్వయాన్ని స్పష్టంగా, సహజమైన తెలుగు విశేషణ నిర్మాణంలో నిలుపుతుంది.
- source_word: Χριστοῦ Ἰησοῦ τῆς ἐλπίδος ἡμῶν
  choice: మన నిరీక్షణయైన మెస్సీయ యేసు
  rationale: ‘మన నిరీక్షణ’ అనేది మెస్సీయ యేసును గుర్తించే సమానాధికరణ విశేషణమనే గ్రీకు నిర్మాణాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἐλπίδος
  choice: నిరీక్షణ
  rationale: భవిష్యత్తుపై నమ్మకంతో కూడిన ఎదురుచూపు అనే పౌలు రచనలకు సహజమైన భావాన్ని కాపాడే స్థిరమైన తెలుగు పదం.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ అభివాదంలో బిరుదు భావం ఇంకా క్రియాశీలంగా ఉన్నందున దాని అర్థాన్ని అనువదించింది; అయితే పేరు వలె స్థిరపడిన ‘క్రీస్తు’ రూపాన్ని పాదటీపులో ఇచ్చింది.
- issue: ‘మన నిరీక్షణ’కు మెస్సీయ యేసుతో ఉన్న సంబంధం
  choice: సమానాధికరణంగా ‘మన నిరీక్షణయైన మెస్సీయ యేసు’
  alternative: ‘మనకు నిరీక్షణగా ఉన్న మెస్సీయ యేసు’
  rationale: గ్రీకు షష్ఠీ విభక్తి నిర్మాణం మెస్సీయ యేసునే ‘మన నిరీక్షణ’గా గుర్తిస్తుంది; సంబంధ వాక్యంగా విస్తరించకుండా ఆ గుర్తింపును నిలిపింది.
- issue: κατ’ ἐπιταγήν తరువాతి సమన్విత షష్ఠీ పదబంధాలు
  choice: ఆజ్ఞ దేవుని నుండీ మెస్సీయ యేసు నుండీ వచ్చినదిగా అన్వయించడం
  alternative: ‘యొక్క’ను రెండో పదబంధం ముందు స్పష్టంగా పునరుక్తి చేయడం
  rationale: θεοῦ ... καὶ Χριστοῦ Ἰησοῦ అనే సమన్వయం ఒకే ἐπιταγήν పదానికి సహజంగా ఆధీనమవుతుంది. తెలుగు ప్రధాన పాఠం రెండు మూలాలను సమాంతరంగా ఉంచుతుంది; మరింత పదానుసార రూపాన్ని పాదటీపులో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన పత్రికా-అభివాద శైలిని అనుసరించింది. ‘అపొస్తలుడు,’ ‘రక్షకుడు,’ ‘నిరీక్షణ’ వంటి విస్తృతంగా అర్థమయ్యే స్థిర పదాలను వాడింది. తెలుగు సహజ క్రమం కోసం ఆజ్ఞను తెలిపే పదబంధాన్ని ముందుకు తెచ్చినా, మూలంలోని సంబంధాలను మార్చలేదు.
