id: 1TI.1.2
reference: 1 Timothy 1:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τιμοθέῳ γνησίῳ τέκνῳ ἐν πίστει· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/002.yaml
  text: 'To Timothy[a], my true child in the faith: grace, mercy[b], and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: te
  text: 'విశ్వాసంలో నా నిజమైన బిడ్డవైన తిమోతికి[a]: తండ్రియైన దేవుని నుండీ, మన ప్రభువైన అభిషిక్తుడైన[b] యేసు నుండీ కృప, కనికరం, శాంతి కలుగుగాక.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నిజమైన” అనే మాటకు “యథార్థమైన” లేదా “స్వాభావికమైన” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'సంప్రదాయ అనువాదం: “క్రీస్తు యేసు.”'
    reason: traditional_rendering
lexical_decisions:
- source_word: γνησίῳ
  choice: నిజమైన
  rationale: తిమోతితో పౌలుకు ఉన్న ఆత్మీయ సంబంధం యథార్థమైనదని తెలియజేస్తుంది; జీవసంబంధమైన సంతానమని సూచించదు.
- source_word: τέκνῳ
  choice: బిడ్డ
  rationale: లింగాన్ని అవసరం లేకుండా నిర్దిష్టం చేయకుండా ఆత్మీయ తల్లిదండ్రత్వపు రూపకాన్ని నిలుపుతుంది.
- source_word: ἐν πίστει
  choice: విశ్వాసంలో
  rationale: తిమోతి పౌలుకు బిడ్డగా ఉన్న సంబంధం ఏర్పడిన లేదా కొనసాగుతున్న విశ్వాస పరిధిని సూచిస్తుంది; వ్యక్తిగతంగా నమ్మే చర్యకు మాత్రమే దీనిని పరిమితం చేయదు.
- source_word: χάρις
  choice: కృప
  rationale: పౌలు పలకరింపుల్లో స్థిరంగా కనిపించే భావాన్ని సహజమైన, ప్రామాణిక తెలుగు పదంతో అందిస్తుంది.
- source_word: ἔλεος
  choice: కనికరం
  rationale: దేవుని దయాపూర్వక స్పందనను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: εἰρήνη
  choice: శాంతి
  rationale: గ్రీకు పదంలోని పలకరింపు మరియు సంపూర్ణ క్షేమ భావాలను నిలుపుతుంది.
- source_word: θεοῦ πατρὸς
  choice: తండ్రియైన దేవుడు
  rationale: గ్రీకు పదబంధంలోని ‘దేవుడు—తండ్రి’ సంబంధాన్ని సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: Χριστοῦ
  choice: అభిషిక్తుడు
  rationale: Χριστός ఇక్కడ యేసుకు చెందిన బిరుదుగా ఉన్నందున దాని అర్థాన్ని తెలుగులో అనువదిస్తుంది; కేవలం సంప్రదాయ ధ్వన్యంతరీకరణపై ఆధారపడదు.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: యేసు అధికారాన్ని, క్రీస్తుసంబంధ ప్రాముఖ్యతను నిలుపుతూ సహజమైన స్థిర తెలుగు సమానార్థకాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: Χριστοῦ Ἰησοῦ అనువాదం
  choice: అభిషిక్తుడు యేసు
  alternative: క్రీస్తు యేసు
  rationale: Χριστόςను ఇక్కడ పేరులో భాగంగా మాత్రమే కాక బిరుదుగా గ్రహించి దాని అర్థాన్ని అనువదించాం; పరిచితమైన సంప్రదాయ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- issue: ἐν πίστει యొక్క భావం
  choice: విశ్వాసంలో
  alternative: విశ్వాసం విషయంలో
  rationale: ఈ పదబంధం పౌలు, తిమోతిల మధ్య ఉన్న ఆత్మీయ బంధానికి విశ్వాసమే పరిధి లేదా ఆధారమని సూచించవచ్చు. మరీ సాంకేతికమైన అర్థాన్ని బలవంతంగా నిర్ణయించకుండా విస్తృతతను నిలుపుతుంది.
- issue: ἀπὸ పదం θεοῦ మరియు Χριστοῦ రెండింటితో ఉన్న సంబంధం
  choice: తండ్రియైన దేవుని నుండీ, మన ప్రభువైన అభిషిక్తుడు యేసు నుండీ
  alternative: తండ్రియైన దేవుని మరియు మన ప్రభువైన అభిషిక్తుడు యేసు నుండి
  rationale: కృప, కనికరం, శాంతి దేవుని నుండీ యేసు నుండీ వస్తున్నాయని గ్రీకు సముచ్చయ నిర్మాణం సూచిస్తుంది; తెలుగులో ‘నుండీ’ని పునరుక్తి చేయడం ఈ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన లేఖా-పలకరింపు శైలిని ఉపయోగించాం. ‘కలుగుగాక’ అనే రూపం ఆశీర్వాద స్వభావాన్ని సహజంగా తెలియజేస్తుంది. ‘బిడ్డ’ ఆత్మీయ బంధాన్ని నిలుపుతూ జీవసంబంధ సంతాన భావాన్ని బలవంతంగా మోపడాన్ని నివారిస్తుంది.
