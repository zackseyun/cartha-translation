  to: 'విశ్వాసంలో నా నిజమైన బిడ్డవైన తిమోతికి[a]: తండ్రియైన దేవుని నుండీ, మన ప్రభువైన అభిషిక్తుడైన[b] యేసు నుండీ కృప, కనికరం, శాంతి కలుగుగాక.'
