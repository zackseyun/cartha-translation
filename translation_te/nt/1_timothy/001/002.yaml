    text: “నిజమైన” అనే మాటకు “యథార్థమైన” లేదా “స్వాభావికమైన” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'సంప్రదాయ అనువాదం: “క్రీస్తు యేసు.”'
