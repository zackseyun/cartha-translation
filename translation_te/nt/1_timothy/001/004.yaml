  to: కల్పిత కథలకూ అంతులేని వంశావళులకూ శ్రద్ధ చూపవద్దని కూడా ఆదేశించమని చెప్పాను. అవి విశ్వాసంలో ఉన్న దేవుని నిర్వహణకు[b][c] బదులుగా వ్యర్థ విచారణలను[a] కలిగిస్తాయి—
