id: 1TI.1.4
reference: 1 Timothy 1:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μηδὲ προσέχειν μύθοις καὶ γενεαλογίαις ἀπεράντοις, αἵτινες ⸀ἐκζητήσεις παρέχουσι μᾶλλον ἢ οἰκονομίαν θεοῦ τὴν ἐν πίστει—
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/004.yaml
  text: nor to pay attention to myths and endless genealogies[c][b][a], which promote speculations rather than the stewardship from God that is by faith—
translation:
  language: te
  text: కల్పిత కథలకూ అంతులేని వంశావళులకూ శ్రద్ధ చూపవద్దని కూడా ఆదేశించమని చెప్పాను. అవి విశ్వాసంలో ఉన్న దేవుని నిర్వహణకు[b][c] బదులుగా వ్యర్థ విచారణలను[a] కలిగిస్తాయి—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వ్యర్థ విచారణలు’ అనే చోట ‘వివాదాలు,’ ‘ఊహాగానాలు,’ లేదా ‘అన్వేషణలు’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం విచారణలు లేదా వాదోపవాదాలను సూచించగలదు; ఇక్కడ సందర్భం ఫలహీనమైన ప్రశ్నల భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘దేవుని నిర్వహణ’ అనే మాటకు ‘దేవుని ఏర్పాటు,’ ‘దేవుని ప్రణాళిక,’ లేదా ‘దేవుడు అప్పగించిన నిర్వహణ’ అనే భావాలు కూడా సాధ్యమే.
    reason: lexical_alternative
  - marker: c
    text: ‘విశ్వాసంలో’ అనే చోట ‘నమ్మకంలో’ అని కూడా అనువదించవచ్చు; ఇక్కడ ‘విశ్వాసం’ అనే పదంలో ‘విశ్వసనీయత’ అనే ఛాయ ఉందని కొందరు గ్రహిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχειν
  choice: శ్రద్ధ పెట్టడం
  rationale: ఏదో ఒక విషయానికి మనస్సు నిలిపి దానిలో నిమగ్నమవడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μύθοις
  choice: కల్పిత కథలు
  rationale: ‘పురాణాలు’ అనే పదం నిర్దిష్ట మతసాహిత్యాన్ని సూచించగలదు; ‘కల్పిత కథలు’ ఇక్కడి ప్రతికూల భావాన్ని పక్షపాతం లేకుండా తెలుపుతుంది.
- source_word: γενεαλογίαις ἀπεράντοις
  choice: అంతులేని వంశావళులు
  rationale: ἀπεράντοις లోని ముగింపు లేదా హద్దు లేని భావాన్ని సూటిగా కాపాడుతుంది.
- source_word: ἐκζητήσεις
  choice: వ్యర్థ విచారణలు
  rationale: పాఠభేదంతో వచ్చిన ఈ పదం విచారణలు, ప్రశ్నోత్తరాలు లేదా వివాదాలకు దారితీసే పరిశోధనలను సూచించవచ్చు; సందర్భంలోని ప్రతికూల, ఫలహీన భావాన్ని ‘వ్యర్థ’ స్పష్టం చేస్తుంది.
- source_word: παρέχουσι
  choice: కలిగిస్తాయి
  rationale: ‘ఉత్పత్తి చేస్తాయి/దారితీస్తాయి’ అనే కారణార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἰκονομίαν θεοῦ
  choice: దేవుని నిర్వహణ
  rationale: οἰκονομία లోని నిర్వహణ, ఏర్పాటుచేయడం, బాధ్యతాయుతమైన కార్యనిర్వహణ అనే విస్తృతిని నిలుపుతూ దానిని కేవలం ‘ప్రణాళిక’గా పరిమితం చేయదు.
- source_word: τὴν ἐν πίστει
  choice: విశ్వాసంలో నెరవేరే
  rationale: ἐν యొక్క పరిధి/మాధ్యమ భావాన్ని సహజ తెలుగులో ఇస్తుంది; ‘విశ్వాసం’ అనే ప్రధాన అర్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: οἰκονομίαν θεοῦ యొక్క అర్థం
  choice: దేవుని నిర్వహణ
  alternative: దేవుని ఏర్పాటు; దేవుడు అప్పగించిన నిర్వహణ; దేవుని ప్రణాళిక
  rationale: θεοῦ సంబంధాన్ని స్వామ్యంగా, మూలంగా, లేదా దేవునికి సంబంధించిన నిర్వహణగా గ్రహించవచ్చు. ప్రధాన పాఠం ఈ విస్తృతిని పూర్తిగా మూసివేయదు; ప్రత్యామ్నాయాలు పాదసూచికలో ఉన్నాయి.
- issue: πίστει యొక్క భావం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: ఈ సందర్భంలో ‘విశ్వాసం’ సహజమైన ప్రధాన ఎంపిక. అయినప్పటికీ πίστις పదానికి నమ్మకం లేదా విశ్వసనీయత అనే ఛాయలు ఉండగలవు కాబట్టి వాటిని పాదసూచికలో ఉంచాం.
- issue: ἐκζητήσεις పాఠం మరియు భావం
  choice: వ్యర్థ విచారణలు
  alternative: వివాదాలు; ఊహాగానాలు
  rationale: SBLGNTలోని ἐκζητήσεις ను అనుసరించాం. ఇది ఫలహీనమైన విచారణలు లేదా వివాదాలను సూచించగలదు; ‘వ్యర్థ విచారణలు’ ఆ అనిశ్చితిని కొంతవరకు నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన శైలి. ‘పురాణాలు’ వల్ల కలగగల అనవసర మతసంబంధ సూచనను నివారించేందుకు ‘కల్పిత కథలు’ ఎంచుకున్నాం. ఈ భాగం 3వ వచనంలో మొదలైన ఆదేశానికి వ్యాకరణపరంగా కొనసాగింపు కావడంతో తెలుగులో పూర్తి ఆజ్ఞారూప వాక్యంగా ఇచ్చాం. పాదసూచిక గుర్తులన్నీ ప్రధాన పాఠంలో ఉన్నాయి.
