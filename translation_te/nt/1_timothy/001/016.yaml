id: 1TI.1.16
reference: 1 Timothy 1:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ διὰ τοῦτο ἠλεήθην, ἵνα ἐν ἐμοὶ πρώτῳ ἐνδείξηται ⸂Χριστὸς Ἰησοῦς⸃ τὴν ⸀ἅπασαν μακροθυμίαν, πρὸς ὑποτύπωσιν τῶν μελλόντων πιστεύειν ἐπ’ αὐτῷ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/016.yaml
  text: But for this reason I received mercy[a], so that in me, as the foremost[d][c][b], Messiah Jesus might display all his patience as a pattern for those who were going to believe in him for eternal life.
translation:
  language: te
  text: 'కానీ ఈ కారణంగానే నేను కనికరం పొందాను: నేను అగ్రుడనైన నాలో మెస్సీయ యేసు తన సంపూర్ణ సహనాన్ని కనబరచి, నిత్యజీవం కొరకు ఆయనపై విశ్వాసముంచబోయేవారికి నేను నమూనాగా ఉండునట్లు.


    [a] “అగ్రుడనైన” అనే మాటను “మొదటివాడినైన” అని కూడా అనువదించవచ్చు. ఇది ముందరి వచనంలో పౌలు తనను పాపుల్లో అగ్రుడిగా చెప్పుకున్న మాటను తిరిగి సూచిస్తుంది.


    [b] లేదా “క్రీస్తు యేసు.” గ్రీకు పదమైన Χριστός అంటే “మెస్సీయ” లేదా “అభిషిక్తుడు.”


    [c] లేదా “తన ఓర్పునంతటినీ,” “తన దీర్ఘశాంతి అంతటినీ.”


    [d] లేదా “ఆయనపై విశ్వాసముంచేవారికి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అగ్రుడనైన” అనే మాటను “మొదటివాడినైన” అని కూడా అనువదించవచ్చు. ఇది ముందరి వచనంలో పౌలు తనను పాపుల్లో అగ్రుడిగా చెప్పుకున్న మాటను తిరిగి సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “క్రీస్తు యేసు.” గ్రీకు పదమైన Χριστός అంటే “మెస్సీయ” లేదా “అభిషిక్తుడు.”
    reason: alternative_rendering
  - marker: c
    text: లేదా “తన ఓర్పునంతటినీ,” “తన దీర్ఘశాంతి అంతటినీ.”
    reason: lexical_alternative
  - marker: d
    text: లేదా “ఆయనపై విశ్వాసముంచేవారికి.”
    reason: aspectual_alternative
lexical_decisions:
- source_word: ἠλεήθην
  choice: నేను కనికరం పొందాను
  rationale: కర్మణి రూపాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతూ, కనికరం చూపిన కర్తను వాక్యంలో స్పష్టంగా చేర్చకుండా మూలంలోని దైవిక కర్మణి భావాన్ని కాపాడుతుంది.
- source_word: πρώτῳ
  choice: మొదటివాడినైన
  rationale: ‘మొదటి/అగ్రుడు’ అనే మూలార్థాన్ని నిలుపుతుంది; 15వ వచనంలోని పాపుల్లో మొదటివాడనే సందర్భసూచనను పాదటిప్పణిలో వివరిస్తుంది, ప్రధాన పాఠంలో ‘అతి చెడ్డవాడు’ అని అతివ్యాఖ్యానం చేయదు.
- source_word: ἐνδείξηται
  choice: కనబరచి
  rationale: బహిరంగంగా చూపించడం లేదా ప్రదర్శించడం అనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ἵνα ఉద్దేశ్య నిర్మాణం చివరి ‘ఉంచాలని’తో కలుస్తుంది.
- source_word: Χριστὸς Ἰησοῦς
  choice: మెస్సీయ అయిన యేసు
  rationale: Χριστός యొక్క బిరుదు భావాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది; సంప్రదాయ ‘క్రీస్తు యేసు’ను పాదటిప్పణిలో ఇస్తుంది.
- source_word: ἅπασαν μακροθυμίαν
  choice: తన సహనమంతటినీ
  rationale: ἅπασαν లోని సంపూర్ణతను ‘అంతటినీ’తో, μακροθυμίαలోని దీర్ఘకాల సహనాన్ని సాధారణ పాఠకులకు అర్థమయ్యే ‘సహనం’తో అందిస్తుంది.
- source_word: ὑποτύπωσιν
  choice: ఒక నమూనాగా
  rationale: తరువాతి విశ్వాసులకు చూపబడే ఆదర్శం లేదా నమూనా అనే భావాన్ని కాపాడుతుంది.
- source_word: τῶν μελλόντων πιστεύειν
  choice: విశ్వాసముంచబోయేవారికి
  rationale: పౌలు అనుభవానికి సంబంధించి భవిష్యత్తులో విశ్వసించబోయే వారనే μέλλω యొక్క భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πιστεύειν ἐπ’ αὐτῷ
  choice: ఆయనపై విశ్వాసముంచ
  rationale: ἐπί + చతుర్థీ విభక్తి సూచించే వ్యక్తిపై ఆధారపడే విశ్వాసాన్ని ‘ఆయనపై విశ్వాసముంచడం’గా సహజంగా అందిస్తుంది.
- source_word: εἰς ζωὴν αἰώνιον
  choice: నిత్యజీవం కోసం
  rationale: εἰς సూచించే గమ్యం లేదా ఫలిత దిశను సంక్షిప్తంగా నిలుపుతుంది; నిత్యజీవం పొందే విధానంపై మూలం చెప్పినదానికంటే ఎక్కువగా వివరణ చేర్చదు.
theological_decisions:
- issue: Χριστός ను ఎలా అనువదించాలి
  choice: మెస్సీయ అయిన యేసు
  alternative: క్రీస్తు యేసు
  rationale: ఇక్కడ Χριστός ను కేవలం పేరులో భాగంగా కాక బిరుదుగా గ్రహించగల అవకాశం ఉంది. అందువల్ల దాని అర్థాన్ని ప్రధాన పాఠంలో స్పష్టపరుస్తూ, విస్తృతంగా పరిచయమైన సంప్రదాయ రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: కనికరం చూపిన కర్త మరియు సహనం కనబరచిన కర్త
  choice: ‘నేను కనికరం పొందాను’ అనే కర్మణి రూపంలో కనికరం చూపిన కర్తను పేర్కొనకుండా, ఉద్దేశ్య వాక్యంలో మెస్సీయ అయిన యేసు సహనం కనబరచాడని స్పష్టంగా ఉంచడం
  alternative: కనికరం చూపినవాడు దేవుడని లేదా యేసేనని ప్రధాన పాఠంలో నేరుగా చేర్చడం
  rationale: మూలంలోని ἠλεήθην కర్తను పేరుపెట్టదు; అయితే ἐνδείξηται కు Χριστὸς Ἰησοῦς స్పష్టమైన కర్త. ఈ వ్యత్యాసాన్ని వ్యాఖ్యానంతో సమతలపరచకుండా నిలుపుతుంది.
- issue: πρώτῳ యొక్క భావం
  choice: మొదటివాడినైన
  alternative: అగ్రుడనైన / అతి చెడ్డవాడినైన
  rationale: ముందరి వచనం సందర్భంలో పాపుల్లో అగ్రుడనే భావం ఉన్నప్పటికీ, ఈ వచనంలోని పదాన్ని ‘అతి చెడ్డవాడు’గా విస్తరించకుండా దాని నిజమైన అర్థపరిధిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదజాలం. ‘మెస్సీయ’ వంటి అవసరమైన ధార్మిక బిరుదును వివరణాత్మక నిర్మాణంతో ఇచ్చి, ‘క్రీస్తు’ అనే పరిచిత రూపాన్ని పాదటిప్పణిలో ఉంచాం. వాక్య నిర్మాణం గ్రీకు ఉద్దేశ్య సంబంధాన్ని నిలుపుతూ తెలుగులో సహజంగా ప్రవహించేలా అమర్చబడింది.
