lexical_decisions:
- source_word: ὧν
  choice: వాటిని లక్ష్యంగా చేసుకోవడంలో
  rationale: ఈ సర్వనామం 5వ వచనంలో చెప్పిన ప్రేమ, పవిత్ర హృదయం, మంచి మనస్సాక్షి, నిష్కపటమైన విశ్వాసం అనే లక్ష్యాలవైపు వెనక్కి సూచిస్తుంది. ἀστοχέωలోని ‘లక్ష్యాన్ని తప్పడం’ భావంతో సహజంగా కలిసేలా తెలుగులో ఈ రూపం వాడబడింది.
- source_word: τινες
  choice: కొందరు
  rationale: పేరు చెప్పని ఒక వర్గాన్ని సూచించే అనిర్దిష్ట సర్వనామానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: ἀστοχήσαντες
  choice: తప్పిపోయిన
  rationale: లక్ష్యాన్ని అందుకోకపోవడం లేదా దాని నుంచి తొలగిపోవడం అనే మూలభావాన్ని నిలుపుతుంది; సందర్భంలోని నైతిక-ఆధ్యాత్మిక లక్ష్యాలను స్పష్టంగా అతివ్యాఖ్యానించదు.
- source_word: ἐξετράπησαν
  choice: దారిమళ్లారు
  rationale: సరైన మార్గం నుంచి పక్కకు తిరగడం అనే దిశాత్మక రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది. గ్రీకు రూపం సందర్భంలో స్వయంగా దారిమళ్లిన భావాన్ని ఇస్తుంది.
- source_word: εἰς
  choice: -కు
  rationale: ఒక స్థితి లేదా కార్యకలాపం వైపు జరిగిన మళ్లింపును సూచిస్తుంది; ‘మాటలకు దారిమళ్లారు’ అనేది సహజమైన తెలుగు నిర్మాణం.
- source_word: ματαιολογίαν
  choice: వ్యర్థమైన మాటలు
  rationale: ఫలితం లేని, సారంలేని సంభాషణ అనే భావాన్ని గౌరవప్రదమైన సాధారణ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ὧν అనే సంబంధ సర్వనామం దేనిని సూచిస్తుంది?
  choice: 5వ వచనంలో ముందుగా పేర్కొన్న నైతిక-ఆధ్యాత్మిక లక్ష్యాలను సమష్టిగా సూచించే ‘వాటిని’
  alternative: మరింత సంకుచితంగా ‘పవిత్ర హృదయం, మంచి మనస్సాక్షి, నిష్కపటమైన విశ్వాసం’ అనే మూడింటినే సూచించడం; లేదా అక్షరార్థంగా ‘వేటి నుంచి’ అని అనువదించడం
  rationale: వాక్యనిర్మాణం ముందటి సందర్భంపై ఆధారపడుతుంది. ‘వాటిని లక్ష్యంగా చేసుకోవడంలో’ అనేది వెనుకటి సూచనను స్పష్టంచేస్తూనే, అది దేనిని ఎంత సంకుచితంగా సూచిస్తుందో అనవసరంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘లక్ష్యంగా చేసుకోవడంలో తప్పిపోయిన’ అనే ప్రయోగం ἀστοχέωలోని లక్ష్యరూపకాన్ని నిలుపుతుంది; ‘దారిమళ్లారు’ ἐκτρέπομαιలోని మార్గరూపకాన్ని వేరుగా కాపాడుతుంది. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
