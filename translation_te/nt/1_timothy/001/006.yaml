    text: లేదా, ‘లక్ష్యాన్ని తప్పిన కొందరు’; లేదా, ‘వాటి నుంచి దారితప్పిన కొందరు.’ ఈ క్రియ లక్ష్యాన్ని తప్పడం లేదా దాని నుంచి తొలగిపోవడం అనే భావాన్ని ఇవ్వగలదు.
