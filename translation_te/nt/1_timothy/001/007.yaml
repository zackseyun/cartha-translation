  edition: SBLGNT
  text: θέλοντες εἶναι νομοδιδάσκαλοι, μὴ νοοῦντες μήτε ἃ λέγουσιν μήτε περὶ τίνων διαβεβαιοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/007.yaml
  text: wanting to be teachers of the law[b][a], though they understand neither what they are saying nor the things about which they speak so confidently.
translation:
  language: te
  text: ధర్మశాస్త్ర బోధకులుగా ఉండాలని కోరుకుంటున్నారు.[a] అయితే, తాము ఏమి చెబుతున్నారో గానీ, తాము దేనిగురించి అంత గట్టిగా నొక్కిచెప్పుతున్నారో గానీ వారికి అర్థం కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ధర్మశాస్త్ర బోధకులు’ అనేది యూదుల ధర్మశాస్త్రాన్ని (తోరాను) బోధించే అధికారం తమకు ఉందని చెప్పుకునేవారిని సూచించే అవకాశం ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: θέλοντες εἶναι
  choice: ఉండాలని కోరుకుంటున్నారు
  rationale: కొనసాగుతున్న కోరికను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఈ అసమాపక క్రియారూపం మునుపటి వచనంలోని వ్యక్తులను సూచిస్తుంది.
- source_word: νομοδιδάσκαλοι
  choice: ధర్మశాస్త్ర బోధకులు
  rationale: νόμος అనే పదాన్ని సందర్భానుసారంగా యూదుల ధర్మశాస్త్రాన్ని సూచించే సాధారణ తెలుగు బైబిలు పదంతో అనువదిస్తూ, ప్రధాన పాఠ్యంలో ‘మోషే ధర్మశాస్త్రం’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: μὴ νοοῦντες
  choice: అయితే ... వారికి అర్థం కాదు
  rationale: వారు బోధకులు కావాలని కోరుకున్నప్పటికీ అవగాహన లేని విరోధార్థ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: μήτε ... μήτε
  choice: '... ఏమిటో, ... ఏమిటో ... కాదు'
  rationale: తెలుగులో సహజమైన జత నిరాకరణ నిర్మాణం ద్వారా గ్రీకు పదబంధంలోని రెండు అంశాల నిరాకరణను నిలుపుతుంది.
- source_word: ἃ λέγουσιν
  choice: తాము చెప్పేది ఏమిటో
  rationale: వారి మాటల విషయవస్తువును స్పష్టంగా సూచిస్తూ వర్తమాన భావాన్ని కాపాడుతుంది.
- source_word: περὶ τίνων
  choice: విషయాలు ఏమిటో
  rationale: వారు దేనిగురించి మాట్లాడుతున్నారో అనే అంశాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: διαβεβαιοῦνται
  choice: అంత గట్టిగా నొక్కిచెప్పే
  rationale: బలంగా ధృవీకరించడం లేదా పట్టుదలతో వాదించడం అనే క్రియ బలాన్ని వ్యక్తం చేస్తుంది; కేవలం ధైర్యంగా మాట్లాడటం కంటే మూలపదంలోని insistence భావాన్ని బాగా నిలుపుతుంది.
theological_decisions:
- issue: νομοδιδάσκαλοι లోని νόμος దేనిని సూచిస్తుంది
  choice: ధర్మశాస్త్ర బోధకులు
  alternative: మోషే ధర్మశాస్త్ర బోధకులు / తోరా బోధకులు
  rationale: సందర్భంలో యూదుల ధర్మశాస్త్రం లేదా తోరా ఉద్దేశించబడే అవకాశం బలంగా ఉన్నా, గ్రీకు సమాసపదం స్వయంగా ‘మోషే’ అని పేర్కొనదు. అందువల్ల ప్రధాన పాఠ్యం మూలంలోని విస్తృత రూపాన్ని నిలుపుతుంది; సాంస్కృతిక వివరణను పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదంగా మరియు నేరుగా ఉంది. వాక్యంలోని వ్యంగ్యభరిత విరోధాన్ని—బోధకులు కావాలనే కోరిక, కానీ తాము చెప్పేదానిపైనే అవగాహన లేకపోవడం—స్పష్టంగా నిలుపుతుంది.
