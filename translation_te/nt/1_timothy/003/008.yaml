  text: Διακόνους ὡσαύτως σεμνούς, μὴ διλόγους, μὴ οἴνῳ πολλῷ προσέχοντας, μὴ αἰσχροκερδεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/008.yaml
  text: Deacons likewise must be dignified[a], not double-tongued, not devoted to much wine, not greedy for shameful gain[c][b],
translation:
  language: te
  text: పరిచారకులు కూడా గౌరవనీయులై ఉండాలి; ఒకరితో ఒక మాట, మరొకరితో మరో మాట మాట్లాడేవారిగా ఉండకూడదు[a]; ఎక్కువ ద్రాక్షారసంలో మునిగివుండకూడదు[b]; అవమానకరమైన లాభానికి ఆశపడకూడదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “రెండు నాలుకలవారిగా.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఎక్కువ ద్రాక్షారసానికి అంటిపెట్టుకొని ఉండకూడదు.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “అవమానకరమైన లాభం కోసం వెంపర్లాడకూడదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διακόνους
  choice: పరిచారకులు
  rationale: ముందున్న సంఘ పర్యవేక్షకుల అర్హతల జాబితాకు సమాంతరంగా ఇక్కడ గుర్తింపు పొందిన సంఘ సేవా బాధ్యతను సూచిస్తుంది. ‘పరిచారకులు’ ఆధునిక తెలుగులో సహజంగా ఉండి, తరువాతి కాలపు ప్రత్యేక సంఘ నిర్మాణాలను అనవసరంగా మోపదు.
- source_word: ὡσαύτως
  choice: అలాగే
  rationale: ముందటి పర్యవేక్షకుల అర్హతలతో కొనసాగింపును చూపుతూ, సంబంధిత మరో వర్గాన్ని పరిచయం చేస్తుంది.
- source_word: σεμνούς
  choice: గౌరవప్రదంగా ఉండాలి
  rationale: గంభీరతతో కూడిన గౌరవనీయ ప్రవర్తనను తెలియజేస్తుంది; కేవలం ముఖగంభీరత అనే భావాన్ని ఇవ్వదు.
- source_word: μὴ διλόγους
  choice: రెండు నాలుకలవారిగా ఉండకూడదు
  rationale: ‘రెండు మాటలు’ అనే గ్రీకు చిత్రాత్మక నుడికారాన్ని నిలుపుతూ, వేర్వేరు వ్యక్తులతో విరుద్ధంగా లేదా కపటంగా మాట్లాడే స్వభావాన్ని సూచిస్తుంది.
- source_word: μὴ οἴνῳ πολλῷ προσέχοντας
  choice: మితిమీరి ద్రాక్షారసానికి లోబడకూడదు
  rationale: προσέχω ఇక్కడ దేనికైనా అతిగా అంటిపెట్టుకొని ఉండడం లేదా దానికి లోబడడం అనే భావాన్ని ఇస్తుంది. πολλῷ లోని పరిమాణ భావాన్ని ‘మితిమీరి’ సహజంగా వ్యక్తం చేస్తుంది; ఆధునిక వైద్యపరమైన ‘వ్యసనం’ అనే నిర్దిష్ట భావాన్ని రుద్దదు.
- source_word: μὴ αἰσχροκερδεῖς
  choice: నీచమైన లాభాన్ని ఆశించకూడదు
  rationale: అవమానకరమైన లేదా నైతికంగా హేయమైన మార్గంలో లాభం పొందాలనే ఆశను స్పష్టంగా, నైతిక బరువుతో తెలియజేస్తుంది.
theological_decisions:
- issue: διάκονος అనే సంఘపరమైన పదవి పేరు
  choice: పరిచారకులు—గుర్తింపు పొందిన సంఘ సేవా బాధ్యతను సూచించే పదంగా
  alternative: సేవకులు; పరిచర్యకులు
  rationale: ఈ సందర్భంలో పౌలు మొదట పర్యవేక్షకులకూ, తరువాత ఈ వర్గానికీ అర్హతలు చెబుతున్నాడు. అందువల్ల సాధారణ సేవకులు అనే అర్థానికి పరిమితం చేయకుండా సంఘంలోని గుర్తింపు పొందిన పాత్రను చూపాలి; అదే సమయంలో తరువాతి మతశాఖల ప్రత్యేక పదవీ నిర్మాణాన్ని పాఠ్యంలోకి తేవకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞాత్మక శైలి వాడబడింది. గ్రీకు నుడికారం ‘రెండు నాలుకలు’ ప్రధాన పాఠ్యంలో నిలుపబడి, దాని భావం పాదసూచికలో వివరించబడింది. ‘ద్రాక్షారసం’ మూలంలోని οἶνος‌ను స్పష్టంగా తెలుపుతుంది; సంపూర్ణ నిషేధం లేదా వైద్యపరమైన వ్యసనం అనే అర్థాలను పాఠ్యం చెప్పినదానికంటే మించి చేర్చలేదు.
