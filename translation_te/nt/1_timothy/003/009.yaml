  revision_rationale: The revision removes the added emphasis in ‘గట్టిగా’ while retaining the ongoing sense of ἔχοντας through ‘పట్టుకొని ఉండాలి.’ It also uses an explicit genitive construction, ‘విశ్వాసపు మర్మం,’ for clarity and source transparency. The footnote remains properly anchored and offers the stated formal alternatives without changing the verse’s meaning.
