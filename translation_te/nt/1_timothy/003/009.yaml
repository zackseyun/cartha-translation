id: 1TI.3.9
reference: 1 Timothy 3:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔχοντας τὸ μυστήριον τῆς πίστεως ἐν καθαρᾷ συνειδήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/009.yaml
  text: holding the mystery of the faith with a clear conscience[a].
translation:
  language: te
  text: వారు నిర్మలమైన మనస్సాక్షితో విశ్వాసపు మర్మాన్ని పట్టుకొని ఉండాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిర్మలమైన మనస్సాక్షిలో విశ్వాసపు మర్మాన్ని కలిగి ఉండాలి.”
    reason: ἐν ను ‘లో’గా, ἔχοντας ను ‘కలిగి’గా చూపే మరింత అక్షరార్థమైన అనువాద ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: ἔχοντας
  choice: గట్టిగా పట్టుకొని ఉండాలి
  rationale: వర్తమాన కృదంతం ముందటి వచనంలో సూచించిన పరిచారకులను వర్ణిస్తుంది. ఇది కేవలం కలిగి ఉండడాన్ని కాక, విశ్వాస మర్మాన్ని నిరంతరం అంటిపెట్టుకొని ఉండడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μυστήριον
  choice: మర్మం
  rationale: పౌలు వాడుకలో ఇది ఎప్పటికీ గూఢంగా ఉండే విషయం కంటే, ఒకప్పుడు దాచబడి ఇప్పుడు బయలుపరచబడిన దైవసత్యాన్ని సూచించగలదు. ‘మర్మం’ ఆ భావవ్యాప్తిని అనవసర వివరణ లేకుండా నిలుపుతుంది.
- source_word: τῆς πίστεως
  choice: విశ్వాస మర్మం
  rationale: సందర్భంలో πίστις ప్రధానంగా క్రైస్తవులు నమ్మే విశ్వాస విషయసారాన్ని సూచిస్తున్నట్లు కనిపిస్తుంది. తెలుగు సమాసంలో ‘విశ్వాస మర్మం’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తూ, వ్యక్తిగత విశ్వాసం అనే సాధ్యమైన ప్రతిధ్వనిని పూర్తిగా తొలగించదు.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: నిర్మలమైన మనస్సాక్షితో
  rationale: ἐν అనే ఉపసర్గను తెలుగులో సహజమైన సహచర్య లేదా నైతిక స్థితి భావంతో ‘తో’ అని అనువదించాం. καθαρός యొక్క శుద్ధత భావాన్ని ‘నిర్మలమైన’ నిలుపుతుంది; συνείδησις‌కు ‘మనస్సాక్షి’ సాధారణమైన, స్పష్టమైన పదం.
theological_decisions:
- issue: τῆς πίστεως లో ‘విశ్వాసం’ యొక్క భావం
  choice: క్రైస్తవ విశ్వాసపు విషయసారం
  alternative: వ్యక్తిగతంగా విశ్వసించడం లేదా నమ్మకం
  rationale: సంఘ పరిచారకుల అర్హతల సందర్భంలో వారు కాపాడవలసిన అపొస్తలిక విశ్వాస విషయసారం ప్రధాన భావంగా కనిపిస్తుంది. అయినా మూలపదంలోని విస్తృత విశ్వాస భావాన్ని అనువాదం పూర్తిగా మూసివేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సంఘ పఠనానికి తగిన గౌరవభరితమైన శైలి. ముందటి వచనంతో వ్యాకరణ సంబంధం తెలుగులో స్పష్టంగా ఉండేందుకు ‘వారు’ మరియు విధ్యర్థక ‘ఉండాలి’ చేర్చబడ్డాయి.
