id: 1TI.3.10
reference: 1 Timothy 3:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὗτοι δὲ δοκιμαζέσθωσαν πρῶτον, εἶτα διακονείτωσαν ἀνέγκλητοι ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/010.yaml
  text: And these also must first be tested[a]; then let them serve[b], being beyond reproach.
translation:
  language: te
  text: వీరిని కూడా మొదట పరీక్షించాలి; ఆ తర్వాత, నిందకు తావులేనివారైతే[b], సేవ చేయనివ్వాలి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరిచారకులుగా సేవ చేయనివ్వాలి.’ గ్రీకు క్రియకు ‘సేవ చేయడం’ అని అర్థం; ఇక్కడ పరిచారకుల అర్హతల సందర్భం ఉన్నందువల్ల పదవికి సంబంధించిన భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, వారిపై సమర్థించదగిన ఆరోపణ చేయడానికి ఆధారం లేకపోవాలి; వారు పాపరహితులని దీని అర్థం కాదు.
    reason: lexical_clarification
lexical_decisions:
- source_word: οὗτοι
  choice: వీరిని కూడా
  rationale: ముందటి వచనాల్లో ప్రస్తావించిన పరిచారక అభ్యర్థులను సూచించే బహువచన సర్వనామం; ‘కూడా’ δὲ యొక్క చేర్పు భావాన్ని సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: δοκιμαζέσθωσαν
  choice: పరీక్షించాలి
  rationale: వారి యోగ్యతను నిర్ధారించేందుకు పరిశీలించాలనే భావం. గ్రీకు కర్మణి ఆజ్ఞార్థాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో ‘వీరిని ... పరీక్షించాలి’గా వ్యక్తం చేసింది.
- source_word: πρῶτον ... εἶτα
  choice: మొదట ... ఆ తర్వాత
  rationale: పరీక్ష సేవకు ముందుగా జరగాలనే స్పష్టమైన క్రమాన్ని నిలుపుతుంది.
- source_word: διακονείτωσαν
  choice: సేవ చేయనివ్వాలి
  rationale: క్రియ యొక్క ప్రాథమిక అర్థమైన ‘సేవ చేయడం’ను నేరుగా ఉంచుతుంది; పరిచారక పదవికి సంబంధించిన సందర్భార్థాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: ἀνέγκλητοι
  choice: నిందకు తావులేనివారు
  rationale: వారిపై సమర్థించదగిన ఆరోపణకు ఆధారం ఉండకూడదనే భావాన్ని తెలియజేస్తుంది; పాపరహితులని సూచించదు.
- source_word: ὄντες
  choice: అయితే
  rationale: సేవ చేయడానికి తోడుగా ఉండవలసిన స్థితి లేదా అర్హతను సహజమైన షరతు రూపంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: διακονείτωσαν సాధారణ సేవను సూచిస్తుందా, పరిచారక పదవిలో సేవను సూచిస్తుందా
  choice: ప్రధాన పాఠంలో ‘సేవ చేయనివ్వాలి’; సందర్భానుసార పదవి భావం పాదసూచికలో
  alternative: పరిచారకులుగా సేవ చేయనివ్వాలి
  rationale: గ్రీకు పాఠంలో క్రియ నేరుగా ‘సేవ చేయాలి’ అని చెబుతుంది; అయితే తక్షణ సందర్భం పరిచారకుల అర్హతల గురించి ఉంది. ప్రధాన పాఠం పదార్థాన్ని కాపాడుతూ, పాదసూచిక సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
- issue: ἀνέγκλητοι సంపూర్ణ పాపరాహిత్యాన్ని సూచిస్తుందా
  choice: నిందకు తావులేనివారు
  alternative: నిర్దోషులు
  rationale: ఈ పదం సమర్థించదగిన ఆరోపణకు గురికాని స్థితిని సూచిస్తుంది; సంపూర్ణ పాపరాహిత్యాన్ని కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని పరీక్ష–తర్వాత సేవ అనే క్రమాన్ని నిలిపి, పదవి-సంబంధిత అర్థాన్ని ప్రధాన పాఠంలో బలవంతంగా చేర్చకుండా పాదసూచికలో సంరక్షించింది.
