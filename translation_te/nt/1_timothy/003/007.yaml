id: 1TI.3.7
reference: 1 Timothy 3:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δεῖ ⸀δὲ καὶ μαρτυρίαν καλὴν ἔχειν ἀπὸ τῶν ἔξωθεν, ἵνα μὴ εἰς ὀνειδισμὸν ἐμπέσῃ καὶ παγίδα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/007.yaml
  text: And he must also have a good testimony from those outside, so that he may not fall into reproach and the devil’s snare.
translation:
  language: te
  text: అంతేకాక, అతడు బయటివారి నుండికూడా మంచి పేరు కలిగి ఉండాలి[a], తద్వారా అతడు నిందలో పడిపోకుండా[b], అపవాది యొక్క ఉచ్చులో చిక్కుకోకుండా ఉండటానికి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, క్రైస్తవ సమాజానికి వెలుపల ఉన్నవారి నుండి.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అప్రతిష్ఠలో పడిపోకుండా.”
    reason: lexical_alternative
  - marker: c
    text: διάβολος అనే గ్రీకు పదాన్ని సాధారణ అర్థంలో తీసుకుంటే, ఇది మానవ అపవాది ఉచ్చును కూడా సూచించవచ్చు. ఇక్కడ అది వ్యక్తిగత దుష్టుడైన సాతానును సూచిస్తుందని గ్రహించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ δὲ καὶ
  choice: అంతేకాక ... కూడా ... ఉండాలి
  rationale: మునుపటి అర్హతలకు మరో తప్పనిసరి అర్హతను జోడిస్తున్న అనుసంధాన, సంకలన భావాలను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: μαρτυρίαν καλὴν ἔχειν
  choice: మంచి సాక్ష్యం కలిగినవాడై ఉండాలి
  rationale: μαρτυρία యొక్క ‘సాక్ష్యం/అనుకూల ధృవీకరణ’ భావాన్ని నిలుపుతూ, కేవలం ‘మంచి పేరు’ అని వ్యాఖ్యానాత్మకంగా కుదించదు.
- source_word: ἀπὸ τῶν ἔξωθεν
  choice: బయటివారి నుండి
  rationale: క్రైస్తవ సమాజానికి వెలుపల ఉన్నవారిని సూచించే గ్రీకు వ్యక్తీకరణను సంక్షిప్తంగా, సహజంగా అందిస్తుంది; ‘సంఘానికి బయటివారు’ అనే వివరణను పాదటిప్పణిలో స్పష్టం చేస్తుంది.
- source_word: ἵνα μὴ
  choice: అప్పుడు ... పడకుండా ఉంటాడు
  rationale: గ్రీకు ఉద్దేశ్య/ఫలిత భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ఈ అర్హత లేకపోతే కలిగే ప్రమాదాన్ని స్పష్టంగా అనుసంధానిస్తుంది.
- source_word: εἰς ὀνειδισμὸν ἐμπέσῃ
  choice: నిందకు ... పడకుండా
  rationale: ὀνειδισμός లోని బహిరంగ నింద, అవమానం అనే సామాజిక భావాన్ని నిలుపుతుంది; ‘అప్రతిష్ఠ’ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: παγίδα
  choice: ఉచ్చు
  rationale: పట్టుకోవడానికి వేసే ఉచ్చు అనే రూపకాన్ని సహజమైన బైబిలు తెలుగులో నిలుపుతుంది.
- source_word: τοῦ διαβόλου
  choice: అపవాది
  rationale: సందర్భంలో వ్యక్తిగత దుష్టుడైన సాతానును సూచించేదిగా గ్రహిస్తూ, διάβολος యొక్క ‘అపవాది’ అనే మూలార్థాన్నీ తెలుగు పదం నిలుపుతుంది.
theological_decisions:
- issue: τοῦ διαβόλου యొక్క సూచన
  choice: వ్యక్తిగత దుష్టుడైన అపవాది, అంటే సాతాను
  alternative: మానవ అపవాది; లేదా అపవాదుతో సంబంధమున్న ఉచ్చు
  rationale: పాస్టరల్ పత్రికల్లోను విస్తృత నూతన నిబంధన వాడుకలోను ఆర్టికల్‌తో ఉన్న διάβολος సాధారణంగా సాతానును సూచిస్తుంది. అయినా పదానికి ‘అపవాది’ అనే సాధారణ అర్థం సాధ్యమైనందున ఆ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో భద్రపరచాం.
- issue: ఉచ్చు ఎవరిది లేదా ఎవరు వేసింది అనే సంబంధం
  choice: అపవాది ఉచ్చు
  alternative: అపవాదే చిక్కుకున్న ఉచ్చు
  rationale: τοῦ διαβόλου అనే జనిటివ్ సహజంగా అపవాదికి చెందిన లేదా అతడు వేసిన ఉచ్చును సూచించవచ్చు. గ్రీకు రూపం సంబంధాన్ని పూర్తిగా నిర్దిష్టం చేయనందున ప్రధాన పాఠంలో సంక్షిప్త జనిటివ్ నిర్మాణాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘మంచి సాక్ష్యం’ మూలపాఠానికి దగ్గరగా ఉండగా, పాదటిప్పణి సందర్భార్థాన్ని వివరిస్తుంది. ప్రధాన పాఠంలోని ప్రతి పాదటిప్పణి గుర్తు సంబంధిత పదబంధం వెంట ఉంచబడింది.
