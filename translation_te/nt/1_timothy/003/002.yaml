id: 1TI.3.2
reference: 1 Timothy 3:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δεῖ οὖν τὸν ἐπίσκοπον ἀνεπίλημπτον εἶναι, μιᾶς γυναικὸς ἄνδρα, νηφάλιον, σώφρονα, κόσμιον, φιλόξενον, διδακτικόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/002.yaml
  text: Therefore an overseer must be above reproach[a], the husband of one wife, sober-minded, self-controlled, respectable, hospitable, able to teach,
translation:
  language: te
  text: కాబట్టి పర్యవేక్షకుడు నిందకు తావులేనివాడై, ఒకే భార్యకు భర్తగా[a], స్థిరబుద్ధిగలవాడై, ఆత్మనిగ్రహం కలవాడై, సముచితంగా ప్రవర్తించేవాడై, అతిథులను ఆదరించేవాడై, బోధించగలవాడై ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒకే స్త్రీ పట్ల నిబద్ధుడైన పురుషుడు.’ ఈ పదబంధం వివాహ స్థితికన్నా దాంపత్య నమ్మకత్వాన్ని నొక్కిచెప్పవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ
  choice: ఉండాలి
  rationale: ఇది కేవలం సలహాను కాక, పర్యవేక్షకునికి అవసరమైన అర్హతను సూచిస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందున్న చర్చనుంచి వచ్చే నిర్ధారణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπίσκοπον
  choice: పర్యవేక్షకుడు
  rationale: తరువాతి కాలపు సంఘపదవుల భావాలను దిగుమతి చేయకుండా, గ్రీకు పదంలోని పర్యవేక్షణ భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: ἀνεπίλημπτον
  choice: నిందకు తావులేనివాడు
  rationale: పాపరహిత పరిపూర్ణతను సూచించకుండా, సమర్థించదగిన నింద మోపడానికి అవకాశం లేని నైతిక స్థితిని తెలియజేస్తుంది.
- source_word: μιᾶς γυναικὸς ἄνδρα
  choice: ఒకే భార్యకు భర్త
  rationale: గ్రీకు పదబంధంలోని పురుష-నిర్దిష్ట రూపాన్ని, దాని వ్యాఖ్యానసంబంధమైన అనిశ్చితిని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: νηφάλιον
  choice: స్థిరబుద్ధిగలవాడు
  rationale: మద్యానికి దూరంగా ఉండటం అనే అక్షరార్థానికే పరిమితం కాకుండా, మానసిక మెలకువ మరియు సమతుల్యత అనే రూపకాలంకార భావాన్ని అందిస్తుంది.
- source_word: σώφρονα
  choice: ఆత్మనిగ్రహం కలవాడు
  rationale: వివేకంతో తన ఆలోచనలను, ప్రవర్తనను అదుపులో ఉంచుకునే నైతిక లక్షణాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: κόσμιον
  choice: మర్యాదస్థుడు
  rationale: క్రమబద్ధమైన, సముచితమైన, గౌరవయోగ్యమైన ప్రవర్తనను సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: φιλόξενον
  choice: అతిథులను ఆదరించేవాడు
  rationale: అతిథులను, పరదేశులను ఆహ్వానించి ఆదరించే గుణాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: διδακτικόν
  choice: బోధించగలవాడు
  rationale: బోధించాలనే ఆసక్తి మాత్రమే కాక, అందుకు తగిన సామర్థ్యం ఉండాలని సూచిస్తుంది.
theological_decisions:
- issue: సంఘ పర్యవేక్షకుని అర్హతల్లో μιᾶς γυναικὸς ἄνδρα అనే పదబంధం యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘ఒకే భార్యకు భర్త’ అని సాపేక్షంగా పదానుసారంగా అనువదించడం
  alternative: ‘ఒకే స్త్రీ పట్ల నిబద్ధుడైన పురుషుడు’ లేదా ‘తన భార్యకు నమ్మకంగా ఉండేవాడు’
  rationale: ఈ పదబంధం దాంపత్య నమ్మకత్వాన్ని నొక్కిచెబుతుందా, బహుభార్యత్వాన్ని నిషేధిస్తుందా, లేక పునర్వివాహంపై ఏదైనా పరిమితిని సూచిస్తుందా అనేది చర్చనీయాంశం. ప్రధాన పాఠ్యం ఈ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. గుణలక్షణాల జాబితిలో సహజమైన సమాంతర నిర్మాణాన్ని నిలిపాం; మతశాఖకు ప్రత్యేకమైన పదజాలాన్ని నివారించాం.
