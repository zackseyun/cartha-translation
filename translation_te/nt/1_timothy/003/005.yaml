id: 1TI.3.5
reference: 1 Timothy 3:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: (εἰ δέ τις τοῦ ἰδίου οἴκου προστῆναι οὐκ οἶδεν, πῶς ἐκκλησίας θεοῦ ἐπιμελήσεται;)
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/005.yaml
  text: But if someone does not know how to manage his own household[c][b][a], how will he care for God’s church?
translation:
  language: te
  text: అయితే, ఒకడు తన సొంత ఇంటివారిని నడిపించడం[a] ఎలాగో తెలియకపోతే, దేవుని సంఘాన్ని[b] ఎలా శ్రద్ధగా చూసుకుంటాడు?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన సొంత ఇంటివారికి నాయకత్వం వహించడం,” లేదా “తన సొంత ఇంటివారి బాధ్యతను నిర్వహించడం.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “దేవుని సభను.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “ఎలా సంరక్షిస్తాడు?” లేదా “ఎలా శ్రద్ధ వహిస్తాడు?”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: అయితే, … లేకపోతే
  rationale: δέ లోని స్వల్ప వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది; εἰ యొక్క షరతును ‘లేకపోతే’ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τις
  choice: ఒకడు
  rationale: ఇది అనిర్దిష్ట ఏకవచన కర్త. సమీప సందర్భం సంఘ పర్యవేక్షకుని అర్హతలను పురుష ఏకవచనంలో వివరిస్తున్నందున, ఆ సందర్భానుగుణ లింగసూచనను నిలుపుతూ ‘ఒకడు’ అని అనువదించబడింది.
- source_word: τοῦ ἰδίου οἴκου
  choice: తన సొంత ఇంటివారిని
  rationale: οἶκος ఇక్కడ భవనాన్ని కాక, అతని బాధ్యతలో ఉన్న ఇంటివారనే సామాజిక సమూహాన్ని సూచిస్తుంది. ‘ఇంటివారు’ అనే పదం ‘కుటుంబం’ కంటే గృహంలోని విస్తృత పరిధిని మెరుగ్గా నిలుపుతుంది.
- source_word: προστῆναι
  choice: నడిపించడం
  rationale: προΐστημι ఇక్కడ బాధ్యతతో కూడిన గృహ నాయకత్వం, నిర్వహణను సూచిస్తుంది. ‘నడిపించడం’ సహజమైన తెలుగు; ‘పాలించడం’ వల్ల కలగగల అధిక అధికార భావాన్ని అనవసరంగా చేర్చదు.
- source_word: οὐκ οἶδεν
  choice: ఎలాగో తెలియకపోతే
  rationale: క్రియార్థక infinitive తో οἶδα, ఒక పని ఎలా చేయాలో తెలిసి ఉండడాన్ని సూచిస్తుంది. ‘ఎలాగో తెలియకపోతే’ ఆ ప్రయోగార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: πῶς
  choice: ఎలా
  rationale: ఇంటి బాధ్యత నుంచి సంఘ బాధ్యతకు తీసుకువెళ్లే అలంకారప్రశ్నను యథాతథంగా నిలుపుతుంది; మూలంలో లేని అసమర్థత భావాన్ని జోడించదు.
- source_word: ἐκκλησίας θεοῦ
  choice: దేవుని సంఘాన్ని
  rationale: దేవునికి చెందిన సంఘం అనే genitive సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. ఈ సంఘసంబంధ సందర్భంలో ἐκκλησία కు ‘సంఘం’ స్థిరమైన, తగిన పదం.
- source_word: ἐπιμελήσεται
  choice: శ్రద్ధగా చూసుకుంటాడు
  rationale: ἐπιμελέομαι శ్రద్ధతో పట్టించుకొని సంరక్షించడాన్ని సూచిస్తుంది. ఈ పదప్రయోగం కేవలం పరిపాలనకన్నా బాధ్యతాయుతమైన సంరక్షణను ముందుకు తెస్తుంది; భవిష్యత్ అలంకారప్రశ్నను కూడా నిలుపుతుంది.
theological_decisions:
- issue: ఇంటి నాయకత్వానికి సంఘ సంరక్షణకు మధ్య సంబంధం
  choice: ఇంటివారిని ‘నడిపించడం,’ దేవుని సంఘాన్ని ‘శ్రద్ధగా చూసుకోవడం’ అని వేర్వేరు క్రియలతో అనువదించడం
  alternative: రెండు చోట్లా ‘నడిపించడం’ వాడటం; లేదా ఇంటివారిని ‘పాలించడం’ అని అనువదించడం
  rationale: మూలపాఠం προΐστημι, ἐπιμελέομαι అనే రెండు వేర్వేరు క్రియలను ఉపయోగిస్తుంది. ఆ భేదాన్ని నిలుపడం వల్ల సంఘ పర్యవేక్షణను కేవలం అధికార పాలనగా కుదించకుండా, దానిలోని సంరక్షణ భావం వ్యక్తమవుతుంది.
- issue: అనిర్దిష్ట కర్తలో లింగ సూచన
  choice: సమీప సందర్భానికి అనుగుణంగా ‘ఒకడు’ అనే పురుష ఏకవచన రూపం
  alternative: లింగ సూచన లేని ‘ఎవరైనా’ రూపం
  rationale: τις స్వతహాగా అనిర్దిష్టమైనప్పటికీ, చుట్టుపక్కల వాక్యాలు పర్యవేక్షకుని అర్హతలను పురుష ఏకవచన రూపాల్లో ఇస్తున్నాయి. ‘ఒకడు’ ఆ సందర్భాన్ని స్పష్టంగా నిలుపుతుంది; అయినా నిర్దిష్ట వ్యక్తిని సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే ప్రశ్నారూపం ఎంచుకోబడింది. ‘ఇంటివారు,’ ‘సంఘం,’ ‘శ్రద్ధగా చూసుకోవడం’ వంటి సాధారణంగా అర్థమయ్యే పదాలు వాడబడ్డాయి. మూలంలోని షరతు, అలంకారప్రశ్న, అలాగే గృహ నాయకత్వం–సంఘ సంరక్షణ మధ్య క్రియాభేదం నిలుపబడ్డాయి.
