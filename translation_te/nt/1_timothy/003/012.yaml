review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies διάκονοι as the church-office term and preserves the imperative force of ἔστωσαν. It also keeps the debated μιᾶς γυναικὸς ἄνδρες expression formally open rather than selecting an interpretation. However, ‘ఒక్క భార్యకు భర్తలుగా’ is syntactically awkward in Telugu and can sound as though multiple men are husbands to a single wife; it does not communicate the Greek qualification idiom naturally.
  naturalness: ‘ఒక్క భార్యగలవారై’ is the established, natural modern Telugu formal equivalent and retains the phrase’s interpretive openness. ‘తమ పిల్లలను, తమ సొంత ఇంటివారిని చక్కగా నడిపించేవారై’ communicates responsible oversight of children and household members more idiomatically than ‘నిర్వహించేవారై.’
  terminology: ‘పరిచారకులు’ is suitable in this church-order context. ‘ఇంటివారు’ appropriately renders households as people under one’s domestic care rather than merely a building. The footnote’s proposed literal alternative should be recast into intelligible Telugu.
  issues:
  - severity: medium
    issue: The rendering ‘ఒక్క భార్యకు భర్తలుగా’ is unnatural and potentially misleading.
    rationale: In Telugu, the plural phrase can suggest that a single wife has multiple husbands. The Greek idiom is a singular marital qualification applied distributively to deacons; ‘ఒక్క భార్యగలవారై’ conveys this naturally without deciding the debated scope.
  - severity: low
    issue: The footnote alternative ‘ఒకే స్త్రీకి చెందిన పురుషులుగా’ is overly literal and unnatural.
    rationale: It may imply possession or belonging rather than the Greek idiom’s marital sense. A readable close alternative should retain the wording’s ambiguity without creating an unintended meaning.
  revised_text: పరిచారకులు ఒక్క భార్యగలవారై ఉండాలి; తమ పిల్లలను, తమ సొంత ఇంటివారిని చక్కగా నడిపించేవారై ఉండాలి.
  revised_footnotes:
  - marker: a
    text: లేదా, ‘ఒకే స్త్రీకి మాత్రమే భర్తలైనవారు.’ ఈ పదబంధం వివాహ నమ్మకత్వాన్ని నొక్కిచెప్పవచ్చు; కొందరు దీనిని మరింత నిర్దిష్టంగా బహుభార్యత్వాన్ని లేదా పునర్వివాహాన్ని మినహాయించేదిగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  revision_rationale: The revision replaces an awkward and potentially misleading literalism with idiomatic Telugu while preserving the source phrase’s disputed scope. It also uses a more natural verb for responsible household oversight and revises the footnote alternative for clarity without imposing a theological conclusion.
