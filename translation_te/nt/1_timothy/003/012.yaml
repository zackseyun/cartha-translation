id: 1TI.3.12
reference: 1 Timothy 3:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διάκονοι ἔστωσαν μιᾶς γυναικὸς ἄνδρες, τέκνων καλῶς προϊστάμενοι καὶ τῶν ἰδίων οἴκων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/012.yaml
  text: Deacons must be husbands of one wife[a], managing their children and their own households well.
translation:
  language: te
  text: పరిచారకులు ఒక్క భార్యగలవారై ఉండాలి; తమ పిల్లలను, తమ సొంత ఇంటివారిని చక్కగా నడిపించేవారై ఉండాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διάκονοι
  choice: పరిచారకులు
  rationale: సంఘ క్రమానికి సంబంధించిన ఈ సందర్భంలో ఇది సాధారణ సేవకులను కాక, గుర్తింపు పొందిన పరిచర్య బాధ్యతగలవారిని సూచిస్తుంది. ఆధునిక తెలుగు సంఘ వాడుకలో ‘పరిచారకులు’ పదం ఆ బాధ్యతను సహజంగా తెలియజేస్తుంది.
- source_word: ἔστωσαν
  choice: ఉండాలి
  rationale: వర్తమాన ఆజ్ఞార్థక రూపం అర్హతల జాబితాలో నియమాత్మక అవసరాన్ని సూచిస్తుంది; ‘ఉండాలి’ దానిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μιᾶς γυναικὸς ἄνδρες
  choice: ఒక్క భార్యకు భర్తలుగా
  rationale: గ్రీకు పదబంధ నిర్మాణానికి సన్నిహితంగా ఉండి, వివాహ నమ్మకత్వం, ఏకపత్నీత్వం, లేదా పునర్వివాహాన్ని మినహాయించడం వంటి వివాదాస్పద వ్యాఖ్యానాల్లో ఏదొకదాన్ని ప్రధాన పాఠ్యంలో నిర్ణయించకుండా ఉంచుతుంది.
- source_word: τέκνων
  choice: తమ పిల్లలను
  rationale: స్వామ్య సూచన గ్రీకులో ప్రత్యక్షంగా లేకపోయినా, కృదంత నిర్మాణం మరియు తరువాతి ‘తమ సొంత ఇంటివారిని’ అనే సమాంతర పదబంధం వల్ల ‘తమ’ అనేది తెలుగులో సహజంగా అవసరమవుతుంది.
- source_word: καλῶς
  choice: చక్కగా
  rationale: కృదంతాన్ని విశేషించే ఈ క్రియావిశేషణం బాధ్యతను సక్రమంగా నిర్వర్తించడాన్ని సరళంగా, సహజంగా తెలియజేస్తుంది.
- source_word: προϊστάμενοι
  choice: నిర్వహించేవారై
  rationale: ఈ పదం బాధ్యతాయుతమైన పర్యవేక్షణ లేదా నాయకత్వాన్ని సూచిస్తుంది. కుటుంబ సందర్భంలో ‘నిర్వహించేవారై’ అనేది అతిగా అధికార ధ్వని లేకుండా ఆ భావాన్ని అందిస్తుంది.
- source_word: τῶν ἰδίων οἴκων
  choice: తమ సొంత ఇంటివారిని
  rationale: οἶκος ఇక్కడ భౌతిక గృహాన్ని మాత్రమే కాక ఇంటి సమూహాన్ని సూచిస్తుంది. ‘ఇంటివారు’ ఆధునిక తెలుగులో ఆ కుటుంబ/గృహస్థ సమూహ భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: సంఘ పరిచర్య అర్హతల్లో μιᾶς γυναικὸς ἄνδρες అనే పదబంధం యొక్క అర్థం
  choice: ‘ఒక్క భార్యకు భర్తలుగా’ అని రూపపరంగా సన్నిహితంగా అనువదించి, దాని ఉద్దేశాన్ని ప్రధాన పాఠ్యంలో నిర్దిష్టంగా తేల్చలేదు.
  alternative: ‘ఒకే స్త్రీకి చెందిన పురుషులు’; ‘తమ భార్యలకు నమ్మకంగా ఉండేవారు’; ‘ఒక్కసారే వివాహమైనవారు’
  rationale: గ్రీకు పదబంధం సంక్షిప్తమైనది, నుడికారసంబంధమైనది; దాని పరిధిపై భిన్నాభిప్రాయాలు ఉన్నాయి. అందువల్ల వివాహ నమ్మకత్వం, బహుభార్యత్వ నిషేధం, లేదా పునర్వివాహ నిషేధం అనే ఏ ఒక్క వ్యాఖ్యానాన్నీ పాఠ్యంలోకి చేర్చకుండా అసలు పాఠ్యంలోని ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సంఘ పఠనానికి తగిన గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పరిచారకులు’ సంఘ బాధ్యతను సూచిస్తుంది; ‘ఇంటివారు’ భౌతిక ఇంటికన్నా విస్తృతమైన గృహస్థ సమూహాన్ని తెలియజేస్తుంది.
