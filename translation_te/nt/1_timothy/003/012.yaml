revisions:
- from: పరిచారకులు ఒక్క భార్యకు భర్తలుగా[a] ఉండాలి; తమ పిల్లలను, తమ సొంత ఇంటివారిని చక్కగా నిర్వహించేవారై ఉండాలి.
  to: పరిచారకులు ఒక్క భార్యగలవారై ఉండాలి; తమ పిల్లలను, తమ సొంత ఇంటివారిని చక్కగా నడిపించేవారై ఉండాలి.
  rationale: The revision replaces an awkward and potentially misleading literalism with idiomatic Telugu while preserving the source phrase’s disputed scope. It also uses a more natural verb for responsible household oversight and revises the footnote alternative for clarity without imposing a theological conclusion.
