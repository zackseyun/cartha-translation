revisions:
- from: అతడు కొత్తగా విశ్వాసంలోకి వచ్చినవాడై ఉండకూడదు. అలా ఉంటే అతడు గర్వంతో ఉబ్బిపోయి, అపవాది పొందిన తీర్పుకే గురికావచ్చు.[a]
  to: అతడు కొత్తగా విశ్వాసంలోకి వచ్చినవాడు కాకూడదు; లేకపోతే అతడు గర్వంతో ఉబ్బిపోయి అపవాది తీర్పులో పడిపోవచ్చు.[a]
  rationale: The revision retains the Greek warning and its imagery while removing an unwarranted resolution of the ambiguous genitive τοῦ διαβόλου. The footnote now presents the principal interpretive alternatives without making either one the sole meaning of the main text.
