id: 1TI.3.6
reference: 1 Timothy 3:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ νεόφυτον, ἵνα μὴ τυφωθεὶς εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/006.yaml
  text: He must not be a recent convert[a], so that he may not become puffed up and fall into the judgment of the devil.
translation:
  language: te
  text: అతడు కొత్తగా విశ్వాసంలోకి వచ్చినవాడు కాకూడదు; లేకపోతే అతడు గర్వంతో ఉబ్బిపోయి అపవాది తీర్పులో పడిపోవచ్చు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అపవాది పొందిన అదే తీర్పుకు గురికావచ్చు”; ప్రత్యామ్నాయంగా, “అపవాదితో సంబంధమున్న తీర్పులో పడిపోవచ్చు.”
    reason: alternative_reading
lexical_decisions:
- source_word: νεόφυτον
  choice: కొత్తగా విశ్వాసంలోకి వచ్చినవాడు
  rationale: అక్షరార్థంగా ‘కొత్తగా నాటబడినవాడు’ అనే రూపకాన్ని కలిగిన ఈ పదం, సందర్భంలో క్రైస్తవ విశ్వాసంలోకి ఇటీవల వచ్చిన వ్యక్తిని సూచిస్తుంది. ఆధునిక తెలుగులో ఈ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τυφωθεὶς
  choice: గర్వంతో ఉబ్బిపోయి
  rationale: అహంకారంతో ఉబ్బిపోవడం అనే రూపకాన్నీ, నైతిక హెచ్చరికనూ నిలుపుతుంది.
- source_word: κρίμα
  choice: తీర్పు
  rationale: ఈ పదం ‘తీర్పు’ లేదా ‘శిక్షావిధి’ అనే భావాలను కలిగి ఉండగలదు. ‘తీర్పు’ విస్తృతమైన అర్థాన్ని ఉంచి, మూలంలోని సందిగ్ధతను కాపాడుతుంది.
- source_word: τοῦ διαβόλου
  choice: అపవాది పొందిన
  rationale: ప్రధాన పాఠంలో అపవాదికి విధించబడిన అదే తీర్పు అనే సాధ్యమైన భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; సంబంధిత ఇతర వ్యాకరణ సాధ్యతను పాదటిప్పణిలో తెలియజేస్తుంది.
- source_word: ἐμπέσῃ
  choice: గురికావచ్చు
  rationale: అక్షరార్థమైన ‘దానిలో పడిపోవడం’ తెలుగులో ఈ వాక్యంలో అసహజంగా ఉండవచ్చు; ప్రమాదకరమైన తీర్పుకు లోనవడం అనే భావాన్ని ‘గురికావచ్చు’ సహజంగా తెలియజేస్తుంది.
- source_word: ἵνα μὴ
  choice: అలా ఉంటే ... కావచ్చు
  rationale: నియామక నిషేధం వెనుక ఉన్న ఉద్దేశం లేదా నివారించవలసిన ఫలితాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου అనే పదబంధం యొక్క అర్థం
  choice: అపవాది పొందిన తీర్పుకే గురికావచ్చు
  alternative: అపవాదితో సంబంధమున్న తీర్పుకు గురికావచ్చు; లేదా అపవాది వల్ల కలిగే తీర్పుకు లోనవచ్చు
  rationale: τοῦ διαβόλου అనే షష్ఠీ విభక్తి అపవాదిపై వచ్చిన తీర్పును సూచించవచ్చు, లేదా అపవాదితో సంబంధమున్న/అతని ద్వారా కలిగే తీర్పును సూచించవచ్చు. ప్రధాన పాఠం మొదటి సాధ్యతను సహజంగా అందిస్తుంది; పాదటిప్పణి మూలంలోని మిగిలిన సందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సంఘ నాయకత్వ అర్హతల సందర్భానికి తగిన గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘అపవాది’ అనే పదం διάβολος యొక్క నిందారోపకుడు/దూషకుడు అనే భావాన్ని నిలుపుతుంది.
