lexical_decisions:
- source_word: Ταῦτά
  choice: ఈ సంగతులు
  rationale: నపుంసకలింగ బహువచన సర్వనామం ముందున్న లేదా కొనసాగుతున్న ఉపదేశాల సమాహారాన్ని సూచిస్తుంది; ‘ఈ సంగతులు’ మూలంలోని బహువచన భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: σοι
  choice: నీకు
  rationale: γράφωతో వచ్చిన చతుర్థీ విభక్తి పత్రికా సందర్భంలో వ్రాత అందుకునే వ్యక్తిని సూచిస్తుంది.
- source_word: γράφω
  choice: రాస్తున్నాను
  rationale: వర్తమానకాల క్రియ ఇక్కడ పత్రం వ్రాస్తున్న ప్రస్తుత కార్యాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఉంటుంది.
- source_word: ἐλπίζων
  choice: ఆశిస్తూ
  rationale: వర్తమాన క్రియావిశేషణ రూపం ప్రధాన క్రియతో పాటు ఉన్న రచయిత ఆశను తెలియజేస్తుంది; నిశ్చయాన్ని అతిగా సూచించదు.
- source_word: ἐλθεῖν
  choice: రావాలని
  rationale: πρὸς σέతో కలిసి గమ్యవ్యక్తి వైపు రావడాన్ని సూచిస్తుంది; తెలుగులో ఆశను తెలిపే నిర్మాణంతో ‘రావాలని’ సహజంగా సరిపోతుంది.
- source_word: πρὸς σὲ
  choice: నీ దగ్గరకు
  rationale: వ్యక్తి వైపు కదలికను సూచించే πρός + ద్వితీయా విభక్తి భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐν τάχει
  choice: త్వరలోనే
  rationale: ఈ నుడికారం సమీప కాలాన్ని లేదా వేగాన్ని సూచించగలదు; పత్రికా సందర్భంలో ‘త్వరలోనే’ ప్రధాన భావాన్ని సహజంగా తెలియజేస్తుంది, ప్రత్యామ్నాయ భావాలు పాదటీపులో నిలుపబడ్డాయి.
