  source_fidelity: 'మూల గ్రీకు భావం మొత్తంగా సరిగానే ఉంది: Ταῦτά బహువచనాన్ని ‘ఈ సంగతులు’గా, ἐλπίζωνను నిశ్చయాన్ని అతిగా చెప్పని ‘ఆశిస్తూ’గా, πρὸς σέను ‘నీ దగ్గరకు’గా అనువదించారు. అయితే ‘త్వరలోనే’లోని -నే మూలంలో లేని ప్రత్యేక ఉద్ఘాటనను చేర్చుతుంది; ἐν τάχει యొక్క సాధారణ కాలసూచక భావానికి ‘త్వరలో’ మరింత సమీపంగా ఉంటుంది.'
