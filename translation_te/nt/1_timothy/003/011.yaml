id: 1TI.3.11
reference: 1 Timothy 3:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γυναῖκας ὡσαύτως σεμνάς, μὴ διαβόλους, νηφαλίους, πιστὰς ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/011.yaml
  text: Women likewise must be dignified[a], not slanderers, sober-minded, faithful in all things.
translation:
  language: te
  text: అలాగే స్త్రీలు[a] గౌరవనీయులై, అపవాదు చెప్పేవారు కాకుండా, స్వీయనిగ్రహం గలవారై, అన్ని విషయాల్లో నమ్మకస్థులై ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అలాగే భార్యలు గౌరవనీయులై ఉండాలి...” ఈ సందర్భంలో గ్రీకు పదం γυναῖκαςకు “స్త్రీలు” లేదా “భార్యలు” అనే రెండు అర్థాలూ రావచ్చు; “వారి భార్యలు” అని మూలపాఠం స్పష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκας
  choice: స్త్రీలు
  rationale: γυνή అనే పదానికి సందర్భానుసారం ‘స్త్రీలు’ లేదా ‘భార్యలు’ అనే అర్థాలు రావచ్చు. ఇక్కడ స్వామ్యసూచక పదం లేకపోవడం వల్ల ప్రధాన పాఠంలో ‘స్త్రీలు’ అని ఉంచి, ‘భార్యలు’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: ὡσαύτως
  choice: అలాగే
  rationale: ఈ పదం ముందున్న అర్హతల జాబితాతో సమాంతర సంబంధాన్ని చూపుతుంది; ‘అలాగే’ సహజంగా, సంక్షిప్తంగా ఆ సంబంధాన్ని నిలుపుతుంది.
- source_word: σεμνάς
  choice: గౌరవప్రదంగా ఉండాలి
  rationale: σεμνός సూచించే గంభీరత, గౌరవానికి తగిన ప్రవర్తన అనే భావాలను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: μὴ διαβόλους
  choice: అపనిందలు మోపేవారిగా కాక
  rationale: ఇక్కడ διάβολος నామవాచక బిరుదుగా కాక, ఇతరులపై అపవాదం లేదా అపనింద మోపే స్వభావాన్ని సూచించే విశేషణార్థంలో ఉంది.
- source_word: νηφαλίους
  choice: నిగ్రహం గలవారిగా
  rationale: νηφάλιοςలోని మితత్వం, అప్రమత్తమైన మనస్సు, ప్రవర్తనా నియంత్రణ భావాలను ‘నిగ్రహం’ సహజమైన తెలుగులో సమగ్రంగా అందిస్తుంది.
- source_word: πιστὰς
  choice: నమ్మకస్థులుగా
  rationale: ఈ గుణాల జాబితాలో πιστός ప్రధానంగా విశ్వసనీయత, నిబద్ధత గల స్వభావాన్ని సూచిస్తుంది; ‘నమ్మకస్థులు’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἐν πᾶσιν
  choice: అన్ని విషయాల్లో
  rationale: గ్రీకు పదబంధంలోని సమగ్రతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: అర్హతల జాబితాలో γυναῖκας ఎవరిని సూచిస్తుంది?
  choice: స్త్రీలు
  alternative: భార్యలు
  rationale: ఈ పదం పరిచర్యలో ఉన్న స్త్రీలను సూచిస్తుందా, లేక పురుష పరిచారకుల భార్యలను సూచిస్తుందా అనేది సందర్భంలో వివాదాస్పదం. గ్రీకులో రెండూ సాధ్యమే; అయితే ‘వారి’ అనే స్వామ్యసూచకం లేదు. అందువల్ల ప్రధాన పాఠంలో విస్తృతమైన ‘స్త్రీలు’ అని ఉంచి, ‘భార్యలు’ అనే పఠనాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు మూలంలోని సంక్షిప్త గుణాల జాబితా నిర్మాణాన్ని సహజమైన తెలుగు వాక్యక్రమంలో నిలిపాం.
