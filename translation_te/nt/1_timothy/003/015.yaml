review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Paul’s possible delay, God’s household, the living God, and the architectural metaphor. However, “నీవు తెలుసుకోవాలి” changes the ἵνα purpose clause into an imperative-like necessity and leaves δεῖ insufficiently represented. The translation should express both the purpose (“so that you may know”) and the normative force (“should/must conduct oneself”).
  naturalness: “దేవుని ఇంటివారిలో” and the subsequent “ఆ ఇంటివారే” are understandable but less idiomatic and less coherent than treating οἶκος as the collective “దేవుని కుటుంబం.” The revised wording is natural modern standard Telugu while retaining the household metaphor.
  terminology: “సజీవుడైన దేవుడు,” “సంఘం,” “స్తంభం,” and “ఆధారం” are appropriate. “ఆధారం” is a suitably non-exclusive rendering of ἑδραίωμα, with alternatives retained in a footnote.
  issues:
  - severity: medium
    issue: The purpose clause and δεῖ are not fully represented.
    rationale: ἵνα εἰδῇς means “so that you may know,” while δεῖ governs the infinitive and expresses what one ought/needs to do. “నీవు తెలుసుకోవాలి” primarily makes knowing obligatory and does not clearly convey the purpose relationship inherited from the preceding writing context.
  - severity: low
    issue: The household expression is awkwardly recast as household members.
    rationale: ἐν οἴκῳ θεοῦ is singular and denotes God’s household. “దేవుని కుటుంబంలో,” followed by “ఆ కుటుంబమే,” preserves the collective metaphor and reads more naturally than “ఇంటివారిలో ... ఇంటివారే.”}],
