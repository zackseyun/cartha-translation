revisions:
- from: అయితే నేను రావడం ఆలస్యమైతే, దేవుని ఇంటివారిలో[a] ఎలా ప్రవర్తించాలో నీవు తెలుసుకోవాలి. ఆ ఇంటివారే సజీవుడైన దేవుని సంఘం—సత్యానికి స్తంభం, ఆధారం[b].
  to: అయితే నేను రావడం ఆలస్యమైతే, దేవుని కుటుంబంలో ఎలా ప్రవర్తించవలెనో నీవు తెలుసుకునేలా నేను రాస్తున్నాను. ఆ కుటుంబమే సజీవుడైన దేవుని సంఘం—సత్యానికి స్తంభం, ఆధారం[b].
  rationale: 'The revision restores the Greek purpose clause and the normative force of δεῖ: Paul writes so that Timothy may know how one ought to conduct oneself. “నేను రాస్తున్నాను” makes explicit the verb supplied by the immediate preceding context (3:14), as also reflected in the English audit trail. “దేవుని కుటుంబం” preserves οἶκος as a collective household metaphor and allows the explanatory relative clause to read naturally. Footnote a is retained as a lexical alternative but is not anchored in the revised main text, so it should be removed unless the platform requires all supplied footnotes to be displayed; the complete active footnote set therefore contains b only.'
