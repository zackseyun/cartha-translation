id: 1TI.3.15
reference: 1 Timothy 3:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν δὲ βραδύνω, ἵνα εἰδῇς πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι, ἥτις ἐστὶν ἐκκλησία θεοῦ ζῶντος, στῦλος καὶ ἑδραίωμα τῆς ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/015.yaml
  text: But if I am delayed[a], I write so that you may know how one ought to conduct oneself in the household of God, which is the assembly of the living God[b], the pillar and support of the truth.
translation:
  language: te
  text: అయితే నేను రావడం ఆలస్యమైతే, దేవుని కుటుంబంలో ఎలా ప్రవర్తించవలెనో నీవు తెలుసుకునేలా నేను రాస్తున్నాను. ఆ కుటుంబమే సజీవుడైన దేవుని సంఘం—సత్యానికి స్తంభం, ఆధారం[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘ఆధారం’కు మూలపదం స్థిరపరచే లేదా నిలబెట్టే దానిని సూచిస్తుంది; ‘పునాది,’ ‘బలమైన మద్దతు’ అనే అనువాదాలూ ప్రతిపాదించబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: βραδύνω
  choice: నేను రావడం ఆలస్యమైతే
  rationale: సందర్భంలో పౌలు రావడంలో కలిగే ఆలస్యాన్ని సూచిస్తుంది. ‘రావడం’ అనేది తెలుగులో భావాన్ని సహజంగా స్పష్టం చేస్తుంది; నైతికమైన మందకొడితనాన్ని సూచించదు.
- source_word: ἵνα εἰδῇς
  choice: నీవు తెలుసుకోవాలి
  rationale: ఉద్దేశార్థాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ముందు వచనంలోని రాయడమనే క్రియతో భావసంబంధం నిలుస్తుంది.
- source_word: δεῖ ... ἀναστρέφεσθαι
  choice: ఎలా ప్రవర్తించాలో
  rationale: δεῖ సూచించే నియమాత్మక అవసరతను, ἀναστρέφεσθαι సూచించే నడవడి లేదా జీవనరీతిని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν οἴκῳ θεοῦ
  choice: దేవుని ఇంటివారిలో
  rationale: οἶκος ఇక్కడ భవనంకన్నా దేవునికి చెందిన కుటుంబం లేదా గృహసమూహాన్ని సూచిస్తుంది; తరువాతి ἐκκλησία అనే వివరణతో ఈ అర్థం బాగా సరిపోతుంది.
- source_word: ἥτις ἐστὶν
  choice: ఆ ఇంటివారే
  rationale: ముందున్న ‘దేవుని ఇంటివారు’ అనే భావాన్ని వివరిస్తూ ἐκκλησίαతో సమానీకరించే గ్రీకు నిర్మాణాన్ని తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: ἐκκλησία
  choice: సంఘం
  rationale: ఇక్కడ దేవునికి చెందిన సమకూడిన ప్రజాసమూహాన్ని సూచించడానికి ఆధునిక తెలుగులో ‘సంఘం’ సహజమైనది; ఇది కేవలం భవనాన్ని సూచించదు.
- source_word: θεοῦ ζῶντος
  choice: సజీవుడైన దేవుని
  rationale: గ్రీకు షష్ఠీబంధాన్ని సహజమైన తెలుగులో ఉంచి, దేవుడు జీవించేవాడనే భావోద్దీపనను కాపాడుతుంది.
- source_word: στῦλος
  choice: స్తంభం
  rationale: నిర్మాణ సంబంధమైన రూపకాన్ని నేరుగా, సుపరిచితంగా తెలియజేస్తుంది.
- source_word: ἑδραίωμα
  choice: ఆధారం
  rationale: స్థిరత్వం కలిగించే లేదా నిలబెట్టే దానిని సూచించే అరుదైన గ్రీకు నామవాచకానికి ‘ఆధారం’ విస్తృతమైన, మితమైన సమానార్థకం; ‘పునాది’ అని మాత్రమే నిర్ణయించదు.
- source_word: τῆς ἀληθείας
  choice: సత్యానికి
  rationale: స్తంభం, ఆధారం రెండూ సత్యానికి సంబంధించినవని తెలుగులో సహజమైన విభక్తితో చూపుతుంది.
theological_decisions:
- issue: ἐκκλησίαను సంఘశాస్త్ర సందర్భంలో ఎలా అనువదించాలి
  choice: సంఘం
  alternative: సభ; చర్చి
  rationale: గ్రీకు పదం ప్రధానంగా దేవుని సమకూడిన ప్రజలను సూచిస్తుంది. ‘సంఘం’ తెలుగు క్రైస్తవ వాడుకలో సహజంగా ఉండటంతోపాటు ప్రజాసమూహ భావాన్ని నిలుపుతుంది; కేవలం సంస్థ లేదా భవనం అనే భావాన్ని బలవంతంగా రుద్దదు.
- issue: సంఘం ‘సత్యానికి స్తంభం, ἑδραίωμα’ అనే వాక్యభాగం
  choice: సత్యానికి స్తంభం, ఆధారం
  alternative: సత్యానికి స్తంభం, పునాది; సత్యానికి స్తంభం, దుర్గం
  rationale: గ్రీకు వాక్యనిర్మాణం ఈ విశేషణాన్ని సజీవుడైన దేవుని సంఘానికే ఆపాదిస్తుంది. ‘ఆధారం’ సంఘం సత్యాన్ని నిలబెట్టి స్థిరపరచే ఉన్నత పాత్రను కాపాడుతుంది; సంఘమే సత్యానికి మూలమని అదనంగా నిర్ధారించదు. అరుదైన ἑδραίωμα పదంలోని అనిశ్చితిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘ఇంటివారు’ కుటుంబ/గృహసమూహ భావాన్ని అందరికీ అర్థమయ్యేలా ఉంచుతుంది. గ్రీకులో ఈ వచనంలో ప్రత్యక్షంగా లేని ‘నేను రాస్తున్నాను’ అనే మాటను ప్రధాన పాఠ్యంలో చేర్చకుండా, ముందు వచనంతో ఉన్న ఉద్దేశ సంబంధాన్ని ‘నీవు తెలుసుకోవాలి’ ద్వారా నిలిపాం.
