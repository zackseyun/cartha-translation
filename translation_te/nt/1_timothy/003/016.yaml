id: 1TI.3.16
reference: 1 Timothy 3:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὁμολογουμένως μέγα ἐστὶν τὸ τῆς εὐσεβείας μυστήριον· ⸀Ὃς ἐφανερώθη ἐν σαρκί, ἐδικαιώθη ἐν πνεύματι, ὤφθη ἀγγέλοις, ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, ἀνελήμφθη ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/016.yaml
  text: 'And undeniably[a], great is the mystery of godliness:

    He was revealed in flesh,

    was vindicated in spirit,

    was seen by angels,

    was proclaimed among the nations,

    was believed on in the world[d][c][b],

    was taken up in glory.'
translation:
  language: te
  text: 'నిస్సందేహంగా, దైవభక్తి యొక్క మర్మం గొప్పది:


    ఆయన[a] శరీరంలో ప్రత్యక్షమయ్యాడు,


    ఆత్మలో నీతిమంతుడని నిరూపించబడ్డాడు[b],


    దూతలకు కనిపించాడు,


    జనాంగాల మధ్య ప్రకటించబడ్డాడు[c],


    లోకంలో ఆయనను విశ్వసించారు,


    మహిమలో పైకి తీసుకోబడ్డాడు[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో, ‘ఆయన శరీరంలో ప్రత్యక్షమయ్యాడు’ అనే బదులు ‘దేవుడు శరీరంలో ప్రత్యక్షమయ్యాడు’ అని ఉంది. ఇక్కడ అనుసరించిన విమర్శాత్మక గ్రీకు పాఠంలో ‘ఎవడు/ఆయన’ అని ఉంది.
    reason: textual_variant
  - marker: b
    text: లేదా ‘ఆత్మచేత నీతిమంతుడని నిరూపించబడ్డాడు’ లేదా ‘ఆత్మలో నీతిమంతుడని నిరూపించబడ్డాడు.’ ఈ సంక్షిప్త గ్రీకు పదబంధం పరిశుద్ధాత్మ కార్యసాధకత్వాన్ని గానీ, ఆత్మసంబంధమైన జీవన పరిధిని గానీ సూచించవచ్చు.
    reason: alternative_reading
  - marker: c
    text: లేదా ‘అన్యజనుల మధ్య ప్రకటించబడ్డాడు.’
    reason: lexical_alternative
  - marker: d
    text: లేదా ‘మహిమలోనికి పైకి తీసుకోబడ్డాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογουμένως
  choice: నిస్సందేహంగా
  rationale: బహిరంగంగా అంగీకరించబడినదనే భావాన్ని ప్రాచీన లేదా కృత్రిమ పదబంధం లేకుండా సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μέγα ἐστὶν
  choice: గొప్పది
  rationale: గ్రీకు వాక్యంలో ఉన్న ఉద్ఘాటనను తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: τὸ τῆς εὐσεβείας μυστήριον
  choice: దైవభక్తికి సంబంధించిన మర్మం
  rationale: μυστήριον అనే పదంలోని, ఒకప్పుడు మరుగై ఇప్పుడు బయలుపరచబడిన దైవసత్యం అనే పౌలు సంబంధ భావాన్ని ‘మర్మం’ నిలుపుతుంది; εὐσέβεια ను సాధారణ మతవ్యవస్థగా కాక భక్తిపూర్వక జీవనంగా ‘దైవభక్తి’ తెలియజేస్తుంది.
- source_word: Ὃς
  choice: ఆయన
  rationale: విమర్శాత్మక గ్రీకు పాఠంలోని పుంలింగ సంబంధ సర్వనామాన్ని సహజమైన తెలుగు వ్యక్తి సూచనగా అందిస్తుంది; ‘దేవుడు’ అనే పాఠాంతరాన్ని ప్రధాన పాఠ్యంలోకి దిగుమతి చేయదు.
- source_word: ἐφανερώθη ἐν σαρκί
  choice: శరీరంలో ప్రత్యక్షమయ్యాడు
  rationale: మానవ శరీరధారణలో బహిర్గతమయ్యాడనే భావాన్ని స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది; σάρξ ను రూపకాలంకారంగా మార్చదు.
- source_word: ἐδικαιώθη
  choice: నీతిమంతుడని నిరూపించబడ్డాడు
  rationale: ఇక్కడ ‘నీతిమంతునిగా చేయబడ్డాడు’ అనే అర్థం కాక, ఆయన న్యాయమైనవాడని లేదా సరైనవాడని వెల్లడై ధృవీకరించబడిన భావాన్ని తెలియజేస్తుంది.
- source_word: ἐν πνεύματι
  choice: ఆత్మలో
  rationale: పరిశుద్ధాత్మ కార్యసాధకత్వమా లేక ఆత్మసంబంధమైన జీవన పరిధియా అనే గ్రీకు పదబంధంలోని సంక్షిప్తతను, సందిగ్ధతను ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: ὤφθη ἀγγέλοις
  choice: దూతలకు కనిపించాడు
  rationale: దత్తి విభక్తిని ‘దూతలకు’ అని సహజంగా అందిస్తూ, ఆయన వారికి దర్శనమిచ్చాడనే భావాన్ని తెలియజేస్తుంది.
- source_word: ἐκηρύχθη ἐν ἔθνεσιν
  choice: జనాల మధ్య ప్రకటించబడ్డాడు
  rationale: κηρύσσω లోని బహిరంగ ప్రకటన భావాన్ని నిలుపుతూ, ἔθνη అనే పదంలోని ‘జనాలు/అన్యజనులు’ అర్థ పరిధిని ప్రధాన పాఠ్యంలో విస్తృతంగా అందిస్తుంది.
- source_word: ἐπιστεύθη ἐν κόσμῳ
  choice: లోకంలో ఆయనను విశ్వసించారు
  rationale: గ్రీకు కర్మణి నిర్మాణాన్ని తెలుగులో అసహజంగా అనుకరించకుండా, లోకమంతటా ప్రజలు ఆయనపై విశ్వాసముంచారనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀνελήμφθη ἐν δόξῃ
  choice: మహిమలో పైకి తీసుకోబడ్డాడు
  rationale: కర్మణి క్రియను, ἐν పదబంధంలోని ‘మహిమలో’ అనే రూపాన్ని నిలుపుతూ ఆరోహణ భావాన్ని తెలియజేస్తుంది; ‘మహిమలోనికి’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
theological_decisions:
- issue: 'కీర్తన ఆరంభంలోని పాఠాంతరం: Ὃς / θεός / ὅ'
  choice: విమర్శాత్మక పాఠంలోని Ὃς ను వ్యక్తిని సూచించే ‘ఆయన’గా అనువదించడం
  alternative: ‘దేవుడు శరీరంలో ప్రత్యక్షమయ్యాడు’ లేదా ‘ఏది శరీరంలో ప్రత్యక్షమైందో’
  rationale: SBLGNT పాఠం Ὃς (‘ఎవడు/ఆయన’) అని ఉంది. సందర్భం క్రీస్తును సూచించినా, ప్రధాన పాఠ్యంలో θεός అనే చారిత్రక పాఠాంతరాన్ని చేర్చకుండా పాఠ్య ఆధారాన్ని పారదర్శకంగా నిలుపుతుంది.
- issue: ἐν πνεύματι యొక్క సూచన
  choice: ప్రధాన పాఠ్యంలో తటస్థంగా ‘ఆత్మలో’ అని ఉంచడం
  alternative: ‘ఆత్మచేత’ లేదా పరిశుద్ధాత్మను స్పష్టంగా సూచించే ‘పరిశుద్ధాత్మలో’
  rationale: ఇది పరిశుద్ధాత్మ కార్యసాధకత్వాన్ని సూచించవచ్చు; లేదా శరీరానికి సమాంతరంగా ఆత్మసంబంధమైన పరిధి/స్థితిని సూచించవచ్చు. గ్రీకు వ్యాకరణం ఒక్క అర్థాన్నే నిర్బంధించదు కాబట్టి ప్రధాన పాఠ్యం ఆ ఉద్రిక్తతను పరిష్కరించదు.
- issue: ἐν δόξῃ యొక్క దిశ లేదా పరిధి
  choice: ‘మహిమలో’ అని రూపపరంగా సమీపంగా అనువదించడం
  alternative: ‘మహిమలోనికి’
  rationale: ἐν సాధారణంగా ‘లో’ అని సూచించినా, ἀναλαμβάνω అనే చలన క్రియతో గమ్య భావం సందర్భానుసారంగా సాధ్యమే. ప్రధాన పాఠ్యం గ్రీకు రూపాన్ని నిలుపుతూ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన కీర్తనా లయను ఉపయోగించాం. ఆరు సమాంతర పంక్తుల నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపాం. తెలుగులో తీవ్ర అసహజత కలిగించే చోట మాత్రమే, ముఖ్యంగా ἐπιστεύθη వద్ద, కర్మణి నిర్మాణాన్ని సహజమైన కర్తరి ప్రయోగంగా మార్చాం.
