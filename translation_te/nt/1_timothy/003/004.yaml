translation:
  language: te
  text: తన సొంత కుటుంబాన్ని చక్కగా నడిపించేవాడై[a], పూర్తి గంభీరతతో విధేయులైన పిల్లలు గలవాడై ఉండాలి[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన సొంత కుటుంబానికి చక్కగా నాయకత్వం వహించేవాడై’ లేదా ‘తన సొంత ఇంటిని చక్కగా పాలించేవాడై.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తన పిల్లలను విధేయతలో ఉంచేవాడై’ లేదా ‘తన పిల్లలను అదుపులో ఉంచేవాడై.’
    reason: lexical_alternative
  - marker: c
    text: ‘పూర్తి గంభీరతతో’ అనే మాట పిల్లల విధేయత తీరు గురించి గానీ, అతడు తన కుటుంబాన్ని నడిపించే మొత్తం తీరు గురించి గానీ చెప్పవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ ἰδίου οἴκου
  choice: తన సొంత కుటుంబాన్ని
  rationale: οἶκος ఇక్కడ భవనం కంటే ఇంటివారితో కూడిన కుటుంబ పరిధిని సూచిస్తుంది. ‘కుటుంబం’ ఆధునిక తెలుగులో సహజంగా ఉండి, ἰδίου లోని ‘తన సొంత’ అనే భావాన్ని నిలుపుతుంది.
- source_word: καλῶς
  choice: చక్కగా
  rationale: కుటుంబ నిర్వహణ జరిగే విధానాన్ని సూచించే ఈ క్రియావిశేషణానికి ‘చక్కగా’ సహజమైన, విస్తృతార్థకమైన సమానం.
- source_word: προϊστάμενον
  choice: నడిపించేవాడై
  rationale: ప్రొΐస్థేమి బాధ్యతతో ముందుండి పర్యవేక్షించడాన్ని సూచిస్తుంది. ‘నడిపించు’ నిజమైన నాయకత్వం, బాధ్యత రెండింటినీ తెలియజేస్తూ, ‘పాలించు’ వల్ల రావచ్చే కఠిన ధ్వనిని నివారిస్తుంది.
- source_word: τέκνα ἔχοντα
  choice: తన పిల్లలను ... ఉంచేవాడై
  rationale: తెలుగులో ‘పిల్లలను విధేయతలో కలిగియుండి’ కంటే ‘విధేయతలో ఉంచు’ సహజం. ఇది ఆ వ్యక్తి కుటుంబ బాధ్యతను సూచిస్తుంది; పిల్లల స్వభావాన్ని మాత్రమే వర్ణించదు.
- source_word: ἐν ὑποταγῇ
  choice: విధేయతలో
  rationale: ὑποταγή లోని లోబడిన క్రమం లేదా సమర్పణ భావాన్ని ‘విధేయత’ తెలియజేస్తుంది. ‘అదుపులో’ అనడం బాహ్య నియంత్రణ భావాన్ని అతిగా నొక్కవచ్చు.
- source_word: μετὰ πάσης σεμνότητος
  choice: సంపూర్ణ గౌరవప్రదతతో
  rationale: σεμνότης గంభీరత, మర్యాద, గౌరవనీయ ప్రవర్తనలను సూచిస్తుంది. ‘గౌరవప్రదత’ నైతిక గంభీరతను నిలుపుతుంది; πάσης ను ‘సంపూర్ణ’గా వ్యక్తం చేశాం.
theological_decisions:
- issue: కుటుంబ నాయకత్వ భాష యొక్క పరిధి
  choice: పర్యవేక్షకునిగా ఉండబోయే వ్యక్తి తన కుటుంబాన్ని బాధ్యతతో నడిపించడాన్ని అర్హతగా వర్ణించడం
  alternative: అన్ని అధికార సంబంధాలపై విస్తృత సిద్ధాంత ప్రకటనగా చదవడం, లేదా అధికార భావాన్ని కేవలం సంరక్షణకు పరిమితం చేయడం
  rationale: προϊστάμενον మరియు ὑποταγή నిజమైన బాధ్యతాయుత నాయకత్వం, క్రమాన్ని సూచిస్తాయి. అయితే ఈ వచనం కుటుంబ వ్యవస్థపై సంపూర్ణ సిద్ధాంతాన్ని ఇవ్వకుండా ఒక అర్హతను మాత్రమే పేర్కొంటుంది.
- issue: ‘సంపూర్ణ గౌరవప్రదతతో’ అనే పదబంధపు అన్వయం
  choice: ఇది పిల్లల విధేయతకో, ఆ వ్యక్తి కుటుంబ నిర్వహణ మొత్తానికో అన్వయించవచ్చనే సందిగ్ధతను ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: దీనిని పిల్లల ప్రవర్తనకు మాత్రమే లేదా తండ్రి నిర్వహణకు మాత్రమే ఖచ్చితంగా అన్వయించడం
  rationale: గ్రీకు వాక్యనిర్మాణం రెండు అన్వయాల చర్చకు అవకాశం ఇస్తుంది. పదక్రమాన్ని దగ్గరగా ఉంచి, పాదటిప్పణిలో సందిగ్ధతను స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. గ్రీకు వచనంలోని రెండు వర్తమాన కృదంతాలను ‘నడిపించేవాడై’, ‘ఉంచేవాడై ఉండాలి’గా సమన్వయపరచాం. ‘కుటుంబం’ relational household భావాన్ని, ‘విధేయత’ ὑποταγή లోని క్రమాన్ని తెలియజేస్తాయి. [a], [b], [c] గుర్తులన్నీ ప్రధాన పాఠ్యంలో ఉన్నాయి.
