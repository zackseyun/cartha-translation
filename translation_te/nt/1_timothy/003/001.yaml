  source_fidelity: The draft accurately conveys the formula Πιστὸς ὁ λόγος, the generic conditional εἴ τις, and the work-focused force of καλοῦ ἔργου. However, «కోరుకుంటున్నట్టే» means ‘as though [he/she] desires’ or ‘it is as if [one] desires,’ rather than the Greek's direct assertion ἐπιθυμεῖ (‘desires’).
  naturalness: The Telugu is otherwise modern, clear, and appropriately dignified. Replacing the inferential-sounding «-ట్టే» with a direct finite verb makes the closing clause idiomatic and faithful.
  terminology: «పర్యవేక్షణ బాధ్యత» suitably renders ἐπισκοπή without imposing later episcopal structures. The alternative footnote appropriately supplies ‘పర్యవేక్షకుని పదవి’ and the traditional ‘బిషప్పు పదవి.’
  issues:
  - severity: medium
    issue: «కోరుకుంటున్నట్టే» does not directly translate ἐπιθυμεῖ.
    rationale: 'The suffix «-ట్టే» introduces an ‘as if/indeed’ nuance. The Greek makes a straightforward statement: the person desires a good work. «కోరుకుంటున్నాడు» preserves this assertion while Telugu leaves the person’s gender unmarked.'
