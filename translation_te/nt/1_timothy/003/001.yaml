id: 1TI.3.1
reference: 1 Timothy 3:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πιστὸς ὁ λόγος· εἴ τις ἐπισκοπῆς ὀρέγεται, καλοῦ ἔργου ἐπιθυμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/001.yaml
  text: 'This saying is trustworthy: if anyone aspires to oversight[b][a], he desires a good work.'
translation:
  language: te
  text: 'ఈ మాట నమ్మదగినది: ఎవరైనా పర్యవేక్షణ బాధ్యతను చేపట్టాలని ఆశిస్తే,[a] మంచి పనిని కోరుకుంటున్నాడు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పర్యవేక్షకుని పదవిని”; సంప్రదాయ అనువాదంలో, “బిషప్పు పదవిని.”
    reason: alternative_reading
  - marker: b
    text: లేదా, “గౌరవప్రదమైన బాధ్యతను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: ఈ మాట నమ్మదగినది
  rationale: పాస్టోరల్ పత్రికల్లో విశ్వసనీయమైన ప్రకటనను పరిచయం చేసే సూత్రవాక్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; λόγοςకు ఈ సందర్భంలో ‘మాట’ సరిపోతుంది.
- source_word: εἴ τις
  choice: ఎవరైనా
  rationale: τις ఇక్కడ అనిర్దిష్టంగా, సాధారణార్థంలో ఉంది; గ్రీకు పదంలో లేని పురుష-నిర్దిష్టతను అనువాదంలో చేర్చదు.
- source_word: ἐπισκοπῆς
  choice: పర్యవేక్షణ బాధ్యతను
  rationale: పర్యవేక్షించడం, దానికి సంబంధించిన బాధ్యత అనే భావాన్ని నిలుపుతూ, తరువాతి కాలపు స్థిరమైన సంఘ పదవీ వ్యవస్థను ముందుగానే పాఠ్యంలోకి తీసుకురాదు.
- source_word: ὀρέγεται
  choice: చేపట్టాలని ఆశిస్తే
  rationale: దేనివైపైనా చాచుకోవడం నుంచి ‘ఆశించడం, సాధించాలని కోరడం’ అనే భావాన్ని ఈ సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: καλοῦ ἔργου
  choice: మంచి పనిని
  rationale: καλός యొక్క ‘మంచి/శ్రేష్ఠమైన’ భావాన్నీ, ἔργονలోని పని అనే ప్రాధాన్యాన్నీ నేరుగా నిలుపుతుంది; హోదాకన్నా చేయవలసిన పనిపై దృష్టి ఉంటుంది.
- source_word: ἐπιθυμεῖ
  choice: కోరుకుంటున్నట్టే
  rationale: కోరడం అనే సానుకూల భావాన్ని అతిశయింపకుండా తెలియజేస్తుంది; తెలుగులో కర్తను మళ్లీ పేర్కొనకపోవడం వల్ల గ్రీకులో లేని లింగ నిర్దిష్టత చేరదు.
theological_decisions:
- issue: ἐπισκοπῆςను తరువాతి కాలపు సంఘ పదవీ పరిభాషతో అనువదించాలా
  choice: పర్యవేక్షణ బాధ్యత
  alternative: పర్యవేక్షకుని పదవి; బిషప్పు పదవి
  rationale: మూలపదం పర్యవేక్షణను లేదా పర్యవేక్షకుని పాత్రను సూచించగలదు. విస్తృతమైన మూలార్థాన్ని ఉంచడం వల్ల ఏదైనా ప్రత్యేక సంఘ పరిపాలనా వ్యవస్థను పాఠ్యంపై రుద్దడం నివారించబడుతుంది.
- issue: εἴ τιςను పురుషునికి మాత్రమే వర్తించేలా అనువదించాలా
  choice: ఎవరైనా
  alternative: ఒక పురుషుడు
  rationale: ఈ అనిర్దిష్ట సర్వనామం స్వతహాగా సాధారణార్థకమైనది. ఈ పదబంధం ఒక్కదానినుంచి పురుషులకు మాత్రమే పరిమితి ఉందని అనువాదం నిర్ణయించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘పర్యవేక్షణ బాధ్యత’ మూలంలోని కార్యభావాన్ని ఉంచుతుంది; ‘కోరుకుంటున్నట్టే’ కర్తను పునరుక్తి చేయకుండా సాధారణార్థాన్ని సహజంగా నిలుపుతుంది.
