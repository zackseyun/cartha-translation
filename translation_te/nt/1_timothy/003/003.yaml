translation:
  language: te
  text: మద్యానికి బానిస కాకుండా[a], కొట్టేవాడిగా కాకుండా[b], సౌమ్యుడిగా, కలహప్రియుడిగా కాకుండా[c], డబ్బుపట్ల ప్రేమ లేనివాడిగా[d] ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ద్రాక్షామద్యానికి అలవాటుపడకుండా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘హింసాత్మకుడిగా కాకుండా’; మూలపదం ముఖ్యంగా శారీరక దౌర్జన్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘జగడాలు పెట్టుకోకుండా.’
