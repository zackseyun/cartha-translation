    issue: «హింసకు పాల్పడకుండా» for πλήκτην is overly broad.
    rationale: The Greek term literally identifies a striker and especially evokes physical aggressiveness. A rendering centered on striking better preserves this lexical force.
  - severity: low
    issue: The footnote alternative «ద్రాక్షారసానికి బానిస కాకుండా» can be ambiguous in modern Telugu.
