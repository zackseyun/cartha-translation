lexical_decisions:
- source_word: πάροινον
  choice: మద్యానికి బానిస కాకుండా
  rationale: ఈ పదం ద్రాక్షారసానికి అలవాటుపడిన లేదా మద్యపానంలో మునిగిన వ్యక్తిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘మద్యానికి బానిస’ అనేది ఒకసారి తాగడాన్ని కాక, స్థిరమైన వ్యసన స్వభావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: πλήκτην
  choice: హింసకు పాల్పడకుండా
  rationale: మూలపదం అక్షరార్థంగా కొట్టే వ్యక్తిని సూచించినా, ఇక్కడ శారీరక దౌర్జన్యానికి దిగే స్వభావం ఉద్దేశించబడింది. ఈ అనువాదం ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἐπιεικῆ
  choice: సౌమ్యుడిగా
  rationale: ఈ పదంలో మృదుత్వం, సహనం, ఇతరుల విషయంలో న్యాయబద్ధమైన ఉదారత అనే భావాలు ఉన్నాయి. అర్హతల జాబితాలో ‘సౌమ్యుడు’ సంక్షిప్తంగా, సహజంగా సరిపోతుంది.
- source_word: ἄμαχον
  choice: జగడాలు పెట్టుకోకుండా
  rationale: ఈ పదం పోట్లాటలకు లేదా వాగ్వివాదాలకు మొగ్గుచూపని స్వభావాన్ని సూచిస్తుంది. సాధారణ ఆధునిక తెలుగులో ఈ రూపం స్పష్టంగా అర్థమవుతుంది.
- source_word: ἀφιλάργυρον
  choice: డబ్బును ప్రేమించకుండా
  rationale: సమాసపదం డబ్బు లేదా వెండిపై ప్రేమను నేరుగా నిరాకరిస్తుంది. అందువల్ల కేవలం దురాశకంటే అంతర్గత మమకారాన్ని ఈ అనువాదం కాపాడుతుంది.
