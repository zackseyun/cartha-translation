id: 1TI.3.13
reference: 1 Timothy 3:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ γὰρ καλῶς διακονήσαντες βαθμὸν ἑαυτοῖς καλὸν περιποιοῦνται καὶ πολλὴν παρρησίαν ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/013.yaml
  text: For those who have served well obtain for themselves a good standing and great boldness in the faith that is in Messiah Jesus[a][b][c].
translation:
  language: te
  text: ఎందుకంటే, బాగా సేవ చేసినవారు మంచి స్థానం సంపాదించుకుంటారు; మెస్సీయ[c] యేసులో ఉన్న విశ్వాసంలో[b] గొప్ప ధైర్యాన్ని[a] కూడా పొందుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గొప్ప ఆత్మవిశ్వాసాన్ని”; గ్రీకు పదం ధైర్యం, ఆత్మవిశ్వాసం, లేదా స్వేచ్ఛగా మాట్లాడే ధోరణిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మెస్సీయ యేసులో ఉన్న విశ్వాస్యతలో.” గ్రీకు πίστις అనే పదానికి “విశ్వాసం,” “నమ్మకం,” లేదా “విశ్వాస్యత” అనే అర్థాలు ఉండవచ్చు.
    reason: alternative_reading
  - marker: c
    text: గ్రీకులో “క్రీస్తు”; ఇక్కడ అది బిరుదుగా పనిచేస్తున్నందున “మెస్సీయ” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονήσαντες
  choice: సేవ చేసినవారు
  rationale: ఈ క్రియ సందర్భంలో పరిచారకులుగా సేవ చేసినవారిని సూచించినా, పదానికి స్వయంగా ‘సేవ చేయడం’ అనే విస్తృత అర్థం ఉంది. అందువల్ల పదవిపేరును క్రియలోకి చేర్చకుండా మూలార్థాన్ని నిలుపుతుంది.
- source_word: καλῶς
  choice: చక్కగా
  rationale: διακονήσαντες అనే క్రియను విశేషించే క్రియావిశేషణం; ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ‘బాగా/యోగ్యంగా’ సేవ చేశారనే భావాన్ని ఇస్తుంది.
- source_word: βαθμὸν ... καλὸν
  choice: మంచి స్థానం
  rationale: βαθμός అక్షరార్థంగా మెట్టు, స్థాయి లేదా హోదాను సూచించగలదు. ఇక్కడ నమ్మకమైన సేవ వల్ల కలిగే గౌరవప్రదమైన స్థితిని రూపకంగా సూచిస్తున్నందున ‘మంచి స్థానం’ తగినది; సంఘపరమైన పదోన్నతిని అనవసరంగా సూచించదు.
- source_word: περιποιοῦνται
  choice: తమకోసం ... సంపాదించుకుంటారు
  rationale: మధ్యమవాచకంలోని స్వప్రయోజన భావాన్ని ‘తమకోసం’ మరియు ‘సంపాదించుకుంటారు’ సహజంగా వ్యక్తపరుస్తాయి.
- source_word: παρρησίαν
  choice: ధైర్యం
  rationale: παρρησία బాహాటత, స్వేచ్ఛగా మాట్లాడగల ధైర్యం, లేదా నమ్మకాన్ని సూచించగలదు. ‘గొప్ప ధైర్యం’ పదంలోని బలాన్ని నిలుపుతుంది; ‘గొప్ప నమ్మకం’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: πίστει
  choice: విశ్వాసం
  rationale: πίστις‌కు విశ్వాసం, నమ్మకం, నమ్మకత్వం అనే భావాలు సాధ్యమైనా, ఈ సందర్భంలో ప్రధాన పాఠానికి ‘విశ్వాసం’ సహజమైన ఎంపిక. ‘నమ్మకత్వం’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో నిలుపుతున్నాం.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసులో ఉన్న
  rationale: ఉపపదంతో కూడిన ఈ పూర్వప్రత్యయ పదబంధం πίστειని విశేషిస్తుంది. ‘మెస్సీయ యేసులో ఉన్న విశ్వాసం’ అనే నిర్మాణం గ్రీకు సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: Χριστῷ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తుంది; అందుచేత దాని అర్థాన్ని తెలియజేసే ‘మెస్సీయ’ను ఉపయోగించాం.
theological_decisions:
- issue: ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦలో πίστις అర్థం
  choice: మెస్సీయ యేసులో ఉన్న విశ్వాసం
  alternative: మెస్సీయ యేసులో ఉన్న నమ్మకత్వం
  rationale: ఈ పదబంధం మెస్సీయ యేసులో కేంద్రీకృతమైన విశ్వాసాన్ని సూచించడం అత్యంత సహజం. అయితే πίστις‌కు ‘నమ్మకత్వం’ అనే అర్థం కూడా సాధ్యమే కాబట్టి ఆ సందిగ్ధతను పాదసూచికలో కాపాడాం.
- issue: βαθμὸν καλὸν సంఘపరమైన పదోన్నతిని సూచిస్తుందా?
  choice: మంచి స్థానం
  alternative: మంచి హోదా / మంచి మెట్టు
  rationale: గ్రీకు రూపకం స్థానం లేదా స్థాయిని సూచిస్తుంది; అది తప్పనిసరిగా అధికారిక సంఘపదోన్నతి అని పాఠం నిర్ధారించదు. అందువల్ల తటస్థమైన ‘మంచి స్థానం’ ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘పరిచారకులుగా సేవ చేసినవారు’ అని విస్తరించకుండా క్రియ యొక్క విస్తృత మూలార్థాన్ని నిలిపాం. మూలంలోని γάρను ‘ఎందుకంటే’గా, καὶను రెండవ ఫలితాన్ని కలిపే ‘కూడా’గా వ్యక్తపరచాం. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
