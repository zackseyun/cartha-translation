id: 1TI.5.21
reference: 1 Timothy 5:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃ καὶ τῶν ἐκλεκτῶν ἀγγέλων, ἵνα ταῦτα φυλάξῃς χωρὶς προκρίματος, μηδὲν ποιῶν κατὰ πρόσκλισιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/021.yaml
  text: I solemnly charge you in the presence of God and Messiah Jesus and the chosen angels[a], that you keep these things without prejudice[c][b], doing nothing according to partiality.
translation:
  language: te
  text: 'దేవుని, మెస్సీయ యేసు, ఎన్నుకోబడిన దేవదూతల సమక్షంలో నేను నీకు గంభీరంగా ఆజ్ఞాపిస్తున్నాను: ముందస్తు తీర్పు లేకుండా[a] వీటిని పాటించు; పక్షపాతంతో ఏదీ చేయకు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎలాంటి ముందస్తు అభిప్రాయం లేకుండా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτύρομαι
  choice: నేను నీకు గంభీరంగా ఆజ్ఞాపిస్తున్నాను
  rationale: సందర్భంలో ఇది కేవలం సాక్ష్యమివ్వడం కాదు; అత్యంత గంభీరమైన ఆదేశాన్ని సూచిస్తుంది.
- source_word: ἐνώπιον
  choice: సమక్షంలో
  rationale: దేవుడు, మెస్సీయ యేసు, దూతలు సాక్షులుగా ఉన్నారనే గంభీర భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: Χριστοῦ Ἰησοῦ
  choice: మెస్సీయ యేసు
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉన్న భావాన్ని అనువదిస్తూ దాని అర్థాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἐκλεκτῶν ἀγγέλων
  choice: ఎంపిక చేయబడిన దూతలు
  rationale: ἐκλεκτός యొక్క ‘ఎంపిక చేయబడిన’ అనే అర్థాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది; ఎవరిచేత ఎంపికయ్యారో మూలంలో స్పష్టంగా చెప్పనందున అదనంగా చేర్చలేదు.
- source_word: ταῦτα φυλάξῃς
  choice: వీటిని పాటించు
  rationale: ముందు చెప్పిన ఆదేశాలను జాగ్రత్తగా ఆచరించాలనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: χωρὶς προκρίματος
  choice: ముందుగానే తీర్పు చేసుకోకుండా
  rationale: πρόκριμα సూచించే ముందస్తు నిర్ణయం లేదా విచారణకు ముందే తీర్పు ఏర్పరచుకోవడం అనే భావాన్ని కాపాడుతుంది.
- source_word: μηδὲν ποιῶν κατὰ πρόσκλισιν
  choice: పక్షపాతంతో ఏదీ చేయకు
  rationale: ఒక పక్షం వైపు మొగ్గు లేదా అభిమానంతో వ్యవహరించవద్దనే భావాన్ని స్పష్టమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: Χριστός పదం అనువాదం
  choice: మెస్సీయ యేసు
  alternative: క్రీస్తు యేసు
  rationale: ఈ గంభీర సాక్ష్యాహ్వానంలో Χριστός బిరుదు భావాన్ని కలిగి ఉండగలదు; ‘మెస్సీయ’ దాని అర్థాన్ని అనువదిస్తుంది, అయితే సంప్రదాయ రూపమైన ‘క్రీస్తు’ కూడా సాధ్యమే.
- issue: ἐκλεκτῶν ἀγγέλων యొక్క భావం
  choice: ఎంపిక చేయబడిన దూతలు
  alternative: ఎన్నుకోబడిన దూతలు
  rationale: దూతల ఎంపిక స్వరూపం లేదా ఉద్దేశాన్ని వాక్యం వివరించదు; అందువల్ల అదనపు దేవదూతల సిద్ధాంతాన్ని చేర్చకుండా గ్రీకు విశేషణాన్నే అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన పత్రికా-ఆదేశ ధోరణి. గ్రీకు వాక్యంలోని సాక్షుల జాబితా స్పష్టత కోసం ‘సమక్షంలో’ పునరుక్తి చేయబడింది. చివరి రెండు పదబంధాల మధ్య ఉన్న సున్నిత భేదం—ముందస్తు తీర్పు మరియు పక్షపాతం—నిలుపబడింది.
