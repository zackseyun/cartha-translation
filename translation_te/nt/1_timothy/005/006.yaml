  edition: SBLGNT
  text: ἡ δὲ σπαταλῶσα ζῶσα τέθνηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/006.yaml
  text: But she who lives for pleasure is dead even while she lives[a].
translation:
  language: te
  text: కాని సుఖభోగాల్లో మునిగిపోయే ఆమె బ్రతికుండగానే చనిపోయి ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్వీయసుఖాలకు లోనైన.”
    reason: σπαταλῶσα అనే పదానికి ఉన్న ‘స్వీయసుఖాలకు లోనైన’ అనే ప్రత్యామ్నాయ అర్థాన్ని సూచించడానికి.
lexical_decisions:
- source_word: σπαταλῶσα
  choice: సుఖభోగాలకే తనను అంకితం చేసుకున్న
  rationale: ఈ వర్తమాన కృదంతం కేవలం ఆనందాన్ని అనుభవించడాన్ని కాకుండా, స్వీయసుఖాలకు లోనై వాటినే లక్ష్యంగా చేసుకున్న నిరంతర జీవనశైలిని సూచిస్తుంది. ఈ తెలుగు వ్యక్తీకరణ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ζῶσα
  choice: బ్రతికుండగానే
  rationale: ఇది తరువాతి సంపూర్ణకాల క్రియతో కాలసంబంధమైన లేదా విరుద్ధార్థక సంబంధాన్ని కలిగి ఉంది. ‘బ్రతికుండగానే’ మూలంలోని ఉద్దేశపూర్వక విరోధాభాసాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τέθνηκεν
  choice: చనిపోయినదానిలా ఉంది
  rationale: సంపూర్ణకాల రూపం మరణం వల్ల ఏర్పడిన ప్రస్తుత స్థితిని నొక్కిచెబుతుంది. ఇక్కడ భౌతిక మరణం ఉద్దేశం కాదని సందర్భం తెలియజేస్తున్నందున, రూపకాన్ని నిలుపుతూ తెలుగు పాఠకునికి సహజంగా ఉండేలా ఈ రూపం ఎంచుకోబడింది.
- source_word: ἡ ... σπαταλῶσα
  choice: సుఖభోగాలకే తనను అంకితం చేసుకున్న ఆమె
  rationale: స్త్రీలింగ ఏకవచన ఉపపదంతో కూడిన కృదంతం నామవాచకంగా పనిచేస్తుంది. సమీప సందర్భం విధవరాళ్ల గురించి అయినప్పటికీ, మూలపాఠం ఈ వాక్యంలో ‘విధవరాలు’ అని మళ్లీ చెప్పదు; అందువల్ల ‘ఆమె’ అనే సూచనను నిలిపాం.
- source_word: δὲ
  choice: కాని
  rationale: మునుపటి వచనంలో దేవునిపై నిరీక్షణ ఉంచే నిజమైన విధవరాలితో ఇక్కడి స్త్రీకి ఉన్న వ్యత్యాసాన్ని δέ సూచిస్తుంది; ‘కాని’ ఆ వ్యత్యాసాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: బ్రతికుండగానే ‘చనిపోయి ఉండడం’ యొక్క స్వభావం
  choice: భౌతికంగా బ్రతికున్నప్పటికీ రూపకాలంకారంగా చనిపోయిన స్థితి
  alternative: ఆధ్యాత్మికంగా చనిపోయింది; నైతికంగా చనిపోయింది; సమాజపరంగా చనిపోయినట్టే ఉంది
  rationale: మూలపాఠం ఉద్దేశపూర్వక విరోధాభాసాన్ని వాడుతుంది; అది ఏ ప్రత్యేక సిద్ధాంతపరమైన అర్థమో ఖచ్చితంగా నిర్వచించదు. అందువల్ల అనువాదం ‘ఆధ్యాత్మిక’ లేదా ‘నైతిక’ అని జోడించకుండా రూపకాన్నీ దాని ఉద్రిక్తతనూ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే గౌరవప్రదమైన శైలిలో రూపొందించబడింది. ‘సుఖభోగాలు’ స్వీయసుఖాసక్త జీవనాన్ని సూచిస్తుంది; ‘అంకితం చేసుకున్న’ అనే మాట మూలంలోని కొనసాగుతున్న జీవనశైలి భావాన్ని తెలియజేస్తుంది.
