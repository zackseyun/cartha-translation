id: 1TI.5.13
reference: 1 Timothy 5:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἀργαὶ μανθάνουσιν, περιερχόμεναι τὰς οἰκίας, οὐ μόνον δὲ ἀργαὶ ἀλλὰ καὶ φλύαροι καὶ περίεργοι, λαλοῦσαι τὰ μὴ δέοντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/013.yaml
  text: At the same time[a], they also learn to be idle, going around from house to house; and not only idle, but also gossips and busybodies[b], saying what they ought not to say.
translation:
  language: te
  text: అదే సమయంలో, వారు ఇంటింటికి తిరుగుతూ సోమరిగా ఉండడం కూడా నేర్చుకుంటారు. అంతేకాక, వారు సోమరులుగా ఉండడమే కాకుండా వదరుబోతులుగా[a], ఇతరుల వ్యవహారాల్లో అనవసరంగా జోక్యం చేసుకునేవారుగా[b] అవుతారు; చెప్పకూడనివి చెబుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అర్థంలేని మాటలు చెప్పేవారుగా’; గ్రీకు పదం వ్యర్థమైన లేదా విచక్షణలేని మాటలను విస్తృతంగా సూచించగలదు, అయితే ఈ సందర్భంలో ఇతరుల గురించి ముచ్చట్లు చెప్పడం కూడా ఇందులో ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తమకు సంబంధంలేని విషయాల్లో కలుగజేసుకునేవారుగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: అదే సమయంలో ... కూడా
  rationale: కాలసామ్యంతో పాటు అదనపు అంశాన్ని సూచించే గ్రీకు పదబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀργαὶ
  choice: సోమరిగా ఉండడం / సోమరిగా ఉండడమే
  rationale: పని లేకుండా కాలం గడిపే నిష్క్రియ స్థితిని తెలియజేస్తూ, గ్రీకులోని పునరుక్తిని తెలుగులోనూ నిలుపుతుంది.
- source_word: μανθάνουσιν
  choice: నేర్చుకుంటారు
  rationale: ఈ సందర్భంలో క్రమంగా ఒక అలవాటును అలవరచుకోవడాన్ని సూచిస్తుంది; ‘సోమరిగా ఉండడం నేర్చుకుంటారు’ అనే నిర్మాణం మూలంలోని భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: περιερχόμεναι τὰς οἰκίας
  choice: ఇంటింటికి తిరుగుతూ
  rationale: ఒక ఇంటి నుంచి మరొక ఇంటికి తిరగడమనే విభాజక భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: φλύαροι
  choice: వదరుబోతులుగా
  rationale: అర్థంలేని, విచక్షణలేని లేదా ఇతరుల విషయాలను చెప్పే మాటలను సూచించే విస్తృత భావాన్ని కలిగి ఉంది; ‘వదరుబోతులు’ దానిని సహజ తెలుగులో అందిస్తుంది.
- source_word: περίεργοι
  choice: ఇతరుల వ్యవహారాల్లో అనవసరంగా జోక్యం చేసుకునేవారుగా
  rationale: తమకు సంబంధంలేని విషయాల్లో కలుగజేసుకోవడమనే ప్రతికూల భావాన్ని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: λαλοῦσαι
  choice: చెబుతారు
  rationale: తదుపరి కర్మభాగంతో సహజంగా కలిసే సరళమైన మాటల క్రియ.
- source_word: τὰ μὴ δέοντα
  choice: చెప్పకూడనివి
  rationale: సందర్భానికి తగని లేదా చెప్పడం యుక్తం కాని విషయాలనే భావాన్ని, ఇక్కడ సమస్య మాటలకు సంబంధించినదని స్పష్టంగా తెలుపుతూ అందిస్తుంది.
theological_decisions:
- issue: స్త్రీలింగ బహువచన రూపాల సూచన
  choice: వారు
  alternative: ఈ స్త్రీలు / ఈ యౌవన విధవరాళ్లు
  rationale: గ్రీకు స్త్రీలింగ రూపాలు ముందటి సందర్భంలోని యౌవన విధవరాళ్లనే సూచిస్తాయి. తెలుగులో సందర్భానుసారమైన ‘వారు’ సహజంగా ఉండి, మూలంలోని సూచనను మార్చదు.
- issue: φλύαροι యొక్క భావపరిధి
  choice: వదరుబోతులుగా
  alternative: ఇతరుల గురించి ముచ్చట్లు చెప్పేవారుగా
  rationale: ఈ పదం కేవలం అపవాదులు లేదా పుకార్లకే పరిమితం కాకుండా అర్థంలేని, వ్యర్థమైన, విచక్షణలేని మాటలనూ సూచించగలదు; అందువల్ల విస్తృత భావాన్ని ప్రధాన పాఠంలో ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. గ్రీకులో రెండుసార్లు వచ్చిన ἀργαὶ భావాన్ని రెండుసార్లూ ‘సోమరిగా’ అని ఉంచాం. [a], [b] సూచికలను అవి వివరిస్తున్న పదాల దగ్గరే ప్రధాన పాఠంలో పెట్టాం.
