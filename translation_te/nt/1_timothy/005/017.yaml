revisions:
- from: చక్కగా నాయకత్వం వహించే సంఘపెద్దలు రెట్టింపు గౌరవానికి అర్హులుగా పరిగణించబడాలి[a]; ముఖ్యంగా వాక్య పరిచర్యలోను బోధించడంలోను కష్టపడి పనిచేసేవారు[b][c].
