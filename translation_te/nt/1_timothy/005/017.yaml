id: 1TI.5.17
reference: 1 Timothy 5:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἱ καλῶς προεστῶτες πρεσβύτεροι διπλῆς τιμῆς ἀξιούσθωσαν, μάλιστα οἱ κοπιῶντες ἐν λόγῳ καὶ διδασκαλίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/017.yaml
  text: Let the elders who lead well be considered worthy of double honor[c][b][a], especially those who labor in word and teaching.
translation:
  language: te
  text: చక్కగా నాయకత్వం వహించే సంఘపెద్దలు రెట్టింపు గౌరవానికి అర్హులుగా పరిగణించబడాలి[a]; ముఖ్యంగా వాక్యములోను బోధనలోను కష్టపడి పనిచేసేవారు[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రెట్టింపు గౌరవానికి అర్హులని ఎంచాలి’ అని కూడా అనువదించవచ్చు. తరువాతి వచనాన్ని బట్టి, ఈ గౌరవంలో మర్యాదతో పాటు భౌతిక సహాయం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ముఖ్యంగా’ అనే మాటను కొందరు ‘అంటే’ అని అర్థం చేసుకుంటారు; అప్పుడు ఇక్కడ చెప్పిన సంఘపెద్దలు వాక్యములోను బోధనలోను కష్టపడేవారేనని భావం.
    reason: alternative_reading
  - marker: c
    text: ‘వాక్యములోను బోధనలోను’ అనేది ప్రకటించడం, బోధించడం వంటి మాట ద్వారా జరిగే కార్యాన్ని సూచించే అవకాశం ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: సంఘపెద్దలు
  rationale: ఇక్కడ ఈ పదం కేవలం వయసులో పెద్దవారిని కాక, సంఘంలో గుర్తింపు పొందిన నాయకులను సూచిస్తుంది. ‘సంఘపెద్దలు’ ఆధునిక తెలుగు పాఠకులకు ఈ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; తరువాతి కాలపు నిర్దిష్ట సంఘవ్యవస్థను అనవసరంగా దిగుమతి చేయదు.
- source_word: καλῶς προεστῶτες
  choice: చక్కగా నాయకత్వం వహించే
  rationale: προΐστημι ఇక్కడ నాయకత్వం లేదా పర్యవేక్షణను సూచిస్తుంది. ఈ అనువాదం నిజమైన అధికార భావాన్ని నిలుపుతూ, ‘పాలించే’ అనే పదానికి రావచ్చే కఠిన ధ్వనిని నివారిస్తుంది.
- source_word: διπλῆς τιμῆς
  choice: రెట్టింపు గౌరవానికి
  rationale: మూలంలోని కొంత అస్పష్టమైన విస్తృత భావాన్ని నిలుపుతుంది. సందర్భంలో ఇది ఆదరణతో పాటు భౌతిక సహాయాన్ని కూడా కలిగి ఉండవచ్చు; ప్రధాన పాఠంలో ఒక్క భావానికే పరిమితం చేయలేదు.
- source_word: ἀξιούσθωσαν
  choice: అర్హులుగా పరిగణించబడాలి
  rationale: సంఘం వారిని తగినవారిగా గుర్తించాలనే కర్మణి ఆజ్ఞార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μάλιστα
  choice: ముఖ్యంగా
  rationale: ఇది సాధారణ సమూహంలో ప్రత్యేకంగా ప్రాధాన్యం పొందే వారిని సూచించే సహజ భావాన్ని నిలుపుతుంది; ‘అంటే’ అని అనువదించి సమీకరణ భావాన్ని బలవంతంగా రుద్దదు.
- source_word: κοπιῶντες
  choice: కష్టపడి పనిచేసేవారు
  rationale: κοπιάωలో ఉన్న శ్రమతో కూడిన కృషి భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐν λόγῳ
  choice: వాక్య పరిచర్యలో
  rationale: ఇక్కడ λόγος మాట ద్వారా జరిగే సేవను—ప్రకటన లేదా ప్రసంగాన్ని—సూచించే అవకాశం ఉంది. ‘వాక్య పరిచర్య’ ఆ విస్తృతిని నిలుపుతూ, కేవలం ఒక నిర్దిష్ట ప్రసంగ రూపానికే పరిమితం చేయదు.
- source_word: διδασκαλίᾳ
  choice: బోధించడంలో
  rationale: గ్రీకు పదంలోని బోధన లేదా ఉపదేశ క్రియను సులభంగా అర్థమయ్యే ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘సిద్ధాంతం’ వంటి అధిక సాంకేతిక పదాన్ని నివారిస్తుంది.
theological_decisions:
- issue: సంఘ నాయకులకు సంబంధించిన ‘రెట్టింపు గౌరవం’ అర్థం
  choice: ప్రధాన పాఠంలో ‘రెట్టింపు గౌరవం’ అనే విస్తృత పదబంధాన్ని నిలుపడం
  alternative: రెట్టింపు మర్యాద; రెట్టింపు పారితోషికం; భౌతిక సహాయంతో కూడిన గౌరవం
  rationale: తరువాతి వచనం భౌతిక ఆదరణను సూచించినప్పటికీ, τιμή మర్యాద లేదా గౌరవాన్ని కూడా సూచించగలదు. విస్తృత పదబంధాన్ని నిలుపడం ద్వారా మూలంలోని భావ పరిధి కాపాడబడుతుంది.
- issue: μάλιστα యొక్క భావం
  choice: ‘ముఖ్యంగా’ అని అనువదించడం
  alternative: ‘అంటే’ అని అనువదించి తరువాతి వారినే ముందున్న సంఘపెద్దలుగా గుర్తించడం
  rationale: ఇది సంఘపెద్దలందరిలో వాక్య పరిచర్య, బోధనలో కష్టపడేవారికి ప్రత్యేక ప్రాధాన్యం ఇస్తున్న సహజ భావాన్ని నిలుపుతుంది; అన్ని సంఘపెద్దల బోధనా పాత్రపై ఉన్న వ్యాఖ్యాన వివాదాన్ని ముందుగానే పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. సంఘ నాయకత్వాన్ని స్పష్టం చేయడానికి ‘సంఘపెద్దలు’ వాడబడింది. మూలంలోని ‘రెట్టింపు గౌరవం’ మరియు μάλιστα సంబంధిత వ్యాఖ్యాన అస్పష్టతలు ప్రధాన పాఠం, పాదసూచనల్లో నిలుపబడ్డాయి.
