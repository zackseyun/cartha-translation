id: 1TI.5.4
reference: 1 Timothy 5:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δέ τις χήρα τέκνα ἢ ἔκγονα ἔχει, μανθανέτωσαν πρῶτον τὸν ἴδιον οἶκον εὐσεβεῖν καὶ ἀμοιβὰς ἀποδιδόναι τοῖς προγόνοις, τοῦτο γάρ ἐστιν ἀπόδεκτον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/004.yaml
  text: But if any widow has children or grandchildren[a], let them first learn to show godliness to their own household and to repay their forebears[c][b], for this is acceptable before God.
translation:
  language: te
  text: అయితే, ఏ విధవరాలికైనా పిల్లలు లేదా మనుమలు[a] ఉంటే, వారు మొదట తమ సొంత ఇంటివారిపట్ల భక్తితో ప్రవర్తించడం[b], తమ పూర్వతరాలవారికి[c] తగిన ప్రతిఫలం ఇవ్వడం నేర్చుకోవాలి. ఎందుకంటే ఇది దేవుని సమక్షంలో ఆమోదయోగ్యమైనది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పిల్లలు లేదా సంతతివారు.’ గ్రీకు పదం ἔκγονα ‘మనుమలు’ కంటే విస్తృతమైన అర్థం కలిగి ఉండవచ్చు; అయితే ఇక్కడ కుటుంబంలోని తరువాతి తరాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తమ సొంత ఇంటివారిపట్ల భక్తిని ఆచరించడం.’ కుటుంబ సభ్యుల పట్ల చూపే శ్రద్ధను గ్రీకు పాఠం దైవభక్తితో ముడిపెడుతోంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘తమ తల్లిదండ్రులకు’ లేదా ‘తమ పూర్వీకులకు.’ గ్రీకు పదానికి అక్షరార్థం ‘ముందున్న తరాలవారు’ లేదా ‘పూర్వజులు’; ఈ సందర్భంలో తల్లిదండ్రులు లేదా ఇతర పూర్వతరాల కుటుంబ సభ్యులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: విధవరాలు
  rationale: భర్త మరణించిన స్త్రీ అనే సందర్భానుగుణమైన ప్రామాణిక అర్థం; ఈ పేరాలో విధవరాళ్ల గురించే చర్చ జరుగుతోంది.
- source_word: τέκνα ἢ ἔκγονα
  choice: పిల్లలు లేదా మనుమలు
  rationale: τέκνα అంటే పిల్లలు; ἔκγονα విస్తృతంగా సంతతివారిని సూచించగలిగినా, ఇక్కడ కుటుంబ సంరక్షణ సందర్భంలో తరువాతి తరమైన మనుమలను సూచించడం సహజం. విస్తృత అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: μανθανέτωσαν
  choice: వారు ... నేర్చుకోవాలి
  rationale: మూడవ పురుష బహువచన వర్తమాన ఆజ్ఞార్థక రూపంలోని ఆజ్ఞా బలాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πρῶτον
  choice: మొదట
  rationale: దైవభక్తితో కూడిన బాధ్యత మొదట సొంత కుటుంబంలోనే ఆచరించాలనే ప్రాధాన్యాన్ని చూపుతుంది.
- source_word: τὸν ἴδιον οἶκον
  choice: తమ సొంత కుటుంబం పట్ల
  rationale: οἶκος ఇక్కడ భౌతిక గృహం కంటే కుటుంబం లేదా ఇంటివారిని సూచిస్తుంది; పట్ల అనే విభక్తి εὐσεβεῖν తీసుకునే కర్మ సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: εὐσεβεῖν
  choice: దైవభక్తిని ఆచరణలో చూపించడం
  rationale: మతపరమైన భక్తి భావాన్నీ, కుటుంబ సంరక్షణలో అది కార్యరూపం దాల్చడాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: ἀμοιβὰς ἀποδιδόναι
  choice: ప్రతిఫలం చెల్లించడం
  rationale: ముందు పొందిన సంరక్షణకు తిరిగి తగినది చేయడం అనే భావాన్ని తెలియజేస్తుంది; తెలుగులో కేవలం ఆర్థిక రుణం తీర్చడం అనే అపార్థాన్ని తగ్గించేందుకు చేసిన మేలుకు అనే వివరణాత్మక పదబంధం జోడించబడింది.
- source_word: τοῖς προγόνοις
  choice: తమ పూర్వీకులు
  rationale: మూలపదం పూర్వ తరాలవారిని సూచిస్తుంది. సమీప కుటుంబ సందర్భంలో తల్లిదండ్రులు లేదా తాతముత్తాతలు ఉద్దేశింపబడవచ్చు; అనవసరంగా ఒకే తరానికి పరిమితం చేయలేదు.
- source_word: ἀπόδεκτον
  choice: ఆమోదయోగ్యమైనది
  rationale: దేవుడు ఇటువంటి ప్రవర్తనను అనుకూలంగా స్వీకరిస్తాడనే భావానికి సమీపమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: దేవుని సమక్షంలో
  rationale: దేవుని సన్నిధి మరియు ఆయన మూల్యాంకనం అనే రెండూ సూచించగల మూలభాషా నుడికారాన్ని నిలుపుతుంది.
theological_decisions:
- issue: బహువచన ఆజ్ఞ μανθανέτωσαν ఎవరిని సూచిస్తుంది?
  choice: విధవరాలి పిల్లలు లేదా మనుమలే ఈ ఆజ్ఞకు కర్తలు.
  alternative: వచన మార్పు లేదా అధ్యాహారమైన కర్తతో, ఈ ఆజ్ఞ విధవరాళ్లను సూచిస్తుంది.
  rationale: దగ్గరలో ఉన్న బహువచన నామపదాలు τέκνα ἢ ἔκγονα కావడం వల్ల అవే అత్యంత సహజమైన కర్తలు. కుటుంబ సభ్యులు విధవరాలిని చూసుకుంటూ పూర్వ తరాలవారి సంరక్షణకు ప్రతిఫలం ఇవ్వాలనే సందర్భానికీ ఇది సరిపోతుంది.
- issue: కుటుంబ సంరక్షణకు సంబంధించి εὐσεβεῖν భావం
  choice: కుటుంబ బాధ్యతను నిర్వర్తించడం దైవభక్తి యొక్క ఆచరణాత్మక వ్యక్తీకరణగా చూపబడింది.
  alternative: ఈ పదం మతపరమైన భావం లేకుండా కేవలం కుటుంబ బాధ్యతను నిర్వర్తించడాన్ని మాత్రమే సూచిస్తుంది.
  rationale: εὐσεβεῖν లో స్పష్టమైన భక్తి భావం ఉంది; అంతేకాక, ఈ ప్రవర్తన దేవుని సమక్షంలో ఆమోదయోగ్యమని వాక్యం చెబుతోంది. అందువల్ల సామాజిక బాధ్యతతో పాటు దైవభక్తి కోణాన్నీ అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘దైవభక్తిని ఆచరణలో చూపించడం’ అనే పదబంధం మతపరమైన భావాన్నీ కుటుంబ సంరక్షణలోని కార్యరూపాన్నీ కలిపి వ్యక్తం చేస్తుంది. మూలంలోని బహువచన కర్త స్పష్టంగా ఉండేందుకు ‘వారు’ చేర్చబడింది; ‘పూర్వీకులు’ అనే విస్తృత పదానికి సందర్భపరమైన వివరణ పాదటిప్పణిలో ఇవ్వబడింది.
