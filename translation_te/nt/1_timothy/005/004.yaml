  to: అయితే, ఏ విధవరాలికైనా పిల్లలు లేదా మనుమలు[a] ఉంటే, వారు మొదట తమ సొంత ఇంటివారిపట్ల భక్తితో ప్రవర్తించడం[b], తమ పూర్వతరాలవారికి[c] తగిన ప్రతిఫలం ఇవ్వడం నేర్చుకోవాలి. ఎందుకంటే ఇది దేవుని సమక్షంలో ఆమోదయోగ్యమైనది.
