revisions:
- from: వయసులో పెద్ద స్త్రీలను తల్లులుగా, యువ స్త్రీలను అక్కచెల్లెళ్లుగా, సంపూర్ణ పవిత్రతతో[a] చూడు.
  to: వయసులో పెద్ద స్త్రీలతో తల్లులతో వ్యవహరించినట్లుగా, వయసులో చిన్న స్త్రీలతో అక్కచెల్లెళ్లతో వ్యవహరించినట్లుగా, సంపూర్ణ పవిత్రతతో[a] వ్యవహరించు.
  rationale: 'The revision changes only two points needed for accuracy and idiomatic clarity: it renders the comparative νεωτέρας as «వయసులో చిన్న», and it replaces «చూడు» with «వ్యవహరించు» to convey the continuing instruction’s relational sense. The placement of «సంపూర్ణ పవిత్రతతో» remains capable of being read with the treatment of younger women, as in the Greek context, while the main text retains the broad sense of purity.'
  reviewer_model: gpt-5.6-terra
