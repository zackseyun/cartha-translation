  yaml_path: translation/nt/1_timothy/005/002.yaml
  text: older women as mothers[a], younger women as sisters, in all purity.
translation:
  language: te
  text: వయసులో పెద్ద స్త్రీలతో తల్లులతో వ్యవహరించినట్లుగా, వయసులో చిన్న స్త్రీలతో అక్కచెల్లెళ్లతో వ్యవహరించినట్లుగా, సంపూర్ణ పవిత్రతతో[a] వ్యవహరించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పూర్తి శుచిత్వంతో.” ఈ సందర్భంలో ఈ మాటకు లైంగిక నియమశీలత లేదా లైంగిక ప్రవర్తనలో నిర్మలత అనే బలమైన భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβυτέρας
  choice: వయసులో పెద్ద స్త్రీలను
  rationale: ఇది స్త్రీలింగ బహువచన విశేషణం నామవాచకంగా వాడబడింది. νεωτέρας అనే వ్యతిరేక పదంతో జతకట్టబడినందున సంఘపెద్దల పదవిని కాక వయసును సూచిస్తుంది.
- source_word: ὡς
  choice: గా
  rationale: పోలికను సూచించే గ్రీకు పదాన్ని తెలుగు వాక్యనిర్మాణంలో సహజమైన ‘గా’తో అందించాం.
- source_word: μητέρας
  choice: తల్లులుగా
  rationale: కుటుంబ సంబంధ రూపకాన్ని అదనంగా ‘నీ’ అనే భావాన్ని చేర్చకుండా నిలుపుతుంది.
- source_word: νεωτέρας
  choice: యువ స్త్రీలను
  rationale: వయసులో పెద్ద స్త్రీలకు వ్యతిరేకంగా, తక్కువ వయసుగల స్త్రీలను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ἀδελφὰς
  choice: అక్కచెల్లెళ్లుగా
  rationale: తెలుగులో ‘సోదరీమణులు’ కంటే కుటుంబ సంబంధాన్ని సాధారణ పాఠకులకు సహజంగా వ్యక్తం చేస్తుంది; వయసు పెద్దా చిన్నా అనే అంశాన్ని అనవసరంగా నిర్ణయించకుండా రెండు సంబంధ పదాలను కలిపి వాడింది.
- source_word: ἐν πάσῃ ἁγνείᾳ
  choice: సంపూర్ణ పవిత్రతతో
  rationale: πάσῃ యొక్క సమగ్రతను ‘సంపూర్ణ’ తెలియజేస్తుంది; ἁγνείαలోని విస్తృత నైతిక పవిత్రతను నిలుపుతూ, సందర్భంలోని లైంగిక శుచిత్వ భావాన్ని పాదసూచికలో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: యువ స్త్రీలతో వ్యవహరించే విషయంలో ἁγνεία పదపు పరిధి
  choice: ప్రధాన పాఠ్యంలో విస్తృతంగా ‘పవిత్రత’ అని అనువదించడం
  alternative: ‘సంపూర్ణ లైంగిక శుచిత్వంతో’ లేదా ‘పూర్ణ పాతివ్రత్యంతో’
  rationale: ἁγνεία సాధారణ నైతిక పవిత్రతను సూచించగలదు; ఈ సందర్భంలో లైంగిక నియమశీలత బలంగా అంతర్భాగమైనా, మూలపాఠం దానికే పరిమితం చేయదు. అందువల్ల ప్రధాన పాఠ్యంలో భావపరిధిని నిలిపి, సందర్భానుగుణ అర్థాన్ని పాదసూచికలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపాన్ని వాడాం. ఇది ముందు వచనం నుంచి కొనసాగుతున్న సంక్షిప్త ఉపదేశం కాబట్టి తెలుగులో వాక్యం పూర్తిగా వినిపించేందుకు ‘చూడు’ను చేర్చాం. ‘అక్కచెల్లెళ్లు’ సాధారణ వాడుకలో కుటుంబసంబంధ రూపకాన్ని స్పష్టంగా తెలియజేస్తుంది.
