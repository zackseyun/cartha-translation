source:
  edition: SBLGNT
  text: ἡ δὲ ὄντως χήρα καὶ μεμονωμένη ἤλπικεν ἐπὶ ⸀θεὸν καὶ προσμένει ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς νυκτὸς καὶ ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/005.yaml
  text: She who is truly a widow[a], and is left all alone[c][b], has set her hope on God and continues in petitions and prayers night and day.
translation:
  language: te
  text: అయితే, నిజమైన విధవరాలైన, పూర్తిగా ఒంటరిగా మిగిలిన ఆమె[a] దేవునిపై తన ఆశను ఉంచింది[b]; ఆమె రాత్రింబగళ్లు విన్నపాలలోను ప్రార్థనలలోను కొనసాగుతుంది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒంటరిగా ఉన్నది’ లేదా ‘ఒంటరిగా మిగిలినది.’ గ్రీకు పదం ఆమెకు తోడ్పడే కుటుంబం లేకుండా మిగిలిన స్థితిని నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దేవునిపై ఆశ ఉంచింది.’ గ్రీకు పరిపూర్ణ కాలం స్థిరపడిన ఆశకు ఇప్పటికీ కొనసాగుతున్న ఫలితం ఉందని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ప్రత్యేక అభ్యర్థనలను సూచించే ‘విన్నపాలు,’ సాధారణ ప్రార్థనను సూచించే ‘ప్రార్థనలు’ అనే రెండు గ్రీకు పదాల భేదం ఇక్కడ నిలుపబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντως χήρα
  choice: నిజంగా విధవరాలై
  rationale: ὄντως అనే పదం కేవలం సామాజిక హోదాను కాక, సందర్భంలో నిర్వచించబడిన నిజమైన విధవరాలి స్థితిని సూచిస్తుంది.
- source_word: μεμονωμένη
  choice: పూర్తిగా ఒంటరిగా మిగిలిపోయిన
  rationale: పరిపూర్ణ కాల కృదంతం గతంలో ఒంటరిగా విడిచిపెట్టబడి, ఇప్పటికీ కుటుంబ సహాయం లేకుండా ఉన్న స్థితిని సూచిస్తుంది.
- source_word: ἤλπικεν ἐπὶ θεόν
  choice: దేవునిపై తన నిరీక్షణ ఉంచి ఉంది
  rationale: పరిపూర్ణ కాలం స్థిరంగా ఏర్పడి కొనసాగుతున్న నిరీక్షణను వ్యక్తం చేస్తుంది.
- source_word: προσμένει
  choice: చేస్తూనే ఉంటుంది
  rationale: వర్తమాన కాల క్రియ ప్రార్థనలో నిరంతరంగా కొనసాగడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς
  choice: విన్నపాలు, ప్రార్థనలు
  rationale: ప్రత్యేక అవసరాలకు సంబంధించిన విన్నపాలు మరియు సాధారణ ప్రార్థనలు అనే గ్రీకు పదాల భేదాన్ని నిలుపుతుంది.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: రాత్రింబగళ్లు
  rationale: గ్రీకు క్రమాన్నీ, నిరంతర ఆచరణను సూచించే సహజ తెలుగు నుడికారాన్నీ నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి సందర్భంతో సంబంధాన్ని, స్వల్ప వ్యత్యాసాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: ‘నిజమైన విధవరాలు’ అనే వర్ణన
  choice: కుటుంబ సహాయం లేక ఒంటరిగా ఉండి, దేవునిపై స్థిరమైన నిరీక్షణతో ప్రార్థనలో కొనసాగుతున్న విధవరాలిని వచనం వర్ణిస్తుంది.
  alternative: ఈ వచనం ఎలాంటి అర్హత భావమూ లేకుండా విధవరాళ్లందరినీ సాధారణంగా వర్ణిస్తుంది.
  rationale: ὄντως మరియు సమీప సందర్భం ప్రత్యేకంగా గుర్తించబడే విధవరాలి స్థితిని సూచిస్తాయి; అనువాదం సంఘపరమైన ఏ ప్రత్యేక సంప్రదాయాన్ని జోడించకుండా ఆ భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘రాత్రింబగళ్లు’ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే నుడికారం; ‘విన్నపాలు, ప్రార్థనలు’ మూలంలోని పదభేదాన్ని నిలుపుతాయి.
