id: 1TI.5.18
reference: 1 Timothy 5:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφή· Βοῦν ἀλοῶντα οὐ φιμώσεις, καί· Ἄξιος ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/018.yaml
  text: For the Scripture says[a], “You shall not muzzle an ox while it is threshing,” and[b], “The laborer is worthy of his wages.”
translation:
  language: te
  text: 'ఎందుకంటే లేఖనం ఇలా చెబుతోంది: “ధాన్యాన్ని తొక్కుతున్న[a] ఎద్దు నోటికి మూతి కట్టకూడదు,” మరియు, “పనివాడు తన కూలికి[b] అర్హుడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ధాన్యం నూర్చుతున్న.” గ్రీకు కృదంతం ధాన్యం నూర్చే పనిలో ఉన్న ఎద్దును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పనివాడు తన జీతానికి అర్హుడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφή
  choice: ఎందుకంటే లేఖనం ఇలా చెబుతోంది
  rationale: γάρ మునుపటి వాక్యానికి కారణాన్ని లేదా వివరణను కలుపుతుంది; అందుకే ‘ఎందుకంటే’ అని అనువదించాం. ἡ γραφή ఇక్కడ అధికారిక పవిత్ర లేఖనాన్ని సూచిస్తుంది; వర్తమాన కాలంలోని λέγειని సహజమైన ఆధునిక తెలుగులో ‘చెబుతోంది’గా ఇచ్చాం.
- source_word: Βοῦν
  choice: ఎద్దు
  rationale: βοῦς ఇక్కడ వ్యవసాయ పనికి ఉపయోగించే ఎద్దును సాధారణంగా సూచిస్తుంది.
- source_word: ἀλοῶντα
  choice: ధాన్యం నూర్చుతున్న
  rationale: ఈ వర్తమాన కృదంతం ఎద్దు ధాన్యం నూర్చే పనిలో ఉన్నదని తెలియజేస్తుంది. పురాతన పద్ధతిలో ధాన్యాన్ని తొక్కడం అంతర్లీనంగా ఉన్నా, ఆధునిక పాఠకునికి ‘ధాన్యం నూర్చుతున్న’ స్పష్టంగా ఉంటుంది; మరింత అక్షరార్థమైన రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: οὐ φιμώσεις
  choice: మూతికి చిక్కం వేయకూడదు
  rationale: భవిష్యత్ సూచక రూపం ఇక్కడ నిషేధాజ్ఞ భావాన్ని కలిగి ఉంది. తెలుగులో ‘వేయకూడదు’ ఆ నియమాత్మక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘మూతికి చిక్కం వేయడం’ జంతువుకు muzzle వేయడాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: καί
  choice: ఇంకా
  rationale: καί రెండు ఉల్లేఖనాలను సమన్వయంతో కలుపుతుంది. తెలుగులో ‘ఇంకా’ రెండవ ఉల్లేఖనాన్ని సహజంగా పరిచయం చేస్తుంది.
- source_word: Ἄξιος ὁ ἐργάτης
  choice: పనివాడు … అర్హుడు
  rationale: ἐργάτης పని చేసే వ్యక్తిని సూచిస్తుంది. ‘పనివాడు’ ఆధునిక తెలుగులో సాధారణమైనది, స్పష్టమైనది; ἄξιοςకు ‘అర్హుడు’ నేరమైన సమానార్థకం.
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: తన కూలికి
  rationale: μισθός ఇక్కడ పనికి రావలసిన ప్రతిఫలాన్ని, అంటే కూలిని సూచిస్తుంది; αὐτοῦ అనే ఏకవచన పురుషలింగ స్వాధీన భావాన్ని తెలుగులో కర్తను తిరిగి సూచించే ‘తన’ సహజంగా, ఖచ్చితంగా వ్యక్తం చేస్తుంది. ‘జీతం’ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: γραφή అనే పరిచయ సూత్రం రెండు ఉల్లేఖనాలకు వర్తించే పరిధి
  choice: ‘లేఖనం ఇలా చెబుతోంది’ అనే పరిచయం కింద రెండు ఉల్లేఖనాలనూ యథాతథంగా ఉంచడం
  alternative: మొదటి ఉల్లేఖనాన్నే లేఖనంగా, రెండవదాన్ని సామెతగా లేదా ప్రభువు పలుకుగా వేరు చేయడం
  rationale: గ్రీకు వాక్యం రెండు ఉల్లేఖనాలను ఒకే పరిచయ నిర్మాణంలో సమన్వయపరుస్తుంది. అనువాదం ఈ నిర్మాణాన్ని ప్రతిబింబించాలి; కానన్‌కు సంబంధించిన విస్తృత సిద్ధాంత నిర్ణయాన్ని వచనంలోకి చేర్చకూడదు.
- issue: αὐτοῦ యొక్క లింగం, సంఖ్య
  choice: ఏకవచన పురుష సూచనను ‘పనివాడు తన కూలికి’గా నిలుపుకోవడం
  alternative: బహువచన లేదా లింగనిరపేక్ష రూపంలో మార్చడం
  rationale: మూలంలో నామవాచకమూ సర్వనామమూ ఏకవచన పురుషలింగంలో ఉన్నాయి. తెలుగు ప్రతిబింబక స్వాధీన పదమైన ‘తన’ ఈ సంబంధాన్ని సహజంగా నిలుపుతుంది; ‘పనివాడు’ మూలంలోని వ్యాకరణ రూపాన్ని స్పష్టంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన లేఖన శైలిని ఉపయోగించాం. ‘లేఖనం’, ‘అర్హుడు’ వంటి పదాలు గంభీరతను నిలుపుతాయి; ‘ధాన్యం నూర్చుతున్న’, ‘మూతికి చిక్కం వేయకూడదు’, ‘కూలి’ వంటి రూపాలు గ్రామీణ దృశ్యాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తాయి.
