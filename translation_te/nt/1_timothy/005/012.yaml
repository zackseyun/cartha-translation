review_pass:
  verdict: revise
  source_fidelity: The Greek present participle ἔχουσαι, paired with κρίμα, expresses presently incurring/coming under judgment. The draft's future ‘తీర్పుకు లోనవుతారు’ shifts this to a future result. The causal relation and the aorist repudiation ‘పక్కన పెట్టారు’ are otherwise conveyed well. ‘తీర్పు’ appropriately retains the breadth of κρίμα without asserting a specific kind of condemnation.
  naturalness: ‘తీర్పుకు లోనవుతున్నారు’ is natural modern standard Telugu and better represents the ongoing participial force. The revised word order makes the causal clause and main assertion clear.
  terminology: ‘విశ్వాసం’ properly retains πίστις in the main text, while the footnote preserves the genuine contextual alternatives of pledge/commitment. The footnote is adjusted from singular ‘విధవరాలిగా’ to the contextually accurate plural widow-enrollment wording.
  issues:
  - severity: medium
    issue: The main verb is future (‘తీర్పుకు లోనవుతారు’) although ἔχουσαι is a present participle.
    rationale: The source says that they are having/incurring judgment, not explicitly that they will come under it in the future. Telugu present-progressive wording preserves this aspect.
  - severity: low
    issue: The footnote's explanation uses singular ‘విధవరాలిగా జాబితాలో చేరడానికి’ for a plural group and is less precise about enrollment.
    rationale: The context concerns women/widows and likely enrollment on a widow list; plural wording is clearer and more accurate.
  revised_text: వారు తమ మునుపటి విశ్వాసాన్ని పక్కన పెట్టారు కాబట్టి తీర్పుకు లోనవుతున్నారు[a].
