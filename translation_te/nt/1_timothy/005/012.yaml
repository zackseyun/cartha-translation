revisions:
- from: వారు తమ మునుపటి విశ్వాసాన్ని పక్కన పెట్టారు కాబట్టి తీర్పుకు లోనవుతారు[a].
  to: వారు తమ మునుపటి విశ్వాసాన్ని పక్కన పెట్టారు కాబట్టి తీర్పుకు లోనవుతున్నారు[a].
  rationale: The sole main-text revision changes the future expression to a present-progressive one, accurately representing ἔχουσαι with κρίμα as ‘incurring/being under judgment.’ The main-text ambiguity of τὴν πρώτην πίστιν remains intact, and the footnote continues to give pledge and commitment as alternatives while improving contextual precision.
