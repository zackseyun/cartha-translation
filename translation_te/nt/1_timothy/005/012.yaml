  text: incurring judgment because they have set aside their former faith[a].
translation:
  language: te
  text: వారు తమ మునుపటి విశ్వాసాన్ని పక్కన పెట్టారు కాబట్టి తీర్పుకు లోనవుతున్నారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమ మొదటి వాగ్దానాన్ని’ లేదా ‘తమ మునుపటి నిబద్ధతను.’ గ్రీకు పదానికి ‘విశ్వాసం’ అనే అర్థం ఉండవచ్చు; అయితే ఈ సందర్భంలో, విధవరాళ్ల జాబితాలో నమోదు కావడానికి సంబంధించిన ముందరి వాగ్దానాన్ని అది సూచిస్తుందని కొందరు అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχουσαι
  choice: తీర్పుకు లోనవుతారు
  rationale: ἔχουσαι అనే కృదంతం అక్షరార్థంగా ‘కలిగి ఉన్నవారు’ అని ఉన్నా, κρίμαతో కలిసి తీర్పు కిందికి రావడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘తీర్పుకు లోనవుతారు’ సహజంగా ఉండి మూలంలోని గంభీరతను నిలుపుతుంది.
- source_word: κρίμα
  choice: తీర్పు
  rationale: ఈ పదానికి తీర్పు, దోషనిర్ణయం లేదా శిక్షాత్మక నిర్ణయం అనే భావాలు ఉండవచ్చు. వచనం స్పష్టంగా నిత్యశిక్షను పేర్కొననందున విస్తృతమైన ‘తీర్పు’ను ఎంచుకున్నాం.
- source_word: ὅτι
  choice: కాబట్టి
  rationale: ఇక్కడ ὅτι తీర్పుకు కారణాన్ని పరిచయం చేస్తుంది. తెలుగు వాక్య నిర్మాణంలో కారణవాచక ఉపవాక్యం తరువాత ‘కాబట్టి’ సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: τὴν πρώτην πίστιν
  choice: తమ మునుపటి విశ్వాసాన్ని
  rationale: πρώτην ఇక్కడ కాలపరంగా ముందు ఉన్నదాన్ని సూచించగలదు; అందువల్ల ‘మొదటి’ కంటే ‘మునుపటి’ సహజం. πίστιν యొక్క ప్రాథమిక అర్థమైన ‘విశ్వాసం’ను ప్రధాన పాఠ్యంలో ఉంచి, సందర్భానుసారంగా సాధ్యమైన ‘మొదటి వాగ్దానం/మునుపటి నిబద్ధత’ను పాదసూచికలో ఇచ్చాం.
- source_word: ἠθέτησαν
  choice: పక్కన పెట్టారు
  rationale: ἀθετέω తిరస్కరించడం, పక్కన పెట్టడం లేదా చెల్లకుండా చేయడం అనే అర్థాలు ఇవ్వగలదు. ‘పక్కన పెట్టారు’ ముందున్న విశ్వాసం లేదా నిబద్ధతను నిరాకరించిన భావాన్ని అనవసరంగా అతిశయింపకుండా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: τὴν πρώτην πίστιν అనే పదబంధం యొక్క సందర్భార్థం
  choice: తమ మునుపటి విశ్వాసాన్ని
  alternative: తమ మొదటి వాగ్దానాన్ని; తమ మునుపటి నిబద్ధతను
  rationale: πίστις సాధారణంగా ‘విశ్వాసం’ అని అర్థమవుతుంది. అయితే ఈ సందర్భంలో అది విధవరాళ్ల జాబితాలో చేరేటప్పుడు చేసిన వాగ్దానం లేదా నిబద్ధతను సూచిస్తుందని కూడా అర్థం చేసుకోవచ్చు. మూలంలోని నిజమైన సందిగ్ధతను ప్రధాన పాఠ్యంలో ఏకపక్షంగా పరిష్కరించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ముందటి సందర్భంతో అనుసంధానమైన స్త్రీల బహువచనాన్ని తెలుగులో సహజమైన ‘వారు’తో వ్యక్తం చేశాం.
