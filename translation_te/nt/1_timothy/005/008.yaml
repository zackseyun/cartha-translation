id: 1TI.5.8
reference: 1 Timothy 5:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δέ τις τῶν ἰδίων καὶ ⸀μάλιστα οἰκείων οὐ ⸀προνοεῖ, τὴν πίστιν ἤρνηται καὶ ἔστιν ἀπίστου χείρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/008.yaml
  text: But if anyone does not provide for his own[a], and especially for members of his household[b], he has denied the faith and is worse than an unbeliever.
translation:
  language: te
  text: అయితే ఎవరైనా తనవారిని[a], ముఖ్యంగా తన ఇంటివారిని పోషించకపోతే, అతడు విశ్వాసాన్ని తిరస్కరించినవాడే; అవిశ్వాసికన్నా చెడ్డవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన సొంతవారిని’; ఈ పదబంధం ఒకే ఇంటిలో నివసించేవారికంటే విస్తృతమైన వర్గాన్ని సూచించవచ్చు. తరువాత వచ్చే ‘తన ఇంటివారిని’ అన్నది ప్రత్యేక బాధ్యతగల వర్గాన్ని నిర్దిష్టంగా చూపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τις
  choice: ఎవరైనా
  rationale: అనిర్దిష్ట ఏకవచనానికి సాధారణ వర్తింపు ఉంది; ‘ఎవరైనా’ లింగానికి పరిమితం చేయకుండా సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: τῶν ἰδίων
  choice: తనవారిని
  rationale: ఈ పదబంధం ఒకే ఇంటిలో నివసించేవారికంటే విస్తృతంగా, తనకు చెందిన బంధువులు లేదా బాధ్యతగలవారిని సూచించగలదు; తరువాతి ‘ఇంటివారిని’ అనే పదం మరింత నిర్దిష్ట వర్గాన్ని చూపుతుంది.
- source_word: μάλιστα
  choice: ముఖ్యంగా
  rationale: విస్తృత వర్గంలో ప్రత్యేక బాధ్యతగల ఉపవర్గాన్ని నొక్కిచెబుతుంది.
- source_word: οἰκείων
  choice: తన ఇంటివారిని
  rationale: తన గృహానికి చెందినవారిని, అంటే తన ప్రత్యక్ష సంరక్షణ బాధ్యతలో ఉన్న ఇంటి సభ్యులను సూచిస్తుంది.
- source_word: προνοεῖ
  choice: పోషించకపోతే
  rationale: ఈ సందర్భంలో ముందుచూపుతో ఆచరణాత్మకంగా శ్రద్ధ తీసుకోవడం, ముఖ్యంగా అవసరాలు తీర్చడం అనే భావం ఉంది; ‘పోషించడం’ ఆ బాధ్యతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τὴν πίστιν
  choice: విశ్వాసాన్ని
  rationale: ఇక్కడ వ్యక్తి ప్రకటించే క్రైస్తవ విశ్వాసాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో నిర్దిష్ట భావం సందర్భం ద్వారానే స్పష్టమవుతుంది.
- source_word: ἤρνηται
  choice: తిరస్కరించినవాడే
  rationale: పూర్తయిన చర్య ఫలితం కొనసాగుతున్నదనే గ్రీకు పరిపూర్ణ కాల భావాన్ని స్థితిని సూచించే ఈ రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπίστου
  choice: అవిశ్వాసికన్నా
  rationale: ఈ వ్యత్యాసంలో విశ్వసించని వ్యక్తిని సూచిస్తుంది; ‘అవిశ్వాసి’ సంక్షిప్తమైన, ప్రామాణిక తెలుగు పదం.
- source_word: χείρων
  choice: చెడ్డవాడు
  rationale: నైతిక పోలికను నేరుగా, బలంగా తెలియజేస్తుంది.
theological_decisions:
- issue: గ్రీకు సాధారణ ఏకవచన నిర్మాణంలో లింగ సూచన
  choice: ‘ఎవరైనా’తో సార్వత్రిక వర్తింపును చూపించి, తరువాత ‘అతడు’ అనే ఏకవచన ప్రతినిధి రూపాన్ని ఉంచడం
  alternative: పూర్తిగా లింగనిరపేక్ష బహువచన రూపంలో వాక్యాన్ని మలచడం
  rationale: గ్రీకు వాక్యం ఏకవచనంలో ఉన్నా దాని వర్తింపు పురుషులకు మాత్రమే పరిమితం కాదు. తెలుగు సహజత్వంతో పాటు మూలంలోని ఏకవచన నిర్మాణాన్ని కూడా నిలుపుతుంది.
- issue: τὴν πίστιν యొక్క భావం
  choice: వ్యక్తి ప్రకటించిన క్రైస్తవ ‘విశ్వాసం’
  alternative: వ్యక్తిగత నమ్మకం లేదా నమ్మకత్వం
  rationale: ఈ సందర్భంలో తన ప్రవర్తన ద్వారా తాను ప్రకటించే విశ్వాసాన్ని తిరస్కరించడం భావం; ‘నమ్మకత్వం’ అని మార్చడం మూలంలోని ఉద్దేశించిన ధార్మిక ఉద్రిక్తతను తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన శైలి. ‘తనవారు’ మరియు ‘ఇంటివారు’ మధ్య మూలపాఠంలోని విస్తృత వర్గం–ప్రత్యేక వర్గం వ్యత్యాసం నిలుపబడింది; వాక్యంలోని తీవ్రమైన నైతిక తీర్పు మృదువుచేయబడలేదు.
