id: 1TI.5.25
reference: 1 Timothy 5:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὰ ⸂ἔργα τὰ καλὰ⸃ ⸀πρόδηλα, καὶ τὰ ἄλλως ἔχοντα κρυβῆναι οὐ δύνανται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/025.yaml
  text: Likewise also[a], good works are evident, and those that are otherwise cannot remain hidden.
translation:
  language: te
  text: అలాగే, మంచి పనులు కూడా స్పష్టంగా కనిపిస్తాయి; వేరుగా ఉన్న పనులు[a] దాగి ఉండలేవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భిన్నంగా ఉన్న పనులు,” “అలా లేని పనులు.” ముందటి వచనంతో ఉన్న పోలికను బట్టి కొందరు దీనిని ప్రత్యేకంగా చెడ్డ పనులను సూచించేదిగా అర్థం చేసుకుంటారు.
    reason: మూలంలోని τὰ ἄλλως ἔχοντα అనే పదబంధం నైతికంగా చెడ్డ పనులనే స్పష్టంగా పేర్కొనకుండా, ‘వేరుగా ఉన్న పనులు’ అనే విస్తృత భావాన్ని కలిగి ఉంది.
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: అలాగే ... కూడా
  rationale: ముందటి వచనంతో ఉన్న సమాంతర సంబంధాన్ని, ὡσαύτως మరియు καί రెండింటి భావాన్నీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἔργα τὰ καλά
  choice: మంచి పనులు
  rationale: ἔργα యొక్క క్రియలు/పనులు అనే స్పష్టమైన భావాన్నీ, καλά యొక్క నైతికంగా మంచి అనే గుణాన్నీ సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: πρόδηλα
  choice: స్పష్టంగా కనిపిస్తాయి
  rationale: బయటపడినవి లేదా తేటగా తెలిసేవి అనే భావాన్ని, తరువాత వచ్చే ‘దాగి ఉండలేవు’ అనే వ్యతిరేకతకు అనుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: τὰ ἄλλως ἔχοντα
  choice: వేరుగా ఉన్నవి
  rationale: అవి చెడ్డ పనులేనని గ్రీకు వాక్యం స్పష్టంగా చెప్పనందున, ‘మరో విధంగా ఉన్నవి/అలా లేనివి’ అనే మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను కాపాడుతుంది.
- source_word: κρυβῆναι οὐ δύνανται
  choice: దాగి ఉండలేవు
  rationale: δύνανται తో కూడిన నిరాకరణలోని అసమర్థతను, ప్రస్తుతం మరుగున ఉన్నా అలాగే నిలిచి ఉండలేవనే సందర్భోచిత భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: τὰ ἄλλως ἔχοντα ప్రత్యేకంగా చెడ్డ పనులను సూచిస్తుందా, లేక వెంటనే స్పష్టంగా కనిపించని ఇతర పనులను మరింత సాధారణంగా సూచిస్తుందా?
  choice: మరింత సాధారణమైన ‘వేరుగా ఉన్నవి’ అనే రూపాన్ని ఉంచడం
  alternative: ‘చెడ్డ పనులు’ అని స్పష్టంగా అనువదించడం
  rationale: ముందటి వచనంతో పోలిక వల్ల చెడ్డ పనులు ఉద్దేశించబడ్డాయని అర్థం చేసుకోవచ్చు; అయితే ఇక్కడ గ్రీకు పాఠం ‘చెడ్డ’ అనే పదాన్ని ఉపయోగించదు. అందువల్ల నైతిక వ్యత్యాసాన్ని అనువాదంలో బలవంతంగా చేర్చకుండా, మూలంలోని విస్తృత భావాన్నీ వ్యాఖ్యాన అవకాశాన్నీ నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘వేరుగా ఉన్నవి’ అనే సంక్షిప్త రూపం మూలంలోని అస్పష్టతను నిలుపుతుంది; దాని సాధ్యమైన అర్థాలు పాదసూచికలో ఇవ్వబడ్డాయి.
