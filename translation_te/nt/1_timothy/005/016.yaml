id: 1TI.5.16
reference: 1 Timothy 5:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἴ ⸀τις πιστὴ ἔχει χήρας, ⸀ἐπαρκείτω αὐταῖς, καὶ μὴ βαρείσθω ἡ ἐκκλησία, ἵνα ταῖς ὄντως χήραις ἐπαρκέσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/016.yaml
  text: If any believing woman has widows[a], let her provide for them, and let the church not be burdened, so that it may provide for those who are truly widows.
translation:
  language: te
  text: విశ్వాసి అయిన ఏ స్త్రీకి విధవరాళ్లు ఉంటే,[a] ఆమె వారికి అవసరమైన సహాయం చేయాలి. సంఘం మీద ఆ భారం పడనివ్వకూడదు; తద్వారా నిజంగా విధవరాళ్లుగా ఉన్నవారికి సంఘం సహాయం అందించగలుగుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో, “విశ్వాసియైన ఏ పురుషునికైనా లేదా స్త్రీకైనా విధవరాళ్లు ఉంటే” అని, మరికొన్ని ప్రతుల్లో “ఏ విశ్వాసికైనా విధవరాళ్లు ఉంటే” అని ఉంది. ఈ పాఠభేదాలు ఆదేశాన్ని ప్రత్యేకంగా ఒక స్త్రీకే కాక మరింత విస్తృతంగా వర్తింపజేస్తాయి.
    reason: textual_variant
lexical_decisions:
- source_word: τις πιστὴ
  choice: విశ్వాసియైన ఏ స్త్రీకైనా
  rationale: πιστή స్త్రీలింగ ఏకవచనం కాబట్టి, ఈ పాఠరూపంలో కర్త ప్రత్యేకంగా ఒక విశ్వాసి స్త్రీ. పాస్టరల్ పత్రికల సందర్భంలో ఇది క్రైస్తవ విశ్వాస గుర్తింపును సూచిస్తుంది.
- source_word: χήρας
  choice: విధవరాళ్లు
  rationale: χήρα పదం బహువచనంలో ఉంది; ఈ అధ్యాయ సందర్భం భౌతిక సహాయం అవసరమైన విధవరాళ్ల గురించి మాట్లాడుతుంది.
- source_word: ἐπαρκείτω / ἐπαρκέσῃ
  choice: అవసరమైన సహాయం చేయాలి / సహాయం చేయగలుగుతుంది
  rationale: ἐπαρκέω ఇక్కడ తగిన ప్రాయోగిక పోషణ లేదా సహాయం అందించడాన్ని సూచిస్తుంది. మొదటి చోట బాధ్యతను సహజమైన తెలుగులో స్పష్టంచేయడానికి ‘అవసరమైన సహాయం చేయాలి’ అని, రెండవ చోట సంఘం చేయగల సహాయంగా అనువదించబడింది.
- source_word: βαρείσθω
  choice: సంఘం మీద ఆ భారం పడనివ్వకూడదు
  rationale: క్రియ యొక్క కర్మణి ఆజ్ఞార్థక భావాన్ని, కుటుంబ సహాయ బాధ్యత సంఘంపై మోపబడకూడదనే ఆర్థిక-ప్రాయోగిక సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἡ ἐκκλησία
  choice: సంఘం
  rationale: పాస్టరల్ పత్రికలలో ἐκκλησία క్రైస్తవ విశ్వాసుల సమాజాన్ని సూచిస్తుంది; ఆధునిక తెలుగు బైబిలు వాడుకలో ‘సంఘం’ స్పష్టమైన, స్థిరమైన పదం.
- source_word: ταῖς ὄντως χήραις
  choice: నిజంగా విధవరాళ్లుగా ఉన్నవారికి
  rationale: ὄντως అనే నొక్కిచెప్పే పదాన్ని ‘నిజంగా’గా నిలుపుతూ, ఈ అధ్యాయంలో కుటుంబ సహాయం లేని అర్హులైన విధవరాళ్ల వర్గాన్ని సూచించే గ్రీకు భావాన్ని అతిగా వివరణ చేయకుండా కాపాడుతుంది.
theological_decisions:
- issue: ప్రారంభ ఉపవాక్యంలోని కర్త లింగం
  choice: ప్రత్యేక స్త్రీ కర్త—‘విశ్వాసియైన ఏ స్త్రీకైనా’
  alternative: ‘ఏ విశ్వాసికైనా’ లేదా ‘విశ్వాసియైన పురుషునికైనా స్త్రీకైనా’
  rationale: ఇచ్చిన SBLGNT పాఠంలో τις πιστή స్త్రీలింగ ఏకవచనం. అందువల్ల ప్రధాన పాఠం లింగాన్ని తటస్థం చేయదు. కర్తను విస్తరించే ఇతర ప్రతుల పాఠభేదం పాదసూచికలో భద్రపరచబడింది.
- issue: ‘నిజమైన విధవరాళ్లు’ అనే వర్గీకరణ
  choice: ‘నిజంగా విధవరాళ్లుగా ఉన్నవారు’ అనే పాఠ్య ఉద్వేగాన్ని నిలుపుట
  alternative: ‘ఆధారం లేని విధవరాళ్లు’ అని సందర్భార్థాన్ని ప్రధాన పాఠంలోనే స్పష్టీకరించడం
  rationale: ὄντως యొక్క నొక్కిచెప్పే భావాన్ని నిలిపి, అర్హతకు సంబంధించిన పూర్తి వివరణను అనువాదంలో చొప్పించకుండా అధ్యాయ సందర్భానికే వదిలివేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ఆమె’ మరియు ‘సంఘం’లను తిరిగి పేర్కొనడం ద్వారా గ్రీకు క్రియల కర్తలు తెలుగులో స్పష్టంగా ఉంచబడ్డారు. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో సంబంధిత వాక్యభాగం వెంట ఉంది.
