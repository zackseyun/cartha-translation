source:
  edition: SBLGNT
  text: Πρεσβυτέρῳ μὴ ἐπιπλήξῃς, ἀλλὰ παρακάλει ὡς πατέρα, νεωτέρους ὡς ἀδελφούς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/001.yaml
  text: Do not rebuke an older man[a], but appeal to him as a father, and to younger men as brothers,
translation:
  language: te
  text: వయసులో పెద్ద పురుషుణ్ణి[a] గద్దించకు; తండ్రితో మాట్లాడినట్లుగా అతనికి హితవు చెప్పు; యువకులకు సోదరులతో మాట్లాడినట్లుగా హితవు చెప్పు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సంఘపెద్దను గట్టిగా గద్దించకు.” గ్రీకు పదం వయసులో పెద్ద పురుషుణ్ణిగానీ, సంఘపెద్దనుగానీ సూచించవచ్చు. అయితే ఈ సందర్భంలో యువకులతో ఉన్న వ్యత్యాసం వయసును సూచించే అర్థానికే బలం ఇస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Πρεσβυτέρῳ
  choice: వయసులో పెద్దవాడైన పురుషుణ్ణి
  rationale: ఇదే వాక్యంలో ఉన్న νεωτέρους (‘వయసులో చిన్నవారైన పురుషులు’) అనే వ్యత్యాసం, సంఘపెద్ద అనే పదవికన్నా వయసులో పెద్దవాడనే అర్థానికి బలం ఇస్తుంది. పురుష ఏకవచనాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: μὴ ἐπιπλήξῃς
  choice: గద్దించకు
  rationale: ἐπιπλήσσωలో మాటలతో తీవ్రంగా మందలించడం లేదా దూషణాత్మకంగా ఎదుర్కోవడం అనే భావం ఉంది. ‘గద్దించకు’ సహజమైన, సంక్షిప్తమైన తెలుగు; మూలంలో లేని తీవ్రతను అదనంగా నిర్దేశించదు.
- source_word: ἀλλὰ παρακάλει
  choice: కాని … వేడుకో
  rationale: παρακαλέωకు ప్రోత్సహించు, బతిమాలు, విజ్ఞప్తి చేయు, హితవు చెప్పు వంటి విస్తృత అర్థపరిధి ఉంది. కఠినంగా గద్దించడానికి వ్యతిరేకంగా, కుటుంబ సంబంధాల ఉపమానాల మధ్య ‘వేడుకో’ గౌరవపూర్వకమైన విజ్ఞప్తిని సహజంగా తెలియజేస్తుంది.
- source_word: ὡς πατέρα
  choice: తండ్రిలా భావించి
  rationale: ὡς పోలికను సూచిస్తుంది. తెలుగులో ‘తండ్రిలా భావించి’ అనేది ఆ వ్యక్తిని తండ్రితో సమానమైన గౌరవంతో చూడాలనే సంబంధాత్మక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: νεωτέρους
  choice: వయసులో చిన్నవారైన పురుషులను
  rationale: పురుష బహువచన విశేషణం నామవాచకంగా వాడబడింది. తరువాతి ἀδελφούςతోనూ, తదుపరి వచనంలో స్త్రీలను విడిగా ప్రస్తావించడంతోనూ ఇది వయసులో చిన్నవారైన పురుషులనే సూచిస్తుంది.
- source_word: ὡς ἀδελφούς
  choice: సోదరులుగా భావించి
  rationale: ఇక్కడ పురుషులను వయసు, లింగం ప్రకారం ప్రత్యేకంగా సంబోధిస్తున్నారు; అందుచేత ἀδελφούςను ‘సోదరులు’గా ఉంచడం సముచితం. మూలంలో స్పష్టంగా లేని ‘విశ్వాస సహోదరులు’ అనే భావాన్ని చేర్చలేదు.
theological_decisions:
- issue: Πρεσβυτέρῳ సంఘపెద్ద అనే పదవిని సూచిస్తుందా, లేక వయసులో పెద్ద పురుషుణ్ణి సూచిస్తుందా?
  choice: 'వయసు ఆధారిత అర్థం: ‘వయసులో పెద్దవాడైన పురుషుడు’'
  alternative: ‘సంఘపెద్ద’
  rationale: 'ఈ వాక్యం, తరువాతి వాక్యంతో కలిసి వయసు-లింగ వర్గాల ప్రకారం కుటుంబ సంబంధాలను చూపుతుంది: పెద్ద పురుషుడు/తండ్రి, చిన్న పురుషులు/సోదరులు, పెద్ద స్త్రీలు/తల్లులు, చిన్న స్త్రీలు/సోదరీలు. కాబట్టి సంఘ పదవిని అనవసరంగా ప్రవేశపెట్టకుండా వయసు ఆధారిత అర్థాన్ని ప్రధాన పాఠంలో ఉంచి, నిజమైన భాషా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.'
- issue: ἀδελφούςను సమ్మిళిత లింగార్థంతో అనువదించాలా?
  choice: ‘సోదరులు’
  alternative: ‘సోదర సోదరీలు’
  rationale: ఈ సందర్భంలో పురుషులు, స్త్రీలు తరువాత విడివిడిగా పేర్కొనబడ్డారు. అందువల్ల పురుష బహువచనాన్ని ‘సోదరులు’గా అనువదించడం మూలంలోని నిర్మాణాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. వయసును సూచించే పదాలు స్పష్టంగా ఉంచబడ్డాయి; కుటుంబ పోలికను సహజ తెలుగు కోసం ‘భావించి’తో వ్యక్తం చేశాం. రెండవ విభాగంలో గ్రీకులో అధ్యాహారంగా ఉన్న παρακάλειను తెలుగులో పునరుక్తి చేసి భావాన్ని పూర్తి చేశాం.
