revisions:
- from: వయసులో పెద్దవాడైన పురుషుణ్ణి[a] గద్దించకు; అతణ్ణి తండ్రిలా భావించి వేడుకో. వయసులో చిన్నవారైన పురుషులను సోదరులుగా భావించి వేడుకో.
  to: వయసులో పెద్ద పురుషుణ్ణి[a] గద్దించకు; తండ్రితో మాట్లాడినట్లుగా అతనికి హితవు చెప్పు; యువకులకు సోదరులతో మాట్లాడినట్లుగా హితవు చెప్పు.
  rationale: The revision keeps the contextual age-based reading and the alternative ‘elder’ footnote, while recasting the family comparisons as the manner of respectful exhortation. It also replaces a potentially over-supplicatory verb and simplifies the younger-male expression for modern standard Telugu.
