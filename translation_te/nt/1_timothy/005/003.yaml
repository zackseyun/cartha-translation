  yaml_path: translation/nt/1_timothy/005/003.yaml
  text: Honor widows who are truly widows[a].
translation:
  language: te
  text: నిజంగా విధవరాలైనవారిని గౌరవించు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిజంగా విధవరాలైనవారికి సహాయం చేయు.” ఈ సందర్భంలో “గౌరవించు” అనేది భౌతిక సహాయాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χήρας
  choice: విధవరాండ్రైనవారిని
  rationale: χήρα భర్తను కోల్పోయిన స్త్రీని సూచిస్తుంది. తెలుగులో గౌరవప్రదంగా, సహజంగా వ్యక్తులను సూచించడానికి ‘విధవరాండ్రైనవారిని’ ఎంచుకున్నాం.
- source_word: τίμα
  choice: గౌరవించు
  rationale: τιμάω యొక్క ప్రాథమిక భావం గౌరవించడం, విలువనివ్వడం. ఈ సందర్భంలో ఆచరణాత్మకమైన, ఆర్థికమైన ఆదరణ కూడా ఇందులో ఉండవచ్చు; అయితే ప్రధాన పాఠంలో క్రియ యొక్క విస్తృత భావాన్ని నిలిపాం.
- source_word: τὰς ὄντως χήρας
  choice: నిజంగా విధవరాండ్రైనవారిని
  rationale: ὄντως అర్హతను నిర్దేశించే ‘నిజంగా’ అనే భావాన్ని ఇస్తుంది. తరువాతి వచనాల్లో వివరించే విధంగా, నిజంగా ఒంటరిగా మిగిలి సంఘ ఆదరణ అవసరమైన విధవరాండ్రను ఇది ప్రత్యేకంగా సూచిస్తుంది.
- source_word: ὄντως
  choice: నిజంగా
  rationale: ఇది కేవలం వాక్యబలాన్ని పెంచడం కాకుండా ఒక వర్గాన్ని ప్రత్యేకంగా గుర్తిస్తుంది; ‘నిజంగా’ ఆ భేదాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ఈ సందర్భంలో τιμάω భావపరిధి
  choice: ‘గౌరవించు’ అని ఉంచి, అందులో భౌతిక ఆదరణ కూడా ఉండవచ్చని పాదసూచికలో తెలిపాం.
  alternative: ‘ఆదరించు’ లేదా ‘పోషించు’ అని అనువదించడం.
  rationale: 1 తిమోతి 5లోని సమీప సందర్భం విధవరాండ్ర భౌతిక సంరక్షణను చర్చిస్తున్నప్పటికీ, గ్రీకు క్రియ ఆర్థిక సహాయానికంటే విస్తృతమైనది. అందువల్ల దాని భావాన్ని అనవసరంగా కుదించకుండా ప్రధాన పాఠంలో ‘గౌరవించు’ అని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన ఆజ్ఞారూపాన్ని వాడాం. ‘విధవరాండ్రు’ అనే రూపం సాధారణంగా అర్థమయ్యేలా ఉండి, వ్యక్తుల పట్ల గౌరవాన్ని కాపాడుతుంది.
