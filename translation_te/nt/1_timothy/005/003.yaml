  to: నిజంగా విధవరాలైనవారిని గౌరవించు[a].
  rationale: The revision corrects the Telugu noun construction while preserving the imperative, the repeated-and-qualified reference to widows, and the broad semantic range of τιμάω. The alternative in the footnote reflects the contextual sense of support without replacing the main rendering “గౌరవించు.”
