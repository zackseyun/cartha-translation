id: 1TI.5.24
reference: 1 Timothy 5:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι πρόδηλοί εἰσιν, προάγουσαι εἰς κρίσιν, τισὶν δὲ καὶ ἐπακολουθοῦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/024.yaml
  text: The sins of some people are obvious[a], going before them to judgment[b], but for others they follow after.
translation:
  language: te
  text: కొందరి పాపాలు స్పష్టంగా కనిపిస్తాయి[a]; అవి తీర్పుకు వారికంటే ముందుగా వెళ్తాయి[b], కానీ మరికొందరి పాపాలు వారి వెనుక వస్తాయి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొందరి పాపాలు స్పష్టంగా ఉంటాయి.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “తీర్పు” అనేది ఈ సందర్భంలో జరుగుతున్న ప్రస్తుత పరిశీలనను సూచించవచ్చు; అయితే ఈ మాటకు దైవిక తీర్పు అనే విస్తృత అర్థం కూడా ఉండవచ్చు.
    reason: alternative_reading
  - marker: c
    text: అక్షరార్థంగా, “వారి వెనుక అనుసరిస్తాయి.” సందర్భంలో, ఈ పాపాలు తరువాత తెలిసివస్తాయనే భావం ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι
  choice: కొందరి పాపాలు
  rationale: సంబంధార్థక విభక్తిలో ఉన్న గ్రీకు పదబంధాన్ని తెలుగులో సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది; ἀνθρώπων ఇక్కడ సాధారణంగా మనుషులను సూచిస్తుంది కాబట్టి లింగాన్ని ప్రత్యేకంగా పేర్కొనలేదు.
- source_word: πρόδηλοί
  choice: స్పష్టంగా కనిపిస్తాయి
  rationale: పాపాలు బహిరంగంగా లేదా సులభంగా గుర్తించదగినవిగా ఉన్నాయనే భావాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: προάγουσαι εἰς κρίσιν
  choice: అవి తీర్పుకు ముందుగానే వెళ్తాయి
  rationale: పాపాలు వ్యక్తులకంటే ముందుగా తీర్పు వద్దకు వెళ్తున్నాయనే మూలంలోని వ్యక్తీకరణను, εἰς యొక్క దిశార్థాన్ని నిలుపుతుంది.
- source_word: κρίσιν
  choice: తీర్పు
  rationale: ఇది ప్రస్తుత సందర్భంలోని పరిశీలనను లేదా విస్తృతమైన దైవిక తీర్పును సూచించవచ్చు; అనువాదం ఏ ఒక్క అర్థానికీ పరిమితం చేయదు.
- source_word: τισὶν δὲ καὶ ἐπακολουθοῦσιν
  choice: మరికొందరి పాపాలు తరువాత బయటపడతాయి
  rationale: మొదటి వర్గంతో ఉన్న వ్యత్యాసాన్ని స్పష్టపరుస్తూ, ఆ పాపాలు వెంటనే కాక తరువాత తెలిసివస్తాయనే సందర్భార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: κρίσις అనే పదం సూచించే తీర్పు పరిధి
  choice: తీర్పు
  alternative: సంఘంలోని ప్రస్తుత పరిశీలన; అంతిమ దైవిక తీర్పు
  rationale: సమీప సందర్భం వ్యక్తులను పరిశీలించడాన్ని సూచించినా, గ్రీకు పదానికి విస్తృతమైన తీర్పు భావం కూడా ఉండవచ్చు. అందువల్ల అస్పష్టతను పరిష్కరించకుండా సాధారణ పదాన్నే ఉంచాం.
- issue: చివరి క్రియలో పాపాల వ్యక్తీకరణ
  choice: తరువాత బయటపడతాయి
  alternative: వారి వెనుక వస్తాయి
  rationale: గ్రీకులోని ‘వెంట అనుసరించడం’ అనే రూపకాన్ని అక్షరార్థంగా ఇవ్వడం సాధ్యమే; అయితే తెలుగులో సందర్భార్థం స్పష్టంగా ఉండేందుకు అవి తరువాత వెల్లడవుతాయనే భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని తీర్పు సంబంధిత అర్థసందిగ్ధతను పాదటిప్పణితో కాపాడాం.
