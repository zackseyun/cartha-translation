source:
  edition: SBLGNT
  text: κατὰ πρεσβυτέρου κατηγορίαν μὴ παραδέχου, ἐκτὸς εἰ μὴ ἐπὶ δύο ἢ τριῶν μαρτύρων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/019.yaml
  text: Do not accept an accusation against an elder[b][a], except on the basis of two or three witnesses.
translation:
  language: te
  text: సంఘపెద్దకు[a] వ్యతిరేకంగా చేసిన ఆరోపణను స్వీకరించవద్దు; ఇద్దరు లేదా ముగ్గురు సాక్షుల[b] సాక్ష్యం ఆధారంగా అయితే తప్ప.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, πρεσβυτέρου అనే పదాన్ని సంఘ పదవిగా కాక వయస్సును సూచించేదిగా తీసుకుంటే, “వయస్సులో పెద్దవాడికి వ్యతిరేకంగా.”
    reason: alternative_reading
  - marker: b
    text: ఒక విషయం “ఇద్దరు లేదా ముగ్గురు సాక్షుల” ఆధారంగా నిర్ధారించబడాలనే పాత నిబంధన న్యాయసూత్రాన్ని ఈ మాటలు ప్రతిధ్వనింపజేస్తాయి (ద్వితీయోపదేశకాండము 19:15 చూడండి).
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρεσβυτέρου
  choice: సంఘపెద్దకు వ్యతిరేకంగా
  rationale: πρεσβύτερος వయస్సులో పెద్దవాణ్ణి లేదా సంఘ నాయకుడైన పెద్దను సూచించగలదు. సమీప సందర్భంలో సంఘపెద్దల గౌరవం, శాసనం గురించి సూచనలు ఉన్నందున పదవిని సూచించే భావమే ఎక్కువ సంభావ్యమైనది; తెలుగులో సందిగ్ధతను తగ్గించడానికి ‘సంఘపెద్ద’ వాడబడింది.
- source_word: κατηγορίαν
  choice: ఆరోపణను
  rationale: ఈ నామవాచకం న్యాయపరమైన లేదా అధికారిక నిందారోపణను సూచిస్తుంది. ‘ఆరోపణ’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి ఆ గంభీరతను నిలుపుతుంది.
- source_word: μὴ παραδέχου
  choice: స్వీకరించవద్దు
  rationale: ఈ ఆజ్ఞ ఆరోపణను విచారణకు తీసుకోవడం లేదా అంగీకరించడం నిషేధిస్తుంది. ‘స్వీకరించవద్దు’ మూలంలోని విధానపరమైన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐκτὸς εἰ μὴ
  choice: ఉంటే తప్ప
  rationale: ఈ గ్రీకు ప్రయోగం మినహాయింపును ప్రవేశపెడుతుంది. తెలుగు వాక్య నిర్మాణంలో ‘ఉంటే తప్ప’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: ἐπὶ δύο ἢ τριῶν μαρτύρων
  choice: ఇద్దరు లేదా ముగ్గురు సాక్షుల ఆధారం
  rationale: ἐπί ఇక్కడ సాక్షులు అందించే ఆధారం మీద ఆరోపణను స్వీకరించాలనే సాక్ష్యపరమైన భావాన్ని కలిగి ఉంది. ఈ అనువాదం ద్వితీయోపదేశకాండపు న్యాయసూత్ర ప్రతిధ్వనిని కాపాడుతుంది.
theological_decisions:
- issue: సంఘ సందర్భంలో πρεσβυτέρου యొక్క అర్థం
  choice: సంఘ నాయకుడు/పదవిలో ఉన్న పెద్ద
  alternative: వయస్సులో పెద్దవాడు
  rationale: 1 తిమోతి 5లోని సమీప సందర్భం సంఘపెద్దల గౌరవం మరియు క్రమశిక్షణ గురించి మాట్లాడుతున్నందున పదవిసంబంధ అర్థమే ఎక్కువ సంభావ్యమైనది. అయినా వయస్సుసంబంధ అర్థం భాషాపరంగా సాధ్యమే కాబట్టి దాన్ని పాదసూచికలో నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన, స్వల్ప న్యాయపరమైన శైలి పాటించబడింది. ‘సంఘపెద్ద’ సాధారణ పాఠకుడికి పదవిసంబంధ భావాన్ని స్పష్టం చేస్తుంది. మూలంలోని సాధ్యమైన వయస్సుసంబంధ అర్థం పాదసూచికలో భద్రపరచబడింది.
