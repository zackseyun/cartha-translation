source:
  edition: SBLGNT
  text: ἤδη γάρ τινες ἐξετράπησαν ὀπίσω τοῦ Σατανᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/015.yaml
  text: For some have already turned aside to follow Satan.
translation:
  language: te
  text: ఎందుకంటే కొందరు ఇప్పటికే దారి మళ్లి సాతాను వెంట వెళ్లారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “సాతాను వెనుకకు దారి మళ్లారు.”
    reason: ὀπίσωలోని ‘వెనుక/తరువాత’ దిశారూపకాన్ని, ἐξετράπησανలోని ‘దారి మళ్లారు’ అనే భావాన్ని రెండింటినీ చూపించే ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: ἤδη
  choice: ఇప్పటికే
  rationale: గతంలో జరిగిన ఈ వైదొలగడం ప్రస్తుత సందర్భానికల్లా నిజంగా సంభవించిందనే కాలసూచక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందున్న ఉపదేశానికి కారణం లేదా వివరణను పరిచయం చేసే అనుసంధాన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τινες
  choice: కొందరు
  rationale: ఎవరో నిర్దిష్టంగా చెప్పకుండా ఒక వర్గంలోని కొంతమందిని సూచించే అనిశ్చిత బహువచన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐξετράπησαν
  choice: దారి మళ్లి
  rationale: సరైన మార్గం నుంచి పక్కకు తిరగడం అనే మూలపాఠంలోని మార్గరూపకాన్ని నిలుపుతుంది; ఎవరో వారిని తప్పుదారి పట్టించారనే కారణార్థాన్ని అనవసరంగా చేర్చదు.
- source_word: ὀπίσω
  choice: వెంట వెళ్లారు
  rationale: వ్యక్తిని సూచించే షష్ఠీ విభక్తి పదంతో వచ్చినప్పుడు ‘వెనుక/తరువాత’ వెళ్లి అనుసరించడం అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; అక్షరార్థ దిశారూపకాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: Σατανᾶ
  choice: సాతాను
  rationale: కొత్త నిబంధన తెలుగు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: ὀπίσω τοῦ Σατανᾶ అనే పదబంధాన్ని అక్షరార్థంగా ‘సాతాను వెనుక’ అనాలా, భావానుసారంగా ‘సాతాను వెంట’ అనాలా
  choice: సాతాను వెంట వెళ్లారు
  alternative: సాతాను వెనుక వెళ్లిపోయారు
  rationale: ఈ పదబంధం సాతానును అనుసరించడం లేదా అతని పక్షాన నడవడం అనే గంభీర భావాన్ని సూచిస్తుంది. ‘వెంట వెళ్లారు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండగా, ‘వెనుక’ అనే మూల దిశారూపకాన్ని పాదటిప్పణి ద్వారా సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘దారి మళ్లి’ మూలంలోని మార్గరూపకాన్ని, ‘వెంట వెళ్లారు’ అనుసరణ భావాన్ని సహజంగా కలుపుతున్నాయి.
