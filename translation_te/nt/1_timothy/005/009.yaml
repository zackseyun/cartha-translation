revisions:
- from: అరవై సంవత్సరాలకంటే తక్కువ వయస్సు లేని, ఒకే భర్తకు భార్యగా ఉన్న విధవరాలిని మాత్రమే జాబితాలో చేర్చాలి.[a]
  to: అరవై సంవత్సరాల వయస్సు కంటే తక్కువ కాని, ఒక భర్తకు భార్యగా ఉండిన విధవరాలినే జాబితాలో చేర్చాలి.[a]
  rationale: The revision preserves the administrative requirement and the minimum age, while changing the final qualification to a past participial form appropriate for a widow and closer to γεγονυῖα. It does not decide whether ἑνὸς ἀνδρὸς γυνή requires a single marriage or denotes marital faithfulness/reputation; the footnote retains that ambiguity in natural scholarly Telugu.
  reviewer_model: gpt-5.6-terra
