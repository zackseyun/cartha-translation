id: 1TI.5.9
reference: 1 Timothy 5:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Χήρα καταλεγέσθω μὴ ἔλαττον ἐτῶν ἑξήκοντα γεγονυῖα, ἑνὸς ἀνδρὸς γυνή,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/009.yaml
  text: Let a widow be enrolled only if she is not less than sixty years old[a], having been the wife of one husband,
translation:
  language: te
  text: అరవై సంవత్సరాల వయస్సు కంటే తక్కువ కాని, ఒక భర్తకు భార్యగా ఉండిన విధవరాలినే జాబితాలో చేర్చాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, అక్షరార్థంగా, “ఒక పురుషుని స్త్రీ.” ఈ పదబంధం వైవాహిక విశ్వాస్యతను లేదా మంచి పేరును సూచించవచ్చు; అయితే కొందరు దీనిని “ఒక్కసారి మాత్రమే వివాహం చేసుకున్నది” అని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: Χήρα
  choice: విధవరాలు
  rationale: భర్త మరణించిన స్త్రీ అనే సాధారణ అర్థాన్ని, ఈ సందర్భంలోని అధికారిక గుర్తింపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: καταλεγέσθω
  choice: జాబితాలో చేర్చాలి
  rationale: ఇది కేవలం పరిగణించడం కాకుండా అధికారిక జాబితాలో నమోదు చేయడాన్ని సూచిస్తుంది.
- source_word: μὴ ἔλαττον ἐτῶν ἑξήκοντα γεγονυῖα
  choice: అరవై సంవత్సరాలకంటే తక్కువ వయస్సు లేని
  rationale: అరవై సంవత్సరాలు కనీస వయస్సు అనే పరిమితిని, γεγονυῖα సూచించే ఆ వయస్సుకు చేరిన స్థితితో సహా స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἑνὸς ἀνδρὸς γυνή
  choice: ఒకే భర్తకు భార్యగా ఉన్న
  rationale: గ్రీకు నుడికారానికి దగ్గరగా ఉండి, అది వైవాహిక విశ్వాస్యతను సూచిస్తుందా లేక ఒక్కసారి మాత్రమే వివాహం చేసుకోవడాన్ని సూచిస్తుందా అనే అస్పష్టతను ప్రధాన పాఠ్యంలో నిలుపుతుంది.
theological_decisions:
- issue: ἑνὸς ἀνδρὸς γυνή అనే పదబంధం యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో “ఒకే భర్తకు భార్యగా ఉన్న” అనే నుడికారసదృశ అనువాదాన్ని ఉంచడం
  alternative: “తన భర్తకు నమ్మకంగా ఉన్నది” లేదా “ఒక్కసారి మాత్రమే వివాహం చేసుకున్నది”
  rationale: గ్రీకు పదబంధం వైవాహిక విశ్వాస్యత/మంచి పేరును సూచించవచ్చు; మరికొందరు దాన్ని ఒక్క వివాహానికే పరిమితమైన చరిత్రగా అర్థం చేసుకుంటారు. మూలపాఠ్యం దీనిని నిర్ణయాత్మకంగా పరిష్కరించనందున ఆ భావ ఉద్రిక్తతను నిలిపి, ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. “జాబితాలో చేర్చాలి” పరిపాలనా భావాన్ని స్పష్టంగా తెలియజేస్తుంది; వివాదాస్పద వైవాహిక అర్హతను అతిగా వివరణ చేయకుండా ఉంచింది.
