review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the widow, official enrollment, and minimum age. However, “ఒకే భర్తకు భార్యగా ఉన్న” uses a present-state expression that sits awkwardly with “విధవరాలు” and may over-specify the disputed idiom. A past participial expression better reflects γεγονυῖα and the English audit trail’s “having been,” while retaining the Greek phrase’s unresolved force.
  naturalness: “జాబితాలో చేర్చాలి” is natural modern Telugu and suitably conveys formal enrollment. “ఒక భర్తకు భార్యగా ఉండిన” is more coherent with a widow than “భార్యగా ఉన్న,” without making the phrase overly interpretive.
  terminology: విధవరాలు and జాబితాలో చేర్చాలి are appropriate. The footnote should avoid the unnatural possessive wording “ఒక పురుషునికే చెందిన స్త్రీ” and identify the literal idiom while retaining the two principal interpretive possibilities.
  issues:
  - severity: medium
    issue: The phrase “ఒకే భర్తకు భార్యగా ఉన్న” is expressed as a current state.
    rationale: Since the person is a widow, “ఉన్న” is discordant in Telugu. The Greek perfect participle γεγονυῖα supports a past/attained-status formulation (“ఉండిన”), as reflected in the English rendering “having been.”
  - severity: low
    issue: The footnote’s “ఒక పురుషునికే చెందిన స్త్రీ” is unnatural and can sound possessive in an unhelpful way.
    rationale: A literal-label introduction followed by the Greek-like phrase “ఒక పురుషుని స్త్రీ” better signals that this is an idiom, not an independently natural Telugu paraphrase.
  revised_text: అరవై సంవత్సరాల వయస్సు కంటే తక్కువ కాని, ఒక భర్తకు భార్యగా ఉండిన విధవరాలినే జాబితాలో చేర్చాలి.[a]
