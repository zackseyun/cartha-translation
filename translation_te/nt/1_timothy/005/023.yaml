id: 1TI.5.23
reference: 1 Timothy 5:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μηκέτι ὑδροπότει, ἀλλὰ οἴνῳ ὀλίγῳ χρῶ διὰ τὸν ⸀στόμαχον καὶ τὰς πυκνάς σου ἀσθενείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/023.yaml
  text: No longer drink only water[a], but use a little wine because of your stomach and your frequent illnesses.
translation:
  language: te
  text: ఇకపై నీళ్లు మాత్రమే తాగుతూ ఉండకు; నీ కడుపు కోసమూ, నీకు తరచుగా వచ్చే అనారోగ్యాల కోసమూ కొద్దిగా ద్రాక్షారసం తీసుకో.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “ఇకపై నీళ్లు తాగేవాడిగా ఉండకు.” తిమోతి నీళ్లు మాత్రమే తాగే అలవాటును కొనసాగించకూడదనేది భావం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηκέτι
  choice: ఇకమీదట ... తాగకుండా
  rationale: ఇంతకుముందు కొనసాగిన అలవాటును ఇక కొనసాగించవద్దనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὑδροπότει
  choice: నీళ్లు మాత్రమే తాగకుండా
  rationale: మూల క్రియ అక్షరార్థంగా నీళ్లు తాగడాన్ని సూచిస్తుంది; ἀλλάతో వచ్చే వ్యత్యాసం దృష్ట్యా నీళ్లు మాత్రమే తాగే అలవాటు ఉద్దేశించబడింది. నీళ్లను పూర్తిగా మానేయాలనే అపార్థాన్ని ఇది నివారిస్తుంది.
- source_word: ἀλλὰ
  choice: కూడా
  rationale: తెలుగు వాక్య నిర్మాణంలో ‘నీళ్లు మాత్రమే ... కాకుండా ... కూడా’ అనే రూపం మూలంలోని వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἴνῳ ὀλίγῳ
  choice: కొద్దిగా ద్రాక్షారసం
  rationale: ὀλίγῳ పరిమిత పరిమాణాన్ని స్పష్టంగా కాపాడుతుంది; οἶνοςను సాధారణ తెలుగు బైబిలు వాడుకకు అనుగుణంగా ద్రాక్షారసం అని అనువదించాం.
- source_word: χρῶ
  choice: తీసుకో
  rationale: χράομαι యొక్క ‘ఉపయోగించు’ భావాన్ని ఈ సేవన సందర్భంలో సహజంగా తెలియజేస్తుంది; ‘తాగు’ కంటే మూలంలోని విస్తృత ప్రయోగ భావాన్ని నిలుపుతుంది.
- source_word: διὰ
  choice: కోసం
  rationale: ఇక్కడ కారణం లేదా ప్రయోజనాన్ని సూచిస్తుంది; ఆరోగ్య సంబంధ సందర్భంలో ‘కోసం’ సహజంగా ఉంది.
- source_word: στόμαχον
  choice: కడుపు
  rationale: సాధారణ పాఠకులకు అర్థమయ్యే సూటి శరీరావయవ పదం.
- source_word: πυκνάς
  choice: తరచుగా కలిగే
  rationale: పునరావృతమయ్యే తరచుదనాన్ని సహజ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀσθενείας
  choice: అనారోగ్యాలు
  rationale: ‘బలహీనతలు’ అనే విస్తృత అర్థం సాధ్యమైనా, కడుపు ప్రస్తావనతో కూడిన ఈ శారీరక సందర్భంలో రోగాలు లేదా అనారోగ్యాలు అనే భావమే సంభావ్యమైనది.
theological_decisions:
- issue: తిమోతికి ఉన్న నీళ్లు తాగే అలవాటు ప్రత్యేకంగా నీళ్లు మాత్రమే తాగడమా?
  choice: నీళ్లు మాత్రమే తాగకుండా
  alternative: ఇకమీదట నీళ్లు తాగవద్దు
  rationale: οἴνῳతో ἀλλά ద్వారా చూపిన వ్యత్యాసం నీళ్లను పూర్తిగా నిషేధించడం కంటే ద్రాక్షారసం తీసుకోకుండా నీళ్లు మాత్రమే తాగే అలవాటును సూచిస్తుంది. అనువాదం ఈ సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
- issue: οἶνοςను అక్షరార్థంగా ఉంచాలా, ఔషధ పానీయంగా సాధారణీకరించాలా?
  choice: ద్రాక్షారసం
  alternative: ఔషధ పానీయం
  rationale: మూలపాఠం οἶνος అనే నిర్దిష్ట పదాన్నే ఉపయోగిస్తుంది. దానిని సిద్ధాంతపరమైన లేదా సాంస్కృతిక కారణాలతో సాధారణీకరించలేదు; ‘కొద్దిగా’ అనే పరిమితి మూలంలో ఉన్న మితాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘నీళ్లు’ సాధారణ ప్రజావాడుకకు అనుకూలం; ‘ద్రాక్షారసం’ తెలుగు బైబిలు సంప్రదాయంలో పరిచితమైన పదం. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పదబంధం అనంతరం ఉంచబడింది.
