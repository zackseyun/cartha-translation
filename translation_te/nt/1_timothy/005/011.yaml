id: 1TI.5.11
reference: 1 Timothy 5:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: νεωτέρας δὲ χήρας παραιτοῦ· ὅταν γὰρ καταστρηνιάσωσιν τοῦ Χριστοῦ, γαμεῖν θέλουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/011.yaml
  text: But refuse younger widows[a], for when they become sensual against the Messiah, they desire to marry[c][b],
translation:
  language: te
  text: యువ విధవరాళ్లను మాత్రం స్వీకరించవద్దు.[a] ఎందుకంటే, వారు మెస్సీయకు విరుద్ధంగా ఇంద్రియ వాంఛలకు లోనైనప్పుడు[b][c], పెళ్లి చేసుకోవాలని కోరుకుంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సందర్భాన్ని బట్టి, ‘స్వీకరించవద్దు’ అంటే విధవరాళ్ల జాబితాలో చేర్చుకోవద్దని భావం కావచ్చు.
    reason: contextual_clarification
  - marker: b
    text: అక్షరార్థంగా, ‘మెస్సీయకు విరుద్ధంగా’; వారి కోరికలు ఆయన పట్ల ఉన్న మునుపటి అంకితభావంతో లేదా నిబద్ధతతో ఘర్షణపడతాయని భావం కావచ్చు.
    reason: alternative_reading
  - marker: c
    text: లేదా, ‘మెస్సీయను లెక్కచేయకుండా ఇంద్రియాసక్తికి లోనైనప్పుడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: νεωτέρας δὲ χήρας
  choice: యువ విధవరాళ్లను మాత్రం
  rationale: νεωτέρας నేరుగా χήρας‌ను విశేషిస్తుంది; ముందు చెప్పిన విధవరాళ్లతో ఉన్న స్వల్ప వ్యత్యాసాన్ని δέ సూచిస్తుంది. ‘యువ విధవరాళ్లు’ సహజంగా ఉండి నిర్దిష్ట వయోపరిమితిని కల్పించదు.
- source_word: παραιτοῦ
  choice: స్వీకరించవద్దు
  rationale: ఇది ఏకవచన మధ్యమపురుష ఆజ్ఞ. సందర్భంలో విధవరాళ్ల జాబితాలో చేర్చడాన్ని నిరాకరించమనే భావం ఉంది; వ్యక్తులనే పూర్తిగా తిరస్కరించమనే అపార్థం రాకుండా ‘స్వీకరించవద్దు’ అని ఇచ్చాం.
- source_word: ὅταν γὰρ
  choice: ఎందుకంటే, ... అయినప్పుడు
  rationale: γάρ కారణాన్ని, ὅταν సాధారణంగా సంభవించే సందర్భాన్ని సూచిస్తాయి; తెలుగు వాక్యంలో రెండింటినీ సహజంగా నిలిపాం.
- source_word: καταστρηνιάσωσιν
  choice: ఇంద్రియ వాంఛలకు లోనైనప్పుడు
  rationale: అరుదైన ఈ క్రియలో ఇంద్రియాసక్తి లేదా బలమైన శారీరక కోరికలచేత నడిపించబడే భావం ఉంది. ‘లోనైనప్పుడు’ ఆ కోరికల ప్రభావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τοῦ Χριστοῦ
  choice: మెస్సీయకు విరుద్ధంగా
  rationale: ఈ క్రియ తర్వాతి సంబంధవిభక్తి కఠినమైనదైనా, కోరికలు మెస్సీయ పట్ల ఉన్న నిబద్ధతతో ఘర్షణపడే భావాన్ని ‘విరుద్ధంగా’ దగ్గరగా కాపాడుతుంది. Χριστός ఇక్కడ బిరుదుగా ఉన్నందున ‘మెస్సీయ’ అని అనువదించాం.
- source_word: γαμεῖν θέλουσιν
  choice: పెళ్లి చేసుకోవాలని కోరుకుంటారు
  rationale: θέλω + క్రియార్థకం కోరిక లేదా ఉద్దేశాన్ని వ్యక్తం చేస్తుంది. ఈ తెలుగు రూపం రెండింటినీ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: Χριστοῦ పదం అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: Χριστός ఇక్కడ పేరు వలె కాక బిరుదుగా పనిచేస్తోంది; అందువల్ల దాని బిరుదు భావాన్ని స్పష్టంగా చూపే ‘మెస్సీయ’ను ఎంచుకున్నాం.
- issue: καταστρηνιάω τοῦ Χριστοῦ అనే కఠిన నిర్మాణం
  choice: మెస్సీయకు విరుద్ధంగా ఇంద్రియ వాంఛలకు లోనవడం
  alternative: ఇంద్రియ వాంఛల వల్ల మెస్సీయ పట్ల తమ నిబద్ధతను లెక్కచేయకపోవడం
  rationale: గ్రీకు నిర్మాణంలోని ‘మెస్సీయకు విరుద్ధంగా’ అనే ఉద్రిక్తతను ప్రధాన పాఠ్యంలో ఉంచాం. పునర్వివాహమే తప్పని వాక్యం చెబుతున్నట్లు చేయకుండా, కోరికకు మరియు మెస్సీయ పట్ల నిబద్ధతకు మధ్య ఉన్న ఘర్షణను మాత్రమే వ్యక్తం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడాం. ‘యువ విధవరాళ్లు,’ ‘పెళ్లి చేసుకోవడం’ వంటి సహజ రూపాలను ఎంచుకుని, అరుదైన గ్రీకు క్రియలోని నైతిక-ఇంద్రియ భావాన్ని అతిగా సిద్ధాంతీకరించకుండా నిలిపాం.
