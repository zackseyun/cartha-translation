review_pass:
  verdict: approve
  source_fidelity: The translation preserves the contrast (δέ), the directive concerning younger widows, the explanatory-temporal force of ὅταν γάρ, the difficult relation expressed by καταστρηνιάσωσιν τοῦ Χριστοῦ, and their desire to marry. ‘మెస్సీయకు విరుద్ధంగా’ appropriately retains the source’s difficult and potentially relational wording without making remarriage itself the stated fault.
  naturalness: Modern standard Telugu is clear and suitably formal. ‘యువ విధవరాళ్లను మాత్రం స్వీకరించవద్దు’ reads naturally in the administrative context, while the contextual footnote prevents it from being read as a blanket social rejection. ‘ఇంద్రియ వాంఛలకు లోనైనప్పుడు’ is understandable and appropriately restrained for the rare Greek verb.
  terminology: ‘మెస్సీయ’ correctly reflects Χριστός as a title in this context. ‘పెళ్లి చేసుకోవాలని కోరుకుంటారు’ naturally conveys γαμεῖν θέλουσιν. The wording does not impose a denominational explanation of the disputed genitive construction.
  issues:
  - severity: low
    issue: ‘మాత్రం’ is a slightly stronger Telugu contrast marker than the mild Greek δέ.
    rationale: In this context it functions naturally to distinguish younger widows from the preceding group and does not materially alter the instruction.
