id: 1TI.5.20
reference: 1 Timothy 5:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀τοὺς ἁμαρτάνοντας ἐνώπιον πάντων ἔλεγχε, ἵνα καὶ οἱ λοιποὶ φόβον ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/020.yaml
  text: Rebuke those who are sinning before everyone[b][a], so that the rest also may have fear.
translation:
  language: te
  text: పాపం చేస్తున్నవారిని[b][a] అందరి సమక్షంలో గద్దించు; తద్వారా మిగిలినవారికీ భయం కలగాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పాపంలో కొనసాగుతున్నవారిని’; వర్తమానకాల కృదంతం కొనసాగుతున్న పాప ప్రవర్తనను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: తక్షణ సందర్భాన్ని బట్టి ఇక్కడ ప్రత్యేకంగా పాపం చేస్తున్న సంఘపెద్దలు ఉద్దేశించబడి ఉండవచ్చు; అయితే ఈ వచనం స్వయంగా ‘పాపం చేస్తున్నవారు’ అని మాత్రమే చెబుతుంది.
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ἁμαρτάνοντας
  choice: పాపం చేస్తూ ఉన్నవారిని
  rationale: వర్తమానకాల కృదంతం వ్యక్తులను సూచిస్తూ, జరుగుతున్న లేదా కొనసాగుతున్న పాప ప్రవర్తనను తెలియజేస్తుంది. ‘పాపంలో కొనసాగుతున్నవారిని’ అనేది సాధ్యమైన భావమే అయినా, మూలంలో ఉన్నదానికంటే కొద్దిగా ఎక్కువ వ్యాఖ్యానాత్మకం; అందువల్ల దాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐνώπιον πάντων
  choice: అందరి సమక్షంలో
  rationale: ‘అందరి ఎదుట’ అనే మూలార్థాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἔλεγχε
  choice: గద్దించు
  rationale: ἐλέγχω అనే పదానికి తప్పును బయటపెట్టడం, ఒప్పించడం, మందలించడం వంటి అర్థాలు ఉన్నాయి. సంఘ క్రమశిక్షణ సందర్భంలో ‘గద్దించు’ బహిరంగంగా తప్పును ఎత్తిచూపి సరిదిద్దే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: οἱ λοιποὶ
  choice: మిగిలినవారు
  rationale: తప్పు చేసినవారికి భిన్నంగా సమాజంలో ఉన్న ఇతరులను సూచించే λοιποί పదానికి ఇది సంక్షిప్తమైన సహజ సమానార్థకం.
- source_word: φόβον ἔχωσιν
  choice: భయపడతారు
  rationale: అక్షరార్థంగా ‘భయం కలిగి ఉండాలి’ అనే గ్రీకు నుడికారాన్ని సహజ తెలుగులో తెలిపింది. ఇది కేవలం భీతిని మాత్రమే కాక, హెచ్చరికతో కూడిన జాగ్రత్తను కూడా సూచించగలదు; ఆ పరిధిని సందర్భానికి వదిలివేస్తుంది.
theological_decisions:
- issue: ఈ వచనంలో పాపం చేస్తున్నవారి పరిధి
  choice: ప్రధాన పాఠంలో ‘పాపం చేస్తూ ఉన్నవారు’ అని విస్తృతంగానే ఉంచాం; వారిని పెద్దలుగా స్పష్టంగా పేర్కొనలేదు.
  alternative: 19–20 వచనాల తక్షణ సందర్భాన్ని బట్టి ఇది ప్రత్యేకంగా పాపం చేస్తున్న సంఘపెద్దలను సూచించవచ్చు.
  rationale: ఈ వచనంలోని గ్రీకు పాఠం ‘పాపం చేస్తున్నవారు’ అని మాత్రమే చెబుతుంది. ముందరి వచనం పెద్దల గురించి మాట్లాడుతున్నందున ఆ సూచన సాధ్యమే; అయితే మూలంలో మళ్లీ లేని ‘పెద్దలు’ అనే పదాన్ని ప్రధాన పాఠంలో చేర్చకుండా, సందర్భ సంబంధమైన అనిశ్చితిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన సంఘ బోధనా శైలిని వాడాం. ‘సమక్షంలో’ బహిరంగ సందర్భాన్ని స్పష్టంగా ఉంచుతుంది; ‘గద్దించు’ క్రమశిక్షణాత్మక సరిదిద్దుదలను తెలియజేస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
