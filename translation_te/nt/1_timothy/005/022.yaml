source:
  edition: SBLGNT
  text: χεῖρας ταχέως μηδενὶ ἐπιτίθει, μηδὲ κοινώνει ἁμαρτίαις ἀλλοτρίαις· σεαυτὸν ἁγνὸν τήρει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/022.yaml
  text: Do not lay hands on anyone hastily[a], nor share in the sins of others; keep yourself pure.
translation:
  language: te
  text: ఎవరి మీదా తొందరపడి చేతులు ఉంచవద్దు[a]; ఇతరుల పాపాలలో పాలుపంచుకోవద్దు. నిన్ను నీవు శుద్ధంగా కాపాడుకో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ సందర్భంలో మరింత నిర్దిష్టంగా, “ఎవరినీ తొందరపడి నియమించవద్దు.” గ్రీకులో అక్షరార్థంగా “చేతులు ఉంచు” అని ఉంది; ఈ పదబంధం తరచుగా పరిచర్యకు నియమించడం లేదా పరిచర్యలో గుర్తింపునివ్వడంతో సంబంధం కలిగి ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: χεῖρας ... ἐπιτίθει
  choice: చేతులు ఉంచవద్దు
  rationale: గ్రీకు పదబంధం అక్షరార్థంగా ‘చేతులు ఉంచడం’ అని చెబుతుంది. ఈ సందర్భంలో అది పరిచర్యకు నియమించడం లేదా గుర్తింపునివ్వడాన్ని సూచించవచ్చు; అయినా మూలంలోని విస్తృతమైన ప్రయోగాన్ని ప్రధాన పాఠ్యంలో నిలిపి ఉంచాం.
- source_word: ταχέως
  choice: తొందరపడి
  rationale: కేవలం వేగాన్ని కాక, తగిన పరిశీలన లేకుండా అకాలంగా చర్య తీసుకోవడాన్ని ఈ సందర్భంలో సూచిస్తుంది.
- source_word: μηδενὶ
  choice: ఎవరి మీదా ... వద్దు
  rationale: నిషేధంతో కలిపి సార్వత్రిక పరిధిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μηδὲ κοινώνει
  choice: పాలుపంచుకోవద్దు
  rationale: ఇక్కడ κοινωνέω ఇతరుల క్రియల్లో భాగస్వామి కావడం లేదా వాటికి బాధ్యత పంచుకోవడం అనే భావాన్ని ఇస్తుంది.
- source_word: ἁμαρτίαις ἀλλοτρίαις
  choice: ఇతరుల పాపాల్లో
  rationale: ἀλλοτρίαις అంటే ఇతరులకు చెందినవి; ఈ తెలుగు రూపం ఆ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: σεαυτὸν
  choice: నిన్ను నీవు
  rationale: ఆజ్ఞకు కర్మగా ఉన్న ఆత్మవాచక సర్వనామాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἁγνὸν
  choice: పవిత్రంగా
  rationale: ఇక్కడ విస్తృతమైన నైతిక శుద్ధిని సూచిస్తుంది; లైంగిక పవిత్రతకే పరిమితం చేయదు.
- source_word: τήρει
  choice: కాపాడుకో
  rationale: నిరంతరం తనను తాను పవిత్రంగా ఉంచుకోవాలనే వర్తమాన ఆజ్ఞ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ‘చేతులు ఉంచడం’ అనే పదబంధం యొక్క సందర్భార్థం
  choice: ప్రధాన పాఠ్యంలో ‘చేతులు ఉంచడం’ అనే మూలభాషా ప్రయోగాన్ని నిలిపి ఉంచడం.
  alternative: ‘ఎవరినీ తొందరపడి నియమించవద్దు’ లేదా ‘దీక్ష ఇవ్వవద్దు’ అని అనువదించడం.
  rationale: సమీప సందర్భం సంఘ పెద్దలు మరియు వారి బాధ్యత గురించి ఉండటంతో, ఇది పరిచర్యకు నియామకం లేదా గుర్తింపునివ్వడాన్ని సూచించే అవకాశం బలంగా ఉంది. అయితే గ్రీకు పాఠ్యం ప్రత్యేకంగా ‘నియమించు’ అనే పదాన్ని ఉపయోగించదు. అందువల్ల ఏదైనా ఒక సంఘ సంప్రదాయ ప్రక్రియను పాఠ్యంలోకి దిగుమతి చేయకుండా అసలు ప్రయోగాన్ని ఉంచి, సందర్భార్థాన్ని పాదసూచికలో తెలిపాం.
- issue: రెండు నిషేధాల మధ్య సంబంధం
  choice: ఇతరుల పాపాల్లో భాగస్వామి కావద్దనే హెచ్చరికను విస్తృతంగానే ఉంచడం.
  alternative: తొందరపడి నియమించడం వల్ల ఇతరుల పాపాలకు ప్రత్యేకంగా బాధ్యుడవుతాడని స్పష్టీకరించడం, లేదా రెండవ హెచ్చరికను పూర్తిగా స్వతంత్రంగా చూడడం.
  rationale: రెండు వాక్యభాగాల సమీపస్థానం వాటి మధ్య సంబంధాన్ని సూచిస్తుంది; తొందరపడి చేతులు ఉంచడం ఇతరుల పాపాల్లో భాగస్వామ్యానికి దారితీయవచ్చు. అయినా ఆ సంబంధాన్ని గ్రీకు పాఠ్యం ప్రత్యక్షంగా వివరించదు కాబట్టి ప్రధాన అనువాదం దానిని బలవంతంగా నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘చేతులు ఉంచడం’ అనే బైబిలు సంబంధిత ప్రయోగాన్ని నిలిపి ఉంచుతూ, దాని సాధ్యమైన సందర్భార్థాన్ని పాదసూచికలో స్పష్టం చేశాం. ‘పవిత్రంగా’ అనే పదం విస్తృత నైతిక శుద్ధిని తెలియజేస్తుంది.
