  to: 'మంచి పనుల విషయంలో మంచి పేరు కలిగినదై ఉండాలి: ఆమె పిల్లలను పెంచి ఉంటే[a], అతిథులకు ఆతిథ్యమిచ్చి ఉంటే[b], పవిత్రుల[c] పాదాలను కడిగి ఉంటే, కష్టాల్లో ఉన్నవారికి సహాయం చేసి ఉంటే, ప్రతి మంచి పనిలో నిమగ్నమై ఉంటే[d].'
  rationale: The revision improves the opening passive-reputation expression, makes the foot-washing clause more natural Telugu, and removes an unsupported adverb from the final clause. It retains the source text’s repeated conditional structure, lexical scope, and theological terminology while preserving the non-biological ambiguity of ‘children.’
