id: 1TI.5.10
reference: 1 Timothy 5:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν ἔργοις καλοῖς μαρτυρουμένη, εἰ ἐτεκνοτρόφησεν, εἰ ἐξενοδόχησεν, εἰ ἁγίων πόδας ἔνιψεν, εἰ θλιβομένοις ἐπήρκεσεν, εἰ παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/010.yaml
  text: 'well attested for good works: if she has raised children[a], if she has shown hospitality, if she has washed the feet of the saints, if she has helped those under affliction[c][b], if she has followed every good work.'
translation:
  language: te
  text: 'మంచి పనుల విషయంలో మంచి పేరు కలిగినదై ఉండాలి: ఆమె పిల్లలను పెంచి ఉంటే[a], అతిథులకు ఆతిథ్యమిచ్చి ఉంటే[b], పవిత్రుల[c] పాదాలను కడిగి ఉంటే, కష్టాల్లో ఉన్నవారికి సహాయం చేసి ఉంటే, ప్రతి మంచి పనిలో నిమగ్నమై ఉంటే[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ పిల్లలు ఆమె సొంత పిల్లలే అని గ్రీకు పదం నిర్దేశించదు; పిల్లలను పోషించి పెంచడమే ప్రధాన భావం.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు క్రియ ప్రత్యేకంగా అతిథులను లేదా అపరిచితులను తన ఇంటికి స్వాగతించి ఆతిథ్యమివ్వడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘పవిత్రులు’ అంటే దేవునికి చెందిన పవిత్ర ప్రజలు, అంటే తోటి విశ్వాసులు.
    reason: lexical_alternative
  - marker: d
    text: లేదా, ‘ప్రతి మంచి పనిని వెంబడించి ఉంటే.’ గ్రీకు వ్యక్తీకరణ ప్రతి మంచి పనిని చురుకుగా చేపట్టడం లేదా అనుసరించడం అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἔργοις καλοῖς μαρτυρουμένη
  choice: మంచి పనులు చేసిందని మంచి సాక్ష్యం పొందినదై ఉండాలి
  rationale: ఈ పదబంధం ఆమె మంచి పనుల ఆధారంగా ఇతరుల సాక్ష్యం పొందిన వ్యక్తి అని తెలియజేస్తుంది. తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉండేందుకు నిష్క్రియ భావాన్ని నిలుపుతూ అనువదించబడింది; ‘ఉండాలి’ అనేది ముందరి వాక్యంలోని అర్హతల జాబితాతో ఉన్న వ్యాకరణ సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: εἰ
  choice: ఉంటే
  rationale: పునరావృతమయ్యే εἰ ఒక్కొక్క అర్హతను పరిచయం చేస్తుంది; ప్రతి ఉపవాక్యంలో ‘ఉంటే’ ఉంచడం మూలపాఠ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: ἐτεκνοτρόφησεν
  choice: పిల్లలను పెంచి ఉంటే
  rationale: ఈ క్రియ పిల్లలకు పోషణ ఇచ్చి వారిని పెంచడాన్ని సూచిస్తుంది; వారు తప్పనిసరిగా ఆమె సొంత పిల్లలే అని మూలపాఠం నిర్దేశించదు.
- source_word: ἐξενοδόχησεν
  choice: అపరిచితులకు ఆతిథ్యమిచ్చి ఉంటే
  rationale: కేవలం సాధారణ ఆతిథ్య గుణం అని కాకుండా, అతిథులను లేదా అపరిచితులను స్వీకరించడం అనే క్రియలోని నిర్దిష్ట భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἁγίων πόδας ἔνιψεν
  choice: పవిత్రుల పాదాలు కడిగి ఉంటే
  rationale: విశ్వాస సమాజానికి చెందిన దేవుని పవిత్ర ప్రజలను సూచించే కీలక పదాన్ని నిలుపుతూ, వినయపూర్వక సేవ అనే ప్రత్యక్ష కార్యాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: θλιβομένοις ἐπήρκεσεν
  choice: కష్టాల్లో ఉన్నవారికి సహాయం చేసి ఉంటే
  rationale: ఒత్తిడి, బాధ లేదా ఇబ్బందిని అనుభవిస్తున్నవారికి ఆచరణాత్మకంగా తోడ్పడటం అనే విస్తృత భావాన్ని ఇస్తుంది; దీనిని హింసకు మాత్రమే పరిమితం చేయదు.
- source_word: παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν
  choice: ప్రతి మంచి పనిని శ్రద్ధగా అనుసరించి ఉంటే
  rationale: ἐπηκολούθησεν లోని ‘వెంబడించడం/అనుసరించడం’ భావాన్ని నిలుపుతూ, ఇక్కడ ఉద్దేశించిన చురుకైన నిబద్ధతను ‘శ్రద్ధగా’ సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ἁγίων అనే పదానికి సూచితులు
  choice: పవిత్రులు
  alternative: తోటి విశ్వాసులు; దేవుని పవిత్ర ప్రజలు
  rationale: పౌలు వాడుకలో ఈ పదం సాధారణంగా దేవునికి ప్రత్యేకపరచబడిన విశ్వాస సమాజాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో కీలక పదాన్ని వ్యాఖ్యానాత్మకంగా సన్నగిల్లించకుండా ఉంచి, పాదసూచికలో అర్థాన్ని వివరిస్తుంది.
- issue: ἐτεκνοτρόφησενలో పిల్లలతో సంబంధం
  choice: పిల్లలను పెంచింది
  alternative: తన సొంత పిల్లలను పెంచింది
  rationale: మూల క్రియ పిల్లల పెంపకాన్ని చెబుతుంది గాని వారు జీవసంబంధమైన సొంత పిల్లలేనని నిర్దేశించదు; అందువల్ల ఆ అస్పష్టతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. వరుసగా వచ్చే అర్హతలను ‘ఉంటే’తో నిలిపి మూలపాఠ లయను కాపాడింది. ‘పవిత్రులు’ వంటి కీలక పౌలు పదజాలాన్ని ప్రధాన పాఠంలో ఉంచి పాదసూచికలో స్పష్టం చేసింది.
