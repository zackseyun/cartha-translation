id: 1TI.5.14
reference: 1 Timothy 5:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: βούλομαι οὖν νεωτέρας γαμεῖν, τεκνογονεῖν, οἰκοδεσποτεῖν, μηδεμίαν ἀφορμὴν διδόναι τῷ ἀντικειμένῳ λοιδορίας χάριν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/014.yaml
  text: Therefore I want younger widows to marry[a], to bear children, to manage their households[b], and to give the opponent no opportunity for slander.
translation:
  language: te
  text: కాబట్టి యువ విధవరాళ్లు పెళ్లి చేసుకోవాలని[a], పిల్లలను కనాలని, తమ ఇళ్లను నిర్వహించాలని, వ్యతిరేకికి దూషణకు ఏ అవకాశమూ ఇవ్వకూడదని నేను కోరుతున్నాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో కేవలం ‘పెళ్లి చేసుకోవాలని’ అని ఉంది; సందర్భం యువ విధవరాళ్ల గురించి కాబట్టి మళ్లీ పెళ్లి చేసుకోవడం సూచితమవుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘విరోధికి’; ఇది సాతానును సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: βούλομαι
  choice: నేను కోరుతున్నాను
  rationale: పౌలు వ్యక్తిగతంగా వ్యక్తం చేస్తున్న సంకల్పం లేదా అభిలాషను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి చర్చనుంచి వచ్చే నిర్ధారణను స్పష్టంగా సూచిస్తుంది.
- source_word: νεωτέρας
  choice: యౌవన విధవరాళ్లు
  rationale: పదానికి అక్షరార్థంగా ‘యౌవన స్త్రీలు’ అని ఉన్నా, తక్షణ సందర్భం విధవరాళ్ల గురించే కావడంతో తెలుగులో సూచిత నామవాచకాన్ని చేర్చాం.
- source_word: γαμεῖν
  choice: పెళ్లి చేసుకోవాలని
  rationale: గ్రీకు క్రియ కేవలం ‘పెళ్లి చేసుకోవడం’ అని చెబుతుంది; సందర్భంలో ఇది మళ్లీ పెళ్లి చేసుకోవడమే అయినా, మూలపాఠంలో లేని ‘మళ్లీ’ అనే భావాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: τεκνογονεῖν
  choice: పిల్లలను కనాలని
  rationale: పిల్లలకు జన్మనివ్వడమనే నిర్దిష్ట భావాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἰκοδεσποτεῖν
  choice: తమ ఇంటిని నిర్వహించాలని
  rationale: ఇంటి వ్యవహారాలపై బాధ్యతతో పర్యవేక్షణ చేయడాన్ని తెలియజేస్తుంది; అనవసరంగా కఠినమైన ఆధిపత్య భావాన్ని చేర్చదు.
- source_word: μηδεμίαν ἀφορμὴν διδόναι
  choice: ఏ అవకాశమూ ఇవ్వకూడదని
  rationale: వ్యతిరేక విమర్శకు ఎలాంటి ఆస్కారమూ కల్పించకూడదనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: τῷ ἀντικειμένῳ
  choice: వ్యతిరేకికి
  rationale: ‘ఎదిరించేవాడు’ అనే ఏకవచన భావాన్ని నిలుపుతూ, అతడు సాతానే అని ప్రధాన పాఠ్యంలో ముందుగానే నిర్ణయించదు.
- source_word: λοιδορίας χάριν
  choice: దూషించేందుకు
  rationale: నిందాపూర్వకంగా లేదా అవమానకరంగా మాట్లాడేందుకు అవకాశమనే భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
theological_decisions:
- issue: τῷ ἀντικειμένῳ అనే పదం ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో సాధారణంగా ‘వ్యతిరేకి’
  alternative: ‘విరోధి’ అంటే సాతాను
  rationale: గ్రీకు పదం స్వయంగా సాతానును స్పష్టంగా గుర్తించదు. సందర్భం బహిరంగ నిందకు ఆస్కారం ఇవ్వకపోవడం గురించి మాట్లాడుతుంది. అందువల్ల ప్రధాన పాఠ్యం అస్పష్టతను నిలుపుతుంది; సాతాను కావచ్చనే అవకాశాన్ని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగాను గౌరవప్రదమైనదిగాను అనువదించబడింది. సమన్వయ infinitive నిర్మాణాలను ‘-ాలని’ రూపాలతో నిలిపి, చివరలో ‘నేను కోరుతున్నాను’తో వాక్యాన్ని సహజంగా ముగించాం.
