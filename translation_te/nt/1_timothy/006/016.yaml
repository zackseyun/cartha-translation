id: 1TI.6.16
reference: 1 Timothy 6:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ μόνος ἔχων ἀθανασίαν, φῶς οἰκῶν ἀπρόσιτον, ὃν εἶδεν οὐδεὶς ἀνθρώπων οὐδὲ ἰδεῖν δύναται· ᾧ τιμὴ καὶ κράτος αἰώνιον· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/016.yaml
  text: who alone has immortality[a], dwelling in unapproachable light, whom no one among men has seen nor is able to see. To him be honor and eternal dominion[b]. Amen.
translation:
  language: te
  text: ఆయన మాత్రమే అమరత్వం కలిగినవాడు; సమీపించలేని వెలుగులో నివసించేవాడు; మనుష్యులలో ఎవరూ ఆయనను చూడలేదు, చూడలేరు కూడా.[a] ఆయనకే ఘనత, నిత్యమైన ఆధిపత్యం కలుగుగాక.[b] ఆమేన్.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏ మానవుడూ ఆయనను చూడలేదు; చూడలేడు కూడా.”
    reason: ‘మనుష్యులలో ఎవరూ’ అనే భాగార్థక నిర్మాణానికి సమగ్రార్థాన్ని మరింత ప్రత్యక్షంగా తెలిపే ప్రత్యామ్నాయ అనువాదం.
  - marker: b
    text: విస్తృత సందర్భంలో ఈ వర్ణననూ స్తోత్రాన్నీ కొందరు ప్రభువైన యేసు మెస్సీయను మరింత నేరుగా సూచించేవిగా అర్థం చేసుకుంటారు; అయితే అదృశ్యతను తెలిపే భాష అత్యంత సహజంగా దేవునిని సూచిస్తుంది.
    reason: సంబంధవాచక వాక్యాల సూచిత వ్యక్తి విషయంలో ఉన్న సందర్భసంబంధ ప్రత్యామ్నాయ పఠనాన్ని సంరక్షిస్తుంది.
lexical_decisions:
- source_word: μόνος
  choice: మాత్రమే
  rationale: దేవుడు మాత్రమే తనలో తాను అమరత్వం కలిగినవాడనే ప్రత్యేకతను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἔχων ἀθανασίαν
  choice: అమరత్వం కలిగినవాడు
  rationale: గ్రీకు కృదంత నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతూ, అమరత్వం ఆయనకు స్వాభావికంగా ఉందనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: φῶς οἰκῶν ἀπρόσιτον
  choice: సమీపించలేని వెలుగులో నివసించేవాడు
  rationale: ἀπρόσιτον అనే పదంలోని ‘చేరుకోలేని/సమీపించలేని’ భావాన్ని, οἰκῶν అనే నివాస భావాన్ని నేరుగా కాపాడుతుంది.
- source_word: οὐδεὶς ἀνθρώπων
  choice: మనుష్యులలో ఎవరూ
  rationale: భాగార్థక గ్రీకు నిర్మాణాన్ని లింగపరంగా సమగ్రంగా, సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐδὲ ἰδεῖν δύναται
  choice: చూడలేరు కూడా
  rationale: δύναται సూచించే అసమర్థతను కాపాడుతూ, తెలుగులో సంక్షిప్తంగా మరియు సహజంగా ఉంటుంది.
- source_word: τιμή
  choice: ఘనత
  rationale: స్తుతి సందర్భంలో దేవునికి చెందవలసిన గౌరవాన్ని తెలిపే సహజమైన తెలుగు పదం.
- source_word: κράτος αἰώνιον
  choice: నిత్యమైన ఆధిపత్యం
  rationale: κράτος పదంలోని పాలనా శక్తి, సార్వభౌమ అధికారం అనే స్తోత్రసంబంధ భావాన్ని ‘ఆధిపత్యం’ సముచితంగా తెలియజేస్తుంది.
- source_word: ἀμήν
  choice: ఆమేన్
  rationale: తెలుగు క్రైస్తవ వాడుకలో స్థిరపడిన లిప్యంతరీకరణను అనుసరిస్తుంది.
theological_decisions:
- issue: సంబంధవాచక వాక్యాలూ స్తోత్రవాక్యమూ ఎవరిని సూచిస్తున్నాయి
  choice: ముందటి సందర్భంలోని ధన్యుడైన ఏకైక సార్వభౌముడైన దేవుని వర్ణిస్తూ, ఆయనకే స్తోత్రం అర్పిస్తున్నట్లు ప్రధాన పాఠం ఉంచబడింది.
  alternative: విస్తృత వాక్యసందర్భంలోని సమీప సంబంధం కారణంగా కొందరు ఈ వర్ణనను ప్రభువైన యేసు మెస్సీయకు మరింత నేరుగా అన్వయిస్తారు.
  rationale: ఎవరూ చూడలేదు, చూడలేరు అనే అదృశ్యత భాష దేవునిని సూచించడం అత్యంత సహజం; అయితే విస్తృత సందర్భం కలిగించే క్రీస్తుసంబంధ అన్వయాన్ని పాదటిప్పణిలో ఉంచి మూలంలోని ఉద్రిక్తతను తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘సమీపించలేని వెలుగు,’ ‘నిత్యమైన ఆధిపత్యం’ వంటి పదబంధాలు మూలంలోని స్తోత్రాత్మక గంభీరతను కాపాడుతాయి.
