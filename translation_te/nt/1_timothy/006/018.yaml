translation:
  language: te
  text: మేలు చేయాలని, మంచి పనుల్లో ధనవంతులుగా ఉండాలని, ఉదారులుగా ఉండాలని, పంచుకోవడానికి సిద్ధంగా ఉండాలని వారికి ఆజ్ఞాపించు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοεργεῖν
  choice: మేలు చేయాలని
  rationale: క్రియారూప భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; కేవలం ‘మంచి పనులు చేయడం’ అనే నామవాచక ధోరణికి పరిమితం చేయదు.
- source_word: πλουτεῖν
  choice: ధనవంతులుగా ఉండాలని
  rationale: సందర్భంలోని భౌతిక సంపదతో ఉద్దేశపూర్వకంగా ఏర్పడిన వ్యత్యాసాన్ని నిలుపుతూ, మంచి పనుల విషయంలోని రూపకాలంకార సంపద భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐν ἔργοις καλοῖς
  choice: మంచి పనుల్లో
  rationale: ἐν సూచించే రంగం లేదా పరిధిని సహజంగా తెలియజేస్తుంది; పాస్టరల్ పత్రికల్లోని ἔργα καλάకు స్పష్టమైన సమానార్థకం.
- source_word: εὐμεταδότους
  choice: ఉదారంగా ఇచ్చేవారిగా
  rationale: తమ వనరులను ఇతరులకు ఇవ్వడానికి సిద్ధంగా ఉండే ఉదార స్వభావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: κοινωνικούς
  choice: పంచుకోవడానికి సిద్ధంగా
  rationale: ఇతరులతో పంచుకునే మనస్తత్వం అనే భావాన్ని నిలుపుతుంది; ఆధునిక వాడుకలో అపార్థానికి దారితీయగల ‘సామూహిక’ వంటి పదాన్ని నివారిస్తుంది.
- source_word: εὐμεταδότους εἶναι, κοινωνικούς
  choice: ఉదారంగా ఇచ్చేవారిగా, పంచుకోవడానికి సిద్ధంగా ఉండాలని
  rationale: మొదటి విశేషణంలోని ఉదారంగా ఇవ్వడం, రెండవదానిలోని పంచుకునే సంసిద్ధత—ఈ దగ్గరి అయినా వేర్వేరు భావాలను రెండింటినీ నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూప వాక్యం. ఇచ్చిన భాగం గ్రీకు వాక్యంలో ముందున్న ఆజ్ఞకు విషయపూరకమైన క్రియారూపాల శ్రేణి కాబట్టి, స్వతంత్ర వచనంగా చదవడానికి ‘వారికి ఆజ్ఞాపించు’ చేర్చబడింది; ఇది 6:17 నుంచి కొనసాగుతున్న వాక్యనిర్మాణాన్ని స్పష్టం చేస్తుంది.
