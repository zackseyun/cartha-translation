source:
  edition: SBLGNT
  text: ἣν καιροῖς ἰδίοις δείξει ὁ μακάριος καὶ μόνος δυνάστης, ὁ βασιλεὺς τῶν βασιλευόντων καὶ κύριος τῶν κυριευόντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/015.yaml
  text: which he will display in his own times—the blessed and only Sovereign[a], the King of those who reign and Lord of those who rule[b],
translation:
  language: te
  text: దానిని ఆయన తన సమయాల్లో[a] ప్రత్యక్షపరుస్తాడు—ధన్యుడైన ఏకైక అధిపతి, పాలించేవారికి రాజు, అధికారం చెలాయించేవారికి ప్రభువు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తనవైన సమయాల్లో.” ఈ పదబంధం ఆయన నిర్ణయించిన తగిన సమయాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'సంప్రదాయ అనువాదం: “రాజులకు రాజు, ప్రభువులకు ప్రభువు.” గ్రీకులో నామవాచకాలకు బదులు కృదంతాలు ఉన్నాయి; అక్షరార్థంగా, “పాలించేవారికి రాజు, అధికారం చెలాయించేవారికి ప్రభువు.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: దానిని
  rationale: స్త్రీలింగ ఏకవచన సంబంధ సర్వనామం ముందటి వచనంలోని ἐπιφάνειαν (‘ప్రత్యక్షత’)ను సూచిస్తుంది. తెలుగు వాక్యంలో ఆ ప్రత్యక్షతను సహజంగా వెనుకకు సూచించేందుకు ‘దానిని’ వాడబడింది.
- source_word: καιροῖς ἰδίοις
  choice: తన సమయాల్లో
  rationale: καιρός నిర్ణీత సమయం లేదా సందర్భాన్ని సూచిస్తుంది; ἴδιος ‘తనకు చెందిన’ అనే భావం ఇస్తుంది. గ్రీకులోని బహువచనాన్ని నిలుపుతూ, సమయాలను ఎవరు నిర్ణయించారనే భావాన్ని ప్రధాన పాఠ్యంలో అదనంగా స్పష్టీకరించలేదు.
- source_word: δείξει
  choice: ప్రత్యక్షపరుస్తాడు
  rationale: δείκνυμι ఇక్కడ ముందటి వచనంలోని ప్రత్యక్షతను బహిరంగంగా కనబడేలా చేయడాన్ని సూచిస్తుంది. ‘ప్రత్యక్షపరుస్తాడు’ ఆ భావాన్ని ఆధునిక, గంభీరమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ μακάριος
  choice: ఆ ధన్యుడైన
  rationale: μακάριος ఇక్కడ దేవునికి వర్తించే బిరుదుగా ఉంది. ‘ధన్యుడైన’ దాని గంభీరమైన, స్థిరమైన అర్థాన్ని నిలుపుతుంది.
- source_word: μόνος δυνάστης
  choice: ఏకైక సర్వాధికారి
  rationale: δυνάστης పాలనా శక్తి, ఆధిపత్యం కలవాడిని సూచిస్తుంది. ‘సర్వాధికారి’ అత్యున్నత అధికారాన్ని స్పష్టంగా తెలియజేస్తుంది; μόνος భావాన్ని ‘ఏకైక’ నిలుపుతుంది.
- source_word: βασιλεὺς τῶν βασιλευόντων
  choice: పాలించేవారికి రాజు
  rationale: βασιλευόντων నామవాచకం కాక క్రియాత్మక కృదంతం—‘పాలించేవారు’. అందువల్ల సంప్రదాయ ‘రాజులకు రాజు’ కంటే గ్రీకు నిర్మాణాన్ని పారదర్శకంగా ప్రతిబింబిస్తుంది.
- source_word: κύριος τῶν κυριευόντων
  choice: అధికారం చెలాయించేవారికి ప్రభువు
  rationale: κυριευόντων ‘ఏలడం, అధికారం చెలాయించడం’ అనే క్రియాత్మక భావాన్ని కలిగి ఉంది. ‘ప్రభువు’ κύριος అనే అధికార బిరుదును, మిగిలిన పదబంధం కృదంత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ప్రత్యక్షతను ప్రత్యక్షపరచే వ్యక్తి ఎవరు?
  choice: గ్రీకు మాదిరిగా కర్తను ‘ఆయన’ అని మాత్రమే పేర్కొని, తరువాతి బిరుదుల ద్వారానే వర్ణించబడేలా ఉంచడం.
  alternative: సందర్భం ఆధారంగా ‘తండ్రియైన దేవుడు’ అని స్పష్టంగా పేర్కొనడం.
  rationale: ఈ వచనం కర్తకు ప్రత్యేక నామాన్ని ఇవ్వకుండా ఉన్నతమైన బిరుదులతో వర్ణిస్తుంది. అనువాదం ఆ నిర్మాణాన్ని నిలుపుతూ, సందర్భం నుంచి వచ్చే త్రిత్వ సంబంధ నిర్ధారణను ప్రధాన పాఠ్యంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. వాక్యం ముందటి వచనంలోని ‘ప్రత్యక్షత’పై ఆధారపడే భాగమని ‘దానిని’ ద్వారా నిలుపబడింది. సంప్రదాయ రాజబిరుదుల ప్రతిధ్వనిని గౌరవిస్తూ, గ్రీకు కృదంతాల క్రియాత్మక స్వరూపాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా చూపించాం.
