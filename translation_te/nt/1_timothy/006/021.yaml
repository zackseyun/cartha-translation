id: 1TI.6.21
reference: 1 Timothy 6:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἥν τινες ἐπαγγελλόμενοι περὶ τὴν πίστιν ἠστόχησαν. Ἡ χάρις ⸂μεθ’ ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/021.yaml
  text: By professing it[a], some have missed the mark concerning the faith[c][b]. Grace be with you.
translation:
  language: te
  text: దానిని తమదిగా చెప్పుకున్న కొందరు[a] విశ్వాసం విషయంలో గురి తప్పిపోయారు.[b] కృప మీ అందరితో ఉండుగాక.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దానిని తమదిగా చెప్పుకున్న’ అనే గ్రీకు మాటను ‘దానిని ప్రకటించుకుంటూ’ లేదా ‘దానిపై హక్కు చెప్పుకుంటూ’ అని కూడా అనువదించవచ్చు. సంబంధ సర్వనామం ముందటి వచనంలోని ‘జ్ఞానం’ను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘విశ్వాసం’ అనేది క్రైస్తవ విశ్వాస బోధను సూచించే అవకాశం ఎక్కువ; అయితే వ్యక్తిగత నమ్మకం అనే భావం కూడా సాధ్యమే.
    reason: alternative_reading
  - marker: c
    text: ‘మీ’ అనే గ్రీకు సర్వనామం బహువచనంలో ఉంది.
    reason: grammatical_detail
lexical_decisions:
- source_word: ἥν
  choice: దానిని
  rationale: స్త్రీలింగ ఏకవచన సంబంధ సర్వనామం ముందటి వచనంలోని ‘జ్ఞానం’ను సూచిస్తుంది. తెలుగులో ఆ సంబంధాన్ని సహజంగా, స్పష్టంగా చూపడానికి ‘దానిని’ అని అనువదించబడింది.
- source_word: ἐπαγγελλόμενοι
  choice: తమదిగా చెప్పుకున్న
  rationale: ఈ మధ్యమ ప్రయోగంలో ‘వాగ్దానం చేయడం’ కంటే దేనినైనా తమకు ఉందని చెప్పుకోవడం లేదా దానిపై హక్కు ప్రకటించుకోవడం అనే భావం సందర్భానికి సరిపోతుంది.
- source_word: περὶ τὴν πίστιν
  choice: విశ్వాసం విషయంలో
  rationale: περί తో కూడిన కర్మ విభక్తి ఇక్కడ సంబంధాన్ని లేదా విషయాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘విషయంలో’ సహజమైన ప్రయోగం.
- source_word: πίστιν
  choice: విశ్వాసం
  rationale: సమీప సందర్భంలో అబద్ధ బోధ వల్ల కలిగిన దారి తప్పుదల ప్రస్తావన ఉన్నందున, ఇది క్రైస్తవ విశ్వాసాన్ని సూచించే అవకాశం ఎక్కువ; అయినా వ్యక్తిగత నమ్మకం అనే భావాన్ని పూర్తిగా మూసివేయకుండా సాధారణ పదమే ఉంచబడింది.
- source_word: ἠστόχησαν
  choice: గురి తప్పిపోయారు
  rationale: ἀστοχέω లోని లక్ష్యాన్ని తప్పడం అనే రూపకాన్ని నిలుపుతూ, తెలుగులో సహజంగా వినిపించే మాటను ఎంచుకున్నాం.
- source_word: Ἡ χάρις
  choice: కృప
  rationale: పత్రిక ముగింపులోని ఆశీర్వాద సూత్రానికి అనుగుణంగా, గ్రీకు నిర్దేశక పదాన్ని తెలుగులో ప్రత్యేకంగా వ్యక్తం చేయకుండా ‘కృప’ అని అనువదించాం.
- source_word: μεθ’ ὑμῶν
  choice: మీ అందరితో ఉండుగాక
  rationale: గ్రీకు ὑμῶν బహువచనం. ‘అందరితో’ అని చేర్చడం ద్వారా తెలుగు పాఠకుడికి ఆ బహువచనం స్పష్టమవుతుంది; ఆశీర్వాద వాక్యానికి అవసరమైన క్రియను సహజంగా సరఫరా చేశాం.
theological_decisions:
- issue: ‘విశ్వాసం’ అనే పదం యొక్క భావం
  choice: క్రైస్తవ విశ్వాసం అనే బోధాత్మక/సామూహిక భావానికి ప్రాధాన్యం
  alternative: వ్యక్తిగతంగా దేవునిపై ఉంచే నమ్మకం
  rationale: ‘జ్ఞానమని తప్పుగా పిలువబడుతున్నది’ అనే ముందటి సందర్భం తప్పుడు బోధను సూచిస్తుంది. అందువల్ల ఇక్కడ క్రైస్తవ విశ్వాసం అనే భావం బలంగా ఉంది; అయితే గ్రీకు పదంలోని విస్తృత భావాన్ని అనువాదంలో అనవసరంగా కుదించలేదు.
- issue: ముగింపు ఆశీర్వాదం ఎవరిని ఉద్దేశించింది
  choice: బహువచనాన్ని స్పష్టంగా నిలుపుట
  alternative: తిమోతికి మాత్రమే అన్నట్లుగా ఏకవచనీకరించడం
  rationale: గ్రీకు పాఠంలో ὑμῶν బహువచనం ఉంది. కాబట్టి ఈ ఆశీర్వాదం తిమోతితో పాటు విస్తృత విశ్వాస సమాజానికీ వర్తించవచ్చనే పాఠ్య సూచనను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన పత్రికా-ఆశీర్వాద శైలి వాడబడింది. ‘గురి తప్పిపోయారు’ అనే రూపకం మూలపాఠంలోని చిత్రాన్ని నిలుపుతుంది; ‘మీ అందరితో’ అనేది గ్రీకు బహువచనాన్ని స్పష్టపరుస్తుంది.
