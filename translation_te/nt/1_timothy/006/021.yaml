  source_fidelity: ‘దానిని’ ముందటి వచనంలోని స్త్రీలింగ ‘జ్ఞానం’ను సహజంగా తిరిగి సూచిస్తుంది. ‘తమదిగా చెప్పుకున్న’ ἐπαγγελλόμενοι యొక్క ఇక్కడి ‘తమకు ఉందని/తమది అని ప్రకటించుకోవడం’ అనే సందర్భోచిత భావాన్ని అందిస్తుంది. ‘విశ్వాసం విషయంలో గురి తప్పిపోయారు’ περὶ τὴν πίστιν ἠστόχησαν ను, ముఖ్యంగా ‘లక్ష్యాన్ని తప్పడం’ అనే రూపకాన్ని, నమ్మకంగా ప్రతిబింబిస్తుంది. ముగింపులో ‘మీ అందరితో’ గ్రీకు బహువచనమైన ὑμῶν ను స్పష్టంగా నిలుపుతుంది.
