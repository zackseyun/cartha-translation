  terminology: ‘విశ్వాసం’ πίστις యొక్క విస్తృతార్థాన్ని ప్రధాన పాఠంలో కాపాడుతూ, పాదటిప్పణిలో క్రైస్తవ విశ్వాసబోధ అనే సంభావ్య నిర్దిష్ట భావాన్ని సముచితంగా తెలియజేస్తుంది. ‘కృప’ χάρις కు స్థిరమైన, తగిన తెలుగు పదం. పాదటిప్పణి గుర్తులు అన్నీ పాఠంలోని తగిన స్థానాల్లో ఉన్నాయి.
