id: 1TI.6.1
reference: 1 Timothy 6:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὅσοι εἰσὶν ὑπὸ ζυγὸν δοῦλοι, τοὺς ἰδίους δεσπότας πάσης τιμῆς ἀξίους ἡγείσθωσαν, ἵνα μὴ τὸ ὄνομα τοῦ θεοῦ καὶ ἡ διδασκαλία βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/001.yaml
  text: All who are servants under a yoke should regard their own masters as worthy of all honor[c][b][a], so that the name of God and the teaching may not be slandered.
translation:
  language: te
  text: కాడి కింద ఉన్న బానిసలందరూ[a] తమ సొంత యజమానులను అన్ని విధాల గౌరవానికి అర్హులుగా భావించాలి, దేవుని నామమూ బోధయూ దూషణకు గురికాకుండా ఉండేందుకు[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా ‘దాసులు’ లేదా ‘బంధిత సేవకులు’; గ్రీకు: δοῦλοι. ‘కాడి కింద’ అనే మాట బంధిత స్థితిని స్పష్టం చేస్తున్నందున ప్రధాన పాఠంలో ‘బానిసలు’ అని ఉంది.'
    reason: alternative_reading
  - marker: b
    text: లేదా ‘సిద్ధాంతం.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘నిందించబడకుండా’ లేదా ‘అవమానించబడకుండా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: బానిసలు
  rationale: ‘కాడి కింద’ అనే బంధిత స్థితిని స్పష్టంచేసే సందర్భంలో, సాధారణ సేవకత్వం కంటే స్వేచ్ఛలేని సామాజిక స్థితిని ‘బానిసలు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὑπὸ ζυγὸν
  choice: కాడి కింద
  rationale: అధీనత, బంధనం అనే గ్రీకు రూపకాన్ని సహజమైన తెలుగులో యథాతథంగా నిలుపుతుంది.
- source_word: τοὺς ἰδίους δεσπότας
  choice: తమ సొంత యజమానులను
  rationale: ἰδίους లోని ప్రత్యేక సంబంధాన్ని ‘తమ సొంత’ తెలియజేస్తుంది; δεσπότας ఇక్కడ బానిసలపై గృహాధికారం కలిగిన యజమానులను సూచిస్తుంది.
- source_word: πάσης τιμῆς ἀξίους
  choice: సంపూర్ణ గౌరవానికి అర్హులుగా
  rationale: గౌరవం విషయంలో సమగ్రతను తెలిపే πάσης భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἡγείσθωσαν
  choice: భావించాలి
  rationale: కొనసాగవలసిన అంచనా లేదా వైఖరిని సూచించే వర్తమాన ఆజ్ఞార్థక భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: దేవుని నామం
  rationale: దేవుని వెల్లడైన గుర్తింపునూ ఖ్యాతినీ సూచించే బైబిలు భావాన్ని నిలుపుతుంది.
- source_word: ἡ διδασκαλία
  choice: బోధ
  rationale: సాంకేతిక మతపరమైన పదజాలం అవసరం లేకుండా διδασκαλία యొక్క అర్థాన్ని సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: βλασφημῆται
  choice: దూషించబడకుండా
  rationale: దేవుని నామం, బోధ—రెండింటి గురించి అవమానకరంగా మాట్లాడటాన్ని సరిపోయే ఒకే సహజ పదబంధంతో తెలియజేస్తుంది.
- source_word: Ὅσοι εἰσὶν
  choice: అందరూ
  rationale: ὅσοι యొక్క సమగ్ర, సమూహార్థాన్ని తెలుగు వాక్య నిర్మాణంలో సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: సామాజికంగా, నైతికంగా సున్నితమైన సందర్భంలో δοῦλοι అనువాదం
  choice: బానిసలు
  alternative: దాసులు లేదా సేవకులు
  rationale: ఈ అనువాదం బానిసత్వాన్ని సమర్థించదు; వాక్యం ముందుగా ఊహిస్తున్న చారిత్రక బంధిత స్థితిని మాత్రమే స్పష్టంగా ప్రతిబింబిస్తుంది. ‘కాడి కింద’ అనే సమీప పదబంధం ఈ ఎంపికకు బలమైన ఆధారం.
- issue: διδασκαλία అనువాదం
  choice: బోధ
  alternative: సిద్ధాంతం
  rationale: ఇక్కడ క్రైస్తవ సందేశం లేదా ఉపదేశం ప్రజల దృష్టిలో దూషణకు గురికాకూడదనే భావం ఉంది. ‘బోధ’ గ్రీకు పదార్థాన్ని నిలుపుతూ, తరువాతి కాలపు సాంకేతిక సిద్ధాంతార్థాన్ని అనవసరంగా చేర్చదు.
- issue: βλασφημῆται యొక్క పరిధి
  choice: దూషించబడకుండా
  alternative: దైవదూషణకు గురికాకుండా
  rationale: క్రియకు ‘దేవుని నామం’తో పాటు ‘బోధ’ కూడా కర్తగా ఉంది. ‘దూషించబడకుండా’ అనే పదం రెండింటికీ సహజంగా వర్తిస్తూ గ్రీకు వాక్యంలోని సంయుక్త నిర్మాణాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘కాడి కింద’ అనే మూల రూపకం నిలుపబడింది; వాక్య ప్రవాహం సహజంగా ఉండేందుకు ఉద్దేశ్య ఉపవాక్యం ప్రధాన ఆజ్ఞకు ముందు ఉంచబడింది.
