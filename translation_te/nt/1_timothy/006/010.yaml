revisions:
- from: ఎందుకంటే, ధనాపేక్ష అన్ని రకాల కీడులకు ఒక మూలం.[a] దానిని ఆశించిన కొందరు విశ్వాసం నుండి దారితప్పి, అనేక వేదనలతో తమను తామే పొడుచుకున్నారు.[b]
