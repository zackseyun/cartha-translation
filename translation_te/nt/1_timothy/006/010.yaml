id: 1TI.6.10
reference: 1 Timothy 6:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ῥίζα γὰρ πάντων τῶν κακῶν ἐστιν ἡ φιλαργυρία, ἧς τινες ὀρεγόμενοι ἀπεπλανήθησαν ἀπὸ τῆς πίστεως καὶ ἑαυτοὺς περιέπειραν ὀδύναις πολλαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/010.yaml
  text: For the love of money is a root of all kinds of evils[a]; by craving it[c][b], some have wandered away from the faith and pierced themselves with many pains.
translation:
  language: te
  text: ఎందుకంటే ధనంపై ప్రేమ అన్ని రకాల కీడులకు ఒక మూలం.[a] దానికోసం ఆశపడుతూ, కొందరు విశ్వాసం నుండి దారితప్పి, అనేక వేదనలతో తమను తామే పొడుచుకున్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సాంప్రదాయంగా, “ధనంపై ప్రేమ సమస్త కీడుకూ మూలం” అని కూడా అనువదిస్తారు. అయితే గ్రీకు వాక్యం “అన్ని రకాల కీడులకు ఒక మూలం” అనే భావాన్ని మరింత సహజంగా అనుమతిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: “అనేక దుఃఖాలతో” లేదా “అనేక బాధలతో తమను తామే పొడుచుకున్నారు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζα
  choice: ఒక మూలం
  rationale: క్రియకు ముందు నిర్దిష్ట ఉపపదం లేకుండా వచ్చిన ῥίζαను ఇక్కడ ‘ఒక మూలం’గా అనువదించడం సహజం; ధనాపేక్ష మాత్రమే ప్రతి కీడుకూ ఏకైక మూలమని అనవసరంగా సూచించదు.
- source_word: πάντων τῶν κακῶν
  choice: అన్ని రకాల కీడులకు
  rationale: బహువచన రూపం అనేక విధాలైన చెడులను సూచిస్తుంది. ‘అన్ని రకాల కీడులు’ అనే మాట సందర్భంలోని విస్తృత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: φιλαργυρία
  choice: ధనాపేక్ష
  rationale: ఈ పదం డబ్బుపట్ల ప్రేమ లేదా అత్యాశను సూచిస్తుంది. ‘ధనాపేక్ష’ ఆధునిక తెలుగులో సంక్షిప్తంగా, గౌరవప్రదంగా, స్పష్టంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ὀρεγόμενοι
  choice: దానిని ఆశించిన
  rationale: ఈ వర్తమాన కృదంతం బలంగా కోరుకోవడం లేదా దానివైపు సాగడాన్ని సూచిస్తుంది; ‘ఆశించిన’ సహజంగా ఉండి కారణసంబంధాన్ని నిలుపుతుంది.
- source_word: ἀπεπλανήθησαν ἀπὸ τῆς πίστεως
  choice: విశ్వాసం నుండి దారితప్పి
  rationale: మూలంలోని దూరంగా తప్పిపోవడమనే చలనచిత్రాన్ని ‘దారితప్పి’ నిలుపుతుంది. సందర్భంలో విశ్వాసం క్రైస్తవ విశ్వాసాన్ని సూచించగలిగినా, తెలుగు పదబంధం వ్యక్తిగత విశ్వాసం అనే సాధ్యమైన భావాన్ని పూర్తిగా మూసివేయదు.
- source_word: περιέπειραν
  choice: తమను తామే పొడుచుకున్నారు
  rationale: క్రియలోని పొడిచి చీల్చుకొనే సజీవ రూపకాన్ని యథాశక్తి ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: ὀδύναις πολλαῖς
  choice: అనేక వేదనలతో
  rationale: ὀδύνη తీవ్రమైన బాధ, దుఃఖం, మనోవేదనలను విస్తృతంగా సూచిస్తుంది; ‘వేదనలు’ ఆ పరిధిని తెలుగులో సహజంగా కాపాడుతుంది.
theological_decisions:
- issue: ధనాపేక్షకూ కీడులకూ మధ్య వాక్యం తెలిపే సంబంధ పరిధి
  choice: ధనాపేక్ష అన్ని రకాల కీడులకు ఒక మూలం
  alternative: ధనాపేక్ష సమస్త కీడుకూ మూలం
  rationale: ῥίζαకు నిర్దిష్ట ఉపపదం లేకపోవడం, κακῶν బహువచనంగా ఉండడం వల్ల ఇది ప్రతి కీడుకూ ఏకైక కారణమనే సంపూర్ణ వాదనకన్నా, అనేక రకాల కీడులకు ఒక మూలమనే భావాన్ని సహజంగా అనుమతిస్తుంది.
- issue: τῆς πίστεως యొక్క భావం
  choice: విశ్వాసం నుండి
  alternative: క్రైస్తవ విశ్వాసం నుండి / విశ్వాస మార్గం నుండి
  rationale: పాస్టరల్ పత్రికల సందర్భంలో ఇది క్రైస్తవ విశ్వాస సముదాయాన్ని సూచించే అవకాశం బలంగా ఉంది. అయితే మూలపదంలోని వ్యక్తిగత విశ్వాసం అనే సాధ్యమైన ప్రతిధ్వనిని తొలగించకుండా ‘విశ్వాసం నుండి’ అని ఉంచాం.
- issue: περιέπειραν రూపక స్వరూపం
  choice: తమను తామే పొడుచుకున్నారు
  alternative: తమకు తామే అనేక దుఃఖాలు కలిగించుకున్నారు
  rationale: మూలంలోని తీవ్రమైన స్వయంకృత గాయ రూపకాన్ని వివరణాత్మకంగా సడలించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన, సహజమైన శైలి. ‘పొడుచుకున్నారు’ అనే పదంతో మూలంలోని సజీవ రూపకాన్ని నిలిపి, ‘వేదనలు’ ద్వారా శారీరక-మానసిక బాధల విస్తృతిని కాపాడాం.
