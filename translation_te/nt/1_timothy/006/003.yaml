id: 1TI.6.3
reference: 1 Timothy 6:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἴ τις ἑτεροδιδασκαλεῖ καὶ μὴ προσέρχεται ὑγιαίνουσι λόγοις, τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, καὶ τῇ κατ’ εὐσέβειαν διδασκαλίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/003.yaml
  text: If anyone teaches a different doctrine and does not agree with sound words[a], those of our Lord Jesus the Messiah, and with the teaching that accords with godliness[b],
translation:
  language: te
  text: ఎవరైనా భిన్నమైన బోధను బోధిస్తూ, మన ప్రభువైన యేసు మెస్సీయకు[b] చెందిన ఆరోగ్యకరమైన మాటలను[a], దైవభక్తికి అనుగుణమైన బోధను అంగీకరించకపోతే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆరోగ్యకరమైన మాటలు’ అంటే ఆధ్యాత్మికంగా, బోధాపరంగా హితకరమైన మాటలు.
    reason: lexical_alternative
  - marker: b
    text: ‘మెస్సీయ’కు సంప్రదాయ రూపం ‘క్రీస్తు’.
    reason: alternative_reading
lexical_decisions:
- source_word: ἑτεροδιδασκαλεῖ
  choice: భిన్నమైన బోధను బోధిస్తూ
  rationale: అంగీకరించబడిన అపొస్తలిక బోధకు భిన్నమైనదాన్ని బోధించడం అనే భావాన్ని తెలియజేస్తుంది; మూలంలో ప్రత్యక్షంగా లేని ‘అబద్ధ’ అనే తీర్పును చేర్చదు.
- source_word: προσέρχεται
  choice: అంగీకరించకపోతే
  rationale: దత్తి విభక్తిలోని బోధలకు చేరడం, వాటిని స్వీకరించడం లేదా వాటికి కట్టుబడడం అనే సందర్భోచిత భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὑγιαίνουσι λόγοις
  choice: స్వస్థమైన మాటలను
  rationale: ὑγιαίνωలోని ఆరోగ్య/స్వస్థత రూపకాన్ని నిలుపుతూ, λόγοιςను విస్తృతమైన ‘బోధ’గా మార్చకుండా ‘మాటలు’గానే అనువదిస్తుంది.
- source_word: τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: మన ప్రభువైన యేసు మెస్సీయకు చెందిన
  rationale: ఆ స్వస్థమైన మాటలు యేసు నుండి వచ్చినవి లేదా ఆయనకు చెందినవి అనే సంబంధాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός పూర్తి బిరుదులో ఉండి అభిషిక్తుడనే బిరుదు భావాన్ని కలిగి ఉన్నందున అర్థానువాదం చేయబడింది.
- source_word: κατ’ εὐσέβειαν
  choice: దైవభక్తికి అనుగుణమైన
  rationale: బోధ దైవభక్తితో సరిపోతుందనే అనురూపత భావాన్ని నిలుపుతుంది; అది తప్పనిసరిగా దైవభక్తిని కలిగిస్తుంది అనే కారణార్థాన్ని జోడించదు.
- source_word: διδασκαλίᾳ
  choice: బోధను
  rationale: బోధించే కార్యం లేదా బోధించబడే విషయసారం అనే మూలపదపు పరిధిని సహజంగా నిలుపుతుంది.
- source_word: εὐσέβειαν
  choice: దైవభక్తి
  rationale: దేవునిపట్ల భక్తి, గౌరవం, వాటికి తగిన జీవన ప్రవర్తనను సూచించే పాస్టరల్ పత్రికల భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦలో Χριστοῦ అనువాదం
  choice: యేసు మెస్సీయ
  alternative: యేసు క్రీస్తు
  rationale: ఈ పూర్తి బిరుదులో ‘అభిషిక్తుడు/మెస్సీయ’ అనే భావం సజీవంగా ఉంది. సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదసూచికలో ఉంచడం ద్వారా రెండు పఠన సంప్రదాయాలనూ గుర్తిస్తుంది.
- issue: κατ’ εὐσέβειαν సంబంధం
  choice: దైవభక్తికి అనుగుణమైన
  alternative: దైవభక్తికి నడిపించే
  rationale: κατά ప్రధానంగా అనురూపతను సూచిస్తుంది; ఫలితంగా దైవభక్తి కలుగుతుందని మాత్రమే నిర్ధారించే కారణార్థాన్ని మూలం స్పష్టంగా చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. వాక్యం తరువాతి వచనంలో పూర్తయ్యే షరతు వాక్యభాగం కావడంతో చివర కామా నిలుపబడింది. ‘స్వస్థమైన మాటలు’ ద్వారా మూలంలోని ఆరోగ్య రూపకం, ‘దైవభక్తికి అనుగుణమైన’ ద్వారా ఉద్దేశపూర్వక కారణార్థం చేర్చకుండా సంబంధ భావం నిలుపబడ్డాయి.
