id: 1TI.6.12
reference: 1 Timothy 6:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀγωνίζου τὸν καλὸν ἀγῶνα τῆς πίστεως, ἐπιλαβοῦ τῆς αἰωνίου ζωῆς, εἰς ἣν ἐκλήθης καὶ ὡμολόγησας τὴν καλὴν ὁμολογίαν ἐνώπιον πολλῶν μαρτύρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/012.yaml
  text: Fight the good fight of the faith[b][a]; take hold of the eternal life to which you were called and about which you made the good confession before many witnesses.
translation:
  language: te
  text: విశ్వాసం యొక్క మంచి పోరాటాన్ని పోరాడు[a]. నీవు దేనికి పిలువబడ్డావో ఆ శాశ్వత జీవాన్ని గట్టిగా పట్టుకో. అనేకమంది సాక్షుల ఎదుట నీవు మంచి ఒప్పుకోలు చేశావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “విశ్వాసంతో మంచి పోరాటం పోరాడు”; లేదా “క్రైస్తవ విశ్వాసం కోసం మంచి పోరాటం పోరాడు.” గ్రీకు పదబంధం విశ్వాసంతో లక్షణీకరించబడిన పోరాటాన్నీ, క్రైస్తవ విశ్వాసం కోసం జరిగే పోరాటాన్నీ సూచించగలదు.
    reason: alternative_reading
  - marker: b
    text: లేదా “నీవు దేనికి పిలువబడ్డావో దాని గురించి అనేకమంది సాక్షుల ఎదుట మంచి ఒప్పుకోలు చేశావు.” ఒప్పుకోలు యొక్క విషయాన్ని గ్రీకు పాఠం ప్రత్యక్షంగా చెప్పకపోయినా, అది శాశ్వత జీవానికి వచ్చిన పిలుపుతో సన్నిహితంగా అనుసంధానమై ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγωνίζου τὸν καλὸν ἀγῶνα
  choice: మంచి పోరాటాన్ని పోరాడు
  rationale: మూలంలోని ఒకే ధాతువుతో ఏర్పడిన క్రియ–నామవాచక పదప్రయోగాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, కొనసాగుతున్న క్రియాశీల పోరాటాన్ని తెలిపే సహజమైన తెలుగు రూపం.
- source_word: τῆς πίστεως
  choice: విశ్వాసపు
  rationale: ఈ షష్ఠీ విభక్తి సంబంధం వ్యక్తిగత విశ్వాసంతో చేసే పోరాటాన్నీ, క్రైస్తవ విశ్వాసం కోసం చేసే పోరాటాన్నీ సూచించగలదు. సంక్షిప్తమైన ‘విశ్వాసపు’ అనే రూపం ఆ భావసందిగ్ధతను ప్రధాన వాక్యంలో నిలుపుతుంది.
- source_word: ἐπιλαβοῦ
  choice: గట్టిగా పట్టుకో
  rationale: ఇది నిర్ణయాత్మకంగా పట్టుకోవడం లేదా స్వాధీనపరచుకోవడం అనే రూపకాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τῆς αἰωνίου ζωῆς
  choice: ఆ శాశ్వత జీవాన్ని
  rationale: నిర్దిష్టంగా సూచించబడుతున్న వాగ్దాన జీవాన్ని ‘ఆ’ ద్వారా తెలియజేస్తూ, αἰώνιος యొక్క కాలవ్యాప్త భావాన్ని ‘శాశ్వత’గా అందిస్తుంది.
- source_word: εἰς ἣν ἐκλήθης
  choice: నీవు దేనికి పిలువబడ్డావో
  rationale: εἰς సూచించే లక్ష్యం లేదా గమ్యాన్ని ‘దేనికి’ ద్వారా దగ్గరగా వ్యక్తం చేస్తుంది; పిలుపు యొక్క కార్యవిధానాన్ని అదనంగా నిర్వచించదు.
- source_word: τὴν καλὴν ὁμολογίαν
  choice: మంచి ఒప్పుకోలు
  rationale: ὁμολογία యొక్క బహిరంగ అంగీకారం లేదా ప్రకటన భావాన్ని సాధారణ పాఠకులకు స్పష్టమైన ‘ఒప్పుకోలు’ ద్వారా అందిస్తూ, καλόςను ముందున్న పదబంధానికి సమాంతరంగా ‘మంచి’గా ఉంచుతుంది.
- source_word: ἐνώπιον πολλῶν μαρτύρων
  choice: అనేకమంది సాక్షుల ఎదుట
  rationale: బహిరంగ సమక్షాన్ని సంక్షిప్తంగా, సహజంగా తెలుపుతుంది; μάρτυρεςను తరువాతి కాలపు ‘హతసాక్షులు’ అనే ప్రత్యేక అర్థంలోకి మార్చదు.
- source_word: καί
  choice: కూడా
  rationale: పిలుపు మరియు బహిరంగ ఒప్పుకోలు మధ్య సమన్వయ సంబంధాన్ని చూపుతుంది; ఒప్పుకోలు యొక్క విషయాన్ని మూలంలో ఉన్నదానికంటే స్పష్టంగా నిర్ధారించదు.
theological_decisions:
- issue: τῆς πίστεως యొక్క భావం
  choice: ‘విశ్వాసపు’ అని భావసందిగ్ధతను నిలిపివేయడం
  alternative: ‘విశ్వాసంతో’ లేదా ‘క్రైస్తవ విశ్వాసం కోసం’
  rationale: గ్రీకు పదబంధం విశ్వాసంతో లక్షణీకరించబడిన పోరాటాన్నీ, క్రైస్తవ విశ్వాసం కోసం జరిగే పోరాటాన్నీ సూచించగలదు. ప్రధాన పాఠం ఏ ఒక్క భావాన్నీ ఖరారు చేయకుండా, రెండు అవకాశాలను పాదసూచికలో వివరిస్తుంది.
- issue: ఒప్పుకోలు మరియు శాశ్వత జీవం/పిలుపు మధ్య సంబంధం
  choice: ప్రధాన పాఠంలో సమన్వయ వాక్యంగా ఉంచడం
  alternative: ‘దాని గురించి నీవు మంచి ఒప్పుకోలు చేశావు’ అని స్పష్టమైన సంబంధం చూపడం
  rationale: గ్రీకు వాక్యక్రమం ఒప్పుకోలను పిలుపుతో సన్నిహితంగా కలుపుతుంది, కానీ ఒప్పుకోలు యొక్క విషయాన్ని ప్రత్యక్షంగా చెప్పదు. అందువల్ల ప్రధాన పాఠం అదనపు సంబంధాన్ని విధించకుండా ఉంచి, సాధ్యమైన సంబంధిత పఠనాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మంచి పోరాటాన్ని పోరాడు’ అనే పునరుక్తి మూలంలోని పదప్రయోగ బలాన్ని నిలుపుతుంది. వేదాంతపరమైన రెండు ప్రధాన సందిగ్ధతలు ప్రధాన పాఠంలో బలవంతంగా పరిష్కరించకుండా పాదసూచికల్లో స్పష్టంగా ఉంచబడ్డాయి.
