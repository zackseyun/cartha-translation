id: 1TI.6.5
reference: 1 Timothy 6:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διαπαρατριβαὶ διεφθαρμένων ἀνθρώπων τὸν νοῦν καὶ ἀπεστερημένων τῆς ἀληθείας, νομιζόντων πορισμὸν εἶναι τὴν ⸀εὐσέβειαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/005.yaml
  text: constant friction among people whose minds are corrupted and who have been deprived of the truth[b][a], imagining that godliness is a means of gain.
translation:
  language: te
  text: మనస్సు చెడిపోయిన, సత్యం నుండి వంచితులైన మనుషుల మధ్య ఎడతెగని ఘర్షణలు[a] జరుగుతాయి; వారు దైవభక్తిని లాభసాధనంగా[b] భావిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎడతెగని వాగ్వాదాలు,’ ‘నిత్యం కొనసాగే కలహాలు.’ గ్రీకు పదం ఒకరితో ఒకరు పదేపదే రాపిడికి లోనవుతున్నట్లుగా కొనసాగే ఘర్షణను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దైవభక్తే లాభమని,’ ‘దైవభక్తి లాభానికి మూలమని.’ వారు దేవునిపట్ల భక్తిని లాభం కోసం ఉపయోగించదగినదిగా చూస్తున్నారనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπαρατριβαὶ
  choice: నిరంతర ఘర్షణలు
  rationale: ఈ అరుదైన బహువచన నామవాచకం ఒకరితో ఒకరు పదేపదే రాపిడికి లోనవుతున్నట్లుగా కొనసాగే వివాదాలను సూచిస్తుంది. ‘నిరంతర ఘర్షణలు’ ఆ రూపక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: διεφθαρμένων ... τὸν νοῦν
  choice: మనస్సు చెడిపోయి
  rationale: పరిపూర్ణ కర్మణి కృదంతం అవినీతికి లోనై ఇప్పుడు ఆ స్థితిలో ఉన్న భావాన్ని ఇస్తుంది. ‘మనస్సు చెడిపోయి’ జ్ఞానపరమైన, నైతికమైన రెండు కోణాలనూ అతిశయింపకుండా తెలియజేస్తుంది.
- source_word: ἀπεστερημένων τῆς ἀληθείας
  choice: సత్యాన్ని కోల్పోయిన
  rationale: మూలంలోని పరిపూర్ణ కర్మణి రూపం సత్యం నుండి వంచితులై ఉన్న ఫలితస్థితిని సూచిస్తుంది. తెలుగు సహజత్వం కోసం ‘సత్యాన్ని కోల్పోయిన’ అని ఇచ్చినా, ఇది వారు స్వచ్ఛందంగా విడిచిపెట్టారనే భావాన్ని తప్పనిసరిగా మోపదు.
- source_word: νομιζόντων
  choice: భావిస్తారు
  rationale: ఈ కృదంతం వారి తప్పుదృష్టిని పరిచయం చేస్తుంది. ‘భావిస్తారు’ సహజమైన తెలుగు; వాక్యసందర్భమే ఆ భావన తప్పని స్పష్టం చేస్తుంది.
- source_word: πορισμὸν
  choice: లాభం సంపాదించడానికి ఒక మార్గం
  rationale: πορισμός లాభాన్ని లేదా లాభం పొందే సాధనాన్ని సూచించగలదు. ఇక్కడ దైవభక్తిని స్వలాభం కోసం ఉపయోగించే సాధనంగా చూడటాన్ని ఈ పదబంధం స్పష్టం చేస్తుంది.
- source_word: εὐσέβειαν
  choice: దైవభక్తి
  rationale: పాస్టరల్ పత్రికల్లో ఈ పదం దేవునిపట్ల భక్తితో కూడిన జీవనాన్ని సూచిస్తుంది. ‘దైవభక్తి’ సానుకూల మూలార్థాన్ని నిలుపుతుంది; దోషం దానిలో కాక, దాన్ని లాభసాధనంగా చూసే వారి వైఖరిలో ఉంది.
theological_decisions:
- issue: εὐσέβεια నిజమైన దేవభక్తిని సూచిస్తుందా, కేవలం బాహ్య మతాచారాన్నా?
  choice: దైవభక్తి
  alternative: మతాచారం / భక్తి ప్రదర్శన
  rationale: గ్రీకు పదం స్వతహాగా సానుకూలమైనది. ఈ సందర్భంలో విమర్శ దైవభక్తిపైన కాదు; దాన్ని స్వలాభానికి ఉపయోగించాలనే వారి దృష్టిపైన ఉంది.
- issue: διεφθαρμένων యొక్క నైతిక తీవ్రతను ఎలా వ్యక్తం చేయాలి?
  choice: మనస్సు చెడిపోయి
  alternative: మనస్సు భ్రష్టుపట్టి / దుర్మార్గమైన మనస్సుగల
  rationale: ‘చెడిపోయి’ మూలంలోని బలమైన ప్రతికూల తీర్పును నిలుపుతుంది; అయితే తరువాతి సిద్ధాంతపరమైన పదజాలాన్ని లేదా మూలానికి మించిన తీవ్రతను చేర్చదు.
- issue: ἀπεστερημένων లో క్రియకర్త ఎవరో నిర్ణయించాలా?
  choice: సత్యాన్ని కోల్పోయిన
  alternative: సత్యం నుండి దోచుకోబడిన / సత్యాన్ని తామే వదిలేసిన
  rationale: గ్రీకు కర్మణి రూపం వారిని సత్యం నుండి ఎవరు లేదా ఏది వంచించిందో చెప్పదు. అనువాదం ఆ అనిశ్చితిని వీలైనంతవరకు కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యం ముందటి సందర్భానికి వ్యాకరణపరంగా అనుసంధానమైన జాబితా భాగమైనప్పటికీ, ఇచ్చిన ఒక్క వచనం తెలుగులో చదవడానికి సహజంగా ఉండేలా సంపూర్ణ వాక్యంగా రూపొందించబడింది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
