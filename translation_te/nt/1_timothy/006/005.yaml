revisions:
- from: మనస్సు చెడిపోయి, సత్యాన్ని కోల్పోయిన మనుషుల మధ్య నిరంతర ఘర్షణలు[a] పుడుతాయి. వారు దైవభక్తి లాభం సంపాదించడానికి ఒక మార్గమని[b] భావిస్తారు.
  to: మనస్సు చెడిపోయిన, సత్యం నుండి వంచితులైన మనుషుల మధ్య ఎడతెగని ఘర్షణలు[a] జరుగుతాయి; వారు దైవభక్తిని లాభసాధనంగా[b] భావిస్తారు.
  rationale: The revision preserves the passive ambiguity of ἀπεστερημένων, tightens the rendering of πορισμός, and retains the draft’s faithful rendering of ongoing conflict and positive εὐσέβεια. The footnote’s reference to gain is kept general rather than specifying material gain, since the Greek verse itself does not state that qualifier.
