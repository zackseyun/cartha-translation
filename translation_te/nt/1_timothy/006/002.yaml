  source_fidelity: The draft accurately represents πιστοὺς δεσπότας as “విశ్వాసులైన యజమానులు,” preserves the prohibition against contempt, and appropriately renders μᾶλλον δουλευέτωσαν as increased service. Its wording for the difficult final relative phrase remains suitably noncommittal in the main text, while the footnote identifies the likely contextual referent without presenting it as certain.
