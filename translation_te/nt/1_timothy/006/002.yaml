id: 1TI.6.2
reference: 1 Timothy 6:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ πιστοὺς ἔχοντες δεσπότας μὴ καταφρονείτωσαν, ὅτι ἀδελφοί εἰσιν· ἀλλὰ μᾶλλον δουλευέτωσαν, ὅτι πιστοί εἰσιν καὶ ἀγαπητοὶ οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι. Ταῦτα δίδασκε καὶ παρακάλει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/002.yaml
  text: And those who have believing masters must not despise them because they are brothers[a]; rather, they must serve them all the more, because those who partake of the benefit are believers and beloved[b]. Teach and urge these things.
translation:
  language: te
  text: విశ్వాసులైన యజమానులు ఉన్నవారు, వారు సహోదరులు[a] కాబట్టి వారిని చిన్నచూపు చూడకూడదు. దానికి బదులుగా, ఆ మేలు పొందేవారు విశ్వాసులూ ప్రియులూ కాబట్టి, వారికి మరింతగా సేవ చేయాలి.[b] ఈ సంగతులను బోధించు, ప్రోత్సహించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సహోదర సహోదరీలు”; గ్రీకులో “సహోదరులు.” ఇక్కడ తోటి విశ్వాసులనే భావం.
    reason: lexical_alternative
  - marker: b
    text: “ఆ మేలు పొందేవారు” అనే వాక్యభాగం అర్థనిర్ణయంలో కఠినమైనది. సేవవల్ల లబ్ధిపొందే విశ్వాసులైన యజమానులనే ఇది ఎక్కువగా సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστοὺς
  choice: విశ్వాసులైన
  rationale: ఇక్కడ ఈ విశేషణం యజమానులు క్రీస్తులో విశ్వసించేవారని సూచిస్తుంది; కేవలం నమ్మదగినవారని కాదు.
- source_word: δεσπότας
  choice: యజమానులు
  rationale: దాస్యంతో కూడిన గృహసంబంధ సందర్భంలో అధికారం, స్వామిత్వం కలవారిని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: καταφρονείτωσαν
  choice: చిన్నచూపు చూడకూడదు
  rationale: తృణీకరించడం లేదా హీనంగా చూడడం అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀδελφοί
  choice: సహోదరులు
  rationale: గ్రీకు పురుష బహువచన రూపాన్నీ, తోటి విశ్వాసుల కుటుంబసంబంధ భావాన్నీ నిలుపుతుంది.
- source_word: μᾶλλον δουλευέτωσαν
  choice: మరింతగా సేవ చేయాలి
  rationale: దాస్యస్థితిలో సేవ చేయడాన్ని సూచించే క్రియాభావాన్ని, μᾶλλον యొక్క అధికతను సహజంగా అందిస్తుంది.
- source_word: πιστοί
  choice: విశ్వాసులు
  rationale: క్రీస్తులో విశ్వసించేవారనే నామవాచక భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: ἀγαπητοὶ
  choice: ప్రియులు
  rationale: క్రైస్తవ సమాజంలోని ప్రేమపూర్వక సంబంధాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: ఆ మేలు పొందేవారు
  rationale: సంక్షిప్తమైన, వివాదాస్పదమైన గ్రీకు నిర్మాణాన్ని అతిగా వివరించకుండా ప్రతిబింబిస్తుంది; సందర్భంలో యజమానులే సేవవల్ల లబ్ధిపొందేవారనే పఠనానికి అనుకూలంగా ఉంటుంది.
- source_word: Ταῦτα δίδασκε καὶ παρακάλει
  choice: ఈ సంగతులను బోధిస్తూ ప్రోత్సహించు
  rationale: రెండు వర్తమాన ఆజ్ఞల నిరంతర భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; παρακαλέω ఇక్కడ బలంగా ప్రేరేపించడం/ఉద్బోధించడం అనే భావం కలిగి ఉంది.
theological_decisions:
- issue: ἀδελφοί యొక్క లింగసూచక, సంఘసంబంధ భావం
  choice: సహోదరులు
  alternative: సహోదర సహోదరీలు; తోటి విశ్వాసులు
  rationale: మూలంలోని పురుష బహువచన రూపాన్ని నిలుపుతూ, ఇది విశ్వాస కుటుంబ సంబంధాన్ని సూచిస్తుందని పాదసూచికలో తెలియజేయబడింది.
- issue: దాస్య సందర్భంలోని సామాజిక పదజాలం
  choice: యజమానులు ... సేవ చేయాలి
  alternative: స్వాములు ... దాసులుగా మరింత పనిచేయాలి
  rationale: δεσπότης యొక్క అధికార సంబంధాన్ని స్పష్టంగా ఉంచి, δουλεύωను తెలుగులో సహజంగా అనువదిస్తుంది; ఈ వచనంలో δοῦλος అనే నామవాచకం ప్రత్యక్షంగా లేదు.
- issue: οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι ఎవరికీ వర్తిస్తుంది
  choice: మేలు పొందేవారు విశ్వాసులైన యజమానులు
  alternative: విశ్వాసులైన సేవకులు మేలు చేయడంలో పాలుపంచుకుంటారు; రెండు వర్గాలూ మేలులో పాలుపంచుకుంటాయి
  rationale: సందర్భంలో సమీప సూచ్యం యజమానులే; అయినా గ్రీకు నిర్మాణం కఠినమైనదీ వివాదాస్పదమైనదీ కావడంతో అనువాదాన్ని కొంత తెరిచి ఉంచి పాదసూచికలో సమస్యను పేర్కొంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి. మూలంలోని దాస్యసంబంధ వాస్తవాన్ని దాచకుండా, వివాదాస్పద చివరి ఉపవాక్యంలోని అస్పష్టతను పాదసూచికతో నిలిపింది.
