id: 1TI.6.9
reference: 1 Timothy 6:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ βουλόμενοι πλουτεῖν ἐμπίπτουσιν εἰς πειρασμὸν καὶ παγίδα καὶ ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς, αἵτινες βυθίζουσι τοὺς ἀνθρώπους εἰς ὄλεθρον καὶ ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/009.yaml
  text: But those who want to be rich fall into temptation[a], a snare, and many foolish and harmful desires[c][b], which plunge people into ruin and destruction.
translation:
  language: te
  text: 'కానీ ధనవంతులు కావాలని కోరుకునేవారు[a] ప్రలోభంలో, ఉచ్చులో, అనేక అవివేకమైన, హానికరమైన కోరికల్లో పడతారు. ఆ కోరికలు మనుషులను నాశనంలోకి, వినాశంలోకి ముంచివేస్తాయి.


    [a] లేదా, “ధనికులుగా ఉండాలని కోరుకునేవారు.” గ్రీకు పదబంధం కేవలం ధనాన్ని కలిగి ఉండడాన్ని కాక, ధనవంతులు కావాలనే కోరికను సూచించగలదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ధనికులుగా ఉండాలని కోరుకునేవారు.” గ్రీకు పదబంధం కేవలం ధనాన్ని కలిగి ఉండడాన్ని కాక, ధనవంతులు కావాలనే కోరికను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ βουλόμενοι
  choice: అయితే ... కోరుకునేవారు
  rationale: βούλομαι ఇక్కడ స్థిరమైన కోరిక లేదా ఉద్దేశాన్ని సూచిస్తుంది. ‘కోరుకునేవారు’ అనేది దాని కృదంత భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: πλουτεῖν
  choice: ధనవంతులు కావాలని
  rationale: ఈ క్రియారూపం ‘ధనికులుగా ఉండడం’ లేదా ‘ధనవంతులు కావడం’ అనే భావాలను ఇవ్వగలదు. సందర్భంలో సంపదను సంపాదించాలనే ఆకాంక్ష ప్రధానంగా ఉన్నందున ‘ధనవంతులు కావాలని’ ఎంచుకుని, మరో సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐμπίπτουσιν
  choice: పడతారు
  rationale: ప్రతికూలమైన స్థితిలో చిక్కుకోవడాన్ని సూచించే మూలభాషా రూపకాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: πειρασμόν
  choice: ప్రలోభం
  rationale: ఈ హెచ్చరిక సందర్భంలో ఇది తటస్థమైన పరీక్షకన్నా పాపం వైపు ఆకర్షించే ప్రలోభాన్ని సూచిస్తుంది.
- source_word: παγίδα
  choice: ఉచ్చు
  rationale: పట్టుకునే సాధనం అనే స్పష్టమైన రూపకాన్ని, దాని నైతిక ప్రమాదభావాన్ని నిలుపుతుంది.
- source_word: ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς
  choice: అనేక అవివేకమైన హానికరమైన కోరికలు
  rationale: ἐπιθυμίαι అనే విస్తృత భావానికి ‘కోరికలు’, ἀνοήτουςకు ‘అవివేకమైన’, βλαβεράςకు ‘హానికరమైన’ అనే సులభమైన ఆధునిక పదాలు సరిపోతాయి.
- source_word: αἵτινες
  choice: ఆ కోరికలు
  rationale: సాపేక్ష సర్వనామం ముందున్న కోరికలనే సూచిస్తుంది. తెలుగులో వాక్యాన్ని విడదీసి ‘ఆ కోరికలు’ అనడం సూచనను స్పష్టంగా, సహజంగా చేస్తుంది.
- source_word: βυθίζουσι
  choice: ముంచివేస్తాయి
  rationale: βυθίζωలోని మునిగిపోయేలా చేయడం అనే బలమైన, సజీవ రూపకాన్ని నిలుపుతుంది.
- source_word: τοὺς ἀνθρώπους
  choice: మనుషులను
  rationale: ἄνθρωποι ఇక్కడ పురుషులను మాత్రమే కాక మానవులను సాధారణంగా సూచిస్తుంది; ‘మనుషులను’ ఆ సమగ్ర భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ὄλεθρον
  choice: పతనం
  rationale: తీవ్రమైన నష్టాన్ని లేదా నాశనకరమైన పర్యవసానాన్ని సూచిస్తూ, తరువాతి ἀπώλεια నుండి పదభేదాన్ని నిలుపుతుంది.
- source_word: ἀπώλειαν
  choice: వినాశం
  rationale: నాశనం లేదా అంతమనే బలమైన భావాన్ని తెలియజేస్తుంది; దీనిని తప్పనిసరిగా ఒక నిర్దిష్ట అంత్యకాల సిద్ధాంత పదంగా మార్చదు.
theological_decisions:
- issue: ὄλεθρον καὶ ἀπώλειαν ప్రత్యేకంగా నిత్యశిక్షనే సూచిస్తున్నాయా?
  choice: ‘పతనం, వినాశం’ అని విస్తృతమైన హెచ్చరికగా అనువదించాం.
  alternative: ‘నాశనం, నరకపాతం’ వంటి పదాలతో అంతిమ దండనను స్పష్టీకరించడం.
  rationale: ఈ రెండు గ్రీకు పదాలు అత్యంత తీవ్రమైన పర్యవసానాలను తెలియజేస్తాయి; అయితే ఈ వచనంలోనే వాటి పరిధిని ప్రత్యేకంగా నిత్యశిక్షకు పరిమితం చేయవు. అందువల్ల మూలంలోని తీవ్రతను నిలుపుతూ, అదనపు సిద్ధాంత నిర్ణయాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే హెచ్చరికలోని గంభీరతను నిలుపుతూ అనువదించాం. ‘ముంచివేస్తాయి’ అనే సజీవ రూపకాన్ని ఉంచి, గ్రీకు వాక్యంలోని పొడవైన శ్రేణిని తెలుగులో రెండు వాక్యాలుగా విభజించాం.
