id: 1TI.6.19
reference: 1 Timothy 6:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀποθησαυρίζοντας ἑαυτοῖς θεμέλιον καλὸν εἰς τὸ μέλλον, ἵνα ἐπιλάβωνται τῆς ⸀ὄντως ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/019.yaml
  text: storing up for themselves a good foundation for the future[a], so that they may take hold of the life that is truly life.
translation:
  language: te
  text: రాబోయే కాలం కోసం[a] తమకు తాము మంచి పునాదిని కూడబెట్టుకోవడం ద్వారా, వారు నిజమైన జీవాన్ని పట్టుకోగలిగేలా ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాబోయేదాని కోసం.”
    reason: εἰς τὸ μέλλον అనే పదబంధం ‘భవిష్యత్తు/రాబోయే కాలం’ అని లేదా మరింత పదశఃగా ‘రాబోయేదాని కోసం’ అని అర్థమవుతుంది; ‘రాబోయే యుగం’ అనే భావం సాధ్యమైనప్పటికీ గ్రీకులో ‘యుగం’ అనే పదం లేదు.
lexical_decisions:
- source_word: ἀποθησαυρίζοντας
  choice: కూడబెట్టుకుంటూ
  rationale: వర్తమాన కృదంతం మునుపటి వచనంలోని ఉపదేశాన్ని కొనసాగిస్తుంది. ఈ పదప్రయోగం ధనాన్ని పోగుచేసే రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἑαυτοῖς
  choice: తమకు తాము
  rationale: కర్తల స్వప్రయోజనాన్ని సూచించే ఆత్మార్థక సర్వనామ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: θεμέλιον καλὸν
  choice: మంచి పునాదిని
  rationale: θεμέλιον లోని నిర్మాణ రూపకాన్ని నేరుగా నిలుపుతూ, καλόν యొక్క మంచి, శ్రేష్ఠమైన అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς τὸ μέλλον
  choice: రాబోయే కాలం కోసం
  rationale: ముందున్నదానివైపు చూపే విస్తృత భావాన్ని కాపాడుతుంది; గ్రీకులో స్పష్టంగా లేని ‘రాబోయే యుగం’ అనే నిర్దిష్ట వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: ἵνα
  choice: …పట్టుకునేలా
  rationale: ఉద్దేశాన్ని తెలిపే ἵνα భావాన్ని తెలుగు వాక్య నిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπιλάβωνται
  choice: పట్టుకునేలా
  rationale: ‘పట్టుకోవడం, అందిపుచ్చుకోవడం’ అనే సజీవ రూపకాన్ని నిలుపుతుంది; కేవలం ‘పొందడం’ అని సారాంశీకరించదు.
- source_word: τῆς ὄντως ζωῆς
  choice: నిజమైన జీవాన్ని
  rationale: ὄντως యొక్క ‘నిజంగా, వాస్తవంగా’ అనే గుణాత్మక ఉద్ఘాటనను, ζωή అనే నామవాచకాన్ని స్పష్టంగా ఉంచుతూ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: εἰς τὸ μέλλον ను నిర్దిష్టంగా అంత్యకాల లేదా రాబోయే యుగ భావంతో అనువదించాలా
  choice: రాబోయే కాలం కోసం
  alternative: రాబోయే యుగం కోసం
  rationale: సందర్భంలో అంత్యకాల ప్రతిధ్వని ఉన్నప్పటికీ, గ్రీకు పదబంధం ‘యుగం’ అని స్పష్టంగా చెప్పదు. అందువల్ల విస్తృతమైన ముందుచూపు భావాన్ని నిలిపి, నిర్దిష్ట వ్యాఖ్యానాన్ని రుద్దలేదు.
- issue: τῆς ὄντως ζωῆς లోని గుణాత్మక వ్యత్యాసాన్ని ఎలా చూపాలి
  choice: నిజమైన జీవాన్ని
  alternative: నిజంగా జీవమైన జీవాన్ని
  rationale: సంపదపై ఆధారపడిన జీవనానికి విరుద్ధంగా అసలైన జీవాన్ని సూచించే భావాన్ని స్పష్టంగా ఉంచుతుంది; మరింత పదశః రూపం తెలుగులో అసహజమైన పునరుక్తిగా వినిపిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని ‘పునాదిని కూడబెట్టడం’ అనే మిశ్రిత రూపకాన్ని సరిచేయకుండా నిలిపింది. వాక్యం ముందటి వచనంలోని ఆజ్ఞను కొనసాగించే భాగంగా ఉండటంతో కృదంత నిర్మాణాన్ని ఉపయోగించింది.
