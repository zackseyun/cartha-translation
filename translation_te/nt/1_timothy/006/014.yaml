id: 1TI.6.14
reference: 1 Timothy 6:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τηρῆσαί σε τὴν ἐντολὴν ἄσπιλον ἀνεπίλημπτον μέχρι τῆς ἐπιφανείας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/014.yaml
  text: that you keep the commandment unstained and above reproach until the appearing of our Lord Jesus the Messiah[c][b][a],
translation:
  language: te
  text: మన ప్రభువైన యేసు మెస్సీయ[a] ప్రత్యక్షమయ్యే వరకు నీవు ఆ ఆజ్ఞను ఏ మచ్చా లేకుండా, నిందకు తావు లేకుండా పాటించాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యేసు క్రీస్తు.’ గ్రీకు Χριστός అనే బిరుదును దాని అర్థం ప్రకారం ‘మెస్సీయ’ అని గానీ, సంప్రదాయ నామరూపంలో ‘క్రీస్తు’ అని గానీ అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘ఏ మచ్చా లేకుండా, నిందకు తావు లేకుండా’ అనే మాటలు ఆ ఆజ్ఞను వర్ణించవచ్చు; లేదా తిమోతి దానిని పాటించే విధానాన్ని సూచించవచ్చు. గ్రీకు వాక్య నిర్మాణం సంక్షిప్తంగా ఉండి ఈ రెండింటి మధ్య సంబంధాన్ని పూర్తిగా స్పష్టం చేయదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῆσαί
  choice: పాటించాలి
  rationale: ఈ క్రియ మునుపటి వచనంలోని గంభీరమైన ఆదేశంపై ఆధారపడుతుంది. తెలుగులో ‘పాటించాలి’ అనేది ఆ ఆజ్ఞకు నమ్మకంగా విధేయత చూపాలనే భావాన్ని సహజంగా తెలియజేస్తుంది; కేవలం కాపాడటం లేదా గమనించడం అనే పరిమిత భావాన్ని రుద్దదు.
- source_word: τὴν ἐντολήν
  choice: ఆ ఆజ్ఞను
  rationale: నిర్దిష్ట ఏకవచన నామవాచకాన్ని, సందర్భంలో ముందుగా ఇచ్చిన ఆదేశాన్ని సూచించే విధంగా ‘ఆ ఆజ్ఞను’ అని అనువదించాం.
- source_word: ἄσπιλον
  choice: ఏ మచ్చా లేకుండా
  rationale: మచ్చ లేదా కళంకం లేని స్థితిని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది. ఈ పదం ఆజ్ఞను విశేషిస్తున్నదా లేక దానిని పాటించే విధానాన్ని సూచిస్తున్నదా అనే సంక్షిప్త గ్రీకు నిర్మాణంలోని ఉద్వేగాన్ని పూర్తిగా పరిష్కరించకుండా ఉంచుతుంది.
- source_word: ἀνεπίλημπτον
  choice: నిందకు తావు లేకుండా
  rationale: సముచితమైన తప్పుబాటుకు లేదా నిందకు అవకాశం లేని భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: μέχρι τῆς ἐπιφανείας
  choice: ప్రత్యక్షమయ్యే వరకు
  rationale: భవిష్యత్తులో కనిపించే విధంగా రావడాన్ని సూచించే ἐπιφάνεια భావాన్ని సహజమైన క్రియారూపంలో అందిస్తుంది; మూలంలో స్పష్టంగా లేని ‘రెండవ రాకడ’ అనే పదబంధాన్ని చేర్చదు.
- source_word: τοῦ κυρίου ἡμῶν
  choice: మన ప్రభువైన
  rationale: κύριος అనే క్రీస్తుసంబంధ బిరుదును ‘ప్రభువు’గా ఉంచి, తెలుగు వాక్య నిర్మాణానికి తగిన సంబంధ రూపాన్ని వాడాం.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστός ఇక్కడ అంత్యకాల ప్రత్యక్షత సందర్భంలో బిరుదుగా వినిపిస్తుంది. అందువల్ల దాని అర్థాన్ని పారదర్శకంగా చూపేందుకు ‘మెస్సీయ’ అని ఇచ్చాం; తెలుగులో వ్యక్తిపేరు తరువాత బిరుదుకు ప్రత్యేక నిర్దిష్ట ఉపపదం అవసరం లేదు.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ లో Χριστοῦ అనువాదం
  choice: యేసు మెస్సీయ
  alternative: యేసు క్రీస్తు
  rationale: Χριστός అనే పదం ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదు భావాన్ని కలిగి ఉంది. ఈ గంభీరమైన భవిష్యత్ ప్రత్యక్షత సందర్భంలో ఆ బిరుదు భావాన్ని ప్రధాన పాఠ్యంలో వినిపించాం; సంప్రదాయ నామరూపమైన ‘క్రీస్తు’ను పాదసూచికలో ఇచ్చాం.
- issue: ἄσπιλον, ἀνεπίλημπτον పదాల సంబంధం
  choice: ‘ఏ మచ్చా లేకుండా, నిందకు తావు లేకుండా’ అనే క్రియావిశేషణసదృశ నిర్మాణం
  alternative: ‘మచ్చలేని, నిందకు తావులేని ఆ ఆజ్ఞను’
  rationale: గ్రీకులో విశేషణాలు వ్యాకరణపరంగా ‘ఆజ్ఞ’తో ఏకీభవించినా, భావపరంగా తిమోతి దానిని పాటించే విధానాన్నీ సూచించవచ్చు. తెలుగు ప్రధాన పాఠ్యం ఆ సంబంధాన్ని అతిగా ఖరారు చేయకుండా సహజంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘ప్రత్యక్షమయ్యే వరకు’ సహజంగా ఉండి ἐπιφάνεια యొక్క కనిపించే రాక భావాన్ని నిలుపుతుంది. వచనం మునుపటి ఆదేశ వాక్యంపై వ్యాకరణపరంగా ఆధారపడినప్పటికీ, విడిగా చదివినప్పుడు పూర్తి భావం రావడానికి ‘పాటించాలి’ అనే సహజ తెలుగు విధిరూపాన్ని ఉపయోగించాం.
