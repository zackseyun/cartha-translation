id: 1TI.6.7
reference: 1 Timothy 6:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδὲν γὰρ εἰσηνέγκαμεν εἰς τὸν κόσμον, ⸀ὅτι οὐδὲ ἐξενεγκεῖν τι δυνάμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/007.yaml
  text: For we brought nothing into the world[a], and we are not able to carry anything out.
translation:
  language: te
  text: ఎందుకంటే మనం ఈ లోకంలోకి ఏమీ తీసుకురాలేదు[a]; దానినుండి ఏదీ తీసుకుపోలేము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “మనం లోకంలోకి ఏమీ తీసుకురాలేదు, ఎందుకంటే—లేదా, దానికి జతగా—లోకం నుండి ఏదీ తీసుకుపోలేము.” గ్రీకు అనుసంధాన పదాన్ని కారణార్థకంగా (“ఎందుకంటే”) లేదా దానికి సరిపోలే రెండవ ప్రకటనను పరిచయం చేసేదిగా అర్థం చేసుకోవచ్చు.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: ఏమీ
  rationale: εἰσηνέγκαμεν క్రియకు కర్మగా ఉన్న సంపూర్ణ నిరాకరణను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న వాక్యానికి కారణం లేదా వివరణను సూచించే అనుసంధాన బలాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: εἰσηνέγκαμεν
  choice: తీసుకురాలేదు
  rationale: εἰσφέρω అనే ‘లోపలికి తేవడం’ భావాన్ని, లోకంలోకి ప్రవేశించే రూపకానికి సహజంగా సరిపోయే తెలుగులో అందిస్తుంది.
- source_word: εἰς τὸν κόσμον
  choice: ఈ లోకంలోకి
  rationale: κόσμος ఇక్కడ మనుషులు జన్మించి ప్రవేశించే లోకాన్ని సూచిస్తుంది; సాంకేతికంగా విశ్వాన్ని కాదు.
- source_word: ὅτι
  choice: ;
  rationale: ఇక్కడ ὅτι కారణార్థకంగా లేదా జతగా వచ్చే రెండవ వాక్యాన్ని పరిచయం చేసేదిగా అర్థమవవచ్చు. ప్రధాన పాఠంలో సమతుల్యమైన రెండు ప్రకటనలను విరామచిహ్నంతో కలిపి, సందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: οὐδὲ
  choice: ఏదీ … పోలేము
  rationale: నిరాకరణతో కూడిన అనంతక్రియా నిర్మాణాన్ని సహజమైన తెలుగు వాక్యక్రమంలో వ్యక్తపరుస్తుంది.
- source_word: ἐξενεγκεῖν
  choice: తీసుకుపోవడం
  rationale: లోకం నుండి బయటకు ఏదైనా మోసుకెళ్లడం అనే చిత్రాన్ని సహజంగా నిలుపుతుంది.
- source_word: τι
  choice: ఏదీ
  rationale: నిరాకరణ పరిధిలోని అనిర్దిష్ట సర్వనామాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: δυνάμεθα
  choice: పోలేము
  rationale: ‘మనకు సాధ్యం కాదు’ అనే సామర్థ్య నిరాకరణను సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ὅτι పరిచయం చేసే రెండవ ఉపవాక్యపు సంబంధం
  choice: లోకంలోకి ఏమీ తీసుకురాలేదనే మాటకు సమాంతరంగా, లోకం నుండి ఏదీ తీసుకుపోలేమనే రెండవ సత్యం
  alternative: ‘ఎందుకంటే ఏదీ తీసుకుపోలేము’ అనే కారణార్థక ఉపవాక్యం
  rationale: గ్రీకు ὅτι కారణార్థకంగా ఉండవచ్చు; అయితే సందర్భంలో ఈ వచనం రెండు సమతుల్య ప్రకటనలతో సామెతలాంటి నిర్మాణంగా పనిచేస్తుంది. ప్రధాన పాఠం ఆ సమతుల్యతను సహజంగా అందిస్తుండగా, కారణార్థక అవకాశాన్ని పాదసూచిక సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన సామెతసదృశ శైలి. ‘ఈ లోకంలోకి’ మరియు ‘ఇక్కడి నుండి’ అనే జత ప్రవేశం–నిష్క్రమణ చిత్రాన్ని సహజంగా చూపిస్తుంది; పాదసూచిక ὅτι యొక్క నిజమైన వ్యాకరణ సందిగ్ధతను నిలుపుతుంది.
