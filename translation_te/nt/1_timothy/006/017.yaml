id: 1TI.6.17
reference: 1 Timothy 6:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι παράγγελλε μὴ ὑψηλοφρονεῖν μηδὲ ἠλπικέναι ἐπὶ πλούτου ἀδηλότητι, ἀλλ’ ⸀ἐπὶ ⸀θεῷ τῷ παρέχοντι ἡμῖν πάντα πλουσίως εἰς ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/017.yaml
  text: Command those who are rich in the present age not to be arrogant[a], nor to set their hope on the uncertainty of riches, but on God[b], who richly provides us with everything for enjoyment.
translation:
  language: te
  text: ప్రస్తుత యుగంలో[a] ధనవంతులుగా ఉన్నవారు గర్విష్ఠులుగా ఉండకూడదనీ, అనిశ్చితమైన సంపదపై[b] ఆశ పెట్టుకోకూడదనీ, మనం ఆనందించడానికి సమస్తాన్నీ సమృద్ధిగా అనుగ్రహించే దేవునిపై ఆశ పెట్టుకోవాలని ఆజ్ఞాపించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రస్తుత లోకవ్యవస్థలో.’ గ్రీకు పదానికి ‘యుగం’ అని, విస్తృతార్థంలో ప్రస్తుత లోకవ్యవస్థ అని అర్థాలు రావచ్చు; ‘యుగం’ పౌలు చూపించే కాలసంబంధమైన వ్యత్యాసాన్ని మెరుగ్గా నిలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, ‘సంపద యొక్క అనిశ్చితత్వంపై.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς πλουσίοις
  choice: ధనవంతులుగా ఉన్నవారు
  rationale: ఆర్టికల్‌తో ఉన్న దత్తివ బహువచన విశేషణం వ్యక్తులను సూచిస్తుంది. ఈ రూపం వారిని కేవలం ఒక ముద్రపేరుతో పిలవకుండా సహజమైన ఆధునిక తెలుగులో అర్థాన్ని తెలియజేస్తుంది.
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: ప్రస్తుత యుగంలో
  rationale: αἰών భౌతిక లోకాన్ని మాత్రమే కాక ప్రస్తుత కాలవ్యవస్థను సూచిస్తుంది. ‘యుగం’ పౌలు ఉద్దేశించిన కాలసంబంధమైన, అంత్యకాల నేపథ్య వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: παράγγελλε
  choice: ఆజ్ఞాపించు
  rationale: వర్తమాన ఆజ్ఞార్థక క్రియకు అధికారపూర్వకమైన బలం ఉంది; ‘ఆజ్ఞాపించు’ దానిని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: μὴ ὑψηλοφρονεῖν
  choice: గర్విష్ఠులుగా ఉండకూడదని
  rationale: ఈ క్రియ తనను తాను ఉన్నతంగా భావించే అహంకారాన్ని సూచిస్తుంది. ఎంపిక చేసిన పదబంధం సాధారణ ఆధునిక తెలుగులో నైతిక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: μηδὲ ἠλπικέναι
  choice: ఆశ పెట్టుకోకూడదని
  rationale: పరిపూర్ణ infinitive స్థిరంగా ఉంచిన నిరీక్షణ లేదా నమ్మకాన్ని సూచిస్తుంది. ‘ఆశ పెట్టుకోవడం’ తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ἐπὶ πλούτου ἀδηλότητι
  choice: అనిశ్చితమైన సంపదపై
  rationale: ἀδηλότης సంపదకు నిశ్చితత్వం లేదా స్థిరత్వం లేదని తెలియజేస్తుంది. ఈ నిర్మాణం గ్రీకు భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀλλ’ ἐπὶ θεῷ
  choice: దేవునిపైనే
  rationale: పునరావృతమైన ἐπί ఆశకు ఆధారమైన వ్యక్తిని సూచిస్తుంది. ‘-నే’ ముందు చెప్పిన సంపదతో ఉన్న స్పష్టమైన వ్యత్యాసాన్ని తెలుగులో నిలుపుతుంది.
- source_word: τῷ παρέχοντι ἡμῖν
  choice: మనకు … అనుగ్రహించే
  rationale: ఈ attributive participle దేవుణ్ణి వర్ణిస్తుంది. సందర్భంలోని దైవిక ఉదారతను ‘అనుగ్రహించే’ సహజంగా తెలియజేస్తుంది.
- source_word: πάντα
  choice: సమస్తాన్నీ
  rationale: నపుంసక బహువచనం విస్తృత సమగ్రతను సూచిస్తుంది; మూలపాఠం పెట్టని ‘అవసరమైనవి’ వంటి పరిమితిని అనువాదం చేర్చదు.
- source_word: πλουσίως
  choice: సమృద్ధిగా
  rationale: ఇది విస్తారంగా, ఉదారంగా ఇవ్వడాన్ని సూచిస్తుంది. తెలుగులో ‘సమృద్ధిగా’ సహజంగా ఉండి ధనసంబంధ పదజాల ప్రతిధ్వనిని కూడా కొంత నిలుపుతుంది.
- source_word: εἰς ἀπόλαυσιν
  choice: మనం ఆనందించడానికి
  rationale: ఈ పదబంధం ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది. ముందు ఉన్న ἡμῖν కారణంగా ‘మనం’ అని స్పష్టీకరించడం తెలుగులో సహజంగా ఉంటుంది.
theological_decisions:
- issue: నైతిక-అంత్యకాల సందర్భంలో αἰών అర్థం
  choice: యుగం
  alternative: లోకం / ప్రస్తుత లోకవ్యవస్థ
  rationale: ‘యుగం’ అనేది పౌలు రచనల్లో సాధారణమైన కాలసంబంధమైన వ్యత్యాసాన్ని కాపాడుతుంది; భావాన్ని కేవలం భౌతిక లోకానికి పరిమితం చేయదు.
- issue: πάνταలో దైవిక అనుగ్రహ పరిధి
  choice: సమస్తం
  alternative: అవసరమైన సమస్తం
  rationale: మూలపాఠం దేవుని అనుగ్రహాన్ని విస్తృతంగా పేర్కొంటుంది; దానిని కేవలం అవసరాలకు పరిమితం చేయడాన్నీ, సంపద వాగ్దానంగా విస్తరించడాన్నీ అనువాదం చేయదు.
- issue: εἰς ἀπόλαυσινలో భౌతిక అనుగ్రహాల ప్రయోజనం
  choice: మనం ఆనందించడానికి
  alternative: వినియోగించడానికి
  rationale: ἀπόλαυσις నిజమైన అనుభవం లేదా ఆనందాన్ని సూచిస్తుంది. మూలంలో ఉన్న సానుకూల భావాన్ని నైతిక ఆందోళన పేరుతో తగ్గించకుండా, అదే సమయంలో అదుపులేని భోగాన్ని చేర్చకుండా అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం వాడబడింది. గ్రీకు వాక్యంలోని రెండు ప్రతికూల ఆజ్ఞాంశాలు మరియు దేవునిపై ఆశ ఉంచాలనే సానుకూల ఆజ్ఞ ఒకే ప్రవాహంలో నిలుపబడ్డాయి. పాదసూచిక గుర్తులు అవి వివరిస్తున్న పదబంధాల వెంట ఉంచబడ్డాయి.
