id: 1TI.6.8
reference: 1 Timothy 6:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔχοντες δὲ διατροφὰς καὶ σκεπάσματα, τούτοις ἀρκεσθησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/008.yaml
  text: But if we have food and covering[a], we will be content with these.
translation:
  language: te
  text: అయితే, మనకు ఆహారమూ, కప్పుకోవడానికి అవసరమైనవీ ఉంటే, వాటితో మనం సంతృప్తిగా ఉంటాం.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔχοντες
  choice: మనకు ... ఉంటే
  rationale: ఈ క్రియావిశేషణాత్మక కృదంతం ప్రధాన క్రియకు పరిస్థితిని సూచిస్తుంది. తెలుగులో షరతును పోలిన ‘ఉంటే’ సహజంగా ఉండి, గ్రీకులోని భావాన్ని అతిగా నిర్ధారించదు.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వాక్యంలోని లాభం, సంతృప్తి విషయాల నుంచి స్వల్ప వ్యత్యాసంతో కొనసాగింపును సూచిస్తుంది; ‘అయితే’ ఆధునిక తెలుగులో ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: διατροφὰς
  choice: ఆహారం
  rationale: ఈ పదం జీవనపోషణ సాధనాలను, ముఖ్యంగా ఆహారాన్ని సూచిస్తుంది. ‘ఆహారం’ సహజమైనదీ తగినంత నిర్దిష్టమైనదీ.
- source_word: σκεπάσματα
  choice: కప్పుకొనేవి
  rationale: ఈ గ్రీకు పదం వ్యక్తిని కప్పేదాన్ని సూచిస్తుంది; దుస్తులతో పాటు ఆశ్రయాన్నీ కలిగి ఉండే విస్తృత భావానికి అవకాశం ఉంది. ‘కప్పుకొనేవి’ ఆ విస్తృతతను కొంతవరకు నిలుపుతుంది; పాదసూచిక ప్రత్యామ్నాయ అర్థాలను వివరిస్తుంది.
- source_word: τούτοις
  choice: వాటితో
  rationale: ఇది ఇప్పుడే ప్రస్తావించిన ప్రాథమిక అవసరాలవైపు తిరిగి చూపుతుంది. ‘వాటితో’ తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: ἀρκεσθησόμεθα
  choice: మనం తృప్తిగా ఉంటాం
  rationale: భవిష్యత్ సూచక రూపాన్ని ఆజ్ఞార్థకంగా మార్చకుండా, సరిపోవడం లేదా సంతృప్తిగా ఉండడం అనే భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: σκεπάσματα పదం యొక్క పరిధి
  choice: దుస్తులు, బహుశా ఆశ్రయం కూడా కలగగల విస్తృతమైన ‘కప్పుకొనేవి’
  alternative: కేవలం దుస్తులు; లేదా కేవలం ఆశ్రయం
  rationale: ఈ వాక్యం ప్రాథమిక అవసరాలు ఉంటే తృప్తిగా ఉండడాన్ని చెబుతుంది. గ్రీకు పదం పరిధిని అనవసరంగా ఒకే అర్థానికి కుదించకుండా, దాని నిజమైన అస్పష్టతను ప్రధాన పాఠం మరియు పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘కప్పుకొనేవి’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి మూలపదంలోని విస్తృత భావాన్ని నిలుపుతుంది; పాదసూచిక దాని పరిధిని స్పష్టం చేస్తుంది.
