id: 1TI.6.20
reference: 1 Timothy 6:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὦ Τιμόθεε, τὴν παραθήκην φύλαξον, ἐκτρεπόμενος τὰς βεβήλους κενοφωνίας καὶ ἀντιθέσεις τῆς ψευδωνύμου γνώσεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/020.yaml
  text: O Timothy[a], guard the deposit entrusted to you[b], turning away from the profane empty talk and contradictions of what is falsely called knowledge.
translation:
  language: te
  text: ఓ తిమోతీ, అపవిత్రమైన వట్టి మాటలనుంచి, ‘జ్ఞానం’ అని అబద్ధంగా పిలువబడుతున్న దాని[b] వైరుధ్యాలనుంచి[a] దూరంగా ఉంటూ, నీకు అప్పగించబడిన దానిని కాపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వ్యతిరేక వాదాలు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘జ్ఞానం అని చెప్పబడుతున్న దాని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ Τιμόθεε
  choice: ఓ తిమోతీ
  rationale: Ὦ అనే సంబోధన అవ్యయం కలిగించే గంభీరమైన ప్రత్యక్ష సంబోధనను ‘ఓ’ సహజంగా నిలుపుతుంది.
- source_word: παραθήκην
  choice: నీకు అప్పగించబడిన దానిని
  rationale: భద్రంగా ఉంచేందుకు అప్పగించినదనే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; దాని విషయమేమిటో వచనం చెప్పినదానికంటే సంకుచితం చేయదు.
- source_word: φύλαξον
  choice: కాపాడు
  rationale: అప్పగించబడినదాన్ని అప్రమత్తంగా భద్రపరచాలనే ఆజ్ఞార్థక బలాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐκτρεπόμενος
  choice: దూరంగా ఉంటూ
  rationale: వాటివైపు మళ్లకుండా తప్పుకోవడం లేదా వాటినుంచి తొలగిపోవడం అనే కృదంత భావాన్ని ప్రధాన ఆజ్ఞతో సహజంగా అనుసంధానిస్తుంది.
- source_word: βεβήλους
  choice: అపవిత్రమైన
  rationale: పవిత్రమైనదానికి విరుద్ధంగా సామాన్యమైన లేదా అపవిత్రమైనదనే మతనైతిక భావాన్ని నిలుపుతుంది.
- source_word: κενοφωνίας
  choice: వట్టి మాటలు
  rationale: సారంలేని, ఖాళీ పలుకులనే సమాసార్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀντιθέσεις
  choice: వైరుధ్యాలు
  rationale: పరస్పరం లేదా సత్యానికి ఎదురుగా నిలిచే వాదనలు/ప్రతిపాదనల భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది; ‘వ్యతిరేక వాదాలు’ అనే విస్తృత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: τῆς ψευδωνύμου γνώσεως
  choice: ‘జ్ఞానం’ అని అబద్ధంగా పిలువబడుతున్న దాని
  rationale: ψευδώνυμος లోని ‘తప్పుడు పేరుతో పిలువబడిన’ భావాన్ని స్పష్టంగా నిలుపుతూ, అది నిజమైన జ్ఞానమనే వాదనను పాఠ్యం నిరాకరిస్తున్నట్లు చూపుతుంది.
theological_decisions:
- issue: ఈ సందర్భంలో παραθήκη స్వభావం
  choice: ‘నీకు అప్పగించబడిన దానిని’ అని సాధారణంగానే అనువదించడం
  alternative: సువార్త సందేశం; అపొస్తలుల బోధ; తిమోతికి అప్పగించిన పరిచర్య బాధ్యత
  rationale: భద్రపరచడానికి తిమోతికి ఏదో అప్పగించబడిందని వచనం స్పష్టం చేస్తుంది; అయితే దాని విషయాన్ని ఈ వచనమే నిర్దిష్టంగా చెప్పదు. అందువల్ల అనువాదం ఏ ఒక్క సిద్ధాంతపరమైన వివరణను పాఠ్యంలో చేర్చదు.
- issue: ἀντιθέσεις యొక్క భావపరిధి
  choice: వైరుధ్యాలు
  alternative: వ్యతిరేక వాదాలు
  rationale: మూలపదం వైరుధ్యాలు, ప్రతివాదాలు లేదా ఎదురుగా నిలిచే అభిప్రాయాలను సూచించగలదు. ప్రధాన పాఠ్యంలో ఒక సహజమైన పదాన్ని ఎంచుకొని, నిజమైన భావసాధ్యతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఓ తిమోతీ’ మూలంలోని గంభీర సంబోధనను నిలుపుతుంది. వాక్యక్రమం తెలుగులో సహజంగా ఉండేందుకు దూరంగా ఉండవలసిన అంశాలను ముందుంచి, ప్రధాన ఆజ్ఞను చివర ఉంచాం.
