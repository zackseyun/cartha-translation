id: 1TI.6.4
reference: 1 Timothy 6:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τετύφωται, μηδὲν ἐπιστάμενος, ἀλλὰ νοσῶν περὶ ζητήσεις καὶ λογομαχίας, ἐξ ὧν γίνεται φθόνος, ἔρις, βλασφημίαι, ὑπόνοιαι πονηραί,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/004.yaml
  text: he is puffed up[a], understanding nothing, but sick with a craving for controversies and word-battles, from which come envy, strife, slanders, and evil suspicions[c][b],
translation:
  language: te
  text: అతడు గర్వంతో ఉబ్బిపోయినవాడై[a], ఏమీ ఎరుగనివాడై, వాదవివాదాల గురించీ మాటల యుద్ధాల[b] గురించీ రోగగ్రస్తుడై ఉన్నాడు. వీటి నుంచే అసూయ, కలహం, దూషణలు[c], చెడు అనుమానాలు పుడతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అహంకారిగా మారి.’ గ్రీకు పదం అక్షరార్థంగా గర్వంతో ఉబ్బిపోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘మాటల తగాదాలు,’ అంటే పదాల గురించి జరిగే వివాదాలు.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ ‘దూషణలు’ అంటే మనుషులపై చేసే అవమానకరమైన మాటలు. ఈ గ్రీకు పదానికి ఇతర సందర్భాల్లో ‘దేవదూషణలు’ అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τετύφωται
  choice: గర్వంతో ఉబ్బిపోయి
  rationale: పూర్ణకాల రూపం గర్వం వల్ల ఉబ్బిన స్థితిని సూచిస్తుంది. ఈ అనువాదం మూలంలోని రూపకాన్నీ, కొనసాగుతున్న ఫలితస్థితినీ నిలుపుతుంది.
- source_word: μηδὲν ἐπιστάμενος
  choice: ఏమీ గ్రహించకుండా
  rationale: ఇది కేవలం సమాచారం తెలియకపోవడం కంటే విషయాన్ని అవగాహన చేసుకోలేని స్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: νοσῶν
  choice: అనారోగ్యకరమైన మోజు కలిగివున్నాడు
  rationale: νοσέω లోని వ్యాధి రూపకాన్ని ‘అనారోగ్యకరమైన’ అనే పదంతో నిలుపుతూ, ఇక్కడ ఉద్దేశించిన వికృతమైన ఆసక్తిని స్పష్టం చేస్తుంది.
- source_word: περὶ ζητήσεις
  choice: వాదవివాదాల పట్ల
  rationale: ζητήσεις ఇక్కడ ఊహాపోహలతో కూడిన వివాదాలు లేదా తగాదాలను సూచిస్తుంది; ‘వాదవివాదాలు’ సాధారణ పాఠకునికి సహజంగా ఉంటుంది.
- source_word: λογομαχίας
  choice: మాటల యుద్ధాలు
  rationale: λόγος మరియు μάχη కలయికలోని పోరాట భావాన్ని సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: ἐξ ὧν γίνεται
  choice: వీటి నుంచే ... పుడతాయి
  rationale: ముందు చెప్పిన వాదవివాదాలు, మాటల యుద్ధాలే తరువాతి దుర్గుణాలకు మూలమని కారణ-ఫలిత సంబంధాన్ని తెలియజేస్తుంది.
- source_word: φθόνος
  choice: అసూయ
  rationale: ఇతరుల మేలును చూసి కలిగే ద్వేషపూరిత అసూయను నేరుగా తెలియజేస్తుంది.
- source_word: ἔρις
  choice: కలహం
  rationale: విరోధం, తగాదా అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా అందిస్తుంది.
- source_word: βλασφημίαι
  choice: దూషణలు
  rationale: ఈ వ్యక్తుల మధ్య దుర్గుణాల జాబితాలో ఇతరులపై చేసే అవమానకరమైన లేదా అపకీర్తికరమైన మాటలనే సందర్భం సూచిస్తుంది; అయితే గ్రీకు పదానికి ఇతర సందర్భాల్లో దేవదూషణ అనే అర్థం ఉండవచ్చు.
- source_word: ὑπόνοιαι πονηραί
  choice: చెడు అనుమానాలు
  rationale: ὑπόνοιαι లోని అనుమానం/శంక భావాన్నీ, πονηραί లోని నైతిక చెడునీ నేరుగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. గ్రీకు మూలంలోని గర్వంతో ఉబ్బిపోవడం, అనారోగ్యం, మాటల యుద్ధం అనే సజీవ రూపకాలను సాధ్యమైనంతవరకు నిలిపాం.
