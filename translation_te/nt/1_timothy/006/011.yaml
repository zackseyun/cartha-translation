    rationale: Although understandable, it reads as a forced compound. ‘స్థిరమైన సహనం’ naturally conveys steadfast endurance under pressure.
  - severity: low
    issue: The footnote for πραϋπαθία uses ‘సహనశీలత’ as an alternative for ‘forbearance.’
    rationale: This can blur the distinction from ὑπομονή (‘స్థిరమైన సహనం’) in the immediately preceding item. ‘క్షమాశీలత’ more naturally expresses forbearance, and the patient dimension can be retained explicitly in another alternative.
