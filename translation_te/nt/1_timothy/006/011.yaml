id: 1TI.6.11
reference: 1 Timothy 6:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Σὺ δέ, ὦ ἄνθρωπε ⸀θεοῦ, ταῦτα φεῦγε· δίωκε δὲ δικαιοσύνην, εὐσέβειαν, πίστιν, ἀγάπην, ὑπομονήν, ⸀πραϋπαθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/011.yaml
  text: But you[a], man of God, flee these things; but pursue righteousness, godliness, faith, love, steadfastness[c][b], gentleness.
translation:
  language: te
  text: 'కానీ, దేవుని మనిషీ, నీవు వీటినుంచి పారిపో; అయితే నీతిని[a], దైవభక్తిని, విశ్వాసాన్ని[b], ప్రేమను, స్థిరమైన సహనాన్ని, సౌమ్యతను[c] వెంటాడు.


    [a] లేదా, “న్యాయాన్ని.”


    [b] లేదా, “విశ్వసనీయతను” లేదా “నమ్మకాన్ని.”


    [c] ఇక్కడున్న అరుదైన గ్రీకు పదాన్ని “సాత్వికత,” “క్షమాశీలత,” లేదా “ఓర్పుతో కూడిన సౌమ్యత” అని కూడా అనువదించవచ్చు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “న్యాయాన్ని.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “విశ్వసనీయతను” లేదా “నమ్మకాన్ని.”
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడున్న అరుదైన గ్రీకు పదాన్ని “సాత్వికత,” “క్షమాశీలత,” లేదా “ఓర్పుతో కూడిన సౌమ్యత” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δέ
  choice: కాని ... నీవు
  rationale: ముందున్న హెచ్చరికలకు తిమోతిని బలంగా వ్యతిరేకంగా నిలబెట్టే భావాన్ని, అలాగే స్పష్టంగా ఉన్న ద్వితీయ పురుష సర్వనామాన్ని నిలుపుతుంది.
- source_word: ὦ ἄνθρωπε θεοῦ
  choice: దేవుని మనిషీ
  rationale: తిమోతిని ఉద్దేశించిన పురుష ఏకవచన సంబోధనను, బైబిలు సంబంధమైన బిరుదు భావాన్ని సహజమైన తెలుగు సంబోధనలో నిలుపుతుంది.
- source_word: ταῦτα φεῦγε
  choice: వీటినుంచి పారిపో
  rationale: ముందు చెప్పిన దోషాలు, ధనాపేక్ష సంబంధమైన తప్పులవైపు తిరిగి చూపుతూ, సాధారణ ‘విడిచిపెట్టు’ కంటే ఆజ్ఞలోని తీవ్రతను వ్యక్తం చేస్తుంది.
- source_word: δίωκε δὲ
  choice: అయితే ... వెంటాడు
  rationale: చెడునుంచి పారిపోవడం మాత్రమే కాక సద్గుణాలను చురుకుగా అనుసరించాలనే వ్యతిరేక సమతుల్యతను నిలుపుతుంది.
- source_word: δικαιοσύνην
  choice: నీతి
  rationale: నైతికంగా, సంబంధపరంగా సరిగా ఉండడాన్ని సూచించే స్థిరమైన తెలుగు పదం; ‘న్యాయం’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: εὐσέβειαν
  choice: దైవభక్తి
  rationale: దేవునిపట్ల భక్తిపూర్వక గౌరవంతో జీవించే భావాన్ని ఆధునిక, సులభమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πίστιν
  choice: విశ్వాసం
  rationale: ప్రధాన అర్థాన్ని నిలుపుతూ, ఈ సద్గుణాల జాబితాలో సాధ్యమైన ‘విశ్వసనీయత’ మరియు ‘నమ్మకం’ భావాలను పాదసూచికలో ఉంచింది.
- source_word: ἀγάπην
  choice: ప్రేమ
  rationale: మూలపదానికి సహజమైన, విస్తృతంగా అర్థమయ్యే సమానార్థకం.
- source_word: ὑπομονήν
  choice: స్థిరసహనం
  rationale: ఒత్తిడి, కష్టాల మధ్య నిలకడగా సహించే భావాన్ని ‘సహనం’ మాత్రమే అన్నదానికంటే స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: πραϋπαθίαν
  choice: సౌమ్యత
  rationale: అరుదైన పదంలోని మృదుత్వ భావాన్ని చదవడానికి సహజంగా అందిస్తుంది; దానిలోని ఓర్పు, నిగ్రహ ఛాయలను పాదసూచికలో ఇతర సాధ్యమైన అనువాదాలతో భద్రపరుస్తుంది.
theological_decisions:
- issue: ὦ ἄνθρωπε θεοῦ లోని లింగ నిర్దిష్ట సంబోధన
  choice: దేవుని మనిషీ
  alternative: దేవుని వ్యక్తీ
  rationale: మూలంలో తిమోతిని ఉద్దేశించిన పురుష ఏకవచన రూపం ఉంది; దాన్ని లింగతటస్థంగా మార్చకుండా నిలిపింది.
- issue: δικαιοσύνην యొక్క విస్తృత అర్థపరిధి
  choice: నీతి
  alternative: న్యాయం
  rationale: ఈ సద్గుణాల జాబితాలో ‘నీతి’ ప్రధానంగా సరిపోతుంది; అయితే సామాజిక న్యాయ భావాన్ని పూర్తిగా తొలగించకుండా పాదసూచికలో ఉంచింది.
- issue: πίστιν అనే పదం విశ్వాసమా, విశ్వసనీయతా అనే అనిశ్చితి
  choice: విశ్వాసం
  alternative: విశ్వసనీయత లేదా నమ్మకం
  rationale: ఒకే అర్థాన్ని సిద్ధాంతపరంగా ఖరారు చేయకుండా, ప్రధాన పఠనంలో సాధారణ అర్థాన్ని ఇచ్చి ఇతర నిజమైన అవకాశాలను పాదసూచికలో చూపింది.
- issue: అరుదైన πραϋπαθίαν పదంలోని సౌమ్యత-ఓర్పు సమ్మేళనం
  choice: సౌమ్యత
  alternative: సాత్వికత, ఓర్పుతో కూడిన మృదుత్వం, లేదా సహనశీలత
  rationale: పాఠ్యంలో సహజమైన పదాన్ని వాడి, అరుదైన గ్రీకు పదం కలిగిన ఓర్పు మరియు నిగ్రహ ఛాయలను పాదసూచికలో భద్రపరచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; నేరుగా సంబోధించే, గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పారిపో—వెంటాడు’ అనే బలమైన పరస్పర వ్యతిరేక ఆజ్ఞలను నిలిపింది. పాదసూచిక గుర్తులను సంబంధిత పదాల వెంట సరిగా అమర్చింది.
