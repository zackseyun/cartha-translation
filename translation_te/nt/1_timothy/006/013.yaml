id: 1TI.6.13
reference: 1 Timothy 6:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: παραγγέλλω σοι ἐνώπιον τοῦ θεοῦ τοῦ ⸀ζῳογονοῦντος τὰ πάντα καὶ Χριστοῦ Ἰησοῦ τοῦ μαρτυρήσαντος ἐπὶ Ποντίου Πιλάτου τὴν καλὴν ὁμολογίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/013.yaml
  text: I charge you before God[a], who gives life to all things, and Messiah Jesus, who testified to the good confession before Pontius Pilate[c][b],
translation:
  language: te
  text: 'సమస్తానికి జీవం ఇచ్చే దేవుని ఎదుట[a], పొంతి పిలాతు సమక్షంలో మంచి ఒప్పుకోలు చేసిన మెస్సీయ యేసు ఎదుట[b][c], నేను నీకు ఆజ్ఞాపిస్తున్నాను:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సమస్తాన్ని సజీవంగా కాపాడే’ లేదా ‘సమస్తానికి జీవం కలిగించే.’ ζῳογονοῦντος అనే గ్రీకు పదం జీవాన్ని కాపాడడాన్నీ జీవం కలిగించడాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘క్రీస్తు యేసు.’ Χριστός అనే గ్రీకు బిరుదు అర్థాన్ని స్పష్టంగా నిలుపడానికి ప్రధాన పాఠంలో ‘మెస్సీయ’ అని ఇచ్చాం.
    reason: alternative_reading
  - marker: c
    text: ἐπὶ Ποντίου Πιλάτου అనే మాటలను ‘పొంతి పిలాతు కాలంలో’ లేదా ‘పొంతి పిలాతు పాలనలో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγέλλω
  choice: నేను నీకు ఆజ్ఞాపిస్తున్నాను
  rationale: ఈ క్రియ గంభీరమైన ఆదేశాన్ని సూచిస్తుంది. దేవుని, మెస్సీయ యేసు సమక్షంలో ఇచ్చే ఆజ్ఞ అనే సందర్భానికి ఈ రూపం సహజంగా, బరువుగా సరిపోతుంది.
- source_word: ἐνώπιον
  choice: ఎదుట / సమక్షంలో
  rationale: దేవుని విషయంలో ‘ఎదుట’ అని, పిలాతు సమక్షంలో యేసు ఇచ్చిన సాక్ష్యం విషయంలో సహజమైన తెలుగుకోసం ‘సమక్షంలో’ అని వాడాం; రెండూ ప్రత్యక్ష సన్నిధి భావాన్ని నిలుపుతాయి.
- source_word: ζῳογονοῦντος τὰ πάντα
  choice: సమస్తానికి జీవం ఇచ్చే
  rationale: ζῳογονέω జీవం కలిగించడం లేదా జీవంతో నిలిపి ఉంచడం అనే భావాలను కలిగి ఉండగలదు. ప్రధాన పాఠంలో విస్తృతమైన జీవదాత భావాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: Χριστοῦ Ἰησοῦ
  choice: మెస్సీయ యేసు
  rationale: Χριστός ఇక్కడ బిరుదు భావాన్ని నిలుపుతుంది; అందుకే కేవలం పేరులా లిప్యంతరీకరించకుండా దాని బిరుదు భావాన్ని తెలిపే ‘మెస్సీయ’ అని అనువదించాం.
- source_word: μαρτυρήσαντος
  choice: ప్రకటించి సాక్ష్యమిచ్చిన
  rationale: ఈ క్రియ బహిరంగంగా సాక్ష్యం చెప్పడాన్ని సూచిస్తుంది. ὁμολογίαతో కలిసినప్పుడు తెలుగులో సహజంగా ఉండేందుకు ‘ఒప్పుకోలును ప్రకటించి సాక్ష్యమిచ్చిన’ అని ఇచ్చాం.
- source_word: ἐπὶ Ποντίου Πιλάτου
  choice: పొంతి పిలాతు సమక్షంలో
  rationale: ἐπί + షష్ఠీ విభక్తి ‘కాలంలో/పాలనలో’ అని కూడా అర్థం కావచ్చు; అయితే విచారణ సందర్భంలోని సాక్ష్యానికి పిలాతు సమక్షం అనే భావం సందర్భోచితం.
- source_word: τὴν καλὴν ὁμολογίαν
  choice: మంచి ఒప్పుకోలు
  rationale: ὁμολογία బహిరంగ అంగీకారం లేదా ఒప్పుకోలు. చుట్టుపక్కల వచనాల్లో తిమోతికి సంబంధించిన అదే పదబంధంతో ఉన్న అనుసంధానాన్ని నిలుపుతూ καλὴνను ‘మంచి’గా స్పష్టంగా ఉంచాం.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ యేసు
  alternative: క్రీస్తు యేసు
  rationale: ఈ గంభీరమైన సాక్ష్య సందర్భంలో బిరుదు భావం సజీవంగా ఉంది. అయితే తెలుగు క్రైస్తవ వాడుకలో స్థిరమైన ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో నిలిపాం.
- issue: ζῳογονοῦντος యొక్క భావం
  choice: సమస్తానికి జీవం ఇచ్చే
  alternative: సమస్తాన్ని సజీవంగా కాపాడే
  rationale: మూల క్రియ జీవం ప్రసాదించడం, జీవంతో నిలిపి ఉంచడం అనే రెండు భావాలను అనుమతిస్తుంది. ప్రధాన పాఠం ఒక భావాన్ని స్పష్టంగా ఇస్తూ, మరొక నిజమైన అవకాశాన్ని పాదసూచికలో భద్రపరుస్తుంది.
- issue: ἐπὶ Ποντίου Πιλάτου యొక్క సంబంధం
  choice: పొంతి పిలాతు సమక్షంలో
  alternative: పొంతి పిలాతు కాలంలో / పాలనలో
  rationale: యేసు సాక్ష్యమిచ్చిన విచారణ సందర్భం ‘సమక్షంలో’ అనే అర్థానికి మద్దతిస్తుంది; అయినా గ్రీకు విభక్తి నిర్మాణం కాలం లేదా పాలనను సూచించే అవకాశాన్ని కూడా కలిగి ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ఆజ్ఞ స్వరాన్ని నిలిపాం. వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున చివర ద్విబిందువు ఉంచాం. ‘ఒప్పుకోలు’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండగా, బహిరంగ విశ్వాస ప్రకటన భావాన్నీ మోస్తుంది.
