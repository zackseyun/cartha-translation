revisions:
- from: 'సమస్తానికి జీవం ఇచ్చే దేవుని ఎదుట[a], పొంతి పిలాతు సమక్షంలో మంచి ఒప్పుకోలును ప్రకటించి సాక్ష్యమిచ్చిన మెస్సీయ యేసు ఎదుట[b][c], నేను నీకు ఆజ్ఞాపిస్తున్నాను:'
  to: 'సమస్తానికి జీవం ఇచ్చే దేవుని ఎదుట[a], పొంతి పిలాతు సమక్షంలో మంచి ఒప్పుకోలు చేసిన మెస్సీయ యేసు ఎదుట[b][c], నేను నీకు ఆజ్ఞాపిస్తున్నాను:'
