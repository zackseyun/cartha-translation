id: 1TI.2.5
reference: 1 Timothy 2:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἷς γὰρ θεός, εἷς καὶ μεσίτης θεοῦ καὶ ἀνθρώπων ἄνθρωπος Χριστὸς Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/005.yaml
  text: For there is one God[a], and one mediator between God and men, the man Messiah Jesus[c][b],
translation:
  language: te
  text: ఎందుకంటే దేవుడు ఒక్కడే; దేవునికీ మనుషులకూ మధ్యవర్తి కూడా ఒక్కడే—మనిషి, మెస్సీయ యేసు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనిషి, క్రీస్తు యేసు.” గ్రీకు Χριστός అంటే “మెస్సీయ,” అనగా “అభిషిక్తుడు.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἷς
  choice: ఒక్కడే
  rationale: రెండు చోట్లా ఒకే విధంగా అనువదించి, ‘ఒక్కడే దేవుడు—ఒక్కడే మధ్యవర్తి’ అనే బలమైన సమాంతర నిర్మాణాన్ని నిలిపింది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందరి వాక్యాలతో ఉన్న వివరణాత్మక సంబంధాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: μεσίτης
  choice: మధ్యవర్తి
  rationale: రెండు పక్షాల మధ్య నిలిచి సంబంధం లేదా సమాధానం కలిగించే వ్యక్తిని సూచించే ఖచ్చితమైన, స్థిరమైన తెలుగు పదం.
- source_word: θεοῦ καὶ ἀνθρώπων
  choice: దేవునికీ మనుషులకూ
  rationale: గ్రీకులో షష్ఠీ విభక్తి ఉన్నప్పటికీ, ‘మధ్యవర్తి’తో తెలుగు వాడుకలో ‘దేవునికీ మనుషులకూ’ అని చెప్పడం సహజం; ‘మధ్య’ అనే భావం వాక్య నిర్మాణంలో స్పష్టపరచబడింది.
- source_word: ἄνθρωπος
  choice: మనిషియైన
  rationale: యేసు నిజమైన మానవుడని వచనం ఉద్దేశపూర్వకంగా చెప్పే విషయాన్ని నిలుపుతూ, తరువాతి పేరుతో సహజమైన విశేషణ సంబంధాన్ని ఏర్పరుస్తుంది.
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός యేసు యొక్క బిరుదుగా పనిచేస్తున్నందున దాని అర్థాన్ని అనువదించింది; సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదటిప్పణిలో ఇచ్చింది.
- source_word: Ἰησοῦς
  choice: యేసు
  rationale: వ్యక్తినామానికి ప్రామాణిక తెలుగు రూపం.
theological_decisions:
- issue: ἀνθρώπων / ἄνθρωπος మధ్య పదసంబంధం
  choice: మనుషులకూ ... మనిషియైన
  alternative: మానవులకూ ... మానవుడైన
  rationale: బహువచన మానవజాతికీ, ఏకవచనంగా యేసు మానవత్వానికీ మధ్య ఉన్న మూలపాఠంలోని ఉద్దేశపూర్వక సంబంధాన్ని సాధ్యమైనంత పారదర్శకంగా నిలుపుతుంది.
- issue: Χριστόςను బిరుదుగా అనువదించడం
  choice: మెస్సీయ యేసు
  alternative: క్రీస్తు యేసు
  rationale: Χριστός ఇక్కడ పేరులో భాగంలా మాత్రమే కాక యేసును అభిషిక్తుడైన మెస్సీయగా గుర్తించే బిరుదుగా పనిచేస్తుంది.
- issue: ἄνθρωπος Χριστὸς Ἰησοῦς యొక్క క్రీస్తు సంబంధమైన భావం
  choice: మనిషియైన మెస్సీయ యేసు
  alternative: మానవుడైన క్రీస్తు యేసు
  rationale: వచనం స్పష్టంగా నొక్కిచెప్పే యేసు మానవత్వాన్ని అనువాదం నిలుపుతుంది; అదే సమయంలో ఆయన దైవత్వాన్ని నిరాకరించే భావాన్ని చేర్చదు. మూలపాఠంలోని వేదాంతపరమైన ఉద్వేగాన్ని పరిష్కరించకుండా అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే నిర్మాణం. ‘ఒక్కడే’ అనే పునరుక్తి మూలపాఠంలోని సమాంతర బలాన్ని కాపాడుతుంది; దీర్ఘరేఖ తరువాతి పదబంధాన్ని మధ్యవర్తి ఎవరో వివరించే సమానాధికార పదబంధంగా చూపుతుంది.
