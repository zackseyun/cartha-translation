    issue: The placement of ‘ఆత్మనిగ్రహంతో’ at the end is mildly awkward.
    rationale: Greek μετὰ σωφροσύνης qualifies the conditional continuation alongside faith, love, and holiness. In Telugu, fronting it before the coordinated ‘విశ్వాసంలోను, ప్రేమలోను, పరిశుద్ధతలోను’ gives a clearer and more natural reading without adding interpretation.
