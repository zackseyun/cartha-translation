id: 1TI.2.15
reference: 1 Timothy 2:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: σωθήσεται δὲ διὰ τῆς τεκνογονίας, ἐὰν μείνωσιν ἐν πίστει καὶ ἀγάπῃ καὶ ἁγιασμῷ μετὰ σωφροσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/015.yaml
  text: Yet she will be saved through childbearing[c][b][a], if they continue in faith and love and holiness with self-control.
translation:
  language: te
  text: అయితే ఆమె పిల్లలను కనడం ద్వారా[a] రక్షించబడుతుంది[c]—వారు ఆత్మనిగ్రహంతో విశ్వాసంలోను[b], ప్రేమలోను, పరిశుద్ధతలోను కొనసాగితే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ శిశుజననం ద్వారా.’ కొందరు దీన్ని ఒక నిర్దిష్ట జననానికి—బహుశా మెస్సీయుని జననానికి—సూచనగా అర్థం చేసుకుంటారు; అయితే ఈ మాటను సాధారణంగా ‘పిల్లలను కనడం ద్వారా’ అని కూడా చదవవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ఇక్కడ ‘విశ్వాసం’ అనే పదానికి ‘విశ్వసనీయత’ అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకులో ‘ఆమె రక్షించబడుతుంది’ అనే ఏకవచనం నుంచి ‘వారు కొనసాగితే’ అనే బహువచనానికి మార్పు ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: σωθήσεται
  choice: రక్షించబడుతుంది
  rationale: σῴζω అనే క్రియకు పౌలు రచనల్లో సాధారణంగా ఉన్న ‘రక్షించు’ అనే భావాన్ని నిలుపుతుంది. కేవలం శారీరక భద్రతకు పరిమితం చేసే ‘క్షేమంగా ఉంటుంది’ వంటి అనువాదాన్ని నివారిస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి మాటతో స్వల్ప వ్యత్యాసాన్ని లేదా తదుపరి భావవికాసాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: διὰ τῆς τεκνογονίας
  choice: పిల్లలను కనడం ద్వారా
  rationale: τεκνογονία సాధారణంగా పిల్లలను కనడాన్ని సూచిస్తుంది. గ్రీకు నిర్దిష్ట ఉపపదం సాధారణ వర్గార్థంలోనూ, ఒక నిర్దిష్ట శిశుజననాన్ని సూచించేదిగానూ అర్థం కావచ్చు; ప్రధాన పాఠ్యంలో సహజమైన సాధారణ అర్థాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἐὰν
  choice: కొనసాగితే
  rationale: ἐάν ప్రవేశపెట్టే షరతును తెలుగులో క్రియకు జోడించిన ‘-తే’ రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μείνωσιν
  choice: కొనసాగితే
  rationale: μένω ఇక్కడ ఒక స్థితిలో నిలిచి కొనసాగడాన్ని సూచిస్తుంది; ‘కొనసాగితే’ నైతిక స్థిరత్వ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἐν πίστει
  choice: విశ్వాసంలో
  rationale: πίστιςకు సాధారణమైన ‘విశ్వాసం’ అనే అనువాదాన్ని ఉంచుతుంది; ‘విశ్వసనీయత’ అనే భావసాధ్యతను పాదసూచికలో భద్రపరుస్తుంది.
- source_word: ἀγάπῃ
  choice: ప్రేమలో
  rationale: ἀγάπηకు సహజమైన, ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: ἁγιασμῷ
  choice: పరిశుద్ధతలో
  rationale: ἁγιασμός సూచించే పవిత్ర జీవనస్థితిని సాంకేతిక పదజాలం లేకుండా, గుణాల జాబితాకు తగిన విధంగా తెలియజేస్తుంది.
- source_word: μετὰ σωφροσύνης
  choice: ఆత్మనిగ్రహంతో
  rationale: σωφροσύνηలోని స్వీయనియంత్రణ, వివేకపూర్వక మితవర్తన భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: ‘ఆమె రక్షించబడుతుంది’ అనే ఏకవచనం నుంచి ‘వారు కొనసాగితే’ అనే బహువచనానికి మార్పు
  choice: మూలంలోని ఏకవచన–బహువచన మార్పును యథాతథంగా ఉంచడం
  alternative: రెండింటినీ స్త్రీలను సాధారణంగా సూచించేవిగా భావించి ‘స్త్రీలు ... వారు’ అని సమన్వయపరచడం; లేదా ‘ఆమె’ను హవ్వగా, ‘వారు’ను సాధారణంగా స్త్రీలుగా వివరించడం
  rationale: గ్రీకు పాఠ్యమే ఏకవచనం నుంచి బహువచనానికి మారుతుంది. దాన్ని సరళీకరించడం మూలంలోని ముఖ్యమైన వ్యాఖ్యాన ఉద్రిక్తతను దాచేస్తుంది.
- issue: ‘పిల్లలను కనడం ద్వారా రక్షించబడుతుంది’ అనే మాట అర్థం
  choice: రక్షణ స్వరూపాన్ని లేదా ‘ద్వారా’ అనే సంబంధాన్ని మరింత నిర్దిష్టం చేయకుండా మూలంలోని అస్పష్టతను నిలుపడం
  alternative: ప్రసవ సమయంలో క్షేమంగా కాపాడబడుతుంది; మాతృత్వాన్ని స్వీకరించడం ద్వారా రక్షించబడుతుంది; మెస్సీయ జననం ద్వారా రక్షించబడుతుంది
  rationale: గ్రీకు వాక్యం రక్షణను శారీరక భద్రతగా పరిమితం చేయదు; అలాగే ఒక నిర్దిష్ట మెస్సీయ జననాన్ని స్పష్టంగా గుర్తించదు. అందువల్ల వివాదాస్పద వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. మూలంలోని షరతు, ఏకవచన–బహువచన మార్పు, అలాగే క్లిష్టమైన రక్షణ–శిశుజనన సంబంధం పరిష్కరించకుండా నిలుపబడ్డాయి.
