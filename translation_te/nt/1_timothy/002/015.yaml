  terminology: ‘రక్షించబడుతుంది,’ ‘విశ్వాసం,’ ‘ప్రేమ,’ ‘పరిశుద్ధత,’ and ‘ఆత్మనిగ్రహం’ are suitable modern-standard Telugu renderings. ‘పిల్లలను కనడం’ appropriately preserves the generic sense of τεκνογονία without resolving the disputed expression.
  issues:
