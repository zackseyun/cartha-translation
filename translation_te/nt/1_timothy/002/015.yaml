  verdict: revise
  source_fidelity: The draft accurately renders the future passive ‘will be saved,’ retains the deliberately difficult ‘through childbearing,’ and preserves the Greek singular-to-plural shift. The conditional force and the virtue terms are also represented faithfully. A minor syntactic revision improves how ‘with self-control’ relates to the whole persevering-in-virtues clause.
