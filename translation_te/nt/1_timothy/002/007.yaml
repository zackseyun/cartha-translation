id: 1TI.2.7
reference: 1 Timothy 2:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος— ἀλήθειαν ⸀λέγω, οὐ ψεύδομαι— διδάσκαλος ἐθνῶν ἐν πίστει καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/007.yaml
  text: For this I was appointed a herald and an apostle—I am telling the truth[c][b][a]; I am not lying—a teacher of the Gentiles in faith and truth.
translation:
  language: te
  text: దీనికోసం[a] నేను ప్రకటకునిగా, అపొస్తలునిగా నియమించబడ్డాను—నేను నిజం చెబుతున్నాను, అబద్ధం చెప్పడం లేదు—విశ్వాసంలోను సత్యంలోను[c] యూదేతర ప్రజల[b] బోధకునిగా నియమించబడ్డాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేనికోసమైతే నేను నియమించబడ్డానో.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘జనాల బోధకుడు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘విశ్వసనీయతలోను సత్యంలోను.’
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς ὃ
  choice: దీనికోసమే
  rationale: ఈ మాట ముందున్న రక్షణ ఉద్దేశాన్ని లేదా దాని ప్రకటనను సూచిస్తుంది. ‘దీనికోసమే’ ఉద్దేశ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐτέθην
  choice: నియమించబడ్డాను
  rationale: ఇక్కడ τίθημι యొక్క కర్మణి రూపం భౌతికంగా ఉంచబడటాన్ని కాక, ఒక సేవకు నియమించబడటాన్ని సూచిస్తుంది.
- source_word: κῆρυξ
  choice: ప్రకటనకర్త
  rationale: ఇతరుని తరఫున బహిరంగంగా ప్రకటించే అధికారిక ప్రతినిధి భావాన్ని ఇది తెలియజేస్తుంది; కేవలం సంప్రదాయపరమైన ‘ప్రసంగికుడు’ అనే భావానికి పరిమితం చేయదు.
- source_word: ἀπόστολος
  choice: అపొస్తలుడు
  rationale: పౌలు తన సేవా అధికారాన్ని సూచించడానికి వాడే గుర్తింపు పొందిన బిరుదుకు ఇది ప్రామాణిక తెలుగు రూపం.
- source_word: ἀλήθειαν λέγω, οὐ ψεύδομαι
  choice: నేను నిజం చెబుతున్నాను, అబద్ధం చెప్పడం లేదు
  rationale: మూలంలోని బలమైన ద్వంద్వ ధృవీకరణను సహజమైన ఆధునిక తెలుగులో యథాతథంగా ఉంచుతుంది.
- source_word: διδάσκαλος ἐθνῶν
  choice: యూదేతర ప్రజలకు బోధకుడు
  rationale: పౌలు వాడుకలో ἔθνη సాధారణంగా యూదులు కాని ప్రజలను సూచిస్తుంది. ‘యూదేతర ప్రజలు’ నేటి సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: ἐν πίστει καὶ ἀληθείᾳ
  choice: విశ్వాసంలోను సత్యంలోను
  rationale: ἐν యొక్క పరిధి లేదా విధాన భావాన్ని అతిగా నిర్ణయించకుండా నిలుపుతుంది; πίστιςకు ప్రధాన అర్థంగా ‘విశ్వాసం’ను ఉంచుతుంది.
theological_decisions:
- issue: పౌలు నియామకంలో ἐθνῶν యొక్క అర్థం
  choice: యూదేతర ప్రజలు
  alternative: జనాలు / దేశాల ప్రజలు
  rationale: పౌలు సందర్భంలో ఈ పదం యూదులు కానివారిని సూచించడం అత్యంత సహజం; అయినా మూలపదానికి విస్తృతంగా ‘జనాలు’ అనే అర్థం కూడా ఉంది.
- issue: ἐν πίστει καὶ ἀληθείᾳలో πίστις యొక్క అర్థం
  choice: విశ్వాసం
  alternative: విశ్వసనీయత / నమ్మకత్వం
  rationale: ‘విశ్వాసం’ ఇక్కడ తగిన ప్రధాన అర్థం. అయితే πίστιςకు గుణలక్షణంగా ‘విశ్వసనీయత’ అనే అర్థం కూడా సాధ్యమైనందున దాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి వాడబడింది. ‘అన్యజనులు’ అనే సంప్రదాయ పదానికి బదులు స్పష్టమైన ‘యూదేతర ప్రజలు’ వాడబడింది. గ్రీకు వాక్యంలో ఒక్క ἐτέθην మూడు సేవా పాత్రలకూ వర్తిస్తుంది; తెలుగులో దీర్ఘ మధ్యవాక్య విరామం వల్ల సంబంధం అస్పష్టంకాకుండా చివర ‘నియమించబడ్డాను’ను పునరుక్తి చేశాం.
