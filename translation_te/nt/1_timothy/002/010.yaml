  yaml_path: translation/nt/1_timothy/002/010.yaml
  text: 'but with what is proper for women professing godliness: good works[a][b][c].'
translation:
  language: te
  text: కాని దైవభక్తిని[b] ప్రకటించుకునే స్త్రీలకు తగినదైన[a] మంచి పనులతో అలంకరించుకోవాలి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సముచితమైనది’ లేదా ‘సరిపోయేది.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దేవునిపట్ల భక్తిని.’
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘మంచి పనుల ద్వారా’; సందర్భంలో మంచి పనులే తగిన అలంకరణ అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: కాని
  rationale: మునుపటి వచనంలోని బాహ్య అలంకరణకు విరుద్ధంగా తగిన అలంకరణను సూచించే వ్యతిరేక సంధిగా ఉంది.
- source_word: ὃ πρέπει
  choice: తగినట్లుగా
  rationale: నైతికంగా సముచితమైనది, సరిపోయేది అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γυναιξὶν
  choice: స్త్రీలకు
  rationale: ఈ సందర్భంలో సాధారణంగా స్త్రీలను సూచిస్తుంది; కేవలం భార్యలకు మాత్రమే పరిమితం చేయదు.
- source_word: ἐπαγγελλομέναις
  choice: ప్రకటించుకునే
  rationale: తాము దైవభక్తిగలవారమని చెప్పుకోవడం లేదా బహిరంగంగా ఒప్పుకోవడం అనే భావాన్ని ఇస్తుంది; ప్రమాణం చేయడం అనే అధిక భావాన్ని చేర్చదు.
- source_word: θεοσέβειαν
  choice: దైవభక్తిని
  rationale: దేవునిపట్ల భక్తి, గౌరవం కలిగిన జీవన వైఖరిని సంక్షిప్తంగా, సుపరిచితంగా తెలియజేస్తుంది.
- source_word: δι’ ἔργων ἀγαθῶν
  choice: మంచి పనుల ద్వారా
  rationale: διά + షష్ఠీ విభక్తి తెలిపే సాధనం లేదా విధాన భావాన్ని నిలుపుతుంది; ముందు వచనంలోని అలంకరణ భావంతో అనుసంధానించేందుకు సందర్భం నుంచి ‘అలంకరించుకోవాలి’ పూరించబడింది.
theological_decisions:
- issue: మంచి పనులకు దైవభక్తి ప్రకటనతో ఉన్న సంబంధం
  choice: మంచి పనులు దైవభక్తిని ప్రకటించుకునే స్త్రీలకు తగిన అలంకరణ లేదా బాహ్య వ్యక్తీకరణగా చూపబడ్డాయి.
  alternative: మంచి పనులు దేవుని అంగీకారాన్ని లేదా రక్షణను సంపాదించే ఆధారమని చదవడం.
  rationale: వాక్యనిర్మాణం బాహ్య అలంకరణకు మంచి పనులను విరుద్ధంగా ఉంచుతుంది; రక్షణలో పనుల పాత్ర గురించి ఈ వచనం చేయని సిద్ధాంత ప్రకటనను అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంఘ పఠనానికి తగిన గౌరవప్రదమైన, సహజమైన శైలి. గ్రీకు వాక్యం ముందటి వచనంపై ఆధారపడిన ఖండవాక్యం కావడంతో, తెలుగులో అర్థస్పష్టత కోసం ‘అలంకరించుకోవాలి’ని సందర్భానుసారంగా పూరించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
