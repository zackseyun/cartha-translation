    text: లేదా, ‘రూపుదిద్దబడ్డాడు/రూపుదిద్దబడింది.’ ఈ క్రియ ఆదికాండంలోని సృష్టి వృత్తాంతంలో దేవుడు మనిషికి రూపమిచ్చినట్లు చెప్పే భాషను ప్రతిధ్వనిస్తుంది.
