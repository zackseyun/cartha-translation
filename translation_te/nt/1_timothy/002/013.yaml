lexical_decisions:
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న ఉపదేశానికి కారణాన్ని లేదా ఆధారాన్ని పరిచయం చేస్తుంది; వివరణాత్మక బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: Ἀδὰμ
  choice: ఆదాము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: πρῶτος
  choice: మొదట
  rationale: హవ్వ రూపొందించబడటానికి ముందు జరిగిన కాలక్రమాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: ἐπλάσθη
  choice: రూపొందించబడ్డాడు
  rationale: πλάσσω అనే క్రియలోని రూపమిచ్చి చేయడం అనే భావాన్ని, అలాగే ఆదికాండంలోని నిర్మాణ భాషతో ఉన్న ప్రతిధ్వనిని నిలుపుతుంది; సాధారణమైన ‘సృష్టించబడ్డాడు’ కంటే నిర్దిష్టమైనది.
- source_word: εἶτα
  choice: తరువాత
  rationale: తదుపరి కాలక్రమాన్ని సరళంగా, సహజంగా తెలియజేస్తుంది.
- source_word: Εὕα
  choice: హవ్వ
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
theological_decisions:
- issue: సంఘ సంబంధమైన వివాద సందర్భంలో ఆదికాండ సృష్టి క్రమంతో ఈ వాక్యానికి ఉన్న సంబంధం
  choice: ఆదాము మొదట రూపొందించబడ్డాడు; తరువాత హవ్వ అని కాలక్రమాన్ని మాత్రమే పేర్కొనడం.
  alternative: అధికారం లేదా పాత్రల భేదాల గురించిన భావార్థాన్ని అనువాదంలోనే చేర్చడం.
  rationale: గ్రీకు వాక్యం స్వయంగా రూపకల్పన క్రమాన్నే చెబుతుంది; ఆ క్రమం నుంచి తీసుకునే వేదాంత నిర్ధారణను ఈ వచనంలో స్పష్టంగా చెప్పదు. అందువల్ల అనువాదం అదనపు సిద్ధాంత నిర్ణయాన్ని చేర్చకుండా అసలు వాక్యంలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘రూపొందించబడ్డాడు’ మూలంలోని దైవకర్మణి రూపాన్ని, రూపమిచ్చే భావాన్ని నిలుపుతుంది; వచనం చెప్పని అధికార లేదా పాత్ర సంబంధమైన నిర్ధారణ ఏదీ చేర్చలేదు.
