id: 1TI.2.1
reference: 1 Timothy 2:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν πρῶτον πάντων ποιεῖσθαι δεήσεις, προσευχάς, ἐντεύξεις, εὐχαριστίας, ὑπὲρ πάντων ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/001.yaml
  text: Therefore[a], first of all, I urge that petitions, prayers, intercessions, and thanksgivings be made for all people[c][b],
translation:
  language: te
  text: కాబట్టి, అన్నిటికంటే ముందుగా, ప్రజలందరి[b] కోసం[a] విజ్ఞాపనలు, ప్రార్థనలు, మధ్యవర్తిత్వ ప్రార్థనలు, కృతజ్ఞతలు చేయాలని నేను వేడుకుంటున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కోసం” అనే మాటను “పక్షాన” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ప్రజలందరి” అని అనువదించిన గ్రీకు పదబంధం పురుషులను మాత్రమే కాక, మానవులను సాధారణంగా సూచిస్తుంది. కొందరు దీన్ని “అన్ని రకాల ప్రజలు” అని అర్థం చేసుకుంటారు; అయితే గ్రీకు వచనం నేరుగా “ప్రజలందరు” అని చెబుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: నేను వేడుకుంటున్నాను
  rationale: ఇది గంభీరమైన, హృదయపూర్వకమైన అపొస్తలీయ విజ్ఞప్తిని తెలియజేస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండి, కేవలం సాధారణ అభ్యర్థనకన్నా బలమైన భావాన్ని ఇస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి చర్చతో ఉన్న తార్కిక సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πρῶτον πάντων
  choice: అన్నిటికంటే ముందుగా
  rationale: ఇది కేవలం జాబితాలో మొదటి అంశం అనే భావం కంటే ప్రాధాన్యాన్ని నొక్కిచెబుతుంది.
- source_word: ποιεῖσθαι
  choice: చేయాలని
  rationale: నాలుగు ప్రార్థనా సంబంధ పదాలన్నిటినీ సహజంగా నియంత్రించే విస్తృత తెలుగు ప్రయోగం; గ్రీకు infinitive నిర్మాణాన్ని తెలుగులో సహజ వాక్యనిర్మాణంగా మార్చుతుంది.
- source_word: δεήσεις
  choice: విజ్ఞాపనలు
  rationale: అవసరం నుండి పుట్టే మనవులు లేదా వేడుకోళ్ల భావాన్ని గౌరవప్రదమైన, అర్థమయ్యే తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: προσευχάς
  choice: ప్రార్థనలు
  rationale: ప్రార్థనకు వాడే సాధారణ గ్రీకు పదానికి నేరమైన, సహజమైన సమానార్థకం.
- source_word: ἐντεύξεις
  choice: మధ్యవర్తిత్వ ప్రార్థనలు
  rationale: ఈ సందర్భంలో ఇతరుల పక్షాన చేసే ప్రార్థనల భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ఒంటరిగా ‘మధ్యవర్తిత్వాలు’ అనడం ఆధునిక తెలుగులో అసహజంగా ఉంటుంది.
- source_word: εὐχαριστίας
  choice: కృతజ్ఞతాస్తుతులు
  rationale: దేవునికి కృతజ్ఞత తెలియజేసే ప్రార్థనా వ్యక్తీకరణలను సూచిస్తూ, జాబితాలోని ఇతర పదాల నుండి భేదాన్ని నిలుపుతుంది.
- source_word: ὑπὲρ
  choice: కోసం
  rationale: లబ్ధి లేదా పక్షాన అనే భావాన్ని సందర్భానుకూలంగా, సహజంగా తెలియజేస్తుంది; ‘పక్షాన’ అనే విస్తృత భావాన్ని పాదసూచికలో ఉంచారు.
- source_word: πάντων ἀνθρώπων
  choice: ప్రజలందరి
  rationale: ἄνθρωπος ఇక్కడ పురుషులను మాత్రమే కాక మానవులను సాధారణంగా సూచిస్తుంది; ‘ప్రజలందరి’ ఆధునిక తెలుగులో సమగ్రంగా, సహజంగా ఉంది.
theological_decisions:
- issue: πάντων ἀνθρώπων యొక్క పరిధి
  choice: ప్రజలందరి
  alternative: అన్ని రకాల ప్రజల
  rationale: గ్రీకు పదబంధం నేరుగా ‘ప్రజలందరి’ అని చెబుతుంది. ప్రతి వ్యక్తినా లేక అన్ని వర్గాలవారా అనే వేదాంత చర్చను వచనంలోనే సంకుచితం చేయకుండా, అసలు పదబంధంలోని విస్తృతతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే ప్రార్థనా సందర్భానికి తగిన గౌరవప్రదమైన శైలి. గ్రీకు జాబితాలోని నాలుగు వేర్వేరు పదాల భేదాన్ని సాధ్యమైనంతవరకు నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన వచనంలో ఉన్నాయి.
