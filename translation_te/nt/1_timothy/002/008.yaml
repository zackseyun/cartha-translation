id: 1TI.2.8
reference: 1 Timothy 2:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Βούλομαι οὖν προσεύχεσθαι τοὺς ἄνδρας ἐν παντὶ τόπῳ, ἐπαίροντας ὁσίους χεῖρας χωρὶς ὀργῆς καὶ ⸀διαλογισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/008.yaml
  text: Therefore I want the men in every place to pray[a], lifting up holy hands without anger or quarreling.
translation:
  language: te
  text: కాబట్టి, ప్రతి చోట పురుషులు కోపం గానీ వాదులాట గానీ లేకుండా పవిత్రమైన చేతులు పైకెత్తి ప్రార్థించాలని నేను కోరుతున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కోపం గానీ సందేహం గానీ లేకుండా.” గ్రీకు పదం అంతరంగ ఆలోచన లేదా సందేహాన్ని సూచించగలదు; అయితే ఇక్కడ అది సంఘంలో కలహపూరిత వాదనను సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βούλομαι
  choice: నేను కోరుతున్నాను
  rationale: ఈ పదం సంకల్పం లేదా కోరికను వ్యక్తపరుస్తుంది. ‘కోరుతున్నాను’ ఆధునిక తెలుగులో సహజంగా ఉండి, పౌలు ఇచ్చే నిర్దేశంలోని బలాన్ని నిలుపుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందున్న చర్చనుంచి వచ్చే కొనసాగింపు లేదా నిర్ధారణను సూచిస్తుంది.
- source_word: προσεύχεσθαι
  choice: ప్రార్థించాలని
  rationale: βούλομαι మీద ఆధారపడిన క్రియారూపాన్ని తెలుగులో సహజమైన ఉద్దేశార్థక నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: τοὺς ἄνδρας
  choice: పురుషులు
  rationale: ఇక్కడ ἀνήρ సాధారణంగా ప్రజలందరినీ కాక పురుషులనే సూచిస్తుంది; చుట్టుపక్కల సందర్భంలోని లింగ-నిర్దిష్ట సూచనలకు ఇది సరిపోతుంది.
- source_word: ἐν παντὶ τόπῳ
  choice: ప్రతి చోట
  rationale: మూలంలోని పంపిణీ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐπαίροντας
  choice: పైకెత్తి
  rationale: ప్రార్థనతో కూడిన భంగిమను తెలుగులో సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ὁσίους χεῖρας
  choice: పవిత్రమైన చేతులు
  rationale: దేవునికి అంగీకారమైన పవిత్రత లేదా భక్తిపూర్వక ప్రవర్తన అనే ὅσιος భావాన్ని నేరుగా నిలుపుతుంది; ‘శుద్ధమైన’ అనడం వేరొక గ్రీకు విశేషణపు భావాన్ని ముందుకు తేవచ్చు.
- source_word: χωρὶς
  choice: లేకుండా
  rationale: ఏదో ఒకటి లేకపోవడాన్ని సూచించే సాధారణ అర్థాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ὀργῆς
  choice: కోపం
  rationale: వ్యక్తుల మధ్య సందర్భానికి సరిపోయే స్పష్టమైన ఆధునిక పదం.
- source_word: διαλογισμοῦ
  choice: వాదులాట
  rationale: ఈ పదం తర్కం, వివాదం లేదా అంతరంగ సందేహాన్ని సూచించగలదు. ఇక్కడ ‘కోపం’తో జతగా, సమూహ ప్రార్థన సందర్భంలో ఉండటంవల్ల కలహపూరిత వాదన అనే భావం ఎక్కువగా సరిపోతుంది; ‘సందేహం’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: τοὺς ἄνδρας యొక్క లింగ-నిర్దిష్ట సూచన
  choice: పురుషులు
  alternative: ప్రజలు / అందరూ / భర్తలు
  rationale: ἄνδρας అనే పుంలింగ నామవాచకం ఇక్కడ నిర్దిష్టంగా పురుషులను సూచిస్తుంది. వెంటనే వచ్చే సందర్భంలో పురుషులు, స్త్రీలకు వేర్వేరు సూచనలు ఉన్నందున సాధారణీకరించడం మూలంలోని ప్రత్యేకతను తగ్గిస్తుంది.
- issue: ప్రార్థనా సందర్భంలో διαλογισμοῦ అర్థం
  choice: వాదులాట
  alternative: వివాదం / సందేహం
  rationale: ‘కోపం’తో జతచేయబడినందున కలహపూరిత వివాదం అనే సామూహిక, సంబంధపరమైన అర్థం ఎక్కువగా సంభావ్యమైనది. అయినా ‘సందేహం’ అనే అంతరంగ అర్థం పదపరంగా సాధ్యమే కాబట్టి దానిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ప్రతి చోట,’ ‘చేతులు పైకెత్తి’ వంటి పదబంధాలు మూల నిర్మాణాన్ని స్పష్టంగా ఉంచుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా ఉన్నాయి.
