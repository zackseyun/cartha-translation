id: 1TI.2.9
reference: 1 Timothy 2:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡσαύτως ⸀καὶ γυναῖκας ἐν καταστολῇ κοσμίῳ μετὰ αἰδοῦς καὶ σωφροσύνης κοσμεῖν ἑαυτάς, μὴ ἐν πλέγμασιν ⸀καὶ ⸀χρυσίῳ ἢ μαργαρίταις ἢ ἱματισμῷ πολυτελεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/009.yaml
  text: Likewise also[a], women are to adorn themselves in respectable clothing, with modesty and self-control, not with braided hair and gold or pearls or expensive clothing[b],
translation:
  language: te
  text: 'అలాగే స్త్రీలు కూడా మర్యాదకరమైన వస్త్రధారణతో[a], మర్యాదాభావంతోనూ ఆత్మనిగ్రహంతోనూ తమను తాము అలంకరించుకోవాలి; జడలతోగానీ, బంగారంతోగానీ, ముత్యాలతోగానీ, ఖరీదైన వస్త్రాలతోగానీ కాదు.[b]


    [a] లేదా “తగిన వస్త్రధారణతో” లేదా “నిరాడంబరమైన దుస్తులతో.”


    [b] “జడలు, బంగారం, ముత్యాలు, ఖరీదైన వస్త్రాలు” అనే మాటలు, ప్రతి సందర్భంలో జడలు, ఆభరణాలు లేదా ఖరీదైన దుస్తులన్నిటినీ నిషేధించడం కంటే, ఆడంబరమైన అలంకరణను సూచించే అవకాశం ఎక్కువ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తగిన వస్త్రధారణతో” లేదా “నిరాడంబరమైన దుస్తులతో.”
    reason: lexical_alternative
  - marker: b
    text: “జడలు, బంగారం, ముత్యాలు, ఖరీదైన వస్త్రాలు” అనే మాటలు, ప్రతి సందర్భంలో జడలు, ఆభరణాలు లేదా ఖరీదైన దుస్తులన్నిటినీ నిషేధించడం కంటే, ఆడంబరమైన అలంకరణను సూచించే అవకాశం ఎక్కువ.
    reason: cultural_note
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: అలాగే ... కూడా
  rationale: ముందున్న ఉపదేశంతో సంబంధాన్ని, గ్రీకులోని ὡσαύτως మరియు καί తెలిపే అదనపు అనుసంధానాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: γυναῖκας
  choice: స్త్రీలు
  rationale: γυνή అనే పదానికి ‘స్త్రీ’ లేదా ‘భార్య’ అనే అర్థాలు ఉండగలవు; అయితే ఇక్కడ వివాహితులకే పరిమితం చేసే సందర్భ సూచనలు లేనందున సాధారణ అర్థమైన ‘స్త్రీలు’ తగినది.
- source_word: ἐν καταστολῇ κοσμίῳ
  choice: మర్యాదకరమైన వస్త్రధారణతో
  rationale: καταστολή వస్త్రధారణను, κόσμιος తగినదనాన్ని, క్రమబద్ధతను, గౌరవప్రదతను సూచిస్తాయి. ఈ పదబంధం రెండింటినీ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μετὰ αἰδοῦς
  choice: అణకువతో
  rationale: αἰδώς అనుచిత ప్రవర్తనను నిరోధించే మర్యాదాభావం, బిడియం లేదా సంయమనాన్ని సూచిస్తుంది. వస్త్రధారణ సందర్భంలో ‘అణకువ’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: σωφροσύνης
  choice: ఆత్మనిగ్రహంతో
  rationale: σωφροσύνη వివేకంతో కూడిన సంయమనాన్ని, తనను అదుపులో ఉంచుకోవడాన్ని సూచిస్తుంది. ‘ఆత్మనిగ్రహం’ ఈ నైతిక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: κοσμεῖν ἑαυτάς
  choice: తమను తాము అలంకరించుకోవాలి
  rationale: కొస్మేయిన్ అలంకరించడం లేదా సక్రమంగా అమర్చుకోవడం అనే భావాన్ని ఇస్తుంది. తెలుగులో విధి లేదా ఉపదేశ భావాన్ని ‘అలంకరించుకోవాలి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μὴ ἐν πλέγμασιν
  choice: జడలతోగానీ ... కాదు
  rationale: πλέγματα అల్లిన జుట్టు అమరికలను సూచిస్తుంది. ‘జడలు’ మూలంలోని రూపాన్ని సంక్షిప్తంగా నిలుపుతుంది; దాని సాంస్కృతిక సూచనను పాదటిప్పణి వివరిస్తుంది.
- source_word: χρυσίῳ ... μαργαρίταις
  choice: బంగారంతోగానీ, ముత్యాలతోగానీ
  rationale: మూలంలోని సాధారణ పదాలను ఆభరణాల నిర్దిష్ట రూపాన్ని అదనంగా ఊహించకుండా యథాతథంగా అందిస్తుంది.
- source_word: ἱματισμῷ πολυτελεῖ
  choice: ఖరీదైన వస్త్రాలతోగానీ
  rationale: ἱματισμός వస్త్రాలను, πολυτελής అధిక ధర లేదా విలాసాన్ని సూచిస్తాయి. ‘ఖరీదైన వస్త్రాలు’ ఆధునిక పాఠకులకు స్పష్టమైన సమానార్థకం.
theological_decisions:
- issue: ఈ వాక్యం స్త్రీలందరినీ ఉద్దేశిస్తుందా, లేక భార్యలను మాత్రమేనా
  choice: స్త్రీలు
  alternative: భార్యలు
  rationale: బహువచనమైన γυναῖκας ను వివాహిత స్త్రీలకే పరిమితం చేసే సందర్భ సూచన లేదు. అందువల్ల మూలం అనుమతించని సంకుచిత అర్థాన్ని చేర్చకుండా సాధారణ అర్థాన్ని ఎంచుకున్నాం.
- issue: జడలు, బంగారం, ముత్యాలు, ఖరీదైన వస్త్రాలపై నిషేధం సంపూర్ణమైనదా, లేక ఆడంబర ప్రదర్శనను లక్ష్యంగా చేసిందా
  choice: ప్రధాన పాఠ్యంలో జాబితాను నేరుగా నిలిపి, పాదటిప్పణిలో ఆడంబర అలంకరణ అనే సంభావ్య సందర్భార్థాన్ని తెలిపాం
  alternative: ప్రతి సందర్భంలో జడలు, బంగారం, ముత్యాలు లేదా ఖరీదైన వస్త్రాలను పూర్తిగా నిషేధించడం
  rationale: వాక్య నిర్మాణం మర్యాద, అణకువ, ఆత్మనిగ్రహంతో కూడిన అలంకరణను విలాస ప్రదర్శనతో వ్యతిరేకంగా ఉంచుతుంది. అయినప్పటికీ మూలంలోని నిషేధ రూపాన్ని ప్రధాన పాఠ్యంలో బలహీనపరచకుండా, చారిత్రక-సాంస్కృతిక వివరణను పాదటిప్పణికే పరిమితం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘వస్త్రధారణ,’ ‘అణకువ,’ ‘ఆత్మనిగ్రహం’ వంటి పదాలు గంభీరతను నిలుపుతూనే ప్రస్తుత వాడుకలో స్పష్టంగా ఉంటాయి. గ్రీకు వాక్యంలోని ఉపదేశ స్వరాన్ని ‘అలంకరించుకోవాలి’ ద్వారా వ్యక్తం చేశాం.
