  text: ὃς πάντας ἀνθρώπους θέλει σωθῆναι καὶ εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/004.yaml
  text: who desires all people to be saved and to come to the knowledge of the truth[a][b].
translation:
  language: te
  text: ఆయన ప్రజలందరూ రక్షించబడాలని, సత్యాన్ని గురించిన జ్ఞానానికి రావాలని కోరుతున్నాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రజలందరూ రక్షించబడాలని సంకల్పిస్తున్నాడు.’ గ్రీకు క్రియకు ‘కోరుతున్నాడు,’ ‘ఇష్టపడుతున్నాడు,’ లేదా ‘సంకల్పిస్తున్నాడు’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘సత్యాన్ని గురించిన సంపూర్ణ జ్ఞానానికి రావాలని.’ ఇక్కడి గ్రీకు నామవాచకానికి మరింత నిండైన లేదా సంపూర్ణమైన జ్ఞానం అనే భావఛాయ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: ఆయన
  rationale: ఈ సంబంధ సర్వనామం ముందరి వచనంలోని దేవుణ్ణి సూచిస్తుంది. తెలుగు స్వతంత్ర వాక్యంగా సహజంగా ఉండేందుకు ‘ఆయన’ అని ఇచ్చాం; మూలంలోని సంబంధాన్ని సందర్భం నిలుపుతుంది.
- source_word: πάντας ἀνθρώπους
  choice: ప్రజలందరూ
  rationale: ఈ పదబంధం పురుషులను మాత్రమే కాక మనుషులందరినీ సూచిస్తుంది. ‘ప్రజలందరూ’ ఆధునిక తెలుగులో సహజంగా ఉండి దాని విశ్వవ్యాప్త పరిధిని కుదించదు.
- source_word: θέλει
  choice: కోరుతున్నాడు
  rationale: θέλω అనేది కోరడం, ఇష్టపడడం, సంకల్పించడం అనే భావాలను కలిగి ఉండవచ్చు. ‘కోరుతున్నాడు’ మూలంలోని భావాన్ని తెలియజేస్తూనే దేవుని సంకల్ప స్వభావంపై ఉన్న వేదాంత చర్చను అనువాదంలోనే తీర్చదు.
- source_word: σωθῆναι
  choice: రక్షించబడాలని
  rationale: ఇది σῴζω యొక్క కర్మణి క్రియారూపం; పౌలు వాడుకలో ఇక్కడ రక్షణసంబంధమైన అర్థమే సహజం.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: సత్యాన్ని గురించిన జ్ఞానానికి
  rationale: ἐπίγνωσις జ్ఞానం, గుర్తింపు, మరింత సంపూర్ణమైన జ్ఞానం అనే ఛాయలను కలిగి ఉంటుంది. ప్రధాన పాఠంలో ‘జ్ఞానం’ అని ఉంచి, బలమైన ఛాయను పాదసూచికలో తెలిపాం.
- source_word: ἐλθεῖν
  choice: రావాలని
  rationale: ἔρχομαι + εἰς ఇక్కడ ఒక స్థితికి లేదా వాస్తవానికి చేరడాన్ని సూచిస్తుంది. ‘జ్ఞానానికి రావడం’ మూల రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: πάντας ἀνθρώπους యొక్క పరిధి మరియు దేవుని రక్షణకరమైన కోరిక
  choice: ‘ప్రజలందరూ’ అని సూటిగా అనువదించి, θέλειకి ‘కోరుతున్నాడు’ అని ఇచ్చాం.
  alternative: ‘అన్ని రకాల ప్రజలు’; ‘ప్రజలందరూ రక్షించబడాలని సంకల్పిస్తున్నాడు’
  rationale: గ్రీకు పదబంధం సహజంగా ప్రజలందరినీ సూచిస్తుంది. దాన్ని ‘అన్ని రకాల ప్రజలు’ అని కుదించడమూ, θέλειని సాంకేతిక వేదాంతార్థంలో బలపరచడమూ మూలపాఠం చెప్పినదానికంటే ముందుకు వెళ్తాయి. అందువల్ల విశ్వవ్యాప్త పరిధినీ వేదాంత ఉద్రిక్తతనూ అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. ముందు వచనంతో అనుసంధానాన్ని ‘ఆయన’ నిలుపుతుంది. పాదసూచిక సూచికలు ప్రధాన పాఠంలో రెండూ చేర్చబడ్డాయి.
