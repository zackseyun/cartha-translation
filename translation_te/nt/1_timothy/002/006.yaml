  yaml_path: translation/nt/1_timothy/002/006.yaml
  text: who gave himself as a ransom for all[c][b][a], the testimony at the proper times.
translation:
  language: te
  text: ఆయన అందరి కోసం[a] విమోచన మూల్యంగా తనను తాను ఇచ్చుకున్నాడు—ఇది తగిన కాలాల్లో వెల్లడైన సాక్ష్యం.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అందరి పక్షంగా.’ ‘అందరి కోసం’ అనే మాట గ్రీకు పదబంధంలోని విశాల పరిధిని నిలుపుతుంది; పౌలు ప్రతి వ్యక్తిని ఉద్దేశిస్తున్నాడా లేక అన్ని రకాల ప్రజలను ఉద్దేశిస్తున్నాడా అనే చర్చను ఇది తేల్చదు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘సాక్ష్యం’ లేదా ‘తగిన కాలాల్లో ప్రకటించబడిన సాక్ష్యం.’ గ్రీకు పదబంధం సంక్షిప్తంగా ఉంది; క్రీస్తు తనను తాను ఇచ్చుకోవడమే తగిన కాలాల్లో వెల్లడైన సాక్ష్యమని ఇది సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: 'మరింత అక్షరార్థంగా: ‘తగిన కాలాల్లో సాక్ష్యం.’'
    reason: previous_rendering
lexical_decisions:
- source_word: δοὺς
  choice: ఇచ్చుకున్నాడు
  rationale: δίδωμι యొక్క భూతకాల క్రియాభావాన్ని సహజమైన తెలుగు సంబంధ వాక్యంగా వ్యక్తం చేస్తుంది. ‘తనను తాను’ అనే కర్మతో కలిసి స్వచ్ఛంద స్వీయ సమర్పణను తెలియజేస్తుంది.
- source_word: ἑαυτὸν
  choice: తనను తాను
  rationale: మూలంలోని ఆత్మవాచక సర్వనామాన్ని నేరుగా, సహజంగా ప్రతిబింబించి ఆయన స్వీయ సమర్పణను నొక్కిచెబుతుంది.
- source_word: ἀντίλυτρον
  choice: విమోచన మూల్యంగా
  rationale: బంధనంనుంచి విడిపించడానికి చెల్లించే మూల్యం అనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది. ἀντί-లోని ప్రతినిధిత్వ ఛాయను అతిగా విస్తరించి వ్యాఖ్యానించదు.
- source_word: ὑπὲρ πάντων
  choice: అందరి కోసం
  rationale: ὑπέρ యొక్క ‘కోసం/పక్షంగా’ అనే పరిధినీ πάντων యొక్క విశాలతనూ నిలుపుతుంది; ‘అందరు’ ఎవరనే తరువాతి సిద్ధాంత వివాదాన్ని అనువాదంలోనే తీర్చదు.
- source_word: τὸ μαρτύριον
  choice: సాక్ష్యం ఇదే
  rationale: ముందున్న క్రీస్తు స్వీయ సమర్పణను పునరుద్ఘాటించే అన్వయార్థక పదబంధంగా తీసుకుంది. ‘సాక్ష్యం’ μαρτύριονకు సహజమైన తెలుగు సమానం.
- source_word: καιροῖς ἰδίοις
  choice: తగిన కాలాల్లో
  rationale: దైవ నియామకానికి తగిన లేదా నిర్ణీత సందర్భాలను సూచించే గ్రీకు బహువచనాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: క్రీస్తు విమోచన మూల్యానికి సంబంధించి πάντων పరిధి
  choice: ‘అందరి కోసం’ అని విశాలంగానే అనువదించడం
  alternative: ‘ప్రతి ఒక్కరి కోసం’ లేదా ‘అన్ని రకాల ప్రజల కోసం’
  rationale: ఈ వచనం విశ్వవ్యాప్త పదాన్ని ఉపయోగిస్తుంది గాని, అది ప్రతి వ్యక్తినీ సూచిస్తుందా లేక అన్ని వర్గాల ప్రజలనూ సూచిస్తుందా అనే తరువాతి సిద్ధాంత చర్చను ఇక్కడ స్పష్టంగా పరిష్కరించదు.
- issue: ἀντίλυτρονలోని ప్రతినిధిత్వ భావం
  choice: ‘విమోచన మూల్యం’ అనే ప్రధాన భావాన్ని ఉంచడం
  alternative: ‘బదులుగా చెల్లించిన విమోచన మూల్యం’
  rationale: ἀντί- ప్రతినిధిత్వ ఛాయను కలిగివున్నా, దాన్ని ప్రధాన పాఠంలో విస్తరించడం మూలాన్ని మించిన వ్యాఖ్యానంగా మారవచ్చు.
- issue: τὸ μαρτύριον καιροῖς ἰδίοις యొక్క సంక్షిప్త అన్వయం
  choice: క్రీస్తు స్వీయ సమర్పణనే తగిన కాలాల్లో ఇవ్వబడిన సాక్ష్యంగా అన్వయించడం
  alternative: ‘తగిన కాలాల్లో సాక్ష్యం’ అని క్రియను పూరించకుండా ఉంచడం
  rationale: గ్రీకు పదబంధం సంక్షిప్తమైన అన్వయార్థక నిర్మాణం. తెలుగులో అర్థవంతంగా ఉండేందుకు ‘ఇవ్వబడిన’ను పూరించినా, ప్రత్యామ్నాయంగా మరింత అక్షరార్థ నిర్మాణాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ‘విమోచన మూల్యం’ బైబిలు భావాన్ని నిలుపుతూ ‘క్రయధనం’ కంటే ప్రస్తుత పాఠకులకు స్పష్టంగా ఉంటుంది. గ్రీకులోని చివరి పదబంధం సంక్షిప్తంగా ఉన్నందున ప్రధాన పాఠంలో కనిష్ఠ క్రియా పూరణ చేసి, అక్షరార్థ రూపాన్ని పాదసూచికలో ఇచ్చాం.
