id: 1TI.2.14
reference: 1 Timothy 2:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ Ἀδὰμ οὐκ ἠπατήθη, ἡ δὲ γυνὴ ⸀ἐξαπατηθεῖσα ἐν παραβάσει γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/014.yaml
  text: And Adam was not deceived[a], but the woman, having been deceived[b], came to be in transgression.
translation:
  language: te
  text: ఆదాము మోసపోలేదు; అయితే స్త్రీ పూర్తిగా మోసపోయి, అతిక్రమంలోకి వచ్చింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతిక్రమంలో ఉంది.” గ్రీకు పరిపూర్ణకాల క్రియ, జరిగిన సంఘటన వల్ల ఏర్పడిన కొనసాగుతున్న స్థితిని నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδὰμ
  choice: ఆదాము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: οὐκ ἠπατήθη
  choice: మోసపోలేదు
  rationale: ἀπατάω యొక్క భూతకాల కర్మణి రూపాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: ἡ δὲ γυνὴ
  choice: అయితే స్త్రీ
  rationale: δέ సూచించే వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది; ఆదికాండపు సందర్భంలో γυνήకి ‘స్త్రీ’ అనేది ‘భార్య’కన్నా తటస్థమైన అనువాదం.
- source_word: ἐξαπατηθεῖσα
  choice: పూర్తిగా మోసపోయి
  rationale: సాధారణ ἀπατάωతో ఉన్న పదభేదాన్ని కనిపించేలా ἐξαπατάωలోని బలమైన భావాన్ని ‘పూర్తిగా’తో సూచిస్తుంది; కృదంతపు పూర్వక్రియను ‘మోసపోయి’ సహజంగా అందిస్తుంది.
- source_word: ἐν παραβάσει γέγονεν
  choice: అతిక్రమంలోకి వచ్చింది
  rationale: γέγονενలోని ఒక స్థితికి చేరడం మరియు దాని ఫలితస్థితి రెండింటినీ సహజ తెలుగులో వ్యక్తపరుస్తుంది; παράβασιςను వ్యక్తిపై ‘అతిక్రమకురాలు’ అనే ముద్రగా మార్చకుండా భావవాచక నామంగానే ఉంచుతుంది.
theological_decisions:
- issue: స్త్రీకి మరియు అతిక్రమానికి మధ్య ఉన్న సంబంధాన్ని విస్తృతమైన స్త్రీదోషం లేదా స్త్రీ స్వభావంపై సిద్ధాంతంగా మార్చకుండా అనువదించడం
  choice: స్త్రీ పూర్తిగా మోసపోయి, అతిక్రమంలోకి వచ్చింది
  alternative: స్త్రీ మోసపోయి అతిక్రమకురాలైంది
  rationale: ఎంచుకున్న రూపం ఆదికాండపు సంఘటనకు సంబంధించిన చారిత్రక వాక్యంగా పాఠాన్ని ఉంచుతుంది. గ్రీకులోని భావవాచక నామాన్ని వ్యక్తిగత ముద్రగా మార్చదు; వాక్యంలో లేని విస్తృత సిద్ధాంతాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన శైలి. మూలంలోని వ్యత్యాసం, బలమైన మోసపు క్రియ, అతిక్రమానికి సంబంధించిన ఫలితస్థితి సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
