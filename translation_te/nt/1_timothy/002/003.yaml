  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀τοῦτο καλὸν καὶ ἀπόδεκτον ἐνώπιον τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/003.yaml
  text: This is good and acceptable before God our Savior,
translation:
  language: te
  text: ఇది మంచిది; మన రక్షకుడైన దేవుని దృష్టిలో అంగీకారయోగ్యమైనది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: ఇది
  rationale: నపుంసక ఏకవచన సూచక సర్వనామం ముందటి వచనంలోని ప్రార్థనకు సంబంధించిన ఆదేశాన్ని సూచిస్తుంది; ‘ఇది’ ఆ అన్వయాన్ని సహజంగా నిలుపుతుంది.
- source_word: καλὸν
  choice: మంచిది
  rationale: ఇక్కడ సౌందర్యం కంటే నైతికంగా మంచి, తగినది అనే భావం ప్రధానంగా ఉంది; సాధారణ ఆధునిక తెలుగులో ‘మంచిది’ విస్తృతమైన భావాన్ని నిలుపుతుంది.
- source_word: ἀπόδεκτον
  choice: అంగీకారయోగ్యమైనది
  rationale: అనుకూలంగా స్వీకరించదగినది అనే మూలభావాన్ని ఇది తెలియజేస్తుంది; ‘ప్రసన్నకరమైనది’ కంటే మూలంలోని మూల్యాంకన భావాన్ని తక్కువ వ్యాఖ్యానంతో నిలుపుతుంది.
- source_word: ἐνώπιον
  choice: దృష్టిలో
  rationale: ఈ సందర్భంలో దేవుని సమక్షం మాత్రమే కాక, ఆయన చేసే మూల్యాంకనాన్ని సూచిస్తుంది; ‘దేవుని దృష్టిలో’ ఆధునిక తెలుగులో సహజమైన వ్యక్తీకరణ.
- source_word: σωτῆρος
  choice: రక్షకుడు
  rationale: పాస్టరల్ పత్రికలలో ఇది దేవునికి వాడిన బిరుదు; ‘రక్షకుడు’ స్థిరమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: ἡμῶν
  choice: మన
  rationale: ‘రక్షకుడు’ను విశేషించే ప్రథమ పురుష బహువచన సంబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: θεοῦ
  choice: దేవుడు
  rationale: ‘రక్షకుడు’తో సమానాధికార సంబంధంలో ఉండి, దేవుడే మన రక్షకుడని గుర్తిస్తుంది; తెలుగులో ‘మన రక్షకుడైన దేవుడు’ సహజమైన నిర్మాణం.
theological_decisions:
- issue: τοῦ σωτῆρος ἡμῶν θεοῦ లో సమానాధికార సంబంధం
  choice: మన రక్షకుడైన దేవుడు
  alternative: మన రక్షక దేవుడు
  rationale: గ్రీకు పదబంధం దేవుణ్ణే ‘మన రక్షకుడు’గా గుర్తిస్తుంది. ‘అయిన’తో కూడిన తెలుగు నిర్మాణం ఈ సమానాధికార సంబంధాన్ని స్పష్టంగా, సహజంగా చూపుతుంది; పాఠానికి మించిన సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే దైవబిరుదుకు తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. గ్రీకు వాక్యంలోని రెండు విశేషణాల సమాంతరతను తెలుగులో అర్థస్పష్టత కోసం అర్ధవిరామంతో చూపించాం.
