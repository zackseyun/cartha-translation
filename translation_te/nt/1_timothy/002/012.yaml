id: 1TI.2.12
reference: 1 Timothy 2:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂διδάσκειν δὲ γυναικὶ⸃ οὐκ ἐπιτρέπω, οὐδὲ αὐθεντεῖν ἀνδρός, ἀλλ’ εἶναι ἐν ἡσυχίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/012.yaml
  text: But I do not permit a woman to teach or to exercise authority over a man[a]; instead[c][b], she is to be in quietness.
translation:
  language: te
  text: అయితే, స్త్రీకి బోధించడానికీ పురుషునిపై[a] అధికారం చలాయించడానికీ[b] నేను అనుమతించను; దానికి బదులుగా, ఆమె ప్రశాంతతతో[c] ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘భార్యకు ... భర్తపై.’ గ్రీకు పదాలు సాధారణ అర్థంలో ‘స్త్రీ/పురుషుడు’ అనీ, వైవాహిక అర్థంలో ‘భార్య/భర్త’ అనీ ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘పురుషునిపై అధికారం కలిగి ఉండడానికి’; బహుశా, ‘ఆధిపత్యం చెలాయించడానికి.’ ఈ గ్రీకు క్రియ అరుదైనది; దాని భావఛాయపై భిన్నాభిప్రాయాలు ఉన్నాయి.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘నిశ్శబ్దంగా’ లేదా ‘మౌనంగా.’ సందర్భాన్ని బట్టి ఈ గ్రీకు పదం ప్రశాంతతను, నిశ్శబ్దాన్ని లేదా మౌనాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διδάσκειν
  choice: బోధించడానికి
  rationale: ἐπιτρέπω అనే క్రియకు పూరకంగా ఉన్న వర్తమాన infinitive యొక్క సూటి అర్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి సూచనతో స్వల్ప వ్యత్యాసాన్ని లేదా తదుపరి అంశానికి మలుపును సహజంగా సూచిస్తుంది.
- source_word: γυναικί
  choice: స్త్రీ
  rationale: γυνή అనే పదానికి ‘స్త్రీ’ లేదా ‘భార్య’ అనే రెండు అర్థాలు సాధ్యమైనా, 2:9–15లోని విస్తృత సందర్భం కారణంగా సాధారణ అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచాం; వైవాహిక అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: οὐκ ἐπιτρέπω
  choice: నేను అనుమతించను
  rationale: వర్తమాన సూచనార్థక రూపాన్ని తెలుగులో సహజమైన సాధారణ వర్తమానంగా వ్యక్తపరుస్తుంది.
- source_word: οὐδὲ
  choice: -గాని ... -గాని
  rationale: మొదటి, రెండవ infinitive క్రియలను ఒకే నిషేధం కింద సమన్వయపరచే గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగు జంట నిర్మాణంతో అందిస్తుంది.
- source_word: αὐθεντεῖν
  choice: అధికారం చలాయించడానికి
  rationale: అరుదైన ఈ క్రియకు తటస్థమైన అధికార భావాన్ని ఇస్తుంది; ‘ఆధిపత్యం చెలాయించడం’ వంటి స్పష్టంగా దుర్వినియోగ భావాన్ని ప్రధాన పాఠ్యంలోకి దిగుమతి చేయదు.
- source_word: ἀνδρός
  choice: పురుషునిపై
  rationale: ἀνήρ అనే పదానికి ‘పురుషుడు’ లేదా ‘భర్త’ అనే అర్థాలు సాధ్యమైనా, విస్తృత సందర్భాన్ని బట్టి సాధారణ అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచాం; వైవాహిక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἀλλ’
  choice: దానికి బదులుగా
  rationale: నిషేధం తరువాత వచ్చే వ్యతిరేక సానుకూల నిరీక్షణను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἶναι
  choice: ఆమె ... ఉండాలి
  rationale: గ్రీకు infinitive నిర్మాణాన్ని తెలుగులో సహజంగా చేసి, ఇక్కడ ఆశించబడుతున్న స్థితిని స్పష్టం చేస్తుంది.
- source_word: ἐν ἡσυχίᾳ
  choice: నిశ్శబ్దంగా
  rationale: ἡσυχία సూచించగల నిశ్శబ్దం లేదా ప్రశాంత స్థితిని సంక్షిప్తంగా వ్యక్తపరుస్తుంది; దాని అర్థ పరిధిని పాదసూచికలో సంరక్షించాం.
theological_decisions:
- issue: వివాదాస్పదమైన సంఘ సందర్భంలో αὐθεντεῖν అర్థం
  choice: అధికారం చలాయించడానికి
  alternative: అధికారం కలిగి ఉండడానికి; ఆధిపత్యం చెలాయించడానికి
  rationale: αὐθεντέω అరుదైనదీ, దాని భావఛాయ వివాదాస్పదమైనదీ. ప్రధాన పాఠ్యం దౌర్జన్య భావాన్ని నిర్బంధంగా చేర్చకుండా తటస్థ అధికారార్థాన్ని ఇస్తుంది; ఇతర సాధ్యమైన భావాలను పాదసూచికలో ఉంచుతుంది.
- issue: γυνή / ἀνήρ పదాలను స్త్రీ/పురుషుడు అని చదవాలా, భార్య/భర్త అని చదవాలా
  choice: స్త్రీ ... పురుషుడు
  alternative: భార్య ... భర్త
  rationale: రెండు నామవాచకాలకూ సాధారణ, వైవాహిక అర్థాలు ఉన్నాయి. పరిసర సందర్భం స్త్రీలను విస్తృతంగా ఉద్దేశిస్తున్నట్లు కనిపించడం వల్ల సాధారణ అర్థాన్ని ప్రధాన పాఠ్యంలో ఎంచుకున్నాం; నిజమైన భాషాపరమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
- issue: ἐν ἡσυχίᾳ సంపూర్ణ మౌనాన్నే సూచిస్తుందా
  choice: నిశ్శబ్దంగా
  alternative: ప్రశాంతంగా; మౌనంగా
  rationale: ఈ పదం సందర్భాన్ని బట్టి నిశ్శబ్దం, ప్రశాంతత లేదా మౌనాన్ని సూచించగలదు. ప్రధాన పాఠ్యం సంక్షిప్తమైన సహజ రూపాన్ని వాడుతూ, ప్రత్యామ్నాయ భావఛాయలను పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించబడింది. ‘-గాని ... -గాని’ నిర్మాణం రెండు నిషేధిత చర్యలను ఒకే వాక్య నిర్మాణంలో కలుపుతుంది. అరుదైన αὐθεντεῖν క్రియకు తటస్థ రూపం ఎంచుకొని, దాని వివాదాస్పద భావఛాయను పాదసూచికలో భద్రపరిచాం.
