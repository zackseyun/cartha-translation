id: ACT.15.13
reference: Acts 15:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς ἀπεκρίθη Ἰάκωβος λέγων· Ἄνδρες ἀδελφοί, ἀκούσατέ μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/013.yaml
  text: And after they became silent[a], James answered, saying, “Brothers[b], listen to me.”
translation:
  language: te
  text: 'వారు మాట్లాడడం ఆపిన తరువాత[a], యాకోబు ఇలా స్పందించాడు: “సోదరులారా[b], నా మాట వినండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు మౌనమైన తరువాత.” గ్రీకు మాట ముందటి వక్తలు మాట్లాడడం ఆపిన తరువాతి సమయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: మూలంలో అక్షరార్థంగా “పురుషులారా, సోదరులారా” అనే రెండు పుంలింగ సంబోధనలు ఉన్నాయి. తెలుగులో సహజమైన సభా సంబోధనగా “సోదరులారా” అని అనువదించాం.
    reason: cultural_note
lexical_decisions:
- source_word: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς
  choice: వారు మాట్లాడడం ముగించి మౌనంగా ఉన్న తరువాత
  rationale: μετά + articular infinitive తరువాతి కాలాన్ని సూచిస్తుంది. σιγάω ఇక్కడ ముందటి వక్తలు మాట్లాడడం ఆపిన స్థితిని సూచిస్తుంది; తెలుగు వాక్యం ఆ సందర్భాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀπεκρίθη
  choice: స్పందించాడు
  rationale: ἀποκρίνομαι అంటే జవాబివ్వడం లేదా స్పందించడం. ఇక్కడ యాకోబును నేరుగా అడిగిన ప్రశ్నకు జవాబు కంటే, ముందటి ప్రసంగాల అనంతరం ఆయన మాట్లాడుతున్నందున ‘స్పందించాడు’ సహజంగా సరిపోతుంది.
- source_word: Ἰάκωβος
  choice: యాకోబు
  rationale: గ్రీకు Ἰάκωβος అనే పేరును మూలరూపానికి దగ్గరగా, తెలుగు బైబిలు భాషలో గుర్తించదగిన విధంగా ‘యాకోబు’ అని లిప్యంతరీకరించాం.
- source_word: λέγων
  choice: ఇలా
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే గ్రీకు వర్తమాన కృదంతాన్ని తెలుగులో సహజమైన ‘ఇలా’తో వ్యక్తం చేశాం; ‘చెబుతూ’ అని యాంత్రికంగా అనువదించలేదు.
- source_word: Ἄνδρες ἀδελφοί
  choice: సోదరులారా
  rationale: ఇవి రెండూ పుంలింగ సంబోధనలు. అయితే తెలుగులో ‘పురుషులారా, సోదరులారా’ అనడం అసహజంగా, రెండు వేరు గుంపులను సంబోధించినట్లుగా వినిపిస్తుంది. ‘సోదరులారా’ సభా ప్రసంగంలోని సహజమైన గౌరవ సంబోధన; మూలంలోని స్పష్టమైన పుంలింగ రూపాన్ని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: ἀκούσατέ μου
  choice: నా మాట వినండి
  rationale: ఈ ఆజ్ఞారూపం శ్రద్ధగా వినమని కోరుతుంది. ‘నా మాట వినండి’ ఆధునిక తెలుగులో సహజంగా ఉండి, ఆజ్ఞ యొక్క బలాన్ని కాపాడుతుంది.
theological_decisions:
- issue: సభలోని Ἄνδρες ἀδελφοί అనే పుంలింగ సంబోధన
  choice: ప్రధాన పాఠ్యంలో ‘సోదరులారా’; మూలంలోని ద్విపద పుంలింగ రూపాన్ని పాదటిప్పణిలో స్పష్టం చేయడం
  alternative: ‘పురుషులారా, సోదరులారా’ లేదా ‘సోదర సోదరీమణులారా’
  rationale: ‘పురుషులారా, సోదరులారా’ మూలపదాలను యాంత్రికంగా చూపించినా తెలుగులో అసహజం; ‘సోదర సోదరీమణులారా’ మూలంలో లేని స్త్రీలింగ పదాన్ని చేర్చుతుంది. ‘సోదరులారా’ సహజమైన సంబోధనగా అర్థాన్ని కాపాడుతుంది; పాదటిప్పణి రూపసంబంధ సమాచారాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సభలో పలికే గౌరవపూర్వకమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యనిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా, దాని కాలక్రమం, ప్రసంగ ప్రవాహం, పుంలింగ సంబోధనను పాఠ్యం మరియు పాదటిప్పణి కలిపి సంరక్షించాం.
