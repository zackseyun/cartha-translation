id: ACT.15.8
reference: Acts 15:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὁ καρδιογνώστης θεὸς ἐμαρτύρησεν αὐτοῖς ⸀δοὺς τὸ πνεῦμα τὸ ἅγιον καθὼς καὶ ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/008.yaml
  text: And God[a], who knows the heart, bore witness to them by giving them the Holy Spirit just as he did to us,
translation:
  language: te
  text: హృదయాలను ఎరిగిన దేవుడు, మనకు ఇచ్చినట్లే వారికీ పరిశుద్ధాత్మను ఇచ్చి, వారికి సాక్ష్యమిచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హృదయజ్ఞుడైన దేవుడు.”
    reason: καρδιογνώστης అనే అరుదైన సమాసపదానికి మరింత సంక్షిప్తమైన పదప్రత్యామ్నాయం; ప్రధాన పాఠ్యంలోని ‘హృదయాలను ఎరిగిన’ భావాన్నే నిలుపుతుంది.
lexical_decisions:
- source_word: καρδιογνώστης
  choice: హృదయాలను ఎరిగిన
  rationale: ఈ అరుదైన సమాసపదం అంతరంగాలను తెలిసినవాడు అనే భావాన్ని ఇస్తుంది. తెలుగులో సహజంగా ఉండే సంబంధార్థక విశేషణ పదబంధంగా అనువదించబడింది.
- source_word: θεὸς
  choice: దేవుడు
  rationale: ఇక్కడ θεόςకు ప్రామాణిక తెలుగు అనువాదం; καρδιογνώστης దీనిని విశేషిస్తుంది.
- source_word: ἐμαρτύρησεν αὐτοῖς
  choice: వారి పక్షంగా సాక్ష్యమిచ్చాడు
  rationale: μαρτυρέωలోని నిర్ధారించే సాక్ష్య భావాన్ని నిలుపుతుంది. αὐτοῖς దత్తి విభక్తి ఇక్కడ వారికి అనుకూలంగా లేదా వారి విషయమై సాక్ష్యమిచ్చాడనే భావాన్ని అనుమతిస్తుంది.
- source_word: δοὺς
  choice: ఇచ్చి
  rationale: దేవుడు ఎలా సాక్ష్యమిచ్చాడో తెలిపే సాధనార్థక క్రియావిశేష రూపంగా సహజమైన తెలుగులో ఇవ్వబడింది.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: పరిశుద్ధాత్మను
  rationale: ఈ స్థిర దైవిక బిరుదుకు ఆధునిక ప్రామాణిక తెలుగు రూపం.
- source_word: καθὼς καὶ ἡμῖν
  choice: మనకు ఇచ్చినట్లే వారికీ
  rationale: గ్రీకులో పునరుక్తం కాని ‘ఇచ్చాడు’ అనే క్రియాభావాన్ని తెలుగులో స్పష్టంగా పూరించి, ‘వారికి’ మరియు ‘మనకు’ మధ్య సమానత్వాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఆత్మ వరం ద్వారా దేవుడు వారిని అంగీకరించినట్లు సాక్ష్యమివ్వడం
  choice: ‘వారు’ అనే సర్వనామాన్ని అలాగే ఉంచి, పరిశుద్ధాత్మను వారికి కూడా మనకు ఇచ్చినట్లే ఇచ్చాడనే సమానత్వాన్ని వ్యక్తం చేయడం
  alternative: ‘వారు’ స్థానంలో ‘యూదేతరులు’ అని సందర్భార్థాన్ని వచనంలోనే స్పష్టీకరించడం
  rationale: αὐτοῖς స్వయంగా వారి జాతి గుర్తింపును చెప్పదు; ఆ గుర్తింపు సందర్భం నుండి వస్తుంది. అందువల్ల మూలంలోని సర్వనామాన్ని నిలుపుతూ అదనపు సిద్ధాంత వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక, గౌరవప్రదమైన తెలుగు. ‘ఎరిగిన’ అనే పదం సాధారణ పాఠకునికి అర్థమయ్యేంత పరిచితంగా ఉండి, దేవుని అంతరంగజ్ఞానాన్ని గంభీరంగా వ్యక్తం చేస్తుంది. ప్రధాన వాక్యంలో సహజ తెలుగు పదక్రమం కోసం ఆత్మను ఇవ్వడం ముందుగా, సాక్ష్యమివ్వడం ప్రధాన క్రియగా చివర ఉంచబడింది.
