id: ACT.15.32
reference: Acts 15:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰούδας τε καὶ Σιλᾶς, καὶ αὐτοὶ προφῆται ὄντες, διὰ λόγου πολλοῦ παρεκάλεσαν τοὺς ἀδελφοὺς καὶ ἐπεστήριξαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/032.yaml
  text: Judas and Silas[a], who were themselves prophets, encouraged the brothers at length and strengthened them.
translation:
  language: te
  text: యూదా మరియు సీలలు తామూ ప్రవక్తలై ఉండి, సహోదరులను[a] ఎన్నో మాటలతో ప్రోత్సహించి, వారిని బలపరిచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సహోదర సహోదరీలను”; గ్రీకులో “సహోదరులను” అని ఉంది; అది విశ్వాస సమాజమంతటినీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας τε καὶ Σιλᾶς
  choice: యూదా, సీలలు
  rationale: తెలుగులో స్థిరపడిన నూతన నిబంధన వ్యక్తినామ రూపాలను వాడి, τε καὶ సూచించే సమన్వయాన్ని సహజమైన సంయుక్త కర్త రూపంతో వ్యక్తం చేశాం.
- source_word: καὶ αὐτοὶ προφῆται ὄντες
  choice: తాము కూడా ప్రవక్తలు కావడంతో
  rationale: αὐτοὶ లోని స్వయంసూచక ఉద్ఘాటనను ‘తాము’తో, καὶ భావాన్ని ‘కూడా’తో నిలిపి, సందర్భానుసారమైన వివరణాత్మక నేపథ్యాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: προφῆται
  choice: ప్రవక్తలు
  rationale: మూలపదానికి ప్రత్యక్షమైన, ప్రామాణికమైన తెలుగు సమానార్థకం; దాని పరిచర్యాత్మక లేదా దైవశాస్త్రీయ భావాన్ని బలహీనపరచదు.
- source_word: διὰ λόγου πολλοῦ
  choice: ఎన్నో మాటలతో
  rationale: ‘చాలా మాట/మాటల ద్వారా’ అనే మూలభావాన్ని నిలుపుతూ, వారు విస్తారంగా మాట్లాడి ప్రోత్సహించారని సహజంగా తెలియజేస్తుంది.
- source_word: παρεκάλεσαν
  choice: ప్రోత్సహించి
  rationale: ఈ సందర్భంలో παρακαλέω లోని ఆదరణ, ప్రేరణ, హితబోధల విస్తృత భావంలో ప్రధానమైన ప్రోత్సాహాన్ని సులభమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοὺς ἀδελφοὺς
  choice: సహోదరులను
  rationale: గ్రీకు పదంలోని వ్యాకరణపరమైన పుంలింగ బహువచనాన్ని ప్రధాన పాఠ్యంలో నిలిపింది; అది విశ్వాస సమాజమంతటికీ వర్తించే అవకాశం పాదటిప్పణిలో తెలిపాం.
- source_word: ἐπεστήριξαν
  choice: బలపరిచారు
  rationale: స్థిరపరచడం లేదా దృఢపరచడం అనే క్రియాభావాన్ని స్పష్టంగా అందించి, ముందు ఉన్న ‘ప్రోత్సహించి’ అనే చర్యతో కలిపివేయకుండా వేరుగా నిలుపుతుంది.
theological_decisions:
- issue: మిశ్రమ విశ్వాస సమాజాన్ని సూచించగల τοὺς ἀδελφοὺς అనువాదం
  choice: సహోదరులను
  alternative: సహోదర సహోదరీలను; విశ్వాసులను
  rationale: మూల గ్రీకు వ్యాకరణపరంగా పుంలింగ బహువచనం. అయితే ఆది క్రైస్తవ వాడుకలో ఇది స్త్రీలతో సహా మొత్తం విశ్వాస సమాజాన్ని సూచించవచ్చు. అందువల్ల ప్రధాన పాఠ్యం మూలరూపాన్ని నిలుపుతూ, సంభావ్య సమగ్ర అర్థాన్ని పాదటిప్పణి వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ఎన్నో మాటలతో’ మూలంలోని విస్తారమైన వాచిక పరిచర్యను స్పష్టంగా ఉంచుతుంది; ‘ప్రోత్సహించి బలపరిచారు’ రెండు వేర్వేరు క్రియలను కాపాడుతుంది.
