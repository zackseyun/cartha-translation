id: ACT.15.21
reference: Acts 15:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ ἐκ γενεῶν ἀρχαίων κατὰ πόλιν τοὺς κηρύσσοντας αὐτὸν ἔχει ἐν ταῖς συναγωγαῖς κατὰ πᾶν σάββατον ἀναγινωσκόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/021.yaml
  text: For from ancient generations Moses has had those who proclaim him in every city[a], being read in the synagogues every Sabbath.
translation:
  language: te
  text: ఎందుకంటే, పూర్వకాలం నుంచీ ప్రతి పట్టణంలో మోషేను ప్రకటించేవారు ఉన్నారు; ఆయన ప్రతి సబ్బాతు రోజున సమాజమందిరాల్లో చదవబడుతుంటాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘మోషేను ప్రకటించేవారు … ఆయన చదవబడుతుంటాడు.’ ఇక్కడ ‘మోషే’ అనే పేరు ఆయనకు సంబంధించిన రచనలు లేదా ధర్మశాస్త్రాన్ని అన్యాపదేశంగా సూచిస్తుంది.
    reason: మూలంలోని అన్యాపదేశ ప్రయోగం వల్ల తెలుగులో అసాధారణంగా వినిపించే వ్యక్తిగత సూచనను వివరిస్తుంది.
lexical_decisions:
- source_word: Μωϋσῆς
  choice: మోషే
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు రూపంలో లిప్యంతరీకరించాం; మూలంలోని అన్యాపదేశ ప్రయోగాన్ని అలాగే ఉంచాం.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి తీర్పుకు ఈ వాక్యం కారణం లేదా వివరణ ఇస్తున్న సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐκ γενεῶν ἀρχαίων
  choice: పూర్వ తరాల నుంచీ
  rationale: తరాలనే బహువచన భావాన్ని, ఎంతో కాలంగా కొనసాగుతున్న స్థితిని రెండింటినీ నిలుపుతుంది.
- source_word: κατὰ πόλιν
  choice: ప్రతి పట్టణంలో
  rationale: κατά పదబంధంలోని విభజనాత్మక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοὺς κηρύσσοντας αὐτὸν
  choice: మోషేను ప్రకటించేవారు
  rationale: κηρύσσω లోని బహిరంగ ప్రకటన భావాన్ని నిలుపుతూ, αὐτόν సూచించే మోషే అనే వ్యక్తిగత ప్రస్తావనను స్పష్టత కోసం మళ్లీ పేర్కొంటుంది.
- source_word: ἔχει
  choice: ఉన్నారు
  rationale: తెలుగులో సహజమైన అస్తిత్వ నిర్మాణంతో, పూర్వ తరాల నుంచి కొనసాగుతున్న ప్రస్తుత స్థితిని సందర్భం ద్వారా తెలియజేస్తుంది.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: సమాజమందిరాల్లో
  rationale: యూదుల ఆరాధన, ధర్మశాస్త్ర పఠన స్థలాలకు ప్రాచుర్యంలో ఉన్న స్పష్టమైన తెలుగు పదం.
- source_word: κατὰ πᾶν σάββατον
  choice: ప్రతి సబ్బాతు రోజున
  rationale: ప్రతి వారం పునరావృతమయ్యే సబ్బాతు సందర్భాన్ని స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἀναγινωσκόμενος
  choice: చదవబడుతున్నాడు
  rationale: వర్తమాన కర్మణి భావాన్ని నిలుపుతుంది; కారణార్థక ఉపవాక్యాన్ని చేర్చకుండా మూలంలోని కృదంత సంబంధాన్ని విరామచిహ్నంతో తెరిచి ఉంచుతుంది.
theological_decisions:
- issue: మోషే అనే పేరుకు అన్యాపదేశార్థం
  choice: ప్రధాన పాఠ్యంలో ‘మోషేను’ మరియు ‘ఆయన చదవబడుతున్నాడు’ అనే వ్యక్తిగత ప్రస్తావనలను నిలుపడం
  alternative: ‘మోషే ధర్మశాస్త్రాన్ని ప్రకటించేవారు’ లేదా ‘మోషే రచనలు చదవబడుతున్నాయి’ అని స్పష్టీకరించడం
  rationale: గ్రీకు పాఠ్యం మోషే పేరునే ఉపయోగించి, ఆయనకు సంబంధించిన రచనలు లేదా ధర్మశాస్త్రాన్ని అన్యాపదేశంగా సూచిస్తుంది. దానిని ప్రధాన పాఠ్యంలో విప్పి చెప్పకుండా ఉంచడం మూలంలోని రూపాన్ని, స్వల్ప ఉద్వేగాన్ని కాపాడుతుంది; అవసరమైన వివరణను పాదసూచిక ఇస్తుంది.
- issue: ἀναγινωσκόμενος కృదంతపు సంబంధం
  choice: తటస్థంగా ‘చదవబడుతున్నాడు’ అని ఉంచడం
  alternative: ‘ఆయన చదవబడుతున్నందువల్ల’ అని కారణార్థంగా అనువదించడం
  rationale: సందర్భంలో కారణార్థం సాధ్యమైనా, కృదంతం దానిని నిర్బంధంగా నిర్దేశించదు. అందువల్ల కారణాన్ని ప్రధాన పాఠ్యంలో నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ రచించబడింది. ‘సమాజమందిరాలు’, ‘సబ్బాతు’ వంటి సుపరిచిత బైబిలు పదాలను వాడాం. మూలంలోని మోషే-రచనలు అన్యాపదేశాన్ని ఉద్దేశపూర్వకంగా ప్రధాన పాఠ్యంలో నిలిపి, పాదసూచికలో వివరించాం.
