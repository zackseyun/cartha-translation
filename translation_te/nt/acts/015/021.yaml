revisions:
- from: ఎందుకంటే, పూర్వ తరాల నుంచీ ప్రతి పట్టణంలో మోషేను ప్రకటించేవారు ఉన్నారు; ప్రతి సబ్బాతు రోజున సమాజమందిరాల్లో ఆయన చదవబడుతున్నాడు.[a]
  to: ఎందుకంటే, పూర్వకాలం నుంచీ ప్రతి పట్టణంలో మోషేను ప్రకటించేవారు ఉన్నారు; ఆయన ప్రతి సబ్బాతు రోజున సమాజమందిరాల్లో చదవబడుతుంటాడు.[a]
  rationale: The revision is limited to idiomatic temporal and habitual expression. It retains γάρ as “ఎందుకంటే,” retains Moses as the source’s metonymic personal reference rather than expanding it in the main text, and leaves the participial connection non-causal rather than rendering it as “ఎందుకంటే/ఎందువల్ల చదవబడుతున్నాడు.”
