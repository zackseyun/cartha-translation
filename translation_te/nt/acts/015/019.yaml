  text: διὸ ἐγὼ κρίνω μὴ παρενοχλεῖν τοῖς ἀπὸ τῶν ἐθνῶν ἐπιστρέφουσιν ἐπὶ τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/019.yaml
  text: Therefore I judge that we should not trouble those from among the Gentiles who are turning to God[b][a],
translation:
  language: te
  text: 'కాబట్టి నేను తీర్మానిస్తున్నాను[b]: అన్యజనులలోనుంచి[a] దేవుని వైపు తిరుగుతున్నవారిని మనం ఇబ్బంది పెట్టకూడదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని వైపు తిరుగుతున్న అన్యజనులను.” గ్రీకు పదబంధం అక్షరార్థంగా అన్యజనుల మధ్యనుంచి వచ్చిన వారిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారిని ఇబ్బంది పెట్టకూడదని నేను తీర్మానిస్తున్నాను” లేదా “వారిని ఇబ్బంది పెట్టకూడదన్నది నా తీర్పు.” గ్రీకు వాక్యం యాకోబు వ్యక్తిగత తీర్పును, సభకు చేసిన ఆచరణాత్మక ప్రతిపాదనను వ్యక్తం చేస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: కాబట్టి
  rationale: యాకోబు అంతకుముందు చెప్పిన వాదననుంచి తీసుకున్న నిర్ధారణను సహజంగా తెలియజేస్తుంది.
- source_word: ἐγὼ κρίνω
  choice: నా నిర్ణయం
  rationale: మొదటి పురుష ఏకవచనంలోని యాకోబు పరిశీలిత తీర్పును తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: μὴ παρενοχλεῖν
  choice: మనం ఇబ్బంది పెట్టకూడదని
  rationale: παρενοχλέωలోని కష్టం లేదా అడ్డంకి కలిగించే భావాన్ని, సభకు చేసిన ఆచరణాత్మక ప్రతిపాదనగా వ్యక్తం చేస్తుంది.
- source_word: τοῖς ἀπὸ τῶν ἐθνῶν
  choice: అన్యజనులలోని వారిని
  rationale: సాధారణ వర్గాన్ని కాక, అన్యజనుల మధ్యనుంచి దేవుని వైపు తిరుగుతున్న వ్యక్తులను సూచించే ἀπό భావాన్ని నిలుపుతుంది.
- source_word: ἐπιστρέφουσιν
  choice: తిరుగుతున్న
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న గమనాన్ని నిలుపుతూ, తరువాతి కాలపు సాంకేతిక మతపదాన్ని రుద్దదు.
- source_word: ἐπὶ τὸν θεόν
  choice: దేవుని వైపు
  rationale: దిశను సూచించే ἐπί భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఇది యాకోబు వ్యక్తిగత అభిప్రాయమా, లేక సభకు చేసిన సామూహిక ప్రతిపాదనా?
  choice: “మనం ఇబ్బంది పెట్టకూడదని నా నిర్ణయం”
  alternative: “వారిని ఇబ్బంది పెట్టకూడదని నేను తీర్పు చెబుతున్నాను”
  rationale: ἐγὼ κρίνω యాకోబు వ్యక్తిగత నిర్ణయాన్ని స్పష్టంగా చూపుతుంది; దానిపై ఆధారపడిన infinitive సభ ఆచరించవలసిన చర్యను సూచిస్తుంది. ఈ రెండింటి మధ్యనున్న ఉద్వేగాన్ని అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. “అన్యజనులు” బైబిలు సందర్భంలో స్థిరపడిన పదం; “దేవుని వైపు తిరుగుతున్న” అనేది మారుమనస్సు/మతమార్పిడి అనే సాంకేతిక పదాలతో భావాన్ని ముందుగానే నిర్ణయించకుండా మూలంలోని దిశాత్మక రూపకాన్ని నిలుపుతుంది.
