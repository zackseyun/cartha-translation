  to: 'కాబట్టి నేను తీర్మానిస్తున్నాను[b]: అన్యజనులలోనుంచి[a] దేవుని వైపు తిరుగుతున్నవారిని మనం ఇబ్బంది పెట్టకూడదు.'
  rationale: The revision uses a natural finite Telugu verb for James's explicit ‘I judge,’ retains the communal practical force of the dependent infinitive through “మనం ... పెట్టకూడదు,” and makes the ‘from among the Gentiles’ phrase idiomatic without reducing it to a generic reference to Gentiles. Footnote anchors have been relocated to the words they explain; no theological interpretation has been added.
