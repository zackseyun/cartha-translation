  revised_text: 'అప్పుడు అపొస్తలులు, పెద్దలు, సంఘమంతటితో కలిసి, తమలోనుండి కొందరు పురుషులను ఎన్నుకొని పౌలు, బర్నబాలతో పాటు అంతియొకయకు పంపడం మంచిదని భావించారు: బర్సబ్బా అని పిలువబడే యూదాను, సీలను—సహోదరుల మధ్య నాయకత్వం వహిస్తున్న పురుషులను.[a][b]'
