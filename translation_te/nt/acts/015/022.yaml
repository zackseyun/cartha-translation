id: ACT.15.22
reference: Acts 15:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε ἔδοξε τοῖς ἀποστόλοις καὶ τοῖς πρεσβυτέροις σὺν ὅλῃ τῇ ἐκκλησίᾳ ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν πέμψαι εἰς Ἀντιόχειαν σὺν ⸀τῷ Παύλῳ καὶ Βαρναβᾷ, Ἰούδαν τὸν ⸀καλούμενον Βαρσαββᾶν καὶ Σιλᾶν, ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/022.yaml
  text: 'Then it seemed good to the apostles and the elders, together with the whole church, to choose men from among them and send them to Antioch with Paul and Barnabas: Judas, who was called Barsabbas, and Silas, men who were leading among the brothers.'
translation:
  language: te
  text: 'అప్పుడు అపొస్తలులు, పెద్దలు, సంఘమంతటితో కలిసి, తమలోనుండి కొందరు పురుషులను ఎన్నుకొని పౌలు, బర్నబాలతో పాటు అంతియొకయకు పంపడం మంచిదని భావించారు: బర్సబ్బా అని పిలువబడే యూదాను, సీలను—సహోదరుల మధ్య నాయకత్వం వహిస్తున్న పురుషులను.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సహోదరులలో నాయకులుగా ఉన్న పురుషులు.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “సహోదరులు” అనే పదం స్త్రీలతో సహా విశ్వాసుల సమాజమంతటినీ సూచించే అవకాశం ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἔδοξε
  choice: మంచిదని నిర్ణయించారు
  rationale: సమిష్టిగా ఆలోచించి మంచిదని భావించి నిర్ణయించిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కేవలం అధికారిక శాసనమనే భావాన్ని మోపదు.
- source_word: πρεσβυτέροις
  choice: పెద్దలు
  rationale: ఆదిమ సంఘ నాయకులను సూచించడానికి తెలుగులో స్థిరపడిన, సులభంగా అర్థమయ్యే పదం.
- source_word: σὺν ὅλῃ τῇ ἐκκλησίᾳ
  choice: సంఘమంతటితో కలిసి
  rationale: అపొస్తలులు, పెద్దలతో పాటు మొత్తం విశ్వాస సమాజం భాగస్వామ్యమైందనే σύν భావాన్ని నిలుపుతుంది.
- source_word: ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν
  choice: తమలో కొందరు పురుషులను ఎన్నుకొని
  rationale: ప్రతినిధులు ఆ సమాజంలోనివారేనని, ἄνδρας ప్రత్యేకంగా పురుషులను సూచిస్తుందని స్పష్టపరుస్తుంది.
- source_word: πέμψαι
  choice: పంపడం
  rationale: గ్రీకు క్రియార్థానికి సహజమైన తెలుగు రూపం.
- source_word: καλούμενον
  choice: అని పిలువబడే
  rationale: యూదాకు బర్సబ్బా అనే మరో పేరు లేదా గుర్తింపు ఉందనే వర్ణనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς
  choice: సహోదరుల మధ్య నాయకత్వం వహిస్తున్న
  rationale: ἡγουμένουςలోని క్రియాత్మక నాయకత్వ భావాన్ని పదవి పేరుగా కుదించకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀδελφοῖς
  choice: సహోదరులు
  rationale: గ్రీకులోని పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, విస్తృత విశ్వాస సమాజాన్ని సూచించే అవకాశాన్ని పాదటిప్పణిలో వివరిస్తుంది.
theological_decisions:
- issue: నిర్ణయంలో సంఘమంతటి భాగస్వామ్యం
  choice: అపొస్తలులు, పెద్దలు సంఘమంతటితో కలిసి నిర్ణయించినట్లు అనువదించడం
  alternative: అపొస్తలులు, పెద్దలు మాత్రమే నిర్ణయించగా సంఘం కేవలం అక్కడ ఉన్నట్లు అనువదించడం
  rationale: σὺν ὅλῃ τῇ ἐκκλησίᾳ అనే పదబంధం మొత్తం సంఘాన్ని ఈ సమిష్టి నిర్ణయంతో సహజంగా అనుసంధానిస్తుంది; అయితే దీనినుంచి ప్రత్యేక సంఘపాలనా విధానాన్ని నిర్ధారించదు.
- issue: ἀδελφοῖς యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘సహోదరులు’; సమగ్ర సమాజార్థాన్ని పాదటిప్పణిలో సూచించడం
  alternative: ప్రధాన పాఠ్యంలో ‘సహోదర సహోదరీలు’ లేదా ‘విశ్వాసులు’
  rationale: మూలంలోని పుంలింగ రూపాన్ని కాపాడుతూనే, తొలి క్రైస్తవ వాడుకలో అది స్త్రీలతో సహా విశ్వాస సమాజాన్ని సూచించగలదనే సందర్భార్థాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. పొడవైన గ్రీకు వాక్యాన్ని స్పష్టత కోసం రెండు తెలుగు వాక్యాలుగా విభజించినా, ఎంపిక మరియు పంపింపు అనే ఏకీకృత చర్యను నిలిపింది.
