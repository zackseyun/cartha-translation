source:
  edition: SBLGNT
  text: ἐπειδὴ ἠκούσαμεν ὅτι τινὲς ἐξ ἡμῶν ⸀ἐξελθόντες ἐτάραξαν ὑμᾶς λόγοις ἀνασκευάζοντες τὰς ψυχὰς ⸀ὑμῶν οἷς οὐ διεστειλάμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/024.yaml
  text: Since we have heard that some went out from us and troubled you with words[a], unsettling your souls, to whom we gave no instructions[b],
translation:
  language: te
  text: మా మధ్యనుంచి బయలుదేరిన కొందరు తమ మాటలతో మిమ్మల్ని కలవరపెట్టి, మీ మనసులను అస్తవ్యస్తపరుస్తూ ఉన్నారని మేము విన్నందున, వారికి మేము ఎలాంటి ఆదేశమూ ఇవ్వలేదు[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘మీ ప్రాణాలను/ఆత్మలను అస్తవ్యస్తపరుస్తూ.’ ఇక్కడ ఇది కేవలం భావోద్వేగాలను కాక, వారి అంతరంగ జీవితం మొత్తాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారిని మేము ఆజ్ఞాపించలేదు.’
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπειδὴ
  choice: …అని మేము విన్నాం
  rationale: ఈ పదం తరువాతి ప్రకటనకు కారణాన్ని పరిచయం చేస్తుంది. తెలుగులో వాక్యనిర్మాణం సహజంగా ఉండేందుకు కారణసూచక భావాన్ని నివేదికతో కలిపి వ్యక్తం చేశాం.
- source_word: ἠκούσαμεν
  choice: మేము విన్నాం
  rationale: అందిన నివేదికను సూటిగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τινὲς ἐξ ἡμῶν ἐξελθόντες
  choice: మా మధ్యనుంచి బయలుదేరిన కొందరు
  rationale: వారు ఆ సమూహం మధ్యనుంచి వచ్చినవారనే భావాన్నీ, అక్కడి నుంచి బయలుదేరారనే కృదంత భావాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: ἐτάραξαν ὑμᾶς λόγοις
  choice: తమ మాటలతో మిమ్మల్ని కలవరపెట్టి
  rationale: λόγοις లోని సాధనార్థక భావాన్ని ‘తమ మాటలతో’ అని, ἐτάραξαν లోని కలతపరచే ప్రభావాన్ని ‘కలవరపెట్టి’ అని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνασκευάζοντες τὰς ψυχὰς ὑμῶν
  choice: మీ అంతరంగాలను చెదరగొట్టారని
  rationale: ἀνασκευάζοντες సూచించే అస్తవ్యస్తపరచడం లేదా స్థిరత్వాన్ని భంగం చేయడం అనే బలమైన భావాన్ని ‘చెదరగొట్టడం’ తెలియజేస్తుంది. ψυχάς ను కేవలం భావోద్వేగాలుగా పరిమితం చేయకుండా వ్యక్తుల అంతరంగ జీవితం అనే భావంతో అనువదించాం.
- source_word: οἷς οὐ διεστειλάμεθα
  choice: వారికి మేము ఎలాంటి ఆదేశమూ ఇవ్వలేదు
  rationale: ఆ వ్యక్తులకు యెరూషలేము సంఘ నాయకుల నుంచి ఆదేశం లేదా అధికారప్రదానం లేదనే గ్రీకు వాక్యంలోని స్పష్టమైన నిరాకరణను సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: కలవరపరిచినవారికి అపొస్తలుల అధికారముందా అనే విషయం
  choice: వారికి మేము ఎలాంటి ఆదేశమూ ఇవ్వలేదు
  alternative: వారిని మేము ఆజ్ఞాపించలేదు
  rationale: వారు ఆ నాయకుల ఆదేశంతో పనిచేయలేదని మూలపాఠం చెబుతుంది. ‘ఆదేశమూ ఇవ్వలేదు’ అనేది అదనపు వ్యాఖ్యానం లేకుండా ఆ సంస్థాగత, ధార్మిక అంశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- issue: ψυχή పదాన్ని శరీరానికి వేరైన ఆత్మ అనే నిర్దిష్ట సిద్ధాంతార్థంలో చూపాలా
  choice: మీ అంతరంగాలను
  alternative: మీ ప్రాణాలను / మీ మనసులను
  rationale: ఈ సందర్భంలో వ్యక్తుల అంతరంగ స్థితి అస్తవ్యస్తం కావడమే ప్రధాన భావం. ‘అంతరంగాలు’ అనే పదం మూలంలోని వ్యక్తిగత, లోతైన భావాన్ని నిలుపుతూ అనవసరమైన మానవస్వరూప సిద్ధాంతాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు కృదంతాల సంబంధాన్ని సహజ తెలుగు వాక్యక్రమంలో ఉంచి, అధికారప్రదానం లేకపోవడాన్ని స్పష్టంగా తెలిపాం.
