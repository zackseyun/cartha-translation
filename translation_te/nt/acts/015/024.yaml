revisions:
- from: మా మధ్యనుంచి బయలుదేరిన కొందరు తమ మాటలతో మిమ్మల్ని కలవరపెట్టి, మీ అంతరంగాలను చెదరగొట్టారని[a] మేము విన్నాం. వారికి మేము ఎలాంటి ఆదేశమూ ఇవ్వలేదు[b].
