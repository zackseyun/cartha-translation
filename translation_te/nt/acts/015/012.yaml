    text: లేదా, “ప్రజల మధ్య.” ఈ సందర్భంలో “ప్రజలు” అనేది ప్రత్యేకంగా యూదేతరులను, అంటే అన్యజనులను సూచిస్తుంది.
    reason: lexical_alternative
  revision_rationale: The revision retains the Greek narrative movement and imperfect sense (‘వింటూ ఉన్నారు’), supplies the inclusive force of ὅσα (‘సమస్త’), clearly coordinates Barnabas and Paul, and preserves God as the one who acted through them. The footnote retains the legitimate lexical alternative for ἔθνεσιν in natural modern Telugu.
