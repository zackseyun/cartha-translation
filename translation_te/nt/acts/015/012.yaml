id: ACT.15.12
reference: Acts 15:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐσίγησεν δὲ πᾶν τὸ πλῆθος, καὶ ἤκουον Βαρναβᾶ καὶ Παύλου ἐξηγουμένων ὅσα ἐποίησεν ὁ θεὸς σημεῖα καὶ τέρατα ἐν τοῖς ἔθνεσιν δι’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/012.yaml
  text: And the whole assembly fell silent[a], and they listened to Barnabas and Paul as they related what signs and wonders God had done among the Gentiles through them.
translation:
  language: te
  text: అప్పుడు సభలో ఉన్నవారందరూ నిశ్శబ్దమయ్యారు; బర్నబా, పౌలు తమ ద్వారా దేవుడు అన్యజనుల మధ్య చేసిన సమస్త సూచకక్రియలను, అద్భుతాలను వివరిస్తుండగా వారు వింటూ ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజల మధ్య.” ఈ సందర్భంలో “ప్రజలు” అనేది ప్రత్యేకంగా యూదేతరులను, అంటే అన్యజనులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐσίγησεν
  choice: నిశ్శబ్దమై
  rationale: ఆ సమూహం నిశ్శబ్ద స్థితిలోకి వచ్చినట్లు తెలిపే సంఘటనాత్మక భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: πᾶν τὸ πλῆθος
  choice: సభలో ఉన్నవారందరూ
  rationale: యెరూషలేములో చర్చకు కూడిన మొత్తం సమూహాన్ని సందర్భానుగుణంగా, ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: ἤκουον
  choice: విన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న శ్రద్ధాపూర్వక వినికిడిని, ‘వివరిస్తుండగా’ అనే నిర్మాణంతో కలిపి తెలియజేస్తుంది.
- source_word: Βαρναβᾶ καὶ Παύλου
  choice: బర్నబా పౌలు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాలు.
- source_word: ἐξηγουμένων
  choice: వివరిస్తుండగా
  rationale: జరిగిన విషయాలను వివరంగా తెలియజేయడం లేదా వృత్తాంతంగా చెప్పడం అనే భావాన్ని ఇస్తుంది; కొనసాగుతున్న చర్యను కూడా నిలుపుతుంది.
- source_word: ὅσα ἐποίησεν ὁ θεὸς σημεῖα καὶ τέρατα
  choice: దేవుడు చేసిన సూచకక్రియలను, అద్భుతాలను
  rationale: ὅσα ఇక్కడ జరిగిన సూచకక్రియలు, అద్భుతాల పరిమాణం/సమగ్రతను పరిచయం చేస్తుంది. తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉండేలా ప్రత్యక్ష కర్మ రూపంలో ఇచ్చి, దేవుడే వాటిని చేసినవాడని స్పష్టంగా ఉంచింది.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: అన్యజనుల మధ్య
  rationale: అపొస్తలుల కార్యములు 15 సందర్భంలో యూదేతర ప్రజలను సూచిస్తుంది; ‘జనాల మధ్య’ అనే మూలార్థ ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: δι’ αὐτῶν
  choice: తమ ద్వారా
  rationale: దేవుడు ప్రధాన కర్తగా, బర్నబా పౌలు ఆయన కార్యానికి సాధనాలుగా ఉన్నారని διά + షష్ఠీ విభక్తి తెలిపే సాధనార్థాన్ని కాపాడుతుంది.
theological_decisions:
- issue: అపొస్తలుల పరిచర్యలో దైవ కార్యసాధకత్వం
  choice: సూచకక్రియలు, అద్భుతాలు చేసిన ప్రధాన కర్త దేవుడు; ఆయన బర్నబా పౌలు ద్వారా వాటిని చేశాడు.
  alternative: బర్నబా పౌలే ప్రధాన కర్తలుగా సూచకక్రియలు, అద్భుతాలు చేశారు.
  rationale: ἐποίησεν అనే క్రియకు ὁ θεὸς కర్త; δι’ αὐτῶν వారిని సాధనాలుగా సూచిస్తుంది. అనువాదం ఈ వాక్యసంబంధాన్ని యథాతథంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. లూకా రచనల్లోని σημεῖα καὶ τέρατα జంటను ‘సూచకక్రియలు, అద్భుతాలు’గా నిలిపాం. పాదసూచిక సూచిక [a] ప్రధాన వచనంలో చేర్చబడింది.
