  terminology: ‘విశ్వాసం,’ ‘హృదయాలు,’ and ‘శుద్ధిచేసి’ are appropriate, established modern-standard Telugu renderings. A footnote is retained for the viable instrumental alternatives reflected in the English audit trail.
