base_translation:
  language: en
  yaml_path: translation/nt/acts/015/009.yaml
  text: And he made no distinction between us and them[a], having cleansed their hearts by faith.
translation:
  language: te
  text: ఆయన విశ్వాసం ద్వారా[a] వారి హృదయాలను శుద్ధిచేసి, మనకూ వారికీ మధ్య ఎలాంటి భేదమూ చూపలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విశ్వాసంతో.’ గ్రీకు దత్తివిభక్తి సాధనం లేదా మాధ్యమాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐθὲν διέκρινεν
  choice: ఏ తేడా చూపలేదు
  rationale: οὐθὲν అనే నిషేధాన్ని διέκρινενతో కలిపి, ‘భేదం చేయలేదు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μεταξὺ ἡμῶν τε καὶ αὐτῶν
  choice: మనకూ వారికీ మధ్య
  rationale: τε ... καὶ జతను తెలుగులో ‘మనకూ వారికీ’ అని సహజంగా వ్యక్తం చేసి, రెండు వర్గాల మధ్య పోలికను నిలుపుతుంది.
- source_word: τῇ πίστει
  choice: విశ్వాసం ద్వారా
  rationale: దత్తివిభక్తి ఇక్కడ సాధనం లేదా మాధ్యమాన్ని సూచించగలదు; ‘ద్వారా’ ఆ సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: καθαρίσας
  choice: శుద్ధిచేసి
  rationale: అయోరిస్ట్ పార్టిసిపిల్‌ను ప్రధాన క్రియతో అనుసంధానమైన చర్యగా చూపుతుంది; శుద్ధీకరణ భావాన్ని అతిగా వివరణ చేయకుండా నిలుపుతుంది.
- source_word: τὰς καρδίας αὐτῶν
  choice: వారి హృదయాలను
  rationale: καρδία సూచించే అంతరంగ వ్యక్తిత్వ భావాన్ని సంప్రదాయబద్ధమైనప్పటికీ సులభంగా అర్థమయ్యే ‘హృదయాలు’ ద్వారా నిలుపుతుంది.
theological_decisions:
- issue: πίστις పదం యొక్క అనువాదం
  choice: విశ్వాసం
  alternative: నమ్మకం
  rationale: ఈ సందర్భంలో πίστιςకు ‘విశ్వాసం’ సహజమైన, విస్తృతంగా అర్థమయ్యే సమానార్థకం; ‘విశ్వసనీయత’ అనే భావాన్ని వాక్యంపై రుద్దదు.
- issue: τῇ πίστει యొక్క వ్యాకరణ సంబంధం
  choice: విశ్వాసం ద్వారా
  alternative: విశ్వాసంతో
  rationale: గ్రీకు దత్తివిభక్తి సాధనం లేదా మాధ్యమాన్ని సూచిస్తుంది. ‘ద్వారా’ ఆ విస్తృత సాధనార్థాన్ని కాపాడుతుంది; ‘తో’ కూడా సాధ్యమే కానీ తెలుగులో కొంత భిన్నమైన సహచర్య ఛాయను కలిగించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని పార్టిసిపిల్ సంబంధాన్ని సహజమైన తెలుగు క్రియాక్రమంతో వ్యక్తం చేసింది.
