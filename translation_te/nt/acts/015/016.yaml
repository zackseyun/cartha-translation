id: ACT.15.16
reference: Acts 15:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἀναστρέψω καὶ ἀνοικοδομήσω τὴν σκηνὴν Δαυὶδ τὴν πεπτωκυῖαν καὶ τὰ ⸀κατεσκαμμένα αὐτῆς ἀνοικοδομήσω καὶ ἀνορθώσω αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/016.yaml
  text: After these things I will return[a], and I will rebuild the fallen tent of David; I will rebuild its ruins, and I will restore it[b],
translation:
  language: te
  text: వీటి తరువాత నేను తిరిగి వస్తాను; పడిపోయిన దావీదు గుడారాన్ని[a] మళ్లీ కడతాను. దాని శిథిలాలను మళ్లీ కట్టి, దాన్ని పునరుద్ధరిస్తాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గుడారం’ అని అనువదించిన గ్రీకు పదం సాధారణ గుడారాన్ని, సందర్భానుసారం పవిత్ర గుడారాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘దావీదు గుడారం’ అనేది దావీదు వంశం లేదా రాజ్యంతో సంబంధమున్న పునరుద్ధరణను సూచించే ప్రవచనాత్మక రూపకం.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: వీటి తరువాత
  rationale: గ్రీకు పదబంధంలోని బహువచన సూచనను, కాలసంబంధ మార్పును స్పష్టంగా నిలుపుతుంది.
- source_word: ἀναστρέψω
  choice: నేను తిరిగి వస్తాను
  rationale: ఈ సందర్భంలో క్రియకు ‘తిరిగి రావడం’ అనే భావం సరిపోతుంది; దైవిక ప్రథమపురుష వాగ్దానాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: ἀνοικοδομήσω
  choice: మళ్లీ కడతాను
  rationale: మరల నిర్మించడం అనే మూలభావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: σκηνὴν Δαυὶδ
  choice: దావీదు గుడారాన్ని
  rationale: σκηνή అనే రూపకాన్ని వ్యాఖ్యానించి ‘దావీదు వంశం’ లేదా ‘రాజ్యం’గా మార్చకుండా, దాని ప్రత్యక్ష అర్థమైన ‘గుడారం’ను నిలుపుతుంది.
- source_word: τὴν πεπτωκυῖαν
  choice: పడిపోయిన
  rationale: పడిపోయి ఆ స్థితిలో ఉన్నదనే గ్రీకు పరిపూర్ణ కృదంత భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: τὰ κατεσκαμμένα αὐτῆς
  choice: దాని శిథిలాలను
  rationale: కూల్చివేయబడిన లేదా ధ్వంసమైన భాగాలను సమష్టిగా సూచించే గ్రీకు రూపాన్ని సహజంగా అందిస్తుంది.
- source_word: ἀνορθώσω
  choice: పునరుద్ధరిస్తాను
  rationale: నిటారుగా నిలబెట్టడం లేదా మునుపటి స్థితికి తేవడం అనే భావాన్ని, పునర్నిర్మాణ సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: αὐτήν
  choice: దాన్ని
  rationale: స్త్రీలింగ గ్రీకు సర్వనామం σκηνήను సూచిస్తుంది; తెలుగులో జడవస్తువైన గుడారానికి ‘దాన్ని’ సహజమైన రూపం.
theological_decisions:
- issue: ‘దావీదు గుడారం’ అనే రూపకపు భావం
  choice: ప్రధాన పాఠ్యంలో ‘దావీదు గుడారం’ అనే రూపకాన్నే నిలుపడం
  alternative: ‘దావీదు వంశం,’ ‘దావీదు రాజ్యం,’ లేదా ‘దావీదు ఇల్లు’ అని నేరుగా వ్యాఖ్యానించడం
  rationale: ప్రవచన ఉల్లేఖనం దావీదు రాజవంశం లేదా దానితో సంబంధమున్న రాజ్య పునరుద్ధరణను సూచించవచ్చు; అయినా గ్రీకు పాఠ్యం రూపకాన్నే ఉపయోగిస్తుంది. కాబట్టి దాని అన్వయాన్ని ప్రధాన పాఠ్యంలో ఒక్క అర్థానికే పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. గ్రీకు వాక్యంలోని వరుస దైవిక వాగ్దానాలను స్పష్టంగా చూపేందుకు మొదటి సముచ్చయాన్ని సెమీకోలన్‌తో, తరువాతి చర్యలను విడి వాక్యంగా అమర్చాం. అందించిన ఆంగ్ల పాఠ్యంలో [a] గుర్తు ‘return’ తరువాత ఉన్నప్పటికీ, దాని గమనిక σκηνή గురించి కావడంతో తెలుగు పాఠ్యంలో సంబంధిత ‘గుడారం’ తరువాత ఉంచబడింది.
