id: ACT.15.29
reference: Acts 15:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπέχεσθαι εἰδωλοθύτων καὶ αἵματος καὶ ⸀πνικτῶν καὶ πορνείας· ἐξ ὧν διατηροῦντες ἑαυτοὺς εὖ πράξετε. ἔρρωσθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/029.yaml
  text: to abstain from food sacrificed to idols[a], from blood, from what has been strangled, and from sexual immorality. If you keep yourselves from these things, you will do well[d][c][b]. Farewell.
translation:
  language: te
  text: విగ్రహాలకు అర్పించిన ఆహారానికి[a], రక్తానికి, గొంతు నులిమి చంపిన జంతువుల మాంసానికి[b], లైంగిక అనైతికతకు[c] దూరంగా ఉండాలి. వీటి నుండి మిమ్మల్ని మీరు కాపాడుకుంటే, మీరు మేలు చేస్తారు. క్షేమంగా ఉండండి.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విగ్రహాలకు అర్పించిన వాటికి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “గొంతు నులిమి చంపినవి” లేదా “గొంతు నులిమి చంపిన వాటి మాంసం.”
    reason: lexical_alternative
  - marker: c
    text: ‘లైంగిక అనైతికత’గా అనువదించిన గ్రీకు పదానికి విస్తృతమైన అర్థం ఉండవచ్చు. అయితే ఈ సందర్భంలో అది లేవీయకాండములో నిషేధించిన కొన్ని సంబంధాలను ప్రత్యేకంగా సూచిస్తుందని కొందరు అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: d
    text: లేదా, “వీడ్కోలు.” గ్రీకులో ఇది ఉత్తరాన్ని ముగించడానికి వాడే సంప్రదాయ పలకరింపు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθαι
  choice: దూరంగా ఉండాలి
  rationale: ఇది ముందున్న ఆదేశంలోని విషయాన్ని తెలిపే వర్తమాన మధ్యమ infinitive. తెలుగులో ఆదేశ భావాన్ని సహజంగా కొనసాగించడానికి ‘దూరంగా ఉండాలి’ అని అనువదించాం.
- source_word: εἰδωλοθύτων
  choice: విగ్రహాలకు అర్పించిన ఆహారం
  rationale: ఈ పదం విగ్రహారాధనలో అర్పించిన వాటిని, సందర్భంలో ముఖ్యంగా ఆహారాన్ని లేదా మాంసాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన స్పష్టత కోసం ‘ఆహారం’ వాడి, విస్తృతమైన రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: αἵματος
  choice: రక్తం
  rationale: మూలంలో ఉన్న సంక్షిప్తమైన సాధారణ పదాన్నే నిలిపి, సందర్భం సూచించే ఆహార సంబంధమైన అర్థాన్ని పాఠ్యంలో అదనంగా చేర్చలేదు.
- source_word: πνικτῶν
  choice: గొంతు నులిమి చంపినవి
  rationale: నామవాచకంగా వాడిన ఈ విశేషణం గొంతు నులిమి చంపబడిన జంతువులను లేదా వాటి మాంసాన్ని సూచిస్తుంది. తెలుగు రూపం మూలంలోని విస్తృతతను సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: πορνείας
  choice: లైంగిక అనైతికత
  rationale: πορνείαను ఒకే ప్రత్యేకమైన లైంగిక అపరాధానికి పరిమితం చేయకుండా దాని విస్తృతమైన సాధారణ అర్థాన్ని తెలిపే ఆధునిక తెలుగు పదబంధం.
- source_word: ἐξ ὧν
  choice: వీటి నుంచి
  rationale: ఈ సంబంధవాచక పదబంధం ముందు చెప్పిన నిషేధాలన్నిటినీ తిరిగి సూచిస్తుంది; తెలుగులో దాని పూర్వపదాన్ని స్పష్టంగా చూపే సహజ రూపం.
- source_word: διατηροῦντες ἑαυτούς
  choice: మిమ్మల్ని మీరు కాపాడుకుంటే
  rationale: మూలంలోని participial నిర్మాణాన్ని తెలుగులో సహజమైన షరతు వాక్యంగా వ్యక్తం చేశాం; ఆత్మవాచక భావాన్ని ‘మిమ్మల్ని మీరు’ నిలుపుతుంది.
- source_word: εὖ πράξετε
  choice: మీరు మంచిగా ప్రవర్తించినవారవుతారు
  rationale: ఆ ఆదేశాలను పాటించడం సరైన, ప్రశంసనీయమైన నడవడి అవుతుందనే భావాన్ని వ్యక్తం చేస్తుంది; కేవలం భౌతిక అభివృద్ధి లేదా శ్రేయస్సు అని సంకుచితం చేయదు.
- source_word: ἔρρωσθε
  choice: క్షేమంగా ఉండండి
  rationale: ఇది ఉత్తరాంతంలో వాడే సంప్రదాయ శుభాకాంక్ష. తెలుగు పాఠకులకు ఉత్తర ముగింపుగా సహజంగా ఉండే రూపాన్ని వాడాం; ‘వీడ్కోలు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: అపొస్తలుల నిర్ణయంలో πορνεία యొక్క పరిధి
  choice: ఒక ప్రత్యేక అపరాధానికి పరిమితం చేయకుండా ‘లైంగిక అనైతికత’ అని విస్తృతంగా అనువదించాం.
  alternative: ‘వ్యభిచారం’; లేదా లేవీయకాండము 18లో నిషేధించిన వివాహ/లైంగిక సంబంధాలు
  rationale: ఈ సందర్భంలో కొందరు పదాన్ని లేవీయకాండంలోని నిషేధాలతో ప్రత్యేకంగా అనుసంధానించినా, వచనం స్వయంగా ఆ పరిధిని స్పష్టంగా పరిమితం చేయదు. కాబట్టి ప్రధాన పాఠ్యం విస్తృతమైన పదార్థాన్ని నిలిపి, వ్యాఖ్యాన భేదాన్ని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ఈ వచనం ముందున్న వాక్యాన్ని కొనసాగిస్తున్నందున ప్రారంభంలోని జాబితా మరియు ‘దూరంగా ఉండాలి’ అనే నిర్మాణాన్ని అలాగే కొనసాగించాం. మూలంలోని పదార్థ విస్తృతి లేదా వ్యాఖ్యాన ఉద్రిక్తత ఉన్న చోట ప్రధాన పాఠ్యాన్ని అనవసరంగా సంకుచితం చేయకుండా పాదసూచికలు ఇచ్చాం.
