revisions:
- from: విగ్రహాలకు అర్పించిన ఆహారానికి[a], రక్తానికి, గొంతు నులిమి చంపిన వాటికి[b], లైంగిక అనైతికతకు[c] దూరంగా ఉండాలి. వీటి నుంచి మిమ్మల్ని మీరు కాపాడుకుంటే, మీరు మంచిగా ప్రవర్తించినవారవుతారు. క్షేమంగా ఉండండి.[d]
  to: విగ్రహాలకు అర్పించిన ఆహారానికి[a], రక్తానికి, గొంతు నులిమి చంపిన జంతువుల మాంసానికి[b], లైంగిక అనైతికతకు[c] దూరంగా ఉండాలి. వీటి నుండి మిమ్మల్ని మీరు కాపాడుకుంటే, మీరు మేలు చేస్తారు. క్షేమంగా ఉండండి.[d]
  rationale: 'మూలంలోని పదార్థం, జాబితా నిర్మాణం, మరియు πορνείαకు ఉన్న వ్యాఖ్యాన-అస్పష్టతను మార్చకుండా రెండు సురక్షితమైన సవరణలు చేశాం: πνικτῶνకు ఆహారసందర్భంలో స్పష్టమైన తెలుగు రూపాన్ని ఇచ్చాం; εὖ πράξετεను సహజమైన, విస్తృతార్థాన్ని నిలిపే ‘మీరు మేలు చేస్తారు’గా మార్చాం. అన్ని పాదసూచిక గుర్తులు పాఠ్యంలో సక్రమంగా నిలిచాయి.'
