  text: So the apostles and the elders gathered together to consider this matter[a][b].
translation:
  language: te
  text: అప్పుడు అపొస్తలులు మరియు పెద్దలు ఈ విషయం గురించి పరిశీలించడానికి సమావేశమయ్యారు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఒకచోట కూడారు,’ ‘సమకూడారు.’ గ్రీకు క్రియ వ్యాకరణపరంగా కర్మణి రూపంలో ఉన్నప్పటికీ, ఈ సందర్భంలో ఆ సమూహం సమావేశమైందని సహజంగా అర్థమవుతుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘ఈ మాట గురించి చూడడానికి.’ ఇక్కడ ‘మాట’ అంటే చర్చలో ఉన్న విషయం లేదా సమస్య.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνήχθησάν
  choice: సమావేశమయ్యారు
  rationale: గ్రీకులో రూపం కర్మణి ప్రయోగమైనప్పటికీ, ఈ సందర్భంలో నాయకులు ఒకచోట కూడి సమావేశమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τε
  choice: కాబట్టి
  rationale: మునుపటి వచనంలోని వివాదానికి ప్రతిస్పందనగా ఈ సమావేశం జరిగిన కథన సంబంధాన్ని సూచిస్తుంది; కణానికి తేలికపాటి అనుసంధాన స్వభావం ఉన్నందున దీనిని ‘అప్పుడు’ లేదా అనువదించకుండా వదలడం కూడా సాధ్యం.
- source_word: οἱ ἀπόστολοι
  choice: అపొస్తలులు
  rationale: అపొస్తలుల కార్యముల సందర్భంలో గుర్తింపు పొందిన అపొస్తల నాయకులను సూచించే స్థిరమైన, స్పష్టమైన తెలుగు పదం.
- source_word: οἱ πρεσβύτεροι
  choice: పెద్దలు
  rationale: కేవలం వయోవృద్ధులను కాక సంఘంలో గుర్తింపు పొందిన నాయకులను సూచిస్తుంది; తరువాతి కాలపు ప్రత్యేక సంఘపాలనా వ్యవస్థను దీనిలోకి దిగుమతి చేయదు.
- source_word: ἰδεῖν
  choice: పరిశీలించడానికి
  rationale: అక్షరార్థంగా ‘చూడడానికి’ అయినా, ఇక్కడ ఒక అంశాన్ని విచారించి పరిగణలోకి తీసుకోవడం అనే deliberative భావం ఉంది; ‘తీర్మానించడానికి’ అనడం ఫలితాన్ని ముందుగానే నిర్ధారించినట్లు అవుతుంది.
- source_word: περὶ τοῦ λόγου τούτου
  choice: ఈ విషయం గురించి
  rationale: λόγος అక్షరార్థంగా ‘మాట’ కావచ్చు; ఈ సందర్భంలో ముందున్న వివాదాస్పద అంశాన్ని సూచిస్తున్నందున ‘విషయం’ సహజంగా భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: యెరూషలేము సమావేశంలో πρεσβύτεροι పదానికి ఉన్న సంస్థాగత భావం
  choice: తరువాతి కాలపు సంఘపాలనా పదవులను రుద్దకుండా ‘పెద్దలు’ అని అనువదించబడింది.
  alternative: తరువాతి సంఘంలోని సాంకేతిక పదవిగా ‘ప్రెస్బిటర్లు’ అని అనువదించడం.
  rationale: వచనం యెరూషలేము సంఘంలోని గుర్తింపు పొందిన నాయకులను పేర్కొంటుంది; అయితే తరువాత అభివృద్ధి చెందిన ఏ ప్రత్యేక సంఘపాలనా వ్యవస్థనూ నిర్బంధంగా సూచించదు.
- issue: సమావేశపు ఆలోచనాత్మక ఉద్దేశం
  choice: ‘పరిశీలించడానికి’ అని ఇచ్చి, అంశాన్ని విచారించే ప్రక్రియను వ్యక్తం చేసింది.
  alternative: ‘తీర్మానించడానికి’ అని ఇచ్చి, ముందే నిర్ణీతమైన విధానపరమైన ఫలితాన్ని సూచించడం.
  rationale: ἰδεῖν ఇక్కడ విషయాన్ని పరిగణించి విచారించడాన్ని సూచిస్తుంది; ఈ కథన దశలో తుది తీర్పును ముందుకు తేవడం సముచితం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘పెద్దలు’ అనే పదం సంఘ నాయకత్వ భావాన్ని నిలుపుతూ తరువాతి మతశాఖల సాంకేతిక పదజాలాన్ని నివారిస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
