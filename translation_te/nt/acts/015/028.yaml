  text: ἔδοξεν γὰρ τῷ ⸂πνεύματι τῷ ἁγίῳ⸃ καὶ ἡμῖν μηδὲν πλέον ἐπιτίθεσθαι ὑμῖν βάρος πλὴν ⸂τούτων τῶν ἐπάναγκες⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/028.yaml
  text: For it seemed good to the Holy Spirit and to us to place on you no greater burden than these necessary things:[a][b]
translation:
  language: te
  text: ఎందుకంటే, ఈ అవసరమైన విషయాలను తప్ప మీపై మరే అదనపు భారం మోపకూడదని పరిశుద్ధాత్మకూ మాకూ మంచిదనిపించింది:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిశుద్ధాత్మకూ మాకూ నిర్ణయమైంది.” గ్రీకు నుడికారాన్ని నిర్ణయసూత్రంగా కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఈ అత్యవసర విషయాలు,” లేదా “ఈ అవసరమైన నియమాలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν
  choice: మంచిదనిపించింది
  rationale: ఇది గ్రీకు నిర్ణయసూత్రంలోని ‘మంచిదిగా తోచింది/నిర్ణయించబడింది’ అనే భావాన్ని నిలుపుతూ, సభ చేసిన ఆలోచనాత్మక నిర్ణయ ధోరణిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: పరిశుద్ధాత్మకు
  rationale: దత్తివిభక్తి ἔδοξεν‌తో కలిసి ‘పరిశుద్ధాత్మకు మంచిదనిపించింది’ అనే వ్యక్తిగత సమ్మతిని సూచిస్తుంది; ‘పరిశుద్ధాత్మ’ ఆధునిక ప్రామాణిక తెలుగు క్రైస్తవ వాడుక.
- source_word: καὶ ἡμῖν
  choice: మాకూ
  rationale: పరిశుద్ధాత్మతో సమాంతరంగా ఉన్న దత్తివిభక్తిని స్పష్టంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: μηδὲν πλέον
  choice: మరే అదనపు ... నీ
  rationale: βάρος‌తో కలిసి ‘ఇంకేమీ ఎక్కువైన/అదనపు భారం కాదు’ అనే తులనాత్మక భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: ἐπιτίθεσθαι
  choice: మోపకూడదని
  rationale: భారాన్ని ఒకరిపై ఉంచడం లేదా విధించడం అనే రూపకాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑμῖν
  choice: మీ మీద
  rationale: భారం మోపబడే గ్రహీతలను స్పష్టంగా సూచిస్తుంది.
- source_word: βάρος
  choice: భారం
  rationale: అన్యజాతి విశ్వాసులపై విధించే బాధ్యతలకు సంబంధించిన మూలపాఠంలోని రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: πλὴν
  choice: తప్ప
  rationale: ప్రతికూల వాక్యం తర్వాత వచ్చే మినహాయింపును సహజంగా తెలియజేస్తుంది.
- source_word: τούτων τῶν ἐπάναγκες
  choice: అవసరమైన ఈ విషయాలు
  rationale: తదుపరి వచనంలో చెప్పబోయే నిర్దిష్ట నియమాలను సూచిస్తూ, వాటి స్వభావాన్ని అతిగా వ్యాఖ్యానించకుండా గ్రీకుకు దగ్గరగా ఉంటుంది.
theological_decisions:
- issue: పరిశుద్ధాత్మకు మరియు సభ నిర్ణయానికి ఉన్న సంబంధం
  choice: ‘పరిశుద్ధాత్మకూ మాకూ మంచిదనిపించింది’ అని సమాంతర సమ్మతిని నిలుపడం
  alternative: ఇది కేవలం మానవ ఏకాభిప్రాయం అని లేదా పరిశుద్ధాత్మ వ్యక్తిత్వంలేని ప్రభావం మాత్రమే అని అనువదించడం
  rationale: గ్రీకులో పరిశుద్ధాత్మ మరియు ‘మేము’ ఒకే దత్తివిభక్తి నిర్మాణంలో సమన్వయింపబడ్డారు. అనువాదం ఈ వ్యక్తిగత కార్యసామర్థ్యాన్ని తగ్గించకుండా, దానిని మించి వివరణ జోడించకుండా ఉంటుంది.
- issue: అన్యజాతి విశ్వాసులపై నిర్ణయపు బలం
  choice: పేర్కొన్న అవసరమైన విషయాలకు మించి అదనపు భారం మోపకూడదనే పరిమితిని వ్యక్తం చేయడం
  alternative: అన్ని బాధ్యతలనూ పూర్తిగా రద్దు చేసినట్లు లేదా మోషే ధర్మశాస్త్రమంతటినీ విధించినట్లు చూపడం
  rationale: మూలపాఠం కొన్ని అవసరమైన విషయాలను మినహాయింపుగా ఉంచుతూ అదనపు భారాన్ని నిరాకరిస్తుంది; ఈ ఉద్రిక్తతను తరువాతి సిద్ధాంత వ్యవస్థలతో పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మోపడం/భారం’ అనే మూల రూపకాన్ని నిలుపుతూ, ‘మంచిదనిపించింది’ అనే నిర్ణయ నుడికారంలోని ఉద్దేశపూర్వకమైనప్పటికీ అతిశయింపని ధోరణిని సంరక్షించింది.
