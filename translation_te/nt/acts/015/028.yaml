  rationale: The revision preserves the source’s decision formula and coordinated reference to the Holy Spirit and the human senders. It clarifies that the stated necessary matters are the exception or limit to the otherwise excluded additional burden, rather than appearing to be excluded from consideration. The footnote alternative is adjusted to reflect the Greek impersonal decision idiom more closely, without importing doctrinal interpretation.
