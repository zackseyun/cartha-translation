- from: ఎందుకంటే, అవసరమైన ఈ విషయాలు తప్ప మరే అదనపు భారాన్నీ మీ మీద మోపకూడదని పరిశుద్ధాత్మకూ మాకూ మంచిదనిపించింది:[a][b]
