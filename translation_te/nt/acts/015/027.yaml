translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘వారు స్వయంగా’ అనే రూపం మూలంలోని ఉద్ఘాటనను నిలుపుతుంది; ‘నోటిమాటగా’ అనేది వ్రాత లేఖకు భిన్నమైన మౌఖిక సమాచారాన్ని స్పష్టం చేస్తుంది.
