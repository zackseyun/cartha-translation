  to: కాబట్టి మేము యూదాను, సీలను పంపాము[a]. వారు స్వయంగా అవే విషయాలను మాటల ద్వారా తెలియజేస్తారు[b].
  rationale: The revision removes an implicit recipient not stated in the Greek, replaces a potentially causative verb with the direct and natural Telugu equivalent for ‘sent,’ and uses a clearer formal expression for oral communication. The perfect-tense nuance remains appropriately noted, and both footnote anchors are retained and correctly placed.
