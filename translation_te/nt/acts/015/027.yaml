id: ACT.15.27
reference: Acts 15:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεστάλκαμεν οὖν Ἰούδαν καὶ Σιλᾶν, καὶ αὐτοὺς διὰ λόγου ἀπαγγέλλοντας τὰ αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/027.yaml
  text: Therefore we have sent Judas and Silas[b][a], who themselves will report the same things by word of mouth.
translation:
  language: te
  text: కాబట్టి మేము యూదాను, సీలను పంపాము[a]. వారు స్వయంగా అవే విషయాలను మాటల ద్వారా తెలియజేస్తారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు క్రియారూపం ‘పంపాము’ అనే గత చర్యకు ప్రస్తుత సందర్భంలో కొనసాగుతున్న ఫలితం ఉందనే భావాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘మాట ద్వారా’; అంటే, లేఖతోపాటు మౌఖికంగా కూడా.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεστάλκαμεν
  choice: మేము ... పంపించాము
  rationale: గ్రీకు పరిపూర్ణ కాలం పంపడం పూర్తయి, దాని ఫలితం ప్రస్తుత సందర్భంలో కొనసాగుతున్నదని సూచిస్తుంది. తెలుగులో సహజమైన భూతకాల రూపమైన ‘పంపించాము’ను వాడి, ఆ కాలసూక్ష్మతను పాదటిప్పణిలో తెలిపాం.
- source_word: οὖν
  choice: కాబట్టి
  rationale: మునుపటి వాక్యాల్లో చెప్పిన సభ నిర్ణయానికి ఈ చర్యను తార్కిక పరిణామంగా అనుసంధానిస్తుంది.
- source_word: Ἰούδαν καὶ Σιλᾶν
  choice: యూదాను, సీలను
  rationale: వ్యక్తుల పేర్లను ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, కర్మ విభక్తితో ఇచ్చాం.
- source_word: αὐτοὺς
  choice: వారు స్వయంగా
  rationale: లేఖలోని విషయాలను ఈ దూతలే వ్యక్తిగతంగా ధృవీకరిస్తారనే గ్రీకు సర్వనామంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: διὰ λόγου
  choice: నోటిమాటగా
  rationale: వ్రాతపూర్వక లేఖకు తోడుగా మాటల ద్వారా తెలియజేయడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀπαγγέλλοντας
  choice: తెలియజేస్తారు
  rationale: గ్రీకులో వర్తమాన అసమాపక క్రియగా ఉన్నా, పంపబడిన యూదా సీలలు చేరిన తరువాత చేయబోయే పనిని తెలుగులో సహజమైన భవిష్యదర్థక క్రియతో తెలియజేస్తుంది.
- source_word: τὰ αὐτά
  choice: అవే సంగతులను
  rationale: సభ రాసిన లేఖలోని విషయాలనే వారు మాటలతో కూడా తెలియజేస్తారని నేరుగా సూచిస్తుంది; ‘సందేశం’ అని ఏకవచన భావాన్ని చేర్చదు.
