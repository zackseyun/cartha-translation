  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Συμεὼν ἐξηγήσατο καθὼς πρῶτον ὁ θεὸς ἐπεσκέψατο λαβεῖν ἐξ ἐθνῶν ⸀λαὸν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/014.yaml
  text: Simeon has recounted how God first visited the Gentiles to take from them a people for his name[a][b][c].
translation:
  language: te
  text: సిమెయోను[a], దేవుడు మొదట యూదేతరులలోనుండి[b] తన నామం కోసం ఒక ప్రజను తీసుకోవడానికి వారిపట్ల శ్రద్ధ చూపిన విధానాన్ని వివరించాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సీమోను.’ ఇక్కడ యాకోబు ‘సిమెయోను’ అనే రూపాన్ని ఉపయోగిస్తున్నాడు.
    reason: lexical_alternative
  - marker: b
    text: మూలంలో, ‘జనాంగాల మధ్యనుండి.’ ఇక్కడ అది యూదులు కానివారిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: అంటే, దేవునికి చెందినవారిగా, ఆయన నామంతో గుర్తింపుపొందిన ఒక ప్రజను.
    reason: cultural_note
lexical_decisions:
- source_word: Συμεὼν
  choice: సిమెయోను
  rationale: మూలంలో ఉన్న ప్రత్యేకమైన ‘సిమెయోను’ రూపాన్ని నిలిపి, మరింత పరిచితమైన ‘సీమోను’తో సమన్వయం చేయలేదు.
- source_word: ἐξηγήσατο
  choice: వివరించాడు
  rationale: సభకు ఇంతకుముందు చెప్పిన సంగతిని క్రమంగా తెలియజేశాడనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καθὼς
  choice: ఎలా
  rationale: వివరించిన విషయపు విధానాన్ని/విషయవస్తువును పరిచయం చేసే మూల నిర్మాణాన్ని సహజంగా నిలుపుతుంది.
- source_word: πρῶτον
  choice: మొదట
  rationale: యూదేతరుల పట్ల దేవుని కార్యంలో ఆరంభ దశను సూచిస్తుంది.
- source_word: ἐπεσκέψατο
  choice: దృష్టి సారించి … కార్యం చేశాడు
  rationale: కేవలం చూడటం కాక, శ్రద్ధతో కూడిన ఉద్దేశపూర్వక దైవ జోక్యాన్ని ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘సందర్శించాడు’ అనే అసహజ లేదా భౌతిక సందర్శన భావాన్ని నివారిస్తుంది.
- source_word: λαβεῖν
  choice: ఏర్పరచుకోవడానికి
  rationale: అక్షరార్థంగా ‘తీసుకోవడానికి’; ఈ సందర్భంలో జనాంగాల మధ్యనుండి తనకు ఒక ప్రజను స్వీకరించాలనే ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐξ ἐθνῶν
  choice: యూదేతరులవైపు … వారిలోనుండి
  rationale: అపొస్తలుల కార్యాలు 15 సందర్భంలో ἔθνη యూదులు కానివారిని సూచిస్తుంది; ἐξ భావాన్ని ‘వారిలోనుండి’ స్పష్టంగా నిలుపుతుంది.
- source_word: λαὸν
  choice: ఒక ప్రజను
  rationale: జాతి పరిమితి కంటే దేవునితో గుర్తింపుపొందిన సమూహమనే బైబిలీయ ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: తన నామం కోసం
  rationale: ‘తన కోసం’ అని సులభీకరించకుండా, మూలంలోని నామ సంబంధమైన ఒడంబడిక భాషను నిలుపుతుంది.
theological_decisions:
- issue: ἐξ ἐθνῶνను ‘జనాంగాలు’గా లేదా ‘యూదేతరులు’గా అనువదించడం
  choice: యూదేతరులు
  alternative: జనాంగాలు
  rationale: అపొస్తలుల కార్యాలు 15లో ప్రధాన అంశం యూదులు కానివారు దేవుని ప్రజల్లో చేర్చబడటం; అందువల్ల సందర్భార్థాన్ని స్పష్టపరుస్తూ యూదు–యూదేతర భేదాన్ని నిలుపుతుంది.
- issue: τῷ ὀνόματι αὐτοῦను ‘తన కోసం’గా విపులీకరించాలా
  choice: తన నామం కోసం
  alternative: తన కోసం
  rationale: మూలంలోని గంభీరమైన బైబిలీయ నుడికారాన్ని, దేవునికి చెందడం మరియు ఆయన నామంతో గుర్తింపుపొందడం అనే అర్థ విస్తృతిని పరిష్కరించకుండా నిలుపుతుంది.
- issue: ἐπεσκέψατοను భౌతిక సందర్శనగా చూపాలా
  choice: దృష్టి సారించి … కార్యం చేశాడు
  alternative: సందర్శించాడు
  rationale: ఈ క్రియలో శ్రద్ధతో కూడిన దైవ జోక్యం ఉంది; తెలుగు ‘సందర్శించాడు’ కేవలం వచ్చి చూసిన భావాన్ని కలిగించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, బహిరంగ పఠనానికి అనువైన శైలి. ‘తన నామం కోసం’ అనే బైబిలీయ నుడికారాన్ని ఉద్దేశపూర్వకంగా నిలిపి, పాదటిప్పణిలో దాని భావాన్ని వివరించాం.
