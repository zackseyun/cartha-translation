  source_fidelity: ముసాయిదా ప్రధానార్థాన్ని సరిగ్గా అందిస్తుంది; అయితే ἐπεσκέψατοకు ఉన్న ఉద్దేశపూర్వక శ్రద్ధను ‘దృష్టి సారించి … కార్యం చేశాడు’ అని రెండు క్రియలుగా విస్తరించింది. ‘కార్యం చేశాడు’ మూలంలో లేని అదనపు నిర్దిష్టతను చేర్చి, λαβεῖνకు సంబంధించిన ఉద్దేశాన్ని కొంత అస్పష్టం చేస్తుంది. సవరణలో ఒకే దైవిక చర్యను నిలిపి, దాని ఉద్దేశాన్ని స్పష్టంగా అనుసంధానించాం.
  naturalness: ‘యూదేతరులవైపు దృష్టి సారించి’ కంటే ‘యూదేతరులలోనుండి’ అనేది ἐξ ἐθνῶνను నేరుగా, సహజంగా తెలియజేస్తుంది. ‘వారిపట్ల శ్రద్ధ చూపిన విధానాన్ని’ అనేది ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, సందర్భానుసారమైన దైవిక సందర్శన/శ్రద్ధ భావాన్ని వ్యక్తపరుస్తుంది.
  terminology: ‘సిమెయోను,’ ‘యూదేతరులు,’ ‘ఒక ప్రజ,’ ‘తన నామం కోసం’ అనే ఎంపికలు తగినవి. ‘సీమోను’ ప్రత్యామ్నాయ రూపంపై, అలాగే ‘జనాంగాలు’ అనే అక్షరసమీప ప్రత్యామ్నాయంపై పాదటిప్పణులు ఉపయోగకరంగా ఉన్నాయి. నామ-సంబంధిత నుడికారానికి వివరణాత్మక పాదటిప్పణిని నిలిపాం.
