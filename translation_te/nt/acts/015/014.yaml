  to: సిమెయోను[a], దేవుడు మొదట యూదేతరులలోనుండి[b] తన నామం కోసం ఒక ప్రజను తీసుకోవడానికి వారిపట్ల శ్రద్ధ చూపిన విధానాన్ని వివరించాడు[c].
  rationale: 'సవరణ మూలవాక్యంలోని క్రమాన్ని మరియు ఉద్దేశ సంబంధాన్ని మరింత దగ్గరగా ప్రతిబింబిస్తుంది: సిమెయోను చెప్పినది దేవుడు యూదేతరులపట్ల శ్రద్ధ చూపిన విధానం గురించి; ఆ శ్రద్ధ యొక్క ఉద్దేశం వారిలోనుండి తన నామం కోసం ఒక ప్రజను తీసుకోవడం. మూలంలో లేని ‘కార్యం చేశాడు’ అనే విస్తరణను తొలగించాం. వివాదాస్పదత లేని ఈ సందర్భార్థాన్ని అతిగా వ్యాఖ్యానించకుండా నిలిపాం.'
