source:
  edition: SBLGNT
  text: ἀνθρώποις παραδεδωκόσι τὰς ψυχὰς αὐτῶν ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/026.yaml
  text: men who have given up their lives for the name of our Lord Jesus the Messiah[a][b].
translation:
  language: te
  text: మన ప్రభువైన యేసు మెస్సీయ యొక్క నామం కోసం తమ ప్రాణాలను పణంగా పెట్టిన మనుషులు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమ ప్రాణాలను అప్పగించిన.’ గ్రీకులో పదశః ఇలాగే ఉంది; ఇక్కడ ఇది ప్రాణాంతక ప్రమాదానికి తమను తాము గురిచేసుకున్నారని తెలిపే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ‘యేసు క్రీస్తు’; Χριστός అనే బిరుదుకు ‘మెస్సీయ’ అని అర్థం.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνθρώποις
  choice: మనుషులు
  rationale: ఇక్కడ ఈ పదం ముందటి వాక్యభాగంలోని బర్నబా, పౌలులను సూచిస్తుంది. అందువల్ల వ్యక్తులను సూచించే స్పష్టమైన సాధారణ పదంగా ‘మనుషులు’ వాడబడింది.
- source_word: παραδεδωκόσι τὰς ψυχὰς αὐτῶν
  choice: తమ ప్రాణాలను పణంగా పెట్టిన
  rationale: పదశః ‘తమ ప్రాణాలను అప్పగించిన’ అని ఉన్నా, ఈ సందర్భంలో ప్రాణాంతక ప్రమాదానికి తమను తాము గురిచేసుకున్నారనే భావం. వారు అప్పటికే మరణించారని చెప్పకుండా, తెలుగు సహజ నుడికారంలో ఆ తీవ్రతను ‘ప్రాణాలను పణంగా పెట్టిన’ తెలియజేస్తుంది.
- source_word: ὑπὲρ
  choice: కోసం
  rationale: షష్ఠీ విభక్తితో వచ్చిన ὑπέρ ఇక్కడ కారణం లేదా నిమిత్తాన్ని సూచిస్తుంది; ‘కోసం’ సహజమైన, సంక్షిప్తమైన తెలుగు రూపం.
- source_word: τοῦ ὀνόματος
  choice: నామం
  rationale: ‘నామం’ అనే బైబిలు ప్రయోగం వ్యక్తి, అధికారం, ఘనత అనే విస్తృత భావాలను నిలుపుతుంది; దానిని కేవలం ‘ప్రతిష్ఠ’ లేదా ‘అధికారం’గా పరిమితం చేయలేదు.
- source_word: τοῦ κυρίου ἡμῶν
  choice: మన ప్రభువైన
  rationale: κύριος లోని గౌరవ, అధికార భావాలను ‘ప్రభువు’ నిలుపుతుంది. తెలుగు వాక్య నిర్మాణంలో యేసుతో సహజంగా కలపడానికి ‘ప్రభువైన’ అని ఇచ్చాం.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστός ఇక్కడ యేసుకు చెందిన బిరుదుగా ఉంది. దాని ‘మెస్సీయ’ భావాన్ని స్పష్టంగా నిలపడానికి తెలుగు పాఠ్యంలో ‘యేసు మెస్సీయ’ అని ఇచ్చాం.
theological_decisions:
- issue: παραδεδωκόσι అనే పదబంధం నిజంగా మరణించడాన్ని సూచిస్తుందా, లేక ప్రాణాంతక ప్రమాదాన్ని స్వీకరించడాన్నా?
  choice: తమ ప్రాణాలను పణంగా పెట్టిన
  alternative: తమ ప్రాణాలను అప్పగించిన
  rationale: బర్నబా, పౌలు ఇంకా జీవించి ఉన్నందున ఇక్కడ నిజంగా ప్రాణాలు కోల్పోయారనే అర్థం కాదు. అయితే గ్రీకు పదంలోని బలమైన అర్పణ, ప్రమాద భావాన్ని కూడా తగ్గించకుండా ‘పణంగా పెట్టిన’ అని అనువదించాం.
- issue: Χριστοῦను ‘క్రీస్తు’గా ఉంచాలా, దాని బిరుదు భావాన్ని ‘మెస్సీయ’గా తెలియజేయాలా?
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ అధికారిక బిరుదుల వరుసలో Χριστός కేవలం పేరులో భాగంగా కాక, ‘మెస్సీయ’ అనే బిరుదుగా పనిచేస్తుంది. అందువల్ల దాని బిరుదు భావాన్ని పాఠ్యంలో స్పష్టంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన బైబిలు శైలిని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా అనువదించబడింది. ఈ వచనం వ్యాకరణపరంగా 25వ వచనంలోని వాక్యానికి కొనసాగింపు కావడం వల్ల మూలంలోని ఖండవాక్య స్వభావం నిలుపబడింది.
