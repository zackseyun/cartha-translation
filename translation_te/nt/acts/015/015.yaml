  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τούτῳ συμφωνοῦσιν οἱ λόγοι τῶν προφητῶν, καθὼς γέγραπται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/015.yaml
  text: 'And with this the words of the prophets agree[a], just as it is written:'
translation:
  language: te
  text: 'దీనితో ప్రవక్తల మాటలు ఏకీభవిస్తున్నాయి; వ్రాయబడి ఉన్నట్టుగా:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: -తో
  rationale: తెలుగులో ముందున్న విషయానికి ఈ వాక్యాన్ని సహజంగా అనుసంధానించడానికి ‘దీనితో’లోని ‘-తో’ సరిపోతుంది; విడిగా ‘మరియు’ చేర్చడం కృత్రిమంగా ఉంటుంది.
- source_word: τούτῳ
  choice: దీనితో
  rationale: ఈ నపుంసకలింగ సూచన సర్వనామం ముందున్న విషయం లేదా వాదనను విస్తృతంగానే సూచిస్తుంది. ‘దీనితో’ గ్రీకు దత్తివిభక్తి భావాన్నీ ముందుకు తెచ్చిన ఉద్ఘాటననూ సహజంగా నిలుపుతుంది.
- source_word: συμφωνοῦσιν
  choice: ఏకీభవిస్తున్నాయి
  rationale: వర్తమానకాలంలోని ‘ఒకే స్వరంలో ఉండడం/సమ్మతించడం’ అనే భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: οἱ λόγοι
  choice: మాటలు
  rationale: ఇక్కడ లిఖితరూపంలో ఉదహరించబడే ప్రవచన వాక్యాలను సూచిస్తుంది; ‘మాటలు’ నేరుగా ఉండి సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: τῶν προφητῶν
  choice: ప్రవక్తల
  rationale: గ్రీకు సంబంధార్థక షష్ఠీ విభక్తిని తెలుగులో సహజమైన సంబంధరూపంతో వ్యక్తం చేస్తుంది.
- source_word: καθὼς
  choice: ఉన్నట్టుగా
  rationale: తరువాత వచ్చే లేఖన ఉల్లేఖనం ముందటి ప్రకటనకు అనుగుణంగా ఉందనే పోలిక భావాన్ని తెలియజేస్తుంది.
- source_word: γέγραπται
  choice: వ్రాయబడి
  rationale: లేఖన ఉల్లేఖనానికి వాడే సంపూర్ణ కర్మణి రూపాన్ని నిలుపుతుంది; ‘వ్రాయబడి ఉన్నట్టుగా’ అంటే వ్రాయబడినది ఇప్పటికీ నిలిచి ఉందనే భావం వస్తుంది.
theological_decisions:
- issue: τούτῳ దేనిని సూచిస్తుంది?
  choice: ముందుగా చెప్పబడిన విషయం లేదా సంఘటనను విస్తృతంగా సూచించే ‘దీనితో’
  alternative: అన్యజనుల మారుమనస్సు, పేతురు చెప్పిన మాట, లేదా దేవుని సంకల్పం అని నిర్దిష్టంగా పేర్కొనడం
  rationale: గ్రీకు పాఠం సూచ్యాన్ని స్పష్టంగా పరిమితం చేయదు. అందువల్ల అనువాదం ఒక ప్రత్యేక వ్యాఖ్యానాన్ని రుద్దకుండా దాని విస్తృతతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేఖన ఉల్లేఖనానికి తగిన గౌరవప్రదమైన శైలి. తెలుగులో ‘దీనితో ... ఏకీభవిస్తున్నాయి’ సహజంగా ఉన్నందున ఆంగ్లంలో అవసరమైన దత్తివిభక్తి ప్రత్యామ్నాయ పాదటిప్పణి ఇక్కడ అవసరం లేదు.
