  yaml_path: translation/nt/acts/015/040.yaml
  text: But Paul chose Silas and departed[b][a], having been commended by the brothers to the grace of the Lord.
translation:
  language: te
  text: అయితే పౌలు సీలాసును ఎంచుకొని బయలుదేరాడు; సహోదరులు అతణ్ణి ప్రభువు కృపకు అప్పగించారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రభువు కృపకు ఒప్పగించారు.’
    reason: lexical_alternative
  - marker: b
    text: ‘సహోదరులు’ అనే పదం సందర్భానుసారంగా స్త్రీలతో సహా విశ్వాసుల సమాజమంతటినీ సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వచనంలో బర్నబా బయలుదేరిన దానికి భిన్నంగా పౌలు చేసినదాన్ని చూపించే స్వల్ప వ్యతిరేక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπιλεξάμενος
  choice: ఎంచుకొని
  rationale: పౌలు బయలుదేరకముందు సీలను స్వయంగా ఎంచుకున్నాడనే పూర్వకాల మధ్యమ కృదంత భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: Σιλᾶν
  choice: సీలను
  rationale: వ్యక్తి పేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించి, కర్మవిభక్తితో ఇచ్చింది.
- source_word: ἐξῆλθεν
  choice: బయలుదేరాడు
  rationale: ప్రయాణ కథనంలో ‘ప్రయాణానికి బయలుదేరడం’ అనే సందర్భోచిత భావాన్ని ఇస్తుంది.
- source_word: παραδοθεὶς
  choice: అప్పగించారు
  rationale: సంఘం పౌలును ప్రభువు కృపాపూర్వక సంరక్షణకు అప్పగించిందనే నిష్క్రియ కృదంత భావాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో కర్తరి వాక్యంగా వ్యక్తం చేస్తుంది; ‘నమ్మి అప్పగించడం’ అనే ప్రత్యామ్నాయ ఛాయను పాదసూచికలో ఉంచింది.
- source_word: τῇ χάριτι
  choice: కృపకు
  rationale: χάρις అనే ముఖ్యమైన ధార్మిక నామవాచకాన్ని వ్యాఖ్యాత్మకంగా ‘కృపగల సంరక్షణ’ అని విస్తరించకుండా నిలుపుతుంది.
- source_word: τοῦ κυρίου
  choice: ప్రభువు
  rationale: మూలంలో ఉన్న κύριος బిరుదును దాని సూచిత వ్యక్తి యేసా లేక తండ్రియైన దేవుడా అని అదనంగా నిర్ధారించకుండా అనువదిస్తుంది.
- source_word: ὑπὸ τῶν ἀδελφῶν
  choice: సహోదరులు
  rationale: వ్యాకరణపరంగా పుంలింగ బహువచనమైన పదాన్ని నిలుపుతూ, సందర్భంలో స్త్రీలతో సహా విశ్వాసుల సమాజాన్ని సూచించవచ్చనే విషయాన్ని పాదసూచికలో తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ప్రభువు’ అనే బిరుదు ఎవరిని సూచిస్తుంది
  choice: ప్రభువు
  alternative: ప్రభువైన యేసు; దేవుడు
  rationale: గ్రీకు పాఠం κύριος అని మాత్రమే చెబుతుంది. మూలంలో లేని నిర్దిష్టీకరణను చేర్చకుండా దాని ఉద్దేశపూర్వక అస్పష్టతను నిలిపింది.
- issue: ‘సహోదరులు’ అనే పదం పరిధి
  choice: ప్రధాన పాఠంలో ‘సహోదరులు’; సందర్భానుసార విస్తృత అర్థం పాదసూచికలో
  alternative: సహోదర సహోదరీలు; తోటి విశ్వాసులు
  rationale: ἀδελφῶν పుంలింగ బహువచనం; అయితే తొలి క్రైస్తవ సమాజ సందర్భంలో స్త్రీలను కూడా కలుపుకొని విస్తృత విశ్వాస సమాజాన్ని సూచించవచ్చు. రూపాన్ని ప్రధాన పాఠంలో, సందర్భార్థాన్ని పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. గ్రీకు కృదంతాలన్నిటినీ బరువైన ఉపవాక్యంగా మార్చకుండా రెండు సహజ వాక్యాలుగా ఇచ్చింది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠంలో ఉంది.
