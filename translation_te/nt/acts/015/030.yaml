id: ACT.15.30
reference: Acts 15:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν ἀπολυθέντες ⸀κατῆλθον εἰς Ἀντιόχειαν, καὶ συναγαγόντες τὸ πλῆθος ἐπέδωκαν τὴν ἐπιστολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/030.yaml
  text: So[a], after being sent off, they went down to Antioch, and after gathering the multitude[c][b], they delivered the letter.
translation:
  language: te
  text: కాబట్టి వారు పంపివేయబడిన తరువాత[a], అంతియొకయకు దిగివెళ్లారు[b]. అక్కడ సమూహాన్ని[c] సమావేశపరచి, ఆ ఉత్తరాన్ని వారికి అందజేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వెళ్లనివ్వబడిన తరువాత,’ ‘వీడ్కోలు ఇవ్వబడిన తరువాత.’ గ్రీకు కృదంతం అధికారపూర్వకంగా పంపివేయడం లేదా వెళ్లనివ్వడం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘దిగివెళ్లారు’ అనే మాట గ్రీకు క్రియలోని దిశాభావాన్ని ప్రతిబింబిస్తుంది; ఇది బహుశా ఎత్తైన యెరూషలేము నుండి అంతియొకయకు చేసిన ప్రయాణాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా ‘సభను,’ ‘సమాజాన్ని.’ ఈ పదబంధం అంతియొకయలో కూడినవారి సమూహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολυθέντες
  choice: పంపివేయబడిన తరువాత
  rationale: ఈ కృదంతం అధికారపూర్వకంగా వెళ్లనివ్వడం లేదా పంపివేయడం అనే భావాన్ని ఇస్తుంది. సందర్భంలో యెరూషలేము సమావేశం వారిని పంపిన సంగతి ఉన్నందున ఈ ప్రయోగం సహజంగా సరిపోతుంది; ‘విడుదల చేయబడిన’ అనే భావానికి మాత్రమే పరిమితం చేయదు.
- source_word: κατῆλθον
  choice: దిగివెళ్లారు
  rationale: యెరూషలేము ఎత్తైన ప్రదేశం నుండి అంతియొకయ వైపు ప్రయాణించడాన్ని సూచించే క్రియలోని దిగువ దిశాభావాన్ని నిలుపుతుంది.
- source_word: συναγαγόντες
  choice: సమావేశపరచి
  rationale: ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సహజమైన తెలుగు క్రమంలో తెలియజేస్తుంది.
- source_word: τὸ πλῆθος
  choice: సమూహాన్ని
  rationale: ఈ పదబంధం అంతియొకయలో కూడిన విశ్వాసుల సముదాయాన్ని సూచిస్తుంది. ‘సంఘం’ వంటి మరింత నిర్దిష్టమైన సంఘపరమైన పదాన్ని ముందుగానే నిర్ణయించకుండా మూలంలోని విస్తృతతను కాపాడుతుంది.
- source_word: ἐπέδωκαν
  choice: అందజేశారు
  rationale: ఉత్తరాన్ని కూడినవారికి అధికారికంగా అప్పగించడం లేదా సమర్పించడం అనే సందర్భోచిత భావాన్ని తెలియజేస్తుంది.
- source_word: ἐπιστολήν
  choice: ఉత్తరాన్ని
  rationale: ఆధునిక ప్రామాణిక తెలుగులో వ్రాతపూర్వక సందేశానికి సహజమైన, సులభంగా అర్థమయ్యే పదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని వరుస చర్యలు—పంపివేయబడటం, దిగివెళ్లటం, సమూహాన్ని సమావేశపరచటం, ఉత్తరాన్ని అందజేయటం—స్పష్టంగా నిలుపబడ్డాయి. ‘సమూహం’ ద్వారా τὸ πλῆθος యొక్క ఉద్దేశపూర్వక విస్తృతతను కాపాడాం.
