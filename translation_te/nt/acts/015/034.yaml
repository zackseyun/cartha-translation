translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. మూలంలోని అవ్యక్త గ్రీకు ప్రయోగాన్ని పదేపదే కాకుండా సహజమైన తెలుగు నిర్ణయ-వ్యక్తీకరణతో అందించాం. పాఠభేదానికి సంబంధించిన ముఖ్యమైన ఆధారాలను పాదసూచికలో నిలిపాం.
