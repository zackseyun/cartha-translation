source:
  edition: SBLGNT
  text: ἐγένετο ⸀δὲ παροξυσμὸς ὥστε ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων, τόν τε Βαρναβᾶν παραλαβόντα τὸν Μᾶρκον ἐκπλεῦσαι εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/039.yaml
  text: And there arose such a sharp disagreement that they separated from one another[a], and Barnabas took Mark and sailed away to Cyprus,
translation:
  language: te
  text: అప్పుడు వారి మధ్య ఎంత తీవ్రమైన విభేదం తలెత్తిందంటే, వారు ఒకరి నుండి ఒకరు విడిపోయారు.[a] బర్నబా మార్కును వెంటబెట్టుకొని ఓడలో కుప్రకు బయలుదేరాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తీవ్రమైన ఘర్షణ జరిగింది.” గ్రీకు పదం బలమైన రెచ్చగొట్టడాన్ని లేదా తీవ్రమైన ఘర్షణను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: అప్పుడు ... తలెత్తింది
  rationale: కథనంలో కొత్త పరిణామాన్ని పరిచయం చేసే γίνομαι–δέ కలయికను సహజమైన ఆధునిక తెలుగు కథనశైలిలో వ్యక్తం చేస్తుంది; δέకు అతిగా వ్యతిరేకార్థం ఇవ్వదు.
- source_word: παροξυσμὸς
  choice: తీవ్రమైన విభేదం
  rationale: ఇక్కడ అంతర్గత చికాకు మాత్రమే కాక పౌలు, బర్నబాల మధ్య జరిగిన బలమైన అభిప్రాయ ఘర్షణను సూచిస్తుంది. ఈ పదబంధం సంఘటన తీవ్రతను స్పష్టంగా, అతిశయోక్తి లేకుండా తెలియజేస్తుంది.
- source_word: ὥστε
  choice: ఎంత ... అంటే
  rationale: ὥστεతో కూడిన ఫలిత నిర్మాణంలోని తీవ్రత–ఫలితం సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων
  choice: వారు ఒకరినొకరు విడిపోయారు
  rationale: పరస్పరం వేరైపోవడాన్ని స్పష్టంగా తెలుపుతూ, గ్రీకు అన్యోన్య పదబంధాన్ని కాపాడుతుంది.
- source_word: τόν τε Βαρναβᾶν
  choice: బర్నబా
  rationale: τε తరువాతి వచనంలో పౌలు చేసిన చర్యతో జతకట్టే మొదటి భాగాన్ని సూచిస్తుంది. తెలుగులో కొత్త వాక్యంతో పేరు ఉంచడం కథన ప్రవాహాన్ని సహజంగా చేస్తుంది.
- source_word: παραλαβόντα τὸν Μᾶρκον
  choice: మార్కును వెంటబెట్టుకొని
  rationale: παραλαμβάνωలోని ‘తనతో తీసుకువెళ్లడం’ అనే భావాన్ని సహజంగా, సంక్షిప్తంగా అందిస్తుంది; మూలంలో ఉన్నట్లే ‘మార్కు’ అనే పేరునే ఉంచుతుంది.
- source_word: ἐκπλεῦσαι εἰς Κύπρον
  choice: ఓడలో కుప్రకు బయలుదేరాడు
  rationale: ἐκπλέωలోని సముద్రమార్గంగా ప్రయాణమై వెళ్లడం మరియు బయలుదేరడం అనే భావాలను రెండింటినీ స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: అపొస్తల సేవకుల మధ్య ఘర్షణను కథనం చిత్రించే విధానం
  choice: తీవ్రమైన విభేదం అని నేరుగా అనువదించడం
  alternative: తీవ్రమైన వాగ్వాదం; తీవ్రమైన ఘర్షణ
  rationale: ఈ వచనం బర్నబా, పౌలు మధ్య నిజమైన, తీవ్రమైన విభేదాన్ని తెలియజేస్తుంది. దాన్ని తగ్గించకుండా, అలాగే మూలపదం చెప్పేదానికంటే ఎక్కువగా నైతిక తీర్పు జోడించకుండా అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. ఘర్షణ తీవ్రతను తగ్గించకుండా, ఎవరి పక్షానా వ్యాఖ్యానాత్మక తీర్పు చేర్చలేదు.
