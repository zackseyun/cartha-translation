  text: ἀλλὰ διὰ τῆς χάριτος τοῦ κυρίου Ἰησοῦ πιστεύομεν σωθῆναι καθ’ ὃν τρόπον κἀκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/011.yaml
  text: But through the grace of the Lord Jesus we believe that we will be saved[b][a], just as they also will be.
translation:
  language: te
  text: అయితే ప్రభువైన యేసు కృప ద్వారా మనం రక్షించబడతామని నమ్ముతున్నాం; వారు కూడా అదే విధంగా రక్షించబడతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “ప్రభువైన యేసు కృప ద్వారా మనం రక్షించబడతామని నమ్ముతున్నాం, వారు కూడా అదే విధంగా.”'
    reason: గ్రీకులో ‘రక్షించబడడం’ అనే క్రియ ‘మనం’తో ప్రత్యక్షంగా ఉంది; పోలికలో ‘వారు కూడా’ తర్వాత ఆ క్రియ భావం అన్వయించబడుతుంది.
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: ముందటి వాక్యంలో మోయలేని కాడి గురించి చెప్పిన దానికి బలమైన వ్యతిరేకతను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: διὰ τῆς χάριτος
  choice: కృప ద్వారానే
  rationale: διά + షష్ఠీ విభక్తి సాధనం లేదా మాధ్యమాన్ని సూచిస్తుంది. సందర్భంలోని బలమైన వ్యత్యాసాన్ని ‘ఏ’ నొక్కిచెబుతుంది; కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
- source_word: χάριτος
  choice: కృప
  rationale: రక్షణకు సాధనంగా ఉన్న దేవుని అనుగ్రహాన్ని తెలిపే స్థిరమైన, సహజమైన తెలుగు పదం.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: ప్రభువైన యేసు
  rationale: షష్ఠీ సంబంధాన్ని ‘ప్రభువైన యేసు కృప’ అనే సహజ తెలుగు నిర్మాణం చూపిస్తుంది.
- source_word: πιστεύομεν
  choice: మనం … నమ్ముతున్నాం
  rationale: మాట్లాడేవారితో కూడిన సమూహాన్ని సూచించే ప్రథమ పురుష బహువచనాన్ని, దృఢ విశ్వాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: σωθῆναι
  choice: రక్షించబడతామని
  rationale: అనంతరూపంలోని కర్మణి భావాన్ని తెలుగులో సహజమైన విషయవాచక క్రియారూపంగా ఇస్తూ, సందర్భంలో ఆశించబడే రక్షణను సూచిస్తుంది.
- source_word: καθ’ ὃν τρόπον
  choice: అదే విధంగా
  rationale: రీతి మరియు పోలిక రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: κἀκεῖνοι
  choice: వారు కూడా
  rationale: καὶ ἐκεῖνοι లోని ‘కూడా’ భావాన్ని నిలిపి, యూద విశ్వాసుల రక్షణను అన్యజనుల రక్షణతో పోల్చే గ్రీకు వాక్యదిశను కాపాడుతుంది.
theological_decisions:
- issue: పేతురు చేసిన పోలిక యొక్క దిశ
  choice: ‘మనం’ రక్షించబడే విధానాన్ని ‘వారు కూడా’ రక్షించబడే విధానంతో పోల్చడం
  alternative: వారు మనలాగే రక్షించబడతారని వాక్యాన్ని తలకిందులుగా చెప్పడం
  rationale: గ్రీకు పాఠం ‘మనం నమ్ముతున్నాం/రక్షించబడతాం’ అనే అంశాన్ని ముందుంచి, దాన్ని ‘వారు కూడా’ అనే వర్గంతో పోలుస్తుంది. అన్యజనులు యూదులుగా మారాల్సిన అవసరం లేదనే సందర్భోచిత నొక్కును ఇది కాపాడుతుంది.
- issue: కృప ద్వారా రక్షణ స్వభావం
  choice: రక్షణ ప్రభువైన యేసు కృప ద్వారా కలుగుతుందని మాత్రమే అనువదించడం
  alternative: ‘కృపచేత మాత్రమే, విశ్వాసం ద్వారా మాత్రమే’ వంటి విస్తరించిన సిద్ధాంత సూత్రాలను చేర్చడం
  rationale: మూలవాక్యం చెప్పిన కృపను, నమ్మకాన్ని నిలుపుతూ, అందులో లేని సంప్రదాయపరమైన సిద్ధాంత పదబంధాలను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. వాక్యదిశను స్పష్టంగా ఉంచేందుకు దీర్ఘవిరామ చిహ్నం ఉపయోగించబడింది; మూలంలోని పోలిక మరియు ‘కూడా’ భావం కాపాడబడ్డాయి.
