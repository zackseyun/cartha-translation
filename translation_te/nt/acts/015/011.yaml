review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the adversative contrast, salvation through the grace of the Lord Jesus, the first-person plural conviction, and the comparison in which ‘we’ are saved in the same way as ‘they also’ are. However, the focus particle in ‘కృప ద్వారానే’ adds an explicit ‘only’ emphasis not expressed by διά τῆς χάριτος. The contrast is supplied by ἀλλά, not by an exclusivity marker on ‘through grace.’
  naturalness: The Telugu is clear and modern. A semicolon gives the comparison a straightforward, natural flow without the stronger interpretive pause of an em dash.
  terminology: ‘ప్రభువైన యేసు,’ ‘కృప,’ and ‘రక్షించబడతామని’ are appropriate, comprehensible modern-standard Telugu renderings. ‘కృప ద్వారా’ preserves the Greek means/instrumental expression without adding exclusivity.
  issues:
  - severity: medium
    issue: ‘ద్వారానే’ adds an exclusivity particle.
    rationale: The Greek says ‘through the grace’ (διὰ τῆς χάριτος) and does not contain μόνον or an equivalent ‘only’ term. Although grace is strongly contrasted with the preceding yoke, ‘నే’ narrows the wording beyond the explicit lexical content.
  revised_text: అయితే ప్రభువైన యేసు కృప ద్వారా మనం రక్షించబడతామని నమ్ముతున్నాం; వారు కూడా అదే విధంగా రక్షించబడతారు.[a]
