id: ACT.15.10
reference: Acts 15:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: νῦν οὖν τί πειράζετε τὸν θεόν, ἐπιθεῖναι ζυγὸν ἐπὶ τὸν τράχηλον τῶν μαθητῶν ὃν οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς ἰσχύσαμεν βαστάσαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/010.yaml
  text: Now then[c][b][a], why are you testing God by putting a yoke on the neck of the disciples that neither our fathers nor we have been able to bear?
translation:
  language: te
  text: కాబట్టి ఇప్పుడు, మన పితరులు గానీ మనం గానీ మోయలేకపోయిన కాడిని శిష్యుల మెడపై పెట్టి దేవుణ్ణి ఎందుకు పరీక్షిస్తున్నారు?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దేవుణ్ణి ఎందుకు పరీక్షకు గురిచేస్తున్నారు?’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘కాడి’ అనేది బలవంతంగా మోపబడిన బాధ్యతకు రూపకం; ఈ సందర్భంలో శిష్యులపై విధిస్తున్న ఆవశ్యకతలను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: νῦν οὖν
  choice: కాబట్టి ఇప్పుడు
  rationale: οὖν యొక్క నిర్ధారణాత్మక భావాన్నీ, νῦν యొక్క ప్రస్తుత సందర్భ సూచననూ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: τί πειράζετε τὸν θεόν
  choice: దేవుణ్ణి ఎందుకు పరీక్షిస్తున్నారు?
  rationale: τί ఇక్కడ అలంకారిక ప్రశ్నలో ‘ఎందుకు’ అనే భావాన్నిస్తుంది; πειράζετε τὸν θεόν దేవుణ్ణి పరీక్షకు గురిచేయడం లేదా ఆయనను పరీక్షించడం అనే భావాన్ని కలిగి ఉంది.
- source_word: ἐπιθεῖναι ζυγὸν ἐπὶ τὸν τράχηλον
  choice: కాడిని ... మెడపై పెట్టి
  rationale: కర్తవ్యాన్ని బలవంతంగా మోపడం అనే సజీవ రూపకాన్ని అనువదించి తొలగించకుండా, తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: τῶν μαθητῶν
  choice: శిష్యుల
  rationale: అపొస్తలుల కార్యములలో μαθητήςకు స్థిరమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς
  choice: మన పితరులు గానీ మనం గానీ
  rationale: రెండు వర్గాలనూ నిరాకరించే οὔτε...οὔτε నిర్మాణాన్ని సహజంగా ప్రతిబింబిస్తుంది; πατέρες ఇక్కడ పూర్వ తరాల పితరులను సూచిస్తుంది.
- source_word: ἰσχύσαμεν βαστάσαι
  choice: మోయలేకపోయిన
  rationale: సామర్థ్యలేమిని తెలియజేస్తూ, కాడి రూపకంతో సరిపడే ‘మోయు’ క్రియను ఉపయోగిస్తుంది.
theological_decisions:
- issue: ‘కాడి’ రూపకం దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘కాడి’ అనే రూపకాన్నే ఉంచి, శిష్యులపై మోపబడుతున్న బాధ్యతలుగా పాదసూచికలో మాత్రమే వివరించడం.
  alternative: దానిని ‘మోషే ధర్మశాస్త్రమంతా’ అని గానీ, ‘సున్నతి మరియు దానికి సంబంధించిన నియమాలు’ అని గానీ స్పష్టంగా పేర్కొనడం.
  rationale: తక్షణ సందర్భం అన్యజన విశ్వాసులపై విధిస్తున్న ఆవశ్యకతలను సూచించినా, ఈ వచనం వాటిని ‘కాడి’ అనే రూపకంతోనే పేర్కొంటుంది. అందువల్ల ఒక నిర్దిష్ట సిద్ధాంత వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన సంబోధనను ఉపయోగించాం. ‘కాడి,’ ‘మెడపై పెట్టి,’ ‘మోయలేకపోయిన’ అనే పదాలతో మూలంలోని ఏకీకృత రూపకాన్ని నిలిపాం; ‘పితరులు’ చారిత్రక పూర్వ తరాలను సూచించే గంభీరమైన కానీ అర్థమయ్యే పదం.
