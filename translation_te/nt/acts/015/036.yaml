source:
  edition: SBLGNT
  text: Μετὰ δέ τινας ἡμέρας εἶπεν ⸂πρὸς Βαρναβᾶν Παῦλος⸃· Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα τοὺς ⸀ἀδελφοὺς κατὰ ⸂πόλιν πᾶσαν⸃ ἐν αἷς κατηγγείλαμεν τὸν λόγον τοῦ κυρίου, πῶς ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/036.yaml
  text: After some days[a], Paul said to Barnabas, “Let us return now and visit the brothers in every city where we proclaimed the word of the Lord, and see how they are.”
translation:
  language: te
  text: 'కొన్ని రోజుల తర్వాత పౌలు బర్నబాతో ఇలా అన్నాడు: “మనం ఇప్పుడు తిరిగి వెళ్లి, మనం ప్రభువు వాక్యాన్ని ప్రకటించిన ప్రతి పట్టణంలో ఉన్న సహోదరులను[a] సందర్శించి, వారు ఎలా ఉన్నారో చూద్దాం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సహోదర సహోదరీలను.” గ్రీకులో “సహోదరులు” అనే పురుషలింగ పదం ఉంది; అది విశ్వాసుల సమూహమంతటినీ ప్రతినిధిగా సూచించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δέ τινας ἡμέρας
  choice: కొన్ని రోజుల తర్వాత
  rationale: μετάతో కూడిన కాలవ్యక్తీకరణ తరువాతి సమయాన్ని సూచిస్తుంది; విరామం ఎంతకాలమో నిర్దిష్టంగా చెప్పకుండా మూలంలోని అనిశ్చితిని నిలుపుతుంది.
- source_word: εἶπεν πρὸς Βαρναβᾶν Παῦλος
  choice: పౌలు బర్నబాతో ఇలా అన్నాడు
  rationale: తెలుగులో సహజమైన మాటల పరిచయంగా ఉండి, పౌలు మాట్లాడినవాడని, బర్నబా సంబోధితుడని స్పష్టంగా తెలియజేస్తుంది.
- source_word: Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα
  choice: మనం తిరిగి వెళ్లి ... సందర్శించి ... చూద్దాం
  rationale: కృదంతంతో కూడిన ప్రథమ పురుష బహువచన ప్రోత్సాహక క్రియను సహజమైన తెలుగు క్రమంలో అందిస్తుంది. δὴ యొక్క ప్రతిపాదనాత్మక బలం ‘చూద్దాం’ అనే సందర్భంలో వ్యక్తమవుతుంది; విడిగా ‘ఇప్పుడే’ అని జోడించి అతిగా నిర్దిష్టం చేయలేదు.
- source_word: τοὺς ἀδελφοὺς
  choice: సహోదరులను
  rationale: గ్రీకు మూలంలోని పురుషలింగ కుటుంబపదాన్ని నిలుపుతుంది; సందర్భంలో విశ్వాసుల సమూహమంతటినీ, స్త్రీలను కూడా, సూచించే అవకాశం పాదసూచికలో తెలియజేయబడింది.
- source_word: κατὰ πόλιν πᾶσαν
  choice: ప్రతి పట్టణంలోని
  rationale: κατά యొక్క పంపిణీ భావాన్ని, వారు ముందుగా పరిచర్య చేసిన ఒక్కో పట్టణంలోని సమూహాన్ని సూచించేలా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν αἷς κατηγγείλαμεν
  choice: ప్రకటించిన
  rationale: καταγγέλλωలోని బహిరంగంగా తెలియజేయడం అనే బలాన్ని ‘ప్రకటించిన’ సరిగ్గా అందిస్తుంది.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: ప్రభువు వాక్యాన్ని
  rationale: λόγοςను సందేశార్థకమైనప్పటికీ మూలరూపానికి దగ్గరగా ‘వాక్యం’గా, κύριοςను సాంప్రదాయికమైన మరియు స్పష్టమైన ‘ప్రభువు’గా అనువదిస్తుంది.
- source_word: πῶς ἔχουσιν
  choice: వారు ఎలా ఉన్నారో
  rationale: వారి స్థితి లేదా క్షేమాన్ని తెలుసుకోవాలనే గ్రీకు నుడికారాన్ని సహజంగా, అదనపు వ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: ἀδελφοί పదం మిశ్రమ లింగ విశ్వాసుల సమూహాన్ని సూచించే అవకాశం
  choice: సహోదరులను
  alternative: సహోదర సహోదరీలను; విశ్వాసులను
  rationale: మూలంలోని పురుషలింగ కుటుంబపదాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది ప్రతినిధి బహువచనంగా స్త్రీలను కూడా కలుపుకోవచ్చనే భావాన్ని పాదసూచికలో ఉంచడం ద్వారా మూలరూపం మరియు సంభావ్య సమగ్ర సూచన రెండింటినీ కాపాడుతుంది.
- issue: κύριος పదానికి అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఈ సందర్భంలో ప్రకటించబడిన వాక్యానికి సంబంధించిన దైవిక బిరుదుగా ‘ప్రభువు’ కొత్త నిబంధన వాడుకను సహజంగా ప్రతిబింబిస్తుంది; ‘యజమాని’ ఇక్కడ అనుచితమైన సామాజిక భావాన్ని కలిగించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభమైన శైలి. ‘సందర్శించి, వారు ఎలా ఉన్నారో చూద్దాం’ అనే నిర్మాణం పౌలు ప్రతిపాదనలోని శ్రద్ధను చూపుతుంది; మూలంలో లేని ప్రత్యేక సంఘపాలనా భావాన్ని జోడించదు.
