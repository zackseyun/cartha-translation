- from: 'వారి చేతి ద్వారా[a] ఇలా రాశారు: “అపొస్తలులూ పెద్దలైన సహోదరులూ[b], అంతియొకయలోను సిరియలోను కిలికియలోను ఉన్న అన్యజనులలోనుంచి వచ్చిన సహోదరులకు[c] శుభాభివందనాలు.”'
  to: 'వారి చేత ఇలా వ్రాసి పంపారు: “అపొస్తలులూ సహోదరులైన పెద్దలూ, అంతియొకయలోను సిరియలోను కిలికియలోను ఉన్న అన్యజనులలోనుంచి వచ్చిన సహోదరులకు శుభాభివందనాలు.”'
  rationale: The revision restores the antecedent participial sense of γράψαντες in idiomatic Telugu, clarifies the hand/agency idiom without overinterpreting it, improves the appositional Telugu phrasing for πρεσβύτεροι ἀδελφοί, and corrects the alternative-reading note so that it does not add an unexpressed first-person pronoun. Footnote markers a, b, and c should be retained respectively after ‘చేత,’ ‘పెద్దలూ,’ and ‘సహోదరులకు’ in the formatted text.
