id: ACT.15.23
reference: Acts 15:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γράψαντες διὰ χειρὸς ⸀αὐτῶν· Οἱ ἀπόστολοι καὶ οἱ ⸀πρεσβύτεροι ἀδελφοὶ τοῖς κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν ἀδελφοῖς τοῖς ἐξ ἐθνῶν χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/023.yaml
  text: 'Having written by their hand: “The apostles and the elder brothers[a], to the brothers from among the Gentiles in Antioch and Syria and Cilicia[c][b], greetings.”'
translation:
  language: te
  text: 'వారి చేత ఇలా వ్రాసి పంపారు: “అపొస్తలులూ సహోదరులైన పెద్దలూ, అంతియొకయలోను సిరియలోను కిలికియలోను ఉన్న అన్యజనులలోనుంచి వచ్చిన సహోదరులకు శుభాభివందనాలు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γράψαντες
  choice: ఇలా రాశారు
  rationale: భూతకాల క్రియావిశేషణ రూపం ముందు వచనంలోని పంపే చర్యతో ముడిపడి ఉంది. తెలుగులో స్వతంత్ర వచనంగా సహజంగా చదవడానికి పరిమిత క్రియారూపాన్ని వాడి, ‘ఇలా’తో లేఖ ప్రారంభాన్ని సూచించాం.
- source_word: διὰ χειρὸς αὐτῶν
  choice: వారి చేతి ద్వారా
  rationale: గ్రీకు నుడికారంలోని ‘వారి చేతి ద్వారా’ అనే రూపాన్ని పారదర్శకంగా నిలిపి, ఇక్కడ ప్రతినిధుల ద్వారా లేఖను పంపడం అనే భావాన్ని పాదసూచికలో వివరించాం.
- source_word: ἀπόστολοι
  choice: అపొస్తలులు
  rationale: యెరూషలేములోని అధికారికంగా గుర్తింపుపొందిన సందేశవాహక నాయకులకు వాడే స్థిరమైన బైబిలు పదం.
- source_word: πρεσβύτεροι ἀδελφοὶ
  choice: పెద్దలైన సహోదరులు
  rationale: ἀδελφοί ముందు రెండో నిర్దేశక పదం లేకపోవడం వల్ల అది πρεσβύτεροι పదానికి అన్వయంగా చదవడం సహజం. ‘పెద్దలైన సహోదరులు’ ఆ సంబంధాన్ని నిలుపుతుంది; వేరే విరామచిహ్నంతో చదివే సాధారణ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἀδελφοῖς
  choice: సహోదరులు
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని నిలిపాం. ఈ లేఖా సందర్భంలో అది స్త్రీలతో సహా విశ్వాసుల సమాజమంతటినీ సూచించే అవకాశం ఉన్నందున ఆ సమగ్ర భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: τοῖς ἐξ ἐθνῶν
  choice: అన్యజనులలోనుంచి వచ్చిన
  rationale: ἐξ + షష్ఠీ విభక్తి గ్రహీతల జాతి నేపథ్యాన్ని సూచిస్తుంది. ఈ రూపం ఆ మూలం/నేపథ్య భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: χαίρειν
  choice: శుభాభివందనాలు
  rationale: లేఖ ఆరంభంలో ఇది ‘సంతోషించండి’ అనే ఆజ్ఞ కాక, సంప్రదాయబద్ధమైన అభివందన సూత్రం.
- source_word: κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν
  choice: అంతియొకయలోను సిరియలోను కిలికియలోను ఉన్న
  rationale: κατά ఇక్కడ పేర్కొన్న ప్రాంతాల్లో విస్తరించి ఉన్న గ్రహీతల స్థానాన్ని సూచిస్తుంది. ‘లోను’ అనే రూపం పంపిణీ/స్థాన భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: మిశ్రమ విశ్వాసుల సమాజాన్ని ఉద్దేశించిన ἀδελφοί పదం
  choice: సహోదరులు
  alternative: సహోదర సహోదరీలు; తోటి విశ్వాసులు
  rationale: మూలంలోని పుంలింగ బహువచన పదాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది స్త్రీలతో సహా విశ్వాసులందరినీ సమగ్రంగా సూచించవచ్చనే భావాన్ని పాదసూచికలో ఉంచాం.
- issue: πρεσβύτεροι ἀδελφοὶ పదబంధంలోని వాక్యనిర్మాణ సంబంధం
  choice: పెద్దలైన సహోదరులు
  alternative: పెద్దలూ, సహోదరులూ; పెద్దలమైన సహోదరులం
  rationale: రెండో నిర్దేశక పదం లేకపోవడం అన్వయార్థక పఠనానికి బలం ఇస్తుంది; అయితే విరామచిహ్నంపై ఆధారపడిన మరో పఠనం సాధ్యమే. అందువల్ల ప్రధాన పాఠ్యంలో ఒకదాన్ని ఎంచుకుని, నిజమైన వాక్యనిర్మాణ సందిగ్ధతను పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన లేఖా శైలిని వాడాం. స్థలపేర్లతో ‘లోను’ పునరుక్తి మూలంలోని వరుస నిర్మాణాన్ని నిలుపుతూ తెలుగులో సులభంగా వినిపిస్తుంది. ‘పెద్దలైన సహోదరులు’ కొంత ఉద్దేశపూర్వకమైన వాక్యనిర్మాణ సాంద్రతను ఉంచి, మూలంలోని సందిగ్ధతను పూర్తిగా తొలగించదు.
