revisions:
- from: 'చాలా వాదోపవాదాలు జరిగిన తరువాత, పేతురు లేచి వారితో ఇలా అన్నాడు: “సోదరులారా[a], చాలాకాలం క్రితమే[b] దేవుడు మీలో నన్ను ఎన్నుకున్నాడని మీకు తెలుసు. నా నోటి ద్వారా యూదేతర ప్రజలు[c] సువార్త వాక్యాన్ని విని విశ్వసించాలనే ఉద్దేశంతో ఆయన నన్ను ఎన్నుకున్నాడు.”'
  to: 'చాలా వాదోపవాదాలు జరిగిన తరువాత, పేతురు లేచి వారితో ఇలా అన్నాడు: “సోదరులారా[a], చాలాకాలం క్రితమే[b] దేవుడు మీ మధ్య నన్ను ఎన్నుకున్నాడని మీకు తెలుసు: నా నోటి ద్వారా యూదేతర ప్రజలు[c] సువార్త వాక్యాన్ని విని విశ్వసించేలా.”'
  rationale: The revision eliminates the duplicated statement that God chose Peter and joins the final infinitival idea directly to that choice. It also changes “మీలో” to “మీ మధ్య” to reflect the sense of selection among the assembly, while preserving the draft’s terminology, register, and all footnote anchors.
