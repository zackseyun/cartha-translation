id: ACT.15.7
reference: Acts 15:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πολλῆς δὲ ⸀ζητήσεως γενομένης ἀναστὰς Πέτρος εἶπεν πρὸς αὐτούς· Ἄνδρες ἀδελφοί, ὑμεῖς ἐπίστασθε ὅτι ἀφ’ ἡμερῶν ἀρχαίων ⸂ἐν ὑμῖν ἐξελέξατο ὁ θεὸς⸃ διὰ τοῦ στόματός μου ἀκοῦσαι τὰ ἔθνη τὸν λόγον τοῦ εὐαγγελίου καὶ πιστεῦσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/007.yaml
  text: And after much debate had taken place[a], Peter stood up and said to them, “Brothers[c][b], you know that from ancient days God chose among you that through my mouth the Gentiles should hear the word of the gospel and believe.”
translation:
  language: te
  text: 'చాలా వాదోపవాదాలు జరిగిన తరువాత, పేతురు లేచి వారితో ఇలా అన్నాడు: “సోదరులారా[a], చాలాకాలం క్రితమే[b] దేవుడు మీ మధ్య నన్ను ఎన్నుకున్నాడని మీకు తెలుసు: నా నోటి ద్వారా యూదేతర ప్రజలు[c] సువార్త వాక్యాన్ని విని విశ్వసించేలా.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పురుషులారా, సోదరులారా.” గ్రీకులో ఇది పుంలింగ బహువచన సంబోధన; “సోదరులారా” అనే మాట దాని రూపాన్నీ కుటుంబ భావాన్నీ నిలుపుతుంది. ఇది అక్కడున్న సమూహాన్ని ఉద్దేశించిన సంప్రదాయ సంబోధన కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఆదినాళ్లలోనే.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “జనాలు.” ఇక్కడ యూదులు కాని ప్రజలే ఉద్దేశించబడ్డారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῆς ... ζητήσεως γενομένης
  choice: చాలా వాదోపవాదాలు జరిగిన తరువాత
  rationale: Genitive absolute indicating prior circumstance. “వాదోపవాదాలు” conveys extended, serious deliberation without necessarily implying hostility.
- source_word: ἀναστὰς
  choice: లేచి
  rationale: Natural Telugu for Peter rising before addressing the assembly.
- source_word: Ἄνδρες ἀδελφοί
  choice: సోదరులారా
  rationale: Preserves the familial, masculine-plural form of the conventional address in natural Telugu.
- source_word: ἐπίστασθε
  choice: మీకు తెలుసు
  rationale: Directly expresses the audience’s existing knowledge.
- source_word: ἀφ’ ἡμερῶν ἀρχαίων
  choice: చాలాకాలం క్రితమే
  rationale: Idiomatic modern Telugu expressing a time well before the present; the alternative “ఆదినాళ్లలోనే” is noted.
- source_word: ἐν ὑμῖν ἐξελέξατο ὁ θεός
  choice: దేవుడు మీలో నన్ను ఎన్నుకున్నాడు
  rationale: The Greek says that God chose within/among the group; Telugu requires the understood object to be made explicit, and the following “నా నోటి ద్వారా” identifies Peter as the chosen speaker.
- source_word: διὰ τοῦ στόματός μου
  choice: నా నోటి ద్వారా
  rationale: Preserves the Greek’s vivid instrumental metaphor rather than reducing it to “నా ద్వారా.”
- source_word: τὰ ἔθνη
  choice: యూదేతర ప్రజలు
  rationale: In the Jerusalem council context this denotes non-Jewish peoples. This wording communicates the referent more readily than a transliterated religious term.
- source_word: τὸν λόγον τοῦ εὐαγγελίου
  choice: సువార్త వాక్యం
  rationale: Retains both λόγος and εὐαγγέλιον in a dignified and familiar Telugu expression.
- source_word: ἀκοῦσαι ... καὶ πιστεῦσαι
  choice: విని విశ్వసించాలి
  rationale: Preserves the coordination of the two aorist infinitives without expanding “believe” into a more doctrinal formulation.
theological_decisions:
- issue: The gendered conventional address Ἄνδρες ἀδελφοί
  choice: సోదరులారా
  alternative: పురుషులారా, సోదరులారా / సోదర సోదరీమణులారా
  rationale: The main text preserves the masculine familial address without adding an explicitly feminine form absent from the Greek; the conventional and potentially representative force is explained in a note.
- issue: The referent of τὰ ἔθνη
  choice: యూదేతర ప్రజలు
  alternative: జనాలు / అన్యజనులు
  rationale: The immediate dispute concerns non-Jews entering the believing community. The choice preserves that Jewish–non-Jewish distinction without importing a denominational reading.
- issue: The implicit object of ἐξελέξατο
  choice: నన్ను ఎన్నుకున్నాడు
  alternative: మీ మధ్య ఎంపిక చేసుకున్నాడు
  rationale: 'Greek leaves the selected person implicit, while “నా నోటి ద్వారా” identifies Peter. Explicit “నన్ను” is needed for clear, natural Telugu and does not alter the passage’s agency: God is the one who chooses.'
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయితే సభా ప్రసంగానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని “నా నోటి ద్వారా” అనే రూపకాన్ని, “సువార్త వాక్యం” అనే లూకా శైలిని నిలిపింది.
