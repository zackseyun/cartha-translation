  edition: SBLGNT
  text: ἀναγνόντες δὲ ἐχάρησαν ἐπὶ τῇ παρακλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/031.yaml
  text: And when they had read it[a], they rejoiced because of its encouragement.
translation:
  language: te
  text: వారు ఆ ఉత్తరాన్ని చదివి, దానిలోని ప్రోత్సాహాన్ని బట్టి సంతోషించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆ ప్రోత్సాహాన్ని బట్టి సంతోషించారు’ అని కూడా అనువదించవచ్చు. ‘ప్రోత్సాహం’ అనే పదానికి మూలంలో ‘ప్రబోధం’ లేదా ‘ఓదార్పు’ అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγνόντες
  choice: ఆ ఉత్తరాన్ని చదివి
  rationale: అనంతర ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచించే ఏఒరిస్ట్ కృదంతం. మూలంలో కర్మ స్పష్టంగా లేకపోయినా, మునుపటి వచనంలోని ఉత్తరమే సందర్భానుసారమైన కర్మ; తెలుగులో సహజమైన స్పష్టత కోసం ‘ఆ ఉత్తరాన్ని’ చేర్చబడింది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ ఇక్కడ స్వల్ప అనుసంధానాన్ని సూచిస్తుంది. తెలుగు కృదంత నిర్మాణంలోని ‘చదివి’ వాక్యసంబంధాన్ని సహజంగా తెలియజేస్తుంది; ‘మరియు’ చేరిస్తే తెలుగు వాక్యం కృత్రిమంగా ఉంటుంది.
- source_word: ἐχάρησαν
  choice: సంతోషించారు
  rationale: χαίρω క్రియలోని ఆనందభావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: ἐπὶ
  choice: బట్టి
  rationale: దత్తివుతో వచ్చిన ἐπί ఇక్కడ వారి సంతోషానికి ఆధారం లేదా కారణాన్ని సూచిస్తుంది. ‘బట్టి’ ఆ సంబంధాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τῇ παρακλήσει
  choice: దానిలోని ప్రోత్సాహాన్ని
  rationale: παράκλησις సందర్భాన్ని బట్టి ప్రోత్సాహం, ఆదరణ, ఓదార్పు లేదా ప్రబోధం అనే భావాలు కలిగి ఉండవచ్చు. ఇక్కడ ఉత్తర సందేశం విశ్వాసులను బలపరిచిన ప్రభావాన్ని ‘ప్రోత్సాహం’ సముచితంగా తెలియజేస్తుంది; ‘దానిలోని’ అనేది ఆ ప్రోత్సాహం ఉత్తరంలోని విషయంతో సంబంధముందని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: παράκλησις యొక్క భావ పరిధి
  choice: ప్రోత్సాహం
  alternative: ప్రబోధం; ఓదార్పు; ఆదరణ
  rationale: సంఘ వివాదం తరువాత వచ్చిన ఉత్తరం విశ్వాసులకు ధైర్యం, బలం కలిగించిన సందర్భంలో ‘ప్రోత్సాహం’ ప్రధాన భావాన్ని సహజంగా అందిస్తుంది. అయితే మూలపదంలోని ఉపదేశాత్మక లేదా ఓదార్పు భావాలను పూర్తిగా నిరాకరించకుండా పాదటిప్పణిలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గ్రంథపఠనానికి తగిన గౌరవప్రదమైన శైలి. సందర్భం వల్ల అవసరమైన ‘ఆ ఉత్తరాన్ని’ స్పష్టీకరించబడింది; παράκλησις యొక్క భావ విస్తృతిని పాదటిప్పణిలో భద్రపరచబడింది.
