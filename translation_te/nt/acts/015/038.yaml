id: ACT.15.38
reference: Acts 15:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Παῦλος δὲ ἠξίου, τὸν ἀποστάντα ἀπ’ αὐτῶν ἀπὸ Παμφυλίας καὶ μὴ συνελθόντα αὐτοῖς εἰς τὸ ἔργον, μὴ ⸀συμπαραλαμβάνειν τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/038.yaml
  text: But Paul insisted that they should not take along this man[a], who had withdrawn from them from Pamphylia and had not gone with them to the work.
translation:
  language: te
  text: కానీ, పంఫూలియలో వారిని విడిచి వెళ్లి, పనికోసం వారితో కలిసి వెళ్లని ఇతనిని వెంట తీసుకెళ్లకూడదని పౌలు పట్టుబట్టాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పంఫూలియలో వారిని వదిలేసిన.” గ్రీకు కృదంతాన్ని మరింత బలమైన ప్రతికూల భావంతో అనువదించవచ్చు; ప్రధాన పాఠం తక్కువ వ్యాఖ్యానాత్మకమైన “విడిచి వెళ్లి” అనే పదాన్ని ఉంచుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠξίου
  choice: పట్టుబట్టాడు
  rationale: వివాద సందర్భంలో ἀξιόω యొక్క అసంపూర్ణ భూతకాల రూపం పౌలు దృఢంగా అభిప్రాయపడిన భావాన్ని తెలియజేస్తుంది; ‘పట్టుబట్టాడు’ ఆ బలాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ἀποστάντα
  choice: విడిచిపోయి
  rationale: ἀφίσταμαι యొక్క భూతకృదంతం దూరమవడం లేదా విడిచి వెళ్లడాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో ‘విడిచిపోయి’ వాస్తవాన్ని తెలియజేస్తూ, ఉద్దేశపూర్వక ద్రోహమనే భావాన్ని అతిగా రుద్దదు.
- source_word: ἀπ’ αὐτῶν ἀπὸ Παμφυλίας
  choice: పంఫూలియ నుండి తమను విడిచిపోయి
  rationale: రెండు ἀπό పదబంధాలనూ ప్రతిబింబిస్తూ, పంఫూలియ నుండి వారిని విడిచి వెళ్లిన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; స్థలసంబంధ నిర్మాణంలో కొంత అస్పష్టతను నిలుపుతుంది.
- source_word: μὴ συνελθόντα αὐτοῖς
  choice: తమతో కలిసి వెళ్లని
  rationale: ప్రయాణ సందర్భంలో συνέρχομαι కలిసి వెళ్లడం లేదా వెంట ప్రయాణించడాన్ని సూచిస్తుంది; ఈ ఎంపిక సహవాస ప్రయాణ భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: εἰς τὸ ἔργον
  choice: పనిలో
  rationale: గ్రీకు పదబంధం సూచించే నిర్దిష్ట సేవా కార్యాన్ని ‘పని’ అనే సాధారణ, వ్యాఖ్యానభారం లేని పదంతో అందిస్తుంది; సందర్భానుసారంగా ‘పనిలో’ సహజమైన తెలుగు.
- source_word: μὴ συμπαραλαμβάνειν τοῦτον
  choice: ఇతన్ని వెంట తీసుకెళ్లకూడదని
  rationale: συμπαραλαμβάνω లోని ‘తమతో పాటు తీసుకెళ్లడం’ అనే భావాన్ని ‘వెంట తీసుకెళ్లడం’ సహజంగా అందిస్తుంది; τοῦτον లోని నిర్దేశక బలం ‘ఇతన్ని’లో నిలుస్తుంది.
