  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘పని’ అనే పదం మిషనరీ కార్యాన్ని సందర్భానికి వదిలి, మూలంలోని సాధారణ పదప్రయోగాన్ని కాపాడుతుంది. పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
