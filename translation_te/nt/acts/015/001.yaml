id: ACT.15.1
reference: Acts 15:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καί τινες κατελθόντες ἀπὸ τῆς Ἰουδαίας ἐδίδασκον τοὺς ἀδελφοὺς ὅτι Ἐὰν μὴ ⸀περιτμηθῆτε τῷ ἔθει ⸀τῷ Μωϋσέως, οὐ δύνασθε σωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/001.yaml
  text: And some men came down from Judea and were teaching the brothers[a], “Unless you are circumcised according to the custom of Moses, you cannot be saved.”
translation:
  language: te
  text: యూదయ నుంచి దిగివచ్చిన కొందరు సహోదరులకు[a], “మోషే ఆచారం ప్రకారం మీరు సున్నతి పొందకపోతే, రక్షణ పొందలేరు” అని బోధిస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సహోదర సహోదరీలకు’; గ్రీకులో ‘సహోదరులకు’ అని ఉంది. ఇక్కడ ఈ పదం విశ్వాసుల సమాజమంతటినీ సమగ్రంగా సూచించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καί
  choice: వాక్యారంభంలో ప్రత్యేకంగా అనువదించలేదు
  rationale: తెలుగు కథన ప్రవాహంలో ‘మరియు’ అని ప్రారంభించడం కృత్రిమంగా ఉంటుంది; ముందు సంఘటనతోని అనుసంధానం వాక్యక్రమం ద్వారానే స్పష్టమవుతుంది.
- source_word: τινες κατελθόντες ἀπὸ τῆς Ἰουδαίας
  choice: యూదయ నుంచి దిగివచ్చిన కొందరు
  rationale: ‘దిగివచ్చిన’ అనేది యూదయ నుంచి అంతియొకయకు జరిగిన ప్రయాణాన్ని, గ్రీకు కృదంతంలోని దిశాభావాన్ని నిలుపుతుంది; ‘కొందరు’ వ్యక్తులను సహజంగా సూచిస్తుంది.
- source_word: ἐδίδασκον
  choice: బోధిస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న లేదా పునరావృత చర్యను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοὺς ἀδελφοὺς
  choice: సహోదరులకు
  rationale: గ్రీకు పురుష బహువచనాన్ని నేరుగా ప్రతిబింబిస్తుంది; సందర్భంలో విశ్వాసుల సమాజం సమగ్రంగా ఉద్దేశించబడి ఉండవచ్చని పాదటిప్పణిలో తెలియజేయబడింది.
- source_word: Ἐὰν μὴ περιτμηθῆτε
  choice: మీరు సున్నతి పొందకపోతే
  rationale: షరతుతో కూడిన నిషేధ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; కర్మణి భావాన్ని ‘పొందడం’ నిలుపుతుంది.
- source_word: τῷ ἔθει τῷ Μωϋσέως
  choice: మోషే ఆచారం ప్రకారం
  rationale: ἔθος అనే పదంలోని స్థిరపడిన ఆచారం లేదా సంప్రదాయం భావాన్ని, దత్తి విభక్తి తెలిపే ప్రమాణార్థాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: οὐ δύνασθε σωθῆναι
  choice: రక్షణ పొందలేరు
  rationale: అసమర్థతను స్పష్టంగా తెలుపుతూ, ఈ వివాద సందర్భంలోని రక్షణ సంబంధమైన అర్థాన్ని సహజమైన తెలుగు వాడుకలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యెరూషలేము సమావేశ వివాదంలో σωθῆναι అర్థం
  choice: రక్షణ పొందలేరు
  alternative: విడిపించబడలేరు
  rationale: ఈ సందర్భం దేవుని ప్రజల్లో చేర్చబడటానికి, రక్షణకు సున్నతి అవసరమా అనే వివాదానికి సంబంధించినది. ‘రక్షణ పొందడం’ ఆ రక్షణశాస్త్ర సంబంధమైన బలాన్ని ఏ ప్రత్యేక శాఖా సిద్ధాంతాన్నీ చేర్చకుండా నిలుపుతుంది.
- issue: ἀδελφοὺς పదంలోని లింగం మరియు సందర్భ సమగ్రత
  choice: సహోదరులకు
  alternative: సహోదర సహోదరీలకు; విశ్వాసులకు
  rationale: మూల గ్రీకు పదం పురుష బహువచనం; అందువల్ల ప్రధాన పాఠ్యంలో దానిని నిలిపి, అది విశ్వాస సమాజాన్ని సమగ్రంగా సూచించి ఉండవచ్చనే విషయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘బోధిస్తూ ఉన్నారు’ కొనసాగుతున్న చర్యను చూపుతుంది; ‘మోషే ఆచారం’ మూలంలోని సంక్షిప్తతను, సాధ్యమైన సంబంధార్థాన్ని అనవసరంగా విప్పకుండా నిలుపుతుంది.
