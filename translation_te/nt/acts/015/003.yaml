id: ACT.15.3
reference: Acts 15:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ μὲν οὖν προπεμφθέντες ὑπὸ τῆς ἐκκλησίας διήρχοντο τήν ⸀τε Φοινίκην καὶ Σαμάρειαν ἐκδιηγούμενοι τὴν ἐπιστροφὴν τῶν ἐθνῶν, καὶ ἐποίουν χαρὰν μεγάλην πᾶσι τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/003.yaml
  text: So then[a], having been sent on their way by the church, they passed through both Phoenicia and Samaria, describing in detail the conversion of the Gentiles[b], and they brought great joy to all the brothers.
translation:
  language: te
  text: కాబట్టి సంఘం వారిచే సాగనంపబడి, వారు ఫొయినీకే మరియు సమరయ రెండింటి గుండా ప్రయాణిస్తూ, యూదేతరులు దేవుని వైపు తిరిగిన సంగతి[a] వివరంగా తెలియజేశారు. అలా వారు సహోదరులందరికీ[b] ఎంతో ఆనందం కలిగించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘యూదేతరుల తిరుగుదల.’ ఈ సందర్భంలో వారు దేవుని వైపు తిరగడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘సహోదరులు’ అనే పదం ఇక్కడ స్త్రీలతో సహా తోటి విశ్వాసులందరినీ సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: προπεμφθέντες
  choice: ప్రయాణానికి సహాయం చేసి పంపగా
  rationale: ప్రయాణాన్ని కొనసాగించేందుకు తోడ్పడి సాగనంపడం అనే προπέμπω పదంలోని భావాన్ని, వెంట వెళ్లారని అతిగా నిర్దిష్టం చేయకుండా సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐκκλησίας
  choice: సంఘం
  rationale: అపొస్తలుల కార్యముల సందర్భంలో ఇది క్రైస్తవ విశ్వాసుల సమాజాన్ని సూచిస్తుంది; ఆధునిక తెలుగు బైబిలు వాడుకలో ‘సంఘం’ స్పష్టమైన పదం.
- source_word: διήρχοντο
  choice: ప్రాంతాల గుండా వెళ్తూ
  rationale: ఆ ప్రాంతాల ద్వారా కొనసాగిన ప్రయాణాన్ని సూచించే అపరిపూర్ణ భూతకాల క్రియ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τε ... καὶ
  choice: ఫొయినీకే, సమరయ ప్రాంతాల
  rationale: రెండు ప్రాంతాలను సమన్వయంగా కలిపే గ్రీకు నిర్మాణాన్ని తెలుగులో సహజమైన జాబితా నిర్మాణంతో అందిస్తుంది.
- source_word: Φοινίκην
  choice: ఫొయినీకే
  rationale: గ్రీకు ప్రాంతనామానికి దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణ.
- source_word: Σαμάρειαν
  choice: సమరయ
  rationale: తెలుగు బైబిలు సంప్రదాయంలో గుర్తించదగిన ప్రాంతనామ రూపం.
- source_word: ἐκδιηγούμενοι
  choice: వివరంగా తెలియజేశారు
  rationale: సాధారణంగా చెప్పడం కంటే పూర్తిగా, విపులంగా వివరించడం అనే బలమైన క్రియాభావాన్ని నిలుపుతుంది.
- source_word: ἐπιστροφὴν
  choice: దేవుని వైపు తిరిగిన సంగతి
  rationale: ‘తిరగడం’ అనే మూల రూపకాన్ని నిలుపుతూ, ఈ సందర్భంలోని మతపరమైన దిశను స్పష్టం చేస్తుంది; ‘మతమార్పిడి’ వంటి ఆధునిక లేదా సంస్థాగత భావాన్ని రుద్దదు.
- source_word: τῶν ἐθνῶν
  choice: యూదేతరులు
  rationale: అపొస్తలుల కార్యములు 15లో యూదులకు భిన్నంగా దేవుని ప్రజల్లో చేరుతున్న జనులను సందర్భానుసారంగా స్పష్టంగా సూచిస్తుంది.
- source_word: ἐποίουν χαρὰν μεγάλην
  choice: ఎంతో ఆనందం కలిగించారు
  rationale: ποιέω + నామవాచక నిర్మాణంలోని కారణార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀδελφοῖς
  choice: సహోదరులందరికీ
  rationale: మూలంలోని పురుష బహువచన బంధుత్వ పదాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; సమస్త సహవిశ్వాసులను సూచించే సంభావ్య సమగ్ర భావాన్ని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: ἐπιστροφή ద్వారా యూదేతరుల దేవునివైపు మళ్లింపును వ్యక్తం చేయడం
  choice: దేవుని వైపు తిరిగిన సంగతి
  alternative: మారుమనస్సు పొందిన సంగతి; మతమార్పిడి
  rationale: మూలంలోని ‘తిరగడం’ అనే భావాన్ని, సందర్భంలో ఉద్దేశించిన దేవునివైపు మళ్లింపుతో కలిపి చూపుతుంది. తరువాతి కాలపు సాంకేతిక సిద్ధాంతార్థాన్ని అనవసరంగా చేర్చదు.
- issue: మిశ్రమ విశ్వాసుల సమాజంలో ἀδελφοί పదం
  choice: సహోదరులు
  alternative: సహోదర సహోదరీలు; తోటి విశ్వాసులు
  rationale: మూలంలోని వ్యాకరణపరమైన పురుష బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో కాపాడి, అది స్త్రీలను కూడా కలుపుకొని సహవిశ్వాసులందరినీ సూచించవచ్చని పాదసూచికలో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ప్రయాణానికి సహాయం చేసి పంపగా’ అనే రూపం సాగనంపడంలోని ఆచరణాత్మక సహాయ భావాన్ని నిలుపుతుంది. ‘దేవుని వైపు తిరిగిన’ అనే రూపం మూలంలోని రూపకాన్ని కాపాడుతూ సాధారణ పాఠకునికి సందర్భాన్ని స్పష్టం చేస్తుంది.
