revisions:
- from: కాబట్టి సంఘం వారు ప్రయాణానికి సహాయం చేసి పంపగా, వారు ఫొయినీకే, సమరయ ప్రాంతాల గుండా వెళ్తూ, యూదేతరులు దేవుని వైపు తిరిగిన సంగతి[a] వివరంగా తెలియజేశారు. దాంతో సహోదరులందరికీ[b] ఎంతో ఆనందం కలిగించారు.
