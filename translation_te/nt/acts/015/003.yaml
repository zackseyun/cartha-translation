  rationale: సవరణలు శైలీ మరియు సూక్ష్మ వ్యాకరణ స్పష్టతకే పరిమితమైనవి. προπεμφθέντες యొక్క ప్రయాణ-సంబంధ సాగనంపే భావాన్ని నిలుపుతూ వాక్యాన్ని సహజీకరించాం; τε ... καί ద్వారా కలిపిన రెండు ప్రాంతాలను ‘రెండింటి గుండా’ అని స్పష్టీకరించాం. ἐπιστροφή, ἐθνῶν, ἀδελφοῖςలకు సంబంధించిన ప్రస్తుత అనువాదం మరియు పాదసూచికలు మూలానికి, సందర్భానికి తగినవే కనుక వాటి అర్థాన్ని మార్చలేదు.
