id: ACT.15.5
reference: Acts 15:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐξανέστησαν δέ τινες τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων πεπιστευκότες, λέγοντες ὅτι δεῖ περιτέμνειν αὐτοὺς παραγγέλλειν τε τηρεῖν τὸν νόμον Μωϋσέως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/005.yaml
  text: But some of those from the party of the Pharisees who had believed stood up[a], saying that it is necessary to circumcise them and to command them to keep the law of Moses.
translation:
  language: te
  text: అయితే పరిసయ్యుల వర్గానికి చెందిన, విశ్వసించిన కొందరు లేచారు[a]. వారు, “వారికి సున్నతి చేయించాలి; మోషే ధర్మశాస్త్రాన్ని పాటించమని వారికి ఆజ్ఞాపించాలి” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పరిసయ్యుల పక్షానికి చెందినవారు.” గ్రీకు పదం ఇక్కడ గుర్తింపు పొందిన వర్గం లేదా శాఖను సూచిస్తుంది; తరువాతి కాలపు సాంకేతిక అర్థంలో ‘మతవిరోధం’ను కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξανέστησαν
  choice: లేచి నిలబడి
  rationale: సభలో మాట్లాడేందుకు లేచిన కథన చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; కేవలం ‘ఎదిరించారు’ అనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: τινες
  choice: కొందరు
  rationale: గ్రీకు అనిర్దిష్ట బహువచనానికి సహజమైన సమానం; మూలంలో లేని లింగ నిర్దిష్టతను చేర్చదు.
- source_word: τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων
  choice: పరిసయ్యుల వర్గానికి చెందినవారిలో
  rationale: αἵρεσις ఇక్కడ గుర్తింపు పొందిన వర్గం లేదా పాఠశాలను సూచిస్తుంది; తరువాతి కాలపు ‘మతవిరోధ సిద్ధాంతం’ అనే ప్రతికూల భావాన్ని రానివ్వదు.
- source_word: πεπιστευκότες
  choice: విశ్వసించిన
  rationale: పూర్తయిన విశ్వాస చర్యతో కొనసాగుతున్న స్థితిని సూచించే పరిపూర్ణ కృదంత భావాన్ని నిలుపుతుంది; వీరు విశ్వసించినప్పటికీ ఈ అభిప్రాయాన్ని వాదించిన ఉద్రిక్తతను సవరించదు.
- source_word: λέγοντες
  choice: అని అన్నారు
  rationale: వారి మాటల విషయాన్ని తటస్థంగా పరిచయం చేస్తుంది; ‘పట్టుబట్టారు’ వంటి అధిక బలాన్ని చేర్చదు.
- source_word: δεῖ περιτέμνειν αὐτούς
  choice: వారికి సున్నతి చేయించాలి
  rationale: అవసరతను స్పష్టంగా తెలిపే సహజ తెలుగు నిర్మాణం; అన్యజనులే ఉద్దేశించబడ్డారని సందర్భానుసార సర్వనామాన్ని అలాగే ఉంచుతుంది.
- source_word: παραγγέλλειν
  choice: ఆజ్ఞాపించాలి
  rationale: క్రియలోని అధికారపూర్వక బలాన్ని ‘బోధించాలి’ కంటే మెరుగ్గా నిలుపుతుంది.
- source_word: τε τηρεῖν
  choice: పాటించమని
  rationale: ధర్మశాస్త్ర ఆచరణకు ఆధునిక తెలుగులో సహజమైన పదం; τε అనుసంధానాన్ని విరామచిహ్నంతో సమన్వయంగా వ్యక్తం చేసింది.
- source_word: τὸν νόμον Μωϋσέως
  choice: మోషే ధర్మశాస్త్రాన్ని
  rationale: మూలంలోని స్వామ్య సంబంధాన్ని స్పష్టంగా, తెలుగు బైబిలు సందర్భానికి తగిన గౌరవప్రదమైన పదజాలంతో అందిస్తుంది.
theological_decisions:
- issue: యూదుల గుర్తింపు పొందిన సమూహాన్ని సూచించే αἵρεσις అనువాదం
  choice: వర్గం
  alternative: తెగ
  rationale: ఇక్కడ పరిసయ్యులు యూదమతంలోని గుర్తింపు పొందిన సమూహం; తరువాతి క్రైస్తవ సాంకేతిక అర్థంలోని ‘మతవిరోధం’ భావాన్ని చేర్చకుండా ‘వర్గం’ తటస్థంగా ఉంటుంది.
- issue: πεπιστευκότες యొక్క భావబలం
  choice: విశ్వసించిన
  alternative: విశ్వాసులైన
  rationale: మూలంలోని క్రియాత్మక పరిపూర్ణ కృదంతాన్ని నిలిపి, విశ్వసించిన ఈ పరిసయ్యులు అన్యజనులకు సున్నతి మరియు ధర్మశాస్త్ర ఆచరణ అవసరమని వాదించిన theological tension‌ను యథాతథంగా ఉంచుతుంది.
- issue: δεῖలో అవసరతకు ఆధారం
  choice: చేయించాలి
  alternative: చేయించడం అవసరం
  rationale: వారి వాదనలోని అవసరతను తెలిపినా, ఆ అవసరత దేవుని ఆజ్ఞనా లేక వారి అభిప్రాయమా అనే విషయాన్ని అనువాదం స్వయంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సభా-కథన శైలి. ‘సున్నతి,’ ‘ధర్మశాస్త్రం,’ ‘ఆజ్ఞాపించాలి’ వంటి విస్తృతంగా అర్థమయ్యే బైబిలు పదజాలం వాడబడింది. ప్రధాన వాక్యంలో [a] సూచికకు సరిపోలే పాదటిప్పణి చేర్చబడింది.
