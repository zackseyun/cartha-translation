- from: అతడు సిరియా, కిలికియ ప్రాంతాల గుండా వెళ్తూ సంఘాలను బలపరిచాడు.
  to: అతడు సిరియా, కిలికియా ప్రాంతాల గుండా ప్రయాణిస్తూ, సంఘాలను బలపరుస్తూ వెళ్లాడు.
