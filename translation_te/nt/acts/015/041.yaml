id: ACT.15.41
reference: Acts 15:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διήρχετο δὲ τὴν Συρίαν καὶ ⸀τὴν Κιλικίαν ἐπιστηρίζων τὰς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/041.yaml
  text: And he went through Syria and Cilicia, strengthening the churches.
translation:
  language: te
  text: అతడు సిరియా, కిలికియా ప్రాంతాల గుండా ప్రయాణిస్తూ, సంఘాలను బలపరుస్తూ వెళ్లాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διήρχετο
  choice: ప్రాంతాల గుండా వెళ్తూ
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న ప్రయాణ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; రెండు ప్రాంతాలలో సంచరించిన భావాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది కథనాన్ని ముందుకు నడిపే స్వల్ప అనుసంధాన పదం. తెలుగులో వాక్యారంభంలో ‘మరియు’ చేర్చడం కంటే సందర్భానుసారంగా దాన్ని అంతర్లీనంగా ఉంచడం సహజం.
- source_word: Συρίαν
  choice: సిరియా
  rationale: ఈ ప్రాంత నామానికి ప్రామాణిక తెలుగు రూపం.
- source_word: Κιλικίαν
  choice: కిలికియ
  rationale: గ్రీకు ప్రాంత నామానికి దగ్గరగా ఉండే, తెలుగు బైబిలు వాడుకలో గుర్తించదగిన రూపం.
- source_word: ἐπιστηρίζων
  choice: బలపరిచాడు
  rationale: సంఘాలు విశ్వాసంలో స్థిరంగా ఉండేలా తోడ్పడిన భావాన్ని తెలియజేస్తుంది; కేవలం భావోద్వేగ ప్రోత్సాహానికి పరిమితం చేయదు.
- source_word: ἐκκλησίας
  choice: సంఘాలను
  rationale: అపొస్తలుల కార్యముల సందర్భంలో స్థానిక క్రైస్తవ సముదాయాలను సూచించే సహజమైన, విస్తృతంగా అర్థమయ్యే తెలుగు పదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని కొనసాగుతున్న ప్రయాణం మరియు దానితో కూడిన సంఘాలను బలపరచే కార్యం ఒకే ప్రవాహంలో వ్యక్తమయ్యాయి.
