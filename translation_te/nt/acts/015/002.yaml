id: ACT.15.2
reference: Acts 15:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γενομένης ⸀δὲ στάσεως καὶ ζητήσεως οὐκ ὀλίγης τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτοὺς ἔταξαν ἀναβαίνειν Παῦλον καὶ Βαρναβᾶν καί τινας ἄλλους ἐξ αὐτῶν πρὸς τοὺς ἀποστόλους καὶ πρεσβυτέρους εἰς Ἰερουσαλὴμ περὶ τοῦ ζητήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/002.yaml
  text: And after no small dissension and debate had arisen between Paul and Barnabas and them[c][b][a], they appointed Paul and Barnabas and some others from among them to go up to the apostles and elders in Jerusalem about this issue.
translation:
  language: te
  text: పౌలుకూ బర్నబాకూ వారికీ మధ్య తీవ్రమైన విభేదమూ వాదోపవాదమూ కలిగిన తరువాత,[a] ఈ విషయం గురించి[c] యెరూషలేములోని అపొస్తలులూ పెద్దలూ వద్దకు వెళ్లడానికి[b] పౌలును, బర్నబాను, తమలోని మరికొందరిని వారు నియమించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా ‘కొద్దికాని విభేదం, వాదం’ అని ఉంది; ఇది వివాద తీవ్రతను నొక్కిచెప్పే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: మూలభాషలో ‘యెరూషలేముకు పైకి వెళ్లడానికి’ అని ఉంది. యెరూషలేముకు ప్రయాణాన్ని ఇలా చెప్పడం సాధారణ నుడికారం.
    reason: cultural_note
  - marker: c
    text: ‘ఈ విషయం’ అనే మాటను ‘ఈ వ్యవహారం’ లేదా ‘ఈ ప్రశ్న’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης δὲ
  choice: కలిగినప్పుడు
  rationale: ఈ genitive absolute ప్రధాన చర్యకు నేపథ్యమైన కాలసంబంధ పరిస్థితిని తెలియజేస్తుంది. తెలుగులో ‘కలిగినప్పుడు’ సహజంగా ఉండి ఆ సంబంధాన్ని నిలుపుతుంది.
- source_word: στάσεως καὶ ζητήσεως
  choice: విభేదం, వాదోపవాదం
  rationale: στάσις తీవ్రమైన ఎదిరింపును లేదా కలహాన్ని సూచిస్తే, ζήτησις చర్చలో జరిగిన వాదనను సూచిస్తుంది. ఈ జత భావతేడాను తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: οὐκ ὀλίγης
  choice: తీవ్రమైన
  rationale: గ్రీకు litotes‌ను పదశః ‘చిన్నది కాని’ అని ఇవ్వడం ఆధునిక తెలుగులో కృత్రిమంగా ఉంటుంది; ‘తీవ్రమైన’ దాని ఉద్ఘాటనాత్మక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτούς
  choice: పౌలుకు, బర్నబాకు వారితో
  rationale: వివాదంలో ఉన్న రెండు పక్షాలను ఈ నిర్మాణం సూచిస్తుంది. ‘వారు’ మునుపటి వచనంలోని యూదయ నుండి వచ్చిన మనుష్యులను సూచిస్తుంది; గ్రీకులో ఉన్నదానికంటే బలమైన శత్రుత్వాన్ని చేర్చదు.
- source_word: ἔταξαν
  choice: నియమించారు
  rationale: సమాజం ప్రయాణానికి ప్రతినిధులను నిర్దేశించిన భావాన్ని ఇస్తుంది. కేవలం ‘నిర్ణయించారు’ కంటే ప్రతినిధుల ఎంపికను స్పష్టంగా చూపినా, నిర్దిష్ట సంఘపాలనా విధానాన్ని ఆరోపించదు.
- source_word: ἀναβαίνειν
  choice: వెళ్లాలని
  rationale: గ్రీకులో యెరూషలేముకు ప్రయాణాన్ని ‘పైకి వెళ్లడం’గా చెప్పే సాధారణ నుడికారం ఉంది. సహజ తెలుగు ప్రధాన పాఠ్యంలో ‘వెళ్లాలని’ వాడి, మూల నుడికారాన్ని పాదసూచికలో తెలిపాం.
- source_word: τινας ἄλλους ἐξ αὐτῶν
  choice: తమలోని మరికొందరిని
  rationale: స్థానిక సమూహం నుండే అదనపు ప్రతినిధులు ఎంపికయ్యారని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τοὺς ἀποστόλους καὶ πρεσβυτέρους
  choice: అపొస్తలులు, పెద్దలు
  rationale: అపొస్తలులు అపొస్తలుల కార్యములలో స్థిరమైన బిరుదు; πρεσβύτεροι గుర్తింపు పొందిన నాయకులను సూచించే సంప్రదాయ, సులభ తెలుగు పదమైన ‘పెద్దలు’గా అనువదించబడింది.
- source_word: περὶ τοῦ ζητήματος τούτου
  choice: ఈ వివాదం గురించి
  rationale: ζήτημα చర్చలో ఉన్న ప్రశ్న లేదా వ్యవహారాన్ని సూచిస్తుంది. సందర్భంలో అది వివాదాస్పద అంశం కాబట్టి ‘వివాదం’ సహజంగా, స్పష్టంగా ఉంది.
theological_decisions:
- issue: వివాదంలో పాల్గొన్న పక్షాల గుర్తింపు
  choice: పౌలు, బర్నబా ఒక పక్షంగా, ‘వారు’ మరొక పక్షంగా చూపబడ్డారు; ‘వారు’ మునుపటి వచనంలోని యూదయ నుండి వచ్చినవారిని సూచిస్తుంది.
  alternative: ‘పౌలు, బర్నబా వారితో తీవ్రమైన విభేదానికి, వాదానికి దిగారు’ అని క్రియాశీలంగా అనువదించడం.
  rationale: మూలంలోని వ్యాకరణ నిర్మాణం రెండు పక్షాలను సూచిస్తుంది; అయితే ఎవరు వివాదాన్ని ప్రారంభించారో చెప్పదు. అనువాదం ఆ అస్పష్టతను నిలుపుతుంది.
- issue: ἔταξαν లోని సంస్థాగత భావం
  choice: ప్రతినిధులను ‘నియమించారు’.
  alternative: ‘వెళ్లాలని నిర్ణయించారు’ లేదా ‘ఏర్పాటు చేశారు’.
  rationale: సమూహం ప్రతినిధులను నిర్దేశించిన క్రమబద్ధ చర్యను ఇది ప్రతిబింబిస్తుంది; అయితే నిర్దిష్ట సంఘపాలనా నమూనాను మూలపాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘వాదోపవాదం’, ‘అపొస్తలులు’, ‘పెద్దలు’ వంటి ప్రాచుర్యంలో ఉన్న బైబిలు పదాలను సహజ వాక్యనిర్మాణంతో కలిపాం. ప్రధాన పాఠ్యంలో గ్రీకు litotes‌ను సహజ తెలుగు ఉద్ఘాటనగా మార్చి, దాని రూపాన్ని పాదసూచికలో భద్రపరిచాం.
