revisions:
- from: పౌలుకు, బర్నబాకు వారితో తీవ్రమైన విభేదం, వాదోపవాదం కలిగినప్పుడు,[a] ఈ వివాదం గురించి అపొస్తలుల దగ్గరికీ పెద్దల దగ్గరికీ యెరూషలేముకు వెళ్లాలని[b] పౌలును, బర్నబాను, తమలోని మరికొందరిని వారు నియమించారు.[c]
