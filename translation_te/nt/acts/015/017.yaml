source:
  edition: SBLGNT
  text: ὅπως ἂν ἐκζητήσωσιν οἱ κατάλοιποι τῶν ἀνθρώπων τὸν κύριον, καὶ πάντα τὰ ἔθνη ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς, λέγει ⸀κύριος ποιῶν ⸀ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/017.yaml
  text: so that the remnant of mankind may seek the Lord[a], even all the Gentiles on whom my name has been called, says the Lord[c][b], who does these things
translation:
  language: te
  text: మానవజాతిలో మిగిలినవారూ, నా పేరు ఎవరి మీద పిలువబడిందో ఆ అన్యజనులందరూ[a][b] ప్రభువును వెదకునట్లు—ఈ సంగతులను చేసే ప్రభువు ఇలా చెబుతున్నాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అన్యజనులందరూ’ అనే చోట ‘అన్ని జనాంగాలూ’ అని కూడా అనువదించవచ్చు. గ్రీకు ἔθνη పదానికి ‘అన్యజనులు’ లేదా ‘జనాంగాలు’ అనే అర్థాలు సాధ్యమే; ఇక్కడ యూదేతరుల చేర్పు సందర్భం వల్ల ‘అన్యజనులు’ అని అనువదించాం.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, ‘నా పేరు ఎవరి మీద పిలువబడిందో.’ దీనిని ‘నా పేరుతో పిలువబడేవారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ఈ మాటలు గ్రీకు లేఖనాల్లో ప్రతిఫలించిన ఆమోసు 9:12 రూపాన్ని ప్రతిధ్వనింపజేస్తాయి; అక్కడ దేవుని పేరు పిలువబడిన జనాంగాలపై ఉద్ఘాటన ఉంది.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπως ἂν
  choice: వెదకడానికి
  rationale: ఉద్దేశం లేదా ఫలితాన్ని సూచించే గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగు ప్రయోజనార్థక రూపంలో వ్యక్తం చేస్తుంది.
- source_word: ἐκζητήσωσιν
  choice: వెదకడానికి
  rationale: సందర్భంలో ప్రభువును అన్వేషించడమే ప్రధాన భావం; ఉపసర్గలో ఉండగల తీవ్రతను అతిగా అనువదించలేదు.
- source_word: οἱ κατάλοιποι τῶν ἀνθρώπων
  choice: మిగిలిన మానవులు
  rationale: κατάλοιποι యొక్క ‘మిగిలినవారు’ అనే భావాన్ని, ἀνθρώπων యొక్క లింగనిరపేక్ష సమస్త మానవ సూచనను కాపాడుతుంది.
- source_word: τὸν κύριον
  choice: ప్రభువును
  rationale: κύριοςకు గౌరవప్రదమైన, సాధారణ తెలుగు బైబిలు సమానార్థకం.
- source_word: πάντα τὰ ἔθνη
  choice: అన్యజనులందరూ
  rationale: యెరూషలేము సభ సందర్భంలో యూదేతరుల చేర్పే ప్రధాన అంశం; ‘జనాలన్నీ’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో సూచించాం.
- source_word: ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς
  choice: నా పేరు ఎవరి మీద ఉచ్చరించబడిందో
  rationale: దైవనామం వారిమీద పలకబడినదనే గ్రీకు రూపకాన్ని, దానికి సంబంధించిన స్వామ్యము మరియు గుర్తింపు భావాన్ని సాధ్యమైనంత దగ్గరగా నిలుపుతుంది.
- source_word: λέγει κύριος
  choice: ప్రభువు ఇలా చెబుతున్నాడు
  rationale: ప్రవచన ఉల్లేఖన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ποιῶν ταῦτα
  choice: ఈ సంగతులను చేసే
  rationale: వర్తమాన కృదంతం సూచించే ప్రభువు కార్యసాధకత్వాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ἔθνη పదాన్ని యూదులు–అన్యజనుల చేర్పు సందర్భంలో ఎలా అనువదించాలి
  choice: అన్యజనులు
  alternative: జనాలు
  rationale: అపొస్తలుల కార్యాలు 15లో యూదేతర విశ్వాసుల చేర్పు ప్రధాన చర్చాంశం. అయితే ఆమోసు ప్రవచన నేపథ్యంలోని విస్తృతమైన ‘జనాలు’ భావాన్ని పాదటిప్పణిలో నిలిపాం.
- issue: దైవనామం వారిమీద పిలువబడటం అనే ప్రయోగం
  choice: నా పేరు ఎవరి మీద ఉచ్చరించబడిందో
  alternative: నా పేరుతో పిలువబడేవారు
  rationale: మరింత సహజమైన ప్రత్యామ్నాయం ఉన్నప్పటికీ, గ్రీకు వాక్యంలోని దైవనామం ‘వారిమీద’ పలకబడినదనే నిబంధనాత్మక గుర్తింపు రూపకాన్ని ప్రధాన పాఠంలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ప్రవచన ఉల్లేఖన స్వరాన్ని నిలుపుతూ, మూలంలోని పునరుక్తి భావాన్ని తెలుగులో స్పష్టత కోసం ‘ఆయనను వెదకడానికి’ అని పూరించాం.
