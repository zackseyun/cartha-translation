revisions:
- from: మిగిలిన మానవులు ప్రభువును వెదకడానికి, నా పేరు ఎవరి మీద ఉచ్చరించబడిందో ఆ అన్యజనులందరూ కూడా ఆయనను వెదకడానికి[a]—ఈ సంగతులను చేసే ప్రభువు ఇలా చెబుతున్నాడు.[b]
  to: మానవజాతిలో మిగిలినవారూ, నా పేరు ఎవరి మీద పిలువబడిందో ఆ అన్యజనులందరూ[a][b] ప్రభువును వెదకునట్లు—ఈ సంగతులను చేసే ప్రభువు ఇలా చెబుతున్నాడు.[c]
  rationale: The revision restores the single purpose/result clause that governs both coordinated groups, replaces the misleading ‘pronounced’ wording with the source-faithful name-called-on idiom, and separates the required explanatory notes so their anchors and functions are clear. It retains the contextual rendering ‘అన్యజనులు’ while preserving ‘జనాంగాలు’ as a valid alternative.
