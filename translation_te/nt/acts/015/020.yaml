id: ACT.15.20
reference: Acts 15:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ ἐπιστεῖλαι αὐτοῖς τοῦ ⸀ἀπέχεσθαι τῶν ἀλισγημάτων τῶν εἰδώλων καὶ τῆς πορνείας καὶ ⸀τοῦ πνικτοῦ καὶ τοῦ αἵματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/020.yaml
  text: but to write to them to abstain from the pollutions of idols[a], and from sexual immorality, and from what has been strangled[c][b], and from blood.
translation:
  language: te
  text: కాని విగ్రహాలకు సంబంధించిన అపవిత్రతలకు[a], లైంగిక దుర్నీతికి[b], గొంతు నులిమి చంపినదానికి[c], రక్తానికి దూరంగా ఉండాలని వారికి వ్రాయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విగ్రహాలతో ముడిపడిన అపవిత్రతలకు.’ కొన్ని అనువాదాలు దీన్ని ‘విగ్రహాలకు అర్పించిన ఆహారానికి’ అని పరిమితం చేస్తాయి; అయితే ఇక్కడి గ్రీకు పదబంధం మరింత విస్తృతమైనది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వ్యభిచారానికి.’ ఈ గ్రీకు పదం లైంగిక దుర్నీతిని విస్తృతంగా సూచించవచ్చు; కొందరు ఇక్కడ దీన్ని ప్రత్యేకంగా నిషిద్ధ లైంగిక బంధాలుగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: c
    text: అక్షరార్థంగా, ‘గొంతు నులిమి చంపినది’; అంటే రక్తం సరిగా కార్చకుండా చంపిన జంతువు మాంసం.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιστεῖλαι
  choice: వ్రాయాలి
  rationale: యెరూషలేము సభ పంపబోయే లిఖితపూర్వక ఆదేశమే సందర్భం; అందువల్ల పత్రార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀπέχεσθαι
  choice: దూరంగా ఉండాలని
  rationale: తమను తాము వాటి నుంచి నిలిపివేసుకోవడం అనే మధ్యమప్రయోగ భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀλισγημάτων τῶν εἰδώλων
  choice: విగ్రహాలకు సంబంధించిన అపవిత్రతలకు
  rationale: ἀλίσγημα లోని అపవిత్రత భావాన్నీ, విగ్రహాలతో దాని సంబంధాన్నీ నిలుపుతూ, దీన్ని కేవలం విగ్రహాలకు అర్పించిన ఆహారంగా పరిమితం చేయదు.
- source_word: πορνείας
  choice: లైంగిక దుర్నీతికి
  rationale: ఈ గ్రీకు పదం సూచించగల విస్తృతమైన అనైతిక లైంగిక ప్రవర్తనను తెలుపుతుంది; వివాహానికి ముందు సంబంధాలకు మాత్రమే అర్థాన్ని కుదించదు.
- source_word: τοῦ πνικτοῦ
  choice: గొంతు నులిమి చంపినదానికి
  rationale: πνικτός యొక్క విశేషణాత్మక నామవాచక బలాన్ని నిలుపుతుంది; మూలంలో లేని ‘మాంసం’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: τοῦ αἵματος
  choice: రక్తానికి
  rationale: ἀπέχεσθαι నియంత్రించే సమాంతర జాబితా నిర్మాణాన్ని సంక్షిప్తంగా నిలుపుతుంది; వినియోగ విధానాన్ని మూలం కంటే ఎక్కువగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: విగ్రహ సంబంధ నిషేధపు పరిధి
  choice: విగ్రహాలకు సంబంధించిన అపవిత్రతలు
  alternative: విగ్రహాలకు అర్పించిన ఆహారం
  rationale: ఇక్కడ εἰδωλόθυτα అనే నిర్దిష్ట పదం కాకుండా ἀλισγημάτων τῶν εἰδώλων ఉంది; కాబట్టి విస్తృతమైన ఆరాధనా-సంబంధ అపవిత్రత భావాన్ని అనువాదం నిలుపుతుంది.
- issue: అపొస్తలుల నిర్ణయంలో πορνεία అర్థం
  choice: లైంగిక దుర్నీతి
  alternative: వ్యభిచారం; నిషిద్ధ లైంగిక బంధాలు
  rationale: ఈ పదం సాధారణ లైంగిక పాపాన్ని గానీ, ఈ సందర్భంలో ప్రత్యేకంగా నిషిద్ధ బంధాలను గానీ సూచిస్తుందని అర్థం చేసుకోవచ్చు; ప్రధాన పాఠ్యం ఆ చర్చను తీర్చకుండా పదం యొక్క విస్తృతిని నిలుపుతుంది.
- issue: జాబితాలోని ఆహార సంబంధ ఆదేశాల స్వభావం
  choice: దూరంగా ఉండాలనే ఆదేశాలుగా మాత్రమే ఉంచడం
  alternative: యూదు-యూదేతర సహపంక్తి కోసం తాత్కాలిక నియమాలు; విశ్వాసులందరికీ శాశ్వత ఆదేశాలు
  rationale: వచనం నిషేధాలను చెబుతుంది గాని వాటి కాలపరిమితి లేదా సంపూర్ణ ధార్మిక హేతువును వివరించదు; అందువల్ల అనువాదం ఏ సంప్రదాయ నిర్ణయాన్నీ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని నాలుగు సమాంతర నిషేధాలను నిలుపుతూ, ‘వ్రాయాలి’ మరియు ‘దూరంగా ఉండాలి’ వంటి సాధారణంగా అర్థమయ్యే రూపాలు వాడబడ్డాయి. ప్రధాన పాఠ్యంలో ఉన్న ప్రతి పాదసూచిక గుర్తుకు సరిపోలే గమనిక ఇవ్వబడింది.
