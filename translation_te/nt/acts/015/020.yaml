  source_fidelity: ప్రధాన పాఠ్యం గ్రీకు వాక్యనిర్మాణాన్నీ నాలుగు సమాంతర నిషేధాలనూ విశ్వసనీయంగా ప్రతిబింబిస్తుంది. ἐπιστεῖλαι ను ‘వ్రాయాలి,’ ἀπέχεσθαι ను ‘దూరంగా ఉండాలని’ అని అనువదించడం సందర్భానుకూలం. ἀλισγημάτων τῶν εἰδώλων ను కేవలం విగ్రహార్పిత ఆహారానికి కుదించకుండా విగ్రహ-సంబంధ అపవిత్రతలుగా ఉంచింది. πορνεία యొక్క విస్తృతతను, πνικτόν యొక్క నామవాచక స్వభావాన్ని, αἷμα యొక్క సంక్షిప్తతను కూడా కాపాడింది.
  naturalness: ఆధునిక ప్రామాణిక తెలుగులో వాక్యం సహజంగా, స్పష్టంగా ఉంది. ‘గొంతు నులిమి చంపినదానికి’ అనే ప్రయోగం కొంత అక్షరానువాద ధోరణి కలిగివున్నప్పటికీ, మూలంలోని అస్పష్ట/సామూహిక నామవాచకాన్ని కాపాడుతూ అర్థవంతంగా ఉంది; సవరణ అవసరమయ్యేంత అసహజం కాదు.
  terminology: ‘లైంగిక దుర్నీతి’ πορνείαకు విస్తృతార్థాన్ని ఇచ్చే ఆధునిక, తటస్థ పదప్రయోగం. ‘విగ్రహాలకు సంబంధించిన అపవిత్రతలు’ ἀλίσγημα యొక్క ఆచార-సంబంధ కలుషిత భావాన్ని నిలుపుతుంది. పాదసూచికలు ప్రత్యామ్నాయ అర్థాలను వివరణాత్మకంగా ఇస్తున్నాయి; ఏ ప్రత్యేక మతవ్యాఖ్యను బలవంతం చేయవు.
