id: ACT.15.35
reference: Acts 15:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Παῦλος δὲ καὶ Βαρναβᾶς διέτριβον ἐν Ἀντιοχείᾳ διδάσκοντες καὶ εὐαγγελιζόμενοι μετὰ καὶ ἑτέρων πολλῶν τὸν λόγον τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/035.yaml
  text: But Paul and Barnabas stayed in Antioch[a], teaching and proclaiming the good news of the word of the Lord[c][b], with many others also.
translation:
  language: te
  text: అయితే పౌలు, బర్నబా అంతియొకయలోనే ఉండి, ఇంకా అనేకమందితో కలిసి ప్రభువు వాక్యాన్ని బోధిస్తూ శుభవార్తను ప్రకటిస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέτριβον
  choice: ఉండి … ఉన్నారు
  rationale: ఈ అసంపూర్ణ భూతకాల క్రియ వారు అక్కడ కొంతకాలం కొనసాగి ఉన్నారనే భావాన్ని ఇస్తుంది. తెలుగు వాక్యంలో ‘ఉండి … ఉన్నారు’ ఆ కొనసాగుతున్న నివాసాన్నీ, దానితో పాటు సాగిన పరిచర్యనూ సహజంగా తెలియజేస్తుంది.
- source_word: διδάσκοντες
  choice: బోధిస్తూ
  rationale: వారు అక్కడ ఉన్న సమయంలో కొనసాగించిన బోధనా కార్యాన్ని వర్తమాన కృదంత రూపంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εὐαγγελιζόμενοι
  choice: సువార్తగా ప్రకటిస్తూ
  rationale: ఈ క్రియ శుభవార్తను తెలియజేయడం లేదా ప్రకటించడం అనే ప్రత్యేక భావాన్ని కలిగి ఉంది. ‘సువార్తగా ప్రకటిస్తూ’ అనే రూపం సంఘపరమైన భారాన్ని పెంచకుండా ఆ భావాన్ని నిలుపుతుంది.
- source_word: μετὰ καὶ ἑτέρων πολλῶν
  choice: ఇంకా అనేకమందితో కలిసి
  rationale: పౌలు, బర్నబా మాత్రమే కాక మరెందరో ఈ సేవలో భాగమయ్యారనే కూడిక భావాన్ని ‘ఇంకా’ నిలుపుతుంది; ‘కలిసి’ సహకారాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: λόγον
  choice: వాక్యాన్ని
  rationale: λόγος ఇక్కడ ‘వాక్యం’ లేదా ‘సందేశం’ కావచ్చు. అపొస్తలుల కార్యాలలో కనిపించే ‘ప్రభువు వాక్యం’ అనే సాహిత్యపరమైన పదబంధాన్ని కొనసాగించడానికి ‘వాక్యం’ ఎంచుకోబడింది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριος అనే బిరుదును అర్థవిస్తరణ చేయకుండా ‘ప్రభువు’గా అనువదించడం మూలంలోని రూపాన్నీ దైవశాస్త్ర సంబంధిత విస్తృతినీ కాపాడుతుంది.
theological_decisions:
- issue: ‘ప్రభువు వాక్యం’లో ‘ప్రభువు’ ఎవరిని సూచిస్తుంది?
  choice: మూలంలోని బిరుదును నిర్దిష్టీకరించకుండా ‘ప్రభువు’గా ఉంచడం
  alternative: ‘ప్రభువైన యేసు వాక్యం’ లేదా విస్తృత అర్థంలో ‘దేవుని సందేశం’
  rationale: అపొస్తలుల కార్యాలలో ‘ప్రభువు’ ముఖ్యంగా యేసును సూచించగలిగినా, ఈ వాక్యంలో గ్రీకు పాఠం κύριος అనే బిరుదు మాత్రమే ఉపయోగిస్తుంది. కాబట్టి అనువాదం మూలం కంటే ఎక్కువగా నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘వాక్యం,’ ‘ప్రభువు,’ ‘సువార్త’ వంటి స్థిరపడిన బైబిలు పదాలను ఉంచుతూ వాక్య నిర్మాణాన్ని సహజంగా తీర్చిదిద్దాం.
