revisions:
- from: అయితే పౌలు, బర్నబా అంతియొకయలో ఉండి[a], ఇంకా అనేకమందితో కలిసి ప్రభువు వాక్యాన్ని[c] బోధిస్తూ, సువార్తగా ప్రకటిస్తూ[b] ఉన్నారు.
  to: అయితే పౌలు, బర్నబా అంతియొకయలోనే ఉండి, ఇంకా అనేకమందితో కలిసి ప్రభువు వాక్యాన్ని బోధిస్తూ శుభవార్తను ప్రకటిస్తూ ఉన్నారు.
  rationale: 'εὐαγγελιζόμενοι యొక్క శుభవార్తను ప్రకటించు అనే అర్థాన్ని స్పష్టంగా ఇవ్వడానికి ‘సువార్తగా ప్రకటిస్తూ’ స్థానంలో ‘శుభవార్తను ప్రకటిస్తూ’ వాడబడింది. నివాసాన్ని తెలిపే నిర్మాణాన్ని ఆధునిక సహజ తెలుగుకు అనుగుణంగా స్వల్పంగా సవరించాం. Footnote anchors are retained at their corresponding expressions: [a] after the stay, [c] after ‘ప్రభువు వాక్యాన్ని,’ and [b] after the good-news proclamation.'
  reviewer_model: gpt-5.6-terra
