  source_fidelity: మూలంలోని ποιήσαντες δὲ χρόνον కు ‘కొంతకాలం అక్కడ గడిపిన తరువాత’ సరైన సందర్భానుగుణ అనువాదం. ἀπελύθησαν యొక్క కర్మణి భావాన్ని తెలుగులో సహజమైన కర్తరి నిర్మాణమైన ‘సహోదరులు వారిని ... సాగనంపారు’ ద్వారా తగినట్లుగా వ్యక్తం చేసింది. μετ’ εἰρήνης కు ‘శాంతితో,’ ἀπὸ τῶν ἀδελφῶν కు ‘సహోదరులు,’ మరియు పంపినవారివద్దకు వెళ్లడాన్ని సూచించే చివరి భాగం కూడా భావపరంగా నమ్మకంగా ఉన్నాయి. అయితే ‘తమను పంపినవారు’లోని స్వీయసూచక సర్వనామం సమీప కర్త అయిన ‘సహోదరులు’తో తప్పుగా అనుసంధానమయ్యే అవకాశం ఉంది; మూలంలోని αὐτούς అనేది సాగనంపబడిన వారినే సూచిస్తుంది.
  naturalness: వాక్యం ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదమైన కథనశైలిలో ఉంది. ‘సాగనంపారు’ అనేది సందర్భానికి చాలా తగినది. ‘తమను’ స్థానంలో ‘వారిని’ వాడటం సూచనను స్పష్టపరుస్తుంది; ‘దగ్గరకు’ కన్నా ‘వద్దకు’ ఈ రిజిస్టర్‌లో కొద్దిగా సూటిగా ఉంటుంది.
  terminology: ‘సహోదరులు’ గ్రీకు ἀδελφοί యొక్క పుంలింగ బహువచన రూపాన్ని నిలుపుతుంది; పాదసూచిక సందర్భంలోని సమ్మిళిత సంఘార్థాన్ని సముచితంగా తెలియజేస్తుంది. ‘శాంతితో’ మరియు ‘సాగనంపారు’ ఇక్కడ ఏ ప్రత్యేక సిద్ధాంత వ్యాఖ్యానాన్ని రుద్దకుండా వీడ్కోలు/సద్భావ భావాన్ని అందిస్తున్నాయి.
