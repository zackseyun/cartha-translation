  yaml_path: translation/nt/acts/015/033.yaml
  text: And after spending some time there[a], they were sent off in peace from the brothers to those who had sent them.
translation:
  language: te
  text: కొంతకాలం అక్కడ గడిపిన తరువాత, సహోదరులు వారిని శాంతితో వారిని పంపినవారి వద్దకు సాగనంపారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσαντες ... χρόνον
  choice: కొంతకాలం అక్కడ గడిపిన తరువాత
  rationale: ఈ గ్రీకు నుడికారం కొంతకాలం ఉండడం లేదా గడపడం అనే అర్థం ఇస్తుంది. సహజమైన తెలుగుకోసం ‘అక్కడ’ సందర్భం నుండి చేర్చబడింది; అది గ్రీకులో స్పష్టంగా లేదు.
- source_word: δὲ
  choice: తరువాత
  rationale: ఇక్కడ δέ కథనాన్ని ముందుకు నడిపించే స్వల్ప అనుసంధాన పదం; తెలుగు వాక్య నిర్మాణంలో కాలసూచక అనుసంధానంతో దాని పని సహజంగా వ్యక్తమవుతుంది.
- source_word: ἀπελύθησαν
  choice: సాగనంపారు
  rationale: ఇది నిర్బంధం నుండి విడుదలను కాక, సంఘం ప్రతినిధులను శుభాకాంక్షలతో పంపివేయడాన్ని సూచిస్తుంది. తెలుగు కర్తరి నిర్మాణం గ్రీకు కర్మణి భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: μετ’ εἰρήνης
  choice: శాంతితో
  rationale: సమాధానపూర్వకంగా, సద్భావంతో వీడ్కోలు పలికి పంపడాన్ని సూచించే సంప్రదాయ ప్రయోగాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἀπὸ τῶν ἀδελφῶν
  choice: సహోదరులు[a]
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పుంలింగ బహువచనం. ప్రధాన పాఠ్యంలో దాని రూపాన్ని నిలుపుతూ, సందర్భంలో విశ్వాసుల సమాజమంతటినీ కలుపుకునే అవకాశం పాదసూచికలో తెలిపాం.
- source_word: πρὸς τοὺς ἀποστείλαντας αὐτούς
  choice: తమను పంపినవారి దగ్గరకు
  rationale: ఈ నామవాచకార్థక కృదంతం వారిని ఇంతకు ముందు పంపినవారిని సూచిస్తుంది. ‘తిరిగి’ అనేది సందర్భానికి సరిపోయినా గ్రీకులో ప్రత్యక్షంగా లేనందున చేర్చలేదు.
theological_decisions:
- issue: ἀδελφοί పదంలోని సమ్మిళిత భావం
  choice: సహోదరులు
  alternative: సహోదర సహోదరీలు; విశ్వాసులు
  rationale: సిద్ధాంతపరమైన నిర్ణయం చేయకుండా, గ్రీకు పుంలింగ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది సందర్భానుసారం విశ్వాసుల సమాజాన్ని సమ్మిళితంగా సూచించవచ్చని పాదసూచికలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘సాగనంపారు’ సామూహికమైన సద్భావ వీడ్కోలు భావాన్ని అందిస్తుంది; ‘శాంతితో’ మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
