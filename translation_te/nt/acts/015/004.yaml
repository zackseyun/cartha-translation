id: ACT.15.4
reference: Acts 15:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ εἰς ⸀Ἱεροσόλυμα ⸀παρεδέχθησαν ⸀ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων, ἀνήγγειλάν τε ὅσα ὁ θεὸς ἐποίησεν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/004.yaml
  text: When they arrived in Jerusalem[a], they were welcomed by the church and the apostles and the elders, and they reported all that God had done with them.
translation:
  language: te
  text: వారు యెరూషలేముకు చేరుకున్నప్పుడు, సంఘం, అపొస్తలులు, పెద్దలు వారిని స్వాగతించారు. దేవుడు వారితో చేసిన కార్యాలన్నిటినీ[a] వారు వివరించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేవుడు వారి ద్వారా చేసిన కార్యాలన్నిటినీ’; లేదా ‘దేవుడు వారి మధ్య చేసిన కార్యాలన్నిటినీ.’ గ్రీకు మూలంలో అక్షరార్థంగా ‘వారితో’ అని ఉంది.
    reason: μετ’ αὐτῶν అనే గ్రీకు పదబంధం సహచర్యాన్ని ప్రాథమికంగా సూచిస్తుంది; సందర్భంలో సాధనత్వం లేదా వారి మధ్య జరిగిన కార్యం అనే భావసాధ్యతలు కూడా ఉన్నాయి. ప్రధాన పాఠం ఆ పదబంధాన్ని అక్షరార్థానికి దగ్గరగా ఉంచుతుంది.
lexical_decisions:
- source_word: παραγενόμενοι δὲ εἰς Ἱεροσόλυμα
  choice: వారు యెరూషలేముకు చేరుకున్నప్పుడు
  rationale: భూతకాల అసమాపక క్రియ ప్రధాన క్రియలకు ముందు జరిగిన సందర్భాన్ని సూచిస్తుంది. ‘చేరుకున్నప్పుడు’ ఆ కాలసంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; δέ యొక్క స్వల్ప అనుసంధాన భావం ఈ నిర్మాణంలోనే ఇమిడింది.
- source_word: παρεδέχθησαν
  choice: వారిని స్వాగతించారు
  rationale: గ్రీకులోని కర్మణి నిర్మాణాన్ని తెలుగులో సహజమైన కర్తరి వాక్యంగా మార్చి, ఆతిథ్యంతో అంగీకరించి చేర్చుకున్న భావాన్ని ‘స్వాగతించారు’ తెలియజేస్తుంది.
- source_word: ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων
  choice: సంఘం, అపొస్తలులు, పెద్దలు
  rationale: ఇక్కడ ἀπό కర్మణి క్రియతో వ్యక్తిగత కర్తృత్వాన్ని సూచిస్తుంది. ἐκκλησία విశ్వాసుల సమాజాన్ని, πρεσβύτεροι గుర్తింపు పొందిన నాయకులను సూచిస్తున్నందున ‘సంఘం’, ‘పెద్దలు’ అనువైనవి.
- source_word: ἀνήγγειλάν τε
  choice: వారు వివరించారు
  rationale: ἀναγγέλλω జరిగిన సంగతులను తెలియజేయడం లేదా నివేదించడం అనే భావం ఇస్తుంది. ‘వివరించారు’ సాధారణ ఆధునిక తెలుగులో ఈ నివేదిక భావాన్ని సహజంగా అందిస్తుంది; τε వాక్యాల అనుసంధానంలో వ్యక్తమవుతుంది.
- source_word: ὅσα ὁ θεὸς ἐποίησεν
  choice: దేవుడు ... చేసినవన్నీ
  rationale: ὅσα యొక్క సమగ్ర భావాన్ని ‘చేసినవన్నీ’ నిలుపుతుంది. దేవుడే వ్యాకరణపరంగా, భావపరంగా ప్రధాన కార్యసాధకుడిగా ఉంటుంది.
- source_word: μετ’ αὐτῶν
  choice: తమతో కలిసి
  rationale: μετά + షష్ఠీ విభక్తి యొక్క ప్రాథమిక ‘తో’ భావాన్ని నిలుపుతూ, నివేదిస్తున్న వారినే తిరిగి సూచించడానికి తెలుగులో ‘తమతో’ వాడబడింది. ‘కలిసి’ సహచర్య భావాన్ని స్పష్టం చేస్తుంది; ‘ద్వారా’ లేదా ‘మధ్య’ అని ఏకపక్షంగా నిర్ణయించదు.
theological_decisions:
- issue: μετ’ αὐτῶνలో దేవుని కార్యానికీ దూతలకీ మధ్య ఉన్న సంబంధం
  choice: దేవుడు తమతో కలిసి చేసినవన్నీ
  alternative: దేవుడు వారి ద్వారా చేసినవన్నీ; దేవుడు వారి మధ్య చేసినవన్నీ
  rationale: గ్రీకు పదబంధం దేవుడే ప్రధాన కార్యసాధకుడని స్పష్టం చేస్తూనే, పౌలు బర్నబాలు ఆయన కార్యంతో సహవాస సంబంధంలో ఉన్నారని చెబుతుంది. ‘తమతో కలిసి’ అనే అనువాదం మానవులను కేవలం సాధనాలుగా గానీ, కార్యం జరిగిన ప్రదేశంగా గానీ పరిమితం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘అపొస్తలులు’, ‘సంఘం’, ‘పెద్దలు’ అనే విస్తృతంగా పరిచయమైన పదాలు వాడబడ్డాయి; ఏ ప్రత్యేక సంఘశాఖ పదజాలమూ చేర్చలేదు.
