  source_fidelity: ముసాయిదా గ్రీకు వాక్యంలోని కాలసంబంధం, యెరూషలేముకు రాక, సంఘం–అపొస్తలులు–పెద్దల స్వాగతం, అలాగే దేవుడు చేసిన కార్యాల నివేదికను విశ్వసనీయంగా అందిస్తుంది. అయితే μετ’ αὐτῶνకు ప్రధాన పాఠంలో ‘తమతో కలిసి’ కంటే ‘వారితో’ మరింత ప్రత్యక్షమైన, సందిగ్ధత తక్కువైన సమానార్థకం.
