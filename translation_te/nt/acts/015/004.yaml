  terminology: ‘సంఘం,’ ‘అపొస్తలులు,’ ‘పెద్దలు’ సందర్భానుకూలమైన, శాఖాపరమైన పదజాలాన్ని బలవంతంగా రుద్దని అనువాదాలు. ‘వారితో’ అనేది μετὰ + షష్ఠీ యొక్క ప్రాథమిక సహచర్య భావాన్ని కాపాడుతుంది; ప్రత్యామ్నాయ అర్థాలను పాదటిప్పణి సముచితంగా సూచిస్తుంది.
