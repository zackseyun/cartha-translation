lexical_decisions:
- source_word: γνωστὰ
  choice: తెలిసినవి
  rationale: ఇది క్రియలేని వాక్యంలో విధేయ విశేషణంగా ఉంది. ‘తెలిసినవి’ అనేది దాని స్థితిని నేరుగా తెలియజేస్తుంది; ‘తెలియజేయబడినవి’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని క్రియాత్మక భావం చేరుతుంది.
- source_word: ἀπ’
  choice: నుంచే
  rationale: ἀπό ఇక్కడ కాలారంభాన్ని సూచిస్తుంది. ‘నుంచి’ సహజమైన తెలుగు సమానం; ‘-ఏ’ పూర్వకాలం మొదలుకొని అనే కాలబలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αἰῶνος
  choice: పూర్వకాలం
  rationale: ఈ కాలసూచక ప్రయోగంలో αἰών సుదీర్ఘ గతకాలాన్ని లేదా ప్రాచీన కాలాన్ని సూచించగలదు. ‘పూర్వకాలం’ ఆధునిక తెలుగులో సహజంగా ఉండి, ‘నిత్యకాలం’ అనే మరింత బలమైన అర్థాన్ని ప్రధాన పాఠ్యంలో రుద్దదు.
theological_decisions:
- issue: ఈ సంక్షిప్త వాక్యంలో దేవుని జ్ఞానానికి సంబంధించిన కాలవ్యాప్తి
  choice: ఈ విషయాలు పూర్వకాలం నుంచే తెలిసినవని సంక్షిప్తంగా అనువదించడం
  alternative: నిత్యకాలం నుంచే తెలిసినవి; లేదా వీటిని పూర్వకాలం నుంచే తెలియజేసేవాడు
  rationale: SBLGNT పాఠం γνωστὰ ἀπ’ αἰῶνος అనే అత్యంత సంక్షిప్త రూపంలో ఉంది. కాబట్టి నిత్య ముందుజ్ఞానం గురించి బలమైన సిద్ధాంతపరమైన విస్తరణను గానీ, దీర్ఘ పాఠాంతరంలోని కర్త-క్రియలను గానీ ప్రధాన పాఠ్యంలో చేర్చలేదు; పాఠాంతరాలను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. మూలంలోని క్రియలేని సంక్షిప్త నిర్మాణాన్ని సహజమైన తెలుగు విధేయ రూపంతో నిలిపి, పాఠాంతరాల వల్ల వచ్చే విస్తృత భావాలను పాదటిప్పణికే పరిమితం చేశాం.
