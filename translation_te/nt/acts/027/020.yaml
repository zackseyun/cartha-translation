revisions:
- from: చాలా రోజులపాటు సూర్యుడుగానీ నక్షత్రాలుగానీ కనిపించలేదు. తీవ్రమైన తుఫాను మాపై విరుచుకుపడుతూనే ఉండడంతో, ఇక మేము రక్షించబడతామనే[a] ఆశంతా క్రమక్రమంగా తొలగిపోయింది.
  to: సూర్యుడుగానీ నక్షత్రాలుగానీ చాలా రోజులపాటు కనిపించక, తీవ్రమైన తుఫాను మాపై విరుచుకుపడుతూ ఉండగా, ఇక మేము రక్షించబడతామనే[a] ఆశ అంతా క్రమంగా తొలగిపోతూ వచ్చింది.
  rationale: The revision retains the draft's faithful lexical choices while expressing the imperfect, progressive force of περιῃρεῖτο with క్రమంగా తొలగిపోతూ వచ్చింది. The principal text retains the broad term రక్షించబడటం; the footnote supplies the contextually appropriate physical-survival sense without imposing a theological meaning.
