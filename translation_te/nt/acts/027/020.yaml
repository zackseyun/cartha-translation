id: ACT.27.20
reference: Acts 27:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μήτε δὲ ἡλίου μήτε ἄστρων ἐπιφαινόντων ἐπὶ πλείονας ἡμέρας, χειμῶνός τε οὐκ ὀλίγου ἐπικειμένου, λοιπὸν περιῃρεῖτο ⸂ἐλπὶς πᾶσα⸃ τοῦ σῴζεσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/020.yaml
  text: And when neither sun nor stars appeared for many days[a], and no small storm was pressing on us, from then on all hope of our being saved was gradually taken away.
translation:
  language: te
  text: సూర్యుడుగానీ నక్షత్రాలుగానీ చాలా రోజులపాటు కనిపించక, తీవ్రమైన తుఫాను మాపై విరుచుకుపడుతూ ఉండగా, ఇక మేము రక్షించబడతామనే[a] ఆశ అంతా క్రమంగా తొలగిపోతూ వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రాణాలతో బయటపడతామనే.’ ఇక్కడ ‘రక్షించబడటం’ అంటే తుఫాను వల్ల కలిగే మరణ ప్రమాదం నుంచి తప్పించుకోవడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφαινόντων
  choice: కనిపించలేదు
  rationale: సూర్యుడు, నక్షత్రాలు మేఘాల వల్ల కనబడకపోవడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; వెలుగు అనే భావాన్ని అనవసరంగా అతిశయింపదు.
- source_word: ἐπὶ πλείονας ἡμέρας
  choice: చాలా రోజులపాటు
  rationale: అనేక రోజులుగా కొనసాగిన కాలవ్యవధిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: χειμῶνός τε οὐκ ὀλίγου
  choice: తీవ్రమైన తుఫాను
  rationale: సముద్రయాన సందర్భంలో χειμών తుఫాను వాతావరణాన్ని సూచిస్తుంది. గ్రీకు అల్పోక్తి ‘చిన్నది కాని’ అనే తీవ్రతను తెలుగులో సహజంగా ‘తీవ్రమైన’ అని తెలిపింది.
- source_word: ἐπικειμένου
  choice: మాపై విరుచుకుపడుతూనే ఉండడంతో
  rationale: తుఫాను వారిమీద నిరంతరం బలంగా పడుతున్న భావాన్ని, కృదంతంలోని కొనసాగుతున్న చర్యను నిలుపుతుంది.
- source_word: λοιπὸν
  choice: ఇక
  rationale: పరిస్థితి ఈ దశకు చేరిన తర్వాత మిగిలిన ఆశ కూడా పోయిందనే కాలిక-ఫలిత మార్పును సంక్షిప్తంగా చూపుతుంది.
- source_word: περιῃρεῖτο
  choice: క్రమక్రమంగా తొలగిపోయింది
  rationale: అసంపూర్ణ భూతకాల కర్మణి రూపంలోని కొనసాగుతున్న ప్రక్రియను ప్రతిబింబిస్తుంది; ఆశ ఒక్కసారిగా కాక క్రమంగా పోయిందని తెలియజేస్తుంది.
- source_word: ἐλπὶς πᾶσα
  choice: ఆశంతా
  rationale: ఆశ పూర్తిగా అంతరించిందనే సమగ్రతను సహజమైన తెలుగు ప్రయోగంతో అందిస్తుంది.
- source_word: τοῦ σῴζεσθαι ἡμᾶς
  choice: మేము రక్షించబడతామనే
  rationale: ఆశ యొక్క విషయాన్ని స్పష్టంగా వ్యక్తం చేస్తూ, σῴζω పదానికి ఉన్న ‘రక్షించు’ అనే విస్తృత పదసంబంధాన్ని నిలుపుతుంది; సందర్భం దీనిని సముద్ర ప్రమాదం నుంచి భౌతిక రక్షణగా నిర్దేశిస్తుంది.
theological_decisions:
- issue: సముద్రయాన కథనంలో σῴζεσθαι అర్థం
  choice: రక్షించబడటం—తుఫాను, సముద్రమరణ ప్రమాదం నుంచి ప్రాణాలతో బయటపడటం
  alternative: ఆధ్యాత్మిక రక్షణ పొందటం
  rationale: అపొస్తలుల కార్యాలు 27వ అధ్యాయంలోని తుఫాను, ఓడనాశనం, ప్రాణరక్షణ సందర్భం ఈ క్రియను భౌతిక విముక్తిగా నిర్దేశిస్తుంది. అయితే మూలపదపు విస్తృత భావాన్ని నిలుపుటకు ప్రధాన పాఠ్యంలో ‘రక్షించబడటం’ వాడి, సందర్భార్థాన్ని పాదసూచికలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. గ్రీకు వాక్యంలోని దీర్ఘ నిర్మాణాన్ని తెలుగు పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించాం; కొనసాగుతున్న తుఫాను మరియు క్రమంగా కరిగిపోయిన ఆశ అనే కాలభావాలను నిలిపాం.
