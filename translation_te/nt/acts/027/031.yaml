  terminology: ‘శతాధిపతి’ is an established and suitable rendering of ἑκατοντάρχης. ‘ఓడ’ suits πλοῖον in this maritime narrative. The theological term ‘రక్షించబడలేరు’ is retained in the text, while the note gives the contextually appropriate physical-survival alternative.
