id: ACT.27.31
reference: Acts 27:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν ὁ Παῦλος τῷ ἑκατοντάρχῃ καὶ τοῖς στρατιώταις· Ἐὰν μὴ οὗτοι μείνωσιν ἐν τῷ πλοίῳ, ὑμεῖς σωθῆναι οὐ δύνασθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/031.yaml
  text: Paul said to the centurion and the soldiers[a], “Unless these men remain in the ship, you cannot be saved.”
translation:
  language: te
  text: పౌలు శతాధిపతితో మరియు సైనికులతో, “వీరు ఓడలోనే ఉండకపోతే, మీరు రక్షించబడలేరు[a]” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రాణాలతో బయటపడలేరు.” గ్రీకులో “రక్షించబడలేరు” అని ఉంది; ఇక్కడ అది సముద్ర ప్రమాదం నుండి శారీరకంగా ప్రాణాలతో బయటపడటాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: శతాధిపతితో
  rationale: రోమా సైన్యంలోని ఈ హోదాకు తెలుగులో స్థిరపడిన, సంక్షిప్తమైన పదం; మూలపదంలోని ‘వందమందికి అధిపతి’ అనే భావాన్ని నిలుపుతుంది.
- source_word: οὗτοι
  choice: వీరు
  rationale: సందర్భంలో ఓడను విడిచి వెళ్లబోతున్న నావికులను సూచించే పుంలింగ బహువచన సర్వనామం; తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: μείνωσιν
  choice: ఉండకపోతే
  rationale: షరతును సహజమైన తెలుగులో వ్యక్తం చేస్తూ, ఓడలోనే కొనసాగి ఉండాలనే μένω భావాన్ని అందిస్తుంది; ‘లోనే’ ఆ స్థలంలో నిలిచి ఉండడాన్ని స్పష్టం చేస్తుంది.
- source_word: πλοίῳ
  choice: ఓడలోనే
  rationale: ఈ సముద్రయాన సందర్భంలోని పెద్ద నౌకకు ‘ఓడ’ సహజమైన తెలుగు పదం.
- source_word: σωθῆναι
  choice: రక్షించబడలేరు
  rationale: గ్రీకు క్రియలోని విస్తృతమైన ‘రక్షింపబడటం’ భావాన్ని నిలుపుతుంది; ఈ సందర్భంలో అది ఓడ ప్రమాదం నుండి ప్రాణాలతో బయటపడటాన్ని సూచిస్తుందని పాదటిప్పణి వివరిస్తుంది.
- source_word: οὐ δύνασθε
  choice: రక్షించబడలేరు
  rationale: 'సామర్థ్య నిరాకరణను తెలుగులో సహజంగా క్రియారూపంలో వ్యక్తం చేస్తుంది: ‘మీరు ... చేయలేరు/కాలేరు.’'
theological_decisions:
- issue: σωθῆναι అనే పదాన్ని కేవలం శారీరక ప్రాణరక్షణను తెలిపే పదబంధంగా అనువదించాలా, లేక విస్తృతమైన ‘రక్షించబడటం’ అనే పదాన్ని ఉంచాలా?
  choice: రక్షించబడలేరు
  alternative: ప్రాణాలతో బయటపడలేరు
  rationale: తక్షణ సందర్భం సముద్ర ప్రమాదం నుండి శారీరకంగా ప్రాణాలతో బయటపడటమే. అయినప్పటికీ, మూలంలోని సాధారణ ‘రక్షించు’ క్రియకు ఉన్న విస్తృతతను ప్రధాన పాఠంలో నిలిపి, సందర్భానుసార అర్థాన్ని పాదటిప్పణిలో తెలియజేయడం మూలంలోని పదప్రయోగాన్ని అనవసరంగా సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘శతాధిపతి’ బైబిలు మరియు చారిత్రక సందర్భాలకు తగిన స్థిరమైన హోదాపదం; మిగతా వాక్యనిర్మాణం సాధారణ పాఠకులకు సులభంగా ఉండేలా ఉంచబడింది.
