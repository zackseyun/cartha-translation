translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. పొడవైన గ్రీకు వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి చదవడానికి సులభం చేశాం. అనిశ్చితిని ‘గలమేమో’తో, సముద్రయాన సందర్భాన్ని ‘సముద్రంలోకి బయలుదేరడం’తో కాపాడాం. ప్రధాన పాఠ్యంలో ఉన్న ప్రతి పాదటిప్పణి గుర్తు సంబంధిత స్థానంలో ఉంచబడింది.
