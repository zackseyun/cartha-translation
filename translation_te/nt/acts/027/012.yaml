id: ACT.27.12
reference: Acts 27:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀνευθέτου δὲ τοῦ λιμένος ὑπάρχοντος πρὸς παραχειμασίαν οἱ πλείονες ἔθεντο βουλὴν ἀναχθῆναι ⸀ἐκεῖθεν, εἴ πως δύναιντο καταντήσαντες εἰς Φοίνικα παραχειμάσαι, λιμένα τῆς Κρήτης βλέποντα κατὰ λίβα καὶ κατὰ χῶρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/012.yaml
  text: And because the harbor was unsuitable for wintering[a], the majority decided to put out from there[c][b], if somehow they might reach Phoenix and spend the winter there—a harbor of Crete facing southwest and northwest.
translation:
  language: te
  text: ఆ ఓడరేవు చలికాలం గడపడానికి అనువుగా లేకపోవడంతో, ఎలాగైనా ఫీనిక్సు[b]కు చేరుకొని అక్కడ చలికాలం గడపగలమేమోనని అక్కడి నుంచి సముద్రంలోకి బయలుదేరాలని[a] ఎక్కువమంది నిర్ణయించారు. ఫీనిక్సు క్రీతు ద్వీపంలోని, నైరుతి మరియు వాయవ్య దిశలకు ముఖంగా ఉన్న ఓడరేవు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సముద్రంలోకి బయలుదేరడం” అని అనువదించిన గ్రీకు క్రియ, నౌకను ఓడరేవు నుంచి సముద్రంలోకి తీసుకెళ్లడాన్ని సూచించే నౌకాయాన పదం.
    reason: lexical_alternative
  - marker: b
    text: ఫీనిక్సు క్రీతు ద్వీపంలోని ఒక ఓడరేవు. కొన్ని పాత అనువాదాల్లో ఈ పేరు “ఫెనీకే” వంటి రూపాల్లో కనిపిస్తుంది.
    reason: cultural_note
  - marker: c
    text: చివరిలోని దిశలను తెలిపే గ్రీకు పదబంధం అర్థం కష్టమైనది. సాంప్రదాయంగా దీనిని “నైరుతి మరియు వాయవ్య దిశలకు ముఖంగా” అని అర్థం చేసుకుంటారు; రెండవ దిశను కొందరు మరింత నిర్దిష్టంగా “పశ్చిమ-వాయవ్యం” అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνευθέτου
  choice: అనువుగా లేకపోవడంతో
  rationale: ప్రస్తావిత ప్రయోజనమైన చలికాలం గడపడానికి ఆ ఓడరేవు సరిపోదనే ఆచరణాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: λιμένος
  choice: ఓడరేవు
  rationale: సముద్రయాన సందర్భంలో λιμήν సూచించే నౌకల ఆశ్రయస్థలానికి స్పష్టమైన, సాధారణ తెలుగు పదం.
- source_word: πρὸς παραχειμασίαν
  choice: చలికాలం గడపడానికి
  rationale: చలికాలమంతా అక్కడ ఉండే ఉద్దేశాన్ని సులభంగా, సహజంగా తెలియజేస్తుంది.
- source_word: οἱ πλείονες
  choice: ఎక్కువమంది
  rationale: గుంపులో అధిక సంఖ్యాకులను సూచించే సహజ తెలుగు ప్రయోగం; ఎవరు ఓటు వేశారనే వివరాన్ని అనవసరంగా చేర్చదు.
- source_word: ἔθεντο βουλήν
  choice: నిర్ణయించారు
  rationale: సమూహంగా ఒక కార్యాచరణను నిశ్చయించుకున్నారనే గ్రీకు నుడికార భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: ἀναχθῆναι ἐκεῖθεν
  choice: అక్కడి నుంచి సముద్రంలోకి బయలుదేరాలని
  rationale: ἀνάγω యొక్క ప్రత్యేక నౌకాయానార్థాన్ని స్పష్టంగా చూపుతుంది; కేవలం సాధారణ ప్రయాణంగా వినిపించకుండా చేస్తుంది.
- source_word: εἴ πως δύναιντο
  choice: ఎలాగైనా … గడపగలమేమో అనుకున్నారు
  rationale: ప్రయత్నం, ఆశ, ఫలితం పట్ల అనిశ్చితి అనే εἴ πως మరియు optative భావాలను సహజ తెలుగులో నిలుపుతుంది.
- source_word: καταντήσαντες εἰς Φοίνικα
  choice: ఫీనిక్సుకు చేరుకొని
  rationale: గమ్యస్థానానికి చేరడాన్ని సూటిగా తెలుపుతుంది; స్థలనామాన్ని ఆధునిక తెలుగు లిప్యంతరీకరణలో ఉంచుతుంది.
- source_word: παραχειμάσαι
  choice: అక్కడ చలికాలం గడపగలమేమో
  rationale: గమ్యస్థానంలో చలికాలమంతా ఉండాలనే ఉద్దేశాన్ని, దాని అనిశ్చితితో సహా తెలుపుతుంది.
- source_word: βλέποντα
  choice: వైపు తెరచుకొని ఉంది
  rationale: ఓడరేవు భౌగోళిక దిశాభిముఖతను తెలుగులో ‘ముఖంగా ఉంది’ కంటే సహజంగా వివరిస్తుంది.
- source_word: κατὰ λίβα καὶ κατὰ χῶρον
  choice: నైరుతి, వాయవ్య దిక్కుల వైపు
  rationale: సాంప్రదాయ దిశా అవగాహనను ప్రధాన పాఠ్యంలో ఇస్తూ, రెండవ పదం యొక్క మరింత నిర్దిష్ట అర్థసంభావ్యతను పాదటిప్పణిలో నిలుపుతుంది.
