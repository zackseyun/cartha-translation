id: ACT.27.44
reference: Acts 27:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τοὺς λοιποὺς οὓς μὲν ἐπὶ σανίσιν οὓς δὲ ἐπί τινων τῶν ἀπὸ τοῦ πλοίου· καὶ οὕτως ἐγένετο πάντας διασωθῆναι ἐπὶ τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/044.yaml
  text: and the rest[a], some on planks and some on pieces from the ship. And so it happened that all were brought safely to land.
translation:
  language: te
  text: మిగిలినవారు కొందరు పలకలపై, మరికొందరు ఓడ నుండి వచ్చిన కొన్ని వస్తువులపై ఒడ్డుకు చేరారు. ఈ విధంగా అందరూ క్షేమంగా ఒడ్డుకు చేరుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అందరూ క్షేమంగా ఒడ్డుకు తప్పించుకున్నారు.” ఇక్కడి గ్రీకు క్రియ ఓడ ప్రమాదం నుండి శారీరకంగా క్షేమంగా బయటపడటాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς λοιποὺς
  choice: మిగిలినవారిలో
  rationale: ముందటి వచనంలో పేర్కొన్నవారు కాకుండా ఇంకా మిగిలిన వ్యక్తులను సూచిస్తుంది; తదనంతర విభజనతో సహజంగా కలుస్తుంది.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: కొందరు ... మరికొందరు
  rationale: మిగిలినవారిని రెండు గుంపులుగా విభజించే గ్రీకు సహసంబంధ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ σανίσιν
  choice: పలకల మీద
  rationale: σανίς అంటే పలక లేదా చెక్కబల్ల; ఓడ ప్రమాద సందర్భంలో ‘పలకలు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: ἐπί τινων τῶν ἀπὸ τοῦ πλοίου
  choice: ఓడనుండి దొరికిన వస్తువుల మీద
  rationale: గ్రీకు వాక్యం ఓడకు చెందిన నిర్దిష్టంగా చెప్పని కొన్ని వస్తువులను సూచిస్తుంది; ‘వస్తువులు’ అని అనడం ‘ముక్కలు’ అని అతిగా నిర్దిష్టపరచకుండా ఆ అనిశ్చితిని నిలుపుతుంది.
- source_word: οὕτως
  choice: ఈ విధంగా
  rationale: ఇప్పుడే వివరించిన మార్గాన్ని సంక్షిప్తంగా తిరిగి సూచిస్తుంది.
- source_word: ἐγένετο
  choice: చేరుకున్నారు
  rationale: గ్రీకు ఫలిత నిర్మాణాన్ని తెలుగులో సహజమైన పరిణామ వాక్యంగా వ్యక్తం చేస్తుంది; ‘జరిగింది’ అనే కృత్రిమ పదబంధం అవసరం లేదు.
- source_word: πάντας διασωθῆναι
  choice: అందరూ సురక్షితంగా ... చేరుకున్నారు
  rationale: ఇక్కడ διασῴζω ఓడ ప్రమాదం నుండి క్షేమంగా బయటపడటాన్ని సూచిస్తుంది. తెలుగు ప్రయోగం భౌతిక రక్షణను స్పష్టంగా తెలియజేస్తుంది, అయితే గ్రీకు నిష్క్రియార్థాన్ని సహజ వాక్యరూపంలో అందిస్తుంది.
- source_word: ἐπὶ τὴν γῆν
  choice: ఒడ్డుకు
  rationale: సముద్రయాన సందర్భంలో γῆ నీటికి భిన్నమైన నేల/తీరాన్ని సూచిస్తుంది; ‘ఒడ్డుకు’ సహజమైన తెలుగు సమానం.
theological_decisions:
- issue: διασωθῆναι పదానికి కలగగల ఆధ్యాత్మిక రక్షణ భావం
  choice: సురక్షితంగా ఒడ్డుకు చేరుకున్నారు
  alternative: రక్షింపబడి ఒడ్డుకు చేరారు
  rationale: సందర్భం ఓడ ప్రమాదం నుండి శారీరకంగా క్షేమంగా బయటపడటం గురించి. ప్రధాన అనువాదం అనవసరమైన ఆధ్యాత్మిక భావాన్ని చేర్చకుండా సందర్భార్థాన్ని ఇస్తుంది; అడుగుసూచికలో పదబంధానికి దగ్గరైన ప్రత్యామ్నాయం ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన కథన శైలి. గ్రీకులోని నిర్దిష్టతలేని ‘ఓడనుండి వచ్చిన కొన్ని వస్తువులు’ అనే భావాన్ని అతిగా వివరించకుండా నిలుపుకుంది.
