id: ACT.27.14
reference: Acts 27:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μετ’ οὐ πολὺ δὲ ἔβαλεν κατ’ αὐτῆς ἄνεμος τυφωνικὸς ὁ καλούμενος ⸀Εὐρακύλων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/014.yaml
  text: But not long after[b][a], a typhonic wind called Euraquilo rushed down against it.
translation:
  language: te
  text: అయితే కొద్దిసేపటికే, “యూరాకులోన్”[a] అని పిలిచే భీకరమైన తుఫాను గాలి[b] దానిమీదికి విరుచుకుపడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో “యూరోక్లూడోన్” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: 'మరో విధంగా: “ఈశాన్యం నుండి వీచే భీకరమైన గాలి.” ఈ పేరు బహుశా ఈశాన్య దిశ నుండి వచ్చే తుఫాను గాలిని సూచిస్తుంది; అయితే గ్రీకు పాఠ్యం దాన్ని పేరుగా పేర్కొంటుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολὺ
  choice: కొద్దిసేపటికే
  rationale: కొంత సమయం గడిచిన వెంటనే అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: కథనంలో అకస్మాత్తుగా వచ్చిన ప్రతికూల మలుపును సూచించే స్వల్ప వ్యతిరేకతను నిలుపుతుంది.
- source_word: ἔβαλεν κατ’ αὐτῆς
  choice: దానిమీదికి విరుచుకుపడింది
  rationale: గాలి బలంగా వచ్చి దానిపై పడిన భావాన్ని తెలియజేస్తుంది; αὐτῆς అనే సర్వనామం దేనిని సూచిస్తుందో ప్రధాన పాఠ్యంలో నిర్దిష్టంగా తేల్చకుండా ఉంచుతుంది.
- source_word: ἄνεμος τυφωνικὸς
  choice: భీకరమైన తుఫాను గాలి
  rationale: ἄνεμος అనే ప్రధాన పదాన్ని ‘గాలి’గా ఉంచి, τυφωνικός తెలిపే హింసాత్మక తుఫాను స్వభావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; ఆధునిక వాతావరణ శాస్త్ర వర్గీకరణను అనవసరంగా రుద్దదు.
- source_word: ὁ καλούμενος
  choice: అని పిలిచే
  rationale: పేరు లేదా నిర్దేశాన్ని పరిచయం చేసే గ్రీకు ప్రయోగానికి సహజమైన తెలుగు రూపం.
- source_word: Εὐρακύλων
  choice: యూరాకులోన్
  rationale: SBLGNTలోని పదాన్ని సాధారణ నామవాచకంగా అనువదించకుండా తుఫాను గాలి పేరుగా లిప్యంతరీకరిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కథనానికి తగిన గంభీరతతో రూపొందించబడింది. ‘దాని’ అనే రూపం గ్రీకు సర్వనామంలోని సూచనాత్మక అస్పష్టతను నిలుపుతుంది; ‘విరుచుకుపడింది’ గాలి అకస్మాత్తుగా, బలంగా దూసుకొచ్చిన భావాన్ని అందిస్తుంది.
