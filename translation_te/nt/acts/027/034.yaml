revisions:
- from: కాబట్టి కొంత ఆహారం తీసుకోవాలని మిమ్మల్ని వేడుకుంటున్నాను. ఇది మీ ప్రాణరక్షణకు తోడ్పడుతుంది[a]. ఎందుకంటే మీలో ఎవరి తల నుండైనా ఒక్క వెంట్రుక కూడా నశించదు.
  to: కాబట్టి కొంత ఆహారం తీసుకోవాలని మిమ్మల్ని వేడుకుంటున్నాను. ఇది మీ ప్రాణరక్షణకు అవసరం[a]. ఎందుకంటే మీరిలో ఎవరి తలమీదున్న ఒక్క వెంట్రుక కూడా నశించదు.
