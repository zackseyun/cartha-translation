id: ACT.27.34
reference: Acts 27:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὸ παρακαλῶ ὑμᾶς ⸀μεταλαβεῖν τροφῆς, τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει· οὐδενὸς γὰρ ὑμῶν θρὶξ ⸀ἀπὸ τῆς κεφαλῆς ⸀ἀπολεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/034.yaml
  text: Therefore I urge you to take some food[a], for this is for your preservation; for not a hair from the head of any of you will perish.
translation:
  language: te
  text: కాబట్టి కొంత ఆహారం తీసుకోవాలని మిమ్మల్ని వేడుకుంటున్నాను. ఇది మీ ప్రాణరక్షణకు అవసరం[a]. ఎందుకంటే మీరిలో ఎవరి తలమీదున్న ఒక్క వెంట్రుక కూడా నశించదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇది మీ రక్షణ కోసం.” ఇక్కడి గ్రీకు పదం “రక్షణ,” “విడుదల,” లేదా “ప్రాణరక్షణ” అనే అర్థాలను ఇవ్వగలదు; ఈ సందర్భంలో అది శారీరకంగా ప్రాణాలతో బయటపడటాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: కాబట్టి
  rationale: ముందున్న పరిస్థితి ఆధారంగా పౌలు చేస్తున్న నిర్ధారణను సహజంగా, స్పష్టంగా సూచిస్తుంది.
- source_word: παρακαλῶ
  choice: వేడుకుంటున్నాను
  rationale: ఆహారం తినమని పౌలు చేస్తున్న హృదయపూర్వకమైన, బలమైన విజ్ఞప్తిని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: μεταλαβεῖν τροφῆς
  choice: కొంత ఆహారం తీసుకోవాలని
  rationale: ఆహారాన్ని స్వీకరించి బలపడాలనే భావాన్ని సహజమైన తెలుగు ప్రయోగంతో అందిస్తుంది.
- source_word: τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει
  choice: ఇది మీ ప్రాణరక్షణకు తోడ్పడుతుంది
  rationale: సముద్ర ప్రమాద సందర్భంలో σωτηρία శారీరక రక్షణ లేదా ప్రాణాలతో బయటపడటాన్ని సూచిస్తుంది; πρὸς నిర్మాణంలోని ప్రయోజన భావాన్ని ‘తోడ్పడుతుంది’ తెలియజేస్తుంది.
- source_word: σωτηρίας
  choice: ప్రాణరక్షణ
  rationale: ఇక్కడ నిత్యరక్షణ కంటే ఓడ ప్రమాదం నుండి శారీరకంగా ప్రాణాలతో బయటపడటమే సందర్భానుగుణ భావం; అదే సమయంలో మూలపదంలోని రక్షణ భావాన్ని నిలుపుతుంది.
- source_word: οὐδενὸς γὰρ ὑμῶν
  choice: మీలో ఎవరి...కూడా
  rationale: ప్రతి వ్యక్తికీ వర్తించే గ్రీకు విభజనాత్మక భావాన్ని సహజమైన తెలుగు ప్రతికూల నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: θρὶξ ἀπὸ τῆς κεφαλῆς
  choice: తల నుండైనా ఒక్క వెంట్రుక కూడా
  rationale: పూర్తి శారీరక భద్రతను తెలిపే మూలభాషా నానుడిని, ἀπό లోని ‘నుండి’ భావంతో సహా నిలుపుతుంది.
- source_word: ἀπολεῖται
  choice: నశించదు
  rationale: ἀπόλλυμι యొక్క ‘పోవడం/నశించడం’ భావాన్ని, ఒక్క వెంట్రుకకూ హాని కలగదనే బలమైన హామీగా అందిస్తుంది.
theological_decisions:
- issue: ఈ సందర్భంలో σωτηρία అర్థం
  choice: శారీరక ప్రాణరక్షణ
  alternative: రక్షణ / ఆత్మీయ రక్షణ
  rationale: తక్షణ సందర్భం తుఫాను, ఓడ ప్రమాదం, అందరూ ప్రాణాలతో బయటపడతారనే హామీకి సంబంధించినది. అందువల్ల ప్రధాన పాఠ్యంలో శారీరక ప్రాణరక్షణ భావం స్పష్టం చేయబడింది; మూలపదపు విస్తృత అర్థపరిధి పాదటిప్పణిలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘ప్రాణరక్షణ’ సందర్భాన్ని స్పష్టం చేస్తుండగా, [a] పాదటిప్పణి σωτηρία పదంలోని విస్తృత అర్థపరిధిని సంరక్షిస్తుంది.
