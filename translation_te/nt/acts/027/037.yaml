  yaml_path: translation/nt/acts/027/037.yaml
  text: There were 276 persons in the ship in all[a].
translation:
  language: te
  text: ఓడలో మేమంతా కలిపి 276 మంది ఉన్నాం[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఓడలోని మేమందరం మొత్తం 276 ఆత్మలమై ఉన్నాం.” ఇక్కడ “ఆత్మలు” అంటే ప్రత్యేకంగా దేహరహిత ఆత్మలు అని కాదు; “వ్యక్తులు” లేదా “మనుషులు” అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμεθα
  choice: ఉన్నవారమంతా … మందిమి
  rationale: గ్రీకు క్రియ ప్రథమ పురుష బహువచనం (‘మేము ఉన్నాము/ఉన్నవారము’). తెలుగులో వ్యక్తుల మొత్తం సంఖ్యను సహజంగా తెలియజేస్తూనే, కథకుడు కూడా ఆ సమూహంలో ఉన్నాడనే ప్రథమ పురుష భావాన్ని ‘మందిమి’ నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప కథన సంధానాన్ని సూచిస్తుంది; బలమైన వ్యతిరేకత లేదా కాలార్థం లేదు. తెలుగులో వాక్యప్రవాహమే ఆ అనుసంధానాన్ని సహజంగా అందిస్తుంది.
- source_word: αἱ πᾶσαι ψυχαὶ
  choice: ఉన్నవారమంతా
  rationale: ఇక్కడ ψυχαί అంటే అభౌతిక ‘ఆత్మలు’ అని ప్రత్యేకంగా కాదు, మనుషులు లేదా వ్యక్తులు అని అర్థం. ‘అంతా’ πᾶσαι సూచించే సంపూర్ణ మొత్తాన్ని తెలియజేస్తుంది.
- source_word: ἐν τῷ πλοίῳ
  choice: ఓడలో
  rationale: గ్రీకు స్థానార్థక పదబంధాన్ని సహజమైన ఆధునిక తెలుగు రూపంలో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: διακόσιαι ἑβδομήκοντα ἕξ
  choice: '276'
  rationale: మూలంలోని ఖచ్చిత సంఖ్యను సాధారణ అంకెలలో సులభంగా చదివేలా అందిస్తుంది.
theological_decisions:
- issue: ψυχαί అనే పదానికి సందర్భానుసార అర్థం
  choice: వ్యక్తులు/మనుషులు అనే భావంలో ‘ఉన్నవారు’
  alternative: ‘ఆత్మలు’
  rationale: ఈ ఓడ ప్రయాణికుల లెక్కలో ψυχαί మొత్తం వ్యక్తులను సూచించే వాడుక; ‘ఆత్మలు’ అని అనువదిస్తే దేహానికి భిన్నమైన అభౌతిక భాగం గురించిన ఉద్దేశం ఉందనే అనవసరమైన వేదాంత భావం కలగవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘మందిమి’ ద్వారా మూలంలోని ప్రథమ పురుష బహువచనాన్ని నిలిపి, ‘మొత్తం’ మరియు ‘అంతా’ ద్వారా నౌకలోని సంపూర్ణ సంఖ్యను స్పష్టం చేసింది.
