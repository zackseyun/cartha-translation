source:
  edition: SBLGNT
  text: καὶ τὰς ἀγκύρας περιελόντες εἴων εἰς τὴν θάλασσαν, ἅμα ἀνέντες τὰς ζευκτηρίας τῶν πηδαλίων, καὶ ἐπάραντες τὸν ἀρτέμωνα τῇ πνεούσῃ κατεῖχον εἰς τὸν αἰγιαλόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/040.yaml
  text: And after casting off the anchors[a], they left them in the sea; at the same time loosening the ropes of the rudders, and hoisting the foresail to the wind[b], they made for the beach.
translation:
  language: te
  text: వారు లంగరులను విడిచిపెట్టి, వాటిని సముద్రంలోనే వదిలేశారు. అదే సమయంలో చుక్కాని తెడ్డులను కట్టివుంచిన తాళ్లను[a] విప్పి, గాలికి ముందరి తెరచాపను[b] ఎత్తి, సముద్రపు ఒడ్డు వైపు నౌకను నడిపించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చుక్కాని తెడ్డుల బంధాలను.” ζευκτηρίας అనేది చుక్కాని వ్యవస్థను కట్టివుంచిన కట్లు లేదా బంధాలను సూచించే అరుదైన నౌకాయాన పదం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పై తెరచాపను,” లేక “నౌక ముందుభాగంలోని తెరచాపను.” ἀρτέμων అనే గ్రీకు నౌకాయాన పదం ఖచ్చితంగా ఏ తెరచాపను సూచిస్తుందో అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιελόντες τὰς ἀγκύρας
  choice: లంగరులను విడదీసి
  rationale: περιαιρέω ఇక్కడ లంగరులను నౌక నుండి వదిలించడాన్ని సూచిస్తుంది. ‘విడదీసి’ అనేది అవి తరువాత సముద్రంలోనే వదిలివేయబడ్డాయనే సందర్భానికి సహజంగా సరిపోతుంది; మూలంలో స్పష్టంగా లేని ‘కోసి’ అనే భావాన్ని చేర్చదు.
- source_word: εἴων εἰς τὴν θάλασσαν
  choice: సముద్రంలోనే వదిలేశారు
  rationale: ἐάω యొక్క ‘వదిలివేయు/పోనివ్వు’ భావాన్ని, ముందున్న లంగరులనే సూచించే కర్మను తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἅμα ἀνέντες
  choice: అదే సమయంలో … విప్పి
  rationale: ἅμα చర్యలు ఏకకాలంలో జరిగాయని తెలియజేస్తుంది; ἀνίημι ఇక్కడ కట్టివుంచిన వాటిని వదులు చేయడం లేదా విప్పడం.
- source_word: τὰς ζευκτηρίας τῶν πηδαλίων
  choice: చుక్కాని తెడ్లను కట్టివుంచిన తాళ్లను
  rationale: πηδάλια ప్రాచీన నౌకలోని జంట steering oars/ruddersను సూచించగలదు; ‘చుక్కాని తెడ్లు’ ఆ రూపాన్ని స్పష్టపరుస్తుంది. అరుదైన ζευκτηρίας వాటిని బిగించి ఉంచిన కట్లు, బంధాలు లేదా తాళ్లను సూచిస్తుంది; ప్రధాన పాఠ్యంలో ‘తాళ్లు’ సాధారణ పాఠకునికి సులభం.
- source_word: ἐπάραντες τὸν ἀρτέμωνα τῇ πνεούσῃ
  choice: గాలికి ముందరి తెరచాపను ఎత్తి
  rationale: ἐπαίρω అంటే పైకెత్తడం; πνεούσῃ సందర్భంలో వీచే గాలిని సూచిస్తుంది. ἀρτέμων ఖచ్చితంగా ఏ తెరచాపో అనిశ్చితం; ‘ముందరి తెరచాప’ సాధ్యమైన నౌకాయానార్థాన్ని ఇస్తూ అనిశ్చితిని పాదసూచికలో నిలుపుతుంది.
- source_word: κατεῖχον εἰς τὸν αἰγιαλόν
  choice: సముద్రతీరం వైపు నౌకను నడిపించారు
  rationale: κατέχω ఇక్కడ లక్ష్యం వైపు నౌకను నడిపించడం/దారి పట్టించడం అనే నౌకాయాన భావంలో ఉంది. αἰγιαλός తీరాన్ని, ప్రత్యేకంగా దిగగల సముద్రపు ఒడ్డును సూచిస్తుంది.
