  source_fidelity: 'The sequence of nautical actions is preserved well: abandoning the anchors, releasing the steering apparatus, raising the uncertain sail to the wind, and steering toward land. A small revision improves the distinction between releasing the anchors and leaving them in the sea, and renders αἰγιαλός more specifically as a beach/shore rather than the broader ‘coast.’'
