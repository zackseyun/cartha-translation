translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకునికి అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. అరుదైన నౌకాయాన పదాలకు ప్రధాన పాఠ్యంలో స్పష్టమైన పదాలను ఎంచుకొని, నిజమైన పదార్థ అనిశ్చితులను పాదసూచికల్లో ఉంచాం. ఆంగ్ల సంప్రదింపు పాఠ్యంలో [a] గుర్తు లంగరుల తరువాత ఉన్నప్పటికీ, దాని పాదసూచిక ζευκτηρίας గురించినది కావడంతో మూల గ్రీకు ఆధారంగా ఆ గుర్తును చుక్కాని తెడ్ల తాళ్ల దగ్గర ఉంచాం.
