    issue: ‘సముద్రతీరం’ is broader than αἰγιαλός.
    rationale: αἰγιαλός denotes a beach or shore suitable as the vessel’s immediate destination. ‘సముద్రపు ఒడ్డు’ better retains this specificity.
  - severity: low
    issue: ‘చుక్కాని తెడ్లు’ can be made more natural as ‘చుక్కాని తెడ్డులు.’
    rationale: The revised form is the more usual Telugu expression for steering oars while preserving the plural πηδάλια.
