  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. సముద్ర సంబంధిత రెండు పాత్రలను స్పష్టంగా వేరు చేసింది; మూలంలోని πείθω పదార్థ అనిశ్చితిని పాదసూచికలో నిలిపింది.
