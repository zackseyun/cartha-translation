  yaml_path: translation/nt/acts/027/011.yaml
  text: But the centurion paid more attention to the pilot and the shipowner than to what was being said by Paul[a].
translation:
  language: te
  text: అయితే శతాధిపతి పౌలు చెప్పిన మాటలకంటే ఓడ నడిపేవాడు, ఓడ యజమాని చెప్పిన మాటలనే ఎక్కువగా నమ్మాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పౌలు చెప్పిన మాటలకన్నా ఓడ నడిపేవాడు, ఓడ యజమాని వల్ల అతడు ఎక్కువగా ఒప్పించబడ్డాడు.”
    reason: ἐπείθετο అనే పదానికి ‘నమ్మాడు’ అనే సహజ సందర్భానుగుణ భావంతో పాటు, ‘ఒప్పించబడ్డాడు’ అనే మరింత రూపసామ్యమైన అనువాదం కూడా సాధ్యమని చూపించడానికి.
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: శతాధిపతి
  rationale: రోమా సైన్యంలో వందమంది సైనికులకు సాధారణంగా అధిపతిగా ఉండే అధికారిని సూచించే స్థిరమైన, చారిత్రక తెలుగు పదం.
- source_word: κυβερνήτῃ
  choice: ఓడ నడిపేవాడు
  rationale: ఓడను నడిపే లేదా దాని ప్రయాణాన్ని నిర్దేశించే వ్యక్తిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ναύκληρος‌తో ఉన్న పాత్రభేదాన్ని నిలుపుతుంది.
- source_word: ναυκλήρῳ
  choice: ఓడ యజమాని
  rationale: ఓడకు యజమాని లేదా ప్రధాన నిర్వాహకుడిని సూచించే సాధ్యమైన అర్థాన్ని నేరుగా వ్యక్తపరుస్తూ κυβερνήτης‌కు భిన్నమైన పాత్రగా ఉంచుతుంది.
- source_word: μᾶλλον ἐπείθετο
  choice: ఎక్కువగా నమ్మాడు
  rationale: వారి మాటకు ఒప్పించబడటం లేదా ఎక్కువ విశ్వాసం ఇవ్వడం అనే πείθω భావాన్ని, μᾶλλον యొక్క తులనాత్మక బలంతో సహజంగా తెలియజేస్తుంది.
- source_word: τοῖς ὑπὸ Παύλου λεγομένοις
  choice: పౌలు చెప్పిన మాటలు
  rationale: పౌలు పలికిన హెచ్చరిక లేదా సలహాను సూచించే ఆర్టిక్యులర్ పాసివ్ పార్టిసిపిల్‌ను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వచనంలో పౌలు ఇచ్చిన హెచ్చరికకు విరుద్ధంగా శతాధిపతి స్పందించినట్లు సూచిస్తుంది.
- source_word: ἢ
  choice: కంటే
  rationale: μᾶλλον‌తో కలిసి ఉన్న తులనను తెలుగులో నేరుగా తెలియజేస్తుంది.
