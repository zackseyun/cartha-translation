id: ACT.27.10
reference: Acts 27:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· Ἄνδρες, θεωρῶ ὅτι μετὰ ὕβρεως καὶ πολλῆς ζημίας οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ τῶν ψυχῶν ἡμῶν μέλλειν ἔσεσθαι τὸν πλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/010.yaml
  text: saying to them[a], “Men, I perceive that the voyage is about to be with disaster and great loss, not only of the cargo and the ship[b], but also of our lives.”
translation:
  language: te
  text: 'వారితో ఇలా అన్నాడు: “అయ్యలారా, ఈ సముద్రయానంలో సరుకుకూ ఓడకూ మాత్రమే కాక, మన ప్రాణాలకు[b] కూడా తీవ్ర హానీ[a], ఎంతో నష్టమూ కలగబోతున్నాయని నేను గ్రహిస్తున్నాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “విపత్తూ.” ఈ గ్రీకు పదం ఈ సందర్భంలో సముద్రయానంతో కూడిన తీవ్రమైన కష్టం, గాయం లేదా నాశనకరమైన దెబ్బను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “మన ఆత్మలకు”; అయితే ఓడ మునిగి మరణించే ప్రమాదం గురించి మాట్లాడుతున్న ఈ సందర్భంలో “మన ప్రాణాలకు” అనే అర్థం వస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: వారితో ఇలా అన్నాడు
  rationale: ఈ వర్తమాన కృదంతం కథనంలో ప్రధాన క్రియకు అనుబంధంగా వస్తుంది; ఆధునిక తెలుగులో సహజమైన కథన ప్రవాహం కోసం పరిమిత క్రియగా అనువదించబడింది.
- source_word: Ἄνδρες
  choice: అయ్యలారా
  rationale: పురుషులతో కూడిన ఓడ సమూహాన్ని నేరుగా సంబోధించే గౌరవప్రదమైన, సహజమైన తెలుగు రూపం.
- source_word: θεωρῶ
  choice: నేను గ్రహిస్తున్నాను
  rationale: కేవలం కంటితో చూడడం కాకుండా, పరిస్థితిని పరిశీలించి ఏర్పరచుకున్న అంచనా లేదా అవగాహనను తెలియజేస్తుంది.
- source_word: μετὰ ὕβρεως καὶ πολλῆς ζημίας
  choice: తీవ్ర హానీ, ఎంతో నష్టమూ
  rationale: ὕβρις ఇక్కడ నైతిక అహంకారాన్ని కాకుండా సముద్రయానంతో కూడిన తీవ్ర హాని లేదా విపత్తును సూచిస్తుంది; ζημία నష్టం లేదా దెబ్బను సూచిస్తుంది. మూలంలోని రెండు సమీపార్థక భావాల తీవ్రతను నిలుపుతుంది.
- source_word: οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ
  choice: సరుకుకూ ఓడకూ మాత్రమే కాకుండా ... కూడా
  rationale: నష్టం ఏవాటికి కలుగుతుందో తెలుగులో సహజంగా దత్త విభక్తితో వ్యక్తం చేస్తూ, ‘మాత్రమే కాకుండా ... కూడా’ అనే మూల నిర్మాణాన్ని నిలుపుతుంది.
- source_word: τῶν ψυχῶν ἡμῶν
  choice: మన ప్రాణాలకు
  rationale: ఓడ మునిగి మరణించే ప్రమాద సందర్భంలో ψυχή భౌతిక జీవితం లేదా ప్రాణాన్ని సూచిస్తుంది; ‘మన ప్రాణాలు’ ఈ సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: μέλλειν ἔσεσθαι
  choice: కలగబోతున్నాయని
  rationale: సమీప భవిష్యత్తులో సంభవించనున్నదనే నిరీక్షణను లేదా అంచనాను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸν πλοῦν
  choice: ఈ సముద్రయానం
  rationale: πλοῦς అంటే సముద్ర మార్గంలోని ప్రయాణం; ‘సముద్రయానం’ సంక్షిప్తంగా, సందర్భోచితంగా ఉంది.
