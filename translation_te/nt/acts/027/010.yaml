- from: 'వారితో ఇలా అన్నాడు: “అయ్యలారా, ఈ సముద్రయానం వల్ల సరుకుకూ ఓడకూ మాత్రమే కాకుండా మన ప్రాణాలకు[b] కూడా తీవ్ర హానీ[a], ఎంతో నష్టమూ కలగబోతున్నాయని నేను గ్రహిస్తున్నాను.”'
  to: 'వారితో ఇలా అన్నాడు: “అయ్యలారా, ఈ సముద్రయానంలో సరుకుకూ ఓడకూ మాత్రమే కాక, మన ప్రాణాలకు[b] కూడా తీవ్ర హానీ[a], ఎంతో నష్టమూ కలగబోతున్నాయని నేను గ్రహిస్తున్నాను.”'
  rationale: 'The revision removes the unintended causal nuance of “వల్ల” and places the anticipated harm and loss within the voyage, while preserving the Greek contrast: not only cargo and ship, but also our lives. No doctrinal or interpretive expansion has been introduced.'
