translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని హాని–నష్టం అనే ద్వంద్వ తీవ్రతను తొలగించకుండా, తెలుగు వాక్య నిర్మాణంలో సహజంగా అమర్చబడింది.
