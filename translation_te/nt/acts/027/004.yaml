source:
  edition: SBLGNT
  text: κἀκεῖθεν ἀναχθέντες ὑπεπλεύσαμεν τὴν Κύπρον διὰ τὸ τοὺς ἀνέμους εἶναι ἐναντίους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/004.yaml
  text: And from there[a], after putting out to sea, we sailed under the lee of Cyprus, because the winds were against us.
translation:
  language: te
  text: అక్కడి నుండి సముద్రంలోకి బయలుదేరి, గాలులు మాకు ప్రతికూలంగా ఉండడం వల్ల సైప్రస్ ద్వీపం చాటున[a] ఓడలో ప్రయాణించాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సైప్రస్ ద్వీపం గాలికి మరుగైన వైపున ఓడలో ప్రయాణించాం.’ ఇక్కడి గ్రీకు క్రియ ద్వీపం గాలికి మరుగైన వైపున ప్రయాణించడాన్ని సూచించే నౌకాయాన పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: అక్కడి నుండి
  rationale: καί కలిసిన ἐκεῖθεν కథన కొనసాగింపును సూచిస్తుంది; తెలుగులో ‘అక్కడి నుండి’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ἀναχθέντες
  choice: సముద్రంలోకి బయలుదేరి
  rationale: నౌకాయాన సందర్భంలో ἀνάγω సముద్రంలోకి బయలుదేరడాన్ని సూచిస్తుంది. గ్రీకులో లేని ‘లంగరు ఎత్తి’ అనే నిర్దిష్ట భావాన్ని చేర్చకుండా అనువదించబడింది.
- source_word: ὑπεπλεύσαμεν
  choice: చాటున ఓడలో ప్రయాణించాం
  rationale: ὑποπλέω అనే నౌకాయాన పదం ఒక ద్వీపం గాలికి మరుగైన, రక్షితమైన వైపున ప్రయాణించడాన్ని సూచిస్తుంది. ‘చాటున’ ఈ భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τὴν Κύπρον
  choice: సైప్రస్ ద్వీపం
  rationale: Κύπροςకు ప్రామాణిక తెలుగు రూపం ‘సైప్రస్’; సందర్భ స్పష్టత కోసం ‘ద్వీపం’ చేర్చబడింది.
- source_word: διὰ τὸ ... εἶναι
  choice: ఉండడం వల్ల
  rationale: διάతో కూడిన articular infinitive కారణాన్ని వ్యక్తం చేస్తుంది; ‘ఉండడం వల్ల’ తెలుగులో సహజమైన కారణార్థక నిర్మాణం.
- source_word: τοὺς ἀνέμους
  choice: గాలులు
  rationale: ἄνεμος బహువచనానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: ἐναντίους
  choice: మాకు ఎదురుగా
  rationale: ἐναντίους ప్రతికూలంగా లేదా ఎదురుగా ఉండటాన్ని సూచిస్తుంది. నౌకలో ఉన్నవారికి గాలులు ఎదురుగా ఉన్నాయనే సందర్భార్థాన్ని ‘మాకు’ స్పష్టం చేస్తుంది.
