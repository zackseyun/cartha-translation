source:
  edition: SBLGNT
  text: ἐπιβάντες δὲ πλοίῳ Ἀδραμυττηνῷ ⸀μέλλοντι πλεῖν ⸀εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους ἀνήχθημεν ὄντος σὺν ἡμῖν Ἀριστάρχου Μακεδόνος Θεσσαλονικέως·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/002.yaml
  text: So we boarded an Adramyttian ship that was about to sail to the places along Asia, and put out to sea, with Aristarchus, a Macedonian from Thessalonica, being with us.
translation:
  language: te
  text: అప్పుడు మేము ఆసియా[a] తీరం వెంబడి ఉన్న ప్రదేశాలకు[b] ప్రయాణించబోతున్న ఒక అద్రముత్తియ ఓడ ఎక్కి, సముద్రంలోకి బయలుదేరాము; థెస్సలొనీకకు చెందిన మాసిదోనీయుడైన అరిస్తార్కు మాతో ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘ఆసియా’ అంటే ఆధునిక ఆసియా ఖండం కాదు; పశ్చిమ ఆసియా మైనరులోని రోమా పాలిత ఆసియా ప్రాంతం.
    reason: cultural_note
  - marker: b
    text: లేదా, “ఆసియా తీరం వెంబడి ఉన్న రేవులకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιβάντες
  choice: ఓడ ఎక్కాము
  rationale: నౌకాయాన సందర్భంలో ఓడలోకి ఎక్కడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ప్రధాన క్రియకు ముందున్న కార్యక్రమాన్ని కూడా నిలుపుతుంది.
- source_word: δὲ
  choice: కాబట్టి
  rationale: ఇక్కడ బలమైన వ్యతిరేకత కాకుండా కథన పురోగతిని సూచిస్తుంది; మునుపటి వచనంతో సహజ అనుసంధానం కలిగిస్తుంది.
- source_word: πλοίῳ Ἀδραμυττηνῷ
  choice: అద్రముత్తియకు చెందిన ఒక ఓడ
  rationale: Ἀδραμυττηνῷ అనే విశేషణం ఓడ స్వస్థలాన్ని లేదా బయలుదేరిన నౌకాశ్రయాన్ని సూచిస్తుంది; తెలుగులో సంబంధబోధక నిర్మాణం స్పష్టంగా ఉంటుంది.
- source_word: μέλλοντι πλεῖν
  choice: వెళ్లబోతూ ఉంది
  rationale: μέλλω మరియు క్రియారూపం సమీప భవిష్యత్తు లేదా ఉద్దేశాన్ని సూచిస్తాయి; ఓడ ప్రయాణ సందర్భంలో ఇది సహజమైన తెలుగు.
- source_word: εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους
  choice: ఆసియా తీరం వెంబడి ఉన్న ప్రదేశాలకు
  rationale: κατά యొక్క భౌగోళిక భావాన్ని, అలాగే నౌకాయాన సందర్భంలో ఉద్దేశింపబడిన తీర ప్రాంతాలను స్పష్టంగా తెలియజేస్తుంది; ‘రేవులు’ అని ప్రధాన పాఠ్యంలో మరీ నిర్దిష్టం చేయదు.
- source_word: Ἀσίαν
  choice: ఆసియా
  rationale: మూలంలోని చారిత్రక ప్రాంతనామాన్ని నిలుపుతుంది; ఆధునిక ఖండంతో గందరగోళం రాకుండా పాదసూచికలో వివరణ ఇచ్చింది.
- source_word: ἀνήχθημεν
  choice: సముద్రంలోకి బయలుదేరాము
  rationale: ఇది రేవు నుండి సముద్రంలోకి బయలుదేరడాన్ని సూచించే ప్రామాణిక నౌకాయాన ప్రయోగం; తెలుగులో భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὄντος σὺν ἡμῖν
  choice: మాతో ఉన్నాడు
  rationale: అరిస్తార్కు వారితో ఉన్నాడనే అనుబంధ పరిస్థితిని స్పష్టమైన, సహజమైన తెలుగు వాక్యంగా అందిస్తుంది.
- source_word: Ἀριστάρχου
  choice: అరిస్తార్కు
  rationale: వ్యక్తి పేరును గ్రీకు ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించింది.
- source_word: Μακεδόνος
  choice: మాసిదోనీయుడైన
  rationale: అరిస్తార్కు ప్రాంతీయ గుర్తింపును తెలుగులో సహజమైన విశేషణ నిర్మాణంతో తెలియజేస్తుంది.
- source_word: Θεσσαλονικέως
  choice: థెస్సలొనీకకు చెందిన
  rationale: అతని పట్టణాన్ని స్పష్టంగా గుర్తిస్తుంది; వరుసగా రెండు ప్రాంతవాసి నామాలను వాడే అసహజతను నివారిస్తుంది.
