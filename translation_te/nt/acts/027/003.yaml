id: ACT.27.3
reference: Acts 27:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῇ τε ἑτέρᾳ κατήχθημεν εἰς Σιδῶνα, φιλανθρώπως τε ὁ Ἰούλιος τῷ Παύλῳ χρησάμενος ἐπέτρεψεν πρὸς τοὺς φίλους ⸀πορευθέντι ἐπιμελείας τυχεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/003.yaml
  text: And on the next day we put in at Sidon[a], and Julius, treating Paul kindly[b], permitted him to go to his friends and receive care.
translation:
  language: te
  text: మరుసటి రోజు మేము సీదోను రేవుకు చేరుకున్నాం. యూలియుడు పౌలు పట్ల దయతో వ్యవహరించి[a], అతడు తన స్నేహితుల దగ్గరికి వెళ్లి వారి సంరక్షణ పొందేందుకు[b] అనుమతించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దయతో వ్యవహరించి’ అనే మాటను ‘మానవీయంగా వ్యవహరించి’ అని కూడా అనువదించవచ్చు; బందీగా ఉన్న పౌలు పట్ల యూలియుడు చూపిన దయాపూర్వక ప్రవర్తనను గ్రీకు పదం నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘సంరక్షణ పొందేందుకు’ అనే మాటను ‘శ్రద్ధ పొందేందుకు’ లేదా ‘అవసరమైన సహాయం పొందేందుకు’ అని కూడా అనువదించవచ్చు; స్నేహితుల ద్వారా అవసరాలు తీర్చబడడాన్ని గ్రీకు ప్రయోగం విస్తృతంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἑτέρᾳ
  choice: మరుసటి రోజు
  rationale: కథనంలోని కాలక్రమంలో ఈ దత్తివిభక్తి ప్రయోగం ‘తరువాతి రోజు’ అనే అర్థాన్నిస్తుంది; ఆధునిక తెలుగులో ‘మరుసటి రోజు’ సహజంగా ఉంది.
- source_word: κατήχθημεν εἰς Σιδῶνα
  choice: మేము సీదోను రేవుకు చేరుకున్నాం
  rationale: κατάγω ఇక్కడ నౌకాయాన సందర్భంలో ఓడను తీరానికి లేదా రేవుకు తీసుకురావడం, రేవులో ప్రవేశించడం అనే భావాన్ని ఇస్తుంది. ‘రేవుకు చేరుకున్నాం’ ఆ సముద్రయాన సందర్భాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: φιλανθρώπως ... χρησάμενος
  choice: పౌలు పట్ల దయతో వ్యవహరించి
  rationale: ఈ పదబంధం ఒక వ్యక్తి పట్ల దయగా, మానవీయంగా ప్రవర్తించడాన్ని సూచిస్తుంది. ‘దయతో వ్యవహరించి’ సహజమైనదిగా ఉండి యూలియుడి సానుకూల ప్రవర్తనను నిలుపుతుంది.
- source_word: ἐπέτρεψεν
  choice: అనుమతించాడు
  rationale: అధికారంలో ఉన్న యూలియుడు పౌలుకు అనుమతి ఇచ్చాడనే భావాన్ని స్పష్టంగా, గౌరవప్రదమైన కథన శైలిలో వ్యక్తం చేస్తుంది.
- source_word: πρὸς τοὺς φίλους
  choice: తన స్నేహితుల దగ్గరికి
  rationale: ఇక్కడి నిర్దిష్ట బహువచనం సీదోనులో పౌలుకు తెలిసిన స్నేహితులను సూచించే అవకాశం ఉంది; తెలుగులో సంబంధాన్ని సహజంగా తెలియజేయడానికి ‘తన స్నేహితులు’ వాడబడింది.
- source_word: πορευθέντι
  choice: వెళ్లి
  rationale: అనుమతించబడిన చర్యను తెలుగులో సహజమైన అనుక్రమ క్రియగా వ్యక్తం చేస్తుంది; గ్రీకు అసమాపక క్రియ యొక్క భావం నిలుస్తుంది.
- source_word: ἐπιμελείας τυχεῖν
  choice: వారి సంరక్షణ పొందేందుకు
  rationale: ఈ గ్రీకు ప్రయోగం శ్రద్ధ, సంరక్షణ లేదా అవసరమైన సహాయం పొందడాన్ని విస్తృతంగా సూచించగలదు. ‘సంరక్షణ పొందేందుకు’ సందర్భానికి సరిపోయే విశాలమైన పదబంధం.
