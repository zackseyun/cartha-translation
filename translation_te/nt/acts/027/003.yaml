translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. నౌకాయాన సందర్భం కోసం ‘రేవుకు’ చేర్చబడింది. మూలంలోని దయ/మానవీయత మరియు సంరక్షణ/సహాయం అనే భావవిస్తృతులను పాదసూచికల్లో నిలిపాం.
