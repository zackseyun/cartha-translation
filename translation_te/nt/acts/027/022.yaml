source:
  edition: SBLGNT
  text: καὶ τὰ νῦν παραινῶ ὑμᾶς εὐθυμεῖν, ἀποβολὴ γὰρ ψυχῆς οὐδεμία ἔσται ἐξ ὑμῶν πλὴν τοῦ πλοίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/022.yaml
  text: And now I urge you to take courage[a], for there will be no loss of life among you[b], except for the ship.
translation:
  language: te
  text: ఇప్పుడు ధైర్యంగా ఉండాలని మిమ్మల్ని ప్రోత్సహిస్తున్నాను[a]. ఎందుకంటే మీలో ఎవరి ప్రాణమూ పోదు[b]; ఓడ మాత్రం నాశనమవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనోధైర్యంతో ఉండాలని” లేదా “ధైర్యం కోల్పోకుండా ఉండాలని.”
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా, “ప్రాణనష్టం ఏదీ ఉండదు.” ఇక్కడ ψυχή అనే పదం భౌతిక జీవాన్ని సూచిస్తుంది; ప్రత్యేకంగా ‘ఆత్మ’ను కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: అయితే ఇప్పుడు
  rationale: ప్రస్తుత పరిస్థితిలో పౌలు చేస్తున్న ప్రోత్సాహాన్ని సహజమైన తెలుగులో పరిచయం చేస్తుంది; καί యొక్క అనుసంధాన భావాన్నీ సందర్భానుసారంగా నిలుపుతుంది.
- source_word: παραινῶ
  choice: కోరుతున్నాను
  rationale: సలహా, ప్రోత్సాహం కలిసిన బలమైన విజ్ఞప్తిని ఆధునిక సాధారణ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: εὐθυμεῖν
  choice: ధైర్యంగా ఉండాలని
  rationale: మంచి మనోధైర్యంతో ఉండడం అనే భావాన్ని తుఫాను సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: ἀποβολὴ ψυχῆς
  choice: ప్రాణమూ పోదు
  rationale: ఇక్కడ ψυχή భౌతిక జీవాన్ని సూచిస్తుంది; తెలుగు వాడుకలో ‘ప్రాణం పోవడం’ జీవనష్టాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: οὐδεμία ἔσται ἐξ ὑμῶν
  choice: మీలో ఎవరి ... పోదు
  rationale: సమూహంలో ఒక్కరి జీవితం కూడా నష్టపోదనే బలమైన నిరాకరణను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: πλὴν τοῦ πλοίου
  choice: ఓడ మాత్రమే నాశనమవుతుంది
  rationale: వ్యక్తుల ప్రాణనష్టానికి విరుద్ధంగా ఓడ మాత్రం పోతుందనే సంక్షిప్త గ్రీకు మినహాయింపును తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ψυχή యొక్క సందర్భార్థం
  choice: ప్రాణం
  alternative: ఆత్మ
  rationale: ఈ సముద్ర ప్రమాద సందర్భంలో పదం భౌతిక జీవాన్ని సూచిస్తుంది; ‘ఆత్మ’ అని అనువదిస్తే మూలపాఠంలో ఉద్దేశించని శరీరం–ఆత్మ భేదార్థం కలగవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన సంభాషణ శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని సంక్షిప్త ‘ఓడ తప్ప’ అనే నిర్మాణాన్ని తెలుగులో సహజత, స్పష్టత కోసం ‘ఓడ మాత్రమే నాశనమవుతుంది’గా విప్పి చెప్పాం.
