id: ACT.27.35
reference: Acts 27:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀εἴπας δὲ ταῦτα καὶ λαβὼν ἄρτον εὐχαρίστησεν τῷ θεῷ ἐνώπιον πάντων καὶ κλάσας ἤρξατο ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/035.yaml
  text: And after saying these things and taking bread[a], he gave thanks to God in the presence of all, and after breaking it, he began to eat.
translation:
  language: te
  text: 'ఈ మాటలు చెప్పిన తర్వాత అతడు రొట్టె తీసుకొని, అందరి సమక్షంలో[a] దేవునికి కృతజ్ఞతలు చెల్లించాడు. దాన్ని విరిచి తినడం మొదలుపెట్టాడు.


    [a] లేదా, ‘అందరి ఎదుట.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అందరి ఎదుట.’
    reason: ἐνώπιον πάντων అనే పదబంధానికి సహజమైన ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: εἴπας δὲ ταῦτα
  choice: ఈ మాటలు చెప్పిన తర్వాత
  rationale: Aorist participle ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచిస్తుంది. δέ ఇక్కడ కథనాన్ని కొనసాగించే స్వల్ప అనుసంధాన పదం; తెలుగులో ప్రత్యేకంగా అనువదించకపోవడం సహజ కథన ప్రవాహాన్ని ఇస్తుంది.
- source_word: λαβὼν ἄρτον
  choice: రొట్టె తీసుకొని
  rationale: ἄρτον అనే నిర్దిష్టతలేని పదాన్ని ‘ఒక రొట్టె’ లేదా ‘కొంత రొట్టె’ అని అధికంగా నిర్దిష్టపరచకుండా సరళంగా అనువదిస్తుంది.
- source_word: εὐχαρίστησεν τῷ θεῷ
  choice: దేవునికి కృతజ్ఞతలు చెల్లించాడు
  rationale: εὐχαριστέω యొక్క సాధారణ అర్థమైన కృతజ్ఞత తెలపడాన్ని, దేవుడు దాని గ్రహీత అనే దత్తివాచక భావంతో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐνώπιον πάντων
  choice: అందరి సమక్షంలో
  rationale: ఆ చర్య అందరూ చూస్తుండగా బహిరంగంగా జరిగిందనే భావాన్ని గౌరవప్రదమైన, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: κλάσας
  choice: దాన్ని విరిచి
  rationale: ముందు ప్రస్తావించిన రొట్టెనే విరిచాడని తెలుగులో స్పష్టత కోసం ‘దాన్ని’ చేర్చబడింది; participle ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచిస్తుంది.
- source_word: ἤρξατο ἐσθίειν
  choice: తినడం మొదలుపెట్టాడు
  rationale: ἄρχομαι + infinitive లోని ఆరంభార్థాన్ని సహజమైన ఆధునిక తెలుగులో కాపాడుతుంది.
theological_decisions:
- issue: ‘రొట్టె తీసుకొని—కృతజ్ఞతలు చెల్లించి—విరిచి—తినడం’ అనే క్రమంలో ప్రభుభోజన ప్రతిధ్వని ఉండగల అవకాశం
  choice: చర్యలను సాధారణ భోజన కథనంగా అనువదించడం
  alternative: సాంప్రదాయ ప్రభుభోజన పదజాలాన్ని ఉపయోగించి ఆచార సంబంధ భావాన్ని మరింత స్పష్టంచేయడం
  rationale: ఈ పదక్రమం ప్రభుభోజన వృత్తాంతాలను పాఠకులకు గుర్తుచేయవచ్చు; అయితే ఈ వచనం ఓడలో పౌలు బహిరంగంగా ఆహారం తినడాన్నే ప్రత్యక్షంగా వివరిస్తుంది, దానిని ప్రభుభోజనమని చెప్పదు. అందువల్ల సాధ్యమైన ప్రతిధ్వనిని నిరాకరించకుండా, వచనం చేయని ఆచార సంబంధ నిర్ధారణను అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అదే సమయంలో గౌరవప్రదమైన కథన శైలిని నిలుపుకుంది. గ్రీకు వాక్యంలోని participle క్రమాన్ని తెలుగులో సహజమైన వరుస చర్యలుగా వ్యక్తం చేసింది.
