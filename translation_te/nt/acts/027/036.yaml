  text: Then all of them became encouraged and also took food[a][b].
translation:
  language: te
  text: అప్పుడు వారందరూ ధైర్యం తెచ్చుకొని, తాము కూడా ఆహారం తీసుకున్నారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఉత్సాహం పొందారు,’ లేదా ‘మంచి మనోస్థితికి వచ్చారు.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘తాము కూడా ఆహారం తీసుకున్నారు’; ఇతరులు పౌలు చేసినదాన్ని అనుసరించారని ఇది నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὔθυμοι
  choice: ధైర్యం తెచ్చుకొని
  rationale: ఈ పదం ఉత్సాహంగా లేదా మంచి మనోస్థితిలో ఉండడాన్ని సూచిస్తుంది. ఓడప్రమాద భయం మధ్య వారి మనోస్థితిలో వచ్చిన మార్పును సహజమైన ఆధునిక తెలుగులో ‘ధైర్యం తెచ్చుకొని’ తెలియజేస్తుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ బలమైన వ్యతిరేకత కంటే కథనంలోని తదుపరి పరిణామాన్ని సూచిస్తుంది; పౌలు చేసినదాని తరువాత జరిగిన స్పందనకు ‘అప్పుడు’ సహజంగా సరిపోతుంది.
- source_word: γενόμενοι
  choice: తెచ్చుకొని
  rationale: εὔθυμοιతో కలిసి ఒక మనోస్థితిలోకి రావడాన్ని సూచిస్తుంది. తెలుగులో ‘ధైర్యం తెచ్చుకొని’ అనే సంయుక్త వ్యక్తీకరణ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: πάντες
  choice: వారందరూ
  rationale: ఓడలోని మొత్తం సమూహాన్ని సమగ్రంగా సూచించే గ్రీకు పదబలాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: καὶ αὐτοὶ
  choice: తాము కూడా
  rationale: పౌలు మాదిరిని ఇతరులు కూడా అనుసరించారనే అదనపు మరియు ఉద్ఘాటన భావాలను రెండింటినీ నిలుపుతుంది.
- source_word: προσελάβοντο
  choice: తీసుకున్నారు
  rationale: τροφῆςతో కలిసి ‘ఆహారం తీసుకోవడం’ అనే భావం ఇస్తుంది. ‘తిన్నారు’ అని పూర్తిగా వివరణాత్మకంగా మార్చకుండా గ్రీకు వాడుకను సహజ తెలుగులో కాపాడుతుంది.
- source_word: τροφῆς
  choice: ఆహారం
  rationale: తినడానికి తీసుకున్న భోజనాన్ని సూచించడానికి గౌరవప్రదమైన, సాధారణ ఆధునిక తెలుగు పదం.
