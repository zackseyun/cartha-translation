  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకులోని మనోస్థితి మార్పును ‘ధైర్యం తెచ్చుకొని’ అని, καὶ αὐτοὶలోని ఉద్ఘాటనను ‘తాము కూడా’ అని నిలిపాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన వచనంలో ఉంది.
