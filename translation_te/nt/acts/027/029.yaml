source:
  edition: SBLGNT
  text: φοβούμενοί τε ⸂μή που κατὰ⸃ τραχεῖς τόπους ἐκπέσωμεν ἐκ πρύμνης ῥίψαντες ἀγκύρας τέσσαρας ηὔχοντο ἡμέραν γενέσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/029.yaml
  text: And fearing that we might run aground on rocky places[b][a], they dropped four anchors from the stern and prayed for day to come.
translation:
  language: te
  text: ఓడ గరుకైన ప్రదేశాలపైకి కొట్టుకుపోతుందేమోనని భయపడి, వారు ఓడ వెనుక భాగం నుండి నాలుగు లంగర్లు దించి, తెల్లవారాలని ప్రార్థిస్తూ ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తెల్లవారాలని కోరుకుంటూ ఉన్నారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβούμενοί
  choice: భయపడి
  rationale: క్రియావిశేషణ రూపంలోని ఈ పదం తరువాతి చర్యలకు కారణమైన భయాన్ని సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: μή που κατὰ τραχεῖς τόπους ἐκπέσωμεν
  choice: ఓడ రాళ్లతో నిండిన ప్రదేశాల మీదికి కొట్టుకుపోతుందేమోనని
  rationale: సముద్రయాన సందర్భంలో ఓడ ప్రమాదకరమైన గరుకైన లేదా రాతి ప్రదేశాల మీదికి కొట్టుకుపోయే భయాన్ని ఇది వ్యక్తం చేస్తుంది; తీరం, దిబ్బలు లేదా బండరాళ్లు అని అతిగా నిర్దిష్టం చేయదు.
- source_word: ἐκπέσωμεν
  choice: కొట్టుకుపోతుందేమో
  rationale: ఇక్కడ క్రియ ఓడ గాలి లేదా అలల వల్ల ప్రమాదకర ప్రదేశం మీదికి నెట్టబడడాన్ని సూచిస్తుంది; తెలుగు సముద్రయాన సందర్భంలో ‘కొట్టుకుపోవడం’ సహజంగా ఉంటుంది.
- source_word: ἐκ πρύμνης
  choice: ఓడ వెనుక భాగం నుండి
  rationale: πρύμνα అంటే ఓడ వెనుక భాగం. సాధారణ పాఠకులకు సాంకేతిక పదం కంటే ఈ స్పష్టమైన రూపం సులభంగా అర్థమవుతుంది.
- source_word: ῥίψαντες ἀγκύρας τέσσαρας
  choice: నాలుగు లంగర్లు దించి
  rationale: లంగర్లు నీటిలో వేయడాన్ని ఆధునిక తెలుగులో ‘దించడం’ సహజంగా వ్యక్తం చేస్తుంది; ఈ చర్య ప్రధాన క్రియకు ముందు జరిగినదని నిర్మాణం చూపిస్తుంది.
- source_word: ηὔχοντο
  choice: ప్రార్థిస్తూ ఉన్నారు
  rationale: εὔχομαι ఇక్కడ ప్రార్థించడాన్ని సూచించగలదు; అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న చర్యను ‘ప్రార్థిస్తూ ఉన్నారు’ నిలుపుతుంది.
- source_word: ἡμέραν γενέσθαι
  choice: తెల్లవారాలని
  rationale: అక్షరార్థంగా ‘పగలు కావాలని’ ఉన్న భావాన్ని, వెలుగు రావాలని వారు ఎదురుచూసిన సందర్భానికి సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ηὔχοντο అనే పదం ప్రార్థననా లేక కోరికనా
  choice: ప్రార్థిస్తూ ఉన్నారు
  alternative: తెల్లవారాలని కోరుకుంటూ ఉన్నారు
  rationale: ఈ క్రియకు ‘ప్రార్థించు’ మరియు ‘కోరుకొను’ అనే భావాలు రెండూ సాధ్యమే. సందర్భంలో ప్రార్థన అనే అర్థం సముచితమైనప్పటికీ, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచి మూలంలోని అర్థవిస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘ఓడ వెనుక భాగం’ సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఎంచుకోబడింది; ‘లంగరు’ ప్రాచుర్యంలో ఉన్న సముద్రయాన పదంగా నిలుపబడింది.
