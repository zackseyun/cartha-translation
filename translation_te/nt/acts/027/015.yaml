  yaml_path: translation/nt/acts/027/015.yaml
  text: And when the ship was caught and could not face the wind[a], we gave way and were driven along.
translation:
  language: te
  text: ఓడ గాలికి చిక్కి, గాలిని ఎదుర్కొని సాగలేకపోయినప్పుడు, మేము గాలికి ఎదుర్కోవడం మానేసి కొట్టుకుపోతూ ఉన్నాము.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మేము గాలికి లొంగి, కొట్టుకుపోతూ ఉన్నాము.”
    reason: ἐπιδόντες ἐφερόμεθα అనే పదబంధానికి ప్రత్యామ్నాయంగా, గాలికి ప్రతిఘటించడాన్ని విడిచి దాని చేత మోయబడిన భావాన్ని మరింత సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
lexical_decisions:
- source_word: συναρπασθέντος
  choice: పట్టుకు చిక్కినప్పుడు
  rationale: కర్త నియంత్రణకు అతీతమైన బాహ్య శక్తి ఓడను అకస్మాత్తుగా పట్టుకున్నదనే భూతకర్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: πλοίου
  choice: ఓడ
  rationale: ఈ సముద్రయాన సందర్భంలో πλοῖονకు సాధారణ ఆధునిక తెలుగు పదం.
- source_word: μὴ δυναμένου
  choice: సాగలేక
  rationale: ఓడకు గాలిని ఎదుర్కొంటూ ముందుకు సాగే సామర్థ్యం లేకపోయిందనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀντοφθαλμεῖν
  choice: గాలికి ఎదురుగా సాగ
  rationale: అక్షరార్థంగా ‘ఎదుర్కొను’ అనే భావమున్న ఈ నౌకాయాన క్రియ, ఇక్కడ గాలికి ఎదురుగా ఓడను నడపడం అనే సందర్భోచిత అర్థాన్ని ఇస్తుంది.
- source_word: ἀνέμῳ
  choice: గాలికి
  rationale: మూలపదం సాధారణంగా ‘గాలి’ అని అర్థం; సందర్భంలోని తుఫాను తీవ్రతను ఈ పదంలోనే అదనంగా చేర్చలేదు.
- source_word: ἐπιδόντες
  choice: ప్రయత్నం మానుకొని
  rationale: గాలిని ఎదిరిస్తూ ఓడను నడిపే ప్రయత్నాన్ని విడిచిపెట్టడాన్ని సూచిస్తుంది; తెలుగులో ‘లొంగిపోయి’ అనేది వ్యక్తిగత సమర్పణ భావాన్ని కలిగించవచ్చు కాబట్టి నివారించబడింది.
- source_word: ἐφερόμεθα
  choice: గాలి కొట్టుకుపోయిన దిశగా సాగిపోయాము
  rationale: అసంపూర్ణ భూతకర్మక క్రియలోని బాహ్య శక్తి చేత నిరంతరం మోసుకుపోవడాన్ని, తుఫాను సందర్భానికి తగిన విధంగా వ్యక్తం చేస్తుంది.
- source_word: δέ
  choice: —
  rationale: తెలుగు కథన ప్రవాహంలో ప్రత్యేక సంధికారకం లేకుండానే సహజంగా కొనసాగుతుంది; దాని కథన-కొనసాగింపు విధి వాక్యక్రమంలో నిలిచింది.
