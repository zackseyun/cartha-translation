source:
  edition: SBLGNT
  text: ἐν ἱκαναῖς δὲ ἡμέραις βραδυπλοοῦντες καὶ μόλις γενόμενοι κατὰ τὴν Κνίδον, μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου, ὑπεπλεύσαμεν τὴν Κρήτην κατὰ Σαλμώνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/007.yaml
  text: For many days we were sailing slowly[a], and with difficulty we came opposite Cnidus. Since the wind did not allow us to go farther, we sailed under the lee of Crete[b], off Salmone.
translation:
  language: te
  text: చాలా రోజులపాటు మేము నెమ్మదిగా ఓడలో ప్రయాణిస్తూ, ఎంతో కష్టంతో క్నీదుకు ఎదురుగా చేరాం. గాలి మమ్మల్ని ముందుకు సాగనివ్వకపోవడంతో, సల్మోనే వద్దగా క్రేతు ద్వీపం గాలికి రక్షణగా ఉన్న వైపున[a] ప్రయాణించాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “క్రేతు కిందుగా ఓడలో ప్రయాణించాం.” అంటే, ద్వీపం గాలికి అడ్డుగా ఉండి రక్షణ ఇచ్చే వైపు, అంటే గాలి నుంచి ఆశ్రయం కలిగే వైపున ప్రయాణించాం.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἱκαναῖς δὲ ἡμέραις
  choice: చాలా రోజులపాటు
  rationale: ἐν + కాలసూచక దత్తివిభక్తి ఇక్కడ దీర్ఘకాల వ్యవధిని సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: βραδυπλοοῦντες
  choice: మేము నెమ్మదిగా ఓడలో ప్రయాణించి
  rationale: క్రియ సముద్రయానంలో నెమ్మదిగా సాగడాన్ని సూచిస్తుంది; తరువాతి μόλις తెలిపే కష్టభావంతో దీనిని కలిపివేయలేదు.
- source_word: μόλις γενόμενοι κατὰ τὴν Κνίδον
  choice: ఎంతో కష్టంతో క్నీదుకు ఎదురుగా వచ్చాం
  rationale: μόλις ప్రయాసను సూచిస్తుంది; κατά + స్థలనామం సముద్రయాన సందర్భంలో ఆ ప్రదేశానికి ఎదురుగా లేదా దాని సమీప తీరానికి వెలుపల చేరడాన్ని సూచిస్తుంది.
- source_word: μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου
  choice: గాలి మమ్మల్ని ముందుకు సాగనివ్వకపోవడంతో
  rationale: ఈ genitive absolute దారి మార్చడానికి కారణాన్ని తెలియజేస్తుంది; προσεάω ఇక్కడ చేరనివ్వడం లేదా ముందుకు సాగనివ్వడం అనే భావాన్ని కలిగి ఉంది.
- source_word: ὑπεπλεύσαμεν τὴν Κρήτην
  choice: క్రీతు ద్వీపపు గాలి తగలని వైపున ఓడ నడిపించాం
  rationale: ὑποπλέω నావిక వాడుకలో ద్వీపం అందించే రక్షణలో, గాలి తక్కువగా తగిలే వైపున ప్రయాణించడాన్ని సూచిస్తుంది.
- source_word: κατὰ Σαλμώνην
  choice: సల్మోనేకు ఎదురుగా
  rationale: తీరప్రాంత గుర్తుతో κατά వాడకం ఆ స్థలానికి ఎదురుగా లేదా దాని తీరానికి వెలుపల ఉన్న స్థానాన్ని సూచిస్తుంది.
- source_word: Κνίδον / Κρήτην / Σαλμώνην
  choice: క్నీదు / క్రీతు / సల్మోనే
  rationale: గ్రీకు స్థలనామాల ధ్వనికి సమీపంగా, తెలుగులో చదవడానికి అనువైన లిప్యంతరీకరణలు ఎంచుకున్నాం.
