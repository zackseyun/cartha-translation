translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. నావిక సందర్భాన్ని సాధారణ పాఠకుడు గ్రహించేలా ‘గాలి తగలని వైపు’ అని చెప్పి, అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
