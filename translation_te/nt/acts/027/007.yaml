- from: చాలా రోజులపాటు మేము నెమ్మదిగా ఓడలో ప్రయాణించి, ఎంతో కష్టంతో క్నీదుకు ఎదురుగా వచ్చాం. గాలి మమ్మల్ని ముందుకు సాగనివ్వకపోవడంతో, సల్మోనేకు ఎదురుగా క్రీతు ద్వీపపు గాలి తగలని వైపున[a] ఓడ నడిపించాం.
