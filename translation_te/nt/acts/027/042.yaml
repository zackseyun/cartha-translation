translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. మూలంలోని ప్రతికూల ఉద్దేశ వాక్యాన్ని స్పష్టంగా ఉంచుతూ అనవసర వివరణను జోడించలేదు.
