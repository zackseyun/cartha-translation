  yaml_path: translation/nt/acts/027/042.yaml
  text: The soldiers’ plan was to kill the prisoners, so that no one might swim away and escape.
translation:
  language: te
  text: అయితే, ఎవరైనా ఈదుకుంటూ తప్పించుకుంటారేమోనని సైనికులు ఖైదీలను చంపాలని పథకం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν δὲ στρατιωτῶν βουλὴ ἐγένετο
  choice: కానీ సైనికులు ... పథకం వేశారు
  rationale: δὲ ఇక్కడ సందర్భంలోని మలుపును సూచిస్తుంది; βουλὴ ἐγένετο అనే గ్రీకు నామవాచక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు క్రియారూపంలో వ్యక్తం చేశాం.
- source_word: τοὺς δεσμώτας
  choice: ఖైదీలను
  rationale: బంధించబడిన వారిని సూచించే సాధారణ, సహజ తెలుగు పదం.
- source_word: ἀποκτείνωσιν
  choice: చంపాలని
  rationale: మూలంలోని ఉద్దేశాన్ని నేరుగా, అలంకారరహితంగా తెలిపే పదం.
- source_word: μή τις ἐκκολυμβήσας διαφύγῃ
  choice: ఎవరూ ఈదుకుంటూ తప్పించుకోకుండా
  rationale: μή τις లోని నిరోధక ఉద్దేశాన్ని ‘ఎవరూ ...కుండా’గా, ἐκκολυμβήσας మరియు διαφύγῃ చర్యలను వరుసగా సహజంగా ప్రతిబింబిస్తుంది.
