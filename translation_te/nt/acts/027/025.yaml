  text: διὸ εὐθυμεῖτε, ἄνδρες· πιστεύω γὰρ τῷ θεῷ ὅτι οὕτως ἔσται καθ’ ὃν τρόπον λελάληταί μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/025.yaml
  text: Therefore[a], take courage, men, for I believe God that it will be just as it has been told to me.
translation:
  language: te
  text: కాబట్టి ధైర్యంగా ఉండండి, అయ్యలారా! నాకు చెప్పబడిన విధంగానే జరుగుతుందని నేను దేవుణ్ణి నమ్ముతున్నాను[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను దేవునిపై నమ్మకం ఉంచుతున్నాను.” గ్రీకు నిర్మాణం దేవుణ్ణి నమ్మడాన్నీ, దేవుడు చెప్పిన మాటను నిజమని విశ్వసించడాన్నీ నొక్కిచెప్పగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: కాబట్టి
  rationale: ముందు ఇచ్చిన హామా, ప్రోత్సాహం ఆధారంగా తీసుకున్న ముగింపును సహజమైన తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: εὐθυμεῖτε
  choice: ధైర్యంగా ఉండండి
  rationale: ప్రమాదకరమైన పరిస్థితిలో ధైర్యం కోల్పోకుండా ఉండమనే ఆజ్ఞను ఆధునిక, సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἄνδρες
  choice: అయ్యలారా
  rationale: ఓడలో ఉన్న పురుషులను నేరుగా సంబోధించే పిలుపును, లింగసూచనను తటస్థీకరించకుండా, తెలుగులో సహజంగా అందిస్తుంది.
- source_word: πιστεύω τῷ θεῷ
  choice: నేను దేవుణ్ణి నమ్ముతున్నాను
  rationale: దేవుడు చెప్పిన మాటను నిజమని స్వీకరించడాన్నీ, ఆయనపై వ్యక్తిగత నమ్మకాన్నీ వ్యక్తపరచగల సహజ తెలుగు నిర్మాణం.
- source_word: ὅτι
  choice: అని
  rationale: పౌలు నమ్ముతున్న విషయం ఏమిటో పరిచయం చేస్తుంది; కారణార్థకంగా అనువదించదు.
- source_word: οὕτως ἔσται καθ’ ὃν τρόπον
  choice: చెప్పబడిన విధంగానే జరుగుతుంది
  rationale: జరగబోయేది తనకు తెలియజేసిన సందేశానికి సరిగ్గా అనుగుణంగా ఉంటుందనే పోలికను స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: λελάληταί μοι
  choice: నాకు చెప్పబడిన
  rationale: పరిపూర్ణకాల కర్మణి రూపంలోని ముందే పలికిన, ఇప్పటికీ ప్రాముఖ్యతగల సందేశ భావాన్ని కర్మణి నిర్మాణంతో నిలుపుతుంది.
theological_decisions:
- issue: πιστεύω τῷ θεῷ అనువాదం
  choice: నేను దేవుణ్ణి నమ్ముతున్నాను
  alternative: నేను దేవునిపై నమ్మకం ఉంచుతున్నాను
  rationale: దత్తివుతో వచ్చిన గ్రీకు నిర్మాణం దేవుణ్ణి నమ్మడం—అంటే ఆయన మాటను నిజమని స్వీకరించడం—అనే భావాన్ని నేరుగా ఇస్తుంది. ప్రధాన పాఠం వ్యక్తిగత నమ్మకాన్నీ, చెప్పిన మాటపై విశ్వాసాన్నీ రెండింటినీ తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి వాడబడింది. ‘అయ్యలారా’ అనేది పురుషులతో చేసిన ప్రత్యక్ష సంబోధనను నిలుపుతూ, ‘పురుషులారా’ కంటే సందర్భానుకూలంగా వినిపిస్తుంది.
