source:
  edition: SBLGNT
  text: Ὅτε δὲ ἡμέρα ἐγένετο, τὴν γῆν οὐκ ἐπεγίνωσκον, κόλπον δέ τινα κατενόουν ἔχοντα αἰγιαλὸν εἰς ὃν ⸀ἐβουλεύοντο εἰ ⸀δύναιντο ⸀ἐξῶσαι τὸ πλοῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/039.yaml
  text: When day came[a], they did not recognize the land, but they noticed a certain bay with a beach, into which they planned, if they could, to run the ship ashore.
translation:
  language: te
  text: పగలు కాగానే వారు ఆ భూభాగాన్ని గుర్తుపట్టలేదు. అయితే తీరం ఉన్న ఒక అఖాతాన్ని గమనించి, సాధ్యమైతే ఓడను అందులోకి నడిపించి ఒడ్డునకు ఎక్కించగలమా అని ఆలోచించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఓడను ఒడ్డుకు నెట్టాలని.” గ్రీకు క్రియ ఓడను ఒడ్డుమీదికి నెట్టడం లేదా బలవంతంగా చేర్చడం అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ ἡμέρα ἐγένετο
  choice: పగలు కాగానే
  rationale: పగటి వెలుగు రావడాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపే కాలవాచక ప్రయోగం; δέ యొక్క స్వల్ప కథన సంధిని ప్రత్యేక పదంతో అతిగా చూపలేదు.
- source_word: τὴν γῆν οὐκ ἐπεγίνωσκον
  choice: వారు ఆ భూభాగాన్ని గుర్తుపట్టలేదు
  rationale: ἐπιγινώσκω లోని గుర్తించడం అనే భావాన్ని నిలుపుతుంది; γῆను సందర్భానుసారంగా, కేవలం తీరమని పరిమితం చేయకుండా ‘భూభాగం’గా ఇచ్చింది.
- source_word: κόλπον δέ τινα κατενόουν
  choice: అయితే ... ఒక సముద్రపు అఖాతాన్ని గమనించి
  rationale: κόλπος యొక్క సముద్ర సంబంధిత ‘bay/inlet’ భావానికి ‘సముద్రపు అఖాతం’ స్పష్టమైన తెలుగు; τινα యొక్క అనిర్దిష్టతను ‘ఒక’ నిలుపుతుంది; κατενόουνను ‘గమనించి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔχοντα αἰγιαλὸν
  choice: ఒడ్డుగల
  rationale: αἰγιαλόςను ‘ఒడ్డు’గా అందిస్తూ, మూలంలో లేని ఇసుక తీరమనే వివరాన్ని చేర్చదు.
- source_word: εἰς ὃν
  choice: అందులోకి
  rationale: εἰς యొక్క దిశార్థాన్ని, ముందున్న అఖాతాన్ని సూచించే సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐβουλεύοντο
  choice: అనుకున్నారు
  rationale: వారు ఆలోచించి ఏర్పరచుకున్న ఉద్దేశాన్ని సహజమైన కథన తెలుగులో తెలియజేస్తుంది; తుది నిర్ణయం అనే భావాన్ని అవసరానికి మించి బలపరచదు.
- source_word: εἰ δύναιντο
  choice: సాధ్యమైతే
  rationale: సామర్థ్యం లేదా అవకాశం మీదున్న షరతును సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ἐξῶσαι τὸ πλοῖον
  choice: ఓడను ... నడిపించి ఒడ్డుకు ఎక్కించాలని
  rationale: ఓడను బలవంతంగా తీరంపైకి చేర్చే నౌకా సందర్భార్థాన్ని పాఠకులకు సులభంగా అర్థమయ్యే తెలుగులో తెలియజేస్తుంది.
