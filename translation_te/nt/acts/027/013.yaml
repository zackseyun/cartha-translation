  register: ఆధునిక ప్రామాణిక తెలుగులో, కథన ప్రవాహం సహజంగా ఉండేలా గౌరవప్రదమైన సాధారణ శైలిని ఉపయోగించాం. నౌకాయాన పదజాలంలో విస్తృతంగా అర్థమయ్యే ‘లంగరు’ను ఎంచుకున్నాం.
