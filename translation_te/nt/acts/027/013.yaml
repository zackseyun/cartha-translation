source:
  edition: SBLGNT
  text: Ὑποπνεύσαντος δὲ νότου δόξαντες τῆς προθέσεως κεκρατηκέναι ἄραντες ἆσσον παρελέγοντο τὴν Κρήτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/013.yaml
  text: And when a south wind began to blow gently[a], thinking that they had obtained their purpose, they weighed anchor and sailed along Crete[c][b], close inshore.
translation:
  language: te
  text: దక్షిణ గాలి మెల్లగా వీయడం మొదలైనప్పుడు, తాము ఉద్దేశించినది నెరవేరిందని భావించి, వారు లంగరు ఎత్తి[a] క్రీతు తీరం వెంబడి ఒడ్డుకు మరింత దగ్గరగా ప్రయాణించారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఎత్తి.” నౌకాయాన సందర్భంలో సూచిత కర్మ లంగరు; అందువల్ల “లంగరు ఎత్తి” అని అర్థం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “క్రీతు తీరం వెంబడి, తీరం వైపునకు మరింత దగ్గరగా ప్రయాణించారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποπνεύσαντος
  choice: మెల్లగా వీయడం మొదలైనప్పుడు
  rationale: క్రియ గాలి సున్నితంగా వీయడాన్ని సూచిస్తుంది; సందర్భంలోని ఆరంభ భావాన్ని సహజమైన తెలుగులో కూడా వ్యక్తం చేస్తుంది.
- source_word: νότου
  choice: దక్షిణ గాలి
  rationale: νότος ఇక్కడ దక్షిణ దిశనుంచి వీచే గాలిని సూచిస్తుంది.
- source_word: δόξαντες
  choice: భావించి
  rationale: ఇది కనిపించడం అనే భావం కంటే, పరిస్థితిని బట్టి వారు చేసుకున్న అంచనాను సూచిస్తుంది.
- source_word: τῆς προθέσεως κεκρατηκέναι
  choice: తాము అనుకున్నది నెరవేరిందని
  rationale: వారు ఉద్దేశించిన ప్రయాణ ప్రణాళిక సాధ్యమైందని భావించారనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది; దీనికి సిద్ధాంతపరమైన 'సంకల్పం' భావాన్ని ఆపాదించదు.
- source_word: ἄραντες
  choice: లంగరు ఎత్తి
  rationale: అక్షరార్థంగా 'ఎత్తి' అని ఉన్నా, నౌకాయాన సందర్భంలో చెప్పని కర్మ లంగరే; తెలుగులో స్పష్టమైన నౌకాయాన ప్రయోగం.
- source_word: ἆσσον
  choice: ఒడ్డుకు దగ్గరగా
  rationale: ἆσσον అనే తులనాత్మక క్రియావిశేషణం 'మరింత దగ్గరగా' అనే భావం ఇస్తుంది; తీరప్రయాణ సందర్భంలో ఒడ్డుకు దగ్గరగా అని సహజంగా వ్యక్తమవుతుంది.
- source_word: παρελέγοντο
  choice: తీరం వెంబడి ... ప్రయాణించారు
  rationale: నౌకలో ఒక తీరాన్ని ఆనుకొని ప్రయాణించడాన్ని సూచించే క్రియ; ఆధునిక తెలుగులో అర్థవంతంగా ఉంది.
- source_word: τὴν Κρήτην
  choice: క్రీతు
  rationale: మూలంలో ద్వీపం పేరే కర్మగా ఉంది; తెలుగు వాక్య నిర్మాణంలో 'క్రీతు తీరం వెంబడి' అని చెప్పడం తీరప్రయాణ భావాన్ని స్పష్టం చేస్తుంది.
