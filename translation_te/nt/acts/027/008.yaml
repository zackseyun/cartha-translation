  yaml_path: translation/nt/acts/027/008.yaml
  text: And with difficulty coasting along it[a], we came to a certain place called Fair Havens, near which was a city named Lasea.
translation:
  language: te
  text: మేము ఎంతో కష్టంతో దాని తీరం వెంబడి ప్రయాణిస్తూ[a], ‘మంచి రేవులు’ అని పిలిచే ఒక ప్రదేశానికి చేరుకున్నాం. దానికి సమీపంలో లసయ అనే ఒక పట్టణం ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎంతో కష్టంతో దాని తీరాన్ని ఆనుకొని ఓడలో ప్రయాణిస్తూ.” παραλεγόμενοι అనే గ్రీకు పదం తీరప్రాంతం వెంబడి ఓడలో ప్రయాణించడాన్ని సూచించే నౌకాయాన పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: μόλις
  choice: ఎంతో కష్టంగా
  rationale: ప్రయాణం తీవ్రమైన కష్టంతోనే సాగిందనే క్రియావిశేషణ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τε
