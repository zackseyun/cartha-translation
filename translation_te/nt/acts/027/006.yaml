  yaml_path: translation/nt/acts/027/006.yaml
  text: There the centurion found an Alexandrian ship sailing for Italy[a], and he put us on board it.
translation:
  language: te
  text: అక్కడ శతాధిపతి ఇటలీకి ప్రయాణిస్తున్న అలెగ్జాండ్రియాకు చెందిన ఓడను కనుగొని, మమ్మల్ని దానిలో ఎక్కించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖ
  choice: అక్కడ
  rationale: κἀκεῖ అంటే ‘మరియు అక్కడ’ లేదా సందర్భానుసారంగా ‘అక్కడ’; తెలుగు కథన ప్రవాహంలో ‘అక్కడ’ సహజంగా ఉండి స్థల సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: εὑρὼν
  choice: కనుగొని
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచించే ఏఓరిస్ట్ కృదంతాన్ని తెలుగు అనుసంధాన క్రియారూపమైన ‘కనుగొని’ సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἑκατοντάρχης
  choice: శతాధిపతి
  rationale: రోమా సైనిక హోదాను సూచించే సంప్రదాయబద్ధమైన, సంక్షిప్తమైన తెలుగు పదం.
- source_word: πλοῖον Ἀλεξανδρῖνον
  choice: అలెగ్జాండ్రియ ఓడను
  rationale: Ἀλεξανδρῖνον ఓడను అలెగ్జాండ్రియతో—దాని మూలస్థలం లేదా నమోదుతో—సంబంధింపజేస్తుంది; ‘అలెగ్జాండ్రియ ఓడ’ ఆ సంబంధాన్ని అనవసరంగా నిర్ధారించకుండా ఉంచుతుంది.
- source_word: πλέον εἰς τὴν Ἰταλίαν
  choice: ఇటలీకి వెళ్తున్న
  rationale: ప్రస్తుత కృదంతం మరియు గమ్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; సముద్రయాన సందర్భం ‘ఓడ’ వల్ల స్పష్టమవుతుంది.
- source_word: ἐνεβίβασεν ἡμᾶς εἰς αὐτό
  choice: మమ్మల్ని దానిలో ఎక్కించాడు
  rationale: కర్త ఇతరులను ఓడలో ఎక్కేలా చేసిన causative భావాన్ని ‘ఎక్కించాడు’ స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, కథనానికి తగిన గౌరవప్రదమైన సరళ శైలి. మూలంలోని క్రియాక్రమం మరియు ఓడ గమ్యాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో నిలిపాం.
