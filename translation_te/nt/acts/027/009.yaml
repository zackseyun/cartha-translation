  text: Ἱκανοῦ δὲ χρόνου διαγενομένου καὶ ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι, παρῄνει ὁ Παῦλος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/009.yaml
  text: Since considerable time had passed and the voyage was already dangerous[a], because even the Fast had already gone by, Paul was advising them[b],
translation:
  language: te
  text: 'చాలా సమయం గడిచిపోయింది. ఉపవాసం[a] కూడా అప్పటికే గడిచిపోవడం వల్ల సముద్ర ప్రయాణం అప్పటికే ప్రమాదకరంగా ఉంది. అప్పుడు పౌలు వారికి సలహా ఇస్తూ ఉన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, బహుశా ప్రాయశ్చిత్త దినాన పాటించే ఉపవాసం. గ్రీకు పాఠ్యంలో ‘ఉపవాసం’ అని మాత్రమే ఉంది. ఈ వార్షిక యూదుల ఉపవాసం గడిచిన తరువాత సముద్ర ప్రయాణం ప్రమాదకరంగా మారే కాలం వచ్చేది.
    reason: cultural_note
lexical_decisions:
- source_word: Ἱκανοῦ ... χρόνου διαγενομένου
  choice: చాలా కాలం గడిచిపోయింది
  rationale: గణనీయమైన సమయం గడిచిందనే కాలసూచక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς
  choice: అప్పటికే సముద్ర ప్రయాణం ప్రమాదకరంగా మారింది
  rationale: πλοῦς‌ను ఓడగా కాక సముద్ర ప్రయాణంగా, ἐπισφαλής‌ను సందర్భానుసారంగా ‘ప్రమాదకరంగా’ అనువదిస్తుంది; ఆ సమయానికి నెలకొన్న స్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι
  choice: ఉపవాస దినం కూడా అప్పటికే గడిచిపోయింది. అందువల్ల
  rationale: διάతో కూడిన కారణార్థాన్ని ‘అందువల్ల’ ద్వారా స్పష్టం చేస్తూ, καί యొక్క ‘కూడా’ భావాన్ని మరియు perfect infinitive సూచించే గతస్థితిని నిలుపుతుంది.
- source_word: τὴν νηστείαν
  choice: ఉపవాస దినం
  rationale: నిర్దిష్టమైన యూదుల వార్షిక ఉపవాసాన్ని సూచిస్తున్నప్పటికీ, ప్రధాన పాఠ్యంలో దానిని నేరుగా ‘ప్రాయశ్చిత్త దినం’గా విస్తరించకుండా మూలంలోని సంక్షిప్త సూచనను కాపాడుతుంది.
- source_word: παρῄνει
  choice: సలహా ఇస్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న లేదా ప్రసంగాన్ని పరిచయం చేసే చర్యను నిలుపుతూ, ‘హెచ్చరించాడు’ అనే బలమైన భావాన్ని అనవసరంగా చేర్చదు.
