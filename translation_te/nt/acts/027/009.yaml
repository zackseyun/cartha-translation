- from: 'చాలా కాలం గడిచిపోయింది. అప్పటికే సముద్ర ప్రయాణం ప్రమాదకరంగా మారింది; ఉపవాస దినం[a] కూడా అప్పటికే గడిచిపోయింది. అందువల్ల పౌలు వారికి ఇలా సలహా ఇస్తూ ఉన్నాడు:'
  to: 'చాలా సమయం గడిచిపోయింది. ఉపవాసం[a] కూడా అప్పటికే గడిచిపోవడం వల్ల సముద్ర ప్రయాణం అప్పటికే ప్రమాదకరంగా ఉంది. అప్పుడు పౌలు వారికి సలహా ఇస్తూ ఉన్నాడు:'
  rationale: The revision keeps the source’s compact reference to ‘the Fast’ in the text, places its likely identification only in the note, and clarifies that the Fast’s passing accounts for the danger of sea travel. It also renders the Greek state description with ‘ప్రమాదకరంగా ఉంది’ and retains the imperfect narrative introduction, ‘సలహా ఇస్తూ ఉన్నాడు.’
