  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘అయ్యలారా’ సముద్రయానంలో ఉన్న పురుష సమూహానికి సరిపోయే సహజ సంబోధన. ‘క్రేతు’ అనే స్థలనామ రూపం తెలుగు బైబిలు వాడుకకు అనుగుణంగా ఉంది.
