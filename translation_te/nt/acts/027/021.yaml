id: ACT.27.21
reference: Acts 27:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πολλῆς ⸀τε ἀσιτίας ὑπαρχούσης τότε σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν εἶπεν· Ἔδει μέν, ὦ ἄνδρες, πειθαρχήσαντάς μοι μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης κερδῆσαί τε τὴν ὕβριν ταύτην καὶ τὴν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/021.yaml
  text: Since they had gone a long time without food, then Paul stood up among them and said, “Men, you should have listened to me and not set sail from Crete, and so have avoided this damage and loss.”
translation:
  language: te
  text: 'చాలా కాలంగా వారు ఆహారం తీసుకోకుండా ఉండగా[a], పౌలు వారి మధ్య నిలబడి ఇలా అన్నాడు: “అయ్యలారా, మీరు నా మాటను పాటించి[b], క్రేతు నుండి సముద్రయానానికి బయలుదేరకుండా ఉండాల్సింది. అలా చేసి ఉంటే ఈ హానినీ నష్టాన్నీ[c] తప్పించుకొని ఉండేవారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చాలా కాలం ఉపవాసం ఉండగా.” ఇక్కడి గ్రీకు పదం ఆహారం లేకపోవడాన్ని లేదా తినకుండా ఉండడాన్ని సూచించవచ్చు; ఈ తుఫాను సందర్భంలో చాలాకాలం ఆహారం తీసుకోకపోవడమే ఎక్కువ సంభావ్యం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నాకు లోబడి.” ఈ క్రియ ఒకరి ఆదేశానికి లోబడడం లేదా సలహాను పాటించడం అనే భావాన్ని కలిగి ఉండవచ్చు; ఇక్కడ పౌలు ఇచ్చిన సలహాను పాటించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: “హాని, నష్టం” అనే జంట దెబ్బ లేదా నష్టాన్ని, దాని వల్ల కలిగిన వస్తుపరమైన నష్టాన్ని వేరుగా సూచిస్తూ ఉండవచ్చు. గ్రీకు క్రియకు అక్షరార్థంగా “పొందడం” లేదా “సంపాదించడం” అనే భావం ఉంది; ఇక్కడ సందర్భానుసారంగా ఈ హానినీ నష్టాన్నీ తప్పించుకోవడం లేదా వాటి నుండి తప్పించబడడం అనే అర్థంలో ఉంది.
    reason: translation_note
lexical_decisions:
- source_word: Πολλῆς τε ἀσιτίας ὑπαρχούσης
  choice: చాలా కాలం ఆహారం తీసుకోకుండా ఉన్న తర్వాత
  rationale: జెనిటివ్ అబ్సల్యూట్ పౌలు మాట్లాడినప్పటి నేపథ్య పరిస్థితిని సూచిస్తుంది. ἀσιτία ఆహారం లేకపోవడం లేదా తినకుండా ఉండడం అనే రెండు భావాలనూ కలిగి ఉండగలదు; తుఫాను సందర్భంలో దీర్ఘకాలం ఆహారం తీసుకోకపోవడమే సహజమైన భావం. ‘తర్వాత’ అనేది తప్పనిసరి కారణ సంబంధాన్ని మోపకుండా సందర్భ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν
  choice: పౌలు వారి మధ్య నిలబడి
  rationale: పౌలు సమూహం మధ్య నిలబడి అందరినీ ఉద్దేశించి మాట్లాడిన కథన చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Ἔδει μέν, ὦ ἄνδρες
  choice: అయ్యలారా, ... ఉండాల్సింది
  rationale: Ἔδει గతంలో చేయవలసి ఉండి చేయని పనిని సూచిస్తుంది. ‘ఉండాల్సింది’ ఆ మందలింపు భావాన్ని సహజంగా అందిస్తుంది; ὦ ἄνδρεςకు ‘అయ్యలారా’ గౌరవప్రదమైన, సందర్భోచితమైన పురుష సంబోధన.
- source_word: πειθαρχήσαντάς μοι
  choice: మీరు నా మాట విని
  rationale: πειθαρχέω ఆజ్ఞకు లోబడడం లేదా ఇచ్చిన సలహాను పాటించడం అనే భావాలను కలిగి ఉంటుంది. ఇక్కడ పౌలు ఇంతకు ముందు ఇచ్చిన ప్రయాణ సలహాను ఆలకించి పాటించడమే సందర్భార్థం; ‘నా మాట విని’ అధికారిక విధేయతను అతిగా సూచించదు.
- source_word: μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης
  choice: క్రేతు నుంచి ఓడను బయలుదేరనివ్వకుండా
  rationale: ἀνάγω నావిక సందర్భంలో సముద్రయానానికి బయలుదేరడాన్ని సూచిస్తుంది. మధ్యమ/కర్మణి రూపం మరియు ప్రయాణికుల సమూహాన్ని ఉద్దేశించిన మాటను దృష్టిలో ఉంచి, వారు స్వయంగా నడిపారని అనవసరంగా సూచించకుండా ఈ రూపం ఎంచుకోబడింది.
- source_word: κερδῆσαί τε τὴν ὕβριν ταύτην καὶ τὴν ζημίαν
  choice: అలా చేసి ఉంటే ఈ హానినీ నష్టాన్నీ తప్పించుకునేవారు
  rationale: κερδαίνω సాధారణంగా ‘సంపాదించు/పొందు’ అని అర్థమైనా, ఇక్కడ చేయవలసిన చర్యకు ఫలితంగా హాని, నష్టం కలగకుండా ఉండడమే సందర్భోచిత భావం. ὕβριςను ‘హాని’గా, ζημίαను ‘నష్టం’గా వేరు చేసి ఉంచడం ద్వారా గ్రీకు జంటను కాపాడింది.
