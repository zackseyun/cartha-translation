  text: And when they had eaten enough[c][b][a], they began to lighten the ship by throwing the wheat into the sea.
translation:
  language: te
  text: వారు కడుపునిండా తిన్న తర్వాత[a], గోధుమలను[c] సముద్రంలోకి పారవేస్తూ ఓడను తేలిక చేయసాగారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆహారంతో తృప్తి చెందిన తర్వాత’; లేదా, ‘ఆహారంతో నిండిన తర్వాత.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఓడను తేలిక చేస్తున్నారు’; లేదా సరళంగా, ‘ఓడను తేలిక చేశారు.’ గ్రీకు అసంపూర్ణ భూతకాల రూపం చర్య కొనసాగడాన్ని లేదా ఆరంభాన్ని నొక్కి చెప్పవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ధాన్యాన్ని.’ గ్రీకు పదానికి విస్తృతమైన అర్థం ఉండవచ్చు; అయితే ఇక్కడ అది ప్రత్యేకంగా గోధుమలను సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: κορεσθέντες … τροφῆς
  choice: తృప్తిగా ఆహారం తిన్న తరువాత
  rationale: ఆహారంతో నిండడం లేదా తృప్తి చెందడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; భూతకాల అసమాపక క్రియ యొక్క కాలసంబంధ భావాన్ని ‘తరువాత’ తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ కథనాన్ని స్వల్పంగా ముందుకు నడిపే అనుసంధాన పదం. తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండానే ఆ సంబంధం స్పష్టంగా ఉంటుంది.
- source_word: ἐκούφιζον τὸ πλοῖον
  choice: ఓడను తేలిక చేయడం మొదలుపెట్టారు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న లేదా ఆరంభమైన చర్యను సూచించవచ్చు. సందర్భంలో చర్య ఆరంభాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐκβαλλόμενοι
  choice: పారవేస్తూ
