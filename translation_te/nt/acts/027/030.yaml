id: ACT.27.30
reference: Acts 27:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῶν δὲ ναυτῶν ζητούντων φυγεῖν ἐκ τοῦ πλοίου καὶ χαλασάντων τὴν σκάφην εἰς τὴν θάλασσαν προφάσει ὡς ἐκ πρῴρης ⸂ἀγκύρας μελλόντων⸃ ἐκτείνειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/030.yaml
  text: And when the sailors were seeking to escape from the ship and had lowered the skiff into the sea under the pretense of being about to lay out anchors from the bow[b][a],
translation:
  language: te
  text: నావికులు ఓడనుంచి తప్పించుకోవడానికి ప్రయత్నిస్తూ, ఓడ ముందుభాగం నుంచి లంగర్లు వేయబోతున్నట్టు నటించి, చిన్న పడవను[a] సముద్రంలోకి దించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ఓడకు చెందిన చిన్న పడవను.
    reason: lexical_clarification
lexical_decisions:
- source_word: ναυτῶν
  choice: నావికులు
  rationale: ఓడ సిబ్బందిని సూచించే సహజమైన, ప్రామాణిక ఆధునిక తెలుగు పదం.
- source_word: ζητούντων φυγεῖν
  choice: తప్పించుకోవడానికి ప్రయత్నిస్తూ
  rationale: ζητέω + infinitive లోని ప్రయత్న భావాన్ని, ఓడను విడిచి పారిపోవాలనే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκ τοῦ πλοίου
  choice: ఓడనుంచి
  rationale: మూలంలోని విడిపోవడం లేదా బయటకు వెళ్లడం అనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: χαλασάντων τὴν σκάφην
  choice: చిన్న పడవను ... దించారు
  rationale: σκάφη అనేది ఓడకు చెందిన చిన్న పడవ; ‘దించారు’ χαλάω లోని కిందికి వదిలే చర్యను తెలియజేస్తుంది.
- source_word: εἰς τὴν θάλασσαν
  choice: సముద్రంలోకి
  rationale: మూలపదబంధానికి నేరమైన, సహజమైన అనువాదం.
- source_word: προφάσει ὡς
  choice: '...ట్టు నటించి'
  rationale: వారి నిజ ఉద్దేశాన్ని దాచే మిథ్యా కారణాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκ πρῴρης
  choice: ఓడ ముందుభాగం నుంచి
  rationale: నౌకలోని bow/prow ను సాధారణ పాఠకులకు స్పష్టంగా తెలియజేసే సహజ పదబంధం.
- source_word: ἀγκύρας μελλόντων ἐκτείνειν
  choice: లంగర్లు వేయబోతున్న
  rationale: μέλλω లోని సమీప ఉద్దేశాన్ని, ἐκτείνω యొక్క నౌకాయాన సందర్భార్థాన్ని సహజంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా నౌకాయాన పదజాలాన్ని మితంగా వాడాం. గ్రీకు వాక్యంలోని కొనసాగుతున్న పరిస్థితిని తెలుగులో సహజమైన అసమాపక క్రియలతో వ్యక్తం చేశాం.
