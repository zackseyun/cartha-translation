  text: And on the third day they threw the ship’s gear overboard with their own hands[a].
translation:
  language: te
  text: మూడవ రోజున వారు తమ సొంత చేతులతో ఓడ సామగ్రిని సముద్రంలోకి విసిరివేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
