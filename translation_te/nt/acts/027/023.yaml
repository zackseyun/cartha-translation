id: ACT.27.23
reference: Acts 27:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: παρέστη γάρ μοι ταύτῃ τῇ ⸀νυκτὶ τοῦ θεοῦ, οὗ ⸀εἰμι, ᾧ καὶ λατρεύω, ⸀ἄγγελος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/023.yaml
  text: For this very night an angel of the God to whom I belong and whom I also worship stood by me[b][a],
translation:
  language: te
  text: ఎందుకంటే, నేను ఎవరివాడనో, ఎవరిని నేను కూడా ఆరాధిస్తున్నానో[a] ఆ దేవునికి చెందిన ఒక దూత ఈ రాత్రే నా పక్కన నిలిచాడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సేవిస్తున్నానో”; గ్రీకు క్రియ దేవునికి చేసే పవిత్ర సేవను లేదా ఆరాధనను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέστη
  choice: నా పక్కన నిలబడి
  rationale: పౌలు పక్కన దూత ప్రత్యక్షంగా నిలిచిన స్థలభావాన్ని నిలుపుతుంది; కేవలం ‘నాకు ప్రత్యక్షమై’ అని వ్యాఖ్యానాత్మకంగా మార్చదు.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందున్న సందర్భంలో పౌలు తన ధైర్యానికి కారణాన్ని వివరిస్తున్న అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ταύτῃ τῇ νυκτί
  choice: ఈ రాత్రే
  rationale: సూచకపదంలోని తక్షణతను, ఉద్ఘాటనను ‘-ఏ’ ద్వారా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοῦ θεοῦ
  choice: ఆ దేవుని
  rationale: ఇది ‘దూత’ను విశేషిస్తూ అతడు ఎవరి దూతో గుర్తిస్తుంది; వెంట వచ్చే సంబంధ వాక్యాలకు ‘ఆ’ సహజమైన ఆధారాన్ని ఇస్తుంది.
- source_word: οὗ εἰμι
  choice: నేను ఎవరివాడనో
  rationale: అక్షరార్థమైన ‘నేను ఎవరివాడనో’ అనే స్వామ్య/చెందిక భావాన్ని తెలుగులో సహజంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ᾧ καὶ λατρεύω
  choice: ఎవరిని ఆరాధిస్తున్నానో
  rationale: దేవునికి అర్పించే పవిత్ర సేవ లేదా ఆరాధన భావాన్ని ఇక్కడ స్పష్టంగా తెలియజేస్తుంది; విస్తృతమైన ‘సేవిస్తున్నానో’ అనే భావసాధ్యతను పాదటిప్పణిలో ఉంచింది.
- source_word: ἄγγελος
  choice: దూత
  rationale: దైవిక సందర్భంలో తెలుగులో ‘దేవుని దూత’ సహజంగా దేవదూతను సూచిస్తుంది; మూలంలోని ‘దూత’ భావాన్ని కూడా నిలుపుతుంది.
theological_decisions:
- issue: οὗ εἰμι అనువాదం
  choice: నేను ఎవరివాడనో
  alternative: నేను ఎవరికి చెందినవాడనో
  rationale: ఇది దేవునితో పౌలుకు ఉన్న చెందికను వ్యక్తం చేస్తుంది; మూలంలోని సంక్షిప్త స్వామ్యభావాన్ని అదనపు సిద్ధాంతార్థం చేర్చకుండా నిలుపుతుంది.
- issue: λατρεύω అనువాదం
  choice: ఆరాధిస్తున్నానో
  alternative: సేవిస్తున్నానో
  rationale: దేవునికి సంబంధించిన సందర్భంలో ఈ క్రియ పవిత్ర సేవ/ఆరాధనను సూచిస్తుంది. ప్రధాన పాఠంలో ‘ఆరాధిస్తున్నానో’ స్పష్టంగా ఉంది; ‘సేవిస్తున్నానో’ అనే సముచిత ప్రత్యామ్నాయాన్ని పాదటిప్పణి కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, వాచికంగా సహజమైన నిర్మాణం. గ్రీకు వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, సంబంధ వాక్యాలను దేవునితో స్పష్టంగా అనుసంధానించింది. వాక్యం తరువాతి వచనంలో కొనసాగే ప్రత్యక్ష ప్రసంగానికి ముందుమాట కాబట్టి చివర కామా ఉంచబడింది.
