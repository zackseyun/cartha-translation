id: ACT.27.32
reference: Acts 27:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε ⸂ἀπέκοψαν οἱ στρατιῶται⸃ τὰ σχοινία τῆς σκάφης καὶ εἴασαν αὐτὴν ἐκπεσεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/032.yaml
  text: Then the soldiers cut away the ropes of the skiff and let it fall off[a][b].
translation:
  language: te
  text: అప్పుడు సైనికులు చిన్న పడవ[a] తాళ్లను కోసి, దానిని కొట్టుకుపోవడానికి వదిలేశారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పడవ” లేదా “ఓడకు చెందిన పడవ.” గ్రీకు పదం ప్రధాన ఓడకు కట్టి ఉంచిన చిన్న పడవను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “విడిపోయి దూరంగా పడిపోవడానికి.” సముద్రయాన సందర్భంలో, “కొట్టుకుపోవడానికి” అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: కథనంలో తదుపరి చర్యను సూచించే సహజమైన కాలక్రమ పదం.
- source_word: ἀπέκοψαν
  choice: కోసి
  rationale: తాళ్లను పూర్తిగా తెంచివేసిన భౌతిక చర్యను సందర్భానుసారంగా సహజంగా తెలియజేస్తుంది.
- source_word: οἱ στρατιῶται
  choice: సైనికులు
  rationale: గ్రీకు నామవాచకానికి స్పష్టమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: τὰ σχοινία τῆς σκάφης
  choice: చిన్న పడవ తాళ్లను
  rationale: σχοινία అంటే తాళ్లు; σκάφη ఇక్కడ ప్రధాన ఓడకు చెందిన చిన్న పడవను సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో సంబంధాన్ని సహజంగా తెలిపే రూపం.
- source_word: εἴασαν αὐτὴν
  choice: అది … పోనిచ్చారు
  rationale: ἐάω యొక్క ‘అనుమతించు/పోనివ్వు’ భావాన్ని, ముందున్న చిన్న పడవను సూచించే సర్వనామంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκπεσεῖν
  choice: కొట్టుకుపోనిచ్చారు
  rationale: సముద్రయాన సందర్భంలో తాళ్లు తెగిన చిన్న పడవ ఓడనుండి దూరంగా కొట్టుకుపోవడం అనే భావాన్ని సహజ తెలుగులో ఇస్తుంది; క్రియలోని మరింత అక్షరార్థమైన ‘పడిపోవడం/విడిపోవడం’ భావాన్ని పాదసూచికలో ఉంచింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన కథన శైలి వాడబడింది. “చిన్న పడవ” ప్రధాన ఓడతో ఉన్న పరిమాణ భేదాన్ని స్పష్టపరుస్తుంది; “కొట్టుకుపోనిచ్చారు” సముద్రయాన సందర్భాన్ని సహజంగా అందిస్తూనే ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలుపుతుంది.
