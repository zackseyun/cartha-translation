translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభమైన శైలి. ‘శతాధిపతి’ అనే స్థిరమైన సైనిక హోదాను నిలిపి, సముద్ర ప్రయాణ సందర్భంలో ‘ఒడ్డు’ మరియు ‘నీళ్లలోకి దూకి’ అనే సహజ ప్రయోగాలు వాడబడ్డాయి.
