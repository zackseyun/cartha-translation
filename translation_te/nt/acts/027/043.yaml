id: ACT.27.43
reference: Acts 27:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἑκατοντάρχης βουλόμενος διασῶσαι τὸν Παῦλον ἐκώλυσεν αὐτοὺς τοῦ βουλήματος, ἐκέλευσέν τε τοὺς δυναμένους κολυμβᾶν ἀπορίψαντας πρώτους ἐπὶ τὴν γῆν ἐξιέναι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/043.yaml
  text: But the centurion[a], wanting to save Paul, kept them from their plan, and ordered those who were able to swim to jump overboard first and get to land[b],
translation:
  language: te
  text: అయితే పౌలును కాపాడాలని కోరుకున్న శతాధిపతి, వారి పథకాన్ని అమలు చేయకుండా వారిని అడ్డుకున్నాడు.[a] ఈదగలవారు ముందుగా ఓడ మీద నుంచి నీళ్లలోకి దూకి ఒడ్డుకు చేరాలని ఆజ్ఞాపించాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు తమ ఉద్దేశాన్ని నెరవేర్చకుండా అడ్డుకున్నాడు.” ఇది ముందటి వచనంలో చెప్పిన సైనికుల ఉద్దేశాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ముందుగా తమను తాము కిందికి విసిరేసుకొని భూమి మీదికి వెళ్లాలని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: శతాధిపతి
  rationale: రోమా సైన్యంలో సుమారు వందమందికి అధికారి అనే హోదాకు తెలుగులో స్థిరపడిన, సంక్షిప్తమైన సమానార్థకం.
- source_word: βουλόμενος
  choice: కోరుకున్న
  rationale: ఇక్కడ శతాధిపతి ఉద్దేశం లేదా అభిలాషను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: διασῶσαι
  choice: కాపాడాలని
  rationale: పౌలు ప్రాణాలతో బయటపడేలా సంరక్షించడమే సందర్భార్థం; ‘కాపాడడం’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: ἐκώλυσεν αὐτοὺς τοῦ βουλήματος
  choice: వారి పథకాన్ని అమలు చేయకుండా వారిని అడ్డుకున్నాడు
  rationale: మునుపటి వచనంలో ఖైదీలను చంపాలన్న సైనికుల ఉద్దేశాన్ని కార్యరూపంలో పెట్టకుండా శతాధిపతి నిరోధించాడనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἐκέλευσέν τε
  choice: ఆజ్ఞాపించాడు
  rationale: అధికారి ఇచ్చిన నిర్దేశాన్ని తగిన బలంతో తెలిపే సహజమైన తెలుగు క్రియ.
- source_word: τοὺς δυναμένους κολυμβᾶν
  choice: ఈదగలవారు
  rationale: ఈదే సామర్థ్యమున్న ప్రత్యేక గుంపును సంక్షిప్తంగా, స్పష్టంగా గుర్తిస్తుంది.
- source_word: ἀπορίψαντας
  choice: ఓడ మీద నుంచి నీళ్లలోకి దూకి
  rationale: అక్షరార్థంగా ‘తమను తాము కిందికి విసిరేసుకొని’; నౌకా సందర్భంలో ఉద్దేశించిన చర్యను సహజమైన తెలుగులో తెలుపుతుంది.
- source_word: πρώτους
  choice: ముందుగా
  rationale: ఈదగలవారు ఇతరులకంటే ముందు వెళ్లాలనే క్రమాన్ని సూచిస్తుంది.
- source_word: ἐπὶ τὴν γῆν ἐξιέναι
  choice: ఒడ్డుకు చేరాలని
  rationale: సముద్రం నుంచి భూమి మీదికి వెళ్లడాన్ని సందర్భానుగుణంగా స్పష్టంగా తెలుపుతుంది; ఇక్కడ γῆ అనేది తీరం లేదా ఒడ్డును సూచిస్తుంది.
