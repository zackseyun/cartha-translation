source:
  edition: SBLGNT
  text: καὶ βολίσαντες εὗρον ὀργυιὰς εἴκοσι, βραχὺ δὲ διαστήσαντες καὶ πάλιν βολίσαντες εὗρον ὀργυιὰς δεκαπέντε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/028.yaml
  text: And after taking soundings[a], they found twenty fathoms; then after going a little farther and taking soundings again, they found fifteen fathoms.
translation:
  language: te
  text: వారు బరువు కట్టిన తాడుతో లోతు కొలిచి, లోతు ఇరవై బారలు[a] అని కనుగొన్నారు. కొద్దిదూరం ముందుకు వెళ్లి, మళ్లీ లోతు కొలిచి, లోతు పదిహేను బారలు అని కనుగొన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఒక బారు సుమారు ఆరు అడుగులు, అంటే 1.8 మీటర్లు. ఇరవై బారలు సుమారు 37 మీటర్లు; పదిహేను బారలు సుమారు 27 మీటర్లు.
    reason: ప్రాచీన నావిక కొలమానాన్ని ఆధునిక పాఠకులు అర్థం చేసుకోవడానికి.
lexical_decisions:
- source_word: βολίσαντες
  choice: బరువు కట్టిన తాడును నీటిలోకి దించి లోతు కొలిచినప్పుడు
  rationale: ఈ గ్రీకు క్రియ సముద్రపు లోతును తెలుసుకోవడానికి బరువు కట్టిన కొలత తాడును నీటిలోకి దించే నావికుల చర్యను సూచిస్తుంది. సాధారణ ఆధునిక తెలుగు పాఠకులకు చర్య స్పష్టంగా అర్థమయ్యేలా భావాన్ని సహజంగా వ్యక్తం చేసింది.
- source_word: εὗρον
  choice: ఉందని తెలిసింది
  rationale: కొలత ద్వారా లభించిన ఫలితాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; గ్రీకు వాక్యంలోని ‘వారు కనుగొన్నారు’ అనే భావాన్ని నిలుపుతుంది.
- source_word: ὀργυιὰς
  choice: బారలు
  rationale: ὀργυιά అనే ప్రాచీన నావిక కొలమానానికి తెలుగులో వాడుకలో ఉన్న సమాన పదం. మూలపాఠంలోని కొలమానాన్ని మార్చకుండా ఉంచి, దాని సుమారు విలువను పాదసూచికలో వివరించింది.
- source_word: εἴκοσι
  choice: ఇరవై
  rationale: సంఖ్యకు నేర అనువాదం.
- source_word: βραχὺ διαστήσαντες
  choice: కొంచెం ముందుకు వెళ్లి
  rationale: ఓడ కొద్దిదూరం ప్రయాణించిన తరువాత రెండోసారి కొలిచారనే సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: లోతు కొలిచే చర్య పునరావృతమైందని నేరుగా తెలియజేస్తుంది.
- source_word: δεκαπέντε
  choice: పదిహేను
  rationale: సంఖ్యకు నేర అనువాదం.
- source_word: καὶ ... δὲ ... καὶ
  choice: వారు ... కొంచెం ముందుకు వెళ్లి మళ్లీ
  rationale: ఇక్కడ సంధాన పదాలు ప్రధానంగా కథన క్రమాన్ని సూచిస్తాయి; బలమైన వ్యతిరేకతను కాదు. తెలుగులో సహజమైన వరుస చర్యలుగా అందించింది.
