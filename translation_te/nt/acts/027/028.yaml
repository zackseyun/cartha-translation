  register: ఆధునిక ప్రామాణిక తెలుగులో, నావిక సాంకేతిక చర్యను సాధారణ పాఠకుడికి స్పష్టంగా ఉండేలా వివరించి అనువదించాం. ప్రాచీన కొలమానం ‘బారు’ను ప్రధాన పాఠంలో నిలిపి, దాని ఆధునిక సమానాన్ని పాదసూచికలో ఇచ్చాం.
