source:
  edition: SBLGNT
  text: περιπεσόντες δὲ εἰς τόπον διθάλασσον ⸀ἐπέκειλαν τὴν ναῦν, καὶ ἡ μὲν πρῷρα ἐρείσασα ἔμεινεν ἀσάλευτος, ἡ δὲ πρύμνα ἐλύετο ὑπὸ τῆς ⸀βίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/041.yaml
  text: But falling into a place where two seas met[a], they ran the ship aground; and the bow, having stuck fast, remained immovable, but the stern was being broken up by the force.
translation:
  language: te
  text: అయితే, రెండు సముద్రాలు కలిసే చోటుకు[a] వచ్చి, వారు ఓడను నేలకు తగిలించి నిలిపారు. ఓడ ముందుభాగం గట్టిగా దిగబడి కదలకుండా ఉండిపోయింది; వెనుకభాగమేమో ఆ ఉధృతికి ముక్కలైపోతూ ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రెండు సముద్రాల మధ్యనున్న చోటుకు.” ఇక్కడి గ్రీకు పదబంధం అరుదైనది; అది కాలువను, ఇసుకతిన్నెను, లేదా రెండు జలభాగాలు గానీ ప్రవాహాలు గానీ కలిసే చోటును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπεσόντες
  choice: కొట్టుకుపోయి
  rationale: సందర్భంలో ఓడ అకస్మాత్తుగా ప్రమాదకరమైన ప్రదేశంలో చిక్కుకున్న భావాన్ని సహజమైన తెలుగు నౌకాయాన వర్ణనగా వ్యక్తం చేస్తుంది.
- source_word: τόπον διθάλασσον
  choice: రెండు సముద్రాలు కలిసే చోటు
  rationale: అరుదైన διθάλασσος పదంలోని ‘రెండు సముద్రాలు/జలభాగాలు’ అనే చిత్రాన్ని నిలుపుతూ, ఇసుకతిన్నె లేదా కాలువ అని అతిగా నిర్దిష్టీకరించదు.
- source_word: ἐπέκειλαν τὴν ναῦν
  choice: ఓడను అక్కడ మట్టిలో కూరుకుపోయేలా చేశారు
  rationale: ఓడను నేలకు తగిలించి నిలిపివేయడం లేదా ఒడ్డుకు ఎక్కించడం అనే నౌకాయాన చర్యను సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: πρῷρα
  choice: ఓడ ముందుభాగం
  rationale: తెలుగులో సులభంగా అర్థమయ్యే విధంగా ఓడ ముందు భాగాన్ని సూచిస్తుంది.
- source_word: ἐρείσασα ἔμεινεν ἀσάλευτος
  choice: గట్టిగా దిగబడి కదలకుండా ఉండిపోయింది
  rationale: ముందుభాగం బలంగా ఇరుక్కొని స్థిరంగా ఉండిపోయిన ఫలితస్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πρύμνα
  choice: వెనుకభాగం
  rationale: ఓడ వెనుక భాగాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: ἐλύετο
  choice: ముక్కలైపోతూ ఉంది
  rationale: అసంపూర్ణ భూతకాల రూపం సూచించే క్రమంగా విడిపోయే, ఛిద్రమయ్యే ప్రక్రియను నిలుపుతుంది.
- source_word: ὑπὸ τῆς βίας
  choice: నీటి ఉధృతికి
  rationale: βία లోని బలప్రయోగం/ఉధృతి భావాన్ని సముద్ర సందర్భానికి సహజంగా అన్వయిస్తుంది; ‘అలలు’ అని మరింత నిర్దిష్టంగా చేర్చకుండా సందర్భంలో పనిచేస్తున్న నీటి బలాన్ని తెలుపుతుంది.
