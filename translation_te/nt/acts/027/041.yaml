translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథనశైలి. అరుదైన భౌగోళిక పదంలోని అనిశ్చితిని ప్రధాన పాఠ్యం మరియు పాదటిప్పణిలో నిలిపాం.
