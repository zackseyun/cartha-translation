revisions:
- from: అయితే మనం ఏదో ఒక ద్వీపం మీదికి కొట్టుకుపోవలసిందే[a].
  to: అయితే మనం ఏదో ఒక ద్వీపం తీరానికి కొట్టుకుపోవలసిందే[a].
  rationale: The revision preserves the Greek indefinite island, the force of necessity, and the maritime landfall sense of ἐκπεσεῖν, while replacing the less idiomatic ‘ద్వీపం మీదికి’ with the precise and natural ‘ద్వీపం తీరానికి.’ The footnote retains a viable alternative phrasing without adding interpretive detail.
