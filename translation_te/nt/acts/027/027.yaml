id: ACT.27.27
reference: Acts 27:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὡς δὲ τεσσαρεσκαιδεκάτη νὺξ ἐγένετο διαφερομένων ἡμῶν ἐν τῷ Ἀδρίᾳ, κατὰ μέσον τῆς νυκτὸς ὑπενόουν οἱ ναῦται προσάγειν τινὰ αὐτοῖς χώραν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/027.yaml
  text: When the fourteenth night had come[a], as we were being driven along in the Adriatic Sea[b], about midnight the sailors began to suspect that some land was drawing near to them.
translation:
  language: te
  text: పద్నాలుగో రాత్రి వచ్చినప్పుడు, మేము అద్రియా సముద్రంలో[a] గాలికి కొట్టుకుపోతూ ఉండగా, దాదాపు అర్ధరాత్రి వేళ ఏదో భూభాగం తమకు దగ్గరపడుతోందని[b] నావికులు అనుమానించసాగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ప్రాచీన కాలంలో ‘అద్రియా’ అనే పేరు నేటి అద్రియాటిక్ సముద్రానికే పరిమితం కాకుండా, ఈ ప్రాంతంలోని మధ్యధరా సముద్రపు మధ్య జలాలను కూడా విస్తృతంగా సూచించగలిగేది.
    reason: cultural_note
  - marker: b
    text: 'అక్షరార్థంగా, “ఏదో భూభాగం తమకు దగ్గరపడుతోందని.” భావం: తాము భూమికి దగ్గరవుతున్నామని నావికులు గ్రహించసాగారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσαρεσκαιδεκάτη νὺξ ἐγένετο
  choice: పద్నాలుగో రాత్రి వచ్చినప్పుడు
  rationale: కాలక్రమంలో పద్నాలుగో రాత్రి వచ్చిందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: διαφερομένων ἡμῶν
  choice: మేము ... గాలికి కొట్టుకుపోతూ ఉండగా
  rationale: ప్రయాణికుల అదుపులో లేని, తుఫాను వల్ల కొనసాగుతున్న కదలికను గ్రీకు వర్తమాన కర్మణి కృదంతానికి అనుగుణంగా తెలియజేస్తుంది.
- source_word: ἐν τῷ Ἀδρίᾳ
  choice: అద్రియా సముద్రంలో
  rationale: ప్రాచీన భౌగోళిక నామాన్ని నిలుపుతూ సాధారణ పాఠకునికి ఇది సముద్ర ప్రాంతమని స్పష్టం చేస్తుంది; దాని విస్తృత ప్రాచీన అర్థాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: κατὰ μέσον τῆς νυκτός
  choice: దాదాపు అర్ధరాత్రి వేళ
  rationale: రాత్రి మధ్య భాగం అనే అర్థంతో పాటు గ్రీకు పదబంధంలోని సుమారు అనే భావాన్ని కాపాడుతుంది.
- source_word: ὑπενόουν
  choice: అనుమానించసాగారు
  rationale: నావికులు క్రమంగా ఒక అంచనాకు రావడాన్ని అపూర్ణ భూతకాల క్రియ యొక్క కొనసాగింపు లేదా ఆరంభ ఛాయతో వ్యక్తం చేస్తుంది.
- source_word: οἱ ναῦται
  choice: నావికులు
  rationale: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: προσάγειν τινὰ αὐτοῖς χώραν
  choice: ఏదో భూభాగం తమకు దగ్గరపడుతోందని
  rationale: τινά సూచించే అనిర్దిష్టతను ‘ఏదో’తోనూ, భూభాగమే తమవైపు సమీపిస్తోందనే గ్రీకు వాక్య దృక్కోణాన్ని ‘తమకు దగ్గరపడుతోంది’తోనూ నిలుపుతుంది.
