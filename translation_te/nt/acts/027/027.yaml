translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. కథన గంభీరతను నిలుపుతూ, తుఫానులో అదుపులేని ప్రయాణాన్ని స్పష్టంగా చెప్పడానికి ‘గాలికి కొట్టుకుపోతూ’ అని అనువదించబడింది. ‘అద్రియా’ అనే ప్రాచీన భౌగోళిక పదం వల్ల కలగగల అపార్థాన్ని పాదసూచికలో వివరించాం.
