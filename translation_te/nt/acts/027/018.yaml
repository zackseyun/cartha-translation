revisions:
- from: తుఫాను మమ్మల్ని తీవ్రంగా అల్లకల్లోలం చేస్తుండగా, మరుసటి రోజు వారు ఓడలోని సరుకును సముద్రంలో పడవేయడం మొదలుపెట్టారు.[a]
  to: తుఫాను మమ్మల్ని తీవ్రంగా కుదిపివేస్తుండగా, మరుసటి రోజు వారు ఓడలోని సరుకును సముద్రంలోకి విసిరివేస్తూ ఉన్నారు.[a]
  rationale: The revision preserves the severe storm-distress and the genitive-absolute temporal clause, while rendering the imperfect jettisoning action as ongoing rather than adding ‘began.’ The footnote continues to identify the Greek nautical idiom in natural Telugu.
  reviewer_model: gpt-5.6-terra
