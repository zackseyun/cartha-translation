  yaml_path: translation/nt/acts/027/018.yaml
  text: As we were being violently storm-tossed[a], on the next day they began to throw the cargo overboard.
translation:
  language: te
  text: తుఫాను మమ్మల్ని తీవ్రంగా కుదిపివేస్తుండగా, మరుసటి రోజు వారు ఓడలోని సరుకును సముద్రంలోకి విసిరివేస్తూ ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో మరింత రూపసమీపంగా, “వారు సరుకును బయటికి విసిరే చర్య చేశారు.” ఇది ఓడ బరువు తగ్గించడానికి సరుకును సముద్రంలోకి విసరడాన్ని సూచించే నావికా ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: σφοδρῶς
  choice: తీవ్రంగా
  rationale: తుఫాను ప్రభావపు తీవ్రతను తెలియజేసే క్రియావిశేషణం; ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, బలంగా వినిపిస్తుంది.
- source_word: χειμαζομένων ἡμῶν
  choice: తుఫాను మమ్మల్ని ... అల్లకల్లోలం చేస్తుండగా
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణాన్ని సహజమైన కాలసూచక ఉపవాక్యంగా మార్చి, తుఫాను చేత బాధింపబడుతున్న నిష్క్రియ భావాన్ని నిలిపింది.
- source_word: τῇ ἑξῆς
  choice: మరుసటి రోజు
  rationale: తదుపరి రోజును సూచించే గ్రీకు కాలప్రయోగానికి సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: ἐκβολὴν ἐποιοῦντο
  choice: ఓడలోని సరుకును సముద్రంలో పడవేయడం మొదలుపెట్టారు
  rationale: ఇది ఓడ బరువు తగ్గించేందుకు సరుకును బయటికి విసిరే నావికా చర్య. ‘సరుకు’ మూలంలో వ్యక్తంగా లేకపోయినా సందర్భం మరియు నావికా ప్రయోగంలో అంతర్భూతమైన అర్థాన్ని తెలుగులో స్పష్టం చేస్తుంది; అసంపూర్ణ భూతకాల క్రియ కథనంలో చర్య ప్రారంభమై కొనసాగిన భావాన్ని ఇస్తుంది.
