id: ACT.27.17
reference: Acts 27:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἣν ἄραντες βοηθείαις ἐχρῶντο ὑποζωννύντες τὸ πλοῖον· φοβούμενοί τε μὴ εἰς τὴν Σύρτιν ἐκπέσωσιν, χαλάσαντες τὸ σκεῦος, οὕτως ἐφέροντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/017.yaml
  text: After hoisting it up[a], they used supporting cables to undergird the ship; and fearing that they might run aground on the Syrtis[c][b], they lowered the sea anchor and so were driven along.
translation:
  language: te
  text: దానిని పైకి ఎత్తిన తర్వాత, ఓడను చుట్టూ బిగించేందుకు వారు బలపరిచే తాళ్లను ఉపయోగించారు. సిర్టిస్‌లోకి[a] తాము కొట్టుకుపోతామేమోనని భయపడి, వారు పరికరాన్ని దించారు[b]; అలా కొట్టుకుపోతూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సిర్టిస్ ఉత్తర ఆఫ్రికా తీరానికి సమీపంలోని ప్రసిద్ధ ప్రమాదకరమైన ఇసుకతిన్నెలు లేదా లోతులేని ప్రాంతం.
    reason: cultural_note
  - marker: b
    text: లేదా “ఓడ సామగ్రిని దించారు,” “తాళ్ల సామగ్రిని దించారు,” లేదా “సముద్ర లంగరును దించారు.” గ్రీకు పదానికి “పరికరం/సామగ్రి” అనే సాధారణ అర్థం ఉంది; ఇక్కడ ఏ నావిక పరికరాన్ని ఉద్దేశించిందో ఖచ్చితంగా తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν ἄραντες
  choice: దానిని పైకి ఎత్తిన తర్వాత
  rationale: ἣν ముందటి వచనంలోని చిన్న పడవను సూచిస్తుంది; ἄραντες ప్రధాన చర్యకు ముందే జరిగిన పనిని సూచిస్తుంది.
- source_word: βοηθείαις
  choice: బలపరిచే తాళ్లను
  rationale: పదానికి అక్షరార్థంగా ‘సహాయాలు/ఆధారాలు’ అనే భావం ఉన్నా, ఇక్కడ ఓడ దేహాన్ని బలపరచే తాళ్లను సూచించే నావిక సందర్భార్థం సహజంగా వ్యక్తమవుతుంది.
- source_word: ὑποζωννύντες τὸ πλοῖον
  choice: ఓడను కిందనుంచి బిగించడానికి
  rationale: ఓడ దేహం చుట్టూ లేదా కిందుగా తాళ్లు బిగించి దాన్ని బలపరిచే సాంకేతిక నావిక చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: μὴ εἰς τὴν Σύρτιν ἐκπέσωσιν
  choice: సూర్తిస్ ఇసుకతిన్నెల మీదికి కొట్టుకుపోతామేమోనని
  rationale: ἐκπέσωσιν లోని ప్రమాదకరంగా కొట్టుకుపోయి చిక్కుకునే భావాన్ని, సూర్తిస్ ప్రాంతపు నావిక ప్రమాదాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: χαλάσαντες τὸ σκεῦος
  choice: ఓడ సామగ్రిని దించారు
  rationale: σκεῦος సాధారణంగా సామగ్రి లేదా పరికరాన్ని సూచిస్తుంది; నిర్దిష్టంగా సముద్ర లంగరే అని నిర్ణయించకుండా మూలంలోని అనిశ్చితిని కాపాడుతుంది.
- source_word: οὕτως ἐφέροντο
  choice: అలా గాలికి కొట్టుకుపోతూ ఉన్నారు
  rationale: అసంపూర్ణ కర్మణి రూపం బయటి శక్తి వల్ల కొనసాగుతున్న కదలికను సూచిస్తుంది; సందర్భంలో ఆ శక్తి గాలి.
