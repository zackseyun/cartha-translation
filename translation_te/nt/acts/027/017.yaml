translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్య నిర్మాణం. ‘సూర్తిస్’ అనే భౌగోళిక పేరుతో పాటు ‘ఇసుకతిన్నెలు’ చేర్చి ప్రమాద స్వభావాన్ని ప్రధాన పాఠ్యంలోనే స్పష్టం చేశాం. ‘ఓడ సామగ్రి’ ద్వారా σκεῦος లోని నిజమైన అనిశ్చితిని నిలిపి ఉంచాం.
