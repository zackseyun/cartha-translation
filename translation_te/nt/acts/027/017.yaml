revisions:
- from: దానిని పైకి ఎత్తిన తర్వాత, వారు ఓడను కిందనుంచి బిగించడానికి బలపరిచే తాళ్లను ఉపయోగించారు. సూర్తిస్ ఇసుకతిన్నెల మీదికి కొట్టుకుపోతామేమోనని భయపడి, ఓడ సామగ్రిని దించారు[a]; అలా గాలికి కొట్టుకుపోతూ ఉన్నారు.
  to: దానిని పైకి ఎత్తిన తర్వాత, ఓడను చుట్టూ బిగించేందుకు వారు బలపరిచే తాళ్లను ఉపయోగించారు. సిర్టిస్‌లోకి[a] తాము కొట్టుకుపోతామేమోనని భయపడి, వారు పరికరాన్ని దించారు[b]; అలా కొట్టుకుపోతూ ఉన్నారు.
  rationale: The revision corrects the person shift, retains Σύρτις as a name rather than embedding the cultural explanation in the main text, and more accurately describes the hull-girding action. It also preserves the disputed nautical reference of τὸ σκεῦος and avoids specifying wind where the Greek leaves the external driving force unstated.
  reviewer_model: gpt-5.6-terra
