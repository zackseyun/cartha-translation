id: ACT.27.5
reference: Acts 27:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τό τε πέλαγος τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν διαπλεύσαντες κατήλθομεν εἰς Μύρα τῆς Λυκίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/005.yaml
  text: After sailing across the open sea along Cilicia and Pamphylia[b][a], we came down to Myra in Lycia.
translation:
  language: te
  text: కిలికియా, పంఫూలియా తీరాల వెంబడి ఉన్న బహిరంగ సముద్రం మీదుగా ప్రయాణించి[a], లుకియలోని మూరాకు దిగివచ్చాం[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కిలికియా, పంఫూలియా తీరాలకు వెలుపలగా ఉన్న బహిరంగ సముద్రం మీదుగా ప్రయాణించి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “లుకియలోని మూరాకు చేరుకున్నాం.” గ్రీకు క్రియకు అక్షరార్థంగా “దిగివచ్చాం” అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέλαγος
  choice: నడిసముద్రం
  rationale: ఈ పదం సాధారణంగా సముద్రాన్ని మాత్రమే కాకుండా తీరానికి దూరంగా ఉన్న బహిరంగ సముద్రాన్ని సూచిస్తుంది. ‘నడిసముద్రం’ ఆ సముద్రయాన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν
  choice: కిలికియ, పంఫూలియ తీరాల వెంబడి ఉన్న
  rationale: భౌగోళిక ప్రయోగంలో κατά + accusative ఆ ప్రాంతాల తీరం వెంట లేదా వాటికి వెలుపలగా సాగిన మార్గాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన ‘తీరాల వెంబడి’ వాడి, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: διαπλεύσαντες
  choice: ఓడలో దాటి
  rationale: Aorist participle ప్రధాన క్రియకు ముందు పూర్తయిన సముద్ర ప్రయాణాన్ని సూచిస్తుంది. ‘ఓడలో దాటి’ అనేది ప్రయాణ సాధనాన్నీ, దాటిపోవడాన్నీ సంక్షిప్తంగా తెలుపుతుంది.
- source_word: κατήλθομεν
  choice: దిగివచ్చాం
  rationale: κατέρχομαι యొక్క దిశాసూచకమైన ‘కిందికి వచ్చాం/దిగివచ్చాం’ భావాన్ని నిలుపుతుంది; ప్రయాణ సందర్భంలో ఇది ‘చేరుకున్నాం’ అనే సాధారణ భావంలోనూ వాడవచ్చు.
- source_word: Μύρα τῆς Λυκίας
  choice: లుకియలోని మూర
  rationale: Genitive ఇక్కడ మూర పట్టణం లుకియ ప్రాంతంలో ఉందని సూచిస్తుంది. తెలుగులో ‘లుకియలోని మూర’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: τε
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: τε మునుపటి కథనంతో ఈ వాక్యాన్ని స్వల్పంగా కలుపుతుంది. తెలుగులో వాక్యప్రవాహమే ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
