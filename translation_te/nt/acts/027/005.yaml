revisions:
- from: కిలికియ, పంఫూలియ తీరాల వెంబడి ఉన్న నడిసముద్రాన్ని ఓడలో దాటి[a], లుకియలోని మూరకు దిగివచ్చాం[b].
  to: కిలికియా, పంఫూలియా తీరాల వెంబడి ఉన్న బహిరంగ సముద్రం మీదుగా ప్రయాణించి[a], లుకియలోని మూరాకు దిగివచ్చాం[b].
  rationale: The revision makes the coastal phrase describe the sailing route, removes the unsupported explicit reference to a ship, preserves the antecedent participial action, retains the directional wording of κατήλθομεν, and regularizes the transliteration of geographical names. The alternative footnotes retain the source-supported ambiguity of the route and the conventional arrival sense of the main verb.
