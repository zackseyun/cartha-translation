translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథన శైలిని ఉపయోగించాం. ప్రదేశాల పేర్లకు తెలుగులో ప్రాచుర్యంలో ఉన్న రూపాలు వాడాం; గ్రీకు మూలంలోని సముద్రయాన విశిష్టతను, దిశాసూచక క్రియను సాధ్యమైనంతవరకు నిలిపాం.
