  to: 'ఇలా అన్నాడు: “పౌలా, భయపడకు. నీవు కైసరు ఎదుట హాజరుకావలసి ఉంది. ఇదిగో, నీతో ప్రయాణిస్తున్న వారందరినీ దేవుడు నీకు అనుగ్రహించాడు.”'
