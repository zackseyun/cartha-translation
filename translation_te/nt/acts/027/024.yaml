id: ACT.27.24
reference: Acts 27:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγων· Μὴ φοβοῦ, Παῦλε· Καίσαρί σε δεῖ παραστῆναι, καὶ ἰδοὺ κεχάρισταί σοι ὁ θεὸς πάντας τοὺς πλέοντας μετὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/024.yaml
  text: saying, ‘Do not be afraid, Paul. You must stand before Caesar, and look, God has granted to you all those sailing with you.’
translation:
  language: te
  text: 'ఇలా అన్నాడు: “పౌలా, భయపడకు. నీవు కైసరు ఎదుట హాజరుకావలసి ఉంది. ఇదిగో, నీతో ప్రయాణిస్తున్న వారందరినీ దేవుడు నీకు అనుగ్రహించాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: ఇలా అన్నాడు
  rationale: ముందటి వాక్యంలో ప్రస్తావించిన దూత పలికిన మాటలను సహజమైన తెలుగులో పరిచయం చేస్తుంది.
- source_word: Καίσαρί
  choice: కైసరు ఎదుట
  rationale: రోమా చక్రవర్తి బిరుదును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: δεῖ παραστῆναι
  choice: నిలబడవలసి ఉంది
  rationale: దైవిక అవసరాన్ని సూచించే δεῖ భావాన్నీ, అధికార సమక్షంలో హాజరుకావడాన్ని సూచించే παραστῆναι భావాన్నీ కాపాడుతుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే గ్రీకు ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: κεχάρισταί σοι
  choice: నీకు అనుగ్రహించాడు
  rationale: χαρίζομαι లోని కృపాపూర్వకంగా ప్రసాదించడం అనే భావాన్ని, పూర్తి ఫలితాన్ని సూచించే కాలరూపంతో సహా తెలియజేస్తుంది.
- source_word: πάντας τοὺς πλέοντας μετὰ σοῦ
  choice: నీతో ప్రయాణిస్తున్న వారందరినీ
  rationale: నౌకాయాన సందర్భంలో అర్థం స్పష్టంగా ఉండే సహజ తెలుగు రూపం.
theological_decisions:
- issue: దేవుడు పౌలుకు సహప్రయాణికులను ‘అనుగ్రహించడం’ అనే భావం
  choice: మూలంలోని రూపకాన్ని ‘నీకు అనుగ్రహించాడు’ అని యథాతథంగా నిలిపాం.
  alternative: ‘నీతో ఉన్న వారందరి ప్రాణాలను కాపాడుతాడు’
  rationale: ప్రత్యామ్నాయం సందర్భార్థాన్ని వివరిస్తుంది గాని, κεχάρισταί σοι లోని కృపాపూర్వక ప్రసాద భావాన్ని స్పష్టీకరణ పేరుతో మార్చేస్తుంది; మూలంలోని భావతీవ్రతను నిలపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. అనవసర పాదటిప్పణులు జోడించలేదు.
