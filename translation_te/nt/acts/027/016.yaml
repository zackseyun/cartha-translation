source:
  edition: SBLGNT
  text: νησίον δέ τι ὑποδραμόντες καλούμενον ⸀Καῦδα ⸂ἰσχύσαμεν μόλις⸃ περικρατεῖς γενέσθαι τῆς σκάφης,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/016.yaml
  text: But after running under the shelter of a small island called Cauda[a], we were barely able to secure the ship’s boat.
translation:
  language: te
  text: కౌదా[a] అనే ఒక చిన్న ద్వీపం చాటున ప్రయాణించిన తర్వాత, ఓడకు చెందిన చిన్న పడవను అదుపులోకి తెచ్చుకోవడం మాకు అతి కష్టంగా సాధ్యమైంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కౌదా అనే ఒక చిన్న ద్వీపం గాలి మరుగున ప్రయాణించిన తర్వాత.’ గాలి నుంచి ద్వీపం కల్పించే ఆశ్రయంలోకి ప్రయాణించడాన్ని గ్రీకు వచనం నావిక పరిభాషలో చెబుతోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: νησίον ... τι
  choice: ఒక చిన్న ద్వీపం
  rationale: νησίον అనే లఘురూపంలోని ‘చిన్న ద్వీపం’ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δέ
  choice: తర్వాత
  rationale: δέ ఇక్కడ స్వల్ప కథన మలుపును సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో ప్రత్యేక విరోధార్థక పదం కంటే కాలసంబంధ నిర్మాణమే సహజంగా ఆ మార్పును తెలియజేస్తుంది.
- source_word: ὑποδραμόντες
  choice: చాటున ప్రయాణించిన
  rationale: నావిక సందర్భంలో గాలి నుంచి ద్వీపం కల్పించే ఆశ్రయవైపు లేదా దాని మరుగున ప్రయాణించడాన్ని సూచిస్తుంది; ‘చాటున’ ఈ భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: καλούμενον Καῦδα
  choice: కౌదా అనే
  rationale: ద్వీపం పేరును సహజమైన తెలుగు నామనిర్దేశ నిర్మాణంలో అందిస్తుంది; Καῦδα ను ‘కౌదా’గా లిప్యంతరీకరించింది.
- source_word: ἰσχύσαμεν μόλις
  choice: మాకు అతి కష్టంగా సాధ్యమైంది
  rationale: చేయగలిగినప్పటికీ అది ఎంతో కష్టంతో మాత్రమే జరిగిందనే సమీప-అసాధ్యత భావాన్ని నిలుపుతుంది.
- source_word: περικρατεῖς γενέσθαι
  choice: అదుపులోకి తెచ్చుకోవడం
  rationale: దానిపై పట్టు సంపాదించడం లేదా నియంత్రణ పొందడం అనే మూలభావాన్ని నిలుపుతుంది; కేవలం కట్టివేయడం అనే వివరాన్ని మూలంలో లేనందున చేర్చదు.
- source_word: τῆς σκάφης
  choice: ఓడకు చెందిన చిన్న పడవను
  rationale: σκάφη ప్రధాన ఓడతో పాటు ఉన్న చిన్న పడవను సూచిస్తుంది; ‘ఓడకు చెందిన చిన్న పడవ’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
