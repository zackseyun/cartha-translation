translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. నావిక పరిభాషను అతిగా సాంకేతికంగా చేయకుండా ‘చాటున’ అని అనువదించి, మరింత నిర్దిష్టమైన ‘గాలి మరుగు’ భావాన్ని పాదటిప్పణిలో ఉంచాం.
