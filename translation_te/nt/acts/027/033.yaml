id: ACT.27.33
reference: Acts 27:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἄχρι δὲ οὗ ⸂ἡμέρα ἤμελλεν⸃ γίνεσθαι παρεκάλει ὁ Παῦλος ἅπαντας μεταλαβεῖν τροφῆς λέγων· Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν προσδοκῶντες ἄσιτοι διατελεῖτε, μηθὲν προσλαβόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/033.yaml
  text: Until the day was about to dawn[a], Paul kept urging them all to take some food, saying, “Today is the fourteenth day that you have continued in suspense without eating, having taken nothing.”
translation:
  language: te
  text: 'తెల్లవారబోయే వరకు పౌలు వారందరినీ కొంత ఆహారం తీసుకోమని పదేపదే ప్రోత్సహిస్తూ ఇలా అన్నాడు: “నేటికి పద్నాలుగో రోజు; మీరు ఎదురుచూస్తూ ఏమీ తినకుండా, ఏమీ తీసుకోకుండా కొనసాగుతున్నారు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄχρι δὲ οὗ ἡμέρα ἤμελλεν γίνεσθαι
  choice: తెల్లవారబోతుండగా
  rationale: అక్షరార్థంగా ‘పగలు కాబోతుండగా’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; వెలుగు రావడం సమీపించిందనే కాలసూచనను నిలుపుతుంది.
- source_word: παρεκάλει
  choice: పదేపదే వేడుకుంటూ
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న లేదా పునరావృత చర్యను తెలియజేస్తుంది; ఇక్కడ పౌలు గట్టిగా ప్రోత్సహిస్తున్న సందర్భానికీ సరిపోతుంది.
- source_word: ἅπαντας
  choice: వారందరినీ
  rationale: ఓడలో ఉన్న మొత్తం సమూహాన్ని సమగ్రంగా సూచిస్తుంది.
- source_word: μεταλαβεῖν τροφῆς
  choice: కొంత ఆహారం తీసుకోమని
  rationale: ఆహారంలో కొంత తీసుకొని పోషణ పొందాలనే భాగార్థక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν
  choice: నేటితో పద్నాలుగో రోజు
  rationale: ప్రస్తుత రోజు పద్నాలుగవదని గ్రీకు వాక్యం ఇచ్చే కాలపరమైన ఉద్ఘాటనను స్పష్టంగా నిలుపుతుంది.
- source_word: προσδοκῶντες
  choice: ఎదురుచూస్తూ
  rationale: మూలపదంలోని నిరీక్షణ భావాన్ని నేరుగా ఉంచి, ఆ నిరీక్షణ ఆందోళనతో కూడినదా అనే సందర్భార్థాన్ని పాఠ్యంలో బలవంతంగా నిర్ణయించదు.
- source_word: ἄσιτοι διατελεῖτε
  choice: ఏమీ తినకుండా గడపడం
  rationale: ఒక కాలవ్యవధి అంతటా ఆహారం తినని స్థితిలో కొనసాగారనే భావాన్ని తెలియజేస్తుంది; మతపరమైన స్వచ్ఛంద ఉపవాసం అనే అనవసర భావాన్ని నివారిస్తుంది.
- source_word: μηθὲν προσλαβόμενοι
  choice: మీరు అసలు ఏమీ తీసుకోలేదు
  rationale: ముందటి మాటను బలపరిచే గ్రీకు భాగాన్ని తెలుగులో సహజమైన ఉద్ఘాటనతో, కానీ తొలగించకుండా, ప్రత్యేక ఉపవాక్యంగా వ్యక్తం చేస్తుంది.
