translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. మూలంలోని కొనసాగుతున్న విజ్ఞప్తిని ‘పదేపదే’తో, ఆహారం తీసుకోకపోవడంపై ఉన్న పునరుక్త ఉద్ఘాటనను రెండు వాక్యభాగాలతో నిలిపాం. [a] గుర్తును అది వివరిస్తున్న ‘ఎదురుచూస్తూ’ పదానికే జతచేశాం.
