id: ACT.27.1
reference: Acts 27:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐκρίθη τοῦ ἀποπλεῖν ἡμᾶς εἰς τὴν Ἰταλίαν, παρεδίδουν τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ σπείρης Σεβαστῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/001.yaml
  text: When it was decided that we should sail for Italy[a], they handed over both Paul and some other prisoners to a centurion named Julius, of the Augustan Cohort.
translation:
  language: te
  text: మేము ఇటలీకి ఓడలో బయలుదేరాలని నిర్ణయించబడినప్పుడు, పౌలును, మరికొందరు ఖైదీలను అగుస్తు దళానికి[a] చెందిన యూలియుస్ అనే శతాధిపతికి అప్పగించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చక్రవర్తి దళం”; బహుశా “సెబస్తే దళం.” గ్రీకు పదం చక్రవర్తికి సంబంధించిన “అగుస్తు” అనే బిరుదును ప్రతిబింబిస్తుంది; అయితే ఇక్కడ ఉద్దేశించిన నిర్దిష్ట సైనిక విభాగం ఏదో ఖచ్చితంగా తెలియదు.
    reason: చారిత్రక సైనిక దళపు పేరుకు ఒకటి కంటే ఎక్కువ సాధ్యమైన అర్థాలు ఉన్నాయి.
lexical_decisions:
- source_word: ἐκρίθη
  choice: నిర్ణయించబడినప్పుడు
  rationale: క్రియలోని భూతకాల కర్మణి భావాన్ని, అధికారికంగా తీసుకున్న నిర్ణయాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: τοῦ ἀποπλεῖν ἡμᾶς
  choice: మేము ... ఓడలో బయలుదేరాలని
  rationale: కర్త అయిన ‘మేము’ను స్పష్టంగా ఉంచి, ἀποπλεῖν లోని సముద్ర ప్రయాణ భావాన్ని ‘ఓడలో బయలుదేరు’ అని వ్యక్తం చేస్తుంది.
- source_word: παρεδίδουν
  choice: అప్పగించారు
  rationale: ఖైదీల సంరక్షణ బాధ్యతను అధికారికంగా మరొకరికి బదిలీ చేసిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας
  choice: పౌలును, మరికొందరు ఖైదీలను
  rationale: τε...καί సమన్వయాన్ని తెలుగులో సహజంగా అందిస్తూ, δεσμώτας ను స్పష్టమైన ‘ఖైదీలు’గా అనువదిస్తుంది.
- source_word: ἑκατοντάρχῃ
  choice: శతాధిపతికి
  rationale: రోమా సైన్యంలోని centurion హోదాకు తెలుగులో స్థిరమైన, సంక్షిప్తమైన సమానార్థకం.
- source_word: ὀνόματι Ἰουλίῳ
  choice: యూలియుస్ అనే
  rationale: పేరు పరిచయం చేసే గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగు రూపంలో అందిస్తుంది.
- source_word: σπείρης Σεβαστῆς
  choice: అగుస్తు దళానికి
  rationale: Σεβαστή అనేది అగుస్తు/చక్రవర్తితో అనుబంధమైన బిరుదును సూచిస్తుంది; σπεῖρα అనే సైనిక విభాగాన్ని సాధారణ పాఠకునికి అర్థమయ్యేలా ‘దళం’గా ఇచ్చింది.
theological_decisions:
- issue: σπείρης Σεβαστῆς అనే చారిత్రక సైనిక విభాగపు పేరు
  choice: అగుస్తు దళం
  alternative: చక్రవర్తి దళం; సెబస్తే దళం
  rationale: ఇది సిద్ధాంతపరమైన పదం కాదు; అయితే నిర్దిష్ట చారిత్రక దళం ఏదో అనిశ్చితంగా ఉంది. ‘అగుస్తు దళం’ మూలంలోని బిరుదుతో నేర సంబంధాన్ని నిలుపుతుంది; ఇతర సాధ్యమైన అర్థాలను పాదసూచికలో ఉంచడం ద్వారా అనిశ్చితిని దాచదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ‘మేము’ ద్వారా మొదటి పురుష బహువచన సాక్ష్యాన్ని నిలిపి, ‘ఓడలో బయలుదేరు’ ద్వారా సముద్ర ప్రయాణాన్ని స్పష్టం చేసింది. మూలంలో ప్రత్యేకమైన ‘ఇప్పుడు’ అనే కాలసూచక పదం లేనందున దానిని చేర్చలేదు.
