source:
  edition: SBLGNT
  text: πολλάς ⸀τε ἐπιθέντες αὐτοῖς πληγὰς ἔβαλον εἰς φυλακήν, παραγγείλαντες τῷ δεσμοφύλακι ἀσφαλῶς τηρεῖν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/023.yaml
  text: And after they had inflicted many blows on them[a], they threw them into prison[b], ordering the jailer to keep them securely.
translation:
  language: te
  text: వారిని అనేక దెబ్బలు కొట్టించిన తరువాత[a], చెరసాలలోకి తోసివేసి[b], వారిని కట్టుదిట్టంగా కాపలా కాయాలని చెరసాల అధికారికి ఆజ్ఞాపించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని చాలాసార్లు కొట్టించిన తరువాత.” గ్రీకులో “అనేక దెబ్బలు” అని ఉంది; ఇక్కడ వాటికి ఉపయోగించిన సాధనాన్ని నిర్దిష్టంగా చెప్పలేదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “జైలులోకి.” గ్రీకు పదం సాధారణంగా నిర్బంధ స్థలాన్ని సూచిస్తుంది; సందర్భాన్ని బట్టి నిర్బంధం లేదా కాపలాను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάς ... πληγὰς
  choice: చాలాసార్లు కొట్టించిన
  rationale: ఈ సందర్భంలో అనేక దెబ్బలు కొట్టించడాన్ని సూచిస్తుంది; ఏ సాధనంతో కొట్టారో మూలపాఠం నిర్దిష్టంగా చెప్పదు.
- source_word: τε
  choice: ప్రత్యేక పదంగా అనువదించకుండా వాక్యానుసంధానంలో ప్రతిబింబించబడింది
  rationale: ఇది ముందున్న కథనంతో చర్యను కలిపే అనుసంధాన కణం; తెలుగులో వాక్యప్రవాహమే ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐπιθέντες
  choice: కొట్టించిన తరువాత
  rationale: πληγάς తో కలిసి ‘దెబ్బలు మోపడం/కొట్టించడం’ అనే భావాన్నిస్తుంది; కర్తలు అధికారులై శిక్షను అమలు చేయించిన సందర్భాన్ని తెలుగు causative రూపం సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἔβαλον εἰς φυλακήν
  choice: చెరసాలలోకి తోసివేసి
  rationale: βάλλω లోని బలవంతంగా లోపలికి వేయడం అనే సజీవ భావాన్ని ‘తోసివేసి’ నిలుపుతుంది.
- source_word: φυλακήν
  choice: చెరసాల
  rationale: నిర్బంధ స్థలాన్ని సూచించే స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: παραγγείλαντες
  choice: ఆజ్ఞాపించారు
  rationale: అధికారపూర్వక నిర్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: δεσμοφύλακι
  choice: చెరసాల అధికారికి
  rationale: ఖైదీలను కాపాడే బాధ్యతగల అధికారిని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ἀσφαλῶς
  choice: కట్టుదిట్టంగా
  rationale: ఖైదీల భద్రతకన్నా వారు తప్పించుకోకుండా నిర్బంధాన్ని పటిష్ఠంగా ఉంచాలనే భావాన్ని తెలియజేస్తుంది.
- source_word: τηρεῖν
  choice: కాపలా కాయాలని
  rationale: చెరసాల సందర్భంలో ఉంచడం, గమనించడం, తప్పించుకోనివ్వకుండా కాపాడడం అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: αὐτούς
  choice: వారిని
  rationale: పౌలు, సీలలను సూచించే బహువచన కర్మరూపం.
