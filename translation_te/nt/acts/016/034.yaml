id: ACT.16.34
reference: Acts 16:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀναγαγών τε αὐτοὺς εἰς τὸν ⸀οἶκον παρέθηκεν τράπεζαν καὶ ⸀ἠγαλλιάσατο πανοικεὶ πεπιστευκὼς τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/034.yaml
  text: And after bringing them up into the house[a], he set a meal before them and rejoiced greatly with his whole household[b], having believed in God.
translation:
  language: te
  text: వారిని పైకి తన ఇంటికి తీసుకువచ్చి, అతడు వారి ముందు భోజనం పెట్టి, దేవుని నమ్మి తన ఇంటివారందరితో కలిసి ఎంతో ఆనందించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తన ఇంటివారందరితో కలిసి ఎంతో ఆనందించాడు’ అనే గ్రీకు వాక్యభాగం ఇంటివారందరూ ఆ ఆనందంలో పాల్గొన్నారని ప్రధానంగా సూచిస్తుంది. వారు కూడా దేవుని నమ్మారని కొందరు అర్థం చేసుకుంటారు; అయితే ‘దేవుని నమ్మి’కి సంబంధించిన గ్రీకు పదం ఏకవచనంలో ఉండి నేరుగా చెరసాల అధికారినే సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγαγών
  choice: పైకి తీసుకువచ్చిన తర్వాత
  rationale: ఇది ముందుగా జరిగిన పైకి తీసుకురావడాన్ని సూచించే భూతకాల క్రియావిశేష రూపం; స్థలపరమైన పైకి కదలికను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: εἰς τὸν οἶκον
  choice: ఇంటిలోకి
  rationale: సందర్భంలో ఇది చెరసాల అధికారి ఇంటిని సూచిస్తుంది; తెలుగు వాక్యంలో స్వామ్యాన్ని ప్రత్యేకంగా చేర్చకుండానే సందర్భం స్పష్టం చేస్తుంది.
- source_word: παρέθηκεν τράπεζαν
  choice: వారి ముందు భోజనం పెట్టి
  rationale: అక్షరార్థంగా ‘బల్ల పెట్టాడు’ అనే గ్రీకు నుడికారం ఇక్కడ భోజనం సమకూర్చి వడ్డించడాన్ని సూచిస్తుంది.
- source_word: ἠγαλλιάσατο
  choice: ఎంతో ఆనందించాడు
  rationale: తీవ్రమైన, ఉప్పొంగే ఆనందాన్ని ఆధునిక సాధారణ తెలుగులో గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
- source_word: πανοικεὶ
  choice: తన ఇంటివారందరితో కలిసి
  rationale: ఇంటివారందరూ ఆనందంలో పాలుపంచుకున్న సమష్టి భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πεπιστευκὼς τῷ θεῷ
  choice: దేవుణ్ణి విశ్వసించినవాడై
  rationale: పూర్తయి కొనసాగుతున్న స్థితిని సూచించే perfect participle భావాన్ని, స్పష్టంగా లేని కారణార్థాన్ని బలవంతంగా చేర్చకుండా, ఏకవచన కర్తతో నిలుపుతుంది.
theological_decisions:
- issue: ఆనందం మరియు విశ్వాసం ఇంటివారికి ఎంతవరకు వర్తిస్తాయి
  choice: ప్రధాన పాఠ్యంలో చెరసాల అధికారి దేవుణ్ణి విశ్వసించినవాడిగా, తన ఇంటివారందరితో కలిసి ఆనందించినట్లు పేర్కొనడం
  alternative: ఇంటివారందరూ కూడా దేవుణ్ణి విశ్వసించి ఆనందించారని అర్థం చేసుకోవడం
  rationale: πεπιστευκώς ఏకవచన పుంలింగ రూపం నేరుగా చెరసాల అధికారినే సూచిస్తుంది; అయితే πανοικεὶ వల్ల ఇంటివారందరూ ఆనందంలో పాల్గొన్నారనే భావం ఉంది. మొత్తం ఇంటివారి విశ్వాసాన్ని ఈ వాక్యం తప్పనిసరిగా ప్రకటించినట్లు ప్రధాన పాఠ్యం అతిశయింపదు; ప్రత్యామ్నాయ అవగాహనను పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే మూలంలోని క్రియావిశేష నిర్మాణం మరియు గృహస్థుల విశ్వాసానికి సంబంధించిన సందిగ్ధతను కాపాడుతూ అనువదించబడింది.
