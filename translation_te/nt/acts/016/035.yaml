source:
  edition: SBLGNT
  text: Ἡμέρας δὲ γενομένης ἀπέστειλαν οἱ στρατηγοὶ τοὺς ῥαβδούχους λέγοντες· Ἀπόλυσον τοὺς ἀνθρώπους ἐκείνους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/035.yaml
  text: And when day came[a], the magistrates sent the rod-bearers, saying, “Release those men.”
translation:
  language: te
  text: తెల్లవారినప్పుడు, పట్టణ న్యాయాధికారులు కర్రలు మోసే అధికారిక పరిచారకులను[a] పంపి, “ఆ మనుషులను విడుదల చేయి” అని చెప్పారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లిక్టర్లను’; వీరు రోమా న్యాయాధికారుల అధికారిక పరిచారకులు; అధికారానికి చిహ్నంగా కర్రలు మోసేవారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμέρας δὲ γενομένης
  choice: తెల్లవారినప్పుడు
  rationale: ఈ షష్ఠీ స్వతంత్ర ప్రయోగం కాలసంబంధ మార్పును సూచిస్తుంది. ‘తెల్లవారినప్పుడు’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, పగలు వచ్చిన సమయ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀπέστειλαν
  choice: పంపి
  rationale: ἀποστέλλω యొక్క సాధారణ భావమైన ‘పంపడం’ను సహజమైన తెలుగు వాక్య నిర్మాణంలో తెలిపింది.
- source_word: οἱ στρατηγοὶ
  choice: పట్టణ న్యాయాధికారులు
  rationale: ఫిలిప్పీలో వీరు సాధారణ సైనిక సేనాధిపతులు కాక, రోమా వలసపట్టణపు పాలనా-న్యాయ అధికారులు. ‘పట్టణ న్యాయాధికారులు’ సందర్భానుసారంగా వారి పదవిని సామాన్య పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: τοὺς ῥαβδούχους
  choice: కర్రలు మోసే అధికార సేవకులను
  rationale: పదశః ‘కర్రలు మోయువారు’; వీరు రోమా న్యాయాధికారుల అధికారిక పరిచారకులు. ఈ అనువాదం వారి అధికారిక పాత్రతో పాటు మూలంలోని కర్రల దృశ్యాన్ని కూడా నిలుపుతుంది; చారిత్రక పదమైన ‘లిక్టర్లు’ను పాదసూచికలో ఇచ్చాం.
- source_word: λέγοντες
  choice: అని చెప్పారు
  rationale: ఈ వర్తమాన అసమాపక క్రియ సందేశంలోని మాటలను పరిచయం చేస్తుంది. తెలుగులో ప్రత్యక్ష ఉక్తి తరువాత ‘అని చెప్పారు’ సహజంగా అదే అనుసంధానాన్ని అందిస్తుంది.
- source_word: Ἀπόλυσον
  choice: విడుదల చేయి
  rationale: ఏకవచన ఆజ్ఞారూపాన్ని అలాగే ఉంచుతూ, నిర్బంధం నుండి విడిచిపెట్టే న్యాయపరమైన సందర్భాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τοὺς ἀνθρώπους ἐκείνους
  choice: ఆ మనుషులను
  rationale: సందర్భంలో పౌలు, సీలలను సూచించే నిర్దిష్ట పురుష వ్యక్తులను మూలానికి దగ్గరగా తెలియజేస్తుంది.
