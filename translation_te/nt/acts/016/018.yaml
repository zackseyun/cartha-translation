id: ACT.16.18
reference: Acts 16:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐποίει ἐπὶ πολλὰς ἡμέρας. διαπονηθεὶς ⸀δὲ Παῦλος καὶ ἐπιστρέψας τῷ πνεύματι εἶπεν· Παραγγέλλω σοι ⸀ἐν ὀνόματι Ἰησοῦ Χριστοῦ ἐξελθεῖν ἀπ’ αὐτῆς· καὶ ἐξῆλθεν αὐτῇ τῇ ὥρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/018.yaml
  text: And she kept doing this for many days[a]. But Paul, becoming greatly troubled, turned to the spirit and said[b], “I command you in the name of Jesus the Messiah to come out of her.” And it came out that very hour.
translation:
  language: te
  text: ఆమె ఇలా చాలా రోజులపాటు చేస్తూనే ఉంది. అయితే పౌలు ఎంతో కలత చెంది, ఆ ఆత్మవైపు తిరిగి[a], “యేసు మెస్సీయ[b] పేరున, ఆమెను విడిచి బయటికి రమ్మని నీకు ఆజ్ఞాపిస్తున్నాను” అన్నాడు. ఆ ఆత్మ ఆ క్షణమే బయటికి వెళ్లిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో కేవలం “ఆ ఆత్మతో” అని ఉంది; సందర్భం అది ఆ దాసి బాలికను పీడిస్తున్న ఆత్మ అని తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యేసు క్రీస్తు.” గ్రీకు Χριστός అనే బిరుదు అర్థాన్ని స్పష్టంగా ఉంచడానికి ఇక్కడ “మెస్సీయ” అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐποίει ἐπὶ πολλὰς ἡμέρας
  choice: చాలా రోజులపాటు చేస్తూనే ఉంది
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగిన లేదా పునరావృతమైన చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: διαπονηθεὶς
  choice: ఎంతో కలత చెంది
  rationale: ఈ పదం స్వల్ప చికాకు కంటే లోతైన మనోవేదన లేదా విసుగును సూచిస్తుంది; కోపాన్ని అనవసరంగా చేర్చకుండా దాని తీవ్రతను నిలుపుతుంది.
- source_word: ἐπιστρέψας
  choice: తిరిగి
  rationale: పౌలు మాట్లాడే ముందు శరీరాన్ని ఆమెవైపు తిప్పుకున్న చర్యను సంక్షిప్తంగా తెలియజేస్తుంది; మూలంలో లేని ‘వెనక్కి’ అనే భావాన్ని బలవంతంగా చేర్చదు.
- source_word: τῷ πνεύματι
  choice: ఆ ఆత్మతో
  rationale: గ్రీకు మూలంలో విశేషణం లేకుండా ‘ఆత్మతో’ అని మాత్రమే ఉంది. సందర్భం దాని స్వభావాన్ని తెలియజేసినా, ప్రధాన పాఠంలో ‘దుష్ట’ లేదా ‘దయ్యం’ అని చేర్చలేదు.
- source_word: Παραγγέλλω σοι
  choice: నీకు ఆజ్ఞాపిస్తున్నాను
  rationale: ఆత్మను ఉద్దేశించి పలికిన అధికారపూర్వక ఆదేశాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: ἐν ὀνόματι Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ పేరున
  rationale: Χριστός ఇక్కడ యేసు యొక్క అభిషిక్తుని బిరుదుగా పనిచేస్తుంది; ‘పేరున’ అనేది ఆయన అధికారంతో ఇచ్చే ఆజ్ఞను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐξελθεῖν ἀπ’ αὐτῆς
  choice: ఆమెను విడిచి బయటికి రా
  rationale: ఆత్మ ఒక వ్యక్తిలోనుంచి నిష్క్రమించాలనే ఆజ్ఞను తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐξῆλθεν αὐτῇ τῇ ὥρᾳ
  choice: ఆ గంటలోనే అది బయటికి వచ్చింది
  rationale: αὐτῇ τῇ ὥρᾳ అనే పదబంధంలోని తక్షణ నెరవేర్పు భావాన్ని నిలుపుతూ, ‘గంట’ అనే మూల రూపకాన్ని కూడా కాపాడుతుంది.
theological_decisions:
- issue: ἐν ὀνόματι Ἰησοῦ Χριστοῦ లో Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: Χριστός ఇక్కడ కేవలం పేరులోని భాగంలా కాక, యేసు యొక్క అభిషిక్తుని బిరుదుగా పనిచేస్తుంది. అందువల్ల దాని బిరుదు భావాన్ని తెలుగులో స్పష్టంగా ఉంచాం.
- issue: τῷ πνεύματι ను ప్రధాన పాఠంలో ఎలా గుర్తించాలి
  choice: ఆ ఆత్మతో
  alternative: దుష్టాత్మతో / దయ్యంతో
  rationale: ఈ వాక్యం πνεῦμα అని మాత్రమే చెబుతుంది. సందర్భం అది బాలికను పీడిస్తున్న ఆత్మ అని తెలియజేస్తుంది; అయినా మూలంలో లేని విశేషణాన్ని ప్రధాన పాఠంలో చేర్చకుండా అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సహజమైన శైలి వాడబడింది. కొనసాగుతున్న చర్యకు ‘చేస్తూనే ఉంది’, అధికారపూర్వక ఆజ్ఞకు ‘ఆజ్ఞాపిస్తున్నాను’, తక్షణ ఫలితానికి ‘ఆ గంటలోనే’ వాడాం. మూలంలో లేని ‘దుష్ట’ అనే విశేషణాన్ని చేర్చలేదు.
