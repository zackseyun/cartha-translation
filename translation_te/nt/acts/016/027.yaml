  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔξυπνος δὲ γενόμενος ὁ δεσμοφύλαξ καὶ ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς σπασάμενος ⸀τὴν μάχαιραν ἤμελλεν ἑαυτὸν ἀναιρεῖν, νομίζων ἐκπεφευγέναι τοὺς δεσμίους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/027.yaml
  text: When the jailer woke up and saw the prison doors standing open[a], he drew his sword and was about to kill himself[b], supposing that the prisoners had escaped.
translation:
  language: te
  text: చెరసాల కాపలాదారు మేల్కొని, చెరసాల తలుపులు తెరవబడి ఉన్నట్లు చూసి[a], కత్తిని దూసి, ఖైదీలు తప్పించుకొని పోయారని భావిస్తూ, తనను తాను చంపుకోబోయాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత పదానుసారంగా, ‘చెరసాల తలుపులు తెరవబడి ఉన్నట్లు చూశాడు.’ గ్రీకు పరిపూర్ణ కర్మణి కృదంతం తలుపులు తెరవబడిన ఫలితస్థితిలో ఉన్నాయని నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు μάχαιρα అనే పదం కత్తిని లేదా బాకు వంటి పొట్టి పదునైన ఆయుధాన్ని సూచించవచ్చు; ఈ సందర్భంలో సాధారణ అనువాదంగా ‘కత్తి’ ఉపయోగించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξυπνος ... γενόμενος
  choice: మేల్కొని
  rationale: మేలుకొనే స్థితికి రావడాన్ని సూచించే గ్రీకు ప్రయోగానికి ఇది సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: δεσμοφύλαξ
  choice: చెరసాల అధికారి
  rationale: ఖైదీల బాధ్యత వహించే అధికారిని సందర్భానుసారంగా స్పష్టంగా సూచిస్తుంది; కేవలం ‘కాపలాదారు’ అనడం మరీ విస్తృతం.
- source_word: ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς
  choice: చెరసాల తలుపులు తెరిచి ఉండడం చూసి
  rationale: పరిపూర్ణ కర్మణి కృదంతం తలుపులు తెరవబడిన ఫలితస్థితిలో ఉన్నాయని సూచిస్తుంది; ‘తెరిచి ఉండడం’ ఆ స్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: తన కత్తిని ఒరనుండి తీసి
  rationale: ఆయుధాన్ని బయటకు తీయడమే ఈ ప్రయోగ భావం. ‘ఒరనుండి’ అనేది తెలుగులో కత్తిని దూయడాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἤμελλεν ἑαυτὸν ἀναιρεῖν
  choice: తనను తాను చంపుకోబోయాడు
  rationale: ἤμελλεν చర్య సమీపంలో ఉందని, ἀναιρεῖν ఇక్కడ చంపడాన్ని సూచిస్తాయి; ఈ రూపం రెండింటినీ సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: νομίζων
  choice: భావించాడు
  rationale: తెరిచి ఉన్న తలుపులను బట్టి అతడు చేసుకున్న, కాని నిర్ధారితం కాని ఊహను తెలియజేస్తుంది.
- source_word: ἐκπεφευγέναι
  choice: తప్పించుకొని పోయారని
  rationale: పరిపూర్ణ క్రియారూపం అప్పటికే పూర్తయిందని అతడు భావించిన తప్పించుకోవడాన్ని సూచిస్తుంది.
- source_word: τοὺς δεσμίους
  choice: ఖైదీలు
  rationale: ఈ సందర్భంలో నిర్బంధంలో ఉన్న వ్యక్తులకు ఆధునిక తెలుగులో స్పష్టమైన సాధారణ పదం.
