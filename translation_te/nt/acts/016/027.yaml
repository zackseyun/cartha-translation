revisions:
- from: చెరసాల అధికారి మేల్కొని, చెరసాల తలుపులు తెరిచి ఉండడం చూసి[a], ఖైదీలు తప్పించుకొని పోయారని భావించాడు. అందువల్ల అతడు తన కత్తిని ఒరనుండి తీసి, తనను తాను చంపుకోబోయాడు[b].
  to: చెరసాల కాపలాదారు మేల్కొని, చెరసాల తలుపులు తెరవబడి ఉన్నట్లు చూసి[a], కత్తిని దూసి, ఖైదీలు తప్పించుకొని పోయారని భావిస్తూ, తనను తాను చంపుకోబోయాడు[b].
  rationale: The revision follows the Greek participial sequence and retains νομίζων as the jailer’s motivating supposition rather than introducing an independent, earlier conclusion with “అందువల్ల.” It also renders the perfect passive participle ἀνεῳγμένας as a continuing opened state. Footnote anchors remain attached to the doors and the weapon term respectively.
