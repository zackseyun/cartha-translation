translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. గ్రీకు వాక్యంలో కారణాన్ని తెలిపే νομίζων చివర ఉన్నప్పటికీ, తెలుగులో కారణ-ఫలిత సంబంధం స్పష్టంగా ఉండేందుకు ‘భావించాడు. అందువల్ల’ అని క్రమబద్ధీకరించబడింది. మూలంలోని భావపరమైన సందిగ్ధతను మించి ఏ మతసిద్ధాంత వివరణను చేర్చలేదు.
