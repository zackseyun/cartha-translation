source:
  edition: SBLGNT
  text: ἄφνω δὲ σεισμὸς ἐγένετο μέγας ὥστε σαλευθῆναι τὰ θεμέλια τοῦ δεσμωτηρίου, ἠνεῴχθησαν ⸀δὲ παραχρῆμα αἱ θύραι πᾶσαι, καὶ πάντων τὰ δεσμὰ ἀνέθη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/026.yaml
  text: Suddenly there was a great earthquake[a], so that the foundations of the prison were shaken; and immediately all the doors were opened[b], and everyone's chains were unfastened.
translation:
  language: te
  text: అకస్మాత్తుగా భారీ భూకంపం వచ్చింది; దాంతో చెరసాల పునాదులు కదిలిపోయాయి. వెంటనే తలుపులన్నీ తెరుచుకున్నాయి, అందరి సంకెళ్లు విప్పబడ్డాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అందరి బంధాలు సడలిపోయాయి.” δεσμά అనే గ్రీకు పదానికి “బంధాలు” లేదా “సంకెళ్లు” అనే అర్థాలు రావచ్చు; ἀνέθηను “సడలిపోయాయి” లేదా “విప్పబడ్డాయి” అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφνω
  choice: అకస్మాత్తుగా
  rationale: హఠాత్తుగా జరిగిన సంఘటనను సూచించే క్రియావిశేషణానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: σεισμὸς ἐγένετο μέγας
  choice: గొప్ప భూకంపం వచ్చింది
  rationale: γίνομαι + నామవాచక నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, μέγας తీవ్రతను అతిశయార్థం జోడించకుండా నిలుపుతుంది.
- source_word: ὥστε σαλευθῆναι
  choice: దాంతో ... కదిలిపోయాయి
  rationale: ὥστε సూచించే ఫలిత సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది; σαλεύω యొక్క కదలిక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: τὰ θεμέλια τοῦ δεσμωτηρίου
  choice: చెరసాల పునాదులు
  rationale: δεσμωτήριονను సాధారణంగా అర్థమయ్యే గౌరవప్రదమైన 'చెరసాల'గా, θεμέλιαను నిర్మాణాత్మక 'పునాదులు'గా అనువదిస్తుంది.
- source_word: ἠνεῴχθησαν ... αἱ θύραι πᾶσαι
  choice: తలుపులన్నీ తెరుచుకున్నాయి
  rationale: గ్రీకు కర్మణి రూపం సంఘటనలో తలుపులు తెరవబడిన ఫలితాన్ని సూచిస్తుంది; తెలుగులో అకర్మక ఫలిత రూపం మరింత సహజంగా ఉంటుంది.
- source_word: παραχρῆμα
  choice: వెంటనే
  rationale: ఆలస్యం లేకుండా అప్పటికప్పుడే జరిగినదనే భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: πάντων
  choice: అందరి
  rationale: బహువచన షష్ఠీ విభక్తి ద్వారా బంధాలు ఖైదీలందరికీ చెందినవని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: τὰ δεσμὰ
  choice: సంకెళ్లు
  rationale: ఖైదు సందర్భంలో δεσμά సూచించే భౌతిక నిర్బంధ సాధనాలకు స్పష్టమైన, సహజమైన తెలుగు పదం; 'బంధాలు' అనే విస్తృత అర్థమూ సాధ్యం.
- source_word: ἀνέθη
  choice: ఊడిపోయాయి
  rationale: ἀνίημι యొక్క సడలడం లేదా విడిపోవడం అనే ఫలిత భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; ఎవరో వాటిని ఉద్దేశపూర్వకంగా విప్పారని అదనంగా చెప్పదు.
