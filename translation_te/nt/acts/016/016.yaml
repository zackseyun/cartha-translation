id: ACT.16.16
reference: Acts 16:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ πορευομένων ἡμῶν εἰς ⸀τὴν προσευχὴν παιδίσκην τινὰ ἔχουσαν πνεῦμα ⸀πύθωνα ⸀ὑπαντῆσαι ἡμῖν, ἥτις ἐργασίαν πολλὴν παρεῖχεν τοῖς κυρίοις αὐτῆς μαντευομένη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/016.yaml
  text: And it happened that, as we were going to the place of prayer, a certain servant girl who had a python spirit met us, and she was bringing much profit to her masters by fortune-telling.
translation:
  language: te
  text: మేము ప్రార్థనా స్థలానికి వెళ్తుండగా, పైథోను ఆత్మ కలిగిన ఒక బానిస బాలిక[a] మాకు ఎదురైంది. ఆమె సోదె చెప్పడం[b] ద్వారా తన యజమానులకు ఎంతో లాభం తెచ్చిపెడుతూ ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సోదె చెప్పే ఆత్మ కలిగిన.” గ్రీకులో “పైథోను ఆత్మ” అనే, సోదె చెప్పడంతో సంబంధమున్న సాంస్కృతికంగా ప్రత్యేకమైన పదబంధం ఉంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, “శకునం చెప్పడం ద్వారా,” “సోదె చెప్పే విద్యను ఆచరించడం ద్వారా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ πορευομένων ἡμῶν
  choice: మేము ... వెళ్తుండగా
  rationale: Ἐγένετο δέ అనే కథన సంధిని తెలుగులో విడిగా అనువదిస్తే కృత్రిమంగా ఉంటుంది; నేపథ్యంగా సాగుతున్న చర్యను తెలిపే genitive absolute భావాన్ని సహజమైన ఆధునిక తెలుగు వాక్య నిర్మాణంలో నిలిపింది.
- source_word: εἰς τὴν προσευχὴν
  choice: ప్రార్థనా స్థలానికి
  rationale: ఇక్కడ προσευχή కేవలం ప్రార్థనా క్రియకన్నా గుర్తింపబడిన ప్రార్థనా స్థలాన్ని సూచించే అవకాశమున్నందున స్థానార్థాన్ని స్పష్టంగా తెలిపింది.
- source_word: παιδίσκην τινά
  choice: ఒక బానిస బాలిక
  rationale: పదం బాలిక/యువతి అనే భావంతో పాటు సేవక లేదా బానిస స్థితిని సూచిస్తుంది; అనేకమంది యజమానులు ఆమె ద్వారా లాభం పొందుతున్న సందర్భం బానిసత్వాన్ని ప్రధానంగా చూపుతుంది.
- source_word: ἔχουσαν πνεῦμα πύθωνα
  choice: పైథోను ఆత్మ పట్టిన
  rationale: మూలంలోని సాంస్కృతికంగా నిర్దిష్టమైన πύθων పదాన్ని సాధారణ ‘సోదె చెప్పే ఆత్మ’గా పూర్తిగా వ్యాఖ్యానించకుండా నిలిపింది. తెలుగులో ఆత్మ ఆధీనాన్ని సహజంగా తెలిపేందుకు ‘ఆత్మ పట్టిన’ అని అనువదించింది.
- source_word: ὑπαντῆσαι ἡμῖν
  choice: మాకు ఎదురైంది
  rationale: ఆమె వారిని కలుసుకోవడం లేదా ఎదురుపడడం అనే సంఘటనను సహజమైన కథన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐργασίαν πολλὴν παρεῖχεν τοῖς κυρίοις αὐτῆς
  choice: తన యజమానులకు ఎంతో లాభం తెచ్చిపెడుతూ ఉండేది
  rationale: ἐργασία ఇక్కడ ఆర్థిక లాభాన్ని సూచిస్తుంది; imperfect రూపంలోని కొనసాగుతున్న చర్యను ‘తెచ్చిపెడుతూ ఉండేది’ నిలుపుతుంది.
- source_word: μαντευομένη
  choice: సోదె చెప్పడం ద్వారా
  rationale: భవిష్యవాణి లేదా శకున సంబంధమైన divinatory practice‌ను సాధారణ పాఠకులకు అర్థమయ్యే ప్రస్తుత తెలుగులో తెలిపింది; మరింత సాంకేతిక ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
theological_decisions:
- issue: πνεῦμα πύθωνα అనే సాంస్కృతికంగా ప్రత్యేకమైన వ్యక్తీకరణను ఎలా అనువదించాలి
  choice: పైథోను ఆత్మ
  alternative: సోదె చెప్పే ఆత్మ / దివ్యజ్ఞాన ఆత్మ
  rationale: మూలంలోని ‘పైథోను’ అనే నిర్దిష్ట పదాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది దైవికమైన దేవుని జ్ఞానమని అపార్థం కలిగించగల ‘దివ్యజ్ఞానం’ వంటి పదాన్ని నివారించింది; అర్థ వివరణను పాదసూచికకు పరిమితం చేసింది.
- issue: παιδίσκηలోని సామాజిక స్థితిని స్పష్టంగా చూపాలా
  choice: బానిస బాలిక
  alternative: పనిపిల్ల / సేవకురాలు
  rationale: ఆమెకు అనేకమంది యజమానులు ఉండడం, వారు ఆమె పనివల్ల లాభం పొందడం వంటి సందర్భ సూచనలు బంధిత స్థితిని బలపరుస్తాయి; అందువల్ల దోపిడీ వాస్తవాన్ని మసకబార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘పైథోను’ అనే అపరిచిత సాంస్కృతిక పదాన్ని మూలనిష్ఠ కోసం ప్రధాన పాఠ్యంలో ఉంచి పాదసూచికలో వివరించాం; ‘బానిస బాలిక’ సామాజిక దోపిడీని స్పష్టంగా చూపుతుంది.
