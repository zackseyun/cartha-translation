id: ACT.16.30
reference: Acts 16:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ προαγαγὼν αὐτοὺς ἔξω ἔφη· Κύριοι, τί με δεῖ ποιεῖν ἵνα σωθῶ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/030.yaml
  text: And after bringing them outside[a], he said, “Sirs[b], what must I do so that I may be saved?”
translation:
  language: te
  text: 'వారిని బయటికి తీసుకువచ్చిన తర్వాత అతడు ఇలా అన్నాడు: “అయ్యలారా,[a] నేను రక్షించబడటానికి ఏమి చేయాలి?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అయ్యలారా’ అనేది ఇక్కడ పౌలు, సీలలను గౌరవంగా సంబోధించే గ్రీకు పదానికి అనువాదం; ఇది దేవునికి వాడే ‘ప్రభువు’ అనే బిరుదు కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: προαγαγὼν αὐτοὺς ἔξω
  choice: వారిని బయటికి తీసుకొచ్చిన తరువాత
  rationale: అపొస్తలులను బయటికి తీసుకురావడం ప్రధాన క్రియకు ముందుగా జరిగినదని ఏఓరిస్ట్ కృదంతం సూచిస్తుంది; ఈ క్రమాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔφη
  choice: అని అడిగాడు
  rationale: పదశః ‘అన్నాడు’ అయినప్పటికీ, వెంట వచ్చే ప్రశ్నను పరిచయం చేస్తున్నందున తెలుగులో ‘అని అడిగాడు’ సహజంగా ఉంది; మాట యొక్క ప్రశ్నార్థక స్వభావాన్ని మాత్రమే స్పష్టం చేస్తుంది.
- source_word: Κύριοι
  choice: అయ్యలారా
  rationale: ఇది పౌలు, సీలలను గౌరవంగా సంబోధించే బహువచన రూపం; ఇక్కడ దేవునికి వాడే ‘ప్రభువు’ అనే బిరుదు కాదు.
- source_word: τί με δεῖ ποιεῖν
  choice: నేను ... ఏమి చేయాలి
  rationale: δεῖ తెలిపే అవసరతను ‘చేయాలి’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἵνα σωθῶ
  choice: రక్షించబడాలంటే
  rationale: σωθῶ యొక్క కర్మణి భావాన్ని ‘రక్షించబడాలి’ నిలుపుతుంది; తెలుగు షరతు-ఉద్దేశ్య నిర్మాణం ప్రశ్నలో సహజంగా ఉండి, ‘రక్షణ పొందడానికి’ కంటే మూలంలోని కర్మణి రూపానికి దగ్గరగా ఉంటుంది.
theological_decisions:
- issue: చెరసాల అధికారి ప్రశ్నలో σωθῶ యొక్క అర్థం
  choice: రక్షించబడాలి
  alternative: విడిపించబడాలి / కాపాడబడాలి
  rationale: సందర్భంలో ఈ పదానికి తక్షణ ప్రమాదం నుండి విడుదల అనే విస్తృత ఛాయ ఉండగలిగినా, తదుపరి వచనంలోని ప్రభువైన యేసుపై విశ్వాసం గురించిన సమాధానం సంపూర్ణ రక్షణ భావాన్ని బలపరుస్తుంది. ‘రక్షించబడాలి’ ఆ అర్థాన్ని నిలుపుతూ, ప్రత్యేక సిద్ధాంత వ్యవస్థను వచనంలోకి చొప్పించదు.
- issue: Κύριοι సంబోధనకు దైవిక బిరుదు భావం ఉందా?
  choice: సామాజిక గౌరవ సంబోధనగా ‘అయ్యలారా’
  alternative: ప్రభువులారా / యజమానులారా
  rationale: బహువచన సంబోధన ఇక్కడ పౌలు, సీలలను ఉద్దేశించింది. కాబట్టి దైవిక బిరుదైన ‘ప్రభువు’ అని అనువదించడం సందర్భానికి అనుచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘అయ్యలారా’ సాధారణ పాఠకులకు అర్థమయ్యే మర్యాదపూర్వక బహువచన సంబోధన. మూలంలోని క్రియాక్రమం, అవసరత, కర్మణి రక్షణ భావం నిలుపబడ్డాయి.
