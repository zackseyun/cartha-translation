source:
  edition: SBLGNT
  text: τοῦτον ἠθέλησεν ὁ Παῦλος σὺν αὐτῷ ἐξελθεῖν, καὶ λαβὼν περιέτεμεν αὐτὸν διὰ τοὺς Ἰουδαίους τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις, ᾔδεισαν γὰρ ἅπαντες ⸂ὅτι Ἕλλην ὁ πατὴρ αὐτοῦ⸃ ὑπῆρχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/003.yaml
  text: Paul wanted him to go out with him[a], and after taking him, he circumcised him because of the Jews who were in those places[c][b], for they all knew that his father was a Greek.
translation:
  language: te
  text: పౌలు అతనిని తనతో కలిసి బయలుదేరమని కోరుకున్నాడు[a]. ఆ ప్రాంతాల్లో ఉన్న యూదుల కారణంగా[b], అతనిని తీసుకొని అతనికి సున్నతి చేశాడు. ఎందుకంటే అతని తండ్రి గ్రీకువాడని[c] వారందరికీ తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తనతో కలిసి ప్రయాణించమని.” గ్రీకులో అక్షరార్థంగా “తనతో కలిసి బయలుదేరమని” ఉంది; ఇది ప్రయాణానికి బయలుదేరడాన్ని సూచించగల ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యూదుల నిమిత్తం”; “యూదులను బట్టి.”
    reason: lexical_alternative
  - marker: c
    text: గ్రీకులో “గ్రీకువాడు.” ఈ సందర్భంలో ఇది తిమోతి తండ్రి యూదుడు కాదని సూచిస్తుండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτον
  choice: అతడు / అతన్ని
  rationale: ముందటి సందర్భంలోని తిమోతిని సూచించే సర్వనామంగా తెలుగులో సహజంగా అనువదించబడింది; మూలంలో లేని అదనపు పేరును చేర్చలేదు.
- source_word: σὺν αὐτῷ ἐξελθεῖν
  choice: తనతో కలిసి బయలుదేరాలని
  rationale: ἐξελθεῖν యొక్క ‘బయలుదేరు’ అనే ప్రాథమిక భావాన్ని నిలుపుతూ, ఇక్కడ ప్రయాణం ఆరంభించడాన్ని సూచించే సహజమైన తెలుగు ప్రయోగాన్ని వాడింది.
- source_word: λαβὼν
  choice: అతన్ని తీసుకొని
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచించే గ్రీకు భూతకాల అసమాపక క్రియారూపాన్ని సూటిగా ప్రతిబింబిస్తుంది.
- source_word: περιέτεμεν αὐτόν
  choice: అతనికి సున్నతి చేశాడు
  rationale: క్రియను ఎటువంటి సభ్యోక్తి లేకుండా ఆధునిక తెలుగులో నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: διὰ τοὺς Ἰουδαίους
  choice: యూదుల కారణంగా
  rationale: కర్మకారకంతో వచ్చిన διά ఇక్కడ కారణాన్ని లేదా ప్రేరణను సూచిస్తుంది; దాని స్వరాన్ని మించి సానుకూల ఉద్దేశాన్ని చేర్చదు.
- source_word: τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις
  choice: ఆ ప్రాంతాల్లో ఉన్న
  rationale: స్థానిక యూదులను గుర్తించే విశేషణార్థక పదబంధాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: ᾔδεισαν γὰρ ἅπαντες
  choice: ఎందుకంటే ... వారందరికీ తెలుసు
  rationale: γάρ యొక్క వివరణాత్మక సంబంధాన్నీ, ἅπαντες లోని సమగ్రతనూ నిలుపుతుంది.
- source_word: Ἕλλην
  choice: గ్రీకువాడు
  rationale: పదం యొక్క ప్రత్యక్ష జాతి-సాంస్కృతిక సూచనను నిలుపుతుంది; ‘యూదేతరుడు’ అనే సందర్భానుగుణ విస్తృతార్థాన్ని ప్రధాన పాఠ్యంలో పెట్టలేదు.
theological_decisions:
- issue: తిమోతికి సున్నతి చేయడానికి యూదులతో సంబంధమైన కారణం
  choice: స్థానిక యూదులకు తిమోతి తండ్రి గ్రీకువాడని తెలిసినందువల్ల పౌలు ఈ చర్య చేశాడని కథనం చెప్పిన మేరకే అనువదించబడింది.
  alternative: ఇది విశ్వాసులకు సున్నతి రక్షణకో, నిబంధనలో స్థానానికో అవసరమని పౌలు బోధించిన చర్యగా వివరించడం; లేదా ఇది కేవలం మిషనరీ వ్యూహమేనని తేల్చడం.
  rationale: గ్రీకు పాఠ్యం చర్యకు కారణాన్ని స్పష్టంగా చెబుతుంది గాని దాని విస్తృత సిద్ధాంతపరమైన అర్థాన్ని తేల్చదు. అందువల్ల ఇతర నూతన నిబంధన భాగాలతో ఉన్న ఉద్రిక్తతను పరిష్కరించకుండా అలాగే ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘బయలుదేరాలని’ అనే పదం మూలంలోని కదలిక చిత్రాన్ని నిలుపుతుంది; ‘సున్నతి చేశాడు’ నేరుగా, సభ్యోక్తి లేకుండా ఉంది.
