  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. గ్రీకులోని ‘ఆశ వెళ్లిపోయింది’ అనే చిత్రాన్ని తెలుగులో సహజమైన ‘ఆశ పోయింది’గా నిలిపి, అధికార పదాల మధ్య ఉన్న సాధారణ–నిర్దిష్ట భేదాన్ని పాదసూచికలో వివరించాం.
