source:
  edition: SBLGNT
  text: Ἰδόντες δὲ οἱ κύριοι αὐτῆς ὅτι ἐξῆλθεν ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν ἐπιλαβόμενοι τὸν Παῦλον καὶ τὸν Σιλᾶν εἵλκυσαν εἰς τὴν ἀγορὰν ἐπὶ τοὺς ἄρχοντας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/019.yaml
  text: But when her masters saw that their hope of profit had gone out[a], they seized Paul and Silas and dragged them into the marketplace before the rulers[b],
translation:
  language: te
  text: అయితే ఆమె యజమానులు తమ ఆదాయం గురించిన ఆశ పోయిందని[a] చూసి, పౌలును, సీలను పట్టుకుని బహిరంగ కూడలికి, పాలకుల[b] ఎదుటకు ఈడ్చుకుపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమ లాభం గురించిన ఆశ.’ గ్రీకు పదబంధానికి అక్షరార్థం ‘వారి సంపాదనకు సంబంధించిన ఆశ.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘పాలకులు’గా అనువదించిన గ్రీకు పదం పౌర అధికారులను సూచించే సాధారణ పదం. తరువాతి వచనంలో మరింత నిర్దిష్టమైన అధికార పదం వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι αὐτῆς
  choice: ఆమె యజమానులు
  rationale: ఈ సందర్భంలో ఈ పదం ఆ బానిస యువతిపై యాజమాన్యం, నియంత్రణ కలిగినవారిని సూచిస్తుంది. ‘యజమానులు’ వారి సామాజిక ఆధిపత్యాన్ని, ఆర్థిక దోపిడిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐξῆλθεν
  choice: పోయిందని
  rationale: ‘బయటికి వెళ్లింది’ అనే మూల చిత్రాన్ని తెలుగులో పూర్తిగా పదానువాదం చేస్తే అసహజంగా ఉంటుంది. ‘ఆశ పోయింది’ అనేది నష్టం పూర్తయిందనే భావాన్ని సహజంగా తెలియజేస్తూ, గ్రీకు వాక్యంలోని ‘వెళ్లిపోవడం’ చిత్రాన్ని కొంతవరకు నిలుపుతుంది.
- source_word: ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν
  choice: తమ సంపాదనపై ఆశ
  rationale: ἐλπίς యొక్క ‘ఆశ’ భావాన్ని నిలుపుతూ, ἐργασία ఇక్కడ సాధారణ పనిని కాక దాని ద్వారా వచ్చే సంపాదనను సూచిస్తుందని సందర్భానుసారంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπιλαβόμενοι
  choice: పట్టుకొని
  rationale: వారు పౌలు, సీలలను బలవంతంగా అదుపులోకి తీసుకున్న hostile action‌ను సహజంగా తెలియజేస్తుంది.
- source_word: εἵλκυσαν
  choice: ఈడ్చుకుపోయారు
  rationale: ἕλκωలోని బలవంతంగా లాగడం అనే తీవ్రతను స్పష్టంగా నిలుపుతుంది.
- source_word: ἀγορὰν
  choice: పట్టణ కూడలి
  rationale: ἀγορά వ్యాపారం జరిగే ప్రదేశమే కాక ప్రజా, పౌర కార్యకలాపాల కేంద్రంగా ఉన్న బహిరంగ కూడలిని కూడా సూచిస్తుంది. ఈ న్యాయసంబంధ సందర్భంలో ‘పట్టణ కూడలి’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: ἐπὶ τοὺς ἄρχοντας
  choice: పాలకుల ఎదుటికి
  rationale: ἄρχοντες అనే సాధారణ పౌర అధికార పదాన్ని నిలుపుతుంది; తరువాతి వచనంలో వచ్చే మరింత నిర్దిష్ట అధికార పదాన్ని ముందుగానే ఇక్కడ ప్రవేశపెట్టదు.
