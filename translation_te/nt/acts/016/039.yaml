translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా కథనానికి తగిన గౌరవప్రదమైన శైలిలో అనువదించబడింది. మూలంలోని పార్టిసిపిల్ క్రమం సహజ తెలుగు ఉపవాక్యాలుగా వ్యక్తమైంది; సర్వనామ సందిగ్ధతను నివారించేందుకు పౌలు, సీలల పేర్లు స్పష్టీకరించబడ్డాయి.
