source:
  edition: SBLGNT
  text: καὶ ἐλθόντες παρεκάλεσαν αὐτούς, καὶ ἐξαγαγόντες ἠρώτων ⸂ἀπελθεῖν ἀπὸ⸃ τῆς πόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/039.yaml
  text: And they came and appealed to them[a], and after leading them out[b], they asked them to leave the city.
translation:
  language: te
  text: వారు వచ్చి పౌలు, సీలలను బుజ్జగించారు[a]. వారిని బయటికి తీసుకొచ్చి, పట్టణం విడిచి వెళ్లమని వారిని అడుగుతూ ఉన్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వేడుకున్నారు,’ ‘వినయంగా విజ్ఞప్తి చేశారు.’ గ్రీకు క్రియకు ఇతర సందర్భాల్లో ‘ఓదార్చారు’ అనే అర్థం కూడా ఉండవచ్చు; అయితే ఇక్కడ పౌలు, సీలలకు జరిగిన అన్యాయం తర్వాత వారిని సమాధానపరచే లేదా రాజీ పడే ప్రయత్నమే ప్రధాన భావం.
    reason: lexical_alternative
  - marker: b
    text: ‘అడిగారు’ అని కూడా అనువదించవచ్చు. గ్రీకులోని ఇంపర్ఫెక్ట్ క్రియారూపం వారు అడుగుతూనే ఉన్నారని లేదా పదేపదే అడిగారని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: వారు వచ్చి
  rationale: ఆరిస్ట్ పార్టిసిపిల్ అధికారుల రాకను, తరువాతి చర్యకు ముందు జరిగినదిగా సూచిస్తుంది; ఆధునిక తెలుగులో ‘వారు వచ్చి’ సహజంగా ఆ క్రమాన్ని నిలుపుతుంది.
- source_word: παρεκάλεσαν
  choice: బతిమాలుకున్నారు
  rationale: ఈ సందర్భంలో παρακαλέω ఓదార్చడం కంటే, తాము చేసిన అన్యాయానంతరం పౌలు సీలలను ప్రసన్నం చేసుకోవడానికి వినయంగా వేడుకోవడం లేదా సమాధానపరచడం అనే భావాన్ని ఇస్తుంది.
- source_word: αὐτούς
  choice: పౌలును సీలను
  rationale: గ్రీకులో సర్వనామం ఉన్నా, తెలుగులో కర్త మార్పు వల్ల కలిగే సందిగ్ధతను నివారించడానికి దాని పూర్వపదాలను స్పష్టంగా పేర్కొనడం సహజం.
- source_word: ἐξαγαγόντες
  choice: వారిని బయటికి తీసుకొచ్చిన తర్వాత
  rationale: ἐξάγω లోని బయటకు తీసుకురావడం అనే భౌతిక కదలికను, ఆరిస్ట్ పార్టిసిపిల్ సూచించే చర్యల క్రమాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἠρώτων
  choice: అడుగుతూ ఉన్నారు
  rationale: ఇంపర్ఫెక్ట్ రూపం కొనసాగుతున్న లేదా పదేపదే చేసిన విజ్ఞప్తిని సూచించగలదు; తెలుగు కొనసాగింపు రూపం ఆ భావసాధ్యతను సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἀπελθεῖν ἀπὸ τῆς πόλεως
  choice: పట్టణం విడిచి వెళ్లమని
  rationale: ఇది విజ్ఞప్తి విషయాన్ని తెలిపే ఇన్ఫినిటివ్ పదబంధం; ‘పట్టణం విడిచి వెళ్లడం’ ఆధునిక తెలుగులో సహజమైన, ఖచ్చితమైన వ్యక్తీకరణ.
