id: ACT.16.5
reference: Acts 16:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: αἱ μὲν οὖν ἐκκλησίαι ἐστερεοῦντο τῇ πίστει καὶ ἐπερίσσευον τῷ ἀριθμῷ καθ’ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/005.yaml
  text: So the churches were being strengthened in the faith and were increasing in number day by day[a].
translation:
  language: te
  text: కాబట్టి సంఘాలు విశ్వాసంలో బలపడుతూ, రోజురోజుకూ సంఖ్యలో పెరుగుతూ వచ్చాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ విశ్వాసంలో.’ గ్రీకు పదబంధం సంఘాలు పంచుకున్న క్రైస్తవ విశ్వాసంలో బలపడటాన్ని సూచించవచ్చు; లేదా సాధారణంగా విశ్వాసంలో బలపడటాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: αἱ μὲν οὖν
  choice: కాబట్టి
  rationale: ముందటి కథనానికి అనుసంధానమైన పరివర్తనాత్మక సారాంశం లేదా ఫలితాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; μένకు ఇక్కడ ప్రత్యేక విరోధార్థక జతను వ్యక్తం చేయాల్సిన అవసరం లేదు.
- source_word: ἐκκλησίαι
  choice: సంఘాలు
  rationale: ఈ సందర్భంలో స్థానిక క్రైస్తవ సమాజాలను సూచిస్తుంది. ఆధునిక తెలుగు బైబిల్ వాడుకలో ‘సంఘాలు’ స్పష్టమైన, సహజమైన పదం.
- source_word: ἐστερεοῦντο
  choice: బలపడుతూ
  rationale: అసంపూర్ణ భూతకాల కర్మణి రూపం గతంలో కొనసాగిన ప్రక్రియను సూచిస్తుంది. తెలుగు సంయుక్త క్రియ నిర్మాణంలో ‘బలపడుతూ ... వచ్చాయి’ ఆ కొనసాగింపును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τῇ πίστει
  choice: విశ్వాసంలో
  rationale: దత్తి విభక్తి బలపడిన పరిధిని సూచిస్తుంది. గ్రీకులోని ఆర్టికల్ సామూహిక క్రైస్తవ విశ్వాసాన్ని సూచించే అవకాశం ఉన్నా, తెలుగులో ‘విశ్వాసంలో’ అనే రూపం సామూహిక విశ్వాసం మరియు వ్యక్తిగత నమ్మకం మధ్యనున్న నిజమైన సందిగ్ధతను నిలుపుతుంది.
- source_word: ἐπερίσσευον
  choice: పెరుగుతూ వచ్చాయి
  rationale: అసంపూర్ణ భూతకాల రూపంలోని నిరంతర వృద్ధిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τῷ ἀριθμῷ
  choice: సంఖ్యలో
  rationale: పెరుగుదల ఏ విషయంలో జరిగిందో తెలిపే దత్తి విభక్తిని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καθ’ ἡμέραν
  choice: రోజురోజుకూ
  rationale: ప్రతి రోజు కొనసాగుతూ జరిగిన పెరుగుదల అనే పంపిణీ మరియు పునరావృత భావాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
theological_decisions:
- issue: ఆర్టికల్‌తో ఉన్న πίστις యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో ‘విశ్వాసంలో’ అని ఉంచి, సామూహిక క్రైస్తవ విశ్వాసం అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో వివరించడం
  alternative: ‘ఆ విశ్వాసంలో’ లేదా ‘క్రైస్తవ విశ్వాసంలో’ అని స్పష్టీకరించడం
  rationale: సంఘాల సందర్భం మరియు గ్రీకు ఆర్టికల్ పంచుకున్న క్రైస్తవ విశ్వాస వ్యవస్థను సూచించవచ్చు; అయినప్పటికీ వ్యక్తిగత విశ్వాసం అనే భావం పూర్తిగా తొలగిపోదు. తెలుగు ప్రధాన పాఠ్యం రెండింటికీ చోటిస్తుండగా పాదటిప్పణి సందిగ్ధతను వెల్లడిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. రెండు గ్రీకు అసంపూర్ణ భూతకాల క్రియల కొనసాగింపు భావాన్ని ‘బలపడుతూ ... పెరుగుతూ వచ్చాయి’ నిర్మాణం ద్వారా నిలిపింది.
