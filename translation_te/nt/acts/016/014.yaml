id: ACT.16.14
reference: Acts 16:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καί τις γυνὴ ὀνόματι Λυδία, πορφυρόπωλις πόλεως Θυατείρων σεβομένη τὸν θεόν, ἤκουεν, ἧς ὁ κύριος διήνοιξεν τὴν καρδίαν προσέχειν τοῖς λαλουμένοις ὑπὸ ⸀τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/014.yaml
  text: And a certain woman named Lydia[a], a seller of purple cloth from the city of Thyatira, who worshiped God, was listening; the Lord opened her heart to pay attention to what was being spoken by Paul.
translation:
  language: te
  text: థుయతైర పట్టణానికి చెందిన, ఊదారంగు వస్త్రాల వ్యాపారి అయిన లూదియా అనే ఒక స్త్రీ దేవుణ్ణి ఆరాధించేది[a]; ఆమె వింటూ ఉండగా, పౌలు చెబుతున్న మాటలకు శ్రద్ధ చూపేలా ప్రభువు ఆమె హృదయాన్ని తెరిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని ఆరాధకురాలు’; ఈ పదబంధం ఇశ్రాయేలు దేవుని ఆరాధించే అన్యజన భక్తురాలిని సూచించవచ్చు.
    reason: σεβομένη τὸν θεόν అనే పదబంధానికి సాధారణ ఆరాధన భావంతో పాటు, ఇశ్రాయేలు దేవునికి అంకితమైన అన్యజన భక్తురాలిని సూచించే అవకాశం ఉంది.
lexical_decisions:
- source_word: καί τις γυνὴ ὀνόματι Λυδία
  choice: లూదియా అనే ఒక స్త్రీ అక్కడ ఉంది
  rationale: τις లోని అనిర్దిష్టతను ‘ఒక స్త్రీ’ నిలుపుతుంది; తెలుగు కథన ప్రవాహం కోసం పరిచయ వాక్యంగా సహజంగా మలిచాం.
- source_word: πορφυρόπωλις
  choice: ఊదారంగు వస్త్రాలు అమ్మే
  rationale: ఈ పదం ఊదారంగు అద్దిన వస్త్రాలు లేదా సరుకుల వ్యాపారిని సూచిస్తుంది. ‘వస్త్రాలు’ అనేది సందర్భానికి తగిన స్పష్టమైన అనువాదం; విలాసవస్త్రాలు అని అతిగా నిర్దిష్టం చేయదు.
- source_word: πόλεως Θυατείρων
  choice: థుయతైర పట్టణానికి చెందిన
  rationale: లూదియా ఏ పట్టణానికి చెందినదో తెలిపే గ్రీకు షష్ఠీ సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: σεβομένη τὸν θεόν
  choice: ఆమె దేవుణ్ణి ఆరాధించేది
  rationale: దేవుని పట్ల భక్తి, ఆరాధన కలిగి ఉండడాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘దైవభక్తురాలు’ అనే సాధ్యమైన వర్గసూచక భావాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా విధించదు.
- source_word: ἤκουεν
  choice: ఆమె వింటూ ఉండగా
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న చర్యను తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: ὁ κύριος
  choice: ప్రభువు
  rationale: గ్రీకు పాఠ్యంలో ఉన్న బిరుదునే అనువదించి, అది యేసునా లేక దేవుడా అని పాఠ్యం చెప్పినదానికంటే ఎక్కువగా నిర్దిష్టం చేయదు.
- source_word: διήνοιξεν τὴν καρδίαν
  choice: ఆమె హృదయాన్ని తెరిచాడు
  rationale: లోపలి గ్రహణశక్తిని కలిగించడాన్ని సూచించే మూలభాషా రూపకాన్ని సహజంగా నిలుపుతుంది.
- source_word: προσέχειν
  choice: శ్రద్ధ పెట్టేలా
  rationale: ‘స్పందించేలా’ అని ఫలితాన్ని ముందుగానే చేర్చకుండా, దృష్టి నిలపడం అనే పదార్థానికి దగ్గరగా ఉంటుంది.
- source_word: τοῖς λαλουμένοις ὑπὸ τοῦ Παύλου
  choice: పౌలు చెబుతున్న మాటలపై
  rationale: జరుగుతున్న మాటల చర్యను ‘చెబుతున్న’ ద్వారా నిలుపుతూ, కర్త అయిన పౌలును స్పష్టంగా పేర్కొంటుంది.
theological_decisions:
- issue: ὁ κύριος అనే పదం ఎవరిని సూచిస్తుంది
  choice: ప్రభువు
  alternative: ప్రభువైన యేసు; దేవుడు
  rationale: గ్రీకు పాఠ్యం కేవలం ὁ κύριος అని చెబుతుంది. అపొస్తలుల కార్యములలో ఇది క్రీస్తును సూచించగలిగినా, ఇక్కడ దైవిక కార్యమే ప్రధానంగా ఉంది; అందువల్ల అనువాదం ఉద్దేశపూర్వకంగా మూలంలోని విస్తృతతను నిలుపుతుంది.
- issue: σεβομένη τὸν θεόν సాధారణ వర్ణనా లేక వర్గసూచక పదమా
  choice: దేవుణ్ణి ఆరాధించేది
  alternative: దైవభక్తురాలు; దేవుని ఆరాధకురాలు
  rationale: ఈ మాట ఇశ్రాయేలు దేవుని ఆరాధించే అన్యజన భక్తురాలిని సూచించే అవకాశం ఉంది. ప్రధాన పాఠ్యం ఆరాధన భావాన్ని ఇస్తుంది; సాధ్యమైన సామాజిక-మత వర్గార్థాన్ని పాదటిప్పణిలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యం పొడవుగా ఉన్నప్పటికీ, తెలుగులో స్పష్టత కోసం మూడు అనుసంధాన వాక్యాలుగా విభజించాం. ‘హృదయాన్ని తెరిచాడు’ అనే మూల రూపకాన్ని నిలిపాం; ‘మారుమనస్సు కలిగించాడు’ వంటి వ్యాఖ్యాత్మక పదాలను చేర్చలేదు.
