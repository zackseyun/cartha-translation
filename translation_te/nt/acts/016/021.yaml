revisions:
- from: మరియు మనం రోమీయులం కాబట్టి, మనం అంగీకరించడంగానీ ఆచరించడంగానీ చట్టబద్ధం కాని ఆచారాలను వీరు ప్రకటిస్తున్నారు.[a]
  to: మరియు మనం రోమీయులం కాబట్టి, మనకు అంగీకరించడానికీ ఆచరించడానికీ చట్టప్రకారం అనుమతి లేని ఆచారాలను వీరు ప్రకటిస్తున్నారు.[a]
  rationale: The revision places ‘మనకు అంగీకరించడానికీ ఆచరించడానికీ’ directly within the scope of ‘చట్టప్రకారం అనుమతి లేని,’ making clear that the alleged prohibition concerns accepting and practicing the customs, not an intrinsic legal status of the customs. The causal Roman identity phrase and its footnote are retained.
