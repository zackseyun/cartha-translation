id: ACT.16.21
reference: Acts 16:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ καταγγέλλουσιν ἔθη ἃ οὐκ ἔξεστιν ἡμῖν παραδέχεσθαι οὐδὲ ποιεῖν Ῥωμαίοις οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/021.yaml
  text: and they are proclaiming customs that it is not lawful for us to accept or practice[a], since we are Romans.
translation:
  language: te
  text: మరియు మనం రోమీయులం కాబట్టి, మనకు అంగీకరించడానికీ ఆచరించడానికీ చట్టప్రకారం అనుమతి లేని ఆచారాలను వీరు ప్రకటిస్తున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రోమీయులమైన మనం” లేక “రోమీయులుగా.” గ్రీకు కృదంత పదబంధం ఈ ఆచారాలను తిరస్కరించడానికి ఆరోపకులు చెప్పే కారణాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: మరియు
  rationale: మునుపటి వచనంలోని ఆరోపణను కొనసాగించే సాధారణ సంధానపదం.
- source_word: καταγγέλλουσιν
  choice: ప్రకటిస్తున్నారు
  rationale: బహిరంగంగా ప్రకటించడం అనే వర్తమానకాల ఆరోపణను సహజంగా వ్యక్తం చేస్తుంది; ‘బోధిస్తున్నారు’ అని భావాన్ని మరీ నిర్దిష్టం చేయదు.
- source_word: ἔθη
  choice: ఆచారాలను
  rationale: స్థిరపడిన సామాజిక లేదా మతపరమైన customs/practices భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: οὐκ ἔξεστιν
  choice: చట్టబద్ధం కాని
  rationale: ఆరోపకులు ఉపయోగించిన న్యాయ-పౌర ధోరణిని నిలుపుతుంది; వారి వాదన నిజమని అనువాదం ధ్రువీకరించదు.
- source_word: παραδέχεσθαι
  choice: అంగీకరించడానికి
  rationale: ఆ ఆచారాలను సమ్మతించి స్వీకరించడం అనే విస్తృత భావాన్ని ఇస్తుంది.
- source_word: οὐδὲ ποιεῖν
  choice: ఆచరించడానికి
  rationale: ఆచారాల సందర్భంలో ποιεῖν అంటే వాటిని పాటించడం లేదా అమలు చేయడం; ‘ఆచరించడం’ సహజమైన తెలుగు.
- source_word: Ῥωμαίοις οὖσιν
  choice: మనం రోమీయులం కాబట్టి
  rationale: దత్తివ విభక్తిలోని కృదంత పదబంధం ఆరోపకులు చెప్పే కారణాన్ని సూచిస్తుంది; కారణార్థాన్ని తెలుగులో స్పష్టంగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ఆరోపణలోని నిషేధ స్వభావం
  choice: ‘చట్టబద్ధం కాని’ అని న్యాయ-పౌర పరమైన ఆరోపణగా అనువదించడం
  alternative: ‘మనకు తగని’ లేదా ‘మనకు అనుమతి లేని’
  rationale: ఇది ఆరోపకుల మాట; రోమా చట్టం నిజంగా అలా చెప్పిందని లూకా ధ్రువీకరించినట్లు విస్తరించకూడదు. మూలంలోని న్యాయపరమైన ధోరణిని మాత్రం నిలుపాలి.
- issue: Ῥωμαίοις οὖσιν పదబంధంలోని సంబంధం
  choice: కారణార్థంగా ‘మనం రోమీయులం కాబట్టి’
  alternative: ‘రోమీయులమైన మనం’ లేదా ‘రోమీయులుగా’
  rationale: సందర్భంలో ఈ పదబంధం ఆచారాలను తిరస్కరించడానికి ఆరోపకులు చూపే కారణాన్ని తెలియజేస్తుంది; ఇతర వ్యాకరణసమ్మత రూపాలను పాదటిప్పణిలో ఉంచడం ద్వారా స్వల్ప అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే న్యాయపరమైన ఆరోపణ ధోరణి నిలిచేలా గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘అంగీకరించడంగానీ ఆచరించడంగానీ’ అనే జంట మూలంలోని రెండు క్రియలను స్పష్టంగా నిలుపుతుంది.
