translation:
  language: te
  text: అప్పుడు వారు ముసియాను దాటి[a] త్రోయకు దిగివెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ముసియా గుండా వెళ్లి’ లేదా ‘ముసియా పక్కగా వెళ్లి.’ గ్రీకు కృదంతాన్ని ఈ సమీప భావాల్లో అనువదించవచ్చు. సందర్భంలో వారు అక్కడ పరిచర్య చేయకుండా ముందుకు సాగినట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρελθόντες
  choice: దాటుకుంటూ
  rationale: παρέρχομαι అనే క్రియ యొక్క భూతకాల కృదంత రూపం ఇది. ముసియాలో ఆగకుండా దానిని దాటి ముందుకు సాగారనే కథన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; అయితే ఆ ప్రాంతం గుండా వెళ్లారా, దాని పక్కగా వెళ్లారా అన్న సూక్ష్మ భేదం గ్రీకు పదంలో తెరిచి ఉంది.
- source_word: δὲ
  choice: కాబట్టి
  rationale: ఇది స్వల్ప అనుసంధానాన్ని సూచించే అవ్యయం. ముందరి వాక్యంలోని పరిస్థితి నుంచి సహజమైన కథన కొనసాగింపును తెలుగులో తెలియజేయడానికి ‘కాబట్టి’ ఉపయోగించబడింది; బలమైన వ్యతిరేకార్థం ఉద్దేశించబడలేదు.
- source_word: Μυσίαν
  choice: ముసియాను
  rationale: ప్రాంతనామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న ధ్వన్యనుకరణకు అనుగుణంగా ఇచ్చి, కర్మవిభక్తి చేర్చబడింది.
- source_word: κατέβησαν
  choice: దిగివెళ్లారు
  rationale: καταβαίνω లోని దిగువ దిశ భావాన్ని నిలుపుతూ, తీరప్రాంతం లేదా తక్కువ ఎత్తువైపు ప్రయాణాన్ని సూచించే సహజ తెలుగు రూపం.
- source_word: εἰς
  choice: కు
  rationale: గమ్యస్థానాన్ని సూచించే εἰς ను నగరనామంతో సహజంగా కలిసే తెలుగు గమ్యార్థక ప్రత్యయంగా అనువదించబడింది.
- source_word: Τρῳάδα
  choice: త్రోయ
  rationale: స్థలనామాన్ని దాని గ్రీకు రూపానికి దగ్గరగా తెలుగులో ధ్వన్యనుకరించి, గమ్యార్థక ‘కు’తో వాడబడింది.
