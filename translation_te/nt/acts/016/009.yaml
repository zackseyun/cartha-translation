  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὅραμα ⸀διὰ νυκτὸς ⸂τῷ Παύλῳ ὤφθη⸃, ἀνὴρ ⸂Μακεδών τις ἦν⸃ ἑστὼς ⸀καὶ παρακαλῶν αὐτὸν καὶ λέγων· Διαβὰς εἰς Μακεδονίαν βοήθησον ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/009.yaml
  text: 'And a vision appeared to Paul in the night: a certain Macedonian man was standing and urging him[a], saying[c][b], “Come over into Macedonia and help us.”'
translation:
  language: te
  text: రాత్రివేళ[a] పౌలుకు ఒక దర్శనం కలిగింది. అందులో మాసిదోనియకు చెందిన ఒక మనిషి[b] నిలబడి, “మాసిదోనియకు దాటి వచ్చి[c] మాకు సహాయం చేయండి” అని అతన్ని వేడుకుంటున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రాత్రిలో” లేదా “రాత్రి సమయంలో.”
    reason: lexical_alternative
  - marker: b
    text: మూలభాషలో “మాసిదోనియవాడైన ఒక పురుషుడు”; లేదా “మాసిదోనియకు చెందిన ఒక పురుషుడు.”
    reason: lexical_alternative
  - marker: c
    text: మూలభాషలో “మాసిదోనియలోకి దాటి వచ్చి, మాకు సహాయం చేయండి.” గ్రీకులోని అసమాపక క్రియ, మాసిదోనియకు చేరడానికి దాటివచ్చే భావాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅραμα
  choice: దర్శనం
  rationale: అపొస్తలుల కార్యముల కథన సందర్భంలో దేవుని నుండి కలిగిన దృశ్యానుభవాన్ని సూచించే సహజమైన తెలుగు పదం; అది కలనా, అంతరంగ భావనా, ప్రత్యక్ష రూపదర్శనమా అని పాఠం చెప్పనిదాన్ని నిర్ణయించదు.
- source_word: διὰ νυκτός
  choice: రాత్రివేళ
  rationale: దర్శనం కలిగిన సమయాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘రాత్రిలో’ కూడా సాధ్యమే.
- source_word: τῷ Παύλῳ ὤφθη
  choice: పౌలుకు ... కలిగింది
  rationale: ὤφθη అనే నిష్క్రియారూపాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ, దర్శనం పౌలుకు అనుభవమైందనే భావాన్ని నిలుపుతుంది.
- source_word: ἀνὴρ Μακεδών τις
  choice: మాసిదోనియకు చెందిన ఒక మనిషి
  rationale: ἀνήρ ఇక్కడ పురుషుడిని సూచిస్తుంది; τις ఇచ్చే అనిర్దిష్టతను ‘ఒక’ నిలుపుతుంది. జాతి/ప్రాంత సంబంధాన్ని తెలుగులో సహజంగా ‘చెందిన’తో తెలిపింది.
- source_word: ἑστώς
  choice: నిలబడి
  rationale: దర్శనంలోని వ్యక్తి భంగిమను దృశ్యవర్ణనగా నిలుపుతుంది.
- source_word: παρακαλῶν
  choice: వేడుకుంటున్నాడు
  rationale: సహాయం కోరుతున్న సందర్భంలోని గాఢమైన విజ్ఞప్తిని వ్యక్తపరుస్తుంది; కేవలం ప్రోత్సహించడం అనే బలహీన భావాన్ని నివారిస్తుంది.
- source_word: λέγων
  choice: అని
  rationale: ప్రత్యక్ష సంభాషణను ఆధునిక తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: Διαβάς
  choice: వచ్చి
  rationale: ఆజ్ఞతో కలిసి ఉన్న ఈ అసమాపక క్రియను తెలుగులో సహజమైన వరుసక్రియగా ఇచ్చింది; మూలంలోని ‘దాటి’ అనే భావాన్ని పాదసూచికలో తెలిపింది.
- source_word: εἰς Μακεδονίαν
  choice: మాసిదోనియకు
  rationale: మాసిదోనియా వైపు ప్రయాణ గమ్యాన్ని సహజంగా సూచిస్తుంది.
- source_word: βοήθησον ἡμῖν
  choice: మాకు సహాయం చేయండి
  rationale: సూటి సహాయ విజ్ఞప్తిని స్పష్టమైన ఆధునిక తెలుగులో ఇస్తుంది; తెలుగులో గౌరవపూర్వక ఏకవచన సంబోధనకు సహజమైన క్రియారూపాన్ని ఉపయోగించింది.
theological_decisions:
- issue: ὅραμα మరియు ὤφθη సూచించే అనుభవ స్వభావం
  choice: పౌలుకు దర్శనం కలిగిందని మాత్రమే అనువదించడం
  alternative: దీనిని కల, అంతరంగ ప్రేరణ లేదా బాహ్య ప్రత్యక్ష రూపం అని నిర్దిష్టీకరించడం
  rationale: మూలపాఠం దీనిని దర్శనమని చెబుతుంది గాని, దాని ఖచ్చితమైన అనుభవ విధానాన్ని వివరించదు. అనువాదం ఆ అనిశ్చితిని అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథనశైలిని నిలిపింది. ‘సహాయం చేయండి’ తెలుగు గౌరవార్థక ఏకవచనంగా సహజంగా వినిపిస్తుంది; గ్రీకులోని ఆజ్ఞ వ్యాకరణపరంగా ఏకవచనం.
