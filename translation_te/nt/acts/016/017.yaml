id: ACT.16.17
reference: Acts 16:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: αὕτη ⸀κατακολουθοῦσα τῷ Παύλῳ καὶ ἡμῖν ἔκραζεν λέγουσα· Οὗτοι οἱ ἄνθρωποι δοῦλοι τοῦ θεοῦ τοῦ ὑψίστου εἰσίν, οἵτινες καταγγέλλουσιν ⸀ὑμῖν ὁδὸν σωτηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/017.yaml
  text: She kept following Paul and us and crying out[a], saying, “These men are servants of the Most High God, who are proclaiming to you the way of salvation.”
translation:
  language: te
  text: ఆమె పౌలును, మమ్మల్ని వెంబడిస్తూ, “ఈ మనుషులు సర్వోన్నతుడైన దేవుని దాసులు; వీరు మీకు రక్షణ మార్గాన్ని[a] ప్రకటిస్తున్నారు” అని పదేపదే బిగ్గరగా అరుస్తూ ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా ‘రక్షణ మార్గాన్ని’ అని ఉంది. ‘మార్గం’కు ముందు నిర్దిష్ట ఉపపదం లేదు; సందర్భాన్ని బట్టి దీనిని ‘రక్షణకు ఒక మార్గం’గా లేదా ‘రక్షణ మార్గం’గా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: κατακολουθοῦσα
  choice: వెంబడిస్తూ
  rationale: వర్తమాన కృదంతం, అపూర్ణ భూతకాల ప్రధాన క్రియతో కలిసి కొనసాగుతున్న చర్యను సూచిస్తుంది. ‘వెంబడిస్తూ’ సహజంగా ఆ భావాన్ని అందిస్తుంది; ‘పదేపదే’ ప్రధాన క్రియ యొక్క పునరావృత భావాన్ని స్పష్టం చేస్తుంది.
- source_word: ἔκραζεν
  choice: పదేపదే బిగ్గరగా కేకలు వేసింది
  rationale: అపూర్ణ భూతకాల రూపం కొనసాగిన లేదా పునరావృతమైన బిగ్గర పలుకును సూచిస్తుంది. ఈ రూపకల్పన శబ్ద తీవ్రతనూ పునరావృతతనూ తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: δοῦλοι
  choice: దాసులు
  rationale: ఇక్కడ పౌలు, అతని సహచరులు దేవునికి చెందినవారనే అధీనత/యాజమాన్య సంబంధం ప్రధానంగా ఉంది. ‘దాసులు’ ఆ భావాన్ని ‘సేవకులు’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: τοῦ θεοῦ τοῦ ὑψίστου
  choice: సర్వోన్నతుడైన దేవుని
  rationale: ὕψιστος అనే దైవ బిరుదును గౌరవప్రదమైన, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καταγγέλλουσιν
  choice: ప్రకటిస్తున్నారు
  rationale: బహిరంగంగా తెలియజేయడం లేదా ప్రకటించడం అనే క్రియార్థాన్ని, వర్తమాన కాల భావంతో సహజంగా అందిస్తుంది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: ప్రకటనను వినే వారిని సూచించే దత్తివును సహజమైన పరోక్ష కర్మగా అనువదిస్తుంది.
- source_word: ὁδὸν σωτηρίας
  choice: రక్షణ మార్గాన్ని
  rationale: తెలుగులో ‘మార్గం’ను కర్మగా వాడినప్పుడు నిర్దిష్టతను ఇంగ్లీషులోని article వ్యవస్థలా తప్పనిసరిగా గుర్తించరు. అందువల్ల ఈ రూపం గ్రీకు అనిర్దిష్ట/నిర్దిష్ట అవకాశాన్ని సహజంగా తెరిచి ఉంచుతుంది.
theological_decisions:
- issue: ὁδὸν σωτηρίας యొక్క నిర్దిష్టత
  choice: రక్షణ మార్గాన్ని
  alternative: రక్షణకు ఒక మార్గాన్ని / ఆ రక్షణ మార్గాన్ని
  rationale: ὁδόν ముందు article లేదు; అయితే గ్రీకులో article లేకపోవడం తప్పనిసరిగా అనిర్దిష్టతను నిరూపించదు. తెలుగు article-రహిత నామపదబంధమైన ‘రక్షణ మార్గాన్ని’ సహజంగా ఉండి, ‘ఒక’ లేదా ‘ఆ’ అని జోడించి సందిగ్ధతను పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు అపూర్ణ భూతకాలంలోని కొనసాగింపు/పునరావృత భావాన్ని ‘పదేపదే’తో వ్యక్తం చేశాం. ప్రత్యక్ష వాక్యాన్ని సహజ తెలుగు వాక్యక్రమంలో అమర్చాం.
