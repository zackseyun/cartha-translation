id: ACT.16.31
reference: Acts 16:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Πίστευσον ἐπὶ τὸν κύριον ⸀Ἰησοῦν, καὶ σωθήσῃ σὺ καὶ ὁ οἶκός σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/031.yaml
  text: And they said[a], “Believe in the Lord Jesus[b], and you will be saved—you and your household.”
translation:
  language: te
  text: 'వారు ఇలా అన్నారు: “ప్రభువైన యేసుపై విశ్వాసం ఉంచు; అప్పుడు నీవు రక్షణ పొందుతావు—నీ ఇంటివారూ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఇంటివారు” అంటే కేవలం ఇల్లు అనే భవనం కాదు; ఆ ఇంటికి చెందినవారు.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: అందుకు వారు ... అని చెప్పారు
  rationale: δέ ఇక్కడ స్వల్ప అనుసంధానాన్ని సూచిస్తుంది. తెలుగు కథన ప్రవాహంలో ‘అందుకు’ సహజంగా ఉండి, అవసరానికి మించిన వ్యతిరేక భావాన్ని కలిగించదు.
- source_word: Πίστευσον ἐπὶ τὸν
  choice: మీద విశ్వాసముంచు
  rationale: πιστεύω తో ἐπί + accusative విశ్వాసం ఎవరిపై నిలపబడుతుందో సూచిస్తుంది. ‘విశ్వాసముంచు’ నిర్ణయాత్మక స్పందనకు పిలుపునిచ్చే aorist imperative బలాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: κύριον Ἰησοῦν
  choice: ప్రభువైన యేసు
  rationale: κύριος యొక్క గౌరవార్థక, క్రీస్తు సంబంధమైన బలాన్ని ‘ప్రభువు’ నిలుపుతుంది; Ἰησοῦς అనే వ్యక్తినామం ప్రామాణిక తెలుగు రూపంలో ఇవ్వబడింది.
- source_word: σωθήσῃ
  choice: రక్షించబడతారు
  rationale: σῴζω యొక్క future passive రూపాన్ని నిలుపుతూ, ఈ సువార్త సందర్భంలో ఆత్మీయ మరియు సమగ్ర విమోచన భావాన్ని అనవసరంగా కుదించకుండా వ్యక్తపరుస్తుంది.
- source_word: σὺ καὶ ὁ οἶκός σου
  choice: నీవూ నీ ఇంటివారూ
  rationale: οἶκος ఇక్కడ భవనాన్ని కాక, అతని ఇంటికి చెందిన వ్యక్తుల సమూహాన్ని సూచిస్తుంది. ‘ఇంటివారు’ ఆధునిక తెలుగులో సహజంగా ఆ సామాజిక అర్థాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ‘నీవూ నీ ఇంటివారూ’ అనే వాగ్దానం యొక్క పరిధి
  choice: ఇంటివారినీ వాగ్దాన పరిధిలో చేర్చే మూల వాక్యాన్ని యథాతథంగా ఉంచడం; వారి వ్యక్తిగత విశ్వాసం గురించి ఈ ఒక్క వచనం చెప్పనిదాన్ని అనువాదంలో చేర్చకపోవడం.
  alternative: చెరసాల అధికారి విశ్వాసం వల్లనే ఇంటివారంతా స్వయంచాలకంగా రక్షించబడతారని సూచించడం; లేదా ఇంటివారి ప్రస్తావనను బలహీనపరచి పూర్తిగా వ్యక్తిగతంగా మాత్రమే చూపడం.
  rationale: గ్రీకు వాక్యం చెరసాల అధికారినీ అతని ఇంటివారినీ స్పష్టంగా ప్రస్తావిస్తుంది; అయితే వారి రక్షణ జరిగే విధానంపై తరువాతి సిద్ధాంత వివాదాలను ఈ వచనం మాత్రమే పరిష్కరించదు. అందువల్ల వచనంలోని ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ఏకవచన ఆజ్ఞకు ‘విశ్వాసముంచు’, సంయుక్త కర్తకు సహజంగా ‘రక్షించబడతారు’ వాడాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
