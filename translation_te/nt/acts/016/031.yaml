revisions:
- from: అందుకు వారు, “ప్రభువైన యేసుమీద విశ్వాసముంచు; అప్పుడు నీవూ నీ ఇంటివారూ రక్షించబడతారు” అని చెప్పారు.[a]
  to: 'వారు ఇలా అన్నారు: “ప్రభువైన యేసుపై విశ్వాసం ఉంచు; అప్పుడు నీవు రక్షణ పొందుతావు—నీ ఇంటివారూ[a].”'
  rationale: The revision removes the unwarranted inferential force of ‘అందుకు,’ uses a direct and idiomatic Telugu quotation, and preserves the singular address and future promise to the jailer. The dash retains the Greek coordination of ‘you and your household’ without resolving the verse’s debated implication about how the household comes within the promise. The explanatory footnote is retained and placed directly after the term it explains.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:05:57Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the principal terms, but ‘అందుకు’ introduces a consequential sense not carried by the lightly connective δέ. More importantly, the singular future passive σωθήσῃ is directed first to the jailer; the plural ‘రక్షించబడతారు’ makes both the jailer and household the direct grammatical subject of the single verb and slightly obscures that form.
  naturalness: ‘ప్రభువైన యేసుపై విశ్వాసం ఉంచు’ and ‘రక్షణ పొందుతావు’ are natural modern standard Telugu. ‘వారు ఇలా అన్నారు’ is smoother narrative Telugu than the discontinuous ‘అందుకు వారు … అని చెప్పారు.’
  terminology: ‘ప్రభువైన యేసు,’ ‘విశ్వాసం ఉంచు,’ and ‘రక్షణ’ appropriately preserve the register and key theological language. ‘ఇంటివారు’ naturally conveys οἶκος as the members of a household rather than a building.
  issues:
  - severity: medium
    issue: ‘అందుకు’ overtranslates δέ.
    rationale: δέ here is merely connective (‘and/but’); ‘అందుకు’ means ‘therefore/in response to that’ and adds an inferential relation.
  - severity: medium
    issue: Plural ‘రక్షించబడతారు’ does not reflect the singular σωθήσῃ.
    rationale: The Greek verb is singular and directly addresses the jailer. Telugu can retain this with ‘నీవు రక్షణ పొందుతావు,’ then coordinate the household without adding a mechanism of salvation.
  - severity: low
    issue: The household explanatory footnote should be anchored to ‘ఇంటివారు.’
    rationale: This makes clear which expression the note explains and avoids a sentence-final anchor whose scope could be unclear.
  revised_text: 'వారు ఇలా అన్నారు: “ప్రభువైన యేసుపై విశ్వాసం ఉంచు; అప్పుడు నీవు రక్షణ పొందుతావు—నీ ఇంటివారూ[a].”'
