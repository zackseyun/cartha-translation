id: ACT.16.32
reference: Acts 16:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐλάλησαν αὐτῷ τὸν λόγον τοῦ ⸀κυρίου ⸀σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/032.yaml
  text: And they spoke the word of the Lord to him[c][b][a], together with all who were in his house.
translation:
  language: te
  text: వారు అతనితో పాటు అతని ఇంట్లో ఉన్న వారందరికీ[c][b] ప్రభువు వాక్యాన్ని[a] చెప్పారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రభువును గురించిన సందేశాన్ని.” గ్రీకులోని “ప్రభువు వాక్యం” అనే పదబంధం ప్రభువుకు చెందిన, ప్రభువు నుండి వచ్చిన, లేదా ప్రభువును గురించిన సందేశాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా “అతని ఇంటివారందరికీ.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “అతనికి, అతని ఇంట్లో ఉన్న వారందరితో కలిసి.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἐλάλησαν
  choice: చెప్పారు
  rationale: λαλέω ఇక్కడ సువార్త సందేశాన్ని నేరుగా తెలియజేయడాన్ని సూచిస్తుంది. ‘చెప్పారు’ ఆధునిక తెలుగులో సహజంగా ఉండి, మూలంలో లేని బహిరంగ ప్రకటన భావాన్ని చేర్చదు.
- source_word: αὐτῷ
  choice: అతనితో పాటు ... వారందరికీ
  rationale: సర్వనామం చెరసాల అధికారిని సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో σύν పదబంధంతో కలిపి, అతనూ అతని ఇంట్లోని వారందరూ సందేశాన్ని విన్న గ్రహీతలని సహజంగా తెలియజేస్తుంది.
- source_word: τὸν λόγον
  choice: వాక్యాన్ని
  rationale: λόγος ఇక్కడ పలికిన క్రైస్తవ సందేశాన్ని సూచిస్తుంది. ‘వాక్యం’ కొత్త నిబంధనలోని సాధారణ పదబంధాన్ని నిలుపుతూ, ‘ప్రభువు’తో ఉన్న సంబంధాన్ని ముందుగానే ఒకే అర్థానికి పరిమితం చేయదు.
- source_word: τοῦ κυρίου
  choice: ప్రభువు
  rationale: κύριοςకు ప్రాజెక్టు ప్రమాణానుసారం ‘ప్రభువు’ వాడబడింది. ‘ప్రభువు వాక్యం’ అనే రూపం ఆ వాక్యం ప్రభువు నుండి వచ్చినదా, ఆయనకు చెందినదా, లేక ఆయనను గురించినదా అనే గ్రీకు షష్ఠీ విభక్తి భావాన్ని ఉద్దేశపూర్వకంగా పరిష్కరించకుండా ఉంచుతుంది.
- source_word: σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: అతనితో పాటు అతని ఇంట్లో ఉన్న వారందరికీ
  rationale: σύνలోని ‘తో పాటు’ భావాన్ని నిలుపుతూ, సందేశం చెరసాల అధికారికే కాక అక్కడ ఉన్న వారందరికీ చెప్పబడిందని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: οἰκίᾳ
  choice: ఇంట్లో
  rationale: οἰκία భౌతిక ఇంటినీ ఇంటివారినీ సూచించగలదు. ‘ఇంట్లో ఉన్నవారు’ అనే రూపం గ్రీకు పదబంధంలోని స్థల సూచనను నిలుపుతుంది; ‘ఇంటివారు’ సరైన సందర్భానుసార ప్రత్యామ్నాయం.
theological_decisions:
- issue: ‘ప్రభువు వాక్యం’ అనే పదబంధంలోని సంబంధం
  choice: ‘ప్రభువు వాక్యం’ అని అనువదించి, షష్ఠీ విభక్తి భావాన్ని నిర్దిష్టంగా నిర్ణయించలేదు.
  alternative: ‘ప్రభువు నుండి వచ్చిన సందేశం’ లేదా ‘ప్రభువును గురించిన సందేశం’
  rationale: గ్రీకు పదబంధం ఈ భావాలలో ఒకటిని లేదా సందర్భంలో రెండింటినీ మోయగలదు. ప్రధాన పాఠంలో మరింత అక్షరానుసారమైన రూపాన్ని ఉంచడం ద్వారా మూలంలోని నిజమైన అర్థవిస్తృతిని, theological tensionను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘ప్రభువు వాక్యం’ అనే సుపరిచిత నూతన నిబంధన పదబంధాన్ని నిలిపి, వాక్యాంతాన్ని తెలుగు గ్రహీతలకు సహజంగా అర్థమయ్యేలా నిర్మించాం.
