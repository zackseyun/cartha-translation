  source_fidelity: మూలంలోని కాలసంబంధమైన ὡς δέ, ‘ఆమె మరియు ఆమె ఇంటివారు’ అనే బాప్తిస్మ సూచన, πιστή τῷ κυρίῳలోని ‘ప్రభువుకు నమ్మకంగా/విశ్వాసిగా’ అనే ఉద్దేశపూర్వక భావవిస్తృతి, అలాగే παρεβιάσατοలోని గట్టి పట్టుదల—అన్నీ నిలిచాయి. అయితే ప్రారంభ పదబంధాన్ని మరింత సహజమైన తెలుగులో, స్పష్టమైన కర్త-సంబంధంతో వ్యక్తం చేయడం మంచిది.
  naturalness: ‘ఆమె, ఆమె ఇంటివారు’ అనే సమన్వయం ఆధునిక తెలుగులో కొద్దిగా విరిగినట్టుగా వినిపిస్తుంది. ‘ఆమెకూ ఆమె ఇంటివారికీ బాప్తిస్మం జరిగినప్పుడు’ అనేది అర్థాన్ని మార్చకుండా మరింత సహజంగా ఉంటుంది. ‘ప్రభువుకు నమ్మకంగా ఉన్నదానినని’ కూడా ‘ప్రభువుపట్ల నమ్మకమైనదానినని’ కంటే మరింత సహజమైన అనుసంధానం.
