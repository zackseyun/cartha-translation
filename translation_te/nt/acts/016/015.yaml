id: ACT.16.15
reference: Acts 16:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς, παρεκάλεσεν λέγουσα· Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι, εἰσελθόντες εἰς τὸν οἶκόν μου ⸀μένετε· καὶ παρεβιάσατο ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/015.yaml
  text: And when she and her household were baptized[a], she urged us, saying, “If you have judged me to be faithful to the Lord, come into my house and stay.” And she prevailed upon us.
translation:
  language: te
  text: 'ఆమెకూ ఆమె ఇంటివారికీ బాప్తిస్మం జరిగినప్పుడు, ఆమె మమ్మల్ని ఇలా వేడుకుంది: “నేను ప్రభువుకు నమ్మకంగా ఉన్నదానినని[a] మీరు నిర్ణయించి ఉంటే, నా ఇంటికి వచ్చి ఉండండి.” అలా ఆమె పట్టుబట్టి మమ్మల్ని ఒప్పించింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ప్రభువును విశ్వసించినదానినని.” గ్రీకు విశేషణానికి ‘నమ్మకమైన,’ ‘విశ్వసనీయమైన,’ లేదా ‘విశ్వసించే’ అనే అర్థాలు రావచ్చు.
    reason: πιστή అనే పదంలోని విశ్వాసం, నమ్మకత్వం, విశ్వసనీయతలకు సంబంధించిన భావవిస్తృతిని కాపాడటానికి.
lexical_decisions:
- source_word: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς
  choice: ఆమె, ఆమె ఇంటివారు బాప్తిస్మం పొందినప్పుడు
  rationale: కాలసంబంధమైన ὡς δὲను సహజమైన తెలుగు వాక్యనిర్మాణంలో చూపిస్తుంది. ఏకవచన క్రియ మొదట ఆమెను సూచించినా, καὶ ὁ οἶκος αὐτῆς వల్ల ఆమెతోపాటు ఇంటివారూ బాప్తిస్మం పొందినట్లు భావం విస్తరిస్తుంది. οἶκος ఇక్కడ భవనం కాక కుటుంబ/గృహ సమూహాన్ని సూచిస్తుంది.
- source_word: παρεκάλεσεν
  choice: వేడుకుంది
  rationale: సందర్భంలో ఇది ఆహ్వానంతో కూడిన హృదయపూర్వక అభ్యర్థన. తరువాతి బలమైన పట్టుదలతో తేడాను ఉంచుతూ, ‘అడిగింది’ కంటే ‘వేడుకుంది’ తగిన బలాన్ని ఇస్తుంది.
- source_word: Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι
  choice: నేను ప్రభువుపట్ల నమ్మకమైనదానినని మీరు నిర్ణయించి ఉంటే
  rationale: κεκρίκατέలోని స్థిరమైన అంచనా భావాన్ని ‘నిర్ణయించి ఉంటే’ నిలుపుతుంది. πιστήలోని విశ్వాసం, విశ్వసనీయత, విధేయత సంబంధిత భావపరిధిని ‘నమ్మకమైనదానిని’ సాధ్యమైనంతవరకు కాపాడుతుంది.
- source_word: εἰσελθόντες εἰς τὸν οἶκόν μου μένετε
  choice: నా ఇంటికి వచ్చి ఉండండి
  rationale: ఇక్కడ οἶκος భౌతిక నివాసాన్ని సూచిస్తుంది. గ్రీకు కృదంతం తరువాతి ఆజ్ఞతో కలిసి ఆహ్వాన భావంలో ఉండటాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: καὶ παρεβιάσατο ἡμᾶς
  choice: అలా ఆమె పట్టుబట్టి మమ్మల్ని ఒప్పించింది
  rationale: παραβιάζομαιలోని గట్టి ఒత్తిడి, పట్టుదలను చూపిస్తూ, బలవంతపు నిర్బంధం అనే అతిశయార్థం రాకుండా అనువదిస్తుంది.
theological_decisions:
- issue: ఆమె ఇంటివారి బాప్తిస్మం ఆధారంగా తరువాతి బాప్తిస్మ సిద్ధాంతాలను ఊహించడం
  choice: ఆమెతోపాటు ఆమె ఇంటివారు బాప్తిస్మం పొందారనే కథనాన్ని మాత్రమే నేరుగా అనువదించడం
  alternative: ఇంటివారిలో శిశువులు ఉన్నారని గాని, అందరూ వ్యక్తిగత విశ్వాస ప్రకటన చేసినవారేనని గాని సూచించడం
  rationale: మూలపాఠం ఇంటివారి వయస్సు లేదా ప్రతి ఒక్కరి విశ్వాస స్థితిని వివరించదు. అందువల్ల ఏ తరువాతి మతశాఖాపరమైన నిర్ణయాన్నీ అనువాదంలో చేర్చలేదు.
- issue: πιστὴν అనే పదంలో విశ్వాసి/నమ్మకమైన వ్యక్తి అనే భావాల మధ్య సంబంధం
  choice: ప్రభువుపట్ల నమ్మకమైనదానిని
  alternative: ప్రభువును విశ్వసించినదానిని; ప్రభువు ఎదుట విశ్వసనీయమైనదానిని
  rationale: గ్రీకు విశేషణం విశ్వసించడం, నమ్మకంగా ఉండడం, విశ్వసనీయత అనే భావాలను కలిగి ఉండగలదు. ప్రధాన పాఠం ఒక్క భావానికే పరిమితం కాకుండా ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇంటివారు’ మరియు ‘ఇంటి’ అనే రూపాలతో ఒకే గ్రీకు పదానికి సందర్భానుసారంగా సామాజిక సమూహం, భౌతిక నివాసం అనే వేర్వేరు భావాలు స్పష్టంచేయబడ్డాయి. పాదసూచిక గుర్తు ప్రధాన పాఠంలోని సంబంధిత పదబంధం వెంట ఉంచబడింది.
