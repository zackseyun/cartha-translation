id: ACT.16.20
reference: Acts 16:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ προσαγαγόντες αὐτοὺς τοῖς στρατηγοῖς εἶπαν· Οὗτοι οἱ ἄνθρωποι ἐκταράσσουσιν ἡμῶν τὴν πόλιν Ἰουδαῖοι ὑπάρχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/020.yaml
  text: And after bringing them before the magistrates[a], they said, “These men are disturbing our city[b], being Jews,”
translation:
  language: te
  text: 'వారిని నగరాధికారుల[a] ఎదుటికి తీసుకువచ్చి, వారు ఇలా అన్నారు: “యూదులైన[b] ఈ మనుషులు మన నగరాన్ని కలవరపెడుతున్నారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రేటర్లు”; ఫిలిప్పీ వంటి రోమా వలసనగరాల్లోని పౌర పరిపాలనాధికారులు.
    reason: cultural_note
  - marker: b
    text: లేదా “యూదయవారు.” ఇక్కడ జాతి-మత సంబంధమైన ఆరోపణను సూచించే “యూదులు” మరింత సముచితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγαγόντες
  choice: ఎదుటికి తీసుకువచ్చి
  rationale: అనంతర క్రియకు ముందు జరిగిన చర్యను సూచించే భూతకాల అసమాపక క్రియారూపాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: στρατηγοῖς
  choice: నగరాధికారుల
  rationale: రోమా వలసపట్టణమైన ఫిలిప్పీలో పౌరపాలన నిర్వహించిన ఉన్నత అధికారులను సూచిస్తుంది; సాంకేతిక పదం కంటే ఇది సాధారణ పాఠకులకు స్పష్టం.
- source_word: ἐκταράσσουσιν
  choice: కలవరపెడుతున్నారు
  rationale: నగరంలో తీవ్రమైన అశాంతి లేదా గందరగోళం కలిగిస్తున్నారనే ఆరోపణను, గ్రీకు వర్తమానకాల భావంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἡμῶν τὴν πόλιν
  choice: మన నగరాన్ని
  rationale: ἡμῶν లోని పౌరస్వామ్య, భావోద్వేగ ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: Ἰουδαῖοι
  choice: యూదులైన
  rationale: ఈ సందర్భంలో భౌగోళిక మూలం కంటే జాతి-మత గుర్తింపును ఆధారంగా చేసుకున్న ఆరోపణకు ఇది సరిపోతుంది.
- source_word: ὑπάρχοντες
  choice: -లైన
  rationale: యూదులుగా ఉండడాన్ని ఆరోపణతో సంక్షిప్తంగా అనుసంధానించే గ్రీకు అసమాపక క్రియారూపాన్ని తెలుగులో విశేషణరూపంగా నిలుపుతుంది.
- source_word: Οὗτοι οἱ ἄνθρωποι
  choice: ఈ మనుషులు
  rationale: పౌలు, సీల అనే నిర్దిష్ట పురుషులను సూచిస్తూ మూలంలోని పదబంధాన్ని నేరుగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: వైరభావంతో చేసిన జాతి-మత ఆరోపణలో Ἰουδαῖοι అనువాదం
  choice: యూదులు
  alternative: యూదయవారు
  rationale: ఫిలిప్పీ సందర్భంలో ఈ పదం కేవలం యూదయ ప్రాంతానికి చెందినవారిని కాక, యూద జాతి-మత గుర్తింపుగలవారిని సూచించడం ఎక్కువ సంభావ్యం. ఇది ఆరోపణదారుల మాటగా నివేదించబడింది; యూదులందరిపై కథకుడి తీర్పుగా కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన వాక్యనిర్మాణం. గ్రీకు వాక్యంలోని ఆరోపణ స్వరాన్ని నిలిపి, దానిని కథకుడి అభిప్రాయంగా మార్చలేదు.
