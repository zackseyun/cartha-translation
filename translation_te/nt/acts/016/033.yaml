source:
  edition: SBLGNT
  text: καὶ παραλαβὼν αὐτοὺς ἐν ἐκείνῃ τῇ ὥρᾳ τῆς νυκτὸς ἔλουσεν ἀπὸ τῶν πληγῶν, καὶ ἐβαπτίσθη αὐτὸς καὶ οἱ αὐτοῦ ⸀πάντες παραχρῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/033.yaml
  text: And taking them in that hour of the night[a], he washed their wounds, and he was baptized at once[c][b], he and all his household.
translation:
  language: te
  text: ఆ రాత్రి ఆ సమయాన అతడు వారిని తనతో తీసుకొని, వారి గాయాలను కడిగాడు.[a] వెంటనే అతడూ అతని ఇంటివారందరూ బాప్తిస్మం పొందారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘గాయాలనుండి వారిని కడిగాడు’; భావం, వారి గాయాలను శుభ్రం చేశాడు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఇంటివారందరూ’ అంటే అతని గృహ పరిధికి చెందిన వారందరూ; ‘అతని కుటుంబమంతా’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: παραλαβὼν
  choice: వారిని తీసుకెళ్లి
  rationale: అయోరిస్ట్ కృదంతం కడగడానికి ముందు జరిగిన చర్యను సూచిస్తుంది. సందర్భం ప్రకారం వారిని తనతో తీసుకెళ్లాడనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; గమ్యస్థానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ τῆς νυκτός
  choice: ఆ రాత్రి ఆ సమయంలోనే
  rationale: చర్య రాత్రివేళ ఆలస్యం చేయకుండా జరిగిందనే కాలసంబంధమైన స్పష్టతను, తక్షణత్వాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: ἔλουσεν ἀπὸ τῶν πληγῶν
  choice: వారి గాయాలను కడిగాడు
  rationale: గ్రీకు నిర్మాణం అక్షరార్థంగా ‘గాయాలనుండి కడిగాడు’ అన్నట్లున్నా, ఇక్కడ గాయాలను శుభ్రం చేశాడనే సందర్భార్థం ఉంది. ఈ తెలుగు రూపం ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἐβαπτίσθη
  choice: బాప్తిస్మం పొందారు
  rationale: కర్మణి క్రియను నిలుపుతూ, బాప్తిస్మ విధానాన్ని ప్రత్యేకంగా నిర్దేశించకుండా ప్రామాణిక క్రైస్తవ పదాన్ని ఉపయోగిస్తుంది.
- source_word: οἱ αὐτοῦ πάντες
  choice: అతని ఇంటివారందరూ
  rationale: అతని గృహ పరిధికి చెందిన వారందరినీ సూచించే విస్తృత భావాన్ని ఇస్తుంది; కేవలం అణుకుటుంబానికి పరిమితం చేయదు.
- source_word: παραχρῆμα
  choice: వెంటనే
  rationale: ఆలస్యం లేకుండా తక్షణమే జరిగిన చర్యను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: οἱ αὐτοῦ πάντες అనే పదబంధం మరియు బాప్తిస్మం పొందినవారి పరిధి
  choice: ‘అతని ఇంటివారందరూ’ అని అనువదించి, వారి వయస్సు, వ్యక్తిగత విశ్వాస ప్రకటన లేదా బాప్తిస్మ విధానాన్ని పేర్కొనలేదు.
  alternative: ‘అతని కుటుంబమంతా’ లేదా ‘అతనివారందరూ’
  rationale: మూలవచనం చెరసాల అధికారి మరియు అతని గృహ పరిధిలోని వారందరూ బాప్తిస్మం పొందారని చెబుతుంది; కానీ తరువాతి శిశు బాప్తిస్మం లేదా బాప్తిస్మ విధానం గురించిన వివాదాలను ఈ వచనం స్వయంగా పరిష్కరించదు. అందువల్ల ఆ అంశాలను అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘బాప్తిస్మం’ అనే విస్తృతంగా అర్థమయ్యే పదాన్ని వాడి, దాని విధానంపై ఏ సంఘసంప్రదాయ అభిప్రాయాన్నీ చేర్చలేదు. మూలంలోని చర్యల క్రమం—తీసుకెళ్లడం, గాయాలు కడగడం, వెంటనే బాప్తిస్మం పొందడం—నిలుపబడింది.
