source:
  edition: SBLGNT
  text: Κατὰ δὲ τὸ μεσονύκτιον Παῦλος καὶ Σιλᾶς προσευχόμενοι ὕμνουν τὸν θεόν, ἐπηκροῶντο δὲ αὐτῶν οἱ δέσμιοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/025.yaml
  text: About midnight Paul and Silas were praying and singing hymns to God[a], and the prisoners were listening to them.
translation:
  language: te
  text: దాదాపు అర్ధరాత్రి సమయంలో పౌలు, సీల ప్రార్థిస్తూ దేవునికి స్తోత్రగీతాలు పాడుతూ ఉన్నారు; ఖైదీలు వారిని వింటూ ఉన్నారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఖైదీలు వారిని శ్రద్ధగా వింటూ ఉన్నారు.” గ్రీకు క్రియ శ్రద్ధగా లేదా ఆసక్తిగా వినడం అనే భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ δὲ τὸ μεσονύκτιον
  choice: అర్ధరాత్రి సమయంలో
  rationale: κατά + కాలాన్ని సూచించే ద్వితీయా విభక్తి ఇక్కడ అర్ధరాత్రి సమీప కాలాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘అర్ధరాత్రి సమయంలో’ సహజంగా ఉండి, అనవసరమైన ఖచ్చితత్వాన్ని మోపదు; δέ యొక్క స్వల్ప అనుసంధాన భావం సందర్భంలోనే వ్యక్తమవుతుంది.
- source_word: Παῦλος καὶ Σιλᾶς
  choice: పౌలు, సీలలు
  rationale: వ్యక్తినామాలకు తెలుగులో స్థిరంగా వాడుకలో ఉన్న లిప్యంతరీకరణలు; సంయుక్త కర్తగా సహజమైన తెలుగు రూపం.
- source_word: προσευχόμενοι
  choice: ప్రార్థిస్తూ
  rationale: వర్తమాన కృదంతం ప్రధాన క్రియతో సమకాలీనంగా కొనసాగుతున్న కార్యాన్ని సూచిస్తుంది. ‘ప్రార్థిస్తూ’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὕμνουν τὸν θεόν
  choice: దేవునికి స్తోత్రగీతాలు పాడుతున్నారు
  rationale: ὑμνέω దేవుని స్తుతించే గీతాలు పాడడాన్ని ప్రత్యేకంగా సూచిస్తుంది. అపూర్ణ భూతకాలంలోని కొనసాగుతున్న చర్యను తెలుగు కథన శైలిలో ‘పాడుతున్నారు’ వ్యక్తం చేస్తుంది.
- source_word: ἐπηκροῶντο
  choice: శ్రద్ధగా చెవియొగ్గుతున్నారు
  rationale: ఈ క్రియ కేవలం వినడమే కాక ఆసక్తితో లేదా శ్రద్ధతో వినడాన్ని సూచించగలదు. ‘శ్రద్ధగా చెవియొగ్గుతున్నారు’ దాని కొనసాగుతున్న, శ్రద్ధాపూర్వక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: οἱ δέσμιοι
  choice: ఖైదీలు
  rationale: బంధింపబడినవారు లేదా చెరలో ఉన్నవారిని సూచించే పదానికి ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమానార్థకం.
