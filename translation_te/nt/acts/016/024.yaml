source:
  edition: SBLGNT
  text: ὃς παραγγελίαν τοιαύτην ⸀λαβὼν ἔβαλεν αὐτοὺς εἰς τὴν ἐσωτέραν φυλακὴν καὶ τοὺς πόδας ⸂ἠσφαλίσατο αὐτῶν⸃ εἰς τὸ ξύλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/024.yaml
  text: He[a], having received such an order[b], threw them into the inner prison and secured their feet in the stocks.
translation:
  language: te
  text: అతడు అలాంటి ఆజ్ఞను అందుకొని, వారిని లోపలి చెరసాలలోకి[a] తోసివేసి, వారి కాళ్లను కొయ్యతో చేసిన బంధకంలో[b] బిగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అత్యంత లోపలి చెరసాలలోకి.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘కొయ్యలోకి’; సందర్భంలో ఇది కాళ్లను కదలనివ్వకుండా బిగించే కొయ్య నిర్బంధ పరికరాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: παραγγελίαν τοιαύτην
  choice: అలాంటి ఆజ్ఞను
  rationale: παραγγελία అధికారికంగా ఇచ్చిన ఆజ్ఞ లేదా ఆదేశాన్ని సూచిస్తుంది. సందర్భంలో చెరసాల అధికారికి అందిన కఠిన నిర్బంధ ఆదేశానికి ‘ఆజ్ఞ’ సహజంగా సరిపోతుంది.
- source_word: λαβὼν
  choice: అందుకొని
  rationale: ఈ భూతకాల కృదంతం ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను తెలియజేస్తుంది; ‘అందుకొని’ ఆ సంబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἔβαλεν
  choice: తోసివేసి
  rationale: βάλλωలోని బలవంతపు, కఠిన చర్య భావాన్ని ‘ఉంచి’ కంటే ‘తోసివేసి’ స్పష్టంగా ప్రతిబింబిస్తుంది; కొట్టబడిన ఖైదీల పట్ల జరిగిన కఠిన వ్యవహారానికి ఇది సందర్భోచితం.
- source_word: ἐσωτέραν φυλακήν
  choice: లోపలి చెరసాలలోకి
  rationale: ἐσωτέραν మరింత లోపల ఉన్న, భద్రమైన కారాగార భాగాన్ని సూచిస్తుంది. ‘లోపలి చెరసాల’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని తులనాత్మక భావాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: ἠσφαλίσατο
  choice: బిగించాడు
  rationale: ἀσφαλίζω ఇక్కడ కదలకుండా గట్టిగా బంధించడం లేదా భద్రపరచడం అనే అర్థంలో ఉంది. కాళ్లను నిర్బంధ పరికరంలో పెట్టిన సందర్భంలో ‘బిగించాడు’ సహజమైన ఎంపిక.
- source_word: τοὺς πόδας αὐτῶν
  choice: వారి కాళ్లను
  rationale: πούς ప్రాథమికంగా పాదాన్ని సూచించినా, తెలుగులో ఇలాంటి నిర్బంధ సందర్భంలో ‘వారి కాళ్లను’ అనడం సాధారణం మరియు స్పష్టంగా ఉంటుంది.
- source_word: εἰς τὸ ξύλον
  choice: కొయ్య బంధకంలో
  rationale: ξύλον అక్షరార్థంగా ‘కొయ్య’ లేదా ‘కొయ్యతో చేసిన వస్తువు.’ ఈ చెరసాల సందర్భంలో కాళ్లను బిగించే కొయ్య పరికరాన్ని సూచిస్తుంది; ‘కొయ్య బంధకం’ అర్థాన్ని సహజంగా తెలియజేస్తూ పదార్థాన్ని కూడా నిలుపుతుంది.
