translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని కఠిన చర్య భావాన్ని ‘తోసివేసి,’ ‘బిగించాడు’ అనే పదాలతో నిలుపుతూ, ξύλονకు సందర్భానుగుణమైన ‘కొయ్య బంధకం’ ఉపయోగించబడింది. అందించిన ఆంగ్ల పాఠ్యంలో పాదసూచిక గుర్తుల స్థానాలు వాటి విషయంతో సరిపోలకపోవడంతో, [a]ను ‘లోపలి చెరసాల’ వద్ద మరియు [b]ను ‘కొయ్య బంధకం’ వద్ద ఉంచాం.
