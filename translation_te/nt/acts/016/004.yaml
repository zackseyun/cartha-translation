id: ACT.16.4
reference: Acts 16:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς δὲ διεπορεύοντο τὰς πόλεις, ⸀παρεδίδοσαν αὐτοῖς φυλάσσειν τὰ δόγματα τὰ κεκριμένα ὑπὸ τῶν ἀποστόλων ⸀καὶ πρεσβυτέρων τῶν ἐν ⸀Ἱεροσολύμοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/004.yaml
  text: As they went through the cities[a], they delivered to them for observance the decrees that had been decided by the apostles and elders in Jerusalem.
translation:
  language: te
  text: వారు పట్టణాల గుండా వెళ్తూ ఉండగా, యెరూషలేములో ఉన్న అపొస్తలులూ పెద్దలూ నిర్ణయించిన తీర్మానాలను పాటించడానికి వారికి అందజేస్తూ ఉండేవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తీర్మానాలు’ అనే పదానికి ‘నిర్ణయాలు’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం ‘డోగ్మటా’; ఇది యెరూషలేము సమావేశంలో చేసిన అధికారిక నిర్ణయాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπορεύοντο
  choice: పట్టణాల గుండా వెళ్తూ
  rationale: అసంపూర్ణ భూతకాల రూపం అనేక పట్టణాల గుండా కొనసాగిన ప్రయాణాన్ని సూచిస్తుంది; ఈ తెలుగు ప్రయోగం ఆ కొనసాగుతున్న కదలికను సహజంగా తెలియజేస్తుంది.
- source_word: παρεδίδοσαν
  choice: అందజేశారు
  rationale: అధికారికంగా నిర్ణయాలను అప్పగించి తెలియజేయడం అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτοῖς
  choice: అక్కడి వారికి
  rationale: గ్రీకులో సర్వనామమే ఉంది. తెలుగులో సూచన స్పష్టంగా ఉండేందుకు స్థలసంబంధమైన ‘అక్కడి’ చేర్చబడింది; ‘విశ్వాసులు’ లేదా ‘సంఘాలు’ అని మూలంలో లేని నామవాచకాన్ని నేరుగా చేర్చలేదు.
- source_word: φυλάσσειν
  choice: పాటించడానికి
  rationale: ఇక్కడ కాపాడటం కాదు, అధికారిక నిర్ణయాలకు కట్టుబడి వాటిని ఆచరించడం భావం.
- source_word: δόγματα
  choice: తీర్మానాలు
  rationale: యెరూషలేము సమావేశంలో అధికారికంగా తీసుకున్న నిర్ణయాలను సూచిస్తుంది. ‘తీర్మానాలు’ అధికారిక బలాన్ని నిలుపుతూ, తరువాతి కాలపు సాంకేతిక ‘డాగ్మా’ భావాన్ని రుద్దదు.
- source_word: κεκριμένα
  choice: నిర్ణయించిన
  rationale: ఇప్పటికే తీసుకోబడి అమలులో ఉన్న నిర్ణయాలనే సూచిస్తుంది; తెలుగు సంబంధ క్రియారూపం వాక్యంలో సహజంగా సరిపోతుంది.
- source_word: ἀποστόλων καὶ πρεσβυτέρων
  choice: అపొస్తలులు, పెద్దలు
  rationale: అపొస్తలులు అనే స్థిరమైన బైబిలు పదాన్ని, గుర్తింపు పొందిన నాయకులకు సహజమైన ‘పెద్దలు’ అనే పదాన్ని ఉపయోగిస్తుంది. గ్రీకులోని రెండు వర్గాలనూ సమానంగా ఉంచుతుంది.
- source_word: τῶν ἐν Ἱεροσολύμοις
  choice: యెరూషలేములోని
  rationale: ఈ పదబంధం అపొస్తలులు, పెద్దలు ఇద్దరినీ యెరూషలేములో ఉన్నవారిగా గుర్తిస్తుంది.
- source_word: ὡς δὲ
  choice: వారు … వెళ్తూ
  rationale: కథన పురోగతితో కూడిన సమకాలిక చర్యను తెలుగులో సహజమైన ‘వెళ్తూ’ నిర్మాణం ద్వారా తెలిపింది.
theological_decisions:
- issue: యెరూషలేము సమావేశ తీర్మానాల అధికారం
  choice: ‘తీర్మానాలు’ అని అనువదించడం
  alternative: ‘ఆదేశాలు’ లేదా ‘నిర్ణయాలు’
  rationale: సందర్భంలో ఇవి సామూహికంగా నిర్ణయించబడిన, పాటించవలసిన అధికారిక తీర్మానాలు. ‘ఆదేశాలు’ పై నుంచి వచ్చిన ఏకపక్ష ఆజ్ఞ భావాన్ని ఎక్కువ చేయవచ్చు; ‘నిర్ణయాలు’ వాటి అధికారిక బలాన్ని కొంత తగ్గించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘అందజేశారు’, ‘పాటించడానికి’, ‘తీర్మానాలు’ పరిపాలనా సందర్భంలోని అధికారికతను నిలుపుతాయి. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
