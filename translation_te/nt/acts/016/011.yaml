  text: So[a], after putting out to sea from Troas, we sailed straight to Samothrace, and on the following day to Neapolis,
translation:
  language: te
  text: కాబట్టి, త్రోయ నుండి ఓడలో బయలుదేరి[a], మేము నేరుగా సమోత్రాకేకు ప్రయాణించాము, మరుసటి రోజు నెయాపొలికి చేరుకున్నాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “త్రోయ నుండి ఓడ ప్రయాణం ప్రారంభించి.”
    reason: Ἀναχθέντες అనే నౌకాయాన పదానికి ఉన్న సహజమైన ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: ఓడలో బయలుదేరి
  rationale: నౌకాయాన సందర్భంలో ἀνάγω సముద్రంలోకి బయలుదేరడం లేదా ఓడ ప్రయాణం ప్రారంభించడం అనే అర్థం ఇస్తుంది. తెలుగు వాక్యంలో కృదంత క్రమాన్ని సహజంగా నిలుపుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: οὖν ముందటి సంఘటనకు అనుసంధానమైన కథన పురోగతిని లేదా ఫలితాన్ని సూచిస్తుంది; ‘కాబట్టి’ ఆ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀπὸ Τρῳάδος
  choice: త్రోయ నుండి
  rationale: ἀπό బయలుదేరిన స్థలాన్ని సూచిస్తుంది. Τρῳάς అనే స్థలనామానికి గ్రీకు ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణను వాడాం.
- source_word: εὐθυδρομήσαμεν
  choice: మేము నేరుగా … ప్రయాణించాము
  rationale: ఈ క్రియ ఓడలో సూటిగా లేదా నేరుగా ప్రయాణించడాన్ని సూచిస్తుంది. ముందు వచ్చిన ‘ఓడలో’ అనే మాట వల్ల నౌకాయాన భావం స్పష్టంగా ఉంది.
- source_word: εἰς Σαμοθρᾴκην
  choice: సమొత్రాకేకు
  rationale: εἰς గమ్యస్థానాన్ని సూచిస్తుంది; స్థలనామాన్ని గ్రీకు రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: τῇ δὲ ἐπιούσῃ
  choice: మరుసటి రోజు
  rationale: ఈ కాలవాచక దత్తి పదబంధం తరువాతి రోజును సూచిస్తుంది; δέ తెలిపే కథన కొనసాగింపు తెలుగులో సహజమైన వాక్య అనుసంధానం ద్వారా వ్యక్తమైంది.
- source_word: εἰς Νέαν Πόλιν
  choice: నెయాపొలికి చేరుకున్నాము
  rationale: εἰς గమ్యాన్ని సూచిస్తుంది. Νέα Πόλις‌ను అర్థానువాదం చేయకుండా స్థలనామంగా లిప్యంతరీకరించాం. రెండవ భాగంలో గ్రీకులో క్రియ అధ్యాహారంగా ఉన్నందున, తెలుగులో పూర్తి భావం కోసం ‘చేరుకున్నాము’ చేర్చాం.
