id: ACT.16.40
reference: Acts 16:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐξελθόντες δὲ ⸀ἀπὸ τῆς φυλακῆς εἰσῆλθον πρὸς τὴν Λυδίαν, καὶ ἰδόντες ⸂παρεκάλεσαν τοὺς ἀδελφοὺς⸃ καὶ ἐξῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/040.yaml
  text: After they came out of the prison[a], they went to Lydia, and when they saw the brothers, they encouraged them and departed.
translation:
  language: te
  text: వారు చెరసాల నుండి బయటికి వచ్చి లూదియ దగ్గరికి వెళ్లారు. సహోదరులను[a] చూసి, వారిని ప్రోత్సహించి, బయలుదేరారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సహోదర సహోదరీలను.” గ్రీకు పదం పుంలింగ బహువచనంలో ఉన్నప్పటికీ, స్త్రీపురుషులతో కూడిన తోటి విశ్వాసుల సమూహాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες δὲ ἀπὸ τῆς φυλακῆς
  choice: వారు చెరసాల నుండి బయటికి వచ్చి
  rationale: Aorist participleను ప్రధాన క్రియకు ముందున్న చర్యగా సహజమైన తెలుగు సంయుక్త క్రియతో వ్యక్తం చేశాం; నిర్దిష్టమైన φυλακήను ‘చెరసాల’గా అనువదించాం.
- source_word: εἰσῆλθον πρὸς τὴν Λυδίαν
  choice: లుదియ దగ్గరికి వెళ్లారు
  rationale: πρὸς τὴν Λυδίαν వ్యక్తి దగ్గరికి వెళ్లడాన్ని సూచిస్తుంది. మూలంలో స్పష్టంగా లేని ‘ఇల్లు’ను చేర్చకుండా, తెలుగులో సహజంగా ‘దగ్గరికి వెళ్లారు’ అని ఇచ్చాం.
- source_word: ἰδόντες
  choice: అక్కడ ... చూసి
  rationale: Aorist participleను తరువాతి చర్యకు ముందున్న సంఘటనగా ‘చూసి’ అని ఇచ్చాం; సందర్భ ప్రవాహం కోసం ‘అక్కడ’ చేర్చడం స్థల సంబంధాన్ని స్పష్టం చేస్తుంది, కొత్త సంఘటనను జోడించదు.
- source_word: παρεκάλεσαν
  choice: ప్రోత్సహించి
  rationale: παρακαλέω ఇక్కడ ఆదరించడం, ధైర్యపరచడం, బలపరచడం వంటి విస్తృత భావాన్ని కలిగి ఉంది. ‘ప్రోత్సహించి’ దానిని అనవసరంగా ఒకే భావానికి పరిమితం చేయదు.
- source_word: τοὺς ἀδελφούς
  choice: సహోదరులను
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని నిలుపుతూ, తోటి విశ్వాసులను సూచించే సంఘపరమైన తెలుగు పదాన్ని వాడాం; మిశ్రమ లింగ సమూహాన్ని కూడా సూచించగలదనే విషయాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: ἐξῆλθαν
  choice: బయలుదేరి వెళ్లారు
  rationale: చివరి exit/departure క్రియను మొదటి ‘బయటికి వచ్చి’తో గందరగోళం లేకుండా, తెలుగు కథన శైలిలో సహజంగా వ్యక్తం చేశాం.
theological_decisions:
- issue: మిశ్రమ లింగ విశ్వాసుల సమూహాన్ని సూచించగల ἀδελφοί అనువాదం
  choice: సహోదరులను
  alternative: సహోదర సహోదరీలను; విశ్వాసులను
  rationale: మూలంలోని వ్యాకరణపరమైన పుంలింగ బహువచనాన్ని ప్రధాన పాఠ్యంలో ప్రతిబింబించాం. అయితే లుదియతో కూడిన సందర్భంలో స్త్రీలు కూడా ఉద్దేశించబడి ఉండవచ్చు కాబట్టి, ఆ సమావేషక భావాన్ని పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘లుదియ ఇంటికి’ అని మూలంలో లేని స్థలాన్ని స్పష్టీకరించకుండా, ‘లుదియ దగ్గరికి’ అని మూలానికి దగ్గరగా ఉంచాం.
