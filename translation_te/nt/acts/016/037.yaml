id: ACT.16.37
reference: Acts 16:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Παῦλος ἔφη πρὸς αὐτούς· Δείραντες ἡμᾶς δημοσίᾳ ἀκατακρίτους, ἀνθρώπους Ῥωμαίους ὑπάρχοντας, ἔβαλαν εἰς φυλακήν· καὶ νῦν λάθρᾳ ἡμᾶς ἐκβάλλουσιν; οὐ γάρ, ἀλλὰ ἐλθόντες αὐτοὶ ⸀ἡμᾶς ἐξαγαγέτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/037.yaml
  text: But Paul said to them[a], “After beating us publicly without trial, though we are Roman citizens, they threw us into prison; and now are they sending us out secretly? No indeed! Rather[c][b], let them come themselves and lead us out.”
translation:
  language: te
  text: 'అయితే పౌలు వారితో ఇలా అన్నాడు: “రోమా పౌరులమైన మమ్మల్ని నేరస్థులుగా తీర్పు తీర్చకుండానే[a] బహిరంగంగా కొట్టి చెరసాలలో వేశారు. ఇప్పుడు రహస్యంగా మమ్మల్ని బయటికి పంపిస్తున్నారా? ఎంతమాత్రమూ కాదు! వారే స్వయంగా వచ్చి మమ్మల్ని బయటికి తీసుకెళ్లాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దోషులుగా నిర్ధారించకుండానే”; గ్రీకు పదం న్యాయపరంగా నేరస్థులని తీర్పు ఇవ్వబడకపోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δείραντες
  choice: కొట్టించి
  rationale: అధికారులు స్వయంగా కొట్టినట్లు కాక, తమ ఆదేశంతో కొట్టించిన సందర్భాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; మూల క్రియ సూచించే దెబ్బలు కొట్టడాన్ని ‘కొరడాలతో కొట్టడం’గా మరీ నిర్దిష్టం చేయదు.
- source_word: δημοσίᾳ
  choice: బహిరంగంగా
  rationale: ప్రజల ఎదుట జరిగిన చర్య అనే క్రియావిశేషణార్థాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: ἀκατακρίτους
  choice: నేరస్థులుగా తీర్పు తీర్చకుండానే
  rationale: న్యాయపరంగా దోషులని నిర్ధారించకుండానే శిక్షించారనే ప్రధాన భావాన్ని స్పష్టంగా అందిస్తుంది; ‘విచారణ లేకుండా’ కంటే గ్రీకు పదానికి మరింత నేరుగా సరిపోతుంది.
- source_word: ἀνθρώπους Ῥωμαίους ὑπάρχοντας
  choice: రోమా పౌరులమైన మమ్మల్ని
  rationale: ఇక్కడ ప్రాధాన్యం వారి జాతికి కాక, రోమా పౌరసత్వం వల్ల కలిగిన చట్టపరమైన హోదాకు ఉంది. తెలుగు వాక్య నిర్మాణంలో ‘మమ్మల్ని’తో కలిపి సహజంగా ఉంటుంది.
- source_word: ἔβαλαν εἰς φυλακήν
  choice: చెరసాలలో వేశారు
  rationale: βάλλω యొక్క బలమైన స్వరాన్ని నిలుపుతూ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: λάθρᾳ
  choice: రహస్యంగా
  rationale: ఇతరులకు తెలియకుండా, గుట్టుగా చేయడమనే భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ἐκβάλλουσιν
  choice: బయటికి పంపిస్తున్నారా
  rationale: చెరసాల నుంచి గుట్టుగా పంపివేయాలనే సందర్భార్థాన్ని సహజంగా తెలుపుతుంది; ప్రశ్నలోని వర్తమాన చర్యను నిలుపుతుంది.
- source_word: οὐ γάρ
  choice: ఎంతమాత్రమూ కాదు!
  rationale: పౌలు చేసిన దృఢమైన, emphatic నిరాకరణను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐλθόντες αὐτοὶ
  choice: వారే స్వయంగా వచ్చి
  rationale: అధికారులే వ్యక్తిగతంగా రావాలన్న αὐτοὶ యొక్క ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἡμᾶς ἐξαγαγέτωσαν
  choice: మమ్మల్ని బయటికి తీసుకెళ్లాలి
  rationale: మూడవ పురుష ఆజ్ఞార్థక భావాన్ని తెలుగులో దృఢమైన విధిగా తెలుపుతూ, ‘వెలుపలికి నడిపించడం/తీసుకురావడం’ అనే ἐξάγω భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: పౌలు ప్రస్తావించిన రోమా హోదా యొక్క చట్టపరమైన భావం
  choice: రోమా పౌరులు
  alternative: రోమీయులు
  rationale: సందర్భం వారి జాతి లేదా నివాసస్థలాన్ని కాక, విచారణ లేకుండా శిక్షించరాదనే చట్టపరమైన రక్షణలు కలిగిన పౌర హోదాను సూచిస్తుంది.
- issue: ἀκατακρίτους యొక్క న్యాయపరమైన భావం
  choice: నేరస్థులుగా తీర్పు తీర్చకుండానే
  alternative: విచారణ చేయకుండానే
  rationale: గ్రీకు పదం ప్రధానంగా న్యాయస్థాన తీర్పుతో దోషులుగా నిర్ధారించబడకపోవడాన్ని సూచిస్తుంది. పాఠంలోని అన్యాయాన్ని స్పష్టంగా ఉంచుతూ, విచారణ అసలే జరగలేదని పదం ఒక్కటే నిర్బంధంగా చెప్పినట్లు చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. చట్టపరమైన సందర్భం సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ‘రోమా పౌరులు’ అని వాడాం. పౌలు నిరసనలోని దృఢత్వాన్ని నిలుపుతూ అనవసరంగా న్యాయపరిభాషను పెంచలేదు.
