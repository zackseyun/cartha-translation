source:
  edition: SBLGNT
  text: ἐφώνησεν δὲ ⸂φωνῇ μεγάλῃ ὁ Παῦλος⸃ λέγων· Μηδὲν πράξῃς σεαυτῷ κακόν, ἅπαντες γάρ ἐσμεν ἐνθάδε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/028.yaml
  text: But Paul shouted with a loud voice[a], saying, “Do not do yourself any harm, for we are all here.”
translation:
  language: te
  text: 'కానీ పౌలు పెద్ద స్వరంతో ఇలా కేకవేశాడు: “నీకు నీవు ఏ హానీ చేసుకోవద్దు[a]. ఎందుకంటే మేమందరం ఇక్కడే ఉన్నాం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీకు నీవు ఏ చెడూ చేసుకోవద్దు.” గ్రీకు మాటలు అక్షరాలా విస్తృతార్థంలో “నీకు నీవు ఏ చెడూ చేసుకోవద్దు” అని ఉన్నాయి; అయితే ఈ సందర్భంలో చెరసాల అధికారి తనకు తాను హాని చేసుకోబోవడాన్నే అవి సూచిస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφώνησεν ... φωνῇ μεγάλῃ
  choice: బిగ్గరగా కేకవేసి
  rationale: అత్యవసర పరిస్థితిలో పౌలు చేసిన బలమైన, పెద్ద స్వరంలోని పిలుపును సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: δὲ
  choice: కానీ
  rationale: మునుపటి వచనంలో చెరసాల అధికారి చేయబోయిన పనికి పౌలు అడ్డుపడిన వ్యతిరేక మలుపును సూచిస్తుంది.
- source_word: λέγων
  choice: అన్నాడు
  rationale: క్రియావిశేషణ రూపాన్ని తెలుగులో సహజమైన ప్రత్యక్ష సంభాషణ నిర్మాణంగా మార్చి, మాటల విషయాన్ని పరిచయం చేస్తుంది.
- source_word: Μηδὲν πράξῃς σεαυτῷ κακόν
  choice: నీకు నీవు ఏ హానీ చేసుకోవద్దు
  rationale: మూలంలోని ప్రతిబింబార్థాన్నీ, κακόν అనే విస్తృత పదాన్నీ నిలుపుతూ, తనను తాను గాయపరచుకోబోతున్న సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: ἅπαντες
  choice: మేమందరం
  rationale: అక్కడున్న వారిలో ఒక్కరూ తప్పిపోలేదనే సంపూర్ణతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: చెరసాల అధికారి తనకు హాని చేసుకోకూడదనే ఆజ్ఞకు కారణాన్ని స్పష్టంగా కలుపుతుంది.
- source_word: ἐνθάδε
  choice: ఇక్కడే
  rationale: స్థలాన్ని సూచించడంతో పాటు, ఎవరూ పారిపోలేదనే సందర్భోచిత నొక్కిచెప్పడాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ὁ Παῦλος
  choice: పౌలు
  rationale: వ్యక్తి పేరుకు ప్రామాణిక తెలుగు లిప్యంతరీకరణను ఉపయోగిస్తుంది.
