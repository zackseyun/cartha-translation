  text: He was well spoken of by the brothers in Lystra and Iconium[a].
translation:
  language: te
  text: లుస్త్రలోను ఇకొనియలోను ఉన్న సహోదరులు[a] అతని గురించి మంచి సాక్ష్యం ఇచ్చేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సహోదర సహోదరీలు”; అంటే ఆ ప్రాంతాల్లోని తోటి విశ్వాసులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: అతని గురించి
  rationale: ఈ సంబంధ సర్వనామం మునుపటి వచనంలోని తిమోతిని సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ‘అతని గురించి’ అని చెప్పడం సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἐμαρτυρεῖτο
  choice: మంచిగా సాక్ష్యమిచ్చేవారు
  rationale: అసంపూర్ణ భూతకాల కర్మణి రూపం ఇతరులు అతని గురించి అనుకూలమైన సాక్ష్యం ఇస్తూ ఉండేవారని సూచిస్తుంది; ఈ తెలుగు ప్రయోగం మంచి పేరుతో పాటు వ్యక్తిగత సాక్ష్య భావాన్నీ నిలుపుతుంది.
- source_word: ὑπὸ
  choice: సహోదరులు ... సాక్ష్యమిచ్చేవారు
  rationale: కర్మణి వాక్యంలో వ్యక్తిగత కర్తను సూచించే ὑπό భావాన్ని తెలుగులో సహజమైన కర్తరి నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: τῶν ἐν Λύστροις καὶ Ἰκονίῳ
  choice: లుస్త్రలో, ఈకొనియలో ఉన్న
  rationale: ఈ పదబంధం ఆ సహోదరులు ఆ రెండు పట్టణాల్లో ఉన్నవారని తెలియజేస్తుంది; రెండు స్థానాలనూ నేరుగా, సంక్షిప్తంగా ఉంచాం.
- source_word: ἀδελφῶν
  choice: సహోదరులు
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పుంలింగ బహువచనం. ‘సహోదరులు’ దాని రూపాన్ని నిలుపుతూ, సంఘంలోని తోటి విశ్వాసులను సూచించే అవకాశం పాదటిప్పణిలో వివరిస్తుంది.
theological_decisions:
- issue: క్రైస్తవ సమాజాన్ని సూచించే ἀδελφῶν పదంలోని లింగార్థం
  choice: సహోదరులు
  alternative: సహోదర సహోదరీలు; తోటి విశ్వాసులు
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం; అయితే ఈ సంబోధన అక్కడి స్త్రీపురుష విశ్వాసులందరినీ సూచించవచ్చనే విస్తృతార్థాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రచించబడింది. ‘మంచిగా సాక్ష్యమిచ్చేవారు’ అనే ప్రయోగం ἐμαρτυρεῖτο లోని అనుకూల సాక్ష్యం మరియు కొనసాగుతున్న పేరు అనే రెండు భావాలనూ సాధ్యమైనంతవరకు నిలుపుతుంది.
