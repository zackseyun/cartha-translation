  terminology: “దండధారులు” suitably preserves ῥαβδοῦχοι, while “నగరాధికారులు” is an accessible rendering of στρατηγοί. “రోమీయులు” faithfully reflects the Greek; the footnote appropriately notes the contextual implication of Roman citizenship.
  issues:
  - severity: medium
    issue: The main text adds the names “పౌలు, సీలలు.”
    rationale: Neither name occurs in Acts 16:38 in the Greek. The referents are recoverable from context, but the translation should not make them explicit in this verse when a natural Telugu construction can preserve the source's contextual reference.
  - severity: low
