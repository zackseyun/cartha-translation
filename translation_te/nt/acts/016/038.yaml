translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘దండధారులు’ అనే పదం మూలంలోని సాంస్కృతిక చిత్రాన్ని నిలుపుతుంది. స్పష్టత కోసం సందర్భం ద్వారా తెలిసే పౌలు, సీలల పేర్లు చేర్చబడ్డాయి; ‘రోమీయులు’ అనే మూలపదానికి పౌరసత్వార్థాన్ని పాదసూచికలో వివరించాం.
