id: ACT.16.38
reference: Acts 16:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἀπήγγειλαν δὲ τοῖς στρατηγοῖς οἱ ῥαβδοῦχοι τὰ ῥήματα ταῦτα· ⸂ἐφοβήθησαν δὲ⸃ ἀκούσαντες ὅτι Ῥωμαῖοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/038.yaml
  text: So the rod-bearers reported these words to the magistrates[a], and they were afraid when they heard that they were Romans[c][b],
translation:
  language: te
  text: దండధారులు ఈ మాటలను నగరాధికారులకు[b] తెలియజేశారు. వారు రోమీయులని[a] విన్న నగరాధికారులు భయపడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రోమా పౌరులని.” గ్రీకు మూలంలో “రోమీయులు” అని ఉంది; ఈ న్యాయపరమైన సందర్భంలో వారి రక్షిత పౌరహోదాయే ప్రధానాంశం.
    reason: lexical_alternative
  - marker: b
    text: “నగరాధికారులు” అనేది ఫిలిప్పీలోని ప్రముఖ పౌర అధికారులను సూచించే στρατηγοί అనే గ్రీకు పదానికి అనువాదం.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: తెలియజేశారు
  rationale: అధికారిక సందర్భంలో ఒక సందేశాన్ని సంబంధిత అధికారులకు చేరవేయడాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: στρατηγοῖς
  choice: నగరాధికారులకు
  rationale: ఫిలిప్పీలోని ప్రముఖ పౌర అధికారులను సూచించే పదం; ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉండే ఎంపిక.
- source_word: ῥαβδοῦχοι
  choice: దండధారులు
  rationale: అధికారానికి చిహ్నమైన దండాలను మోసే అధికారుల పరిచారకులు అనే గ్రీకు పదంలోని స్పష్టమైన రూపకాన్ని నిలుపుతుంది.
- source_word: τὰ ῥήματα ταῦτα
  choice: ఈ మాటలను
  rationale: గ్రీకు పదబంధాన్ని నేరుగా ప్రతిబింబిస్తూ, ముందుగా చెప్పబడిన నిర్దిష్ట సందేశాన్ని సూచిస్తుంది.
- source_word: ἐφοβήθησαν
  choice: భయపడ్డారు
  rationale: విన్న సమాచారానికి ప్రతిస్పందనగా కలిగిన భయాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀκούσαντες
  choice: విన్నప్పుడు
  rationale: అయోరిస్ట్ కృదంతంలోని కాలసంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: Ῥωμαῖοί
  choice: రోమీయులు
  rationale: గ్రీకు మూలంలో ఉన్న పదాన్ని యథాతథ భావంతో నిలుపుతుంది; సందర్భంలో ఇది రోమా పౌరసత్వాన్ని సూచిస్తుంది.
