revisions:
- from: అతడు ఆ దర్శనం చూసిన వెంటనే, దేవుడు వారికి శుభవార్త ప్రకటించడానికి మమ్మల్ని పిలిచాడని నిర్ధారించుకొని, మేము మాసిదోనియకు బయలుదేరడానికి ప్రయత్నించాము.
  to: అతడు ఆ దర్శనం చూసిన తర్వాత, దేవుడు మమ్మల్ని వారికి శుభవార్త ప్రకటించడానికి పిలిచాడని గ్రహించి, మేము వెంటనే మాసిదోనియకు బయలుదేరడానికి ప్రయత్నించాము.
  rationale: The revision locates ‘వెంటనే’ with the group’s immediate attempt to depart, as in the Greek syntax, and renders the inferential participle with ‘గ్రహించి.’ It otherwise preserves the draft’s accurate terminology, narrative ‘మేము,’ and the source’s sequence and meaning.
  reviewer_model: gpt-5.6-terra
