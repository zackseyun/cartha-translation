id: ACT.16.10
reference: Acts 16:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς δὲ τὸ ὅραμα εἶδεν, εὐθέως ἐζητήσαμεν ἐξελθεῖν ⸀εἰς Μακεδονίαν, συμβιβάζοντες ὅτι προσκέκληται ἡμᾶς ὁ ⸀θεὸς εὐαγγελίσασθαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/010.yaml
  text: And when he had seen the vision[a], we immediately sought to go on into Macedonia[c][b], concluding that God had called us to proclaim the good news to them.
translation:
  language: te
  text: అతడు ఆ దర్శనం చూసిన తర్వాత, దేవుడు మమ్మల్ని వారికి శుభవార్త ప్రకటించడానికి పిలిచాడని గ్రహించి, మేము వెంటనే మాసిదోనియకు బయలుదేరడానికి ప్రయత్నించాము.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ τὸ ὅραμα εἶδεν
  choice: అతడు ఆ దర్శనం చూసిన వెంటనే
  rationale: కాలసంబంధ ఉపవాక్యాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది. తదుపరి εὐθέως సూచించే తక్షణ ప్రతిస్పందనతో కలిసి చదివినప్పుడు ‘చూసిన వెంటనే’ మూలంలోని సంఘటనల క్రమాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: εὐθέως ἐζητήσαμεν
  choice: మేము ... ప్రయత్నించాము
  rationale: εὐθέως యొక్క తక్షణతను ‘వెంటనే’లో వ్యక్తం చేసి, ζητέω ఇక్కడ సూచించే యత్నం/సన్నాహాన్ని సహజమైన ‘ప్రయత్నించాము’తో అందించింది.
- source_word: ἐξελθεῖν εἰς Μακεδονίαν
  choice: మాసిదోనియకు బయలుదేరడానికి
  rationale: ప్రయాణ సందర్భంలో ἐξέρχομαι యొక్క ‘బయలుదేరు/వెళ్లు’ భావాన్ని సహజంగా తెలియజేస్తుంది; గమ్యాన్ని ‘మాసిదోనియకు’గా ఉంచుతుంది.
- source_word: συμβιβάζοντες
  choice: నిర్ధారించుకొని
  rationale: దర్శనం ఆధారంగా విషయాలను కలిపి ఒక నిర్ణయానికి రావడాన్ని సూచిస్తుంది; కేవలం ఊహించడం కంటే మూలంలోని తార్కిక నిర్ధారణ భావానికి సరిపోతుంది.
- source_word: προσκέκληται ἡμᾶς ὁ θεὸς
  choice: దేవుడు ... మమ్మల్ని పిలిచాడని
  rationale: పరిపూర్ణ కాలంలోని ముందే జరిగిన, ఇంకా ప్రాసంగికమైన దైవిక పిలుపును తెలుగులో సహజంగా తెలియజేస్తుంది; ‘పిలిచాడు’ అనేది ఆహ్వానంకన్నా బలమైన commissioning భావాన్ని కాపాడుతుంది.
- source_word: εὐαγγελίσασθαι αὐτούς
  choice: వారికి శుభవార్త ప్రకటించడానికి
  rationale: క్రియ యొక్క సువార్త తెలియజేయు భావాన్ని సాధారణ పాఠకులకు పారదర్శకమైన భాషలో అందిస్తుంది; αὐτούς ను తెలుగులో సహజమైన పరోక్ష కర్మ ‘వారికి’గా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: కథనంలో ప్రథమ పురుష బహువచనానికి మార్పు
  choice: ‘మేము’ను యథాతథంగా నిలుపుట
  alternative: కర్తను ప్రస్తావించకుండా అపరోక్షంగా చెప్పుట
  rationale: గ్రీకు పాఠం స్పష్టంగా ‘మేము’ అని మారుతుంది. రచయిత ఎవరు అనే సిద్ధాంతాన్ని జోడించకుండా ఈ పాఠ్య లక్షణాన్ని నిలుపుతుంది.
- issue: προσκέκληται లోని దైవిక మార్గదర్శకత్వం
  choice: ‘దేవుడు మమ్మల్ని పిలిచాడు’
  alternative: ‘దేవుడు మమ్మల్ని నడిపిస్తున్నాడు’ లేదా ‘ఆహ్వానించాడు’
  rationale: మూల క్రియ పిలవడం/రమ్మని పిలిపించడం అనే దైవిక చొరవను సూచిస్తుంది; బలహీనమైన లేదా వివరణాత్మక ప్రత్యామ్నాయంతో దాన్ని మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైనదిగా, అయితే గంభీరమైన కథన శైలిలో ఉంది. ‘మాసిదోనియ’ అనే ప్రాచుర్యంలో ఉన్న బైబిలు స్థలనామ రూపాన్ని వాడింది. మూలంలో అవసరమైనంతకు మించిన సిద్ధాంత వివరణను చేర్చలేదు.
