- from: అప్పుడు జనసమూహం కూడా వారిమీదికి ఒక్కటిగా లేచింది[a]. అధికారులు వారి బట్టలు చింపి తీసివేసి, వారిని కర్రలతో కొట్టాలని ఆజ్ఞాపిస్తూ ఉన్నారు[b].
  to: జనసమూహం వారిమీద ఏకమై లేచింది[a]. అధికారులు వారి బట్టలు చింపి తీసివేసి, వారిని కర్రలతో కొట్టమని ఆజ్ఞాపిస్తున్నారు[b].
