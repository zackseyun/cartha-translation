source:
  edition: SBLGNT
  text: καὶ συνεπέστη ὁ ὄχλος κατ’ αὐτῶν, καὶ οἱ στρατηγοὶ περιρήξαντες αὐτῶν τὰ ἱμάτια ἐκέλευον ῥαβδίζειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/022.yaml
  text: And the crowd rose up together against them[a], and the magistrates, after tearing off their garments, were ordering them to be beaten with rods[b],
translation:
  language: te
  text: జనసమూహం వారిమీద ఏకమై లేచింది[a]. అధికారులు వారి బట్టలు చింపి తీసివేసి, వారిని కర్రలతో కొట్టమని ఆజ్ఞాపిస్తున్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిపై దాడి చేయడంలో కలిశారు.” గ్రీకు క్రియ జనసమూహం కలిసికట్టుగా చేసిన శత్రుత్వ చర్యను నొక్కి చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “అధికారులు” అనే పదం రోమన్ వలసనగరమైన ఫిలిప్పీలోని పౌరపాలక అధికారులను సూచిస్తుంది; మరింత సాంకేతికంగా వారిని “ప్రేటర్లు” అనవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: συνεπέστη
  choice: ఒక్కటిగా లేచింది
  rationale: సమూహం కలిసికట్టుగా శత్రుత్వ చర్యకు దిగిందనే సంయుక్త క్రియ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ὄχλος
  choice: జనసమూహం
  rationale: సందర్భంలోని గుంపును తటస్థంగా సూచిస్తుంది; ‘మూక’ అనడం దాని ఉద్రేకాన్ని మూలపాఠం కంటే ఎక్కువగా వ్యాఖ్యానించవచ్చు.
- source_word: κατ’ αὐτῶν
  choice: వారిమీదికి
  rationale: ఈ సందర్భంలో κατά తెలిపే విరోధపూర్వక దిశను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: στρατηγοὶ
  choice: అధికారులు
  rationale: ఫిలిప్పీలోని రోమా పౌరపాలక అధికారులను సాధారణ పాఠకునికి స్పష్టంగా సూచిస్తుంది; సాంకేతిక హోదా పాదసూచికలో ఇవ్వబడింది.
- source_word: περιρήξαντες
  choice: చింపి తీసివేసి
  rationale: బట్టలను శరీరం మీదనుండి బలవంతంగా తొలగించిన చర్యను, ప్రధాన ఆజ్ఞకు ముందుగా జరిగినదిగా తెలియజేస్తుంది.
- source_word: αὐτῶν τὰ ἱμάτια
  choice: వారి బట్టలు
  rationale: పౌలు, సీలల వస్త్రాలను సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: ἐκέλευον
  choice: ఆజ్ఞాపిస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న చర్య భావాన్ని నిలుపుతుంది.
- source_word: ῥαβδίζειν
  choice: కర్రలతో కొట్టాలని
  rationale: రోమా శిక్షలో కర్రలతో కొట్టడాన్ని నిర్దిష్టంగా, పారదర్శకంగా తెలియజేస్తుంది.
