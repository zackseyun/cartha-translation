    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “అధికారులు” అనే పదం రోమన్ వలసనగరమైన ఫిలిప్పీలోని పౌరపాలక అధికారులను సూచిస్తుంది; మరింత సాంకేతికంగా వారిని “ప్రేటర్లు” అనవచ్చు.
