translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఆజ్ఞాపిస్తూ ఉన్నారు’ ద్వారా గ్రీకు అసంపూర్ణ భూతకాల కొనసాగింపు నిలుపబడింది; సాంకేతిక రోమా పరిపాలనా పదం ప్రధాన వాక్యాన్ని భారంగా చేయకుండా పాదసూచికలో వివరించబడింది.
