id: ACT.16.6
reference: Acts 16:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Διῆλθον δὲ τὴν Φρυγίαν ⸀καὶ Γαλατικὴν χώραν, κωλυθέντες ὑπὸ τοῦ ἁγίου πνεύματος λαλῆσαι τὸν λόγον ἐν τῇ Ἀσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/006.yaml
  text: And they passed through the region of Phrygia and Galatia[b][a], having been forbidden by the Holy Spirit to speak the word in Asia.
translation:
  language: te
  text: పరిశుద్ధాత్మచేత ఆసియలో[a] వాక్యాన్ని ప్రకటించకుండా అడ్డుకోబడిన వారు, ఫ్రుగియ మరియు గలతీయ ప్రాంతం గుండా వెళ్లారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘ఆసియ’ అంటే ఆధునిక ఆసియా ఖండం కాదు; ఆసియా మైనరు పశ్చిమ భాగంలో ఉన్న రోమా సామ్రాజ్యంలోని ఆసియ ప్రాంతం.
    reason: cultural_note
  - marker: b
    text: లేదా, “ఫ్రుగియ-గలతీయ ప్రాంతం.” గ్రీకు వాక్యనిర్మాణం దీనిని ఒకే ప్రాంతానికి సంబంధించిన సంయుక్త పేరుగా కూడా అర్థం చేసుకునే వీలు కల్పిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Διῆλθον
  choice: గుండా వెళ్లారు
  rationale: διέρχομαι అనే క్రియ ఒక ప్రాంతం గుండా ప్రయాణించడాన్ని సూచిస్తుంది. ‘గుండా వెళ్లారు’ దిశాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ కథనాన్ని ముందుకు నడిపే స్వల్ప అనుసంధాన పదం. తెలుగు వాక్యప్రవాహంలో దాన్ని ప్రత్యేకంగా ‘మరియు’ లేదా ‘అప్పుడు’ అని చేర్చకపోయినా దాని కథన సంబంధం సహజంగా వ్యక్తమవుతుంది.
- source_word: τὴν Φρυγίαν καὶ Γαλατικὴν χώραν
  choice: ఫ్రుగియ మరియు గలతీయ ప్రాంతం
  rationale: χώρα అంటే ‘ప్రాంతం/దేశభాగం.’ గ్రీకు నిర్మాణం రెండు భౌగోళిక సూచనలుగానూ, ఒకే సంయుక్త ప్రాంతనామంగానూ అర్థమయ్యే అవకాశం ఉన్నందున ప్రధాన పాఠం సులభంగా చదవదగిన రూపాన్ని, పాదసూచిక ప్రత్యామ్నాయ అర్థాన్ని ఇస్తుంది.
- source_word: κωλυθέντες
  choice: అడ్డుకున్నాడు
  rationale: κωλύω యొక్క భూతకాల నిష్క్రియాత్మక కృదంతం నిరోధించబడిన చర్యను సూచిస్తుంది. తెలుగులో వాక్యాన్ని సహజంగా ఉంచేందుకు పరిశుద్ధాత్మను కర్తగా చేసి ‘అడ్డుకున్నాడు’ అని అనువదించబడింది; ఇది కేవలం ఆలస్యం కాక, కార్యాన్ని చేయనివ్వని భావాన్ని తెలియజేస్తుంది.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: పరిశుద్ధాత్మ
  rationale: ὑπόతో కూడిన షష్ఠీ విభక్తి పరిశుద్ధాత్మ యొక్క ప్రత్యక్ష కార్యసాధకత్వాన్ని చూపుతుంది. తెలుగులో కర్తృవాచ్య నిర్మాణం ద్వారా అదే భావం నిలుపబడింది.
- source_word: λαλῆσαι
  choice: చెప్పకుండా
  rationale: λαλέω యొక్క ప్రాథమిక భావం ‘మాట్లాడు/చెప్పు.’ సందర్భంలో సందేశ ప్రకటన ఉద్దేశంలో ఉన్నప్పటికీ, ‘చెప్పు’ గ్రీకు పదం యొక్క విస్తృత భావాన్ని అతిగా సంకుచితం చేయదు.
- source_word: τὸν λόγον
  choice: వాక్యం
  rationale: లూకా–అపొస్తలుల కార్యములలో λόγος క్రైస్తవ సందేశాన్ని సూచించే స్థిరమైన ప్రయోగం. ‘వాక్యం’ మూలపద రూపాన్ని, దాని సందేశార్థాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: ఆసియలో
  rationale: Ἀσία ఇక్కడ ఆధునిక ఖండాన్ని కాక రోమా సామ్రాజ్యంలోని ఆసియ ప్రాంతాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో స్థలనామాన్ని యథాతథంగా ఉంచి, చారిత్రక సూచనను పాదసూచికలో వివరించాం.
theological_decisions:
- issue: నిషేధంలో ఆత్మ యొక్క కార్యసాధకత్వం మరియు వ్యక్తిత్వం
  choice: పరిశుద్ధాత్మ వారిని అడ్డుకున్నాడు
  alternative: ఆత్మచేత వారు అడ్డుకోబడ్డారు
  rationale: τοῦ ἁγίου πνεύματος అనే నిర్దిష్ట పదబంధం, ὑπόతో వ్యక్తమైన కార్యసాధకత్వం కలిపి లూకా–అపొస్తలుల కార్యములలో దైవిక పరిశుద్ధాత్మనే సూచిస్తున్నాయి. కర్తృవాచ్య తెలుగు నిర్మాణం మూలంలోని వ్యక్తిగత కార్యసాధకత్వాన్ని స్పష్టంగా నిలుపుతుంది; మూలపాఠానికి మించిన సిద్ధాంత వివరణను జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఫ్రుగియ,’ ‘గలతీయ,’ ‘ఆసియ’ అనే చారిత్రక స్థలనామాలు సాంప్రదాయ బైబిలు రూపాలకు దగ్గరగా ఉంచబడ్డాయి. గ్రీకు కృదంత నిర్మాణాన్ని తెలుగులో రెండు సంక్షిప్త వాక్యాలుగా మార్చి సహజత్వాన్ని సాధించాం; నిరోధం మరియు ప్రయాణం మధ్య ఖచ్చితమైన కాల/కారణ సంబంధాన్ని అదనంగా నిర్ణయించలేదు.
