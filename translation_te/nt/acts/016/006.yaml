revisions:
- from: వారు ఫ్రుగియ మరియు గలతీయ ప్రాంతం గుండా వెళ్లారు[b]. ఆసియలో[a] వాక్యం చెప్పకుండా పరిశుద్ధాత్మ వారిని అడ్డుకున్నాడు.
  to: పరిశుద్ధాత్మచేత ఆసియలో[a] వాక్యాన్ని ప్రకటించకుండా అడ్డుకోబడిన వారు, ఫ్రుగియ మరియు గలతీయ ప్రాంతం గుండా వెళ్లారు[b].
  rationale: The revision restores the Greek participial linkage by making the travelers the ones ‘prevented by the Holy Spirit,’ while retaining a natural Telugu word order. “వాక్యాన్ని ప్రకటించకుండా” more accurately represents speaking the word in this missionary context than “వాక్యం చెప్పకుండా.” The footnote wording is lightly normalized, and all anchors remain attached to their respective referents.
