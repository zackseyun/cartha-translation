  text: αἰτήσας δὲ φῶτα εἰσεπήδησεν καὶ ἔντρομος γενόμενος προσέπεσεν τῷ Παύλῳ καὶ ⸀τῷ Σιλᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/029.yaml
  text: Then[a], asking for lights, he rushed in, and trembling with fear he fell down before Paul and Silas[c][b],
translation:
  language: te
  text: అప్పుడు దీపాలు తెమ్మని అడిగి, అతడు లోపలికి దూసుకువచ్చాడు; భయంతో వణుకుతూ పౌలు, సీలల ఎదుట పడిపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వారి ఎదుట పడిపోయాడు’ అంటే ఇక్కడ భయంతో లేదా వేడుకోలు భావంతో పౌలు, సీలల ఎదుట పడిపోయాడని అర్థం; వారిని ఆరాధించాడని తప్పనిసరిగా కాదు.
    reason: alternative_reading
lexical_decisions:
- source_word: αἰτήσας δὲ φῶτα
  choice: అప్పుడు దీపాలు తెమ్మని అడిగి
  rationale: δέ కథన పురోగతిని సూచిస్తుంది; φῶτα బహువచనంలో వెలుగు ఇచ్చే సాధనాలను సాధారణంగా సూచిస్తుంది. తెలుగు సందర్భంలో ‘దీపాలు’ సహజంగా ఉండి, వాటి నిర్దిష్ట రకాన్ని నిర్ణయించదు.
- source_word: εἰσεπήδησεν
  choice: లోపలికి దూసుకువచ్చాడు
  rationale: ఆకస్మికమైన, బలమైన లోనికి కదలికను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔντρομος γενόμενος
  choice: భయంతో వణుకుతూ
  rationale: భయానికి లోనై శారీరకంగా వణికిన స్థితిని తెలుగులో సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: προσέπεσεν
  choice: ఎదుట సాగిలపడ్డాడు
  rationale: ఒకరి ఎదుట కూలబడడం లేదా వినయపూర్వకంగా పడడం అనే భావాన్ని ఇస్తుంది; ఆరాధన అని నిర్బంధంగా అర్థం చేయదు.
- source_word: τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: పౌలు, సీలల ఎదుట
  rationale: ప్రసπίπτωతో వచ్చిన దత్తివిభక్తి సంబంధాన్ని ‘ఎదుట’ సహజంగా వ్యక్తం చేస్తుంది; ‘పాదాల దగ్గర’ వంటి మూలంలో లేని నిర్దిష్టతను చేర్చదు.
theological_decisions:
- issue: చెరసాల అధికారి పౌలు, సీలల ఎదుట చేసిన చర్య స్వభావం
  choice: భయంతో, వేడుకోలు లేదా గౌరవభావంతో వారి ఎదుట సాగిలపడడం
  alternative: పౌలు, సీలలను ఆరాధించడం
  rationale: προσέπεσεν ఒకరి ఎదుట పడిపోవడాన్ని సూచిస్తుంది గాని, ఈ సందర్భంలో అది తప్పనిసరిగా మతపరమైన ఆరాధన అని చెప్పదు. అనువాదం ఆ చర్యను నిలుపుతూ, మూలపాఠం నిర్ధారించని సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కథన వేగాన్ని మరియు చెరసాల అధికారి భయోద్వేగాన్ని నిలుపుతూ గౌరవప్రదంగా అనువదించబడింది. ‘దూసుకువచ్చాడు’ ఆకస్మిక ప్రవేశాన్ని, ‘భయంతో వణుకుతూ’ ἔντρομος γενόμενος యొక్క సహజ భావాన్ని అందిస్తాయి.
