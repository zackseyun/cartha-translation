id: ACT.16.12
reference: Acts 16:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀κἀκεῖθεν εἰς Φιλίππους, ἥτις ἐστὶν ⸂πρώτη τῆς μερίδος⸃ Μακεδονίας πόλις, κολωνία. ἦμεν δὲ ἐν ⸀ταύτῃ τῇ πόλει διατρίβοντες ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/012.yaml
  text: and from there to Philippi[a], which is a leading city of the district of Macedonia, a Roman colony[b]. And we stayed in this city for some days.
translation:
  language: te
  text: అక్కడి నుండి ఫిలిప్పీకి వెళ్లాం. అది మాసిదోనియాలోని ఒక ప్రాంతపు ప్రముఖ నగరం[a], రోమా వలసనగరం[b]. మేము ఆ నగరంలో కొన్ని రోజులు గడిపాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మాసిదోనియాలోని ఆ ప్రాంతపు మొదటి నగరం.’ గ్రీకు పదబంధం క్లిష్టమైనది; ‘మొదటి’ అనేది హోదాను, ప్రాముఖ్యతను, లేదా ప్రయాణక్రమంలో మొదటిదానిని సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: అంటే, రోమా పాలనలో ప్రత్యేక అధికారిక హోదా పొందిన పట్టణం.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖθεν εἰς Φιλίππους
  choice: అక్కడి నుండి ఫిలిప్పీకి వెళ్లాం
  rationale: గ్రీకులో గమనాన్ని తెలిపే క్రియ అధ్యాహారంగా ఉంది; తెలుగు వాక్యం సహజంగా, సంపూర్ణంగా ఉండేందుకు మునుపటి ప్రయాణక్రమం నుంచి ‘వెళ్లాం’ను స్పష్టం చేశాం. κἀκεῖθεν లోని అనుసంధాన భావాన్ని ‘అక్కడి నుండి’ నిలుపుతుంది.
- source_word: πρώτη τῆς μερίδος Μακεδονίας πόλις
  choice: మాసిదోనియాలోని ఆ ప్రాంతంలో ప్రముఖ నగరం
  rationale: πρώτη అనే పదానికి ఇక్కడ హోదా, ప్రాముఖ్యత, లేదా క్రమంలో మొదటిదనే భావాలు సాధ్యమైనందున ప్రధాన పాఠంలో సహజమైన ‘ప్రముఖ’ను ఎంచుకుని, నిజమైన సందిగ్ధతను పాదసూచికలో తెలిపాం. μερίς ను సాధారణ పాఠకునికి అర్థమయ్యే ‘ప్రాంతం’గా అనువదించాం.
- source_word: κολωνία
  choice: రోమా వలసపట్టణం
  rationale: ఇది సాధారణ వలసను కాక, రోమా పాలనలో అధికారిక హోదా పొందిన పట్టణాన్ని సూచిస్తుంది; అందువల్ల చారిత్రక సూచనను స్పష్టం చేశాం.
- source_word: ἦμεν ... διατρίβοντες
  choice: గడిపాం
  rationale: ఈ పరిభాషాత్మక అసంపూర్ణ భూతకాల నిర్మాణం కొంతకాలం అక్కడ ఉండడాన్ని సూచిస్తుంది; ‘కొన్ని రోజులు గడిపాం’ ఆధునిక తెలుగులో సహజంగా ఆ కొనసాగింపు భావాన్ని అందిస్తుంది.
- source_word: ἐν ταύτῃ τῇ πόλει
  choice: ఆ నగరంలో
  rationale: కథనంలో ఇప్పుడే పేర్కొన్న ఫిలిప్పీని తిరిగి సూచించడానికి తెలుగులో ‘ఆ నగరంలో’ సహజం.
- source_word: ἡμέρας τινάς
  choice: కొన్ని రోజులు
  rationale: నిర్దిష్టం కాని కాలవ్యవధిని అతిశయింపకుండా నేరుగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ఫిలిప్పీని వర్ణించే πρώτη పదం భావం
  choice: ప్రధాన పాఠంలో ‘ప్రముఖ నగరం’
  alternative: ‘ఆ ప్రాంతంలోని మొదటి నగరం’
  rationale: ఈ పదబంధం చారిత్రకంగానూ వాక్యనిర్మాణపరంగానూ క్లిష్టమైనది. ఫిలిప్పీకి వివాదరహిత పరిపాలనా ప్రథమస్థానం ఉందని అనవసరంగా నిర్ణయించకుండా, సాధ్యమైన ప్రాముఖ్యత భావాన్ని ప్రధాన పాఠంలో ఉంచి, ప్రత్యక్షమైన ‘మొదటి’ భావాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకునికి సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలిని వాడాం. ‘ఫిలిప్పీ,’ ‘మాసిదోనియా,’ ‘రోమా’ అనే రూపాలు మూల నామాలకు సమీపంగా ఉన్నాయి; చారిత్రక-భాషాపరమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
