source:
  edition: SBLGNT
  text: τῇ τε ἡμέρᾳ τῶν σαββάτων ἐξήλθομεν ἔξω τῆς ⸀πύλης παρὰ ποταμὸν οὗ ⸂ἐνομίζομεν προσευχὴν⸃ εἶναι, καὶ καθίσαντες ἐλαλοῦμεν ταῖς συνελθούσαις γυναιξίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/013.yaml
  text: On the Sabbath day we went outside the gate beside the river[a], where we supposed there was a place of prayer, and after sitting down we were speaking to the women who had gathered there.
translation:
  language: te
  text: విశ్రాంతి దినాన మేము ద్వారం వెలుపలికి, నది ఒడ్డున ప్రార్థనాస్థలం ఉందని మేము అనుకున్న చోటికి వెళ్లాం.[a] కూర్చొని, అక్కడ కూడివచ్చిన స్త్రీలతో మాట్లాడుతూనే ఉన్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అక్కడ ప్రార్థన జరుగుతుందని మేము అనుకున్నాం.” గ్రీకు పదం ప్రార్థనను గానీ, ప్రార్థన కోసం కేటాయించిన స్థలాన్ని గానీ సూచించవచ్చు; ఇక్కడి సందర్భం “ప్రార్థనాస్థలం” అనే అర్థానికి అనుకూలంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἡμέρᾳ τῶν σαββάτων
  choice: విశ్రాంతి దినాన
  rationale: కోయినే గ్రీకులోని ఈ నుడికారం సబ్బాతు దినాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘విశ్రాంతి దినాన’ సహజంగా, అర్థవంతంగా ఉంటుంది.
- source_word: ἐξήλθομεν ἔξω τῆς πύλης
  choice: మేము పట్టణ ద్వారం వెలుపలికి వెళ్లి
  rationale: క్రియతో పాటు ἔξω బయటికివెళ్లే కదలికను బలపరుస్తుంది. గ్రీకులో ‘పట్టణం’ ప్రత్యక్షంగా లేకపోయినా ద్వారం పట్టణ ద్వారమని సందర్భం స్పష్టం చేస్తుంది; తెలుగులో అస్పష్టత నివారించడానికి ‘పట్టణ ద్వారం’ వాడబడింది.
- source_word: παρὰ ποταμόν
  choice: నది ఒడ్డున
  rationale: παρά + accusative ఇక్కడ నది పక్కనున్న ప్రదేశం వైపు కదలికను సూచిస్తుంది. ‘నది ఒడ్డున’ సహజమైన తెలుగు స్థలవ్యక్తీకరణ.
- source_word: οὗ ἐνομίζομεν προσευχὴν εἶναι
  choice: ప్రార్థనాస్థలం ఉంటుందని మేము అనుకున్న చోటికి
  rationale: νομίζω అంటే ఇక్కడ ‘అనుకొను’; προσευχή ప్రార్థనను లేదా ప్రార్థన కోసం కేటాయించిన స్థలాన్ని సూచించగలదు. నది ఒడ్డున ప్రజలు కూడే కథన సందర్భం ‘ప్రార్థనాస్థలం’ అనే భావానికి అనుకూలంగా ఉంది.
- source_word: καὶ καθίσαντες
  choice: అక్కడ కూర్చొని
  rationale: అయోరిస్ట్ పార్టిసిపిల్ ప్రధాన క్రియకు ముందున్న చర్యను సూచిస్తుంది. ‘కూర్చొని’ తెలుగులో ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐλαλοῦμεν
  choice: మాట్లాడుతూనే ఉన్నాం
  rationale: ఇంపర్ఫెక్ట్ రూపంలోని కొనసాగుతున్న చర్యను తెలుగులో ఈ రూపం స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: ταῖς συνελθούσαις γυναιξίν
  choice: కూడివచ్చిన స్త్రీలతో
  rationale: సమావేశమయ్యేందుకు ముందే వచ్చి కూడిన స్త్రీలను ఈ పదబంధం సూచిస్తుంది. తెలుగు ప్రయోగంలో ‘మాట్లాడు’తో ‘తో’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: ఈ సందర్భంలో προσευχή అర్థం
  choice: ‘ప్రార్థనాస్థలం’ అని అనువదించడం
  alternative: ‘ప్రార్థన’ అని అమూర్త చర్యగా అనువదించడం; లేదా ‘సమాజమందిరం’ అని సంస్థాగత అర్థం ఇవ్వడం
  rationale: నది ఒడ్డున ప్రజలు కూడిన ఒక ప్రదేశాన్ని వాక్యం వర్ణిస్తోంది; హెల్లెనిస్టిక్ యూదుల వాడుకలో προσευχή ప్రార్థనకు కేటాయించిన స్థలాన్ని కూడా సూచించగలదు. ‘ప్రార్థనాస్థలం’ సందర్భానికి సరిపోతుంది; గ్రీకులో లేని ‘సమాజమందిరం’ అనే ప్రత్యేక సంస్థాగత భావాన్ని దిగుమతి చేయదు. పదంలోని నిజమైన ద్వంద్వార్థాన్ని పాదసూచికలో నిలుపుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. కథనంలోని ‘మేము’ దృష్టికోణం, ఇంపర్ఫెక్ట్ క్రియ యొక్క కొనసాగుతున్న భావం, προσευχή పదంలోని అర్థసందిగ్ధత సంరక్షించబడ్డాయి.
