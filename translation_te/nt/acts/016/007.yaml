id: ACT.16.7
reference: Acts 16:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐλθόντες ⸀δὲ κατὰ τὴν Μυσίαν ἐπείραζον ⸀εἰς τὴν Βιθυνίαν ⸀πορευθῆναι καὶ οὐκ εἴασεν αὐτοὺς τὸ πνεῦμα ⸀Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/007.yaml
  text: But when they came to Mysia[a], they were trying to go into Bithynia, and the Spirit of Jesus did not permit them.
translation:
  language: te
  text: వారు ముసియ ప్రాంతానికి వచ్చినప్పుడు[a], బిథునియలోకి వెళ్లడానికి ప్రయత్నిస్తూ ఉన్నారు, కానీ యేసు ఆత్మ వారిని అనుమతించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ముసియ సమీపానికి’ లేదా ‘ముసియ వెంబడి.’ గ్రీకు పదబంధం బహుశా వారు ముసియ సరిహద్దు ప్రాంతానికి చేరుకున్నారని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: వచ్చినప్పుడు
  rationale: సందర్భంలో కాలార్థాన్ని తెలిపే భూతకాల కృదంతాన్ని సహజమైన ఆధునిక తెలుగులో చూపుతుంది.
- source_word: δὲ
  choice: కాని
  rationale: మునుపటి ప్రయాణవివరణకు కొనసాగింపుతో కూడిన స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: κατὰ τὴν Μυσίαν
  choice: ముసియ ప్రాంతం దగ్గరికి
  rationale: κατά + ద్వితీయా విభక్తి ఇక్కడ ముసియ సరిహద్దు వద్దకు లేదా దాని వెంబడి చేరడాన్ని సూచించవచ్చు; ప్రధాన పాఠంలో సహజమైన భావాన్ని ఇస్తూ, ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచుతుంది.
- source_word: ἐπείραζον
  choice: ప్రయత్నిస్తున్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న ప్రయత్నాన్ని సూచిస్తుంది.
- source_word: εἰς τὴν Βιθυνίαν πορευθῆναι
  choice: బితూనియలోకి వెళ్లడానికి
  rationale: εἰς ప్రాంతంలోకి కదలికను, πορευθῆναι ప్రయాణించాలనే ఉద్దేశాన్ని స్పష్టంగా చూపుతాయి.
- source_word: οὐκ εἴασεν
  choice: అనుమతించలేదు
  rationale: గ్రీకు క్రియలోని ‘అనుమతించకపోవడం’ అనే భావాన్ని, ‘నిషేధించాడు’ అనే మరింత బలమైన భావం చేర్చకుండా నిలుపుతుంది.
- source_word: τὸ πνεῦμα Ἰησοῦ
  choice: యేసు ఆత్మ
  rationale: గ్రీకులోని అసాధారణమైన క్రీస్తుసంబంధ పదబంధాన్ని ‘పరిశుద్ధాత్మ’గా సమన్వయపరచకుండా నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: τὸ πνεῦμα Ἰησοῦ అనే క్రీస్తుసంబంధ పదబంధం
  choice: యేసు ఆత్మ
  alternative: పరిశుద్ధాత్మ; ఆత్మ
  rationale: మూల గ్రీకులో Ἰησοῦ స్పష్టంగా ఉంది. దానిని తొలగించకుండా ఉంచడం వాక్యంలోని క్రీస్తుసంబంధమైన ఉద్దేశపూర్వక ఉద్వేగాన్ని కాపాడుతుంది; అదనపు సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. ‘ముసియ ప్రాంతం దగ్గరికి’ అనేది భౌగోళిక పదబంధంలోని అస్పష్టతను పాదసూచిక సహాయంతో నిలుపుతుంది; ‘యేసు ఆత్మ’ మూలంలోని ప్రత్యేక పదప్రయోగాన్ని యథాతథంగా కాపాడుతుంది.
