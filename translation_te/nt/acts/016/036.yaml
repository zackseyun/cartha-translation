translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘పట్టణాధికారులు’ అనే పదం ఫిలిప్పీలోని రోమా వలసపట్టణ పౌరాధికారులను పాఠకులకు సులభంగా అర్థమయ్యేలా సూచిస్తుంది. మూలపాఠంలో లేని ప్రత్యేక పాదసూచికను ‘ఇప్పుడు’ వద్ద చేర్చలేదు; సాంస్కృతిక వివరణ అవసరమైతే ప్రధాన పదానికి అనుసంధానించాలి.
