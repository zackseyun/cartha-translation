revisions:
- from: 'అప్పుడు చెరసాల అధికారి ఆ మాటలను పౌలుకు తెలియజేశాడు: “మిమ్మల్ని విడుదల చేయాలని పట్టణాధికారులు కబురు పంపారు[a]. కాబట్టి ఇప్పుడు బయటకు వచ్చి, క్షేమంగా వెళ్లండి.”'
  to: 'అప్పుడు చెరసాల అధికారి ఈ మాటలను పౌలుకు తెలియజేశాడు: “మిమ్మల్ని విడుదల చేయమని న్యాయాధికారులు[b] కబురు పంపారు[a]. కాబట్టి ఇప్పుడు బయటకు వచ్చి, క్షేమంగా వెళ్లండి.”'
