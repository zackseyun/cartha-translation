id: ACT.16.36
reference: Acts 16:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπήγγειλεν δὲ ὁ δεσμοφύλαξ τοὺς λόγους ⸀τούτους πρὸς τὸν Παῦλον, ὅτι Ἀπέσταλκαν οἱ στρατηγοὶ ἵνα ἀπολυθῆτε· νῦν οὖν ἐξελθόντες πορεύεσθε ἐν εἰρήνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/036.yaml
  text: 'And the jailer reported these words to Paul: “The magistrates have sent word that you may be released[a]. So now[b], come out and go in peace.”'
translation:
  language: te
  text: 'అప్పుడు చెరసాల అధికారి ఈ మాటలను పౌలుకు తెలియజేశాడు: “మిమ్మల్ని విడుదల చేయమని న్యాయాధికారులు[b] కబురు పంపారు[a]. కాబట్టి ఇప్పుడు బయటకు వచ్చి, క్షేమంగా వెళ్లండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిమ్మల్ని విడుదల చేయమని న్యాయాధికారులు పంపించారు.” గ్రీకులో “పంపారు” అనే క్రియకు కర్మ స్పష్టంగా పేర్కొనబడలేదు.
    reason: lexical_alternative
  - marker: b
    text: “న్యాయాధికారులు” అనేది στρατηγοίకి అనువాదం; ఫిలిప్పీలో వీరు పట్టణ పౌర పరిపాలనాధికారులు, సాంకేతికంగా “ప్రేటర్లు.”
    reason: cultural_note
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: తెలియజేశాడు
  rationale: అధికారుల నుంచి వచ్చిన సమాచారాన్ని పౌలుకు చేరవేయడాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ὁ δεσμοφύλαξ
  choice: చెరసాల అధికారి
  rationale: ఇక్కడ ఖైదీల బాధ్యత వహించే వ్యక్తిని సూచిస్తుంది; ‘కాపలాదారు’ కంటే సందర్భానికి నిర్దిష్టంగా, ‘జైలర్’ అనే అనువాద పదం కంటే తెలుగు పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: τοὺς λόγους τούτους
  choice: ఆ మాటలను
  rationale: గ్రీకు బహువచన రూపాన్ని నిలుపుతూ, ముందుగా అందిన అధికారిక సమాచారాన్ని సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: Ἀπέσταλκαν
  choice: కబురు పంపారు
  rationale: గ్రీకులో పంపబడిన కర్మ ప్రత్యక్షంగా చెప్పబడలేదు. సందర్భంలో అధికారుల సందేశం లేదా ఆదేశం పంపబడిందనే భావాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: οἱ στρατηγοὶ
  choice: పట్టణాధికారులు
  rationale: ఫిలిప్పీలోని పౌర పరిపాలనాధికారులను సాధారణ పాఠకులకు అర్థమయ్యేలా సూచిస్తుంది; సాంకేతికంగా వీరిని ‘ప్రేటర్లు’ అని పిలవవచ్చు.
- source_word: ἵνα ἀπολυθῆτε
  choice: మిమ్మల్ని విడుదల చేయాలని
  rationale: నిర్బంధం నుంచి విడుదల చేయాలనే అధికారిక సందేశపు విషయాన్ని సూచిస్తుంది; గ్రీకు కర్మణి రూపంలోని భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: νῦν οὖν
  choice: కాబట్టి ఇప్పుడు
  rationale: οὖν యొక్క నిర్ధారణాత్మక భావాన్నీ νῦν యొక్క కాలసూచననూ స్పష్టంగా నిలుపుతుంది.
- source_word: ἐξελθόντες
  choice: బయటకు వచ్చి
  rationale: కృదంత రూపాన్ని తరువాతి ఆజ్ఞతో సహజమైన క్రమంలో కలుపుతుంది.
- source_word: πορεύεσθε
  choice: వెళ్లండి
  rationale: బహువచన ఆజ్ఞను ఆధునిక గౌరవప్రదమైన తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἐν εἰρήνῃ
  choice: క్షేమంగా
  rationale: ఈ సందర్భంలో శాంతితో, సురక్షితంగా వెళ్లడమనే ప్రయోగార్థాన్ని సహజమైన తెలుగులో అందిస్తుంది.
