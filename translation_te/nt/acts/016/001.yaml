id: ACT.16.1
reference: Acts 16:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Κατήντησεν δὲ ⸀καὶ εἰς Δέρβην καὶ ⸀εἰς Λύστραν. καὶ ἰδοὺ μαθητής τις ἦν ἐκεῖ ὀνόματι Τιμόθεος, υἱὸς ⸀γυναικὸς Ἰουδαίας πιστῆς, πατρὸς δὲ Ἕλληνος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/001.yaml
  text: He also came to Derbe and to Lystra[a]. And behold, a certain disciple was there named Timothy, the son of a believing Jewish woman, but of a Greek father[b],
translation:
  language: te
  text: అతడు దెర్బేకు, లుస్త్రకు కూడా వచ్చాడు. ఇదిగో, తిమోతి అనే ఒక శిష్యుడు అక్కడ ఉన్నాడు. అతడు విశ్వాసి అయిన యూదురాలి కుమారుడు[a]; అయితే అతని తండ్రి గ్రీకువాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నమ్మకమైన యూదురాలి కుమారుడు.’ గ్రీకు పదానికి ‘విశ్వాసి అయిన’ లేదా ‘నమ్మకమైన’ అనే అర్థాలు ఉండవచ్చు; ఇక్కడ ‘విశ్వాసి అయిన’ అనే అర్థమే ఎక్కువ సంభావ్యం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατήντησεν δὲ καὶ
  choice: అతడు … కూడా వచ్చాడు
  rationale: καταντάω ఇక్కడ ఒక ప్రదేశానికి చేరుకోవడం లేదా రావడం అనే భావాన్ని ఇస్తుంది. δὲ καὶ కథన కొనసాగింపుతో కూడిన అదనపు భావాన్ని సూచిస్తుంది; తెలుగులో ‘కూడా వచ్చాడు’ సహజంగా దానిని వ్యక్తం చేస్తుంది.
- source_word: εἰς Δέρβην καὶ εἰς Λύστραν
  choice: దెర్బేకూ లుస్త్రకూ
  rationale: ప్రయాణ సందర్భంలో εἰς అనే విభక్తి ప్రయోగం గమ్యస్థానాన్ని సూచిస్తుంది. రెండు స్థలపేర్లకూ ‘-కూ’ వాడటం గ్రీకులో పూర్వప్రత్యయం పునరుక్తమైన నిర్మాణాన్ని సహజ తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: καὶ ἰδοὺ
  choice: ఇదిగో
  rationale: ἰδού తరువాతి విషయంపై ప్రత్యేకంగా దృష్టి నిలిపే కథన సూచకం. ‘ఇదిగో’ దాని ఉద్దేశపూర్వక ఉజ్జ్వలతను తొలగించకుండా ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: μαθητής τις ἦν ἐκεῖ
  choice: ఒక శిష్యుడు అక్కడ ఉన్నాడు
  rationale: τις కొత్తగా పరిచయం అవుతున్న నిర్దిష్ట వ్యక్తిని అనిశ్చితంగా సూచిస్తుంది; ‘ఒక’ సహజ తెలుగు సమానం. ἐκεῖ తెలిపే స్థలభావం ‘అక్కడ’లో స్పష్టంగా నిలుస్తుంది.
- source_word: ὀνόματι Τιμόθεος
  choice: తిమోతి అనే
  rationale: ὀνόματι అనే దత్తివిభక్తి నిర్మాణాన్ని వ్యక్తిపేరును పరిచయం చేసే సహజ తెలుగు రూపమైన ‘అనే’తో అనువదించాం.
- source_word: υἱὸς γυναικὸς Ἰουδαίας πιστῆς
  choice: విశ్వాసియైన ఒక యూదురాలి కుమారుడు
  rationale: Ἰουδαίας స్త్రీలింగ రూపాన్ని ‘యూదురాలు’ స్పష్టంగా వ్యక్తం చేస్తుంది. అపొస్తలుల కార్యముల సందర్భంలో πιστή ప్రధానంగా క్రీస్తును విశ్వసించే వ్యక్తిని సూచించే అవకాశం ఎక్కువ కాబట్టి ‘విశ్వాసియైన’ అని అనువదించాం; ‘నమ్మకమైన’ అనే అర్థసాధ్యతను పాదసూచికలో నిలిపాం.
- source_word: πατρὸς δὲ Ἕλληνος
  choice: అయితే అతని తండ్రి గ్రీకువాడు
  rationale: గ్రీకులో ఇది ‘కుమారుడు’తో సంబంధమున్న సంక్షిప్త సమాస నిర్మాణం. తెలుగులో పూర్తి వాక్యంగా చెప్పడం సహజం; δέ సూచించే వ్యత్యాసాన్ని ‘అయితే’ నిలుపుతుంది. Ἕλληνను విస్తృతమైన ‘అన్యజనుడు’గా కాక, జాతి-సాంస్కృతిక గుర్తింపైన ‘గ్రీకువాడు’గా అనువదించాం.
theological_decisions:
- issue: తిమోతి తల్లిని వర్ణించే πιστῆς అర్థం
  choice: విశ్వాసియైన
  alternative: నమ్మకమైన
  rationale: అపొస్తలుల కార్యములలోని క్రైస్తవ సందర్భంలో πιστός సాధారణంగా విశ్వసించిన వ్యక్తిని, అంటే విశ్వాసిని, సూచిస్తుంది. అయినప్పటికీ ఆ విశేషణానికి ‘నమ్మకమైన/విశ్వసనీయమైన’ అనే నైతిక గుణార్థం కూడా ఉండగలదు; అందువల్ల ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. ἰδού యొక్క ప్రత్యేక దృష్టి సూచనను ‘ఇదిగో’తో నిలిపాం. ‘గ్రీకువాడు’ అనేది ఇక్కడ జాతి-సాంస్కృతిక గుర్తింపు; దానిని ‘అన్యజనుడు’గా విస్తరించలేదు. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోలుతుంది.
