translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ముందుకు తెచ్చారు’ అనే పదబంధం ఎంపిక ప్రక్రియను సూచిస్తూ, తుది నియామకం జరిగిపోయిందనే అతివ్యాఖ్యానాన్ని నివారిస్తుంది. పాదసూచిక గుర్తు ప్రధాన వాక్యం చివర ఉంచబడింది.
