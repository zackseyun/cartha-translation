source:
  edition: SBLGNT
  text: καὶ ἔστησαν δύο, Ἰωσὴφ τὸν καλούμενον Βαρσαββᾶν, ὃς ἐπεκλήθη Ἰοῦστος, καὶ Μαθθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/023.yaml
  text: 'And they put forward two: Joseph called Barsabbas[a], who was also called Justus, and Matthias.'
translation:
  language: te
  text: 'వారు ఇద్దరిని ముందుకు తెచ్చారు: బర్సబ్బా అని పిలువబడే యోసేపును—యూస్తు అని కూడా పిలువబడేవానిని—మరియు మత్తీయను.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఇద్దరిని నియమించారు” లేదా “ఇద్దరిని సమర్పించారు” అని కూడా అనువదించవచ్చు. గ్రీకు క్రియకు వ్యక్తులను ఒక సమూహం ఎదుట నిలపడం అనే అర్థం ఉండవచ్చు; ఇక్కడ వారిని అభ్యర్థులుగా ప్రతిపాదించడమే ఉద్దేశంగా కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησαν
  choice: ముందుకు తెచ్చారు
  rationale: ఎంపిక సందర్భంలో ఇద్దరిని సమూహం ఎదుట అభ్యర్థులుగా నిలిపిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఇప్పటికే నియమించారనే అర్థాన్ని మోపదు.
- source_word: δύο
  choice: ఇద్దరిని
  rationale: ఇక్కడ సూచించబడిన ఇద్దరు పురుషులకు తగిన వ్యక్తివాచక సంఖ్యారూపం.
- source_word: καλούμενον
  choice: అని పిలువబడే
  rationale: యోసేపుకు ఉన్న మరో పేరు లేదా గుర్తింపును మూలంలోని కృదంత నిర్మాణానికి దగ్గరగా తెలియజేస్తుంది.
- source_word: Βαρσαββᾶν
  choice: బర్సబ్బా
  rationale: గ్రీకు రూపాన్ని తెలుగులో సహజంగా లిప్యంతరీకరించిన వ్యక్తినామం.
- source_word: ἐπεκλήθη
  choice: అనే పేరు కూడా ఉంది
  rationale: మరో అదనపు పేరు ద్వారా అతడు పిలువబడ్డాడనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ‘కూడా’ రెండు నామకరణ వాక్యాల సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: Ἰοῦστος
  choice: యూస్తు
  rationale: గ్రీకు ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించిన వ్యక్తినామం.
- source_word: Μαθθίαν
  choice: మత్తీయను
  rationale: గ్రీకు వ్యక్తినామాన్ని తెలుగు విభక్తి నిర్మాణానికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: καὶ ... καὶ
  choice: అప్పుడు ... మరియు
  rationale: మొదటి καί కథన కొనసాగింపును తెలుగులో సహజంగా ‘అప్పుడు’తో, రెండవది ఇద్దరి సమన్వయాన్ని ‘మరియు’తో తెలియజేస్తుంది.
