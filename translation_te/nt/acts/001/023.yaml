  to: 'వారు ఇద్దరిని ముందుకు తెచ్చారు: బర్సబ్బా అని పిలువబడే యోసేపును—యూస్తు అని కూడా పిలువబడేవానిని—మరియు మత్తీయను.[a]'
  rationale: The revision removes an unnecessary temporal addition, supplies consistent object marking for the two candidates, and changes the Justus clause into a passive naming expression faithful to ἐπεκλήθη. The lexical footnote remains accurate and its anchor is retained.
