revisions:
- from: అందుచేత ఇతడు తన అన్యాయపు ప్రతిఫలంతో ఒక పొలాన్ని సంపాదించుకున్నాడు[a]. తలకిందులుగా పడిపోయి[b], నడుమున పగిలిపోయాడు; అతని పేగులన్నీ బయటికి వచ్చాయి.
  to: అందుచేత ఇతడు అన్యాయం ద్వారా వచ్చిన కూలితో ఒక పొలాన్ని సంపాదించుకున్నాడు[a]. తలముందుగా పడిపోయి[b], నడుమున పగిలిపోయాడు; అతని పేగులన్నీ బయటికి కుమ్మరించబడ్డాయి.
  rationale: The revision removes an unsupported possessive, clarifies that the payment derived from wrongdoing, uses a more direct modern Telugu expression for a headlong fall while preserving the lexical ambiguity in a footnote, and restores the force of the passive verb describing the spilling out of the inward parts. The acquisition wording remains deliberately broad and does not harmonize this verse with Matthew's account.
