  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὗτος μὲν οὖν ἐκτήσατο χωρίον ἐκ μισθοῦ τῆς ἀδικίας, καὶ πρηνὴς γενόμενος ἐλάκησεν μέσος, καὶ ἐξεχύθη πάντα τὰ σπλάγχνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/018.yaml
  text: So this man acquired a field with the wages of unrighteousness[a], and falling headlong he burst open in the middle[c][b], and all his intestines spilled out.
translation:
  language: te
  text: అందుచేత ఇతడు అన్యాయం ద్వారా వచ్చిన కూలితో ఒక పొలాన్ని సంపాదించుకున్నాడు[a]. తలముందుగా పడిపోయి[b], నడుమున పగిలిపోయాడు; అతని పేగులన్నీ బయటికి కుమ్మరించబడ్డాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అన్యాయం ద్వారా వచ్చిన కూలితో’ అనే మాటను ‘దుష్కార్యానికి లభించిన ప్రతిఫలంతో’ అని కూడా అనువదించవచ్చు. గ్రీకు పదబంధం అన్యాయం వల్ల వచ్చిన చెల్లింపు లేదా ప్రతిఫలాన్ని సూచిస్తుంది. ఇక్కడ ‘సంపాదించుకున్నాడు’ అనేది యూదానే స్వయంగా నేరుగా కొన్నాడని తప్పనిసరిగా చెప్పదు; అతనికి సంబంధించిన డబ్బు ద్వారా ఆ పొలం అతని స్వాధీనమైనదిగా పరిగణించబడటాన్ని కూడా సూచించవచ్చు.
    reason: lexical_and_alternative_reading
  - marker: b
    text: లేదా ‘బోర్లా పడి.’ గ్రీకు పదబంధం తల ముందుగా పడటాన్ని లేదా బోర్లా ఉన్న స్థితిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτος μὲν οὖν
  choice: అందుచేత ఇతడు
  rationale: Οὗτος యూదాను తిరిగి సూచిస్తుంది; μέν οὖν కథనాన్ని కొనసాగిస్తూ పర్యవసాన భావాన్ని ఇస్తుంది. ‘అందుచేత ఇతడు’ ఆ అనుసంధానాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐκτήσατο
  choice: సంపాదించుకున్నాడు
  rationale: κτάομαι అనేది పొందడం లేదా స్వాధీనంలోకి తెచ్చుకోవడం అనే విస్తృత అర్థాన్ని ఇస్తుంది. ‘కొన్నాడు’ అని ప్రత్యక్ష కొనుగోలును నిర్బంధించకుండా మూలంలోని విస్తృతతను కాపాడుతుంది.
- source_word: χωρίον
  choice: ఒక పొలాన్ని
  rationale: χωρίον సాధారణంగా పొలం లేదా భూభాగాన్ని సూచిస్తుంది; ఈ సందర్భంలో ‘పొలం’ స్పష్టమైన, సహజమైన తెలుగు.
- source_word: ἐκ μισθοῦ τῆς ἀδικίας
  choice: తన అన్యాయపు ప్రతిఫలంతో
  rationale: μισθόςకు జీతం, కూలి, ప్రతిఫలం అనే అర్థాలున్నాయి; ἀδικία అన్యాయం లేదా దుష్కార్యాన్ని సూచిస్తుంది. ఇక్కడ ‘అన్యాయపు ప్రతిఫలం’ నైతిక తీవ్రతను నిలుపుతూ తెలుగులో సహజంగా ఉంది; ἐκ యొక్క సాధన/మూల భావాన్ని సందర్భానుసారంగా ‘తో’ తెలియజేస్తుంది.
- source_word: πρηνὴς γενόμενος
  choice: తలకిందులుగా పడిపోయి
  rationale: πρηνής బోర్లా లేదా తల ముందుగా ఉండే స్థితిని సూచిస్తుంది. సందర్భంలో ‘తలకిందులుగా పడిపోయి’ సంఘటనను సులభంగా గ్రహించగల రీతిలో చెబుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐλάκησεν μέσος
  choice: నడుమున పగిలిపోయాడు
  rationale: λακάω పగిలి తెరుచుకోవడాన్ని, μέσος మధ్య భాగాన్ని సూచిస్తాయి. ఈ అనువాదం మూలంలోని చిత్రణను సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: ἐξεχύθη
  choice: బయటికి వచ్చాయి
  rationale: ἐκχέω ఇక్కడ లోపలి అవయవాలు బయటికి కుమ్మరించబడినట్లు సూచిస్తుంది. తెలుగు వాక్యంలో ‘బయటికి వచ్చాయి’ సహజంగా ఉండి సంఘటనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: πάντα τὰ σπλάγχνα αὐτοῦ
  choice: అతని పేగులన్నీ
  rationale: σπλάγχνα అంతర్భాగాలు లేదా పేగులను సూచిస్తుంది. ‘పేగులు’ ఆధునిక పాఠకులకు స్పష్టమైన, సాధారణ పదం.
theological_decisions:
- issue: పొలం సంపాదించడంలో యూదా పాత్ర
  choice: ἐκτήσατοను ‘సంపాదించుకున్నాడు’ అని అనువదించి, అతడే నేరుగా కొనుగోలు చేశాడని నిర్దిష్టం చేయలేదు.
  alternative: ‘పొలాన్ని కొన్నాడు’; లేదా అతని డబ్బుతో/అతని పేరిట పొలం కొనబడిందని వివరణాత్మకంగా అనువదించడం.
  rationale: గ్రీకు క్రియ స్వాధీనం పొందడాన్ని విస్తృతంగా చెప్పగలదు. మత్తయి 27:5–8తో ఉన్న కథన సంబంధాన్ని అనువాదంలోనే సమన్వయపరచకుండా, మూలపాఠంలోని ఉద్వేగాన్ని నిలుపుతుంది.
- issue: πρηνὴς γενόμενος సూచించే శరీరస్థితి
  choice: ప్రధాన పాఠంలో ‘తలకిందులుగా పడిపోయి’ అని ఉంచాం.
  alternative: ‘బోర్లా పడి’ లేదా ‘బోర్లా ఉన్నవాడై.’
  rationale: పదబంధం తల ముందుగా పడటాన్ని గానీ బోర్లా స్థితిలో ఉండటాన్ని గానీ సూచించవచ్చు. ప్రధాన పాఠం సంభావ్య కథన భావాన్ని ఇస్తుంది; నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన కథన శైలి. మూలంలోని దృశ్య తీవ్రతను మృదువుచేయలేదు; అయితే అసహజమైన పదక్షర నిర్మాణాన్ని నివారించాం. ప్రతి పాదసూచిక సూచిక ప్రధాన పాఠంలో ఉంది.
