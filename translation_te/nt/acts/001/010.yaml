source:
  edition: SBLGNT
  text: καὶ ὡς ἀτενίζοντες ἦσαν εἰς τὸν οὐρανὸν πορευομένου αὐτοῦ, καὶ ἰδοὺ ἄνδρες δύο παρειστήκεισαν αὐτοῖς ἐν ⸂ἐσθήσεσι λευκαῖς⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/010.yaml
  text: And as they were gazing intently into heaven while he was going[a], behold, two men stood by them in white clothing[b],
translation:
  language: te
  text: ఆయన వెళ్తుండగా వారు ఆకాశం వైపు తదేకంగా చూస్తూ ఉన్నారు.[a] ఇదిగో, తెల్లని వస్త్రాలు ధరించిన ఇద్దరు పురుషులు[b] వారి పక్కన నిలిచి ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరలోకం వైపు.’ గ్రీకు పదం ‘ఆకాశం’ లేదా ‘పరలోకం’ అనే అర్థాల్లో ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తెల్లని దుస్తుల్లో’ లేదా ‘తెల్లని అంగీలు ధరించి.’ గ్రీకు పదం సాధారణంగా దుస్తులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίζοντες
  choice: తదేకంగా చూస్తూ
  rationale: ఈ వర్తమాన కృదంతం సాధారణంగా చూడడాన్ని కాకుండా, దృష్టిని నిలిపి శ్రద్ధగా చూస్తుండడాన్ని సూచిస్తుంది. ‘తదేకంగా చూస్తూ’ ఆ నిరంతర, కేంద్రీకృత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: οὐρανόν
  choice: ఆకాశం
  rationale: οὐρανός అనే పదానికి ‘ఆకాశం’ లేదా ‘పరలోకం’ అనే అర్థాలు రావచ్చు. ఇక్కడ వారు పైకి చూస్తున్న దృశ్య చర్యను ‘ఆకాశం వైపు’ సహజంగా వ్యక్తం చేస్తుంది; ఆరోహణ సందర్భంలోని పరలోక సంబంధాన్ని నిరాకరించదు.
- source_word: πορευομένου αὐτοῦ
  choice: ఆయన వెళ్తుండగా
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణం ఒకేసారి జరుగుతున్న చర్యను తెలియజేస్తుంది. ‘వెళ్తుండగా’ గ్రీకు పాఠ్యంలో లేని గమ్యాన్ని లేదా అదనపు వివరణను చేర్చకుండా కదలికను నిలుపుతుంది.
- source_word: ἰδοὺ
  choice: అప్పుడు ఇదిగో
  rationale: ἰδού తరువాతి అనూహ్య దృశ్యంపై పాఠకుని దృష్టిని ఆకర్షించే కథన సూచకం. ‘ఇదిగో’ దాని ఉద్దేశపూర్వక, గంభీరమైన బలాన్ని నిలుపుతుంది; ‘అప్పుడు’ తెలుగు కథన ప్రవాహాన్ని సహజం చేస్తుంది.
- source_word: ἄνδρες δύο
  choice: ఇద్దరు మనుషులు
  rationale: ἀνήρ ఇక్కడ పురుషులను సూచిస్తుంది; అయితే ఈ వచనంలోనే వారిని ‘దూతలు’ అని స్పష్టంగా గుర్తించదు. ‘ఇద్దరు మనుషులు’ మూలపాఠ్య ఉపరితల అర్థాన్ని నిలుపుతుంది.
- source_word: παρειστήκεισαν
  choice: వారి పక్కన నిలిచారు
  rationale: παρίστημι యొక్క ఈ రూపం వారు శిష్యుల పక్కన నిలిచి ఉన్నారని సూచిస్తుంది. ‘నిలిచారు’ సహజమైన తెలుగు; ‘ప్రత్యక్షమయ్యారు’ అనడం క్రియలో స్పష్టంగా లేని భావాన్ని చేర్చుతుంది.
- source_word: ἐσθήσεσι λευκαῖς
  choice: తెల్లని వస్త్రాలు ధరించిన
  rationale: ἐσθής సాధారణంగా దుస్తులు లేదా వస్త్రాలను సూచిస్తుంది. ‘తెల్లని వస్త్రాలు ధరించిన’ అనేది నిర్దిష్టంగా పొడవైన అంగీలని ఊహించకుండా సహజంగా దృశ్యాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ఆరోహణ సందర్భంలో οὐρανός అనువాదం
  choice: ఆకాశం
  alternative: పరలోకం
  rationale: ఈ పదం రెండింటినీ సూచించగలదు. ఈ వాక్యంలో εἰς‌తో కూడిన తదేకంగా చూడడం అనే భౌతిక దృశ్యానికి ‘ఆకాశం వైపు’ సహజంగా సరిపోతుంది. అదే సమయంలో ఆరోహణ యొక్క పరలోక గమ్యాన్ని సందర్భం ద్వారా గ్రహించడానికి వీలు ఉంచుతుంది; పదంలోని నిజమైన సందిగ్ధతను పాదసూచిక తెలియజేస్తుంది.
- issue: ఇద్దరు వ్యక్తుల గుర్తింపు
  choice: ఇద్దరు మనుషులు
  alternative: ఇద్దరు దేవదూతలు
  rationale: ఈ వచనంలోని గ్రీకు పాఠ్యం వారిని ἄνδρες, అంటే ‘మనుషులు/పురుషులు’ అని పిలుస్తుంది; ‘దేవదూతలు’ అని నేరుగా చెప్పదు. అందువల్ల సందర్భం సూచించగల గుర్తింపును ప్రధాన పాఠ్యంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. ‘తదేకంగా’ మూలంలోని కేంద్రీకృత దృష్టిని నిలుపుతుంది. ‘వస్త్రాలు’ గౌరవప్రదమైన సాధారణ పదం; ‘అంగీలు’ వంటి అధిక నిర్దిష్టతను నివారించింది. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
