translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి ఉపయోగించబడింది. మూలంలోని ఫలిత సంబంధం, కర్మణి ప్రయోగం, అలాగే διάλεκτοςలోని ‘భాష/మాండలికం’ అనిశ్చితి నిలుపబడ్డాయి. పాదసూచిక గుర్తులు సంబంధిత పదాలకే జోడించబడ్డాయి.
