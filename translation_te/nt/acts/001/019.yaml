id: ACT.1.19
reference: Acts 1:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ γνωστὸν ἐγένετο πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ, ὥστε κληθῆναι τὸ χωρίον ἐκεῖνο τῇ ⸀ἰδίᾳ διαλέκτῳ αὐτῶν Ἁκελδαμάχ, τοῦτ’ ἔστιν Χωρίον Αἵματος.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/019.yaml
  text: And it became known to all those living in Jerusalem[a], so that in their own language that field was called Akeldamach, that is[b], Field of Blood.
translation:
  language: te
  text: ఈ విషయం యెరూషలేములో నివసించే వారందరికీ తెలిసింది. దాంతో ఆ పొలం వారి సొంత భాషలో[b] “హకెల్దమాఖ్”[a] అని పిలువబడింది; అంటే “రక్తపు పొలం.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అనేక అనువాదాల్లో ఈ పేరు “అకెల్దమా” అని కనిపిస్తుంది; ఇక్కడి గ్రీకు రూపం Ἁκελδαμάχ (హకెల్దమాఖ్).
    reason: alternative_reading
  - marker: b
    text: లేదా “వారి సొంత మాండలికంలో.” గ్రీకు διάλεκτος అనే పదం ప్రాంతీయ మాండలికాన్ని లేదా సాధారణంగా ఒక భాషను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἐγένετο
  choice: తెలిసింది
  rationale: ఈ గ్రీకు అభివ్యక్తి ఒక సంగతి విస్తృతంగా తెలిసినదైందని సూచిస్తుంది. ఆధునిక తెలుగులో ‘తెలిసింది’ సహజంగా ఉండి, మూలంలో లేని అదనపు తీవ్రతను చేర్చదు.
- source_word: πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ
  choice: యెరూషలేములో నివసించే వారందరికీ
  rationale: κατοικοῦσιν అక్కడ స్థిరంగా నివసించేవారిని సూచిస్తుంది; ఈ రూపం అర్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: ὥστε
  choice: దాంతో
  rationale: ఇక్కడ ὥστε ఫలితాన్ని పరిచయం చేస్తుంది. ‘దాంతో’ కారణ-ఫలిత సంబంధాన్ని సహజంగా చూపిస్తుంది; కేవలం తార్కిక నిర్ధారణగా మార్చదు.
- source_word: κληθῆναι
  choice: పిలువబడింది
  rationale: మూలంలోని కర్మణి ప్రయోగాన్ని నిలుపుతూ, ఆ స్థలానికి ఆ పేరు వాడుకలోకి వచ్చిన ఫలితాన్ని తెలియజేస్తుంది.
- source_word: τὸ χωρίον ἐκεῖνο
  choice: ఆ పొలం
  rationale: χωρίον పొలం లేదా భూభాగాన్ని సూచించగలదు. అదే వాక్యంలో ఉన్న ‘రక్తపు పొలం’ అనే వివరణతో పదసంబంధాన్ని నిలుపుటకు ‘పొలం’ ఎంచుకోబడింది.
- source_word: τῇ ἰδίᾳ διαλέκτῳ αὐτῶν
  choice: వారి సొంత భాషలో
  rationale: διάλεκτος భాషను గానీ మాండలికాన్ని గానీ సూచించవచ్చు. ప్రధాన పాఠ్యంలో ‘భాష’ సాధారణ పాఠకులకు సహజం; ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: Ἁκελδαμάχ
  choice: హకెల్దమాక్
  rationale: SBLGNTలోని Ἁκελδαμάχ రూపాన్ని, ఆరంభ rough breathingతో సహా, తెలుగులో సన్నిహితంగా లిప్యంతరీకరించింది. పరిచితమైన సంక్షిప్త రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: τοῦτ’ ἔστιν
  choice: అంటే
  rationale: పేరు యొక్క వివరణను పరిచయం చేసే సూటి, సహజమైన తెలుగు రూపం.
- source_word: Χωρίον Αἵματος
  choice: రక్తపు పొలం
  rationale: గ్రీకు పాఠ్యమే ఇచ్చిన పేరర్థాన్ని నేరుగా, సహజమైన తెలుగు సమాసంతో అందిస్తుంది.
