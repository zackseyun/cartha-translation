id: ACT.1.22
reference: Acts 1:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου ἕως τῆς ἡμέρας ἧς ἀνελήμφθη ἀφ’ ἡμῶν, μάρτυρα τῆς ἀναστάσεως αὐτοῦ ⸂σὺν ἡμῖν γενέσθαι⸃ ἕνα τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/022.yaml
  text: beginning from the baptism of John until the day when he was taken up from us[b][a], one of these must become a witness with us of his resurrection.
translation:
  language: te
  text: యోహాను బాప్తిస్మం మొదలుకొని, ఆయన మన నుండి పైకి ఎత్తబడిన రోజు వరకు, వీరిలో ఒకడు మనతో కలిసి ఆయన పునరుత్థానానికి సాక్షి కావాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου
  choice: యోహాను బాప్తిస్మం మొదలుకొని
  rationale: కాలవ్యాప్తి ప్రారంభాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, ‘యోహాను బాప్తిస్మం’ అనే గ్రీకు షష్ఠీ నిర్మాణంలోని సంక్షిప్తతను నిలుపుతుంది.
- source_word: ἕως τῆς ἡμέρας ἧς
  choice: రోజు వరకు
  rationale: కాలవ్యాప్తి ముగింపు హద్దును తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνελήμφθη ἀφ’ ἡμῶν
  choice: ఆయన మన నుండి పైకి ఎత్తబడిన
  rationale: కర్తరి అర్థాన్ని చేర్చకుండా గ్రీకు కర్మణి రూపాన్నీ, పైకి తీసుకోబడిన భావాన్నీ నిలుపుతుంది; ‘పరలోకానికి’ అని మూలంలో లేని వివరాన్ని చేర్చదు.
- source_word: μάρτυρα τῆς ἀναστάσεως αὐτοῦ
  choice: ఆయన పునరుత్థానానికి సాక్షి
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని సహజమైన తెలుగు ప్రయోగంతో అందిస్తుంది; పునరుత్థానం గురించి సాక్ష్యమిచ్చే వ్యక్తి అనే భావం స్పష్టంగా ఉంటుంది.
- source_word: σὺν ἡμῖν γενέσθαι
  choice: మనతో కలిసి ... సాక్షి కావాలి
  rationale: కొత్తగా ఎంపికయ్యే వ్యక్తి ఇప్పటికే ఉన్న సాక్షుల సమూహంలో చేరడాన్ని తెలుపుతుంది. ‘కావాలి’ అనేది మునుపటి వచనంలోని δεῖ యొక్క కొనసాగుతున్న అవసర భావాన్ని అందిస్తుంది.
- source_word: ἕνα τούτων
  choice: వీరిలో ఒకడు
  rationale: మునుపటి వచనంలో పేర్కొన్న అభ్యర్థులలో ఒకరిని సూచిస్తుంది; తెలుగు లింగసమ్మతి సందర్భానుసారంగా సహజంగా ఉంటుంది.
theological_decisions:
- issue: మునుపటి వచనంలోని అవసర భావాన్ని సరఫరా చేయడం
  choice: ‘కావాలి’ అని అనువదించడం
  alternative: కేవలం ‘సాక్షి కావడం’ అని అసంపూర్ణంగా ఉంచడం
  rationale: ఈ వాక్యం 21వ వచనంలోని δεῖ (‘అవసరం’) మీద వాక్యనిర్మాణపరంగా ఆధారపడుతుంది. ‘కావాలి’ కొత్త సిద్ధాంతార్థాన్ని చేర్చకుండా ఆ అవసర భావాన్ని తెలుగులో పూర్తి చేస్తుంది.
- issue: యేసు పైకి తీసుకోబడిన సంఘటనను వర్ణించడం
  choice: ‘పైకి ఎత్తబడిన’
  alternative: ‘పరలోకానికి ఆరోహణమైన’
  rationale: గ్రీకు కర్మణి రూపాన్నీ దిశాసూచక భావాన్నీ కాపాడుతూ, ఈ వచనంలో ప్రత్యక్షంగా లేని ‘పరలోకానికి’ అనే వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా, సాధారణ పాఠకులకు స్పష్టంగా రూపొందించబడింది. ఈ వచనం 21వ వచనంతో వాక్యనిర్మాణపరంగా అనుసంధానమై ఉన్నందున, అక్కడి సహవాస భావాన్ని స్పష్టపరచడానికి ‘మనతో ఉన్న’ అని సహజ తెలుగులో వ్యక్తం చేయబడింది.
