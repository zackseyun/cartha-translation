id: ACT.1.12
reference: Acts 1:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε ὑπέστρεψαν εἰς Ἰερουσαλὴμ ἀπὸ ὄρους τοῦ καλουμένου Ἐλαιῶνος, ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ σαββάτου ἔχον ὁδόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/012.yaml
  text: Then they returned to Jerusalem from the mount called Olivet[a], which is near Jerusalem[b], a Sabbath day’s journey away.
translation:
  language: te
  text: అప్పుడు వారు ఒలీవల కొండ అని పిలువబడే పర్వతం నుండి యెరూషలేముకు తిరిగి వచ్చారు. అది యెరూషలేముకు సమీపంలో, ఒక విశ్రాంతి దిన ప్రయాణ దూరంలో[a] ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “విశ్రాంతి దిన ప్రయాణ దూరం” అంటే యూదుల ఆచారం ప్రకారం విశ్రాంతి దినాన ప్రయాణించడానికి అనుమతించబడిన ఆచారబద్ధమైన దూరం.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: తదుపరి సంఘటనను క్రమంలో పరిచయం చేసే సహజమైన తెలుగు కాలసూచక అనుసంధానం.
- source_word: ὑπέστρεψαν
  choice: తిరిగి వచ్చారు
  rationale: ὑποστρέφω అనే క్రియ ఇక్కడ ముందున్న స్థలానికి తిరిగి రావడాన్ని సూచిస్తుంది; తెలుగు కథనశైలిలో ఇది సహజం.
- source_word: εἰς Ἰερουσαλὴμ
  choice: యెరూషలేముకు
  rationale: εἰς గమ్యాన్ని సూచిస్తుంది; నగరనామంతో '-కు' సహజమైన తెలుగు ప్రయోగం.
- source_word: ἀπὸ ὄρους
  choice: కొండనుండి
  rationale: ἀπό బయలుదేరిన స్థలాన్ని, ὄρος ఎత్తైన భూభాగాన్ని సూచిస్తాయి; ఈ స్థలానికి 'కొండ' ఆధునిక తెలుగులో సహజం.
- source_word: τοῦ καλουμένου Ἐλαιῶνος
  choice: ఒలీవల కొండ అని పిలువబడే
  rationale: Ἐλαιῶνος అనే పేరులోని ఒలీవ చెట్ల సంబంధాన్ని పారదర్శకంగా ఉంచుతూ, మొత్తం స్థలాన్ని తెలుగులో సుపరిచితమైన పేరుగా వ్యక్తం చేస్తుంది.
- source_word: ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ
  choice: అది యెరూషలేముకు సమీపంలో ... ఉంది
  rationale: సంబంధవాక్యాన్ని సహజమైన తెలుగు స్వతంత్ర వాక్యంగా మార్చి, స్థల సామీప్యాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: σαββάτου ἔχον ὁδόν
  choice: విశ్రాంతి దినాన ప్రయాణించగల దూరంలో
  rationale: యూదుల విశ్రాంతి దిన ప్రయాణ పరిమితిని సూచించే సాంస్కృతిక నుడికారాన్ని అర్థవంతమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: σαββάτου ἔχον ὁδόν అనే యూదుల దూర నుడికారం
  choice: విశ్రాంతి దినాన ప్రయాణించగల దూరంలో
  alternative: విశ్రాంతి దిన ప్రయాణ దూరంలో
  rationale: ఇది ప్రధానంగా సాంస్కృతిక-పదార్థ సంబంధమైన నుడికారం. ఎంచుకున్న రూపం అనుమతించబడిన లేదా ఆచారబద్ధమైన ప్రయాణ పరిమితి భావాన్ని పాఠకునికి సహజంగా తెలియజేస్తుంది; ఖచ్చితమైన కొలతను వచనంలోకి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే కథనశైలి. గ్రీకు వాక్యంలోని స్థలసంబంధ సమాచారాన్ని సహజత కోసం రెండు తెలుగు వాక్యాలుగా విభజించాం. 'సబ్బాతు' కంటే అర్థపారదర్శకమైన 'విశ్రాంతి దినం'ను ఉపయోగించాం.
