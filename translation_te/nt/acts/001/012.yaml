- from: అప్పుడు వారు ఒలీవల కొండ అని పిలువబడే కొండనుండి యెరూషలేముకు తిరిగి వచ్చారు. అది యెరూషలేముకు సమీపంలో, విశ్రాంతి దినాన ప్రయాణించగల దూరంలో[a] ఉంది.
  to: అప్పుడు వారు ఒలీవల కొండ అని పిలువబడే పర్వతం నుండి యెరూషలేముకు తిరిగి వచ్చారు. అది యెరూషలేముకు సమీపంలో, ఒక విశ్రాంతి దిన ప్రయాణ దూరంలో[a] ఉంది.
