  text: λαβεῖν τὸν ⸀τόπον τῆς διακονίας ταύτης καὶ ἀποστολῆς, ⸀ἀφ’ ἧς παρέβη Ἰούδας πορευθῆναι εἰς τὸν τόπον τὸν ἴδιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/025.yaml
  text: to take the place of this ministry and apostleship[b][a], from which Judas turned aside to go to his own place.
translation:
  language: te
  text: యూదా దాని నుండి తప్పుకొని[a] తన సొంత స్థలానికి వెళ్లడానికి, ఈ పరిచర్య మరియు అపొస్తలత్వపు స్థానాన్ని స్వీకరించడానికి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాని నుండి వైదొలిగి,’ ‘దానిని విడిచిపెట్టి.’ గ్రీకు క్రియ పరిచర్య మరియు అపొస్తలత్వం నుండి తప్పిపోవడం లేదా దూరమవడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘తన సొంత స్థలం’ అనేది యూదాకు చెందిన గమ్యాన్ని సాధారణంగా సూచించవచ్చు; లేదా అతనికి తగిన తీర్పు స్థలాన్ని మరింత గంభీరంగా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: λαβεῖν
  choice: పొందడానికి
  rationale: ప్రార్థనలో కోరిన కార్యాన్ని తెలిపే ఈ క్రియ, ఖాళీ అయిన బాధ్యతను స్వీకరించడాన్ని సూచిస్తుంది. ‘పొందడానికి’ అనేది λαμβάνω యొక్క ప్రాథమిక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τὸν τόπον
  choice: తన స్థానాన్ని
  rationale: τόπος అక్షరార్థంగా ‘స్థలం’; ఇక్కడ పరిచర్యలోని పాత్ర లేదా స్థానాన్ని రూపకాలంకారంగా సూచిస్తుంది. ‘స్థానం’ ఆధునిక తెలుగులో సహజంగా ఉండి, వాక్యాంతంలోని ‘స్థలం’తో భావసంబంధాన్ని నిలుపుతుంది.
- source_word: τῆς διακονίας ταύτης
  choice: ఈ పరిచర్యలో
  rationale: διακονία సేవ లేదా పరిచర్యను సూచిస్తుంది. అపొస్తలుల అప్పగింత సందర్భంలో ‘పరిచర్య’ సముచితమైనది; షష్ఠీ విభక్తిని తెలుగులో సహజమైన సంబంధార్థక ‘లో’తో వ్యక్తం చేశాం.
- source_word: καὶ ἀποστολῆς
  choice: అపొస్తలత్వంలోనూ
  rationale: ἀποστολή ఇక్కడ సాధారణ పంపకం కంటే అపొస్తలుని అప్పగింత/పదవిని సూచిస్తుంది. ‘అపొస్తలత్వం’ ఆ ప్రత్యేక పాత్రను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἀφ’ ἧς
  choice: దాని నుండి
  rationale: సంబంధ సర్వనామం ముందున్న పరిచర్య మరియు అపొస్తలత్వాన్ని సమష్టిగా సూచిస్తుంది. ఏకవచన గ్రీకు నిర్మాణాన్ని ‘దాని నుండి’ నిలుపుతుంది.
- source_word: παρέβη
  choice: తప్పుకొని
  rationale: παραβαίνω ఇక్కడ నియమిత పాత్ర నుండి పక్కకు తొలగడం లేదా దానిని విడిచిపెట్టడం అనే భావం కలిగి ఉంది. ‘తప్పుకొని’ ఉల్లంఘన, వైదొలగడం రెండింటి ఛాయలను అతిగా నిర్ణయించకుండా ఉంచుతుంది.
- source_word: πορευθῆναι
  choice: వెళ్లిపోయాడు
  rationale: πορεύομαι యొక్క సాధారణ గమనార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది; సందర్భంలో యూదా వెళ్లిపోవడాన్ని సూచిస్తుంది.
- source_word: εἰς τὸν τόπον τὸν ἴδιον
  choice: తన సొంత స్థలానికి
  rationale: గ్రీకు పదబంధం సంక్షిప్తంగానూ ఉద్దేశపూర్వకంగా అస్పష్టంగానూ ఉంది. ‘తన సొంత స్థలానికి’ దాని అస్పష్టతను నిలుపుతూ తీర్పు లేదా సమాధి అని ముందే నిర్ణయించదు.
theological_decisions:
- issue: యూదా ‘తన సొంత స్థలానికి’ వెళ్లాడనే మాటలోని గమ్యం
  choice: ప్రధాన పాఠ్యంలో ‘తన సొంత స్థలానికి’ అనే అస్పష్టమైన వ్యక్తీకరణను నిలుపడం.
  alternative: దీనిని మరణం/సమాధి, నరకం/తీర్పు, లేదా యూదాకు తగిన గమ్యం అని స్పష్టీకరించడం.
  rationale: εἰς τὸν τόπον τὸν ἴδιον గమ్యాన్ని నిర్దిష్టంగా నిర్వచించదు. అందువల్ల మూలపాఠంలోని ధార్మిక ఉద్వేగాన్ని పరిష్కరించకుండా అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పరిచర్య,’ ‘అపొస్తలత్వం’ వంటి సందర్భోచిత సంఘపర పదాలను వాడినా, ‘తన సొంత స్థలం’ అనే మూలపాఠపు అస్పష్టతను వ్యాఖ్యానంతో తొలగించలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
