revisions:
- from: ఈ పరిచర్యలోనూ అపొస్తలత్వంలోనూ తన స్థానాన్ని పొందడానికి—యూదా దాని నుండి తప్పుకొని[a] తన సొంత స్థలానికి వెళ్లిపోయాడు[b].
  to: యూదా దాని నుండి తప్పుకొని[a] తన సొంత స్థలానికి వెళ్లడానికి, ఈ పరిచర్య మరియు అపొస్తలత్వపు స్థానాన్ని స్వీకరించడానికి[b].
  rationale: «తన స్థానాన్ని»లోని మూలంలో లేని స్వత్వాన్ని తొలగించి, τὸν τόπον τῆς διακονίας ταύτης καὶ ἀποστολῆςను «ఈ పరిచర్య మరియు అపొస్తలత్వపు స్థానం»గా అనువదించాం. యూదా ఆ పరిచర్య/అపొస్తలత్వం నుండి తప్పుకొని తన సొంత స్థలానికి వెళ్లాడనే సంబంధాన్ని వాక్యక్రమం స్పష్టపరుస్తుంది. ప్రధాన పాఠ్యం ‘తన సొంత స్థలం’ యొక్క గమ్య-అస్పష్టతను మార్చదు.
