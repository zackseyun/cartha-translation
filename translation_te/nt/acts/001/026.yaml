  verdict: revise
  source_fidelity: The draft correctly conveys the lot-selection procedure, the lot’s falling to Matthias, and his being reckoned with the eleven. However, «ఆ ఇద్దరి కోసం» makes the referent more explicit than the Greek αὐτοῖς (‘for them’), and the spelling of Matthias should follow established Telugu biblical name usage as «మత్తీయా».
  naturalness: The narrative is clear and idiomatic modern standard Telugu. «చీట్లు వేశారు» and «చీటి ... పడింది» are natural expressions for selection by lot. «వారికోసం» is both natural and closer to the source’s unelaborated pronoun.
  terminology: «చీట్లు/చీటి» accurately represents κλῆροι/κλῆρος in this context. «లెక్కించబడ్డాడు» appropriately renders συγκατεψηφίσθη without implying a theological mechanism beyond being counted or enrolled with the group. «అపొస్తలులు» is retained as the conventional term.
  issues:
  - severity: low
    issue: The phrase «ఆ ఇద్దరి కోసం» expands αὐτοῖς.
    rationale: The immediate context identifies two candidates, so the expansion does not alter the likely referent; nevertheless, «వారికోసం» preserves the Greek pronoun’s wording and avoids unnecessary explicitness.
  - severity: medium
    issue: The personal name is spelled «మత్తీయ» rather than conventional Telugu biblical «మత్తీయా».
    rationale: Using the established Telugu biblical form improves name consistency and permits the natural construction «మత్తీయాపై» for ἐπὶ Μαθθίαν.
  revised_text: వారు వారికోసం చీట్లు వేశారు; చీటి మత్తీయాపై పడింది. అతడు పదకొండు మంది అపొస్తలులతో పాటు లెక్కించబడ్డాడు.[a]
