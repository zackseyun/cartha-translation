  text: καὶ ἔδωκαν κλήρους ⸀αὐτοῖς, καὶ ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν, καὶ συγκατεψηφίσθη μετὰ τῶν ἕνδεκα ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/026.yaml
  text: And they cast lots for them[a], and the lot fell to Matthias[b], and he was counted with the eleven apostles.
translation:
  language: te
  text: వారు వారికోసం చీట్లు వేశారు; చీటి మత్తీయాపై పడింది. అతడు పదకొండు మంది అపొస్తలులతో పాటు లెక్కించబడ్డాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు పదకొండు మంది అపొస్తలులలో ఒకనిగా పరిగణించబడ్డాడు”; లేదా, “అతడు పదకొండు మంది అపొస్తలులకు చేర్చబడ్డాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν κλήρους αὐτοῖς
  choice: ఆ ఇద్దరి కోసం చీట్లు వేశారు
  rationale: గ్రీకు పదబంధం అక్షరార్థంగా ‘వారికి చీట్లు ఇచ్చారు’ అని ఉన్నా, సందర్భంలో ఇద్దరు అభ్యర్థుల మధ్య ఎంపిక కోసం చీట్లు వేసిన చర్యను సూచిస్తుంది. తెలుగులో ఈ భావానికి ‘చీట్లు వేశారు’ సహజమైన ప్రయోగం; αὐτοῖς సూచించే ఇద్దరినీ స్పష్టంగా తెలియజేయడానికి ‘ఆ ఇద్దరి కోసం’ వాడబడింది.
- source_word: κλήρους / ὁ κλῆρος
  choice: చీట్లు / చీటి
  rationale: ఇక్కడ κλῆρος వాటా లేదా స్వాస్థ్యభాగం కాదు; ఎంపిక కోసం ఉపయోగించిన చీటిని సూచిస్తుంది.
- source_word: ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν
  choice: చీటి మత్తీయకు పడింది
  rationale: చీట్లు వేసిన ఫలితం మత్తీయను సూచించిందనే గ్రీకు రూపకాన్ని సహజమైన తెలుగు నుడికారంలో నిలుపుతుంది.
- source_word: Μαθθίαν
  choice: మత్తీయ
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: συγκατεψηφίσθη
  choice: లెక్కించబడ్డాడు
  rationale: ఈ క్రియ ఒక సమూహంతో కలిపి లెక్కించబడడం లేదా వారిలో ఒకనిగా పరిగణించబడడం అనే భావాన్ని ఇస్తుంది. ‘లెక్కించబడ్డాడు’ మూలానికి దగ్గరగా ఉండి, ‘చేర్చబడ్డాడు’ కంటే తక్కువ వ్యాఖ్యానాత్మకంగా ఉంటుంది.
- source_word: μετὰ τῶν ἕνδεκα ἀποστόλων
  choice: పదకొండు మంది అపొస్తలులతో పాటు
  rationale: μετά + genitive యొక్క ‘తో’ అనే సహవాస భావాన్ని ‘తో పాటు’ సహజంగా వ్యక్తపరుస్తుంది; మత్తీయను అప్పటివరకు ఉన్న పదకొండు మందితో కలిపి లెక్కించినట్టు తెలియజేస్తుంది.
theological_decisions:
- issue: συγκατεψηφίσθη అనే పదాన్ని దైవ నియామకంపై మూలపాఠం చెప్పేదానికంటే బలమైన భావం వచ్చేలా అనువదించాలా?
  choice: అతడు పదకొండు మంది అపొస్తలులతో పాటు లెక్కించబడ్డాడు
  alternative: అతడు పదకొండు మంది అపొస్తలులకు చేర్చబడ్డాడు
  rationale: వచనం చీటి ఫలితం తరువాత మత్తీయ సమూహంతో కలిపి లెక్కించబడినట్టు చెబుతుంది. ‘లెక్కించబడ్డాడు’ అనే అనువాదం సంఘటనను నివేదిస్తూ, దాని కంటే బలమైన సంఘశాస్త్రీయ లేదా ఆచారసంబంధ నిర్ణయాన్ని దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘చీట్లు వేశారు,’ ‘చీటి ... పడింది’ వంటి సాధారణ నుడికారాలు ఎంపిక విధానాన్ని స్పష్టంగా తెలియజేస్తాయి. మూలంలోని మూడు సమన్విత క్రియలను తెలుగులో చదవడానికి అనుకూలంగా రెండు వాక్యాలుగా అమర్చినా భావక్రమం యథాతథంగా ఉంచబడింది.
