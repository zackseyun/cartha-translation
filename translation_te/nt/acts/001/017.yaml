source:
  edition: SBLGNT
  text: ὅτι κατηριθμημένος ἦν ⸀ἐν ἡμῖν καὶ ἔλαχεν τὸν κλῆρον τῆς διακονίας ταύτης.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/017.yaml
  text: For he was numbered among us and received a share in this ministry[a].
translation:
  language: te
  text: ఎందుకంటే అతడు మనలో ఒకడిగా లెక్కించబడ్డాడు; ఈ పరిచర్యలో ఒక భాగాన్ని పొందాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ పరిచర్యలో కేటాయించబడిన వాటాను పొందాడు.” గ్రీకు పదమైన κλῆροςకు “చీటి ద్వారా నిర్ణయించబడిన వాటా” లేదా “భాగం/వాటా” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: సందర్భంలో పేతురు ముందటి ప్రకటనకు కారణాన్ని వివరిస్తున్నాడు; అందువల్ల కారణార్థక అనుసంధానం సహజంగా ఉంటుంది.
- source_word: κατηριθμημένος ἦν
  choice: లెక్కించబడ్డాడు
  rationale: ఈ పరిభాషాత్మక క్రియారూపం యూదా అపొస్తలుల సమూహంలో లెక్కింపబడిన స్థితిని తెలియజేస్తుంది; కర్మణి భావాన్ని కూడా నిలుపుతుంది.
- source_word: ἐν ἡμῖν
  choice: మనలో ఒకడిగా
  rationale: కేవలం సమీపంలో ఉండడం కాకుండా సమూహంలో నిజమైన సభ్యత్వాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔλαχεν
  choice: పొందాడు
  rationale: λαγχάνω ఇక్కడ కేటాయింపుగా దక్కడం లేదా భాగం పొందడం అనే భావాన్ని కలిగి ఉంది; ప్రధాన వాక్యంలో సహజమైన పదాన్ని వాడి, ప్రత్యేక భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: τὸν κλῆρον
  choice: ఒక భాగాన్ని
  rationale: κλῆρος అక్షరార్థంగా ‘చీటి’ అని, విస్తృతార్థంగా కేటాయించబడిన భాగం లేదా వాటా అని అర్థమవుతుంది. ఈ సందర్భంలో పరిచర్యలో భాగస్వామ్యాన్ని ‘ఒక భాగం’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: τῆς διακονίας ταύτης
  choice: ఈ పరిచర్యలో
  rationale: అపొస్తల సంబంధమైన సేవను సూచించే διακονίαకు ‘పరిచర్య’ గౌరవప్రదమైన, విస్తృతంగా అర్థమయ్యే తెలుగు పదం; ‘భాగం’తో ‘లో’ సహజంగా సరిపోతుంది.
theological_decisions:
- issue: అపొస్తల పరిచర్యతో యూదాకు ఉన్న సంబంధం
  choice: అతడు వారిలో ఒకడిగా నిజంగా లెక్కించబడి, ఈ పరిచర్యలో భాగం పొందాడని పాఠ్యం చెప్పే భావాన్ని నిలుపడం.
  alternative: అతడు కేవలం ఆ సమూహంతో సంబంధం కలిగి ఉన్నాడని బలహీనంగా అనువదించడం.
  rationale: κατηριθμημένος ἐν ἡμῖν మరియు ἔλαχεν τὸν κλῆρον అనే పదబంధాలు సభ్యత్వం, భాగస్వామ్యం రెండింటినీ స్పష్టంగా తెలియజేస్తాయి. అయితే అతని ఆమోదం లేదా చివరివరకు నిలకడ గురించి పాఠ్యానికి మించిన సిద్ధాంత నిర్ణయాన్ని అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మనలో ఒకడిగా’ సమూహ సభ్యత్వాన్ని స్పష్టం చేస్తుంది; ‘పరిచర్య’ అపొస్తల సేవ అనే భావాన్ని నిలుపుతుంది.
