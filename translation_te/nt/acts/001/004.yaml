id: ACT.1.4
reference: Acts 1:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ συναλιζόμενος παρήγγειλεν αὐτοῖς ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι, ἀλλὰ περιμένειν τὴν ἐπαγγελίαν τοῦ πατρὸς ἣν ἠκούσατέ μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/004.yaml
  text: And while staying with them[a], he ordered them not to depart from Jerusalem, but to wait for the promise of the Father, which you heard from me.
translation:
  language: te
  text: 'ఆయన వారితో కలిసి ఉన్నప్పుడు[a], వారికి ఇలా ఆజ్ఞాపించాడు: “యెరూషలేమును విడిచి వెళ్లకుండా, మీరు నా నుండి విన్న తండ్రి వాగ్దానం కోసం వేచి ఉండండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారితో సమావేశమైనప్పుడు”; కొందరు దీనిని “వారితో భోజనం చేస్తున్నప్పుడు” అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναλιζόμενος
  choice: వారితో కలిసి ఉన్నప్పుడు
  rationale: ఈ కృదంతం యొక్క ఖచ్చితమైన భావం వివాదాస్పదమైనా, యేసు అపొస్తలులతో కలిసి ఉన్నాడనే సందర్భార్థం స్పష్టం. ఈ అనువాదం ప్రత్యేకంగా భోజనం చేయడం లేదా సమావేశమవడం అని నిర్ణయించకుండా మూలంలోని అనిశ్చితిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: παρήγγειλεν
  choice: ఆజ్ఞాపించాడు
  rationale: ఈ క్రియ అధికారపూర్వకమైన ఆదేశాన్ని సూచిస్తుంది; ‘బోధించాడు’ లేదా ‘సూచించాడు’ కంటే ‘ఆజ్ఞాపించాడు’ దాని బలాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι
  choice: యెరూషలేమును విడిచి వెళ్లకుండా
  rationale: నగరం నుండి వేరై వెళ్లకూడదనే స్థానిక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: περιμένειν
  choice: వేచి ఉండండి
  rationale: ఎదురుచూస్తూ ఉండాలనే భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τὴν ἐπαγγελίαν τοῦ πατρὸς
  choice: తండ్రి వాగ్దానం
  rationale: మూలంలోని సంబంధాన్ని సంక్షిప్తంగా నిలుపుతూ, అది తండ్రి చేసిన వాగ్దానమా లేక ఆయనకు సంబంధించిన వాగ్దానమా అనే వ్యాకరణ సంబంధాన్ని అనవసరంగా విస్తరించదు.
- source_word: ἣν ἠκούσατέ μου
  choice: మీరు నా నుండి విన్న
  rationale: ἀκούω తరువాతి షష్ఠీ విభక్తి సర్వనామాన్ని సహజంగా ‘నా నుండి’ అని అందిస్తుంది; విన్న విషయాన్ని మూలం కంటే ఎక్కువగా వివరించదు.
theological_decisions:
- issue: పునరుత్థానానంతరం యేసు చేసిన కార్యానికి సంబంధించి συναλιζόμενος అర్థం
  choice: ‘వారితో కలిసి ఉన్నప్పుడు’ అనే సాధారణ అర్థం
  alternative: ‘వారితో సమావేశమైనప్పుడు’ లేదా ‘వారితో భోజనం చేస్తున్నప్పుడు’
  rationale: మూలపదం వివాదాస్పదమైనందున యేసు భోజనం చేశాడని లేదా కేవలం సమావేశమయ్యాడని ప్రధాన పాఠ్యంలో నిర్ణయించడం లేదు. సాధారణ అనువాదం సందర్భాన్ని నిలుపుతుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ప్రత్యక్ష ఆజ్ఞను ఉద్ధరణలో ఉంచడం ద్వారా దీర్ఘ గ్రీకు వాక్యాన్ని తెలుగులో స్పష్టంగా అందించాం; మూలంలోని భావసంబంధం మార్చలేదు.
