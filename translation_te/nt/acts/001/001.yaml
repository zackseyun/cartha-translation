source:
  edition: SBLGNT
  text: Τὸν μὲν πρῶτον λόγον ἐποιησάμην περὶ πάντων, ὦ Θεόφιλε, ὧν ἤρξατο ⸀ὁ Ἰησοῦς ποιεῖν τε καὶ διδάσκειν
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/001.yaml
  text: In the first account[a], O Theophilus, I wrote about all that Jesus began both to do and to teach,
translation:
  language: te
  text: థియొఫిలా, యేసు చేయడం, బోధించడం రెండింటినీ మొదలుపెట్టిన సమస్త విషయాల గురించి నేను నా మొదటి వృత్తాంతాన్ని[a] రాశాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా మునుపటి వృత్తాంతాన్ని’ లేదా ‘నా మొదటి గ్రంథాన్ని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸν μὲν πρῶτον λόγον
  choice: నా మొదటి గ్రంథంలో
  rationale: λόγος ఇక్కడ ఒక్క మాటను కాక, లూకా ముందుగా రచించిన లిఖిత వృత్తాంతాన్ని సూచిస్తుంది. తెలుగు సందర్భంలో ‘మొదటి గ్రంథం’ సహజంగా ఉండి πρῶτον యొక్క క్రమార్థాన్ని నిలుపుతుంది; μέν తరువాతి కొనసాగింపుకు నేపథ్యాన్ని ఏర్పరుస్తుంది.
- source_word: ἐποιησάμην
  choice: రాశాను
  rationale: λόγος తో కలిసి ఈ క్రియ ఒక లిఖిత రచనను రూపొందించడాన్ని సూచిస్తుంది; ‘రాశాను’ ఆధునిక తెలుగులో స్పష్టమైన సహజ సమానార్థకం.
- source_word: περὶ πάντων ... ὧν
  choice: వాటన్నిటి గురించి
  rationale: περί జనిటివ్ విషయాన్ని సూచిస్తుంది; πάντων మరియు ὧν మధ్య సంబంధాన్ని ‘వాటన్నిటి గురించి’ సహజంగా వ్యక్తపరుస్తుంది, కథన పరిధికి మించి సంపూర్ణతను అతిశయింపజేయదు.
- source_word: ὦ Θεόφιλε
  choice: థియొఫిలా
  rationale: ὦ ప్రత్యక్ష సంబోధనను సూచిస్తుంది. తెలుగు సంబోధన రూపం ఆ శక్తిని సహజంగా చూపుతుంది; మూలంలో లేని ‘ప్రియ’ వంటి భావాన్ని చేర్చదు.
- source_word: ἤρξατο
  choice: మొదలుపెట్టిన
  rationale: ‘ప్రారంభించాడు’ అనే మూలార్థాన్ని స్పష్టంగా నిలుపుతుంది; అపొస్తలుల కార్యాలలో యేసు పని కొనసాగుతుందనే సంభావ్య సూచనను వివరణాత్మకంగా విస్తరించదు.
- source_word: ὁ Ἰησοῦς
  choice: యేసు
  rationale: వ్యక్తి పేరుకు ప్రామాణిక తెలుగు రూపం.
- source_word: ποιεῖν τε καὶ διδάσκειν
  choice: చేయడం, బోధించడం
  rationale: τε καί కలిపే రెండు సమాంతర క్రియలను తెలుగు జత నిర్మాణంలో ఉంచుతుంది. ‘చేయడం’ అనే విస్తృత పదం యేసు కార్యాలు మరియు బోధ మధ్య మూలపాఠంలోని భేదాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ἤρξατο (‘మొదలుపెట్టిన’) అపొస్తలుల కార్యాలలో యేసు పని కొనసాగడాన్ని సూచించవచ్చనే భావం
  choice: ప్రధాన పాఠంలో ‘మొదలుపెట్టిన’ అని నిలుపుతూ, కొనసాగింపును వివరించి చెప్పకపోవడం.
  alternative: ‘యేసు చేసినవాటి గురించి, బోధించినవాటి గురించి’ అని ‘మొదలుపెట్టిన’ను వదలడం; లేదా అపొస్తలుల ద్వారా కొనసాగించాడని స్పష్టంగా పారాఫ్రేజ్ చేయడం.
  rationale: గ్రీకు పాఠంలో ‘మొదలుపెట్టాడు’ స్పష్టంగా ఉంది. అది కొనసాగింపును సూచించవచ్చు, కాని అనువాదం ఆ ధార్మిక సూచనను పరిష్కరించి విస్తరించకుండా మూలంలోని ఉద్వేగాన్ని నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. ‘ఓ థియొఫిలా’ అనే కృత్రిమ సంబోధనకు బదులు సహజ తెలుగు సంబోధన విభక్తి వాడబడింది. మూలంలోని ఒక్క వాక్య ప్రవాహం, ‘మొదలుపెట్టిన’ అనే ఉద్దేశపూర్వక భావం నిలుపబడ్డాయి.
