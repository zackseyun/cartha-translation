- from: వారు లోపలికి వచ్చినప్పుడు, తాము బస చేస్తున్న మేడగదికి ఎక్కి వెళ్లారు. అక్కడ ఉన్నవారు పేతురు, యోహాను, యాకోబు, అంద్రెయ; ఫిలిప్పు, తోమా; బర్తొలొమయి, మత్తయి; అల్ఫయి కుమారుడైన యాకోబు, జెలోతు అని పిలువబడిన సీమోను, యాకోబు కుమారుడైన యూదా[a].
  to: 'వారు లోపలికి ప్రవేశించిన తరువాత, వారు బస చేస్తున్న పై అంతస్తులోని గదికి ఎక్కి వెళ్లారు: పేతురు, యోహాను, యాకోబు, అంద్రెయ; ఫిలిప్పు, తోమా; బర్తొలొమయి, మత్తయి; అల్ఫయి కుమారుడైన యాకోబు, జెలోతు సీమోను, యాకోబు కుమారుడైన యూదా[a].'
  rationale: The revision retains the draft’s likely patronymic renderings while preserving the ambiguity of Judas’s relationship in the footnote. It renders the room as an ordinary upstairs room, removes an added list-introduction phrase, and makes the footnote’s explanation of the Greek genitive more accurate and idiomatic.
