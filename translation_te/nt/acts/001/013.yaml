id: ACT.1.13
reference: Acts 1:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὅτε εἰσῆλθον, ⸂εἰς τὸ ὑπερῷον ἀνέβησαν⸃ οὗ ἦσαν καταμένοντες, ὅ τε Πέτρος καὶ ⸂Ἰωάννης καὶ Ἰάκωβος⸃ καὶ Ἀνδρέας, Φίλιππος καὶ Θωμᾶς, Βαρθολομαῖος καὶ Μαθθαῖος, Ἰάκωβος Ἁλφαίου καὶ Σίμων ὁ ζηλωτὴς καὶ Ἰούδας Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/013.yaml
  text: 'And when they had entered[a], they went up to the upstairs room where they were staying: Peter, John, James, and Andrew; Philip and Thomas; Bartholomew and Matthew; James the son of Alphaeus, and Simon the Zealot, and Judas the son of James.'
translation:
  language: te
  text: 'వారు లోపలికి ప్రవేశించిన తరువాత, వారు బస చేస్తున్న పై అంతస్తులోని గదికి ఎక్కి వెళ్లారు: పేతురు, యోహాను, యాకోబు, అంద్రెయ; ఫిలిప్పు, తోమా; బర్తొలొమయి, మత్తయి; అల్ఫయి కుమారుడైన యాకోబు, జెలోతు సీమోను, యాకోబు కుమారుడైన యూదా[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యాకోబు సోదరుడైన యూదా.’ గ్రీకు మూలంలో ‘యాకోబు యొక్క యూదా’ అని మాత్రమే ఉంది; వారి మధ్య ఉన్న ఖచ్చితమైన సంబంధాన్ని అది స్పష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσῆλθον
  choice: వారు లోపలికి వచ్చినప్పుడు
  rationale: ὅτεతో కూడిన కాలవాచక ఉపవాక్యాన్ని సహజమైన తెలుగు క్రమంలో వ్యక్తం చేస్తుంది; ప్రధాన క్రియకు ముందు జరిగిన ప్రవేశాన్ని సందర్భమే స్పష్టం చేస్తుంది.
- source_word: εἰς τὸ ὑπερῷον ἀνέβησαν
  choice: మేడగదికి ఎక్కి వెళ్లారు
  rationale: ἀνέβησανలోని పైకి వెళ్లే కదలికను ‘ఎక్కి వెళ్లారు’ నిలుపుతుంది; ὑπερῷονను సాధారణ పాఠకునికి స్పష్టమైన ‘మేడగది’గా అందిస్తుంది.
- source_word: οὗ ἦσαν καταμένοντες
  choice: తాము బస చేస్తున్న
  rationale: కొంతకాలం అక్కడే ఉండడాన్ని తెలిపే καταμένω భావాన్ని సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: Ἰάκωβος Ἁλφαίου
  choice: అల్ఫయి కుమారుడైన యాకోబు
  rationale: పురుషుల పేర్ల జాబితాలో ఈ సంబంధవిభక్తి సాధారణంగా తండ్రి-కొడుకు గుర్తింపును సూచిస్తుంది; తెలుగులో సంబంధాన్ని స్పష్టంగా చెప్పడం సహజం.
- source_word: Σίμων ὁ ζηλωτὴς
  choice: జెలోతు అని పిలువబడిన సీమోను
  rationale: ζηλωτήςను కేవలం వ్యక్తిగత ‘ఉత్సాహం’గా వ్యాఖ్యానించకుండా, గుర్తింపు బిరుదుగా నిలుపుతుంది; ‘అని పిలువబడిన’ అనే పదబంధం దాని బిరుదు స్వభావాన్ని స్పష్టం చేస్తుంది.
- source_word: Ἰούδας Ἰακώβου
  choice: యాకోబు కుమారుడైన యూదా
  rationale: ఈ పేర్ల జాబితాలో తండ్రి పేరుతో గుర్తించడం ఎక్కువ సంభావ్యమైన అర్థం; అయితే గ్రీకు మూలంలో సంబంధం స్పష్టంగా చెప్పబడనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: Ἰούδας Ἰακώβουలో సూచించిన సంబంధం
  choice: యాకోబు కుమారుడైన యూదా
  alternative: యాకోబు సోదరుడైన యూదా
  rationale: Ἰακώβου అనే సంబంధవిభక్తి మాత్రమే ఉన్నందున ‘కుమారుడు’ లేదా ‘సోదరుడు’ అని మూలపాఠం ప్రత్యక్షంగా చెప్పదు. పురుషుల గుర్తింపు జాబితాలో తండ్రి పేరుగా అర్థం చేసుకోవడం ఎక్కువ సంభావ్యమైనది; నిజమైన అస్పష్టతను పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకునికి సులభంగా ఉండే శైలి. పేర్ల సమూహాలను అర్ధవిరామాలతో చూపించి గ్రీకు జాబితా లయను అతిగా అనుకరించకుండా నిర్మాణాన్ని నిలిపాం. ‘పైగది’ వంటి సంప్రదాయపరమైన ప్రత్యేక అనుబంధం కలిగించగల పదానికి బదులు సాధారణ నిర్మాణార్థాన్ని తెలిపే ‘మేడగది’ వాడాం.
