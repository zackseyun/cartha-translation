source:
  edition: SBLGNT
  text: καὶ ταῦτα εἰπὼν βλεπόντων αὐτῶν ἐπήρθη καὶ νεφέλη ὑπέλαβεν αὐτὸν ἀπὸ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/009.yaml
  text: And after he said these things[a], as they were watching, he was lifted up[c][b], and a cloud took him out of their sight.
translation:
  language: te
  text: ఆయన ఈ మాటలు చెప్పిన తర్వాత, వారు చూస్తుండగా ఆయన పైకి ఎత్తబడ్డాడు.[a] ఒక మేఘం ఆయనను వారి దృష్టి నుండి తీసుకుపోయింది.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన పైకి తీసుకోబడ్డాడు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఒక మేఘం ఆయనను స్వీకరించి, వారి దృష్టికి దూరం చేసింది.”
    reason: lexical_alternative
  - marker: c
    text: బైబిలులోని కొన్ని సంఘటనల్లో మేఘం దేవుని సాన్నిధ్యాన్ని సూచిస్తుంది. ఇక్కడ కూడా ఆ ప్రతిధ్వని ఉండవచ్చు; అయితే ఈ వచనం దానిని స్పష్టంగా చెప్పదు.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: తరువాత
  rationale: ఇక్కడ καὶ కథనాన్ని ముందటి మాటలతో కలుపుతుంది. తెలుగు వాక్య నిర్మాణంలో εἰπών సూచించే క్రమాన్ని కలిపి ‘చెప్పిన తరువాత’ అనడం సహజంగా ఉంటుంది; అదనపు కారణార్థాన్ని చేర్చదు.
- source_word: ταῦτα εἰπὼν
  choice: ఈ మాటలు చెప్పిన తరువాత
  rationale: ταῦτα బహువచనంగా యేసు ఇంతకుముందు పలికిన మాటలను సూచిస్తుంది; aorist participle ప్రధాన క్రియకు ముందుగా జరిగిన కార్యాన్ని తెలియజేస్తుంది.
- source_word: βλεπόντων αὐτῶν
  choice: వారు చూస్తుండగానే
  rationale: Genitive absolute వారు చూస్తున్న సమయంలోనే ఈ సంఘటన జరిగిందని తెలియజేస్తుంది. ‘చూస్తుండగానే’ ఆ కొనసాగుతున్న ప్రత్యక్ష వీక్షణను సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ἐπήρθη
  choice: ఆయన పైకి ఎత్తబడ్డాడు
  rationale: ἐπαίρω యొక్క కర్మణి రూపం పైకి ఎత్తబడడాన్ని సూచిస్తుంది. ఈ అనువాదం దృశ్యమైన పైకి కదలికను, కర్మణి భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: νεφέλη
  choice: ఒక మేఘం
  rationale: మూలంలో నిర్దిష్ట ఉపపదం లేని ఏకవచన నామవాచకం. కాబట్టి ప్రధాన పాఠ్యంలో ప్రత్యేకమైన దైవసాన్నిధ్య మేఘమని ముందే నిర్ధారించకుండా ‘ఒక మేఘం’ అని అనువదించబడింది.
- source_word: ὑπέλαβεν
  choice: తీసుకుపోయింది
  rationale: ఈ క్రియకు ‘తీసుకోవడం/స్వీకరించడం’ అనే భావాలు ఉన్నాయి. సందర్భంలో మేఘం ఆయనను వారి చూపు నుండి తొలగించిన ఫలితాన్ని ‘తీసుకుపోయింది’ సహజంగా తెలియజేస్తుంది; ‘స్వీకరించింది’ అనే ప్రత్యామ్నాయం అడుగుసూచికలో ఉంచబడింది.
- source_word: ἀπὸ τῶν ὀφθαλμῶν αὐτῶν
  choice: వారి చూపు నుండి
  rationale: అక్షరార్థంగా ‘వారి కళ్ల నుండి’; ఇక్కడ కనిపించకుండా పోవడాన్ని సూచించే నుడికారం. ‘వారి చూపు నుండి’ మూల రూపకాన్ని కొంత నిలుపుతూ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: ἐπήρθηను సంప్రదాయ ఆరోహణ సూత్రంలా అనువదించాలా
  choice: ఆయన పైకి ఎత్తబడ్డాడు
  alternative: ఆయన పైకి తీసుకోబడ్డాడు
  rationale: మూలపదం కనిపించే పైకెత్తబడడాన్ని, కర్మణి భావాన్ని తెలియజేస్తుంది. ప్రధాన పాఠ్యం తరువాతి సిద్ధాంతపరమైన సూత్రీకరణను చేర్చకుండా ఈ కథన భాషనే నిలుపుతుంది.
- issue: νεφέληకు దైవసాన్నిధ్యాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా ఆపాదించాలా
  choice: ఒక మేఘం
  alternative: దైవసాన్నిధ్యాన్ని సూచించే మేఘం
  rationale: బైబిలు ఇతర సందర్భాల్లో మేఘం దేవుని సాన్నిధ్యంతో సంబంధం కలిగి ఉండవచ్చు; అయితే ఈ వచనం ఆ అర్థాన్ని స్పష్టంగా చెప్పదు. అందువల్ల సంభావ్య ప్రతిధ్వనిని అడుగుసూచికలో మాత్రమే సూచించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘వారు చూస్తుండగానే’ ప్రత్యక్ష సాక్ష్య భావాన్ని సహజంగా నిలుపుతుంది. ‘పైకి ఎత్తబడ్డాడు’ మరియు ‘ఒక మేఘం’ మూలంలోని కర్మణి నిర్మాణం, అనిర్దిష్టత, theological restraint‌ను కాపాడుతాయి.
