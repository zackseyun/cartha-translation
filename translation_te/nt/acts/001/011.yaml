id: ACT.1.11
reference: Acts 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἳ καὶ εἶπαν· Ἄνδρες Γαλιλαῖοι, τί ἑστήκατε ⸀βλέποντες εἰς τὸν οὐρανόν; οὗτος ὁ Ἰησοῦς ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν εἰς τὸν οὐρανὸν οὕτως ἐλεύσεται ὃν τρόπον ἐθεάσασθε αὐτὸν πορευόμενον εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/011.yaml
  text: They also said[a], “Men of Galilee, why do you stand looking into heaven? This Jesus, who was taken up from you into heaven, will come in the same way that you saw him going into heaven.”
translation:
  language: te
  text: 'వారు కూడా ఇలా అన్నారు: “గలిలయ పురుషులారా, మీరు ఆకాశం వైపు చూస్తూ ఎందుకు నిలబడి ఉన్నారు? మీ దగ్గరనుండి పరలోకానికి ఎత్తుకొనిపోబడిన ఈ యేసు[a], మీరు ఆయన పరలోకానికి వెళ్తుండగా చూసిన విధంగానే వస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంప్రదాయంగా, “ఈ అదే యేసు.” గ్రీకు పాఠంలో స్పష్టంగా “ఈ యేసు” అని ఉంది; “అదే” అనేది ఆయన వ్యక్తిగత ఐక్యతను నొక్కిచెప్పే వ్యాఖ్యానాత్మక విస్తరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Γαλιλαῖοι
  choice: గలిలయ పురుషులారా
  rationale: సంబోధనలోని పురుష బహువచనాన్ని, గలిలయ ప్రాంతీయ గుర్తింపును నేరుగా నిలుపుతుంది.
- source_word: τί ἑστήκατε βλέποντες εἰς τὸν οὐρανόν
  choice: మీరు ఆకాశం వైపు చూస్తూ ఎందుకు నిలబడి ఉన్నారు?
  rationale: ἑστήκατε యొక్క ప్రస్తుత స్థితి భావాన్ని ‘నిలబడి ఉన్నారు’తో, βλέποντες అనే అనుబంధ క్రియను ‘చూస్తూ’తో సహజంగా వ్యక్తం చేస్తుంది. ఇక్కడ చూపు దిశను సూచించే సందర్భంలో ‘ఆకాశం వైపు’ సహజం.
- source_word: οὗτος ὁ Ἰησοῦς
  choice: ఈ యేసే
  rationale: οὗτος అనే సూచనను ‘ఈ’గా నేరుగా అనువదిస్తూ, తెలుగు దృష్ట్యర్థక ‘ఏ’ ద్వారా సూచింపబడిన వ్యక్తి ఆయనే అనే బలాన్ని చూపుతుంది; గ్రీకులో లేని ‘అదే’ అనే పదాన్ని చేర్చదు.
- source_word: ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν εἰς τὸν οὐρανὸν
  choice: మీ దగ్గరనుండి పరలోకానికి చేర్చబడిన
  rationale: ἀναλημφθείς యొక్క కర్మణి భావాన్ని, శిష్యుల సమక్షం నుండి వేరుపడటాన్ని, గమ్యాన్ని నిలుపుతుంది.
- source_word: οὕτως ἐλεύσεται ὃν τρόπον
  choice: చూసిన విధంగానే తిరిగి వస్తాడు
  rationale: οὕτως ... ὃν τρόπον తెలిపే విధానసామ్యాన్ని ‘విధంగానే’ సహజంగా తెలియజేస్తుంది. సందర్భం పునరాగమనాన్ని సూచిస్తున్నందున ‘తిరిగి వస్తాడు’ తెలుగు భాషలో సహజం.
- source_word: ἐθεάσασθε αὐτὸν πορευόμενον
  choice: మీరు ఆయన ... వెళ్లడం చూసిన
  rationale: θεάομαιను అతిశయించకుండా ‘చూసిన’గా, πορεύομαιను ‘వెళ్లడం’గా స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: οὐρανός పదానికి దృశ్య ఆకాశం లేదా పరలోకం అనే భావం
  choice: చూపు దిశలో ‘ఆకాశం’; యేసు వెళ్లిన గమ్యానికి ‘పరలోకం’
  alternative: రెండు చోట్లా ‘పరలోకం’ లేదా ‘ఆకాశం’
  rationale: మొదటి ప్రయోగం శిష్యులు పైకి చూస్తున్న దృశ్య దిశను సూచిస్తుంది; తదుపరి ప్రయోగాలు ఆరోహణ గమ్యాన్ని సూచిస్తాయి. ఒకే గ్రీకు పదం సందర్భానుసారం కలిగిన భావవ్యత్యాసాన్ని తెలుగు సహజంగా ప్రతిబింబిస్తుంది.
- issue: οὗτος ὁ Ἰησοῦςలో వ్యక్తిగత ఐక్యతను ఎలా తెలియజేయాలి
  choice: ఈ యేసే
  alternative: ఇదే యేసు / ఈ అదే యేసు
  rationale: గ్రీకు పాఠంలోని సూచనార్థాన్ని, బలాన్ని నిలుపుతూ, మూలంలో స్పష్టంగా లేని ‘అదే’ అనే విస్తరణను ప్రధాన పాఠంలో నివారిస్తుంది; సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- issue: ἐλεύσεταιను సాధారణ ‘వస్తాడు’గా లేదా పునరాగమనార్థకంగా అనువదించడం
  choice: తిరిగి వస్తాడు
  alternative: వస్తాడు
  rationale: ఇప్పుడే వెళ్లిన యేసు భవిష్యత్తులో వచ్చే పోలికా నిర్మాణంలో తెలుగు ‘తిరిగి వస్తాడు’ సహజంగా అంతర్లీన పునరాగమనాన్ని వ్యక్తం చేస్తుంది; వేరే విధానాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, బహిరంగ పఠనానికి అనువైన శైలి. ‘గలిలయ పురుషులారా’ మూలంలోని పురుషలింగ సంబోధనను నిలుపుతుంది. ‘ఆకాశం’ మరియు ‘పరలోకం’ ఎంపికలు ఒకే οὐρανός పదానికి సందర్భానుగుణ దృశ్య-గమ్య భావాలను వేరు చేస్తాయి.
