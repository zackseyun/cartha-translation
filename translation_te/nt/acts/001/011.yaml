  to: 'వారు కూడా ఇలా అన్నారు: “గలిలయ పురుషులారా, మీరు ఆకాశం వైపు చూస్తూ ఎందుకు నిలబడి ఉన్నారు? మీ దగ్గరనుండి పరలోకానికి ఎత్తుకొనిపోబడిన ఈ యేసు[a], మీరు ఆయన పరలోకానికి వెళ్తుండగా చూసిన విధంగానే వస్తాడు.”'
