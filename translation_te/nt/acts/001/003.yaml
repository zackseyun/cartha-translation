source:
  edition: SBLGNT
  text: οἷς καὶ παρέστησεν ἑαυτὸν ζῶντα μετὰ τὸ παθεῖν αὐτὸν ἐν πολλοῖς τεκμηρίοις, δι’ ἡμερῶν τεσσεράκοντα ὀπτανόμενος αὐτοῖς καὶ λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/003.yaml
  text: To them he also presented himself alive after he had suffered[a], by many proofs[b], appearing to them over forty days and speaking about the kingdom of God.
translation:
  language: te
  text: ఆయన బాధలు అనుభవించిన తరువాత, అనేక రుజువుల ద్వారా[a] తనను సజీవుడిగా వారికి చూపించాడు. నలభై రోజుల వ్యవధిలో[b] ఆయన వారికి కనిపిస్తూ, దేవుని రాజ్యం గురించి మాట్లాడాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అనేక ఆధారాలతో’ లేదా ‘అనేక నిశ్చయకరమైన రుజువులతో.’ గ్రీకు పదం నిశ్చయాన్ని కలిగించే సాక్ష్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నలభై రోజులపాటు.’ ఈ మాట ఆ కాలవ్యాప్తంగా ఆయన పలుమార్లు కనిపించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: వారికి
  rationale: ఇది ముందటి వచనంలోని అపొస్తలులను సూచించే బహువచన సంబంధసర్వనామం. గ్రీకులో లేని ‘పురుషులు’ అనే పదాన్ని చేర్చకుండా సహజమైన తెలుగులో అనువదించబడింది.
- source_word: παρέστησεν ἑαυτὸν ζῶντα
  choice: తాను సజీవుడిగా ఉన్నాడని వారికి చూపించాడు
  rationale: యేసు తనను తాను సజీవునిగా వారి ఎదుట ప్రత్యక్షపరచుకున్నాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μετὰ τὸ παθεῖν αὐτὸν
  choice: ఆయన బాధలు అనుభవించిన తరువాత
  rationale: μετάతో కూడిన ఆర్టిక్యులర్ ఇన్ఫినిటివ్ కాలక్రమాన్ని, అంటే బాధల తరువాత జరిగినదాన్ని, స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν πολλοῖς τεκμηρίοις
  choice: అనేక రుజువుల ద్వారా
  rationale: τεκμήριον నిశ్చయాన్ని స్థాపించే సాక్ష్యం లేదా రుజువును సూచిస్తుంది. ‘ద్వారా’ ఇక్కడి సాధనార్థక భావాన్ని తెలియజేస్తుంది.
- source_word: δι’ ἡμερῶν τεσσεράκοντα
  choice: నలభై రోజుల కాలంలో
  rationale: διά + షష్ఠీ విభక్తి ఆ కాలవ్యాప్తిలో జరిగిన ప్రత్యక్షతలను సూచిస్తుంది; నిరంతరంగా నలభై రోజులు కనిపించాడనే భావాన్ని కలిగించదు.
- source_word: ὀπτανόμενος αὐτοῖς
  choice: ఆయన వారికి కనిపిస్తూ
  rationale: పునరుత్థాన సందర్భంలో ὀπτάνομαι సాధారణంగా ‘కనిపించు/ప్రత్యక్షమవు’ అనే అర్థాన్ని ఇస్తుంది.
- source_word: λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: దేవుని రాజ్యం గురించి మాట్లాడాడు
  rationale: τὰ περὶ అనే గ్రీకు ప్రయోగాన్ని పదేపదే కాకుండా, దాని విషయార్థాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: βασιλείας τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: βασιλείαలో రాజపాలన మరియు రాజ్య పరిధి రెండింటి భావసాధ్యత ఉంది; ‘దేవుని రాజ్యం’ ఈ రెండింటినీ తెరిచి ఉంచే స్థిరమైన తెలుగు ప్రయోగం.
theological_decisions:
- issue: పునరుత్థానానంతర సజీవ ప్రత్యక్షత మరియు దాని రుజువు
  choice: యేసు బాధల తరువాత సజీవుడిగా ఉన్నాడని అనేక రుజువుల ద్వారా చూపించాడని సూటిగా అనువదించబడింది.
  alternative: ‘తప్పులేని రుజువులతో’ లేదా ‘నమ్మదగిన రుజువులతో’ అని విశేషణాన్ని చేర్చడం.
  rationale: గ్రీకు పాఠం సజీవ ప్రత్యక్షతకు బలమైన ఆధారాలున్నాయని చెబుతుంది; అయితే మూలంలో లేని అదనపు విశేషణాన్ని ప్రధాన పాఠంలో చేర్చలేదు.
- issue: οἷς యొక్క లింగ సూచన
  choice: వారికి
  alternative: ఈ పురుషులకు
  rationale: సందర్భంలో సూచించబడినవారు అపొస్తలులే అయినా, గ్రీకు పదంలో ‘పురుషులు’ అనే నామవాచకం లేదు. అందువల్ల దగ్గరి రూపసామ్యంతో కూడిన సహజ తెలుగు ఎంపికను వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. పొడవైన గ్రీకు వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; భావసంబంధం యథాతథంగా ఉంచాం.
