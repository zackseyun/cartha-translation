source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ πρὸς αὐτούς· Οὐχ ὑμῶν ἐστιν γνῶναι χρόνους ἢ καιροὺς οὓς ὁ πατὴρ ἔθετο ἐν τῇ ἰδίᾳ ἐξουσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/007.yaml
  text: But he said to them[b][a], “It is not for you to know times or seasons that the Father has set by his own authority.”
translation:
  language: te
  text: అయితే ఆయన వారితో, “తండ్రి తన సొంత అధికారంలో[b] నిర్ణయించి ఉంచిన కాలాలనో సమయాలనో[a] తెలుసుకోవడం మీ వంతు కాదు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కాలవ్యవధులనో నియమిత సమయాలనో.” గ్రీకులో χρόνοι, καιροί అనే రెండు సంబంధిత కాలసూచక పదాలు ఉన్నాయి; మొదటిది కాలవ్యవధులను, రెండవది తగిన లేదా నిర్ణీత సందర్భాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “తన సొంత అధికారంతో.” గ్రీకు పదబంధానికి అక్షరార్థంగా “తన సొంత అధికారంలో” అని చెప్పవచ్చు; ఈ విషయాలను నిర్ణయించి ఉంచే అధికారం తండ్రికే ఉందని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: శిష్యుల ప్రశ్న నుంచి యేసు ఇచ్చే సరిదిద్దే జవాబుకు ఉన్న స్వల్ప వ్యతిరేకతతో కూడిన సంభాషణా మార్పును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: Οὐχ ὑμῶν ἐστιν γνῶναι
  choice: తెలుసుకోవడం మీకు చెందిన విషయం కాదు
  rationale: ఈ జ్ఞానం శిష్యులకు చెందిన పరిధి లేదా హక్కు కాదనే గ్రీకు నుడికార భావాన్ని, ‘మీ పని కాదు’ అనే అనవసర కాఠిన్యం లేకుండా వ్యక్తపరుస్తుంది.
- source_word: χρόνους ἢ καιρούς
  choice: కాలాలనో సమయాలనో
  rationale: వ్యవధులు లేదా కాలపరంపరలను సూచించగల χρόνοι, తగిన లేదా నిర్ణీత సమయాలను సూచించగల καιροί అనే సంబంధిత రెండు పదాల మధ్య తేడాను సరళంగా నిలుపుతుంది; వాటిని కఠిన సాంకేతిక వర్గాలుగా మార్చదు.
- source_word: ὁ πατὴρ
  choice: తండ్రి
  rationale: గ్రీకులో ఉన్న దైవసంబంధ బిరుదును ‘నా తండ్రి’ అని విస్తరించకుండా యథాతథంగా ఉంచుతుంది.
- source_word: ἔθετο
  choice: నిర్ణయించిన
  rationale: τίθημι ఇక్కడ స్థాపించడం, నిర్దేశించడం లేదా నిర్ణయించడం అనే భావంలో ఉంది; తెలుగు సందర్భంలో ‘నిర్ణయించిన’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ἐν τῇ ἰδίᾳ ἐξουσίᾳ
  choice: తన సొంత అధికార పరిధిలో
  rationale: ἐν అనే ‘లో’ భావాన్నీ, ἰδίᾳ అనే ‘తన సొంత’ భావాన్నీ, ἐξουσία అనే అధికారం/హక్కు భావాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: χρόνοι / καιροί అనే కాలసూచక పదజంట అనువాదం
  choice: కాలాలనో సమయాలనో
  alternative: కాలవ్యవధులనో నియమిత సమయాలనో
  rationale: మూలంలో సంబంధితమైనప్పటికీ వేర్వేరు పదాలు ఉన్నాయి. ప్రధాన పాఠం ఆ తేడాను సంక్షిప్తంగా ఉంచుతూ, యేసు మాటలకు మించిన ఊహాత్మక కాలవ్యవస్థను నిర్మించదు.
- issue: తండ్రికి సంబంధించి ἐν τῇ ἰδίᾳ ἐξουσίᾳ అనువాదం
  choice: తన సొంత అధికార పరిధిలో
  alternative: తన సొంత అధికారంతో
  rationale: కాలాలు, సమయాలు తండ్రి స్వాధికార పరిధిలో ఉన్నాయనే భావాన్ని నిలుపుతుంది; అదే సమయంలో ‘తో’ అనే సాధనార్థక అనువాదం కూడా సాధ్యమని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన వాక్యనిర్మాణంతో అనువదించబడింది. ‘మీకు చెందిన విషయం కాదు’ అనే రూపం మూల నుడికారంలోని పరిధి/అధికార భావాన్ని నిలుపుతుంది. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదసూచికల వద్దనే ఉంచబడ్డాయి.
