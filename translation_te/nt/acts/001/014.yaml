id: ACT.1.14
reference: Acts 1:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτοι πάντες ἦσαν προσκαρτεροῦντες ὁμοθυμαδὸν τῇ ⸀προσευχῇ σὺν γυναιξὶν καὶ ⸀Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ καὶ ⸀σὺν τοῖς ἀδελφοῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/014.yaml
  text: All of these were continually devoting themselves with one accord to prayer[a], together with the women, and Mary the mother of Jesus[c][b], and with his brothers.
translation:
  language: te
  text: వీరందరూ స్త్రీలతో[b], యేసు తల్లి మరియతో, ఆయన సోదరులతో[c] కలిసి ఏకమనస్సుతో[a] ప్రార్థనలో పట్టుదలగా కొనసాగుతూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఒకే మనసుతో’ లేదా ‘ఐక్యంగా.’ గ్రీకు పదం వారి ఉమ్మడి ఉద్దేశాన్ని, ఐక్యతను నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆ స్త్రీలతో.’ గ్రీకులో నిర్దిష్ట ఉపపదం లేదు; సందర్భంలో వీరు శిష్యులతో సంబంధమున్న, వారికి తెలిసిన స్త్రీల సమూహం కావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘సోదరులు’ అనేది గ్రీకు ἀδελφοί (అదెల్ఫోయ్) అనే పదానికి అనువాదం. కొందరు దీన్ని సమీప బంధువులు అనే విస్తృత అర్థంలో గ్రహిస్తారు; ఇక్కడ పాఠం వారి ఖచ్చితమైన బంధుత్వాన్ని మరింత వివరించదు.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι πάντες
  choice: వీరందరూ
  rationale: οὗτοι లోని సూచన భావాన్ని, πάντες లోని సమగ్రతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἦσαν προσκαρτεροῦντες
  choice: పట్టుదలగా కొనసాగుతూ ఉన్నారు
  rationale: పరిభాషాత్మక అసంపూర్ణ భూతకాల నిర్మాణంలోని నిరంతర చర్యను, προσκαρτερέω లోని స్థిరమైన పట్టుదలను రెండింటినీ కాపాడుతుంది.
- source_word: ὁμοθυμαδόν
  choice: ఏకమనస్సుతో
  rationale: కేవలం ఒకేచోట ఉండడం కాక, ఉమ్మడి ఉద్దేశం మరియు మనసుల ఐక్యత అనే లూకా వాడుకలోని బలమైన భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: τῇ προσευχῇ
  choice: ప్రార్థనలో
  rationale: προσκαρτερέω తో వచ్చిన దత్తి విభక్తిని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, వారు నిరంతరం చేసిన కార్యాన్ని స్పష్టపరుస్తుంది.
- source_word: σὺν γυναιξίν
  choice: స్త్రీలతో
  rationale: గ్రీకులో నిర్దిష్ట ఉపపదం లేనందున దానిని అనవసరంగా చేర్చకుండా, σύν లోని సహవాస భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ
  choice: యేసు తల్లి మరియతో
  rationale: మరియను గుర్తించే సమానాధికార వివరణను సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది.
- source_word: σὺν τοῖς ἀδελφοῖς αὐτοῦ
  choice: ఆయన సోదరులతో
  rationale: ἀδελφοί అనే పుంలింగ బహువచనానికి సహజమైన ప్రత్యక్ష సమానార్థకాన్ని వాడుతూ, వారి ఖచ్చితమైన కుటుంబ సంబంధంపై అదనపు నిర్ణయం చేయదు.
theological_decisions:
- issue: యేసు యొక్క ἀδελφοί ఎవరనే ప్రశ్న
  choice: ఆయన సోదరులు
  alternative: ఆయన సమీప బంధువులు లేదా కుటుంబ సంబంధీకులు
  rationale: ἀδελφοί సాధారణంగా ‘సోదరులు’ అని అర్థమవుతుంది; అయితే వారి ఖచ్చితమైన కుటుంబ సంబంధం గురించి క్రైస్తవ సంప్రదాయాల్లో భిన్న అభిప్రాయాలు ఉన్నాయి. అందువల్ల ప్రధాన పాఠం గ్రీకు పదానికి సూటిగా ఉండగా, పాదసూచిక విస్తృత బంధుత్వ అర్థానికి ఉన్న అవకాశాన్ని మాత్రమే తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యక్రమం వాడినా, మూలంలోని నిరంతర ప్రార్థన, పట్టుదల, ఐక్యత అనే మూడు భావాలనూ నిలిపింది. మర్యాదపూర్వకమైన ‘ఆయన’ వాడుక ద్వారా యేసును సూచించింది; భాష మతశాఖాపరమైన ప్రత్యేక పదజాలాన్ని నివారిస్తుంది.
