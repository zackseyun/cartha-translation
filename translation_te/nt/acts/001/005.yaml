    text: లేదా, “పవిత్రాత్మతో.” గ్రీకు ఉపసర్గానికి “లో” లేదా “తో” అనే అర్థాలు రావచ్చు.
    reason: alternative_reading
  revision_rationale: The revision corrects the temporal expression to retain the explicit ‘not many days’ sense of the Greek while preserving the contrast, future passive, established baptism terminology, and the unresolved semantic range of ἐν. The footnote is retained with more precise grammatical wording.
