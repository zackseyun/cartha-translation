id: ACT.1.5
reference: Acts 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ ⸂ἐν πνεύματι βαπτισθήσεσθε⸃ ἁγίῳ οὐ μετὰ πολλὰς ταύτας ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/005.yaml
  text: For John baptized with water[a], but you will be baptized in the Holy Spirit not many days from now.
translation:
  language: te
  text: ఎందుకంటే యోహాను నీళ్లతో బాప్తిస్మం ఇచ్చాడు; అయితే మీరు ఇక కొద్దిరోజుల్లోనే పవిత్రాత్మలో[a] బాప్తిస్మం పొందుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పవిత్రాత్మతో.” గ్రీకు ఉపసర్గానికి “లో” లేదా “తో” అనే అర్థాలు రావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలోని వాగ్దానానికి వివరణ లేదా ఆధారాన్ని పరిచయం చేసే సంబంధాన్ని సహజమైన తెలుగులో చూపిస్తుంది.
- source_word: ἐβάπτισεν
  choice: బాప్తిస్మమిచ్చాడు
  rationale: స్థిరపడిన మతపరమైన పదాన్ని నిలుపుతూ, బాప్తిస్మ విధానాన్ని ‘ముంచాడు’ అని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: ὕδατι
  choice: నీళ్లతో
  rationale: దత్తివిభక్తిలోని సాధనార్థాన్ని సహజంగా వ్యక్తపరుస్తూ, తరువాతి ἐν πνεύματι పదబంధంతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: పవిత్రాత్మలో
  rationale: ἐν అనే విభక్త్యుపసర్గాన్ని పారదర్శకంగా ప్రతిబింబించి, పరిధి అనే భావానికీ సాధనం అనే భావానికీ మధ్య ఉన్న నిజమైన సందిగ్ధతను నిలుపుతుంది.
- source_word: βαπτισθήσεσθε
  choice: బాప్తిస్మం పొందుతారు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని సహజమైన తెలుగులో చూపిస్తూ, క్రియను చేసేవారిని గ్రీకు మూలంలాగే పేర్కొనకుండా ఉంచుతుంది.
- source_word: οὐ μετὰ πολλὰς ταύτας ἡμέρας
  choice: ఇక ఎంతో కాలం గడవకముందే
  rationale: ‘ఈ రోజుల తరువాత ఎక్కువ రోజులు కాకుండానే’ అనే కాలసూచక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ἐν πνεύματι ἁγίῳ అనే బాప్తిస్మ పదబంధం అనువాదం
  choice: పవిత్రాత్మలో
  alternative: పవిత్రాత్మతో
  rationale: ἐν పరిధిని లేదా సాధనాన్ని సూచించవచ్చు. ‘పవిత్రాత్మలో’ అనే ప్రధాన పాఠం గ్రీకు నిర్మాణాన్ని మరింత ప్రత్యక్షంగా నిలుపుతుంది; ‘పవిత్రాత్మతో’ అనే సాధనార్థ పఠనాన్ని పాదసూచికలో ఉంచడం ద్వారా వేదాంతపరమైన ఉద్రిక్తతను ఏకపక్షంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘బాప్తిస్మం’ అనే స్థిరపడిన పదం ఉపయోగించబడింది; మూలంలోని వేదాంతపరమైన సందిగ్ధత పాదసూచికతో భద్రపరచబడింది.
