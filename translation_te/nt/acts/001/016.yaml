  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రసంగ శైలిని ఉపయోగించింది. ‘పురుషులైన సోదరులారా’ అనే సంబోధన మూలంలోని రెండు పుంలింగ పదాలను నిలుపుతుంది; ‘దారి చూపేవాడిగా మారిన’ అనే రూపం యూదా పాత్రను సహజంగా, అతివ్యాఖ్యానం లేకుండా వ్యక్తం చేస్తుంది.
