  text: Ἄνδρες ἀδελφοί, ἔδει πληρωθῆναι τὴν ⸀γραφὴν ἣν προεῖπε τὸ πνεῦμα τὸ ἅγιον διὰ στόματος Δαυὶδ περὶ Ἰούδα τοῦ γενομένου ὁδηγοῦ τοῖς συλλαβοῦσιν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/016.yaml
  text: Men[a], brothers, it was necessary for the Scripture to be fulfilled, which the Holy Spirit spoke beforehand through the mouth of David concerning Judas, who became a guide to those who arrested Jesus[c][b],
translation:
  language: te
  text: “పురుషులైన సోదరులారా, యేసును పట్టుకున్నవారికి[c] మార్గదర్శిగా అయిన యూదా గురించి పరిశుద్ధాత్మ దావీదు నోటి ద్వారా[b] ముందుగానే పలికిన[a] లేఖనం నెరవేరవలసి ఉండింది.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ముందుగానే చెప్పిన’; ఈ క్రియను ‘ముందుగా ప్రవచించిన’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘దావీదు నోటి ద్వారా’; ఒక మానవ మాధ్యమం ద్వారా పలికిన మాటను సూచించే నుడికారం.
    reason: cultural_note
  - marker: c
    text: లేదా ‘యేసును బలవంతంగా అదుపులోకి తీసుకున్నవారికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: పురుషులైన సోదరులారా
  rationale: రెండు పుంలింగ సంబోధన పదాలనూ నిలుపుతూ, వాటిని రెండు వేర్వేరు గుంపులుగా అపార్థం చేసుకోకుండా సహజమైన తెలుగు సంబోధనగా ఇచ్చింది.
- source_word: ἔδει
  choice: నెరవేరవలసి ఉండింది
  rationale: దైవ నిర్ణయం లేదా ముందస్తు నియతి ఎలా పనిచేసిందో అదనంగా వివరించకుండా, మూలంలోని అవసర భావాన్నీ భూతకాల దృక్కోణాన్నీ నిలుపుతుంది.
- source_word: πληρωθῆναι τὴν γραφὴν
  choice: లేఖనం నెరవేరవలసి
  rationale: లూకా–అపొస్తలుల కార్యములలోని లేఖన నెరవేర్పు భాషను, కర్మణి భావాన్ని నిలుపుతుంది.
- source_word: προεῖπε
  choice: ముందుగానే పలికిన
  rationale: ‘ముందుగా చెప్పాడు’ అనే ప్రాథమిక అర్థాన్ని నిలుపుతూ, తప్పనిసరిగా సాంకేతిక ప్రవచన పదాన్ని చేర్చదు.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: పరిశుద్ధాత్మ
  rationale: ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా అర్థమయ్యే దైవ నామరూపం.
- source_word: διὰ στόματος Δαυὶδ
  choice: దావీదు నోటి ద్వారా
  rationale: పరిశుద్ధాత్మను వక్తగా, దావీదును మానవ మాధ్యమంగా చూపే మూలంలోని సజీవమైన ప్రయోగాన్ని నిలుపుతుంది.
- source_word: τοῦ γενομένου ὁδηγοῦ
  choice: దారి చూపేవాడిగా మారిన
  rationale: γενομένου లోని ‘అయ్యాడు/మారాడు’ భావాన్ని, ὁδηγός లోని మార్గం చూపే భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τοῖς συλλαβοῦσιν Ἰησοῦν
  choice: యేసును పట్టుకున్నవారికి
  rationale: అరెస్టు సందర్భంలోని ‘పట్టుకోవడం/అదుపులోకి తీసుకోవడం’ భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: లేఖనం నెరవేరవలసిన అవసర స్వభావం
  choice: ‘నెరవేరవలసి ఉండింది’ అని మాత్రమే పేర్కొనడం
  alternative: ‘దైవ ముందస్తు నిర్ణయం వల్ల తప్పక అలా జరగాల్సి వచ్చింది’ అని విస్తరించడం
  rationale: వాక్యం అవసరాన్ని ప్రకటిస్తుంది గాని, దైవ సార్వభౌమత్వం మరియు మానవ బాధ్యత మధ్య సంబంధాన్ని ఇక్కడ వివరించదు; అనువాదం ఆ ఉద్వేగాన్ని అలాగే ఉంచుతుంది.
- issue: దైవ మరియు మానవ వక్తృత్వం
  choice: ‘పరిశుద్ధాత్మ దావీదు నోటి ద్వారా ... పలికిన’
  alternative: ‘దావీదు పరిశుద్ధాత్మ ప్రేరణతో రాసిన’
  rationale: గ్రీకు వాక్యం పరిశుద్ధాత్మను మాట్లాడినవానిగా, దావీదును మాధ్యమంగా పేర్కొంటుంది; ‘రాసిన’ అని మార్చకుండా రెండు స్థాయుల కార్యసాధకత్వాన్నీ నిలుపుతుంది.
