id: ACT.1.24
reference: Acts 1:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ προσευξάμενοι εἶπαν Σὺ κύριε καρδιογνῶστα πάντων, ἀνάδειξον ὃν ἐξελέξω, ἐκ τούτων τῶν δύο ἕνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/024.yaml
  text: And after praying[a], they said, “You, Lord, knower of the hearts of all[b], show which one of these two you have chosen,”
translation:
  language: te
  text: 'వారు ప్రార్థించి ఇలా అన్నారు: “నీవు, అందరి హృదయాలను తెలిసిన ప్రభువా, ఈ ఇద్దరిలో ఎవరిని ఎన్నుకున్నావో చూపించు[a].”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చూపించు’ అనే పదానికి ‘నియమించు’ లేదా ‘తెలియజేయు’ అని కూడా అర్థం కావచ్చు; గ్రీకు క్రియ ఎవరో వెల్లడించడాన్నీ, బహిరంగంగా నియమించడాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ఈ ప్రార్థనలో ‘ప్రభువా’ అనే సంబోధన దేవుణ్ణి సాధారణంగా ఉద్దేశించవచ్చు లేదా ప్రత్యేకంగా యేసును ఉద్దేశించవచ్చు; గ్రీకు పాఠం ఇక్కడ ఎవరిని ఉద్దేశించిందో స్పష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: προσευξάμενοι
  choice: ప్రార్థించి
  rationale: అయోరిస్ట్ కృదంతం ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచిస్తుంది; ‘ప్రార్థించి’ సహజమైన తెలుగులో ఆ క్రమాన్ని నిలుపుతుంది.
- source_word: Σὺ κύριε
  choice: ప్రభువా
  rationale: సంబోధనను సహజమైన తెలుగు రూపంలో ఇచ్చాం. గ్రీకులోని స్పష్టమైన Σὺ ద్వారా కలిగే ఉద్ఘాటన సందర్భంలో ‘నీవు’ అనే తరువాతి సర్వనామంతో కూడా ప్రతిఫలిస్తుంది.
- source_word: καρδιογνῶστα πάντων
  choice: అందరి హృదయాలు తెలిసిన
  rationale: కార్డియోగ్నోస్తేస్ అనే సంబోధనాత్మక బిరుదులోని ‘హృదయాలను తెలిసినవాడు’ అనే భావాన్ని, πάντων లోని ‘అందరి’ భావాన్ని పారదర్శకంగా మరియు సహజంగా నిలుపుతుంది.
- source_word: ἀνάδειξον
  choice: చూపించు
  rationale: దేవుడు ముందే ఎన్నుకున్న వ్యక్తిని తెలియజేయమనే ప్రార్థనకు ‘చూపించు’ సరిపోతుంది; ‘నియమించు’ అని అనువదిస్తే ఎంపికను వెల్లడించడం కంటే పదవిలో పెట్టడాన్ని అనవసరంగా నిర్దిష్టం చేయవచ్చు.
- source_word: ὃν ἐξελέξω
  choice: నీవు ఎన్నుకున్న వ్యక్తి ఎవరో
  rationale: మధ్యమవాచక క్రియ ప్రభువు చేసిన ఎంపికను సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ‘ఎవరో’ అనేది ఇద్దరిలో ఎంపికైన వ్యక్తిని సహజంగా తెలియజేస్తుంది.
- source_word: ἐκ τούτων τῶν δύο ἕνα
  choice: ఈ ఇద్దరిలో
  rationale: ఇద్దరు అభ్యర్థులలో ఒకరిని ఎంపిక చేయడాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది; మూలంలో ఈ వచనంలో లేని ‘పురుషులు’ వంటి పదాన్ని చేర్చదు.
theological_decisions:
- issue: ప్రార్థనలో ‘ప్రభువు’ ఎవరిని సూచిస్తుంది?
  choice: ‘ప్రభువా’ అనే సంబోధనను అలాగే ఉంచి, అది తండ్రినో యేసునో అనువాదంలో నిర్దిష్టం చేయలేదు.
  alternative: దేవుణ్ణి సాధారణంగా ఉద్దేశించిన సంబోధన; లేదా పునరుత్థానుడైన యేసును ప్రత్యేకంగా ఉద్దేశించిన సంబోధన.
  rationale: గ్రీకు పాఠం κύριε అని మాత్రమే చెబుతుంది. కాబట్టి వచనం స్పష్టంగా తేల్చని సూచ్యార్థాన్ని అనువాదం నిర్ణయించకుండా, దాని దైవశాస్త్రీయ ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ప్రార్థనా శైలిని వాడాం. మూలంలోని భావక్రమాన్ని కాపాడుతూ తెలుగు సహజ వాక్య నిర్మాణాన్ని అనుసరించాం.
