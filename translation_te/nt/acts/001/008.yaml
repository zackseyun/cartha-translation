revisions:
- from: అయితే పరిశుద్ధాత్మ మీ మీదికి వచ్చినప్పుడు మీరు శక్తిని పొందుతారు; మీరు యెరూషలేములో, యూదయ అంతటిలో, సమరయలో, భూమి అంచు వరకూ[a] నాకు సాక్షులుగా ఉంటారు.
  to: అయితే పరిశుద్ధాత్మ మీ మీదికి వచ్చినప్పుడు మీరు శక్తిని పొందుతారు; మీరు యెరూషలేములో, యూదయ అంతటా, సమరయలో, మరియు భూమి అంచు వరకు[a] నా సాక్షులుగా ఉంటారు.
