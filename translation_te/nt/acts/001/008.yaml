id: ACT.1.8
reference: Acts 1:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ λήμψεσθε δύναμιν ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς, καὶ ἔσεσθέ ⸀μου μάρτυρες ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ καὶ ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/008.yaml
  text: But you will receive power when the Holy Spirit has come upon you[a], and you will be my witnesses in Jerusalem, and in all Judea and Samaria, and to the end of the earth.
translation:
  language: te
  text: అయితే పరిశుద్ధాత్మ మీ మీదికి వచ్చినప్పుడు మీరు శక్తిని పొందుతారు; మీరు యెరూషలేములో, యూదయ అంతటా, సమరయలో, మరియు భూమి అంచు వరకు[a] నా సాక్షులుగా ఉంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భూమి అంచుల వరకు.” గ్రీకులో ఈ పదబంధం ఏకవచనంలో (“భూమి అంచు వరకు”) ఉన్నా, భూమి యొక్క అత్యంత దూర పరిధిని సూచించే నుడికారంగా వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: మునుపటి వాక్యంలోని విషయానికి వ్యతిరేకంగా శిష్యులు తెలుసుకోవలసినది కాక, వారు పొందబోయే శక్తి మరియు అప్పగించబడే సాక్ష్యకార్యాన్ని ముందుకు తెస్తుంది.
- source_word: λήμψεσθε δύναμιν
  choice: మీరు శక్తిని పొందుతారు
  rationale: λαμβάνω ఇక్కడ ఇవ్వబడేదాన్ని పొందడాన్ని సూచిస్తుంది; δύναμις ఆత్మ ప్రసాదించే కార్యసామర్థ్యాన్ని విస్తృతంగా వ్యక్తపరుస్తుంది.
- source_word: ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς
  choice: పరిశుద్ధాత్మ మీ మీదికి వచ్చినప్పుడు
  rationale: జెనిటివ్ అబ్సల్యూట్‌ను సహజమైన కాలవాచక ఉపవాక్యంగా అనువదించి, ἐπί సూచించే ‘మీదికి రావడం’ అనే గమన భావాన్ని నిలిపింది.
- source_word: ἔσεσθέ μου μάρτυρες
  choice: నాకు సాక్షులుగా ఉంటారు
  rationale: μάρτυρες అంటే సాక్ష్యమిచ్చేవారు. μουను ‘నా సాక్షులు’ అని కూడా అనువదించవచ్చు; ‘నాకు సాక్షులుగా’ అనేది యేసుతో వారి సంబంధం మరియు ఆయనను గూర్చిన సాక్ష్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ
  choice: యెరూషలేములో, యూదయ అంతటిలో, సమరయలో
  rationale: τε ... καί వరుసగా విస్తరించే ప్రదేశాలను కలుపుతుంది. πάσῃ యొక్క సంపూర్ణ భౌగోళిక పరిధిని ‘అంతటిలో’ నిలుపుతుంది; సమరయ ముందు గ్రీకులో ముందరి ἐν భావం కొనసాగుతుంది.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: భూమి అంచు వరకూ
  rationale: గ్రీకు పదబంధం ఏకవచనంలో ఉండి, భూమి యొక్క అత్యంత దూర పరిధిని సూచించే నుడికారంగా పనిచేస్తుంది. ఏకవచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపింది.
theological_decisions:
- issue: πνεῦμα యొక్క దైవిక వ్యక్తిగత సూచన
  choice: పరిశుద్ధాత్మ
  alternative: పరిశుద్ధ ఆత్మ
  rationale: τοῦ ἁγίου πνεύματος ఇక్కడ నిర్దిష్టమైన దైవిక సూచనగా ఉంది. ఆధునిక తెలుగు క్రైస్తవ వాడుకలో సహజమైన సమాసరూపాన్ని ఎంచుకుంది; పాఠ్యం చెప్పేదానికంటే అదనపు సిద్ధాంత వివరణను చేర్చలేదు.
- issue: μου μάρτυρεςలో సంబంధ భావం
  choice: నాకు సాక్షులుగా
  alternative: నా సాక్షులుగా
  rationale: గ్రీకు షష్ఠీ విభక్తి యేసుతో చెందిన సంబంధాన్ని సూచిస్తుంది. రెండు అనువాదాలూ సాధ్యమే; ఎంచుకున్న రూపం యేసు తరఫున మరియు ఆయనను గూర్చి సాక్ష్యమివ్వడాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ, భావాన్ని అతిగా నిర్దిష్టం చేయదు.
- issue: సాక్ష్యపు భౌగోళిక పరిధి
  choice: పేరుపొందిన నిజ ప్రదేశాల నుంచి భూమి అత్యంత దూర పరిధి వరకు విస్తరణ
  alternative: కేవలం ప్రతీకాత్మక ఆధ్యాత్మిక భూగోళం
  rationale: పాఠ్యం యెరూషలేము, యూదయ, సమరయ అనే భౌగోళిక పేర్లను క్రమంగా ఇచ్చి, ప్రపంచవ్యాప్త దూర పరిధితో ముగుస్తుంది. దానిపై అదనపు సంఘవ్యవస్థను మోపకుండా ఈ క్రమాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘యెరూషలేము,’ ‘యూదయ,’ ‘సమరయ’ అనే స్థిరమైన బైబిలు స్థలనామాలు నిలిపబడ్డాయి. ప్రధాన పాఠ్యంలో గ్రీకు ఏకవచన నుడికారాన్ని ఉంచి, సహజమైన బహువచన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చింది.
