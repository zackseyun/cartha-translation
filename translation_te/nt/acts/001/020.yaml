id: ACT.1.20
reference: Acts 1:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γέγραπται γὰρ ἐν βίβλῳ ψαλμῶν· Γενηθήτω ἡ ἔπαυλις αὐτοῦ ἔρημος καὶ μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ, καί· Τὴν ἐπισκοπὴν αὐτοῦ ⸀λαβέτω ἕτερος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/020.yaml
  text: For it is written in the book of Psalms[a], ‘Let his dwelling place become desolate, and let there be no one dwelling in it,’ and[c][b], ‘Let another take his office.’
translation:
  language: te
  text: 'ఎందుకంటే కీర్తనల గ్రంథంలో ఇలా రాయబడి ఉంది: “అతని నివాసస్థలం నిర్జనంగా మారిపోవాలి; అందులో ఎవరూ నివసించకూడదు.”[a] మరియు, “అతని పదవిని మరొకడు స్వీకరించాలి.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నివాసస్థలం” అనే పదాన్ని “ఆవాసం” లేదా “నివాసం” అని కూడా అనువదించవచ్చు. చివరి వాక్యభాగాన్ని “అందులో నివసించేవారు ఎవరూ ఉండకూడదు” లేదా “అందులో నివాసి ఎవరూ ఉండకూడదు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “పదవి” అని అనువదించిన గ్రీకు పదం ἐπισκοπή; దీన్ని “పర్యవేక్షణ బాధ్యత” లేదా “పర్యవేక్షకత్వం” అని కూడా అనువదించవచ్చు. ఇది తప్పనిసరిగా తరువాతి కాలపు సాంకేతిక సంఘపదవిని సూచించదు.
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: రాయబడి ఉంది
  rationale: పూర్త భూత నిష్క్రియ రూపం ఇక్కడ లేఖన ఉల్లేఖన సూత్రంగా పనిచేస్తుంది; ఈ తెలుగు రూపం వ్రాయబడినది ఇప్పటికీ ప్రామాణికంగా నిలిచి ఉందనే వర్తమాన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: βίβλῳ ψαλμῶν
  choice: కీర్తనల గ్రంథంలో
  rationale: లేఖన మూలాన్ని గుర్తించే షష్ఠీ విభక్తి నిర్మాణాన్ని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: Γενηθήτω
  choice: పాడైపోవాలి
  rationale: ἔρημοςతో కలిసిన ఆజ్ఞార్థక భావాన్ని గంభీరమైన ఆశంసార్థక/శాపోక్తి రూపంలో తెలియజేస్తుంది; తెలుగులో ‘కావాలి’ కంటే సందర్భానుసారంగా సహజంగా ఉంది.
- source_word: ἔπαυλις
  choice: నివాసస్థలం
  rationale: నివాసం, ఆవాసం లేదా ఇంటి ప్రాంగణం అనే విస్తృత భావాన్ని సందర్భానికి తగిన స్పష్టమైన పదంతో అందిస్తుంది.
- source_word: ἔρημος
  choice: పాడైపోవాలి
  rationale: ఇక్కడ జనావాసం లేక వెలవెలబోయిన స్థితిని సూచిస్తుంది; ‘పాడైపోవాలి’ కీర్తన ఉల్లేఖనంలోని గంభీరతను నిలుపుతుంది.
- source_word: μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ
  choice: అందులో నివసించేవాడు ఎవడూ ఉండకూడదు
  rationale: నిషేధం మరియు నామవాచకంగా వాడిన వర్తమాన కృదంతం రెండింటినీ స్పష్టంగా ప్రతిబింబిస్తూ, ‘నివాసి లేకూడదు’ అనే భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: ἐπισκοπή
  choice: పర్యవేక్షణ బాధ్యత
  rationale: పర్యవేక్షించడం, బాధ్యత వహించడం అనే మూలభావాన్ని నిలుపుతూ, తరువాతి కాలపు సాంకేతిక సంఘపదవిని అనవసరంగా దిగుమతి చేయదు.
- source_word: λαβέτω ἕτερος
  choice: మరొకడు స్వీకరించాలి
  rationale: ఆజ్ఞార్థక వారసత్వ భావాన్ని గంభీరంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యూదా ఖాళీ చేసిన పాత్ర సందర్భంలో ἐπισκοπή అనువాదం
  choice: పర్యవేక్షణ బాధ్యత
  alternative: పదవి; పర్యవేక్షకత్వం
  rationale: ఈ పదం యూదా నిర్వహించిన బాధ్యతాయుత పాత్రను సూచిస్తుంది. ‘పర్యవేక్షణ బాధ్యత’ మూలార్థాన్ని నిలుపుతూ, తరువాతి సంఘవ్యవస్థలోని నిర్దిష్ట బిషప్ పదవిని వచనంలోకి చొప్పించదు; ఇతర సాధ్యమైన అర్థాలను పాదటిప్పణిలో చూపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; లేఖన ఉల్లేఖనానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదజాలం. రెండు కీర్తన ఉల్లేఖనాలను వేరు చేసి, గ్రీకు καί యొక్క అనుసంధానాన్ని ‘ఇంకా’తో సహజంగా చూపించాం.
