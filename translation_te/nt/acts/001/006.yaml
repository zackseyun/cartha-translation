id: ACT.1.6
reference: Acts 1:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν συνελθόντες ⸀ἠρώτων αὐτὸν λέγοντες· Κύριε, εἰ ἐν τῷ χρόνῳ τούτῳ ἀποκαθιστάνεις τὴν βασιλείαν τῷ Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/006.yaml
  text: So when they had come together[a], they asked him, saying, “Lord, is it at this time that you are restoring the kingdom to Israel?”
translation:
  language: te
  text: కాబట్టి వారు ఒకచోట కూడినప్పుడు, “ప్రభువా, ఈ సమయంలో నీవు ఇశ్రాయేలుకు[a] రాజ్యాన్ని తిరిగి స్థాపిస్తున్నావా?” అని ఆయనను అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలు కోసం.” గ్రీకు దత్తివిభక్తిని ప్రయోజనార్థకంగా (“ఇశ్రాయేలు కోసం”) లేదా రాజ్యాన్ని “ఇశ్రాయేలుకు” తిరిగి స్థాపించడం అని మరింత ప్రత్యక్షంగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν συνελθόντες
  choice: కాబట్టి వారు ఒకచోట కూడినప్పుడు
  rationale: συνελθόντες అనే కృదంతాన్ని సందర్భానుసారంగా కాలార్థకంగా అనువదించాం. μὲν οὖν కథనాన్ని ముందుకు నడిపే అనుసంధానం కాబట్టి సహజమైన తెలుగులో ‘కాబట్టి’ అని ఇచ్చాం.
- source_word: ἠρώτων αὐτὸν λέγοντες
  choice: అని ఆయనను అడిగారు
  rationale: ἠρώτων అపూర్ణ భూతకాల రూపమైనప్పటికీ, ఇక్కడ ఒక ప్రశ్నను తెలిపే తెలుగు కథనశైలిలో సాధారణ భూతకాలం సహజం. λέγοντες ఉటంకించిన ప్రశ్నతో ‘అని’ ద్వారా వ్యక్తమైంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: యేసును నేరుగా సంబోధించే గౌరవసూచకమైన, ధార్మిక ప్రాముఖ్యతగల κύριος బిరుదును ‘ప్రభువా’ అని నిలిపాం.
- source_word: ἐν τῷ χρόνῳ τούτῳ
  choice: ఈ సమయంలోనే
  rationale: χρόνος ఇక్కడ ఒక కాలావధి లేదా సందర్భాన్ని సూచిస్తుంది. ప్రశ్నలోని కాలకేంద్రీకరణను సహజంగా తెలపడానికి ‘ఈ సమయంలోనే’ అని అనువదించాం.
- source_word: ἀποκαθιστάνεις
  choice: తిరిగి స్థాపిస్తున్నావా
  rationale: ἀποκαθίστημι పూర్వస్థితికి తీసుకురావడం లేదా మళ్లీ స్థాపించడం అనే భావాన్ని కలిగి ఉంది. వర్తమాన రూపంలోని ప్రగతిశీల ఛాయను తెలుగు ప్రశ్నలో నిలిపాం.
- source_word: τὴν βασιλείαν
  choice: రాజ్యాన్ని
  rationale: βασιλεία పరిపాలన లేదా రాజ్యం అనే రెండర్థాలు కలిగి ఉన్నా, ఇశ్రాయేలుకు తిరిగి స్థాపించడం అనే సందర్భంలో ‘రాజ్యం’ శిష్యుల నిరీక్షణను వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: τῷ Ἰσραήλ
  choice: ఇశ్రాయేలుకు
  rationale: దత్తివిభక్తి రాజ్యాన్ని ఇశ్రాయేలుకు తిరిగి స్థాపించడం అనే ప్రత్యక్ష సంబంధాన్ని సూచించవచ్చు; అదే సమయంలో ‘ఇశ్రాయేలు కోసం’ అనే ప్రయోజనార్థం కూడా సాధ్యమే. ప్రధాన పాఠంలో ప్రత్యక్ష రూపాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: ఇశ్రాయేలు రాజ్యాన్ని గూర్చిన శిష్యుల నిరీక్షణ స్వభావం
  choice: ‘ఇశ్రాయేలుకు రాజ్యాన్ని తిరిగి స్థాపించడం’ అని ప్రశ్నను నేరుగా అనువదించడం
  alternative: ‘ఇశ్రాయేలు కోసం రాజ్యాన్ని తిరిగి స్థాపించడం’ లేదా దానిని పూర్తిగా రాజకీయమైనదిగా/ఆధ్యాత్మికమైనదిగా వివరణాత్మకంగా మార్చడం
  rationale: ఈ వచనం శిష్యుల ప్రశ్నను నివేదిస్తుంది; అందులోని ప్రతి ఊహను యేసు సమర్థించాడా లేదా సరిదిద్దాడా అనేది ఇక్కడ తేల్చదు. కాబట్టి చారిత్రక, ధార్మిక ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని ప్రశ్నారూపం, వర్తమాన క్రియ ఛాయ, ఇశ్రాయేలు రాజ్యానికి సంబంధించిన ఉద్దేశపూర్వక అస్పష్టత నిలుపబడ్డాయి.
