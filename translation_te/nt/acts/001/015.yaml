source:
  edition: SBLGNT
  text: Καὶ ἐν ταῖς ἡμέραις ταύταις ἀναστὰς Πέτρος ἐν μέσῳ τῶν ⸀ἀδελφῶν εἶπεν (ἦν τε ὄχλος ὀνομάτων ἐπὶ τὸ αὐτὸ ⸀ὡς ἑκατὸν εἴκοσι)·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/015.yaml
  text: And in those days Peter stood up in the midst of the brothers and said (the number of names together was about one hundred twenty),[a]
translation:
  language: te
  text: ఆ రోజుల్లో పేతురు సహోదరుల మధ్య లేచి నిలబడి ఇలా అన్నాడు (కూడి ఉన్నవారి సంఖ్య దాదాపు నూట ఇరవై).[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సహోదర సహోదరీల మధ్య’; గ్రీకులో ‘సహోదరులు’ అని ఉంది, అయితే ఇక్కడ కూడిన సమాజంలో స్త్రీలతో సహా తోటి విశ్వాసులందరూ ఉద్దేశించబడి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: లేచి నిలబడి
  rationale: మాట్లాడే ముందు పేతురు చేసిన స్పష్టమైన చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν μέσῳ
  choice: మధ్య
  rationale: సమావేశమైన సమూహంలో పేతురు ఉన్న స్థానాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀδελφῶν
  choice: సహోదరుల
  rationale: గ్రీకు పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; సందర్భానుసారమైన సమ్మిళిత అర్థాన్ని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: ὄχλος ὀνομάτων
  choice: కూడివున్నవారి సంఖ్య
  rationale: అక్షరార్థంగా ‘పేర్ల సమూహం’ అనే గ్రీకు నుడికారానికి వ్యక్తుల సంఖ్య అనే భావం ఉంది; తెలుగులో ‘పేర్ల సంఖ్య’ అసహజంగా, అపార్థకంగా ఉండేందున ఉద్దేశిత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἐπὶ τὸ αὐτό
  choice: అక్కడ కూడివున్నవారి
  rationale: ఒకచోట కలిసి ఉండడాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘అక్కడ’ సందర్భసిద్ధమైన స్థలభావాన్ని ఇస్తుంది.
- source_word: ὡς ἑκατὸν εἴκοσι
  choice: దాదాపు నూట ఇరవై
  rationale: సంఖ్య సుమారుగా ఉన్నదని సూచించే ὡς భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τε
  choice: వాక్య విరామచిహ్నాల ద్వారా అనుసంధానం
  rationale: కుండలీకరణంలోని అదనపు సమాచారాన్ని గ్రీకు τε అనుసంధానిస్తుంది; తెలుగులో ప్రత్యేకంగా ‘మరియు’ చేర్చడం భారంగా ఉండేందున వాక్య నిర్మాణమే ఆ సంబంధాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: సమావేశమైన సమాజంలో ἀδελφῶν పదపు లింగ సూచన
  choice: ప్రధాన పాఠ్యంలో ‘సహోదరులు’; స్త్రీలను కూడా కలుపుకొనే సందర్భసాధ్యమైన అర్థాన్ని పాదటిప్పణిలో పేర్కొనడం
  alternative: ‘సహోదర సహోదరీలు’ లేదా ‘విశ్వాసులు’
  rationale: మూలంలోని పుంలింగ బహువచనాన్ని చెరపకుండా ఉంచుతూ, అపొస్తలుల కార్యములు 1:14 సందర్భంలో స్త్రీలు కూడా సమూహంలో ఉన్నారనే అవకాశాన్ని పాదటిప్పణి ద్వారా సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు నుడికారమైన ὄχλος ὀνομάτωνను అక్షరానువాదం చేయకుండా దాని సహజ భావాన్ని అందించాం; మూలంలోని కుండలీకరణను నిలిపాం.
