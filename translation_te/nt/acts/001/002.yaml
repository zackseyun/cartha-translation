  verdict: approve
  source_fidelity: The Telugu accurately preserves the temporal endpoint ('...రోజు వరకు'), the antecedent action of giving commands, the Spirit-mediated sense of διὰ πνεύματος ἁγίου, the apostles as those Jesus chose, and the passive sense of ἀνελήμφθη. It does not add the unstated destination 'into heaven.'
  naturalness: The clause is natural, clear modern standard Telugu. Its deliberately dependent ending with 'వరకు' appropriately reflects that Acts 1:2 continues the sentence begun in 1:1.
  terminology: ‘అపొస్తలులు,’ ‘పరిశుద్ధాత్మ,’ and ‘ఆజ్ఞలు’ are established, comprehensible biblical Telugu terms and accurately maintain the register and force of the Greek. ‘ద్వారా’ suitably preserves the means/agency range without forcing a doctrinal interpretation.
