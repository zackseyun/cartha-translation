id: ACT.1.2
reference: Acts 1:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄχρι ἧς ἡμέρας ἐντειλάμενος τοῖς ἀποστόλοις διὰ πνεύματος ἁγίου οὓς ἐξελέξατο ἀνελήμφθη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/002.yaml
  text: until the day when[a], after giving commands through the Holy Spirit to the apostles whom he had chosen, he was taken up.
translation:
  language: te
  text: తాను ఎన్నుకున్న అపొస్తలులకు పరిశుద్ధాత్మ ద్వారా ఆజ్ఞలు ఇచ్చిన తరువాత, ఆయన పైకి ఎత్తబడిన రోజు వరకు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పరిశుద్ధాత్మ చేత ఆజ్ఞలు ఇచ్చి ...’. గ్రీకు పదబంధం సాధనం లేదా కార్యసాధకత్వాన్ని సూచించవచ్చు; అందువల్ల ‘ద్వారా’ లేదా ‘చేత’ అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι ἧς ἡμέρας
  choice: రోజు వరకు
  rationale: ఈ గ్రీకు కాలసూచక ప్రయోగం మునుపటి వాక్యంలో మొదలైన వర్ణనకు అంతిమ కాలబిందువును సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ‘ఆయన ... రోజు వరకు’ సహజంగా ఉంటుంది.
- source_word: ἐντειλάμενος
  choice: ఆజ్ఞలు ఇచ్చిన తరువాత
  rationale: అయోరిస్ట్ మధ్యమ కృదంతం ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచిస్తుంది. ‘ఆజ్ఞలు’ అనేది ἐντέλλομαι లోని అధికారపూర్వక భావాన్ని ‘బోధనలు’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: τοῖς ἀποστόλοις
  choice: అపొస్తలులకు
  rationale: లూకా–అపొస్తలుల కార్యములలో యేసు నియమించిన గుర్తింపు పొందిన సమూహానికి ఆధునిక ప్రామాణిక తెలుగు క్రైస్తవ వాడుకలో స్థిరపడిన పదం.
- source_word: διὰ πνεύματος ἁγίου
  choice: పరిశుద్ధాత్మ ద్వారా
  rationale: షష్ఠీ విభక్తితో διά సాధనం లేదా కార్యసాధకత్వాన్ని తెలియజేస్తుంది. ‘ద్వారా’ ఈ రెండింటినీ అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: οὓς ἐξελέξατο
  choice: తాను ఎన్నుకున్న
  rationale: సంబంధ వాక్యం అపొస్తలులను యేసు ముందుగా ఎన్నుకున్నవారిగా గుర్తిస్తుంది. ‘తాను’ మధ్యమ రూపంలోని స్వీయ సంబంధ ఛాయను సహజ తెలుగులో స్వల్పంగా వ్యక్తం చేస్తుంది; దానిపై అధిక భారం వేయదు.
- source_word: ἀνελήμφθη
  choice: పైకి ఎత్తబడిన
  rationale: కర్మణి రూపాన్ని నేరుగా నిలుపుతూ, ఈ వచనంలో స్పష్టంగా లేని ‘పరలోకానికి’ అనే గమ్యాన్ని చేర్చకుండా ఉంటుంది.
theological_decisions:
- issue: యేసు ఇచ్చిన ఆజ్ఞలకు పరిశుద్ధాత్మతో ఉన్న సంబంధం
  choice: యేసు పరిశుద్ధాత్మ ద్వారా అపొస్తలులకు ఆజ్ఞలు ఇచ్చాడు.
  alternative: యేసు పరిశుద్ధాత్మ చేత ఆజ్ఞలు ఇచ్చాడు.
  rationale: διὰ πνεύματος ἁγίου అనేది అత్యంత సహజంగా ἐντειλάμενος తో అనుసంధానమై, ఆజ్ఞలు ఇచ్చిన సాధనం లేదా కార్యసాధకత్వాన్ని సూచిస్తుంది. ‘ద్వారా’ ఈ భావపరిధిని సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలి. ఇది అపొస్తలుల కార్యములు 1:1లో మొదలైన వాక్యానికి కొనసాగింపు కావడంతో ‘వరకు’తో ముగిసే ఖండవాక్య నిర్మాణాన్ని నిలిపాం.
