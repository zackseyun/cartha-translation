id: ACT.1.21
reference: Acts 1:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δεῖ οὖν τῶν συνελθόντων ἡμῖν ἀνδρῶν ἐν παντὶ χρόνῳ ⸀ᾧ εἰσῆλθεν καὶ ἐξῆλθεν ἐφ’ ἡμᾶς ὁ κύριος Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/021.yaml
  text: Therefore[a], it is necessary that one of the men who accompanied us during all the time in which the Lord Jesus went in and out among us[b],
translation:
  language: te
  text: కాబట్టి, ప్రభువైన యేసు మన మధ్య వచ్చి వెళ్లుతూ[b] ఉన్న కాలమంతటా మనతో కలిసి ఉన్న పురుషులలో[a] ఒకడు తప్పనిసరిగా—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మనతో ఉన్న పురుషులలో’; మరింత అక్షరార్థంగా, ‘మనతో కూడి వచ్చిన పురుషులలో.’
    reason: lexical_alternative
  - marker: b
    text: ‘మన మధ్య వచ్చి వెళ్లుతూ’ అనే మాట శిష్యులతో కలిసి యేసు కొనసాగించిన బహిరంగ జీవితం, కార్యాచరణను సూచించే నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: δεῖ
  choice: తప్పనిసరిగా—
  rationale: ఇది అవసరాన్ని తెలిపే అవ్యక్త క్రియ. దాని భావాన్ని ‘తప్పనిసరిగా’ అని నిలిపి, వాక్యాన్ని పూర్తి చేసే అంశం తదుపరి వచనంలో కొనసాగుతుందని దీర్ఘవిరామంతో సూచించాం.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సందర్భం నుంచి పేతురు తీసుకుంటున్న తార్కిక నిర్ధారణను సహజంగా తెలియజేస్తుంది.
- source_word: τῶν συνελθόντων ἡμῖν ἀνδρῶν
  choice: మనతో కలిసి ఉన్న పురుషులలో
  rationale: συνέρχομαι అనే పదంలోని కలిసి ఉండడం/సహవాసం చేయడం అనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలిపి, ἀνήρ సూచించే పురుష లింగాన్ని నిలిపాం.
- source_word: ἐν παντὶ χρόνῳ
  choice: కాలమంతటా
  rationale: ప్రతి విడివిడి సందర్భాన్ని కాక, యేసు శిష్యులతో ఉన్న మొత్తం కాలవ్యవధిని సూచిస్తుంది.
- source_word: εἰσῆλθεν καὶ ἐξῆλθεν
  choice: వచ్చిపోతూ ఉన్న
  rationale: మూలంలోని లోపలికి రావడం, బయటికి వెళ్లడం అనే చలన చిత్రాన్ని తెలుగులో సహజంగా ఉంచుతూ, నిరంతర సహవాసం మరియు కార్యకలాపం అనే నుడికార భావాన్ని తెలియజేస్తుంది.
- source_word: ἐφ’ ἡμᾶς
  choice: మన మధ్య
  rationale: శిష్యుల సమూహంతో సంబంధించి యేసు చేసిన సంచారం, కార్యకలాపాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ κύριος Ἰησοῦς
  choice: ప్రభువైన యేసు
  rationale: κύριος అనే క్రీస్తు సంబంధ బిరుదును ‘ప్రభువు’గా నిలిపి, తెలుగు వాక్య నిర్మాణంలో సహజంగా ‘ప్రభువైన యేసు’ అని ఇచ్చాం.
theological_decisions:
- issue: κύριος అనే క్రీస్తు సంబంధ బిరుదు
  choice: ప్రభువైన యేసు
  alternative: యజమానుడైన యేసు
  rationale: ‘ప్రభువు’ అనే పదం గౌరవార్థాన్ని, కొత్త నిబంధనలోని దైవశాస్త్ర సంబంధ ప్రాముఖ్యతను రెండింటినీ కాపాడుతుంది.
- issue: ἀνδρῶν లోని లింగ సూచన
  choice: పురుషులలో
  alternative: వ్యక్తులలో
  rationale: మూలపదం సాధారణంగా మనుషులను కాక ప్రత్యేకంగా పురుషులను సూచిస్తున్నందున లింగాన్ని తటస్థీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. గ్రీకు వాక్యం 22వ వచనంలో కొనసాగుతున్నందున ఈ వచనాంతంలో దీర్ఘవిరామం ఉంచి అసంపూర్ణ వాక్య నిర్మాణాన్ని కాపాడాం.
