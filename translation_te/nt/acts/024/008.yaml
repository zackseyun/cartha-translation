source:
  edition: SBLGNT
  text: παρ’ οὗ δυνήσῃ αὐτὸς ἀνακρίνας περὶ πάντων τούτων ἐπιγνῶναι ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/008.yaml
  text: From him[a], by examining him yourself[b], you will be able to learn about all these things of which we accuse him.
translation:
  language: te
  text: మీరు స్వయంగా అతణ్ణి విచారించడం ద్వారా, మేము అతనిపై మోపుతున్న ఈ ఆరోపణలన్నిటి గురించి అతని నుండి తెలుసుకోగలరు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదానుసారంగా: ‘ఎవరి నుండి మీరు స్వయంగా అతణ్ణి విచారించి, మేము అతనిపై మోపుతున్న ఈ సంగతులన్నిటి గురించి తెలుసుకోగలరో.’ ఇక్కడ ‘ఎవరి నుండి’ అనేది పౌలునే సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రతుల్లో 7వ వచనంలో సేనాధిపతి లూసియాస్ పౌలును బలవంతంగా తీసుకుపోయి, అతనిపై నేరం మోపేవారు ఫేలిక్సు ఎదుటికి రావాలని ఆదేశించినట్లు అదనపు వాక్యం ఉంది. SBLGNT పాఠంలో ఆ మాటలు లేవు.
    reason: textual_variant
lexical_decisions:
- source_word: παρ’ οὗ
  choice: అతని నుంచే
  rationale: జనిటివ్‌తో παρά ఇక్కడ సమాచార మూలాన్ని సూచిస్తుంది. ‘అతని నుంచే’ అనేది పౌలును స్వయంగా విచారించడం ద్వారా సమాచారం పొందవచ్చనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘-ఏ’ మూలంలోని వ్యక్తిపైనున్న దృష్టిని స్పష్టం చేస్తుంది.
- source_word: δυνήσῃ
  choice: తెలుసుకోగలరు
  rationale: δύναμαι యొక్క భవిష్యత్ రూపం సామర్థ్యాన్ని సూచిస్తుంది. గౌరవార్థక ఏకవచన సంబోధనలో ‘గలరు’ న్యాయస్థాన సందర్భానికి తగినది.
- source_word: αὐτὸς
  choice: మీరే
  rationale: బలవత్తరమైన ఈ సర్వనామం ఫేలిక్సు వ్యక్తిగతంగా విచారణ చేయడాన్ని నొక్కి చెబుతుంది. ‘మీరే’ ఆ ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: ἀνακρίνας
  choice: విచారించి
  rationale: న్యాయసంబంధ సందర్భంలో ἀνακρίνω అంటే పరిశీలనాత్మకంగా విచారించడం లేదా ప్రశ్నించడం. ఏఓరిస్ట్ పార్టిసిపిల్ ప్రధాన క్రియకు ముందు జరిగే లేదా దానికి సాధనంగా ఉండే చర్యను సూచించగలదు; ‘విచారించి’ ఈ రెండింటినీ అతిగా నిర్ధారించకుండా ఉంచుతుంది.
- source_word: περὶ πάντων τούτων
  choice: ఈ ఆరోపణలన్నిటి గురించి
  rationale: περί జనిటివ్ ‘గురించి’ అనే భావాన్ని ఇస్తుంది. సందర్భంలో ‘ఇవన్నీ’ అనేవి ఇప్పుడే మోపిన నేరారోపణలు కాబట్టి, తెలుగులో స్పష్టత కోసం ‘ఈ ఆరోపణలన్నిటి’ అని ఇచ్చాం.
- source_word: ἐπιγνῶναι
  choice: తెలుసుకో
  rationale: ఇక్కడ ἐπιγινώσκω విచారణ ద్వారా విషయాన్ని తెలుసుకోవడం లేదా నిర్ధారించుకోవడం అనే అర్థంలో ఉంది. ‘తెలుసుకో’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండి, ‘పూర్తిగా తెలుసుకోవడం’ అనే అతిశయార్థాన్ని బలవంతంగా చేర్చదు.
- source_word: ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ
  choice: మేము అతనిపై మోపుతున్న ఈ ఆరోపణలన్నిటి
  rationale: κατηγορέω జనిటివ్‌తో ఒకరిపై నేరం మోపడాన్ని సూచిస్తుంది. ‘అతనిపై మోపుతున్న ఆరోపణలు’ న్యాయసంబంధ భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది; ἡμεῖς లోని వ్యక్తమైన కర్తను ‘మేము’గా నిలిపాం.
