  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయస్థాన సందర్భానికి తగిన గౌరవప్రదమైన శైలిని వాడాం. వాక్యక్రమాన్ని సహజమైన తెలుగుకు అనుగుణంగా మార్చినా, ‘మీరే’ అనే ఉద్ఘాటనను, విచారణ ద్వారా తెలుసుకునే భావాన్ని, ఆరోపణల న్యాయసంబంధ స్వరాన్ని నిలిపాం.
