translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయస్థానంలో పౌలు చేస్తున్న సమర్థనకు తగిన గౌరవప్రదమైన కాని సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని ‘గానీ ... గానీ ... లోనూ’ అనే వరుస నిరాకరణను సహజమైన తెలుగు నిర్మాణంలో నిలిపాం.
