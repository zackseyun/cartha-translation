  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὔτε ἐν τῷ ἱερῷ εὗρόν με πρός τινα διαλεγόμενον ἢ ⸀ἐπίστασιν ποιοῦντα ὄχλου οὔτε ἐν ταῖς συναγωγαῖς οὔτε κατὰ τὴν πόλιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/012.yaml
  text: And they found me neither in the temple arguing with anyone nor stirring up a crowd[b][a], neither in the synagogues nor throughout the city.
translation:
  language: te
  text: వారు నన్ను దేవాలయంలో ఎవరితోనైనా వాదిస్తూ[a] గానీ, జనాన్ని గుమికూడేలా చేస్తూ[b] గానీ చూడలేదు; సమాజమందిరాల్లో గానీ నగరమంతటా గానీ చూడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఎవరితోనైనా చర్చిస్తూ’ లేదా ‘తర్కిస్తూ.’ గ్రీకు క్రియ చర్చించడం లేదా వాదించడం రెండింటినీ సూచించగలదు; ఇక్కడ ప్రజా కలకలం గురించిన ఆరోపణను పౌలు ఖండిస్తున్నందున ‘వాదిస్తూ’ అని అనువదించాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘జనసమూహాన్ని రెచ్చగొడుతూ.’ గ్రీకు పదబంధం ప్రజలు గుమికూడేలా చేయడాన్ని లేదా ప్రజా కలకలం కలిగించడాన్ని సూచించవచ్చు; అయితే అది తప్పనిసరిగా పూర్తిస్థాయి అల్లర్లను సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερῷ
  choice: దేవాలయంలో
  rationale: అపొస్తలుల కార్యముల సందర్భంలో ἱερόν సాధారణంగా గర్భాలయాన్ని మాత్రమే కాక దేవాలయ ప్రాంగణ సముదాయాన్ని సూచిస్తుంది; తెలుగులో ‘దేవాలయంలో’ సహజంగా ఆ విస్తృత భావాన్ని మోయగలదు.
- source_word: εὗρόν με
  choice: నన్ను ... చూడలేదు
  rationale: ఇక్కడ εὑρίσκω అంటే వెదికి కనుగొనడం కంటే, ఆరోపణకు ఆధారమైన చర్యలో పౌలును ఎవరూ గమనించలేదనే న్యాయవాద భావం ప్రధానమైనది. అందువల్ల సహజమైన తెలుగులో ‘చూడలేదు’ అని ఇచ్చాం.
- source_word: πρός τινα διαλεγόμενον
  choice: ఎవరితోనైనా వాదిస్తూ
  rationale: διαλέγομαι చర్చించడం, తర్కించడం, వాదించడం అనే పరిధి కలిగిన పదం. ప్రజలను రెచ్చగొట్టాడనే ఆరోపణను పౌలు ఖండిస్తున్న సందర్భంలో ‘వాదిస్తూ’ అనేది సహజంగా సరిపోతుంది; పదంలోని విస్తృత భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: ἐπίστασιν ποιοῦντα ὄχλου
  choice: జనాన్ని గుమికూడేలా చేస్తూ
  rationale: ఈ పదబంధం జనసమూహం కూడేలా చేయడం లేదా ప్రజా కలకలం కలిగించడం సూచించగలదు. ‘అల్లర్లు రేపుతూ’ అని అనడం గ్రీకు కంటే బలమైన హింసాత్మక భావాన్ని చేర్చవచ్చు; అందువల్ల ప్రధాన పాఠంలో మితమైన రూపాన్ని ఎంచుకున్నాం.
- source_word: συναγωγαῖς
  choice: సమాజమందిరాల్లో
  rationale: యూదుల συναγωγήలకు ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో సహజమైన పదం.
- source_word: κατὰ τὴν πόλιν
  choice: నగరమంతటా ఎక్కడా
  rationale: κατά + accusative ఇక్కడ నగరంలోని వివిధ ప్రదేశాలన్నిటిలో అనే విస్తరణ భావాన్ని ఇస్తుంది; ‘నగరమంతటా ఎక్కడా’ ఆ నిరాకరణను తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
