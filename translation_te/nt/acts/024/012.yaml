  revised_text: వారు నన్ను దేవాలయంలో ఎవరితోనైనా వాదిస్తూ[a] గానీ, జనాన్ని గుమికూడేలా చేస్తూ[b] గానీ చూడలేదు; సమాజమందిరాల్లో గానీ నగరమంతటా గానీ చూడలేదు.
