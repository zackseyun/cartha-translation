source:
  edition: SBLGNT
  text: Ἀπεκρίθη ⸀τε ὁ Παῦλος νεύσαντος αὐτῷ τοῦ ἡγεμόνος λέγειν· Ἐκ πολλῶν ἐτῶν ὄντα σε κριτὴν τῷ ἔθνει τούτῳ ἐπιστάμενος ⸀εὐθύμως τὰ περὶ ἐμαυτοῦ ἀπολογοῦμαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/010.yaml
  text: 'Then Paul answered[a], after the governor had nodded to him to speak: “Knowing that for many years you have been a judge over this nation, I gladly make my defense concerning myself.'
translation:
  language: te
  text: 'అప్పుడు పాలకుడు పౌలుకు మాట్లాడమని సైగ చేయగా, పౌలు ఇలా జవాబిచ్చాడు: “మీరు అనేక సంవత్సరాలుగా ఈ జనానికి న్యాయాధిపతిగా ఉన్నారని తెలిసికొని, నా విషయమై నా వాదనను ధైర్యంగా[a] వినిపిస్తున్నాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సంతోషంగా” లేదా “సిద్ధమనస్సుతో.” ఈ క్రియావిశేషణం మంచి ఉత్సాహం, ధైర్యం, లేదా సంసిద్ధతతో మాట్లాడడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθη τε
  choice: అప్పుడు ... జవాబిచ్చాడు
  rationale: ἀπεκρίθη అంటే జవాబివ్వడం; τε కథనాన్ని స్వల్పంగా ముందుకు కలుపుతుంది. ఆధునిక తెలుగు కథనంలో ‘అప్పుడు’ సహజంగా ఆ అనుసంధానాన్ని తెలియజేస్తుంది.
- source_word: νεύσαντος αὐτῷ τοῦ ἡγεμόνος λέγειν
  choice: అధిపతి పౌలును మాట్లాడమని సైగ చేసిన తర్వాత
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణాన్ని కాలసూచక ఉపవాక్యంగా ఇచ్చాం. νεύω తల ఊపడం లేదా సైగ చేయడం రెండింటినీ సూచించగలదు; తెలుగు సందర్భంలో ‘సైగ చేసిన’ సహజంగా ఉండి భౌతిక సంకేతాన్ని నిలుపుతుంది.
- source_word: ἡγεμόνος
  choice: అధిపతి
  rationale: రోమా ప్రాంతీయ పాలనాధికారిని సూచించే పదం. ‘అధిపతి’ న్యాయపరమైన అధికారంతో కూడిన పాలనా హోదాను సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: Ἐκ πολλῶν ἐτῶν
  choice: అనేక సంవత్సరాలుగా
  rationale: గతం నుంచి కొనసాగుతున్న దీర్ఘకాలాన్ని తెలిపే సహజమైన తెలుగు రూపం.
- source_word: ὄντα σε κριτὴν τῷ ἔθνει τούτῳ
  choice: మీరు ... ఈ ప్రజలకు న్యాయాధిపతిగా ఉన్నారని
  rationale: కొనసాగుతున్న న్యాయపరమైన పాత్రను తెలుపుతుంది. ἔθνος ఇక్కడ యూదా ప్రజాసమూహాన్ని సూచిస్తుంది; తెలుగులో ‘ఈ ప్రజలకు’ సహజంగా ఉంది.
- source_word: ἐπιστάμενος
  choice: నాకు తెలుసు
  rationale: పౌలు తన సమర్థనను ధైర్యంగా చేయడానికి కారణమైన జ్ఞానాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: εὐθύμως
  choice: సంతోషంగా
  rationale: ఈ క్రియావిశేషణం సిద్ధమనస్సు, ఉత్సాహం, ధైర్యం లేదా సంతోషభావాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో సహజమైన ‘సంతోషంగా’ వాడి, ఇతర సాధ్యార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: τὰ περὶ ἐμαυτοῦ ἀπολογοῦμαι
  choice: నా గురించి నేను ... సమర్థించుకుంటున్నాను
  rationale: ἀπολογοῦμαι న్యాయస్థాన సందర్భంలోని తన పక్ష సమర్థనను సూచిస్తుంది. ‘సమర్థించుకుంటున్నాను’ ఆధునిక తెలుగులో సహజంగా ఉండి న్యాయపరమైన భావాన్ని నిలుపుతుంది.
