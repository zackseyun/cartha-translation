  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయస్థాన శైలిని అనుసరించాం. మూలంలోని దీర్ఘ వాక్య నిర్మాణాన్ని స్పష్టత కోసం రెండు వాక్యాలుగా విభజించినా, కారణసంబంధాన్ని ‘అందువల్ల’తో నిలిపాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
