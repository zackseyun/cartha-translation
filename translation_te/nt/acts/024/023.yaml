source:
  edition: SBLGNT
  text: ⸀διαταξάμενος τῷ ἑκατοντάρχῃ τηρεῖσθαι ⸀αὐτὸν ἔχειν τε ἄνεσιν καὶ μηδένα κωλύειν τῶν ἰδίων αὐτοῦ ⸀ὑπηρετεῖν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/023.yaml
  text: And he ordered the centurion to keep him in custody[a], yet to let him have some freedom[b], and to prevent none of his own people from attending to his needs.
translation:
  language: te
  text: అతడు పౌలును కాపలాలో ఉంచాలని, అయితే అతనికి కొంత వెసులుబాటు ఇవ్వాలని[a], అతని సొంతవారిలో ఎవరినీ[b] అతనికి సేవ చేయకుండా అడ్డుకోవద్దని శతాధిపతికి ఆజ్ఞాపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనికి కొంత సౌలభ్యం ఇవ్వాలని” లేదా “కొంత స్వేచ్ఛ ఇవ్వాలని.” గ్రీకు పదం ఉపశమనం, సౌలభ్యం లేదా కఠిన నిర్బంధం నుంచి కొంత స్వేచ్ఛను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అతనికి చెందినవారిలో ఎవరినీ.” ఇది పౌలు సహచరులను లేదా అతనికి సహాయం చేసేవారిని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαταξάμενος
  choice: ఆజ్ఞాపించాడు
  rationale: గ్రీకు కృదంత నిర్మాణాన్ని సహజమైన తెలుగు కథనశైలిలో ప్రధాన క్రియగా వ్యక్తం చేస్తూ, అధికారపూర్వక ఆదేశ భావాన్ని నిలుపుతుంది.
- source_word: τῷ ἑκατοντάρχῃ
  choice: శతాధిపతికి
  rationale: రోమా సైన్యంలో వందమందికి అధిపతిగా ఉండే అధికారిని సూచించే ఖచ్చితమైన, తెలుగు బైబిలు పాఠకులకు పరిచితమైన పదం.
- source_word: τηρεῖσθαι αὐτόν
  choice: పౌలును కాపలాలో ఉంచాలని
  rationale: ఇక్కడ τηρέω సాధారణంగా గమనించడం కాక నిర్బంధంలో కాపలా ఉంచడాన్ని సూచిస్తుంది. పూర్వపద సందర్భం వల్ల αὐτόν ఎవరిని సూచిస్తుందో స్పష్టంచేయడానికి ‘పౌలును’ అని పేర్కొనబడింది.
- source_word: ἔχειν τε ἄνεσιν
  choice: అతనికి కొంత వెసులుబాటు ఇవ్వాలని
  rationale: ἄνεσις కఠిన నిర్బంధం నుంచి ఉపశమనం, సౌలభ్యం లేదా పరిమిత స్వేచ్ఛను సూచించగలదు. ‘కొంత వెసులుబాటు’ పూర్తి విడుదలను సూచించకుండా ఈ విస్తృత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τε ... καὶ
  choice: అయితే ... మరియు భావంతో సమన్వయం
  rationale: రెండు ఆదేశాలను సమన్వయపరుస్తూనే, కాపలాలో ఉంచడం మరియు వెసులుబాటు ఇవ్వడం మధ్య సందర్భసిద్ధమైన వ్యత్యాసాన్ని ‘అయితే’ స్పష్టం చేస్తుంది.
- source_word: μηδένα κωλύειν
  choice: ఎవరూ ... అడ్డుకోవద్దని
  rationale: ఒక్కరినీ ఆటంకపరచకూడదనే సార్వత్రిక నిషేధ భావాన్ని సహజమైన తెలుగు ప్రతికూల నిర్మాణంలో అందిస్తుంది.
- source_word: τῶν ἰδίων αὐτοῦ
  choice: అతని సొంతవారిలో
  rationale: గ్రీకు పదబంధం కుటుంబ సభ్యులు, స్నేహితులు లేదా సహచరులు అని ప్రత్యేకంగా నిర్ధారించదు. ‘సొంతవారు’ ఆ విస్తృతిని కాపాడుతుంది.
- source_word: ὑπηρετεῖν αὐτῷ
  choice: అతనికి సేవచేయకుండా
  rationale: ὑπηρετέω సహాయం చేయడం, అవసరాలు తీర్చడం, సేవలందించడం అనే అర్థాలను కలిగి ఉంటుంది. ‘సేవచేయడం’ మూలంలోని సాధారణతను కాపాడి, మతపరమైన ప్రత్యేకార్థాన్ని బలవంతంగా చేర్చదు.
