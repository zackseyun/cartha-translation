translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘శతాధిపతి’ వంటి సందర్భపరంగా ఖచ్చితమైన బైబిలు పదాన్ని ఉంచుతూ, ‘కొంత వెసులుబాటు’ వంటి సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వ్యక్తీకరణను ఎంచుకున్నాం. మూలంలోని ‘అతని సొంతవారు’ అనే అనిర్దిష్టతను పాఠ్యంలో నిలిపి, సంభావ్య సూచనను పాదటిప్పణిలో మాత్రమే వివరించాం.
