  to: అతడు పౌలును కాపలాలో ఉంచాలని, అయితే అతనికి కొంత వెసులుబాటు ఇవ్వాలని[a], అతని సొంతవారిలో ఎవరినీ[b] అతనికి సేవ చేయకుండా అడ్డుకోవద్దని శతాధిపతికి ఆజ్ఞాపించాడు.
