    issue: The rendering of κράτιστε is stylistically awkward.
    rationale: “మహా ఘనత వహించిన” is overly literal in Telugu and can sound like a descriptive clause rather than an established respectful form of address. A conventional modern formal honorific better represents the Greek vocative.
