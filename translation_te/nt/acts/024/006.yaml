  yaml_path: translation/nt/acts/024/006.yaml
  text: He even tried to defile the temple[a], and we seized him,
translation:
  language: te
  text: అతడు దేవాలయాన్ని అపవిత్రం చేయడానికి సైతం ప్రయత్నించాడు[a]; మేము అతణ్ణి పట్టుకున్నాం,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ఇక్కడ దీర్ఘ పాఠం ఉంది. అందులో, పౌలుకు తమ ధర్మశాస్త్రం ప్రకారం తీర్పు ఇవ్వాలని వారు కోరుకున్నారని, సేనాధిపతి లూసియాస్ అతణ్ణి వారి చేతుల్లోనుండి తీసుకుపోయాడని చెప్పే మాటలు ఉన్నాయి.
    reason: textual_variant
lexical_decisions:
- source_word: ὃς
  choice: అతడు
  rationale: ఈ సంబంధవాచక సర్వనామం ముందుగా ప్రస్తావించిన పౌలును సూచిస్తుంది. తెలుగులో ఈ వాక్యఖండాన్ని సహజంగా కొనసాగించడానికి ‘అతడు’ అనడం సముచితం.
- source_word: καὶ
  choice: కూడా
  rationale: ఆరోపణ తీవ్రతను పెంచే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τὸ ἱερὸν
  choice: దేవాలయాన్ని
  rationale: ἱερόν ఇక్కడ అంతర్గర్భాలయాన్ని మాత్రమే కాక దేవాలయ ప్రాంగణ సముదాయాన్ని సూచించగలదు; సాధారణ పాఠకులకు ‘దేవాలయం’ సహజమైన, విస్తృతమైన పదం.
- source_word: ἐπείρασεν
  choice: ప్రయత్నించాడు
  rationale: ఇక్కడ πειράζω ఒక పని చేయడానికి యత్నించడాన్ని సూచిస్తుంది; ‘ప్రయత్నించాడు’ స్పష్టమైన ఆధునిక తెలుగు.
- source_word: βεβηλῶσαι
  choice: అపవిత్రం చేయడానికి
  rationale: దేవాలయ పవిత్రతను భంగపరచడం లేదా దానిని అపవిత్రం చేయడం అనే ఆచారసంబంధ ఆరోపణను ఇది సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὃν
  choice: అతణ్ణి
  rationale: ఇది పౌలును కర్మగా తిరిగి సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన రూపం.
- source_word: ἐκρατήσαμεν
  choice: మేము పట్టుకున్నాం
  rationale: κρατέωలోని పట్టుకోవడం, అదుపులోకి తీసుకోవడం అనే ప్రత్యక్ష భావాన్ని ‘పట్టుకున్నాం’ నిలుపుతుంది; ‘అరెస్టు చేశాం’ కంటే ఇది మూలపదానికి దగ్గరగా ఉంటుంది.
theological_decisions:
- issue: అపొస్తలుల కార్యాలు 24:6లోని సంక్షిప్త పాఠం మరియు దీర్ఘ పాఠాంతరం
  choice: SBLGNTలో ఉన్న ‘మేము అతణ్ణి పట్టుకున్నాం’తో ముగిసే సంక్షిప్త వాక్యభాగాన్నే ప్రధాన పాఠంలో అనువదించడం
  alternative: కొన్ని ప్రతుల్లో పౌలుకు తమ ధర్మశాస్త్రం ప్రకారం తీర్పు తీర్చాలనుకున్నారని, సేనాధిపతి లూసియ పౌలును వారి చేతుల్లోనుండి తీసుకుపోయాడని తెలిపే దీర్ఘ పాఠం ఉంది.
  rationale: ఇచ్చిన గ్రీకు మూలపాఠం సంక్షిప్త పాఠాన్ని కలిగి ఉంది. అందువల్ల దీర్ఘ పాఠాన్ని ప్రధాన వచనంలో చేర్చకుండా, ముఖ్యమైన ప్రతుల భేదంగా పాదటిప్పణిలో తెలియజేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయస్థాన ఆరోపణకు తగిన గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి. వచనం తరువాతి వాక్యంతో కొనసాగుతున్నందున చివర కామా ఉంచబడింది; పాదటిప్పణి సూచిక సంబంధిత ఆరోపణ తరువాతే ఉంచబడింది.
