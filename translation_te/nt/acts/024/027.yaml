translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. పరిపాలనా వారసత్వాన్ని అక్షరానువాదం చేయకుండా స్పష్టంగా తెలిపాం; χάριτα καταθέσθαι లోని నిజమైన అర్థసంభావ్యతను పాదసూచికలో సంరక్షించాం.
