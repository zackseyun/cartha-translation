id: ACT.24.27
reference: Acts 24:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διετίας δὲ πληρωθείσης ἔλαβεν διάδοχον ὁ Φῆλιξ Πόρκιον Φῆστον· θέλων τε ⸀χάριτα καταθέσθαι τοῖς Ἰουδαίοις ὁ Φῆλιξ κατέλιπε τὸν Παῦλον δεδεμένον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/027.yaml
  text: But when two years had been completed[a], Felix was succeeded by Porcius Festus; and because Felix wanted to lay up favor with the Jews, he left Paul bound.
translation:
  language: te
  text: రెండు సంవత్సరాలు పూర్తయినప్పుడు, ఫేలిక్సు స్థానంలో పోర్కియు ఫేస్తు వచ్చాడు. యూదులకు ఉపకారం చేయాలని[a] కోరుకున్న ఫేలిక్సు, పౌలును బంధితుడిగానే వదిలివెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదుల మెప్పు సంపాదించుకోవాలని.” ఈ గ్రీకు నుడికారం వారికి ఉపకారం చేయడం లేదా వారి ఆదరణ పొందడం అనే భావాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διετίας δὲ πληρωθείσης
  choice: రెండు సంవత్సరాలు పూర్తయినప్పుడు
  rationale: జనిటివ్ అబ్సల్యూట్ సూచించే కాలసంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, πληρωθείσης లోని ‘పూర్తికావడం’ భావాన్ని నిలుపుతుంది.
- source_word: ἔλαβεν διάδοχον
  choice: ఫేలిక్సు స్థానంలో ... వచ్చాడు
  rationale: అక్షరార్థంగా ‘వారసుణ్ణి పొందాడు’ అనడం తెలుగులో అసహజం. అధికార బాధ్యతలో ఒకరి స్థానాన్ని మరొకరు స్వీకరించిన భావాన్ని ఇది స్పష్టంగా తెలియజేస్తుంది.
- source_word: Πόρκιον Φῆστον
  choice: పోర్కియు ఫేస్తు
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణంగా వ్యక్తి పేరును లిప్యంతరీకరించింది.
- source_word: θέλων
  choice: కోరుకున్న
  rationale: ఈ కృదంతం ఫేలిక్సు చేసిన ప్రధాన కార్యానికి ప్రేరణను తెలుపుతుంది; తెలుగు వాక్యంలో సహజమైన కారణసూచక సంబంధాన్ని ఇస్తుంది.
- source_word: χάριτα καταθέσθαι τοῖς Ἰουδαίοις
  choice: యూదులకు ఉపకారం చేయాలని[a]
  rationale: ఈ గ్రీకు నుడికారం యూదులకు ఒక అనుకూల కార్యం చేయడాన్ని సూచించగలదు. వారి ఆదరణ లేదా మెప్పు సంపాదించుకోవడం అనే సందర్భోచిత భావం కూడా సాధ్యమైనందున దానిని పాదసూచికలో నిలిపాం.
- source_word: κατέλιπε
  choice: విడిచిపెట్టాడు
  rationale: ఫేలిక్సు పదవి నుంచి వెళ్లేటప్పుడు పౌలు ఉన్న స్థితిని మార్చకుండా అతణ్ణి వెనుక విడిచిన భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: δεδεμένον
  choice: బంధితుడిగానే
  rationale: పర్ఫెక్ట్ పాసివ్ కృదంతం పౌలు అప్పటికే బంధించబడి అదే స్థితిలో కొనసాగాడని సూచిస్తుంది; ‘చెరసాలలో’ లేదా ‘సంకెళ్లలో’ అని మరింత నిర్దిష్టం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
