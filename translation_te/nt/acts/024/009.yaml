translation:
  language: te
  text: యూదులు కూడా ఆ ఆరోపణలకు తోడై, ఇవన్నీ నిజమేనని చెప్పారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεπέθεντο
  choice: ఆ ఆరోపణలకు మద్దతుగా కలిసివచ్చి
  rationale: సహా దాడి చేయడం లేదా ఒక పక్షంతో కలిసి ఎదిరించడం అనే క్రియ యొక్క బలాన్ని, ఈ న్యాయవిచారణ సందర్భంలో ఆరోపణలకు మద్దతు పలకడంగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δὲ καὶ
  choice: కూడా
  rationale: δέ యొక్క మృదువైన కథన అనుసంధానాన్ని తెలుగులో ప్రత్యేక సంధిపదం లేకుండానే ప్రవాహం తెలియజేస్తుంది; καί ఇతర ఆరోపకులతో యూదులు కూడా చేరారని సూచిస్తుంది.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: విచారణకు హాజరై ఆరోపణలను సమర్థించిన యూదుల గుంపును నేరుగా సూచిస్తుంది.
- source_word: φάσκοντες
  choice: నొక్కిచెప్పారు
  rationale: వారు ఆరోపణలు నిజమని దృఢంగా చెప్పిన భావాన్ని న్యాయసందర్భానికి తగిన సహజ తెలుగులో అందిస్తుంది.
- source_word: ταῦτα
  choice: ఇవన్నీ
  rationale: ముందు చేసిన ఆరోపణల సముదాయాన్ని సూచించే బహువచన నిర్దేశకానికి సహజమైన తెలుగు రూపం.
- source_word: οὕτως ἔχειν
  choice: నిజమే అని
  rationale: అక్షరార్థంగా ‘ఈ విధంగా ఉండడం’ అనే గ్రీకు నుడికారానికి, సందర్భంలో ‘విషయాలు నిజంగానే అలా ఉన్నాయి’ అనే భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
theological_decisions: []
