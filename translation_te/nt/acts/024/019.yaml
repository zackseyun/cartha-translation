revisions:
- from: అయితే ఆసియా ప్రాంతం నుండి వచ్చిన కొందరు యూదులు ఉన్నారు. వారికి నాపై ఏమైనా అభియోగం ఉంటే, వారే మీ సమక్షంలో హాజరై నాపై నేరారోపణ చేయవలసింది.[a][b]
  to: అయితే ఆసియా నుండి వచ్చిన కొందరు యూదులు ఉన్నారు[a]. వారికి నాపై ఏదైనా అభియోగం ఉంటే, వారు మీ ఎదుట హాజరై నాపై ఆరోపణ చేయవలసి ఉండేది[b].
