translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయస్థాన సందర్భానికి తగిన గౌరవప్రదమైన భాష వాడబడింది. దీర్ఘమైన గ్రీకు వాక్యాన్ని తెలుగు సహజ ప్రవాహం కోసం రెండు వాక్యాలుగా అమర్చినా, సంబంధవాక్యంలోని కర్త మరియు నెరవేరని బాధ్యత భావం నిలుపబడ్డాయి.
