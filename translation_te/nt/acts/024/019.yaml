id: ACT.24.19
reference: Acts 24:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τινὲς δὲ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι, οὓς ⸀ἔδει ἐπὶ σοῦ παρεῖναι καὶ κατηγορεῖν εἴ τι ἔχοιεν πρὸς ⸀ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/019.yaml
  text: But there are some Jews from Asia who ought to have been present before you and to accuse me[b][a], if they had anything against me.
translation:
  language: te
  text: అయితే ఆసియా నుండి వచ్చిన కొందరు యూదులు ఉన్నారు[a]. వారికి నాపై ఏదైనా అభియోగం ఉంటే, వారు మీ ఎదుట హాజరై నాపై ఆరోపణ చేయవలసి ఉండేది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “ఆసియా” అంటే ఆధునిక ఆసియా ఖండం కాదు; ఆసియా మైనరులోని రోమా సామ్రాజ్య ప్రావిన్సు.
    reason: cultural_note
  - marker: b
    text: లేదా, “నాపై అభియోగాలు మోపవలసి ఉండేది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ
  choice: అయితే ... కొందరు
  rationale: δὲ యొక్క వ్యతిరేక భావాన్ని ‘అయితే’ సహజంగా వ్యక్తం చేస్తుంది; τινὲς అనిర్దిష్టమైన కొందరిని సూచిస్తుంది.
- source_word: ἀπὸ τῆς Ἀσίας
  choice: ఆసియా ప్రాంతం నుండి వచ్చిన
  rationale: ఇది ఆధునిక ఆసియా ఖండాన్ని కాక రోమా సామ్రాజ్యంలోని ఆసియా ప్రావిన్సును సూచిస్తుంది; ప్రధాన పాఠ్యంలో సహజత్వం కోసం ‘ప్రాంతం’ అని ఉంచి, చారిత్రక వివరాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: Ἰουδαῖοι
  choice: యూదులు
  rationale: యూదా ప్రజలకు ఆధునిక ప్రామాణిక తెలుగులో సాధారణమైన, ఖచ్చితమైన పదం.
- source_word: ἔδει ... παρεῖναι
  choice: హాజరై ... చేయవలసింది
  rationale: ἔδει సూచించే గతకాలపు నెరవేరని బాధ్యతను తెలుగులో ‘చేయవలసింది’ స్పష్టంగా తెలియజేస్తుంది; παρεῖναι న్యాయసందర్భంలో హాజరుకావడాన్ని సూచిస్తుంది.
- source_word: ἐπὶ σοῦ
  choice: మీ సమక్షంలో
  rationale: అధికారిగా ఫేలిక్సు ఎదుట హాజరుకావడం అనే న్యాయపరమైన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: κατηγορεῖν
  choice: నాపై నేరారోపణ చేయవలసింది
  rationale: న్యాయసందర్భంలోని ఆరోపణ లేదా అభియోగం మోపడం అనే forensic భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: εἴ τι ἔχοιεν πρὸς ἐμέ
  choice: వారికి నాపై ఏమైనా అభియోగం ఉంటే
  rationale: εἴ తో కూడిన optative గతసంభావ్యత/షరతు భావాన్ని ‘ఉంటే’ సహజంగా నిలుపుతుంది; సందర్భం న్యాయపరమైనది కాబట్టి ‘అభియోగం’ అనుకూలం.
