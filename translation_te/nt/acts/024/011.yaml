lexical_decisions:
- source_word: δυναμένου σου ἐπιγνῶναι
  choice: మీరు నిర్ధారించుకోగలిగినట్లే
  rationale: అధిపతి వాస్తవాలను పరిశీలించి తెలుసుకోగలడనే న్యాయస్థాన సందర్భాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది. కారణార్థాన్ని అతిగా బలపరచకుండా సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: ἐπιγνῶναι
  choice: నిర్ధారించుకోగలిగిన
  rationale: కాలక్రమానికి సంబంధించిన విషయాన్ని విచారించి నిజమని తెలుసుకోవడం అనే న్యాయపరమైన భావాన్ని తెలియజేస్తుంది.
- source_word: οὐ πλείους εἰσίν μοι ἡμέραι δώδεκα
  choice: పన్నెండు రోజులకు మించి కాలేదు
  rationale: అక్షరార్థంలోని ‘నాకు పన్నెండు కంటే ఎక్కువ రోజులు లేవు’ అనే గ్రీకు కాలవ్యవధి నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἀφ’ ἧς
  choice: అప్పటి నుండి
  rationale: కాలవ్యవధి మొదలైన బిందువును స్పష్టంగా సూచిస్తుంది.
- source_word: ἀνέβην
  choice: వెళ్లిన
  rationale: యెరూషలేముకు ‘పైకి వెళ్లడం’ అనే మూలభాష నుడికారం తెలుగులో కేవలం ‘వెళ్లడం’గా సహజంగా వ్యక్తమవుతుంది; గమ్యం యెరూషలేము అని వాక్యమే స్పష్టం చేస్తుంది.
- source_word: προσκυνήσων
  choice: ఆరాధించడానికి
  rationale: భవిష్యత్ కృదంతంలోని ఉద్దేశార్థాన్ని స్పష్టంగా తెలియజేస్తుంది; మూలంలో కర్మ ప్రత్యక్షంగా లేనందున ‘దేవుణ్ణి’ అని చేర్చలేదు.
- source_word: εἰς Ἰερουσαλήμ
  choice: యెరూషలేముకు
  rationale: నగరాన్ని గమ్యంగా సూచించే εἰς కు సహజమైన తెలుగు సమానార్థకం.
