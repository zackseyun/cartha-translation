translation:
  language: te
  text: 'మీరు నిర్ధారించుకోగలరు[a]: నేను ఆరాధించడానికి యెరూషలేముకు వెళ్లినప్పటి నుండి పన్నెండు రోజులకు మించి కాలేదు.'
