id: ACT.24.14
reference: Acts 24:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁμολογῶ δὲ τοῦτό σοι ὅτι κατὰ τὴν ὁδὸν ἣν λέγουσιν αἵρεσιν οὕτως λατρεύω τῷ πατρῴῳ θεῷ, πιστεύων πᾶσι τοῖς κατὰ τὸν νόμον καὶ ⸂τοῖς ἐν⸃ τοῖς προφήταις γεγραμμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/014.yaml
  text: But I confess this to you[a], that according to the Way, which they call a sect, so I worship the God of our fathers, believing everything written in the Law and in the Prophets[b],
translation:
  language: te
  text: 'అయితే, మీ ముందు నేను ఇది ఒప్పుకుంటున్నాను: వారు ఒక వర్గమని పిలిచే ‘మార్గం’ ప్రకారమే నేను పూర్వీకుల దేవుణ్ణి ఆరాధిస్తున్నాను; ధర్మశాస్త్రంలోనూ ప్రవక్తల గ్రంథాల్లోనూ రాసి ఉన్నవన్నీ నమ్ముతున్నాను.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμολογῶ
  choice: ఒప్పుకుంటున్నాను
  rationale: న్యాయాధికారి ఎదుట పౌలు బహిరంగంగా అంగీకరిస్తున్న భావాన్ని ఇది సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; నేరాన్ని ఒప్పుకోవడం అనే భావాన్ని సందర్భం బలవంతం చేయదు.
- source_word: κατὰ τὴν ὁδόν
  choice: ఆ మార్గం ప్రకారమే
  rationale: అపొస్తలుల కార్యాల్లో తొలి క్రైస్తవ ఉద్యమానికి వాడిన ప్రత్యేక నామమైన ‘మార్గం’ను నిలుపుతూ, κατά సూచించే అనుసరణ లేదా అనుగుణతను ‘ప్రకారమే’ తెలియజేస్తుంది.
- source_word: αἵρεσιν
  choice: శాఖ
  rationale: ఇక్కడ ఈ పదం తరువాతి కాలపు సాంకేతిక అర్థమైన ‘మతవిరోధ బోధ’ను కాక, ఒక ప్రత్యేక వర్గం లేదా పక్షాన్ని సూచిస్తుంది.
- source_word: οὕτως λατρεύω
  choice: ప్రకారమే ... ఆరాధిస్తున్నాను
  rationale: οὕτως ముందున్న ‘మార్గం ప్రకారం’ అనే మాటతో ఆరాధన విధానాన్ని కలుపుతుంది; తెలుగులో ‘ప్రకారమే’ ఆ అనుసంధానాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τῷ πατρῴῳ θεῷ
  choice: మా పూర్వీకుల దేవుణ్ణి
  rationale: ఇశ్రాయేలు పూర్వీకులు ఆరాధించిన దేవుడితో పౌలు తన ఆరాధనకు ఉన్న కొనసాగింపును ఇది స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: πᾶσι τοῖς ... γεγραμμένοις
  choice: రాసి ఉన్నవన్నీ
  rationale: పరిపూర్ణ కర్మణి కృదంతం సూచించే ‘లిఖితంగా నిలిచి ఉన్న’ భావాన్నీ, πᾶσι సూచించే సంపూర్ణతనూ ఇది కాపాడుతుంది.
- source_word: κατὰ τὸν νόμον καὶ τοῖς ἐν τοῖς προφήταις γεγραμμένοις
  choice: ధర్మశాస్త్రంలోనూ ప్రవక్తల గ్రంథాల్లోనూ
  rationale: యూదుల లేఖనాల రెండు గుర్తించదగిన విభాగాలను తెలుగులో స్పష్టంగా సూచిస్తూ, వాటిలో రాయబడిన విషయాలనే పౌలు నమ్ముతున్నాడనే భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: యూదు విశ్వాసంతో ‘మార్గం’కు పౌలు చూపిన సంబంధం
  choice: ‘మార్గం’ ప్రకారమైన తన ఆరాధనను పూర్వీకుల దేవుని ఆరాధనగా, ధర్మశాస్త్రం మరియు ప్రవక్తలపై విశ్వాసంగా పౌలు వివరిస్తున్నట్లు అనువదించబడింది.
  alternative: క్రైస్తవ విశ్వాసాన్ని యూదు విశ్వాసానికి పూర్తిగా వేరైన మతంగా చూపించడం.
  rationale: గ్రీకు వాక్యం ‘మార్గం’ను ఇశ్రాయేలు దేవుని ఆరాధనతోను లేఖనాలపై విశ్వాసంతోను నేరుగా కలుపుతుంది; అందువల్ల తరువాతి చారిత్రక విభజనను వచనంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ న్యాయస్థాన ప్రసంగానికి తగిన గంభీరతను నిలిపాం. ‘మార్గం’, ‘ధర్మశాస్త్రం’, ‘ప్రవక్తల గ్రంథాలు’ అనే పదాలు అపొస్తలుల కార్యాల చారిత్రక-లేఖన సందర్భాన్ని స్పష్టంగా ఉంచుతాయి.
