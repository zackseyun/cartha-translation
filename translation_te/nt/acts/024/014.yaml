- from: 'అయితే, మీ ముందు నేను ఇది ఒప్పుకుంటున్నాను: వారు ఒక శాఖ[a] అని పిలిచే ఆ మార్గం ప్రకారమే నేను మా పూర్వీకుల దేవుణ్ణి[b] ఆరాధిస్తున్నాను; ధర్మశాస్త్రంలోనూ ప్రవక్తల గ్రంథాల్లోనూ రాసి ఉన్నవన్నీ నమ్ముతున్నాను.'
  to: 'అయితే, మీ ముందు నేను ఇది ఒప్పుకుంటున్నాను: వారు ఒక వర్గమని పిలిచే ‘మార్గం’ ప్రకారమే నేను పూర్వీకుల దేవుణ్ణి ఆరాధిస్తున్నాను; ధర్మశాస్త్రంలోనూ ప్రవక్తల గ్రంథాల్లోనూ రాసి ఉన్నవన్నీ నమ్ముతున్నాను.'
