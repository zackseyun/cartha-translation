  yaml_path: translation/nt/acts/024/013.yaml
  text: Nor can they prove to you the things of which they are now accusing me[a].
translation:
  language: te
  text: వారు ఇప్పుడు నాపై చేస్తున్న ఆరోపణలను మీ ఎదుట రుజువు చేయలేరు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మీ ఎదుట సమర్పించలేరు’ లేదా ‘మీకు నిరూపించి చూపలేరు’; ఇక్కడి గ్రీకు క్రియకు ఏదైనా సమర్పించడం లేదా స్థాపించడం అనే అర్థాలు ఉండవచ్చు. ఈ న్యాయసంబంధ సందర్భంలో అది ఆరోపణకు ఆధారం చూపడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: చేయలేరు
  rationale: ముందటి వాక్యంలో పౌలు చేసిన నిరాకరణను కొనసాగించే భావం తెలుగులో ప్రతికూల క్రియ ద్వారా సహజంగా వ్యక్తమవుతుంది; సందర్భంలో ‘అంతేకాదు’ అని చేర్చడం అవసరం లేదు.
- source_word: παραστῆσαι
  choice: రుజువు చేయ
  rationale: ఈ న్యాయసంబంధ సందర్భంలో ఆరోపణలను సమర్థించే ఆధారాలు చూపి స్థాపించడం అనే భావాన్ని ‘రుజువు చేయ’ స్పష్టంగా తెలియజేస్తుంది; ‘సమర్పించు’ లేదా ‘చూపించు’ అనే అర్థాలు కూడా సాధ్యమే.
- source_word: δύνανταί
  choice: చేయలేరు
  rationale: సామర్థ్యాన్ని సూచించే గ్రీకు క్రియను ఆధునిక తెలుగులో సహజమైన ‘లేరు’ రూపంతో వ్యక్తం చేశాం.
- source_word: σοι
  choice: మీ ఎదుట
  rationale: ఫేలిక్సును ఉద్దేశించిన దత్తివిభక్తి ఈ న్యాయవిచారణ సందర్భంలో ‘మీ ఎదుట’గా సహజంగా వినిపిస్తుంది; మరింత అక్షరార్థంగా ‘మీకు’ అని కూడా అనువదించవచ్చు.
- source_word: περὶ ὧν
  choice: ఆరోపణలను
  rationale: ‘ఏ విషయాల గురించి’ అనే సంబంధవాచక నిర్మాణాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా కర్మరూపంలో వ్యక్తం చేశాం; ఆ విషయాలు ఆరోపణలేనని తరువాతి క్రియ స్పష్టం చేస్తుంది.
- source_word: νυνὶ
  choice: ఇప్పుడు
  rationale: ప్రస్తుత న్యాయవిచారణలో జరుగుతున్న ఆరోపణను సూచించే కాలభావాన్ని నేరుగా నిలుపుతుంది.
- source_word: κατηγοροῦσίν μου
  choice: నాపై చేస్తున్న ఆరోపణలను
  rationale: న్యాయపరమైన ‘నాపై ఆరోపణ చేస్తున్నారు’ అనే భావాన్ని స్పష్టంగా, ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
