source:
  edition: SBLGNT
  text: κληθέντος δὲ αὐτοῦ ἤρξατο κατηγορεῖν ὁ Τέρτυλλος λέγων· Πολλῆς εἰρήνης τυγχάνοντες διὰ σοῦ καὶ ⸀διορθωμάτων γινομένων τῷ ἔθνει τούτῳ διὰ τῆς σῆς προνοίας
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/002.yaml
  text: 'And when he had been summoned[a], Tertullus began to accuse him, saying: “Since through you we are enjoying much peace[b], and reforms are being brought to this nation through your foresight,”'
translation:
  language: te
  text: 'అతన్ని పిలిపించినప్పుడు, తెర్తుల్లు అతని మీద నేరారోపణ చేయడం మొదలుపెట్టి ఇలా అన్నాడు: “నీ వల్ల మేము ఎంతో శాంతిని అనుభవిస్తున్నాం; నీ ముందుచూపు వల్ల ఈ జాతికి సంస్కరణలు[a] జరుగుతున్నాయి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మెరుగుదలలు,” లేదా “దిద్దుబాటు చర్యలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθέντος δὲ αὐτοῦ
  choice: అతణ్ణి పిలిపించినప్పుడు
  rationale: ఇది ప్రధాన క్రియకు సందర్భాన్ని తెలిపే genitive absolute. న్యాయ విచారణ సందర్భంలో సాధారణ ‘పిలిచినప్పుడు’ కంటే ‘పిలిపించినప్పుడు’ అధికారిక సమనును సహజంగా సూచిస్తుంది; సర్వనామం పౌలును సూచిస్తుంది.
- source_word: ἤρξατο κατηγορεῖν
  choice: అతని మీద నేరారోపణ చేయడం మొదలుపెట్టి
  rationale: ఆరంభార్థక నిర్మాణాన్ని నిలుపుతూ, న్యాయ సందర్భంలోని κατηγορέω భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ Τέρτυλλος
  choice: తెర్తుల్లు
  rationale: గ్రీకు వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: λέγων
  choice: ఇలా అన్నాడు
  rationale: తరువాత వచ్చే ప్రత్యక్ష ప్రసంగాన్ని సహజమైన తెలుగులో పరిచయం చేస్తుంది.
- source_word: Πολλῆς εἰρήνης τυγχάνοντες
  choice: మేము ఎంతో శాంతిని అనుభవిస్తున్నాం
  rationale: τυγχάνωతో కూడిన షష్ఠీ విభక్తి ఇక్కడ పొందడం లేదా అనుభవించడం అనే భావం ఇస్తుంది; తెర్తుల్లు చేసే అతిశయ ప్రశంసను ‘ఎంతో శాంతి’ నిలుపుతుంది.
- source_word: διὰ σοῦ
  choice: నీ వల్ల
  rationale: διά + genitive తెలిపే సాధనకర్త లేదా కారణ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: διορθωμάτων
  choice: సంస్కరణలు
  rationale: పాలనా సందర్భంలో διόρθωμα సూచించే దిద్దుబాటు చర్యలు లేదా మెరుగుదలలను ‘సంస్కరణలు’ సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయ భావాలు పాదటీకలో ఉన్నాయి.
- source_word: γινομένων
  choice: జరుగుతున్నాయి
  rationale: γίνομαι యొక్క ‘జరగడం/ఉనికిలోకి రావడం’ భావాన్ని అనవసరంగా ప్రత్యక్ష కార్యసాధకుణ్ణి చేర్చకుండా నిలుపుతుంది.
- source_word: τῷ ἔθνει τούτῳ
  choice: ఈ జాతికి
  rationale: ఇక్కడ ἔθνος రోమా పాలన కింద ఉన్న యూదా జాతిని రాజకీయ ప్రజాసమూహంగా సూచిస్తుంది; దత్తి విభక్తి ప్రయోజనార్థాన్ని ‘జాతికి’ సహజంగా తెలియజేస్తుంది.
- source_word: διὰ τῆς σῆς προνοίας
  choice: నీ ముందుచూపు వల్ల
  rationale: πρόνοια ఇక్కడ మానవ పాలకుని ముందస్తు ఆలోచన లేదా వివేకపూర్వక నిర్వహణను సూచిస్తుంది; ‘ముందుచూపు’ దైవిక ‘ప్రావిడెన్స్’ భావాన్ని అనవసరంగా దిగుమతి చేయదు.
theological_decisions:
- issue: మానవ పాలనా సందర్భంలో πρόνοια అనువాదం
  choice: ముందుచూపు
  alternative: దూరదృష్టి; వివేకపూర్వక పరిపాలన; దైవ సంకల్పం/ప్రావిడెన్స్
  rationale: వక్త ఫేలిక్సు అనే మానవ పాలకుని పరిపాలనా ముందాలోచనను పొగుడుతున్నాడు. అందువల్ల దైవ పరిపాలనను సూచించగల పదాన్ని వాడకుండా, గ్రీకు పదంలోని మానవ ముందస్తు ఆలోచన భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయస్థాన సందర్భానికి తగిన గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి. తెర్తుల్లు చేసే అధికారిక ముఖస్తుతి స్వరం నిలుపబడింది. తెలుగు అనువాదంలో ‘ముందుచూపు’ స్పష్టంగా ఉండటంతో దానికి ప్రత్యేక పాదటీక అవసరం లేదు; ప్రధాన పాఠంలోని ఏకైక [a] గుర్తు διορθωμάτωνకు సంబంధించిన ప్రత్యామ్నాయాలను సూచిస్తుంది.
