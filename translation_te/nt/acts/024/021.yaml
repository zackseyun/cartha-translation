source:
  edition: SBLGNT
  text: ἢ περὶ μιᾶς ταύτης φωνῆς ἧς ἐκέκραξα ⸂ἐν αὐτοῖς ἑστὼς⸃ ὅτι Περὶ ἀναστάσεως νεκρῶν ἐγὼ κρίνομαι σήμερον ⸀ἐφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/021.yaml
  text: 'or about this one statement that I shouted while standing among them: ‘It is concerning the resurrection of the dead that I am being judged before you today.’[a][b]'
translation:
  language: te
  text: 'లేదా, వారి మధ్య నిలబడి నేను బిగ్గరగా పలికిన ఈ ఒక్క మాటను[a] గురించైనా: “చనిపోయినవారి పునరుత్థానాన్ని[b] గురించే నేను నేడు మీ ఎదుట విచారణకు గురవుతున్నాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మాట’కు బదులుగా ‘కేక’ లేదా ‘స్వరం’ అని కూడా అనువదించవచ్చు; గ్రీకు పదం పలికిన విషయాన్నిగానీ, దాన్ని పలికిన స్వరం లేదా కేకనుగానీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మృతులలోనుండి పునరుత్థానం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῆς
  choice: మాటను
  rationale: περὶతోను, తరువాత వచ్చే ఉల్లేఖిత విషయంతోను కలిసినప్పుడు ఇది కేవలం స్వరాన్ని కాక పలికిన నిర్దిష్ట మాటను సూచిస్తుంది. ఆధునిక తెలుగులో ‘మాట’ సహజంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: ἐκέκραξα
  choice: నేను బిగ్గరగా పలికిన
  rationale: క్రియ బహిరంగంగా గట్టిగా పలకడాన్ని సూచిస్తుంది. ‘బిగ్గరగా పలికిన’ అనేది తీవ్రతను నిలుపుతూ గౌరవప్రదమైన ఆధునిక తెలుగుగా ఉంటుంది.
- source_word: ἐν αὐτοῖς ἑστὼς
  choice: వారి మధ్య నిలబడి
  rationale: పౌలు పలికినప్పుడు అతని స్థితిని, స్థానాన్ని రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀναστάσεως νεκρῶν
  choice: చనిపోయినవారి పునరుత్థానాన్ని
  rationale: గ్రీకు షష్ఠీ నిర్మాణాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతుంది; ఈ వచనం చెప్పని విధంగా దాన్ని యేసు పునరుత్థానానికి మాత్రమే పరిమితం చేయదు.
- source_word: κρίνομαι
  choice: నాకు తీర్పు జరుగుతోంది
  rationale: వర్తమాన కర్మణి భావాన్ని, న్యాయస్థాన సందర్భాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἐφ’ ὑμῶν
  choice: మీ ఎదుట
  rationale: న్యాయ విచారణలో అధికారుల సమక్షంలో ఉండే భావాన్ని ఇస్తుంది; వారే తీర్పు చర్యకు ఏకైక కర్తలని అనవసరంగా నిర్దేశించదు.
- source_word: ἢ
  choice: లేదా
  rationale: ముందటి వచనంలోని వాదనతో ఉన్న ప్రత్యామ్నాయ సంబంధాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా నిలుపుతుంది.
- source_word: μιᾶς ταύτης
  choice: ఈ ఒక్క
  rationale: ఒకే నిర్దిష్ట ఉచ్చారణపై ఉన్న బలాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: σήμερον
  choice: నేడు
  rationale: స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగు కాలసూచక పదం.
theological_decisions:
- issue: వివాదానికి కారణమైన పునరుత్థానం యొక్క పరిధి
  choice: చనిపోయినవారి పునరుత్థానం అనే సాధారణ భావాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ఇది ప్రత్యేకంగా యేసు పునరుత్థానాన్ని సూచిస్తుందని అనువదించడం
  rationale: περὶ ἀναστάσεως νεκρῶν అనే గ్రీకు పదబంధం సాధారణంగా ఉంది. అపొస్తలుల కార్యముల విస్తృత సందర్భం యేసు పునరుత్థానంతో సంబంధం చూపించినా, ఈ వచనం స్పష్టంగా చెప్పని ప్రత్యేకతను అనువాదంలో చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయస్థాన శైలి వాడబడింది. ‘బిగ్గరగా పలికిన’ ద్వారా κράζω యొక్క బలాన్ని నిలిపి, ‘మీ ఎదుట’ ద్వారా న్యాయసభ సమక్ష భావాన్ని కాపాడాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
