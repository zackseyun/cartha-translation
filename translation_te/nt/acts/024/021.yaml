revisions:
- from: 'లేదా, వారి మధ్య నిలబడి నేను బిగ్గరగా పలికిన ఈ ఒక్క మాటను గురించైనా కావచ్చు: “చనిపోయినవారి పునరుత్థానాన్ని గురించే నేడు మీ ఎదుట నాకు తీర్పు జరుగుతోంది.”[a][b]'
  to: 'లేదా, వారి మధ్య నిలబడి నేను బిగ్గరగా పలికిన ఈ ఒక్క మాటను[a] గురించైనా: “చనిపోయినవారి పునరుత్థానాన్ని[b] గురించే నేను నేడు మీ ఎదుట విచారణకు గురవుతున్నాను.”'
  rationale: The revision removes an unwarranted and awkward ‘కావచ్చు,’ preserves the source's elliptical link to the preceding defense, and uses an idiomatic ongoing-trial expression for κρίνομαι. It also relocates the existing footnote anchors to their corresponding words. No theological narrowing or interpretive expansion has been introduced.
