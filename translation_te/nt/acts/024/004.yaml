id: ACT.24.4
reference: Acts 24:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ ἐπὶ πλεῖόν σε ἐγκόπτω, παρακαλῶ ἀκοῦσαί σε ἡμῶν συντόμως τῇ σῇ ἐπιεικείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/004.yaml
  text: But[a], so that I may not delay you any further[b], I beg you to hear us briefly, in your graciousness.
translation:
  language: te
  text: అయితే, మిమ్మల్ని మరింతసేపు నిలువరించకుండుటకు, మీ దయతో[a] మమ్మల్ని క్లుప్తంగా వినమని మిమ్మల్ని వేడుకుంటున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ న్యాయసమ్మతమైన సౌమ్యతను బట్టి.” ఇక్కడి గ్రీకు పదం న్యాయబద్ధత, సౌమ్యత, లేదా తీర్పులో కనికరాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ μὴ
  choice: అయితే, ... కలిగించకుండా
  rationale: δὲ యొక్క స్వల్ప వ్యత్యాస సూచనను ‘అయితే’ తెలియజేస్తుంది; ἵνα μή యొక్క ఉద్దేశార్థాన్ని సహజమైన తెలుగు ప్రతిషేధక క్రియారూపం వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ πλεῖόν
  choice: ఇంకా ఎక్కువ సమయం
  rationale: ఈ సందర్భంలో ఈ నానుడి ‘మరింతసేపు/ఇంకా ఎక్కువగా’ అనే భావాన్ని ఇస్తుంది; అధికారిగారి సమయాన్ని తీసుకోవడమే ఉద్దేశించిన భావమని సందర్భం సూచిస్తుంది.
- source_word: σε ἐγκόπτω
  choice: మీకు ... ఆటంకం కలిగించకుండా
  rationale: ἐγκόπτω యొక్క ప్రాథమిక ‘అడ్డగించు, ఆటంకపరచు’ పరిధిని కాపాడుతూ, సమయం అనే సందర్భంతో కలిపి తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παρακαλῶ
  choice: వేడుకుంటున్నాను
  rationale: న్యాయస్థానపు మర్యాదపూర్వక విజ్ఞాపనలోని వినయపూర్వక అభ్యర్థన బలాన్ని తెలియజేస్తుంది.
- source_word: ἀκοῦσαί σε ἡμῶν
  choice: మా మాటలను ... వినమని
  rationale: గ్రీకులోని ‘మమ్మల్ని విను’ అనే భావాన్ని తెలుగులో సహజంగా ‘మా మాటలను విను’ అని వ్యక్తం చేస్తుంది; న్యాయవిచారణ సందర్భాన్నీ నిలుపుతుంది.
- source_word: συντόμως
  choice: క్లుప్తంగా
  rationale: మాటలలో సంక్షిప్తతను స్పష్టంగా, ఆధునిక ప్రామాణిక తెలుగులో తెలియజేస్తుంది.
- source_word: τῇ σῇ ἐπιεικείᾳ
  choice: మీ దయతో
  rationale: ἐπιείκεια లోని దయ, మృదుత్వం, న్యాయపరమైన ఉదారత అనే విస్తృత భావాలకు సహజమైన తెలుగు సమానార్థకం; న్యాయసందర్భంలోని ప్రత్యామ్నాయ ఛాయను పాదసూచికలో ఉంచింది.
