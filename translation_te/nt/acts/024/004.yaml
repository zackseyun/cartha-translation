revisions:
- from: అయితే, మీకు ఇంకా ఎక్కువ సమయం ఆటంకం కలిగించకుండా, మీ దయతో మా మాటలను క్లుప్తంగా వినమని మిమ్మల్ని వేడుకుంటున్నాను.[a]
  to: అయితే, మిమ్మల్ని మరింతసేపు నిలువరించకుండుటకు, మీ దయతో[a] మమ్మల్ని క్లుప్తంగా వినమని మిమ్మల్ని వేడుకుంటున్నాను.
  rationale: The revision replaces an unnatural expression with a direct, contextually precise rendering of the Greek idiom for not detaining someone further. It also renders the Greek object directly as “మమ్మల్ని” and places the lexical footnote at “మీ దయతో,” the expression it explains. No theological interpretation has been introduced.
