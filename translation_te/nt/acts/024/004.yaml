    reason: lexical_alternative
  revision_rationale: The revision replaces an unnatural expression with a direct, contextually precise rendering of the Greek idiom for not detaining someone further. It also renders the Greek object directly as “మమ్మల్ని” and places the lexical footnote at “మీ దయతో,” the expression it explains. No theological interpretation has been introduced.
