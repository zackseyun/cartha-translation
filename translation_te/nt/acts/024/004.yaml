translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవసూచక సంబోధనతో కూడిన న్యాయస్థానపు వినయపూర్వక వాక్చాతుర్యాన్ని నిలిపాం. మూలంలోని పొడవైన వాక్య నిర్మాణాన్ని చదవడానికి సహజంగా ఉంచుతూ, దాని ఉద్దేశ సంబంధాన్ని కాపాడాం.
