revisions:
- from: కొన్ని రోజుల తర్వాత, ఫేలిక్స్ యూదురాలైన తన సొంత భార్య ద్రూసిల్లతో వచ్చి, పౌలును పిలిపించి, మెస్సీయ అయిన యేసులో విశ్వాసం గురించి అతడు చెప్పేది విన్నాడు.[a]
  to: కొన్ని రోజుల తర్వాత, ఫేలిక్స్ యూదురాలైన తన సొంత భార్య ద్రూసిల్లాతో వచ్చి, పౌలును పిలిపించి, మెస్సీయ అయిన యేసుపై విశ్వాసం[a] గురించి అతని నుండి విన్నాడు.
  rationale: The revision clarifies faith’s direction toward Messiah Jesus, avoids adding a progressive nuance to ‘heard Paul,’ corrects the natural Telugu name inflection, and places the lexical-alternative anchor directly after the term it qualifies. No disputed textual or theological ambiguity is resolved beyond what the Greek construction itself indicates.
