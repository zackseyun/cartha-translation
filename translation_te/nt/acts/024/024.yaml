id: ACT.24.24
reference: Acts 24:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μετὰ δὲ ἡμέρας τινὰς παραγενόμενος ὁ Φῆλιξ σὺν Δρουσίλλῃ τῇ ⸀ἰδίᾳ γυναικὶ οὔσῃ Ἰουδαίᾳ μετεπέμψατο τὸν Παῦλον καὶ ἤκουσεν αὐτοῦ περὶ τῆς εἰς Χριστὸν ⸀Ἰησοῦν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/024.yaml
  text: After some days[a], Felix came with Drusilla, his own wife, who was Jewish[b], and sent for Paul and heard him concerning faith in Messiah Jesus.
translation:
  language: te
  text: కొన్ని రోజుల తర్వాత, ఫేలిక్స్ యూదురాలైన తన సొంత భార్య ద్రూసిల్లాతో వచ్చి, పౌలును పిలిపించి, మెస్సీయ అయిన యేసుపై విశ్వాసం[a] గురించి అతని నుండి విన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మెస్సీయ అయిన యేసుపై నమ్మకం గురించి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ἡμέρας τινὰς
  choice: కొన్ని రోజుల తర్వాత
  rationale: μετά + accusative కాల సూచనగా ‘కొన్ని రోజుల తర్వాత’ అని అర్థమిస్తుంది. δέ యొక్క స్వల్ప కథన అనుసంధానాన్ని తెలుగులో ప్రత్యేక పదం చేర్చకుండా సహజ వాక్యప్రవాహంలో ఉంచాం.
- source_word: παραγενόμενος
  choice: వచ్చి
  rationale: ఫేలిక్స్ రావడాన్ని సూచించే క్రియావిశేషణాత్మక participle; తరువాతి ప్రధాన క్రియలతో సహజంగా కలుస్తుంది.
- source_word: τῇ ἰδίᾳ γυναικὶ
  choice: తన సొంత భార్య
  rationale: ἰδίᾳ లోని స్వకీయ/ఉద్ఘాటన భావాన్ని ‘సొంత’ నిలుపుతుంది.
- source_word: οὔσῃ Ἰουδαίᾳ
  choice: యూదురాలైన
  rationale: ద్రూసిల్ల యూదురాలు అనే గుర్తింపును సంక్షిప్తంగా, ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μετεπέμψατο
  choice: పిలిపించి
  rationale: ఎవరినైనా రప్పించడానికి కబురు పంపడం అనే మధ్యమవాచక భావానికి సహజమైన తెలుగు రూపం.
- source_word: ἤκουσεν αὐτοῦ
  choice: అతడు చెప్పేది విన్నాడు
  rationale: ἀκούω + genitive ఇక్కడ పౌలు మాట్లాడగా శ్రద్ధగా వినడాన్ని సూచిస్తుంది; తెలుగులో కేవలం ‘అతన్ని విన్నాడు’ కంటే ఇది సహజం.
- source_word: περὶ τῆς εἰς Χριστὸν Ἰησοῦν πίστεως
  choice: మెస్సీయ అయిన యేసులో విశ్వాసం గురించి
  rationale: περί విషయాన్ని, πίστις + εἰς విశ్వాసం యేసువైపు ఉద్దేశించబడటాన్ని తెలియజేస్తాయి. Χριστός ను పేరుగా కాక బిరుదుగా అనువదించాం.
theological_decisions:
- issue: Χριστός యొక్క అనువాదం
  choice: మెస్సీయ అయిన యేసు
  alternative: క్రీస్తు యేసు; యేసు మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదు భావాన్ని కలిగి ఉంది. తెలుగు సహజత్వం కోసం గ్రీకు పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా ‘మెస్సీయ అయిన యేసు’ అని ఇచ్చాం.
- issue: πίστις + εἰς యొక్క భావం
  choice: యేసులో విశ్వాసం
  alternative: యేసుపై నమ్మకం
  rationale: ఈ నిర్మాణం సాధారణంగా యేసువైపు ఉద్దేశించబడిన విశ్వాసాన్ని సూచిస్తుంది; πίστις కు ‘నమ్మకం’ అనే సమీప ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే కథన శైలి. ‘ద్రూసిల్లతో’ అనే రూపం సహజ తెలుగు విభక్తిని అనుసరిస్తుంది.
