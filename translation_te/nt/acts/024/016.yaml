id: ACT.24.16
reference: Acts 24:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν τούτῳ ⸀καὶ αὐτὸς ἀσκῶ ἀπρόσκοπον συνείδησιν ⸀ἔχειν πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους διὰ παντός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/016.yaml
  text: In view of this[a], I myself also strive always to have a blameless conscience before God and men.
translation:
  language: te
  text: ఈ కారణంగా[a] నేను స్వయంగా కూడా దేవుని పట్లను మనుషుల పట్లను ఎటువంటి అభ్యంతరమూ లేని మనస్సాక్షిని కలిగి ఉండటానికి ఎల్లప్పుడూ కృషి చేస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇందులో.’
    reason: గ్రీకు ἐν τούτῳ పదబంధాన్ని అక్షరార్థంగా ఇలా కూడా అనువదించవచ్చు; ప్రధాన పాఠం ముందున్న నిరీక్షణ సందర్భాన్ని దృష్టిలో ఉంచుకున్న కారణార్థాన్ని వ్యక్తం చేస్తుంది.
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ఈ కారణంగా
  rationale: ఈ పదబంధం ముందున్న పునరుత్థాన నిరీక్షణను సూచిస్తూ దాని ఆధారంగా పౌలు చేసే కృషిని తెలియజేస్తుంది. సహజమైన ఆధునిక తెలుగులో కారణార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; మరింత అక్షరార్థమైన రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: καὶ αὐτός
  choice: నేనూ
  rationale: తెలుగులోని ‘నేనూ’ అనే రూపం καί యొక్క సముచ్చయ భావాన్నీ αὐτός యొక్క వ్యక్తిగత నొక్కింపునూ సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: ἀσκῶ
  choice: కృషి చేస్తున్నాను
  rationale: ఈ క్రియ నిరంతరమైన సాధనను, శ్రద్ధతో చేసే ప్రయత్నాన్ని సూచిస్తుంది. ‘కృషి చేస్తున్నాను’ నైతిక ప్రయత్నాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπρόσκοπον
  choice: నిర్దోషమైన
  rationale: మనస్సాక్షికి విశేషణంగా వచ్చినప్పుడు అభ్యంతరం లేదా అపరాధానికి తావులేని స్థితిని సూచిస్తుంది. ‘నిర్దోషమైన మనస్సాక్షి’ ఆధునిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన ప్రయోగం.
- source_word: συνείδησιν
  choice: మనస్సాక్షి
  rationale: వ్యక్తిలోని నైతిక అవగాహనను సూచించే ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: ἔχειν
  choice: కలిగి ఉండడానికి
  rationale: ἀσκῶకు అనుబంధమైన ఉద్దేశార్థక క్రియగా, పౌలు చేసే కృషి లక్ష్యాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους
  choice: దేవుని పట్ల, మనుషుల పట్ల
  rationale: πρός ఇక్కడ సంబంధం మరియు జవాబుదారీతనాన్ని సూచిస్తుంది. పునరుక్తమైన ‘పట్ల’ దేవునితోనూ మానవులతోనూ ఉన్న రెండు సంబంధ పరిమాణాలను స్పష్టంగా నిలుపుతుంది. ‘మనుషులు’ ఇక్కడ సమస్త మానవులను సాధారణంగా సూచిస్తుంది.
- source_word: διὰ παντός
  choice: ఎల్లప్పుడూ
  rationale: నిరంతర కాలవ్యాప్తిని సహజంగా తెలియజేస్తుంది. దీన్ని వాక్యంలో కృషికి సమీపంగా ఉంచినా, నిర్దోషమైన మనస్సాక్షిని నిరంతరం కలిగి ఉండాలనే భావం కూడా సందర్భంలో నిలిచి ఉంటుంది.
theological_decisions:
- issue: ἀνθρώπους అనే బహువచన పదం యొక్క సాధారణ మానవార్థం
  choice: మనుషులు
  alternative: ప్రజలు
  rationale: గ్రీకు పదం ఇక్కడ పురుషులను మాత్రమే కాక మానవులందరినీ సాధారణంగా సూచిస్తుంది. తెలుగులో ‘మనుషులు’ సహజంగానే లింగభేదం లేకుండా మానవులను సూచించగలదు; అందువల్ల ప్రత్యేక పాదటిప్పణి అవసరం లేదు.
- issue: ἐν τούτῳ యొక్క సంబంధార్థం
  choice: ఈ కారణంగా
  alternative: ఇందులోనే
  rationale: ముందటి వచనాల్లో చెప్పిన నిరీక్షణ ఆధారంగా పౌలు చేసే నైతిక కృషిని కారణార్థంగా చదవడం సందర్భానికి అనుకూలం. అయితే గ్రీకు పదబంధంలోని మరింత స్థానిక/పరిధి భావాన్ని పూర్తిగా తొలగించకుండా పాదటిప్పణిలో ప్రత్యామ్నాయం ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘మనస్సాక్షి,’ ‘నిర్దోషమైన,’ ‘కృషి చేస్తున్నాను’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి మూలంలోని నైతిక తీవ్రతను నిలుపుతాయి.
