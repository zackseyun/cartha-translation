  text: ἐλπίδα ἔχων εἰς τὸν θεόν, ἣν καὶ αὐτοὶ οὗτοι προσδέχονται, ἀνάστασιν μέλλειν ⸀ἔσεσθαι δικαίων τε καὶ ἀδίκων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/015.yaml
  text: having hope in God—which these men themselves also accept—that there is going to be a resurrection of both the righteous and the unrighteous[a].
translation:
  language: te
  text: దేవునిపై నాకు ఒక నిరీక్షణ ఉంది—నీతిమంతులకూ అనీతిమంతులకూ పునరుత్థానం కలుగబోతుందనే నిరీక్షణను వీరు కూడా స్వయంగా ఎదురుచూస్తున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వీరు కూడా స్వయంగా అంగీకరించే నిరీక్షణ.” ఇక్కడి గ్రీకు క్రియకు “ఎదురుచూడు/ఆశతో నిరీక్షించు” లేదా “అంగీకరించు” అనే భావాలు ఉండవచ్చు; ఈ సందర్భంలో అది ఉమ్మడిగా ఉన్న నిరీక్షణను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδα ἔχων εἰς τὸν θεόν
  choice: దేవునిలో నిరీక్షణ ఉంచుతూ ఉన్నాను
  rationale: నిరీక్షణకు దేవుడే లక్ష్యమని చూపుతూ, నామవాచక రూపాన్నీ అసమాపక క్రియా భావాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἣν καὶ αὐτοὶ οὗτοι προσδέχονται
  choice: వీరు కూడా స్వయంగా ఎదురుచూస్తున్న నిరీక్షణే అది
  rationale: ἣν అనే సంబంధసర్వనామం ముందున్న ‘నిరీక్షణ’ను సూచిస్తుంది; αὐτοὶ οὗτοι లోని సూచన, ఉద్ఘాటన రెండింటినీ ‘వీరు... స్వయంగా’ తెలియజేస్తుంది. προσδέχονται యొక్క ఎదురుచూచే భావాన్ని ప్రధాన పాఠ్యంలో ఉంచింది.
- source_word: ἀνάστασιν μέλλειν ἔσεσθαι
  choice: పునరుత్థానం కలుగబోతుందని
  rationale: μέλλειν ἔσεσθαι లోని భవిష్య నిరీక్షణను అనవసరమైన తక్షణతను జోడించకుండా వ్యక్తం చేస్తుంది.
- source_word: δικαίων τε καὶ ἀδίκων
  choice: నీతిమంతులకూ అనీతిమంతులకూ
  rationale: τε καὶ సూచించే రెండు వర్గాల సమగ్రతను, వాటి నైతిక వ్యత్యాసాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: పౌలు ప్రకటించిన పునరుత్థానం యొక్క పరిధి
  choice: నీతిమంతులకూ అనీతిమంతులకూ పునరుత్థానం
  alternative: నైతిక వర్గాల వ్యత్యాసాన్ని ప్రాధాన్యపరచని సాధారణ పునరుత్థానం
  rationale: గ్రీకు పాఠ్యం నీతిమంతులు, అనీతిమంతులు అనే రెండు వర్గాలనూ స్పష్టంగా పేర్కొంటుంది. వాటి పునరుత్థాన కాలక్రమం లేదా తీర్పు విధానం గురించి పాఠ్యంలో లేని సిద్ధాంత వివరాలను అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవిచారణ సందర్భానికి తగిన గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘పునరుత్థానం’ స్థిరమైన బైబిలు పదంగా నిలుపబడింది; మూలంలోని పదార్థ సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
