id: ACT.24.25
reference: Acts 24:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διαλεγομένου δὲ αὐτοῦ περὶ δικαιοσύνης καὶ ἐγκρατείας καὶ τοῦ κρίματος τοῦ ⸀μέλλοντος ἔμφοβος γενόμενος ὁ Φῆλιξ ἀπεκρίθη· Τὸ νῦν ἔχον πορεύου, καιρὸν δὲ μεταλαβὼν μετακαλέσομαί σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/025.yaml
  text: But as he was discussing righteousness and self-control and the coming judgment, Felix became afraid and answered, “For now, go away. When I get an opportunity, I will summon you.”
translation:
  language: te
  text: అయితే పౌలు నీతి, ఆత్మనిగ్రహం, రాబోయే తీర్పు గురించి చర్చిస్తుండగా, ఫేలిక్సు భయపడి, “ప్రస్తుతానికి వెళ్లిపో. నాకు అవకాశం దొరికినప్పుడు నిన్ను పిలిపిస్తాను” అని జవాబిచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιοσύνης
  choice: నీతి
  rationale: దేవుని ఎదుట సరైన జీవితం, న్యాయబద్ధత అనే భావవ్యాప్తిని సహజమైన తెలుగు బైబిలు పదంతో తెలియజేస్తుంది.
- source_word: ἐγκρατείας
  choice: ఆత్మనిగ్రహం
  rationale: తన కోరికలు, ప్రవర్తనపై అదుపు కలిగి ఉండడాన్ని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τοῦ κρίματος τοῦ μέλλοντος
  choice: రాబోయే తీర్పు
  rationale: μέλλοντος యొక్క భవిష్యత్ భావాన్ని, κρίμα యొక్క తీర్పు భావాన్ని సంక్షిప్తంగా మరియు నేరుగా నిలుపుతుంది.
- source_word: ἔμφοβος γενόμενος
  choice: భయపడి
  rationale: ‘భయభ్రాంతుడయ్యాడు’ కంటే సహజంగా ఉండి, ఫేలిక్సులో కలిగిన భయాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: Τὸ νῦν ἔχον
  choice: ప్రస్తుతానికి
  rationale: ‘ఇప్పటి పరిస్థితికి/ఇప్పటికి’ అనే గ్రీకు నుడికార భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: καιρὸν μεταλαβών
  choice: నాకు అవకాశం దొరికినప్పుడు
  rationale: తగిన సమయం లేదా అవకాశం లభించినప్పుడు అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; అది తప్పనిసరిగా జరుగుతుందని అదనంగా నిర్ధారించదు.
- source_word: μετακαλέσομαί σε
  choice: నిన్ను పిలిపిస్తాను
  rationale: అధికారంతో తిరిగి రప్పించేందుకు కబురు పంపడం అనే ‘summon’ భావాన్ని ‘పిలుస్తాను’ కంటే కచ్చితంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘నీతి, ఆత్మనిగ్రహం, రాబోయే తీర్పు’ మధ్య సంబంధం
  choice: మూడు అంశాలను సమాంతరంగా ఉంచడం
  alternative: రాబోయే తీర్పును ముందున్న రెండు అంశాల ఫలితంగా వివరణాత్మకంగా కలపడం
  rationale: గ్రీకు వాక్యం మూడు అంశాలను καί ద్వారా సమాంతరంగా పేర్కొంటుంది; వాటి తాత్త్విక సంబంధాన్ని అనువాదంలో అదనంగా నిర్ణయించలేదు.
- issue: రాబోయే తీర్పు యొక్క స్వరూపం
  choice: ‘రాబోయే తీర్పు’ అని మాత్రమే అనువదించడం
  alternative: ‘దేవుని రాబోయే తీర్పు’ లేదా ‘అంతిమ తీర్పు’
  rationale: సందర్భం దైవిక తీర్పును సూచించినప్పటికీ, ఈ వచనంలోని గ్రీకు పాఠ్యంలో ‘దేవుని’ లేదా ‘అంతిమ’ అనే విశేషణాలు లేవు; అందువల్ల వాటిని పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘చర్చిస్తుండగా’ అనేది διαλέγομαι లోని తర్కపూర్వక సంభాషణ/వివరణ భావాన్ని అతిగా సాంకేతికంగా కాకుండా అందిస్తుంది. సందర్భం ద్వారా వక్త పౌలు అని స్పష్టమైనందున అస్పష్టమైన ‘అతడు’కు బదులుగా ‘పౌలు’ వాడబడింది.
