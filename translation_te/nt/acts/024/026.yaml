id: ACT.24.26
reference: Acts 24:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἅμα καὶ ἐλπίζων ὅτι χρήματα δοθήσεται αὐτῷ ὑπὸ τοῦ ⸀Παύλου· διὸ καὶ πυκνότερον αὐτὸν μεταπεμπόμενος ὡμίλει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/026.yaml
  text: At the same time he was hoping that money would be given to him by Paul[a]; therefore he also sent for him more often and talked with him.
translation:
  language: te
  text: అదే సమయంలో, పౌలు తనకు డబ్బు ఇస్తాడని అతడు ఆశిస్తూ ఉండేవాడు[a]. అందువల్ల అతడు కూడా పౌలును మరింత తరచుగా పిలిపించేవాడు, అతనితో మాట్లాడేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ సందర్భంలో మరింత నిర్దిష్టంగా, “పౌలు తనకు లంచం ఇస్తాడని ఆశిస్తూ ఉండేవాడు.” గ్రీకు మూలంలో కేవలం “డబ్బు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα καὶ
  choice: అదే సమయంలో
  rationale: ముందటి వాక్యంలోని సంఘటనతో సమకాలీనంగా ఫేలిక్సు కలిగివున్న ఆశను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐλπίζων
  choice: ఆశిస్తూ ఉన్నాడు
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న నిరీక్షణను కథన సందర్భంలో నిలుపుతుంది.
- source_word: χρήματα
  choice: డబ్బు
  rationale: గ్రీకు పదానికి నేరుగా ‘డబ్బు’ అనే అర్థమే ఉంది. సందర్భం లంచాన్ని సూచించినా, ప్రధాన పాఠంలో దానిని స్పష్టీకరించకుండా మూలంలోని పదార్థాన్ని కాపాడుతుంది.
- source_word: δοθήσεται αὐτῷ ὑπὸ τοῦ Παύλου
  choice: పౌలు తనకు డబ్బు ఇస్తాడని
  rationale: తెలుగులో సహజత్వం కోసం కర్తరి వాక్యంగా మార్చినా, డబ్బు ఇచ్చేవాడు పౌలేనని మరియు అది ఫేలిక్సుకు అందుతుందని స్పష్టంగా నిలుపుతుంది.
- source_word: διὸ καὶ
  choice: అందువల్ల
  rationale: డబ్బుపై ఆశకూ తరువాతి పదేపదే పిలిపించడానికీ మధ్య ఉన్న కారణ-ఫలిత సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; గ్రీకు καί భావం వాక్య ప్రవాహంలో సహజంగా అంతర్లీనమవుతుంది.
- source_word: πυκνότερον
  choice: మరింత తరచుగా
  rationale: తులనాత్మక క్రియావిశేషణంలోని అధిక పునరావృత భావాన్ని యథాతథంగా అందిస్తుంది.
- source_word: μεταπεμπόμενος
  choice: పిలిపించి
  rationale: మధ్యమ కృదంతం సూచించే ‘తన వద్దకు రప్పించుకోవడం’ అనే భావాన్ని నిర్బంధ సందర్భానికి తగిన సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ὡμίλει αὐτῷ
  choice: అతనితో మాట్లాడేవాడు
  rationale: ఒకసారి చేసిన అధికారిక ప్రసంగం కాకుండా, పునరావృతమైన సంభాషణను సూచిస్తుంది.
theological_decisions:
- issue: ఫేలిక్సు ఆశించిన డబ్బును ప్రధాన పాఠంలో ‘లంచం’ అని స్పష్టంగా పేర్కొనాలా
  choice: ప్రధాన పాఠంలో ‘డబ్బు’ అని ఉంచి, లంచం అనే సందర్భార్థాన్ని పాదసూచికలో తెలియజేయడం
  alternative: ‘పౌలు తనకు లంచం ఇస్తాడని ఆశించాడు’ లేదా ‘పౌలు నుండి లంచం ఆశించాడు’
  rationale: సందర్భం అవినీతి ఉద్దేశాన్ని బలంగా సూచిస్తుంది; అయితే మూలంలోని χρήματα అనే పదం నిర్దిష్టంగా ‘లంచం’ కాకుండా ‘డబ్బు’ అని మాత్రమే చెబుతుంది. కాబట్టి మూలంలోని ఉద్దేశపూర్వక పదసామాన్యతను కాపాడుతూ సందర్భార్థాన్ని పాదసూచికలో అందించడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథన శైలిలో ఉంది. ‘మాట్లాడేవాడు’ అనే రూపం పునరావృత చర్యను, ‘మరింత తరచుగా’ తులనాత్మక భావాన్ని నిలుపుతున్నాయి.
