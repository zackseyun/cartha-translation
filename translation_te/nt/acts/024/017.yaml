source:
  edition: SBLGNT
  text: δι’ ἐτῶν δὲ πλειόνων ⸂ἐλεημοσύνας ποιήσων εἰς τὸ ἔθνος μου παρεγενόμην⸃ καὶ προσφοράς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/017.yaml
  text: After several years I came to bring alms to my nation[a], and offerings.
translation:
  language: te
  text: అనేక సంవత్సరాల తర్వాత నేను నా ప్రజలకు దాతృత్వ కానుకలు[a] ఇవ్వడానికి, అర్పణలు సమర్పించడానికి వచ్చాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, అవసరంలో ఉన్నవారికి ఇచ్చే దాతృత్వ కానుకలు.
    reason: ἐλεημοσύνας అనే గ్రీకు పదం అవసరంలో ఉన్నవారికి ఇచ్చే దానాలను సూచిస్తుంది.
lexical_decisions:
- source_word: δι’ ἐτῶν δὲ πλειόνων
  choice: చాలా సంవత్సరాల తర్వాత
  rationale: διά + షష్ఠీ విభక్తి గడిచిన కాలవ్యవధి తర్వాత అనే భావాన్ని ఇస్తుంది; πλειόνων ఇక్కడ సహజంగా ‘చాలా సంవత్సరాలు’ అని అర్థమవుతుంది. δέ యొక్క స్వల్ప అనుసంధాన భావాన్ని తెలుగులో ప్రత్యేక పదం లేకుండానే వాక్యప్రవాహం తెలియజేస్తుంది.
- source_word: ἐλεημοσύνας
  choice: దానధర్మాలు
  rationale: ఈ పదం అవసరంలో ఉన్నవారికి చేసే దాతృత్వ సహాయాన్ని సూచిస్తుంది. ‘దానధర్మాలు’ ఆధునిక తెలుగులో సహజంగా ఉండి, కార్యం మరియు కానుకలు అనే రెండు కోణాలనూ కలిగి ఉంటుంది.
- source_word: ποιήσων
  choice: చేయడానికి
  rationale: ποιέω యొక్క మూలార్థం ‘చేయడం’; ἐλεημοσύνας తో కలిసి ఇది దానధర్మాలు చేయడం అనే సహజమైన ప్రయోగాన్ని ఇస్తుంది.
- source_word: εἰς τὸ ἔθνος μου
  choice: నా జాతివారికి
  rationale: ἔθνος ఇక్కడ పౌలు తనవారిగా పేర్కొనే యూదా ప్రజలను సూచిస్తుంది. ‘నా జాతివారికి’ జాతి భావాన్ని నిలుపుతూ, సహాయం అందుకునే ప్రజలను సహజంగా సూచిస్తుంది.
- source_word: παρεγενόμην
  choice: వచ్చాను
  rationale: παραγίνομαι ఇక్కడ ఒక చోటికి రావడం లేదా చేరుకోవడం అనే అర్థంలో ఉంది; ‘వచ్చాను’ పౌలు స్వీయవివరణకు సరళమైన సహజ రూపం.
- source_word: προσφοράς
  choice: అర్పణలు సమర్పించడానికి
  rationale: προσφοράς అర్పణలను సూచిస్తుంది; వాటి ఖచ్చిత స్వరూపాన్ని గ్రీకు పాఠం చెప్పదు. తెలుగులో సమాంతర ఉద్దేశ్యాన్ని స్పష్టంగా చెప్పేందుకు ముందున్న ποιήσων భావాన్ని విస్తరించి ‘సమర్పించడానికి’ అని ఇచ్చాం.
theological_decisions:
- issue: యెరూషలేములో పౌలు చేసిన దాతృత్వ కార్యం స్వరూపం
  choice: ‘దానధర్మాలు’ అని అనువదించడం
  alternative: ‘పేదల కోసం కానుకలు’ లేదా ‘భిక్షాదానాలు’
  rationale: ఇది ప్రధానంగా పదార్థ సంబంధమైన నిర్ణయం. ‘దానధర్మాలు’ అవసరంలో ఉన్నవారికి ఇచ్చే సహాయం అనే భావాన్ని తెలియజేస్తుంది; అదే సమయంలో మూలపాఠం చెప్పని నిర్దిష్ట పంపిణీ విధానాన్ని చేర్చదు.
- issue: προσφοράς యొక్క ఖచ్చిత స్వరూపం
  choice: ‘అర్పణలు’ అని విస్తృతంగా ఉంచడం
  alternative: ‘బలి అర్పణలు’ లేదా ‘దేవునికి అర్పణలు’
  rationale: సందర్భం దేవాలయ సంబంధ భావాన్ని సూచించగలిగినా, ఈ వాక్యంలో గ్రీకు పదం అర్పణల రకాన్ని స్పష్టంగా నిర్దేశించదు. అందువల్ల సాధారణ పదమే మూలంలోని విస్తృతతను కాపాడుతుంది.
translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘నా జాతివారికి’ మూలంలోని ἔθνος భావాన్ని సహజంగా నిలుపుతుంది; ‘అర్పణలు’ అనే పదం ఉద్దేశపూర్వకంగా నిర్దిష్టీకరించబడలేదు.
