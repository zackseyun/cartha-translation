id: ACT.24.5
reference: Acts 24:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εὑρόντες γὰρ τὸν ἄνδρα τοῦτον λοιμὸν καὶ κινοῦντα ⸀στάσεις πᾶσι τοῖς Ἰουδαίοις τοῖς κατὰ τὴν οἰκουμένην πρωτοστάτην τε τῆς τῶν Ναζωραίων αἱρέσεως,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/005.yaml
  text: For we have found this man to be a plague, stirring up riots among all the Jews throughout the inhabited world, and also a ringleader of the sect of the Nazarenes,
translation:
  language: te
  text: ఎందుకంటే, ఈ మనిషి పీడవంటివాడని, ప్రపంచమంతటా ఉన్న యూదులందరిలో అల్లర్లు రేపుతున్నాడని, నజరేయుల వర్గానికి నాయకుడని మేము కనుగొన్నాం.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιμόν
  choice: ఒక పీడలా ఉన్నాడు
  rationale: అక్షరార్థంగా ‘తెగులు/మహమ్మారి’; ఇక్కడ వ్యక్తిని సమాజానికి ప్రమాదకరమైన పీడగా నిందించే రూపకాలంకారం. ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ఉపమాన రూపంలో ఇచ్చాం.
- source_word: κινοῦντα στάσεις
  choice: అల్లర్లు రేపుతున్నాడు
  rationale: στάσεις అనే పదం కలహాలు, తిరుగుబాట్లు, అల్లర్లు అనే పరిధి కలిగి ఉంది; న్యాయస్థాన ఆరోపణ సందర్భంలో ‘అల్లర్లు’ తగిన బలాన్ని నిలుపుతుంది.
- source_word: τῇ οἰκουμένῃ
  choice: లోకమంతటా
  rationale: అక్షరార్థం ‘నివాసిత ప్రపంచం’; అప్పటి రోమా ప్రపంచాన్ని సూచించే సాధారణ ప్రయోగాన్ని సహజమైన సంక్షిప్త తెలుగులో తెలిపాం.
- source_word: πρωτοστάτην
  choice: నాయకుడు
  rationale: ముందుండి నడిపేవాడు లేదా ప్రధాన నాయకుడు అనే భావం; ఆరోపణలోని నాయకత్వ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: αἱρέσεως
  choice: తెగ
  rationale: ఈ సందర్భంలో ఒక ప్రత్యేక మతవర్గం లేదా పక్షం; తరువాతి కాలపు ‘మతవిరోధ బోధ’ అనే సాంకేతిక భావాన్ని అనవసరంగా దిగుమతి చేయకుండా ‘తెగ’ ఎంచుకున్నాం.
- source_word: Ναζωραίων
  choice: నజరేయుల
  rationale: యేసు నజరేయునితో గుర్తింపబడిన ఆయన అనుచరులకు ప్రత్యర్థులు ఉపయోగించిన వర్గనామాన్ని నిలిపాం.
theological_decisions:
- issue: αἵρεσις పదానికి తరువాతి కాలపు సిద్ధాంతపరమైన భావం
  choice: తెగ
  alternative: మతవిరోధ వర్గం
  rationale: గ్రీకు పదం ఇక్కడ ఒక పక్షం లేదా మతవర్గాన్ని సూచిస్తుంది; తరువాత ఏర్పడిన ‘heresy’ అనే సిద్ధాంతపరమైన తీర్పును వచనంలో చేర్చలేదు.
- issue: వక్త చేసిన ఆరోపణలను వాస్తవ ప్రకటనలుగా వినిపించే ప్రమాదం
  choice: ‘అని ... అని ... అని మేము కనుగొన్నాం’ అనే ఆరోపణాత్మక నిర్మాణం
  alternative: పౌలు నిజంగానే అల్లర్లు రేపాడని నేరుగా చెప్పడం
  rationale: ఇది తెర్తుల్లు చేసిన న్యాయస్థాన ఆరోపణ; కథకుని స్వతంత్ర తీర్పు కాదు. వాక్య నిర్మాణం ఆ భేదాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయస్థానంలోని తీవ్ర ఆరోపణ స్వరాన్ని గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే భాషలో నిలిపాం. మూలంలోని వరుస ఆరోపణలను సహజ తెలుగు వాక్యక్రమంలో అమర్చాం.
