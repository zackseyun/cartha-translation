  text: ἐν ⸀αἷς εὗρόν με ἡγνισμένον ἐν τῷ ἱερῷ, οὐ μετὰ ὄχλου οὐδὲ μετὰ θορύβου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/018.yaml
  text: In these things they found me purified in the temple[a], not with a crowd nor with an uproar[b],
translation:
  language: te
  text: ఈ విషయాల్లో వారు నన్ను ఆలయంలో ఆచారపరంగా శుద్ధి పొందినవాడిగా[a] కనుగొన్నారు; నా వెంట జనసమూహమూ లేదు, కలకలమూ లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ విషయాల సమయంలో వారు నన్ను ఆలయంలో శుద్ధి పొందినవాడిగా కనుగొన్నారు.” గ్రీకు పదబంధాన్ని మరింత అక్షరార్థంగా “వీటిలో” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αἷς
  choice: ఈ విషయాల్లో
  rationale: ముందు చెప్పిన కార్యాలు లేదా సందర్భాలను సూచించే స్త్రీలింగ బహువచన సంబంధపదబంధం. తెలుగు భాషలో సహజంగా ఉండేలా, దాని పూర్వాపర సంబంధాన్ని నిలుపుతుంది.
- source_word: εὗρόν με
  choice: వారు నన్ను ... కనుగొన్నారు
  rationale: సందర్భంలో εὑρίσκω అంటే ఆలయంలో పౌలును చూసి కనుగొనడం. ‘కనుగొన్నారు’ దాని సాధారణ కథనార్థాన్ని నిలుపుతుంది.
- source_word: ἡγνισμένον
  choice: శుద్ధి ఆచారం పూర్తిచేసినవాడిగా
  rationale: ἁγνίζω యొక్క perfect passive participle పూర్తయిన ఆచారపరమైన శుద్ధి ఫలితస్థితిని సూచిస్తుంది. ఈ అనువాదం కేవలం నైతిక పవిత్రతగా అపార్థం కాకుండా ఆచార సంబంధ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: ἐν τῷ ἱερῷ
  choice: ఆలయంలో
  rationale: ἱερόν ఇక్కడ దేవాలయ ప్రాంగణ సముదాయాన్ని సూచిస్తుంది; తెలుగు బైబిలు వాడుకలో ‘ఆలయం’ సహజమైన, విస్తృతమైన పదం.
- source_word: οὐ μετὰ ὄχλου
  choice: నా వెంట జనసమూహమూ లేదు
  rationale: μετά + genitive సహవాసాన్ని సూచిస్తుంది. ‘నా వెంట’ పౌలు జనసమూహంతో కూడి లేడనే న్యాయవాద సందర్భాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ὄχλοςను అతిశయింపకుండా ‘జనసమూహం’గా అనువదించింది.
- source_word: οὐδὲ μετὰ θορύβου
  choice: అల్లరీ లేదు
  rationale: θόρυβος ఇక్కడ బహిరంగ కలకలం లేదా గందరగోళాన్ని సూచిస్తుంది. ‘అల్లరి’ సాధారణ పాఠకులకు సహజంగా ఉండి ప్రజా అశాంతి భావాన్ని అందిస్తుంది.
