id: ACT.24.22
reference: Acts 24:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂Ἀνεβάλετο δὲ αὐτοὺς ὁ Φῆλιξ⸃, ἀκριβέστερον εἰδὼς τὰ περὶ τῆς ὁδοῦ, ⸀εἴπας· Ὅταν Λυσίας ὁ χιλίαρχος καταβῇ διαγνώσομαι τὰ καθ’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/022.yaml
  text: But Felix, having a more accurate knowledge about the Way, put them off, saying, “When Lysias the commander comes down, I will decide your case.”
translation:
  language: te
  text: అయితే, ‘మార్గం’[b] గురించి మరింత ఖచ్చితమైన జ్ఞానం ఉన్న ఫేలిక్స్, “సైనికాధికారి లూసియాస్ దిగివచ్చినప్పుడు మీ వ్యవహారాన్ని[c] నిర్ణయిస్తాను” అని చెప్పి, వారి విచారణను వాయిదా వేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని వాయిదా వేశాడు”; గ్రీకు క్రియ న్యాయపరమైన చర్యను వాయిదా వేయడం లేదా విచారణను నిలిపివేయడం అనే అర్థం ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: “మార్గం” అనేది తొలి క్రైస్తవ ఉద్యమానికి వాడిన పేరు.
    reason: cultural_note
  - marker: c
    text: లేదా, “మీకు సంబంధించిన విషయాలను తేలుస్తాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνεβάλετο
  choice: వాయిదా వేశాడు
  rationale: న్యాయపరమైన చర్యను లేదా తీర్పును తరువాతికి వాయిదా వేయడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: αὐτούς
  choice: వారిని
  rationale: గ్రీకు మూలంలోని పుంలింగ బహువచన సర్వనామాన్ని నేరుగా నిలుపుతుంది; ఇది ఫేలిక్స్ ఎదుట ఉన్న ఇరుపక్షాల వారిని సూచిస్తుంది.
- source_word: ἀκριβέστερον εἰδὼς
  choice: మరింత కచ్చితంగా తెలిసిన
  rationale: ἀκριβέστερον లోని తులనాత్మక భావాన్ని, εἰδὼς లోని జ్ఞానార్థాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: τὰ περὶ τῆς ὁδοῦ
  choice: ‘మార్గం’ గురించి
  rationale: అపొస్తలుల కార్యములలో క్రైస్తవ ఉద్యమానికి వాడిన ప్రత్యేక నామాన్ని అనవసర వివరణ లేకుండా నిలుపుతుంది.
- source_word: Ὅταν ... καταβῇ
  choice: వచ్చాక
  rationale: ఒక నిర్దిష్టమైన భవిష్యత్ రాకను సహజ తెలుగులో తెలియజేస్తుంది; καταβῇ లోని ‘దిగివచ్చు’ అనే ప్రాచీన భౌగోళిక ప్రయోగాన్ని అక్షరార్థంగా మోపదు.
- source_word: χιλίαρχος
  choice: సహస్రాధిపతి
  rationale: రోమా సైనిక అధికార హోదాను సంక్షిప్తంగా, తెలుగు బైబిలు సందర్భానికి తగిన రీతిలో తెలియజేస్తుంది.
- source_word: διαγνώσομαι
  choice: నిర్ణయిస్తాను
  rationale: న్యాయపరంగా పరిశీలించి నిర్ణయం చేయడం అనే సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: τὰ καθ’ ὑμᾶς
  choice: మీ వ్యవహారాన్ని
  rationale: ‘మీకు సంబంధించిన విషయాలు’ అనే మూలభావాన్ని నిలుపుతూ న్యాయసందర్భంలో సహజంగా ఉంటుంది; ‘మీ కేసు’ కంటే స్వదేశీ తెలుగుకు దగ్గరగా ఉంటుంది.
theological_decisions:
- issue: ἡ ὁδός అనే ఉద్యమ నామం
  choice: ‘మార్గం’
  alternative: క్రైస్తవ మార్గం
  rationale: మూలపాఠంలోని సంక్షిప్తమైన ప్రత్యేక నామాన్ని నిలుపుతుంది; ‘క్రైస్తవ’ అనే వివరణను ప్రధాన పాఠంలో చేర్చి భావాన్ని ముందుగానే నిర్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే న్యాయసందర్భ భాష వాడబడింది. ‘మార్గం’ ప్రత్యేక నామమని ఉద్ధరణ చిహ్నాలతో సూచించబడింది; గ్రీకు వాక్యంలోని తులనాత్మక జ్ఞానభావం మరియు నిర్ణయాన్ని వాయిదా వేసిన న్యాయపరమైన స్వరం నిలుపబడ్డాయి.
