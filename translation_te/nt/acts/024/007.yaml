  text: παρελθὼν δὲ Λυσίας ὁ χιλίαρχος μετὰ πολλῆς βίας ἐκ τῶν χειρῶν ἡμῶν ἀπήγαγεν,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/007.yaml
  text: But[a] Lysias the commander came and took him out of our hands with great force,
translation:
  language: te
  text: కానీ[a] సహస్రాధిపతియైన లూసియాస్ వచ్చి, ఎంతో బలప్రయోగంతో అతన్ని మా చేతుల్లోనుండి తీసుకెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనం—అలాగే 6వ వచనం చివరి భాగం, 8వ వచనం మొదటి భాగం—అత్యంత ప్రాచీన గ్రీకు ప్రతుల్లో (క్రీ.శ. 3వ శతాబ్దపు పపైరస్ 74తో పాటు, 4వ శతాబ్దపు సీనైటికస్, వాటికానస్ ప్రతుల్లో) మరియు ప్రాచీన కాప్టిక్ అనువాదాల్లో లేదు. ఇది బైజాంటైన్ అధికసంఖ్యాక ప్రతుల సంప్రదాయంలో, లాటిన్ సంప్రదాయంలో, తరువాతి గ్రీకు ప్రతుల్లో ఉంది. ఫేలిక్సు ఎదుట జరిగిన విచారణ కథనంలో రోమా సైన్యాధికారి జోక్యాన్ని వివరించే తొలి దశ సంపాదకీయ విస్తరణగా ఇది కనిపిస్తుంది.
    reason: textual_critical
lexical_decisions:
- source_word: παρελθών
  choice: వచ్చి
  rationale: ఆ దృశ్యానికి లూసియ రావడాన్ని సూచించే భూతకాల కృదంతాన్ని, సహజమైన తెలుగు కథనశైలిలో ‘వచ్చి’ అని అనువదించాం.
- source_word: χιλίαρχος
  choice: సహస్రాధిపతి
  rationale: రోమా సైన్యంలో ఉన్నత స్థాయి సైనిక అధికారిని సూచించే, అక్షరార్థంగా ‘వెయ్యిమందికి అధిపతి’ అనే భావాన్ని నిలుపుకునే గౌరవప్రదమైన తెలుగు పదం.
- source_word: μετὰ πολλῆς βίας
  choice: ఎంతో బలప్రయోగంతో
  rationale: πολλῆς తీవ్రతను, βίας సూచించే బలవంతపు చర్యను స్పష్టంగా తెలియజేస్తుంది; అనవసరంగా దురుద్దేశపూర్వక హింసను ఆపాదించదు.
- source_word: ἐκ τῶν χειρῶν ἡμῶν ἀπήγαγεν
  choice: అతన్ని మా చేతుల్లోనుండి తీసుకెళ్లాడు
  rationale: వ్యక్తిని వారి అదుపులోనుండి తీసుకుపోయాడనే భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, ‘మా చేతుల్లోనుండి’ అనే మూలపాఠపు రూపకాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. పాఠ్య విమర్శకు సంబంధించిన గుర్తును ‘అయితే’ తర్వాత ఉంచి, మొత్తం వచన స్థితికి వర్తించేలా చేశాం.
