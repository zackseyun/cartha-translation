- from: ఐదు రోజుల తర్వాత ప్రధాన యాజకుడైన అననీయ, కొందరు పెద్దలతోనూ తెర్తుల్లు అనే ఒక న్యాయవాదితోనూ కలిసి కైసరయకు దిగి వచ్చాడు. వారు అధిపతి ఎదుట పౌలుకు వ్యతిరేకంగా తమ ఆరోపణలను తెలియజేశారు.
  to: ఐదు రోజుల తర్వాత ప్రధాన యాజకుడైన అననీయ కొంతమంది పెద్దలతోను, తెర్తుల్లు అనే ఒక వక్తతోను దిగివచ్చాడు. వారు పౌలుకు వ్యతిరేకంగా రాజ్యపాలకుని ఎదుట ఆరోపణలు చేశారు.[a]
