translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ‘న్యాయవాది’ అనే పదం ῥήτωρ యొక్క ఈ సందర్భంలోని న్యాయ ప్రతినిధి భావాన్ని ముందుకు తెస్తుంది. మూలంలో గమ్యస్థానం పునరుక్తం కాకపోయినా, వాక్యం ఒంటరిగా ఇచ్చినప్పుడు దిశ స్పష్టంగా ఉండేందుకు ముందరి సందర్భంలోని కైసరయను చేర్చాం.
