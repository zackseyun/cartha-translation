id: ACT.24.1
reference: Acts 24:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μετὰ δὲ πέντε ἡμέρας κατέβη ὁ ἀρχιερεὺς Ἁνανίας μετὰ ⸂πρεσβυτέρων τινῶν⸃ καὶ ῥήτορος Τερτύλλου τινός, οἵτινες ἐνεφάνισαν τῷ ἡγεμόνι κατὰ τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/001.yaml
  text: After five days[a], the high priest Ananias came down with some elders and a certain orator named Tertullus, and they brought charges against Paul before the governor.
translation:
  language: te
  text: ఐదు రోజుల తర్వాత ప్రధాన యాజకుడైన అననీయ కొంతమంది పెద్దలతోను, తెర్తుల్లు అనే ఒక వక్తతోను దిగివచ్చాడు. వారు పౌలుకు వ్యతిరేకంగా రాజ్యపాలకుని ఎదుట ఆరోపణలు చేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “న్యాయపరంగా వాదించే ప్రతినిధి అయిన తెర్తుల్లు.” గ్రీకు పదం ప్రజలముందు మాట్లాడే వక్తను లేదా న్యాయస్థానంలో వాదించే ప్రతినిధిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ πέντε ἡμέρας
  choice: ఐదు రోజుల తర్వాత
  rationale: μετά + accusative గడిచిన కాలాన్ని సూచిస్తుంది. δέ యొక్క స్వల్ప కథన అనుసంధానం తెలుగులో ప్రత్యేక పదం చేర్చకుండానే సహజంగా వ్యక్తమవుతుంది.
- source_word: κατέβη
  choice: కైసరయకు దిగి వచ్చాడు
  rationale: καταβαίνω లోని దిగువకు ప్రయాణించే దిశను ‘దిగి వచ్చాడు’ నిలుపుతుంది. గమ్యస్థానం ముందరి సందర్భం ద్వారా స్పష్టమైనందున సహజ తెలుగు కోసం ‘కైసరయకు’ను స్పష్టీకరించాం.
- source_word: ὁ ἀρχιερεὺς Ἁνανίας
  choice: ప్రధాన యాజకుడైన అననీయ
  rationale: యూదుల ప్రధాన యాజకుని పదవిని సూచించే ἀρχιερεύςకు ‘ప్రధాన యాజకుడు’ సాధారణమైన, ఖచ్చితమైన తెలుగు రూపం; పేరు తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: μετὰ πρεσβυτέρων τινῶν
  choice: కొందరు పెద్దలతోనూ
  rationale: πρεσβύτεροι ఇక్కడ యూదు నాయకులైన పెద్దలను సూచిస్తుంది; τινῶν యొక్క అనిర్దిష్ట భావాన్ని ‘కొందరు’ నిలుపుతుంది.
- source_word: ῥήτορος Τερτύλλου τινός
  choice: తెర్తుల్లు అనే ఒక న్యాయవాదితోనూ
  rationale: న్యాయస్థాన సందర్భంలో ῥήτωρ న్యాయపరంగా వాదించే ప్రతినిధిని సూచించగలదు. ఆధునిక పాఠకునికి ‘న్యాయవాది’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది; τινόςను ‘ఒక’ ద్వారా నిలిపాం.
- source_word: οἵτινες ἐνεφάνισαν
  choice: వారు … తమ ఆరోపణలను తెలియజేశారు
  rationale: ἐμφανίζω ఇక్కడ అధికారికంగా ఫిర్యాదు లేదా ఆరోపణ సమర్పించడాన్ని సూచిస్తుంది. ‘ఆరోపణలను తెలియజేశారు’ న్యాయపరమైన చర్యను స్పష్టంగా, అతిగా నిర్దిష్టం చేయకుండా వ్యక్తపరుస్తుంది.
- source_word: τῷ ἡγεμόνι
  choice: అధిపతి ఎదుట
  rationale: ἡγεμών రోమా ప్రాదేశిక పాలకుడిని సూచిస్తుంది. ‘ఎదుట’ న్యాయపరమైన సమర్పణ సందర్భానికి సహజమైన తెలుగు ప్రయోగం.
- source_word: κατὰ τοῦ Παύλου
  choice: పౌలుకు వ్యతిరేకంగా
  rationale: న్యాయ సందర్భంలో κατά + genitive ‘వ్యతిరేకంగా’ అనే అర్థం ఇస్తుంది.
