revisions:
- from: మన పితరుల దేవుడు యేసును లేపాడు[a]; ఆ యేసునే మీరు చెట్టుకు[b] వేలాడదీసి చంపారు.
  to: మన పితరుల దేవుడు యేసును లేవనెత్తాడు[a]; ఆయనను మీరు చెట్టుకు[b] వేలాడదీసి చంపారు.
  rationale: The revision retains the source's theological and lexical ambiguity while using idiomatic modern Telugu. It replaces the potentially physical-sounding «లేపాడు» with «లేవనెత్తాడు» and removes unneeded emphasis introduced by «ఆ యేసునే». Footnote anchors and content remain correctly aligned with their respective terms.
