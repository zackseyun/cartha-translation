    text: ఈ క్రియ ఇక్కడ పునరుత్థానాన్ని సూచించవచ్చు; అయితే ఈ వచనంలోని గ్రీకు పాఠ్యం ‘మృతులలోనుండి’ అని స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
