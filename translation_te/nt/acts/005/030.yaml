  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ θεὸς τῶν πατέρων ἡμῶν ἤγειρεν Ἰησοῦν, ὃν ὑμεῖς διεχειρίσασθε κρεμάσαντες ἐπὶ ξύλου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/030.yaml
  text: The God of our fathers raised up Jesus[b][a], whom you killed by hanging on a tree.
translation:
  language: te
  text: మన పితరుల దేవుడు యేసును లేవనెత్తాడు[a]; ఆయనను మీరు చెట్టుకు[b] వేలాడదీసి చంపారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ క్రియ ఇక్కడ పునరుత్థానాన్ని సూచించవచ్చు; అయితే ఈ వచనంలోని గ్రీకు పాఠ్యం ‘మృతులలోనుండి’ అని స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “సిలువపై.” గ్రీకులో అక్షరార్థంగా “చెట్టుకు” అని ఉంది; ఇది ద్వితీయోపదేశకాండము 21:23ను ప్రతిధ్వనింపజేస్తుండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: మన పితరుల దేవుడు
  rationale: ఇది ఇశ్రాయేలు పూర్వీకుల దేవుణ్ణి సూచించే బైబిలు సూత్రప్రాయమైన పదబంధాన్ని నిలుపుతుంది. ‘పితరులు’ మూలంలోని πατέρωνకు నేరమైన సమానార్థకం.
- source_word: ἤγειρεν
  choice: లేపాడు
  rationale: ἐγείρω పునరుత్థానాన్ని సూచించగలదు; అయితే ఈ వచనంలో ‘మృతులలోనుండి’ అనే మాటలు లేవు. ‘లేపాడు’ మూలంలోని సంక్షిప్తతను, భావసంభావ్యతను రెండింటినీ నిలుపుతుంది.
- source_word: Ἰησοῦν
  choice: యేసును
  rationale: తెలుగులో స్థిరపడిన వ్యక్తినామ రూపాన్ని, వాక్యంలోని కర్మవిభక్తితో ఉపయోగించాం.
- source_word: διεχειρίσασθε
  choice: చంపారు
  rationale: ఈ సందర్భంలో క్రియ హింసాత్మకంగా మరణానికి గురిచేయడాన్ని సూచిస్తుంది. ‘చంపారు’ నేరుగా, సహజంగా ఆ బలాన్ని వ్యక్తం చేస్తుంది.
- source_word: κρεμάσαντες
  choice: వేలాడదీసి
  rationale: కర్తలు యేసును వేలాడదీయడం ద్వారా చంపారని తెలిపే సాధనార్థక సంబంధాన్ని సహజమైన తెలుగు క్రియాక్రమంలో వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ ξύλου
  choice: చెట్టుకు
  rationale: ξύλονకు ‘చెట్టు/కలప’ అనే ప్రాథమిక అర్థం ఉంది. ‘చెట్టుకు’ అనే రూపం ద్వితీయోపదేశకాండము 21:23 ప్రతిధ్వనిని కాపాడుతూ, దానిని నేరుగా ‘సిలువ’గా వ్యాఖ్యానించకుండా ఉంచుతుంది.
theological_decisions:
- issue: ἤγειρενను స్పష్టమైన పునరుత్థాన పదజాలంతో అనువదించాలా, లేక సాధారణ ‘లేపాడు’ అనే రూపంలో ఉంచాలా
  choice: లేపాడు
  alternative: మృతులలోనుండి లేపాడు
  rationale: సమీప సందర్భం పునరుత్థానాన్ని బలంగా సూచించినా, ఈ వచనంలోని గ్రీకు పాఠ్యంలో ‘మృతులలోనుండి’ లేదు. అందువల్ల మూలంలోని భావసాంద్రతను విస్తరించకుండా నిలిపాం.
- issue: ξύλουను ‘సిలువ’గా వ్యాఖ్యానించాలా, లేక ‘చెట్టు’ అనే మూలార్థాన్ని నిలుపాలా
  choice: చెట్టుకు
  alternative: సిలువపై
  rationale: మూలంలో σταυρός కాక ξύλον ఉంది. ‘చెట్టు’ అనే పదం ద్వితీయోపదేశకాండము 21:23తో ఉండే సంభావ్య సంబంధాన్ని నిలుపుతుంది; ‘సిలువ’ అనే సందర్భార్థాన్ని పాదసూచికలో అందించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. గ్రీకు వాక్య క్రమాన్ని యాంత్రికంగా అనుసరించకుండా, ప్రధాన వాక్యం తరువాత సంబంధిత వివరణను అర్ధవిరామంతో ఇచ్చి సహజమైన తెలుగు ప్రవాహాన్ని సాధించాం. ‘పితరులు’ అనే బైబిలు పదబంధాన్ని అంతర్‌పాఠ్య సంబంధం కోసం నిలిపాం.
