language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐνοσφίσατο ἀπὸ τῆς τιμῆς, συνειδυίης καὶ τῆς ⸀γυναικός, καὶ ἐνέγκας μέρος τι παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/002.yaml
  text: And he kept back some of the price[a], with his wife also knowing it, and bringing a certain part[b], he laid it at the apostles’ feet.
translation:
  language: te
  text: అతడు అమ్మకపు ధరలో కొంత తనకోసం దాచిపెట్టుకొని[a], తన భార్యకూ తెలిసి ఉండగా, కొంత భాగాన్ని తీసుకువచ్చి అపొస్తలుల పాదాల దగ్గర ఉంచాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అమ్మకపు ధరలో కొంత రహస్యంగా అట్టిపెట్టుకున్నాడు.” గ్రీకు క్రియ తన కోసం మోసపూరితంగా దాచుకోవడం అనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అపొస్తలుల పాదాల దగ్గర.” ఇది డబ్బును వారి ఎదుట ఉంచడాన్ని సూచించే వాస్తవిక వ్యక్తీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνοσφίσατο
  choice: కొంత తన కోసం దాచుకున్నాడు
  rationale: ఈ క్రియలో తన కోసం రహస్యంగా లేదా మోసపూరితంగా అట్టిపెట్టుకోవడం అనే ప్రతికూల భావం ఉంది. తెలుగు వాక్యం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది; దొంగతనం అనే న్యాయపరమైన పదాన్ని మాత్రం అదనంగా చేర్చదు.
- source_word: ἀπὸ τῆς τιμῆς
  choice: అమ్మకపు వెలలో
  rationale: τιμή ఇక్కడ అమ్మడం ద్వారా వచ్చిన వెలను సూచిస్తుంది. ‘అమ్మకపు వెల’ మూలపదానికి దగ్గరగా ఉండి ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: συνειδυίης καὶ τῆς γυναικός
  choice: ఈ సంగతి అతని భార్యకు కూడా తెలుసు
  rationale: జనిటివ్ అబ్సల్యూట్ తెలిపే సహవర్తి పరిస్థితిని సహజమైన స్వతంత్ర తెలుగు వాక్యంగా అందించింది; καί భావాన్ని ‘కూడా’ నిలుపుతుంది.
- source_word: ἐνέγκας μέρος τι
  choice: అతడు కొంత భాగాన్ని తీసుకువచ్చి
  rationale: అనిర్దిష్టమైన μέρος τι ను ‘కొంత భాగం’గా, ప్రధాన క్రియకు ముందున్న పార్టిసిపిల్ చర్యను ‘తీసుకువచ్చి’గా సహజంగా వ్యక్తం చేసింది.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν
  choice: అపొస్తలుల పాదాల దగ్గర ఉంచాడు
  rationale: డబ్బును అపొస్తలుల ఎదుట ఉంచడాన్ని సూచించే స్పష్టమైన దృశ్యరూపాన్ని మూలం ప్రకారం నిలుపుతుంది.
theological_decisions:
- issue: అననీయ చర్యలోని నైతిక భావం
  choice: తటస్థంగా ‘ఉంచుకున్నాడు’ అనకుండా, ‘తన కోసం దాచుకున్నాడు’ అని మోసపూరిత అట్టిపెట్టుకోవడాన్ని సూచించడం
  alternative: డబ్బులో కొంత ఉంచుకున్నాడు
  rationale: νοσφίζομαι మరియు కథా సందర్భం ఇది కేవలం చట్టబద్ధంగా కొంత తన వద్ద ఉంచుకోవడం కాదని, తెలిసే దాచిపెట్టడం అని సూచిస్తాయి. అయితే మూలంలో లేని ప్రత్యేక న్యాయ లేదా సిద్ధాంత వ్యాఖ్యను అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని పార్టిసిపిల్ నిర్మాణాలను తెలుగు పఠనసౌలభ్యం కోసం చిన్న వాక్యాలుగా విభజించినా, సంఘటనల క్రమం మరియు నైతిక బలం నిలుపబడ్డాయి.
