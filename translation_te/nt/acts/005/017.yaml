  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀναστὰς δὲ ὁ ἀρχιερεὺς καὶ πάντες οἱ σὺν αὐτῷ, ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων, ἐπλήσθησαν ζήλου
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/017.yaml
  text: But the high priest rose up[a], and all those with him—that is[b], the party of the Sadducees—and were filled with jealousy.
translation:
  language: te
  text: అయితే ప్రధాన యాజకుడు లేచాడు; అతనితో ఉన్నవారందరూ—అంటే సద్దూకయ్యుల వర్గం వారు—అతనితో కలిసి అసూయతో నిండిపోయారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఈర్ష్యతో.’ గ్రీకు పదానికి ‘ఉత్సాహం’ అనే అర్థం కూడా ఉండవచ్చు; అయితే ఇక్కడి సందర్భంలో ప్రతికూల భావమైన అసూయే సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς
  choice: చర్యకు పూనుకున్నారు
  rationale: ἀνίστημι క్రియారూపం ఇక్కడ కేవలం శారీరకంగా లేచినట్లు కాక, నిర్ణయాత్మక చర్యకు ఉపక్రమించడాన్ని పరిచయం చేసే లూకా వాడుక. తెలుగు సహజత్వం కోసం ప్రధాన యాజకునితో పాటు తరువాతి బహువచన కర్తను కలిపి అనువదించబడింది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి అనుకూల పరిణామాలకు విరుద్ధంగా ఇప్పుడు మొదలయ్యే ప్రతిఘటనను సూచించే మృదువైన వ్యతిరేక అనుసంధానం.
- source_word: ὁ ἀρχιερεὺς
  choice: ప్రధాన యాజకుడు
  rationale: ఏకవచనంలోని యూదుల అత్యున్నత యాజక పదవికి ఆధునిక ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: πάντες οἱ σὺν αὐτῷ
  choice: అతనితో ఉన్నవారందరూ
  rationale: వారి ఖచ్చితమైన అధికార హోదాను ఊహించకుండా ప్రధాన యాజకునితో అనుబంధంగా ఉన్న సమూహాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων
  choice: అంటే సద్దూకయ్యుల వర్గంవారు
  rationale: ఇది ముందున్న సమూహాన్ని వివరించే అన్వయ పదబంధం. αἵρεσις ఇక్కడ తరువాతి కాలపు ‘మతవిరోధ బోధ’ భావంలో కాక, యూదమతంలోని ఒక గుర్తింపుగల వర్గం లేదా శాఖను సూచిస్తుంది.
- source_word: ἐπλήσθησαν
  choice: నిండిపోయారు
  rationale: πίμπλημι కర్మణి రూపం మరియు షష్ఠీ విభక్తి పూరకంతో ఉన్న ‘దేనితోనైనా నిండిపోవడం’ అనే గ్రీకు నుడికారాన్ని నిలుపుతుంది.
- source_word: ζήλου
  choice: అసూయతో
  rationale: ζῆλοςకు ఉత్సాహం, రోషం, అసూయ వంటి అర్థాలు ఉండగలవు; అపొస్తలులపై ప్రతిఘటన చూపే ఈ సందర్భంలో ప్రతికూలమైన అసూయ భావం సరిపోతుంది.
theological_decisions:
- issue: αἵρεσις పదం అనువాదం
  choice: వర్గం
  alternative: శాఖ
  rationale: ఇక్కడ పదం రెండవ దేవాలయ కాలపు యూదమతంలో గుర్తింపుగల సమూహాన్ని సూచిస్తుంది; ‘మతవిరోధం’ వంటి తరువాతి సిద్ధాంతపరమైన భావాన్ని దిగుమతి చేయదు. ‘శాఖ’ కూడా సాధ్యమైనందున పాదసూచికలో ఇచ్చింది.
- issue: ζῆλος పదం సందర్భార్థం
  choice: అసూయ
  alternative: రోషంతో కూడిన ఉత్సాహం
  rationale: పదానికి సానుకూలమైన ‘ఉత్సాహం’ అనే అర్థం సాధ్యమైనప్పటికీ, అపొస్తలులను వ్యతిరేకించే వెంటనే వచ్చే చర్యల సందర్భం ప్రతికూల ప్రేరణను సూచిస్తుంది. ‘ఈర్ష్య’ కూడా సమీప ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని ఏకవచన కృదంతం తరువాత బహువచన ప్రధాన క్రియ రావడం తెలుగులో అసహజంగా ఉండకుండా రెండు వాక్యాలుగా తీర్చిదిద్దబడింది. వివరణాత్మక అన్వయాన్ని దీర్ఘవిరామాలతో ఉంచి, పదార్థ సందిగ్ధతలను పాదసూచికల్లో పరిరక్షించాం.
