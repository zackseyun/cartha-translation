revisions:
- from: అయితే ప్రధాన యాజకుడు, అతనితో ఉన్నవారందరూ—అంటే సద్దూకయ్యుల వర్గంవారు[a]—చర్యకు పూనుకున్నారు. వారు అసూయతో[b] నిండిపోయారు.
  to: అయితే ప్రధాన యాజకుడు లేచాడు; అతనితో ఉన్నవారందరూ—అంటే సద్దూకయ్యుల వర్గం వారు—అతనితో కలిసి అసూయతో నిండిపోయారు.[a]
  rationale: 'A safe correction is necessary because the draft replaces the source’s explicit “rose” with an unstated action. The revised text keeps the contrastive “అయితే,” renders the Sadducees as a party/group, and conveys the contextual negative sense of ζῆλος as jealousy. The footnote anchors are also corrected: the αἵρεσις note is unnecessary because “వర్గం” is clear and accurate in the text, while the lexical ambiguity of ζῆλος remains usefully documented.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:54:30Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft introduces an action not expressed by ἀναστάς: “చర్యకు పూనుకున్నారు” (“undertook action”) replaces the concrete narrative participle “rose/stood up.” It also shifts the singular action of the high priest to the whole group. The revised wording retains the high priest’s rising and states that he and his associates were filled with jealousy.'
  naturalness: The revision uses natural modern Telugu while avoiding an awkward attempt to reproduce the Greek singular participle followed by a plural main verb. “లేచాడు; ... అతనితో కలిసి అసూయతో నిండిపోయారు” is clear narrative Telugu.
  terminology: “ప్రధాన యాజకుడు,” “సద్దూకయ్యుల వర్గం,” and “అసూయ” are appropriate. “వర్గం” correctly avoids the later polemical sense of αἵρεσις. The jealousy footnote should retain “అసూయ” as its principal sense and offer “ఈర్ష్య” and, more broadly, “ఉత్సాహం,” without adding “రోషం,” which is not a direct lexical alternative here.
  issues:
  - severity: high
    issue: “చర్యకు పూనుకున్నారు” is not a translation of Ἀναστὰς.
    rationale: Ἀναστὰς means “having risen/stood up.” Although it can introduce consequential action narratively, the Greek text does not say that they undertook action in this verse.
  - severity: medium
    issue: The draft makes the rising plural and separates the high priest from the group filled with jealousy.
    rationale: The Greek has a singular participle for the high priest, while the plural main verb includes the high priest and all those with him. The revision preserves both elements in idiomatic Telugu.
  - severity: low
    issue: The footnote’s alternative “రోషం” is imprecise for ζῆλος.
    rationale: ζῆλος may mean zeal, jealousy, or envy depending on context; “anger/wrath” is not the most suitable lexical alternative.
  revised_text: అయితే ప్రధాన యాజకుడు లేచాడు; అతనితో ఉన్నవారందరూ—అంటే సద్దూకయ్యుల వర్గం వారు—అతనితో కలిసి అసూయతో నిండిపోయారు.[a]
