    reason: lexical_alternative
  revision_rationale: 'A safe correction is necessary because the draft replaces the source’s explicit “rose” with an unstated action. The revised text keeps the contrastive “అయితే,” renders the Sadducees as a party/group, and conveys the contextual negative sense of ζῆλος as jealousy. The footnote anchors are also corrected: the αἵρεσις note is unnecessary because “వర్గం” is clear and accurate in the text, while the lexical ambiguity of ζῆλος remains usefully documented.'
