language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔπεσεν δὲ παραχρῆμα ⸀πρὸς τοὺς πόδας αὐτοῦ καὶ ἐξέψυξεν· εἰσελθόντες δὲ οἱ νεανίσκοι εὗρον αὐτὴν νεκράν, καὶ ἐξενέγκαντες ἔθαψαν πρὸς τὸν ἄνδρα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/010.yaml
  text: Then she immediately fell at his feet and died. When the young men came in, they found her dead, and they carried her out and buried her beside her husband.
translation:
  language: te
  text: వెంటనే ఆమె అతని పాదాల వద్ద పడి చనిపోయింది. ఆ యువకులు లోపలికి వచ్చి, ఆమెను చనిపోయిన స్థితిలో కనుగొన్నారు. వారు ఆమెను బయటకు మోసుకెళ్లి, ఆమె భర్త పక్కన పాతిపెట్టారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραχρῆμα
  choice: వెంటనే
  rationale: సంఘటన తక్షణమే జరిగిందనే గ్రీకు క్రియావిశేషణ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πρὸς τοὺς πόδας αὐτοῦ
  choice: అతని పాదాల దగ్గర
  rationale: πρός యొక్క స్థానార్థాన్ని సహజంగా వ్యక్తం చేస్తూ, ఆమె పేతురు పాదాల సమీపంలో పడిందనే దృశ్యాన్ని నిలుపుతుంది.
- source_word: ἐξέψυξεν
  choice: చనిపోయింది
  rationale: ఈ సందర్భంలో ప్రాణం విడిచిందనే అర్థాన్ని స్పష్టమైన సాధారణ తెలుగులో అందిస్తుంది; గ్రీకు పదంలోని రూపకాన్ని బలవంతంగా అనుకరించదు.
- source_word: οἱ νεανίσκοι
  choice: ఆ యువకులు
  rationale: మునుపటి సందర్భంలో ప్రస్తావించబడిన యువకులను సూచించే నిర్దిష్ట భావాన్ని ‘ఆ’ ద్వారా నిలుపుతుంది.
- source_word: εὗρον αὐτὴν νεκράν
  choice: ఆమె చనిపోయి ఉండడం చూశారు
  rationale: ఆమెను మృతస్థితిలో కనుగొన్నారనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πρὸς τὸν ἄνδρα αὐτῆς
  choice: ఆమె భర్త పక్కన
  rationale: సమాధి స్థానం ఆమె భర్త సమాధి పక్కనే ఉందనే సందర్భోచిత భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన కథనశైలి పాటించబడింది. మూలంలోని సంఘటనల క్రమం, తక్షణత్వం, మరణాన్ని తెలిపే స్పష్టత యథాతథంగా నిలుపబడ్డాయి.
