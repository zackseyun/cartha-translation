review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the immediate fall, death, arrival of the young men, removal, and burial beside her husband. However, “చనిపోయి ఉండడం చూశారు” renders εὗρον (“found”) as merely “saw,” and is less precise.
  naturalness: “ఆమెను చనిపోయిన స్థితిలో కనుగొన్నారు” is more idiomatic modern Telugu narrative style and directly represents finding her dead. “పాదాల వద్ద” is slightly more natural and exact for the location than “పాదాల దగ్గర.”
  terminology: “చనిపోయింది” is an appropriate plain rendering of ἐξέψυξεν in this narrative. “యువకులు,” “భర్త,” and “పాతిపెట్టారు” are suitable modern-standard terms. No theological terminology or footnotes are required.
  issues:
  - severity: low
    issue: The wording for εὗρον αὐτὴν νεκράν is imprecise and somewhat awkward.
    rationale: “ఆమె చనిపోయి ఉండడం చూశారు” means they saw that she was dead, whereas the Greek says they found her dead. Revising to “ఆమెను చనిపోయిన స్థితిలో కనుగొన్నారు” retains both the discovery verb and the state predicate.
  revised_text: వెంటనే ఆమె అతని పాదాల వద్ద పడి చనిపోయింది. ఆ యువకులు లోపలికి వచ్చి, ఆమెను చనిపోయిన స్థితిలో కనుగొన్నారు. వారు ఆమెను బయటకు మోసుకెళ్లి, ఆమె భర్త పక్కన పాతిపెట్టారు.
  revised_footnotes: []
