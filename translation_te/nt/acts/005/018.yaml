  text: καὶ ἐπέβαλον τὰς ⸀χεῖρας ἐπὶ τοὺς ἀποστόλους καὶ ἔθεντο αὐτοὺς ἐν τηρήσει δημοσίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/018.yaml
  text: And they laid hands on the apostles and put them in public custody[a].
translation:
  language: te
  text: వారు అపొస్తలులపై చేతులు వేసి, వారిని సామాన్య చెరసాలలో ఉంచారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజా నిర్బంధంలో ఉంచారు.” గ్రీకు పదబంధం కేవలం చెరసాల భవనాన్నే కాక, అదుపులో లేదా నిర్బంధంలో ఉంచడాన్ని మరింత విస్తృతంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ
  choice: మీద చేతులు వేసి
  rationale: గ్రీకు నుడికారంలోని రూపాన్ని నిలుపుతూ, ఈ సందర్భంలో బలవంతంగా పట్టుకోవడం అనే భావాన్ని తరువాతి నిర్బంధ వాక్యం స్పష్టం చేస్తుంది.
- source_word: ἀποστόλους
  choice: అపొస్తలులు
  rationale: అపొస్తలుల కార్యములలో ఇది సాధారణ ‘దూతలు’ అనే అర్థంలో కాక, యేసు నియమించి పంపినవారికి స్థిరమైన హోదాగా వాడబడింది.
- source_word: ἔθεντο
  choice: ఉంచారు
  rationale: τίθημι అనే క్రియకు ఈ సందర్భంలో సహజమైన తెలుగు రూపం; నిర్బంధ స్థితిలో పెట్టారనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν τηρήσει
  choice: నిర్బంధంలో
  rationale: τήρησις కాపలా, అదుపు లేదా నిర్బంధ స్థితి/స్థలాన్ని సూచించగలదు. నిర్దిష్టంగా చెరసాల భవనమే అని పరిమితం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: δημοσίᾳ
  choice: బహిరంగ
  rationale: ఇది τηρήσειను విశేషిస్తూ ప్రజా లేదా సామాన్య నిర్బంధాన్ని సూచిస్తుంది. ‘ప్రభుత్వ’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని పరిపాలనా భావం చేరవచ్చు.
