translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘మీద చేతులు వేసి’ అనే నుడికారం మూలభాష రూపాన్ని నిలుపుతుంది; ‘బహిరంగ నిర్బంధం’ మూలంలోని అర్థవిస్తృతిని కాపాడుతుంది.
