id: ACT.5.36
reference: Acts 5:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πρὸ γὰρ τούτων τῶν ἡμερῶν ἀνέστη Θευδᾶς, λέγων εἶναί τινα ἑαυτόν, ᾧ ⸀προσεκλίθη ⸂ἀνδρῶν ἀριθμὸς ὡς⸃ τετρακοσίων· ὃς ἀνῃρέθη, καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διελύθησαν καὶ ἐγένοντο εἰς οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/036.yaml
  text: For before these days Theudas rose up[a], claiming to be somebody, and a number of men, about four hundred, joined him. He was killed[c][b], and all who had been persuaded by him were scattered and came to nothing.
translation:
  language: te
  text: ఎందుకంటే, దీనికి కొంతకాలం ముందు తూదా తలెత్తి, తాను గొప్పవాడినని చెప్పుకున్నాడు.[a] సుమారు నాలుగు వందల మంది పురుషులు అతని పక్షాన చేరారు.[b] అతడు చంపబడ్డాడు; అతనిచేత ఒప్పించబడినవారందరూ[c] చెదరిపోయి, ఏమీ కాకుండాపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా, ‘తాను ఎవరో ఒకడినని చెప్పుకున్నాడు’; భావం: తాను ప్రాముఖ్యమున్న వ్యక్తినని ప్రకటించుకున్నాడు.'
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతనికి తోడయ్యారు’ లేదా ‘అతనితో కలిశారు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘అతనిని అనుసరించినవారందరూ.’ మరింత అక్షరార్థంగా, ‘అతనిచేత ఒప్పించబడినవారందరూ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ γὰρ τούτων τῶν ἡμερῶν
  choice: ఎందుకంటే, ఈ రోజులకు ముందు
  rationale: πρό + షష్ఠీ విభక్తి పూర్వకాలాన్ని సూచిస్తుంది; γάρ గమలీయేలు ఇస్తున్న వివరణాత్మక కారణాన్ని నిలుపుతుంది.
- source_word: ἀνέστη Θευδᾶς
  choice: తూదా లేచి
  rationale: ఇక్కడ ἀνέστη శారీరక పునరుత్థానాన్ని కాక, ఒక నాయకునిగా ముందుకు రావడాన్ని సూచిస్తుంది; ‘లేచి’ మూలంలోని రూపకబలాన్ని నిలుపుతుంది.
- source_word: λέγων εἶναί τινα ἑαυτόν
  choice: తాను గొప్పవాడినని చెప్పుకున్నాడు
  rationale: τινα ἑαυτόν అనే నుడికారం తనను ప్రాముఖ్యమున్న వ్యక్తిగా ప్రకటించుకోవడాన్ని సూచిస్తుంది; సహజమైన తెలుగులో ‘గొప్పవాడు’ ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: ᾧ προσεκλίθη
  choice: అతనితో చేరారు
  rationale: προσεκλίθη ఒక నాయకుని పక్షాన చేరడం లేదా అతనికి అనుబంధమవడం అనే భావాన్ని ఇస్తుంది.
- source_word: ἀνδρῶν ἀριθμὸς ὡς τετρακοσίων
  choice: దాదాపు నాలుగు వందల మంది
  rationale: ὡς సుమారు అనే అర్థాన్ని ఇస్తుంది; సందర్భంలో వీరు పురుషులని పాదసూచికలో స్పష్టం చేసి, ప్రధాన వాక్యాన్ని సహజంగా ఉంచాం.
- source_word: ὃς ἀνῃρέθη
  choice: అతడు చంపబడ్డాడు
  rationale: ἀναιρέω ఇక్కడ చంపడం అనే స్పష్టమైన అర్థంలో ఉంది; కర్మణి రూపాన్ని నిలిపాం.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: అతని మాట నమ్మినవారందరూ
  rationale: ἐπείθοντο అతని చేత ఒప్పించబడిన లేదా అతనిని నమ్మిన వారిని సూచిస్తుంది; ‘అతని మాట నమ్మినవారు’ తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: διελύθησαν
  choice: చెదరిపోయి
  rationale: ఈ క్రియ సమూహం విచ్ఛిన్నమై సభ్యులు చెదరిపోవడాన్ని సూచిస్తుంది.
- source_word: ἐγένοντο εἰς οὐδέν
  choice: వారి ప్రయత్నం వ్యర్థమైపోయింది
  rationale: ‘ఏమీ కాకపోయారు’ అనే అక్షరార్థం తెలుగులో అసహజంగా ఉండవచ్చు; ఈ నుడికారం ఉద్యమం ఫలించకుండా అంతరించిందనే భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: గమలీయేలు ప్రసంగంలోని తూదా చారిత్రక ప్రస్తావన
  choice: గ్రీకు పాఠ్యంలో ఉన్నట్లే గమలీయేలు వాదనలోని చారిత్రక నివేదికగా నేరుగా అనువదించడం
  alternative: బాహ్య చారిత్రక పునర్నిర్మాణాలకు సరిపడేలా అనిశ్చితిని చేర్చడం లేదా వాక్యాన్ని మార్చడం
  rationale: ఈ వాక్యం గమలీయేలు చెప్పిన ఉదాహరణగా ఉంది. అనువాదం మూలపాఠ్యాన్ని ప్రతిబింబించాలి; చారిత్రక సమన్వయాన్ని లేదా తీర్పును వాక్యంలోకి దిగుమతి చేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు నుడికారాల భావాన్ని ప్రధాన పాఠ్యంలో సహజంగా ఇచ్చి, ముఖ్యమైన అక్షరార్థ ప్రత్యామ్నాయాలను పాదసూచికల్లో నిలిపాం.
