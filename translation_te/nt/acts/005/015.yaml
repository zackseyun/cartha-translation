id: ACT.5.15
reference: Acts 5:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥστε ⸂καὶ εἰς⸃ τὰς πλατείας ἐκφέρειν τοὺς ἀσθενεῖς καὶ τιθέναι ἐπὶ ⸀κλιναρίων καὶ κραβάττων, ἵνα ἐρχομένου Πέτρου κἂν ἡ σκιὰ ⸀ἐπισκιάσῃ τινὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/015.yaml
  text: so that they even carried the sick out into the streets and laid them on cots and mats[a], so that as Peter was coming by[c][b], even his shadow might overshadow some of them.
translation:
  language: te
  text: అందువల్ల ప్రజలు రోగులను వీధుల్లోకి కూడా మోసుకొచ్చి, మంచాల మీద, చాపల మీద పడుకోబెట్టేవారు[a]. పేతురు అటుగా వస్తున్నప్పుడు, కనీసం అతని నీడైనా వారిలో ఎవరి మీదనైనా పడాలని అలా చేసేవారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బహిరంగ కూడళ్లలోకి కూడా.” గ్రీకు పదం విశాలమైన వీధులను లేదా తెరచిన ప్రజా ప్రదేశాలను సూచించవచ్చు. “మంచాలు, చాపలు” అనే మాటలు రెండు రకాల పడకలను లేదా పరచుకొని పడుకునే వస్తువులను సూచిస్తున్నాయి.
    reason: lexical_alternative
  - marker: b
    text: 'ఇక్కడ ప్రజల ఉద్దేశమే చెప్పబడింది: పేతురు నీడైనా రోగుల మీద పడాలని వారు వారిని అక్కడ ఉంచారు. నీడ స్వయంగా వారిని స్వస్థపరిచిందని ఈ వచనం స్పష్టంగా చెప్పదు.'
    reason: theological_clarity
lexical_decisions:
- source_word: ὥστε
  choice: అందువల్ల
  rationale: ముందటి సందర్భంలో అపొస్తలుల ప్రభావం పెరగడం వల్ల కలిగిన ఫలితాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: καὶ εἰς τὰς πλατείας
  choice: వీధుల్లోకి కూడా
  rationale: καί లోని విస్తరణ భావాన్ని ‘కూడా’ తెలియజేస్తుంది; πλατεῖαι ఇక్కడ ప్రజలు సంచరించే విశాల వీధులు లేదా బహిరంగ ప్రదేశాలను సూచించవచ్చు.
- source_word: ἐκφέρειν τοὺς ἀσθενεῖς
  choice: రోగులను ... మోసుకొచ్చి
  rationale: చికిత్సా సందర్భంలో ἀσθενεῖς అంటే రోగులు; ἐκφέρειν వారిని ఇళ్లలోనుంచి బయటికి మోసుకురావడాన్ని సూచిస్తుంది.
- source_word: τιθέναι
  choice: పడుకోబెట్టేవారు
  rationale: రోగులను పరుపులపై ఉంచడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ κλιναρίων καὶ κραβάττων
  choice: మంచాల మీద, చాపల మీద
  rationale: రెండు వేర్వేరు రకాల పడక ఉపరితలాల మధ్య ఉన్న మూలభాషా భేదాన్ని సులభమైన పదాలతో నిలుపుతుంది.
- source_word: ἐρχομένου Πέτρου
  choice: పేతురు అటుగా వస్తున్నప్పుడు
  rationale: జనసమూహం దగ్గరగా పేతురు ప్రయాణిస్తూ వెళ్లే భావాన్నీ, చర్య కొనసాగుతున్న కాలభావాన్నీ అందిస్తుంది.
- source_word: κἂν
  choice: కనీసం ... అయినా
  rationale: పేతురు ప్రత్యక్షంగా తాకకపోయినా అతని నీడ పడితే చాలు అనే ప్రజల కనిష్ఠ ఆశను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἡ σκιὰ ἐπισκιάσῃ
  choice: అతని నీడ ... మీదనైనా పడాలని
  rationale: తెలుగులో ‘నీడ పడడం’ సహజమైన ప్రయోగం; ἵνα తో కూడిన సంభావ్య ఉద్దేశాన్ని ‘పడాలని’ నిలుపుతుంది.
- source_word: τινὶ αὐτῶν
  choice: వారిలో ఎవరి మీదనైనా
  rationale: సమూహంలోని ఏ ఒక్కరినైనా సూచించే అనిర్దిష్ట ఏకవచన భావాన్ని ‘ఎవరి మీదనైనా’ సరిగ్గా అందిస్తుంది.
theological_decisions:
- issue: పేతురు నీడకే స్వతంత్ర స్వస్థపరిచే శక్తి ఉందని వాక్యం చెబుతుందా?
  choice: ప్రజలు ఏ ఉద్దేశంతో రోగులను అక్కడ ఉంచారో మాత్రమే అనువాదం తెలుపుతుంది.
  alternative: పేతురు నీడ స్వయంగా రోగులను స్వస్థపరిచిందని స్పష్టంగా చెప్పే రూపం.
  rationale: ἵνα మరియు సంభావ్య క్రియారూపం ప్రజల ఉద్దేశాన్ని లేదా ఆశను తెలియజేస్తాయి. ఈ వచనం నీడే స్వస్థపరిచిందని ప్రత్యక్షంగా ప్రకటించదు; కాబట్టి మూలంలోని కథన నియంత్రణను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘నీడ పడడం,’ ‘అటుగా రావడం’ వంటి సహజ తెలుగు ప్రయోగాలు వాడబడ్డాయి; మూలంలోని ఉద్దేశం/సంభావ్యతను నిర్ధారిత స్వస్థతగా మార్చలేదు.
