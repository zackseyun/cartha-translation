revisions:
- from: వారు అది విని, తెల్లవారుజామున దేవాలయ ప్రాంగణంలోకి వెళ్లి బోధిస్తూ ఉన్నారు. అయితే ప్రధాన యాజకుడు, అతనితో ఉన్నవారు వచ్చి, మహాసభను, ఇశ్రాయేలు కుమారుల పెద్దల మండలి అంతటినీ[a] సమావేశపరిచారు. వారిని తీసుకురావడానికి చెరసాలకు మనుషులను పంపారు.
  to: వారు అది విని, తెల్లవారుజామున దేవాలయ ప్రాంగణంలోకి వెళ్లి బోధిస్తూ ఉన్నారు. అయితే ప్రధాన యాజకుడు, అతనితో ఉన్నవారు వచ్చి, సన్హెద్రిన్ మహాసభను, ఇశ్రాయేలు కుమారుల సమస్త పెద్దల మండలినీ[a] సమావేశపరిచారు. వారిని తీసుకురావడానికి చెరసాలకు పంపారు.
  rationale: మూలపాఠంలో లేని “మనుషులను” తొలగించబడింది. συνέδριον యొక్క చారిత్రక నిర్దిష్టతను నిలుపడానికి “మహాసభ”ను “సన్హెద్రిన్ మహాసభ”గా స్పష్టం చేశాం. γερουσία మరియు “ఇశ్రాయేలు కుమారుల” అనే పదబంధాల విస్తరణాత్మక సంబంధాన్ని, అలాగే “సమస్త” భావాన్ని, సహజ తెలుగు క్రమంలో నిలిపాం. పాదసూచిక గుర్తు మరియు దాని ప్రత్యామ్నాయాలు పాఠంతో సరిపోలేలా సవరించబడ్డాయి.
