id: ACT.5.21
reference: Acts 5:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ εἰσῆλθον ὑπὸ τὸν ὄρθρον εἰς τὸ ἱερὸν καὶ ἐδίδασκον. Παραγενόμενος δὲ ὁ ἀρχιερεὺς καὶ οἱ σὺν αὐτῷ συνεκάλεσαν τὸ συνέδριον καὶ πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ, καὶ ἀπέστειλαν εἰς τὸ δεσμωτήριον ἀχθῆναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/021.yaml
  text: When they heard this[a], they entered the temple courts at daybreak and were teaching. But when the high priest arrived, and those with him, they called together the Sanhedrin and the whole council of the sons of Israel, and sent to the prison to have them brought.
translation:
  language: te
  text: వారు అది విని, తెల్లవారుజామున దేవాలయ ప్రాంగణంలోకి వెళ్లి బోధిస్తూ ఉన్నారు. అయితే ప్రధాన యాజకుడు, అతనితో ఉన్నవారు వచ్చి, సన్హెద్రిన్ మహాసభను, ఇశ్రాయేలు కుమారుల సమస్త పెద్దల మండలినీ[a] సమావేశపరిచారు. వారిని తీసుకురావడానికి చెరసాలకు పంపారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత సహజంగా, “ఇశ్రాయేలు పెద్దల మండలి మొత్తాన్ని” లేదా “ఇశ్రాయేలు పెద్దలందరినీ.”
    reason: γερουσία అనే పదం పెద్దల మండలిని లేదా పెద్దల సమూహాన్ని సూచించగలదు; τῶν υἱῶν Ἰσραήλ అనే పదబంధాన్ని తెలుగులో మరింత సహజంగా వ్యక్తం చేసే ప్రత్యామ్నాయాలను ఈ పాదసూచిక నిలుపుతుంది.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: వారు అది విని
  rationale: ఈ భూతకాల అసమాపక క్రియ మునుపటి వచనంలోని దేవదూత ఆజ్ఞను విన్న తర్వాత జరిగిన కార్యాన్ని సూచిస్తుంది. ‘అది’ అనే పదం ఆ ఆజ్ఞను సహజంగా వెనక్కి సూచిస్తుంది.
- source_word: ὑπὸ τὸν ὄρθρον
  choice: తెల్లవారుజామున
  rationale: ఈ కాలసూచక ప్రయోగం వేకువ సమయాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘తెల్లవారుజామున’ సహజంగానూ స్పష్టంగానూ ఉంది.
- source_word: ἱερὸν
  choice: దేవాలయ ప్రాంగణం
  rationale: ἱερόν పరిశుద్ధస్థలం మాత్రమే కాక మొత్తం దేవాలయ సముదాయాన్ని సూచిస్తుంది. ‘ప్రాంగణం’ ఆ తేడాను సాధారణ పాఠకులకు స్పష్టం చేస్తుంది.
- source_word: ἐδίδασκον
  choice: బోధిస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న కార్యాన్ని సూచిస్తుంది; ఈ రూపం ఆ కొనసాగుదలను నిలుపుతుంది.
- source_word: Παραγενόμενος
  choice: వచ్చి
  rationale: తదుపరి సంఘటనకు ముందు ప్రధాన యాజకుడు అక్కడికి చేరినట్లు ఈ భూతకాల అసమాపక రూపం సూచిస్తుంది; తెలుగులో ‘వచ్చి’ సహజమైన సంఘటనల క్రమాన్ని ఇస్తుంది.
- source_word: οἱ σὺν αὐτῷ
  choice: అతనితో ఉన్నవారు
  rationale: వారి గుర్తింపును మూలపాఠం కంటే మరింత నిర్దిష్టం చేయకుండా వెంట ఉన్న సమూహాన్ని నేరుగా సూచిస్తుంది.
- source_word: συνεκάλεσαν
  choice: సమావేశపరిచారు
  rationale: ఒక పాలక మండలిని పిలిపించి కూడబెట్టడాన్ని ఈ క్రియ తెలియజేస్తుంది; ‘సమావేశపరిచారు’ గౌరవప్రదమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: συνέδριον
  choice: మహాసభ
  rationale: ఇక్కడ ఇది యూదుల పాలక మండలిని, సాధారణంగా సంహెద్రిన్ అని పిలిచే సభను సూచిస్తుంది. ‘మహాసభ’ పాఠకులకు అర్థమయ్యే చారిత్రక-సందర్భోచిత పదం.
- source_word: πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ
  choice: ఇశ్రాయేలు కుమారుల పెద్దల మండలి అంతటినీ
  rationale: γερουσία పెద్దలతో కూడిన మండలిని సూచిస్తుంది. ‘ఇశ్రాయేలు కుమారులు’ అనే కుటుంబ-జాతీయ రూపాన్ని, అలాగే ‘మహాసభ’తో ఈ పదబంధానికి ఉన్న విస్తరణాత్మక లేదా సమాంతర సంబంధంలోని స్వల్ప అస్పష్టతను ఈ అనువాదం నిలుపుతుంది.
- source_word: δεσμωτήριον
  choice: చెరసాల
  rationale: నిర్బంధ స్థలాన్ని సూచించే సాధారణ పదం; ‘చెరసాల’ గౌరవప్రదమైన, సులభంగా అర్థమయ్యే తెలుగు.
- source_word: ἀχθῆναι αὐτούς
  choice: వారిని తీసుకురావడానికి
  rationale: ἀπέστειλαν తర్వాతి కర్మణి క్రియారూపం పంపిన ఉద్దేశాన్ని తెలియజేస్తుంది. ‘వారిని తీసుకురావడానికి’ ఆ ఉద్దేశాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: τῶν υἱῶν Ἰσραήλ పదబంధం
  choice: ఇశ్రాయేలు కుమారుల
  alternative: ఇశ్రాయేలు ప్రజల / ఇశ్రాయేలు పెద్దల
  rationale: మూలంలోని స్పష్టమైన పురుష కుటుంబ-జాతీయ సంజ్ఞను ప్రధాన పాఠంలో నిలిపాం. ఇది సంప్రదాయ జాతీయ నామంగా పనిచేస్తున్నప్పటికీ, దానిని మౌనంగా సాధారణీకరించకుండా మరింత సహజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా వాక్యానికి తగిన గౌరవప్రదమైన శైలి. దేవాలయ పరిశుద్ధస్థలం మరియు మొత్తం ప్రాంగణం మధ్య తేడాను ‘దేవాలయ ప్రాంగణం’తో స్పష్టం చేశాం. సంహెద్రిన్ అనే అపరిచిత లిప్యంతరీకరణకు బదులు ‘మహాసభ’ను వాడాం.
