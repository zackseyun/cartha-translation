id: ACT.5.11
reference: Acts 5:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐγένετο φόβος μέγας ἐφ’ ὅλην τὴν ἐκκλησίαν καὶ ἐπὶ πάντας τοὺς ἀκούοντας ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/011.yaml
  text: And great fear came upon the whole church and upon all who heard these things[a].
translation:
  language: te
  text: సంఘమంతటి మీదా, ఈ సంగతులు విన్న వారందరి మీదా గొప్ప భయం కలిగింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సభ’ లేదా ‘సమాజం’; గ్రీకు పదం ἐκκλησία.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: కలిగింది
  rationale: φόβος అనే కర్తతో γίνομαι ఇక్కడ భయం ఉద్భవించి ప్రజలను ఆవరించిన సంఘటనను సూచిస్తుంది. తెలుగులో ‘భయం కలిగింది’ సహజంగా ఉండి ఆ సంఘటనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: φόβος μέγας
  choice: గొప్ప భయం
  rationale: అననీయ, సప్పీరాలపై వచ్చిన తీర్పు నేపథ్యాన్ని బట్టి φόβος ఇక్కడ విస్మయం కంటే భయాన్నే ప్రధానంగా సూచిస్తుంది; μέγας యొక్క తీవ్రతను ‘గొప్ప’ నిలుపుతుంది.
- source_word: ἐφ’ ὅλην τὴν ἐκκλησίαν
  choice: సంఘమంతటిమీదా
  rationale: ἐκκλησία ఇక్కడ విశ్వాసుల సమాజాన్ని సూచిస్తుంది. ‘సంఘం’ ఆధునిక తెలుగు బైబిలు సందర్భంలో సహజమైనది; ὅλην యొక్క సమగ్రతను ‘అంతటి’ భావంతో, ἐπίని ‘మీద’తో నిలిపాం.
- source_word: πάντας τοὺς ἀκούοντας ταῦτα
  choice: ఈ సంగతులు విన్న వారందరిమీదా
  rationale: ἀκούονταςను ప్రధాన భూతకాల క్రియకు అనుగుణంగా ‘విన్న’ అని సహజంగా ఇచ్చాం. ταῦτα బహువచనాన్ని ‘ఈ సంగతులు’గా స్పష్టంగా నిలిపాం.
theological_decisions:
- issue: ἐκκλησία అనువాదం
  choice: సంఘం
  alternative: సభ / సమాజం
  rationale: అపొస్తలుల కార్యములలో ఈ పదం క్రైస్తవ విశ్వాసుల సముదాయాన్ని సూచిస్తుంది. ‘సంఘం’ ఆ అర్థాన్ని సహజంగా తెలియజేస్తుంది; సంస్థాగత నిర్మాణం గురించి మూలంలో లేని అదనపు భావాన్ని చేర్చదు. నిజమైన పదార్థ ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన వాక్య నిర్మాణం. ‘సంఘమంతటిమీదా ... వారందరిమీదా’ అనే సమాంతర నిర్మాణం మూలంలోని రెండు ἐπί పదబంధాల విస్తృత ప్రభావాన్ని నిలుపుతుంది.
