    reason: lexical_alternative
  revision_rationale: The revision removes the added gathering sense from the second clause and uses a more idiomatic Telugu equivalent for the Lukan expression ‘signs and wonders.’ It preserves the imperfect aspect, the concrete agency expression ‘చేతుల ద్వారా,’ the unspecified referent of ‘వారందరూ,’ and both footnote anchors.
