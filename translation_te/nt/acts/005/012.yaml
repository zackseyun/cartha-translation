reference: Acts 5:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διὰ δὲ τῶν χειρῶν τῶν ἀποστόλων ἐγίνετο σημεῖα καὶ τέρατα ⸂πολλὰ ἐν τῷ λαῷ⸃· καὶ ἦσαν ὁμοθυμαδὸν ⸀ἅπαντες ἐν τῇ Στοᾷ Σολομῶντος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/012.yaml
  text: Many signs and wonders were being done among the people through the hands of the apostles[b][a], and they were all together in Solomon’s Portico.
translation:
  language: te
  text: అపొస్తలుల చేతుల ద్వారా ప్రజల మధ్య అనేక సూచక చిహ్నాలూ అద్భుతాలూ జరుగుతూ ఉండేవి. వారందరూ ఏకమనస్సుతో[a] సొలొమోను మంటపంలో[b] ఉండేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కలిసి.” ఈ గ్రీకు పదం ఒకేచోట ఉండటంతోపాటు వారి ఐక్యతను కూడా నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “సొలొమోను స్తంభాల మంటపంలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ ... τῶν χειρῶν τῶν ἀποστόλων
  choice: అపొస్తలుల చేతుల ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సాధనం లేదా కార్యసాధకత్వాన్ని సూచిస్తుంది. మూలంలోని స్పష్టమైన ‘చేతుల ద్వారా’ అనే రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతకన్నా కథన కొనసాగింపును సూచిస్తుంది; తెలుగులో వాక్యప్రవాహమే ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐγίνετο
  choice: జరుగుతూ ఉండేవి
  rationale: అసంపూర్ణ భూతకాల రూపం గతంలో కొనసాగిన లేదా పదేపదే జరిగిన కార్యాన్ని సూచిస్తుంది.
- source_word: σημεῖα καὶ τέρατα
  choice: సూచక క్రియలూ అద్భుతాలూ
  rationale: లూకా రచనల్లో కనిపించే జంట పదబంధాన్ని వేర్వేరు భావాలతో నిలుపుతూ, σημεῖον యొక్క సూచనాత్మక స్వభావాన్ని ‘సూచక క్రియలు’ తెలియజేస్తుంది.
- source_word: πολλὰ
  choice: అనేక
  rationale: సూచక క్రియలు, అద్భుతాలు రెండింటినీ విశేషించే బహువచన పరిమాణాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῷ λαῷ
  choice: ప్రజల మధ్య
  rationale: కార్యాలు ప్రజల మధ్య జరిగిన పరిధి లేదా స్థలాన్ని తెలియజేస్తుంది; మూలంలో లేని జాతిపరమైన నిర్దిష్టతను చేర్చదు.
- source_word: ὁμοθυμαδὸν
  choice: ఏకమనస్సుతో
  rationale: కేవలం ఒకేచోట ఉండటమే కాక ఉమ్మడి మనోభావం లేదా ఐక్యతను కూడా ఈ క్రియావిశేషణం సూచిస్తుంది.
- source_word: ἅπαντες
  choice: వారందరూ
  rationale: సమూహం మొత్తాన్ని సూచిస్తుంది; అయితే ఆ సమూహం ఎవరో అనువాదంలో మరింత నిర్దిష్టం చేయదు.
- source_word: Στοᾷ Σολομῶντος
  choice: సొలొమోను మంటపంలో
  rationale: στοά అనేది స్తంభాలతో కూడిన కప్పబడిన నడవ లేదా మంటపం. సాధారణ తెలుగు పాఠకుడికి ‘మంటపం’ సహజంగా అర్థమవుతుంది; మరింత నిర్మాణాత్మక ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంది.
theological_decisions:
- issue: ‘వారందరూ’ అనే పదానికి పూర్వపదం
  choice: ఎవరు అనే విషయాన్ని నిర్దిష్టం చేయకుండా ‘వారందరూ’ అని ఉంచడం
  alternative: అపొస్తలులందరూ / విశ్వాసులందరూ
  rationale: గ్రీకులో కర్తకు స్పష్టమైన నామవాచక పూర్వపదం లేదు. అది అపొస్తలులను మాత్రమే సూచిస్తుందా, విస్తృత విశ్వాసుల సమూహాన్ని సూచిస్తుందా అనే విషయాన్ని అనువాదం తీర్మానించకుండా మూలంలోని సందిగ్ధతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. కొనసాగుతున్న కార్యాన్ని ‘జరుగుతూ ఉండేవి’తో, సమూహ ఐక్యతను ‘ఏకమనస్సుతో’ వ్యక్తం చేసింది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
