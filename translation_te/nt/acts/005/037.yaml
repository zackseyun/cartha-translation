source:
  edition: SBLGNT
  text: μετὰ τοῦτον ἀνέστη Ἰούδας ὁ Γαλιλαῖος ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς καὶ ἀπέστησε ⸀λαὸν ὀπίσω αὐτοῦ· κἀκεῖνος ἀπώλετο καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διεσκορπίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/037.yaml
  text: After this[a], Judas the Galilean rose up in the days of the census and drew away people after him. He also perished[b], and all who were persuaded by him were scattered.
translation:
  language: te
  text: ఈ వ్యక్తి తరువాత గలిలయుడైన యూదా జనగణన[a] జరిగిన రోజుల్లో లేచి, ప్రజలను తన వెంట తీసుకుపోయాడు[b]. అతడు కూడా అంతమయ్యాడు; అతని మాటకు ఒప్పుకున్న వారందరూ చెదరిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అధికారిక నమోదు.’ గ్రీకు పదం జనగణనను లేదా అధికారిక నమోదును సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ప్రజలను తమ పూర్వ విధేయతను విడిచి తనను అనుసరించేలా చేశాడు.’ ఈ క్రియ ఇతర విధేయత నుంచి వైదొలగేలా చేయడం అనే భావాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τοῦτον
  choice: అతని తరువాత
  rationale: μετά + accusative ఇక్కడ కాలక్రమాన్ని సూచిస్తుంది. τοῦτον సమీపంలో ప్రస్తావించిన వ్యక్తిని సూచిస్తున్నందున ‘అతని తరువాత’ సహజంగా, మూలానికి దగ్గరగా ఉంది.
- source_word: ἀνέστη
  choice: లేచి
  rationale: ఇక్కడ ἀνίστημι పునరుత్థానాన్ని కాదు, ఒక నాయకుడు ముందుకు రావడం లేదా కార్యరంగంలోకి రావడాన్ని సూచిస్తుంది. ‘లేచి’ ఆ రూపకాన్ని నిలుపుతుంది.
- source_word: Ἰούδας ὁ Γαλιλαῖος
  choice: గలిలయుడైన యూదా
  rationale: గ్రీకు విశేషణాత్మక గుర్తింపును సహజమైన తెలుగు రూపంలో తెలియజేస్తుంది.
- source_word: ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς
  choice: జనగణన జరిగిన రోజుల్లో
  rationale: ἀπογραφή అధికారిక నమోదు లేదా జనగణనను సూచిస్తుంది. సందర్భంలో ‘జనగణన’ సంక్షిప్తంగా, స్పష్టంగా ఉంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἀπέστησε λαὸν ὀπίσω αὐτοῦ
  choice: కొంతమందిని తన వెంట తిప్పుకున్నాడు
  rationale: ἀφίστημι causative రూపం వారిని పూర్వ విధేయత నుంచి దూరం చేసి తనను అనుసరించేలా చేయడాన్ని సూచించగలదు. అనిర్దిష్టమైన λαόνను మొత్తం ప్రజలుగా కాకుండా ‘కొంతమందిని’ అని సామూహిక భావంతో సహజంగా అనువదించాం.
- source_word: κἀκεῖνος ἀπώλετο
  choice: అతడు కూడా నశించాడు
  rationale: κἀκεῖνοςలోని కొనసాగింపు, బలాన్ని ‘కూడా’ నిలుపుతుంది. ἀπώλετο మరణం లేదా వినాశాన్ని సూచించినా మరణ విధానాన్ని తెలపదు; అందువల్ల ‘నశించాడు’ అనవసరమైన వివరాన్ని చేర్చదు.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: అతని మాటకు ఒప్పుకున్న వారందరూ
  rationale: πείθομαι + dative ఇక్కడ అతని ప్రభావానికి లోనై అతని మాటకు ఒప్పుకున్నవారిని సూచిస్తుంది. ఇది ముందున్న ‘వెంట తిప్పుకున్నాడు’ అనే క్రియను యథాతథంగా పునరావృతం చేయదు.
- source_word: διεσκορπίσθησαν
  choice: చెదరిపోయారు
  rationale: గ్రీకు aorist passive భావాన్ని సహజమైన తెలుగు అకర్మక రూపం స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: యూదా ఉద్యమానికి రాజకీయ స్వరూపం
  choice: అతడు ప్రజలను తన వెంట తిప్పుకున్నాడని మాత్రమే అనువదించడం
  alternative: ‘తిరుగుబాటు చేయించాడు’ లేదా ‘తిరుగుబాటుకు నడిపించాడు’ అని స్పష్టీకరించడం
  rationale: చారిత్రకంగా ఈ ఉద్యమం తిరుగుబాటుతో సంబంధమున్నప్పటికీ, ఈ వాక్యంలోని గ్రీకు నేరుగా ‘తిరుగుబాటు’ అనే పదాన్ని ఉపయోగించదు. కాబట్టి మూలం చెప్పిన దానికంటే ఎక్కువ రాజకీయ నిర్దిష్టతను చేర్చలేదు.
- issue: ἀπώλετοలో మరణ విధానం
  choice: ‘నశించాడు’ అని విస్తృత భావాన్ని నిలుపడం
  alternative: ‘చంపబడ్డాడు’ అని అనువదించడం
  rationale: మూల క్రియ అతడు అంతమయ్యాడని తెలుపుతుంది గాని ఎలా మరణించాడో నిర్దిష్టంగా చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘జనగణన,’ ‘తన వెంట తిప్పుకున్నాడు,’ ‘చెదరిపోయారు’ వంటి ప్రస్తుత వాడుకలోని సహజ పదబంధాలను ఎంచుకున్నాం; మూలంలో లేని తిరుగుబాటు లేదా హత్య వివరాలను చేర్చలేదు.
