source:
  edition: SBLGNT
  text: τότε ἀπελθὼν ὁ στρατηγὸς σὺν τοῖς ὑπηρέταις ⸀ἤγαγεν αὐτούς, οὐ μετὰ βίας, ἐφοβοῦντο γὰρ τὸν λαόν, ⸀μὴ λιθασθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/026.yaml
  text: Then the captain went with the officers and brought them[a], not with force, for they were afraid of the people, lest they be stoned.
translation:
  language: te
  text: అప్పుడు ఆలయ కాపలాదళ అధిపతి[a] అధికారులతో కలిసి వెళ్లి, వారిని బలవంతం చేయకుండా తీసుకొచ్చాడు. ఎందుకంటే ప్రజలు తమను రాళ్లతో కొడతారేమోనని వారు భయపడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆలయ అధికారి.” గ్రీకు పదం στρατηγός ఇక్కడ ఆలయంలో క్రమాన్ని పర్యవేక్షించే కాపలాదళ అధిపతిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατηγὸς
  choice: ఆలయ రక్షకదళ అధిపతి
  rationale: అపొస్తలుల కార్యముల సందర్భంలో ఈ పదం రోమా సైన్యాధికారిని కాకుండా ఆలయంలో క్రమశిక్షణను పర్యవేక్షించే అధికారిని సూచిస్తుంది. ఈ అనువాదం అతని అధికార స్థానాన్నీ ఆలయ సందర్భాన్నీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὑπηρέταις
  choice: అధికారులు
  rationale: ఇక్కడ ఈ పదం ఆలయ రక్షకదళ అధిపతితో వెళ్లిన అధీన సిబ్బందిని సూచిస్తుంది. ‘అధికారులు’ అనేది వారి అధికారిక విధిని తెలియజేస్తూ, ‘సేవకులు’ అనే అతి సాధారణ అర్థాన్ని నివారిస్తుంది.
- source_word: ἤγαγεν αὐτούς
  choice: వారిని ... తీసుకొచ్చాడు
  rationale: ἄγω అనే క్రియకు ‘నడిపించు/తీసుకురా’ అనే అర్థం ఉంది. సందర్భంలో అపొస్తలులను మహాసభ ఎదుటికి తీసుకురావడాన్ని ఇది సహజంగా వ్యక్తం చేస్తుంది; గ్రీకు పాఠ్యంలో లేని ‘లోపలికి’ అనే భావాన్ని జోడించదు.
- source_word: οὐ μετὰ βίας
  choice: బలవంతం చేయకుండా
  rationale: వారిని తీసుకువచ్చిన విధానంలో బలప్రయోగం లేదా హింస లేదని ఈ రూపం సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐφοβοῦντο
  choice: వారు భయపడ్డారు
  rationale: అసంపూర్ణ భూతకాల క్రియ సందర్భంలో కొనసాగుతున్న భయాన్ని సూచిస్తుంది; ఈ తెలుగు రూపం దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸν λαόν
  choice: ప్రజలు
  rationale: ఇక్కడ ఆలయం వద్ద ఉన్న యూదా ప్రజానీకాన్ని సూచిస్తుంది. ‘ప్రజలు’ అనేది సరళమైన, సందర్భోచితమైన పదం.
- source_word: μὴ λιθασθῶσιν
  choice: తమను రాళ్లతో కొడతారేమోనని
  rationale: భయానికి కారణమైన సంభావ్య ఫలితాన్ని μήతో కూడిన కర్మణి ప్రయోగం తెలియజేస్తుంది. తెలుగులో సహజత్వం కోసం కర్తగా ప్రజలను వ్యక్తం చేసినా, ప్రమాదం రాళ్లతో కొట్టబడటమే అని యథాతథంగా ఉంచబడింది.
- source_word: τότε ἀπελθὼν
  choice: అప్పుడు ... వెళ్లి
  rationale: కృదంతంతో తెలిపిన కథన క్రమాన్ని ఆధునిక తెలుగులో సహజంగా ‘వెళ్లి ... తీసుకొచ్చాడు’ అని అందిస్తుంది.
