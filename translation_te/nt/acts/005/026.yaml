  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. గ్రీకు వాక్యంలోని కారణ సంబంధం, బలప్రయోగం లేకపోవడం, రాళ్లతో కొట్టబడతామనే భయం స్పష్టంగా నిలుపబడ్డాయి.
