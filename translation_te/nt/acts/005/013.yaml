- from: మిగిలినవారిలో ఎవరూ వారితో చేరడానికి సాహసించలేదు; అయినా ప్రజలు వారిని ఎంతో గౌరవించారు.
  to: మిగిలినవారిలో ఎవరూ వారితో చేరడానికి సాహసించలేదు; కాని ప్రజలు వారిని ఎంతో గౌరవించారు.
