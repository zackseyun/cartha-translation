id: ACT.5.13
reference: Acts 5:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῶν δὲ λοιπῶν οὐδεὶς ἐτόλμα κολλᾶσθαι αὐτοῖς, ἀλλ’ ἐμεγάλυνεν αὐτοὺς ὁ λαός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/013.yaml
  text: But none of the rest dared to join them; rather, the people held them in high esteem.
translation:
  language: te
  text: మిగిలినవారిలో ఎవరూ వారితో చేరడానికి సాహసించలేదు; కాని ప్రజలు వారిని ఎంతో గౌరవించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν λοιπῶν
  choice: మిగిలినవారిలో
  rationale: సందర్భంలో అపొస్తలుల సమూహానికి వెలుపల ఉన్న ఇతరులను సూచించే గ్రీకు జనిటివ్ బహువచనాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; వారు ఎవరో మూలపాఠం స్పష్టంగా నిర్ధారించనందున మరింత ప్రత్యేకీకరించలేదు.
- source_word: ἐτόλμα
  choice: సాహసించలేదు
  rationale: భయం లేదా సంకోచం వల్ల ఒక పని చేయడానికి ధైర్యం చేయకపోవడం అనే భావాన్ని నిలుపుతుంది.
- source_word: κολλᾶσθαι αὐτοῖς
  choice: వారితో చేరడానికి
  rationale: κολλάομαι యొక్క ‘తమను వారితో అనుబంధించుకోవడం/చేరడం’ అనే భావాన్ని సందర్భానుకూలంగా, సహజంగా అందిస్తుంది.
- source_word: ἀλλ’
  choice: అయినా
  rationale: మొదటి వాక్యభాగంలోని చేరడానికి సాహసించకపోవడానికీ, ప్రజలు వారిని గౌరవించడానికీ మధ్య ఉన్న వ్యత్యాసాన్ని తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: ἐμεγάλυνεν αὐτοὺς ὁ λαός
  choice: ప్రజలు వారిని ఎంతో గౌరవించారు
  rationale: అక్షరార్థమైన ‘గొప్పచేశారు’ కంటే, ఇక్కడ వ్యక్తుల పట్ల ఉన్న ఉన్నత గౌరవాన్ని తెలిపే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
theological_decisions:
- issue: ‘మిగిలినవారు’ మరియు ‘ప్రజలు’ మధ్య సంబంధం
  choice: రెండు వర్గాల గుర్తింపును మూలపాఠంలో ఉన్నట్లే నిర్దిష్టంగా నిర్వచించకుండా ఉంచడం
  alternative: ‘ఇతర విశ్వాసులు’ లేదా ‘అవిశ్వాసులు’ అని స్పష్టీకరించడం
  rationale: గ్రీకు వాక్యం οἱ λοιποί ఎవరనే విషయాన్ని సిద్ధాంతపరంగా తేల్చదు; అందువల్ల అనువాదం ఆ అస్పష్టతను కాపాడుతుంది.
- issue: κολλᾶσθαι యొక్క సంఘసభ్యత్వ భావం
  choice: ‘వారితో చేరడానికి’
  alternative: ‘సంఘంలో సభ్యులవడానికి’
  rationale: మూలపాఠం సన్నిహిత అనుబంధం లేదా చేరికను సూచిస్తుంది గాని, అధికారిక సంఘసభ్యత్వ ప్రక్రియను పేర్కొనదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. మూలంలోని వ్యత్యాసాన్ని సెమికోలన్ మరియు ‘అయినా’తో నిలిపి, అనవసర సిద్ధాంత వివరణను జోడించలేదు.
