id: ACT.5.3
reference: Acts 5:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸀ὁ Πέτρος· Ἁνανία, διὰ τί ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου, ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον καὶ ⸀νοσφίσασθαι ἀπὸ τῆς τιμῆς τοῦ χωρίου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/003.yaml
  text: But Peter said[a], “Ananias[d][c][b], why has Satan filled your heart to lie to the Holy Spirit and to keep back some of the price of the land?”
translation:
  language: te
  text: 'అయితే పేతురు ఇలా అన్నాడు: “అననీయా, పరిశుద్ధాత్మకు అబద్ధం చెప్పడానికి[a], ఆ భూమి[c] అమ్మకపు ధరలో కొంత తనకోసం ఉంచుకోవడానికి[b] సాతాను నీ హృదయాన్ని ఎందుకు నింపాడు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిశుద్ధాత్మను మోసగించడానికి.” అయితే గ్రీకు క్రియ ఇక్కడ నేరుగా “పరిశుద్ధాత్మకు అబద్ధం చెప్పడం” అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అమ్మకం ద్వారా వచ్చిన సొమ్ములో కొంత తనకోసం ఉంచుకోవడానికి.”
    reason: lexical_alternative
  - marker: c
    text: “భూమి” అనే పదాన్ని “పొలం” లేదా “ఆస్తి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ ὁ Πέτρος
  choice: అయితే పేతురు ఇలా అన్నాడు
  rationale: δέ స్వల్ప అనుసంధానాన్ని లేదా సందర్భానుసారమైన వ్యత్యాసాన్ని సూచిస్తుంది. ఇక్కడ అననీయా చేసిన రహస్య కార్యాన్ని పేతురు ఎదుర్కొంటున్నందున ‘అయితే’ సహజంగా సరిపోతుంది.
- source_word: διὰ τί
  choice: ఎందుకు
  rationale: కారణాన్ని ప్రశ్నించే గ్రీకు పదబంధానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου
  choice: సాతాను నీ హృదయాన్ని ఎందుకు నింపాడు
  rationale: ‘హృదయాన్ని నింపాడు’ అనే మూల రూపకాన్ని నిలుపుతుంది; దీనిని దయ్యపు స్వాధీనం లేదా బలవంతపు నియంత్రణగా అతివ్యాఖ్యానించదు.
- source_word: ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον
  choice: పరిశుద్ధాత్మతో అబద్ధం చెప్పడానికి
  rationale: వ్యక్తిని సూచించే కర్మతో వచ్చిన ψεύδομαι ఇక్కడ ‘ఎవరితోనైనా అబద్ధం చెప్పడం’ అనే భావం ఇస్తుంది. తెలుగు ప్రయోగంలో ‘తో అబద్ధం చెప్పడం’ సహజంగా, నేరుగా ఉంటుంది.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: పరిశుద్ధాత్మ
  rationale: ఆధునిక ప్రామాణిక తెలుగులో స్థిరపడిన, గౌరవప్రదమైన రూపం.
- source_word: νοσφίσασθαι
  choice: కొంత దాచిపెట్టుకోవడానికి
  rationale: తనకోసం ఒక భాగాన్ని రహస్యంగా ఉంచుకోవడం అనే క్రియ భావాన్ని తెలియజేస్తుంది. ‘కొంత’ అనేది ἀπό తో వచ్చిన సంపూర్ణంలోనుంచి భాగం అనే సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: ἀπὸ τῆς τιμῆς
  choice: వెలలో కొంత
  rationale: τιμή ఇక్కడ అమ్మకపు ధరను సూచిస్తుంది; ‘వెల’ సంక్షిప్తమైన, సహజమైన తెలుగు పదం. ἀπό సంపూర్ణ మొత్తంలోనుంచి కొంత భాగాన్ని సూచిస్తుంది.
- source_word: τοῦ χωρίου
  choice: ఆ భూమి
  rationale: χωρίον భూమి, పొలం లేదా ఆస్తిని సూచించగలదు. ఈ అమ్మకపు సందర్భంలో ‘భూమి’ విస్తృతతను నిలుపుతూ సహజంగా ఉంటుంది; నిర్దిష్టతను ‘ఆ’ తెలియజేస్తుంది.
theological_decisions:
- issue: అననీయా హృదయాన్ని సాతాను నింపడంలో కార్యసాధకత్వం
  choice: ‘సాతాను నీ హృదయాన్ని ... నింపాడు’ అనే మూల వ్యక్తీకరణను యథాతథంగా నిలుపడం
  alternative: ‘సాతాను నిన్ను తన ఆధీనంలోకి తీసుకున్నాడు’ లేదా ‘సాతాను నీ హృదయాన్ని నింపనిచ్చావు’
  rationale: గ్రీకు వాక్యంలో ‘నింపాడు’ అనే క్రియకు సాతానే కర్త. అయినా అది అననీయా నైతిక బాధ్యతను తొలగించదు. స్వాధీనం లేదా అనుమతి అనే అదనపు భావాన్ని చేర్చకుండా ఈ ఉద్రిక్తతను అనువాదం నిలుపుతుంది.
- issue: పరిశుద్ధాత్మతో అబద్ధం చెప్పడం
  choice: వ్యక్తిగత సంబోధన భావంతో ‘పరిశుద్ధాత్మతో అబద్ధం చెప్పడానికి’ అని నేరుగా అనువదించడం
  alternative: ‘పరిశుద్ధాత్మను మోసగించడానికి’ లేదా ‘పరిశుద్ధాత్మ సమక్షంలో అబద్ధం చెప్పడానికి’
  rationale: మూలంలోని నేరమైన, వ్యక్తిగత సూచనను ఇది కాపాడుతుంది; పరిశుద్ధాత్మ గురించిన సిద్ధాంత వివరణను వాక్యంలో అదనంగా చేర్చదు.
- issue: రెండు infinitive రూపాల ఉద్దేశం లేదా ఫలిత సంబంధం
  choice: తెలుగులో రెండింటికీ ‘-డానికి’ సమాంతర నిర్మాణం ఉపయోగించడం
  alternative: ‘అబద్ధం చెప్పేలా, ... దాచిపెట్టుకునేలా’
  rationale: గ్రీకులోని infinitive నిర్మాణం ఉద్దేశం లేదా ఫలిత ఛాయను కలిగి ఉండవచ్చు. సమాంతరమైన ‘-డానికి’ రూపం సంబంధాన్ని సహజంగా ఉంచుతూ దానిని మరీ ఖచ్చితంగా ఒకే విధంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, కానీ వాక్య గాంభీర్యాన్ని నిలుపుతూ అనువదించబడింది. ‘హృదయాన్ని నింపాడు’ అనే బైబిలీయ రూపకం ఉద్దేశపూర్వకంగా నిలుపబడింది; ‘వెల’ మరియు ‘దాచిపెట్టుకోవడం’ వంటి సహజ పదాలు అమ్మకపు సందర్భాన్ని స్పష్టంగా తెలియజేస్తాయి.
