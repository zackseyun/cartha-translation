  to: 'అయితే పేతురు ఇలా అన్నాడు: “అననీయా, పరిశుద్ధాత్మకు అబద్ధం చెప్పడానికి[a], ఆ భూమి[c] అమ్మకపు ధరలో కొంత తనకోసం ఉంచుకోవడానికి[b] సాతాను నీ హృదయాన్ని ఎందుకు నింపాడు?”'
  rationale: వ్యక్తి కర్మతో ఉన్న గ్రీకు ψεύδομαιను తెలుగులో ‘పరిశుద్ధాత్మకు అబద్ధం చెప్పడానికి’గా సరిచేశాము. τιμήకి సందర్భానుగుణమైన ‘అమ్మకపు ధర’ను వాడి, ἀπό సూచించే భాగార్థాన్ని ‘కొంత’తో, νοσφίζομαι సూచించే తనకోసం ఉంచుకోవడాన్ని ‘తనకోసం ఉంచుకోవడానికి’తో నిలిపాము. రెండు infinitive-ల సమాంతరత్వం మరియు వాటి ఉద్దేశం/ఫలితానికి ఉన్న స్వల్ప అస్పష్టతను ‘-డానికి’ నిర్మాణంతో కాపాడాము.
