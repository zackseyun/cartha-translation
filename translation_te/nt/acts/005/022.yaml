  text: But when the officers arrived, they did not find them in the prison; so they returned and reported,
translation:
  language: te
  text: 'కానీ చెరసాలకు చేరుకున్న అధికారులు వారిని చెరసాలలో కనుగొనలేదు; వారు తిరిగి వెళ్లి నివేదించారు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: అక్కడికి చేరుకున్నప్పుడు
  rationale: కాలసూచక కృదంతాన్ని సహజమైన తెలుగు ఉపవాక్యంగా ఇచ్చింది; సందర్భం వల్ల గమ్యస్థానం చెరసాల అని స్పష్టంగా ఉంది.
- source_word: ὑπηρέται
  choice: అధికారులు
  rationale: ఇక్కడ గృహ సేవకులు కాక, యూదు నాయకుల ఆధీనంలో పనిచేసే అధికారిక పరిచారకులు ఉద్దేశించబడ్డారు. ‘దేవాలయ కాపలాదారులు’ అనడం మూలపాఠం కంటే ఎక్కువ నిర్దిష్టతను చేర్చుతుంది.
- source_word: οὐχ εὗρον αὐτοὺς
  choice: వారు ... కనబడలేదు
  rationale: తెలుగులో అన్వేషించినవారి దృష్టికోణాన్ని సహజంగా వ్యక్తం చేస్తూ, వారిని అక్కడ కనుగొనలేదనే భావాన్ని నిలుపుతుంది.
- source_word: ἐν τῇ φυλακῇ
  choice: చెరసాలలో
  rationale: ముందే ప్రస్తావించబడిన నిర్దిష్ట నిర్బంధ స్థలాన్ని సూచిస్తుంది; ‘చెరసాల’ గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు పదం.
- source_word: ἀναστρέψαντες
  choice: తిరిగి వెళ్లి
  rationale: తమను పంపినవారి దగ్గరకు వెనుదిరిగిన కార్యాన్ని సందర్భానుగుణంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἀπήγγειλαν
  choice: నివేదించారు
  rationale: అధికారికంగా సమాచారాన్ని తిరిగి తెలియజేయడాన్ని సూచించే కథనానుకూల పదం.
- source_word: δέ
  choice: అయితే / కాబట్టి
  rationale: మొదటి δέ ఊహించిన ఫలితానికి విరుద్ధతను చూపుతుంది; రెండవది కార్యాల వరుసను తెలుగులో సహజంగా కలుపుతుంది.
