  edition: SBLGNT
  text: Οἱ δὲ ⸀ἀκούσαντες διεπρίοντο καὶ ἐβούλοντο ἀνελεῖν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/033.yaml
  text: But when they heard this, they were enraged and wanted to kill them.
translation:
  language: te
  text: అయితే వారు ఇది విని తీవ్ర ఆగ్రహంతో రగిలిపోయి[a], వారిని చంపాలని అనుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా ‘వారు కోయబడుతున్నట్లు’ లేదా ‘రంపంతో చీల్చబడుతున్నట్లు’ అనే భావం ఉంది; ఇది తీవ్రమైన శత్రుభావ ఉద్రేకాన్ని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ
  choice: అయితే వారు
  rationale: δέ ఇక్కడ అపొస్తలుల మాటల నుంచి సభవారి ప్రతిస్పందనకు మలుపును సూచిస్తుంది; substantival article ముందుగా ప్రస్తావించిన వారిని సూచిస్తుంది.
- source_word: ἀκούσαντες
  choice: ఇది విని
  rationale: Aorist participleను సహజమైన కాలసంబంధ క్రియారూపంగా అనువదించాం; వినబడిన విషయం సందర్భం నుంచి స్పష్టంగా ఉన్నందున ‘ఇది’ చేర్చాం.
- source_word: διεπρίοντο
  choice: తీవ్ర ఆగ్రహంతో రగిలిపోయి
  rationale: ఈ క్రియ అక్షరార్థంగా కోయబడటం లేదా రంపంతో చీల్చబడటం అనే బలమైన చిత్రాన్ని కలిగించినా, ఇక్కడ తీవ్రమైన శత్రుభావ ఆగ్రహాన్ని తెలియజేస్తుంది. తెలుగు పాఠకులకు అపార్థం రాకుండా భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా ఇచ్చి, మూలరూపకాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐβούλοντο
  choice: అనుకున్నారు
  rationale: Imperfect రూపం కొనసాగుతున్న కోరిక లేదా ఉద్దేశాన్ని సూచిస్తుంది; ‘చంపాలని అనుకున్నారు’ సహజమైన తెలుగులో ఆ సంకల్పాన్ని తెలియజేస్తుంది.
- source_word: ἀνελεῖν
  choice: చంపాలని
  rationale: ఈ సందర్భంలో ἀναιρέω ప్రాణం తీయడాన్ని నేరుగా సూచిస్తుంది; ‘చంపడం’ స్పష్టమైన, సహజమైన పదం.
- source_word: αὐτούς
  choice: వారిని
  rationale: ఈ సర్వనామం విచారణలో ఉన్న అపొస్తలులను సూచిస్తుంది.
