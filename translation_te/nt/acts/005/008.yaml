source:
  edition: SBLGNT
  text: ἀπεκρίθη δὲ ⸂πρὸς αὐτὴν⸃ ⸀Πέτρος· Εἰπέ μοι, εἰ τοσούτου τὸ χωρίον ἀπέδοσθε; ἡ δὲ εἶπεν· Ναί, τοσούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/008.yaml
  text: But Peter answered her[a], “Tell me, did you sell the land for this much?” And she said, “Yes, for this much.”
translation:
  language: te
  text: 'అయితే పేతురు ఆమెతో ఇలా జవాబిచ్చాడు: “నాకు చెప్పు, మీరు ఆ పొలాన్ని[a] ఇంత మొత్తానికి అమ్మారా?” ఆమె, “అవును, ఇంత మొత్తానికి” అంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పొలం” అనే మాటను “భూమి ముక్క,” “స్థలం,” లేదా “ఆస్తి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη δὲ πρὸς αὐτὴν Πέτρος
  choice: అప్పుడు పేతురు ఆమెతో ... అని అడిగాడు
  rationale: ἀπεκρίθη సాధారణంగా ‘జవాబిచ్చాడు’ అయినప్పటికీ, ఇక్కడ పేతురు ప్రశ్నతో మాట్లాడుతున్నందున ఆధునిక తెలుగులో ‘అడిగాడు’ సహజంగా ఉంది. δέ కథనంలోని తదుపరి మలుపును ‘అప్పుడు’గా తెలియజేస్తుంది; πρὸς αὐτήν ‘ఆమెతో’గా నిలుపబడింది.
- source_word: Εἰπέ μοι
  choice: నాకు చెప్పు
  rationale: λέγω యొక్క ఆజ్ఞార్థక రూపం మరియు μοι దత్తివును నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: εἰ
  choice: '... అమ్మారా?'
  rationale: εἰ పరోక్ష అవును/కాదు ప్రశ్నను ప్రవేశపెడుతుంది; తెలుగులో ప్రత్యక్ష ప్రశ్నారూపం సహజంగా ఉంటుంది.
- source_word: τοσούτου
  choice: ఇంతకే
  rationale: ఇప్పటికే సూచించబడిన ధర మొత్తాన్ని తెలియజేసే τοσούτου యొక్క సూచనాత్మక భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది; ప్రశ్నలోను జవాబులోను పునరావృతిని నిలుపుతుంది.
- source_word: τὸ χωρίον
  choice: ఆ పొలం
  rationale: χωρίον అనేది భూమి ముక్క, పొలం, లేదా స్థలం అనే అర్థాలు కలిగి ఉంటుంది. ఈ సందర్భంలో అమ్మబడిన స్థిరాస్తిని సూచించడానికి ‘పొలం’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది; విస్తృత ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: ἀπέδοσθε
  choice: మీరు ... అమ్మారా
  rationale: వాణిజ్య సందర్భంలో ἀποδίδωμι ‘అమ్ము’ అనే అర్థం ఇస్తుంది. బహువచన క్రియారూపం అననీయా మరియు సప్పీరా కలిసి చేసిన అమ్మకాన్ని సూచిస్తున్నందున గౌరవ ఏకవచనంగా కాక సందర్భానుగుణ బహువచనంగా ‘మీరు’ నిలుపబడింది.
- source_word: Ναί
  choice: అవును
  rationale: సాధారణ ధృవీకరణ జవాబును సహజంగా వ్యక్తపరుస్తుంది.
