translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని సంక్షిప్త ప్రశ్న-జవాబు నిర్మాణం మరియు ‘ఇంతకే’ అనే పదపునరావృతి నిలుపబడ్డాయి. పాదసూచిక గుర్తు సంబంధిత ‘పొలం’ పదం వెంట ఉండేలా ప్రధాన పాఠ్యంలో అమర్చాలి.
