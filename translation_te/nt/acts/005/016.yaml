id: ACT.5.16
reference: Acts 5:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: συνήρχετο δὲ καὶ τὸ πλῆθος τῶν πέριξ ⸀πόλεων Ἰερουσαλήμ, φέροντες ἀσθενεῖς καὶ ὀχλουμένους ὑπὸ πνευμάτων ἀκαθάρτων, οἵτινες ἐθεραπεύοντο ἅπαντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/016.yaml
  text: And even the multitude from the towns around Jerusalem was coming together[a], bringing the sick and those troubled by unclean spirits[b], and they were all being healed.
translation:
  language: te
  text: యెరూషలేము చుట్టుపక్కల పట్టణాల నుండి పెద్ద సంఖ్యలో ప్రజలు కూడా సమకూడుతూ[a], రోగులను, అపవిత్రాత్మల చేత బాధించబడుతున్నవారిని[b] తీసుకొచ్చేవారు. వారందరూ స్వస్థపరచబడుతూ ఉండేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సమావేశమవుతూ.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అపవిత్రాత్మల చేత పీడించబడుతున్నవారిని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήρχετο
  choice: సమకూడుతూ
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే గతంలోని కొనసాగుతున్న లేదా పదేపదే జరిగిన సమకూడటాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὸ πλῆθος
  choice: పెద్ద సంఖ్యలో ప్రజలు
  rationale: సమూహవాచకమైన ‘అనేక జనులు’ అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా అందిస్తుంది.
- source_word: τῶν πέριξ πόλεων Ἰερουσαλήμ
  choice: యెరూషలేము చుట్టుపక్కల పట్టణాల నుంచి
  rationale: πέριξ యొక్క భౌగోళిక భావాన్ని, ఈ ప్రజలు ఆ పట్టణాల నుంచి వచ్చారనే సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: φέροντες
  choice: తీసుకొచ్చేవారు
  rationale: ప్రజలు సమకూడే సమయంలో బాధితులను తమతో తీసుకొచ్చిన పదేపదే జరిగిన చర్యను సందర్భానుగుణంగా తెలుపుతుంది.
- source_word: ἀσθενεῖς
  choice: రోగులను
  rationale: స్వస్థపరిచే సందర్భంలో శారీరకంగా అనారోగ్యంతో ఉన్నవారనే సాధారణ అర్థాన్ని ఇస్తుంది.
- source_word: ὀχλουμένους
  choice: బాధించబడుతున్నవారిని
  rationale: బయటి కర్త చేత కలిగే నిరంతర పీడనను తెలిపే కర్మణి భావాన్ని నిలుపుతుంది; తీవ్రతను ‘హింసించబడుతున్న’ అని అనవసరంగా పెంచదు.
- source_word: ὑπὸ πνευμάτων ἀκαθάρτων
  choice: అపవిత్రాత్మల చేత
  rationale: వ్యక్తిగత దుష్టాత్మలను సూచించే నూతన నిబంధనలోని స్థిరమైన బైబిలు భావవ్యక్తీకరణను నిలుపుతుంది.
- source_word: οἵτινες
  choice: వారందరూ
  rationale: ముందు పేర్కొన్న రోగులు మరియు బాధించబడుతున్నవారు అనే రెండు వర్గాలనూ సహజంగా తిరిగి సూచిస్తుంది.
- source_word: ἐθεραπεύοντο
  choice: స్వస్థపరచబడుతూ ఉండేవారు
  rationale: కర్మణి ప్రయోగాన్నీ, గతంలో కొనసాగిన లేదా పదేపదే జరిగిన స్వస్థపరచే కార్యాన్నీ నిలుపుతుంది.
- source_word: ἅπαντες
  choice: అందరూ
  rationale: తీసుకొచ్చిన బాధితులందరికీ స్వస్థత కలిగిందనే సమగ్రతను స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: πνευμάτων ἀκαθάρτων అనువాదం
  choice: అపవిత్రాత్మలు
  alternative: అశుద్ధాత్మలు
  rationale: లూకా–అపొస్తలుల కార్యములలో వ్యక్తిగత దుష్టాత్మలను సూచించే సంప్రదాయ బైబిలు పదబంధాన్ని నిలుపుతుంది; దీనిని కేవలం మానసిక లేదా రూపకాలంకార స్థితిగా మార్చదు.
- issue: ἅπαντες యొక్క పరిధి
  choice: వారందరూ స్వస్థపరచబడుతూ ఉండేవారు
  alternative: వారిలో ప్రతి ఒక్కరూ స్వస్థపరచబడ్డారు
  rationale: ఈ సందర్భంలో తీసుకొచ్చిన రెండు వర్గాల వారందరికీ వర్తించే సంపూర్ణతను నిలుపుతూ, అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న కార్యభావాన్నీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే బైబిలు వర్ణనకు తగిన గౌరవప్రద శైలిలో ఉంది. గ్రీకు అసంపూర్ణ భూతకాల క్రియల కొనసాగింపు/పునరావృత భావాన్ని ‘సమకూడుతూ’, ‘తీసుకొచ్చేవారు’, ‘స్వస్థపరచబడుతూ ఉండేవారు’ ద్వారా నిలిపింది.
