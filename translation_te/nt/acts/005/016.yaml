revisions:
- from: యెరూషలేము చుట్టుపక్కల పట్టణాల నుంచి కూడా పెద్ద సంఖ్యలో ప్రజలు సమకూడుతూ[a], రోగులను, అపవిత్రాత్మల చేత బాధించబడుతున్నవారిని[b] తీసుకొచ్చేవారు. వారందరూ స్వస్థపరచబడుతూ ఉండేవారు.
