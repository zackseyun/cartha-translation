id: ACT.5.34
reference: Acts 5:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀναστὰς δέ τις ἐν τῷ συνεδρίῳ Φαρισαῖος ὀνόματι Γαμαλιήλ, νομοδιδάσκαλος τίμιος παντὶ τῷ λαῷ, ἐκέλευσεν ἔξω ⸀βραχὺ τοὺς ⸀ἀνθρώπους ποιῆσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/034.yaml
  text: But a Pharisee named Gamaliel stood up in the council[a], a teacher of the law honored by all the people[b], and ordered the men to be put outside for a short time.
translation:
  language: te
  text: అయితే సభలో[a] గమలీయేలు అనే ఒక పరిసయ్యుడు లేచి నిలబడ్డాడు. అతడు ధర్మశాస్త్ర బోధకుడు, ప్రజలందరి గౌరవం పొందినవాడు. ఆ మనుషులను కొద్దిసేపు బయటకు పంపమని అతడు ఆదేశించాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సభ’ అంటే యూదుల పాలక మండలైన సన్హెద్రిన్.
    reason: cultural_note
  - marker: b
    text: గ్రీకులో అక్షరార్థం, ‘వారిని కొద్దిసేపు బయట ఉండేలా చేయమని.’ దీని అర్థం, వారిని తాత్కాలికంగా బయటకు పంపమని.
    reason: lexical_idiom
lexical_decisions:
- source_word: ἀναστὰς
  choice: లేచి నిలబడ్డాడు
  rationale: సభలో బహిరంగంగా మాట్లాడేందుకు లేచి నిలబడిన చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: δέ
  choice: అయితే
  rationale: మునుపటి పరిణామం నుంచి గమలీయేలు జోక్యానికి వచ్చే స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: τις ... Φαρισαῖος
  choice: ఒక పరిసయ్యుడు
  rationale: τις ద్వారా కొత్త వ్యక్తిని అనిర్దిష్టంగా పరిచయం చేయడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐν τῷ συνεδρίῳ
  choice: సభలో
  rationale: ఇక్కడ συνέδριον యూదుల పాలక మండలిని సూచిస్తుంది; ప్రధాన వాక్యంలో సరళమైన ‘సభ’ను ఉంచి సాంస్కృతిక వివరాన్ని పాదటీపులో ఇస్తుంది.
- source_word: ὀνόματι Γαμαλιήλ
  choice: గమలీయేలు అనే
  rationale: పేరు పరిచయం చేసే దత్తి నిర్మాణానికి సహజమైన తెలుగు రూపం.
- source_word: νομοδιδάσκαλος
  choice: ధర్మశాస్త్ర బోధకుడు
  rationale: యూదుల ధర్మశాస్త్రాన్ని బోధించే వ్యక్తి అనే సమాసపద అర్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τίμιος παντὶ τῷ λαῷ
  choice: ప్రజలందరి గౌరవం పొందినవాడు
  rationale: ప్రజల మధ్య అతనికి ఉన్న సామాజిక గౌరవాన్ని సహజంగా తెలుపుతుంది; ‘ఇశ్రాయేలు ప్రజలు’ అని మూలానికి మించి నిర్దిష్టం చేయదు.
- source_word: ἐκέλευσεν
  choice: ఆదేశించాడు
  rationale: న్యాయసభ సందర్భంలో అధికారపూర్వక సూచన అనే బలాన్ని నిలుపుతుంది.
- source_word: ἔξω ... ποιῆσαι
  choice: బయటకు పంపించాలని
  rationale: అక్షరార్థంగా ‘బయట ఉండేలా చేయడం’ అనే గ్రీకు నుడికారాన్ని సహజమైన తెలుగు కార్యార్థంతో అందిస్తుంది.
- source_word: βραχύ
  choice: కొద్దిసేపు
  rationale: చర్య తాత్కాలికమని తెలిపే కాలవ్యాప్తి భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: τοὺς ἀνθρώπους
  choice: ఆ మనుషులను
  rationale: సందర్భంలో సభ ఎదుట ఉన్న పురుష అపొస్తలులనే సూచిస్తుంది; సాధారణ మానవజాతి భావం రాకుండా నిర్దిష్ట సూచనను నిలుపుతుంది.
theological_decisions:
- issue: τοὺς ἀνθρώπους పదబంధంలోని లింగ సూచన
  choice: ఆ మనుషులను
  alternative: ఆ వ్యక్తులను
  rationale: సందర్భంలోని సూచితులు పురుషులైన అపొస్తలులు. ‘మనుషులు’ మూలంలోని లింగసూచనను నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. పొడవైన గ్రీకు వాక్యాన్ని స్పష్టత కోసం మూడు సహజ తెలుగు వాక్యాలుగా విభజించాం. పాదటీపు సూచిక [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
