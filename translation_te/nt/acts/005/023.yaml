translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కథన గాంభీర్యాన్ని నిలుపుతూ అనువదించబడింది. గ్రీకులో ἀνοίξαντες‌కు ప్రత్యక్ష కర్మ లేకపోయినా, సమీపంలోని τῶν θυρῶν ఆధారంగా తెలుగులో ‘తలుపులు’ పూరించబడింది. మూలంలోని సంపూర్ణ భద్రతా ఉద్ఘాటనను ప్రధాన వచనంలోనే ఉంచినందున పాదటిప్పణి అవసరం లేదు.
