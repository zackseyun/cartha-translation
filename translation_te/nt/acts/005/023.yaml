id: ACT.5.23
reference: Acts 5:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγοντες ὅτι ⸀Τὸ δεσμωτήριον εὕρομεν κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ καὶ τοὺς φύλακας ἑστῶτας ⸀ἐπὶ τῶν θυρῶν, ἀνοίξαντες δὲ ἔσω οὐδένα εὕρομεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/023.yaml
  text: saying[a], “We found the prison securely locked, and the guards standing at the doors; but when we opened it, we found no one inside.”
translation:
  language: te
  text: 'వారు ఇలా చెప్పారు: “చెరసాల పూర్తిగా భద్రంగా మూసివేయబడి ఉండడం, కాపలాదారులు తలుపుల వద్ద నిలబడి ఉండడం మేము కనుగొన్నాం. కానీ తలుపులు తెరిచినప్పుడు లోపల ఎవరినీ కనుగొనలేదు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσμωτήριον
  choice: చెరసాల
  rationale: బంధించబడినవారిని ఉంచే స్థలాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన పదం.
- source_word: κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ
  choice: తలుపులు పూర్తిగా భద్రంగా మూసి ఉండడం
  rationale: κεκλεισμένον సూచించే మూసివున్న స్థితినీ, ἐν πάσῃ ἀσφαλείᾳ ఇచ్చే సంపూర్ణ భద్రతా ఉద్ఘాటననూ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: φύλακας ἑστῶτας
  choice: కాపలాదారులు … నిలబడి ఉండడం
  rationale: కాపలా సందర్భాన్ని, వారు తమ స్థానాల్లో నిలిచి ఉన్న దృశ్యాన్ని అదనపు వ్యాఖ్యానం లేకుండా నిలుపుతుంది.
- source_word: ἐπὶ τῶν θυρῶν
  choice: తలుపుల దగ్గర
  rationale: తలుపులకు సమీపంలోని స్థానాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀνοίξαντες
  choice: తలుపులు తెరిచి చూసినప్పుడు
  rationale: ముందు ప్రస్తావించిన బహువచన ‘తలుపులు’ను సహజంగా పూరించి, క్రియ యొక్క కాలసంబంధ భావాన్ని తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔσω
  choice: లోపల
  rationale: చెరసాల అంతర్భాగాన్ని సూచించే సహజమైన తెలుగు క్రియావిశేషణం.
- source_word: οὐδένα
  choice: ఎవరూ
  rationale: అక్కడ ఒక్క వ్యక్తి కూడా లేడనే ప్రతికూల అనిర్దిష్ట భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: λέγοντες ὅτι
  choice: 'వారు ఇలా చెప్పారు:'
  rationale: మునుపటి వచనంతో కథన సంబంధాన్ని కొనసాగిస్తూ, నివేదికలోని ప్రత్యక్ష వాక్యాన్ని సహజమైన తెలుగులో పరిచయం చేస్తుంది.
