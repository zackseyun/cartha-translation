  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄγγελος δὲ κυρίου ⸀διὰ νυκτὸς ⸀ἤνοιξε τὰς θύρας τῆς φυλακῆς ἐξαγαγών τε αὐτοὺς εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/019.yaml
  text: But an angel of the Lord opened the doors of the prison during the night, brought them out, and said,
translation:
  language: te
  text: 'అయితే రాత్రివేళ ప్రభువు దూత చెరసాల తలుపులు తెరిచి, వారిని బయటకు తీసుకొచ్చి ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: దూత
  rationale: నిర్దేశక పదం లేని గ్రీకు నామవాచకాన్ని తెలుగులో సహజంగా ‘దూత’ అని అనువదించాం. సందర్భంలో ఇది మానవ సందేశకుడు కాక పరలోక దూతను సూచిస్తుంది; ‘ప్రభువు దూత’ అనే స్థిరమైన బైబిలు ప్రయోగం ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριοςకు సాధారణమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం ‘ప్రభువు’; ‘ప్రభువు దూత’ అనే బైబిలు ప్రయోగాన్నీ ఇది నిలుపుతుంది.
- source_word: διὰ νυκτός
  choice: రాత్రివేళ
  rationale: διά + షష్ఠీ విభక్తి ఇక్కడ కాలార్థకంగా ఉంది. ‘రాత్రివేళ’ ఆధునిక తెలుగులో సహజంగా ఉండి, సంఘటన రాత్రి సమయంలో జరిగిందని స్పష్టంగా చెబుతుంది.
- source_word: ἤνοιξε
  choice: తెరిచి
  rationale: ἀνοίγω యొక్క సాధారణ అర్థం ‘తెరవడం.’ ‘తాళం తీసి’ వంటి మూలంలో లేని వివరాన్ని చేర్చలేదు; తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా అసమాపక క్రియారూపం వాడాం.
- source_word: τὰς θύρας τῆς φυλακῆς
  choice: చెరసాల తలుపులు
  rationale: θύραιను ‘తలుపులు,’ φυλακήను ఈ సందర్భంలో ‘చెరసాల’గా అనువదించాం. ఈ సమాస రూపం సహజమైన తెలుగు; గ్రీకులోని బహువచనాన్ని నిలుపుతుంది.
- source_word: ἐξαγαγών
  choice: వారిని బయటకు తీసుకొచ్చి
  rationale: ἐξάγω లోపలి నుంచి బయటకు తీసుకురావడాన్ని సూచిస్తుంది. ‘బయటకు తీసుకొచ్చి’ causative భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τε
  choice: —
  rationale: τέ తెలిపే స్వల్ప అనుసంధానం తెలుగులో వరుస అసమాపక క్రియల నిర్మాణం ద్వారా సహజంగా వ్యక్తమైంది; ప్రత్యేకంగా ‘మరియు’ చేర్చడం కృత్రిమంగా ఉంటుంది.
- source_word: εἶπεν
  choice: ఇలా అన్నాడు
  rationale: λέγω యొక్క కథనరూపానికి ‘అన్నాడు’ సహజమైన సమానం. తరువాతి వచనంలో మాటల విషయం వస్తున్నందున ‘ఇలా’ పాఠకుడిని ఆ ప్రత్యక్ష వాక్యానికి సహజంగా నడిపిస్తుంది.
theological_decisions:
- issue: ఈ సందర్భంలో ἄγγελος స్వభావం
  choice: పరలోక దూతను సూచించే ‘దూత’
  alternative: మానవ సందేశకుడు
  rationale: చెరసాల తలుపులు తెరవడం, బంధింపబడినవారిని బయటకు తీసుకురావడం అనే సందర్భం పరలోక దూతనే బలంగా సూచిస్తుంది. అయినా తెలుగు ప్రధాన పాఠంలో అదనంగా ‘దేవదూత’ అని విస్తరించకుండా, మూలంలోని ‘ప్రభువు దూత’ నిర్మాణాన్ని నిలిపాం.
- issue: κύριος అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ‘ప్రభువు దూత’ అనే నిర్మాణంలో κύριος దేవునికి సంబంధించిన గౌరవపదం. ‘ప్రభువు’ మూలార్థాన్నీ, స్థిరమైన బైబిలు ప్రయోగాన్నీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని δέను ‘అయితే’గా చూపించి ముందు సందర్భంతో వ్యత్యాసాన్ని నిలిపాం. వాక్యం తరువాతి వచనంలోని ప్రత్యక్ష మాటకు కొనసాగుతున్నందున చివర ద్విబిందువు వాడాం.
