id: ACT.5.28
reference: Acts 5:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀λέγων· Παραγγελίᾳ παρηγγείλαμεν ὑμῖν μὴ διδάσκειν ἐπὶ τῷ ὀνόματι τούτῳ, καὶ ἰδοὺ πεπληρώκατε τὴν Ἰερουσαλὴμ τῆς διδαχῆς ὑμῶν, καὶ βούλεσθε ἐπαγαγεῖν ἐφ’ ἡμᾶς τὸ αἷμα τοῦ ἀνθρώπου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/028.yaml
  text: saying[a], “We strictly ordered you not to teach in this name, and look, you have filled Jerusalem with your teaching, and you intend to bring this man's blood upon us.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “ఈ పేరున బోధించవద్దని మేము మీకు కఠినంగా ఆజ్ఞాపించాము. చూడండి, మీరు మీ బోధతో యెరూషలేమును నింపేశారు; ఈ మనిషి రక్తాన్ని మా మీదికి తీసుకురావాలని ఉద్దేశిస్తున్నారు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత స్పష్టంగా, “ఈ మనిషి మరణానికి మమ్మల్ని బాధ్యులను చేయాలని ఉద్దేశిస్తున్నారు.” గ్రీకులో “ఈ మనిషి రక్తాన్ని మా మీదికి తీసుకురావడం” అని ఉంది; ఇది అతని మరణానికి రక్తదోషం లేదా బాధ్యత తమపై మోపడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παραγγελίᾳ παρηγγείλαμεν
  choice: మేము మీకు కఠినంగా ఆజ్ఞాపించాము
  rationale: దత్తి విభక్తిలోని నామవాచకంతో అదే మూలానికి చెందిన క్రియను కలిపిన గ్రీకు నిర్మాణం ఆజ్ఞ తీవ్రతను పెంచుతుంది. తెలుగులో సహజంగా ఆ బలాన్ని ‘కఠినంగా ఆజ్ఞాపించాము’ తెలియజేస్తుంది.
- source_word: μὴ διδάσκειν
  choice: బోధించవద్దని
  rationale: ఇది ఆజ్ఞలోని నిషేధ విషయాన్ని నేరుగా తెలియజేస్తుంది; మూలంలో తప్పనిసరిగా లేని ‘బోధించడం మానేయండి’ అనే భావాన్ని చేర్చదు.
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: ఈ నామంలో
  rationale: ఈ నామంతో ముడిపడిన అధికారంపై ఆధారపడి బోధించడాన్ని సూచించే అపొస్తలుల కార్యములలోని ప్రయోగాన్ని ‘ఈ నామంలో’ సమీపంగా కాపాడుతుంది.
- source_word: ἰδοὺ
  choice: అయినా చూడండి
  rationale: ἰδοὺ లోని శ్రద్ధ ఆకర్షించే, ఎదుర్కొనే బలాన్ని ‘చూడండి’ అందిస్తుంది; సందర్భంలోని వ్యతిరేకతను తెలుగులో సహజంగా చూపడానికి ‘అయినా’ జోడించబడింది.
- source_word: πεπληρώκατε τὴν Ἰερουσαλὴμ
  choice: యెరూషలేమును నింపేశారు
  rationale: పూర్తయి ప్రస్తుతం ఫలితం కొనసాగుతున్న కార్యాన్ని గ్రీకు పరిపూర్ణ కాలం సూచిస్తుంది. ‘నింపేశారు’ ఆ బలాన్ని సహజంగా తెలియజేస్తూ మూల రూపకాన్ని నిలుపుతుంది.
- source_word: τῆς διδαχῆς ὑμῶν
  choice: మీ బోధతో
  rationale: ‘నింపడం’ అనే క్రియతో సంబంధించి గ్రీకు షష్ఠీ విభక్తిని తెలుగులో సాధనార్థక ‘తో’ సహజంగా వ్యక్తపరుస్తుంది. ‘బోధ’ అనేది మతసంప్రదాయ ప్రత్యేకార్థం మోపకుండా διδαχήని అందిస్తుంది.
- source_word: βούλεσθε
  choice: తీసుకురావాలని చూస్తున్నారు
  rationale: ఈ మధ్యమ రూపంలోని సంకల్పం లేదా ఉద్దేశాన్ని తెలుగులో సహజమైన ఆరోపణ ధోరణితో వ్యక్తపరుస్తుంది; ‘నిశ్చయించుకున్నారు’ అన్నంత తీవ్రతను మూలానికి మించి మోపదు.
- source_word: ἐπαγαγεῖν ἐφ’ ἡμᾶς
  choice: మా మీదికి తీసుకురావాలని
  rationale: ఎవరిమీదికైనా ఏదో తీసుకురావడం అనే గ్రీకు దృశ్యరూపాన్ని కాపాడుతుంది; సందర్భంలో బాధ్యత లేదా దోషాన్ని మోపడమనే సూచనను ప్రధాన పాఠ్యంలో పూర్తిగా విప్పదు.
- source_word: τὸ αἷμα τοῦ ἀνθρώπου τούτου
  choice: ఈ మనిషి రక్తాన్ని
  rationale: ‘ఈ మనిషి’ అనే దూరంగా ఉంచే, తృణీకారసూచక సంబోధనను మరియు రక్తదోషానికి సంబంధించిన గ్రీకు నుడికార దృశ్యాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘ఈ మనిషి రక్తాన్ని మా మీదికి తీసుకురావడం’ అనే మాటలోని భావం
  choice: యేసు మరణానికి తమను బాధ్యులుగా లేదా రక్తదోషులుగా చేయాలనే ఆరోపణను సూచించే మూల నుడికారాన్ని ప్రధాన పాఠ్యంలో యథాతథ దృశ్యంతో ఉంచడం.
  alternative: ‘ఈ మనిషి మరణానికి మమ్మల్ని బాధ్యులను చేయాలని చూస్తున్నారు’ అని భావానువాదం చేయడం.
  rationale: గ్రీకు పాఠ్యం ‘రక్తాన్ని మీదికి తీసుకురావడం’ అనే ఉద్దేశపూర్వకంగా బలమైన నుడికారాన్ని వాడుతుంది. దాని భావాన్ని ప్రధాన పాఠ్యంలో పూర్తిగా వివరిస్తే మూలంలోని రూపకం, ధార్మిక ఉద్వేగం తగ్గుతాయి; అందుకే వివరణను పాదటిప్పణిలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన శైలి. ప్రధాన పాఠ్యంలో గ్రీకు రక్తదోష నుడికారాన్ని కాపాడి, దాని స్పష్టార్థాన్ని పాదటిప్పణిలో ఇచ్చాం. [a] గుర్తు అది వివరిస్తున్న పూర్తి నుడికారం చివర ఉంచబడింది.
