- from: 'అతడు ఇలా అన్నాడు: “ఈ నామంలో బోధించవద్దని మేము మీకు కఠినంగా ఆజ్ఞాపించాము. అయినా చూడండి, మీరు మీ బోధతో యెరూషలేమును నింపేశారు; ఈ మనిషి రక్తాన్ని మా మీదికి తీసుకురావాలని చూస్తున్నారు[a].”'
  to: 'అతడు ఇలా అన్నాడు: “ఈ పేరున బోధించవద్దని మేము మీకు కఠినంగా ఆజ్ఞాపించాము. చూడండి, మీరు మీ బోధతో యెరూషలేమును నింపేశారు; ఈ మనిషి రక్తాన్ని మా మీదికి తీసుకురావాలని ఉద్దేశిస్తున్నారు[a].”'
