  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: παραγενόμενος δέ τις ἀπήγγειλεν αὐτοῖς ὅτι Ἰδοὺ οἱ ἄνδρες οὓς ἔθεσθε ἐν τῇ φυλακῇ εἰσὶν ἐν τῷ ἱερῷ ἑστῶτες καὶ διδάσκοντες τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/025.yaml
  text: But someone came and reported to them[a], “Look, the men whom you put in prison are standing in the temple and teaching the people.”
translation:
  language: te
  text: 'అయితే ఒకరు వచ్చి వారికి ఇలా తెలియజేశారు: “చూడండి, మీరు చెరసాలలో ఉంచిన ఆ మనుషులు దేవాలయ ప్రాంగణంలో[a] నిలబడి ప్రజలకు బోధిస్తున్నారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవాలయంలో”; గ్రీకు పదమైన ἱερόν అంతర్గర్భ ఆలయాన్ని మాత్రమే కాక దేవాలయ సముదాయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: వచ్చి
  rationale: సందేశకుడు ముందుగా అక్కడికి రావడాన్ని సూచించే భూతకాల అసమాపక క్రియను సహజమైన తెలుగు కథన క్రమంలో చూపిస్తుంది.
- source_word: δέ
  choice: అయితే
  rationale: మునుపటి ఘటనకు భిన్నమైన, ఆశ్చర్యకరమైన పరిణామాన్ని తెలిపే స్వల్ప వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τις
  choice: ఒకరు
  rationale: వ్యక్తి ఎవరో పేర్కొనని గ్రీకు అనిర్దిష్ట సర్వనామ భావాన్ని, అనవసరంగా లింగాన్ని నిర్దేశించకుండా నిలుపుతుంది.
- source_word: ἀπήγγειλεν αὐτοῖς
  choice: వారికి ఇలా తెలియజేశారు
  rationale: అధికారులకు సమాచారాన్ని చేరవేసిన అధికారిక సందర్భానికి తగిన సహజమైన తెలుగు ప్రయోగం; αὐτοῖςను సర్వనామంగానే ఉంచుతుంది.
- source_word: Ἰδοὺ
  choice: చూడండి
  rationale: ఆశ్చర్యకరమైన వార్తవైపు శ్రోతల దృష్టిని మళ్లించే ఆజ్ఞార్థక ఉద్ఘాటనను ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οἱ ἄνδρες
  choice: ఆ మనుషులు
  rationale: ఇంతకు ముందు చెరసాలలో ఉంచబడిన నిర్దిష్ట వ్యక్తులను సూచించే పదబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: οὓς ἔθεσθε ἐν τῇ φυλακῇ
  choice: మీరు చెరసాలలో ఉంచిన
  rationale: τίθημι యొక్క ‘ఉంచు’ భావాన్ని, తెలిసిన నిర్బంధ స్థలమైన φυλακή సందర్భాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἐν τῷ ἱερῷ
  choice: దేవాలయ ప్రాంగణంలో
  rationale: ἱερόν ఇక్కడ అంతర్గర్భ ఆలయాన్ని మాత్రమే కాక మొత్తం దేవాలయ సముదాయాన్ని సూచిస్తుంది; ‘ప్రాంగణం’ ఆ స్థలార్థాన్ని తెలుగులో స్పష్టంగా ఇస్తుంది.
- source_word: ἑστῶτες καὶ διδάσκοντες τὸν λαόν
  choice: నిలబడి ప్రజలకు బోధిస్తున్నారు
  rationale: రెండు వర్తమాన క్రియల కొనసాగుతున్న చర్యను, వాటి సమన్వయాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో కాపాడుతుంది.
