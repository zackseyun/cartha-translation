    text: లేదా, ‘వయసులో చిన్నవారు.’ గ్రీకు పదం νεώτεροι తులనాత్మక రూపంలో ఉంది; దీనికి ‘యువకులు’ అనే సాధారణ అర్థం గానీ, ఇతరులకంటే వయసులో చిన్నవారు అనే అర్థం గానీ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: లేచి
  rationale: ἀνίστημι యొక్క భూతకాల కృదంతం; వారు చర్యకు ఉపక్రమించేందుకు లేచినదాన్ని సహజమైన తెలుగు కథన క్రమంలో తెలియజేస్తుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: δέ ఇక్కడ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా చూపిస్తుంది.
- source_word: οἱ νεώτεροι
  choice: చిన్నవారు
  rationale: νεώτεροι తులనాత్మక రూపం కాబట్టి ‘వయసులో చిన్నవారు’ అనే భావాన్ని నిలుపుతుంది; సందర్భంలో పురుషులనే సూచిస్తున్నా, తెలుగులో ఈ రూపం సంక్షిప్తంగా సహజంగా ఉంది.
- source_word: συνέστειλαν
  choice: అతన్ని చుట్టి
  rationale: సందర్భంలో మృతదేహాన్ని తీసుకెళ్లేందుకు వస్త్రంతో చుట్టడాన్ని సూచించే సంభావ్య భౌతిక చర్యను అనవసర వివరణ లేకుండా తెలుపుతుంది.
- source_word: αὐτὸν
  choice: అతన్ని
  rationale: అననీయను సూచించే ప్రత్యక్ష కర్మ సర్వనామం.
- source_word: ἐξενέγκαντες
  choice: బయటికి మోసుకెళ్లి
  rationale: ἐκφέρω ఇక్కడ మృతదేహాన్ని ఉన్న చోటు నుంచి బయటికి మోసుకెళ్లడాన్ని సూచిస్తుంది.
- source_word: ἔθαψαν
  choice: పాతిపెట్టారు
  rationale: θάπτωకు సాధారణ, స్పష్టమైన ఆధునిక తెలుగు సమానార్థకం.
