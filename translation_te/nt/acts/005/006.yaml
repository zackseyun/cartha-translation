revisions:
- from: అప్పుడు చిన్నవారు[a] లేచి, అతన్ని చుట్టి, బయటికి మోసుకెళ్లి పాతిపెట్టారు.
  to: అప్పుడు యువకులు[a] లేచి, అతని దేహాన్ని చుట్టి, బయటికి మోసుకెళ్లి పాతిపెట్టారు.
  rationale: The revision replaces an ambiguous and potentially child-specific term with ‘యువకులు,’ while preserving the comparative alternative in the footnote. It also clarifies that the wrapping action was performed on Ananias’s body, avoiding the unintended sense that the men surrounded him. No doctrinal or unsupported historical detail has been introduced.
