translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు కృదంతాల వరుసను సహజమైన తెలుగు సంయుక్త క్రియలతో నిలిపి, νεώτεροι లోని నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో ఉంచాం.
