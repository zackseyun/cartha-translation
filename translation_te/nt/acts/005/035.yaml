id: ACT.5.35
reference: Acts 5:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπέν τε πρὸς αὐτούς· Ἄνδρες Ἰσραηλῖται, προσέχετε ἑαυτοῖς ἐπὶ τοῖς ἀνθρώποις τούτοις τί μέλλετε πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/035.yaml
  text: And he said to them[a], “Men of Israel, be careful what you are about to do with these men.”
translation:
  language: te
  text: 'అప్పుడు అతడు వారితో ఇలా అన్నాడు: “ఇశ్రాయేలీయులారా, మీరు ఈ మనుషుల విషయంలో ఏమి చేయబోతున్నారో జాగ్రత్తగా ఉండండి.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ మనుషుల విషయంలో మీరు ఏమి చేయబోతున్నారో మీ గురించి మీరు జాగ్రత్తపడండి.”
    reason: προσέχετε ἑαυτοῖς అనే గ్రీకు పదబంధంలోని ఆత్మార్థకమైన, మరింత అక్షరార్థపు భావాన్ని చూపే ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: εἶπέν τε
  choice: అప్పుడు అతడు ... ఇలా అన్నాడు
  rationale: τέ మునుపటి కథనంతో స్వల్ప అనుసంధానాన్ని చూపుతుంది. తెలుగులో ‘అప్పుడు’ కథన ప్రవాహాన్ని సహజంగా కొనసాగిస్తుంది; బలమైన కారణార్థాన్ని చేర్చదు.
- source_word: πρὸς αὐτούς
  choice: వారితో
  rationale: λέγωతో కూడిన πρός + ద్వితీయా విభక్తి మాట ఎవరిని ఉద్దేశించిందో సూచిస్తుంది. ‘వారితో ... అన్నాడు’ సహజమైన తెలుగు ప్రయోగం.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: ఇశ్రాయేలీయులారా
  rationale: ఇది ఇశ్రాయేలు పురుషులను ఉద్దేశించిన సంబోధన. ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయులారా’ గంభీరంగా, సహజంగా ఉంది; సందర్భంలోని పురుష సభాసభ్యులను సూచిస్తుంది.
- source_word: προσέχετε ἑαυτοῖς
  choice: జాగ్రత్తగా ఆలోచించండి
  rationale: ఈ ఆజ్ఞ స్వీయజాగ్రత్తతో వ్యవహరించమనే హెచ్చరికను ఇస్తుంది. తెలుగులో తరువాత వచ్చే ‘ఏమి చేయబోతున్నారో’తో కలిపి ‘జాగ్రత్తగా ఆలోచించండి’ ఆచరణకు ముందు అప్రమత్తంగా పరిశీలించాలనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐπὶ τοῖς ἀνθρώποις τούτοις
  choice: ఈ మనుషుల విషయంలో
  rationale: ἐπί + చతుర్థీ ఇక్కడ జాగ్రత్తకు సంబంధించిన విషయాన్ని సూచిస్తుంది. ‘విషయంలో’ తటస్థతను కాపాడుతుంది; ‘విరోధంగా’ అని అనువదించి గ్రీకులో స్పష్టంగా లేని శత్రుత్వాన్ని చేర్చదు.
- source_word: τί μέλλετε πράσσειν
  choice: మీరు ఏమి చేయబోతున్నారో
  rationale: μέλλω + క్రియార్థక రూపం సమీప భవిష్యత్తులో చేయనున్న లేదా ఉద్దేశించిన కార్యాన్ని సూచిస్తుంది. ‘చేయబోతున్నారో’ ఈ రెండు ఛాయలను సందర్భానుకూలంగా నిలుపుతుంది.
