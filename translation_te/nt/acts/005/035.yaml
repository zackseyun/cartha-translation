  to: 'అప్పుడు అతడు వారితో ఇలా అన్నాడు: “ఇశ్రాయేలీయులారా, మీరు ఈ మనుషుల విషయంలో ఏమి చేయబోతున్నారో జాగ్రత్తగా ఉండండి.[a]”'
  rationale: The revision replaces the added idea of deliberation with a direct caution, thereby more closely reflecting προσέχετε ἑαυτοῖς while retaining the prospective “what you are about to do” and the neutral reference to these men. The footnote continues to document the reflexive nuance without making it the less idiomatic main-text wording.
