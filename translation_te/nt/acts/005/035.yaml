  register: ఆధునిక ప్రామాణిక తెలుగు; సభలో ఇచ్చిన గంభీరమైన హెచ్చరికకు తగిన మర్యాదాపూర్వక బహువచనం వాడబడింది. ప్రధాన పాఠం సహజమైన తెలుగును అనుసరిస్తూ, ఆత్మార్థక నిర్మాణాన్ని పాదటిప్పణిలో నిలిపింది.
