    issue: The main text renders προσέχετε ἑαυτοῖς as “జాగ్రత్తగా ఆలోచించండి.”
    rationale: This introduces ‘think/consider’ (ఆలోచించండి), which the Greek does not state. The source warns the audience to exercise caution regarding their impending action; it does not explicitly command deliberation.
