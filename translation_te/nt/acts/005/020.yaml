id: ACT.5.20
reference: Acts 5:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πορεύεσθε καὶ σταθέντες λαλεῖτε ἐν τῷ ἱερῷ τῷ λαῷ πάντα τὰ ῥήματα τῆς ζωῆς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/020.yaml
  text: Go and stand in the temple[c][b][a], and speak to the people all the words of this life.
translation:
  language: te
  text: “మీరు వెళ్లండి; దేవాలయంలో[a] నిలబడి[c], ఈ జీవానికి సంబంధించిన[b] మాటలన్నిటినీ ప్రజలకు చెప్పండి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవాలయ ప్రాంగణంలో” లేదా “దేవాలయ ఆవరణలో.” గ్రీకు ἱερόν అనే పదం కేవలం అంతర్గర్భాలయాన్ని కాక దేవాలయ సముదాయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఈ జీవితం గురించి” లేదా “ఈ జీవన విధానానికి చెందిన.” ఈ మాటబంధం సువార్తలో ప్రకటించబడే జీవాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: c
    text: లేదా “దేవాలయంలో నిలబడండి, ప్రజలకు చెప్పండి.” గ్రీకులో “నిలబడి” అనే భావం అసమాపక క్రియారూపంలో ఉంది; సందర్భంలో దాన్ని ప్రధాన ఆజ్ఞతో అనుసంధానమైన చర్యగా కూడా వ్యక్తం చేయవచ్చు.
    reason: previous_rendering
lexical_decisions:
- source_word: Πορεύεσθε
  choice: మీరు వెళ్లండి
  rationale: ఇది ఆజ్ఞార్థక క్రియ. ‘వెళ్లండి’ అనే రూపం ఆ ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: σταθέντες
  choice: నిలబడి
  rationale: ఇది ἵστημι క్రియకు చెందిన భూతార్థక అసమాపక క్రియారూపం; ప్రధాన ఆజ్ఞతో పాటు జరిగే చర్యను సూచిస్తుంది. ‘నిలబడి’ అనేది తెలుగు వాక్య నిర్మాణంలో దాని అసమాపక స్వభావాన్ని సహజంగా నిలుపుతుంది.
- source_word: λαλεῖτε
  choice: చెప్పండి
  rationale: ఇక్కడ ప్రజలను ఉద్దేశించి మాటలను తెలియజేయమనే ఆజ్ఞ ఉంది. ‘చెప్పండి’ సాధారణ ప్రజలకు సహజంగా ఉంటుంది; ‘ప్రకటించండి’ అన్నది మూలపదంలో స్పష్టంగా లేని అధికారిక ప్రకటన భావాన్ని జోడించవచ్చు.
- source_word: ἐν τῷ ἱερῷ
  choice: దేవాలయంలో
  rationale: ἱερόν ఇక్కడ అంతర్గర్భాలయాన్ని మాత్రమే కాక మొత్తం దేవాలయ సముదాయాన్ని సూచిస్తుంది. ‘దేవాలయంలో’ సహజమైన సంక్షిప్త అనువాదం; దాని విస్తృత పరిధిని పాదటిప్పణి వివరిస్తుంది.
- source_word: τῷ λαῷ
  choice: ప్రజలకు
  rationale: λαός అనే పదాన్ని నేరుగా ప్రతిబింబిస్తుంది; వచనంలో స్పష్టంగా లేని ‘జనసమూహం’ లేదా ‘ఇశ్రాయేలు ప్రజలు’ అనే నిర్దిష్టీకరణను చేర్చదు.
- source_word: πάντα τὰ ῥήματα
  choice: మాటలన్నిటినీ
  rationale: πᾶς మరియు ῥῆμα రెండింటి భావాన్నీ నిలుపుతుంది. ‘సందేశమంతటినీ’ సులభమైన ప్రత్యామ్నాయమైనా, అది మూలంలోని ‘మాటలు’ అనే బహువచనాన్ని వ్యాఖ్యానాత్మకంగా కుదిస్తుంది.
- source_word: τῆς ζωῆς ταύτης
  choice: ఈ జీవానికి చెందిన
  rationale: మూలంలోని సంబంధ విభక్తి నిర్మాణాన్ని దగ్గరగా నిలుపుతూ, ‘ఈ జీవితం గురించి’ లేదా ‘ఈ జీవన విధానానికి చెందిన’ అనే సాధ్యమైన భావాలలో ఒక్కదానినే ఖరారు చేయదు.
theological_decisions:
- issue: τῆς ζωῆς ταύτης (‘ఈ జీవం’) యొక్క అర్థం
  choice: ‘ఈ జీవానికి చెందిన’ అనే సంక్షిప్తమైన, విపులీకరించని రూపాన్ని ఉంచడం
  alternative: ‘ఈ నూతన జీవితం గురించి,’ ‘ఈ జీవన విధానానికి చెందిన,’ లేదా ‘జీవాన్ని ఇచ్చే సందేశం’
  rationale: ఈ మాటబంధం యేసులోని రక్షణతో, అపొస్తలులు ప్రకటించిన సువార్తతో, లేదా దానివల్ల కలిగే జీవంతో సంబంధం కలిగి ఉండవచ్చు. గ్రీకు పాఠం ఈ సంబంధాన్ని సంక్షిప్తంగానూ కొంత తెరవబడినదిగానూ ఉంచుతుంది; కాబట్టి అనువాదం ఒకే వ్యాఖ్యానాన్ని బలవంతంగా ఎంచుకోదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవార్థక బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. వాక్యం సహజంగా ఉండేందుకు ‘వెళ్లండి’ అనే మొదటి ఆజ్ఞను స్పష్టంగా ఉంచి, σταθέντες ను ‘నిలబడి’ అనే అసమాపక రూపంతో నిలిపి, λαλεῖτε ను ‘చెప్పండి’గా అనువదించాం. భాష గంభీరంగా ఉన్నప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా ఉంచబడింది.
