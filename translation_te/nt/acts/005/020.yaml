  terminology: “దేవాలయంలో” is appropriate, with the note correctly clarifying that ἱερόν denotes the temple complex rather than specifically the inner sanctuary. “ప్రజలకు,” “మాటలన్నిటినీ,” and “చెప్పండి” are clear and suitably neutral. The terminology preserves the source’s ambiguity and does not add theological interpretation.
