  text: After bringing them in, they stood them before the council, and the high priest questioned them.
translation:
  language: te
  text: వారిని తీసుకువచ్చి, మండలి[a] ఎదుట నిలబెట్టారు. మహాయాజకుడు వారిని ప్రశ్నించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సన్హెద్రిన్.’ గ్రీకు పదమైన συνέδριον యూదుల పాలక మండలిని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀγαγόντες
  choice: వారిని తీసుకొచ్చిన తరువాత
  rationale: ἄγω పదంలోని భూతకాల క్రియావిశేషణ రూపం ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: ఇక్కడ δέ కథనాన్ని ముందుకు నడిపే స్వల్ప అనుసంధాన పదం. తెలుగులో వాక్యక్రమమే ఆ సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἔστησαν
  choice: నిలబెట్టారు
  rationale: ἵστημι ఇక్కడ సకర్మకంగా ‘నిలబడేలా చేయడం/ఉంచడం’ అనే అర్థంలో ఉంది. న్యాయసభ ఎదుట హాజరుపరచిన దృశ్యాన్ని ‘నిలబెట్టారు’ స్పష్టంగా నిలుపుతుంది.
- source_word: ἐν τῷ συνεδρίῳ
  choice: న్యాయసభ ముందు
  rationale: συνέδριον యూదుల పాలక మండలిని సూచిస్తుంది. ‘న్యాయసభ’ దాని విచారణాత్మక సందర్భాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ἔστησαν‌తో కలిపి ‘ముందు’ అనడం లక్ష్యభాషలో సహజం.
- source_word: ἐπηρώτησεν
  choice: ప్రశ్నించాడు
  rationale: ἐπερωτάω అంటే అడగడం లేదా ప్రశ్నించడం. న్యాయపరమైన సందర్భానికి ‘ప్రశ్నించాడు’ సరిపోతుంది; ‘విచారించాడు’ కంటే మూలంలోని బలాన్ని అతిశయింపజేయదు.
- source_word: ὁ ἀρχιερεὺς
  choice: ప్రధాన యాజకుడు
  rationale: ఈ సందర్భంలో అధ్యక్షత వహించే యూదుల అత్యున్నత యాజకుని సూచించే ἀρχιερεύς‌కు ఆధునిక ప్రామాణిక తెలుగు రూపం.
theological_decisions:
- issue: συνέδριον పదం అనువాదం
  choice: న్యాయసభ
  alternative: సన్హెద్రిన్
  rationale: మూలంలోని సాధారణ నామవాచక భావాన్ని ప్రధాన పాఠ్యంలో అనువదించాం; అది ప్రత్యేకంగా యూదుల పాలక మండలిని సూచిస్తుందని పాదసూచికలో స్పష్టం చేశాం. దీనివల్ల సంప్రదాయ నామాన్ని మూలపద స్థానంలో పెట్టకుండా దాని సూచ్యార్థం నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయసభా పదజాలం వాడబడింది. గ్రీకు వాక్యంలోని చర్యల క్రమం, సమూహం ఎదుట నిలబెట్టడం, ప్రధాన యాజకుడు ప్రశ్నించడం స్పష్టంగా నిలుపబడ్డాయి.
