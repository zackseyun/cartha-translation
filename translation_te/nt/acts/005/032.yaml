id: ACT.5.32
reference: Acts 5:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ⸀ἐσμεν μάρτυρες τῶν ῥημάτων τούτων, καὶ τὸ ⸀πνεῦμα τὸ ἅγιον ὃ ἔδωκεν ὁ θεὸς τοῖς πειθαρχοῦσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/032.yaml
  text: And we are witnesses of these things[a], and so is the Holy Spirit[c][b], whom God has given to those who obey him.
translation:
  language: te
  text: “ఈ సంగతులకు[a] మేము సాక్షులం; అలాగే దేవుడు తనకు విధేయత చూపేవారికి ఇచ్చిన పరిశుద్ధాత్మ[c][b] కూడా సాక్షి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఈ మాటలకు,” లేదా “ఈ విషయాలకు.”
    reason: lexical_alternative
  - marker: b
    text: 'గ్రీకులో అక్షరార్థంగా “మరియు పరిశుద్ధాత్మ.” మొదటి వాక్యఖండంలోని భావం ఇక్కడికీ కొనసాగుతుంది: “మరియు పరిశుద్ధాత్మ [కూడా సాక్షి].”'
    reason: alternative_reading
  - marker: c
    text: గ్రీకులో ‘ఆత్మ’ (πνεῦμα) నపుంసక నామవాచకం కాబట్టి దాన్ని సూచించే సంబంధ సర్వనామం కూడా నపుంసక రూపంలో ఉంది. ఇది వ్యాకరణ సంబంధమైన రూపం; తెలుగులో ‘దేవుడు... ఇచ్చిన పరిశుద్ధాత్మ’ అనే నిర్మాణం లింగాన్ని ప్రత్యేకంగా సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυρες
  choice: సాక్షులం
  rationale: అపొస్తలులు ప్రత్యక్షంగా తెలిసిన వాటి గురించి సాక్ష్యం చెప్పేవారనే న్యాయసంబంధమైన, సాక్ష్యార్థక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ῥημάτων
  choice: సంగతులకు
  rationale: ῥῆμα అనే పదానికి ‘మాటలు,’ ‘విషయాలు,’ ‘సంగతులు’ అనే భావాలు ఉండవచ్చు. ఇక్కడ జరిగిన కార్యాలు మరియు ప్రకటించిన విషయాలు రెండింటినీ సహజంగా సూచించడానికి ‘సంగతులు’ అనుకూలం.
- source_word: πνεῦμα τὸ ἅγιον
  choice: పరిశుద్ధాత్మ
  rationale: లూకా–అపొస్తలుల కార్యములలోని దైవిక వ్యక్తిగత సూచనకు ఆధునిక ప్రామాణిక తెలుగు పదప్రయోగం.
- source_word: ἔδωκεν
  choice: ఇచ్చిన
  rationale: గ్రీకు aorist క్రియను సందర్భానుసారంగా సహజమైన భూతకాల సంబంధక్రియగా అనువదిస్తుంది; ఆత్మను ఇచ్చిన దేవుని కార్యాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: πειθαρχοῦσιν
  choice: విధేయత చూపేవారికి
  rationale: అధికారంలో ఉన్న వ్యక్తికి లోబడటం లేదా విధేయత చూపటం అనే πειθαρχέω భావాన్ని తెలియజేస్తుంది; 5:29లోని దేవునికి విధేయత అనే సమీప సందర్భాన్నీ ప్రతిధ్వనింపజేస్తుంది.
- source_word: αὐτῷ
  choice: తనకు
  rationale: సర్వనామం దేవుణ్ణి తిరిగి సూచిస్తున్నదని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పరిశుద్ధాత్మ అపొస్తలులతోపాటు సహసాక్షిగా చెప్పబడుతున్నాడా?
  choice: ‘పరిశుద్ధాత్మ కూడా సాక్షి’ అని అంతర్భూత విధేయాన్ని స్పష్టం చేయడం.
  alternative: ‘మరియు పరిశుద్ధాత్మ’ అని మాత్రమే ఉంచడం.
  rationale: రెండవ గ్రీకు ఖండంలో క్రియ లేకపోయినా, మొదటి ఖండంలోని ‘మేము సాక్షులం’ అనే విధేయం అక్కడికి కొనసాగుతుంది. తెలుగులో ‘కూడా సాక్షి’ అని చెప్పడం కొత్త భావాన్ని చేర్చకుండా వాక్య సంబంధాన్ని స్పష్టం చేస్తుంది.
- issue: పరిశుద్ధాత్మను సూచించే గ్రీకు సంబంధ సర్వనామం
  choice: తెలుగులో ప్రత్యేక సంబంధ సర్వనామం పెట్టకుండా ‘దేవుడు... ఇచ్చిన పరిశుద్ధాత్మ’ అనే సహజ నిర్మాణం ఉపయోగించడం.
  alternative: గ్రీకు నపుంసక వ్యాకరణ రూపాన్ని పదశః ప్రతిబింబించే అసహజ నిర్మాణం.
  rationale: ὃ అనే రూపం నపుంసక నామవాచకమైన πνεῦμαతో వ్యాకరణపరంగా ఏకీభవిస్తుంది. తెలుగులో సంబంధక్రియా నిర్మాణం లింగభేదాన్ని బలవంతంగా వ్యక్తం చేయకుండా మూలార్థాన్ని సహజంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘విధేయత చూపేవారు’ అనేది అధికారానికి లోబడే భావాన్ని సహజంగా తెలియజేస్తుంది. మూలంలోని రెండు సమాంతర సాక్ష్యాలను సెమికోలన్‌తో వేరు చేసి సంబంధాన్ని స్పష్టంగా ఉంచాం.
