  terminology: ‘సాక్షులు,’ ‘పరిశుద్ధాత్మ,’ and ‘విధేయత చూపేవారు’ are appropriate and consistent terms. ‘సంగతులు’ is a defensible contextual rendering of ῥημάτων, while footnote a properly preserves ‘మాటలు’ and ‘విషయాలు’ as alternatives. Footnotes b and c accurately explain the Greek syntax and grammatical gender without imposing theological claims.
