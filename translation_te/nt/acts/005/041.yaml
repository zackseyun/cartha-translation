id: ACT.5.41
reference: Acts 5:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ μὲν οὖν ἐπορεύοντο χαίροντες ἀπὸ προσώπου τοῦ συνεδρίου ὅτι ⸂κατηξιώθησαν ὑπὲρ τοῦ ὀνόματος⸃ ἀτιμασθῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/041.yaml
  text: So they went on their way from the presence of the council[a], rejoicing that they had been counted worthy to be dishonored for the Name.
translation:
  language: te
  text: కాబట్టి వారు ఆ మహాసభ సమక్షం నుండి వెళ్లిపోతూ, ఆ నామం కోసం[a] అవమానించబడటానికి తాము యోగ్యులుగా పరిగణించబడినందుకు సంతోషించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు నామం కోసం.” గ్రీకులో “ఆ నామం” అని ఉంది; ఇది గౌరవసూచకంగా సంక్షిప్తంగా చెప్పిన విధానం.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: వెళ్లిపోతూ
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న కదలికను, తెలుగు కథన ప్రవాహానికి సహజంగా ఉండే విధంగా వ్యక్తపరుస్తుంది.
- source_word: χαίροντες
  choice: సంతోషించారు
  rationale: వారు వెళ్లిపోతున్న సమయంలో ఉన్న ఆనందాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కారణవాక్యంతో స్పష్టంగా అనుసంధానమవుతుంది.
- source_word: ἀπὸ προσώπου τοῦ συνεδρίου
  choice: ఆ మహాసభ సమక్షం నుండి
  rationale: ‘సభ ముఖము/సమక్షము నుండి’ అనే మూలభాషా నుడికారంలోని సమక్ష భావాన్ని నిలుపుతూ, పాలక మండలిని తెలుగులో అర్థమయ్యేలా ‘మహాసభ’గా అనువదిస్తుంది.
- source_word: κατηξιώθησαν
  choice: తాము యోగ్యులుగా ఎంచబడినందుకు
  rationale: తమను యోగ్యులుగా పరిగణించారనే దైవకర్మణి భావాన్ని సహజంగా వ్యక్తపరుస్తుంది; కర్తను మూలపాఠంలాగే పేర్కొనదు.
- source_word: ὑπὲρ
  choice: కోసం
  rationale: ఇక్కడ ఆ నామంతో సంబంధం వల్ల లేదా దాని నిమిత్తం పొందిన అవమానాన్ని సంక్షిప్తంగా, సహజంగా తెలుపుతుంది.
- source_word: τοῦ ὀνόματος
  choice: ఆ నామం
  rationale: మూలంలోని గౌరవసూచక నిరపేక్ష ప్రయోగాన్ని నిలుపుతుంది; ప్రధాన పాఠ్యంలో ‘యేసు నామం’ అని స్పష్టీకరించి మూలానికి మించిన సమాచారాన్ని చేర్చదు.
- source_word: ἀτιμασθῆναι
  choice: అవమానించబడటానికి
  rationale: గౌరవం–అవమానం పరిధిలోని అర్థాన్నీ, క్రియలోని కర్మణి రూపాన్నీ నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: ‘ఆ నామం’ అనే నిరపేక్ష ప్రయోగం
  choice: ప్రధాన పాఠ్యంలో ‘ఆ నామం’ అని ఉంచడం
  alternative: ‘యేసు నామం’ లేదా ‘ఆయన నామం’
  rationale: τοῦ ὀνόματος అనే గ్రీకు పదబంధం ఇక్కడ నామాన్ని మాత్రమే గౌరవసూచకంగా పేర్కొంటుంది. సందర్భంలో అది యేసును సూచించినప్పటికీ, మూలపాఠం సూచక నామాన్ని ప్రత్యక్షంగా చెప్పదు; అందువల్ల దాని ఉద్దేశపూర్వక సంక్షిప్తతను నిలుపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథన శైలి. చారిత్రక పాలక మండలికి ‘మహాసభ’ను, గౌరవసూచక సంక్షిప్త ప్రయోగానికి ‘ఆ నామం’ను ఉపయోగించాం.
