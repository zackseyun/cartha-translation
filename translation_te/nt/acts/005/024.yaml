  text: ὡς δὲ ἤκουσαν τοὺς λόγους τούτους ὅ ⸀τε στρατηγὸς τοῦ ἱεροῦ καὶ οἱ ἀρχιερεῖς, διηπόρουν περὶ αὐτῶν τί ἂν γένοιτο τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/024.yaml
  text: When the captain of the temple and the chief priests heard these words[a], they were perplexed about them, wondering what this might come to.
translation:
  language: te
  text: 'ఆ మాటలు విన్నప్పుడు, ఆలయ కాపలాదళాధిపతి, ప్రధాన యాజకులు వాటి విషయమై అయోమయంలో పడ్డారు: ఇది ఎటు దారితీస్తుందో అని.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దీనివల్ల చివరకు ఏమవుతుందో.” గ్రీకు వ్యక్తీకరణ ఈ పరిస్థితి ఎలాంటి ఫలితానికి లేదా పర్యవసానానికి దారితీస్తుందో అన్న అనిశ్చితిని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἤκουσαν
  choice: విన్నప్పుడు
  rationale: ὡς యొక్క కాలార్థాన్ని సహజమైన తెలుగు ఉపవాక్యంతో తెలియజేస్తుంది; δέ కథనంలోని మలుపును సూచించినా తెలుగులో ప్రత్యేక పదం అవసరం లేదు.
- source_word: τοὺς λόγους τούτους
  choice: ఆ మాటలు
  rationale: ఇప్పుడే అందిన నివేదికలోని మాటలను సూచిస్తుంది; మూలంలోని λόγους కు సమీపంగా, సహజంగా ఉంది.
- source_word: ὅ τε στρατηγὸς τοῦ ἱεροῦ
  choice: ఆలయ కాపలా అధిపతి
  rationale: ఆలయ భద్రతకు బాధ్యుడైన అధికారిని సూచించే στρατηγός యొక్క సందర్భార్థాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: οἱ ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: రెండవ ఆలయకాలపు ప్రధాన యాజక నాయకవర్గాన్ని సూచించే స్థిరమైన, ఖచ్చితమైన తెలుగు ప్రయోగం.
- source_word: διηπόρουν περὶ αὐτῶν
  choice: వాటి గురించి కలవరపడి
  rationale: తీవ్రమైన అయోమయం, అనిశ్చితిని సూచించే διαπορέω భావాన్ని వ్యక్తం చేస్తుంది; αὐτῶν దేనిని సూచిస్తుందో అతిగా నిర్ధారించకుండా 'వాటి' అని ఉంచుతుంది.
- source_word: τί ἂν γένοιτο τοῦτο
  choice: ఇది ఎటు దారితీస్తుందో
  rationale: ἄν తో కూడిన optative తెలియజేసే అనిశ్చిత ఫలితాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
