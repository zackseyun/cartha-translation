  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. మూలంలోని ఫలితం గురించిన అనిశ్చితిని నిలుపుతూ, అధికార పదవులను సాధారణ పాఠకునికి అర్థమయ్యేలా అనువదించాం.
