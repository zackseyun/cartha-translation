id: ACT.5.39
reference: Acts 5:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ ἐκ θεοῦ ἐστιν, οὐ ⸀δυνήσεσθε καταλῦσαι ⸀αὐτούς·) μήποτε καὶ θεομάχοι εὑρεθῆτε. ἐπείσθησαν δὲ αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/039.yaml
  text: But if it is from God[a], you will not be able to overthrow them. You may even be found to be fighting against God.” So they were persuaded by him[c][b],
translation:
  language: te
  text: కాని ఇది దేవుని నుండి వచ్చినదైతే, మీరు వారిని నాశనం చేయలేరు.[a][b] మీరు దేవునికి విరోధంగా పోరాడేవారిగా కూడా తేలిపోవచ్చు.”[c] అప్పుడు వారు అతని మాటకు ఒప్పుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నాశనం చేయలేరు’ అనే మాటను ‘పడగొట్టలేరు’ లేదా ‘విఫలం చేయలేరు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘వారిని’ అనేది అత్యంత సహజంగా అపొస్తలులను సూచిస్తుంది; కొందరు దీన్ని వారి ఉద్యమం లేదా కార్యాన్ని విస్తృతంగా సూచించేదిగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: c
    text: ‘దేవునికి విరోధంగా పోరాడేవారిగా’ అనే మాటను ‘దేవుని విరోధులుగా’ అని కూడా అనువదించవచ్చు; అక్షరార్థంగా, ‘దేవునితో పోరాడేవారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ θεοῦ
  choice: దేవుని నుండి వచ్చినది
  rationale: ἐκ మూలాన్ని లేదా ఆరంభాన్ని సూచిస్తుంది. ఈ రూపం గమలీయేలు ఉద్దేశించిన దైవిక మూలం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: δυνήσεσθε
  choice: మీరు … లేరు
  rationale: భవిష్యత్తులో వారికి అది సాధ్యం కాదనే భావాన్ని తెలుగు సామర్థ్యార్థక నిషేధ రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καταλῦσαι
  choice: పడగొట్టడం
  rationale: ఇక్కడ ఒక వర్గాన్ని లేదా వారి కార్యాన్ని విఫలం చేసి అంతం చేయడం అనే భావం ఉంది. ‘పడగొట్టడం’ వ్యక్తులను సూచించే కర్మతో సహజంగా ఉండి, నాశనం చేయడం కంటే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: αὐτούς
  choice: వారిని
  rationale: గ్రీకు పదం పుంలింగ బహువచనం; అది అత్యంత సహజంగా అపొస్తలులను సూచిస్తుంది. భావాన్ని ‘దానిని’ అని అమూర్తంగా మార్చకుండా వ్యక్తిగత సూచనను నిలిపాం.
- source_word: μήποτε
  choice: … తేలవచ్చు
  rationale: అవాంఛనీయమైన ఫలితం సంభవించవచ్చనే హెచ్చరికను ఈ సంభావ్యతా రూపం సహజంగా తెలియజేస్తుంది.
- source_word: θεομάχοι
  choice: దేవునితోనే పోరాడేవారు
  rationale: ఈ పదానికి అక్షరార్థంగా ‘దేవునితో పోరాడేవారు’ అనే భావం ఉంది. క్రియాత్మక తెలుగు రూపం దాని తీవ్రతను, సహజత్వాన్ని రెండింటినీ కాపాడుతుంది.
- source_word: εὑρεθῆτε
  choice: తేలవచ్చు
  rationale: వారు నిజానికి అటువంటివారిగా బయటపడటం లేదా నిరూపితులు కావడం అనే నిష్క్రియ భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπείσθησαν δὲ αὐτῷ
  choice: అప్పుడు వారు అతని మాటకు ఒప్పుకున్నారు
  rationale: సభవారు గమలీయేలు సలహాను అంగీకరించారని πείθω నిష్క్రియ రూపం సూచిస్తుంది. ‘అతని మాటకు ఒప్పుకున్నారు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
theological_decisions:
- issue: αὐτούς అనే సర్వనామం దేనిని సూచిస్తుంది?
  choice: సభ ఎదుట ఉన్న అపొస్తలులను సూచించే ‘వారిని’
  alternative: మునుపటి వచనంలోని ప్రణాళిక లేదా కార్యాన్ని విస్తృతంగా సూచించే భావం
  rationale: గ్రీకు సర్వనామం పుంలింగ బహువచనం కావడం వల్ల వ్యక్తులే అత్యంత సమీప సహజ సూచన. అయినా మునుపటి ‘ప్రణాళిక లేదా కార్యం’తో ఉన్న భావసంబంధాన్ని పాదటిప్పణిలో గుర్తించాం; తద్వారా వాక్యాన్ని ప్రతి మత ఉద్యమం గురించి అపరిమిత వాగ్దానంగా మార్చలేదు.
translation_notes:
  register: సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. మాట గంభీరతను నిలుపుతూ అతిగా సంస్కృతీకృతమైన పదజాలాన్ని నివారించాం. గ్రీకు వాక్యంలోని హెచ్చరిక, సంభావ్యత, సర్వనామ సూచనలోని స్వల్ప అనిశ్చితి పాఠ్యంలోను పాదటిప్పణుల్లోను నిలుపబడ్డాయి.
