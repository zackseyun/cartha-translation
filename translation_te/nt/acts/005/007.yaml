  text: Ἐγένετο δὲ ὡς ὡρῶν τριῶν διάστημα καὶ ἡ γυνὴ αὐτοῦ μὴ εἰδυῖα τὸ γεγονὸς εἰσῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/007.yaml
  text: After an interval of about three hours, his wife came in, not knowing what had happened.
translation:
  language: te
  text: దాదాపు మూడు గంటలు గడిచిన తర్వాత, ఏమి జరిగిందో తెలియక అతని భార్య లోపలికి వచ్చింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: తర్వాత
  rationale: ఈ సందర్భంలో Ἐγένετο కథనంలోని తదుపరి సంఘటనను పరిచయం చేసే ప్రయోగం; δὲ కథన కొనసాగింపును సూచించే మృదువైన అనుసంధానం. తెలుగులో ప్రత్యేకమైన అదనపు కథన సూచికను చేర్చకుండా కాలవాచక నిర్మాణంతో సహజంగా వ్యక్తమవుతుంది.
- source_word: ὡς ὡρῶν τριῶν διάστημα
  choice: దాదాపు మూడు గంటల విరామం
  rationale: διάστημα కాలవ్యవధిని సూచిస్తుంది; ὡς కొలతతో వచ్చి సుమారు అనే భావాన్ని ఇస్తుంది. అందువల్ల ఖచ్చితంగా మూడు గంటలు అని కాకుండా దాదాపు మూడు గంటలు అని అనువదించబడింది.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: అతని భార్య
  rationale: సందర్భంలో γυνή అననీయ భార్యను సూచిస్తుంది; సాధారణంగా స్త్రీ అని కాదు.
- source_word: μὴ εἰδυῖα τὸ γεγονὸς
  choice: జరిగినది తెలియక
  rationale: μὴ εἰδυῖα ఆమె లోపలికి వచ్చినప్పుడు ఉన్న అజ్ఞానస్థితిని తెలియజేస్తుంది; τὸ γεγονὸς అప్పటికే సంభవించిన విషయాన్ని సూచిస్తుంది. సంక్షిప్తమైన ఈ తెలుగు రూపం రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰσῆλθεν
  choice: లోపలికి వచ్చింది
  rationale: కథన దృష్టికోణానికి అనుగుణంగా ప్రవేశించడాన్ని సహజ ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, కథన గాంభీర్యాన్ని నిలుపుతూ అనువదించబడింది. మూలంలోని సుమారు కాలవ్యవధి భావం కాపాడబడింది.
