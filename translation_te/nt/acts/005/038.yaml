id: ACT.5.38
reference: Acts 5:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν λέγω ὑμῖν, ἀπόστητε ἀπὸ τῶν ἀνθρώπων τούτων καὶ ⸀ἄφετε αὐτούς· (ὅτι ἐὰν ᾖ ἐξ ἀνθρώπων ἡ βουλὴ ⸀αὕτη ἢ τὸ ἔργον τοῦτο, καταλυθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/038.yaml
  text: And now I tell you[a], keep away from these men and leave them alone; for if this plan or this work is from men, it will be overthrown[b],
translation:
  language: te
  text: 'ఇప్పుడు నేను మీతో చెప్పేది ఇదే: ఈ మనుషులకు దూరంగా ఉండి, వారిని వారి మానాన వదిలేయండి. ఎందుకంటే, ఈ పథకంగానీ ఈ కార్యంగానీ మనుషుల నుండి వచ్చినదైతే[a], అది కూలిపోతుంది[b];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మానవ మూలమైనదైతే.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నాశనమవుతుంది” లేదా “వ్యర్థమైపోతుంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: ఇప్పుడు
  rationale: ప్రస్తుత సందర్భంలో గమలీయేలు ఇస్తున్న సలహాను పరిచయం చేసే సహజమైన తెలుగు కాలసూచక పదం.
- source_word: ἀπόστητε
  choice: దూరంగా ఉండి
  rationale: వారి విషయంలో జోక్యం చేసుకోకుండా వేరుగా ఉండాలనే ఆజ్ఞ యొక్క ఆచరణాత్మక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἄφετε αὐτούς
  choice: వారిని వారి మానాన వదిలేయండి
  rationale: వారిని అడ్డుకోవడం లేదా వారిపై చర్య కొనసాగించడం మానేయాలనే సందర్భోచిత భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐὰν ᾖ ἐξ ἀνθρώπων
  choice: మనుషుల నుండి వచ్చినదైతే
  rationale: తదుపరి వచనంలోని దేవుని నుండి అనే వ్యత్యాసాన్ని కాపాడుతూ, మూలం లేదా ఉద్భవాన్ని సూచించే ἐξ భావాన్ని నిలుపుతుంది.
- source_word: βουλή
  choice: పథకం
  rationale: ఉద్దేశం, యోచన అనే అర్థవ్యాప్తిలో ఈ సందర్భానికి స్పష్టమైన, సహజమైన పదం.
- source_word: ἔργον
  choice: కార్యం
  rationale: చేపట్టిన పని లేదా కార్యాచరణ అనే విస్తృత భావాన్ని గౌరవప్రదమైన సాధారణ తెలుగులో నిలుపుతుంది.
- source_word: καταλυθήσεται
  choice: కూలిపోతుంది
  rationale: ఆ ఉద్యమం నిలవకుండా విచ్ఛిన్నమవుతుందనే భవిష్యత్ నిష్క్రియార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἐξ ἀνθρώπων సూచించే మూలం
  choice: మనుషుల నుండి వచ్చినదైతే
  alternative: మానవ మూలమైనదైతే
  rationale: ఇది కేవలం పురుషులను మాత్రమే కాక మానవ మూలాన్ని సూచించగలదు; అదే సమయంలో తదుపరి వచనంలోని దైవిక మూలంతో ఉన్న ఉద్దేశపూర్వక వ్యత్యాసాన్ని కాపాడుతుంది.
- issue: καταλυθήσεται యొక్క ఫలిత భావం
  choice: కూలిపోతుంది
  alternative: నాశనమవుతుంది / వ్యర్థమైపోతుంది
  rationale: మానవ మూలమైన ఉద్యమం చివరకు విచ్ఛిన్నమవుతుందనే భావాన్ని, దాన్ని ఎవరు కూలదోస్తారో అనవసరంగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివరలో అర్ధవిరామం ఉంచబడింది. సంప్రదింపు ఆంగ్ల పాఠంలోని [a] గుర్తు భావానికి సరిపోని స్థానంలో ఉన్నందున, దాని గమనిక సూచించే ἐξ ἀνθρώπων పదబంధం వద్ద ఉంచబడింది.
