base_translation:
  language: en
  yaml_path: translation/nt/acts/005/001.yaml
  text: But a man named Ananias[a], with Sapphira his wife, sold a piece of property.
translation:
  language: te
  text: అయితే అననీయ అనే ఒక మనిషి తన భార్య సప్పీరాతో కలిసి ఒక ఆస్తిని[a] అమ్మాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్థిరాస్తిని”; గ్రీకు పదం విస్తృతంగా సొత్తును లేదా స్థిరాస్తి భాగాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ ... τις
  choice: ఒక వ్యక్తి
  rationale: కథనంలో ఒక వ్యక్తిని పరిచయం చేసే అనిర్దిష్ట పదబంధం. ఆధునిక తెలుగులో ‘ఒక వ్యక్తి’ సహజంగా ఉంటుంది; భార్య ప్రస్తావన వల్ల అతడు పురుషుడని సందర్భమే స్పష్టం చేస్తుంది.
- source_word: δέ
  choice: అయితే
  rationale: ముందటి బర్నబా ఉదాహరణకు దీనికి మధ్య ఉన్న స్వల్ప కథన వ్యత్యాసాన్ని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: Ἁνανίας ὀνόματι
  choice: అననీయ అనే
  rationale: ὀνόματι అనే ప్రయోగం ‘పేరుగల/అనే’ అని అర్థం; ఆధునిక తెలుగులో వ్యక్తిని పరిచయం చేయడానికి ‘అనే’ సహజం.
- source_word: σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ
  choice: తన భార్య సప్పీరాతో కలిసి
  rationale: σύν సహవాసాన్ని సూచిస్తుంది; γυνή ఇక్కడ స్వామ్యసూచక నిర్మాణంలో స్పష్టంగా ‘భార్య’ అనే అర్థం ఇస్తుంది.
- source_word: ἐπώλησεν
  choice: అమ్మాడు
  rationale: πωλέω యొక్క భూతకాల కథనార్థాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: κτῆμα
  choice: ఒక ఆస్తిని
  rationale: ఈ పదం సాధారణంగా స్వాస్థ్యం లేదా స్థిరాస్తి భాగాన్ని సూచించగలదు. ‘ఆస్తి’ మూలంలోని విస్తృత అర్థాన్ని కాపాడుతూ తెలుగులో సహజంగా ఉంటుంది.
theological_decisions:
- issue: ముందటి బర్నబా కథనంతో వ్యత్యాసం
  choice: δέను ‘అయితే’గా అనువదించడం
  alternative: ‘ఇక’ లేదా ‘మరి’ అని మృదువైన కథన మార్పుగా అనువదించడం
  rationale: δέకు గల స్వల్ప వ్యత్యాస భావాన్ని నిలుపుతూ, తరువాతి మోసాన్ని ఈ వాక్యంలోనే అతిగా వివరించకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కథన గాంభీర్యాన్ని నిలుపుతూ రూపొందించబడింది. వ్యక్తినామాలు తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడ్డాయి.
