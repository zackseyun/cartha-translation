id: ACT.5.4
reference: Acts 5:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐχὶ μένον σοὶ ἔμενεν καὶ πραθὲν ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν; τί ὅτι ἔθου ἐν τῇ καρδίᾳ σου τὸ πρᾶγμα τοῦτο; οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/004.yaml
  text: While it remained unsold[a], did it not remain yours? And after it was sold[b], was it not under your authority? Why is it that you have set this matter in your heart? You have not lied to men but to God.
translation:
  language: te
  text: అది అమ్మకానికి ముందు నీదిగానే ఉండలేదా? అమ్మిన తరువాత కూడా అది నీ అధికారంలోనే ఉండలేదా?[a] ఈ పని చేయాలని నీ హృదయంలో ఎందుకు నిర్ణయించుకున్నావు? నీవు అబద్ధమాడింది మనుషులకు కాదు, దేవునికే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ ఇష్టప్రకారం వాడుకునే హక్కు నీకే ఉండలేదా?”
    reason: ἐν τῇ σῇ ἐξουσίᾳ అనే పదబంధం అధికారం, హక్కు లేదా స్వేచ్ఛాయుత నియంత్రణను సూచించగలదనే భావాంతరాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: μένον σοὶ ἔμενεν
  choice: అది అమ్మకముందు నీదిగానే ఉండలేదా?
  rationale: గ్రీకులోని μένω పదపునరుక్తి ఆ ఆస్తి అమ్మకానికి ముందు అననీయా సొంతంగానే కొనసాగిందని నొక్కిచెబుతుంది. తెలుగులో సహజంగా ఉండేందుకు కాలసూచనను స్పష్టంగా వ్యక్తం చేశాం.
- source_word: πραθὲν
  choice: అమ్మిన తరువాత
  rationale: అయోరిస్ట్ కర్మణి కృదంతం ఆస్తి అమ్మబడిన తరువాతి స్థితిని సూచిస్తుంది; తెలుగులో ‘అమ్మిన తరువాత’ సహజమైన నిర్మాణం.
- source_word: ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν
  choice: వచ్చిన సొమ్ము నీ అధీనంలోనే ఉండలేదా?
  rationale: ἐξουσία ఇక్కడ హక్కు, నిర్ణయాధికారం, స్వేచ్ఛాయుత నియంత్రణ అనే భావాన్ని ఇస్తుంది. సందర్భానుసారం అమ్మిన తరువాత తన అధీనంలో ఉన్నది అమ్మకపు సొమ్ము; ‘అధీనంలో’ ఆ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: τί ὅτι
  choice: ఎందుకు
  rationale: ఈ గ్రీకు ప్రయోగం గద్దింపుతో కూడిన ప్రశ్నను పరిచయం చేస్తుంది. తెలుగు వాక్య నిర్మాణంలో ‘ఎందుకు నిర్ణయించుకున్నావు?’ దాని బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἔθου ἐν τῇ καρδίᾳ σου
  choice: నీ హృదయంలో ... నిర్ణయించుకున్నావు
  rationale: పదబంధం అంతరంగ సంకల్పాన్ని సూచిస్తుంది. ‘హృదయంలో’ అనే మూల రూపకాన్ని కాపాడుతూ, ‘నిర్ణయించుకున్నావు’ దాని ఉద్దేశపూర్వక భావాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: τὸ πρᾶγμα τοῦτο
  choice: ఈ పని
  rationale: πρᾶγμα అనే విస్తృత పదం విషయం, పని లేదా కార్యాన్ని సూచించగలదు. ఈ సందర్భంలో ‘ఈ పని’ సహజంగా ఉండి, అదనపు నైతిక వివరణను చేర్చదు.
- source_word: οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ
  choice: నీవు అబద్ధమాడింది మనుషులకు కాదు, దేవునికే
  rationale: ψεύδομαι దత్తి విభక్తితో ‘ఎవరికైనా అబద్ధమాడు’ అనే భావం ఇస్తుంది. ἀνθρώποις‌ను లింగసమగ్రంగా ‘మనుషులకు’ అని, విరోధాన్ని బలపరచేందుకు τῷ θεῷను ‘దేవునికే’ అని అనువదించాం.
theological_decisions:
- issue: 5:3లో పరిశుద్ధాత్మకు అబద్ధమాడటం, 5:4లో దేవునికి అబద్ధమాడటం మధ్య సంబంధం
  choice: ఈ వచనం చెప్పినట్లే ‘దేవునికే’ అని నేరుగా అనువదించడం
  alternative: ‘దేవునికి, అంటే పరిశుద్ధాత్మకు’ అని వివరణను ప్రధాన పాఠ్యంలో చేర్చడం
  rationale: మూలవచనం ఇక్కడ τῷ θεῷ మాత్రమే అంటుంది. మునుపటి వచనంతో ఉన్న దైవశాస్త్రీయ సంబంధాన్ని పాఠకుడు సందర్భం ద్వారా గ్రహించనివ్వడం, అనువాదంలో వివరణను కలపకపోవడం సముచితం.
- issue: ఆస్తి మరియు అమ్మకపు సొమ్ముపై అననీయాకు ఉన్న స్వేచ్ఛ
  choice: ఆస్తి అతనిదేనని, అమ్మిన తరువాత సొమ్ము అతని అధీనంలోనే ఉందని స్పష్టంగా చూపడం
  alternative: కేవలం అతని దగ్గర ఉందని మాత్రమే బలహీనంగా వ్యక్తం చేయడం
  rationale: పేతురు వాదన ప్రకారం పాపం ఆస్తినంతా ఇవ్వకపోవడం కాదు, మోసం చేయడం. ‘నీ అధీనంలోనే’ అతని నిజమైన నిర్ణయాధికారాన్ని తెలియజేస్తుంది.
- issue: ἀνθρώποις యొక్క లింగవ్యాప్త అర్థం
  choice: మనుషులకు
  alternative: పురుషులకు
  rationale: ఇక్కడ ἀνθρώποις మగవారిని మాత్రమే కాక సాధారణంగా మానవులను సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘మనుషులకు’ మూలార్థాన్ని ఖచ్చితంగా, సహజంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘నీదిగానే,’ ‘నీ అధీనంలోనే,’ ‘దేవునికే’ అనే నొక్కులు గ్రీకు ప్రశ్నల మరియు చివరి విరోధ వాక్యపు బలాన్ని నిలుపుతాయి. ప్రధాన పాఠ్యంలోని [a] సూచిక సంబంధిత వాక్యం చివర ఉంచబడింది.
