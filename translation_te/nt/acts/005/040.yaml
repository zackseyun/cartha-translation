id: ACT.5.40
reference: Acts 5:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενοι τοὺς ἀποστόλους δείραντες παρήγγειλαν μὴ λαλεῖν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ καὶ ⸀ἀπέλυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/040.yaml
  text: And after summoning the apostles[a], they beat them, ordered them not to speak in the name of Jesus, and released them.
translation:
  language: te
  text: వారు అపొస్తలులను పిలిపించి, వారిని కొట్టి, యేసు నామంలో[a] మాట్లాడవద్దని ఆజ్ఞాపించి, వారిని విడుదల చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యేసు నామాన్ని గురించి,” లేదా “యేసు నామం ఆధారంగా.” ఈ గ్రీకు నుడికారం యేసును గురించి మాట్లాడడం, ఆయన అధికారంతో మాట్లాడడం అనే భావాలను కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: పిలిపించి
  rationale: అపొస్తలులను తమ ఎదుటికి పిలిపించిన ముందరి చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τοὺς ἀποστόλους
  choice: అపొస్తలులను
  rationale: అపొస్తలులు అనేది అపొస్తలుల కార్యముల సందర్భంలో స్థిరపడిన, నిర్దిష్టమైన పదం.
- source_word: δείραντες
  choice: వారిని కొట్టించి
  rationale: δείρω అంటే కొట్టడం లేదా దెబ్బలు కొట్టడం; నిర్దిష్టమైన న్యాయపరమైన కొరడా శిక్ష అని మూలపదం తప్పనిసరిగా చెప్పదు. సభవారు ఇతరుల చేత ఈ చర్య చేయించి ఉండవచ్చనే సందర్భానుకూల భావాన్ని తెలుగు ప్రయోజక రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παρήγγειλαν
  choice: ఆజ్ఞాపించి
  rationale: నిషేధాన్ని అధికారపూర్వకంగా విధించిన బలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: μὴ λαλεῖν
  choice: మాట్లాడవద్దని
  rationale: μή సహిత క్రియార్థక రూపం వ్యక్తం చేసే నిషేధ విషయాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: యేసు నామంలో
  rationale: యేసును గురించి మాట్లాడడం, ఆయన అధికారంపై ఆధారపడి మాట్లాడడం అనే రెండింటినీ కలిగి ఉండగల గ్రీకు నుడికారపు విస్తృతిని సుపరిచితమైన బైబిలు నుడికారంతో నిలుపుతుంది.
- source_word: ἀπέλυσαν
  choice: వారిని విడుదల చేశారు
  rationale: నిర్బంధం లేదా అదుపు నుంచి విడిచిపెట్టారనే న్యాయపరమైన సందర్భానికి తగిన స్పష్టమైన పదబంధం.
theological_decisions:
- issue: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ అనే నుడికారం
  choice: యేసు నామంలో
  alternative: యేసు నామాన్ని గురించి; యేసు నామం ఆధారంగా
  rationale: ఈ పదబంధం యేసును గురించిన సాక్ష్యాన్నీ, ఆయన అధికారంతో మాట్లాడడాన్నీ సూచించగలదు. ప్రధాన పాఠం ఆ భావవిస్తృతిని సంకుచితం చేయకుండా ఉంచి, ప్రత్యామ్నాయ ఛాయలను పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. వరుసగా జరిగిన చర్యలను తెలుగు సంయుక్త క్రియారూపాలతో సహజంగా అనుసంధానించాం; మూలంలోని నామం అనే ధార్మిక నుడికారాన్ని నిలిపి దాని భావవిస్తృతిని పాదసూచికలో వివరించాం.
