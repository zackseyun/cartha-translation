review_pass:
  verdict: revise
  source_fidelity: ‘కొట్టించి’ is a causative form (‘had them beaten’) and can imply that the council arranged for others to beat the apostles. The Greek active participle δείραντες directly attributes the beating to the subject of the sentence. ‘వారిని కొట్టి’ preserves the Greek construction without specifying the instrument or manner of punishment.
  naturalness: 'The revised sequence of conjunctive participles is clear, natural modern standard Telugu, and maintains the source’s action order: summoning, beating, ordering, and releasing.'
  terminology: ‘అపొస్తలులు,’ ‘ఆజ్ఞాపించి,’ ‘యేసు నామంలో,’ and ‘విడుదల చేశారు’ are suitable in this formal biblical register. The footnote retains the semantic range of ἐπὶ τῷ ὀνόματι while avoiding resolution of its ambiguity.
  issues:
  - severity: medium
    issue: ‘వారిని కొట్టించి’ is causative.
    rationale: This wording may mean that they caused someone else to beat the apostles, whereas δείραντες is an active participle with the governing subject as agent. ‘వారిని కొట్టి’ is source-closer and does not introduce causation by another party.
  revised_text: వారు అపొస్తలులను పిలిపించి, వారిని కొట్టి, యేసు నామంలో[a] మాట్లాడవద్దని ఆజ్ఞాపించి, వారిని విడుదల చేశారు.
