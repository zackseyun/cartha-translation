id: ACT.5.5
reference: Acts 5:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀκούων δὲ ὁ Ἁνανίας τοὺς λόγους τούτους πεσὼν ἐξέψυξεν· καὶ ἐγένετο φόβος μέγας ἐπὶ πάντας τοὺς ⸀ἀκούοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/005.yaml
  text: But when Ananias heard these words[a], he fell down and died. And great fear came upon all who heard.
translation:
  language: te
  text: అయితే అననీయ ఈ మాటలు విని పడిపోయి మరణించాడు.[a] విన్న వారందరి మీద గొప్ప భయం కలిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “ప్రాణం విడిచాడు” లేదా “చివరి శ్వాస విడిచాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούων
  choice: వినగానే
  rationale: వర్తమాన కాల కృదంతం ఇక్కడ కాలసంబంధ భావాన్ని సూచిస్తుంది; పేతురు మాటలు వినడంతో వెంటనే జరిగిన పరిణామాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: కథనంలో స్వల్ప వ్యతిరేకతతో కూడిన మలుపును సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంది.
- source_word: ὁ Ἁνανίας
  choice: అననీయ
  rationale: వ్యక్తి పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: τοὺς λόγους τούτους
  choice: ఈ మాటలు
  rationale: ఈ సందర్భంలో λόγοι అనేది పేతురు పలికిన మాటలను సూచిస్తుంది; ‘ఈ మాటలు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: πεσὼν
  choice: కుప్పకూలి
  rationale: నేలపై పడిపోవడాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; మరణానికి ముందు జరిగిన శారీరక చర్యను నిలుపుతుంది.
- source_word: ἐξέψυξεν
  choice: ప్రాణం విడిచాడు
  rationale: ఈ క్రియలోని ‘చివరి శ్వాస విడిచాడు/మరణించాడు’ అనే భావాన్ని స్పష్టంగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
- source_word: ἐγένετο φόβος μέγας
  choice: ఎంతో భయం కలిగింది
  rationale: భయం వారిని ఆవరించిన భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: ἐπὶ πάντας τοὺς ἀκούοντας
  choice: ఇది విన్న వారందరికీ
  rationale: కృదంతాన్ని నామవాచకార్థంగా గ్రహించి, వారు విన్న విషయాన్ని సందర్భానుసారంగా ‘ఇది’ అని సూచిస్తుంది; గ్రీకు పాఠం ఏ విధంగా విన్నారో మరింత నిర్దిష్టం చేయదు.
theological_decisions:
- issue: అననీయ మరణ స్వభావం
  choice: అతడు వెంటనే కుప్పకూలి ప్రాణం విడిచాడని మాత్రమే పేర్కొనడం
  alternative: దేవుడు నేరుగా అతణ్ణి చంపాడని లేదా దిగ్భ్రాంతితో సహజంగా మరణించాడని వివరించడం
  rationale: గ్రీకు పాఠం అతడు పడిపోయి మరణించాడని చెబుతుంది గాని, మరణానికి కారణమైన విధానాన్ని స్పష్టంగా చెప్పదు. కాబట్టి ఆ వేదాంతపరమైన ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. కథనంలోని అకస్మాత్తు పరిణామాన్ని ‘వినగానే’ ద్వారా, తీవ్రతను ‘కుప్పకూలి ప్రాణం విడిచాడు’ ద్వారా నిలిపాం.
