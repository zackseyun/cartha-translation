    text: లేదా, మరింత అక్షరార్థంగా, “ప్రాణం విడిచాడు” లేదా “చివరి శ్వాస విడిచాడు.”
    reason: lexical_alternative
  revision_rationale: 'The revision follows the Greek wording more closely: πεσών is rendered directly as “పడిపోయి,” ἐξέψυξεν as the clear modern “మరణించాడు,” and the final participle remains unspecified as “విన్న వారు,” without adding “ఇది.” It retains the narrative''s ambiguity about the cause of death and preserves the lexical nuance in the footnote.'
