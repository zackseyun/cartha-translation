id: ACT.5.42
reference: Acts 5:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πᾶσάν τε ἡμέραν ἐν τῷ ἱερῷ καὶ κατ’ οἶκον οὐκ ἐπαύοντο διδάσκοντες καὶ εὐαγγελιζόμενοι ⸂τὸν χριστὸν Ἰησοῦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/042.yaml
  text: And every day[a], in the temple and from house to house, they did not stop teaching and proclaiming the good news that Jesus is the Messiah.
translation:
  language: te
  text: వారు ప్రతిరోజూ దేవాలయంలోనూ ఇంటింటా బోధిస్తూ, యేసే మెస్సీయ అని సువార్త ప్రకటిస్తూ[a] ఉండడం మానలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత అక్షరార్థంగా, “మెస్సీయ అయిన యేసును గురించి సువార్త ప్రకటిస్తూ”; లేదా “యేసును మెస్సీయగా ప్రకటిస్తూ.”
    reason: τὸν χριστὸν Ἰησοῦν అనే అక్యూసేటివ్ పదబంధాన్ని ప్రకటనలోని విషయంగా గానీ, ప్రకటించబడే వ్యక్తిని సూచించే కర్మగా గానీ తెలుగులో వ్యక్తపరచవచ్చు.
lexical_decisions:
- source_word: πᾶσάν τε ἡμέραν
  choice: ప్రతిరోజూ
  rationale: కాలవ్యాప్తిని సూచించే ఈ ప్రయోగం నిరంతరంగా, అలవాటుగా జరిగిన కార్యాన్ని తెలియజేస్తుంది; ‘ప్రతిరోజూ’ సహజమైన ఆధునిక తెలుగు.
- source_word: ἐν τῷ ἱερῷ
  choice: దేవాలయంలోనూ
  rationale: ἱερόν ఇక్కడ పరిశుద్ధస్థల భవనాన్ని మాత్రమే కాక దేవాలయ ప్రాంగణ సముదాయాన్ని సూచిస్తుంది. సందర్భంలో ‘దేవాలయంలో’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: κατ’ οἶκον
  choice: ఇంటింటా
  rationale: κατά తో ఏకవచన οἶκον కలయికకు విభజనాత్మక భావం ఉంది; ‘ఇంటింటా’ వ్యక్తిగత గృహాల్లో జరిగిన కార్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὐκ ἐπαύοντο
  choice: ఉండడం మానలేదు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న కార్యాన్ని ఆపకపోవడాన్ని సూచిస్తుంది; రెండు వర్తమాన కృదంతాలతో కలిపి ఈ తెలుగు నిర్మాణం సహజంగా ఉంటుంది.
- source_word: διδάσκοντες
  choice: బోధిస్తూ
  rationale: διδάσκω యొక్క సాధారణ అర్థమైన బోధించడాన్ని, కొనసాగుతున్న కార్యరూపంలో ఉంచుతుంది.
- source_word: εὐαγγελιζόμενοι
  choice: సువార్త ప్రకటిస్తూ
  rationale: మంచి వార్తను తెలియజేయడం లేదా ప్రకటించడం అనే క్రియార్థాన్ని, తెలుగు బైబిలు పరిచయంలోనూ సాధారణ వాడుకలోనూ అర్థమయ్యే విధంగా వ్యక్తపరుస్తుంది.
- source_word: τὸν χριστὸν Ἰησοῦν
  choice: యేసే మెస్సీయ అని
  rationale: Χριστός ఇక్కడ పేరుగా కాక అభిషిక్తుడనే బిరుదుగా పనిచేస్తుంది. ఈ అక్యూసేటివ్ పదబంధాన్ని ప్రకటనలోని విషయంగా సహజ తెలుగులో వ్యక్తపరుస్తూ, యేసు మెస్సీయ అనే ప్రధాన వాదనను స్పష్టం చేస్తుంది.
theological_decisions:
- issue: Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός యేసు పేరులో భాగంలా కాక ఆయన మెస్సీయ గుర్తింపును తెలిపే బిరుదుగా ఉంది; అందువల్ల బిరుదు అర్థాన్ని ప్రత్యక్షంగా అందించే ‘మెస్సీయ’ను ఎంచుకున్నాం.
- issue: εὐαγγελιζόμενοι తరువాత τὸν χριστὸν Ἰησοῦν యొక్క వాక్యనిర్మాణ సంబంధం
  choice: ప్రకటనలోని విషయం—‘యేసే మెస్సీయ అని’
  alternative: కర్మ పదబంధం—‘మెస్సీయ అయిన యేసును గురించి సువార్త ప్రకటిస్తూ’ లేదా ‘యేసును మెస్సీయగా ప్రకటిస్తూ’
  rationale: గ్రీకు అక్యూసేటివ్ పదబంధం నేరుగా ప్రకటించబడే వ్యక్తిని లేదా ప్రకటనలోని విషయాన్ని సూచించగలదు. ప్రధాన పాఠంలో సహజమైన తెలుగు కోసం విషయార్థాన్ని ఇచ్చి, ఇతర సాధ్యమైన నిర్మాణాలను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘దేవాలయంలోనూ ఇంటింటా’ అనే జత నిర్మాణం గ్రీకు καί సమన్వయాన్ని సహజంగా నిలుపుతుంది. ‘బోధిస్తూ … ప్రకటిస్తూ’ అనే సమాంతర రూపాలు రెండు కొనసాగుతున్న కార్యాలను పరిరక్షిస్తాయి.
