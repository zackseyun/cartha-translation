  source_fidelity: ‘అంతకంతకూ’ appropriately conveys μᾶλλον’s intensified increase in this context. ‘ప్రభువును నమ్మినవారు’ accurately renders πιστεύοντες τῷ κυρίῳ, and ‘చేర్చబడుతూ వచ్చారు’ preserves the imperfective, passive-capable sense of προσετίθεντο without supplying an explicit agent. ‘పురుషులూ స్త్రీలూ పెద్ద సంఖ్యలో’ represents πλήθη ἀνδρῶν τε καὶ γυναικῶν and retains the inclusion of both groups.
