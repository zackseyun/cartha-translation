id: ACT.5.14
reference: Acts 5:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μᾶλλον δὲ προσετίθεντο πιστεύοντες τῷ κυρίῳ πλήθη ἀνδρῶν τε καὶ γυναικῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/014.yaml
  text: And even more believers in the Lord were being added—multitudes of both men and women[a].
translation:
  language: te
  text: అంతకంతకూ ప్రభువును నమ్మినవారు—పురుషులూ స్త్రీలూ పెద్ద సంఖ్యలో—చేర్చబడుతూ వచ్చారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చేరుతూ వచ్చారు” లేదా “చేర్చబడ్డారు.” గ్రీకు క్రియ సంఖ్య నిరంతరం పెరుగుతున్నదాన్ని సూచిస్తుంది. దాని కర్మణి రూపం వారిని దేవుడే చేర్చుతున్నాడనే భావాన్ని సూచించవచ్చు, కానీ కర్తను స్పష్టంగా పేర్కొనదు.
    reason: క్రియలోని కొనసాగుతున్న చర్య, కర్మణి భావం, సాధ్యమైన మధ్యమ/అకర్మక అర్థం అనే పదార్థ ప్రత్యామ్నాయాలను తెలియజేయడం.
lexical_decisions:
- source_word: μᾶλλον δὲ
  choice: అంతకంతకూ
  rationale: సంఖ్య నిరంతరం మరింత పెరుగుతున్న భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; δέ ఇక్కడ బలమైన వ్యతిరేకతను కాక కథన కొనసాగింపును సూచిస్తుంది.
- source_word: προσετίθεντο
  choice: చేర్చబడుతూ వచ్చారు
  rationale: అసంపూర్ణ కాలంలోని కొనసాగుతున్న చర్యను, అలాగే గ్రీకులోని నిష్క్రియార్థాన్ని నిలుపుతుంది. ఎవరు చేర్చారో మూలపాఠం స్పష్టంగా చెప్పనందున అనువాదమూ దానిని స్పష్టీకరించదు.
- source_word: πιστεύοντες τῷ κυρίῳ
  choice: ప్రభువును నమ్మినవారు
  rationale: కృదంతాన్ని వ్యక్తులను సూచించే నామవాచక భావంలో అందిస్తూ, వారి విశ్వాసం ప్రభువుపై కేంద్రీకృతమై ఉందని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τῷ κυρίῳ
  choice: ప్రభువును
  rationale: ఇక్కడ κύριοςకు గౌరవపూర్వకమైన, క్రీస్తుసంబంధమైన బలాన్ని నిలిపే సాధారణ తెలుగు పదం ‘ప్రభువు’; విశ్వాసానికి లక్ష్యంగా ఉన్నందున ‘ప్రభువును నమ్మినవారు’ అని అనువదించబడింది.
- source_word: πλήθη ἀνδρῶν τε καὶ γυναικῶν
  choice: పురుషులూ స్త్రీలూ పెద్ద సంఖ్యలో
  rationale: πλήθη సూచించే విస్తారమైన సంఖ్యను, τε καί సూచించే ‘పురుషులూ స్త్రీలూ’ అనే సమన్వయాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘ప్రభువు’ అనే బిరుదు ఎవరిని సూచిస్తుంది
  choice: మూలపాఠంలోని ‘ప్రభువు’ అనే బిరుదునే నిలిపి, ఆయనను విశ్వసించడాన్ని వ్యక్తం చేయడం
  alternative: ప్రధాన పాఠంలోనే ‘యేసు ప్రభువు’ అని స్పష్టీకరించడం
  rationale: అపొస్తలుల కార్యముల సందర్భంలో ఇది సాధారణంగా లేచిన యేసును సూచించినా, గ్రీకు పాఠం ఇక్కడ ‘యేసు’ అనే పేరును చేర్చదు. అందువల్ల బిరుదును విస్తరించకుండా దాని సందర్భార్థాన్ని నిలుపుతుంది.
- issue: προσετίθεντο యొక్క కర్తరి/కర్మణి భావం మరియు కొనసాగుతున్న చర్య
  choice: ‘చేర్చబడుతూ వచ్చారు’ అనే కొనసాగుతున్న కర్మణి రూపం
  alternative: ‘చేరుతూ వచ్చారు’ అనే మధ్యమ లేదా అకర్మక భావం
  rationale: కర్మణి రూపం ప్రజలు సంఘంలోకి చేర్చబడుతున్న భావాన్ని, చేర్చేవాడు దేవుడై ఉండవచ్చనే సూచనను నిలుపుతుంది; అయితే మూలపాఠం కర్తను చెప్పనందున దేవుణ్ణి ప్రధాన పాఠంలో ప్రత్యక్ష కర్తగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన వాక్య నిర్మాణం. ‘అంతకంతకూ’ కొనసాగుతున్న వృద్ధిని సహజంగా తెలుపుతుంది; డాష్‌ల మధ్యనున్న పదబంధం పురుషులు, స్త్రీలు ఇద్దరూ పెద్ద సంఖ్యలో ఉన్నారనే వివరణను స్పష్టంగా ఉంచుతుంది.
