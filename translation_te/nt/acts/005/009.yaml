id: ACT.5.9
reference: Acts 5:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Πέτρος πρὸς αὐτήν· Τί ὅτι συνεφωνήθη ὑμῖν πειράσαι τὸ πνεῦμα κυρίου; ἰδοὺ οἱ πόδες τῶν θαψάντων τὸν ἄνδρα σου ἐπὶ τῇ θύρᾳ καὶ ἐξοίσουσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/009.yaml
  text: But Peter said to her[a], “Why did you agree together to test the Spirit of the Lord? Look, the feet of those who buried your husband are at the door[b], and they will carry you out.”
translation:
  language: te
  text: 'కానీ పేతురు ఆమెతో ఇలా అన్నాడు: “ప్రభువు ఆత్మను పరీక్షించడానికి మీ ఇద్దరూ కలిసి ఎందుకు అంగీకరించారు? ఇదిగో, నీ భర్తను పాతిపెట్టినవారి పాదాలు తలుపు దగ్గర ఉన్నాయి; వారు నిన్ను బయటికి మోసుకెళ్తారు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί ὅτι
  choice: ఎందుకు
  rationale: ఈ గ్రీకు ప్రయోగం కారణాన్ని ప్రశ్నిస్తూ గద్దించే భావాన్ని వ్యక్తం చేస్తుంది; ఆధునిక తెలుగులో ‘ఎందుకు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: συνεφωνήθη ὑμῖν
  choice: మీరు కలిసి ఒక మాటకు వచ్చారు
  rationale: సమ్మతించడం లేదా పరస్పరం అంగీకారానికి రావడం అనే భావాన్ని, సందర్భంలోని కుమ్మక్కును అతిగా వ్యాఖ్యానించకుండా వ్యక్తం చేస్తుంది.
- source_word: πειράσαι
  choice: పరీక్షించడానికి
  rationale: πειράζωకు ‘శోధించు’ లేదా ‘పరీక్షించు’ అనే అర్థాలు ఉండవచ్చు; ప్రభువు ఆత్మను ఉద్దేశించిన ఈ సందర్భంలో ‘పరీక్షించు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: τὸ πνεῦμα κυρίου
  choice: ప్రభువు ఆత్మను
  rationale: గ్రీకు సంబంధవాచక నిర్మాణాన్ని సంక్షిప్తంగా నిలుపుతూ, ‘పరిశుద్ధాత్మ’ అని మూలంలో లేని పదాన్ని చేర్చకుండా సాధ్యమైన సూచనను కాపాడుతుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: వెంటనే గమనించమని శ్రద్ధను ఆకర్షించే మూలపదపు సంభాషణాత్మక బలాన్ని నిలుపుతుంది.
- source_word: οἱ πόδες
  choice: పాదాలు
  rationale: మూలంలోని స్పష్టమైన, భయానకమైన దృశ్యరూపాన్ని ‘అడుగుల చప్పుడు’ వంటి వ్యాఖ్యానాత్మక మార్పు లేకుండా నిలుపుతుంది.
- source_word: τῶν θαψάντων
  choice: పాతిపెట్టినవారి
  rationale: క్రియాత్మక విశేషణాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, గ్రీకులో స్పష్టంగా లేని ‘పురుషులు’ అనే పదాన్ని చేర్చదు.
- source_word: τὸν ἄνδρα σου
  choice: నీ భర్తను
  rationale: సప్పీరా మరియు అననీయల సందర్భంలో ἀνήρకు ‘భర్త’ అనే అర్థమే స్పష్టం.
- source_word: ἐπὶ τῇ θύρᾳ
  choice: తలుపు దగ్గరే
  rationale: వారు ప్రవేశద్వారం వద్ద అప్పటికే ఉన్నారనే తక్షణతను ‘దగ్గరే’ సహజంగా తెలియజేస్తుంది.
- source_word: ἐξοίσουσίν σε
  choice: వారు నిన్ను బయటికి మోసుకెళ్తారు
  rationale: ἐκφέρω యొక్క ‘బయటికి మోసుకెళ్లు’ అనే అర్థాన్ని నేరుగా ఉంచి, మూలంలో లేని ‘నీ మృతదేహాన్ని’ అనే వివరణను చేర్చదు.
theological_decisions:
- issue: ‘ప్రభువు ఆత్మ’ ఎవరిని సూచిస్తుంది
  choice: మూలంలోని ‘ప్రభువు ఆత్మ’ అనే రూపాన్నే ఉంచడం
  alternative: ‘పరిశుద్ధాత్మ’ అని స్పష్టీకరించడం
  rationale: అపొస్తలుల కార్యాలు 5:3తో సంబంధంలో ఇది పరిశుద్ధాత్మను బలంగా సూచిస్తుంది; అయినా గ్రీకు వాక్యంలో ఉన్న సంబంధ నిర్మాణాన్ని అనువాదం నిలుపుతుంది, వ్యాఖ్యానాత్మక విస్తరణ చేయదు.
- issue: పేతురు చేసిన ఆరోపణలో συμφωνέω యొక్క బలం
  choice: కలిసి ఒక మాటకు వచ్చారు
  alternative: కుమ్మక్కయ్యారు
  rationale: సందర్భం తీవ్రమైన కుట్రభావాన్ని కలిగించినా, క్రియ ప్రధానంగా పరస్పర అంగీకారాన్ని సూచిస్తుంది. కాబట్టి నైతిక తీవ్రతను సందర్భానికే వదలి, పదంలో అదనపు తీర్పును చొప్పించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. పేతురు సప్పీరాతో నేరుగా మాట్లాడుతున్నందున ఏకవచన ‘నీ/నిన్ను’ రూపాలు ఉంచబడ్డాయి; συμφωνήθη ὑμῖνలోని బహువచన భావాన్ని ‘మీరు కలిసి’ తెలియజేస్తుంది. ‘పాదాలు’ అనే మూలంలోని స్పష్టమైన రూపకం ఉద్దేశపూర్వకంగా నిలుపబడింది.
