revisions:
- from: 'అప్పుడు పేతురు ఆమెతో ఇలా అన్నాడు: “ప్రభువు ఆత్మను[a] పరీక్షించడానికి మీరు కలిసి ఒక మాటకు[b] ఎందుకు వచ్చారు? ఇదిగో, నీ భర్తను పాతిపెట్టినవారి పాదాలు తలుపు దగ్గరే ఉన్నాయి; వారు నిన్ను బయటికి మోసుకెళ్తారు.”'
  to: 'కానీ పేతురు ఆమెతో ఇలా అన్నాడు: “ప్రభువు ఆత్మను పరీక్షించడానికి మీ ఇద్దరూ కలిసి ఎందుకు అంగీకరించారు? ఇదిగో, నీ భర్తను పాతిపెట్టినవారి పాదాలు తలుపు దగ్గర ఉన్నాయి; వారు నిన్ను బయటికి మోసుకెళ్తారు.”'
  rationale: The revision replaces temporally specific ‘అప్పుడు’ with connective ‘కానీ,’ makes the joint subject of συνεφωνήθη ὑμῖν explicit as ‘మీ ఇద్దరూ,’ and removes the redundant note on ‘ప్రభువు ఆత్మ.’ The direct singular address to Sapphira in ‘నీ భర్తను’ and ‘నిన్ను’ is retained, as in the Greek.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:54:19Z'
review_pass:
  verdict: revise
  source_fidelity: The verse is substantially faithful to the Greek. However, the opening δέ is better represented by ‘కానీ’ than by temporal ‘అప్పుడు,’ and the second-person reference must remain plural throughout the question because ὑμῖν refers to Sapphira and her husband jointly.
  naturalness: The Telugu is clear and modern. ‘ఒక మాటకు వచ్చారు’ is natural, though ‘మీరిద్దరూ కలిసి అంగీకరించారు’ is more explicit and avoids a slight ambiguity about who is included. ‘తలుపు దగ్గరే’ is idiomatic.
  terminology: ‘ప్రభువు ఆత్మ’ appropriately preserves τὸ πνεῦμα κυρίου without interpretively expanding it to ‘పరిశుద్ధాత్మ.’ ‘పరీక్షించడానికి,’ ‘పాతిపెట్టినవారు,’ and ‘బయటికి మోసుకెళ్తారు’ are suitable. The proposed footnote a is not a meaningful lexical alternative in Telugu, since it merely restates the genitive relation already conveyed by ‘ప్రభువు ఆత్మ.’
  issues:
  - severity: medium
    issue: ‘అప్పుడు’ for δέ
    rationale: δέ here is connective/adversative (‘but/then’), not specifically temporal. ‘కానీ’ better reflects the discourse relation without adding a temporal sequence.
  - severity: medium
    issue: Singular ‘నీ భర్తను’ within a question addressed jointly to Sapphira and Ananias
    rationale: Although Telugu naturally uses ‘నీ భర్త,’ the Greek has plural ὑμῖν in the question. ‘మీ ఇద్దరూ కలిసి’ explicitly preserves the joint reference while retaining singular forms later where Peter addresses her personally.
  - severity: low
    issue: Footnote a is redundant
    rationale: ‘ప్రభువుకు చెందిన ఆత్మ’ does not offer a materially distinct translation from ‘ప్రభువు ఆత్మ’; it is a paraphrastic restatement rather than a useful alternative.
  revised_text: 'కానీ పేతురు ఆమెతో ఇలా అన్నాడు: “ప్రభువు ఆత్మను పరీక్షించడానికి మీ ఇద్దరూ కలిసి ఎందుకు అంగీకరించారు? ఇదిగో, నీ భర్తను పాతిపెట్టినవారి పాదాలు తలుపు దగ్గర ఉన్నాయి; వారు నిన్ను బయటికి మోసుకెళ్తారు.”'
  revised_footnotes:
  - marker: b
    text: లేదా, “కుమ్మక్కయ్యారు.”
    reason: సందర్భంలో పరస్పర అంగీకారానికి ఉన్న కుట్రభావాన్ని మరింత బలంగా వ్యక్తం చేసే ప్రత్యామ్నాయం.
  revision_rationale: The revision replaces temporally specific ‘అప్పుడు’ with connective ‘కానీ,’ makes the joint subject of συνεφωνήθη ὑμῖν explicit as ‘మీ ఇద్దరూ,’ and removes the redundant note on ‘ప్రభువు ఆత్మ.’ The direct singular address to Sapphira in ‘నీ భర్తను’ and ‘నిన్ను’ is retained, as in the Greek.
