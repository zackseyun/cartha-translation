source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Πέτρος καὶ οἱ ἀπόστολοι εἶπαν· Πειθαρχεῖν δεῖ θεῷ μᾶλλον ἢ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/029.yaml
  text: But Peter and the apostles answered[a], “We must obey God rather than men.”
translation:
  language: te
  text: 'అయితే పేతురు మరియు అపొస్తలులు జవాబిచ్చారు: “మనం మనుషులకంటే[a] దేవునికే లోబడాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజలకంటే.” గ్రీకులోని పదం సాధారణంగా మానవులను సూచిస్తుంది; ఇక్కడ దేవునికి విరుద్ధంగా మానవ అధికారులను సూచిస్తుంది.
    reason: ἀνθρώποις యొక్క సాధారణ మానవ సూచనను, సందర్భంలోని మానవ అధికారుల భావాన్ని కాపాడుతుంది.
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπαν
  choice: ఇలా జవాబిచ్చారు
  rationale: గ్రీకులోని కృదంతం-సమాపక క్రియ కలయిక కథనంలో ‘జవాబిచ్చి అన్నారు’ అనే భావాన్ని ఇస్తుంది. తెలుగులో అనవసర పునరుక్తి లేకుండా సహజంగా ‘ఇలా జవాబిచ్చారు’ అని అనువదించాం.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి అధికారుల మాటకు ప్రతిస్పందనగా వచ్చే స్వల్ప వ్యతిరేక మలుపును ‘అయితే’ సహజంగా తెలియజేస్తుంది.
- source_word: Πέτρος καὶ οἱ ἀπόστολοι
  choice: పేతురు, మిగతా అపొస్తలులు
  rationale: καί ఇక్కడ పేతురుతో పాటు అపొస్తలుల సమూహాన్ని సూచిస్తుంది; పేతురు కూడా ఆ సమూహంలో భాగమే కాబట్టి తెలుగులో అపార్థం రాకుండా ‘మిగతా’ను స్పష్టం చేశాం. ἀπόστολοιకి స్థిరపడిన బైబిలు పదం ‘అపొస్తలులు’ వాడాం.
- source_word: Πειθαρχεῖν
  choice: లోబడాలి
  rationale: అధికారంలో ఉన్నవారి ఆజ్ఞను పాటించడం అనే భావాన్ని సందర్భానుసారంగా ‘లోబడాలి’ స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δεῖ
  choice: మనం ... లోబడాలి
  rationale: δεῖ తెలిపే అవసరం లేదా నైతిక కర్తవ్యాన్ని ‘లోబడాలి’ వ్యక్తం చేస్తుంది; వక్తలు తమను తాము కలుపుకుంటున్నందున అంతర్లీన కర్తను ‘మనం’గా చూపాం.
- source_word: θεῷ μᾶλλον ἢ ἀνθρώποις
  choice: మనుషులకు కాక దేవునికే
  rationale: μᾶλλον ἢ యొక్క ప్రాధాన్య-వ్యతిరేక భావాన్ని తెలుగులో సహజమైన ‘కాక ... కే’ నిర్మాణంతో తెలిపాం. ἀνθρώποις దేవునికి విరుద్ధంగా మానవ అధికారులను సాధారణంగా సూచిస్తుంది; అందువల్ల ‘మనుషులు’ సరైన సమగ్ర పదం.
theological_decisions:
- issue: దేవునికి విధేయతను మానవ అధికారులకు విధేయతతో పోల్చడం
  choice: మనుషులకు కాక దేవునికే లోబడాలి
  alternative: మనుషులకంటే దేవునికే ఎక్కువగా లోబడాలి
  rationale: μᾶλλον ἢ సందర్భంలో కేవలం పరిమాణాత్మకంగా ‘ఎక్కువగా’ అనే పోలికకన్నా, విరుద్ధ ఆజ్ఞల మధ్య దేవునికే నిర్ణాయక ప్రాధాన్యం ఇవ్వాలనే భావం ఉంది. ‘కాక ... కే’ దానిని స్పష్టంగా ఉంచుతుంది; అయితే వాక్యాన్ని అన్ని మానవ అధికారాల సంపూర్ణ నిరాకరణగా విస్తరించదు.
- issue: ἀνθρώποις యొక్క సాధారణ మానవ సూచన
  choice: మనుషులకు
  alternative: మనుష్యులకు / ప్రజలకు
  rationale: ఈ బహువచనం లింగభేదం లేకుండా మానవులను, ఈ సందర్భంలో ప్రత్యేకంగా మానవ అధికారులను, దేవునితో వ్యత్యాసంగా సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘మనుషులకు’ సహజంగా ఉండి మూలంలోని వ్యత్యాసాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘పేతురు’, ‘అపొస్తలులు’ అనే స్థిరపడిన బైబిలు నామరూపాలు వాడబడ్డాయి. మూలంలో లేని పాదసూచిక అవసరం లేదని నిర్ణయించాం; ఇంగ్లీషు పాఠంలోని [a] గుర్తు దాని ‘answered’ పదానికి అమర్చబడినా, ఇచ్చిన పాదసూచిక విషయం నిజానికి ἀνθρώποις గురించినది కావడంతో దానిని యాంత్రికంగా అనుసరించలేదు.
