  source_fidelity: The Telugu accurately represents the emphatic demonstrative (τοῦτον), the paired titles ἀρχηγός and σωτήρ, God's exaltation of Jesus, the purpose clause, and the two gifts given to Israel. ‘తన కుడివైపునకు’ appropriately conveys the preferred enthronement/placement reading while the footnote preserves the viable instrumental reading.
