  terminology: ‘నాయకుడు,’ ‘రక్షకుడు,’ ‘పశ్చాత్తాపం,’ and ‘పాపక్షమాపణ’ are established, intelligible biblical-theological terms in modern Telugu. They communicate the Greek without imposing a narrower doctrinal interpretation.
