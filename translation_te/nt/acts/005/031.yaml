id: ACT.5.31
reference: Acts 5:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτον ὁ θεὸς ἀρχηγὸν καὶ σωτῆρα ὕψωσεν τῇ δεξιᾷ αὐτοῦ, ⸀τοῦ δοῦναι μετάνοιαν τῷ Ἰσραὴλ καὶ ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/031.yaml
  text: God exalted this one to his right hand as Leader and Savior[a], to give repentance to Israel and forgiveness of sins.
translation:
  language: te
  text: దేవుడు ఈయనను నాయకునిగాను రక్షకునిగాను తన కుడివైపునకు హెచ్చించాడు[a]—ఇశ్రాయేలుకు పశ్చాత్తాపాన్ని, పాపక్షమాపణను అనుగ్రహించడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన కుడిచేతి ద్వారా హెచ్చించాడు.” గ్రీకు పదబంధం సాధనార్థకంగా కూడా అర్థం కావచ్చు; అయితే ఇక్కడ దేవుని కుడివైపున ఉన్న అత్యున్నత గౌరవస్థానానికి హెచ్చించడమే ఎక్కువగా ఉద్దేశించినట్లు కనిపిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτον
  choice: ఈయనను
  rationale: బలమైన సూచనార్థక సర్వనామం యేసునే ప్రత్యేకంగా సూచిస్తోంది; ఆధునిక గౌరవప్రదమైన తెలుగులో ‘ఈయనను’ ఆ బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἀρχηγὸν
  choice: నాయకునిగా
  rationale: ఈ పదం ముందుండి నడిపించేవాడు లేదా అధిపతిగా ఉండేవాడు అనే విస్తృత భావాన్ని కలిగిస్తుంది; ‘రక్షకుడు’తో జతగా ఉన్న ఈ సందర్భంలో ‘నాయకుడు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: σωτῆρα
  choice: రక్షకునిగా
  rationale: σωτήρ యొక్క రక్షణాత్మక, క్రీస్తుసంబంధమైన భావాన్ని సాధారణ ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: ὕψωσεν
  choice: హెచ్చించాడు
  rationale: ఇక్కడ కేవలం పైకి ఎత్తడం కాక, గౌరవం మరియు అధికారమున్న ఉన్నత స్థానానికి చేర్చడం ఉద్దేశం; ‘హెచ్చించాడు’ ఆ ఉన్నతీకరణ భావాన్ని నిలుపుతుంది.
- source_word: τῇ δεξιᾷ αὐτοῦ
  choice: తన కుడివైపునకు
  rationale: కొత్త నిబంధనలోని సింహాసనారోహణ భావానికి అనుగుణంగా, దేవుని కుడివైపు అత్యున్నత గౌరవస్థానానికి చేర్చడాన్ని వ్యక్తం చేస్తుంది; సాధనార్థక పఠనాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: τοῦ δοῦναι
  choice: అనుగ్రహించడానికి
  rationale: ఉద్దేశాన్ని తెలిపే ఆర్టిక్యులర్ ఇన్ఫినిటివ్‌ను సహజమైన తెలుగులో తెలియజేస్తుంది; పశ్చాత్తాపం, క్షమాపణ దేవుడు ఇచ్చేవిగా ఉన్న భావాన్నీ కాపాడుతుంది.
- source_word: μετάνοιαν
  choice: పశ్చాత్తాపాన్ని
  rationale: ఇది కేవలం అభిప్రాయ మార్పు కాక, దేవునివైపు నిర్ణయాత్మకంగా తిరగడాన్ని సూచించే స్థిరమైన, సహజమైన బైబిలు తెలుగు పదం.
- source_word: τῷ Ἰσραὴλ
  choice: ఇశ్రాయేలుకు
  rationale: δοῦναιతో ఉన్న దత్తివిభక్తి గ్రహీతను నేరుగా సూచిస్తుంది.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: పాపక్షమాపణను
  rationale: పాపాల క్షమను తెలిపే స్పష్టమైన, స్థిరమైన, సహజ తెలుగు వ్యక్తీకరణ.
theological_decisions:
- issue: దేవుని కుడివైపు యేసు హెచ్చింపబడిన విధానం
  choice: దేవుడు యేసును తన కుడివైపున ఉన్న అత్యున్నత గౌరవం, అధికార స్థానానికి హెచ్చించాడు.
  alternative: దేవుడు తన కుడిచేతి ద్వారా యేసును హెచ్చించాడు.
  rationale: τῇ δεξιᾷ αὐτοῦ అనే దత్తివిభక్తి స్థానం/సహవాసం లేదా సాధనం అనే రెండింటినీ అనుమతిస్తుంది. ఈ సందర్భం మరియు కొత్త నిబంధన సింహాసనారోహణ వాడుక స్థానార్థక భావాన్ని బలపరుస్తాయి; అయినా నిజమైన వ్యాకరణ సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘ఈయనను’ మూలంలోని సూచన బలాన్ని నిలుపుతుంది. ‘పశ్చాత్తాపం’ μετάνοια యొక్క సంపూర్ణ ఆధ్యాత్మిక-నైతిక తిరుగుదల భావాన్ని కాపాడుతుంది.
