id: ACT.7.5
reference: Acts 7:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔδωκεν αὐτῷ κληρονομίαν ἐν αὐτῇ οὐδὲ βῆμα ποδός, καὶ ἐπηγγείλατο δοῦναι αὐτῷ εἰς κατάσχεσιν αὐτὴν καὶ τῷ σπέρματι αὐτοῦ μετ’ αὐτόν, οὐκ ὄντος αὐτῷ τέκνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/005.yaml
  text: And he gave him no inheritance in it[a], not even a foot's length, but promised to give it to him as a possession, and to his offspring after him[b], though he had no child.
translation:
  language: te
  text: ఆ దేశంలో ఆయన అబ్రాహాముకు ఏ వారసత్వాన్నీ ఇవ్వలేదు—అడుగు మోపేంత స్థలాన్ని కూడా ఇవ్వలేదు.[a] అయినా, అప్పటికి అబ్రాహాముకు సంతానం లేకపోయినప్పటికీ, ఆ దేశాన్ని అతనికి స్వాస్థ్యంగా, అతని తర్వాత అతని సంతానానికి ఇవ్వాలని వాగ్దానం చేశాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మూలభాషలోని ఈ నుడికారానికి “ఒక్క అడుగు నేల కూడా” అని కూడా అనువదించవచ్చు. భావం: అతి చిన్న భూభాగం కూడా ఇవ్వలేదు.'
    reason: lexical_alternative
  - marker: b
    text: “అతనికి సంతానం లేనప్పుడు” అని కూడా అనువదించవచ్చు. గ్రీకు నిర్మాణం కాలార్థాన్ని సూచించగలదు; అయితే ఇక్కడ “సంతానం లేకపోయినప్పటికీ” అనే భావం సందర్భానికి బాగా సరిపోతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: κληρονομίαν
  choice: వారసత్వం
  rationale: భూమిలో దేవుని వాగ్దానానుసారంగా లభించే హక్కుగల వాటా అనే నిబంధనాత్మక, న్యాయపరమైన భావాన్ని నిలుపుతుంది.
- source_word: οὐδὲ βῆμα ποδός
  choice: అడుగు మోపేంత స్థలం కూడా
  rationale: అతి చిన్న భూభాగం కూడా ఇవ్వలేదనే గ్రీకు నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా, సజీవంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπηγγείλατο
  choice: వాగ్దానం చేశాడు
  rationale: దేవుడు చేసిన దృఢమైన హామీని సహజంగా తెలియజేస్తుంది.
- source_word: εἰς κατάσχεσιν
  choice: స్వాస్థ్యంగా
  rationale: ఆ దేశం అబ్రాహాముకు స్థిరమైన స్వాధీన ఆస్తిగా ఇవ్వబడుతుందనే ఫలితార్థాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: σπέρματι
  choice: సంతానానికి
  rationale: ఏకవచన రూపంలో ఉన్నప్పటికీ సమూహార్థకంగా వాడిన గ్రీకు పదానికి తెలుగు 'సంతానం' సహజమైన సమానార్థకం; అబ్రాహాము వాగ్దాన భాషను కూడా నిలుపుతుంది.
- source_word: μετ’ αὐτόν
  choice: అతని తర్వాత
  rationale: అబ్రాహాము తర్వాత అతని సంతానానికి ఆ స్వాస్థ్యం చెందుతుందనే కాలానుక్రమ భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: οὐκ ὄντος αὐτῷ τέκνου
  choice: అప్పటికి అబ్రాహాముకు సంతానం లేకపోయినప్పటికీ
  rationale: గ్రీకు genitive absolute లోని పరిస్థితి భావంతో పాటు సందర్భంలో ప్రధానమైన concessive భావాన్ని వ్యక్తం చేస్తుంది; 'అప్పటికి' కాలసూచనను కూడా కాపాడుతుంది.
- source_word: τέκνου
  choice: సంతానం
  rationale: ఇక్కడ τέκνον కుమారుడికే పరిమితం కాకుండా బిడ్డ/సంతానం అనే విస్తృత అర్థం కలిగి ఉంది.
theological_decisions:
- issue: వాగ్దానం చేయబడినప్పుడు అబ్రాహాముకు సంతానం లేకపోవడంలోని concessive భావం
  choice: అప్పటికి అబ్రాహాముకు సంతానం లేకపోయినప్పటికీ
  alternative: అతనికి సంతానం లేనప్పుడు
  rationale: వ్యాకరణ నిర్మాణాన్ని కాలార్థకంగా తీసుకోవచ్చు; అయితే సంతానం లేని స్థితిలోనే దేవుడు అతనికీ అతని సంతానానికీ వాగ్దానం చేశాడనే విరుద్ధస్థితి ఈ సందర్భంలో బలంగా ఉంది. ఎంపిక చేసిన రూపం కాలపరిస్థితినీ, concessive ఉద్వేగాన్నీ రెండింటినీ నిలుపుతుంది.
- issue: అబ్రాహాము స్వయంగా భూమిని పొందకపోవడం మరియు అతనికి అది స్వాస్థ్యంగా ఇస్తానన్న వాగ్దానం మధ్య ఉద్రిక్తత
  choice: రెండు ప్రకటనలనూ పరిష్కరించకుండా యథాతథంగా ఉంచడం
  alternative: వాగ్దానాన్ని కేవలం అతని సంతానానికి లేదా భవిష్యత్తు ప్రతీకాత్మక నెరవేర్పుకు పరిమితం చేయడం
  rationale: గ్రీకు పాఠం అబ్రాహాముకు అప్పట్లో భూమి ఇవ్వబడలేదని, అయినా అతనికీ అతని సంతానానికీ ఇస్తానని వాగ్దానం చేశాడని చెబుతుంది. అనువాదం ఈ వేదాంతపరమైన ఉద్రిక్తతను సిద్ధాంతపూర్వకంగా పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. దేవునికి 'ఆయన', అబ్రాహాముకు 'అతను' అనే సూచనలతో కర్తల భేదం స్పష్టపరచబడింది. మూలంలోని పొడవైన వాక్యాన్ని భావస్పష్టత కోసం రెండు వాక్యాలుగా అమర్చినా, తార్కిక అనుసంధానాన్ని 'అయినా'తో నిలిపాం.
