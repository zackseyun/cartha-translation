source:
  edition: SBLGNT
  text: καὶ μετετέθησαν εἰς Συχὲμ καὶ ἐτέθησαν ἐν τῷ μνήματι ⸀ᾧ ὠνήσατο Ἀβραὰμ τιμῆς ἀργυρίου παρὰ τῶν υἱῶν Ἑμμὼρ ⸀ἐν Συχέμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/016.yaml
  text: and they were carried over to Shechem and laid in the tomb that Abraham had bought for a price of silver from the sons of Hamor in Shechem[a].
translation:
  language: te
  text: వారిని షెకెముకు తరలించి, షెకెములో హమోరు కుమారుల నుండి అబ్రాహాము వెండి వెల చెల్లించి కొన్న సమాధిలో ఉంచబడ్డారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'స్తెఫను మాటలు రెండు వృత్తాంతాల వివరాలను కలిపి పేర్కొంటాయి: ఆదికాండము 23లో అబ్రాహాము మక్పేలాలో ఎఫ్రోను నుండి సమాధి స్థలాన్ని కొంటాడు; ఆదికాండము 33:19లో యాకోబు షెకెము దగ్గర హమోరు కుమారుల నుండి భూమిని కొంటాడు.'
    reason: cross_reference
lexical_decisions:
- source_word: μετετέθησαν
  choice: తీసుకువెళ్లి
  rationale: ఇక్కడ μετατίθημι యొక్క కర్మణి రూపం పితరుల అవశేషాలను మరో చోటికి తరలించడాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో తరువాతి కర్మణి క్రియతో సహజంగా కలిసేలా ‘తీసుకువెళ్లి’ అని అనువదించాం.
- source_word: Συχὲμ / Συχέμ
  choice: షెకెము
  rationale: స్థలనామానికి ఆధునిక తెలుగు లిప్యంతరీకరణ; విభక్తితో ‘షెకెముకు,’ ‘షెకెములో’ అని వాడాం.
- source_word: ἐτέθησαν
  choice: ఉంచారు
  rationale: సమాధి సందర్భంలో τίθημι పాతిపెట్టడం లేదా సమాధిలో ఉంచడాన్ని సూచిస్తుంది. మూలంలోని సాధారణ పదప్రయోగాన్ని మించకుండా ‘ఉంచారు’ అని ఇచ్చాం.
- source_word: μνήματι
  choice: సమాధి
  rationale: μνῆμα అంటే మృతదేహాన్ని ఉంచే స్థలం లేదా సమాధి. ఆధునిక తెలుగు పాఠకులకు ‘సమాధి’ సహజంగా అర్థమవుతుంది.
- source_word: ᾧ
  choice: కొన్న సమాధిలో
  rationale: దత్తివ ఏకవచన నపుంసక సంబంధ సర్వనామం μνήματιని సూచిస్తుంది. తెలుగులో సంబంధ కృదంత నిర్మాణంతో సహజంగా వ్యక్తపరిచాం.
- source_word: ὠνήσατο
  choice: కొన్న
  rationale: క్రియ యొక్క ప్రాథమిక అర్థం ‘కొను.’ సమాధిలో ఉంచడం కంటే ముందు జరిగిన కొనుగోలును తెలుగు సంబంధ కృదంతం సహజంగా తెలియజేస్తుంది.
- source_word: τιμῆς ἀργυρίου
  choice: వెండి ధరకు
  rationale: వెండితో చెల్లించిన ధర అనే మూల నిర్మాణాన్ని సంక్షిప్తంగా, సహజమైన తెలుగులో నిలుపుతుంది; నిర్దిష్ట మొత్తం మూలంలో లేదు.
- source_word: παρὰ τῶν υἱῶν Ἑμμὼρ
  choice: హమోరు కుమారుల దగ్గర
  rationale: γενitiveతో παρά కొనుగోలు జరిగిన మూలాన్ని, అంటే ఎవరి దగ్గర నుంచి కొన్నాడో సూచిస్తుంది. ‘దగ్గర’ తెలుగు కొనుగోలు సందర్భంలో సహజం.
- source_word: ἐν Συχέμ
  choice: షెకెములో
  rationale: చివరి స్థలవాచక పదబంధాన్ని నేరుగా అనువదించాం. దాని అన్వయాన్ని సిద్ధాంతపూర్వకంగా అతిగా నిర్ధారించకుండా, తెలుగు పదక్రమంలో హమోరు కుమారుల దగ్గర జరిగిన కొనుగోలుతో సహజంగా సంబంధింపజేశాం.
theological_decisions:
- issue: ఆదికాండంలోని సమాధి-కొనుగోలు వృత్తాంతాలతో చారిత్రక ఉద్రిక్తత
  choice: షెకెములో హమోరు కుమారుల దగ్గర అబ్రాహాము సమాధిని కొన్నాడని గ్రీకు పాఠంలో ఉన్న మాటలను యథాతథ భావంతో నిలుపుట.
  alternative: ఆదికాండము 33:19 ప్రకారం యాకోబు కొనుగోలుగా మార్చడం, లేదా ఆదికాండము 23 ప్రకారం మక్పేలాలో ఎఫ్రోను దగ్గర అబ్రాహాము చేసిన కొనుగోలుతో సమన్వయపరచడం.
  rationale: అనువాదం సంబంధిత పాత నిబంధన వృత్తాంతాలతో బలవంతంగా సమన్వయపరచకుండా గ్రీకు పాఠాన్ని ప్రతిబింబించాలి. పాఠకులు పోల్చుకోగల వివరాలను పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ప్రధాన పాఠంలో మూలంలోని చారిత్రక ఉద్రిక్తతను మార్చకుండా ఉంచి, వివరణను పాదటిప్పణికి పరిమితం చేశాం.
