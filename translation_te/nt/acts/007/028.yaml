  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ ἀνελεῖν με σὺ θέλεις ὃν τρόπον ἀνεῖλες ⸀ἐχθὲς τὸν Αἰγύπτιον;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/028.yaml
  text: Do you want to kill me the way you killed the Egyptian yesterday?
translation:
  language: te
  text: ‘నిన్న ఆ ఐగుప్తీయుణ్ణి చంపినట్టే నన్నూ చంపాలనుకుంటున్నావా?’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ... θέλεις
  choice: చంపాలనుకుంటున్నావా?
  rationale: μὴతో ప్రారంభమైన ప్రశ్న సాధారణంగా ‘కాదు’ అనే సమాధానాన్ని ఆశించినా, తెలుగులో సహజమైన ప్రశ్నారూపం సందర్భంలోని ఆరోపణాత్మక భావాన్ని తగినంతగా తెలియజేస్తుంది.
- source_word: ἀνελεῖν / ἀνεῖλες
  choice: చంపాలని / చంపినట్టే
  rationale: ἀναιρέω ఇక్కడ ప్రాణం తీయడం అనే స్పష్టమైన అర్థంలో ఉంది; రెండుచోట్లా ‘చంపు’ అనే సాధారణ, ప్రత్యక్ష పదం సరిపోతుంది.
- source_word: ὃν τρόπον
  choice: చంపినట్టే
  rationale: ‘ఏ విధంగా’ అనే పోలికను ఆధునిక తెలుగులో సహజంగా ‘చంపినట్టే’ అని వ్యక్తం చేస్తుంది.
- source_word: ἐχθὲς τὸν Αἰγύπτιον
  choice: నిన్న ఆ ఐగుప్తీయుణ్ణి
  rationale: కాలసూచకమైన ‘నిన్న’ను నిలుపుతూ, నిర్దిష్ట వ్యక్తిని సూచించే గ్రీకు article భావాన్ని ‘ఆ’ ద్వారా సహజంగా వ్యక్తం చేసింది.
theological_decisions: []
translation_notes:
  register: ఆరోపణతో కూడిన ప్రత్యక్ష సంభాషణను ఆధునిక ప్రామాణిక తెలుగులో సరళంగా, గౌరవప్రదంగా అందించింది. మూలంలోని ప్రశ్నను అదనపు వివరణ లేకుండా నిలిపింది.
