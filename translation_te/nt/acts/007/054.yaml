  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀκούοντες δὲ ταῦτα διεπρίοντο ταῖς καρδίαις αὐτῶν καὶ ἔβρυχον τοὺς ὀδόντας ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/054.yaml
  text: When they heard these things[a], they were cut to the heart and gnashed their teeth at him.
translation:
  language: te
  text: వారు ఈ మాటలు విన్నప్పుడు, హృదయాల్లో కోసినట్లై తీవ్రంగా కోపగించుకొని, అతనిమీద పళ్లు నూరారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు తమ హృదయాల్లో తీవ్రంగా రగిలిపోయారు.” గ్రీకు క్రియ అక్షరార్థంగా కోయబడటం లేదా రంపంతో చీల్చబడటం అనే సజీవ చిత్రాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούοντες
  choice: విన్నప్పుడు
  rationale: ఈ వర్తమాన కృదంతం ప్రధాన క్రియలు జరిగిన సందర్భాన్ని సూచిస్తుంది. తెలుగులో ‘విన్నప్పుడు’ సహజంగా ఉండి దాని కాలసంబంధ భావాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ ఇక్కడ కథనంలోని తదుపరి పరిణామాన్ని స్వల్పంగా సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో అదనపు ‘అప్పుడు/అయితే’ లేకుండానే ఆ సంబంధం స్పష్టంగా ఉంటుంది.
- source_word: ταῦτα
  choice: ఈ మాటలు
  rationale: బహువచన సూచనపదం స్తెఫను ఇంతకుముందు పలికిన విషయాలను సూచిస్తుంది. సందర్భంలో ‘ఈ మాటలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: διεπρίοντο
  choice: వారి హృదయాలు చీలిపోయినట్లుగా రగిలిపోయి
  rationale: ఈ క్రియ అక్షరార్థంగా కోయబడటం లేదా రంపంతో చీల్చబడటం అనే తీవ్రమైన చిత్రాన్ని కలిగి, ఇక్కడ అంతరంగంలోని తీవ్ర ఆగ్రహాన్ని సూచిస్తుంది. ఈ అనువాదం రూపకాన్ని పూర్తిగా పోగొట్టకుండా సందర్భంలోని ఆగ్రహాన్ని స్పష్టం చేస్తుంది.
- source_word: ταῖς καρδίαις αὐτῶν
  choice: వారి హృదయాలు
  rationale: గ్రీకులోని బహువచనాన్ని నిలుపుతూ, ప్రభావితమైన అంతరంగాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔβρυχον τοὺς ὀδόντας
  choice: పళ్లు కొరికారు
  rationale: తీవ్రమైన కోపం, శత్రుత్వాన్ని తెలిపే గ్రీకు దృశ్యభాషకు ఇది సహజమైన తెలుగు సమానార్థక ప్రయోగం.
- source_word: ἐπ’ αὐτόν
  choice: అతనిపై
  rationale: ఇక్కడ ἐπί వారి శత్రుత్వం స్తెఫనువైపు మళ్లిందని సూచిస్తుంది; ‘అతనిపై’ ఆ దిశను సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘హృదయాలు చీలిపోవడం’ పశ్చాత్తాపమా లేక ఆగ్రహమా?
  choice: రూపకాన్ని ఉంచుతూ ‘రగిలిపోయి’ అని సందర్భంలోని ఆగ్రహాన్ని తెలిపింది.
  alternative: ‘వారి హృదయాలు చీలిపోయాయి’ అని మాత్రమే అనువదించడం.
  rationale: తరువాత వారు పళ్లు కొరకడం ఈ అంతరంగ కలకలం పశ్చాత్తాపం కాక తీవ్ర ఆగ్రహమని సూచిస్తుంది. అయినప్పటికీ మూలంలోని కోయబడే రూపకాన్ని పూర్తిగా తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథనశైలి వాడబడింది. ‘రగిలిపోయి’ ఆగ్రహాన్ని సహజంగా తెలియజేస్తే, ‘చీలిపోయినట్లుగా’ మూలంలోని తీవ్రమైన రూపకాన్ని నిలుపుతుంది.
