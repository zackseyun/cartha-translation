id: ACT.7.52
reference: Acts 7:52
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίνα τῶν προφητῶν οὐκ ἐδίωξαν οἱ πατέρες ὑμῶν; καὶ ἀπέκτειναν τοὺς προκαταγγείλαντας περὶ τῆς ἐλεύσεως τοῦ δικαίου οὗ νῦν ὑμεῖς προδόται καὶ φονεῖς ⸀ἐγένεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/052.yaml
  text: Which of the prophets did your fathers not persecute? And they killed those who announced beforehand the coming of the Righteous One[a], of whom you have now become betrayers and murderers[c][b],
translation:
  language: te
  text: మీ పితరులు[a] హింసించని ప్రవక్త ఎవరు? నీతిమంతుని[b] రాకను ముందుగా ప్రకటించినవారిని వారు చంపారు. ఇప్పుడు మీరు ఆయనకు ద్రోహులుగాను, ఆయనను హత్య చేసినవారుగాను అయ్యారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మీ పూర్వీకులు’ అని కూడా అనువదించవచ్చు; గ్రీకులో అక్షరార్థంగా ‘మీ పితరులు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘న్యాయవంతుడు.’
    reason: lexical_alternative
  - marker: c
    text: ‘ద్రోహులుగా’ అనే పదాన్ని సందర్భానుసారం ‘ఆయనను అప్పగించినవారుగా’ అని కూడా చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα τῶν προφητῶν
  choice: హింసించని ప్రవక్త ఎవరు?
  rationale: గ్రీకు విభక్తి నిర్మాణాన్ని సహజమైన తెలుగు ప్రశ్నగా మలుస్తూ, ఏ ప్రవక్తా హింసను తప్పించుకోలేదనే అలంకారిక బలాన్ని నిలుపుతుంది.
- source_word: ἐδίωξαν
  choice: హింసించని
  rationale: ఈ సందర్భంలో ప్రవక్తలను శత్రుత్వంతో వెంటాడి బాధించడాన్ని ‘హింసించు’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: οἱ πατέρες ὑμῶν
  choice: మీ పితరులు
  rationale: గ్రీకు పదానికి సన్నిహితంగా ఉండి, శ్రోతలకూ వారి పూర్వీకులకూ మధ్య స్తెఫను చూపిస్తున్న బాధ్యతాపరమైన కొనసాగింపును నిలుపుతుంది.
- source_word: τοὺς προκαταγγείλαντας περὶ τῆς ἐλεύσεως
  choice: రాకను ముందుగా ప్రకటించినవారిని
  rationale: προ-లోని ముందస్తు కాలభావాన్నీ, ప్రకటన అనే క్రియాభావాన్నీ రెండింటినీ స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: τοῦ δικαίου
  choice: నీతిమంతుని
  rationale: నిర్దిష్టమైన వ్యక్తిని సూచించే బిరుదుసదృశ ప్రయోగాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: προδόται
  choice: ద్రోహులుగాను
  rationale: యేసును అప్పగించి నమ్మకద్రోహం చేసిన నైతిక ఆరోపణను సంక్షిప్తంగా వ్యక్తపరుస్తుంది; కేవలం రాజకీయ దేశద్రోహ భావానికి పరిమితం చేయదు.
- source_word: φονεῖς
  choice: హంతకులుగాను
  rationale: సాధారణంగా చంపినవారు అనే అర్థం కంటే, ఇక్కడి నైతిక అపరాధ ఆరోపణను బలంగా తెలియజేస్తుంది.
- source_word: ἐγένεσθε
  choice: అయ్యారు
  rationale: వారు ఆ స్థితికి చేరారనే గ్రీకు క్రియ యొక్క భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; νῦνను ‘ఇప్పుడు’గా విడిగా నిలుపుతుంది.
theological_decisions:
- issue: τοῦ δικαίουను క్రీస్తును సూచించే బిరుదుగా అనువదించడం
  choice: నీతిమంతుడు
  alternative: న్యాయవంతుడు
  rationale: సందర్భంలో ఇది ప్రవక్తలు ముందుగా ప్రకటించిన యేసును సూచిస్తుంది. ‘నీతిమంతుడు’ ఆయన నైతిక నీతిని, బిరుదుసదృశ నిర్దిష్టతను స్పష్టంగా తెలియజేస్తుంది.
- issue: οὗకు సంబంధించిన ఆరోపణను తెలుగులో వ్యక్తీకరించడం
  choice: ఆయనకు ద్రోహులుగాను హంతకులుగాను
  alternative: ఆయనను అప్పగించినవారుగాను హంతకులుగాను
  rationale: గ్రీకులోని సంబంధాన్ని నిలుపుతూ, προδόταιలోని విస్తృత నమ్మకద్రోహ భావాన్ని ఒక నిర్దిష్ట కార్యానికి మాత్రమే కుదించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, స్తెఫను పలికిన నేరుగా ఎదుర్కొనే అలంకారిక ప్రశ్నను మరియు తీవ్రమైన నైతిక ఆరోపణను నిలుపుతూ అనువదించబడింది. ‘పితరులు,’ ‘నీతిమంతుడు,’ ‘హంతకులు’ వంటి పదాలు గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే బైబిలు వచనశైలిని ఇస్తాయి.
