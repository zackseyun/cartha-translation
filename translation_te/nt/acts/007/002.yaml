  to: 'అతడు ఇలా అన్నాడు: “సోదరులారా, తండ్రులారా,[a] వినండి. మన పితరుడైన అబ్రాహాము హారానులో నివసించే ముందు,[b] మెసొపొతామియాలో ఉన్నప్పుడు మహిమ యొక్క దేవుడు అతనికి ప్రత్యక్షమయ్యాడు.”'
