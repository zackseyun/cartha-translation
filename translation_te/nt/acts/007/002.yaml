id: ACT.7.2
reference: Acts 7:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη· Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατε· Ὁ θεὸς τῆς δόξης ὤφθη τῷ πατρὶ ἡμῶν Ἀβραὰμ ὄντι ἐν τῇ Μεσοποταμίᾳ πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/002.yaml
  text: 'And he said[a], “Brothers and fathers, listen: the God of glory appeared to our father Abraham when he was in Mesopotamia[b], before he lived in Haran.”'
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “సోదరులారా, తండ్రులారా,[a] వినండి. మన పితరుడైన అబ్రాహాము హారానులో నివసించే ముందు,[b] మెసొపొతామియాలో ఉన్నప్పుడు మహిమ యొక్క దేవుడు అతనికి ప్రత్యక్షమయ్యాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరానుసారంగా, “పురుషులారా, సోదరులారా, తండ్రులారా.” గ్రీకు సంబోధనా సూత్రం స్పష్టంగా పురుషవాచకమైనది, అధికారికమైనది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “హారానులో స్థిరపడే ముందు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἔφη
  choice: అప్పుడు అతడు ఇలా అన్నాడు
  rationale: δέ ఇక్కడ స్వల్ప అనుసంధానాన్ని సూచిస్తుంది. ‘అప్పుడు’ కథన ప్రవాహాన్ని సహజంగా కొనసాగిస్తుంది; ἔφηకి ‘ఇలా అన్నాడు’ సాధారణమైన తెలుగు రూపం.
- source_word: Ἄνδρες ἀδελφοὶ καὶ πατέρες
  choice: సోదరులారా, తండ్రులారా
  rationale: ఇది సభను ఉద్దేశించిన గౌరవపూర్వకమైన, పురుషవాచక సంబోధన. ἄνδρες అనే పదాన్ని విడిగా కలిపితే తెలుగులో కృత్రిమంగా వినిపిస్తుంది; దాని అధికారిక సంబోధనా బలం ఈ రూపంలో అంతర్భవిస్తుంది. మరింత అక్షరానుసారమైన రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἀκούσατε
  choice: వినండి
  rationale: శ్రద్ధగా ఆలకించమని కోరే ఆజ్ఞారూపాన్ని ఆధునిక తెలుగులో నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: Ὁ θεὸς τῆς δόξης
  choice: మహిమగల దేవుడు
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని తెలుగులో ‘మహిమ యొక్క దేవుడు’ అని యాంత్రికంగా అనువదించడం అసహజం. ‘మహిమగల దేవుడు’ దేవునికి చెందిన మహిమను స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: ὤφθη
  choice: ప్రత్యక్షమయ్యాడు
  rationale: దైవ ప్రత్యక్షత సందర్భంలో ὁράω యొక్క కర్మణి రూపానికి ఇది సహజమైన తెలుగు సమానం. ‘తన్ను బయలుపరచుకున్నాడు’ అనేది అవసరానికి మించిన వ్యాఖ్యానాన్ని జోడిస్తుంది.
- source_word: τῷ πατρὶ ἡμῶν Ἀβραὰμ
  choice: మన పితరుడైన అబ్రాహాముకు
  rationale: సమాజమంతా అబ్రాహాముతో కలిగిన వంశసంబంధ గుర్తింపును ‘మన పితరుడు’ నిలుపుతుంది; ‘అబ్రాహాముకు’ దత్తివు సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ὄντι ἐν τῇ Μεσοποταμίᾳ
  choice: మెసొపొతామియాలో ఉన్నప్పుడు
  rationale: పరిస్థితిని తెలిపే వర్తమాన కృదంతాన్ని తెలుగులో సహజమైన కాలవాచక ఉపవాక్యంగా అందిస్తుంది.
- source_word: πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν
  choice: హారానులో నివసించక ముందు
  rationale: κατοικέω ఇక్కడ ఒక చోట నివసించడం లేదా స్థిరపడడం అనే భావాలను అనుమతిస్తుంది. ‘నివసించక ముందు’ సాధారణమైన, తక్కువ వ్యాఖ్యానాత్మకమైన రూపం; ‘స్థిరపడక ముందు’ అనే భావసంభవాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: పురుషవాచక సభా సంబోధనను ఎలా అందించాలి
  choice: సోదరులారా, తండ్రులారా
  alternative: పురుషులారా, సోదరులారా, తండ్రులారా
  rationale: గ్రీకు సంబోధన పురుషవాచకమైనదనే విషయాన్ని తటస్థీకరించలేదు. అయితే ἄνδρεςను ప్రత్యేక పదంగా చేర్చడం తెలుగులో భారంగా ఉండడంతో, సహజమైన అధికారిక సంబోధనను ప్రధాన పాఠ్యంలో ఉంచి అక్షరానుసార ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: θεὸς τῆς δόξης అనే దైవ బిరుదు
  choice: మహిమగల దేవుడు
  alternative: మహిమ యొక్క దేవుడు
  rationale: ప్రత్యామ్నాయం గ్రీకు నిర్మాణాన్ని మరింత బాహ్యంగా ప్రతిబింబించినా ఆధునిక తెలుగులో అసహజంగా ఉంటుంది. ఎంపిక చేసిన రూపం దేవుని మహిమను తగ్గించకుండా మూలభావాన్ని సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవభరితమైన సభా ప్రసంగ శైలిని వాడాం. ‘పితరుడు,’ ‘మహిమగల దేవుడు,’ ‘ప్రత్యక్షమయ్యాడు’ వంటి పదాలు బైబిలీయ గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి. అన్ని పాదసూచిక సూచికలు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
