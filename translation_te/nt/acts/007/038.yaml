id: ACT.7.38
reference: Acts 7:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ γενόμενος ἐν τῇ ἐκκλησίᾳ ἐν τῇ ἐρήμῳ μετὰ τοῦ ἀγγέλου τοῦ λαλοῦντος αὐτῷ ἐν τῷ ὄρει Σινᾶ καὶ τῶν πατέρων ἡμῶν, ὃς ἐδέξατο ⸀λόγια ζῶντα δοῦναι ⸀ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/038.yaml
  text: This is the one who was in the assembly in the wilderness with the angel who was speaking to him on Mount Sinai[a], and with our fathers[c][b]; he received living oracles to give to us.
translation:
  language: te
  text: అరణ్యంలోని సభలో[a], సీనాయి కొండపై ఇతనితో మాట్లాడుతూ ఉన్న దేవదూతతోనూ మన పితరులతోనూ ఉన్నవాడు ఇతడే. మనకు ఇవ్వడానికి సజీవమైన దైవవాక్కులను[b] అతడు స్వీకరించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా ‘సమాజంలో’; సంప్రదాయ అనువాదం: ‘అరణ్యంలోని సంఘంలో.’'
    reason: alternative_reading
  - marker: b
    text: లేదా ‘సజీవమైన మాటలను’ లేదా ‘జీవాన్నిచ్చే దైవవాక్కులను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: సభలో
  rationale: అరణ్యంలో కూడిన ఇశ్రాయేలు ప్రజలను సూచించే ప్రాథమిక అర్థాన్ని నిలుపుతుంది; తరువాతి కాలపు సంస్థాగత ‘సంఘం/చర్చి’ భావాన్ని అనవసరంగా దిగుమతి చేయదు.
- source_word: ἐρήμῳ
  choice: అరణ్యంలో
  rationale: ఇశ్రాయేలు అరణ్యసంచార నేపథ్యానికి సహజమైన, స్థిరపడిన తెలుగు పదం.
- source_word: ἀγγέλου
  choice: దేవదూతతో
  rationale: సీనాయి సందర్భంలో ఇది మానవ సందేశకునికంటే దేవదూతను సూచిస్తుంది.
- source_word: λαλοῦντος
  choice: మాట్లాడుతూ ఉన్న
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న చర్యను సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: ὄρει Σινᾶ
  choice: సీనాయి కొండపై
  rationale: స్థలనామానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: πατέρων ἡμῶν
  choice: మన పితరులతో
  rationale: గ్రీకు పదంలోని పురుషలింగ రూపాన్నీ, ఇశ్రాయేలు పూర్వీకులననే చారిత్రక సూచననూ నిలుపుతుంది.
- source_word: ἐδέξατο
  choice: స్వీకరించాడు
  rationale: మోషే దేవుని ప్రకటనను పొందినవాడని పారదర్శకంగా తెలియజేస్తుంది.
- source_word: λόγια
  choice: దైవవాక్కులను
  rationale: సాధారణ మాటలు కాక దేవుని నుండి వచ్చిన అధికారపూర్వక ప్రకటనలనే భావాన్ని స్పష్టంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా అందిస్తుంది.
- source_word: ζῶντα
  choice: సజీవమైన
  rationale: ‘జీవముగల’ అనే మూలభావాన్ని నిలుపుతూ, కేవలం ‘జీవాన్నిచ్చే’ అని వ్యాఖ్యానాత్మకంగా పరిమితం చేయదు.
- source_word: δοῦναι
  choice: ఇవ్వడానికి
  rationale: మోషే వాటిని ప్రజలకు ఇవ్వాలనే ఉద్దేశంతో స్వీకరించాడనే క్రియాసంబంధాన్ని సరళంగా నిలుపుతుంది.
- source_word: ἡμῖν
  choice: మనకు
  rationale: స్తెఫను తన శ్రోతలను ఇశ్రాయేలు ఒడంబడిక చరిత్రతో కలిపి మాట్లాడుతున్న విధానాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: ὁ γενόμενος
  choice: ఉన్నవాడు
  rationale: ఆ సందర్భంలో మోషే ఉన్నాడనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; ‘ఉనికిలోకి వచ్చినవాడు’ వంటి కృతక పదప్రయోగాన్ని నివారిస్తుంది.
theological_decisions:
- issue: అరణ్యంలోని ఇశ్రాయేలును సూచించే ἐκκλησίᾳ పదాన్ని ‘సంఘం/చర్చి’గా అనువదించాలా
  choice: సభ
  alternative: సమాజం; సంఘం/చర్చి
  rationale: ఈ సందర్భం అరణ్యంలో కూడిన ఇశ్రాయేలు ప్రజలది. ‘సభ’ మూలపదంలోని కూడిక భావాన్ని నిలుపుతూ, తరువాతి కొత్త నిబంధన సంస్థాగత భావాన్ని ముందుగానే రుద్దదు.
- issue: λόγια ζῶντα అనే పదబంధాన్ని ‘జీవాన్నిచ్చే వాక్కులు’ అని వ్యాఖ్యానాత్మకంగా అనువదించాలా
  choice: సజీవమైన దైవవాక్కులు
  alternative: జీవముగల మాటలు; జీవాన్నిచ్చే దైవవాక్కులు
  rationale: గ్రీకు పదబంధంలోని సంక్షిప్తతను, దైవవాక్కులు ‘సజీవమైనవి’ అనే వేదాంతపరమైన ఉద్వేగాన్ని నిలుపుతుంది; అవి కేవలం జీవాన్ని ప్రసాదిస్తాయనే ఒక్క అర్థానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన వాక్యనిర్మాణం వాడబడింది. పొడవైన గ్రీకు వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించినా సంబంధాలు నిలుపబడ్డాయి. ‘దైవవాక్కులు’ ప్రకటనాత్మక భావాన్ని స్పష్టం చేస్తుంది; ‘సజీవమైన’ మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను కాపాడుతుంది.
