id: ACT.7.43
reference: Acts 7:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀνελάβετε τὴν σκηνὴν τοῦ Μολὸχ καὶ τὸ ἄστρον τοῦ ⸀θεοῦ ⸀Ῥαιφάν, τοὺς τύπους οὓς ἐποιήσατε προσκυνεῖν αὐτοῖς. καὶ μετοικιῶ ὑμᾶς ἐπέκεινα Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/043.yaml
  text: And you took up the tent of Moloch and the star of the god Rephan[a], the images that you made to worship them[c][b], and I will deport you beyond Babylon.
translation:
  language: te
  text: మీరు మోలొకు గుడారాన్నీ, దేవుడైన రైఫాను నక్షత్రాన్నీ—వాటిని ఆరాధించడానికి మీరు చేసుకున్న ప్రతిరూపాలను[a]—మోసుకుపోయారు. నేను మిమ్మల్ని బలవంతంగా చెరలోకి, బబులోనుకు అవతల పంపిస్తాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రతిరూపాలు’కు ‘రూపాలు’ లేదా ‘బొమ్మలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అపొస్తలుల కార్యముల పాఠంలో ‘బబులోనుకు అవతల’ అని ఉంది. ఉదహరించబడిన ఆమోసు 5:27ను సాధారణంగా ‘దమస్కుకు అవతల’ అని అనువదిస్తారు.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνελάβετε
  choice: మోసుకుపోయారు
  rationale: ఈ సందర్భంలో ఆరాధనా వస్తువులను ఎత్తుకొని మోయడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὴν σκηνὴν τοῦ Μολὸχ
  choice: మోలోకు గుడారాన్ని
  rationale: σκηνή యొక్క ప్రాథమిక అర్థం ‘గుడారం.’ ‘దేవాలయం’ లేదా ‘మందిరం’ అనడం మూలపాఠం కంటే ఎక్కువ వ్యాఖ్యానాత్మకంగా ఉంటుంది.
- source_word: τὸ ἄστρον τοῦ θεοῦ Ῥαιφάν
  choice: రైఫాను అనే దేవుని నక్షత్రాన్ని
  rationale: అపొస్తలుల కార్యముల గ్రీకు పాఠంలోని ‘రైఫాను అనే దేవుని’ అనే నిర్మాణాన్ని అనుసరిస్తూ, ఆమోసులోని ‘మీ దేవుడు’ అనే రూపంతో సమన్వయం చేయలేదు.
- source_word: τοὺς τύπους
  choice: ప్రతిరూపాలను
  rationale: τύπος ఇక్కడ తయారుచేసిన ఆరాధనా రూపాలు లేదా ప్రతినిధి బొమ్మలను సూచిస్తుంది; ‘ప్రతిరూపాలు’ విస్తృతమైన మూలార్థాన్ని కాపాడుతుంది.
- source_word: προσκυνεῖν αὐτοῖς
  choice: వాటికి పూజ చేయడానికి
  rationale: విగ్రహారాధనా సందర్భంలో προσκυνέωకు ‘పూజ చేయడం’ సహజమైన తెలుగు సమానం; αὐτοῖςను నపుంసక బహువచనంగా ‘వాటికి’ అని ఇచ్చాం.
- source_word: μετοικιῶ ὑμᾶς
  choice: మిమ్మల్ని ... చెరగా పంపిస్తాను
  rationale: బలవంతపు నిర్వాసనం అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది; కేవలం ‘పంపిస్తాను’ కంటే చారిత్రక శిక్షా భావాన్ని నిలుపుతుంది.
- source_word: ἐπέκεινα Βαβυλῶνος
  choice: బబులోనుకు అవతలికి
  rationale: గ్రీకు పాఠంలోని ‘బబులోనుకు అవతల’ అనే స్థానార్థాన్ని నేరుగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: అపొస్తలుల కార్యములు 7:43లోని గమ్యస్థానం ఆమోసు 5:27 పాఠంతో భిన్నంగా ఉండటం
  choice: బబులోనుకు అవతలికి
  alternative: దమస్కుకు అవతలికి
  rationale: ఇక్కడి గ్రీకు పాఠం స్పష్టంగా Βαβυλῶνος (‘బబులోను’) అని ఉంది. ఆమోసు పాఠంతో మౌనంగా సమన్వయం చేయకుండా భేదాన్ని పాదసూచికలో నిలిపాం.
- issue: τοῦ θεοῦ Ῥαιφάν అనే పదబంధం
  choice: రైఫాను అనే దేవుని
  alternative: మీ దేవుడైన రైఫాను యొక్క
  rationale: అపొస్తలుల కార్యముల గ్రీకు పాఠంలో ‘మీ’ అనే సర్వనామం లేదు. కాబట్టి ఆమోసు హెబ్రీ పాఠంలోని రూపాన్ని ప్రధాన పాఠంలోకి దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. విగ్రహారాధనా సందర్భాన్ని స్పష్టం చేస్తూనే ‘గుడారం,’ ‘నక్షత్రం,’ ‘ప్రతిరూపాలు’ వంటి మూలపాఠ పదచిత్రాలను నిలిపాం. ప్రధాన పాఠంలోని ప్రతి పాదసూచిక గుర్తుకు సరిపోలే పాదసూచిక ఇచ్చాం.
