  to: మీరు మోలొకు గుడారాన్నీ, దేవుడైన రైఫాను నక్షత్రాన్నీ—వాటిని ఆరాధించడానికి మీరు చేసుకున్న ప్రతిరూపాలను[a]—మోసుకుపోయారు. నేను మిమ్మల్ని బలవంతంగా చెరలోకి, బబులోనుకు అవతల పంపిస్తాను.[b]
