source:
  edition: SBLGNT
  text: οὗτος ἐξήγαγεν αὐτοὺς ποιήσας τέρατα καὶ σημεῖα ἐν ⸀γῇ Αἰγύπτῳ καὶ ἐν Ἐρυθρᾷ Θαλάσσῃ καὶ ἐν τῇ ἐρήμῳ ἔτη τεσσεράκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/036.yaml
  text: This man led them out[a], performing wonders and signs in the land of Egypt and at the Red Sea and in the wilderness for forty years.
translation:
  language: te
  text: 'ఈయనే అద్భుతాలను, సూచక క్రియలను చేస్తూ వారిని బయటకు నడిపించాడు—ఐగుప్తు దేశంలోనూ, ఎర్ర సముద్రంలోనూ[a], అరణ్యంలోనూ నలభై సంవత్సరాలపాటు.


    [a] లేదా, “రెల్ల సముద్రం.” గ్రీకు పాఠంలో “ఎర్ర సముద్రం” (Ἐρυθρὰ Θάλασσα) అని ఉంది. ఇశ్రాయేలీయులు దాటిన ప్రదేశాన్ని సూచించడానికి కొత్త నిబంధనలోనూ సెప్టువజింటులోనూ సాధారణంగా వాడిన పేరు ఇదే.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రెల్ల సముద్రం.” గ్రీకు పాఠంలో “ఎర్ర సముద్రం” (Ἐρυθρὰ Θάλασσα) అని ఉంది. ఇశ్రాయేలీయులు దాటిన ప్రదేశాన్ని సూచించడానికి కొత్త నిబంధనలోనూ సెప్టువజింటులోనూ సాధారణంగా వాడిన పేరు ఇదే.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: ఈయనే
  rationale: మోషేను వెనక్కి సూచించే గ్రీకు నిర్దేశక సర్వనామంలోని ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐξήγαγεν
  choice: బయటకు నడిపించాడు
  rationale: ‘నడిపించి బయటకు తీసుకువచ్చాడు’ అనే భావాన్ని సహజంగా వ్యక్తపరుస్తూ నిర్గమ సందర్భానికి సరిపోతుంది.
- source_word: ποιήσας
  choice: చేశాడు
  rationale: తెలుగులో ప్రధాన వాక్యంతో సమన్వయంగా చెప్పడం సహజం; మోషే వారిని నడిపించడానికీ అద్భుత కార్యాలు చేయడానికీ మధ్య ఉన్న కథన సంబంధాన్ని నిలుపుతుంది.
- source_word: τέρατα καὶ σημεῖα
  choice: అద్భుతాలూ సూచక క్రియలూ
  rationale: విస్మయం కలిగించే కార్యాలు మరియు వాటి సూచనాత్మక స్వభావం అనే రెండు భావాలను వేరుగా నిలుపుతుంది.
- source_word: ἐν γῇ Αἰγύπτῳ
  choice: ఐగుప్తు దేశంలోనూ
  rationale: γῇ అనే పదాన్ని ‘దేశం’గా ప్రతిబింబిస్తూ మూడు ప్రదేశాల వరుసను నిలుపుతుంది.
- source_word: ἐν Ἐρυθρᾷ Θαλάσσῃ
  choice: ఎర్ర సముద్రంలోనూ
  rationale: గ్రీకు పదబంధానికి ప్రత్యక్ష సమానార్థకంగా ఉండి, పునరావృతమైన ἐν నిర్మాణాన్ని కూడా నిలుపుతుంది; హీబ్రూ నేపథ్యంలోని ‘రెల్ల సముద్రం’ను పాదటిప్పణిలో పేర్కొంది.
- source_word: ἐν τῇ ἐρήμῳ
  choice: అరణ్యంలో
  rationale: ఇశ్రాయేలు సంచరించిన జనావాసరహిత ప్రాంతాన్ని బైబిలు సందర్భానికి తగిన విధంగా సూచిస్తుంది; కేవలం ఇసుక ఎడారి అనే భావాన్ని రుద్దదు.
- source_word: ἔτη τεσσεράκοντα
  choice: నలభై సంవత్సరాలపాటూ
  rationale: కాలవ్యవధిని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: నిర్గమంలో మోషే పాత్ర మరియు కార్యసాధకత్వం
  choice: ‘ఈయనే’ అని ఉద్ఘాటించి, మోషే వారిని బయటకు నడిపించాడనీ అద్భుతాలు చేశాడనీ వచనం చెప్పినట్టే అనువదించడం
  alternative: ‘అతడు’ అని మాత్రమే అనువదించి ఉద్ఘాటనను తగ్గించడం; లేదా దేవుని కార్యసాధకత్వాన్ని వివరిస్తూ వచనంలో లేని పదాలను చేర్చడం
  rationale: స్తెఫను ప్రసంగంలో మోషేను ఉద్ఘాటించే ధోరణిని οὗτος నిలుపుతుంది. ఈ వచనం మోషేను మానవ సాధనంగా వర్ణిస్తుంది; అతడు దేవునికి స్వతంత్రంగా పనిచేశాడనే అదనపు నిర్ధారణను అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ప్రసంగంలోని గంభీరతను మరియు ‘ఈయనే’ అనే ఉద్ఘాటనను నిలుపుతూ రూపొందించబడింది. ‘సూచక క్రియలు’ అనే పదబంధం σημεῖα యొక్క ధార్మిక-కథన భావాన్ని అతిగా వ్యాఖ్యానించకుండా తెలియజేస్తుంది.
