translation:
  language: te
  text: దేవదూతల ద్వారా ఇవ్వబడిన ధర్మశాస్త్రాన్ని పొందిన మీరు[a], దాన్ని పాటించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవదూతల ఏర్పాటుల ద్వారా’ లేదా ‘దేవదూతల నిర్దేశం మేరకు.’ గ్రీకు పదబంధం కష్టమైనది; ధర్మశాస్త్రం ఇవ్వబడడంలో దేవదూతల మధ్యవర్తిత్వం లేదా ప్రమేయం ఉందని ఇది సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: పొందినవారు మీరే
  rationale: గుణాత్మక సంబంధసర్వనామంలోని ప్రత్యక్ష సంబోధనను, నిందారోపణ బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐλάβετε
  choice: పొందిన
  rationale: ధర్మశాస్త్రాన్ని స్వీకరించారనే భావాన్ని తెలియజేస్తుంది; దాన్ని ఇష్టపూర్వకంగా అంగీకరించారనే అదనపు భావాన్ని చేర్చదు.
- source_word: τὸν νόμον
  choice: ధర్మశాస్త్రాన్ని
  rationale: ఇక్కడ మోషే ద్వారా ఇవ్వబడిన దేవుని ధర్మశాస్త్రమే ఉద్దేశం; తెలుగు బైబిలు వాడుకలో ‘ధర్మశాస్త్రం’ స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: εἰς διαταγὰς ἀγγέλων
  choice: దేవదూతల ద్వారా నియమించబడిన
  rationale: కష్టమైన గ్రీకు పదబంధం సూచించే దేవదూతల మధ్యవర్తిత్వం లేదా నిర్దేశాన్ని సహజంగా వ్యక్తం చేస్తుంది; దాని ఖచ్చిత విధానాన్ని అతిగా నిర్ధారించదు.
- source_word: ἀγγέλων
  choice: దేవదూతల
  rationale: సందర్భంలో మానవ దూతలు కాక, ధర్మశాస్త్రం ఇవ్వడంలో సంబంధమున్న పరలోక జీవులే ఉద్దేశం.
- source_word: οὐκ ἐφυλάξατε
  choice: మీరు దాన్ని పాటించలేదు
  rationale: ధర్మశాస్త్రానికి విధేయులై దాని ఆజ్ఞలను ఆచరించకపోవడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: εἰς διαταγὰς ἀγγέλων అనే పదబంధంలో దేవదూతల పాత్ర
  choice: ధర్మశాస్త్రం దేవదూతల ద్వారా నియమించబడిందని చెప్పడం
  alternative: ‘దేవదూతల ఏర్పాటుల ప్రకారం’ లేదా ‘దేవదూతల నిర్దేశం మేరకు’ అని అనువదించడం
  rationale: మూలపాఠం ధర్మశాస్త్ర ప్రదానంలో దేవదూతల ప్రమేయాన్ని సూచిస్తుంది; అయితే διαταγαί యొక్క ఖచ్చిత భావం వివాదాస్పదం. ప్రధాన భావాన్ని నిలుపుతూ, మధ్యవర్తిత్వ విధానాన్ని పూర్తిగా నిర్ధారించకుండా పాదసూచికలో ప్రత్యామ్నాయాలను ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మీరే’ నిందారోపణ బలాన్ని నిలుపుతుంది; ‘అయినా’ వాక్యంలోని వ్యతిరేకతను స్పష్టం చేస్తుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
