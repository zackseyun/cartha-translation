id: ACT.7.8
reference: Acts 7:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔδωκεν αὐτῷ διαθήκην περιτομῆς· καὶ οὕτως ἐγέννησεν τὸν Ἰσαὰκ καὶ περιέτεμεν αὐτὸν τῇ ἡμέρᾳ τῇ ὀγδόῃ, ⸀καὶ Ἰσαὰκ τὸν Ἰακώβ, ⸁καὶ Ἰακὼβ τοὺς δώδεκα πατριάρχας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/008.yaml
  text: And he gave him the covenant of circumcision. And so he fathered Isaac and circumcised him on the eighth day, and Isaac fathered Jacob, and Jacob the twelve patriarchs.
translation:
  language: te
  text: దేవుడు అతనికి సున్నతి నిబంధనను ఇచ్చాడు. ఆ విధంగా అబ్రాహాము ఇస్సాకుకు తండ్రి అయ్యి, ఎనిమిదవ రోజున అతనికి సున్నతి చేశాడు. ఇస్సాకు యాకోబుకు తండ్రి అయ్యాడు; యాకోబు పన్నెండు మంది గోత్రపితలకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκην περιτομῆς
  choice: సున్నతి నిబంధనను
  rationale: διαθήκηను బైబిలు చారిత్రక సందర్భానికి తగిన ‘నిబంధన’గా, περιτομῆςను ఆ నిబంధనను నిర్వచించే ‘సున్నతి’గా అనువదించాం. తెలుగులో నిర్దిష్టత సందర్భం మరియు కర్మవిభక్తి ద్వారా స్పష్టమవుతుంది.
- source_word: οὕτως
  choice: ఆ విధంగా
  rationale: ముందు చెప్పిన నిబంధన ప్రసాదానికి తరువాతి సంఘటనతో ఉన్న అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐγέννησεν
  choice: తండ్రి అయ్యాడు
  rationale: పురుష వంశావళి భావాన్ని స్పష్టంగా తెలియజేస్తూ, ప్రాచీనంగా వినిపించే ‘కనెను’ కంటే సాధారణ ఆధునిక పాఠకులకు సహజంగా ఉంటుంది.
- source_word: περιέτεμεν
  choice: సున్నతి చేయించాడు
  rationale: అబ్రాహాము స్వయంగా క్రియ నిర్వహించాడని తప్పనిసరిగా సూచించకుండా, ఇస్సాకుకు సున్నతి జరిగేలా చేశాడనే కారణక భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: ఎనిమిదవ రోజున
  rationale: గ్రీకు కాలసూచక దత్తివును అదనపు వివరణ చేర్చకుండా సహజంగా అనువదిస్తుంది.
- source_word: πατριάρχας
  choice: గోత్రపితలు
  rationale: ఇశ్రాయేలు పన్నెండు గోత్రాలకు మూలపురుషులైన వారిని సూచించే సందర్భార్థాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: Ἰσαὰκ / Ἰακώβ
  choice: ఇస్సాకు / యాకోబు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాలను అనుసరిస్తుంది.
theological_decisions:
- issue: అబ్రాహాముతో చేసిన నిబంధన యొక్క నిర్దిష్టత
  choice: సున్నతి నిబంధనను
  alternative: ఒక సున్నతి నిబంధనను; సున్నతి గుర్తుగల నిబంధనను
  rationale: ఆదికాండము 17లో దేవుడు అబ్రాహాముకు ఇచ్చిన గుర్తించదగిన నిబంధననే వాక్యం సూచిస్తుంది. తెలుగులో ‘ఒక’ను వాడకపోవడం ఆ నిర్దిష్టతను సహజంగా నిలుపుతుంది.
- issue: γεννάω యొక్క వంశావళి భావం
  choice: తండ్రి అయ్యాడు
  alternative: కనెను; జన్మనిచ్చాడు
  rationale: గ్రీకులోని పురుష వంశావళి సంబంధాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది; జీవశాస్త్రీయ ప్రక్రియపై అనవసరమైన భారం వేయదు.
- issue: περιέτεμενలో కార్యసాధకత్వం
  choice: సున్నతి చేయించాడు
  alternative: సున్నతి చేశాడు
  rationale: అబ్రాహాము బాధ్యతలో సున్నతి జరిగిందనే భావాన్ని నిలుపుతూ, ఆ క్రియను అతడే స్వయంగా నిర్వహించాడని పాఠ్యానికి మించి నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. స్పష్టత కోసం తరువాతి రెండు అసమాపక వంశావళి వాక్యాల్లో ‘తండ్రి అయ్యాడు’ను పూరించాం. మూలంలో స్పష్టంగా ఉన్న అబ్రాహాము పేరును మొదటి వాక్యంలోని సర్వనామ సూచనను తేటతెల్లం చేయడానికి రెండో వాక్యంలో ఉపయోగించాం.
