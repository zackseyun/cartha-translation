  text: ⸂καὶ κατέβη⸃ Ἰακὼβ εἰς Αἴγυπτον. καὶ ἐτελεύτησεν αὐτὸς καὶ οἱ πατέρες ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/015.yaml
  text: And Jacob went down into Egypt[a], and he died, he and our fathers.
translation:
  language: te
  text: యాకోబు ఐగుప్తుకు దిగివెళ్లాడు. అతడూ మన పితరులూ[a] చనిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మన పూర్వీకులు.’ గ్రీకు పదానికి అక్షరార్థం ‘మన పితరులు’; ఇక్కడ అది ఇశ్రాయేలు పూర్వపితరులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: దిగివెళ్లాడు
  rationale: καταβαίνωలోని ‘కిందికి వెళ్లడం’ అనే దిశాభావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ఐగుప్తుకు ప్రయాణాన్ని సూచించే భౌగోళిక వాడుకకూ సరిపోతుంది.
- source_word: Ἰακώβ
  choice: యాకోబు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: εἰς Αἴγυπτον
  choice: ఐగుప్తుకు
  rationale: εἰς సూచించే గమ్యస్థాన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐτελεύτησεν
  choice: చనిపోయారు
  rationale: τελευτάωకు స్పష్టమైన, నేరుగా అర్థమయ్యే ఆధునిక తెలుగు సమానం; యాకోబుతో పాటు పితరులు అనే సముచ్చయ కర్త కారణంగా బహువచన క్రియ వాడబడింది.
- source_word: αὐτὸς
  choice: అతడూ
  rationale: గ్రీకులో స్పష్టంగా ఉన్న సర్వనామాన్ని నిలుపుతూ, తరువాతి సముచ్చయంతో సహజంగా కలుపుతుంది.
- source_word: οἱ πατέρες ἡμῶν
  choice: మన పితరులు
  rationale: ఇక్కడ ఇశ్రాయేలు పూర్వపితరులను సూచించే పురుషవాచక చారిత్రక-కుటుంబార్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఇశ్రాయేలు పూర్వీకుల సందర్భంలో πατέρες అనువాదం
  choice: మన పితరులు
  alternative: మన పూర్వీకులు
  rationale: స్తెఫను ఇశ్రాయేలు చరిత్రలోని పురుష పూర్వపితరులతో తననూ తన శ్రోతలనూ అనుసంధానిస్తున్నాడు. అందువల్ల మూలంలోని పురుషవాచక కుటుంబ-చారిత్రక సూచనను సాధారణ లింగతటస్థ పదంతో మార్చకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. గ్రీకు వాక్యంలోని రెండు ఉపవాక్యాలను తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా ఇచ్చాం; ‘అతడూ మన పితరులూ’ అనే నిర్మాణం మూలంలోని αὐτὸς καὶ οἱ πατέρες ἡμῶνను నిలుపుతుంది.
