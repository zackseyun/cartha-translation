id: ACT.7.46
reference: Acts 7:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς εὗρεν χάριν ἐνώπιον τοῦ θεοῦ καὶ ᾐτήσατο εὑρεῖν σκήνωμα τῷ ⸀θεῷ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/046.yaml
  text: who found favor before God and asked to find a dwelling place for the God of Jacob[a].
translation:
  language: te
  text: అతడు దేవుని దృష్టిలో అనుగ్రహం పొందాడు; యాకోబు దేవునికి ఒక నివాసస్థలాన్ని కనుగొనాలని కోరాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యాకోబు దేవునికి ఒక గుడారాన్ని కనుగొనాలని.’
    reason: σκήνωμα అనే పదానికి ‘నివాసస్థలం’తో పాటు ‘గుడారం’ అనే అర్థం కూడా సాధ్యమైనందున పదార్థ ప్రత్యామ్నాయం ఇచ్చాం.
lexical_decisions:
- source_word: εὗρεν χάριν
  choice: అనుగ్రహం పొందాడు
  rationale: χάριν εὑρίσκειν అనే నుడికారం అక్షరార్థంగా అనుగ్రహాన్ని ‘కనుగొనడం’ కంటే ఎవరి అనుగ్రహాన్నైనా పొందడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘అనుగ్రహం పొందాడు’ సహజంగా ఈ సంబంధార్థాన్ని తెలియజేస్తుంది.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: దేవుని అనుగ్రహం పొందాడు
  rationale: ‘దేవుని ఎదుట అనుగ్రహం కనుగొన్నాడు’ అనే మూల నిర్మాణాన్ని తెలుగు నుడికారానికి తగినట్లు ‘దేవుని అనుగ్రహం పొందాడు’గా వ్యక్తం చేశాం; ἐνώπιον సూచించే దేవుని దృష్టిలోని ఆమోదం ఇందులో అంతర్భూతంగా ఉంది.
- source_word: ᾐτήσατο
  choice: అనుమతించమని వేడుకున్నాడు
  rationale: మధ్యమ రూపం ఒక అభ్యర్థన చేయడాన్ని సూచిస్తుంది. అనువర్తి εὑρεῖνతో కలిపి తెలుగులో ఉద్దేశం స్పష్టంగా ఉండేందుకు ‘అనుమతించమని వేడుకున్నాడు’ అని ఇచ్చాం; ఇది దేవునికి చేసిన వినతిని తెలియజేస్తుంది.
- source_word: εὑρεῖν
  choice: కనుగొనడానికి
  rationale: ‘సమకూర్చడానికి’ లేదా ‘నిర్మించడానికి’ అని సందర్భాన్ని ముందుగానే నిర్ధారించకుండా, గ్రీకు క్రియలోని ‘కనుగొను’ భావాన్ని నిలిపాం.
- source_word: σκήνωμα
  choice: ఒక నివాసస్థలం
  rationale: ఈ పదం నివాసం లేదా నివాసస్థలాన్ని విస్తృతంగా సూచిస్తుంది. తరువాతి వచనంలో సొలొమోను కట్టిన మందిరం ప్రస్తావనకు ముందే దీనిని సాంకేతికంగా ‘గుడారం’ లేదా ‘మందిరం’గా పరిమితం చేయలేదు.
- source_word: τῷ θεῷ Ἰακώβ
  choice: యాకోబు దేవునికి
  rationale: దత్తివిభక్తి లబ్ధిదారుని సూచిస్తుంది; ‘యాకోబు దేవుడు’ అనే లేఖనాల్లో పరిచితమైన నిబంధనాత్మక పదబంధాన్ని సహజమైన తెలుగు రూపంలో నిలిపాం.
theological_decisions:
- issue: దావీదు కోరిన నిర్మాణం యొక్క స్వరూపం
  choice: ‘ఒక నివాసస్థలం’ అని విస్తృతార్థంలో అనువదించడం
  alternative: ‘ఒక గుడారం’ లేదా ‘ఒక మందిరం’
  rationale: σκήνωμα అనే గ్రీకు పదం ఇక్కడ నిర్దిష్ట నిర్మాణ రకాన్ని తప్పనిసరిగా నిర్ణయించదు. తరువాత సొలొమోను ‘మందిరం’ కట్టాడనే కథన ప్రవాహంతో ఉన్న ఉద్వేగాన్ని అలాగే ఉంచి, దావీదు కోరింది గుడారమా మందిరమా అనే విషయాన్ని అనువాదంలో ముందుగానే తేల్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ‘అనుగ్రహం పొందాడు’ సాధారణ పాఠకులకు స్పష్టమైన నుడికారం; ‘నివాసస్థలం’ మూలంలోని విస్తృతార్థాన్ని కాపాడుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
