id: ACT.7.32
reference: Acts 7:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγὼ ὁ θεὸς τῶν πατέρων σου, ὁ θεὸς Ἀβραὰμ ⸀καὶ Ἰσαὰκ ⸁καὶ Ἰακώβ. ἔντρομος δὲ γενόμενος Μωϋσῆς οὐκ ἐτόλμα κατανοῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/032.yaml
  text: I am the God of your fathers[a], the God of Abraham and Isaac and Jacob[b]. Then Moses became terrified and did not dare to look closely.
translation:
  language: te
  text: “నేను నీ పితరుల[a] దేవుణ్ణి—అబ్రాహాము, ఇస్సాకు, యాకోబుల దేవుణ్ణి.” అప్పుడు మోషే భయంతో వణికిపోయి, నిశితంగా చూడటానికి సాహసించలేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పితరులు’ అనే పదాన్ని ‘పూర్వీకులు’ అని కూడా అనువదించవచ్చు. ఇక్కడ అది ప్రత్యేకంగా మోషే పూర్వపితరులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పరిశీలించడానికి’ లేదా ‘జాగ్రత్తగా గమనించడానికి.’ గ్రీకు క్రియ నిశితంగా చూడడాన్నీ, శ్రద్ధగా పరిశీలించడాన్నీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ὁ θεὸς τῶν πατέρων σου
  choice: నేను నీ పితరుల దేవుణ్ణి
  rationale: గ్రీకులో క్రియ లేని దైవ స్వపరిచయ వాక్యం ఉంది; సహజమైన తెలుగులో ‘నేను … దేవుణ్ణి’ అని చెప్పడం దాని బలాన్ని నిలుపుతుంది. ‘పితరులు’ అనే పదం మూలంలోని πατέρωνను, దాని ఒడంబడిక సంబంధ ప్రతిధ్వనిని కాపాడుతుంది.
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: అబ్రాహాము, ఇస్సాకు, యాకోబుల దేవుణ్ణి
  rationale: ముగ్గురు పితరుల పేర్లను సహజమైన తెలుగు జాబితాగా ఇచ్చి, ‘దేవుణ్ణి’ అనే సమానాధికార స్వపరిచయాన్ని నిలిపింది.
- source_word: ἔντρομος δὲ γενόμενος
  choice: అప్పుడు మోషే భయంతో వణికిపోయి
  rationale: ἔντρομοςలో భయమూ వణుకూ రెండూ సూచితమవుతాయి. δέ కథనంలోని తదుపరి స్పందనను పరిచయం చేస్తుంది; ‘అప్పుడు’ సహజమైన మార్పును తెలియజేస్తుంది.
- source_word: οὐκ ἐτόλμα
  choice: సాహసించలేదు
  rationale: τολμάωకు ఇక్కడ ‘చేయడానికి ధైర్యం చేయలేదు’ అనే భావం ఉంది; సంక్షిప్తంగా, సహజంగా ‘సాహసించలేదు’ అని అనువదించబడింది.
- source_word: κατανοῆσαι
  choice: నిశితంగా చూడటానికి
  rationale: ఈ క్రియ జాగ్రత్తగా చూడడం, పరిశీలించడం లేదా శ్రద్ధగా గమనించడం అనే భావాలను కలిగి ఉంటుంది. మండుతున్న పొద దృశ్య సందర్భంలో ‘నిశితంగా చూడటం’ దాని దృశ్యార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: నిర్గమకాండం నుంచి ఉటంకించిన దైవ స్వపరిచయాన్ని ఎలా తెలుగులో వ్యక్తం చేయాలి
  choice: నేను నీ పితరుల దేవుణ్ణి
  alternative: నేను, నీ పితరుల దేవుణ్ణి
  rationale: గ్రీకు వాక్యం రూపరీత్యా క్రియలేనిదైనా, తెలుగులో ‘దేవుణ్ణి’ అనే రూపం స్వపరిచయాన్ని సంపూర్ణంగా, సహజంగా చేస్తుంది. మూలంలో లేని అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. దైవ స్వపరిచయంలోని గంభీరతను, మోషే భయ స్పందన తీవ్రతను నిలుపుతూ అతిగా గ్రాంథికమైన పదాలను నివారించాం.
