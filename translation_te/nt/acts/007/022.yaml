source:
  edition: SBLGNT
  text: καὶ ἐπαιδεύθη ⸀Μωϋσῆς πάσῃ σοφίᾳ Αἰγυπτίων, ἦν δὲ δυνατὸς ἐν λόγοις καὶ ἔργοις ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/022.yaml
  text: And Moses was educated in all the wisdom of the Egyptians, and he was mighty in his words and deeds.
translation:
  language: te
  text: మోషే ఐగుప్తీయుల సమస్త జ్ఞానంలో విద్యాభ్యాసం పొందాడు; అతడు మాటల్లోనూ కార్యాల్లోనూ శక్తిమంతుడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మాటల్లోనూ చర్యల్లోనూ సమర్థుడు.’
    reason: λόγοις καὶ ἔργοις అనే పదజంటకు సహజమైన ప్రత్యామ్నాయ తెలుగు రూపాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: ἐπαιδεύθη
  choice: శిక్షణ పొందాడు
  rationale: ఈ కర్మణి రూపం మోషే విస్తృతమైన విద్యాబోధన, రూపుదిద్దే శిక్షణ పొందాడని సూచిస్తుంది. ‘శిక్షణ పొందాడు’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, కేవలం సమాచారం బోధించబడిందనే సంకుచిత భావాన్ని నివారిస్తుంది.
- source_word: πάσῃ σοφίᾳ Αἰγυπτίων
  choice: ఐగుప్తీయుల జ్ఞానమంతటిలో
  rationale: ఈ పదబంధం అతని శిక్షణకు సంబంధించిన పరిధి లేదా విషయాన్ని తెలియజేస్తుంది. ‘జ్ఞానమంతటిలో’ అనేది πάσῃ యొక్క విస్తృతిని నిలుపుతుంది.
- source_word: δυνατὸς
  choice: శక్తిమంతుడిగా
  rationale: δυνατός లోని బలం, ప్రభావం అనే భావాలను ‘శక్తిమంతుడు’ నిలుపుతుంది; ‘సమర్థుడు’ అని అనువదిస్తే భావతీవ్రత కొంత తగ్గుతుంది.
- source_word: ἐν λόγοις καὶ ἔργοις
  choice: మాటల్లోనూ కార్యాల్లోనూ
  rationale: మూలంలోని సమతూకమైన జంటను దగ్గరగా నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వినిపిస్తుంది.
- source_word: αὐτοῦ
  choice: తన
  rationale: ఈ సర్వనామం సమన్వయించబడిన రెండు నామవాచకాలకూ సహజంగా వర్తిస్తుంది; అవి మోషే సొంత మాటలు, కార్యాలు అని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: λόγοις అనే పదంలో మోషే సామర్థ్యపు పరిధి
  choice: ‘తన మాటల్లోనూ కార్యాల్లోనూ శక్తిమంతుడిగా’ అని, వాక్యం చెప్పినట్లుగానే అనువదించబడింది.
  alternative: నిర్గమకాండము 4:10తో కనిపించే ఉద్రిక్తతను తొలగించడానికి దీన్ని మోషే కీర్తి, ప్రభావం లేదా కార్యసామర్థ్యానికి మాత్రమే పరిమితం చేయడం.
  rationale: స్తెఫను చేసిన ప్రకటనను దాని స్వంత భావంలో నిలపాలి. నిర్గమకాండము 4:10లో మోషే తన మాటల సామర్థ్యం గురించి చెప్పిన దానితో కనిపించే ఉద్రిక్తతను వ్యాఖ్యానాత్మకంగా పరిష్కరించకుండా అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ఐగుప్తీయులు,’ ‘కార్యాలు’ వంటి పదాలు బైబిలు సందర్భానికి తగిన గంభీరతను నిలుపుతాయి; అతిగా ప్రాచీనమైన రూపాలు నివారించబడ్డాయి.
