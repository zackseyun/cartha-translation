id: ACT.7.35
reference: Acts 7:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τοῦτον τὸν Μωϋσῆν, ὃν ἠρνήσαντο εἰπόντες· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστήν, τοῦτον ὁ θεὸς ⸀καὶ ἄρχοντα καὶ λυτρωτὴν ⸂ἀπέσταλκεν σὺν⸃ χειρὶ ἀγγέλου τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/035.yaml
  text: This Moses[a], whom they rejected, saying, ‘Who appointed you a ruler and a judge?’—this man God sent as both ruler and redeemer by the hand of the angel who appeared to him in the bush.
translation:
  language: te
  text: “‘నిన్ను పాలకునిగా, న్యాయాధిపతిగా నియమించినవాడు ఎవరు?’ అని చెప్పి వారు తిరస్కరించిన ఈ మోషేనే, పొదలో అతనికి కనిపించిన దూత ద్వారా, దేవుడు పాలకునిగా, విమోచకునిగా[a] పంపాడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విడిపించేవానిగా.” గ్రీకు పదం విడుదల లేదా విముక్తి కలిగించే వ్యక్తిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρνήσαντο
  choice: తిరస్కరించిన
  rationale: ఇక్కడ మోషే అధికారాన్ని అంగీకరించకపోవడం ఉద్దేశం; ‘తిరస్కరించారు’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: κατέστησεν
  choice: నియమించినవాడు
  rationale: అధికార స్థానంలో ఉంచడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నియమించు’ స్పష్టమైన పదం.
- source_word: ἄρχοντα
  choice: పాలకుడు
  rationale: అధికారం చలాయించే వ్యక్తి అనే అధికారిక భావాన్ని నిలుపుతుంది; వచనంలోని పునరుక్త వ్యంగ్యాన్ని కూడా కాపాడుతుంది.
- source_word: δικαστήν
  choice: న్యాయాధిపతి
  rationale: తీర్పు చెప్పే అధికారిని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: λυτρωτὴν
  choice: విమోచకుడు
  rationale: విడుదల కలిగించే వ్యక్తి అనే అర్థంతో పాటు విమోచన భావాన్ని కూడా నిలుపుతుంది; తెలుగులో ‘విమోచకుడు’ సహజమైన బైబిలీయ పదం.
- source_word: ἀπέσταλκεν
  choice: పంపాడు
  rationale: గ్రీకు పరిపూర్ణ కాలంలోని పూర్తయిన పంపింపును తెలుగు కథన శైలిలో సహజంగా తెలియజేస్తుంది.
- source_word: σὺν χειρὶ ἀγγέλου
  choice: దూత ద్వారా
  rationale: గ్రీకు-సెమిటిక్ ప్రయోగంలోని సాధనకర్త/మధ్యవర్తిత్వ భావాన్ని సహజ తెలుగులో అందిస్తుంది; అక్షరార్థమైన ‘చేతితో’ ఇక్కడ అపార్థం కలిగించవచ్చు.
- source_word: τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ
  choice: పొదలో అతనికి కనిపించిన
  rationale: కర్మణి రూపాన్ని తెలుగు సందర్భంలో సహజమైన ‘కనిపించిన’గా అందిస్తుంది; మూలంలో లేని ‘మండుతున్న’ అనే పదాన్ని చేర్చదు.
- source_word: Τοῦτον ... τοῦτον
  choice: ఈ మోషేనే
  rationale: రెండుసార్లు వచ్చిన సూచనాసర్వనామాల బలాన్ని తెలుగులో ఏకీకృతమైన ఉద్ఘాటనతో నిలుపుతుంది; వాక్యాన్ని కృత్రిమంగా చేయదు.
- source_word: καὶ ἄρχοντα καὶ λυτρωτὴν
  choice: పాలకునిగా, విమోచకునిగా
  rationale: రెండు పాత్రలను సమాంతరంగా, స్పష్టంగా చూపుతుంది; తెలుగు విభక్తి నిర్మాణమే గ్రీకు repeated καί యొక్క జత భావాన్ని సహజంగా మోస్తుంది.
theological_decisions:
- issue: రక్షణ చరిత్రలో మోషే పాత్రను తెలిపే λυτρωτής అనువాదం
  choice: విమోచకుడు
  alternative: విడిపించేవాడు
  rationale: ‘విమోచకుడు’ విడుదల, విమోచన అనే రెండు ఛాయలను నిలుపుతుంది. ఇది మోషేను దేవుడు పంపిన విమోచన సాధనకర్తగా చూపుతుంది గానీ, పాఠం చెప్పనంత పూర్తి క్రీస్తు-సమీకరణను దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. మూలంలోని ఉద్ఘాటనను ‘ఈ మోషేనే’ ద్వారా నిలిపి, ‘చేతి ద్వారా’ అనే కృత్రిమ పదబంధం బదులు సహజమైన ‘దూత ద్వారా’ వాడబడింది.
