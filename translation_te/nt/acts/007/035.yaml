- from: “‘నిన్ను పాలకునిగా, న్యాయాధిపతిగా నియమించినవాడు ఎవరు?’ అని అంటూ వారు తిరస్కరించిన ఈ మోషేనే—పొదలో అతనికి కనిపించిన దూత ద్వారా దేవుడు పాలకునిగా, విమోచకునిగా[a] పంపాడు.”
  to: “‘నిన్ను పాలకునిగా, న్యాయాధిపతిగా నియమించినవాడు ఎవరు?’ అని చెప్పి వారు తిరస్కరించిన ఈ మోషేనే, పొదలో అతనికి కనిపించిన దూత ద్వారా, దేవుడు పాలకునిగా, విమోచకునిగా[a] పంపాడు.”
  rationale: A small idiomatic correction removes the redundant “అని అంటూ.” The revised wording preserves the Greek rhetorical emphasis, the two offices (“ruler and redeemer”), and the angel’s instrumental role, without adding “burning” to the bush or importing further theological conclusions.
