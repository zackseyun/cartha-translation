translation:
  language: te
  text: వీటన్నిటినీ నా చెయ్యి చేయలేదా?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత భావానువాదంగా: “వీటన్నిటినీ నేనే చేయలేదా?”'
    reason: lexical_alternative
  - marker: b
    text: ఈ వాక్యం యెషయా 66:2ను ప్రతిధ్వనింపజేస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: οὐχὶ
  choice: చేయలేదా?
  rationale: οὐχί సానుకూల సమాధానాన్ని ఆశించే అలంకారప్రశ్నను పరిచయం చేస్తుంది. తెలుగులో నిషేధార్థక ప్రశ్నారూపం ఆ బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἡ χείρ μου
  choice: నా చెయ్యే
  rationale: χείρ అక్షరార్థంగా ‘చెయ్యి’. యెషయా 66:2 ప్రతిధ్వనిలోని దేవునికి మానవ అవయవాన్ని ఆపాదించే సజీవ రూపకాన్ని నిలుపుతూ, ‘ఏ’ నొక్కుతో దైవిక కర్తృత్వాన్ని స్పష్టం చేస్తుంది.
- source_word: ἐποίησεν
  choice: చేయలేదా
  rationale: ποιέω ఇక్కడ ఉనికిలోకి తేవడం లేదా నిర్మించడం అనే విస్తృత భావంలో ఉంది. ‘చేయు’ మూలపాఠంలోని సాధారణ క్రియను, దాని సృష్టి సందర్భాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: ταῦτα πάντα
  choice: వీటన్నిటినీ
  rationale: ταῦτα లోని సూచనార్థాన్నీ πάντα లోని సమగ్రతనూ సహజమైన ఆధునిక తెలుగులో పూర్తిగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుని గురించి మానవరూప వర్ణన
  choice: దైవిక కర్తృత్వాన్ని సూచించే ‘నా చెయ్యే’ అనే రూపాన్ని నిలుపడం
  alternative: ‘వీటన్నిటినీ నేనే చేయలేదా?’ అని భావానువాదం చేయడం
  rationale: ఇది యెషయా 66:2ను ప్రతిధ్వనింపజేస్తుంది. ‘నా చెయ్యి’ అనే రూపాన్ని ఉంచడం లేఖనంలోని సజీవ చిత్రణను, అలంకారప్రశ్న బలాన్ని కాపాడుతుంది; దానిని ‘శక్తి’ వంటి అమూర్త భావంగా వ్యాఖ్యానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. ‘చెయ్యి’ సాధారణ ఆధునిక రూపం; ‘నా చెయ్యే’లోని నొక్కు మూలంలోని కర్తృత్వ భావాన్ని స్పష్టంగా వినిపిస్తుంది.
