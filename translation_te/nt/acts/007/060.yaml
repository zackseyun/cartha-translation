  source_fidelity: The draft preserves the sequence of kneeling, loud crying, the address ‘Lord,’ the request not to reckon the specific sin against the perpetrators, and the Greek sleep metaphor for Stephen’s death. ‘వారిమీద మోపవద్దు’ communicates the intended forensic sense adequately.
  naturalness: ‘మోకాళ్లూని’ and ‘ఇలా చెప్పి’ are natural modern-standard Telugu. However, ‘పెద్ద స్వరంతో ... కేక వేశాడు’ is a less idiomatic, somewhat redundant-calqued expression. ‘బిగ్గరగా కేక వేశాడు’ is more natural while retaining the explicit loud cry.
  terminology: ‘ప్రభువా’ is the appropriate established rendering of Κύριε in this context. ‘ఈ పాపాన్ని’ correctly retains the demonstrative. ‘నిద్రించాడు,’ with a clarifying note, preserves the source’s death euphemism without flattening it to ‘చనిపోయాడు.’
