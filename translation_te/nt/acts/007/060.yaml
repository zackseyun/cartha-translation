source:
  edition: SBLGNT
  text: θεὶς δὲ τὰ γόνατα ἔκραξεν φωνῇ μεγάλῃ· Κύριε, μὴ στήσῃς αὐτοῖς ⸂ταύτην τὴν ἁμαρτίαν⸃· καὶ τοῦτο εἰπὼν ἐκοιμήθη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/060.yaml
  text: Then[a], kneeling down, he cried out with a loud voice, “Lord, do not hold this sin against them.” And after saying this[b], he fell asleep.
translation:
  language: te
  text: అప్పుడు అతడు మోకాళ్లూని, “ప్రభువా, ఈ పాపాన్ని వారిమీద మోపవద్దు” అని బిగ్గరగా కేక వేశాడు. ఇలా చెప్పి అతడు నిద్రించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నిద్రించాడు” అనేది ఇక్కడ మరణాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὶς δὲ τὰ γόνατα
  choice: అప్పుడు అతడు మోకాళ్లూని
  rationale: గ్రీకు నుడికారం అక్షరార్థంగా ‘మోకాళ్లు ఉంచి’ అని ఉన్నా, సహజమైన ఆధునిక తెలుగులో శరీర చర్యను స్పష్టంగా తెలిపే ‘మోకాళ్లూని’ సరైన సమానార్థకం. δέ కథన పురోగతిని సూచించే ‘అప్పుడు’గా అనువదించబడింది.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: పెద్ద స్వరంతో ... కేక వేశాడు
  rationale: κράζω బిగ్గరగా కేక వేయడాన్ని సూచిస్తుంది; φωνῇ μεγάλῃను ప్రత్యేకంగా ‘పెద్ద స్వరంతో’ అని ఉంచడం మూలంలోని ఉద్ఘాటనను కాపాడుతుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: సందర్భంలో యేసును ఉద్దేశించిన గౌరవపూర్వక సంబోధనను, నూతన నిబంధనలో κύριος అనే బిరుదు ప్రయోగాన్ని ‘ప్రభువా’ సహజంగా కాపాడుతుంది.
- source_word: μὴ στήσῃς αὐτοῖς ταύτην τὴν ἁμαρτίαν
  choice: ఈ పాపాన్ని వారిమీద మోపవద్దు
  rationale: ఇక్కడ ἵστημι ఒకరి ఖాతాలో పాపాన్ని ఉంచడం లేదా వారికి దాన్ని ఆపాదించడం అనే భావాన్ని కలిగిస్తుంది. ‘వారిమీద మోపవద్దు’ న్యాయపరమైన భావాన్ని సహజ తెలుగులో నిలుపుతుంది; ‘ఈ’ అనేది ταύτηνను స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: καὶ τοῦτο εἰπὼν
  choice: ఇలా చెప్పి
  rationale: కృదంత నిర్మాణంలోని కాలక్రమ సంబంధాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐκοιμήθη
  choice: అతడు నిద్రించాడు
  rationale: κοιμάομαι ఇక్కడ మరణానికి వాడిన రూపకం. దాన్ని ‘చనిపోయాడు’గా సరళీకరించకుండా, మూలపాఠంలోని నిద్ర రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ἐκοιμήθηలోని మరణ రూపకాన్ని అనువదించడం
  choice: అతడు నిద్రించాడు
  alternative: అతడు చనిపోయాడు
  rationale: గ్రీకు పాఠం స్తెఫను మరణాన్ని నిద్ర రూపకంతో వ్యక్తం చేస్తుంది. అనువాదంలో ఆ రూపకాన్ని నిలిపి, పాదటిప్పణిలో దాని సందర్భార్థాన్ని తెలియజేయడం పాఠంలోని భావతీవ్రతను, ఉద్దేశపూర్వక అస్పష్టతను కాపాడుతుంది.
- issue: స్తెఫను ప్రార్థనలో Κύριε సంబోధన
  choice: ప్రభువా
  alternative: యజమానా
  rationale: ముందరి వచన సందర్భంలో ఈ సంబోధన యేసుకు చేయబడింది. ‘ప్రభువా’ గ్రీకు బిరుదును, గౌరవాన్ని నిలుపుతుంది; వచనంలో అదనపు వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘మోకాళ్లూని,’ ‘పెద్ద స్వరంతో,’ ‘వారిమీద మోపవద్దు’ అనే పదబంధాలు మూలంలోని శరీర చర్య, ఉద్ఘాటన, న్యాయపరమైన భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తాయి. ప్రధాన పాఠంలో నిద్ర రూపకం యథాతథంగా నిలుపబడి, దాని మరణార్థం పాదటిప్పణిలో వివరించబడింది.
