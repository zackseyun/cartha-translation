source:
  edition: SBLGNT
  text: καὶ ἐμοσχοποίησαν ἐν ταῖς ἡμέραις ἐκείναις καὶ ἀνήγαγον θυσίαν τῷ εἰδώλῳ, καὶ εὐφραίνοντο ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/041.yaml
  text: And in those days they made a calf and offered a sacrifice to the idol[b][a], and they were rejoicing in the works of their hands.
translation:
  language: te
  text: ఆ రోజుల్లో వారు ఒక దూడను తయారుచేసి[a], ఆ దూడ విగ్రహానికి బలి అర్పించారు; మరియు తమ చేతుల పనులలో ఆనందిస్తూ ఉండేవారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక దూడను మలిచి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తమ చేతులు చేసిన కృతులలో ఆనందిస్తూ ఉండేవారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοσχοποίησαν
  choice: ఒక దూడను తయారుచేశారు
  rationale: క్రియకు దూడను చేయడం లేదా రూపుకల్పించడం అనే అర్థం ఉంది. తరువాత దానిని స్పష్టంగా ‘విగ్రహం’ అని పేర్కొనడం వల్ల ఇక్కడ ‘దూడ’ అని సహజంగా అనువదించడం సరిపోతుంది.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: ఆ రోజుల్లో
  rationale: గ్రీకు కాలసూచక పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: ἀνήγαγον θυσίαν
  choice: బలి అర్పించారు
  rationale: బలిసంబంధ సందర్భంలో ఈ పదబంధం బలిని సమర్పించడాన్ని సూచిస్తుంది; ‘బలి అర్పించారు’ తెలుగులో స్పష్టమైన, సహజమైన ఆరాధనా ప్రయోగం.
- source_word: τῷ εἰδώλῳ
  choice: ఆ విగ్రహానికి
  rationale: నిర్దిష్ట ఉపపదం ముందే ప్రస్తావించిన దూడనే సూచిస్తుంది. ‘విగ్రహం’ అనే పదం εἴδωλον లోని విగ్రహారాధనాపరమైన ప్రతికూల భావాన్ని నిలుపుతుంది.
- source_word: εὐφραίνοντο
  choice: ఆనందిస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న క్రియను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ కాలాంశాన్ని నిలుపుతుంది.
- source_word: ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν
  choice: తమ చేతులతో చేసిన దానిని బట్టి
  rationale: గ్రీకులోని చేతుల పని అనే రూపకాన్ని సహజమైన తెలుగులో నిలుపుతూ, వారి ఆనందానికి ఆ వస్తువే కారణం లేదా ఆధారం అనే సంబంధాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: విగ్రహారాధనను తెలిపే భాష మరియు వాక్చాతుర్య బలం
  choice: εἴδωλον ను ‘విగ్రహం’గా అనువదించి, వారు తమ చేతులతో దానిని చేశారనే చిత్రణను నిలుపడం.
  alternative: ‘ప్రతిమ’; ‘తాము చేసిన దానిని బట్టి’ అని చేతుల ప్రస్తావనను వదలడం.
  rationale: స్తెఫను ప్రసంగం ఇశ్రాయేలు విగ్రహారాధనను ఖండించే లేఖన భాషను ప్రతిధ్వనింపజేస్తుంది. ‘విగ్రహం’ మరియు ‘తమ చేతులతో చేసినది’ అనే పదాలు ఆ ఖండనను మృదువుపరచకుండా నిలుపుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘తయారుచేశారు’ సహజత్వాన్ని, ‘విగ్రహం’, ‘బలి అర్పించారు’, ‘తమ చేతులతో’ అనే పదాలు మూలంలోని ఆరాధనా మరియు విగ్రహారాధన ఖండన భావాలను నిలుపుతాయి.
