source:
  edition: SBLGNT
  text: Καθὼς δὲ ἤγγιζεν ὁ χρόνος τῆς ἐπαγγελίας ἧς ⸀ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ, ηὔξησεν ὁ λαὸς καὶ ἐπληθύνθη ἐν Αἰγύπτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/017.yaml
  text: But as the time of the promise that God had made to Abraham was drawing near[a], the people increased and multiplied in Egypt,
translation:
  language: te
  text: అయితే దేవుడు అబ్రాహాముకు చేసిన వాగ్దానం నెరవేరే సమయం సమీపిస్తుండగా[a], ఐగుప్తులో ఆ ప్రజలు పెరిగి అనేకమయ్యారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుడు అబ్రాహాముకు వాగ్దానంగా ప్రకటించినది నెరవేరే సమయం.’ ఇక్కడి గ్రీకు క్రియ ప్రకటించిన నిబద్ధతను సూచించగలదు; ‘చేసిన వాగ్దానం’ సహజమైన తెలుగు ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς δὲ
  choice: అయితే ... సమీపిస్తుండగా
  rationale: καθώς యొక్క కాలసంబంధ భావాన్ని ‘-తుండగా’తో, δέ సూచించే స్వల్ప సంధి/మలుపును ‘అయితే’తో సహజంగా వ్యక్తం చేస్తుంది; బలమైన వ్యతిరేకతను కల్పించదు.
- source_word: ἤγγιζεν
  choice: సమీపిస్తుండగా
  rationale: అసంపూర్ణ భూతకాల రూపం సూచించే కొనసాగుతున్న సమీపతను ఈ ప్రయోగం సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὁ χρόνος τῆς ἐπαγγελίας
  choice: వాగ్దానం నెరవేరే సమయం
  rationale: పదశః ‘వాగ్దానపు సమయం’ తెలుగులో అస్పష్టంగా ఉంటుంది. సందర్భంలో వాగ్దానం కార్యరూపం దాల్చే సమయం ఉద్దేశించబడినందున, అదనపు సిద్ధాంతార్థం చేర్చకుండా సహజంగా స్పష్టం చేయబడింది.
- source_word: ἧς ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ
  choice: దేవుడు అబ్రాహాముకు చేసిన
  rationale: సంబంధవాచక నిర్మాణాన్ని ‘దేవుడు అబ్రాహాముకు చేసిన వాగ్దానం’గా సహజ తెలుగు పదక్రమంలో ఇచ్చింది. ὡμολόγησεν ఇక్కడ ప్రకటిత నిబద్ధతను సూచిస్తుంది; ‘చేసిన’ అనేది ‘వాగ్దానం చేయడం’ అనే సహజ కలయికలో సరిపోతుంది.
- source_word: ηὔξησεν ὁ λαὸς
  choice: ఆ ప్రజలు వృద్ధి చెందారు
  rationale: λαός ఇక్కడ ఇశ్రాయేలు ప్రజాసమూహాన్ని సూచిస్తుంది. ‘వృద్ధి చెందారు’ జనసంఖ్య పెరుగుదలను తెలియజేస్తూ, తరువాతి క్రియతో ఉన్న పదభేదాన్ని నిలుపుతుంది.
- source_word: καὶ ἐπληθύνθη
  choice: విస్తరించారు
  rationale: ‘వృద్ధి చెందారు’ అనే మొదటి క్రియను యథాతథంగా పునరావృతం చేయకుండా, ప్రజలు బహుగా అయ్యారనే రెండవ సమాంతర భావాన్ని ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν Αἰγύπτῳ
  choice: ఐగుప్తులో
  rationale: Αἴγυπτοςకు తెలుగు బైబిలు వాడుకలో సుపరిచితమైన స్థలనామ రూపం; ἐν యొక్క స్థానార్థాన్ని ‘లో’ స్పష్టంగా ఇస్తుంది.
theological_decisions:
- issue: అబ్రాహాముకు దేవుడు చేసిన వాగ్దానానికి సంబంధించిన ὡμολόγησεν అనువాదం
  choice: ‘దేవుడు అబ్రాహాముకు చేసిన వాగ్దానం’
  alternative: ‘దేవుడు అబ్రాహాముకు వాగ్దానం చేసిన వాగ్దానం’; ‘దేవుడు అబ్రాహాముకు హామీ ఇచ్చిన వాగ్దానం’; ‘దేవుడు అబ్రాహాముకు ప్రమాణం చేసిన వాగ్దానం’
  rationale: ‘చేసిన వాగ్దానం’ సహజమైన తెలుగు ప్రయోగం; దేవుని ప్రకటిత నిబద్ధతను తెలియజేస్తుంది. ‘ప్రమాణం చేసిన’ అని అనువదిస్తే మూలంలోని క్రియ స్పష్టంగా చెప్పని ప్రమాణ భాషను అనవసరంగా బలపరుస్తుంది.
- issue: ‘వాగ్దానపు సమయం’ యొక్క సందర్భార్థం
  choice: ‘వాగ్దానం నెరవేరే సమయం’
  alternative: ‘వాగ్దానపు సమయం’
  rationale: ఈ సందర్భంలో సమీపిస్తున్నది వాగ్దానం పలికిన సమయం కాదు, అది నెరవేర్పు దిశగా చేరే సమయం. ‘నెరవేరే’ అనే పదం సందర్భసంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది; నెరవేర్పు యొక్క విధానాన్ని లేదా సంపూర్ణతను ముందుగానే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన బైబిలు శైలి. ‘అయితే’ స్వల్ప వాక్యసంధిని, ‘సమీపిస్తుండగా’ కొనసాగుతున్న కాలభావాన్ని నిలుపుతాయి. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో చేర్చబడింది.
