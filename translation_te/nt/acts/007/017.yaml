  to: అయితే దేవుడు అబ్రాహాముకు చేసిన వాగ్దానం నెరవేరే సమయం సమీపిస్తుండగా[a], ఐగుప్తులో ఆ ప్రజలు పెరిగి అనేకమయ్యారు.
