  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε ἐξελθὼν ἐκ γῆς Χαλδαίων κατῴκησεν ἐν Χαρράν. κἀκεῖθεν μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ μετῴκισεν αὐτὸν εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/004.yaml
  text: Then, after he had gone out from the land of the Chaldeans, he settled in Haran. And from there, after his father died, God moved him into this land in which you now live,
translation:
  language: te
  text: అప్పుడు అతడు కల్దీయుల దేశం నుంచి బయలుదేరి హారానులో స్థిరపడ్డాడు. అక్కడి నుంచి, అతని తండ్రి మరణించిన తర్వాత, దేవుడు అతణ్ణి మీరు ఇప్పుడు నివసిస్తున్న ఈ దేశంలోకి తరలించాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన అతణ్ణి ఈ దేశంలోకి తరలించాడు.” గ్రీకు పాఠ్యంలో ఈ క్రియకు కర్తను వ్యక్తంగా పేర్కొనలేదు; అయితే సందర్భం దేవుణ్ణే సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ తరలింపు అతని తండ్రి మరణించిన తర్వాత జరిగిందని స్తెఫను చెబుతున్నాడు. దీనికి సంబంధించిన కాలక్రమం కోసం ఆదికాండము 11:32; 12:4 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: తర్వాత జరిగిన సంఘటనను పరిచయం చేసే సహజమైన కాలసూచక పదం.
- source_word: ἐξελθὼν ἐκ γῆς Χαλδαίων
  choice: కల్దీయుల దేశం నుంచి బయలుదేరి
  rationale: అయోరిస్ట్ కృదంతం ప్రధాన క్రియకు ముందున్న చర్యను సూచిస్తుంది; తెలుగు క్రమబద్ధ క్రియారూపం సహజంగా ఆ వరుసను నిలుపుతుంది.
- source_word: κατῴκησεν ἐν Χαρράν
  choice: హారానులో నివసించాడు
  rationale: κατοικέω ఇక్కడ ఒక చోట నివాసం ఏర్పరచుకొని ఉండడాన్ని సూచిస్తుంది; ‘నివసించాడు’ ఆధునిక, గౌరవప్రదమైన సాధారణ తెలుగు.
- source_word: κἀκεῖθεν
  choice: అక్కడి నుంచి
  rationale: καί + ἐκεῖθενలోని కథన అనుసంధానం తెలుగులో వాక్యక్రమం ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ
  choice: అతని తండ్రి చనిపోయిన తర్వాత
  rationale: μετάతో కూడిన ఆర్టిక్యులర్ ఇన్ఫినిటివ్ తెలిపే కాలక్రమాన్ని స్పష్టంగా, ఎలాంటి సమన్వయ మార్పు లేకుండా అందిస్తుంది.
- source_word: μετῴκισεν αὐτὸν
  choice: దేవుడు అతణ్ణి … తీసుకొచ్చాడు
  rationale: μετοικίζω ఒకరిని మరో చోటికి తరలించి నివసింపజేయడాన్ని సూచిస్తుంది. గ్రీకులో కర్త వ్యక్తంగా లేకపోయినా ముందరి సందర్భం దేవుణ్ణే కర్తగా సూచిస్తుంది; ‘తీసుకొచ్చాడు’ గమ్యస్థాన దృష్టితో సహజమైన తెలుగు.
- source_word: εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε
  choice: మీరు ఇప్పుడు నివసిస్తున్న ఈ దేశానికి
  rationale: గమనం మరియు ప్రస్తుత నివాసం రెండింటినీ సంక్షిప్తమైన సహజ తెలుగు సంబంధవాక్యంతో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: μετῴκισεν అనే క్రియకు వ్యక్తంగా లేని కర్త
  choice: ప్రధాన పాఠ్యంలో ‘దేవుడు’ అని స్పష్టంగా ఇవ్వడం
  alternative: ‘ఆయన అతణ్ణి’ అని కర్తను అస్పష్టంగా ఉంచడం
  rationale: గ్రీకు క్రియలో కర్త నామవాచకంగా లేకపోయినా, స్తెఫను ప్రసంగంలోని సమీప సందర్భం దేవుణ్ణే క్రియకర్తగా సూచిస్తుంది. పాఠకునికి స్పష్టతనిస్తూ, పాదటిప్పణిలో మూలంలోని వ్యాకరణ అస్పష్టతను తెలియజేస్తుంది.
- issue: తెరహు మరణం మరియు అబ్రాహాము తరలింపు కాలక్రమం
  choice: ‘అతని తండ్రి చనిపోయిన తర్వాత’ అని అపొస్తలుల కార్యములలో ఉన్న క్రమాన్నే అనువదించడం
  alternative: ఆదికాండముతో కాలక్రమాన్ని సమన్వయపరచేలా వాక్యాన్ని మార్చడం
  rationale: మూల గ్రీకు తెలిపే క్రమాన్ని మార్చకుండా, సంబంధిత ఆదికాండ భాగాలను పాదటిప్పణిలో సూచించడం ద్వారా పాఠ్యంలోని నిజమైన ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ‘కల్దీయుల దేశం’, ‘హారాను’ వంటి బైబిలు భౌగోళిక పదాలకు గౌరవప్రదమైన స్థిరరూపాలు వాడబడ్డాయి. గ్రీకులోని కర్త అస్పష్టతను ప్రధాన పాఠ్యంలో సందర్భానుసారంగా స్పష్టం చేసి పాదటిప్పణిలో సంరక్షించాం; కాలక్రమ ఉద్రిక్తతను సమన్వయపరచలేదు.
