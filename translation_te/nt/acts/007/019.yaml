source:
  edition: SBLGNT
  text: οὗτος κατασοφισάμενος τὸ γένος ἡμῶν ἐκάκωσεν τοὺς ⸀πατέρας τοῦ ποιεῖν ⸂τὰ βρέφη ἔκθετα⸃ αὐτῶν εἰς τὸ μὴ ζῳογονεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/019.yaml
  text: This man[a], having dealt shrewdly with our people, mistreated our fathers[c][b], causing their infants to be exposed so that they would not be kept alive.
translation:
  language: te
  text: అతడు[a] మన ప్రజలతో కపటంగా వ్యవహరించి, మన పూర్వీకులపై[c] దుర్వ్యవహారం చేశాడు; వారి పసిబిడ్డలను బయట వదిలివేసేలా చేసి, ఆ పసిబిడ్డలు బ్రతికి ఉండకుండా చేశాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ వ్యక్తి.”
    reason: lexical_alternative
  - marker: b
    text: అంటే, పసిబిడ్డలు చనిపోయేలా వారిని బయట వదిలివేయడం.
    reason: cultural_note
  - marker: c
    text: అక్షరార్థంగా, “మన తండ్రులు”; ఇక్కడ భావం “మన పూర్వీకులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: అతడు
  rationale: ముందు ప్రస్తావించిన రాజును సూచించే గ్రీకు నిర్దేశక సర్వనామ బలాన్ని సందర్భానుసారంగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κατασοφισάμενος
  choice: కపటంగా వ్యవహరించి
  rationale: ఈ కృదంతం సూచించే తెలివితో కూడిన మోసపూరిత వ్యవహారాన్ని ప్రతికూల సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: τὸ γένος ἡμῶν
  choice: మన ప్రజలు
  rationale: ఇక్కడ γένος ఇశ్రాయేలు జాతి ప్రజలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘మన ప్రజలు’ సహజంగా, అపార్థం లేకుండా ఉంటుంది.
- source_word: ἐκάκωσεν
  choice: బాధపెట్టాడు
  rationale: హాని చేయడం, దుర్వ్యవహారం చేయడం అనే విస్తృత భావాన్ని సందర్భానికి తగినట్లు నిలుపుతుంది.
- source_word: τοὺς πατέρας
  choice: మన పూర్వీకులు
  rationale: అక్షరార్థమైన ‘తండ్రులు’ కంటే ఇక్కడ ఉద్దేశించిన గత తరాల ఇశ్రాయేలీయులను ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: τοῦ ποιεῖν
  choice: వారిని ... పారవేయించేలా చేశాడు
  rationale: ఆర్టిక్యులర్ ఇన్ఫినిటివ్‌ను కారణం లేదా ఫలితంగా సహజంగా వ్యక్తం చేస్తూ, మూలంలో స్పష్టంగా లేని బలవంతపు భావాన్ని అదనంగా చేర్చదు.
- source_word: τὰ βρέφη ἔκθετα
  choice: వారి పసిబిడ్డలను బయట పారవేయించడం
  rationale: βρέφη యొక్క చిన్నపిల్లల భావాన్నీ, ἔκθετα సూచించే బయట విడిచిపెట్టే ఆచారాన్నీ సాధారణ పాఠకునికి అర్థమయ్యేలా తెలియజేస్తుంది.
- source_word: εἰς τὸ μὴ ζῳογονεῖσθαι
  choice: బ్రతకకుండా
  rationale: వారిని సజీవంగా ఉంచకూడదనే ఉద్దేశం లేదా ఫలితం రెండింటికీ అవకాశం ఉంచే సంక్షిప్త సహజ అనువాదం.
