lexical_decisions:
- source_word: ἄχρι οὗ
  choice: వచ్చేంతవరకు
  rationale: ముందటి పరిస్థితి ఒక కొత్త రాజు అధికారంలోకి వచ్చిన సమయం వరకు కొనసాగిందనే కాలపరిమితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀνέστη
  choice: అధికారానికి వచ్చే
  rationale: రాజు విషయంగా వాడిన ἀνέστη అనే పదం ఇక్కడ అతడు ఉద్భవించడం లేదా అధికారంలోకి రావడాన్ని సూచిస్తుంది. తెలుగులో ‘లేచాడు’ అనడం అసహజంగా, తప్పుదారి పట్టించేలా ఉండవచ్చు; అందువల్ల సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: βασιλεὺς ἕτερος
  choice: మరో రాజు
  rationale: βασιλεύς కు ‘రాజు’ ప్రత్యక్ష సమానార్థం; ἕτερος ముందున్నవాడికి భిన్నమైన ఇంకొక రాజును సూచిస్తుంది. ‘మరో రాజు’ సహజంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: ἐπ’ Αἴγυπτον
  choice: ఐగుప్తుమీద
  rationale: రాజు అనే పదంతో కలిసి ἐπί + accusative ఐగుప్తుపై పాలనాధికారాన్ని సూచిస్తుంది. ‘ఐగుప్తుమీద’ మూలంలోని నిర్మాణాన్నీ, ఆధిపత్య భావాన్నీ నిలుపుతుంది.
- source_word: οὐκ ᾔδει τὸν Ἰωσήφ
  choice: అతడు యోసేపును ఎరుగనివాడు
  rationale: οἶδα యొక్క ప్రత్యక్ష భావమైన ‘ఎరుగుట’ను నిలుపుతూ, ఆ మాటలో ‘గుర్తించకపోవడం/గౌరవించకపోవడం’ అనే సందర్భసాధ్య సూచనను ప్రధాన పాఠ్యంలో నిర్ధారించకుండా ఉంచుతుంది.
