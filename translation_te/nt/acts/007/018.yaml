    text: గ్రీకు క్రియకు అక్షరార్థంగా ‘లేచాడు’ లేదా ‘ఉద్భవించాడు’ అని అర్థం; ఇక్కడ ‘ఐగుప్తుపై రాజుగా అధికారంలోకి వచ్చాడు’ అనే భావం.
