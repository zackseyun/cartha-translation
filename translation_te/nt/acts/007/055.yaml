id: ACT.7.55
reference: Acts 7:55
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑπάρχων δὲ πλήρης πνεύματος ἁγίου ἀτενίσας εἰς τὸν οὐρανὸν εἶδεν δόξαν θεοῦ καὶ Ἰησοῦν ἑστῶτα ἐκ δεξιῶν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/055.yaml
  text: But being full of the Holy Spirit[a], he gazed into heaven and saw the glory of God, and Jesus standing at the right hand of God[b],
translation:
  language: te
  text: అయితే అతడు పవిత్రాత్మతో నిండి ఉండి, పరలోకం వైపు తదేకంగా చూసి[a], దేవుని మహిమను, దేవుని కుడివైపున నిలబడి ఉన్న యేసును చూశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పరలోకం వైపు దృష్టి నిలిపి చూసి.’
    reason: lexical_alternative
  - marker: b
    text: ‘దేవుని కుడివైపున’ అనేది అత్యున్నత గౌరవం, అధికారం గల స్థానాన్ని సూచించే బైబిలు నుడికారం.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπάρχων
  choice: నిండివుండి అనే నిర్మాణంలో ‘ఉండి’
  rationale: వర్తమాన కృదంతం స్తెఫను కొనసాగుతున్న స్థితిని ప్రధాన క్రియకు నేపథ్యంగా చూపుతుంది; తెలుగులో ‘ఉండి’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πλήρης πνεύματος ἁγίου
  choice: పవిత్రాత్మతో నిండివుండి
  rationale: ఇది ఆత్మతో సంపూర్ణంగా నింపబడిన స్థితిని తెలిపే లూకా రచనలకు సాధారణమైన ప్రయోగం. ‘పవిత్రాత్మ’ వ్యక్తిగత దైవిక సూచనను సహజంగా నిలుపుతుంది.
- source_word: ἀτενίσας
  choice: తదేకంగా చూసి
  rationale: సాధారణంగా చూడడం కంటే దృష్టిని నిలిపి, ఏకాగ్రంగా చూడడాన్ని ఈ పదం సూచిస్తుంది.
- source_word: εἰς τὸν οὐρανόν
  choice: పరలోకం వైపు
  rationale: ఈ దర్శన సందర్భంలో οὐρανός కేవలం కనిపించే ఆకాశాన్ని కాక దేవుని పరలోక సంబంధిత పరిధిని సూచిస్తుంది; ‘వైపు’ గ్రీకు దిశార్థక ప్రయోగాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: εἶδεν
  choice: చూశాడు
  rationale: ప్రధాన క్రియను స్పష్టమైన, ఆధునిక తెలుగు భూతకాల రూపంలో అందిస్తుంది.
- source_word: δόξαν θεοῦ
  choice: దేవుని మహిమను
  rationale: గ్రీకు సంబంధవాచక నిర్మాణాన్ని సంక్షిప్తంగా, పారదర్శకంగా తెలియజేస్తుంది; సందర్భంలోని దేవుని మహిమ ప్రత్యక్షమవుతున్న భావాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: Ἰησοῦν
  choice: యేసును
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం; వాక్యంలో కర్మవిభక్తి అవసరానికి అనుగుణంగా ఉంది.
- source_word: ἑστῶτα
  choice: నిలబడి ఉన్న
  rationale: పరిపూర్ణ కృదంతం యేసు నిలిచివున్న భంగిమను స్పష్టంగా వర్ణిస్తుంది; దానిని కూర్చున్నట్టు లేదా కేవలం అక్కడ ఉన్నట్టు మార్చదు.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: దేవుని కుడివైపున
  rationale: ἐκ δεξιῶν అనే స్థిరప్రయోగాన్ని పదశః ‘కుడివైపు నుండి’ అని కాక, సందర్భానుసారమైన స్థానార్థంతో సహజ తెలుగులో అందిస్తుంది.
- source_word: δέ
  choice: అయితే
  rationale: ముందటి వచనంలోని విరోధభావంతో ఉన్న జనసమూహానికి, స్తెఫను స్థితికి మధ్య ఉన్న స్వల్ప వ్యత్యాసాన్ని చూపుతుంది.
theological_decisions:
- issue: πνεύματος ἁγίου వ్యక్తిగత దైవిక సూచనా, లేక కేవలం పవిత్రమైన ఆత్మ/స్వభావమా
  choice: పవిత్రాత్మ
  alternative: పవిత్రమైన ఆత్మ
  rationale: లూకా–అపొస్తలుల కార్యముల వాడుకలో, ఈ కథన సందర్భంలో ఇది దైవిక పవిత్రాత్మను సూచిస్తుంది. అనువాదం పాఠ్యంలో ఉన్నదానికంటే అదనపు సిద్ధాంత వివరణను చేర్చదు.
- issue: దేవుని కుడివైపున యేసు నిలబడిన దర్శనం
  choice: దేవుని కుడివైపున నిలబడి ఉన్న యేసు
  alternative: దేవుని కుడివైపు నుండి నిలబడి ఉన్న యేసు
  rationale: ఈ రూపం దేవునికీ యేసుకీ పాఠ్యంలో ఉన్న భేదాన్ని నిలుపుతూ, యేసు మహోన్నత గౌరవస్థానాన్ని సూచించే బైబిలు రూపకాన్ని కూడా కాపాడుతుంది. ‘నిలబడి ఉన్న’ అనే భంగిమను వ్యాఖ్యానాత్మకంగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘తదేకంగా’ దర్శనంలోని ఏకాగ్ర దృష్టిని సంక్షిప్తంగా తెలియజేస్తుంది; ‘పరలోకం’ ఈ సందర్భాన్ని కేవలం భౌతిక ఆకాశానికి పరిమితం చేయదు. ప్రధాన పాఠ్యంలోని [a], [b] గుర్తులు వాటి సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
