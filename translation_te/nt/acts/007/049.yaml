id: ACT.7.49
reference: Acts 7:49
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁ οὐρανός μοι θρόνος, ⸂ἡ δὲ⸃ γῆ ὑποπόδιον τῶν ποδῶν μου· ποῖον οἶκον οἰκοδομήσετέ μοι, λέγει κύριος, ἢ τίς τόπος τῆς καταπαύσεώς μου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/049.yaml
  text: Heaven is my throne[a], and the earth is the footstool for my feet. What kind of house will you build for me, says the Lord, or what is the place of my rest?
translation:
  language: te
  text: ‘ఆకాశం నాకు సింహాసనం; భూమి నా పాదాలకు పాదపీఠం. మీరు నా కోసం ఎలాంటి ఇల్లు కడతారు? లేక నా విశ్రాంతి స్థలం ఏది?’ అని ప్రభువు అంటున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρανός
  choice: ఆకాశం
  rationale: భూమికి వ్యతిరేకంగా దేవుని పరలోక పరిధిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఆకాశం’ ఈ కవితాత్మక విశ్వవ్యాప్త జతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: θρόνος
  choice: సింహాసనం
  rationale: రాజాధికారానికి సంబంధించిన మూల రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: γῆ
  choice: భూమి
  rationale: ఆకాశంతో జతగా ఉన్నందున ఇక్కడ ఒక దేశం లేదా నేల కాక, విశ్వవ్యాప్తమైన భూమినే సూచిస్తుంది.
- source_word: ὑποπόδιον τῶν ποδῶν μου
  choice: నా పాదాలకు పాదపీఠం
  rationale: గ్రీకు పదబంధంలోని పాదపీఠం మరియు పాదాలు రెండింటినీ నిలుపుతూ, తెలుగులో సహజంగా ఉంటుంది.
- source_word: ποῖον
  choice: ఎలాంటి
  rationale: కేవలం ఏది అని గుర్తింపును కాక, దాని రకం లేదా స్వభావాన్ని ప్రశ్నించే భావాన్ని తెలియజేస్తుంది.
- source_word: οἶκον
  choice: మందిరం
  rationale: మూలార్థం ‘ఇల్లు’ అయినప్పటికీ, దేవుని కోసం కట్టే గృహం అనే సందర్భార్థాన్ని తెలుగులో ‘మందిరం’ సహజంగా తెలియజేస్తుంది; ‘ఆలయం’ కంటే విస్తృతంగా ఉండి రూపకాన్ని పూర్తిగా ప్రత్యేక పదంగా మార్చదు.
- source_word: οἰκοδομήσετέ
  choice: కడతారు
  rationale: భవిష్యత్ సూచకంలోని అలంకారిక ప్రశ్నను సహజమైన తెలుగు క్రియారూపంలో నిలుపుతుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: కొత్త నిబంధన గ్రీకు κύριοςకు ప్రామాణికమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం.
- source_word: τόπος τῆς καταπαύσεώς μου
  choice: నేను విశ్రమించే స్థలం
  rationale: ‘నా విశ్రాంతి స్థలం’ అనే మరింత నామవాచక నిర్మాణం కంటే ఆధునిక తెలుగులో సహజంగా ఉండి, దైవిక విశ్రాంతి భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యెషయా ఉల్లేఖనంలో ఇశ్రాయేలు దేవునికి వాడిన κύριος అనువాదం
  choice: ప్రభువు
  alternative: యెహోవా
  rationale: అపొస్తలుల కార్యముల గ్రీకు మూలపాఠంలో κύριος ఉంది. పాత నిబంధన హెబ్రీ మూలాన్ని నేరుగా పునర్నిర్మించకుండా, కొత్త నిబంధన ఉల్లేఖనంలోని పదాన్ని ‘ప్రభువు’గా అనువదించడం మూలాధారానికి నిబద్ధంగా ఉంటుంది.
- issue: οἶκος పదంలోని ‘ఇల్లు’ మరియు దేవాలయ సందర్భం మధ్య ఉద్రిక్తత
  choice: మందిరం
  alternative: ఇల్లు
  rationale: సందర్భంలో దేవుని కోసం నిర్మించే పవిత్ర గృహం ఉద్దేశించబడింది. ‘మందిరం’ సాధారణ పాఠకునికి ఆ భావాన్ని సహజంగా అందిస్తుంది; అయితే ప్రత్యేకంగా ‘దేవాలయం’ అని చేసి మూలంలోని విస్తృత రూపకాన్ని మరీ కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, పఠనయోగ్యమైన కవితాత్మక వాక్యనిర్మాణం. మూలంలోని రెండు అలంకారిక ప్రశ్నలు, ఆకాశం–భూమి సమాంతరత, సింహాసనం–పాదపీఠం రాజరూపకం నిలుపబడ్డాయి.
