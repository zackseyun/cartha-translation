review_pass:
  verdict: revise
  source_fidelity: ‘మందిరం’ is contextually understandable, but οἶκος explicitly means ‘house’ in the quotation and should not be narrowed to a sacred building. ‘నేను విశ్రమించే స్థలం’ communicates the sense but recasts the Greek noun phrase ‘the place of my rest’; a possessive-nominal rendering better preserves it.
  naturalness: The Telugu is generally fluent, dignified, and suitable for a biblical quotation. ‘నా విశ్రాంతి స్థలం’ is both natural modern Telugu and closer to the source construction.
  terminology: ‘ఆకాశం,’ ‘సింహాసనం,’ ‘భూమి,’ ‘పాదపీఠం,’ and ‘ప్రభువు’ are appropriate. Retaining ‘ఇల్లు’ for οἶκος preserves the wording without prematurely interpreting it as ‘temple.’
  issues:
  - severity: medium
    issue: οἶκον is rendered ‘మందిరం’ rather than ‘ఇల్లు.’
    rationale: The Greek quotation says ‘house.’ Though the immediate context concerns the temple, ‘మందిరం’ narrows the wording and loses the source’s deliberately broader expression.
  - severity: low
    issue: τῆς καταπαύσεώς μου is rendered with a relative clause, ‘నేను విశ్రమించే స్థలం.’
    rationale: This is intelligible, but ‘నా విశ్రాంతి స్థలం’ preserves the explicit possessive ‘my’ and the noun ‘rest’ more closely while remaining idiomatic.
  revised_text: ‘ఆకాశం నాకు సింహాసనం; భూమి నా పాదాలకు పాదపీఠం. మీరు నా కోసం ఎలాంటి ఇల్లు కడతారు? లేక నా విశ్రాంతి స్థలం ఏది?’ అని ప్రభువు అంటున్నాడు.
  revised_footnotes: []
