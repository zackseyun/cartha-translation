revisions:
- from: ‘ఆకాశం నాకు సింహాసనం; భూమి నా పాదాలకు పాదపీఠం. మీరు నా కోసం ఎలాంటి మందిరం కడతారు? లేక నేను విశ్రమించే స్థలం ఏది?’ అని ప్రభువు అంటున్నాడు.
  to: ‘ఆకాశం నాకు సింహాసనం; భూమి నా పాదాలకు పాదపీఠం. మీరు నా కోసం ఎలాంటి ఇల్లు కడతారు? లేక నా విశ్రాంతి స్థలం ఏది?’ అని ప్రభువు అంటున్నాడు.
  rationale: The revision restores the lexical breadth of οἶκος as ‘ఇల్లు’ and represents τόπος τῆς καταπαύσεώς μου with the corresponding Telugu nominal phrase ‘నా విశ్రాంతి స్థలం.’ The rhetorical questions, cosmic parallelism, royal imagery, and rendering of κύριος as ‘ప్రభువు’ are retained.
  reviewer_model: gpt-5.6-terra
