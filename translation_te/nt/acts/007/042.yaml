id: ACT.7.42
reference: Acts 7:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔστρεψεν δὲ ὁ θεὸς καὶ παρέδωκεν αὐτοὺς λατρεύειν τῇ στρατιᾷ τοῦ οὐρανοῦ, καθὼς γέγραπται ἐν βίβλῳ τῶν προφητῶν· Μὴ σφάγια καὶ θυσίας προσηνέγκατέ μοι ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ, οἶκος Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/042.yaml
  text: 'But God turned away and gave them over to serve the host of heaven[a], just as it is written in the book of the prophets: ‘Did you offer to me slain offerings and sacrifices for forty years in the wilderness[d][c][b], O house of Israel?’'
translation:
  language: te
  text: 'కానీ దేవుడు వారి నుండి ముఖం తిప్పుకొని, ఆకాశ సైన్యాన్ని సేవించడానికి[a] వారిని అప్పగించాడు. ప్రవక్తల గ్రంథంలో[b] ఇలా వ్రాయబడి ఉంది:


    “ఇశ్రాయేలు వంశమా, అరణ్యంలో నలభై సంవత్సరాలు

    వధించిన బలిపశువులను, బలులను మీరు నాకు అర్పించారా?[c]”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆకాశ సైన్యాన్ని ఆరాధించడానికి.” గ్రీకు క్రియ మతపరమైన సేవను లేదా ఆరాధనను సూచించగలదు. “ఆకాశ సైన్యం” అనేది ఖగోళ వస్తువులకు, విగ్రహారాధనలో వాటితో అనుసంధానించబడిన శక్తులకు ఉపయోగించే బైబిలు వ్యక్తీకరణ.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: లేదా, “ప్రవక్తల గ్రంథపు చుట్టలో.”
    reason: lexical_alternative
  - marker: c
    text: ఈ ప్రశ్న ప్రతికూల జవాబును ఆశిస్తుంది.
    reason: discourse_note
  - marker: d
    text: ఆమోసు 5:25 నుండి ఉల్లేఖనం.
    reason: cross_reference
lexical_decisions:
- source_word: ἔστρεψεν
  choice: వారి నుండి ముఖం తిప్పుకొని
  rationale: దేవుడు కేవలం భౌతికంగా తిరిగాడనే భావం కాకుండా, తిరుగుబాటుకు ప్రతిస్పందనగా సంబంధపరంగా వైదొలిగిన న్యాయతీర్పు భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: παρέδωκεν
  choice: వారిని అప్పగించాడు
  rationale: న్యాయతీర్పుగా వారి ఎంపికల పర్యవసానాలకు వారిని విడిచిపెట్టడం లేదా అప్పగించడం అనే తీవ్రమైన భావాన్ని నిలుపుతుంది; దేవుడే విగ్రహారాధనకు కారకుడయ్యాడని చెప్పదు.
- source_word: λατρεύειν
  choice: సేవించడానికి
  rationale: ఈ క్రియ మతపరమైన సేవను లేదా ఆరాధనను సూచించగలదు. ‘సేవించడానికి’ మూలంలోని విస్తృతిని నిలుపుతుంది; ఆరాధన భావాన్ని పాదటిప్పణి స్పష్టం చేస్తుంది.
- source_word: τῇ στρατιᾷ τοῦ οὐρανοῦ
  choice: ఆకాశ సైన్యాన్ని
  rationale: ఇది ఆకాశంలోని ఖగోళ వస్తువులను, వాటితో అనుసంధానించబడిన శక్తులను సూచించే ప్రామాణిక బైబిలు వ్యక్తీకరణ. మూలంలోని రూపకాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: ἐν βίβλῳ τῶν προφητῶν
  choice: ప్రవక్తల గ్రంథంలో
  rationale: βίβλος ‘గ్రంథం’ లేదా చారిత్రకంగా ‘చుట్ట’ అని అర్థమవుతుంది. ప్రధాన పాఠ్యంలో ‘గ్రంథం’ ఆధునిక పాఠకులకు సహజంగా ఉంది.
- source_word: Μὴ ... προσηνέγκατέ μοι
  choice: మీరు నాకు అర్పించారా?
  rationale: μήతో మొదలయ్యే ప్రశ్న ప్రతికూల జవాబును ఆశిస్తుంది. తెలుగు ప్రశ్నారూపం ప్రవచనంలోని అలంకారిక సవాలును సందర్భంలో నిలుపుతుంది.
- source_word: σφάγια καὶ θυσίας
  choice: వధించిన అర్పణలను, బలులను
  rationale: σφάγιαలోని వధించబడిన బలి అర్పణల భావాన్నీ, θυσίαςలోని సాధారణ బలుల భావాన్నీ వేరుగా నిలుపుతుంది.
- source_word: οἶκος Ἰσραήλ
  choice: ఇశ్రాయేలు వంశమా
  rationale: ‘ఇశ్రాయేలు ఇంటివారలారా’ కంటే ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, సమూహ వంశాన్ని సంబోధించే భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: న్యాయతీర్పులో దేవుని చర్య
  choice: ‘ముఖం తిప్పుకొని ... అప్పగించాడు’ అని అనువదించడం
  alternative: దేవుడు కేవలం అనుమతించాడు; లేదా వారిని స్వయంగా విగ్రహారాధన చేయించాడు
  rationale: జతగా ఉన్న గ్రీకు క్రియలు గత తిరుగుబాటుకు ప్రతిస్పందనగా దేవుని న్యాయపరమైన వైదొలగింపును సూచిస్తాయి. ఈ రూపం దేవుని తీర్పును నిలుపుతూ, పాపానికి ఆయనే సానుకూల కర్త అన్న భావాన్ని రానివ్వదు.
- issue: ‘ఆకాశ సైన్యం’ యొక్క సూచన
  choice: వ్యక్తీకరణను తెరిచి ఉంచడం
  alternative: దేవదూతలు మాత్రమే; లేదా నక్షత్రాలు మాత్రమే
  rationale: ఈ సందర్భంలో అది విగ్రహారాధనకు గురైన ఖగోళ వస్తువులు లేదా వాటితో అనుసంధానమైన శక్తులను సూచిస్తుంది. మూలం కంటే ఎక్కువగా నిర్దిష్టం చేయకుండా నిజమైన అర్థవిస్తృతిని నిలుపుతుంది.
- issue: ఆమోసు 5:25లోని అలంకారిక ప్రశ్న
  choice: ప్రతికూల జవాబును ఆశించే ప్రశ్నగానే ఉంచడం
  alternative: ‘మీరు నాకు అర్పించలేదు’ అని ప్రకటనగా మార్చడం
  rationale: మూలంలోని ప్రశ్నారూపం ప్రవచనాత్మక ఉద్రిక్తతను, సవాలును నిలుపుతుంది; దాని భావాన్ని వ్యాఖ్యానంగా సూటిగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి వాడబడింది. ప్రవచన ఉల్లేఖనాన్ని కవితా పంక్తులుగా అమర్చాం. ‘ఆకాశ సైన్యం,’ ‘అప్పగించాడు,’ ‘వంశమా’ వంటి పదాలు బైబిలు అంతర్పాఠ్య సంబంధాన్ని, న్యాయతీర్పు తీవ్రతను కాపాడుతాయి; అస్పష్టత ఉన్న చోట పాదటిప్పణులు ప్రత్యామ్నాయాన్ని తెలియజేస్తాయి.
