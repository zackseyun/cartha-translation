source:
  edition: SBLGNT
  text: καὶ ἰδών τινα ἀδικούμενον ἠμύνατο καὶ ἐποίησεν ἐκδίκησιν τῷ καταπονουμένῳ πατάξας τὸν Αἰγύπτιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/024.yaml
  text: And when he saw someone being wronged[b][a], he defended him and brought justice for the one being oppressed by striking down the Egyptian.
translation:
  language: te
  text: అన్యాయానికి గురవుతున్న ఒకరిని అతడు చూసి, అతనికి అండగా నిలిచాడు; ఆ ఐగుప్తీయుణ్ణి కొట్టి[b], అణచివేతకు గురవుతున్నవాని పక్షాన ప్రతీకారం తీర్చాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అణచివేతకు గురవుతున్నవానికి న్యాయం చేశాడు.’ గ్రీకు పదబంధం ప్రతీకారం తీర్చడం లేదా బాధితుని పక్షాన న్యాయం చేయడం అనే భావాలను కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆ ఐగుప్తీయుణ్ణి దెబ్బకొట్టి.’ గ్రీకు క్రియకు సాధారణంగా ‘కొట్టు’ అని అర్థం; ఈ సందర్భంలో ఆ దెబ్బ ప్రాణాంతకమైందని నిర్గమకాండము 2లోని వృత్తాంతం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδών
  choice: చూసి
  rationale: గ్రీకు భూతకాల కృదంతం ప్రధాన చర్యలకు ముందున్న సందర్భాన్ని సూచిస్తుంది; తెలుగులో ‘చూసి’ సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: τινα
  choice: ఒకరిని
  rationale: నిర్దిష్టంగా గుర్తించని వ్యక్తిని సూచించే అనిశ్చిత సర్వనామం; మూలంలో లేని ‘మనిషి’ అనే నామవాచకాన్ని చేర్చదు.
- source_word: ἀδικούμενον
  choice: అన్యాయానికి గురవుతున్న
  rationale: ἀδικέω యొక్క కర్మణి కృదంతం అన్యాయం అనుభవించడాన్ని సూచిస్తుంది; నైతిక భావాన్ని, కొనసాగుతున్న చర్యను రెండింటినీ నిలుపుతుంది.
- source_word: ἠμύνατο
  choice: అతనికి అండగా నిలిచాడు
  rationale: ἀμύνομαι ఇక్కడ దాడికి గురైనవాని రక్షణకు రావడం లేదా అతనికి సహాయం చేయడం అనే భావాన్ని ఇస్తుంది.
- source_word: ἐποίησεν ἐκδίκησιν
  choice: ప్రతీకారం తీర్చాడు
  rationale: ఈ గ్రీకు ప్రయోగం ప్రతీకారం చేయడం, న్యాయం జరిగేలా చేయడం, లేదా బాధితుని పక్షాన తీర్పు తీర్చడం అనే పరిధిని కలిగి ఉంది; ‘ప్రతీకారం తీర్చాడు’ మూలంలోని బలమైన avenging భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: τῷ καταπονουμένῳ
  choice: అణచివేతకు గురవుతున్నవాని పక్షాన
  rationale: καταπονέω తీవ్రమైన అణచివేత లేదా వేధింపును సూచిస్తుంది; దత్తివిభక్తి బాధితుని ప్రయోజనార్థం చేసిన చర్యగా ఇక్కడ వ్యక్తమవుతుంది.
- source_word: πατάξας
  choice: కొట్టి
  rationale: πατάσσω యొక్క ప్రాథమిక అర్థం ‘కొట్టు’; సందర్భంలో మరణం సంభవించినప్పటికీ, క్రియ స్వయంగా తప్పనిసరిగా ‘చంపు’ అని చెప్పదు.
- source_word: τὸν Αἰγύπτιον
  choice: ఆ ఐగుప్తీయుణ్ణి
  rationale: నిర్దిష్ట జాతివాచక నామాన్ని సహజమైన తెలుగు రూపంలో అందిస్తుంది; ‘ఆ’ నిర్దిష్ట ఉపపద భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: మోషే చర్యలో ἐκδίκησιν యొక్క భావఛాయ
  choice: ప్రధాన పాఠంలో ‘ప్రతీకారం తీర్చాడు’; పాదసూచికలో న్యాయం/పక్షాన తీర్పు అనే ప్రత్యామ్నాయం
  alternative: ‘అణచివేతకు గురవుతున్నవానికి న్యాయం చేశాడు’
  rationale: మూల పదబంధం ప్రతీకారం, న్యాయసాధన, బాధితుని పక్షాన తీర్పు అనే భావాల మధ్య ఉద్రిక్తతను కలిగి ఉంది. ప్రధాన పాఠం బలమైన భావాన్ని నిలుపుతుండగా, పాదసూచిక న్యాయసంబంధ ప్రత్యామ్నాయాన్ని వెల్లడిస్తుంది; మోషే వ్యక్తిగత ప్రతీకారాన్ని సిద్ధాంతపరంగా సమర్థిస్తున్నట్టు అదనంగా చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘అండగా నిలిచాడు’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది. ‘ప్రతీకారం తీర్చాడు’ మరియు పాదసూచికలోని ‘న్యాయం చేశాడు’ కలిసి మూలంలోని ఉద్దేశపూర్వక భావవ్యాప్తిని నిలుపుతాయి.
