  terminology: ‘మోషే,’ ‘ప్రవక్త,’ ‘దేవుడు,’ and ‘సోదరులు’ are suitable. ‘ఒక ప్రవక్త’ properly avoids imposing the interpretive capitalization ‘the Prophet.’
