  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ Μωϋσῆς ὁ ⸀εἴπας τοῖς υἱοῖς Ἰσραήλ· Προφήτην ὑμῖν ἀναστήσει ⸂ὁ θεὸς⸃ ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/037.yaml
  text: This is the Moses who said to the sons of Israel[a], ‘God will raise up for you a prophet from among your brothers[c][b], like me.’
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులకు[a], ‘మీ సోదరులలోనుండి[b] నా వంటి ఒక ప్రవక్తను దేవుడు మీ కోసం లేపుతాడు’ అని చెప్పిన మోషే ఇతడే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఇశ్రాయేలు కుమారులు’ అనే మాటను ‘ఇశ్రాయేలీయులు’ అని కూడా అనువదించవచ్చు; గ్రీకులో అక్షరార్థంగా ‘కుమారులు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘సోదరులు’ అంటే తోటి ఇశ్రాయేలీయులు; గ్రీకు పదం పుంలింగ బహువచనంలో ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ Μωϋσῆς
  choice: మోషే ఇతడే
  rationale: గ్రీకు వాక్యంలోని నిర్దిష్టమైన, నొక్కిచెప్పే గుర్తింపును సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: εἴπας
  choice: అని చెప్పిన
  rationale: మోషేను విశేషించే భూతకాల కృదంతాన్ని తెలుగులో సహజమైన సంబంధార్థక నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: ఇశ్రాయేలు కుమారులతో
  rationale: υἱοῖς అనే పుంలింగ బహువచన రూపాన్ని, పాత నిబంధన ఉల్లేఖన ప్రతిధ్వనిని సాధ్యమైనంత స్పష్టంగా నిలుపుతుంది.
- source_word: Προφήτην
  choice: ఒక ప్రవక్తను
  rationale: మూలంలో నిర్దిష్ట ఉపపదం లేనందున వ్యాఖ్యానాత్మకంగా ‘ఆ ప్రవక్త’ అని నిర్ణయించకుండా సాధారణ నిర్దిష్టతలేని భావాన్ని ఇస్తుంది.
- source_word: ἀναστήσει
  choice: లేపుతాడు
  rationale: దేవుడు ఒక ప్రవక్తను ఉద్భవింపజేయడం లేదా ముందుకు తేవడం అనే సందర్భార్థాన్ని, మూల క్రియ యొక్క రూపకబలాన్ని నిలుపుతూ వ్యక్తపరుస్తుంది.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: మీ సోదరులలోనుండి
  rationale: ἐκ యొక్క సమూహం లోపలినుండి అనే మూలార్థాన్ని, ఇక్కడి తోటి ఇశ్రాయేలీయుల కుటుంబ-జాతీయ భావాన్ని నిలుపుతుంది.
- source_word: ὡς ἐμέ
  choice: నా వంటి
  rationale: మోషేతో పోలికను నేరుగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ద్వితీయోపదేశకాండము 18:15 ఉల్లేఖనం మరియు దాని మెస్సీయ సంబంధ ప్రాధాన్యం
  choice: ప్రధాన పాఠ్యంలో ‘ఒక ప్రవక్త’ అని అనువదించడం
  alternative: ‘ఆ ప్రవక్త’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: అపొస్తలుల కార్యముల సందర్భంలో ఈ మాట యేసుకు వర్తించినప్పటికీ, ఇక్కడి గ్రీకు Προφήτην నిర్దిష్ట ఉపపదం లేకుండా ఉంది. అందువల్ల క్రీస్తు సంబంధ అన్వయాన్ని ప్రధాన పాఠ్యంలో ముందుగానే బలవంతంగా నిర్ణయించకుండా మూలంలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘మోషే ఇతడే’ అనే పదక్రమం మూలంలోని నొక్కిచెప్పే గుర్తింపును సహజంగా చూపుతుంది. ఉల్లేఖనంలో ‘మీ కోసం’ను క్రియకు దగ్గరగా ఉంచి తెలుగు ప్రవాహాన్ని కాపాడాం.
