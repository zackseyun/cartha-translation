  text: ἦλθεν δὲ λιμὸς ἐφ’ ὅλην τὴν ⸀Αἴγυπτον καὶ Χανάαν καὶ θλῖψις μεγάλη, καὶ οὐχ ηὕρισκον χορτάσματα οἱ πατέρες ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/011.yaml
  text: A famine came over all Egypt and Canaan[a], and great distress, and our fathers could not find food.
translation:
  language: te
  text: ఐగుప్తు దేశమంతటా, కనాను దేశమంతటా కరవు వచ్చింది; తీవ్రమైన కష్టం కలిగింది. మన పితరులకు ఆహారం దొరకలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మన పూర్వీకులకు.” గ్రీకులో “మన పితరులకు” అని ఉంది; ఇది ఇశ్రాయేలు పూర్వపితరులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν δὲ λιμὸς
  choice: అప్పుడు ... కరవు వచ్చింది
  rationale: ἦλθεν అనే ఘటనాత్మక భావాన్ని ‘వచ్చింది’ సహజంగా వ్యక్తం చేస్తుంది; δέ కథన పురోగతిని సూచిస్తున్నందున తెలుగు ప్రవాహంలో ‘అప్పుడు’గా ఇచ్చాం.
- source_word: ἐφ’ ὅλην τὴν Αἴγυπτον καὶ Χανάαν
  choice: ఐగుప్తు దేశమంతటా, కనాను దేశంలోనూ
  rationale: ἐπί + accusative సూచించే భౌగోళిక విస్తృతిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ὅλην నేరుగా ‘దేశమంతటా’లో నిలుస్తుంది.
- source_word: θλῖψις μεγάλη
  choice: తీవ్రమైన కష్టం
  rationale: కరవుతో కూడిన గొప్ప బాధాకర పరిస్థితిని సూచిస్తుంది; అంత్యకాల సంబంధమైన ప్రత్యేక అర్థాన్ని అనవసరంగా దిగుమతి చేయదు.
- source_word: οὐχ ηὕρισκον
  choice: దొరకలేదు
  rationale: అపూర్ణ భూతకాలం సంక్షోభకాలంలో కొనసాగిన లభ్యతలేమిని సూచిస్తుంది; తెలుగులో సందర్భానుసారంగా సహజమైన రూపం.
- source_word: χορτάσματα
  choice: ఆహారం
  rationale: తినడానికి కావలసిన ఆహార సరఫరాలను విస్తృతంగా సూచిస్తుంది; ‘ధాన్యం’ అని సంకుచితం చేయలేదు.
- source_word: οἱ πατέρες ἡμῶν
  choice: మన పితరులు
  rationale: గ్రీకు వాక్యంలోని పుంలింగ కుటుంబపదాన్ని, ఇశ్రాయేలు పూర్వపితరుల సూచనను నిలుపుతుంది.
theological_decisions:
- issue: పూర్వీకులను సూచించే పుంలింగ భాష
  choice: మన పితరులు
  alternative: మన పూర్వీకులు
  rationale: οἱ πατέρες ἡμῶν అక్షరార్థంగా ‘మన తండ్రులు/పితరులు’; ఇక్కడ ఇశ్రాయేలు పూర్వపితరులను సూచిస్తున్నందున మూలంలోని పుంలింగ చారిత్రక సూచనను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి. ‘పితరులు’ బైబిలు సందర్భంలో సాధారణ పాఠకులకు అర్థమయ్యే చారిత్రక పదం. పాదసూచిక గుర్తును దానికి సంబంధించిన ‘మన పితరులకు’ తరువాత ఉంచాం.
