  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν ᾧ καιρῷ ἐγεννήθη Μωϋσῆς, καὶ ἦν ἀστεῖος τῷ θεῷ· ὃς ἀνετράφη μῆνας τρεῖς ἐν τῷ οἴκῳ τοῦ πατρός·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/020.yaml
  text: At that time Moses was born[a], and he was beautiful to God. He was brought up for three months in his father's house.
translation:
  language: te
  text: ఆ కాలంలో మోషే పుట్టాడు. అతడు దేవుని దృష్టిలో అందమైనవాడిగా ఉన్నాడు[a]. తన తండ్రి ఇంట్లో మూడు నెలలపాటు పెంచబడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవునికి అందమైనవాడిగా.” ఇక్కడి గ్రీకు పదాన్ని “చక్కనివాడు” లేదా “సుందరుడు” అని కూడా అనువదించవచ్చు; అయితే మూలపాఠంలో దేవుని ప్రస్తావన స్పష్టంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ καιρῷ
  choice: ఆ కాలంలో
  rationale: కాలసూచనను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐγεννήθη
  choice: పుట్టాడు
  rationale: జనన సందర్భంలో వాడిన గ్రీకు కర్మణి రూపానికి సహజమైన తెలుగు వ్యక్తీకరణ.
- source_word: Μωϋσῆς
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ἀστεῖος
  choice: అందమైనవాడిగా
  rationale: ఈ విశేషణంలోని సౌందర్యం లేదా చక్కదనం అనే ప్రాథమిక భావాన్ని నిలుపుతుంది; ‘ప్రత్యేకమైనవాడు’ అని అతిగా వ్యాఖ్యానించదు.
- source_word: τῷ θεῷ
  choice: దేవుని దృష్టిలో
  rationale: దేవుని గురించిన స్పష్టమైన సూచనను నిలుపుతూ, ఈ దత్తివిభక్తి మూల్యాంకనం లేదా దృష్టికోణాన్ని సూచిస్తుందనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀνετράφη
  choice: పెంచబడ్డాడు
  rationale: ఇతరులు అతణ్ణి పోషించి పెంచారనే కర్మణి భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: μῆνας τρεῖς
  choice: మూడు నెలలపాటు
  rationale: కాలవ్యవధిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῷ οἴκῳ τοῦ πατρός
  choice: తన తండ్రి ఇంట్లో
  rationale: కుటుంబ గృహాన్ని సూచించే గ్రీకు పదబంధాన్ని సహజంగా, స్పష్టంగా అనువదిస్తుంది.
theological_decisions:
- issue: ἀστεῖος τῷ θεῷ అనే పదబంధం భావం
  choice: దేవుని దృష్టిలో అందమైనవాడిగా
  alternative: దేవునికి అందమైనవాడిగా; దేవుని దృష్టిలో విశిష్టమైనవాడిగా; కేవలం చక్కని బిడ్డగా
  rationale: గ్రీకు వాక్యంలో దేవుని ప్రస్తావన స్పష్టంగా ఉంది; అందువల్ల దానిని తొలగించలేదు. అదే సమయంలో ‘దేవునిచే ఎన్నుకోబడినవాడు’ వంటి అదనపు సిద్ధాంతార్థాన్ని చేర్చకుండా, దేవుని మూల్యాంకన దృష్టిని మాత్రమే వ్యక్తం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన శైలి. గ్రీకు వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుసరించకుండా మూడు సహజ తెలుగు వాక్యాలుగా ఇచ్చి, మూలంలోని అర్థసంబంధాలను నిలిపింది.
