id: ACT.7.31
reference: Acts 7:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Μωϋσῆς ἰδὼν ⸀ἐθαύμασεν τὸ ὅραμα. προσερχομένου δὲ αὐτοῦ κατανοῆσαι ἐγένετο φωνὴ ⸀κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/031.yaml
  text: 'When Moses saw it[a], he marveled at the sight. And as he came near to look closely[c][b], a voice of the Lord came:'
translation:
  language: te
  text: మోషే దానిని చూసి, ఆ దృశ్యానికి ఆశ్చర్యపోయాడు. దానిని నిశితంగా చూడడానికి అతడు దగ్గరికి వెళ్తుండగా, ప్రభువు స్వరం వినిపించింది:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రభువు స్వరం వచ్చింది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: దానిని చూసి
  rationale: కాలసూచక భూతకాల కృదంతాన్ని సహజమైన తెలుగు పూర్వకాల క్రియగా ఇచ్చాం; ‘దానిని’ అనేది వెంట వచ్చే దృశ్యాన్ని సూచిస్తుంది.
- source_word: ἐθαύμασεν
  choice: ఆశ్చర్యపోయాడు
  rationale: θαυμάζω ఇక్కడ ఆశ్చర్యం, విస్మయం వ్యక్తం చేస్తుంది; ఆధునిక సాధారణ తెలుగులో ‘ఆశ్చర్యపోయాడు’ సహజంగా ఉంది.
- source_word: τὸ ὅραμα
  choice: ఆ దృశ్యం
  rationale: ὅραμα అనేది దర్శనం లేదా కనిపించిన దృశ్యం అనే అర్థాలను కలిగి ఉండవచ్చు. మండుతున్న పొదను మోషే ప్రత్యక్షంగా పరిశీలిస్తున్న సందర్భంలో ‘దృశ్యం’ సహజం; అయినా ‘దర్శనం’ అనే భావసంభావ్యతను పూర్తిగా నిరాకరించదు.
- source_word: προσερχομένου δὲ αὐτοῦ
  choice: అతడు దగ్గరికి వెళ్తుండగా
  rationale: జెనిటివ్ అబ్సల్యూట్ తెలిపే సమకాలిక నేపథ్యాన్ని, పొదవైపు మోషే కదలికను సహజ తెలుగులో నిలిపాం.
- source_word: κατανοῆσαι
  choice: నిశితంగా చూడడానికి
  rationale: κατανοέω ఇక్కడ శ్రద్ధగా గమనించడం లేదా పరిశీలించడం అనే దృశ్యార్థాన్ని ఇస్తుంది; ‘నిశితంగా చూడడానికి’ దాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐγένετο φωνὴ
  choice: స్వరం వినిపించింది
  rationale: ἐγένετο + φωνή స్వరం సంభవించడాన్ని తెలిపే సంఘటనాత్మక ప్రయోగం. తెలుగులో ‘స్వరం వినిపించింది’ సహజమైన కథన రూపం; గ్రీకులోని నిర్మాణానికి మరింత సమీపమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριοςను ప్రాజెక్టు ప్రమాణానికి అనుగుణంగా ‘ప్రభువు’గా ఇచ్చాం; నిర్దిష్ట నామమైన యెహోవాను సూచించే ప్రత్యేక రూపాన్ని మూల గ్రీకు స్వయంగా ఉపయోగించదు.
theological_decisions:
- issue: దైవప్రత్యక్షత సందర్భంలో κυρίου అనువాదం
  choice: ప్రభువు
  alternative: యెహోవా
  rationale: ఈ ఘట్టం నిర్గమకాండము 3ను ప్రతిధ్వనించినప్పటికీ, ప్రస్తుత గ్రీకు పాఠంలో κύριος ఉంది; కాబట్టి గ్రీకు రూపాన్ని అనుసరించి ‘ప్రభువు’ అని ఉంచాం, ‘యెహోవా’ అని వ్యాఖ్యానాత్మకంగా నిర్దిష్టం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘దృశ్యం,’ ‘నిశితంగా’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి మూలంలోని పరిశీలన భావాన్ని నిలుపుతాయి. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
