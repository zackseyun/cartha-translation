source:
  edition: SBLGNT
  text: ᾧ οὐκ ἠθέλησαν ὑπήκοοι γενέσθαι οἱ πατέρες ἡμῶν, ἀλλὰ ἀπώσαντο καὶ ἐστράφησαν ⸂ἐν ταῖς καρδίαις⸃ αὐτῶν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/039.yaml
  text: Our fathers were unwilling to become obedient to him[a], but rejected him and turned back in their hearts to Egypt[b],
translation:
  language: te
  text: మన పితరులు అతనికి విధేయులు కావడానికి ఇష్టపడలేదు; బదులుగా, అతన్ని తిరస్కరించి[a], తమ హృదయాల్లో ఐగుప్తువైపు తిరిగారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతన్ని త్రోసివేసి” లేదా “పక్కకు నెట్టివేసి.” గ్రీకు క్రియ మోషేను నిరాకరించడాన్ని, బలంగా పక్కకు తోసినట్లుగా, సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, వారు ఇంకా అరణ్యంలోనే ఉన్నప్పటికీ, తమ అంతరంగంలో ఐగుప్తుకు తిరిగి వెళ్లాలని కోరుకున్నారు.
    reason: cultural_note
lexical_decisions:
- source_word: ᾧ
  choice: అతనికి
  rationale: ఈ ఏకవచన దత్తివాచక సంబంధ సర్వనామం ముందటి వచనంలోని మోషేను సూచిస్తుంది; విధేయత ఎవరిపట్ల ఉండాలో తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: οὐκ ἠθέλησαν
  choice: ఇష్టపడలేదు
  rationale: వారు విధేయులు కాలేకపోయారని కాక, కావడానికి మనస్పూర్తిగా నిరాకరించారని θέλω యొక్క సంకల్పార్థాన్ని ఇది తెలియజేస్తుంది.
- source_word: ὑπήκοοι γενέσθαι
  choice: విధేయులు కావడానికి
  rationale: విధేయత చూపడం అనే భావంతో పాటు γενέσθαι లోని ‘కావడం’ అనే భావాన్ని కూడా నిలుపుతుంది.
- source_word: οἱ πατέρες ἡμῶν
  choice: మన పితరులు
  rationale: ఇశ్రాయేలు పూర్వీకులైన పురుషులను సూచించే మూలపాఠానికి దగ్గరగా ఉండే, బైబిలు సందర్భంలో సహజమైన ప్రయోగం.
- source_word: ἀπώσαντο
  choice: అతన్ని తోసివేసి
  rationale: కేవలం అభిప్రాయపరమైన తిరస్కారమే కాక, మోషేను పక్కకు నెట్టివేయడాన్ని సూచించగల క్రియ యొక్క బలమైన చిత్రాన్ని నిలుపుతుంది.
- source_word: ἐστράφησαν
  choice: తిరిగారు
  rationale: εἰς Αἴγυπτον తో కలిసి ఐగుప్తువైపు వారి అంతరంగ దిశ మారిందనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: తమ హృదయాల్లో
  rationale: కోరిక, సంకల్పం, అంతరంగ వైఖరిని సూచించే బైబిలు హృదయ రూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: εἰς Αἴγυπτον
  choice: ఐగుప్తువైపు
  rationale: εἰς లోని దిశాభావాన్ని స్పష్టంగా చూపుతుంది; వారు శారీరకంగా అక్కడికి చేరుకున్నారనే అపార్థాన్ని కలిగించదు.
theological_decisions:
- issue: ఇశ్రాయేలీయులు ఐగుప్తువైపు తిరిగిన స్వభావం
  choice: తమ హృదయాల్లో ఐగుప్తువైపు తిరిగారు
  alternative: తమ హృదయాల్లో ఐగుప్తుకు తిరిగి వెళ్లారు
  rationale: వారు అరణ్యంలోనే ఉన్నప్పటికీ వారి అంతరంగ కోరిక, విధేయత ఐగుప్తువైపు మళ్లిందని మూలపాఠం చెబుతుంది. దీనిని కేవలం భౌతిక ప్రయాణంగా గానీ, కేవలం రూపకాలంకారంగా గానీ నిర్ధారించకుండా ఉద్రిక్తతను నిలుపుతుంది.
