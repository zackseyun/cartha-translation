translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘పరదేశిగా నివసించాడు’ అనే రూపం πάροικος లోని స్వదేశం కాని చోట నివసించే వ్యక్తి అనే భావాన్ని సులభంగా తెలియజేస్తుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
