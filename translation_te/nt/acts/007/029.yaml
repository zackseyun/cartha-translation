source:
  edition: SBLGNT
  text: ἔφυγεν δὲ Μωϋσῆς ἐν τῷ λόγῳ τούτῳ, καὶ ἐγένετο πάροικος ἐν γῇ Μαδιάμ, οὗ ἐγέννησεν υἱοὺς δύο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/029.yaml
  text: So Moses fled at this word[a], and became a sojourner in the land of Midian[b], where he fathered two sons.
translation:
  language: te
  text: ఈ మాట విని మోషే పారిపోయి, మిద్యాను దేశంలో పరదేశిగా నివసించాడు[b]. అక్కడ అతడు ఇద్దరు కుమారులకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా, “విదేశీయునిగా నివసించాడు” లేదా “అక్కడి నివాసి అయిన విదేశీయుడు అయ్యాడు.” ఈ పదం తన స్వదేశం కాని దేశంలో నివసించే వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: పారిపోయి
  rationale: φεύγω ఇక్కడ భయంతో ఆ ప్రదేశాన్ని విడిచి వెళ్లడాన్ని సూచిస్తుంది; ‘పారిపోయి’ సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించకుండా వాక్య సంబంధంలో వ్యక్తీకరించబడింది
  rationale: δέ కథన కొనసాగింపును, ముందరి సంఘటనతో స్వల్ప ఫలిత సంబంధాన్ని చూపుతుంది; తెలుగులో ‘ఈ మాట విని ... పారిపోయి’ అనే నిర్మాణమే ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: ఈ మాట విని
  rationale: ఈ గ్రీకు పదబంధం ఆ మాట మోషే పారిపోవడానికి తక్షణ ప్రేరణ అయినట్లు సూచిస్తుంది. ‘విని’ సందర్భంలో సహజమైనదైనా, కారణార్థక అవగాహన కూడా సాధ్యమని పాదసూచికలో ఉంచబడింది.
- source_word: ἐγένετο πάροικος
  choice: పరదేశిగా నివసించాడు
  rationale: πάροικος తన స్వదేశం కాని చోట నివసించే విదేశీయుడు లేదా పరదేశిని సూచిస్తుంది. ‘పరదేశిగా నివసించాడు’ అర్థాన్ని స్పష్టంగా, సాధారణ పాఠకులకు సహజంగా అందిస్తుంది.
- source_word: ἐν γῇ Μαδιάμ
  choice: మిద్యాను దేశంలో
  rationale: γῇ అనే భౌగోళిక పదాన్ని నిలుపుతూ ‘మిద్యాను దేశంలో’ అని అనువదించడం మూలంలోని నిర్మాణాన్ని సహజ తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: οὗ
  choice: అక్కడ
  rationale: సంబంధ క్రియావిశేషణం మిద్యాను దేశాన్ని తిరిగి సూచిస్తుంది; తెలుగులో ‘అక్కడ’ అత్యంత సహజం.
- source_word: ἐγέννησεν
  choice: అతనికి ... పుట్టారు
  rationale: పురుష కర్తతో γεννάω అతడు తండ్రి అయ్యాడనే భావం ఇస్తుంది. తెలుగులో ‘అతనికి కుమారులు పుట్టారు’ అనేది సహజంగా అదే భావాన్ని తెలియజేస్తుంది; అసహజమైన ‘కన్నాడు’ను నివారిస్తుంది.
- source_word: υἱοὺς δύο
  choice: ఇద్దరు కుమారులు
  rationale: వ్యక్తులను లెక్కించడానికి ‘ఇద్దరు’ వాడటం సహజ తెలుగు; υἱούς కు ‘కుమారులు’ నేరమైన సమానార్థకం.
