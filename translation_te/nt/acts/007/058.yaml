id: ACT.7.58
reference: Acts 7:58
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐκβαλόντες ἔξω τῆς πόλεως ἐλιθοβόλουν. καὶ οἱ μάρτυρες ἀπέθεντο τὰ ἱμάτια ⸀αὐτῶν παρὰ τοὺς πόδας νεανίου καλουμένου Σαύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/058.yaml
  text: And after they had driven him out of the city[a], they were stoning him. And the witnesses laid their outer garments at the feet of a young man called Saul.
translation:
  language: te
  text: వారు అతన్ని పట్టణం వెలుపలికి తోసివేసి, అతనిపై రాళ్లు విసురుతున్నారు. సాక్షులు తమ పైవస్త్రాలను[a] సౌలు అనే ఒక యువకుని పాదాల దగ్గర ఉంచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వస్త్రాలను’ లేదా ‘కప్పుకునే వస్త్రాలను’; గ్రీకు పదం విస్తృతంగా బయటి దుస్తులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: బయటికి తోసివేసి
  rationale: బలవంతంగా వెలుపలికి పంపడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; భూతకాల కృదంత చర్య ప్రధాన క్రియకు ముందుగా జరిగినదని వాక్యక్రమం చూపిస్తుంది.
- source_word: ἔξω τῆς πόλεως
  choice: పట్టణం బయటికి
  rationale: పట్టణం లోపలి నుంచి వెలుపలికి జరిగిన కదలికను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐλιθοβόλουν
  choice: రాళ్లతో కొడుతూ ఉన్నారు
  rationale: గ్రీకు అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న చర్యను కాపాడుతుంది.
- source_word: οἱ μάρτυρες
  choice: సాక్షులు
  rationale: ఇక్కడ న్యాయపరమైన సందర్భంలోని సాక్షులను సూచిస్తుంది; తరువాత ఏర్పడిన ‘హతసాక్షులు’ అనే అర్థాన్ని చేర్చదు.
- source_word: ἀπέθεντο
  choice: ఉంచారు
  rationale: వస్త్రాలను తీసి ఒకరి పాదాల దగ్గర పెట్టిన చర్యను సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: τὰ ἱμάτια αὐτῶν
  choice: తమ పైవస్త్రాలను
  rationale: αὐτῶνను కర్తలకే తిరిగి అన్వయిస్తూ ‘తమ’ అని, ἱμάτια సూచించే బయటి దుస్తులను ‘పైవస్త్రాలు’ అని స్పష్టపరుస్తుంది.
- source_word: παρὰ τοὺς πόδας
  choice: పాదాల దగ్గర
  rationale: వస్తువులను ఒకరి పాదాల సమీపంలో ఉంచడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: νεανίου
  choice: యువకుని
  rationale: సాపేక్షంగా యువ వయస్సులోని పురుషుణ్ణి సూచించే సహజమైన ఆధునిక పదం.
- source_word: καλουμένου Σαύλου
  choice: సౌలు అనే
  rationale: ఆ వ్యక్తి పేరు సౌలు అని సహజమైన తెలుగు నిర్మాణంలో తెలియజేస్తుంది.
theological_decisions:
- issue: శిక్ష అమలు సందర్భంలో μάρτυρες గుర్తింపు
  choice: న్యాయపరమైన అర్థంలో ‘సాక్షులు’
  alternative: ‘హతసాక్షులు’
  rationale: ఈ కథన సందర్భంలో వారు న్యాయ విచారణలో సాక్ష్యం చెప్పి రాళ్లతో కొట్టడంలో పాల్గొన్నవారు; తరువాతి సంఘపరమైన ‘హతసాక్షులు’ అర్థాన్ని ఇక్కడికి తీసుకురావడం సముచితం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న చర్యను ‘కొడుతూ ఉన్నారు’ ద్వారా నిలిపింది.
