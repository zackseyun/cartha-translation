- from: దేవుడు మన పితరుల ఎదుటనుండి వెళ్లగొట్టిన జనాల దేశాన్ని వారు స్వాధీనం చేసుకున్నప్పుడు, మన పితరులు దానిని తమ ముందువారి నుండి స్వీకరించి[b], యెహోషువతో[a] కలిసి తీసుకొచ్చారు. అది దావీదు రోజుల వరకు ఉంది.
  to: మన పితరులు వరుసగా స్వీకరించిన దానిని[b], యెహోషువతో[a] కలిసి, దేవుడు మన పితరుల ఎదుటనుండి వెళ్లగొట్టిన జనాల దేశాన్ని స్వాధీనం చేసుకున్నప్పుడు, దావీదు రోజుల వరకు తీసుకొచ్చారు.
  rationale: The revision removes the added independent sentence about the tent’s continued existence and keeps “దావీదు రోజుల వరకు” within the source’s single syntactic flow. It preserves the historical identification of Joshua, the succession nuance of διαδεξάμενοι, and the contextual land-possession sense without making a stronger claim than the Greek explicitly makes.
