source:
  edition: SBLGNT
  text: ἣν καὶ εἰσήγαγον διαδεξάμενοι οἱ πατέρες ἡμῶν μετὰ Ἰησοῦ ἐν τῇ κατασχέσει τῶν ἐθνῶν ὧν ἐξῶσεν ὁ θεὸς ἀπὸ προσώπου τῶν πατέρων ἡμῶν ἕως τῶν ἡμερῶν Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/045.yaml
  text: which our fathers in turn brought in with Joshua at the dispossession of the nations that God drove out from before our fathers[b][a], until the days of David.
translation:
  language: te
  text: మన పితరులు వరుసగా స్వీకరించిన దానిని[b], యెహోషువతో[a] కలిసి, దేవుడు మన పితరుల ఎదుటనుండి వెళ్లగొట్టిన జనాల దేశాన్ని స్వాధీనం చేసుకున్నప్పుడు, దావీదు రోజుల వరకు తీసుకొచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘యేసుతో’ అని ఉంది; Ἰησοῦς అనే పేరు యేసును గానీ యెహోషువను గానీ సూచించగలదు. ఇక్కడ నూను కుమారుడైన యెహోషువను సూచిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘దానిని వరుసగా స్వీకరించిన తరువాత.’ ఈ కృదంతం తరతరాల వారసత్వ క్రమాన్ని నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: దానిని
  rationale: స్త్రీలింగ ఏకవచన సంబంధ సర్వనామం ముందటి వచనంలోని సాక్ష్యపు గుడారాన్ని సూచిస్తుంది. తెలుగులో సహజమైన అనుసంధానానికి ‘దానిని’ వాడబడింది.
- source_word: εἰσήγαγον
  choice: తీసుకొచ్చారు
  rationale: εἰσάγω అంటే లోపలికి తీసుకురావడం. గుడారాన్ని దేశంలోకి తీసుకొచ్చారనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: διαδεξάμενοι
  choice: తమ ముందువారి నుండి స్వీకరించి
  rationale: ఈ కృదంతం ఒకరి తరువాత మరొకరు స్వీకరించే వారసత్వ క్రమాన్ని సూచిస్తుంది. ‘తమ ముందువారి నుండి స్వీకరించి’ ఆ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: οἱ πατέρες ἡμῶν
  choice: మన పితరులు
  rationale: స్తెఫను ప్రసంగంలోని ఒడంబడిక-చారిత్రక పునరుక్తిని నిలుపుతూ, గౌరవప్రదమైన బైబిలు వాడుకను కొనసాగిస్తుంది.
- source_word: μετὰ Ἰησοῦ
  choice: యెహోషువతో
  rationale: Ἰησοῦς అనే గ్రీకు పేరు యేసును గానీ యెహోషువను గానీ సూచించగలదు. మోషే తరువాత దేశప్రవేశం అనే సందర్భంలో నూను కుమారుడైన యెహోషువే ఉద్దేశిత వ్యక్తి.
- source_word: ἐν τῇ κατασχέσει τῶν ἐθνῶν
  choice: జనాల దేశాన్ని వారు స్వాధీనం చేసుకున్నప్పుడు
  rationale: κατάσχεσις స్వాధీనం లేదా ఆక్రమణను సూచిస్తుంది. ఇక్కడ జనాలు నివసించిన దేశాన్ని ఇశ్రాయేలీయులు స్వాధీనం చేసుకున్న సందర్భాన్ని తెలుగులో స్పష్టంగా తెలియజేయడానికి ‘దేశాన్ని’ సందర్భానుసారంగా పూరించబడింది.
- source_word: ὧν ἐξῶσεν ὁ θεὸς
  choice: దేవుడు ... వెళ్లగొట్టిన
  rationale: ἐξωθέω బలంగా బయటకు నెట్టడం లేదా వెళ్లగొట్టడం అనే అర్థం ఇస్తుంది; ‘వెళ్లగొట్టిన’ సహజమైన ఆధునిక తెలుగు.
- source_word: ἀπὸ προσώπου τῶν πατέρων ἡμῶν
  choice: మన పితరుల ఎదుటనుండి
  rationale: ముఖము లేదా సన్నిధి ఎదుటనుండి తొలగించడాన్ని సూచించే సెమిటిక్ శైలిని చదవదగిన తెలుగులో నిలుపుతుంది.
- source_word: ἕως τῶν ἡμερῶν Δαυίδ
  choice: దావీదు రోజుల వరకు
  rationale: మూలంలోని కాలపరిమితిని నేరుగా నిలుపుతూ తరువాతి వచనంతో అనుసంధానిస్తుంది.
theological_decisions:
- issue: Ἰησοῦ అనే పేరుకు ఇక్కడి సూచన
  choice: యెహోషువ
  alternative: యేసు
  rationale: గ్రీకులో రూపం ఒకటే అయినా, మోషే తరువాత ఇశ్రాయేలు దేశప్రవేశం గురించిన చారిత్రక సందర్భం నూను కుమారుడైన యెహోషువను స్పష్టంగా సూచిస్తుంది. మూలంలోని పేరుసంబంధ భాషా విషయాన్ని పాదటిప్పణిలో తెలిపాం.
- issue: διαδεξάμενοι యొక్క భావబలం
  choice: పూర్వీకుల నుండి వరుసగా స్వీకరించడం
  alternative: తమ వంతుగా లేదా ఒకరి తరువాత ఒకరు చేయడం
  rationale: కృదంతంలో తరాల వారసత్వం మరియు ముందువారి నుండి అందుకోవడం రెండూ ఉన్నాయి. ప్రధాన పాఠ్యంలో స్వీకరణను స్పష్టపరచి, సంక్షిప్త ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: ἕως τῶν ἡμερῶν Δαυίδ కు వాక్య సంబంధం
  choice: గుడారం దావీదు కాలం వరకు ఉన్నదని స్పష్టీకరించడం
  alternative: ‘దావీదు రోజుల వరకు’ అని మాత్రమే వదిలి, ఏ క్రియతో సంబంధమో అస్పష్టంగా ఉంచడం
  rationale: గ్రీకు వాక్యంలో కాలపదబంధం సంక్షిప్తంగా ఉంది. తెలుగులో అసంపూర్ణ వాక్యం రాకుండా ‘అది ... ఉంది’ అని కనిష్ఠంగా పూరించబడింది; తరువాతి వచనానికి ఉన్న కాలసంబంధం నిలిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘పితరులు,’ ‘యెహోషువ,’ ‘దావీదు రోజుల వరకు’ వంటి పదబంధాలు ప్రసంగంలోని బైబిలు-చారిత్రక స్వరాన్ని నిలుపుతాయి. ప్రధాన పాఠ్యంలో రెండు పాదటిప్పణి గుర్తులు [a], [b] సంబంధిత పదాల వెంట ఉంచబడ్డాయి.
