  text: But Solomon built a house for him[a].
translation:
  language: te
  text: అయితే సొలొమోను ఆయన కోసం ఒక ఇల్లు[a] కట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మందిరం’; గ్రీకులో ‘ఇల్లు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Σολομῶν
  choice: సొలొమోను
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వాక్యంతో ఉన్న స్వల్ప వ్యత్యాసాన్ని, కథన పురోగతిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: οἰκοδόμησεν
  choice: కట్టించాడు
  rationale: సొలొమోను స్వయంగా నిర్మాణకార్యం చేయడం కంటే తన ఆధ్వర్యంలో మందిరాన్ని నిర్మింపజేశాడనే రాజసంబంధ సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది; మూలంలోని నిర్మాణార్థాన్ని నిలుపుతుంది.
- source_word: αὐτῷ
  choice: ఆయన కోసం
  rationale: సందర్భంలో ఈ సర్వనామం దేవుణ్ణి సూచిస్తుంది; ఉద్దేశం లేదా గౌరవార్థం నిర్మించడాన్ని తెలుగు సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἶκον
  choice: మందిరాన్ని
  rationale: οἶκος అక్షరార్థంగా ‘ఇల్లు’; ఇక్కడ సందర్భానుసారంగా దేవాలయాన్ని సూచిస్తుంది. తెలుగులో దేవుని ‘ఇల్లు’ అనే భావాన్నీ ఆలయ సూచననూ ‘మందిరం’ సహజంగా మోస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: οἶκονను ‘ఇల్లు’గా అక్షరానువాదం చేయాలా, ‘మందిరం’గా సందర్భార్థంతో అనువదించాలా
  choice: మందిరం
  alternative: ఇల్లు
  rationale: ఇక్కడ సూచించబడేది సొలొమోను నిర్మించిన దేవాలయమే. ఆధునిక తెలుగులో ‘ఇల్లు’ మాత్రమే వాడితే సాధారణ నివాసగృహంగా అపార్థం కావచ్చు; ‘మందిరం’ సందర్భాన్ని స్పష్టం చేస్తుంది. అయినా మూల గ్రీకులోని సాధారణ ‘ఇల్లు’ పదం తదుపరి వచనంలోని theological tension‌కు ముఖ్యమైనందున దాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. దేవుణ్ణి సూచించే సర్వనామానికి గౌరవ రూపం వాడబడింది.
