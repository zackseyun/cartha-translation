revisions:
- from: ఆయన యోసేపును అతని కష్టాలన్నిటి నుండి విడిపించి,[a] ఐగుప్తు రాజైన ఫరో ఎదుట అతనికి అనుగ్రహాన్ని[b], జ్ఞానాన్ని ఇచ్చాడు. అంతేకాక, ఐగుప్తు మీదా ఫరో ఇంటివారందరి మీదా అతన్ని అధికారిగా నియమించాడు.[c]
  to: యోసేపును అతని కష్టాలన్నిటి నుండి విడిపించి,[a] ఐగుప్తు రాజైన ఫరో ఎదుట అతనికి అనుకూలతను[b] జ్ఞానాన్ని ఇచ్చాడు; అతన్ని ఐగుప్తుమీదా ఫరో రాజగృహమంతటి మీదా పాలకునిగా నియమించాడు.[c]
  rationale: కర్తను స్పష్టంగా ‘దేవుడు’ అని చేర్చకుండా, మూలంలోని సందర్భపూర్వక అవ్యక్త కర్తను నిలుపుతూ ‘ఆయన’ను తొలగించాం. χάρις‌ను ఈ కథన సందర్భానికి తగిన ‘అనుకూలత’గా మార్చాం. ఫరో యొక్క οἶκος‌ను ‘రాజగృహమంతటి’గా ఇచ్చి కుటుంబ సభ్యులు మాత్రమే కాక రాజగృహ-పరిపాలనా పరిధి కూడా సూచించబడేలా చేశాం. ἡγούμενονకు ‘పాలకునిగా’ వాడాం. పాదటిప్పణి cలో ‘అతని’ అనే మూల సర్వనామాన్ని నిలిపి, దాని సందర్భసంబంధమైన ఫరో సూచనను ప్రధాన పాఠ్యంలో మాత్రమే స్పష్టం చేశాం.
