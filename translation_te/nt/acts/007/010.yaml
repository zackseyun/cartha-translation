id: ACT.7.10
reference: Acts 7:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐξείλατο αὐτὸν ἐκ πασῶν τῶν θλίψεων αὐτοῦ, καὶ ἔδωκεν αὐτῷ χάριν καὶ σοφίαν ἐναντίον Φαραὼ βασιλέως Αἰγύπτου, καὶ κατέστησεν αὐτὸν ἡγούμενον ἐπ’ Αἴγυπτον ⸀καὶ ὅλον τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/010.yaml
  text: and rescued him from all his afflictions[a], and gave him favor and wisdom before Pharaoh king of Egypt[c][b], and appointed him ruler over Egypt and over all his household.
translation:
  language: te
  text: యోసేపును అతని కష్టాలన్నిటి నుండి విడిపించి,[a] ఐగుప్తు రాజైన ఫరో ఎదుట అతనికి అనుకూలతను[b] జ్ఞానాన్ని ఇచ్చాడు; అతన్ని ఐగుప్తుమీదా ఫరో రాజగృహమంతటి మీదా పాలకునిగా నియమించాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని బాధలన్నిటి నుండి రక్షించి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అనుగ్రహాన్ని.” ఇక్కడ ఫరో దృష్టిలో యోసేపుకు లభించిన అనుకూల దృష్టిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఐగుప్తుమీదా అతని సమస్త రాజగృహం మీదా పాలకునిగా నియమించాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξείλατο
  choice: విడిపించి
  rationale: ఈ సందర్భంలో ప్రమాదం, బాధల నుండి క్రియాశీలంగా రక్షించి బయటపడేయడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘విడిపించి’ సహజంగా ఉంది.
- source_word: θλίψεων
  choice: కష్టాలన్నిటి
  rationale: యోసేపు ఎదుర్కొన్న ఒత్తిళ్లు, బాధలు, విపత్తులను విస్తృతంగా సూచిస్తుంది; ప్రత్యేక అంత్యకాల భావాన్ని చేర్చదు.
- source_word: χάριν
  choice: అనుగ్రహాన్ని
  rationale: ఇక్కడ ఫరో దృష్టిలో యోసేపుకు లభించిన ఆదరణ లేదా అనుకూల దృష్టిని సూచిస్తుంది; ‘అనుగ్రహం’ మూలపద విస్తృతిని నిలుపుతుంది, పాదటిప్పణి సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: σοφίαν
  choice: జ్ఞానాన్ని
  rationale: ఫరో గుర్తించిన యోసేపు వివేకం, కార్యనైపుణ్యంతో కూడిన జ్ఞానాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐναντίον
  choice: ఫరో ఎదుట
  rationale: ఒకరి సన్నిధిలో లేదా దృష్టిలో అనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: κατέστησεν
  choice: నియమించాడు
  rationale: అధికార పదవిలో ఉంచడాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: ἡγούμενον
  choice: అధికారిగా
  rationale: పాలనా అధికారం నిర్వహించే వ్యక్తిని సూచిస్తుంది; ‘పాలకుడు’ కూడా సాధ్యమే అయినా, ఇక్కడ నియామక సందర్భానికి ‘అధికారి’ సహజంగా సరిపోతుంది.
- source_word: ἐπ’ Αἴγυπτον
  choice: ఐగుప్తు మీద
  rationale: ఒక ప్రాంతంపై పరిపాలనా అధికారాన్ని సూచించే ἐπί భావాన్ని నిలుపుతుంది.
- source_word: ὅλον τὸν οἶκον αὐτοῦ
  choice: ఫరో ఇంటివారందరి మీద
  rationale: οἶκος భౌతిక గృహాన్ని మాత్రమే కాక ఫరో గృహపరివారం లేదా రాజగృహ నిర్వహణను సూచిస్తుంది. అస్పష్టమైన గ్రీకు సర్వనామాన్ని తెలుగులో సహజత కోసం ‘ఫరో’గా వ్యక్తం చేశాం.
theological_decisions:
- issue: వాక్యమంతటా క్రియల కర్త ఎవరు?
  choice: ముందటి వచన సందర్భం ప్రకారం కర్త దేవుడే; అయితే ఈ వచనంలో ‘దేవుడు’ అనే నామాన్ని అదనంగా చేర్చలేదు.
  alternative: స్పష్టత కోసం ‘దేవుడు’ అని పునరుక్తి చేయడం.
  rationale: గ్రీకులో కర్త అంతర్గతంగా సూచించబడి, అపొస్తలుల కార్యాలు 7:9లోని ‘దేవుడు అతనికి తోడుగా ఉన్నాడు’ అనే సందర్భాన్ని కొనసాగిస్తుంది. మూలంలోని శైలిని కాపాడేందుకు పేరును చేర్చకుండా ‘ఆయన’తో కొనసాగించాం.
- issue: χάρις యొక్క సందర్భార్థం
  choice: ప్రధాన పాఠ్యంలో ‘అనుగ్రహం’; పాదటిప్పణిలో ఫరో దృష్టిలో ఆదరణ అనే సందర్భార్థం.
  alternative: ప్రధాన పాఠ్యంలోనే ‘ఆదరణ’ లేదా ‘అనుకూలత’.
  rationale: మూలపదపు విస్తృత భావాన్ని నిలుపుతూ, ఈ సందర్భంలోని మానవ సంబంధమైన అనుకూల దృష్టిని పాదటిప్పణిలో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి వాడబడింది. గ్రీకులో పునరావృతమయ్యే καίలను తెలుగులో సహజ వాక్యప్రవాహం కోసం క్రియాసముచ్చయం మరియు ‘అంతేకాక’తో వ్యక్తం చేశాం. ‘ఐగుప్తు’ అనే స్థిర బైబిలు భౌగోళిక రూపాన్ని కొనసాగించాం.
