id: ACT.7.27
reference: Acts 7:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἀδικῶν τὸν πλησίον ἀπώσατο αὐτὸν εἰπών· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστὴν ἐφ’ ⸀ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/027.yaml
  text: But the man who was wronging his neighbor pushed him away[a], saying, ‘Who appointed you ruler and judge over us?’
translation:
  language: te
  text: అయితే తన పొరుగువానికి అన్యాయం చేస్తున్నవాడు మోషేను తోసివేసి[a], “మా మీద అధికారిగా, న్యాయాధిపతిగా నిన్ను నియమించినవాడు ఎవరు?” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పక్కకు నెట్టివేసి.” గ్రీకు క్రియ బలవంతంగా శారీరకంగా తోసివేయడాన్ని లేదా తిరస్కారంతో పక్కకు నెట్టడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶν
  choice: అన్యాయం చేస్తున్నవాడు
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న క్రియాభావాన్ని, అలాగే ἀδικέω లోని అన్యాయ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: πλησίον
  choice: పొరుగువానికి
  rationale: ‘సమీపస్థుడు/పొరుగువాడు’ అనే సాధారణ అర్థాన్ని నిలుపుతూ, సందర్భంలోని తోటి ఇశ్రాయేలీయుడిని అనవసరంగా స్పష్టీకరించదు.
- source_word: ἀπώσατο
  choice: తోసివేసి
  rationale: మధ్యమప్రయోగ ఏకకాలిక క్రియలోని బలమైన శారీరక లేదా తిరస్కారపూర్వక చర్యను సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: κατέστησεν
  choice: నియమించినవాడు
  rationale: ఒకరిని అధికార స్థానంలో ఉంచడం అనే causative భావానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: ἄρχοντα
  choice: అధికారిగా
  rationale: పాలనాధికార భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; ‘న్యాయాధిపతి’తో జతగా సరిపోతుంది.
- source_word: δικαστὴν
  choice: న్యాయాధిపతిగా
  rationale: తీర్పు చెప్పే అధికారిని సూచించే ప్రత్యక్షమైన, గౌరవప్రదమైన పదం.
- source_word: ἐφ’ ἡμῶν
  choice: మా మీద
  rationale: ఇక్కడ ἐπί + genitive సూచించే అధికార పరిధిని, ప్రశ్నలోని ప్రతిఘటన స్వరాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. గ్రీకు వాక్యంలోని ‘అన్యాయం చేస్తున్న’ కొనసాగింపు భావం, అధికారాన్ని ప్రశ్నించే స్వరం, ἀπώσατο లోని శారీరక/తిరస్కార ద్వంద్వసంభావ్యత నిలుపబడ్డాయి.
