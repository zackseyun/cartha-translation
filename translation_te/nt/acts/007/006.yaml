id: ACT.7.6
reference: Acts 7:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐλάλησεν ⸀δὲ οὕτως ὁ θεὸς ὅτι ἔσται τὸ σπέρμα αὐτοῦ πάροικον ἐν γῇ ἀλλοτρίᾳ, καὶ δουλώσουσιν αὐτὸ καὶ κακώσουσιν ἔτη τετρακόσια·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/006.yaml
  text: 'But God spoke in this way: that his offspring would be a foreign resident in a strange land[a], and they would enslave it and mistreat it for four hundred years.'
translation:
  language: te
  text: 'అయితే దేవుడు ఈ విధంగా పలికాడు: అతని సంతానం పరాయి దేశంలో పరదేశిగా ఉంటుంది[a]; వారు దానిని బానిసగా చేసి, నాలుగు వందల సంవత్సరాలపాటు దుర్వ్యవహారం చేస్తారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా మరింత సహజంగా: “అతని సంతతివారు పరాయి దేశంలో పరదేశులుగా ఉంటారు; వారు వారిని బానిసలుగా చేసి, నాలుగు వందల సంవత్సరాలపాటు దుర్వ్యవహారం చేస్తారు.” గ్రీకు పాఠంలో “సంతానం ... దానిని” అనే సమూహార్థక ఏకవచనం ఉంది.'
    reason: సమూహార్థక ఏకవచనానికి సహజమైన తెలుగు బహువచన ప్రత్యామ్నాయాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: ἐλάλησεν δὲ οὕτως ὁ θεὸς
  choice: అయితే దేవుడు ఈ విధంగా పలికాడు
  rationale: δέ సూచించే స్వల్ప భావమలుపును ‘అయితే’తో, οὕτωςను ‘ఈ విధంగా’తో స్పష్టంగా నిలిపి, దైవవాక్యానికి తగిన గౌరవప్రదమైన ‘పలికాడు’ను వాడింది.
- source_word: τὸ σπέρμα αὐτοῦ
  choice: అతని సంతానం
  rationale: σπέρμα అబ్రాహాము వంశాన్ని సూచించే సమూహార్థక ఏకవచనం; ‘సంతానం’ సహజమైన తెలుగులో ఆ ఏకవచన రూపాన్ని నిలుపుతుంది.
- source_word: πάροικον ἐν γῇ ἀλλοτρίᾳ
  choice: పరాయి దేశంలో పరదేశిగా
  rationale: πάροικοςలోని స్వదేశం కాని చోట నివసించే వ్యక్తి అనే భావాన్ని ‘పరదేశి’ తెలియజేస్తుంది; ἀλλοτρίαలోని తనది కాని/ఇతరులకు చెందిన భావాన్ని ‘పరాయి’ నిలుపుతుంది.
- source_word: δουλώσουσιν αὐτὸ
  choice: అక్కడివారు దానిని బానిసగా చేసుకొని
  rationale: δουλόωలోని బానిసత్వంలోకి తేవడం అనే బలమైన భావాన్ని నిలిపింది. గ్రీకులో కర్త నిర్దిష్టంగా చెప్పబడకపోయినా తెలుగులో వాక్యస్పష్టత కోసం ‘అక్కడివారు’ వాడింది; αὐτόకు అనుగుణంగా ‘దానిని’ అనే ఏకవచనాన్ని ఉంచింది.
- source_word: κακώσουσιν
  choice: బాధిస్తారు
  rationale: కీడు చేయడం, హింసించడం, దుర్వ్యవహారం చేయడం వంటి విస్తృత భావాన్ని సందర్భానుకూలమైన సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἔτη τετρακόσια
  choice: నాలుగు వందల సంవత్సరాలు
  rationale: కాలవ్యాప్తిని తెలుగులో సహజంగా తెలిపే విధంగా అనువదించింది.
theological_decisions:
- issue: అబ్రాహాము సంతానాన్ని సూచించే సమూహార్థక ఏకవచనం
  choice: ప్రధాన పాఠంలో ‘సంతానం ... దానిని’ అనే ఏకవచనాన్ని నిలిపింది
  alternative: ‘సంతతివారు ... వారిని’ అని సహజమైన బహువచనంలో ఇవ్వడం
  rationale: గ్రీకు మూలంలోని σπέρμα ... αὐτό అనే సమూహార్థక ఏకవచనాన్ని నిలపడం ద్వారా అబ్రాహామీయ వాగ్దాన భాషలోని ముఖ్యమైన రూపం చెరిగిపోకుండా ఉంటుంది; తెలుగు పాఠకుడికి అర్థం కావడానికి ప్రత్యామ్నాయ బహువచనాన్ని పాదసూచికలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘పరాయి దేశంలో పరదేశిగా’ మూలంలోని పదభేదాన్ని నిలుపుతూనే తెలుగులో సహజంగా వినిపిస్తుంది. ప్రధాన పాఠంలోని ‘దానిని’ ఉద్దేశపూర్వకంగా సమూహార్థక ఏకవచనాన్ని ప్రతిబింబిస్తుంది.
