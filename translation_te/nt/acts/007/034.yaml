id: ACT.7.34
reference: Acts 7:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδὼν εἶδον τὴν κάκωσιν τοῦ λαοῦ μου τοῦ ἐν Αἰγύπτῳ, καὶ τοῦ στεναγμοῦ ⸀αὐτοῦ ἤκουσα, καὶ κατέβην ἐξελέσθαι αὐτούς· καὶ νῦν δεῦρο ⸀ἀποστείλω σε εἰς Αἴγυπτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/034.yaml
  text: I have surely seen the mistreatment of my people in Egypt[a], and I have heard their groaning, and I have come down to deliver them. And now come[b], I will send you to Egypt.
translation:
  language: te
  text: “ఐగుప్తులో ఉన్న నా ప్రజలకు జరుగుతున్న దుర్వ్యవహారాన్ని నేను నిశ్చయంగా చూశాను[a]. వారి మూలుగును విన్నాను. వారిని విడిపించడానికి[b] దిగివచ్చాను. ఇప్పుడు రా; నిన్ను ఐగుప్తుకు పంపుతాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బాధను’ లేదా ‘అణచివేతను.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘రక్షించడానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν εἶδον
  choice: నేను నిశ్చయంగా చూశాను
  rationale: ఒకే ‘చూడటం’ క్రియను కృదంతం, సమాపక క్రియ రూపాల్లో పునరుక్తి చేసిన సెమిటిక్ శైలి బలమైన నిశ్చయాన్ని సూచిస్తుంది. తెలుగులో కృత్రిమమైన పదానువాదం చేయకుండా ‘నిశ్చయంగా’ ద్వారా ఆ ఉద్ఘాటనను నిలిపింది.
- source_word: κάκωσιν
  choice: హింసను
  rationale: ఇది కఠినంగా బాధించడాన్ని లేదా అణచివేతను సూచిస్తుంది. ‘హింస’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, ప్రజలు అనుభవించిన దారుణమైన బాధింపును సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: λαοῦ μου τοῦ ἐν Αἰγύπτῳ
  choice: ఐగుప్తులో ఉన్న నా ప్రజలు
  rationale: ప్రజలతో దేవుని సంబంధాన్ని ‘నా ప్రజలు’ సహజంగా నిలుపుతుంది; τοῦ ἐν Αἰγύπτῳ సూచించే స్థలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τοῦ στεναγμοῦ αὐτοῦ
  choice: వారి మూలుగును
  rationale: గ్రీకులో సర్వనామం ఏకవచనంలో ఉన్నా, అది సమష్టిగా ‘ప్రజలు’ అనే సమూహాన్ని సూచిస్తుంది. తెలుగులో ‘వారి’ సహజం; ‘మూలుగు’ στεναγμόςలోని బాధతో కూడిన నిట్టూర్పును నిలుపుతుంది.
- source_word: κατέβην
  choice: దిగివచ్చాను
  rationale: దేవుని జోక్యాన్ని మానవరూప భాషలో చెప్పే మూలపాఠపు రూపకాన్ని వివరణతో తొలగించకుండా యథాతథంగా నిలుపుతుంది.
- source_word: ἐξελέσθαι
  choice: విడిపించడానికి
  rationale: ఈ సందర్భంలో మధ్యమ రూపం ప్రమాదం లేదా అణచివేత నుంచి రక్షించి బయటకు తీసుకురావడాన్ని సూచిస్తుంది. ‘విడిపించడానికి’ ఐగుప్తు బానిసత్వ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: δεῦρο
  choice: రా
  rationale: మోషేను ముందుకు పిలిచే ఆజ్ఞాత్మక పదాన్ని తెలుగులో నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀποστείλω σε εἰς Αἴγυπτον
  choice: నిన్ను ఐగుప్తుకు పంపుతాను
  rationale: భవిష్యత్ సూచక క్రియలోని దేవుని నియామక ప్రకటనను నేరుగా నిలుపుతుంది; గమ్యాన్ని తెలుగులో సహజమైన ‘ఐగుప్తుకు’తో తెలిపింది.
theological_decisions:
- issue: దేవుడు ‘దిగివచ్చాను’ అని చెప్పే మానవరూప వర్ణన
  choice: దిగివచ్చాను
  alternative: జోక్యం చేసుకోవడానికి వచ్చాను
  rationale: κατέβηνలోని స్థలసంబంధ మానవరూప భాషను సిద్ధాంతపరమైన వివరణతో మార్చకుండా నిలిపింది.
- issue: ἐξελέσθαιలోని రక్షణ భావం
  choice: విడిపించడానికి
  alternative: రక్షించడానికి
  rationale: రెండు అర్థాలూ సాధ్యమే. ఐగుప్తు అణచివేత నుంచి బయటకు తీసుకురావడం అనే సందర్భాన్ని ‘విడిపించడానికి’ మరింత స్పష్టంగా వ్యక్తం చేస్తుంది; ‘రక్షించడానికి’ను పాదటిప్పణిలో ప్రత్యామ్నాయంగా ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష ఉద్ధరణ. ‘నిశ్చయంగా చూశాను’ మూలంలోని ఉద్ఘాటనను, ‘దిగివచ్చాను’ దైవిక మానవరూప భాషను నిలుపుతాయి. సంప్రదాయ బైబిలు పేరురూపమైన ‘ఐగుప్తు’ వాడబడింది. ఆంగ్ల సంప్రదింపు పాఠంలో [b] గుర్తు ‘రా’ తర్వాత ఉన్నప్పటికీ దాని పాదటిప్పణి ἐξελέσθαιకి చెందిన ‘deliver/rescue’ ప్రత్యామ్నాయాన్ని వివరిస్తోంది; అందువల్ల తెలుగు ప్రధాన పాఠంలో [b]ను ‘విడిపించడానికి’ తర్వాత ఉంచడం జరిగింది.
