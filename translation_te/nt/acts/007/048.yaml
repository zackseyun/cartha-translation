id: ACT.7.48
reference: Acts 7:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ οὐχ ὁ ὕψιστος ἐν ⸀χειροποιήτοις κατοικεῖ· καθὼς ὁ προφήτης λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/048.yaml
  text: 'But the Most High does not dwell in things made by hands[a], just as the prophet says:'
translation:
  language: te
  text: 'అయితే సర్వోన్నతుడు మానవ చేతులతో చేసిన వాటిలో[a] నివసించడు. ప్రవక్త చెప్పినట్లుగా:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మానవ చేతులతో కట్టిన మందిరాల్లో.” గ్రీకు పదబంధం “మానవ చేతులతో చేసిన వాటిలో” అనే మరింత విస్తృత భావాన్ని ఇస్తుంది; అయితే తక్షణ సందర్భం మందిరాన్ని గురించినది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: అయితే
  rationale: సొలొమోను మందిరాన్ని కట్టించాడనే ముందరి వాక్యంతో బలమైన వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: οὐχ
  choice: నివసించడు
  rationale: κατοικεῖ అనే క్రియతో కలిసి ఉన్న నిషేధాన్ని తెలుగులో క్రియాంత నకార రూపంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ ὕψιστος
  choice: సర్వోన్నతుడు
  rationale: దేవునికి వాడే బిరుదు భావాన్ని నిలుపుతుంది; మూలంలో లేని ‘దేవుడు’ అనే పదాన్ని చేర్చదు.
- source_word: ἐν χειροποιήτοις
  choice: మానవ చేతులతో చేసిన వాటిలో
  rationale: χειροποιήτοις అనే బహువచన విశేషణం ‘చేతులతో చేసినవి’ అనే విస్తృత భావాన్ని ఇస్తుంది. ‘మానవ’ అనేది కర్తను తెలుగులో స్పష్టం చేస్తూ, సందర్భంలోని మందిరానికే భావాన్ని పరిమితం చేయదు.
- source_word: κατοικεῖ
  choice: నివసించడు
  rationale: దైవ సన్నిధి, నివాసం అనే సందర్భంలో గౌరవప్రదంగాను సహజంగాను ఉంది.
- source_word: καθὼς
  choice: చెప్పినట్లుగా
  rationale: తరువాత వచ్చే ప్రవచన ఉల్లేఖనం ముందరి వాదనను ధృవీకరిస్తుందని స్పష్టంగా సూచిస్తుంది.
- source_word: ὁ προφήτης
  choice: ప్రవక్త
  rationale: మూలపాఠం ప్రవక్త పేరును చెప్పదు; అందువల్ల యెషయా అనే పేరును ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: λέγει
  choice: చెప్పినట్లుగా
  rationale: తెలుగు ఉల్లేఖన సూత్రంలో καθὼςతో కలిపి సహజమైన రూపం; ప్రవక్త పలికిన వాక్యాన్ని పరిచయం చేస్తుంది.
theological_decisions:
- issue: χειροποιήτοις అనే పదాన్ని ప్రధాన పాఠ్యంలో ‘మందిరాలు’ అని పరిమితం చేయాలా?
  choice: ‘మానవ చేతులతో చేసిన వాటిలో’ అనే విస్తృత పదబంధాన్ని ఉంచడం
  alternative: ‘చేతులతో కట్టిన మందిరాల్లో’ లేదా ‘మానవులు నిర్మించిన ఆలయాల్లో’
  rationale: తక్షణ సందర్భం మందిరాన్ని గురించినదే అయినా, గ్రీకు పదం వ్యాకరణపరంగా మరింత విస్తృతమైనది. విస్తృత అనువాదం మానవ నిర్మిత పవిత్ర వస్తువులు లేదా కట్టడాలపై ఉన్న వాక్యపు వాదనాత్మక బలాన్ని కాపాడుతుంది.
- issue: ὁ ὕψιστος అనే బిరుదును ‘సర్వోన్నత దేవుడు’గా విస్తరించాలా?
  choice: ‘సర్వోన్నతుడు’ అని మాత్రమే అనువదించడం
  alternative: ‘సర్వోన్నత దేవుడు’
  rationale: ఇది దేవునినే సూచిస్తుందని స్పష్టమైనా, గ్రీకు మూలంలో θεός లేదు. కాబట్టి మూలంలో లేని పదాన్ని చేర్చకుండా బిరుదు భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేఖన పఠనానికి తగిన గౌరవప్రదమైన శైలి. వాక్యాంతంలోని ద్విబిందువు తరువాత వచ్చే ప్రవచన ఉల్లేఖనాన్ని సూచిస్తుంది.
