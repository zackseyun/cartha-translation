source:
  edition: SBLGNT
  text: καὶ ἐλιθοβόλουν τὸν Στέφανον ἐπικαλούμενον καὶ λέγοντα· Κύριε Ἰησοῦ, δέξαι τὸ πνεῦμά μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/059.yaml
  text: And they were stoning Stephen as he called out and said[a], “Lord Jesus, receive my spirit.”
translation:
  language: te
  text: 'వారు స్తెఫనుపై రాళ్లు రువ్వుతుండగా, అతడు మొరపెడుతూ[a] ఇలా అన్నాడు: “ప్రభువైన యేసూ, నా ఆత్మను స్వీకరించు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పిలుచుకుంటూ.” ఇక్కడున్న గ్రీకు పదం ప్రార్థనలో ఒకరిని పిలవడం లేదా మొరపెట్టడం అనే భావాన్ని మరింత స్పష్టంగా తెలియజేయగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλιθοβόλουν
  choice: రాళ్లతో కొడుతుండగా
  rationale: గ్రీకు అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న చర్యను సూచిస్తుంది; ఈ తెలుగు రూపం రాళ్లతో కొట్టడం జరుగుతూనే ఉన్న సమయంలో స్తెఫను పలికిన మాటలను సహజంగా అనుసంధానిస్తుంది.
- source_word: ἐπικαλούμενον
  choice: ప్రార్థిస్తూ
  rationale: ఈ సందర్భంలో స్తెఫను యేసును నేరుగా సంబోధించి వేడుకుంటున్నాడు. ‘ప్రార్థిస్తూ’ అనేది సాధారణ పాఠకులకు సహజంగా ఉండి, ఆ పిలుపు ప్రార్థనాత్మకమైనదని తెలియజేస్తుంది; ‘మొరపెడుతూ’ అనే సమీప ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: λέγοντα
  choice: ఇలా అన్నాడు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే గ్రీకు కృదంతాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: Κύριε Ἰησοῦ
  choice: ప్రభువైన యేసూ
  rationale: యేసుకు చేసిన గౌరవపూర్వక ప్రత్యక్ష సంబోధనను నిలుపుతుంది; κύριοςకు ‘ప్రభువు’ అనే ప్రామాణిక అర్థాన్ని ఇస్తుంది.
- source_word: δέξαι
  choice: స్వీకరించు
  rationale: ప్రార్థనలోని ఆజ్ఞార్థక విన్నప స్వరాన్ని, తన ఆత్మను యేసుకు అప్పగించే భావాన్ని గంభీరంగా మరియు స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ πνεῦμά μου
  choice: నా ఆత్మను
  rationale: మరణ సమయంలో స్తెఫను అప్పగిస్తున్న తన ఆత్మను సూచించే సందర్భోచితమైన, విస్తృతంగా అర్థమయ్యే అనువాదం.
theological_decisions:
- issue: స్తెఫను యేసును ప్రార్థనాత్మకంగా పిలుస్తున్న భావాన్ని అనువాదంలో ఎంత స్పష్టంగా చూపాలి
  choice: ‘ప్రార్థిస్తూ’ అని అనువదించి, ‘ప్రభువైన యేసూ’ అనే ప్రత్యక్ష సంబోధనను యథాతథంగా ఉంచడం
  alternative: ‘ఆయనకు మొరపెడుతూ’ లేదా మరింత సాధారణంగా ‘పిలుస్తూ’
  rationale: గ్రీకు వాక్యం స్తెఫను యేసునే నేరుగా సంబోధిస్తూ తన ఆత్మను స్వీకరించమని వేడుకున్నట్లు చూపుతుంది. ‘ప్రార్థిస్తూ’ ఈ సందర్భార్థాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది; అయితే ἐπικαλούμενον పదంలోని ‘పిలవడం/మొరపెట్టడం’ అనే రూపార్థాన్ని పాదసూచిక సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ప్రత్యక్ష ప్రార్థనకు తగిన గౌరవపూర్వకమైన మరియు గంభీరమైన శైలి నిలుపబడింది.
