source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἰδοὺ θεωρῶ τοὺς οὐρανοὺς ⸀διηνοιγμένους καὶ τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν ἑστῶτα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/056.yaml
  text: And he said[a], “Look, I see the heavens opened[b], and the Son of Man standing at the right hand of God.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “ఇదిగో! ఆకాశాలు తెరవబడి ఉన్నాయనీ[a], మనుష్యకుమారుడు[b] దేవుని కుడివైపున నిలబడి ఉన్నాడనీ నేను చూస్తున్నాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆకాశాలు తెరచబడి ఉన్నాయని.” ఇక్కడ గ్రీకులో పూర్త భూతకాల కర్మణి కృదంతం ఉంది; స్తెఫను దర్శనంలో ఆకాశాలు అప్పటికే తెరవబడి, ఆ స్థితిలో ఉన్నాయని ఇది సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “మనుష్యకుమారుడు” అనేది గుర్తింపు పొందిన మెస్సీయ బిరుదు; ఇది దానియేలు 7:13ను ప్రతిధ్వనిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ఇదిగో!
  rationale: దర్శనంలోని ఆశ్చర్యాన్నీ, వెంటనే శ్రద్ధ చూపమనే పిలుపునూ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: θεωρῶ
  choice: నేను చూస్తున్నాను
  rationale: వర్తమాన కాలంలోని కొనసాగుతున్న ప్రత్యక్ష దర్శనాన్ని సూటిగా వ్యక్తం చేస్తుంది.
- source_word: τοὺς οὐρανοὺς
  choice: ఆకాశాలు
  rationale: గ్రీకు మూలంలోని బహువచనాన్ని కాపాడుతూ, దర్శనానికి ఉన్న దైవిక సందర్భాన్ని నిలుపుతుంది.
- source_word: διηνοιγμένους
  choice: తెరవబడి ఉండడాన్ని
  rationale: పూర్త భూతకాల కర్మణి కృదంతం సూచించే—ముందే తెరవబడి ఇప్పుడు ఆ స్థితిలో ఉన్న—ఫలిత స్థితిని తెలియజేస్తుంది.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: దానియేలు 7తో సంబంధమున్న గుర్తింపు పొందిన మెస్సీయ బిరుదును అక్షరార్థానికి దగ్గరగా, తెలుగు బైబిలు వాడుకకు అనుగుణంగా నిలుపుతుంది.
- source_word: ἐκ δεξιῶν
  choice: దేవుని కుడివైపున
  rationale: గౌరవం, అధికార స్థానాన్ని సూచించే గ్రీకు నుడికారాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ἑστῶτα
  choice: నిలబడి ఉండడాన్ని
  rationale: మూలపాఠం స్పష్టంగా తెలిపే నిలుచున్న భంగిమను కాపాడుతుంది; కూర్చున్నాడని చెప్పే ఇతర వచనాలకు అనుగుణంగా మార్చదు.
theological_decisions:
- issue: τὸν υἱὸν τοῦ ἀνθρώπου అనే క్రీస్తు సంబంధ బిరుదు
  choice: మనుష్యకుమారుడు
  alternative: మానవ కుమారుడు
  rationale: సాంప్రదాయికంగా గుర్తించబడే బిరుదునూ, దానియేలు 7:13తో దాని సంబంధాన్నీ కాపాడుతుంది; ప్రత్యామ్నాయం సాధారణ మానవ వర్ణనలా వినిపించే అవకాశం ఉంది.
- issue: మహిమపరచబడిన యేసు భంగిమ
  choice: దేవుని కుడివైపున నిలబడి ఉండడం
  alternative: దేవుని కుడివైపున కూర్చొని ఉండడం
  rationale: మూలపాఠంలోని ‘నిలబడి’ అనే ప్రత్యేకతను యథాతథంగా ఉంచి, ఇతర వచనాల్లోని ‘కూర్చొని’ అనే రూపంతో సమన్వయపరచదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. మూలంలోని బహువచన ‘ఆకాశాలు,’ దర్శనపు కొనసాగుతున్న స్వభావం, తెరవబడిన ఫలిత స్థితి, అలాగే ‘నిలబడి’ అనే దైవశాస్త్రపరమైన ప్రత్యేకత కాపాడబడ్డాయి.
