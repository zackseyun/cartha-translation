revisions:
- from: అప్పుడు ప్రభువు అతనితో, “నీ పాదరక్షను తీసివేయి[a]. ఎందుకంటే నీవు నిలబడి ఉన్న స్థలం పవిత్ర భూమి” అని చెప్పాడు.
  to: అప్పుడు ప్రభువు అతనితో, “నీ పాదాల నుండి పాదరక్షను తీసివేయి[a], ఎందుకంటే నీవు నిలబడి ఉన్న స్థలం పవిత్ర నేల” అని చెప్పాడు.
  rationale: This revision preserves the Greek singular “sandal/footwear” while explicitly rendering the plural “feet,” retains the present-state sense of ἕστηκας (“are standing”), and uses a more contextually precise Telugu equivalent for “holy ground.” The footnote remains anchored to the imperative and supplies the lexical alternative for Λῦσον.
  reviewer_model: gpt-5.6-terra
