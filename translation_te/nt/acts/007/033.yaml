id: ACT.7.33
reference: Acts 7:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ κύριος· Λῦσον τὸ ὑπόδημα τῶν ποδῶν σου, ὁ γὰρ τόπος ⸀ἐφ’ ᾧ ἕστηκας γῆ ἁγία ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/033.yaml
  text: Then the Lord said to him[a], ‘Take off the sandals from your feet, for the place on which you are standing is holy ground.’
translation:
  language: te
  text: అప్పుడు ప్రభువు అతనితో, “నీ పాదాల నుండి పాదరక్షను తీసివేయి[a], ఎందుకంటే నీవు నిలబడి ఉన్న స్థలం పవిత్ర నేల” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నీ పాదాల నుండి పాదరక్షను విప్పు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: ప్రభువు
  rationale: దైవిక సందర్భంలో κύριος అనే బిరుదుకు సహజమైన, గౌరవప్రదమైన తెలుగు అనువాదం; గ్రీకు పాఠంలో ప్రత్యక్షంగా లేని దైవనామాన్ని చేర్చదు.
- source_word: Λῦσον
  choice: తీసివేయి
  rationale: λύω యొక్క మూలార్థం ‘విప్పు’ అయినప్పటికీ, పాదరక్ష సందర్భంలో ఉద్దేశం దానిని తొలగించడం; ‘తీసివేయి’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: τὸ ὑπόδημα
  choice: పాదరక్షను
  rationale: గ్రీకు పదం ఏకవచనంలో ఉన్నందున తెలుగులో కూడా ఏకవచనాన్ని నిలుపుతుంది; ‘పాదరక్ష’ గౌరవప్రదమైన సాధారణ పదం.
- source_word: τῶν ποδῶν σου
  choice: నీ పాదరక్షను
  rationale: తెలుగులో ‘నీ పాదాల నుండి పాదరక్షను’ అనడం అసహజంగా ఉండటంతో స్వామ్యసంబంధ నిర్మాణంలో భావాన్ని సహజంగా వ్యక్తం చేశాం; మూలంలోని పాదాల సూచన ‘పాదరక్ష’లో అంతర్భూతంగా ఉంటుంది.
- source_word: ὁ γὰρ τόπος
  choice: ఎందుకంటే ... స్థలం
  rationale: γάρ ఇచ్చే కారణార్థాన్ని ‘ఎందుకంటే’ స్పష్టంగా తెలియజేస్తుంది; τόπος‌కు ‘స్థలం’ సాధారణ సమానార్థకం.
- source_word: ἐφ’ ᾧ ἕστηκας
  choice: నీవు నిలబడి ఉన్న
  rationale: ἐπί యొక్క స్థానార్థాన్ని తెలుగు సంబంధవాక్య నిర్మాణంలో సహజంగా వ్యక్తం చేస్తూ, perfect రూపంలోని ప్రస్తుత స్థితిని ‘నిలబడి ఉన్న’గా అందిస్తుంది.
- source_word: γῆ ἁγία
  choice: పవిత్ర భూమి
  rationale: ఈ స్థానిక సందర్భంలో γῆ అంటే నేల లేదా భూమి; ‘పవిత్ర భూమి’ గ్రీకు విధేయ పదబంధాన్ని స్పష్టంగా, గంభీరంగా నిలుపుతుంది.
theological_decisions:
- issue: నిర్గమకాండంలోని దైవ ప్రత్యక్షతను ఉటంకించే సందర్భంలో κύριος అనువాదం
  choice: ప్రభువు
  alternative: యెహోవా
  rationale: కొత్త నిబంధన గ్రీకు పాఠంలో κύριος మాత్రమే ఉంది; ఇక్కడ ప్రత్యక్షంగా లేని హెబ్రీ దైవనామాన్ని చేర్చకుండా మూలభాషకు ప్రాధాన్యం ఇస్తూ ‘ప్రభువు’ అని అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని పాదరక్ష ఏకవచనాన్ని నిలిపి, దాని వల్ల కలిగే స్వల్ప అసాధారణతను తొలగించలేదు; అక్షరార్థమైన క్రియను పాదసూచికలో ఇచ్చాం.
