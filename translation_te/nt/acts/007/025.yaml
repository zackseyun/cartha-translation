source:
  edition: SBLGNT
  text: ἐνόμιζεν δὲ συνιέναι τοὺς ⸀ἀδελφοὺς ὅτι ὁ θεὸς διὰ χειρὸς αὐτοῦ δίδωσιν ⸂σωτηρίαν αὐτοῖς⸃, οἱ δὲ οὐ συνῆκαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/025.yaml
  text: He supposed that his brothers understood that God was giving them deliverance through his hand[b][a], but they did not understand.
translation:
  language: te
  text: దేవుడు తన చేతి ద్వారా వారికి విడుదల ఇస్తున్నాడని తన సోదరులు[b] గ్రహించారని అతడు అనుకున్నాడు; అయితే వారు గ్రహించలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “విడుదల” అని అనువదించిన గ్రీకు పదానికి “రక్షణ” అనే అర్థం కూడా ఉండవచ్చు. ఇక్కడి సందర్భంలో, మోషే ద్వారా ఇశ్రాయేలీయులను దేవుడు విడిపించడాన్ని ఇది సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “సోదరులు” అంటే మోషే తోటి ఇశ్రాయేలీయులు. గ్రీకులో పురుష బహువచన బంధుత్వ పదం ఉపయోగించబడింది.
    reason: cultural_note
lexical_decisions:
- source_word: ἐνόμιζεν
  choice: అనుకున్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం నేపథ్యంగా కొనసాగిన అంచనాను సూచించినా, ఆధునిక తెలుగులో “అనుకున్నాడు” సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: συνιέναι / συνῆκαν
  choice: గ్రహించారని / గ్రహించలేదు
  rationale: ఒక పరిస్థితి ప్రాముఖ్యతను అర్థం చేసుకోవడాన్ని “గ్రహించు” స్పష్టంగా తెలియజేస్తుంది; రెండు చోట్ల ఒకే మూలపదాన్ని పునరావృతం చేయడం గ్రీకు వాక్యంలోని వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἀδελφοὺς
  choice: సోదరులు
  rationale: మోషే తోటి ఇశ్రాయేలీయులను సూచించే పురుష బహువచన బంధుత్వ భాషను యథాతథంగా ఉంచుతుంది; సందర్భార్థాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: διὰ χειρὸς αὐτοῦ
  choice: తన చేతి ద్వారా
  rationale: కర్తృత్వం లేదా సాధనాన్ని తెలిపే గ్రీకు నుడికారంలోని “చేతి” రూపకాన్ని నిలుపుతుంది; ఇక్కడ “తన” ప్రధాన వాక్యంలోని మోషేను సూచిస్తుంది.
- source_word: δίδωσιν
  choice: కలిగిస్తున్నాడని
  rationale: గ్రీకు వర్తమాన రూపంలోని జరుగుతున్న చర్యను, గతకాల ఆలోచనలో పొందుపరిచిన తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: σωτηρίαν
  choice: విడుదల
  rationale: ఐగుప్తు అణచివేత నుండి ఇశ్రాయేలుకు దేవుడు కలిగించే చారిత్రక విడిపింపును ఈ సందర్భంలో సహజంగా తెలియజేస్తుంది; విస్తృతమైన “రక్షణ” భావాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: విడుదలను పొందేవారిని సూచించే దత్తి విభక్తి భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: మోషే సందర్భంలో σωτηρία పదం అనువాదం
  choice: విడుదల
  alternative: రక్షణ
  rationale: ప్రధాన పాఠ్యంలో ఐగుప్తు అణచివేత నుండి ఇశ్రాయేలు పొందే నిర్దిష్ట చారిత్రక విడిపింపును ముందుకు తెస్తుంది; అదే సమయంలో గ్రీకు పదంలోని విస్తృత రక్షణ భావాన్ని పాదసూచికలో తెలియజేసి వేదాంత సంబంధాన్ని మూసివేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. “తన చేతి ద్వారా” అనే మూలభాషా దృశ్యరూపం నిలుపబడింది; “గ్రహించు” పునరావృతం గ్రీకు పదప్రయోగంలోని ఉద్దేశపూర్వక వ్యత్యాసాన్ని ప్రతిబింబిస్తుంది.
