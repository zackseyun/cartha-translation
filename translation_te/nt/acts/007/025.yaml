- from: 'దేవుడు తన చేతి ద్వారా వారికి విడుదల కలిగిస్తున్నాడని తన సోదరులు[b] గ్రహించారని అతడు అనుకున్నాడు; అయితే వారు గ్రహించలేదు.[a]


