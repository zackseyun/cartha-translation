source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος, ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ ἐπισκέψασθαι τοὺς ἀδελφοὺς αὐτοῦ τοὺς υἱοὺς Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/023.yaml
  text: When he was approaching forty years of age[a], it came into his heart to visit his brothers[c][b], the sons of Israel.
translation:
  language: te
  text: అతనికి నలభై ఏళ్లు నిండుతున్నప్పుడు[a], తన సహోదరులైన ఇశ్రాయేలు కుమారులను[c] వెళ్లి చూడాలనే తలంపు అతని హృదయంలో కలిగింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘అతనికి నలభై సంవత్సరాల కాలం పూర్తవుతుండగా.’ అంటే అతనికి నలభై ఏళ్లు నిండే సమయం సమీపిస్తున్నప్పుడు.
    reason: lexical_alternative
  - marker: b
    text: ‘అతని హృదయంలో కలిగింది’ అనేది అంతరంగంలో ఒక ఉద్దేశం లేదా సంకల్పం కలిగిందని తెలిపే నుడికారం. ‘అతడు నిర్ణయించుకున్నాడు’ అని కూడా భావానువాదం చేయవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘ఇశ్రాయేలు కుమారులు’ అంటే ఇక్కడ ఇశ్రాయేలు ప్రజలు, అంటే ఇశ్రాయేలీయులు. ఈ పదబంధం ‘సహోదరులు’ ఎవరిని సూచిస్తుందో తెలియజేస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: Ὡς δὲ
  choice: నిండుతున్నప్పుడు
  rationale: δὲ యొక్క కథన అనుసంధాన భావం తెలుగులో సందర్భం ద్వారా సహజంగా వ్యక్తమవుతుంది; ὡς ఇక్కడ కాలసంబంధ ఉపవాక్యాన్ని పరిచయం చేస్తుంది.
- source_word: ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος
  choice: అతనికి నలభై ఏళ్లు నిండుతున్నప్పుడు
  rationale: గ్రీకు వాక్యంలోని కాలం పూర్తవుతున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; కేవలం ‘అతనికి నలభై ఏళ్లు’ అని సమతలపరచదు.
- source_word: ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ
  choice: తలంపు అతని హృదయంలో పుట్టింది
  rationale: అంతరంగ ఉద్దేశం లేదా సంకల్పాన్ని తెలిపే మూలభాషా రూపకాన్ని తెలుగులో అర్థమయ్యే విధంగా నిలుపుతుంది.
- source_word: ἐπισκέψασθαι
  choice: వెళ్లి చూడాలని
  rationale: ఇక్కడ తన ప్రజలను సందర్శించి వారి పరిస్థితిని తెలుసుకోవడం అనే భావం ఉంది. ‘వెళ్లి చూడడం’ సహజంగా ఉండి, సందర్శన భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: తన సహోదరులైన
  rationale: మోషేకు చెందిన అదే ప్రజలవారిని కుటుంబ బంధుత్వ భాషలో సూచించే గ్రీకు పదాన్ని నిలుపుతుంది.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: ఇశ్రాయేలు కుమారులను
  rationale: ముందున్న ‘సహోదరులు’ ఎవరో జాతిపరంగా గుర్తించే అన్వయ పదబంధాన్ని రూపపరంగా పారదర్శకంగా అనువదిస్తుంది.
theological_decisions:
- issue: లింగసూచక బంధుత్వ పదం మరియు ఇశ్రాయేలు ప్రజల జాతిపరమైన గుర్తింపు
  choice: తన సహోదరులైన ఇశ్రాయేలు కుమారులను
  alternative: తన తోటి ఇశ్రాయేలీయులను
  rationale: గ్రీకులోని పురుష బహువచన బంధుత్వ భాషను, ‘ఇశ్రాయేలు కుమారులు’ అనే బైబిలు జాతిపరమైన నామాన్ని నిలుపుతుంది. అదే సమయంలో ఇది కేవలం కొందరు పురుషులను కాక మోషే స్వజనమైన ఇశ్రాయేలు ప్రజలను సూచిస్తుందని పాదసూచిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘హృదయంలో పుట్టింది’ మరియు ‘ఇశ్రాయేలు కుమారులు’ అనే మూలభాషా రూపాలను నిలిపి, వాటి భావాన్ని పాదసూచికల్లో వివరించాం.
