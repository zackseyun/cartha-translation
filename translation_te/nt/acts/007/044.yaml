  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἡ σκηνὴ τοῦ μαρτυρίου ἦν τοῖς πατράσιν ἡμῶν ἐν τῇ ἐρήμῳ, καθὼς διετάξατο ὁ λαλῶν τῷ Μωϋσῇ ποιῆσαι αὐτὴν κατὰ τὸν τύπον ὃν ἑωράκει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/044.yaml
  text: The tent of testimony was with our fathers in the wilderness[a], just as the one speaking to Moses directed him to make it according to the pattern that he had seen[c][b],
translation:
  language: te
  text: మోషేతో మాట్లాడుతున్నవాడు[c], మోషే తాను చూసిన నమూనా ప్రకారం దాన్ని చేయమని ఆదేశించినట్లుగానే, అరణ్యంలో మన పితరుల[b] మధ్య సాక్ష్యపు గుడారం[a] ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సాక్ష్యపు నివాసగుడారం.’
    reason: lexical_alternative
  - marker: b
    text: ‘మన పితరులు’ను ‘మన పూర్వికులు’ అని కూడా అనువదించవచ్చు. గ్రీకులో అక్షరార్థంగా ‘మన తండ్రులు’ అని ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘మోషేతో మాట్లాడినవాడు.’ ‘దేవుడు’ లేదా ‘ప్రభువు’ అని కూడా అర్థం చేసుకోవచ్చు; అయితే గ్రీకు పాఠం మాట్లాడేవారి పేరును స్పష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: σκηνὴ τοῦ μαρτυρίου
  choice: సాక్ష్యపు గుడారం
  rationale: σκηνή యొక్క సాధారణ అర్థమైన తరలించగల గుడారాన్ని సహజమైన తెలుగులో చూపుతూ, τοῦ μαρτυρίου అనే సంబంధాన్ని ‘సాక్ష్యపు’గా నిలిపింది. సంప్రదాయ ప్రత్యామ్నాయం ‘సాక్ష్యపు మందిరం’ను పాదటిప్పణిలో ఇచ్చాం.
- source_word: τοῖς πατράσιν ἡμῶν
  choice: మన పితరుల దగ్గర
  rationale: దత్తివిభక్తి భావాన్ని ‘దగ్గర’తో సహజంగా వ్యక్తం చేసి, πατέρες లోని పురుషలింగ పూర్వికుల సూచనను ‘పితరులు’గా నిలిపింది.
- source_word: ἐν τῇ ἐρήμῳ
  choice: అరణ్యంలో
  rationale: ఇశ్రాయేలు అరణ్య ప్రయాణ నేపథ్యానికి సరిపోయే సాధారణ బైబిలీయ భౌగోళిక పదం.
- source_word: καθὼς διετάξατο
  choice: ఆదేశించినట్లుగానే
  rationale: καθὼς తెలిపే అనురూపతను ‘అట్లుగానే’తో, διετάξατο లోని అధికారపూర్వక నిర్దేశాన్ని ‘ఆదేశించాడు’తో వ్యక్తం చేసింది.
- source_word: ὁ λαλῶν τῷ Μωϋσῇ
  choice: మోషేతో మాట్లాడుతున్నవాడు
  rationale: వర్తమాన కృదంత రూపాన్ని, అలాగే మాట్లాడేవారి పేరు మూలంలో స్పష్టంగా చెప్పకపోవడాన్ని నిలిపింది.
- source_word: ποιῆσαι αὐτὴν
  choice: దాన్ని ... చేయమని
  rationale: గుడారాన్ని తయారుచేయడం/నిర్మించడం అనే సందర్భార్థాన్ని సరళమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: κατὰ τὸν τύπον
  choice: నమూనా ప్రకారం
  rationale: τύπος ఇక్కడ మోషేకు చూపబడిన నిర్మాణ నమూనా లేదా రూపాన్ని సూచిస్తుంది; ‘నమూనా’ స్పష్టమైన ఆధునిక తెలుగు.
- source_word: ὃν ἑωράκει
  choice: తాను చూసిన
  rationale: సంబంధసర్వనామం సూచించే ‘నమూనా’తో అనుసంధానాన్ని నిలిపి, ముందుగా చూసిన భావాన్ని సందర్భం ద్వారా సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: మోషేతో మాట్లాడినవారి గుర్తింపు
  choice: ‘మోషేతో మాట్లాడుతున్నవాడు’ అని పేరు చెప్పకుండా ఉంచడం
  alternative: ‘దేవుడు మోషేతో మాట్లాడుతూ’ లేదా ‘ప్రభువు మోషేతో మాట్లాడుతూ’
  rationale: గ్రీకు పాఠంలో నామవాచకంగా వాడిన కృదంతమే ఉంది; మాట్లాడేవారిని దేవుడు/ప్రభువు అని ఈ వాక్యంలో ప్రత్యక్షంగా పేర్కొనలేదు. అందువల్ల మూలంలోని అంతర్భావాన్ని పరిష్కరించకుండా నిలిపాం.
- issue: వాక్యంలోని ఆదేశం మరియు గుడారం ఉనికి మధ్య సంబంధం
  choice: తెలుగులో స్పష్టత కోసం ‘అది చేయబడింది’ అని అంతర్భావిత ఫలితాన్ని వ్యక్తం చేయడం
  alternative: ‘...చేయమని ఆదేశించినట్లుగా’ అని మాత్రమే ముగించడం
  rationale: గ్రీకులో ప్రధాన క్రియ ἦν మరియు ποιῆσαι మధ్య సంబంధం సంక్షిప్తంగా ఉంది. తెలుగు వాక్యం అసంపూర్ణంగా వినిపించకుండా, ఆదేశానికి అనుగుణంగా గుడారం చేయబడిందనే సందర్భసిద్ధ భావాన్ని వ్యక్తం చేశాం; అయితే ఇది రూపపరంగా అంతర్భావిత విస్తరణ అని గుర్తించాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పితరులు’ మరియు ‘సాక్ష్యపు గుడారం’ వంటి బైబిలీయ పదబంధాలను సందర్భ స్పష్టత కోసం ఉంచి, సాధ్యమైన ప్రత్యామ్నాయాలను పాదటిప్పణుల్లో ఇచ్చాం.
