id: ACT.7.26
reference: Acts 7:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῇ τε ἐπιούσῃ ἡμέρᾳ ὤφθη αὐτοῖς μαχομένοις καὶ ⸀συνήλλασσεν αὐτοὺς εἰς εἰρήνην εἰπών· Ἄνδρες, ἀδελφοί ⸀ἐστε· ἱνατί ἀδικεῖτε ἀλλήλους;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/026.yaml
  text: And on the following day he appeared to them as they were fighting and was trying to reconcile them to peace[a], saying, ‘Men, you are brothers[b]; why are you wronging one another?’
translation:
  language: te
  text: మరుసటి రోజు, ఇద్దరు పోట్లాడుకుంటుండగా మోషే వారికి కనిపించి, వారిద్దరి మధ్య శాంతి కలిగించడానికి ప్రయత్నిస్తూ[a], “అయ్యలారా, మీరు సోదరులు; ఒకరికొకరు ఎందుకు అన్యాయం చేసుకుంటున్నారు?” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని శాంతిలో సమాధానం చేస్తూ.” గ్రీకు అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న చర్యను సూచించవచ్చు; అయితే తరువాతి సందర్భాన్ని బట్టి ఇక్కడ ప్రయత్న భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἐπιούσῃ ἡμέρᾳ
  choice: మరుసటి రోజు
  rationale: తరువాతి దినాన్ని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: ὤφθη
  choice: కనిపించి
  rationale: ὁράω యొక్క కర్మణి రూపం ఇక్కడ కథనంలో అకర్మక భావంతో ‘కనిపించాడు’ అని అర్థమవుతుంది; అనుసంధాన వాక్యంలో ‘కనిపించి’ సహజంగా ఉంది.
- source_word: αὐτοῖς μαχομένοις
  choice: ఇద్దరు పోట్లాడుకుంటుండగా
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న సందర్భక్రియను తెలియజేస్తుంది. తరువాతి ‘ఒకరికొకరు’ మరియు సందర్భం ఇద్దరు వ్యక్తులను సూచిస్తున్నందున ‘ఇద్దరు’ స్పష్టతనిస్తుంది.
- source_word: συνήλλασσεν αὐτοὺς εἰς εἰρήνην
  choice: వారిద్దరి మధ్య శాంతి కలిగించడానికి ప్రయత్నిస్తూ
  rationale: అసంపూర్ణ భూతకాల రూపం సందర్భంలో ఫలించని ప్రయత్నాన్ని సూచించవచ్చు; తరువాతి వచనంలో మోషే ప్రయత్నం తిరస్కరించబడుతుంది. ఈ తెలుగు రూపం గమ్యస్థితియైన శాంతినీ, ప్రయత్న భావాన్నీ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: Ἄνδρες
  choice: అయ్యలారా
  rationale: ప్రత్యక్ష సంబోధనను ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది; ఇక్కడ ‘మనుష్యులారా’ అనడం కృత్రిమంగా ఉంటుంది.
- source_word: ἀδελφοί ἐστε
  choice: మీరు సోదరులు
  rationale: ఒకే ఇశ్రాయేలు ప్రజకు చెందిన సహోదరత్వంపై మోషే చేస్తున్న విజ్ఞప్తిని నేరుగా నిలుపుతుంది.
- source_word: ἱνατί ἀδικεῖτε ἀλλήλους
  choice: ఒకరికొకరు ఎందుకు అన్యాయం చేసుకుంటున్నారు?
  rationale: ἀδικέω లోని తప్పు చేయడం లేదా అన్యాయంగా ప్రవర్తించడం అనే భావాన్ని, పరస్పర సర్వనామంతో సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: సోదరులు అనే బంధపదం యొక్క పరిధి
  choice: మీరు సోదరులు
  alternative: మీరు ఒకే జాతివారు
  rationale: మూలంలోని ἀδελφοί అనే బంధపదాన్ని నిలిపి, దానిని కేవలం జాతీయ సంబంధంగా వివరణాత్మకంగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన వచనశైలిలో అనువదించబడింది. మూలంలోని అసంపూర్ణ భూతకాలానికి ఉన్న కొనసాగుతున్న చర్య/ప్రయత్న చర్య అనే సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
