id: ACT.7.9
reference: Acts 7:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ οἱ πατριάρχαι ζηλώσαντες τὸν Ἰωσὴφ ἀπέδοντο εἰς Αἴγυπτον· καὶ ἦν ὁ θεὸς μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/009.yaml
  text: And the patriarchs, being jealous of Joseph, sold him into Egypt; and God was with him,
translation:
  language: te
  text: ఆదిపితలు యోసేపుపై అసూయపడి, అతన్ని ఐగుప్తుకు అమ్మివేశారు; మరియు దేవుడు అతనికి తోడుగా ఉన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πατριάρχαι
  choice: ఆదిపితలు
  rationale: ఇక్కడ ఈ పదం యాకోబు కుమారులను, ఇశ్రాయేలు ప్రజల మూలపురుషులను సూచిస్తుంది. ‘ఆదిపితలు’ ఆ చారిత్రక గౌరవార్థాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ζηλώσαντες
  choice: యోసేపుపై అసూయపడి
  rationale: కృదంతం ప్రధాన క్రియకు కారణమైన వారి మనోభావాన్ని తెలియజేస్తుంది; ఈ సందర్భంలో ζηλόωకు ‘అసూయపడటం’ సహజమైన, స్పష్టమైన సమానార్థకం.
- source_word: ἀπέδοντο
  choice: అతన్ని ... అమ్మివేశారు
  rationale: ఆదికాండ నేపథ్యానుసారం ఇది యోసేపును ధరకు విక్రయించిన నిర్దిష్ట చర్యను సూచిస్తుంది; ‘అప్పగించారు’ అనే సాధారణ పదం కంటే ‘అమ్మివేశారు’ సరిగ్గా ఉంటుంది.
- source_word: εἰς Αἴγυπτον
  choice: ఐగుప్తుకు
  rationale: εἰς సూచించే గమ్యాన్ని ఆధునిక తెలుగులో సహజంగా ‘ఐగుప్తుకు’ అని వ్యక్తం చేయవచ్చు; ‘ఐగుప్తులోకి’ ఇక్కడ అవసరానికి మించిన స్థలప్రవేశ భావాన్ని కలిగిస్తుంది.
- source_word: ἦν ὁ θεὸς μετ’ αὐτοῦ
  choice: దేవుడు అతనికి తోడుగా ఉన్నాడు
  rationale: దైవ సన్నిధిని తెలిపే గ్రీకు వాక్యానికి ఇది సహజమైన తెలుగు రూపం. సర్వనామానికి యోసేపే స్పష్టమైన పూర్వపదం కాబట్టి అతని పేరును మళ్లీ చేర్చలేదు.
theological_decisions:
- issue: యోసేపు బాధలో దేవుని సన్నిధి
  choice: అయితే దేవుడు అతనికి తోడుగా ఉన్నాడు
  alternative: మరియు దేవుడు అతనితో ఉన్నాడు
  rationale: καί సాధారణంగా ‘మరియు’ అయినప్పటికీ, అన్నల ద్రోహానికి విరుద్ధంగా దేవుని సన్నిధిని ఇక్కడ సందర్భం ముందుకు తెస్తుంది. ‘అయితే’ ఆ సహజ విరుద్ధ సంబంధాన్ని చూపుతుంది; దేవుని కార్యనిర్వహణ గురించి వాక్యంలో లేని వివరణను జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభమైన శైలి. ‘ఆదిపితలు’ అనే బైబిలు-చారిత్రక పదాన్ని నిలిపి, మిగిలిన వాక్యాన్ని సహజమైన తెలుగు పదక్రమంలో ఇచ్చాం.
