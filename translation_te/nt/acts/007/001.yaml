id: ACT.7.1
reference: Acts 7:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ὁ ἀρχιερεύς· ⸀Εἰ ταῦτα οὕτως ἔχει;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/001.yaml
  text: Then the high priest said[a], “Are these things so?”
translation:
  language: te
  text: అప్పుడు ప్రధాన యాజకుడు, “ఈ విషయాలు ఇలాగే ఉన్నాయా?” అని అడిగాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇది ఇలాగే ఉందా?” లేదా మరింత స్పష్టంగా, “ఈ ఆరోపణలు నిజమేనా?”
    reason: ταῦτα బహువచనంగా ‘ఈ విషయాలు’ అని ఉంది. οὕτως ἔχει అనే నుడికారం ‘ఇలాగే ఉంది/నిజమే’ అనే భావాన్ని ఇస్తుంది; సందర్భంలో ఇది ముందుగా చెప్పబడిన ఆరోపణలను సూచించవచ్చు.
lexical_decisions:
- source_word: Εἶπεν
  choice: అడిగాడు
  rationale: λέγω యొక్క భూతకాల రూపానికి ప్రాథమిక అర్థం ‘చెప్పాడు’; అయితే ఇక్కడ ప్రత్యక్ష ప్రశ్నను పరిచయం చేస్తున్నందున సహజమైన ఆధునిక తెలుగులో ‘అడిగాడు’ అని అనువదించడం సందర్భానుకూలం.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ δέ కథన పురోగతిని సూచిస్తుంది; ముందున్న ఆరోపణల తరువాతి చర్యను ‘అప్పుడు’ సహజంగా కలుపుతుంది.
- source_word: ὁ ἀρχιερεύς
  choice: ప్రధాన యాజకుడు
  rationale: ఏకవచన ἀρχιερεύς న్యాయసభలో అధ్యక్షత వహిస్తున్న ప్రధాన యాజకుణ్ణి సూచిస్తుంది; ఇది ఇతర ముఖ్య యాజకుల సమూహాన్ని సూచించదు.
- source_word: Εἰ
  choice: నిజమేనా
  rationale: ప్రత్యక్ష ప్రశ్నలో εἰ అవునా కాదా అనే ప్రశ్నను ప్రవేశపెడుతుంది; οὕτως ἔχειతో కలిపి తెలుగులో ‘నిజమేనా?’ అని సహజంగా వ్యక్తమవుతుంది.
- source_word: ταῦτα
  choice: ఈ విషయాలు
  rationale: బహువచన సూచన సర్వనామం ముందుగా చెప్పబడిన ఆరోపణలను సూచిస్తుంది. ‘ఈ ఆరోపణలు’ అనేది మరింత వివరణాత్మకం కాబట్టి ప్రధాన పాఠంలో తటస్థమైన ‘ఈ విషయాలు’ ఉంచబడింది.
- source_word: οὕτως ἔχει
  choice: నిజమేనా
  rationale: οὕτως ἔχει అనే గ్రీకు నుడికారం ‘ఇలాగే ఉందా/ఇది వాస్తవమేనా’ అనే భావాన్ని ఇస్తుంది. న్యాయవిచారణ సందర్భంలో ‘నిజమేనా?’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవిచారణ సందర్భానికి తగిన గౌరవప్రదమైన సరళ శైలి. ప్రధాన పాఠం మూలంలోని బహువచన సూచనను నిలుపుకుంటూ, గ్రీకు నుడికారాన్ని సహజమైన తెలుగు ప్రశ్నగా అందిస్తుంది.
