id: ACT.7.30
reference: Acts 7:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ πληρωθέντων ἐτῶν τεσσεράκοντα ὤφθη αὐτῷ ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ ⸀ἄγγελος ἐν φλογὶ πυρὸς βάτου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/030.yaml
  text: And after forty years had passed[a], an angel appeared to him in the wilderness of Mount Sinai[c][b], in a flame of fire from a bush.
translation:
  language: te
  text: నలభై సంవత్సరాలు పూర్తయినప్పుడు[a], సీనాయి పర్వతపు అరణ్యంలో ఒక పొదలోని అగ్నిజ్వాలలో[b] ఒక దేవదూత[c] అతనికి కనిపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నలభై సంవత్సరాలు గడిచిన తరువాత.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఒక పొదకు చెందిన అగ్ని జ్వాలలో’; ఇది నిర్గమకాండము 3:2లోని మండుతున్న పొద సంఘటనను ప్రతిధ్వనిస్తుంది.
    reason: cross_reference
  - marker: c
    text: కొందరు దీన్ని నిర్గమకాండము 3:2లోని ‘ప్రభువు దూత’తో అనుసంధానిస్తారు; అయితే ఇక్కడ అపొస్తలుల కార్యములు కేవలం ‘ఒక దేవదూత’ అని చెబుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: πληρωθέντων ἐτῶν τεσσεράκοντα
  choice: నలభై సంవత్సరాలు పూర్తయినప్పుడు
  rationale: జనిటివ్ అబ్సల్యూట్ కాలసంబంధ పరిస్థితిని తెలుపుతుంది. ‘పూర్తయినప్పుడు’ అనేది πληρόω క్రియాభావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὤφθη
  choice: కనిపించాడు
  rationale: ὁράω యొక్క ఈ నిష్క్రియ రూపం ప్రత్యక్షమవడాన్ని సూచించే అకర్మక భావంలో వాడబడింది; తెలుగులో ‘కనిపించాడు’ సహజంగా ఉంటుంది.
- source_word: αὐτῷ
  choice: అతనికి
  rationale: సందర్భంలో మోషేను సూచించే దత్తి విభక్తికి సహజమైన తెలుగు సమానం.
- source_word: ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ
  choice: సీనాయి పర్వత అరణ్యంలో
  rationale: ἔρημοςను ‘అరణ్యం’గా అనువదించడం నిర్జన ప్రాంత భావాన్ని ఇస్తుంది; గ్రీకు షష్ఠీ నిర్మాణాన్ని తెలుగులో సహజమైన సమాసబంధంగా వ్యక్తపరుస్తుంది.
- source_word: ἄγγελος
  choice: ఒక దేవదూత
  rationale: ఈ ప్రత్యక్షత సందర్భంలో ఇది మానవ దూతను కాక పరలోక దూతను సూచిస్తుంది; మూలంలో నిర్దిష్ట ఉపపదం లేకపోవడంతో ‘ఒక’ అని ఉంచబడింది.
- source_word: ἐν φλογὶ πυρὸς βάτου
  choice: ఒక పొదలోని అగ్నిజ్వాలలో
  rationale: గ్రీకు పదబంధంలోని అగ్ని-జ్వాల చిత్రాన్ని నిలుపుతూ, βάτουతో ఉన్న సంక్షిప్త షష్ఠీ సంబంధాన్ని తెలుగులో సహజంగా ‘పొదలోని’ అని వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దైవ ప్రత్యక్షత సందర్భంలో ἄγγελος యొక్క గుర్తింపు
  choice: ఒక దేవదూత
  alternative: ప్రభువు దూత; ఒక సందేశకుడు
  rationale: అపొస్తలుల కార్యములు 7:30లో గ్రీకు పాఠం కేవలం ἄγγελος అని చెబుతుంది; ‘ప్రభువు దూత’ అని లేదు. కాబట్టి నిర్గమకాండము 3:2లోని విస్తృత గుర్తింపును ప్రధాన వాక్యంలోకి దిగుమతి చేయకుండా, వచనంలోని అనిశ్చితిని నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘సీనాయి పర్వత అరణ్యం’ బైబిలు భౌగోళిక భావాన్ని స్పష్టంగా ఉంచుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
