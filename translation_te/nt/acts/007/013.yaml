id: ACT.7.13
reference: Acts 7:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ δευτέρῳ ⸀ἀνεγνωρίσθη Ἰωσὴφ τοῖς ἀδελφοῖς αὐτοῦ, καὶ φανερὸν ἐγένετο τῷ Φαραὼ τὸ ⸀γένος Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/013.yaml
  text: And on the second visit Joseph was recognized by his brothers[b][a], and Joseph’s family became known to Pharaoh.
translation:
  language: te
  text: రెండోసారి వారు వచ్చినప్పుడు, యోసేపు తన అన్నదమ్ములకు తనను వారికి తెలియజేశాడు[a]. అప్పుడు యోసేపు కుటుంబం గురించి ఫరోకు తెలిసింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత రూపానుసారంగా: “యోసేపు తన అన్నదమ్ములచేత గుర్తించబడ్డాడు” లేదా “వారికి తెలిసిపోయాడు.” గ్రీకు క్రియ నిష్క్రియ రూపంలో ఉంది; అయితే సందర్భంలో యోసేపు తన గుర్తింపును వారికి వెల్లడించడమే ఉద్దేశంగా కనిపిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: లేదా “యోసేపు బంధువర్గం” లేదా “యోసేపు వంశం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ δευτέρῳ
  choice: రెండోసారి వారు వచ్చినప్పుడు
  rationale: గ్రీకు ప్రయోగం అక్షరార్థంగా ‘రెండో సందర్భంలో’ అని ఉన్నా, సందర్భం యోసేపు అన్నదమ్ములు ఐగుప్తుకు రెండోసారి రావడాన్ని సూచిస్తుంది. ‘వారు వచ్చినప్పుడు’ అనేది భావాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: ἀνεγνωρίσθη
  choice: తనను తెలియజేసుకున్నాడు
  rationale: రూపరీత్యా ఇది నిష్క్రియాపదం (‘గుర్తించబడ్డాడు/తెలియబడ్డాడు’). అయితే ఆదికాండపు కథన సందర్భంలో యోసేపే తన అసలు గుర్తింపును అన్నదమ్ములకు వెల్లడించాడు. సహజమైన తెలుగులో ఈ భావాన్ని వ్యక్తపరుస్తూ, రూపపరమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἀδελφοῖς
  choice: అన్నదమ్ములకు
  rationale: ఇక్కడ సూచించబడినవారు యోసేపు పురుష సహోదరులు. ఆధునిక తెలుగులో ‘అన్నదమ్ములు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: φανερὸν ἐγένετο
  choice: తెలిసింది
  rationale: ‘తెలియబడింది/ప్రకటమైంది’ అనే భావాన్ని ఆధునిక సహజ తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: γένος
  choice: కుటుంబం గురించి
  rationale: ఇక్కడ γένος యోసేపు బంధువర్గాన్ని లేదా వంశ సంబంధాన్ని సూచిస్తుంది. ‘కుటుంబం’ సాధారణ పాఠకులకు స్పష్టం; ‘వంశం’ అనే సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: τῷ Φαραώ
  choice: ఫరోకు
  rationale: దాతృ విభక్తి ఆ విషయం ఎవరికి తెలిసిందో సూచిస్తుంది; ‘ఫరోకు’ దాన్ని నేరుగా కాపాడుతుంది.
theological_decisions:
- issue: ἀνεγνωρίσθη అనే నిష్క్రియాపదంలోని అస్పష్టత
  choice: యోసేపు తనను తెలియజేసుకున్నాడనే సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: యోసేపు తన అన్నదమ్ములచేత గుర్తించబడ్డాడు
  rationale: గ్రీకు రూపం నిష్క్రియమైనప్పటికీ, ఆదికాండం 45 నేపథ్యం యోసేపు తన గుర్తింపును వెల్లడించిన సంఘటనను సూచిస్తుంది. రూపపరమైన పఠనాన్ని తొలగించకుండా పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘రెండోసారి వారు వచ్చినప్పుడు’ అని సందర్భాన్ని స్వల్పంగా స్పష్టం చేశాం. ప్రధాన పాఠ్యంలో సందర్భార్థానికి ప్రాధాన్యం ఇచ్చి, గ్రీకు నిష్క్రియ రూపంలోని నిజమైన ప్రత్యామ్నాయాన్ని [a] పాదసూచికలో నిలిపాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
