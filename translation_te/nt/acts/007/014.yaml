id: ACT.7.14
reference: Acts 7:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀποστείλας δὲ Ἰωσὴφ μετεκαλέσατο ⸂Ἰακὼβ τὸν πατέρα αὐτοῦ⸃ καὶ πᾶσαν τὴν συγγένειαν ἐν ψυχαῖς ἑβδομήκοντα πέντε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/014.yaml
  text: Then Joseph sent and summoned Jacob his father and all his relatives[a], seventy-five persons in all.
translation:
  language: te
  text: అప్పుడు యోసేపు కబురు పంపి, తన తండ్రియైన యాకోబును, ఆయన బంధువులందరినీ—మొత్తం డెబ్బై ఐదుగురిని—పిలిపించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని పాత నిబంధన వచనాలు మొత్తం సంఖ్యను ‘డెబ్బై’గా పేర్కొంటాయి (ఉదాహరణకు, ఆదికాండము 46:27, నిర్గమకాండము 1:5లోని హెబ్రీ పాఠం); ఇక్కడ అపొస్తలుల కార్యములు ‘డెబ్బై ఐదు’ అని చెబుతోంది.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποστείλας
  choice: కబురు పంపి
  rationale: వస్తువును గ్రీకు పాఠం స్పష్టంగా చెప్పకపోయినా, తరువాతి ‘పిలిపించాడు’తో కలిసి ఇది ఎవరినైనా రప్పించడానికి వర్తమానం పంపడాన్ని సూచిస్తుంది. తెలుగులో ‘కబురు పంపి’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి ఘట్టాన్ని సూచించే అనుసంధానంగా ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: μετεκαλέσατο
  choice: పిలిపించాడు
  rationale: ఎవరినైనా తన దగ్గరకు రావాలని పిలవడం లేదా కబురు పంపి రప్పించడం అనే మధ్యమవాచక భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ἰακὼβ τὸν πατέρα αὐτοῦ
  choice: తన తండ్రి యాకోబును
  rationale: గ్రీకు సమానాధికార నిర్మాణాన్ని తెలుగులో స్పష్టమైన, సహజమైన పదక్రమంతో అందిస్తుంది; ‘తన’ యోసేపునే సూచిస్తుంది.
- source_word: πᾶσαν τὴν συγγένειαν
  choice: అతని బంధువులందరినీ
  rationale: συγγένεια సూచించే విస్తృత బంధుత్వ సమూహాన్ని ‘బంధువులు’ స్పష్టంగా తెలియజేస్తుంది; ‘కుటుంబం’ అనడం పరిధిని సంకుచితం చేయవచ్చు.
- source_word: ἐν ψυχαῖς
  choice: మొత్తం ... గురిని
  rationale: అక్షరార్థంగా ‘ప్రాణాలలో’ అయినా, ఇక్కడ మనుషులను లెక్కించే గ్రీకు నుడికారం. తెలుగులో వ్యక్తుల సంఖ్యను సహజంగా తెలిపేందుకు ‘మొత్తం ... గురిని’ వాడబడింది.
- source_word: ἑβδομήκοντα πέντε
  choice: డెబ్బై ఐదుగురిని
  rationale: గ్రీకు సంఖ్యను నేరుగా అనువదించి, వ్యక్తుల లెక్క కావడంతో ‘గురు’ ప్రత్యయం జోడించబడింది.
theological_decisions:
- issue: ఆదికాండము సంప్రదాయాలతో పోల్చినప్పుడు యాకోబు బంధువుల సంఖ్య
  choice: డెబ్బై ఐదుగురు
  alternative: డెబ్బై మంది
  rationale: అపొస్తలుల కార్యములు గ్రీకు పాఠం స్పష్టంగా ‘డెబ్బై ఐదు’ అని చెబుతుంది. హెబ్రీ పాఠాన్ని అనుసరించే కొన్ని పాత నిబంధన వచనాల్లో కనిపించే ‘డెబ్బై’తో దీనిని సమన్వయపరచకుండా, ప్రధాన పాఠంలోని సంఖ్యను యథాతథంగా ఉంచి భేదాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘కబురు పంపి ... పిలిపించాడు’ అనే నిర్మాణం రెండు గ్రీకు క్రియల సంబంధాన్ని నిలుపుతుంది. సంఖ్యాభేదాన్ని పరిష్కరించకుండా పాఠ్య ఉద్రిక్తతను పాదసూచికలో భద్రపరిచాం.
