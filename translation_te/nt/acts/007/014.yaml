review_pass:
  verdict: revise
  source_fidelity: The draft preserves the two actions (ἀποστείλας and μετεκαλέσατο), identifies Jacob as Joseph’s father, renders the kinship group comprehensively, and correctly retains the Acts total of seventy-five. The wording ‘కబురు పంపి’ is a reasonable idiomatic unpacking of the objectless participle, but the pronoun in ‘అతని బంధువులందరినీ’ can momentarily be read as referring either to Joseph or Jacob.
  naturalness: The narrative is fluent modern standard Telugu. Recasting the relationship as ‘తన తండ్రియైన యాకోబును, ఆయన బంధువులందరినీ’ makes the referent explicit and reads more smoothly in a formal biblical narrative.
  terminology: ‘యోసేపు,’ ‘యాకోబు,’ ‘బంధువులు,’ and ‘డెబ్బై ఐదుగురు’ are appropriate. The footnote accurately distinguishes Acts’ seventy-five from the seventy in the Hebrew text of the cited Pentateuchal passages.
  issues:
  - severity: low
    issue: Ambiguous antecedent in ‘అతని బంధువులందరినీ’
    rationale: The Greek/genesis context intends Jacob’s entire kinship group. In Telugu, ‘అతని’ after ‘యాకోబును’ can be resolved as Jacob’s, but explicit reference avoids ambiguity without narrowing or otherwise interpreting the phrase.
  revised_text: అప్పుడు యోసేపు కబురు పంపి, తన తండ్రియైన యాకోబును, ఆయన బంధువులందరినీ—మొత్తం డెబ్బై ఐదుగురిని—పిలిపించాడు.[a]
