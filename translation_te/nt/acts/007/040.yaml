id: ACT.7.40
reference: Acts 7:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰπόντες τῷ Ἀαρών· Ποίησον ἡμῖν θεοὺς οἳ προπορεύσονται ἡμῶν· ὁ γὰρ Μωϋσῆς οὗτος, ὃς ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου, οὐκ οἴδαμεν τί ⸀ἐγένετο αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/040.yaml
  text: saying to Aaron[a], ‘Make gods for us who will go before us, for this Moses[b], who led us out from the land of Egypt—we do not know what has happened to him.’
translation:
  language: te
  text: వారు అహరోనుతో, “మాకు ముందుగా వెళ్లే దేవుళ్లను[a] తయారుచేయి. ఎందుకంటే, ఐగుప్తు దేశం నుండి మమ్మల్ని బయటికి నడిపించిన ఈ మోషే[b]కు ఏమైందో మాకు తెలియదు” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విగ్రహాలను.’ గ్రీకులో అక్షరార్థం ‘దేవుళ్లను.’ ఇది నిర్గమకాండ వృత్తాంతంలోని మాటలను ప్రతిధ్వనింపజేస్తూ, ప్రజల వాదన స్థానంలో వ్యాఖ్యానాత్మకమైన పదాన్ని పెట్టకుండా దానిని అలాగే నిలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఈ మోషే విషయానికొస్తే.’
    reason: translation_alternative
lexical_decisions:
- source_word: εἰπόντες τῷ Ἀαρών
  choice: వారు అహరోనుతో … అన్నారు
  rationale: అపొస్తలుల కార్యముల కథన ప్రవాహంలో క్రియావిశేషణీయ భూతకృదంతాన్ని సహజమైన తెలుగు ప్రత్యక్షోక్తి నిర్మాణంగా అందిస్తుంది.
- source_word: Ποίησον ἡμῖν
  choice: మాకోసం తయారుచేయి
  rationale: ఆజ్ఞార్థక ఏకవచనాన్ని నేరుగా వ్యక్తం చేస్తుంది; ἡμῖν లోని ప్రయోజనార్థాన్ని ‘మాకోసం’ స్పష్టం చేస్తుంది.
- source_word: θεοὺς
  choice: దేవుళ్లను
  rationale: గ్రీకు పదం అక్షరార్థంగా ‘దేవుళ్లు’; సందర్భాన్ని బట్టి ముందుగానే ‘విగ్రహాలు’ అని వ్యాఖ్యానించకుండా నిర్గమకాండంలోని మాటలను, ప్రజల వాదనను నిలుపుతుంది.
- source_word: οἳ προπορεύσονται ἡμῶν
  choice: మాకు ముందుగా వెళ్లే
  rationale: προπορεύομαι యొక్క ‘ముందుగా వెళ్లడం’ అనే గమనార్థాన్ని నిలుపుతుంది; ‘మమ్మల్ని నడిపించే’ అని అనువదించి మూలంలో స్పష్టంగా లేని నాయకత్వ భావాన్ని చేర్చదు.
- source_word: ὁ γὰρ Μωϋσῆς οὗτος
  choice: ఎందుకంటే … ఈ మోషే
  rationale: γάρ ఇచ్చే కారణ సంబంధాన్ని ‘ఎందుకంటే’తో, οὗτος యొక్క సూచనాత్మకమైన మరియు కొంత దూరంగా ఉంచే ధోరణిని ‘ఈ మోషే’తో వ్యక్తం చేస్తుంది.
- source_word: ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου
  choice: ఐగుప్తు దేశం నుండి మమ్మల్ని బయటికి నడిపించిన
  rationale: ἐξάγω లోని బయటికి నడిపించే గమనాన్ని, γῆς అనే స్పష్టమైన ‘దేశం’ పదాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: οὐκ οἴδαμεν τί ἐγένετο αὐτῷ
  choice: అతనికి ఏమైందో మాకు తెలియదు
  rationale: తెలుగులో సహజంగా వినిపిస్తూ, వారి ప్రస్తుత అజ్ఞానాన్ని మరియు మోషేకు ఏమి జరిగిందన్న ప్రశ్నను స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: విగ్రహారాధన సందర్భంలో θεοὺς అనువాదం
  choice: దేవుళ్లు
  alternative: విగ్రహాలు
  rationale: మూలపాఠం ప్రజల అభ్యర్థనను θεοὺς అనే పదంతోనే నివేదిస్తుంది; ‘దేవుళ్లు’ అనడం వారి భ్రష్టత్వంలోని ఉద్రిక్తతను నిలుపుతుంది, వ్యాఖ్యానాత్మకమైన వేరొక నామవాచకాన్ని ప్రధాన పాఠ్యంలో ప్రవేశపెట్టదు.
- issue: ὁ Μωϋσῆς οὗτος లోని సూచనాత్మక ధోరణి
  choice: ఈ మోషే
  alternative: ఈ మోషే విషయానికొస్తే
  rationale: ‘ఈ మోషే’ మూలంలోని సూచనను, సంభావ్యమైన నిర్లక్ష్య ధోరణిని సంక్షిప్తంగా నిలుపుతుంది; ప్రధాన పాఠ్యంలో అదనపు అంశీకరణను బలవంతంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. ప్రత్యక్షోక్తి సహజంగా ఉండేలా వాక్యక్రమం అమర్చబడింది. [a] గుర్తు దాని వివరణకు సంబంధించిన ‘దేవుళ్లను’ పదం వెంట ఉంచబడింది; [b] ‘ఈ మోషే’ వెంట ఉంది.
