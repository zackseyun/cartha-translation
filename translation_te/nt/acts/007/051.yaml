id: ACT.7.51
reference: Acts 7:51
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Σκληροτράχηλοι καὶ ἀπερίτμητοι ⸀καρδίαις καὶ τοῖς ὠσίν, ὑμεῖς ἀεὶ τῷ πνεύματι τῷ ἁγίῳ ἀντιπίπτετε, ὡς οἱ πατέρες ὑμῶν καὶ ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/051.yaml
  text: You stiff-necked people[a], uncircumcised in hearts and ears, you always resist the Holy Spirit; as your fathers did, so do you.
translation:
  language: te
  text: “మెడ బిగిసినవారలారా, హృదయాల్లోను చెవుల్లోను సున్నతి లేనివారలారా! మీరు ఎప్పుడూ పరిశుద్ధాత్మను ఎదిరిస్తున్నారు. మీ పితరులు చేసినట్లే మీరూ చేస్తున్నారు.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σκληροτράχηλοι
  choice: మెడ వంచని వారలారా
  rationale: ‘గట్టి మెడగలవారు’ అనే మూల రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతూ, మొండితనంతో లొంగనివారనే ప్రవక్తీయ నిందను వ్యక్తం చేస్తుంది.
- source_word: ἀπερίτμητοι
  choice: సున్నతి లేని వారలారా
  rationale: సాధారణ అపవిత్రతగా విప్పిచెప్పకుండా, అంతరంగ తిరుగుబాటును సూచించే నిబంధన సంబంధిత ప్రవక్తీయ రూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: καρδίαις καὶ τοῖς ὠσίν
  choice: హృదయాలకూ చెవులకూ
  rationale: గౌరవం లేదా పరిధిని సూచించే గ్రీకు దత్తివును తెలుగులో సహజంగా వ్యక్తం చేస్తూ, హృదయమూ వినికిడీ స్పందించకపోవడమనే జంట రూపకాన్ని కాపాడుతుంది.
- source_word: ἀεὶ
  choice: ఎప్పుడూ
  rationale: నిరంతరంగా కనిపించే ప్రవర్తనా ధోరణిని సహజంగా తెలియజేస్తుంది.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: పరిశుద్ధాత్మను
  rationale: అపొస్తలుల కార్యముల సందర్భంలో వ్యక్తిగత దైవిక పరిశుద్ధాత్మను సూచించే నిర్దిష్ట పదబంధానికి ప్రామాణిక తెలుగు రూపం.
- source_word: ἀντιπίπτετε
  choice: ఎదిరిస్తున్నారు
  rationale: కేవలం స్పందించకపోవడం కాక, చురుకైన వ్యతిరేకతను అతివిస్తరణ లేకుండా తెలియజేస్తుంది.
- source_word: οἱ πατέρες ὑμῶν
  choice: మీ పితరులు
  rationale: గ్రీకులోని పురుషలింగ పూర్వీకుల పదాన్ని, దాని వంశపారంపర్య మరియు వాక్చాతుర్య బలాన్ని నిలుపుతూ తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ὡς ... καὶ ὑμεῖς
  choice: చేసినట్లే మీరూ చేస్తున్నారు
  rationale: గ్రీకులో రెండో భాగంలో సూచితంగా ఉన్న క్రియను తెలుగులో స్పష్టపరచి, పితరులతో ప్రస్తుత శ్రోతల పోలికను సహజంగా పూర్తి చేస్తుంది.
theological_decisions:
- issue: ‘పరిశుద్ధాత్మ’ ప్రస్తావన
  choice: వ్యక్తిగత దైవిక పరిశుద్ధాత్మ
  alternative: సాధారణ దైవిక ప్రభావం లేదా పవిత్ర స్వభావం
  rationale: అపొస్తలుల కార్యములలో నిర్దిష్ట ఆర్టికల్‌తో ఉన్న ఈ పదబంధం సాధారణంగా వ్యక్తిగత పరిశుద్ధాత్మనే సూచిస్తుంది; అనువాదం అదనపు వివరణను చేర్చదు.
- issue: సున్నతి సంబంధిత నిబంధన రూపకం
  choice: ‘హృదయాలకూ చెవులకూ సున్నతి లేని’ అనే రూపకాన్ని నిలుపడం
  alternative: ‘కఠిన హృదయులు, వినని వారు’ వంటి వ్యాఖ్యానాత్మక రూపం
  rationale: వచనం ఇశ్రాయేలు లేఖనాలలోని ప్రవక్తీయ నిబంధన భాషను ఉద్దేశపూర్వకంగా ప్రతిధ్వనింపజేస్తుంది; దాన్ని సాధారణ మానసిక వివరణగా మార్చకూడదు.
- issue: పూర్వీకులను సూచించే లింగవిశిష్ట పదం
  choice: మీ పితరులు
  alternative: మీ పూర్వీకులు
  rationale: గ్రీకు పదం పురుషలింగ బహువచనం; ‘పితరులు’ దాని రూపాన్నీ స్తెఫను చేస్తున్న ఆరోపణలోని వాక్చాతుర్య సంబంధాన్నీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రత్యక్ష సంబోధన. ‘మెడ వంచని’ అనేది మూలంలోని సజీవ రూపకాన్ని సహజంగా ఉంచుతుంది; ‘వారలారా’ పునరుక్తి గ్రీకు వాక్యంలోని రెండు సమాంతర నిందాత్మక విశేషణాలకు తగిన వాక్చాతుర్య బలం ఇస్తుంది. పాఠ్యంలో పాదటిప్పణులు లేవు.
