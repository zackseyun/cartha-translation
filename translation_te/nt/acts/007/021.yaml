  yaml_path: translation/nt/acts/007/021.yaml
  text: But when he had been exposed[b][a], Pharaoh’s daughter took him up and raised him as her own son.
translation:
  language: te
  text: అయితే, అతడు బయట పెట్టివేయబడినప్పుడు, ఫరో కుమార్తె అతణ్ణి ఎత్తుకొని తన కుమారునిగా పెంచుకుంది[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తీసుకుంది.’ ఈ గ్రీకు క్రియ బయట పెట్టివేయబడిన శిశువును ఎత్తుకొని తీసుకోవడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘తనకు కుమారునిగా’ లేదా ‘ఒక కుమారునిగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτεθέντος
  choice: బయట వదిలివేయబడినప్పుడు
  rationale: శిశువును బయట ఉంచడం లేదా విడిచిపెట్టడం అనే సందర్భార్థాన్ని నిలుపుతుంది; ‘పారవేయబడినప్పుడు’ లేదా ‘త్యజించబడినప్పుడు’ అనేవాటిలో ఉండే ఉద్దేశపూర్వక నిరాకరణ భావాన్ని అనవసరంగా బలపరచదు.
- source_word: δὲ
  choice: అయితే
  rationale: మోషే బయట వదిలివేయబడిన స్థితి నుంచి ఫరో కుమార్తె అతణ్ణి తీసుకోవడం వైపు వచ్చే కథన మలుపును సహజంగా సూచిస్తుంది.
- source_word: ἀνείλατο
  choice: తీసుకుంది
  rationale: బయట వదిలివేయబడిన శిశువును తీసుకోవడం అనే గ్రీకు క్రియ భావాన్ని అందిస్తుంది; వెంటనే వచ్చే ‘కుమారునిగా పెంచుకుంది’ అనే ఫలితాన్ని ముందుగానే ‘దత్తత తీసుకుంది’ అని అర్థనిర్ణయం చేయదు.
- source_word: ἡ θυγάτηρ Φαραὼ
  choice: ఫరో కుమార్తె
  rationale: మూలంలోని సంబంధాన్ని సహజమైన ప్రామాణిక తెలుగు పదబంధంతో వ్యక్తం చేస్తుంది.
- source_word: ἀνεθρέψατο
  choice: పెంచుకుంది
  rationale: బిడ్డను పోషిస్తూ పెద్ద చేయడం అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; మధ్యమ స్వరంలోని వ్యక్తిగత సంబంధ భావం ‘పెంచుకుంది’లో నిలుస్తుంది.
- source_word: ἑαυτῇ εἰς υἱόν
  choice: తనకు కుమారునిగా
  rationale: ఆమెతో అతనికి ఏర్పడిన కుమారుని సంబంధం లేదా హోదాను స్పష్టంగా చెబుతుంది; మూలంలోని ‘తనకు’ మరియు ‘కుమారునిగా’ అనే రెండు అంశాలనూ నిలుపుతుంది.
