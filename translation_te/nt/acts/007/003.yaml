  naturalness: The phrasing is clear and modern. Using the more standard spelling “నుండి” and a colon after the introductory speech formula improves smoothness and punctuation. “బయలుదేరి” is an idiomatic serial-command rendering in Telugu.
  terminology: “బంధువులు” is a suitable contemporary equivalent for συγγένεια and does not narrow the term to an immediate household. The footnote should give complete alternative phrases, including “నుండి,” rather than isolated genitive forms that are not independently parallel to the anchored expression.
