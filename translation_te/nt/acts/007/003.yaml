id: ACT.7.3
reference: Acts 7:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτόν· Ἔξελθε ἐκ τῆς γῆς σου καὶ ⸀ἐκ τῆς συγγενείας σου, καὶ δεῦρο εἰς ⸀τὴν γῆν ἣν ἄν σοι δείξω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/003.yaml
  text: And he said to him[a], ‘Go out from your land and from your kindred, and come into the land that I will show you.’
translation:
  language: te
  text: 'ఆయన అతనితో ఇలా చెప్పాడు: “నీ దేశం నుండి, నీ బంధువుల[a] నుండి బయలుదేరి, నేను నీకు చూపించే దేశంలోకి రా.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ బంధుజనుల నుండి” లేదా “నీ కుటుంబానికి చెందినవారి నుండి.” గ్రీకు పదం συγγένεια ఒక వ్యక్తి బంధుత్వ సమూహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτόν
  choice: ఆయన అతనితో ... అని చెప్పాడు
  rationale: గ్రీకు వాక్యంలోని సాధారణ కథన సూత్రాన్ని, అలాగే αὐτόν అనే సర్వనామాన్ని నిలుపుతుంది; సందర్భంలో అబ్రాహాము ఇప్పటికే గుర్తించబడ్డాడు కాబట్టి అతని పేరును చేర్చలేదు.
- source_word: Ἔξελθε
  choice: బయలుదేరు
  rationale: ἐξέρχομαι ఆజ్ఞారూపంలోని బయటకు వెళ్లే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; తరువాత వచ్చే ‘నుండి’ పదాలతో చక్కగా సరిపోతుంది.
- source_word: ἐκ τῆς γῆς σου
  choice: నీ దేశం నుండి
  rationale: ఇక్కడ γῆ నివసించే భూభాగాన్ని సూచిస్తుంది. ‘దేశం’ సాధారణ పాఠకులకు సహజంగా ఉండి, ‘నేల’ వల్ల కలగగల కేవలం మట్టి లేదా భూమి అనే సంకుచిత భావాన్ని నివారిస్తుంది.
- source_word: συγγενείας
  choice: బంధువులు
  rationale: συγγένεια ఒక వ్యక్తి బంధుత్వ సమూహాన్ని సూచిస్తుంది. ‘బంధువులు’ ఆధునిక తెలుగులో సహజంగా, సమూహార్థంతో అర్థమవుతుంది; ‘కుటుంబం’ కంటే విస్తృతమైన బంధుత్వ వలయాన్ని సూచించగలదు.
- source_word: δεῦρο
  choice: రా
  rationale: δεῦροలోని ‘ఇక్కడికి రా’ అనే దిశాసూచక భావాన్ని నిలుపుతుంది. పరోక్షంగా ‘వెళ్లు’ అని మార్చకుండా, దేవుని ప్రత్యక్ష ఆజ్ఞ స్వరాన్ని కాపాడుతుంది.
- source_word: εἰς τὴν γῆν
  choice: దేశానికి
  rationale: εἰς సూచించే గమ్యదిశను తెలుగులో సహజమైన సంప్రదాన విభక్తితో వ్యక్తపరుస్తుంది.
- source_word: ἣν ἄν σοι δείξω
  choice: నేను నీకు చూపించే
  rationale: ἄνతో కూడిన aorist subjunctive ఇక్కడ భవిష్యదర్థక సంబంధ వాక్యంగా పనిచేస్తుంది. తెలుగు అసమాపక రూపం భవిష్య గమ్యాన్ని సహజంగా తెలియజేస్తుంది; అనిశ్చితిని అనవసరంగా చేర్చదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ప్రత్యక్ష వాక్య నిర్మాణం వాడబడింది. దైవవాక్యంలోని ‘రా’ అనే ఏకవచన ఆజ్ఞను మూలంలోని దిశాసూచక భావం కోసం నిలిపాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘బంధువుల’ పదం వెంట ఉంచాం.
