id: ACT.7.12
reference: Acts 7:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀκούσας δὲ Ἰακὼβ ὄντα ⸂σιτία εἰς Αἴγυπτον⸃ ἐξαπέστειλεν τοὺς πατέρας ἡμῶν πρῶτον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/012.yaml
  text: But when Jacob heard that there was grain in Egypt[a], he sent out our fathers the first time.
translation:
  language: te
  text: అయితే ఐగుప్తులో ధాన్యం ఉందని యాకోబు విని, మన పితరులను మొదటిసారి అక్కడికి పంపించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆహార సరఫరాలు.” గ్రీకు పదం విస్తృతంగా ఆహార సామగ్రిని సూచించవచ్చు; అయితే ఈ సందర్భంలో ధాన్యమే ఉద్దేశమై ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: విని
  rationale: భూతకాల అసమాపక క్రియ ప్రధాన క్రియకు ముందున్న సందర్భాన్ని సూచిస్తుంది; తెలుగులో ‘విని’ సహజంగా సంఘటనల క్రమాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: స్తెఫను కథనంలో స్వల్ప మార్పును సూచిస్తుంది; బలమైన వ్యతిరేకతను మోపకుండా సంభాషణ ప్రవాహాన్ని తెలియజేస్తుంది.
- source_word: ὄντα ⸂σιτία εἰς Αἴγυπτον⸃
  choice: ఐగుప్తులో ధాన్యం ఉందని
  rationale: ἀκούω తర్వాతి accusative-participle నిర్మాణాన్ని తెలుగులో సహజమైన పరోక్ష వాక్యంగా అనువదించాం.
- source_word: σιτία
  choice: ధాన్యం
  rationale: ఈ పదం ఆహార సరఫరాలను విస్తృతంగా సూచించగలిగినా, యోసేపు కాలపు కరవు సందర్భంలో ‘ధాన్యం’ అత్యంత సముచితం.
- source_word: ἐξαπέστειλεν
  choice: అక్కడికి పంపించాడు
  rationale: వారిని ఐగుప్తుకు ప్రయాణంగా పంపిన భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ‘అక్కడికి’ గమ్యాన్ని స్పష్టం చేస్తుంది.
- source_word: τοὺς πατέρας ἡμῶν
  choice: మన పితరులను
  rationale: గ్రీకు వచనంలోని పురుష పూర్వికుల కుటుంబ సంబంధ పదాన్ని నిలుపుతుంది; ఇక్కడ యాకోబు కుమారులనే ప్రత్యేకంగా సూచిస్తుంది.
- source_word: πρῶτον
  choice: మొదటిసారి
  rationale: తర్వాత జరిగిన రెండో ప్రయాణానికి భిన్నంగా ఇది తొలి ప్రయాణమని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: τοὺς πατέρας ἡμῶν అనువాదం
  choice: మన పితరులను
  alternative: మన పూర్వీకులను; గోత్రపితలను
  rationale: ఇక్కడ సాధారణంగా స్త్రీపురుష పూర్వీకులందరినీ కాకుండా ఇశ్రాయేలు చరిత్రలోని నిర్దిష్ట పురుషులను సూచిస్తున్నందున, మూలంలోని కుటుంబపరమైన పురుష రూపాన్ని నిలిపాం. ‘గోత్రపితలు’ అనేది మూలం కంటే ఎక్కువ వ్యాఖ్యానాత్మకం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘పితరులు’ బైబిలు సందర్భానికి తగినదే అయినా సాధారణ పాఠకునికి అర్థమయ్యే స్థిరమైన పదం. అడుగుసూచి గుర్తు ప్రధాన వచనంలో చేర్చబడింది.
