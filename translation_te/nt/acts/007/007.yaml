id: ACT.7.7
reference: Acts 7:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὸ ἔθνος ᾧ ⸀ἐὰν ⸀δουλεύσουσιν κρινῶ ἐγώ, ⸂ὁ θεὸς εἶπεν⸃, καὶ μετὰ ταῦτα ἐξελεύσονται καὶ λατρεύσουσίν μοι ἐν τῷ τόπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/007.yaml
  text: And I will judge the nation that they will serve[a], God said[b], and after these things they will come out and worship me in this place.
translation:
  language: te
  text: దేవుడు, ‘వారు ఏ జనానికి బానిసలుగా సేవ చేస్తారో, ఆ జనానికి నేనే తీర్పు విధిస్తాను; ఆ తరువాత వారు బయటికి వచ్చి ఈ స్థలంలో నన్ను ఆరాధిస్తారు,’ అని చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθνος
  choice: జనం
  rationale: ఇక్కడ ఈ పదం అబ్రాహాము సంతానాన్ని బానిసలుగా ఉంచే ఐగుప్తు అనే సమష్టిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘జనం’ సహజంగా ఉండి, రాజకీయ జాతి అనే అనవసర భావాన్ని రుద్దదు.
- source_word: ᾧ ἐὰν δουλεύσουσιν
  choice: ఏ జనానికి దాసులుగా సేవ చేస్తారో
  rationale: దత్తివ విభక్తి సంబంధసర్వనామంతో కూడిన δουλεύω సేవ చేయబడే సమష్టిని సూచిస్తుంది. ఐగుప్తు బానిసత్వ సందర్భాన్ని స్పష్టపరుస్తూనే క్రియారూపాన్ని నిలుపుకోవడానికి ‘దాసులుగా సేవ చేస్తారు’ అని అనువదించబడింది.
- source_word: κρινῶ ἐγώ
  choice: ఆ జనానికి నేనే తీర్పు తీరుస్తాను
  rationale: κρίνω దైవిక న్యాయనిర్ణయాన్ని సూచిస్తుంది; ἐγώ ఇచ్చే ఉద్ఘాటనను ‘నేనే’ నిలుపుతుంది. ‘శిక్షిస్తాను’ కంటే ‘తీర్పు తీరుస్తాను’ న్యాయార్థాన్ని విస్తృతంగా కాపాడుతుంది.
- source_word: ὁ θεὸς εἶπεν
  choice: అని దేవుడు చెప్పాడు
  rationale: స్తెఫను ఉటంకిస్తున్న దైవవాక్యంలోని పలుకుబడి సూచనను సహజ తెలుగు క్రమంలో అందిస్తుంది.
- source_word: μετὰ ταῦτα
  choice: ఆ తరువాత
  rationale: గ్రీకు బహువచన సూచన సందర్భంలో జరిగిన ఆ సంగతుల తరువాతి క్రమాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἐξελεύσονται
  choice: బయటికి వస్తారు
  rationale: బానిసత్వ దేశం నుండి ఇశ్రాయేలీయుల నిర్గమనాన్ని సరళంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λατρεύσουσίν μοι
  choice: నన్ను ఆరాధిస్తారు
  rationale: దేవునికి అర్పించే మతపరమైన సేవను λατρεύω సూచిస్తుంది; సాధారణ సేవతో భేదాన్ని ఆధునిక తెలుగులో ‘ఆరాధిస్తారు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν τῷ τόπῳ τούτῳ
  choice: ఈ స్థలంలో
  rationale: τόπος యొక్క ప్రత్యక్ష అర్థాన్ని, ప్రసంగంలోని సూచనాత్మకతను సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: బానిసత్వ సందర్భంలో δουλεύω అనువాదం
  choice: దాసులుగా సేవ చేస్తారు
  alternative: సేవ చేస్తారు; బానిసలై ఉంటారు
  rationale: కేవలం ‘సేవ చేస్తారు’ అంటే ఐగుప్తు బానిసత్వపు బలవంతపు స్వభావం తెలుగులో మసకబారవచ్చు; ‘దాసులుగా’ అనే సందర్భానుగుణ విశేషణం దానిని స్పష్టం చేస్తూ గ్రీకు క్రియలోని సేవ భావాన్నీ నిలుపుతుంది.
- issue: దేవుని పట్ల λατρεύω అనువాదం
  choice: నన్ను ఆరాధిస్తారు
  alternative: నాకు సేవ చేస్తారు
  rationale: ఈ క్రియ దేవునికి చేసే మతపరమైన లేదా పవిత్ర సేవను సూచిస్తుంది. ‘ఆరాధిస్తారు’ దాని ప్రత్యేక భావాన్ని సాధారణ శ్రమ లేదా సేవగా తగ్గించకుండా అందిస్తుంది.
- issue: κρινῶ ἐγώ లో కర్త ఉద్ఘాటన
  choice: నేనే తీర్పు తీరుస్తాను
  alternative: నేను తీర్పు తీరుస్తాను
  rationale: వ్యక్త సర్వనామమైన ἐγώ దైవిక కర్తకు ఉద్ఘాటన ఇస్తుంది; ‘నేనే’ దానిని తెలుగులో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని ప్రత్యక్ష వాక్య నిర్మాణం మరియు ‘నేనే’ అనే ఉద్ఘాటన నిలుపబడ్డాయి. బానిసత్వ భావాన్ని అస్పష్టంగా వదలకుండా ‘దాసులుగా సేవ’ అని చెప్పబడింది; అవసరం లేని పాదటిప్పణులు చేర్చలేదు.
