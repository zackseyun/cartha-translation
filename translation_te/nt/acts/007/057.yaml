  text: κράξαντες δὲ φωνῇ μεγάλῃ συνέσχον τὰ ὦτα αὐτῶν, καὶ ὥρμησαν ὁμοθυμαδὸν ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/057.yaml
  text: But crying out with a loud voice[a], they covered their ears and rushed together at him,
translation:
  language: te
  text: కానీ వారు బిగ్గరగా కేకలు వేస్తూ తమ చెవులు మూసుకొని, అందరూ కలిసి అతనిమీదికి దూసుకెళ్లారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κράξαντες
  choice: కేకలు వేస్తూ
  rationale: క్రియావిశేషణ రూపంలోని ఈ పదం పెద్దగా కేక వేయడాన్ని సూచిస్తుంది. తరువాతి చర్యలతో దాని సంబంధాన్ని నిలుపుతూ, గ్రీకు పాఠంలో లేని ప్రత్యేక భావోద్వేగాన్ని జోడించకుండా ఈ రూపం సహజంగా ఉంది.
- source_word: δὲ
  choice: కానీ
  rationale: స్తెఫను దర్శనానికి జనసమూహం చూపిన విరోధపూరిత ప్రతిస్పందనను సూచించే స్వల్ప వ్యత్యాసాన్ని ఇది సహజంగా తెలియజేస్తుంది.
- source_word: φωνῇ μεγάλῃ
  choice: పెద్దగా
  rationale: అక్షరార్థంగా ‘గొప్ప/పెద్ద స్వరంతో’ అనే భావం. ఆధునిక తెలుగులో ‘పెద్దగా కేకలు వేస్తూ’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: συνέσχον τὰ ὦτα αὐτῶν
  choice: తమ చెవులు మూసుకొని
  rationale: వినకుండా ఉండేందుకు చెవులను మూసుకోవడం అనే గ్రీకు నుడికార భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὥρμησαν
  choice: దూసుకెళ్లారు
  rationale: ఆకస్మికంగా, బలంగా ముందుకు వెళ్లడాన్ని ఈ క్రియ సూచిస్తుంది. ‘దూసుకెళ్లారు’ ఆ చలన తీవ్రతను సహజంగా అందిస్తుంది.
- source_word: ὁμοθυμαδὸν
  choice: ఒక్కుమ్మడిగా
  rationale: అందరూ కలిసి ఒకే దిశలో చర్యకు దిగారనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది; వారి ఐక్య ఉద్దేశం అనే సూక్ష్మభావాన్ని పాదటిప్పణి చూపిస్తుంది.
- source_word: ἐπ’ αὐτόν
  choice: అతని మీదికి
  rationale: ἐπί + ద్వితీయా విభక్తి ఒక వ్యక్తివైపు ఉద్దేశించిన కదలికను సూచిస్తుంది. విరోధపూరితంగా దూసుకెళ్లే సందర్భంలో ‘అతని మీదికి’ సహజమైన తెలుగు ప్రయోగం.
