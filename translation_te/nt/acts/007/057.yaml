  verdict: revise
  source_fidelity: 'The draft accurately represents the sequence and sense of the Greek: loud crying, shutting their own ears, and a collective rush directed at Stephen. “అతని మీదికి” adequately conveys ἐπ’ αὐτόν in this hostile-motion context.'
