source:
  edition: SBLGNT
  text: καὶ ὧδε ἔχει ἐξουσίαν παρὰ τῶν ἀρχιερέων δῆσαι πάντας τοὺς ἐπικαλουμένους τὸ ὄνομά σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/014.yaml
  text: And here he has authority from the chief priests to bind all who call on your name[a].
translation:
  language: te
  text: ఇక్కడ కూడా నీ నామాన్ని పిలిచే వారందరినీ బంధించడానికి అతనికి ప్రధాన యాజకుల నుండి అధికారం ఉంది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రార్థనలో నీ నామాన్ని పిలిచే వారందరినీ.’ గ్రీకు ప్రయోగం ఒకరి నామాన్ని పిలవడం అనే ప్రామాణిక బైబిలీయ నుడికారం; ఇది తరచుగా ప్రార్థనలో ఆ వ్యక్తిని ఆశ్రయించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε
  choice: ఇక్కడ
  rationale: ఇది స్థలాన్ని సూచించే క్రియావిశేషణం. సందర్భంలో అననీయ దమస్కులో సౌలుకు ఉన్న అధికారాన్ని గురించి మాట్లాడుతున్నాడు.
- source_word: ἐξουσίαν
  choice: అధికారం
  rationale: ప్రధాన యాజకుల నుండి పొందిన అధికారిక అనుమతి లేదా హక్కును ఈ పదం సూచిస్తుంది.
- source_word: παρὰ τῶν ἀρχιερέων
  choice: ప్రధాన యాజకుల నుండి
  rationale: παρά షష్ఠీ విభక్తితో అధికారానికి మూలాన్ని సూచిస్తుంది; ἀρχιερεῖς యెరూషలేములోని ప్రధాన యాజక నాయకత్వాన్ని సూచిస్తుంది.
- source_word: δῆσαι
  choice: బంధించడానికి
  rationale: మూలపదంలోని ‘కట్టివేయడం/బంధించడం’ అనే చిత్రాన్ని నిలుపుతూ, అరెస్టు చేయాలనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πάντας τοὺς ἐπικαλουμένους
  choice: పిలిచే వారందరినీ
  rationale: నామాన్ని పిలవడం లేదా ఆ నామాన్ని ఆశ్రయించి ప్రార్థించడం అనే బైబిలీయ ప్రయోగాన్ని అనవసరంగా విస్తరించకుండా నిలుపుతుంది.
- source_word: τὸ ὄνομά σου
  choice: నీ నామాన్ని
  rationale: మూలంలోని ప్రత్యక్ష సంబోధనను, ‘నామం’ అనే బైబిలీయ భావగర్భిత పదాన్ని యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: యేసును ఉద్దేశించి చెప్పిన ‘నీ నామాన్ని పిలిచేవారు’ అనే ప్రయోగం
  choice: ‘నీ నామాన్ని పిలిచే’ అనే ప్రయోగాన్ని నిలుపడం
  alternative: ‘నీకు ప్రార్థించేవారు’ లేదా ‘నీ అధికారాన్ని ఆశ్రయించేవారు’
  rationale: ἐπικαλεῖσθαι τὸ ὄνομα అనే బైబిలీయ ప్రయోగం ప్రార్థనలో నామాన్ని ఆహ్వానించడం, ఆ వ్యక్తిని ఆశ్రయించడం అనే భావాలను కలిగి ఉంటుంది. ఇక్కడ మాటలు నేరుగా యేసును ఉద్దేశించి ఉన్నాయి. అనువాదం ఈ వేదాంతపరమైన బరువును తగ్గించకుండా, మూలంలో లేని స్పష్టీకరణను కూడా చేర్చకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘ప్రధాన యాజకులు,’ ‘అధికారం,’ ‘బంధించడం,’ ‘నామాన్ని పిలవడం’ వంటి పదాలు మూలభాష భావాన్ని, బైబిలీయ నుడికారాన్ని నిలుపుతాయి.
