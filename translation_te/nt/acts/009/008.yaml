  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని దృశ్యాత్మకతను, కళ్లు తెరిచి ఉన్నా చూడలేకపోయాడనే వ్యత్యాసాన్ని కాపాడుతూ optimal equivalence అనుసరించబడింది.
