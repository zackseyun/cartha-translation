id: ACT.9.8
reference: Acts 9:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἠγέρθη δὲ ⸀Σαῦλος ἀπὸ τῆς γῆς, ἀνεῳγμένων ⸀δὲ τῶν ὀφθαλμῶν αὐτοῦ ⸀οὐδὲν ἔβλεπεν· χειραγωγοῦντες δὲ αὐτὸν εἰσήγαγον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/008.yaml
  text: But Saul got up from the ground[a], and though his eyes were open, he saw nothing. So they led him by the hand and brought him into Damascus.
translation:
  language: te
  text: అప్పుడు సౌలు నేల నుండి లేచాడు. అతని కళ్లు తెరిచి ఉన్నప్పటికీ[a] అతనికి ఏమీ కనిపించలేదు. అప్పుడు వారు అతని చెయ్యి పట్టుకొని దమస్కులోకి తీసుకెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “అతని కళ్లు తెరవబడి ఉండగా అతనికి ఏమీ కనిపించలేదు.” కళ్లు తెరిచి ఉన్నప్పటికీ అతను చూడలేకపోయాడనే వ్యత్యాసాన్ని గ్రీకు నిర్మాణం ప్రత్యేకంగా చూపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγέρθη
  choice: లేచాడు
  rationale: ఇక్కడ ἐγείρω యొక్క రూపం కథన సందర్భంలో అకర్మక భావాన్ని ఇస్తుంది; నేలపై నుంచి లేవడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀπὸ τῆς γῆς
  choice: నేలమీద నుంచి
  rationale: ఈ సందర్భంలో γῆ సౌలు పడిపోయిన నేలను సూచిస్తుంది; భూమండలాన్ని లేదా భూభాగాన్ని కాదు.
- source_word: ἀνεῳγμένων ... τῶν ὀφθαλμῶν αὐτοῦ
  choice: అతని కళ్లు తెరిచి ఉన్నా
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణంలోని అనుబంధ పరిస్థితిని, అలాగే కళ్లు తెరిచి ఉన్నప్పటికీ చూడలేకపోయాడనే వ్యత్యాసాన్ని సహజంగా నిలుపుతుంది.
- source_word: οὐδὲν ἔβλεπεν
  choice: అతనికి ఏమీ కనిపించలేదు
  rationale: పూర్తిగా దృష్టి లేకపోవడాన్ని సహజ తెలుగు ప్రయోగంలో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: χειραγωγοῦντες
  choice: అతన్ని చెయ్యి పట్టుకొని నడిపిస్తూ
  rationale: సహాయం అవసరమైన వ్యక్తిని చెయ్యి పట్టుకొని నడిపించడమనే నిర్దిష్ట దృశ్యాన్ని కాపాడుతుంది.
- source_word: εἰσήγαγον εἰς Δαμασκόν
  choice: దమస్కులోకి తీసుకెళ్లారు
  rationale: నగరం లోపలికి తీసుకెళ్లిన గమనాన్ని తెలియజేస్తుంది; ముందున్న ‘నడిపిస్తూ’ అనే పదంతో అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: δὲ
  choice: అప్పుడు / అయినా / కాబట్టి
  rationale: మూడుసార్లు వచ్చిన δέ కథన పురోగతిని, స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది. తెలుగు వాక్యప్రవాహానికి అనుగుణంగా వాటి సందర్భోచిత సంబంధాలను వేర్వేరు అనుసంధానాలతో వ్యక్తం చేశాం.
- source_word: Σαῦλος
  choice: సౌలు
  rationale: తెలుగు బైబిలు సంప్రదాయంలో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
- source_word: Δαμασκόν
  choice: దమస్కు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన స్థలనామ రూపాన్ని ఉపయోగించాం.
