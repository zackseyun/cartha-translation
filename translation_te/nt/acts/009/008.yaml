revisions:
- from: అప్పుడు సౌలు నేలమీద నుంచి లేచాడు. అతని కళ్లు తెరిచి ఉన్నా[a] అతనికి ఏమీ కనిపించలేదు. కాబట్టి వారు అతన్ని చెయ్యి పట్టుకొని నడిపిస్తూ దమస్కులోకి తీసుకెళ్లారు.
  to: అప్పుడు సౌలు నేల నుండి లేచాడు. అతని కళ్లు తెరిచి ఉన్నప్పటికీ[a] అతనికి ఏమీ కనిపించలేదు. అప్పుడు వారు అతని చెయ్యి పట్టుకొని దమస్కులోకి తీసుకెళ్లారు.
  rationale: The final connective is revised from the causal “కాబట్టి” to sequential “అప్పుడు,” avoiding an unwarranted causal implication from δέ. The final action is recast to express both leading by the hand and bringing Saul into Damascus in concise, natural Telugu. The footnote anchor and its explanatory content are retained.
