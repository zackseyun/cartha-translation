id: ACT.9.26
reference: Acts 9:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Παραγενόμενος δὲ ⸀εἰς Ἰερουσαλὴμ ⸀ἐπείραζεν κολλᾶσθαι τοῖς μαθηταῖς· καὶ πάντες ἐφοβοῦντο αὐτόν, μὴ πιστεύοντες ὅτι ἐστὶν μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/026.yaml
  text: And when he came to Jerusalem[a], he was trying to join the disciples, but they were all afraid of him, not believing that he was a disciple.
translation:
  language: te
  text: అతడు యెరూషలేముకు వచ్చినప్పుడు, శిష్యులతో చేరడానికి[a] ప్రయత్నిస్తూ ఉన్నాడు. అయితే అతడు శిష్యుడని నమ్మక, వారందరూ అతనికి భయపడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శిష్యులతో సన్నిహితంగా కలిసివుండడానికి.”
    reason: కొλλάομαι అనే పదంలో ‘జతపడడం, అంటుకొని ఉండడం’ అనే సన్నిహిత సంబంధ భావం కూడా ఉంది.
lexical_decisions:
- source_word: Παραγενόμενος
  choice: వచ్చినప్పుడు
  rationale: Aorist participle ప్రధాన చర్యకు ముందున్న సందర్భాన్ని సూచిస్తుంది. ‘వచ్చినప్పుడు’ కాలసంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: —
  rationale: ఇది కథనాన్ని ముందుకు నడిపే మృదువైన అనుసంధాన అవ్యయం. తెలుగులో వాక్యప్రవాహం సహజంగా ఉండేందుకు ప్రత్యేక పదంతో అనువదించలేదు.
- source_word: εἰς Ἰερουσαλήμ
  choice: యెరూషలేముకు
  rationale: నగరంవైపు గమనాన్ని సూచించే εἰς‌కు సహజమైన తెలుగు రూపం.
- source_word: ἐπείραζεν
  choice: ప్రయత్నిస్తూ ఉన్నాడు
  rationale: Imperfect రూపం కొనసాగుతున్న ప్రయత్నాన్ని సూచిస్తుంది; ‘ప్రయత్నిస్తూ ఉన్నాడు’ ఆ అపూర్ణ క్రియాస్వరూపాన్ని నిలుపుతుంది.
- source_word: κολλᾶσθαι
  choice: చేరడానికి
  rationale: κολλάομαι యొక్క మూలభావం అంటుకోవడం లేదా జతపడడం. ఇక్కడ శిష్యుల సమూహంతో సంబంధం ఏర్పరచుకొని వారిలో కలవాలనే ప్రయత్నాన్ని ‘చేరడానికి’ సహజంగా తెలియజేస్తుంది; అధికారిక సభ్యత్వాన్ని సూచించదు.
- source_word: τοῖς μαθηταῖς
  choice: శిష్యులతో
  rationale: యెరూషలేములోని తెలిసిన శిష్యుల సమూహాన్ని సూచిస్తుంది. సహవాస సంబంధాన్ని తెలుగులో ‘తో’ విభక్తి సహజంగా వ్యక్తపరుస్తుంది.
- source_word: καὶ πάντες ἐφοβοῦντο αὐτόν
  choice: అయితే ... వారందరూ అతనికి భయపడ్డారు
  rationale: ముందటి ప్రయత్నానికి ఎదురైన ప్రతిస్పందనను ‘అయితే’ స్పష్టంగా చూపిస్తుంది. πάντες‌ను ‘వారందరూ’గా అనువదించడం శిష్యులందరినీ సూచిస్తుంది.
- source_word: μὴ πιστεύοντες
  choice: నమ్మక
  rationale: ఈ వర్తమాన కృదంతం వారి భయానికి కారణాన్ని తెలియజేస్తుంది. ‘నమ్మక’ కృదంత సంబంధాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ὅτι ἐστὶν μαθητής
  choice: అతడు శిష్యుడని
  rationale: గ్రీకులో వర్తమాన కాలం ఉన్నప్పటికీ, తెలుగు పరోక్ష వాక్యంలో ‘అని’ నిర్మాణం కాలాన్ని అనవసరంగా మార్చకుండా భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: μαθητής
  choice: శిష్యుడు
  rationale: యేసును అనుసరించి నేర్చుకునే వ్యక్తిని సూచించే స్థిరమైన, సందర్భోచితమైన తెలుగు పదం.
theological_decisions:
- issue: యెరూషలేము విశ్వాసులతో సౌలు ఏర్పరచుకోవాలనుకున్న సంబంధ స్వభావం
  choice: ‘శిష్యులతో చేరడానికి’ అని అనువదించడం
  alternative: ‘శిష్యులతో సన్నిహితంగా కలిసివుండడానికి’ లేదా ‘శిష్యులకు అంటిపెట్టుకోవడానికి’
  rationale: వాక్యం సౌలు శిష్యుల మధ్య అంగీకారం పొంది వారితో కలవాలనుకున్న ప్రయత్నాన్ని వివరిస్తుంది. ఇది అధికారిక సంఘ సభ్యత్వం లేదా ఏదైనా మతకర్మను సూచిస్తుందని పాఠ్యం చెప్పదు; కాబట్టి అలాంటి భావాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘ప్రయత్నిస్తూ ఉన్నాడు’ ద్వారా గ్రీకు imperfect యొక్క కొనసాగుతున్న చర్యను నిలిపి ఉంచాం. పాదసూచిక గుర్తును అది వివరించే ‘చేరడానికి’ పదం వెంట ఉంచాం.
