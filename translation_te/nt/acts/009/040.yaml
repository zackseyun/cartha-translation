source:
  edition: SBLGNT
  text: ἐκβαλὼν δὲ ἔξω πάντας ὁ Πέτρος ⸀καὶ θεὶς τὰ γόνατα προσηύξατο, καὶ ἐπιστρέψας πρὸς τὸ σῶμα εἶπεν· Ταβιθά, ἀνάστηθι. ἡ δὲ ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς, καὶ ἰδοῦσα τὸν Πέτρον ἀνεκάθισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/040.yaml
  text: But Peter put them all outside[a], knelt down and prayed, and turning toward the body said, “Tabitha, arise.” Then she opened her eyes, and when she saw Peter, she sat up.
translation:
  language: te
  text: కాని పేతురు అందరినీ బయటికి పంపి, మోకాళ్లపై వంగి ప్రార్థించాడు. తరువాత శరీరం వైపు తిరిగి, “తబితా, లే[a]” అన్నాడు. ఆమె కళ్లు తెరిచి, పేతురును చూసి లేచి కూర్చుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “లేచి నిలబడు.” గ్రీకు ఆజ్ఞను “లే” లేదా “లేచి నిలబడు” అని అనువదించవచ్చు. ఇక్కడ “లే” అనే రూపం సందర్భపు గంభీరతను, అలాగే తరువాత ఆమె కూర్చున్నదనే వర్ణనను అనవసరంగా మించకుండా ఉంచుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλὼν ἔξω πάντας
  choice: అందరినీ బయటికి పంపి
  rationale: అక్కడ ఉన్న వారందరినీ గది వెలుపలికి పంపిన చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; బలవంతంగా వెళ్లగొట్టాడనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: θεὶς τὰ γόνατα
  choice: మోకాళ్లూని
  rationale: ప్రార్థించడానికి మోకాళ్లపై నిలిచిన భంగిమను తెలిపే గ్రీకు నుడికారానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: προσηύξατο
  choice: ప్రార్థించాడు
  rationale: ప్రత్యేక విస్తరణ అవసరం లేకుండా గ్రీకు క్రియ యొక్క సాధారణ అర్థాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ἐπιστρέψας πρὸς τὸ σῶμα
  choice: శరీరం వైపు తిరిగి
  rationale: పేతురు శరీరం దిశగా తిరిగిన భౌతిక చర్యను నిలుపుతుంది; σῶμαకు ‘శవం’ కంటే ‘శరీరం’ నేరమైన సమానార్థకం.
- source_word: Ταβιθά
  choice: తబితా
  rationale: వ్యక్తి పేరును తెలుగులో ధ్వన్యనుసారంగా లిప్యంతరీకరించింది.
- source_word: ἀνάστηθι
  choice: లే
  rationale: పడుకున్న స్థితి నుంచి లేవడం, జీవానికి తిరిగి లేవడం అనే సందర్భోచిత విస్తృతిని సంక్షిప్తంగా నిలుపుతుంది; తెలుగు సంభాషణలో సహజమైన ప్రత్యక్ష ఆజ్ఞ.
- source_word: ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς
  choice: ఆమె కళ్లు తెరిచి
  rationale: గ్రీకు వాక్యభాగాన్ని నేరుగా, సహజమైన తెలుగు వాక్యక్రమంలో అందిస్తుంది.
- source_word: ἰδοῦσα τὸν Πέτρον
  choice: పేతురును చూసి
  rationale: క్రియల వరుసను స్పష్టంగా ఉంచుతూ గ్రీకు కృదంతాన్ని సహజమైన తెలుగు రూపంలో అనువదిస్తుంది.
- source_word: ἀνεκάθισεν
  choice: లేచి కూర్చుంది
  rationale: పడుకున్న స్థితి నుంచి పైకి లేచి కూర్చోవడాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: δὲ / καί
  choice: అప్పుడు / తరువాత
  rationale: బలమైన వ్యతిరేకతను సూచించకుండా కథన పురోగతిని సహజమైన తెలుగు సంధానాలతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పునరుజ్జీవ సందర్భంలోని ἀνάστηθι ఆజ్ఞ అనువాదం
  choice: లే
  alternative: లేచి నిలబడు
  rationale: ‘లే’ అనే రూపం గ్రీకు ఆజ్ఞలోని ‘లేవు/పైకి లే’ అనే అర్థవిస్తృతిని నిలుపుతుంది. ‘లేచి నిలబడు’ అని అనడం ఆమె వెంటనే నిలబడిందనే భావాన్ని కలిగించవచ్చు; కానీ తరువాతి వాక్యంలో ఆమె కూర్చుందని మాత్రమే ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి పాటించబడింది. ‘మోకాళ్లూని,’ ‘శరీరం వైపు తిరిగి,’ ‘లేచి కూర్చుంది’ వంటి రూపాలు మూలంలోని చర్యల వరుసను సహజంగా నిలుపుతాయి. పాదసూచిక గుర్తు అది వివరిస్తున్న ‘లే’ అనే పదానికే జతచేయబడింది.
