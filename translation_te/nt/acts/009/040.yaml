review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the sequence and main actions in the Greek: Peter sends all present outside, kneels and prays, turns toward the body, commands Tabitha to rise, and she opens her eyes, sees Peter, and sits up. However, “అప్పుడు” (‘then’) at the opening mildly overstates δέ, which is better represented by a neutral narrative connector such as “కాని” or omitted; and the footnote inaccurately says the Greek imperative has two possible meanings rather than two Telugu renderings.'
  naturalness: The Telugu is generally fluent and modern. “మోకాళ్లూని” is a natural compact expression, though “మోకాళ్లపై వంగి” is clearer and more broadly standard. “లే” is natural direct speech, while “లేచి కూర్చుంది” correctly renders sitting up.
  terminology: “శరీరం,” “తబితా,” “ప్రార్థించాడు,” and “లేచి కూర్చుంది” are appropriate. The footnote alternative “లేచి నిలబడు” is a possible rendering, but it should be presented as a translation alternative, not as a distinct interpretation of the Greek; “లేచి కూర్చో” is not what the command itself says.
  issues:
  - severity: low
    issue: Opening connector “అప్పుడు”
    rationale: δέ is primarily a narrative continuative here. “అప్పుడు” can imply a more explicit temporal sequence than the Greek marks. “కాని” is a conventional, restrained Telugu rendering in this context.
  - severity: medium
    issue: Footnote wording says the Greek command can be ‘understood in two ways’
    rationale: ἀνάστηθι has a broad ‘rise/get up’ sense; the alternatives concern Telugu rendering, not two separate contextual meanings. The note should accurately describe this as a translation alternative and retain the solemn-force option without suggesting that Peter commanded Tabitha to stand specifically.
  revised_text: కాని పేతురు అందరినీ బయటికి పంపి, మోకాళ్లపై వంగి ప్రార్థించాడు. తరువాత శరీరం వైపు తిరిగి, “తబితా, లే[a]” అన్నాడు. ఆమె కళ్లు తెరిచి, పేతురును చూసి లేచి కూర్చుంది.
  revised_footnotes:
