revisions:
- from: అప్పుడు పేతురు అందరినీ బయటికి పంపి, మోకాళ్లూని ప్రార్థించాడు. తరువాత శరీరం వైపు తిరిగి, “తబితా, లే[a]” అన్నాడు. ఆమె కళ్లు తెరిచి, పేతురును చూసి లేచి కూర్చుంది.
  to: కాని పేతురు అందరినీ బయటికి పంపి, మోకాళ్లపై వంగి ప్రార్థించాడు. తరువాత శరీరం వైపు తిరిగి, “తబితా, లే[a]” అన్నాడు. ఆమె కళ్లు తెరిచి, పేతురును చూసి లేచి కూర్చుంది.
  rationale: The revision keeps the source sequence and ambiguity intact while using a more neutral rendering of δέ and correcting the footnote so that it identifies a lexical/translation alternative rather than claiming two different meanings of the Greek imperative. “మోకాళ్లపై వంగి” is retained as clear modern-standard narrative Telugu for kneeling.
