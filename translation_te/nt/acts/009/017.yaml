source:
  edition: SBLGNT
  text: ἀπῆλθεν δὲ Ἁνανίας καὶ εἰσῆλθεν εἰς τὴν οἰκίαν, καὶ ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας εἶπεν· Σαοὺλ ἀδελφέ, ὁ κύριος ἀπέσταλκέν με, ⸀Ἰησοῦς ὁ ὀφθείς σοι ἐν τῇ ὁδῷ ᾗ ἤρχου, ὅπως ἀναβλέψῃς καὶ πλησθῇς πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/017.yaml
  text: So Ananias went and entered the house, and laying his hands on him he said, “Brother Saul, the Lord has sent me—Jesus, the one who appeared to you on the road by which you were coming—so that you may regain your sight and be filled with the Holy Spirit.”
translation:
  language: te
  text: 'అప్పుడు అననీయుడు వెళ్లి ఆ ఇంట్లోకి ప్రవేశించాడు. అతనిమీద తన చేతులు ఉంచి ఇలా అన్నాడు: “సౌలూ, సోదరుడా, నీవు వస్తున్న దారిలో[a] నీకు ప్రత్యక్షమైన ప్రభువైన యేసు నన్ను పంపించాడు; నీవు మళ్లీ చూపు పొందాలని[b], పరిశుద్ధాత్మతో నింపబడాలని ఆయన నన్ను పంపించాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు ప్రయాణిస్తున్న దారిలో.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీవు మళ్లీ చూడగలగాలని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν δὲ Ἁνανίας
  choice: అప్పుడు అననీయ వెళ్లి
  rationale: δέ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు అనుసంధానం. ἀπῆλθεν‌ను సందర్భంలో సాధారణంగా ‘వెళ్లి’ అని అందించాం.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν
  choice: ఆ ఇంట్లోకి ప్రవేశించాడు
  rationale: గ్రీకు గమనార్థక నిర్మాణాన్ని స్పష్టమైన, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας
  choice: సౌలు మీద తన చేతులు ఉంచి
  rationale: సహచర చర్యను సూచించే participle భావాన్ని, అలాగే శారీరక చర్యను స్పష్టంగా నిలుపుతుంది.
- source_word: Σαοὺλ ἀδελφέ
  choice: సోదరుడా సౌలూ
  rationale: రెండు పదాలూ సంబోధనలో ఉన్నందున తెలుగు సంబోధనా రూపాలతో, ఆప్యాయతను నిలుపుతూ అనువదించాం.
- source_word: ὁ κύριος ἀπέσταλκέν με, Ἰησοῦς ὁ ὀφθείς σοι
  choice: నీకు కనిపించిన యేసు ప్రభువు నన్ను పంపించాడు
  rationale: Ἰησοῦς అనే apposition ‘ప్రభువు’ను గుర్తిస్తుంది. గ్రీకు వాక్యంలోని అంతరాయ నిర్మాణాన్ని తెలుగులో సహజమైన పదక్రమంతో అందించాం; perfect యొక్క ప్రస్తుత ఫలితాన్ని సందర్భమే తెలియజేస్తుంది.
- source_word: ἐν τῇ ὁδῷ ᾗ ἤρχου
  choice: నువ్వు వస్తున్న దారిలో
  rationale: ἤρχου imperfect సూచించే కొనసాగుతున్న ప్రయాణాన్ని ‘వస్తున్న’ నిలుపుతుంది; ὁδός‌ను అక్షరార్థంగా ‘దారి’గా ఇచ్చాం.
- source_word: ἀναβλέψῃς
  choice: నువ్వు మళ్లీ చూపు పొంది
  rationale: స్వస్థత సందర్భంలో పదం చూపు తిరిగి రావడాన్ని సూచిస్తుంది; ‘మళ్లీ చూపు పొంది’ అర్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πλησθῇς πνεύματος ἁγίου
  choice: పరిశుద్ధాత్మతో నింపబడాలని
  rationale: passive subjunctive భావాన్ని నిలుపుతూ, πνεύματος ἁγίου‌ను అపొస్తలుల కార్యముల సందర్భంలో దైవాత్మకు సాధారణ తెలుగు పేరుతో అందించాం.
theological_decisions:
- issue: ὁ κύριος మరియు appositional Ἰησοῦς మధ్య సంబంధం
  choice: యేసు ప్రభువు
  alternative: ప్రభువు నన్ను పంపించాడు—అంటే, నీకు కనిపించిన యేసు
  rationale: Ἰησοῦς ‘ప్రభువు’ ఎవరో గుర్తించే apposition. తెలుగు సహజ పదక్రమంలో ‘యేసు ప్రభువు’ అని ఉంచడం అదే గుర్తింపును నిలుపుతుంది; వేరొక పంపినవాడిని సూచించదు.
- issue: πνεύματος ἁγίου లో article లేకపోవడం
  choice: పరిశుద్ధాత్మతో
  alternative: పరిశుద్ధ ఆత్మతో
  rationale: గ్రీకులో article లేకపోవడం అనిర్దిష్టమైన ఆత్మను తప్పనిసరిగా సూచించదు. అపొస్తలుల కార్యముల సందర్భంలో ఇది దేవుని పరిశుద్ధాత్మను సూచిస్తుంది; తెలుగు ప్రామాణిక వాడుకలో ‘పరిశుద్ధాత్మ’ సహజం.
- issue: ἀδελφέ అనే సంబోధన పరిధి
  choice: సోదరుడా
  alternative: సహోదరుడా
  rationale: ఇది ఆప్యాయ స్వీకరణను తెలియజేస్తుంది; అయితే అది జాతి బంధమా విశ్వాస సహవాసమా అనే విస్తృత ప్రశ్నను అనువాదంలో అవసరానికి మించి నిర్ణయించకుండా సాధారణ సంబంధపదాన్ని వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకుడికి సులభమైన కథనశైలి. మూలంలోని పొడవైన మాట నిర్మాణాన్ని తెలుగు స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; రెండవ వాక్యంలో ‘ఆయన నన్ను పంపించాడు’ అనే పునరుక్తి ఉద్దేశ సంబంధాన్ని స్పష్టపరుస్తుంది.
