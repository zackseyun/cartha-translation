- from: 'అప్పుడు అననీయ వెళ్లి ఆ ఇంట్లోకి ప్రవేశించాడు. సౌలు మీద తన చేతులు ఉంచి ఇలా అన్నాడు: “సోదరుడా సౌలూ, నువ్వు వస్తున్న దారిలో నీకు కనిపించిన యేసు ప్రభువు నన్ను పంపించాడు. నువ్వు మళ్లీ చూపు పొంది, పరిశుద్ధాత్మతో నింపబడాలని ఆయన నన్ను పంపించాడు.”'
  to: 'అప్పుడు అననీయుడు వెళ్లి ఆ ఇంట్లోకి ప్రవేశించాడు. అతనిమీద తన చేతులు ఉంచి ఇలా అన్నాడు: “సౌలూ, సోదరుడా, నీవు వస్తున్న దారిలో[a] నీకు ప్రత్యక్షమైన ప్రభువైన యేసు నన్ను పంపించాడు; నీవు మళ్లీ చూపు పొందాలని[b], పరిశుద్ధాత్మతో నింపబడాలని ఆయన నన్ను పంపించాడు.”'
  rationale: 'The revision preserves the source’s narrative sequence, physical laying on of hands, direct fraternal address, the appositional identification “the Lord, Jesus,” and the two coordinated purposes. For natural Telugu, the purpose clause is expressed with “నీవు ... కావాలని.” The final repeated “ఆయన నన్ను పంపించాడు” has been retained only as a Telugu resumptive formulation after the long parenthetical identification, but this should not be retained because it is duplication. Therefore corrected text must instead be one sentence without this repetition: “అప్పుడు అననీయుడు వెళ్లి ఆ ఇంట్లోకి ప్రవేశించాడు. అతనిమీద తన చేతులు ఉంచి ఇలా అన్నాడు: ‘సౌలూ, సోదరుడా, నీవు వస్తున్న దారిలో[a] నీకు ప్రత్యక్షమైన ప్రభువైన యేసు నన్ను పంపించాడు, నీవు మళ్లీ చూపు పొందాలని[b], పరిశుద్ధాత్మతో నింపబడాలని.’”'
