id: ACT.9.4
reference: Acts 9:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πεσὼν ἐπὶ τὴν γῆν ἤκουσεν φωνὴν λέγουσαν αὐτῷ Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/004.yaml
  text: And falling to the ground, he heard a voice saying to him, “Saul, Saul, why are you persecuting me?”
translation:
  language: te
  text: 'అతడు నేలమీద పడి, అతనితో ఇలా అంటున్న ఒక స్వరాన్ని విన్నాడు: “సౌలా, సౌలా, నన్నెందుకు హింసిస్తున్నావు?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν ἐπὶ τὴν γῆν
  choice: నేలమీద పడి
  rationale: అయోరిస్ట్ కృదంతాన్ని సహజమైన తెలుగు పూర్వకాలిక క్రియారూపంతో అందించింది; ἐπὶ τὴν γῆν ఇక్కడ భూమి అనే విశాలార్థం కంటే పడిన ఉపరితలమైన ‘నేల’ను సూచిస్తుంది.
- source_word: ἤκουσεν φωνὴν
  choice: ఒక స్వరం విన్నాడు
  rationale: తరువాత స్పష్టమైన మాటలు రావడం వల్ల φωνήని ‘శబ్దం’గా కాక వ్యక్తిగతంగా పలికే ‘స్వరం’గా అనువదించడం సందర్భోచితం.
- source_word: λέγουσαν αὐτῷ
  choice: తనతో ఇలా అంటున్న
  rationale: స్వరం అతనిని ఉద్దేశించి పలికిందనే αὐτῷ భావాన్ని నిలుపుతూ, ప్రత్యక్ష వాక్యానికి సహజంగా దారితీసే తెలుగు నిర్మాణం.
- source_word: Σαοὺλ Σαούλ
  choice: సౌలా, సౌలా
  rationale: పేరులోని సంబోధన రూపాన్నీ, గ్రీకులోని పునరుక్తి వల్ల కలిగే గంభీరమైన వ్యక్తిగత నొక్కింపునూ నిలుపుతుంది.
- source_word: τί με διώκεις
  choice: నన్నెందుకు హింసిస్తున్నావు?
  rationale: ఈ క్రియా సందర్భంలో τί కారణార్థకంగా ‘ఎందుకు’; διώκεις శత్రుత్వంతో కొనసాగుతున్న చర్యను సూచిస్తున్నందున ‘హింసిస్తున్నావు’ సహజమైన, సందర్భసమ్మతమైన ఎంపిక.
theological_decisions:
- issue: మాట్లాడుతున్న వ్యక్తి, సౌలు హింసిస్తున్న వారితో తనను తాను గుర్తించుకోవడం
  choice: ‘నన్ను’ అనే ప్రత్యక్ష పదాన్ని యథాతథంగా నిలుపడం
  alternative: ‘నా ప్రజలను’ లేదా ‘నా అనుచరులను’ అని వివరణాత్మకంగా విస్తరించడం
  rationale: గ్రీకు పాఠం με (‘నన్ను’) అని నేరుగా చెబుతుంది. ఆ వేదాంతపరమైన ఉద్వేగాన్ని అనువాదంలోనే వివరణ ఇచ్చి పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ప్రత్యక్ష దైవిక సంబోధనకు తగిన గంభీరతతో రూపొందించబడింది. మూలంలోని కృదంత ప్రవాహాన్ని తెలుగులో సహజమైన ‘పడి’ రూపంతో అందించింది.
