id: ACT.9.22
reference: Acts 9:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Σαῦλος δὲ μᾶλλον ἐνεδυναμοῦτο καὶ ⸀συνέχυννεν ⸀τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ, συμβιβάζων ὅτι οὗτός ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/022.yaml
  text: But Saul kept gaining strength all the more and was confounding the Jews living in Damascus[a], proving that this one is the Messiah.
translation:
  language: te
  text: అయితే సౌలు మరింత బలపడుతూ, దమస్కులో నివసించే యూదులను ఈయనే మెస్సీయ[a] అని నిరూపిస్తూ తికమకకు గురిచేస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు.” గ్రీకు Χριστός అంటే “అభిషిక్తుడు”; ఇక్కడ అది మెస్సీయను సూచించే బిరుదుగా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: μᾶλλον ἐνεδυναμοῦτο
  choice: మరింత బలపడుతూ
  rationale: μᾶλλον యొక్క తులనాత్మక తీవ్రతను, ἐνεδυναμοῦτο అనే అసంపూర్ణ కాల క్రియలోని కొనసాగుతున్న వృద్ధిని సహజమైన తెలుగులో తెలియజేస్తుంది; బలం ఎక్కడి నుంచి వచ్చిందో అనవసరంగా నిర్ధారించదు.
- source_word: συνέχυννεν
  choice: దిగ్భ్రాంతికి గురిచేస్తూ ఉన్నాడు
  rationale: వాదనలో ఎదుటివారిని గందరగోళానికి లేదా తికమకకు గురిచేయడం అనే బలమైన భావాన్ని ఇస్తుంది; కేవలం మానసిక అయోమయం కలిగించాడనే సన్నని అర్థానికి పరిమితం చేయదు.
- source_word: τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ
  choice: దమస్కులో నివసించే యూదులను
  rationale: ఇక్కడ ఉద్దేశించినవారు యూదయ ప్రాంతవాసులు మాత్రమే కాక, దమస్కులో నివసిస్తున్న యూద మత-జాతి సమూహమని సహజంగా, నిర్దిష్టంగా తెలియజేస్తుంది.
- source_word: συμβιβάζων
  choice: నిరూపిస్తూ
  rationale: ఆధారాలను ఒకదానితో ఒకటి కలిపి ఒక నిర్ణయాన్ని స్థాపించడం అనే సందర్భోచిత తార్కిక భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: οὗτός
  choice: ఈయనే
  rationale: యేసును ప్రత్యేకంగా సూచించే గ్రీకు నిర్దేశక సర్వనామంలోని ఉద్ఘాటనను తెలుగులో కాపాడుతుంది.
- source_word: ὁ χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ పదం వ్యక్తినామంలా కాక, దేవుడు అభిషేకించిన వాగ్దానపూర్వక రాజు/విమోచకుడు అనే యూద నేపథ్య బిరుదుగా వాడబడింది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ὁ అనే నిర్దిష్ట ఉపపదంతో ఉన్న ὁ χριστός ఇక్కడ యేసే ఎదురుచూసిన అభిషిక్తుడు అని గుర్తించే బిరుదు. అందువల్ల బిరుదు భావాన్ని స్పష్టంగా ఉంచేందుకు ‘మెస్సీయ’ వాడబడింది; ప్రత్యామ్నాయ సంప్రదాయ రూపం పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు అసంపూర్ణ కాలంలోని కొనసాగుతున్న చర్యను ‘బలపడుతూ… గురిచేస్తూ ఉన్నాడు’ ద్వారా వ్యక్తం చేసింది; వాక్యంలోని తార్కిక సంబంధాన్ని స్పష్టంగా ఉంచింది.
