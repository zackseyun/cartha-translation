id: ACT.9.12
reference: Acts 9:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶδεν ⸂ἄνδρα ἐν ὁράματι Ἁνανίαν ὀνόματι⸃ εἰσελθόντα καὶ ἐπιθέντα αὐτῷ ⸀χεῖρας ὅπως ἀναβλέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/012.yaml
  text: and he has seen in a vision a man named Ananias coming in and laying his hands on him so that he might regain his sight[a][b].
translation:
  language: te
  text: అతడు దర్శనంలో అననీయ అనే వ్యక్తి లోపలికి వచ్చి, సౌలుమీద చేతులు ఉంచి అతనికి మళ్లీ చూపు కలిగేలా చేయడాన్ని చూశాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతను మళ్లీ చూడగలిగేలా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: చూశాడు
  rationale: గ్రీకు ఏఓరిస్ట్ రూపం గతంలో జరిగిన దర్శనాన్ని నేరుగా సూచిస్తుంది; తెలుగు సందర్భంలో సాధారణ భూతకాలమే సహజంగా ఉండి, దాని ప్రస్తుత ప్రాసంగికతను సందర్భమే తెలియజేస్తుంది.
- source_word: ἄνδρα
  choice: వ్యక్తి
  rationale: ఇక్కడ ἀνήρ వయోజన పురుషుడైన అననీయను సూచిస్తుంది. తెలుగులో పేరు వెంట వచ్చే ఈ నిర్మాణంలో ‘వ్యక్తి’ సహజంగా గుర్తింపును తెలియజేస్తుంది; పురుషుడనే భావం సందర్భంలో స్పష్టమే.
- source_word: ἐν ὁράματι
  choice: దర్శనంలో
  rationale: చూసిన దృశ్యానికి మాధ్యమం లేదా పరిధిని తెలిపే ఈ పదబంధానికి సహజమైన ప్రామాణిక తెలుగు రూపం.
- source_word: Ἁνανίαν ὀνόματι
  choice: అననీయ అనే
  rationale: పేరు ద్వారా వ్యక్తిని గుర్తించే గ్రీకు నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: εἰσελθόντα
  choice: లోపలికి వచ్చి
  rationale: దర్శనంలో అననీయ చేసిన ప్రవేశాన్ని సహజమైన తెలుగు క్రియాక్రమంలో వ్యక్తం చేస్తుంది; గ్రీకు కృదంతం సూచించనంత కఠిన కాలక్రమాన్ని జోడించదు.
- source_word: ἐπιθέντα αὐτῷ χεῖρας
  choice: తన మీద చేతులు ఉంచడం
  rationale: చేతులు ఉంచే భౌతిక చర్యను కాపాడుతుంది; దానికి ప్రత్యేకమైన మతపరమైన లేదా స్వస్థతా విధానార్థాన్ని అదనంగా చేర్చదు.
- source_word: ὅπως
  choice: కలిగేలా
  rationale: ఉద్దేశాన్ని తెలిపే ὅπως భావాన్ని తెలుగు వాక్యంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀναβλέψῃ
  choice: మళ్లీ చూపు కలిగే
  rationale: ఈ స్వస్థత సందర్భంలో చూపును తిరిగి పొందడం అనే అర్థం స్పష్టం. ‘మళ్లీ చూడగలిగే’ అనేది సాధ్యమైన ప్రత్యామ్నాయం.
theological_decisions:
- issue: చేతులు ఉంచడం అనే చర్యకు నిర్దిష్టమైన మతాచార లేదా వరప్రసాద అర్థాన్ని జోడించాలా
  choice: తన మీద చేతులు ఉంచడం
  alternative: తనపై చేతులు పెట్టి స్వస్థపరచడం
  rationale: గ్రీకు వాక్యం భౌతిక చర్యను, దాని లక్ష్యంగా చూపు తిరిగి రావడాన్ని చెబుతుంది; అయితే దానిని ఒక నిర్దిష్ట మతాచారంగా లేదా స్వస్థపరిచే పద్ధతిగా నిర్వచించదు. అందువల్ల మూలంలోని భావపరమైన విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే నిర్మాణం. గ్రీకు పదక్రమాన్ని బలవంతంగా అనుకరించకుండా, దర్శనంలోని చర్యలను సహజమైన తెలుగు క్రమంలో ఉంచింది.
