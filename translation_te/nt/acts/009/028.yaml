id: ACT.9.28
reference: Acts 9:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἦν μετ’ αὐτῶν εἰσπορευόμενος ⸂καὶ ἐκπορευόμενος⸃ εἰς ⸀Ἰερουσαλήμ, παρρησιαζόμενος ἐν τῷ ὀνόματι τοῦ ⸀κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/028.yaml
  text: And he was with them in Jerusalem, going in and going out, speaking boldly in the name of the Lord.
translation:
  language: te
  text: అతడు వారితో కలిసి యెరూషలేములో రాకపోకలు సాగిస్తూ, ప్రభువు నామంలో ధైర్యంగా మాట్లాడేవాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν μετ’ αὐτῶν
  choice: అతడు వారితో కలిసి
  rationale: μετά + షష్ఠీ విభక్తితో ఉన్న అసంపూర్ణ భూతకాల క్రియ నిరంతర సహవాసాన్ని సూచిస్తుంది. ‘వారితో కలిసి’ అనేది నివాసం అనే అదనపు భావాన్ని చేర్చకుండా ఆ అనుబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: εἰσπορευόμενος καὶ ἐκπορευόμενος
  choice: రాకపోకలు సాగిస్తూ
  rationale: ఈ జంట కృదంతాలు తరచుగా, స్వేచ్ఛగా సంచరించడాన్ని తెలిపే నుడికారంగా ఉన్నాయి. పదేపదే ‘లోపలికి వెళ్తూ బయటికి వస్తూ’ అనడం కంటే ‘రాకపోకలు సాగిస్తూ’ ఆధునిక తెలుగులో సహజంగా ఉండి పునరావృత కదలిక భావాన్ని నిలుపుతుంది.
- source_word: εἰς Ἰερουσαλήμ
  choice: యెరూషలేములో
  rationale: εἰς సాధారణంగా ‘లోనికి’ అని అర్థమిచ్చినా, ఇక్కడ జంట కదలిక క్రియలతో కలిసి కార్యాచరణ జరిగే ప్రదేశాన్ని సూచిస్తుంది. అందువల్ల ‘యెరూషలేములో’ సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: παρρησιαζόμενος
  choice: ధైర్యంగా మాట్లాడుతున్నాడు
  rationale: ఈ క్రియ బహిరంగంగా, నిర్భయంగా మాట్లాడడాన్ని సూచిస్తుంది. ‘ధైర్యంగా మాట్లాడుతున్నాడు’ ఆ రెండు ఛాయలనూ సహజంగా అందిస్తుంది.
- source_word: ἐν τῷ ὀνόματι
  choice: నామంలో
  rationale: ఈ పదబంధంలో అధికారం, ప్రాతినిధ్యం, ఒప్పుకోలు వంటి భావాలు ఉండవచ్చు. ‘నామంలో’ అనే బైబిలీయ నుడికారం వాటిలో ఒక్కదానికే అర్థాన్ని పరిమితం చేయదు.
- source_word: τοῦ κυρίου
  choice: ప్రభువు
  rationale: κύριος ఇక్కడ బిరుదుగా ఉంది. సందర్భంలో యేసును సూచించినప్పటికీ, మూలపాఠంలోని బిరుదును పేరుగా మార్చకుండా ‘ప్రభువు’గా ఉంచాం.
theological_decisions:
- issue: ‘ప్రభువు’ అనే బిరుదు ఎవరిని సూచిస్తుంది?
  choice: ముఖ్య పాఠంలో ‘ప్రభువు’ అనే బిరుదునే నిలిపి ఉంచడం
  alternative: ‘యేసు నామంలో’ అని స్పష్టీకరించడం
  rationale: సందర్భం యేసును సూచిస్తున్నప్పటికీ గ్రీకు పాఠంలో Ἰησοῦ కాక κυρίου ఉంది. కాబట్టి మూలంలోని బిరుదును అలాగే ఉంచడం అర్థాన్ని అనవసరంగా పరిష్కరించకుండా లూకా–అపొస్తలుల కార్యములలో దాని ప్రాముఖ్యతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని కొనసాగుతున్న కార్యభావాన్ని ‘సాగిస్తూ’ మరియు ‘మాట్లాడుతున్నాడు’ ద్వారా వ్యక్తం చేశాం.
