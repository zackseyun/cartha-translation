  yaml_path: translation/nt/acts/009/043.yaml
  text: And he stayed in Joppa for many days with a certain Simon[a], a tanner.
translation:
  language: te
  text: అతడు యొప్పేలో చర్మకారుడైన ఒక సీమోను వద్ద[a] చాలా రోజులు బస చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చర్మకారుడైన ఒక సీమోను ఇంట్లో.” గ్రీకు పదబంధం ఒకరి వద్ద లేదా అతని ఇంట్లో బస చేయడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... μεῖναι
  choice: ఉన్నాడు
  rationale: ἐγένετο + క్రియార్థక రూపం అనే గ్రీకు ప్రయోగాన్ని తెలుగులో సహజమైన ప్రధాన క్రియగా వ్యక్తపరుస్తుంది; ‘జరిగింది’ అని అక్షరానువాదం చేయడం ఇక్కడ కృత్రిమంగా ఉంటుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది కథనాన్ని ముందుకు నడిపే మృదువైన అనుసంధానం. ఈ ఒక్క వాక్యంలో తెలుగు సహజ ప్రవాహానికి ప్రత్యేకంగా ‘మరియు’ లేదా ‘అప్పుడు’ అవసరం లేదు.
- source_word: ἡμέρας ἱκανὰς
  choice: చాలా రోజులు
  rationale: కాలవ్యవధితో వాడిన ἱκανός గణనీయమైన లేదా అనేక రోజుల భావాన్ని ఇస్తుంది; ‘చాలా రోజులు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: ἐν Ἰόππῃ
  choice: యొప్పేలో
  rationale: గ్రీకు స్థలనామం Ἰόππηను ప్రస్తుత తెలుగు బైబిలు నామరూపానికి దగ్గరగా లిప్యంతరీకరించి, స్థానార్థక విభక్తిని జోడించింది.
- source_word: παρά τινι Σίμωνι
  choice: సీమోను అనే ఒక వ్యక్తి ఇంట్లో
  rationale: παρά + చతుర్థీ విభక్తి ఇక్కడ ఒకరి వద్ద లేదా అతని ఇంట్లో బసచేయడాన్ని సూచించగలదు. τινι యొక్క అనిర్దిష్టతను ‘ఒక వ్యక్తి’ నిలుపుతుంది; సహజ తెలుగులో బస సందర్భాన్ని ‘ఇంట్లో’ స్పష్టం చేస్తుంది.
- source_word: βυρσεῖ
  choice: చర్మకారుడైన
  rationale: βυρσεύς జంతు చర్మాలను శుద్ధిచేసి తోలుగా తయారుచేసే వృత్తిదారుని సూచిస్తుంది; ‘చర్మకారుడు’ సంక్షిప్తమైన, సాధారణ తెలుగు పదం.
