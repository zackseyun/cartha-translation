id: ACT.9.6
reference: Acts 9:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ ἀνάστηθι καὶ εἴσελθε εἰς τὴν πόλιν, καὶ λαληθήσεταί σοι ⸂ὅ τί⸃ σε δεῖ ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/006.yaml
  text: But get up and enter the city[a], and you will be told what you must do.
translation:
  language: te
  text: అయితే లేచి పట్టణంలోకి వెళ్లు; నీవు చేయవలసినది ఏమిటో నీకు చెప్పబడుతుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: సౌలు ప్రశ్న నుండి యేసు ఆజ్ఞకు వచ్చే వ్యతిరేకతతో కూడిన మలుపును సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: ἀνάστηθι
  choice: లేచి
  rationale: పడిపోయిన స్థితి నుండి లేవమనే ఆజ్ఞను ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: εἴσελθε εἰς τὴν πόλιν
  choice: పట్టణంలోకి వెళ్లు
  rationale: గ్రీకు పదబంధంలోని గమనదిశను తెలుగులో సహజంగా తెలియజేస్తుంది; ‘ప్రవేశించు’ కంటే సాధారణ పాఠకులకు సులభంగా ఉంటుంది.
- source_word: λαληθήσεταί σοι
  choice: నీకు చెప్పబడుతుంది
  rationale: కర్తను పేర్కొనని గ్రీకు భవిష్యత్ కర్మణి రూపాన్ని తెలుగులోనూ కర్మణి రూపంగా నిలుపుతుంది.
- source_word: ὅ τί
  choice: ఏమి
  rationale: తెలియజేయబోయే విషయాన్ని పరిచయం చేసే సంబంధ-ప్రశ్నార్థక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: σε δεῖ ποιεῖν
  choice: నీవు ఏమి చేయాలో
  rationale: δεῖ తెలిపే అవసరం లేదా బాధ్యతను తెలుగు ‘చేయాలో’ నిర్మాణం సందర్భానుసారంగా సహజంగా మోస్తుంది; ఆ అవసరానికి మూలాన్ని అదనంగా నిర్దేశించదు.
theological_decisions:
- issue: దైవిక మార్గనిర్దేశ సందర్భంలో δεῖ యొక్క బలం
  choice: నీవు ఏమి చేయాలో
  alternative: నీవు తప్పక ఏమి చేయాలో / నీవు చేయవలసినది
  rationale: ఈ నిర్మాణం చేయవలసిన బాధ్యతను సహజ తెలుగులో తెలియజేస్తుంది; ‘తప్పక’ అని జోడించి మూలంలోని భావాన్ని అతిగా బలపరచకుండా, దైవిక అవసరం అనే సూచనను కూడా తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా గంభీరతను కాపాడే ఆజ్ఞారూపం. గ్రీకు వాక్యంలోని కర్తను పేర్కొనని కర్మణి నిర్మాణం నిలుపబడింది.
