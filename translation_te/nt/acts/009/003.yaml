source:
  edition: SBLGNT
  text: ἐν δὲ τῷ πορεύεσθαι ἐγένετο αὐτὸν ἐγγίζειν τῇ Δαμασκῷ, ⸂ἐξαίφνης τε αὐτὸν περιήστραψεν⸃ φῶς ⸀ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/003.yaml
  text: As he was traveling[a], it happened that he was drawing near to Damascus, and suddenly a light from heaven flashed around him.
translation:
  language: te
  text: 'అతడు ప్రయాణం చేస్తూ దమస్కుకు సమీపిస్తున్నప్పుడు, ఇలా జరిగింది: అకస్మాత్తుగా పరలోకం నుండి[a] ఒక వెలుగు అతని చుట్టూ ప్రకాశించింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆకాశం నుండి.’ గ్రీకు పదం οὐρανός అంటే ‘పరలోకం’ లేదా ‘ఆకాశం’ అని అర్థం కావచ్చు; ఈ సందర్భంలో ‘పరలోకం’ అనేది ఈ వెలుగు యొక్క దైవిక మూలాన్ని సూచిస్తున్నట్లు ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δὲ τῷ πορεύεσθαι
  choice: అతడు ప్రయాణిస్తూ
  rationale: ἐν తో కూడిన articular infinitive సమకాలీన చర్యను సూచిస్తుంది. ఆధునిక తెలుగులో ‘ప్రయాణిస్తూ’ దానిని సహజంగా తెలియజేస్తుంది; δέ యొక్క స్వల్ప కథన అనుసంధానాన్ని ప్రత్యేక పదంతో అతిగా అనువదించలేదు.
- source_word: ἐγένετο αὐτὸν ἐγγίζειν τῇ Δαμασκῷ
  choice: దమస్కుకు సమీపిస్తున్నప్పుడు ఇలా జరిగింది
  rationale: ἐγένετο అనే లూకా కథన నిర్మాణాన్ని ‘ఇలా జరిగింది’గా నిలిపి, వర్తమాన infinitive ἐγγίζειν లోని కొనసాగుతున్న సమీపతను ‘సమీపిస్తున్నప్పుడు’తో వ్యక్తం చేసింది.
- source_word: ἐξαίφνης τε
  choice: అకస్మాత్తుగా
  rationale: సంఘటన హఠాత్తుగా సంభవించడాన్ని స్పష్టంగా తెలియజేస్తుంది; τε యొక్క అనుసంధానం తెలుగు వాక్య ప్రవాహంలో అంతర్భూతమైంది.
- source_word: περιήστραψεν
  choice: అతని చుట్టూ ప్రకాశించింది
  rationale: περι- ఉపసర్గ సూచించే చుట్టూ ఆవరించే ప్రకాశాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; కేవలం అతనిపై పడిందని పరిమితం చేయదు.
- source_word: φῶς
  choice: ఒక వెలుగు
  rationale: ఇక్కడ నిర్దిష్టత లేని φῶς ను సందర్భానుగుణంగా ‘ఒక వెలుగు’గా అనువదించడం సహజం.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: పరలోకం నుండి
  rationale: లూకా–అపొస్తలుల కార్యములలోని ఈ ప్రత్యక్షత సందర్భంలో οὐρανός దైవిక మూలాన్ని సూచించే ‘పరలోకం’ అనే భావానికి అనుకూలం; దాని ‘ఆకాశం’ అనే సాధ్యార్థాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: దైవ ప్రత్యక్షత సందర్భంలో οὐρανός యొక్క అర్థం
  choice: పరలోకం నుండి
  alternative: ఆకాశం నుండి
  rationale: కథన సందర్భం ఈ వెలుగును దైవిక ప్రత్యక్షతగా చూపుతున్నందున ‘పరలోకం’ ప్రధాన అర్థాన్ని సముచితంగా ప్రతిబింబిస్తుంది; అయితే గ్రీకు పదంలోని నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. గ్రీకు వాక్యంలోని కథన నిర్మాణాన్ని పూర్తిగా వదలకుండా ‘ఇలా జరిగింది:’తో నిలిపి, తరువాతి ఆకస్మిక సంఘటనను స్పష్టంగా ప్రవహించేలా చేసింది.
