  text: And for three days he was without sight[a], and he neither ate nor drank.
translation:
  language: te
  text: అతడు మూడు రోజులపాటు చూడలేక ఉన్నాడు[a]; ఏమీ తినలేదు, తాగలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, ‘చూడక ఉన్నాడు.’ ఈ పదబంధం సౌలు చూడలేని స్థితిలో ఉన్నాడని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἡμέρας τρεῖς
  choice: మూడు రోజులపాటు … ఉన్నాడు
  rationale: ἡμέρας τρεῖς కాలవ్యాప్తిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మూడు రోజులపాటు’ సహజంగా ఉంటుంది. ἦνను ‘ఉన్నాడు’గా ఉంచడం వల్ల ‘అలాగే ఉండిపోయాడు’ వంటి అదనపు భావం చేరదు.
- source_word: μὴ βλέπων
  choice: చూడలేక
  rationale: ఈ వర్తమాన కృదంత పదబంధానికి అక్షరార్థం ‘చూడకుండా/చూడక’ అయినా, సందర్భంలో సౌలు చూడగల స్థితిలో లేడని సూచిస్తుంది. ‘చూడలేక’ ఆ అసమర్థతను సహజంగా తెలియజేస్తూ, మూలంలో లేని ‘గుడ్డివాడు’ అనే విశేషణాన్ని చేర్చదు.
- source_word: οὐκ ἔφαγεν
  choice: ఏమీ తినలేదు
  rationale: ἔφαγεν అంటే ‘తిన్నాడు’; నిరాకరణతో ‘తినలేదు.’ తదుపరి నిరాకృత క్రియతో తెలుగులో సహజమైన సమన్వయం కోసం ‘ఏమీ తినలేదు’ అని అనువదించబడింది.
- source_word: οὐδὲ ἔπιεν
  choice: తాగలేదు
  rationale: οὐδέ మొదటి నిరాకృత క్రియకు రెండవదాన్ని జతచేస్తుంది. తెలుగులో ‘తినలేదు, తాగలేదు’ అనే జత సహజంగా, స్పష్టంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. మూలంలోని ‘చూడక/చూడకుండా’ అనే రూపాన్ని సహజమైన ‘చూడలేక’గా ప్రధాన పాఠ్యంలో ఇచ్చి, అక్షరార్థ రూపాన్ని పాదటిప్పణిలో నిలుపుకున్నాం.
