id: ACT.9.21
reference: Acts 9:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐξίσταντο δὲ πάντες οἱ ἀκούοντες καὶ ἔλεγον· Οὐχ οὗτός ἐστιν ὁ πορθήσας ⸀ἐν Ἰερουσαλὴμ τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο, καὶ ὧδε εἰς τοῦτο ἐληλύθει ἵνα δεδεμένους αὐτοὺς ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/021.yaml
  text: And all who heard him were amazed and were saying[a], “Isn’t this the man who devastated in Jerusalem those who call on this name? And had he not come here for this purpose[b], that he might bring them bound to the chief priests?”
translation:
  language: te
  text: అతని మాటలు విన్నవారందరూ ఆశ్చర్యపోతూ, “యెరూషలేములో ఈ నామాన్ని పిలుచుకొనేవారిని[a] నాశనం చేసినవాడు ఇతడే కాదా? వారిని బంధించి ప్రధాన యాజకుల వద్దకు తీసుకెళ్లడానికే ఇతడు ఇక్కడికి వచ్చాడు కాదా?” అంటూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఈ నామాన్ని పిలుచుకొనేవారు” అంటే యేసు నామాన్ని ప్రార్థనతో పిలుచుకొనేవారు లేదా ఆయన నామానికి మొరపెట్టుకొనేవారు. ఇక్కడ “ఈ నామం” యేసును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: ఆశ్చర్యపోతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం శ్రోతలలో కొనసాగుతున్న తీవ్రమైన విస్మయాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: πάντες οἱ ἀκούοντες
  choice: అతని మాటలు విన్నవారందరూ
  rationale: గ్రీకులో కర్మ సూచితంగా ఉంది; సందర్భానుసారంగా ‘అతని మాటలు’ అని తెలుగులో స్పష్టపరచడం సహజం.
- source_word: πορθήσας
  choice: నాశనం చేసినవాడు
  rationale: ఈ క్రియ సాధారణంగా ‘హింసించడం’ కంటే బలమైన విధ్వంసక చర్యను సూచిస్తుంది; ‘నాశనం చేసినవాడు’ ఆ తీవ్రతను నిలుపుతుంది.
- source_word: τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο
  choice: ఈ నామాన్ని పిలిచేవారిని
  rationale: యేసు నామానికి ప్రార్థనాపూర్వకంగా మొరపెట్టుకోవడం లేదా దానిని ప్రకటించడం అనే బైబిలీయ నుడికారాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: εἰς τοῦτο
  choice: దానికే
  rationale: నిర్దిష్ట ఉద్దేశాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐληλύθει
  choice: వచ్చాడు
  rationale: గ్రీకు రూపం ముందే జరిగిన రాకను సూచించినా, తెలుగు సందర్భంలో ‘వచ్చాడు’ సహజంగా అదే కాల సంబంధాన్ని అందిస్తుంది.
- source_word: δεδεμένους
  choice: బంధించి
  rationale: వారిని బంధిత స్థితిలో తీసుకెళ్లాలనే భావాన్ని సహజమైన తెలుగు క్రియారూపంలో అందిస్తుంది; బంధించిన సాధనాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς
  choice: ప్రధాన యాజకుల దగ్గరికి తీసుకెళ్లడానికి
  rationale: అధికారుల వద్దకు వారిని తీసుకెళ్లడం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; గ్రీకు ἐπί ఇక్కడ గమ్యం లేదా అధికారుల సమక్షానికి తీసుకురావడాన్ని సూచించవచ్చు.
- source_word: ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: రెండవ దేవాలయ కాలంలోని యాజక అధికార వర్గాన్ని సూచించే ప్రామాణిక తెలుగు పదబంధం.
theological_decisions:
- issue: τὸ ὄνομα τοῦτο అనే పదబంధాన్ని స్పష్టంగా ‘యేసు నామం’ అని విస్తరించాలా
  choice: ప్రధాన పాఠ్యంలో ‘ఈ నామం’ అని నిలుపడం
  alternative: యేసు నామం
  rationale: గ్రీకు మూలం సూచ్యార్థాన్ని సందర్భానికే వదిలేస్తుంది; ‘ఈ నామం’ అనే రూపం దాని వాక్చాతుర్యాన్ని, భక్తిపూర్వక నుడికారాన్ని నిలుపుతుంది.
- issue: πορθήσας తీవ్రతను ఎలా తెలియజేయాలి
  choice: నాశనం చేసినవాడు
  alternative: హింసించినవాడు
  rationale: మూల క్రియ సాధారణ హింసకంటే బలమైన విధ్వంస భావాన్ని కలిగిస్తుంది; దానిని మృదువుగా చేయకుండా అనువదించబడింది.
- issue: రెండవ వాక్యాన్ని ప్రశ్నగా ఉంచాలా
  choice: ‘వచ్చాడు కాదా?’ అనే ప్రశ్నగా ఉంచడం
  alternative: ‘వచ్చాడు’ అనే ప్రకటనగా అనువదించడం
  rationale: గ్రీకు మొత్తం ఉక్తి ప్రశ్నార్థకంగా ఉంది; రెండవ భాగం కూడా మొదటి ప్రశ్నలో కొనసాగుతున్న ఆశ్చర్యభరిత ప్రశ్నగా సహజంగా అర్థమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా వచనానికి తగిన గౌరవప్రదమైన శైలి. ప్రశ్న యొక్క ఆశ్చర్యభరిత స్వరాన్ని, ‘ఈ నామం’ అనే మూల నుడికారాన్ని నిలుపుకుంది.
