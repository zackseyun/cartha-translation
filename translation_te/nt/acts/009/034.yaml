source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Πέτρος· Αἰνέα, ἰᾶταί σε Ἰησοῦς ⸀Χριστός· ἀνάστηθι καὶ στρῶσον σεαυτῷ· καὶ εὐθέως ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/034.yaml
  text: And Peter said to him[a], “Aeneas, Jesus the Messiah heals you[b]. Get up and make your bed.” And immediately he got up.
translation:
  language: te
  text: 'పేతురు అతనితో, “ఐనేయా, మెస్సీయ అయిన యేసు[a] నిన్ను స్వస్థపరుస్తున్నాడు. లేచి, నీ పరుపు నీవే సర్దుకో[b]” అన్నాడు. వెంటనే అతడు లేచాడు.


    [a] లేదా, “యేసు క్రీస్తు.” Χριστός అనే గ్రీకు బిరుదును “క్రీస్తు” అని కూడా అనువదించవచ్చు.


    [b] లేదా, “నీ కోసం నీ పరుపు పరచుకో.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు క్రీస్తు.” Χριστός అనే గ్రీకు బిరుదును “క్రీస్తు” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “నీ కోసం నీ పరుపు పరచుకో.”
    reason: translation_ambiguity
lexical_decisions:
- source_word: ἰᾶταί
  choice: స్వస్థపరుస్తున్నాడు
  rationale: వర్తమానకాల క్రియారూపాన్ని నిలుపుతూ, పేతురు పలికిన మాటలోనే స్వస్థత జరుగుతోందనే ప్రకటనాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: Χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ ఇది యేసుకు బిరుదుగా పనిచేస్తోంది. అందువల్ల దాని బిరుదు భావాన్ని స్పష్టంగా ఉంచేందుకు “మెస్సీయ అయిన యేసు” అని అనువదించాం; సుపరిచితమైన “క్రీస్తు” రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: ἀνάστηθι
  choice: లేచి
  rationale: మంచానికే పరిమితమైన వ్యక్తికి ఇచ్చిన ఆజ్ఞ సందర్భంలో సహజంగా, నేరుగా వినిపించే రూపం.
- source_word: στρῶσον σεαυτῷ
  choice: నీ పరుపు నీవే సర్దుకో
  rationale: στρώννυμι పరుపును పరచడం లేదా సిద్ధం చేయడాన్ని సూచిస్తుంది; σεαυτῷలోని స్వీయ కార్యభావాన్ని “నీవే” నిలుపుతుంది. తెలుగులో “పరుపు సర్దుకో” సహజమైన ప్రయోగం.
- source_word: εὐθέως
  choice: వెంటనే
  rationale: ఆజ్ఞకు తక్షణమే వచ్చిన ఫలితాన్ని, లూకా వాడిన కాలతీవ్రతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀνέστη
  choice: లేచాడు
  rationale: ముందటి ఆజ్ఞతో పదసంబంధాన్ని నిలుపుతూ జరిగిన ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: Αἰνέα
  choice: ఐనేయా
  rationale: గ్రీకు సంబోధన రూపాన్ని తెలుగులో సుపఠితమైన వ్యక్తినామంగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: స్వస్థపరిచేది ఎవరు అనే ప్రకటన
  choice: మెస్సీయ అయిన యేసు నిన్ను స్వస్థపరుస్తున్నాడు
  alternative: యేసు క్రీస్తు నిన్ను స్వస్థపరుస్తున్నాడు
  rationale: గ్రీకు వాక్యంలో స్వస్థతకు కర్త యేసే; పేతురు సాధనంగా తనను ముందుకు తేవడం లేదు. Χριστόςను ఇక్కడ బిరుదుగా చూపుతూ, ప్రత్యామ్నాయ సంప్రదాయ రూపాన్ని పాదటిప్పణిలో నిలిపాం.
- issue: ἰᾶταί క్రియ యొక్క కాలభావం
  choice: స్వస్థపరుస్తున్నాడు
  alternative: స్వస్థపరిచాడు
  rationale: గ్రీకులోని వర్తమానకాల రూపాన్ని పూర్తయిన గతక్రియగా మార్చకుండా, ప్రకటనతో జరుగుతున్న స్వస్థత అనే ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సూటిగా అర్థమయ్యే వాక్యనిర్మాణం వాడాం. సంభాషణలో సహజత్వం కోసం “లేచి” మరియు “సర్దుకో” రూపాలను ఎంచుకున్నాం; “నీవే” ద్వారా కోలుకున్న వ్యక్తి తిరిగి స్వయంగా చేయగల సామర్థ్యాన్ని సూచించే σεαυτῷ భావాన్ని నిలిపాం.
