  terminology: “యొప్పే” ప్రాచీన స్థలనామానికి స్థిరపడిన తెలుగు రూపం; “ప్రభువు” κύριος యొక్క గౌరవార్థకమైన, సందర్భోచితమైన అనువాదం. “విశ్వసించారు” πιστεύω యొక్క అర్థాన్ని కాపాడుతుంది.
