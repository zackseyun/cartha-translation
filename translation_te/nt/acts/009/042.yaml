id: ACT.9.42
reference: Acts 9:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γνωστὸν δὲ ἐγένετο καθ’ ὅλης ⸀τῆς Ἰόππης, καὶ ⸂ἐπίστευσαν πολλοὶ⸃ ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/042.yaml
  text: And it became known throughout all Joppa, and many believed in the Lord.
translation:
  language: te
  text: ఈ విషయం యొప్పే పట్టణమంతటా తెలిసింది. చాలామంది ప్రభువును విశ్వసించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωστὸν ... ἐγένετο
  choice: ఈ విషయం ... తెలిసింది
  rationale: కర్తను పేర్కొనని గ్రీకు నిర్మాణంలోని ఫలిత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. ముందరి సందర్భంలోని సంఘటనను సూచించడానికి ‘ఈ విషయం’ చేర్చబడింది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ కథనాన్ని స్వల్పంగా ముందుకు నడిపే సంధాయకం. తెలుగు వాక్య విభజనలో దాని ప్రవాహం సహజంగానే వ్యక్తమవుతుంది; ‘మరియు’ అని పెట్టడం కృత్రిమంగా ఉంటుంది.
- source_word: καθ’ ὅλης τῆς Ἰόππης
  choice: యొప్పే పట్టణమంతటా
  rationale: κατά + షష్ఠీ విభక్తి వ్యాప్తిని, ὅλης సంపూర్ణతను సూచిస్తాయి. ‘పట్టణమంతటా’ అనే రూపం స్థలమంతటా వ్యాపించిందనే భావాన్ని సహజంగా ఇస్తుంది.
- source_word: Ἰόππης
  choice: యొప్పే
  rationale: కొత్త నిబంధనలోని ప్రాచీన స్థలనామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణను ఉపయోగించింది.
- source_word: ἐπίστευσαν πολλοὶ
  choice: చాలామంది ... విశ్వసించారు
  rationale: బహువచన కర్తను సహజమైన తెలుగులో ‘చాలామంది’గా, πιστεύωను నేరుగా ‘విశ్వసించారు’గా అనువదించింది.
- source_word: ἐπὶ τὸν κύριον
  choice: ప్రభువును విశ్వసించారు
  rationale: πιστεύωతో కూడిన ἐπί + ద్వితీయా విభక్తి విశ్వాసం లేదా నమ్మకం ఎవరిమీద ఉంచబడిందో తెలియజేస్తుంది. తెలుగులో ‘ప్రభువును విశ్వసించారు’ సహజంగా వ్యక్తిగత నమ్మకాన్ని సూచిస్తుంది.
- source_word: κύριον
  choice: ప్రభువు
  rationale: κύριοςకు గౌరవార్థకమైనదీ క్రీస్తు సంబంధ theological weightను నిలుపుకునేదీ అయిన సాధారణ తెలుగు సమానార్థకం ‘ప్రభువు’.
theological_decisions:
- issue: πιστεύω + ἐπὶ τὸν κύριον అనువాదం
  choice: ప్రభువును విశ్వసించారు
  alternative: ప్రభువుమీద విశ్వాసముంచారు
  rationale: ఎవరిపట్ల నమ్మకం ఉంచారో మూలపాఠం తెలిపే భావాన్ని ఇది సహజంగా నిలుపుతుంది; విశ్వాస స్వభావాన్ని మూలపాఠం చెప్పిన దానికంటే సంకుచితం చేయదు.
- issue: κύριος అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: అపొస్తలుల కార్యములలో యేసుకు వాడిన బిరుదులోని గౌరవార్థక, క్రీస్తు సంబంధ ప్రాధాన్యాన్ని ‘ప్రభువు’ నిలుపుతుంది; ‘యజమాని’ ఇక్కడ ఆ భావాన్ని తక్కువగా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని రెండు సమన్విత ఉపవాక్యాలను తెలుగులో స్పష్టత, సహజత్వం కోసం రెండు వాక్యాలుగా ఇచ్చాం.
