  source_fidelity: γνωστὸν δὲ ἐγένετο అనే కర్తరహిత నిర్మాణాన్ని సందర్భానుసారంగా “ఈ విషయం ... తెలిసింది”గా ఇవ్వడం సముచితం. καθ’ ὅλης τῆς Ἰόππης లోని సంపూర్ణ వ్యాప్తి “యొప్పే పట్టణమంతటా”లో ఉంది. ἐπίστευσαν πολλοὶ ἐπὶ τὸν κύριον ను “చాలామంది ప్రభువును విశ్వసించారు”గా అనువదించడం విశ్వాసానికి ప్రభువే లక్ష్యమని సరిగా తెలియజేస్తుంది.
