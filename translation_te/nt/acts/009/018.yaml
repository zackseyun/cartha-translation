  terminology: ‘బాప్తిస్మం పొందాడు’ గ్రీకు కర్మణి రూపానికి తగిన, తెలుగు క్రైస్తవ వాడుకలో ప్రామాణికమైన మరియు విధానాన్ని నిర్దేశించని తటస్థ పదప్రయోగం. ‘పొలుసులు’ మరియు ‘చూపు వచ్చింది’ సందర్భానుకూలంగా ఉన్నాయి.
