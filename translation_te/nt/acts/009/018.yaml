  source_fidelity: మూల గ్రీకు వచనంలోని కాలసూచన (εὐθέως), కళ్లనుండి విడిపడి పడటం (ἀπέπεσαν ... ἀπό), ‘పొలుసులవలె’ అనే పోలిక (ὡς λεπίδες), చూపు తిరిగి రావడం (ἀνέβλεψεν), తదనంతర లేచడం మరియు బాప్తిస్మం పొందడం అన్నీ నమ్మకంగా ప్రతిఫలించాయి. ‘పొలుసుల్లాంటివి’ అనేది వాటిని అక్షరార్థ పొలుసులుగా నిర్ధారించకుండా గ్రీకు పోలికను నిలుపుతుంది.
