id: ACT.9.18
reference: Acts 9:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εὐθέως ἀπέπεσαν ⸂αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν⸃ ⸀ὡς λεπίδες, ἀνέβλεψέν τε καὶ ἀναστὰς ἐβαπτίσθη,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/018.yaml
  text: And immediately something like scales fell from his eyes[a], and he regained his sight; then he got up and was baptized,
translation:
  language: te
  text: వెంటనే అతని కళ్ల నుండి పొలుసుల్లాంటివి రాలిపడ్డాయి[a]. అతనికి మళ్లీ చూపు వచ్చింది. అప్పుడు అతను లేచి బాప్తిస్మం పొందాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని కళ్ల నుండి పొలుసుల్లా రాలిపడ్డాయి.” గ్రీకు వాక్యం పోలికను ఉపయోగిస్తుంది; అవి నిజంగా పొలుసులేనని కాక, అలా కనిపించాయని వివరిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: వెంటనే
  rationale: సంఘటన తక్షణమే జరిగిందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀπέπεσαν
  choice: రాలిపడ్డాయి
  rationale: కళ్ల నుండి విడిపోయి కిందపడిన భావాన్ని తెలుగు సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν
  choice: అతని కళ్ల నుండి
  rationale: ἀπό సూచించే వేరుపడే భావాన్ని స్పష్టంగా, సహజంగా తెలుపుతుంది.
- source_word: ὡς λεπίδες
  choice: పొలుసుల్లాంటివి
  rationale: ὡς లోని పోలికను కాపాడుతూ, అవి నిజమైన పొలుసులేనని నిర్ధారించకుండా కనిపించిన రూపాన్ని తెలియజేస్తుంది.
- source_word: ἀνέβλεψεν
  choice: అతనికి మళ్లీ చూపు వచ్చింది
  rationale: స్వస్థత సందర్భంలో ἀναβλέπω అంటే పైకి చూడడం కంటే చూపును తిరిగి పొందడం అనే అర్థమే తగినది.
- source_word: τε καὶ
  choice: అప్పుడు
  rationale: తరువాత జరిగిన చర్యల క్రమాన్ని తెలుగులో సహజంగా అనుసంధానిస్తుంది.
- source_word: ἀναστάς
  choice: అతను లేచి
  rationale: తదుపరి చర్యకు ముందు అతను లేచాడనే క్రమాన్ని సంక్షిప్తంగా, సహజంగా తెలుపుతుంది.
- source_word: ἐβαπτίσθη
  choice: బాప్తిస్మం పొందాడు
  rationale: గ్రీకు కర్మణి రూపాన్ని కాపాడుతూ, బాప్తిస్మ విధానాన్ని అనవసరంగా నిర్దేశించని ప్రామాణిక తెలుగు క్రైస్తవ పదప్రయోగం.
theological_decisions:
- issue: βαπτίζω పదాన్ని సంఘవర్గ ప్రత్యేకత లేకుండా అనువదించడం
  choice: బాప్తిస్మం పొందాడు
  alternative: ముంచబడ్డాడు
  rationale: వచనం బాప్తిస్మ క్రియను తెలియజేస్తుంది గాని దాని విధానాన్ని స్పష్టంగా నిర్దేశించదు. అందువల్ల ప్రామాణిక పదప్రయోగం మూలానికి నమ్మకంగా ఉండి సంఘవర్గ ప్రత్యేక వ్యాఖ్యానాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అదే సమయంలో గౌరవప్రదమైన కథన శైలి పాటించబడింది. పోలికలోని అస్పష్టతను ప్రధాన పాఠం మరియు పాదసూచికలో నిలిపి ఉంచాం.
