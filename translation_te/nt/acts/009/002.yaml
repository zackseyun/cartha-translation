id: ACT.9.2
reference: Acts 9:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ᾐτήσατο παρ’ αὐτοῦ ἐπιστολὰς εἰς Δαμασκὸν πρὸς τὰς συναγωγάς, ὅπως ἐάν τινας εὕρῃ τῆς ὁδοῦ ὄντας, ἄνδρας τε καὶ γυναῖκας, δεδεμένους ἀγάγῃ εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/002.yaml
  text: and asked him for letters to the synagogues in Damascus[a], so that if he found any belonging to the Way, both men and women, he might bring them bound to Jerusalem.
translation:
  language: te
  text: దమస్కులోని సమాజమందిరాలకు పత్రాలు ఇవ్వమని అతనిని అడిగాడు, తద్వారా ఆ మార్గానికి చెందినవారిలో ఎవరినైనా—పురుషులనైనా స్త్రీలనైనా—కనుగొంటే, వారిని బంధించి యెరూషలేముకు తీసుకురావడానికి వీలుగా.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మార్గాన్ని అనుసరించేవారు.’ గ్రీకు మూలంలో ‘మార్గం’ అనేది తొలి క్రైస్తవ ఉద్యమానికి వాడిన పేరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾐτήσατο παρ’ αὐτοῦ ἐπιστολὰς
  choice: అతని దగ్గర పత్రాలు అడిగాడు
  rationale: αἰτέωతో παρά + షష్ఠీ విభక్తి అభ్యర్థన ఎవరిని ఉద్దేశించిందో చూపుతుంది. ‘అతని దగ్గర ... అడిగాడు’ సహజమైన తెలుగు ప్రయోగం. ἐπιστολάςను సందర్భం సూచించే అధికారాన్ని ప్రధాన పాఠ్యంలో అదనంగా చేర్చకుండా ‘పత్రాలు’గా అనువదించాం.
- source_word: εἰς Δαμασκὸν πρὸς τὰς συναγωγάς
  choice: దమస్కులోని సమాజమందిరాలకు ఇవ్వడానికి
  rationale: రెండు ఉపసర్గ పదబంధాలు దమస్కులో ఉన్న సమాజమందిరాలకు ఉద్దేశించిన పత్రాలను సూచిస్తాయి. తెలుగు వాక్యంలో గమ్యాన్ని స్పష్టంగా, సహజంగా తెలిపేందుకు ‘ఇవ్వడానికి’ ఉపయోగించాం.
- source_word: ὅπως ἐάν τινας εὕρῃ
  choice: తద్వారా ... ఎవరైనా తనకు కనిపిస్తే
  rationale: ὅπως ఉద్దేశాన్ని, ἐάν + సంభావనార్థక క్రియ షరతును సూచిస్తాయి. ఈ రెండింటినీ తెలుగు నిర్మాణం నిలుపుతుంది.
- source_word: τῆς ὁδοῦ ὄντας
  choice: ఆ మార్గానికి చెందినవారు
  rationale: ఇది తొలి క్రైస్తవ ఉద్యమానికి వాడిన గుర్తింపు పేరు. ‘ఆ మార్గం’ అనే చారిత్రక పదబంధాన్ని నిలుపుతూ, షష్ఠీ సంబంధాన్ని ‘చెందినవారు’గా సహజంగా వ్యక్తం చేశాం.
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: పురుషులైనా స్త్రీలైనా
  rationale: τε καὶ స్పష్టంగా రెండు వర్గాలనూ కలుపుతుంది. సౌలు ఉద్దేశించిన అరెస్టుల విస్తృతిని తగ్గించకుండా రెండింటినీ పేర్కొన్నాం.
- source_word: δεδεμένους ἀγάγῃ εἰς Ἰερουσαλήμ
  choice: వారిని బంధించి యెరూషలేముకు తీసుకురావాలని
  rationale: δεδεμένους బంధిత స్థితిని సూచిస్తుంది; గొలుసులు వంటి నిర్దిష్ట సాధనాన్ని మూలపాఠ్యం చెప్పదు. ἀγάγῃను గమ్యస్థానానికి అనుగుణంగా ‘తీసుకురావడం’గా అనువదించాం.
theological_decisions:
- issue: τῆς ὁδοῦ అనే తొలి క్రైస్తవ ఉద్యమపు పేరు
  choice: ఆ మార్గం
  alternative: ఆ మార్గాన్ని అనుసరించేవారు / క్రైస్తవులు
  rationale: ‘ఆ మార్గం’ అనే చారిత్రక గుర్తింపు పేరును నిలుపడం ద్వారా మూలపాఠ్యపు రూపకాత్మకత, చారిత్రక స్వభావం కాపాడబడతాయి; ‘క్రైస్తవులు’ అని ముందుగానే వివరణాత్మక పేరు పెట్టలేదు.
- issue: ἄνδρας τε καὶ γυναῖκαςలో రెండు లింగాల స్పష్ట ప్రస్తావన
  choice: పురుషులైనా స్త్రీలైనా
  alternative: ఎవరినైనా / ప్రజలను
  rationale: సౌలు పురుషులను మాత్రమే కాక స్త్రీలనూ పట్టుకోవాలనుకున్నాడనే మూలపాఠ్యపు ఉద్ఘాటనను యథాతథంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘సమాజమందిరం,’ ‘ఆ మార్గం’ వంటి స్థిర బైబిలు పదాలను నిలుపుతూ అనవసర మతశాఖాపరమైన వివరణలను నివారించాం.
