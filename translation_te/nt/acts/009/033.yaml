id: ACT.9.33
reference: Acts 9:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εὗρεν δὲ ἐκεῖ ἄνθρωπόν τινα ⸂ὀνόματι Αἰνέαν⸃ ἐξ ἐτῶν ὀκτὼ κατακείμενον ἐπὶ ⸀κραβάττου, ὃς ἦν παραλελυμένος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/033.yaml
  text: And there he found a certain man named Aeneas[a], bedridden for eight years, who was paralyzed.
translation:
  language: te
  text: అక్కడ అతడు ఐనేయ అనే ఒక మనిషిని కనుగొన్నాడు. అతడు పక్షవాతంతో ఎనిమిదేళ్లుగా చాపపై[a] పడివున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సాధారణ పడకపై.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν
  choice: కనుగొన్నాడు
  rationale: εὑρίσκω క్రియ యొక్క భూతకాల కథన భావాన్ని నేరుగా వ్యక్తం చేస్తూ, పేతురు అక్కడ ఆ వ్యక్తిని కనుగొన్నాడనే అర్థాన్ని నిలుపుతుంది.
- source_word: δὲ ἐκεῖ
  choice: అక్కడ
  rationale: δέ ఇక్కడ కథన కొనసాగింపును సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో ప్రత్యేక సంధిపదం అవసరం లేకుండా ἐκεῖ యొక్క స్థలార్థాన్ని ‘అక్కడ’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἄνθρωπόν τινα
  choice: ఒక మనిషిని
  rationale: τις పరిచయం లేని నిర్దిష్ట వ్యక్తిని కథలో ప్రవేశపెడుతుంది. ఆధునిక తెలుగులో ‘ఒక మనిషిని’ సహజంగా ఆ ప్రయోజనాన్ని నెరవేర్చుతుంది.
- source_word: ὀνόματι Αἰνέαν
  choice: ఐనేయ అనే
  rationale: ὀνόματι తో కూడిన వ్యక్తినామాన్ని తెలుగులో సహజంగా ‘అనే’ నిర్మాణంతో అనువదించాం; Αἰνέας పేరును గ్రీకు ఉచ్చారణకు దగ్గరగా ‘ఐనేయ’గా లిప్యంతరీకరించాం.
- source_word: ἐξ ἐτῶν ὀκτὼ
  choice: ఎనిమిదేళ్లుగా
  rationale: ఈ కాలవ్యవధి పదబంధం గతంలో మొదలై కథన సమయం వరకూ కొనసాగిన స్థితిని సూచిస్తుంది; ‘ఎనిమిదేళ్లుగా’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: κατακείμενον ἐπὶ κραβάττου
  choice: పరుపుపై పడి ఉన్నాడు
  rationale: గ్రీకు పదబంధంలోని ప్రత్యక్ష దృశ్యాన్ని నిలుపుతూ, దీర్ఘకాలంగా పడివున్న స్థితిని సహజ తెలుగులో తెలియజేస్తుంది. κράβαττος సూచించే చాప, సాధారణ పడక వంటి ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
- source_word: ὃς ἦν παραλελυμένος
  choice: పక్షవాతానికి గురైన అతడు
  rationale: పూర్తయిన చర్య ఫలితంగా కొనసాగుతున్న శారీరక స్థితిని παραλελυμένος సూచిస్తుంది. ‘పక్షవాతానికి గురైన’ అనేది కారణాన్ని అతిగా నిర్ధారించకుండా ఆ స్థితిని స్పష్టంగా తెలియజేస్తుంది.
