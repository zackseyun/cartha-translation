translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని దీర్ఘ విశేషణ నిర్మాణాన్ని తెలుగు పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించాం; సమాచారం, కాలవ్యవధి, పక్షవాత స్థితి అన్నీ నిలుపుకున్నాం.
