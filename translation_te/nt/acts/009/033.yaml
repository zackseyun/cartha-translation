  - severity: low
    issue: “పరుపు” and its footnote do not foreground the mat/pallet sense of κραβάττος as directly as possible.
    rationale: κραβάττος commonly denotes a mat, cot, or pallet. “చాప” preserves the concrete image more naturally in Telugu.
