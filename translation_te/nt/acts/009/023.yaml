id: ACT.9.23
reference: Acts 9:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληροῦντο ἡμέραι ἱκαναί, συνεβουλεύσαντο οἱ Ἰουδαῖοι ἀνελεῖν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/023.yaml
  text: When many days had passed[c][b][a], the Jews conspired to kill him.
translation:
  language: te
  text: చాలా రోజులు గడిచిన తర్వాత, యూదులు[a] అతణ్ణి చంపడానికి కలిసి కుట్ర పన్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘యూదులు.’ ఈ సందర్భంలో ఇది సౌలును వ్యతిరేకించిన ఒక నిర్దిష్ట సమూహాన్ని సూచిస్తుంది; యూదులందరినీ మినహాయింపులేకుండా సూచించదు.
    reason: cultural_note
  - marker: b
    text: లేదా ‘అతణ్ణి చంపడానికి కలిసి పథకం వేశారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἐπληροῦντο ἡμέραι ἱκαναί
  choice: చాలా రోజులు గడిచిన తర్వాత
  rationale: కాలం పూర్తవుతూ గడిచిందనే గ్రీకు ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; ἱκαναί ఇక్కడ ‘తగినన్ని’ కంటే ‘చాలా’ లేదా ‘గణనీయమైనన్ని’ అనే భావం ఇస్తుంది.
- source_word: συνεβουλεύσαντο
  choice: కలిసి కుట్ర పన్నారు
  rationale: వారు పరస్పరం సంప్రదించుకోవడమే కాక హానికరమైన ఉద్దేశంతో ఉమ్మడిగా పథకం వేసిన భావాన్ని సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: మూలంలోని సాధారణ జాతి-మత సమూహ సూచనను అదనపు నిర్దిష్టీకరణ లేకుండా నిలుపుతుంది.
- source_word: ἀνελεῖν αὐτόν
  choice: అతణ్ణి చంపడానికి
  rationale: సౌలును సూచించే సర్వనామంతో పాటు ప్రాణం తీయడమనే క్రియ యొక్క ప్రత్యక్ష భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: వ్యతిరేక కథన సందర్భంలో οἱ Ἰουδαῖοι అనువాదం
  choice: యూదులు
  alternative: యూదా నాయకులు / యూదయవారు
  rationale: వచనం స్వయంగా ‘నాయకులు’ అని పరిమితం చేయదు; అందువల్ల మూలంలోని విస్తృత పదాన్ని నిలుపుతూ, అది యూదులందరినీ మినహాయింపులేకుండా సూచించదని పాదసూచికలో సందర్భపరంగా స్పష్టం చేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘చాలా రోజులు గడిచిన తర్వాత’ అనే రూపం గ్రీకు కాలసూచక ప్రయోగాన్ని సహజంగా అందిస్తుంది; ‘కలిసి కుట్ర పన్నారు’ ఉమ్మడి దురుద్దేశపూర్వక ఆలోచనను స్పష్టంగా తెలియజేస్తుంది.
