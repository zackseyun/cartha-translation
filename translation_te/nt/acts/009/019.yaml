translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని రెండు వాక్యాల క్రమం, కాలసంబంధం, నిర్దిష్టం కాని వ్యవధి నిలుపబడ్డాయి.
