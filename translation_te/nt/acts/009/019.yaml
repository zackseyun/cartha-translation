id: ACT.9.19
reference: Acts 9:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λαβὼν τροφὴν ⸀ἐνίσχυσεν. Ἐγένετο ⸀δὲ μετὰ τῶν ἐν Δαμασκῷ μαθητῶν ἡμέρας τινὰς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/019.yaml
  text: And after taking food[a], he regained his strength. And he was with the disciples in Damascus for some days[c][b],
translation:
  language: te
  text: ఆహారం తీసుకున్న తర్వాత[a] అతడు మళ్లీ బలాన్ని పొందాడు[b]. అతడు దమస్కులోని శిష్యులతో కొన్ని రోజులు[c] ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘భోజనం చేసిన తర్వాత.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతడు బలపడ్డాడు.’
    reason: lexical_alternative
  - marker: c
    text: గ్రీకు మూలంలో ‘కొన్ని రోజులు’; ఇది ఖచ్చితంగా పేర్కొనని కాలవ్యవధిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν τροφὴν
  choice: ఆహారం తీసుకున్న తర్వాత
  rationale: క్రియావిశేషణార్థక భూతకృదంతం ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచిస్తుంది; τροφή ఇక్కడ తినే ఆహారం లేదా పోషణను సూచిస్తుంది. ఈ అనువాదం క్రమాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐνίσχυσεν
  choice: అతడు మళ్లీ బలాన్ని పొందాడు
  rationale: ఉపవాసంతో బలహీనుడైన సౌలు ఆహారం తీసుకున్న తరువాత శక్తి పుంజుకున్నాడనే సందర్భార్థాన్ని ఇది సహజంగా వ్యక్తం చేస్తుంది; గ్రీకు క్రియలోని బలపడుట అనే ఫలితాన్ని నిలుపుతుంది.
- source_word: Ἐγένετο δὲ
  choice: అతడు ... ఉన్నాడు
  rationale: ఇక్కడ ἐγένετο δὲ కథనాన్ని కొనసాగించే సంధిగా పనిచేస్తుంది; ‘జరిగింది’ అని అక్షరార్థంగా అనువదించడం తెలుగులో అసహజంగా ఉంటుంది.
- source_word: μετὰ τῶν ἐν Δαμασκῷ μαθητῶν
  choice: దమస్కులోని శిష్యులతో
  rationale: μετά + షష్ఠీ విభక్తి సహవాసాన్ని సూచిస్తుంది; ἐν Δαμασκῷ శిష్యులున్న స్థలాన్ని తెలియజేస్తుంది.
- source_word: ἡμέρας τινάς
  choice: కొన్ని రోజులు
  rationale: ద్వితీయా విభక్తి కాలవ్యవధిని సూచిస్తుంది; τινάς ఖచ్చితంగా పేర్కొనని రోజుల సంఖ్యను తెలియజేస్తుంది.
