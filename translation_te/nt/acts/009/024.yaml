source:
  edition: SBLGNT
  text: ἐγνώσθη δὲ τῷ Σαύλῳ ἡ ἐπιβουλὴ αὐτῶν. ⸂παρετηροῦντο δὲ καὶ⸃ τὰς πύλας ἡμέρας τε καὶ νυκτὸς ὅπως αὐτὸν ἀνέλωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/024.yaml
  text: But their plot became known to Saul[a]. They were also watching the gates day and night so that they might kill him.
translation:
  language: te
  text: అయితే వారి కుట్ర సౌలుకు తెలిసిపోయింది. అతన్ని చంపడానికి వారు పగలూ రాత్రీ ద్వారాలను కూడా గమనిస్తూ ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పట్టణ ద్వారాలను.’ గ్రీకు మూలంలో కేవలం ‘ద్వారాలు’ అని ఉంది; సందర్భాన్ని బట్టి అవి దమస్కు పట్టణ ద్వారాలని అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώσθη
  choice: తెలిసిపోయింది
  rationale: ఈ భూతకాల కర్మణి రూపం కుట్ర సౌలు దృష్టికి వచ్చిందని తెలియజేస్తుంది; దాన్ని ఎవరు తెలియజేశారో అనవసరంగా నిర్దేశించదు.
- source_word: ἐπιβουλή
  choice: కుట్ర
  rationale: హాని చేయడానికి పన్నిన రహస్య పథకాన్ని, తరువాత స్పష్టమయ్యే హత్యా ఉద్దేశాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παρετηροῦντο
  choice: నిఘా ఉంచుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న జాగరూక పర్యవేక్షణ భావాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: πύλας
  choice: ద్వారాలపై
  rationale: గ్రీకు మూలంలో ఉన్న సాధారణ బహువచనమైన ‘ద్వారాలు’నే ప్రధాన పాఠ్యంలో ఉంచి, అవి పట్టణ ద్వారాలని సందర్భం ద్వారా గ్రహించేలా చేసింది.
- source_word: ἡμέρας τε καὶ νυκτός
  choice: పగలూ రాత్రీ
  rationale: నిరంతర పర్యవేక్షణను తెలిపే మూలభాషా నుడికారానికి సహజమైన తెలుగు సమానం.
- source_word: ὅπως
  choice: చంపాలని
  rationale: వారి పర్యవేక్షణ వెనుకనున్న ఉద్దేశాన్ని సహజమైన తెలుగు ప్రయోజనార్థక నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: ἀνέλωσιν
  choice: చంపాలని
  rationale: ఈ సందర్భంలో ἀναιρέωకు ఉన్న ‘చంపు, ప్రాణం తీయు’ అనే ప్రత్యక్ష అర్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: కుట్ర పన్నినవారి ఉద్దేశానికి విరుద్ధంగా అది సౌలుకు తెలిసిందనే స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: καὶ
  choice: కూడా
  rationale: వారు కుట్ర పన్నడమే కాక ద్వారాలపై నిఘా కూడా ఉంచారనే అదనపు అంశాన్ని నిలుపుతుంది.
