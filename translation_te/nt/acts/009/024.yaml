translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. కొనసాగుతున్న నిఘాను తెలియజేయడానికి ‘నిఘా ఉంచుతూ ఉన్నారు’ అని అనువదించబడింది. ఇచ్చిన ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదసూచిక గుర్తు ‘సౌలు’ దగ్గర ఉన్నప్పటికీ, పాదసూచిక విషయం ‘ద్వారాలు’ గురించినది కావడంతో తెలుగులో గుర్తును సంబంధిత పదం దగ్గర ఉంచాం.
