  to: అయితే సౌలు, ప్రభువు శిష్యులకు వ్యతిరేకంగా బెదిరింపులనూ హత్యను[a] ఇంకా ఊపిరి పీలుస్తూ, ప్రధాన యాజకుని వద్దకు వెళ్లి,
