id: ACT.9.1
reference: Acts 9:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁ δὲ Σαῦλος ἔτι ἐμπνέων ἀπειλῆς καὶ φόνου εἰς τοὺς μαθητὰς τοῦ κυρίου, προσελθὼν τῷ ἀρχιερεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/001.yaml
  text: But Saul[a], still breathing threats and murder against the disciples of the Lord, came to the high priest
translation:
  language: te
  text: అయితే సౌలు, ప్రభువు శిష్యులకు వ్యతిరేకంగా బెదిరింపులనూ హత్యను[a] ఇంకా ఊపిరి పీలుస్తూ, ప్రధాన యాజకుని వద్దకు వెళ్లి,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వధను.’ గ్రీకు పదం φόνος చంపడాన్ని లేదా హత్యను సూచించగలదు. ‘హత్య’ దాని నైతిక తీవ్రతను వ్యక్తం చేస్తుంది; ‘వధ’ ఈ సందర్భంలో సంప్రదాయంగా వాడే మరో అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి ఘటన నుంచి కథనం తిరిగి సౌలు వైపు మళ్లడాన్ని, స్వల్ప వ్యత్యాసాన్ని సహజంగా సూచిస్తుంది.
- source_word: ἔτι
  choice: ఇంకా
  rationale: సౌలు శత్రుభావం మునుపటిలాగే కొనసాగుతోందని తెలియజేస్తుంది.
- source_word: ἐμπνέων
  choice: ఊపిరిగా పీలుస్తూ
  rationale: బెదిరింపులు, హత్య సౌలు పీల్చే ఊపిరిలా అతనిని నింపివేశాయనే గ్రీకు వాక్యంలోని బలమైన రూపకాన్ని నిలుపుతుంది.
- source_word: ἀπειλῆς
  choice: బెదిరింపులను
  rationale: శిష్యుల పట్ల సౌలు ప్రదర్శిస్తున్న నిరంతర శత్రుత్వాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: φόνου
  choice: హత్యను
  rationale: అక్రమంగా ప్రాణం తీయడంలోని నైతిక తీవ్రతను నిలుపుతుంది; ‘వధ’ కూడా సాధ్యమైన అనువాదం కావడంతో దానిని పాదసూచికలో ఇచ్చాం.
- source_word: εἰς τοὺς μαθητὰς
  choice: శిష్యులకు వ్యతిరేకంగా
  rationale: శత్రుత్వ సందర్భంలో εἰς సూచించే లక్ష్యాన్ని, విరోధ దిశను స్పష్టంగా తెలియజేస్తుంది.
- source_word: μαθητὰς
  choice: శిష్యులు
  rationale: యేసును అనుసరించే నిబద్ధ అనుచరులకు అపొస్తలుల కార్యములలో వాడే స్థిరమైన, సందర్భోచిత పదం.
- source_word: τοῦ κυρίου
  choice: ప్రభువు
  rationale: ఈ సందర్భంలో శిష్యులు ఎవరికి చెందినవారో తెలిపే జనిటివ్ సంబంధాన్ని సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: προσελθὼν
  choice: దగ్గరికి వెళ్లి
  rationale: తదుపరి వచనంలోని ప్రధాన క్రియకు ముందున్న కృదంత చర్యను సహజంగా తెలియజేస్తూ, ఈ వచనంలోని అసంపూర్ణ వాక్య ప్రవాహాన్ని నిలుపుతుంది.
- source_word: τῷ ἀρχιερεῖ
  choice: ప్రధాన యాజకుని
  rationale: ఏకవచన ἀρχιερεύς‌కు తెలుగులో స్థిరమైన, సులభంగా అర్థమయ్యే పదప్రయోగం.
theological_decisions:
- issue: τοῦ κυρίου లో κύριος అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: లూకా–అపొస్తలుల కార్యముల సందర్భంలో ఇది యేసును సూచిస్తుంది; ‘ప్రభువు’ గౌరవార్థాన్ని, స్థిరమైన క్రైస్తవ ప్రయోగాన్ని కాపాడుతుంది. ఇక్కడ ప్రధాన పాఠంలో ప్రత్యామ్నాయం అవసరమయ్యేంత సందిగ్ధత లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘ఊపిరిగా పీలుస్తూ’ అనే రూపకం గ్రీకు మూలంలోని సజీవ చిత్రణను ఉద్దేశపూర్వకంగా నిలుపుతుంది. వాక్యం 2వ వచనంలో కొనసాగుతుంది కాబట్టి చివర కామాను ఉంచాం.
