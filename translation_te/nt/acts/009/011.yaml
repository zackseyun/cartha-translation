id: ACT.9.11
reference: Acts 9:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ κύριος πρὸς αὐτόν· ⸀Ἀναστὰς πορεύθητι ἐπὶ τὴν ῥύμην τὴν καλουμένην Εὐθεῖαν καὶ ζήτησον ἐν οἰκίᾳ Ἰούδα Σαῦλον ὀνόματι Ταρσέα, ἰδοὺ γὰρ προσεύχεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/011.yaml
  text: And the Lord said to him[a], “Get up and go to the street called Straight, and in the house of Judas look for a man named Saul, from Tarsus, for behold, he is praying.”
translation:
  language: te
  text: 'ప్రభువు అతనితో ఇలా అన్నాడు: “నువ్వు లేచి, ‘నేరుగా ఉన్న వీధి’ అని పిలిచే వీధికి వెళ్లి, యూదా ఇంట్లో తార్సుకు చెందిన[a] సౌలు అనే వ్యక్తిని వెదుకు; ఎందుకంటే, ఇదిగో, అతడు ప్రార్థిస్తున్నాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తార్సుకు చెందిన సౌలు అనే వ్యక్తిని వెదుకు.” గ్రీకు పదమైన Ταρσέα సౌలు తార్సు పట్టణానికి చెందినవాడని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: ప్రభువు
  rationale: కొత్త నిబంధనలో κύριος అనే అధికారపూర్వక బిరుదుకు సహజమైన ప్రామాణిక తెలుగు రూపం; ఈ వాక్యంలో లేని ‘యేసు’ అనే పేరును చేర్చదు.
- source_word: Ἀναστὰς πορεύθητι
  choice: నువ్వు లేచి ... వెళ్లి
  rationale: ఆజ్ఞార్థక భావంతో వచ్చిన aorist participleను తరువాతి ఆజ్ఞతో సహజమైన తెలుగు వరుసలో వ్యక్తం చేస్తుంది.
- source_word: ῥύμην τὴν καλουμένην Εὐθεῖαν
  choice: ‘తిన్నని వీధి’ అని పిలిచే వీధికి
  rationale: ῥύμηνను నగరంలోని ‘వీధి’గా, Εὐθεῖανను వీధి పేరుగా అర్థమయ్యేలా అనువదిస్తుంది; పేరులోని ‘నేరుగా/తిన్నగా’ అనే భావాన్నీ నిలుపుతుంది.
- source_word: ἐν οἰκίᾳ Ἰούδα
  choice: యూదా ఇంట్లో
  rationale: ἐν యొక్క స్థలార్థాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ζήτησον
  choice: కోసం వెదుకు
  rationale: ζητέω ఇక్కడ ఒక వ్యక్తిని వెదకడం లేదా అతని గురించి అడిగి తెలుసుకోవడం; ‘కనుగొను’ అని ఫలితాన్ని ముందుగానే నిర్ధారించదు.
- source_word: Σαῦλον ὀνόματι Ταρσέα
  choice: తార్సువాడైన సౌలు అనే వ్యక్తి
  rationale: ὀνόματι పేరును సూచిస్తుండగా, Ταρσέα అతని తార్సు మూలాన్ని సూచిస్తుంది; తెలుగు వాక్యక్రమంలో రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: ἰδοὺ γὰρ προσεύχεται
  choice: ఇదిగో, అతడు ప్రార్థిస్తున్నాడు
  rationale: ἰδού యొక్క శ్రద్ధాకర్షణను ‘ఇదిగో’ నిలుపుతుంది; వర్తమాన క్రియ కొనసాగుతున్న కార్యాన్ని సూచించేలా ‘ప్రార్థిస్తున్నాడు’గా ఇచ్చింది. గ్రీకులోని γάρ తెలిపే కారణసంబంధం ముందరి ఆజ్ఞ–తరువాతి వివరణ అనుసంధానంలో వ్యక్తమవుతుంది.
theological_decisions:
- issue: κύριος ఎవరిని సూచిస్తుంది
  choice: ప్రభువు
  alternative: ప్రభువైన యేసు
  rationale: సందర్భం వక్తను గుర్తించడానికి సహాయపడినా, ఈ వాక్యంలో గ్రీకు పాఠం κύριος మాత్రమే అంటుంది. అందువల్ల అనువాదం ఆ గుర్తింపును విస్తరించకుండా మూలపాఠపు రూపాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ప్రత్యక్ష సంభాషణలో సహజమైన ఏకవచన ‘నువ్వు’ వాడబడింది; వీధి పేరును అర్థవంతమైన తెలుగు పేరుగా ఉల్లేఖన చిహ్నాల్లో చూపింది.
