    reason: పేర్ల మధ్య భాషాపరమైన సంబంధాన్ని, వాటి పదార్థాన్ని వివరించడానికి.
  revision_rationale: The revision preserves the feminine disciple designation, the Greek-equivalent-name explanation, and Tabitha’s habitual pattern of beneficent deeds. It replaces stiff literal phrasing with modern standard Telugu while retaining the source’s sense that she was characterized by abundant good works and almsgiving.
