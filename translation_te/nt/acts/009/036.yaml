revisions:
- from: యొప్పేలో తబితా[a] అనే ఒక శిష్యురాలు ఉండేది. ఆ పేరును అనువదిస్తే “దొర్కా” అని అంటారు. ఆమె మంచి పనులతోనూ, తాను చేస్తూ ఉండే దయాదానాలతోనూ నిండినది.
  to: యొప్పేలో తబితా[a] అనే ఒక శిష్యురాలు ఉండేది. ఆమె పేరు గ్రీకులో దొర్కా అని అంటారు. ఆమె మంచి పనులు, దానధర్మాలు సమృద్ధిగా చేసేది.
  rationale: The revision preserves the feminine disciple designation, the Greek-equivalent-name explanation, and Tabitha’s habitual pattern of beneficent deeds. It replaces stiff literal phrasing with modern standard Telugu while retaining the source’s sense that she was characterized by abundant good works and almsgiving.
