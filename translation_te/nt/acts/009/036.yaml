id: ACT.9.36
reference: Acts 9:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐν Ἰόππῃ δέ τις ἦν μαθήτρια ὀνόματι Ταβιθά, ἣ διερμηνευομένη λέγεται Δορκάς· αὕτη ἦν πλήρης ⸂ἔργων ἀγαθῶν⸃ καὶ ἐλεημοσυνῶν ὧν ἐποίει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/036.yaml
  text: In Joppa there was a disciple named Tabitha[a], which translated is called Dorcas. She was full of good works and acts of mercy that she was doing.
translation:
  language: te
  text: యొప్పేలో తబితా[a] అనే ఒక శిష్యురాలు ఉండేది. ఆమె పేరు గ్రీకులో దొర్కా అని అంటారు. ఆమె మంచి పనులు, దానధర్మాలు సమృద్ధిగా చేసేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దొర్కా” అనేది “తబితా”కు సరితూగే గ్రీకు పేరు; ఈ పేరుకు “లేడి జింక” అని అర్థం.
    reason: పేర్ల మధ్య భాషాపరమైన సంబంధాన్ని, వాటి పదార్థాన్ని వివరించడానికి.
lexical_decisions:
- source_word: μαθήτρια
  choice: శిష్యురాలు
  rationale: మూలపదం స్త్రీలింగంలో ఉండి ఒక స్త్రీ శిష్యురాలిని స్పష్టంగా సూచిస్తుంది; ఆధునిక తెలుగులో ‘శిష్యురాలు’ సహజంగానూ లింగస్పష్టంగానూ ఉంది.
- source_word: ὀνόματι Ταβιθά
  choice: తబితా అనే
  rationale: పేరును పరిచయం చేసే గ్రీకు దత్తివిభక్తి ప్రయోగానికి ఇది సహజమైన తెలుగు రూపం.
- source_word: διερμηνευομένη λέγεται Δορκάς
  choice: ఆ పేరును అనువదిస్తే “దొర్కా” అని అంటారు
  rationale: సెమిటిక్ పేరుకు ఇవ్వబడిన గ్రీకు సమానపేరును, కేవలం పదార్థంగా కాక పేరుగానే, ఈ రూపం నిలుపుతుంది.
- source_word: πλήρης ἔργων ἀγαθῶν
  choice: మంచి పనులతో నిండినది
  rationale: πλήρης అనే సమృద్ధి భావాన్ని స్పష్టంగా నిలుపుతూ ἔργων ἀγαθῶνను సాధారణ పాఠకులకు సహజంగా అందిస్తుంది.
- source_word: ἐλεημοσυνῶν
  choice: దయాదానాలు
  rationale: అవసరంలో ఉన్నవారికి కనికరంతో చేసే సహాయాన్ని, దానధర్మ భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది; కేవలం డబ్బు ఇవ్వడానికే అర్థాన్ని పరిమితం చేయదు.
- source_word: ὧν ἐποίει
  choice: తాను చేస్తూ ఉండే
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగిన లేదా అలవాటైన కార్యాన్ని ఈ రూపం కాపాడుతుంది.
- source_word: Ἐν Ἰόππῃ δέ
  choice: యొప్పేలో
  rationale: δέ ఇక్కడ స్వల్ప కథన అనుసంధానాన్ని ఇస్తుంది; తెలుగులో అవసరం లేని ప్రత్యేక కాలసూచక పదాన్ని చేర్చకుండా సందర్భప్రవాహానికే దాన్ని వదిలాం.
theological_decisions:
- issue: μαθήτριαలోని స్త్రీలింగాన్ని ఎలా వ్యక్తం చేయాలి
  choice: శిష్యురాలు
  alternative: శిష్యుడు / శిష్య వ్యక్తి
  rationale: కొత్త నిబంధనలో అరుదైన ఈ స్త్రీలింగ రూపం స్త్రీ శిష్యురాలిని ఉద్దేశపూర్వకంగా సూచిస్తుంది. తెలుగు సహజంగానే లింగాన్ని చూపగలదు కాబట్టి దాన్ని స్పష్టంగా నిలిపాం.
- issue: ἐλεημοσυνῶν యొక్క పరిధి
  choice: దయాదానాలు
  alternative: భిక్షాదానాలు; కనికరపు కార్యాలు
  rationale: ఈ పదంలో పేదలకు ఇచ్చే దానం ప్రత్యేకంగా ఉండగలిగినా, సందర్భంలో కనికరంతో చేసే సహాయక కార్యాల విస్తృత భావమూ ఉంది. ‘దయాదానాలు’ ఆ రెండు కోణాలను అతిగా సంకుచితం చేయకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని స్త్రీలింగ సూచనను స్పష్టంగా ఉంచి, కొనసాగుతూ వచ్చిన సేవను ‘చేస్తూ ఉండే’ అని తెలిపాం.
