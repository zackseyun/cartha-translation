id: ACT.9.20
reference: Acts 9:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εὐθέως ἐν ταῖς συναγωγαῖς ἐκήρυσσεν τὸν ⸀Ἰησοῦν ὅτι οὗτός ἐστιν ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/020.yaml
  text: And immediately in the synagogues he began proclaiming Jesus[b][a], that he is the Son of God.
translation:
  language: te
  text: వెంటనే అతడు సమాజమందిరాల్లో, యేసే దేవుని కుమారుడని ప్రకటించడం మొదలుపెట్టాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రకటిస్తూ ఉన్నాడు.” గ్రీకు క్రియ బహిరంగంగా ప్రకటించే భావాన్ని కలిగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: వెంటనే
  rationale: ఆలస్యం లేకుండా జరిగిన చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, కథనంలోని తక్షణత్వాన్ని నిలుపుతుంది.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: సమాజమందిరాల్లో
  rationale: ἐν యొక్క స్థానార్థాన్ని, అలాగే బహువచనాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐκήρυσσεν
  choice: ప్రకటించడం మొదలుపెట్టాడు
  rationale: κηρύσσωలోని బహిరంగ ప్రకటన భావాన్ని ‘ప్రకటించడం’ నిలుపుతుంది; ఈ కథన సందర్భంలో అపరిపూర్ణ భూతకాల రూపం సూచించే ఆరంభ భావాన్ని ‘మొదలుపెట్టాడు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸν Ἰησοῦν ... ὅτι οὗτός ἐστιν
  choice: యేసే ... అని
  rationale: గ్రీకులో యేసు ప్రత్యక్ష కర్మగా ఉండి, ὅτι తరువాత ఆయన గురించిన ప్రకటన వస్తుంది. తెలుగులో ‘యేసే’ అనే ఉద్ఘాటన οὗτός యొక్క గుర్తింపు బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: దేవుని కుమారుడు
  rationale: మూలంలోని క్రీస్తుసంబంధ బిరుదును సంక్షిప్తంగా, సంప్రదాయబద్ధంగా, వ్యాఖ్యాన విస్తరణ లేకుండా అందిస్తుంది.
theological_decisions:
- issue: సౌలు ప్రకటించిన క్రీస్తుసంబంధ బిరుదు
  choice: దేవుని కుమారుడు
  alternative: దేవుని కుమారుడే
  rationale: ὁ υἱὸς τοῦ θεοῦ అనే బిరుదును నేరుగా నిలుపుతూ, οὗτός యొక్క ఉద్ఘాటనను ‘యేసే’లో వ్యక్తం చేశాం; అందువల్ల బిరుదుపై మరో ఉద్ఘాటనను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘యేసే’ ద్వారా గ్రీకు οὗτόςలోని ఉద్ఘాటనను సహజంగా నిలిపాం.
