source:
  edition: SBLGNT
  text: ἐπιγνόντες δὲ οἱ ἀδελφοὶ κατήγαγον αὐτὸν εἰς Καισάρειαν καὶ ἐξαπέστειλαν αὐτὸν εἰς Ταρσόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/030.yaml
  text: When the brothers learned this[a], they brought him down to Caesarea and sent him off to Tarsus.
translation:
  language: te
  text: సోదరులు ఈ విషయం తెలుసుకున్నప్పుడు[a], అతణ్ణి కైసరయకు తీసుకువెళ్లి, తార్సుకు పంపించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సోదరులు, సోదరీలు.’ గ్రీకులో ‘సోదరులు’ అని ఉంది; అయితే ఈ సందర్భంలో అది విశ్వాసుల సమాజాన్ని విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: ఈ విషయం తెలుసుకున్నప్పుడు
  rationale: ἐπιγινώσκω అనే క్రియ యొక్క భూతకాల కృదంతం ప్రధాన చర్యలకు కారణమైన పరిస్థితిని తెలియజేస్తుంది. కర్మ మునుపటి వచనం నుండి అర్థమవుతుంది కాబట్టి సహజమైన తెలుగులో ‘ఈ విషయం’ అని స్పష్టపరచబడింది.
- source_word: οἱ ἀδελφοὶ
  choice: సోదరులు
  rationale: గ్రీకు పదం అక్షరార్థంగా పుంలింగ బహువచనమైన ‘సోదరులు.’ సందర్భంలో ఇది విశ్వాసుల సమాజాన్ని విస్తృతంగా సూచించే అవకాశం ఉన్నందున ఆ భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: κατήγαγον
  choice: తీసుకువెళ్లి
  rationale: κατάγω ఇక్కడ సముద్రతీరంలోని కైసరయ వైపు తీసుకువెళ్లడాన్ని సూచిస్తుంది. తెలుగులో ‘కిందికి తీసుకువెళ్లి’ అనడం అసహజంగా లేదా అనవసరంగా స్థలాకృతి భావాన్ని బలపరచవచ్చు; ‘తీసుకువెళ్లి’ ప్రయాణ దిశను సహజంగా తెలియజేస్తుంది.
- source_word: Καισάρειαν
  choice: కైసరయకు
  rationale: స్థలనామానికి తెలుగులో స్థిరంగా వాడే లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: ἐξαπέστειλαν
  choice: అక్కడి నుండి ... పంపించారు
  rationale: ἐξαποστέλλω ఒక స్థలం నుండి ముందుకు పంపివేయడాన్ని సూచిస్తుంది. ‘అక్కడి నుండి పంపించారు’ అనే రూపం కైసరయ నుండి తార్సుకు సాగిన కథన గమనాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Ταρσόν
  choice: తార్సుకు
  rationale: పట్టణ నామానికి తెలుగులో సాధారణంగా అర్థమయ్యే లిప్యంతరీకరణను ఉపయోగించాం.
theological_decisions:
- issue: మిశ్రమ విశ్వాసుల సమాజాన్ని సూచించే అవకాశం ఉన్న ἀδελφοί పదం
  choice: సోదరులు
  alternative: సోదర సోదరీలు; తోటి విశ్వాసులు
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది సందర్భానుసారం విశ్వాసుల సమాజమంతటినీ సూచించవచ్చనే విస్తృత భావాన్ని పాదసూచికలో ఉంచాం. దీనివల్ల మూలరూపం మరియు సందర్భసాధ్యమైన సమగ్రత రెండూ సంరక్షించబడతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని అనుసరించాం. ‘అతణ్ణి’ సాధారణ ఆధునిక రూపం; స్థలనామాలకు విస్తృతంగా గుర్తించదగిన ‘కైసరయ,’ ‘తార్సు’ రూపాలు వాడాం.
