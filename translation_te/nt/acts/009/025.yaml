  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. గ్రీకు మూలంలోని ‘గోడ గుండా’ అనే అస్పష్టతను ప్రధాన పాఠంలో నిలిపి, సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఇచ్చాం. దింపడాన్ని తెలిపే రెండు గ్రీకు రూపాల పునరుక్తిని ఉద్దేశపూర్వకంగా కాపాడాం.
