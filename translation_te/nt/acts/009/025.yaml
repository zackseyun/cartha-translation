    rationale: The draft’s ‘ఒక పెద్ద గంపలో ఉంచి కిందికి దింపుతూ, గోడ గుండా అతన్ని దింపారు’ uses two closely adjacent lowering expressions in a syntactically strained manner. Greek does contain a finite verb and a participle, but the Telugu wording should not imply two separate lowerings or impede comprehension.
