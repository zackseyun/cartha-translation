  text: λαβόντες δὲ ⸂οἱ μαθηταὶ αὐτοῦ⸃ νυκτὸς ⸂διὰ τοῦ τείχους καθῆκαν αὐτὸν⸃ χαλάσαντες ἐν σπυρίδι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/025.yaml
  text: But his disciples took him by night and lowered him through the wall in a large basket[a][b].
translation:
  language: te
  text: అయితే అతని శిష్యులు రాత్రివేళ అతన్ని తీసుకొని, ఒక పెద్ద గంపలో పెట్టి, గోడ గుండా కిందికి దింపారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గోడలోని ఒక రంధ్రం గుండా.” గ్రీకులో అక్షరార్థంగా “గోడ గుండా” అని ఉంది; ఇది పట్టణ ప్రాకారంలోని రంధ్రాన్ని లేదా కిటికీని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు మూలంలో కిందికి దింపడాన్ని తెలిపే ఒక క్రియతో పాటు మరో క్రియావిశేషణ రూపం ఉంది; ఇది తప్పించుకున్న విధానాన్ని సజీవంగా వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: తీసుకొని
  rationale: శిష్యులు అతన్ని తప్పించడానికి తమ వెంట తీసుకొని చర్య చేపట్టారనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి కుట్రకు విరుద్ధంగా కథలో వచ్చే మలుపును మృదువుగా సూచిస్తుంది.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: అతని శిష్యులు
  rationale: αὐτοῦ అనే స్వామ్యార్థాన్ని నిలిపి, μαθηταίకు సాధారణ తెలుగు సమానార్థమైన ‘శిష్యులు’ను వాడుతుంది.
- source_word: νυκτός
  choice: రాత్రివేళ
  rationale: కాలాన్ని సూచించే గ్రీకు షష్ఠీ విభక్తిని సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: διὰ τοῦ τείχους
  choice: గోడ గుండా
  rationale: διάతో కూడిన పదబంధంలోని ‘గుండా’ అనే గమనార్థాన్ని కాపాడుతుంది; మూలంలో లేని ‘కిటికీ’ లేదా ‘రంధ్రం’ను ప్రధాన పాఠంలో చేర్చదు.
- source_word: καθῆκαν αὐτόν
  choice: అతన్ని దింపారు
  rationale: ఎత్తైన చోటు నుంచి కిందికి దింపడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: χαλάσαντες
  choice: కిందికి దింపుతూ
  rationale: καθῆκανతో అర్థపరంగా పునరుక్తి ఉన్నప్పటికీ, గ్రీకు వాక్యంలోని రెండవ దింపే వ్యక్తీకరణను నిలుపుతుంది.
- source_word: ἐν σπυρίδι
  choice: ఒక పెద్ద గంపలో ఉంచి
  rationale: σπυρίς మనిషిని మోయగల పెద్ద బుట్ట లేదా గంపను సూచిస్తుంది; ‘గంప’ సాధారణ తెలుగులో స్పష్టంగా ఉండగా ‘పెద్ద’ దాని పరిమాణ భావాన్ని తెలియజేస్తుంది.
