  naturalness: ‘అతన్ని తీసుకొని, ఒక పెద్ద గంపలో పెట్టి, గోడ గుండా కిందికి దింపారు’ is clear, idiomatic modern standard Telugu narrative prose. It avoids an unnatural consecutive participle chain and needless repetition of ‘అతన్ని.’
  terminology: ‘శిష్యులు,’ ‘రాత్రివేళ,’ ‘గోడ గుండా,’ and ‘పెద్ద గంప’ are appropriate. ‘గంపలో పెట్టి’ naturally conveys ἐν σπυρίδι without adding an interpretive detail. The notes retain the source’s ambiguity concerning the route through the wall and explain the paired Greek lowering expressions.
  issues:
