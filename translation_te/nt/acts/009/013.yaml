id: ACT.9.13
reference: Acts 9:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη δὲ Ἁνανίας· Κύριε, ⸀ἤκουσα ἀπὸ πολλῶν περὶ τοῦ ἀνδρὸς τούτου, ὅσα κακὰ ⸂τοῖς ἁγίοις σου ἐποίησεν⸃ ἐν Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/013.yaml
  text: But Ananias answered[a], “Lord, I have heard from many about this man, how much evil he has done to your saints in Jerusalem.”
translation:
  language: te
  text: 'అయితే అననీయ ఇలా జవాబిచ్చాడు: “ప్రభువా, ఈ మనిషి గురించి—యెరూషలేములో నీ పరిశుద్ధులకు ఇతడు ఎంత కీడు చేశాడో[a]—చాలామంది నుంచి విన్నాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ పరిశుద్ధులకు ఇతడు ఎన్ని చెడ్డ పనులు చేశాడో.”
    reason: ὅσα κακάను కార్యాల బహుత్వాన్ని స్పష్టంగా చూపుతూ కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: ἀπεκρίθη δὲ Ἁνανίας
  choice: అయితే అననీయ ఇలా జవాబిచ్చాడు
  rationale: δέ ఇక్కడ కథనంలో అననీయ సంకోచంతో ప్రతిస్పందించడాన్ని సూచించే స్వల్ప వ్యతిరేక మలుపును ఇస్తుంది; ‘అయితే’ దాన్ని సహజంగా వ్యక్తం చేస్తుంది. ἀπεκρίθηకు ‘జవాబిచ్చాడు’ ప్రత్యక్ష సమానం.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: దర్శనంలో యేసును నేరుగా సంబోధిస్తున్న సందర్భంలో గౌరవాన్నీ వేదాంతపరమైన బరువునీ కాపాడే ప్రామాణిక తెలుగు రూపం.
- source_word: ἤκουσα ἀπὸ πολλῶν
  choice: చాలామంది నుంచి విన్నాను
  rationale: ἀπό మూలాన్ని, πολλῶν నిర్దిష్టం కాని అనేకమందిని సూచిస్తాయి; ఈ రూపం అదనపు నామవాచకాన్ని చేర్చకుండా ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: περὶ τοῦ ἀνδρὸς τούτου
  choice: ఈ మనిషి గురించి
  rationale: περί + షష్ఠీ విభక్తి భావాన్నీ, demonstrative τούτου బలాన్నీ సూటిగా నిలుపుతుంది.
- source_word: ὅσα κακὰ
  choice: ఎంత కీడు
  rationale: గ్రీకు బహువచనం హానికరమైన కార్యాల విస్తారాన్ని సూచిస్తుంది. తెలుగులో ‘ఎంత కీడు’ సహజమైన సమష్టి వ్యక్తీకరణ; కార్యాల బహుత్వాన్ని చూపే ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: τοῖς ἁγίοις σου
  choice: నీ పరిశుద్ధులకు
  rationale: ἅγιοι అనే విశ్వాసులకున్న నూతన నిబంధన సంజ్ఞను, అలాగే σουలోని ‘నీ’ అనే సంబంధాన్ని కాపాడుతుంది.
- source_word: ἐποίησεν
  choice: చేశాడో
  rationale: ποιέω యొక్క విస్తృతమైన ‘చేయు’ భావాన్ని సూటిగా అందిస్తుంది; పరోక్ష ప్రశ్న నిర్మాణంలో ‘చేశాడో’ సహజం.
- source_word: ἐν Ἰερουσαλήμ
  choice: యెరూషలేములో
  rationale: స్థలార్థక ἐνకు ప్రామాణిక తెలుగు రూపం.
theological_decisions:
- issue: అననీయ సంబోధనలో Κύριε యొక్క సూచన మరియు భావం
  choice: యేసును ‘ప్రభువా’ అని నేరుగా సంబోధించడం
  alternative: కేవలం గౌరవార్థకంగా ‘అయ్యా’ లేదా ‘యజమానీ’
  rationale: తక్షణ సందర్భంలో అననీయ దర్శనంలో పునరుత్థానుడైన యేసుకు జవాబిస్తున్నాడు. అందువల్ల ‘ప్రభువా’ కథన సందర్భానికీ పదపు వేదాంతపరమైన బరువుకీ తగినది; అంతకుమించిన వ్యాఖ్యానాన్ని ఇది చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణంతో, ప్రత్యక్ష సంభాషణకు తగిన గౌరవభరిత శైలిని ఉపయోగించాం. ‘పరిశుద్ధులు’ అనే స్థిరమైన బైబిలు పదాన్ని నిలిపాం.
