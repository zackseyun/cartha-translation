  text: For I will show him how much he must suffer for my name[a].
translation:
  language: te
  text: ఎందుకంటే నా నామం కోసం అతడు ఎంతగా బాధపడవలసి ఉంటుందో నేనే అతనికి చూపిస్తాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా నామం నిమిత్తం’ లేదా ‘నా నామం కొరకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: నేనే
  rationale: గ్రీకులో వ్యక్తంగా ఉన్న ప్రథమ పురుష సర్వనామంలోని ఉద్ఘాటనను తెలుగులో ‘నేనే’ సహజంగా తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను అనుసంధానించే పదం; ఆధునిక తెలుగులో ‘ఎందుకంటే’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: ὑποδείξω
  choice: చూపిస్తాను
  rationale: చూపడం, తెలియజేయడం అనే భావాలలో ఇక్కడ ప్రత్యక్షమైన ‘చూపిస్తాను’ సరిపోతుంది.
- source_word: αὐτῷ
  choice: అతనికి
  rationale: దత్తివాచక పరోక్ష కర్మను తెలుగులో సహజంగా ‘అతనికి’ అని అనువదించాం.
- source_word: ὅσα
  choice: ఎంతగా
  rationale: δεῖ మరియు బాధపడడం అనే క్రియతో కలిసి, అనుభవించబోయే బాధ పరిమాణాన్ని సూచిస్తుంది; ‘ఎంతగా’ తెలుగులో సహజమైన పరిమాణార్థాన్ని ఇస్తుంది.
- source_word: δεῖ
  choice: బాధపడవలసి ఉంటుంది
  rationale: అవసరతను నిలుపుతూ, అది విధి, నియామకం లేదా దైవ నిర్ణయం అని అదనంగా నిర్ధారించకుండా తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑπὲρ
  choice: కోసం
  rationale: కారణం, ప్రయోజనం లేదా పక్షంగా అనే విస్తృత భావాన్ని ‘కోసం’ సహజంగా నిలుపుతుంది; మరింత స్పష్టమైన ప్రత్యామ్నాయాలు పాదటిప్పణిలో ఉన్నాయి.
- source_word: τοῦ ὀνόματός μου
  choice: నా నామం
  rationale: వ్యక్తి, అధికారం, ఆయనతో బహిరంగ సంబంధం వంటి బైబిలీయ భావసంపదను నిలుపడానికి ‘నామం’ ఉపయోగించాం.
- source_word: παθεῖν
  choice: బాధపడడం
  rationale: πάσχω యొక్క సాధారణ అర్థమైన బాధ అనుభవించడాన్ని సరళంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: δεῖ తెలియజేసే అవసరత స్వభావం
  choice: బాధపడవలసి ఉంటుంది
  alternative: బాధపడడానికి నియమించబడ్డాడు
  rationale: గ్రీకు వాక్యం అవసరతను చెబుతుంది గాని అది విధి, దైవ నియామకం లేదా నిర్ణయం అని ఇక్కడే ప్రత్యేకంగా నిర్వచించదు. ఎంపిక చేసిన రూపం ఆ ఉద్దేశపూర్వక సందిగ్ధతను నిలుపుతుంది.
- issue: ‘నా నామం’ కోసం బాధపడడం యొక్క సంబంధం
  choice: నా నామం కోసం
  alternative: నా నామం నిమిత్తం / నా నామం పక్షంగా
  rationale: ὑπέρ కారణం, ప్రయోజనం లేదా పక్షంగా ఉండడం అనే ఛాయలను కలిగి ఉండవచ్చు. ప్రధాన పాఠంలో విస్తృతమైన ‘కోసం’ ఉంచి, ప్రత్యామ్నాయ ఛాయలను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘నేనే’ ద్వారా గ్రీకు ἐγώ ఉద్ఘాటన నిలుపబడింది; ‘నామం’ బైబిలీయ భావవ్యాప్తిని కాపాడుతుంది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠంలో పొందుపరచబడింది.
