id: ACT.9.15
reference: Acts 9:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ κύριος· Πορεύου, ὅτι σκεῦος ἐκλογῆς ⸂ἐστίν μοι⸃ οὗτος τοῦ βαστάσαι τὸ ὄνομά μου ἐνώπιον ⸀ἐθνῶν ⸀τε καὶ βασιλέων υἱῶν τε Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/015.yaml
  text: But the Lord said to him[a], “Go[b], because this man is a chosen instrument of mine to carry my name before the Gentiles and kings and the sons of Israel,”
translation:
  language: te
  text: 'అయితే ప్రభువు అతనితో ఇలా అన్నాడు: “వెళ్లు. ఎందుకంటే ఇతడు అన్యజనుల[a] ఎదుట, రాజుల ఎదుట, ఇశ్రాయేలు కుమారుల[b] ఎదుట నా పేరును మోసుకెళ్లడానికి నేను ఎంచుకున్న సాధనం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేశాల.”
    reason: lexical_alternative
  - marker: b
    text: “ఇశ్రాయేలు కుమారులు” అనేది ఇశ్రాయేలు ప్రజలను సూచించే సాంప్రదాయ బైబిలు వ్యక్తీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: ప్రభువు
  rationale: ఈ కథన సందర్భంలో దైవాధికారంతో మాట్లాడుతున్న పునరుత్థానుడైన యేసును సూచించే బిరుదుగా సహజమైన ప్రామాణిక అనువాదం.
- source_word: Πορεύου
  choice: వెళ్లు
  rationale: ఆజ్ఞ యొక్క నేరుగా ఉన్న బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: σκεῦος ἐκλογῆς ἐστίν μοι
  choice: నేను ఎంచుకున్న సాధనం
  rationale: σκεῦος అనే పదంలోని ఒక ఉద్దేశానికి ఉపయోగపడే పాత్ర/సాధనం అనే రూపక భావాన్ని స్పష్టంగా తెలియజేస్తూ, ἐκλογῆς మరియు μοι సూచించే ప్రభువు ఎంపికను, వ్యక్తిగత సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοῦ βαστάσαι
  choice: మోసుకెళ్లడానికి
  rationale: ఉద్దేశాన్ని తెలిపే ఆర్టిక్యులర్ ఇన్ఫినిటివ్‌ను కాపాడుతూ, పేరు అనే కర్మతో కూడిన ‘మోయడం/తీసుకెళ్లడం’ భావాన్ని నిలుపుతుంది.
- source_word: τὸ ὄνομά μου
  choice: నా పేరును
  rationale: ‘పేరు’లోని ప్రాతినిధ్య అధికారం, బహిరంగ సాక్ష్యం వంటి బైబిలు ప్రతిధ్వనులను వివరణాత్మకంగా కుదించకుండా యథాతథంగా ఉంచుతుంది.
- source_word: ἐνώπιον
  choice: ఎదుట
  rationale: ప్రజల సమక్షంలో సాక్ష్యమిచ్చే సందర్భానికి సరిపోయే సూటి, సహజమైన పదం.
- source_word: ἐθνῶν
  choice: అన్యజనుల
  rationale: ఇశ్రాయేలు కుమారులతో ఉన్న వ్యత్యాసంలో యూదేతర ప్రజలను సూచించే సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది; మరింత అక్షరార్థమైన ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: βασιλέων
  choice: రాజుల
  rationale: మూలపదంలోని నిర్దిష్ట భావాన్ని సాధారణీకరించకుండా స్పష్టంగా నిలుపుతుంది.
- source_word: υἱῶν Ἰσραήλ
  choice: ఇశ్రాయేలు కుమారుల
  rationale: మూలంలోని పురుషలింగ కుటుంబ సంబంధ వ్యక్తీకరణను, దాని సాంప్రదాయ బైబిలు రూపాన్ని నిలుపుతుంది; దాని సామూహిక అర్థం పాదసూచికలో వివరించబడింది.
- source_word: τε ... καὶ ... τε
  choice: ఎదుట, ... ఎదుట, ... ఎదుట
  rationale: మూడు వర్గాల సమన్వయాన్ని తెలుగులో సహజమైన జాబితా నిర్మాణంతో వ్యక్తం చేస్తుంది; ప్రతి వర్గంతో ‘ఎదుట’ను పునరావృతం చేయడం సంబంధాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ἐκλογῆς అనే పదాన్ని తరువాతి కాలపు ఎన్నిక సిద్ధాంతాలతో అతిగా అనుసంధానించే అవకాశం
  choice: ‘నేను ఎంచుకున్న సాధనం’ అని అనువదించడం
  alternative: ‘ఎన్నిక పాత్ర’ లేదా ‘ఎంపిక పాత్ర’
  rationale: ఈ వాక్యం పరిచర్య కోసం దేవుడు చేసిన ఎంపికను స్పష్టంగా చెబుతుంది. ‘నేను ఎంచుకున్న సాధనం’ ఆ భావాన్ని సహజంగా నిలుపుతూ, వ్యక్తిగత రక్షణ లేదా ఎన్నిక గురించిన తరువాతి సిద్ధాంత చర్చను వాక్యంలోకి బలవంతంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి. మూలంలోని నేర ఆజ్ఞను, మూడు ప్రజావర్గాల వరుసను, ‘నా పేరు’ అనే బైబిలు వ్యక్తీకరణను నిలుపుతూ, కృత్రిమమైన పదబంధాలను నివారించింది. పాదసూచిక గుర్తులు సంబంధిత పదాల వెంటనే ఉంచబడ్డాయి.
