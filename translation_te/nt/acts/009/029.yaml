- from: అతడు గ్రీకు భాష మాట్లాడే యూదులతో[a] మాట్లాడుతూ వాదిస్తూ ఉండేవాడు. అయితే వారు అతన్ని చంపడానికి ప్రయత్నిస్తూ ఉన్నారు.
  to: అతడు గ్రీకు భాష మాట్లాడే యూదులతో[a] మాట్లాడుతూ, వాదిస్తూ ఉండేవాడు. అయితే వారు అతనిని చంపడానికి ప్రయత్నించేవారు.
