id: ACT.9.29
reference: Acts 9:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐλάλει τε καὶ συνεζήτει πρὸς τοὺς Ἑλληνιστάς· οἱ δὲ ἐπεχείρουν ⸂ἀνελεῖν αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/029.yaml
  text: And he was speaking and debating with the Hellenists[a], but they were attempting to kill him.
translation:
  language: te
  text: అతడు గ్రీకు భాష మాట్లాడే యూదులతో[a] మాట్లాడుతూ, వాదిస్తూ ఉండేవాడు. అయితే వారు అతనిని చంపడానికి ప్రయత్నించేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో “హెల్లెనిస్టులు”; అంటే గ్రీకు భాష మాట్లాడే యూదులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλει
  choice: మాట్లాడుతూ ఉండేవాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పదేపదే జరిగిన కార్యాన్ని సూచిస్తుంది; ఈ రూపం ఆ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τε καὶ
  choice: …తూ …తూ
  rationale: రెండు సమన్విత క్రియలను తెలుగులో సహజంగా కలుపుతూ, మాట్లాడటం మరియు వాదించడం రెండూ కొనసాగినట్లు తెలియజేస్తుంది.
- source_word: συνεζήτει
  choice: వాదిస్తూ
  rationale: ఇక్కడ తటస్థ చర్చకన్నా సజీవమైన వాదప్రతివాద భావం ఉంది; తరువాతి శత్రుత్వ స్పందనకు కూడా ఇది సరిపోతుంది.
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: గ్రీకు భాష మాట్లాడే యూదులతో
  rationale: చర్చ లేదా వాదన సందర్భంలో πρός పరస్పర సంబంధాన్ని సూచిస్తుంది. అపొస్తలుల కార్యముల సందర్భంలో Ἑλληνισταί అనేది సాధారణంగా గ్రీకు మాట్లాడే యూదులను సూచిస్తుంది.
- source_word: οἱ δὲ
  choice: అయితే వారు
  rationale: δέ సౌలు చేస్తున్న కార్యానికి వారి విరోధ స్పందనను వ్యత్యాసంగా చూపుతుంది.
- source_word: ἐπεχείρουν
  choice: ప్రయత్నిస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాలం వారి ప్రయత్నం కొనసాగుతూ ఉన్నదనే భావాన్ని నిలుపుతుంది.
- source_word: ἀνελεῖν αὐτόν
  choice: అతన్ని చంపడానికి
  rationale: ఈ సందర్భంలో ἀναιρέω స్పష్టంగా చంపడం లేదా ప్రాణం తీయడం అనే అర్థం ఇస్తుంది.
theological_decisions:
- issue: Ἑλληνιστάς అనే వారి గుర్తింపు
  choice: గ్రీకు భాష మాట్లాడే యూదులు
  alternative: హెల్లెనిస్టులు; గ్రీకులు
  rationale: అపొస్తలుల కార్యములు 6:1లోని సామాజిక-భాషా భేదానికి అనుగుణంగా, ఈ పదం అన్యజనులైన గ్రీకులను సాధారణంగా కాక గ్రీకు మాట్లాడే యూదుల సమూహాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో అర్థాన్ని స్పష్టంగా ఇచ్చి, ప్రత్యేక సమూహపేరును పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. రెండు అసంపూర్ణ భూతకాల క్రియల కొనసాగింపు భావాన్ని ‘మాట్లాడుతూ వాదిస్తూ ఉండేవాడు’, ‘ప్రయత్నిస్తూ ఉన్నారు’ అనే రూపాలతో నిలిపాం; అరుదైన ‘హెల్లెనిస్టులు’ పదాన్ని ప్రధాన పాఠ్యంలో వివరణాత్మకంగా అనువదించి పాదసూచికలో మూల సమూహపేరును ఇచ్చాం.
