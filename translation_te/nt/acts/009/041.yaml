source:
  edition: SBLGNT
  text: δοὺς δὲ αὐτῇ χεῖρα ἀνέστησεν αὐτήν, φωνήσας δὲ τοὺς ἁγίους καὶ τὰς χήρας παρέστησεν αὐτὴν ζῶσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/041.yaml
  text: And giving her his hand[a], he raised her up; then he called the saints and the widows and presented her alive.
translation:
  language: te
  text: ఆమెకు తన చేయి అందించి[a], ఆమెను లేపాడు; తరువాత పరిశుద్ధులను, విధవలను పిలిచి, ఆమెను వారి ఎదుట సజీవంగా నిలబెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆమె లేచి నిలబడేలా చేశాడు’ / ‘ఆమెకు లేవడానికి సహాయం చేశాడు.’ గ్రీకు క్రియ ఎవరినైనా లేవనెత్తడం లేదా నిలబడేలా చేయడం అని అర్థమివ్వగలదు; ఈ సందర్భంలో అది పునరుత్థాన భాషను కూడా ప్రతిధ్వనింపజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς ... χεῖρα
  choice: ఆమెకు తన చెయ్యి అందించి
  rationale: చేయూతనివ్వడానికి చెయ్యి చాచడం అనే గ్రీకు ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; పేతురు ఆమె చెయ్యి పట్టుకున్నాడని మూలంలో లేని సూక్ష్మతను చేర్చదు.
- source_word: ἀνέστησεν
  choice: ఆమెను లేపాడు
  rationale: ఎవరినైనా లేవనెత్తడం లేదా నిలబడేలా చేయడం అనే క్రియార్థాన్ని సహజంగా కాపాడుతుంది; ఈ సందర్భంలో పునరుత్థాన భాషతో ఉన్న ప్రతిధ్వనిని కూడా పూర్తిగా చెరపదు.
- source_word: φωνήσας
  choice: పిలిచి
  rationale: ఆ సమూహాన్ని పిలిపించిన ముందస్తు చర్యను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοὺς ἁγίους
  choice: పరిశుద్ధులను
  rationale: దేవునికి ప్రత్యేకించబడిన ఆయన ప్రజలకు కొత్త నిబంధనలో వాడే ప్రామాణిక సంబోధనను నేరుగా కాపాడుతుంది; ‘విశ్వాసులు’ అనేది కొంత వ్యాఖ్యానాత్మకం.
- source_word: τὰς χήρας
  choice: విధవరాండ్రను
  rationale: ముందటి కథనంలో ప్రత్యేక ప్రాధాన్యం కలిగిన విధవరాండ్రను పరిశుద్ధుల నుండి వేరుగా పేర్కొన్న మూలపాఠ నిర్మాణాన్ని కాపాడుతుంది.
- source_word: παρέστησεν
  choice: వారి ముందు నిలబెట్టాడు
  rationale: ఆమెను పిలువబడిన వారి సమక్షంలో నిలిపి చూపించడం అనే సందర్భార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; కేవలం ‘చూపించాడు’ కంటే గ్రీకు క్రియలోని కారణార్థానికి దగ్గరగా ఉంటుంది.
- source_word: ζῶσαν
  choice: సజీవంగా
  rationale: ఆమెను బతికివున్న వ్యక్తిగా వారి ముందు నిలబెట్టాడనే విధేయార్థాన్ని సహజంగా, బలంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పునరుత్థాన సందర్భంలో ἀνέστησεν క్రియ అనువాదం
  choice: ఆమెను లేపాడు
  alternative: ఆమె లేచి నిలబడేలా చేశాడు / ఆమెకు లేవడానికి సహాయం చేశాడు
  rationale: ఈ క్రియ తక్షణ శారీరక చర్యను—ఆమెను లేవనెత్తడాన్ని—తెలియజేస్తూనే, ముందరి వచనంలో ఆమె తిరిగి జీవించిన సందర్భంతో ఉన్న పునరుత్థాన ప్రతిధ్వనిని నిలుపుతుంది. అయితే పేతురే ఆమెకు జీవం ఇచ్చాడని ఈ క్రియ ఒక్కదానిపై ఆధారపడి అతిగా చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘పరిశుద్ధులు’ అనే నూతన నిబంధన పదాన్ని నిలిపి, ‘విధవరాండ్రు’ అనే వర్గాన్ని ప్రత్యేకంగా ఉంచాం. [a] సూచిక ప్రధాన పాఠ్యంలో సంబంధిత క్రియాభాగం వెంట ఉంచబడింది.
