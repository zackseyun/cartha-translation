translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. పేతురును ఉద్దేశించిన మాటలో తెలుగు సామాజిక వాడుకకు అనుగుణంగా గౌరవ ఏకవచనం ఉపయోగించబడింది. మూలంలో లేని ‘ఇప్పుడు’ వంటి discourse marker చేర్చలేదు.
