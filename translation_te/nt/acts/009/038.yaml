id: ACT.9.38
reference: Acts 9:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ οἱ μαθηταὶ ἀκούσαντες ὅτι Πέτρος ἐστὶν ἐν αὐτῇ ἀπέστειλαν ⸂δύο ἄνδρας⸃ πρὸς αὐτὸν παρακαλοῦντες· Μὴ ⸀ὀκνήσῃς διελθεῖν ἕως ⸀ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/038.yaml
  text: Since Lydda was near Joppa[a], the disciples, hearing that Peter was there, sent two men to him, urging, “Do not delay to come to us.”
translation:
  language: te
  text: లుద్ద యొప్పేకు దగ్గరగా ఉండడంతో, పేతురు అక్కడ ఉన్నాడని విన్న శిష్యులు ఇద్దరు మనుషులను ఆయన దగ్గరికి పంపి, “మా దగ్గరికి రావడానికి ఆలస్యం చేయకండి[a]” అని వేడుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మా దగ్గరికి రావడానికి సంకోచించకండి.” ఈ క్రియకు ‘సంకోచించడం’ లేదా ‘ఆలస్యం చేయడం’ అనే అర్థాలు ఉండవచ్చు; ఇక్కడి అత్యవసర అభ్యర్థనకు ప్రధాన పాఠంలోని అర్థం సహజంగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ
  choice: లుద్ద యొప్పేకు దగ్గరగా ఉండడంతో
  rationale: Genitive absolute నేపథ్య పరిస్థితిని తెలియజేస్తుంది; శిష్యులు పేతురును పిలిపించడానికి ఆ సమీపతే సందర్భోచిత కారణమని సహజమైన తెలుగులో చూపుతుంది. δέకు విడిగా అనవసరమైన కాలసూచక పదాన్ని చేర్చలేదు.
- source_word: Λύδδας / Ἰόππῃ
  choice: లుద్ద / యొప్పే
  rationale: కొత్త నిబంధన సందర్భంలో గ్రీకు స్థలనామాలకు తెలుగు బైబిలు వాడుకలో గుర్తుపట్టదగిన లిప్యంతరీకరణలు.
- source_word: οἱ μαθηταὶ ἀκούσαντες
  choice: విన్న శిష్యులు
  rationale: Aorist participle ప్రధాన క్రియకు ముందున్న సందర్భాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; μαθηταίకు ‘శిష్యులు’ ప్రామాణికమైన సందర్భోచిత పదం.
- source_word: ὅτι Πέτρος ἐστὶν ἐν αὐτῇ
  choice: పేతురు అక్కడ ఉన్నాడని
  rationale: ἐν αὐτῇ లుద్దను సూచిస్తుంది; తెలుగులో ‘అక్కడ’ సహజంగా అదే స్థానార్థాన్ని అందిస్తుంది.
- source_word: ἀπέστειλαν δύο ἄνδρας πρὸς αὐτόν
  choice: ఇద్దరు మనుషులను ఆయన దగ్గరికి పంపి
  rationale: δύο ἄνδραςలోని సంఖ్యను, పురుషులను సూచించే భావాన్ని నిలుపుతూ, పంపడం మరియు గమ్యాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: παρακαλοῦντες
  choice: వేడుకున్నారు
  rationale: ఇక్కడ παρακαλέω అత్యవసరమైన earnest requestను సూచిస్తుంది; ‘వేడుకున్నారు’ అభ్యర్థన తీవ్రతను అతిశయింపకుండా తెలుపుతుంది.
- source_word: Μὴ ὀκνήσῃς
  choice: ఆలస్యం చేయకండి
  rationale: ὀκνέω ఆలస్యం చేయడం లేదా సంకోచించడం అనే భావాలను కలిగి ఉండగలదు. తక్షణ ప్రయాణ అభ్యర్థనలో ‘ఆలస్యం చేయకండి’ అత్యంత సహజం; గౌరవ ఏకవచన రూపం పేతురుతో తెలుగు సంభాషణకు తగినది.
- source_word: διελθεῖν ἕως ἡμῶν
  choice: మా దగ్గరికి రావడానికి
  rationale: మాట్లాడువారి స్థానం వైపు పేతురు ప్రయాణించడాన్ని సహజమైన తెలుగు దృక్కోణంతో వ్యక్తం చేస్తుంది.
