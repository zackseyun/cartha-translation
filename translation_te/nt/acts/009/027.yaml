revisions:
- from: అయితే బర్నబా అతన్ని తన వెంట తీసుకొని అపొస్తలుల దగ్గరికి తీసుకువెళ్లాడు. దారిలో అతడు ప్రభువును ఎలా చూశాడో, ప్రభువు అతనితో మాట్లాడాడని, దమస్కులో యేసు నామంలో అతడు ఎలా ధైర్యంగా మాట్లాడాడో వారికి వివరించాడు.
  to: అయితే బర్నబా అతన్ని పట్టుకొని అపొస్తలుల దగ్గరికి తీసుకువెళ్లాడు. దారిలో అతడు ప్రభువును ఎలా చూశాడో, ప్రభువు అతనితో మాట్లాడాడని, దమస్కులో యేసు నామంలో అతడు ఎలా ధైర్యంగా మాట్లాడాడో వారికి వివరించాడు.
  rationale: The revision restores the concrete force of ἐπιλαβόμενος with ‘అతన్ని పట్టుకొని,’ removes an added possessive nuance, and avoids the awkward repetition of ‘తీసుకొని ... తీసుకువెళ్లాడు.’ The original sequence, reported-content structure, and ambiguity-free antecedent of ‘ప్రభువు’ are retained.
