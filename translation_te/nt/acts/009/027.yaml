id: ACT.9.27
reference: Acts 9:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ ἐπιλαβόμενος αὐτὸν ἤγαγεν πρὸς τοὺς ἀποστόλους, καὶ διηγήσατο αὐτοῖς πῶς ἐν τῇ ὁδῷ εἶδεν τὸν κύριον καὶ ὅτι ἐλάλησεν αὐτῷ καὶ πῶς ἐν Δαμασκῷ ἐπαρρησιάσατο ἐν τῷ ὀνόματι ⸀τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/027.yaml
  text: But Barnabas took hold of him and brought him to the apostles, and told them how on the road he had seen the Lord, and that he had spoken to him, and how in Damascus he had spoken boldly in the name of Jesus.
translation:
  language: te
  text: అయితే బర్నబా అతన్ని పట్టుకొని అపొస్తలుల దగ్గరికి తీసుకువెళ్లాడు. దారిలో అతడు ప్రభువును ఎలా చూశాడో, ప్రభువు అతనితో మాట్లాడాడని, దమస్కులో యేసు నామంలో అతడు ఎలా ధైర్యంగా మాట్లాడాడో వారికి వివరించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος αὐτὸν
  choice: అతన్ని తన వెంట తీసుకొని
  rationale: ἐπιλαμβάνομαι అనే పదానికి ‘పట్టుకోవడం’ లేదా ‘వెంట తీసుకోవడం’ అనే అర్థాలున్నాయి. సందర్భంలో బర్నబా సౌలును ఆదరించి అపొస్తలుల దగ్గరికి తీసుకెళ్లడం ఉద్దేశం; అందువల్ల తెలుగులో సహజంగా, శత్రుత్వ భావం రాకుండా ‘తన వెంట తీసుకొని’ అని అనువదించాం.
- source_word: ἤγαγεν πρὸς τοὺς ἀποστόλους
  choice: అపొస్తలుల దగ్గరికి తీసుకువెళ్లాడు
  rationale: ἄγω ఇక్కడ ఒకరి దగ్గరికి నడిపించి తీసుకురావడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దగ్గరికి తీసుకువెళ్లాడు’ సహజంగా ఉంటుంది.
- source_word: διηγήσατο αὐτοῖς
  choice: వారికి వివరించాడు
  rationale: διηγέομαι జరిగిన విషయాన్ని వరుసగా లేదా విపులంగా తెలియజేయడాన్ని సూచిస్తుంది. కేవలం ‘చెప్పాడు’ కంటే ‘వివరించాడు’ మూలపద బలాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: πῶς ἐν τῇ ὁδῷ
  choice: దారిలో ... ఎలా
  rationale: ὁδός ఇక్కడ దమస్కుకు వెళ్లే దారిని సూచిస్తుంది; విశ్వాస ఉద్యమానికి వాడే ‘మార్గం’ అనే ప్రత్యేకార్థం కాదు.
- source_word: εἶδεν τὸν κύριον
  choice: ప్రభువును ఎలా చూశాడో
  rationale: κύριοςను దాని క్రీస్తుసంబంధమైన బరువును నిలుపుతూ ‘ప్రభువు’గా అనువదించాం. గ్రీకు భూతకాల క్రియను తెలుగులో నివేదనకు సహజమైన ‘చూశాడో’ రూపంలో ఇచ్చాం.
- source_word: ὅτι ἐλάλησεν αὐτῷ
  choice: ప్రభువు అతనితో మాట్లాడాడని
  rationale: ముందున్న ‘ప్రభువు’నే క్రియకు కర్తగా స్పష్టంగా చూపడానికి తెలుగులో కర్తను మళ్లీ పేర్కొన్నాం; గ్రీకులోని సంబంధాన్ని మార్చలేదు.
- source_word: ἐπαρρησιάσατο
  choice: ధైర్యంగా మాట్లాడాడో
  rationale: παρρησιάζομαι స్వేచ్ఛగా, బహిరంగంగా లేదా ధైర్యంగా మాట్లాడడాన్ని సూచిస్తుంది. ‘ప్రసంగించాడు’ అనే మరింత నిర్దిష్ట భావాన్ని చేర్చకుండా ‘ధైర్యంగా మాట్లాడాడు’ అని ఇచ్చాం.
- source_word: ἐν τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: యేసు నామంలో
  rationale: యేసు అధికారంతోను ఆయనను ప్రకటిస్తూ మాట్లాడడమనే బైబిలు నుడికారాన్ని ‘యేసు నామంలో’ యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: సౌలు దారిలో చూసిన ‘ప్రభువు’ ఎవరు?
  choice: ‘ప్రభువు’ యేసును సూచిస్తుంది
  alternative: సాధారణ దైవసూచనగా ‘ప్రభువు’
  rationale: అపొస్తలుల కార్యాలు 9వ అధ్యాయం తక్షణ సందర్భంలో సౌలు దర్శించినవాడు పునరుత్థానుడైన యేసు. ఈ వచనం చివరలోని ‘యేసు నామంలో’ అనే మాట కూడా ఆ గుర్తింపును బలపరుస్తుంది. అయినా అనువాదంలో మూలంలోని బిరుదునే ‘ప్రభువు’గా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని మూడు నివేదిత అంశాల క్రమాన్ని నిలిపి, తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా కర్తను అవసరమైన చోట స్పష్టం చేశాం.
