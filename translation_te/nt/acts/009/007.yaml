  text: οἱ δὲ ἄνδρες οἱ συνοδεύοντες αὐτῷ εἱστήκεισαν ἐνεοί, ἀκούοντες μὲν τῆς φωνῆς μηδένα δὲ θεωροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/007.yaml
  text: The men traveling with him stood speechless[a], hearing the voice but seeing no one.
translation:
  language: te
  text: అతనితో ప్రయాణిస్తున్న మనుషులు మాట రాక నిలబడి ఉన్నారు; వారు స్వరం[a] వింటూ ఎవరినీ చూడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శబ్దం.” గ్రీకు పదానికి “స్వరం” లేదా “శబ్దం” అనే అర్థాలు రావచ్చు; అపొస్తలుల కార్యాలు 22:9తో పోల్చండి.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄνδρες
  choice: మనుషులు
  rationale: ἄνδρες ఇక్కడ సౌలుతో ప్రయాణిస్తున్న పురుష సహచరులను సూచిస్తుంది. δέ యొక్క స్వల్ప అనుసంధాన భావాన్ని తెలుగు వాక్యప్రవాహంలో ప్రత్యేక పదంతో బలవంతంగా చూపలేదు.
- source_word: οἱ συνοδεύοντες αὐτῷ
  choice: అతనితో ప్రయాణిస్తున్న
  rationale: συνοδεύω ప్రయాణంలో తోడుగా వెళ్లడాన్ని సూచిస్తుంది; ఈ సందర్భంలో ఇది సహజమైన ఆధునిక తెలుగు.
- source_word: εἱστήκεισαν ἐνεοί
  choice: మాట రాక నిలబడిపోయారు
  rationale: εἱστήκεισαν యొక్క నిలిచిన స్థితినీ, ἐνεοί సూచించే మాట్లాడలేని నిశ్శబ్దాన్నీ సహజంగా వ్యక్తపరుస్తుంది; ఆశ్చర్యాన్ని మూలపాఠం కంటే ఎక్కువగా వివరించదు.
- source_word: ἀκούοντες μὲν τῆς φωνῆς
  choice: స్వరం విన్నారు
  rationale: φωνήకు ‘స్వరం’ లేదా ‘శబ్దం’ అనే అర్థాలు సాధ్యమైనప్పటికీ, వ్యక్తికి సంబంధించిన స్వరాన్ని ‘స్వరం’ సన్నిహితంగా ప్రతిబింబిస్తుంది. అపొస్తలుల కార్యాలు 22:9తో కనిపించే ఉద్రిక్తతను ప్రధాన పాఠంలో వివరణాత్మకంగా పరిష్కరించలేదు.
- source_word: μηδένα δὲ θεωροῦντες
  choice: గాని ఎవరినీ చూడలేదు
  rationale: θεωρέω ఇక్కడ ప్రత్యక్షంగా చూడడాన్ని, μηδένα ఏ వ్యక్తీ కనిపించలేదని సూచిస్తాయి; ‘ఎవరినీ చూడలేదు’ సహజమైన తెలుగు.
theological_decisions:
- issue: అపొస్తలుల కార్యాలు 9:7 మరియు 22:9లో సౌలు సహచరులు విన్నదాని గురించి కనిపించే ఉద్రిక్తత
  choice: ప్రధాన పాఠంలో φωνήను ‘స్వరం’గా అనువదించి, ‘శబ్దం’ను పాదటిప్పణిలో ప్రత్యామ్నాయంగా ఇవ్వడం
  alternative: ప్రధాన పాఠంలో ‘శబ్దం’ అని అనువదించి రెండు వచనాలను సమన్వయపరచడం
  rationale: φωνή యొక్క నిజమైన అర్థపరిధిలో ‘స్వరం’, ‘శబ్దం’ రెండూ ఉన్నాయి. మూలంలోని సాధ్యమైన ఉద్రిక్తతను అనువాదంలో నిశ్శబ్దంగా పరిష్కరించకుండా, ప్రధాన అర్థాన్ని ఉంచి ప్రత్యామ్నాయాన్ని స్పష్టంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘మాట రాక’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతూ ἐνεοί భావాన్ని తెలియజేస్తుంది; పాదటిప్పణి గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
