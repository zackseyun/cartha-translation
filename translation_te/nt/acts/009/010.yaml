- from: దమస్కులో అననీయ అనే శిష్యుడు ఒకడు ఉన్నాడు. ప్రభువు దర్శనంలో అతనితో, “అననీయా!” అన్నాడు. అతడు, “ఇదిగో, ప్రభువా! నేను ఇక్కడ ఉన్నాను” అన్నాడు.
