id: ACT.9.10
reference: Acts 9:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἦν δέ τις μαθητὴς ἐν Δαμασκῷ ὀνόματι Ἁνανίας, καὶ εἶπεν πρὸς αὐτὸν ⸂ἐν ὁράματι ὁ κύριος⸃· Ἁνανία. ὁ δὲ εἶπεν· Ἰδοὺ ἐγώ, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/010.yaml
  text: There was a disciple in Damascus named Ananias, and the Lord said to him in a vision, “Ananias.” And he said, “Here I am, Lord.”
translation:
  language: te
  text: 'దమస్కులో అననీయ అనే శిష్యుడు ఒకడు ఉన్నాడు. ప్రభువు దర్శనంలో అతనితో ఇలా అన్నాడు: “అననీయా!” అతడు, “ఇదిగో, ప్రభువా, నేను ఇక్కడ ఉన్నాను” అన్నాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ
  choice: ఉన్నాడు
  rationale: δέ సూచించే స్వల్ప కథన మార్పును తెలుగులో ప్రత్యేక కాలసూచక పదం చేర్చకుండా వాక్యప్రవాహం ద్వారా వ్యక్తం చేశాం; ἦν యొక్క అసంపూర్ణ భూతార్థాన్ని సహజంగా ‘ఉన్నాడు’ అని ఇచ్చాం.
- source_word: τις μαθητὴς
  choice: శిష్యుడు ఒకడు
  rationale: τις అనిర్దిష్టంగా కొత్త వ్యక్తిని పరిచయం చేస్తుంది. ‘ఒకానొక శిష్యుడు’ కంటే ‘శిష్యుడు ఒకడు’ ఆధునిక తెలుగులో సహజంగా ఉండి అనవసరమైన ప్రత్యేక ఉద్ఘాటనను నివారిస్తుంది.
- source_word: ἐν Δαμασκῷ
  choice: దమస్కులో
  rationale: ἐν + దత్తివిభక్తి యొక్క స్థానార్థాన్ని సహజ తెలుగు స్థానవిభక్తితో వ్యక్తం చేశాం.
- source_word: ὀνόματι Ἁνανίας
  choice: అననీయ అనే
  rationale: ὀνόματι అనే నామపరిచయ ప్రయోగాన్ని సంక్షిప్తమైన, సహజమైన తెలుగు రూపంతో అందించాం.
- source_word: ἐν ὁράματι
  choice: దర్శనంలో
  rationale: ప్రభువు అననీయతో మాట్లాడిన సందర్భం లేదా మాధ్యమాన్ని సూచించే గ్రీకు పదబంధాన్ని నేరుగా, సహజంగా అనువదించాం.
- source_word: ὁ κύριος
  choice: ప్రభువు
  rationale: నిర్దిష్ట ఆర్టికల్‌తో ఉన్న κύριος ఇక్కడ పునరుత్థానుడైన యేసును సూచిస్తుంది; తెలుగు బైబిల్ శైలిలో సహజమైన ‘ప్రభువు’ను వాడాం.
- source_word: εἶπεν πρὸς αὐτόν
  choice: అతనితో … అన్నాడు
  rationale: λέγω + πρός నిర్మాణంలోని ప్రత్యక్ష సంభాషణ భావాన్ని సహజ తెలుగు పదక్రమంలో నిలిపాం.
- source_word: Ἁνανία
  choice: అననీయా
  rationale: గ్రీకు సంబోధనా రూపాన్ని తెలుగులో సంబోధన ప్రత్యయంతో స్పష్టంగా చూపించాం.
- source_word: Ἰδοὺ ἐγώ
  choice: ఇదిగో … నేను ఇక్కడ ఉన్నాను
  rationale: ἰδού యొక్క దృష్టి ఆకర్షణను ‘ఇదిగో’తో, సిద్ధతతో స్పందించే సంప్రదాయ ప్రయోగార్థాన్ని ‘నేను ఇక్కడ ఉన్నాను’తో వ్యక్తం చేశాం; కేవలం పదానువాదంగా కాక పూర్తి ప్రతిస్పందన భావం నిలిచేలా చేశాం.
- source_word: κύριε
  choice: ప్రభువా
  rationale: దర్శనంలో మాట్లాడుతున్న ὁ κύριοςకు ఇచ్చిన సంబోధన కావున ‘అయ్యా’ కాక క్రీస్తును సూచించే ‘ప్రభువా’ సముచితం.
theological_decisions:
- issue: దర్శనంలోని ὁ κύριος / κύριε ఎవరిని సూచిస్తున్నాయి
  choice: రెండింటినీ పునరుత్థానుడైన యేసును సూచించే ‘ప్రభువు/ప్రభువా’గా అనువదించడం
  alternative: సాధారణ దైవ సంబోధనగా లేదా ‘అయ్యా’గా అనువదించడం
  rationale: అపొస్తలుల కార్యములు 9లోని సమీప సందర్భం దర్శనంలో మాట్లాడుతున్న ప్రభువును యేసుగా గుర్తిస్తుంది. మూలపాఠాన్ని విస్తరించకుండా ‘ప్రభువు’ అనే అనువాదం క్రీస్తుసంబంధ సూచనను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి. మూలంలో లేని ‘ఇప్పుడు’ వంటి కాలసూచక సంధానపదాన్ని చేర్చలేదు. పాదటిప్పణులు అవసరం లేదు.
