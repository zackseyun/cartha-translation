  to: అతడు, “ప్రభువా,[a] నీవెవరు?” అని అన్నాడు. ఆయన, “నేనే నీవు హింసిస్తున్న యేసును” అని అన్నాడు.
  rationale: The revision keeps the draft’s meaning and its warranted footnote while using a consistent equivalent for εἶπεν and moving “నేనే” forward to represent the emphatic Ἐγώ εἰμι more directly. No interpretive expansion has been added.
