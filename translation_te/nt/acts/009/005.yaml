id: ACT.9.5
reference: Acts 9:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δέ· Τίς εἶ, κύριε; ὁ ⸀δέ· Ἐγώ εἰμι Ἰησοῦς ὃν σὺ διώκεις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/005.yaml
  text: And he said[a], “Who are you, Lord?” And he said, “I am Jesus, whom you are persecuting.”
translation:
  language: te
  text: అతడు, “ప్రభువా,[a] నీవెవరు?” అని అన్నాడు. ఆయన, “నేనే నీవు హింసిస్తున్న యేసును” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అయ్యా.” గ్రీకు κύριε గౌరవపూర్వక సంబోధనగా కూడా వాడవచ్చు; ఇక్కడ ప్రత్యక్షత సందర్భం వల్ల “ప్రభువా” అని అనువదించాం.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: అడిగాడు / చెప్పాడు
  rationale: మూలంలో రెండుసార్లు ఒకే సాధారణ ‘చెప్పు’ క్రియ ఉన్నా, మొదటిది ప్రశ్నను పరిచయం చేస్తుంది కాబట్టి తెలుగులో సహజంగా ‘అడిగాడు’; రెండవది సమాధానాన్ని పరిచయం చేస్తుంది కాబట్టి ‘చెప్పాడు’ అని సందర్భానుసారంగా అనువదించాం.
- source_word: δέ
  choice: అప్పుడు / ఆయన
  rationale: δέ ఇక్కడ స్వల్ప కథన అనుసంధానకం. మొదటి చోట ‘అప్పుడు’ కథన ప్రవాహాన్ని సహజంగా చూపుతుంది; రెండవ చోట తెలుగులో వాక్య అనుసంధానం సహజంగా ఉండేందుకు ప్రత్యేక సంధిపదం లేకుండానే కర్తను వ్యక్తం చేశాం.
- source_word: Τίς εἶ
  choice: నీవెవరు?
  rationale: ప్రశ్నార్థక సర్వనామం, ‘ఉండు’ క్రియల భావాన్ని సంక్షిప్తమైన సహజ తెలుగు ప్రశ్నగా ఇచ్చాం.
- source_word: κύριε
  choice: ప్రభువా
  rationale: సంబోధన విభక్తిని నిలుపుతూ κύριος యొక్క ప్రధాన అర్థమైన ‘ప్రభువు’ను వాడాం. ఈ సందర్భంలో గౌరవ సంబోధన ‘అయ్యా’ కూడా సాధ్యమని పాదసూచికలో తెలిపాం.
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: యేసును నేనే
  rationale: తెలుగు వాక్య నిర్మాణంలో సహజంగా ఉండేందుకు పేరును వాక్యాంత గుర్తింపు నిర్మాణంలో ఉంచి, ἐγώ యొక్క ఉద్ఘాటనను ‘నేనే’ ద్వారా నిలిపాం.
- source_word: ὃν σὺ διώκεις
  choice: నీవు హింసిస్తున్న
  rationale: సంబంధవాచక ఉపవాక్యాన్ని యేసును విశేషించే తెలుగు నిర్మాణంగా ఇచ్చాం. స్పష్టంగా ఉన్న σὺకి అనుగుణంగా ‘నీవు’ను ఉంచి, వర్తమాన కాలంలోని కొనసాగుతున్న శత్రుత్వ చర్యను ‘హింసిస్తున్న’గా తెలిపాం.
theological_decisions:
- issue: తనతో మాట్లాడుతున్నవారు ఎవరో వెల్లడికాకముందు సౌలు κύριε అని సంబోధించడం
  choice: ప్రభువా
  alternative: అయ్యా
  rationale: κύριε అనేది గౌరవార్థక సంబోధనగా కూడా ఉండవచ్చు. అయితే పరలోక ప్రత్యక్షత సందర్భం మరియు వెంటనే వచ్చే యేసు స్వీయ గుర్తింపు దృష్ట్యా ‘ప్రభువా’ ప్రధాన పాఠ్యానికి తగినది; సౌలుకు అప్పటికే సంపూర్ణ అవగాహన ఉందని బలవంతంగా నిర్ధారించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- issue: యేసును హింసించడం అనే గుర్తింపు
  choice: “నీవు హింసిస్తున్న యేసును నేనే” అని నేరుగా నిలిపాం
  alternative: యేసు అనుచరులను హింసిస్తున్నావని వివరణాత్మకంగా మార్చడం
  rationale: మూలపాఠం హింసకు గురవుతున్న వ్యక్తిగా నేరుగా యేసునే పేర్కొంటుంది. సంఘంతో యేసు ఐక్యతపై ఉన్న theological tension‌ను వివరణతో సడలించకుండా యథాతథంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ప్రశ్నలో ‘నీవెవరు?’ అనే సంక్షిప్త రూపం సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది. మూలంలోని ఉద్ఘాటిత ἐγώను ‘నేనే’తో వ్యక్తం చేశాం; వాక్యాన్ని విపులీకరించి సిద్ధాంతార్థాన్ని చేర్చలేదు.
