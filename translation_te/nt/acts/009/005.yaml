    text: లేదా “అయ్యా.” గ్రీకు κύριε గౌరవపూర్వక సంబోధనగా కూడా వాడవచ్చు; ఇక్కడ ప్రత్యక్షత సందర్భం వల్ల “ప్రభువా” అని అనువదించాం.
