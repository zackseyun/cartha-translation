id: ACT.9.31
reference: Acts 9:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂Ἡ μὲν οὖν ἐκκλησία καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας εἶχεν εἰρήνην οἰκοδομουμένη, καὶ πορευομένη τῷ φόβῳ τοῦ κυρίου καὶ τῇ παρακλήσει τοῦ ἁγίου πνεύματος ἐπληθύνετο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/031.yaml
  text: So then the church throughout all Judea and Galilee and Samaria had peace and was being built up[a]; and walking in the fear of the Lord and in the encouragement of the Holy Spirit[b], it was multiplying.
translation:
  language: te
  text: కాబట్టి యూదయ, గలిలయ, సమరయ అంతటా ఉన్న సంఘం శాంతిలో ఉండి బలపరచబడుతూ వచ్చింది[a]. అది ప్రభువు పట్ల భయభక్తులతో నడుచుకుంటూ, పరిశుద్ధాత్మ ప్రోత్సాహంతో[b] సంఖ్యలో పెరుగుతూ వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘సంఘం’ అనే ఏకవచనానికి బదులు ‘సంఘాలు’ అని ఉంది.
    reason: textual_variant
  - marker: b
    text: లేదా ‘పరిశుద్ధాత్మ ఆదరణతో’ లేదా ‘పరిశుద్ధాత్మ ప్రబోధంతో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησία
  choice: సంఘం
  rationale: SBLGNT పాఠంలో ఏకవచనం ఉంది; మూడు ప్రాంతాల్లో విస్తరించి ఉన్న విశ్వాసుల సమూహాన్ని సమష్టిగా సూచించేందుకు ‘సంఘం’ సహజంగా ఉంది. బహువచన పాఠాంతరాన్ని పాదసూచికలో ఉంచాం.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας
  choice: యూదయ, గలిలయ, సమరయ ప్రాంతమంతటా ఉన్న
  rationale: κατά + షష్ఠీ విభక్తి తెలిపే విస్తరణ భావాన్ని ‘ప్రాంతమంతటా’ వ్యక్తం చేస్తుంది; ὅλης భావమూ నిలుస్తుంది.
- source_word: εἶχεν εἰρήνην
  choice: ప్రశాంతంగా ఉండి
  rationale: ఇక్కడ εἰρήνη సంఘం అనుభవించిన శాంతి, కలతలేని స్థితిని సూచిస్తుంది. ‘ప్రశాంతంగా ఉండి’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: οἰκοδομουμένη
  choice: కట్టబడుతూ వచ్చింది
  rationale: వర్తమాన కర్మణి కృదంతంలోని కొనసాగుతున్న ప్రక్రియను, సంఘం కట్టబడుతున్నదనే మూల రూపకాన్ని నిలిపింది.
- source_word: πορευομένη
  choice: నడుచుకుంటూ
  rationale: ఇది కేవలం ప్రయాణాన్ని కాక జీవన ప్రవర్తనను సూచిస్తుంది; తెలుగు బైబిలు భాషలో ‘నడుచుకోవడం’ ఈ రూపకాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: τῷ φόβῳ τοῦ κυρίου
  choice: ప్రభువు పట్ల భయభక్తులతో
  rationale: φόβοςలోని గౌరవపూర్వక భయం, భక్తి భావాలను ‘భయభక్తులు’ సహజంగా తెలియజేస్తుంది; భీతిగా మాత్రమే అపార్థం కాకుండా చూస్తుంది.
- source_word: τῇ παρακλήσει τοῦ ἁγίου πνεύματος
  choice: పరిశుద్ధాత్మ ప్రోత్సాహంతో
  rationale: παράκλησιςకు ప్రోత్సాహం, ఆదరణ, ప్రబోధం అనే భావవ్యాప్తి ఉంది. సందర్భంలోని నిర్మాణం, వృద్ధికి ‘ప్రోత్సాహం’ సరిపోతుంది; ఇతర నిజమైన అవకాశాలు పాదసూచికలో ఉన్నాయి.
- source_word: ἐπληθύνετο
  choice: సంఖ్యలో పెరుగుతూ వచ్చింది
  rationale: అసంపూర్ణ కాలం తెలిపే కొనసాగుతున్న సంఖ్యాత్మక వృద్ధిని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἐκκλησία యొక్క వచనం, పరిధి
  choice: మూడు ప్రాంతాల్లో ఉన్న సమష్టి ఏకవచన ‘సంఘం’
  alternative: పాఠాంతరంలోని బహువచన ‘సంఘాలు’
  rationale: అందించిన విమర్శాత్మక గ్రీకు పాఠం ఏకవచనంలో ఉంది; దానికి అనుగుణంగా కృదంతాలు, క్రియ కూడా ఏకవచనంలో ఉన్నాయి. ముఖ్యమైన బహువచన పాఠాంతరాన్ని పాదసూచికలో తెలిపాం.
- issue: ‘ప్రభువు పట్ల భయం’ భావం
  choice: గౌరవపూర్వక భయభక్తి, విధేయ జీవనం
  alternative: కేవలం భీతి లేదా భయాందోళన
  rationale: బైబిలీయ ప్రయోగంలో ఈ పదబంధం గౌరవం, భక్తి, విధేయతతో కూడిన జీవనాన్ని సూచిస్తుంది. ‘భయభక్తులు’ ఆ విస్తృత భావాన్ని కాపాడుతుంది.
- issue: παράκλησις యొక్క భావం
  choice: ప్రోత్సాహం
  alternative: ఆదరణ లేదా ప్రబోధం
  rationale: పదానికి ఉన్న భావవ్యాప్తిని పూర్తిగా ఒకే అర్థానికి పరిమితం చేయకుండా, సందర్భానికి సహజమైన ‘ప్రోత్సాహం’ ప్రధాన పాఠంలో తీసుకొని మిగతా అవకాశాలను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. ‘కట్టబడుతూ’ మరియు ‘నడుచుకుంటూ’ అనే మూల రూపకాలను నిలిపి, ‘సంఖ్యలో పెరుగుతూ’ ద్వారా వృద్ధి భావాన్ని స్పష్టం చేశాం.
