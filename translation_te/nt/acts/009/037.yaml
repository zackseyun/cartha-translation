source:
  edition: SBLGNT
  text: ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἀσθενήσασαν αὐτὴν ἀποθανεῖν· λούσαντες δὲ ⸂ἔθηκαν αὐτὴν⸃ ἐν ὑπερῴῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/037.yaml
  text: In those days it happened that she became sick and died. After washing her[a], they laid her in an upstairs room.
translation:
  language: te
  text: ఆ రోజుల్లో ఆమె జబ్బుపడి చనిపోయింది. వారు ఆమె దేహాన్ని కడిగిన తర్వాత, పై అంతస్తులోని ఒక గదిలో[a] ఆమెను ఉంచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మేడగదిలో.” గ్రీకు పదం పై అంతస్తులోని ఒక గదిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: ఆ రోజుల్లో ఆమె...
  rationale: ఇది తదుపరి సంఘటనను పరిచయం చేసే గ్రీకు కథన ప్రయోగం. తెలుగులో ‘జరిగిందేమంటే’ అని పదానువాదం చేయడం కంటే, కాలసూచనతో నేరుగా సంఘటనను చెప్పడం సహజంగా ఉంటుంది; δὲ యొక్క స్వల్ప అనుసంధాన భావం సందర్భంలోనే వ్యక్తమవుతుంది.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: ఆ రోజుల్లో
  rationale: గ్రీకు కాలసూచనకు దగ్గరగా ఉండే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: ἀσθενήσασαν αὐτὴν ἀποθανεῖν
  choice: ఆమె జబ్బుపడి చనిపోయింది
  rationale: గ్రీకులోని participle–infinitive నిర్మాణాన్ని తెలుగులో సహజమైన వరుస క్రియలుగా అనువదించి, అనారోగ్యం తర్వాత మరణం సంభవించిన క్రమాన్ని నిలిపింది.
- source_word: λούσαντες
  choice: ఆమె దేహాన్ని కడిగిన తర్వాత
  rationale: Aorist participle ప్రధాన క్రియకు ముందే జరిగిన చర్యను సూచిస్తుంది. మరణానంతర సందర్భం కావడంతో ‘ఆమె దేహాన్ని’ అనడం తెలుగులో అపార్థాన్ని నివారించే సందర్భస్పష్టీకరణ.
- source_word: ἔθηκαν αὐτὴν
  choice: ఆమెను ఉంచారు
  rationale: τίθημι ఇక్కడ ఉంచడం లేదా పరుండబెట్టడం అనే భావం ఇస్తుంది. శరీర భంగిమను గ్రీకు స్పష్టంగా చెప్పనందున ‘ఉంచారు’ అనేది తటస్థంగా ఉంటుంది.
- source_word: ἐν ὑπερῴῳ
  choice: పై అంతస్తులోని ఒక గదిలో
  rationale: ὑπερῷον పై అంతస్తులో ఉన్న గదిని సూచిస్తుంది. గ్రీకు పదం అనిర్దిష్టంగా ఉన్నందున తెలుగులో ‘ఒక గదిలో’ అని ఇచ్చి, ప్రసిద్ధమైన ఏదో నిర్దిష్ట ‘మేడగది’ అనే భావాన్ని రానివ్వలేదు.
theological_decisions:
- issue: ὑπερῴῳ అనే పదాన్ని నిర్దిష్టమైన సంప్రదాయ ‘మేడగది’గా చూపాలా, సాధారణ పై అంతస్తు గదిగా చూపాలా
  choice: పై అంతస్తులోని ఒక గదిలో
  alternative: మేడగదిలో
  rationale: గ్రీకు మూలంలో నిర్దిష్ట ఉపపదం లేదు; పదం కేవలం పై అంతస్తులోని గదిని సూచిస్తుంది. అందువల్ల ఏదైనా ప్రత్యేకంగా తెలిసిన గదిని సూచిస్తున్నట్టు అనవసరంగా భావం చేర్చకుండా సాధారణ స్థలవివరణను ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మరణానంతరం కడిగినది ఆమె దేహమేనని సందర్భానుసారంగా స్పష్టం చేశాం; మూలంలో లేని అంత్యక్రియల వివరాలను చేర్చలేదు.
