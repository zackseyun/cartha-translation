id: ACT.9.32
reference: Acts 9:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ Πέτρον διερχόμενον διὰ πάντων κατελθεῖν καὶ πρὸς τοὺς ἁγίους τοὺς κατοικοῦντας Λύδδα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/032.yaml
  text: As Peter was passing through all of them, he also went down to the saints living in Lydda.
translation:
  language: te
  text: పేతురు అన్ని చోట్లా తిరుగుతూ ఉండగా, లుద్దలో నివసిస్తున్న పరిశుద్ధుల దగ్గరికి కూడా దిగివెళ్లాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διερχόμενον διὰ πάντων
  choice: అన్ని ప్రాంతాల గుండా ప్రయాణిస్తూ
  rationale: అక్షరార్థంగా ‘అందరి గుండా’ అనడం తెలుగులో అసహజంగా, వ్యక్తులను దాటి వెళ్లినట్లు అనిపిస్తుంది. సందర్భంలో పేతురు వివిధ ప్రాంతాల్లోని విశ్వాసుల మధ్య సంచరించాడనే భావాన్ని సహజంగా తెలియజేస్తుంది; πάντων యొక్క సూచన సందర్భాధీనంగానే ఉంటుంది.
- source_word: κατελθεῖν καὶ πρὸς
  choice: దగ్గరికి కూడా వెళ్లాడు
  rationale: καί ఇక్కడ అదనపు గమ్యాన్ని సూచిస్తుంది. κατελθεῖν లోని ‘దిగి వెళ్లడం’ అనే దిశార్థం తెలుగు కథనంలో అవసరం లేకుండా భౌగోళిక ఊహను కలిగించవచ్చు కాబట్టి సాధారణ గమనక్రియతో అనువదించబడింది.
- source_word: τοὺς ἁγίους
  choice: పరిశుద్ధులు
  rationale: లూకా రచనలో యేసు విశ్వాసులను సూచించే స్థిరమైన సమూహపదం; దాని మతపరమైన భావాన్ని నిలుపుతుంది.
- source_word: Λύδδα
  choice: లుద్ద
  rationale: గ్రీకు స్థలనామానికి తెలుగు ధ్వన్యనుకరణ.
theological_decisions:
- issue: τοὺς ἁγίους అనే విశ్వాసుల సంబోధన
  choice: పరిశుద్ధులు
  alternative: దేవుని ప్రజలు / విశ్వాసులు
  rationale: మూలంలోని పవిత్రతకు సంబంధించిన పదాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది; ప్రత్యేక హోదా గల కొందరిని మాత్రమే సూచిస్తుందని అదనంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు Ἐγένετο δὲ ను ప్రత్యేక కాలసూచక ‘ఇప్పుడు’గా కాక కథన నిర్మాణంగా గ్రహించి విడిగా అనువదించలేదు.
