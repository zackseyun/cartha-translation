  text: καὶ εἶδαν αὐτὸν πάντες οἱ κατοικοῦντες Λύδδα καὶ τὸν ⸀Σαρῶνα, οἵτινες ἐπέστρεψαν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/035.yaml
  text: And all those living in Lydda and Sharon saw him[b][a], and they turned to the Lord.
translation:
  language: te
  text: లుద్దలోనూ షారోనులోనూ[a] నివసించే వారందరూ అతనిని చూశారు; వారందరూ ప్రభువు వైపు మళ్లారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘షారోను ప్రాంతంలో’ లేదా ‘షారోను మైదానంలో.’
    reason: lexical_alternative
  - marker: b
    text: ‘ప్రభువు వైపు మళ్లారు’ అనే మాటను ‘ప్రభువు దగ్గరకు తిరిగి వచ్చారు’ అని కూడా అనువదించవచ్చు; మరింత వ్యాఖ్యానాత్మకంగా, ‘ప్రభువు వైపు మారారు’ అని చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδαν
  choice: చూశారు
  rationale: ఇక్కడ ὁράω భూతకాల రూపం స్వస్థత పొందిన ఐనెయను ప్రజలు ప్రత్యక్షంగా చూశారనే సాధారణ దృశ్యగ్రహణాన్ని సూచిస్తుంది.
- source_word: πάντες οἱ κατοικοῦντες
  choice: నివసిస్తున్న వారందరూ
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతం భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: Λύδδα
  choice: లుద్ద
  rationale: గ్రీకు స్థలనామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: τὸν Σαρῶνα
  choice: షారోను
  rationale: ఇది షారోను ప్రాంతం లేదా మైదానాన్ని సూచించే స్థలనామం. ప్రధాన పాఠంలో సంక్షిప్త స్థలనామాన్ని ఉంచి, విస్తృత అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: οἵτινες
  choice: వారు
  rationale: ముందు పేర్కొన్న నివాసుల తదుపరి చర్యను తెలుగులో స్పష్టంగా, సహజంగా కొనసాగిస్తుంది.
- source_word: ἐπέστρεψαν ἐπὶ τὸν κύριον
  choice: ప్రభువు వైపు తిరిగారు
  rationale: పశ్చాత్తాపం, విశ్వాసంతో ప్రభువును ఆశ్రయించే భావాన్ని నిలుపుతూ, ‘మతం మార్చుకున్నారు’ వంటి మరింత వ్యాఖ్యానాత్మక పదజాలాన్ని నివారిస్తుంది.
- source_word: κύριον
  choice: ప్రభువు
  rationale: కొత్త నిబంధనలో κύριος అనే బిరుదుకు సహజమైన తెలుగు సమానార్థకం; మూలంలో లేని ‘యేసు’ అనే పేరును ప్రధాన పాఠానికి జోడించదు.
theological_decisions:
- issue: ‘ప్రభువు’ అనే పదం ఎవరిని సూచిస్తుంది?
  choice: ప్రభువు
  alternative: ప్రభువైన యేసు
  rationale: సందర్భం యేసును బలంగా సూచిస్తున్నప్పటికీ, గ్రీకు పాఠంలో τὸν κύριον మాత్రమే ఉంది. అందువల్ల మూలపాఠంలోని బిరుదునే అనువదించాం.
- issue: ἐπέστρεψαν పదబంధం యొక్క భావబలం
  choice: ప్రభువు వైపు తిరిగారు
  alternative: ప్రభువు దగ్గరకు తిరిగి వచ్చారు; ప్రభువును స్వీకరించి మారుమనస్సు పొందారు
  rationale: ‘తిరిగారు’ అనే రూపం మారుమనస్సు/విశ్వాస స్పందనను వ్యక్తం చేస్తూనే, వారు ఇంతకు ముందు ప్రభువును విడిచారని గానీ, ఒక నిర్దిష్ట సిద్ధాంతపరమైన మార్పు ప్రక్రియ జరిగిందని గానీ అదనంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథనశైలిలో అనువదించబడింది. రెండు స్థలనామాలకు ‘లోనూ’ వాడటం వాటిని సమాంతరంగా చూపుతుంది; సెమికోలన్ దర్శనం మరియు దానికి అనుసరించిన స్పందన మధ్య సన్నిహిత సంబంధాన్ని నిలుపుతుంది.
