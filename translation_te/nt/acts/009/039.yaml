id: ACT.9.39
reference: Acts 9:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Πέτρος συνῆλθεν αὐτοῖς· ὃν παραγενόμενον ἀνήγαγον εἰς τὸ ὑπερῷον, καὶ παρέστησαν αὐτῷ πᾶσαι αἱ χῆραι κλαίουσαι καὶ ἐπιδεικνύμεναι χιτῶνας καὶ ἱμάτια ὅσα ἐποίει μετ’ αὐτῶν οὖσα ἡ Δορκάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/039.yaml
  text: So Peter got up and went with them[a]. When he arrived, they took him up to the upper room, and all the widows stood beside him[c][b], weeping and showing the tunics and garments that Dorcas made while she was with them.
translation:
  language: te
  text: అప్పుడు పేతురు లేచి వారితో వెళ్లాడు. అతడు అక్కడికి చేరుకున్నప్పుడు, వారు అతణ్ణి మేడగదికి తీసుకెళ్లారు. విధవరాళ్లందరూ అతని దగ్గర నిలబడి ఏడుస్తూ, దొర్కా[a] తమతో ఉన్నప్పుడు చేసిన లోపలి వస్త్రాలనూ బయటి వస్త్రాలనూ[b] అతనికి చూపించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: దొర్కా అనేది గ్రీకు పేరు; అపొస్తలుల కార్యాలు 9:36లో ఆమెను తబితా అని కూడా పిలిచారు.
    reason: cross_reference
  - marker: b
    text: ‘లోపలి వస్త్రాలు, బయటి వస్త్రాలు’ అనే మాటలు రెండు వేర్వేరు గ్రీకు వస్త్రపదాలను ప్రతిబింబిస్తాయి; అవి సాధారణంగా శరీరానికి దగ్గరగా ధరించే వస్త్రాలను, వాటిపై ధరించే వస్త్రాలను సూచిస్తాయి.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναστὰς
  choice: లేచి
  rationale: సందేశకుల అభ్యర్థనకు స్పందించి పేతురు బయలుదేరిన చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: συνῆλθεν αὐτοῖς
  choice: వారితో వెళ్లాడు
  rationale: ఈ సందర్భంలో పేతురు సందేశకులతో కలిసి వెళ్లాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: παραγενόμενον
  choice: అతడు అక్కడికి చేరుకున్నప్పుడు
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చేరికను కాలసంబంధ ఉపవాక్యంగా స్పష్టంగా చూపిస్తుంది.
- source_word: ἀνήγαγον εἰς τὸ ὑπερῷον
  choice: వారు అతణ్ణి మేడగదికి తీసుకెళ్లారు
  rationale: పై అంతస్తులోని గదికి తీసుకెళ్లిన స్థలచలనాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: παρέστησαν αὐτῷ
  choice: అతని దగ్గర నిలబడి
  rationale: విధవరాళ్లు పేతురు సమీపంలో నిలిచిన దృశ్యాన్ని చూపిస్తూ, 'అతని ఎదుట' అనే సాధ్యమైన భావాన్ని అతిగా అధికారికం చేయదు.
- source_word: πᾶσαι αἱ χῆραι
  choice: విధవరాళ్లందరూ
  rationale: మొత్తం విధవరాళ్ల సమూహాన్ని ఖచ్చితంగా సూచిస్తుంది.
- source_word: κλαίουσαι
  choice: ఏడుస్తూ
  rationale: కొనసాగుతున్న దుఃఖాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπιδεικνύμεναι
  choice: అతనికి చూపించారు
  rationale: దొర్కా చేసిన వస్త్రాలను పేతురికి చూపుతున్న చర్యను స్పష్టంగా తెలుపుతుంది.
- source_word: χιτῶνας καὶ ἱμάτια
  choice: లోదుస్తులనూ పైవస్త్రాలనూ
  rationale: ప్రాచీన కాలంలోని శరీరానికి దగ్గరగా ధరించే వస్త్రం, దానిపై ధరించే వస్త్రం అనే రెండు వేర్వేరు గ్రీకు పదాల భేదాన్ని నిలుపుతుంది.
- source_word: ὅσα ἐποίει
  choice: చేసిన
  rationale: గ్రీకు imperfect గతంలో కొనసాగిన లేదా పునరావృతమైన పనిని సూచించగలిగినా, తెలుగులో 'చేసిన' సందర్భానుసారంగా సహజంగా ఉండి అలవాటనే భావాన్ని అనవసరంగా నిర్బంధించదు.
- source_word: μετ’ αὐτῶν οὖσα
  choice: తమతో ఉన్నప్పుడు
  rationale: దొర్కా జీవించి వారి సమాజంలో ఉన్న కాలాన్ని విధవరాళ్ల దృష్టికోణానికి అనుగుణంగా సహజంగా తెలియజేస్తుంది.
