source:
  edition: SBLGNT
  text: οὓς συναθροίσας καὶ τοὺς περὶ τὰ τοιαῦτα ἐργάτας εἶπεν· Ἄνδρες, ἐπίστασθε ὅτι ἐκ ταύτης τῆς ἐργασίας ἡ εὐπορία ⸀ἡμῖν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/025.yaml
  text: After gathering them together[a], along with the workmen occupied with such things, he said, “Men, you know that from this business we have our prosperity.
translation:
  language: te
  text: 'అతడు వారిని, అలాగే ఇలాంటి పనులతో సంబంధమున్న పనివారిని సమకూర్చి ఇలా అన్నాడు: “అయ్యలారా, ఈ వ్యాపారం వల్ల మనకు సంపద కలుగుతోందని[a] మీకు తెలుసు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ వృత్తి నుండి మనకు సంపద వస్తోంది.”
    reason: ἐργασίαకు ‘వ్యాపారం,’ ‘వృత్తి,’ ‘పని’ అనే భావాలు, εὐπορίαకు ‘సంపద’ లేదా ‘ఆర్థిక సౌభాగ్యం’ అనే భావాలు సందర్భానుసారంగా సాధ్యమైనందున ఈ ప్రత్యామ్నాయ అనువాదం ఇవ్వబడింది.
lexical_decisions:
- source_word: συναθροίσας
  choice: సమకూర్చి
  rationale: అందరినీ ఒకచోట చేర్చడం అనే భావాన్ని సహజమైన తెలుగు అసమాపక క్రియతో వ్యక్తం చేస్తుంది; ఇది ప్రధాన క్రియకు ముందు జరిగిన చర్యను కూడా నిలుపుతుంది.
- source_word: τοὺς περὶ τὰ τοιαῦτα ἐργάτας
  choice: ఇలాంటి పనులతో సంబంధమున్న పనివారిని
  rationale: ἐργάτας అనే విస్తృతమైన ‘పనివారు’ భావాన్ని ఉంచుతూ, సందర్భం సూచించే సంబంధాన్ని తెలియజేస్తుంది; వారు ఏ ప్రత్యేక శిల్పానికి చెందినవారో గ్రీకు వాక్యాన్ని మించి నిర్దిష్టం చేయదు.
- source_word: Ἄνδρες
  choice: అయ్యలారా
  rationale: సమక్షంలో ఉన్న పురుష సహచరులను ఉద్దేశించిన సంబోధనను ఆధునిక తెలుగులో సహజంగా, గౌరవంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπίστασθε
  choice: మీకు తెలుసు
  rationale: ఇప్పటికే వారికి తెలిసిన విషయాన్ని సూచించే క్రియకు నేరుగా, సహజంగా సరిపోతుంది.
- source_word: ἐκ ταύτης τῆς ἐργασίας
  choice: ఈ వ్యాపారం వల్లనే
  rationale: ఈ వాణిజ్య సందర్భంలో ἐργασία సూచించే ఆదాయదాయక కార్యకలాపాన్ని ‘వ్యాపారం’ స్పష్టంగా తెలియజేస్తుంది; ‘వల్లనే’ మూలం లేదా ఆధారాన్ని నొక్కి చెబుతుంది.
- source_word: ἡ εὐπορία ἡμῖν ἐστιν
  choice: మనకు సంపద కలుగుతోంది
  rationale: εὐπορίαలోని ఆర్థిక సౌభాగ్యం లేదా సంపద భావాన్ని నిలుపుతూ, గ్రీకు దాతృక నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘అయ్యలారా’ పురుషులను ఉద్దేశించిన మూల సంబోధనను సహజంగా నిలుపుతుంది. పాదటిప్పణి గుర్తును దానికి సంబంధించిన ఆర్థిక వాక్యభాగంపైనే ఉంచాం.
