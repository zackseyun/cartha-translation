    issue: Exclusive particle in the main text
    rationale: ‘ఈ వ్యాపారం వల్లనే’ adds ‘alone/only.’ The Greek says that their prosperity comes from this business but does not explicitly make an exclusive claim.
  - severity: low
    issue: Exclusive particle in the footnote alternative
    rationale: ‘ఈ వృత్తి నుంచే’ likewise adds an exclusivity not present in the alternative lexical rendering.
