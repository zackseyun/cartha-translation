id: ACT.19.10
reference: Acts 19:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο ἐπὶ ἔτη δύο, ὥστε πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου, Ἰουδαίους τε καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/010.yaml
  text: This continued for two years[a], so that all who lived in Asia heard the word of the Lord, both Jews and Greeks.
translation:
  language: te
  text: ఇది రెండు సంవత్సరాలపాటు కొనసాగింది; దాంతో ఆసియాలో నివసిస్తున్న వారందరూ—యూదులూ గ్రీకులూ—ప్రభువు వాక్యాన్ని విన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο δὲ ἐγένετο
  choice: ఇది ... కొనసాగింది
  rationale: మునుపటి వచనంలో చెప్పిన బోధనా కార్యం కొంతకాలం కొనసాగిందనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπὶ ἔτη δύο
  choice: రెండు సంవత్సరాలపాటు
  rationale: ἐπίతో కూడిన కాలవ్యవధి భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὥστε
  choice: దాంతో
  rationale: ముందు చెప్పిన నిరంతర కార్యం వల్ల కలిగిన ఫలితాన్ని సూచించే ὥστε యొక్క ఫలితార్థాన్ని నిలుపుతుంది.
- source_word: πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν
  choice: ఆసియా ప్రాంతంలో నివసిస్తున్న వారందరూ
  rationale: κατοικοῦντας యొక్క నివాస భావాన్నీ πάντας యొక్క సమగ్ర పరిధినీ నిలుపుతుంది; 'ప్రాంతం' అనే పదం ఇది ఒక భౌగోళిక పరిపాలనా ప్రాంతమని పాఠకుడికి సహజంగా సూచిస్తుంది, పూర్తి చారిత్రక వివరణను పాదసూచికలో ఇస్తుంది.
- source_word: ἀκοῦσαι
  choice: విన్నారు
  rationale: ὥστε తరువాతి అపరిమిత క్రియ సూచించే ఫలితాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: τὸν λόγον
  choice: వాక్యాన్ని
  rationale: అపొస్తలుల కార్యములలో ప్రకటిత సందేశానికి వాడే λόγος అనే పునరావృత పదబంధపు ధార్మిక, సాహిత్య ఆకృతిని కాపాడుతుంది.
- source_word: τοῦ κυρίου
  choice: ప్రభువు
  rationale: λόγονను విశేషించే షష్ఠీ విభక్తి భావాన్ని 'ప్రభువు వాక్యం' అనే స్థిరమైన, గౌరవప్రదమైన తెలుగు పదబంధంలో అందిస్తుంది.
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: యూదులు, గ్రీకులు
  rationale: τε καὶ కలుపుతున్న రెండు వర్గాలనూ సమగ్రంగా పేర్కొంటుంది; 'వారందరూ'తో కలిపి రెండు వర్గాల చేర్పు స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: Ἀσία అనే స్థలనామం యొక్క పరిధి
  choice: పశ్చిమ ఆసియా మైనరులోని రోమా పరిపాలనా ప్రాంతమైన ఆసియా
  alternative: నేటి ఆసియా ఖండం లేదా మరింత విస్తృతమైన ఆసియా ప్రాంతం
  rationale: అపొస్తలుల కార్యముల చారిత్రక సందర్భంలో Ἀσία సాధారణంగా రోమా పరిపాలనా ప్రాంతాన్ని సూచిస్తుంది. మూలపాఠంలోని పేరును ప్రధాన వచనంలో ఉంచి, కాలభ్రాంతిని నివారించేందుకు పాదసూచికలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. 'ప్రభువు వాక్యం' అనే బైబిలు పదబంధాన్ని నిలుపుతూ, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా ఉంచాం.
