id: ACT.19.35
reference: Acts 19:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καταστείλας δὲ ⸂ὁ γραμματεὺς τὸν ὄχλον⸃ φησίν· Ἄνδρες Ἐφέσιοι, τίς γάρ ἐστιν ⸀ἀνθρώπων ὃς οὐ γινώσκει τὴν Ἐφεσίων πόλιν νεωκόρον οὖσαν τῆς ⸀μεγάλης Ἀρτέμιδος καὶ τοῦ διοπετοῦς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/035.yaml
  text: But after the city clerk had quieted the crowd, he said, “Men of Ephesus, for what man is there who does not know that the city of the Ephesians is temple-keeper of the great Artemis and of the image fallen from heaven?”
translation:
  language: te
  text: 'నగర కార్యదర్శి జనసమూహాన్ని శాంతపరచి ఇలా అన్నాడు: “ఎఫెసు పురుషులారా, ఎఫెసీయుల నగరం గొప్ప అర్తెమి దేవతకూ, ఆకాశం నుండి పడిన ప్రతిమకూ ఆలయ సంరక్షక నగరమని తెలియని మనిషి ఎవడున్నాడు?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταστείλας
  choice: శాంతింపజేసి
  rationale: అయోరిస్టు కృదంతం ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచిస్తుంది; జనసమూహపు అల్లరిని అదుపుచేసి నిశ్శబ్దపరచిన భావాన్ని సహజమైన తెలుగులో ఇస్తుంది.
- source_word: ὁ γραμματεὺς
  choice: నగర కార్యదర్శి
  rationale: ఇక్కడ యూదుల శాస్త్రి కాదు, ఎఫెసు నగర పాలనకు చెందిన ఉన్నత పరిపాలనా అధికారి ఉద్దేశించబడ్డాడు.
- source_word: τὸν ὄχλον
  choice: జనసమూహాన్ని
  rationale: బహిరంగంగా గుమికూడి కల్లోలం చేస్తున్న ప్రజల సమూహాన్ని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: Ἄνδρες Ἐφέσιοι
  choice: ఎఫెసు పురుషులారా
  rationale: ἄνδρες అనే పుంలింగ సంబోధనను తటస్థీకరించకుండా, గౌరవపూర్వక ప్రత్యక్ష సంబోధనగా నిలుపుతుంది.
- source_word: τίς γάρ ἐστιν ἀνθρώπων ὃς οὐ γινώσκει
  choice: తెలియని మనిషి ఎవడున్నాడు?
  rationale: ఎవరికీ తెలియనిది కాదనే వక్తృత్వ ప్రశ్నను, మూలంలోని ఏకవచన మానవ సూచనతో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τὴν Ἐφεσίων πόλιν
  choice: ఎఫెసీయుల నగరం
  rationale: గ్రీకు సంబంధ విభక్తి నిర్మాణాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: νεωκόρον
  choice: ఆలయ సంరక్షకురాలు
  rationale: ఒక ఆలయం లేదా ఆరాధనా వ్యవస్థకు అధికారిక పరిరక్షక నగరమనే పౌర-మతపరమైన హోదాను తెలియజేస్తుంది; నగరం తెలుగులో స్త్రీలింగంగా ఉండడం వల్ల ‘సంరక్షకురాలు’ వాడబడింది.
- source_word: τῆς μεγάλης Ἀρτέμιδος
  choice: మహాదేవత అర్తెమి
  rationale: μεγάλης అనే బిరుదును ‘మహా’ భావంతో, అర్తెమిని దేవతగా పాఠకుడికి సహజంగా గుర్తించగల రూపంలో ఇస్తుంది.
- source_word: τοῦ διοπετοῦς
  choice: ఆకాశం నుండి పడిన ప్రతిమ
  rationale: διοπετής ఆకాశం నుండి పడినదిగా నమ్మబడిన వస్తువును సూచిస్తుంది; సందర్భంలో అర్తెమితో సంబంధమైన ఆరాధనా ప్రతిమ సంభావ్య సూచితం. ‘ఆకాశం’ అనేది ‘జ్యూస్ నుండి’ అనే అనవసర నిర్దిష్టతను నివారిస్తుంది.
theological_decisions:
- issue: అర్తెమి ఆరాధన మరియు διοπετές వస్తువు గురించిన అన్యమత ప్రకటన
  choice: 'వక్త చెప్పిన పౌర-మతపరమైన వాదనగా నేరుగా అనువదించడం: ‘మహాదేవత అర్తెమి ఆలయ సంరక్షకురాలనీ, ఆకాశం నుండి పడిన ప్రతిమకు సంరక్షకురాలనీ.’'
  alternative: ‘మహాదేవత అర్తెమి ఆలయానికి, ఆకాశం నుండి పడిన వస్తువుకు కాపలాదారు’
  rationale: ఇది నగర కార్యదర్శి పలికిన అన్యమత వాదన; కథకుడు దాని సత్యాన్ని సమర్థిస్తున్నాడని సూచించకూడదు. ‘ప్రతిమ’ సందర్భంలోని సంభావ్య సూచితాన్ని స్పష్టం చేస్తుంది, అయితే పాదసూచిక మూలపదంలోని సాధారణ ‘వస్తువు’ భావాన్ని భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; పౌర అధికారికి ‘నగర కార్యదర్శి,’ అధికారిక మతపరమైన హోదాకు ‘ఆలయ సంరక్షకురాలు’ వాడబడ్డాయి. వాక్యం గౌరవపూర్వకంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది; అన్యమత వక్త చెప్పిన విషయాన్ని అనువాదం స్వయంగా సమర్థించదు.
