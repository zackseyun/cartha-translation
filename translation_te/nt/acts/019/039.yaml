id: ACT.19.39
reference: Acts 19:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀περαιτέρω ἐπιζητεῖτε, ἐν τῇ ἐννόμῳ ἐκκλησίᾳ ἐπιλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/039.yaml
  text: But if you seek anything further[a], it will be settled in the lawful assembly.
translation:
  language: te
  text: అయితే, మీరు ఇంతకంటే మరేదైనా కోరుతున్నట్లయితే, అది చట్టబద్ధమైన ప్రజాసభలో[a] పరిష్కరించబడుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చట్టప్రకారం ఏర్పాటైన సభలో’ లేదా ‘క్రమబద్ధమైన సభలో.’ గ్రీకు పదబంధం సంఘాన్ని కాదు, చట్టబద్ధంగా సమావేశమైన పౌరసభను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: περαιτέρω
  choice: ఇంతకంటే మరేదైనా
  rationale: ప్రస్తుత విషయానికి అదనంగా లేదా దానిని మించి ఉన్నదనే తులనాత్మక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπιζητεῖτε
  choice: కోరుతున్నట్లయితే
  rationale: వెదకడం లేదా ఒక విషయాన్ని ముందుకు తీసుకురావడం అనే విస్తృత భావాన్ని ఇక్కడి పౌర-చట్టపరమైన సందర్భంలో సహజంగా తెలియజేస్తుంది; అతిగా న్యాయసాంకేతికమైన అర్థాన్ని రుద్దదు.
- source_word: ἐννόμῳ
  choice: చట్టబద్ధమైన
  rationale: చట్టానికి అనుగుణంగా ఏర్పాటైనదనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐκκλησίᾳ
  choice: ప్రజాసభలో
  rationale: ఇక్కడ క్రైస్తవ సంఘం కాక, ఎఫెసులో చట్టబద్ధంగా సమావేశమైన పౌర సమూహం ఉద్దేశించబడింది. ‘ప్రజాసభ’ ఆ పౌర సందర్భాన్ని స్పష్టం చేస్తూ, ‘న్యాయస్థానం’ అనే అతివ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: ἐπιλυθήσεται
  choice: పరిష్కరించబడుతుంది
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ, విషయం అధికారిక ప్రక్రియలో తీర్చబడుతుందనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: τι
  choice: మరేదైనా
  rationale: షరతు వాక్యంలో అదనంగా ఉండగల ఏ విషయాన్నైనా సూచించే అనిర్దిష్ట భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: క్రైస్తవేతర పౌర సందర్భంలో ἐκκλησία అనువాదం
  choice: ప్రజాసభ
  alternative: సంఘం; సమావేశం
  rationale: సందర్భం ఎఫెసు పట్టణపు చట్టబద్ధ పౌరసభను సూచిస్తుంది, క్రైస్తవ సమాజాన్ని కాదు. అందువల్ల ‘ప్రజాసభ’ మూలపదంలోని సమావేశమైన సమూహం అనే భావాన్ని కాపాడుతూ మతసంఘమనే తప్పుదోవను నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే పౌర-చట్టపరమైన శైలి. ‘ప్రజాసభ’ ద్వారా సందర్భాన్ని స్పష్టం చేసి, మూలంలోని ἐκκλησίαకు అనవసరమైన క్రైస్తవ సంఘార్థం రాకుండా చూశాం.
