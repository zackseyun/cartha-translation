id: ACT.19.5
reference: Acts 19:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ ἐβαπτίσθησαν εἰς τὸ ὄνομα τοῦ κυρίου Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/005.yaml
  text: And when they heard this[a], they were baptized in the name of the Lord Jesus.
translation:
  language: te
  text: వారు అది విన్నప్పుడు, ప్రభువైన యేసు నామంలోనికి[a] బాప్తిస్మం పొందారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, సాంప్రదాయకంగా: ‘ప్రభువైన యేసు నామంలో.’'
    reason: εἰς τὸ ὄνομα అనే గ్రీకు పదబంధానికి సాంప్రదాయకమైన, సహజమైన తెలుగు ప్రత్యామ్నాయాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: వారు అది విన్నప్పుడు
  rationale: ἀκούω క్రియ యొక్క భూతకాల కృదంత రూపం ఇక్కడ కాలసంబంధ భావాన్ని ఇస్తుంది. తెలుగులో సహజంగా ఉండేందుకు ముందటి మాటలను సూచించే ‘అది’ అనే కర్మను స్పష్టంగా చేర్చాం.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ ఇక్కడ స్వల్ప కథన అనుసంధానాన్ని మాత్రమే సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో దాన్ని ప్రత్యేకంగా ‘మరియు’ అని చేర్చకపోయినా సంబంధం స్పష్టంగానే ఉంటుంది.
- source_word: ἐβαπτίσθησαν
  choice: బాప్తిస్మం పొందారు
  rationale: గ్రీకు క్రియలోని కర్మణి భావాన్ని నిలుపుతూ, ఆధునిక తెలుగు క్రైస్తవ వాడుకలో సహజమైన రూపాన్ని ఎంచుకున్నాం.
- source_word: εἰς τὸ ὄνομα
  choice: నామంలోనికి
  rationale: εἰς అనే విభక్త్యర్థక పదంలోని దిశాత్మకమైన ‘లోనికి’ భావాన్ని నిలుపుతుంది; ఇది అనుబంధం లేదా గుర్తింపులోకి ప్రవేశించే సూచనను ముందుగానే ఒకే విధంగా నిర్ణయించకుండా కాపాడుతుంది.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: ప్రభువైన యేసు
  rationale: κύριοςను యేసుకు సంబంధించిన బిరుదుగా ‘ప్రభువు’ అని అనువదించాం; తెలుగు సంబంధ నిర్మాణంలో ‘ప్రభువైన యేసు నామం’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: బాప్తిస్మానికి సంబంధించిన నామ-ప్రయోగం
  choice: ప్రభువైన యేసు నామంలోనికి
  alternative: ప్రభువైన యేసు నామంలో
  rationale: మూలంలో εἰς τὸ ὄνομα ఉంది. ‘నామంలోనికి’ దాని దిశాత్మక భావాన్ని నిలుపుతుంది; అయితే తెలుగులో సాంప్రదాయకంగా, మరింత సహజంగా వినిపించే ‘నామంలో’ అనే రూపాన్ని పాదసూచికలో ఇచ్చాం. తరువాతి ఆచారపద్ధతులతో వాక్యాన్ని సమన్వయపరచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని కర్మణి నిర్మాణం, కాలసంబంధ కృదంత భావం, εἰς యొక్క దిశాత్మకత సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
