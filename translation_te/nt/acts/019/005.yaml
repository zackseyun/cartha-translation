  verdict: approve
  source_fidelity: ἀκούσαντες is accurately conveyed by “వారు అది విన్నప్పుడు,” with the implied object supplied naturally from the preceding context. The aorist passive ἐβαπτίσθησαν is suitably represented by “బాప్తిస్మం పొందారు.” “ప్రభువైన యేసు నామంలోనికి” preserves the marked directional force of εἰς τὸ ὄνομα without resolving its theological implications beyond the Greek wording.
  naturalness: The verse is clear, grammatical, and appropriately formal in modern standard Telugu. “బాప్తిస్మం పొందారు” is established, natural Christian Telugu usage. Although “నామంలోనికి” is more marked than the customary “నామంలో,” it is intelligible and deliberately reflects the source construction; the footnote supplies the more idiomatic traditional alternative.
  terminology: “ప్రభువైన యేసు” accurately renders τοῦ κυρίου Ἰησοῦ in a natural Telugu genitive/attributive construction. “బాప్తిస్మం” and “ప్రభువు” are appropriate established theological terms. The footnote correctly identifies “నామంలో” as an alternative rendering of εἰς τὸ ὄνομα and does not impose a doctrinal interpretation.
