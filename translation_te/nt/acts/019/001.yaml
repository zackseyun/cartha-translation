id: ACT.19.1
reference: Acts 19:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ Παῦλον διελθόντα τὰ ἀνωτερικὰ μέρη ⸀ἐλθεῖν εἰς Ἔφεσον καὶ ⸀εὑρεῖν τινας μαθητάς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/001.yaml
  text: It happened that while Apollos was in Corinth[a], Paul passed through the inland regions and came to Ephesus and found some disciples[b],
translation:
  language: te
  text: 'అపొల్లో కొరింథులో ఉన్నప్పుడు ఇలా జరిగింది: పౌలు లోపలి ప్రాంతాల గుండా[a] ప్రయాణించి ఎఫెసుకు వచ్చి, కొందరు శిష్యులను[b] కనుగొన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఎగువ ప్రాంతాల గుండా,’ ‘అంతర్భాగ ప్రాంతాల గుండా.’ ఈ మాట తీరమార్గానికి బదులుగా ఎత్తైన అంతర్భాగం గుండా వెళ్లే మార్గాన్ని సూచించి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘శిష్యులు’ ఎవరి శిష్యులో చెప్పబడలేదు; తరువాతి వచనాలు వారు యోహాను బాప్తిస్మంతో సంబంధం కలిగినవారని సూచిస్తాయి.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ఇలా జరిగింది
  rationale: ఇది లూకా వాడే కథన పరివర్తన సూత్రం. ‘ఇలా జరిగింది’ అనే రూపం δέ యొక్క స్వల్ప కథన మార్పును సందర్భంలో సహజంగా మోస్తుంది; మూలంలో లేని స్పష్టమైన కాలసూచక ‘ఇప్పుడు’ను చేర్చదు.
- source_word: ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ
  choice: అపొల్లో కొరింథులో ఉన్నప్పుడు
  rationale: ἐν τῷ తో కూడిన ఆర్టిక్యులర్ ఇన్ఫినిటివ్ సమకాలీనతను సూచిస్తుంది. ఈ తెలుగు రూపం దానిని సహజంగా తెలియజేస్తుంది.
- source_word: διελθόντα
  choice: ప్రయాణించి
  rationale: పౌలు ఆ ప్రాంతాల గుండా వెళ్లిన చర్య ప్రధాన క్రియకు ముందుగా జరిగినదని ఏకకాలంలో సహజమైన క్రమంతో తెలుపుతుంది; ‘గుండా’ అనేది διέρχομαι లోని ‘దాటి వెళ్లడం’ భావాన్ని మోస్తుంది.
- source_word: τὰ ἀνωτερικὰ μέρη
  choice: లోపలి ప్రాంతాలు
  rationale: ἀνωτερικός అక్షరార్థంగా ‘ఎగువ’ అని ఉండగలిగినా, ఇక్కడ తీరమార్గానికి భిన్నమైన అంతర్భాగ లేదా ఎత్తైన దేశమార్గాన్ని సూచించే అవకాశం ఉంది. ‘లోపలి ప్రాంతాలు’ ప్రధాన భౌగోళిక భావాన్ని స్పష్టంగా ఇస్తుంది; ప్రత్యామ్నాయాలు పాదసూచికలో నిలుపబడ్డాయి.
- source_word: ἐλθεῖν εἰς Ἔφεσον
  choice: ఎఫెసుకు వచ్చాడు
  rationale: పట్టణం వైపు పౌలు చేసిన గమనాన్ని సరళమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καὶ εὑρεῖν
  choice: అక్కడ అతనికి ... కనిపించారు
  rationale: సమన్వయ ఇన్ఫినిటివ్‌ను సహజ తెలుగు కథన వాక్యంగా మార్చింది. ‘అక్కడ’ అనేది ఎఫెసులో జరిగిన కనుగొనడాన్ని స్పష్టం చేస్తుంది గాని కొత్త స్థల సమాచారాన్ని చేర్చదు.
- source_word: τινας μαθητάς
  choice: కొందరు శిష్యులు
  rationale: τινας యొక్క అనిర్దిష్టతను ‘కొందరు’ నిలుపుతుంది; μαθητάς కు సాధారణ కొత్త నిబంధన పదమైన ‘శిష్యులు’ వాడబడింది.
theological_decisions:
- issue: μαθητάς అనే వారి గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో నిర్దిష్టీకరించకుండా ‘శిష్యులు’ అని మాత్రమే అనువదించడం
  alternative: ‘యోహాను శిష్యులు’ లేదా ‘యేసు శిష్యులు’ అని స్పష్టీకరించడం
  rationale: గ్రీకు వాక్యం వారి గురువు ఎవరో చెప్పదు. తరువాతి వచనాలు వారు యోహాను బాప్తిస్మంతో సంబంధం కలిగినవారని తెలియజేస్తాయి; ఆ సమాచారాన్ని ఈ వచనంలో ముందుగానే చేర్చకుండా అసలు పాఠ్యంలోని అనిశ్చితిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కథన శైలి వాడబడింది. గ్రీకు దీర్ఘ నిర్మాణాన్ని తెలుగులో సహజత కోసం రెండు వాక్యాలుగా విభజించినప్పటికీ, సంఘటనల క్రమం మరియు భావ సంబంధం నిలుపబడ్డాయి. పాదసూచిక [a] అది వివరిస్తున్న ‘లోపలి ప్రాంతాలు’ అనే పదబంధం వెంట ఉంచబడింది.
