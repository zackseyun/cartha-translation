revisions:
- from: 'అపొల్లో కొరింథులో ఉన్నప్పుడు ఇలా జరిగింది: పౌలు లోపలి ప్రాంతాల గుండా[a] ప్రయాణించి ఎఫెసుకు వచ్చాడు. అక్కడ అతనికి కొందరు శిష్యులు[b] కనిపించారు.'
  to: 'అపొల్లో కొరింథులో ఉన్నప్పుడు ఇలా జరిగింది: పౌలు లోపలి ప్రాంతాల గుండా[a] ప్రయాణించి ఎఫెసుకు వచ్చి, కొందరు శిష్యులను[b] కనుగొన్నాడు.'
