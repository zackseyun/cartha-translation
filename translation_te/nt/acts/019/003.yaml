  terminology: ‘బాప్తిస్మం’ is the established Telugu term and appropriately retains the source term’s reference to John’s rite. ‘యోహాను బాప్తిస్మం’ naturally conveys Ἰωάννου βάπτισμα. The audit-trail lexical alternative is retained with an anchored Telugu footnote.
