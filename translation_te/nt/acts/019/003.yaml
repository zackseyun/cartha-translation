id: ACT.19.3
reference: Acts 19:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπέν ⸀τε· Εἰς τί οὖν ἐβαπτίσθητε; οἱ δὲ εἶπαν· Εἰς τὸ Ἰωάννου βάπτισμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/003.yaml
  text: And he said[a], “Into what then were you baptized?” And they said, “Into John's baptism.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “అయితే మీరు దేనిలోకి బాప్తిస్మం పొందారు?” వారు, “యోహాను బాప్తిస్మంలోకి[a],” అన్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యోహాను యొక్క బాప్తిస్మంలోకి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπέν τε
  choice: అతడు ... అని అడిగాడు
  rationale: τε ముందున్న సంభాషణతో స్వల్ప అనుసంధానాన్ని ఇస్తుంది; తెలుగులో ప్రత్యేక సంధానపదం లేకుండానే అది సహజంగా వ్యక్తమవుతుంది. λέγω సాధారణంగా ‘అన్నాడు’ అయినా, ఇక్కడ ప్రత్యక్ష ప్రశ్న ఉన్నందున ‘అడిగాడు’ సహజమైన భావసమానతను ఇస్తుంది.
- source_word: Εἰς τί οὖν
  choice: అయితే ... దేనిలోకి
  rationale: οὖν యొక్క నిర్ధారణాత్మక సంభాషణా సంబంధాన్ని ‘అయితే’ తెలియజేస్తుంది. εἰς యొక్క దిశ/సంబంధ భావాన్ని ‘లోకి’తో నిలిపి, ప్రశ్నకూ జవాబుకూ ఉన్న గ్రీకు సమాంతరతను కాపాడింది.
- source_word: ἐβαπτίσθητε
  choice: బాప్తిస్మం పొందారు
  rationale: గ్రీకు క్రియ కర్మణి రూపంలో ఉంది. ఆధునిక ప్రామాణిక తెలుగులో ‘బాప్తిస్మం పొందారు’ సహజంగా ఉండి ఆ భావాన్ని నిలుపుతుంది.
- source_word: Εἰς τὸ Ἰωάννου βάπτισμα
  choice: యోహాను బాప్తిస్మంలోకి
  rationale: Ἰωάννου అనే సంబంధవిభక్తి రూపాన్ని సహజమైన తెలుగు నామసమాసంతో ఇచ్చింది. పునరుక్తమైన εἰς ను ‘లోకి’గా ఉంచి ప్రశ్న–జవాబు సమాంతరతను కాపాడింది.
- source_word: βάπτισμα
  choice: బాప్తిస్మం
  rationale: ఈ ఆచారానికి స్థిరపడిన, విస్తృతంగా అర్థమయ్యే తెలుగు పదం; సందర్భంలో యోహానుతో సంబంధమున్న బాప్తిస్మాన్నే సూచిస్తుంది.
theological_decisions:
- issue: ప్రశ్నలోనూ జవాబులోనూ పునరుక్తమైన εἰς ను నిలుపాలా
  choice: రెండు చోట్లా ‘లోకి’ అని అనువదించడం
  alternative: ‘ఏ బాప్తిస్మం పొందారు?’ / ‘యోహాను బాప్తిస్మం’ అని మరింత నుడికారంగా అనువదించడం
  rationale: ‘లోకి’ అనే రూపం మూలంలోని పదప్రయోగాన్నీ ప్రశ్న–జవాబు సమాంతరతనూ నిలుపుతుంది; అదే సమయంలో బాప్తిస్మం గురించి ఏ ప్రత్యేక మతశాఖ సిద్ధాంతాన్నీ అనువాదంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన సంభాషణా శైలి. మూలంలోని సంక్షిప్త జవాబు మరియు ‘లోకి’ సమాంతరత ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి.
