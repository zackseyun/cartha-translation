id: ACT.19.34
reference: Acts 19:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπιγνόντες δὲ ὅτι Ἰουδαῖός ἐστιν φωνὴ ἐγένετο μία ἐκ πάντων ⸀ὡς ἐπὶ ὥρας δύο κραζόντων· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/034.yaml
  text: But when they recognized that he was a Jew[a], one voice arose from them all, crying out for about two hours, “Great is Artemis of the Ephesians!”
translation:
  language: te
  text: అయితే అతడు యూదుడని[a] వారు గుర్తించినప్పుడు, వారందరి నుండి ఒకే స్వరం లేచింది; వారు సుమారు రెండు గంటలపాటు, “ఎఫెసీయుల అర్తెమిస్ గొప్పది!” అని కేకలు వేస్తూనే ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదయవాడు.” గ్రీకు పదం యూదుడిని లేదా యూదయ ప్రాంతానికి చెందినవాడిని సూచించగలదు; ఇక్కడ జాతి-మతపరమైన విస్తృత అర్థమే ఎక్కువ సంభావ్యం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: వారు గుర్తించినప్పుడు
  rationale: అయోరిస్టు కృదంతం ముందుగా జరిగిన గుర్తింపును సూచిస్తుంది; సందర్భంలో అలెగ్జాండరు గుర్తింపును జనసమూహం తెలుసుకున్న భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వాక్యంలో అతడు మాట్లాడబోయిన దానికి విరుద్ధంగా జరిగిన మలుపును సూచిస్తుంది.
- source_word: Ἰουδαῖός
  choice: యూదుడు
  rationale: ఎఫెసు వంటి ప్రవాస సందర్భంలో భౌగోళికంగా ‘యూదయవాడు’ అనే అర్థం కన్నా జాతి-మత గుర్తింపైన ‘యూదుడు’ అనే అర్థమే ఎక్కువ సంభావ్యం.
- source_word: φωνὴ ἐγένετο μία ἐκ πάντων
  choice: వారందరూ ఏకకంఠంతో
  rationale: గ్రీకు నుడికారంలోని ‘అందరి నుండి ఒకే స్వరం’ అనే ఐక్య కేక భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ὡς ἐπὶ ὥρας δύο
  choice: సుమారు రెండు గంటలపాటు
  rationale: ὡς కాలపరిమాణాన్ని సుమారుగా సూచిస్తున్నందున ఖచ్చితంగా రెండు గంటలు అని కాకుండా ‘సుమారు’ అని అనువదించబడింది.
- source_word: κραζόντων
  choice: కేకలు వేస్తూనే ఉన్నారు
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న గట్టిపిలుపు భావాన్ని, దీర్ఘకాలంగా సాగిన జనసమూహపు నినాదానికి తగిన రీతిలో వ్యక్తం చేస్తుంది.
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: ఎఫెసీయుల అర్తెమి మహాదేవత!
  rationale: ఇది దేవతను కీర్తించే నినాదం. ‘గొప్పది’ అనే కృత్రిమ నిర్మాణం కంటే ‘మహాదేవత’ తెలుగులో నినాదంగా సహజంగా ఉండి, Μεγάλη యొక్క మహత్త్వ భావాన్ని నిలుపుతుంది; Ἐφεσίων అనుబంధాన్ని ‘ఎఫెసీయుల’గా ఉంచుతుంది.
theological_decisions:
- issue: Ἰουδαῖος పదం యొక్క అర్థం
  choice: యూదుడు
  alternative: యూదయవాడు
  rationale: ఇక్కడ జనసమూహం స్పందించింది అలెగ్జాండరు యొక్క జాతి-మత గుర్తింపుకే అని సందర్భం సూచిస్తుంది; అతడు యూదయ ప్రాంతానికి చెందినవాడని ప్రత్యేకంగా చెప్పడం లేదు. అయినా గ్రీకు పదానికి భౌగోళిక అర్థం కూడా సాధ్యమైనందున దాన్ని పాదసూచికలో ఉంచాం.
- issue: అర్తెమి గురించి ప్రశంసా నినాదం
  choice: మహాదేవత
  alternative: గొప్పది
  rationale: మూలంలోని Μεγάλη అర్తెమి మహత్త్వాన్ని ప్రకటిస్తుంది. ‘మహాదేవత’ అనేది వక్తల ప్రశంసను నివేదించే అనువాదమే గాని, అనువాదకుని సమ్మతి కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. జనసమూహపు ఐక్యమైన, నిరంతర నినాదాన్ని సహజంగా వినిపించేందుకు ‘ఏకకంఠంతో’ మరియు ‘కేకలు వేస్తూనే ఉన్నారు’ ఎంచుకున్నాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత పదానికే జతచేయబడింది.
