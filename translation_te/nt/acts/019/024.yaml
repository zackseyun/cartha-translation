translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని వివరణాత్మక γάρ, అసంపూర్ణ భూతకాలపు కొనసాగింపు భావం, అలాగే οὐκ ὀλίγην అనే అల్పోక్తి నిలుపబడ్డాయి. అర్తెమి అనే గ్రీకు దేవత పేరు రోమన్ సమానార్థకమైన ‘దయానా’గా మార్చకుండా లిప్యంతరీకరించబడింది.
