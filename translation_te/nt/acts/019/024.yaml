- from: ఎందుకంటే, దేమేత్రియ అనే ఒక వెండిపని వాడు అర్తెమి దేవతకు చెందిన వెండి ఆలయ నమూనాలను[a] తయారుచేస్తూ, చేతిపని వారికి తక్కువేమీ కాని వ్యాపారాన్ని[b] కల్పించేవాడు.
