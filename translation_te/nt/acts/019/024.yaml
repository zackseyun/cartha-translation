id: ACT.19.24
reference: Acts 19:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Δημήτριος γάρ τις ὀνόματι, ἀργυροκόπος, ποιῶν ναοὺς ἀργυροῦς Ἀρτέμιδος παρείχετο τοῖς τεχνίταις ⸂οὐκ ὀλίγην ἐργασίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/024.yaml
  text: For a certain man named Demetrius[a], a silversmith who made silver shrines of Artemis[b], was providing the craftsmen with no small business.
translation:
  language: te
  text: ఎందుకంటే, దేమేత్రియు అనే ఒక వెండికమ్మరి అర్తెమిస్‌కు వెండి దేవాలయాలను[a] తయారుచేస్తూ, శిల్పులకు గణనీయమైన వ్యాపారాన్ని[b] కల్పించేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అర్తెమిస్‌కు వెండి పుణ్యస్థలాలను.” గ్రీకులో ναούς అంటే “దేవాలయాలు.” ఈ సందర్భంలో అర్తెమిస్ ఆరాధనకు సంబంధించిన చిన్న వెండి వస్తువులను, బహుశా దేవాలయ ప్రతిరూపాలను, ఇది సూచించి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “తక్కువ కాని వ్యాపారం.” ఇది గణనీయమైన పని, వ్యాపారం, లేదా ఆదాయం అనే భావాన్ని ఇచ్చే అల్పోక్తి.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి కథనానికి కారణం లేదా నేపథ్యం తెలిపే అనుసంధాన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: Δημήτριος ... ὀνόματι
  choice: దేమేత్రియ అనే
  rationale: వ్యక్తి పేరును గ్రీకు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించి, ὀνόματι అనే నామపరిచయ ప్రయోగాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: ἀργυροκόπος
  choice: వెండిపని వాడు
  rationale: వెండితో వస్తువులు తయారుచేసే నైపుణ్య వృత్తిదారుని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: ναοὺς ἀργυροῦς Ἀρτέμιδος
  choice: అర్తెమి దేవతకు చెందిన వెండి ఆలయ నమూనాలను
  rationale: ναός యొక్క ఆలయం/దేవాలయం అనే ప్రాథమిక భావాన్ని ఉంచుతూ, వాణిజ్య సందర్భంలో ఇవి చిన్నగా తయారుచేసిన ఆలయ ప్రతిరూపాలు కావచ్చనే భావాన్ని సహజంగా తెలియజేస్తుంది; ఖచ్చిత రూపంపై ఉన్న అనిశ్చితిని పాదసూచికలో నిలుపుతుంది.
- source_word: παρείχετο
  choice: కల్పించేవాడు
  rationale: అసంపూర్ణ భూతకాల క్రియలోని నిరంతర లేదా అలవాటైన కార్యభావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοῖς τεχνίταις
  choice: చేతిపని వారికి
  rationale: నైపుణ్యంతో వస్తువులు తయారుచేసే వృత్తిదారులను విస్తృతంగా సూచిస్తుంది; వారు కేవలం వెండిపని వారేనని మూలం చెప్పనందున అలా పరిమితం చేయదు.
- source_word: οὐκ ὀλίγην ἐργασίαν
  choice: తక్కువేమీ కాని వ్యాపారాన్ని
  rationale: గ్రీకు అల్పోక్తి రూపాన్ని నిలుపుతూ, ἐργασία యొక్క వాణిజ్య సందర్భార్థాన్ని తెలియజేస్తుంది.
