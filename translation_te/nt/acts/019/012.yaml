  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥστε καὶ ἐπὶ τοὺς ἀσθενοῦντας ⸀ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ σουδάρια ἢ σιμικίνθια καὶ ἀπαλλάσσεσθαι ἀπ’ αὐτῶν τὰς νόσους, τά τε πνεύματα τὰ πονηρὰ ⸀ἐκπορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/012.yaml
  text: so that even handkerchiefs or work aprons were carried away from his body to the sick[a], and the diseases left them[b], and the evil spirits went out.
translation:
  language: te
  text: దాని ఫలితంగా, అతని శరీరం నుండి[a] చేతిరుమాళ్లను లేదా పని చేసేటప్పుడు కట్టుకునే ముందాసలను[b] రోగుల దగ్గరికి తీసుకెళ్లబడేవి; రోగాలు వారిని విడిచిపోయేవి, దుష్టాత్మలు కూడా బయటికి వెళ్లిపోయేవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో మరింత అక్షరార్థంగా, “అతని చర్మం నుంచి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఏప్రన్లు.” ఈ గ్రీకు పదం పని చేసేటప్పుడు ధరించే వస్త్రాలను లేదా ముందాసలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: దాని ఫలితంగా
  rationale: ముందటి వచనంలో చెప్పిన అసాధారణ అద్భుతాల ఫలితాన్ని పరిచయం చేసే వరుస భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπὶ τοὺς ἀσθενοῦντας
  choice: రోగుల దగ్గరికి
  rationale: అనారోగ్యంతో ఉన్నవారి వైపు వస్తువులను తీసుకెళ్లిన కదలికను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀποφέρεσθαι
  choice: తీసుకెళ్లినప్పుడు
  rationale: వస్తువులు అతని దగ్గర నుంచి రోగుల వద్దకు తరలించబడ్డాయనే భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది; ఎవరు తీసుకెళ్లారో మూలపాఠం చెప్పనందున అనవసరంగా కర్తను చేర్చదు.
- source_word: ἀπὸ τοῦ χρωτὸς αὐτοῦ
  choice: అతని శరీరానికి తగిలిన
  rationale: χρώς అక్షరార్థంగా చర్మాన్ని సూచించినా, ఈ సందర్భంలో వస్త్రాలు అతని దేహానికి తగిలి ఉన్నాయనే భావాన్ని సహజంగా తెలుపుతుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: σουδάρια
  choice: చేతిరుమాళ్లు
  rationale: చెమటను లేదా ముఖాన్ని తుడుచుకోవడానికి ఉపయోగించే చిన్న వస్త్రాలకు సాధారణంగా అర్థమయ్యే సమానార్థకం.
- source_word: σιμικίνθια
  choice: పని చేసేటప్పుడు కట్టుకునే ముందాసలు
  rationale: శారీరక పని సమయంలో ధరించే ఏప్రన్ లేదా పని వస్త్రం అనే ప్రత్యేక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀπαλλάσσεσθαι
  choice: విడిచిపోయేవి
  rationale: రోగాలు ఆ వ్యక్తుల నుంచి తొలగిపోయాయనే మూలపాఠ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: νόσους
  choice: రోగాలు
  rationale: బహువచనంలోని వ్యాధులు లేదా అనారోగ్యాలను సాధారణ ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: πνεύματα τὰ πονηρά
  choice: దుష్టాత్మలు
  rationale: హానికరమైన ఆత్మీయ సత్తలను సూచించే స్థిరమైన, స్పష్టమైన తెలుగు పదం.
- source_word: ἐκπορεύεσθαι
  choice: బయటికి వెళ్లిపోయేవి
  rationale: ఆత్మలు బాధితుల నుంచి నిష్క్రమించాయనే సాధారణ నూతన నిబంధన భావాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: పౌలు శరీరానికి తగిలిన వస్త్రాల ద్వారా జరిగిన స్వస్థతలు, దయ్యాల నిష్క్రమణ స్వభావం
  choice: కథనం తెలిపిన అద్భుత సంఘటనను ఎలాంటి అదనపు సిద్ధాంత వివరణ లేకుండా నేరుగా అనువదించడం
  alternative: దీనిని పవిత్ర అవశేషాల ఆరాధనకు మద్దతుగా చూపడం లేదా కేవలం ప్రతీకాత్మక సంఘటనగా తగ్గించడం
  rationale: మూలపాఠం వస్త్రాలు రోగుల వద్దకు తీసుకెళ్లబడినప్పుడు జరిగిన ఫలితాలను మాత్రమే వివరిస్తుంది. అది ఏ విధమైన యాంత్రిక లేదా మతాచార సిద్ధాంతాన్నీ వివరించదు; అందువల్ల అనువాదం ఆ ఉద్రిక్తతను అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని ఫలితార్థాన్ని నిలుపుతూ, తెలుగులో అసహజమైన వరుస నిష్క్రియ క్రియారూపాలను నివారించింది. రెండు పాదసూచిక గుర్తులూ సంబంధిత ప్రధాన పాఠ భాగాల వద్ద ఉన్నాయి.
