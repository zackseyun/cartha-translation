  text: οὕτως κατὰ κράτος ⸂τοῦ κυρίου ὁ λόγος⸃ ηὔξανεν καὶ ἴσχυεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/020.yaml
  text: So the word of the Lord was growing mightily and prevailing[a].
translation:
  language: te
  text: ఈ విధంగా ప్రభువు వాక్యం మహా శక్తితో విస్తరిస్తూ, ప్రబలుతూ వచ్చింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మహా శక్తితో’ అనే మాటను ‘బలంగా’ లేదా ‘శక్తివంతంగా’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: ఈ విధంగా
  rationale: ముందు వివరించిన సంఘటనల ఫలితాన్ని సూచిస్తుంది; గ్రీకు పదంలోని ‘ఇలా/ఈ విధంగా’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: κατὰ κράτος
  choice: మహా శక్తితో
  rationale: ఈ నానుడి బలం, శక్తి, ప్రభావవంతమైన పురోగతి అనే భావాన్ని ఇస్తుంది. క్రియలైన ‘విస్తరిస్తూ, ప్రబలుతూ’ రెండింటికీ సహజంగా అన్వయించేలా నామవాచక ఆధారిత భావాన్ని నిలిపింది.
- source_word: τοῦ κυρίου
  choice: ప్రభువు
  rationale: గ్రీకులో ఉన్న బిరుదును నేరుగా అనువదిస్తుంది. సందర్భం యేసును సూచించినప్పటికీ, మూలపాఠంలో లేని ‘యేసు’ అనే పేరును ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: ὁ λόγος
  choice: వాక్యం
  rationale: ఇక్కడ ప్రకటించబడిన సందేశాన్ని సూచిస్తుంది; అపొస్తలుల కార్యములలో పునరావృతమయ్యే ‘ప్రభువు వాక్యం’ అనే వ్యక్తీకరణను నిలుపుతుంది.
- source_word: ηὔξανεν
  choice: విస్తరిస్తూ వచ్చింది
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే నిరంతర పురోగతిని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది. సందేశం విషయంలో ‘విస్తరించడం’ అనేది ‘పెరగడం’ కంటే స్పష్టంగా ఉంటుంది.
- source_word: ἴσχυεν
  choice: ప్రబలుతూ వచ్చింది
  rationale: బలంగా ఉండడం, ప్రభావం చూపడం, పైచేయి సాధించడం అనే సందర్భోచిత భావాన్ని వ్యక్తపరుస్తూ, కొనసాగుతున్న చర్యను నిలుపుతుంది.
theological_decisions:
- issue: τοῦ κυρίου లో ‘ప్రభువు’ ఎవరిని సూచిస్తున్నాడు?
  choice: ప్రధాన పాఠ్యంలో ‘ప్రభువు’ అని మాత్రమే ఉంచడం
  alternative: ‘ప్రభువైన యేసు’
  rationale: సందర్భం ప్రభువైన యేసును బలంగా సూచించినప్పటికీ, గ్రీకు పాఠ్యంలో ‘ప్రభువు’ అని మాత్రమే ఉంది. అందువల్ల సూచనను స్పష్టీకరిస్తూ మూలపాఠ్యాన్ని మించకుండా బిరుదును యథాతథంగా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘వాక్యం’ అనే లూకా రచనలోని ముఖ్య పదప్రయోగాన్ని నిలిపి, రెండు అసంపూర్ణ భూతకాల క్రియల కొనసాగుతున్న భావాన్ని ‘విస్తరిస్తూ, ప్రబలుతూ వచ్చింది’ అని వ్యక్తపరిచాం.
