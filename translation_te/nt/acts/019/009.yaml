id: ACT.19.9
reference: Acts 19:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς δέ τινες ἐσκληρύνοντο καὶ ἠπείθουν κακολογοῦντες τὴν ὁδὸν ἐνώπιον τοῦ πλήθους, ἀποστὰς ἀπ’ αὐτῶν ἀφώρισεν τοὺς μαθητάς, καθ’ ἡμέραν διαλεγόμενος ἐν τῇ σχολῇ ⸀Τυράννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/009.yaml
  text: But when some became hardened and disobedient[a], speaking evil of the Way before the crowd, he withdrew from them and set apart the disciples[c][b], reasoning daily in the lecture hall of Tyrannus.
translation:
  language: te
  text: కాని కొందరు కఠినపడుతూ, అవిధేయత చూపుతూ[a], జనసమూహం ఎదుట ఆ మార్గాన్ని[b] దూషించగా, పౌలు వారినుండి తప్పుకొని శిష్యులను వేరుచేసి, తిరన్ను పాఠశాలలో[c] ప్రతిరోజూ హేతుబద్ధంగా బోధిస్తూ ఉండేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నమ్మడానికి ఒప్పుకోకపోతూ” లేదా “నమ్మకపోతూ.”
    reason: lexical_alternative
  - marker: b
    text: “ఆ మార్గం” అనేది అపొస్తలుల కార్యాలలో తొలి క్రైస్తవ ఉద్యమానికి వాడిన గుర్తింపు పేరు.
    reason: cultural_note
  - marker: c
    text: లేదా, “తిరన్ను ఉపన్యాస మందిరంలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκληρύνοντο
  choice: కఠినహృదయులై
  rationale: అసంపూర్ణ కాలరూపం సూచించే కొనసాగుతున్న కఠినతను సహజమైన తెలుగులో తెలియజేస్తుంది; ఎవరు వారిని కఠినపరిచారనే అంశాన్ని నిర్ణయించదు.
- source_word: ἠπείθουν
  choice: నమ్మడానికి నిరాకరిస్తూ
  rationale: సందర్భంలో సందేశానికి ఒప్పుకోకపోవడం, విశ్వసించకపోవడం రెండూ అంతర్లీనంగా ఉన్నాయి. ఈ ప్రయోగం ఉద్దేశపూర్వక ప్రతిఘటనను చూపుతూ మూలపదంలోని భావవ్యాప్తిని కాపాడుతుంది.
- source_word: κακολογοῦντες
  choice: దూషించారు
  rationale: ప్రజల ఎదుట జరిగిన హానికరమైన, విరోధపూరితమైన మాటలను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὴν ὁδὸν
  choice: ఈ మార్గాన్ని
  rationale: అపొస్తలుల కార్యాలలో యేసును అనుసరించే ఉద్యమానికి వాడిన గుర్తింపు పేరును కాపాడుతుంది; తెలుగు సందర్భంలో 'ఈ మార్గం' సహజంగా ఉంటుంది.
- source_word: ἐνώπιον τοῦ πλήθους
  choice: జనసమూహం ఎదుట
  rationale: వారి వ్యతిరేకత బహిరంగంగా జరిగిందనే భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: ἀποστὰς ἀπ’ αὐτῶν
  choice: వారిని విడిచిపెట్టి
  rationale: పౌలు ఆ విరోధుల నుంచి నిర్ణయాత్మకంగా వైదొలగడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀφώρισεν τοὺς μαθητάς
  choice: శిష్యులను వేరుచేసి
  rationale: శిష్యులను విరోధుల నుంచి ఉద్దేశపూర్వకంగా ప్రత్యేకపరచిన భావాన్ని, కేవలం ప్రదేశ మార్పుగా పరిమితం చేయకుండా కాపాడుతుంది.
- source_word: καθ’ ἡμέραν
  choice: ప్రతిరోజూ
  rationale: క్రమంగా ప్రతి రోజు జరిగిన కార్యాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: διαλεγόμενος
  choice: వారితో తర్కిస్తూ ఉండేవాడు
  rationale: διαλέγομαι సూచించే చర్చాపూర్వకమైన, హేతుబద్ధమైన బోధనను తెలియజేస్తుంది. తెలుగు వాక్యసహజత కోసం సందర్భం ద్వారా అర్థమయ్యే శ్రోతలను 'వారితో' అని స్పష్టం చేసింది.
- source_word: ἐν τῇ σχολῇ Τυράννου
  choice: తిరన్ను ఉపన్యాస మందిరంలో
  rationale: σχολήను ఆధునిక పాఠశాలగా అపార్థం చేసుకోకుండా బోధన లేదా చర్చ జరిగే మందిరంగా చూపుతుంది; Τύραννος అనే వ్యక్తిపేరును తెలుగులో 'తిరన్ను'గా లిప్యంతరీకరించింది.
theological_decisions:
- issue: τὴν ὁδὸν అనే ఉద్యమ నామం
  choice: ఈ మార్గం
  alternative: సాధారణ అర్థంలో 'మార్గం' లేదా 'బోధ'
  rationale: అపొస్తలుల కార్యాలలో ఈ పదబంధం యేసు అనుచరుల ఉద్యమానికి గుర్తింపు పేరుగా పనిచేస్తుంది. 'ఈ మార్గం' అనే రూపం చారిత్రక ప్రయోగాన్ని నిలుపుతూ అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: ἠπείθουνలో అవిశ్వాసం మరియు అవిధేయత మధ్య భావసంబంధం
  choice: నమ్మడానికి నిరాకరిస్తూ
  alternative: అవిధేయులై / నమ్మకపోతూ
  rationale: మూల క్రియలో ఒప్పుకోకపోవడం, అవిశ్వాసం, అవిధేయత అనే పరస్పర సంబంధిత భావాలు ఉన్నాయి. ప్రధాన పాఠం ఉద్దేశపూర్వక నిరాకరణను చూపుతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని దీర్ఘ వాక్యాన్ని తెలుగు సహజ ప్రవాహం కోసం రెండు వాక్యాలుగా విభజించాం. కర్తను స్పష్టపరచడానికి రెండవ వాక్యంలో సందర్భానుసారంగా 'పౌలు' చేర్చాం. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠంలో ఉంచాం.
