  to: కాని కొందరు కఠినపడుతూ, అవిధేయత చూపుతూ[a], జనసమూహం ఎదుట ఆ మార్గాన్ని[b] దూషించగా, పౌలు వారినుండి తప్పుకొని శిష్యులను వేరుచేసి, తిరన్ను పాఠశాలలో[c] ప్రతిరోజూ హేతుబద్ధంగా బోధిస్తూ ఉండేవాడు.
  rationale: మూల గ్రీకు పాఠాన్ని అనుసరించి “ఈ” అనే లేని సూచకపదాన్ని తొలగించి “ఆ మార్గం”గా సవరించాం. ἐσκληρύνοντο, ἠπείθουν అనే అసంపూర్ణ క్రియారూపాల కొనసాగుతున్న వ్యతిరేకతను “కఠినపడుతూ, అవిధేయత చూపుతూ” అని వ్యక్తం చేశాం. మూలంలో లేని “వారితో”ను తొలగించి, διαλεγόμενοςను సందర్భానుకూలంగా “హేతుబద్ధంగా బోధిస్తూ” అని అనువదించాం. అన్ని పాదసూచిక గుర్తులు ఇప్పుడు వాటి సంబంధిత పదబంధాల వద్దనే ఉన్నాయి.
