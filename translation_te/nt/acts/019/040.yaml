id: ACT.19.40
reference: Acts 19:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ γὰρ κινδυνεύομεν ἐγκαλεῖσθαι στάσεως περὶ τῆς σήμερον μηδενὸς αἰτίου ὑπάρχοντος περὶ οὗ οὐ δυνησόμεθα ⸀ἀποδοῦναι λόγον ⸀περὶ τῆς συστροφῆς ταύτης. καὶ ταῦτα εἰπὼν ἀπέλυσεν τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/040.yaml
  text: For indeed we are in danger of being charged with rioting over what happened today[a], since there is no cause for it, and we will not be able to give an account for this commotion. And after saying these things[c][b], he dismissed the assembly.
translation:
  language: te
  text: నిజానికి, ఈ రోజు జరిగిన సంఘటన విషయమై అల్లర్ల ఆరోపణను ఎదుర్కొనే ప్రమాదంలో ఉన్నాం[a]. ఈ కల్లోలకరమైన గుమికూడడానికి ఏ కారణమూ లేదు; దాని గురించి మనం వివరణ ఇవ్వలేం[b]. ఈ మాటలు చెప్పి, అతడు సభను రద్దు చేశాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కల్లోలం’ లేదా ‘తిరుగుబాటు.’ గ్రీకు పదం తీవ్రమైన పౌర తిరుగుబాటును కూడా సూచించగలదు; అయితే ఇక్కడ ప్రజల గందరగోళానికి ‘అల్లర్లు’ అనేది సందర్భానికి తగినది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘గందరగోళం’ లేదా ‘అల్లరి మూక.’ గ్రీకు పదం కల్లోలంగా గుమికూడిన జనసమూహాన్ని లేదా ఆ గుమికూడడాన్ని సూచిస్తుంది; తరువాత వచ్చే అధికారిక ‘సభ’కు వాడిన పదం దీనికి భిన్నమైనది.
    reason: lexical_alternative
  - marker: c
    text: ‘సభ’ అని అనువదించిన గ్రీకు పదమే ఇతర చోట్ల తరచుగా ‘సంఘం’ అని అనువదించబడుతుంది; ఇక్కడ అది ఎఫెసులో కూడిన పౌర సభను సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: κινδυνεύομεν
  choice: ప్రమాదం ఉంది
  rationale: వర్తమాన కాలంలో ఉన్న వాస్తవ ప్రమాదాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐγκαλεῖσθαι
  choice: నేరం మన మీద మోపబడే
  rationale: పట్టణ అధికారుల ఎదుట జవాబు చెప్పాల్సిన న్యాయపరమైన సందర్భాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: στάσεως
  choice: అల్లర్ల నేరం
  rationale: ప్రజా శాంతికి భంగం కలిగించే పౌర కల్లోలాన్ని సూచిస్తుంది; రాజకీయ తిరుగుబాటు అనే మరీ బలమైన భావాన్ని అనవసరంగా చేర్చదు.
- source_word: περὶ τῆς σήμερον
  choice: ఈ రోజు జరిగిన దాని కారణంగా
  rationale: గ్రీకు సంక్షిప్త ప్రయోగం నేటి సంఘటనను సూచిస్తున్నదని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μηδενὸς αἰτίου ὑπάρχοντος
  choice: దీనికి ఏ కారణమూ లేదు
  rationale: ఈ గుంపు చర్యకు సమర్థించదగిన ఆధారం లేదనే న్యాయపరమైన భావాన్ని నిలుపుతుంది.
- source_word: ἀποδοῦναι λόγον
  choice: లెక్క చెప్పలేం
  rationale: అధికారులకు వివరణ లేదా జవాబు ఇవ్వడం అనే స్థిరమైన భావాన్ని సరళంగా అందిస్తుంది.
- source_word: συστροφῆς
  choice: గందరగోళపు గుంపు
  rationale: కల్లోలంగా గుమికూడిన జనాన్ని సూచిస్తూ, తరువాతి అధికారిక ‘సభ’తో ఉన్న పదభేదాన్ని నిలుపుతుంది.
- source_word: ἐκκλησίαν
  choice: సభను
  rationale: ఈ సందర్భంలో సంఘాన్ని కాక ఎఫెసులో కూడిన పౌర సభను సూచిస్తుంది.
- source_word: ἀπέλυσεν
  choice: పంపివేశాడు
  rationale: సమావేశాన్ని ముగించి అక్కడ కూడినవారిని వెళ్లనివ్వడం అనే సందర్భోచిత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: καὶ γὰρ
  choice: నిజానికి
  rationale: ముందటి హెచ్చరికకు వివరణాత్మక బలాన్ని ఇస్తూ తెలుగులో సహజంగా ఉంటుంది.
theological_decisions:
- issue: ἐκκλησίαν అనే పదానికి సందర్భానుసారమైన అర్థం
  choice: సభను
  alternative: సంఘాన్ని
  rationale: ఇక్కడ క్రైస్తవ సంఘం ఉద్దేశం కాదు; పట్టణంలో కూడిన ప్రజాసమూహాన్ని అధికారి రద్దు చేస్తున్న సందర్భం. ‘సభ’ మూలపదపు సామాన్య, పౌర అర్థాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. న్యాయపరమైన హెచ్చరిక స్వరం నిలుపబడింది. ‘గందరగోళపు గుంపు’ మరియు ‘సభ’ మధ్య మూలంలోని పదభేదం స్పష్టంగా ఉంచబడింది.
