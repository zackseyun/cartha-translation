source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ καὶ γενόμενοι πλήρεις θυμοῦ ἔκραζον λέγοντες· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/028.yaml
  text: When they heard this and became full of wrath[a], they were crying out, saying, “Great is Artemis of the Ephesians!”
translation:
  language: te
  text: వారు అది విని, తీవ్రమైన కోపంతో నిండిపోయి[a], “ఎఫెసీయుల అర్తెమిస్ గొప్పది!” అని కేకలు వేస్తూనే ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తీవ్ర ఆగ్రహంతో నిండిపోయి,” “కోపోద్రిక్తులై.” గ్రీకు పదబంధానికి అక్షరార్థం “థూమోస్‌తో నిండినవారై”; అది తీవ్రమైన కోపాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: వారు అది విని
  rationale: ఆరిస్ట్ కృదంతం ప్రధాన క్రియకు ముందున్న సందర్భాన్ని తెలియజేస్తుంది; సందర్భం ద్వారా సూచితమైన కర్మను ‘అది’ అని సహజంగా వ్యక్తం చేశాం.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది స్వల్ప అనుసంధాన అవ్యయం; తెలుగులో వాక్యప్రవాహం ద్వారానే సంబంధం స్పష్టంగా ఉంటుంది.
- source_word: γενόμενοι πλήρεις θυμοῦ
  choice: తీవ్రమైన కోపంతో నిండిపోయి
  rationale: ‘θυμόςతో నిండినవారై’ అనే మూలంలోని సంపూర్ణత భావాన్నీ, తీవ్రమైన ఆగ్రహాన్నీ నిలుపుతుంది.
- source_word: ἔκραζον
  choice: కేకలు వేస్తూనే ఉన్నారు
  rationale: ఇంపర్ఫెక్ట్ క్రియ సూచించే కొనసాగుతున్న లేదా పునరావృత అరుపును సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: λέγοντες
  choice: అని
  rationale: కేకలోని మాటలను ప్రత్యక్ష ఉక్తిగా పరిచయం చేయడానికి తెలుగులో సహజమైన నిర్మాణం.
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: ఎఫెసీయుల అర్తెమి మహాదేవత!
  rationale: ఇది నినాదరూప నామవాక్యం. ‘మహాదేవత’ ఇక్కడ అర్తెమి గొప్ప దేవత అనే గుంపు ప్రశంసను సంక్షిప్తంగా, నినాదానికి తగినట్లుగా తెలియజేస్తుంది; Ἐφεσίωνలోని బహువచన సంబంధాన్ని ‘ఎఫెసీయుల’గా నిలుపుతుంది.
- source_word: Ἄρτεμις
  choice: అర్తెమి
  rationale: గ్రీకు దేవత పేరును మూల ఉచ్చారణకు దగ్గరగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: Ἐφεσίων
  choice: ఎఫెసీయుల
  rationale: ఇది ఎఫెసు పట్టణాన్ని కాక దాని ప్రజలను సూచించే బహువచన సంబంధరూపం.
theological_decisions:
- issue: అన్యదేవతను స్తుతించే నినాదాన్ని అనువదించడం
  choice: ఎఫెసీయుల అర్తెమి మహాదేవత!
  alternative: ఎఫెసీయుల అర్తెమి గొప్పది!
  rationale: దీనిని గుంపు పలికిన ప్రత్యక్ష ఉక్తిగానే ఉంచి, అనువాదకుని సమ్మతిగా మార్చలేదు; అదే సమయంలో మూలంలోని సూటి ప్రశంసను మృదువుపరచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గుంపు నినాదానికి తగిన సంక్షిప్తతతో అనువదించబడింది. కొనసాగుతున్న అరుపును ‘వేస్తూనే ఉన్నారు’గా వ్యక్తం చేశాం; పేరు ‘అర్తెమి’గా లిప్యంతరీకరించబడింది.
