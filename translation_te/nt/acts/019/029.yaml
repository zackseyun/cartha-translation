id: ACT.19.29
reference: Acts 19:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐπλήσθη ἡ ⸀πόλις τῆς συγχύσεως, ὥρμησάν τε ὁμοθυμαδὸν εἰς τὸ θέατρον συναρπάσαντες Γάϊον καὶ Ἀρίσταρχον Μακεδόνας, συνεκδήμους Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/029.yaml
  text: And the city was filled with confusion[a], and they rushed together into the theater, dragging along Gaius and Aristarchus, Macedonians who were Paul’s traveling companions.
translation:
  language: te
  text: పట్టణమంతా గందరగోళంతో నిండిపోయింది. వారందరూ కలిసి నాటకశాలలోకి దూసుకెళ్లి, పౌలు ప్రయాణ సహచరులైన మాసిదోనియవాసులు గాయిని, అరిస్తార్కును బలవంతంగా పట్టుకొని తమతో ఈడ్చుకెళ్లారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గాయిని, అరిస్తార్కును బలవంతంగా పట్టుకొని తీసుకెళ్లారు”; లేదా, “గాయిని, అరిస్తార్కును లాక్కెళ్లారు.” గ్రీకు పదం బలవంతంగా పట్టుకోవడాన్ని నొక్కిచెబుతుంది; “ఈడ్చుకెళ్లారు” అనే అనువాదం ఆ గుంపు వారిని నాటకశాలలోకి తీసుకెళ్లిన కదలికను కూడా స్పష్టం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθη ἡ πόλις τῆς συγχύσεως
  choice: పట్టణమంతా గందరగోళంతో నిండిపోయింది
  rationale: గ్రీకు నిష్క్రియ రూపాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతూ, పట్టణమంతటా వ్యాపించిన అస్తవ్యస్తతను వ్యక్తం చేస్తుంది.
- source_word: ὥρμησάν τε ὁμοθυμαδὸν
  choice: వారంతా ఒక్కసారిగా ... దూసుకెళ్లారు
  rationale: ὥρμησαν లోని ఆకస్మికమైన, ఉద్ధృతమైన కదలికను ‘దూసుకెళ్లారు’ తెలియజేస్తుంది; ఈ అల్లరి సందర్భంలో ὁμοθυμαδόν సమూహ చర్యను సూచిస్తున్నందున ‘వారంతా ఒక్కసారిగా’ సహజంగా సరిపోతుంది.
- source_word: εἰς τὸ θέατρον
  choice: నాటకశాలలోకి
  rationale: θέατρον ప్రజలు కూడే ప్రదర్శనశాలను సూచిస్తుంది; గ్రీకు పదం సూచించేదానికంటే ప్రత్యేకమైన నిర్మాణ రకాన్ని అనవసరంగా చేర్చకుండా ‘నాటకశాల’ అని అనువదించబడింది.
- source_word: συναρπάσαντες
  choice: బలవంతంగా తమతో ఈడ్చుకెళ్లారు
  rationale: ఈ కృదంతం బలవంతంగా పట్టుకొని తీసుకుపోవడాన్ని సూచిస్తుంది. ‘ఈడ్చుకెళ్లారు’ హింసాత్మక పట్టివేతతో పాటు నాటకశాలలోకి జరిగిన కదలికను కూడా తెలియజేస్తుంది.
- source_word: Γάϊον καὶ Ἀρίσταρχον
  choice: గాయిని, అరిస్తార్కును
  rationale: వ్యక్తుల పేర్లను తెలుగు ఉచ్చారణ, విభక్తి రూపాలకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: Μακεδόνας
  choice: మాసిదోనియవాసులు
  rationale: వారు మాసిదోనియ ప్రాంతానికి చెందినవారని స్పష్టంగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: συνεκδήμους Παύλου
  choice: పౌలు ప్రయాణ సహచరులు
  rationale: పౌలుతో కలిసి స్వస్థలం వెలుపల ప్రయాణిస్తున్న సహచరులు అనే అర్థాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
