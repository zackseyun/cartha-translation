translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. అల్లరి గుంపు యొక్క ఆకస్మిక సమూహ కదలికను సహజంగా వ్యక్తం చేస్తూ, గ్రీకు వాక్యంలోని బలవంతపు చర్యను నిలిపింది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
