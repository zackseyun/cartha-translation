id: ACT.19.21
reference: Acts 19:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληρώθη ταῦτα, ἔθετο ὁ Παῦλος ἐν τῷ πνεύματι διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν πορεύεσθαι εἰς ⸀Ἱεροσόλυμα, εἰπὼν ὅτι Μετὰ τὸ γενέσθαι με ἐκεῖ δεῖ με καὶ Ῥώμην ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/021.yaml
  text: After these things were completed[a], Paul resolved in the Spirit to go to Jerusalem after passing through Macedonia and Achaia, saying, “After I have been there[b], I must also see Rome.”
translation:
  language: te
  text: ఈ సంగతులు పూర్తయిన తర్వాత, పౌలు మాసిడోనియా, అకయ ప్రాంతాల గుండా వెళ్లి యెరూషలేముకు వెళ్లాలని ఆత్మలో[a] నిశ్చయించుకున్నాడు. ఆయన, “నేను అక్కడికి వెళ్లిన తర్వాత రోమును కూడా చూడాలి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన మనస్సులో.” గ్రీకు పదబంధం పౌలు అంతరంగ నిశ్చయాన్ని గానీ పరిశుద్ధాత్మ నడిపింపును గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπληρώθη
  choice: పూర్తయిన
  rationale: ఇక్కడ προηγటి సంఘటనలు ముగింపుకు వచ్చిన భావం; ప్రవచన నెరవేర్పు భావం కాదు.
- source_word: ἔθετο
  choice: నిశ్చయించుకొని
  rationale: మధ్యమవాచక ప్రయోగం పౌలు తనలో తాను దృఢంగా ఉద్దేశించుకున్న భావాన్ని తెలియజేస్తుంది.
- source_word: ἐν τῷ πνεύματι
  choice: ఆత్మలో
  rationale: గ్రీకు పదబంధం పరిశుద్ధాత్మను గానీ పౌలు అంతరాత్మను గానీ సూచించవచ్చు; ప్రధాన పాఠంలో అస్పష్టతను సాధ్యమైనంతవరకు నిలిపింది.
- source_word: διελθὼν
  choice: గుండా వెళ్లి
  rationale: యెరూషలేముకు వెళ్లడానికి ముందు మాసిడోనియా, అకయల గుండా ప్రయాణించాలనే క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πορεύεσθαι
  choice: వెళ్లాలని
  rationale: సాధారణ గమనార్థక క్రియకు సహజమైన తెలుగు రూపం.
- source_word: Ἱεροσόλυμα
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన స్థలనామం.
- source_word: Μετὰ τὸ γενέσθαι με ἐκεῖ
  choice: నేను అక్కడికి వెళ్లిన తర్వాత
  rationale: అక్కడ ఉండటం లేదా చేరటం అనే సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δεῖ
  choice: చూడాలి
  rationale: లూకా రచనల్లో కనిపించే బలమైన అవసరం లేదా ఉద్దేశాన్ని తెలుగు విధ్యర్థక రూపం సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἰδεῖν
  choice: చూడాలి
  rationale: ‘సందర్శించాలి’ అనే సందర్భార్థం సాధ్యమైనా, గ్రీకులోని ‘చూడటం’ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ἐν τῷ πνεύματι యొక్క సూచన
  choice: ఆత్మలో
  alternative: తన అంతరాత్మలో
  rationale: నిర్దిష్ట స్వామ్యసూచకం లేనందున ఇది పరిశుద్ధాత్మ నడిపింపును లేదా పౌలు అంతరంగ నిశ్చయాన్ని సూచించవచ్చు. ప్రధాన పాఠం ఒకదానిని పూర్తిగా నిర్బంధించకుండా ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. మాసిడోనియా, అకయల గుండా వెళ్లడం పౌలు నిర్ణయించిన ప్రయాణ ప్రణాళికలో భాగమని స్పష్టంగా ఉండేలా పదక్రమం అమర్చబడింది.
