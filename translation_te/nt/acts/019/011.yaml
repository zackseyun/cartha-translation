  yaml_path: translation/nt/acts/019/011.yaml
  text: And God was doing extraordinary miracles through the hands of Paul,[a]
translation:
  language: te
  text: దేవుడు పౌలు చేతుల ద్వారా అసాధారణమైన అద్భుతాలు చేస్తూ ఉండేవాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “సాధారణమైనవి కాని శక్తి కార్యాలు.”
    reason: οὐ τὰς τυχούσας అనే నుడికారం (‘సాధారణమైనవి కాని’) మరియు Δυνάμεις లోని ‘శక్తి కార్యాలు’ అనే పదార్థభావాన్ని చూపే ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: Δυνάμεις
  choice: అద్భుత కార్యాలు
  rationale: బహువచన రూపం ఇక్కడ అమూర్తమైన ‘శక్తులను’ కాక, దేవుని శక్తిని ప్రదర్శించే అద్భుత కార్యాలను సూచిస్తుంది. ‘అద్భుత కార్యాలు’ అనేది సంఘటనల భావాన్నీ, శక్తివంతమైన కార్యాల భావాన్నీ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τε
  choice: వాక్యాన్ని ముందటి కథనంతో అనుసంధానించే ప్రవాహం
  rationale: τε ముందటి వాక్యంతో అనుసంధానించే కణం. తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని పెట్టడం కంటే కథన ప్రవాహం ద్వారానే ఈ అనుసంధానం సహజంగా వ్యక్తమవుతుంది.
- source_word: οὐ τὰς τυχούσας
  choice: అసాధారణమైన
  rationale: ఈ గ్రీకు నుడికారం అక్షరార్థంగా ‘సాధారణమైనవి కాని’ లేదా ‘ఏవో మామూలువి కాని’ అని అర్థం. ‘అసాధారణమైన’ అనే పదం దాని ఉద్ఘాటనను సహజంగా అందిస్తుంది.
- source_word: ὁ θεὸς
  choice: దేవుడు
  rationale: గ్రీకులో దేవుడే క్రియకు స్పష్టమైన కర్త; అందువల్ల అద్భుత కార్యాల మూలకర్త దేవుడనే భావం నిలుస్తుంది.
- source_word: ἐποίει
  choice: చేస్తూ ఉండేవాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ గతంలో కొనసాగిన లేదా పునరావృతమైన కార్యాన్ని సూచిస్తుంది. ‘చేస్తూ ఉండేవాడు’ ఆ క్రియాంశాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: διὰ τῶν χειρῶν Παύλου
  choice: పౌలు చేతుల ద్వారా
  rationale: διά + షష్ఠీ విభక్తి మధ్యవర్తిత్వాన్ని లేదా సాధనత్వాన్ని సూచిస్తుంది. ‘చేతుల ద్వారా’ అనే నిర్దిష్ట రూపాన్ని నిలుపడం వల్ల దేవుడు కార్యసాధకుడనీ, పౌలు ఆయన ఉపయోగించిన మానవ సాధనమనీ వాక్య నిర్మాణం తెలియజేస్తుంది.
- source_word: Παύλου
  choice: పౌలు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
theological_decisions:
- issue: అద్భుత కార్యాలను చేసేది ఎవరు?
  choice: దేవుడే అద్భుత కార్యాలు చేస్తాడు; పౌలు ఆయన కార్యానికి సాధనంగా చూపబడుతున్నాడు.
  alternative: పౌలే తనంతట తాను అద్భుతాలు చేశాడు.
  rationale: ὁ θεὸς అనేది ἐποίει అనే క్రియకు వ్యాకరణ కర్త; διὰ τῶν χειρῶν Παύλου పౌలు ద్వారా జరిగిన మధ్యవర్తిత్వాన్ని సూచిస్తుంది. అనువాదం ఈ భేదాన్ని మార్చకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘పౌలు చేతుల ద్వారా’ అనే గ్రీకు నుడికారాన్ని ఉద్దేశపూర్వకంగా నిలిపి, దేవుని కార్యసాధకత్వాన్ని స్పష్టంగా ఉంచాం.
