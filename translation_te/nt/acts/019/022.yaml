id: ACT.19.22
reference: Acts 19:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀποστείλας δὲ εἰς τὴν Μακεδονίαν δύο τῶν διακονούντων αὐτῷ, Τιμόθεον καὶ Ἔραστον, αὐτὸς ἐπέσχεν χρόνον εἰς τὴν Ἀσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/022.yaml
  text: So after sending into Macedonia two of those who were ministering to him—Timothy and Erastus—he himself stayed for a time in Asia[a].
translation:
  language: te
  text: తనకు సేవ చేస్తున్నవారిలో ఇద్దరైన తిమోతిని, ఎరస్తును మాసిదోనియకు పంపిన తరువాత, అతడు మాత్రం ఆసియలో[a] కొంతకాలం ఉండిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘ఆసియ’ అంటే ఆధునిక ఆసియా ఖండం కాదు; పశ్చిమ ఆసియా మైనరులోని రోమా సామ్రాజ్యపు ఆసియ ప్రాంతం.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποστείλας
  choice: పంపిన తరువాత
  rationale: ప్రధాన క్రియకు ముందుగా జరిగిన కార్యాన్ని సూచించే భూతకాల అసమాపక క్రియారూపాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంతో అనువదించలేదు
  rationale: ఇక్కడ ఇది బలమైన వ్యతిరేకతను కాక కథనాన్ని ముందుకు నడిపే స్వల్ప అనుసంధానాన్ని సూచిస్తుంది; తెలుగు వాక్యక్రమమే ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἰς τὴν Μακεδονίαν
  choice: మాసిదోనియకు
  rationale: ప్రాంతాన్ని గమ్యస్థానంగా సూచించడానికి ఆధునిక తెలుగులో ‘-కు’ సహజంగా directional భావాన్ని అందిస్తుంది.
- source_word: δύο τῶν διακονούντων αὐτῷ
  choice: తనకు సేవ చేస్తున్నవారిలో ఇద్దరైన
  rationale: διακονέωలోని సేవచేయడం అనే క్రియాత్మక భావాన్ని నిలుపుతుంది; వారిని అధికారిక పదవిలో ఉన్నవారిగా గానీ కేవలం సహాయకులుగా గానీ పరిమితం చేయదు.
- source_word: Τιμόθεον καὶ Ἔραστον
  choice: తిమోతిని, ఎరస్తును
  rationale: వ్యక్తుల పేర్లను తెలుగులో ప్రాచుర్యంలో ఉన్న రూపాలకు దగ్గరగా లిప్యంతరీకరించి, వాక్యంలో కర్మవిభక్తిని చేర్చింది.
- source_word: αὐτὸς
  choice: అతడు మాత్రం
  rationale: పంపబడిన ఇద్దరికి విరుద్ధంగా పౌలు తానే అక్కడ ఉన్నాడనే గ్రీకు ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐπέσχεν χρόνον
  choice: కొంతకాలం ఉండిపోయాడు
  rationale: ఒక కాలవ్యవధి పాటు అక్కడే నిలిచివుండటం అనే నుడికార భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: εἰς τὴν Ἀσίαν
  choice: ఆసియలో
  rationale: ἐπέσχεν χρόνονతో కలిసినప్పుడు εἰς ఇక్కడ స్థానార్థకంగా పనిచేస్తుంది; అందువల్ల ‘ఆసియలో’ సందర్భానుకూలం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని ఉపయోగించాం. ‘సేవ చేస్తున్నవారు’ అనే పదబంధం మూలంలోని విస్తృత సేవాభావాన్ని నిలుపుతూ అధికారిక సంఘపదవిని అనవసరంగా సూచించదు. ప్రధాన పాఠంలోని [a] గుర్తు పాదసూచికతో సరిపోలుతుంది.
