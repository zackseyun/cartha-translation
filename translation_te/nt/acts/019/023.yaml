  text: Ἐγένετο δὲ κατὰ τὸν καιρὸν ἐκεῖνον τάραχος οὐκ ὀλίγος περὶ τῆς ὁδοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/023.yaml
  text: At that time there arose no small disturbance concerning the Way[a].
translation:
  language: te
  text: ఆ సమయంలో ఆ మార్గం[a] గురించి స్వల్పమైనది కాని కల్లోలం చెలరేగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మార్గం.’ ఇక్కడ ఇది క్రైస్తవ ఉద్యమాన్ని సూచిస్తుంది; అపొస్తలుల కార్యములలో ఈ పేరు పలుమార్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: చెలరేగింది
  rationale: ఇక్కడ γίνομαι ఒక సంఘటన తలెత్తడాన్ని సూచిస్తుంది. కల్లోలంతో సహజంగా జతకట్టే ‘చెలరేగింది’ దాని సంఘటనాత్మక బలాన్ని తెలుగులో నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ స్వల్ప కథన అనుసంధానకం. తెలుగు వాక్యప్రవాహంలో ‘ఆ సమయంలో’నే మార్పును సహజంగా సూచిస్తుంది; అదనంగా ‘అయితే’ పెడితే అవసరం లేని వ్యతిరేక భావం రావచ్చు.
- source_word: κατὰ τὸν καιρὸν ἐκεῖνον
  choice: ఆ సమయంలో
  rationale: మూలంలోని కాలసూచనను సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τάραχος
  choice: కల్లోలం
  rationale: τάραχος సూచించే గందరగోళం, అశాంతి అనే విస్తృత భావాన్ని నిలుపుతుంది; కథనం ముందే ‘అల్లరి’ లేదా ‘దొమ్మీ’ అనే మరింత నిర్దిష్ట భావాన్ని రుద్దదు.
- source_word: οὐκ ὀλίγος
  choice: చిన్నది కాని
  rationale: లూకా ఉపయోగించిన న్యూనోక్తిని ‘గొప్ప’ అని సరళీకరించకుండా సాధ్యమైనంత సహజంగా నిలుపుతుంది.
- source_word: περὶ
  choice: గురించి
  rationale: విషయం లేదా సంబంధాన్ని సూచించే περί + షష్ఠీ విభక్తి భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఇస్తుంది.
- source_word: τῆς ὁδοῦ
  choice: మార్గం
  rationale: అపొస్తలుల కార్యములలో ఇది క్రైస్తవ ఉద్యమానికి పునరావృతమైన పేరుగా వస్తుంది. ‘మార్గం’ అనే పదం మూల రూపకాన్ని నిలుపుతుంది; పాదసూచిక దాని ప్రత్యేక సూచనను వివరిస్తుంది.
theological_decisions:
- issue: τῆς ὁδοῦ ను ఉద్యమానికి పేరుగా చూపడం
  choice: మార్గం[a]
  alternative: మార్గము; ఆ మార్గం
  rationale: ఇది అపొస్తలుల కార్యములలో యేసు అనుచరుల ఉద్యమాన్ని సూచించే స్థిరమైన ప్రయోగం. తెలుగులో పెద్ద అక్షరాల భేదం లేకపోవడంతో పాదసూచిక ద్వారా ప్రత్యేక నామసదృశ ప్రయోగాన్ని స్పష్టం చేయడం, మూలంలో లేని సిద్ధాంత వివరణను ప్రధాన పాఠ్యంలో చేర్చకపోవడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. ‘చిన్నది కాని’ ద్వారా మూలంలోని న్యూనోక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
