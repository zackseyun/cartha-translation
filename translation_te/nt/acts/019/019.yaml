id: ACT.19.19
reference: Acts 19:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἱκανοὶ δὲ τῶν τὰ περίεργα πραξάντων συνενέγκαντες τὰς βίβλους κατέκαιον ἐνώπιον πάντων· καὶ συνεψήφισαν τὰς τιμὰς αὐτῶν καὶ εὗρον ἀργυρίου μυριάδας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/019.yaml
  text: And many of those who had practiced magic arts brought their books together and were burning them in front of everyone[b][a]; and they totaled up their value and found it to be fifty thousand pieces of silver.
translation:
  language: te
  text: మాంత్రిక విద్యలను[a] ఆచరించినవారిలో చాలామంది తమ పుస్తకాలను తీసుకొచ్చి, ఒకచోట పోగుచేసి, అందరి ఎదుట వాటిని కాలుస్తూ ఉన్నారు. వాటి విలువను లెక్కకట్టి, అది వెండి యాభై వేలని తేల్చారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మాంత్రిక విద్యలు’ అనే మాటకు ‘క్షుద్ర ఆచారాలు’ అని కూడా అనువదించవచ్చు. గ్రీకు నుడికారం అక్షరార్థంగా ‘విచిత్రమైన’ లేదా ‘ప్రత్యేకమైన’ పనులను సూచించినా, ఈ సందర్భంలో మాంత్రిక ఆచారాలనే సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘వెండి ఐదు పదివేలు,’ అంటే యాభై వేలు. ఏ రకమైన వెండి నాణెమో గ్రీకు పాఠం పేర్కొనదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκανοὶ
  choice: చాలామంది
  rationale: ఇక్కడ ఈ పదం తగినంతమంది అనే భావం కంటే గణనీయమైన సంఖ్యలో ప్రజలను సూచిస్తుంది; ‘చాలామంది’ సహజమైన ఆధునిక తెలుగు.
- source_word: τὰ περίεργα πραξάντων
  choice: మాంత్రిక విద్యలు అభ్యసించినవారిలో
  rationale: ఎఫెసులోని సందర్భం, మంత్రగ్రంథాలు, దుష్టాత్మలు మొదలైన అంశాల దృష్ట్యా ఈ నుడికారం కేవలం విచిత్రమైన పనులను కాక మాంత్రిక ఆచారాలను సూచిస్తుంది.
- source_word: συνενέγκαντες τὰς βίβλους
  choice: తమ పుస్తకాలను తీసుకొచ్చి పోగుచేసి
  rationale: పుస్తకాలను ఒక చోటికి తీసుకొచ్చి సమకూర్చిన నిర్దిష్ట చర్యను స్పష్టంగా తెలియజేస్తుంది; ‘తమ’ అనేది సందర్భం నుంచి గ్రహించిన సంబంధం.
- source_word: κατέκαιον
  choice: కాలుస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం చర్య కొనసాగుతున్న దృశ్యాన్ని చూపుతుంది; ఈ భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: ἐνώπιον πάντων
  choice: అందరి ఎదుట
  rationale: ఈ చర్య బహిరంగంగా జరిగిందనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: συνεψήφισαν τὰς τιμὰς αὐτῶν
  choice: వాటి విలువను లెక్కకట్టి
  rationale: వాటి ద్రవ్య విలువను కూడిక చేసి మొత్తం నిర్ధారించారనే అర్థాన్ని ఇస్తుంది.
- source_word: ἀργυρίου μυριάδας πέντε
  choice: యాభై వేల వెండి నాణేలు
  rationale: ‘ఐదు మిరియడ్లు’ అంటే యాభై వేలు. ἀργύριον వెండి ఆధారిత ద్రవ్య ప్రమాణాన్ని సూచించినా ఖచ్చితమైన నాణెం పేరు చెప్పబడలేదు; పాఠకునికి అర్థమయ్యేలా సాధారణ పదబంధం వాడబడింది.
theological_decisions:
- issue: ఎఫెసు సందర్భంలో τὰ περίεργα స్వభావం
  choice: మాంత్రిక విద్యలు
  alternative: క్షుద్ర ఆచారాలు; విచిత్ర విద్యలు
  rationale: సమీప సందర్భంలో భూతవైద్యులు, దుష్టాత్మలు, ఖరీదైన మంత్రగ్రంథాల దహనం ఉన్నాయి. అందువల్ల ‘మాంత్రిక విద్యలు’ చారిత్రక-మతపరమైన ఆచారాన్ని స్పష్టంగా తెలియజేస్తుంది; కేవలం ‘విచిత్ర’ పనులుగా భావాన్ని పలుచన చేయదు.
- issue: కాల్చడాన్ని సూచించే κατέκαιον యొక్క క్రియాంశం
  choice: కాలుస్తూ ఉన్నారు
  alternative: కాల్చివేశారు
  rationale: గ్రీకు అసంపూర్ణ భూతకాలం కొనసాగుతున్న చర్యను చిత్రిస్తుంది. తెలుగులో ‘కాలుస్తూ ఉన్నారు’ ఆ దృశ్యాత్మక కొనసాగింపును కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రద కథన శైలి. గ్రీకు అసంపూర్ణ భూతకాల క్రియాంశాన్ని నిలుపుతూ, నాణెం రకం నిర్దిష్టంగా లేదనే విషయాన్ని పాదసూచికలో స్పష్టం చేసింది.
