revisions:
- from: మాంత్రిక విద్యలు అభ్యసించినవారిలో చాలామంది తమ పుస్తకాలను తీసుకొచ్చి పోగుచేసి, అందరి ఎదుట వాటిని కాలుస్తూ ఉన్నారు.[a] వాటి విలువను లెక్కకట్టి, అది యాభై వేల వెండి నాణేలని తేల్చారు.[b]
  to: మాంత్రిక విద్యలను[a] ఆచరించినవారిలో చాలామంది తమ పుస్తకాలను తీసుకొచ్చి, ఒకచోట పోగుచేసి, అందరి ఎదుట వాటిని కాలుస్తూ ఉన్నారు. వాటి విలువను లెక్కకట్టి, అది వెండి యాభై వేలని తేల్చారు.[b]
  rationale: The revision relocates footnote a to its proper lexical anchor, preserves the gathering sense with “ఒకచోట పోగుచేసి,” and replaces the overly specific “వెండి నాణేలు” with “వెండి యాభై వేలు,” which maintains the Greek text’s unspecified silver unit. The footnote is revised for clear modern Telugu while retaining the statement that no denomination is named.
