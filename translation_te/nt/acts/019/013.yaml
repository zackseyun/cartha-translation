id: ACT.19.13
reference: Acts 19:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπεχείρησαν δέ τινες ⸀καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν ὀνομάζειν ἐπὶ τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρὰ τὸ ὄνομα τοῦ κυρίου Ἰησοῦ λέγοντες· ⸀Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν ⸀ὃν Παῦλος κηρύσσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/013.yaml
  text: But some also of the itinerant Jewish exorcists attempted to invoke the name of the Lord Jesus over those who had evil spirits[a], saying, “I adjure you by Jesus[d][c][b], whom Paul proclaims.”
translation:
  language: te
  text: అయితే సంచార యూదు భూతోచ్చాటకులలో కొందరు కూడా దుష్టాత్మలున్నవారిపై ప్రభువైన యేసు పేరును ఉచ్చరించడానికి ప్రయత్నించారు. వారు, “పౌలు ప్రకటిస్తున్న యేసు పేరున మిమ్మల్ని ప్రమాణబద్ధంగా ఆజ్ఞాపిస్తున్నాను[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పౌలు ప్రకటిస్తున్న యేసు తోడు మిమ్మల్ని ఆజ్ఞాపిస్తున్నాను.”
    reason: ὁρκίζω అనేది ఎవరి పేరునో లేదా ఆధారంగానో ప్రమాణబద్ధంగా, గంభీరంగా ఆజ్ఞాపించడం అనే భావాన్ని కలిగిస్తుంది.
lexical_decisions:
- source_word: ἐπεχείρησαν
  choice: ప్రయత్నిస్తూ
  rationale: ఈ క్రియ ఒక కార్యాన్ని చేయడానికి పూనుకోవడం లేదా ప్రయత్నించడం అనే భావాన్ని ఇస్తుంది; సందర్భంలోని కొనసాగుతున్న వివరణకు తెలుగు సంధానంతో సహజంగా సరిపోతుంది.
- source_word: τινες καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν
  choice: ఊరూరా తిరిగే యూదులైన భూతవైద్యులలో కొందరు కూడా
  rationale: τινες అంటే ‘కొందరు’; καὶ అంటే ఇక్కడ ‘కూడా’; περιερχομένων వారు ఒకచోటినుంచి మరొకచోటికి తిరిగేవారని సూచిస్తుంది. ἐξορκιστήςకు ఆధునిక పాఠకునికి అర్థమయ్యే ‘భూతవైద్యుడు’ను ఎంచుకున్నాం.
- source_word: ὀνομάζειν ἐπὶ ... τὸ ὄνομα
  choice: '...పై ... పేరును ప్రయోగించడానికి'
  rationale: ఇది కేవలం పేరు పలకడం కాదు, భూతవైద్య మంత్రోచ్చారణలో అధికారసాధనంగా ఆ పేరును ఉపయోగించడం. ‘పేరును ప్రయోగించడం’ ఆ సందర్భార్థాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: దుష్టాత్మలు పట్టినవారిపై
  rationale: అక్షరార్థం ‘దుష్టాత్మలను కలిగియున్నవారు.’ తెలుగులో ‘దుష్టాత్మలు పట్టినవారు’ సహజంగా ఉండి, ‘పూర్తిగా ఆవహించబడినవారు’ వంటి మరింత బలమైన వివరణను జోడించదు.
- source_word: τὸ ὄνομα τοῦ κυρίου Ἰησοῦ
  choice: ప్రభువైన యేసు పేరు
  rationale: κύριος యొక్క గౌరవార్థక, క్రీస్తుసంబంధమైన బరువును ‘ప్రభువు’ నిలుపుతుంది; తెలుగు వాక్యనిర్మాణంలో ‘ప్రభువైన యేసు పేరు’ సహజం.
- source_word: Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν
  choice: యేసు తోడు, మిమ్మల్ని ఆజ్ఞాపిస్తున్నాను
  rationale: ὁρκίζω ప్రమాణబద్ధంగా గట్టిగా ఆదేశించడం. ‘యేసు తోడు’ ఆ ప్రమాణాధారాన్ని, ‘ఆజ్ఞాపిస్తున్నాను’ దాని గంభీర ఆదేశ స్వరాన్ని తెలుగులో సహజంగా అందిస్తాయి.
- source_word: ὃν Παῦλος κηρύσσει
  choice: పౌలు ప్రకటించే
  rationale: κηρύσσει బహిరంగంగా ప్రకటించడం లేదా బోధించడం అనే భావం కలిగి ఉంది; ‘ప్రకటించే’ మతసంస్థాపరమైన అదనపు భావం లేకుండా మూలార్థాన్ని అందిస్తుంది.
theological_decisions:
- issue: τοῦ κυρίου Ἰησοῦలో κύριος అనువాదం
  choice: ప్రభువైన యేసు
  alternative: యజమానియైన యేసు
  rationale: ‘ప్రభువు’ గౌరవార్థకతను, అపొస్తలుల కార్యములలోని క్రీస్తుసంబంధమైన శీర్షిక బరువును నిలుపుతుంది.
- issue: దుష్టాత్మల ప్రభావాన్ని ఎంత స్పష్టంగా వ్యక్తపరచాలి
  choice: దుష్టాత్మలు పట్టినవారు
  alternative: దుష్టాత్మలు ఆవహించినవారు
  rationale: ‘ఆవహించినవారు’ మూలంలోని ‘కలిగియున్న’ అన్న మాటకంటే బలమైన స్థితిని నిర్దిష్టం చేయవచ్చు. ఎంచుకున్న రూపం తెలుగులో సహజంగా ఉండి ఆ స్థాయిని అనవసరంగా పెంచదు.
- issue: ὁρκίζω యొక్క ప్రమాణసంబంధ బలాన్ని వ్యక్తపరచడం
  choice: యేసు తోడు, మిమ్మల్ని ఆజ్ఞాపిస్తున్నాను
  alternative: యేసు పేరట మిమ్మల్ని గట్టిగా ఆదేశిస్తున్నాను
  rationale: మూలంలో యేసు ఆ ప్రమాణానికి ఆధారంగా సూచించబడ్డాడు. ఎంచుకున్న రూపం ఆ సంబంధాన్ని ఉంచుతూ భూతవైద్య సూత్రంలోని గంభీరతను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకునికి స్పష్టంగా ఉండేలా, అయినా కథన గాంభీర్యాన్ని నిలుపుతూ అనువదించబడింది. ‘భూతవైద్యులు,’ ‘పేరును ప్రయోగించడం’ అనే పదబంధాలు సందర్భంలోని వృత్తి మరియు ఆచారపరమైన చర్యను సహజంగా తెలియజేస్తాయి.
