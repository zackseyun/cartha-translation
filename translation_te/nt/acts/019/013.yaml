revisions:
- from: అయితే, ఊరూరా తిరిగే యూదులైన భూతవైద్యులలో కొందరు కూడా దుష్టాత్మలు పట్టినవారిపై ప్రభువైన యేసు పేరును ప్రయోగించడానికి ప్రయత్నిస్తూ, “పౌలు ప్రకటించే యేసు తోడు, మిమ్మల్ని ఆజ్ఞాపిస్తున్నాను[a]” అన్నారు.
  to: అయితే సంచార యూదు భూతోచ్చాటకులలో కొందరు కూడా దుష్టాత్మలున్నవారిపై ప్రభువైన యేసు పేరును ఉచ్చరించడానికి ప్రయత్నించారు. వారు, “పౌలు ప్రకటిస్తున్న యేసు పేరున మిమ్మల్ని ప్రమాణబద్ధంగా ఆజ్ఞాపిస్తున్నాను[a]” అన్నారు.
  rationale: 'సవరణ గ్రీకు వాక్యనిర్మాణాన్ని మరియు అర్థస్థాయిని దగ్గరగా అనుసరిస్తుంది: ἐπεχείρησανకు ‘ప్రయత్నించారు,’ περιερχομένωνకు ‘సంచార,’ ἐξορκισταίకు ‘భూతోచ్చాటకులు,’ మరియు ‘those having evil spirits’కు ‘దుష్టాత్మలున్నవారు’ వాడబడాయి. ‘పేరును ఉచ్చరించడానికి’ అనేది ఇక్కడి ఆహ్వాన/మంత్రోచ్చారణ సందర్భాన్ని తెలియజేస్తుంది; ఉద్ధరణలో ప్రమాణబద్ధ ఆజ్ఞ భావం ప్రధాన పాఠ్యంలోనే స్పష్టంగా ఉంచబడింది.'
  reviewer_model: gpt-5.6-terra
