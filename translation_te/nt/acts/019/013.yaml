review_pass:
  verdict: revise
  source_fidelity: సవరణ అవసరం. ముసాయిదాలోని ‘ప్రయత్నిస్తూ’ ప్రధాన క్రియ ἐπεχείρησαν (‘ప్రయత్నించారు’) యొక్క పూర్తి భూతకాల కార్యాన్ని బలహీనపరుస్తుంది. ‘దుష్టాత్మలు పట్టినవారు’ అనేది τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά (‘దుష్టాత్మలున్నవారు’) కంటే కొద్దిగా బలమైన, నిర్దిష్టమైన భావాన్ని ఇస్తుంది. ఉద్ధరణలోని ‘యేసు తోడు’ కొంత ప్రాంతీయ/వ్యావహారిక స్వరం కలిగి ఉండి ὁρκίζω యొక్క అధికారిక ప్రమాణబద్ధ ఆజ్ఞ భావాన్ని తక్కువ స్పష్టంగా తెలియజేస్తుంది.
  naturalness: ‘భూతవైద్యులు’ కంటే ‘భూతోచ్చాటకులు’ ఈ సందర్భంలోని ἐξορκισταίకి మరింత కచ్చితమైనది; వైద్యం చేసే వ్యక్తి అనే అనవసర భావాన్ని నివారిస్తుంది. సవరించిన వాక్యం ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, కథనానికి తగిన గాంభీర్యంతో ఉంది.
  terminology: ‘ప్రభువైన యేసు’ κύριος యొక్క ముఖ్యమైన శీర్షికను కాపాడుతుంది. ‘దుష్టాత్మలున్నవారు’ మూలంలోని ‘having’ అనే వ్యక్తీకరణ స్థాయిని నిలుపుతుంది. ‘యేసు పేరున ... ప్రమాణబద్ధంగా ఆజ్ఞాపిస్తున్నాను’ Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν యొక్క సూత్రబద్ధమైన, ప్రమాణాధారిత ఆజ్ఞను తెలుగులో స్పష్టంగా అందిస్తుంది.
  issues:
  - severity: medium
    issue: ‘ప్రయత్నిస్తూ’ స్థానంలో పూర్తి క్రియ అవసరం.
    rationale: ἐπεχείρησαν అఒరిస్ట్ సూచక క్రియ; ఇక్కడ వారు చేసిన ప్రయత్నాన్ని ప్రధాన సంఘటనగా చెబుతుంది, కొనసాగుతున్న క్రియగా కాదు.
  - severity: medium
    issue: ‘దుష్టాత్మలు పట్టినవారు’ మూల వ్యక్తీకరణ కంటే బలంగా ఉంది.
    rationale: గ్రీకు వాక్యం అక్షరార్థంగా ‘దుష్టాత్మలున్నవారు’ అని చెబుతుంది. ‘పట్టినవారు’ తెలుగు వాడుకలో సహజమైనప్పటికీ, మరింత నిర్దిష్టమైన ఆవహింపు భావాన్ని కలిగించవచ్చు.
