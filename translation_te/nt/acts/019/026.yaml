id: ACT.19.26
reference: Acts 19:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ θεωρεῖτε καὶ ἀκούετε ὅτι οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας ὁ Παῦλος οὗτος πείσας μετέστησεν ἱκανὸν ὄχλον, λέγων ὅτι οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/026.yaml
  text: And you see and hear that not only in Ephesus but in almost all of Asia[a], this Paul has persuaded and turned away a considerable crowd[b], saying that gods made by hands are not gods.
translation:
  language: te
  text: 'మీరు చూస్తున్నారు, వింటున్నారు: ఈ పౌలు ఎఫెసులో మాత్రమే కాక, దాదాపు ఆసియా ప్రాంతమంతటా గణనీయమైన జనసమూహాన్ని ఒప్పించి మళ్లించాడు. “చేతులతో తయారైనవి దేవుళ్లు కావు”[a] అని చెబుతూ ఇలా చేశాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “చేతుల ద్వారా ఉనికిలోకి వచ్చేవి.” ఇది మానవ నైపుణ్యంతో తయారైన దేవతా ప్రతిమలను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: θεωρεῖτε καὶ ἀκούετε
  choice: మీరు చూస్తున్నారు, వింటున్నారు
  rationale: వర్తమానకాలంలోని జంట క్రియలను సహజమైన తెలుగులో ఉంచి, దెమెత్రియుడు అందరికీ తెలిసిన సాక్ష్యాన్ని చూపిస్తున్న తక్షణ భావాన్ని నిలిపింది.
- source_word: οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας
  choice: ఎఫెసులో మాత్రమే కాక దాదాపు ఆసియా ప్రాంతమంతటా
  rationale: గ్రీకు విభక్తి నిర్మాణంలోని స్థానార్థాన్ని తెలుగులో స్పష్టంగా తెలిపింది. ఇక్కడ Ἀσία ఆధునిక ఖండమంతటిని కాక రోమా పరిపాలనలోని ఆసియా ప్రాంతాన్ని సూచిస్తుంది; అందుకే ‘ఆసియా ప్రాంతం’ అని ఇచ్చాం.
- source_word: ὁ Παῦλος οὗτος
  choice: ఈ పౌలు
  rationale: οὗτος లోని చూపించే, సందర్భంలో కొంత తృణీకారంగా వినిపించే ధోరణిని అదనపు దూషణ చేర్చకుండా నిలిపింది.
- source_word: πείσας μετέστησεν
  choice: ఒప్పించి, వారి పూర్వపు ఆరాధన నుంచి మళ్లించాడు
  rationale: πείσας ను ‘ఒప్పించి’ అని నేరుగా ఇచ్చాం. μετέστησεν ఒక స్థితి లేదా వైఖరి నుంచి మరొకదానికి మళ్లించడాన్ని సూచిస్తుంది; తెలుగులో కర్మ స్పష్టత కోసం సందర్భం సూచించే ‘వారి పూర్వపు ఆరాధన నుంచి’ అని పరిమితంగా విప్పి చెప్పాం.
- source_word: ἱκανὸν ὄχλον
  choice: చాలామందిని
  rationale: గణనీయమైన సంఖ్యలోని జనాన్ని సూచించే సహజమైన ఆధునిక తెలుగు రూపం; ‘గుంపు’ అనే పదం ఇక్కడ అనవసరంగా భౌతిక సమూహాన్ని ముందుకు తేవచ్చు.
- source_word: οἱ διὰ χειρῶν γινόμενοι
  choice: చేతులతో తయారైనవి
  rationale: మానవ హస్తకళతో రూపుదిద్దుకున్న విగ్రహాలను సూచించే గ్రీకు నుడికారాన్ని సంక్షిప్తంగా నిలిపింది; మూలంలో లేని ‘విగ్రహాలు’ అనే నామవాచకాన్ని ప్రధాన వాక్యంలో చేర్చలేదు.
- source_word: οὐκ εἰσὶν θεοὶ
  choice: దేవుళ్లు కావు
  rationale: తయారుచేసిన వస్తువుల దైవత్వాన్ని నేరుగా నిరాకరించే విధేయార్థాన్ని సహజమైన తెలుగులో కాపాడింది.
theological_decisions:
- issue: మానవులు తయారుచేసిన దేవతా ప్రతిమల గురించి పౌలు చేసిన నిరాకరణ పరిధి
  choice: “చేతులతో తయారైనవి దేవుళ్లు కావు”
  alternative: “మనుషుల చేతులతో చేసిన దేవుళ్లు నిజమైన దేవుళ్లు కారు”
  rationale: గ్రీకు వాక్యం మానవ హస్తకృత వస్తువులకు దేవత్వం లేదని నేరుగా చెబుతుంది. ‘నిజమైన’ అనే వివరణాత్మక పదాన్ని చేర్చకుండా, వాక్యంలోని పదునైన నిరాకరణను అలాగే ఉంచాం.
- issue: μετέστησεν లోని మార్పు స్వభావం
  choice: వారి పూర్వపు ఆరాధన నుంచి మళ్లించాడు
  alternative: తప్పుదారి పట్టించాడు
  rationale: ‘తప్పుదారి పట్టించాడు’ అని అనువదిస్తే దెమెత్రియుని ప్రతికూల తీర్పును క్రియలోనే మరింత బలంగా చేర్చినట్లవుతుంది. మూలక్రియ ప్రధానంగా ఒక స్థానం నుంచి మళ్లించడాన్ని తెలుపుతుంది; సందర్భం ఆ మార్పు విగ్రహారాధనకు సంబంధించినదని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బహిరంగ ప్రసంగానికి తగిన గంభీరతతో రూపొందించాం. దెమెత్రియుని ఆరోపణాత్మక స్వరాన్ని ‘ఈ పౌలు’ ద్వారా నిలిపి, మూలంలో లేని తీవ్రమైన దూషణను చేర్చలేదు. ఉటంకించిన మాటను తెలుగు పఠనసౌలభ్యం కోసం ప్రత్యక్ష వాక్యంగా ఇచ్చాం.
