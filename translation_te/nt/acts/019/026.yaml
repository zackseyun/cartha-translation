revisions:
- from: 'మీరు చూస్తున్నారు, వింటున్నారు: ఈ పౌలు ఎఫెసులో మాత్రమే కాక దాదాపు ఆసియా ప్రాంతమంతటా చాలామందిని ఒప్పించి, వారి పూర్వపు ఆరాధన నుంచి మళ్లించాడు. “చేతులతో తయారైనవి దేవుళ్లు కావు”[a] అని అతడు చెబుతున్నాడు.'
  to: 'మీరు చూస్తున్నారు, వింటున్నారు: ఈ పౌలు ఎఫెసులో మాత్రమే కాక, దాదాపు ఆసియా ప్రాంతమంతటా గణనీయమైన జనసమూహాన్ని ఒప్పించి మళ్లించాడు. “చేతులతో తయారైనవి దేవుళ్లు కావు”[a] అని చెబుతూ ఇలా చేశాడు.'
