  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πολλοί τε τῶν πεπιστευκότων ἤρχοντο ἐξομολογούμενοι καὶ ἀναγγέλλοντες τὰς πράξεις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/018.yaml
  text: And many of those who had believed were coming[a], confessing and disclosing their practices.
translation:
  language: te
  text: విశ్వసించినవారిలో చాలామంది వచ్చి, తాము చేసిన వాటిని ఒప్పుకుంటూ వెల్లడించేవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తమ ఆచరణలను’ లేదా ‘తమ క్రియలను’.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοί
  choice: చాలామంది
  rationale: వ్యక్తుల సంఖ్యను సహజమైన ఆధునిక తెలుగులో తెలిపే సంక్షిప్త సమానార్థకం.
- source_word: τε
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది ముందున్న కథనంతో మృదువుగా అనుసంధానించే కణం; తెలుగు వాక్యప్రవాహంలో ప్రత్యేక సంధిపదం లేకుండానే ఆ అనుసంధానం సహజంగా వ్యక్తమవుతుంది.
- source_word: τῶν πεπιστευκότων
  choice: విశ్వసించినవారిలో
  rationale: పరిపూర్ణ కృదంతం ముందుగా విశ్వసించి ఆ స్థితిలో ఉన్నవారిని సూచిస్తుంది; సాంకేతిక సమూహనామాన్ని రుద్దకుండా మూలంలోని వివరణాత్మక రూపాన్ని నిలుపుతుంది.
- source_word: ἤρχοντο
  choice: వచ్చి ... బయటపెట్టేవారు
  rationale: అసంపూర్ణ కాలరూపంలోని కొనసాగుతున్న లేదా పునరావృత గత చర్యను తెలుగు అలవాటు/పునరావృత క్రియారూపమైన ‘-ేవారు’ సహజంగా తెలియజేస్తుంది.
- source_word: ἐξομολογούμενοι
  choice: ఒప్పుకుంటూ
  rationale: తమకు సంబంధించిన విషయాలను అంగీకరించడం లేదా ఒప్పుకోవడం అనే భావాన్ని, ‘పాపాలు’ అని మూలంలో లేని నిర్దిష్టతను చేర్చకుండా అందిస్తుంది.
- source_word: ἀναγγέλλοντες
  choice: బయటపెట్టేవారు
  rationale: తెలియజేయడం లేదా వెల్లడించడం అనే అర్థాన్ని, దాచిన ఆచరణలు బహిర్గతమవుతున్న సందర్భానికి సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὰς πράξεις αὐτῶν
  choice: తాము చేసిన వాటిని
  rationale: πράξεις అనే పదంలోని ‘క్రియలు/చేసిన పనులు/ఆచరణలు’ అనే విస్తృత భావాన్ని ఏకంగా మాంత్రిక ఆచారాలకో పాపాలకో పరిమితం చేయదు.
theological_decisions:
- issue: πεπιστευκότωνను స్థిర సమూహనామంగా అనువదించాలా, లేక ముందుగా జరిగిన విశ్వాస చర్యను సూచించే వివరణగా అనువదించాలా?
  choice: విశ్వసించినవారిలో
  alternative: విశ్వాసులలో
  rationale: గ్రీకు పరిపూర్ణ కృదంతం ముందుగా విశ్వసించి దాని ఫలితస్థితిలో ఉన్నవారిని వివరిస్తుంది; ‘విశ్వాసులు’ అనే స్థిర మతసమూహ పదాన్ని అవసరం లేకుండా రుద్దదు.
- issue: τὰς πράξεις αὐτῶν ప్రత్యేకంగా పాపాలనో మాంత్రిక ఆచారాలనో, లేక సాధారణంగా వారు చేసిన వాటినో సూచిస్తుందా?
  choice: తాము చేసిన వాటిని
  alternative: తమ ఆచరణలను
  rationale: సందర్భం మాంత్రిక కార్యకలాపాలను సూచించినా, గ్రీకు నామవాచకం వాటికన్నా విస్తృతమైనది. ఈ అనువాదం సందర్భానికి వీలు ఇస్తూనే మూలపదాన్ని అతిగా సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘ఒప్పుకుంటూ’ మరియు ‘బయటపెట్టేవారు’ అనే రూపాలు రెండు కృదంతాల భేదాన్ని నిలుపుతాయి; ‘తాము చేసిన వాటిని’ మూలంలోని అర్థవిస్తృతిని కాపాడుతుంది.
