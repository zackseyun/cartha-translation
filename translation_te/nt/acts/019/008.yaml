revisions:
- from: ఆయన సమాజమందిరంలోకి వెళ్లి, మూడు నెలలపాటు ధైర్యంగా మాట్లాడుతూ, దేవుని రాజ్యం గురించి వారితో తర్కించి వారిని ఒప్పించేవాడు.[a]
  to: ఆయన సమాజమందిరంలోకి వెళ్లి, మూడు నెలలపాటు ధైర్యంగా మాట్లాడుతూ, దేవుని రాజ్యం గురించి వారితో చర్చిస్తూ వారిని ఒప్పించేవాడు.[a]
  rationale: The revision retains every source element and the dignified modern narrative register. It clarifies that the kingdom of God was the subject of both the discussion and persuasion, and it renders the concurrent participial action more naturally in Telugu. The footnote retains the possible conative nuance of πείθων without asserting failure in the main text.
