- from: దీనివల్ల మన ఈ వ్యాపారం అపకీర్తి పాలయ్యే ప్రమాదం ఉండడమే కాదు; గొప్ప దేవత అర్తెమి ఆలయం కూడా ఏమీ కానిదిగా పరిగణించబడే ప్రమాదం ఉంది. అంతేకాదు, ఆసియా అంతా, లోకమంతా[a] పూజించే ఆమె వైభవం[b] కూడా దిగజార్చబడబోతోంది.
