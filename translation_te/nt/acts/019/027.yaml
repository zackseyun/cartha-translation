review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the commercial threat, the possible loss of standing of Artemis’s temple, and the reported cultic devotion of Asia and the inhabited world. However, the final clause is more natural and closer to the Greek’s sense of Artemis being stripped of/down from her magnificence when expressed as the loss of her grandeur, rather than treating ‘grandeur’ itself as an entity being lowered.
  naturalness: The Telugu is generally clear and modern. ‘దిగజార్చబడబోతోంది’ with ‘వైభవం’ is somewhat awkward; ‘ఆమె వైభవం తొలగిపోబోతోంది’ is idiomatic while retaining the anticipated-loss sense. A single integrated sentence also better reflects the Greek coordination.
  terminology: ‘వ్యాపారం,’ ‘అపకీర్తి,’ ‘ఆలయం,’ and ‘పూజించే’ are appropriate. ‘అర్తెమిస్’ represents the proper name more directly in modern Telugu; the footnotes appropriately preserve the lexical alternatives for οἰκουμένη and μεγαλειότης.
  issues:
  - severity: low
    issue: The expression ‘ఆమె వైభవం కూడా దిగజార్చబడబోతోంది’ is semantically understandable but stylistically strained in Telugu.
    rationale: The Greek δύσκολη construction concerns Artemis’s exalted grandeur/status being brought down or removed. Telugu naturally expresses this as her grandeur being taken away/lost, without adding a particular agent.
  - severity: low
    issue: The proper name is rendered ‘అర్తెమి’ rather than ‘అర్తెమిస్.’
    rationale: ‘అర్తెమిస్’ more directly reflects Ἄρτεμις and is the broadly recognizable modern form. This is a name-form normalization, not a change in referent.
  revised_text: దీనివల్ల మన ఈ వ్యాపారం అపకీర్తికి గురయ్యే ప్రమాదమే కాదు, గొప్ప దేవత అర్తెమిస్ ఆలయం కూడా ఏమీ కానిదిగా పరిగణించబడే ప్రమాదం ఉంది; అంతేకాక, ఆసియా అంతా, లోకమంతా[a] పూజించే ఆమె వైభవం[b] తొలగిపోబోతోంది.
