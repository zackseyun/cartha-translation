id: ACT.19.27
reference: Acts 19:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ τοῦτο κινδυνεύει ἡμῖν τὸ μέρος εἰς ἀπελεγμὸν ἐλθεῖν, ἀλλὰ καὶ τὸ τῆς μεγάλης θεᾶς ⸂Ἀρτέμιδος ἱερὸν⸃ εἰς οὐθὲν λογισθῆναι, μέλλειν ⸀τε καὶ καθαιρεῖσθαι ⸂τῆς μεγαλειότητος⸃ αὐτῆς, ἣν ὅλη ἡ Ἀσία καὶ ἡ οἰκουμένη σέβεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/027.yaml
  text: And not only is this trade of ours in danger of coming into disrepute, but also the temple of the great goddess Artemis may be counted as nothing, and even her majesty—whom all Asia and the world worships—may be brought down.
translation:
  language: te
  text: దీనివల్ల మన ఈ వ్యాపారం అపకీర్తికి గురయ్యే ప్రమాదమే కాదు, గొప్ప దేవత అర్తెమిస్ ఆలయం కూడా ఏమీ కానిదిగా పరిగణించబడే ప్రమాదం ఉంది; అంతేకాక, ఆసియా అంతా, లోకమంతా[a] పూజించే ఆమె వైభవం[b] తొలగిపోబోతోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నివాసిత ప్రపంచమంతా.’ ఈ గ్రీకు పదం సాధారణంగా జనావాసమున్న ప్రపంచాన్ని, ముఖ్యంగా అప్పటి విస్తృత రోమా ప్రపంచాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆమె ఘనత’ లేదా ‘ఆమె గొప్పతనం.’ ఈ గ్రీకు పదబంధం అర్తెమిస్‌కు ఆపాదించబడిన ఉన్నత స్థానం లేదా వైభవం తొలగిపోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κινδυνεύει
  choice: ప్రమాదం ఉంది
  rationale: ఈ క్రియలో ఉన్న ప్రస్తుత ప్రమాదం లేదా ముప్పు భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὸ μέρος
  choice: మన ఈ వ్యాపారం
  rationale: సందర్భంలో ఇది దేమేత్రియు మరియు ఇతర పనివారి జీవనోపాధికి సంబంధించిన వ్యాపార రంగాన్ని సూచిస్తుంది; కేవలం ‘భాగం’ అనే నైరూప్య అర్థం కాదు.
- source_word: εἰς ἀπελεγμὸν ἐλθεῖν
  choice: అపకీర్తి పాలయ్యే
  rationale: పేరు ప్రతిష్ఠలు కోల్పోయి నిందకు గురికావడం అనే భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: ἱερὸν
  choice: ఆలయం
  rationale: ఎఫెసులోని అర్తెమి పవిత్ర ఆలయ సముదాయాన్ని సాధారణ పాఠకులకు స్పష్టంగా సూచిస్తుంది.
- source_word: εἰς οὐθὲν λογισθῆναι
  choice: ఏమీ కానిదిగా పరిగణించబడే
  rationale: ‘ఏ విలువా లేనిదిగా లెక్కించబడటం’ అనే గ్రీకు మూలంలోని మూల్యాంకన భావాన్ని అతిశయింపకుండా నిలుపుతుంది.
- source_word: μέλλειν τε καὶ καθαιρεῖσθαι
  choice: దిగజార్చబడబోతోంది
  rationale: త్వరలో సంభవించబోయే పతనం మరియు బాహ్యంగా కిందికి దించబడటం అనే రెండు భావాలను తెలుగులో సహజంగా కలుపుతుంది.
- source_word: τῆς μεγαλειότητος αὐτῆς
  choice: ఆమె వైభవం
  rationale: అర్తెమికి ఆపాదించబడిన ఉన్నత స్థానం, ఘనత, శోభ అనే విస్తృత భావాన్ని నిలుపుతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
- source_word: ὅλη ἡ Ἀσία
  choice: ఆసియా అంతా
  rationale: గ్రీకు వాక్యంలోని అలంకారపూర్వక విస్తృతిని నిలుపుతూ, సందర్భంలోని రోమా ప్రావిన్సు ఆసియాను సూచిస్తుంది.
- source_word: ἡ οἰκουμένη
  choice: లోకమంతా
  rationale: నివాసిత ప్రపంచం, ముఖ్యంగా అప్పటి విస్తృత రోమా ప్రపంచం అనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; మరింత అక్షరార్థాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: σέβεται
  choice: పూజించే
  rationale: అర్తెమి ఆరాధనకు సంబంధించిన మతపరమైన గౌరవాన్ని ‘పూజ’ స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: అన్యదేవతకు సంబంధించిన మతపరమైన భాషను మృదువుగా చేయకుండా, అలాగే సమర్థిస్తున్నట్లు చూపకుండా అనువదించడం
  choice: గొప్ప దేవత అర్తెమి ... పూజించే
  alternative: ‘గొప్పదని పిలవబడే దేవత అర్తెమి ... గౌరవించే’
  rationale: ఇది దేమేత్రియు పలికిన మాటలను నివేదిస్తుంది. గ్రీకులో లేని దూరీకరణ పదాలను చేర్చకుండా అతని దృష్టికోణాన్ని యథాతథంగా నిలుపుతుంది; అనువాదం ఆ వాదనను స్వయంగా సమర్థించదు.
- issue: τῆς μεγαλειότητος‌తో καθαιρεῖσθαι కలయికలోని వ్యాకరణ-అర్థ క్లిష్టత
  choice: ఆమె వైభవం కూడా దిగజార్చబడబోతోంది
  alternative: ఆమె తన ఘనతను కోల్పోబోతోంది
  rationale: గ్రీకు నిర్మాణం అర్తెమి యొక్క ఘనత లేదా ఉన్నత స్థానం కిందికి దించబడుతుందని సూచిస్తుంది. కర్తృత్వాన్ని లేదా నష్టపు విధానాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా కర్మణి భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన నివేదిక శైలిని ఉపయోగించాం. దేమేత్రియు భయాన్ని తెలియజేసే అలంకారపూర్వక విస్తృతిని నిలుపుతూ, దీర్ఘమైన గ్రీకు వాక్యాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించాం.
