source:
  edition: SBLGNT
  text: ἦσαν δέ ⸀τινος Σκευᾶ Ἰουδαίου ἀρχιερέως ἑπτὰ ⸀υἱοὶ τοῦτο ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/014.yaml
  text: There were seven sons of a Jewish chief priest named Sceva doing this[a].
translation:
  language: te
  text: స్కేవ అనే ఒక యూదుడైన ప్రధాన యాజకునికి ఏడుగురు కుమారులు ఉండేవారు; వారు ఇలా చేస్తుండేవారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మహాయాజకుడు.’ గ్రీకు పదం మహాయాజకుడిని లేదా విస్తృతార్థంలో ప్రధాన యాజకుడిని లేదా ప్రధాన యాజక వర్గానికి చెందిన వ్యక్తిని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν δέ
  choice: ఉండేవారు / చేస్తుండేవారు
  rationale: δέ కథనాన్ని కొనసాగిస్తుంది; తెలుగులో ప్రత్యేక కాలసూచక పదాన్ని చేర్చకుండా వాక్య నిర్మాణంలోనే దాని కొనసాగింపు భావాన్ని సహజంగా వ్యక్తం చేశాం. ἦσαν మరియు వర్తమాన కృదంతం కలిసి కొనసాగుతున్న చర్యను సూచిస్తున్నందున ‘చేస్తుండేవారు’గా మలిచాం.
- source_word: τινος Σκευᾶ
  choice: స్కేవ అనే
  rationale: τινος ఇక్కడ అంతకుముందు పరిచయం చేయని వ్యక్తిని సూచిస్తుంది. ‘ఒకానొక స్కేవ’ అనే కృత్రిమ రూపం కంటే ‘స్కేవ అనే’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: Ἰουδαίου
  choice: యూద
  rationale: ఇక్కడ భౌగోళిక మూలం కంటే జాతి-మత గుర్తింపే ప్రధానంగా ఉన్నందున ‘యూద’ అని అనువదించాం.
- source_word: ἀρχιερέως
  choice: ప్రధాన యాజకుని
  rationale: ఈ గ్రీకు పదం మహాయాజకుడినీ, విస్తృతార్థంలో ప్రధాన యాజక వర్గానికి చెందిన వ్యక్తినీ సూచించగలదు. స్కేవ యెరూషలేము ఏకైక మహాయాజకుడని నిర్ధారించకుండా ఉండేందుకు ‘ప్రధాన యాజకుడు’ను ప్రధాన పాఠంలో ఉంచాం.
- source_word: ἑπτὰ υἱοὶ
  choice: ఏడుగురు కుమారులు
  rationale: సంఖ్యనూ కుటుంబ సంబంధాన్నీ స్పష్టమైన, సహజమైన తెలుగు క్రమంలో నిలిపాం.
- source_word: τοῦτο ποιοῦντες
  choice: ఇలా చేస్తుండేవారు
  rationale: τοῦτο ముందటి సందర్భంలో చెప్పిన చర్యను సూచిస్తుంది; వర్తమాన కృదంతం కొనసాగుతున్న లేదా అలవాటైన చర్యను తెలియజేస్తుంది.
theological_decisions:
- issue: స్కేవకు వర్తించిన ἀρχιερεύς పదం యొక్క అర్థం
  choice: ప్రధాన యాజకుడు
  alternative: మహాయాజకుడు
  rationale: ἀρχιερεύς ఏకైక మహాయాజకుని సూచించగలిగినా, ప్రధాన యాజక వర్గంలోని వ్యక్తిని కూడా సూచించవచ్చు. స్కేవ చారిత్రకంగా ఏకైక మహాయాజకుడని తెలియనందున, పాఠం నిర్ధారించని సంస్థాగత హోదాను ఆపాదించకుండా ‘ప్రధాన యాజకుడు’ను ఎంచుకుని ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని కొనసాగుతున్న చర్యను ‘చేస్తుండేవారు’తో వ్యక్తం చేశాం; మూలంలో లేని ‘ఇప్పుడు’ వంటి కాలసూచక పదాన్ని చేర్చలేదు.
