id: ACT.19.31
reference: Acts 19:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τινὲς δὲ καὶ τῶν Ἀσιαρχῶν, ὄντες αὐτῷ φίλοι, πέμψαντες πρὸς αὐτὸν παρεκάλουν μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/031.yaml
  text: And even some of the Asiarchs[a], being his friends[c][b], sent word to him and urged him not to venture into the theater.
translation:
  language: te
  text: ఆసియార్కులలో[a] కొందరు కూడా పౌలుకు స్నేహితులై ఉండి, ఆయనకు సందేశం పంపి, నాటకశాలలోకి వెళ్లవద్దని వేడుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఆసియార్కులు” అనేవారు రోమా సామ్రాజ్యంలోని ఆసియా ప్రావిన్సుతో సంబంధమున్న ప్రముఖ అధికారులు.
    reason: cultural_note
lexical_decisions:
- source_word: τινὲς δὲ καὶ
  choice: కొందరు కూడా
  rationale: నిర్దిష్టం కాని కొందరిని సూచించే τινὲς భావాన్ని, ఆశ్చర్యకరమైన అదనాన్ని సూచించే καὶ భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; δέ కథన కొనసాగింపులో అంతర్లీనంగా ఉంది.
- source_word: τῶν Ἀσιαρχῶν
  choice: ఆసియార్కులలో[a]
  rationale: రోమా సామ్రాజ్యంలోని ఆసియా ప్రాంతంతో సంబంధమున్న ప్రముఖ అధికారుల సాంకేతిక బిరుదును లిప్యంతరీకరించి, విభక్తి భావాన్ని ‘లో’తో స్పష్టం చేసింది.
- source_word: ὄντες αὐτῷ φίλοι
  choice: పౌలుకు స్నేహితులై ఉండి
  rationale: పూర్వపదంలోని ఏకవచన సర్వనామం సందర్భానుసారంగా పౌలును సూచిస్తుంది; నేపథ్య సంబంధాన్ని కృదంత నిర్మాణంతో నిలుపుతుంది.
- source_word: πέμψαντες πρὸς αὐτὸν
  choice: ఆయన దగ్గరికి కబురు పంపించి
  rationale: గ్రీకులో పంపబడిన వస్తువు వ్యక్తంగా లేకున్నా, సందర్భంలో సందేశాన్ని పంపారనే భావాన్ని సహజ తెలుగులో ‘కబురు’తో తెలియజేస్తుంది.
- source_word: παρεκάλουν
  choice: వేడుకున్నారు
  rationale: παρακαλέω ఇక్కడ గంభీరమైన విజ్ఞప్తిని సూచిస్తుంది; అసంపూర్ణ భూతకాలంలోని కొనసాగింపు ఛాయను తెలుగు క్రియా సందర్భానుసారంగా మోయగలదు.
- source_word: μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον
  choice: నాటకశాలలోకి వెళ్లి తనను తాను ప్రమాదానికి గురిచేసుకోవద్దని
  rationale: పదశః ‘తనను తాను నాటకశాలలోకి ఇవ్వకూడదు’ అనే అసహజ నిర్మాణానికి బదులు, ఆ ప్రదేశంలోకి ప్రవేశించి ప్రమాదానికి బహిర్గతం కావద్దనే సందర్భార్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. సాంకేతిక బిరుదైన ‘ఆసియార్కులు’ను నిలిపి సాంస్కృతిక వివరణను పాదటిప్పణిలో ఇచ్చాం; θέατρον‌ను ఆధునిక వినోదశాలగా అపార్థం కాకుండా ప్రాచీన ప్రజాసమూహ వేదికకు సాధారణంగా సరిపోయే ‘నాటకశాల’గా అనువదించాం.
