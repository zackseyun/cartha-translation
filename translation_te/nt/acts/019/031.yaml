    text: “ఆసియార్కులు” అనేవారు రోమా సామ్రాజ్యంలోని ఆసియా ప్రావిన్సుతో సంబంధమున్న ప్రముఖ అధికారులు.
    reason: cultural_note
  revision_rationale: The revision removes the interpretive addition that Paul would explicitly put himself in danger, while naturally conveying the Greek idiom as a warning not to enter the theater. It also uses standard-neutral wording for the message and makes the historical note more precise.
