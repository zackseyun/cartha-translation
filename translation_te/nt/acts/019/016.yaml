    issue: The rendering ‘తప్పించుకొని పారిపోయారు’ is redundant for ἐκφυγεῖν, and footnote c (‘లేదా ఆ ఇంటి నుండి తప్పించుకున్నారు’) substantially repeats part of the main rendering rather than supplying an alternative.
    rationale: ἐκφυγεῖν denotes escaping/fleeing away. A single primary Telugu verb should be used, with the other natural option placed in the footnote. This also makes footnote c meaningful and correctly anchored.
