  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀ἐφαλόμενος ⸂ὁ ἄνθρωπος ἐπ’ αὐτοὺς⸃ ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρὸν ⸂κατακυριεύσας ἀμφοτέρων⸃ ἴσχυσεν κατ’ αὐτῶν, ὥστε γυμνοὺς καὶ τετραυματισμένους ἐκφυγεῖν ἐκ τοῦ οἴκου ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/016.yaml
  text: And the man in whom the evil spirit was leaped on them[a], and after overpowering both of them, prevailed against them[c][b], so that they fled out of that house naked and wounded.
translation:
  language: te
  text: దుష్టాత్మ ఉన్న ఆ మనిషి వారిమీదికి దూకిపడి[a], వారిద్దరినీ[b] లొంగదీసుకొని, వారిపై పైచేయి సాధించాడు. దాంతో వారు బట్టలు లేకుండా, గాయపడి ఆ ఇంటి నుండి తప్పించుకున్నారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారిమీదికి ఎగిరిపడి.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో, ‘వారిద్దరినీ.’ విస్తృత సందర్భంలో స్కేవ కుమారులు ఇద్దరికంటే ఎక్కువమంది ప్రస్తావించబడినా, ఇక్కడ మూలపాఠం స్పష్టంగా ‘ఇద్దరినీ’ అంటుంది; అందువల్ల ఆ పదప్రయోగం అనువాదంలో నిలుపబడింది.
    reason: alternative_reading
  - marker: c
    text: లేదా, ‘ఆ ఇంటి నుండి పారిపోయారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφαλόμενος
  choice: వారిమీదికి దూకిపడి
  rationale: ఈ భూతకాల కృదంతం ఆకస్మికంగా మీదికి దూకి దాడి చేయడాన్ని సూచిస్తుంది. ‘దూకిపడి’ ఆ హింసాత్మక, వేగవంతమైన కదలికను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ ἄνθρωπος
  choice: ఆ మనిషి
  rationale: ఇది పురుషలింగ ఏకవచనం; సందర్భంలో దుష్టాత్మ ఉన్న పురుషుణ్ణి సూచిస్తుంది.
- source_word: ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρόν
  choice: దుష్టాత్మ ఉన్న
  rationale: ఆత్మ ఆ మనిషిలో ఉందని గ్రీకు వాక్యం నేరుగా చెబుతుంది. సాంకేతికమైన ‘ఆవహించబడిన’ అనే పదాన్ని చేర్చకుండా మూలంలోని వర్ణనను నిలుపుతుంది.
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: దుష్టాత్మ
  rationale: భూతవైద్య సందర్భంలో πονηρόν ఆ ఆత్మను చెడ్డది లేదా హానికరమైనదిగా పేర్కొంటుంది; ‘దుష్టాత్మ’ స్పష్టమైన, సుపరిచితమైన తెలుగు ప్రయోగం.
- source_word: κατακυριεύσας
  choice: లొంగదీసుకొని
  rationale: ఈ పదం వారిపై ఆధిపత్యం సంపాదించి వారిని అదుపులోకి తెచ్చిన భావాన్ని ఇస్తుంది. తరువాతి ‘పైచేయి సాధించాడు’తో ఉన్న భావభేదాన్ని కూడా నిలుపుతుంది.
- source_word: ἀμφοτέρων
  choice: వారిద్దరినీ
  rationale: మూలపాఠం స్పష్టంగా ‘ఇద్దరినీ’ అంటుంది. విస్తృత సందర్భంతో కనిపించే ఉద్రిక్తతను సరిచేయకుండా సంఖ్యను యథాతథంగా ఉంచుతుంది.
- source_word: ἴσχυσεν κατ’ αὐτῶν
  choice: వారిపై పైచేయి సాధించాడు
  rationale: వారికంటే బలవంతుడై వారిని జయించిన భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ముందున్న ‘లొంగదీసుకొని’ అనే కృదంతంలో దీనిని కలిపివేయదు.
- source_word: γυμνούς
  choice: బట్టలు లేకుండా
  rationale: γυμνούς వారి నగ్న స్థితిని సూచిస్తుంది. సాధారణ పాఠకులకు సహజంగా, మర్యాదగా అర్థమయ్యేలా ‘బట్టలు లేకుండా’ అని అనువదించబడింది.
- source_word: τετραυματισμένους
  choice: గాయాలతో
  rationale: వారు గాయపడి ఆ స్థితిలోనే ఉన్నారని సంపూర్ణ కర్మణి కృదంతం సూచిస్తుంది; ‘గాయాలతో’ ఫలిత స్థితిని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἐκφυγεῖν
  choice: తప్పించుకొని పారిపోయారు
  rationale: ఈ పదంలో ప్రమాదం నుంచి తప్పించుకోవడం, అక్కడి నుంచి వేగంగా వెళ్లిపోవడం అనే రెండు భావాలూ ఉన్నాయి. తెలుగు జంటప్రయోగం రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκ τοῦ οἴκου ἐκείνου
  choice: ఆ ఇంటి నుండి
  rationale: ఇప్పుడే ప్రస్తావించిన నిర్దిష్ట ఇంటి నుంచి వారు బయటకు వెళ్లిన దిశను నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: దుష్టాత్మ మనిషిలో ఉండడాన్ని ఎలా వ్యక్తం చేయాలి
  choice: దుష్టాత్మ ఉన్న ఆ మనిషి
  alternative: దుష్టాత్మ ఆవహించిన ఆ మనిషి
  rationale: గ్రీకు పాఠం ఆత్మ అతనిలో ఉందని వర్ణిస్తుంది. ‘ఆవహించిన’ అనే తరువాతి సాంకేతిక పదప్రయోగాన్ని రుద్దకుండా మూలంలోని భాషను దగ్గరగా నిలుపుతుంది.
- issue: విస్తృత సమూహానికి సంబంధించి ἀμφοτέρων పరిధి
  choice: వారిద్దరినీ
  alternative: వారందరినీ
  rationale: ముందటి సందర్భంలో స్కేవ కుమారులు ఎక్కువమంది ప్రస్తావించబడినా, ఇక్కడ గ్రీకు పాఠం స్పష్టంగా ‘ఇద్దరినీ’ అంటుంది. కథనంలోని ఉద్రిక్తతను నిశ్శబ్దంగా తొలగించకుండా మూలపాఠంలోని సంఖ్యను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. గ్రీకు వాక్యంలోని చర్యల క్రమం—దూకిపడడం, ఇద్దరినీ లొంగదీసుకోవడం, పైచేయి సాధించడం, వారు తప్పించుకొని పారిపోవడం—స్పష్టంగా నిలుపబడింది. పొడవైన గ్రీకు వాక్యాన్ని తెలుగు పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించారు.
