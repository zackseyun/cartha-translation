source:
  edition: SBLGNT
  text: καὶ ἐπιθέντος αὐτοῖς τοῦ ⸀Παύλου χεῖρας ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτούς, ἐλάλουν τε γλώσσαις καὶ ἐπροφήτευον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/006.yaml
  text: And when Paul laid his hands on them[a], the Holy Spirit came upon them, and they began speaking in tongues and prophesying.
translation:
  language: te
  text: పౌలు వారి మీద చేతులు ఉంచినప్పుడు, పరిశుద్ధాత్మ వారిమీదికి వచ్చాడు. అప్పుడు వారు భాషలలో[a] మాట్లాడారు, ప్రవచించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘భాషలు’గా అనువదించిన గ్రీకు పదానికి ‘నాలుకలు’ లేదా ‘భాషలు’ అనే అర్థాలు రావచ్చు. ఈ వచనం ఆ మాటలు తెలిసిన మానవ భాషలా, లేక మరొక విధమైన ఆత్మప్రేరిత మాటలా అన్నది స్పష్టంగా తేల్చదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθέντος αὐτοῖς τοῦ Παύλου χεῖρας
  choice: పౌలు వారి మీద చేతులు ఉంచినప్పుడు
  rationale: గ్రీకు జనిటివ్ అబ్సల్యూట్‌లోని కాలసంబంధాన్ని సహజమైన తెలుగు ఉపవాక్యంగా వ్యక్తం చేస్తూ, ‘చేతులు ఉంచడం’ అనే మూలభాషా నుడికారాన్ని నిలిపింది.
- source_word: ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτούς
  choice: పరిశుద్ధాత్మ వారి మీదికి వచ్చాడు
  rationale: ἦλθε మరియు ἐπίలోని రాక, దిశ భావాలను సహజంగా తెలియజేస్తుంది; సంఘటనకు అదనపు సిద్ధాంతపరమైన కారణవివరణను జోడించదు.
- source_word: ἐλάλουν τε γλώσσαις
  choice: భాషలతో మాట్లాడసాగారు
  rationale: తెలుగు క్రైస్తవ వాడుకలో ‘భాషలతో మాట్లాడడం’ అనే పదబంధం γλώσσαις యొక్క అర్థపరిధిని పూర్తిగా ఒకే వ్యాఖ్యానానికి పరిమితం చేయకుండా ఉంటుంది. ‘సాగారు’ కథనంలోని అపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న లేదా ఆరంభమైన చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ ἐπροφήτευον
  choice: ప్రవచించసాగారు
  rationale: క్రియ యొక్క ప్రవచనాత్మక మాటల భావాన్ని నేరుగా అందిస్తూ, ముందున్న అపూర్ణ భూతకాల క్రియతో సమాంతరమైన కొనసాగింపు/ఆరంభ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: Acts 19:6లో γλώσσαις స్వభావం
  choice: ప్రధాన పాఠ్యంలో ‘భాషలతో’ అని ఉంచి, పాదసూచికలో ‘నాలుకలతో’ అనే ప్రత్యామ్నాయాన్ని ఇవ్వడం
  alternative: ‘తెలిసిన ఇతర భాషల్లో’ అని స్పష్టీకరించడం లేదా ‘పరవశ భాషలో’ అని వ్యాఖ్యానించడం
  rationale: γλῶσσα అనే గ్రీకు పదం నాలుకను గానీ భాషను గానీ సూచించగలదు. ఈ వచనం మాత్రమే ఆ మాటల ఖచ్చిత స్వభావాన్ని నిర్ణయించదు; అందువల్ల వివాదాస్పద సిద్ధాంతపరమైన నిర్ణయాన్ని అనువాదంలోకి చేర్చలేదు.
- issue: పరిశుద్ధాత్మ రావడం మరియు పౌలు చేతులు ఉంచడం మధ్య సంబంధం
  choice: కాలక్రమాన్ని మాత్రమే తెలిపే ‘ఉంచినప్పుడు ... వచ్చాడు’ అనే నిర్మాణం
  alternative: చేతులు ఉంచినందువల్ల పరిశుద్ధాత్మ వచ్చాడని కారణార్థకంగా అనువదించడం
  rationale: గ్రీకు నిర్మాణం సంఘటనల కాలసంబంధాన్ని తెలియజేస్తుంది; వాటి సంపూర్ణ సిద్ధాంతపరమైన లేదా సాక్రమెంటల్ కారణసంబంధాన్ని వివరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘పరిశుద్ధాత్మ,’ ‘ప్రవచించడం’ వంటి స్థిరపడిన బైబిలు పదాలను ఉంచి, వాక్యనిర్మాణాన్ని సహజంగా తీర్చిదిద్దాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘భాషలతో’ అన్న పదం దగ్గరే ఉంచాం.
