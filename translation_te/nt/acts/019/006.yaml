revisions:
- from: 'పౌలు వారి మీద చేతులు ఉంచినప్పుడు, పరిశుద్ధాత్మ వారి మీదికి వచ్చాడు. అప్పుడు వారు భాషలతో[a] మాట్లాడసాగారు, ప్రవచించసాగారు.


    [a] లేదా, “నాలుకలతో.” ఇక్కడి గ్రీకు పదానికి “నాలుకలు” లేదా “భాషలు” అనే అర్థాలు రావచ్చు; ఈ వచనం ఆ మాటలు తెలిసిన మానవ భాషలా, మరొక విధమైన ఆత్మప్రేరిత మాటలా అన్నది స్పష్టంగా తేల్చదు.'
  to: పౌలు వారి మీద చేతులు ఉంచినప్పుడు, పరిశుద్ధాత్మ వారిమీదికి వచ్చాడు. అప్పుడు వారు భాషలలో[a] మాట్లాడారు, ప్రవచించారు.
  rationale: The revision removes the unnecessarily explicit ‘began’ sense, improves the idiom for speaking languages, and recasts the footnote so that it accurately records the Greek lexical ambiguity without imposing an interpretation or offering an unnatural Telugu contextual alternative.
