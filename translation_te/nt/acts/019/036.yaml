  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀναντιρρήτων οὖν ὄντων τούτων δέον ἐστὶν ὑμᾶς κατεσταλμένους ὑπάρχειν καὶ μηδὲν προπετὲς πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/036.yaml
  text: Therefore[a], since these things are undeniable[c][b], it is necessary for you to remain calm and to do nothing rash.
translation:
  language: te
  text: కాబట్టి, ఈ విషయాలు కాదనలేనివి[a] గనుక, మీరు ప్రశాంతంగా ఉండాలి[b]; తొందరపడి ఏ పనీ చేయకూడదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వివాదానికి తావులేనివి,” “ఖండించలేనివి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నిగ్రహంతో ఉండాలి,” “శాంతంగా ఉండాలి.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “దుడుకుగా ఏ పనీ చేయకూడదు,” “హఠాత్తుగా ఏ పనీ చేయకూడదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναντιρρήτων
  choice: కాదనలేనివి
  rationale: వ్యతిరేకంగా వాదించడానికి లేదా ఖండించడానికి వీలులేని విషయాలు అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాదన నుంచి వచ్చే నిర్ధారణను స్పష్టంగా సూచిస్తుంది.
- source_word: ὄντων τούτων
  choice: ఈ విషయాలు ... గనుక
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణంలోని కారణార్థాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: δέον ἐστίν
  choice: ఉండాలి ... చేయకూడదు
  rationale: అవసరం లేదా బాధ్యతను తెలుగులో సహజమైన విధ్యర్థక రూపాలతో వ్యక్తపరుస్తుంది.
- source_word: κατεσταλμένους ὑπάρχειν
  choice: ప్రశాంతంగా ఉండాలి
  rationale: కేవలం మౌనంగా ఉండడం కాకుండా, ఉద్రేకం తగ్గి నిగ్రహంతో ఉన్న స్థితిని సూచిస్తుంది.
- source_word: μηδὲν προπετὲς πράσσειν
  choice: తొందరపడి ఏ పనీ చేయకూడదు
  rationale: ఆలోచించకుండా హఠాత్తుగా లేదా దుడుకుగా వ్యవహరించవద్దనే హెచ్చరికను సహజంగా అందిస్తుంది.
