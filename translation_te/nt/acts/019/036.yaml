translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పట్టణ అధికారి జనసమూహాన్ని అదుపు చేసే గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని కారణం, అవసరం, మరియు తొందరపాటు చర్యకు వ్యతిరేకమైన హెచ్చరికను క్రమంగా నిలిపాం.
