translation:
  language: te
  text: వారంతా కలిపి దాదాపు పన్నెండు మంది పురుషులు ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦσαν
  choice: '[సందర్భానుసారంగా తెలుగులో ప్రత్యేకంగా అనువదించలేదు]'
  rationale: గ్రీకులో ఉన్న ‘వారు ఉన్నారు’ అనే క్రియను సంఖ్యను తెలిపే సహజ తెలుగు నామవాక్యంలో విడిగా వ్యక్తపరచాల్సిన అవసరం లేదు; వాక్యార్థం పూర్తిగా నిలుస్తుంది.
- source_word: δὲ
  choice: '[అనువదించలేదు]'
  rationale: δέ ఇక్కడ స్వల్ప అనుసంధానక పదం మాత్రమే; స్పష్టమైన వ్యతిరేకతను సూచించదు. తెలుగులో దాన్ని చేర్చకపోవడం సహజంగా ఉంటుంది.
- source_word: οἱ πάντες
  choice: వారంతా కలిపి
  rationale: మొత్తం గుంపు సంఖ్యను సంగ్రహంగా తెలిపే భావాన్ని సహజ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἄνδρες
  choice: పురుషులు
  rationale: ἀνήρ ఇక్కడ సాధారణంగా ప్రజలను కాక పురుషులను నిర్దిష్టంగా సూచిస్తుంది; అందువల్ల లింగార్థాన్ని నిలిపాం.
- source_word: ὡσεὶ
  choice: దాదాపు
  rationale: సంఖ్య సుమారుగా ఉందనే భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: δώδεκα
  choice: పన్నెండు మంది
  rationale: సంఖ్యను వ్యక్తులకు తగిన తెలుగు వర్గసూచకమైన ‘మంది’తో సహజంగా వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. మూలంలోని పురుష లింగ సూచనను, సుమారు సంఖ్య అనే భావాన్ని నిలిపింది.
