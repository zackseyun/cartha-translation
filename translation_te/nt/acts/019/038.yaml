translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయపరమైన శైలి వాడబడింది. ‘రోమా ప్రాంతాధిపతులు’ సాధారణ పాఠకునికి పదవి అర్థమయ్యేలా చేస్తుంది; సాంకేతిక పేరు పాదసూచికలో నిలుపబడింది. మూలంలోని బహువచనం మరియు పరస్పర అభియోగ భావం మార్చకుండా ఉంచబడ్డాయి.
