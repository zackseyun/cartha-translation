- from: కాబట్టి దేమేత్రియుకు, అతనితో ఉన్న చేతివృత్తులవారికి ఎవరి మీదైనా ఫిర్యాదు ఉంటే, న్యాయవిచారణ సమావేశాలు జరుగుతున్నాయి[a], రోమా ప్రాంతాధిపతులు ఉన్నారు[b]; వారు ఒకరిపై ఒకరు అభియోగాలు మోపుకోవాలి.
