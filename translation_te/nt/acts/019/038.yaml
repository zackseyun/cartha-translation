source:
  edition: SBLGNT
  text: εἰ μὲν οὖν Δημήτριος καὶ οἱ σὺν αὐτῷ τεχνῖται ἔχουσιν πρός τινα λόγον, ἀγοραῖοι ἄγονται καὶ ἀνθύπατοί εἰσιν, ἐγκαλείτωσαν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/038.yaml
  text: If[a], then, Demetrius and the craftsmen with him have a complaint against anyone, court sessions are being held and there are proconsuls[b]; let them bring charges against one another.
translation:
  language: te
  text: కాబట్టి దేమేత్రియుకూ అతనితో ఉన్న వృత్తిదారులకూ ఎవరిమీదైనా ఫిర్యాదు ఉంటే, న్యాయసభలు జరుగుతున్నాయి[a], ప్రోకాన్సులులు ఉన్నారు[b]; వారు ఒకరిపై ఒకరు అభియోగాలు మోపాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “న్యాయస్థానాలు సమావేశంలో ఉన్నాయి.” ἀγοραῖοι ἄγονται అనే గ్రీకు ప్రయోగం అధికారికంగా నిర్వహించబడే న్యాయవిచారణ సమావేశాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ప్రోకాన్సులులు అందుబాటులో ఉన్నారు” లేదా “ప్రోకాన్సులులు హాజరుగా ఉన్నారు.” మూలంలోని బహువచనం సాధారణ పరిపాలనా అర్థంలో ప్రాంతీయ అధికార పదవిని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: కాబట్టి ... ఉంటే
  rationale: οὖν యొక్క నిర్ధారణాత్మక-సంధాన భావాన్ని ‘కాబట్టి’ తెలియజేస్తుంది; εἰ యొక్క షరతును ‘ఉంటే’ సహజమైన తెలుగు వాక్యనిర్మాణంలో ఉంచుతుంది. μένను విడిగా బరువుగా అనువదించకుండా వాక్యప్రవాహంలో ప్రతిఫలింపజేసింది.
- source_word: Δημήτριος
  choice: దేమేత్రియు
  rationale: గ్రీకు వ్యక్తినామాన్ని ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చింది; విభక్తితో ‘దేమేత్రియుకు’ అయింది.
- source_word: οἱ σὺν αὐτῷ τεχνῖται
  choice: అతనితో ఉన్న చేతివృత్తులవారు
  rationale: τεχνῖται నైపుణ్యంతో చేతిపని చేసే వృత్తిదారులను సూచిస్తుంది. ‘అతనితో ఉన్న’ అనేది σὺν αὐτῷను వారి సంబంధాన్ని మరింత నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: ἔχουσιν πρός τινα λόγον
  choice: ఎవరి మీదైనా ఫిర్యాదు ఉంటే
  rationale: ఈ న్యాయపరమైన నుడికారం ఒక వ్యక్తిపై ఉన్న వివాదం లేదా చట్టబద్ధమైన ఫిర్యాదును సూచిస్తుంది; ‘ఫిర్యాదు’ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τινα
  choice: ఎవరి మీదైనా
  rationale: సాధారణ న్యాయపద్ధతిని తెలిపే సందర్భంలో అనిర్దిష్ట వ్యక్తిని సహజంగా సూచిస్తుంది.
- source_word: ἀγοραῖοι ἄγονται
  choice: న్యాయవిచారణ సమావేశాలు జరుగుతున్నాయి
  rationale: అధికారికంగా నిర్వహించబడే న్యాయవిచారణ సమయాలు లేదా సమావేశాలను సూచించే గ్రీకు ప్రయోగం. ఈ అనువాదం సంస్థాగత భావాన్నీ, క్రియ యొక్క కర్మణి రూపాన్నీ సహజంగా నిలుపుతుంది.
- source_word: ἀνθύπατοί εἰσιν
  choice: రోమా ప్రాంతాధిపతులు ఉన్నారు
  rationale: ἀνθύπατοι అనేది రోమా పరిపాలనలోని ‘ప్రోకాన్సుల్’ పదవిని సూచిస్తుంది. సాధారణ పాఠకునికి అర్థమయ్యేలా పదవి యొక్క కార్యార్థాన్ని ఇచ్చి, మూలంలోని బహువచనాన్ని నిలిపింది.
- source_word: ἐγκαλείτωσαν
  choice: అభియోగాలు మోపుకోవాలి
  rationale: న్యాయపరంగా ఆరోపణ లేదా అభియోగం తీసుకురావాలనే తృతీయ పురుష ఆజ్ఞార్థక భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἀλλήλοις
  choice: ఒకరిపై ఒకరు
  rationale: పరస్పర సర్వనామంలోని పరస్పర న్యాయవిరోధ భావాన్ని స్పష్టంగా నిలుపుతుంది.
