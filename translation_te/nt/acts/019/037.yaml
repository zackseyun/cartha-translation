id: ACT.19.37
reference: Acts 19:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἠγάγετε γὰρ τοὺς ἄνδρας τούτους οὔτε ἱεροσύλους οὔτε βλασφημοῦντας τὴν θεὸν ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/037.yaml
  text: For you have brought these men here who are neither temple robbers nor blasphemers of our goddess[a].
translation:
  language: te
  text: ఎందుకంటే, మీరు తీసుకొచ్చిన ఈ మనుషులు దేవాలయాలను దోచేవారు కారు; మన దేవతను దూషించేవారూ కారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγάγετε
  choice: మీరు ఇక్కడికి తీసుకొచ్చిన
  rationale: ἄγω యొక్క భూతకాల క్రియను సందర్భానికి సహజంగా ‘తీసుకొచ్చిన’ అని అనువదించాం; సభాస్థలానికి వారిని తీసుకురావడమే ఉద్దేశం.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు కారణాన్ని పరిచయం చేసే వివరణాత్మక బలాన్ని స్పష్టంగా చూపుతుంది.
- source_word: τοὺς ἄνδρας τούτους
  choice: ఈ మనుషులు
  rationale: ἀνήρ ఇక్కడ వయోజన పురుషులను సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఈ మనుషులు’ సహజంగా ఉంది. ‘ఇక్కడికి’ అనేది తీసుకురావడం జరిగిన సభాస్థలాన్ని స్పష్టం చేస్తుంది.
- source_word: οὔτε ... οὔτε
  choice: కారు; ... వారూ కారు
  rationale: గ్రీకు పరస్పర నిరాకరణ నిర్మాణాన్ని సహజమైన తెలుగు సమాంతర నిర్మాణంతో నిలిపాం.
- source_word: ἱεροσύλους
  choice: దేవాలయ దోపిడీదారులు
  rationale: పవిత్ర స్థలాన్ని అపవిత్రపరచడం అనే విస్తృత భావం సాధ్యమైనప్పటికీ, ఈ పదం ప్రధానంగా దేవాలయాల నుంచి దోచేవారిని సూచిస్తుంది; కాబట్టి నిర్దిష్టమైన ఈ పదబంధాన్ని ఎంచుకున్నాం.
- source_word: βλασφημοῦντας
  choice: దూషించేవారు
  rationale: దేవతకు వ్యతిరేకంగా అవమానకరంగా మాట్లాడడాన్ని సూచించే క్రియాత్మక రూపం; తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: τὴν θεὸν ἡμῶν
  choice: మన దేవతను
  rationale: θεός రూపం ఇక్కడ ఆర్టెమిసును సూచిస్తుంది. ఆడ దేవత అనే సందర్భార్థాన్ని తెలుగు ‘దేవత’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఆర్టెమిసును సూచించే τὴν θεὸν ἡμῶν అనువాదం
  choice: మన దేవతను
  alternative: మన దేవుణ్ణి
  rationale: వక్త ఎఫెసు పట్టణపు అన్యమత అధికారి; సందర్భంలో ఉద్దేశించబడింది ఆర్టెమిసే. ‘దేవత’ అనడం సందర్భార్థాన్ని స్పష్టం చేస్తుంది; ఇది ఆ దేవతను సమర్థించే వేదాంత ప్రకటన కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బహిరంగ సభలో అధికారి చెప్పే మాటలకు తగిన గౌరవప్రదమైన కానీ సులభంగా అర్థమయ్యే శైలి. మూలంలోని కారణసూచకతను, రెండు సమాంతర నిరాకరణలను నిలిపాం.
