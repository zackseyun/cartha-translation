revisions:
- from: కాబట్టి కొందరు ఒకటి, మరికొందరు మరొకటి కేకలు వేస్తూ ఉన్నారు. సభ[a] గందరగోళంగా ఉంది; అక్కడికి ఎందుకు కూడివచ్చారో వారిలో చాలామందికి తెలియదు.
  to: కాబట్టి కొందరు ఒకటి, మరికొందరు మరొకటి కేకలు వేస్తూ ఉన్నారు. సభ[a] గందరగోళంగా ఉంది; తాము ఎందుకు కూడివచ్చారో వారిలో ఎక్కువమందికి తెలియదు.
  rationale: The revision preserves the draft’s sound rendering of the ongoing cries and the civic ‘assembly,’ while replacing ‘చాలామందికి’ with ‘ఎక్కువమందికి’ to convey the Greek sense of a majority. It also removes an unneeded locative addition. The footnote is retained with a minor stylistic refinement.
