id: ACT.19.32
reference: Acts 19:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον, ἦν γὰρ ἡ ἐκκλησία συγκεχυμένη, καὶ οἱ πλείους οὐκ ᾔδεισαν τίνος ἕνεκα συνεληλύθεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/032.yaml
  text: So then some were shouting one thing and some another[a], for the assembly was in confusion, and most of them did not know why they had come together.
translation:
  language: te
  text: కాబట్టి కొందరు ఒకటి, మరికొందరు మరొకటి కేకలు వేస్తూ ఉన్నారు. సభ[a] గందరగోళంగా ఉంది; తాము ఎందుకు కూడివచ్చారో వారిలో ఎక్కువమందికి తెలియదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సమావేశం,’ ‘గుమికూడిన జనసమూహం.’ గ్రీకులో ἐκκλησία అనే పదం ఉంది; ఇక్కడ అది సంఘాన్ని కాకుండా పౌర సభను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον
  choice: కాబట్టి కొందరు ఒకటి, మరికొందరు మరొకటి కేకలు వేస్తూ ఉన్నారు
  rationale: ἄλλοι ... ἄλλο τι లోని పంపిణీ వ్యత్యాసాన్ని ‘కొందరు ... మరికొందరు ...’ సహజంగా తెలియజేస్తుంది. అసంపూర్ణ భూతకాల క్రియ ἔκραζον కొనసాగుతున్న కోలాహలాన్ని సూచిస్తున్నందున ‘కేకలు వేస్తూ ఉన్నారు’ అని అనువదించాం; μὲν οὖν ను సందర్భానుసారంగా ‘కాబట్టి’ అని ఇచ్చాం.
- source_word: ἐκκλησία
  choice: సభ
  rationale: ఈ పౌర కలహ సందర్భంలో ἐκκλησία క్రైస్తవ సంఘాన్ని కాకుండా కూడివచ్చిన ప్రజల సభను సూచిస్తుంది. ‘సభ’ మూలపదపు సమావేశ భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: συγκεχυμένη
  choice: గందరగోళంగా ఉంది
  rationale: συγχέω యొక్క పరిపూర్ణ కృదంతం ఏర్పడిన గందరగోళ స్థితిని సూచిస్తుంది. ‘గందరగోళంగా ఉంది’ ఆ ఫలిత స్థితిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οἱ πλείους
  choice: వారిలో చాలామందికి
  rationale: నామవాచకంగా వాడిన ఈ తులనాత్మక రూపం కూడినవారిలో అధిక సంఖ్యాకులను సూచిస్తుంది. ‘వారిలో చాలామందికి’ తెలుగులో సహజంగా ఆ సమూహానికే తిరిగి అన్వయిస్తుంది.
- source_word: τίνος ἕνεκα
  choice: ఎందుకు
  rationale: ఈ గ్రీకు నుడికారం ‘ఏ కారణం చేత’ అనే భావాన్ని ఇస్తుంది; ‘ఎందుకు’ దాని సహజమైన, సంక్షిప్త తెలుగు సమానం.
- source_word: συνεληλύθεισαν
  choice: కూడివచ్చారో
  rationale: συνέρχομαι యొక్క భూతపూర్వకాల రూపం కథనంలోని ఆ క్షణానికి ముందే వారు ఒకచోటికి చేరినట్లు సూచిస్తుంది. ‘కూడివచ్చారో’ సమూహంగా రావడం అనే భావాన్ని సహజంగా తెలియజేస్తుంది; తెలుగు సందర్భంలో ముందస్తు కాలసంబంధం స్పష్టంగా ఉంది.
theological_decisions:
- issue: ἐκκλησία అనే పదానికి ఈ సందర్భంలోని అర్థం
  choice: సభ
  alternative: సంఘం
  rationale: ఇక్కడ సందర్భం ఎఫెసులోని పౌర జనసమావేశం/గుంపు గురించి; క్రైస్తవ విశ్వాసుల సంఘం గురించి కాదు. అందువల్ల ‘సంఘం’ వల్ల కలగగల మతపరమైన అపార్థాన్ని నివారిస్తూ ‘సభ’ను ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. ‘కేకలు వేస్తూ ఉన్నారు’ కొనసాగుతున్న కోలాహలాన్ని, ‘గందరగోళంగా ఉంది’ సభ స్థితిని స్పష్టంగా చూపిస్తాయి.
