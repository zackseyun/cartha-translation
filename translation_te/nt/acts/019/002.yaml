  source_fidelity: The temporal relation in “మీరు విశ్వసించినప్పుడు” appropriately preserves the aorist participle πιστεύσαντες without deciding whether reception followed or coincided with faith. “పరిశుద్ధాత్మ ఉన్నాడనే సంగతే మేము వినలేదు” accurately represents the direct sense of οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν, while the alternative construal is retained in the footnote. The initial “అప్పుడు” is somewhat more specifically temporal than the lightly connective τέ, and “అడిగాడు” narrows εἶπεν (‘said’) unnecessarily, though the utterance is a question.
