id: ACT.19.2
reference: Acts 19:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπέν ⸀τε πρὸς αὐτούς· Εἰ πνεῦμα ἅγιον ἐλάβετε πιστεύσαντες; οἱ ⸀δὲ πρὸς αὐτόν· Ἀλλ’ οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/002.yaml
  text: And he said to them[a], “Did you receive the Holy Spirit when you believed?” And they said to him, “No[b], we have not even heard that there is a Holy Spirit.”
translation:
  language: te
  text: 'అతడు వారితో ఇలా అన్నాడు: “మీరు విశ్వసించినప్పుడు పరిశుద్ధాత్మను పొందారా?[a]” వారు అతనితో, “లేదు, పరిశుద్ధాత్మ ఉన్నాడనే సంగతే మేము వినలేదు[b]” అన్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు విశ్వసించిన తరువాత పరిశుద్ధాత్మను పొందారా?” గ్రీకు కృదంతాన్ని కాలసంబంధంగా కొద్దిగా భిన్నంగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పరిశుద్ధాత్మ ఉన్నాడో లేదో కూడా మేము వినలేదు”; మరింత వివరణాత్మకంగా, “పరిశుద్ధాత్మ ఇవ్వబడ్డాడనే సంగతే మేము వినలేదు.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπέν τε πρὸς αὐτούς
  choice: అప్పుడు అతడు వారితో ... అని అడిగాడు
  rationale: τέ ముందున్న కథనంతో స్వల్ప అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో ‘అప్పుడు’ సహజంగా ఆ కొనసాగింపును తెలియజేస్తుంది. ప్రత్యక్ష వాక్యం ప్రశ్న కావడంతో λέγωను సందర్భానుసారంగా ‘అడిగాడు’ అని అనువదించడం సహజం.
- source_word: Εἰ ... ἐλάβετε πιστεύσαντες
  choice: మీరు విశ్వసించినప్పుడు ... పొందారా?
  rationale: πιστεύσαντες అనే ఏఓరిస్ట్ కృదంతం ἐλάβετεతో కాలసంబంధాన్ని సూచిస్తుంది; ‘విశ్వసించినప్పుడు’ అనేది కచ్చితమైన ముందువెనుక క్రమాన్ని లేదా తక్షణ సమకాలికతను బలవంతంగా నిర్ణయించకుండా గ్రీకు వాక్యంలోని సౌలభ్యాన్ని నిలుపుతుంది.
- source_word: πνεῦμα ἅγιον
  choice: పరిశుద్ధాత్మను / పరిశుద్ధాత్మ
  rationale: ఈ సందర్భంలో ఇది దేవుని పరిశుద్ధాత్మను వ్యక్తిగతంగా సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగు క్రైస్తవ వాడుకలో ‘పరిశుద్ధాత్మ’ సహజమైన, గౌరవప్రదమైన పదం.
- source_word: οἱ δὲ πρὸς αὐτόν
  choice: అందుకు వారు ... అని అతనితో అన్నారు
  rationale: δέ స్వల్ప ప్రతిస్పందన లేదా కొనసాగింపును సూచిస్తుంది. ‘అందుకు’ సంభాషణలో సమాధాన సంబంధాన్ని సహజంగా తెలియజేస్తుంది; గ్రీకులో సందర్భం ద్వారా పూరించబడిన ‘అన్నారు’ను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: Ἀλλ’ οὐδ’
  choice: లేదు; ... సంగతే ... వినలేదు
  rationale: ἀλλ’ οὐδ’లోని బలమైన నిరాకరణను తెలుగులో మొదట ‘లేదు’ అని, తరువాత ‘సంగతే ... వినలేదు’ అనే ఉద్ఘాటనతో సహజంగా నిలిపింది.
- source_word: οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν
  choice: పరిశుద్ధాత్మ ఉన్నాడనే సంగతే మేము వినలేదు
  rationale: οὐδὲ εἰ నిర్మాణంలోని ప్రధాన ప్రత్యక్ష భావాన్ని అందిస్తుంది. ‘ఇవ్వబడ్డాడు’ వంటి గ్రీకులో లేని వివరణను చేర్చదు; εἰకి సాధ్యమైన ‘ఉన్నాడో లేదో’ భావాన్ని పాదటిప్పణిలో ఉంచుతుంది.
theological_decisions:
- issue: విశ్వాసం మరియు పరిశుద్ధాత్మను పొందడం మధ్య కాలసంబంధం
  choice: ‘విశ్వసించినప్పుడు’ అని అనువదించబడింది
  alternative: ‘విశ్వసించిన తరువాత’ లేదా ‘విశ్వసించగానే’
  rationale: πιστεύσαντες మరియు ἐλάβετε మధ్య కాలసంబంధం ఉన్నప్పటికీ, అది పరిశుద్ధాత్మ స్వీకరణ విశ్వాసానికి తప్పనిసరిగా తరువాత జరిగిందా లేక అదే సమయంలో జరిగిందా అనే సిద్ధాంత ప్రశ్నను స్వయంగా తేల్చదు. ప్రధాన పాఠం ఆ ఉద్రిక్తతను నిలుపుతుంది.
- issue: పరిశుద్ధాత్మ గురించి శిష్యుల అజ్ఞానం యొక్క భావం
  choice: ‘పరిశుద్ధాత్మ ఉన్నాడనే సంగతే మేము వినలేదు’
  alternative: ‘పరిశుద్ధాత్మ ఉన్నాడో లేదో కూడా మేము వినలేదు’ లేదా ‘పరిశుద్ధాత్మ ఇవ్వబడ్డాడనే సంగతే మేము వినలేదు’
  rationale: గ్రీకు వాక్యం సంక్షిప్తంగా, కొంత భావసౌలభ్యంతో ఉంది. ప్రధాన అనువాదం ప్రత్యక్ష అర్థాన్ని అనుసరిస్తుంది; ‘ఇవ్వబడ్డాడు’ అనే సందర్భాధారిత వివరణను పాఠంలోకి చేర్చకుండా ప్రత్యామ్నాయాలను పాదటిప్పణిలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి వాడబడింది. ‘పరిశుద్ధాత్మ’ అనే స్థిరమైన పదాన్ని ఉంచి, కాలసంబంధం మరియు చివరి వాక్యంలోని నిజమైన గ్రీకు భావసౌలభ్యాన్ని పాదటిప్పణుల్లో సంరక్షించాం.
