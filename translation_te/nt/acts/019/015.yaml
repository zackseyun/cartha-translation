source:
  edition: SBLGNT
  text: ἀποκριθὲν δὲ τὸ πνεῦμα τὸ πονηρὸν εἶπεν ⸀αὐτοῖς· ⸀Τὸν Ἰησοῦν γινώσκω καὶ τὸν Παῦλον ἐπίσταμαι, ὑμεῖς δὲ τίνες ἐστέ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/015.yaml
  text: But the evil spirit answered them[a], “Jesus I know, and Paul I recognize—but who are you?”
translation:
  language: te
  text: 'అయితే ఆ దుష్ట ఆత్మ వారికి ఇలా జవాబిచ్చింది: “యేసు నాకు తెలుసు; పౌలు గురించి నాకు తెలుసు[a]. కానీ మీరెవరు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకులో ఇక్కడ రెండు వేర్వేరు క్రియలు ఉన్నాయి: γινώσκω (‘తెలుసు’) మరియు ἐπίσταμαι. రెండవదానికి ‘పౌలు ఎవరో నాకు తెలుసు’ లేదా ‘పౌలును నేను గుర్తిస్తాను’ అనే భావమూ ఉండవచ్చు; ఈ భేదం సూక్ష్మమైనది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθὲν ... εἶπεν αὐτοῖς
  choice: వారికి ఇలా జవాబిచ్చింది
  rationale: గ్రీకులోని కృదంతం, సమాపక క్రియ కలిసి జవాబు రూపంలోని మాటను పరిచయం చేస్తున్నాయి. తెలుగులో అనవసరమైన పునరుక్తి లేకుండా స్పందన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: కథనంలో వచ్చిన స్వల్ప వ్యతిరేక మలుపును సూచిస్తుంది.
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: ఆ దుష్టాత్మ
  rationale: ఇక్కడ πνεῦμα వ్యక్తిత్వమున్న ఆత్మీయ ప్రాణిని సూచిస్తుంది; πονηρόν దాని దుష్ట స్వభావాన్ని తెలియజేస్తుంది. నిర్దిష్టతను తెలుగులో ‘ఆ’తో సహజంగా చూపించాం.
- source_word: Τὸν Ἰησοῦν γινώσκω
  choice: యేసు నాకు తెలుసు
  rationale: γινώσκωకు నేరుగా, సహజంగా సరిపోయే తెలుగు వ్యక్తీకరణ. ముందుకు వచ్చిన ‘యేసు’పై ఉన్న ఉద్ఘాటన కూడా నిలుస్తుంది.
- source_word: τὸν Παῦλον ἐπίσταμαι
  choice: పౌలు గురించి కూడా నాకు తెలుసు
  rationale: మొదటి క్రియకు భిన్నమైన ἐπίσταμαιను ‘గురించి తెలుసు’ అని చెప్పడం ద్వారా రెండు క్రియల మధ్య సాధ్యమైన భావభేదాన్ని చూపిస్తుంది; ముఖం చూసి గుర్తుపట్టడం అనే అవసరం లేని భావాన్ని రుద్దదు.
- source_word: ὑμεῖς δὲ τίνες ἐστέ;
  choice: కానీ మీరెవరు?
  rationale: ὑμεῖςపై ఉన్న ఉద్ఘాటనను, δὲ సూచించే వ్యతిరేకతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది. సందర్భం వల్ల ‘మీరు’ బహువచనమని స్పష్టమవుతుంది.
theological_decisions:
- issue: దుష్టాత్మ మాటల్లో γινώσκω, ἐπίσταμαι అనే రెండు భిన్న క్రియల అనువాదం
  choice: “యేసు నాకు తెలుసు; పౌలు గురించి కూడా నాకు తెలుసు”
  alternative: “యేసు నాకు తెలుసు; పౌలును నేను గుర్తిస్తాను” లేదా రెండింటికీ “తెలుసు”
  rationale: గ్రీకు వాక్యంలో రెండు భిన్న క్రియలు ఉండడం వాక్చాతుర్యపూర్వకమైన భావభేదాన్ని సూచించవచ్చు. ప్రధాన పాఠంలోని ‘గురించి కూడా నాకు తెలుసు’ ఆ భేదాన్ని కొంత నిలుపుతుంది; అయితే దుష్టాత్మ జ్ఞాన స్థాయుల గురించి వాక్యం చెప్పనిదాన్ని సిద్ధాంతంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘ఎరుగుదును’ వంటి ప్రాచీన రూపాలను నివారించాం; గ్రీకులోని ఉద్ఘాటన, వ్యతిరేకత, రెండు జ్ఞానక్రియల మధ్య ఉన్న సాధ్యమైన భేదం నిలుపబడ్డాయి.
