  yaml_path: translation/nt/acts/019/030.yaml
  text: But when Paul wanted to go in among the assembly[a], the disciples would not let him.
translation:
  language: te
  text: అయితే పౌలు ప్రజాసమూహంలోకి వెళ్లాలని కోరుకున్నప్పుడు, శిష్యులు అతన్ని వెళ్లనివ్వలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παύλου
  choice: పౌలు
  rationale: Παῦλος అనే వ్యక్తిపేరుకు తెలుగులో స్థిరపడిన ప్రామాణిక రూపం.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వాక్యంలోని సంఘటన నుంచి పౌలు ఉద్దేశానికి మారుతూ కనిపించే స్వల్ప వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: βουλομένου
  choice: వెళ్లాలని కోరుకున్నప్పుడు
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణంలోని ఉద్దేశం లేదా కోరిక భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰσελθεῖν
  choice: లోకి వెళ్లాలని
  rationale: లోపలికి ప్రవేశించడాన్ని సూచించే εἰσέρχομαι భావాన్ని సందర్భానుగుణంగా సహజంగా అందిస్తుంది.
- source_word: εἰς τὸν δῆμον
  choice: ప్రజాసమూహంలోకి
  rationale: ఎఫెసులోని నాటకశాల సందర్భంలో δῆμος సమకూడిన ప్రజలను లేదా పౌరసభను సూచించవచ్చు; ‘ప్రజాసమూహం’ ఈ సందర్భంలో సహజంగా ఉండి మూలంలోని విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: οὐκ εἴων
  choice: వెళ్లనివ్వలేదు
  rationale: ἐάω యొక్క ఇంపర్‌ఫెక్ట్ రూపం తెలిపే నిరాకరణతో కూడిన అడ్డుకోవడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: αὐτὸν
  choice: అతన్ని
  rationale: ఇది పౌలును తిరిగి సూచించే ప్రత్యక్ష కర్మ సర్వనామం.
- source_word: οἱ μαθηταί
  choice: శిష్యులు
  rationale: μαθηταί లోని నేర్చుకునేవారు లేదా అనుచరులు అనే భావాన్ని నేరుగా కాపాడుతుంది; మూలంలో లేని స్వామ్యార్థాన్ని చేర్చదు.
