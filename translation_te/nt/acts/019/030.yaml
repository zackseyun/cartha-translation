translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే కథన శైలి. δῆμοςకు ‘ప్రజాసమూహం’ అని ఇవ్వడం ద్వారా ఈ అల్లరి సందర్భంలోని గుంపు భావం నిలుస్తుంది; ‘సభ’ అని ఇవ్వడం వల్ల ఏర్పడగల అధికారికంగా సమావేశమైన పౌరసభ అనే అతిస్పష్టీకరణను నివారించాం.
