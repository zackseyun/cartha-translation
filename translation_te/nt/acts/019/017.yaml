id: ACT.19.17
reference: Acts 19:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο γνωστὸν πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν τοῖς κατοικοῦσιν τὴν Ἔφεσον, καὶ ⸀ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς, καὶ ἐμεγαλύνετο τὸ ὄνομα τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/017.yaml
  text: And this became known to all the Jews and Greeks living in Ephesus[a], and fear fell upon them all[b], and the name of the Lord Jesus was being magnified.
translation:
  language: te
  text: ఈ విషయం ఎఫెసులో నివసించే యూదులందరికీ, గ్రీకులందరికీ తెలిసింది. వారందరిపై భయం కమ్ముకుంది[a]. ప్రభువైన యేసు నామం మహిమపరచబడుతూ ఉండేది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారందరికీ భయం కలిగింది.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ప్రభువైన యేసు నామం హెచ్చింపబడింది,” లేదా “ఎంతో గౌరవించబడింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: ఈ విషయం
  rationale: ఏకవచన సూచన సర్వనామం ముందటి సంఘటనను సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఈ విషయం’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: ἐγένετο γνωστὸν
  choice: తెలిసింది
  rationale: ‘తెలియబడింది’ కంటే ‘తెలిసింది’ సహజమైన తెలుగు; విషయం ప్రజలకు తెలిసివచ్చిన భావాన్ని ఇస్తుంది.
- source_word: πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν τοῖς κατοικοῦσιν τὴν Ἔφεσον
  choice: ఎఫెసులో నివసించే యూదులందరికీ, గ్రీకులందరికీ
  rationale: నివాసాన్ని సూచించే కృదంతం రెండు వర్గాలనూ విశేషిస్తుంది; పᾶσιν యొక్క సమగ్రతను ప్రతి వర్గంతో స్పష్టంగా నిలుపుతుంది.
- source_word: ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς
  choice: వారందరిపై భయం కమ్ముకుంది
  rationale: మూలంలోని ‘మీద పడింది’ అనే సజీవ రూపకాన్ని సహజ తెలుగు ప్రయోగమైన ‘కమ్ముకుంది’ ద్వారా నిలుపుతూ, భయం వారందరినీ ఆవరించిన భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: φόβος
  choice: భయం
  rationale: ఈ పదం భయం, విస్మయం లేదా భయభక్తిని సూచించగలదు; సందర్భాన్ని అతిగా వ్యాఖ్యానించకుండా విస్తృతమైన ‘భయం’ను ఎంచుకున్నాం.
- source_word: ἐμεγαλύνετο
  choice: ఘనపరచబడుతూ వచ్చింది
  rationale: అసంపూర్ణ భూతకాల కర్మణి రూపంలోని కొనసాగుతున్న ప్రజా ఘనతను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘గొప్ప చేయబడింది’ అనే కఠిన పదానువాదాన్ని నివారిస్తుంది.
- source_word: τὸ ὄνομα
  choice: నామం
  rationale: ‘పేరు’ అనే సాధారణ అర్థంతో పాటు వ్యక్తి ప్రతిష్ఠ, అధికారం అనే బైబిలీయ ప్రతిధ్వనిని ‘నామం’ నిలుపుతుంది.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: ప్రభువైన యేసు
  rationale: κύριοςను క్రీస్తు బిరుదుగా ‘ప్రభువు’ అని అనువదించి, తెలుగు సంబంధ నిర్మాణంలో సహజంగా ‘ప్రభువైన యేసు నామం’గా ఇచ్చాం.
theological_decisions:
- issue: యేసును సూచించే κύριος అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఇక్కడ κύριος క్రీస్తు బిరుదుగా పనిచేస్తుంది; ‘ప్రభువు’ దాని క్రైస్తవశాస్త్రీయ బరువును వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
- issue: τὸ ὄνομαను ‘నామం’గా ఉంచాలా, ‘ప్రతిష్ఠ’గా భావానువాదం చేయాలా
  choice: ప్రభువైన యేసు నామం ఘనపరచబడుతూ వచ్చింది
  alternative: ప్రభువైన యేసు ప్రతిష్ఠ పెరుగుతూ వచ్చింది
  rationale: ‘నామం’ మూలపాఠంలోని రూపాన్ని, వ్యక్తి మరియు అధికారంతో దాని బైబిలీయ అనుబంధాన్ని నిలుపుతుంది; ‘ప్రతిష్ఠ’ అర్థాన్ని అనవసరంగా సంకుచితం చేస్తుంది.
- issue: φόβος యొక్క భావ ఛాయ
  choice: భయం
  alternative: భయభక్తి
  rationale: సందర్భంలో భయం, విస్మయం రెండూ సంభవించగలవు. ‘భయభక్తి’ ఆరాధనా భావాన్ని ముందుగానే నిర్ణయిస్తుంది; ‘భయం’ మూలంలోని అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభమైన శైలి. ‘నామం’, ‘ప్రభువు’ వంటి బైబిలీయంగా స్థిరమైన పదాలను నిలుపుతూ, వాక్య నిర్మాణాన్ని సహజ తెలుగుకు అనుగుణంగా విభజించాం.
