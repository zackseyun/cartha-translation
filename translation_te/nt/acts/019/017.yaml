revisions:
- from: ఈ విషయం ఎఫెసులో నివసించే యూదులందరికీ, గ్రీకులందరికీ తెలిసింది. వారందరిపై భయం కమ్ముకుంది[a]. ప్రభువైన యేసు నామం ఘనపరచబడుతూ వచ్చింది[b].
  to: ఈ విషయం ఎఫెసులో నివసించే యూదులందరికీ, గ్రీకులందరికీ తెలిసింది. వారందరిపై భయం కమ్ముకుంది[a]. ప్రభువైన యేసు నామం మహిమపరచబడుతూ ఉండేది[b].
  rationale: Only the final clause and its alternative-rendering note are revised. The change gives a clearer, idiomatic Telugu representation of the imperfect passive ‘was being magnified,’ while retaining ‘నామం’ and the established title ‘ప్రభువు.’ Footnote markers remain correctly attached to the fear and magnifying clauses respectively.
  reviewer_model: gpt-5.6-terra
