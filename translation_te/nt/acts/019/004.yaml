id: ACT.19.4
reference: Acts 19:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ Παῦλος· ⸀Ἰωάννης ἐβάπτισεν βάπτισμα μετανοίας, τῷ λαῷ λέγων εἰς τὸν ἐρχόμενον μετ’ αὐτὸν ἵνα πιστεύσωσιν, τοῦτ’ ἔστιν εἰς ⸀τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/004.yaml
  text: And Paul said[a], “John baptized with a baptism of repentance, telling the people to believe in the one coming after him—that is, in Jesus.”
translation:
  language: te
  text: 'అప్పుడు పౌలు ఇలా అన్నాడు: “యోహాను పశ్చాత్తాపానికి సంబంధించిన బాప్తిస్మం ఇచ్చాడు. తన తర్వాత రాబోయే వ్యక్తిని, అంటే యేసును, నమ్మాలని ప్రజలకు చెప్పాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβάπτισεν βάπτισμα μετανοίας
  choice: పశ్చాత్తాపానికి సంబంధించిన బాప్తిస్మం ఇచ్చాడు
  rationale: గ్రీకులోని సమాన మూలపదాల నిర్మాణాన్ని తెలుగులో యథాతథంగా ఉంచితే అసహజంగా ఉంటుంది. ‘బాప్తిస్మం ఇచ్చాడు’ సహజమైన ప్రస్తుత తెలుగు; ‘పశ్చాత్తాపానికి సంబంధించిన’ అనేది μετανοίας సూచించే బాప్తిస్మపు స్వభావాన్ని నిలుపుతుంది.
- source_word: τῷ λαῷ
  choice: ప్రజలకు
  rationale: λαός అనే సామూహిక పదాన్ని సహజంగా అనువదిస్తుంది; మూలంలో స్పష్టంగా లేని ‘ఇశ్రాయేలు ప్రజలు’ అనే పరిమితిని జోడించదు.
- source_word: λέγων
  choice: చెప్పాడు
  rationale: యోహాను బాప్తిస్మం ఇస్తూనే ప్రకటించిన సందేశాన్ని సహజమైన తెలుగు వాక్యంగా వ్యక్తపరుస్తుంది.
- source_word: εἰς τὸν ἐρχόμενον μετ’ αὐτὸν
  choice: తన తర్వాత రాబోయే వ్యక్తిని ... నమ్మాలని
  rationale: πιστεύωతో కూడిన εἰς విశ్వాసానికి గురియైన వ్యక్తిని సూచిస్తుంది. μετ’ αὐτόν ఇక్కడ కాలక్రమం లేదా పరిచర్యలో తన తర్వాత రావడాన్ని సూచిస్తుంది.
- source_word: ἵνα πιστεύσωσιν
  choice: నమ్మాలని
  rationale: మాట్లాడే క్రియ తర్వాత వచ్చే ἵνα వాక్యభాగంలోని ఉద్దేశం/ఆదేశ భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τοῦτ’ ἔστιν
  choice: అంటే
  rationale: ముందు చెప్పిన ‘రాబోయే వ్యక్తి’ ఎవరో వివరించే సూత్రాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: εἰς τὸν Ἰησοῦν
  choice: యేసును ... నమ్మాలని
  rationale: ముందటి πιστεύσωσιν ఇక్కడ భావానువర్తనంగా కొనసాగుతుంది. మూలంలో Χριστός అనే బిరుదు లేదు కాబట్టి ‘క్రీస్తు’ను జోడించలేదు.
theological_decisions:
- issue: యోహాను బాప్తిస్మానికి, యేసుపై విశ్వాసానికి ఉన్న సంబంధం
  choice: యోహాను ఇచ్చిన బాప్తిస్మం పశ్చాత్తాపానికి సంబంధించినదని, దానితోపాటు తన తర్వాత వచ్చేవానిని నమ్మాలని అతడు ప్రజలకు చెప్పాడని అనువదించబడింది.
  alternative: యోహాను బాప్తిస్మమే క్రైస్తవ విశ్వాసాన్ని కలిగించిందని భావించడం; లేదా ‘తన తర్వాత వచ్చేవాడు’ ఎవరో పేర్కొనకుండా ఉంచడం.
  rationale: వాక్యనిర్మాణం యోహాను ఇచ్చిన పశ్చాత్తాప బాప్తిస్మాన్ని, అతడు ప్రకటించిన విశ్వాస పిలుపును సంబంధితమైనవిగా చూపినా ఒకటిగా కలపదు. τοῦτ’ ἔστιν εἰς τὸν Ἰησοῦν ఆ రాబోయే వ్యక్తిని యేసుగా స్పష్టంగా గుర్తిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన శైలి. పొడవైన గ్రీకు వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి భావసంబంధాన్ని నిలిపాం. ‘బాప్తిస్మం’ అనే విస్తృతంగా గుర్తించబడే బైబిలు పదాన్ని వాడాం.
