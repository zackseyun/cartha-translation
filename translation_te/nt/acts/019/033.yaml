source:
  edition: SBLGNT
  text: ἐκ δὲ τοῦ ὄχλου ⸀συνεβίβασαν Ἀλέξανδρον προβαλόντων αὐτὸν τῶν Ἰουδαίων, ὁ δὲ Ἀλέξανδρος κατασείσας τὴν χεῖρα ἤθελεν ἀπολογεῖσθαι τῷ δήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/033.yaml
  text: And from the crowd they brought forward Alexander[a], since the Jews had pushed him forward; and Alexander, motioning with his hand[b], wanted to make a defense to the assembly.
translation:
  language: te
  text: జనసమూహం మధ్యనుండి వారు అలెగ్జాండరును ముందుకు తీసుకొచ్చారు[a]; యూదులు అతణ్ణి ముందుకు నెట్టడంతో, అలెగ్జాండరు తన చేతితో సైగ చేసి ప్రజాసభకు[b] తన సమర్థన చెప్పాలని అనుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అలెగ్జాండరును ముందుంచారు … యూదులు అతణ్ణి ముందుకు తీసుకొచ్చారు.” అలెగ్జాండరును ప్రజల ముందుకు తీసుకురావడాన్ని సూచించే సంబంధిత భావాలుగల రెండు గ్రీకు క్రియలు ఇక్కడ ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: “ప్రజలకు” అని కూడా అనువదించవచ్చు. ఇక్కడి పదానికి పౌరసంబంధమైన బహిరంగ భావం ఉంది; వచనం మొదట్లోని “జనసమూహం” అనే పదానికి ఇది భిన్నమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεβίβασαν
  choice: ముందుకు తీసుకొచ్చారు
  rationale: ἐκ τοῦ ὄχλου మరియు అలెగ్జాండరును కర్మగా తీసుకున్న సందర్భంలో, జనసమూహం మధ్యనుంచి అతణ్ణి బహిరంగంగా ముందుకు తీసుకురావడం అనే భావం సరిపోతుంది; బోధించడం లేదా సూచించడం అనే ఇతర అర్థాలు ఇక్కడ సహజం కావు.
- source_word: προβαλόντων αὐτὸν τῶν Ἰουδαίων
  choice: యూదులు అతణ్ణి ముందుకు తోశారు
  rationale: ఈ genitive absolute, అలెగ్జాండరు ఎలా ముందుకు వచ్చాడో వివరిస్తుంది. ‘ముందుకు తోశారు’ అనేది హింసను తప్పనిసరిగా సూచించకుండా, అతణ్ణి బహిరంగంగా ముందుంచిన సందర్భోచిత బలాన్ని తెలియజేస్తుంది.
- source_word: κατασείσας τὴν χεῖρα
  choice: తన చేతితో సైగ చేసి
  rationale: శ్రద్ధను ఆకర్షించడానికి లేదా నిశ్శబ్దం కోరడానికి చేసిన చేతి సంజ్ఞను సహజంగా తెలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘నిశ్శబ్దంగా ఉండమని’ అనే ఉద్దేశాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: ἤθελεν ἀπολογεῖσθαι
  choice: తన వాదన వినిపించాలని అనుకున్నాడు
  rationale: ἤθελεν ఉద్దేశం లేదా కోరికను సూచిస్తుంది, కార్యం పూర్తయిందని కాదు. ἀπολογεῖσθαι బహిరంగంగా సమర్థనాత్మక వాదన వినిపించడం అనే భావాన్ని ఇక్కడ కలిగి ఉంది.
- source_word: τῷ δήμῳ
  choice: ప్రజాసభ ఎదుట
  rationale: δῆμος ఇక్కడ పౌరసంబంధమైన ప్రజాసమూహం లేదా కూడిన సభను సూచించవచ్చు. ‘ప్రజాసభ’ ఆ బహిరంగ-పౌర భావాన్ని నిలుపుతూ, ముందున్న ὄχλος నుంచి భేదాన్ని చూపుతుంది.
- source_word: ὄχλου
  choice: జనసమూహం
  rationale: సాధారణంగా గుమికూడిన ప్రజలను సూచించే సహజమైన ఆధునిక తెలుగు పదం; తరువాతి δῆμος‌కు వాడిన ‘ప్రజాసభ’తో కలిసిపోదు.
- source_word: Ἀλέξανδρον / Ἀλέξανδρος
  choice: అలెగ్జాండరు
  rationale: తెలుగు బైబిలు పేర్ల రూపానికి అనుగుణంగా గ్రీకు వ్యక్తిపేరును లిప్యంతరీకరించింది.
