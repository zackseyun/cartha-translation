  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించింది. [a] ప్రధాన పాఠ్యంలో సంబంధిత రెండు క్రియల పునరుక్త భావాన్ని సూచిస్తుంది; [b] δῆμος‌లోని ‘ప్రజలు/ప్రజాసభ’ సందిగ్ధతను నిలుపుతుంది.
