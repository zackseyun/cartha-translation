id: ACT.14.27
reference: Acts 14:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ καὶ συναγαγόντες τὴν ἐκκλησίαν ⸀ἀνήγγελλον ὅσα ἐποίησεν ὁ θεὸς μετ’ αὐτῶν καὶ ὅτι ἤνοιξεν τοῖς ἔθνεσιν θύραν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/027.yaml
  text: And when they arrived and gathered the church together[a], they reported all that God had done with them[b], and that he had opened a door of faith to the Gentiles.
translation:
  language: te
  text: వారు అక్కడికి చేరి, సంఘాన్ని కూడగట్టిన తరువాత, దేవుడు తమతో కలిసి చేసిన సమస్త కార్యాలను, అన్యజనులకు విశ్వాసపు ద్వారాన్ని తెరిచిన సంగతినీ వివరించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అన్యజనులు విశ్వసించడానికి ద్వారం తెరిచిన సంగతి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενοι
  choice: వారు అక్కడికి చేరుకొని
  rationale: అయోరిస్ట్ కృదంతం ప్రధాన క్రియకు ముందు జరిగిన చేరికను సూచిస్తుంది; ఈ తెలుగు రూపం సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: συναγαγόντες τὴν ἐκκλησίαν
  choice: సంఘాన్ని సమావేశపరచి
  rationale: స్థానిక క్రైస్తవ సమాజాన్ని ఒకచోట చేర్చడాన్ని సూచిస్తుంది; ‘సంఘం’ అపొస్తలుల కార్యముల సందర్భంలో ἐκκλησίαకు సహజమైన పదం.
- source_word: ἀνήγγελλον
  choice: వివరించారు
  rationale: వారు జరిగిన కార్యాలను సంఘానికి నివేదించి చెప్పిన భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ὅσα ἐποίησεν ὁ θεὸς μετ’ αὐτῶν
  choice: దేవుడు తమతో కలిసి చేసిన కార్యాలన్నిటినీ
  rationale: μετά యొక్క ప్రాథమిక ‘తో’ భావాన్ని నిలుపుతూ, దేవుడే కర్త అని స్పష్టంగా ఉంచుతుంది; ‘వారి ద్వారా’ అని సాధనార్థాన్ని బలపరచదు.
- source_word: τοῖς ἔθνεσιν
  choice: అన్యజనులు
  rationale: ఈ కథన సందర్భంలో యూదులు కానివారిని సూచిస్తుంది; భౌగోళిక దేశాలకన్నా యూదేతర ప్రజల భావాన్ని అందిస్తుంది.
- source_word: θύραν πίστεως
  choice: విశ్వసించడానికి ... ద్వారం
  rationale: గ్రీకు రూపకాన్ని నిలుపుతూ, πίστεωςను ఇక్కడ విశ్వాసంలోకి ప్రవేశం లేదా విశ్వసించే అవకాశంగా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుని కార్యాన్ని వర్ణించే μετ’ αὐτῶν అర్థం
  choice: దేవుడు తమతో కలిసి చేసిన
  alternative: దేవుడు వారి ద్వారా చేసిన
  rationale: ‘తో’ అనే గ్రీకు సంబంధ భావాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; అపొస్తలులను సాధనాలుగా స్పష్టీకరించే సాధనార్థ వ్యాఖ్యానాన్ని బలవంతంగా చేర్చదు.
- issue: θύραν πίστεωςలో πίστεως సంబంధం
  choice: విశ్వసించడానికి ద్వారం
  alternative: విశ్వాసపు ద్వారం
  rationale: రూపకాన్ని కాపాడుతూ సాధారణ పాఠకునికి ఉద్దేశ్య/అవకాశ భావాన్ని స్పష్టంగా అందిస్తుంది; ‘విశ్వాసపు ద్వారం’ అనే మరింత అక్షరార్థ రూపం కూడా సాధ్యమేనని పాదటిప్పణి తెలియజేస్తుంది.
- issue: ἔθνεσιν యొక్క సందర్భోచిత అర్థం
  choice: అన్యజనులు
  alternative: జనాలు / దేశాలు
  rationale: అపొస్తలుల కార్యముల కథనంలో యూదేతరుల చేర్పే ప్రధాన భావం; ఆధునిక దేశరాజ్యాల భావాన్ని అనవసరంగా రానివ్వదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. గ్రీకు వాక్యంలోని దేవుని కర్తృత్వం, ‘తో’ అనే సంబంధ భావం, ద్వారం అనే రూపకం నిలుపబడ్డాయి.
