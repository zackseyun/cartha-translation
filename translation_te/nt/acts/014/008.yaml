source:
  edition: SBLGNT
  text: Καί τις ἀνὴρ ⸂ἀδύνατος ἐν Λύστροις⸃ τοῖς ποσὶν ἐκάθητο, χωλὸς ἐκ κοιλίας μητρὸς ⸀αὐτοῦ, ὃς οὐδέποτε ⸀περιεπάτησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/008.yaml
  text: And in Lystra a certain man was sitting[a], powerless in his feet, lame from his mother's womb, who had never walked.
translation:
  language: te
  text: లుస్త్రలో కాళ్లలో బలం లేని ఒక మనిషి కూర్చొని ఉన్నాడు. అతడు తల్లి గర్భం నుంచే కుంటివాడు; ఎన్నడూ నడవలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καί
  choice: —
  rationale: తెలుగు కథన ప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ అని పెట్టడం అసహజంగా ఉండడం వల్ల, కొత్త దృశ్యాన్ని నేరుగా ప్రారంభించాం; అనుసంధానం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: τις ἀνὴρ
  choice: ఒక వ్యక్తి
  rationale: పేరు తెలియని నిర్దిష్ట వ్యక్తిని పరిచయం చేసే గ్రీకు భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀδύνατος ... τοῖς ποσίν
  choice: కాళ్లలో బలం లేని
  rationale: ἀδύνατος అనే పదంలోని శక్తి/సామర్థ్య లేమిని నిలుపుతూ, తరువాతి χωλός (‘కుంటివాడు’)తో కలిపివేయకుండా వేరు చేసి చూపుతుంది.
- source_word: ἐν Λύστροις
  choice: లుస్త్రలో
  rationale: స్థలనామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణను, తెలుగు విభక్తితో సహజంగా వాడాం.
- source_word: ἐκάθητο
  choice: కూర్చొని ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం సూచించే కొనసాగుతున్న స్థితిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: χωλὸς
  choice: కుంటివాడు
  rationale: నడకకు సంబంధించిన శారీరక వైకల్యాన్ని స్పష్టంగా, సాధారణ పాఠకులకు అర్థమయ్యే రీతిలో తెలుపుతుంది.
- source_word: ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: తల్లి గర్భం నుంచే
  rationale: పుట్టుకతోనే ఉన్న స్థితిని సూచించే మూలభాషా చిత్రణను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: οὐδέποτε περιεπάτησεν
  choice: ఎన్నడూ నడవలేదు
  rationale: అతని జీవితమంతటా ఆ సమయం వరకు నడవలేదనే సంపూర్ణ నిరాకరణను స్పష్టంగా తెలియజేస్తుంది.
