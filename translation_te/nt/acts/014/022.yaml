id: ACT.14.22
reference: Acts 14:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπιστηρίζοντες τὰς ψυχὰς τῶν μαθητῶν, παρακαλοῦντες ἐμμένειν τῇ πίστει καὶ ὅτι διὰ πολλῶν θλίψεων δεῖ ἡμᾶς εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/022.yaml
  text: strengthening the souls of the disciples[a], encouraging them to remain in the faith[c][b], and saying that through many afflictions we must enter the kingdom of God.
translation:
  language: te
  text: శిష్యుల మనస్సులను స్థిరపరుస్తూ, విశ్వాసంలో నిలిచి ఉండాలని వారిని ప్రోత్సహిస్తూ, “అనేక శ్రమల గుండా మనం దేవుని రాజ్యంలో ప్రవేశించాలి” అని చెబుతూ ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστηρίζοντες
  choice: బలపరుస్తూ
  rationale: శిష్యులను మరింత స్థిరపరచే కొనసాగుతున్న కార్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὰς ψυχὰς
  choice: హృదయాలను
  rationale: ఇక్కడ ψυχαί శిష్యుల అంతరంగ వ్యక్తిత్వాన్ని సూచిస్తుంది; తెలుగులో ‘ఆత్మలను బలపరచడం’ కంటే ‘హృదయాలను బలపరచడం’ సహజంగా ఉండి, శరీర–ఆత్మ ద్వైతార్థాన్ని అనవసరంగా రుద్దదు.
- source_word: τῶν μαθητῶν
  choice: శిష్యుల
  rationale: యేసును అనుసరించే నిబద్ధ అనుచరులకు స్థిరపడిన నూతన నిబంధన పదం.
- source_word: παρακαλοῦντες
  choice: ప్రోత్సహిస్తూ
  rationale: ఆదరణతో కూడిన ఉద్బోధ అనే సందర్భార్థాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: ἐμμένειν
  choice: నిలిచియుండాలని
  rationale: ఒక దానిలో స్థిరంగా కొనసాగడం అనే భావాన్ని విశ్వాసంతో సహజంగా కలుపుతుంది.
- source_word: τῇ πίστει
  choice: విశ్వాసంలో
  rationale: గ్రీకు నిర్దిష్ట ఉపపదం సమూహం అంగీకరించిన విశ్వాసాన్ని సూచించగలిగినా, తెలుగులో ‘విశ్వాసంలో’ అనే రూపమే సహజంగా ఉండి నిర్దిష్ట సందర్భార్థాన్ని కోల్పోదు.
- source_word: διὰ πολλῶν θλίψεων
  choice: అనేక శ్రమల గుండా
  rationale: θλῖψις లోని బాధ, ఒత్తిడి, కష్టాల గంభీరతను సహజమైన తెలుగు పదబంధంతో అందిస్తుంది.
- source_word: δεῖ ἡμᾶς
  choice: మనం … ప్రవేశించాలి
  rationale: అవశ్యకతను బలంగా ఉంచుతుంది; దాని వెనుకనున్న దైవశాస్త్రీయ విధానాన్ని అదనంగా నిర్వచించదు.
- source_word: εἰσελθεῖν εἰς
  choice: రాజ్యంలో ప్రవేశించాలి
  rationale: గమ్యస్థానంలోకి ప్రవేశించే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: βασιλεία యొక్క రాజ్యమూ పాలనమూ అనే భావపరిధిని నిలుపుకునే స్థిరమైన, సులభంగా అర్థమయ్యే తెలుగు రూపం.
theological_decisions:
- issue: τῇ πίστει యొక్క భావం
  choice: విశ్వాసంలో
  alternative: ఆ విశ్వాసంలో / విశ్వాసమార్గంలో
  rationale: ఉపపదం నిర్దిష్టమైన క్రైస్తవ విశ్వాసాన్ని సూచించవచ్చు. అయితే తెలుగులో సహజమైన ‘విశ్వాసంలో’ అనే రూపం వ్యక్తిగత నమ్మకానికీ సమూహ విశ్వాసానికీ మధ్య గ్రీకులో మిగిలే భావవిస్తృతిని అనవసరంగా కుదించదు.
- issue: δεῖ యొక్క బలం
  choice: మనం … ప్రవేశించాలి
  alternative: మనం ప్రవేశించడం అవసరం
  rationale: గ్రీకు వాక్యంలోని అవశ్యకతను నిలుపుతూ, శ్రమలు రక్షణకు ప్రతిఫలమో అర్హత సాధించే మార్గమో అనే భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన వాక్యనిర్మాణం. మూలంలో ప్రత్యక్ష ఉల్లేఖన చిహ్నాలు లేకపోయినా, ὅτι తరువాత చెప్పబడిన విషయాన్ని తెలుగులో స్పష్టంగా చూపేందుకు ఉల్లేఖన చిహ్నాలు వాడబడ్డాయి. అవసరం లేని పాదటిప్పణులు చేర్చలేదు.
