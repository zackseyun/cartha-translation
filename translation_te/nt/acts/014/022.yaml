revisions:
- from: శిష్యుల హృదయాలను బలపరుస్తూ, విశ్వాసంలో నిలిచియుండాలని వారిని ప్రోత్సహిస్తూ, “అనేక శ్రమల గుండా మనం దేవుని రాజ్యంలో ప్రవేశించాలి” అని చెప్పారు.
  to: శిష్యుల మనస్సులను స్థిరపరుస్తూ, విశ్వాసంలో నిలిచి ఉండాలని వారిని ప్రోత్సహిస్తూ, “అనేక శ్రమల గుండా మనం దేవుని రాజ్యంలో ప్రవేశించాలి” అని చెబుతూ ఉన్నారు.
  rationale: The revision retains the draft's structure and its clear representation of ὅτι as quoted content, while using a more source-faithful contextual equivalent for ψυχὰς, a closer equivalent for ἐπιστηρίζοντες, and contemporary standard Telugu verbal spacing. The quotation does not add a distinct saying beyond the Greek content clause.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:28:00Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the participial sequence, the exhortation to remain in the faith, the necessity expressed by δεῖ, and entry into God's kingdom through many θλίψεις. However, హృదయాలను ('hearts') narrows ψυχὰς beyond its contextual sense of the disciples' inner persons/lives. మనస్సులను is the established, natural Telugu contextual rendering here and avoids imposing a body–soul dualism.
  naturalness: The sentence is generally clear and appropriate for modern standard Telugu. Replacing the literary fused form నిలిచియుండాలని with నిలిచి ఉండాలని improves contemporary readability. స్థిరపరుస్తూ naturally expresses ἐπιστηρίζοντες more fully than the broader బలపరుస్తూ.
  terminology: 'శిష్యులు, విశ్వాసం, శ్రమలు, దేవుని రాజ్యం, and ప్రవేశించాలి are suitable and theologically nonsectarian. No footnotes are required: the article with πίστει can be naturally represented by విశ్వాసంలో without forcing either a narrowly subjective or later technical sense.'
  issues:
  - severity: medium
    issue: హృదయాలను for τὰς ψυχὰς
    rationale: హృదయం primarily denotes the heart, whereas ψυχή here refers more broadly to the disciples' inner selves/personhood. మనస్సులను is both idiomatic in this collocation and closer to the contextual semantic range.
  - severity: low
    issue: నిలిచియుండాలని is not fully modern-standard prose
    rationale: The fused form is understandable but literary/older in register. నిలిచి ఉండాలని is the normal contemporary form and retains the meaning of ἐμμένειν.
  - severity: low
    issue: బలపరుస్తూ understates the firming/establishing nuance of ἐπιστηρίζοντες
    rationale: స్థిరపరుస్తూ preserves the sense of making firm while remaining natural Telugu.
  revised_text: శిష్యుల మనస్సులను స్థిరపరుస్తూ, విశ్వాసంలో నిలిచి ఉండాలని వారిని ప్రోత్సహిస్తూ, “అనేక శ్రమల గుండా మనం దేవుని రాజ్యంలో ప్రవేశించాలి” అని చెబుతూ ఉన్నారు.
  revised_footnotes: []
