id: ACT.14.16
reference: Acts 14:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς ἐν ταῖς παρῳχημέναις γενεαῖς εἴασεν πάντα τὰ ἔθνη πορεύεσθαι ταῖς ὁδοῖς αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/016.yaml
  text: In past generations he allowed all the nations to walk in their own ways[a].
translation:
  language: te
  text: గత తరాల్లో ఆయన అన్ని జనాలను తమ తమ మార్గాల్లో నడవనిచ్చాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదేతర ప్రజలందరినీ తమ మార్గాల్లో వెళ్లనిచ్చాడు.”
    reason: ἔθνη అనే పదానికి ‘యూదేతర ప్రజలు’ అనే అర్థం, πορεύεσθαι అనే పదానికి ‘వెళ్లడం’ అనే మరింత అక్షరార్థ అనువాదం కూడా సాధ్యమే.
lexical_decisions:
- source_word: ὃς
  choice: ఆయన
  rationale: గ్రీకు సంబంధవాచక సర్వనామానికి అక్షరార్థంగా ‘ఎవరైతే ఆయన’ అనే భావం ఉన్నా, ముందరి వచనంలోని దేవుణ్ణి సూచిస్తూ తెలుగులో వాక్యాన్ని సహజంగా కొనసాగించడానికి ‘ఆయన’ ఎంచుకున్నాం.
- source_word: ἐν ταῖς παρῳχημέναις γενεαῖς
  choice: గత తరాల్లో
  rationale: గడిచిపోయిన తరాలు అనే కాలార్థాన్ని ఆధునిక, సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἴασεν
  choice: నడవనిచ్చాడు
  rationale: ἐάω అనుమతించడం లేదా చేయనివ్వడం అని అర్థం. ‘నిచ్చాడు’ అనే రూపం దేవుడు వారి ప్రవర్తనను ఆమోదించాడని కాక, కొనసాగనిచ్చాడనే భావాన్ని ఉంచుతుంది.
- source_word: πάντα τὰ ἔθνη
  choice: అన్ని జనాలను
  rationale: ἔθνη అంటే ‘జనాలు/దేశాలు’ లేదా సందర్భానుసారం ‘యూదేతరులు.’ ఇక్కడ ప్రపంచంలోని ప్రజాసమూహాల విస్తృత భావాన్ని ‘అన్ని జనాలు’ సహజంగా నిలుపుతుంది.
- source_word: πορεύεσθαι
  choice: నడవ
  rationale: మూలపదం వెళ్లడం అనే అర్థం కలిగినప్పటికీ, ‘మార్గాలు’తో కలిసి జీవన విధానాన్ని సూచిస్తుంది. ‘నడవ’ మూలంలోని రూపకాన్ని నిలుపుతుంది.
- source_word: ταῖς ὁδοῖς αὐτῶν
  choice: తమ తమ మార్గాల్లో
  rationale: ὁδοῖς అనే ‘మార్గాలు’ ఇక్కడ ప్రవర్తనా పద్ధతులు లేదా జీవన విధానాలను రూపకంగా సూచిస్తుంది. ‘తమ తమ’ αὐτῶν యొక్క స్వకీయ, సమూహానుసార భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవ అనుమతి మరియు ఆమోదం మధ్య తేడా
  choice: దేవుడు జనాలను తమ తమ మార్గాల్లో నడవనిచ్చాడని అనువదించాం.
  alternative: దేవుడు వారి మార్గాలను ఆమోదించాడు లేదా ఆయనే వాటిని నిర్ణయించాడు అని అర్థం చేయడం.
  rationale: εἴασεν అనుమతించడం లేదా చేయనివ్వడం అని సూచిస్తుంది; నైతిక ఆమోదాన్ని గానీ, వారి మార్గాలకు దేవుడే ప్రత్యక్ష కారణమని గానీ చెప్పదు. అందువల్ల దైవ సార్వభౌమత్వం మరియు మానవ బాధ్యత మధ్యనున్న ఉద్రిక్తతను పరిష్కరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘నడవ’–‘మార్గాలు’ రూపకాన్ని నిలిపి, ‘నడవనిచ్చాడు’ అనే సహజ క్రియారూపంతో వాక్యాన్ని సంక్షిప్తంగా ఉంచాం.
