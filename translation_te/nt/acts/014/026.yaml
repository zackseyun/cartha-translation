id: ACT.14.26
reference: Acts 14:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κἀκεῖθεν ἀπέπλευσαν εἰς Ἀντιόχειαν, ὅθεν ἦσαν παραδεδομένοι τῇ χάριτι τοῦ θεοῦ εἰς τὸ ἔργον ὃ ἐπλήρωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/026.yaml
  text: And from there they sailed to Antioch[b][a], where they had been committed to the grace of God for the work that they had fulfilled.
translation:
  language: te
  text: అక్కడి నుండి వారు ఓడలో అంతియొకయకు ప్రయాణించారు. వారు నెరవేర్చిన పని కొరకు ఆ పట్టణం నుండే దేవుని కృపకు అప్పగించబడ్డారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు పూర్తి చేసిన పని కోసం.”
    reason: πληρόω ఇక్కడ ‘నెరవేర్చడం’ లేదా ‘పూర్తి చేయడం’ అనే రెండింటిలోనూ సహజంగా అర్థమవుతుంది.
lexical_decisions:
- source_word: κἀκεῖθεν ἀπέπλευσαν
  choice: అక్కడి నుండి వారు ఓడలో ... తిరిగి వెళ్లారు
  rationale: κἀκεῖθεν కథన సంబంధాన్ని, బయలుదేరిన స్థలాన్ని సూచిస్తుంది; ἀπέπλευσαν సముద్రమార్గ ప్రయాణాన్ని సూచిస్తుంది. సందర్భంలో అంతియొకయకు తిరుగు ప్రయాణం స్పష్టంగా ఉన్నందున సహజమైన తెలుగులో ఇలా ఇచ్చాం.
- source_word: εἰς Ἀντιόχειαν
  choice: అంతియొకయకు
  rationale: చలన క్రియతో εἰς గమ్యాన్ని సూచిస్తుంది; స్థల నామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: ὅθεν
  choice: ఆ పట్టణం నుండే
  rationale: ὅθεν యొక్క మూలార్థమైన ‘ఎక్కడి నుండి’ అనే భావాన్ని స్పష్టంగా నిలిపి, అంతియొకయ నుండే వారు ముందుగా అప్పగించబడ్డారనే సంబంధాన్ని చూపిస్తుంది.
- source_word: ἦσαν παραδεδομένοι
  choice: అప్పగించబడ్డారు
  rationale: ఈ పరిభాషాత్మక గతపూర్ణ రూపం, వారి ప్రయాణానికి ముందు జరిగిన అప్పగింతను సూచిస్తుంది. ‘అప్పగించబడ్డారు’ అనేది దేవుని కృప సంరక్షణకు వారిని ఉంచిన భావాన్ని మతశాఖాపరమైన ప్రత్యేక అర్థం చేర్చకుండా తెలియజేస్తుంది.
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: దేవుని కృపకు
  rationale: దత్తి విభక్తి వారు ఎవరికి లేదా దేనికి అప్పగించబడ్డారో సూచిస్తుంది; గ్రీకు పదబంధంలోని దైవశాస్త్రీయ బరువును నేరుగా నిలుపుతుంది.
- source_word: εἰς τὸ ἔργον
  choice: పని కోసం
  rationale: ἔργον ను విస్తృతమైన ‘పని’గా అనువదించడం, సందర్భం తెలిపే సేవను ‘మిషన్’ వంటి మరింత వ్యాఖ్యానాత్మక పదంతో ముందే నిర్ణయించదు.
- source_word: ὃ ἐπλήρωσαν
  choice: వారు నెరవేర్చిన
  rationale: πληρόω ఇక్కడ పనిని పూర్తిగా ముగించడం లేదా నెరవేర్చడం అనే భావం కలిగి ఉంది; ‘నెరవేర్చిన’ మూలపదపు భావవిస్తృతిని నిలుపుతుంది.
theological_decisions:
- issue: పౌలు, బర్నబాలను అంతియొకయ సంఘం ముందుగా దేవుని కృపకు అప్పగించిన చర్య స్వభావం
  choice: దేవుని కృపకు అప్పగించబడ్డారు
  alternative: దేవుని కృపకు ఒప్పగించబడ్డారు / దేవుని కృప సంరక్షణకు అప్పగించబడ్డారు
  rationale: గ్రీకు వాక్యం వారిని దేవుని కృపపై ఆధారపడేలా ఆయన సంరక్షణకు ఉంచిన భావాన్ని ఇస్తుంది. అనువాదం ప్రత్యేకమైన సంఘ నియామక సిద్ధాంతాన్ని దిగుమతి చేయకుండా ఆ భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. పొడవైన గ్రీకు సంబంధవాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; ὅθεν లోని ‘నుండి’ భావాన్ని మాత్రం స్పష్టంగా నిలిపాం.
