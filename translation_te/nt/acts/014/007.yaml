lexical_decisions:
- source_word: κἀκεῖ
  choice: అక్కడ కూడా
  rationale: καί + ἐκεῖ అనే సంయుక్త రూపంలోని స్థలార్థాన్నీ, అనుసంధాన/చేర్పు భావాన్నీ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: εὐαγγελιζόμενοι
  choice: శుభవార్త ప్రకటిస్తూ
  rationale: εὐαγγελίζω యొక్క ‘శుభవార్తను తెలియజేయడం/ప్రకటించడం’ అనే క్రియార్థాన్ని మతపరమైన పారిభాషికతపై ఆధారపడకుండా స్పష్టంగా అందిస్తుంది.
- source_word: ἦσαν
  choice: ఉన్నారు
  rationale: వర్తమాన కృదంతంతో కలిసి ఇది భూతకాలంలో కొనసాగుతున్న క్రియను సూచించే పరిభాషాత్మక నిర్మాణం; ‘ప్రకటిస్తూ ఉన్నారు’ ఆ కొనసాగింపు భావాన్ని తెలుగులో సహజంగా చూపుతుంది.
