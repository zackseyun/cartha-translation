- from: అక్కడ కూడా వారు శుభవార్త ప్రకటిస్తూ ఉన్నారు.[a]
  to: అక్కడ వారు సువార్తను ప్రకటిస్తూ ఉన్నారు.[a]
  rationale: The revision retains the Greek location/connective sense and the ongoing imperfect periphrastic action, while using idiomatic Telugu object marking and the standard neutral biblical term “సువార్త.” The footnote preserves the explicit “there also” reading and the nontechnical lexical equivalent “శుభవార్త.”
  reviewer_model: gpt-5.6-terra
