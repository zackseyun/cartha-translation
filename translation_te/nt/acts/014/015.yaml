id: ACT.14.15
reference: Acts 14:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ἄνδρες, τί ταῦτα ποιεῖτε; καὶ ἡμεῖς ὁμοιοπαθεῖς ἐσμεν ὑμῖν ἄνθρωποι, εὐαγγελιζόμενοι ὑμᾶς ἀπὸ τούτων τῶν ματαίων ἐπιστρέφειν ἐπὶ ⸀θεὸν ζῶντα ὃς ἐποίησεν τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/015.yaml
  text: and saying[a], “Men, why are you doing these things? We also are men with the same nature as you, bringing you good news to turn from these worthless things to the living God[c][b], who made the heaven and the earth and the sea and everything in them.”
translation:
  language: te
  text: 'అంటూ ఇలా అన్నారు: “పురుషులారా, మీరెందుకు ఇలా చేస్తున్నారు? మేమూ మీలాగే మానవులమే.[a] మీరు ఈ వ్యర్థమైన వాటినుంచి[b] సజీవుడైన దేవుని వైపు తిరగాలని మేము మీకు శుభవార్త ప్రకటిస్తున్నాం. ఆయనే ఆకాశాన్ని,[c] భూమిని, సముద్రాన్ని, వాటిలో ఉన్న సమస్తాన్ని సృష్టించాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మీతో సమానమైన మానవ స్థితి గల మనుషులం.” పౌలు, బర్నబాలు తమ శ్రోతలవలెనే మానవులని ఈ మాట నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: “వ్యర్థమైన వాటి” అనేది ఈ సందర్భంలో విగ్రహాలు, వాటికి అర్పించే బలులు సహా నిష్ఫలమైన అన్యదేవతారాధనను సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: గ్రీకులో “ఆకాశం” ఏకవచనంలో ఉంది; ఇది లేఖనాల్లో కనిపించే సృష్టి వాక్యసూత్రాన్ని ప్రతిధ్వనిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες
  choice: పురుషులారా
  rationale: పురుషులను ప్రత్యక్షంగా సంబోధించే ἀνήρ బహువచన సంబోధనను స్పష్టంగా నిలుపుతుంది.
- source_word: ὁμοιοπαθεῖς … ἄνθρωποι
  choice: మేమూ మీలాగే మానవులమే
  rationale: పౌలు, బర్నబాలు దైవికులు కాక, శ్రోతలతో ఒకే మానవ స్థితిని పంచుకునేవారని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘ఒకే స్వభావం’ అనడం నైతిక స్వభావంగా అపార్థమయ్యే అవకాశం ఉంది.
- source_word: εὐαγγελιζόμενοι
  choice: మేము మీకు శుభవార్త ప్రకటిస్తున్నాం
  rationale: క్రియారూపంలోని ‘మంచి వార్త ప్రకటించడం’ అనే భావాన్ని సంఘపరమైన సాంకేతిక పదజాలం లేకుండా స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ματαίων
  choice: వ్యర్థమైన వాటి
  rationale: మూలంలోని విస్తృతమైన ‘నిష్ఫలమైన/శూన్యమైన విషయాలు’ అనే మూల్యాంకన భావాన్ని నిలుపుతుంది; ప్రధాన పాఠంలోనే ‘విగ్రహాలు’ అని పరిమితం చేయదు.
- source_word: ἐπιστρέφειν ἐπὶ θεὸν ζῶντα
  choice: సజీవుడైన దేవుని వైపు తిరగాలని
  rationale: ఒక దిశనుంచి మరొక దిశకు తిరగడం అనే రూపకాన్ని, అలాగే జీవముగల దేవునికీ జీవంలేని ఆరాధ్య వస్తువులకీ ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἐποίησεν
  choice: సృష్టించాడు
  rationale: ఈ సృష్టి సూత్రంలో ποιέω దేవుని సృష్టికార్యాన్ని సూచిస్తుంది; ‘చేశాడు’ కంటే ‘సృష్టించాడు’ ఆధునిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: τὸν οὐρανὸν … πάντα τὰ ἐν αὐτοῖς
  choice: ఆకాశాన్ని … వాటిలో ఉన్న సమస్తాన్ని
  rationale: గ్రీకు ఏకవచన ‘ఆకాశం’ను, చివరి సమగ్ర వాక్యభాగాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: పౌలు, బర్నబాల మానవ స్థితి మరియు వారికి ఇవ్వబోయిన దైవిక గౌరవం
  choice: మేమూ మీలాగే మానవులమే
  alternative: మేమూ మీతో సమాన స్వభావం గల మనుషులమే
  rationale: వారు దేవతలు కాదని, శ్రోతలతో ఒకే మానవ స్థితిలో ఉన్నారని స్పష్టం చేస్తుంది; అయితే ఈ మాటను కేవలం ఒకే భావోద్వేగాలు కలవారనే అర్థానికి కుదించదు.
- issue: ‘వ్యర్థమైన వాటి’ పరిధి
  choice: ప్రధాన పాఠంలో విస్తృతమైన వ్యర్థతా భాషను నిలుపడం
  alternative: విగ్రహాలు
  rationale: సందర్భంలో అన్యదేవతారాధన, బలి, విగ్రహాలు ఉద్దేశించబడ్డాయి; అయినా గ్రీకు పదం నేరుగా ‘విగ్రహాలు’ అనే నామవాచకం కాక మరింత విస్తృతమైనది.
- issue: ‘సజీవుడైన దేవుడు’ అనే వ్యత్యాసం
  choice: సజీవుడైన దేవుడు
  alternative: జీవముగల దేవుడు
  rationale: దేవుడు నిజంగా జీవించేవాడని చెప్పే మూలార్థాన్ని కాపాడుతూ, జీవంలేని ఆరాధ్య వస్తువులతో సందర్భంలోని వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. Ἄνδρες యొక్క లింగ-నిర్దిష్ట సంబోధనకు ‘పురుషులారా’ ఉంచబడింది. గ్రీకు వాక్యంలోని పొడవును తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించినా, శుభవార్త ప్రకటించడం, తిరగడం, సృష్టికర్తయైన దేవుడు అనే తార్కిక సంబంధం యథాతథంగా నిలుపబడింది.
