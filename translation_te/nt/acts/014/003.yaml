id: ACT.14.3
reference: Acts 14:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἱκανὸν μὲν οὖν χρόνον διέτριψαν παρρησιαζόμενοι ἐπὶ τῷ κυρίῳ τῷ μαρτυροῦντι ⸀τῷ λόγῳ τῆς χάριτος αὐτοῦ, διδόντι σημεῖα καὶ τέρατα γίνεσθαι διὰ τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/003.yaml
  text: So they stayed there a considerable time[a], speaking boldly for the Lord, who was bearing witness to the word of his grace, granting signs and wonders to be done through their hands.
translation:
  language: te
  text: కాబట్టి వారు అక్కడ గణనీయమైన కాలం ఉండి, ప్రభువు కోసం ధైర్యంగా మాట్లాడారు.[a] ప్రభువు తన కృపా వాక్యానికి సాక్ష్యమిస్తూ, వారి చేతుల ద్వారా సూచకాలు, అద్భుతాలు జరిగేలా అనుగ్రహిస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రభువులో ధైర్యంగా మాట్లాడారు’; ఈ గ్రీకు ప్రయోగం వారి ధైర్యం ప్రభువులో ఆధారపడి ఉందని లేదా ప్రభువుతో వారి సంబంధంలో వ్యక్తమైందని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἱκανὸν ... χρόνον
  choice: చాలాకాలం
  rationale: ఈ గ్రీకు ప్రయోగం గణనీయమైన కాలవ్యవధిని సూచిస్తుంది; ‘చాలాకాలం’ సహజమైన ఆధునిక తెలుగు.
- source_word: διέτριψαν
  choice: అక్కడ ... ఉండి
  rationale: సందర్భంలో ఒక చోట కొంతకాలం గడపడం లేదా అక్కడే ఉండడం అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: παρρησιαζόμενοι
  choice: ధైర్యంగా మాట్లాడుతూ ఉన్నారు
  rationale: భయం లేకుండా బహిరంగంగా మాట్లాడే నిరంతర చర్యను తెలియజేస్తుంది.
- source_word: ἐπὶ τῷ κυρίῳ
  choice: ప్రభువు కోసం
  rationale: ప్రభువుతో సంబంధించి, ఆయన సేవలో వారు ధైర్యంగా మాట్లాడారనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ఆధారం లేదా ఆశ్రయం అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: τῷ κυρίῳ
  choice: ప్రభువు
  rationale: κύριος అనే బిరుదును అదనపు వ్యక్తి-నిర్దేశం చేర్చకుండా యథాతథంగా నిలుపుతుంది.
- source_word: τῷ μαρτυροῦντι
  choice: సాక్ష్యమిస్తూ
  rationale: ప్రభువు కొనసాగిస్తూ చేసిన ధ్రువీకరణను, సాక్ష్యపు భావాన్ని నిలుపుతుంది.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: తన కృపావాక్యానికి
  rationale: ‘ఆయన కృపకు సంబంధించిన వాక్యం/సందేశం’ అనే జనిటివ్ నిర్మాణాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: διδόντι
  choice: అనుగ్రహించాడు
  rationale: సూచకక్రియలు, అద్భుతాలు జరిగేందుకు ప్రభువు ఇచ్చిన సామర్థ్యం లేదా అనుమతిని సూచిస్తుంది.
- source_word: σημεῖα καὶ τέρατα
  choice: సూచకక్రియలు, అద్భుతాలు
  rationale: σημεῖα యొక్క సూచనాత్మక స్వభావాన్ని, τέρατα యొక్క ఆశ్చర్యకర స్వభావాన్ని రెండింటినీ వేరుగా నిలుపుతుంది.
- source_word: γίνεσθαι
  choice: జరిగేలా
  rationale: ఈ క్రియలు ప్రభువు అనుగ్రహం వల్ల వారి ద్వారా సంభవించాయని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: διὰ τῶν χειρῶν αὐτῶν
  choice: వారి చేతుల ద్వారా
  rationale: అపొస్తలులు సాధనాలుగా ఉన్నారనే భావంతో పాటు మూలంలోని స్పష్టమైన శరీరాంగ రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘ప్రభువు’ అనే పదానికి సూచిత వ్యక్తి
  choice: గ్రీకులో ఉన్నట్లే ‘ప్రభువు’ అని మాత్రమే అనువదించడం
  alternative: ‘ప్రభువైన యేసు’ అని స్పష్టీకరించడం లేదా సాధారణంగా దేవునిగా అర్థం చేయడం
  rationale: మూలపాఠంలో τῷ κυρίῳ మాత్రమే ఉంది; ‘యేసు’ అని చేర్చడం పాఠంలో లేని స్పష్టతను దిగుమతి చేస్తుంది.
- issue: ἐπὶ τῷ κυρίῳ యొక్క భావం
  choice: ప్రధాన పాఠంలో ‘ప్రభువు కోసం’
  alternative: ‘ప్రభువులో’ లేదా ‘ప్రభువుపై ఆధారపడి’
  rationale: ఈ విభక్తి ప్రయోగం సేవ/సంబంధం, పరిధి లేదా ఆధారాన్ని సూచించగలదు. సహజమైన ప్రధాన పఠనాన్ని ఇచ్చి, నిజమైన అస్పష్టతను పాదసూచికలో కాపాడాం.
- issue: ‘కృపావాక్యం’లో జనిటివ్ సంబంధం
  choice: సంబంధాన్ని విడదీయకుండా ‘తన కృపావాక్యం’ అని ఉంచడం
  alternative: ‘తన కృపను గురించిన సందేశం’ లేదా ‘తన కృపగల వాక్యం’
  rationale: τῆς χάριτος అనే జనిటివ్ కృపను గురించిన సందేశమా, కృపచేత లక్షణీకరించబడిన వాక్యమా అనే భావవిస్తృతిని కలిగి ఉంది; సమాసరూపం దానిని అతిగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని దీర్ఘ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించినా, కారణ-సంబంధం మరియు ప్రభువే సాక్ష్యమిచ్చి అద్భుతాలను అనుగ్రహించాడనే నిర్మాణం నిలుపబడింది.
