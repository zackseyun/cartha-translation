revisions:
- from: కాబట్టి వారు అక్కడ చాలాకాలం ఉండి, ప్రభువు కోసం ధైర్యంగా మాట్లాడుతూ ఉన్నారు.[a] ఆయన తన కృపావాక్యానికి సాక్ష్యమిస్తూ, వారి చేతుల ద్వారా సూచకక్రియలు, అద్భుతాలు జరిగేలా అనుగ్రహించాడు.
  to: కాబట్టి వారు అక్కడ గణనీయమైన కాలం ఉండి, ప్రభువు కోసం ధైర్యంగా మాట్లాడారు.[a] ప్రభువు తన కృపా వాక్యానికి సాక్ష్యమిస్తూ, వారి చేతుల ద్వారా సూచకాలు, అద్భుతాలు జరిగేలా అనుగ్రహిస్తూ ఉన్నాడు.
  rationale: సవరణ మూలంలోని రెండు వర్తమాన కృదంతాల కొనసాగుతున్న స్వభావాన్ని పునరుద్ధరిస్తుంది. ‘ప్రభువు కోసం’ అనే ప్రధాన అనువాదం మరియు దాని ప్రత్యామ్నాయ భావాన్ని తెలిపే పాదసూచికను అలాగే కాపాడింది; ‘యేసు’ వంటి అదనపు నిర్దేశాన్ని చేర్చలేదు. వచనార్థంలో మార్పు చేయకుండా పదబంధాలను మరింత సహజమైన ఆధునిక తెలుగు రూపంలో ఇచ్చింది.
