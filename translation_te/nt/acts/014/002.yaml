id: ACT.14.2
reference: Acts 14:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ ⸀ἀπειθήσαντες Ἰουδαῖοι ἐπήγειραν καὶ ἐκάκωσαν τὰς ψυχὰς τῶν ἐθνῶν κατὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/002.yaml
  text: But the Jews who were disobedient stirred up the Gentiles and poisoned their minds against the brothers[a][b][c].
translation:
  language: te
  text: అయితే నమ్మడానికి నిరాకరించిన యూదులు, యూదేతరులను రెచ్చగొట్టి, సహోదరులకు విరోధంగా వారి మనసులను విషపూరితం చేశారు[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అవిధేయులైన.” గ్రీకు పదం సందేశాన్ని నమ్మడానికి నిరాకరించడాన్ని కూడా సూచించగలదు; ఈ సందర్భంలో సువార్తను తిరస్కరించడమే ఉద్దేశంగా కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “వారి ఆత్మలను”; ఇక్కడ వారి అంతరంగ వైఖరి లేదా మనోభావం అని అర్థం.
    reason: lexical_alternative
  - marker: c
    text: “సహోదరులు” అనే పదం ఇక్కడ స్త్రీలతో సహా తోటి విశ్వాసులందరినీ సూచించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειθήσαντες
  choice: నమ్మడానికి నిరాకరించిన
  rationale: సువార్త ప్రకటన సందర్భంలో ఈ పదం సాధారణ అవిధేయతకన్నా సందేశాన్ని నమ్మడానికి నిరాకరించడాన్ని సూచిస్తుంది; అలాగే ఇందులోని సంకల్పపూర్వక తిరస్కార భావాన్ని నిలుపుతుంది.
- source_word: Ἰουδαῖοι
  choice: యూదులు
  rationale: గ్రీకు పదానికి నేర అనువాదం. సందర్భంలో ఇది యూదులందరినీ కాక, అక్కడ సందేశాన్ని వ్యతిరేకించిన స్థానిక యూదుల గుంపును సూచిస్తుంది.
- source_word: ἐπήγειραν
  choice: రెచ్చగొట్టి
  rationale: ఇతరుల్లో విరోధ భావాన్ని రేపి వారిని ప్రేరేపించడం అనే కారణార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐκάκωσαν
  choice: విషపూరితం చేశారు
  rationale: ψυχὰς అనే కర్మతోను, సహోదరులకు విరోధంగా అనే ప్రయోగంతోను కలిసినప్పుడు, అంతరంగ వైఖరిని చెడగొట్టడం లేదా విషపూరితం చేయడం అనే రూపకాలంకార భావం వస్తుంది.
- source_word: τὰς ψυχὰς
  choice: వారి మనసులను
  rationale: అక్షరార్థంగా ‘ప్రాణాలు/ఆత్మలు’ అయినా, ఇక్కడ ఉద్దేశం వారి అంతరంగ వైఖరి లేదా మనోభావం; ‘మనసులు’ ఆ సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: τῶν ἐθνῶν
  choice: యూదేతరులను
  rationale: అపొస్తలుల కార్యములలో యూదులు–ఇతర జనులు అనే వ్యత్యాసంలో ἔθνη యూదులు కానివారిని సూచిస్తుంది; ఆధునిక తెలుగు పాఠకులకు ‘యూదేతరులు’ స్పష్టంగా ఉంటుంది.
- source_word: κατὰ τῶν ἀδελφῶν
  choice: సహోదరులకు విరోధంగా
  rationale: ἀδελφῶν యొక్క బంధుత్వ రూపకాన్ని నిలుపుతూ, తొలి క్రైస్తవ సమాజంలోని తోటి విశ్వాసులను సూచించే వాడుకను ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ἀδελφῶν మిశ్రమ లింగాల విశ్వాస సమాజాన్ని సూచించే అవకాశం
  choice: సహోదరులు
  alternative: సహోదర సహోదరీలు; విశ్వాసులు
  rationale: గ్రీకులో పుంలింగ బహువచనం ఉన్నందున ప్రధాన పాఠంలో రూపాన్ని దగ్గరగా నిలిపాం; అయితే సందర్భంలో స్త్రీలతో సహా తోటి విశ్వాసులందరూ ఉద్దేశించబడి ఉండవచ్చని పాదటిప్పణిలో స్పష్టం చేశాం.
- issue: ἀπειθήσαντες లో అవిశ్వాసం–అవిధేయత మధ్య భావ విస్తృతి
  choice: నమ్మడానికి నిరాకరించిన
  alternative: అవిధేయులైన; నమ్మని
  rationale: ఈ సువార్త ప్రకటనా సందర్భంలో సందేశాన్ని తిరస్కరించడం ప్రధాన భావం. అయినప్పటికీ గ్రీకు పదంలోని అవిధేయత భావాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘విషపూరితం చేశారు’ అనే రూపకం మూలంలోని ప్రతికూల అంతరంగ ప్రభావాన్ని స్పష్టంగా నిలుపుతుంది; ‘యూదులు’ అనే పదం సందర్భానుసారం స్థానికంగా వ్యతిరేకించిన గుంపునే సూచిస్తుంది.
