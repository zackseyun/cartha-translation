  yaml_path: translation/nt/acts/014/025.yaml
  text: And after speaking the word in Perga[a], they went down to Attalia,
translation:
  language: te
  text: పెర్గేలో వాక్యాన్ని పలికిన తరువాత, వారు అత్తాలియాకు దిగివెళ్లారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαλήσαντες
  choice: ప్రకటించిన తరువాత
  rationale: కాలపరంగా ప్రధాన క్రియకు ముందే జరిగిన కార్యాన్ని సూచించే aorist participle కాబట్టి ‘తరువాత’ అని సహజంగా అనువదించాం. సందర్భంలో ఇది క్రైస్తవ సందేశాన్ని ప్రజలకు తెలియజేయడాన్ని సూచిస్తుంది; ‘మాట్లాడిన తరువాత’ మరింత అక్షరార్థమైనా తెలుగులో ఉద్దేశాన్ని తక్కువ స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὸν λόγον
  choice: వాక్యాన్ని
  rationale: లూకా రచనల్లో క్రైస్తవ సువార్త సందేశానికి వాడే పునరావృత అభివ్యక్తిని నిలుపుతుంది. గ్రీకులో లేని ‘ప్రభువు వాక్యాన్ని’ అనే పదబంధాన్ని చేర్చలేదు.
- source_word: ἐν Πέργῃ
  choice: పెర్గేలో
  rationale: ἐν మరియు పట్టణనామం కలయికను ఆధునిక తెలుగులో సహజమైన స్థానవాచక రూపంతో ఇచ్చాం.
- source_word: κατέβησαν
  choice: దిగివెళ్లారు
  rationale: καταβαίνωలోని దిగువకు ప్రయాణించే భౌగోళిక భావాన్ని నిలుపుతూ, కథన దృష్టికోణానికి తగిన ‘వెళ్లారు’ను ఉపయోగించాం.
- source_word: εἰς Ἀττάλειαν
  choice: అత్తాలియకు
  rationale: గమ్యస్థానాన్ని సూచించే εἰςను తెలుగులో సహజమైన చతుర్థీ విభక్తితో అనువదించాం.
- source_word: καὶ
  choice: —
  rationale: గ్రీకులోని καί ప్రయాణ కథనాన్ని కొనసాగిస్తుంది. ఈ ఒక్క వాక్యాన్ని తెలుగులో సహజంగా చదివేందుకు ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండా వాక్యక్రమం ద్వారానే కొనసాగింపును వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: 'ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘వాక్యం’ అనే లూకా రచనలకు ప్రత్యేకమైన క్రైస్తవ సందేశ పదప్రయోగాన్ని నిలిపి, మూలంలో లేని ‘ప్రభువు’ను చేర్చలేదు. వ్యక్తి, పట్టణ నామాల లిప్యంతరీకరణ: పెర్గే, అత్తాలియ.'
