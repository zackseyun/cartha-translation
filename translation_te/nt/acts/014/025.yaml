- from: పెర్గేలో వాక్యాన్ని ప్రకటించిన తరువాత, వారు అత్తాలియకు దిగివెళ్లారు.
  to: పెర్గేలో వాక్యాన్ని పలికిన తరువాత, వారు అత్తాలియాకు దిగివెళ్లారు.
