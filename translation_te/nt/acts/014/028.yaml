  text: διέτριβον ⸀δὲ χρόνον οὐκ ὀλίγον σὺν τοῖς μαθηταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/028.yaml
  text: And they stayed with the disciples for no little time[a].
translation:
  language: te
  text: వారు శిష్యులతో కలిసి చాలాకాలం గడిపారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా, “కొద్దికాలం కాదు”; ఇది గణనీయమైన కాలాన్ని సూచించే వ్యతిరేకోక్తి.
    reason: మూలంలోని వ్యతిరేకోక్తిని తెలియజేసే అక్షరార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: διέτριβον
  choice: అక్కడే ఉన్నారు
  rationale: διατρίβω యొక్క అసంపూర్ణ భూతకాల రూపం ఒక చోట కొంతకాలం కొనసాగి ఉండడాన్ని సూచిస్తుంది. సందర్భానుసారంగా ‘అక్కడే ఉన్నారు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం; కొనసాగిన కాలభావాన్ని కూడా నిలుపుతుంది.
- source_word: δὲ
  choice: వాక్య ప్రవాహంలో ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ ఇక్కడ స్వల్ప కథన అనుసంధానకం. తెలుగులో ముందరి వాక్యంతో సహజంగా కొనసాగే సందర్భంలో ‘మరియు/అప్పుడు’ చేర్చడం కృత్రిమంగా ఉండవచ్చు; అందువల్ల భావాన్ని వాక్య క్రమంలోనే వ్యక్తం చేశాం.
- source_word: χρόνον οὐκ ὀλίγον
  choice: చాలాకాలం
  rationale: గ్రీకులో అక్షరార్థంగా ‘కొద్దికాని కాలం’ అనే వ్యతిరేకోక్తి ఉంది; దాని ఉద్దేశిత అర్థం గణనీయమైన కాలం. సహజమైన ఆధునిక తెలుగులో ‘చాలాకాలం’ ఆ అర్థాన్ని స్పష్టంగా అందిస్తుంది; మూలంలోని అలంకార రూపాన్ని పాదసూచికలో తెలిపాం.
- source_word: σὺν τοῖς μαθηταῖς
  choice: శిష్యులతో కలిసి
  rationale: σύν + చతుర్థీ విభక్తి నేరుగా ‘తో/తో కలిసి’ అనే సహవాసాన్ని సూచిస్తుంది. ‘శిష్యులతో కలిసి’ సాధారణ పాఠకులకు స్పష్టంగా, సహజంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ప్రధాన పాఠంలో సహజమైన కాలవ్యక్తీకరణను ఉపయోగించి, గ్రీకు వ్యతిరేకోక్తిని పాదసూచికలో భద్రపరిచాం.
