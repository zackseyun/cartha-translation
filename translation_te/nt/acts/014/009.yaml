  yaml_path: translation/nt/acts/014/009.yaml
  text: This man listened to Paul speaking[a], who, looking intently at him and seeing that he had faith to be saved,
translation:
  language: te
  text: ఈ మనిషి పౌలు మాట్లాడటం విన్నాడు. పౌలు అతనివైపు నిశితంగా చూచి, అతనికి స్వస్థపడడానికి విశ్వాసం ఉందని గ్రహించి,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రక్షించబడడానికి విశ్వాసం ఉందని.” ఇక్కడున్న గ్రీకు క్రియకు ‘రక్షించబడడం’ లేదా ‘స్వస్థపడడం’ అనే అర్థాలు ఉండవచ్చు; ఈ సందర్భం శారీరక స్వస్థతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: ఈ మనిషి
  rationale: మునుపటి వచనంలో పేర్కొన్న కుంటివాణ్ణి సూచించే నిర్దేశక సర్వనామం; తెలుగులో నిర్దిష్ట సూచనను సహజంగా నిలుపుతుంది.
- source_word: ἤκουσεν
  choice: వింటూ ఉన్నాడు
  rationale: పౌలు మాట్లాడుతున్నప్పుడు అతడు వినడం కొనసాగుతున్న దృశ్యాన్ని సహజ తెలుగులో తెలియజేస్తుంది; శ్రద్ధగా విన్నాడనే సందర్భార్థాన్ని అతిగా జోడించదు.
- source_word: τοῦ Παύλου λαλοῦντος
  choice: పౌలు మాట్లాడుతుండగా
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణంలోని సమకాలీన చర్యను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀτενίσας αὐτῷ
  choice: అతని వైపు తదేకంగా చూసి
  rationale: ἀτενίζω సూచించే ఏకాగ్ర, నిశిత దృష్టిని గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἰδὼν
  choice: గ్రహించి
  rationale: ఇక్కడ కేవలం కంటితో చూడడం కంటే, అతనిలో విశ్వాసం ఉందని గుర్తించడం భావం; సందర్భానుగుణంగా ‘గ్రహించి’ సహజంగా ఉంటుంది.
- source_word: ἔχει πίστιν
  choice: అతనికి విశ్వాసం ఉందని
  rationale: πίστις‌ను ‘విశ్వాసం’గా ఉంచి, ఆ మనిషి నమ్మక స్పందనను సూచిస్తుంది; ‘విశ్వాస్యత’ అనే అర్థం ఇక్కడ సందర్భానికి సరిపోదు.
- source_word: τοῦ σωθῆναι
  choice: స్వస్థపడడానికి
  rationale: σῴζωకు ‘రక్షించు’ మరియు ‘స్వస్థపరచు’ అనే అర్థాలు ఉన్నాయి; వెంటనే జరిగే శారీరక స్వస్థత ఈ సందర్భంలో ‘స్వస్థపడడం’ను ప్రధానార్థంగా సూచిస్తుంది.
theological_decisions:
- issue: స్వస్థత కథనంలో σωθῆναι అర్థం
  choice: శారీరకంగా స్వస్థపడడం
  alternative: రక్షించబడడం
  rationale: తరువాతి వచనంలో కుంటివాడు నిలబడి నడవడం ఈ పదానికి ఇక్కడ శారీరక స్వస్థత అర్థాన్ని బలపరుస్తుంది. అయినప్పటికీ గ్రీకు పదంలోని విస్తృత ‘రక్షణ’ భావసాధ్యతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలి. గ్రీకు వాక్యంలోని భాగవాచక చర్యల క్రమాన్ని సహజ తెలుగు వాక్య నిర్మాణంలో నిలిపింది.
