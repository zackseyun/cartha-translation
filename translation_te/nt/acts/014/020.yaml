id: ACT.14.20
reference: Acts 14:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κυκλωσάντων δὲ ⸂τῶν μαθητῶν αὐτὸν⸃ ἀναστὰς εἰσῆλθεν εἰς τὴν πόλιν. καὶ τῇ ἐπαύριον ἐξῆλθεν σὺν τῷ Βαρναβᾷ εἰς Δέρβην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/020.yaml
  text: But after the disciples had gathered around him[a], he got up and went into the city[b]. And on the next day he went out with Barnabas to Derbe.
translation:
  language: te
  text: అయితే శిష్యులు అతని చుట్టూ చేరిన తరువాత[a], అతడు లేచి పట్టణంలోకి వెళ్లాడు[b]. మరుసటి రోజు అతడు బర్నబాతో కలిసి దెర్బేకు బయలుదేరాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతనిని చుట్టుముట్టిన తరువాత’ లేదా ‘అతని చుట్టూ వలయంగా చేరిన తరువాత.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతడు లేచాడు.’ గ్రీకు పదాన్ని ఇలా కూడా అనువదించవచ్చు; అయితే ఇక్కడ పునరుత్థానాన్ని స్పష్టంగా వర్ణించడం కంటే పౌలు శారీరకంగా లేవడాన్నే సూచిస్తున్నట్లు ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: κυκλωσάντων
  choice: చుట్టూ చేరినప్పుడు
  rationale: κυκλόω అనే క్రియకు అక్షరార్థంగా ‘చుట్టుముట్టడం/వలయంగా చేరడం’ అనే భావం ఉంది. ఇక్కడ శిష్యుల చర్యకు శత్రుత్వ భావం రాకుండా, వారు పౌలు చుట్టూ చేరిన దృశ్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వచనంలో పౌలును రాళ్లతో కొట్టి పట్టణం వెలుపలికి ఈడ్చుకుపోయిన ఘటనకు తరువాత వచ్చిన ఆశ్చర్యకరమైన మలుపును δέ స్వల్ప వ్యత్యాసంతో సూచిస్తుంది.
- source_word: τῶν μαθητῶν
  choice: శిష్యులు
  rationale: అపొస్తలుల కార్యములలో μαθητήςకు స్థిరమైన, సుపరిచితమైన తెలుగు సమానార్థకం ‘శిష్యుడు’.
- source_word: ἀναστὰς
  choice: లేచి
  rationale: ἀνίστημι యొక్క ఈ కృదంత రూపం ఇక్కడ పౌలు శారీరకంగా లేచిన చర్యను సహజంగా తెలుపుతుంది; పునరుత్థానం అని వచనం స్పష్టంగా చెప్పని భావాన్ని చేర్చదు.
- source_word: εἰσῆλθεν εἰς τὴν πόλιν
  choice: పట్టణంలోకి వెళ్లాడు
  rationale: εἰσέρχομαι మరియు εἰςలోని లోపలికి సాగే దిశను స్పష్టంగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τῇ ἐπαύριον
  choice: మరుసటి రోజు
  rationale: ఈ కాలవాచక దత్తి రూపానికి సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: ἐξῆλθεν
  choice: బయలుదేరాడు
  rationale: ἐξέρχομαι అక్షరార్థంగా ‘బయటికి వెళ్లాడు.’ తరువాత గమ్యస్థానం రావడం వల్ల ‘దెర్బేకు బయలుదేరాడు’ అనేది దిశను, ప్రయాణారంభాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: σὺν τῷ Βαρναβᾷ
  choice: బర్నబాతో కలిసి
  rationale: σύν + దత్తి సహచర్యాన్ని సూచిస్తుంది; ‘తో కలిసి’ దాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: Δέρβην
  choice: దెర్బే
  rationale: గ్రీకు స్థలనామం Δέρβηకు ధ్వన్యనుసారమైన తెలుగు లిప్యంతరీకరణ.
theological_decisions:
- issue: ἀναστὰς పునరుత్థానాన్ని లేదా అద్భుతంగా బ్రతికించబడటాన్ని సూచించేలా అనువదించాలా
  choice: సాధారణ శారీరక చర్యగా ‘అతడు లేచి’
  alternative: ‘అతడు లేచాడు’ అనే మాటకు పునరుత్థానార్థం ఇవ్వడం లేదా ‘అతడు లేపబడ్డాడు’ అని అనువదించడం
  rationale: ἀναστὰς సాధారణంగా ‘లేచి’ అని అర్థమివ్వగల కర్తరి కృదంతం. రాళ్లతో కొట్టబడిన తరువాత పౌలు కోలుకోవడం అసాధారణంగా కనిపించినా, ఈ వచనం పునరుత్థానం లేదా దైవికంగా లేపబడటం అని స్పష్టంగా చెప్పదు. అందువల్ల మూలంలోని సంయమనాన్ని, భావ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘చుట్టూ చేరినప్పుడు,’ ‘లేచి,’ ‘బయలుదేరాడు’ వంటి సహజ ప్రయోగాలతో మూలంలోని క్రమం, దిశ, సంయమనం కాపాడబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
