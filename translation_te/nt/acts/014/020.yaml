revisions:
- from: అయితే శిష్యులు అతని చుట్టూ చేరినప్పుడు[a], అతడు లేచి పట్టణంలోకి వెళ్లాడు[b]. మరుసటి రోజు అతడు బర్నబాతో కలిసి దెర్బేకు బయలుదేరాడు.
  to: అయితే శిష్యులు అతని చుట్టూ చేరిన తరువాత[a], అతడు లేచి పట్టణంలోకి వెళ్లాడు[b]. మరుసటి రోజు అతడు బర్నబాతో కలిసి దెర్బేకు బయలుదేరాడు.
  rationale: The revision clarifies the completed, antecedent action expressed by the Greek genitive absolute and removes an unnecessary implication (‘standing’) from the lexical alternative. It otherwise preserves the draft’s accurate, natural, and theologically restrained rendering.
