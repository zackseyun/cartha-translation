id: ACT.14.11
reference: Acts 14:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἵ ⸀τε ὄχλοι ἰδόντες ὃ ⸀ἐποίησεν Παῦλος ἐπῆραν τὴν φωνὴν αὐτῶν Λυκαονιστὶ λέγοντες· Οἱ θεοὶ ὁμοιωθέντες ἀνθρώποις κατέβησαν πρὸς ἡμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/011.yaml
  text: And when the crowds saw what Paul had done[a], they raised their voices, saying in the Lycaonian language, “The gods, having become like men[b], have come down to us!”
translation:
  language: te
  text: 'జనసమూహాలు పౌలు చేసినదాన్ని చూసి తమ స్వరాలను ఎత్తి, లుకయోనియా భాషలో ఇలా అన్నారు: “దేవతలు మనుష్యులను పోలినవారై మా దగ్గరకు దిగివచ్చారు!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵ τε ὄχλοι ἰδόντες
  choice: జనసమూహాలు ... చూసి
  rationale: τέ కథన కొనసాగింపును సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో ప్రత్యేక సంధిపదం అవసరం లేదు. బహువచన ὄχλοιను ‘జనసమూహాలు’గా, aorist participle ἰδόντεςను సహజమైన కాలసూచక ‘చూసి’గా అందించాం.
- source_word: ὃ ἐποίησεν Παῦλος
  choice: పౌలు చేసినదాన్ని
  rationale: పౌలు అప్పుడే చేసిన అద్భుత కార్యాన్ని సూచించే సంబంధవాక్యాన్ని సహజమైన ఆధునిక తెలుగులో ఇచ్చాం.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: బిగ్గరగా ... అన్నారు
  rationale: అక్షరార్థంగా ‘తమ స్వరాన్ని ఎత్తారు’ అనే గ్రీకు నుడికారానికి సహజ తెలుగు అర్థం ‘బిగ్గరగా అన్నారు’; కేకవేశారనే అదనపు తీవ్రతను చేర్చలేదు.
- source_word: Λυκαονιστί
  choice: లుకయోనియా భాషలో
  rationale: ఆ ప్రాంతీయ భాషలో మాట్లాడారనే adverbial భావాన్ని ఆధునిక పాఠకులకు స్పష్టంగా తెలిపే రూపం.
- source_word: Οἱ θεοὶ
  choice: దేవతలు
  rationale: ఇది లుస్త్ర ప్రజల అన్యదేవతా అవగాహనను తెలిపే బహువచనం; ‘దేవుళ్లు’ కంటే ‘దేవతలు’ గౌరవప్రదమైన ప్రామాణిక తెలుగులో సహజం.
- source_word: ὁμοιωθέντες ἀνθρώποις
  choice: మనుషుల్లా మారి
  rationale: ὁμοιόω యొక్క aorist passive participle మరియు dative of comparisonను నేరుగా, సహజంగా ప్రతిబింబిస్తుంది. ‘మానవ రూపంలో’ అని చెప్పి రూపధారణ భావాన్ని అతిగా నిర్ధారించలేదు.
- source_word: κατέβησαν πρὸς ἡμᾶς
  choice: మన దగ్గరికి దిగివచ్చారు
  rationale: καταβαίνωలోని ‘కిందికి రావడం’ భావాన్ని నిలుపుతూ, ఉత్సాహభరిత ప్రత్యక్ష వాక్యానికి సహజమైన తెలుగు భూతకాల రూపం వాడాం.
theological_decisions:
- issue: జనసమూహపు అన్యదేవతా వ్యాఖ్యను క్రైస్తవ అవతార సిద్ధాంత భాషగా మార్చకుండా అందించడం
  choice: దేవతలు మనుషుల్లా మారి మన దగ్గరికి దిగివచ్చారు
  alternative: దేవతలు మానవ రూపంలో మన దగ్గరికి దిగివచ్చారు
  rationale: ఈ మాటలు జనసమూహపు పొరపాటు అన్వయాన్ని నివేదిస్తున్నాయి. ‘మనుషుల్లా మారి’ అనేది ὁμοιωθέντες యొక్క సాదృశ్య భావాన్ని నిలుపుతుంది; నిర్దిష్ట క్రైస్తవ అవతార సిద్ధాంత పదజాలాన్ని వాక్యంలోకి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే ప్రత్యక్ష వాక్యంలోని ఉత్సాహం మరియు కథన గౌరవం నిలిచేలా రూపొందించబడింది. మూలంలో పాఠాంతర సూచన అవసరమయ్యేంత ముఖ్యమైన అస్పష్టత లేనందున పాదటిప్పణులు చేర్చలేదు.
