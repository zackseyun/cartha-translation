id: ACT.14.12
reference: Acts 14:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐκάλουν τε ⸀τὸν Βαρναβᾶν Δία, τὸν δὲ Παῦλον Ἑρμῆν, ἐπειδὴ αὐτὸς ἦν ὁ ἡγούμενος τοῦ λόγου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/012.yaml
  text: And they were calling Barnabas Zeus[a], and Paul Hermes[b], because he was the chief speaker.
translation:
  language: te
  text: వారు బర్నబాను జ్యూస్ అని, పౌలును హెర్మెస్[a] అని పిలుస్తూ ఉన్నారు; ఎందుకంటే మాట్లాడటంలో ముందుండేవాడు అతడే.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని పాత అనువాదాల్లో ఈ గ్రీకు దేవుళ్ల రోమన్ పేర్లైన ‘జూపిటర్’, ‘మెర్క్యురీ’ కనిపిస్తాయి; గ్రీకు మూలపాఠంలో ‘జ్యూస్’, ‘హెర్మెస్’ అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: 'గ్రీకు: ‘మాటకు నాయకత్వం వహించేవాడు’; అంటే, ‘ప్రధానంగా మాట్లాడేవాడు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλουν
  choice: పిలుస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న లేదా పదేపదే జరుగుతున్న పిలుపును తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: Δία
  choice: జ్యూస్
  rationale: గ్రీకు మూలపాఠంలో ఉన్న గ్రీకు దేవుని పేరునే ఉంచి, రోమన్ సమాననామమైన ‘జూపిటర్’ను ప్రధాన పాఠంలోకి తీసుకురాలేదు.
- source_word: Ἑρμῆν
  choice: హెర్మెస్
  rationale: గ్రీకు మూలపాఠంలోని పేరును నేరుగా అనుసరిస్తుంది; అనువాద సంప్రదాయంలోని రోమన్ పేరు ‘మెర్క్యురీ’ కంటే దీనికే ప్రాధాన్యం ఇచ్చింది.
- source_word: ἐπειδὴ
  choice: ఎందుకంటే
  rationale: పౌలును హెర్మెస్‌గా ఎందుకు భావించారో తెలిపే కారణ సంబంధాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: αὐτὸς
  choice: అతడే
  rationale: పౌలే మాట్లాడడంలో ప్రధాన పాత్ర వహించాడనే స్వల్ప ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ὁ ἡγούμενος τοῦ λόγου
  choice: మాట్లాడడంలో ముందుండేది
  rationale: అక్షరార్థంగా ‘మాటకు నాయకత్వం వహించేవాడు’ అనే భావాన్ని, ‘వాక్యం’ అనే అనవసరమైన ధార్మిక అర్థాన్ని రప్పించకుండా సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: అన్యదేవతల పేర్ల అనువాదం
  choice: ప్రధాన పాఠంలో ‘జ్యూస్’, ‘హెర్మెస్’ అనే గ్రీకు పేర్లను వాడటం
  alternative: ‘జూపిటర్’, ‘మెర్క్యురీ’ అనే రోమన్ పేర్లను వాడటం
  rationale: ఈ వచనం గ్రీకు పేర్లనే ఉపయోగిస్తోంది. కాబట్టి తరువాతి లాటిన్ అనువాద సంప్రదాయం ద్వారా వచ్చిన రోమన్ సమాననామాలను కాకుండా మూలపాఠంలోని పేర్లను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘మాట్లాడడంలో ముందుండేది అతడే’ అనే నిర్మాణం మూలంలోని స్వల్ప ఉద్ఘాటనను, అలాగే ప్రసంగంలో పౌలు ప్రధాన పాత్రను సహజంగా నిలుపుతుంది.
