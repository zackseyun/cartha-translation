source:
  edition: SBLGNT
  text: ⸀καίτοι οὐκ ἀμάρτυρον ⸀αὑτὸν ἀφῆκεν ⸀ἀγαθουργῶν, οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς καὶ καιροὺς καρποφόρους, ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης τὰς καρδίας ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/017.yaml
  text: Yet he did not leave himself without witness[a], doing good by giving you rains from heaven and fruitful seasons[c][b], filling your hearts with food and gladness.
translation:
  language: te
  text: అయినప్పటికీ, మేలు చేస్తూ, ఆకాశం నుండి మీకు వర్షాలను, ఫలవంతమైన కాలాలను[b] ఇస్తూ, ఆహారంతోను ఆనందంతోను మీ హృదయాలను[c] నింపుతూ, ఆయన తన గురించి సాక్ష్యం లేకుండా ఉండిపోలేదు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన గురించి సాక్ష్యం లేకుండా ఉండిపోలేదు.’ దేవుడు తాను ఎవరో తెలియజేసే సాక్ష్యాన్ని లేకుండా చేయలేదని గ్రీకు వాక్యం నొక్కి చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఫలాలు పండే కాలాలను.’
    reason: lexical_alternative
  - marker: c
    text: కొన్ని ప్రాచీన ప్రతుల్లో ‘మన హృదయాలను’ అని ఉంది; SBLGNT ప్రధాన పాఠంలో ‘మీ హృదయాలను’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: καίτοι
  choice: అయినప్పటికీ
  rationale: మునుపటి వాక్యంతో ఉన్న concessive సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: ἀμάρτυρον
  choice: సాక్ష్యం లేకుండా
  rationale: దేవుడు తనను గురించి సాక్ష్యం లేకుండా ఉంచలేదనే గ్రీకు న్యాయసాక్ష్య/వాంగ్మూల భావాన్ని కాపాడుతుంది.
- source_word: αὑτὸν
  choice: తనను గురించి
  rationale: దేవుడే తన స్వభావం, కార్యాల గురించి సాక్ష్యమిస్తున్నాడనే reflexive భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀγαθουργῶν
  choice: మేలు చేస్తూ
  rationale: దేవుని క్రియాశీల ఉపకారాన్ని సూటిగా, సాధారణ పాఠకులకు అర్థమయ్యేలా తెలియజేస్తుంది.
- source_word: οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς
  choice: ఆకాశం నుంచి మీకు వర్షాలను ... ఇస్తూ
  rationale: οὐρανόθεν యొక్క మూలస్థాన భావాన్ని, ὑετούς యొక్క బహువచనాన్ని నిలుపుతుంది.
- source_word: καιροὺς καρποφόρους
  choice: ఫలవంతమైన కాలాలను
  rationale: వ్యవసాయ ఫలసమృద్ధిని సూచించే గ్రీకు పదబంధాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης
  choice: ఆహారంతో, ఆనందంతో ... నింపుతూ
  rationale: భౌతిక పోషణతో పాటు కలిగే సంతోషాన్ని సమాంతరంగా, గ్రీకు నిర్మాణానికి దగ్గరగా ఉంచుతుంది.
- source_word: τὰς καρδίας ὑμῶν
  choice: మీ హృదయాలను
  rationale: SBLGNT ప్రధాన పాఠంలోని రెండవ పురుష బహువచన సర్వనామాన్ని అనుసరిస్తుంది.
theological_decisions:
- issue: సృష్టిలోని ఉపకారాల ద్వారా దేవుడు తనను గురించి ఇచ్చే సాక్ష్యం
  choice: వర్షాలు, ఫలవంతమైన కాలాలు, ఆహారం, ఆనందం వంటి తన మేలుల ద్వారా దేవుడు తనను గురించి సాక్ష్యం ఇచ్చాడు
  alternative: ఈ వాక్యం ఎలాంటి దేవసంబంధ సూచనలూ లేని సహజ ప్రక్రియలను మాత్రమే వివరిస్తుంది
  rationale: ‘తనను గురించి సాక్ష్యం లేకుండా ఉంచలేదు’ అనే ప్రధాన వాక్యానికి దేవుని మేలుచేసే కార్యాలను తెలిపే participles వివరణగా ఉన్నాయి; అందువల్ల పాఠంలో ఉన్న దైవసాక్ష్య భావాన్ని మాత్రమే తెలియజేస్తుంది, దాని దాటి సిద్ధాంతాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు సులభమైన శైలి. గ్రీకులోని వరుస participles దేవుడు ఏ విధంగా మేలు చేశాడో వివరిస్తున్నందున, తెలుగులో డాష్‌ల మధ్య ఉంచి ప్రధాన వాక్యంతో వాటి సంబంధాన్ని స్పష్టంచేశాం. ‘హృదయాలు’ అనే బైబిలీయ మానవ-అంతరంగ పదాన్ని నిలుపుతూ, పాఠభేదాన్ని పాదటిప్పణిలో తెలిపాం.
