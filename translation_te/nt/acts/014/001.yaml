id: ACT.14.1
reference: Acts 14:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν Ἰκονίῳ κατὰ τὸ αὐτὸ εἰσελθεῖν αὐτοὺς εἰς τὴν συναγωγὴν τῶν Ἰουδαίων καὶ λαλῆσαι οὕτως ὥστε πιστεῦσαι Ἰουδαίων τε καὶ Ἑλλήνων πολὺ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/001.yaml
  text: In Iconium they entered together into the synagogue of the Jews and spoke in such a way that a great multitude of both Jews and Greeks believed[a].
translation:
  language: te
  text: ఇకొనియలో వారు కలిసి యూదుల సమాజ మందిరంలోకి[a] వెళ్లి, యూదుల్లోను గ్రీకుల్లోను ఎంతోమంది విశ్వసించేలా మాట్లాడారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదుల సభామందిరంలోకి.’ మూల గ్రీకులో అక్షరార్థంగా ‘యూదుల సమాజమందిరంలోకి’ అని ఉంది.
    reason: పదార్థ ప్రత్యామ్నాయం మరియు τῶν Ἰουδαίων (‘యూదుల’) అనే మూల సంబంధాన్ని సూచించడం
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ప్రత్యేక పదంగా అనువదించకుండా సహజ కథన వాక్యంగా ప్రారంభించడం
  rationale: ఈ ప్రయోగం ఇక్కడ ప్రధానంగా కథనాన్ని కొనసాగించే నిర్మాణం. మూలంలో స్పష్టమైన ‘ఇప్పుడు’ అనే కాలసూచక పదం లేనందున తెలుగులో అనవసరంగా ‘ఇప్పుడు’ లేదా ‘అప్పుడు’ చేర్చలేదు.
- source_word: ἐν Ἰκονίῳ
  choice: ఈకొనియలో
  rationale: స్థల సూచనను సహజ తెలుగు విభక్తితో ఇచ్చి, పేరును ధ్వన్యనువాదం చేశాం.
- source_word: κατὰ τὸ αὐτό
  choice: కలిసి
  rationale: ఈ సందర్భంలో పౌలు, బర్నబా ఉమ్మడిగా చేసిన కార్యాన్ని ఈ ప్రయోగం సూచిస్తుంది; ‘కలిసి’ స్పష్టమైన, సహజమైన తెలుగు.
- source_word: εἰσελθεῖν αὐτοὺς
  choice: వారు ... వెళ్లి
  rationale: గ్రీకు కథన నిర్మాణంలోని క్రియార్థక రూపాన్ని తెలుగులో సహజమైన సమాపక క్రియగా మార్చాం. ‘లోకి వెళ్లి’ ప్రవేశ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἰς τὴν συναγωγὴν τῶν Ἰουδαίων
  choice: యూదుల సమాజమందిరంలోకి
  rationale: τῶν Ἰουδαίων అనే సంబంధాన్ని నిలుపుతూ, συναγωγήకి తెలుగులో ప్రాచుర్యంలో ఉన్న ‘సమాజమందిరం’ అనే పదాన్ని వాడాం.
- source_word: λαλῆσαι
  choice: మాట్లాడారు
  rationale: ప్రకటనలోని విషయాన్ని మూలవాక్యం ఇక్కడ పేర్కొనదు; అందువల్ల ‘బోధించారు’ లేదా ‘సువార్త ప్రకటించారు’ అని విస్తరించకుండా సాధారణ క్రియను నిలిపాం.
- source_word: οὕτως ὥστε
  choice: విశ్వసించే విధంగా
  rationale: వారు మాట్లాడిన తీరు మరియు దాని ఫలితం రెండింటినీ సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πιστεῦσαι
  choice: విశ్వసించే
  rationale: πιστ- పదకుటుంబానికి సాధారణమైన ‘విశ్వసించు’ అనే అనువాదాన్ని నిలిపి, దేనిని లేదా ఎవరిని విశ్వసించారో మూలంలో స్పష్టంగా లేనందున కర్మను చేర్చలేదు.
- source_word: Ἰουδαίων τε καὶ Ἑλλήνων πολὺ πλῆθος
  choice: యూదులూ గ్రీకులూ ఎంతోమంది
  rationale: రెండు వర్గాలనూ τε καὶ ప్రకారం సమానంగా కలుపుతూ, πολὺ πλῆθοςను ఆధునిక తెలుగులో సహజంగా ‘ఎంతోమంది’ అని వ్యక్తం చేశాం.
theological_decisions:
- issue: πιστεῦσαι అనే క్రియ యొక్క భావం
  choice: విశ్వసించారు అనే ప్రాథమిక భావాన్ని నిలుపుతూ ‘విశ్వసించే’
  alternative: విశ్వాసంలోకి వచ్చారు / సందేశాన్ని నమ్మారు
  rationale: మూలపాఠం విశ్వాసానికి సంబంధించిన కర్మను ఈ వాక్యంలో స్పష్టంగా చెప్పదు. కాబట్టి ‘సందేశాన్ని’ వంటి వివరణను చేర్చకుండా, కథనంలోని నిజమైన సంక్షిప్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. ‘గొప్ప సమూహం’ అనే అక్షరానువాదం కంటే ‘ఎంతోమంది’ సహజంగా ఉండి పరిమాణ భావాన్ని నిలుపుతుంది.
