source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος, διαρρήξαντες τὰ ἱμάτια ⸀αὐτῶν ⸀ἐξεπήδησαν εἰς τὸν ὄχλον κράζοντες
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/014.yaml
  text: But when the apostles Barnabas and Paul heard, they tore their garments and rushed out into the crowd, crying out,
translation:
  language: te
  text: 'అయితే అపొస్తలులైన బర్నబా, పౌలు అది విని, తమ వస్త్రాలు చింపుకొని[a], జనసమూహంలోకి ఒక్కసారిగా దూసుకెళ్లి[b], బిగ్గరగా ఇలా కేకలు వేశారు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: వస్త్రాలు చింపుకోవడం దుఃఖం, దిగ్భ్రాంతి లేదా దైవదూషణతో కూడిన గౌరవానికి వ్యతిరేకంగా తీవ్ర నిరసన తెలిపే ఆచారబద్ధమైన సూచన.
    reason: cultural_note
  - marker: b
    text: లేదా ‘జనసమూహంలోకి ఒక్కసారిగా ఎగబడ్డారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: అది విని
  rationale: భూతకాల క్రియావిశేషణం ప్రధాన చర్యలకు ముందున్న సందర్భాన్ని సూచిస్తుంది; తెలుగులో ‘అది విని’ సహజంగా చర్యల క్రమాన్ని తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: జనసమూహం చేయబోయిన పనికి అపొస్తలుల ప్రతిస్పందనకు మధ్య ఉన్న స్వల్ప వ్యత్యాసాన్ని, కథన మలుపును తెలియజేస్తుంది.
- source_word: οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος
  choice: అపొస్తలులైన బర్నబా, పౌలు
  rationale: గ్రీకు సమానాధికరణ నిర్మాణం బర్నబా, పౌలును అపొస్తలులుగా గుర్తిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ఇది సహజంగా ఉంటుంది.
- source_word: διαρρήξαντες τὰ ἱμάτια αὐτῶν
  choice: తమ వస్త్రాలు చింపుకొని
  rationale: దుఃఖం, దిగ్భ్రాంతి లేదా తీవ్ర నిరసనను తెలిపే సాంస్కృతిక చర్యను స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἐξεπήδησαν
  choice: ఒక్కసారిగా దూసుకెళ్లి
  rationale: క్రియలోని ఆకస్మికమైన, బలమైన కదలికను వ్యక్తం చేస్తుంది. గ్రీకులో ప్రత్యేకంగా ‘బయటికి’ అనే పదం లేనందున దాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: εἰς τὸν ὄχλον
  choice: జనసమూహంలోకి
  rationale: εἰς సూచించే దిశాత్మక కదలికను, ప్రజల గుంపులోకి వెళ్లడాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: κράζοντες
  choice: బిగ్గరగా ఇలా కేకలు వేశారు
  rationale: ప్రధాన కదలికతో పాటు జరిగిన తీవ్ర స్వరప్రకటనను తెలియజేస్తుంది; తరువాతి వచనంలో వచ్చే మాటలకు సహజంగా దారితీస్తుంది.
theological_decisions:
- issue: ‘అపొస్తలులు’ అనే పదం బర్నబా, పౌలుకు వర్తించడం
  choice: ‘అపొస్తలులైన బర్నబా, పౌలు’ అని మూలపాఠంలోని గుర్తింపును నిలుపుకోవడం
  alternative: బర్నబా, పౌలును కేవలం ‘దూతలు’ అని అనువదించడం లేదా అపొస్తలత్వ పరిధిని వివరణాత్మకంగా పరిమితం చేయడం
  rationale: గ్రీకు పాఠ్యం ఈ సందర్భంలో బర్నబా, పౌలును నేరుగా ‘అపొస్తలులు’గా గుర్తిస్తుంది. తరువాతి సిద్ధాంతపరమైన వర్గీకరణను పాఠ్యంలోకి దిగుమతి చేయకుండా ఆ ఉద్రిక్తతను యథాతథంగా ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘వస్త్రాలు’ మరియు ‘జనసమూహం’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, బైబిలు కథనానికి తగిన గాంభీర్యాన్ని నిలుపుతాయి. వచనం తరువాతి ప్రత్యక్ష ప్రసంగానికి దారితీస్తున్నందున చివరలో ద్విబిందువు వాడబడింది.
