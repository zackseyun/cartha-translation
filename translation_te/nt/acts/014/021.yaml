id: ACT.14.21
reference: Acts 14:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εὐαγγελισάμενοί τε τὴν πόλιν ἐκείνην καὶ μαθητεύσαντες ἱκανοὺς ὑπέστρεψαν εἰς τὴν Λύστραν καὶ ⸀εἰς Ἰκόνιον καὶ ⸁εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/021.yaml
  text: And after proclaiming the good news in that city and making many disciples[a], they returned to Lystra and to Iconium and to Antioch,
translation:
  language: te
  text: వారు ఆ పట్టణంలో సువార్త ప్రకటించి, అనేకమందిని శిష్యులుగా చేసిన తర్వాత, లుస్త్రకు, ఈకొనియకు, అంతియొకయకు తిరిగి వెళ్లారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐαγγελισάμενοί
  choice: సువార్త ప్రకటించి
  rationale: ఈ భూతకాల క్రియావిశేషణ రూపం ప్రధాన క్రియకు ముందుగా జరిగిన కార్యాన్ని సూచిస్తుంది. ‘సువార్త ప్రకటించి’ అనేది εὐαγγελίζω యొక్క శుభవార్త ప్రకటించే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τε
  choice: వాక్య ప్రవాహంలో ప్రత్యేక పదంగా అనువదించలేదు
  rationale: τε ఇక్కడ ముందున్న సందర్భంతో ఈ భాగాన్ని స్వల్పంగా అనుసంధానిస్తుంది. తెలుగులో ‘వారు’తో వాక్యాన్ని కొనసాగించడం సహజంగా ఉండి, అదనపు ‘మరియు’ అవసరం లేదు.
- source_word: τὴν πόλιν ἐκείνην
  choice: ఆ పట్టణంలో
  rationale: ఇది సందర్భంలోని దెర్బేను తిరిగి సూచిస్తుంది. గ్రీకులోని కర్మవాచక నిర్మాణం తెలుగులో ‘పట్టణంలో ... ప్రకటించి’గా సహజంగా వ్యక్తమవుతుంది.
- source_word: μαθητεύσαντες
  choice: శిష్యులుగా చేసిన తర్వాత
  rationale: μαθητεύω ఇక్కడ ప్రజలను శిష్యులుగా చేయడం అనే సకర్మక భావాన్ని కలిగి ఉంది; కేవలం బోధించడం అనే సన్నని భావానికి పరిమితం చేయలేదు.
- source_word: ἱκανοὺς
  choice: అనేకమందిని
  rationale: ఈ సందర్భంలో ἱκανός గణనీయమైన సంఖ్యను సూచిస్తుంది. ‘అనేకమంది’ సంక్షిప్తమైన, సహజమైన సమానార్థకం.
- source_word: ὑπέστρεψαν
  choice: తిరిగి వెళ్లారు
  rationale: ప్రయాణంలో మునుపటి ప్రాంతాలకు మరల వెళ్లడాన్ని తెలిపే సహజమైన తెలుగు రూపం.
- source_word: εἰς τὴν Λύστραν
  choice: లుస్త్రకు
  rationale: εἰς ఇక్కడ గమ్యస్థానాన్ని సూచిస్తుంది; స్థలనామంతో ‘కు’ సహజమైన తెలుగు ప్రయోగం.
- source_word: εἰς Ἰκόνιον
  choice: ఈకొనియకు
  rationale: మూలంలోని పునరుక్త గమ్యస్థాన క్రమాన్ని నిలుపుతూ εἰς ను ‘కు’గా అనువదించాం.
- source_word: εἰς Ἀντιόχειαν
  choice: అంతియొకయకు
  rationale: గమ్యస్థాన భావాన్ని ‘కు’తో వ్యక్తపరచి, మూలంలోని ప్రయాణ క్రమాన్ని నిలిపాం.
theological_decisions:
- issue: μαθητεύσαντες యొక్క భావ పరిధి
  choice: అనేకమందిని శిష్యులుగా చేసిన తర్వాత
  alternative: అనేకమందికి బోధించిన తర్వాత
  rationale: మూల క్రియ ప్రజలను శిష్యులుగా చేయడాన్ని స్పష్టంగా సూచిస్తుంది. దానిని కేవలం బోధనగా మార్చితే క్రియ యొక్క ఫలితార్థం తగ్గిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన వచనం. స్థలనామాలకు తెలుగు బైబిల్ సంప్రదాయంలో సుపరిచితమైన ‘లుస్త్ర’, ‘ఈకొనియ’, ‘అంతియొకయ’ రూపాలు వాడబడ్డాయి. మూలంలోని రెండు పూర్వక్రియలను తెలుగులో సహజంగా క్రమబద్ధం చేయడానికి ‘ప్రకటించి ... చేసిన తర్వాత’ నిర్మాణం ఉపయోగించబడింది.
