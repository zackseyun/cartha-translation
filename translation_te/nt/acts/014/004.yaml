source:
  edition: SBLGNT
  text: ἐσχίσθη δὲ τὸ πλῆθος τῆς πόλεως, καὶ οἱ μὲν ἦσαν σὺν τοῖς Ἰουδαίοις οἱ δὲ σὺν τοῖς ἀποστόλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/004.yaml
  text: But the people of the city were divided[a], and some were with the Jews and some with the apostles.
translation:
  language: te
  text: అయితే పట్టణ ప్రజలు రెండు వర్గాలుగా చీలిపోయారు[a]. కొందరు యూదుల పక్షాన, మరికొందరు అపొస్తలుల పక్షాన ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పట్టణంలోని జనసమూహం చీలిపోయింది.’
    reason: ‘ἐσχίσθη ... τὸ πλῆθος’ అనే ఏకవచన నిర్మాణానికి మరింత అక్షరార్థమైన ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: ἐσχίσθη
  choice: రెండు వర్గాలుగా చీలిపోయారు
  rationale: σχίζω కర్తరి కాని రూపం ‘చీలిపోవడం/విభజింపబడడం’ అనే భావాన్ని ఇస్తుంది. ఇక్కడ పట్టణ ప్రజల సామాజిక విభజనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; రెండు పక్షాలు ఉన్నాయని తరువాతి వాక్యభాగం స్పష్టం చేస్తుంది.
- source_word: τὸ πλῆθος τῆς πόλεως
  choice: పట్టణ ప్రజలు
  rationale: πλῆθος ఇక్కడ ఒక సందర్భంలో కూడిన గుంపుకన్నా పట్టణంలోని ప్రజాసమూహాన్ని విస్తృతంగా సూచిస్తుంది. ‘పట్టణ ప్రజలు’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: δὲ
  choice: అయితే
  rationale: δέ ముందటి సందర్భం నుంచి స్వల్ప వ్యత్యాసాన్ని లేదా కొత్త పరిణామాన్ని సూచిస్తుంది. ‘అయితే’ ఆ సంబంధాన్ని అతిగా బలపరచకుండా తెలియజేస్తుంది.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: కొందరు ... మరికొందరు
  rationale: ఈ పరస్పర సంబంధ నిర్మాణం రెండు విభిన్న వర్గాలను సూచిస్తుంది. ‘కొందరు ... మరికొందరు’ సహజమైన తెలుగు సమానార్థక నిర్మాణం.
- source_word: σὺν
  choice: పక్షాన
  rationale: σύν ప్రాథమికంగా సహవాసాన్ని సూచించినా, ఈ విభజన సందర్భంలో మద్దతు లేదా వైపు నిలవడమే ఉద్దేశం. ‘పక్షాన’ ఆ సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: Ἰουδαίοις
  choice: యూదులు
  rationale: ఈ వచనంలో పదాన్ని నాయకులకు మాత్రమే పరిమితం చేసే సూచన లేదు. అందువల్ల సాధారణ సమూహపదమైన ‘యూదులు’ నిలుపబడింది.
- source_word: ἀποστόλοις
  choice: అపొస్తలులు
  rationale: అపొస్తలులు అనేది ἀπόστολοιకు స్థిరపడిన, పాఠకులకు సుపరిచితమైన తెలుగు రూపం. ఈ సందర్భంలో అది పౌలు, బర్నబాలను సూచిస్తుంది (అపొస్తలుల కార్యాలు 14:14).
theological_decisions:
- issue: ‘అపొస్తలులు’ ఎవరిని సూచిస్తుంది
  choice: కథనంలోని పదప్రయోగాన్ని అనుసరించి పౌలు, బర్నబాలకు ‘అపొస్తలులు’ అనే designation నిలుపబడింది.
  alternative: ‘దూతలు’ లేదా ‘పంపబడినవారు’ అని సాధారణంగా అనువదించడం.
  rationale: ఇదే అధ్యాయంలో లూకా బర్నబా, పౌలులను స్పష్టంగా ‘అపొస్తలులు’ అని పిలుస్తాడు (14:14). ఈ పదాన్ని యథాతథంగా ఉంచడం పాఠ్యాన్ని కాపాడుతుంది; అపొస్తలత్వంపై వచనం చెప్పనిదేదీ అదనంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘పక్షాన’ అనే పదం సామాజిక అనుబంధాన్ని స్పష్టం చేస్తుంది; ప్రధాన పాఠంలో ‘రెండు వర్గాలుగా’ అనేది οἱ μὲν ... οἱ δὲ సూచించే ద్విపాక్షిక విభజనను సహజంగా ముందుకు తెస్తుంది.
