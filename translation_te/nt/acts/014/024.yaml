  text: And after passing through Pisidia, they came into Pamphylia.
translation:
  language: te
  text: పిసిదియా గుండా ప్రయాణించి, వారు పంఫులియకు వచ్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελθόντες
  choice: గుండా ప్రయాణించి
  rationale: ఈ భూతకాల అసమాపక క్రియ ప్రధాన క్రియకు ముందు జరిగిన ప్రయాణాన్ని సూచిస్తుంది. ‘గుండా ప్రయాణించి’ అనేది ఆ క్రమాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὴν Πισιδίαν
  choice: పిసిదియ
  rationale: ప్రాంతనామాన్ని గ్రీకు ఉచ్చారణకు సమీపంగా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: ἦλθον
  choice: వచ్చారు
  rationale: ἔρχομαι అనే క్రియకు కథన సందర్భంలో సాధారణ అర్థం ‘వచ్చారు’; బహువచన కర్తను తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς τὴν Παμφυλίαν
  choice: పంఫులియకు
  rationale: εἰς గమ్యస్థానం వైపు కదలికను సూచిస్తుంది. తెలుగులో ప్రాంతానికి చేరడాన్ని సహజంగా తెలిపేందుకు ‘-కు’ విభక్తిని వాడాం.
- source_word: καὶ
  choice: వారు
  rationale: గ్రీకులోని καὶ ప్రయాణ కథనాన్ని కొనసాగించే సాధారణ అనుసంధానం. తెలుగులో విడి వచనంగా సహజంగా ఉండేందుకు దాన్ని ప్రత్యేకంగా ‘మరియు’ అని అనువదించకుండా, మునుపటి సందర్భంలోని కర్తను ‘వారు’ అని వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. స్థలనామాలు గ్రీకు రూపాలకు సమీపంగా లిప్యంతరీకరించబడ్డాయి.
