translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలవాక్యం తరువాతి వచనంలో పూర్తయ్యే కాలసంబంధ ఉపవాక్యం కాబట్టి చివర కామాను ఉంచాం. మూలంలోని ὁρμή పదానికి ఉన్న ‘ప్రయత్నం/దూకుడు/దాడి’ అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
