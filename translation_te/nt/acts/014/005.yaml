id: ACT.14.5
reference: Acts 14:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς δὲ ἐγένετο ὁρμὴ τῶν ἐθνῶν τε καὶ Ἰουδαίων σὺν τοῖς ἄρχουσιν αὐτῶν ὑβρίσαι καὶ λιθοβολῆσαι αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/005.yaml
  text: And when an attempt was made by both the Gentiles and the Jews[a], together with their rulers, to mistreat them and to stone them[b],
translation:
  language: te
  text: అయితే, యూదేతరులూ యూదులూ[b] తమ అధికారులతో కలిసి వారితో దుర్వ్యవహారం చేయడానికి, వారిని రాళ్లతో కొట్టడానికి ప్రయత్నించినప్పుడు[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిపై దూసుకురావడానికి” లేదా “వారిపై దాడికి దిగడానికి పూనుకున్నప్పుడు.” గ్రీకు పదం ὁρμή హింసాత్మకంగా ముందుకు దూసుకురావడాన్ని లేదా దాడి మొదలుపెట్టడాన్ని సూచించగలదు. ఇక్కడ దుర్వ్యవహారం చేయడం, రాళ్లతో కొట్టడం ఉద్దేశించిన చర్యలుగా చెప్పబడినందున ప్రధాన పాఠంలో “ప్రయత్నించినప్పుడు” అని అనువదించాం.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని సందర్భాల్లో “యూదయ ప్రాంతస్థులు” అని కూడా అనువదించవచ్చు. ఇక్కడ మాత్రం యూదయ ప్రాంతానికి చెందినవారిని ప్రత్యేకంగా కాక, వ్యతిరేకించిన యూదుల వర్గాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: అయితే, ... చేసినప్పుడు
  rationale: ὡς లోని కాలసంబంధ భావాన్ని ‘చేసినప్పుడు’ తెలియజేస్తుంది; δέ లోని స్వల్ప కథన మలుపును ‘అయితే’ సహజంగా సూచిస్తుంది.
- source_word: ἐγένετο ὁρμὴ
  choice: ప్రయత్నించినప్పుడు
  rationale: ὁρμή హింసాత్మకంగా దూసుకురావడం, దాడికి దిగడం, లేదా ఒక కార్యానికి పూనుకోవడం అనే భావాలను ఇవ్వగలదు. తరువాతి రెండు క్రియలు ఉద్దేశించిన చర్యలుగా ఉండటంతో, అవి పూర్తయ్యాయని సూచించకుండా ‘ప్రయత్నించినప్పుడు’ అని అనువదించాం.
- source_word: τῶν ἐθνῶν
  choice: యూదేతరులు
  rationale: ఇక్కడ ἔθνη భౌగోళిక దేశాలను కాక, యూదులకు భిన్నమైన ప్రజలను సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో ‘యూదేతరులు’ స్పష్టంగా ఉంటుంది.
- source_word: τε καὶ
  choice: యూదేతరులూ యూదులూ
  rationale: τε καί లోని ‘ఇరువర్గాలూ’ అనే సహసంబంధ భావాన్ని రెండు పదాలకు ‘ఊ’ చేర్చి సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: Ἰουδαίων
  choice: యూదులు
  rationale: ఈ సందర్భంలో ఈ పదం యూదయ ప్రాంత నివాసులను మాత్రమే కాక, వ్యతిరేకించిన యూదుల వర్గాన్ని సూచించే అవకాశం ఎక్కువ.
- source_word: σὺν τοῖς ἄρχουσιν αὐτῶν
  choice: తమ అధికారులతో కలిసి
  rationale: ἄρχοντες అధికార స్థానాల్లో ఉన్న పాలకులు లేదా నాయకులను సూచిస్తుంది. ‘అధికారులు’ ఈ సందర్భంలో అర్థాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: ὑβρίσαι
  choice: వారితో దారుణంగా ప్రవర్తించి
  rationale: ὑβρίζω అవమానకరమైన, దౌర్జన్యపూరితమైన దుర్వ్యవహారాన్ని సూచించగలదు. కేవలం మాటలతో అవమానించడానికే పరిమితం చేయకుండా విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: καὶ λιθοβολῆσαι
  choice: వారిని రాళ్లతో కొట్టడానికి
  rationale: λιθοβολέω అంటే రాళ్లతో కొట్టడం. మరణం ఉద్దేశించి ఉండవచ్చుగానీ, క్రియ స్వయంగా ఫలితాన్ని స్పష్టంగా చెప్పదు కాబట్టి ‘చంపడానికి’ అని చేర్చలేదు.
- source_word: αὐτούς
  choice: వారిని
  rationale: సమీప సందర్భంలోని పౌలు, బర్నబాలను సూచించే బహువచన సర్వనామాన్ని సహజంగా అనువదిస్తుంది.
