id: ACT.14.13
reference: Acts 14:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅ ⸀τε ἱερεὺς τοῦ Διὸς τοῦ ὄντος πρὸ τῆς ⸀πόλεως ταύρους καὶ στέμματα ἐπὶ τοὺς πυλῶνας ἐνέγκας σὺν τοῖς ὄχλοις ἤθελεν θύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/013.yaml
  text: And the priest of Zeus[a], whose temple was before the city[b], brought bulls and wreaths to the gates and wanted to offer sacrifice with the crowds.
translation:
  language: te
  text: అప్పుడు, పట్టణం వెలుపల ఉన్న జ్యూస్ ఆలయ పూజారి ఎద్దులను, దండలను[a] ద్వారాల వద్దకు తీసుకువచ్చి, జనసమూహాలతో కలిసి బలి అర్పించాలనుకున్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పూలదండలను” లేదా “ఉత్సవ దండలను.”
    reason: lexical_alternative
  - marker: b
    text: “పట్టణం వెలుపల ఉన్న జ్యూస్ ఆలయ” — అక్షరార్థంగా, “పట్టణం ముందు ఉన్న జ్యూస్‌కు చెందిన.” ఇక్కడ జ్యూస్ ఆలయం లేదా పుణ్యస్థలం ఉద్దేశించబడి ఉండవచ్చు. “ద్వారాలు” పట్టణ ద్వారాలో, ఆలయ ద్వారాలో మూలపాఠం స్పష్టం చేయదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅ τε
  choice: (కథన కొనసాగింపుగా ప్రత్యేక పదం లేకుండా)
  rationale: τεతో కూడిన సంబంధవాచకం కథనాన్ని కొనసాగిస్తుంది; తెలుగులో వాక్యక్రమమే ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἱερεὺς τοῦ Διὸς
  choice: జ్యూస్ ఆలయపు పూజారి
  rationale: Ζεύς అనే గ్రీకు దేవుని పేరును రోమన్ సమానార్థకమైన ‘జూపిటర్’గా మార్చకుండా ‘జ్యూస్’గా ఉంచాం; తరువాతి స్థలవాచక పదబంధంలో సూచితమైన ఆలయంతో సహజంగా అనుసంధానించాం.
- source_word: τοῦ ὄντος πρὸ τῆς πόλεως
  choice: పట్టణం వెలుపల ఉన్న జ్యూస్ ఆలయపు
  rationale: అక్షరార్థంగా ఈ పదబంధం ‘పట్టణం ముందు ఉన్న జ్యూస్’ అని వస్తుంది. సందర్భంలో జ్యూస్ ఆలయం లేదా పుణ్యస్థలం పట్టణం ముందు, అంటే వెలుపల, ఉందనే భావం ఎక్కువగా సంభావ్యమైనది; తెలుగులో స్పష్టత కోసం ‘ఆలయం’ను సూచిత పదంగా చేర్చాం.
- source_word: ταύρους
  choice: ఎద్దులను
  rationale: బలి సందర్భంలో ταῦροςకు నేరమైన, సాధారణ తెలుగు సమానార్థకం ‘ఎద్దు’.
- source_word: στέμματα
  choice: పూలదండలను
  rationale: బలి ఊరేగింపు లేదా ఉత్సవ సందర్భంలో వాడే wreaths/garlandsను ఆధునిక తెలుగులో ‘పూలదండలు’ సహజంగా తెలియజేస్తుంది.
- source_word: ἐπὶ τοὺς πυλῶνας
  choice: ద్వారాల దగ్గరికి
  rationale: చలనాన్ని సూచించే ἐπίతో పాటు బహువచన πυλῶναςను ‘ద్వారాల దగ్గరికి’గా అందించడం తెలుగు వాక్యంలో సహజం; అవి ఏ ద్వారాలో మూలంలో స్పష్టంగా లేదు.
- source_word: ἐνέγκας
  choice: తీసుకొచ్చి
  rationale: అనంతర ప్రధాన క్రియకు నేపథ్య చర్యగా ఉన్న aorist participleను సహజ తెలుగు క్రమంలో ‘తీసుకొచ్చి’గా ఇచ్చాం.
- source_word: σὺν τοῖς ὄχλοις
  choice: జనసమూహాలతో కలిసి
  rationale: ὄχλοις బహువచనాన్ని నిలిపి, పూజారి ప్రజలతో కలిసి చేయదలచిన చర్యను స్పష్టంగా తెలిపాం.
- source_word: ἤθελεν θύειν
  choice: బలి అర్పించాలని అనుకున్నాడు
  rationale: θέλω + infinitive ఉద్దేశం లేదా కోరికను సూచిస్తుంది; ఆరాధనా సందర్భంలో θύωను కేవలం ‘చంపడం’గా కాక ‘బలి అర్పించడం’గా ఇచ్చాం.
theological_decisions:
- issue: τοῦ ὄντος πρὸ τῆς πόλεωςలో సూచిత సంబంధం
  choice: పట్టణం వెలుపల ఉన్న జ్యూస్ ఆలయం
  alternative: ‘పట్టణం ముందు ఉన్న జ్యూస్’ లేదా ‘పట్టణం ముందు ఉన్న జ్యూస్ పుణ్యస్థలం’
  rationale: వ్యాకరణరీత్యా పదబంధం నేరుగా జ్యూస్‌ను విశేషించవచ్చు; అయితే దేవతను ఆమె/అతని ఆలయ స్థానం ద్వారా గుర్తించే ప్రాచీన వాడుక, అలాగే బలి సందర్భం, ఆలయం లేదా పుణ్యస్థలం ఉద్దేశించబడిందని సూచిస్తాయి. ఈ సూచిత పదాన్ని పాఠ్యంలో స్పష్టం చేస్తూనే అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- issue: ద్వారాల గుర్తింపు
  choice: ద్వారాలు అని మాత్రమే అనువదించడం
  alternative: పట్టణ ద్వారాలు లేదా ఆలయ ద్వారాలు
  rationale: మూలంలోని πυλῶνας ఏ ద్వారాలను సూచిస్తుందో నిర్దిష్టంగా చెప్పదు. అందువల్ల ఒక స్థలాన్ని నిర్ణయించి పాఠ్యంలో చేర్చకుండా అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకుడికి సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘పూజారి,’ ‘బలి అర్పించడం’ వంటి ప్రస్తుత మతపరమైన పదాలు సహజంగా ఉన్నాయి. మూలంలోని స్థలసంబంధ అస్పష్టతను పాదసూచికలో నిలిపాం; పాఠ్యంలో ఉన్న రెండు పాదసూచిక గుర్తులు [a], [b] సంబంధిత స్థానాల్లో ఉంచాం.
