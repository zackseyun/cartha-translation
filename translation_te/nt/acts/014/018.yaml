  yaml_path: translation/nt/acts/014/018.yaml
  text: Even by saying these things, they barely restrained the crowds from sacrificing to them.
translation:
  language: te
  text: ఇలా చెప్పినప్పటికీ, తమకు బలి అర్పించకుండా జనసమూహాలను వారు అతి కష్టం మీద ఆపగలిగారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ταῦτα λέγοντες
  choice: ఇలా చెప్పినప్పటికీ
  rationale: καί ఇక్కడ ముందున్న ప్రయత్నానికి విరుద్ధంగా, ఈ మాటలు చెప్పినా జనాన్ని ఆపడం కష్టమైందనే భావాన్ని బలపరుస్తుంది; సహజమైన ఆధునిక తెలుగులో ‘చెప్పినప్పటికీ’ దాన్ని వ్యక్తం చేస్తుంది.
- source_word: μόλις κατέπαυσαν
  choice: అతి కష్టం మీద ఆపగలిగారు
  rationale: μόλις అంటే ‘అతి కష్టం మీద/ఎలాగో’; κατέπαυσαν అంటే చర్యను నిలిపివేయించడం. కలిపి, జనాన్ని నిరోధించడం ఎంత కష్టమైందో సహజంగా తెలియజేస్తుంది.
- source_word: τοὺς ὄχλους
  choice: జనసమూహాలను
  rationale: బహువచనమైన ὄχλουςను ప్రతిబింబిస్తూ, గుమికూడిన ప్రజలను సూచించే సాధారణ పదం.
- source_word: τοῦ μὴ θύειν αὐτοῖς
  choice: తమకు బలి అర్పించకుండా
  rationale: నిరోధించిన చర్యను తెలిపే τοῦ μὴ θύειν నిర్మాణాన్ని తెలుగులో సహజమైన నిషేధార్థక రూపంలో అందిస్తుంది; αὐτοῖςను సందర్భానుసారంగా ‘తమకు’గా అనువదించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే వాక్యంలోని తీవ్రతను మరియు బలి సంబంధిత మతపరమైన భావాన్ని నిలిపి ఉంచే గౌరవప్రదమైన శైలి.
