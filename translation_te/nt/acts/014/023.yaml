id: ACT.14.23
reference: Acts 14:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: χειροτονήσαντες δὲ αὐτοῖς ⸂κατ’ ἐκκλησίαν πρεσβυτέρους⸃ προσευξάμενοι μετὰ νηστειῶν παρέθεντο αὐτοὺς τῷ κυρίῳ εἰς ὃν πεπιστεύκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/023.yaml
  text: And after appointing elders for them in every church[a], and praying with fasting, they entrusted them to the Lord[c][b], in whom they had believed.
translation:
  language: te
  text: వారు ప్రతి సంఘంలో వారికి పెద్దలను నియమించి[a], ఉపవాసాలతో ప్రార్థించి, ఎవరిలో వారు విశ్వాసం ఉంచారో ఆ ప్రభువుకు వారిని అప్పగించారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రతి సంఘంలో వారికి పెద్దలను ఎన్నుకొని.” గ్రీకు క్రియ కొన్ని సందర్భాల్లో చేతులు ఎత్తి లేదా ఓటు ద్వారా ఎన్నుకోవడం అనే భావాన్ని కలిగి ఉండవచ్చు; అయితే ఇక్కడ అది సాధారణంగా నియమించడాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “వారిని” అనేది విశ్వాసులందరినీ కాక, కొత్తగా నియమితులైన పెద్దలను ప్రత్యేకంగా సూచించే అవకాశం కూడా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονήσαντες
  choice: నియమించి
  rationale: ఈ సందర్భంలో క్రియ ఎంపిక చేసి బాధ్యతలో ఉంచడాన్ని సూచిస్తుంది. చేతులు ఎత్తి ఓటు వేయడం అనే పద్ధతిని వాక్యం స్పష్టంగా నిర్దేశించదు; అందువల్ల తటస్థమైన ‘నియమించి’ వాడబడింది.
- source_word: κατ’ ἐκκλησίαν
  choice: ప్రతి సంఘంలో
  rationale: ఏకవచన నామవాచకంతో ఉన్న κατά పంపిణీ భావాన్ని ఇస్తుంది—ఒక్కో స్థానిక సంఘంలో అని అర్థం.
- source_word: πρεσβυτέρους
  choice: పెద్దలను
  rationale: ఇక్కడ ఇది కేవలం వయసులో పెద్దవారిని కాక, సంఘంలో గుర్తింపు పొందిన నాయకులను సూచిస్తుంది. తెలుగు క్రైస్తవ వాడుకలో ‘పెద్దలు’ సహజమైన పదం.
- source_word: προσευξάμενοι μετὰ νηστειῶν
  choice: ఉపవాసాలు పాటిస్తూ ప్రార్థించి
  rationale: ప్రార్థనతో పాటు ఉపవాసాలు జరిగినట్లు గ్రీకు బహువచనం సూచిస్తుంది; తెలుగు సహజత్వాన్ని కాపాడుతూ ఆ అనుబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: παρέθεντο
  choice: అప్పగించారు
  rationale: వ్యక్తులను ప్రభువు సంరక్షణకు ఒప్పగించడం అనే సంబంధాత్మక భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: τῷ κυρίῳ
  choice: ప్రభువుకు
  rationale: దత్తివిభక్తి వారిని ఎవరి సంరక్షణకు అప్పగించారో తెలియజేస్తుంది.
- source_word: εἰς ὃν πεπιστεύκεισαν
  choice: తాము విశ్వసించిన ప్రభువుకు
  rationale: πιστεύω εἰς ప్రభువుపై ఉంచిన విశ్వాసాన్ని సూచిస్తుంది; pluperfect ముందే ఏర్పడిన విశ్వాసాన్ని తెలియజేస్తుంది. తెలుగులో ‘విశ్వసించిన’ సందర్భానుసారంగా ఆ పూర్వత్వాన్ని సహజంగా అందిస్తుంది.
- source_word: αὐτοῖς ... αὐτοὺς
  choice: వారి కోసం ... వారిని
  rationale: మొదటి సర్వనామం సంఘాల విశ్వాసులను సూచిస్తుంది. రెండవది సందర్భంలో విశ్వాసులందరినీ సూచించే అవకాశమే ఎక్కువ; అయినా అది కొత్తగా నియమితులైన పెద్దలను సూచించే అవకాశాన్ని పాదటిప్పణి నిలుపుతుంది.
theological_decisions:
- issue: χειροτονήσαντες అనే పదం సంఘపాలనా విధానాన్ని నిర్దేశిస్తుందా?
  choice: పెద్దలను నియమించి
  alternative: చేతులు ఎత్తి ఓటు ద్వారా పెద్దలను ఎన్నుకొని
  rationale: ఈ పదానికి చారిత్రకంగా చేతులు ఎత్తి ఎంపిక చేయడం అనే అనుబంధం ఉండవచ్చు; అయితే ఈ వచనం నిర్దిష్ట ఎన్నికా విధానాన్ని స్పష్టం చేయదు. ‘నియమించి’ ఏ సంఘపాలనా నమూనాన్నీ అనవసరంగా చొప్పించదు.
- issue: παρέθεντο αὐτοὺς లో αὐτούς ఎవరిని సూచిస్తుంది?
  choice: విశ్వాసులను/సంఘాలను ప్రభువుకు అప్పగించారు
  alternative: కొత్తగా నియమితులైన పెద్దలను ప్రభువుకు అప్పగించారు
  rationale: విస్తృత సందర్భం శిష్యులను బలపరచడం గురించి ఉండడం వల్ల విశ్వాసులందరూ ప్రధాన సూచనగా కనిపిస్తారు. అయినప్పటికీ గ్రీకు సర్వనామం కొత్త పెద్దలను సూచించే అవకాశాన్ని పూర్తిగా తొలగించదు; అందువల్ల ఆ భావం పాదటిప్పణిలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. సంఘపాలన విషయంలో ఏ ప్రత్యేక సంప్రదాయాన్నీ సమర్థించకుండా మూలంలోని అనిశ్చితిని పాదటిప్పణిలో నిలుపుకుంది.
