revisions:
- from: వారు ప్రతి సంఘంలో వారి కోసం పెద్దలను నియమించి[a], ఉపవాసాలు పాటిస్తూ ప్రార్థించి, తాము విశ్వసించిన ప్రభువుకు వారిని అప్పగించారు.[b]
  to: వారు ప్రతి సంఘంలో వారికి పెద్దలను నియమించి[a], ఉపవాసాలతో ప్రార్థించి, ఎవరిలో వారు విశ్వాసం ఉంచారో ఆ ప్రభువుకు వారిని అప్పగించారు.[b]
  rationale: The revision retains the draft’s neutral rendering of χειροτονήσαντες and its footnoted alternative, while improving the prayer-and-fasting construction and clarifying that the Lord is the one in whom those entrusted had placed faith. The pronouns remain intentionally unexpanded, and footnote b preserves the viable alternative referent.
  reviewer_model: gpt-5.6-terra
