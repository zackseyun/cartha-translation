id: ACT.14.10
reference: Acts 14:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν ⸀μεγάλῃ φωνῇ· Ἀνάστηθι ἐπὶ τοὺς πόδας σου ⸀ὀρθός· καὶ ⸀ἥλατο καὶ περιεπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/010.yaml
  text: He said in a loud voice[b][a], “Stand upright on your feet.” And he leaped up and began walking.
translation:
  language: te
  text: 'అతడు బిగ్గరగా ఇలా అన్నాడు: “నీ కాళ్లపై నిటారుగా నిలబడు!” అతడు దూకి లేచి నడవడం మొదలుపెట్టాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దూకి లేచి నడుస్తూ ఉన్నాడు.” చివరి క్రియ అసంపూర్ణ భూతకాలంలో ఉంది; అది కొనసాగుతున్న నడకను లేదా నడక ప్రారంభాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ φωνῇ
  choice: బిగ్గరగా
  rationale: దత్తివ విభక్తిలోని ఈ పదబంధం మాట్లాడిన తీరును సూచిస్తుంది. ‘బిగ్గరగా’ అనేది సహజమైన ఆధునిక తెలుగు ప్రయోగం; గట్టిగా, అందరికీ వినిపించేలా పలికిన భావాన్ని కాపాడుతుంది.
- source_word: Ἀνάστηθι
  choice: నిలబడు
  rationale: ఇక్కడ ఆజ్ఞార్థక రూపం శరీరాన్ని లేపి నిలబడమనే ఆజ్ఞను ఇస్తుంది. వెంట వచ్చే ‘నీ కాళ్ల మీద నిటారుగా’ అనే పదబంధంతో ‘నిలబడు’ సహజంగా సరిపోతుంది.
- source_word: ἐπὶ τοὺς πόδας σου
  choice: నీ కాళ్ల మీద
  rationale: ఈ సందర్భంలో నిలబడే శారీరక స్థితిని స్పష్టంగా తెలియజేసే సహజ తెలుగు రూపం.
- source_word: ὀρθός
  choice: నిటారుగా
  rationale: ఈ పదం వంగకుండా సూటిగా నిలిచే భంగిమను సూచిస్తుంది. ‘నిటారుగా’ సాధారణ పాఠకులకు స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: ἥλατο
  choice: ఎగిరి లేచి
  rationale: ἅλλομαι రూపం అకస్మాత్తుగా ఎగరడం లేదా దూకి లేవడాన్ని సూచిస్తుంది. ‘ఎగిరి లేచి’ స్వస్థతకు అతని తక్షణ, ఉత్సాహభరిత ప్రతిస్పందనను అతిశయోక్తి లేకుండా వ్యక్తం చేస్తుంది.
- source_word: περιεπάτει
  choice: నడవడం మొదలుపెట్టాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న చర్యను లేదా చర్య ఆరంభాన్ని సూచించవచ్చు. సందర్భంలో ‘నడవడం మొదలుపెట్టాడు’ స్వస్థత అనంతరం ప్రారంభమైన నడకను సహజంగా తెలియజేస్తుంది; ‘నడుస్తూ ఉన్నాడు’ కూడా సాధ్యమైన అర్థం.
theological_decisions:
- issue: అద్భుత స్వస్థత మరియు శరీర భంగిమకు ఇచ్చిన ఆజ్ఞ
  choice: ఆజ్ఞను, దానికి వెంటనే వచ్చిన శారీరక ప్రతిస్పందనను వచనం చెప్పినట్లే నేరుగా అనువదించడం
  alternative: స్వస్థత యొక్క కారణం లేదా ధార్మిక ప్రాముఖ్యతను వివరిస్తూ అదనపు వ్యాఖ్యను చేర్చడం
  rationale: గ్రీకు పాఠం నేరుగా ఇచ్చిన ఆజ్ఞను, వెంటనే కనిపించిన ప్రతిస్పందనను మాత్రమే వివరిస్తుంది. అనువాదం అద్భుతం యొక్క స్పష్టతను కాపాడాలి గాని పాఠ్యంలో లేని సిద్ధాంత వివరణను జోడించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని సజీవతను నిలుపుతూ సహజ తెలుగు పదక్రమం ఉపయోగించబడింది.
