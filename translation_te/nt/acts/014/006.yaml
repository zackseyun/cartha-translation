translation:
  language: te
  text: వారు దీన్ని గ్రహించి[a], లుకయోనియలోని పట్టణాలైన లుస్త్ర, దెర్బేలకు, వాటి చుట్టుపక్కల ప్రాంతానికి పారిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు ఇది తెలుసుకొని’; లేదా, ‘వారు దీన్ని గుర్తించి.’ ఈ గ్రీకు పదం ముందటి వచనంలో చెప్పిన ప్రమాదాన్ని వారు గ్రహించారని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδόντες
  choice: వారు విషయం గ్రహించి
  rationale: సυνιδόντες ఇక్కడ ముందటి వచనంలో చెప్పిన ప్రమాదకరమైన పన్నాగాన్ని తెలుసుకోవడం లేదా గ్రహించడం అనే భావాన్ని ఇస్తుంది. గ్రీకులో కర్మ స్పష్టంగా లేకపోయినా సందర్భం ఆధారంగా తెలుగులో సహజంగా ఉండేందుకు ‘విషయం’ అని చేర్చాం.
- source_word: κατέφυγον
  choice: పారిపోయారు
  rationale: καταφεύγω ఆశ్రయం కోసం పారిపోవడం అనే భావాన్ని కలిగి ఉండవచ్చు; ఈ సందర్భంలో రాబోయే దాడి నుంచి అత్యవసరంగా తప్పించుకొని వెళ్లడమే ప్రధాన భావం.
- source_word: εἰς τὰς πόλεις τῆς Λυκαονίας
  choice: లుకయోనియ ప్రాంతంలోని ... పట్టణాలకు
  rationale: εἰς గమ్యాన్ని సూచిస్తుంది; ప్రాంతసంబంధక షష్ఠీని ఆధునిక తెలుగులో సహజంగా ‘ప్రాంతంలోని’ అని వ్యక్తం చేశాం.
- source_word: Λύστραν καὶ Δέρβην
  choice: లుస్త్ర, దెర్బే
  rationale: ఈ రెండు స్థలనామాలు ముందుగా ప్రస్తావించిన లుకయోనియ పట్టణాలను గుర్తిస్తాయి; ప్రాచుర్యంలో ఉన్న తెలుగు లిప్యంతరీకరణలను వాడాం.
- source_word: τὴν περίχωρον
  choice: వాటి చుట్టుపక్కల ప్రాంతానికి
  rationale: περίχωρος నామవాచకంగా వాడబడి, పేర్కొన్న పట్టణాల పరిసర ప్రాంతాన్ని సూచిస్తుంది. ‘వాటి’ అనే పదం తెలుగులో సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: καὶ ... καὶ
  choice: లుస్త్ర, దెర్బే పట్టణాలకు, వాటి చుట్టుపక్కల ప్రాంతానికి
  rationale: పునరుక్త καί రెండు పట్టణాలనూ పరిసర ప్రాంతాన్నీ గమ్యాలుగా కలుపుతుంది. తెలుగు వాక్యనిర్మాణంలో కామాలతో ఈ సంబంధాన్ని సహజంగా చూపించాం.
