id: ACT.14.19
reference: Acts 14:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐπῆλθαν δὲ ἀπὸ Ἀντιοχείας καὶ Ἰκονίου Ἰουδαῖοι, καὶ πείσαντες τοὺς ὄχλους καὶ λιθάσαντες τὸν Παῦλον ἔσυρον ἔξω τῆς πόλεως, ⸀νομίζοντες αὐτὸν τεθνηκέναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/019.yaml
  text: But Jews came from Antioch and Iconium[a], and after persuading the crowds and stoning Paul, they dragged him outside the city, supposing that he was dead.
translation:
  language: te
  text: అయితే అంతియొకయ, ఇకొనియ నుండి యూదులు వచ్చారు. వారు జనసమూహాలను ఒప్పించి, పౌలును రాళ్లతో కొట్టి, అతడు చనిపోయాడని భావించి, అతణ్ణి పట్టణం వెలుపలికి ఈడ్చుకెళ్లారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు చనిపోయి ఉన్నాడని అనుకొని.” గ్రీకు పాఠ్యం దాడి చేసినవారి అంచనాను తెలియజేస్తుంది; పౌలు నిజంగా చనిపోయాడని స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπῆλθαν δὲ
  choice: అయితే ... వచ్చారు
  rationale: δέ మునుపటి అనుకూల పరిస్థితికి విరుద్ధమైన మలుపును సూచిస్తుంది; Ἐπῆλθαν ప్రత్యర్థులు ఇతర పట్టణాల నుండి రావడాన్ని తెలియజేస్తుంది.
- source_word: ἀπὸ Ἀντιοχείας καὶ Ἰκονίου
  choice: అంతియొకయ, ఈకొనియ పట్టణాల నుండి
  rationale: రెండు స్థలనామాలను తెలుగులో పరిచిత రూపాల్లో ఉంచి, అవి పట్టణాలని స్పష్టత కోసం పేర్కొనడం సహజమైన తెలుగు వాక్య నిర్మాణానికి తోడ్పడుతుంది.
- source_word: Ἰουδαῖοι
  choice: కొందరు యూదులు
  rationale: సందర్భంలో వచ్చినవారు మొత్తం యూదు ప్రజలందరూ కాదని తెలుగులో తప్పుగా సాధారణీకరించకుండా ‘కొందరు’ చేర్చబడింది; ‘యూదులు’ ఈ పదానికి సహజమైన సందర్భోచిత రూపం.
- source_word: πείσαντες τοὺς ὄχλους
  choice: జనసమూహాలను ఒప్పించి
  rationale: పూర్వకాలిక కృదంతం ప్రధాన చర్యకు ముందు జరిగిన ప్రభావితం చేయడాన్ని సూచిస్తుంది; వారు ఏ నిర్దిష్ట వాదనకు ఒప్పించారో మూలం చెప్పనందున దానిని చేర్చలేదు.
- source_word: λιθάσαντες τὸν Παῦλον
  choice: పౌలును రాళ్లతో కొట్టారు
  rationale: తెలుగులో స్పష్టమైన, సహజమైన విధంగా రాళ్లతో దాడి చేసిన చర్యను తెలియజేస్తుంది; వరుస కృదంతాలను భారంగా చేయకుండా ప్రత్యేక వాక్యంగా ఇచ్చింది.
- source_word: ἔσυρον ἔξω τῆς πόλεως
  choice: అతణ్ణి పట్టణం వెలుపలికి ఈడ్చుకెళ్లారు
  rationale: σύρωలోని హింసాత్మకంగా లాగడం అనే భావాన్ని ‘ఈడ్చుకెళ్లారు’ సహజంగా తెలియజేస్తుంది; గమ్యస్థానాన్ని ‘వెలుపలికి’ స్పష్టం చేస్తుంది.
- source_word: νομίζοντες αὐτὸν τεθνηκέναι
  choice: అతడు చనిపోయాడని భావించి
  rationale: νομίζοντες దాడి చేసినవారి అంచనాను మాత్రమే తెలియజేస్తుంది. τεθνηκέναιను సహజ తెలుగులో ‘చనిపోయాడు’గా ఇచ్చినా, అది నిజంగా జరిగిందని కాక వారి భావనగానే వాక్య నిర్మాణం నిలుపుతుంది.
theological_decisions:
- issue: పౌలు నిజంగా చనిపోయాడని వచనం చెబుతోందా, లేక దాడి చేసినవారు అలా భావించారని మాత్రమే చెబుతోందా
  choice: ‘అతడు చనిపోయాడని భావించి’ అని దాడి చేసినవారి అంచనాను మాత్రమే ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: పౌలు నిజంగా చనిపోయి తరువాత తిరిగి బ్రతికించబడ్డాడని కొందరు అర్థం చేసుకుంటారు.
  rationale: గ్రీకు పాఠ్యం νομίζοντες ద్వారా వారి భావనను నివేదిస్తుంది; పౌలు వాస్తవంగా చనిపోయాడని స్వతంత్రంగా నిర్ధారించదు. అందువల్ల పాఠ్యంలో లేని నిర్ణయాన్ని అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. గ్రీకులోని కృదంతాల దీర్ఘ శ్రేణిని తెలుగులో సులభంగా చదవడానికి రెండు వాక్యాలుగా విభజించాం; అయినా సంఘటనల క్రమం—రాక, జనసమూహాలను ఒప్పించడం, రాళ్లతో కొట్టడం, చనిపోయాడని భావించడం, బయటికి ఈడ్చుకెళ్లడం—అదే విధంగా నిలుపబడింది.
