  naturalness: సవరించిన వాక్యం ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని నిలుపుతూ, గ్రీకు కృదంతాల చర్యాక్రమాన్ని భారంగా కాకుండా తెలియజేస్తుంది. ‘రాళ్లతో కొట్టి’ ఇక్కడ లిథాజో చర్యను స్పష్టంగా వ్యక్తం చేస్తుంది.
