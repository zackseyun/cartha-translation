id: ACT.2.38
reference: Acts 2:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πέτρος δὲ ⸂πρὸς αὐτούς· Μετανοήσατε⸃, καὶ βαπτισθήτω ἕκαστος ὑμῶν ⸀ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν ⸀τῶν ἁμαρτιῶν ⸀ὑμῶν, καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/038.yaml
  text: And Peter said to them[a], “Repent, and let each of you be baptized in the name of Jesus the Messiah for the forgiveness of your sins[b], and you will receive the gift of the Holy Spirit.”
translation:
  language: te
  text: 'పేతురు వారితో ఇలా అన్నాడు: “పశ్చాత్తాపపడండి; మీలో ప్రతి ఒక్కరూ యేసు మెస్సీయ నామంలో మీ పాపాల క్షమాపణ కోసం[a] బాప్తిస్మం పొందాలి; మరియు మీరు పరిశుద్ధాత్మ వరాన్ని పొందుతారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పాపాల క్షమాపణ కోసం’ అనేది గ్రీకు పదబంధానికి నేరమైన అనువాదం. ఇక్కడ బాప్తిస్మానికి క్షమాపణతో ఉన్న సంబంధాన్ని వివిధ వ్యాఖ్యాతలు భిన్నంగా అర్థం చేసుకుంటారు; మూలపాఠ్యం చెప్పినదానికంటే ఎక్కువగా ఈ అనువాదం ఆ వివాదాన్ని పరిష్కరించదు.
    reason: theological_ambiguity
lexical_decisions:
- source_word: Μετανοήσατε
  choice: పశ్చాత్తాపపడండి
  rationale: మనస్సు, జీవనదిశ మార్పు రెండింటినీ సూచించే నిర్ణయాత్మక బహువచన ఆజ్ఞను ఆధునిక ప్రామాణిక తెలుగు సహజంగా వ్యక్తపరుస్తుంది.
- source_word: βαπτισθήτω ἕκαστος ὑμῶν
  choice: మీలో ప్రతి ఒక్కరూ ... బాప్తిస్మం పొందాలి
  rationale: మూడవ పురుష ఏకవచన నిష్క్రియ ఆజ్ఞను, ἕκαστος యొక్క వ్యక్తిగత పంపిణీ భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἐπὶ τῷ ὀνόματι
  choice: నామంలో
  rationale: బాప్తిస్మ సందర్భంలోని గ్రీకు ప్రయోగానికి సహజ సమానం; ఆధారం, అధికారం, అంగీకారం అనే సాధ్యమైన ఛాయల్లో ఒక్కదానినే నిర్బంధించదు.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: అపొస్తలుల కార్యాలు 2లో Χριστός బిరుదుగా చురుకుగా ఉన్నందున దాని మెస్సీయ సంబంధ అర్థాన్ని నిలుపుతుంది.
- source_word: εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: మీ పాపాల క్షమాపణ కోసం
  rationale: εἰς యొక్క లక్ష్య/ఫలిత దిశను సహజంగా వ్యక్తపరుస్తూ, బాప్తిస్మం-క్షమాపణ సంబంధంపై సిద్ధాంతపరమైన వివాదాన్ని అనువాదంలోనే పరిష్కరించదు.
- source_word: λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος
  choice: మీరు పరిశుద్ధాత్మ వరాన్ని పొందుతారు
  rationale: భవిష్యత్ వాగ్దానాన్ని స్పష్టంగా తెలుపుతూ, గ్రీకు షష్ఠీ విభక్తి సంబంధాన్ని అతిగా వివరించకుండా ఉంచుతుంది.
theological_decisions:
- issue: బాప్తిస్మానికి పాపక్షమాపణతో ఉన్న సంబంధం
  choice: ‘మీ పాపాల క్షమాపణ కోసం’ అని నేరుగా అనువదించడం
  alternative: ‘మీ పాపాలు క్షమించబడేలా’ లేదా ‘మీ పాపాలు క్షమించబడినందున’
  rationale: మూలంలోని εἰς ἄφεσιν పదబంధాన్ని పారదర్శకంగా నిలిపి, బాప్తిస్మపు ప్రభావం, క్రమం లేదా ప్రతీకాత్మకత గురించి ఏ సంప్రదాయ నిర్ణయాన్నీ చేర్చదు.
- issue: Χριστοῦ పదానికి అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ ప్రసంగ సందర్భంలో పదం బిరుదుగా, మెస్సీయ ప్రకటనలో భాగంగా పనిచేస్తోంది; అందువల్ల దాని అర్థాన్ని ప్రధాన పాఠ్యంలో వ్యక్తం చేయడం సముచితం.
- issue: τοῦ ἁγίου πνεύματος లోని షష్ఠీ విభక్తి సంబంధం
  choice: పరిశుద్ధాత్మ వరం
  alternative: పరిశుద్ధాత్మ ఇచ్చే వరం లేదా పరిశుద్ధాత్మ అనే వరం
  rationale: గ్రీకు నిర్మాణం వరం యొక్క మూలాన్నా, విషయాన్నా సూచిస్తుందనే విషయాన్ని అనువాదం అనవసరంగా నిర్ధారించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘బాప్తిస్మం’ మరియు ‘పరిశుద్ధాత్మ’ వంటి విస్తృతంగా గుర్తింపున్న బైబిలు పదజాలం నిలుపబడింది. గ్రీకులోని రెండు καί సంధులను తెలుగులో సహజమైన వాక్య విభజనతో వ్యక్తపరచడానికి ‘అప్పుడు’ వాడబడింది; ఇది కాలక్రమంపై అదనపు సిద్ధాంతార్థాన్ని ఉద్దేశించదు.
