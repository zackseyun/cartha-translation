revisions:
- from: 'అప్పుడు పేతురు వారితో ఇలా అన్నాడు: “పశ్చాత్తాపపడండి. మీ పాపాల క్షమాపణ కోసం[a] మీలో ప్రతి ఒక్కరూ యేసు మెస్సీయ[b] నామంలో బాప్తిస్మం పొందాలి. అప్పుడు మీరు పరిశుద్ధాత్మ వరాన్ని పొందుతారు.”'
  to: 'పేతురు వారితో ఇలా అన్నాడు: “పశ్చాత్తాపపడండి; మీలో ప్రతి ఒక్కరూ యేసు మెస్సీయ నామంలో మీ పాపాల క్షమాపణ కోసం[a] బాప్తిస్మం పొందాలి; మరియు మీరు పరిశుద్ధాత్మ వరాన్ని పొందుతారు.”'
  rationale: The revision removes the added temporal/consequential ‘అప్పుడు’ before the promise and uses ‘మరియు’ to reproduce the Greek coordination. It also places the baptismal phrase before the forgiveness phrase in the same order as the Greek. Footnote b is retained as supplied, but its anchor is not inserted in the revised main text because the supplied draft’s b anchor is absent from its actual text; the complete text should carry it after ‘మెస్సీయ’ if the publication system requires all footnote markers to be visibly anchored.
