source:
  edition: SBLGNT
  text: καὶ ἐπλήσθησαν ⸀πάντες πνεύματος ἁγίου, καὶ ἤρξαντο λαλεῖν ἑτέραις γλώσσαις καθὼς τὸ πνεῦμα ἐδίδου ⸂ἀποφθέγγεσθαι αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/004.yaml
  text: And they were all filled with the Holy Spirit and began to speak in other tongues[a], as the Spirit was giving them utterance.
translation:
  language: te
  text: వారందరూ పరిశుద్ధాత్మతో నింపబడి, ఆత్మ వారికి పలికే సామర్థ్యాన్ని అందిస్తున్న మేరకు ఇతర భాషల్లో[a] మాట్లాడడం మొదలుపెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇతర నాలుకల్లో.” గ్రీకు γλῶσσα పదానికి “నాలుక” లేదా “భాష” అనే అర్థం ఉండవచ్చు; తరువాతి సందర్భం విన్నవారు గుర్తించిన వాస్తవ మానవ భాషలను సూచిస్తుంది.
    reason: γλῶσσα యొక్క ‘tongue/language’ అర్థవ్యాప్తిని నిలుపుతూ, తెలుగు ప్రధాన పాఠ్యంలో సహజమైన ‘భాషల్లో’ను ఉపయోగిస్తుంది.
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: నింపబడి
  rationale: πίμπλημι యొక్క భూతకాల కర్మణి రూపం ఇక్కడ పరిశుద్ధాత్మతో పూర్తిగా నింపబడటాన్ని, ఆయన చేత శక్తిపొందటాన్ని సూచిస్తుంది. ‘నింపబడి’ మూలంలోని కర్మణి భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: πάντες
  choice: వారందరూ
  rationale: అక్కడున్న సమూహంలోని ప్రతి ఒక్కరినీ కలుపుతున్న సమగ్ర భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: πνεύματος ἁγίου
  choice: పరిశుద్ధాత్మతో
  rationale: అపొస్తలుల కార్యములు 2 సందర్భంలో ఇది యేసు వాగ్దానం చేసిన దైవిక పరిశుద్ధాత్మనే సూచిస్తుంది. తెలుగు వాక్యనిర్మాణానికి తగిన సహాయక విభక్తి వాడబడింది.
- source_word: ἤρξαντο λαλεῖν
  choice: మాట్లాడడం మొదలుపెట్టారు
  rationale: చర్య ఆరంభాన్ని తెలిపే ἄρχομαι + క్రియార్థక రూప భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἑτέραις γλώσσαις
  choice: ఇతర భాషల్లో
  rationale: ἑτέραις వారి సాధారణ భాషకు భిన్నమైనవని సూచిస్తుంది. γλῶσσα యొక్క ‘నాలుక/భాష’ అర్థవ్యాప్తిని ప్రధాన వాక్యంలో అసహజమైన ‘నాలుకల్లో’ అని పెట్టకుండా, పాదసూచికలో భద్రపరచాం.
- source_word: καθὼς
  choice: ప్రకారం
  rationale: వారి మాటల తీరు, పరిమాణం ఆత్మ ఇచ్చినదానికి అనుగుణంగా ఉన్నట్లు తెలిపే సంబంధాన్ని నిలుపుతుంది.
- source_word: ἐδίδου
  choice: ఇస్తున్న
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న కార్యభావాన్ని తెలుగులో ప్రగతిశీల రూపంతో తెలియజేస్తుంది.
- source_word: ἀποφθέγγεσθαι αὐτοῖς
  choice: వారికి పలికే సామర్థ్యం
  rationale: ἀποφθέγγομαι బహిరంగంగా లేదా స్పష్టంగా పలకడాన్ని సూచిస్తుంది. ఈ సందర్భంలో ఆత్మ అందించిన కొనసాగుతున్న పలుకుబడి/సామర్థ్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; దానిని కేవలం ప్రవచనంగా పరిమితం చేయదు.
theological_decisions:
- issue: πνεύματος ἁγίου వ్యక్తిగత దైవిక సూచనా, లేక సాధారణ ‘పవిత్ర ఆత్మ/స్వభావమా’ అన్నది
  choice: పరిశుద్ధాత్మ
  alternative: పవిత్రమైన ఆత్మ
  rationale: ఈ అధ్యాయంలో ఆయనే యేసు వాగ్దానం చేసిన ఆత్మ; తరువాతి ఉపవాక్యంలో మాట్లాడే సామర్థ్యాన్ని ఇచ్చే కార్యనిర్వాహకుడిగా కనిపిస్తాడు. అందువల్ల నిర్దిష్ట దైవిక సూచనను తెలుగులో ‘పరిశుద్ధాత్మ’గా చూపాం.
- issue: γλώσσαις ను ‘నాలుకలు’గా అనాలా, ‘భాషలు’గా అనాలా అన్నది
  choice: ఇతర భాషల్లో
  alternative: ఇతర నాలుకలతో / ఇతర భాషారూపాల్లో
  rationale: గ్రీకు పదానికి రెండు అర్థాలూ సాధ్యమైనప్పటికీ, తెలుగు ‘నాలుకలతో మాట్లాడారు’ అంటే అవయవార్థమే ముందుకు వచ్చి అపార్థం కలిగిస్తుంది. తరువాతి వచనాల్లో శ్రోతలు తమ తమ భాషలను గుర్తించడం వల్ల ‘భాషల్లో’ సందర్భోచితం; పదంలోని విస్తృత అర్థాన్ని పాదసూచికలో స్పష్టంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘వాక్‌శక్తి,’ ‘అన్యభాషలు’ వంటి పాత లేదా సంఘపరమైన పదాల బదులు ‘పలికే సామర్థ్యం,’ ‘ఇతర భాషలు’ వాడాం. మూలంలోని కొనసాగుతున్న ἐδίδου భావాన్ని ‘ఇస్తున్న’ ద్వారా, కార్యారంభాన్ని ‘మొదలుపెట్టారు’ ద్వారా నిలిపాం.
