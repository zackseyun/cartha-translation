revisions:
- from: 'వారందరూ పరిశుద్ధాత్మతో నింపబడి, ఆత్మ వారికి పలికే సామర్థ్యం ఇస్తున్న ప్రకారం ఇతర భాషల్లో[a] మాట్లాడడం మొదలుపెట్టారు.


