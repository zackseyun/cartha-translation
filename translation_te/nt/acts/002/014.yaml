id: ACT.2.14
reference: Acts 2:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Σταθεὶς δὲ ⸀ὁ Πέτρος σὺν τοῖς ἕνδεκα ἐπῆρεν τὴν φωνὴν αὐτοῦ καὶ ἀπεφθέγξατο αὐτοῖς· Ἄνδρες Ἰουδαῖοι καὶ οἱ κατοικοῦντες Ἰερουσαλὴμ ⸀πάντες, τοῦτο ὑμῖν γνωστὸν ἔστω καὶ ἐνωτίσασθε τὰ ῥήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/014.yaml
  text: 'But Peter[a], standing with the eleven, raised his voice and declared to them: “Men of Judea and all who dwell in Jerusalem, let this be known to you[b], and give ear to my words.”'
translation:
  language: te
  text: 'కానీ పేతురు పదకొండుమందితో కలిసి నిలబడి, తన స్వరం ఎత్తి వారితో ఇలా పలికాడు: “యూదయవారైన పురుషులారా, యెరూషలేములో నివసించే వారందరా, ఇది మీకు తెలియాలి; నా మాటలను శ్రద్ధగా వినండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σταθεὶς δὲ ὁ Πέτρος
  choice: అప్పుడు పేతురు ... నిలబడి
  rationale: δὲ ముందటి అపహాస్యానికి ప్రతిస్పందనగా కథన మలుపును సూచిస్తుంది; తెలుగులో ‘అప్పుడు’ సహజంగా ఆ మార్పును తెలియజేస్తుంది. Σταθεὶς‌ను దృశ్యాన్ని ఏర్పరచే క్రియావిశేషణాత్మక అసమాపక క్రియగా ‘నిలబడి’ అని అనువదించాం.
- source_word: σὺν τοῖς ἕνδεκα
  choice: పదకొండుమందితో కలిసి
  rationale: సహవాసాన్ని స్పష్టంగా తెలిపే సహజమైన తెలుగు రూపం.
- source_word: ἐπῆρεν τὴν φωνὴν αὐτοῦ
  choice: తన స్వరం ఎత్తి
  rationale: బహిరంగంగా అందరికీ వినిపించేలా గట్టిగా మాట్లాడాడనే గ్రీకు నుడికారాన్ని దగ్గరగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἀπεφθέγξατο αὐτοῖς
  choice: వారితో ఇలా ప్రకటించాడు
  rationale: ఈ క్రియ గంభీరమైన బహిరంగ ప్రకటన భావాన్ని కలిగి ఉంది. ‘ప్రకటించాడు’ ఆ బలాన్ని ఉంచుతుంది; ‘ఇలా’ ప్రత్యక్ష ప్రసంగానికి సహజమైన తెలుగు పరిచయం.
- source_word: Ἄνδρες Ἰουδαῖοι
  choice: యూదయ పురుషులారా
  rationale: ἄνδρεςలోని స్పష్టమైన పురుష సంబోధనను, Ἰουδαῖοιలోని యూదయ/యూద గుర్తింపును నిలుపుతుంది. సందర్భంలో ఇది యూదయకు చెందిన పురుషులను ఉద్దేశించిన సంబోధన.
- source_word: οἱ κατοικοῦντες Ἰερουσαλὴμ πάντες
  choice: యెరూషలేములో నివసించే వారందరా
  rationale: ప్రస్తుతం అక్కడ నివసిస్తున్న వారందరినీ ఉద్దేశించిన భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: τοῦτο ὑμῖν γνωστὸν ἔστω
  choice: ఇది మీకు తెలియాలి
  rationale: ἔστω యొక్క ఆజ్ఞాత్మక బలాన్ని, γνωστόν యొక్క ‘తెలిసినది’ అనే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἐνωτίσασθε τὰ ῥήματά μου
  choice: నా మాటలను శ్రద్ధగా వినండి
  rationale: ἐνωτίσασθε కేవలం వినడమే కాక శ్రద్ధ పెట్టి ఆలకించమనే ఆజ్ఞ. ‘శ్రద్ధగా వినండి’ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా అందిస్తుంది; ῥήματαను నేరుగా ‘మాటలు’గా ఉంచింది.
theological_decisions:
- issue: Ἄνδρες యొక్క లింగ నిర్దిష్టత
  choice: యూదయ పురుషులారా
  alternative: యూదయ ప్రజలారా / తోటి యూదులారా
  rationale: మూలంలోని ἄνδρες స్పష్టంగా పురుషులను సంబోధిస్తుంది. లింగతటస్థ పదంతో దానిని విస్తరించకుండా మూల నిర్దిష్టతను నిలిపాం.
- issue: ἀπεφθέγξατοలో ప్రేరేపిత లేదా ప్రవచనాత్మక ప్రసంగ భావాన్ని ఎంతవరకు వ్యక్తం చేయాలి
  choice: ప్రకటించాడు
  alternative: సంబోధించాడు / ఆత్మప్రేరణతో పలికాడు
  rationale: ‘ప్రకటించాడు’ గంభీర బహిరంగ ప్రసంగాన్ని తెలియజేస్తుంది; అయితే ఈ క్రియలోనే ‘ఆత్మప్రేరణతో’ అని స్పష్టంగా చేర్చి వచనానికి మించిన ధార్మిక వ్యాఖ్యానాన్ని దిగుమతి చేయదు.
- issue: δὲ యొక్క సంబంధార్థం
  choice: అప్పుడు
  alternative: అయితే / కానీ
  rationale: మునుపటి వచనంలోని అపహాస్యానికి ప్రతిస్పందన ఉన్నప్పటికీ δὲ స్వయంగా బలమైన విరోధ సూచకం కావాల్సిన అవసరం లేదు. కథన మలుపును సహజంగా ఉంచేందుకు ‘అప్పుడు’ ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; బహిరంగ ప్రసంగానికి తగిన గౌరవప్రదమైన, కానీ సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలో ప్రత్యేక పాఠాంతరాన్ని సూచించాల్సిన అవసరం లేకపోవడంతో పాదసూచికలు చేర్చలేదు. అందువల్ల ప్రధాన పాఠ్యంలో పాదసూచిక గుర్తులు లేవు.
