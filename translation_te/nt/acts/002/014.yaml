revisions:
- from: 'అప్పుడు పేతురు పదకొండుమందితో కలిసి నిలబడి, తన స్వరం ఎత్తి వారితో ఇలా ప్రకటించాడు: “యూదయ పురుషులారా, యెరూషలేములో నివసించే వారందరా, ఇది మీకు తెలియాలి; నా మాటలను శ్రద్ధగా వినండి.”'
  to: 'కానీ పేతురు పదకొండుమందితో కలిసి నిలబడి, తన స్వరం ఎత్తి వారితో ఇలా పలికాడు: “యూదయవారైన పురుషులారా, యెరూషలేములో నివసించే వారందరా, ఇది మీకు తెలియాలి; నా మాటలను శ్రద్ధగా వినండి.”'
  rationale: The revision preserves all explicit source elements while rendering δέ as a response-oriented connective, using more idiomatic Telugu for the masculine Judean address, and choosing an elevated but non-overinterpreting equivalent for ἀπεφθέγξατο. No footnotes are required by the Greek text or for the retained ambiguity.
