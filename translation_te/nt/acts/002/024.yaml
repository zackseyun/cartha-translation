id: ACT.2.24
reference: Acts 2:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃν ὁ θεὸς ἀνέστησεν λύσας τὰς ὠδῖνας τοῦ θανάτου, καθότι οὐκ ἦν δυνατὸν κρατεῖσθαι αὐτὸν ὑπ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/024.yaml
  text: whom God raised up[a], having loosed the pains of death[b], because it was not possible for him to be held by it.
translation:
  language: te
  text: దేవుడు ఆయనను మరణ వేదనలను తొలగించి[a] లేపాడు; ఎందుకంటే దానిచేత ఆయన పట్టబడి ఉండడం సాధ్యం కాలేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మరణపు ప్రసవ వేదనలను’ అని కూడా అనువదించవచ్చు. ఇక్కడ వాడిన గ్రీకు పదం ప్రసవ వేదనలను కూడా సూచించగలదు; మరణం యొక్క పట్టు తొలగిపోవడమనే భావచిత్రం కూడా ఇందులో ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘దానిచేత.’ ఈ సర్వనామం అత్యంత సహజంగా ‘మరణం’ను సూచిస్తుంది; అంటే, ‘మరణం చేత పట్టబడి ఉండడం.’
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: ఆయనను
  rationale: ఈ సంబంధ సర్వనామం ముందటి వచనంలోని యేసును సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో సహజంగా ఉండేందుకు వ్యక్తిని సూచించే కర్మరూపాన్ని వాడాం.
- source_word: ἀνέστησεν
  choice: లేపాడు
  rationale: ఇక్కడ దేవుడు యేసును మృతులలోనుండి లేపిన కార్యాన్ని సూచిస్తుంది. మూలంలోని క్రియారూపాన్ని నిలుపుతూ, తరువాత ఏర్పడిన సాంకేతిక పదాన్ని అనవసరంగా చేర్చదు.
- source_word: λύσας
  choice: విప్పి
  rationale: λύω అనే క్రియలోని ‘విప్పడం, విడుదల చేయడం’ అనే సజీవమైన భావచిత్రాన్ని నిలుపుతుంది; ఇది ప్రధాన క్రియతో కలిసి జరిగిన కార్యాన్ని సూచిస్తుంది.
- source_word: τὰς ὠδῖνας τοῦ θανάτου
  choice: మరణ వేదనలను
  rationale: ὠδῖνας తీవ్రమైన వేదనలను, ప్రత్యేకంగా ప్రసవ వేదనలను కూడా సూచించగలదు. ప్రధాన పాఠంలో స్పష్టమైన సాధారణ అర్థాన్ని ఉంచి, ప్రసవ వేదనల భావసూచనను పాదటిప్పణిలో భద్రపరిచాం.
- source_word: καθότι
  choice: ఎందుకంటే
  rationale: ముందు చెప్పిన దేవుని కార్యానికి కారణాన్ని పరిచయం చేసే సహజమైన ఆధునిక తెలుగు అనుసంధాన పదం.
- source_word: οὐκ ἦν δυνατὸν
  choice: సాధ్యం కాదు
  rationale: మూలంలోని అవ్యక్త నిర్మాణాన్నీ వివరణాత్మక స్వరాన్నీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: κρατεῖσθαι
  choice: పట్టబడి ఉండడం
  rationale: κρατέω యొక్క నిష్క్రియారూపం ఎవరి అధికారంలోనో లేదా పట్టులోనో నిలిపివేయబడడాన్ని సూచిస్తుంది. అదనపు వ్యాఖ్యానం లేకుండా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: ὑπ’ αὐτοῦ
  choice: దాని చేత
  rationale: సర్వనామాన్ని అనువాదంలో నిలిపాం. దాని అత్యంత సహజమైన పూర్వపదం ‘మరణం’; ఆ సూచనను పాదటిప్పణి స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ὑπ’ αὐτοῦ అనే సర్వనామం దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో ‘దాని చేత’ అని సర్వనామ రూపాన్ని నిలిపి, అది మరణాన్ని సూచిస్తుందని పాదటిప్పణిలో తెలిపాం.
  alternative: ‘మరణం చేత’ అని ప్రధాన పాఠంలోనే స్పష్టంగా చెప్పడం; లేదా వ్యాకరణ లింగం ఆధారంగా ‘అతని చేత’ అని చదవడం.
  rationale: సమీపమైన, భావపరంగా సముచితమైన పూర్వపదం θανάτου (‘మరణం’). అయినా మూలంలో నామవాచకం మళ్లీ రాక సర్వనామమే ఉన్నందున, దాని రూపాన్ని ప్రధాన పాఠంలో భద్రపరచడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: ὠδῖνας యొక్క భావం
  choice: ప్రధాన పాఠంలో ‘వేదనలు’.
  alternative: ‘ప్రసవ వేదనలు’ లేదా ‘తీవ్ర యాతనలు’.
  rationale: ఈ పదం ప్రసవ వేదనలను కూడా సూచించగలిగినా, ఇక్కడ మరణంతో అనుసంధానమైన వేదనలు అనే విస్తృత భావం సందర్భానికి సహజంగా సరిపోతుంది. ప్రత్యేకమైన ప్రసవ భావచిత్రాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా అసలైన పదార్థ పరిధిని కోల్పోకుండా చూశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన శైలిని వాడాం. ‘మరణ వేదనలను విప్పి’ అనే కొద్దిగా అసాధారణమైన ప్రయోగాన్ని ఉద్దేశపూర్వకంగా నిలిపాం; అది మూలంలోని λύσας మరియు ὠδῖνας కలయికలో ఉన్న సజీవమైన, కొంత ఉద్విగ్నమైన భావచిత్రాన్ని సాఫీ చేసి పోగొట్టకుండా కాపాడుతుంది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో సంబంధిత పదబంధాల దగ్గర ఉన్నాయి.
