id: ACT.2.46
reference: Acts 2:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν τε προσκαρτεροῦντες ὁμοθυμαδὸν ἐν τῷ ἱερῷ, κλῶντές τε κατ’ οἶκον ἄρτον, μετελάμβανον τροφῆς ἐν ἀγαλλιάσει καὶ ἀφελότητι καρδίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/046.yaml
  text: And day by day[a], continuing together with one purpose in the temple courts, and breaking bread from house to house, they were sharing meals with gladness and simplicity of heart[d][c][b],
translation:
  language: te
  text: వారు ప్రతిరోజూ దేవాలయ ప్రాంగణాల్లో ఏకమనస్సుతో నిరంతరం ఉండుతూ[a], ఇంటింటా రొట్టె విరుస్తూ[b], ఉల్లాసంతోను హృదయ సరళతతోను[d] ఆహారం తీసుకునేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దేవాలయంలో’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం లోపలి మందిరాన్ని మాత్రమే కాక, మొత్తం దేవాలయ సముదాయాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: ‘రొట్టె విరవడం’ సాధారణంగా కలిసి భోజనం చేయడాన్ని సూచించవచ్చు; కొందరు దీనిలో ప్రభువు భోజనం కూడా సూచించబడిందని అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: d
    text: ‘నిష్కపటమైన హృదయంతో’ లేదా ‘ఉదార హృదయంతో’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: ప్రతిరోజూ
  rationale: κατά + ద్వితీయా విభక్తి ఇక్కడ పునరావృతమయ్యే దినదిన చర్యను సూచిస్తుంది; ‘ప్రతిరోజూ’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: προσκαρτεροῦντες
  choice: పట్టుదలగా కూడుకుంటూ
  rationale: వర్తమాన కృదంతం నిరంతర పట్టుదలను తెలియజేస్తుంది. స్థలసూచక పదబంధంతో కలిసి ఉన్నందున, తెలుగులో సహజత్వం కోసం కూడుకునే భావాన్ని సందర్భానుసారంగా వ్యక్తం చేసింది.
- source_word: ὁμοθυμαδόν
  choice: ఒకే మనస్సుతో
  rationale: సమూహ ఐక్యతతో పాటు ఉమ్మడి ఉద్దేశాన్ని కూడా తెలిపే సహజమైన తెలుగు ప్రయోగం.
- source_word: ἐν τῷ ἱερῷ
  choice: దేవాలయ ప్రాంగణాల్లో
  rationale: ἱερόν అంతర్గర్భాలయాన్ని మాత్రమే కాక మొత్తం దేవాలయ సముదాయాన్ని సూచిస్తుంది; ‘ప్రాంగణాల్లో’ ఆ భేదాన్ని స్పష్టం చేస్తుంది.
- source_word: κλῶντές ... ἄρτον
  choice: రొట్టె విరుస్తూ
  rationale: లూకా–అపొస్తలుల కార్యములలోని స్థిర ప్రయోగాన్ని అలాగే నిలుపుతుంది; సాధారణ సహభోజనం లేదా ప్రభువు భోజనంతో సంబంధం అనే రెండు అవకాశాల్లో దేనినీ ప్రధాన పాఠ్యం నిర్ణయించదు.
- source_word: κατ’ οἶκον
  choice: ఇంటింటా
  rationale: κατά యొక్క పంపిణీ భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: μετελάμβανον τροφῆς
  choice: కలిసి భోజనం చేసేవారు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న అలవాటును సూచిస్తుంది. τροφή అక్షరార్థంగా ‘ఆహారం’; సందర్భంలో సామూహికంగా ఆహారం తీసుకోవడాన్ని ‘కలిసి భోజనం చేసేవారు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν ἀγαλλιάσει
  choice: ఉల్లాసంతో
  rationale: సాధారణ సంతోషం కంటే ఉప్పొంగే ఆనందాన్ని సూచించే ἀγαλλίασις భావాన్ని అందిస్తుంది.
- source_word: ἀφελότητι καρδίας
  choice: హృదయ సరళతతో
  rationale: కపటంలేని సరళత, నిజాయితీ, ఉదారత వంటి సాధ్యమైన భావవిస్తృతిని పూర్తిగా ఒకే అర్థానికి కుదించకుండా నిలుపుతుంది.
theological_decisions:
- issue: ‘రొట్టె విరవడం’ సాధారణ సహభోజనమా, ప్రభువు భోజనమా?
  choice: ప్రధాన పాఠ్యంలో విస్తృతార్థం గల ‘రొట్టె విరుస్తూ’ అనే ప్రయోగాన్ని నిలుపడం.
  alternative: దీనిని కేవలం సాధారణ భోజనంగా లేదా స్పష్టంగా ప్రభువు భోజనంగా అనువదించడం.
  rationale: సమీప సందర్భంలోని τροφή సాధారణ సామూహిక భోజనాన్ని బలపరుస్తుంది; అయినా లూకా–అపొస్తలుల కార్యములలో ఈ ప్రయోగానికి ప్రభువు భోజనాన్ని ప్రతిధ్వనించే అవకాశం ఉంది. అందువల్ల ఆ ఉద్రిక్తతను పాదటిప్పణిలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే దేవాలయ ప్రాంగణాలు, రొట్టె విరవడం, హృదయ సరళత వంటి మూలపాఠ్య ప్రత్యేకతలను నిలుపుకుంది.
