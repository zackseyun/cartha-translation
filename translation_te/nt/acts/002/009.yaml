translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవదగిన భౌగోళిక జాబితా. గ్రీకు వాక్యంలో οἱ κατοικοῦντες అనే పదబంధం తరువాత వచ్చే ప్రాంతాలన్నిటికీ వర్తించేలా ఉంది; అందువల్ల తెలుగులో స్పష్టత కోసం ‘నివసించేవారు’ను జాబితా చివర మళ్లీ ఉంచాం. ప్రతి ప్రాంతానికి ‘లో/లోను’ జోడించడం ద్వారా నివాసార్థ సంబంధాన్ని సహజంగా వ్యక్తం చేశాం.
