source:
  edition: SBLGNT
  text: Πάρθοι καὶ Μῆδοι καὶ Ἐλαμῖται, καὶ οἱ κατοικοῦντες τὴν Μεσοποταμίαν, Ἰουδαίαν τε καὶ Καππαδοκίαν, Πόντον καὶ τὴν Ἀσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/009.yaml
  text: Parthians and Medes and Elamites[a], and those living in Mesopotamia, Judea and Cappadocia, Pontus and Asia[b],
translation:
  language: te
  text: పార్థీయులు, మాదీయులు, ఏలామీయులు, అలాగే మెసొపొతామియా, యూదయ, కప్పదొకియ, పొంతు, ఆసియాలో[a] నివసించేవారు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “ఆసియా” అంటే నేటి ఆసియా ఖండం కాదు; ఆసియా మైనరు పశ్చిమ భాగంలోని రోమా ప్రావిన్సు.
    reason: cultural_note
lexical_decisions:
- source_word: Πάρθοι
  choice: పార్థీయులు
  rationale: పార్థీయ ప్రజలను సూచించే జాతినామానికి తెలుగులో సహజమైన లిప్యంతరీకరణ.
- source_word: Μῆδοι
  choice: మాదీయులు
  rationale: మాదీ దేశ ప్రజలను సూచించే ప్రాచుర్యంలో ఉన్న తెలుగు జాతినామం.
- source_word: Ἐλαμῖται
  choice: ఏలామీయులు
  rationale: ఏలాము ప్రాంత ప్రజలను సూచించే జాతినామాన్ని తెలుగు రూపంలో నిలుపుతుంది.
- source_word: οἱ κατοικοῦντες
  choice: నివసించేవారు
  rationale: వర్తమాన కృదంతం సూచించే ‘నివాసులు/నివసిస్తున్నవారు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὴν Μεσοποταμίαν
  choice: మెసొపొతామియ
  rationale: భౌగోళిక నామానికి గుర్తించదగిన తెలుగు లిప్యంతరీకరణ.
- source_word: Ἰουδαίαν
  choice: యూదయ
  rationale: జాతి లేదా మతార్థాన్ని చేర్చకుండా ప్రాంతనామాన్ని నిలుపుతుంది.
- source_word: τε καὶ
  choice: లోను ... లోను
  rationale: జాబితాలోని ప్రాంతాలను కలిపే స్వల్ప సముచ్చయ/అనుబంధ భావాన్ని సహజ తెలుగు సముచ్చయ ప్రత్యయంతో తెలియజేస్తుంది.
- source_word: Καππαδοκίαν
  choice: కప్పదొకియ
  rationale: ప్రాంతనామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: Πόντον
  choice: పొంతు
  rationale: ప్రాంతనామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: τὴν Ἀσίαν
  choice: ఆసియ
  rationale: మూలంలోని ప్రాంతనామాన్ని నిలిపి, దాని ప్రాచీన పరిపాలనా అర్థాన్ని పాదటీకలో స్పష్టం చేస్తుంది.
