source:
  edition: SBLGNT
  text: Ἰουδαῖοί τε καὶ προσήλυτοι, Κρῆτες καὶ Ἄραβες, ἀκούομεν λαλούντων αὐτῶν ταῖς ἡμετέραις γλώσσαις τὰ μεγαλεῖα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/011.yaml
  text: both Jews and proselytes[a], Cretans and Arabs—we hear them speaking in our own languages the mighty works of God.
translation:
  language: te
  text: యూదులూ యూదమతంలో చేరినవారూ, క్రేతీయులూ అరబ్బులూ—వారు దేవుని గొప్ప కార్యాలను మన సొంత భాషల్లో[a] మాట్లాడటం వింటున్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాలుకల్లో.’ గ్రీకు పదానికి ‘నాలుకలు’ లేదా ‘భాషలు’ అనే అర్థాలు రావచ్చు; ఇక్కడి సందర్భం ప్రజలు గుర్తించగల మానవ భాషలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖοί
  choice: యూదులు
  rationale: ఈ సందర్భంలో ఇది కేవలం యూదయ ప్రాంతవాసులను కాక, వివిధ ప్రాంతాల నుంచి వచ్చిన యూద ప్రజలను సూచిస్తుంది.
- source_word: τε καὶ
  choice: యూదులూ ... చేరినవారూ
  rationale: తెలుగులో ‘ఊ ... ఊ’ సముచ్చయ నిర్మాణం రెండు వర్గాల జతను సహజంగా తెలియజేస్తుంది.
- source_word: προσήλυτοι
  choice: యూదమతంలో చేరినవారు
  rationale: యూదేతర నేపథ్యం నుంచి యూదమతాన్ని స్వీకరించినవారనే నిర్దిష్ట భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: Κρῆτες
  choice: క్రేతీయులు
  rationale: క్రేతే ద్వీప నివాసులకు ప్రామాణిక తెలుగు రూపం.
- source_word: Ἄραβες
  choice: అరబ్బీయులు
  rationale: అరబీయ ప్రాంతాలకు చెందిన ప్రజలను సూచించే సహజమైన తెలుగు జాతివాచకం.
- source_word: ἀκούομεν
  choice: వింటున్నాం
  rationale: మాట్లాడుతున్న ఆ క్షణంలో ప్రత్యక్షంగా అనుభవిస్తున్న వినికిడిని వర్తమాన కొనసాగింపు రూపం సహజంగా వ్యక్తపరుస్తుంది.
- source_word: λαλούντων αὐτῶν
  choice: వీరు ... చెప్పడం
  rationale: ἀκούομενతో ఉన్న కర్త-క్రియ సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ, λαλέωకు మించిన ప్రత్యేక అర్థాన్ని చేర్చదు.
- source_word: ταῖς ἡμετέραις γλώσσαις
  choice: మన సొంత భాషల్లో
  rationale: పెంతెకొస్తు కథనంలోని సందర్భం ప్రజలు గుర్తించగల మానవ భాషలను సూచిస్తుంది; ‘సొంత’ అనే పదం ἡμετέραιςలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: τὰ μεγαλεῖα
  choice: మహాకార్యాలను
  rationale: దేవుడు చేసిన గొప్ప, శక్తిమంతమైన కార్యాల భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: ఆ మహాకార్యాలు దేవునికి చెందినవి లేదా దేవుడు చేసినవి అనే సంబంధాన్ని సహజమైన తెలుగు షష్ఠీ రూపంలో తెలియజేస్తుంది.
theological_decisions:
- issue: పెంతెకొస్తు సందర్భంలో γλώσσαις అర్థం
  choice: గుర్తించగల మానవ భాషలు
  alternative: మానవ భాషలు కాని పారవశ్య ఉచ్చారణలు లేదా ‘నాలుకలు’
  rationale: వివిధ దేశాల నుంచి వచ్చినవారు తమ సొంత భాషల్లో వింటున్నారని సమీప సందర్భం స్పష్టంగా నొక్కిచెబుతుంది. ‘భాషలు’ అనే అనువాదం తరువాతి కాలపు వాదాలను ఇందులోకి తీసుకురాకుండా కథనంలోని ప్రత్యక్ష భావాన్ని అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని జాబితా స్వరూపాన్ని, ‘మనం వింటున్నాం’ అనే ప్రత్యక్ష అనుభవాన్ని నిలిపి, ‘యూదమతంలో చేరినవారు’ ద్వారా సాంకేతిక పదానికి స్పష్టత ఇచ్చాం.
