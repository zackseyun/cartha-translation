revisions:
- from: యూదులూ యూదమతంలో చేరినవారూ, క్రేతీయులూ అరబ్బీయులూ—వీరు దేవుని మహాకార్యాలను మన సొంత భాషల్లో[a] చెప్పడం వింటున్నాం.
  to: యూదులూ యూదమతంలో చేరినవారూ, క్రేతీయులూ అరబ్బులూ—వారు దేవుని గొప్ప కార్యాలను మన సొంత భాషల్లో[a] మాట్లాడటం వింటున్నాం.
  rationale: 'The revision retains every element of the Greek while using more idiomatic modern Telugu: ‘మాట్లాడటం’ directly renders ‘speaking,’ ‘అరబ్బులు’ is standard usage, and ‘గొప్ప కార్యాలు’ communicates God’s μεγαλεῖα without the possible project-like implication of ‘మహాకార్యాలు.’ The footnote continues to preserve the lexical alternative for γλῶσσαι and its contextual sense.'
