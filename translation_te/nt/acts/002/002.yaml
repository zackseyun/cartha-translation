source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἄφνω ἐκ τοῦ οὐρανοῦ ἦχος ὥσπερ φερομένης πνοῆς βιαίας καὶ ἐπλήρωσεν ὅλον τὸν οἶκον οὗ ἦσαν καθήμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/002.yaml
  text: And suddenly there came from heaven a sound like that of a violent rushing wind[a], and it filled the whole house where they were sitting.
translation:
  language: te
  text: అకస్మాత్తుగా పరలోకం నుండి బలంగా వీచే గాలి వంటిది ఒక శబ్దం[a] వచ్చి, వారు కూర్చున్న ఇల్లంతా నింపింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బలంగా దూసుకుపోతున్న గాలిలాంటి శబ్దం.” గ్రీకు పాఠం ఆ శబ్దాన్ని కదులుతున్న శక్తివంతమైన గాలితో పోలుస్తుంది; నిజంగా గాలి వచ్చిందని స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: వచ్చి
  rationale: ἦχος‌తో కూడిన ఈ సంఘటనాత్మక నిర్మాణాన్ని సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది; శబ్దం అకస్మాత్తుగా ఉద్భవించిందనే భావాన్ని నిలుపుతుంది.
- source_word: ἄφνω
  choice: అకస్మాత్తుగా
  rationale: హఠాత్తుగా జరిగినదనే భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: పరలోకం నుండి
  rationale: లూకా రచనల సందర్భంలో కేవలం ఆకాశం అనే భౌతిక స్థలంకన్నా పరలోక మూలాన్ని సూచించే అవకాశాన్ని నిలుపుతుంది.
- source_word: ἦχος
  choice: శబ్దం
  rationale: ప్రత్యేక స్వభావాన్ని అనవసరంగా నిర్దేశించకుండా గ్రీకు పదంలోని విస్తృత అర్థాన్ని ఇస్తుంది.
- source_word: ὥσπερ
  choice: లాంటిది
  rationale: ఇది నిజమైన గాలేనని చెప్పకుండా, శబ్దాన్ని గాలితో పోల్చిన ఉపమానాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: φερομένης πνοῆς βιαίας
  choice: బలంగా వీచే గాలి
  rationale: కదులుతున్న, శక్తివంతమైన గాలి అనే సమగ్ర భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; φερομένης‌లోని చలనాన్ని ‘వీచే’ ద్వారా సూచిస్తుంది.
- source_word: ἐπλήρωσεν
  choice: నింపింది
  rationale: శబ్దమే ఇల్లంతా వ్యాపించిందనే వాక్య నిర్మాణాన్ని నిలుపుతుంది.
- source_word: ὅλον τὸν οἶκον
  choice: ఇల్లంతా
  rationale: ὅλον తెలిపే సంపూర్ణతను సహజమైన సంక్షిప్త తెలుగులో అందిస్తుంది.
- source_word: οὗ ἦσαν καθήμενοι
  choice: వారు కూర్చున్న
  rationale: సాపేక్ష ఉపవాక్యాన్ని స్పష్టమైన ఆధునిక తెలుగు పదక్రమంలో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: గాలితో పోల్చబడిన ఘటన స్వరూపం
  choice: బలంగా వీచే గాలి శబ్దంలాంటి శబ్దం
  alternative: నిజమైన బలమైన గాలి ఇల్లంతా నింపింది
  rationale: ὥσπερ పోలికను సూచిస్తుంది. అందువల్ల నిజంగా గాలి వచ్చిందని తేల్చకుండా, శబ్దం గాలి శబ్దంలా ఉందనే మూలపాఠంలోని నియంత్రిత వర్ణనను ప్రధాన పాఠం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘పరలోకం’ దైవిక మూలసూచనను నిలుపుతుంది; [a] గుర్తు ప్రధాన పాఠంలో ఉంచబడింది.
