revisions:
- from: దేవుని నిర్ణీత సంకల్పం, ముందెరుగుదల ప్రకారం అప్పగించబడిన ఈయనను మీరు ధర్మశాస్త్రం లేనివారి చేతుల[a] ద్వారా సిలువకు మేకులతో కొట్టి చంపారు[b].
  to: దేవుని నిర్ణీత సంకల్పం మరియు ముందెరుగుదల ప్రకారం అప్పగించబడిన ఈయనను మీరు ధర్మశాస్త్ర విరోధుల చేతుల[a] ద్వారా సిలువకు మేకులతో కొట్టి చంపారు[b].
  rationale: The revision explicitly coordinates God’s determined purpose and foreknowledge and improves the rendering of ἀνόμων to convey lawlessness rather than mere absence of the law. It retains the source’s ambiguity concerning the identity of the lawless agents, preserves both divine purpose and human culpability, and keeps all footnote anchors correctly attached to the relevant Telugu expressions.
