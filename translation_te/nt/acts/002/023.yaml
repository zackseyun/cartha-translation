id: ACT.2.23
reference: Acts 2:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτον τῇ ὡρισμένῃ βουλῇ καὶ προγνώσει τοῦ θεοῦ ⸀ἔκδοτον διὰ ⸀χειρὸς ἀνόμων προσπήξαντες ἀνείλατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/023.yaml
  text: this man[a], delivered up according to the determined plan and foreknowledge of God[b], you killed by nailing him to a cross through the hands of lawless men.
translation:
  language: te
  text: దేవుని నిర్ణీత సంకల్పం మరియు ముందెరుగుదల ప్రకారం అప్పగించబడిన ఈయనను మీరు ధర్మశాస్త్ర విరోధుల చేతుల[a] ద్వారా సిలువకు మేకులతో కొట్టి చంపారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకులో ‘చేతి’ అని ఏకవచనం ఉంది; తెలుగులో ఇక్కడ ‘చేతుల ద్వారా’ అనడం సహజం. మరో అనువాదం: ‘ధర్మశాస్త్ర విరోధుల చేతి ద్వారా.’'
    reason: మూలపాఠంలోని ఏకవచన రూపం మరియు సహజ తెలుగు బహువచన ప్రయోగం మధ్య తేడాను తెలియజేయడం.
  - marker: b
    text: లేదా, ‘మరణానికి గురిచేశారు.’
    reason: ἀνείλατεకు సాధ్యమైన మరొక సహజ అనువాదాన్ని చూపించడం.
lexical_decisions:
- source_word: τοῦτον
  choice: ఈయనను
  rationale: యేసును చూపిస్తూ పేతురు ఉపయోగించిన నిర్దేశక సర్వనామ బలాన్ని నిలుపుతూ, గౌరవప్రదమైన సహజ తెలుగు రూపాన్ని ఎంచుకున్నాం.
- source_word: τῇ ὡρισμένῃ βουλῇ
  choice: నిర్ణీత సంకల్పం ప్రకారం
  rationale: ὡρισμένῃలోని నిర్ణయించబడిన లేదా నిర్దేశించబడిన భావాన్నీ, βουλήలోని ఉద్దేశం/సంకల్పం భావాన్నీ స్పష్టంగా వ్యక్తం చేస్తుంది; దైవ సంకల్పాన్ని మృదువుపరచదు.
- source_word: καὶ προγνώσει
  choice: ముందెరుగుదల
  rationale: πρόγνωσις యొక్క ముందుగా ఎరిగిన జ్ఞానం అనే భావాన్ని సంక్షిప్తంగా, తెలుగు క్రైస్తవ వాడుకలో అర్థమయ్యే విధంగా నిలుపుతుంది.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: ‘నిర్ణీత సంకల్పం’ మరియు ‘ముందెరుగుదల’ రెండూ దేవునికి చెందినవని సహజమైన షష్ఠీ సంబంధంతో తెలియజేస్తుంది.
- source_word: ἔκδοτον
  choice: అప్పగించబడిన
  rationale: ఒకరి అధికారానికి లేదా చేతికి ఇచ్చివేయబడిన భావాన్ని చూపుతుంది; సందర్భంలో చెప్పని కర్తను అనవసరంగా చేర్చదు.
- source_word: διὰ χειρὸς ἀνόμων
  choice: ధర్మశాస్త్రం లేనివారి చేతుల ద్వారా
  rationale: διά + షష్ఠీ యొక్క మధ్యవర్తి కర్తృత్వాన్ని ‘ద్వారా’తో నిలుపుతుంది. ἀνόμωνను కేవలం ‘చెడ్డవారు’గా కాక, ధర్మశాస్త్రానికి వెలుపల లేదా దానికి విరుద్ధంగా ఉన్నవారు అనే మూలపద సంబంధాన్ని నిలిపేలా అనువదించింది.
- source_word: προσπήξαντες
  choice: సిలువకు మేకులతో కొట్టి
  rationale: కేవలం బిగించడం కాక, ఈ సందర్భంలో ఉద్దేశించిన సిలువవేయడాన్ని స్పష్టంగా, చారిత్రక చర్యకు నమ్మకంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνείλατε
  choice: చంపారు
  rationale: పేతురు శ్రోతలపై నేరుగా మోపిన బాధ్యతను బలహీనపరచకుండా ἀναιρέω యొక్క ‘చంపడం’ అనే భావాన్ని సూటిగా అందిస్తుంది.
theological_decisions:
- issue: దేవుని సార్వభౌమ సంకల్పం మరియు మానవ బాధ్యత మధ్య సంబంధం
  choice: యేసు దేవుని నిర్ణీత సంకల్పం, ముందెరుగుదల ప్రకారం అప్పగించబడ్డాడనీ, అదే సమయంలో శ్రోతలు ఆయనను చంపారనీ రెండింటినీ సమానంగా నిలిపాం.
  alternative: దేవుని నిర్ణయాన్ని మృదువుపరచడం, లేదా ధర్మశాస్త్రం లేనివారినే ఏకైక కర్తలుగా చూపి శ్రోతల బాధ్యతను తగ్గించడం.
  rationale: గ్రీకు వాక్యం దైవ ఉద్దేశాన్నీ మానవ అపరాధ బాధ్యతనూ పక్కపక్కనే ఉంచుతుంది. ఏదైనా ప్రత్యేక సిద్ధాంత వ్యవస్థకు అనుగుణంగా ఈ ఉద్రిక్తతను పరిష్కరించకుండా అనువాదం దానిని కాపాడుతుంది.
- issue: ἀνόμων యొక్క పరిధి
  choice: ధర్మశాస్త్రం లేనివారు
  alternative: అక్రమకారులు; దుర్మార్గులు
  rationale: ఈ పదం ధర్మశాస్త్రానికి విరుద్ధంగా ప్రవర్తించేవారినీ, ధర్మశాస్త్రానికి వెలుపల ఉన్న అన్యజనులనూ సూచించగలదు. ప్రధాన అనువాదం ఆ రెండు అవకాశాలను పూర్తిగా మూసివేయకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. ‘ముందెరుగుదల’ వంటి ధార్మిక పదాన్ని సందర్భస్పష్టత కోసం ఉంచి, వాక్య నిర్మాణాన్ని సహజంగా చేశాం. ‘చేతుల’ అనే బహువచనం తెలుగు నుడికారానికి అనుగుణం; మూలంలోని ఏకవచనం పాదటిప్పణిలో నమోదు చేయబడింది.
