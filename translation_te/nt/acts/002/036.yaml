  to: 'కాబట్టి ఇశ్రాయేలు ఇంటివారందరూ నిశ్చయంగా తెలుసుకోవాలి: మీరు సిలువ వేసిన ఈ యేసునే దేవుడు ప్రభువుగానూ మెస్సీయగానూ చేశాడు.[a][b]'
