id: ACT.2.36
reference: Acts 2:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀσφαλῶς οὖν γινωσκέτω πᾶς οἶκος Ἰσραὴλ ὅτι καὶ κύριον ⸂αὐτὸν καὶ χριστὸν⸃ ⸂ἐποίησεν ὁ θεός⸃, τοῦτον τὸν Ἰησοῦν ὃν ὑμεῖς ἐσταυρώσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/036.yaml
  text: Therefore let all the house of Israel know for certain that God has made him both Lord and Messiah—this Jesus whom you crucified[a][b].
translation:
  language: te
  text: 'కాబట్టి ఇశ్రాయేలు ఇంటివారందరూ నిశ్చయంగా తెలుసుకోవాలి: మీరు సిలువ వేసిన ఈ యేసునే దేవుడు ప్రభువుగానూ మెస్సీయగానూ చేశాడు.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తుగానూ.” గ్రీకు బిరుదు Χριστός (క్రిస్టోస్); ఇక్కడ ఇశ్రాయేలును ఉద్దేశించిన పేతురు ప్రసంగంలో దాని బిరుదు భావాన్ని నిలుపడానికి “మెస్సీయ” అని అనువదించాం.
    reason: alternative_reading
  - marker: b
    text: “ప్రభువుగానూ మెస్సీయగానూ చేశాడు” అనే మాట ఈ సందర్భంలో దేవుడు యేసును ఉన్నతపరచి ఈ బిరుదులలో బహిరంగంగా స్థాపించడాన్ని సూచిస్తుంది. గ్రీకు క్రియకు “నియమించాడు” లేదా “స్థాపించాడు” అని కూడా సందర్భానుసారంగా అర్థం చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλῶς
  choice: నిశ్చయంగా
  rationale: తెలుసుకోవలసిన విషయపు నిర్ధారితత్వాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాదననుంచి వచ్చే నిర్ధారణను సూచించే తార్కిక అనుసంధానాన్ని నిలుపుతుంది.
- source_word: γινωσκέτω
  choice: తెలుసుకోవాలి
  rationale: మూడవ పురుష ఏకవచన ఆజ్ఞార్థక రూపం సమూహమైన ఇశ్రాయేలు ఇంటిని ఉద్దేశిస్తుంది; తెలుగులో ‘తెలుసుకోవాలి’ ఆ ఆజ్ఞాత్మక బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πᾶς οἶκος Ἰσραήλ
  choice: ఇశ్రాయేలు ఇంటివారందరూ
  rationale: నిబంధన ప్రజలను సమష్టిగా సూచించే బైబిలీయ ‘ఇల్లు’ రూపకాన్ని, తెలుగులో అర్థమయ్యే విధంగా ‘ఇంటివారు’ అని నిలుపుతుంది.
- source_word: κύριον
  choice: ప్రభువు
  rationale: ఉన్నతమైన అధికారాన్ని తెలిపే బిరుదు; సమీప సందర్భంలోని ‘ప్రభువు’ ప్రస్తావనతోనూ అనుసంధానమవుతుంది.
- source_word: Χριστόν
  choice: మెస్సీయ
  rationale: ఇశ్రాయేలును ఉద్దేశించిన పేతురు ప్రసంగంలో ఇది పేరు కంటే అభిషిక్త రాజు/రక్షకుని బిరుదుగా పనిచేస్తుంది.
- source_word: ἐποίησεν
  choice: చేశాడు
  rationale: గ్రీకు క్రియ యొక్క సరళమైన బలాన్ని కాపాడుతుంది; ‘నియమించాడు’ అని ముందుగానే అర్థాన్ని పరిమితం చేయకుండా సందర్భంలోని ఉన్నతీకరణ భావాన్ని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: ఈ యేసునే
  rationale: సూచనాత్మకమైన, నొక్కిచెప్పే గ్రీకు నిర్మాణాన్ని తెలుగు ‘నే’ ద్వారా సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: మీరు సిలువ వేసిన
  rationale: శ్రోతల పాత్రపై పేతురు ఉంచిన ప్రత్యక్ష నిందారోపణను సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘దేవుడు ప్రభువుగానూ మెస్సీయగానూ చేశాడు’ అనే మాటలోని క్రీస్తుశాస్త్ర సంబంధ భావం
  choice: ‘చేశాడు’ అనే మూలార్థాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భంలో ఇది యేసును ఉన్నతపరచి ఈ స్థానాల్లో బహిరంగంగా స్థాపించడాన్ని సూచిస్తుందని పాదటిప్పణిలో తెలిపాం.
  alternative: ‘నియమించాడు’ లేదా ‘స్థాపించాడు’ అని ప్రధాన పాఠ్యంలో భావానువాదం చేయడం; లేదా యేసు స్వభావమే మారిందని చదవడం.
  rationale: ἐποίησεν అనే పదపు నిజమైన బలాన్ని తగ్గించకూడదు; అదే సమయంలో వాక్యం స్వయంగా తప్పనిసరిగా చెప్పని దైవస్వభావ మార్పును అనువాదం దిగుమతి చేయకూడదు. అసలు పాఠ్యంలోని ఉద్రిక్తతను పాఠ్యంలో ఉంచి, సందర్భపరమైన స్పష్టీకరణను పాదటిప్పణికి పరిమితం చేశాం.
- issue: Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ‘ఇశ్రాయేలు ఇంటివారు’ అనే ప్రత్యక్ష సంబోధనలో Χριστός బిరుదు భావం ప్రముఖంగా ఉంది; అందుచేత ‘మెస్సీయ’ ఆ భావాన్ని మరింత ప్రత్యక్షంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనా గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ‘ఇశ్రాయేలు ఇంటివారందరూ’ బైబిలీయ సమష్టి రూపకాన్ని చదవడానికి సులభంగా నిలుపుతుంది. ‘ఈ యేసునే’ మూలంలోని నొక్కిచెప్పే భావాన్ని వ్యక్తం చేస్తుంది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
