source:
  edition: SBLGNT
  text: Ἦσαν δὲ ⸀ἐν Ἰερουσαλὴμ κατοικοῦντες Ἰουδαῖοι, ἄνδρες εὐλαβεῖς ἀπὸ παντὸς ἔθνους τῶν ὑπὸ τὸν οὐρανόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/005.yaml
  text: There were Jews living in Jerusalem[b][a], devout men from every nation under heaven.
translation:
  language: te
  text: యెరూషలేములో నివసిస్తూ ఉండే యూదులు[a] ఉన్నారు; వారు ఆకాశం కిందనున్న[b] ప్రతి దేశానికి చెందిన భక్తిపరులైన పురుషులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యూదయ ప్రాంతవాసులు.’ అయితే వారు ఆకాశం కిందనున్న ప్రతి దేశానికి చెందినవారని సందర్భం చెబుతున్నందున, ఇక్కడ విస్తృతమైన జాతి-మత అర్థంలో ‘యూదులు’ అనేదే ఎక్కువగా సరిపోతుంది.
    reason: alternative_reading
  - marker: b
    text: ‘ఆకాశం కింద’ అనేది ‘ప్రపంచమంతటా’ అనే అర్థమిచ్చే బైబిలీయ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: ఉన్నారు
  rationale: δέ ఇక్కడ స్వల్ప కథన అనుసంధానంగా పనిచేస్తుంది; తెలుగులో ప్రత్యేక విరోధార్థక పదం చేర్చకుండా సహజ వాక్యప్రవాహంతో దాని బలాన్ని వ్యక్తం చేశాం.
- source_word: ἐν Ἰερουσαλὴμ κατοικοῦντες
  choice: యెరూషలేములో నివసిస్తున్న
  rationale: κατοικοῦντες ఒకచోట స్థిరంగా లేదా కొంతకాలంగా నివసించే భావాన్ని ఇస్తుంది; ‘నివసిస్తున్న’ ఆ కొనసాగుతున్న స్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: Ἰουδαῖοι
  choice: యూదులు
  rationale: ‘ప్రతి దేశం నుండి వచ్చిన’ అనే సందర్భం కేవలం యూదయ ప్రాంతవాసులను కాక, విస్తృత జాతి-మత సముదాయాన్ని సూచిస్తుంది.
- source_word: ἄνδρες εὐλαβεῖς
  choice: దైవభక్తిగల పురుషులు
  rationale: ἄνδρες యొక్క నిర్దిష్ట పుంలింగ భావాన్ని ‘పురుషులు’ నిలుపుతుంది; εὐλαβεῖς దేవునిపట్ల భక్తి, గౌరవపూర్వక శ్రద్ధను సూచిస్తున్నందున ‘దైవభక్తిగల’ అని అనువదించాం.
- source_word: ἀπὸ παντὸς ἔθνους
  choice: ప్రతి దేశం నుండి వచ్చిన
  rationale: ఇక్కడ ἔθνος భౌగోళిక-జాతిపరమైన ప్రపంచ దేశాలను సూచిస్తుంది; తెలుగులో ‘ప్రతి దేశం’ సహజమైన సమానార్థకం.
- source_word: τῶν ὑπὸ τὸν οὐρανόν
  choice: ఆకాశం కింద ఉన్న
  rationale: మూలంలోని బైబిలీయ నుడికారాన్ని నిలిపి, దాని ప్రపంచవ్యాప్త భావాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
theological_decisions:
- issue: Ἰουδαῖοι అనే పదం యొక్క పరిధి
  choice: యూదులు
  alternative: యూదయులు
  rationale: వారు ‘ఆకాశం కింద ఉన్న ప్రతి దేశం నుండి’ వచ్చారని వాక్యం చెబుతున్నందున, ప్రాంతపరంగా యూదయ నివాసులు అనే సంకుచిత అర్థం కంటే జాతి-మతపరమైన ‘యూదులు’ అనే అర్థమే సందర్భానికి సరిపోతుంది.
- issue: ἄνδρες యొక్క లింగ సూచన
  choice: పురుషులు
  alternative: ప్రజలు
  rationale: మూలంలోని ἄνδρες ప్రత్యేకంగా పురుషులను సూచిస్తుంది; దానిని లింగనిరపేక్షంగా మార్చకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. గ్రీకు వాక్య నిర్మాణాన్ని తెలుగులో భారంగా చేయకుండా రెండు వాక్యాలుగా విభజించాం; అయినా భావసంబంధం, పుంలింగ సూచన, బైబిలీయ నుడికారం అన్నీ నిలిపాం.
