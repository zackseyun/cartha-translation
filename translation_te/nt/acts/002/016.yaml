translation:
  language: te
  text: 'కాని ఇది ప్రవక్త యోవేలు ద్వారా[a] చెప్పబడినది:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రవక్త యోవేలు చేత.” గ్రీకు పదబంధం కర్తృత్వాన్ని కూడా సూచించవచ్చు; అయితే “ద్వారా” యోవేలు సందేశాన్ని అందించిన ప్రవక్తగా ఉన్న మధ్యవర్తి పాత్రను మరింత స్పష్టంగా తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: కాని
  rationale: మునుపటి సందర్భంలో జనసమూహపు అపార్థాన్ని సరిదిద్దే వ్యతిరేకార్థక అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τοῦτό
  choice: ఇది
  rationale: ప్రస్తుతం జరుగుతున్న సంఘటనను సూచించే నపుంసకలింగ నిర్దేశక సర్వనామానికి సహజమైన తెలుగు రూపం.
- source_word: ἐστιν
  choice: దే
  rationale: గ్రీకు సంధాన క్రియ ἐστιν యొక్క గుర్తింపు భావాన్ని ‘చెప్పబడినదే’ అనే నిర్మాణంలో సహజంగా, ఉద్ఘాటనతో వ్యక్తం చేస్తుంది; ‘అర్థం’ వంటి వ్యాఖ్యాత్మక భావాన్ని చేర్చదు.
- source_word: τὸ εἰρημένον
  choice: చెప్పబడినది
  rationale: నామవాచకంగా పనిచేసే పరిపూర్ణ కర్మణి కృదంతపు అర్థాన్ని కర్మణి రూపంలో నిలుపుతుంది.
- source_word: διὰ
  choice: ద్వారా
  rationale: షష్ఠీ విభక్తితో వచ్చిన διά సూచించే మధ్యవర్తిత్వం లేదా సాధనత్వాన్ని తెలుగులో స్పష్టంగా కాపాడుతుంది.
- source_word: τοῦ προφήτου
  choice: ప్రవక్త
  rationale: యోవేలు యొక్క ప్రవక్త పాత్రను నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: Ἰωήλ
  choice: యోవేలు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: διὰ τοῦ προφήτου Ἰωήλ లోని ప్రవక్త మధ్యవర్తిత్వం
  choice: యోవేలు ప్రవక్త ద్వారా
  alternative: యోవేలు ప్రవక్త చేత
  rationale: ‘ద్వారా’ దేవుని సందేశానికి యోవేలు ప్రవక్త మధ్యవర్తి లేదా సాధనంగా ఉన్నాడనే గ్రీకు భావాన్ని కాపాడుతుంది; సందేశానికి అంతిమ మూలం గురించి పాఠం చెప్పినదానికంటే ఎక్కువగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘చెప్పబడినదే’ అనే రూపం గ్రీకు వాక్యంలోని గుర్తింపు మరియు ఉద్ఘాటనను సంక్షిప్తంగా నిలుపుతుంది.
