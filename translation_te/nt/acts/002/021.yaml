id: ACT.2.21
reference: Acts 2:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔσται πᾶς ὃς ⸀ἐὰν ἐπικαλέσηται τὸ ὄνομα κυρίου σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/021.yaml
  text: And it shall be that everyone who calls on the name of the Lord will be saved[a].
translation:
  language: te
  text: 'అప్పుడు ఇలా జరుగుతుంది: ప్రభువు నామాన్ని పిలుచుకొనేవారందరూ రక్షించబడతారు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రభువు నామాన్ని పిలుచుకొనేవారెవరైనా.’ ఈ మాట యోవేలు 2:32ను ప్రతిధ్వనిస్తుంది; అక్కడ ‘ప్రభువు’ యెహోవాను సూచిస్తుంది. అపొస్తలుల కార్యములలో పేతురు ఈ ఉల్లేఖనాన్ని యేసును గురించి చేస్తున్న తన ప్రకటనలో ఉపయోగిస్తున్నాడు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσται
  choice: అప్పుడు … రక్షించబడతారు
  rationale: ఈ భవిష్యత్ క్రియారూపాన్ని తెలుగులో వాక్యాంతంలోని భవిష్యత్ క్రియతో సహజంగా వ్యక్తం చేశాం; సందర్భంలోని ఫలిత భావాన్ని ‘అప్పుడు’ సూచిస్తుంది.
- source_word: πᾶς ὃς ἐὰν
  choice: ప్రతి ఒక్కరూ
  rationale: షరతుతో కూడిన సార్వత్రిక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐπικαλέσηται
  choice: పిలిచే
  rationale: ‘నామాన్ని పిలుచుట’ అనే బైబిలు నుడికారంలో ప్రార్థనతో, ఆధారపడుతూ మొరపెట్టుకునే భావం ఉంది; దానిని విపులీకరించకుండా మూల రూపాన్ని నిలిపాం.
- source_word: τὸ ὄνομα
  choice: నామాన్ని
  rationale: ఒడంబడిక, ఆరాధన సంబంధిత భావభారం ఉన్న స్థిరమైన బైబిలు వ్యక్తీకరణను యథాతథంగా ఉంచుతుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριοςకు సహజమైన గౌరవప్రద తెలుగు సమానార్థకం; యోవేనా యేసా అని ప్రధాన పాఠ్యంలో నిర్దిష్టం చేయదు.
- source_word: σωθήσεται
  choice: రక్షించబడతారు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ, విడుదల మరియు రక్షణ అనే రెండింటి భావసాధ్యతను కలిగి ఉన్న ప్రామాణిక తెలుగు ప్రయోగం.
theological_decisions:
- issue: యోవేలు ఉల్లేఖనాన్ని అపొస్తలుల కార్యములలో వాడినప్పుడు ‘ప్రభువు’ అనే పదానికి సూచితుడు ఎవరు?
  choice: ప్రధాన పాఠ్యంలో ‘ప్రభువు’ అని మాత్రమే అనువదించడం.
  alternative: యోవేలు మూలసందర్భాన్ని బట్టి ‘యెహోవా’ అని, లేదా అపొస్తలుల కార్యములలోని క్రీస్తుకేంద్ర సందర్భాన్ని బట్టి ‘యేసు’ అని స్పష్టీకరించడం.
  rationale: గ్రీకు పాఠ్యం κύριος అని మాత్రమే చెబుతుంది. యోవేలు మూలసందర్భంలో అది YHWHను సూచించినా, పేతురు దీనిని యేసు గురించిన ప్రకటనలో ఉపయోగిస్తున్నాడు. ‘ప్రభువు’ అనే అనువాదం ఈ నిజమైన ధార్మిక ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించాం. ‘ప్రభువు నామాన్ని పిలిచే’ అనే బైబిలు నుడికారాన్ని భావానువాదంతో విప్పకుండా నిలిపాం; ఉల్లేఖనానికి తగిన గంభీరతను కాపాడాం.
