revisions:
- from: అప్పుడు ప్రభువు నామాన్ని పిలిచే ప్రతి ఒక్కరూ రక్షించబడతారు.[a]
  to: 'అప్పుడు ఇలా జరుగుతుంది: ప్రభువు నామాన్ని పిలుచుకొనేవారందరూ రక్షించబడతారు.[a]'
  rationale: The revision explicitly represents the introductory future formula while retaining the source’s universal condition, invocation idiom, and future passive promise. It also uses a natural modern Telugu biblical expression for calling on the Lord’s name. The footnote is lightly edited for idiomatic Telugu and continues to distinguish Joel’s YHWH referent from Acts’ Jesus-centered proclamation without resolving the referent in the translated text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:53:40Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the universal scope, the idiom of invoking the Lord's name, and the future passive ‘will be saved.’ However, ‘అప్పుడు’ alone does not adequately represent the introductory formula καὶ ἔσται (‘and it shall be’); it is better rendered as ‘అప్పుడు ఇలా జరుగుతుంది:’.
  naturalness: ‘ప్రభువు నామాన్ని పిలిచే’ is understandable, but ‘ప్రభువు నామాన్ని పిలుచుకొనేవారు’ is the more natural established Telugu biblical idiom for invocation. The plural universal construction is fluent in modern standard Telugu.
  terminology: ‘ప్రభువు,’ ‘నామం,’ and ‘రక్షించబడతారు’ are appropriate. The revision does not specify whether ‘ప్రభువు’ refers to YHWH or Jesus in the main text, thus preserving the citation’s contextual ambiguity.
  issues:
  - severity: medium
    issue: The opening ‘అప్పుడు’ undertranslates καὶ ἔσται.
    rationale: ‘అప్పుడు’ means ‘then,’ whereas the Greek introduces the quoted promise/formula, ‘and it shall be.’ Adding ‘ఇలా జరుగుతుంది:’ conveys this without adding interpretive content.
  - severity: low
    issue: ‘పిలిచే’ is less idiomatic here than ‘పిలుచుకొనేవారు.’
    rationale: In Telugu biblical usage, ‘నామాన్ని పిలుచుకొను’ naturally conveys invoking/calling on a name in dependence or worship, while retaining the source expression.
  revised_text: 'అప్పుడు ఇలా జరుగుతుంది: ప్రభువు నామాన్ని పిలుచుకొనేవారందరూ రక్షించబడతారు.[a]'
  revised_footnotes:
