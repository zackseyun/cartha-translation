revisions:
- from: అందుచేత నా హృదయం సంతోషించింది, నా నాలుక ఆనందించింది; అంతేకాక, నా శరీరం కూడా నిరీక్షణలో నివసిస్తుంది.[a]
  to: ఈ కారణంగా నా హృదయం సంతోషించింది, నా నాలుక ఉల్లసించింది; అంతేకాక, నా దేహం కూడా నిరీక్షణలో నివసిస్తుంది.[a]
  rationale: The revision more directly represents the causal connector, preserves the stronger joy term in the parallel line, and uses ‘దేహం’ as an accurate and natural Telugu equivalent for literal σάρξ. The footnote remains anchored to the final phrase and offers the established interpretive alternative without presenting it as the main text.
