source:
  edition: SBLGNT
  text: διὰ τοῦτο ηὐφράνθη ⸂ἡ καρδία μου⸃ καὶ ἠγαλλιάσατο ἡ γλῶσσά μου, ἔτι δὲ καὶ ἡ σάρξ μου κατασκηνώσει ἐπ’ ἐλπίδι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/026.yaml
  text: Because of this my heart was glad[a], and my tongue rejoiced; moreover, even my flesh will dwell in hope.
translation:
  language: te
  text: ఈ కారణంగా నా హృదయం సంతోషించింది, నా నాలుక ఉల్లసించింది; అంతేకాక, నా దేహం కూడా నిరీక్షణలో నివసిస్తుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా దేహం నిరీక్షణలో విశ్రమిస్తుంది.’
    reason: κατασκηνώσει ἐπ’ ἐλπίδι అనే పదబంధంలో నివసించడం అనే రూపకాన్ని ‘విశ్రమించడం’గా అర్థం చేసుకునే సందర్భానుకూల ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: అందుచేత
  rationale: διά + accusative ఇక్కడ కారణం లేదా ఆధారాన్ని సూచిస్తుంది; ‘అందుచేత’ తెలుగు వాక్యప్రవాహంలో కారణ-ఫల సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ηὐφράνθη ἡ καρδία μου
  choice: నా హృదయం సంతోషించింది
  rationale: క్రియను సహజమైన అకర్మక భావంతో అనువదిస్తూ, ‘హృదయం’ అనే బైబిలీయ మానవశాస్త్ర రూపకాన్ని నిలుపుతుంది.
- source_word: ἠγαλλιάσατο ἡ γλῶσσά μου
  choice: నా నాలుక ఆనందించింది
  rationale: ἠγαλλιάσατο లోని ఉప్పొంగే ఆనందాన్ని తెలియజేస్తూనే, గ్రీకులోని ‘నాలుక’ అనే కవితాత్మక అవయవప్రయోగాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: ἔτι δὲ καὶ
  choice: అంతేకాక ... కూడా
  rationale: ముందటి మాటను విస్తరించే భావాన్నీ, తదుపరి అంశంపై ఉన్న ఉద్ఘాటననూ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἡ σάρξ μου
  choice: నా శరీరం
  rationale: σάρξ ఇక్కడ నైతికమైన ‘పాప స్వభావం’ను కాక దేహసంబంధమైన అస్తిత్వాన్ని సూచిస్తుంది. తెలుగులో ‘నా మాంసం’ కంటే ‘నా శరీరం’ సాధారణ పాఠకులకు సహజంగా, సందర్భార్థానికి స్పష్టంగా ఉంటుంది.
- source_word: κατασκηνώσει
  choice: నివసిస్తుంది
  rationale: ఈ భవిష్యత్ క్రియలోని నివాసం చేయడం లేదా గుడారం వేసుకోవడం అనే రూపకాన్ని ‘నివసిస్తుంది’ నిలుపుతుంది; ‘విశ్రమిస్తుంది’ అని అనువదించడం భావాన్ని ముందుగానే సంకుచితం చేస్తుంది.
- source_word: ἐπ’ ἐλπίδι
  choice: నిరీక్షణలో
  rationale: ἐπί + dative ఇక్కడ ఆధారం లేదా పరిధిని సూచిస్తుంది. ‘నిరీక్షణలో’ ఆశాభరితమైన భద్రతను అదనపు వ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: పునరుత్థాన సందర్భంలోని σάρξ అనువాదం
  choice: నా శరీరం
  alternative: నా మాంసం
  rationale: ఈ పదం ఇక్కడ నైతిక దుష్టత్వాన్ని కాక దేహసంబంధ అస్తిత్వాన్ని సూచిస్తుంది. తెలుగు వాడుకలో ‘శరీరం’ ఆ భావాన్ని సహజంగా అందిస్తుంది; పునరుత్థానాన్ని వచనంలోకి వివరణాత్మకంగా చేర్చదు.
- issue: κατασκηνώσει ἐπ’ ἐλπίδι యొక్క భావఛాయ
  choice: నిరీక్షణలో నివసిస్తుంది
  alternative: నిరీక్షణతో విశ్రమిస్తుంది
  rationale: ఎంచుకున్న రూపం భద్రమైన నివాసం అనే మూల రూపకాన్ని కాపాడి, మరణం మరియు పునరుత్థానం గురించిన దాని సూచనను పరిసర సందర్భమే వివరించనిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తన ఉల్లేఖనానికి తగిన గంభీరతను ఉంచుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం ఉపయోగించబడింది. కవితాత్మక సమాంతరత కోసం ‘హృదయం/నాలుక/శరీరం’ క్రమం నిలుపబడింది.
