id: ACT.2.45
reference: Acts 2:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὰ κτήματα καὶ τὰς ὑπάρξεις ἐπίπρασκον καὶ διεμέριζον αὐτὰ πᾶσιν καθότι ἄν τις χρείαν εἶχεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/045.yaml
  text: And they were selling their property and possessions and distributing them to all[a], as anyone had need.
translation:
  language: te
  text: వారు తమ ఆస్తులను, సొత్తులను అమ్ముతూ, వాటిని అందరికీ ఎవరికైనా అవసరం ఉన్నంత మేరకు పంచిపెడుతూ ఉండేవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ భూములను లేదా స్థిరాస్తులను, సొత్తులను.” ఇక్కడున్న రెండు గ్రీకు పదాల్లో మొదటిది తరచుగా భూములు లేదా ఇతర ఆస్తి హక్కులను, రెండవది సాధారణంగా ఒకరి సొంత వస్తువులు లేదా సొత్తును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήματα
  choice: భూములు
  rationale: κτήματα సాధారణంగా సంపాదించిన ఆస్తులను, ముఖ్యంగా భూములు లేదా స్థిరాస్తి హక్కులను సూచించగలదు. తరువాతి ὑπάρξεις నుండి తేడాను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὑπάρξεις
  choice: ఇతర ఆస్తులు
  rationale: ὑπάρξεις ఒకరి సొంత వస్తువులు లేదా ఆస్తులను విస్తృతంగా సూచిస్తుంది. ‘ఇతర’ అనే పదం ముందున్న భూములతో కలిసిపోకుండా రెండవ వర్గాన్ని స్పష్టం చేస్తుంది; అయితే చరాస్తులకే పరిమితం చేయదు.
- source_word: ἐπίπρασκον
  choice: అమ్ముతూ ... ఉండేవారు
  rationale: అసంపూర్ణ భూతకాల రూపం గతంలో కొనసాగిన లేదా పదేపదే జరిగిన చర్యను సూచిస్తుంది; తెలుగు సంయుక్త క్రియ ఆ భావాన్ని నిలుపుతుంది.
- source_word: διεμέριζον
  choice: పంచిపెడుతూ ఉండేవారు
  rationale: సమాజంలోని వారికి అవసరాన్ని బట్టి కేటాయించి ఇవ్వడాన్ని సహజంగా తెలియజేస్తుంది; పంపిణీ విధానాన్ని పాఠం చెప్పినదానికంటే ఎక్కువగా నిర్దేశించదు.
- source_word: αὐτά
  choice: అవ్యక్తంగా క్రియలో పొందుపరచబడింది
  rationale: గ్రీకు సర్వనామం అమ్మబడిన ఆస్తులను లేదా వాటి ద్వారా లభించినదాన్ని సూచించవచ్చు. తెలుగులో ‘వాటిని’ అంటే ఆస్తులనే నేరుగా పంచారని అనిపించే అవకాశం ఉన్నందున, కర్మను సహజంగా అవ్యక్తంగా ఉంచి మూలంలోని సూచనాత్మక అస్పష్టతను కాపాడాం.
- source_word: πᾶσιν
  choice: అందరికీ
  rationale: దత్తివాచక బహువచనంలోని గ్రహీతల విస్తృతిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: ఎవరికెంత అవసరం ఉండేదో దానికి తగినట్లు
  rationale: ప్రతి వ్యక్తి అవసరానికి అనుగుణంగా పంపిణీ జరిగిందనే అనిర్దిష్ట-షరతు భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: విశ్వాసులు ఆస్తులను పంచుకున్న స్వభావం
  choice: అవసరాన్ని బట్టి ఆస్తులను అమ్మి పంచిపెట్టే కొనసాగుతున్న ఆచరణగా వర్ణించడం
  alternative: క్రైస్తవులందరికీ తప్పనిసరైన సంపూర్ణ సామూహిక యాజమాన్య వ్యవస్థగా నిర్దేశించడం
  rationale: అసంపూర్ణ భూతకాల క్రియలు కొనసాగిన లేదా పునరావృతమైన ఆచరణను చూపుతాయి. వ్యక్తిగత యాజమాన్యం పూర్తిగా రద్దయిందని గానీ, ఇది సర్వకాలిక ఆజ్ఞ అని గానీ వచనం స్పష్టంగా చెప్పదు; అందువల్ల అనువాదం వర్ణనాత్మకంగానే ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలి. కొనసాగుతున్న లేదా పునరావృతమైన చర్యను ‘అమ్ముతూ ... పంచిపెడుతూ ఉండేవారు’ ద్వారా నిలిపాం. ప్రధాన పాఠంలోని [a] సూచిక పాదటిప్పణితో సరిపోతుంది.
