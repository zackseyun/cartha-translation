  source_fidelity: మూల గ్రీకు వాక్యార్థం, ‘పరలోకాలు’ అనే బహువచనం, దావీదుపై ఉద్ఘాటన, మరియు కీర్తన 110:1 ఉల్లేఖనంలోని రెండు κύριος పదాల పునరుక్తి ముసాయిదాలో నిలిచాయి. అయితే ఉల్లేఖనంలోని ‘ప్రభువు నా ప్రభువుతో, … అని అన్నాడు’ అనే నిర్మాణం తెలుగులో అసంపూర్ణంగా/విరామచిహ్నపరంగా ఇబ్బందికరంగా ఉంది. ‘ఇలా అన్నాడు:’ అని స్పష్టపరచడం ప్రత్యక్ష ఉల్లేఖన నిర్మాణాన్ని నమ్మకంగా తెలియజేస్తుంది.
