id: ACT.2.34
reference: Acts 2:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γὰρ Δαυὶδ ἀνέβη εἰς τοὺς οὐρανούς, λέγει δὲ αὐτός· Εἶπεν ⸀ὁ κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/034.yaml
  text: For David did not ascend into the heavens[a], but he himself says, ‘The Lord said to my Lord, “Sit at my right hand,”’
translation:
  language: te
  text: 'ఎందుకంటే దావీదు పరలోకాలకు[a] ఎక్కలేదు; అయితే దావీదే ఇలా అంటున్నాడు: “ప్రభువు నా ప్రభువుతో ఇలా అన్నాడు: ‘నా కుడివైపున కూర్చో.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కీర్తన 110:1. హీబ్రూ పాఠ్యంలో మొదటి ‘ప్రభువు’ దైవనామమైన YHWHకు అనువాదం; ‘యెహోవా నా ప్రభువుతో అన్నాడు’తో పోల్చండి.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβη
  choice: ఎక్కిపోలేదు
  rationale: ἀναβαίνω యొక్క ఆరోహణ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, పరలోకానికి ఎక్కడం అనే సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: τοὺς οὐρανούς
  choice: పరలోకాలకు
  rationale: గ్రీకు పదంలోని బహువచన రూపాన్ని తెలుగులోనూ నిలుపుతూ, బైబిలు సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: λέγει δὲ αὐτός
  choice: కానీ అతడే ఇలా అంటున్నాడు
  rationale: δέ సూచించే స్వల్ప వ్యత్యాసాన్ని ‘కానీ’ తెలియజేస్తుంది; αὐτός లోని ఉద్ఘాటనను ‘అతడే’ నిలుపుతుంది; వర్తమాన కాలం లేఖన ఉల్లేఖనాన్ని సజీవ వాక్యంగా పరిచయం చేస్తుంది.
- source_word: ὁ κύριος
  choice: ప్రభువు
  rationale: గ్రీకు κύριος ను ప్రధాన పాఠ్యంలో నేరుగా ‘ప్రభువు’గా అనువదించాం; కీర్తనలోని హీబ్రూ దైవనామ నేపథ్యాన్ని పాదసూచికలో తెలిపాం.
- source_word: τῷ κυρίῳ μου
  choice: నా ప్రభువుతో
  rationale: రెండవ κύριος ను కూడా ‘ప్రభువు’గా ఉంచడం గ్రీకు పదపునరుక్తిని, పేతురు వాదంలోని క్రీస్తుసంబంధ ప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: Κάθου
  choice: కూర్చో
  rationale: ఆజ్ఞార్థక రూపంలోని ప్రత్యక్షతను సంక్షిప్తమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐκ δεξιῶν μου
  choice: నా కుడివైపున
  rationale: గౌరవం, అధికార స్థానం అనే మూలభాషా నుడికారాన్ని సహజమైన తెలుగు నుడికారంతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: కీర్తన 110:1 ఉల్లేఖనంలో κύριος అనే రెండు పదాల అనువాదం
  choice: 'ప్రధాన పాఠ్యంలో రెండింటినీ ‘ప్రభువు’గా అనువదించడం: ‘ప్రభువు నా ప్రభువుతో’'
  alternative: హీబ్రూ దైవనామాన్ని ప్రత్యక్షంగా చూపడానికి మొదటిదాన్ని ప్రత్యేక రూపంలో ఇవ్వడం
  rationale: ఇక్కడి గ్రీకు మూలపాఠ్యం రెండు చోట్లా κύριος అనే పదాన్నే వాడుతుంది. అందువల్ల ప్రధాన పాఠ్యం ఆ రూపాన్ని అనుసరిస్తుంది; మొదటి పదం వెనుకనున్న హీబ్రూ YHWH నేపథ్యాన్ని పాదసూచికలో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవభరితమైన శైలి వాడబడింది. ‘పరలోకాలకు’ అనే బహువచనం గ్రీకు రూపాన్ని నిలుపుతుంది; ఉల్లేఖనంలోని రెండు κύριος పదాలకు ఒకే తెలుగు పదం వాడి మూలపాఠ్యంలోని ఉద్దేశపూర్వక పదపునరుక్తిని కాపాడాం.
