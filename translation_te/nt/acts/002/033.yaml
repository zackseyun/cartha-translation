id: ACT.2.33
reference: Acts 2:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῇ δεξιᾷ οὖν τοῦ θεοῦ ὑψωθεὶς τήν τε ἐπαγγελίαν τοῦ ⸂πνεύματος τοῦ ἁγίου⸃ λαβὼν παρὰ τοῦ πατρὸς ἐξέχεεν τοῦτο ⸀ὃ ⸀ὑμεῖς βλέπετε καὶ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/033.yaml
  text: Therefore[a], having been exalted to the right hand of God, and having received from the Father the promise of the Holy Spirit[b], he has poured out this that you yourselves are seeing and hearing.
translation:
  language: te
  text: కాబట్టి, దేవుని కుడివైపుకు హెచ్చించబడి[a], తండ్రి నుండి వాగ్దానం చేయబడిన పరిశుద్ధాత్మను[b] పొంది, మీరు స్వయంగా చూస్తున్నదీ వింటున్నదీ అయిన దీనిని ఆయన కుమ్మరించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని కుడిచేతివల్ల హెచ్చించబడి.” గ్రీకు దత్తి విభక్తి స్థానాన్ని (“కుడివైపుకు”) లేదా సాధనాన్ని (“కుడిచేతివల్ల”) సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “పరిశుద్ధాత్మను గురించిన వాగ్దానాన్ని.” గ్రీకు పదబంధం పరిశుద్ధాత్మనే వాగ్దానం చేయబడిన వరంగా గానీ, పరిశుద్ధాత్మను గురించిన వాగ్దానంగా గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δεξιᾷ τοῦ θεοῦ
  choice: దేవుని కుడివైపుకు
  rationale: ὑψωθείςతో ఉన్న దత్తి విభక్తిని ఇక్కడ స్థానార్థకంగా తీసుకోవడం సమీప సందర్భంలోని సింహాసనారోహణ భావానికి, తరువాత ఉటంకించబడే కీర్తన 110 భాషకు సరిపోతుంది; సాధనార్థక భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: οὖν
  choice: కాబట్టి
  rationale: మునుపటి పునరుత్థాన వాదన నుండి వచ్చే నిర్ధారణను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὑψωθεὶς
  choice: హెచ్చించబడి
  rationale: అపూర్వ భూతకర్మక అసమాపక క్రియ దేవుడు యేసును ఉన్నత స్థితికి చేర్చిన భావాన్ని వ్యక్తం చేస్తుంది; తెలుగు బైబిలు శైలిలో సహజమైన, గౌరవప్రదమైన పదం.
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου
  choice: వాగ్దానం చేయబడిన పరిశుద్ధాత్మను
  rationale: తరువాతి ‘దీనిని కుమ్మరించాడు’ అనే మాటను బట్టి వాగ్దానిత వరంగా ఆత్మనే స్వీకరించిన భావం సహజంగా ఉంటుంది; అయితే గ్రీకు పదబంధం ‘పరిశుద్ధాత్మను గురించిన వాగ్దానం’ అనే అర్థాన్నీ అనుమతిస్తుంది కాబట్టి దాన్ని పాదసూచికలో నిలిపాం.
- source_word: λαβὼν παρὰ τοῦ πατρὸς
  choice: తండ్రి నుండి ... పొంది
  rationale: παράతో జనిటివ్ మూలాన్ని సూచిస్తుంది; అసమాపక క్రియ ప్రధాన క్రియకు ముందున్న స్వీకరణను తెలియజేస్తుంది.
- source_word: ἐξέχεεν
  choice: కుమ్మరించాడు
  rationale: పూర్తయిన కుమ్మరింపు చర్యను, దాని ప్రత్యక్ష ఫలితాలతో కలిపి సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοῦτο ὃ ὑμεῖς βλέπετε καὶ ἀκούετε
  choice: మీరు స్వయంగా చూస్తున్నదీ వింటున్నదీ అయిన దీనిని
  rationale: τοῦτο అనే సూచనార్థక పదాన్ని విస్తరించి వ్యాఖ్యానించకుండా ‘దీనిని’గా ఉంచి, ὑμεῖςలోని ఉద్ఘాటనను ‘మీరు స్వయంగా’తో నిలిపాం; వర్తమాన క్రియలు అప్పటి ప్రత్యక్ష అనుభవాన్ని సూచిస్తాయి.
theological_decisions:
- issue: τῇ δεξιᾷ τοῦ θεοῦ అనేది దేవుని కుడివైపుకు హెచ్చించబడడమా, దేవుని కుడిచేతివల్ల హెచ్చించబడడమా?
  choice: దేవుని కుడివైపుకు హెచ్చించబడి
  alternative: దేవుని కుడిచేతివల్ల హెచ్చించబడి
  rationale: ప్రసంగ సందర్భంలోని రాజాసనారోహణ, కీర్తన 110 భావాలు స్థానార్థక పఠనానికి మద్దతిస్తాయి. అయినా గ్రీకు దత్తి విభక్తిలో సాధనార్థక పఠనం నిజమైన అవకాశమే కనుక పాదసూచికలో భద్రపరచబడింది.
- issue: τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίουలో ఆత్మనే వాగ్దానిత వరంగా సూచిస్తున్నదా, లేక ఆత్మను గురించిన వాగ్దానాన్ని సూచిస్తున్నదా?
  choice: వాగ్దానం చేయబడిన పరిశుద్ధాత్మను
  alternative: పరిశుద్ధాత్మను గురించిన వాగ్దానాన్ని
  rationale: ‘దీనిని కుమ్మరించాడు’ అనే తరువాతి వాక్యం ఆత్మనే స్వీకరించి కుమ్మరించినట్లు సందర్భపరంగా సూచిస్తుంది. అయినప్పటికీ జనిటివ్ నిర్మాణంలోని అస్పష్టతను తీర్చివేయకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘హెచ్చించబడి,’ ‘పరిశుద్ధాత్మ,’ ‘కుమ్మరించాడు’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని సాధారణ పాఠకులకు అర్థమయ్యే రీతిలో నిలిపాం; గ్రీకు మూలంలోని రెండు నిజమైన సందిగ్ధతలను పాదసూచికల్లో సంరక్షించాం.
