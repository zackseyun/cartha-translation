revisions:
- from: '“ఇశ్రాయేలు పురుషులారా, ఈ మాటలు వినండి: నజరేయుడైన యేసు—దేవుడు మీకు నిరూపించి చూపిన మనిషి. దేవుడు ఆయన ద్వారా మీ మధ్య చేసిన శక్తికార్యాలు, అద్భుతాలు, సూచకక్రియల ద్వారా ఆయనను మీకు నిరూపించి చూపాడు[a]; ఇది మీకే తెలుసు—”'
  to: '“ఇశ్రాయేలు పురుషులారా, ఈ మాటలు వినండి: నజరేయుడైన[a] యేసు—దేవుడు ఆయన ద్వారా మీ మధ్య చేసిన శక్తివంతమైన కార్యాలు,[b] అద్భుతాలు, సూచక క్రియల ద్వారా మీకు నిరూపించిన మనిషి; మీరు స్వయంగా ఎరిగినట్లుగా—”'
  rationale: The revision removes the duplicate assertion of attestation and makes the works, wonders, and signs the means by which God publicly demonstrated Jesus to the audience. It retains the explicit masculine ‘మనిషి,’ God as the actor, Jesus as the one through whom God acted, the distinct threefold list, the emphatic audience knowledge, and the verse-continuing dash.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:54:36Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the principal terms and correctly identifies God as the one acting through Jesus. However, its two-clause formulation states divine attestation twice: first, Jesus is ‘the man whom God demonstrated to you,’ and then God ‘demonstrated him to you’ again through the works. The Greek has one attestation participle, qualified by the triad of works that God did through Jesus.'
  naturalness: The address and closing appeal are generally natural, but the repeated ‘నిరూపించి చూపిన/నిరూపించి చూపాడు’ is stylistically heavy and introduces an unnecessary repetition. Recasting the verse as one continuous noun phrase better reflects both the Greek syntax and Telugu public-speech register.
  terminology: ‘ఇశ్రాయేలు పురుషులారా,’ ‘మనిషి,’ and ‘దేవుడు ఆయన ద్వారా’ are appropriate. ‘శక్తివంతమైన కార్యాలు, అద్భుతాలు, సూచక క్రియలు’ clearly preserves the threefold σειρά while using natural modern Telugu. Footnotes are supplied for both the Nazorean designation and δυνάμεις, corresponding to the audit trail.
  issues:
  - severity: high
    issue: The main text duplicates the divine attestation of Jesus.
    rationale: ‘దేవుడు మీకు నిరూపించి చూపిన మనిషి’ already translates ἄνδρα ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ εἰς ὑμᾶς. The following ‘...క్రియల ద్వారా ఆయనను మీకు నిరూపించి చూపాడు’ repeats that same assertion rather than making the works the means of the one attestation.
  - severity: medium
    issue: The Greek’s single syntactic unit is broken in a way that obscures the instrumental relationship of the miracles, wonders, and signs to the attestation.
    rationale: The triad δυνάμεσι καὶ τέρασι καὶ σημείοις qualifies ‘attested/demonstrated.’ A unified Telugu noun phrase makes this relationship explicit without adding meaning.
  - severity: low
    issue: The supplied lexical footnote is anchored at the end of the repeated attestation clause rather than at the term it explains, and the Nazorean lexical alternative is absent.
    rationale: Placing notes immediately after their relevant terms improves anchor clarity and preserves the audit trail’s two lexical alternatives.
  revised_text: '“ఇశ్రాయేలు పురుషులారా, ఈ మాటలు వినండి: నజరేయుడైన[a] యేసు—దేవుడు ఆయన ద్వారా మీ మధ్య చేసిన శక్తివంతమైన కార్యాలు,[b] అద్భుతాలు, సూచక క్రియల ద్వారా మీకు నిరూపించిన మనిషి; మీరు స్వయంగా ఎరిగినట్లుగా—”'
  revised_footnotes:
  - marker: a
    text: ‘నజరేయుడు’ అనే గ్రీకు బిరుదును ‘నజరేతువాడు’ లేదా ‘నజరేతు యేసు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘శక్తివంతమైన కార్యాలు’ అని అనువదించిన గ్రీకు పదాన్ని మరింత అక్షరార్థంగా ‘శక్తులు’ లేదా ‘మహత్కార్యాలు’ అని, సందర్భానుసారంగా ‘అద్భుతాలు’ అని కూడా అనువదించవచ్చు.
