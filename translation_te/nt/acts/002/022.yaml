id: ACT.2.22
reference: Acts 2:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἄνδρες Ἰσραηλῖται, ἀκούσατε τοὺς λόγους τούτους. Ἰησοῦν τὸν Ναζωραῖον, ἄνδρα ⸂ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ⸃ εἰς ὑμᾶς δυνάμεσι καὶ τέρασι καὶ σημείοις οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς ἐν μέσῳ ὑμῶν, ⸀καθὼς αὐτοὶ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/022.yaml
  text: 'Men of Israel[a], hear these words: Jesus the Nazarene, a man attested to you by God with miracles and wonders and signs that God did through him in your midst[b], just as you yourselves know—'
translation:
  language: te
  text: '“ఇశ్రాయేలు పురుషులారా, ఈ మాటలు వినండి: నజరేయుడైన[a] యేసు—దేవుడు ఆయన ద్వారా మీ మధ్య చేసిన శక్తివంతమైన కార్యాలు,[b] అద్భుతాలు, సూచక క్రియల ద్వారా మీకు నిరూపించిన మనిషి; మీరు స్వయంగా ఎరిగినట్లుగా—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నజరేయుడు’ అనే గ్రీకు బిరుదును ‘నజరేతువాడు’ లేదా ‘నజరేతు యేసు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘శక్తివంతమైన కార్యాలు’ అని అనువదించిన గ్రీకు పదాన్ని మరింత అక్షరార్థంగా ‘శక్తులు’ లేదా ‘మహత్కార్యాలు’ అని, సందర్భానుసారంగా ‘అద్భుతాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: ఇశ్రాయేలు పురుషులారా
  rationale: ἄνδρες అనే స్పష్టమైన పుంలింగ సంబోధనను, Ἰσραηλῖται అనే జాతి గుర్తింపును రెండింటినీ నిలుపుతుంది; ఆధునిక తెలుగులో గంభీరమైన ప్రత్యక్ష సంబోధనగా సహజంగా ఉంటుంది.
- source_word: ἀκούσατε τοὺς λόγους τούτους
  choice: ఈ మాటలు వినండి
  rationale: ఆజ్ఞార్థకమైన ἀκούσατε పిలుపును, λόγους అనే బహువచనాన్ని సరళంగా మరియు నేరుగా తెలియజేస్తుంది.
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: నజరేయుడైన యేసు
  rationale: Ναζωραῖος లోని వివరణాత్మక/బిరుదు స్వభావాన్ని నిలుపుతూ తెలుగులో సహజమైన రూపం; కేవలం భౌగోళిక వివరణగా మార్చదు.
- source_word: ἄνδρα
  choice: మనిషి
  rationale: యేసు నిజమైన మానవత్వాన్ని తెలిపే గ్రీకు పదాన్ని అస్పష్టమైన ప్రత్యామ్నాయంతో బలహీనపరచకుండా నేరుగా అనువదిస్తుంది.
- source_word: ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ εἰς ὑμᾶς
  choice: దేవుడు మీకు నిరూపించి చూపిన
  rationale: ἀποδείκνυμι లోని బహిరంగంగా చూపడం లేదా ధ్రువీకరించడం అనే భావాన్ని, దేవుడే క్రియాశీల కర్త అనే నిర్మాణాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: δυνάμεσι καὶ τέρασι καὶ σημείοις
  choice: శక్తికార్యాలు, అద్భుతాలు, సూచకక్రియలు
  rationale: మూడు వేర్వేరు పదాల శ్రేణిని నిలుపుతుంది. δυνάμεις ను కేవలం సాధారణ ‘అద్భుతాలు’గా కలిపివేయకుండా దైవశక్తి ప్రదర్శనల భావాన్ని ‘శక్తికార్యాలు’ తెలియజేస్తుంది.
- source_word: οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς
  choice: దేవుడు ఆయన ద్వారా ... చేసిన
  rationale: గ్రీకులో దేవుడే క్రియకు కర్త, యేసు δι’ αὐτοῦ ద్వారా మధ్యవర్తి అని ఉన్న వ్యాకరణ నిర్మాణాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: ἐν μέσῳ ὑμῶν
  choice: మీ మధ్య
  rationale: ఈ గ్రీకు నుడికారానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: καθὼς αὐτοὶ οἴδατε
  choice: ఇది మీకే తెలుసు
  rationale: αὐτοὶ లోని నొక్కిచెప్పే భావాన్ని ‘మీకే’ ద్వారా సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ἄνδρα లోని క్రీస్తు మానవత్వానికి సంబంధించిన పదప్రయోగం
  choice: ‘మనిషి’ అనే పదాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘వ్యక్తి’ లేదా సర్వనామంతో దాన్ని అస్పష్టం చేయడం
  rationale: గ్రీకు పాఠ్యం యేసును స్పష్టంగా ἄνδρα అని పిలుస్తుంది. దీన్ని నిలుపడం వచనంలోని మానవత్వ ప్రకటనను కాపాడుతుంది; అదే సమయంలో ఈ ఒక్క వాక్యానికి మించిన క్రీస్తుశాస్త్ర నిర్ణయాన్ని జోడించదు.
- issue: అద్భుత కార్యాల్లో దేవుడు మరియు యేసు యొక్క పాత్ర
  choice: ‘దేవుడు ఆయన ద్వారా ... చేసిన’ అని దేవుణ్ణి కర్తగా, యేసును మధ్యవర్తిగా చూపడం
  alternative: ‘యేసు చేసిన’ అని మాత్రమే చెప్పడం లేదా కర్తను అస్పష్టం చేయడం
  rationale: ὁ θεὸς వ్యాకరణపరంగా కర్త; δι’ αὐτοῦ యేసు ద్వారా జరిగిన కార్యాన్ని సూచిస్తుంది. విస్తృత నూతన నిబంధన క్రీస్తుశాస్త్రంతో సమన్వయం చేయాలనే ఉద్దేశంతో ఈ వచనంలోని ప్రత్యేక ఉద్వేగాన్ని సవరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన బహిరంగ ప్రసంగ శైలిని ఉపయోగించాం. దీర్ఘమైన గ్రీకు వాక్య నిర్మాణాన్ని పఠనసౌలభ్యం కోసం రెండు భాగాలుగా వ్యక్తం చేసినా, దేవుని ధ్రువీకరణ, మూడు కార్యపదాలు, దేవుని కర్తృత్వం, శ్రోతల స్వీయజ్ఞానం అన్న అంశాలను నిలిపాం. వాక్యం తదుపరి వచనానికి కొనసాగుతుందని చివర దీర్ఘ డాష్ సూచిస్తుంది.
