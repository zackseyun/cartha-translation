id: ACT.2.18
reference: Acts 2:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καί γε ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου ἐν ταῖς ἡμέραις ἐκείναις ἐκχεῶ ἀπὸ τοῦ πνεύματός μου, καὶ προφητεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/018.yaml
  text: Even on my male servants and my female servants in those days I will pour out from my Spirit[b][a], and they will prophesy.
translation:
  language: te
  text: ఆ రోజుల్లో నా దాసుల మీదా నా దాసీల మీదా కూడా నా ఆత్మ నుండి కుమ్మరిస్తాను[a]; వారు ప్రవచిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా ఆత్మను కుమ్మరిస్తాను.” గ్రీకులో అక్షరార్థంగా “నా ఆత్మ నుండి” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καί γε
  choice: కూడా
  rationale: ముందటి వాక్యానికి కొనసాగింపుగా, తక్కువ సామాజిక స్థితిలో ఉన్న దాసదాసీలకు సైతం ఆత్మ అనుగ్రహించబడుతుందనే ఉద్ఘాటనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου
  choice: నా దాసుల మీద, నా దాసీల మీద
  rationale: దాసులు/దాసీలు అనే జత గ్రీకులోని పుంలింగ-స్త్రీలింగ భేదాన్నీ, బంధితమైన తక్కువ సామాజిక స్థితినీ నిలుపుతుంది.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: ఆ రోజుల్లో
  rationale: కాలసూచక పదబంధాన్ని సహజంగా, నిర్దిష్ట సూచనతో అందిస్తుంది.
- source_word: ἐκχεῶ
  choice: కుమ్మరిస్తాను
  rationale: సమృద్ధిగా ధారపోయడం అనే మూల రూపకాన్ని నిలుపుతుంది.
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: నా ఆత్మ నుండి
  rationale: ἀπό అనే ‘నుండి’ భావాన్ని స్పష్టంగా నిలుపుతూ, మూలంలోని భాగసూచక లేదా మూలస్థాన నుడికారాన్ని ముందుగానే పరిష్కరించదు.
- source_word: προφητεύσουσιν
  choice: వారు ప్రవచిస్తారు
  rationale: ప్రవచించడం అనే క్రియ యొక్క ప్రత్యక్ష భవిష్యత్ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: δοῦλος/δούλη పదాల సామాజిక భావం
  choice: దాసులు / దాసీలు
  alternative: సేవకులు / సేవికలు
  rationale: ఈ సందర్భంలో పురుష, స్త్రీ దాసులను ప్రత్యేకంగా పేర్కొనడం ద్వారా తక్కువ సామాజిక స్థితివారికీ దేవుని ఆత్మ అనుగ్రహించబడుతుందనే ఆశ్చర్యకర విస్తృతిని వాక్యం నొక్కిచెబుతుంది; ‘దాసులు/దాసీలు’ ఆ బలాన్ని మెరుగుగా నిలుపుతుంది.
- issue: ἀπὸ τοῦ πνεύματός μου లోని ἀπό
  choice: నా ఆత్మ నుండి
  alternative: నా ఆత్మను
  rationale: ‘నుండి’ అని అనువదించడం గ్రీకు విభక్తి సంబంధాన్ని ప్రత్యక్షంగా ఉంచుతుంది; ‘నా ఆత్మను’ అనేది సహజమైన ప్రత్యామ్నాయం అయినా ἀπόను స్పష్టంగా ప్రతిబింబించదు.
- issue: καί γε యొక్క ఉద్ఘాటన స్థానం
  choice: దాసీల మీద కూడా
  alternative: నిజంగా, నా దాసుల మీదను నా దాసీల మీదను
  rationale: తెలుగులో ‘కూడా’ ద్వారా దాసదాసీలను చేర్చే ఉద్ఘాటన సహజంగా వ్యక్తమవుతుంది; ఇది కేవలం స్త్రీలకు మాత్రమే వర్తిస్తుందనే భావం రాకుండా మొత్తం జతకు సందర్భానుసారంగా అన్వయిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, బహిరంగ పఠనానికి అనువైన శైలి. ‘దాసులు/దాసీలు’ సామాజిక స్థితి మరియు లింగ భేదాన్ని నిలుపుతుంది. వాక్యక్రమం తెలుగులో సహజంగా ఉండేలా కాలసూచనను ముందుంచింది.
