- from: అందరూ ఆశ్చర్యపడి అయోమయంలో ఉండి, ఒకరితో ఒకరు, “దీని అర్థం ఏమిటి?[a]” అని చెప్పుకుంటున్నారు.
  to: వారందరూ ఆశ్చర్యపోయి అయోమయానికి గురయ్యారు; ఒకరితో ఒకరు, “దీని అర్థం ఏమిటి?[a]” అని చెప్పుకున్నారు.
  rationale: The revision preserves the Greek’s paired, ongoing past reactions and its reciprocal exchange in natural modern Telugu. The question remains an idiomatic inquiry about the event’s meaning; the footnote retains the formally closer alternative while clearly identifying its idiomatic force.
