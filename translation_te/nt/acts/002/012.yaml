source:
  edition: SBLGNT
  text: ἐξίσταντο δὲ πάντες καὶ ⸀διηπόρουν, ἄλλος πρὸς ἄλλον λέγοντες· Τί ⸀θέλει τοῦτο εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/012.yaml
  text: And they all were amazed and perplexed[a], saying to one another, “What does this mean?”
translation:
  language: te
  text: వారందరూ ఆశ్చర్యపోయి అయోమయానికి గురయ్యారు; ఒకరితో ఒకరు, “దీని అర్థం ఏమిటి?[a]” అని చెప్పుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: “ఇది ఏమై ఉండాలని కోరుకుంటోంది?” ఇది “దీని అర్థం ఏమిటి?” లేదా “దీని ప్రాముఖ్యత ఏమిటి?” అనే భావాన్ని తెలిపే నుడికారం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: ఆశ్చర్యపడి
  rationale: ఈ క్రియ ఇక్కడ వారిలో కొనసాగుతున్న తీవ్ర ఆశ్చర్యస్థితిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఆశ్చర్యపడి’ సహజంగా ఉండి, సందర్భానికి తగిన బలాన్ని ఇస్తుంది.
- source_word: δὲ
  choice: అందరూ…
  rationale: δέ ఇక్కడ బలమైన వ్యతిరేకతను కాక కథనాన్ని ముందుకు నడిపే మృదు అనుసంధానాన్ని సూచిస్తుంది. తెలుగులో ప్రత్యేక సంధిపదం లేకుండానే వాక్యప్రవాహంలో ఇది సహజంగా వ్యక్తమవుతుంది.
- source_word: πάντες
  choice: అందరూ
  rationale: సమూహంలోని వారందరినీ కలుపుకునే గ్రీకు పదంలోని సమగ్ర భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: διηπόρουν
  choice: అయోమయంలో ఉండి
  rationale: ఏమి తేల్చుకోలేని గందరగోళం లేదా కలవరాన్ని ఈ క్రియ తెలియజేస్తుంది. అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న స్థితిని ‘ఉండి’ ప్రతిబింబిస్తుంది.
- source_word: ἄλλος πρὸς ἄλλον
  choice: ఒకరితో ఒకరు
  rationale: పరస్పర సంభాషణను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: λέγοντες
  choice: అని చెప్పుకుంటున్నారు
  rationale: పరస్పరం పలుకుతున్న చర్యను సందర్భానుగుణంగా తెలియజేస్తుంది; గ్రీకు వర్తమాన కృదంతంలోని సమకాలీన చర్యను సహజ తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: Τί θέλει τοῦτο εἶναι;
  choice: దీని అర్థం ఏమిటి?
  rationale: పదశః ‘ఇది ఏమై ఉండాలని కోరుతోంది?’ అనే రూపం ఇక్కడ ఒక నుడికారంగా సంఘటన యొక్క అర్థం లేదా ప్రాముఖ్యతను అడుగుతుంది. ‘దీని అర్థం ఏమిటి?’ ఆ భావాన్ని సహజంగా, అతివ్యాఖ్యానం లేకుండా అందిస్తుంది.
