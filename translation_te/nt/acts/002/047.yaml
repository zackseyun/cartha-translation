  text: αἰνοῦντες τὸν θεὸν καὶ ἔχοντες χάριν πρὸς ὅλον τὸν λαόν. ὁ δὲ κύριος προσετίθει τοὺς σῳζομένους καθ’ ἡμέραν ⸂ἐπὶ τὸ αὐτό⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/047.yaml
  text: praising God and having favor with all the people[a]. And the Lord was adding day by day those who were being saved to them.
translation:
  language: te
  text: వారు దేవుణ్ణి స్తుతిస్తూ, ప్రజలందరి ఆదరణ పొందుతూ ఉండేవారు. ప్రభువు రక్షించబడుతున్నవారిని రోజురోజుకూ వారి సమూహానికి[a] చేర్చుతూ ఉండేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కలిసి” లేక “ఒకే చోట.” గ్రీకు పదబంధం ἐπὶ τὸ αὐτόకు ఈ అర్థాలు కూడా రావచ్చు. కొన్ని గ్రీకు ప్రతుల్లో ఈ పదబంధం లేకపోవడం వల్ల, దీని చేర్పు కూడా అనిశ్చితమైనది.
    reason: alternative_reading
lexical_decisions:
- source_word: αἰνοῦντες τὸν θεόν
  choice: దేవుణ్ణి స్తుతిస్తూ
  rationale: వర్తమాన కృదంతం సంఘం నిరంతరం చేస్తున్న కార్యాన్ని సూచిస్తుంది; ‘స్తుతిస్తూ’ సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ἔχοντες χάριν πρὸς ὅλον τὸν λαόν
  choice: ప్రజలందరి ఆదరణ పొందుతూ
  rationale: ఈ ప్రయోగం సాధారణంగా ప్రజల అనుగ్రహం లేదా సద్భావం వారికి లభించిందనే భావాన్ని ఇస్తుంది; వారు ప్రజల పట్ల అనుగ్రహం చూపారనే అర్థాన్ని మోపదు.
- source_word: ὁ δὲ κύριος
  choice: ప్రభువు
  rationale: κύριοςకు సందర్భానుగుణమైన ప్రమాణ తెలుగు పదం; δέను ప్రత్యేక సంధాన పదంతో భారంగా చేయకుండా వాక్యప్రవాహంలో వ్యక్తం చేశాం.
- source_word: προσετίθει
  choice: చేర్చుతూ ఉండేవాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ పునరావృతమవుతూ సాగిన చర్యను సూచిస్తుంది; ఈ తెలుగు క్రియారూపం ఆ కొనసాగింపు భావాన్ని నిలుపుతుంది.
- source_word: τοὺς σῳζομένους
  choice: రక్షించబడుతున్నవారిని
  rationale: వర్తమాన కర్మణి కృదంతంలోని కొనసాగుతున్న ప్రక్రియ భావాన్ని నిలుపుతుంది; దాన్ని పూర్తయిన స్థితిగా మార్చదు.
- source_word: καθ’ ἡμέραν
  choice: రోజురోజుకూ
  rationale: ప్రతి రోజూ వరుసగా జరుగుతున్న చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ τὸ αὐτό
  choice: వారి సమూహానికి
  rationale: προσετίθειతో కలిసి ఉన్న సందర్భంలో ఇప్పటికే ఉన్న విశ్వాసుల సమూహానికి చేర్చడం అనేది సంభావ్య భావం. మూలపదబంధంలోని ఇతర నిజమైన అవకాశాలను పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: τοὺς σῳζομένουςలో రక్షణ యొక్క క్రియాంశం
  choice: రక్షించబడుతున్నవారిని
  alternative: రక్షించబడినవారిని; రక్షణ పొందినవారిని
  rationale: గ్రీకు వర్తమాన కర్మణి కృదంతం రక్షణను ఇక్కడ కొనసాగుతున్న దైవిక చర్యగా చూపిస్తుంది. విస్తృతమైన రక్షణ సిద్ధాంత వివాదాలను తేల్చకుండా ఆ వ్యాకరణ ఉద్వేగాన్ని అనువాదం నిలుపుతుంది.
- issue: ἐπὶ τὸ αὐτό యొక్క సంబంధం మరియు భావం
  choice: వారి సమూహానికి
  alternative: కలిసి; ఒకే చోట
  rationale: ‘చేర్చుతూ ఉండేవాడు’ అనే క్రియతో ఈ సందర్భంలో సమూహానికి చేర్చడం అత్యంత సహజమైన భావం. అయితే గ్రీకు పదబంధం ‘కలిసి’ లేదా ‘ఒకే చోట’ అని కూడా అర్థమివ్వగలదు కాబట్టి ఆ సందిగ్ధతను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగులో సామాన్య పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలి. కొనసాగుతున్న చర్యలను ‘స్తుతిస్తూ,’ ‘పొందుతూ,’ ‘చేర్చుతూ ఉండేవాడు’ అనే సహజ రూపాలతో వ్యక్తం చేశాం; మూలంలోని నిజమైన సందిగ్ధతను పాదసూచికలో ఉంచాం.
