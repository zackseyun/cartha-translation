source:
  edition: SBLGNT
  text: ⸀Ἐγίνετο δὲ πάσῃ ψυχῇ φόβος, πολλά ⸀τε τέρατα καὶ σημεῖα διὰ τῶν ἀποστόλων ἐγίνετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/043.yaml
  text: And fear came upon every soul[a], and many wonders and signs were being done through the apostles.
translation:
  language: te
  text: ప్రతి ఒక్కరిలోనూ భయం కలిగింది[a]. అపొస్తలుల ద్వారా అనేక అద్భుతాలు, సూచకాలు జరుగుతూ ఉండేవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతి ఒక్కరిలోనూ భయభక్తితో కూడిన విస్మయం కలిగింది.” గ్రీకు వాక్యం అక్షరార్థంగా, “ప్రతి ప్రాణికి భయం కలిగింది” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγίνετο ... φόβος
  choice: భయం కలిగింది
  rationale: γίνομαι యొక్క అసంపూర్ణ భూతకాల రూపం ఇక్కడ భయం ఉద్భవించి వ్యాపించిన భావాన్ని ఇస్తుంది. సహజమైన తెలుగులో ‘భయం కలిగింది’ ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక కథన కొనసాగింపును సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో దాన్ని విడిగా చూపకపోవడం సహజం.
- source_word: πάσῃ ψυχῇ
  choice: ప్రతి ఒక్కరిలోనూ
  rationale: అక్షరార్థంగా ‘ప్రతి ప్రాణికి/ఆత్మకు.’ సందర్భంలో ఇది ప్రతి వ్యక్తిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ప్రతి ఒక్కరిలోనూ’ సహజంగా ఉండి సమగ్రతను నిలుపుతుంది.
- source_word: φόβος
  choice: భయం
  rationale: φόβος భయాన్నీ విస్మయభరిత భయభక్తినీ సూచించగలదు. ‘భయం’ మూలపద బలాన్ని, దానిలోని ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
- source_word: πολλά
  choice: అనేక
  rationale: పరిమాణాన్ని సహజంగా, గౌరవప్రదమైన శైలిలో తెలియజేస్తుంది.
- source_word: τέρατα
  choice: అద్భుత కార్యాలు
  rationale: τέρατα కార్యాల ఆశ్చర్యకర స్వభావాన్ని ముందుకు తెస్తుంది. ‘అద్భుతాలు’ అన్నది సాధ్యమే అయినా, ‘అద్భుత కార్యాలు’ σημεῖα నుండి భేదాన్ని మరింత స్పష్టంగా ఉంచుతుంది.
- source_word: σημεῖα
  choice: సూచక క్రియలు
  rationale: σημεῖα కార్యాల సూచనాత్మక లేదా సాక్ష్యాత్మక విధిని తెలియజేస్తుంది; ‘సూచక క్రియలు’ ఆ భావాన్ని కేవలం ‘సూచనలు’ కంటే స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: διὰ τῶν ἀποστόλων
  choice: అపొస్తలుల ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సాధనత్వం లేదా మధ్యవర్తి కార్యసాధకత్వాన్ని సూచిస్తుంది. ‘ద్వారా’ అపొస్తలులను సాధనాలుగా చూపుతూ, అంతిమ కర్తను నిర్దిష్టంగా చేర్చదు.
- source_word: ἐγίνετο
  choice: జరుగుతూ ఉండేవి
  rationale: అసంపూర్ణ భూతకాలం పునరావృతంగా లేదా కొనసాగుతూ జరిగిన కార్యాలను సూచిస్తుంది; ‘జరుగుతూ ఉండేవి’ ఆ కాలదృష్టిని సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: అపొస్తలుల ద్వారా జరిగిన సూచక కార్యాలకు ప్రతిస్పందనగా φόβος యొక్క భావం
  choice: భయం
  alternative: విస్మయం; భయభక్తి
  rationale: ‘భయం’ నేరమైన పదసామ్యాన్ని నిలుపుతూ, అది దిగులుతో కూడిన భయమా, దేవుని కార్యం ఎదుట కలిగిన విస్మయభరిత భయభక్తా అనే ఉద్వేగాన్ని అనువాదం స్వయంగా పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘భయం’ అనే నేరమైన పదాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ‘విస్మయం’ అనే సందర్భసాధ్య భావాన్ని పాదటిప్పణిలో ఇచ్చాం. ‘అద్భుత కార్యాలు, సూచక క్రియలు’ అనే జంట τέρατα καὶ σημεῖα మధ్య భావభేదాన్ని కాపాడుతుంది.
