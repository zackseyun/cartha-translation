id: ACT.2.19
reference: Acts 2:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ δώσω τέρατα ἐν τῷ οὐρανῷ ἄνω καὶ σημεῖα ἐπὶ τῆς γῆς κάτω, αἷμα καὶ πῦρ καὶ ἀτμίδα καπνοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/019.yaml
  text: 'And I will give wonders in the heaven above and signs on the earth below: blood and fire and a cloud of smoke.'
translation:
  language: te
  text: 'నేను పైనున్న ఆకాశంలో అద్భుతాలను, కిందనున్న భూమిమీద సూచకాలను ఇస్తాను: రక్తం, అగ్ని, పొగ ఆవిరి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పొగమేఘం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δώσω
  choice: కలుగజేస్తాను
  rationale: అక్షరార్థమైన ‘ఇస్తాను’ ఈ సందర్భంలో తెలుగులో అసహజంగా ఉంటుంది. దేవుడు ఈ అద్భుతాలు, సూచనలు సంభవించేలా చేస్తాడనే గ్రీకు క్రియ భావాన్ని ‘కలుగజేస్తాను’ సహజంగా తెలియజేస్తుంది; దాన్ని కేవలం ‘చూపిస్తాను’గా పరిమితం చేయదు.
- source_word: τέρατα
  choice: అద్భుతాలు
  rationale: విస్మయం కలిగించే అసాధారణ దృశ్యాలను సూచిస్తుంది. ‘అద్భుతాలు’ సమకాలీన తెలుగులో సహజంగా ఉండి, ఇక్కడి విశ్వసంబంధ ప్రవచన చిత్రణను కేవలం స్వస్థతలకో అద్భుత కార్యాలకో పరిమితం చేయదు.
- source_word: ἐν τῷ οὐρανῷ ἄνω
  choice: పైన ఆకాశంలో
  rationale: οὐρανόςకు ‘ఆకాశం’ లేదా ‘పరలోకం’ అనే భావాలు ఉండవచ్చు. కిందనున్న భూమితో ఉన్న దృశ్య వ్యత్యాసంలో ‘పైన ఆకాశంలో’ సహజంగా ఉండి మూలంలోని స్థల జతను నిలుపుతుంది.
- source_word: σημεῖα
  choice: సూచనలు
  rationale: ఇవి కేవలం విచిత్ర సంఘటనలు కాక, ఏదో విషయాన్ని సూచించే అర్థవంతమైన గుర్తులు. ‘సూచనలు’ ఆ భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐπὶ τῆς γῆς κάτω
  choice: కింద భూమిమీద
  rationale: పైన ఆకాశం అనే పదబంధానికి సమాంతరంగా విశ్వవ్యాప్త భూమి భావాన్ని నిలుపుతుంది.
- source_word: αἷμα
  choice: రక్తం
  rationale: ప్రవచనంలోని స్పష్టమైన, దృశ్యమైన చిత్రణను నేరుగా నిలుపుతుంది.
- source_word: πῦρ
  choice: అగ్ని
  rationale: మూలంలోని గంభీరమైన ప్రవచన శైలికి సరిపోయే ప్రత్యక్ష సమానార్థకం.
- source_word: ἀτμίδα καπνοῦ
  choice: పొగమేఘం
  rationale: ἀτμίς ఆవిరి, పొగమంచు, లేదా గాలిలో కనిపించే మేఘంలాంటి దట్టతను సూచించగలదు. ‘పొగమేఘం’ తెలుగులో సహజంగా దృశ్యాన్ని అందిస్తుంది; మరింత అక్షరార్థమైన రూపం పాదటిప్పణిలో ఇవ్వబడింది.
theological_decisions:
- issue: యోవేలు ప్రవచన ఉల్లేఖనంలోని విశ్వసంబంధ స్థలాల అనువాదం
  choice: పైన ఆకాశంలో ... కింద భూమిమీద
  alternative: పైన పరలోకంలో ... కింద నేలమీద
  rationale: ఈ వాక్యం ఆకాశం–భూమి అనే విశ్వవ్యాప్త వ్యత్యాసంలో ప్రవచన సూచనలను వర్ణిస్తుంది. ‘పరలోకం’ అనడం చిత్రణను దేవుని నివాసానికి పరిమితం చేయవచ్చు; ‘నేల’ అనడం దాని విస్తృతిని స్థానికంగా వినిపించవచ్చు. ఎటువంటి సిద్ధాంతపరమైన వివరణను చొప్పించకుండా ‘ఆకాశం ... భూమి’ మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యే గంభీరమైన ప్రవచన శైలి వాడబడింది. ‘కలుగజేస్తాను’ తెలుగు సహజత్వం కోసం ఎంచుకోగా, గ్రీకులోని ‘ఇస్తాను’ అనే క్రియాశక్తిని కార్యసాధక భావంలో నిలిపింది. ఎమ్ డాష్ తరువాతి మూడు అంశాలు ముందున్న అద్భుతాలు, సూచనల వివరణగా చదవడానికి సహాయపడుతుంది.
