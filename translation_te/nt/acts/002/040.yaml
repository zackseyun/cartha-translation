source:
  edition: SBLGNT
  text: ἑτέροις τε λόγοις πλείοσιν διεμαρτύρατο, καὶ παρεκάλει ⸀αὐτοὺς λέγων· Σώθητε ἀπὸ τῆς γενεᾶς τῆς σκολιᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/040.yaml
  text: And with many other words he solemnly testified and kept urging them[a], saying, “Be saved from this crooked generation.”
translation:
  language: te
  text: ఇతర అనేక మాటలతో అతడు గంభీరంగా సాక్ష్యమిచ్చాడు; “ఈ వంకరైన తరం నుండి రక్షించబడండి” అని చెబుతూ వారిని పదేపదే కోరాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ వంకరైన తరం నుండి మిమ్మల్ని మీరు రక్షించుకోండి.” గ్రీకు క్రియ కర్మణి రూపంలో (“రక్షించబడండి”) ఉంది; అయితే శ్రోతలు స్పందించవలసిన అవసరాన్ని వ్యక్తం చేయడానికి కొన్ని అనువాదాలు దానిని మరింత క్రియాశీలకంగా అనువదిస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: ἑτέροις τε λόγοις πλείοσιν
  choice: ఇంకా అనేక ఇతర మాటలతో
  rationale: ἑτέροις (‘ఇతర’) మరియు πλείοσιν (‘అనేక/మరిన్ని’) అనే రెండు భావాలనూ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; దత్తివిభక్తి ఇక్కడ సాధన లేదా విధాన భావాన్ని ఇస్తుంది.
- source_word: διεμαρτύρατο
  choice: గంభీరంగా సాక్ష్యమిచ్చి
  rationale: διαμαρτύρομαι లోని బలమైన, గంభీరమైన సాక్ష్యప్రకటన భావాన్ని నిలుపుతుంది; దానిని కేవలం హెచ్చరికగా పరిమితం చేయదు.
- source_word: παρεκάλει
  choice: పదేపదే ప్రోత్సహించాడు
  rationale: అసంపూర్ణ భూతకాల రూపం సూచించే కొనసాగిన లేదా పునరావృతమైన విజ్ఞప్తిని ‘పదేపదే’ తెలియజేస్తుంది; ‘ప్రోత్సహించాడు’ సందర్భంలోని బలమైన పిలుపును సహజ తెలుగులో అందిస్తుంది.
- source_word: αὐτοὺς
  choice: వారిని
  rationale: పేతురు మాటలు వింటున్నవారిని సూచించే ప్రత్యక్ష కర్మను సహజంగా అనువదిస్తుంది.
- source_word: Σώθητε
  choice: రక్షించబడండి
  rationale: σῴζω యొక్క ఆజ్ఞార్థక కర్మణి రూపాన్ని కాపాడుతుంది. శ్రోతలు స్పందించాలనే పిలుపు ఉన్నప్పటికీ, తమను తామే రక్షించుకుంటారనే భావాన్ని అధికంగా చేర్చదు.
- source_word: ἀπὸ
  choice: నుండి
  rationale: వేరుపడటం లేదా విడిపించబడటం అనే సాధారణ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: γενεᾶς
  choice: తరం
  rationale: γενεά యొక్క ప్రాథమిక భావమైన సమకాలీన తరాన్ని నిలుపుతూ, బైబిలు వాడుకకు అనుగుణంగా ఉంటుంది.
- source_word: σκολιᾶς
  choice: వంకర
  rationale: σκολιός లోని నైతిక రూపకాన్ని నేరుగా, స్పష్టంగా నిలుపుతుంది; ‘దుర్మార్గమైన’ వంటి వివరణాత్మక పదంతో రూపకాన్ని చెరపదు.
theological_decisions:
- issue: Σώθητε లో కర్మణి ప్రయోగం మరియు కర్తృత్వం
  choice: రక్షించబడండి
  alternative: ఈ వంకర తరం నుండి మిమ్మల్ని మీరు రక్షించుకోండి
  rationale: గ్రీకు క్రియ కర్మణి రూపంలో ఉంది. అందువల్ల దేవుని రక్షణకార్యాన్ని గానీ మానవ స్పందనను గానీ ఏకపక్షంగా పరిష్కరించకుండా, ఆజ్ఞలోని నిజమైన పిలుపుతో పాటు కర్మణి రూపాన్నీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘గంభీరంగా సాక్ష్యమిచ్చి’ మూలంలోని అధికారిక సాక్ష్యభావాన్ని, ‘పదేపదే’ అసంపూర్ణ భూతకాలంలోని కొనసాగింపు భావాన్ని నిలుపుతాయి. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత ప్రత్యామ్నాయ అనువాద పాదటిప్పణితో సరిపోలుతుంది.
