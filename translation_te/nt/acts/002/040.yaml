- from: ఇంకా అనేక ఇతర మాటలతో అతడు గంభీరంగా సాక్ష్యమిచ్చి, “ఈ వంకర తరం నుండి రక్షించబడండి” అని చెబుతూ వారిని పదేపదే ప్రోత్సహించాడు.[a]
  to: ఇతర అనేక మాటలతో అతడు గంభీరంగా సాక్ష్యమిచ్చాడు; “ఈ వంకరైన తరం నుండి రక్షించబడండి” అని చెబుతూ వారిని పదేపదే కోరాడు.[a]
