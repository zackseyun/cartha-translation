source:
  edition: SBLGNT
  text: Δαυὶδ γὰρ λέγει εἰς αὐτόν· Προορώμην τὸν κύριον ἐνώπιόν μου διὰ παντός, ὅτι ἐκ δεξιῶν μού ἐστιν ἵνα μὴ σαλευθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/025.yaml
  text: For David says concerning him, ‘I kept seeing the Lord before me continually, because he is at my right hand, so that I may not be shaken.’
translation:
  language: te
  text: 'ఎందుకంటే దావీదు ఆయనను గురించి ఇలా చెబుతున్నాడు: “నేను ఎల్లప్పుడూ ప్రభువును నా ఎదుట చూస్తూ ఉండేవాడిని[a]. ఆయన నా కుడిపక్కన ఉన్నందున నేను కదిలిపోను.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ప్రభువును ఎల్లప్పుడూ నా ఎదుట ముందుగానే చూశాను.” గ్రీకు క్రియకు కొన్ని సందర్భాల్లో “ముందుగా చూడడం” అనే అర్థం ఉండవచ్చు; అయితే ఇక్కడి చుట్టుపక్కల మాటలు ప్రభువును నిరంతరం తన ఎదుట ఉంచుకొని చూడడమనే అర్థానికి అనుకూలంగా ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: పేతురు కీర్తన 16:8ను ఉటంకిస్తున్నాడు. హీబ్రూ మూలంలో ఇక్కడ దేవుని ప్రత్యేక నామం ఉంది.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει εἰς αὐτόν
  choice: ఆయనను గురించి ఇలా అంటున్నాడు
  rationale: ఇక్కడ εἰς αὐτόν ప్రత్యక్షంగా ఆయనతో మాట్లాడడాన్ని కాక, ఆయనను గురించి చెప్పడాన్ని సూచించే ఉల్లేఖన పరిచయ ప్రయోగం.
- source_word: Προορώμην
  choice: చూస్తూ ఉన్నాను
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా అలవాటైన చర్యను సూచిస్తుంది. διὰ παντόςతో కలిసి ఇది ముందుగా ఊహించడంకన్నా నిరంతరం ఎదుట ఉంచుకొని చూడడాన్ని సూచిస్తుంది.
- source_word: τὸν κύριον
  choice: ప్రభువును
  rationale: గ్రీకు κύριονను దాని సహజమైన బిరుదుతో అనువదిస్తూ, ఉల్లేఖనంలోని వ్యక్తిని వ్యాఖ్యానాత్మకంగా మరింత నిర్దిష్టం చేయలేదు.
- source_word: ἐνώπιόν μου διὰ παντός
  choice: ఎల్లప్పుడూ నా ఎదుట
  rationale: కాల నిరంతరత్వాన్నీ, కీర్తనలోని ‘ఎదుట’ అనే సంబంధాత్మక దృశ్యాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐκ δεξιῶν μού
  choice: నా కుడిపక్కన
  rationale: ఇది ఒకరి కుడివైపున ఉండడాన్ని, సందర్భంలో తోడ్పాటు మరియు స్థిరత్వాన్ని సూచించే సహజ తెలుగు ప్రయోగం.
- source_word: ἵνα μὴ σαλευθῶ
  choice: నేను కదిలిపోకుండా ఉండేలా
  rationale: ἵναతోని సంభావ్యార్థక క్రియలో ఉన్న ఉద్దేశం లేదా ఫలిత సంబంధాన్ని నిలుపుతూ, స్థిరత్వం కోల్పోవడమనే రూపకాన్ని అతిగా వివరించదు.
theological_decisions:
- issue: కీర్తన ఉల్లేఖనంలో ‘ప్రభువు’ అనే పదానికి సూచిత వ్యక్తి
  choice: ప్రభువు
  alternative: యెహోవా; మెస్సీయ
  rationale: పేతురు ఈ కీర్తనను క్రీస్తుకు అన్వయిస్తున్నప్పటికీ, గ్రీకు ఉల్లేఖనం κύριον అని మాత్రమే చెబుతుంది. అందువల్ల అనువాదంలో సూచిత వ్యక్తిని అదనంగా నిర్ధారించకుండా వాక్యంలోని ధార్మిక ఉద్వేగాన్ని నిలిపాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘చూస్తూ ఉన్నాను’ అనే రూపం గ్రీకు అసంపూర్ణ భూతకాలంలోని కొనసాగింపు భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ‘నా కుడిపక్కన’ సాధారణ పాఠకులకు ‘నా కుడిచేతివైపున’ కంటే సహజంగా ఉంటుంది.
