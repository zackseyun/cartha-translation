revisions:
- from: 'ఎందుకంటే దావీదు ఆయనను గురించి ఇలా అంటున్నాడు: “ప్రభువును ఎల్లప్పుడూ నా ఎదుట చూస్తూ ఉన్నాను[a]. నేను కదిలిపోకుండా ఉండేలా ఆయన నా కుడిపక్కన ఉన్నాడు.”[b]'
  to: 'ఎందుకంటే దావీదు ఆయనను గురించి ఇలా చెబుతున్నాడు: “నేను ఎల్లప్పుడూ ప్రభువును నా ఎదుట చూస్తూ ఉండేవాడిని[a]. ఆయన నా కుడిపక్కన ఉన్నందున నేను కదిలిపోను.”[b]'
  rationale: The revision changes the first-person verb to a natural Telugu past habitual form, reflecting the Greek imperfect. It also recasts the final clause into idiomatic Telugu while preserving the source's right-hand support imagery and its purpose/result sense. Footnote a is adjusted to match the first-person wording of the revised translation; footnote b remains accurate and properly anchored.
