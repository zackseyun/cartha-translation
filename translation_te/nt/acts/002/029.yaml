- from: 'సోదరులారా,[a] పితామహుడైన దావీదు గురించి నేను మీతో ధైర్యంగా మాట్లాడవచ్చు: అతడు చనిపోయి సమాధి చేయబడ్డాడు; అతని సమాధి నేటివరకు మన మధ్యనే ఉంది.'
  to: 'సోదరులారా,[a] కులపతియైన దావీదు గురించి మీతో నిర్భయంగా చెప్పడానికి నాకు స్వేచ్ఛ ఉంది: అతడు చనిపోయి సమాధి చేయబడ్డాడు; అతని సమాధి నేటివరకు మన మధ్య ఉంది.'
