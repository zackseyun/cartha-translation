review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys David's death, burial, and the continued presence of his tomb. However, ‘పితామహుడు’ normally means ‘grandfather’ in modern Telugu and is too narrow for πατριάρχης (‘patriarch/clan ancestor’). Also, ‘మాట్లాడవచ్చు’ can be heard primarily as ability rather than the freedom or entitlement expressed by ἐξόν εἰπεῖν.
  naturalness: The sentence is clear and suitably formal. ‘కులపతియైన’ is a more accurate established biblical-register equivalent for ‘patriarch,’ while ‘నిర్భయంగా చెప్పడానికి నాకు స్వేచ్ఛ ఉంది’ naturally expresses frank authorized speech.
  terminology: Use ‘కులపతియైన దావీదు’ for πατριάρχης. Retain ‘సమాధి’ for μνῆμα. The footnote appropriately records the double masculine vocative without expanding it into an inclusive expression absent from the Greek.
  issues:
  - severity: medium
    issue: ‘పితామహుడైన దావీదు’ for τοῦ πατριάρχου Δαυίδ
    rationale: In contemporary Telugu, పితామహుడు ordinarily denotes a grandfather. πατριάρχης identifies David as a patriarch or clan ancestor, not specifically a grandfather. ‘కులపతియైన’ preserves the title and its broader ancestral sense.
  - severity: low
    issue: ‘నేను మీతో ధైర్యంగా మాట్లాడవచ్చు’ for ἐξὸν εἰπεῖν μετὰ παρρησίας
    rationale: ‘మాట్లాడవచ్చు’ may suggest mere capability. The Greek idiom foregrounds freedom/permission to speak candidly; the revision states that sense explicitly.
  revised_text: 'సోదరులారా,[a] కులపతియైన దావీదు గురించి మీతో నిర్భయంగా చెప్పడానికి నాకు స్వేచ్ఛ ఉంది: అతడు చనిపోయి సమాధి చేయబడ్డాడు; అతని సమాధి నేటివరకు మన మధ్య ఉంది.'
