id: ACT.2.29
reference: Acts 2:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, ἐξὸν εἰπεῖν μετὰ παρρησίας πρὸς ὑμᾶς περὶ τοῦ πατριάρχου Δαυίδ, ὅτι καὶ ἐτελεύτησεν καὶ ἐτάφη, καὶ τὸ μνῆμα αὐτοῦ ἔστιν ἐν ἡμῖν ἄχρι τῆς ἡμέρας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/029.yaml
  text: Men[a], brothers, I may speak to you with boldness about the patriarch David, that he both died and was buried, and his tomb is among us to this day.
translation:
  language: te
  text: 'సోదరులారా,[a] కులపతియైన దావీదు గురించి మీతో నిర్భయంగా చెప్పడానికి నాకు స్వేచ్ఛ ఉంది: అతడు చనిపోయి సమాధి చేయబడ్డాడు; అతని సమాధి నేటివరకు మన మధ్య ఉంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘పురుషులారా, సోదరులారా’; ఇది సభలోని తోటి ఇశ్రాయేలీయులను ఉద్దేశించిన అధికారిక సంబోధన.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకులో అక్షరార్థంగా ‘పురుషులారా, సోదరులారా’ అనే ద్వంద్వ సంబోధన ఉంది. ఆధునిక తెలుగులో దానిని యథాతథంగా ఉంచడం అసహజంగా ఉండడంతో సహజమైన సభా సంబోధనగా ‘సోదరులారా’ వాడి, అక్షరార్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: ἐξὸν εἰπεῖν
  choice: నేను ... మాట్లాడవచ్చు
  rationale: ఈ ప్రయోగం కేవలం సామర్థ్యాన్ని కాక, మాట్లాడేందుకు ఉన్న స్వేచ్ఛ లేదా అనుమతిని సూచిస్తుంది; ‘మాట్లాడవచ్చు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: μετὰ παρρησίας
  choice: ధైర్యంగా
  rationale: παρρησία బహిరంగంగా, నిస్సంకోచంగా, ధైర్యంగా మాట్లాడడాన్ని సూచిస్తుంది. సందర్భంలో ‘ధైర్యంగా’ సంక్షిప్తమైన సహజ సమానార్థకం.
- source_word: περὶ τοῦ πατριάρχου Δαυίδ
  choice: పితామహుడైన దావీదు గురించి
  rationale: πατριάρχης వంశానికి మూలపురుషుడైన గౌరవనీయ పూర్వికుని సూచిస్తుంది. సాధారణ తెలుగు పాఠకులకు ‘పితామహుడు’ స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: καὶ ἐτελεύτησεν καὶ ἐτάφη
  choice: అతడు చనిపోయి సమాధి చేయబడ్డాడు
  rationale: రెండు సంఘటనలూ నిజమని καί ... καί నొక్కిచెబుతుంది. తెలుగులో ‘చనిపోయి ... చేయబడ్డాడు’ సహజంగా ఆ రెండింటినీ వరుసగా వ్యక్తం చేస్తుంది.
- source_word: τὸ μνῆμα αὐτοῦ
  choice: అతని సమాధి
  rationale: μνῆμα ఇక్కడ తెలిసిన సమాధి స్థలాన్ని సూచిస్తుంది; ‘సమాధి’ ఆధునిక ప్రామాణిక తెలుగులో సరైన పదం.
- source_word: ἔστιν ἐν ἡμῖν
  choice: మన మధ్యనే ఉంది
  rationale: ఈ పదబంధం వక్త, శ్రోతలు ఉన్న సమాజం లేదా ప్రదేశంలో ఆ సమాధి ఇంకా ఉన్నదని సూచిస్తుంది. ‘మన మధ్యనే’ స్థానిక-సామూహిక భావాన్ని నిలుపుతుంది.
- source_word: ἄχρι τῆς ἡμέρας ταύτης
  choice: నేటివరకు
  rationale: మాట్లాడుతున్న రోజు వరకూ కొనసాగుతున్న ఉనికిని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రారంభంలోని రెండు పుంలింగ సంబోధనల అనువాదం
  choice: ప్రధాన పాఠంలో ‘సోదరులారా’; అక్షరార్థ ద్వంద్వ సంబోధనను పాదసూచికలో ఉంచడం
  alternative: ‘పురుషులారా, సోదరులారా’
  rationale: గ్రీకు Ἄνδρες ἀδελφοί రెండు పుంలింగ సంబోధనలను కలిగి ఉంది. అయితే వాటిని అక్షరాలా తెలుగులో ఉంచితే ఆధునిక వాడుకలో కృత్రిమంగా వినిపిస్తుంది. ‘సోదరులారా’ సభా సంబోధనను సహజంగా అందిస్తుండగా, పాదసూచిక మూలరూపాన్ని పారదర్శకంగా కాపాడుతుంది; ‘సోదర సోదరీమణులారా’ అని మార్చి మూలంలోని పుంలింగ రూపాన్ని విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; బహిరంగ ప్రసంగానికి తగిన గౌరవప్రదమైన, స్పష్టమైన శైలి. ‘పితామహుడు,’ ‘ధైర్యంగా,’ ‘మన మధ్యనే’ వంటి పదాలు మూలంలోని గౌరవం, నిస్సంకోచత, స్థానిక ఉనికిని సహజంగా నిలుపుతాయి.
