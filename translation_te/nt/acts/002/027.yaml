id: ACT.2.27
reference: Acts 2:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἐγκαταλείψεις τὴν ψυχήν μου εἰς ⸀ᾅδην, οὐδὲ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/027.yaml
  text: because you will not abandon my soul to Hades[c][b][a], nor will you let your Holy One see decay.
translation:
  language: te
  text: ఎందుకంటే, నీవు నా ప్రాణాన్ని మృతుల లోకంలో విడిచిపెట్టవు[a]; నీ పవిత్రుణ్ణి[b] కుళ్లుపట్టనివ్వవు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు మూలంలో ‘హేడీస్’; ఈ ఉల్లేఖనానికి ఆధారమైన హీబ్రూ పాఠంలో ‘షియోల్,’ అంటే మృతుల లోకం.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘నీ విశ్వాసపాత్రుణ్ణి.’
    reason: lexical_alternative
  - marker: c
    text: అంటే, శరీరం క్షయించి కుళ్లిపోవడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκαταλείψεις
  choice: విడిచిపెట్టవు
  rationale: ఒక వ్యక్తిని ఒక స్థితిలో లేదా చోటులో వదిలివేయడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὴν ψυχήν μου
  choice: నా ప్రాణాన్ని
  rationale: ψυχή ఇక్కడ ‘ప్రాణం/జీవితం/స్వయం’ అనే భావపరిధిని కలిగి ఉంది. ‘ప్రాణం’ కీర్తన ఉల్లేఖనంలోని మానవ అస్తిత్వ భావాన్ని ఉంచుతూ, సాంకేతికమైన ఆత్మ-శరీర సిద్ధాంతాన్ని అనవసరంగా చొప్పించదు.
- source_word: εἰς ᾅδην
  choice: పాతాళంలో
  rationale: తెలుగులో ‘పాతాళం’ మృతుల లోకాన్ని సూచించే సహజమైన బైబిలు పదం. ‘నరకం’ అని అనువదించడం ద్వారా తరువాతి శిక్షాస్థల భావాన్ని ఈ వాక్యంలోకి చొప్పించకుండా ఉంటుంది. ἐγκαταλείπωతో కూడిన εἰςను తెలుగులో స్థానార్థకమైన ‘లో’తో సహజంగా వ్యక్తం చేశాం.
- source_word: δώσεις … ἰδεῖν
  choice: కుళ్లుపట్టనివ్వవు
  rationale: ‘చూడడానికి ఇవ్వవు’ అనే గ్రీకు నుడికారాన్ని తెలుగులో అనుమతి భావంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸν ὅσιόν σου
  choice: నీ పవిత్రుణ్ణి
  rationale: ὅσιοςలోని పవిత్రత, భక్తి, విశ్వసనీయత భావపరిధిలో ప్రధాన భావాన్ని నిలుపుతుంది; సందర్భంలోని క్రీస్తుసంబంధ అన్వయాన్ని కూడా అతిశయోక్తి లేకుండా కాపాడుతుంది.
- source_word: διαφθοράν
  choice: కుళ్లు
  rationale: ఇక్కడ ఉద్దేశించిన శారీరక క్షయాన్ని ఆధునిక పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; ‘భ్రష్టత’ వంటి పదాలు నైతిక అవినీతిని సూచించే అపార్థాన్ని కలిగించవచ్చు.
theological_decisions:
- issue: పునరుత్థాన సందర్భంలో ᾅδης అనువాదం
  choice: పాతాళం
  alternative: మృతుల లోకం; షియోల్; సమాధి
  rationale: గ్రీకు ᾅδηςను ‘నరకం’గా మార్చి తరువాతి సిద్ధాంతార్థాన్ని చొప్పించకుండా, మృతుల లోకం అనే భావాన్ని నిలుపుతుంది. ‘సమాధి’ అని పరిమితం చేయకుండా మూలంలోని విస్తృత భావాన్ని కాపాడుతుంది.
- issue: τὸν ὅσιόν σου యొక్క క్రీస్తుసంబంధ గుర్తింపు
  choice: నీ పవిత్రుణ్ణి
  alternative: నీ విశ్వాసపాత్రుణ్ణి; నీ భక్తుణ్ణి
  rationale: అపొస్తలుల కార్యాలు 2లో ఈ కీర్తన యేసుకు అన్వయించబడుతున్న సందర్భాన్ని, అలాగే ὅσιος యొక్క పవిత్రత/విశ్వసనీయత భావపరిధిని నిలుపుతుంది; మూలంలో లేని అదనపు సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పాతాళం’ను సాంప్రదాయ తెలుగు బైబిలు పరిచయాన్ని దృష్టిలో ఉంచుకొని ఉపయోగించాం; పాదసూచిక గ్రీకు ‘హేడీస్’ మరియు హీబ్రూ ‘షియోల్’ నేపథ్యాన్ని స్పష్టం చేస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో వరుసగా ఉన్నాయి.
