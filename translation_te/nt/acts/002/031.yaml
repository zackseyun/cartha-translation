id: ACT.2.31
reference: Acts 2:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: προϊδὼν ἐλάλησεν περὶ τῆς ἀναστάσεως τοῦ χριστοῦ ὅτι ⸂οὔτε ἐγκατελείφθη⸃ εἰς ⸀ᾅδην ⸀οὔτε ἡ σὰρξ αὐτοῦ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/031.yaml
  text: 'Foreseeing this[a], he spoke about the resurrection of the Messiah: that he was neither abandoned to Hades[d][c][b], nor did his flesh see decay.'
translation:
  language: te
  text: 'అతడు దీనిని ముందుగానే గ్రహించి, మెస్సీయ[a] పునరుత్థానం గురించి ఇలా చెప్పాడు: “ఆయన మృతుల లోకంలో[b] వదిలివేయబడలేదు,[c] ఆయన శరీరం కూడా కుళ్లిపోలేదు.[d]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకులో ‘క్రిస్టోస్’; ఇక్కడ అది బిరుదుగా ఉన్నందున ‘మెస్సీయ’ అని అనువదించాం. సంప్రదాయ అనువాదం: ‘క్రీస్తు.’'
    reason: alternative_reading
  - marker: b
    text: గ్రీకులో ‘హేడీస్’; అంటే మృతుల లోకం. ఇది ప్రత్యేకంగా అంతిమ తీర్పు లేదా శిక్షాస్థలాన్ని సూచించే పదం కాదు.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘మృతుల లోకానికి వదిలివేయబడలేదు.’ గ్రీకు ఉపసర్గ ‘వైపు/లోనికి’ అనే దిశను సూచించగలదు; సందర్భంలోని భావం ఆయన మృతుల లోకంలో పరిత్యజించబడలేదనేది.
    reason: lexical_alternative
  - marker: d
    text: 'మూలానికి మరింత అక్షరార్థంగా: ‘ఆయన మాంసం క్షయాన్ని చూడలేదు.’ భావం: ఆయన శరీరం కుళ్లిపోలేదు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδὼν
  choice: దీనిని ముందుగానే గ్రహించి
  rationale: ఈ భూతకాల అసమాపక క్రియ రాబోయేదాన్ని ముందే తెలుసుకోవడం లేదా చూడడాన్ని సూచిస్తుంది. తెలుగులో ‘ముందుగానే గ్రహించి’ సహజంగా ఉండి, ప్రధాన క్రియకు ముందున్న అవగాహనను తెలియజేస్తుంది; ‘దీనిని’ అనేది సందర్భం నుంచి స్పష్టత కోసం చేర్చబడింది.
- source_word: ἐλάλησεν
  choice: చెప్పాడు
  rationale: λαλέω ఇక్కడ లేఖనంలోని విషయాన్ని పలకడాన్ని సూచిస్తుంది. ‘చెప్పాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, తరువాత వచ్చే ఉల్లేఖన విషయంతో సులభంగా కలుస్తుంది.
- source_word: περὶ τῆς ἀναστάσεως
  choice: పునరుత్థానం గురించి
  rationale: περί + షష్ఠీ విభక్తి ‘గురించి/సంబంధించి’ అనే భావాన్నిస్తుంది. ‘పునరుత్థానం గురించి’ ప్రామాణికమైన, సులభంగా గుర్తించగల తెలుగు రూపం.
- source_word: τοῦ χριστοῦ
  choice: మెస్సీయ
  rationale: ఈ లేఖనాధారిత వాదనలో Χριστός వ్యక్తినామంలా కాక, దేవుడు అభిషేకించిన వాగ్దాన వ్యక్తి అనే బిరుదుగా పనిచేస్తుంది. అందువల్ల ‘మెస్సీయ’ను ఎంచుకున్నాం.
- source_word: οὔτε ἐγκατελείφθη
  choice: విడిచిపెట్టబడలేదు
  rationale: ἐγκαταλείπω అంటే విడిచిపెట్టడం, పరిత్యజించడం. కర్మణి రూపాన్ని ‘విడిచిపెట్టబడలేదు’ నిలుపుతుంది; తెలుగు వాక్యంలో రెండవ నిరాకరణతో కలిసి గ్రీకు οὔτε…οὔτε జత భావం స్పష్టమవుతుంది.
- source_word: εἰς ᾅδην
  choice: మృతుల లోకంలో
  rationale: ᾅδης మృతుల లోకాన్ని సూచిస్తుంది; అంతిమ తీర్పు స్థలాన్ని తప్పనిసరిగా సూచించదు. εἰς సాధారణంగా ‘లోనికి/వైపు’ అయినప్పటికీ, ‘విడిచిపెట్టబడడం’తో కలిసిన ఈ కీర్తన ఉల్లేఖనంలో అక్కడ పరిత్యజించబడకపోవడమే భావం. అందుకే సహజమైన తెలుగు స్థానార్థక రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, దిశార్థక సాధ్యతను పాదటిప్పణిలో తెలిపాం.
- source_word: ἡ σὰρξ αὐτοῦ
  choice: ఆయన శరీరం
  rationale: σάρξ ఇక్కడ నైతిక లేదా రూపకాల అర్థంలో కాక, మరణానికి లోనైన భౌతిక దేహాన్ని సూచిస్తుంది. ‘శరీరం’ సాధారణ పాఠకులకు ‘మాంసం’ కంటే సహజంగా ఉండి, ఉద్దేశించిన శారీరక భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: εἶδεν διαφθοράν
  choice: కుళ్లిపోలేదు
  rationale: ‘క్షయాన్ని చూడడం’ అనే గ్రీకు జాతీయాన్ని తెలుగులో యథాతథంగా ఉంచితే అసహజంగా ఉంటుంది. ‘కుళ్లిపోలేదు’ శరీర విఘటన అనే అర్థాన్ని నేరుగా, స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు; అభిషిక్తుడు
  rationale: పేతురు లేఖనాన్ని ఆధారంగా చేసుకొని వాగ్దానం చేయబడిన అభిషిక్తుని గురించి మాట్లాడుతున్నందున ఇక్కడ బిరుదు భావం ప్రధానంగా ఉంది. ‘మెస్సీయ’ ఆ భావాన్ని నిలుపుతుంది; సంప్రదాయ ‘క్రీస్తు’ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: ᾅδης యొక్క అర్థం
  choice: మృతుల లోకం
  alternative: హేడీస్; పాతాళం; నరకం
  rationale: ఈ పదం ఇక్కడ మరణించినవారి లోకాన్ని సూచిస్తుంది. ‘నరకం’ అని అనువదిస్తే అంతిమ శిక్షాస్థలం అనే భావాన్ని అనవసరంగా దిగుమతి చేసే ప్రమాదం ఉంది. ‘మృతుల లోకం’ తటస్థంగా, అర్థవంతంగా ఉంటుంది.
- issue: σάρξ యొక్క సూచన
  choice: శరీరం
  alternative: మాంసం
  rationale: ఇక్కడ σάρξ పాప స్వభావాన్ని కాదు, మెస్సీయ భౌతిక దేహాన్ని సూచిస్తుంది. సహజ తెలుగులో ‘శరీరం’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; మూలపదానికి మరింత అక్షరార్థమైన ‘మాంసం’ను పాదటిప్పణిలో సూచించాం.
- issue: εἰς ᾅδην లోని దిశ మరియు స్థానం మధ్య ఉద్రిక్తత
  choice: మృతుల లోకంలో విడిచిపెట్టబడలేదు
  alternative: మృతుల లోకానికి విడిచిపెట్టబడలేదు
  rationale: εἰς లో దిశార్థం ఉన్నప్పటికీ, ἐγκατελείφθηతో కలిసి ఇక్కడ ప్రధాన భావం మృతుల లోకంలో పరిత్యజించబడకపోవడం. ప్రధాన పాఠ్యంలో సహజ తెలుగు స్థానార్థాన్ని తీసుకొని, దిశార్థక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘పునరుత్థానం’ వంటి విస్తృతంగా తెలిసిన బైబిలు పదాన్ని నిలిపాం. గ్రీకు జాతీయాన్ని అక్షరాలా అనుకరించకుండా సహజ తెలుగు వాక్యనిర్మాణాన్ని వాడాం; అయితే ᾅδης, εἰς, Χριστός, σάρξ సంబంధిత ముఖ్యమైన అర్థభేదాలను పాదటిప్పణుల్లో భద్రపరిచాం.
