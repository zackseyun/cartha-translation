revisions:
- from: ఈ యేసునే దేవుడు మృతులలోనుండి లేపాడు[a]. దీనికి మేమందరం సాక్షులం.
  to: ఈ యేసునే దేవుడు లేపాడు[a]. ఆయనను గూర్చి మేమందరం సాక్షులం.
  rationale: The revision restores the personal reference of οὗ with “ఆయనను గూర్చి,” retains the emphatic “ఈ యేసునే,” and avoids adding “మృతులలోనుండి” to the verse itself. The footnote continues to clarify that “లేపాడు” denotes resurrection in this context.
