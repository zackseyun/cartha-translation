  text: τοῦτον τὸν Ἰησοῦν ἀνέστησεν ὁ θεός, οὗ πάντες ἡμεῖς ἐσμεν μάρτυρες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/032.yaml
  text: God raised up this Jesus[a], of whom we all are witnesses.
translation:
  language: te
  text: ఈ యేసునే దేవుడు లేపాడు[a]. ఆయనను గూర్చి మేమందరం సాక్షులం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు ఈ యేసునే లేపాడు.” ఇక్కడ గ్రీకు క్రియ పునరుత్థానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: ఈ యేసునే
  rationale: τοῦτον అనే సూచనార్థక పదంలోని నిర్దిష్టతను, సందర్భంలో ఇప్పుడే ప్రస్తావించిన యేసుపై ఉన్న ఉద్ఘాటనను ‘ఈ యేసునే’ సహజంగా నిలుపుతుంది.
- source_word: ἀνέστησεν
  choice: మృతులలోనుండి లేపాడు
  rationale: ఇక్కడ ἀνίστημι పునరుత్థానాన్ని సూచిస్తుంది. ‘లేపాడు’ కర్త అయిన దేవుని క్రియను నిలుపుతుంది; ‘మృతులలోనుండి’ సందర్భార్థాన్ని ఆధునిక పాఠకునికి స్పష్టం చేస్తుంది.
- source_word: ὁ θεός
  choice: దేవుడు
  rationale: గ్రీకు వాక్యంలో స్పష్టమైన కర్తను నేరుగా నిలుపుతుంది.
- source_word: οὗ
  choice: దీనికి
  rationale: సంబంధవాచక సర్వనామం యేసు పునరుత్థానానికి సాక్షులనే భావాన్ని సూచిస్తుంది. తెలుగులో ‘దీనికి’ అని చెప్పడం సహజంగా ఉండి, ముందున్న మొత్తం సంఘటనను సూచించగలదు.
- source_word: πάντες ἡμεῖς
  choice: మేమందరం
  rationale: πάντες ἡμεῖς లోని సమూహ ఉద్ఘాటనను సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: ἐσμεν μάρτυρες
  choice: సాక్షులం
  rationale: మూలంలోని నామవాచక నిర్మాణమైన ‘సాక్షులుగా ఉన్నాము’ అనే భావాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పునరుత్థానాన్ని సూచించే క్రియ
  choice: దేవుడు ఈ యేసునే మృతులలోనుండి లేపాడు
  alternative: దేవుడు ఈ యేసును లేపాడు
  rationale: వాక్యం యేసు పునరుత్థానాన్ని దేవుని క్రియగా నేరుగా పేర్కొంటుంది. ‘మృతులలోనుండి’ అనేది సందర్భంలో క్రియకు ఉన్న పునరుత్థానార్థాన్ని స్పష్టం చేస్తుంది; అదనపు సిద్ధాంత వివరణను చేర్చదు.
- issue: సాక్ష్యం దేనికి సంబంధించినది
  choice: దీనికి మేమందరం సాక్షులం
  alternative: ఆయనకు మేమందరం సాక్షులం
  rationale: οὗ వ్యాకరణపరంగా యేసును సూచించగలిగినా, సందర్భంలో అపొస్తలుల సాక్ష్యం ఆయన పునరుత్థాన సంఘటనపై కేంద్రీకృతమైంది. ‘దీనికి’ ఆ సంఘటనను సహజంగా సూచిస్తూ, వ్యక్తి/సంఘటన మధ్య మూలంలో ఉన్న సంబంధాన్ని అతిగా సిద్ధాంతీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘ఈ యేసునే’ మూలంలోని ఉద్ఘాటనను నిలుపుతుంది; ‘మేమందరం సాక్షులం’ సహజమైన సమకాలీన ప్రయోగం.
