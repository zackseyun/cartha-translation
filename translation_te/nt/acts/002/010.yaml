id: ACT.2.10
reference: Acts 2:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Φρυγίαν τε καὶ Παμφυλίαν, Αἴγυπτον καὶ τὰ μέρη τῆς Λιβύης τῆς κατὰ Κυρήνην, καὶ οἱ ἐπιδημοῦντες Ῥωμαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/010.yaml
  text: Phrygia and Pamphylia[a], Egypt and the parts of Libya toward Cyrene, and the visiting Romans[b],
translation:
  language: te
  text: ఫ్రుగియా మరియు పంఫూలియా, ఐగుప్తు, కురేనే వైపుననున్న లిబియా ప్రాంతాలు[a], తాత్కాలికంగా బస చేస్తున్న రోమీయులు[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కురేనే చుట్టుపక్కల ఉన్న లిబియా ప్రాంతాలు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “బస చేస్తున్న రోమీయులు” లేదా “రోమీయ సందర్శకులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Φρυγίαν τε καὶ Παμφυλίαν
  choice: ఫ్రుగియ, పంఫులియ
  rationale: ప్రాంతాల పేర్లను ఆధునిక తెలుగు లిప్యంతరీకరణలో ఇచ్చి, జాబితాలోని అనుసంధానాన్ని సహజమైన విరామచిహ్నంతో చూపించాం.
- source_word: Αἴγυπτον
  choice: ఐగుప్తు
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన దేశనామాన్ని నిలిపాం.
- source_word: τὰ μέρη τῆς Λιβύης
  choice: లిబియ ప్రాంతాలు
  rationale: μέρη అనే పదానికి సందర్భానుసారంగా సహజమైన ‘ప్రాంతాలు’ను ఎంచుకున్నాం; ఇది లిబియలోని భాగాలను సూచిస్తుంది.
- source_word: τῆς κατὰ Κυρήνην
  choice: కురేనే వైపున ఉన్న
  rationale: κατά ఇక్కడ కురేనేతో భౌగోళిక సంబంధాన్ని సూచిస్తుంది. ‘వైపున ఉన్న’ అనేది దిశ/ప్రాంత భావాన్ని కాపాడుతూ ఖచ్చితమైన సరిహద్దులను అనవసరంగా నిర్ధారించదు.
- source_word: οἱ ἐπιδημοῦντες Ῥωμαῖοι
  choice: ఇక్కడ తాత్కాలికంగా ఉంటున్న రోమీయులు
  rationale: ἐπιδημοῦντες తాత్కాలికంగా ఒకచోట ఉండడం లేదా సందర్శకులుగా ఉండడం అనే భావాన్ని ఇస్తుంది. ‘ఇక్కడ’ అనేది సందర్భంలోని యెరూషలేమును సహజంగా సూచిస్తుంది; శాశ్వత నివాసాన్ని భావింపజేయదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భౌగోళిక జాబితా స్వరూపాన్ని మరియు మూలంలోని వాక్యఖండ నిర్మాణాన్ని నిలిపాం. ప్రాంతనామాలకు సుపరిచితమైన తెలుగు రూపాలను వాడాం; తాత్కాలిక నివాసం అనే భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా చెప్పాం.
