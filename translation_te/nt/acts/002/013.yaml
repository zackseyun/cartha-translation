  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే హేళన స్వరాన్నీ క్రియ యొక్క కొనసాగింపు భావాన్నీ నిలుపుతూ గౌరవప్రదమైన శైలి వాడబడింది.
