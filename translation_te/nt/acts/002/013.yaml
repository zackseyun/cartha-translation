  text: ἕτεροι δὲ ⸀διαχλευάζοντες ἔλεγον ὅτι Γλεύκους μεμεστωμένοι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/013.yaml
  text: But others[a], mocking, were saying, “They are filled with sweet wine.”
translation:
  language: te
  text: కానీ మరికొందరు ఎగతాళి చేస్తూ, “వీరు తియ్యని ద్రాక్షారసంతో నిండిపోయారు” అని అంటూ ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτεροι
  choice: మరికొందరు
  rationale: ఈ విశేషణం నామవాచకంగా వాడబడి, జనసమూహంలోని వేరొక వర్గాన్ని సూచిస్తుంది; ‘మరికొందరు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: δὲ
  choice: కానీ
  rationale: ముందటి వచనంలోని ఆశ్చర్యభరిత స్పందనకు విరుద్ధమైన స్పందనను δέ సూచిస్తుంది.
- source_word: διαχλευάζοντες
  choice: ఎగతాళి చేస్తూ
  rationale: ఈ కృదంతం హేళనతో కూడిన అపహాస్యాన్ని తెలియజేస్తుంది; ఈ భావాన్ని ‘ఎగతాళి చేస్తూ’ స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: ἔλεγον
  choice: అని అంటూనే ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగిన లేదా పదేపదే జరిగిన మాటను సూచిస్తుంది; ‘అంటూనే ఉన్నారు’ ఆ భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: ὅτι
  choice: ప్రత్యక్ష ఉద్ధరణను పరిచయం చేసే ‘అని’
  rationale: ఇక్కడ వారి మాటల విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ప్రత్యక్ష ఉద్ధరణ చివర ‘అని’ వాడటం సహజం.
- source_word: Γλεύκους
  choice: తియ్యని ద్రాక్షారసం
  rationale: γλεῦκος తియ్యగా ఉండే తాజా లేదా కొత్త ద్రాక్షారసాన్ని సూచిస్తుంది; ‘తియ్యని ద్రాక్షారసం’ దాని ప్రధాన పదార్థార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: μεμεστωμένοι εἰσίν
  choice: మత్తుగా తాగారు
  rationale: పరిపూర్ణ కర్మణి కృదంతం మరియు వర్తమాన సహాయక క్రియ కలిసి, వారు ఆ పానీయంతో నిండిపోయిన స్థితిలో ఉన్నారనే ఆరోపణను వ్యక్తం చేస్తాయి. తెలుగులో ‘మత్తుగా తాగారు’ ఆ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది; ‘నిండిపోయారు’ అనే అక్షరార్థ అనువాదం అసహజంగా ఉంటుంది.
