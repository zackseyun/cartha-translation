id: ACT.2.7
reference: Acts 2:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐξίσταντο ⸀δὲ καὶ ἐθαύμαζον ⸀λέγοντες· ⸀Οὐχ ἰδοὺ ⸀πάντες οὗτοί εἰσιν οἱ λαλοῦντες Γαλιλαῖοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/007.yaml
  text: And they were astonished and amazed[a], saying, “Look, are not all these who are speaking Galileans?”
translation:
  language: te
  text: వారు విస్తుపోయి ఆశ్చర్యపడి, “ఇదిగో[a], మాట్లాడుతున్న వీరందరూ గలిలయులు కాదా?” అని ఇలా అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చూడండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: దిగ్భ్రాంతి చెంది
  rationale: ఈ సందర్భంలో ఈ క్రియ తీవ్రంగా విస్తుపోవడం లేదా సంభ్రమానికి లోనవడం అనే భావాన్ని ఇస్తుంది. ‘దిగ్భ్రాంతి చెంది’ ఆ తీవ్రతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: వారు
  rationale: δέ ఇక్కడ కథనాన్ని ముందుకు నడిపించే స్వల్ప అనుసంధాన పదం. తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని పెట్టడం కంటే వాక్యాన్ని నేరుగా ‘వారు’తో ప్రారంభించడం సహజంగా అదే కథన సంబంధాన్ని అందిస్తుంది.
- source_word: καὶ
  choice: … చెంది ఆశ్చర్యపోతూ
  rationale: రెండు ప్రతిస్పందన క్రియలను కలిపి, వాటి సమిష్టి ప్రభావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐθαύμαζον
  choice: ఆశ్చర్యపోతూ
  rationale: ఈ క్రియ ఆశ్చర్యపడడం, అబ్బురపడడం అనే భావాన్ని ఇస్తుంది. అసంపూర్ణ కాలంలోని కొనసాగుతున్న ప్రతిస్పందనను ‘ఆశ్చర్యపోతూ’ నిలుపుతుంది.
- source_word: λέγοντες
  choice: అన్నారు
  rationale: వారి మాటల విషయాన్ని పరిచయం చేసే కృదంతాన్ని తెలుగులో ప్రత్యక్ష వాక్యం చివర ‘అన్నారు’గా ఇవ్వడం సహజమైన వాక్యనిర్మాణం.
- source_word: Οὐχ
  choice: కాదా?
  rationale: గ్రీకు ప్రతికూల ప్రశ్న అనుకూల సమాధానాన్ని ఆశిస్తుంది. తెలుగు ‘కాదా?’ అదే ప్రశ్నార్థక బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రోతల దృష్టిని ఆకర్షించే సూచనాత్మక అవ్యయానికి ‘ఇదిగో’ సమీపమైన, గౌరవప్రదమైన ఆధునిక తెలుగు సమానం.
- source_word: πάντες οὗτοί
  choice: వీరందరూ
  rationale: చర్చలో ఉన్న మొత్తం సమూహాన్ని సూచిస్తుంది. మూలంలో లేని ‘పురుషులు’ వంటి పదాన్ని చేర్చకుండా ‘వీరందరూ’ సంక్షిప్తంగా భావాన్ని అందిస్తుంది.
- source_word: οἱ λαλοῦντες
  choice: మాట్లాడుతున్న
  rationale: మాట్లాడే చర్య కొనసాగుతున్నదనే వర్తమాన కృదంత భావాన్ని నిలుపుతుంది.
- source_word: Γαλιλαῖοι
  choice: గలిలయులు
  rationale: ఇది ప్రాంతీయ గుర్తింపును సూచించే పదం. ఆశ్చర్యానికి కారణాన్ని అదనంగా వివరించకుండా నేరుగా ప్రాంతీయ పేరునే నిలుపుతుంది.
theological_decisions:
- issue: ‘గలిలయులు’ అనే ప్రాంతీయ గుర్తింపులో అంతర్లీనంగా ఉన్న సామాజిక భావం
  choice: ‘గలిలయులు’ అనే ప్రాంతీయ పదాన్ని మాత్రమే ఉంచడం
  alternative: ‘చదువులేని గలిలయులు’ లేదా వారి యాస/స్థాయి గురించి వివరణ చేర్చడం
  rationale: వక్తలు గలిలయులు కావడంపై వాక్యం ఆశ్చర్యాన్ని వ్యక్తం చేస్తుంది గాని, ఆ ఆశ్చర్యానికి కారణం వారి విద్య, యాస లేదా సామాజిక స్థితి అని స్పష్టంగా చెప్పదు. అందువల్ల ఆ ఊహలను అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. గ్రీకులోని రెండు ఆశ్చర్య ప్రతిస్పందనలను ‘దిగ్భ్రాంతి చెంది ఆశ్చర్యపోతూ’ అని వేర్వేరు భావఛాయలతో నిలిపాం.
