id: ACT.2.42
reference: Acts 2:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἦσαν δὲ προσκαρτεροῦντες τῇ διδαχῇ τῶν ἀποστόλων καὶ τῇ ⸀κοινωνίᾳ, τῇ κλάσει τοῦ ἄρτου καὶ ταῖς προσευχαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/042.yaml
  text: And they were devoting themselves to the apostles' teaching and the fellowship[c][b][a], to the breaking of bread and the prayers.
translation:
  language: te
  text: వారు అపొస్తలుల బోధలో, సహవాసంలో[a], రొట్టె విరచడంలో[b], ప్రార్థనల్లో[c] పట్టుదలగా కొనసాగేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పంచుకోవడంలో,’ ‘భాగస్వామ్యంలో,’ ‘కమ్యూనియన్‌లో.’
    reason: lexical_alternative
  - marker: b
    text: ‘రొట్టె విరచడం’ సాధారణంగా కలిసి భోజనం చేయడాన్ని సూచించవచ్చు; అయితే ఇక్కడ అది ప్రభువు భోజనాన్ని కూడా కలుపుకొని ఉందని అనేకులు భావిస్తారు.
    reason: alternative_reading
  - marker: c
    text: లేదా ‘నిర్దిష్ట ప్రార్థనల్లో’; ఇక్కడ నిర్దిష్టతను సూచించే ఉపపదం గుర్తింపుపొందిన ప్రార్థనా సమయాలను లేదా ప్రార్థనా రూపాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δὲ προσκαρτεροῦντες
  choice: పట్టుదలగా కొనసాగేవారు
  rationale: ἦσαν తో కూడిన వర్తమాన కృదంతం గతంలో నిరంతరంగా, అలవాటుగా సాగిన చర్యను తెలియజేస్తుంది; προσκαρτερέω లోని స్థిరనిబద్ధతను ‘పట్టుదలగా’ వ్యక్తం చేస్తుంది.
- source_word: τῇ διδαχῇ τῶν ἀποστόλων
  choice: అపొస్తలుల బోధలో
  rationale: διδαχή ఇక్కడ బోధించే కార్యాన్నీ, బోధించిన విషయాన్నీ సూచించగలదు. ‘బోధ’ ఆధునిక తెలుగులో సహజంగా ఉండి, అతిగా వ్యవస్థీకృతమైన సిద్ధాంత భావాన్ని రుద్దదు. సంబంధవిభక్తి అపొస్తలులు అందించిన బోధను సూచించేలా సహజంగా అనువదించబడింది.
- source_word: τῇ κοινωνίᾳ
  choice: సహవాసంలో
  rationale: κοινωνία ఉమ్మడి భాగస్వామ్యం, పంచుకోవడం, సంఘజీవితం అనే విస్తృత భావాలను కలిగి ఉంది. ‘సహవాసం’ ఆ పరిధిని సంకుచితం చేయకుండా తెలుగులో స్థిరమైన, అర్థమయ్యే పదంగా ఉంది; ఇతర భావాలను పాదసూచికలో ఉంచాం.
- source_word: τῇ κλάσει τοῦ ἄρτου
  choice: రొట్టె విరచడంలో
  rationale: లూకా–అపొస్తలుల కార్యములలో కనిపించే మూలభాషా అభివ్యక్తిని నేరుగా నిలుపుతుంది. ఇది సాధారణ ఉమ్మడి భోజనాన్నో, ప్రభువు భోజనాన్ని కలుపుకున్న ఆచారాన్నో సూచించవచ్చు; ప్రధాన పాఠంలో ఒకదానికే పరిమితం చేయలేదు.
- source_word: ταῖς προσευχαῖς
  choice: ప్రార్థనల్లో
  rationale: బహువచనాన్ని నిలుపుతూ సహజమైన తెలుగు రూపాన్ని వాడాం. గ్రీకు నిర్దిష్ట ఉపపదం గుర్తింపుపొందిన ప్రార్థనా సమయాలు లేదా రూపాలను సూచించే అవకాశం ఉన్నందున దాన్ని పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: κλάσει τοῦ ἄρτου ను ప్రభువు భోజనం లేదా యూకరిస్టు అని స్పష్టంగా అనువదించాలా
  choice: ‘రొట్టె విరచడం’ అనే విస్తృత మూలభాషా అభివ్యక్తిని నిలిపాం.
  alternative: ‘ప్రభువు భోజనం,’ ‘యూకరిస్టు,’ లేదా ప్రభువు భోజనాన్ని కలుపుకున్న సామూహిక భోజనాలు.
  rationale: ఈ మాట ఉమ్మడి భోజనాలను సూచించగలదు; క్రైస్తవ సందర్భంలో యేసును జ్ఞాపకం చేసుకునే భోజనాన్ని కూడా కలుపుకొని ఉండవచ్చు. అయితే ఈ వాక్యం సాంకేతికమైన సంస్కారార్థాన్నే తప్పనిసరిగా నిర్దేశించదు.
- issue: κοινωνία ను ఆస్తుల పంచుకోవడం లేదా సంస్కారాత్మక కమ్యూనియన్‌కే పరిమితం చేయాలా
  choice: విస్తృతమైన సంఘ భాగస్వామ్య భావంతో ‘సహవాసం’ అని అనువదించాం.
  alternative: ‘పంచుకోవడం,’ ‘భాగస్వామ్యం,’ లేదా ‘కమ్యూనియన్.’
  rationale: ఈ పదం ఆధ్యాత్మికంగానూ భౌతికంగానూ వ్యక్తమయ్యే ఉమ్మడి జీవితం, పాలుపంచుకోవడం అనే విస్తృతిని కలిగి ఉంది; ఒకే ప్రత్యేక అర్థానికి పరిమితం చేయడం మూలంలోని భావవిస్తృతిని ముందుగానే నిర్ణయిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. జాబితాలోని సమాంతర నిర్మాణాన్ని ‘-లో/-ల్లో’ రూపాలతో నిలిపాం. ‘పట్టుదలగా కొనసాగేవారు’ గతంలో నిరంతరంగా సాగిన నిబద్ధ ఆచరణను తెలియజేస్తుంది; సంఘపరమైన లేదా సంస్కారపరమైన ఒకే వ్యాఖ్యానాన్ని ప్రధాన పాఠం రుద్దదు.
