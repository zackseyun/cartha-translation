revisions:
- from: విశ్వసించినవారందరూ కలిసి ఉండి, సమస్తాన్నీ ఉమ్మడిగా ఉంచుకున్నారు.[a]
  to: విశ్వాసులందరూ కలిసి ఉండేవారు, తమకున్నవన్నీ ఉమ్మడిగా కలిగి ఉండేవారు.[a]
  rationale: 'The revision preserves the source’s descriptive, ongoing portrayal: all the believers were together and held all that they had in common. It retains the permissible locative alternative for ἐπὶ τὸ αὐτό in the anchored footnote and does not turn the narrative statement into a command or socioeconomic prescription.'
