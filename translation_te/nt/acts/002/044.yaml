source:
  edition: SBLGNT
  text: πάντες δὲ οἱ ⸀πιστεύοντες ⸂ἦσαν ἐπὶ τὸ αὐτὸ καὶ⸃ εἶχον ἅπαντα κοινά,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/044.yaml
  text: And all the believers were together and had all things in common,[a]
translation:
  language: te
  text: విశ్వాసులందరూ కలిసి ఉండేవారు, తమకున్నవన్నీ ఉమ్మడిగా కలిగి ఉండేవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒకే చోట ఉండేవారు.” ఈ గ్రీకు పదబంధం కలిసి ఉండడం లేదా ఒకచోట సమావేశమై ఉండడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: అందరూ
  rationale: నామవాచకంగా వాడిన కృదంతాన్ని సమగ్రంగా సూచించే పంపిణీ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది బలమైన వ్యతిరేకతను కాక సాధారణ కథన కొనసాగింపును సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో దానిని ప్రత్యేకంగా ‘అయితే’ లేదా ‘మరియు’ అని పెట్టడం అవసరం లేదు.
- source_word: οἱ πιστεύοντες
  choice: విశ్వసించినవారు
  rationale: విశ్వాసులుగా ఏర్పడిన సమూహాన్ని సహజంగా సూచిస్తుంది; కృదంత రూపానికి దగ్గరగా ఉండడంతో పాటు ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: ἦσαν ἐπὶ τὸ αὐτό
  choice: కలిసి ఉండి
  rationale: గ్రీకు నుడికారం కలిసి ఉండడం లేదా ఒకచోట సమావేశమై ఉండడం అనే భావాలను మోయగలదు; ప్రధాన పాఠంలో సహజమైన విస్తృత భావాన్ని ఉంచి, స్థలార్థాన్ని పాదటిప్పణిలో చూపించాం.
- source_word: εἶχον
  choice: ఉంచుకున్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న సామూహిక ఆచరణను సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: ἅπαντα κοινά
  choice: సమస్తాన్నీ ఉమ్మడిగా
  rationale: వారి దగ్గర ఉన్నవన్నీ సామూహిక వినియోగానికి చెందినవిగా ఉంచుకున్నారనే భావాన్ని, పంచివేశారని అతిగా నిర్దిష్టం చేయకుండా, నిలుపుతుంది.
theological_decisions:
- issue: సమాజపు ఉమ్మడి జీవన స్వభావం
  choice: విశ్వాసులు తమకు ఉన్నవాటిని ఉమ్మడిగా ఉంచుకున్నారని వివరణాత్మకంగా అనువదించాం.
  alternative: ఈ వాక్యం అన్ని క్రైస్తవ సమాజాలకూ ఒక నిర్దిష్ట ఆర్థిక వ్యవస్థను ఆజ్ఞాపిస్తుందని అనువదించడం.
  rationale: గ్రీకు పాఠం వారు చేస్తున్నదాన్ని వివరిస్తుంది; దానిని సార్వత్రిక ఆజ్ఞగా ప్రకటించదు. కాబట్టి అనువాదం సిద్ధాంతపరమైన లేదా రాజకీయ నిర్ధారణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఉమ్మడిగా’ అనే పదం సామూహిక స్వాధీనత/వినియోగ భావాన్ని తెలియజేస్తూ, పాఠంలో లేని ఆర్థిక సిద్ధాంతాన్ని దిగుమతి చేయదు.
