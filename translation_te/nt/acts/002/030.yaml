review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the inferential οὖν, David''s status as a prophet, his knowledge, the divine oath, physical descent, and the causative force of καθίσαι. However, “ప్రమాణపూర్వకంగా ఒట్టు పెట్టుకున్నాడు” is an unnatural and somewhat semantically imprecise rendering of ὅρκῳ ὤμοσεν: God swears/promises to David, rather than ‘making an oath with him.’ The revision makes the recipient explicit as “అతనికి” and expresses the sworn promise clearly.'
  naturalness: “నడుము ఫలంలోనుండి వచ్చిన ఒకరిని” is unnecessarily heavy, and “ఒట్టు పెట్టుకున్నాడు” is less suitable in this elevated biblical register. “తన నడుము ఫలము నుండి ఒకరిని” retains the source image while reading more smoothly. “ప్రమాణం చేసి వాగ్దానం చేశాడు” is natural modern standard Telugu and adequately conveys the emphatic oath expression.
  terminology: ప్రవక్త, సింహాసనం, and the concrete genealogical image are appropriate. The revised wording does not introduce “మెస్సీయ” or otherwise interpret the promise beyond the text. The footnote remains correctly anchored to the idiomatic descent expression and offers the natural alternative “వంశస్థులలో ఒకరిని.”
  issues:
  - severity: medium
    issue: “దేవుడు తనతో ప్రమాణపూర్వకంగా ఒట్టు పెట్టుకున్నాడు”
    rationale: This wording sounds as though God entered into an oath arrangement with David and uses a colloquial/redundant expression. Greek ὅρκῳ ὤμοσεν αὐτῷ means that God solemnly swore/promised to him. “దేవుడు అతనికి ప్రమాణం చేసి వాగ్దానం చేశాడు” communicates this relation and register more accurately.
  - severity: low
    issue: “తన నడుము ఫలంలోనుండి వచ్చిన ఒకరిని”
    rationale: “వచ్చిన” is not required by the Greek and makes the already concrete idiom cumbersome. Removing it retains the source phrasing more directly.
  revised_text: కాబట్టి, అతడు ప్రవక్తగా ఉండి, తన నడుము ఫలము నుండి ఒకరిని[a] తన సింహాసనం మీద కూర్చోబెడతాడని దేవుడు అతనికి ప్రమాణం చేసి వాగ్దానం చేశాడని ఎరిగి,
  revised_footnotes:
