source:
  edition: SBLGNT
  text: προφήτης οὖν ὑπάρχων, καὶ εἰδὼς ὅτι ὅρκῳ ὤμοσεν αὐτῷ ὁ θεὸς ἐκ καρποῦ τῆς ὀσφύος ⸀αὐτοῦ καθίσαι ἐπὶ ⸂τὸν θρόνον⸃ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/030.yaml
  text: Therefore[a], being a prophet and knowing that God had sworn to him with an oath to seat one from the fruit of his loins on his throne,
translation:
  language: te
  text: కాబట్టి, అతడు ప్రవక్తగా ఉండి, తన నడుము ఫలము నుండి ఒకరిని[a] తన సింహాసనం మీద కూర్చోబెడతాడని దేవుడు అతనికి ప్రమాణం చేసి వాగ్దానం చేశాడని ఎరిగి,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన వంశస్థులలో ఒకరిని.’ అక్షరార్థంగా, ‘తన నడుము ఫలము నుండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: προφήτης
  choice: ప్రవక్త
  rationale: దైవిక ప్రత్యక్షతను ప్రకటించే వ్యక్తికి ప్రామాణికమైన, సహజమైన తెలుగు పదం.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాదననుండి వచ్చే నిర్ధారణను సూచించే గ్రీకు అనుసంధానాన్ని నిలుపుతుంది.
- source_word: ὑπάρχων
  choice: ప్రవక్తగా ఉండి
  rationale: గ్రీకు వర్తమాన కృదంత నిర్మాణాన్ని సహజమైన తెలుగులో పరిస్థితి లేదా కారణ ఛాయతో నిలుపుతుంది.
- source_word: εἰδὼς
  choice: ఎరిగి
  rationale: ὑπάρχωνతో సమన్వయమైన కృదంత నిర్మాణాన్ని నిలుపుతూ గంభీరమైన ఆధునిక బైబిల్ తెలుగుకు సరిపోతుంది.
- source_word: ὅρκῳ ὤμοσεν αὐτῷ ὁ θεός
  choice: దేవుడు తనతో ప్రమాణపూర్వకంగా ఒట్టు పెట్టుకున్నాడని
  rationale: నామవాచకం మరియు క్రియ రెండూ కలిగించే గంభీరమైన ప్రమాణ భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐκ καρποῦ τῆς ὀσφύος αὐτοῦ
  choice: తన నడుము ఫలంలోనుండి వచ్చిన ఒకరిని
  rationale: శారీరక వంశపారంపర్యాన్ని సూచించే మూలపాఠంలోని స్పష్టమైన రూపకాన్ని ప్రధాన పాఠంలో నిలుపుతుంది; సాధారణ అర్థాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: καθίσαι
  choice: కూర్చోబెడతానని
  rationale: దేవుడే ఆ వంశస్థుణ్ణి సింహాసనంపై ప్రతిష్ఠిస్తాడనే causative భావాన్ని నిలుపుతుంది.
- source_word: ἐπὶ τὸν θρόνον αὐτοῦ
  choice: తన సింహాసనం మీద
  rationale: రాజ్యాభిషేక భాషను సహజంగా అందిస్తుంది; సందర్భంలో సింహాసనం దావీదుదిగా గ్రహించబడుతుంది.
theological_decisions:
- issue: దావీదుకు చేసిన మెస్సీయ సంబంధమైన రాజవంశ వాగ్దానం
  choice: వంశసంబంధమైన, సింహాసనారోహణ భాషను అలాగే ఉంచి, వచనంలో ‘మెస్సీయ’ అనే పదాన్ని చేర్చలేదు.
  alternative: ‘మెస్సీయను తన సింహాసనం మీద కూర్చోబెడతాడు’ అని వివరణాత్మకంగా అనువదించడం.
  rationale: సందర్భంలో పేతురు ఈ వాగ్దానాన్ని యేసుకు అన్వయిస్తాడు; అయితే ఈ వచనం స్వయంగా దావీదు వంశస్థుడు మరియు అతని సింహాసనం అనే రూపంలో ప్రమాణాన్ని చెబుతుంది. అందువల్ల క్రీస్తు సంబంధ అన్వయాన్ని పరిసర సందర్భానికే వదిలింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఇది తరువాతి వచనంలో కొనసాగుతున్న వాక్యభాగం కావడంతో చివర కామా ఉంచబడింది. ‘తన’ అనే పదాల సూచన సందర్భానుసారం దావీదునికే చెందుతుంది; మూలంలోని సూచనాత్మక స్వల్ప అస్పష్టతను అనవసరంగా విప్పలేదు.
