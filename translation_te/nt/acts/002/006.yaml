  to: ఈ శబ్దం వినిపించగా, జనసమూహం కూడివచ్చి అయోమయానికి గురైంది; ఎందుకంటే వారిలో ప్రతి ఒక్కరూ తమ సొంత మాండలికంలో మాట్లాడుతున్న వారిని వింటూ ఉన్నారు.[a]
