id: ACT.2.6
reference: Acts 2:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γενομένης δὲ τῆς φωνῆς ταύτης συνῆλθε τὸ πλῆθος καὶ συνεχύθη, ὅτι ⸀ἤκουον εἷς ἕκαστος τῇ ἰδίᾳ διαλέκτῳ λαλούντων αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/006.yaml
  text: And when this sound occurred[a], the crowd came together and was bewildered[b], because each one was hearing them speaking in his own dialect.
translation:
  language: te
  text: ఈ శబ్దం వినిపించగా, జనసమూహం కూడివచ్చి అయోమయానికి గురైంది; ఎందుకంటే వారిలో ప్రతి ఒక్కరూ తమ సొంత మాండలికంలో మాట్లాడుతున్న వారిని వింటూ ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ సొంత భాషలో.” గ్రీకు పదం విస్తృతార్థంలో భాషను కూడా సూచించవచ్చు; అయితే “మాండలికం” లూకా ఉపయోగించిన పదాన్ని మరింత దగ్గరగా ప్రతిబింబిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης ... τῆς φωνῆς ταύτης
  choice: ఈ శబ్దం వినిపించినప్పుడు
  rationale: జనిటివ్ అబ్సల్యూట్ కాలసంబంధ పరిస్థితిని సూచిస్తుంది. φωνή ఇక్కడ పెంతెకొస్తు సందర్భంలోని వినిపించే ఘటనను సూచిస్తున్నందున, సహజమైన తెలుగులో ‘శబ్దం వినిపించినప్పుడు’ అని అనువదించాం; అది ‘స్వరం’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: δέ
  choice: ప్రత్యేక పదంగా అనువదించకుండా వాక్యప్రవాహంలో వ్యక్తీకరించబడింది
  rationale: δέ స్వల్ప కథన అనుసంధానకం. తెలుగులో ‘ఈ ...ప్పుడు’తో వాక్యం సహజంగా కొనసాగుతుంది; ‘మరియు’ చేర్చడం కృత్రిమంగా ఉంటుంది.
- source_word: συνῆλθε τὸ πλῆθος
  choice: జనసమూహం అక్కడికి చేరుకొని
  rationale: συνέρχομαι ఒక చోటికి కూడివచ్చడాన్ని, πλῆθος పెద్ద ప్రజాసమూహాన్ని సూచిస్తాయి. సందర్భంలో శబ్దం విని ఆ స్థలానికి చేరిన భావాన్ని ‘అక్కడికి చేరుకొని’ సహజంగా తెలియజేస్తుంది.
- source_word: συνεχύθη
  choice: అయోమయానికి గురైంది
  rationale: పాసివ్ రూపం జనసమూహం గందరగోళం లేదా దిగ్భ్రాంతి చెందిన స్థితిని సూచిస్తుంది. ‘అయోమయానికి గురైంది’ ఆధునిక, గౌరవప్రదమైన తెలుగు.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: జనసమూహం అయోమయపడడానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: ἤκουον
  choice: వింటూ ఉన్నారు
  rationale: ఇంపర్ఫెక్ట్ రూపంలోని కొనసాగుతున్న లేదా పునరావృత వినికిడిని తెలుగులో ‘వింటూ ఉన్నారు’ వ్యక్తం చేస్తుంది.
- source_word: εἷς ἕκαστος
  choice: వారిలో ప్రతి ఒక్కరూ
  rationale: ప్రతి వ్యక్తి విడివిడిగా అనుభవించిన విషయాన్ని గ్రీకు పంపిణీయ బలం నొక్కి చెబుతుంది; ‘ప్రతి ఒక్కరూ’ దాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τῇ ἰδίᾳ διαλέκτῳ
  choice: తమ సొంత మాండలికంలో
  rationale: διάλεκτος ప్రాంతీయ లేదా మాతృభాషా మాటతీరును, అలాగే విస్తృతంగా భాషను సూచించగలదు. ‘మాండలికం’ లూకా పదప్రయోగంలోని నిర్దిష్టతను కాపాడుతుంది; ‘తమ సొంత’ ప్రతి ఒక్కరితో పంపిణీయంగా అనుసంధానమవుతుంది.
- source_word: λαλούντων αὐτῶν
  choice: వారు మాట్లాడడం
  rationale: సర్వనామం ముందు ప్రస్తావించబడిన వక్తలను సూచిస్తుంది. ‘వారు’ అని ఉంచడం ద్వారా పాఠ్యంలో లేని ‘అపొస్తలులు’ వంటి మరింత సంకుచిత గుర్తింపును చేర్చలేదు.
theological_decisions:
- issue: ప్రతి వ్యక్తిని సూచించే లింగవ్యక్తీకరణ
  choice: వారిలో ప్రతి ఒక్కరూ తమ సొంత మాండలికంలో
  alternative: వారిలో ప్రతి పురుషుడు తన సొంత మాండలికంలో
  rationale: గ్రీకు εἷς ἕκαστος వ్యాకరణపరంగా పుంలింగ ఏకవచనమైనా, ఇక్కడ జనసమూహంలోని వ్యక్తులను పంపిణీయంగా సూచిస్తుంది. తెలుగు ‘ప్రతి ఒక్కరూ ... తమ’ నిర్మాణం ఆ వ్యక్తిగత బలాన్ని కాపాడుతూ అనవసరంగా పురుషులకు మాత్రమే పరిమితం చేయదు.
- issue: διάλεκτος యొక్క అర్థపరిధి
  choice: మాండలికం
  alternative: భాష
  rationale: ఈ పదం ‘భాష’ లేదా ‘మాండలికం’ రెండింటినీ సూచించగలదు. ప్రధాన పాఠ్యంలో ‘మాండలికం’ మూలపదానికి దగ్గరగా ఉంటుంది; విస్తృత ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా అసలైన పదార్థ సందిగ్ధతను నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. కొనసాగుతున్న వినికిడిని ‘వింటూ ఉన్నారు’తో, ప్రతి వ్యక్తికి సంబంధించిన పంపిణీయ భావాన్ని ‘ప్రతి ఒక్కరూ తమ’తో వ్యక్తం చేశాం. పాదటిప్పణి గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
