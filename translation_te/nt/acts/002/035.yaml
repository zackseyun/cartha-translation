translation:
  language: te
  text: నేను నీ శత్రువులను నీ పాదాల పాదపీఠంగా ఉంచే వరకు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “నేను నీ శత్రువులను నీ పాదాల పాదపీఠంగా పెట్టే వరకు.”'
    reason: lexical_alternative
  - marker: b
    text: ఈ వాక్యం రాజు/మెస్సీయకు సంబంధించిన రాజాభిషేక కీర్తన అయిన కీర్తన 110:1ను ప్రతిధ్వనిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: ἕως ἂν
  choice: వరకు
  rationale: ముందటి ప్రకటన అమలులో ఉండే భావి కాలబిందువును సూచించే సహజమైన తెలుగు కాలసంబంధ ప్రయోగం.
- source_word: θῶ
  choice: ఉంచే
  rationale: τίθημι యొక్క ప్రాథమిక అర్థమైన ‘పెట్టు/ఉంచు’ను కాపాడుతూ, పాదపీఠం అనే రూపకంతో సహజంగా సరిపోతుంది.
- source_word: τοὺς ἐχθρούς σου
  choice: నీ శత్రువులను
  rationale: వ్యక్తిగతమైనదీ రాజుకు విరోధమైనదీ అయిన భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: ὑποπόδιον
  choice: పాదపీఠంగా
  rationale: పాదాలు పెట్టుకునే పీఠం అనే స్పష్టమైన రూపకాన్నీ, శత్రువులు లోబడే రాజసంబంధ చిత్రాన్నీ నిలుపుతుంది.
- source_word: τῶν ποδῶν σου
  choice: నీ పాదాలకు
  rationale: మూలంలోని షష్ఠీ సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ ‘నీ పాదాల పాదపీఠం’ అనే అసహజ పునరుక్తిని నివారిస్తుంది.
theological_decisions:
- issue: కీర్తన 110:1లోని రాజసంబంధ శత్రులోబాటు రూపకం
  choice: ‘నీ పాదాలకు పాదపీఠంగా’ అనే దృశ్యరూపాన్ని యథాతథంగా నిలుపడం
  alternative: ‘నీ శత్రువులను పూర్తిగా నీకు లోబరచే వరకు’
  rationale: ఇది కీర్తన 110:1 ప్రతిధ్వని; శత్రువుల సంపూర్ణ ఓటమి అని వివరణాత్మకంగా మార్చకుండా, రాజాభిషేక/మెస్సీయ సంబంధ అంతర్గ్రంథీయ బలాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని రాజసంబంధ రూపకాన్ని వివరణాత్మకంగా మార్చకుండా కాపాడింది; ‘పాదాలకు పాదపీఠంగా’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
