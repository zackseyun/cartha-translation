id: ACT.2.20
reference: Acts 2:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ἥλιος μεταστραφήσεται εἰς σκότος καὶ ἡ σελήνη εἰς αἷμα πρὶν ⸀ἢ ⸀ἐλθεῖν ἡμέραν κυρίου τὴν μεγάλην καὶ ἐπιφανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/020.yaml
  text: The sun will be turned into darkness[a], and the moon into blood, before the great and glorious day of the Lord comes.
translation:
  language: te
  text: సూర్యుడు చీకటిగా మార్చబడతాడు, చంద్రుడు రక్తంగా మార్చబడతాడు; గొప్పదీ మహిమాన్వితమైనదీ అయిన ప్రభువు దినం రాకముందు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεταστραφήσεται
  choice: మార్చబడతాయి
  rationale: భవిష్యత్‌కాల కర్మణి భావాన్ని నిలుపుతూ, సూర్యుడు మరియు చంద్రుడు పొందే మార్పును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: εἰς σκότος
  choice: చీకటిగా
  rationale: εἰς సూచించే ఫలితస్థితిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς αἷμα
  choice: రక్తంగా
  rationale: ప్రవచనాత్మక చిత్రణలోని తీవ్రతను వ్యాఖ్యానాత్మకంగా ‘రక్తవర్ణంగా’ అని మార్చకుండా యథాతథంగా కాపాడుతుంది.
- source_word: πρὶν ἢ ἐλθεῖν
  choice: రాకముందు
  rationale: ఒక సంఘటన మరొకదానికి ముందు జరుగుతుందనే కాలసంబంధాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἡμέραν κυρίου
  choice: ప్రభువు దినం
  rationale: దైవిక ప్రత్యక్షత లేదా తీర్పును సూచించే స్థిరమైన ప్రవచనాత్మక పదబంధాన్ని కాపాడుతుంది; ఆదివారాన్ని సూచించే భావంతో కలవకుండా ఉంటుంది.
- source_word: μεγάλην
  choice: గొప్పదీ
  rationale: μέγας యొక్క సాధారణ అర్థమైన ‘గొప్ప’ను ఉన్నతమైన ప్రవచన శైలిలో నిలుపుతుంది.
- source_word: ἐπιφανῆ
  choice: మహిమాన్వితమైనదీ
  rationale: సందర్భంలోని ఉన్నతమైన అంత్యకాల స్వరాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘ప్రత్యక్షమైనది’ లేదా ‘విశిష్టమైనది’ అనే అర్థసాధ్యతలను పాదటిప్పణిలో ఉంచుతుంది.
theological_decisions:
- issue: యోవేలు ప్రవచనాన్ని ఉదహరించే సందర్భంలో ἡμέραν κυρίου అనే పదబంధం
  choice: ప్రభువు దినం
  alternative: ప్రభువుకు చెందిన దినం
  rationale: పాత నిబంధన ప్రవచన నేపథ్యంలోని దైవిక సందర్శన లేదా తీర్పు దినం అనే భావాన్ని నిలుపుతుంది; తరువాతి సంఘ సంప్రదాయంలో ఆదివారానికి వాడే అర్థాన్ని అనవసరంగా దిగుమతి చేయదు.
- issue: అంత్యకాల సందర్భంలో ἐπιφανῆ యొక్క అర్థవ్యాప్తి
  choice: మహిమాన్వితమైనది
  alternative: ప్రత్యక్షమైనది; విశిష్టమైనది
  rationale: ఈ పదం కనిపించేది లేదా ప్రస్ఫుటమైనది అనే భావంతో పాటు విశిష్టమైనది లేదా మహిమాన్వితమైనది అనే భావాన్నీ కలిగి ఉండగలదు. ప్రధాన పాఠ్యంలో సహజమైన ఉన్నత శైలిని ఎంచుకుని, నిజమైన పదార్థ వైవిధ్యాన్ని పాదటిప్పణిలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ప్రవచన వాక్యానికి తగిన గంభీరతతో అనువదించబడింది. గ్రీకు వాక్యంలోని సమాంతర చిత్రణను ‘సూర్యుడు చీకటిగా, చంద్రుడు రక్తంగా’ అని నిలిపి, కర్మణి భావాన్ని ‘మార్చబడతాయి’ ద్వారా కాపాడాం.
