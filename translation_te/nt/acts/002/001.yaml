id: ACT.2.1
reference: Acts 2:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐν τῷ συμπληροῦσθαι τὴν ἡμέραν τῆς πεντηκοστῆς ἦσαν ⸂πάντες ὁμοῦ⸃ ἐπὶ τὸ αὐτό,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/001.yaml
  text: And when the day of Pentecost had fully come[a], they were all together in one place.
translation:
  language: te
  text: పెంతెకొస్తు దినం వచ్చి చేరినప్పుడు[a], వారందరూ ఒకే చోట కలిసి ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పెంతెకొస్తు దినం పూర్తిగా వచ్చినప్పుడు.”
    reason: συμπληροῦσθαι అనే పదం పూర్తికి చేరే/పూర్తిగా వచ్చి చేరే భావాన్ని సూచించగలదు; ప్రధాన పాఠం తెలుగులో సహజమైన కాలసంబంధ ప్రయోగాన్ని ఇస్తుంది.
lexical_decisions:
- source_word: συμπληροῦσθαι
  choice: నెరవేరుతూ ఉన్నప్పుడు
  rationale: ἐν τῷ తో కూడిన వర్తమాన కర్మణి క్రియార్థక రూపం కాలసంబంధ నిర్మాణాన్ని ఏర్పరుస్తుంది. ఈ అనువాదం దినం పూర్తిగా సమీపిస్తున్న ప్రక్రియాభావాన్ని నిలుపుతుంది; సహజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: πεντηκοστῆς
  choice: పెంతెకొస్తు
  rationale: పస్కా తరువాత యాభై రోజుల సందర్భంలో వచ్చే యూదుల పండుగకు కొత్త నిబంధనలో వాడిన స్థిరమైన గ్రీకు పేరు ఇది; తెలుగులో ప్రాచుర్యంలో ఉన్న రూపాన్ని ఉపయోగించాం.
- source_word: πάντες
  choice: వారందరూ
  rationale: ముందటి సందర్భంలో ప్రస్తావించబడిన సమూహమంతటినీ సూచిస్తుంది; గ్రీకులో అంతర్లీనంగా ఉన్న కర్తను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁμοῦ
  choice: కలిసి
  rationale: సమూహంగా, కలిసివున్న భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐπὶ τὸ αὐτό
  choice: ఒకే చోట
  rationale: ఈ నుడికారం ఒకే స్థలంలో ఉండడాన్ని లేదా కలిసి ఉండడాన్ని సూచించగలదు. ὁμοῦను ‘కలిసి’ అని అనువదించినందున, దీనిని ‘ఒకే చోట’ అని ఇవ్వడం పునరుక్తిని తగ్గిస్తూ స్థలభావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ἦσαν క్రియలో అంతర్లీనంగా ఉన్న కర్త ఎవరు?
  choice: వారందరూ ఒకే చోట కలిసి ఉన్నారు
  alternative: అందరూ ఒకే చోట కలిసి ఉన్నారు
  rationale: గ్రీకు వాక్యం కర్తను మళ్లీ స్పష్టంగా పేర్కొనదు; ముందు సందర్భం నుంచి అది గ్రహించబడుతుంది. తెలుగులో ‘వారు’ చేర్చడం కథన సంబంధాన్ని సహజంగా చూపుతుంది; ఏ ప్రత్యేక సిద్ధాంత నిర్ణయాన్నీ జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘నెరవేరుతూ ఉన్నప్పుడు’ మూలంలోని ప్రక్రియాభావాన్ని కాపాడుతుంది; ‘ఒకే చోట కలిసి’ అనేది ὁμοῦ మరియు ἐπὶ τὸ αὐτό రెండింటి భావాలను వేరువేరుగా నిలుపుతుంది.
