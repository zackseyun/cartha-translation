  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑμῖν γάρ ἐστιν ἡ ἐπαγγελία καὶ τοῖς τέκνοις ὑμῶν καὶ πᾶσι τοῖς εἰς μακρὰν ὅσους ἂν προσκαλέσηται κύριος ὁ θεὸς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/039.yaml
  text: For the promise is for you and for your children and for all who are far off[b][a], as many as the Lord our God calls.
translation:
  language: te
  text: ఎందుకంటే, ఈ వాగ్దానం మీకోసం, మీ పిల్లలకోసం, దూరంగా ఉన్న వారందరికోసం[a] ఉంది—అంటే మన దేవుడైన ప్రభువు ఎవరిని పిలుస్తాడో వారందరికోసం[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దూరంలో ఉన్న వారందరికోసం.’ ఈ మాట భౌగోళికంగా దూరంగా ఉన్నవారిని, దేవుని నిబంధనకు దూరంగా ఉన్నవారిని, లేదా ఇరువర్గాల వారినీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘మన దేవుడైన ప్రభువు ఎవరెవరిని పిలుస్తాడో వారందరికోసం.’ గ్రీకులో అక్షరార్థంగా ‘మన దేవుడైన ప్రభువు ఎంతమందిని పిలుస్తాడో’ అనే భావం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελία
  choice: వాగ్దానం
  rationale: సందర్భంలో పరిశుద్ధాత్మ వరం ప్రస్తావించబడినప్పటికీ, గ్రీకు నామవాచకం నేరుగా ‘వాగ్దానం’నే సూచిస్తుంది; ‘వాగ్దానం చేసిన వరం’ అని విస్తరించలేదు.
- source_word: τέκνοις
  choice: పిల్లలకు
  rationale: కుటుంబ సంబంధాన్ని సహజంగా తెలియజేస్తుంది; వయస్సును అనవసరంగా నిర్దిష్టం చేయకుండా పిల్లలు లేదా సంతానం అనే భావాన్ని నిలుపుతుంది.
- source_word: πᾶσι τοῖς εἰς μακράν
  choice: దూరంగా ఉన్న వారందరికీ
  rationale: భౌగోళిక దూరాన్నీ, దేవుని నిబంధనకు దూరంగా ఉండడాన్నీ సూచించగల మూలభాషలోని విస్తృత భావాన్ని పరిమితం చేయదు.
- source_word: ὅσους ἂν προσκαλέσηται
  choice: ఎంతమందిని పిలుస్తాడో అంతమందికీ
  rationale: నిర్దిష్ట సంఖ్యను చెప్పకుండా, దేవుడు పిలిచే వారందరినీ కలుపుకొనే గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగులో ప్రతిబింబిస్తుంది; ‘తనవద్దకు’ అనే మూలంలో స్పష్టంగా లేని మాటను చేర్చదు.
- source_word: κύριος ὁ θεὸς ἡμῶν
  choice: మన దేవుడైన ప్రభువు
  rationale: ‘ప్రభువు’ మరియు ‘మన దేవుడు’ అనే రెండు గుర్తింపులను సహజమైన తెలుగు సమాస నిర్మాణంలో నిలుపుతుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ఈ వాక్యం ముందున్న పేతురు పిలుపుకు కారణం లేదా వివరణను అందిస్తున్న సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐστιν
  choice: చెందుతుంది
  rationale: వాగ్దానం ఆయా వ్యక్తుల ‘కొరకు ఉంది’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘దూరంగా ఉన్నవారు’ అనే మాట పరిధి
  choice: ఏ ఒక్క వర్గానికీ పరిమితం చేయకుండా ‘దూరంగా ఉన్న వారందరికీ’ అని అనువదించబడింది.
  alternative: దూరప్రాంతాల్లోని యూదులు మాత్రమే; అన్యజనులు మాత్రమే; లేదా భౌగోళికంగానూ నిబంధనపరంగానూ దూరంగా ఉన్నవారు
  rationale: వాక్యంలోని పదబంధం భౌగోళిక లేదా నిబంధనపరమైన దూరాన్ని సూచించవచ్చు; మూలపాఠం స్వయంగా ఒకే అర్థాన్ని నిర్బంధించదు.
- issue: దేవుని పిలుపు స్వభావం
  choice: ‘ప్రభువు ఎంతమందిని పిలుస్తాడో అంతమందికీ’ అని, పిలుపు ఎలా కార్యసిద్ధి చెందుతుందో నిర్వచించకుండా అనువదించబడింది.
  alternative: తప్పక ఫలించే ప్రత్యేక పిలుపు; అందరికీ అందే సాధారణ ఆహ్వానం
  rationale: వాగ్దానం దేవుడు పిలిచేవారికి చెందుతుందని గ్రీకు స్పష్టంగా చెబుతుంది; అయితే ఈ వాక్యం ఆ పిలుపు యొక్క విధానాన్ని వివరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘మీకూ, మీ పిల్లలకూ’ అనే సమాంతర నిర్మాణం వాక్య లయను నిలుపుతుంది; డాష్‌లు చివరి పరిమితి/వివరణ భాగాన్ని చదవడానికి స్పష్టంగా వేరు చేస్తాయి.
