revisions:
- from: ఎందుకంటే ఆ వాగ్దానం మీకూ, మీ పిల్లలకూ, దూరంగా ఉన్న వారందరికీ[a]—మన దేవుడైన ప్రభువు ఎంతమందిని పిలుస్తాడో అంతమందికీ[b]—చెందుతుంది.
  to: ఎందుకంటే, ఈ వాగ్దానం మీకోసం, మీ పిల్లలకోసం, దూరంగా ఉన్న వారందరికోసం[a] ఉంది—అంటే మన దేవుడైన ప్రభువు ఎవరిని పిలుస్తాడో వారందరికోసం[b].
  rationale: 'The revision renders the dative recipients consistently with ‘కోసం,’ includes the contextual definiteness of ‘the promise’ with ‘ఈ వాగ్దానం,’ and uses ‘అంటే’ to make explicit the grammatical qualification already present in the Greek: the far-off people in view are as many as the Lord our God calls. It does not specify who the far-off are or define the nature of divine calling.'
