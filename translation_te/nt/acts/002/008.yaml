  yaml_path: translation/nt/acts/002/008.yaml
  text: And how is it that each of us hears in our own native language?[a]
translation:
  language: te
  text: అయితే, మనలో ప్రతి ఒక్కరం మనం పుట్టిన మన సొంత భాషలో[a] వినడం ఎలా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనం పుట్టిన మన సొంత మాండలికంలో.”
    reason: διάλεκτος అనే గ్రీకు పదానికి ‘భాష’ లేదా ‘మాండలికం’ అనే అర్థాలు సాధ్యమైనందున ఈ ప్రత్యామ్నాయాన్ని ఇస్తున్నాం.
lexical_decisions:
- source_word: πῶς
  choice: ఎలా?
  rationale: ఈ పదం ఆశ్చర్యంతో కూడిన ప్రశ్నను పరిచయం చేస్తుంది; తెలుగు ప్రశ్న నిర్మాణంలో ‘ఎలా?’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἡμεῖς … ἕκαστος
  choice: మనలో ప్రతి ఒక్కరం
  rationale: ἡμεῖς యొక్క సమూహ చేర్పును, ἕκαστος యొక్క వ్యక్తిగత పంపిణీ భావాన్ని కలిపి సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀκούομεν
  choice: వినడం
  rationale: గ్రీకులో వర్తమాన కాలంలోని ప్రత్యక్ష అనుభవాన్ని ప్రశ్నార్థక తెలుగు నిర్మాణంలో సహజంగా నిలుపుతుంది.
- source_word: τῇ ἰδίᾳ διαλέκτῳ ἡμῶν
  choice: సొంత భాషలో
  rationale: ἰδίᾳ యొక్క ‘సొంత’ భావాన్ని ఉంచుతూ, διάλεκτος సూచించగల భాష/మాండలికం పరిధిలో సాధారణ పాఠకులకు సహజమైన ‘భాష’ను ప్రధాన పాఠంలో ఎంచుకుంది.
- source_word: ἐν ᾗ ἐγεννήθημεν
  choice: తాము పుట్టిన ప్రాంతపు
  rationale: అక్షరార్థంగా ‘దేనిలో మనం పుట్టామో’ అనే సంబంధవాక్యం ఆ భాష పుట్టుకతో ముడిపడిన స్థానిక భాష అని సూచిస్తుంది. తెలుగులో ‘భాషలో పుట్టడం’ అసహజంగా ఉండటంతో ప్రాంత సంబంధాన్ని స్పష్టంగా వ్యక్తం చేసింది.
theological_decisions: []
translation_notes:
  register: ఆశ్చర్యంతో అడిగిన సమూహ ప్రశ్నగా, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా మరియు గౌరవప్రదంగా రూపొందించబడింది. ‘మనలో ప్రతి ఒక్కరం’ వ్యక్తిగత అనుభవాన్ని నొక్కిచెబుతుంది; [a] ప్రధాన పాఠంలోని ‘భాష’కు సాధ్యమైన ‘మాండలికం’ అర్థాన్ని భద్రపరుస్తుంది.
