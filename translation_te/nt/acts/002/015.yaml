  terminology: '"మత్తులో లేరు" appropriately renders the allegation of drunkenness in a neutral, natural register. "పగటి మూడవ గంట" preserves the ancient Jewish time designation, and the footnote gives its approximate modern equivalent without replacing it in the text.'
