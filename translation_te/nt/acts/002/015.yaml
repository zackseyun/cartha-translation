translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని వాదనాత్మక కారణసంబంధం మరియు ప్రాచీన కాలవ్యక్తీకరణ నిలుపబడ్డాయి; సాంస్కృతిక వివరణను పాదటిప్పణికి పరిమితం చేశాం.
