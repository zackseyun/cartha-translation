  yaml_path: translation/nt/acts/002/015.yaml
  text: For these are not drunk[a], as you suppose, for it is the third hour of the day.
translation:
  language: te
  text: వీరు మీరు అనుకుంటున్నట్లుగా మత్తులో లేరు; ఎందుకంటే ఇప్పుడు పగటి మూడవ గంటే[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, యూదుల కాలగణన ప్రకారం ఉదయం దాదాపు తొమ్మిది గంటలు.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ γὰρ
  choice: లేరు. ఎందుకంటే
  rationale: γάρ ముందున్న ఆరోపణకు పేతురు ఇచ్చే వివరణను సూచిస్తుంది; తెలుగులో రెండు సహజ వాక్యాలుగా విభజించి దాని కారణార్థక బలాన్ని నిలిపాం.
- source_word: ὡς ὑμεῖς ὑπολαμβάνετε
  choice: మీరు అనుకుంటున్నట్లుగా
  rationale: ὑπολαμβάνετε ఇక్కడ ‘అనుకోవడం/ఊహించడం’ అనే భావం ఇస్తుంది; ὑμεῖςలోని ప్రత్యక్ష సంబోధనను ‘మీరు’ నిలుపుతుంది.
- source_word: οὗτοι
  choice: వీరు
  rationale: సమీపంలోని ఆరోపిత సమూహాన్ని సూచించే గ్రీకు నిర్దేశక సర్వనామానికి సహజమైన తెలుగు రూపం; మూలంలో లేని ‘పురుషులు’ లేదా ‘ప్రజలు’ను చేర్చలేదు.
- source_word: μεθύουσιν
  choice: మత్తులో లేరు
  rationale: సందర్భంలో ఇది మద్యం వల్ల కలిగిన మత్తు స్థితిని సూచిస్తుంది; ‘మత్తులో’ అనే పదం సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας
  choice: ఎందుకంటే ఇది పగటిలో మూడవ గంట
  rationale: రెండవ γάρ ఇచ్చే కారణాన్ని స్పష్టంగా చూపిస్తూ, యూదుల కాలగణనలోని ‘మూడవ గంట’ అనే మూల వ్యక్తీకరణను ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: ὥρα τρίτη
  choice: మూడవ గంట
  rationale: మూలానికి సన్నిహితమైన కాలవ్యక్తీకరణను పాఠ్యంలో ఉంచి, ఆధునిక సమాన సమయాన్ని పాదటిప్పణిలో వివరించాం.
