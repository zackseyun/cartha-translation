source:
  edition: SBLGNT
  text: καὶ ὤφθησαν αὐτοῖς διαμεριζόμεναι γλῶσσαι ὡσεὶ πυρός, ⸂καὶ ἐκάθισεν⸃ ἐφ’ ἕνα ἕκαστον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/003.yaml
  text: And tongues like fire appeared to them, being divided, and it came to rest on each one of them[a].
translation:
  language: te
  text: విడివిడిగా పంచబడుతున్న అగ్నివంటి నాలుకలు వారికి కనిపించాయి; ఆ దృశ్యం వారిలో ప్రతి ఒక్కరి మీద నిలిచింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అగ్నివంటి విడివిడిగా పంచబడిన నాలుకలు,” లేదా “అగ్నివలె ఉన్న నాలుకలు.” గ్రీకు పదబంధం కనిపించిన దృశ్యాన్నీ, అది వారిలో ప్రతి ఒక్కరికి పంపిణీ అయిన భావాన్నీ సూచిస్తుంది. చివరి క్రియ ఏకవచనంలో ఉండడం, ఈ దృశ్యాన్ని సమష్టిగా సూచించవచ్చు.
    reason: పదబంధ నిర్మాణంలోని ప్రత్యామ్నాయాలను, అలాగే బహువచన ‘నాలుకలు’తో సంబంధమున్న చివరి ఏకవచన క్రియ యొక్క సమష్టి-సూచక అవకాశాన్ని వివరించడానికి.
lexical_decisions:
- source_word: ὤφθησαν
  choice: కనిపించాయి
  rationale: ఈ సందర్భంలో క్రియ దృశ్యంగా ప్రత్యక్షమవడాన్ని సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో ‘కనిపించాయి’ ఆ భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: ఈ దృశ్యం ఎవరికి కనిపించిందో తెలిపే దత్తివాచక భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: διαμεριζόμεναι
  choice: అవి విడిపోతూ ఉండగా
  rationale: వర్తమాన మధ్యమ/కర్మణి కృదంతంలోని కొనసాగుతున్న విభజన భావాన్ని కాపాడుతుంది; పూర్తిగా ‘విభజించబడిన’ అని ఫలితాన్ని మాత్రమే నిర్ధారించదు.
- source_word: γλῶσσαι
  choice: నాలుకలు
  rationale: అగ్నిజ్వాలలవంటి ఆకారాన్ని, తరువాత వచ్చే భాషల సంబంధాన్ని రెండింటినీ నిలుపుతుంది; ‘జ్వాలలు’ అని అనువదిస్తే మూలపదపు ద్వంద్వ ప్రతిధ్వని పోతుంది.
- source_word: ὡσεὶ πυρός
  choice: అగ్నిలాంటి
  rationale: ὡσεὶ సూచించే పోలికను కాపాడుతూ, అవి నిజంగా అగ్నే అని చెప్పకుండా సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐκάθισεν
  choice: అది ... నిలిచింది
  rationale: మూలంలోని ఏకవచన క్రియను ఉద్దేశపూర్వకంగా నిలుపుతుంది. దృశ్య ప్రత్యక్షతను సమష్టిగా సూచిస్తుందా లేదా పంపిణీ అయిన ఒక్కొక్క రూపాన్ని సూచిస్తుందా అన్న అస్పష్టతను పరిష్కరించదు.
- source_word: ἐφ’ ἕνα ἕκαστον αὐτῶν
  choice: వారిలో ప్రతి ఒక్కరి మీద
  rationale: అక్కడున్న ప్రతి వ్యక్తిపైనా అది పంపిణీ అయిందనే బలమైన వ్యక్తిగత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పెంతెకొస్తు సందర్భంలోని దృశ్య ప్రత్యక్షత స్వభావం
  choice: ‘అగ్నిలాంటి నాలుకలు’ అని అనువదించడం
  alternative: ‘అగ్నిజ్వాలలు’ లేదా ‘అగ్నివంటి భాషలు’
  rationale: మూలపాఠం పోలికను సూచించే ὡσεὶతో పాటు γλῶσσαι అనే పదాన్ని వాడుతుంది. కాబట్టి ఇది నిజమైన అగ్ని అని గానీ, కేవలం మాట్లాడే భాషలేనని గానీ ముందుగానే నిర్ణయించకుండా దృశ్యరూపాన్నీ మాట/భాషలతో ఉన్న సంబంధాన్నీ నిలుపుతుంది.
- issue: బహువచన ‘నాలుకలు’ తరువాత ఏకవచన క్రియ
  choice: ‘అది ... నిలిచింది’ అని ఏకవచనాన్ని నిలుపడం
  alternative: ‘అవి ... నిలిచాయి’
  rationale: ἐκάθισεν ఏకవచనం. తెలుగులో కొంత అసాధారణంగా అనిపించినా, ప్రత్యక్షతను సమష్టిగా చూసే అవకాశం సహా మూలంలోని వ్యాకరణ ఉద్వేగాన్ని తొలగించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలిని అనుసరించాం. ‘నాలుకలు’ అనే చిత్రాన్ని నిలిపి, ‘అగ్నిలాంటి’ ద్వారా పోలికను స్పష్టంచేశాం. మూలంలోని కృదంత భావం మరియు చివరి ఏకవచన క్రియ వల్ల ఏర్పడే నిజమైన అస్పష్టతను పాదటిప్పణితో సహా కాపాడాం.
