id: ACT.2.41
reference: Acts 2:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ μὲν ⸀οὖν ἀποδεξάμενοι τὸν λόγον αὐτοῦ ἐβαπτίσθησαν, καὶ προσετέθησαν ⸀ἐν τῇ ἡμέρᾳ ἐκείνῃ ψυχαὶ ὡσεὶ τρισχίλιαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/041.yaml
  text: So those who received his word were baptized[a], and about three thousand souls were added on that day.
translation:
  language: te
  text: కాబట్టి ఆయన వాక్యాన్ని స్వీకరించినవారు బాప్తిస్మం పొందారు; ఆ రోజున దాదాపు మూడు వేలమంది[a] చేర్చబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా ‘ప్రాణాలు’; ఇక్కడ అది మనుషులను లెక్కించేటప్పుడు వాడే సాధారణ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποδεξάμενοι
  choice: స్వీకరించినవారు
  rationale: ఈ క్రియ సందేశాన్ని సానుకూలంగా స్వీకరించడాన్ని సూచిస్తుంది. ‘స్వీకరించినవారు’ సహజంగా ఉండి, మూలంలోని అనుకూల స్పందనను అతిగా వ్యాఖ్యానించకుండా తెలియజేస్తుంది.
- source_word: λόγον
  choice: వాక్యాన్ని
  rationale: ఇక్కడ λόγος పేతురు ప్రకటించిన సందేశాన్ని సూచిస్తుంది. ‘వాక్యం’ గ్రీకు పదానికి సన్నిహితంగా ఉండటంతో పాటు అపొస్తలుల కార్యముల సందర్భంలో సహజమైన బైబిలు పదప్రయోగం.
- source_word: ἐβαπτίσθησαν
  choice: బాప్తిస్మం పొందారు
  rationale: గ్రీకులోని భూతకాల కర్మణి రూపాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; బాప్తిస్మ విధానం లేదా దాని ప్రభావం గురించి ఏ ప్రత్యేక సంప్రదాయ భావాన్నీ చేర్చదు.
- source_word: προσετέθησαν
  choice: చేర్చబడ్డారు
  rationale: పెరుగుతున్న విశ్వాసుల సమూహంలో చేర్చబడటాన్ని సూచించే కర్మణి రూపాన్ని నేరుగా నిలుపుతుంది. ఎవరికి లేదా దేనికి చేర్చబడ్డారో ఈ వచనంలో స్పష్టంగా చెప్పనందున దాన్ని అనువాదంలో చేర్చలేదు.
- source_word: ψυχαὶ
  choice: ప్రాణాలు
  rationale: ψυχή పదానికి పారదర్శకమైన అనువాదం. ఇక్కడ అది మనుషులను లెక్కించే సాధారణ ప్రయోగం కావడంతో, అపార్థాన్ని నివారించేందుకు ‘వ్యక్తులు/ప్రజలు’ అనే భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ὡσεὶ τρισχίλιαι
  choice: దాదాపు మూడువేల
  rationale: ὡσεί సూచించే సుమారు సంఖ్యను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἱ μὲν οὖν
  choice: కాబట్టి … వారు
  rationale: ముందటి ప్రసంగానికి వచ్చిన ఫలితాన్ని, కథన పురోగతిని తెలియజేసే కణసముదాయ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: ఆ రోజున
  rationale: కాలాన్ని సూచించే గ్రీకు పదబంధానికి సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: ‘చేర్చబడ్డారు’ అనే క్రియకు ‘సంఘానికి’ లేదా ‘వారికి’ అనే లక్ష్యాన్ని స్పష్టంగా చేర్చాలా
  choice: లక్ష్యాన్ని చేర్చకుండా ‘చేర్చబడ్డారు’ అని ఉంచాం
  alternative: ‘వారితో చేర్చబడ్డారు’ లేదా ‘సంఘంలో చేర్చబడ్డారు’
  rationale: ఈ వచనంలోని గ్రీకు పాఠం చేర్చబడిన లక్ష్యాన్ని స్పష్టంగా పేర్కొనదు. సందర్భం విశ్వాసుల సమాజాన్ని సూచించినప్పటికీ, మూలంలో లేని సంఘశాస్త్ర సంబంధిత స్పష్టీకరణను అనువాదం చేర్చదు.
- issue: ψυχαί పదంలోని మానవ స్వరూప సంబంధిత భావం
  choice: ప్రధాన పాఠంలో ‘ప్రాణాలు’ అని ఉంచి, ‘వ్యక్తులు/ప్రజలు’ అనే సాధారణ అర్థాన్ని పాదసూచికలో తెలిపాం
  alternative: ‘వ్యక్తులు’ లేదా ‘ప్రజలు’
  rationale: మూలపదాన్ని పారదర్శకంగా నిలుపుతూనే, దీనిని శరీరానికి వేరైన అమూర్త భాగం గురించిన సాంకేతిక ప్రకటనగా పాఠకులు భావించకుండా దాని సందర్భోచిత అర్థాన్ని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘వాక్యం,’ ‘బాప్తిస్మం’ వంటి స్థిరమైన బైబిలు పదాలను నిలుపుతూ, వాక్య నిర్మాణాన్ని సహజంగా ఉంచాం.
