revisions:
- from: కాబట్టి ఆయన వాక్యాన్ని స్వీకరించినవారు బాప్తిస్మం పొందారు; ఆ రోజున దాదాపు మూడువేల ప్రాణాలు[a] చేర్చబడ్డారు.
  to: కాబట్టి ఆయన వాక్యాన్ని స్వీకరించినవారు బాప్తిస్మం పొందారు; ఆ రోజున దాదాపు మూడు వేలమంది[a] చేర్చబడ్డారు.
  rationale: The revision renders ψυχαί contextually as ‘మంది,’ the natural modern Telugu counting expression for persons, while the footnote preserves the Greek wording and explains its idiomatic force. No object is supplied for ‘చేర్చబడ్డారు,’ since the Greek leaves it implicit.
