review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the positive reception of Peter’s word, baptism, the approximate number, and the passive ‘were added.’ However, ψυχαί in this counting idiom denotes people, not disembodied ‘souls’ or ‘lives’; Telugu ‘ప్రాణాలు’ is not idiomatic here and creates an unwanted semantic ambiguity.
  naturalness: ‘దాదాపు మూడువేల ప్రాణాలు చేర్చబడ్డారు’ is unnatural in modern standard Telugu. ‘మూడు వేలమంది’ is the normal Telugu way to count people and agrees naturally with the personal passive verb.
  terminology: ‘వాక్యం’ and ‘బాప్తిస్మం’ are suitable established biblical terms. The lexical fact that Greek literally has ‘souls’ should be retained in a footnote, but it should not govern an unnatural Telugu main-text rendering.
  issues:
  - severity: medium
    issue: ‘ప్రాణాలు’ is used as the main rendering of ψυχαὶ.
    rationale: In this context ψυχαί is a conventional Greek expression for persons. In Telugu, ‘ప్రాణాలు’ normally means lives/life-breath and is not a natural count noun for people; with ‘చేర్చబడ్డారు’ it also produces an awkward number/agreement mismatch.
  revised_text: కాబట్టి ఆయన వాక్యాన్ని స్వీకరించినవారు బాప్తిస్మం పొందారు; ఆ రోజున దాదాపు మూడు వేలమంది[a] చేర్చబడ్డారు.
  revised_footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా ‘ప్రాణాలు’; ఇక్కడ అది మనుషులను లెక్కించేటప్పుడు వాడే సాధారణ ప్రయోగం.
    reason: lexical_alternative
  revision_rationale: The revision renders ψυχαί contextually as ‘మంది,’ the natural modern Telugu counting expression for persons, while the footnote preserves the Greek wording and explains its idiomatic force. No object is supplied for ‘చేర్చబడ్డారు,’ since the Greek leaves it implicit.
