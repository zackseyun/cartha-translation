id: ACT.2.28
reference: Acts 2:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγνώρισάς μοι ὁδοὺς ζωῆς, πληρώσεις με εὐφροσύνης μετὰ τοῦ προσώπου σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/028.yaml
  text: You made known to me the paths of life[b][a]; you will fill me with gladness with your presence.
translation:
  language: te
  text: జీవమార్గాలను నాకు తెలియజేశావు[a]; నీ సన్నిధిలో నన్ను ఆనందంతో నింపుతావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జీవపు మార్గాలను.”
    reason: lexical_alternative
  - marker: b
    text: పదశః, “నీ ముఖంతో”; అంటే, “నీ సన్నిధిలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισάς μοι
  choice: నాకు తెలియజేశావు
  rationale: Aorist active indicative with the dative indirect object. తెలుగు సహజ వాక్యనిర్మాణంలో ‘నాకు తెలియజేశావు’ causative భావాన్ని, ద్వితీయ ఏకవచనాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ὁδοὺς ζωῆς
  choice: జీవమార్గాలను
  rationale: ὁδούς యొక్క బహువచనాన్ని ‘మార్గాలు’ నిలుపుతుంది; ζωῆς‌తో కలిపిన సమాసరూపం జీవానికి సంబంధించిన లేదా జీవానికి నడిపించే మార్గాలు అనే మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
- source_word: πληρώσεις με εὐφροσύνης
  choice: నన్ను ఆనందంతో నింపుతావు
  rationale: Future active indicative ను ‘నింపుతావు’గా, genitive of content ను తెలుగు సాధనార్థక రూపం ‘ఆనందంతో’గా సహజంగా వ్యక్తం చేసింది.
- source_word: μετὰ τοῦ προσώπου σου
  choice: నీ సన్నిధిలో
  rationale: పదశః ‘నీ ముఖంతో’ అయిన ఈ సెమిటిక్ ప్రభావిత ప్రయోగం వ్యక్తిగత సమక్షాన్ని సూచిస్తుంది. ‘నీ సన్నిధిలో’ ఆధునిక తెలుగులో సహజంగా ఉండి దైవసమక్ష భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: కీర్తన ఉద్ధరణలో దేవుని ముఖం/సన్నిధి అనే ప్రయోగం
  choice: నీ సన్నిధిలో
  alternative: నీ ముఖసన్నిధిలో; నీ ముఖము ఎదుట
  rationale: ఈ ప్రయోగం దేవుని ప్రత్యక్ష సమక్షంలో కలిగే ఆనందాన్ని సూచిస్తుంది. ‘నీ సన్నిధిలో’ భావాన్ని స్పష్టంగా అందిస్తుంది; ఏ ప్రత్యేక సిద్ధాంతార్థాన్నీ అదనంగా చేర్చదు. పదశః రూపాన్ని పాదటిప్పణిలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కీర్తన ఉద్ధరణకు తగిన గౌరవభరిత శైలితో రూపొందించబడింది. మూలంలోని రెండు క్రియల కాలభేదం—‘తెలియజేశావు’ మరియు ‘నింపుతావు’—నిలుపబడింది.
