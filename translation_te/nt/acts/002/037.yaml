source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ κατενύγησαν ⸂τὴν καρδίαν⸃, εἶπόν τε πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους· Τί ⸀ποιήσωμεν, ἄνδρες ἀδελφοί;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/037.yaml
  text: When they heard this[a], they were pierced to the heart, and they said to Peter and the rest of the apostles, “What should we do[b], brothers?”
translation:
  language: te
  text: వారు ఇది విన్నప్పుడు[a], వారి హృదయాలు గుచ్చబడినట్లయ్యాయి. అప్పుడు వారు పేతురుతోను మిగతా అపొస్తలులతోను, “సోదరులారా, మేము ఏమి చేయాలి[b]?” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారు ఇది విని.” గ్రీకు రూపం వారు విన్నదానికి ప్రతిస్పందనగా జరిగిన చర్యను సూచిస్తుంది.
    reason: grammatical_alternative
  - marker: b
    text: గ్రీకులో ప్రశ్న తర్వాత అక్షరార్థంగా “పురుషులారా, సోదరులారా” అనే సంప్రదాయ సంబోధన ఉంది. సందర్భాన్ని బట్టి ఇది “సోదరులారా” లేదా విస్తృతంగా “సోదర సోదరీమణులారా” అనే భావంలో ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: వారు ఇది విన్నప్పుడు
  rationale: ఈ భూతకాల కృదంతం పేతురు ప్రసంగం విన్న తర్వాత వచ్చిన స్పందనను సూచిస్తుంది. సందర్భం నుంచి ‘ఇది’ సహజంగా పూరించబడింది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక కథన పురోగతిని సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో అదనపు అనుసంధాన పదం అవసరం లేదు.
- source_word: κατενύγησαν τὴν καρδίαν
  choice: హృదయంలో తీవ్రంగా గాయపడినవారై
  rationale: ఈ గ్రీకు నుడికారం తీవ్రమైన అంతరంగ వేదన లేదా పాపబోధను సూచిస్తుంది. ‘గాయపడినవారై’ అనే రూపకం మూలంలోని గుచ్చబడిన భావాన్ని నిలుపుతుంది; ‘తీవ్రంగా’ దాని బలాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: εἶπόν τε
  choice: అని అడిగారు
  rationale: మూల క్రియ అక్షరార్థంగా ‘అన్నారు’; అయితే వెంటనే వచ్చే విషయం ప్రశ్న కావడంతో తెలుగులో ‘అడిగారు’ సహజంగా ఉంటుంది. τε ముందరి చర్యతో సన్నిహిత అనుసంధానాన్ని చూపుతుంది.
- source_word: πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους
  choice: పేతురుతోనూ మిగతా అపొస్తలులతోనూ
  rationale: λοιπούς పేతురును మినహాయించిన మిగిలిన అపొస్తలులను సూచిస్తుంది. ‘మిగతా’ ఆ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: Τί ποιήσωμεν
  choice: మేమేమి చేయాలి
  rationale: ఇది తాము అనుసరించవలసిన కార్యమార్గం గురించి అడిగే deliberative aorist subjunctive. ‘చేయాలి’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: ἄνδρες ἀδελφοί
  choice: సోదరులారా
  rationale: ఇది గౌరవపూర్వకమైన సాంప్రదాయ సంబోధన. రెండు పదాలను యాంత్రికంగా ‘పురుషులారా, సోదరులారా’ అనడం తెలుగులో అసహజం; కుటుంబ సంబంధ పదమైన ‘సోదరులారా’ ప్రధాన భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ἄνδρες ἀδελφοί అనే లింగసూచక సంబోధన
  choice: సోదరులారా
  alternative: పురుషులారా, సోదరులారా; సోదర సోదరీమణులారా
  rationale: గ్రీకు రూపం వ్యాకరణపరంగా పుంలింగంలో ఉన్నప్పటికీ ఇది సాంప్రదాయ గౌరవ సంబోధనగా పనిచేస్తుంది. ప్రధాన పాఠ్యంలో పుంలింగ రూపాన్ని పూర్తిగా లింగతటస్థంగా మార్చకుండా ‘సోదరులారా’ అని ఉంచి, సందర్భానుసారంగా విస్తృత సమూహాన్ని సూచించే అవకాశాన్ని పాదటిప్పణిలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలిని అనుసరించాం. ‘అపొస్తలులు’ అనే స్థిరమైన బైబిలు పదాన్ని నిలుపుకున్నాం. మూలంలోని హృదయాన్ని గుచ్చే రూపకాన్ని మృదువుగా మార్చకుండా సహజ తెలుగు నుడికారంలో వ్యక్తం చేశాం.
