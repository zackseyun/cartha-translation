id: ACT.2.17
reference: Acts 2:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἔσται ἐν ταῖς ἐσχάταις ἡμέραις, λέγει ὁ θεός, ἐκχεῶ ἀπὸ τοῦ πνεύματός μου ἐπὶ πᾶσαν σάρκα, καὶ προφητεύσουσιν οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν, καὶ οἱ νεανίσκοι ὑμῶν ὁράσεις ὄψονται, καὶ οἱ πρεσβύτεροι ὑμῶν ⸀ἐνυπνίοις ἐνυπνιασθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/017.yaml
  text: And it will be in the last days[a], says God, that I will pour out from my Spirit on all flesh, and your sons and your daughters will prophesy, and your young men will see visions[b], and your old men will dream dreams.
translation:
  language: te
  text: '“అంత్య దినాల్లో ఇలా జరుగుతుంది” అని దేవుడు చెబుతున్నాడు:


    “నేను నా ఆత్మనుండి సమస్త మానవుల మీద కుమ్మరిస్తాను.[a]


    మీ కుమారులు, మీ కుమార్తెలు ప్రవచిస్తారు;


    మీ యువకులు దర్శనాలు చూస్తారు;


    మీ వృద్ధ పురుషులు కలలు కంటారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా, ‘సమస్త శరీరంపై’ అని ఉంది. ఇది ఇక్కడ సమస్త మానవులను సూచించే ప్రవచనాత్మక నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: అంత్య దినాల్లో
  rationale: కాలాన్ని సూచించే అంత్యకాల సంబంధమైన గ్రీకు పదబంధాన్ని సహజమైన, స్థిరపడిన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: λέγει ὁ θεός
  choice: అని దేవుడు చెబుతున్నాడు
  rationale: వర్తమానకాల ఉల్లేఖన సూత్రాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: ἐκχεῶ
  choice: కుమ్మరిస్తాను
  rationale: ద్రవాన్ని కుమ్మరించే స్పష్టమైన రూపకాన్ని సంక్షిప్తంగా, సహజంగా కాపాడుతుంది.
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: నా ఆత్మలోనుండి
  rationale: ἀπό సూచించే మూలం లేదా ఉద్భవాన్ని విస్మరించకుండా తెలుగులో వ్యక్తపరుస్తుంది; ‘నా ఆత్మను’ అని మార్చి మూలంలోని విభక్తి సంబంధాన్ని చెరపదు.
- source_word: ἐπὶ πᾶσαν σάρκα
  choice: శరీరులందరి మీద
  rationale: σάρξ యొక్క ప్రవచనాత్మక రూపచిత్రాన్ని నిలుపుతూ, బహువచన వ్యక్తిసూచక రూపం ద్వారా ఇది మానవులను సూచిస్తోందని తెలుగులో తెలియజేస్తుంది.
- source_word: προφητεύσουσιν
  choice: ప్రవచిస్తారు
  rationale: ప్రవచన సంబంధమైన ప్రత్యక్ష పదజాలాన్ని ఎటువంటి వివరణాత్మక విస్తరణ లేకుండా కాపాడుతుంది.
- source_word: οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν
  choice: మీ కుమారులు, మీ కుమార్తెలు
  rationale: గ్రీకులోని రెండు లింగవాచక వర్గాలను, ‘మీ’ అనే సూచన పునరుక్తిని నిలుపుతుంది.
- source_word: οἱ νεανίσκοι ὑμῶν
  choice: మీ యువకులు
  rationale: పురుష యువజనులను సూచించే పదాన్ని లింగపరంగా ఖచ్చితంగా అనువదిస్తుంది.
- source_word: ὁράσεις ὄψονται
  choice: దర్శనాలు చూస్తారు
  rationale: మూలంలోని సమానధాతు నిర్మాణ భావాన్ని సహజమైన తెలుగు ప్రయోగంతో అందిస్తుంది.
- source_word: οἱ πρεσβύτεροι ὑμῶν
  choice: మీ వృద్ధులు
  rationale: ఇక్కడ యువకులతో ఉన్న వయోభేద సమాంతరాన్ని కాపాడుతుంది; పదవిని సూచించే ‘పెద్దలు’ అనే సంభావ్య అపార్థాన్ని నివారిస్తుంది.
- source_word: ἐνυπνίοις ἐνυπνιασθήσονται
  choice: కలలు కంటారు
  rationale: కల అనే పదాన్ని పునరావృతం చేసే గ్రీకు సమానధాతు వ్యక్తీకరణకు సహజమైన తెలుగు సమానార్థక ప్రయోగం.
theological_decisions:
- issue: ‘సమస్త శరీరం’ అనే పదబంధపు పరిధి, ప్రవచనాత్మక నుడికారం
  choice: మూలంలోని ‘శరీరం’ రూపచిత్రాన్ని ‘శరీరులందరి మీద’గా ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: మనుషులందరి మీద; సమస్త మానవాళి మీద
  rationale: ఈ ఎంపిక యోవేలు ప్రవచనంతో ఉన్న పదసంబంధాన్ని, వాగ్దానపు విస్తృతిని కాపాడుతుంది; దాని మానవసమూహ సూచనను పాదసూచిక స్పష్టం చేస్తుంది.
- issue: దేవుని కుమ్మరింపులో πνεῦμα యొక్క సూచన
  choice: నా ఆత్మ
  alternative: నా ప్రాణం; నా ఊపిరి
  rationale: ఈ ప్రవచన సందర్భంలో పదం దేవుని ఆత్మనే సూచిస్తుంది; ఇతర ప్రత్యామ్నాయాలు అర్థాన్ని తప్పుదోవ పట్టించవచ్చు.
- issue: ἀπό వల్ల వ్యక్తమయ్యే ‘నుండి’ భావం
  choice: నా ఆత్మలోనుండి
  alternative: నా ఆత్మను
  rationale: మూలం దేవుడు తన ఆత్మను కుమ్మరిస్తాడని మాత్రమే కాక ‘నా ఆత్మ నుండి’ అని చెబుతుంది. ఆ భేదాన్ని సిద్ధాంతపరంగా వివరించకుండా అనువాదంలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన ప్రవచన శైలిని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఉపయోగించాం. గ్రీకు వాక్యంలోని సమాంతర పాదాలను పంక్తులుగా అమర్చి వాక్యలయాన్ని స్పష్టంచేశాం.
