  naturalness: The draft is generally fluent modern standard Telugu. Replacing the potentially ambiguous possessive pronoun with an explicit reference to Simon remains natural and improves clarity.
  terminology: “చర్మకారుడు” is an acceptable conventional Telugu rendering for βυρσεύς (“tanner”), though it can be somewhat broader in usage. No theological terminology is involved.
