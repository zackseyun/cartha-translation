  yaml_path: translation/nt/acts/010/006.yaml
  text: He is lodging with a certain Simon[a], a tanner, whose house is by the sea.
translation:
  language: te
  text: అతడు చర్మకారుడైన ఒక సీమోను వద్ద బస చేస్తున్నాడు; ఆ సీమోను ఇల్లు సముద్రం ఒడ్డున ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: అతడు
  rationale: సందర్భంలో ఈ పదం పేతురును తిరిగి సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన సర్వనామ రూపం.
- source_word: ξενίζεται
  choice: బస చేస్తున్నాడు
  rationale: ξενίζω యొక్క వర్తమాన మధ్యమ/కర్మణి రూపం ఇక్కడ మరొకరి వద్ద అతిథిగా ఉండడాన్ని సూచిస్తుంది; ‘బస చేస్తున్నాడు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: παρά τινι Σίμωνι
  choice: సీమోను అనే ఒక వ్యక్తి ఇంట్లో
  rationale: παρά దత్తివుతో వ్యక్తి వద్ద ఉండడాన్ని, τις అనిర్దిష్టతను సూచిస్తాయి. తెలుగులో ‘అనే ఒక వ్యక్తి ఇంట్లో’ అనేది స్థలసంబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: βυρσεῖ
  choice: చర్మకారుడైన
  rationale: βυρσεύς ముడి చర్మాలను శుద్ధి చేసి తోలుగా మార్చే వృత్తివానిని సూచిస్తుంది; ‘చర్మకారుడు’ సాధారణ ఆధునిక తెలుగులో సంక్షిప్తమైన సమీప పదం.
- source_word: ᾧ ἐστιν οἰκία
  choice: అతని ఇల్లు ఉంది
  rationale: సీమోనుకు చెందిన ఇంటిని తెలిపే గ్రీకు సంబంధ వాక్యాన్ని సహజమైన తెలుగు స్వతంత్ర ఉపవాక్యంగా ఇచ్చాం.
- source_word: παρὰ θάλασσαν
  choice: సముద్రం ఒడ్డున
  rationale: παρά + ద్వితీయా ఇక్కడ సమీప స్థానాన్ని సూచిస్తుంది; ‘సముద్రం ఒడ్డున’ ఖచ్చితమైన, సహజమైన తెలుగు ప్రయోగం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. గ్రీకు వాక్యంలోని సంబంధ ఉపవాక్యాన్ని తెలుగులో సహజత్వం కోసం అర్ధవిరామంతో రెండు భాగాలుగా అమర్చాం; అదనపు సిద్ధాంతార్థం చేర్చలేదు.
