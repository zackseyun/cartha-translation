id: ACT.10.31
reference: Acts 10:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ φησί· Κορνήλιε, εἰσηκούσθη σου ἡ προσευχὴ καὶ αἱ ἐλεημοσύναι σου ἐμνήσθησαν ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/031.yaml
  text: And he said[a], ‘Cornelius, your prayer has been heard, and your alms have been remembered before God.’
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “కొర్నేలీ, నీ ప్రార్థన వినబడింది; నీ దానధర్మాలు దేవుని సన్నిధిలో జ్ఞాపకానికి వచ్చాయి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φησί
  choice: అతడు ఇలా అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, ఈ కథన సందర్భంలో సహజమైన ఆధునిక తెలుగులో భూతకాల రూపం సముచితం.
- source_word: Κορνήλιε
  choice: కొర్నేలీ
  rationale: సంబోధన విభక్తిని సహజమైన తెలుగు రూపంలో నిలిపింది.
- source_word: εἰσηκούσθη
  choice: వినబడింది
  rationale: అయోరిస్ట్ కర్మణి రూపాన్ని సంక్షిప్తంగా నిలిపి, ప్రార్థనకు ఆలకింపు లభించిందనే అర్థాన్ని తెలియజేస్తుంది.
- source_word: ἡ προσευχὴ
  choice: నీ ప్రార్థన
  rationale: గ్రీకు ఏకవచనాన్ని యథాతథంగా నిలిపిన సాధారణ తెలుగు పదప్రయోగం.
- source_word: αἱ ἐλεημοσύναι
  choice: నీవు చేసిన దానధర్మాలు
  rationale: అవసరంలో ఉన్నవారిపట్ల కరుణతో ఇచ్చే సహాయాలు లేదా చేసే దయాకార్యాలను తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐμνήσθησαν
  choice: జ్ఞాపకం చేయబడ్డాయి
  rationale: కర్మణి భావాన్ని నిలిపి, దేవుని ఎదుట అవి స్మరణకు వచ్చాయనే గంభీరమైన బైబిలు భాషను కాపాడుతుంది.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: దేవుని సన్నిధిలో
  rationale: దేవుని సమక్షం మరియు ఆయన దృష్టిలో ఉన్న స్థితి రెండింటినీ సహజమైన తెలుగు బైబిలు ప్రయోగంతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: కొర్నేలీ చేసిన దయాకార్యాల భావం
  choice: దానధర్మాలు
  alternative: భిక్షలు; దయాకార్యాలు; దానాలు
  rationale: ఈ పదం అవసరంలో ఉన్నవారికి కరుణతో చేసే సహాయం లేదా ఇచ్చే దానాన్ని సూచిస్తుంది. వాక్యం పుణ్యం ద్వారా రక్షణ అనే సిద్ధాంతాన్ని నిర్దేశించదు; కాబట్టి అటువంటి భావాన్ని చేర్చకుండా కార్యాల స్పష్టమైన నైతిక స్వరూపాన్ని మాత్రమే నిలిపింది.
- issue: దైవిక జ్ఞాపక భాష
  choice: దేవుని సన్నిధిలో జ్ఞాపకం చేయబడ్డాయి
  alternative: దేవుడు గుర్తించాడు; దేవుడు గమనించాడు
  rationale: మూలంలోని కర్మణి నిర్మాణాన్నీ ‘జ్ఞాపకం’ అనే బైబిలు భావాన్నీ నిలిపింది. దానిని కేవలం ‘గమనించడం’గా సడలించలేదు; అదే సమయంలో రక్షణ లేదా పుణ్యఫల విధానాన్ని అదనంగా ప్రతిపాదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘దానధర్మాలు’ సాధారణ పాఠకులకు అర్థమయ్యే పదం; ‘దేవుని సన్నిధిలో జ్ఞాపకం చేయబడ్డాయి’ మూలంలోని గంభీరతను మరియు కర్మణి అస్పష్టతను నిలుపుతుంది.
