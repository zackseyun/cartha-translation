revisions:
- from: 'అతడు ఇలా అన్నాడు: “కొర్నేలీ, నీ ప్రార్థన వినబడింది; నీవు చేసిన దానధర్మాలు దేవుని సన్నిధిలో జ్ఞాపకం చేయబడ్డాయి.”'
  to: 'అతడు ఇలా అన్నాడు: “కొర్నేలీ, నీ ప్రార్థన వినబడింది; నీ దానధర్మాలు దేవుని సన్నిధిలో జ్ఞాపకానికి వచ్చాయి.”'
  rationale: The revision only replaces an unnatural passive idiom and removes an unnecessary explicitation. It retains the source’s singular ‘prayer,’ plural charitable acts, and reverent divine-remembrance formulation.
