source:
  edition: SBLGNT
  text: ἤκουον γὰρ αὐτῶν λαλούντων γλώσσαις καὶ μεγαλυνόντων τὸν θεόν. τότε ⸀ἀπεκρίθη Πέτρος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/046.yaml
  text: 'For they were hearing them speaking in tongues and magnifying God[a]. Then Peter answered:'
translation:
  language: te
  text: 'ఎందుకంటే, వారు భాషలలో[a] మాట్లాడుతూ దేవుణ్ణి మహిమపరుస్తుండగా, వీరు వింటూ ఉన్నారు. అప్పుడు పేతురు జవాబిచ్చాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేక, “నాలుకలతో మాట్లాడుతూ.” గ్రీకు పదం భాషను లేదా నాలుకను సూచించగలదు; ఇక్కడ ఈ మాటల స్వభావాన్ని నిర్దిష్టంగా నిర్ణయించలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουον
  choice: వీరు విన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న వినికిడిని సూచిస్తుంది; తెలుగులో సహజమైన భూతకాల రూపాన్ని వాడి, వారు వింటున్న చర్యల కొనసాగింపును ‘మాట్లాడుతూ… కొనియాడుతుండడం’ ద్వారా నిలిపాం.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను అందించే సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: αὐτῶν
  choice: వారు
  rationale: ముందు ప్రస్తావించబడిన వ్యక్తులను సూచించే సర్వనామంగానే ఉంచి, ‘యూదేతరులు’ వంటి వ్యాఖ్యానాత్మక నామాన్ని చేర్చలేదు.
- source_word: λαλούντων
  choice: మాట్లాడుతూ
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న చర్యను సహజమైన తెలుగు రూపంలో తెలియజేస్తుంది.
- source_word: γλώσσαις
  choice: భాషల్లో
  rationale: γλῶσσα అనేది ‘భాషలు’ లేదా ‘నాలుకలు/అన్యభాషలు’ అనే భావాలను ఇవ్వగలదు. ఆధునిక తెలుగులో ‘భాషల్లో మాట్లాడడం’ సహజంగా ఉండగా, మూలపదంలోని విస్తృతిని పాదటిప్పణిలో నిలిపాం.
- source_word: μεγαλυνόντων
  choice: గొప్పగా కొనియాడుతుండడం
  rationale: μεγαλύνωలోని ‘గొప్పగా ఎంచడం, ఘనపరచడం’ అనే భావాన్ని సహజమైన తెలుగు స్తుతి భాషలో వ్యక్తపరుస్తుంది; కొనసాగుతున్న చర్యను కూడా నిలుపుతుంది.
- source_word: τὸν θεόν
  choice: దేవుణ్ణి
  rationale: క్రియకు ప్రత్యక్ష కర్మగా ఉన్న సాధారణ, సహజ తెలుగు రూపం.
- source_word: τότε
  choice: అప్పుడు
  rationale: సంఘటనల క్రమంలో తదుపరి ఘట్టాన్ని సహజంగా సూచిస్తుంది.
- source_word: ἀπεκρίθη
  choice: ఇలా జవాబిచ్చాడు
  rationale: స్పష్టమైన ప్రశ్న ముందుగా లేకపోయినా, గ్రీకు క్రియలోని ‘జవాబివ్వడం/స్పందించడం’ అనే భావాన్ని నిలుపుతుంది; ‘ఇలా’ తరువాత వచ్చే ప్రత్యక్ష మాటలకు సహజంగా దారి తీస్తుంది.
- source_word: Πέτρος
  choice: పేతురు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
theological_decisions:
- issue: γλώσσαις అనే పదాన్ని ఆత్మ ప్రేరేపిత మాట సందర్భంలో ఎలా అనువదించాలి
  choice: భాషల్లో
  alternative: నాలుకలతో / అన్యభాషల్లో
  rationale: ఈ గ్రీకు పదం తెలిసిన మానవ భాషలనో, ప్రత్యేకమైన ఆత్మ ప్రేరేపిత మాటలనో సూచించగలదు. ప్రధాన పాఠ్యంలో సహజమైన తెలుగు పదాన్ని ఉంచి, ప్రసంగ స్వభావంపై ఉన్న వేదాంత చర్చను తీర్చివేయకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘వీరు… వారు’ అనే భేదం గ్రీకు వాక్యంలోని వినేవారు–మాట్లాడేవారు అనే రెండు సమూహాలను స్పష్టంగా ఉంచుతుంది.
