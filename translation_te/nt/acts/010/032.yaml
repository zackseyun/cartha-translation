  text: πέμψον οὖν εἰς Ἰόππην καὶ μετακάλεσαι Σίμωνα ὃς ἐπικαλεῖται Πέτρος· οὗτος ξενίζεται ἐν οἰκίᾳ Σίμωνος βυρσέως παρὰ ⸀θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/032.yaml
  text: Therefore send to Joppa and summon Simon[a], who is called Peter. He is lodging in the house of Simon, a tanner[b], by the sea.
translation:
  language: te
  text: కాబట్టి యొప్పేకు మనుషులను పంపి, పేతురు అని పిలువబడే సీమోనును పిలిపించు.[a] అతడు చర్మకారుడైన సీమోను ఇంట్లో, సముద్రం ఒడ్డున, అతిథిగా ఉంటున్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పిలిపించు’ అంటే అతనిని నీ దగ్గరకు రప్పించేందుకు కబురు పంపు అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పదం అతడు అక్కడ అతిథిగా ఆతిథ్యం పొందుతున్నాడని సూచిస్తుంది.
    reason: lexical_nuance
lexical_decisions:
- source_word: πέμψον οὖν εἰς Ἰόππην
  choice: కాబట్టి యొప్పేకు మనుషులను పంపి
  rationale: οὖν తెలిపే తార్కిక అనుసంధానాన్ని ‘కాబట్టి’ నిలుపుతుంది. πέμψον సందర్భంలో దూతలను పంపడాన్ని సూచిస్తున్నందున, తెలుగులో సహజంగా ఉండేందుకు కర్మను ‘మనుషులను’ అని స్పష్టం చేశాం; ఇది సందర్భసిద్ధమైన పూరణ.
- source_word: μετακάλεσαι
  choice: పిలిపించు
  rationale: ఎవరినైనా తన వద్దకు పిలిపించుకోవడం అనే మధ్యమ ప్రయోగ భావాన్ని ‘పిలిపించు’ సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: Σίμωνα ὃς ἐπικαλεῖται Πέτρος
  choice: పేతురు అని పిలువబడే సీమోనును
  rationale: సీమోనుకు పేతురు అనే మరో పేరు ఉందని మూలపాఠం చెప్పే విధానాన్ని నేరుగా నిలుపుతుంది.
- source_word: ξενίζεται
  choice: అతిథిగా ఉంటున్నాడు
  rationale: కేవలం నివసించడం కాక, మరొకరి ఆతిథ్యంలో ఉండడం అనే క్రియ యొక్క భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν οἰκίᾳ Σίμωνος βυρσέως
  choice: చర్మకారుడైన సీమోను ఇంట్లో
  rationale: βυρσεύς అనే వృత్తి సూచనను ‘చర్మకారుడు’గా, οἰκίαను ‘ఇల్లు’గా సహజమైన తెలుగు నిర్మాణంలో అందిస్తుంది.
- source_word: παρὰ θάλασσαν
  choice: సముద్రం ఒడ్డున ఉన్న
  rationale: సముద్రానికి ఆనుకుని ఉన్న స్థలాన్ని సూచించే παρά + accusative భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
