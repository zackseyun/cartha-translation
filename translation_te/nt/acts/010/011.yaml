source:
  edition: SBLGNT
  text: καὶ θεωρεῖ τὸν οὐρανὸν ἀνεῳγμένον καὶ ⸀καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ⸀ἀρχαῖς καθιέμενον ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/011.yaml
  text: and he sees heaven opened[a], and something like a large sheet descending, being lowered by its four corners to the earth[c][b],
translation:
  language: te
  text: అతడు పరలోకం తెరవబడి ఉండడాన్ని[a], పెద్ద వస్త్రంలాంటి ఏదో ఒకటి[b] దిగివస్తూ, దాని నాలుగు మూలల వద్ద పట్టుకొని[c] భూమి మీదికి దించబడుతూ ఉండడాన్ని చూశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆకాశం తెరవబడి ఉండడాన్ని.’ గ్రీకు పదం పరలోకాన్ని లేదా ఆకాశాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఏదో ఒక వస్తువు’ లేదా ‘ఒక పాత్ర.’ గ్రీకు పదబంధం ఉద్దేశపూర్వకంగా నిర్దిష్టంగా లేదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘దాని నాలుగు అంచుల వద్ద పట్టుకొని దింపబడుతూ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: చూశాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమాన కాలాన్ని తెలుగు కథనశైలికి సహజమైన భూతకాలంలో అనువదించాం; దర్శనాన్ని ప్రత్యక్షంగా గమనించాడనే భావం నిలిచింది.
- source_word: οὐρανὸν ἀνεῳγμένον
  choice: పరలోకం తెరవబడి ఉండడాన్ని
  rationale: οὐρανός అనే పదానికి ‘ఆకాశం’ లేదా ‘పరలోకం’ అనే రెండు అర్థాలు సాధ్యమైనా, ఇది దైవిక దర్శన సందర్భం కాబట్టి ‘పరలోకం’ ఎంచుకున్నాం; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: καταβαῖνον
  choice: దిగివస్తూ
  rationale: వస్తువు కిందికి కదులుతున్న నిరంతర చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: σκεῦός τι
  choice: ఏదో ఒకటి
  rationale: σκεῦος విస్తృతార్థక పదం; ‘పాత్ర’ లేదా ‘సాధనం’ అని నిర్దిష్టం చేయకుండా గ్రీకు మూలంలోని అనిర్దిష్టతను కాపాడుతుంది.
- source_word: ὡς ὀθόνην μεγάλην
  choice: పెద్ద వస్త్రంలాంటి
  rationale: ὡς సూచించే ఉపమానాన్ని నిలిపి, ὀθόνη యొక్క పెద్ద బట్ట లేదా పరుపుబట్ట వంటి రూపాన్ని పదార్థాన్ని అతిగా నిర్దిష్టం చేయకుండా తెలిపింది.
- source_word: τέσσαρσιν ἀρχαῖς
  choice: దాని నాలుగు మూలలతో
  rationale: వస్త్రంలాంటి దాని అంచులు లేదా చివరలు అనే భావంలో ἀρχαί ఇక్కడ ‘మూలలు’గా సహజంగా అర్థమవుతుంది.
- source_word: καθιέμενον
  choice: దించబడుతూ ఉండడాన్ని
  rationale: కర్మణి ప్రయోగాన్ని, కొనసాగుతున్న కిందికి దింపే చర్యను రెండింటినీ నిలిపింది.
- source_word: ἐπὶ τῆς γῆς
  choice: భూమి మీదికి
  rationale: కిందికి కదలికతో కలిసిన ἐπί గమ్యాన్ని సూచిస్తుంది; ‘భూమి మీదికి’ విస్తృత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దర్శన సందర్భంలో οὐρανός అనువాదం
  choice: పరలోకం
  alternative: ఆకాశం
  rationale: తెరవబడిన లోకం నుండి దర్శనంలోని వస్తువు దిగివస్తోంది కాబట్టి ‘పరలోకం’ ప్రకటనాత్మక సందర్భాన్ని బాగా నిలుపుతుంది; అయితే గ్రీకు పదంలోని సహజమైన ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో స్పష్టంగా ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. గ్రీకులోని ‘దిగివస్తూ’ మరియు ‘దించబడుతూ’ అనే సమీపార్థక క్రియలు రెండూ చర్యలోని స్వచలన రూపం మరియు కర్మణి రూపం మధ్య ఉన్న భేదాన్ని నిలుపుటకు ఉంచబడ్డాయి.
