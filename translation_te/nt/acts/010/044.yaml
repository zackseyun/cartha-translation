id: ACT.10.44
reference: Acts 10:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔτι λαλοῦντος τοῦ Πέτρου τὰ ῥήματα ταῦτα ἐπέπεσε τὸ πνεῦμα τὸ ἅγιον ἐπὶ πάντας τοὺς ἀκούοντας τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/044.yaml
  text: While Peter was still speaking these words[a], the Holy Spirit fell upon all those hearing the word.
translation:
  language: te
  text: పేతురు ఇంకా ఈ మాటలు చెబుతుండగా, పవిత్రాత్మ వాక్యాన్ని వింటున్న వారందరి మీదికి దిగివచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాక్యాన్ని వింటున్న వారందరి మీద పవిత్రాత్మ వచ్చాడు.”
    reason: ἐπέπεσεకు మరింత సరళమైన ‘వచ్చాడు’ అనే ప్రత్యామ్నాయం; వర్తమాన కృదంతమైన τοὺς ἀκούοντας యొక్క కొనసాగుతున్న భావాన్ని నిలుపుతుంది.
lexical_decisions:
- source_word: Ἔτι λαλοῦντος τοῦ Πέτρου
  choice: పేతురు ఇంకా … చెబుతుండగానే
  rationale: వర్తమాన కాల కృదంతంతో కూడిన స్వతంత్ర షష్ఠీ నిర్మాణం, పేతురు మాట్లాడడం కొనసాగుతుండగానే ప్రధాన సంఘటన జరిగిందనే సమకాలిక భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὰ ῥήματα ταῦτα
  choice: ఈ మాటలు
  rationale: ῥήματα ఇక్కడ పేతురు పలుకుతున్న మాటలను సూచిస్తుంది; ‘ఈ మాటలు’ ప్రత్యక్షంగా, సహజంగా ఉంది.
- source_word: ἐπέπεσε
  choice: దిగివచ్చాడు
  rationale: ఆత్మ ప్రజల మీదికి అకస్మాత్తుగా రావడాన్ని తెలిపే గ్రీకు క్రియ యొక్క సజీవతను నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా వినిపించే రూపం.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: పవిత్రాత్మ
  rationale: ఆధునిక తెలుగు క్రైస్తవ వాడుకలో స్పష్టమైన, ప్రామాణిక పదం.
- source_word: ἐπὶ πάντας τοὺς ἀκούοντας
  choice: వింటున్న వారందరి మీద
  rationale: వారు ఆ క్షణంలో వింటున్నారనే వర్తమాన కృదంత భావాన్ని, అలాగే πάντας అనే సమగ్రతను నిలుపుతుంది.
- source_word: τὸν λόγον
  choice: వాక్యాన్ని
  rationale: λόγος అనే మూలపదానికి సన్నిహితంగా ఉండి, పేతురు ప్రకటిస్తున్న మాట/సందేశం అనే భావపరిధిని పూర్తిగా ఒకే వివరణకు పరిమితం చేయదు.
theological_decisions:
- issue: ἐπέπεσε ద్వారా పవిత్రాత్మ చర్యను అనువదించడం
  choice: పవిత్రాత్మ దిగివచ్చాడు
  alternative: పవిత్రాత్మ వచ్చాడు
  rationale: లూకా వాడిన సజీవమైన క్రియాభావాన్ని కాపాడుతుంది; అయితే ఆత్మను పొందడం లేదా బాప్తిస్మం గురించి వచనం చెప్పనిదేదీ అదనంగా చేర్చదు.
- issue: ప్రకటన సందర్భంలో λόγος అనువాదం
  choice: వాక్యం
  alternative: సందేశం
  rationale: ‘వాక్యం’ మూలపదంతో దగ్గరి సంబంధాన్ని ఉంచి, అది పేతురు ప్రకటించిన సందేశాన్ని సూచిస్తుందనే సందర్భార్థానికి కూడా వీలు కల్పిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘చెబుతుండగానే’ సమకాలికతను సహజంగా తెలియజేస్తుంది; ‘దిగివచ్చాడు’ మూలంలోని సజీవతను నిలుపుతుంది.
