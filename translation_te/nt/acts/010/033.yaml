id: ACT.10.33
reference: Acts 10:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐξαυτῆς οὖν ἔπεμψα πρὸς σέ, σύ τε καλῶς ἐποίησας παραγενόμενος. νῦν οὖν πάντες ἡμεῖς ἐνώπιον τοῦ θεοῦ πάρεσμεν ἀκοῦσαι πάντα τὰ προστεταγμένα σοι ὑπὸ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/033.yaml
  text: So I sent for you at once[a], and you did well to come. Now then[b], we are all here before God to hear everything that has been commanded to you by the Lord.
translation:
  language: te
  text: కాబట్టి, వెంటనే మీ దగ్గరికి మనుషులను పంపాను[a]. మీరు రావడం మంచిదే చేశారు. ఇప్పుడు అయితే మేమందరం దేవుని సన్నిధిలో ఉన్నాం—ప్రభువు మీకు ఆజ్ఞాపించినవన్నీ వినడానికి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఏ మాత్రం ఆలస్యం చేయకుండా.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో, ‘ప్రభువు.’ సందర్భంలో ఇది బహుశా యేసును సూచిస్తుంది; అయితే కొందరు దీనిని మరింత సాధారణంగా దేవునికి సూచనగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: వెంటనే
  rationale: ఈ క్రియావిశేషణం ఆలస్యం చేయకుండా తక్షణమే చేసిన చర్యను సూచిస్తుంది; ‘వెంటనే’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: మునుపటి మాటల నుంచి వచ్చే పర్యవసానాన్ని, కథన కొనసాగింపును సూచిస్తుంది.
- source_word: ἔπεμψα πρὸς σέ
  choice: మీ దగ్గరికి మనుషులను పంపాను
  rationale: అక్షరార్థంగా ‘మీ దగ్గరికి పంపాను’; సందర్భంలో కొర్నేలి పేతురును పిలిపించడానికి దూతలను పంపాడు. తెలుగులో కర్మను ఊహింపజేయకుండా ‘మనుషులను’ చేర్చడం సహజమైన సందర్భానుగుణ వ్యక్తీకరణ.
- source_word: σύ τε καλῶς ἐποίησας παραγενόμενος
  choice: మీరు రావడం మంచిదైంది
  rationale: పేతురు వచ్చినందుకు తెలిపిన ఆమోదాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘మీరు వచ్చి మంచి పని చేశారు’ కంటే ఇది సంభాషణలో సున్నితంగా ఉంటుంది.
- source_word: νῦν οὖν
  choice: ఇప్పుడు
  rationale: సమావేశ ఉద్దేశానికి మారే సంభాషణాత్మక మలుపును తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: πάντες ἡμεῖς
  choice: మేమందరం
  rationale: సమకూడిన కుటుంబ సభ్యులు, సన్నిహితులందరినీ కలుపుతూ గ్రీకు పదబంధంలోని సమష్టి ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: దేవుని సన్నిధిలో
  rationale: దేవుని సమక్షంలో ఉన్నామనే గంభీరమైన భావాన్ని సహజమైన తెలుగు ధార్మిక భాషలో నిలుపుతుంది.
- source_word: πάρεσμεν ἀκοῦσαι
  choice: ఉన్నాం—… వినడానికి
  rationale: πάρεσμεν యొక్క ‘హాజరై ఉన్నాం’ అనే అర్థాన్ని, ἀκοῦσαι సూచించే ఉద్దేశాన్ని స్పష్టంగా కలుపుతుంది.
- source_word: πάντα τὰ προστεταγμένα σοι
  choice: మీకు ఆజ్ఞాపించినవన్నీ
  rationale: προστάσσω లోని అధికారపూర్వక ఆదేశ భావాన్ని ‘ఆజ్ఞాపించిన’ నిలుపుతుంది; πάντα అనే సంపూర్ణతను ‘అవన్నీ’ తెలియజేస్తుంది.
- source_word: ὑπὸ τοῦ κυρίου
  choice: ప్రభువు
  rationale: గ్రీకులో ఉన్న κύριος అనే బిరుదును మాత్రమే అనువదించి, దాని సూచిత వ్యక్తిని ప్రధాన పాఠ్యంలో వివరణాత్మకంగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: τοῦ κυρίου (‘ప్రభువు’) ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘ప్రభువు’ అని మాత్రమే ఉంచడం
  alternative: సందర్భాన్ని బట్టి ‘యేసు’ అని స్పష్టీకరించడం, లేదా ముందున్న ‘దేవుని సన్నిధిలో’ అనే మాటను బట్టి ‘దేవుడు’ అని అర్థం చేసుకోవడం
  rationale: గ్రీకు పాఠ్యం ‘ప్రభువు’ అని మాత్రమే చెబుతుంది. అపొస్తలుల కార్యాలు 10 సందర్భంలో ఇది యేసును సూచించే అవకాశం బలంగా ఉన్నా, పేరు చేర్చడం మూలపాఠ్యంలోని నిజమైన సూచనాత్మక విస్తృతిని తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవార్థక ‘మీరు’ వాడబడింది. వాక్యం సాధారణ పాఠకులకు సహజంగా ఉండేలా, అదే సమయంలో ‘దేవుని సన్నిధిలో’ మరియు ‘ప్రభువు’ వంటి మూలపాఠ్య గంభీరతను నిలుపుకునేలా రూపొందించబడింది. ప్రధాన పాఠ్యంలో ఉన్న [a] గుర్తుకు అనుగుణంగా ఒక్క పదార్థ ప్రత్యామ్నాయ పాదటిప్పణి ఇవ్వబడింది.
