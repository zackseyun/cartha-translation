  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐν ἑαυτῷ διηπόρει ὁ Πέτρος τί ἂν εἴη τὸ ὅραμα ὃ εἶδεν, ⸀ἰδοὺ οἱ ἄνδρες οἱ ἀπεσταλμένοι ⸀ὑπὸ τοῦ Κορνηλίου διερωτήσαντες τὴν οἰκίαν ⸀τοῦ Σίμωνος ἐπέστησαν ἐπὶ τὸν πυλῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/017.yaml
  text: While Peter was inwardly perplexed as to what the vision that he had seen might mean[a], behold, the men who had been sent by Cornelius, having asked directions to Simon’s house[b], stood at the gate.
translation:
  language: te
  text: పేతురు తాను చూసిన ఆ దర్శనం ఏమై ఉండవచ్చో[a] అని తనలో తాను ఎంతో అయోమయపడుతూ ఉండగా, ఇదిగో, కొర్నేలి పంపిన మనుషులు సీమోను ఇంటి దారి అడిగి, గుమ్మం[b] దగ్గర నిలబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తాను చూసిన ఆ దర్శనం ఏమై ఉండవచ్చో.” గ్రీకు వాక్యం అక్షరార్థంగా దర్శనం “ఏమై ఉండవచ్చో” అని ఉంది; సందర్భంలో ఇది దర్శనం యొక్క అర్థం లేదా ప్రాముఖ్యతను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ప్రవేశద్వారం దగ్గర.” గ్రీకు పదం ఇంటి గేటును లేదా ప్రవేశ ప్రాంతాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: ఉండగా
  rationale: కొనసాగుతున్న పేతురు అంతరంగ ఆలోచనతో తదుపరి సంఘటన ఏకకాలంలో జరిగినట్లు సహజమైన తెలుగు కాలసంబంధ ఉపవాక్యంతో తెలియజేస్తుంది; δέ యొక్క స్వల్ప కథన పురోగతి సందర్భంలోనే వ్యక్తమవుతుంది.
- source_word: ἐν ἑαυτῷ
  choice: తనలో తాను
  rationale: పేతురు బాహ్యంగా మాట్లాడకుండా అంతరంగంలో ఆలోచిస్తున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: διηπόρει
  choice: తీవ్రంగా ఆలోచిస్తూ
  rationale: కేవలం సాధారణంగా ఆలోచించడం కాక, అయోమయంతో లోతుగా తర్జనభర్జన పడుతున్న భావాన్ని ఇస్తుంది; అపూర్ణ భూతకాల క్రియ సూచించే కొనసాగింపును ‘ఆలోచిస్తూ ఉండగా’ నిలుపుతుంది.
- source_word: τί ἂν εἴη
  choice: ఏమై ఉండవచ్చో
  rationale: గ్రీకు వాక్యంలోని ‘అది ఏమై ఉండవచ్చు’ అనే నిజమైన అస్పష్టతను నేరుగా నిలుపుతుంది; ‘దాని అర్థం ఏమిటో’ అని వ్యాఖ్యానాత్మకంగా నిర్ణయించదు.
- source_word: τὸ ὅραμα ὃ εἶδεν
  choice: తాను చూసిన ఆ దర్శనం
  rationale: ὅραμαను ‘దర్శనం’గా, సంబంధ ఉపవాక్యాన్ని సంక్షిప్తమైన సహజ తెలుగు రూపంలో అందిస్తుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: కథనంలో అకస్మాత్తుగా దృష్టిని కొత్త పరిణామంపైకి మళ్లించే మూలపాఠంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: οἱ ἄνδρες οἱ ἀπεσταλμένοι ὑπὸ τοῦ Κορνηλίου
  choice: కొర్నేలి పంపించిన మనుషులు
  rationale: పంపినవాడు కొర్నేలి అని స్పష్టంగా ఉంచుతూ, సందర్భంలోని పురుషులను సాధారణ ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: διερωτήσαντες τὴν οἰκίαν τοῦ Σίμωνος
  choice: సీమోను ఇంటి గురించి అడిగి తెలుసుకొని
  rationale: వారు ఆ ఇంటి స్థానం లేదా దారి గురించి విచారించి తెలుసుకున్నారని సహజంగా తెలియజేస్తుంది; ప్రధాన క్రియకు ముందే ఈ చర్య పూర్తయిందనే ఏఓరిస్ట్ కృదంత క్రమాన్ని నిలుపుతుంది.
- source_word: ἐπέστησαν
  choice: నిలబడ్డారు
  rationale: వారు అక్కడికి చేరుకొని ఒక స్థలంలో నిలిచారనే భావాన్ని తరువాతి స్థానవాచక పదబంధంతో కలిపి నేరుగా అందిస్తుంది.
- source_word: ἐπὶ τὸν πυλῶνα
  choice: గుమ్మం దగ్గర
  rationale: πυλών సూచించగల ఇంటి గేటు లేదా ప్రవేశ ప్రాంతాన్ని సాధారణ తెలుగు గృహసందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దర్శనం యొక్క స్వరూపమా లేక అర్థమా అన్న τί ἂν εἴη యొక్క అస్పష్టత
  choice: ఏమై ఉండవచ్చో
  alternative: దాని అర్థం ఏమై ఉండవచ్చో
  rationale: మూలపాఠం అక్షరార్థంగా దర్శనం ‘ఏమై ఉండవచ్చు’ అని చెబుతుంది. సందర్భం దాని అర్థం లేదా ప్రాముఖ్యతను సూచించవచ్చుగానీ, ప్రధాన వచనంలో ఆ వ్యాఖ్యానాన్ని నిర్బంధించకుండా అస్పష్టతను నిలిపి, పాదటిప్పణిలో ప్రత్యామ్నాయాన్ని తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇదిగో’ మూలపాఠపు దృష్టి ఆకర్షణను నిలుపుతుంది. ‘తీవ్రంగా ఆలోచిస్తూ’ అనే రూపం పేతురు కొనసాగుతున్న అయోమయాన్ని సాధారణ పాఠకుడికి అర్థమయ్యేలా వ్యక్తం చేస్తుంది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన వచనంలో ఉన్నాయి.
