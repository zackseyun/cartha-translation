id: ACT.10.20
reference: Acts 10:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ ἀναστὰς κατάβηθι καὶ πορεύου σὺν αὐτοῖς μηδὲν διακρινόμενος, ⸀ὅτι ἐγὼ ἀπέσταλκα αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/020.yaml
  text: But get up[a], go down, and go with them, doubting nothing, because I have sent them.
translation:
  language: te
  text: కానీ నీవు లేచి, కిందికి దిగి, ఏమాత్రం సందేహించకుండా[a] వారితో వెళ్లు; ఎందుకంటే నేనే వారిని పంపాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎలాంటి భేదం చేయకుండా’; గ్రీకు పదబంధానికి ‘సందేహించకుండా’ లేదా ‘వెనుకాడకుండా’ అనే భావమూ, ‘భేదం చేయకుండా’ అనే భావమూ ఉండవచ్చు. రెండవ భావం ఈ అధ్యాయంలోని యూదులు–యూదేతరుల అంశాన్ని ప్రతిధ్వనించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: మునుపటి పరిస్థితికి వ్యతిరేకంగా ఇప్పుడు చేయవలసిన కార్యాన్ని సూచించే సహజమైన తెలుగు విరోధార్థక సంధానం.
- source_word: ἀναστὰς
  choice: నీవు లేచి
  rationale: తదుపరి ఆజ్ఞలతో వరుసగా ఉన్న ఆరిస్ట్ కృదంతాన్ని తక్షణ చర్యకు పిలుపుగా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κατάβηθι
  choice: కిందికి దిగి
  rationale: పేతురు మేడమీద ఉన్న సందర్భంలో క్రిందికి కదలడాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: πορεύου σὺν αὐτοῖς
  choice: వారితో వెళ్లు
  rationale: ప్రయాణం మరియు వారితో కలిసి వెళ్లడం అనే రెండు అంశాలను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: μηδὲν διακρινόμενος
  choice: ఏమాత్రం సందేహించకుండా
  rationale: ఈ సందర్భంలో వెనుకాడకపోవడం లేదా సందేహించకపోవడం అనే తక్షణ భావాన్ని సహజ తెలుగులో ఇస్తుంది; భేదం చూపకపోవడం అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: పేతురు ఆ ఆజ్ఞకు లోబడవలసిన కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: ἐγὼ ἀπέσταλκα αὐτούς
  choice: నేనే వారిని పంపాను
  rationale: ἐγώలోని కర్తృత్వ ఉద్ఘాటనను ‘నేనే’ నిలుపుతుంది; గ్రీకు పరిపూర్ణ కాలంలోని పూర్తయిన పంపింపు మరియు దాని ప్రస్తుత ఫలితాన్ని సందర్భం తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: μηδὲν διακρινόμενος అనే పదబంధానికి సందేహించకపోవడం మరియు భేదం చూపకపోవడం అనే భావాల మధ్య ఉన్న ద్వంద్వార్థం
  choice: ప్రధాన పాఠ్యంలో ‘ఏమాత్రం సందేహించకుండా’
  alternative: ‘ఎలాంటి భేదం చూపకుండా’ లేదా ‘ఏమాత్రం వెనుకాడకుండా’
  rationale: వచ్చిన వారితో వెళ్లాలా అనే పేతురు స్థితికి ‘సందేహించకుండా’ అనే భావం తక్షణ సందర్భంలో సరిపోతుంది. అయితే యూదులు–యూదేతరుల మధ్య భేదం చేయకూడదనే ఈ అధ్యాయం యొక్క విస్తృత అంశంతో ‘భేదం చూపకుండా’ అనే భావం ప్రతిధ్వనించవచ్చు; అందువల్ల ఆ భావాన్ని పాదటిప్పణిలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. ‘నేనే’ ద్వారా గ్రీకు కర్తృత్వ ఉద్ఘాటన నిలుపబడింది; నిజమైన పదార్థ సందిగ్ధత పాదటిప్పణిలో స్పష్టంగా సంరక్షించబడింది.
