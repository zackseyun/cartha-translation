id: ACT.10.23
reference: Acts 10:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰσκαλεσάμενος οὖν αὐτοὺς ἐξένισεν. Τῇ δὲ ἐπαύριον ⸀ἀναστὰς ἐξῆλθεν σὺν αὐτοῖς, καί τινες τῶν ἀδελφῶν τῶν ἀπὸ Ἰόππης συνῆλθον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/023.yaml
  text: So he invited them in and gave them lodging[a]. The next day he got up and went out with them[b], and some of the brothers from Joppa went with him.
translation:
  language: te
  text: కాబట్టి అతడు వారిని లోపలికి ఆహ్వానించి, వారికి బస కల్పించాడు[a]. మరుసటి రోజు అతడు లేచి వారితో బయలుదేరాడు; యొప్పేకు చెందిన సహోదరులలో కొందరు అతనితో వెళ్లారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారిని అతిథులుగా చేర్చుకున్నాడు.” గ్రీకు పదం వారికి బస ఇచ్చి ఆతిథ్యం చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “సహోదరులు” అని అనువదించిన గ్రీకు పదం పుంలింగ బహువచనం. తొలి క్రైస్తవ వాడుకలో ఇది కొన్ని సందర్భాల్లో “తోటి విశ్వాసులు,” అంటే సహోదర సహోదరీలు, అనే విస్తృత అర్థంలోనూ వాడబడవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσκαλεσάμενος
  choice: లోపలికి ఆహ్వానించి
  rationale: మధ్యమ ప్రయోగంలోని ఈ కృదంతం వారిని తాను ఉన్న చోటికి లోపలికి పిలిపించుకున్న భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘లోపలికి ఆహ్వానించి’ సహజంగా ఉండి ఆతిథ్య సందర్భాన్నీ నిలుపుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సంభాషణ ఫలితంగా జరిగిన చర్యను సూచిస్తుంది; ‘కాబట్టి’ ఆ కథన సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐξένισεν
  choice: వారికి బస కల్పించాడు
  rationale: ఇక్కడ ξενίζω అతిథులకు రాత్రి ఉండేందుకు వసతి ఇవ్వడాన్ని సూచిస్తుంది; ‘బస కల్పించాడు’ ఆ నిర్దిష్ట ఆతిథ్య చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Τῇ δὲ ἐπαύριον
  choice: మరుసటి రోజు
  rationale: కాలక్రమాన్ని తెలిపే సాధారణ గ్రీకు ప్రయోగానికి స్పష్టమైన, సహజమైన తెలుగు సమానం.
- source_word: ἀναστὰς
  choice: లేచి
  rationale: ‘లేచిన తరువాత’ అనే సరళ కదలికను సంక్షిప్తంగా నిలుపుతుంది; తరువాతి ἐξῆλθεν భావాన్ని ఇందులో కలిపివేయదు.
- source_word: ἐξῆλθεν
  choice: బయలుదేరాడు
  rationale: ప్రయాణ సందర్భంలో బయటికి వెళ్లి ప్రయాణం మొదలుపెట్టిన భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: σὺν αὐτοῖς
  choice: వారితో
  rationale: తోడుగా వెళ్లడాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τινες
  choice: కొందరు
  rationale: అనిర్దిష్ట బహువచనానికి కథన సందర్భంలో సహజమైన తెలుగు రూపం.
- source_word: ἀδελφῶν
  choice: సహోదరులు
  rationale: పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అపొస్తలుల కార్యాలలోని తోటి విశ్వాసుల అర్థాన్నీ సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: τῶν ἀπὸ Ἰόππης
  choice: యొప్పేకు చెందిన
  rationale: వారి ప్రాంతీయ సంబంధాన్ని తెలియజేస్తుంది; ‘నుండి’ అనే పదం వారు అప్పుడే అక్కడినుంచి వచ్చారనే అనవసర భావాన్ని కలిగించకుండా మూలంలోని గుర్తింపును నిలుపుతుంది.
- source_word: συνῆλθον αὐτῷ
  choice: అతనితో వెళ్లారు
  rationale: పేతురుతో ప్రయాణంలో తోడుగా వెళ్లిన భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సంభావ్య మిశ్రిత విశ్వాసుల సమూహ సందర్భంలో ἀδελφῶν అనువాదం
  choice: సహోదరులు
  alternative: తోటి విశ్వాసులు; సహోదర సహోదరీలు
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం. తొలి క్రైస్తవ వాడుకలో ఈ పదం విస్తృతంగా తోటి విశ్వాసులను సూచించే అవకాశం ఉన్నందున ఆ అర్థాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘బస కల్పించాడు’ ద్వారా ఆతిథ్యంలోని వసతి భావం స్పష్టమైంది; ‘సహోదరులు’ ద్వారా మూలంలోని వ్యాకరణ లింగం నిలుపబడగా, విస్తృత సంఘార్థం పాదసూచికలో ఇవ్వబడింది.
