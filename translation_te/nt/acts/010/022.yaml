id: ACT.10.22
reference: Acts 10:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Κορνήλιος ἑκατοντάρχης, ἀνὴρ δίκαιος καὶ φοβούμενος τὸν θεὸν μαρτυρούμενός τε ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων, ἐχρηματίσθη ὑπὸ ἀγγέλου ἁγίου μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ καὶ ἀκοῦσαι ῥήματα παρὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/022.yaml
  text: They said[a], “Cornelius, a centurion, a righteous man and one who fears God, and who is well spoken of by the whole nation of the Jews[e][d][c][b], was divinely instructed by a holy angel to summon you to his house and to hear words from you.”
translation:
  language: te
  text: 'వారు ఇలా అన్నారు: “కొర్నేలి అనే శతాధిపతి నీతిమంతుడు, దేవునికి భయపడేవాడు, మొత్తం యూద ప్రజలచే మంచి సాక్ష్యం పొందినవాడు.[a] నిన్ను తన ఇంటికి పిలిపించుకుని, నీ నుండి మాటలు వినాలని ఒక పవిత్ర దూత ద్వారా అతనికి దైవిక ఆదేశం అందింది.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యూదుల మొత్తం ప్రజాసమూహం చేత మంచి సాక్ష్యం పొందినవాడు.” ఇక్కడ “ప్రజాసమూహం” అనేది ఆధునిక రాజకీయ దేశాన్ని కాదు, యూద ప్రజలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఒక పవిత్ర దూత ద్వారా అతనికి దైవిక సందేశం అందింది.” ఈ గ్రీకు క్రియ దైవిక సమాచారాన్ని లేదా నిర్దేశాన్ని పొందడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: శతాధిపతి
  rationale: రోమా సైన్యంలో సుమారు వందమంది సైనికులకు అధికారిగా ఉన్న చారిత్రక హోదాను తెలిపే స్థిరమైన తెలుగు పదం.
- source_word: ἀνὴρ δίκαιος
  choice: నీతిమంతుడు
  rationale: ἀνήρ తెలుగులో విడిగా చెప్పనవసరం లేకుండా వ్యక్తిని సూచించే రూపంలో ఇమిడిపోతుంది; δίκαιοςలోని నైతిక-మతపరమైన భావాన్ని ‘నీతిమంతుడు’ నిలుపుతుంది.
- source_word: φοβούμενος τὸν θεόν
  choice: దేవునికి భయపడేవాడు
  rationale: దేవుని పట్ల భక్తిపూర్వక భయాన్ని సూచించే బైబిలు నుడికారాన్ని నిలుపుతుంది; కొర్నేలి ఆధ్యాత్మిక స్థితి గురించి అదనపు నిర్ధారణ చేయదు.
- source_word: μαρτυρούμενος
  choice: మంచి పేరు ఉంది
  rationale: ఇతరుల నుండి అనుకూల సాక్ష్యం పొందడం అనే కర్మణి భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων
  choice: యూదుల ప్రజలందరిలో
  rationale: ἔθνοςను ఆధునిక రాజకీయ దేశంగా కాక ప్రజాసమూహంగా తెలియజేస్తూ, మొత్తం యూద ప్రజల నుండి లభించిన సాక్ష్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐχρηματίσθη
  choice: దేవుని నుండి ఆదేశం వచ్చింది
  rationale: దైవిక సమాచారాన్ని పొందాడనే సందర్భార్థాన్ని స్పష్టంగా తెలుపుతుంది; కేవలం హెచ్చరిక అనే సంకుచిత అర్థానికి పరిమితం చేయదు.
- source_word: ἀγγέλου ἁγίου
  choice: ఒక పవిత్ర దూత ద్వారా
  rationale: ἁγίου అనే విశేషణాన్ని స్పష్టంగా నిలుపుతూ, దూత దైవిక సమాచారానికి మధ్యవర్తి అని తెలియజేస్తుంది.
- source_word: μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ
  choice: నిన్ను తన ఇంటికి పిలిపించి
  rationale: ఎవరినైనా తన దగ్గరకు రప్పించేందుకు కబురు పంపడం అనే మధ్యమ రూప భావాన్ని, గమ్యస్థానంతో సహా సహజ తెలుగులో అందిస్తుంది.
- source_word: ἀκοῦσαι ῥήματα παρὰ σοῦ
  choice: నీవు చెప్పే మాటలు వినాలని
  rationale: ῥήματα అనే ‘మాటలు’ భావాన్ని నిలుపుతూ, తెలుగు వాక్య నిర్మాణంలో సహజంగా ఉంటుంది; దానిని ఉపన్యాసం లేదా ప్రత్యేక సందేశంగా అతిగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: కొర్నేలి భక్తిని తరువాతి సిద్ధాంత వర్గీకరణలతో నిర్వచించకుండా అనువదించడం
  choice: నీతిమంతుడు, దేవునికి భయపడేవాడు
  alternative: భక్తుడు; నీతిమంతుడైన దైవభయంగలవాడు
  rationale: గ్రీకు పాఠం కొర్నేలిని యూద నైతిక-మతపరమైన భాషలో ప్రశంసిస్తుంది; అయితే అతని నిబంధన సంబంధ స్థితి లేదా రక్షణ స్థితిని నిర్వచించదు. ఈ అనువాదం ఆ ఉద్రిక్తతను అలాగే ఉంచుతుంది.
- issue: ἐχρηματίσθηలోని దైవిక సమాచార భావం
  choice: ఒక పవిత్ర దూత ద్వారా అతనికి దేవుని నుండి ఆదేశం వచ్చింది
  alternative: ఒక పవిత్ర దూత అతనికి హెచ్చరించాడు; అతనికి దైవసందేశం వచ్చింది
  rationale: సందర్భంలో ఇది హెచ్చరిక కంటే చేయవలసిన పనిని తెలిపే దైవిక నిర్దేశం. దేవుడే అంతిమ మూలమని, దూత మధ్యవర్తి అని అనువాదం తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘శతాధిపతి’ వంటి స్థిరమైన బైబిలు-చారిత్రక పదాన్ని ఉంచి, మిగతా వాక్యాన్ని సహజమైన తెలుగు క్రమంలో తీర్చిదిద్దాం. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోతాయి.
