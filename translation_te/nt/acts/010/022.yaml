revisions:
- from: 'వారు ఇలా అన్నారు: “శతాధిపతి కొర్నేలి నీతిమంతుడు, దేవునికి భయపడేవాడు. యూదుల ప్రజలందరిలో అతనికి మంచి పేరు ఉంది.[a] నిన్ను తన ఇంటికి పిలిపించి, నీవు చెప్పే మాటలు వినాలని ఒక పవిత్ర దూత ద్వారా అతనికి దేవుని నుండి ఆదేశం వచ్చింది.[b]”'
  to: 'వారు ఇలా అన్నారు: “కొర్నేలి అనే శతాధిపతి నీతిమంతుడు, దేవునికి భయపడేవాడు, మొత్తం యూద ప్రజలచే మంచి సాక్ష్యం పొందినవాడు.[a] నిన్ను తన ఇంటికి పిలిపించుకుని, నీ నుండి మాటలు వినాలని ఒక పవిత్ర దూత ద్వారా అతనికి దైవిక ఆదేశం అందింది.[b]”'
  rationale: The revision removes the unstated explicit phrase “from God,” while retaining the Greek verb’s divine-communication force. It also renders the favorable testimony as a passive reception of witness from the whole Jewish people and keeps the summons-and-hearing sequence intact in natural modern Telugu.
