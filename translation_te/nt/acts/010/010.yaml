id: ACT.10.10
reference: Acts 10:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγένετο δὲ πρόσπεινος καὶ ἤθελεν γεύσασθαι· παρασκευαζόντων δὲ ⸀αὐτῶν ⸀ἐγένετο ἐπ’ αὐτὸν ἔκστασις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/010.yaml
  text: He became very hungry and wanted to eat[a]; but while they were preparing it[b], a trance came over him.
translation:
  language: te
  text: ఆయనకు చాలా ఆకలి వేసి, తినాలని కోరుకున్నాడు[a]. వారు సిద్ధం చేస్తుండగా, ఆయనకు మైమరపు స్థితి కలిగింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రుచి చూడాలని కోరుకున్నాడు.’ గ్రీకు క్రియకు అక్షరార్థంగా ‘రుచి చూడడం’ అనే అర్థం ఉన్నా, ఇక్కడ అది తినడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పరవశ స్థితి కలిగింది.’ గ్రీకు పదం ఇక్కడ దర్శనాత్మక ప్రకటనతో సంబంధమున్న అసాధారణ చైతన్యస్థితిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ πρόσπεινος
  choice: ఆయనకు చాలా ఆకలి వేసి
  rationale: πρόσπεινος సాధారణ ఆకలికన్నా తీవ్రమైన ఆకలిని సూచిస్తుంది. తెలుగు సహజ కథనశైలిలో ‘చాలా ఆకలి వేసి’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἤθελεν γεύσασθαι
  choice: ఏదైనా తినాలని అనిపించింది
  rationale: γεύομαι అక్షరార్థంగా ‘రుచి చూడు’ అని అర్థమవగలిగినా, ఈ సందర్భంలో ఆహారం తినడాన్ని సూచిస్తుంది. ‘ఏదైనా’ అనేది గ్రీకు క్రియలో అంతర్లీనంగా ఉన్న ఆహారార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παρασκευαζόντων δὲ αὐτῶν
  choice: వారు భోజనం సిద్ధం చేస్తుండగా
  rationale: జెనిటివ్ అబ్సల్యూట్ సమకాలీన చర్యను సూచిస్తుంది. వస్తువు మూలపాఠంలో స్పష్టంగా లేకపోయినా, సందర్భం ఆహార సిద్ధీకరణను సూచిస్తున్నందున ‘భోజనం’ అని సహజంగా వ్యక్తం చేయబడింది.
- source_word: ἐγένετο ἐπ’ αὐτὸν ἔκστασις
  choice: ఆయనకు ఒక పరవశ స్థితి కలిగింది
  rationale: ఈ నిర్మాణం పేతురును అకస్మాత్తుగా ఆవరించిన అసాధారణ అనుభవస్థితిని సూచిస్తుంది. ‘పరవశ స్థితి’ తరువాతి దర్శనాత్మక ప్రకటనకు సరిపోతూ, కేవలం ఆశ్చర్యం అనే భావానికి పరిమితం చేయదు.
theological_decisions:
- issue: ἔκστασις సూచించే పేతురు అనుభవ స్వభావం
  choice: పరవశ స్థితి
  alternative: మైమరపు స్థితి; ఆశ్చర్యం
  rationale: వెంటనే దర్శనం వర్ణించబడుతున్నందున ఇది కేవలం భావోద్వేగ ఆశ్చర్యం కాదు. అయితే మూలపాఠంలో లేని ప్రత్యేక మర్మానుభవ సిద్ధాంతాన్ని చేర్చకుండా, అసాధారణ దర్శనసంబంధ స్థితిని మాత్రమే తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘పరవశ స్థితి’ అనే పదబంధం సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, ἔκστασις యొక్క దర్శనసంబంధ భావాన్ని అతిగా నిర్వచించకుండా నిలుపుతుంది.
