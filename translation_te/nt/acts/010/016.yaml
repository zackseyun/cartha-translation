revisions:
- from: ఇది మూడుసార్లు జరిగింది; వెంటనే ఆ వస్తువు[a] ఆకాశంలోకి[b] తీసుకుపోబడింది.
  to: ఇది మూడుసార్లు జరిగింది, వెంటనే ఆ వస్తువు[a] పరలోకానికి[b] తీసుకుపోబడింది.
  rationale: The revision changes only the primary rendering of οὐρανός from ‘ఆకాశం’ to ‘పరలోకం,’ because the vision’s movement from and return to the divine realm makes ‘heaven’ the strongest contextual sense. It preserves the source ambiguity in footnote b. Footnote a is clarified to preserve σκεῦος’s broad lexical range while noting, without overtranslating the verse, the sheet-like object identified by the broader context.
