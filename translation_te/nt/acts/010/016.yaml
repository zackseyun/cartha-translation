id: ACT.10.16
reference: Acts 10:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο ἐπὶ τρίς, καὶ ⸀εὐθὺς ἀνελήμφθη τὸ σκεῦος εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/016.yaml
  text: This happened three times[b][a], and immediately the vessel was taken up into heaven.
translation:
  language: te
  text: ఇది మూడుసార్లు జరిగింది, వెంటనే ఆ వస్తువు[a] పరలోకానికి[b] తీసుకుపోబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆ పాత్ర’ లేదా ‘ఆ పరికరం’. గ్రీకు పదం విస్తృత అర్థం కలిగినది; విస్తృత సందర్భంలో ఇది గుడ్డవంటి దానిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆకాశంలోకి’. గ్రీకు పదం ‘ఆకాశం’ లేదా ‘పరలోకం’ అని అర్థమవవచ్చు; అయితే ఈ దర్శన సందర్భంలో ‘పరలోకం’ మరింత అనుకూలం.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο δὲ ἐγένετο
  choice: ఇది జరిగింది
  rationale: τοῦτο ముందున్న దర్శన ఘటనను సూచిస్తుంది; δέ ఇక్కడ స్వల్ప అనుసంధానక పదం కాబట్టి తెలుగులో ప్రత్యేకంగా అనువదించకుండానే సహజ ప్రవాహంలో గ్రహించబడింది. ἐγένετοకు ‘జరిగింది’ సహజమైన కథన ప్రయోగం.
- source_word: ἐπὶ τρίς
  choice: మూడుసార్లు
  rationale: ఒకే ఘటన మూడు సార్లు పునరావృతమైందనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: ఆలస్యం లేకుండా జరిగిన ఆకస్మిక తదుపరి చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: ἀνελήμφθη
  choice: తీసుకుపోబడింది
  rationale: ఆరిస్ట్ కర్మణి రూపాన్ని, పైకి తీసుకుపోయారనే దిశాత్మక భావాన్ని నిలుపుతుంది; కర్తను మూలపాఠం పేర్కొననందున తెలుగులోనూ పేర్కొనలేదు.
- source_word: τὸ σκεῦος
  choice: ఆ వస్తువు
  rationale: σκεῦοςకు పాత్ర, ఉపకరణం, వస్తువు వంటి విస్తృత అర్థాలు ఉన్నాయి. సందర్భంలోని గుడ్డవంటి దానిని సూచించినా, ఈ వచనం దానిని ప్రత్యేకంగా ‘గుడ్డ’ అనదు; ‘ఆ వస్తువు’ మూలపద విస్తృతిని సహజ తెలుగులో కాపాడుతుంది.
- source_word: εἰς τὸν οὐρανόν
  choice: ఆకాశంలోకి
  rationale: οὐρανός ‘ఆకాశం’ లేదా ‘పరలోకం’ అని అర్థమవగలదు. దర్శనంలో పై లోకానికి తిరిగి తీసుకుపోవడాన్ని ‘ఆకాశంలోకి’ సహజంగా వ్యక్తం చేస్తూ, ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచింది.
theological_decisions:
- issue: పేతురు దర్శనంలో οὐρανός సూచన
  choice: ఆకాశం
  alternative: పరలోకం
  rationale: ఈ పదం కనిపించే ఆకాశాన్నీ దేవుని లోకమైన పరలోకాన్నీ సూచించగలదు. దర్శన సందర్భం ‘పరలోకం’ భావానికి అనుకూలమైనా, తెలుగులో ‘ఆకాశం’ మూలపదంలోని దృశ్య, దిశాత్మక భావాన్ని కాపాడుతుంది; పరలోకాన్ని ప్రత్యామ్నాయంగా స్పష్టంగా ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని కర్మణి నిర్మాణం, కర్త పేర్కొనబడకపోవడం, σκεῦος మరియు οὐρανός పదాల అర్థవిస్తృతి కాపాడబడ్డాయి.
