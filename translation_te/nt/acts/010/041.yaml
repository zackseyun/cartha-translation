source:
  edition: SBLGNT
  text: οὐ παντὶ τῷ λαῷ ἀλλὰ μάρτυσι τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ, ἡμῖν, οἵτινες συνεφάγομεν καὶ συνεπίομεν αὐτῷ μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/041.yaml
  text: not to all the people[a], but to witnesses who had been chosen beforehand by God—to us[b], who ate and drank with him after he rose from the dead.
translation:
  language: te
  text: ఆయన ప్రజలందరికీ కాదు, దేవుడు ముందుగానే ఎన్నుకున్న సాక్షులకు[a]—అంటే మాకు—కనిపించాడు. ఆయన మృతులలోనుండి లేచిన తర్వాత మేము ఆయనతో కలిసి తిని తాగాము.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు ముందుగానే నియమించిన సాక్షులకు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మృతులలోనుండి ఆయన లేపబడిన తర్వాత.” ఇక్కడి గ్రీకు వాక్యరూపం సహజంగా “ఆయన లేచిన తర్వాత” అని అనువదించబడుతుంది; కొత్త నిబంధనలో ఇతర చోట్ల కర్మణి రూపం కూడా కనిపిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ παντὶ τῷ λαῷ
  choice: ప్రజలందరికీ కాదు
  rationale: దత్తివు రూపం యేసు ఎవరికి కనిపించాడనే పరిధిని సూచిస్తుంది; తరువాతి పరిమిత సాక్షుల సమూహంతో ఉన్న వ్యత్యాసాన్ని సహజంగా నిలుపుతుంది.
- source_word: μάρτυσι
  choice: సాక్షులకు
  rationale: అపొస్తలుల కార్యములలో ఈ పదం తాము చూసినదాని గురించి సాక్ష్యమిచ్చేవారిని సూచిస్తుంది.
- source_word: προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ
  choice: దేవుడు ముందుగానే ఎన్నుకున్న
  rationale: పరిపూర్ణ కర్మణి కృదంతం ముందుగా జరిగిన దైవిక ఎంపికను, దాని కొనసాగుతున్న ప్రాముఖ్యతను సూచిస్తుంది; ‘నియమించిన’ అనే అర్థమూ సాధ్యమే.
- source_word: ἡμῖν
  choice: అంటే మాకు
  rationale: ఇది ‘సాక్షులకు’ అనే పదానికి వివరణాత్మక సమానాధికార పదంగా ఉండి, ఆ సాక్షులు ఎవరన్నది స్పష్టం చేస్తుంది.
- source_word: συνεφάγομεν καὶ συνεπίομεν αὐτῷ
  choice: మేము ఆయనతో కలిసి తిని, తాగాము
  rationale: συν- ఉపసర్గలు ఆయనతో పంచుకున్న భోజన సహవాసాన్ని, పునరుత్థానానంతర సన్నిహితమైన శారీరక సాక్ష్యాన్ని స్పష్టంగా తెలియజేస్తాయి.
- source_word: μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: మృతులలోనుండి ఆయన లేచిన తర్వాత
  rationale: μετάతో కూడిన infinitive కాలార్థకంగా ‘తర్వాత’ అని అర్థమిస్తుంది; ἀναστῆναι ఇక్కడ అకర్మక భావంలో ‘లేచాడు’ అని సహజంగా అనువదించబడుతుంది.
theological_decisions:
- issue: ἀναστῆναι αὐτὸν ἐκ νεκρῶνలో పునరుత్థాన వాక్యరూపం
  choice: మృతులలోనుండి ఆయన లేచిన తర్వాత
  alternative: మృతులలోనుండి ఆయన లేపబడిన తర్వాత
  rationale: ఈ వచనంలోని గ్రీకు రూపం సహజంగా ‘ఆయన లేచిన తర్వాత’ అని అనువదించబడుతుంది. ఇది ఇతర చోట్ల చెప్పబడిన దైవిక కార్యసాధకత్వాన్ని నిరాకరించదు; ఈ వచన రూపాన్నే అనుసరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలో ‘కనిపించాడు’ అనే క్రియ ముందు వచనం నుండి భావానువృత్తిగా వస్తుంది; తెలుగు వాక్యం సంపూర్ణంగా, స్పష్టంగా ఉండేందుకు దానిని వ్యక్తంగా చేర్చాం. ప్రధాన వాక్యంలోని [a], [b] గుర్తులు సంబంధిత ప్రత్యామ్నాయాలకు అనుసంధానించబడ్డాయి.
