source:
  edition: SBLGNT
  text: τοῦ δὲ Πέτρου διενθυμουμένου περὶ τοῦ ὁράματος εἶπεν ⸂αὐτῷ τὸ πνεῦμα⸃· Ἰδοὺ ⸀ἄνδρες ⸀ζητοῦντές σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/019.yaml
  text: While Peter was still pondering the vision, the Spirit said to him, “Look, men are seeking you.”
translation:
  language: te
  text: 'పేతురు ఆ దర్శనం గురించి ఇంకా లోతుగా ఆలోచిస్తూ ఉండగా, ఆత్మ అతనితో ఇలా చెప్పింది: “ఇదిగో, కొందరు పురుషులు నీ కోసం వెదుకుతున్నారు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ కోసం చూస్తున్నారు.”
    reason: ζητέω అనే పదానికి ఈ సందర్భంలో ‘వెదుకుతున్నారు’ లేదా ‘కోసం చూస్తున్నారు’ అనే రెండు సహజమైన అర్థవ్యక్తీకరణలు సాధ్యపడతాయి.
lexical_decisions:
- source_word: διενθυμουμένου
  choice: ఇంకా లోతుగా ఆలోచిస్తూ ఉండగా
  rationale: ఈ వర్తమాన కృదంతం కొనసాగుతున్న అంతరంగ పరిశీలనను సూచిస్తుంది. ‘లోతుగా ఆలోచిస్తూ ఉండగా’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; సందర్భంలోని కొనసాగింపును ‘ఇంకా’ తెలియజేస్తుంది.
- source_word: περὶ τοῦ ὁράματος
  choice: ఆ దర్శనం గురించి
  rationale: περί యొక్క ‘గురించి’ అనే సంబంధాన్ని స్పష్టంగా ఉంచి, పేతురు ఆలోచనకు దర్శనమే విషయమని తెలుపుతుంది.
- source_word: τὸ πνεῦμα
  choice: ఆత్మ
  rationale: ఈ కథన సందర్భంలో ఇది దేవుని ఆత్మను సూచిస్తుంది. గ్రీకులో ἅγιον లేకపోవడంతో ‘పరిశుద్ధ’ అనే పదాన్ని చేర్చకుండా ‘ఆత్మ’ అని అనువదించబడింది.
- source_word: εἶπεν αὐτῷ
  choice: అతనితో … అని చెప్పాడు
  rationale: గ్రీకు వాక్య నిర్మాణాన్ని భావపరంగా నిలుపుతూ, తెలుగులో సహజమైన ప్రత్యక్ష సంభాషణ రూపాన్ని ఉపయోగిస్తుంది.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని వెంటనే ఆకర్షించే గ్రీకు ఉద్ఘాటనా సూచికకు ‘ఇదిగో’ సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు సమానం.
- source_word: ἄνδρες
  choice: కొందరు పురుషులు
  rationale: ἀνήρ ఇక్కడ సాధారణంగా మనుషులను కాక వయోజన మగవారిని సూచిస్తుంది. తెలుగు వాక్యంలో సహజత్వం కోసం అనిర్దిష్ట బహువచన భావాన్ని ‘కొందరు’తో వ్యక్తం చేసింది.
- source_word: ζητοῦντές σε
  choice: నీ కోసం వెదుకుతున్నారు
  rationale: ζητέω యొక్క వెదకడం లేదా అన్వేషించడం అనే భావాన్ని గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: τὸ πνεῦμα యొక్క సూచిత వ్యక్తి
  choice: పేతురుతో మాట్లాడుతున్న దేవుని ఆత్మను సూచించే ‘ఆత్మ’
  alternative: నిర్దిష్టత లేని ఆధ్యాత్మిక ప్రేరణ లేదా ‘పరిశుద్ధాత్మ’
  rationale: అపొస్తలుల కార్యములు 10వ అధ్యాయపు కథనంలో అన్యజనులవైపు పేతురును నడిపిస్తున్నది దేవుని ఆత్మ. అయితే మూలపాఠంలో ‘పరిశుద్ధ’ అనే విశేషణం లేనందున దాన్ని అనువాదంలో చేర్చలేదు.
- issue: ἄνδρες యొక్క లింగ సూచన
  choice: పురుషులు
  alternative: మనుషులు లేదా వ్యక్తులు
  rationale: మూలంలోని ἀνήρ వయోజన మగవారిని నిర్దిష్టంగా సూచిస్తుంది; అందువల్ల లింగ సూచనను తటస్థీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘ఇదిగో’ మూలంలోని దృష్ట్యాకర్షణను నిలుపుతుంది; ‘పరిశుద్ధ’ వంటి మూలంలో లేని పదం చేర్చబడలేదు.
