id: ACT.10.25
reference: Acts 10:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον, συναντήσας αὐτῷ ὁ Κορνήλιος πεσὼν ἐπὶ τοὺς πόδας προσεκύνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/025.yaml
  text: And when Peter entered[a], Cornelius met him and fell at his feet and paid him homage.
translation:
  language: te
  text: పేతురు లోపలికి వచ్చినప్పుడు, కొర్నేలి అతన్ని కలుసుకొని, అతని పాదాల దగ్గర పడి, అతనికి నమస్కరించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతన్ని ఆరాధించాడు.’ గ్రీకు క్రియ సందర్భాన్ని బట్టి ఆరాధనను గానీ, సాష్టాంగపడి గౌరవం చూపడాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν
  choice: లోపలికి వచ్చినప్పుడు
  rationale: ఈ గ్రీకు వాక్యరీతి కథనంలోని కాలసంబంధ పరిస్థితిని పరిచయం చేస్తుంది. తెలుగులో సహజంగా ఉండే ‘వచ్చినప్పుడు’ దాని కాలార్థాన్ని నిలుపుతుంది; δέ యొక్క కథన అనుసంధానం ప్రత్యేక పదంతో తెలపకపోయినా వాక్యప్రవాహంలో వ్యక్తమవుతుంది.
- source_word: εἰσελθεῖν τὸν Πέτρον
  choice: పేతురు లోపలికి వచ్చినప్పుడు
  rationale: అయోరిస్టు క్రియారూపం ఒక సరళ సంఘటనను సూచిస్తుంది. ‘లోపలికి వచ్చాడు’ అనే భావాన్ని తెలుగులో సహజమైన ఉపవాక్యంగా ఇచ్చాం.
- source_word: συναντήσας αὐτῷ
  choice: అతనికి ఎదురువచ్చి
  rationale: συναντάω ఇక్కడ పేతురును కలుసుకోవడానికి కొర్నేలి ఎదురుగా రావడాన్ని సూచిస్తుంది. ‘ఎదురువచ్చి’ అనేది కేవలం కలుసుకున్నాడనే ఫలితంతో పాటు అతన్ని స్వాగతించడానికి వచ్చిన కదలికను కూడా సహజంగా తెలియజేస్తుంది.
- source_word: πεσὼν ἐπὶ τοὺς πόδας
  choice: అతని పాదాల దగ్గర పడి
  rationale: ఇది పేతురు ఎదుట కొర్నేలి తనను తాను తగ్గించుకొని పడిన శారీరక భంగిమను స్పష్టంగా, సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: προσεκύνησεν
  choice: అతనికి సాష్టాంగ నమస్కారం చేశాడు
  rationale: προσκυνέω ఆరాధనను గానీ, గాఢ గౌరవంతో నేలపై వంగి నమస్కరించడాన్ని గానీ సూచించగలదు. సందర్భంలో కనిపించే శారీరక భంగిమను ‘సాష్టాంగ నమస్కారం’ సహజంగా తెలియజేస్తుంది; ‘ఆరాధించాడు’ అనే సాధ్యమైన బలమైన అర్థాన్ని పాదసూచికలో ఉంచడం ద్వారా మూలంలోని అర్థపరిధిని కాపాడాం.
theological_decisions:
- issue: పేతురిని ఉద్దేశించిన προσκυνέω అనువాదం
  choice: అతనికి సాష్టాంగ నమస్కారం చేశాడు
  alternative: అతన్ని ఆరాధించాడు
  rationale: ఈ క్రియకు ఆరాధన నుండి గాఢ గౌరవంతో సాష్టాంగపడటం వరకు అర్థపరిధి ఉంది. తరువాతి వచనంలో పేతురు ఈ చర్యను తిరస్కరించినప్పటికీ, ఈ వచనం మాత్రమే కొర్నేలి ఉద్దేశాన్ని పూర్తిగా నిర్వచించదు. అందువల్ల ప్రధాన పాఠం కనిపించే చర్యను తెలియజేస్తుంది; బలమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చి వేదాంతపరమైన ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘సాష్టాంగ నమస్కారం’ సాధారణ పాఠకులకు అర్థమయ్యేలా భంగిమను, గాఢ గౌరవాన్ని రెండింటినీ వ్యక్తం చేస్తుంది; పాదసూచిక మూలపదంలోని నిజమైన సందిగ్ధతను నిలుపుతుంది.
