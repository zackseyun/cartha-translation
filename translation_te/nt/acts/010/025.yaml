review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal setting, Cornelius's meeting Peter, falling at his feet, and the ambiguous reverential action. However, ‘సాష్టాంగ నమస్కారం’ normally specifies full-body prostration and is somewhat redundant after ‘పాదాల దగ్గర పడి’; the Greek states that he fell at Peter's feet and performed προσκυνέω, without requiring that particular technical gesture. A more neutral ‘నమస్కరించాడు’ preserves the ambiguity while allowing the footnote to retain ‘ఆరాధించాడు.’
  naturalness: ‘అతనికి ఎదురువచ్చి’ is understandable, but ‘అతన్ని కలుసుకొని’ is more idiomatic and directly reflects συναντήσας. The revised sentence is natural modern standard Telugu narrative prose.
  terminology: Use ‘నమస్కరించాడు’ for προσκυνέω in the main text, since it can express reverential bowing without deciding whether the action was worship. The footnote appropriately supplies ‘ఆరాధించాడు’ as a viable alternative. ‘కొర్నేలి’ and ‘పేతురు’ are acceptable Telugu biblical name forms.
  issues:
  - severity: medium
    issue: ‘సాష్టాంగ నమస్కారం’ over-specifies προσκυνέω.
    rationale: The verb has a broader semantic range, including prostration/homage and worship. Since falling at the feet is already explicitly translated, the technical expression ‘సాష్టాంగ’ may add a bodily detail not required by the Greek and can narrow the intended ambiguity.
  - severity: low
    issue: ‘ఎదురువచ్చి’ is less direct than the Greek encounter verb.
    rationale: συναντήσας means meeting him. ‘అతన్ని కలుసుకొని’ is more idiomatic in this context and does not add a directional nuance.
  revised_text: పేతురు లోపలికి వచ్చినప్పుడు, కొర్నేలి అతన్ని కలుసుకొని, అతని పాదాల దగ్గర పడి, అతనికి నమస్కరించాడు.[a]
