revisions:
- from: పేతురు లోపలికి వచ్చినప్పుడు, కొర్నేలి అతనికి ఎదురువచ్చి, అతని పాదాల దగ్గర పడి, అతనికి సాష్టాంగ నమస్కారం చేశాడు.[a]
  to: పేతురు లోపలికి వచ్చినప్పుడు, కొర్నేలి అతన్ని కలుసుకొని, అతని పాదాల దగ్గర పడి, అతనికి నమస్కరించాడు.[a]
  rationale: The revision retains every explicit narrative element while rendering προσκυνέω with a Telugu term broad enough to preserve the source ambiguity. The footnote continues to offer ‘ఆరాధించాడు’ and explains the lexical range without imposing an interpretation.
