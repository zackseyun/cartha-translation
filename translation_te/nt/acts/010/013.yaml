  text: καὶ ἐγένετο φωνὴ πρὸς αὐτόν· Ἀναστάς, Πέτρε, θῦσον καὶ φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/013.yaml
  text: 'And a voice came to him: “Get up[a], Peter; kill and eat.”'
translation:
  language: te
  text: 'మరియు ఒక స్వరం అతనితో ఇలా పలికింది: “పేతురూ, లేచి చంపి తిను.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బలి అర్పించి తిను.” “చంపు” అని అనువదించిన క్రియకు “బలి అర్పించు” అనే అర్థం కూడా ఉండవచ్చు. అయితే ఈ దర్శన సందర్భంలో అది ఆహారం కోసం జంతువును చంపడాన్నే ఎక్కువగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: వినిపించింది
  rationale: φωνήతో కలిసి ఈ క్రియ ఒక స్వరం రావడాన్ని లేదా సంభవించడాన్ని సూచిస్తుంది. తెలుగులో ‘ఒక స్వరం వినిపించింది’ సహజంగా ఉండి సంఘటన భావాన్ని నిలుపుతుంది.
- source_word: φωνὴ
  choice: ఒక స్వరం
  rationale: ఈ దర్శన సందర్భంలో ఇది కేవలం శబ్దం కాకుండా స్పష్టంగా పలికిన స్వరాన్ని సూచిస్తుంది.
- source_word: πρὸς αὐτόν
  choice: అతనికి
  rationale: మాట ఒక వ్యక్తిని ఉద్దేశించి పలకబడిందని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: Ἀναστάς
  choice: లేచి
  rationale: ఈ భూతకాల కృదంతం తరువాతి ఆజ్ఞలతో వరుస ఆజ్ఞార్థక భావంలో ఉంది. ‘లేచి’ అనేది సహజమైన తెలుగు రూపం.
- source_word: Πέτρε
  choice: పేతురూ
  rationale: పేతురు అనే పేరుకు సంబోధన రూపం; ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: θῦσον
  choice: చంపి
  rationale: θύω అనే క్రియకు ‘బలి అర్పించు’ అనే అర్థం కూడా ఉన్నప్పటికీ, ఇక్కడ జంతువులను ఆహారంగా సిద్ధం చేసి తినమనే దర్శన సందర్భంలో ‘చంపి’ ప్రధాన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: φάγε
  choice: తిను
  rationale: నేరుగా ఉన్న ఆజ్ఞార్థక రూపాన్ని సరళంగా, సహజంగా అనువదిస్తుంది.
- source_word: καὶ
  choice: అప్పుడు / -ి
  rationale: మొదటి καί కథన క్రమాన్ని ‘అప్పుడు’గా తెలియజేస్తుంది; ఆజ్ఞల మధ్య καί తెలుగులో ‘చంపి తిను’ అనే వరుస క్రియారూపంతో సహజంగా వ్యక్తమవుతుంది.
theological_decisions:
- issue: θῦσον అనే పదాన్ని బలి సంబంధమైన భాషతో అనువదించాలా?
  choice: ప్రధాన పాఠ్యంలో ‘చంపి’
  alternative: ‘బలి అర్పించి’ లేదా ‘వధించి’
  rationale: తక్షణ సందర్భం ఆరాధనా బలి గురించి కాక, దర్శనంలోని జంతువులను చంపి తినడం గురించి ఉంది. అయితే మూల క్రియకు బలి అర్పించే అర్థం కూడా ఉండగలదు కాబట్టి ఆ నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. సంబోధనకు ‘పేతురూ’ వాడబడింది; మూలంలోని సంక్షిప్త వరుస ఆజ్ఞలు నిలుపబడ్డాయి.
