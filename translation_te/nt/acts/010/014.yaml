id: ACT.10.14
reference: Acts 10:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος εἶπεν· Μηδαμῶς, κύριε, ὅτι οὐδέποτε ἔφαγον πᾶν κοινὸν ⸀καὶ ἀκάθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/014.yaml
  text: But Peter said, “By no means, Lord, because I have never eaten anything common and unclean.”
translation:
  language: te
  text: 'అయితే పేతురు ఇలా అన్నాడు: “ఎట్టి పరిస్థితుల్లోనూ కాదు, ప్రభువా! ఎందుకంటే సామాన్యమైనదీ అశుద్ధమైనదీ ఏదీ నేను ఎన్నడూ తినలేదు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: ఎట్టి పరిస్థితుల్లోనూ కాదు
  rationale: బలమైన నిరాకరణను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κύριε
  choice: ప్రభువా
  rationale: ప్రత్యక్ష సంబోధనను, మూలంలోని గౌరవార్థక/ప్రభుత్వార్థక భావాన్ని నిలుపుతుంది.
- source_word: κοινὸν
  choice: అపవిత్రమైనది
  rationale: ఇక్కడ ఆహార నియమాల సందర్భంలో ఆచారపరంగా పవిత్ర వినియోగానికి వేరుచేయబడని, కలుషితమైనదిగా పరిగణించబడే దానిని సూచిస్తుంది.
- source_word: ἀκάθαρτον
  choice: అశుద్ధమైనది
  rationale: ఆచారపరమైన అశుద్ధతను తెలిపే సాధారణ బైబిలు పదప్రయోగం.
- source_word: καὶ
  choice: దీ…దీ
  rationale: SBLGNT పాఠంలోని సంయోజకమైన ‘మరియు’ భావాన్ని నిలుపుతూ, రెండు విశేషణాలను ఒకే వస్తువుకు వర్తించేలా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: పేతురు చేసిన నిరాకరణకు కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
theological_decisions:
- issue: κοινὸν καὶ ἀκάθαρτον మధ్య సంబంధం
  choice: ‘అపవిత్రమైనదీ అశుద్ధమైనదీ’ అని సంయోజకంగా అనువదించడం
  alternative: ‘అపవిత్రమైనదైనా అశుద్ధమైనదైనా’ అని ప్రత్యామ్నాయ భావంతో అనువదించడం
  rationale: ఇచ్చిన SBLGNT మూలపాఠంలో καὶ (‘మరియు’) ఉంది; అందువల్ల పాఠంలోని సంయోజక ఉద్రిక్తతను సిద్ధాంతపరంగా సవరించకుండా నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని బలమైన నిరాకరణ, కారణసూచక సంబంధం, ‘common’ మరియు ‘unclean’ మధ్య వ్యత్యాసం నిలుపబడ్డాయి.
