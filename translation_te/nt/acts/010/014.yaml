- from: అయితే పేతురు, “ఎట్టి పరిస్థితుల్లోనూ కాదు, ప్రభువా! ఎందుకంటే అపవిత్రమైనదీ అశుద్ధమైనదీ ఏదీ నేను ఎన్నడూ తినలేదు” అన్నాడు.
  to: 'అయితే పేతురు ఇలా అన్నాడు: “ఎట్టి పరిస్థితుల్లోనూ కాదు, ప్రభువా! ఎందుకంటే సామాన్యమైనదీ అశుద్ధమైనదీ ఏదీ నేను ఎన్నడూ తినలేదు.”'
