review_pass:
  verdict: revise
  source_fidelity: The draft preserves Peter’s emphatic refusal (Μηδαμῶς), direct address (κύριε), causal ὅτι, and the perfect-life experience sense of οὐδέποτε ἔφαγον. However, translating κοινόν as “అపవిత్రమైనది” substantially overlaps with “అశుద్ధమైనది” for ἀκάθαρτον and obscures the source’s distinct paired ritual categories. “సామాన్యమైనది” retains the literal category of κοινόν in this food-law context without importing an interpretation.
  naturalness: The revised wording is natural, modern standard Telugu. “ఎట్టి పరిస్థితుల్లోనూ కాదు” appropriately conveys the force of Μηδαμῶς; “ఎన్నడూ ... తినలేదు” naturally represents the Greek perfect statement in context.
  terminology: “ప్రభువా” is suitable for κύριε in this direct address. “సామాన్యమైనది” and “అశుద్ధమైనది” deliberately preserve the distinction between κοινόν and ἀκάθαρτον. A brief note explains that “సామాన్యమైనది” here is a ritual-category term rather than ordinary everyday commonness.
  issues:
  - severity: medium
    issue: The rendering of κοινόν as “అపవిత్రమైనది” duplicates the semantic territory of “అశుద్ధమైనది” for ἀκάθαρτον.
    rationale: The Greek uses two distinguishable terms, κοινόν and ἀκάθαρτον. Rendering them as “అపవిత్రమైనది” and “అశుద్ధమైనది” makes the distinction less visible in Telugu. “సామాన్యమైనది” preserves κοινόν more directly; the footnote supplies the necessary ritual-context clarification.
  revised_text: 'అయితే పేతురు ఇలా అన్నాడు: “ఎట్టి పరిస్థితుల్లోనూ కాదు, ప్రభువా! ఎందుకంటే సామాన్యమైనదీ అశుద్ధమైనదీ ఏదీ నేను ఎన్నడూ తినలేదు.”'
