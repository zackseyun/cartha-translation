id: ACT.10.1
reference: Acts 10:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀνὴρ δέ ⸀τις ἐν Καισαρείᾳ ὀνόματι Κορνήλιος, ἑκατοντάρχης ἐκ σπείρης τῆς καλουμένης Ἰταλικῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/001.yaml
  text: There was a man in Caesarea named Cornelius[a], a centurion from the cohort called the Italian Cohort[b],
translation:
  language: te
  text: కైసరయలో కొర్నేలి[a] అనే ఒక మనిషి ఉండేవాడు. అతడు ఇటాలిక దళం అని పిలవబడే సైనిక విభాగానికి చెందిన శతాధిపతి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కైసరయలో కొర్నేలి అనే ఒకానొక మనిషి.” గ్రీకు మూలంలో కొత్త పాత్రను పరిచయం చేసే అనిర్దిష్ట వ్యక్తీకరణ ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “శతాధిపతి” రోమా సైన్యంలోని ఒక అధికారి. ఇక్కడి “సైనిక విభాగం” రోమా సైనిక దళంలోని ఒక విభాగం; “ఇటాలిక దళం” అనేది ఇటలీతో అనుబంధమున్న లేదా ఇటలీ సైనికులతో ఏర్పడిన విభాగాన్ని సూచించి ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: ఒక వ్యక్తి ఉండేవాడు
  rationale: కొత్త పాత్రను అనిర్దిష్టంగా పరిచయం చేసే τις భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. ἀνήρ ఇక్కడ వయోజన పురుషుణ్ణి సూచించినా, కొర్నేలి అనే పేరు మరియు తరువాతి శతాధిపతి వివరణ వల్ల లింగసూచన స్పష్టంగా ఉంది. δέ స్వల్ప కథన మార్పును సూచిస్తుంది; తెలుగులో ప్రత్యేక అనుసంధాన పదం లేకుండానే కొత్త దృశ్యారంభం సహజంగా వ్యక్తమవుతుంది.
- source_word: ἐν Καισαρείᾳ
  choice: కైసరయలో
  rationale: స్థలాన్ని సూచించే పదబంధానికి నేరమైన అనువాదం; Καισάρεια అనే పేరుకు ప్రాచుర్యంలో ఉన్న తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: ὀνόματι Κορνήλιος
  choice: కొర్నేలి అనే
  rationale: ὀνόματι తో వచ్చిన వ్యక్తిపేరును తెలుగులో సహజంగా పరిచయం చేసే నిర్మాణం. Κορνήλιος పేరుకు తెలుగు బైబిలు వాడుకలో పరిచితమైన రూపాన్ని ఎంచుకున్నాం.
- source_word: ἑκατοντάρχης
  choice: శతాధిపతి
  rationale: రోమా సైన్యంలోని ఈ అధికార హోదాకు స్థిరపడిన, సంక్షిప్తమైన తెలుగు చారిత్రక పదం.
- source_word: ἐκ σπείρης
  choice: సైనిక దళానికి చెందిన
  rationale: ἐκ సూచించే అనుబంధాన్ని ‘చెందిన’ అని సహజంగా తెలిపాం. σπεῖρα రోమా సైనిక విభాగమని పాఠ్యంలో స్పష్టత కోసం ‘సైనిక దళం’ అన్నాం.
- source_word: τῆς καλουμένης Ἰταλικῆς
  choice: “ఇటాలిక దళం” అని పిలిచే
  rationale: καλουμένης ను ‘అని పిలిచే’గా నేరుగా వ్యక్తం చేసి, Ἰταλικῆς అనే యూనిట్ పేరును లిప్యంతరీకరించాం; అది ఇటలీతో అనుబంధమున్న దళాన్ని సూచించే అవకాశాన్ని పాదటిప్పణిలో వివరించాం.
