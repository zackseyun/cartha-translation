translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. పొడవైన గ్రీకు వాక్యభాగాన్ని తెలుగు పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించాం. చారిత్రక సైనిక పదవికి ‘శతాధిపతి’ని నిలిపి, అపరిచితమైన సైనిక విభాగాన్ని ప్రధాన పాఠ్యంలో కొద్దిగా స్పష్టం చేశాం.
