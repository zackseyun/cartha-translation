- from: కైసరయలో కొర్నేలి[a] అనే ఒక వ్యక్తి ఉండేవాడు. అతడు “ఇటాలిక దళం” అని పిలిచే సైనిక దళానికి చెందిన శతాధిపతి[b].
  to: కైసరయలో కొర్నేలి[a] అనే ఒక మనిషి ఉండేవాడు. అతడు ఇటాలిక దళం అని పిలవబడే సైనిక విభాగానికి చెందిన శతాధిపతి[b].
  rationale: The revision restores the explicit male reference of ἀνήρ with “మనిషి” and makes the unit-name construction more directly reflect καλουμένης. It retains the draft’s natural modern Telugu style, established rank terminology, narrative division into two sentences, and the footnote’s appropriately cautious historical explanation.
