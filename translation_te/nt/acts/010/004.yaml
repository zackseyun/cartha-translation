id: ACT.10.4
reference: Acts 10:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἀτενίσας αὐτῷ καὶ ἔμφοβος γενόμενος εἶπεν· Τί ἐστιν, κύριε; εἶπεν δὲ αὐτῷ· Αἱ προσευχαί σου καὶ αἱ ἐλεημοσύναι σου ἀνέβησαν εἰς μνημόσυνον ⸀ἔμπροσθεν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/004.yaml
  text: But he stared at him[a], and becoming afraid, said, “What is it, Lord?” And he said to him, “Your prayers and your acts of mercy have gone up as a memorial before God.”
translation:
  language: te
  text: కొర్నేలి అతనిని తదేకంగా చూచి భయపడి, “ఏమిటి, ప్రభువా?” అని అడిగాడు. అతడు కొర్నేలితో, “నీ ప్రార్థనలూ నీ దానధర్మాలూ[a] దేవుని ఎదుట జ్ఞాపకార్థంగా పైకి ఎక్కాయి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కరుణా కార్యాలు.” గ్రీకు పదం ముఖ్యంగా అవసరంలో ఉన్నవారికి చేసే దానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: తదేకంగా చూసి
  rationale: స్థిరంగా, శ్రద్ధగా చూపు నిలిపి చూడడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἔμφοβος γενόμενος
  choice: భయపడి
  rationale: భయస్థితిలోకి ప్రవేశించిన భావాన్ని అతిశయింపకుండా సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: Τί ἐστιν
  choice: ఏమిటి
  rationale: ఈ సందర్భంలో విషయం ఏమిటని అడిగే నేరుగా, సహజమైన తెలుగు ప్రశ్న.
- source_word: κύριε
  choice: ప్రభువా
  rationale: పరలోక దూతను గౌరవపూర్వకంగా సంబోధించే ఉన్నత శైలిని నిలుపుతుంది; దీనిని యేసును గూర్చిన సంపూర్ణ విశ్వాస ప్రకటనగా నిర్బంధించదు.
- source_word: προσευχαί
  choice: ప్రార్థనలు
  rationale: మూలపదానికి సాధారణమైన, స్పష్టమైన సమానార్థకం.
- source_word: ἐλεημοσύναι
  choice: దానధర్మాలు
  rationale: అవసరంలో ఉన్నవారికి కనికరంతో చేసే దానాన్ని సూచించే, సాధారణ పాఠకులకు సుపరిచితమైన తెలుగు పదం.
- source_word: ἀνέβησαν
  choice: పైకి చేరాయి
  rationale: ప్రార్థనలు, అర్పణలు దేవుని వద్దకు పైకి వెళ్లే రూపకాన్ని నిలుపుతూ సహజమైన తెలుగును అందిస్తుంది.
- source_word: εἰς μνημόσυνον
  choice: జ్ఞాపకంగా
  rationale: దేవుని సమక్షంలో జ్ఞాపకం చేయబడే భావాన్ని నిలుపుతుంది; మూలంలో లేని నిర్దిష్ట బలిపద్ధతి అర్థాన్ని చేర్చదు.
- source_word: ἔμπροσθεν τοῦ θεοῦ
  choice: దేవుని సన్నిధిలో
  rationale: దేవుని సమక్షం లేదా దృష్టి ఎదుట అనే భావాన్ని గౌరవప్రదమైన సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: పరలోక దూతను ఉద్దేశించిన κύριε పదం యొక్క భావం
  choice: ప్రభువా
  alternative: అయ్యా
  rationale: ఇక్కడ ఇది గౌరవపూర్వక సంబోధనగా ఉండవచ్చు. ‘ప్రభువా’ మూలపదపు ఉన్నత శైలిని నిలుపుతుంది; అయితే ప్రధాన పాఠం దీన్ని క్రీస్తును గూర్చిన ఒప్పుకోలుగా వివరించదు.
- issue: εἰς μνημόσυνον లోని జ్ఞాపక భావం
  choice: జ్ఞాపకంగా
  alternative: జ్ఞాపకార్థ అర్పణగా
  rationale: ఈ మాటలో ఆరాధనా లేదా బలి సంబంధ ప్రతిధ్వని ఉండవచ్చు; కానీ ‘అర్పణ’ అని చేర్చడం మూలపాఠం స్పష్టంగా చెప్పినదానికంటే ఎక్కువ నిర్దిష్టతను తెస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి పాటించబడింది. సర్వనామాల వల్ల కలిగే తెలుగు అస్పష్టతను తగ్గించేందుకు మొదటి కర్తను ‘కొర్నేలి’గా స్పష్టం చేసి, తరువాతి వాక్యంలో మూలంలోని ‘అతడు’ను నిలిపి ఉంచాం. పాదసూచిక గుర్తు అది వివరించే ‘దానధర్మాలు’ పదం వెంట ఉంచబడింది.
