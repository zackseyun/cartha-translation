id: ACT.10.47
reference: Acts 10:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μήτι τὸ ὕδωρ ⸂δύναται κωλῦσαί⸃ τις τοῦ μὴ βαπτισθῆναι τούτους οἵτινες τὸ πνεῦμα τὸ ἅγιον ἔλαβον ⸀ὡς καὶ ἡμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/047.yaml
  text: Surely no one can withhold the water so that these people should not be baptized[b][a], can they? For they have received the Holy Spirit just as we have.
translation:
  language: te
  text: వీరు బాప్తిస్మం పొందకుండా ఉండేందుకు నీళ్లను ఇవ్వకుండా ఎవరైనా ఆపగలరా? వీరు మనలాగే పవిత్రాత్మను పొందారు కదా!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μήτι
  choice: ఎవరైనా ... అడ్డుకోగలరా?
  rationale: ఈ ప్రశ్నకు ‘లేదు’ అనే జవాబు ఆశించబడుతోంది. తెలుగు అలంకారప్రశ్న సహజంగానే ఆ భావాన్ని తెలియజేస్తుంది; అదనంగా ‘ఖచ్చితంగా’ వంటి పదాన్ని చేర్చాల్సిన అవసరం లేదు.
- source_word: τὸ ὕδωρ
  choice: నీళ్లను
  rationale: సందర్భంలో ఇవి బాప్తిస్మానికి ఉపయోగించే నీళ్లు. తెలుగులో ‘నీళ్లు’ అనే బహువచన రూపమే సహజమైన సామాన్య వాడుక.
- source_word: δύναται κωλῦσαί τις
  choice: ఎవరైనా అడ్డుకోగలరా
  rationale: κωλύω లోని అడ్డగించడం లేదా అనుమతించకపోవడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοῦ μὴ βαπτισθῆναι τούτους
  choice: వీరు బాప్తిస్మం పొందకుండా
  rationale: మూలంలోని నిషేధార్థక కర్తరి-రహిత క్రియను నిలుపుతూ, నీళ్లను అడ్డుకోవడం వల్ల వారి బాప్తిస్మం నిరోధించబడుతుందనే సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: οἵτινες τὸ πνεῦμα τὸ ἅγιον ἔλαβον
  choice: పవిత్రాత్మను పొందిన వీరు
  rationale: వారిని పవిత్రాత్మను పొందినవారిగా గుర్తించే సంబంధవాక్య భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ὡς καὶ ἡμεῖς
  choice: మనలాగే
  rationale: వారి అనుభవాన్ని పేతురు మరియు అతనితో ఉన్న విశ్వాసుల అనుభవంతో సమానంగా పోల్చే మూలభాష భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పవిత్రాత్మను పొందడానికి, నీటి బాప్తిస్మానికి మధ్య కథన సంబంధం
  choice: వీరు ఇప్పటికే పవిత్రాత్మను పొందారని, అందువల్ల వారి నీటి బాప్తిస్మాన్ని అడ్డుకోలేమని పేతురు వాదిస్తున్నట్లు అనువదించబడింది.
  alternative: పవిత్రాత్మను పొందడం బాప్తిస్మానికి ముందు జరిగిందనే క్రమాన్ని అస్పష్టంగా చూపడం.
  rationale: ἔλαβον అనే పూర్తయిన క్రియ మరియు పేతురు ప్రశ్నలోని తర్కం, పవిత్రాత్మను పొందడం ముందే జరిగిందని సూచిస్తున్నాయి. ఏ ప్రత్యేక సంప్రదాయానికి చెందిన బాప్తిస్మ సిద్ధాంతాన్ని చేర్చకుండా ఈ కథన ఉద్రిక్తతను యథాతథంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. ‘బాప్తిస్మం’ అనే విస్తృతంగా గుర్తించబడే పదం నిలుపబడింది; ‘వీరు’ సమూహాన్ని లింగపరంగా అనవసరంగా పరిమితం చేయదు.
