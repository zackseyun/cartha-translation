id: ACT.10.15
reference: Acts 10:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ φωνὴ πάλιν ἐκ δευτέρου πρὸς αὐτόν· Ἃ ὁ θεὸς ἐκαθάρισεν σὺ μὴ κοίνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/015.yaml
  text: 'And a voice came to him again a second time: “What God has made clean[a], you must not call common.”'
translation:
  language: te
  text: 'మళ్లీ, రెండవసారి ఒక స్వరం అతనితో ఇలా చెప్పింది: “దేవుడు శుద్ధి చేసిన వాటిని నీవు సామాన్యమైనవి అని అనవద్దు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అశుద్ధమైనవి అని అనవద్దు”; లేదా “అపవిత్రమైనవిగా భావించవద్దు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: ఒక స్వరం
  rationale: గ్రీకులో నిర్దిష్ట ఉపపదం లేకపోవడం వల్ల ‘ఒక స్వరం’ సహజంగా ఉంది; మాట్లాడినవారికి బిరుదు చేర్చకుండా మూలంలోని రూపాన్ని కాపాడుతుంది.
- source_word: πάλιν ἐκ δευτέρου
  choice: మళ్లీ రెండోసారి
  rationale: గ్రీకులోని కొంత పునరుక్తితో కూడిన బలాన్ని నిలుపుతూ, ఇది అదే స్వరం రెండోసారి వినిపించిందని స్పష్టం చేస్తుంది.
- source_word: πρὸς αὐτόν
  choice: అతనితో ఇలా చెప్పింది
  rationale: పేతురును ఉద్దేశించి పలికిన మాటను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ἃ
  choice: చేసినవాటిని
  rationale: నపుంసక బహువచన సంబంధసర్వనామాన్ని సమష్టిగా సూచించే సహజ తెలుగు రూపంలో అందిస్తుంది.
- source_word: ὁ θεὸς
  choice: దేవుడు
  rationale: ఏకైక దేవుణ్ణి సూచించే సహజమైన తెలుగు రూపం.
- source_word: ἐκαθάρισεν
  choice: శుద్ధి చేసిన
  rationale: దేవుని నిర్ణాయక క్రియను తెలియజేస్తూ, ఆచారపరమైన పవిత్రత భావాన్ని కూడా నిలుపుతుంది.
- source_word: σὺ
  choice: నీవు
  rationale: గ్రీకులో స్పష్టంగా ఉన్న కర్తృసర్వనామం ఇచ్చే ఉద్ఘాటనను తెలుగులో నిలుపుతుంది.
- source_word: μὴ κοίνου
  choice: సామాన్యమైనవిగా ఎంచవద్దు
  rationale: κοινόω అనే పదంలోని ‘సామాన్యమైనది/పవిత్ర వినియోగానికి వేరుచేయబడనిది’ అనే శుద్ధి-వర్గ భావాన్ని నిలుపుతుంది; ‘అపవిత్రం’ అని మాత్రమే అనువదిస్తే ἀκάθαρτος‌తో ఉన్న భేదం చెరిగిపోవచ్చు.
theological_decisions:
- issue: పేతురు దర్శనంలోని శుద్ధి-అశుద్ధి పదజాలం
  choice: ప్రధాన పాఠ్యంలో ‘సామాన్యమైనవిగా ఎంచవద్దు’ అని ఉంచడం
  alternative: ‘అశుద్ధమైనవని అనవద్దు’ లేదా ‘అపవిత్రమైనవిగా చూడవద్దు’
  rationale: ఈ వాక్యం καθαρίζωను κοινόωతో వ్యతిరేకంగా ఉంచుతుంది. ‘సామాన్యమైనవి’ అనే పదం ప్రత్యేకమైన శుద్ధి-వర్గాన్ని కాపాడి, ‘సామాన్యం’ మరియు ‘అశుద్ధం’ మధ్య ఉండగల భేదాన్ని ముందుగానే తొలగించదు; సహజమైన వివరణాత్మక ప్రత్యామ్నాయాలు పాదసూచికలో ఇవ్వబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘మళ్లీ రెండోసారి’ ద్వారా మూలంలోని ఉద్దేశపూర్వక పునరుక్తి నిలుపబడింది; ‘సామాన్యమైనవిగా’ అనే పదానికి సందర్భానుగుణ అర్థాన్ని పాదసూచిక వివరిస్తుంది.
