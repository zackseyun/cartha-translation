revisions:
- from: 'మళ్లీ రెండోసారి ఒక స్వరం అతనితో ఇలా చెప్పింది: “దేవుడు శుద్ధి చేసినవాటిని నీవు సామాన్యమైనవిగా ఎంచవద్దు.[a]”'
  to: 'మళ్లీ, రెండవసారి ఒక స్వరం అతనితో ఇలా చెప్పింది: “దేవుడు శుద్ధి చేసిన వాటిని నీవు సామాన్యమైనవి అని అనవద్దు.[a]”'
  rationale: The revision replaces ‘ఎంచవద్దు’ (‘do not choose’) with ‘అని అనవద్దు’ (‘do not call’), directly representing the force of μὴ κοίνου. It preserves the main-text rendering ‘సామాన్యమైనవి,’ which reflects κοινός/κοινόω and maintains the purity-category distinction from ‘అశుద్ధమైనవి.’
