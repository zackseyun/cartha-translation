id: ACT.10.34
reference: Acts 10:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀνοίξας δὲ Πέτρος τὸ στόμα εἶπεν· Ἐπ’ ἀληθείας καταλαμβάνομαι ὅτι οὐκ ἔστιν προσωπολήμπτης ὁ θεός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/034.yaml
  text: Then Peter opened his mouth and said[b][a], “Truly I understand that God is not one who shows partiality,”
translation:
  language: te
  text: 'అప్పుడు పేతురు నోరు తెరిచి ఇలా అన్నాడు: “దేవుడు పక్షపాతం చూపేవాడు కాదని నేను నిజంగా గ్రహిస్తున్నాను.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు పక్షపాతి కాదని నేను నిజంగానే అర్థం చేసుకుంటున్నాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνοίξας ... τὸ στόμα
  choice: నోరు తెరిచి ఇలా అన్నాడు
  rationale: గ్రీకు నుడికారంలోని రూపాన్ని, గంభీరమైన ప్రకటనను ఆరంభించే దాని వాక్చాతుర్య బరువును నిలుపుతూ తెలుగులో సహజంగా పలికేలా అనువదించబడింది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ δέ కథన పురోగతిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ సందర్భ ప్రవాహాన్ని సహజంగా కలుపుతుంది.
- source_word: Ἐπ’ ἀληθείας
  choice: నిజంగా
  rationale: పేతురు పొందిన యథార్థమైన అవగాహనను లేదా దృఢమైన నిర్ధారణను ఈ పదం స్పష్టంగా తెలియజేస్తుంది.
- source_word: καταλαμβάνομαι
  choice: నేను ... గ్రహిస్తున్నాను
  rationale: వర్తమాన రూపాన్ని కాపాడుతూ, పేతురు ఒక సత్యాన్ని గుర్తించి అర్థం చేసుకుంటున్న భావాన్ని సహజంగా వ్యక్తపరుస్తుంది; గ్రీకులో స్పష్టంగా లేని ‘ఇప్పుడు’ అనే పదాన్ని చేర్చలేదు.
- source_word: προσωπολήμπτης
  choice: పక్షపాతం చూపేవాడు
  rationale: వ్యక్తుల బాహ్య స్థితి లేదా గుర్తింపును బట్టి మొగ్గు చూపే వ్యక్తిని సూచించే నామవాచక భావాన్ని స్పష్టంగా, ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ὁ θεός
  choice: దేవుడు
  rationale: θεόςకు ప్రామాణిక తెలుగు అనువాదం; గ్రీకు విధేయ నిర్మాణం తెలుగులో ‘దేవుడు ... చూపేవాడు కాడు’గా సహజంగా వ్యక్తమవుతుంది.
theological_decisions:
- issue: దేవుని నిష్పక్షపాత స్వభావాన్ని తరువాతి సిద్ధాంత వ్యవస్థల అర్థాలను చేర్చకుండా వ్యక్తపరచడం
  choice: దేవుడు పక్షపాతం చూపేవాడు కాడు
  alternative: దేవుడు ముఖపక్షపాతం చూపడు
  rationale: ఈ అనువాదం προσωπολήμπτης అనే వ్యక్తిని సూచించే నామవాచక భావాన్ని నిలుపుతుంది; అదే సమయంలో దేవుని నిష్పక్షపాతత్వాన్ని ఏదైనా ప్రత్యేకమైన తరువాతి సిద్ధాంత చట్రానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ప్రకటనలోని గంభీరతను నిలుపుతూ రూపొందించబడింది. ‘నోరు తెరిచి’ అనే మూల నుడికారాన్ని ఉంచినా, తెలుగులో సహజంగా ఉండేందుకు ‘ఇలా అన్నాడు’తో జతచేయబడింది.
