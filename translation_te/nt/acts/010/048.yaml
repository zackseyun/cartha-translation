revisions:
- from: అందువల్ల, యేసు మెస్సీయ పేరులో వారికి బాప్తిస్మం ఇవ్వాలని అతడు ఆజ్ఞాపించాడు.[a] అప్పుడు వారు, కొన్ని రోజులు తమతో ఉండమని అతణ్ణి అడిగారు.
  to: అతడు వారు మెస్సీయ అయిన యేసు పేరున బాప్తిస్మం పొందాలని ఆజ్ఞాపించాడు.[a] అప్పుడు వారు కొన్ని రోజులు తమతో ఉండమని అతణ్ణి అడిగారు.
  rationale: Narrative δέ is rendered without an unwarranted causal inference, and the Greek passive ‘to be baptized’ is represented directly. The title Χριστός remains translated as ‘మెస్సీయ,’ with the traditional ‘క్రీస్తు’ preserved in the anchored footnote.
