  revision_rationale: Narrative δέ is rendered without an unwarranted causal inference, and the Greek passive ‘to be baptized’ is represented directly. The title Χριστός remains translated as ‘మెస్సీయ,’ with the traditional ‘క్రీస్తు’ preserved in the anchored footnote.
