id: ACT.10.48
reference: Acts 10:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: προσέταξεν ⸀δὲ αὐτοὺς ⸂ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ βαπτισθῆναι⸃. τότε ἠρώτησαν αὐτὸν ἐπιμεῖναι ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/048.yaml
  text: So he ordered them to be baptized in the name of Jesus the Messiah[a]. Then they asked him to remain for some days.
translation:
  language: te
  text: అతడు వారు మెస్సీయ అయిన యేసు పేరున బాప్తిస్మం పొందాలని ఆజ్ఞాపించాడు.[a] అప్పుడు వారు కొన్ని రోజులు తమతో ఉండమని అతణ్ణి అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంప్రదాయంగా, “యేసు క్రీస్తు పేరున.”
    reason: Χριστόςకు అర్థానువాదమైన ‘మెస్సీయ’తో పాటు సాంప్రదాయ లిప్యంతరీకరణ ‘క్రీస్తు’ను తెలియజేయడం.
lexical_decisions:
- source_word: προσέταξεν
  choice: ఆజ్ఞాపించాడు
  rationale: ఈ క్రియ అధికారపూర్వకమైన ఆదేశాన్ని సూచిస్తుంది; ‘ఆజ్ఞాపించాడు’ ఆ బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: δὲ
  choice: అందువల్ల
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక, ముందటి సంఘటనల ఫలితంగా కథనం ముందుకు సాగడాన్ని సూచిస్తుంది.
- source_word: ἐν τῷ ὀνόματι
  choice: పేరులో
  rationale: మూలంలోని స్థిరమైన భావవ్యక్తీకరణను నిలుపుతూ, అధికారము, విధేయత లేదా నామాహ్వానం వంటి సాధ్యమైన భావాలను ఒక్కదానికే పరిమితం చేయదు.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తుంది; ‘మెస్సీయ’ దాని అర్థాన్ని తెలుపుతుంది, ‘యేసు’ను పేరుగా ఉంచుతుంది.
- source_word: βαπτισθῆναι
  choice: బాప్తిస్మం ఇవ్వాలని
  rationale: గ్రీకు నిష్క్రియార్థక క్రియను తెలుగులో సహజమైన ప్రయోజ్య నిర్మాణంతో వ్యక్తపరుస్తుంది; బాప్తిస్మ విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: τότε
  choice: అప్పుడు
  rationale: తదుపరి సంఘటనను సూచించే సహజమైన కాలక్రమ పదం.
- source_word: ἠρώτησαν
  choice: అడిగారు
  rationale: విన్నపాన్ని సూచించే సరళమైన పదం; మూలంలో లేని తీవ్రతను చేర్చదు.
- source_word: ἐπιμεῖναι
  choice: తమతో ఉండమని
  rationale: కొంతకాలం అక్కడే కొనసాగి ఉండాలనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἡμέρας τινάς
  choice: కొన్ని రోజులు
  rationale: కాలవ్యవధిని నిర్దిష్టం చేయకుండా మూలంలోని అనిశ్చితిని నిలుపుతుంది.
theological_decisions:
- issue: బాప్తిస్మ సూత్రంలో Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός యేసుకు బిరుదుగా, ఒప్పుకోలు స్వరూపంలో ఉంది. అందుచేత దాని అర్థాన్ని తెలిపే ‘మెస్సీయ’ను ప్రధాన పాఠ్యంలో ఉంచి, సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. ‘పేరులో’ అనే మూల రూపాన్ని నిలిపి దాని భావాన్ని ఒకే ధార్మిక వివరణకు పరిమితం చేయలేదు.
