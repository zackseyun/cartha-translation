source:
  edition: SBLGNT
  text: ὑμεῖς οἴδατε τὸ γενόμενον ῥῆμα καθ’ ὅλης τῆς Ἰουδαίας, ⸀ἀρξάμενος ἀπὸ τῆς Γαλιλαίας μετὰ τὸ βάπτισμα ὃ ἐκήρυξεν Ἰωάννης,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/037.yaml
  text: You yourselves know the thing that happened throughout all Judea[a], beginning from Galilee after the baptism that John proclaimed[b],
translation:
  language: te
  text: యోహాను ప్రకటించిన బాప్తిస్మం తర్వాత గలిలయ నుండి మొదలై[b], యూదయ అంతటా జరిగిన సంగతి[a] మీకు స్వయంగా తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదయ అంతటా వ్యాపించిన వాక్యం/సందేశం.” గ్రీకు పదమైన ῥῆμαకు “మాట,” “సందేశం,” లేదా “సంగతి/విషయం” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “మొదలై” అని అనువదించిన గ్రీకు కృదంతపు వ్యాకరణ అన్వయం అసాధారణంగా ఉంది; అయినా ఆ సంగతి గలిలయ నుండి మొదలైందనే భావం స్పష్టంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς οἴδατε
  choice: మీకు స్వయంగా తెలుసు
  rationale: క్రియలోనే వ్యక్తి సూచన ఉన్నప్పటికీ ὑμεῖς ప్రత్యేకంగా వాడబడటం వల్ల కలిగే ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; οἴδατε ఇక్కడ వర్తమానార్థంలో ఉంది.
- source_word: τὸ γενόμενον ῥῆμα
  choice: జరిగిన సంగతి
  rationale: ῥῆμα అనే పదానికి ‘మాట’, ‘సందేశం’, ‘సంగతి/విషయం’ అనే అర్థాలు ఉండవచ్చు. γενόμενονతో కలిసి ఇక్కడ యేసుకు సంబంధించిన బహిరంగ సంఘటనలూ వాటి సమాచారం కలిసిన విస్తృత భావాన్ని ‘జరిగిన సంగతి’ సహజంగా అందిస్తుంది.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: యూదయ అంతటా
  rationale: κατά + షష్ఠీ విభక్తి ఒక ప్రాంతమంతటా వ్యాప్తిని సూచిస్తుంది; ὅληςలోని సమగ్రతను ‘అంతటా’ నిలుపుతుంది.
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: గలిలయ నుండి మొదలై
  rationale: ἀπό ఆరంభ స్థానాన్ని సూచిస్తుంది. గ్రీకులో కృదంతపు అన్వయం వ్యాకరణపరంగా అసాధారణంగా ఉన్నా, సంగతి గలిలయ నుండి మొదలైందనే భావం స్పష్టంగా ఉంది.
- source_word: μετὰ τὸ βάπτισμα
  choice: బాప్తిస్మం తర్వాత
  rationale: μετά + ద్వితీయా విభక్తి ఇక్కడ కాలక్రమాన్ని సూచిస్తుంది; ‘తర్వాత’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: ὃ ἐκήρυξεν Ἰωάννης
  choice: యోహాను ప్రకటించిన
  rationale: κηρύσσω బహిరంగంగా ప్రకటించడాన్ని సూచిస్తుంది; ‘ప్రకటించిన’ దాని ప్రకటనాత్మక బలాన్ని నిలుపుతూ సహజంగా ఉంటుంది.
theological_decisions:
- issue: పేతురు సంక్షిప్త వివరణలో ῥῆμα అర్థం
  choice: ‘జరిగిన సంగతి’ అని అనువదించడం
  alternative: ‘వ్యాపించిన వాక్యం/సందేశం’ అని అనువదించడం
  rationale: యూదయ అంతటా తెలిసినదిగా, గలిలయలో ఆరంభమైనదిగా వర్ణించబడుతున్నది యేసుకు సంబంధించిన సంఘటనలూ వాటి ప్రకటనయూ కలిసిన సమగ్ర సంగతి. ‘సంగతి’ ఈ సందర్భార్థాన్ని అందిస్తుంది; అయితే గ్రీకు పదంలోని ‘వాక్యం/సందేశం’ భావసాధ్యతను పాదసూచికలో నిలిపాం.
- issue: ἀρξάμενος అనే కృదంతపు అన్వయం
  choice: ముందున్న ‘సంగతి’ గలిలయ నుండి మొదలైందనే భావంతో తెలుగులో అన్వయించడం
  alternative: ఒక అంతర్లీన కర్తతో ‘అది మొదలైంది’ అని విడివాక్యంగా అనువదించడం
  rationale: గ్రీకులో పుంలింగ కృదంతం నపుంసకలింగ ῥῆμαతో నేరుగా సరిపోకపోవడం వల్ల నిర్మాణం అసాధారణంగా ఉంది. అయినా ఆరంభ స్థలం గలిలయ అనేది స్పష్టం; తెలుగులో అదనపు కర్తను చేర్చకుండా భావాన్ని సహజంగా తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యక్రమం కోసం కాల-స్థల భాగాన్ని ముందుకు తెచ్చాం. ‘బాప్తిస్మం’, ‘ప్రకటించిన’ వంటి స్థిరమైన, గౌరవప్రదమైన పదాలను వాడాం. వాక్యం సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండగా, ῥῆμαలోని నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో ఉంచాం.
