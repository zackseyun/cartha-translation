source:
  edition: SBLGNT
  text: καταβὰς δὲ Πέτρος πρὸς τοὺς ἄνδρας εἶπεν· Ἰδοὺ ἐγώ εἰμι ὃν ζητεῖτε· τίς ἡ αἰτία δι’ ἣν πάρεστε;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/021.yaml
  text: So Peter went down to the men and said[a], “Look, I am the one you are looking for. Why are you here?”
translation:
  language: te
  text: అప్పుడు పేతురు ఆ మనుషుల దగ్గరికి దిగి వచ్చి, “ఇదిగో, మీరు వెదుకుతున్నవాణ్ణి నేనే. మీరు ఇక్కడికి రావడానికి కారణమేమిటి?” అని అడిగాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταβὰς
  choice: దిగి వచ్చి
  rationale: పేతురు పైకప్పు లేదా పైభాగం నుంచి కింద ఉన్నవారి దగ్గరికి దిగిన దిశాభావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ బలమైన వ్యతిరేకత కాకుండా కథనంలోని తదుపరి ఘట్టాన్ని సూచిస్తుంది.
- source_word: πρὸς τοὺς ἄνδρας
  choice: ఆ మనుషుల దగ్గరికి
  rationale: వారి వైపు కదలి, వారిని ఉద్దేశించి మాట్లాడిన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: మాట్లాడేవాడు తన గుర్తింపుపై శ్రద్ధ నిలిపే సంభాషణ సూచక పదం; ఆధునిక తెలుగులోనూ సహజంగా ఉంటుంది.
- source_word: ἐγώ εἰμι ὃν ζητεῖτε
  choice: మీరు వెదుకుతున్నవాణ్ణి నేనే
  rationale: సాపేక్ష వాక్యంలోని గుర్తింపు భావాన్ని, ἐγώ పై ఉన్న ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: τίς ἡ αἰτία δι’ ἣν πάρεστε
  choice: మీరు ఇక్కడికి రావడానికి కారణమేమిటి?
  rationale: αἰτία లోని స్పష్టమైన ‘కారణం’ భావాన్ని నిలుపుతూ, πάρεστε సూచించే వారి అక్కడి హాజరును సందర్భానుగుణంగా సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. మూలంలోని ప్రశ్నను అనవసరంగా విస్తరించలేదు; ఈ వచనంలో ప్రత్యేక సిద్ధాంతపరమైన వివాదం లేదు.
