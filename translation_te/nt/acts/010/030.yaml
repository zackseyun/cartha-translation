id: ACT.10.30
reference: Acts 10:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὁ Κορνήλιος ἔφη· Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας ⸀ἤμην τὴν ⸀ἐνάτην προσευχόμενος ἐν τῷ οἴκῳ μου, καὶ ἰδοὺ ἀνὴρ ἔστη ἐνώπιόν μου ἐν ἐσθῆτι λαμπρᾷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/030.yaml
  text: And Cornelius said, “Four days ago, up to this hour, I was praying at the ninth hour in my house, and behold, a man stood before me in bright clothing.”
translation:
  language: te
  text: 'కొర్నేలి ఇలా అన్నాడు: “నాలుగు రోజుల క్రితం ఇదే సమయానికి, తొమ్మిదో గంటకు[a] నేను నా ఇంట్లో ప్రార్థిస్తూ ఉన్నాను. అప్పుడు ఇదిగో, ప్రకాశవంతమైన వస్త్రాలు ధరించిన ఒక మనిషి నా ఎదుట నిలిచాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, మధ్యాహ్నం దాదాపు మూడు గంటలకు.
    reason: cultural_note
lexical_decisions:
- source_word: ἔφη
  choice: ఇలా అన్నాడు
  rationale: కథనంలో సంభాషణను పరిచయం చేసే aorist క్రియకు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας
  choice: నాలుగు రోజుల క్రితం ఇదే సమయానికి
  rationale: ఈ గ్రీకు కాలవ్యవహారం ప్రస్తుత సమయానికి నాలుగు రోజుల ముందు ఉన్న ఇదే సమయాన్ని సూచిస్తుంది. నాలుగు రోజులపాటు నిరంతరంగా ప్రార్థించాడనే అపార్థం రాకుండా, దాని భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἤμην ... προσευχόμενος
  choice: ప్రార్థిస్తూ ఉన్నాను
  rationale: గతంలో కొనసాగుతున్న కార్యాన్ని సూచించే periphrastic imperfect భావాన్ని నిలుపుతుంది.
- source_word: τὴν ἐνάτην
  choice: తొమ్మిదో గంటకు
  rationale: మూల సంస్కృతిలోని కాలగణనను ప్రధాన పాఠ్యంలో నిలిపి, ఆధునిక సమయ సమానార్థాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: ἐν τῷ οἴκῳ μου
  choice: నా ఇంట్లో
  rationale: భౌతిక స్థలాన్ని సూచించే οἶκος‌కు స్పష్టమైన, సహజమైన తెలుగు సమానం.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: వివరణలోని ఆకస్మికతను, సజీవతను నిలుపుతుంది.
- source_word: ἀνὴρ
  choice: ఒక మనిషి
  rationale: మానవ పురుషుని రూపంలో కనిపించిన వ్యక్తిని సూచించే సహజమైన తెలుగు పదబంధం.
- source_word: ἔστη ἐνώπιόν μου
  choice: నా ఎదుట నిలిచాడు
  rationale: వ్యక్తి తన ముందుకు వచ్చి నిలిచినట్లు గ్రీకు పదబంధం తెలిపే ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది.
- source_word: ἐν ἐσθῆτι λαμπρᾷ
  choice: ప్రకాశవంతమైన వస్త్రాలు ధరించిన
  rationale: ἐσθής సూచించే వస్త్రాన్ని, λαμπρός సూచించే కాంతిమంతమైన దృశ్యగుణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: τὴν ἐνάτην అనే కాలసూచన అనువాదం
  choice: తొమ్మిదో గంటకు
  alternative: మధ్యాహ్నం దాదాపు మూడు గంటలకు
  rationale: మూలపాఠ్యంలోని ప్రాచీన కాలగణనను ప్రధాన పాఠ్యంలో ఉంచడం ద్వారా మూల సంస్కృతి స్వరూపం నిలుస్తుంది; ఆధునిక గడియార సమానార్థం పాదసూచికలో స్పష్టపరచబడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇదిగో’ అనే పదం మూలంలోని ἰδοὺ కలిగించే ఆకస్మిక సజీవతను నిలుపుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత కాలసూచన వెంట ఉంచబడింది.
