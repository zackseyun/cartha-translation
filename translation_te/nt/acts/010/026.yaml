  text: ὁ δὲ Πέτρος ⸂ἤγειρεν αὐτὸν⸃ λέγων· Ἀνάστηθι· καὶ ἐγὼ αὐτὸς ἄνθρωπός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/026.yaml
  text: But Peter raised him up[a], saying, “Stand up[c][b]; I too am a man.”
translation:
  language: te
  text: అయితే పేతురు అతన్ని పైకి లేపి[a], “లేచి నిలబడు[b]; నేను కూడా మనిషినే[c]” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతన్ని లేవనెత్తి”; లేదా “అతను లేవడానికి సహాయం చేసి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “లే”; లేదా “పైకి లేచి నిలబడు.”
    reason: lexical_alternative
  - marker: c
    text: 'మరింత పదశః: “నేను స్వయంగా కూడా మనిషినే.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν αὐτὸν
  choice: అతన్ని పైకి లేపుతూ
  rationale: ἐγείρω ఇక్కడ పేతురు నేలపై పడి ఉన్న కొర్నేలిని పైకి లేపిన శారీరక చర్యను సూచిస్తుంది. తెలుగు సందర్భంలో ‘పైకి లేపుతూ’ సహజంగా ఉండి, అతడు ఏ విధంగా సహాయం చేశాడో అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: Ἀνάστηθι
  choice: లేచి నిలబడు
  rationale: ἀνίστημι యొక్క ఆజ్ఞారూపం నేలపై ఉన్న వ్యక్తి తన కాళ్లపై నిలబడాలని ఇచ్చిన ప్రత్యక్ష ఆజ్ఞ. ‘లేచి నిలబడు’ కదలికను, తుది స్థితిని రెండింటినీ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: καὶ ἐγὼ αὐτὸς
  choice: నేను కూడా
  rationale: καί సమాన భాగస్వామ్యాన్ని, αὐτός కర్తపై ఉద్ఘాటనను ఇస్తాయి. ‘నేను కూడా’ తెలుగులో ఈ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; మరింత పదశః రూపం పాదసూచికలో ఇవ్వబడింది.
- source_word: ἄνθρωπός εἰμι
  choice: మనిషినే
  rationale: ἄνθρωπος పేతురు కూడా సాధారణ మానవుడేనని తెలియజేస్తుంది. ‘మనిషినే’లోని ఉద్ఘాటన సందర్భానికి సరిపోతుంది; మూలంలో లేని ‘కేవలం’ అనే భావాన్ని చేర్చదు.
- source_word: δὲ
  choice: అయితే
  rationale: δέ గత వచనంలో కొర్నేలి పేతురు పాదాల దగ్గర పడిన చర్యకు పేతురు స్పందనలోని స్వల్ప వ్యతిరేకతను సూచిస్తుంది. ‘అయితే’ ఈ అనుసంధానాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో సహజంగా చూపుతుంది.
theological_decisions:
- issue: భక్తిపూర్వకంగా పాదాలపై పడిన చర్యకు పేతురు స్పందన
  choice: పేతురు తనకిచ్చిన అతిశయ గౌరవాన్ని తన ఉమ్మడి మానవత్వాన్ని ప్రస్తావిస్తూ తిరస్కరించినట్లు వచనం చూపిస్తుంది.
  alternative: దీనిని విస్తృతమైన ఆరాధనా సిద్ధాంతాన్ని సూచించని సాధారణ వినయప్రకటనగా మాత్రమే అర్థం చేసుకోవచ్చు.
  rationale: ‘లేచి నిలబడు; నేను కూడా మనిషినే’ అనే అనువాదం వచనంలోని ప్రత్యక్ష వ్యత్యాసాన్ని నిలుపుతుంది. అయితే ఈ ఒక్క వాక్యం చెప్పేదానికంటే మించి ఆరాధన లేదా గౌరవం గురించి సిద్ధాంతపరమైన నిర్ధారణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘మనిషినే’ మూలంలోని ఉద్ఘాటనను సంక్షిప్తంగా నిలుపుతుంది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
