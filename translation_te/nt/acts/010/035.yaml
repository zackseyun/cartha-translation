id: ACT.10.35
reference: Acts 10:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν παντὶ ἔθνει ὁ φοβούμενος αὐτὸν καὶ ἐργαζόμενος δικαιοσύνην δεκτὸς αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/035.yaml
  text: but in every nation the one who fears him and does what is righteous is acceptable to him[a][b][c].
translation:
  language: te
  text: కాని ప్రతి జనసమూహంలోనూ ఆయనకు భయపడుతూ నీతిని[a] ఆచరించే వ్యక్తి ఆయనకు అంగీకారయోగ్యుడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “న్యాయాన్ని ఆచరించే.”
    reason: δικαιοσύνη సాధారణంగా ‘నీతి’ అని అర్థం; కొన్ని సందర్భాల్లో ‘న్యాయం’ అనే భావాన్నీ కలిగి ఉండవచ్చు.
  - marker: b
    text: లేదా, “ఆయన చేత అంగీకరించబడతాడు.”
    reason: δεκτὸς αὐτῷ ἐστιν అనే predicate-adjective నిర్మాణాన్ని తెలుగులో కర్మణి రూపంతో కూడా వ్యక్తం చేయవచ్చు.
lexical_decisions:
- source_word: ἀλλ’
  choice: కాని
  rationale: మునుపటి వాక్యంలో దేవుడు పక్షపాతం చూపడనే గ్రహింపుకు విరుద్ధంగా కాక, దానిని వివరిస్తూ వచ్చే సహజమైన వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: ἐν παντὶ ἔθνει
  choice: ప్రతి జనంలోనూ
  rationale: ἔθνος ఇక్కడ ప్రజాజనాన్ని లేదా జనాన్ని సూచిస్తుంది; ఆధునిక రాజకీయ దేశ భావాన్ని అతిగా రుద్దకుండా మూలంలోని విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: ὁ φοβούμενος αὐτὸν
  choice: ఆయనకు భయపడి
  rationale: దేవునిపట్ల భక్తితో కూడిన భయాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; కర్తను తదుపరి కృదంతంతో కలిపి లింగనిరపేక్షంగా ఉంచుతుంది.
- source_word: καὶ ἐργαζόμενος δικαιοσύνην
  choice: నీతిని ఆచరించే
  rationale: ἐργάζομαι క్రియాశీల ప్రవర్తనను సూచిస్తుంది. ‘నీతిని ఆచరించడం’ మూలంలోని నామవాచక రూపాన్ని నిలుపుతూ సహజమైన తెలుగుగా ఉంది.
- source_word: δικαιοσύνην
  choice: నీతి
  rationale: δικαιοσύνη యొక్క నైతిక సత్ప్రవర్తన భావాన్ని నిలుపుతుంది; ఈ సందర్భంలో కేవలం న్యాయనిర్వహణకు పరిమితం చేయదు.
- source_word: δεκτὸς αὐτῷ ἐστιν
  choice: ఆయనకు అంగీకారయోగ్యుడు
  rationale: ఇది కర్తరి భావంలోని predicate adjective నిర్మాణాన్ని దగ్గరగా ప్రతిబింబిస్తుంది; ‘ఆయన చేత అంగీకరించబడతాడు’ అనే కర్మణి ప్రత్యామ్నాయాన్ని పాఠంలోనే నిర్ణయించదు.
theological_decisions:
- issue: ఈ వాక్యం క్రియల ద్వారా రక్షణ సంపాదించడాన్ని బోధిస్తుందా, లేక దేవుడు జాతిపరమైన పక్షపాతం లేకుండా అంగీకరించే వ్యక్తిని వర్ణిస్తుందా?
  choice: దేవునికి భయపడి నీతిని ఆచరించే వ్యక్తి ప్రతి జనంలోనూ ఆయనకు అంగీకారయోగ్యుడని పాఠం చెప్పినంతవరకే అనువాదం నిలుస్తుంది.
  alternative: ‘తన క్రియలవల్ల దేవుని అంగీకారాన్ని సంపాదిస్తాడు’ లేదా ‘రక్షించే విశ్వాసానికి రుజువు చూపుతాడు’ అని వివరణాత్మకంగా అనువదించడం.
  rationale: గ్రీకు వాక్యం దేవునికి భయపడటం, నీతిని ఆచరించడం, ఆయనకు అంగీకారయోగ్యంగా ఉండటం మధ్య సంబంధాన్ని చెబుతుంది; ఆ సంబంధం యొక్క సంపూర్ణ సిద్ధాంత వివరణను ఇవ్వదు. అందువల్ల వేదాంత ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన ‘ఆయన’ సర్వనామం దేవునిని సూచిస్తుంది. ‘ప్రతి జనంలోనూ’ జాతి లేదా ప్రజాసమూహ భావాన్ని సహజంగా ఉంచుతుంది. ‘వ్యక్తి’ వాడకం మూలంలోని ప్రతినిధి ఏకవచనాన్ని లింగపరిమితి లేకుండా తెలియజేస్తుంది.
