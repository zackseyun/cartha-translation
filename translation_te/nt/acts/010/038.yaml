revisions:
- from: నజరేతుకు చెందిన యేసును[a] దేవుడు పరిశుద్ధాత్మతోనూ శక్తితోనూ అభిషేకించాడు. దేవుడు ఆయనకు తోడుగా ఉన్నందువల్ల, ఆయన అంతటా తిరుగుతూ మేలు చేశాడు; అపవాది చేత అణచివేయబడిన వారందరినీ స్వస్థపరిచాడు.
  to: నజరేతు నుండి వచ్చిన యేసును దేవుడు పరిశుద్ధాత్మతోను శక్తితోను అభిషేకించాడు. ఆయన మేలు చేస్తూ, అపవాది చేత అణచివేయబడుతున్న వారందరినీ స్వస్థపరుస్తూ సంచరించాడు, ఎందుకంటే దేవుడు ఆయనతో ఉన్నాడు.
  rationale: The revision directly expresses Jesus' origin from Nazareth and preserves the Greek participial portrayal of his ministry as going about while doing good and healing. It retains the source's causal statement without adding a doctrinal explanation. The existing footnote anchor remains valid and now gives the draft's original, idiomatic alternative.
