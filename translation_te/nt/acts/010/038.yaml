id: ACT.10.38
reference: Acts 10:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ, ὡς ἔχρισεν αὐτὸν ὁ θεὸς πνεύματι ἁγίῳ καὶ δυνάμει, ὃς διῆλθεν εὐεργετῶν καὶ ἰώμενος πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου, ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/038.yaml
  text: 'Jesus of Nazareth: how God anointed him with the Holy Spirit and with power[a]; he went about doing good and healing all who were oppressed by the devil[c][b], because God was with him.'
translation:
  language: te
  text: నజరేతు నుండి వచ్చిన యేసును దేవుడు పరిశుద్ధాత్మతోను శక్తితోను అభిషేకించాడు. ఆయన మేలు చేస్తూ, అపవాది చేత అణచివేయబడుతున్న వారందరినీ స్వస్థపరుస్తూ సంచరించాడు, ఎందుకంటే దేవుడు ఆయనతో ఉన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ
  choice: నజరేతుకు చెందిన యేసును
  rationale: ἀπό మూలంగా యేసు నజరేతుతో సంబంధమున్నవాడని, అక్కడి నుండి వచ్చినవాడని గుర్తిస్తుంది. మునుపటి వాక్యంతో అనుసంధానమైన గ్రీకు కర్మ విభక్తిని ‘యేసును’ నిలుపుతుంది; ‘నజరేతుకు చెందిన’ అనేది ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: ὡς ἔχρισεν
  choice: దేవుడు ... అభిషేకించాడు
  rationale: ὡς ఇక్కడ యేసును గూర్చిన విషయాన్ని పరిచయం చేస్తుంది. విడిగా చదివే తెలుగు వచనంలో అసహజమైన ‘ఎలా అభిషేకించాడో’ అనే అసంపూర్ణ నిర్మాణం బదులు, విషయార్థాన్ని స్పష్టమైన వాక్యంగా అందించాం. χρίω యొక్క అభిషేక భావాన్నీ దాని మెస్సీయ సంబంధిత ప్రతిధ్వనినీ ‘అభిషేకించాడు’ నిలుపుతుంది.
- source_word: πνεύματι ἁγίῳ καὶ δυνάμει
  choice: పరిశుద్ధాత్మతోనూ శక్తితోనూ
  rationale: ద్వంద్వ సాధనార్థక దత్తి విభక్తిని ‘తోనూ ... తోనూ’ స్పష్టంగా చూపుతుంది. ‘పరిశుద్ధాత్మ’ను ‘శక్తి’తో కలిపివేయకుండా రెండింటినీ వేర్వేరుగా నిలుపుతుంది.
- source_word: διῆλθεν εὐεργετῶν
  choice: అంతటా తిరుగుతూ మేలు చేశాడు
  rationale: διέρχομαι ఇక్కడ యేసు ప్రాంతాల మధ్య సంచరించిన పరిచర్యను సూచిస్తుంది; ‘అంతటా తిరుగుతూ’ సహజమైన తెలుగు. εὐεργετέω యొక్క విస్తృతమైన ఉపకార భావాన్ని ‘మేలు చేశాడు’ సరళంగా తెలియజేస్తుంది.
- source_word: ἰώμενος πάντας τοὺς καταδυναστευομένους
  choice: అణచివేయబడిన వారందరినీ స్వస్థపరిచాడు
  rationale: καταδυναστεύω లోని కఠిన ఆధిపత్యం లేదా పీడన భావాన్ని ‘అణచివేయబడిన’ తెలియజేస్తుంది; ἰάομαι కు ‘స్వస్థపరిచాడు’ ప్రత్యక్షమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: అపవాది చేత
  rationale: διάβολος ఇక్కడ వ్యక్తిగత దుష్టుని సూచిస్తుంది. ‘అపవాది’ స్థిరమైన బైబిలు పదప్రయోగం; ‘చేత’ అతడే అణచివేతకు కర్త అని స్పష్టం చేస్తుంది.
- source_word: ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ
  choice: దేవుడు ఆయనకు తోడుగా ఉన్నందువల్ల
  rationale: ὅτι యొక్క కారణార్థాన్ని ‘ఉన్నందువల్ల’ స్పష్టంగా తెలియజేస్తుంది. ‘తోడుగా’ అనేది μετ’ αὐτοῦ లోని సహవాసం లేదా సన్నిధి భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: యేసు అభిషేకం ఆయన గుర్తింపు, పరిచర్యలతో కలిగిన సంబంధం
  choice: ‘అభిషేకించాడు’ అనే మూల రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: ‘మెస్సీయగా నియమించాడు’ లేదా కేవలం ‘శక్తినిచ్చాడు’ అని వివరణాత్మకంగా మార్చడం
  rationale: వచనం χρίω అనే క్రియను ఉపయోగిస్తుంది. ‘అభిషేకించాడు’ దాని బైబిలు-దైవశాస్త్ర ప్రతిధ్వనిని కాపాడుతుంది; అయితే వచనంలో ప్రత్యక్షంగా లేని సిద్ధాంత వివరణను చేర్చదు.
- issue: πνεύματι ἁγίῳ యొక్క సూచన
  choice: వ్యక్తిగతమైన పరిశుద్ధాత్మను సూచించేలా ‘పరిశుద్ధాత్మతో’ అని అనువదించడం
  alternative: దానిని వ్యక్తిత్వరహితమైన ‘పవిత్ర శక్తి’గా మార్చడం
  rationale: అపొస్తలుల కార్యముల సందర్భంలో ఈ పదబంధం పరిశుద్ధాత్మను సూచిస్తుంది. అంతేకాక మూలం ‘పరిశుద్ధాత్మ’ను ‘శక్తి’ నుండి వేరుగా పేర్కొంటుంది.
- issue: దేవుడు యేసుకు తోడుగా ఉండడం మరియు ఆయన పరిచర్య మధ్య కారణ సంబంధం
  choice: ὅτι యొక్క కారణార్థాన్ని ‘ఉన్నందువల్ల’ అని నిలుపడం
  alternative: ‘ఎందుకంటే దేవుడు ఆయనకు తోడుగా ఉన్నాడు’ అని స్వతంత్ర వివరణగా ఇవ్వడం లేదా కారణ సంబంధాన్ని బలహీనపరచడం
  rationale: గ్రీకు వాక్యం దేవుని సన్నిధిని యేసు చేసిన మేలు, స్వస్థతలకున్న కారణంగా చెబుతుంది. దీనిని క్రీస్తు స్వరూపంపై వచనం చెప్పనిదేదీ నిర్ధారించేలా లేదా నిరాకరించేలా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు పాఠంలోని కర్మ విభక్తి మునుపటి వాక్యంతో ఉన్న అనుసంధానాన్ని చూపేందుకు ‘యేసును’గా నిలిపాం; అయినా విడిగా చదివినప్పుడు వాక్యం సులభంగా అర్థమయ్యేలా ὡς-నిర్మాణాన్ని స్పష్టమైన ప్రకటనగా ఇచ్చాం. ‘తోనూ ... తోనూ’ సమాంతరతను, ‘అంతటా తిరుగుతూ’ సంచార పరిచర్య భావాన్ని నిలుపుతున్నాయి.
