id: ACT.10.3
reference: Acts 10:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶδεν ἐν ὁράματι φανερῶς ὡσεὶ ⸀περὶ ὥραν ἐνάτην τῆς ἡμέρας ἄγγελον τοῦ θεοῦ εἰσελθόντα πρὸς αὐτὸν καὶ εἰπόντα αὐτῷ· Κορνήλιε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/003.yaml
  text: He saw clearly in a vision[a], about the ninth hour of the day, an angel of God coming in to him and saying to him[b], “Cornelius.”
translation:
  language: te
  text: అతడు, పగటి తొమ్మిదో గంటకు సుమారుగా[a], దర్శనంలో దేవుని దూత తన దగ్గరకు వచ్చి అతనితో, “కొర్నేలీ!” అని చెప్పడాన్ని స్పష్టంగా[b] చూశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఆధునిక కాలగణన ప్రకారం ఇది మధ్యాహ్నం సుమారు మూడు గంటలు.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘తేటగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: చూశాడు
  rationale: ὁράω క్రియ యొక్క భూతకాల కథన రూపాన్ని సహజమైన తెలుగులో ప్రత్యక్ష దృశ్యానుభవంగా వ్యక్తపరుస్తుంది.
- source_word: ἐν ὁράματι
  choice: ఒక దర్శనంలో
  rationale: ὅραμα ఇక్కడ దేవుడు అనుగ్రహించిన అతీంద్రియ దృశ్యాన్ని సూచిస్తుంది; దాని విధానాన్ని అవసరానికి మించి నిర్ధారించకుండా ‘దర్శనం’ అని అనువదించాం.
- source_word: φανερῶς
  choice: స్పష్టంగా
  rationale: ఆ దర్శనం అస్పష్టమైనది కాకుండా తేటగా కనిపించిందనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὡσεὶ περὶ ὥραν ἐνάτην τῆς ἡμέρας
  choice: పగటి తొమ్మిదో గంట సమయంలో
  rationale: గ్రీకు మూలంలోని ప్రాచీన గంటల లెక్కను ప్రధాన వచనంలో నిలుపుతూ, ὡσεὶ మరియు περὶ తెలిపే సుమారు సమయ భావాన్ని ‘సమయంలో’ అనే సహజ ప్రయోగంతో అందించాం; ఆధునిక సమాన సమయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἄγγελον τοῦ θεοῦ
  choice: దేవుని దూత
  rationale: దర్శన సందర్భంలో ἄγγελος మానవ వార్తాహరుడిని కాక పరలోక దూతను సూచిస్తుంది; తెలుగులో స్థిరమైన, సహజమైన పదబంధం ఇది.
- source_word: εἰσελθόντα πρὸς αὐτὸν
  choice: తన దగ్గరకు లోపలికి వచ్చి
  rationale: εἰσέρχομαιలోని లోపలికి ప్రవేశించే కదలికను విడిచిపెట్టకుండా, కొర్నేలి సన్నిధికి రావడాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: καὶ εἰπόντα αὐτῷ
  choice: తనతో చెప్పడం
  rationale: గ్రీకులోని రెండో కృదంతాన్ని ప్రధాన క్రియ ‘చూశాడు’తో అనుసంధానిస్తూ, అతడు దర్శనంలో చూసినదానినీ విన్న మాటనూ తెలుగులో సహజంగా కలుపుతుంది.
- source_word: Κορνήλιε
  choice: కొర్నేలీ
  rationale: ఇది కొర్నేలిని నేరుగా సంబోధించే విభక్తి రూపం; తెలుగు సంబోధనకు సహజంగా ‘కొర్నేలీ!’ అని ఇచ్చాం.
theological_decisions:
- issue: ఈ సందర్భంలో ἄγγελος స్వరూపం
  choice: పరలోక దేవదూత
  alternative: మానవ వార్తాహరుడు
  rationale: సంఘటన స్పష్టంగా దర్శనంలో జరుగుతోంది; అంతేకాక అతడు ‘దేవుని దూత’గా పేర్కొనబడ్డాడు. కాబట్టి పరలోక దూత అనే అర్థమే సందర్భానికి సహజం; మూలంలో లేని అదనపు సిద్ధాంత వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని ప్రాచీన సమయ సూచనను ప్రధాన వచనంలో ఉంచి, ఆధునిక సమానాన్ని పాదసూచికలో ఇచ్చాం. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల వెంట ఉంచాం.
