revisions:
- from: పగటి తొమ్మిదో గంట సమయంలో[a], అతడు ఒక దర్శనంలో దేవుని దూత తన దగ్గరకు లోపలికి వచ్చి, “కొర్నేలీ!” అని తనతో చెప్పడం స్పష్టంగా[b] చూశాడు.
  to: అతడు, పగటి తొమ్మిదో గంటకు సుమారుగా[a], దర్శనంలో దేవుని దూత తన దగ్గరకు వచ్చి అతనితో, “కొర్నేలీ!” అని చెప్పడాన్ని స్పష్టంగా[b] చూశాడు.
  rationale: The revision explicitly preserves the approximate time reference, removes redundant motion wording, and uses idiomatic Telugu for the angel speaking to Cornelius. It retains the vision framework, the angelic designation, the direct vocative, and both correctly anchored footnotes without adding interpretive content.
