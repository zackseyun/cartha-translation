    reason: cultural_note
  - marker: b
    text: లేదా, ‘తేటగా.’
    reason: lexical_alternative
  revision_rationale: The revision explicitly preserves the approximate time reference, removes redundant motion wording, and uses idiomatic Telugu for the angel speaking to Cornelius. It retains the vision framework, the angelic designation, the direct vocative, and both correctly anchored footnotes without adding interpretive content.
