  text: εὐσεβὴς καὶ φοβούμενος τὸν θεὸν σὺν παντὶ τῷ οἴκῳ αὐτοῦ, ⸀ποιῶν ἐλεημοσύνας πολλὰς τῷ λαῷ καὶ δεόμενος τοῦ θεοῦ διὰ παντός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/002.yaml
  text: devout and fearing God with all his household[a], doing many acts of charity for the people and praying to God continually[b],
translation:
  language: te
  text: అతడు భక్తిగలవాడు; తన ఇంటివారందరితో కలిసి దేవునికి భయపడేవాడు[a]. ప్రజలకు ఎన్నో దానాలు చేస్తూ[b], ఎల్లప్పుడూ దేవునికి ప్రార్థించేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవభయంగలవాడు.’ ఈ పదబంధం ఇశ్రాయేలు దేవుణ్ణి ఆరాధించే అన్యజనునికి గుర్తింపుగా కూడా వాడి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఎన్నో దానధర్మాలు చేస్తూ.’ గ్రీకు పదం తరచుగా అవసరంలో ఉన్నవారికి ఇచ్చే దానాలను ప్రత్యేకంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσεβὴς
  choice: భక్తిగలవాడు
  rationale: మతపరమైన జీవితంలో వ్యక్తమయ్యే భక్తి, నిష్ఠలను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: φοβούμενος τὸν θεὸν
  choice: దేవునికి భయపడేవాడు
  rationale: గ్రీకు క్రియాత్మక రూపాన్ని, దేవునిపట్ల భక్తిపూర్వక భయమనే బైబిలు నుడికారాన్ని నిలుపుతుంది.
- source_word: σὺν παντὶ τῷ οἴκῳ αὐτοῦ
  choice: తన ఇంటివారందరితో కలిసి
  rationale: ఇక్కడ οἶκος భవనాన్ని కాక కుటుంబం సహా గృహసముదాయాన్ని సూచిస్తుంది; ఈ అర్థం సాధారణ తెలుగులో సహజంగా వ్యక్తమవుతుంది.
- source_word: ποιῶν ἐλεημοσύνας πολλὰς
  choice: ఎంతో దానధర్మం చేస్తూ
  rationale: ἐλεημοσύνη ముఖ్యంగా అవసరంలో ఉన్నవారికి ఇచ్చే దానాన్ని సూచిస్తుంది; ఏకవచన సమూహార్థక తెలుగు ప్రయోగం గ్రీకులోని విస్తారమైన దాతృత్వ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: τῷ λαῷ
  choice: ప్రజలకు
  rationale: దానధర్మం వల్ల ప్రయోజనం పొందినవారిని సూచించే గ్రీకు దత్తివును నేరుగా, సహజంగా తెలుపుతుంది.
- source_word: δεόμενος τοῦ θεοῦ
  choice: దేవునికి ప్రార్థించేవాడు
  rationale: సందర్భంలో δέομαι దేవునికి మనవి చేయడం లేదా ప్రార్థించడం అనే భావాన్ని కలిగి ఉంది; ఈ అనువాదం సహజంగా, స్పష్టంగా ఉంది.
- source_word: διὰ παντός
  choice: ఎల్లప్పుడూ
  rationale: నిరంతర క్రమబద్ధతను సూచించే నుడికారాన్ని, విరామం లేని చర్యగా అతిశయింపకుండా తెలుపుతుంది.
theological_decisions:
- issue: కొర్నేలికి వాడిన దేవభయ పదబంధం
  choice: దేవునికి భయపడేవాడు
  alternative: దేవభక్తుడు; దేవుణ్ణి ఘనంగా ఎంచేవాడు
  rationale: ఈ పదబంధం సాధారణ దేవభయాన్ని సూచించడంతో పాటు, ఇశ్రాయేలు దేవుణ్ణి ఆరాధించిన అన్యజనునికి గుర్తింపుగా కూడా వాడి ఉండవచ్చు. ప్రధాన పాఠం గ్రీకు క్రియాత్మక రూపాన్ని నిలిపి, చారిత్రక ప్రత్యేకార్థాన్ని ఖచ్చితమని తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. గ్రీకులోని వివరణాత్మక కృదంతాల వరుసను తెలుగులో సహజమైన ‘చేస్తూ’ మరియు అలవాటును తెలిపే క్రియారూపాలతో అందించాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
