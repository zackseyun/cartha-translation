id: ACT.10.7
reference: Acts 10:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς δὲ ἀπῆλθεν ὁ ἄγγελος ὁ λαλῶν ⸀αὐτῷ, φωνήσας δύο τῶν ⸀οἰκετῶν καὶ στρατιώτην εὐσεβῆ τῶν προσκαρτερούντων αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/007.yaml
  text: When the angel who was speaking to him had gone away[a], he called two of his household servants and a devout soldier from among those attending him.
translation:
  language: te
  text: తనతో మాట్లాడుతున్న దూత వెళ్లిపోయిన తర్వాత, అతడు తన ఇంటి సేవకుల్లో ఇద్దరిని[a], తనకు హాజరుగా ఉండేవారిలోనుండి భక్తిగల ఒక సైనికుణ్ణి పిలిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన ఇంటి దాసుల్లో ఇద్దరిని.” గ్రీకు οἰκέται పదం ఇంటికి చెందిన దాసులను లేదా సేవకులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἀπῆλθεν
  choice: వెళ్లిపోయిన తర్వాత
  rationale: దూత వెళ్లిపోవడం తరువాతి చర్యకు ముందే పూర్తయిందని తెలిపే కాలసంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; δέను విడిగా అనువదించకపోయినా సంఘటనల క్రమం నిలిచింది.
- source_word: ὁ ἄγγελος
  choice: దూత
  rationale: తెలుగు బైబిలు వాడుకలో ‘దూత’ పరలోక దూతను సహజంగా సూచిస్తుంది; ఈ సందర్భంలోని దర్శనం ఆ అర్థాన్ని స్పష్టం చేస్తుంది.
- source_word: ὁ λαλῶν αὐτῷ
  choice: తనతో మాట్లాడుతున్న
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న చర్యను సహజమైన సంబంధవాచక భావంతో నిలుపుతుంది.
- source_word: φωνήσας
  choice: పిలిచాడు
  rationale: గ్రీకులో ఇది కృదంతమైనప్పటికీ, ఒక్క వచనంగా చదివినప్పుడు తెలుగులో అసంపూర్ణంగా ఉండకుండా ప్రధాన క్రియగా వ్యక్తం చేయబడింది; తదుపరి వచనంలోని చర్యల క్రమాన్ని మార్చదు.
- source_word: δύο τῶν οἰκετῶν
  choice: తన ఇంటి సేవకుల్లో ఇద్దరిని
  rationale: οἰκέτης ఇంటికి అనుబంధమైన సేవకుణ్ణి లేదా దాసుణ్ణి సూచిస్తుంది. ‘ఇంటి సేవకులు’ గృహసంబంధాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంది; సందర్భం ఆధారంగా ‘తన’ చేర్చబడింది.
- source_word: στρατιώτην εὐσεβῆ
  choice: భక్తిపరుడైన ఒక సైనికుణ్ణి
  rationale: εὐσεβήςలోని భక్తి, దైవభయంతో కూడిన నిష్ఠ అనే భావాన్ని ‘భక్తిపరుడు’ సహజంగా తెలియజేస్తుంది; మూలంలో లేని మరింత నిర్దిష్ట మతపరమైన గుర్తింపును చేర్చదు.
- source_word: τῶν προσκαρτερούντων αὐτῷ
  choice: తనకు సేవచేస్తున్న వారిలో
  rationale: ఈ భాగం సైనికుడు కొర్నేలికి నిరంతరం అందుబాటులో ఉండి సేవచేసే వర్గానికి చెందినవాడని సూచిస్తుంది. ‘వారిలో’ విభాజక షష్ఠీ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఈ సందర్భంలో ἄγγελος స్వభావం
  choice: పరలోక దూతను సూచించే ‘దూత’
  alternative: సాధారణ సందేశవాహకుడు
  rationale: అపొస్తలుల కార్యాలు 10లోని సమీప సందర్భం కొర్నేలి దర్శనంలో దేవుని నుండి వచ్చిన పరలోక ప్రతినిధిని వివరిస్తుంది; కాబట్టి ఇక్కడ సాధారణ మానవ సందేశవాహకుడు అనే అర్థం సందర్భానుకూలం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. గ్రీకు వాక్య నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, వచనం స్వతంత్రంగా చదివినప్పుడు సహజంగా ఉండేందుకు కృదంతాన్ని సమాపక క్రియగా అనువదించాం.
