  yaml_path: translation/nt/acts/010/018.yaml
  text: And they called out and asked whether Simon[a], who is called Peter, was staying here.
translation:
  language: te
  text: వారు గొంతెత్తి పిలిచి, పేతురు అని పిలువబడే సీమోను ఇక్కడ అతిథిగా బస చేస్తున్నాడా[a] అని అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇక్కడ బస చేస్తున్నాడా” లేదా “ఇక్కడ ఆతిథ్యం పొందుతున్నాడా.” గ్రీకు క్రియలో అతిథిగా ఉండడం అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσαντες
  choice: బయట నుంచి పిలిచి
  rationale: ఇంట్లో ఉన్నవారిని గొంతెత్తి పిలిచిన సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘అరిచి’ అనడం సందర్భానికి మించిన తీవ్రతను సూచించవచ్చు.
- source_word: ἐπυνθάνοντο
  choice: అడిగారు
  rationale: అపరిపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న విచారణ భావం సందర్భంలో స్వల్పంగా ఉంది; కథన క్రమంలో ‘అడిగారు’ సహజంగా ఉంటుంది.
- source_word: εἰ
  choice: ఉంటున్నాడా … అని
  rationale: గ్రీకు పరోక్ష ప్రశ్నను తెలుగులో సహజమైన ‘-ఆ అని’ నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: Σίμων ὁ ἐπικαλούμενος Πέτρος
  choice: పేతురు అని పిలువబడే సీమోను
  rationale: రెండు పేర్లను నిలుపుతూ, ἐπικαλούμενος అనే వర్తమాన కర్మణి గుర్తింపు భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐνθάδε
  choice: ఇక్కడ
  rationale: స్థలాన్ని సూచించే గ్రీకు క్రియావిశేషణానికి సరళమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: ξενίζεται
  choice: అతిథిగా ఉంటున్నాడా
  rationale: కేవలం అక్కడ ఉండడం మాత్రమే కాకుండా, మరొకరి ఆతిథ్యంలో అతిథిగా బస చేయడం అనే గ్రీకు క్రియ భావాన్ని కూడా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలి. ‘అతిథిగా ఉంటున్నాడు’ అనే రూపం ξενίζεται లోని ఆతిథ్య భావాన్ని సాధారణ పాఠకుడికి స్పష్టంగా ఉంచుతుంది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోలుతుంది.
