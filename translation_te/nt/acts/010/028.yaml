id: ACT.10.28
reference: Acts 10:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔφη τε πρὸς αὐτούς· Ὑμεῖς ἐπίστασθε ὡς ἀθέμιτόν ἐστιν ἀνδρὶ Ἰουδαίῳ κολλᾶσθαι ἢ προσέρχεσθαι ἀλλοφύλῳ· κἀμοὶ ὁ θεὸς ἔδειξεν μηδένα κοινὸν ἢ ἀκάθαρτον λέγειν ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/028.yaml
  text: And he said to them[a], “You yourselves know how unlawful it is for a Jewish man to associate with or visit a foreigner[b]; but God has shown me to call no person common or unclean.”
translation:
  language: te
  text: 'అతడు వారితో ఇలా అన్నాడు: “ఒక యూదుడు వేరే జాతికి చెందిన వ్యక్తితో సహవాసం చేయడం గానీ, అతని దగ్గరకు వెళ్లడం గానీ నిషిద్ధమని మీకే తెలుసు. అయితే ఏ మనిషినీ సామాన్యుడని[a] గానీ అపవిత్రుడని గానీ పిలవకూడదని దేవుడు నాకు చూపించాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సామాన్యుడు” అనే మాట గ్రీకు κοινός ను అనువదిస్తుంది. ఇది “అపవిత్రుడు” (ἀκάθαρτος) అనే పదానికి భిన్నమైన శుద్ధి-సంబంధిత వర్గాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη τε πρὸς αὐτούς
  choice: అతడు వారితో ఇలా అన్నాడు
  rationale: τέ స్వల్ప అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో సహజమైన కథన ప్రవాహం కోసం ప్రత్యేకంగా ‘మరియు’ చేర్చకుండా సరళంగా అందించబడింది.
- source_word: Ὑμεῖς ἐπίστασθε
  choice: మీకే తెలుసు
  rationale: స్పష్టంగా ఉన్న Ὑμεῖς ఇచ్చే ఉద్ఘాటనను ‘మీకే’ సహజంగా నిలుపుతుంది.
- source_word: ὡς ἀθέμιτόν ἐστιν
  choice: నిషిద్ధమని
  rationale: ἀθέμιτος అనుమతించబడనిది లేదా ఆమోదిత నియమానికి విరుద్ధమైనదనే బలాన్ని చూపుతుంది; కేవలం ‘మర్యాదకాదు’ అని బలహీనపరచదు.
- source_word: ἀνδρὶ Ἰουδαίῳ
  choice: ఒక యూదుడు
  rationale: ప్రతినిధి ఏకవచన భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; సందర్భంలో పురుషుని సూచన కూడా అలాగే ఉంటుంది.
- source_word: κολλᾶσθαι
  choice: సహవాసం చేయడం
  rationale: కలిసిమెలిసి ఉండడం లేదా సంబంధం పెట్టుకోవడం అనే సామాజిక భావాన్ని గౌరవప్రదమైన, అర్థమయ్యే తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἢ προσέρχεσθαι
  choice: అతని దగ్గరకు వెళ్లడం
  rationale: ఇక్కడ వేరే జాతి వ్యక్తి వద్దకు లేదా అతని ఇంటికి వెళ్లే సందర్భోచిత భావాన్ని సహజంగా తెలియజేస్తుంది; ‘సమీపించడం’ కంటే స్పష్టమైనది.
- source_word: ἀλλοφύλῳ
  choice: వేరే జాతికి చెందిన వ్యక్తి
  rationale: ἀλλόφυλος యొక్క ‘వేరే ప్రజకు/జాతికి చెందినవాడు’ అనే ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది; ‘అన్యజనుడు’ అనే మరింత సాంకేతిక పదాన్ని ప్రధాన పాఠంలో తప్పిస్తుంది.
- source_word: κἀμοὶ ὁ θεὸς ἔδειξεν
  choice: అయితే ... దేవుడు నాకు చూపించాడు
  rationale: κἀμοί అక్షరార్థంగా ‘మరియు నాకు’ అయినప్పటికీ, ముందున్న సామాజిక అవగాహనకు దేవుని ప్రకటనతో వచ్చే వ్యత్యాసాన్ని ‘అయితే’ సహజంగా చూపుతుంది; గ్రీకు అఓరిస్టును సరళ భూతకాలంతో అనువదిస్తుంది.
- source_word: μηδένα ... ἄνθρωπον
  choice: ఏ మనిషినీ
  rationale: ἄνθρωπος ఇక్కడ సమస్త మానవులను సూచిస్తుంది; తెలుగు ‘మనిషి’ సాధారణ మానవార్థంలో సహజంగా పనిచేస్తుంది.
- source_word: κοινὸν
  choice: సామాన్యుడు
  rationale: యూదుల శుద్ధి వర్గీకరణలో κοινός సూచించే ‘సాధారణ/పవిత్ర వినియోగానికి వేరైన’ భావాన్ని ἀκάθαρτος నుండి వేరు చేసి నిలుపుతుంది.
- source_word: ἢ ἀκάθαρτον
  choice: అపవిత్రుడు
  rationale: ἀκάθαρτος యొక్క శుద్ధి-అశుద్ధి సంబంధిత భావాన్ని తెలుగులోని స్థిరమైన పదంతో అందించి, κοινός తోనున్న జంటను వేరు చేస్తుంది.
- source_word: λέγειν
  choice: పిలవకూడదని
  rationale: ఇక్కడ ‘చెప్పడం/పేర్కొనడం’ అనే భావాన్ని వ్యక్తులపై ఒక వర్గీకరణను మోపే ‘పిలవడం’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యూదుల సామాజిక-శుద్ధి హద్దులకు దేవుని ప్రకటనకు మధ్య సంబంధం
  choice: యూదునికి ఆ సహవాసం నిషిద్ధమని పేతురు చెప్పిన బలాన్ని నిలుపుతూ, దేవుడు ఏ మనిషినీ సామాన్యుడు లేదా అపవిత్రుడు అని పిలవవద్దని చూపించిన సవరణను స్పష్టంగా ఉంచడం.
  alternative: ἀθέμιτον ను కేవలం ‘అనుచితం’ అని బలహీనపరచడం, లేదా κοινός మరియు ἀκάθαρτος రెండింటినీ ఒకే ‘అపవిత్రుడు’ అనే పదంలో కలపడం.
  rationale: మొదటి వాక్యభాగాన్ని కేవలం సామాజిక మర్యాదగా తగ్గించకూడదు; అదే సమయంలో అది ఏ నిర్దిష్ట లిఖిత ధర్మశాస్త్ర ఆజ్ఞ అని పాఠంలో లేనిదాన్ని చేర్చకూడదు. దర్శనం ఆహారానికే పరిమితం కాకుండా మనుషులపై వర్తించిందని ‘ఏ మనిషినీ’ స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘వేరే జాతికి చెందిన వ్యక్తి’ మూలపదపు ప్రజా/జాతి భేదాన్ని స్పష్టంగా ఉంచుతుంది. ‘సామాన్యుడు—అపవిత్రుడు’ అనే కొంత అసాధారణమైన జంట మూలంలోని ఉద్దేశపూర్వక శుద్ధి-పదభేదాన్ని కాపాడేందుకు నిలుపబడింది.
