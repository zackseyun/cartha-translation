id: ACT.10.36
reference: Acts 10:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸν λόγον ⸀ὃν ἀπέστειλεν τοῖς υἱοῖς Ἰσραὴλ εὐαγγελιζόμενος εἰρήνην διὰ Ἰησοῦ Χριστοῦ· οὗτός ἐστιν πάντων κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/036.yaml
  text: the message that he sent to the sons of Israel[c][b][a], proclaiming peace through Jesus the Messiah—he is Lord of all.
translation:
  language: te
  text: ఆయన ఇశ్రాయేలు ప్రజలకు సందేశాన్ని పంపి, మెస్సీయ అయిన యేసు ద్వారా శాంతి సువార్తను ప్రకటించాడు[a]—ఈయనే అందరికీ ప్రభువు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మెస్సీయ అయిన యేసు ద్వారా శాంతిని సువార్తగా ప్రకటించాడు.”
    reason: εὐαγγελιζόμενος εἰρήνην అనే గ్రీకు పదబంధాన్ని తెలుగులో ‘శాంతి సువార్తను ప్రకటించాడు’ లేదా ‘శాంతిని సువార్తగా ప్రకటించాడు’ అని వ్యక్తం చేయవచ్చు.
lexical_decisions:
- source_word: τὸν λόγον
  choice: సందేశాన్ని
  rationale: ఇక్కడ λόγος ఒకే పదాన్ని కాక, దేవుడు ఇశ్రాయేలుకు పంపిన ప్రకటనలోని విషయాన్ని సూచిస్తుంది; అందువల్ల ఆధునిక తెలుగులో ‘సందేశం’ సహజంగా, సందర్భానుగుణంగా ఉంటుంది.
- source_word: ὃν ἀπέστειλεν
  choice: పంపి
  rationale: గ్రీకు సంబంధవాచక నిర్మాణాన్ని తెలుగులో సహజమైన అనుసంధాన క్రియగా మార్చి, పంపినవాడు ముందటి సందర్భంలోని దేవుడే అనే సూచనను ‘ఆయన’తో నిలిపింది.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: ఇశ్రాయేలు ప్రజలకు
  rationale: ‘ఇశ్రాయేలు కుమారులు’ అనే గ్రీకు సంప్రదాయ ప్రయోగం మొత్తం ఇశ్రాయేలు ప్రజలను సూచిస్తుంది; తెలుగులో ‘ఇశ్రాయేలు ప్రజలు’ అదే సమూహార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: εὐαγγελιζόμενος εἰρήνην
  choice: శాంతి సువార్తను ప్రకటించాడు
  rationale: εὐαγγελίζομαι లోని శుభవార్త ప్రకటించే భావాన్ని ‘సువార్తను ప్రకటించాడు’ నిలుపుతుంది; εἰρήνην ను నేరుగా ‘శాంతి’గా అనువదించింది.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: మెస్సీయ అయిన యేసు ద్వారా
  rationale: διά సాధనాన్ని లేదా మధ్యవర్తిత్వాన్ని ‘ద్వారా’గా తెలియజేస్తుంది. Χριστός ఇక్కడ బిరుదుగా పనిచేస్తున్నందున దాని అర్థాన్ని ‘మెస్సీయ’గా వ్యక్తం చేసింది.
- source_word: οὗτός
  choice: ఈయనే
  rationale: సాధారణ ‘ఆయన’ కంటే గ్రీకు సూచనార్థక సర్వనామంలోని ఉద్ఘాటనను ‘ఈయనే’ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: πάντων κύριος
  choice: అందరికీ ప్రభువు
  rationale: ఈ సందర్భంలో πάντων విశ్వవ్యాప్త అధికారాన్ని సూచిస్తుంది; ‘అందరికీ ప్రభువు’ సహజమైన తెలుగులో ఆ భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ లో Χριστός అనువాదం
  choice: మెస్సీయ అయిన యేసు
  alternative: యేసు క్రీస్తు
  rationale: Χριστός ను కేవలం స్థిరనామంలా లిప్యంతరీకరించకుండా, ఈ ప్రసంగ సందర్భంలో క్రియాశీలంగా ఉన్న ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదార్థాన్ని చూపింది.
- issue: οὗτός ἐστιν πάντων κύριος లో ఉద్ఘాటన
  choice: ఈయనే అందరికీ ప్రభువు
  alternative: ఆయన అందరికీ ప్రభువు
  rationale: οὗτός లోని ఉద్ఘాటన యేసునే స్పష్టంగా సూచిస్తుంది. ‘ఈయనే’ ఆ బలాన్ని అదనపు సిద్ధాంతార్థం చేర్చకుండా నిలుపుతుంది.
- issue: πάντων యొక్క పరిధి
  choice: అందరికీ
  alternative: సమస్తానికి
  rationale: గ్రీకు రూపం వ్యక్తులందరినీ లేదా సమస్తాన్నీ సూచించగలదు. సందర్భంలో యూదులు, అన్యజనులు అనే మానవ సమూహాలపై ప్రభుత్వం ప్రధానంగా కనిపించేందున ‘అందరికీ’ ఎంచుకుంది; విశ్వవ్యాప్త ప్రభుత్వ భావం అలాగే ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభమైన శైలి. గ్రీకు సంబంధవాచక వాక్య నిర్మాణాన్ని తెలుగులో సహజమైన అనుసంధాన క్రియగా మార్చింది. ‘ఈయనే’ ద్వారా మూలంలోని ఉద్ఘాటనను నిలిపింది; ‘మెస్సీయ అయిన యేసు’ బిరుదార్థాన్ని స్పష్టం చేస్తుంది.
