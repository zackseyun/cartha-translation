  yaml_path: translation/nt/acts/010/005.yaml
  text: And now send men to Joppa and summon a certain Simon who is called Peter[a].
translation:
  language: te
  text: ఇప్పుడు యొప్పేకు మనుషులను పంపి, పేతురు అని పిలువబడే ఒక సీమోనును పిలిపించు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పేతురు అని ప్రసిద్ధి చెందిన సీమోనును పిలిపించు.”
    reason: ἐπικαλεῖταιను సందర్భానుసారం ‘ప్రసిద్ధి చెందిన’ అని కూడా వ్యక్తం చేయవచ్చు.
lexical_decisions:
- source_word: καὶ νῦν
  choice: ఇప్పుడు
  rationale: ముందటి మాటకు కొనసాగింపుగా ఉన్న καίని తెలుగులో సహజమైన ప్రవాహంలో ప్రత్యేకంగా అనువదించకుండా, νῦν యొక్క ఆదేశాత్మక సందర్భాన్ని ‘ఇప్పుడు’తో స్పష్టంగా తెలిపాం.
- source_word: πέμψον ἄνδρας εἰς Ἰόππην
  choice: యొప్పేకు మనుషులను పంపించి
  rationale: πέμψον ఆజ్ఞార్థక క్రియ; ἄνδρας పురుషులను సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో తరువాతి ప్రధాన ఆజ్ఞతో కలపడానికి ‘పంపించి’ సహజంగా ఉంది; యొప్పే దిశను ‘-కు’ తెలియజేస్తుంది.
- source_word: μετάπεμψαι
  choice: రప్పించు
  rationale: ఎవరినైనా పిలిపించి తన దగ్గరకు వచ్చేలా చేయడం అనే మధ్యమ ప్రయోగ భావాన్ని ‘రప్పించు’ సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది; బలవంతంగా తీసుకురావడం అనే భావాన్ని చేర్చదు.
- source_word: Σίμωνά τινα
  choice: సీమోను అనే ఒక వ్యక్తిని
  rationale: τινα పరిచయం కాని కానీ నిర్దిష్టమైన వ్యక్తిని సూచిస్తుంది. ‘అనే ఒక వ్యక్తి’ ఆధునిక తెలుగులో సహజంగా ఆ కథన భావాన్ని నిలుపుతుంది.
- source_word: ὃς ἐπικαλεῖται Πέτρος
  choice: పేతురు అని పిలువబడే
  rationale: ἐπικαλεῖται అతడు ఏ పేరుతో పిలువబడుతున్నాడో తెలియజేస్తుంది. ‘అని పిలువబడే’ మూలంలోని భావాన్ని నేరుగా నిలుపుతుంది.
