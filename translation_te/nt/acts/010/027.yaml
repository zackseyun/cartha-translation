  text: And talking with him[a], he entered and found many gathered together.
translation:
  language: te
  text: అతనితో మాట్లాడుతూ పేతురు లోపలికి ప్రవేశించి, అక్కడ చాలామంది కూడి ఉన్నారని చూశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ఇక్కడ ‘కనుగొంటాడు’ అనే చారిత్రక వర్తమాన కాలరూపం ఉంది; అది కథనానికి సజీవతను ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνομιλῶν
  choice: మాట్లాడుతూ
  rationale: వర్తమాన కృదంతం ప్రధాన క్రియతో సమకాలికంగా కొనసాగుతున్న సంభాషణను సూచిస్తుంది; ‘మాట్లాడుతూ’ సహజమైన ఆధునిక తెలుగు.
- source_word: αὐτῷ
  choice: అతనితో
  rationale: συνομιλέωతో దత్తివిభక్తి సంభాషిస్తున్న సహవ్యక్తిని సూచిస్తుంది; తెలుగులో ‘అతనితో’ పరస్పర సంభాషణ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἰσῆλθεν
  choice: లోపలికి వెళ్లి
  rationale: ఇంటిలోకి ప్రవేశించడాన్ని సందర్భానుగుణంగా, సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: εὑρίσκει
  choice: చూశాడు
  rationale: ఇక్కడ ‘కనుగొను’ అనే పదశః రూపం కంటే, లోపలికి వెళ్లినప్పుడు అక్కడున్నవారిని గమనించిన భావానికి ‘చూశాడు’ సహజం; గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగు కథన భూతకాలంతో అందించింది.
- source_word: συνεληλυθότας
  choice: సమావేశమై ఉండడం
  rationale: పరిపూర్ణ కృదంతం వారు అప్పటికే కూడివచ్చి ఉన్న ఫలితస్థితిని సూచిస్తుంది; ఈ రూపం ఆ స్థితిని నిలుపుతుంది.
- source_word: πολλούς
  choice: చాలామంది
  rationale: వ్యక్తులను సూచిస్తూ నామవాచకంగా వాడిన విశేషణాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. సందర్భస్పష్టత కోసం కర్తను ‘పేతురు’ అని పేర్కొన్నాం; గ్రీకులో అది క్రియలో అంతర్లీనంగా ఉంది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
