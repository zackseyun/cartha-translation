id: ACT.10.42
reference: Acts 10:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ παρήγγειλεν ἡμῖν κηρύξαι τῷ λαῷ καὶ διαμαρτύρασθαι ὅτι ⸀οὗτός ἐστιν ὁ ὡρισμένος ὑπὸ τοῦ θεοῦ κριτὴς ζώντων καὶ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/042.yaml
  text: And he commanded us to proclaim to the people and to testify solemnly that this is the one appointed by God as judge of the living and the dead[a].
translation:
  language: te
  text: ప్రజలకు ప్రకటించమనీ, జీవించి ఉన్నవారికీ చనిపోయినవారికీ న్యాయాధిపతిగా దేవుడు నియమించినవాడు ఈయనే అని గంభీరంగా సాక్ష్యమివ్వమనీ ఆయన మాకు ఆజ్ఞాపించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జీవించి ఉన్నవారికీ చనిపోయినవారికీ న్యాయాధిపతిగా దేవుడు నిర్ణయించినవాడు ఈయనే.”
    reason: ὁ ὡρισμένος అనే పదబంధానికి ‘నియమించినవాడు’తో పాటు ‘నిర్ణయించినవాడు’ అనే భావసాధ్యమైన ప్రత్యామ్నాయం ఉంది.
lexical_decisions:
- source_word: παρήγγειλεν
  choice: ఆజ్ఞాపించాడు
  rationale: అధికారపూర్వకంగా ఇచ్చిన ఆదేశం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: κηρύξαι
  choice: ప్రకటించమని
  rationale: బహిరంగంగా తెలియజేయడం అనే ప్రకటనాత్మక భావాన్ని ఇస్తుంది; ఆధునిక సందర్భంలో ‘ప్రసంగించడం’తో ముడిపడే సంకుచిత అర్థాన్ని నివారిస్తుంది.
- source_word: τῷ λαῷ
  choice: ప్రజలకు
  rationale: సందర్భంలో యూద ప్రజలను సూచించినప్పటికీ, మూల వాక్యం ‘ఇశ్రాయేలు’ అని స్పష్టంగా చెప్పదు; అందువల్ల వచనపరంగా నియంత్రితమైన అనువాదం.
- source_word: διαμαρτύρασθαι
  choice: గంభీరంగా సాక్ష్యమివ్వమని
  rationale: సాక్ష్యమివ్వడం మరియు దాని గంభీరమైన, దృఢమైన స్వభావం రెండింటినీ వ్యక్తం చేస్తుంది.
- source_word: οὗτός
  choice: ఈయనే
  rationale: యేసును ఉద్ఘాటిస్తూ సూచించే నిర్దేశక సర్వనామ బలాన్ని సహజమైన గౌరవప్రద తెలుగులో నిలుపుతుంది.
- source_word: ὁ ὡρισμένος
  choice: నియమించినవాడు
  rationale: దేవునిచేత నిర్దిష్ట బాధ్యతకు నియమించబడి, ఆ హోదాలో కొనసాగుతున్న వ్యక్తి అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: దేవుడు
  rationale: తెలుగు కర్తృవాచ్య నిర్మాణంలో దేవుడే నియమించిన కార్యనిర్వాహకుడు అని సహజంగా, సందిగ్ధత లేకుండా చూపుతుంది.
- source_word: κριτὴς
  choice: న్యాయాధిపతిగా
  rationale: తీర్పు చెప్పే అధికార హోదాను గౌరవప్రదంగా, స్పష్టంగా సూచిస్తుంది.
- source_word: ζώντων καὶ νεκρῶν
  choice: జీవించి ఉన్నవారికీ చనిపోయినవారికీ
  rationale: రెండు వర్గాలనూ నేరుగా, ఆధునిక పాఠకులకు సులభంగా అర్థమయ్యే రీతిలో వ్యక్తం చేసి, తీర్పు పరిధి సమస్త మానవాళిని ఆవరించడాన్ని నిలుపుతుంది.
theological_decisions:
- issue: తీర్పు తీర్చడానికి యేసును దేవుడు నియమించిన విషయం
  choice: జీవించి ఉన్నవారికీ చనిపోయినవారికీ న్యాయాధిపతిగా దేవుడు నియమించినవాడు ఈయనే
  alternative: జీవించి ఉన్నవారికీ చనిపోయినవారికీ న్యాయాధిపతిగా దేవుడు నిర్ణయించినవాడు ఈయనే
  rationale: దేవుడు యేసును సజీవులకూ మృతులకూ న్యాయాధిపతిగా నియమించాడనే వచనంలోని స్పష్టమైన వాదనను నిలుపుతుంది; దానిని తరువాతి సిద్ధాంత సూత్రీకరణలతో విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ప్రకటన మరియు తీర్పు అంశాలకు తగిన గంభీరతను నిలుపుకుంది. గ్రీకు నిష్క్రియ నిర్మాణాన్ని సహజ తెలుగు కర్తృవాచ్యంలో మార్చినా దైవ కార్యసాధకత్వం పూర్తిగా నిలిచింది.
