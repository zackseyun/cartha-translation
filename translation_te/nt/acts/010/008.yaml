id: ACT.10.8
reference: Acts 10:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐξηγησάμενος ⸂ἅπαντα αὐτοῖς⸃ ἀπέστειλεν αὐτοὺς εἰς τὴν Ἰόππην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/008.yaml
  text: And after explaining everything to them, he sent them to Joppa.
translation:
  language: te
  text: అతడు వారికి అన్నీ వివరించి, వారిని యొప్పేకు పంపించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξηγησάμενος
  choice: వివరించి
  rationale: ఈ భూతకాల మధ్యమ కృదంతం ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచిస్తుంది. ‘వివరించి’ అనేది విషయాన్ని పూర్తిగా తెలియజేసిన భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἅπαντα
  choice: జరిగినదంతా
  rationale: నపుంసక బహువచనమైన ἅπαντα సమగ్రంగా ‘అన్నీ/అంతా’ అనే భావాన్ని ఇస్తుంది. సందర్భంలో కొర్నేలి వారికి జరిగిన విషయమంతా తెలియజేస్తున్నందున ‘జరిగినదంతా’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: చతుర్థీ విభక్తిలోని ఈ సర్వనామం ἐξηγησάμενος క్రియకు పరోక్ష కర్మ; తెలుగులో ‘వారికి’ దాని సహజ సమానం.
- source_word: ἀπέστειλεν
  choice: పంపించాడు
  rationale: ἀποστέλλω ఇక్కడ ఒక గమ్యస్థానానికి వ్యక్తులను పంపడాన్ని సూచిస్తుంది. ‘పంపించాడు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, మూలంలో లేని ప్రత్యేక అత్యవసర భావాన్ని చేర్చదు.
- source_word: εἰς τὴν Ἰόππην
  choice: యొప్పేకు
  rationale: εἰς గమ్యస్థానం వైపు ప్రయాణాన్ని సూచిస్తుంది; తెలుగు దత్తివిభక్తి ప్రత్యయం ‘-కు’ దీనిని సహజంగా వ్యక్తపరుస్తుంది. Ἰόππη అనే స్థలనామాన్ని ప్రాచుర్యంలో ఉన్న బైబిలు తెలుగు రూపం ‘యొప్పే’గా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: సరళమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. గ్రీకు కృదంతంలోని పూర్వకాల సంబంధాన్ని తెలుగు వరుసక్రియ ‘వివరించి’ సహజంగా తెలియజేస్తుంది.
