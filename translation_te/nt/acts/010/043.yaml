id: ACT.10.43
reference: Acts 10:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τούτῳ πάντες οἱ προφῆται μαρτυροῦσιν, ἄφεσιν ἁμαρτιῶν λαβεῖν διὰ τοῦ ὀνόματος αὐτοῦ πάντα τὸν πιστεύοντα εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/043.yaml
  text: All the prophets testify about him that everyone who believes in him receives forgiveness of sins through his name[a].
translation:
  language: te
  text: 'ఆయనను గురించి[a] ప్రవక్తలందరూ సాక్ష్యమిస్తున్నారు: ఆయనలో విశ్వాసముంచే ప్రతి ఒక్కరూ ఆయన నామం ద్వారా పాపక్షమాపణ పొందుతారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన విషయమై సాక్ష్యమిస్తున్నారు.’
    reason: τούτῳ మరియు μαρτυροῦσιν కలయికను తెలుగులో ‘ఆయనను గురించి సాక్ష్యమిస్తున్నారు’ లేదా ‘ఆయన విషయమై సాక్ష్యమిస్తున్నారు’ అని సహజంగా వ్యక్తపరచవచ్చు.
lexical_decisions:
- source_word: τούτῳ
  choice: ఆయనను గురించి
  rationale: μαρτυροῦσιν అనే క్రియతో ఉన్న దత్తివిభక్తి సర్వనామం యేసును గూర్చిన సాక్ష్యాన్ని సూచిస్తుంది; తెలుగులో ‘ఆయనను గురించి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: πάντες οἱ προφῆται
  choice: ప్రవక్తలందరూ
  rationale: ప్రవక్తల సమస్త సాక్ష్యాన్ని సూచించే సహజమైన తెలుగు రూపం; దీనిని కేవలం ఒక గ్రంథవిభాగపు అధికారిక పేరుగా పరిమితం చేయదు.
- source_word: μαρτυροῦσιν
  choice: సాక్ష్యమిస్తున్నారు
  rationale: ఆధారపూర్వక సాక్ష్యమిచ్చే భావాన్ని నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా వినిపిస్తుంది.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: పాపక్షమాపణ
  rationale: పాపాల క్షమను సూచించే స్థిరమైన, సులభంగా అర్థమయ్యే తెలుగు ప్రయోగం.
- source_word: λαβεῖν
  choice: పొందుతారు
  rationale: ప్రవక్తల సాక్ష్యంలోని విషయాన్ని తెలుగులో సహజమైన సమాపక క్రియగా వ్యక్తపరుస్తుంది; సాధారణంగా వర్తించే ప్రకటన భావాన్ని కాపాడుతుంది.
- source_word: διὰ τοῦ ὀνόματος αὐτοῦ
  choice: ఆయన నామం ద్వారా
  rationale: మధ్యవర్తిత్వం లేదా సాధనాన్ని సూచించే διά భావాన్ని, ‘నామం’ అనే బైబిలీయ ప్రయోగాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా నిలుపుతుంది.
- source_word: πάντα τὸν πιστεύοντα
  choice: విశ్వాసముంచే ప్రతి ఒక్కరూ
  rationale: గ్రీకు ఏకవచన పుంలింగ కృదంతం ఇక్కడ సాధారణ, సమగ్ర అర్థంలో ఉంది; ‘ప్రతి ఒక్కరూ’ లింగపరంగా సముచితంగా, తెలుగులో సహజంగా ఉంది.
- source_word: εἰς αὐτόν
  choice: ఆయనలో విశ్వాసముంచే
  rationale: πιστεύω εἰς వ్యక్తి వైపు మళ్లిన నమ్మకం లేదా భరోసాను సూచిస్తుంది; ‘ఆయనలో విశ్వాసముంచడం’ ఆ సంబంధాత్మక భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: క్షమాపణ పరిధి మరియు విశ్వాసంతో దాని సంబంధం
  choice: ఆయనలో విశ్వాసముంచే ప్రతి ఒక్కరూ ఆయన నామం ద్వారా పాపక్షమాపణ పొందుతారని వచనం చెప్పినట్లుగానే అనువదించబడింది.
  alternative: రక్షణ విధానాన్ని మరింత సిద్ధాంతపరమైన పదాలతో విస్తరించి చెప్పడం.
  rationale: యేసు, విశ్వాసం, పాపక్షమాపణల మధ్య గ్రీకు పాఠం తెలిపే సంబంధాన్ని మాత్రమే నిలుపుతూ, ఏ సంప్రదాయానికైనా ప్రత్యేకమైన సిద్ధాంత వివరణను చేర్చలేదు.
- issue: సాధారణార్థక పుంలింగ కృదంతం
  choice: ప్రతి ఒక్కరూ
  alternative: విశ్వసించే ప్రతి పురుషుడు
  rationale: πάντα τὸν πιστεύοντα లోని పుంలింగ రూపం పురుషులకు మాత్రమే పరిమితం కాదు; వ్యక్తులందరినీ పంపిణీార్థకంగా సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే వచనానికి తగిన గౌరవప్రదమైన బైబిలీయ శైలితో అనువదించబడింది. ‘నామం ద్వారా’ అనే మూలపాఠపు ప్రయోగం వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపబడింది.
