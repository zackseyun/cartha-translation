  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν ᾧ ὑπῆρχεν πάντα τὰ τετράποδα ⸂καὶ ἑρπετὰ τῆς γῆς καὶ⸃ πετεινὰ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/012.yaml
  text: In it were all the four-footed animals and reptiles of the earth[c][b][a], and birds of the sky.
translation:
  language: te
  text: దానిలో నాలుగు కాళ్ల జంతువులు, నేలమీద పాకే ప్రాణులు, ఆకాశ పక్షులు అన్నీ ఉన్నాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ᾧ
  choice: దానిలో
  rationale: సంబంధ సర్వనామం పేతురు దర్శనంలో చూసిన ఆ వస్తువును సూచిస్తుంది. ‘దానిలో’ అనేది స్థానార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὑπῆρχεν
  choice: ఉన్నాయి
  rationale: ఇక్కడ అసంపూర్ణ భూతకాల క్రియ ఆ వస్తువులో జంతువులు ఉనికిలో ఉండటాన్ని సూచిస్తుంది. ‘ఉన్నాయి’ మూలంలోని భావాన్ని అదనపు వ్యాఖ్యానం లేకుండా అందిస్తుంది.
- source_word: πάντα
  choice: అన్నీ
  rationale: జాబితాలోని జీవుల సమగ్ర విస్తృతిని నిలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘ప్రతి రకమైన’ అనే వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: τὰ τετράποδα
  choice: నాలుగు కాళ్ల జంతువులు
  rationale: సాంకేతిక పదజాలం లేకుండా నాలుగు పాదాలుగల జంతువులను స్పష్టంగా, సహజంగా సూచిస్తుంది.
- source_word: ἑρπετὰ τῆς γῆς
  choice: నేలమీద పాకే ప్రాణులు
  rationale: ἑρπετά కేవలం ఆధునిక జీవశాస్త్ర వర్గమైన సరీసృపాలకే పరిమితం కాకుండా పాకే జీవులను విస్తృతంగా సూచించగలదు. ‘నేలమీద’ τῆς γῆς యొక్క భూసంబంధ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: ఆకాశ పక్షులు
  rationale: ఈ జంతువుల జాబితాలో πετεινάను ‘పక్షులు’గా, τοῦ οὐρανοῦను సమకాలీన సందర్భార్థంలో ‘ఆకాశ’గా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: καὶ ... καὶ
  choice: జాబితాలో కామాలు మరియు చివరి సముచ్చయం లేకుండా సమాంతర నామపదబంధాలు
  rationale: గ్రీకు పునరుక్త καί వర్గాలను సమన్వయపరుస్తుంది. తెలుగులో సహజమైన జాబితా నిర్మాణం అదే సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యం. ‘సరీసృపాలు’ అనే సన్నని ఆధునిక వర్గీకరణకు బదులుగా మూలపద విస్తృతిని కాపాడేందుకు ‘నేలమీద పాకే ప్రాణులు’ వాడబడింది. మూలంలో సహజమైన ప్రత్యామ్నాయ పాఠార్థాలకు ప్రచురణలో తప్పనిసరి వివరణ అవసరం లేనందున పాదటిప్పణులు చేర్చలేదు.
