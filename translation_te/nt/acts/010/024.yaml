source:
  edition: SBLGNT
  text: ⸂τῇ δὲ⸃ ἐπαύριον ⸀εἰσῆλθεν εἰς τὴν Καισάρειαν. ὁ δὲ Κορνήλιος ἦν προσδοκῶν αὐτοὺς συγκαλεσάμενος τοὺς συγγενεῖς αὐτοῦ καὶ τοὺς ἀναγκαίους φίλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/024.yaml
  text: On the next day he entered Caesarea[a]. Now Cornelius was expecting them and had called together his relatives and close friends.
translation:
  language: te
  text: మరుసటి రోజు అతడు కైసరయలో ప్రవేశించాడు.[a] కొర్నేలి తన బంధువులను, సన్నిహిత స్నేహితులను ఒకచోటికి పిలిపించి, వారికోసం ఎదురుచూస్తున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో “అతడు ప్రవేశించాడు” అనే క్రియ ఏకవచనంలో ఉంది; అయితే తర్వాత “వారికోసం” అనే సర్వనామం బహువచనంలో ఉంది. పేతురును ప్రధాన వ్యక్తిగా చూపిస్తూ, అతనితో వచ్చినవారినీ కొర్నేలి ఎదురుచూస్తున్నవారిలో చేర్చినట్లు ఇది సూచించవచ్చు.
    reason: మూలంలోని ఏకవచన క్రియకూ బహువచన సర్వనామానికీ మధ్య ఉన్న మార్పును తెలియజేయడానికి.
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: మరుసటి రోజు
  rationale: తర్వాతి రోజును సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం; δέ తెలిపే స్వల్ప కథన కొనసాగింపును ప్రత్యేక సంధాయకంతో అతిగా వ్యక్తం చేయదు.
- source_word: εἰσῆλθεν
  choice: అతడు ... ప్రవేశించాడు
  rationale: మూలంలోని ఏకవచన భూతకాల క్రియను నిలుపుతుంది; ప్రధాన వ్యక్తిగా పేతురుపై కథన దృష్టి ఉంది.
- source_word: Καισάρειαν
  choice: కైసరయ
  rationale: గ్రీకు స్థలనామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: ὁ δὲ Κορνήλιος
  choice: కొర్నేలి
  rationale: δέ ఇక్కడ బలమైన వ్యతిరేకత కాక కథన దృష్టి మార్పును సూచిస్తుంది; తెలుగు వాక్య క్రమమే ఆ మార్పును సహజంగా తెలియజేస్తుంది.
- source_word: ἦν προσδοκῶν αὐτούς
  choice: వారికోసం ఎదురుచూస్తూ
  rationale: కొనసాగుతున్న నిరీక్షణను వ్యక్తం చేస్తుంది; αὐτούς అనే బహువచనాన్ని ‘వారికోసం’గా నిలుపుతుంది.
- source_word: συγκαλεσάμενος
  choice: అప్పటికే ఒకచోటికి పిలిపించాడు
  rationale: కొర్నేలి ఎదురుచూస్తున్న సమయానికి ముందే పిలిచి సమకూర్చిన చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది; మధ్యమ రూపంలోని అతని చొరవ కూడా స్పష్టమవుతుంది.
- source_word: τοὺς συγγενεῖς αὐτοῦ
  choice: తన బంధువులను
  rationale: సంబంధీకులను సూచించే స్పష్టమైన, ప్రస్తుత ప్రామాణిక తెలుగు పదబంధం.
- source_word: τοὺς ἀναγκαίους φίλους
  choice: సన్నిహిత స్నేహితులను
  rationale: ἀναγκαῖος ఇక్కడ అక్షరార్థంగా ‘అవసరమైన’ అని కాక, ఆత్మీయమైన లేదా సన్నిహితమైన మిత్రులను సూచిస్తుంది.
