  text: διὸ καὶ ἀναντιρρήτως ἦλθον μεταπεμφθείς πυνθάνομαι οὖν τίνι λόγῳ μετεπέμψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/029.yaml
  text: Therefore I came without objection when I was sent for[a]. So I ask[b], for what reason did you send for me?
translation:
  language: te
  text: అందువల్ల, నన్ను పిలిపించగా నేను ఎలాంటి అభ్యంతరం చెప్పకుండా[a] వచ్చాను. కాబట్టి, మీరు నన్ను ఏ కారణంతో పిలిపించారు? అని అడుగుతున్నాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఏ మాత్రం సంకోచించకుండా.’ గ్రీకు పదానికి మరింత అక్షరార్థంగా ‘అభ్యంతరం చెప్పకుండా’ లేదా ‘ఎదురు మాట్లాడకుండా’ అని అర్థం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మీరు నన్ను ఎందుకు పిలిపించారు?’ అక్షరార్థంగా, ‘మీరు నన్ను ఏ కారణంతో పిలిపించారు?’
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: అందువల్ల
  rationale: ముందటి వివరణనుంచి వచ్చే నిర్ధారణను సహజమైన తెలుగులో తెలియజేస్తుంది; καί ఇచ్చే స్వల్ప ఉద్ఘాటన వాక్యప్రవాహంలో ఇమిడింది.
- source_word: ἀναντιρρήτως
  choice: ఎలాంటి అభ్యంతరం చెప్పకుండా
  rationale: ఎదురాడకుండా లేదా అభ్యంతరం లేవనెత్తకుండా అనే గ్రీకు పదపు భావాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: ἦλθον
  choice: వచ్చాను
  rationale: ἔρχομαι యొక్క సాధారణ ప్రత్యక్ష అర్థాన్ని సందర్భానికి తగిన తెలుగులో అందిస్తుంది.
- source_word: μεταπεμφθείς
  choice: నన్ను పిలిపించినప్పుడు
  rationale: ఎవరినైనా రమ్మని కబురు పంపడం అనే μεταπέμπομαι భావాన్నీ, కర్తరి కాని సంబంధాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πυνθάνομαι οὖν
  choice: కాబట్టి ... అడుగుతున్నాను
  rationale: οὖν సూచించే నిర్ధారణ లేదా సంభాషణ మలుపును, πυνθάνομαι యొక్క విచారణ భావాన్ని నిలుపుతుంది.
- source_word: τίνι λόγῳ
  choice: ఏ కారణంతో
  rationale: అక్షరార్థమైన ‘ఏ కారణం చేత’ అనే భావాన్ని కేవలం ‘ఎందుకు’గా కుదించకుండా సహజ తెలుగులో ఉంచుతుంది.
- source_word: μετεπέμψασθέ με
  choice: మీరు నన్ను ... పిలిపించారు
  rationale: ముందున్న μεταπεμφθείς‌తో పదార్థ సంబంధాన్ని నిలుపుతూ, ‘రమ్మని కబురు పంపారు’ అనే భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
