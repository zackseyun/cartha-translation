- from: అందువల్ల, నన్ను పిలిపించినప్పుడు నేను ఎలాంటి అభ్యంతరం చెప్పకుండా[a] వచ్చాను. కాబట్టి, మీరు నన్ను ఏ కారణంతో పిలిపించారో అడుగుతున్నాను[b].
  to: అందువల్ల, నన్ను పిలిపించగా నేను ఎలాంటి అభ్యంతరం చెప్పకుండా[a] వచ్చాను. కాబట్టి, మీరు నన్ను ఏ కారణంతో పిలిపించారు? అని అడుగుతున్నాను[b].
  rationale: ‘నన్ను పిలిపించగా’ passive participle యొక్క సంబంధాన్ని సహజంగా తెలియజేస్తుంది. ప్రశ్నను ప్రత్యక్ష ప్రశ్నగా ఉంచి, ‘అని అడుగుతున్నాను’ చేర్చడం ద్వారా గ్రీకు విచారణార్థక వాక్య నిర్మాణం, ‘ఏ కారణంతో’ అనే τίνι λόγῳ యొక్క స్పష్టత రెండూ నిలుస్తాయి.
