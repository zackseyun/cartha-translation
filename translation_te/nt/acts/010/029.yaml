review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys διὸ καί as an inferential transition, ἀναντιρρήτως as acting without objection, and the repeated μεταπέμπω word group as ‘పిలిపించు.’ The revised participial phrasing more closely reflects μεταπεμφθείς (‘having been sent for/summoned’) without making it merely a temporal ‘when.’
  naturalness: The first sentence is natural. In the second, placing the indirect question before ‘అడుగుతున్నాను’ is possible but slightly less direct in modern Telugu. Recasting it as a direct question after ‘అడుగుతున్నాను’ is clearer and idiomatic while retaining the formal ‘ఏ కారణంతో.’
  terminology: ‘అభ్యంతరం చెప్పకుండా’ appropriately represents ἀναντιρρήτως, and ‘పిలిపించు’ consistently represents both occurrences of the μεταπέμπω root. No theological terminology is involved.
  issues:
  - severity: low
    issue: The participial clause ‘నన్ను పిలిపించినప్పుడు’ is primarily temporal (‘when I was sent for’).
    rationale: μεταπεμφθείς is an aorist passive participle modifying ‘I came,’ more naturally expressed here as ‘నన్ను పిలిపించగా’ (‘having been sent for’).
  - severity: low
    issue: The word order in ‘మీరు నన్ను ఏ కారణంతో పిలిపించారో అడుగుతున్నాను’ is mildly cumbersome.
    rationale: Using a direct interrogative after ‘అడుగుతున్నాను’ gives a clearer modern Telugu rendering of πυνθάνομαι ... τίνι λόγῳ μετεπέμψασθέ με.
