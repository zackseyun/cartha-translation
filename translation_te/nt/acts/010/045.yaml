  source_fidelity: 'The translation accurately represents the Greek: the Jewish/circumcision-identified believers who accompanied Peter were astonished because the gift associated with the Holy Spirit had been poured out upon Gentiles as well. ‘అన్యజనులు’ correctly reflects ἔθνη in this context, and ‘కుమ్మరించబడిందని’ appropriately renders the completed passive action of ἐκκέχυται. The accompanying note responsibly records the Greek perfect’s continuing-result nuance.'
  naturalness: 'The Telugu is fluent, modern, and suitably formal: ‘పేతురుతో కలిసి వచ్చిన ... విశ్వాసులందరూ’ naturally expresses the restricting relative clause, while ‘ఆశ్చర్యపోయారు’ is a clear and idiomatic rendering of ἐξέστησαν. The sentence is readable without sacrificing source-level distinctions.'
  terminology: ‘పరిశుద్ధాత్మ,’ ‘వరం,’ ‘అన్యజనులు,’ and ‘సున్నతి వర్గానికి చెందిన విశ్వాసులు’ are appropriate modern standard Telugu biblical terminology. The main wording retains the source phrase’s compact genitival relationship in ‘పరిశుద్ధాత్మ వరం’ without doctrinally over-specifying it. Footnote markers and their placement correspond correctly to the relevant expressions.
