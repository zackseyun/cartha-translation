id: ACT.10.45
reference: Acts 10:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐξέστησαν οἱ ἐκ περιτομῆς πιστοὶ ⸀ὅσοι συνῆλθαν τῷ Πέτρῳ, ὅτι καὶ ἐπὶ τὰ ἔθνη ἡ δωρεὰ τοῦ ⸂ἁγίου πνεύματος⸃ ἐκκέχυται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/045.yaml
  text: And the believers from the circumcision who had come with Peter were astonished[c][b][a], because the gift of the Holy Spirit had been poured out even on the Gentiles.
translation:
  language: te
  text: పేతురుతో కలిసి వచ్చిన సున్నతి వర్గానికి చెందిన విశ్వాసులందరూ[a], పరిశుద్ధాత్మ వరం అన్యజనులపై కూడా[b] కుమ్మరించబడిందని[c] ఆశ్చర్యపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సున్నతి పొందిన విశ్వాసులు.’ అక్షరార్థంగా, ‘సున్నతి నుండి వచ్చిన విశ్వాసులు.’
    reason: lexical_alternative
  - marker: b
    text: ‘అన్యజనులపై సైతం’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం అదనాన్ని సూచిస్తుంది; ఇక్కడ అన్యజనులు కూడా చేర్చబడటం పట్ల కలిగిన ఆశ్చర్యాన్ని బలంగా వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘కుమ్మరించబడి ఉందని.’ గ్రీకు పరిపూర్ణ కాలం పూర్తయిన కార్యంతోపాటు కొనసాగుతున్న ఫలితాన్ని కూడా నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  choice: ఆశ్చర్యపోయారు
  rationale: ఇక్కడ ἐξίστημι తీవ్రమైన ఆశ్చర్యాన్ని సూచిస్తుంది. ‘ఆశ్చర్యపోయారు’ ఆధునిక తెలుగులో సహజంగా ఉండి, సందర్భంలోని విస్మయాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: οἱ ἐκ περιτομῆς πιστοὶ
  choice: సున్నతి వర్గానికి చెందిన విశ్వాసులు
  rationale: అక్షరార్థమైన ‘సున్నతి నుండి వచ్చిన విశ్వాసులు’ తెలుగులో అసహజంగా ఉంటుంది. ఈ పదబంధం సున్నతి ద్వారా గుర్తించబడే యూద విశ్వాసుల వర్గాన్ని సూచిస్తున్నందున, ‘సున్నతి వర్గానికి చెందిన’ అనే రూపం మూలంలోని సమూహ గుర్తింపును నిలుపుతుంది.
- source_word: ὅσοι συνῆλθαν τῷ Πέτρῳ
  choice: పేతురుతో కలిసి వచ్చిన ... అందరూ
  rationale: συνέρχομαι దత్తి విభక్తితో ఇక్కడ తోడుగా రావడాన్ని సూచిస్తుంది. ‘కలిసి వచ్చిన’ సహజమైన తెలుగు; ὅσοι యొక్క సమగ్ర భావాన్ని ‘అందరూ’ తెలియజేస్తుంది.
- source_word: καὶ ἐπὶ τὰ ἔθνη
  choice: అన్యజనులపై కూడా
  rationale: అపొస్తలుల కార్యములు 10 సందర్భంలో ἔθνη యూదేతరులను సూచిస్తుంది. καί అదనాన్ని తెలియజేస్తూనే ఆశ్చర్య భావాన్ని మోస్తుంది; తెలుగులో ‘కూడా’ ఈ రెండు ఛాయలను సహజంగా అందిస్తుంది.
- source_word: ἡ δωρεὰ
  choice: వరం
  rationale: δωρεά ఉచితంగా అనుగ్రహించబడిన బహుమానాన్ని సూచిస్తుంది. ఆధ్యాత్మిక సందర్భంలో ‘వరం’ సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: τοῦ ἁγίου πνεύματος
  choice: పరిశుద్ధాత్మ
  rationale: తెలుగు క్రైస్తవ వాడుకలో ఇది స్థిరమైన, మతశాఖలకు పరిమితం కాని సమకాలీన రూపం. ‘పరిశుద్ధాత్మ వరం’ అనే సమాసం గ్రీకు షష్ఠీ సంబంధాన్ని అనవసరంగా ఒకే విధంగా నిర్వచించదు.
- source_word: ἐκκέχυται
  choice: కుమ్మరించబడింది
  rationale: పూర్తయిన క్రియతో కొనసాగుతున్న ఫలితాన్ని సూచించే గ్రీకు పరిపూర్ణ కాలాన్ని తెలుగు సందర్భంలో సహజమైన కర్మణి రూపంతో అందించింది. ఆ ఫలితం వారికి స్పష్టంగా ఉన్నదనే భావం సందర్భం ద్వారా నిలుస్తుంది.
theological_decisions:
- issue: రక్షణ-చరిత్ర సందర్భంలో ἔθνη అర్థం
  choice: అన్యజనులు
  alternative: జనాలు / దేశాలు
  rationale: ఈ అధ్యాయంలో యూద విశ్వాసులకు ఎదురుగా యూదేతరులు పరిశుద్ధాత్మను పొందడం ప్రధానాంశం. అందువల్ల ‘అన్యజనులు’ ఉద్దేశిత సమూహాన్ని స్పష్టంగా సూచిస్తుంది.
- issue: ἐκκέχυται యొక్క క్రియా దృక్కోణం
  choice: కుమ్మరించబడింది
  alternative: కుమ్మరించబడి ఉంది
  rationale: మూలంలోని పరిపూర్ణ కాలం పూర్తయిన కుమ్మరింపును, దాని కొనసాగుతున్న ఫలితాన్ని కలిపి సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన తెలుగు భూతరూపాన్ని ఉంచి, కొనసాగుతున్న ఫలితాన్ని పాదసూచికలో వెల్లడించాం.
- issue: τοῦ ἁγίου πνεύματος లోని షష్ఠీ సంబంధం
  choice: పరిశుద్ధాత్మ వరం
  alternative: పరిశుద్ధాత్మ అనే వరం / పరిశుద్ధాత్మ ఇచ్చిన వరం
  rationale: గ్రీకు పదబంధం వరం పరిశుద్ధాత్మనే అని లేదా పరిశుద్ధాత్మకు సంబంధించిన వరమని గ్రహించే అవకాశం కలిగిస్తుంది. ‘అనే’ లేదా ‘ఇచ్చిన’ అని చేర్చి ఆ సంబంధాన్ని ఏకపక్షంగా నిర్ణయించకుండా మూలంలోని సంక్షిప్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘సున్నతి వర్గం,’ ‘అన్యజనులు,’ ‘పరిశుద్ధాత్మ వరం’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని సమూహ భేదాన్ని మరియు theological tension‌ను అనవసరంగా పరిష్కరించకుండా నిలుపుతాయి.
