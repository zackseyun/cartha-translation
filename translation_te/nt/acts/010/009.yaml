translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలపాఠంలోని సమకాలిక చర్యల సంబంధం నిలుపబడింది. వివరణకు సంబంధించిన [a] గుర్తును ‘ఆరవ గంట’ వద్ద ఉంచడం ద్వారా అది వివరించే కాలపదంతో నేరుగా అనుసంధానించబడింది.
