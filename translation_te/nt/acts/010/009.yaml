id: ACT.10.9
reference: Acts 10:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον ὁδοιπορούντων ἐκείνων καὶ τῇ πόλει ἐγγιζόντων ἀνέβη Πέτρος ἐπὶ τὸ δῶμα προσεύξασθαι περὶ ὥραν ἕκτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/009.yaml
  text: On the next day[a], while those men were traveling and drawing near to the city, Peter went up on the housetop to pray, about the sixth hour.
translation:
  language: te
  text: మరుసటి రోజు, ఆ మనుషులు ప్రయాణిస్తూ పట్టణానికి సమీపిస్తున్నప్పుడు, పేతురు దాదాపు ఆరవ గంటకు[a] ప్రార్థించడానికి మిద్దె మీదికి ఎక్కాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యూదుల పగటి సమయ గణన ప్రకారం, ఇది దాదాపు మధ్యాహ్నం పన్నెండు గంటల సమయం.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: మరుసటి రోజు
  rationale: కాలసూచక పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది. δέ యొక్క స్వల్ప కథన అనుసంధానం సందర్భంలోనే వ్యక్తమవుతున్నందున అదనపు విరోధార్థక పదం చేర్చలేదు.
- source_word: ὁδοιπορούντων ἐκείνων
  choice: ఆ మనుషులు ప్రయాణిస్తూ
  rationale: జనితివ్ అబ్సల్యూట్ సూచించే సమకాలిక చర్యను నిలుపుతుంది; ἐκείνων ముందుగా ప్రస్తావించబడిన కొర్నేలి పంపిన మనుషులను నిర్దిష్టంగా సూచిస్తుంది.
- source_word: τῇ πόλει ἐγγιζόντων
  choice: పట్టణానికి సమీపిస్తున్నప్పుడు
  rationale: ἐγγίζω యొక్క ‘దగ్గరకు రావడం’ అనే భావాన్ని, గమ్యస్థానాన్ని సూచించే సహజ తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: ἀνέβη
  choice: ఎక్కాడు
  rationale: మిద్దె మీదికి పైకి వెళ్లిన కదలికను సంక్షిప్తంగా, సహజంగా తెలుపుతుంది.
- source_word: ἐπὶ τὸ δῶμα
  choice: మిద్దె మీదికి
  rationale: δῶμα ఇక్కడ ఇంటి మీద ఉపయోగించదగిన చదునైన పైభాగాన్ని సూచిస్తుంది; ‘మిద్దె’ ఆ నిర్మాణ సందర్భాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: προσεύξασθαι
  choice: ప్రార్థించడానికి
  rationale: పైకి ఎక్కడంలోని ఉద్దేశాన్ని తెలిపే గ్రీకు ప్రయోజనార్థక క్రియారూపాన్ని సహజంగా అందిస్తుంది.
- source_word: περὶ ὥραν ἕκτην
  choice: దాదాపు ఆరవ గంటకు
  rationale: περί లోని సుమారు అనే భావాన్నీ, మూలపాఠంలోని యూదుల కాలగణనకు చెందిన ‘ఆరవ గంట’ అనే వ్యక్తీకరణనూ నిలుపుతుంది.
