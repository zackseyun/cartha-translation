revisions:
- from: ఆయన యూదుల దేశంలోను యెరూషలేములోను చేసిన వాటన్నిటికీ మేము సాక్షులం. వారు ఆయనను చెట్టుకు[a] వేలాడదీసి చంపారు.
  to: ఆయన యూదుల దేశంలోను యెరూషలేములోను చేసిన వాటన్నిటికీ మేము సాక్షులం. వారు కూడా ఆయనను చెట్టుకు[a] వేలాడదీసి చంపారు.
  rationale: Only “కూడా” has been added to reflect καί before “చంపారు.” The source’s deliberate ξύλον wording, including its possible Deuteronomy 21:23 resonance, remains preserved in the text and footnote.
