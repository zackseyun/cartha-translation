id: ACT.10.39
reference: Acts 10:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀ἡμεῖς μάρτυρες πάντων ὧν ἐποίησεν ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων ⸀καὶ Ἰερουσαλήμ· ὃν καὶ ἀνεῖλαν κρεμάσαντες ἐπὶ ξύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/039.yaml
  text: And we are witnesses of all that he did both in the land of the Jews and in Jerusalem[a]. They also put him to death by hanging him on a tree.
translation:
  language: te
  text: ఆయన యూదుల దేశంలోను యెరూషలేములోను చేసిన వాటన్నిటికీ మేము సాక్షులం. వారు కూడా ఆయనను చెట్టుకు[a] వేలాడదీసి చంపారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కలపపై’; భావార్థంగా ‘సిలువపై.’ గ్రీకు పదానికి ‘చెట్టు’ లేదా ‘కలప’ అని అర్థం; ఇది ద్వితీయోపదేశకాండము 21:23ను ప్రతిధ్వనింపజేస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυρες
  choice: సాక్షులం
  rationale: ప్రత్యక్షంగా చూసి సాక్ష్యం చెప్పే వారనే న్యాయపరమైన, సాక్ష్యాధారమైన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: πάντων ὧν ἐποίησεν
  choice: ఆయన చేసిన వాటన్నిటికీ
  rationale: πάντων యొక్క సమగ్ర భావాన్ని నిలుపుతూ తెలుగులో సహజమైన సంబంధ వాక్య నిర్మాణాన్ని ఉపయోగిస్తుంది.
- source_word: ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων
  choice: యూదుల దేశంలోను
  rationale: χώρα అనే పదంలోని దేశం/ప్రాంతం అనే భావాన్ని, τῶν Ἰουδαίων అనే సంబంధాన్ని అతిగా నిర్దిష్టీకరించకుండా ప్రతిబింబిస్తుంది.
- source_word: καὶ Ἰερουσαλήμ
  choice: యెరూషలేములోను
  rationale: గ్రీకులో రెండోసారి విభక్త్యర్థక అవ్యయం లేకపోయినా, తెలుగులో సమాంతరతను స్పష్టంగా, సహజంగా చూపిస్తుంది.
- source_word: ἀνεῖλαν
  choice: చంపారు
  rationale: ఇక్కడి ‘ప్రాణం తీశారు/చంపారు’ అనే అర్థాన్ని నేరుగా, ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: κρεμάσαντες ἐπὶ ξύλου
  choice: చెట్టుకు వేలాడదీసి
  rationale: కృదంతాన్ని ప్రధాన క్రియకు సాధనార్థకంగా అనుసంధానిస్తూ, ξύλον యొక్క ‘చెట్టు/కలప’ అనే మూలపద ఎంపికను కాపాడుతుంది.
theological_decisions:
- issue: సిలువ వేయబడిన సందర్భంలో ξύλον అనువాదం
  choice: చెట్టుకు
  alternative: కలపపై; సిలువపై
  rationale: మూలంలో σταυρός కాక ξύλον ఉంది. ‘చెట్టు’ అనే అనువాదం పదార్థాన్ని, ద్వితీయోపదేశకాండము 21:23కు ఉండవచ్చిన ప్రతిధ్వనిని కాపాడుతుంది; ‘సిలువ’ అని అనువదించడం మూలపాఠం కంటే వ్యాఖ్యానాన్ని మరింత స్పష్టంగా చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే అపొస్తలీయ సాక్ష్య ప్రకటనకు తగిన గౌరవప్రదమైన శైలిని నిలిపింది. ‘దేశం’ భౌగోళిక భావాన్ని ఇస్తుంది; ‘చెట్టు’ మూలంలోని ఉద్దేశపూర్వక పద ఎంపికను వ్యాఖ్యానంతో భర్తీ చేయకుండా కాపాడుతుంది.
