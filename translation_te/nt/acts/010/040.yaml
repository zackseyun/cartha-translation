    text: లేదా, ‘ఆయనను,’ ‘ఈ మనిషిని.’ గ్రీకులోని సూచన సర్వనామంలో ప్రత్యేక ఉద్ఘాటన ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆయన కనిపించేలా చేశాడు,’ ‘ఆయన ప్రత్యక్షం కావడానికి అనుమతించాడు.’ గ్రీకులో అక్షరార్థంగా, ‘ఆయన ప్రత్యక్షమైనవాడిగా కావడానికి ఇచ్చాడు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: ఈయనను
  rationale: ముందుకు తెచ్చిన గ్రీకు సూచన సర్వనామం ఇంతకుముందు ప్రస్తావించిన యేసును ప్రత్యేకంగా చూపిస్తుంది. ‘ఈయనను’ ఆ సూచన బలాన్ని సహజమైన గౌరవప్రద తెలుగు రూపంలో నిలుపుతుంది.
- source_word: ὁ θεὸς
  choice: దేవుడు
  rationale: నిర్దిష్ట కర్తను తెలుగులో సహజంగా ‘దేవుడు’ అని అనువదించాం.
- source_word: ἤγειρεν
  choice: లేపి
  rationale: పునరుత్థాన సందర్భంలో ἐγείρω అంటే ‘లేపడం.’ తరువాతి సమాపక క్రియతో సహజంగా కలపడానికి అసమాపక రూపం వాడాం.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: మూడవ రోజున
  rationale: కాలాన్ని సూచించే దత్తి విభక్తికి సహజమైన తెలుగు సమానం; రోజుల లెక్కింపును అదనంగా నిర్దేశించదు.
- source_word: ἔδωκεν
  choice: అనుగ్రహించాడు
  rationale: పూరక క్రియతో ఉన్న δίδωμι ఇక్కడ ఏదో జరిగేందుకు ఇవ్వడం లేదా అనుమతించడం అనే భావాన్ని కలిగిస్తుంది. ‘అనుగ్రహించాడు’ ఆ భావాన్ని కేవలం బలవంత causative‌గా మార్చకుండా తెలుపుతుంది.
- source_word: αὐτὸν
  choice: ఆయన
  rationale: యేసును సూచించే కర్మ; తెలుగులో గౌరవప్రద సర్వనామం వాడాం.
- source_word: ἐμφανῆ
  choice: ప్రత్యక్షమయ్యేలా
  rationale: ἐμφανής కనిపించేవాడు, ప్రత్యక్షమైనవాడు అనే భావాన్ని ఇస్తుంది. ఈ సందర్భంలో ‘ప్రత్యక్షమయ్యేలా’ పునరుత్థానానికీ తరువాతి దర్శనానికీ మధ్య ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: γενέσθαι
  choice: అయ్యేలా
  rationale: γίνομαι లోని ‘కావడం/అవడం’ అనే మార్పు భావాన్ని తెలుగు పూరక నిర్మాణంలో నిలిపాం.
theological_decisions:
- issue: పునరుత్థాన వాక్యరూపం
  choice: ఈయనను దేవుడు మూడవ రోజున లేపి
  alternative: దేవుడు ఆయనను మూడవ రోజున లేపి
  rationale: దేవుడే యేసును లేపాడనే మూలపాఠంలోని స్పష్టమైన వాదనను నేరుగా ఉంచి, τοῦτον లోని సూచన బలాన్ని ‘ఈయనను’ ద్వారా కాపాడాం.
- issue: పునరుత్థానం తరువాత ప్రత్యక్షత
  choice: ఆయన ప్రత్యక్షమయ్యేలా అనుగ్రహించాడు
  alternative: ఆయన కనిపించేలా చేశాడు
  rationale: మూలపాఠం లేపడాన్ని, తరువాత ప్రత్యక్షం కావడానికి దేవుడు ఇచ్చినదాన్ని వేర్వేరు చర్యలుగా చెబుతుంది. ఎంపిక చేసిన రూపం ఆ తేడాను నిలుపుతూ, పాఠం చెప్పనిదాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ‘ఈయనను’ ద్వారా మూలంలోని ఉద్ఘాటనను, ‘ప్రత్యక్షమయ్యేలా అనుగ్రహించాడు’ ద్వారా δίδωμι మరియు γενέσθαι రెండింటి భావాలను సాధ్యమైనంతవరకు నిలిపాం.
