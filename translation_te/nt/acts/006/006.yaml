  yaml_path: translation/nt/acts/006/006.yaml
  text: These they set before the apostles[a], and after praying[b], they laid their hands on them.
translation:
  language: te
  text: వీరిని వారు అపొస్తలుల ఎదుట నిలబెట్టారు[a]. అపొస్తలులు ప్రార్థించిన తరువాత, వారిమీద చేతులు ఉంచారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వీరిని వారు అపొస్తలుల ఎదుట హాజరుపరిచారు.”
    reason: lexical_alternative
  - marker: b
    text: చేతులు ఉంచడం బహిరంగంగా నియమించడాన్ని లేదా ఆశీర్వదించడాన్ని సూచించవచ్చు; అయితే ఇక్కడ గ్రీకు మూలం ఆ చర్యను మాత్రమే పేర్కొంటుంది, దాని సంఘపరమైన అర్థాన్ని మరింతగా నిర్వచించదు.
    reason: cultural_note
lexical_decisions:
- source_word: οὓς
  choice: వీరిని
  rationale: ఈ సంబంధ సర్వనామం మునుపటి వచనంలో పేర్కొన్న ఏడుగురిని సూచిస్తుంది. తెలుగులో ‘వీరిని’ అనేది ఆ పూర్వసూచనను సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἔστησαν
  choice: నిలబెట్టారు
  rationale: ἵστημι ఇక్కడ సకర్మక భావంలో ‘నిలబెట్టడం’ లేదా ‘ఎదుటికి తీసుకువచ్చి ఉంచడం’ అని అర్థం. ‘ఎదుట నిలబెట్టారు’ మూలంలోని దృశ్యరూపాన్ని నిలుపుతుంది.
- source_word: ἐνώπιον τῶν ἀποστόλων
  choice: అపొస్తలుల ఎదుట
  rationale: ἐνώπιον అనేది వారి సన్నిధిలో లేదా ఎదుట ఉండడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఎదుట’ సహజమైన సంక్షిప్త రూపం.
- source_word: προσευξάμενοι
  choice: ప్రార్థించిన తరువాత
  rationale: భూతకాలకృదంతం ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచిస్తుంది; ఈ క్రమాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐπέθηκαν αὐτοῖς τὰς χεῖρας
  choice: వారిమీద చేతులు ఉంచారు
  rationale: గ్రీకు వాక్యబంధం చేతులను వారిమీద ఉంచిన కార్యాన్ని వర్ణిస్తుంది. తెలుగు బైబిలు శైలిలోనూ సాధారణ వాడుకలోనూ ఇది సహజంగా ఉంటుంది; దాని సంఘపరమైన అర్థాన్ని అదనంగా నిర్వచించదు.
theological_decisions:
- issue: చేతులు ఉంచిన చర్య స్వభావం
  choice: ‘వారిమీద చేతులు ఉంచారు’ అని చర్యను మాత్రమే వర్ణించడం
  alternative: ‘వారిని అభిషేకించారు’ లేదా ‘వారిని పరిచర్యకు నియమించారు’
  rationale: గ్రీకు మూలం ఆచరణను పేర్కొంటుంది గాని, ఈ సందర్భంలో దానిని అభిషేకం, నియామకం, ఆశీర్వాదం లేదా అధికార ప్రసాదం అని ప్రత్యేకంగా నిర్వచించదు. అందువల్ల సంఘశాఖాపరమైన వ్యాఖ్యానాన్ని అనువాదంలో చేర్చలేదు.
- issue: ప్రార్థన చేసిన కర్త
  choice: తెలుగు సందర్భానుసారంగా ‘వారు’ అని ఉంచడం
  alternative: ‘అపొస్తలులు ప్రార్థించిన తరువాత’ అని కర్తను స్పష్టీకరించడం
  rationale: గ్రీకులో προσευξάμενοι మరియు ἐπέθηκαν క్రియల కర్త అంతర్లీనంగా ఒకటే అయినా, ‘అపొస్తలులు’ అనే నామవాచకం జనిటివ్ పదబంధంలో ఉంది. అనువాదం సందర్భాన్ని సహజంగా అనుసరిస్తూ, మూలంలో లేని స్పష్టీకరణను ప్రధాన పాఠ్యంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘అపొస్తలులు’ అనే స్థిరపడ్డ బిరుదును నిలిపి, చేతులు ఉంచిన చర్యకు ఏ ప్రత్యేక సంఘశాఖాపరమైన అర్థాన్నీ జోడించలేదు.
