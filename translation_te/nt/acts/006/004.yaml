  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ τῇ προσευχῇ καὶ τῇ διακονίᾳ τοῦ λόγου προσκαρτερήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/004.yaml
  text: But we will devote ourselves to prayer and to the ministry of the word[a].
translation:
  language: te
  text: కాని మేమైతే ప్రార్థనకూ వాక్య పరిచర్యకూ[a] అంకితమై ఉంటాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వాక్య సేవకు.’ గ్రీకు పదానికి ‘సేవ’ లేదా ‘పరిచర్య’ అనే రెండు అర్థాలూ రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: మేమైతే
  rationale: గ్రీకులో సర్వనామం స్పష్టంగా ఉండి ముందున్న వారి బాధ్యతతో వ్యత్యాసాన్ని నొక్కిచెబుతుంది. తెలుగులో ‘మేమైతే’ ఆ ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: కాని
  rationale: మునుపటి సందర్భంలో ఇతరులకు అప్పగించబోయే బాధ్యతకు అపొస్తలుల బాధ్యతను వ్యతిరేకంగా చూపే సంధానార్థాన్ని తెలియజేస్తుంది.
- source_word: τῇ προσευχῇ
  choice: ప్రార్థనకు
  rationale: προσκαρτερέωతో వచ్చిన సంప్రదాన విభక్తి నిరంతర అంకితభావానికి సంబంధించిన విషయాన్ని సూచిస్తుంది; ‘అంకితమై ఉంటాము’తో ‘ప్రార్థనకు’ సహజంగా సరిపోతుంది.
- source_word: διακονίᾳ
  choice: పరిచర్యకు
  rationale: ఈ పదానికి సేవ లేదా పరిచర్య అనే అర్థాలు ఉన్నాయి. ఇక్కడ వాక్యాన్ని ప్రకటించే అపొస్తలుల బాధ్యతను సూచించడానికి ‘పరిచర్య’ సహజమైనది; ‘సేవ’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: τοῦ λόγου
  choice: వాక్య
  rationale: ఇక్కడ λόγος దేవుని ప్రకటిత వాక్యాన్ని లేదా సందేశాన్ని సూచిస్తుంది. ‘వాక్యం’ మూలపద రూపకాన్ని నిలుపుతూ తెలుగు క్రైస్తవ వాడుకలో సులభంగా అర్థమవుతుంది.
- source_word: προσκαρτερήσομεν
  choice: అంకితమై ఉంటాము
  rationale: భవిష్యత్ క్రియారూపం నిలకడగా కొనసాగించే అంకితభావాన్ని తెలియజేస్తుంది. ఈ తెలుగు రూపం కేవలం ఒక నిర్ణయాన్ని కాక నిరంతర నిబద్ధతను వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సమీప సందర్భంలోని భోజన సేవకు భిన్నంగా διακονίαను అనువదించడం
  choice: వాక్య పరిచర్య
  alternative: వాక్య సేవ
  rationale: రెండు పనులూ సేవ అనే భావక్షేత్రంలోనే ఉన్నప్పటికీ, ఇక్కడ ‘పరిచర్య’ అపొస్తలులకు అప్పగించబడిన వాక్యప్రకటన బాధ్యతను సందర్భానుసారంగా వేరు చేస్తుంది. అదే సమయంలో మూలపాఠంలో లేని మతాధికారుల–సామాన్యుల కఠిన విభజనను ఇది చొప్పించదు; ‘సేవ’ అనే నిజమైన అర్థసాధ్యతను పాదసూచిక కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘మేమైతే’ మూలంలోని ఉద్ఘాటనతో పాటు సందర్భంలోని వ్యత్యాసాన్ని నిలుపుతుంది; ‘అంకితమై ఉంటాము’ నిరంతర నిబద్ధతను తెలియజేస్తుంది.
