  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀκηκόαμεν γὰρ αὐτοῦ λέγοντος ὅτι Ἰησοῦς ὁ Ναζωραῖος οὗτος καταλύσει τὸν τόπον τοῦτον καὶ ἀλλάξει τὰ ἔθη ἃ παρέδωκεν ἡμῖν Μωϋσῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/014.yaml
  text: For we heard him saying that this Jesus the Nazarene will destroy this place and will change the customs that Moses handed down to us[a][b][c].
translation:
  language: te
  text: ఎందుకంటే, ‘ఈ నజరేయుడైన యేసు ఈ స్థలాన్ని నాశనం చేస్తాడు, మోషే మనకు అందించిన ఆచారాలను మారుస్తాడు’ అని అతడు చెప్పడం మేము విన్నాము[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నజరేతుకు చెందిన ఈ యేసు.’
    reason: lexical_alternative
  - marker: b
    text: ‘ఈ స్థలం’ అనేది దేవాలయాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘మోషే మనకు అందజేసిన సంప్రదాయాలను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκόαμεν
  choice: మేము విన్నాం
  rationale: పూర్ణకాల రూపానికి ప్రస్తుతం వర్తించే భావం ఉన్నప్పటికీ, ప్రత్యక్షంగా విన్నామని చేసే ఈ ఆరోపణలో సహజమైన ఆధునిక తెలుగు భూతకాల ప్రయోగం సరిపోతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: మునుపటి వచనంలోని ఆరోపణకు ఈ మాటలు వివరణ లేదా ఆధారం ఇస్తున్న సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: αὐτοῦ λέγοντος
  choice: ఇతడు చెప్పడం
  rationale: ἀκούω తరువాతి కర్తతో కూడిన కృదంత నిర్మాణాన్ని, వారు ఇతడు చెప్పగా నేరుగా విన్నామని ఆరోపిస్తున్న భావంతో సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Ἰησοῦς ὁ Ναζωραῖος οὗτος
  choice: ఈ నజరేయుడైన యేసు
  rationale: οὗτος లోని చూపించే బలాన్ని ‘ఈ’ నిలుపుతుంది; Ναζωραῖος ను ‘నజరేయుడు’గా ఇవ్వడం గుర్తింపుతో పాటు ఆరోపకుల మాటల్లోని తృణీకార ఛాయను అతిశయింపకుండా కాపాడుతుంది.
- source_word: καταλύσει
  choice: నాశనం చేసి
  rationale: ‘ఈ స్థలం’ అంటే సందర్భంలో దేవాలయం కనుక, καταλύω ఇక్కడ కూల్చివేయడం లేదా నాశనం చేయడం అనే భావాన్ని ఇస్తుంది; సంయుక్త భవిష్యత్ క్రియకు సహజ తెలుగు వాక్యనిర్మాణం వాడబడింది.
- source_word: τὸν τόπον τοῦτον
  choice: ఈ స్థలాన్ని
  rationale: గ్రీకు పదబంధంలోని ‘ఈ స్థలం’ అనే మాటనే ఉంచి, దేవాలయం అనే సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో అదనంగా చేర్చలేదు.
- source_word: ἀλλάξει
  choice: మార్చివేస్తాడు
  rationale: భవిష్యత్ క్రియ యొక్క స్పష్టమైన భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘వేస్తాడు’ ఆరోపణలో సూచించిన నిర్ణాయక మార్పును వ్యక్తం చేస్తుంది.
- source_word: τὰ ἔθη
  choice: ఆచారాలను
  rationale: సమాజానికి సంక్రమించిన మతపరమైన ఆచరణలు, కట్టుబాట్లు అనే పరిధిని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἃ παρέδωκεν ἡμῖν Μωϋσῆς
  choice: మోషే మనకు అప్పగించిన
  rationale: παραδίδωμι లోని అందజేయడం, సంక్రమింపజేయడం అనే భావాలను ‘అప్పగించిన’ కాపాడుతుంది; వంశపారంపర్య సంక్రమణ భావానికి ‘మనకు అందించిన’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: ‘ఈ స్థలం’ దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘ఈ స్థలం’ అని అనువదించి, దేవాలయ సూచనను అంతర్లీనంగానే ఉంచడం.
  alternative: ఈ దేవాలయం; ఈ పవిత్ర స్థలం
  rationale: గ్రీకు పాఠ్యం ‘ఈ స్థలం’ అంటుంది. సందర్భంలో అది దేవాలయాన్ని సూచించినా, ఆరోపకుల మాటలను వ్యాఖ్యానాత్మకంగా విస్తరించకుండా కాపాడి, వివరణను పాదసూచికలో ఇచ్చాం.
- issue: యేసును గురించి ఆరోపకుల మాటల ధోరణి
  choice: ‘ఈ నజరేయుడైన యేసు’ అని చూపించే సర్వనామ బలాన్ని నిలుపడం.
  alternative: నజరేతు యేసు; నజరేతుకు చెందిన ఈ యేసు
  rationale: οὗτος లోని చూపించే, బహుశా తృణీకారంతో కూడిన ధోరణిని వ్యాఖ్య జోడించకుండా పాఠ్యంలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయసభ ఎదుట వినిపించిన ప్రత్యక్ష ఆరోపణ ధోరణిని కాపాడేలా అనువదించబడింది. ‘నజరేయుడు,’ ‘ఈ స్థలం,’ ‘ఆచారాలు’ వంటి పదాలు మూలంలోని వక్తృత్వ ఛాయనూ సందర్భపరమైన అస్పష్టతనూ నిలుపుతాయి; అవసరమైన ప్రత్యామ్నాయాలు, సందర్భ వివరణ పాదసూచికల్లో ఉన్నాయి.
