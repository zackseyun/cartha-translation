  to: ఎందుకంటే, ‘ఈ నజరేయుడైన యేసు ఈ స్థలాన్ని నాశనం చేస్తాడు, మోషే మనకు అందించిన ఆచారాలను మారుస్తాడు’ అని అతడు చెప్పడం మేము విన్నాము[a][b][c].
