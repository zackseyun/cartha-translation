    rationale: ‘హెల్లెనిస్టుల నుంచి హెబ్రీయులపై ఫిర్యాదు తలెత్తింది’ already renders ἐγένετο γογγυσμὸς … πρὸς τοὺς Ἑβραίους. The following ‘వారు ఫిర్యాదు చేశారు’ adds a second complaint not separately present in the Greek. The ὅτι clause should instead give the content/cause of the one complaint.
