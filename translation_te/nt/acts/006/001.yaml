source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς ἡμέραις ταύταις πληθυνόντων τῶν μαθητῶν ἐγένετο γογγυσμὸς τῶν Ἑλληνιστῶν πρὸς τοὺς Ἑβραίους ὅτι παρεθεωροῦντο ἐν τῇ διακονίᾳ τῇ καθημερινῇ αἱ χῆραι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/001.yaml
  text: In those days[a], as the disciples were increasing in number, a complaint arose from the Hellenists against the Hebrews[b], because their widows were being overlooked in the daily distribution.
translation:
  language: te
  text: ఆ రోజుల్లో శిష్యుల సంఖ్య పెరుగుతుండగా, రోజువారీ పంపిణీలో తమ విధవరాళ్లను పట్టించుకోవడం లేదని[b] హెల్లెనిస్టులు[a] హెబ్రీయులపై ఫిర్యాదు చేయడం మొదలైంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెల్లెనిస్టులు అంటే బహుశా గ్రీకు భాష మాట్లాడే యూదులు; దీనికి భిన్నంగా ‘హెబ్రీయులు’ అంటే బహుశా అరామిక్ లేదా హెబ్రీ భాష మాట్లాడే యూదులు.
    reason: cultural_note
  - marker: b
    text: లేదా, “రోజువారీ సేవలో/పరిచర్యలో తమ విధవరాళ్లు నిర్లక్ష్యం చేయబడుతున్నారని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ταύταις
  choice: ఆ రోజుల్లో
  rationale: కాలపరిస్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; δέ యొక్క స్వల్ప కథన-మార్పు భావాన్ని అనవసరమైన ప్రత్యేక సంధిపదంతో అతిశయింపజేయదు.
- source_word: πληθυνόντων τῶν μαθητῶν
  choice: శిష్యుల సంఖ్య పెరుగుతుండగా
  rationale: జెనిటివ్ అబ్సల్యూట్ తెలిపే నేపథ్య పరిస్థితినీ, సంఖ్యాపరమైన వృద్ధినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐγένετο γογγυσμός
  choice: ఫిర్యాదు తలెత్తింది
  rationale: γογγυσμός లోని గొణుగుడు లేదా అసంతృప్తితో కూడిన ఫిర్యాదు భావాన్ని సందర్భానుకూలంగా, ఆధునిక పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: τῶν Ἑλληνιστῶν
  choice: హెల్లెనిస్టుల
  rationale: మూలంలోని చారిత్రక సమూహపేరును ప్రధాన పాఠ్యంలో నిలుపుతుంది; దాని సంభావ్య భాషా-సాంస్కృతిక అర్థాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: πρὸς τοὺς Ἑβραίους
  choice: హెబ్రీయులపై
  rationale: ఫిర్యాదు ఎవరిని ఉద్దేశించిందో, అలాగే సందర్భంలోని సామాజిక ఉద్రిక్తతను తెలియజేస్తుంది.
- source_word: παρεθεωροῦντο
  choice: పట్టించుకోబడడం లేదని
  rationale: ఇంపెర్ఫెక్ట్ పాసివ్ సూచించే కొనసాగుతున్న పరిస్థితిని సహజమైన తెలుగులో అందిస్తుంది; ఉద్దేశపూర్వక వివక్ష అని అవసరానికి మించి నిర్ధారించదు.
- source_word: ἐν τῇ διακονίᾳ τῇ καθημερινῇ
  choice: రోజువారీ పంపిణీలో
  rationale: διακονία విస్తృతంగా సేవ లేదా పరిచర్యను సూచించినా, విధవరాళ్ల భౌతిక అవసరాల సందర్భంలో ‘పంపిణీ’ సందర్భోచితమైన నిర్దిష్ట అర్థాన్ని అందిస్తుంది.
- source_word: αἱ χῆραι αὐτῶν
  choice: తమ విధవరాళ్లు
  rationale: αὐτῶν సహజంగా హెల్లెనిస్టులను సూచిస్తుందని తెలియజేస్తూ మూలంలోని స్వామ్య సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: Ἑλληνισταί మరియు Ἑβραῖοι అనే సామాజిక-సాంస్కృతిక సమూహపేర్లు
  choice: ప్రధాన పాఠ్యంలో ‘హెల్లెనిస్టులు,’ ‘హెబ్రీయులు’ అనే పేర్లను నిలిపి, పాదసూచికలో సంభావ్య భాషా-సాంస్కృతిక వివరణ ఇవ్వడం.
  alternative: ‘గ్రీకు భాష మాట్లాడే యూదులు’ మరియు ‘అరామిక్ లేదా హెబ్రీ భాష మాట్లాడే యూదులు’ అని ప్రధాన పాఠ్యంలోనే అనువదించడం.
  rationale: మూలం ఉపయోగించిన చారిత్రక సమూహపేర్లను ఒకే వ్యాఖ్యానంగా కుదించకుండా నిలుపుతుంది; అదే సమయంలో సాధారణ పాఠకుడికి పాదసూచిక ద్వారా అవసరమైన స్పష్టత ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. చారిత్రక సమూహపేర్లను లిప్యంతరీకరించి, వాటి అర్థాన్ని పాదసూచికలో వివరించాం.
