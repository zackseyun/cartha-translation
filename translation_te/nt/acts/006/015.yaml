id: ACT.6.15
reference: Acts 6:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀτενίσαντες εἰς αὐτὸν ⸀πάντες οἱ καθεζόμενοι ἐν τῷ συνεδρίῳ εἶδον τὸ πρόσωπον αὐτοῦ ὡσεὶ πρόσωπον ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/015.yaml
  text: And all who were sitting in the council[a], fixing their eyes on him, saw his face like the face of an angel.
translation:
  language: te
  text: సభలో[a] కూర్చున్న వారందరూ అతనివైపు తదేకంగా చూసి, అతని ముఖం దేవదూత ముఖంలా ఉండడాన్ని చూశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సన్హెద్రిన్‌లో.’ గ్రీకు పదం యూదుల పాలక మండలిని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἀτενίσαντες
  choice: తదేకంగా చూసి
  rationale: ఈ పదం సాధారణంగా చూడడాన్ని కాక, దృష్టిని నిలిపి ఏకాగ్రంగా చూడడాన్ని సూచిస్తుంది. ‘తదేకంగా చూసి’ ఆ తీవ్రతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πάντες οἱ καθεζόμενοι
  choice: కూర్చున్న వారందరూ
  rationale: πάντες లోని సమగ్రతను, καθεζόμενοι లోని కూర్చున్న స్థితిని రెండింటినీ సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: συνεδρίῳ
  choice: సభలో
  rationale: సందర్భంలో ఇది యూదుల పాలక మండలిని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన ‘సభ’ను ఉపయోగించి, నిర్దిష్ట చారిత్రక పేరైన ‘సన్హెద్రిన్’ను పాదటిప్పణిలో ఇచ్చాం.
- source_word: πρόσωπον
  choice: ముఖం
  rationale: ఇక్కడ ఈ పదం స్తెఫను కనిపించే ముఖాన్ని నేరుగా సూచిస్తుంది; ‘ముఖం’ స్పష్టమైన, ప్రస్తుత వాడుకలోని తెలుగు పదం.
- source_word: ὡσεὶ
  choice: లా
  rationale: ఇది పోలికను సూచిస్తుంది; పోలికలోని నిర్దిష్ట లక్షణాన్ని చెప్పకుండా ‘లా’ మూలంలోని సంక్షిప్తతను, అస్పష్టతను కాపాడుతుంది.
- source_word: ἀγγέλου
  choice: దేవదూత
  rationale: ఈ కథన సందర్భంలో ἄγγελος సాధారణ మానవ దూతకన్నా పరలోక సంబంధమైన దేవదూతను సూచించడం అత్యంత సహజం.
theological_decisions:
- issue: ‘దేవదూత ముఖంలా’ అనే పోలిక స్వభావం
  choice: స్తెఫను ముఖం దేవదూత ముఖాన్ని పోలి ఉందని మాత్రమే చెప్పడం; ఆ పోలిక ఏ లక్షణంలో ఉందో నిర్దిష్టం చేయకపోవడం.
  alternative: ప్రకాశవంతమైన మహిమ, ప్రశాంతమైన నిర్దోషిత్వం, లేదా పరలోక అధికారాన్ని ప్రత్యేకంగా పేర్కొనడం.
  rationale: గ్రీకు పాఠ్యం పోలికను తెలుపుతుంది గాని అది కాంతి, ప్రశాంతత, మహిమ లేదా మరేదైనా లక్షణమో వివరించదు. అందువల్ల అనువాదం ఆ ఉద్దేశపూర్వక విస్తృతతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘తదేకంగా’ దృష్టి తీవ్రతను నిలుపుతుంది; ‘దేవదూత ముఖంలా’ పోలికను వివరించి పరిమితం చేయకుండా ఉంచుతుంది.
