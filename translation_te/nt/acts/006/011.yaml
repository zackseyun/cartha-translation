source:
  edition: SBLGNT
  text: τότε ὑπέβαλον ἄνδρας λέγοντας ὅτι Ἀκηκόαμεν αὐτοῦ λαλοῦντος ῥήματα βλάσφημα εἰς Μωϋσῆν καὶ τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/011.yaml
  text: Then they secretly induced men to say[a], “We have heard him speaking blasphemous words against Moses and God.”
translation:
  language: te
  text: అప్పుడు వారు పురుషులను రహస్యంగా ఇలా చెప్పేలా పురికొల్పారు:[a] “అతను మోషేకు, దేవునికి వ్యతిరేకంగా దూషణపూరితమైన మాటలు మాట్లాడడం మేము విన్నాము.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పురుషులను రహస్యంగా ప్రేరేపించారు” లేదా “కుట్రపూరితంగా పురికొల్పారు.” గ్రీకు క్రియలో రహస్యంగా ప్రేరేపించడం లేదా మాటలు చెప్పేలా పురికొల్పడం అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి చర్యను పరిచయం చేసే సహజమైన కాలసూచక అనుసంధానం.
- source_word: ὑπέβαλον
  choice: రహస్యంగా ప్రేరేపించి ... చెప్పించారు
  rationale: ఈ సందర్భంలో క్రియ రహస్యంగా పురికొల్పడం లేదా మాటలు చెప్పేలా చేయడం అనే కుట్రపూరిత భావాన్ని కలిగిస్తుంది; తెలుగు వాక్యనిర్మాణంలో కారకార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἄνδρας
  choice: కొందరు పురుషులను
  rationale: ἀνήρ ఇక్కడ పురుషులను ప్రత్యేకంగా సూచిస్తుంది; తెలుగు సహజత్వం కోసం అనిర్దిష్ట భావాన్ని తెలిపే ‘కొందరు’ చేర్చబడింది.
- source_word: λέγοντας
  choice: ఇలా చెప్పించారు
  rationale: ὑπέβαλον తరువాతి కృదంతాన్ని తెలుగులో సహజమైన కారక క్రియగా అందిస్తూ, వారు ఆ పురుషులతో ఈ మాటలు చెప్పించారని స్పష్టం చేస్తుంది.
- source_word: Ἀκηκόαμεν
  choice: మేము విన్నాము
  rationale: గ్రీకు పరిపూర్ణ కాలం గతంలో వినడం వల్ల నిలిచిన సాక్ష్యదావాను సూచిస్తుంది; ఆధునిక తెలుగులో ‘విన్నాము’ సహజంగా అదే సందర్భార్థాన్ని అందిస్తుంది.
- source_word: αὐτοῦ λαλοῦντος
  choice: ఇతడు ... మాటలు పలకడం
  rationale: వారు విన్న వ్యక్తిని సూచిస్తూ కొనసాగుతున్న మాటల చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ῥήματα βλάσφημα
  choice: దూషణ మాటలు
  rationale: మతపరమైన, న్యాయపరమైన ఆరోపణ బలాన్ని నిలుపుతూ ‘దూషణతో కూడిన మాటలు’ అనే భావాన్ని సామాన్య పాఠకునికి సహజంగా అందిస్తుంది.
- source_word: εἰς Μωϋσῆν καὶ τὸν θεόν
  choice: మోషేకు, దేవునికి వ్యతిరేకంగా
  rationale: ఈ శత్రుత్వపూరిత ఆరోపణ సందర్భంలో εἰς లక్ష్యంగా చేసిన అపరాధాన్ని సూచిస్తుంది; ‘వ్యతిరేకంగా’ ఆ దిశార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: స్తెఫనుపై చేసిన ఆరోపణ స్వభావం
  choice: ‘మోషేకు, దేవునికి వ్యతిరేకంగా దూషణ మాటలు’ అని ఆరోపణను నివేదికగా అనువదించడం
  alternative: ‘మోషేను, దేవుణ్ణి నిందించే మాటలు’
  rationale: βλάσφημα యొక్క మతపరమైన, న్యాయపరమైన బలాన్ని నిలుపుతుంది. కథనం వారు చెప్పిన ఆరోపణను మాత్రమే నివేదిస్తుంది; అనువాదం దానిని నిజమని సమర్థించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. ‘రహస్యంగా ప్రేరేపించి ... చెప్పించారు’ అనే ప్రయోగం మూలంలోని కుట్రపూరిత కారక భావాన్ని సహజంగా అందిస్తుంది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పదబంధం తరువాత ఉంచబడింది.
