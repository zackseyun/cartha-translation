revisions:
- from: అప్పుడు వారు కొందరు పురుషులను రహస్యంగా ప్రేరేపించి ఇలా చెప్పించారు:[a] “ఇతడు మోషేకు, దేవునికి వ్యతిరేకంగా దూషణ మాటలు పలకడం మేము విన్నాము.”
