id: ACT.6.7
reference: Acts 6:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὁ λόγος τοῦ θεοῦ ηὔξανεν, καὶ ἐπληθύνετο ὁ ἀριθμὸς τῶν μαθητῶν ἐν Ἰερουσαλὴμ σφόδρα, πολύς τε ὄχλος τῶν ἱερέων ὑπήκουον τῇ πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/007.yaml
  text: And the word of God kept increasing[a], and the number of the disciples in Jerusalem kept multiplying greatly, and a large crowd of the priests were becoming obedient to the faith.
translation:
  language: te
  text: దేవుని వాక్యం వ్యాప్తి చెందుతూ వచ్చింది; యెరూషలేములో శిష్యుల సంఖ్య ఎంతో పెరుగుతూ వచ్చింది; యాజకులలోని పెద్ద సమూహం విశ్వాసానికి విధేయులవుతూ వచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “విశ్వాస సందేశానికి విధేయులవుతూ వచ్చారు.” గ్రీకు పదబంధం కేవలం అంతరంగ నమ్మకాన్ని మాత్రమే కాకుండా, ప్రకటించబడిన క్రైస్తవ సందేశానికి విధేయత చూపడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: దేవుని వాక్యం
  rationale: ప్రకటించబడుతున్న దేవుని సందేశాన్ని సూచించే బైబిలు నుడికారాన్ని నిలుపుతుంది; ‘మాట’ లేదా ‘సువార్త సందేశం’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: ηὔξανεν
  choice: వ్యాపిస్తూ వచ్చింది
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే నిరంతర పురోగతిని సహజమైన తెలుగులో తెలియజేస్తుంది. వాక్యం పరిమాణంలో పెరగడం కంటే దాని వ్యాప్తి పెరగడమే సందర్భానుకూల భావం.
- source_word: ἐπληθύνετο ὁ ἀριθμὸς τῶν μαθητῶν
  choice: శిష్యుల సంఖ్య ఎంతో విస్తరించింది
  rationale: μαθηταίను ముఖ్యమైన లూకా పదంగా ‘శిష్యులు’ అని నిలిపి, సంఖ్య నిరంతరంగా అధికమవుతున్న భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐν Ἰερουσαλὴμ σφόδρα
  choice: యెరూషలేములో … ఎంతో
  rationale: స్థల సూచనను నేరుగా ఇస్తూ, σφόδραలోని బలమైన తీవ్రతను ‘ఎంతో’తో వ్యక్తపరుస్తుంది.
- source_word: πολύς τε ὄχλος τῶν ἱερέων
  choice: యాజకులలో కూడా పెద్ద సమూహం
  rationale: ὄχλος యొక్క సమూహార్థాన్ని నిలుపుతూ, τεను కొనసాగింపు భావమిచ్చే ‘కూడా’తో సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ὑπήκουον
  choice: విధేయులవుతూ వచ్చింది
  rationale: అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న ప్రక్రియను, దత్తివుతో కూడిన ὑπακούωలోని విధేయత భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: τῇ πίστει
  choice: విశ్వాసానికి
  rationale: గ్రీకులోని ‘విశ్వాసానికి విధేయులగుట’ అనే ఉద్దేశపూర్వకంగా సంక్షిప్తమైన నుడికారాన్ని నిలుపుతుంది; దీనిని అంతరంగ నమ్మకంగా మాత్రమే లేదా క్రైస్తవ బోధగా మాత్రమే పరిమితం చేయదు.
theological_decisions:
- issue: τῇ πίστει అనే పదబంధంలో πίστις భావం
  choice: విశ్వాసానికి
  alternative: విశ్వాస సందేశానికి / క్రైస్తవ విశ్వాసానికి
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న πίστις ఇక్కడ నమ్మబడే సందేశం లేదా విశ్వాస సంప్రదాయాన్ని సూచించవచ్చు. అయితే మూలంలోని సంక్షిప్తత, భావ ఉద్రిక్తత నిలిచేలా ప్రధాన పాఠంలో ‘విశ్వాసానికి’ అని ఇచ్చి, వస్తుగత భావాన్ని పాదసూచికలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూడు గ్రీకు అసంపూర్ణ భూతకాల క్రియల కొనసాగింపు భావాన్ని ‘వ్యాపిస్తూ వచ్చింది,’ ‘విస్తరించింది,’ ‘విధేయులవుతూ వచ్చింది’ అనే సహజ రూపాలతో తెలిపాం; పదేపదే ఒకే సహాయక క్రియ వాడి వాక్యాన్ని భారంగా చేయలేదు.
