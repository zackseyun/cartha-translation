id: ACT.6.2
reference: Acts 6:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: προσκαλεσάμενοι δὲ οἱ δώδεκα τὸ πλῆθος τῶν μαθητῶν εἶπαν· Οὐκ ἀρεστόν ἐστιν ἡμᾶς καταλείψαντας τὸν λόγον τοῦ θεοῦ διακονεῖν τραπέζαις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/002.yaml
  text: So the Twelve called together the whole group of the disciples and said[c][b][a], “It is not right for us to abandon the word of God to serve tables.”
translation:
  language: te
  text: 'అప్పుడు పన్నెండుమంది శిష్యుల సమూహమంతటినీ[a] పిలిచి ఇలా అన్నారు: “దేవుని వాక్యాన్ని విడిచిపెట్టి, బల్లల వద్ద సేవ చేయడం[c] మాకు తగినది కాదు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “శిష్యుల పూర్తి సంఖ్యను” లేదా “శిష్యుల పెద్ద సమూహాన్ని.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “మాకు సముచితం కాదు” లేదా “మాకు ఆమోదయోగ్యం కాదు.”
    reason: lexical_alternative
  - marker: c
    text: మూలంలో అక్షరార్థంగా “బల్లలకు సేవ చేయడం”; సందర్భంలో ఇది సమాజపు భోజనాలు, వనరుల పంపిణీకి సంబంధించిన ఆచరణాత్మక సేవను సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: పిలిచి
  rationale: సమూహాన్ని తమ దగ్గరకు సమావేశపరచిన భావాన్ని సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: బలమైన వ్యతిరేకతకన్నా మునుపటి సమస్యకు తదుపరి స్పందనను సూచించే కథన అనుసంధానంగా ఉంది.
- source_word: οἱ δώδεκα
  choice: పన్నెండుమంది
  rationale: గ్రీకులో ఉన్న స్థిరమైన సమూహ designationను ‘అపొస్తలులు’ అనే స్పష్టీకరణను చేర్చకుండా ప్రతిబింబిస్తుంది.
- source_word: τὸ πλῆθος τῶν μαθητῶν
  choice: శిష్యుల సమూహమంతటినీ
  rationale: πλῆθος యొక్క సామూహిక భావాన్నీ, మొత్తం సభను పిలిచారనే భావాన్నీ సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: Οὐκ ἀρεστόν ἐστιν
  choice: మాకు తగినది కాదు
  rationale: ఇక్కడ ἀρεστόν ఇష్టం లేదా విలువకన్నా బాధ్యతల యుక్తతను సూచిస్తుంది; ఈ అనువాదం సేవను తక్కువచేయకుండా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: ἡμᾶς καταλείψαντας
  choice: విడిచిపెట్టి
  rationale: καταλείπω లోని వెనుక విడిచివేయడం అనే బలాన్ని కాపాడుతూ తెలుగులో సహజంగా ఉంది.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: దేవుని వాక్యాన్ని
  rationale: λόγος యొక్క ప్రకటన/సందేశ భావంతోపాటు దాని వేదాంతపరమైన ప్రతిధ్వనిని కూడా నిలుపుతుంది.
- source_word: διακονεῖν
  choice: చూసుకోవడం
  rationale: ఈ సందర్భంలోని ఆచరణాత్మక సేవను సహజంగా తెలుపుతుంది; తరువాతి కాలపు సంఘపదవి భావాన్ని దిగుమతి చేయదు.
- source_word: τραπέζαις
  choice: భోజన ఏర్పాట్లను
  rationale: తెలుగులో ‘బల్లలకు సేవ చేయడం’ అసహజంగా, అపార్థకంగా ఉండవచ్చు; సందర్భానుసారంగా భోజనం మరియు వనరుల పంపిణీకి సంబంధించిన నిర్వహణను సూచిస్తుంది, కాగా అడుగుసూచన మూలంలోని రూపకాన్ని వివరిస్తుంది.
theological_decisions:
- issue: ఆచరణాత్మక సేవతో పోల్చినప్పుడు అపొస్తలుల ప్రాధాన్య బాధ్యత
  choice: ‘మాకు తగినది కాదు’ అని బాధ్యతల యుక్తతగా అనువదించడం
  alternative: ‘మాకు ఇష్టమైనది కాదు’ లేదా ‘మాకు ఆమోదయోగ్యం కాదు’
  rationale: ఈ మాట సేవా కార్యం గౌరవాన్ని తగ్గించదు; దేవుని వాక్యానికి సంబంధించిన తమ ప్రత్యేక బాధ్యతను విడిచిపెట్టడం యుక్తం కాదని మాత్రమే పన్నెండుమంది చెబుతున్నారు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే వాక్యనిర్మాణం. మూలంలోని ‘పన్నెండుమంది’ అనే designationను అలాగే ఉంచి, τραπέζαις అనే సంక్షిప్త గ్రీకు ప్రయోగాన్ని ప్రధాన పాఠ్యంలో సహజంగా తెలిపి అడుగుసూచనలో అక్షరార్థాన్ని నమోదు చేశాం.
