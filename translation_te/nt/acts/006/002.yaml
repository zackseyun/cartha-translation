  to: 'అప్పుడు పన్నెండుమంది శిష్యుల సమూహమంతటినీ[a] పిలిచి ఇలా అన్నారు: “దేవుని వాక్యాన్ని విడిచిపెట్టి, బల్లల వద్ద సేవ చేయడం[c] మాకు తగినది కాదు[b].”'
  rationale: The revision replaces an over-specific management paraphrase with “బల్లల వద్ద సేవ చేయడం,” which retains both διακονεῖν (“to serve”) and τραπέζαις (“tables”). The footnote supplies the contextual explanation as a possibility rather than making it part of the verse's asserted wording.
