revisions:
- from: 'వారు అబద్ధ సాక్షులను కూడా నిలబెట్టారు. వారు ఇలా అన్నారు: “ఈ మనిషి ఈ పవిత్ర స్థలానికీ ధర్మశాస్త్రానికీ వ్యతిరేకంగా మాటలు మాట్లాడడం మానడం లేదు.”'
  to: 'వారు కూడా ఇలా చెప్పే అబద్ధ సాక్షులను నిలబెట్టారు: “ఈ మనిషి ఈ పవిత్ర స్థలానికీ ధర్మశాస్త్రానికీ వ్యతిరేకంగా మాటలు చెప్పడం మానడం లేదు.”'
  rationale: 'The revision preserves every source element while making the participial relationship explicit: the false witnesses are the speakers of the quoted accusation. It also replaces a repetitive Telugu collocation with a natural equivalent that still represents the Greek phrase λαλῶν ῥήματα. No footnotes are needed, since the contextual reference of ‘this holy place’ is not expanded in the main text and no textual ambiguity requires annotation.'
  reviewer_model: gpt-5.6-terra
