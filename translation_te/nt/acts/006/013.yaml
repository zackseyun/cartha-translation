id: ACT.6.13
reference: Acts 6:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔστησάν τε μάρτυρας ψευδεῖς λέγοντας· Ὁ ἄνθρωπος οὗτος οὐ παύεται ⸂λαλῶν ῥήματα⸃ κατὰ τοῦ τόπου τοῦ ⸀ἁγίου καὶ τοῦ νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/013.yaml
  text: They also set up false witnesses who said[c][b][a], “This man does not stop speaking against this holy place and the law,”
translation:
  language: te
  text: 'వారు కూడా ఇలా చెప్పే అబద్ధ సాక్షులను నిలబెట్టారు: “ఈ మనిషి ఈ పవిత్ర స్థలానికీ ధర్మశాస్త్రానికీ వ్యతిరేకంగా మాటలు చెప్పడం మానడం లేదు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστησάν
  choice: నిలబెట్టారు
  rationale: న్యాయసంబంధ సందర్భంలో సాక్షులను ముందుకు తెచ్చి సాక్ష్యమివ్వడానికి ఉంచడాన్ని సూచిస్తుంది; తెలుగు వాడుకలో ‘సాక్షులను నిలబెట్టారు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: τε
  choice: కూడా
  rationale: మునుపటి చర్యలకు మరొక చర్యను జోడించే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: μάρτυρας ψευδεῖς
  choice: అబద్ధ సాక్షులను
  rationale: తప్పుడు సాక్ష్యం చెప్పే వారిని సూచించే సహజమైన న్యాయపరమైన తెలుగు వ్యక్తీకరణ.
- source_word: λέγοντας
  choice: వారు ఇలా అన్నారు
  rationale: గ్రీకు కృదంతాన్ని తెలుగులో సహజమైన సమాపక వాక్యంగా మార్చి, సాక్షుల మాటలతో సంబంధాన్ని నిలుపుతుంది.
- source_word: Ὁ ἄνθρωπος οὗτος
  choice: ఈ మనిషి
  rationale: మూలంలోని నేరుగా సూచించే, కొంత తృణీకార ఛాయగల మాటను అతిశయింపకుండా కాపాడుతుంది.
- source_word: οὐ παύεται
  choice: మానడం లేదు
  rationale: కొనసాగుతున్న చర్యను సూచించే గ్రీకు ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: λαλῶν ῥήματα
  choice: మాటలు మాట్లాడడం
  rationale: ῥήματα అనే స్పష్టమైన కర్మను ప్రతిబింబిస్తూ, ఆరోపణలోని పదప్రయోగాన్ని కాపాడుతుంది; తెలుగులో స్వల్ప పునరుక్తి ఉన్నా అర్థం స్పష్టంగా ఉంటుంది.
- source_word: κατὰ
  choice: వ్యతిరేకంగా
  rationale: ఈ ప్రతికూల న్యాయ ఆరోపణలో దిశానిర్దేశిత విరోధ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τοῦ τόπου τοῦ ἁγίου
  choice: ఈ పవిత్ర స్థలానికి
  rationale: గ్రీకులో అక్షరార్థంగా ‘ఆ పవిత్ర స్థలం’ ఉన్నప్పటికీ, సందర్భంలో సమీపంలోని యెరూషలేము దేవాలయాన్ని సూచించే స్థానిక భావాన్ని తెలుగు ‘ఈ’ సహజంగా అందిస్తుంది.
- source_word: νόμου
  choice: ధర్మశాస్త్రానికి
  rationale: యూదుల సందర్భంలో మోషే ధర్మశాస్త్రాన్ని సూచించే స్థిరమైన, స్పష్టమైన తెలుగు పదం.
theological_decisions:
- issue: ‘పవిత్ర స్థలం’ మరియు ‘ధర్మశాస్త్రం’ దేనిని సూచిస్తున్నాయి
  choice: యెరూషలేము దేవాలయం మరియు మోషే ధర్మశాస్త్రాన్ని సందర్భానుసారంగా సూచించేలా అనువదించడం
  alternative: సాధారణ పవిత్ర స్థలం మరియు ఏదో న్యాయసంప్రదాయంగా విస్తృతంగా గ్రహించడం
  rationale: అపొస్తలుల కార్యములు 6లోని తక్షణ సందర్భం దేవాలయం, మోషే గురించి స్తెఫనుపై చేసిన ఆరోపణలకు సంబంధించినది. అయితే వచనంలో లేని వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: ఆరోపణ యొక్క తీవ్రత
  choice: ‘వ్యతిరేకంగా మాటలు మాట్లాడడం’ అనే మూలంలోని న్యాయపరమైన, శత్రుత్వ ఛాయను మాత్రమే నిలుపడం
  alternative: ‘దూషించడం’ లేదా ‘దైవదూషణ చేయడం’ వంటి మరింత తీవ్ర వ్యాఖ్యానాత్మక పదాలు వాడడం
  rationale: గ్రీకు పాఠ్యం ‘వ్యతిరేకంగా మాటలు మాట్లాడడం’ అని చెబుతుంది; మరింత బలమైన దోషారోపణను అనువాదం స్వయంగా చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, కానీ న్యాయ ఆరోపణకు తగిన గంభీరతతో అనువదించబడింది. ప్రధాన పాఠ్యంలో ఎలాంటి పాదసూచిక గుర్తులు లేవు, కాబట్టి పాదసూచికలు జోడించలేదు.
