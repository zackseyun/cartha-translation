id: ACT.6.12
reference: Acts 6:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: συνεκίνησάν τε τὸν λαὸν καὶ τοὺς πρεσβυτέρους καὶ τοὺς γραμματεῖς, καὶ ἐπιστάντες συνήρπασαν αὐτὸν καὶ ἤγαγον εἰς τὸ συνέδριον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/012.yaml
  text: So they stirred up the people and the elders and the scribes[a], and coming upon him, they seized him and brought him before the Sanhedrin,
translation:
  language: te
  text: వారు ప్రజలనూ, పెద్దలనూ, ధర్మశాస్త్ర పండితులనూ రెచ్చగొట్టారు; అతని మీదికి వచ్చి, అతన్ని బలవంతంగా పట్టుకొని మహాసభ[a] ఎదుటికి తీసుకువెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘న్యాయసభ.’ ఇక్కడ గ్రీకు పదం యూదుల పాలక న్యాయసభను, అంటే సన్హెద్రిన్‌ను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκίνησάν
  choice: రెచ్చగొట్టారు
  rationale: ప్రజలను భావోద్వేగపరంగా కదిలించి ఒకరికి వ్యతిరేకంగా ప్రేరేపించడం అనే కారణార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; హింసను అవసరానికి మించి స్పష్టీకరించదు.
- source_word: τε
  choice: తరువాత
  rationale: τέ స్వల్ప అనుసంధాన కణం. తెలుగులో సంఘటనల కొనసాగింపును సహజంగా చూపించేందుకు రెండవ క్రియాక్రమానికి ‘తరువాత’ వాడబడింది; దీనికి అధిక కారణార్థక బలం ఇవ్వలేదు.
- source_word: τὸν λαὸν
  choice: ప్రజలను
  rationale: λαός యొక్క సాధారణ అర్థాన్ని నిలుపుతూ, ‘గుంపు’ అని పరిధిని అనవసరంగా కుదించకుండా ప్రజాసమూహాన్ని సూచిస్తుంది.
- source_word: τοὺς πρεσβυτέρους
  choice: పెద్దలను
  rationale: ఈ యెరూషలేము న్యాయసంబంధ సందర్భంలో గుర్తింపు పొందిన యూదు నాయకులను సూచించే సహజమైన చారిత్రక పదం; కేవలం వృద్ధులను మాత్రమే సూచించదు.
- source_word: τοὺς γραμματεῖς
  choice: ధర్మశాస్త్ర పండితులను
  rationale: గ్రంథాలు, ధర్మశాస్త్రం విషయంలో నిపుణులైన అధికారిక వర్గాన్ని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; ‘శాస్త్రులు’ అనే అపరిచిత మతపరమైన వాడుకకన్నా సహజంగా ఉంటుంది.
- source_word: ἐπιστάντες
  choice: అతని మీదికి వచ్చి
  rationale: ἐφίστημι ఇక్కడ సూచించే అకస్మాత్తు లేదా ప్రతికూల సమీపాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; మూలంలో లేని దాడిని ప్రత్యేకంగా చేర్చదు.
- source_word: συνήρπασαν
  choice: పట్టుకొని
  rationale: బలవంతంగా అదుపులోకి తీసుకోవడం అనే భావాన్ని సందర్భానుసారంగా అందిస్తుంది; ‘ఈడ్చుకెళ్లారు’ అని తరువాతి కదలికను ఈ క్రియలోనే కలపదు.
- source_word: ἤγαγον
  choice: తీసుకువెళ్లారు
  rationale: ముందటి బలవంతపు పట్టుకోవడాన్ని అనుసరించే కదలికను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τὸ συνέδριον
  choice: మహాసభ
  rationale: ఈ సందర్భంలోని యూదుల పాలక న్యాయసభను సూచించే స్థిరమైన, అర్థవంతమైన తెలుగు పదం; సంస్థాగత సూచనను నిలుపుతుంది.
theological_decisions:
- issue: συνέδριον అనే సంస్థ పేరు
  choice: మహాసభ
  alternative: సన్హెద్రిన్ / సభ
  rationale: ఇది ప్రధానంగా చారిత్రక-న్యాయసంబంధ గుర్తింపు. పెద్దలు, ధర్మశాస్త్ర పండితులు ఉన్న యెరూషలేము సందర్భంలో ఇది యూదుల పాలక న్యాయసభను సూచిస్తుంది. ‘మహాసభ’ సాధారణ పాఠకులకు అర్థమవుతూ సంస్థాగత విశిష్టతను కాపాడుతుంది; పాదసూచికలో ‘సన్హెద్రిన్’ పేరును ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే న్యాయసభ సందర్భానికి తగిన గంభీరతతో అనువదించబడింది. జాబితాలో ‘-నూ’ ప్రయోగం మూడు వర్గాలనూ స్పష్టంగా కలుపుతుంది.
