id: ACT.6.3
reference: Acts 6:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπισκέψασθε ⸀δέ, ἀδελφοί, ἄνδρας ἐξ ὑμῶν μαρτυρουμένους ἑπτὰ πλήρεις ⸀πνεύματος καὶ σοφίας, οὓς ⸀καταστήσομεν ἐπὶ τῆς χρείας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/003.yaml
  text: But brothers[a], select from among yourselves seven men who are well attested, full of the Spirit and wisdom[d][c][b], whom we will appoint over this duty.
translation:
  language: te
  text: కానీ సహోదరులారా,[a] మీలోనుండి మంచి సాక్ష్యమున్న, ఆత్మతోను[c] జ్ఞానంతోను నిండిన ఏడుగురు పురుషులను ఎంపిక చేసుకోండి. ఈ బాధ్యతకు[b] మేము వారిని నియమిస్తాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సహోదరులారా” అనేది గ్రీకులోని పుంలింగ సంబోధనకు అనువాదం; సందర్భంలో ఇది విస్తృత విశ్వాస సమాజాన్ని కూడా ఉద్దేశించి ఉండవచ్చు.
    reason: cultural_note
  - marker: b
    text: “ఈ బాధ్యత” అనేది ముందటి సందర్భంలో చెప్పిన రోజువారీ పంపిణీకి సంబంధించిన ఆచరణాత్మక పనిని సూచిస్తుంది.
    reason: cross_reference
  - marker: c
    text: “ఆత్మ”కు బదులుగా “పరిశుద్ధాత్మ” అని కూడా అర్థం చేసుకోవచ్చు. గ్రీకు పాఠ్యంలో అక్షరార్థంగా “ఆత్మతోను జ్ఞానంతోను నిండినవారు” అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπισκέψασθε
  choice: ఎంపిక చేయండి
  rationale: సమాజమే తగినవారిని పరిశీలించి ఎన్నుకోవాలనే మధ్యమ ప్రయోగ ఆజ్ఞార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δέ
  choice: కాబట్టి
  rationale: ముందటి వచనంలోని అపొస్తలుల ప్రతిపాదన నుంచి సమాజం చేయవలసిన చర్యకు వచ్చే సందర్భోచిత అన్వయాన్ని చూపుతుంది; δέ స్వతహాగా తేలికపాటి సంధికారకం కావడం వల్ల ‘అయితే’ కూడా సాధ్యమే.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: గ్రీకు పుంలింగ సంబోధనను గౌరవప్రదంగా నిలుపుతుంది; సందర్భంలో ఇది కూడివచ్చిన విశ్వాసుల విస్తృత సమాజాన్ని ఉద్దేశించి ఉండవచ్చు.
- source_word: ἄνδρας
  choice: పురుషులను
  rationale: ἀνήρ ఇక్కడ సాధారణంగా వ్యక్తులు అని కాకుండా వయోజన పురుషులను సూచిస్తుంది; మూలంలోని లింగ నిర్దిష్టతను కాపాడుతుంది.
- source_word: ἐξ ὑμῶν
  choice: మీలో
  rationale: ఎంపిక సమాజం లోపలివారిలో నుంచే జరగాలనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μαρτυρουμένους
  choice: మంచి సాక్ష్యం పొందినవారు
  rationale: ఇతరులు అనుకూలంగా సాక్ష్యమిచ్చే వ్యక్తులు అనే క్రియాత్మక, సామాజిక ధృవీకరణ భావాన్ని నిలుపుతుంది; కేవలం అంతర్గత నైతిక గుణంగా పరిమితం చేయదు.
- source_word: πλήρεις πνεύματος καὶ σοφίας
  choice: ఆత్మతోను జ్ఞానంతోను నిండినవారు
  rationale: πνεῦμα ముందు ‘పరిశుద్ధ’ అనే విశేషణం మూలంలో లేకపోవడాన్ని నిలుపుతూ, లూకా–అపొస్తలుల కార్యములు సందర్భంలో దేవుని ఆత్మ అనే సాధ్యమైన సూచనను తెలుగు ‘ఆత్మ’ ద్వారా ఉంచుతుంది.
- source_word: καταστήσομεν
  choice: మేము నియమిస్తాము
  rationale: వారిని ఒక అధికారిక బాధ్యతకు నియమించే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐπὶ τῆς χρείας ταύτης
  choice: ఈ బాధ్యతపై
  rationale: ἐπίతో కూడిన χρεία ఇక్కడ శ్రద్ధ వహించాల్సిన పని లేదా అవసరంపై అధికారబద్ధమైన బాధ్యతను సూచిస్తుంది; ముందటి సందర్భంలోని రోజువారీ పంపిణీకి ఇది సంబంధించింది.
theological_decisions:
- issue: πνεύματος సాధారణ మానవ ఆత్మను సూచిస్తుందా, దేవుని ఆత్మను సూచిస్తుందా
  choice: ఆత్మ
  alternative: పరిశుద్ధాత్మ
  rationale: లూకా–అపొస్తలుల కార్యముల వాడుకలో ఇది దేవుని ఆత్మను సూచించే అవకాశం బలంగా ఉంది. అయినా మూలంలో ἁγίου లేదు; అందువల్ల ప్రధాన పాఠ్యంలో ‘పరిశుద్ధ’ను చేర్చకుండా అసలు వాక్యంలోని రూపాన్నీ స్వల్ప సందిగ్ధతనూ కాపాడాం.
- issue: ἀδελφοί సంబోధన యొక్క పరిధి
  choice: సహోదరులారా
  alternative: సహోదర సహోదరీలారా / తోటి విశ్వాసులారా
  rationale: మూలంలోని వ్యాకరణపరమైన పుంలింగ రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అది విస్తృత విశ్వాస సమాజాన్ని కలుపుకొని ఉండవచ్చని పాదటిప్పణిలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని పుంలింగ సూచన, సమాజపు ఎంపిక మరియు అపొస్తలుల నియామకం మధ్య తేడా, πνεῦμα విషయంలోని సూక్ష్మత కాపాడబడ్డాయి. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
