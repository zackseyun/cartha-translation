id: ACT.6.10
reference: Acts 6:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐκ ἴσχυον ἀντιστῆναι τῇ σοφίᾳ καὶ τῷ πνεύματι ᾧ ἐλάλει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/010.yaml
  text: And they were not able to withstand the wisdom and the Spirit by which he was speaking[a].
translation:
  language: te
  text: వారు అతని జ్ఞానాన్నీ, అతడు ఏ ఆత్మచేత మాట్లాడుతున్నాడో ఆ ఆత్మనూ ఎదిరించలేకపోయారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “ఆత్మ” పరిశుద్ధాత్మను సూచించవచ్చు. లేదా ఇది స్తెఫను సొంత ఆత్మను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσχυον
  choice: ఎదిరించగల శక్తి వారికి లేకపోయింది
  rationale: అసమర్థతను తెలిపే అపూర్ణ భూతకాల క్రియను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; కొనసాగుతున్న వాదనలో వారు తట్టుకోలేకపోయారనే భావాన్ని నిలుపుతుంది.
- source_word: ἀντιστῆναι
  choice: ఎదిరించగల
  rationale: ఈ సందర్భంలో స్తెఫను వాదనకు సమర్థంగా ప్రతివాదం చేయడం లేదా దాని ఎదుట నిలబడడం అనే భావాన్ని ఇస్తుంది.
- source_word: σοφίᾳ
  choice: ఏ జ్ఞానంతో
  rationale: నిర్దిష్టంగా స్తెఫను మాటల్లో వెల్లడైన జ్ఞానాన్ని సూచిస్తుంది; సంబంధవాచక నిర్మాణంలో తెలుగు సహజత్వం కోసం ‘ఏ ... తో’ వాడబడింది.
- source_word: πνεύματι
  choice: ఏ ఆత్మచేత
  rationale: సందర్భం పరిశుద్ధాత్మను సూచించే అవకాశమే బలమైనది. అయితే గ్రీకులో ‘ఆత్మ’ అనే పదం స్తెఫను సొంత ఆత్మను కూడా సూచించగలందున తెలుగు ప్రధాన పాఠ్యంలో పెద్ద అక్షరాలపై ఆధారపడకుండా అస్పష్టతను నిలిపి, పాదటిప్పణిలో వివరించబడింది.
- source_word: ᾧ ἐλάλει
  choice: ఏ ఆత్మచేత మాట్లాడుతున్నాడో
  rationale: దత్తివిభక్తి యొక్క సాధనకర్త భావాన్ని ‘చేత’తో తెలియజేస్తుంది; అపూర్ణ భూతకాలంలోని కొనసాగుతున్న మాటల చర్యను ‘మాట్లాడుతున్నాడో’ నిలుపుతుంది.
theological_decisions:
- issue: πνεύματι పరిశుద్ధాత్మను సూచిస్తుందా, స్తెఫను సొంత ఆత్మను సూచిస్తుందా
  choice: ప్రధానంగా పరిశుద్ధాత్మను సూచించేదిగా గ్రహించడం
  alternative: స్తెఫను ఏ ఆత్మతో లేదా అంతరంగ ప్రేరణతో మాట్లాడాడో దానిని సూచించడం
  rationale: అపొస్తలుల కార్యములు 6:5లో స్తెఫను పరిశుద్ధాత్మతో నిండినవాడిగా వర్ణించబడడం, ఇక్కడ జ్ఞానం మరియు ఆత్మ కలిసి అతని మాటలకు మూలంగా చూపబడడం పరిశుద్ధాత్మ భావానికి మద్దతిస్తాయి. అయినా పదరూపం మాత్రమే ఈ నిర్ణయాన్ని తప్పనిసరి చేయదు కాబట్టి ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని జ్ఞానం–ఆత్మ జతను, కొనసాగుతున్న మాటల భావాన్ని, πνεύματι లోని నిజమైన వ్యాఖ్యాన అస్పష్టతను కాపాడింది.
