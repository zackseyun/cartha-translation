revisions:
- from: అయితే అతడు ఏ జ్ఞానంతో, ఏ ఆత్మచేత మాట్లాడుతున్నాడో, వాటిని ఎదిరించగల శక్తి వారికి లేకపోయింది.[a]
  to: వారు అతని జ్ఞానాన్నీ, అతడు ఏ ఆత్మచేత మాట్లాడుతున్నాడో ఆ ఆత్మనూ ఎదిరించలేకపోయారు.[a]
  rationale: Removed the unsupported adversative “అయితే.” Recast the sentence so that “జ్ఞానం” and “ఆత్మ” are the coordinated objects they could not withstand, while the singular relative clause is represented explicitly with “అతడు ఏ ఆత్మచేత మాట్లాడుతున్నాడో ఆ ఆత్మను.” The footnote retains the genuine interpretive alternative for πνεύματι.
  reviewer_model: gpt-5.6-terra
