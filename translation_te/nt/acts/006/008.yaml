  text: Στέφανος δὲ πλήρης ⸀χάριτος καὶ δυνάμεως ἐποίει τέρατα καὶ σημεῖα μεγάλα ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/008.yaml
  text: Stephen[a], full of grace and power, was doing great wonders and signs among the people.
translation:
  language: te
  text: కృపతో, శక్తితో నిండిన స్తెఫను[a] ప్రజల మధ్య గొప్ప అద్భుతాలను, సూచకాలను చేస్తూ ఉండేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘కృపతో, శక్తితో నిండిన’ అనే మాటలకు బదులుగా ‘విశ్వాసంతో, శక్తితో నిండిన’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక కథనాన్ని ముందుకు నడిపించే స్వల్ప అనుసంధానాన్ని సూచిస్తుంది. తెలుగులో ప్రత్యేక సంధానపదం లేకుండానే సహజమైన కథన ప్రవాహం నిలుస్తుంది.
- source_word: πλήρης χάριτος καὶ δυνάμεως
  choice: కృపతో, శక్తితో నిండిన
  rationale: πλήρης తో వచ్చిన షష్ఠీ రూపాలు స్తెఫనును లక్షణీకరించే నిండుదలను తెలియజేస్తాయి. ‘కృప’ మరియు ‘శక్తి’ లూకా రచనలోని భావప్రతిధ్వనిని నిలుపుతాయి.
- source_word: χάριτος
  choice: కృపతో
  rationale: SBLGNT పాఠం χάριτος (‘కృప’) అని ఉంది; అందువల్ల దానినే ప్రధాన పాఠంలో నేరుగా అనువదించాం. ‘విశ్వాసం’ అనే పాఠాంతరాన్ని పాదసూచికలో ఉంచాం.
- source_word: δυνάμεως
  choice: శక్తితో
  rationale: అపొస్తలుల కార్యాలలో δύναμις సేవలోను అద్భుత కార్యాలలోను వ్యక్తమయ్యే శక్తిని సాధారణంగా సూచిస్తుంది.
- source_word: ἐποίει
  choice: చేస్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం గతంలో కొనసాగుతున్న లేదా అలవాటైన కార్యాన్ని సూచిస్తుంది; ‘చేస్తూ ఉన్నాడు’ ఆ దృక్కోణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τέρατα καὶ σημεῖα
  choice: అద్భుతాలనూ సూచక క్రియలనూ
  rationale: τέρατα ఆశ్చర్యం కలిగించే కార్యాలను, σημεῖα వాటి సూచనాత్మక ప్రాముఖ్యతను తెలియజేస్తాయి. రెండు పదాల ప్రత్యేక భావాలను ఈ జంట సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: μεγάλα
  choice: గొప్ప
  rationale: μεγάλα రెండు నామవాచకాలకూ వర్తిస్తుంది; ‘గొప్ప’ దాని విస్తృత భావాన్ని అతివ్యాఖ్యానం చేయకుండా అందిస్తుంది.
- source_word: ἐν τῷ λαῷ
  choice: ప్రజల మధ్య
  rationale: ఈ కార్యాలు జరిగిన సామాజిక పరిధిని సూచించే సహజమైన తెలుగు ప్రయోగం.
theological_decisions:
- issue: χάριτος/πίστεως వద్ద పాఠాంతరం
  choice: కృప
  alternative: విశ్వాసం
  rationale: ఇచ్చిన SBLGNT మూలపాఠంలో χάριτος (‘కృప’) ఉంది కాబట్టి ప్రధాన పాఠం దానిని అనుసరిస్తుంది. అర్థవంతమైన ‘విశ్వాసం’ పాఠాంతరాన్ని మౌనంగా తొలగించకుండా పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. మూలంలోని కొనసాగుతున్న క్రియాభావాన్ని, ‘అద్భుతాలు—సూచక క్రియలు’ అనే భావభేదాన్ని నిలుపుతూ సహజ పదక్రమం వాడబడింది.
