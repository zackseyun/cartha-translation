  source_fidelity: The draft accurately conveys the narrative turn, the named synagogue, the geographical groups, and the adversarial discussion. However, “వాదించడం మొదలుపెట్టారు” adds an explicit inceptive sense (‘began’) that the Greek participle συζητοῦντες does not itself require. Rendering it simply as “వాదించారు” retains the action without adding aspectual detail.
