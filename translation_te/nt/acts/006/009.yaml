source:
  edition: SBLGNT
  text: ἀνέστησαν δέ τινες τῶν ἐκ τῆς συναγωγῆς τῆς λεγομένης Λιβερτίνων καὶ Κυρηναίων καὶ Ἀλεξανδρέων καὶ τῶν ἀπὸ Κιλικίας καὶ Ἀσίας συζητοῦντες τῷ Στεφάνῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/009.yaml
  text: But some of those from the synagogue called the Synagogue of the Freedmen[a], and of the Cyrenians and Alexandrians, and of those from Cilicia and Asia[b], stood up and began arguing with Stephen.
translation:
  language: te
  text: అయితే, ‘విడుదల పొందినవారి సమాజమందిరం’[a] అని పిలువబడే సమాజమందిరానికి చెందిన కొందరు—కురేనీయులు, అలెక్సాండ్రియవారు, అలాగే కిలికియ, ఆసియా[b] ప్రాంతాలవారు—లేచి స్తెఫనుతో వాదించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లిబెర్తీనుల సమాజమందిరం.” గ్రీకు పదం దాసత్వం నుంచి విడుదల పొందినవారిని—బహుశా పూర్వ దాసులను లేదా వారి సంతతిని—సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “ఆసియా” అంటే నేటి ఆసియా ఖండం కాదు; ఆసియా మైనరు పశ్చిమ భాగంలో ఉన్న రోమా పరిపాలనా ప్రాంతం.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέστησαν
  choice: లేచి
  rationale: ప్రతిఘటనకు పూనుకోవడాన్ని పరిచయం చేసే ‘లేచారు/లేచి నిలబడ్డారు’ అనే స్పష్టమైన చిత్రాన్ని నిలుపుతుంది; తరువాతి క్రియతో సహజంగా కలుస్తుంది.
- source_word: δέ
  choice: అయితే
  rationale: మునుపటి వర్ణన నుంచి వ్యతిరేకత వైపు కథనం మళ్లుతున్న స్వల్ప విరుద్ధ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τινες τῶν ἐκ τῆς συναγωγῆς
  choice: సమాజమందిరానికి చెందిన కొందరు
  rationale: τινες తో ఉన్న భాగసూచక సంబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: συναγωγῆς
  choice: సమాజమందిరం
  rationale: యూదుల కూడికను లేదా ఆరాధనా స్థలాన్ని సూచించే, తెలుగులో స్థిరపడిన గౌరవప్రదమైన పదం.
- source_word: τῆς λεγομένης
  choice: అని పిలువబడే
  rationale: ఆ సమాజమందిరానికి ప్రాచుర్యంలో ఉన్న పేరును తటస్థంగా సూచిస్తుంది.
- source_word: Λιβερτίνων
  choice: విడుదల పొందినవారి
  rationale: Λιβερτῖνοι అనే చారిత్రక సమూహపేరు దాసత్వం నుంచి విడుదల పొందినవారిని లేదా వారి సంతతిని సూచిస్తుంది; ఆధునికంగా తప్పుదారి పట్టించే ఇతర అర్థాలను నివారిస్తుంది.
- source_word: Κυρηναίων καὶ Ἀλεξανδρέων
  choice: కురేనీయులు, అలెక్సాండ్రియవారు
  rationale: ఆయా నగరాలకు చెందిన ప్రజలను సూచించే జాతివాచకాలను సహజ తెలుగు రూపాల్లో ఇస్తుంది.
- source_word: τῶν ἀπὸ Κιλικίας καὶ Ἀσίας
  choice: కిలికియ, ఆసియా ప్రాంతాలవారు
  rationale: ἀπό సూచించే భౌగోళిక మూలాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘ఆసియా’ చారిత్రక పరిధిని పాదసూచిక వివరిస్తుంది.
- source_word: συζητοῦντες τῷ Στεφάνῳ
  choice: స్తెఫనుతో వాదించడం మొదలుపెట్టారు
  rationale: సందర్భంలోని శత్రుత్వపూర్వక మాటల ప్రతిఘటనను తెలియజేస్తుంది; ప్రధాన క్రియతో కలిసి చర్య ఆరంభాన్ని సహజ తెలుగు కథన శైలిలో వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. సమాజమందిరపు పేరుకు సంబంధించిన చారిత్రక అర్థాన్ని ప్రధాన వచనంలో చదవడానికి సులభంగా ఉంచి, ప్రత్యామ్నాయ లిప్యంతరీకరణను పాదసూచికలో ఇచ్చాం. గ్రీకు వాక్యనిర్మాణంలో ఒకటి లేదా అంతకంటే ఎక్కువ సమాజమందిరాలు ఉద్దేశించబడ్డాయా అనే సందిగ్ధత ఉన్నప్పటికీ, ఏకవచనమైన συναγωγῆς ను అనుసరించి ప్రధాన వచనం ఒక సమాజమందిరంగానే అందిస్తుంది.
