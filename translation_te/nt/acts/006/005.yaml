- from: ఆ ప్రతిపాదన సమూహమంతటికీ నచ్చింది. అప్పుడు వారు విశ్వాసంతో[a], పరిశుద్ధాత్మతో నిండిన స్తెఫనును, ఫిలిప్పును, ప్రొకొరును, నికానోరును, తీమోనును, పర్మెనాసును, అలాగే అంతియొకయకు చెందిన, యూదమతంలో చేరిన[b] నికొలావును ఎన్నుకున్నారు.
