id: ACT.6.5
reference: Acts 6:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἤρεσεν ὁ λόγος ἐνώπιον παντὸς τοῦ πλήθους, καὶ ἐξελέξαντο Στέφανον, ἄνδρα ⸀πλήρης πίστεως καὶ πνεύματος ἁγίου, καὶ Φίλιππον καὶ Πρόχορον καὶ Νικάνορα καὶ Τίμωνα καὶ Παρμενᾶν καὶ Νικόλαον προσήλυτον Ἀντιοχέα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/005.yaml
  text: And the proposal pleased the whole multitude[a], and they chose Stephen, a man full of faith and of the Holy Spirit, Philip, Prochorus, Nicanor, Timon, Parmenas, and Nicolaus[c][b], a proselyte of Antioch.
translation:
  language: te
  text: ఆ ప్రతిపాదన సమూహమంతటికీ నచ్చింది. అప్పుడు వారు విశ్వాసంతోను[a] పరిశుద్ధాత్మతోను నిండిన వ్యక్తి అయిన స్తెఫనును—ఫిలిప్పును, ప్రొకొరును, నికానోరును, తీమోనును, పర్మెనాసును, మరియు అంతియొకయకు చెందిన, యూదమతంలో చేరిన[b] నికొలావును ఎన్నుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విశ్వసనీయతతో నిండిన.” ఇక్కడి గ్రీకు పదం విశ్వాసం, నమ్మకం లేదా విశ్వసనీయతను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: “యూదమతంలో చేరిన” అంటే అన్యజన నేపథ్యం నుంచి యూదమతాన్ని స్వీకరించిన వ్యక్తి.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λόγος
  choice: ఆ ప్రతిపాదన
  rationale: ఇది సాధారణంగా ‘మాట’ను సూచించడం కాదు; ముందటి వచనంలో అపొస్తలులు ఉంచిన నిర్దిష్ట ప్రతిపాదనను సూచిస్తుంది.
- source_word: ἐνώπιον παντὸς τοῦ πλήθους
  choice: సమూహమంతటికీ
  rationale: ἀρέσκωతో కలిసి ఈ పదబంధం కూడివచ్చిన మొత్తం సమూహం ఆ ప్రతిపాదనను ఆమోదించిన భావాన్ని ఇస్తుంది; ‘సంఘం’ వంటి తరువాతి కాలపు సంస్థాగత పదాన్ని ఉద్దేశపూర్వకంగా ఉపయోగించలేదు.
- source_word: ἐξελέξαντο
  choice: ఎన్నుకున్నారు
  rationale: సమూహం తమ మధ్య సేవకోసం ఈ ఏడుగురిని ఎంపిక చేసుకున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: πλήρης πίστεως
  choice: విశ్వాసంతో నిండిన
  rationale: ఇక్కడ πίστιςకు ప్రధాన అర్థంగా ‘విశ్వాసం’ సహజంగా సరిపోతుంది; ‘విశ్వసనీయత/నమ్మకత్వం’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: πνεύματος ἁγίου
  choice: పరిశుద్ధాత్మతో నిండిన
  rationale: అపొస్తలుల కార్యముల సందర్భంలో ఈ పదబంధం దైవిక పరిశుద్ధాత్మను సూచిస్తుంది; తెలుగులో ‘తో నిండిన’ అనే నిర్మాణం సహజంగా ఉంటుంది.
- source_word: προσήλυτον
  choice: యూదమతంలో చేరిన
  rationale: ఇది అన్యజన నేపథ్యం నుంచి యూదమతంలో చేరిన వ్యక్తిని సూచిస్తుంది. అరుదైన సాంకేతిక పదం కంటే ఈ వివరణ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: Ἀντιοχέα
  choice: అంతియొకయకు చెందిన
  rationale: నికొలావుకు అంతియొకయతో ఉన్న భౌగోళిక సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: Στέφανον, Φίλιππον, Πρόχορον, Νικάνορα, Τίμωνα, Παρμενᾶν, Νικόλαον
  choice: స్తెఫను, ఫిలిప్పు, ప్రొకొరు, నికానోరు, తీమోను, పర్మెనాసు, నికొలావు
  rationale: గ్రీకు వ్యక్తినామాలను తెలుగులో గుర్తించదగిన, ప్రాచుర్యంలో ఉన్న రూపాలకు దగ్గరగా లిప్యంతరీకరించాం; వాక్యంలో కర్మలుగా ఉన్నందున తగిన విభక్తి ప్రత్యయాలు జోడించాం.
theological_decisions:
- issue: స్తెఫను వర్ణనలో πίστις అర్థం
  choice: విశ్వాసం
  alternative: విశ్వసనీయత లేదా నమ్మకత్వం
  rationale: సందర్భంలో దేవునిపై విశ్వాసం ప్రధాన భావంగా సహజంగా ఉన్నా, గ్రీకు పదం వ్యక్తిగత విశ్వసనీయతను కూడా సూచించగలదు. ఆ నిజమైన అర్థసాధ్యతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన వాక్యనిర్మాణం వాడాం. గ్రీకు మూలంలోని పునరావృత καίలను తెలుగులో సహజమైన జాబితాగా మార్చి, చివరి పేరుకు ముందు ‘అలాగే’ ఉంచాం. ‘సమూహం’ అనే పదం πλῆθος యొక్క సమష్టి భావాన్ని నిలుపుతుంది; అనవసరమైన సంస్థాగత భావం రాకుండా ‘సంఘం’ను నివారించాం.
