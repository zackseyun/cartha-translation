id: ACT.21.29
reference: Acts 21:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἦσαν γὰρ ⸀προεωρακότες Τρόφιμον τὸν Ἐφέσιον ἐν τῇ πόλει σὺν αὐτῷ, ὃν ἐνόμιζον ὅτι εἰς τὸ ἱερὸν εἰσήγαγεν ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/029.yaml
  text: For they had previously seen Trophimus the Ephesian in the city with him[a], and they supposed that Paul had brought him into the temple.
translation:
  language: te
  text: ఎందుకంటే, వారు అంతకుముందు ఎఫెసీయుడైన త్రోఫిమును పట్టణంలో పౌలుతో కలిసి చూశారు. పౌలు అతణ్ణి దేవాలయ ప్రాంగణంలోకి[a] తీసుకువెళ్లాడని వారు అనుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “దేవాలయ ప్రాంగణం” అని అనువదించిన గ్రీకు పదం దేవాలయ సముదాయాన్ని లేదా దాని ఆవరణలను సూచించగలదు; అది కేవలం లోపలి పరిశుద్ధస్థలాన్ని మాత్రమే సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν ... προεωρακότες
  choice: అంతకుముందు ... చూసి ఉన్నారు
  rationale: ఈ పరిభాషాత్మక నిర్మాణం సూచించే పూర్వకాల భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: Τρόφιμον τὸν Ἐφέσιον
  choice: ఎఫెసువాడైన త్రోఫిమును
  rationale: Ἐφέσιον త్రోఫిము ఏ ప్రాంతానికి చెందినవాడో తెలియజేస్తుంది; ఈ రూపం గ్రీకు అన్వయాన్ని సహజంగా అందిస్తుంది.
- source_word: ἐν τῇ πόλει
  choice: పట్టణంలో
  rationale: ఇక్కడ πόλις యెరూషలేము పట్టణాన్ని దేవాలయ ప్రాంతం నుండి వేరుగా సూచిస్తుంది.
- source_word: σὺν αὐτῷ
  choice: అతనితో కలిసి
  rationale: సందర్భంలో αὐτῷ పౌలును సూచిస్తుంది; σύν యొక్క సహవాస భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐνόμιζον
  choice: అనుకున్నారు
  rationale: వారు చూసిన దాని ఆధారంగా నిశ్చయమైన జ్ఞానం కాకుండా ఒక ఊహాత్మక నిర్ధారణకు వచ్చారని ఈ సాధారణ తెలుగు పదం తెలియజేస్తుంది.
- source_word: εἰς τὸ ἱερὸν
  choice: దేవాలయ ప్రాంగణంలోకి
  rationale: ἱερόν అంతర్గర్భాలయాన్ని మాత్రమే కాకుండా విశాలమైన దేవాలయ సముదాయాన్ని లేదా ఆవరణను సూచించగలదు; 'ప్రాంగణం' చారిత్రక ఆరోపణకు తగిన స్పష్టత ఇస్తుంది.
- source_word: εἰσήγαγεν
  choice: తీసుకువచ్చాడని
  rationale: ఆ వ్యక్తిని నిషిద్ధ ప్రాంతంలోకి వెంట తీసుకురావడం అనే సందర్భార్థాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ἱερόν యొక్క పరిధి మరియు పౌలుపై చేసిన ఆరోపణ
  choice: ప్రధాన పాఠంలో 'దేవాలయ ప్రాంగణం' అని అనువదించి, గ్రీకు పదం మొత్తం దేవాలయ సముదాయాన్ని సూచించగలదని పాదసూచికలో వివరించడం
  alternative: దేవాలయంలోకి
  rationale: ἱερόν అనేది ναός వలె అంతర్గర్భాలయాన్ని మాత్రమే సూచించదు. అన్యజనుడిని పవిత్ర ఆవరణలోని నిషిద్ధ భాగంలోకి తీసుకువచ్చాడనే సందర్భానికి 'ప్రాంగణం' ఎక్కువ చారిత్రక స్పష్టతనిస్తుంది; పాదసూచిక అసలు పదంలోని విస్తృత పరిధిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. γάρ యొక్క వివరణాత్మక సంబంధాన్ని 'ఎందుకంటే'తో, ముందు జరిగిన దర్శనాన్ని 'అంతకుముందు ... చూసి ఉన్నారు'తో నిలిపాం.
