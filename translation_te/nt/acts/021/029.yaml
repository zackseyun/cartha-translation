- from: ఎందుకంటే, అంతకుముందు ఎఫెసువాడైన త్రోఫిమును పట్టణంలో అతనితో కలిసి వారు చూసి ఉన్నారు. పౌలు అతణ్ణి దేవాలయ ప్రాంగణంలోకి[a] తీసుకువచ్చాడని వారు అనుకున్నారు.
  to: ఎందుకంటే, వారు అంతకుముందు ఎఫెసీయుడైన త్రోఫిమును పట్టణంలో పౌలుతో కలిసి చూశారు. పౌలు అతణ్ణి దేవాలయ ప్రాంగణంలోకి[a] తీసుకువెళ్లాడని వారు అనుకున్నారు.
