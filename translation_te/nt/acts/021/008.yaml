id: ACT.21.8
reference: Acts 21:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῇ δὲ ἐπαύριον ἐξελθόντες ⸀ἤλθομεν εἰς Καισάρειαν, καὶ εἰσελθόντες εἰς τὸν οἶκον Φιλίππου τοῦ εὐαγγελιστοῦ ὄντος ἐκ τῶν ἑπτὰ ἐμείναμεν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/008.yaml
  text: On the next day we departed and came to Caesarea[a], and entering the house of Philip the evangelist, who was one of the seven, we stayed with him.
translation:
  language: te
  text: మరుసటి రోజు మేము బయలుదేరి కైసరయకు వచ్చాము. సువార్తికుడును ఆ ఏడుగురిలో ఒకడునైన ఫిలిప్పు ఇంటికి వెళ్లి, అతని వద్ద బస చేశాము.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, యెరూషలేములో సేవ కోసం ఇంతకుముందు నియమించబడిన ఏడుగురిలో ఒకడు (అపొస్తలుల కార్యాలు 6:3–6 చూడండి).
    reason: cross_reference
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: మరుసటి రోజు
  rationale: కథనంలోని కాలక్రమాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; δέను విడిగా అనువదించాల్సిన అవసరం లేదు.
- source_word: ἐξελθόντες
  choice: బయలుదేరి
  rationale: ప్రయాణ సందర్భంలో ముందున్న స్థలం నుంచి వెళ్లడాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἤλθομεν εἰς Καισάρειαν
  choice: కైసరయకు వచ్చాము
  rationale: గమ్యస్థానానికి చేరిన కదలికను మూలంలోని సాధారణ క్రియకు దగ్గరగా ఉంచుతుంది.
- source_word: Φιλίππου τοῦ εὐαγγελιστοῦ
  choice: సువార్తికుడైన ఫిలిప్పు
  rationale: εὐαγγελιστής అనే పరిచర్య సూచక పదాన్ని స్థిరమైన, సంక్షిప్త తెలుగు పదంతో అందిస్తుంది.
- source_word: εἰσελθόντες εἰς τὸν οἶκον
  choice: ఇంట్లోకి వెళ్లి
  rationale: చర్యల క్రమాన్ని సహజమైన తెలుగు సంయుక్త క్రియారూపంలో నిలుపుతుంది.
- source_word: ὄντος ἐκ τῶν ἑπτὰ
  choice: అతడు ఆ ఏడుగురిలో ఒకడు
  rationale: అపొస్తలుల కార్యాలు 6లో ముందుగా ప్రస్తావించిన ఏడుగురిని సూచించే చారిత్రక గుర్తింపును, దానిని సాంకేతిక పదవిగా మార్చకుండా, స్పష్టంగా ఉంచుతుంది.
- source_word: ἐμείναμεν παρ’ αὐτῷ
  choice: అతనితో ఉన్నాము
  rationale: ఆతిథ్య సందర్భంలో ఫిలిప్పు వద్ద బసచేయడాన్ని సహజంగా తెలియజేస్తూ, మూలంలోని విస్తృతమైన μένω భావాన్ని అనవసరంగా కుదించదు.
theological_decisions:
- issue: ఫిలిప్పు ‘ఏడుగురిలో ఒకడు’ అనే గుర్తింపు
  choice: ఆ ఏడుగురిలో ఒకడు
  alternative: ఏడుగురు పరిచారకులలో ఒకడు
  rationale: వచనం వారిని ఒక నిర్దిష్ట సంఘపదవితో పిలవదు. కాబట్టి చారిత్రక సూచనను నిలిపి, తరువాతి సంఘ నిర్మాణ భావనలను పాఠ్యంలోకి తీసుకురాలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైన ప్రయాణ కథన శైలి, గౌరవప్రదమైన బైబిలు వచన ధోరణి. ప్రధాన పాఠ్యంలో [a] గుర్తు సంబంధిత వాక్యానంతరం ఉంచబడింది.
