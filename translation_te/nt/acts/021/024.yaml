id: ACT.21.24
reference: Acts 21:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τούτους παραλαβὼν ἁγνίσθητι σὺν αὐτοῖς καὶ δαπάνησον ἐπ’ αὐτοῖς ἵνα ⸀ξυρήσονται τὴν κεφαλήν, καὶ ⸀γνώσονται πάντες ὅτι ὧν κατήχηνται περὶ σοῦ οὐδέν ἐστιν, ἀλλὰ στοιχεῖς καὶ αὐτὸς ⸂φυλάσσων τὸν νόμον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/024.yaml
  text: Take these men[a], purify yourself along with them, and pay their expenses so that they may shave their heads. Then everyone will know that there is nothing to the things they have been told about you[b], but that you yourself also are living in observance of the law.
translation:
  language: te
  text: ఆ మనుష్యులను నీతో తీసుకొని, వారితో కలిసి శుద్ధి ఆచరించు. వారు తమ తలలు గీయించుకోవడానికి వారి ఖర్చులను నువ్వే భరించు. అప్పుడు నీ గురించి తమకు తెలియజేయబడిన విషయాల్లో[a] నిజమేమీ లేదని, నువ్వు స్వయంగా కూడా ధర్మశాస్త్రాన్ని పాటిస్తూ దాని ప్రకారం నడుచుకుంటున్నావని[b] అందరూ తెలుసుకుంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ గురించి వారికి బోధించబడిన విషయాల్లో.” గ్రీకు క్రియకు “బోధించు” లేదా సాధారణంగా “తెలియజేయు” అనే అర్థాలు రావచ్చు. ఇక్కడ అది పౌలు గురించి వ్యాపించిన సమాచారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “వరుసలో నడుస్తూ”; అంటే ధర్మశాస్త్రాన్ని పాటించడానికి అనుగుణంగా జీవిస్తూ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτους παραλαβὼν
  choice: ఆ మనుష్యులను నీతో తీసుకొని
  rationale: మునుపటి వచనంలోని నలుగురు మనుష్యులే ఉద్దేశించబడ్డారు. παραλαμβάνω ఇక్కడ వారిని వెంట తీసుకోవడాన్ని సూచిస్తుంది.
- source_word: ἁγνίσθητι σὺν αὐτοῖς
  choice: వారితో కలిసి నిన్ను నీవు శుద్ధి చేసుకో
  rationale: ἁγνίζω ఇక్కడ ఆచారసంబంధమైన శుద్ధిని సూచిస్తుంది; σύν భావాన్ని ‘వారితో కలిసి’ స్పష్టంగా అందిస్తుంది.
- source_word: δαπάνησον ἐπ’ αὐτοῖς
  choice: వారి ఖర్చులు నువ్వే భరించు
  rationale: వారి పక్షంగా, మొక్కుబడికి సంబంధించిన వ్యయాన్ని చెల్లించాలనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἵνα ξυρήσονται τὴν κεφαλήν
  choice: వారు తమ తలలు గొరిగించుకునేలా
  rationale: ἵνα తరువాతి భవిష్యత్ మధ్యమ రూపం ఉద్దేశం లేదా ఆశించిన ఫలితాన్ని తెలుపుతుంది. ఏకవచన ‘తల’ పంపిణీ భావంతో ఉంది కాబట్టి తెలుగులో బహువచనం సహజం.
- source_word: ὧν κατήχηνται περὶ σοῦ
  choice: నీ గురించి తమకు తెలియజేయబడిన విషయాలు
  rationale: κατηχέω ‘బోధించు’ లేదా ‘తెలియజేయు’ అనే అర్థాలు ఇవ్వగలదు. ఇక్కడ పౌలు గురించి వ్యాపించిన సమాచారాన్ని సూచిస్తున్నందున ‘తెలియజేయబడిన’ తటస్థంగా ఉంటుంది.
- source_word: οὐδέν ἐστιν
  choice: నిజమేమీ లేదు
  rationale: ఆ వదంతులకు వాస్తవాధారం లేదనే సందర్భార్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: στοιχεῖς
  choice: దాని ప్రకారం నడుచుకుంటున్నావు
  rationale: στοιχέω అంటే ఒక నియమానికి అనుగుణంగా వరుసలో నడవడం లేదా జీవించడం. ‘ప్రకారం నడుచుకోవడం’ దాని రూపక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: καὶ αὐτὸς
  choice: నువ్వు కూడా
  rationale: καί లోని జోడింపు భావాన్నీ, αὐτός లోని వ్యక్తిగత ఉద్ఘాటననూ సందర్భానుసారంగా అందిస్తుంది.
- source_word: φυλάσσων τὸν νόμον
  choice: ధర్మశాస్త్రాన్ని పాటిస్తూ
  rationale: φυλάσσω + νόμος అంటే ధర్మశాస్త్రాన్ని కాపాడడం అనే అక్షరార్థం కంటే దాన్ని ఆచరించడం లేదా పాటించడం. ‘పాటిస్తూ’ కొనసాగుతున్న ప్రవర్తనను తెలియజేస్తుంది.
theological_decisions:
- issue: ఈ కథనంలో ధర్మశాస్త్రంతో పౌలుకు ఉన్న సంబంధం
  choice: ‘నువ్వు కూడా ధర్మశాస్త్రాన్ని పాటిస్తూ దాని ప్రకారం నడుచుకుంటున్నావు’ అని కనిపించే ప్రవర్తనను వర్ణించేలా అనువదించబడింది.
  alternative: ‘నువ్వు కూడా ధర్మశాస్త్రాన్ని పాటిస్తున్నావు’
  rationale: ఈ మాట పౌలు చేసిన చర్యను చూసి ఇతరులు గ్రహించబోయే విషయాన్ని వివరిస్తుంది. పౌలు బోధలో ధర్మశాస్త్రానికి ఉన్న విస్తృత స్థానాన్ని ఈ వచనంలోనే నిర్ణయించకుండా, కథనంలోని ఉద్రిక్తతను అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ధర్మశాస్త్రం’ νόμος యొక్క యూదు ధార్మిక సందర్భాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది. రెండు పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
