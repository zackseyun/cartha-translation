  text: ὡς δὲ ἠκούσαμεν ταῦτα, παρεκαλοῦμεν ἡμεῖς τε καὶ οἱ ἐντόπιοι τοῦ μὴ ἀναβαίνειν αὐτὸν εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/012.yaml
  text: When we heard these things[a], we and the local people urged him not to go up to Jerusalem.
translation:
  language: te
  text: మేము ఈ సంగతులు విన్నప్పుడు, మేమూ అక్కడి ప్రజలూ అతనిని యెరూషలేముకు పైకి వెళ్లవద్దని వేడుకున్నాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనిని యెరూషలేముకు పైకి వెళ్లవద్దని పదేపదే వేడుకున్నాం.” గ్రీకు క్రియ కొనసాగుతున్న లేదా పునరావృతమైన విన్నపాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἠκούσαμεν ταῦτα
  choice: మేము ఈ సంగతులు విన్నప్పుడు
  rationale: ὡς temporal circumstanceను ‘విన్నప్పుడు’ సహజంగా తెలియజేస్తుంది; δέ ఇక్కడ స్వల్ప వాక్యప్రవాహ సూచకం కాబట్టి విడిగా బలపరచలేదు. ταῦτα యొక్క బహువచనాన్ని ‘ఈ సంగతులు’గా నిలిపాం.
- source_word: παρεκαλοῦμεν
  choice: వేడుకున్నాం
  rationale: సందర్భంలో పౌలు వెళ్లకుండా చేయాలనే గంభీరమైన అభ్యర్థన ఉంది. παρακαλέωకు ‘ప్రోత్సహించు/విన్నవించు/వేడుకొను’ అనే పరిధి ఉండగా, ఇక్కడ ‘వేడుకున్నాం’ సందర్భానుకూలం. అపూర్ణ భూతకాల క్రియ కొనసాగిన అభ్యర్థనను సూచించగలదని పాదటీపులో ప్రత్యామ్నాయం ఇచ్చాం.
- source_word: ἡμεῖς τε καὶ οἱ ἐντόπιοι
  choice: మేమూ అక్కడి ప్రజలూ
  rationale: కథకుని బృందం, ఆ ప్రాంతపు ప్రజలు అనే రెండు వర్గాలూ కలిసి కోరిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοῦ μὴ ἀναβαίνειν αὐτὸν
  choice: అతను ... వెళ్లవద్దని అతన్ని
  rationale: παρακαλέω తరువాతి articular infinitive అభ్యర్థన యొక్క విషయాన్ని తెలుపుతుంది. తెలుగులో ఉద్దేశ్యాన్ని స్పష్టంగా ఉంచేందుకు ‘అతను వెళ్లవద్దని అతన్ని వేడుకున్నాం’ అనే నిర్మాణం వాడాం.
- source_word: εἰς Ἰερουσαλήμ
  choice: యెరూషలేముకు
  rationale: గమ్యస్థానాన్ని సహజంగా సూచిస్తుంది.
- source_word: ἀναβαίνειν
  choice: వెళ్లడం
  rationale: గ్రీకులో యెరూషలేముకు ప్రయాణాన్ని ‘పైకి వెళ్లడం’గా చెప్పే దిశాసూచక వాడుక ఉంది. తెలుగులో ‘యెరూషలేముకు వెళ్లడం’ సహజంగా ఉంటుంది; మూలంలోని దిశాభావాన్ని పాదటీపులో సంరక్షించాం.
theological_decisions:
- issue: యెరూషలేముకు ప్రయాణానికి వాడిన దిశాసూచక పదం
  choice: యెరూషలేముకు వెళ్లడం
  alternative: యెరూషలేముకు పైకి వెళ్లడం
  rationale: ἀναβαίνειν అక్షరార్థంగా ‘పైకి వెళ్లడం’ అయినా, యెరూషలేముకు ప్రయాణాన్ని సూచించే సంప్రదాయ దిశాప్రయోగం. ప్రధాన వచనంలో సహజ తెలుగు వాడి, మూలంలోని భావాన్ని పాదటీపులో తెలిపాం; దీనికి అదనపు ధార్మిక అర్థం ఆపాదించలేదు.
- issue: παρεκαλοῦμεν యొక్క అభ్యర్థనా తీవ్రత, కొనసాగింపు
  choice: వేడుకున్నాం
  alternative: వెళ్లవద్దని పదేపదే వేడుకుంటూ ఉన్నాం
  rationale: సందర్భం earnest pleadingను సమర్థిస్తుంది; అయితే imperfect యొక్క కొనసాగింపు ఎంతగా ముందుకు తేవాలో మూలం పూర్తిగా నిర్ణయించదు. ప్రధాన వచనం సరళంగా ఉంచి ప్రత్యామ్నాయ నుడికారాన్ని పాదటీపులో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా, సాధారణ పాఠకులకు సులభంగా ఉండే నిర్మాణం. ‘అక్కడి ప్రజలు’ అనేది ἐντόπιοιకు సహజమైన రూపం. పాదటీపు గుర్తు [a] ప్రధాన వచనంలో చేర్చబడింది.
