id: ACT.21.6
reference: Acts 21:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ἀπησπασάμεθα ἀλλήλους, καὶ⸃ ⸀ἐνέβημεν εἰς τὸ πλοῖον, ἐκεῖνοι δὲ ὑπέστρεψαν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/006.yaml
  text: After we had said farewell to one another[a], we boarded the ship[b], and they returned to their own homes.
translation:
  language: te
  text: మేము ఒకరికొకరం వీడ్కోలు చెప్పుకొని[a], ఓడ ఎక్కాము; వారు తమ ఇళ్లకు[b] తిరిగి వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒకరి దగ్గర ఒకరు సెలవు తీసుకొని.’ గ్రీకు వ్యక్తీకరణ పలకరించడాన్నీ విడిపోతూ సెలవు తీసుకోవడాన్నీ సూచించగలదు; ఇక్కడి ప్రయాణ సందర్భం వీడ్కోలు భావానికి అనుకూలంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘తమ సొంత వాటికి/స్థలాలకు.’ ఈ గ్రీకు నుడికారం ‘తమ ఇళ్లకు’ లేదా ‘తమ సొంత స్థలానికి’ అనే అర్థాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπησπασάμεθα ἀλλήλους
  choice: ఒకరికొకరం వీడ్కోలు చెప్పుకొని
  rationale: ఈ క్రియ పలకరించడాన్నీ వీడ్కోలు తీసుకోవడాన్నీ సూచించగలదు. అయితే ఇక్కడ విడిపోతున్న సందర్భం ఉన్నందున ‘వీడ్కోలు చెప్పుకొని’ సహజమైన అర్థాన్ని వ్యక్తం చేస్తుంది; ἀλλήλους లోని పరస్పర భావాన్ని ‘ఒకరికొకరం’ నిలుపుతుంది.
- source_word: ἐνέβημεν
  choice: ఎక్కాము
  rationale: ఓడలోకి వెళ్లడం లేదా ఓడ ఎక్కడాన్ని సూచించే ఈ క్రియకు తెలుగులో ‘ఓడ ఎక్కాము’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: πλοῖον
  choice: ఓడ
  rationale: ఈ పదం పడవ లేదా ఓడను సూచించగలదు. అపొస్తలుల కార్యములలోని సముద్ర ప్రయాణ సందర్భానికి ‘ఓడ’ తగిన సాధారణ పదం.
- source_word: ὑπέστρεψαν
  choice: తిరిగి వెళ్లారు
  rationale: వారు వచ్చిన చోటుకు వెనక్కి వెళ్లారనే సరళమైన కథన కదలికను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: εἰς τὰ ἴδια
  choice: తమ ఇళ్లకు
  rationale: అక్షరార్థంగా ‘తమ సొంత వాటికి/స్థలాలకు’ అనే ఈ గ్రీకు నుడికారం సందర్భంలో తమ నివాసాలకు తిరిగి వెళ్లడాన్ని సూచిస్తుంది. ‘తమ ఇళ్లకు’ ఆ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
