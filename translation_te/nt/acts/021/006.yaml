translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని పరస్పర చర్యను, ప్రయాణ క్రమాన్ని నిలుపుతూ నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తం చేశాము.
