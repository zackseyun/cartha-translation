id: ACT.21.13
reference: Acts 21:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂τότε ἀπεκρίθη⸃ ὁ Παῦλος· Τί ποιεῖτε κλαίοντες καὶ συνθρύπτοντές μου τὴν καρδίαν; ἐγὼ γὰρ οὐ μόνον δεθῆναι ἀλλὰ καὶ ἀποθανεῖν εἰς Ἰερουσαλὴμ ἑτοίμως ἔχω ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/013.yaml
  text: Then Paul answered[a], “What are you doing[b], weeping and breaking my heart? For I am ready not only to be bound but even to die in Jerusalem for the name of the Lord Jesus.”
translation:
  language: te
  text: 'అప్పుడు పౌలు ఇలా జవాబిచ్చాడు: “మీరు ఏడుస్తూ నా హృదయాన్ని ముక్కలు చేస్తూ[a] ఏమి చేస్తున్నారు? ప్రభువైన యేసు నామం కోసం[b] యెరూషలేములో బంధించబడడానికి మాత్రమే కాదు, చనిపోవడానికి కూడా నేను సిద్ధంగా ఉన్నాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా హృదయాన్ని నలిపివేస్తూ.” గ్రీకు క్రియ సాధారణమైన మనోవేదనకంటే బలమైనది; అది అంతరంగం పగిలిపోవడం లేదా నలిగిపోవడం అనే చిత్రాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే “ప్రభువైన యేసు నామం నిమిత్తం.” బైబిలులో “నామం” అనేది యేసునే కాక ఆయన అధికారాన్ని, ఆయనతో గుర్తింపబడిన కార్యాన్ని కూడా సూచించే విధంగా వాడబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε ἀπεκρίθη ὁ Παῦλος
  choice: అప్పుడు పౌలు ఇలా జవాబిచ్చాడు
  rationale: కథన క్రమాన్ని తెలిపే τότεను ‘అప్పుడు’గా, సాధారణ సంభాషణ క్రియ ἀπεκρίθηను సహజమైన ఆధునిక తెలుగులో ‘జవాబిచ్చాడు’గా అందించింది.
- source_word: Τί ποιεῖτε
  choice: ఇలా చేస్తున్నదేమిటి?
  rationale: గ్రీకు ప్రశ్నలోని ప్రత్యక్షమైన భావోద్వేగ నిరసనను కాపాడుతూ, వెంట వచ్చే క్రియలను తెలుగులో సహజంగా ప్రశ్నతో అనుసంధానిస్తుంది.
- source_word: κλαίοντες
  choice: ఏడుస్తూ
  rationale: వర్తమాన కృదంత భావాన్ని, సందర్భంలోని దుఃఖ తీవ్రతను సరళంగా నిలుపుతుంది.
- source_word: συνθρύπτοντές μου τὴν καρδίαν
  choice: నా హృదయాన్ని ముక్కలు చేస్తూ
  rationale: συνθρύπτωలోని నలిపివేయడం లేదా పగులగొట్టడం అనే బలమైన రూపకాన్ని ‘బాధపెట్టడం’గా బలహీనపరచకుండా, తెలుగులో అర్థమయ్యే భావోద్వేగ రూపకంగా అందిస్తుంది.
- source_word: δεθῆναι
  choice: బంధించబడడానికి
  rationale: δέω యొక్క కర్మణి భావాన్ని కాపాడుతుంది; ‘చెరసాలలో వేయబడడానికి’ అని అనువదించడం సందర్భానుగుణమైనా మూలపదం కంటే వివరణాత్మకంగా ఉంటుంది.
- source_word: ἀποθανεῖν
  choice: చనిపోవడానికి
  rationale: సూటిగా, సాధారణ ఆధునిక తెలుగులో మరణాన్ని సూచిస్తుంది.
- source_word: εἰς Ἰερουσαλήμ
  choice: యెరూషలేములో
  rationale: ఇక్కడ పౌలు సిద్ధంగా ఉన్న బంధనం, మరణం సంభవించే స్థలాన్ని తెలుగులో సహజంగా సూచిస్తుంది; ‘యెరూషలేముకు’ అని యాంత్రికంగా అనువదిస్తే గమ్యస్థానం మాత్రమే ప్రధానమయ్యే అవకాశం ఉంది.
- source_word: ἑτοίμως ἔχω
  choice: నేను సిద్ధంగా ఉన్నాను
  rationale: సిద్ధస్థితిలో ఉండడాన్ని సూచించే గ్రీకు నుడికారానికి సహజమైన తెలుగు సమానం.
- source_word: ὑπὲρ τοῦ ὀνόματος
  choice: నామం కోసం
  rationale: యేసు వ్యక్తిత్వం, అధికారం, ఆయనతో ముడిపడిన కార్యాన్ని సూచించే బైబిలు నుడికారమైన ‘నామం’ను వివరణలో కలిపివేయకుండా నిలుపుతుంది.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: ప్రభువైన యేసు
  rationale: κύριοςను క్రీస్తును సూచించే బిరుదుగా ‘ప్రభువు’ అని అనువదిస్తూ, తెలుగులో సహజమైన సంబంధ నిర్మాణాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: యేసును సూచించే κύριος అనువాదం
  choice: ప్రభువైన యేసు
  alternative: యజమానియైన యేసు
  rationale: ఈ సందర్భంలో κύριος క్రీస్తు బిరుదు; ‘ప్రభువు’ దాని గౌరవ, అధికార భావాన్ని నిలుపుతుంది, బలహీనమైన వివరణాత్మక పదంతో భర్తీ చేయదు.
- issue: ‘నామం’ అనే బైబిలు నుడికారాన్ని నిలుపడం
  choice: ప్రభువైన యేసు నామం కోసం
  alternative: ప్రభువైన యేసు కోసం
  rationale: మూలపాఠం యేసు కోసం అని మాత్రమే కాక ఆయన ‘నామం’ కోసం బాధపడటాన్ని చెబుతుంది. వ్యక్తి, అధికారం, ఆయనతో గుర్తింపబడిన కార్యం వంటి భావ విస్తృతిని ముందుగానే ఒకే వివరణకు పరిమితం చేయకుండా నుడికారాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘హృదయాన్ని ముక్కలు చేస్తూ’ అనే రూపకం మూలంలోని భావోద్వేగ తీవ్రతను నిలుపుతుంది; ‘నామం’ అనే ధార్మికంగా ప్రాముఖ్యమైన బైబిలు నుడికారం ప్రధాన పాఠ్యంలోనే ఉంచబడింది.
