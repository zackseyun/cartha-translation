id: ACT.21.21
reference: Acts 21:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κατηχήθησαν δὲ περὶ σοῦ ὅτι ἀποστασίαν διδάσκεις ἀπὸ Μωϋσέως τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους, λέγων μὴ περιτέμνειν αὐτοὺς τὰ τέκνα μηδὲ τοῖς ἔθεσιν περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/021.yaml
  text: But they have been informed about you that you are teaching all the Jews among the Gentiles to forsake Moses[c][b][a], telling them not to circumcise their children nor to walk according to the customs.
translation:
  language: te
  text: అయితే, అన్యజనుల మధ్య నివసిస్తున్న యూదులందరికీ మోషేను విడిచిపెట్టమని నువ్వు బోధిస్తున్నావనీ[a], తమ పిల్లలకు సున్నతి చేయించవద్దనీ, ఆచారాల ప్రకారం నడుచుకోవద్దనీ[b] చెబుతున్నావనీ నీ గురించి వారికి తెలియజేయబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మోషే నుండి దూరమవడాన్ని నువ్వు బోధిస్తున్నావని.” గ్రీకులోని ἀποστασία అనే నామవాచకం విడిచిపెట్టడం లేదా దూరమవడం అనే అర్థాన్ని ఇస్తుంది. ఇక్కడ “మోషే” అనేది మోషే ధర్మశాస్త్రాన్నీ, పూర్వీకుల యూద ఆచారాలనూ సూచిస్తుంది.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: లేదా, “ఆచారాల ప్రకారం జీవించవద్దనీ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηχήθησαν
  choice: సమాచారం అందింది
  rationale: ఇక్కడ కర్తరి కాని రూపం పౌలు గురించి వారికి మౌఖికంగా తెలియజేయబడిన నివేదికను సూచిస్తుంది. ‘సమాచారం అందింది’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἀποστασίαν ... ἀπὸ Μωϋσέως
  choice: మోషేను విడిచిపెట్టాలని
  rationale: ἀποστασία అనేది విడిచిపెట్టడం లేదా దూరమవడం అనే భావాన్ని ఇస్తుంది. ‘మోషేను విడిచిపెట్టడం’ అనే ప్రయోగం ఆరోపణ బలాన్ని నిలుపుతూ, ‘మోషే’ అనే మూలపాఠంలోని రూపకప్రయోగాన్ని విస్తరించకుండా ఉంచుతుంది.
- source_word: τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους
  choice: అన్యజనుల మధ్య నివసిస్తున్న యూదులందరూ
  rationale: ఈ పదబంధం ఇతర జనాల మధ్య చెదరిపోయి నివసిస్తున్న యూదులను సూచిస్తుంది. ‘నివసిస్తున్న’ అని చేర్చడం తెలుగులో సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: λέγων
  choice: చెబుతున్నావని
  rationale: ఈ అసమాపక క్రియ ఆరోపించబడిన బోధలోని విషయం లేదా విధానాన్ని వివరిస్తుంది; తెలుగులో ‘చెబుతున్నావని’ సహజంగా అనుసంధానిస్తుంది.
- source_word: μὴ περιτέμνειν αὐτοὺς τὰ τέκνα
  choice: తమ పిల్లలకు సున్నతి చేయించవద్దని
  rationale: గ్రీకు వాక్యంలో ‘పిల్లలు’ అనే విస్తృత పదమే ఉంది. తెలుగు వాడుకలో తల్లిదండ్రుల చర్యను సహజంగా తెలియజేయడానికి ‘సున్నతి చేయించవద్దని’ అని అనువదించబడింది.
- source_word: μηδὲ τοῖς ἔθεσιν περιπατεῖν
  choice: ఆచారాల ప్రకారం నడుచుకోవద్దని
  rationale: περιπατεῖν లోని ‘నడుచుకోవడం’ అనే రూపకాన్ని నిలుపుతూ, జీవన ప్రవర్తనను సూచించే సహజ తెలుగు ప్రయోగాన్ని ఉపయోగిస్తుంది. ἔθεσιν వారసత్వంగా వచ్చిన యూదుల ఆచారాలను సూచిస్తుంది.
theological_decisions:
- issue: మోషే ధర్మశాస్త్రం విషయంలో పౌలుపై వచ్చిన ఆరోపణ స్వభావం
  choice: ‘మోషేను విడిచిపెట్టాలని ... బోధిస్తున్నావు’ అనే ఆరోపణగా అనువదించడం
  alternative: ‘మోషే నుండి మతభ్రష్టత్వాన్ని బోధిస్తున్నావు’ లేదా ‘మోషే ధర్మశాస్త్రాన్ని విడిచిపెట్టాలని బోధిస్తున్నావు’
  rationale: ఇది పౌలు గురించి ఇతరులు విన్న ఆరోపణను నివేదిస్తుంది; దాని నిజానిజాలపై వచనం తీర్పు చెప్పదు. కాబట్టి ఆరోపణ బలాన్ని ఉంచుతూ, ‘మోషే’ను ప్రధాన పాఠంలో ‘ధర్మశాస్త్రం’గా విస్తరించి సిద్ధాంతపరమైన నిర్ణయం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం ఉపయోగించబడింది. సందర్భంలో యాకోబు పౌలుతో ఏకవచన సన్నిహిత సంబోధనలో మాట్లాడుతున్నందున ‘నువ్వు’ రూపం వాడబడింది. మూలంలోని ‘నడుచుకోవడం’ రూపకం ప్రధాన పాఠంలో నిలుపబడింది.
