revisions:
- from: అయితే విశ్వసించిన అన్యజనుల విషయానికొస్తే, వారు విగ్రహాలకు అర్పించిన వాటికి, రక్తానికి, గొంతు నులిమి చంపినదానికి, లైంగిక దుర్నీతికి దూరంగా ఉండాలని నిర్ణయించి, మేము వారికి వర్తమానం పంపాము.[a]
  to: అయితే విశ్వసించిన అన్యజనుల విషయానికొస్తే, వారు విగ్రహాలకు బలిగా అర్పించిన వాటి నుండి, రక్తం నుండి, గొంతు నులిమి చంపిన వాటి నుండి, లైంగిక దుర్నీతి నుండి దూరంగా ఉండాలని నిర్ణయించి, మేము వర్తమానం పంపాము.[a]
  rationale: The revision removes an unstated recipient, strengthens the sacrificial sense of εἰδωλόθυτον, and changes the list to ‘నుండి’ construction for natural Telugu parallelism. It preserves the source’s ambiguity concerning the implicit object of ‘sent’ and does not interpret the decree’s theological scope.
