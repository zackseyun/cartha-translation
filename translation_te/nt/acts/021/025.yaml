id: ACT.21.25
reference: Acts 21:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: περὶ δὲ τῶν πεπιστευκότων ἐθνῶν ἡμεῖς ⸀ἀπεστείλαμεν ⸀κρίναντες φυλάσσεσθαι αὐτοὺς τό τε εἰδωλόθυτον ⸀καὶ αἷμα καὶ πνικτὸν καὶ πορνείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/025.yaml
  text: But concerning the Gentiles who have believed[a], we sent word, having decided that they should keep themselves from what is sacrificed to idols, and from blood, and from what is strangled[c][b], and from sexual immorality.
translation:
  language: te
  text: అయితే విశ్వసించిన అన్యజనుల విషయానికొస్తే, వారు విగ్రహాలకు బలిగా అర్పించిన వాటి నుండి, రక్తం నుండి, గొంతు నులిమి చంపిన వాటి నుండి, లైంగిక దుర్నీతి నుండి దూరంగా ఉండాలని నిర్ణయించి, మేము వర్తమానం పంపాము.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పంపాము.” గ్రీకులో ‘పంపాము’ అనే క్రియకు కర్మ వ్యక్తంగా లేదు; సందర్భం అపొస్తలుల కార్యాలు 15లో పంపిన లేఖ లేదా తీర్మానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ
  choice: అయితే … విషయానికొస్తే
  rationale: περίతో కూడిన షష్ఠీ విభక్తి చర్చావిషయాన్ని సూచిస్తుంది; δέ ముందటి విషయంనుంచి స్వల్ప మార్పు లేదా వ్యత్యాసాన్ని తెలియజేస్తుంది.
- source_word: τῶν πεπιστευκότων ἐθνῶν
  choice: విశ్వసించిన అన్యజనులు
  rationale: పరిపూర్ణ కృదంతం విశ్వాసంలోకి వచ్చి ఆ స్థితిలో కొనసాగుతున్నవారిని సూచిస్తుంది; సందర్భంలో ἔθνη అంటే అన్యజనులు.
- source_word: ἡμεῖς ἀπεστείλαμεν
  choice: మేము వారికి వర్తమానం పంపాము
  rationale: స్పష్టంగా ఉన్న ἡμεῖς ‘మేము’ అనే కర్తకు స్వల్ప ఉద్ఘాటన ఇస్తుంది. ἀπεστείλαμενకు కర్మ గ్రీకులో వ్యక్తంగా లేదు; అపొస్తలుల కార్యాలు 15లోని లేఖ/తీర్మానాన్ని సందర్భం సూచిస్తుంది కాబట్టి ‘వర్తమానం పంపాము’ అని, ‘లేఖ’ను ప్రధాన పాఠ్యంలో చేర్చకుండా అనువదించాం.
- source_word: κρίναντες
  choice: నిర్ణయించి
  rationale: ఈ భూతకాల కృదంతం పంపడానికి ముందే తీసుకున్న అధికారిక నిర్ణయాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: φυλάσσεσθαι αὐτοὺς
  choice: వారు … దూరంగా ఉండాలని
  rationale: మధ్యమ ప్రయోగంలోని తనను తాను కాపాడుకొను/విరమించు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τό τε εἰδωλόθυτον
  choice: విగ్రహాలకు అర్పించిన వాటికి
  rationale: విగ్రహబలితో సంబంధమున్న ఆహారం లేదా మాంసాన్ని సూచించినా, గ్రీకు పదం చెప్పిన దానికంటే ప్రధాన పాఠ్యాన్ని అనవసరంగా సంకుచితం చేయకుండా ‘అర్పించిన వాటికి’ అని ఉంచాం.
- source_word: αἷμα
  choice: రక్తానికి
  rationale: గ్రీకులోని సంక్షిప్త పదప్రయోగాన్ని అలాగే నిలుపుతుంది; సందర్భంలో రక్తాన్ని భుజించడం ఉద్దేశమైనప్పటికీ దానిని ప్రధాన పాఠ్యంలో విస్తరించలేదు.
- source_word: πνικτόν
  choice: గొంతు నులిమి చంపినదానికి
  rationale: రక్తం పూర్తిగా బయటకు పోకుండా ఊపిరాడనీయక చంపబడిన జంతువును సూచించే పదాన్ని స్పష్టంగా, సహజంగా తెలుగులో అందిస్తుంది.
- source_word: πορνείαν
  choice: లైంగిక దుర్నీతికి
  rationale: πορνεία సూచించే అక్రమ లైంగిక ప్రవర్తన యొక్క విస్తృత అర్థాన్ని ఆధునిక, గౌరవప్రదమైన భాషలో తెలియజేస్తుంది.
theological_decisions:
- issue: అపొస్తలుల తీర్మానంలోని నాలుగు నిషేధాల స్వభావం
  choice: నాలుగు అంశాలను వాటి వ్యవధి లేదా సిద్ధాంతపరమైన వర్గీకరణను నిర్ణయించకుండా నేరుగా అనువదించడం
  alternative: వాటిని కేవలం తాత్కాలిక సహపంక్తి నియమాలుగా గానీ, శాశ్వత విశ్వవ్యాప్త నైతిక ధర్మంగా గానీ వ్యాఖ్యానించడం
  rationale: ఈ వచనం పూర్వపు అపొస్తలుల నిర్ణయాన్ని నివేదిస్తుంది గాని ప్రతి నిషేధపు పూర్తి కారణాన్ని లేదా కాలపరిమితిని వివరించదు; అందువల్ల అనువాదం ఆ ఉద్రిక్తతను అలాగే ఉంచుతుంది.
- issue: ἀπεστείλαμενలో అంతర్లీన కర్మ
  choice: ప్రధాన పాఠ్యంలో ‘వర్తమానం పంపాము’; సందర్భసూచిత ‘లేఖ/తీర్మానం’ను పాదసూచికలో పేర్కొనడం
  alternative: ‘లేఖ పంపాము’ అని ప్రధాన పాఠ్యంలో స్పష్టీకరించడం
  rationale: అపొస్తలుల కార్యాలు 15 సందర్భం లేఖను సూచించినా, ఈ వచనంలోని గ్రీకు క్రియ కర్మను వ్యక్తంగా చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన శైలి. జాబితా యొక్క సమాంతర నిర్మాణాన్ని నిలిపి, మూలంలో వ్యక్తంగా లేని ‘లేఖ’ను ప్రధాన పాఠ్యంలో చేర్చలేదు.
