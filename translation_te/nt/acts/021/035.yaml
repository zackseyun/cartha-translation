- from: అతడు మెట్ల దగ్గరికి వచ్చినప్పుడు[a], జనసమూహం హింసాత్మకంగా దూసుకొస్తుండడం వల్ల సైనికులు అతణ్ణి మోసుకెళ్లవలసి వచ్చింది[b].
  to: అతడు మెట్లపైకి చేరినప్పుడు[b], జనసమూహం హింస వల్ల సైనికులు అతణ్ణి మోసుకెళ్లవలసి వచ్చింది[a].
  rationale: The revision removes the unsupported detail that the crowd was rushing forward and renders the causal phrase directly as “జనసమూహం హింస వల్ల.” It also uses “మెట్లపైకి చేరినప్పుడు” for the arrival expression and relocates both footnote markers so that each is attached to the phrase it explains.
