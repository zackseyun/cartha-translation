translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి వాడబడింది. గ్రీకు కర్మణి నిర్మాణాన్ని తెలుగులో సహజమైన కర్తరి నిర్మాణంగా వ్యక్తం చేశారు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
