id: ACT.21.35
reference: Acts 21:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐγένετο ἐπὶ τοὺς ἀναβαθμούς, συνέβη βαστάζεσθαι αὐτὸν ὑπὸ τῶν στρατιωτῶν διὰ τὴν βίαν τοῦ ὄχλου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/035.yaml
  text: When he came to the steps[a], it happened that he was being carried by the soldiers because of the violence of the crowd[b],
translation:
  language: te
  text: అతడు మెట్లపైకి చేరినప్పుడు[b], జనసమూహం హింస వల్ల సైనికులు అతణ్ణి మోసుకెళ్లవలసి వచ్చింది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సైనికులు అతణ్ణి మోసుకెళ్తున్నారు.” గ్రీకు క్రియారూపం మోసుకెళ్లే ప్రక్రియను నేరుగా సూచిస్తుంది; సందర్భం అది అనివార్యమైన పరిస్థితి అని తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “మెట్లు” అనగా రోమా సైనిక శిబిరానికి పైకి వెళ్లే మెట్లదారి కావచ్చు (అపొస్తలుల కార్యాలు 21:34, 37 చూడండి).
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: వచ్చినప్పుడు
  rationale: ὅτε కాలసంబంధ ఉపవాక్యాన్ని పరిచయం చేస్తుంది; δέ ఇక్కడ స్వల్ప అనుసంధానార్థకం కావడంతో తెలుగులో ప్రత్యేకంగా అనువదించకపోవడం సహజం.
- source_word: ἐγένετο ἐπὶ τοὺς ἀναβαθμούς
  choice: మెట్ల దగ్గరికి వచ్చినప్పుడు
  rationale: γίνομαι + ἐπί (ద్వితీయా విభక్తి) ఇక్కడ ఒక స్థలానికి చేరడాన్ని సూచించే నుడికారం. తెలుగు వాక్యనిర్మాణంలో కాలసంబంధంగా సహజంగా వ్యక్తమైంది.
- source_word: ἀναβαθμούς
  choice: మెట్లు
  rationale: ఈ పదం పైకి వెళ్లే మెట్లను లేదా మెట్ల వరుసను సూచిస్తుంది; సందర్భంలో సైనిక శిబిరానికి వెళ్లే మెట్లు ఉద్దేశించబడ్డాయి.
- source_word: συνέβη βαστάζεσθαι
  choice: మోసుకెళ్లవలసి వచ్చింది
  rationale: συνέβη ఫలితంగా ఏర్పడిన పరిస్థితిని పరిచయం చేస్తుంది; βαστάζεσθαι వర్తమాన కర్మణి క్రియార్థకం. జనసమూహపు హింస కారణంగా ఏర్పడిన అనివార్యతను సహజ తెలుగులో ఈ రూపం స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὑπὸ τῶν στρατιωτῶν
  choice: సైనికులు అతణ్ణి
  rationale: గ్రీకు కర్మణి ప్రయోగంలోని కర్తృకారకాన్ని తెలుగులో సహజమైన కర్తరి నిర్మాణంగా మార్చినా, సైనికులే అతణ్ణి మోశారనే అర్థం యథాతథంగా ఉంది.
- source_word: διὰ τὴν βίαν τοῦ ὄχλου
  choice: జనసమూహం హింసాత్మకంగా దూసుకొస్తుండడం వల్ల
  rationale: διά + ద్వితీయా విభక్తి కారణాన్ని సూచిస్తుంది. βία బలప్రయోగం లేదా హింసను సూచిస్తుంది; సందర్భంలో జనసమూహం చేస్తున్న దాడి ఒత్తిడిని సహజ తెలుగులో క్రియాత్మకంగా వ్యక్తం చేసింది.
