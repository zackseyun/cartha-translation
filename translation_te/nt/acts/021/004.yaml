id: ACT.21.4
reference: Acts 21:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ἀνευρόντες δὲ τοὺς⸃ μαθητὰς ἐπεμείναμεν αὐτοῦ ἡμέρας ἑπτά, οἵτινες τῷ Παύλῳ ἔλεγον διὰ τοῦ πνεύματος μὴ ⸀ἐπιβαίνειν εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/004.yaml
  text: After finding the disciples[a], we stayed there seven days. They kept telling Paul through the Spirit not to go up to Jerusalem.
translation:
  language: te
  text: అక్కడి శిష్యులను వెదకి కనుగొన్న తర్వాత, మేము అక్కడ ఏడు రోజులు ఉన్నాం. వారు ఆత్మ ద్వారా[a] పౌలుకు యెరూషలేముకు వెళ్లవద్దని పదేపదే చెప్పారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆత్మచేత.’ పౌలుకు రాబోయే శ్రమలను ఆత్మ వెల్లడించగా, వాటినిబట్టి శిష్యులు అతడు యెరూషలేముకు వెళ్లకూడదని నిర్ణయించి ఉండవచ్చు.
    reason: ‘ఆత్మ ద్వారా’ అనే పదబంధం ఆత్మ ఇచ్చిన ప్రత్యక్ష నిషేధాన్ని సూచిస్తుందా, లేక ఆత్మ వెల్లడించిన సంగతుల ఆధారంగా శిష్యులు చేసిన విజ్ఞప్తిని సూచిస్తుందా అనే నిజమైన వ్యాఖ్యాన భేదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: ἀνευρόντες
  choice: వెదకి కనుగొన్న తర్వాత
  rationale: ఈ భూతకాల అసమాపక క్రియ ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచిస్తుంది. ‘వెదకి కనుగొన్న తర్వాత’ అనేది అన్వేషించి కనుగొన్న భావాన్నీ, సంఘటనల క్రమాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: μαθητάς
  choice: శిష్యులను
  rationale: అపొస్తలుల కార్యములలో μαθητής అనే పదానికి స్థిరమైన, మూలార్థానికి దగ్గరైన తెలుగు పదం ‘శిష్యులు’; విస్తృతార్థమున్న ‘విశ్వాసులు’ అని మార్చలేదు.
- source_word: ἐπεμείναμεν αὐτοῦ
  choice: మేము అక్కడ ... ఉన్నాం
  rationale: ἐπιμένω ఇక్కడ ఒక చోట ఉండిపోవడం లేదా బసచేయడం అనే అర్థంలో ఉంది; αὐτοῦ స్థలాన్ని సూచిస్తూ ‘అక్కడ’ అని సహజంగా అనువదించబడింది.
- source_word: ἡμέρας ἑπτά
  choice: ఏడు రోజులు
  rationale: ఇది కాలవ్యవధిని సూచించే ద్వితీయా విభక్తి ప్రయోగం; తెలుగులో ‘ఏడు రోజులు’ అని చెప్పడం సహజంగా వ్యవధిని తెలియజేస్తుంది.
- source_word: οἵτινες
  choice: వారు
  rationale: ఇది ముందున్న శిష్యులను తిరిగి సూచిస్తుంది. తెలుగులో కొత్త వాక్యాన్ని ‘వారు’తో ప్రారంభించడం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: ἔλεγον
  choice: పదేపదే చెప్పారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగిన లేదా పునరావృతమైన మాటను సూచించగలదు; ‘పదేపదే చెప్పారు’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: διὰ τοῦ πνεύματος
  choice: ఆత్మ ద్వారా
  rationale: διά + షష్ఠీ విభక్తి ఇక్కడ సాధనం లేదా మధ్యవర్తిత్వాన్ని సూచిస్తుంది. గ్రీకులో ‘పరిశుద్ధ’ అనే విశేషణం లేకపోవడంతో దానిని ప్రధాన పాఠ్యంలో చేర్చకుండా, అపొస్తలుల కార్యముల సందర్భానికి తగిన ‘ఆత్మ’ను వాడాం.
- source_word: μὴ ἐπιβαίνειν
  choice: వెళ్లవద్దని
  rationale: ἐπιβαίνω అక్షరార్థంగా ఎక్కడం లేదా అడుగుపెట్టడం అని అర్థమివ్వగలిగినా, గమ్యస్థానాన్ని సూచించే ఈ ప్రయాణ సందర్భంలో ‘వెళ్లడం’ సహజమైన భావం. తెలుగులో ‘పైకి వెళ్లడం’ అనడం అసహజంగా ఉండేందున దిశార్థాన్ని బలవంతంగా చేర్చలేదు.
- source_word: εἰς Ἱεροσόλυμα
  choice: యెరూషలేముకు
  rationale: εἰς ఇక్కడ ప్రయాణ గమ్యాన్ని సూచిస్తుంది; దానికి సహజమైన తెలుగు రూపం ‘యెరూషలేముకు’.
theological_decisions:
- issue: పౌలు యెరూషలేముకు వెళ్లడంలో διὰ τοῦ πνεύματος అనే మాట పాత్ర
  choice: ఆత్మ ద్వారా
  alternative: ఆత్మ ప్రేరణతో
  rationale: శిష్యులు ఆత్మ ద్వారా మాట్లాడారని వాక్యం చెబుతుంది. ఆత్మ స్వయంగా వెళ్లవద్దని నిషేధించాడా, లేక రాబోయే శ్రమలను ఆత్మ వెల్లడించగా శిష్యులు వెళ్లవద్దనే నిర్ణయానికి వచ్చారా అనే ఉద్రిక్తతను అనువాదం తీర్చివేయదు; అపొస్తలుల కార్యములు 19:21; 20:22-23తో ఉన్న భావసంబంధాన్ని తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘పదేపదే చెప్పారు’ ద్వారా కొనసాగిన హెచ్చరికను సహజంగా వ్యక్తం చేశాం; ‘యెరూషలేముకు పైకి వెళ్లడం’ వంటి అసహజమైన పదక్షర నిర్మాణాన్ని నివారించాం.
