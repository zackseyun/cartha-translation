revisions:
- from: అక్కడి శిష్యులను వెదకి కనుగొన్న తర్వాత, మేము అక్కడ ఏడు రోజులు ఉన్నాం. వారు ఆత్మ ద్వారా[a] పౌలుతో, యెరూషలేముకు వెళ్లవద్దని పదేపదే చెప్పారు.
