translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘పటాలపు అధిపతి’ ద్వారా అతి సాంకేతిక పదజాలాన్ని నివారించి, చారిత్రక వివరాన్ని పాదసూచికలో ఉంచాం. ప్రతి పాదసూచిక సూచిక ప్రధాన వచనంలో చేర్చబడింది.
