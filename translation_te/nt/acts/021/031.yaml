id: ACT.21.31
reference: Acts 21:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ζητούντων ⸀τε αὐτὸν ἀποκτεῖναι ἀνέβη φάσις τῷ χιλιάρχῳ τῆς σπείρης ὅτι ὅλη ⸀συγχύννεται Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/031.yaml
  text: And as they were seeking to kill him[b][a], a report went up to the commander of the cohort that all Jerusalem was in an uproar.
translation:
  language: te
  text: వారు అతన్ని చంపడానికి ప్రయత్నిస్తుండగా, యెరూషలేమంతా అల్లకల్లోలంగా ఉందని[a] పటాలపు అధిపతికి[b] సమాచారం అందింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గందరగోళంలో ఉంది” లేదా “కల్లోలంగా ఉంది.”
    reason: lexical_alternative
  - marker: b
    text: “పటాలపు అధిపతి” అంటే అక్కడ మోహరించిన రోమా సైనిక విభాగానికి నాయకత్వం వహించే ఉన్నత సైనిక అధికారి.
    reason: cultural_note
lexical_decisions:
- source_word: ζητούντων τε αὐτὸν ἀποκτεῖναι
  choice: వారు అతన్ని చంపడానికి ప్రయత్నిస్తుండగా
  rationale: వర్తమాన కృదంతంతో ఉన్న genitive absolute, ప్రధాన క్రియ జరుగుతున్న సమయంలోనే కొనసాగుతున్న ప్రయత్నాన్ని సూచిస్తుంది. ‘ప్రయత్నిస్తుండగా’ సహజమైన ఆధునిక తెలుగులో ఈ కొనసాగుతున్న చర్యను తెలియజేస్తుంది.
- source_word: ἀνέβη φάσις
  choice: సమాచారం అందింది
  rationale: గ్రీకులో అక్షరార్థంగా ‘సమాచారం పైకి వెళ్లింది’ అనే దిశా రూపకం ఉంది; సందర్భంలో అది కోటలోని అధిపతికి వార్త చేరడాన్ని సూచిస్తుంది. తెలుగులో ‘సమాచారం అందింది’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: τῷ χιλιάρχῳ τῆς σπείρης
  choice: పటాలపు అధిపతికి
  rationale: χιλίαρχος ఒక రోమా సైనిక అధికారి; σπεῖρα అతని ఆధీనంలోని సైనిక విభాగం. ‘పటాలపు అధిపతి’ సాధారణ పాఠకునికి అర్థమయ్యేలా హోదా మరియు విభాగ సంబంధాన్ని తెలియజేస్తుంది; చారిత్రక వివరణను పాదసూచికలో ఇస్తుంది.
- source_word: ὅτι ὅλη Ἰερουσαλήμ
  choice: యెరూషలేమంతా
  rationale: నగరాన్నీ దాని ప్రజలనూ సమష్టిగా సూచించే గ్రీకు సంక్షిప్త ప్రయోగాన్ని సహజమైన తెలుగు సమాస రూపంలో నిలుపుతుంది.
- source_word: συγχύννεται
  choice: అల్లకల్లోలంగా ఉంది
  rationale: ఈ వర్తమాన కర్మణి రూపం నగరం గందరగోళం లేదా కల్లోలం చెందుతున్న స్థితిని సూచిస్తుంది. ‘అల్లకల్లోలంగా ఉంది’ ప్రజా కలవరాన్ని సహజంగా వ్యక్తం చేస్తూ, గందరగోళం అనే భావాన్నీ కలిగి ఉంటుంది.
