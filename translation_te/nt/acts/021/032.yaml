translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. రోమా సైనిక హోదాల్లో ‘శతాధిపతులు’ అనే స్థిర పదాన్ని ఉంచి, χιλίαρχος కోసం పాఠకులకు సులభమైన ‘సైన్యాధికారి’ని ప్రధాన పాఠ్యంలో వాడి చారిత్రక వివరాన్ని పాదసూచికలో ఇచ్చాం.
