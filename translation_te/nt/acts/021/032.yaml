id: ACT.21.32
reference: Acts 21:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς ἐξαυτῆς παραλαβὼν στρατιώτας καὶ ἑκατοντάρχας κατέδραμεν ἐπ’ αὐτούς, οἱ δὲ ἰδόντες τὸν χιλίαρχον καὶ τοὺς στρατιώτας ἐπαύσαντο τύπτοντες τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/032.yaml
  text: He immediately took soldiers and centurions and ran down to them[a], and when they saw the tribune and the soldiers, they stopped beating Paul.
translation:
  language: te
  text: అతడు వెంటనే సైనికులను, శతాధిపతులను వెంటబెట్టుకొని వారి దగ్గరికి పరుగెత్తి దిగివచ్చాడు. వారు సైన్యాధికారిని[a], సైనికులను చూసి పౌలును కొట్టడం ఆపేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదం χιλίαρχος. దీనిని ‘సైనిక ట్రిబ్యూన్’ లేదా ‘సహస్రాధిపతి’ అని కూడా అనువదించవచ్చు; ఇతడు ఒక రోమా సైనిక దళానికి అధిపతి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: వెంటనే
  rationale: ఈ క్రియావిశేషణం చర్య ఏ ఆలస్యమూ లేకుండా జరిగిందని సూచిస్తుంది; ‘వెంటనే’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ ఆవశ్యకతను నిలుపుతుంది.
- source_word: παραλαβὼν
  choice: వెంటబెట్టుకొని
  rationale: అధికారి సైనికులను తనతో తీసుకొని వెళ్లాడనే భావాన్ని తెలుగు వాక్యంలో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: στρατιώτας
  choice: సైనికులను
  rationale: ఇది వ్యక్తిగత సైనికులను సూచించే సాధారణ, సూటియైన సమానార్థకం.
- source_word: ἑκατοντάρχας
  choice: శతాధిపతులను
  rationale: రోమా సైన్యంలోని centurion పదవిని సూచించే స్థిరమైన తెలుగు చారిత్రక-బైబిలు పదం.
- source_word: κατέδραμεν ἐπ’ αὐτούς
  choice: వారి దగ్గరికి పరుగెత్తి దిగివచ్చాడు
  rationale: క్రియలోని వేగాన్ని, కోట ప్రాంతం నుంచి కిందికి వచ్చిన సందర్భోచిత దిశను రెండింటినీ నిలుపుతుంది; శత్రుత్వాన్ని అవసరానికి మించి సూచించదు.
- source_word: χιλίαρχον
  choice: సైన్యాధికారిని
  rationale: సాధారణ పాఠకుడికి వెంటనే అర్థమయ్యే సహజ పదం; నిర్దిష్ట రోమా సైనిక పదవి వివరాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: ἐπαύσαντο
  choice: ఆపేశారు
  rationale: కొనసాగుతున్న చర్యను వారు నిలిపివేశారనే భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τύπτοντες
  choice: కొట్టడం
  rationale: వర్తమాన కృదంతం సూచించే పదేపదే దెబ్బలు కొట్టే కొనసాగుతున్న హింసను సహజంగా వ్యక్తం చేస్తుంది.
