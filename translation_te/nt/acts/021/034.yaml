translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. జనసమూహపు అల్లకల్లోలాన్ని అతిశయింపకుండా, సైనిక సందర్భాన్ని సాధారణ పాఠకునికి అర్థమయ్యేలా అందించబడింది. మూలపాఠంలోని రెండు αὐτός సూచనలను ‘అతడు/అతణ్ణి’గా ఉంచి, ఈ వచనంలో లేని వ్యక్తిపేర్లు లేదా హోదాలను చేర్చలేదు.
