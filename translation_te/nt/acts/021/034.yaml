source:
  edition: SBLGNT
  text: ἄλλοι δὲ ἄλλο τι ⸀ἐπεφώνουν ἐν τῷ ὄχλῳ· μὴ ⸂δυναμένου δὲ αὐτοῦ⸃ γνῶναι τὸ ἀσφαλὲς διὰ τὸν θόρυβον ἐκέλευσεν ἄγεσθαι αὐτὸν εἰς τὴν παρεμβολήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/034.yaml
  text: But some in the crowd were shouting one thing[a], and others another. Since he was not able to learn the facts because of the uproar[b], he ordered him to be brought into the barracks.
translation:
  language: te
  text: 'అయితే జనసమూహంలో కొందరు ఒకటి, మరికొందరు మరొకటి అని కేకలు వేస్తూ ఉన్నారు. ఆ గందరగోళం వల్ల అతడు వాస్తవమేమిటో[a] తెలుసుకోలేకపోయాడు. అందుచేత అతణ్ణి సైనిక శిబిరంలోకి[b] తీసుకువెళ్లమని ఆజ్ఞాపించాడు.


    [a] లేదా “అసలు సంగతేమిటో,” లేదా “నిశ్చయమైనదేమిటో.”

    [b] ఇక్కడ “సైనిక శిబిరం” అంటే ఆలయ ప్రాంతానికి ఆనుకొని ఉన్న కోట సముదాయంలోని రోమా సైనికుల నివాస స్థలం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అసలు సంగతేమిటో,” లేదా “నిశ్చయమైనదేమిటో.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “సైనిక శిబిరం” అంటే ఆలయ ప్రాంతానికి ఆనుకొని ఉన్న కోట సముదాయంలోని రోమా సైనికుల నివాస స్థలం.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλοι δὲ ἄλλο τι ἐπεφώνουν
  choice: కొందరు ఒకటి, మరికొందరు మరొకటి అని కేకలు వేస్తూ ఉన్నారు
  rationale: ἄλλοι…ἄλλο τι లోని పరస్పర విరుద్ధమైన పంపిణీ భావాన్ని, ἐπεφώνουν లోని కొనసాగుతున్న అరుపుల భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν τῷ ὄχλῳ
  choice: జనసమూహంలో
  rationale: ὄχλος ను శత్రుత్వాన్ని అతిగా వ్యాఖ్యానించకుండా తటస్థంగా, సహజంగా అనువదిస్తుంది.
- source_word: μὴ δυναμένου δὲ αὐτοῦ γνῶναι
  choice: అతడు … తెలుసుకోలేకపోయాడు
  rationale: ఈ genitive absolute తరువాతి ఆజ్ఞకు కారణమైన పరిస్థితిని తెలియజేస్తుంది; γνῶναι ఇక్కడ సమాచారాన్ని నిర్ధారించుకోవడాన్ని సూచిస్తుంది.
- source_word: τὸ ἀσφαλές
  choice: వాస్తవమేమిటో
  rationale: నమ్మదగినది లేదా నిశ్చయమైనది ఏమిటనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; మూలంలోని భావ విస్తృతిని పాదసూచికలో నిలుపుతుంది.
- source_word: διὰ τὸν θόρυβον
  choice: ఆ గందరగోళం వల్ల
  rationale: θόρυβος కేవలం శబ్దం కాక అల్లకల్లోలమైన కలవరాన్ని సూచిస్తుంది.
- source_word: ἐκέλευσεν ἄγεσθαι αὐτὸν
  choice: అతణ్ణి … తీసుకువెళ్లమని ఆజ్ఞాపించాడు
  rationale: నిర్ణయాత్మక ఆజ్ఞను తెలియజేస్తూ, తీసుకువెళ్లే వ్యక్తులను మూలంలో లేనివిధంగా నిర్దిష్టం చేయదు.
- source_word: εἰς τὴν παρεμβολήν
  choice: సైనిక శిబిరంలోకి
  rationale: ఈ సందర్భంలో రోమా సైనికుల నివాస స్థావరాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; ఇది తాత్కాలిక శిబిరం కాదని పాదసూచిక వివరిస్తుంది.
