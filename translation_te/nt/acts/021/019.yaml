id: ACT.21.19
reference: Acts 21:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀσπασάμενος αὐτοὺς ἐξηγεῖτο καθ’ ἓν ἕκαστον ὧν ἐποίησεν ὁ θεὸς ἐν τοῖς ἔθνεσιν διὰ τῆς διακονίας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/019.yaml
  text: And after greeting them[b][a], he began to relate one by one the things that God had done among the Gentiles through his ministry.
translation:
  language: te
  text: వారిని పలకరించిన తర్వాత, తన సేవ ద్వారా అన్యజనుల[a] మధ్య దేవుడు చేసిన వాటిని అతడు ఒక్కొక్కటిగా వివరించి చెప్పసాగాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘జనాల మధ్య.’ ఈ సందర్భంలో ఇది యూదేతర ప్రజలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వివరంగా వృత్తాంతం చెప్పాడు’ లేదా ‘వివరించాడు.’ గ్రీకు క్రియ సుదీర్ఘంగా, ఒక్కొక్క అంశాన్ని వివరించే నివేదికను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασάμενος
  choice: పలకరించిన తర్వాత
  rationale: అపరిసమాప్త భూతక్రియ ప్రధాన క్రియకు ముందు జరిగినదని చూపుతుంది. ఈ తెలుగు రూపం క్రియల క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐξηγεῖτο
  choice: వివరించి చెప్పసాగాడు
  rationale: ఈ క్రియ వివరంగా తెలియజేయడం లేదా వృత్తాంతాన్ని చెప్పడం అనే భావాన్ని ఇస్తుంది; అపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న నివేదిక భావాన్ని ‘చెప్పసాగాడు’ ప్రతిబింబిస్తుంది.
- source_word: καθ’ ἓν ἕκαστον
  choice: ఒక్కొక్కటిగా
  rationale: ప్రతి విషయాన్నీ విడివిడిగా, క్రమంగా చెప్పాడనే విభాజక భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ὧν ἐποίησεν ὁ θεὸς
  choice: దేవుడు చేసిన వాటిని
  rationale: నిర్దిష్ట కార్యాలకు దేవుడే కర్త అని గ్రీకు వాక్యం స్పష్టంగా చెబుతుంది; తెలుగు అనువాదం అదే కర్తృత్వాన్ని ముందుకు తెస్తుంది.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: అన్యజనుల మధ్య
  rationale: ఈ సందర్భంలో ἔθνη భౌగోళిక దేశాలను కాక యూదేతర ప్రజలను సూచిస్తుంది. ‘అన్యజనులు’ కొత్త నిబంధన సందర్భానికి తగిన స్పష్టమైన పదం.
- source_word: διὰ τῆς διακονίας αὐτοῦ
  choice: తన సేవ ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సాధనాన్ని సూచిస్తుంది. ‘సేవ’ పౌలు చేసిన కార్యాన్ని సహజంగా తెలుపుతూ, మూలంలో లేని అధికారిక పదవీ భావాన్ని చేర్చదు.
theological_decisions:
- issue: పౌలు నివేదించిన మిషనరీ కార్యాలలో కర్తృత్వం
  choice: కార్యాలు చేసినవాడు దేవుడు; పౌలు సేవ వాటికి సాధనంగా చూపబడింది.
  alternative: అన్యజనుల మధ్య పౌలు తానే సాధించిన కార్యాలను నివేదించాడు.
  rationale: ὧν ἐποίησεν ὁ θεὸς దేవునికి కర్తృత్వాన్ని స్పష్టంగా ఇస్తుంది; διὰ τῆς διακονίας αὐτοῦ పౌలు సేవను సాధనంగా చూపుతుంది. అనువాదం దైవ కర్తృత్వాన్నీ మానవ సేవనూ తగ్గించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘అన్యజనులు’ అనే పరిచిత బైబిలు పదానికి సాధారణ పాఠకుల కోసం పాదసూచికలో వివరణ ఇచ్చాం; ‘పరిచర్య’ కంటే ‘సేవ’ను ఎంచుకొని అనవసరమైన సంస్థాగత భావాన్ని నివారించాం.
