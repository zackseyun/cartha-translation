id: ACT.21.37
reference: Acts 21:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μέλλων τε εἰσάγεσθαι εἰς τὴν παρεμβολὴν ὁ Παῦλος λέγει τῷ χιλιάρχῳ· Εἰ ἔξεστίν μοι εἰπεῖν ⸀τι πρὸς σέ; ὁ δὲ ἔφη· Ἑλληνιστὶ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/037.yaml
  text: As Paul was about to be brought into the barracks[a], he said to the tribune, “Is it permitted for me to say something to you?” And he said[c][b], “Do you know Greek?”
translation:
  language: te
  text: పౌలును సైనికుల నివాస ప్రాంగణంలోకి[a] తీసుకువెళ్లబోతుండగా, అతడు సైనికాధికారితో[b], “మీతో ఒక మాట చెప్పడానికి నాకు అనుమతి ఉందా?” అని అడిగాడు. అప్పుడు ఆ అధికారి, “నీకు గ్రీకు భాష తెలుసా?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “సైనికుల నివాస ప్రాంగణం” అనేది రోమన్ సైనికులు ఉండే నివాస స్థావరాన్ని సూచిస్తుంది; అది కోట ప్రాంగణంలో ఉండి ఉండవచ్చు.
    reason: cultural_note
  - marker: b
    text: మూల గ్రీకు పదం రోమన్ సైన్యంలోని ఒక అధికారిని సూచిస్తుంది; దీనిని “సహస్రాధిపతి” అని కూడా అనువదించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: Μέλλων τε εἰσάγεσθαι
  choice: తీసుకువెళ్లబోతుండగా
  rationale: μέλλω సమీపంలో జరగబోయే చర్యను, εἰσάγεσθαι కర్మణి భావాన్ని తెలియజేస్తాయి. తెలుగు కాలసూచక ఉపవాక్యంగా మార్చి రెండింటినీ సహజంగా నిలిపింది.
- source_word: παρεμβολή
  choice: సైనిక శిబిరం
  rationale: ఈ సందర్భంలో రోమా సైనికులు ఉండే స్థావరం లేదా నివాస విభాగాన్ని సూచిస్తుంది. ‘సైనిక శిబిరం’ సాధారణ పాఠకులకు సహజంగా అర్థమవుతుంది; సందర్భానుసారమైన వివరాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: χιλίαρχος
  choice: సైనికాధికారి
  rationale: రోమా సైన్యంలోని ఉన్నత అధికారిని సూచించే పదం. ‘సహస్రాధిపతి’ అనే అక్షరార్థ పదం ఆధునిక పాఠకులకు అపరిచితంగా ఉండవచ్చు; ‘సైనికాధికారి’ హోదా భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: Εἰ ἔξεστίν μοι εἰπεῖν τι πρὸς σέ
  choice: నేను మీతో ఒక మాట చెప్పడానికి అనుమతి ఉందా?
  rationale: ἔξεστιν లోని అనుమతి భావాన్ని ప్రశ్న రూపంలో నిలిపింది. τι ను సహజ తెలుగు ప్రయోగమైన ‘ఒక మాట’గా అనువదించింది; గ్రీకు వాక్యంలోని మర్యాదపూర్వక అభ్యర్థన భావం కొనసాగుతుంది.
- source_word: Ἑλληνιστὶ γινώσκεις
  choice: నీకు గ్రీకు భాష తెలుసా?
  rationale: Ἑλληνιστί అంటే గ్రీకు భాషలో లేదా గ్రీకు భాషను; γινώσκεις అంటే తెలుసుకోవడం. భాషా పరిజ్ఞానాన్ని అడిగే సహజ తెలుగు రూపం ఇది.
