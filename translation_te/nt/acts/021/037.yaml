- from: పౌలును సైనిక శిబిరంలోకి[a] తీసుకువెళ్లబోతుండగా, అతడు సైనికాధికారితో[b], “నేను మీతో ఒక మాట చెప్పడానికి అనుమతి ఉందా?” అని అడిగాడు. అందుకు అతడు, “నీకు గ్రీకు భాష తెలుసా?” అన్నాడు.
