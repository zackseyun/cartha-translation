translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. పౌలు అధికారిని సంభోదించేటప్పుడు ‘మీతో’ అనే మర్యాదారూపాన్ని, అధికారి పౌలును ప్రశ్నించేటప్పుడు ‘నీకు’ అనే ఏకవచన రూపాన్ని వాడటం సందర్భంలోని సామాజిక సంబంధాన్ని సహజంగా ప్రతిబింబిస్తుంది.
