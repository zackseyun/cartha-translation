id: ACT.21.20
reference: Acts 21:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐδόξαζον τὸν ⸀θεόν, ⸂εἶπόν τε⸃ αὐτῷ· Θεωρεῖς, ἀδελφέ, πόσαι μυριάδες εἰσὶν ⸂ἐν τοῖς Ἰουδαίοις⸃ τῶν πεπιστευκότων, καὶ πάντες ζηλωταὶ τοῦ νόμου ὑπάρχουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/020.yaml
  text: When they heard this[a], they glorified God, and they said to him, “You see, brother, how many myriads there are among the Jews who have believed[b], and they are all zealous for the law.”
translation:
  language: te
  text: 'వారు ఇది విని[a] దేవుణ్ణి మహిమపరిచారు; ఆయనతో ఇలా అన్నారు: “సోదరా, యూదులలో[c] విశ్వసించినవారు ఎన్ని వేలమంది[b] ఉన్నారో నీవు చూస్తున్నావు కదా! వారందరూ ధర్మశాస్త్రం పట్ల అత్యంత ఉత్సాహంగలవారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో ‘ఇది’ అనే పదం స్పష్టంగా లేదు; ముందు చెప్పిన విషయాన్ని సందర్భం ద్వారా సూచిస్తుంది.
    reason: implicit_object
  - marker: b
    text: లేదా “పదివేలకొద్దీ మంది.” గ్రీకు పదం పదివేల యూనిట్లను లేదా సాధారణంగా చాలా పెద్ద సంఖ్యను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా “యూదయవారిలో,” దీనిని భౌగోళిక అర్థంలో తీసుకుంటే.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: వారు ఇది విని
  rationale: భూతకాల అసమాపక క్రియ సందర్భంలోని పౌలు నివేదికను సూచిస్తుంది; తెలుగులో సహజంగా ఉండేందుకు సూచిత కర్మగా ‘ఇది’ చేర్చబడింది.
- source_word: ἐδόξαζον τὸν θεόν
  choice: దేవుణ్ణి మహిమపరిచారు
  rationale: దేవునికి మహిమ చెల్లించడమనే భావాన్ని, మూలంలోని ధార్మిక బరువును నేరుగా కాపాడుతుంది.
- source_word: εἶπόν τε αὐτῷ
  choice: తరువాత పౌలుతో ఇలా అన్నారు
  rationale: τέ కథన అనుసంధానాన్ని తెలుగులో సహజంగా ‘తరువాత’తో వ్యక్తం చేస్తుంది; αὐτῷ సూచించే వ్యక్తి సందర్భానుసారం పౌలు.
- source_word: Θεωρεῖς, ἀδελφέ
  choice: సోదరా, ... నువ్వు చూస్తున్నావు కదా
  rationale: ప్రత్యక్ష సంబోధనను, ఎదుటివాని దృష్టిని స్పష్టమైన పరిస్థితివైపు మళ్లించే అలంకారిక వర్తమాన ప్రయోగాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: πόσαι μυριάδες
  choice: ఎన్ని వేలమంది
  rationale: μυριάδες పదం పదివేల యూనిట్లను లేదా సాధారణంగా అతి పెద్ద సంఖ్యను సూచించగలదు. ‘ఎన్ని వేలమంది’ అతిగా నిర్దిష్టం చేయకుండా సహజంగా విస్తార సంఖ్యను తెలియజేస్తుంది.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: యూదుల్లో
  rationale: ఇక్కడ భౌగోళికంగా యూదయ నివాసులకన్నా, జాతి-మత సమూహమైన యూదుల మధ్యనున్న విశ్వాసులను సూచించడం సందర్భానికి తగినది.
- source_word: τῶν πεπιστευκότων
  choice: విశ్వసించినవారు
  rationale: పరిపూర్ణకాల కృదంతం విశ్వాసంలోకి వచ్చి ఆ స్థితిలో ఉన్నవారిని సూచిస్తుంది; క్రియాత్మక భావాన్ని నిలుపుతుంది.
- source_word: ζηλωταὶ τοῦ νόμου ὑπάρχουσιν
  choice: ధర్మశాస్త్రం విషయంలో ఎంతో ఆసక్తిగలవారు
  rationale: ζηλωταί తెలిపే బలమైన నిబద్ధతను సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది; νόμος ఇక్కడ మోషే ధర్మశాస్త్రాన్ని సూచిస్తుంది.
theological_decisions:
- issue: ἐν τοῖς Ἰουδαίοις యొక్క సూచన
  choice: యూదుల్లో
  alternative: యూదయవారిలో
  rationale: వాక్యంలోని ధర్మశాస్త్ర నిబద్ధత జాతి-మత గుర్తింపును ముందుకు తెస్తుంది. అయితే భౌగోళిక అర్థం వ్యాకరణపరంగా సాధ్యమే కాబట్టి పాదసూచికలో ఉంచబడింది.
- issue: μυριάδες యొక్క సంఖ్యాబలం
  choice: వేలమంది
  alternative: పదివేలకొద్దీ మంది
  rationale: గ్రీకు పదం ఖచ్చితంగా పదివేల యూనిట్లను గానీ, విస్తార సంఖ్యను గానీ సూచించగలదు. ప్రధాన పాఠం అనిశ్చితిని అతిగా నిర్దిష్టం చేయదు; మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- issue: ζηλωταὶ τοῦ νόμου యొక్క స్వభావం
  choice: ధర్మశాస్త్రం విషయంలో ఎంతో ఆసక్తిగలవారు
  alternative: ధర్మశాస్త్రం పట్ల అత్యంత ఉత్సాహంగలవారు
  rationale: ఇది వారి బలమైన నిబద్ధతను వర్ణిస్తుంది; దానిని స్వయంగా ఆమోదం లేదా ఖండనగా మార్చకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ధర్మశాస్త్రం’ సాధారణ బైబిలు పదజాలాన్ని నిలుపుతుంది. ప్రధాన పాఠంలో ‘మిరియడ్లు’ వంటి అపరిచిత లిప్యంతరీకరణను నివారించి, సంఖ్యా అనిశ్చితిని పాదసూచికలో సంరక్షించాం.
