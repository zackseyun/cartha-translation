  yaml_path: translation/nt/acts/021/022.yaml
  text: What then is to be done? They will certainly hear that you have come[a].
translation:
  language: te
  text: అయితే ఏమి చేయాలి? నీవు వచ్చావని వారు తప్పకుండా వింటారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “అయితే ఏమిటి?” పరిస్థితిని బట్టి ఏమి చేయాలనే ప్రశ్నను ఈ గ్రీకు నుడికారం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: అయితే ఇప్పుడు ఏమి చేయాలి?
  rationale: అక్షరార్థంగా ‘అయితే ఏమిటి?’ అయినప్పటికీ, సందర్భంలో ఏర్పడిన పరిస్థితిని బట్టి తదుపరి ఏమి చేయాలనే ఆచరణాత్మక ప్రశ్నగా ఈ గ్రీకు ప్రయోగం పనిచేస్తుంది. ఆధునిక తెలుగులో ‘ఇప్పుడు ఏమి చేయాలి?’ దాని సంభాషణాత్మక బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πάντως
  choice: తప్పకుండా
  rationale: తరువాత చెప్పబడిన విషయం జరుగుతుందనే నిశ్చయాన్ని ఈ క్రియావిశేషణం బలపరుస్తుంది; ‘తప్పకుండా’ సహజమైన, స్పష్టమైన తెలుగు సమానం.
- source_word: ἀκούσονται
  choice: వారు ... వింటారు
  rationale: భవిష్యత్ మధ్యమ రూపం ఇక్కడ క్రియాశీల భావంలో ఉంది. గ్రీకులో కర్త అంతర్లీనంగా ఉన్నా, సందర్భానుసారంగా తెలుగులో ‘వారు’ అని స్పష్టపరచబడింది.
- source_word: ὅτι
  choice: అని
  rationale: వారు వినబోయే సమాచారాన్ని పరిచయం చేస్తుంది; కారణాన్ని కాదు. తెలుగు పరోక్ష వాక్య నిర్మాణంలో ‘అని’ సహజమైన ఎంపిక.
- source_word: ἐλήλυθας
  choice: నీవు వచ్చావు
  rationale: ἔρχομαι క్రియ యొక్క పరిపూర్ణకాల రూపం పౌలు రావడం జరిగి, ప్రస్తుతం అతడు అక్కడ ఉన్నాడనే ఫలితాన్ని సూచిస్తుంది. తెలుగు ‘వచ్చావు’ సందర్భంలో ఆ పూర్తయిన రాకను సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి ఉపయోగించబడింది. ‘నీవు’ ఏకవచనం పౌలును నేరుగా సంబోధిస్తున్న మూలపాఠాన్ని నిలుపుతుంది.
