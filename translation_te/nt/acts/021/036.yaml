  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἠκολούθει γὰρ τὸ πλῆθος τοῦ λαοῦ ⸀κράζοντες· Αἶρε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/036.yaml
  text: For the crowd of the people was following[a], shouting, “Take him away!”
translation:
  language: te
  text: ఎందుకంటే ప్రజల గుంపు వెంబడిస్తూ, “అతణ్ణి తీసుకుపోండి!”[a] అని కేకలు వేస్తోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతణ్ణి తొలగించండి!”
    reason: αἶρε αὐτόν అనేది అతణ్ణి అక్కడి నుండి తీసివేయాలని లేదా తీసుకుపోవాలని కోరే ఆజ్ఞ. సందర్భం తీవ్రమైన శత్రుత్వాన్ని చూపించినా, క్రియ స్వయంగా మరణాన్ని స్పష్టంగా చెప్పదు.
lexical_decisions:
- source_word: ἠκολούθει
  choice: వెనుక వస్తూనే ఉంది
  rationale: అసంపూర్ణ భూతకాల క్రియ గతంలో కొనసాగుతున్న చర్యను సూచిస్తుంది; ఈ ప్రయోగం ఆ కొనసాగింపు భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని చర్యకు వివరణ ఇచ్చే అనుసంధానాన్ని స్పష్టంగా చూపుతుంది.
- source_word: τὸ πλῆθος τοῦ λαοῦ
  choice: ప్రజల గుంపు
  rationale: πλῆθος అనే సమూహ భావాన్నీ, τοῦ λαοῦ అనే తటస్థ విశేషణాన్నీ నిలుపుతూ, ‘మూక’ వంటి అదనపు ప్రతికూల ఛాయను చేర్చదు.
- source_word: κράζοντες
  choice: కేకలు వేస్తూ
  rationale: వారు వెనుక వస్తున్నప్పుడు తోడుగా జరిగిన బిగ్గర పిలుపును సహజంగా, బలంగా వ్యక్తం చేస్తుంది.
- source_word: Αἶρε αὐτόν
  choice: అతణ్ణి అంతం చేయండి!
  rationale: ఈ సందర్భంలో αἴρω కేవలం పైకెత్తడాన్ని కాక, అతణ్ణి తొలగించాలనే శత్రుత్వపూరిత డిమాండును సూచిస్తుంది; సందర్భంలోని మరణోద్దేశపు తీవ్రతను ఈ ఎంపిక ప్రతిబింబిస్తుంది.
