translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరతతో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే సహజమైన వాక్య నిర్మాణం. ‘ప్రజల గుంపు’ తటస్థంగా ఉంచబడింది; నినాదం మాత్రం సందర్భానుసారంగా బలంగా అనువదించబడింది.
