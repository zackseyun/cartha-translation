  revision_rationale: 'The revision removes an unnecessary connector and replaces “మౌనంగా ఉండిపోయి” with the more natural “మౌనంగా ఉండి.” It retains every source-level element: Paul was not persuaded, the speakers stopped pressing him, and they expressed submission to the Lord’s will. The footnote anchor and explanatory alternative are retained.'
