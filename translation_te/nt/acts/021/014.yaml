id: ACT.21.14
reference: Acts 21:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ πειθομένου δὲ αὐτοῦ ἡσυχάσαμεν εἰπόντες· ⸂Τοῦ κυρίου τὸ θέλημα⸃ ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/014.yaml
  text: And since he would not be persuaded[a], we became quiet, saying, “The Lord’s will be done.”
translation:
  language: te
  text: అతడు ఒప్పుకోకపోవడంతో, మేము మౌనంగా ఉండి[a], “ప్రభువు చిత్తమే నెరవేరాలి” అని అన్నాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మేము మాటలు ఆపాము.”
    reason: ἡσυχάσαμεν అనేది కేవలం నిశ్శబ్దంగా మారడాన్నే కాక, ఈ విషయంపై ఇక పట్టుబట్టకుండా మాట్లాడటం ఆపిన భావాన్నీ సందర్భంలో కలిగి ఉండవచ్చు.
lexical_decisions:
- source_word: μὴ πειθομένου δὲ αὐτοῦ
  choice: అయితే అతడు ఒప్పుకోకపోవడంతో
  rationale: μήతో కూడిన వర్తమాన కృదంతమున్న ఈ షష్ఠీ స్వతంత్ర నిర్మాణం, వారి విజ్ఞప్తులకు పౌలు ఒప్పుకోని పరిస్థితిని సూచిస్తుంది. ‘ఒప్పుకోకపోవడంతో’ అనేది సందర్భానుసార సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, ‘వినలేదు’ వంటి అధిక వ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: ἡσυχάσαμεν
  choice: మేము మౌనంగా ఉండిపోయి
  rationale: ఇక్కడ ἡσυχάζω అంటే విషయాన్ని మరింతగా పట్టుబట్టకుండా మాటలు ఆపడం. ‘మౌనంగా ఉండిపోయి’ అనేది ఆరంభార్థక భూతకాల భావాన్ని సహజంగా తెలియజేస్తుంది; ‘మేము విరమించుకున్నాము’ అనే సందర్భార్థాన్ని నేరుగా పాఠ్యంలో చేర్చదు.
- source_word: εἰπόντες
  choice: అని అన్నాము
  rationale: గ్రీకు భూతకృదంతాన్ని తెలుగులో ప్రధాన క్రియతో సహజంగా కలిపి, వారు మౌనంగా ఉండిపోయేటప్పుడు పలికిన మాటలను పరిచయం చేస్తుంది.
- source_word: Τοῦ κυρίου
  choice: ప్రభువు
  rationale: κύριοςకు ప్రామాణికమైన, గౌరవప్రదమైన తెలుగు పదం ‘ప్రభువు’. గ్రీకు పాఠ్యం వ్యక్తిని మరింత స్పష్టంగా గుర్తించనందున అనువాదమూ అలాగే ఉంచుతుంది.
- source_word: τὸ θέλημα
  choice: చిత్తమే
  rationale: θέλημα ఇక్కడ సంకల్పం లేదా ఇష్టాన్ని సూచిస్తుంది. ‘చిత్తం’ ప్రార్థనాత్మక సమర్పణ సందర్భంలో సహజమైన బైబిలు తెలుగు; ‘ఏ’ నిపాతం వారి అంగీకారాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: γινέσθω
  choice: నెరవేరాలి
  rationale: γίνομαι యొక్క ఆజ్ఞార్థక రూపం ఇక్కడ ప్రభువు చిత్తానికి సమర్పణను తెలియజేస్తుంది. ‘నెరవేరాలి’ తెలుగు ప్రార్థనాత్మక వాడుకలో సహజంగా ఉండి, ‘జరగాలి’ కంటే చిత్తంతో సులభంగా జతకడుతుంది.
theological_decisions:
- issue: κύριος యొక్క అనువాదం మరియు సూచిత వ్యక్తి
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ‘ప్రభువు’ κύριοςకు ఈ సందర్భంలో సహజమైన, విస్తృతంగా అర్థమయ్యే సమానార్థకం. కథన సందర్భంలో ఇది యేసును సూచించే అవకాశం ఉన్నప్పటికీ, గ్రీకు పాఠ్యం చెప్పినదానికంటే అనువాదం మరింత స్పష్టీకరించదు.
- issue: γινέσθωలో వ్యక్తమయ్యే సమర్పణ
  choice: నెరవేరాలి
  alternative: జరగాలి
  rationale: ఈ రూపం ప్రభువు చిత్తానికి లోబడే ఆకాంక్షను వ్యక్తం చేస్తుంది. ‘నెరవేరాలి’ ఆ భావాన్ని నిలుపుతుంది; సంఘటనలు ముందే నిర్ణయించబడ్డాయని అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘చిత్తం’, ‘ప్రభువు’ వంటి స్థిరమైన బైబిలు పదాలను నిలుపుతూ వాక్య నిర్మాణాన్ని సహజంగా ఉంచాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
