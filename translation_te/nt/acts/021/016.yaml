id: ACT.21.16
reference: Acts 21:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: συνῆλθον δὲ καὶ τῶν μαθητῶν ἀπὸ Καισαρείας σὺν ἡμῖν, ἄγοντες παρ’ ᾧ ξενισθῶμεν Μνάσωνί τινι Κυπρίῳ, ἀρχαίῳ μαθητῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/016.yaml
  text: And some of the disciples from Caesarea also went with us, bringing us to Mnason, a certain Cypriot, an early disciple, with whom we were to stay.
translation:
  language: te
  text: కైసరయ నుండి శిష్యుల్లో కొందరు కూడా మాతో కలిసి వచ్చారు. మేము బస చేయడానికి, చాలాకాలంగా శిష్యుడైన[b] ఒక సైప్రసువాసి అయిన మ్నాసోను వద్దకు[a] వారు మమ్మల్ని తీసుకువెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మేము బస చేయాల్సిన మ్నాసోను వద్దకు వారు మమ్మల్ని నడిపించారు,” లేదా “మ్నాసోను ఇంటికి వారు మమ్మల్ని తీసుకువెళ్లారు.” గ్రీకులోని అసమాపక క్రియారూపాన్ని, బసను సూచించే క్రియను కొద్దిగా భిన్నమైనా దగ్గరి సంబంధమున్న విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “తొలి దశ నుంచే శిష్యుడైనవాడు.” ఈ పదబంధం మ్నాసోను చాలాకాలం నుంచే, బహుశా ఈ ఉద్యమపు తొలి రోజుల నుంచే, శిష్యుడిగా ఉన్నాడని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆλθον ... σὺν ἡμῖν
  choice: మాతో కలిసి వచ్చారు
  rationale: సందర్భంలో ఇది ప్రయాణంలో తోడుగా రావడాన్ని సూచిస్తుంది. సహజమైన తెలుగులో ఆ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τῶν μαθητῶν
  choice: శిష్యుల్లో కొందరు
  rationale: గ్రీకు భాగార్థక ప్రయోగాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἀπὸ Καισαρείας
  choice: కైసరయ నుండి వచ్చిన
  rationale: ఆ శిష్యులు ఎక్కడివారో లేదా ఎక్కడి నుండి వచ్చారో తెలిపే మూలస్థాన భావాన్ని నిలుపుతుంది.
- source_word: ἄγοντες
  choice: మమ్మల్ని తీసుకువెళ్లారు
  rationale: ప్రయాణం మరియు బస సందర్భంలో గమ్యస్థానానికి నడిపించి తీసుకువెళ్లడం అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: παρ’ ᾧ ξενισθῶμεν
  choice: మేము బస చేయడానికి ... దగ్గరకు
  rationale: ξενίζωలోని అతిథిగా ఉండడం లేదా వసతి పొందడం అనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా చెబుతుంది; ఉద్దేశిత బస భావాన్ని కూడా నిలుపుతుంది.
- source_word: Μνάσωνί τινι
  choice: మ్నాసోను అనే
  rationale: τινι కొత్తగా పరిచయం చేస్తున్న వ్యక్తిని సూచిస్తుంది. తెలుగులో ‘అనే’ సహజంగా ఆ పరిచయ విధిని నిర్వహిస్తుంది; ‘ఒకానొక’ వంటి కృత్రిమ పదబంధాన్ని నివారిస్తుంది.
- source_word: Κυπρίῳ
  choice: సైప్రసువాసి
  rationale: సైప్రసుకు చెందిన వ్యక్తి అనే అర్థాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἀρχαίῳ μαθητῇ
  choice: తొలి కాలపు శిష్యుడు
  rationale: ఆదికాలానికి చెందిన శిష్యుడు లేదా చాలాకాలంగా శిష్యుడిగా ఉన్నవాడు అనే రెండు సమీప భావాల మధ్యనున్న అస్పష్టతను పూర్తిగా తొలగించకుండా ఉంచుతుంది.
theological_decisions:
- issue: ἀρχαίῳ μαθητῇ యొక్క కాలసంబంధ అర్థం
  choice: తొలి కాలపు శిష్యుడు
  alternative: చాలాకాలంగా శిష్యుడిగా ఉన్నవాడు; మొదటి శిష్యుల్లో ఒకడు
  rationale: ఈ పదబంధం మ్నాసోను తొలి దశ నుంచే శిష్యుడని సూచించవచ్చు, కాని అతడు ఖచ్చితంగా ‘మొదటి శిష్యుల్లో ఒకడు’ అని నిర్ధారించదు. ఎంపిక చేసిన రూపం చారిత్రక సూచనను నిలుపుతూ అతిగా నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని సమాచారం క్రమాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగులో సహజంగా చదవడానికి వాక్యాన్ని రెండు భాగాలుగా అమర్చాం. ‘తొలి కాలపు శిష్యుడు’ అనే రూపం మూలంలోని కాలసంబంధ అస్పష్టతను నిలుపుతుంది.
