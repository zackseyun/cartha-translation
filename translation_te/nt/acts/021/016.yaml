revisions:
- from: కైసరయ నుండి వచ్చిన శిష్యుల్లో కొందరు కూడా మాతో కలిసి వచ్చారు. మేము బస చేయడానికి, తొలి కాలపు శిష్యుడైన[b] మ్నాసోను అనే సైప్రసువాసి దగ్గరకు[a] వారు మమ్మల్ని తీసుకువెళ్లారు.
  to: కైసరయ నుండి శిష్యుల్లో కొందరు కూడా మాతో కలిసి వచ్చారు. మేము బస చేయడానికి, చాలాకాలంగా శిష్యుడైన[b] ఒక సైప్రసువాసి అయిన మ్నాసోను వద్దకు[a] వారు మమ్మల్ని తీసుకువెళ్లారు.
  rationale: The revision improves idiomatic modern Telugu and more clearly reflects τις as an indefinite introduction. It renders ἀρχαίῳ μαθητῇ as longstanding discipleship in the main text, a well-supported sense, while the footnote preserves the related possibility that Mnason had been a disciple from the movement’s early phase. Footnote anchors remain attached to the corresponding lodging and descriptive phrases.
