id: ACT.21.26
reference: Acts 21:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος παραλαβὼν τοὺς ἄνδρας τῇ ἐχομένῃ ἡμέρᾳ σὺν αὐτοῖς ἁγνισθεὶς εἰσῄει εἰς τὸ ἱερόν, διαγγέλλων τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ ἕως οὗ προσηνέχθη ὑπὲρ ἑνὸς ἑκάστου αὐτῶν ἡ προσφορά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/026.yaml
  text: Then Paul took the men[a], and on the next day, having purified himself with them, he entered the temple, giving notice of the completion of the days of purification[b], until the offering was presented for each one of them.
translation:
  language: te
  text: అప్పుడు పౌలు ఆ మనుష్యులను వెంటబెట్టుకొని, మరుసటి రోజు వారితో కలిసి శుద్ధీకరణ ఆచరించి, దేవాలయ ప్రాంగణంలోకి[a] వెళ్లాడు. శుద్ధీకరణ దినాలు పూర్తికానున్న విషయాన్ని తెలియజేస్తూ, వారిలో ప్రతి ఒక్కరి కోసం అర్పణ[b] సమర్పించబడే వరకు అక్కడికి వెళ్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘దేవాలయ ప్రాంగణం’ అని అనువదించిన గ్రీకు పదం ఆలయ గర్భగృహాన్ని మాత్రమే కాకుండా మొత్తం ఆలయ సముదాయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘అర్పణ’ అనే పదాన్ని సందర్భానుసారంగా ‘బలి’ అని కూడా అనువదించవచ్చు; గ్రీకు పదం మరింత సాధారణమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαβὼν τοὺς ἄνδρας
  choice: ఆ మనుష్యులను వెంటబెట్టుకొని
  rationale: పౌలు వారిని తనతో తీసుకెళ్లాడనే సహచర్య భావాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τῇ ἐχομένῃ ἡμέρᾳ
  choice: మరుసటి రోజు
  rationale: వెంటనే వచ్చే రోజును సూచించే సహజమైన ఆధునిక తెలుగు కాలప్రయోగం.
- source_word: σὺν αὐτοῖς ἁγνισθεὶς
  choice: వారితో కలిసి శుద్ధీకరణ ఆచరించి
  rationale: ఆలయ సంబంధమైన ఆచార శుద్ధిని సూచిస్తుంది; కేవలం నైతిక పరిశుద్ధత అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: εἰσῄει εἰς τὸ ἱερόν
  choice: దేవాలయంలోకి వెళ్లాడు
  rationale: గ్రీకు అసంపూర్ణ భూతకాల రూపాన్ని తెలుగులో కృత్రిమంగా దీర్ఘ చర్యగా చూపకుండా, సందర్భంలోని కథన చర్యను సహజంగా అందిస్తుంది. ἱερόν ఆలయ సముదాయాన్ని సూచించగలదనే విషయాన్ని పాదసూచికలో తెలిపాం.
- source_word: διαγγέλλων
  choice: తెలియజేశాడు
  rationale: ఆలయ అధికారులకు ఆచార ప్రక్రియకు సంబంధించిన సమయాన్ని అధికారికంగా తెలియపరచడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ
  choice: శుద్ధీకరణ దినాలు ఎప్పుడు పూర్తవుతాయో
  rationale: గ్రీకు నామవాచక నిర్మాణాన్ని అర్థస్పష్టమైన తెలుగు ఉపవాక్యంగా మార్చి, నిర్ణీత శుద్ధీకరణ కాలపు ముగింపును నిలుపుతుంది.
- source_word: ἕως οὗ προσηνέχθη ... ἡ προσφορά
  choice: అర్పణ ఎప్పుడు సమర్పించబడుతుందో
  rationale: క్లిష్టమైన గ్రీకు కాలసంబంధ నిర్మాణాన్ని, శుద్ధీకరణ ముగింపుతో అనుసంధానమైన అర్పణ సమయంగా సహజంగా తెలుపుతుంది; కర్మణి రూపాన్ని నిలుపుతుంది.
- source_word: ὑπὲρ ἑνὸς ἑκάστου αὐτῶν
  choice: వారిలో ప్రతి ఒక్కరి కోసం
  rationale: అర్పణ ప్రతి వ్యక్తి నిమిత్తం సమర్పించబడుతుందనే ప్రయోజన/ప్రాతినిధ్య భావాన్ని నేరుగా అందిస్తుంది.
theological_decisions:
- issue: దేవాలయ శుద్ధీకరణ ఆచారంలో పౌలు పాల్గొనడం
  choice: సంఘటనను విలువతీర్పు లేకుండా నేరుగా వర్ణించడం
  alternative: ఈ చర్య ద్వారా క్రైస్తవులకు దేవాలయ ఆచారాలు శాశ్వతంగా చెల్లుతాయని లేదా చెల్లవని సూచించడం
  rationale: ఈ వచనం పౌలు చేసిన కార్యాన్ని మాత్రమే వివరిస్తుంది; ధర్మశాస్త్ర ఆచరణ లేదా నిబంధన సిద్ధాంతంపై తుది తీర్పు ఇవ్వదు.
- issue: εἰσῄει యొక్క అసంపూర్ణ భూతకాలాంశం
  choice: తెలుగులో సహజ కథన భూతకాలమైన ‘వెళ్లాడు’ అని అనువదించడం
  alternative: ‘వెళ్తూ ఉన్నాడు’ లేదా ‘ప్రవేశిస్తూ ఉండేవాడు’ అని నిరంతర/పునరావృత భావాన్ని బలవంతంగా చూపించడం
  rationale: గ్రీకు రూపం కొనసాగుతున్న లేదా నేపథ్య చర్యను సూచించవచ్చు; అయితే ఈ సందర్భంలో తెలుగులో నిరంతర రూపం అసహజంగా ఉండి నిర్ధారణలేని పునరావృత భావాన్ని కలిగిస్తుంది.
- issue: ἕως οὗ తో అర్పణ సమయానికి ఉన్న సంబంధం
  choice: శుద్ధీకరణ దినాల ముగింపు మరియు ప్రతి ఒక్కరి అర్పణ సమర్పణ సమయాన్ని సమాంతరంగా తెలియజేసినట్లు అనువదించడం
  alternative: అర్పణ సమర్పించబడేంతవరకు పౌలు నిరంతరం ప్రకటన చేస్తూనే ఉన్నాడని కఠిన పదానువాదం చేయడం
  rationale: గ్రీకు వాక్యనిర్మాణం సంక్షిప్తంగా, కొంత క్లిష్టంగా ఉంది. సందర్భంలో ఇది ఆచార కాలం పూర్తయ్యే తేదీతో పాటు అర్పణ జరగబోయే సమయాన్ని అధికారికంగా తెలియజేయడాన్ని సూచిస్తుంది; అనవసర సిద్ధాంతార్థాన్ని జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘శుద్ధీకరణ ఆచరించి’ అనే ప్రయోగం ఆచారపరమైన సందర్భాన్ని స్పష్టం చేస్తుంది. గ్రీకు వాక్యంలోని క్లిష్టమైన నామవాచక నిర్మాణాన్ని రెండు సమాంతర ‘ఎప్పుడు…’ ఉపవాక్యాలుగా సహజీకరించాం.
