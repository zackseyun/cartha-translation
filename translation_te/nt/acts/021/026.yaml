revisions:
- from: అప్పుడు పౌలు ఆ మనుష్యులను వెంటబెట్టుకొని, మరుసటి రోజు వారితో కలిసి శుద్ధీకరణ ఆచరించి దేవాలయంలోకి[a] వెళ్లాడు. శుద్ధీకరణ దినాలు ఎప్పుడు పూర్తవుతాయో, వారిలో ప్రతి ఒక్కరి కోసం అర్పణ[b] ఎప్పుడు సమర్పించబడుతుందో తెలియజేశాడు.
  to: అప్పుడు పౌలు ఆ మనుష్యులను వెంటబెట్టుకొని, మరుసటి రోజు వారితో కలిసి శుద్ధీకరణ ఆచరించి, దేవాలయ ప్రాంగణంలోకి[a] వెళ్లాడు. శుద్ధీకరణ దినాలు పూర్తికానున్న విషయాన్ని తెలియజేస్తూ, వారిలో ప్రతి ఒక్కరి కోసం అర్పణ[b] సమర్పించబడే వరకు అక్కడికి వెళ్తూ ఉన్నాడు.
  rationale: The revision corrects the altered clause structure in the draft. It renders the formal notice as concerning the impending completion of the purification days and retains the following “until” clause as the temporal endpoint for presentation of the offering. The imperfect εἰσῄει is represented cautiously by “అక్కడికి వెళ్తూ ఉన్నాడు,” which allows an ongoing or repeated entry during the stated process without requiring a precise aspectual interpretation. No theological conclusion is added.
