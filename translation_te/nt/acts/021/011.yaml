id: ACT.21.11
reference: Acts 21:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν πρὸς ἡμᾶς καὶ ἄρας τὴν ζώνην τοῦ Παύλου δήσας ⸀ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας εἶπεν· Τάδε λέγει τὸ πνεῦμα τὸ ἅγιον Τὸν ἄνδρα οὗ ἐστιν ἡ ζώνη αὕτη, οὕτως δήσουσιν ἐν Ἰερουσαλὴμ οἱ Ἰουδαῖοι καὶ παραδώσουσιν εἰς χεῖρας ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/011.yaml
  text: 'And coming to us[a], and taking Paul’s belt, he bound his own feet and hands and said[b], “Thus says the Holy Spirit: ‘In this way the Jews in Jerusalem will bind the man to whom this belt belongs and will hand him over into the hands of the Gentiles.’”'
translation:
  language: te
  text: 'అతడు మా దగ్గరికి వచ్చి, పౌలుది అయిన నడుము పట్టాను తీసుకొని, తన కాళ్లను, చేతులను కట్టుకొని ఇలా అన్నాడు:[b] “పరిశుద్ధాత్మ ఇలా చెబుతున్నాడు: ‘ఈ నడుము పట్టా ఎవరిదో,[a] ఆ మనిషిని యెరూషలేములోని యూదులు ఇలాగే కట్టి, యూదేతరుల చేతుల్లోకి అప్పగిస్తారు.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “ఎవరిదీ ఈ నడుము పట్టా.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పరిశుద్ధాత్మ చెప్పేది ఇదే.”
    reason: alternative_reading
lexical_decisions:
- source_word: ζώνην
  choice: నడుము పట్టా
  rationale: నడుము చుట్టూ ధరించే బెల్టు లేదా పట్టాను సూచిస్తుంది. ‘నడుము పట్టా’ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉండి, వస్తువు స్వరూపాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δήσας ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας
  choice: తన కాళ్లను, చేతులను కట్టుకొని
  rationale: ἑαυτοῦ కర్త అయిన అగబునే సూచించే ప్రతిబింబ సర్వనామం. అందువల్ల అతడు పౌలును కాక తననే కట్టుకున్న సూచక క్రియను అనువాదం స్పష్టంగా ఉంచుతుంది.
- source_word: Τάδε λέγει
  choice: ఇలా చెబుతున్నాడు
  rationale: ప్రవచన ప్రకటన సూత్రంలోని గంభీరతను నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా వినిపిస్తుంది.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: పరిశుద్ధాత్మ
  rationale: మూలపాఠంలోని దైవిక వ్యక్తికి ప్రామాణికమైన ఆధునిక తెలుగు పదం.
- source_word: Τὸν ἄνδρα οὗ ἐστιν ἡ ζώνη αὕτη
  choice: ఈ నడుము పట్టా ఎవరిదో, ఆ మనిషిని
  rationale: సంబంధార్థాన్ని అచ్చంగా నిలుపుతూ తెలుగులో సహజమైన నిర్మాణాన్ని ఉపయోగిస్తుంది; పౌలు అని నేరుగా చేర్చి ప్రవచన వాక్యరూపాన్ని మార్చదు.
- source_word: οὕτως
  choice: ఇలాగే
  rationale: అగబు చేసిన సూచక క్రియకూ తరువాత జరగబోయే బంధనానికీ ఉన్న ప్రత్యక్ష సంబంధాన్ని తెలియజేస్తుంది.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: మూలంలో నాయకులు అనే పరిమితి లేదు. కాబట్టి అదనపు నిర్దిష్టతను చేర్చకుండా సాధారణ సమూహపదాన్నే ఉంచుతుంది.
- source_word: παραδώσουσιν
  choice: అప్పగిస్తారు
  rationale: ఒకరి అధికారంలోకి మరొకరిని అప్పగించే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰς χεῖρας ἐθνῶν
  choice: యూదేతరుల చేతికి
  rationale: ఇక్కడ ἔθνη యూదులు కానివారిని సూచిస్తుంది. ‘చేతికి’ అనే ప్రయోగం వారి అధికారానికి అప్పగించబడే మూలపాఠపు రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పరిశుద్ధాత్మ పలికే ప్రవచన సూత్రం
  choice: పరిశుద్ధాత్మ ఇలా చెబుతున్నాడు
  alternative: పరిశుద్ధాత్మ చెప్పేది ఇదే
  rationale: మూలంలోని Τάδε λέγει ప్రవచనాధికారాన్ని ప్రకటించే సూత్రం. ఎటువంటి అదనపు సిద్ధాంత వివరణ లేకుండా దాని ప్రత్యక్ష వాక్య స్వరూపాన్ని నిలుపుతుంది.
- issue: ἑαυτοῦ ఎవరిని సూచిస్తుంది
  choice: అగబు తన కాళ్లను, చేతులను కట్టుకున్నాడు
  alternative: అగబు పౌలు కాళ్లను, చేతులను కట్టాడు
  rationale: ప్రతిబింబ సర్వనామం సహజంగా కృదంత క్రియకు కర్త అయిన అగబునే సూచిస్తుంది. కాబట్టి ఇది అతడు తనపై ప్రదర్శించిన ప్రవచనాత్మక సూచక క్రియగా అనువదించబడింది.
- issue: ἐθνῶν యొక్క సందర్భార్థం
  choice: యూదేతరులు
  alternative: అన్యజనులు
  rationale: రెండూ సాధ్యమైనప్పటికీ, యెరూషలేములోని యూదులకు వ్యతిరేకంగా ఉంచబడిన యూదులు కాని అధికారులను ‘యూదేతరులు’ సాధారణ ఆధునిక పాఠకులకు స్పష్టంగా సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన ప్రవచన స్వరాన్ని కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. మూలపాఠంలో అవసరం లేని వివరణను ప్రధాన వాక్యంలో చేర్చలేదు.
