id: ACT.21.9
reference: Acts 21:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τούτῳ δὲ ἦσαν θυγατέρες ⸂τέσσαρες παρθένοι⸃ προφητεύουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/009.yaml
  text: He had four unmarried daughters who were prophesying.
translation:
  language: te
  text: అతనికి ప్రవచించే నలుగురు కన్యలైన కుమార్తెలు ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτῳ
  choice: అతనికి
  rationale: ఈ సూచన సర్వనామం ముందున్న ఫిలిప్పును సూచిస్తుంది; గ్రీకు దత్తివిభక్తి నిర్మాణాన్ని తెలుగులో సహజమైన స్వామ్య నిర్మాణంగా వ్యక్తపరుస్తుంది.
- source_word: δὲ
  choice: —
  rationale: ఇక్కడ ఇది స్వల్ప అనుసంధాన అవ్యయం; తెలుగు వాక్యప్రవాహంలో ప్రత్యేక పదం లేకుండానే సంబంధం స్పష్టంగా ఉంటుంది.
- source_word: ἦσαν
  choice: ఉన్నారు
  rationale: τούτῳ ... ἦσαν అనే అస్తిత్వార్థక నిర్మాణం తెలుగులో ‘అతనికి ... ఉన్నారు’ అని సహజంగా వస్తుంది.
- source_word: θυγατέρες
  choice: కుమార్తెలు
  rationale: కుటుంబ సంబంధాన్ని ఖచ్చితంగా తెలిపే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: τέσσαρες
  choice: నలుగురు
  rationale: వ్యక్తులను లెక్కించే తెలుగు సంఖ్యారూపం.
- source_word: παρθένοι
  choice: కన్యలైన
  rationale: పదం ప్రధానంగా కన్యత్వాన్ని సూచిస్తుంది; ‘పెళ్లికాని’ అని మాత్రమే అనువదిస్తే దాని లైంగిక భావాంశం తగ్గిపోతుంది. ‘కన్యలైన కుమార్తెలు’ మూలానికి దగ్గరగా ఉండి తెలుగులో గౌరవప్రదంగా ఉంటుంది.
- source_word: προφητεύουσαι
  choice: ప్రవచించే
  rationale: వర్తమాన క్రియాభావ విశేషణం కుమార్తెలను వర్ణిస్తూ వారి కొనసాగుతున్న లేదా లక్షణాత్మక కార్యాన్ని సూచిస్తుంది.
theological_decisions:
- issue: παρθένοι అనే పదం మరియు స్త్రీల ప్రవచన కార్యం
  choice: కన్యలైన
  alternative: పెళ్లికాని
  rationale: వాక్యం వారి కన్యత్వాన్ని, ప్రవచించే కార్యాన్ని రెండింటినీ తెలుపుతుంది; వాటి మధ్య ఏ సిద్ధాంత సంబంధాన్నీ వివరించదు. అందువల్ల రెండింటినీ యథాతథంగా పేర్కొని, సంబంధాన్ని ఊహించి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా మూలంలోని సంక్షిప్తతను మరియు గౌరవప్రదమైన శైలిని నిలిపింది.
