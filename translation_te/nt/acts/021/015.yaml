  yaml_path: translation/nt/acts/021/015.yaml
  text: After these days[a], having packed up, we went up to Jerusalem.
translation:
  language: te
  text: ఆ రోజులు గడిచిన తర్వాత, మేము ప్రయాణానికి సిద్ధమై[a] యెరూషలేముకు పైకి వెళ్లాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సామాను సర్దుకొని.” గ్రీకు పదం కేవలం సామాను సర్దుకోవడాన్నే కాకుండా, ప్రయాణానికి సాధారణంగా సిద్ధపడడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὰς ἡμέρας ταύτας
  choice: ఆ రోజులు గడిచిన తర్వాత
  rationale: μετά + accusative కాలక్రమంలో ‘తర్వాత’ అనే భావాన్ని ఇస్తుంది. సందర్భంలో వెంటనే ముందు చెప్పిన రోజులనే ఇది సూచిస్తుంది; సహజమైన తెలుగుకోసం ‘గడిచిన’ అని స్పష్టపరచబడింది.
- source_word: ἐπισκευασάμενοι
  choice: ప్రయాణానికి సిద్ధమై
  rationale: ఈ participle ప్రయాణానికి అవసరమైన ఏర్పాట్లు చేసుకోవడం లేదా సామాను సర్దుకోవడం అనే విస్తృత భావాన్ని కలిగి ఉంది. కేవలం సామాను సర్దుకున్నారనే అర్థానికి పరిమితం చేయకుండా ‘ప్రయాణానికి సిద్ధమై’ అని అనువదించబడింది.
- source_word: ἀνεβαίνομεν
  choice: వెళ్లాము
  rationale: ఇది గతకాల ప్రయాణ వర్ణనలోని imperfect. యెరూషలేముకు వెళ్లడాన్ని గ్రీకులో ‘పైకి వెళ్లడం’గా చెప్పడం సాంప్రదాయికమైనప్పటికీ, ఆధునిక సహజ తెలుగులో ‘వెళ్లాము’ స్పష్టంగా ఉంటుంది; భౌగోళిక ఆరోహణ భావం ప్రధానంగా ఉద్దేశించబడిందని నిర్ధారించకుండా ఉంటుంది.
- source_word: εἰς Ἱεροσόλυμα
  choice: యెరూషలేముకు
  rationale: εἰς నగరం వైపు కదలికను సూచిస్తుంది. తెలుగులో గమ్యాన్ని సహజంగా ‘యెరూషలేముకు’ అని వ్యక్తపరుస్తారు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. మూలంలోని ప్రయాణ సందర్భాన్ని నిలుపుతూ, ἐπισκευασάμενοι పదంలోని విస్తృత అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, మరింత నిర్దిష్టమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
