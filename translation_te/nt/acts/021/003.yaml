source:
  edition: SBLGNT
  text: ⸀ἀναφάναντες δὲ τὴν Κύπρον καὶ καταλιπόντες αὐτὴν εὐώνυμον ἐπλέομεν εἰς Συρίαν, καὶ ⸀κατήλθομεν εἰς Τύρον, ἐκεῖσε γὰρ ⸂τὸ πλοῖον ἦν⸃ ἀποφορτιζόμενον τὸν γόμον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/003.yaml
  text: After sighting Cyprus and leaving it on our left[a], we sailed on to Syria and came down to Tyre[d][c][b], for there the ship was unloading its cargo.
translation:
  language: te
  text: కుప్రు కనబడిన తరువాత[a], దాన్ని మా ఎడమవైపున వదిలి సిరియాకు ఓడలో ప్రయాణించాము. తరువాత తూరుకు చేరుకున్నాము[b], ఎందుకంటే అక్కడ ఆ ఓడ తన సరుకును దించుతోంది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కుప్రు కనబడేంత దూరానికి వచ్చిన తరువాత.”
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు మూలంలో మరింత అక్షరార్థంగా, “తూరుకు దిగివచ్చాము.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “అక్కడ ఓడలోని సరుకు దించబడుతోంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναφάναντες
  choice: కుప్ర కనిపించగానే
  rationale: ద్వీపం ప్రయాణికుల కంటికి కనిపించడాన్ని సూచించే నౌకాయాన సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ప్రధాన క్రియకు ముందున్న చర్యను కూడా తెలియజేస్తుంది.
- source_word: καταλιπόντες αὐτὴν εὐώνυμον
  choice: దాన్ని మా ఎడమవైపున వదిలి
  rationale: εὐώνυμον అనే పదంలోని ‘ఎడమవైపు’ భావాన్ని కాపాడుతూ, సాంకేతిక నౌకాయాన పదజాలం లేకుండా సాధారణ పాఠకులకు స్పష్టంగా ఉంది.
- source_word: ἐπλέομεν εἰς Συρίαν
  choice: సిరియాకు ఓడలో ప్రయాణించాము
  rationale: ἐπλέομεν యొక్క కొనసాగుతున్న సముద్ర ప్రయాణ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: κατήλθομεν εἰς Τύρον
  choice: తూరుకు చేరుకున్నాము
  rationale: κατέρχομαι అక్షరార్థంగా ‘దిగివచ్చాము’ అని ఉండగలిగినా, ఇక్కడ ప్రయాణ గమ్యానికి చేరడమే సందర్భార్థం; తెలుగు ప్రయాణ వర్ణనలో ‘చేరుకున్నాము’ సహజం. అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἀποφορτιζόμενον τὸν γόμον
  choice: ఆ ఓడ తన సరుకును దించాల్సి ఉంది
  rationale: SBLGNT పాఠంలోని τὸ πλοῖον ἦν ἀποφορτιζόμενον నిర్మాణం ఓడ సరుకును దించే ఉద్దేశంతో అక్కడ ఉండటాన్ని సూచించగలదు. తెలుగు వాక్యంలో ఓడను కర్తగా ఉంచి సహజంగా అనువదించాం; కర్మణి అర్థసాధ్యతను పాదసూచికలో నిలిపాం.
