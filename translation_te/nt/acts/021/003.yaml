translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ప్రయాణ వర్ణన. ‘ఎడమవైపున’ అనే మూలపాఠ వివరాన్ని ప్రధాన వాక్యంలోనే నిలిపి, గ్రీకు క్రియారూపాల్లోని నిజమైన ప్రత్యామ్నాయ అర్థాలను పాదసూచికల్లో ఇచ్చాం.
