translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని ప్రయాణ క్రమం, కుటుంబ సమేతంగా సాగనంపడం, తీరంలో మోకరించి ప్రార్థించడం స్పష్టంగా నిలుపబడ్డాయి. ఆంగ్ల సంప్రదింపుల పాఠ్యంలో [a] గుర్తు రోజులకు జతచేయబడినా, దాని పాదసూచిక προπέμπω గురించి ఉన్నందున తెలుగు ప్రధాన పాఠ్యంలో సంబంధిత ‘తోడుగా వచ్చారు’ తరువాత ఉంచబడింది.
