id: ACT.21.5
reference: Acts 21:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐγένετο ⸂ἐξαρτίσαι ἡμᾶς⸃ τὰς ἡμέρας, ἐξελθόντες ἐπορευόμεθα προπεμπόντων ἡμᾶς πάντων σὺν γυναιξὶ καὶ τέκνοις ἕως ἔξω τῆς πόλεως, καὶ θέντες τὰ γόνατα ἐπὶ τὸν αἰγιαλὸν ⸀προσευξάμενοι
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/005.yaml
  text: When it came time for us to complete those days[a], we departed and went on our way, while they all, with wives and children, were accompanying us as far as outside the city. And after kneeling down on the beach[b], we prayed.
translation:
  language: te
  text: మేము ఆ రోజులను పూర్తిచేసే సమయం వచ్చినప్పుడు, బయలుదేరి ప్రయాణం సాగాము. వారందరూ తమ భార్యలు, పిల్లలతో కలిసి పట్టణం బయటివరకు మాకు తోడుగా వచ్చారు[a]. సముద్రతీరంలో[b] మోకాళ్లు మోపి మేము ప్రార్థించాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారందరూ మమ్మల్ని సాగనంపడానికి వచ్చారు.” గ్రీకు క్రియ, బయలుదేరుతున్నవారికి వీడ్కోలు పలుకుతూ వారితో కొంతదూరం వెళ్లడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఒడ్డున” లేదా “ఇసుకతీరంలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐξαρτίσαι ἡμᾶς τὰς ἡμέρας
  choice: ఆ రోజులను మేము పూర్తిచేయవలసిన సమయం వచ్చినప్పుడు
  rationale: ἐγένετο + infinitive సూచించే సమయం రావడాన్ని, అలాగే ἐξαρτίσαιలోని నిర్ణీత కాలాన్ని పూర్తిచేయడం అనే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐξελθόντες ἐπορευόμεθα
  choice: బయలుదేరి మా ప్రయాణం కొనసాగించాము
  rationale: మొదట బయలుదేరడం, ఆపై ప్రయాణిస్తూ వెళ్లడం అనే రెండు దశలను సహజంగా వ్యక్తం చేస్తుంది; imperfect క్రియలోని కొనసాగింపు భావాన్ని కూడా సూచిస్తుంది.
- source_word: προπεμπόντων ἡμᾶς πάντων
  choice: వారందరూ ... మాకు తోడుగా వచ్చారు
  rationale: ప్రయాణమవుతున్న వారిని వీడ్కోలుగా కొంతదూరం వెంట వెళ్లడం అనే προπέμπω భావాన్ని సందర్భానుకూలంగా అందిస్తుంది.
- source_word: σὺν γυναιξὶ καὶ τέκνοις
  choice: తమ భార్యాపిల్లలతో కలిసి
  rationale: πάντων అనే పుంలింగ బహువచనంతో కూడిన కుటుంబ సందర్భంలో γυναιξίకి ‘భార్యలు’ అనే అర్థం సహజం; ‘భార్యాపిల్లలు’ ఆధునిక తెలుగులో సులభంగా అర్థమవుతుంది.
- source_word: ἕως ἔξω τῆς πόλεως
  choice: పట్టణం బయటివరకు
  rationale: పట్టణ సరిహద్దులు దాటి ఉన్న స్థానం వరకు వెంట వచ్చిన దిశా-పరిమితి భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: θέντες τὰ γόνατα
  choice: మోకాళ్లూని
  rationale: అక్షరార్థంగా ‘మోకాళ్లు ఉంచి’ అనే గ్రీకు నుడికారాన్ని ప్రార్థనార్థం మోకరించడం అనే సహజ తెలుగు నుడికారంతో అనువదిస్తుంది.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: సముద్రతీరంలో
  rationale: αἰγιαλός సూచించే నీటి అంచుననున్న తీరం లేదా ఇసుకతీరాన్ని సందర్భానికి తగిన గౌరవప్రదమైన సాధారణ పదంతో అందిస్తుంది.
- source_word: προσευξάμενοι
  choice: మేము ప్రార్థించాము
  rationale: మొదటి పురుష బహువచన ప్రయాణ వర్ణనను కొనసాగిస్తూ, గ్రీకు participleను తెలుగులో సహజమైన సమాపక క్రియగా వ్యక్తం చేస్తుంది.
