source:
  edition: SBLGNT
  text: τοῦτο οὖν ποίησον ὅ σοι λέγομεν· εἰσὶν ἡμῖν ἄνδρες τέσσαρες εὐχὴν ἔχοντες ⸀ἀφ’ ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/023.yaml
  text: 'Therefore do what we tell you: we have four men who are under a vow of their own[a][b].'
translation:
  language: te
  text: 'కాబట్టి మేము నీకు చెప్పేది చేయి: తమ మీద ఒక మొక్కుబడి ఉన్న నలుగురు పురుషులు మాతో ఉన్నారు[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మొక్కుబడి చేసుకున్నవారు.” గ్రీకు వాక్యం అక్షరార్థంగా “మొక్కుబడి కలిగియున్నవారు” అని చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: విస్తృత సందర్భం ఇది నాజీరు తరహా మొక్కుబడి కావచ్చని సూచిస్తుంది; అయితే ఈ వచనం స్వయంగా “ఒక మొక్కుబడి” అని మాత్రమే చెబుతుంది.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο οὖν
  choice: కాబట్టి
  rationale: οὖν ముందున్న విషయాలనుంచి వచ్చే నిర్ణయాన్ని సూచిస్తుంది. τοῦτο భావం తరువాతి ‘మేము నీతో చెప్పేది చేయి’ అనే ఆజ్ఞలో సహజంగా ఇమిడింది.
- source_word: ποίησον
  choice: చేయి
  rationale: ποίησον ఏకవచన aorist imperative; ఇక్కడ నేరుగా, సహజంగా ‘చేయి’ అని అనువదించవచ్చు.
- source_word: ὅ σοι λέγομεν
  choice: మేము నీతో చెప్పేది
  rationale: సంబంధవాచక నిర్మాణాన్ని ఆధునిక తెలుగులో సహజమైన కర్మవాచక పదబంధంగా ఇచ్చింది; వర్తమాన కాల భావాన్ని నిలుపుతుంది.
- source_word: εἰσὶν ἡμῖν
  choice: మా వద్ద ఉన్నారు
  rationale: ఉనికిని సూచించే క్రియతో కూడిన దత్తివిభక్తి ἡμῖν ఇక్కడ సమూహానికి సంబంధించినవారనే భావం ఇస్తుంది; ‘మా వద్ద ఉన్నారు’ తెలుగులో సహజంగా ఉంది.
- source_word: ἄνδρες τέσσαρες
  choice: నలుగురు మనుషులు
  rationale: ἀνήρ ఇక్కడ వయోజన పురుషులను సూచిస్తుంది; ‘నలుగురు మనుషులు’ లింగసూచనను, వ్యక్తుల భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εὐχὴν ἔχοντες
  choice: ఒక మొక్కుబడి ఉన్న
  rationale: గ్రీకు పదబంధం అక్షరార్థంగా ‘మొక్కుబడి కలిగియున్న’ అని ఉంటుంది. కొనసాగుతున్న బద్ధతను తెలుగులో అర్థమయ్యేలా చెప్పి, వారు ఏ రకమైన మొక్కుబడి చేశారో అదనంగా నిర్దేశించలేదు.
- source_word: ἀφ’ ἑαυτῶν
  choice: తమపై
  rationale: ఈ పదబంధం మొక్కుబడి వారిపైనే ఉందనే భావాన్ని తెలియజేస్తుంది. ‘తమపై’ మూలంలోని reflexive భావాన్ని సంక్షిప్తంగా కాపాడుతుంది.
theological_decisions:
- issue: మొక్కుబడి స్వభావం
  choice: ప్రధాన పాఠ్యంలో సాధారణంగా ‘ఒక మొక్కుబడి’ అని మాత్రమే పేర్కొనడం
  alternative: ‘నాజీరు మొక్కుబడి’ అని నిర్దిష్టంగా పేర్కొనడం
  rationale: విస్తృత సందర్భం నాజీరు తరహా మొక్కుబడిని సూచించవచ్చు; అయితే ఈ వచనంలోని εὐχή పదం కేవలం ‘మొక్కుబడి’ అని మాత్రమే చెబుతుంది. అందువల్ల మూలపాఠం చెప్పినదానికంటే ఎక్కువ నిర్దిష్టతను ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘తమపై ఒక మొక్కుబడి ఉన్న’ అనే నిర్మాణం కొంత మూలరూపానికి దగ్గరగా ఉన్నప్పటికీ, ἀφ’ ἑαυτῶν లోని భావాన్ని ఊహాత్మకంగా విస్తరించకుండా నిలుపుతుంది.
