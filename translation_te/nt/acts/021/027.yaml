source:
  edition: SBLGNT
  text: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι, οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι θεασάμενοι αὐτὸν ἐν τῷ ἱερῷ συνέχεον πάντα τὸν ὄχλον καὶ ἐπέβαλον ⸂ἐπ’ αὐτὸν τὰς χεῖρας⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/027.yaml
  text: As the seven days were about to be completed[a], the Jews from Asia, seeing him in the temple, stirred up the whole crowd and laid hands on him[c][b],
translation:
  language: te
  text: ఆ ఏడు రోజులు ముగియబోతుండగా, ఆసియా ప్రాంతం నుండి వచ్చిన యూదులు ఆలయ ప్రాంగణంలో అతణ్ణి చూసి, జనసమూహమంతటినీ రెచ్చగొట్టి[a], అతణ్ణి బలవంతంగా పట్టుకున్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జనసమూహమంతటినీ గందరగోళంలో పడేశారు.” గ్రీకు క్రియ జనాన్ని రెచ్చగొట్టడం లేదా గందరగోళపరచడం—ఈ రెండింటిలో దేనినైనా నొక్కిచెప్పగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అతనిపై చేతులు వేశారు.” ఇది ఒకరిని బలవంతంగా పట్టుకోవడాన్ని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι
  choice: ఆ ఏడు రోజులు ముగియబోతుండగా
  rationale: μέλλω మరియు συντελεῖσθαι కలయిక సమయం పూర్తికావడం సమీపించిందనే భావాన్ని ఇస్తుంది. సందర్భంలోని నిర్దిష్ట ఏడు రోజుల కాలాన్ని ‘ఆ ఏడు రోజులు’ సహజంగా సూచిస్తుంది.
- source_word: οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι
  choice: ఆసియా ప్రాంతం నుండి వచ్చిన యూదులు
  rationale: ఇక్కడ Ἀσία ఆధునిక ఆసియా ఖండం కంటే రోమా పరిపాలనలోని ఆసియా ప్రాంతాన్ని సూచిస్తుంది; ‘ప్రాంతం’ అనే పదం ఆధునిక అపార్థాన్ని తగ్గిస్తుంది.
- source_word: θεασάμενοι αὐτὸν ἐν τῷ ἱερῷ
  choice: ఆలయ ప్రాంగణంలో అతణ్ణి చూసి
  rationale: ἱερόν ఆలయ అంతర్భాగమైన పరిశుద్ధ స్థలాన్ని మాత్రమే కాక మొత్తం ఆలయ సముదాయాన్ని సూచిస్తుంది. ఈ సంఘటనకు సహజమైన స్థలాన్ని తెలుపుతూ ‘ఆలయ ప్రాంగణం’ మూలార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: συνέχεον πάντα τὸν ὄχλον
  choice: జనసమూహమంతటినీ రెచ్చగొట్టి
  rationale: συγχέω ఇక్కడ జనాన్ని కలవరపరచడం, గందరగోళంలో పడేయడం, ఉద్రిక్తం చేయడం అనే విస్తృత భావం కలిగి ఉంది. గుంపు చర్యకు ప్రేరేపించబడిన సందర్భంలో ‘రెచ్చగొట్టి’ సహజంగా సరిపోతుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐπέβαλον ἐπ’ αὐτὸν τὰς χεῖρας
  choice: అతణ్ణి బలవంతంగా పట్టుకున్నారు
  rationale: ‘అతనిపై చేతులు వేశారు’ అనే అక్షరార్థ రూపం తెలుగులో ఉద్దేశించిన శారీరక నిర్బంధాన్ని స్పష్టంగా తెలియజేయకపోవచ్చు. ఈ గ్రీకు నుడికారం బలవంతంగా పట్టుకోవడాన్ని సూచిస్తుంది; అందువల్ల అర్థాన్ని సహజంగా వ్యక్తం చేశాం.
