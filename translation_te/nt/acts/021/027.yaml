translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ‘ఆలయ ప్రాంగణం’ ద్వారా ἱερόν యొక్క విస్తృత స్థలార్థం ప్రధాన పాఠ్యంలోనే స్పష్టమైంది; అందువల్ల దానికి ప్రత్యేక పాదసూచిక అవసరం లేదు.
