translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. గ్రీకు వాక్యంలోని వరుస ‘మరియు’లను యాంత్రికంగా పునరావృతం చేయకుండా, సంఘటనల వేగవంతమైన క్రమాన్ని చిన్న వాక్యాల ద్వారా నిలుపుకున్నాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
