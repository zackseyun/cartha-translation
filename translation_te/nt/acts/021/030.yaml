source:
  edition: SBLGNT
  text: ἐκινήθη τε ἡ πόλις ὅλη καὶ ἐγένετο συνδρομὴ τοῦ λαοῦ, καὶ ἐπιλαβόμενοι τοῦ Παύλου εἷλκον αὐτὸν ἔξω τοῦ ἱεροῦ, καὶ εὐθέως ἐκλείσθησαν αἱ θύραι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/030.yaml
  text: And the whole city was stirred up[a], and a crowd of the people formed; and after seizing Paul, they dragged him outside the temple[c][b], and immediately the doors were shut.
translation:
  language: te
  text: పట్టణమంతా కలవరపడింది; ప్రజలు గుంపుగా పరుగెత్తుకొచ్చారు[a]. వారు పౌలును పట్టుకొని దేవాలయ ప్రాంగణం[b] వెలుపలికి ఈడ్చుకెళ్తుండగా, వెంటనే ద్వారాలు[c] మూసివేయబడ్డాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రజలు ఒక్కసారిగా గుమికూడారు.’ గ్రీకు పదబంధం వారు ఒకచోటికి వేగంగా చేరడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘దేవాలయ ప్రాంగణం’ అని అనువదించిన గ్రీకు పదం అంతర్గర్భాలయాన్ని మాత్రమే కాక దేవాలయ సముదాయం లేదా ఆవరణాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘తలుపులు.’ ఈ దేవాలయ సందర్భంలో గ్రీకు పదం ప్రవేశ ద్వారాలను లేదా తలుపులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκινήθη τε ἡ πόλις ὅλη
  choice: పట్టణమంతా కలవరపడింది
  rationale: κινέω కర్తరి కాని రూపం ఇక్కడ అక్షరార్థమైన కదలికను కాక, పట్టణమంతటా చెలరేగిన ఆందోళనను సూచిస్తుంది. ‘కలవరపడింది’ ఆధునిక తెలుగులో సహజంగా ఈ సామూహిక అశాంతిని తెలియజేస్తుంది.
- source_word: ἐγένετο συνδρομὴ τοῦ λαοῦ
  choice: ప్రజలు గుంపుగా పరుగెత్తుకొచ్చారు
  rationale: συνδρομή ప్రజలు ఒక్కసారిగా ఒకచోటికి పరుగెత్తి రావడం లేదా గుమికూడడాన్ని సూచిస్తుంది. కేవలం ‘గుంపు ఏర్పడింది’ కంటే ఈ అనూహ్య సమాగమంలోని చలనాన్ని తెలుగు వాక్యం స్పష్టంగా ఉంచుతుంది.
- source_word: ἐπιλαβόμενοι τοῦ Παύλου
  choice: వారు పౌలును పట్టుకొని
  rationale: ἐπιλαμβάνομαι ఇక్కడ బలంగా పట్టుకోవడాన్ని సూచిస్తుంది. ‘పట్టుకొని’ బలవంతపు చర్యను సహజంగా తెలియజేస్తూ తదుపరి క్రియతో అనుసంధానిస్తుంది.
- source_word: εἷλκον αὐτὸν
  choice: అతణ్ణి ఈడ్చుకెళ్లారు
  rationale: ἕλκω బలవంతంగా లాగడాన్ని సూచిస్తుంది; అసంపూర్ణ భూతకాల రూపం చర్య కొనసాగుతున్న స్వభావాన్ని చూపుతుంది. ‘ఈడ్చుకెళ్లారు’ గమనం మరియు బలవంతం రెండింటినీ సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔξω τοῦ ἱεροῦ
  choice: దేవాలయ ప్రాంగణం వెలుపలికి
  rationale: ἱερόν ఇక్కడ అంతర్గర్భాలయాన్ని మాత్రమే కాక మొత్తం దేవాలయ సముదాయం లేదా ఆవరణాన్ని సూచిస్తుంది. ‘దేవాలయ ప్రాంగణం’ ఆ పరిధిని ప్రధాన పాఠ్యంలోనే స్పష్టం చేస్తుంది.
- source_word: εὐθέως
  choice: వెంటనే
  rationale: ఆలస్యం లేకుండా జరిగిన చర్యను తెలిపే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: ἐκλείσθησαν αἱ θύραι
  choice: ద్వారాలు మూసివేయబడ్డాయి
  rationale: θύραι తలుపులు లేదా ప్రవేశ ద్వారాలను సూచించగలదు. దేవాలయ సందర్భంలో ‘ద్వారాలు’ రెండింటికీ సరిపడే గౌరవప్రదమైన పదం; కర్తరి కాని రూపాన్ని కూడా నిలుపుతుంది.
