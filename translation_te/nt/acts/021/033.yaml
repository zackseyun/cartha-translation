id: ACT.21.33
reference: Acts 21:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂τότε ἐγγίσας⸃ ὁ χιλίαρχος ἐπελάβετο αὐτοῦ καὶ ἐκέλευσε δεθῆναι ἁλύσεσι δυσί, καὶ ἐπυνθάνετο ⸀τίς εἴη καὶ τί ἐστιν πεποιηκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/033.yaml
  text: Then the commander came up[a], seized him, and ordered him to be bound with two chains[b], and was asking who he was and what he had done.
translation:
  language: te
  text: అప్పుడు సైన్యాధికారి[a] దగ్గరకు వచ్చి, అతణ్ణి పట్టుకొని, రెండు గొలుసులతో[b] బంధించమని ఆజ్ఞాపించాడు. ఆ మనిషి ఎవరో, ఏమి చేశాడో అడుగుతూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సహస్రాధిపతి.’ గ్రీకు పదం χιλίαρχος రోమా సైనిక అధికారిని సూచిస్తుంది; అక్షరార్థంగా ‘వెయ్యిమందికి అధిపతి.’
    reason: lexical_alternative
  - marker: b
    text: ‘రెండు గొలుసులు’ అనే మాట, యెరూషలేములో పౌలు బంధించబడతాడని అపొస్తలుల కార్యాలు 21:11లో చెప్పిన ప్రవచనాన్ని ప్రతిధ్వనింపజేస్తూ ఉండవచ్చు.
    reason: cross_reference
lexical_decisions:
- source_word: χιλίαρχος
  choice: సహస్రాధిపతి
  rationale: రోమా సైన్యంలో ఒక దళానికి అధిపతిగా ఉన్న అధికారిని సూచించే గ్రీకు పదానికి ఇది సంక్షిప్తమైన, గౌరవప్రదమైన తెలుగు రూపం; దాని అక్షరార్థమైన ‘వెయ్యిమందికి అధిపతి’ అనే భావాన్నీ నిలుపుతుంది.
- source_word: ἐγγίσας
  choice: దగ్గరకు వచ్చి
  rationale: ప్రధాన చర్యకు ముందు అతడు సమీపించిన క్రమాన్ని సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: ἐπελάβετο αὐτοῦ
  choice: అతణ్ణి పట్టుకొని
  rationale: పౌలును శారీరకంగా అదుపులోకి తీసుకున్న సందర్భాన్ని తెలియజేస్తుంది; ‘పట్టుకొని’ అనేది మూలంలోని పట్టుకోవడం అనే భావాన్ని అతిగా తీవ్రం చేయకుండా నిలుపుతుంది.
- source_word: ἐκέλευσε δεθῆναι
  choice: బంధించమని ఆజ్ఞాపించాడు
  rationale: అధికారపూర్వక ఆజ్ఞను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; గ్రీకులోని కర్మణి భావం తెలుగులోని అనిర్దిష్ట కర్త నిర్మాణంలో సహజంగా నిలుస్తుంది.
- source_word: ἁλύσεσι δυσί
  choice: రెండు గొలుసులతో
  rationale: నిర్బంధ సందర్భంలో ἅλυσις యొక్క సాధారణ అర్థాన్ని నేరుగా అందిస్తుంది; ముందటి ప్రవచనంతో ఉండగల ప్రతిధ్వనిని ప్రధాన వాక్యంలో వివరించదు.
- source_word: ἐπυνθάνετο
  choice: అడుగుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న విచారణ భావాన్ని నిలుపుతుంది.
- source_word: τίς εἴη
  choice: అతడు ఎవరో
  rationale: గతకాల క్రియను అనుసరించే పరోక్ష ప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τί ἐστιν πεποιηκώς
  choice: ఏమి చేశాడో
  rationale: పూర్తయినప్పటికీ ప్రస్తుత పరిస్థితికి సంబంధించిన చర్యను తెలుగు పరోక్ష ప్రశ్నలో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘రెండు గొలుసులు’ మరియు అపొస్తలుల కార్యాలు 21:11లోని ప్రవచనం మధ్య సంబంధం
  choice: ప్రధాన పాఠంలో కేవలం ‘రెండు గొలుసులతో’ అని అనువదించి, సాధ్యమైన ప్రతిధ్వనిని పాదటిప్పణిలో సూచించడం
  alternative: ఇది ప్రవచన నెరవేర్పు అని ప్రధాన పాఠంలో స్పష్టంగా చెప్పడం
  rationale: మూల వాక్యం రెండు గొలుసులను మాత్రమే పేర్కొంటుంది; ప్రవచనంతో సంబంధం ఉండవచ్చు గాని, దానిని ఇక్కడ ప్రత్యక్షంగా వ్యాఖ్యానించదు. అందువల్ల ఆ సంబంధాన్ని నిర్ధారిత సిద్ధాంతంగా కాక సాధ్యమైన ప్రతిధ్వనిగా ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘సహస్రాధిపతి’ కొంత అధికారిక పదమైనందున సాధారణ పాఠకునికి వివరణగా పాదటిప్పణి ఇవ్వబడింది; కొనసాగుతున్న విచారణను ‘అడుగుతూ ఉన్నాడు’ ద్వారా నిలిపాం.
