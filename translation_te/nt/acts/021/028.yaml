id: ACT.21.28
reference: Acts 21:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κράζοντες· Ἄνδρες Ἰσραηλῖται, βοηθεῖτε· οὗτός ἐστιν ὁ ἄνθρωπος ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου πάντας ⸀πανταχῇ διδάσκων, ἔτι τε καὶ Ἕλληνας εἰσήγαγεν εἰς τὸ ἱερὸν καὶ κεκοίνωκεν τὸν ἅγιον τόπον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/028.yaml
  text: shouting[a], “Men of Israel, help! This is the man who teaches everyone everywhere against the people and the law and this place. And besides that, he has even brought Greeks into the temple and has defiled this holy place.”
translation:
  language: te
  text: వారు కేకలు వేస్తూ, “ఇశ్రాయేలు పురుషులారా, సహాయం చేయండి! ప్రజలకు, ధర్మశాస్త్రానికి, ఈ స్థలానికి విరోధంగా ప్రతిచోటా అందరికీ బోధించేవాడు ఇతడే. అంతేకాక, ఇతడు గ్రీకువారిని దేవాలయ ప్రాంగణంలోకి[a] తీసుకువచ్చి, ఈ పవిత్ర స్థలాన్ని అపవిత్రం చేశాడు” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదమైన ἱερόν అంతర్గత పరిశుద్ధ మందిరాన్ని మాత్రమే కాక, దేవాలయ సముదాయాన్ని లేదా దాని ఆవరణలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράζοντες
  choice: కేకలు వేస్తూ
  rationale: వర్తమాన కృదంతం వారి ఆరోపణను ఏ విధంగా ప్రకటించారో తెలియజేస్తుంది; ఈ పదబంధం బహిరంగమైన, అత్యవసరమైన కేకను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: ఇశ్రాయేలు పురుషులారా
  rationale: సంబోధనలోని పురుష లింగ సూచనను నిలుపుతూ, ఇశ్రాయేలు సమాజానికి చేసిన పిలుపును స్పష్టంగా తెలియజేస్తుంది.
- source_word: βοηθεῖτε
  choice: సహాయం చేయండి!
  rationale: ఇది సహాయం కోరే ఆజ్ఞార్థక కేక. మూలంలో స్పష్టంగా లేని ‘మాకు’ అనే పదాన్ని చేర్చలేదు.
- source_word: οὗτός ἐστιν ὁ ἄνθρωπος
  choice: ఇతడే
  rationale: గుర్తింపుతో కూడిన ఆరోపణాత్మక బలాన్ని తెలుగులో సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου
  choice: ప్రజలకు, ధర్మశాస్త్రానికి, ఈ స్థలానికి విరోధంగా
  rationale: κατά + షష్ఠీ విభక్తి సూచించే వ్యతిరేకతను నిలుపుతుంది. సందర్భంలో νόμος మోషే ధర్మశాస్త్రాన్ని సూచిస్తున్నందున ‘ధర్మశాస్త్రం’ అని అనువదించబడింది.
- source_word: πάντας πανταχῇ διδάσκων
  choice: ప్రతిచోటా అందరికీ బోధించేవాడు
  rationale: ‘అందరికీ’ మరియు ‘ప్రతిచోటా’ అనే రెండు విస్తృతార్థక పదాల ఉద్ఘాటనను పూర్తిగా నిలుపుతుంది.
- source_word: ἔτι τε καὶ
  choice: అంతేకాక
  rationale: ముందటి ఆరోపణకు మరొక తీవ్రమైన ఆరోపణను జోడించే సంచయార్థక బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: Ἕλληνας
  choice: గ్రీకువారిని
  rationale: మూలపదం విస్తృతార్థక ‘అన్యజనులు’ కంటే నిర్దిష్టంగా గ్రీకువారిని సూచిస్తుంది.
- source_word: εἰσήγαγεν εἰς τὸ ἱερὸν
  choice: దేవాలయ ప్రాంగణంలోకి తీసుకువచ్చి
  rationale: ἱερόν అంతర్గత పరిశుద్ధ మందిరాన్ని మాత్రమే కాక దేవాలయ సముదాయాన్ని లేదా ఆవరణలను సూచిస్తుంది; ‘దేవాలయ ప్రాంగణం’ చారిత్రక సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: κεκοίνωκεν
  choice: అపవిత్రం చేశాడు
  rationale: ఆరాధనా-శుద్ధత సందర్భంలో κοινόω అంటే పవిత్రతను భంగపరచడం లేదా అపవిత్రం చేయడం.
- source_word: τὸν ἅγιον τόπον τοῦτον
  choice: ఈ పవిత్ర స్థలాన్ని
  rationale: ప్రదర్శక సర్వనామ బలాన్ని, ఆ స్థలపు ఆరాధనా పవిత్రతను నిలుపుతుంది.
theological_decisions:
- issue: τοῦ νόμου దేనిని సూచిస్తుంది?
  choice: మోషే ధర్మశాస్త్రాన్ని సూచించే ‘ధర్మశాస్త్రం’
  alternative: సాధారణ నియమవ్యవస్థను సూచించే ‘చట్టం’
  rationale: యెరూషలేము దేవాలయ సందర్భంలో ఆరోపణ యూదుల ధర్మశాస్త్రానికి వ్యతిరేకంగా బోధించాడనేది; ‘ధర్మశాస్త్రం’ తెలుగులో ఈ సందర్భార్థాన్ని సహజంగా స్పష్టం చేస్తుంది.
- issue: ἱερόν యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘దేవాలయ ప్రాంగణం’
  alternative: ‘దేవాలయం’ లేదా ‘పరిశుద్ధ మందిరం’
  rationale: ἱερόν దేవాలయ సముదాయం లేదా ఆవరణలను సూచిస్తుంది; అంతర్గత మందిరాన్ని ప్రత్యేకంగా సూచించే ναόςతో దీనిని కలపకుండా చారిత్రక, స్థల సంబంధమైన భేదాన్ని కాపాడింది.
- issue: ఆరోపణ నిజమని వచనం ధృవీకరిస్తుందా?
  choice: వక్తల ఆరోపణగానే అనువదించడం
  alternative: పౌలు నిజంగా దేవాలయాన్ని అపవిత్రం చేశాడని నిర్ధారించేలా వ్యక్తీకరించడం
  rationale: ఈ వాక్యం గుంపు చేసిన ఆరోపణను నివేదిస్తుంది; దాని సత్యాసత్యాలను అనువాదం ముందుగానే తీర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో బహిరంగ ఆరోపణకు తగిన అత్యవసర స్వరాన్ని, అలాగే గౌరవప్రదమైన బైబిలు వచన శైలిని సమతుల్యం చేసింది. మూలంలోని పునరుక్త విస్తృతి (‘అందరికీ’, ‘ప్రతిచోటా’) మరియు మూడు అంశాలపై వ్యతిరేకతను యథాతథంగా నిలిపింది.
