  text: When we arrived in Jerusalem[a], the brothers welcomed us gladly.
translation:
  language: te
  text: మేము యెరూషలేముకు చేరుకున్నప్పుడు, సహోదరులు[a] మమ్మల్ని సంతోషంగా స్వీకరించారు.
  philosophy: optimal-equivalence
