lexical_decisions:
- source_word: Γενομένων δὲ ἡμῶν εἰς Ἱεροσόλυμα
  choice: మేము యెరూషలేముకు చేరుకున్నప్పుడు
  rationale: గ్రీకు జనిటివ్ అబ్సల్యూట్ ఇక్కడ చేరిక జరిగిన సమయాన్ని సూచిస్తుంది. ‘చేరుకున్నప్పుడు’ సహజమైన ఆధునిక తెలుగులో ఆ కాలసంబంధ భావాన్ని స్పష్టంగా అందిస్తుంది; εἰς గమ్యస్థానాన్ని సూచిస్తున్నందున ‘యెరూషలేముకు’ అని అనువదించబడింది.
- source_word: ἀσμένως
  choice: సంతోషంగా
  rationale: ఈ క్రియావిశేషణం ఆనందంతో లేదా ఇష్టపూర్వకంగా స్వీకరించడాన్ని సూచిస్తుంది. ‘సంతోషంగా’ సాధారణ పాఠకులకు సహజంగా ఉండి మూలభావాన్ని నిలుపుతుంది.
- source_word: ἀπεδέξαντο
  choice: ఆహ్వానించారు
  rationale: ఈ సందర్భంలో ἀποδέχομαι వ్యక్తులను ఆదరంగా స్వీకరించడం లేదా స్వాగతించడం అనే భావం కలిగిస్తుంది. తెలుగులో ‘మమ్మల్ని సంతోషంగా ఆహ్వానించారు’ అనేది సందర్భానుసారంగా సహజమైన ఆతిథ్యపూర్వక స్వీకరణను తెలియజేస్తుంది.
- source_word: οἱ ἀδελφοί
  choice: సహోదరులు
  rationale: మూలంలో ఉన్న పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, ఇది విస్తృతంగా తోటి విశ్వాసులను—స్త్రీలను కూడా—సూచించగల అవకాశాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
theological_decisions:
- issue: యెరూషలేము క్రైస్తవ సమాజానికి ἀδελφοί అనే లింగసూచక పదం
  choice: సహోదరులు
  alternative: సహోదర సహోదరీలు; విశ్వాసులు
  rationale: గ్రీకు పాఠ్యంలో పుంలింగ బహువచనమైన ἀδελφοί ఉంది. మూలరూపాన్ని ప్రధాన పాఠ్యంలో కాపాడుతూ, ఆది క్రైస్తవ వాడుకలో ఇది స్త్రీలతో సహా విస్తృత విశ్వాస సమాజాన్ని సూచించగలదనే భావాన్ని పాదటిప్పణిలో ఉంచడం నిజమైన అర్థపరిధిని సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన సరళ శైలిని ఉపయోగించాం. మూలంలోని కాలసంబంధ నిర్మాణం, ఆనందపూర్వక స్వీకరణ, ἀδελφοί పదంలోని లింగసంబంధ అర్థపరిధి నిలుపబడ్డాయి.
