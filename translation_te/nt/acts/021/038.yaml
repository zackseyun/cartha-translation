translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సైనిక అధికారి ఆశ్చర్యంతో వేసిన ప్రత్యక్ష ప్రశ్నగా అనువదించబడింది. రాజకీయ సందర్భం స్పష్టంగా ఉండేలా ‘తిరుగుబాటు రేపి’ వాడబడింది; చారిత్రక పదమైన ‘సికారీయులు’ పాదసూచికలో భద్రపరచబడింది.
