id: ACT.21.38
reference: Acts 21:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐκ ἄρα σὺ εἶ ὁ Αἰγύπτιος ὁ πρὸ τούτων τῶν ἡμερῶν ἀναστατώσας καὶ ἐξαγαγὼν εἰς τὴν ἔρημον τοὺς τετρακισχιλίους ἄνδρας τῶν σικαρίων;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/038.yaml
  text: Then you are not the Egyptian who some days ago stirred up a revolt and led the four thousand men of the assassins out into the wilderness?[a]
translation:
  language: te
  text: “అయితే, కొన్నాళ్ల క్రితం తిరుగుబాటు రేపి, హంతకులైన ఆ నాలుగు వేల మందిని అరణ్యంలోకి నడిపించిన ఆ ఐగుప్తీయుడివి నువ్వు కాదా?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బాకు-ధారులైన వారి.” గ్రీకులో “సికారీయులు”; వీరు దాచిన బాకులతో దాడులు చేయడంలో పేరుపొందిన ఒక వర్గం.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἄρα
  choice: అయితే ... కాదా?
  rationale: పౌలు గ్రీకు మాట్లాడడం విని అధికారి తీసుకున్న ఆశ్చర్యభరితమైన నిర్ధారణను ప్రశ్న రూపంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ὁ Αἰγύπτιος
  choice: ఆ ఐగుప్తీయుడు
  rationale: నిర్దిష్ట ఉపపదం వక్తకు తెలిసిన, పేరుపొందిన వ్యక్తిని సూచిస్తుంది; ‘ఆ’ ఆ నిర్దిష్టతను తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: πρὸ τούτων τῶν ἡμερῶν
  choice: కొన్నాళ్ల క్రితం
  rationale: సమీప గతాన్ని సూచించే గ్రీకు నుడికారానికి సహజమైన ఆధునిక తెలుగు రూపం; ఖచ్చితమైన కాలవ్యవధిని అనవసరంగా నిర్దేశించదు.
- source_word: ἀναστατώσας
  choice: తిరుగుబాటు రేపి
  rationale: ఈ రాజకీయ సందర్భంలో కేవలం కలవరపరచడం కంటే ప్రజా తిరుగుబాటును ప్రేరేపించడమే ఉద్దేశమని తెలియజేస్తుంది.
- source_word: ἐξαγαγὼν
  choice: నడిపించిన
  rationale: ఒక సమూహాన్ని తన నాయకత్వంలో ఒక ప్రాంతంలోకి తీసుకువెళ్లిన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: εἰς τὴν ἔρημον
  choice: అరణ్యంలోకి
  rationale: జనావాసం లేని ప్రాంతాన్ని సూచిస్తుంది; ఇసుక ఎడారి అనే అర్థానికే పరిమితం చేయదు.
- source_word: τοὺς τετρακισχιλίους ἄνδρας
  choice: ఆ నాలుగు వేల మందిని
  rationale: నిర్దిష్ట ఉపపదం సూచించే తెలిసిన సమూహాన్ని ‘ఆ’ ద్వారా నిలుపుతుంది; తెలుగులో ‘మంది’ మనుషుల లెక్కకు సహజం.
- source_word: τῶν σικαρίων
  choice: హంతకులలోని
  rationale: దాచిన బాకులతో హత్యలు చేసే సికారీయులను సాధారణ పాఠకులకు వెంటనే అర్థమయ్యేలా తెలియజేస్తుంది; చారిత్రక పేరు, మరింత అక్షరార్థ రూపం పాదసూచికలో ఉన్నాయి.
