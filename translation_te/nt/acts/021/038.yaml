- from: “అయితే, కొన్నాళ్ల క్రితం తిరుగుబాటు రేపి, హంతకులలోని ఆ నాలుగు వేల మందిని అరణ్యంలోకి నడిపించిన ఆ ఐగుప్తీయుడివి నువ్వు కాదా?[a]”
  to: “అయితే, కొన్నాళ్ల క్రితం తిరుగుబాటు రేపి, హంతకులైన ఆ నాలుగు వేల మందిని అరణ్యంలోకి నడిపించిన ఆ ఐగుప్తీయుడివి నువ్వు కాదా?[a]”
