source:
  edition: SBLGNT
  text: ἐπιτρέψαντος δὲ αὐτοῦ ὁ Παῦλος ἑστὼς ἐπὶ τῶν ἀναβαθμῶν κατέσεισε τῇ χειρὶ τῷ λαῷ, πολλῆς δὲ σιγῆς γενομένης ⸀προσεφώνησεν τῇ Ἑβραΐδι διαλέκτῳ λέγων
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/040.yaml
  text: 'And when he had given permission[a], Paul, standing on the steps, motioned with his hand to the people. And when a great silence had come, he addressed them in the Hebrew language, saying:'
translation:
  language: te
  text: 'అతడు అనుమతి ఇచ్చినప్పుడు, పౌలు మెట్ల మీద నిలబడి ప్రజలకు చేతితో సైగ చేశాడు. అంతట గాఢమైన నిశ్శబ్దం ఏర్పడినప్పుడు, అతడు హీబ్రూ భాషలో[a] వారిని ఉద్దేశించి ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, బహుశా ‘అరామిక్ భాషలో.’ గ్రీకు మూలంలో ‘హీబ్రూ భాష/మాండలికంలో’ అని ఉంది; ఈ సందర్భంలో అది సాధారణంగా అరామిక్ అని పిలిచే స్థానిక సెమిటిక్ భాషను సూచించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιτρέψαντος δὲ αὐτοῦ
  choice: అతడు అనుమతి ఇచ్చినప్పుడు
  rationale: ముందటి సందర్భంలోని సైన్యాధికారిని సూచించే షష్ఠీ విభక్తి స్వతంత్ర ప్రయోగం. తెలుగు వాక్యంలో సహజంగా ఉండేలా కాలసంబంధ భావాన్ని నిలిపింది.
- source_word: ἑστὼς ἐπὶ τῶν ἀναβαθμῶν
  choice: మెట్ల మీద నిలబడి
  rationale: పౌలు ఉన్న స్థానాన్ని వర్ణించే పరిపూర్ణ కృదంత భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κατέσεισε τῇ χειρὶ τῷ λαῷ
  choice: ప్రజలకు చేతితో సైగ చేశాడు
  rationale: ప్రజలను నిశ్శబ్దంగా ఉండమని లేదా వారి దృష్టిని ఆకర్షించడానికి చేసిన చేతి సంకేతాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τῷ λαῷ
  choice: ప్రజలకు
  rationale: λαός అనే పదానికి నేరమైన అర్థాన్ని నిలుపుతుంది; సందర్భంలో గుమికూడిన జనాన్ని సూచిస్తుంది.
- source_word: πολλῆς δὲ σιγῆς γενομένης
  choice: అంతట గాఢమైన నిశ్శబ్దం ఏర్పడినప్పుడు
  rationale: నిశ్శబ్దం మొదలై విస్తరించిన సంఘటనాత్మక భావాన్ని, πολλῆς యొక్క తీవ్రతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: προσεφώνησεν
  choice: వారిని ఉద్దేశించి
  rationale: బహిరంగంగా ఒక సమూహాన్ని సంబోధించే భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: హీబ్రూ భాషలో
  rationale: గ్రీకు మూలంలోని ‘హీబ్రూ భాష/మాండలికం’ అనే రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అరామిక్ కావచ్చనే సందర్భసంబంధ అవకాశాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: λέγων
  choice: 'ఇలా అన్నాడు:'
  rationale: తరువాతి వచనంలో వచ్చే ప్రత్యక్ష ప్రసంగాన్ని సహజమైన తెలుగు కథనశైలిలో పరిచయం చేస్తుంది.
theological_decisions:
- issue: τῇ Ἑβραΐδι διαλέκτῳ సూచించే భాష
  choice: ప్రధాన పాఠ్యంలో ‘హీబ్రూ భాషలో’
  alternative: ‘అరామిక్ భాషలో’
  rationale: మూలపాఠం హీబ్రూ అని ప్రత్యక్షంగా పేర్కొంటుంది; అయితే ఈ సందర్భంలో స్థానిక సెమిటిక్ భాషైన అరామిక్‌ను సూచించే అవకాశం ఉంది. ఆ అనిశ్చితిని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, స్పష్టమైన కథనశైలి. మూలంలోని రెండు కాలసంబంధ కృదంత నిర్మాణాలను సహజమైన ‘-నప్పుడు’ రూపాలతో అందించి, భాష గుర్తింపులోని నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
