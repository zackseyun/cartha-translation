source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ τὸν πλοῦν διανύσαντες ἀπὸ Τύρου κατηντήσαμεν εἰς Πτολεμαΐδα, καὶ ἀσπασάμενοι τοὺς ἀδελφοὺς ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/007.yaml
  text: We[a], having finished the voyage from Tyre, arrived at Ptolemais, and after greeting the brothers, we stayed with them one day.
translation:
  language: te
  text: మేము తూరు నుండి సముద్ర ప్రయాణాన్ని ముగించి ప్టొలెమాయిసుకు చేరుకున్నాం. అక్కడి సోదరులను[a] పలకరించి, వారివద్ద ఒక రోజు బస చేశాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సోదర సోదరీమణులను.” గ్రీకులో “సోదరులు” అని ఉంది; ఈ పుంలింగ బహువచన పదం విస్తృతంగా తోటి విశ్వాసులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: మేము
  rationale: స్పష్టంగా ఉన్న సర్వనామం కథనంలోని కర్తను సూచిస్తుంది; δέ ఇక్కడ కొనసాగింపు లేదా స్వల్ప మార్పును తెలియజేస్తుంది. తెలుగులో ప్రత్యేక సంధానపదం లేకుండానే సహజంగా ప్రవాహం కొనసాగుతుంది.
- source_word: τὸν πλοῦν διανύσαντες
  choice: సముద్ర ప్రయాణాన్ని ముగించి
  rationale: πλοῦς సముద్ర ప్రయాణాన్ని, διανύω దానిని పూర్తిచేయడాన్ని సూచిస్తాయి. ఈ రూపం గ్రీకు అసమాపక క్రియలోని ముందుగా జరిగిన కార్యక్రమాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἀπὸ Τύρου
  choice: తూరు నుండి
  rationale: ἀπό బయలుదేరిన స్థలాన్ని నేరుగా సూచిస్తుంది.
- source_word: κατηντήσαμεν εἰς Πτολεμαΐδα
  choice: తొలెమాయికి చేరుకున్నాం
  rationale: ప్రయాణ సందర్భంలో καταντάω గమ్యస్థానానికి చేరుకోవడం అనే అర్థం ఇస్తుంది; εἰς గమ్యాన్ని సూచిస్తుంది.
- source_word: ἀσπασάμενοι
  choice: అభివాదం చేసి
  rationale: ἀσπάζομαι ఇక్కడ పలకరించడం లేదా అభివాదం చేయడం. ప్రధాన క్రియకు ముందు జరిగిన చర్యగా తెలుగులో సహజంగా అనువదించబడింది.
- source_word: τοὺς ἀδελφοὺς
  choice: సోదరులకు
  rationale: ἀδελφοί వ్యాకరణపరంగా పుంలింగ బహువచనం. తొలి క్రైస్తవ సమాజ సందర్భంలో ఇది విస్తృతంగా తోటి విశ్వాసులను కూడా సూచించవచ్చు; ప్రధాన పాఠంలో మూలరూపాన్ని నిలిపి, ఆ విస్తృత అవకాశాన్ని పాదసూచికలో తెలిపాం.
- source_word: ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς
  choice: వారితో ఒక రోజు ఉన్నాం
  rationale: μένω ఇక్కడ ఉండడం లేదా బసచేయడం; ἡμέραν μίαν కాలవ్యవధి; παρά దత్తివుతో వారి సాంగత్యంలో ఉండడాన్ని సూచిస్తుంది. సంక్షిప్తమైన సహజ తెలుగు రూపాన్ని ఎంచుకున్నాం.
theological_decisions:
- issue: క్రైస్తవ సమాజ సందర్భంలో ἀδελφοὺς అనువాదం
  choice: సోదరులకు
  alternative: సోదర సోదరీమణులకు; తోటి విశ్వాసులకు
  rationale: గ్రీకు పదం పుంలింగ బహువచనంలో ఉన్నప్పటికీ, సందర్భానుసారం స్త్రీలతో సహా స్థానిక విశ్వాస సమాజాన్ని సూచించే అవకాశం ఉంది. మూలంలోని లింగరూపాన్ని ప్రధాన పాఠంలో నిలిపి, భావ విస్తృతిని పాదసూచికలో ఉంచడం ద్వారా అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. స్థలనామాలకు సాధారణ తెలుగు రూపాలు ‘తూరు’, ‘తొలెమాయి’ వాడబడ్డాయి; మూలంలోని కార్యాల క్రమం మరియు ἀδελφοί పదంలోని భావసంభావ్యత నిలుపబడ్డాయి.
