  to: 'అయితే పౌలు ఇలా అన్నాడు: “నేను యూదుణ్ణి; కిలికియలోని తార్సుకు చెందినవాణ్ణి—ఏమాత్రం అప్రసిద్ధం కాని ఆ పట్టణ పౌరుణ్ణి.[a] ప్రజలను ఉద్దేశించి మాట్లాడేందుకు నాకు అనుమతి ఇవ్వమని మిమ్మల్ని వేడుకుంటున్నాను.”'
