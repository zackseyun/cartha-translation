id: ACT.21.39
reference: Acts 21:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Παῦλος· Ἐγὼ ἄνθρωπος μέν εἰμι Ἰουδαῖος, Ταρσεὺς τῆς Κιλικίας, οὐκ ἀσήμου πόλεως πολίτης· δέομαι δέ σου, ἐπίτρεψόν μοι λαλῆσαι πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/039.yaml
  text: But Paul said[a], “I am indeed a Jewish man, a citizen of Tarsus in Cilicia, of no insignificant city. And I beg you, permit me to speak to the people.”
translation:
  language: te
  text: 'అయితే పౌలు ఇలా అన్నాడు: “నేను యూదుణ్ణి; కిలికియలోని తార్సుకు చెందినవాణ్ణి—ఏమాత్రం అప్రసిద్ధం కాని ఆ పట్టణ పౌరుణ్ణి.[a] ప్రజలను ఉద్దేశించి మాట్లాడేందుకు నాకు అనుమతి ఇవ్వమని మిమ్మల్ని వేడుకుంటున్నాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను యూదుణ్ణి, కిలికియలోని తార్సువాడిని, ఏమాత్రం అప్రసిద్ధం కాని పట్టణ పౌరుణ్ణి.”
    reason: మూల గ్రీకు పదబంధాల అన్వయాన్ని మరింత రూపపరంగా అనుసరించే ప్రత్యామ్నాయ నిర్మాణం.
lexical_decisions:
- source_word: ἄνθρωπος ... Ἰουδαῖος
  choice: యూదుణ్ణి
  rationale: తెలుగులో ‘యూదుడైన మనిషిని’ అనడం కృత్రిమంగా ఉంటుంది. పౌలు తన జాతి-మతపరమైన గుర్తింపును తెలియజేస్తున్న భావాన్ని ‘యూదుణ్ణి’ సహజంగా, సంపూర్ణంగా వ్యక్తం చేస్తుంది.
- source_word: Ταρσεὺς τῆς Κιλικίας
  choice: కిలికియలోని తార్సుకు చెందినవాణ్ణి
  rationale: తార్సు నగరానికి, కిలికియ ప్రాంతానికి ఉన్న సంబంధాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; వెంట వచ్చే πολίτης అనే పౌరసత్వ పదానికి చోటు ఉంచుతుంది.
- source_word: οὐκ ἀσήμου πόλεως
  choice: ఏమాత్రం అప్రసిద్ధం కాని పట్టణం
  rationale: మూలంలోని నిషేధాత్మక అలంకారాన్ని (‘ప్రాముఖ్యత లేనిది కాదు’) సానుకూల వాక్యంగా సరళీకరించకుండా నిలుపుతుంది.
- source_word: πολίτης
  choice: పౌరుడు
  rationale: కేవలం నివాసిని కాకుండా నగరంతో పౌరసంబంధం కలిగిన వ్యక్తిని సూచిస్తుంది.
- source_word: δέομαι
  choice: వేడుకుంటున్నాను
  rationale: సాధారణంగా అడగడం కంటే బలమైన, వినయపూర్వకమైన అభ్యర్థనను తెలియజేస్తుంది.
- source_word: ἐπίτρεψόν μοι
  choice: నాకు అనుమతి ఇవ్వండి
  rationale: సైనిక అధికారిని ఉద్దేశించిన మర్యాదపూర్వక అభ్యర్థనకు తగిన ఆధునిక తెలుగు రూపం.
- source_word: λαλῆσαι πρὸς τὸν λαόν
  choice: ప్రజలతో మాట్లాడడానికి
  rationale: ప్రజలను ఉద్దేశించి ప్రసంగించాలనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తూ, λαός ను ‘ప్రజలు’గా నిలుపుతుంది.
- source_word: μέν
  choice: ప్రత్యేక పదంగా అనువదించకుండా వాక్య నిర్మాణంలో నొక్కిచెప్పడం
  rationale: తెలుగులో ‘నిజంగా’ వంటి పదం ఇక్కడ అనవసరమైన ధృవీకరణ భావాన్ని కలిగించవచ్చు; వరుస స్వీయవివరణ, విరామచిహ్నాలు మూలంలోని నొక్కును సహజంగా అందిస్తాయి.
theological_decisions:
- issue: Ἰουδαῖος యొక్క సందర్భానుసార అర్థం
  choice: యూదుడు
  alternative: యూదయవాడు
  rationale: పౌలు తన స్వస్థలంగా కిలికియలోని తార్సును వేరుగా పేర్కొంటున్నందున, ఇక్కడ భౌగోళికంగా ‘యూదయవాడు’ అనే అర్థం కంటే జాతి-మతపరమైన ‘యూదుడు’ అనేది సందర్భానికి సరిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, ప్రజలకు సులభంగా అర్థమయ్యే శైలి. పౌలు అధికారిని ఉద్దేశిస్తున్నందున అభ్యర్థనలో మర్యాదను నిలిపి, మూలంలోని ‘అప్రసిద్ధం కాని’ అనే నిషేధాత్మక అలంకారాన్ని కాపాడింది.
