id: ACT.21.18
reference: Acts 21:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῇ δὲ ἐπιούσῃ εἰσῄει ὁ Παῦλος σὺν ἡμῖν πρὸς Ἰάκωβον, πάντες τε παρεγένοντο οἱ πρεσβύτεροι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/018.yaml
  text: On the next day[a], Paul went in with us to James[b], and all the elders were present.
translation:
  language: te
  text: మరుసటి రోజు[a] పౌలు మాతో కలిసి యాకోబు దగ్గరికి వెళ్లాడు; పెద్దలందరూ అక్కడికి వచ్చారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తరువాతి రోజు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పెద్దలందరూ అక్కడ ఉన్నారు’ లేదా ‘పెద్దలందరూ హాజరై ఉన్నారు.’ గ్రీకు క్రియ రావడాన్ని గానీ, అక్కడ ఉండడాన్ని గానీ ప్రధానంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπιούσῃ
  choice: మరుసటి రోజు
  rationale: ఈ దత్తివ విభక్తి ప్రయోగం ‘తరువాతి రోజు’ అనే కాలార్థక నుడికారాన్ని సూచిస్తుంది. ‘మరుసటి రోజు’ సహజమైన ఆధునిక తెలుగు.
- source_word: εἰσῄει
  choice: వెళ్లాడు
  rationale: ఈ క్రియ లోపలికి వెళ్లడం లేదా ప్రవేశించడాన్ని సూచిస్తుంది. తెలుగులో వ్యక్తిని కలవడానికి వెళ్లిన సందర్భంలో ‘యాకోబు దగ్గరికి వెళ్లాడు’ దిశాభావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: σὺν ἡμῖν
  choice: మాతో కలిసి
  rationale: σύν సహవాసాన్ని స్పష్టంగా సూచిస్తుంది; ‘మాతో కలిసి’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: πρὸς Ἰάκωβον
  choice: యాకోబు దగ్గరికి
  rationale: πρός + ద్వితీయా విభక్తి వ్యక్తి వైపు కదలికను సూచిస్తుంది. ‘యాకోబు దగ్గరికి’ అదనపు వివరాలను చేర్చకుండా తెలుగులో సహజంగా ఉంది.
- source_word: πάντες τε
  choice: పెద్దలందరూ
  rationale: τέ స్వల్ప అనుసంధాన బలాన్ని కలిగి ఉంది; తెలుగు వాక్య నిర్మాణంలో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండానే రెండో ఖండాన్ని సహజంగా అనుసంధానించవచ్చు.
- source_word: παρεγένοντο
  choice: అక్కడికి వచ్చారు
  rationale: παραγίνομαι రావడం, చేరడం లేదా హాజరై ఉండడం అనే భావాలను ఇవ్వగలదు. ‘అక్కడికి వచ్చారు’ దాని ఆగమన భావాన్ని కాపాడుతుంది; ప్రత్యామ్నాయ స్థితి భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: οἱ πρεσβύτεροι
  choice: పెద్దలు
  rationale: అపొస్తలుల కార్యముల సందర్భంలో ఈ పదం సంఘంలో గుర్తింపు పొందిన నాయకులను సూచిస్తుంది. ‘పెద్దలు’ తరువాతి కాలపు ప్రత్యేక సంఘపాలనా పదజాలాన్ని రుద్దకుండా మూలపదానికి దగ్గరగా ఉంటుంది.
theological_decisions:
- issue: Ἰάκωβον అనే వ్యక్తి గుర్తింపు, పాత్ర
  choice: వివరణాత్మక బిరుదు లేకుండా ‘యాకోబు’ అని మాత్రమే అనువదించడం
  alternative: ‘ప్రభువు సహోదరుడైన యాకోబు’ లేదా ‘యెరూషలేము సంఘ నాయకుడైన యాకోబు’
  rationale: ఈ వచనం పేరు మాత్రమే చెబుతుంది. సందర్భం అతని గుర్తింపును సూచించినా, ప్రధాన పాఠ్యంలో అదనపు గుర్తింపును చేర్చడం మూలంలో లేని సమాచారాన్ని దిగుమతి చేస్తుంది.
- issue: οἱ πρεσβύτεροι యొక్క సంఘపరమైన భావం
  choice: ప్రత్యేక శాఖాపరమైన అర్థం లేకుండా ‘పెద్దలు’
  alternative: ‘ప్రెస్బిటర్లు’ లేదా ‘సంఘ నాయకులు’
  rationale: ఈ పదం యెరూషలేము సంఘంలోని గుర్తింపు పొందిన నాయకులను సూచిస్తుంది; ‘పెద్దలు’ మూలపద భావాన్ని, సంఘపాలనా తటస్థతను కాపాడుతుంది.
- issue: παρεγένοντο లో ఆగమనమా, హాజరా అనే భావసూక్ష్మత
  choice: ప్రధాన పాఠ్యంలో ‘అక్కడికి వచ్చారు’
  alternative: ‘అక్కడ ఉన్నారు’ లేదా ‘హాజరై ఉన్నారు’
  rationale: గ్రీకు క్రియ రావడం/చేరడం అనే సంఘటనను లేదా అక్కడ హాజరై ఉండే స్థితిని ముందుకు తేవగలదు. ప్రధాన పాఠ్యంలో ఆగమన భావాన్ని ఎంచుకుని, నిజమైన పదార్థ సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘యాకోబు’ అనే తెలుగు బైబిలు సంప్రదాయ నామరూపాన్ని, ‘పెద్దలు’ అనే పారదర్శకమైన తటస్థ పదాన్ని ఉపయోగించాం. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో ఉంది.
