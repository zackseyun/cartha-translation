translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రయాణ కథనానికి తగిన సరళమైన, గౌరవప్రదమైన శైలి. మూలంలోని భావోద్వేగభరితమైన విడిపోవడాన్ని నిలిపి, నౌకాయాన క్రమాన్ని స్పష్టంగా ఉంచాం.
