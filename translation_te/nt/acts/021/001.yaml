revisions:
- from: మేము వారిని విడిచి వెళ్లడం ఎంతో కష్టమైనప్పటికీ, సముద్రయానానికి బయలుదేరి నేరుగా కోసుకు చేరుకున్నాం. మరుసటి రోజు రోదుకు, అక్కడి నుంచి పతరకు చేరుకున్నాం.
  to: మేము వారి నుండి కష్టంగా విడిపోయి సముద్రానికి బయలుదేరిన తర్వాత, నేరుగా ప్రయాణించి కోసు[a]కు చేరుకున్నాం; మరుసటి రోజు రోదుకు, అక్కడి నుండి పతరాకు చేరుకున్నాం.
  rationale: The revision removes the unsupported concessive nuance, preserves the strong but non-doctrinal sense of being separated with difficulty, explicitly renders the direct maritime route, and regularizes Patara’s Telugu transliteration. The footnote is anchored immediately after కోసు and preserves the audited alternate spelling without implying a textual variant.
