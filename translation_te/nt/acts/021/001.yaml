id: ACT.21.1
reference: Acts 21:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐγένετο ἀναχθῆναι ἡμᾶς ἀποσπασθέντας ἀπ’ αὐτῶν, εὐθυδρομήσαντες ἤλθομεν εἰς τὴν ⸀Κῶ, τῇ δὲ ἑξῆς εἰς τὴν Ῥόδον, κἀκεῖθεν εἰς Πάταρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/001.yaml
  text: After we had torn ourselves away from them and put out to sea[a], we ran a straight course and came to Cos, and on the next day to Rhodes, and from there to Patara.
translation:
  language: te
  text: మేము వారి నుండి కష్టంగా విడిపోయి సముద్రానికి బయలుదేరిన తర్వాత, నేరుగా ప్రయాణించి కోసు[a]కు చేరుకున్నాం; మరుసటి రోజు రోదుకు, అక్కడి నుండి పతరాకు చేరుకున్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, కోస్.
    reason: స్థలనామానికి ఆధునిక లిప్యంతరణ ప్రత్యామ్నాయం; ఇంగ్లీషు POBలోని Cos/Kos ప్రత్యామ్నాయానికి అనుగుణంగా.
lexical_decisions:
- source_word: Ὡς δὲ ἐγένετο
  choice: … బయలుదేరి
  rationale: గ్రీకు కథన సంధి తరువాతి సంఘటనను పరిచయం చేస్తుంది; తెలుగులో వాక్యప్రవాహానికి అనుగుణంగా ప్రత్యేక పదబంధం లేకుండానే క్రమాన్ని సహజంగా తెలిపాం.
- source_word: ἀποσπασθέντας ἀπ’ αὐτῶν
  choice: మేము వారిని విడిచి వెళ్లడం ఎంతో కష్టమైనప్పటికీ
  rationale: ἀποσπάωలో ఉన్న బలవంతంగా లాగివేరు చేసినట్టున్న భావోద్వేగ తీవ్రతను, తెలుగులో అసహజమైన అక్షరానువాదం కాకుండా విడిపోవడం కష్టమైందనే సహజ భావంతో వ్యక్తం చేశాం.
- source_word: ἀναχθῆναι
  choice: సముద్రయానానికి బయలుదేరి
  rationale: నౌకాయాన సందర్భంలో ఈ క్రియ సముద్రంలో ప్రయాణానికి బయలుదేరడాన్ని సూచిస్తుంది.
- source_word: εὐθυδρομήσαντες
  choice: నేరుగా
  rationale: ఈ నౌకాయాన క్రియ నేరుగా మార్గం పట్టి ప్రయాణించడాన్ని సూచిస్తుంది; ప్రధాన క్రియతో కలిపి సహజ తెలుగులో సంక్షిప్తంగా ఇచ్చాం.
- source_word: ἤλθομεν εἰς
  choice: చేరుకున్నాం
  rationale: ప్రయాణ వర్ణనలో గమ్యస్థానానికి చేరడాన్ని సహజ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: Κῶ
  choice: కోసు
  rationale: Κῶ అనే దీవి పేరును గ్రీకు ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: τῇ δὲ ἑξῆς
  choice: మరుసటి రోజు
  rationale: తరువాతి రోజును సూచించే గ్రీకు కాలసూచక నుడికారానికి సహజ తెలుగు సమానం.
- source_word: Ῥόδον
  choice: రోదు
  rationale: Ῥόδος స్థలనామం యొక్క గ్రీకు రూపానికి దగ్గరైన తెలుగు లిప్యంతరీకరణ.
- source_word: κἀκεῖθεν
  choice: అక్కడి నుంచి
  rationale: καί + ἐκεῖθεν తెలిపే అనుసంధానాన్ని, ప్రయాణ క్రమంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Πάταρα
  choice: పతర
  rationale: Πάταρα స్థలనామాన్ని మూల గ్రీకు ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
