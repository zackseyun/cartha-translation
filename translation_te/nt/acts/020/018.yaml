id: ACT.20.18
reference: Acts 20:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς δὲ παρεγένοντο πρὸς αὐτὸν εἶπεν αὐτοῖς· Ὑμεῖς ἐπίστασθε ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς ἐπέβην εἰς τὴν Ἀσίαν πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/018.yaml
  text: When they came to him[a], he said to them[b], “You yourselves know how I lived among you the whole time from the first day that I set foot in Asia,”
translation:
  language: te
  text: 'వారు అతని దగ్గరకు వచ్చినప్పుడు, అతడు వారితో ఇలా అన్నాడు: “నేను ఆసియా[a]లో అడుగుపెట్టిన మొదటి రోజు నుండి, అప్పటి నుండి అంతకాలమూ మీ మధ్య ఎలా ఉన్నానో మీకే బాగా తెలుసు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “ఆసియా” అంటే ఆధునిక ఆసియా ఖండం కాదు; ఆసియా మైనరు పశ్చిమ భాగంలో ఉన్న రోమా పరిపాలనా ప్రాంతం.
    reason: cultural_note
lexical_decisions:
- source_word: παρεγένοντο πρὸς αὐτόν
  choice: వారు అతని దగ్గరకు వచ్చినప్పుడు
  rationale: ఈ సందర్భంలో ఎఫెసు పెద్దలు పౌలు ఉన్న చోటికి రావడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; πρὸς αὐτόνలోని అతని వైపుకు వచ్చిన భావాన్ని నిలుపుతుంది.
- source_word: Ὑμεῖς ἐπίστασθε
  choice: మీకు మీరే తెలుసు
  rationale: ప్రత్యేకంగా వాడిన Ὑμεῖςలోని ఉద్ఘాటనను ‘మీరే’ నిలుపుతుంది; ἐπίστασθεకు వ్యక్తిగతంగా తెలిసినదనే సూటి భావాన్ని ‘తెలుసు’ అందిస్తుంది.
- source_word: ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς ἐπέβην
  choice: నేను ... అడుగుపెట్టిన మొదటి రోజు నుంచీ
  rationale: ἐπέβηνలోని సజీవమైన ‘అడుగుపెట్టడం’ అనే ప్రయాణ భావాన్నీ, మొదటి రోజు మొదలైన కాలవ్యాప్తినీ నిలుపుతుంది.
- source_word: εἰς τὴν Ἀσίαν
  choice: ఆసియాలో
  rationale: మూలపాఠంలోని భౌగోళిక పేరును విస్తరించకుండా ఉంచుతుంది; ఇది ఆధునిక ఖండం కాక రోమా సామ్రాజ్యంలోని ఆసియా ప్రాంతమని పాదసూచిక వివరిస్తుంది.
- source_word: μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην
  choice: ఆ సమయమంతా మీ మధ్య ఎలా ఉన్నానో
  rationale: μεθ’ ὑμῶνకు సమాజం మధ్యనున్న భావాన్ని ‘మీ మధ్య’ తెలియజేస్తుంది; τὸν πάντα χρόνον నిరంతర కాలవ్యాప్తిని సూచిస్తుంది. ‘ఎలా ఉన్నానో’ అనేది పౌలు వారి మధ్య నిరంతరం ఉండడానికీ, ఆయన జీవనవిధానానికీ మధ్య మూలంలోని భావవిస్తృతిని నిలుపుతుంది.
theological_decisions:
- issue: ἐγενόμην పౌలు వారి మధ్య ఉన్న కాలాన్నా లేక ఆయన జీవనవిధానాన్నా ప్రధానంగా సూచిస్తుంది?
  choice: ఎలా ఉన్నానో
  alternative: ఎలా జీవించానో / ఎలా మెలిగానో
  rationale: గ్రీకు వ్యక్తీకరణ నిరంతర సాన్నిధ్యాన్నీ జీవనవిధానాన్నీ సూచించగలదు. ప్రధాన పాఠంలో విస్తృతమైన రూపాన్ని ఉంచి, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో తెలిపాం; తద్వారా ఏకపక్ష వ్యాఖ్యానాన్ని రుద్దలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘అడుగుపెట్టిన’ అనే సజీవ ప్రయోగం మూలంలోని ప్రయాణ చిత్రాన్ని నిలుపుతుంది; ‘మీకు మీరే తెలుసు’ ప్రత్యక్ష సంబోధనలోని ఉద్ఘాటనను స్పష్టంగా తెలియజేస్తుంది.
