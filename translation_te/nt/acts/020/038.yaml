translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సహజమైన శైలి. గ్రీకు వాక్యంలోని వ్యక్తిగతమైన ‘తన ముఖాన్ని చూడడం’ అనే ప్రయోగాన్ని నిలిపి, ఇంగ్లీషులోని కృత్రిమ పదక్రమాన్ని అనుసరించలేదు. ప్రధాన వాక్యంలో ‘సాగనంపారు’ సహజమైన సంపూర్ణ క్రియగా ఉంది; గ్రీకు imperfect యొక్క కొనసాగుతున్న దృశ్యాన్ని అవసరానికి మించి బలవంతంగా ప్రతిబింబించలేదు.
