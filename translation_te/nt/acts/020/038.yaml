  text: ὀδυνώμενοι μάλιστα ἐπὶ τῷ λόγῳ ᾧ εἰρήκει ὅτι οὐκέτι μέλλουσιν τὸ πρόσωπον αὐτοῦ θεωρεῖν. προέπεμπον δὲ αὐτὸν εἰς τὸ πλοῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/038.yaml
  text: grieving especially over the word that he had spoken[a], that they would no longer see his face[d][c][b]. And they were accompanying him to the ship.
translation:
  language: te
  text: ఇక వారు ఆయన ముఖాన్ని చూడరని ఆయన చెప్పిన మాటను బట్టి వారు మరీ ఎక్కువగా వేదన చెందారు.[a] తరువాత వారు ఆయనను ఓడ వరకు సాగనంపారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “ఆయన చెప్పిన మాట విషయమై—ఇక వారు ఆయన ముఖాన్ని చూడబోవడం లేదని—వేదన చెందుతూ.”'
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారు ఆయనతో పాటు ఓడ వరకు వెళ్లారు.” ఈ క్రియలో గౌరవపూర్వకంగా తోడుగా వెళ్లి వీడ్కోలు పలికే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀδυνώμενοι
  choice: దుఃఖించారు
  rationale: ఈ పదం తీవ్రమైన మనోవేదనను సూచిస్తుంది. వీడ్కోలు సందర్భంలో సహజంగా, గౌరవప్రదంగా వినిపించే రూపం.
- source_word: μάλιστα
  choice: మరీ ఎక్కువగా
  rationale: వారి దుఃఖానికి ముఖ్య కారణాన్ని స్పష్టంగా చూపిస్తుంది.
- source_word: ἐπὶ τῷ λόγῳ ᾧ εἰρήκει
  choice: తాను చెప్పిన మాటను బట్టి
  rationale: λόγος అనే నామవాచకాన్ని ‘మాట’గా నిలుపుతూ, వారి దుఃఖానికి కారణమైన ముందటి ప్రకటనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: οὐκέτι μέλλουσιν τὸ πρόσωπον αὐτοῦ θεωρεῖν
  choice: వారు ఇక తన ముఖాన్ని చూడరని
  rationale: οὐκέτι యొక్క ‘ఇక ... కాదు’ భావాన్ని, μέλλω సూచించే భవిష్యత్ నిరీక్షణను సహజంగా వ్యక్తం చేస్తూ, ‘ముఖం’ అనే సజీవమైన వ్యక్తిగత ప్రయోగాన్ని నిలుపుతుంది.
- source_word: προέπεμπον
  choice: సాగనంపారు
  rationale: తోడుగా వెళ్లి గౌరవపూర్వకంగా వీడ్కోలు పలికే భావాన్ని ఆధునిక తెలుగులో సంక్షిప్తంగా అందిస్తుంది.
- source_word: εἰς τὸ πλοῖον
  choice: ఓడ వరకు
  rationale: వారు ఆయనతో కలిసి వెళ్లిన గమ్యస్థానాన్ని సందర్భానుకూలంగా తెలుపుతుంది; πλοῖον ను సముద్రయాన సందర్భానికి తగినట్లు ‘ఓడ’గా అనువదించింది.
