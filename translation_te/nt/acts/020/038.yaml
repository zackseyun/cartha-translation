  to: ఇక వారు ఆయన ముఖాన్ని చూడరని ఆయన చెప్పిన మాటను బట్టి వారు మరీ ఎక్కువగా వేదన చెందారు.[a] తరువాత వారు ఆయనను ఓడ వరకు సాగనంపారు.[b]
