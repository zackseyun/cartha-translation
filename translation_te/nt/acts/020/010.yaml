id: ACT.20.10
reference: Acts 20:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καταβὰς δὲ ὁ Παῦλος ἐπέπεσεν αὐτῷ καὶ συμπεριλαβὼν εἶπεν· Μὴ θορυβεῖσθε, ἡ γὰρ ψυχὴ αὐτοῦ ἐν αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/010.yaml
  text: But Paul went down and fell upon him[a], and embracing him said, “Do not be alarmed[b], for his life is in him.”
translation:
  language: te
  text: అయితే పౌలు కిందికి వెళ్లి, అతని మీద పడి, అతన్ని కౌగిలించుకొని, “ఆందోళన చెందకండి; అతని ప్రాణం అతనిలో ఉంది[a]” అన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని ఆత్మ అతనిలో ఉంది.” గ్రీకు ψυχή అనే పదానికి ‘ప్రాణం,’ ‘వ్యక్తి/స్వయం,’ లేదా ‘ఆత్మ’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ అతడు చనిపోయాడా, బ్రతికే ఉన్నాడా అనేదే తక్షణ సందర్భం కాబట్టి ‘ప్రాణం’ బాగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: పౌలు మాటలను ఆ యువకుడు అసలు చనిపోలేదని చెప్పినట్లుగానీ, అతనికి ప్రాణం తిరిగి వచ్చిందని చెప్పినట్లుగానీ అర్థం చేసుకోవచ్చు. గ్రీకు వాక్యం స్వయంగా ఈ రెండింటిలో దేనినీ స్పష్టంగా తేల్చదు.
    reason: alternative_reading
lexical_decisions:
- source_word: καταβὰς
  choice: కిందికి వెళ్లి
  rationale: పై అంతస్తు ప్రాంతం నుంచి పౌలు దిగిన దిశను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి విషాదకర నివేదికకు ప్రతిస్పందనగా పౌలు చేసిన చర్యను స్వల్ప వ్యత్యాసంతో అనుసంధానిస్తుంది.
- source_word: ἐπέπεσεν αὐτῷ
  choice: అతని మీద పడి
  rationale: శారీరక చర్యను సన్నిహితంగా నిలుపుతూ, ప్రవక్తల పునరుద్ధరణ చర్యలను జ్ఞాపకం చేసే సంభావ్య ప్రతిధ్వనిని చెరపదు.
- source_word: συμπεριλαβὼν
  choice: అతన్ని కౌగిలించుకొని
  rationale: చుట్టూ చేతులు వేసి దగ్గరగా హత్తుకున్న చర్యను సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: Μὴ θορυβεῖσθε
  choice: ఆందోళన చెందకండి
  rationale: సందర్భంలోని భయం, కలత, గందరగోళం అనే భావాలను సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἡ γὰρ ψυχὴ αὐτοῦ
  choice: అతని ప్రాణం
  rationale: ψυχή పదానికి జీవం, స్వయం, ఆత్మ అనే అర్థాలు ఉండగలిగినా, ఇక్కడ అతడు జీవించి ఉన్నాడా అనే తక్షణ సందర్భంలో ‘ప్రాణం’ సహజంగా సరిపోతుంది; సాంకేతిక మానవశాస్త్ర సిద్ధాంతాన్ని రుద్దదు.
- source_word: ἐν αὐτῷ ἐστιν
  choice: అతనిలోనే ఉంది
  rationale: గ్రీకు వాక్యాన్ని నేరుగా నిలుపుతూ, ప్రాణం అప్పటికీ ఉందా లేక తిరిగి కలిగిందా అనే విషయాన్ని అనవసరంగా నిర్ణయించదు.
theological_decisions:
- issue: జీవన్మరణ సందర్భంలో ψυχή అర్థం
  choice: ‘ఆత్మ’కు బదులు ‘ప్రాణం’
  alternative: ‘అతని ఆత్మ అతనిలో ఉంది’
  rationale: సందర్భం యువకుని శారీరక జీవితం గురించినది. ‘ప్రాణం’ సాధారణ గ్రీకు వాడుకకు, తెలుగు సందర్భానికి సరిపోతూ, ఆత్మ శరీరం నుంచి వేరుపడగలదనే సిద్ధాంత ప్రకటనను వాక్యంలోకి దిగుమతి చేయదు.
- issue: యూతుకు అసలు చనిపోలేదా, లేక తిరిగి బ్రతికించబడ్డాడా
  choice: ప్రధాన పాఠంలో ‘అతని ప్రాణం అతనిలోనే ఉంది’ అని తటస్థంగా ఉంచడం
  alternative: ‘అతడు బ్రతికే ఉన్నాడు’ లేదా ‘అతని ప్రాణం తిరిగి వచ్చింది’
  rationale: గ్రీకు పదాలు అతని ప్రాణం అతనిలో ఉందని చెబుతాయి; అది ముందునుంచే ఉందా లేక పునరుద్ధరించబడిందా అని స్పష్టంగా తేల్చవు. కాబట్టి మూలంలోని theological tensionను నిలుపుతాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘అతని మీద పడి’ అనే కొంత సూటి రూపాన్ని సంభావ్య అంతర్‌పాఠ్య ప్రతిధ్వని కోసం నిలిపి, జీవితం పునరుద్ధరించబడిందా అనే అస్పష్టతను పాదసూచికతో స్పష్టం చేశాం.
