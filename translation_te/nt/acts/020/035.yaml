id: ACT.20.35
reference: Acts 20:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάντα ὑπέδειξα ὑμῖν ὅτι οὕτως κοπιῶντας δεῖ ἀντιλαμβάνεσθαι τῶν ἀσθενούντων, μνημονεύειν τε τῶν λόγων τοῦ κυρίου Ἰησοῦ ὅτι αὐτὸς εἶπεν Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/035.yaml
  text: In everything I showed you that by laboring in this way it is necessary to help the weak[a], and to remember the words of the Lord Jesus, that he himself said, ‘It is more blessed to give than to receive.’
translation:
  language: te
  text: 'ప్రతి విషయంలోనూ నేను మీకు చూపించాను: ఈ విధంగా కష్టపడి పనిచేస్తూ బలహీనులకు సహాయం చేయాలి[a]; ప్రభువైన యేసు స్వయంగా చెప్పిన మాటలను జ్ఞాపకం ఉంచుకోవాలి: ‘తీసుకోవడం కంటే ఇవ్వడం మరింత ధన్యమైనది.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బలహీనులకు అండగా నిలవాలి.’ గ్రీకు క్రియ కేవలం అప్పటికప్పుడు చేసే సహాయాన్నే కాక, కొనసాగిస్తూ ఆదరించడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: ప్రతి విషయంలోనూ
  rationale: ఇది ὑπέδειξα అనే క్రియతో క్రియావిశేషణాత్మకంగా సంబంధించి, పౌలు అన్ని విధాలా చూపించిన ఆదర్శాన్ని సూచిస్తుంది.
- source_word: ὑπέδειξα
  choice: నేను మీకు చూపించాను
  rationale: పౌలు బోధించడమే కాక తన ప్రవర్తన ద్వారా చూపించిన భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: οὕτως κοπιῶντας
  choice: ఈ విధంగా కష్టపడి పనిచేస్తూ
  rationale: οὕτως ముందున్న పౌలు పని విధానాన్ని సూచిస్తుంది; κοπιῶντας సాధారణ పనికంటే శ్రమతో కూడిన కృషిని తెలియజేస్తుంది.
- source_word: δεῖ
  choice: చేయాలి
  rationale: అవసరం లేదా నైతిక బాధ్యత అనే బలాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἀντιλαμβάνεσθαι
  choice: సహాయం చేయాలి
  rationale: అండగా నిలవడం లేదా ఆదుకోవడం అనే విస్తృత భావాన్ని సులభమైన తెలుగులో అందిస్తుంది; నిరంతర సహకార భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: τῶν ἀσθενούντων
  choice: బలహీనులకు
  rationale: శారీరక, ఆర్థిక, సామాజిక లేదా ఇతర బలహీనతలలో ఏ ఒక్కదానికీ పరిమితం చేయకుండా గ్రీకు పదంలోని విస్తృతిని కాపాడుతుంది.
- source_word: μνημονεύειν τε
  choice: జ్ఞాపకం ఉంచుకోవాలి
  rationale: ముందటి బాధ్యతతో సమన్వయంగా, యేసు మాటలను నిరంతరం గుర్తుంచుకోవాలనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τῶν λόγων τοῦ κυρίου Ἰησοῦ
  choice: ప్రభువైన యేసు ... మాటలను
  rationale: λόγων ను ‘మాటలు’గా నేరుగా అనువదించి, κύριος అనే బిరుదును ‘ప్రభువు’గా నిలుపుతుంది.
- source_word: αὐτὸς εἶπεν
  choice: స్వయంగా చెప్పిన
  rationale: αὐτός లోని ఉద్ఘాటనను కాపాడి, ఈ మాటను యేసే వ్యక్తిగతంగా చెప్పాడని తెలియజేస్తుంది.
- source_word: Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν
  choice: తీసుకోవడం కంటే ఇవ్వడంలోనే ఎక్కువ ధన్యత ఉంది
  rationale: μᾶλλον యొక్క తులనాత్మక బలాన్ని ‘ఎక్కువ’తో, μακάριον యొక్క ఆశీర్వాదస్థితిని ‘ధన్యత’తో కాపాడుతుంది.
theological_decisions:
- issue: ‘బలహీనులు’ అనే పదం యొక్క పరిధి
  choice: బలహీనులకు
  alternative: పేదలకు; రోగులకు; విశ్వాసంలో బలహీనులకు
  rationale: ἀσθενούντων అనే పదం సందర్భంలో విస్తృతార్థం కలిగి ఉంది. ఒక ప్రత్యేక బలహీనతకు పరిమితం చేయడం మూలపాఠం స్పష్టంగా చెప్పని భావాన్ని చేర్చుతుంది.
- issue: ఇవ్వడంలోని ధన్యత
  choice: తీసుకోవడం కంటే ఇవ్వడంలోనే ఎక్కువ ధన్యత ఉంది
  alternative: తీసుకోవడం కంటే ఇవ్వడమే ఎక్కువ ఆశీర్వాదకరం
  rationale: μακάριον ను కేవలం ఫలితంగా లభించే ఆశీర్వాదంగా కాక, ధన్యమైన స్థితిగా కూడా వినిపించేలా ‘ధన్యత’తో అనువదించాం; తులనాత్మక భావాన్ని యథాతథంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘ధన్యత’ బైబిలు సందర్భానికి తగిన గంభీరతను ఉంచుతుంది; మిగతా వాక్యం సహజమైన ప్రస్తుత తెలుగు వాక్యనిర్మాణాన్ని అనుసరిస్తుంది.
