  text: I coveted no one's silver or gold or clothing[a].
translation:
  language: te
  text: ఎవరి వెండి, బంగారం, వస్త్రాలనూ నేను ఆశపడలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ఎవరి వెండి, బంగారం, వస్త్రాలనూ కోరలేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργυρίου
  choice: వెండి
  rationale: ఇది అక్షరార్థంగా వెండిని సూచిస్తుంది. బంగారం, వస్త్రాలతో కూడిన విలువైన ఆస్తుల జాబితాలో ఉన్నందున నిర్దిష్టమైన ‘వెండి’ అనే భావాన్ని నిలుపుతుంది.
- source_word: χρυσίου
  choice: బంగారం
  rationale: వెండి, వస్త్రాలతో సమన్వయంగా ఉన్న ఈ నామవాచకానికి సహజమైన ప్రత్యక్ష అనువాదం.
- source_word: ἱματισμοῦ
  choice: వస్త్రాలు
  rationale: దుస్తులు లేదా వస్త్రాలను సూచిస్తుంది. ‘వస్త్రాలు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: οὐδενὸς
  choice: ఎవరి ... అయినా
  rationale: గ్రీకు షష్ఠీ విభక్తి ఈ వస్తువులు ఏ వ్యక్తికి చెందినవైనా సరే అనే భావాన్ని ఇస్తుంది. తెలుగులో ప్రతి అంశంతో ‘అయినా’ వాడటం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐπεθύμησα
  choice: ఆశించలేదు
  rationale: ఈ సందర్భంలో ఇతరుల ఆస్తిపట్ల తప్పుడు కోరికను సూచిస్తుంది. ‘ఆశించలేదు’ సహజమైన తెలుగు; నైతిక ప్రతికూల భావం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: ἢ ... ἢ ... ἢ
  choice: '...నైనా, ...నైనా, ...నైనా'
  rationale: పునరుక్త గ్రీకు వికల్ప సముచ్చయాన్ని తెలుగులో నిషేధ వాక్యానికి సహజమైన ‘అయినా’ నిర్మాణంతో ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: భౌతిక ఆస్తుల విషయంలో ἐπιθυμέω పదంలోని నైతిక భావం
  choice: ప్రధాన పాఠ్యంలో ‘ఆశించలేదు’ అని అనువదించడం
  alternative: ‘కోరుకోలేదు’ లేదా ‘లోభపడలేదు’
  rationale: పౌలు తన నిజాయితీని, ధనాశలేమిని సమర్థించుకుంటున్న సందర్భం తప్పుడు కోరికను సూచిస్తుంది. అయితే మూలపదం సాధారణంగా ‘కోరడం/ఆశించడం’ అనే విస్తృత అర్థాన్నీ కలిగి ఉంది. ‘ఆశించలేదు’ ఆ పదార్థ విస్తృతిని నిలుపుతూ, ‘లోభపడలేదు’ కంటే తక్కువ వ్యాఖ్యానాత్మకంగా ఉంటుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘వస్త్రాలు’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, సందర్భంలోని విలువైన వ్యక్తిగత ఆస్తుల భావాన్ని నిలుపుతుంది. పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో చేర్చబడింది.
