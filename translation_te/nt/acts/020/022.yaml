id: ACT.20.22
reference: Acts 20:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ ⸂δεδεμένος ἐγὼ⸃ τῷ πνεύματι πορεύομαι εἰς Ἰερουσαλήμ, τὰ ἐν αὐτῇ συναντήσοντά ⸀μοι μὴ εἰδώς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/022.yaml
  text: And now, behold, bound in the Spirit, I am going to Jerusalem, not knowing what will happen to me there,
translation:
  language: te
  text: ఇప్పుడు ఇదిగో, ఆత్మలో బంధించబడిన నేను[a] యెరూషలేముకు వెళ్తున్నాను; అక్కడ నాకు ఏమి ఎదురవుతుందో తెలియదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన ఆత్మలో బంధించబడిన నేను’; గ్రీకు పదబంధం పౌలు సొంత ఆత్మను గానీ పరిశుద్ధాత్మను గానీ సూచించవచ్చు. దీనిని ‘ఆత్మచేత నిర్బంధించబడి’ లేదా ‘ఆత్మచేత ప్రేరేపించబడి’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: పౌలు మాటలోని గంభీరమైన, నొక్కిచెప్పే మార్పును సహజమైన తెలుగు సంభాషణ సూచకంతో నిలుపుతుంది.
- source_word: δεδεμένος
  choice: బంధించబడిన
  rationale: ‘కట్టబడిన’ అనే మూల రూపకాన్ని నిలుపుతూ, అంతరంగ నిర్బంధమా లేక ఆత్మ నడిపించే బాధ్యతా అనే భావాన్ని ముందుగానే తేల్చదు.
- source_word: τῷ πνεύματι
  choice: ఆత్మలో
  rationale: దత్తివ విభక్తిలోని గ్రీకు పదబంధాన్ని సన్నిహితంగా అనువదిస్తూ, ఇది పరిశుద్ధాత్మను సూచిస్తుందా లేక పౌలు సొంత ఆత్మను సూచిస్తుందా అనే నిజమైన సందిగ్ధతను కొంతవరకు నిలుపుతుంది.
- source_word: πορεύομαι
  choice: వెళ్తున్నాను
  rationale: కొనసాగుతున్న లేదా సమీపంలో ఉన్న ప్రయాణాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τὰ ἐν αὐτῇ συναντήσοντά μοι
  choice: అక్కడ నాకు ఏమి ఎదురవుతుందో
  rationale: అక్షరార్థంగా ‘అక్కడ నన్ను కలుసుకోబోయే సంగతులు’ అనే భావాన్ని సహజమైన తెలుగులో, రాబోయే పరిణామాల భావంతో అందిస్తుంది.
- source_word: μὴ εἰδώς
  choice: తెలియదు
  rationale: పౌలుకు రాబోయే సంగతులు తెలియవనే భావాన్ని సంక్షిప్తమైన, సహజమైన తెలుగు వాక్య నిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: Ἰερουσαλήμ
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన స్థలనామ రూపం.
theological_decisions:
- issue: τῷ πνεύματι ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘ఆత్మలో’
  alternative: ‘తన ఆత్మలో బంధించబడి’ లేదా ‘ఆత్మచేత ప్రేరేపించబడి/నిర్బంధించబడి’
  rationale: అపొస్తలుల కార్యముల సందర్భంలో పరిశుద్ధాత్మ ఉద్దేశింపబడే అవకాశం బలంగా ఉన్నా, గ్రీకు నిర్మాణం పౌలు సొంత ఆత్మ అనే అర్థాన్నీ, ఆత్మ ప్రేరేపించిన నిర్బంధం అనే భావాన్నీ పూర్తిగా తొలగించదు. అందువల్ల ప్రధాన పాఠ్యం ఉద్రిక్తతను నిలుపుతుంది; ప్రత్యామ్నాయాలు పాదసూచికలో ఇవ్వబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి. ‘ఇదిగో’ మూలంలోని నొక్కిచెప్పే సంభాషణ సూచనను ఉంచుతుంది; ‘ఆత్మలో బంధించబడిన’ అనే రూపకం మూలపాఠ్యంలోని ఉద్దేశపూర్వక సందిగ్ధతను కాపాడుతుంది.
