    rationale: In the draft, "...సంఘాన్ని కాపరులుగా పోషించడానికి" follows a long relative clause and can be read awkwardly. "సంఘానికి కాపరి సేవ చేయడానికి" clearly expresses ποιμαίνειν and maintains the Greek purpose relation to the Spirit's appointment.
