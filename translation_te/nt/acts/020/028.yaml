id: ACT.20.28
reference: Acts 20:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, ἐν ᾧ ὑμᾶς τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν τὴν ἐκκλησίαν τοῦ ⸀θεοῦ, ἣν περιεποιήσατο διὰ τοῦ ⸂αἵματος τοῦ ἰδίου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/028.yaml
  text: Pay careful attention to yourselves and to all the flock[a], in which the Holy Spirit has appointed you overseers, to shepherd the church of God[c][b], which he obtained through the blood of his own.
translation:
  language: te
  text: మీ గురించీ, మొత్తం మంద గురించీ జాగ్రత్తగా ఉండండి. పరిశుద్ధాత్మ మిమ్మల్ని ఆ మందలో పర్యవేక్షకులుగా నియమించాడు—దేవుడు తన సొంతవాని రక్తం ద్వారా తనకోసం సంపాదించుకున్న దేవుని సంఘానికి[a] కాపరి సేవ చేయడానికి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో “దేవుని సంఘం” బదులు “ప్రభువు సంఘం” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: '“తన సొంత కుమారుని రక్తం ద్వారా” అని కూడా అర్థం చేసుకోవచ్చు; సంప్రదాయ అనువాదం: “తన సొంత రక్తంతో.”'
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχετε
  choice: జాగ్రత్తగా ఉండండి
  rationale: వర్తమాన ఆజ్ఞారూపం నిరంతర అప్రమత్తతను సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండడంతో పాటు స్వవిషయమై, మంద విషయమై శ్రద్ధ వహించాలనే భావాన్ని తెలియజేస్తుంది.
- source_word: ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ
  choice: మీ విషయంలోనూ మంద అంతటి విషయంలోనూ
  rationale: ἑαυτοῖς యొక్క స్వీయ శ్రద్ధను, παντί యొక్క సమగ్రతను నిలుపుతూ, ποίμνιον అనే కాపరి రూపకాన్ని ‘మంద’గా ఉంచింది.
- source_word: ἐν ᾧ
  choice: ఆ మందలో
  rationale: నాయకులు మందకు వెలుపల కాక దానిలోనే ఉంచబడ్డారనే గ్రీకు భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔθετο
  choice: నియమించాడు
  rationale: ఇక్కడ τίθημι ఒక బాధ్యతగల స్థానంలో ఉంచడం లేదా నియమించడం అనే అర్థంలో ఉంది.
- source_word: ἐπισκόπους
  choice: పర్యవేక్షకులుగా
  rationale: తరువాతి కాలపు ప్రత్యేక సంఘపదవిని ముందుగానే దిగుమతి చేయకుండా, పర్యవేక్షణ బాధ్యత అనే మూలార్థాన్ని ఇస్తుంది.
- source_word: ποιμαίνειν
  choice: కాపరులుగా పోషించడానికి
  rationale: కాపరి రూపకాన్ని నిలుపుతూ, కేవలం ఆహారం పెట్టడం కాక సంరక్షించడం, నడిపించడం అనే విస్తృత సేవాభావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐκκλησίαν
  choice: సంఘాన్ని
  rationale: ఇక్కడ దేవునికి చెందిన క్రైస్తవ విశ్వాసుల సమాజాన్ని సూచించే స్థిరమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: ఇచ్చిన SBLGNT ప్రధాన పాఠంలోని θεοῦను నేరుగా అనుసరిస్తుంది; ‘ప్రభువు’ అనే పాఠాంతరం పాదసూచికలో ఉంచబడింది.
- source_word: περιεποιήσατο
  choice: తనకోసం సంపాదించుకున్న
  rationale: మధ్యమ ప్రయోగంలోని ‘తన కోసం స్వాధీనం చేసుకోవడం’ అనే భావాన్ని నిలుపుతుంది; ‘కొనుగోలు చేశాడు’ అని వ్యాపార రూపకాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: διὰ τοῦ αἵματος
  choice: రక్తం ద్వారా
  rationale: διά + షష్ఠీ విభక్తి ఇక్కడ సాధనం లేదా మాధ్యమాన్ని సూచిస్తుంది; బలి మరియు విమోచన భావాన్ని నిలుపుతుంది.
- source_word: τοῦ ἰδίου
  choice: తన సొంతవాని
  rationale: ἴδιος నామవాచకార్థకంగా వాడబడిన సంక్షిప్త గ్రీకు నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది. ‘కుమారుడు’ అని ప్రధాన పాఠంలో చేర్చి సందిగ్ధతను తొలగించకుండా, తెలుగు పాఠకుడికి వ్యక్తి సూచనను తెలియజేస్తుంది.
theological_decisions:
- issue: τοῦ αἵματος τοῦ ἰδίου అనే పదబంధంలోని సూచన మరియు భావం
  choice: ప్రధాన పాఠంలో ‘తన సొంతవాని రక్తం ద్వారా’
  alternative: ‘తన సొంత కుమారుని రక్తం ద్వారా’; సంప్రదాయంగా ‘తన సొంత రక్తంతో’
  rationale: గ్రీకు పదబంధం సంక్షిప్తంగా ఉండి ‘తన సొంతవాని’ అని వ్యక్తిని సూచించవచ్చు; సందర్భానుసారం దాన్ని కుమారునిగా అర్థం చేసుకోవచ్చు. అయితే ‘కుమారుడు’ మూలపాఠంలో ప్రత్యక్షంగా లేదు. మరోవైపు ‘తన సొంత రక్తం’ అనే సంప్రదాయ అనువాదం దేవుని సంఘం అనే ముందరి పదబంధంతో బలమైన క్రీస్తుశాస్త్రీయ వాక్యంగా చదవబడుతుంది. ప్రధాన పాఠం ఈ ఉద్రిక్తతను పరిష్కరించకుండా ఉంచి, ప్రత్యామ్నాయాలను పాదసూచికలో తెలుపుతుంది.
- issue: τοῦ θεοῦ పాఠాంతరం
  choice: ‘దేవుని సంఘం’ అనే SBLGNT ప్రధాన పాఠాన్ని అనుసరించడం
  alternative: ‘ప్రభువు సంఘం’
  rationale: ఇచ్చిన మూలపాఠం θεοῦ అని చదువుతుంది. ప్రాముఖ్యమైన ‘ప్రభువు’ పాఠాంతరాన్ని ప్రధాన పాఠంలో కలపకుండా పాదసూచికలో భద్రపరచడం పాఠసాక్ష్యానికి న్యాయం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘మంద,’ ‘కాపరులు’ అనే మూల కాపరి రూపకం నిలుపబడింది; ‘పర్యవేక్షకులు’ అనే పదం తరువాతి కాలపు నిర్దిష్ట సంఘపదవి భావాన్ని రుద్దకుండా బాధ్యతను సూచిస్తుంది. వాక్యక్రమం తెలుగులో సహజంగా ఉండేలా మార్చినా, పరిశుద్ధాత్మ నియామకం, మందలో వారి స్థానం, సంఘాన్ని పోషించే ఉద్దేశం, రక్తం ద్వారా సంపాదించడం అనే సంబంధాలు అన్నీ నిలుపబడ్డాయి.
