  source_fidelity: The draft correctly follows the SBLGNT reading "church of God," preserves the variant "church of the Lord" in a footnote, and appropriately retains the interpretive openness of τοῦ ἰδίου. However, the Telugu purpose clause is syntactically strained, and "కాపరులుగా పోషించడానికి" narrows ποιμαίνειν toward feeding rather than conveying the full shepherding metaphor.
  naturalness: '"మీ విషయంలోనూ మంద అంతటి విషయంలోనూ" is awkward in modern standard Telugu. "కాపరులుగా పోషించడానికి" is also not the most natural way to express pastoral care for a congregation. Recasting the sentence makes the Greek relationships clear and the Telugu fluent.'
  terminology: '"పర్యవేక్షకులు," "దేవుని సంఘం," and "రక్తం ద్వారా" are suitable. "కాపరి సేవ చేయడానికి" preserves the pastoral metaphor without importing a later ecclesiastical office title. "తన సొంతవాని" is retained deliberately, with the footnote explaining the likely "Son" interpretation and the traditional alternative.'
  issues:
