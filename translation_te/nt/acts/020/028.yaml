    issue: Awkward rendering of the opening objects of προσέχετε
    rationale: '"మీ విషయంలోనూ మంద అంతటి విషయంలోనూ" is not idiomatic modern Telugu. "మీ గురించీ, మొత్తం మంద గురించీ" communicates the required vigilance naturally and retains the scope of παντὶ.'
