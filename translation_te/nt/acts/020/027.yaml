revisions:
- from: ఎందుకంటే, దేవుని సంకల్పమంతటినీ[a] మీకు ప్రకటించకుండా నేను వెనుకాడలేదు.
  to: ఎందుకంటే, దేవుని సంకల్పమంతటినీ[a] మీకు ప్రకటించడానికి నేను వెనుకాడలేదు.
  rationale: The revision replaces the potentially ambiguous negative gerund with the idiomatic Telugu complement ‘ప్రకటించడానికి,’ which directly reflects the Greek sense of not shrinking back from declaring. The rendering ‘దేవుని సంకల్పమంతటినీ’ and its lexical-alternative footnote are retained because they preserve the broad semantic range of βουλὴ τοῦ θεοῦ.
