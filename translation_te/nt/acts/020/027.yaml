id: ACT.20.27
reference: Acts 20:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γὰρ ὑπεστειλάμην τοῦ μὴ ἀναγγεῖλαι ⸂πᾶσαν τὴν βουλὴν τοῦ θεοῦ ὑμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/027.yaml
  text: For I did not shrink back from declaring to you the whole counsel of God[a].
translation:
  language: te
  text: ఎందుకంటే, దేవుని సంకల్పమంతటినీ[a] మీకు ప్రకటించడానికి నేను వెనుకాడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవుని ఉద్దేశమంతటినీ,” “దేవుని ప్రణాళిక అంతటినీ,” లేక “దేవుని చిత్తమంతటినీ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న వాక్యానికి కారణాన్ని తెలియజేసే అనుసంధాన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὑπεστειλάμην
  choice: నేను వెనుకాడలేదు
  rationale: ὑποστέλλω మధ్యమ రూపంలోని వెనక్కి తగ్గడం లేదా చేయవలసిన దానిని చేయకుండా నిలిపివేయడం అనే భావాన్ని కాపాడుతుంది; అపొస్తలుల కార్యములు 20:20లోని సమీప సందర్భంతోనూ సరిపోతుంది.
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: ప్రకటించకుండా
  rationale: ὑποστέλλωకు పూరకంగా ఉన్న ఆర్టిక్యులర్ ఇన్ఫినిటివ్ నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. ἀναγγέλλωలోని తెలియజేయడం/ప్రకటించడం అనే గంభీర బోధనా భావానికి ‘ప్రకటించు’ సరిపోతుంది.
- source_word: πᾶσαν
  choice: అంతటినీ
  rationale: ఏకవచనమైన βουλήతో కలిసి సంపూర్ణతను నొక్కిచెప్పే ‘మొత్తం/యావత్తు’ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: βουλήν
  choice: సంకల్పం
  rationale: βουλήలోని ఆలోచన, ఉద్దేశం, ప్రణాళిక, చిత్తం అనే విస్తృత భావపరిధిని తెలుగులో ‘సంకల్పం’ సముచితంగా మోస్తుంది; ఒక్క సిద్ధాంతార్థానికే పరిమితం చేయదు.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: సంకల్పం దేవునికి చెందినదని లేదా ఆయననుండి ఉద్భవించిందని తెలిపే సంబంధ విభక్తిని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: ప్రకటనను ఎఫెసు పెద్దలకు ఉద్దేశించి చేసినట్లు దత్తి విభక్తి భావాన్ని సహజంగా కాపాడుతుంది.
theological_decisions:
- issue: βούλη τοῦ θεοῦ యొక్క భావం
  choice: దేవుని సంకల్పమంతటినీ
  alternative: దేవుని ఉద్దేశమంతటినీ; దేవుని ప్రణాళిక అంతటినీ; దేవుని చిత్తమంతటినీ
  rationale: βούλη దేవుని ఉద్దేశం, ప్రణాళిక, నిర్ణయం లేదా చిత్తాన్ని సూచించగలదు. ‘సంకల్పం’ ఈ విస్తృతిని చాలావరకు నిలుపుతూ, దానిని కేవలం శాశ్వత నిర్ణయంగా గానీ కేవలం నైతిక చిత్తంగా గానీ సంకుచితం చేయదు. ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చి అసలు పదంలోని భావసంభావ్యతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే ప్రసంగ సందర్భానికి తగిన గౌరవగంభీరతతో రూపొందించబడింది. ‘వెనుకాడలేదు’ మూలంలోని రూపక భావాన్ని నిలుపుతుంది; ‘సంకల్పం’ βουλή యొక్క ఉద్దేశం/ప్రణాళిక/చిత్తం అనే భావవిస్తృతిని కాపాడుతుంది.
