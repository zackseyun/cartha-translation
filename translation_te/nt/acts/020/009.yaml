id: ACT.20.9
reference: Acts 20:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀καθεζόμενος δέ τις νεανίας ὀνόματι Εὔτυχος ἐπὶ τῆς θυρίδος, καταφερόμενος ὕπνῳ βαθεῖ διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον, κατενεχθεὶς ἀπὸ τοῦ ὕπνου ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω καὶ ἤρθη νεκρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/009.yaml
  text: And a certain young man named Eutychus[a], sitting in the window, was sinking into a deep sleep while Paul was speaking at length; and being overcome by sleep, he fell down from the third story and was picked up dead.
translation:
  language: te
  text: కిటికీలో కూర్చున్న ఐతుకు అనే ఒక యువకుడు, పౌలు చాలాసేపు మాట్లాడుతుండగా గాఢనిద్రలోకి జారిపోయాడు. నిద్రకు పూర్తిగా లోనై అతడు మూడవ అంతస్తు నుంచి కింద పడ్డాడు; అతణ్ణి చనిపోయినవాడిగా ఎత్తుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతణ్ణి చనిపోయినవాడిగా తీసుకుపోయారు.” గ్రీకు క్రియకు “ఎత్తుకోవడం” లేదా “తీసుకుపోవడం” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεζόμενος δέ τις νεανίας
  choice: ఒక యువకుడు ... కూర్చున్నాడు
  rationale: వర్తమాన మధ్యమ కృదంతం అతని కొనసాగుతున్న భంగిమను తెలియజేస్తుంది. τις అనే అనిర్దిష్టతను సహజమైన తెలుగులో ‘ఒక’తో చూపించాం.
- source_word: ὀνόματι Εὔτυχος
  choice: ఐతుకు అనే
  rationale: గ్రీకు పేరుకు సమీపమైన తెలుగు లిప్యంతరీకరణను, పేరును పరిచయం చేసే సహజ తెలుగు నిర్మాణంతో ఇచ్చాం.
- source_word: ἐπὶ τῆς θυρίδος
  choice: కిటికీలో
  rationale: θυρίς కిటికీ లేదా గోడలోని కిటికీ తెరువును సూచిస్తుంది; తరువాతి పతనానికి సరిపోయేలా ‘కిటికీలో’ సహజంగా ఉంటుంది.
- source_word: καταφερόμενος ὕπνῳ βαθεῖ
  choice: గాఢనిద్రలోకి జారిపోయాడు
  rationale: καταφέρω యొక్క క్రమంగా నిద్రవశం కావడం అనే సజీవ భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον
  choice: పౌలు చాలాసేపు మాట్లాడుతుండగా
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణాన్ని కాలసంబంధ ఉపవాక్యంగా మార్చాం; ఇక్కడ διαλέγομαι ప్రసంగించడం లేదా మాట్లాడడం అనే భావంలో ఉంది.
- source_word: κατενεχθεὶς ἀπὸ τοῦ ὕπνου
  choice: నిద్రకు పూర్తిగా లోనై
  rationale: ముందు మొదలైన నిద్రమత్తు నిర్ణాయకంగా అతన్ని వశపరచుకున్న దశను సూచిస్తుంది; పునరుక్తిని తగ్గిస్తూ మూలంలోని బలాన్ని నిలిపింది.
- source_word: ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω
  choice: మూడో అంతస్తు నుంచి కింద పడి
  rationale: τρίστεγον మూడో అంతస్తును, κάτω కిందికి జరిగిన చలనాన్ని స్పష్టంగా తెలియజేస్తాయి.
- source_word: ἤρθη νεκρός
  choice: చనిపోయినవాడిగా పైకి ఎత్తబడ్డాడు
  rationale: ἤρθη అనే నిష్క్రియ రూపాన్ని ‘పైకి ఎత్తబడ్డాడు’గా దగ్గరగా నిలిపి, νεκρόςను ఎలాంటి మృదీకరణ లేకుండా ‘చనిపోయినవాడిగా’ అనువదించాం.
theological_decisions:
- issue: νεκρόςను ‘చనిపోయినవాడు’గా తీసుకోవాలా, లేక ‘చనిపోయినట్లు కనిపించాడు’గా మృదీకరించాలా
  choice: చనిపోయినవాడిగా
  alternative: చనిపోయినట్లు కనిపించినవాడిగా
  rationale: గ్రీకు పాఠం మరణాన్ని నేరుగా చెబుతుంది; సందేహం లేదా కనిపించిన స్థితిని సూచించే పదం లేదు. అందువల్ల కథనంలోని ఉద్రిక్తతను తగ్గించలేదు.
- issue: ἤρθη యొక్క అర్థాన్ని ‘పైకి ఎత్తబడ్డాడు’గా లేదా ‘తీసుకుపోబడ్డాడు’గా ఇవ్వడం
  choice: పైకి ఎత్తబడ్డాడు
  alternative: తీసుకుపోబడ్డాడు
  rationale: αἴρω నిష్క్రియ రూపానికి రెండు అర్థాలూ సందర్భంలో సాధ్యమే. ప్రధాన పాఠంలో భౌతికంగా ఎత్తడం అనే సమీప అర్థాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. చిన్న వాక్య విభజన ద్వారా దీర్ఘమైన గ్రీకు వాక్యంలోని సంఘటనల క్రమాన్ని సాధారణ పాఠకులకు స్పష్టంగా ఉంచాం; మూలంలోని మరణ ప్రకటనను మృదీకరించలేదు.
