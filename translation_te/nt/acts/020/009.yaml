revisions:
- from: ఐతుకు అనే ఒక యువకుడు కిటికీలో కూర్చున్నాడు. పౌలు చాలాసేపు మాట్లాడుతుండగా అతడు గాఢనిద్రలోకి జారిపోయాడు. నిద్రకు పూర్తిగా లోనై, మూడో అంతస్తు నుంచి కింద పడి, చనిపోయినవాడిగా పైకి ఎత్తబడ్డాడు.[a]
  to: కిటికీలో కూర్చున్న ఐతుకు అనే ఒక యువకుడు, పౌలు చాలాసేపు మాట్లాడుతుండగా గాఢనిద్రలోకి జారిపోయాడు. నిద్రకు పూర్తిగా లోనై అతడు మూడవ అంతస్తు నుంచి కింద పడ్డాడు; అతణ్ణి చనిపోయినవాడిగా ఎత్తుకున్నారు.[a]
  rationale: The revision preserves every narrative element and the unqualified statement that Eutychus was dead. It replaces an unnatural, directionally over-specific literalism with idiomatic Telugu for the contextual sense of ἤρθη, and aligns the alternative footnote with that same lexical range.
