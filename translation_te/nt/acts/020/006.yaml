translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. పండుగను స్పష్టం చేయడానికి సందర్భానుసారంగా ‘పండుగ’ చేర్చబడింది; ప్రయాణ వ్యవధికి సంబంధించిన గ్రీకు ప్రయోగంలోని స్వల్ప సందిగ్ధత పాదసూచికలో నిలుపబడింది.
