  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἐξεπλεύσαμεν μετὰ τὰς ἡμέρας τῶν ἀζύμων ἀπὸ Φιλίππων, καὶ ἤλθομεν πρὸς αὐτοὺς εἰς τὴν Τρῳάδα ἄχρι ἡμερῶν πέντε, ⸀οὗ διετρίψαμεν ἡμέρας ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/006.yaml
  text: But we sailed away from Philippi after the days of Unleavened Bread[a], and came to them at Troas within five days, where we stayed seven days.
translation:
  language: te
  text: కానీ పులియని రొట్టెల పండుగ దినాలు ముగిసిన తర్వాత మేము ఫిలిప్పీ నుండి ఓడలో బయలుదేరి, ఐదు రోజుల్లో[a] త్రోయలో వారివద్దకు చేరుకున్నాం. అక్కడ మేము ఏడు రోజులు ఉన్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఐదు రోజుల ప్రయాణం చేసి.’ గ్రీకు ప్రయోగం అక్కడికి చేరేవరకు ప్రయాణం సాగిన కాలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλεύσαμεν
  choice: ఓడలో బయలుదేరి
  rationale: ἐκπλέω ఓడ ద్వారా ఒక ప్రదేశం నుండి బయలుదేరడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఉంది.
- source_word: μετὰ τὰς ἡμέρας τῶν ἀζύμων
  choice: పులియని రొట్టెల పండుగ రోజులు గడిచిన తర్వాత
  rationale: గ్రీకు వాక్యంలోని ‘పులియనివాటి రోజులు’ అనే యూదుల పండుగకాల సూచనను సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀπὸ Φιλίππων
  choice: ఫిలిప్పీ నుండి
  rationale: ἀπό ఇక్కడ బయలుదేరిన స్థలాన్ని సూచిస్తుంది; నగరనామాన్ని తెలుగులో ఫిలిప్పీగా లిప్యంతరీకరించాం.
- source_word: ἤλθομεν πρὸς αὐτοὺς
  choice: వారి దగ్గరికి చేరుకున్నాం
  rationale: వ్యక్తుల వైపు ప్రయాణించి వారి వద్దకు చేరడాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; ‘వారితో కలిశాం’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: εἰς τὴν Τρῳάδα
  choice: త్రోయలో ఉన్న
  rationale: గమ్యస్థలమైన త్రోయను, అక్కడ ఉన్న వ్యక్తులతో సహజమైన తెలుగు వాక్యనిర్మాణంలో అనుసంధానిస్తుంది.
- source_word: ἄχρι ἡμερῶν πέντε
  choice: ఐదు రోజుల్లో
  rationale: ἄχρι + కాలపరిమాణం రాక వరకు సాగిన ప్రయాణ వ్యవధిని సూచిస్తుంది; ‘ఐదు రోజుల్లో’ ఆ భావాన్ని సంక్షిప్తంగా ఇస్తుంది, అయితే ప్రత్యామ్నాయ అవగాహనను పాదసూచికలో ఉంచాం.
- source_word: οὗ
  choice: అక్కడ
  rationale: ఈ సంబంధావ్యయం ముందున్న త్రోయను తిరిగి సూచిస్తుంది; కొత్త తెలుగు వాక్యంలో ‘అక్కడ’ సహజంగా ఉంటుంది.
- source_word: διετρίψαμεν ἡμέρας ἑπτά
  choice: మేము ఏడు రోజులు ఉన్నాం
  rationale: διατρίβω ప్రయాణ సందర్భంలో ఒక ప్రదేశంలో కొంతకాలం ఉండడాన్ని సూచిస్తుంది.
