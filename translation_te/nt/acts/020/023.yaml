  yaml_path: translation/nt/acts/020/023.yaml
  text: except that the Holy Spirit testifies to me in city after city[c][b][a], saying that chains and afflictions await me.
translation:
  language: te
  text: అయితే, ఒక్కో పట్టణంలో[a] పరిశుద్ధాత్మ నాకు సాక్ష్యమిస్తూ, సంకెళ్లూ[b] శ్రమలూ నాకు[c] ఎదురుచూస్తున్నాయని చెబుతున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఒక్కో పట్టణంలో’ అనే మాటను ‘పట్టణం వెంట పట్టణంలో’ లేదా ‘ప్రతి పట్టణంలో’ అని కూడా అనువదించవచ్చు. గ్రీకు నుడికారం వరుసగా వివిధ పట్టణాల్లో సాక్ష్యం పునరావృతమవుతున్నదని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘సంకెళ్లు’ అనే పదానికి ‘బంధాలు’ అని కూడా అనువదించవచ్చు. ‘సంకెళ్లు’ గ్రీకు పదంలోని స్పష్టమైన దృశ్యాన్ని నిలుపుతుంది.
    reason: lexical_alternative
  - marker: c
    text: కొన్ని ప్రాచీన ప్రతుల్లో ‘నాకు’ అనే పదం ఉనికి లేదా స్థానంలో స్వల్ప భేదం ఉంది; అయినా సంకెళ్లూ శ్రమలూ పౌలుకు ఎదురుచూస్తున్నాయనే భావం మారదు.
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν ὅτι
  choice: అయితే
  rationale: ముందరి వాక్యంలోని మాటకు ఇక్కడ ఒక మినహాయింపు లేదా పరిమితిని జోడించే వ్యతిరేక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: పరిశుద్ధాత్మ
  rationale: దైవిక ఆత్మను సూచించే నిర్దిష్ట గ్రీకు పదబంధానికి ఆధునిక ప్రామాణిక తెలుగు రూపం.
- source_word: κατὰ πόλιν
  choice: పట్టణం పట్టణంలో
  rationale: κατά + ఏకవచన నామవాచకం తెలిపే పంపిణీ, పునరావృత భావాన్ని—వరుసగా వివిధ పట్టణాల్లో—విశ్వవ్యాప్తిగా అతిశయింపకుండా నిలుపుతుంది.
- source_word: διαμαρτύρεταί μοι
  choice: నాకు సాక్ష్యమిస్తూ
  rationale: గంభీరంగా సాక్ష్యమిచ్చే భావాన్ని నిలుపుతుంది; ‘హెచ్చరిస్తూ’ అనడం మూలంలో ఉన్న భవిష్యద్వాణి విషయాన్ని అనవసరంగా వ్యాఖ్యానిస్తుంది.
- source_word: λέγον
  choice: చెబుతున్నాడు
  rationale: ఆత్మ ఇచ్చే సాక్ష్యంలోని విషయాన్ని నేరుగా పరిచయం చేస్తుంది; తెలుగు వాక్య నిర్మాణంలో వ్యక్తిగత కర్తకు సహజంగా సరిపోతుంది.
- source_word: δεσμὰ
  choice: సంకెళ్లు
  rationale: కారాగార బంధాన్ని మాత్రమే చెప్పకుండా, గ్రీకులోని స్పష్టమైన బంధనాల దృశ్యాన్ని నిలుపుతుంది.
- source_word: θλίψεις
  choice: బాధలు
  rationale: ఒత్తిడి, కష్టాలు, పీడలను సూచించే పదానికి సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన తెలుగు సమానం.
- source_word: με
  choice: నా కోసం
  rationale: సంకెళ్లూ బాధలూ పౌలు కోసం వేచి ఉన్నాయనే కర్మసంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μένουσιν
  choice: ఎదురుచూస్తున్నాయి
  rationale: ఇవి పౌలుకు ముందున్నాయని, అతని కోసం సిద్ధంగా ఉన్నాయని తెలిపే భవిష్యన్ముఖ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: పరిశుద్ధాత్మ ప్రస్తావన
  choice: పౌలుకు సాక్ష్యమిస్తూ చెప్పే వ్యక్తిగత దైవిక కర్తగా అనువదించడం
  alternative: వ్యక్తిత్వం లేని ఆధ్యాత్మిక ప్రభావంగా అర్థం చేసుకోవడం
  rationale: క్రియలు సాక్ష్యమివ్వడం, చెప్పడం అనే వ్యక్తిగత కార్యాలను పరిశుద్ధాత్మకు ఆపాదిస్తున్నాయి; అనువాదం ఈ వ్యాకరణ సాక్ష్యాన్ని మాత్రమే నిలుపుతుంది, అదనపు సిద్ధాంత వివరాలను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా గౌరవప్రదమైన బైబిలు శైలిని నిలుపుతూ రూపొందించబడింది. పంపిణీ భావానికి ‘పట్టణం పట్టణంలో’ వాడబడింది; స్పష్టత కోసం అన్ని పాదసూచిక గుర్తులు ప్రధాన వచనంలో చేర్చబడ్డాయి.
