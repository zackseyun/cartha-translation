source:
  edition: SBLGNT
  text: συνείπετο δὲ ⸀αὐτῷ Σώπατρος ⸀Πύρρου Βεροιαῖος, Θεσσαλονικέων δὲ Ἀρίσταρχος καὶ Σεκοῦνδος, καὶ Γάϊος Δερβαῖος καὶ Τιμόθεος, Ἀσιανοὶ δὲ Τυχικὸς καὶ Τρόφιμος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/004.yaml
  text: And Sopater son of Pyrrhus[a], a Berean, accompanied him; and Aristarchus and Secundus from Thessalonica; and Gaius of Derbe, and Timothy[b]; and Tychicus and Trophimus from Asia.
translation:
  language: te
  text: 'అతనితో పాటు వెళ్లినవారు: బెరయకు చెందిన పిర్రు కుమారుడు సోపత్రు; థెస్సలొనీకకు చెందిన అరిస్తార్కు, సెకుందు; దెర్బేకు చెందిన గాయి, తిమోతి; ఆసియాకు చెందిన[a] తుకికు, త్రోఫిము.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “ఆసియా” అంటే ఆధునిక ఆసియా ఖండం కాదు; రోమా సామ్రాజ్యంలోని ఆసియా పరిపాలనా ప్రాంతం.
    reason: cultural_note
lexical_decisions:
- source_word: συνείπετο
  choice: అతనితో పాటు వెళ్లాడు
  rationale: సυνέπομαι అనే క్రియలో ఉన్న ‘ఒకరితో కలిసి ప్రయాణించడం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న ప్రయాణ భావం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: αὐτῷ
  choice: అతనితో
  rationale: దత్తివిభక్తి సర్వనామం పౌలును సూచిస్తుంది; συνέπομαιతో కలిసి తెలుగులో సహజంగా ‘అతనితో పాటు’ అవుతుంది.
- source_word: Σώπατρος Πύρρου Βεροιαῖος
  choice: బెరయకు చెందిన పిర్రు కుమారుడు సోపత్రు
  rationale: Πύρρουను తండ్రి పేరును సూచించే సంబంధవిభక్తిగా తీసుకొని ‘పిర్రు కుమారుడు’ అని, Βεροιαῖοςను భౌగోళిక గుర్తింపుగా ‘బెరయకు చెందిన’ అని అనువదించాం.
- source_word: Θεσσαλονικέων
  choice: థెస్సలొనీకవారిలో
  rationale: సంబంధవిభక్తి బహువచనం అరిస్తార్కు, సెకుందులను థెస్సలొనీక ప్రజలలోనివారిగా సమూహీకరిస్తుంది. ‘థెస్సలొనీకవారిలో’ మూల నిర్మాణాన్ని, భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: Γάϊος Δερβαῖος
  choice: దెర్బేకు చెందిన గాయి
  rationale: Δερβαῖος వ్యక్తి దెర్బే ప్రాంతానికి చెందినవాడని తెలిపే భౌగోళిక విశేషణం; ఆధునిక తెలుగులో ‘దెర్బేకు చెందిన’ సహజంగా ఉంటుంది.
- source_word: Ἀσιανοὶ
  choice: ఆసియాకు చెందిన
  rationale: ఇక్కడ పదం ఆధునిక ఆసియా ఖండాన్ని కాక రోమా సామ్రాజ్యంలోని ఆసియా ప్రాంతానికి చెందినవారిని సూచిస్తుంది. ఆ చారిత్రక వివరణను పాదసూచికలో ఇచ్చాం.
- source_word: δέ ... δέ ... δέ
  choice: '... కూడా'
  rationale: పునరావృతమయ్యే δέ జాబితాలో కొత్త వ్యక్తులను చేర్చే పని చేస్తుంది. తెలుగులో విరామచిహ్నాలు మరియు చివరి ‘కూడా’ ఆ సంకలన భావాన్ని సహజంగా అందిస్తాయి.
