translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా ఉండే గౌరవప్రదమైన శైలిని వాడాం. వ్యక్తుల జాబితా స్పష్టంగా చదవబడేందుకు మూలంలోని మొదటి ఏకవచన క్రియను తొలి వాక్యంలో నిలిపి, మిగిలిన సహచరులకు మూలంలో అంతర్లీనంగా ఉన్న ప్రయాణ భావాన్ని రెండో వాక్యంలో ‘కూడా వెళ్లారు’ అని స్పష్టం చేశాం. పేర్లకు తెలుగు బైబిలు వాడుకకు దగ్గరైన లిప్యంతరీకరణను ఎంచుకున్నాం.
