  text: δουλεύων τῷ κυρίῳ μετὰ πάσης ταπεινοφροσύνης ⸀καὶ δακρύων καὶ πειρασμῶν τῶν συμβάντων μοι ἐν ταῖς ἐπιβουλαῖς τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/019.yaml
  text: serving the Lord with all humility and with tears and trials that happened to me through the plots of the Jews[a][b].
translation:
  language: te
  text: పూర్ణ వినయంతోను, కన్నీళ్లతోను, యూదుల[b] కుట్రల ద్వారా నాకు ఎదురైన శ్రమలతోను ప్రభువుకు సేవ చేస్తూ వచ్చాను[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పరీక్షలతో” లేదా “శోధనలతో.” ఇక్కడ ఈ పదం విరోధుల కుట్రల ద్వారా కలిగిన బాహ్య శ్రమలను లేదా పరీక్షలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “యూదులు” అంటే పౌలుకు వ్యతిరేకంగా కుట్ర చేసిన నిర్దిష్ట యూదు విరోధులు; యూదులందరూ అని కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: δουλεύων
  choice: సేవ చేస్తూ వచ్చాను
  rationale: వర్తమాన కృదంతం పౌలు సేవలో కొనసాగిన విధానాన్ని తెలుపుతుంది. తెలుగు వాక్యసందర్భంలో ‘సేవ చేస్తూ వచ్చాను’ అంకితభావంతో సాగిన సేవను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τῷ κυρίῳ
  choice: ప్రభువుకు
  rationale: κύριος అనే బిరుదును అదనంగా ఎవరని నిర్దిష్టం చేయకుండా ‘ప్రభువు’గా నిలుపుతుంది.
- source_word: μετὰ πάσης ταπεινοφροσύνης
  choice: పూర్ణ వినయంతో
  rationale: πάσης యొక్క సమగ్ర బలాన్ని ‘పూర్ణ’ తెలియజేస్తుంది; μετά ఇక్కడ సేవ చేసిన విధానాన్ని సూచిస్తుంది.
- source_word: δακρύων
  choice: కన్నీళ్లతో
  rationale: మూలంలోని స్పష్టమైన బహువచన నామవాచకపు భావోద్వేగ తీవ్రతను నేరుగా నిలుపుతుంది.
- source_word: πειρασμῶν
  choice: పరీక్షలతో
  rationale: ఈ సందర్భంలో పాపానికి ప్రలోభాలకంటే విరోధుల కుట్రలవల్ల కలిగిన బాహ్య కష్టాలు లేదా పరీక్షలే ఉద్దేశం; పదంలోని ‘శోధనలు’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: τῶν συμβάντων μοι
  choice: నాకు సంభవించిన
  rationale: పౌలుకు ఎదురైన పరీక్షలను నిర్దేశించే కృదంత పదబంధాన్ని సంక్షిప్తమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν ταῖς ἐπιβουλαῖς
  choice: కుట్రలవల్ల
  rationale: ἐν ఇక్కడ పరిస్థితి లేదా కారణ-సాధన భావాన్ని కలిగి ఉంది; కుట్రల కారణంగా పరీక్షలు కలిగాయని ‘వల్ల’ సహజంగా తెలియజేస్తుంది.
- source_word: τῶν Ἰουδαίων
  choice: యూదుల
  rationale: గ్రీకు బహువచనాన్ని నేరుగా నిలుపుతుంది; ఇది యూదులందరి గురించి కాదని సందర్భపరమైన పరిమితిని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: ‘యూదులు’ అనే పదబంధాన్ని యూదులందరిపై చేసిన ఆరోపణగా తప్పుగా అర్థం చేసుకునే అవకాశం
  choice: మూలంలోని τῶν Ἰουδαίων ప్రకారం ప్రధాన పాఠ్యంలో ‘యూదుల’ అని ఉంచి, సందర్భంలో పౌలుకు విరోధంగా కుట్ర చేసిన నిర్దిష్ట వ్యక్తులనే సూచిస్తుందని పాదసూచికలో స్పష్టం చేయడం
  alternative: యూదు నాయకుల / యూదయుల
  rationale: మూలపాఠం నాయకులకు మాత్రమే పరిమితం చేయదు; ‘యూదయులు’ అనే భౌగోళిక అర్థమూ ఈ సందర్భంలో తక్కువ సంభావ్యం. కాబట్టి మూల పదాన్ని నిలుపుతూ అనుచితమైన సామూహిక సాధారణీకరణను పాదసూచికతో నివారించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. గ్రీకు వాక్యం ముందటి సందర్భంతో వ్యాకరణపరంగా కొనసాగుతున్నందున ‘సేవ చేస్తూ వచ్చాను’ అని ఇచ్చాం. వినయం, కన్నీళ్లు, పరీక్షలు అనే మూడు సహచర పరిస్థితులను స్పష్టమైన సమాంతర నిర్మాణంలో ఉంచాం; అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
