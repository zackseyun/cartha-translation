  text: Ἀπὸ δὲ τῆς Μιλήτου πέμψας εἰς Ἔφεσον μετεκαλέσατο τοὺς πρεσβυτέρους τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/017.yaml
  text: From Miletus he sent to Ephesus and called for the elders of the church[a].
translation:
  language: te
  text: మిలేతు నుండి అతడు ఎఫెసుకు పంపి, సంఘ పెద్దలను పిలిపించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎఫెసుకు పంపి సంఘ పెద్దలను రమ్మని పిలిచాడు.” గ్రీకులో ‘ఎఫెసుకు పంపి’ మరియు ‘పిలిపించాడు’ అనే భావాలు కలిసి ఉన్నాయి; వారి రాకను కోరుతూ అతడు సందేశాన్ని లేదా దూతలను పంపాడని సందర్భం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς Μιλήτου
  choice: మిలేతు నుండి
  rationale: ἀπό + షష్ఠీ విభక్తి బయలుదేరిన స్థలాన్ని సూచిస్తుంది. δέ స్వల్ప అనుసంధాన పదం; తెలుగు వాక్యప్రవాహంలో దాన్ని ప్రత్యేక పదంతో చూపడం అవసరం లేదు.
- source_word: πέμψας εἰς Ἔφεσον
  choice: ఎఫెసుకు వర్తమానం పంపించి
  rationale: అక్షరార్థంగా ‘ఎఫెసుకు పంపి’ అని ఉన్నా, సందర్భంలో పౌలు స్వయంగా వెళ్లడం కాదు; పిలుపును తెలియజేయడానికి వర్తమానం లేదా దూతలను పంపడం భావం. ‘వర్తమానం’ అనేది మూలంలో అంతర్లీనంగా ఉన్న సమాచారాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: μετεκαλέσατο
  choice: తన దగ్గరికి పిలిపించాడు
  rationale: మధ్యమ ప్రయోగంలోని క్రియ వారిని తన వద్దకు రప్పించుకోవడానికి పిలిచాడనే భావాన్ని ఇస్తుంది. ‘పిలిపించాడు’ దూతల ద్వారా పిలిచిన సందర్భానికి సహజంగా సరిపోతుంది; ‘తన దగ్గరికి’ క్రియలోని దిశాత్మక భావాన్ని నిలుపుతుంది.
- source_word: τοὺς πρεσβυτέρους
  choice: పెద్దలను
  rationale: ఇక్కడ πρεσβύτεροι కేవలం వృద్ధ పురుషులు కాక, సంఘంలో గుర్తింపు పొందిన నాయకులు. ‘సంఘ పెద్దలు’ అనే తెలుగు ప్రయోగం తరువాతి కాలపు ప్రత్యేక సంఘపాలనా వ్యవస్థను రుద్దకుండా ఆ భావాన్ని అందిస్తుంది.
- source_word: τῆς ἐκκλησίας
  choice: సంఘ
  rationale: లూకా–అపొస్తలుల కార్యముల సందర్భంలో ἐκκλησία క్రైస్తవ సమాజాన్ని సూచిస్తుంది. ‘సంఘం’ ఆధునిక తెలుగు బైబిలు వాడుకలో సహజమైనది, మతశాఖాపరంగా తటస్థమైనది.
theological_decisions:
- issue: సంఘ సందర్భంలో πρεσβυτέρους అర్థం
  choice: గుర్తింపు పొందిన సంఘ నాయకులను ‘సంఘ పెద్దలు’గా సూచించడం
  alternative: సంఘంలోని వృద్ధులు; ప్రెస్బిటర్లు
  rationale: కథన సందర్భం ఎఫెసులోని గుర్తింపు పొందిన నాయకులతో పౌలు మాట్లాడడాన్ని సూచిస్తుంది. ‘పెద్దలు’ మూలపద భావాన్ని కాపాడుతూ, తరువాతి మతశాఖల ప్రత్యేక పాలనా నిర్మాణాన్ని పాఠ్యంలోకి తీసుకురాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘సంఘ పెద్దలు’ స్థిరమైన క్రైస్తవ పదప్రయోగమే అయినా ఏ మతశాఖకు ప్రత్యేకమైన హోదాను సూచించదు. ప్రధాన పాఠ్యంలో [a] గుర్తు సంబంధిత వాక్యాంతంలో ఉంచబడింది.
