translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని కృదంత క్రమాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో నిలిపాం.
