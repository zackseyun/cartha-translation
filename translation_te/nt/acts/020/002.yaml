  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διελθὼν δὲ τὰ μέρη ἐκεῖνα καὶ παρακαλέσας αὐτοὺς λόγῳ πολλῷ ἦλθεν εἰς τὴν Ἑλλάδα
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/002.yaml
  text: After passing through those regions and encouraging them with many words[a], he came into Greece.
translation:
  language: te
  text: అతడు ఆ ప్రాంతాల గుండా వెళ్లి, అనేక మాటలతో[a] వారిని ప్రోత్సహించిన తర్వాత గ్రీసుకు వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విస్తారంగా మాట్లాడుతూ’; లేదా, ‘ఎంతో ప్రబోధిస్తూ.’ గ్రీకులో అక్షరార్థంగా ‘అనేక మాటలతో’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθὼν
  choice: గుండా వెళ్లి
  rationale: ఆరిస్ట్ కృదంతం ప్రధాన క్రియకు ముందుగా జరిగిన ప్రయాణాన్ని సూచిస్తుంది. ‘గుండా వెళ్లి’ అనే రూపం ఆ క్రమాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τὰ μέρη ἐκεῖνα
  choice: ఆ ప్రాంతాలు
  rationale: μέρη ఇక్కడ భౌగోళిక ‘భాగాలు/ప్రాంతాలు’ అనే అర్థంలో ఉంది; ఆధునిక తెలుగులో ‘ప్రాంతాలు’ సహజంగా ఉంటుంది.
- source_word: παρακαλέσας
  choice: ప్రోత్సహించిన
  rationale: παρακαλέω ప్రోత్సహించడం, బలపరచడం, బోధించి పురికొల్పడం వంటి విస్తృత భావాలను కలిగి ఉంటుంది. సందర్భంలో విశ్వాసులను బలపరచడం ప్రధానంగా కనిపిస్తున్నందున ‘ప్రోత్సహించిన’ అని అనువదించాం.
- source_word: αὐτοὺς
  choice: అక్కడివారిని
  rationale: సర్వనామం ముందుగా పేర్కొన్న ప్రాంతాల్లోని విశ్వాసులను సూచిస్తుంది. తెలుగులో సూచన స్పష్టంగా, సహజంగా ఉండేందుకు ‘అక్కడివారిని’ ఉపయోగించాం; కొత్త గుర్తింపును చేర్చలేదు.
- source_word: λόγῳ πολλῷ
  choice: అనేక మాటలతో
  rationale: గ్రీకు పదబంధం అక్షరార్థంగా ‘చాలా మాటతో/అనేక మాటలతో’ అని ఉంటుంది. మూల రూపాన్ని నిలుపుతూ, దీర్ఘంగా మాట్లాడటం లేదా విస్తారంగా ప్రోత్సహించడం అనే సాధ్యమైన భావాలను పాదటిప్పణిలో ఇచ్చాం.
- source_word: ἦλθεν εἰς τὴν Ἑλλάδα
  choice: గ్రీసుకు వచ్చాడు
  rationale: εἰς గమ్యస్థాన దిశను సూచిస్తుంది. ‘గ్రీసుకు వచ్చాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి ప్రయాణ గమ్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించకుండా వాక్య క్రమంలో ప్రతిఫలింపజేశాం
  rationale: δέ స్వల్ప సంధాన సూచకం. తెలుగులో కృదంత నిర్మాణంతో కథన ప్రవాహం సహజంగా వ్యక్తమవుతుంది; ‘అయితే’ వంటి పదం అనవసరమైన వ్యతిరేక భావాన్ని కలిగించవచ్చు.
