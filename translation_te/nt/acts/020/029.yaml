id: ACT.20.29
reference: Acts 20:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ ⸀οἶδα ὅτι εἰσελεύσονται μετὰ τὴν ἄφιξίν μου λύκοι βαρεῖς εἰς ὑμᾶς μὴ φειδόμενοι τοῦ ποιμνίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/029.yaml
  text: I know that after my departure fierce wolves will come in among you[b][a], not sparing the flock.
translation:
  language: te
  text: నేను వెళ్లిపోయిన తర్వాత[b] క్రూరమైన తోడేళ్లు[a] మీ మధ్యకు చొరబడతాయని నాకు తెలుసు; అవి మందను కనికరించవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తీవ్రమైన తోడేళ్లు.” గ్రీకు విశేషణం కఠినమైన, అణచివేసే లేదా హింసాత్మకమైన తీవ్రతను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “నా రాక/వచ్చిన తర్వాత”; సందర్భంలో ఉద్దేశం “నేను వెళ్లిపోయిన తర్వాత.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: నాకు తెలుసు
  rationale: పౌలు కేవలం అభిప్రాయం కాకుండా నిశ్చయమైన జ్ఞానాన్ని వ్యక్తం చేస్తున్నాడు; ఆధునిక తెలుగులో ఇది సహజమైన, నేరుగా ఉన్న సమానం.
- source_word: εἰσελεύσονται
  choice: మీ మధ్యకు వస్తాయి
  rationale: సమాజంలోకి ప్రవేశించడాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; తోడేళ్లు మందలోకి చొరబడే రూపకాన్ని నిలుపుతుంది.
- source_word: μετὰ τὴν ἄφιξίν μου
  choice: నేను వెళ్లిపోయిన తర్వాత
  rationale: ἄφιξις సాధారణంగా రాకను సూచించగలిగినా, ఈ సందర్భంలో పౌలు ఇక వారితో లేని తరువాతి పరిస్థితి ఉద్దేశించబడింది. పాదసూచిక మూలపదంలోని అసాధారణతను తెలియజేస్తుంది.
- source_word: λύκοι βαρεῖς
  choice: క్రూరమైన తోడేళ్లు
  rationale: βαρεῖς ఇక్కడ అక్షరార్థమైన ‘బరువైన’ అనే భావంలో కాకుండా కఠినమైన, హింసాత్మకమైన తీవ్రతను సూచిస్తుంది. ‘క్రూరమైన’ ప్రమాదకరమైన స్వభావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς ὑμᾶς
  choice: మీ మధ్యకు
  rationale: తోడేళ్లు సంఘంలోకి చొరబడే దిశాభావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μὴ φειδόμενοι
  choice: విడిచిపెట్టవు
  rationale: మందను హాని చేయకుండా వదలవు అనే నిర్దయ భావాన్ని తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: τοῦ ποιμνίου
  choice: మందను
  rationale: సంఘాన్ని సూచించే కాపరి రూపకాన్ని అలాగే ఉంచి, తోడేళ్ల బింబంతో సహజంగా సరిపోతుంది.
theological_decisions:
- issue: ‘తోడేళ్లు’ అనే రూపకం
  choice: ‘క్రూరమైన తోడేళ్లు’ అనే రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: అబద్ధ బోధకులు / హానికరమైన మనుషులు
  rationale: ఈ వచనం వారు ఎవరో స్పష్టంగా నిర్వచించదు. రూపకాన్ని నిలపడం వాక్యంలోని వాక్చాతుర్య బలాన్ని కాపాడి, అర్థాన్ని అనవసరంగా కుదించకుండా ఉంటుంది.
- issue: ἄφιξις యొక్క సందర్భానుసార భావం
  choice: ‘నేను వెళ్లిపోయిన తర్వాత’
  alternative: ‘నేను వచ్చిన తర్వాత’
  rationale: పదం సాధారణంగా ‘రాక/చేరిక’ అని అర్థమివ్వగలిగినా, ప్రసంగ సందర్భం పౌలు వెళ్లిపోయిన తరువాత కలిగే ప్రమాదాన్ని సూచిస్తుంది. అసలు పదరూపంలోని ఉద్వేగాన్ని పాదసూచికలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘తోడేళ్లు,’ ‘మంద’ అనే మూల రూపకాలను నిలిపి, సందర్భానుసారంగా ‘వెళ్లిపోయిన తర్వాత’ అని ప్రధాన పాఠ్యంలో ఇచ్చాం. పాదసూచిక గుర్తులు రెండూ ప్రధాన పాఠ్యంలో ఉన్నాయి.
