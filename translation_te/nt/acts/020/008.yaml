  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘పైగది’ కంటే సాధారణ పాఠకులకు సహజంగా వినిపించే ‘మేడగది’ ఎంచుకోబడింది; మూలంలోని పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా తెలుగు సంబంధ నిర్మాణం వాడబడింది.
