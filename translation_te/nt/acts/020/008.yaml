translation:
  language: te
  text: మేము సమావేశమై ఉన్న మేడగదిలో చాలా దీపాలు[a] ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కాగడాలు.’ గ్రీకు పదం సాధారణంగా తీసుకెళ్లగల వెలుగులను కూడా సూచించవచ్చు; అయితే ఇంటి లోపల ఉన్న ఈ సందర్భంలో ‘దీపాలు’ అనే అర్థమే ఎక్కువ సంభావ్యం.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ ఇక్కడ స్వల్ప అనుసంధాన అవ్యయం. తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా ‘అయితే’ లేదా ‘ఇప్పుడు’ చేరిస్తే మూలంలో లేని బలమైన వ్యత్యాసం లేదా కాలసూచన కలగవచ్చు.
- source_word: λαμπάδες
  choice: దీపాలు
  rationale: λαμπάς దీపం లేదా కాగడాను సూచించగలదు. ఇంటి మేడగది సందర్భంలో ‘దీపాలు’ సహజమైన, ఎక్కువ సంభావ్యమైన అర్థం.
- source_word: ἱκαναὶ
  choice: చాలా
  rationale: ఇక్కడ ἱκανός దీపాల సంఖ్య గణనీయంగా ఉందని సూచిస్తుంది; ఆధునిక తెలుగులో ‘చాలా’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ὑπερῴῳ
  choice: మేడగదిలో
  rationale: ὑπερῷον ఇంటి పై అంతస్తులోని గదిని సూచిస్తుంది. ‘మేడగది’ సంక్షిప్తంగా, సహజంగా స్థలాన్ని తెలియజేస్తుంది.
- source_word: οὗ
  choice: -లో
  rationale: స్థలాన్ని సూచించే సంబంధ అవ్యయ భావాన్ని తెలుగులో ‘మేము సమావేశమై ఉన్న మేడగదిలో’ అనే సంబంధ నిర్మాణం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: συνηγμένοι
  choice: సమావేశమై ఉన్న
  rationale: పరిపూర్ణ కర్మణి కృదంతం వారు కూడి, ఆ స్థితిలో ఉన్నారని తెలియజేస్తుంది; ‘సమావేశమై ఉన్న’ ఆ కొనసాగుతున్న సమూహస్థితిని కాపాడుతుంది.
- source_word: ἦσαν ... ἦμεν
  choice: ఉన్నాయి ... ఉన్న
  rationale: రెండు అపూర్ణ భూతకాల రూపాల వర్ణనాత్మక భావాన్ని తెలుగు సందర్భంలో సహజమైన ‘ఉన్నాయి’ మరియు సంబంధ కృదంతమైన ‘ఉన్న’ ద్వారా వ్యక్తం చేశాం.
