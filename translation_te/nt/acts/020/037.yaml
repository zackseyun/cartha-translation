translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని సామూహిక రోదన, మెడను చుట్టిన ఆలింగనం, పునరావృత ముద్దులు అన్నీ నిలుపబడ్డాయి.
