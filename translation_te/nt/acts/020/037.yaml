  yaml_path: translation/nt/acts/020/037.yaml
  text: They all wept a great deal, threw their arms around Paul’s neck, and kept kissing him.
translation:
  language: te
  text: వారందరూ ఎంతో ఏడ్చి, పౌలు మెడ చుట్టూ చేతులు వేసి, అతనిని పదేపదే ముద్దుపెట్టుకున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱκανὸς κλαυθμὸς ἐγένετο πάντων
  choice: వారందరూ ఎంతో ఏడ్చి
  rationale: అక్కడున్న వారందరి గొప్ప దుఃఖరోదనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ἱκανός సూచించే తీవ్రతను ‘ఎంతో’ నిలుపుతుంది.
- source_word: ἐπιπεσόντες ἐπὶ τὸν τράχηλον τοῦ Παύλου
  choice: పౌలు మెడను కౌగిలించుకొని
  rationale: మూలంలోని మెడ ప్రస్తావనను నిలుపుతూ, ఆ గ్రీకు నుడికారంలో ఉద్దేశించిన ఆప్యాయ ఆలింగనాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κατεφίλουν αὐτόν
  choice: అతనిని పదేపదే ముద్దుపెట్టుకున్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగిన లేదా పునరావృతమైన ముద్దులను ‘పదేపదే’ స్పష్టంగా తెలియజేస్తుంది.
