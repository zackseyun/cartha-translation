translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఈ చేతులే’ అనే రూపం పౌలు చేసిన శారీరక శ్రమను సూచించే మూలంలోని ఉద్ఘాటిత రూపకాన్ని నిలుపుతుంది.
