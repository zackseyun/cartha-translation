  yaml_path: translation/nt/acts/020/034.yaml
  text: You yourselves know that these hands served my needs and the needs of those who were with me[a].
translation:
  language: te
  text: ఈ చేతులే నా అవసరాలనూ, నాతో ఉన్నవారి అవసరాలనూ తీర్చాయని మీకే తెలుసు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ చేతులే నా అవసరాలకూ, నాతో ఉన్నవారి అవసరాలకూ సేవ చేశాయి.” గ్రీకు క్రియ ఆచరణాత్మక సేవ ద్వారా భౌతిక సహాయం అందించడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: మీకే
  rationale: కర్త సర్వనామంలోని ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: γινώσκετε
  choice: తెలుసు
  rationale: శ్రోతలకు పౌలు ప్రవర్తన ప్రత్యక్షంగా తెలిసినదనే వర్తమాన భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ταῖς χρείαις μου
  choice: నా అవసరాలకు
  rationale: χρεία ఇక్కడ జీవనానికి సంబంధించిన ఆచరణాత్మక అవసరాలను సూచిస్తుంది.
- source_word: τοῖς οὖσι μετ’ ἐμοῦ
  choice: నాతో ఉన్నవారి అవసరాలకు
  rationale: మూలంలోని ‘నాతో ఉన్నవారు’ అనే అనిర్దిష్ట సంబంధాన్ని కాపాడుతూ, సమాంతర దత్తివాచక భావాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: ὑπηρέτησαν
  choice: సేవ చేశాయి
  rationale: క్రియలోని సేవ లేదా సహాయం భావాన్ని నేరుగా నిలుపుతుంది; చేతులు కర్తగా ఉండే మూలంలోని సజీవ రూపకాన్ని కూడా కాపాడుతుంది.
- source_word: αἱ χεῖρες αὗται
  choice: ఈ చేతులే
  rationale: ‘ఈ చేతులు’ అనే సూచనతో పాటు నిర్మాణంలోని ఉద్ఘాటనను ‘ఏ’ ద్వారా వ్యక్తపరుస్తుంది; ‘నా సొంత చేతులు’ అని మూలంలో లేని స్వామ్యాన్ని చేర్చదు.
