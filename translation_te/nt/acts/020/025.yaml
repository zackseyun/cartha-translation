id: ACT.20.25
reference: Acts 20:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ νῦν ἰδοὺ ἐγὼ οἶδα ὅτι οὐκέτι ὄψεσθε τὸ πρόσωπόν μου ὑμεῖς πάντες ἐν οἷς διῆλθον κηρύσσων τὴν ⸀βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/025.yaml
  text: And now, look, I know that none of you among whom I went about proclaiming the kingdom will see my face again.
translation:
  language: te
  text: ఇప్పుడు, ఇదిగో, మీ అందరి మధ్య నేను తిరుగుతూ రాజ్యాన్ని ప్రకటించాను; మీలో ఒక్కరూ ఇకపై నా ముఖాన్ని చూడరని నాకు తెలుసు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: చూడండి
  rationale: శ్రోతల దృష్టిని తరువాతి గంభీర ప్రకటనపై నిలిపే సహజమైన ఆధునిక తెలుగు సంబోధన.
- source_word: διῆλθον
  choice: మీ మధ్య తిరుగుతూ
  rationale: పౌలు వారి మధ్య వివిధ ప్రాంతాల్లో సంచరించిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: κηρύσσων
  choice: ప్రకటించాను
  rationale: బహిరంగంగా సందేశాన్ని ప్రకటించడాన్ని సూచించే సాధారణమైన, గౌరవప్రదమైన పదం.
- source_word: τὴν βασιλείαν
  choice: దేవుని రాజ్యాన్ని
  rationale: గ్రీకు పాఠంలో కేవలం ‘రాజ్యం’ ఉన్నప్పటికీ, అపొస్తలుల కార్యముల సందర్భంలో ఉద్దేశించిన దేవుని రాజ్యాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐκέτι ὄψεσθε τὸ πρόσωπόν μου
  choice: ఇక నా ముఖం చూడరు
  rationale: మళ్లీ ప్రత్యక్షంగా కలుసుకోరనే సెమిటిక్ శైలిని దాని రూపక తీవ్రతతోనే నిలుపుతుంది.
theological_decisions:
- issue: ‘రాజ్యం’ ఎవరిది అనే అంతర్భావం
  choice: దేవుని రాజ్యం
  alternative: రాజ్యం
  rationale: మూలపాఠం ‘రాజ్యం’ అని మాత్రమే చెప్పినా, ఇక్కడ అది దేవుని రాజ్యాన్ని సూచిస్తుందని విస్తృత సందర్భం స్పష్టం చేస్తుంది; ఈ చేర్పు ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్ని ప్రవేశపెట్టదు.
- issue: పౌలు ప్రకటన యొక్క నిశ్చయ స్వరం
  choice: నాకు తెలుసు
  alternative: నేను నమ్ముతున్నాను
  rationale: οἶδα జ్ఞానం లేదా నిశ్చయాన్ని ప్రత్యక్షంగా వ్యక్తం చేస్తుంది; దానిని బలహీనపరచకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైన వీడ్కోలు ప్రసంగానికి తగిన సహజమైన శైలి. ‘ఇప్పుడు చూడండి’ శ్రోతల దృష్టిని ఆకర్షించే ἰδοὺను అతిగా పురాతన శైలిలో కాకుండా అందిస్తుంది.
