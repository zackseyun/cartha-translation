id: ACT.20.13
reference: Acts 20:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ ⸀προελθόντες ⸀ἐπὶ τὸ πλοῖον ἀνήχθημεν ἐπὶ τὴν Ἆσσον, ἐκεῖθεν μέλλοντες ἀναλαμβάνειν τὸν Παῦλον, οὕτως γὰρ ⸂διατεταγμένος ἦν⸃ μέλλων αὐτὸς πεζεύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/013.yaml
  text: But we[a], having gone ahead to the ship, set sail for Assos, intending to take Paul on board from there, for so he had arranged[b], since he himself intended to go by land.
translation:
  language: te
  text: అయితే మేము ముందుగా ఓడ ఎక్కి అస్సోసుకు బయలుదేరాము. అక్కడ పౌలును ఓడలో ఎక్కించుకోవాలని అనుకున్నాము. ఆయన తానే కాలినడకన వెళ్లాలని ఉద్దేశించాడు కాబట్టి, అలాగే ఏర్పాటు చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే ఆయన తానే కాలినడకన వెళ్లాలని ఉద్దేశించినందున, ఆ విధంగా ఏర్పాటు చేయబడి ఉంది.” గ్రీకులోని క్రియారూపం వ్యాకరణపరంగా కర్మణి రూపంలో ఉంది; సందర్భంలో అది పౌలు ముందుగా చేసిన ఏర్పాటు లేదా ఆయన ఇచ్చిన సూచనను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: προελθόντες
  choice: ముందుగా ... వెళ్లి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచించే భూతకాల కృదంత భావాన్ని, పౌలు కంటే బృందం ముందుగా వెళ్లిందనే అర్థంతో సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ τὸ πλοῖον
  choice: ఓడ దగ్గరకు
  rationale: గమనాన్ని సూచించే ἐπί ఇక్కడ ఓడ వద్దకు/ఓడపైకి వెళ్లడాన్ని సూచిస్తుంది; తరువాతి ‘బయలుదేరాము’ వల్ల ఓడ ఎక్కిన సంగతి స్పష్టమవుతుంది.
- source_word: ἀνήχθημεν
  choice: బయలుదేరాము
  rationale: సముద్రయాన సందర్భంలో ఈ క్రియ ‘ఓడలో ప్రయాణానికి బయలుదేరు’ అనే అర్థమిస్తుంది; తెలుగు వాక్యంలో ‘ఓడ’ ముందే ఉండడం వల్ల ఈ రూపం సహజంగా ఉంది.
- source_word: ἐπὶ τὴν Ἆσσον
  choice: అస్సోసుకు
  rationale: ఓడ ప్రయాణపు గమ్యస్థానాన్ని స్పష్టంగా సూచిస్తుంది; Ἆσσος పేరుకు సమీప లిప్యంతరీకరణ.
- source_word: μέλλοντες ἀναλαμβάνειν
  choice: ఓడలో ఎక్కించుకోవాలని అనుకున్నాము
  rationale: μέλλω ఉద్దేశాన్ని, ἀναλαμβάνω ఈ సముద్రయాన సందర్భంలో ఒకరిని ఓడలోకి తీసుకోవడాన్ని సూచిస్తాయి.
- source_word: ἐκεῖθεν
  choice: అక్కడి నుంచి
  rationale: అస్సోసు నుంచే పౌలును ఓడలోకి తీసుకోవాలనే అపాదాన భావాన్ని నిలుపుతుంది.
- source_word: διατεταγμένος ἦν
  choice: ఆ విధంగా ఏర్పాటుచేసి ఉన్నాడు
  rationale: గ్రీకు పరివ్యాప్త భూతపూర్వ రూపంలోని ముందస్తు ఏర్పాటును వ్యక్తిగత కర్త అయిన పౌలుతో సహజంగా తెలుపుతుంది; అయితే రూపం వ్యాకరణపరంగా కర్మణి కావడం వల్ల ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: μέλλων αὐτὸς πεζεύειν
  choice: ఆయన తాను కాలినడకన వెళ్లాలని ఉద్దేశించినందున
  rationale: πεζεύειν సముద్రయానానికి విరుద్ధంగా భూమిమీద, ప్రత్యేకంగా కాలినడకన ప్రయాణించడాన్ని సూచిస్తుంది; αὐτός ఇచ్చే ఉద్ఘాటనను ‘తాను’ నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: కథనంలో పౌలు వెళ్లే విధానానికీ ‘మేము’ వెళ్లే విధానానికీ ఉన్న స్వల్ప వ్యత్యాసాన్ని సహజంగా చూపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. సముద్రయానం–కాలినడక ప్రయాణం మధ్య వ్యత్యాసం స్పష్టంగా ఉంచబడింది; గ్రీకు కర్మణి రూపంలోని అస్పష్టత పాదసూచికలో సంరక్షించబడింది.
