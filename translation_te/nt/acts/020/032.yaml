  to: ఇప్పుడు నేను మిమ్మల్ని దేవునికీ, ఆయన కృపా వాక్యానికీ అప్పగిస్తున్నాను. అది[a] మిమ్మల్ని బలపరచడానికీ, పరిశుద్ధపరచబడిన వారందరితో కలిసి వారసత్వాన్ని ఇవ్వడానికీ శక్తిగలది.
