id: ACT.20.32
reference: Acts 20:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν παρατίθεμαι ⸀ὑμᾶς τῷ ⸀θεῷ καὶ τῷ λόγῳ τῆς χάριτος αὐτοῦ, τῷ δυναμένῳ ⸀οἰκοδομῆσαι καὶ δοῦναι ⸀τὴν κληρονομίαν ἐν τοῖς ἡγιασμένοις πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/032.yaml
  text: And now I entrust you to God and to the word of his grace[a], which is able to build up and to give the inheritance among all those who have been sanctified.
translation:
  language: te
  text: ఇప్పుడు నేను మిమ్మల్ని దేవునికీ, ఆయన కృపా వాక్యానికీ అప్పగిస్తున్నాను. అది[a] మిమ్మల్ని బలపరచడానికీ, పరిశుద్ధపరచబడిన వారందరితో కలిసి వారసత్వాన్ని ఇవ్వడానికీ శక్తిగలది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ఇది దేవునిని సూచిస్తున్నట్లు: “ఆయనే మిమ్మల్ని బలపరచడానికీ, పరిశుద్ధపరచబడిన వారందరితో కలిసి వారసత్వాన్ని ఇవ్వడానికీ శక్తిగలవాడు.”'
    reason: ‘శక్తిగల’ అనే గ్రీకు కృదంతం సమీపంలోని ‘ఆయన కృపా వాక్యం’ను గానీ, ప్రధానంగా దేవునిని గానీ సూచించవచ్చు.
lexical_decisions:
- source_word: παρατίθεμαι
  choice: అప్పగిస్తున్నాను
  rationale: మధ్యమ వాచకంలోని ఈ క్రియ, వినేవారిని మరొకరి సంరక్షణకు నమ్మకంగా అప్పగించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘అప్పగిస్తున్నాను’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: τῷ θεῷ
  choice: దేవునికి
  rationale: παρατίθεμαι తరువాత వచ్చే చతుర్థీ విభక్తి, పౌలు వారిని ఎవరికి అప్పగిస్తున్నాడో తెలుపుతుంది.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: ఆయన కృపావాక్యానికి
  rationale: λόγος యొక్క ‘వాక్యం/ప్రకటిత సందేశం’ భావాన్నీ, గ్రీకు షష్ఠీ విభక్తి నిర్మాణాన్నీ సంక్షిప్తంగా నిలుపుతుంది. ‘కృపాసందేశం’ సాధ్యమైనా, ‘కృపావాక్యం’ మూలపాఠ నిర్మాణానికి మరింత పారదర్శకంగా ఉంటుంది.
- source_word: τῷ δυναμένῳ
  choice: అది … చేయగలదు
  rationale: ప్రధాన పాఠంలో సమీప పూర్వపదమైన ‘కృపావాక్యం’ను సూచించేలా నపుంసక ఏకవచన సర్వనామం వాడబడింది. అయితే ఈ కృదంతం దేవునిని సూచించే అవకాశాన్ని పాదటిప్పణి నిలుపుతుంది.
- source_word: οἰκοδομῆσαι
  choice: మిమ్మల్ని అభివృద్ధి చేయగలదు
  rationale: అక్షరార్థంగా ‘కట్టడం’ అయిన ఈ క్రియ ఇక్కడ వ్యక్తుల విశ్వాసజీవితాన్ని బలపరచి ఎదిగించడాన్ని రూపకాలంకారంగా సూచిస్తుంది. సందర్భం నుంచి గ్రహించబడే కర్మను తెలుగులో స్పష్టత కోసం ‘మిమ్మల్ని’గా వ్యక్తం చేశాం.
- source_word: δοῦναι τὴν κληρονομίαν
  choice: వారసత్వాన్ని ఇవ్వగలదు
  rationale: ‘ఇవ్వడం’ మరియు ‘వారసత్వం’ అనే మూలపాఠంలోని నేరమైన భావాలను నిలుపుతుంది; గ్రహీతను అవసరానికి మించి పాఠంలో చేర్చలేదు.
- source_word: ἐν τοῖς ἡγιασμένοις πᾶσιν
  choice: పరిశుద్ధపరచబడిన వారందరి మధ్య
  rationale: పరిపూర్ణ కర్మణి కృదంతంలోని, గతంలో జరిగిన కార్యం ఫలితం కొనసాగుతున్న భావాన్ని ‘పరిశుద్ధపరచబడిన’ నిలుపుతుంది. ἐν ఇక్కడ సమూహం లేదా సహవాస పరిధిని సూచిస్తున్నందున ‘మధ్య’ అని అనువదించాం.
theological_decisions:
- issue: τῷ δυναμένῳ (‘చేయగలవాడు/చేయగలది’) దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో ఇది ‘ఆయన కృపావాక్యం’ను సూచించేలా ‘అది … చేయగలదు’ అని అనువదించబడింది.
  alternative: ఈ మాట దేవునిని ప్రధానంగా సూచిస్తే, ‘ఆయనే మిమ్మల్ని అభివృద్ధి చేసి … వారసత్వాన్ని ఇవ్వగలవాడు’ అని అనువదించవచ్చు.
  rationale: గ్రీకు వ్యాకరణం రెండు అవగాహనలకూ అవకాశం ఇస్తుంది. సమీప పూర్వపదం ‘కృపావాక్యం’ కాబట్టి ప్రధాన పాఠం దానిని అనుసరిస్తుంది; వారసత్వాన్ని అనుగ్రహించే వ్యక్తిగత కర్త దేవుడే అనే సందర్భబద్ధమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. పొడవైన గ్రీకు వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి స్పష్టత పెంచాం; మూలంలోని నిజమైన సూచనాసందిగ్ధతను పాదటిప్పణితో నిలిపాం.
