  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘పిలిపించి,’ ‘ప్రోత్సహించి,’ ‘బయలుదేరాడు’ వంటి సహజ ప్రయోగాలతో గ్రీకు కృదంతాల క్రమం నిలుపబడింది.
