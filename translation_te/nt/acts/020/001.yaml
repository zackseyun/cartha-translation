id: ACT.20.1
reference: Acts 20:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον ⸀μεταπεμψάμενος ὁ Παῦλος τοὺς μαθητὰς καὶ ⸀παρακαλέσας, ἀσπασάμενος ἐξῆλθεν ⸀πορεύεσθαι ⸀εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/001.yaml
  text: After the uproar had ceased[a], Paul sent for the disciples, and after encouraging them and saying farewell, he departed to go to Macedonia.
translation:
  language: te
  text: కల్లోలం సద్దుమణిగిన తర్వాత, పౌలు శిష్యులను తన దగ్గరికి పిలిపించి, వారిని ప్రోత్సహించి, వారికి వీడ్కోలు చెప్పి[a], మాసిదోనియాకు వెళ్లడానికి బయలుదేరాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారిని పలకరించి.’ గ్రీకు పదం పలకరించడాన్ని సూచించవచ్చు; బయలుదేరే సందర్భంలో వీడ్కోలు చెప్పడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον
  choice: అల్లరి సద్దుమణిగిన తర్వాత
  rationale: μετάతో కూడిన ఆర్టిక్యులర్ ఇన్ఫినిటివ్ ముందటి కల్లోలం ముగిసిన తర్వాత జరిగినదాన్ని సూచిస్తుంది. θόρυβος సందర్భంలో ప్రజా అల్లరి లేదా కల్లోలాన్ని సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో ‘అల్లరి సద్దుమణిగిన తర్వాత’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: μεταπεμψάμενος
  choice: తన దగ్గరికి పిలిపించి
  rationale: ఈ మధ్యమవాచక కృదంతం ఇతరులను తన వద్దకు రప్పించడానికి కబురు పంపడాన్ని సూచిస్తుంది. ‘పిలిపించి’ మూలంలోని causative భావాన్ని సహజంగా నిలుపుతుంది; ‘తన దగ్గరికి’ దిశను స్పష్టం చేస్తుంది.
- source_word: τοὺς μαθητὰς
  choice: శిష్యులను
  rationale: అపొస్తలుల కార్యాలలో μαθηταί యేసు అనుచరులకు వాడే సాధారణ పదం. ‘శిష్యులు’ లూకా ఉపయోగించిన నిర్దిష్ట సంజ్ఞను నిలుపుతుంది.
- source_word: παρακαλέσας
  choice: వారిని ప్రోత్సహించి
  rationale: παρακαλέω ప్రోత్సహించడం, ధైర్యపరచడం లేదా హితవు చెప్పడం అనే పరిధిని కలిగి ఉంది. కల్లోలం అనంతర వీడ్కోలు సందర్భంలో ‘ప్రోత్సహించి’ అర్థాన్ని అనవసరంగా కుదించకుండా సహాయక బలపరిచే భావాన్ని ఇస్తుంది.
- source_word: ἀσπασάμενος
  choice: వారి దగ్గర సెలవు తీసుకొని
  rationale: ἀσπάζομαι సాధారణంగా పలకరించడాన్ని సూచించినా, బయలుదేరే సందర్భంలో వీడ్కోలు తీసుకోవడం అనే భావం కలిగి ఉండవచ్చు. ఇక్కడ ప్రయాణ సందర్భానికి ‘సెలవు తీసుకొని’ సహజంగా సరిపోతుంది; నిజమైన పదార్థ ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: ἐξῆλθεν πορεύεσθαι εἰς Μακεδονίαν
  choice: మాసిదోనియకు వెళ్లడానికి బయలుదేరాడు
  rationale: ἐξῆλθεν ప్రయాణ కథనంలో బయలుదేరడాన్ని సూచిస్తుంది; πορεύεσθαι ఉద్దేశిత ప్రయాణాన్ని, εἰς Μακεδονίαν గమ్యాన్ని తెలియజేస్తాయి. ఈ తెలుగు రూపం ప్రయాణ ఉద్దేశం, గమ్యం రెండింటినీ స్పష్టంగా నిలుపుతుంది.
