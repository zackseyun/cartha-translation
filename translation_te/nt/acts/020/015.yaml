    issue: The connective force of κἀκεῖθεν is omitted.
    rationale: κἀκεῖθεν contracts καί + ἐκεῖθεν. Telugu ‘మరియు అక్కడి నుండి’ preserves both elements without unnatural emphasis.
  - severity: medium
    issue: ‘సామోసు దగ్గర ఓడను నిలిపాం’ weakens εἰς Σάμον and is less idiomatic.
    rationale: In this nautical context παρεβάλομεν εἰς Σάμον means that the vessel put in/called at Samos. ‘సామోసులో ఓడను నిలిపాము’ expresses this accurately without claiming that the travelers disembarked.
  - severity: low
    issue: Footnote b’s alternative ‘ఓడను పక్కకు చేర్చాం’ is awkward Telugu.
    rationale: ‘ఓడను అక్కడ నిలిపాము’ is a clear, idiomatic alternative that conveys the nautical stop.
