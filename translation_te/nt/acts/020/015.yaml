source:
  edition: SBLGNT
  text: κἀκεῖθεν ἀποπλεύσαντες τῇ ἐπιούσῃ κατηντήσαμεν ⸀ἄντικρυς Χίου, τῇ δὲ ἑτέρᾳ παρεβάλομεν εἰς ⸀Σάμον, τῇ ⸀δὲ ἐχομένῃ ἤλθομεν εἰς Μίλητον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/015.yaml
  text: And from there[a], after setting sail, on the next day we came opposite Chios; on the following day we touched at Samos[b]; and on the day after that we came to Miletus.
translation:
  language: te
  text: మరియు అక్కడి నుండి మేము ఓడలో బయలుదేరి, మరుసటి రోజు కీయోసుకు ఎదురుగా చేరుకున్నాం[a]. తరువాతి రోజు సామోసులో ఓడను నిలిపాము[b]. ఆ తర్వాతి రోజు మిలేతుకు చేరుకున్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కీయోసుకు అభిముఖంగా,” లేదా “కీయోసుకు ఎదురుగా సముద్రంలో.” గ్రీకు పదం వారు ఆ దీవికి ఎదురుగా ఉన్నారని సూచిస్తుంది; వారు అక్కడ దిగారని తప్పనిసరిగా చెప్పదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “సామోసులో ఓడను ఆపాము.” ఇక్కడి గ్రీకు క్రియ ఓడను తీరానికి లేదా రేవుకు చేర్చి ప్రయాణంలో అక్కడ ఆపడం అనే నౌకాయానార్థాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: అక్కడి నుండి
  rationale: καί + ἐκεῖθεν అనే సంయుక్త రూపంలోని బయలుదేరిన స్థలాన్ని సహజమైన తెలుగు ప్రయాణ కథనంలో వ్యక్తం చేస్తుంది; వాక్యానుసంధానం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: ἀποπλεύσαντες
  choice: ఓడలో బయలుదేరి
  rationale: సముద్రయానానికి బయలుదేరడాన్ని తెలిపే పూర్వకాల క్రియాభావాన్ని సహజమైన తెలుగు క్రమక్రియగా అందిస్తుంది.
- source_word: τῇ ἐπιούσῃ
  choice: మరుసటి రోజు
  rationale: తరువాత వచ్చిన రోజును సూచించే కాలార్థక దత్తివును సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κατηντήσαμεν
  choice: చేరుకున్నాం
  rationale: ప్రయాణ సందర్భంలో ఒక స్థానానికి చేరడాన్ని సూచిస్తుంది; అయితే తరువాతి స్థానవాచకం దీవికి ఎదురుగా ఉన్న స్థితిని తెలుపుతుంది.
- source_word: ἄντικρυς Χίου
  choice: కీయోసుకు ఎదురుగా
  rationale: ἄντικρυς తెలిపే ‘ఎదురుగా/అభిముఖంగా’ అనే భౌగోళిక స్థానాన్ని కాపాడుతుంది; దీవిలో దిగారని చెప్పదు.
- source_word: τῇ δὲ ἑτέρᾳ
  choice: ఆ తరువాతి రోజు
  rationale: రోజుల వరుసలో తదుపరి దశను స్పష్టంగా తెలియజేస్తుంది.
- source_word: παρεβάλομεν εἰς Σάμον
  choice: సామోసు దగ్గర ఓడను నిలిపాం
  rationale: నౌకను పక్కకు తీసుకురావడం లేదా అక్కడ ఆపడం అనే నౌకాయానార్థాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది; తప్పనిసరిగా ఒడ్డెక్కారనే భావాన్ని చేర్చదు.
- source_word: τῇ δὲ ἐχομένῃ
  choice: దాని మరుసటి రోజు
  rationale: ముందటి రోజు తరువాత వరుసగా వచ్చిన రోజును అసందిగ్ధంగా సూచిస్తుంది.
- source_word: ἤλθομεν εἰς Μίλητον
  choice: మిలేతుకు చేరుకున్నాం
  rationale: εἰςతో సూచించిన గమ్యస్థానానికి రావడం/చేరడాన్ని సహజ తెలుగు ప్రయాణ శైలిలో వ్యక్తం చేస్తుంది.
- source_word: Χίου / Σάμον / Μίλητον
  choice: కీయోసు / సామోసు / మిలేతు
  rationale: గ్రీకు స్థలనామాలను ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
