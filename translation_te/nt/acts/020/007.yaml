id: ACT.20.7
reference: Acts 20:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων συνηγμένων ⸀ἡμῶν κλάσαι ἄρτον ὁ Παῦλος διελέγετο αὐτοῖς, μέλλων ἐξιέναι τῇ ἐπαύριον, παρέτεινέν τε τὸν λόγον μέχρι μεσονυκτίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/007.yaml
  text: On the first day of the week[a], when we had gathered to break bread, Paul was speaking to them, intending to depart the next day[b], and he prolonged the message until midnight.
translation:
  language: te
  text: వారంలోని మొదటి రోజున, రొట్టె విరవడానికి[a] మేము కూడినప్పుడు, మరుసటి రోజు బయలుదేరబోతున్న పౌలు వారితో మాట్లాడుతూ తన ప్రసంగాన్ని అర్ధరాత్రి వరకు పొడిగించాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రొట్టె విరవడం’ అనే మాట కలిసి భోజనం చేయడాన్ని సూచించవచ్చు; ప్రభువు భోజనానికి సంబంధించిన భావాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మరుసటి రోజు బయలుదేరబోతున్నందున, పౌలు వారితో మాట్లాడుతూ తన ప్రసంగాన్ని అర్ధరాత్రి వరకు పొడిగించాడు.”
    reason: syntactic_alternative
lexical_decisions:
- source_word: Ἐν δὲ
  choice: వారం మొదటి రోజున
  rationale: ἐν దత్తివ విభక్తితో కాలాన్ని సూచిస్తుంది; δέ స్వల్ప అనుసంధాన పదం. తెలుగులో విడిగా అనువదించాల్సిన బలమైన వ్యతిరేక భావం లేకపోవడంతో సహజమైన కాలవాక్యంతో ప్రారంభించాం.
- source_word: τῇ μιᾷ τῶν σαββάτων
  choice: వారం మొదటి రోజున
  rationale: ఇది కొయినే గ్రీకులో వారంలోని మొదటి రోజును సూచించే స్థిరమైన నుడికారం; అక్షరార్థంగా ‘విశ్రాంతిదినాల్లో ఒక రోజున’ అనడం తప్పుదారి పట్టిస్తుంది.
- source_word: συνηγμένων ἡμῶν
  choice: మేము కూడి ఉన్నప్పుడు
  rationale: జెనిటివ్ అబ్సల్యూట్ ప్రధాన చర్య జరిగిన సందర్భాన్ని తెలియజేస్తుంది; మొదటి పురుష బహువచన కథన దృష్టికోణాన్ని నిలిపాం.
- source_word: κλάσαι ἄρτον
  choice: రొట్టె విరవడానికి
  rationale: అనంతరూపం ఉద్దేశాన్ని తెలియజేస్తుంది. ఈ నుడికారం సమిష్టి భోజనాన్నీ ప్రభువు భోజన సంబంధ భావాన్నీ కలిగి ఉండవచ్చు; ఏ ఒక్క అర్థానికీ పరిమితం చేయలేదు.
- source_word: διελέγετο αὐτοῖς
  choice: వారితో మాట్లాడుతూ
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న చర్యను సూచిస్తుంది; ‘వారితో’ అనడం διαλέγομαι లోని పరస్పర సంభాషణ ఛాయను కాపాడుతుంది.
- source_word: μέλλων ἐξιέναι τῇ ἐπαύριον
  choice: మరుసటి రోజు బయలుదేరబోతున్న
  rationale: μέλλω + అనంతరూపం సమీప భవిష్యత్తును సూచిస్తుంది. ‘బయలుదేరబోతున్న’ అనేది ప్రయాణ సందర్భానికి సహజంగా సరిపోతూ, దాన్ని కేవలం వ్యక్తిగత ఉద్దేశంగా మార్చదు.
- source_word: παρέτεινέν τε τὸν λόγον
  choice: తన సందేశాన్ని ... కొనసాగించాడు
  rationale: παρατείνω పొడిగించడం లేదా కొనసాగించడాన్ని సూచిస్తుంది; λόγος ఇక్కడ పౌలు పలికిన సందేశం లేదా ప్రసంగం. సహజమైన తెలుగుకోసం ‘సందేశాన్ని కొనసాగించాడు’ అని ఇచ్చాం.
- source_word: μέχρι μεσονυκτίου
  choice: అర్ధరాత్రి వరకు
  rationale: చర్య కొనసాగిన కాలపరిమితిని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఆదిమ క్రైస్తవ సమావేశంలో ‘రొట్టె విరవడం’ అనే మాట అర్థం
  choice: ‘రొట్టె విరవడానికి’ అనే మూల నుడికారాన్నే నిలిపాం.
  alternative: ‘ప్రభువు భోజనం ఆచరించడానికి’ లేదా ‘కలిసి భోజనం చేయడానికి’
  rationale: అపొస్తలుల కార్యములలో ఈ మాట భోజన సహవాసాన్ని సూచించవచ్చు; ప్రభువు భోజన భావాన్ని కూడా మోసుకురావచ్చు. మూలపాఠం స్పష్టంగా తేల్చని చోట అనువాదం ఒక మతశాఖకు ప్రత్యేకమైన అర్థాన్ని నిర్ణయించదు.
- issue: μέλλων అనే కృదంతానికి ప్రధాన క్రియతో ఉన్న సంబంధం
  choice: ‘మరుసటి రోజు బయలుదేరబోతున్న పౌలు’ అని పరిస్థితిని మాత్రమే తెలిపాం.
  alternative: ‘మరుసటి రోజు బయలుదేరబోతున్నందున’ అని స్పష్టమైన కారణ సంబంధంగా అనువదించడం
  rationale: గ్రీకు కృదంతం సమీప భవిష్యత్తు పరిస్థితిని తెలుపుతుంది; కారణ సంబంధం సందర్భంలో సాధ్యమైనప్పటికీ వ్యాకరణం దానిని తప్పనిసరిగా నిర్ధారించదు. అందువల్ల ప్రధాన పాఠంలో అస్పష్టతను కాపాడి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథన శైలిలో అనువదించాం. ‘రొట్టె విరవడం’ వంటి మూల నుడికారాన్ని వివరణతో నిలిపి, మతశాఖాపరమైన నిర్దిష్టీకరణను నివారించాం.
