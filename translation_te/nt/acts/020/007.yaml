  to: వారంలోని మొదటి రోజున, రొట్టె విరవడానికి[a] మేము కూడినప్పుడు, మరుసటి రోజు బయలుదేరబోతున్న పౌలు వారితో మాట్లాడుతూ తన ప్రసంగాన్ని అర్ధరాత్రి వరకు పొడిగించాడు.[b]
  rationale: సవరణలు అర్థాన్ని మార్చవు. ‘కూడినప్పుడు’ ద్వారా గ్రీకు సందర్భార్థక సమకూరికను స్పష్టంగా తెలిపాం; ‘ప్రసంగాన్ని ... పొడిగించాడు’ ద్వారా παρέτεινεν τὸν λόγον యొక్క భావాన్ని కాపాడాం. ప్రధాన పాఠంలోని ‘మరుసటి రోజు బయలుదేరబోతున్న పౌలు’ నిర్మాణం కృదంత సంబంధాన్ని పరిస్థితిగానే ఉంచుతుంది; కారణార్థక ప్రత్యామ్నాయాన్ని పాదసూచికలో మాత్రమే ఇచ్చాం. రెండు పాదసూచికల గుర్తులు సంబంధిత పదబంధాల వద్ద ఉన్నాయి.
