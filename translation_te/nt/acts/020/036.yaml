  yaml_path: translation/nt/acts/020/036.yaml
  text: And after saying these things, he knelt down with them all and prayed.
translation:
  language: te
  text: అతడు ఈ మాటలు చెప్పిన తర్వాత, వారందరితో కలిసి మోకాళ్లూని ప్రార్థించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: '[ప్రత్యేక పదంగా అనువదించలేదు]'
  rationale: గ్రీకు కథనంలోని సాధారణ అనుసంధాన పదం. తెలుగులో ముందున్న వాక్యంతో సహజంగా కొనసాగేలా ప్రత్యేకంగా ‘మరియు’ చేర్చకపోవడం సాఫీగా ఉంటుంది; సంఘటనల క్రమం ‘తర్వాత’ ద్వారా స్పష్టమవుతుంది.
- source_word: ταῦτα εἰπὼν
  choice: ఈ మాటలు చెప్పిన తర్వాత
  rationale: అయోరిస్ట్ క్రియావిశేషణీయ కృదంతం ప్రధాన చర్యకు ముందుగా జరిగిన మాటలను సూచిస్తుంది. ఈ తెలుగు రూపం కాలక్రమాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: θεὶς τὰ γόνατα αὐτοῦ
  choice: మోకాళ్లూని
  rationale: అక్షరార్థంగా ‘తన మోకాళ్లు ఉంచి’ అనే గ్రీకు నుడికారం మోకరించి కూర్చోవడాన్ని సూచిస్తుంది. ‘మోకాళ్లూని’ అతిశయోక్తి లేకుండా ఆ భంగిమను సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: σὺν πᾶσιν αὐτοῖς
  choice: వారందరితో కలిసి
  rationale: σύν సహవాసాన్ని, πᾶσιν మొత్తం సమూహాన్ని నొక్కిచెబుతాయి. ‘వారందరితో కలిసి’ ఈ రెండు భావాలనూ స్పష్టంగా నిలుపుతుంది.
- source_word: προσηύξατο
  choice: ప్రార్థించాడు
  rationale: προσεύχομαι ప్రార్థించడాన్ని సూచించే సాధారణ క్రియ. ‘ప్రార్థించాడు’ ప్రత్యక్షమైన, సహజమైన ఆధునిక తెలుగు రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని చర్యల క్రమం మరియు మొత్తం సమూహం పాల్గొన్నదనే నొక్కును కాపాడింది.
