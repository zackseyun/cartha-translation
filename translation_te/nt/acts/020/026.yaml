id: ACT.20.26
reference: Acts 20:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀διότι μαρτύρομαι ὑμῖν ἐν τῇ σήμερον ἡμέρᾳ ὅτι καθαρός ⸀εἰμι ἀπὸ τοῦ αἵματος πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/026.yaml
  text: Therefore I testify to you on this day that I am innocent of the blood of all[a][b].
translation:
  language: te
  text: 'కాబట్టి, ఈ రోజున మీకు సాక్ష్యమిస్తున్నాను: అందరి రక్తం విషయంలో నేను నిర్దోషిని[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అందరి రక్తం నుండి నేను శుద్ధుడను”; ఈ గ్రీకు నుడికారం ఇతరుల విషయంలో అపరాధం లేదా బాధ్యత నుండి విముక్తిగా ఉండడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ మాటలు రక్తాపరాధం గురించి యెహెజ్కేలు గ్రంథంలోని కాపలాదారి చిత్రణను ప్రతిధ్వనిస్తున్నట్లు కనిపిస్తున్నాయి (ఉదా. యెహెజ్కేలు 3:18–19; 33:6–9).
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: కాబట్టి
  rationale: మునుపటి వాక్యాల ఆధారంగా పౌలు చేస్తున్న నిర్ధారణను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: μαρτύρομαι
  choice: సాక్ష్యమిస్తున్నాను
  rationale: ఈ క్రియలోని గంభీరమైన వ్యక్తిగత ప్రకటన భావాన్ని నిలుపుతుంది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: దత్తివ విభక్తి భావాన్ని సహజంగా, అదనపు న్యాయస్థాన అర్థం చేర్చకుండా అందిస్తుంది.
- source_word: ἐν τῇ σήμερον ἡμέρᾳ
  choice: ఈ రోజున
  rationale: మూలంలోని గంభీరమైన సెమిటిక్ శైలిని ‘నేడు’ కంటే స్పష్టంగా నిలుపుతూ సహజమైన తెలుగుగా ఉంది.
- source_word: ὅτι
  choice: ':'
  rationale: తెలుగులో ప్రత్యక్షంగా ప్రకటన విషయాన్ని పరిచయం చేయడానికి విరామచిహ్నం సహజంగా పనిచేస్తుంది; అర్థపరంగా ‘అని’ భావం నిలుస్తుంది.
- source_word: καθαρός
  choice: నిర్దోషిని
  rationale: తదుపరి రక్తం సంబంధమైన నుడికారంలో ఇది శుభ్రతకన్నా అపరాధం లేదా బాధ్యత లేకపోవడాన్ని సూచిస్తుంది.
- source_word: εἰμι
  choice: నేను … నిర్దోషిని
  rationale: తెలుగు నామవాచక విధేయ నిర్మాణంలో వర్తమాన ‘ఉన్నాను’ను విడిచిపెట్టడం సహజం; వ్యక్తి మరియు స్థితి స్పష్టంగానే ఉన్నాయి.
- source_word: ἀπὸ τοῦ αἵματος
  choice: రక్తం విషయంలో
  rationale: ‘రక్తం నుండి’ అనే అసహజమైన పదక్షర రూపాన్ని నివారిస్తూ, రక్తాపరాధం లేదా బాధ్యతకు సంబంధించిన మూల నుడికారాన్ని పారదర్శకంగా ఉంచుతుంది.
- source_word: πάντων
  choice: అందరి
  rationale: విస్తృతమైన బహువచన పరిధిని సంక్షిప్తంగా నిలుపుతుంది; సందర్భంలో ఇది ప్రజలందరిని సూచిస్తుంది.
theological_decisions:
- issue: ‘అందరి రక్తం విషయంలో నిర్దోషిని’ అనే మాట అర్థం
  choice: తాను హెచ్చరించి బోధించవలసిన బాధ్యతను పూర్తిగా నెరవేర్చినందున ఇతరుల విషయంలో రక్తాపరాధం లేదా బాధ్యత తనపై లేదని చెప్పే నుడికారంగా ఉంచబడింది.
  alternative: ఎవరి భౌతిక మరణంలోనూ పౌలుకు ప్రత్యక్ష ప్రమేయం లేదనే సంకుచిత అర్థం.
  rationale: అపొస్తలుల కార్యాలు 20 సందర్భం పౌలు దేవుని సంకల్పమంతటినీ ప్రకటించడంలో వెనుకాడలేదని చెబుతుంది; ఈ పదబంధం యెహెజ్కేలు కాపలాదారి చిత్రణలోని రక్తాపరాధ భావాన్ని ప్రతిధ్వనిస్తుంది. అనువాదం ఆ నుడికారాన్ని పూర్తిగా వివరణగా మార్చకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన సాక్ష్య ప్రకటన శైలిని పాటించాం. ‘ఈ రోజున’ మూలంలోని ఉద్దేశపూర్వక గంభీరతను నిలుపుతుంది. ప్రధాన పాఠంలో నుడికారాన్ని కాపాడి, దాని అపరాధం/బాధ్యత భావాన్ని పాదటిప్పణిలో వివరించాం.
