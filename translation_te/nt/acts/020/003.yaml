id: ACT.20.3
reference: Acts 20:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ποιήσας τε μῆνας τρεῖς· γενομένης ⸂ἐπιβουλῆς αὐτῷ⸃ ὑπὸ τῶν Ἰουδαίων μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν ἐγένετο ⸀γνώμης τοῦ ὑποστρέφειν διὰ Μακεδονίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/003.yaml
  text: After spending three months there[a], when a plot was made against him by the Jews as he was about to sail for Syria[d][c][b], he decided to return through Macedonia.
translation:
  language: te
  text: అక్కడ మూడు నెలలు గడిపిన తర్వాత, అతడు సిరియాకు ఓడలో బయలుదేరబోతుండగా యూదులు[a] అతనికి వ్యతిరేకంగా కుట్ర పన్నడంతో, అతడు మాసిదోనియా గుండా తిరిగి వెళ్లాలని నిర్ణయించుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘యూదులు’ అన్నది పౌలును వ్యతిరేకించిన సందర్భంలోని ఒక నిర్దిష్ట వర్గాన్ని సూచిస్తుంది; యూదులందరినీ తేడా లేకుండా సూచించదు.
    reason: సాంస్కృతిక మరియు సందర్భపరమైన స్పష్టీకరణ
lexical_decisions:
- source_word: ποιήσας τε μῆνας τρεῖς
  choice: అక్కడ మూడు నెలలు గడిపిన తర్వాత
  rationale: ποιέω కాలవ్యవధితో వచ్చినప్పుడు ‘కాలం గడపడం’ అనే అర్థం ఇస్తుంది. ‘అక్కడ’ అనే పదం మూలపాఠంలో ప్రత్యక్షంగా లేకపోయినా, మునుపటి వచనంలోని గ్రీసును సూచిస్తూ తెలుగులో సహజమైన అనుసంధానాన్ని ఇస్తుంది.
- source_word: γενομένης ἐπιβουλῆς αὐτῷ
  choice: అతనికి వ్యతిరేకంగా కుట్ర పన్నడంతో
  rationale: ἐπιβουλή శత్రుత్వపూర్వకమైన పన్నాగం లేదా కుట్రను సూచిస్తుంది. జనిటివ్ అబ్సల్యూట్ నిర్మాణం ఇక్కడ పరిస్థితినీ, పౌలు మార్గం మార్చుకోవడానికి దారితీసిన కారణాన్నీ తెలియజేస్తుంది; ‘పన్నడంతో’ దీనిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὑπὸ τῶν Ἰουδαίων
  choice: యూదులు
  rationale: మూలంలోని τῶν Ἰουδαίωνను నేరుగా నిలుపుతుంది. ఇది యూదులందరినీ సూచిస్తుందని అపార్థం కాకుండా సందర్భపరమైన వివరణను పాదసూచికలో ఇచ్చాం.
- source_word: μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν
  choice: సిరియాకు ఓడలో బయలుదేరబోతుండగా
  rationale: μέλλω సమీప భవిష్యత్తును, ἀνάγεσθαι సముద్రయాన సందర్భంలో ఓడలో బయలుదేరడాన్ని సూచిస్తాయి. ఈ రూపం గమ్యస్థానాన్నీ, ప్రయాణ విధానాన్నీ సహజంగా తెలుపుతుంది.
- source_word: ἐγένετο γνώμης τοῦ ὑποστρέφειν
  choice: తిరిగి వెళ్లాలని నిర్ణయించుకున్నాడు
  rationale: ἐγένετο γνώμης అనే గ్రీకు ప్రయోగం ఒక నిర్ణయానికి రావడాన్ని సూచిస్తుంది; ఆ నిర్ణయపు విషయాన్ని τοῦ ὑποστρέφειν తెలియజేస్తుంది.
- source_word: διὰ Μακεδονίας
  choice: మాసిదోనియ గుండా
  rationale: జనిటివ్‌తో διά ఇక్కడ ప్రయాణ మార్గాన్ని సూచిస్తుంది. ‘గుండా’ ఆ భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ఘర్షణ వర్ణనలో ‘యూదులు’ అనే పదం ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో ‘యూదులు’ అనే మూలపాఠ పదాన్ని నిలిపి, దాని సందర్భపరమైన పరిధిని పాదసూచికలో వివరించడం.
  alternative: ‘యూదుల్లో కొందరు’ లేదా ‘యూదా ప్రత్యర్థులు’ అని ప్రధాన పాఠంలో స్పష్టీకరించడం.
  rationale: గ్రీకు పాఠం τῶν Ἰουδαίων అని స్పష్టంగా చెబుతుంది; ప్రధాన పాఠంలో ‘కొందరు’ లేదా ‘ప్రత్యర్థులు’ చేర్చడం మూలంలో లేని పరిమితిని ప్రత్యక్షంగా జోడిస్తుంది. అయితే అపొస్తలుల కార్యములలో ఇలాంటి సందర్భాల్లో ఒక నిర్దిష్ట ప్రతిఘటనా వర్గమే ఉద్దేశించబడుతుంది; అందువల్ల జాతి మొత్తానికి నింద మోపకుండా పాదసూచికలో సందర్భాన్ని తెలియజేయడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని కాలక్రమం, కుట్ర వల్ల మారిన ప్రయాణ నిర్ణయం, సముద్రయాన భావం స్పష్టంగా ఉండేలా ఒకే ప్రవాహవంతమైన వాక్యంగా అనువదించాం.
