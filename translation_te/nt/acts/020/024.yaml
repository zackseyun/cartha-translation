id: ACT.20.24
reference: Acts 20:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδενὸς ⸀λόγου ⸀ποιοῦμαι τὴν ⸀ψυχὴν τιμίαν ἐμαυτῷ ὡς ⸀τελειῶσαι τὸν δρόμον ⸀μου καὶ τὴν διακονίαν ἣν ἔλαβον παρὰ τοῦ κυρίου Ἰησοῦ, διαμαρτύρασθαι τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/024.yaml
  text: 'But I do not count my life as of any value to myself[c][b][a], if only I may finish my course and the ministry that I received from the Lord Jesus: to testify to the gospel of the grace of God.'
translation:
  language: te
  text: కానీ నా ప్రాణం నాకు విలువైనదని ఏమాత్రం భావించను; నా పరుగును[b], ప్రభువైన యేసు నుండి నేను పొందిన పరిచర్యను—అంటే దేవుని కృప సువార్తకు సాక్ష్యమివ్వడాన్ని[c]—పూర్తి చేయగలిగితే చాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా ‘నా పరుగు పందెాన్ని.’ గ్రీకు పదం గమ్యం వరకు పూర్తి చేయవలసిన పరుగు లేదా ప్రయాణ మార్గాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘గంభీరంగా సాక్ష్యమివ్వడాన్ని’ లేదా ‘సాక్ష్యపూర్వకంగా ప్రకటించడాన్ని.’ గ్రీకు క్రియలో బలంగా లేదా గంభీరంగా సాక్ష్యం చెప్పే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδενὸς λόγου ποιοῦμαι
  choice: ఎంతమాత్రమూ ఎంచను
  rationale: ఈ గ్రీకు నుడికారం దేనినైనా విలువగలదిగా పరిగణించకపోవడాన్ని సూచిస్తుంది. ‘ఎంతమాత్రమూ ఎంచను’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, మూలంలోని మూల్యాంకన భావాన్ని నిలుపుతుంది.
- source_word: ψυχήν
  choice: ప్రాణం
  rationale: ఈ సందర్భంలో పౌలు తన భౌతిక జీవాన్ని కాపాడుకోవడం కంటే తనకు అప్పగించిన కార్యాన్ని పూర్తి చేయడాన్ని ముఖ్యంగా భావిస్తున్నాడు. ‘ప్రాణం’ ఇక్కడ మరణాన్ని ఎదుర్కొనే సందర్భానికి సరిపోతుంది; శరీరానికి భిన్నమైన ఆత్మ అనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: τιμίαν ἐμαυτῷ
  choice: నాకు విలువైనదిగా
  rationale: τιμίαν అంటే ‘విలువైనది’ లేదా ‘అమూల్యమైనది’; ἐμαυτῷ వ్యక్తిగత మూల్యాంకనాన్ని తెలియజేస్తుంది. ఈ అనువాదం రెండింటినీ స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: ὡς τελειῶσαι
  choice: పూర్తి చేయగలిగితే చాలు
  rationale: ఈ సంక్షిప్త గ్రీకు నిర్మాణం పౌలు యొక్క ప్రధాన లక్ష్యాన్ని బలంగా వ్యక్తం చేస్తుంది. ‘చేయగలిగితే చాలు’ అనేది కేవలం ప్రయోజనార్థక సంబంధం కంటే అతని ఏకైక ఆకాంక్షను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: δρόμον
  choice: పరుగు
  rationale: ఈ పదంలో గమ్యానికి చేరేవరకు సాగే పరుగు లేదా మార్గం అనే రూపకం ఉంది. ‘పరుగు’ ఆ రూపకాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: διακονίαν
  choice: పరిచర్య
  rationale: ఇక్కడ ఈ పదం ప్రభువైన యేసు పౌలుకు అప్పగించిన సేవా బాధ్యతను సూచిస్తుంది. ‘పరిచర్య’ ఆ నియామక భావాన్ని మరియు క్రైస్తవ సేవ సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: παρὰ τοῦ κυρίου Ἰησοῦ
  choice: ప్రభువైన యేసు నుండి
  rationale: παρά జనిటివ్‌తో మూలాన్ని లేదా ఇచ్చిన వ్యక్తిని సూచిస్తుంది. ‘నుండి’ ఆ సంబంధాన్ని నేరుగా నిలుపుతుంది; κύριος అనే బిరుదును ‘ప్రభువు’గా ఉంచుతుంది.
- source_word: διαμαρτύρασθαι
  choice: సాక్ష్యమివ్వడం
  rationale: ఈ క్రియ బలంగా లేదా గంభీరంగా సాక్ష్యం చెప్పడాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో ‘సాక్ష్యమివ్వడం’ సహజంగా ఉంది; గంభీరతకు సంబంధించిన సూక్ష్మభావాన్ని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: εὐαγγέλιον
  choice: సువార్త
  rationale: ‘సువార్త’ ఆధునిక తెలుగు క్రైస్తవ వాడుకలో స్పష్టమైన, స్థిరమైన పదం; శుభవార్త అనే మూలభావాన్నీ నిలుపుతుంది.
- source_word: τῆς χάριτος τοῦ θεοῦ
  choice: దేవుని కృప సువార్త
  rationale: గ్రీకు జనిటివ్ నిర్మాణం ఈ సువార్త దేవుని కృపకు సంబంధించినదా, దానిచేత లక్షణీకరించబడిందా అనే భావ విస్తృతిని కలిగి ఉంది. తెలుగు నిర్మాణం ఆ సంబంధాన్ని అనవసరంగా కుదించకుండా ఉంచుతుంది.
theological_decisions:
- issue: ψυχή అనే పదం పౌలు స్వీయవివరణలో కలిగిన భావం
  choice: ప్రాణం
  alternative: ఆత్మ
  rationale: ఈ వాక్య సందర్భం తన పరిచర్యను పూర్తి చేయడానికి బాధనూ మరణాన్నీ ఎదుర్కొనే పౌలు సిద్ధతను గురించి మాట్లాడుతుంది. ‘ప్రాణం’ అనడం మూలంలో ముందుకు రాని శరీరం–ఆత్మ విభజనను చేర్చకుండా ఉంటుంది.
- issue: ὡς τελειῶσαι యొక్క భావబలం
  choice: పూర్తి చేయగలిగితే చాలు
  alternative: పూర్తి చేయడానికి / తద్వారా పూర్తి చేయడానికి
  rationale: ఈ వాక్యభాగం కేవలం వ్యాకరణపరమైన ఉద్దేశాన్ని కాకుండా పౌలు యొక్క ప్రధాన, అధికమైన ఆకాంక్షను వ్యక్తం చేస్తుంది. ఎంపిక చేసిన రూపం ఆ బలాన్ని నిలుపుతూ అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘పరిచర్య,’ ‘సువార్త,’ ‘కృప’ వంటి స్థిరమైన బైబిలు పదాలు నిలుపబడ్డాయి. వాక్యంలోని దీర్ఘ నిర్మాణాన్ని డాష్ మరియు సెమికోలన్‌తో విభజించి, పరిచర్య ఏమిటో తెలిపే అనుబంధ వివరణను స్పష్టంగా ఉంచాం.
