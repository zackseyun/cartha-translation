revisions:
- from: కానీ నా పరుగును[b], ప్రభువైన యేసు నుండి నేను పొందిన పరిచర్యను—అంటే దేవుని కృప సువార్తకు సాక్ష్యమివ్వడాన్ని[c]—పూర్తి చేయగలిగితే చాలు; నా ప్రాణాన్ని[a] నాకు విలువైనదిగా ఏమాత్రమూ ఎంచను.
  to: కానీ నా ప్రాణం నాకు విలువైనదని ఏమాత్రం భావించను; నా పరుగును[b], ప్రభువైన యేసు నుండి నేను పొందిన పరిచర్యను—అంటే దేవుని కృప సువార్తకు సాక్ష్యమివ్వడాన్ని[c]—పూర్తి చేయగలిగితే చాలు.
  rationale: The revision replaces the potentially misleading ‘do not choose’ expression with an idiomatic Telugu equivalent for ‘do not regard/count as valuable.’ It retains the draft’s faithful contextual rendering of ψυχή as ‘ప్రాణం,’ preserves the course/race metaphor and the commissioned nature of the ministry, and keeps the Greek’s broad relationship in ‘దేవుని కృప సువార్త.’ Footnote a is clarified to distinguish the contextual alternative ‘జీవితం’ from the wider lexical possibility ‘ఆత్మ.’
  reviewer_model: gpt-5.6-terra
