id: ACT.20.31
reference: Acts 20:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὸ γρηγορεῖτε, μνημονεύοντες ὅτι τριετίαν νύκτα καὶ ἡμέραν οὐκ ἐπαυσάμην μετὰ δακρύων νουθετῶν ἕνα ἕκαστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/031.yaml
  text: Therefore stay alert[a], remembering that for three years, night and day, I did not stop admonishing each one with tears.
translation:
  language: te
  text: కాబట్టి, మూడు సంవత్సరాల పాటు రాత్రింబగళ్లు కన్నీళ్లతో ప్రతి ఒక్కరినీ హెచ్చరిస్తూ ఉండడం[a] నేను మానలేదని జ్ఞాపకం ఉంచుకొని, మెలకువగా ఉండండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బోధిస్తూ సరిదిద్దడం.” గ్రీకు క్రియలో సరిదిద్దే హెచ్చరికతోపాటు ఉపదేశించే భావం కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: కాబట్టి
  rationale: ముందున్న హెచ్చరికనుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: γρηγορεῖτε
  choice: మెలకువగా ఉండండి
  rationale: వర్తమాన కాల ఆజ్ఞలోని నిరంతర అప్రమత్తత భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μνημονεύοντες
  choice: జ్ఞాపకం చేసుకోండి
  rationale: గ్రీకు కృదంతం ప్రధాన ఆజ్ఞతో అనుబంధంగా ఉంది; తెలుగులో వాక్యాన్ని సహజంగా ఉంచేందుకు సమన్విత ఆజ్ఞగా ఇచ్చినా, అప్రమత్తతకు పౌలు సేవను జ్ఞాపకం చేసుకోవడం తోడవుతుందనే సంబంధం నిలుస్తుంది.
- source_word: τριετίαν
  choice: మూడు సంవత్సరాలు
  rationale: కాలవ్యాప్తిని తెలుగులో సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: νύκτα καὶ ἡμέραν
  choice: రాత్రింబగళ్లు
  rationale: మూలంలోని ‘రాత్రి మరియు పగలు’ క్రమాన్ని, నిరంతర కార్యభావాన్ని సహజమైన తెలుగు ప్రయోగంతో నిలుపుతుంది.
- source_word: οὐκ ἐπαυσάμην
  choice: నేను మానలేదు
  rationale: ఆ పనిని పౌలు ఆపకుండా కొనసాగించాడనే భావాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: μετὰ δακρύων
  choice: కన్నీళ్లతో
  rationale: కన్నీళ్లు అతని పరిచర్యకు తోడుగా ఉన్నాయనే మూలభావాన్ని, దాని భావోద్వేగ బలాన్ని కాపాడుతుంది.
- source_word: νουθετῶν
  choice: హెచ్చరించడం
  rationale: νουθετέωలోని సరిదిద్దే బోధన మరియు హెచ్చరిక భావాలలో, ఈ సందర్భంలోని ప్రమాద హెచ్చరికకు సరిపోయే సహజ తెలుగు పదం; విస్తృత అర్థాన్ని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: ἕνα ἕκαστον
  choice: ప్రతి ఒక్కరినీ
  rationale: వ్యక్తిగతంగా ఒక్కొక్కరిపై చూపిన శ్రద్ధను తెలిపే విభజనాత్మక బలాన్ని కాపాడుతుంది.
theological_decisions:
- issue: νουθετῶν యొక్క కాపరి పరిచర్య భావం
  choice: హెచ్చరించడం
  alternative: బుద్ధిచెప్పడం
  rationale: సందర్భంలో రాబోయే ప్రమాదాల విషయమై పౌలు ఇచ్చిన వ్యక్తిగత, కన్నీళ్లతో కూడిన సరిదిద్దే హెచ్చరిక ప్రధానంగా ఉంది. అయితే ఈ క్రియ కేవలం ప్రమాదం చెప్పడానికే పరిమితం కాక, బోధించి సరిదిద్దడాన్నీ సూచించగలదని పాదటిప్పణిలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం. మూలంలోని గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు సహజంగా ఉండే పదప్రయోగం ఎంచుకుంది.
