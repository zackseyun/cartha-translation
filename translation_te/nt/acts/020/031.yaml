revisions:
- from: కాబట్టి మెలకువగా ఉండండి. మూడు సంవత్సరాలు రాత్రింబగళ్లు కన్నీళ్లతో ప్రతి ఒక్కరినీ హెచ్చరించడం[a] నేను మానలేదని జ్ఞాపకం చేసుకోండి.
  to: కాబట్టి, మూడు సంవత్సరాల పాటు రాత్రింబగళ్లు కన్నీళ్లతో ప్రతి ఒక్కరినీ హెచ్చరిస్తూ ఉండడం[a] నేను మానలేదని జ్ఞాపకం ఉంచుకొని, మెలకువగా ఉండండి.
