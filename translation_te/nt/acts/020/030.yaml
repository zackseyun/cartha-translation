id: ACT.20.30
reference: Acts 20:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐξ ὑμῶν αὐτῶν ἀναστήσονται ἄνδρες λαλοῦντες διεστραμμένα τοῦ ἀποσπᾶν τοὺς μαθητὰς ὀπίσω ⸀ἑαυτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/030.yaml
  text: and from among your own selves men will arise[a], speaking twisted things, to draw away the disciples after themselves.
translation:
  language: te
  text: మీలో నుంచే కొందరు పురుషులు లేచి, శిష్యులను తమ వెంట లాగుకోవడానికి వక్రీకరించిన మాటలు మాట్లాడతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వక్రమైన మాటలు’ లేదా ‘చెడగొట్టిన మాటలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: మీలో నుంచే
  rationale: ἐξ ... αὐτῶνలోని నొక్కిచెప్పే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతూ, ముప్పు సంఘం లోపలి నుంచే వస్తుందని స్పష్టం చేస్తుంది.
- source_word: ἀναστήσονται
  choice: లేచి
  rationale: ఇక్కడ ἀνίστημι అంటే అటువంటి వ్యక్తులు ముందుకు రావడం లేదా ఉద్భవించడం; ‘లేచి’ భవిష్య సూచనను సహజంగా తెలియజేస్తుంది.
- source_word: ἄνδρες
  choice: కొందరు పురుషులు
  rationale: ἀνήρ ప్రత్యేకంగా పురుషులను సూచిస్తుంది. తెలుగు వాక్య సహజత్వం కోసం అనిర్దిష్ట బహువచన భావాన్ని ‘కొందరు’తో వ్యక్తం చేశాం.
- source_word: λαλοῦντες
  choice: మాట్లాడతారు
  rationale: వారి మాటల క్రియను నేరుగా, సహజంగా తెలియజేస్తుంది; గ్రీకు కృదంతాన్ని తెలుగులో ప్రధాన క్రియతో సమన్వయించాం.
- source_word: διεστραμμένα
  choice: వక్రీకరించిన మాటలు
  rationale: నిజమైన లేదా సూటియైన దానిని మలుపుతిప్పిన భావాన్ని తెలియజేస్తుంది; నిర్దిష్టమైన భ్రాంతి లేదా కేవలం నైతిక దుష్టత్వం అని అర్థాన్ని కుదించదు.
- source_word: τοῦ ἀποσπᾶν
  choice: లాగుకోవడానికి
  rationale: τοῦతో కూడిన క్రియారూపం ఉద్దేశాన్ని సూచిస్తుంది; ἀποσπάωలోని బలంగా వేరుచేసి తనవైపు తీసుకుపోయే రూపకాన్ని ‘లాగుకోవడానికి’ నిలుపుతుంది.
- source_word: τοὺς μαθητὰς
  choice: శిష్యులను
  rationale: అపొస్తలుల కార్యములలో యేసు అనుచరులకు స్థిరమైన తెలుగు బైబిలు పదం ‘శిష్యులు’.
- source_word: ὀπίσω ἑαυτῶν
  choice: తమ వెంట
  rationale: వ్యక్తిగత అనుయాయిత్వాన్ని సూచించే గ్రీకు నుడికారానికి సహజమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: తప్పుడు బోధకుల మాటల స్వభావం
  choice: వక్రీకరించిన మాటలు
  alternative: వక్రమైన మాటలు; చెడగొట్టిన మాటలు
  rationale: పాఠ్యం నిర్దిష్టమైన భ్రాంతిని పేర్కొనకుండా సత్యాన్ని వక్రీకరించే విస్తృత భావాన్ని ఇస్తుంది; అనువాదం ఆ విస్తృతతను నిలుపుతుంది.
- issue: ἄνδρες యొక్క లింగ సూచన
  choice: పురుషులు
  alternative: వ్యక్తులు; మనుషులు
  rationale: గ్రీకు పదం ప్రత్యేకంగా పురుష లింగాన్ని సూచిస్తుంది కాబట్టి దానిని లింగతటస్థంగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన శైలి. ‘మీలో నుంచే’ అంతర్గత ముప్పుపై నొక్కును, ‘తమ వెంట లాగుకోవడానికి’ వేరుచేసి వ్యక్తిగత అనుచరులుగా చేసుకునే ఉద్దేశాన్ని నిలుపుతున్నాయి.
