  yaml_path: translation/nt/acts/020/021.yaml
  text: solemnly testifying to both Jews and Greeks about repentance toward God and faith in our Lord Jesus[a].
translation:
  language: te
  text: యూదులకూ గ్రీసువారికీ దేవుని వైపు మళ్లే పశ్చాత్తాపం గురించి, మన ప్రభువైన యేసుపై విశ్వాసం[a] గురించి గంభీరంగా సాక్ష్యమిచ్చాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మన ప్రభువైన యేసును నమ్మడం.”
    reason: πίστις‌కు ‘విశ్వాసం’తో పాటు వ్యక్తిగత నమ్మకం లేదా భరోసా అనే భావమూ ఇక్కడ సహజంగా సాధ్యమే.
lexical_decisions:
- source_word: διαμαρτυρόμενος
  choice: గంభీరంగా సాక్ష్యమిస్తూ ఉన్నాను
  rationale: ఈ క్రియారూపం బలమైన, గంభీరమైన సాక్ష్యాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో ముందరి సందర్భంతో అనుసంధానమయ్యే కొనసాగుతున్న సాక్ష్యభావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: యూదులకూ గ్రీసువారికీ
  rationale: యూదులు, గ్రీసువారు అనే లూకా ఉపయోగించిన జతను అలాగే ఉంచి, దీనిని సాధారణీకరించి ‘యూదేతరులు’గా మార్చలేదు.
- source_word: μετάνοιαν εἰς θεόν
  choice: దేవుని వైపు పశ్చాత్తాపంతో తిరగడం
  rationale: μετάνοια యొక్క నైతిక-ఆధ్యాత్మిక పశ్చాత్తాప భావాన్నీ, εἰς సూచించే దేవుని వైపు దిశనూ సహజమైన తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: πίστιν
  choice: విశ్వాసం ఉంచడం
  rationale: ఇక్కడ విశ్వాసానికి యేసు స్పష్టమైన లక్ష్యంగా ఉన్నాడు. ‘విశ్వాసం’ మూలపదానికి ప్రామాణిక సమానార్థక పదం; ‘ఉంచడం’ తెలుగులో సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἰς τὸν κύριον ἡμῶν Ἰησοῦν
  choice: మన ప్రభువైన యేసుపై
  rationale: πίστις‌తో ఉన్న εἰς విశ్వాసం ఎవరిపై ఉంచబడుతుందో సూచిస్తుంది. κύριος యొక్క క్రీస్తుసంబంధమైన బరువును ‘ప్రభువు’ కాపాడుతుంది.
theological_decisions:
- issue: πίστις‌ను ‘విశ్వాసం’గా లేదా ‘నమ్మకం/నమ్మడం’గా అనువదించడం
  choice: మన ప్రభువైన యేసుపై విశ్వాసం ఉంచడం
  alternative: మన ప్రభువైన యేసును నమ్మడం
  rationale: యేసు ఇక్కడ విశ్వాసానికి స్పష్టమైన లక్ష్యం. ప్రధాన పాఠంలో సాంప్రదాయికమైన, విస్తృతార్థమున్న ‘విశ్వాసం’ను ఉంచి, వ్యక్తిగత నమ్మకాన్ని స్పష్టంచేసే సహజ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: μετάνοια εἰς θεόν యొక్క దిశాత్మక భావం
  choice: దేవుని వైపు పశ్చాత్తాపంతో తిరగడం
  alternative: దేవుని పట్ల పశ్చాత్తాపం
  rationale: εἰς‌లోని దిశ లేదా అభిముఖతను ‘వైపు ... తిరగడం’ స్పష్టంగా కాపాడుతుంది; పశ్చాత్తాపాన్ని కేవలం మనస్సు మార్చుకోవడంగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘గ్రీసువారు’ మూలంలోని Ἕλληνες‌ను కాపాడుతుంది; ‘యూదేతరులు’గా సాధారణీకరించలేదు. వాక్యంలోని కృదంత సంబంధాన్ని తెలుగులో సహజంగా చేయడానికి కొనసాగుతున్న క్రియారూపం వాడబడింది.
