  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రయాణ కథన శైలిని వాడాం. ‘ఓడలో’ అనేది గ్రీకు కృదంతంలో సందర్భానుసారంగా అంతర్లీనంగా ఉన్న నౌకాయాన భావాన్ని స్పష్టం చేస్తుంది. స్థలనామాలను ‘అస్సోసు,’ ‘మితులేనె’గా లిప్యంతరీకరించాం.
