id: ACT.20.11
reference: Acts 20:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀναβὰς δὲ καὶ κλάσας ⸀τὸν ἄρτον καὶ γευσάμενος ἐφ’ ἱκανόν τε ὁμιλήσας ἄχρι αὐγῆς, οὕτως ἐξῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/011.yaml
  text: Then he went upstairs[a], broke the bread, and ate; and after talking for a long time, until dawn[b], he departed.
translation:
  language: te
  text: అతడు పైకి వెళ్లి, రొట్టెను విరిచి[a] తిన్నాడు[b]. ఆ తర్వాత తెల్లవారేవరకు చాలాసేపు మాట్లాడి, అప్పుడు బయలుదేరాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రొట్టె పంచుకున్నాడు.’ ఈ గ్రీకు ప్రయోగం కలిసి భోజనం చేయడాన్ని సూచించవచ్చు; కొందరు ఇక్కడ ప్రభువు భోజనం కూడా ఉద్దేశించబడిందని భావిస్తారు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా ‘రుచి చూశాడు’; లేదా ‘ఆహారం తీసుకున్నాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβὰς
  choice: పైకి వెళ్లి
  rationale: ఇది ἀναβαίνω క్రియ యొక్క భూతకాల అసమాపక రూపం. మునుపటి సందర్భంలో పౌలు కిందికి దిగిన తర్వాత మళ్లీ మేడగదికి వెళ్లడాన్ని సూచిస్తుంది. ‘పైకి వెళ్లి’ మూలంలోని దిశను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: κλάσας τὸν ἄρτον
  choice: రొట్టెను విరిచి
  rationale: గ్రీకులో ἄρτον ముందు నిర్దిష్ట ఉపపదం ఉంది. ఈ అనువాదం స్పష్టమైన చర్యను తెలియజేస్తుంది; ఇది సాధారణ భోజనమా, ప్రభువు భోజనంతో సంబంధమున్న సందర్భమా అన్నది తేల్చదు.
- source_word: γευσάμενος
  choice: భుజించాడు
  rationale: γεύομαι ప్రాథమికంగా ‘రుచి చూడు’ అని అర్థమివ్వగలిగినా, భోజన సందర్భంలో ఆహారం తినడం లేదా దానిలో పాలుపంచుకోవడం అనే విస్తృత అర్థాన్ని కలిగి ఉంటుంది. గౌరవప్రదమైన ఆధునిక తెలుగులో ‘భుజించాడు’ ఈ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: ἐφ’ ἱκανόν
  choice: చాలాసేపు
  rationale: ఈ నానుడి గణనీయమైన కాలవ్యవధిని సూచిస్తుంది. ‘చాలాసేపు’ స్పష్టమైన, సహజమైన తెలుగు ప్రయోగం.
- source_word: ὁμιλήσας
  choice: వారితో మాట్లాడిన తర్వాత
  rationale: ὁμιλέω ఇక్కడ సుదీర్ఘ సంభాషణ లేదా మాటలాడడాన్ని సూచిస్తుంది. సందర్భంలో ఉన్న సమూహాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘వారితో’ చేర్చబడింది.
- source_word: ἄχρι αὐγῆς
  choice: తెల్లవారేవరకు
  rationale: αὐγή అంటే వేకువ లేదా తెల్లవారే సమయం. ‘తెల్లవారేవరకు’ కాలపరిమితిని సహజంగా తెలియజేస్తుంది.
- source_word: οὕτως ἐξῆλθεν
  choice: అతడు అక్కడి నుంచి బయలుదేరాడు
  rationale: ἐξῆλθεν వెళ్లిపోవడం లేదా బయలుదేరడాన్ని సూచిస్తుంది. οὕτως ముందున్న సంఘటనల క్రమంతో ఈ బయలుదేరడాన్ని అనుసంధానిస్తుంది; తెలుగులో ‘తర్వాత’ అనే క్రమసూచనతో ఆ సంబంధం సహజంగా వ్యక్తమవుతుంది. ‘అక్కడి నుంచి’ సందర్భానుగుణంగా బయలుదేరడాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: κλάσας τὸν ἄρτον అనే మాట ప్రభువు భోజనాన్ని స్పష్టంగా సూచిస్తుందా?
  choice: ఎటువంటి ఆచార సంబంధ వివరణను జోడించకుండా ‘రొట్టెను విరిచి’ అని తటస్థంగా అనువదించబడింది.
  alternative: దీనిని ప్రభువు భోజనానికి సూచనగా భావించడం; లేదా సాధారణ భోజనం లేదా సహభోజనంగా అర్థం చేసుకోవడం.
  rationale: అపొస్తలుల కార్యములలో ఈ పదబంధానికి ప్రభువు భోజనంతో సంబంధమైన ప్రతిధ్వని ఉండవచ్చు. అయితే ఈ వాక్యం మాత్రమే దానిని నిర్బంధంగా నిర్ధారించదు. కాబట్టి మూలంలోని వేదాంతపరమైన అనిశ్చితి నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని సంఘటనల క్రమం, కాలవ్యవధి, భోజనానికి సంబంధించిన అర్థసందిగ్ధత నిలుపబడ్డాయి. పాదసూచిక గుర్తులు అవి వివరించే పదబంధాల వెంటనే ఉంచబడ్డాయి.
