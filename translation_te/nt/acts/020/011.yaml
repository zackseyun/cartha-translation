  to: అతడు పైకి వెళ్లి, రొట్టెను విరిచి[a] తిన్నాడు[b]. ఆ తర్వాత తెల్లవారేవరకు చాలాసేపు మాట్లాడి, అప్పుడు బయలుదేరాడు.
