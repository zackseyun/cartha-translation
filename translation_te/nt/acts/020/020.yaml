id: ACT.20.20
reference: Acts 20:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς οὐδὲν ὑπεστειλάμην τῶν συμφερόντων τοῦ μὴ ἀναγγεῖλαι ὑμῖν καὶ διδάξαι ὑμᾶς δημοσίᾳ καὶ κατ’ οἴκους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/020.yaml
  text: how I did not shrink back from declaring to you anything that was profitable and teaching you publicly and from house to house,[a]
translation:
  language: te
  text: మీకు ప్రయోజనకరమైనదేదీ మీకు ప్రకటించకుండా, బహిరంగంగానూ ఇంటింటికీ మీకు బోధించకుండా నేను వెనుకాడలేదు ఎలా అనే విషయం మీకు తెలుసు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీకు మేలు చేసే దేనినీ మీకు తెలియజేయకుండా, బహిరంగంగానూ ఇంటింటికీ మీకు బోధించకుండా నేను వెనక్కి తగ్గలేదు.”
    reason: ‘వెనుకాడలేదు/వెనక్కి తగ్గలేదు,’ ‘ప్రయోజనకరమైన/మేలు చేసే,’ ‘ప్రకటించటం/తెలియజేయటం’ అనే సాధ్యమైన పదప్రయోగ భేదాలను చూపించడానికి.
lexical_decisions:
- source_word: ὑπεστειλάμην
  choice: వెనుకాడలేదు
  rationale: మధ్యమ ప్రయోగంలోని ὑποστέλλω ఇక్కడ తాను వెనక్కి తగ్గడం లేదా ఏదైనా చేయకుండా తనను తాను నిలిపివేసుకోవడం అనే భావాన్ని ఇస్తుంది. ‘వెనుకాడలేదు’ ఆధునిక తెలుగులో సహజంగా ఉండి, ప్రకటించడాన్ని నిలిపివేయలేదనే సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: τῶν συμφερόντων
  choice: ప్రయోజనకరమైనదేదీ
  rationale: συμφέρω నుండి వచ్చిన ఈ రూపం మేలు చేసే, ఉపయోగకరమైన విషయాలను సూచిస్తుంది. ‘ప్రయోజనకరమైనది’ ఆధ్యాత్మిక ప్రయోజనానికే పరిమితం చేయకుండా మూలంలోని విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: ప్రకటించకుండా ... వెనుకాడలేదు
  rationale: μήతో కూడిన ఆర్టిక్యులర్ ఇన్ఫినిటివ్, పౌలు దేనిని చేయకుండా వెనుకాడలేదో తెలియజేస్తుంది. తెలుగు వాక్యనిర్మాణంలో ద్వినిషేధ భావాన్ని సహజంగా వ్యక్తం చేయడానికి ఈ నిర్మాణం ఉపయోగించబడింది.
- source_word: ἀναγγεῖλαι
  choice: ప్రకటించడం
  rationale: ἀναγγέλλω తెలియజేయడం, ప్రకటించడం అనే అర్థాలిస్తుంది. బోధించడంతో అనుసంధానమైన పరిచర్య సందర్భంలో ‘ప్రకటించడం’ సముచితం.
- source_word: διδάξαι
  choice: బోధించడం
  rationale: διδάσκω యొక్క సాధారణ అర్థం ‘బోధించడం.’ ప్రకటించడం మరియు బోధించడం అనే రెండు సంబంధిత కార్యాలను వేరుగా ఉంచుతుంది.
- source_word: δημοσίᾳ
  choice: బహిరంగంగా
  rationale: ఈ క్రియావిశేషణ రూపం ప్రజల సమక్షంలో, అందరికీ తెరిచి ఉన్న సందర్భాలను సూచిస్తుంది. ‘బహిరంగంగా’ ఆధునిక ప్రామాణిక తెలుగులో సహజం.
- source_word: κατ’ οἴκους
  choice: ఇంటింటికీ వెళ్లి
  rationale: κατάతో బహువచన అక్యూసేటివ్ ఇక్కడ పంపిణీ భావాన్ని, అంటే ఒక్కో ఇంటిలో జరిగే పరిచర్యను సూచిస్తుంది. ‘ఇంటింటికీ వెళ్లి’ ఆ పునరావృత వ్యక్తిగత పరిచర్య భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ὡς
  choice: '...అనీ'
  rationale: సందర్భంలో ὡς పౌలు వారు గుర్తుంచుకోవాల్సిన విధానాన్ని లేదా విషయాన్ని పరిచయం చేస్తుంది. ముందరి వాక్యంతో సహజంగా కలిసేలా తెలుగులో పరోక్ష వాక్యాంతమైన ‘అనీ’ ఉపయోగించబడింది.
theological_decisions:
- issue: ‘ప్రయోజనకరమైన’ అనే పదం యొక్క పరిధి
  choice: వినేవారికి మేలు చేసే విషయాలు అనే విస్తృత భావాన్ని నిలుపడం
  alternative: ‘ఆధ్యాత్మికంగా మేలు చేసే ప్రతిదీ’ అని స్పష్టీకరించడం
  rationale: సందర్భం ఆధ్యాత్మిక, కాపరి పరిచర్యను సూచించినప్పటికీ, మూలపదం సాధారణంగా మేలు చేసే లేదా ఉపయోగకరమైనదనే విస్తృత భావాన్ని కలిగి ఉంది. ప్రధాన పాఠ్యంలో అదనపు సిద్ధాంతపరమైన పరిమితిని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ఈ వచనం ముందరి సందర్భంపై ఆధారపడినందున, ὡςను స్వతంత్ర ‘ఎలా’గా కాక తెలుగు పరోక్ష వాక్య నిర్మాణంలోని ‘అనీ’తో సహజంగా అనుసంధానించాం. ‘ఇంటింటికీ వెళ్లి’ పంపిణీ భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
