revisions:
- from: మీకు ప్రయోజనకరమైనదేదీ ప్రకటించకుండా నేను వెనుకాడలేదనీ, బహిరంగంగానూ ఇంటింటికీ వెళ్లి మీకు బోధించాననీ మీకు తెలుసు.[a]
  to: మీకు ప్రయోజనకరమైనదేదీ మీకు ప్రకటించకుండా, బహిరంగంగానూ ఇంటింటికీ మీకు బోధించకుండా నేను వెనుకాడలేదు ఎలా అనే విషయం మీకు తెలుసు.[a]
  rationale: 'స్వతంత్రంగా చేర్చిన “మీకు తెలుసు”ను తొలగించకుండా పూర్వసందర్భ అనుసంధానాన్ని కాపాడేందుకు “ఎలా అనే విషయం మీకు తెలుసు” అనడం సరైనది కాదు, ఎందుకంటే అది ఇంకా మూలంలో లేని పదాలను చేర్చుతుంది. కాబట్టి సందర్భాధారిత ὡςను తెలుగులో వాక్యారంభ “ఎలా”గా ఉంచడం ఉత్తమం. పూర్తి సవరణ పాఠ్యం ఇలా ఉండాలి: “ఎలా అంటే, మీకు ప్రయోజనకరమైనదేదీ మీకు ప్రకటించకుండా, బహిరంగంగానూ ఇంటింటికీ మీకు బోధించకుండా నేను వెనుకాడలేదు.[a]” ఇది పూర్వవచనంతో అనుసంధానమయ్యే ఖండవాక్య స్వభావాన్ని, అలాగే రెండు క్రియలపై వర్తించే ‘వెనుకాడలేదు’ను కాపాడుతుంది.'
