id: ACT.20.16
reference: Acts 20:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀κεκρίκει γὰρ ὁ Παῦλος παραπλεῦσαι τὴν Ἔφεσον, ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι ἐν τῇ Ἀσίᾳ, ἔσπευδεν γὰρ εἰ δυνατὸν ⸀εἴη αὐτῷ τὴν ἡμέραν τῆς πεντηκοστῆς γενέσθαι εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/016.yaml
  text: For Paul had decided to sail past Ephesus[a], so that he might not have to spend time in Asia; for he was hurrying to be in Jerusalem, if possible[b], on the day of Pentecost.
translation:
  language: te
  text: పౌలు ఆసియాలో సమయం గడపవలసి రాకుండా ఎఫెసును దాటి ఓడలో వెళ్లాలని ముందే నిర్ణయించుకున్నాడు[a]. ఎందుకంటే, సాధ్యమైతే[b] పెంతెకొస్తు రోజున యెరూషలేములో ఉండాలని అతడు త్వరపడుతున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘ఆసియా’ అంటే ఆధునిక ఆసియా ఖండం కాదు; ఆసియా మైనరు పశ్చిమ ప్రాంతంలో ఉన్న రోమా పరిపాలనా ప్రాంతం.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘సాధ్యమైతే పెంతెకొస్తు రోజున యెరూషలేముకు చేరుకోవాలని.’ గ్రీకు ప్రయోగం ఆ రోజున అక్కడ ఉండడాన్ని గానీ, ఆ రోజున అక్కడికి చేరుకోవడాన్ని గానీ నొక్కి చెప్పవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: κεκρίκει
  choice: ముందే నిర్ణయించుకున్నాడు
  rationale: పూర్వభూతకాల భావాన్ని, కథలోని ఈ ప్రయాణానికి ముందే పౌలు స్థిరమైన నిర్ణయం తీసుకున్నాడనే అర్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: παραπλεῦσαι τὴν Ἔφεσον
  choice: ఎఫెసును దాటి ఓడలో వెళ్లాలని
  rationale: ఎఫెసులో ఆగకుండా సముద్రమార్గంలో దాని పక్కగా వెళ్లడమనే భావాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι
  choice: సమయం గడపవలసి రాకుండా
  rationale: అక్కడ కాలం వెచ్చించాల్సిన పరిస్థితి ఏర్పడకుండా ఉండాలనే ప్రయోజనార్థక వాక్యభావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: ఆసియాలో
  rationale: మూలంలోని భౌగోళిక నామాన్ని ప్రధాన పాఠ్యంలో ఉంచి, అది ఆధునిక ఖండం కాదని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: ἔσπευδεν
  choice: త్వరపడుతున్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న ఆతురతను, ప్రయాణ సందర్భంలోని వేగాన్ని తెలియజేస్తుంది.
- source_word: εἰ δυνατὸν εἴη αὐτῷ
  choice: సాధ్యమైతే
  rationale: సంభావ్యతను తెలిపే గ్రీకు ప్రయోగానికి సంక్షిప్తమైన, సహజమైన తెలుగు సమానం.
- source_word: τὴν ἡμέραν τῆς πεντηκοστῆς
  choice: పెంతెకొస్తు రోజున
  rationale: పండుగ దినాన్ని సూచించే కాలప్రయోగాన్ని నేరుగా, తెలుగు బైబిలు పాఠకులకు పరిచితమైన పేరుతో అందిస్తుంది.
- source_word: γενέσθαι εἰς Ἱεροσόλυμα
  choice: యెరూషలేములో ఉండాలని
  rationale: ఆ రోజున అక్కడ ఉండాలనే ఉద్దేశాన్ని సహజంగా అందిస్తుంది; అదే గ్రీకు ప్రయోగం ‘ఆ రోజున అక్కడికి చేరుకోవడం’ అనే భావాన్నీ అనుమతిస్తుందని పాదటిప్పణి కాపాడుతుంది.
- source_word: Ἱεροσόλυμα
  choice: యెరూషలేము
  rationale: ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన స్థలనామ రూపం.
- source_word: πεντηκοστῆς
  choice: పెంతెకొస్తు
  rationale: కొత్త నిబంధనలో స్థిరపడిన పండుగ పేరుకు తెలుగులో సుపరిచితమైన రూపం.
theological_decisions:
- issue: పెంతెకొస్తు రోజుకు సంబంధించిన పౌలు లక్ష్యం
  choice: పెంతెకొస్తు రోజున యెరూషలేములో ఉండాలని
  alternative: పెంతెకొస్తు రోజున యెరూషలేముకు చేరుకోవాలని
  rationale: γενέσθαι εἰς Ἱεροσόλυμα అనే ప్రయోగం ఆ రోజున అక్కడ ఉండడాన్ని లేదా ఆ రోజున అక్కడికి చేరడాన్ని ఉద్దేశించవచ్చు. ప్రధాన పాఠ్యం మొదటి భావాన్ని ఎంచుకుంటుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచి నిజమైన అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘సమయం గడపవలసి రాకుండా’ అనే రూపం మూలంలోని ప్రయోజనార్థక భావాన్ని అక్షరానువాదపు అసహజత లేకుండా అందిస్తుంది. ప్రధాన పాఠ్యంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోలుతున్నాయి.
