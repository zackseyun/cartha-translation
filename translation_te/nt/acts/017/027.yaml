source:
  edition: SBLGNT
  text: ζητεῖν τὸν ⸀θεὸν εἰ ἄρα γε ψηλαφήσειαν αὐτὸν καὶ εὕροιεν, καί γε οὐ μακρὰν ἀπὸ ἑνὸς ἑκάστου ἡμῶν ὑπάρχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/027.yaml
  text: that they should seek God[a], if perhaps they might grope for him and find him—though indeed he is not far from each one of us.
translation:
  language: te
  text: వారు దేవుణ్ణి వెదకాలని—ఒకవేళ ఆయనను తడుముతూ వెదికి కనుగొంటారేమో అని—అయినా నిజానికి ఆయన మనలో ప్రతి ఒక్కరి నుండి దూరంగా లేడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητεῖν
  choice: వెదకాలని
  rationale: ముందటి వాక్యభాగంపై ఆధారపడిన ఈ క్రియారూపం ఉద్దేశాన్ని లేదా ఫలితాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘వెదకాలని’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: τὸν θεόν
  choice: దేవుణ్ణి
  rationale: ఇక్కడ నిర్దిష్టంగా దేవుడే కర్మగా సూచించబడ్డాడు; తెలుగులో సహజమైన కర్మరూపం వాడబడింది.
- source_word: εἰ ἄρα γε
  choice: ఒకవేళ … ఏమో అని
  rationale: ఈ పదసమూహంలోని అనిశ్చితి, సంభావ్యత రెండింటినీ తెలుగు సహజ ప్రయోగంతో వ్యక్తం చేస్తుంది.
- source_word: ψηλαφήσειαν
  choice: ఆయన కోసం తడుముతూ
  rationale: స్పష్టంగా కనిపించని స్థితిలో స్పర్శ ద్వారా వెదికే చిత్రాన్ని ఈ క్రియ కలిగిస్తుంది. ‘తడుముతూ’ మానవ అవగాహన పరిమితిని సూచించే ఆ రూపకాన్ని నిలుపుతుంది.
- source_word: καὶ εὕροιεν
  choice: ఆయనను కనుగొంటారేమో
  rationale: ముందటి క్రియతో సమన్వయమైన సంభావ్య భావాన్ని ‘ఏమో’ ద్వారా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καί γε
  choice: అయినా నిజానికి
  rationale: మనుషుల అనిశ్చిత అన్వేషణకు విరుద్ధంగా దేవుని వాస్తవ సమీపాన్ని నొక్కిచెప్పే concessive భావాన్ని నిలుపుతుంది.
- source_word: οὐ μακρὰν
  choice: దూరంగా లేడు
  rationale: మూలంలోని నిషేధాత్మక స్థానసంబంధ భావానికి నేరుగా, సహజంగా సరిపోతుంది.
- source_word: ἀπὸ ἑνὸς ἑκάστου ἡμῶν
  choice: మనలో ప్రతి ఒక్కరికీ
  rationale: ἑνὸς ἑκάστου లోని వ్యక్తిగత, పంపిణీ ప్రాధాన్యాన్ని ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: ὑπάρχοντα
  choice: ఆయన … లేడు
  rationale: దేవుడు నిజంగా దూరంలో లేడనే ఉనికి/స్థితి భావాన్ని తెలుగులో పరిమిత క్రియతో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుని సమీపత మరియు మానవ అన్వేషణలోని అనిశ్చితి
  choice: ‘ఒకవేళ … తడుముతూ … కనుగొంటారేమో’ అనే అనిశ్చితిని, ‘అయినా నిజానికి ఆయన … దూరంగా లేడు’ అనే దేవుని సమీపతను రెండింటినీ నిలిపాము.
  alternative: తడుమడం అనే రూపకాన్ని తొలగించి కేవలం ‘వెదికి కనుగొనేలా’ అని సులభీకరించడం.
  rationale: గ్రీకు వాక్యం మానవ అవగాహన పరిమితినీ దేవుని నిజమైన సమీపతనూ కలిపి ఉంచుతుంది. అన్వేషణను నిశ్చిత విజయంగా గానీ వ్యర్థ ప్రయత్నంగా గానీ మార్చకుండా ఆ ఉద్రిక్తతను కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనా గౌరవప్రదమైన శైలి. ఈ వచనం ముందటి వాక్యంపై వ్యాకరణపరంగా ఆధారపడినందున ‘వెదకాలని’ అనే అనుసంధాన రూపం నిలుపబడింది.
