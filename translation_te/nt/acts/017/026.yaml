  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐποίησέν τε ἐξ ⸀ἑνὸς πᾶν ἔθνος ἀνθρώπων κατοικεῖν ἐπὶ ⸂παντὸς προσώπου⸃ τῆς γῆς, ὁρίσας προστεταγμένους καιροὺς καὶ τὰς ὁροθεσίας τῆς κατοικίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/026.yaml
  text: And he made from one man every nation of mankind to live on the whole face of the earth[a], having determined their appointed times and the boundaries of their dwelling place[b],
translation:
  language: te
  text: ఆయన ఒక్కరి నుంచే[a] మానవుల ప్రతి జాతినీ చేసి, వారు భూమి అంతటా నివసించేలా చేశాడు. వారి నియమిత కాలాలనూ[b], వారి నివాస ప్రాంతాల సరిహద్దులనూ ఆయన నిర్ణయించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో “ఒక్కరి నుంచే” అనే దానికి బదులు “ఒకే రక్తం నుంచి” అని ఉంది. ప్రధాన పాఠం SBLGNTలోని “ఒక్కరి నుంచి” అనే పాఠాన్ని అనుసరిస్తుంది.
    reason: textual_variant
  - marker: b
    text: లేదా, “వారికి నిర్ణయించిన కాలాలను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησέν
  choice: చేశాడు
  rationale: ποιέω యొక్క విస్తృత భావాన్ని నిలుపుతూ, సృష్టి విధానాన్ని అవసరానికి మించి నిర్దిష్టం చేయకుండా సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τε
  choice: వాక్యప్రవాహంలో ప్రత్యేక పదంగా అనువదించలేదు
  rationale: τέ ముందున్న వాదనతో ఈ వాక్యాన్ని అనుసంధానించే కణం. తెలుగు సందర్భంలో ఆ అనుసంధానం వాక్యప్రవాహం ద్వారానే స్పష్టమవుతుంది.
- source_word: ἐξ ἑνὸς
  choice: ఒక్కరి నుంచే
  rationale: గ్రీకు పాఠంలో ఉన్న ‘ఒకటి/ఒక్కరు’ అనే సంక్షిప్తతను సాధ్యమైనంతవరకు నిలుపుతుంది; మానవ మూలాన్ని సూచించేందుకు తెలుగు వ్యక్తివాచక రూపం సహజంగా ఉంటుంది, అయితే ‘మనిషి’ లేదా ‘పూర్వికుడు’ అని మరింత నిర్దిష్టం చేయదు.
- source_word: πᾶν ἔθνος ἀνθρώπων
  choice: మానవుల ప్రతి జాతినీ
  rationale: ἔθνος ను ‘జాతి’గా, ἀνθρώπων ను ఆ జాతులన్నీ మానవ సమూహాలనే సూచించే సంబంధంగా అందిస్తుంది; సమస్త మానవజాతి అనే భావంలో వేర్వేరు ప్రజాసమూహాల ప్రత్యేకతను చెరపదు.
- source_word: κατοικεῖν
  choice: నివసించేలా చేశాడు
  rationale: అనంతక్రియలోని ఫలిత/ఉద్దేశ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπὶ παντὸς προσώπου τῆς γῆς
  choice: భూమి అంతటా
  rationale: గ్రీకు నుడికారమైన ‘భూమి ముఖమంతటా’ అనే భావాన్ని సాధారణ ఆధునిక పాఠకులకు సహజంగా, స్పష్టంగా అందిస్తుంది.
- source_word: ὁρίσας
  choice: నిర్ణయించాడు
  rationale: కాలాలు, సరిహద్దులు దేవునిచేత నిర్దేశించబడ్డాయనే పరిమితి నిర్ణయ భావాన్ని తెలియజేస్తుంది.
- source_word: προστεταγμένους καιρούς
  choice: వారి నియమిత కాలాలు
  rationale: καιροί లోని ప్రత్యేక కాలపరిమాణాలు లేదా ఋతువుల భావాన్ని ‘కాలాలు’ నిలుపుతుంది; προστεταγμένους లోని నియామక భావాన్ని ‘నియమిత’ అందిస్తుంది. ‘వారి’ అనేది సందర్భం నుంచి స్పష్టీకరించబడింది.
- source_word: ὁροθεσίας
  choice: సరిహద్దులు
  rationale: నివాస విస్తీర్ణానికి నిర్ణయించిన హద్దులను సహజమైన భౌగోళిక పదంతో వ్యక్తపరుస్తుంది.
- source_word: τῆς κατοικίας αὐτῶν
  choice: వారి నివాస ప్రాంతాల
  rationale: గ్రీకు ఏకవచనం సమూహార్థకంగా ఉన్నందున, ప్రతి జాతికి సంబంధించిన నివాస స్థలాలను తెలుగులో సహజమైన బహువచనంతో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ἐξ ἑνὸς లో సూచితమైన మూల వ్యక్తిని ఎంతవరకు స్పష్టం చేయాలి
  choice: ఒక్కరి నుంచే
  alternative: ఒక మనిషి నుంచే / ఒక పూర్వికుని నుంచే
  rationale: SBLGNT పాఠంలో ‘రక్తం’ లేదా ‘మనిషి’ అనే నామవాచకం లేదు. ‘ఒక్కరి’ అనేది మానవ వ్యక్తిని సహజంగా సూచించినా, అతన్ని ‘మనిషి’ లేదా ‘పూర్వికుడు’ అని వ్యాఖ్యానాత్మకంగా మరింత నిర్దిష్టం చేయదు; అందువల్ల మానవాళి ఏకమూల భావాన్నీ మూలపాఠపు సంక్షిప్తతనూ కాపాడుతుంది.
- issue: కాలాలు దేవునిచేత నియమించబడ్డాయనే భావం
  choice: వారి నియమిత కాలాలు
  alternative: వారికోసం నిర్ణయించిన కాలాలు
  rationale: ప్రధాన పాఠం గ్రీకు కృదంతంలోని నియామక భావాన్ని సంక్షిప్తంగా నిలుపుతుంది. ప్రత్యామ్నాయం ఆ సంబంధాన్ని విప్పి చెబుతుంది గానీ, మూలంలో లేని ఉద్దేశార్థాన్ని కొంత బలంగా వినిపించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘భూమి అంతటా’ వంటి సహజ నుడికారాన్ని ఎంచుకుని, ‘ఒక్కరి నుంచే’ ద్వారా మూలపాఠంలోని సంక్షిప్తతను మరియు నిజమైన వ్యాఖ్యాన విస్తృతిని నిలిపాం. రెండు పాదాలుగా విభజించడం తెలుగు పఠనసౌలభ్యానికి ఉపయోగపడినా, రెండవ పాదంలోని కర్తను మళ్లీ పేర్కొనడం ద్వారా గ్రీకు కృదంత సంబంధం స్పష్టంగా ఉంచబడింది.
