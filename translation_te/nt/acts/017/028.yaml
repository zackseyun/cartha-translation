id: ACT.17.28
reference: Acts 17:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν αὐτῷ γὰρ ζῶμεν καὶ κινούμεθα καὶ ἐσμέν, ὡς καί τινες τῶν καθ’ ὑμᾶς ποιητῶν εἰρήκασιν· Τοῦ γὰρ καὶ γένος ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/028.yaml
  text: For in him we live and move and exist, as even some of your own poets have said, ‘For we also are his offspring.’
translation:
  language: te
  text: ఎందుకంటే ఆయనలో మనం జీవిస్తున్నాం, కదులుతున్నాం, ఉనికిలో ఉన్నాం. మీ కవుల్లో కొందరు కూడా చెప్పినట్లుగా, ‘ఎందుకంటే మనం కూడా ఆయన సంతానమే.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: ఆయనలోనే
  rationale: దేవుని వ్యక్తిగత సూచనను నిలుపుతూ, ἐν యొక్క పరిధి/ఆధార భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘నే’ సందర్భంలోని ఉద్ఘాటనను అందిస్తుంది.
- source_word: ζῶμεν καὶ κινούμεθα καὶ ἐσμέν
  choice: మనం జీవిస్తున్నాం, కదులుతున్నాం, ఉనికిలో ఉన్నాం
  rationale: మూడు సమాంతర క్రియలను విడివిడిగా నిలుపుతుంది. ἐσμέν ను కేవలం ‘ఉన్నాం’గా కాక ‘ఉనికిలో ఉన్నాం’గా ఇవ్వడం ద్వారా ముందున్న క్రియలతో భేదం స్పష్టమవుతుంది.
- source_word: τινες τῶν καθ’ ὑμᾶς ποιητῶν
  choice: మీ కవుల్లో కొందరు
  rationale: καθ’ ὑμᾶς యొక్క ‘మీకు చెందిన/మీ వర్గంలోని’ భావాన్ని సహజంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: γένος
  choice: సంతానం
  rationale: ఉద్ధరించిన కవితా వాక్యంలో దేవునితో వంశ/ఉద్భవ సంబంధాన్ని సాధారణ పాఠకుడికి సహజంగా తెలియజేస్తుంది; ఇక్కడ ‘జాతి’ అనేది అపార్థానికి దారితీయవచ్చు.
theological_decisions:
- issue: ‘ఆయనలో’ అనే మాట సూచించే సంబంధ స్వభావం
  choice: మూలంలోని విస్తృతమైన భావాన్ని వివరణ లేకుండా నిలుపడం
  alternative: ‘ఆయన శక్తివల్ల’ లేదా ‘ఆయన మీద ఆధారపడి’ అని స్పష్టీకరించడం
  rationale: ἐν αὐτῷ జీవితం, చలనం, ఉనికికి దేవుడే పరిధి లేదా ఆధారం అనే భావాన్ని కలిగి ఉండవచ్చు; ఒకే సిద్ధాంతపరమైన వివరణకు దాన్ని పరిమితం చేయలేదు.
- issue: ‘ఆయన సంతానం’ యొక్క దైవశాస్త్రీయ పరిధి
  choice: కవితా ఉద్ధరణను యథాతథ సంబంధ భాషతో అనువదించడం
  alternative: ‘ఆయన సృష్టించినవాళ్లం’ అని వివరణాత్మకంగా మార్చడం
  rationale: γένος లోని నిజమైన వంశ/సంతతి రూపకాన్ని నిలుపుతుంది; ఈ వాక్యమే రక్షణాత్మక దత్తత లేదా దైవత్వాన్ని బోధిస్తున్నట్లు అదనపు అర్థం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. కవితా ఉద్ధరణకు తెలుగు ఏక ఉద్ధరణ చిహ్నాలు వాడబడ్డాయి.
