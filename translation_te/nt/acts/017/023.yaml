id: ACT.17.23
reference: Acts 17:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διερχόμενος γὰρ καὶ ἀναθεωρῶν τὰ σεβάσματα ὑμῶν εὗρον καὶ βωμὸν ἐν ᾧ ἐπεγέγραπτο· Ἀγνώστῳ θεῷ. ⸀ὃ οὖν ἀγνοοῦντες εὐσεβεῖτε, ⸀τοῦτο ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/023.yaml
  text: For as I was passing through and observing your objects of worship[a], I even found an altar on which had been inscribed, ‘To an unknown god.’ Therefore[b], what you worship in ignorance—this I proclaim to you.
translation:
  language: te
  text: ఎందుకంటే, నేను తిరుగుతూ మీ పూజావస్తువులను జాగ్రత్తగా గమనిస్తుండగా, ‘తెలియని ఒక దేవునికి’[a] అని చెక్కి ఉన్న ఒక బలిపీఠాన్ని కూడా కనుగొన్నాను. కాబట్టి, మీరు తెలియక దేనిని పూజిస్తున్నారో,[b] దానినే నేను మీకు ప్రకటిస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ తెలియని దేవునికి.’ గ్రీకు శాసనంలో నిర్దిష్ట ఉపపదం లేదు; కాబట్టి ‘ఒక’ అనే అనిర్దిష్ట భావం లేదా సందర్భానుగుణమైన నిర్దిష్ట భావం రెండూ సాధ్యమే.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మీరు తెలియక ఎవరిని పూజిస్తున్నారో.’ గ్రీకులో నపుంసక సంబంధసర్వనామం ఉంది; అందువల్ల ప్రధాన పాఠంలో ‘దేనిని’ అని ఆరాధనావిషయాన్ని సూచించే రూపం ఉంచబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: διερχόμενος
  choice: నేను మీ నగరంలో తిరుగుతూ
  rationale: వర్తమాన కృదంతం పౌలు అక్కడ సంచరిస్తున్న నేపథ్యాన్ని సూచిస్తుంది. తెలుగులో సహజత కోసం సందర్భంలో అంతర్భూతమైన నగరాన్ని స్పష్టం చేశాం.
- source_word: ἀναθεωρῶν
  choice: జాగ్రత్తగా గమనిస్తున్నప్పుడు
  rationale: కేవలం చూడడం కాకుండా శ్రద్ధగా పరిశీలించడాన్ని సూచించే భావాన్ని నిలుపుతుంది.
- source_word: τὰ σεβάσματα ὑμῶν
  choice: మీరు పూజించే వస్తువులను
  rationale: మతపరంగా పూజించబడే లేదా గౌరవించబడే వస్తువులను సూచించే విస్తృత పదబంధం; ‘విగ్రహాలు’ లేదా ‘ఆలయాలు’ అని అనవసరంగా సంకుచితం చేయలేదు.
- source_word: βωμὸν
  choice: బలిపీఠాన్ని
  rationale: ఆరాధనా సందర్భంలోని βωμόςకు సాధారణమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: ἐπεγέγραπτο
  choice: చెక్కి ఉన్న
  rationale: బలిపీఠంపై ముందే లిఖించబడిన శాసనాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: Ἀγνώστῳ θεῷ
  choice: తెలియని ఒక దేవునికి
  rationale: గ్రీకులో నిర్దిష్ట ఉపపదం లేదు; అంకిత శాసన భావాన్ని, అనిర్దిష్టతను తెలుగులో ‘ఒక’తో సహజంగా నిలిపింది.
- source_word: ὃ οὖν
  choice: కాబట్టి ... దేనిని ... దానినే
  rationale: οὖν యొక్క నిర్ధారణాత్మక సంబంధాన్ని చూపుతూ, నపుంసక సంబంధసర్వనామమైన ὃ యొక్క వస్తు-సూచనను నిలుపుతుంది.
- source_word: ἀγνοοῦντες
  choice: తెలియకుండానే
  rationale: వారికి తెలియకపోవడం వారి పూజ యొక్క పరిస్థితి లేదా విధానమని సహజంగా వ్యక్తం చేస్తుంది; ‘తెలియని’ అనే శాసనంతో ఉన్న పదబంధ సంబంధాన్నీ నిలుపుతుంది.
- source_word: εὐσεβεῖτε
  choice: పూజిస్తున్నారు
  rationale: ఇక్కడ మతపరమైన భక్తి లేదా ఆరాధనను సూచిస్తుంది; సాధారణ పాఠకునికి ‘పూజించడం’ స్పష్టంగా ఉంటుంది.
- source_word: καταγγέλλω
  choice: ప్రకటిస్తున్నాను
  rationale: ప్రజల ముందర అధికారపూర్వకంగా తెలియజేయడాన్ని సూచించే సరైన తెలుగు పదం.
theological_decisions:
- issue: ὃ అనే నపుంసక సంబంధసర్వనామం యొక్క సూచన
  choice: మీరు ... దేనిని పూజిస్తున్నారో, దానినే
  alternative: మీరు ఎవరిని పూజిస్తున్నారో, ఆయననే
  rationale: గ్రీకు పాఠం వ్యక్తిని సూచించే పుంలింగ రూపం కాకుండా నపుంసక రూపాన్ని వాడుతుంది. అందువల్ల పౌలు మాటను ముందుగానే వ్యక్తీకరించి దాని ధార్మిక ఉద్వేగాన్ని పరిష్కరించకుండా, ఆరాధనావిషయాన్ని సూచించే రూపాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని కృదంతాల వరుసను సహజ తెలుగు ఉపవాక్యాలుగా మార్చాం. అనవసరమైన మతశాఖాపర పదజాలాన్ని నివారించాం.
