id: ACT.17.32
reference: Acts 17:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ ἀνάστασιν νεκρῶν οἱ μὲν ἐχλεύαζον οἱ δὲ εἶπαν Ἀκουσόμεθά σου ⸂περὶ τούτου καὶ πάλιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/032.yaml
  text: When they heard of the resurrection of the dead[a], some mocked, but others said, “We will hear you again about this.”
translation:
  language: te
  text: చనిపోయినవారి పునరుత్థానం గురించి విన్నప్పుడు, కొందరు ఎగతాళి చేశారు. మరికొందరు మాత్రం, “ఈ విషయం గురించి నీవు చెప్పేది మళ్లీ వింటాం” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: విన్నప్పుడు
  rationale: కాలసూచక కృదంత భావాన్ని సహజమైన తెలుగు ఉపవాక్యంగా వ్యక్తం చేస్తుంది. δὲ ఇక్కడ స్వల్ప కథన మలుపును సూచిస్తుంది; దాని వ్యత్యాస భావం తరువాతి ‘మాత్రం’ ద్వారా సందర్భంలో స్పష్టమవుతుంది.
- source_word: ἀνάστασιν νεκρῶν
  choice: చనిపోయినవారి పునరుత్థానం
  rationale: మృతులు తిరిగి లేపబడటాన్ని సూచించే గ్రీకు పదబంధాన్ని సంక్షిప్తంగా, సాధారణ బైబిలు తెలుగులో అందిస్తుంది; ‘మృతులలోనుండి’ అని మార్చి భావాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: కొందరు ... మరికొందరు మాత్రం
  rationale: ప్రేక్షకులలోని రెండు వర్గాల పరస్పర విరుద్ధ స్పందనలను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐχλεύαζον
  choice: ఎగతాళి చేశారు
  rationale: అవహేళనగా నవ్వడం లేదా పరిహసించడం అనే క్రియ భావాన్ని నేరుగా తెలియజేస్తుంది; గ్రీకు అసంపూర్ణ భూతకాలానికి తప్పనిసరిగా లేని ‘మొదలుపెట్టారు’ అనే ఆరంభ భావాన్ని చేర్చదు.
- source_word: Ἀκουσόμεθά σου
  choice: నీవు చెప్పేది ... వింటాం
  rationale: వ్యక్తిని వినడం అనే గ్రీకు నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; వారు పౌలు చెప్పేదాన్ని మళ్లీ వినాలనుకున్నారనే భావం నిలుస్తుంది.
- source_word: περὶ τούτου καὶ πάλιν
  choice: ఈ విషయం గురించి ... మళ్లీ
  rationale: περὶ τούτου యొక్క విషయసూచక భావాన్నీ καὶ πάλιν యొక్క పునరావృత/మరో సందర్భ భావాన్నీ రెండింటినీ ప్రధాన పాఠ్యంలో స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: ἀνάστασιν νεκρῶν అనే పునరుత్థాన పదబంధం యొక్క పరిధి
  choice: చనిపోయినవారి పునరుత్థానం
  alternative: చనిపోయినవారిలోనుండి పునరుత్థానం
  rationale: గ్రీకు పదబంధం చనిపోయినవారికి సంబంధించిన పునరుత్థాన భావాన్ని తెలియజేస్తుంది. ‘వారిలోనుండి’ అని అనువదించడం ద్వారా ఒక ప్రత్యేక వ్యక్తి పునరుత్థానంగా భావాన్ని పరిమితం చేయకుండా మూలంలోని విస్తృతతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. వాక్యాన్ని రెండు భాగాలుగా విభజించడం ద్వారా విరుద్ధ స్పందనలు స్పష్టంగా వినిపిస్తాయి; మతశాఖాపరమైన వివరణ ఏదీ చేర్చలేదు.
