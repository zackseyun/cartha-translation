id: ACT.17.18
reference: Acts 17:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τινὲς δὲ καὶ τῶν Ἐπικουρείων ⸀καὶ Στοϊκῶν φιλοσόφων συνέβαλλον αὐτῷ, καί τινες ἔλεγον· Τί ἂν θέλοι ὁ σπερμολόγος οὗτος λέγειν; οἱ δέ· Ξένων δαιμονίων δοκεῖ καταγγελεὺς εἶναι· ὅτι τὸν Ἰησοῦν καὶ τὴν ἀνάστασιν εὐηγγελίζετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/018.yaml
  text: Some of the Epicurean and Stoic philosophers also engaged with him[a], and some were saying, “What is this babbler trying to say?” But others said[d][c][b], “He seems to be a proclaimer of foreign deities,” because he was proclaiming the good news about Jesus and the resurrection.
translation:
  language: te
  text: ఎపికూరీయ, స్తోయిక తత్వవేత్తలలో కొందరు కూడా అతనితో చర్చకు దిగారు[a]. వారిలో కొందరు, “ఈ వదరుబోతు[b] ఏమి చెప్పాలని చూస్తున్నాడు?” అన్నారు. మరికొందరు, “ఇతడు పరాయి దేవతలను ప్రకటించేవాడిలా ఉన్నాడు[c]” అన్నారు. ఎందుకంటే అతడు యేసును గురించి, పునరుత్థానాన్ని గురించి[d] శుభవార్త ప్రకటిస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతనితో వాదించారు’ లేదా ‘అతనితో సంభాషించారు’; గ్రీకు క్రియ చురుకైన చర్చను లేదా వివాదాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘వదరుబోతు’ అని అనువదించిన గ్రీకు అవమానపూర్వక పదానికి అక్షరార్థంగా ‘విత్తనాలు ఏరుకునేవాడు’ అనే నేపథ్యం ఉంది. ఇతరుల ఆలోచనల ముక్కలను ఏరుకొని మళ్లీ వల్లించే వ్యక్తిని హేళనగా ఇలా పిలిచేవారు.
    reason: cultural_note
  - marker: c
    text: లేదా ‘పరాయి దైవిక సత్తలు,’ ‘తెలియని దేవుళ్లు,’ లేదా అక్షరార్థానికి దగ్గరగా ‘పరాయి దయ్యాలు.’ ఇక్కడ వారు తమ అన్యమత భావప్రపంచం ప్రకారం తెలియని దైవిక సత్తలను ఉద్దేశించి ఉండవచ్చు; తరువాతి క్రైస్తవ అర్థంలోని దుష్టాత్మలను తప్పనిసరిగా ఉద్దేశించలేదు.
    reason: alternative_reading
  - marker: d
    text: పౌలు ‘యేసు’ను, ‘పునరుత్థానం’ను ప్రకటించడంతో, అథేనీయులు ‘పునరుత్థానం’ అనే మాటను మరో దేవత పేరుగా అపార్థం చేసుకొని ఉండవచ్చని కొందరు భావిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέβαλλον αὐτῷ
  choice: అతనితో చర్చకు దిగారు
  rationale: ఈ సందర్భంలో క్రియ చర్చించడం లేదా వాదించడం అనే భావాన్ని ఇవ్వగలదు. ‘చర్చకు దిగారు’ అనేది పరస్పర సంభాషణను సూచిస్తూనే అది తప్పనిసరిగా శత్రుత్వపూర్వక వాదన అని నిర్ణయించదు.
- source_word: σπερμολόγος
  choice: వదరుబోతు
  rationale: ఇది తృణీకారపూర్వక సంబోధన. ఇతరుల ఆలోచనల ముక్కలను ఏరుకొని వల్లించే వ్యక్తి అనే సాంస్కృతిక భావాన్ని ప్రధాన వాక్యంలో సహజమైన అవమానార్థక పదంతో ఇచ్చి, దాని అక్షరార్థ నేపథ్యాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: Τί ἂν θέλοι ... λέγειν
  choice: ఏమి చెప్పాలని చూస్తున్నాడు?
  rationale: ἄνతో కూడిన optative అనిశ్చితమైన, కొంత హేళనతో కూడిన ఊహను వ్యక్తం చేస్తుంది. ఈ తెలుగు ప్రయోగం ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: Ξένων δαιμονίων
  choice: పరాయి దేవతలను
  rationale: అథేనీయుల అన్యమత దృక్కోణంలో δαιμόνια వారికి తెలియని దైవిక సత్తలను సూచిస్తుంది; తరువాతి క్రైస్తవ వాడుకలోని ‘దయ్యాలు’ అనే భావాన్ని ఇక్కడ బలవంతంగా రుద్దకూడదు.
- source_word: καταγγελεὺς
  choice: ప్రకటించేవాడు
  rationale: బహిరంగంగా తెలియజేసే లేదా ప్రకటించే వ్యక్తి అనే అర్థాన్ని సరళమైన ఆధునిక తెలుగులో ఇస్తుంది.
- source_word: εὐηγγελίζετο
  choice: శుభవార్త ప్రకటిస్తున్నాడు
  rationale: సాధారణంగా బోధించడం మాత్రమే కాక, శుభవార్తను తెలియజేయడం అనే క్రియ యొక్క ప్రత్యేక భావాన్ని నిలుపుతుంది.
- source_word: ἀνάστασιν
  choice: పునరుత్థానాన్ని
  rationale: లూకా వివరణలో ఇది పౌలు ప్రకటించిన సందేశ విషయాన్ని సూచించే సాధారణ నామవాచకం; దానిని వ్యక్తీకరించిన దేవత పేరుగా ప్రధాన వాక్యంలో చూపలేదు.
- source_word: Ἐπικουρείων καὶ Στοϊκῶν φιλοσόφων
  choice: ఎపికూరీయులు, స్తోయికులు అయిన తత్వవేత్తలు
  rationale: రెండు తాత్విక పాఠశాలల పేర్లను నిలుపుతూ తెలుగు వాక్య నిర్మాణంలో సహజంగా ఉంటుంది.
theological_decisions:
- issue: అన్యమతస్థుల మాటల్లో δαιμόνια పదానికి అనువాదం
  choice: పరాయి దేవతలు
  alternative: పరాయి దయ్యాలు; తెలియని దేవుళ్లు
  rationale: వక్తలైన అథేనీయుల భావప్రపంచాన్ని ప్రతిబింబించేందుకు ‘దేవతలు’ సరిపోతుంది. ‘దయ్యాలు’ అంటే తరువాతి క్రైస్తవ దుష్టాత్మ భావం అనవసరంగా ప్రవేశించే ప్రమాదం ఉంది.
- issue: ἀνάστασις‌ను వ్యక్తీకరించిన దేవత పేరుగా చూపాలా
  choice: పునరుత్థానం అనే సాధారణ నామవాచకం
  alternative: ‘పునరుత్థానం’ అనే దేవత పేరు అన్నట్లు వ్యక్తీకరించడం
  rationale: గ్రీకు వాక్యంలో లూకా పౌలు సందేశ విషయాన్ని వివరిస్తున్నాడు. అయితే అథేనీయులు దానిని మరో దేవత పేరుగా అపార్థం చేసుకొని ఉండవచ్చనే సాధ్యతను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. తాత్విక పాఠశాలల పేర్లను ప్రాచుర్యంలో ఉన్న తెలుగు లిప్యంతరీకరణతో ఇచ్చాం; మూలంలోని తృణీకారం, అనిశ్చితి, అన్యమత దృక్కోణం నిలిచేలా చూశాం.
