source:
  edition: SBLGNT
  text: ἐπιλαβόμενοί ⸀τε αὐτοῦ ἐπὶ τὸν Ἄρειον Πάγον ἤγαγον, λέγοντες· Δυνάμεθα γνῶναι τίς ἡ καινὴ αὕτη ἡ ὑπὸ σοῦ λαλουμένη διδαχή;
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/019.yaml
  text: So they took hold of him and brought him to the Areopagus, saying, “May we know what this new teaching is that is being spoken by you?”
translation:
  language: te
  text: వారు అతన్ని పట్టుకొని అరేయోపగు[a] వద్దకు తీసుకెళ్లి, “మీరు చెబుతున్న[b] ఈ కొత్త బోధ ఏమిటో మేము తెలుసుకోవచ్చా?” అని అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అరేయోపగు’ అనేది ఆ కొండను లేదా దానితో సంబంధమున్న సభా మండలిని సూచించవచ్చు. దీనికి సంప్రదాయంగా ‘మార్స్ కొండ’ అనే పేరు కూడా ఉంది.
    reason: cultural_note
  - marker: b
    text: మరింత అక్షరార్థంగా, ‘మీ ద్వారా పలకబడుతున్న.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιλαβόμενοί
  choice: పట్టుకొని
  rationale: ఈ క్రియలో శారీరకంగా పట్టుకోవడం లేదా తమ వెంట తీసుకెళ్లడం అనే భావం ఉంది. ‘పట్టుకొని’ అనేది వారి బలమైన చొరవను చూపుతుంది; అయితే దాన్ని అధికారిక అరెస్టుగా అతిగా నిర్దిష్టం చేయదు.
- source_word: τε
  choice: వారు
  rationale: τέ స్వల్ప అనుసంధాన అవ్యయం. తెలుగులో వాక్యప్రవాహం సహజంగా ఉండేందుకు దాన్ని ప్రత్యేక పదంతో అనువదించకుండా కథన అనుసంధానంలో వ్యక్తం చేశాం.
- source_word: ἐπὶ τὸν Ἄρειον Πάγον
  choice: అరేయోపగు వద్దకు
  rationale: గ్రీకు పేరును లిప్యంతరీకరించాం. ‘వద్దకు’ అనే రూపం కొండ/స్థలం లేదా దానితో సంబంధమున్న సభ అనే రెండు సాధ్యార్థాలలో దేనినీ పూర్తిగా నిర్ధారించదు.
- source_word: ἤγαγον
  choice: తీసుకెళ్లి
  rationale: గమ్యస్థానానికి నడిపించడం లేదా తీసుకెళ్లడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: λέγοντες
  choice: అని అడిగారు
  rationale: వారు పలికిన మాట ప్రశ్న రూపంలో ఉన్నందున తెలుగులో ‘అని అడిగారు’ సహజంగా ఉంటుంది; సమకాలిక participle భావం ప్రధాన క్రియతో కలిపి వ్యక్తమవుతుంది.
- source_word: Δυνάμεθα γνῶναι
  choice: మేము తెలుసుకోవచ్చా?
  rationale: ఇది కేవలం సామర్థ్యాన్ని ప్రశ్నించడం కంటే మర్యాదపూర్వకంగా సమాచారం కోరే అభ్యర్థన. ‘తెలుసుకోవచ్చా?’ ఆ స్వరాన్ని సహజంగా అందిస్తుంది.
- source_word: καινὴ
  choice: కొత్త
  rationale: శ్రోతలకు కొత్తగా లేదా కొత్త రకంగా ఉన్నదనే విస్తృత భావాన్ని సరళంగా నిలుపుతుంది.
- source_word: ὑπὸ σοῦ λαλουμένη
  choice: నువ్వు చెబుతున్న
  rationale: గ్రీకులోని కర్మణి నిర్మాణాన్ని తెలుగులో సహజమైన కర్తరి రూపంలో తెలిపాం. మరింత అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: διδαχή
  choice: బోధ
  rationale: మతపరమైన లేదా తాత్త్విక ఉపదేశాన్ని సూచించేందుకు ‘బోధ’ స్పష్టమైన, సాధారణ ఆధునిక తెలుగు పదం; ‘సిద్ధాంతం’ కంటే తక్కువ సాంకేతికమైనది.
theological_decisions:
- issue: పౌలును అరేయోపగుకు తీసుకెళ్లిన విధానంలోని తీవ్రత
  choice: బలమైన చొరవతో పట్టుకొని తీసుకెళ్లడం; తప్పనిసరిగా అధికారిక అరెస్టు కాదు
  alternative: అరెస్టు చేసి తీసుకెళ్లడం; లేదా కేవలం మర్యాదగా ఆహ్వానించడం
  rationale: ἐπιλαμβάνομαι శారీరకంగా పట్టుకోవడాన్ని సూచించగలదు. అయితే సమీప సందర్భంలో బోధ గురించి తెలుసుకోవాలనే ఆసక్తి కనిపిస్తుంది; అందువల్ల చర్యను తగ్గించకుండానే అధికారిక అరెస్టుగా నిర్ణయించలేదు.
- issue: Ἄρειος Πάγος యొక్క సూచన
  choice: ‘అరేయోపగు’ అనే పేరును ఉంచి, అది స్థలమా సభా మండలియా అన్నది ప్రధాన పాఠ్యంలో నిర్ణయించకపోవడం
  alternative: ‘మార్స్ కొండ’ అనే స్థలనామం; లేదా ‘అరేయోపగు సభ’ అనే సంస్థాగత అర్థం
  rationale: ఈ గ్రీకు పదబంధం కొండను గానీ, దానితో సంబంధమున్న మండలిని గానీ సూచించవచ్చు. మూలంలోని చారిత్రక అస్పష్టతను అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడాం. సంభాషణలో సాధారణ ఏకవచనమైన ‘నువ్వు’ను ఉపయోగించాం; గ్రీకు పాఠ్యంలోని ద్వితీయ పురుష ఏకవచనాన్ని నిలిపాం. అరేయోపగు స్థలమా మండలియా అన్న అస్పష్టతను పాదటిప్పణితో సంరక్షించాం.
