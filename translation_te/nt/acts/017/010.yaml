  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘సమాజమందిరం’ అనే పరిచిత పదంతో συναγωγήను ప్రత్యేక యూదు ఆరాధనా-సమాజ స్థలంగా గుర్తించాం. విరామచిహ్నాల మధ్య ‘ఇద్దరినీ’ ఉంచడం ద్వారా τε ... καί బలాన్ని తెలుగులో స్పష్టపరిచాం.
