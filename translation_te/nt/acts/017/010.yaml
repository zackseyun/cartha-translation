    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοὶ
  choice: సహోదరులు
  rationale: గ్రీకు పదంలోని వ్యాకరణపరమైన పుంలింగ బహువచన రూపాన్నీ, విశ్వాసుల మధ్య కుటుంబసంబంధ భావాన్నీ నిలుపుతుంది; సందర్భంలో ఇది విస్తృత విశ్వాస సమాజాన్ని సూచించే అవకాశం ఉంది.
- source_word: εὐθέως
  choice: వెంటనే
  rationale: ఆలస్యం లేకుండా తక్షణమే చర్య తీసుకున్నారనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: διὰ νυκτός
  choice: రాత్రివేళ
  rationale: రాత్రి సమయంలో ప్రయాణానికి పంపారనే కాలసూచక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐξέπεμψαν
  choice: పంపివేశారు
  rationale: ἐκπέμπωలోని ‘బయటకు/దూరంగా పంపడం’ అనే భావాన్ని, ప్రమాదకర పరిస్థితి నుంచి వారిని పంపిన సందర్భానికి తగినట్లుగా అందిస్తుంది.
- source_word: τόν τε Παῦλον καὶ τὸν Σιλᾶν
  choice: పౌలును సీలను—ఇద్దరినీ—
  rationale: τε ... καί నిర్మాణంలోని ‘ఇద్దరినీ’ అనే సమన్వయ బలాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: Βέροιαν
  choice: బెరయకు
  rationale: తెలుగు బైబిలు వాడుకలో పరిచితమైన స్థలనామ రూపాన్ని ఉపయోగిస్తుంది.
- source_word: οἵτινες παραγενόμενοι
  choice: వారు అక్కడికి చేరుకున్నప్పుడు
  rationale: సంబంధసర్వనామం మరియు కాలసూచక కృదంతం కలిగిన కథన కొనసాగింపును సహజమైన తెలుగు ఉపవాక్యంగా అందిస్తుంది.
- source_word: συναγωγὴν τῶν Ἰουδαίων
  choice: యూదుల సమాజమందిరంలోకి
  rationale: గ్రీకు షష్ఠీవిభక్తి నిర్మాణాన్ని పారదర్శకంగా నిలుపుతూ, స్థానిక యూదు సమాజానికి చెందిన సమాజమందిరాన్ని సూచిస్తుంది.
- source_word: ἀπῄεσαν
  choice: వెళ్లారు
  rationale: గమ్యాన్ని సూచించే εἰς పదబంధంతో కలిసి, వారు సమాజమందిరంలోకి వెళ్లిన చర్యను సహజంగా వ్యక్తపరుస్తుంది; గ్రీకు అసంపూర్ణ భూతకాల రూపాన్ని సందర్భానుసారమైన సాధారణ భూతకాలంతో అందిస్తుంది.
theological_decisions:
- issue: మిశ్రమ విశ్వాస సమాజాన్ని సూచించే సందర్భంలో ἀδελφοὶ అనువాదం
  choice: సహోదరులు
  alternative: సహోదర సహోదరీలు; విశ్వాసులు
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం. ఇది సందర్భంలో స్త్రీపురుషులందరినీ కలిగిన విస్తృత విశ్వాస సమాజాన్ని సూచించవచ్చనే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- issue: τῶν Ἰουδαίων అనువాదం
  choice: యూదుల
  alternative: యూదు సమాజమందిరం
  rationale: ఇది బెరయలోని స్థానిక యూదు సమాజానికి చెందిన సమాజమందిరాన్ని గుర్తిస్తుంది; యూదుల గురించి ప్రతికూలమైన ధార్మిక తీర్పును సూచించదు.
