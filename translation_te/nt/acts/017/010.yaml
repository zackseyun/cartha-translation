base_translation:
  language: en
  yaml_path: translation/nt/acts/017/010.yaml
  text: Then the brothers immediately sent both Paul and Silas away by night to Berea[a], and when they arrived[c][b], they went into the synagogue of the Jews.
translation:
  language: te
  text: అయితే సహోదరులు[a] వెంటనే పౌలు, సీలలు ఇద్దరినీ రాత్రివేళ[b] బెరయకు పంపివేశారు. వారు అక్కడికి చేరుకున్నప్పుడు యూదుల సమాజమందిరంలోకి[c] వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సహోదర సహోదరీలు.” గ్రీకులో “సహోదరులు” అని ఉంది; ఈ పదం విస్తృత విశ్వాస సమాజాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “రాత్రి సమయంలో.”
