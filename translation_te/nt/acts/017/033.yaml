  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్తతను, పౌలు సమూహం మధ్యనుంచి నిష్క్రమించిన భావాన్ని కాపాడింది.
