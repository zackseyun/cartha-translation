lexical_decisions:
- source_word: οὕτως
  choice: అలా
  rationale: ఈ సందర్భంలో ఇది అరియొపగు ప్రసంగ ఘట్టాన్ని ముగించే కథన సంధాన పదం. ‘అలా’ సహజమైన ఆధునిక తెలుగులో ‘so/thus’ అనే భావాన్ని నిలుపుతుంది.
- source_word: ὁ Παῦλος
  choice: పౌలు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ἐξῆλθεν
  choice: వెళ్లిపోయాడు
  rationale: ἐξέρχομαι యొక్క ఈ రూపం బయటకు వెళ్లడం లేదా అక్కడి నుంచి నిష్క్రమించడం సూచిస్తుంది. ‘వెళ్లిపోయాడు’ సందర్భానికి సహజంగా ఉండి, అక్కడి నుంచి వెళ్లిన భావాన్ని స్పష్టం చేస్తుంది.
- source_word: ἐκ μέσου αὐτῶν
  choice: వారి మధ్యనుండి
  rationale: సమూహం మధ్య నుంచి లేదా వారి సమక్షం నుంచి వెళ్లడాన్ని సూచించే గ్రీకు నుడికారాన్ని నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
