translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. నిందారోపణలోని బహిరంగ తీవ్రతను ‘ఈడ్చుకొని వచ్చి’, ‘బిగ్గరగా’, ‘అల్లకల్లోలం’ అనే పదాలు నిలుపుతాయి. ‘వీళ్లు’ ప్రత్యక్ష ఆరోపణలోని చూపుడు, తృణీకార ఛాయను సహజంగా వ్యక్తపరుస్తుంది.
