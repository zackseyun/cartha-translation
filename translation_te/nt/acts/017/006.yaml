id: ACT.17.6
reference: Acts 17:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ εὑρόντες δὲ αὐτοὺς ⸀ἔσυρον Ἰάσονα καί τινας ἀδελφοὺς ἐπὶ τοὺς πολιτάρχας, βοῶντες ὅτι Οἱ τὴν οἰκουμένην ἀναστατώσαντες οὗτοι καὶ ἐνθάδε πάρεισιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/006.yaml
  text: But when they did not find them[a], they dragged Jason and some brothers before the city authorities, shouting[c][b], “These men who have turned the world upside down have come here also,”
translation:
  language: te
  text: 'అయితే వారు వారిని కనుగొనలేక, యాసోనును, కొంతమంది సహోదరులను[a] పట్టణాధికారుల[b] ఎదుటకు ఈడ్చుకొని వెళ్లి, బిగ్గరగా ఇలా కేకలు వేశారు: “లోకాన్ని[c] అల్లకల్లోలం చేసిన వీళ్లు ఇక్కడికీ వచ్చారు!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సహోదరులు” అంటే ఇక్కడ తోటి విశ్వాసులు. సందర్భాన్ని బట్టి ఈ పదం స్త్రీలను కూడా కలిగిన విశ్వాస సమాజాన్ని సమూహంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో “పొలితార్కులు” అనే స్థానిక మాసిదోనియా బిరుదు ఉంది; ఇది పట్టణ పరిపాలనా అధికారులను సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా, మరింత అక్షరార్థంగా, “నివాసిత లోకం”; ఈ మాట తెలిసిన నాగరిక ప్రపంచాన్ని, తరచుగా రోమా ప్రపంచాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ εὑρόντες
  choice: వారు వారిని కనుగొనకపోవడంతో
  rationale: μήతో కూడిన భూతకాల కృదంతం ప్రధాన చర్యకు ముందున్న పరిస్థితిని తెలియజేస్తుంది. ఈ రూపం ఆ సందర్భార్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἔσυρον
  choice: ఈడ్చుకొని వచ్చి
  rationale: σύρω బలవంతంగా లాగడాన్ని సూచిస్తుంది. ‘ఈడ్చుకొని వచ్చి’ అనేది శారీరక బలప్రయోగాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τινας ἀδελφοὺς
  choice: మరికొందరు సహోదరులను
  rationale: ఇక్కడ ἀδελφοί క్రైస్తవ విశ్వాస సమాజంలోని తోటి విశ్వాసులను సూచిస్తుంది. మూలంలోని బంధుత్వ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భానుసార సమూహార్థాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: ἐπὶ τοὺς πολιτάρχας
  choice: పట్టణ అధికారుల ఎదుటికి
  rationale: πολιτάρχης మాసిదోనియాలోని నిర్దిష్ట పట్టణ పరిపాలనా బిరుదు. ఆధునిక పాఠకునికి వారి విధిని స్పష్టంగా తెలియజేస్తూనే, చారిత్రక బిరుదును పాదసూచికలో భద్రపరుస్తుంది.
- source_word: βοῶντες
  choice: బిగ్గరగా ఇలా కేకలు వేశారు
  rationale: ఈ కృదంతం బహిరంగంగా పెద్దగా అరవడాన్ని సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో సహజత్వం కోసం పరిమిత క్రియారూపంగా అనువదించబడింది.
- source_word: οἱ τὴν οἰκουμένην ἀναστατώσαντες
  choice: లోకాన్ని అల్లకల్లోలం చేసిన వీళ్లు
  rationale: ἀναστατόω తీవ్రమైన కలకలం లేదా సామాజిక upheaval కలిగించడాన్ని సూచిస్తుంది. ‘అల్లకల్లోలం చేసిన’ అనేది నిందారోపణలోని తీవ్రతను అతిశయోక్తిని సద్దుమణగనీయకుండా అందిస్తుంది.
- source_word: οἰκουμένην
  choice: లోకాన్ని
  rationale: οἰκουμένη అక్షరార్థంగా నివాసిత లోకాన్ని, సందర్భంలో తెలిసిన నాగరిక లేదా రోమా ప్రపంచాన్ని సూచించవచ్చు. ‘లోకం’ సహజంగా ఉండగా, దాని పరిమిత భావవ్యాప్తిని పాదసూచిక తెలియజేస్తుంది.
- source_word: οὗτοι καὶ ἐνθάδε πάρεισιν
  choice: వీళ్లు ఇక్కడికి కూడా వచ్చారు
  rationale: πάρειμι ఇక్కడికి చేరి ప్రస్తుతం ఉండడాన్ని సూచిస్తుంది; ‘వచ్చారు’ చేరికతో కూడిన ప్రస్తుత ఉనికిని సహజంగా వ్యక్తపరుస్తుంది. καίను ‘కూడా’గా స్పష్టంగా నిలిపింది.
