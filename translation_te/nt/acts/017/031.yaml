id: ACT.17.31
reference: Acts 17:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀καθότι ἔστησεν ἡμέραν ἐν ᾗ μέλλει κρίνειν τὴν οἰκουμένην ἐν δικαιοσύνῃ ἐν ἀνδρὶ ᾧ ὥρισεν, πίστιν παρασχὼν πᾶσιν ἀναστήσας αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/031.yaml
  text: because he has fixed a day on which he is going to judge the inhabited world in righteousness by a man whom he appointed[b][a], having given proof to all by raising him from the dead.
translation:
  language: te
  text: ఎందుకంటే, ఆయన ఒక దినాన్ని నిర్ణయించాడు; ఆ దినాన తాను నియమించిన ఒక మనిషి ద్వారా జనావాసమైన ప్రపంచానికి నీతితో[a] తీర్పు తీర్చబోతున్నాడు. ఆయన ఆ మనిషిని మృతులలోనుండి లేపడం ద్వారా అందరికీ నిర్ధారణ కలిగించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీతితో’ అనే మాటను సందర్భానుసారం ‘న్యాయంగా’ అని కూడా అనువదించవచ్చు (δικαιοσύνῃ).
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అందరికీ భరోసా కలిగించాడు’; మరింత అక్షరార్థంగా, ‘అందరికీ విశ్వాసం ఇచ్చాడు’ (πίστιν παρασχὼν πᾶσιν). ఇక్కడ భావం అందరికీ ఇచ్చిన నిర్ధారణ లేదా భరోసా.
    reason: alternative_reading
lexical_decisions:
- source_word: καθότι
  choice: ఎందుకంటే
  rationale: ముందున్న పశ్చాత్తాప పిలుపుకు కారణాన్ని పరిచయం చేసే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: ἔστησεν ἡμέραν
  choice: ఒక రోజును నిర్ణయించాడు
  rationale: దేవుడు ఒక నిర్దిష్ట దినాన్ని స్థిరపరిచాడనే భావాన్ని స్పష్టంగా, గంభీరంగా తెలియజేస్తుంది.
- source_word: ἐν ᾗ μέλλει κρίνειν
  choice: తీర్పు తీర్చబోయే
  rationale: μέλλει లోని ఉద్దేశిత భవిష్యత్ చర్య భావాన్ని సాధారణ భవిష్యత్తుగా కుదించకుండా సహజ తెలుగులో నిలుపుతుంది.
- source_word: τὴν οἰκουμένην
  choice: మనుషులు నివసించే లోకం
  rationale: కేవలం సృష్టి లేదా భూమి అనే అమూర్త భావం కాకుండా, జనావాసమైన లోకమంతటినీ సూచించే గ్రీకు పదార్థాన్ని తెలియజేస్తుంది.
- source_word: ἐν δικαιοσύνῃ
  choice: నీతితో
  rationale: δικαιοσύνη యొక్క ప్రాథమిక భావాన్ని నిలుపుతూ, తీర్పు సందర్భంలో సహజంగా ఉంటుంది; ‘న్యాయంగా’ అనే సందర్భోచిత ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: ἐν ἀνδρὶ ᾧ ὥρισεν
  choice: తాను నియమించిన ఒక మనిషి ద్వారా
  rationale: ἀνήρ లోని పురుష లింగ సూచనను, గ్రీకులో నిర్దిష్ట ఉపపదం లేకపోవడాన్ని నిలుపుతుంది; ὥρισεν ను స్పష్టమైన ‘నియమించిన’గా అనువదిస్తుంది.
- source_word: πίστιν παρασχὼν πᾶσιν
  choice: అందరికీ రుజువు ఇచ్చాడు
  rationale: ఈ నుడికారంలో πίστις సాధారణంగా ‘విశ్వాసం’ కంటే భరోసా లేదా నిర్ధారక రుజువు అనే భావాన్ని ఇస్తుంది. తెలుగు వాక్య స్పష్టత కోసం ‘దీనికి’ చేర్చబడింది.
- source_word: ἀναστήσας αὐτὸν ἐκ νεκρῶν
  choice: ఆ మనిషిని మృతులలోనుండి లేపడం ద్వారా
  rationale: పునరుత్థానం అందరికీ రుజువు ఇచ్చిన సాధనమని క్రియావిశేషణ రూపంలోని సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: δικαιοσύνη యొక్క అనువాదం
  choice: నీతితో
  alternative: న్యాయంగా
  rationale: ‘నీతి’ మూలపదపు విస్తృత నైతిక భావాన్ని కాపాడుతుంది; తీర్పు సందర్భంలో ‘న్యాయం’ కూడా సాధ్యమైనందున దాన్ని పాదసూచికలో ఉంచాం.
- issue: πίστιν παρασχὼν πᾶσιν యొక్క అనువాదం
  choice: అందరికీ రుజువు ఇచ్చాడు
  alternative: అందరికీ భరోసా కలిగించాడు; మరింత అక్షరార్థంగా, అందరికీ విశ్వాసం ఇచ్చాడు
  rationale: παρέχω తో కూడిన ఈ నుడికారంలో పునరుత్థానం దేవుడు నియమించిన న్యాయాధిపతికి బహిరంగ నిర్ధారణ లేదా రుజువుగా పనిచేస్తుంది. అక్షరార్థ ప్రత్యామ్నాయాన్ని పారదర్శకత కోసం పాదసూచికలో ఉంచాం.
- issue: ἀνδρὶ లోని లింగం మరియు నిర్దిష్టత
  choice: ఒక మనిషి
  alternative: ఆ మనిషి
  rationale: ἀνήρ పురుషుణ్ణి సూచిస్తుంది; నిర్దిష్ట ఉపపదం లేనందున ‘ఒక మనిషి’ మూలరూపానికి దగ్గరగా ఉంటుంది, అయినా సందర్భంలో సూచించబడేది యేసే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘మనుషులు నివసించే లోకం’ ద్వారా οἰκουμένη యొక్క మానవ-సార్వత్రిక పరిధి స్పష్టమవుతుంది. పొడవైన గ్రీకు వాక్యాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించినా, కారణం, నియమిత తీర్పుదినం, నియమించబడిన మనిషి, పునరుత్థానం ద్వారా లభించిన రుజువు అనే తార్కిక సంబంధాలన్నీ నిలుపబడ్డాయి.
