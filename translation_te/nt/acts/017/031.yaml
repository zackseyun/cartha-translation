- from: ఎందుకంటే, తాను నియమించిన ఒక మనిషి ద్వారా నీతితో[a] మనుషులు నివసించే లోకానికి తీర్పు తీర్చబోయే ఒక రోజును ఆయన నిర్ణయించాడు. ఆ మనిషిని మృతులలోనుండి లేపడం ద్వారా ఆయన అందరికీ దీనికి రుజువు[b] ఇచ్చాడు.
