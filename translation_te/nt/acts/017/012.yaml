id: ACT.17.12
reference: Acts 17:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πολλοὶ μὲν οὖν ἐξ αὐτῶν ἐπίστευσαν, καὶ τῶν Ἑλληνίδων γυναικῶν τῶν εὐσχημόνων καὶ ἀνδρῶν οὐκ ὀλίγοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/012.yaml
  text: Therefore many of them believed[b][a], and not a few of the prominent Greek women and men.
translation:
  language: te
  text: కాబట్టి వారిలో చాలామంది నమ్మారు. ఉన్నత సామాజిక స్థానం గల[a] గ్రీకు స్త్రీలలోనూ, పురుషులలోనూ కొద్దిమంది కాదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గౌరవనీయులైన’ లేదా ‘ప్రముఖులైన.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ‘కొద్దిమంది కాదు’; ఇది గణనీయమైన సంఖ్యను సూచించే అల్పోక్తి.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ μὲν οὖν
  choice: కాబట్టి ... చాలామంది
  rationale: μὲν οὖν ముందరి వాక్యంలోని లేఖన పరిశీలన ఫలితాన్ని సూచిస్తూ కథనాన్ని ముందుకు నడిపిస్తుంది. ‘కాబట్టి’ ఆ నిర్ధారణాత్మక సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘చాలామంది’ πολλοί యొక్క పరిమాణార్థాన్ని నిలుపుతుంది.
- source_word: ἐξ αὐτῶν
  choice: వారిలో
  rationale: ἐξ ఇక్కడ విభాగార్థకంగా వాడబడి, ముందుగా ప్రస్తావించిన బెరయవారిలో చాలామందిని సూచిస్తుంది. ‘వారిలో’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ἐπίστευσαν
  choice: నమ్మారు
  rationale: క్రియకు సంబంధించిన కర్మ ఈ వాక్యంలో స్పష్టంగా చెప్పబడలేదు; సందర్భం ద్వారా అర్థమవుతుంది. అందువల్ల అదనపు సిద్ధాంతపరమైన పదాలను చేర్చకుండా మూలంలోని సరళతను నిలిపాం.
- source_word: τῶν Ἑλληνίδων γυναικῶν
  choice: గ్రీకు స్త్రీలలోనూ
  rationale: Ἑλληνίδων వారి గ్రీకు గుర్తింపును, γυναικῶν ఇక్కడ స్త్రీలను సూచిస్తుంది; వివాహ సంబంధం ప్రస్తావించబడనందున ‘భార్యలు’ అని అనువదించలేదు.
- source_word: τῶν εὐσχημόνων
  choice: ఉన్నత సామాజిక స్థానం గల
  rationale: ఈ సందర్భంలో εὐσχήμων గౌరవనీయతతో పాటు గుర్తింపు పొందిన సామాజిక స్థానాన్ని సూచిస్తుంది. ‘ఉన్నత సామాజిక స్థానం గల’ అనేది ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: καὶ ἀνδρῶν οὐκ ὀλίγοι
  choice: పురుషులలోనూ కొద్దిమంది కాదు
  rationale: οὐκ ὀλίγοι అనే లూకా శైలిలోని అల్పోక్తిని ‘చాలామంది’గా సమతలపరచకుండా ‘కొద్దిమంది కాదు’గా నిలిపాం. విభాగార్థక షష్ఠీని తెలుగులో ‘పురుషులలోనూ’గా వ్యక్తం చేశాం.
theological_decisions:
- issue: ἐπίστευσαν అనే క్రియకు స్పష్టమైన క్రైస్తవ సిద్ధాంతపరమైన కర్మను చేర్చాలా?
  choice: నమ్మారు
  alternative: మెస్సీయపై విశ్వాసముంచారు; సందేశాన్ని నమ్మారు
  rationale: ఈ వచనం నమ్మకానికి సంబంధించిన కర్మను ప్రత్యక్షంగా పేర్కొనదు. సందర్భంలో అది అర్థమైనప్పటికీ, ‘నమ్మారు’ అని మాత్రమే అనువదించడం మూలపాఠంలోని సంక్షిప్తతను, వ్యాఖ్యాన స్వేచ్ఛను కాపాడుతుంది.
- issue: εὐσχημόνων అనే విశేషణాన్ని పురుషులకు కూడా స్పష్టంగా వర్తింపజేయాలా?
  choice: ‘ఉన్నత సామాజిక స్థానం గల’ అనే పదబంధాన్ని గ్రీకు స్త్రీలతో నేరుగా అనుసంధానించి, పురుషులను విడిగా పేర్కొనడం
  alternative: ఉన్నత సామాజిక స్థానం గల గ్రీకు స్త్రీపురుషులు
  rationale: మూలంలోని పదక్రమం, నామవాచక సమూహ నిర్మాణం ఈ విశేషణాన్ని స్త్రీలతో అత్యంత ప్రత్యక్షంగా అనుసంధానిస్తాయి; అది పురుషులకూ వర్తిస్తుందని అనువాదంలో బలవంతంగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘నమ్మారు’ అనే సంక్షిప్త రూపం మూలంలోని భావసాంద్రతను నిలుపుతుంది. ‘కొద్దిమంది కాదు’ అనే వ్యక్తీకరణ కొద్దిగా సాహిత్యరంగు కలిగినప్పటికీ సులభంగా అర్థమవుతుంది మరియు లూకా అల్పోక్తిని కాపాడుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
