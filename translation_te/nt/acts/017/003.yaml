  text: διανοίγων καὶ παρατιθέμενος ὅτι τὸν χριστὸν ἔδει παθεῖν καὶ ἀναστῆναι ἐκ νεκρῶν, καὶ ὅτι οὗτός ἐστιν ⸂ὁ χριστός, ὁ⸃ Ἰησοῦς ὃν ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/003.yaml
  text: explaining and demonstrating that the Messiah had to suffer and rise from the dead[a], and that this Jesus, whom I proclaim to you[b], is the Messiah.
translation:
  language: te
  text: మెస్సీయ[a] బాధలు అనుభవించవలసి, మృతులలోనుండి లేవవలసి ఉందని[b] వివరిస్తూ, ఆధారాలు చూపిస్తూ, “నేను మీకు ప్రకటిస్తున్న ఈ యేసే మెస్సీయ” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: రెండు చోట్లా ‘మెస్సీయ’కు బదులు ‘క్రీస్తు’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘మృతులలోనుండి లేపబడవలసి ఉందని.’ ఇక్కడ గ్రీకులో కర్తరి అనంతక్రియ, అంటే ‘లేవడం,’ ఉంది; అయితే నూతన నిబంధనలోని ఇతర చోట్ల దేవుడు యేసును లేపాడని కూడా చెప్పబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: διανοίγων
  choice: వివరిస్తూ
  rationale: ఈ సందర్భంలో లేఖనాల అర్థాన్ని తెరిచి చూపించడం లేదా స్పష్టం చేయడం అనే భావం ఉంది. ఆధునిక తెలుగులో ‘వివరిస్తూ’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: παρατιθέμενος
  choice: ఆధారాలు చూపిస్తూ
  rationale: విషయాన్ని శ్రోతల ముందుంచి దానికి మద్దతుగా సాక్ష్యాలను సమర్పించడం అనే సందర్భార్థాన్ని ఇది సహజంగా వ్యక్తం చేస్తుంది; అతిగా ‘నిరూపించాడు’ అని చెప్పదు.
- source_word: τὸν χριστόν / ὁ χριστός
  choice: మెస్సీయ
  rationale: రెండు చోట్లా Χριστός వ్యక్తిపేరులో భాగంగా కాక, ఎదురుచూస్తున్న అభిషిక్తుని బిరుదుగా వాడబడింది. ‘మెస్సీయ’ యూదుల లేఖన సందర్భాన్ని నిలుపుతుంది.
- source_word: ἔδει
  choice: లేవాల్సి ఉందని (మరియు బాధలు అనుభవించాల్సిన అవసర భావం)
  rationale: గ్రీకు పదం లేఖనాల్లో వెల్లడైన దైవిక అవసరాన్ని సూచిస్తుంది. తెలుగులో సంయుక్త నిర్మాణం ‘బాధలు అనుభవించి ... లేవాల్సి ఉందని’ ఆ అవసరాన్ని రెండు క్రియలకూ వర్తింపజేస్తుంది.
- source_word: παθεῖν
  choice: బాధలు అనుభవించి
  rationale: πάσχω యొక్క బాధపడడం అనే భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀναστῆναι ἐκ νεκρῶν
  choice: మృతులలోనుండి లేవాల్సి
  rationale: క్రియారూపం కర్తరి ప్రయోగంలో ఉన్నందున ‘లేవడం’ అని నేరుగా అనువదించబడింది; ἐκ νεκρῶν కు ‘మృతులలోనుండి’ దగ్గరగా సరిపోతుంది.
- source_word: καταγγέλλω ὑμῖν
  choice: నేను మీకు ప్రకటిస్తున్న
  rationale: బహిరంగంగా తెలియజేయడం అనే భావాన్ని ‘ప్రకటిస్తున్న’ నిలుపుతుంది; ὑμῖν దాతృవిభక్తి ‘మీకు’గా సహజంగా వచ్చింది.
theological_decisions:
- issue: Χριστός అనే బిరుదును రెండు చోట్ల ఎలా అనువదించాలి
  choice: రెండు చోట్లా ‘మెస్సీయ’
  alternative: రెండు చోట్లా ‘క్రీస్తు’
  rationale: ఇక్కడ వాదన ఎదురుచూస్తున్న అభిషిక్తుడు బాధపడి లేవాల్సి ఉందనీ, యేసే ఆ వ్యక్తి అనీ చెబుతుంది. అందువల్ల బిరుదు భావాన్ని ‘మెస్సీయ’ స్పష్టంగా నిలుపుతుంది; సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదసూచికలో ఇచ్చాం.
- issue: ἀναστῆναι క్రియలోని కర్తరి భావం
  choice: మృతులలోనుండి లేవడం
  alternative: మృతులలోనుండి లేపబడడం
  rationale: ఈ వాక్యంలో గ్రీకు కర్తరి అనంతక్రియను ఉపయోగిస్తుంది. కాబట్టి ‘లేవడం’ మూలరూపానికి దగ్గరగా ఉంటుంది; దేవుడు యేసును లేపాడనే ఇతర నూతన నిబంధన వాక్యాల భావాన్ని ఇది తిరస్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని రెండు వర్తమాన కృదంతాల ప్రవాహాన్ని ‘వివరిస్తూ, ఆధారాలు చూపిస్తూ’గా నిలిపి, తెలుగులో వాక్యం సంపూర్ణంగా ఉండేందుకు సందర్భానుసారంగా చివర ‘అని చెప్పాడు’ చేర్చబడింది.
