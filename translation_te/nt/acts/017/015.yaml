source:
  edition: SBLGNT
  text: οἱ δὲ ⸀καθιστάνοντες τὸν Παῦλον ⸀ἤγαγον ἕως Ἀθηνῶν, καὶ λαβόντες ἐντολὴν πρὸς τὸν Σιλᾶν καὶ ⸀τὸν Τιμόθεον ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτὸν ἐξῄεσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/015.yaml
  text: Those who were escorting Paul brought him as far as Athens[a], and after receiving instructions for Silas and Timothy to come to him as quickly as possible[b], they departed.
translation:
  language: te
  text: పౌలును వెంట తీసుకువెళ్తున్నవారు అతణ్ణి ఏథెన్సు వరకు తీసుకువెళ్లారు.[a] సీలకూ తిమోతికీ, వారు సాధ్యమైనంత త్వరగా పౌలు దగ్గరకు రావాలని ఆదేశం అందుకొని,[b] వారు బయలుదేరారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఏథెన్సుకు.’ గ్రీకు పదబంధాన్ని ఇలా సరళంగా అనువదించవచ్చు; అయితే ‘ఏథెన్సు వరకు’ అనేది వారు ఆ గమ్యస్థానం దాకా పౌలుతో వెళ్లారనే భావాన్ని నిలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘సూచనను అందుకొని.’ ఇక్కడి గ్రీకు నామవాచకానికి ‘ఆదేశం’ అనే బలమైన భావంతోపాటు ‘సూచన’ అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθιστάνοντες
  choice: వెంట తీసుకువెళ్తున్నవారు
  rationale: ఈ సందర్భంలో పౌలు తన గమ్యస్థానానికి చేరే వరకు అతనితో ప్రయాణించి తోడుగా తీసుకువెళ్లిన వారిని సూచిస్తుంది. తెలుగు సహజత్వాన్ని కాపాడుతూ ప్రయాణ సహచర్య భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἤγαγον
  choice: తీసుకువచ్చారు
  rationale: పౌలును ఏథెన్సు అనే గమ్యస్థానానికి చేర్చిన పూర్తయిన చర్యను సహజమైన కథన తెలుగులో తెలియజేస్తుంది.
- source_word: ἕως Ἀθηνῶν
  choice: ఏథెన్సు వరకు
  rationale: ἕως సూచించే ‘ఆ స్థలం దాకా’ అనే పరిమితి భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: λαβόντες ἐντολήν
  choice: ఆదేశాన్ని అందుకొని
  rationale: ἐντολήలో ఉన్న ఆజ్ఞ లేదా అధికారపూర్వక సూచన భావాన్ని ‘ఆదేశం’ నిలుపుతుంది; క్రియావిశేషణ కృదంతం ప్రధాన చర్యకు ముందున్న సందర్భాన్ని సహజంగా చూపుతుంది.
- source_word: πρὸς τὸν Σιλᾶν καὶ τὸν Τιμόθεον
  choice: సీల, తిమోతులు … వారికి చెప్పవలసిన
  rationale: ఆదేశం సీల, తిమోతులకు ఉద్దేశించబడిందని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτόν
  choice: సాధ్యమైనంత త్వరగా తన దగ్గరకు రావాలని
  rationale: ὡς τάχιστα లోని అత్యవసరతను ‘సాధ్యమైనంత త్వరగా’ నిలుపుతుంది; αὐτόνను సందర్భానుసార ప్రతిబింబ సర్వనామమైన ‘తన’తో వ్యక్తం చేస్తుంది.
- source_word: ἐξῄεσαν
  choice: వారు బయలుదేరారు
  rationale: సందేశాన్ని స్వీకరించిన తరువాత వారు అక్కడి నుంచి వెళ్లిన కథన ముగింపును సహజ తెలుగులో తెలియజేస్తుంది.
