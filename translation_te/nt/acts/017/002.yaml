id: ACT.17.2
reference: Acts 17:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ εἰσῆλθεν πρὸς αὐτοὺς καὶ ἐπὶ σάββατα τρία διελέξατο αὐτοῖς ἀπὸ τῶν γραφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/002.yaml
  text: And according to Paul's custom[a], he went in to them, and on three Sabbaths he reasoned with them from the Scriptures[c][b],
translation:
  language: te
  text: పౌలు తన అలవాటు ప్రకారం[a] వారి దగ్గరికి వెళ్లి, మూడు విశ్రాంతి దినాల్లో[b] లేఖనాల ఆధారంగా వారితో తర్కించాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పౌలుకు అలవాటైనట్లుగా.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మూడు విశ్రాంతి దినాలపాటు.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “వారితో చర్చించాడు” లేదా “వారితో సంభాషించాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ
  choice: పౌలు తన అలవాటు ప్రకారం
  rationale: κατά + substantival perfect participle of εἴωθα స్థిరమైన అలవాటును సూచిస్తుంది. ఈ తెలుగు ప్రయోగం ఆ భావాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: εἰσῆλθεν πρὸς αὐτοὺς
  choice: వారి దగ్గరికి వెళ్లి
  rationale: εἰσέρχομαι లోని వెళ్లడం/ప్రవేశించడం అనే గమనార్థాన్ని సందర్భానుగుణంగా వ్యక్తం చేస్తుంది; అయితే ఈ వచనంలో లేని ‘సమాజమందిరంలోకి’ అనే పదాన్ని చేర్చదు.
- source_word: ἐπὶ σάββατα τρία
  choice: మూడు విశ్రాంతి దినాల్లో
  rationale: ἐπί + accusative ఇక్కడ మూడు వేర్వేరు సబ్బాతు సందర్భాలపై జరిగిన కార్యాన్ని సూచిస్తుంది. ‘దినాల్లో’ అనే రూపం పునరావృత సందర్భాలను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: διελέξατο
  choice: వారితో తర్కించాడు
  rationale: διαλέγομαι ఇక్కడ సంభాషణాత్మకంగా కారణాలు చూపుతూ వాదనను వివరించడాన్ని సూచిస్తుంది. ‘తర్కించాడు’ బుద్ధిపూర్వక పరిశీలనను నిలుపుతుంది; శత్రుత్వపూరిత గొడవను తప్పనిసరిగా సూచించదు.
- source_word: ἀπὸ τῶν γραφῶν
  choice: లేఖనాల ఆధారంగా
  rationale: ἀπό ఇక్కడ పౌలు చేసిన తర్కానికి మూలం లేదా ఆధారాన్ని తెలియజేస్తుంది. ‘లేఖనాలు’ యూదు-క్రైస్తవ సందర్భంలోని పవిత్ర గ్రంథరచనలను సూచిస్తుంది.
theological_decisions:
- issue: పౌలు వెళ్లిన ‘వారు’ ఎవరు అనే నిర్దిష్టత
  choice: ప్రధాన పాఠ్యంలో ‘వారి’ అనే సర్వనామాన్నే ఉంచడం
  alternative: ‘సమాజమందిరంలో ఉన్న యూదుల దగ్గరికి’ లేదా ‘సమాజమందిరంలోకి’ అని స్పష్టీకరించడం
  rationale: ముందరి సందర్భం సమాజమందిరాన్ని గుర్తించినా, ఈ వచనంలోని గ్రీకు పాఠ్యం αὐτούς అనే సర్వనామమే వాడుతుంది. అందువల్ల సందర్భానికి మించిన నిర్దిష్టతను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన వాక్యనిర్మాణం. ‘సబ్బాతు’కు బదులు అర్థస్పష్టమైన ‘విశ్రాంతి దినం,’ ‘గ్రంథాలు’కు బదులు సాంప్రదాయికంగా గుర్తించదగిన ‘లేఖనాలు’ వాడబడ్డాయి. మూలంలోని సర్వనామ అనిశ్చితి నిలుపబడింది.
