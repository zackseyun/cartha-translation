  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γένος οὖν ὑπάρχοντες τοῦ θεοῦ οὐκ ὀφείλομεν νομίζειν χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ, χαράγματι τέχνης καὶ ἐνθυμήσεως ἀνθρώπου, τὸ θεῖον εἶναι ὅμοιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/029.yaml
  text: Therefore[a], since we are God’s offspring, we ought not to think that the Divine Being is like gold or silver or stone[b], an image formed by human skill and imagination.
translation:
  language: te
  text: కాబట్టి మనం దేవుని సంతానం గనుక, దైవస్వరూపం[a] బంగారానికో వెండికో రాతికో—మానవ నైపుణ్యంతో, ఊహతో చెక్కిన ప్రతిమకు[b]—పోలినదని మనం భావించకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దైవత్వం,” “దైవికమైనది.” గ్రీకు τὸ θεῖον అనే పదం దైవికమైన దానిని విస్తృతంగా సూచిస్తుంది; ఇక్కడ పౌలు వాదనలో అది నిజమైన దేవునిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “చెక్కిన రూపానికి,” “చెక్కబడ్డ వస్తువుకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γένος
  choice: సంతానం
  rationale: దేవుని నుండి ఉనికి పొందినవారమనే బంధాన్ని సహజంగా తెలియజేస్తుంది; జాతి లేదా కుటుంబం అనే సంకుచిత భావాలను రానివ్వదు.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాదన నుండి పౌలు తీసే నిర్ధారణను స్పష్టంగా సూచిస్తుంది.
- source_word: ὑπάρχοντες
  choice: గనుక
  rationale: ఈ సందర్భంలో కారణార్థకమైన కృదంత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὐκ ὀφείλομεν νομίζειν
  choice: మనం భావించకూడదు
  rationale: ఇది కేవలం అసంభవతను కాక, అలా తలంచడం తగదనే బాధ్యతాపూర్వక భావాన్ని తెలియజేస్తుంది.
- source_word: χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ
  choice: బంగారానికో వెండికో రాతికో
  rationale: గ్రీకు మూలంలో పేర్కొన్న మూడు పదార్థాలనూ, వాటి ప్రత్యామ్నాయ వరుసనూ నిలుపుతుంది.
- source_word: χαράγματι
  choice: చెక్కిన ప్రతిమకు
  rationale: చెక్కడం లేదా చెక్కి రూపం కల్పించడం ద్వారా తయారైన వస్తువు అనే భావాన్ని సందర్భానుకూలంగా అందిస్తుంది.
- source_word: τέχνης καὶ ἐνθυμήσεως ἀνθρώπου
  choice: మానవ నైపుణ్యంతో, ఊహతో
  rationale: కళాకౌశలం మరియు మనస్సులో రూపకల్పన అనే రెండు మూలభావాలనూ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ θεῖον
  choice: దైవస్వరూపం
  rationale: దైవికమైనది లేదా దేవత్వానికి చెందిన వాస్తవం అనే విస్తృత భావాన్ని నిలుపుతూ, ఈ సందర్భంలో నిజమైన దేవునిని సూచించడానికి సరిపోతుంది; తరువాతి సాంకేతిక వేదాంత పదజాలాన్ని అనవసరంగా దిగుమతి చేయదు.
theological_decisions:
- issue: ఏకదైవ వాద సందర్భంలో తాత్వికంగా ఉన్న τὸ θεῖον పదబంధం
  choice: దైవస్వరూపం
  alternative: దైవత్వం; దైవికమైనది
  rationale: పౌలు తన శ్రోతలకు అర్థమయ్యే విస్తృత దైవిక పదాన్ని ఉపయోగించినప్పటికీ, అతని వాదన నిజమైన దేవుని గురించే. ‘దైవస్వరూపం’ ఈ రెండింటి మధ్యనున్న ఉద్వేగాన్ని నిలుపుతుంది; దానిని పూర్తిగా నిరాకార శక్తిగానో, తరువాతి కాలపు సాంకేతిక సిద్ధాంతపదంగానో మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. మూలవాక్యంలోని తార్కిక ప్రవాహాన్ని, పదార్థాల వరుసను, మానవ నైపుణ్యం–ఊహ అనే జతను నిలిపింది. డాష్‌ల మధ్యనున్న భాగం రాయి మాత్రమే కాక, ముందు పేర్కొన్న పదార్థాలతో రూపొందించిన విగ్రహాన్నీ వివరిస్తుందని సహజంగా గ్రహించేందుకు సహాయపడుతుంది.
