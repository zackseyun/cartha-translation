  to: యాసోను ఆతిథ్యమిచ్చిన వీరందరూ కైసరు జారీ చేసిన ఆజ్ఞలకు[b] వ్యతిరేకంగా ప్రవర్తిస్తూ, యేసు మరొక రాజు[c] అని చెబుతున్నారు[a].
  rationale: సంబంధవాక్య నిర్మాణాన్ని పునరుద్ధరించి οὓς ὑποδέδεκται యొక్క భావాన్ని మరింత దగ్గరగా ప్రతిబింబించాం. δογμάτωνకు సందర్భోచితమైన అధికారిక-పరిపాలనా భావం స్పష్టమయ్యేలా ‘కైసరు జారీ చేసిన ఆజ్ఞలు’ అని సవరించాం. కొనసాగుతున్న ఆరోపణ (πράσσουσι) మరియు యేసును ‘మరొక రాజు’గా చెప్పే రాజకీయ బలం యథాతథంగా ఉంచబడ్డాయి. పాదటిప్పు గుర్తు [a]ను ఆతిథ్యానికి సంబంధించిన పదం లేకపోయినా వాక్యమంతటిలోని సంబంధవాక్యానికి జోడించాం.
