id: ACT.17.7
reference: Acts 17:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὓς ὑποδέδεκται Ἰάσων· καὶ οὗτοι πάντες ἀπέναντι τῶν δογμάτων Καίσαρος πράσσουσι, βασιλέα ⸂ἕτερον λέγοντες⸃ εἶναι Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/007.yaml
  text: These men[a], whom Jason has welcomed, are all acting against Caesar’s decrees[c][b], saying that there is another king—Jesus.
translation:
  language: te
  text: యాసోను ఆతిథ్యమిచ్చిన వీరందరూ కైసరు జారీ చేసిన ఆజ్ఞలకు[b] వ్యతిరేకంగా ప్రవర్తిస్తూ, యేసు మరొక రాజు[c] అని చెబుతున్నారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘స్వీకరించాడు,’ ‘తన దగ్గరకు చేర్చుకున్నాడు.’ గ్రీకు క్రియ అతిథులుగా స్వీకరించడం లేదా వారికి ఆతిథ్యమివ్వడం అనే భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘డిక్రీలకు,’ ‘అధికారిక నిర్ణయాలకు.’ ఈ పదం అధికారిక తీర్పులు, నిర్ణయాలు లేదా ఆజ్ఞలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘వేరొక రాజు.’ గ్రీకు పాఠం ‘మరొక రాజు’ అని చెబుతుంది; ఇది కైసరు అధికారానికి ప్రత్యర్థిగా యేసును ప్రకటిస్తున్నారనే ఆరోపణను వ్యక్తం చేస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποδέδεκται
  choice: ఆతిథ్యమిచ్చాడు
  rationale: ఈ క్రియ అతిథులుగా స్వీకరించి ఆదరించడాన్ని సూచిస్తుంది. పరిపూర్ణ కాలరూపంలోని ఫలితభావాన్ని సందర్భం తెలియజేస్తుండగా, ఈ పదప్రయోగం ఆధునిక తెలుగులో సహజంగా ఆతిథ్య భావాన్ని నిలుపుతుంది.
- source_word: ἀπέναντι
  choice: విరుద్ధంగా
  rationale: షష్ఠీ విభక్తితో వచ్చిన ఈ పదం వ్యతిరేకతను లేదా దానికి విరుద్ధంగా ఉండడాన్ని సూచిస్తుంది. న్యాయపరమైన ఆరోపణ సందర్భంలో ‘విరుద్ధంగా’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: δογμάτων
  choice: శాసనాలకు
  rationale: రోమా పౌరపాలనా సందర్భంలో ఈ పదం అధికారిక ఆదేశాలు లేదా నిర్ణయాలను సూచిస్తుంది. ‘శాసనాలు’ అధికారిక భావాన్ని కాపాడుతూ సాధారణ పాఠకులకు అర్థమవుతుంది.
- source_word: πράσσουσι
  choice: ప్రవర్తిస్తూ
  rationale: వర్తమాన కాలం కొనసాగుతున్న చర్యను చూపుతుంది. ‘విరుద్ధంగా ప్రవర్తిస్తూ’ అనే రూపం ఆరోపించబడుతున్న నడవడికను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: βασιλέα ἕτερον
  choice: మరొక రాజు
  rationale: βασιλεύς‌ను నిర్దిష్టంగా ‘రాజు’ అని అనువదించడం రాజకీయ ఆరోపణను కాపాడుతుంది; ἕτερον మరో ప్రత్యేకమైన లేదా ప్రత్యర్థి హక్కుదారుని సూచించే అవకాశాన్ని ‘మరొక’ నిలుపుతుంది.
- source_word: λέγοντες
  choice: చెబుతున్నారు
  rationale: ఈ కృదంతం వారి చర్యకు ఆధారమైన మాట లేదా వాదనను వివరిస్తుంది. ‘చెబుతున్నారు’ మూలంలోని తటస్థ భావాన్ని కాపాడి, ‘వాదిస్తున్నారు’ వంటి అదనపు సందేహభావాన్ని చేర్చదు.
- source_word: εἶναι Ἰησοῦν
  choice: యేసు ... అని
  rationale: గ్రీకు కర్మణి-అనంతక్రియా నిర్మాణాన్ని సహజ తెలుగు పరోక్ష వాక్యంగా మార్చి, యేసే ఆ మరొక రాజు అనే గుర్తింపును స్పష్టంగా ఉంచుతుంది.
- source_word: οὗτοι πάντες
  choice: వీరందరూ
  rationale: సూచనార్థకతను, సమూహమంతటిపై మోపిన ఆరోపణను సంక్షిప్తమైన సహజ తెలుగు రూపంలో కాపాడుతుంది.
theological_decisions:
- issue: యేసును రాజుగా పేర్కొనడంలోని రాజకీయ బలం
  choice: యేసును ‘మరొక రాజు’గా ప్రకటిస్తున్నారనే ఆరోపణను నేరుగా అనువదించడం
  alternative: రాజకీయ భావాన్ని తగ్గిస్తూ ‘మరో నాయకుడు’ లేదా ‘మరో పాలకుడు’ అని అనువదించడం
  rationale: కైసరు శాసనాలతో ముడిపడిన ఈ ఆరోపణ స్పష్టంగా రాజకీయ పదజాలంలో ఉంది. ‘రాజు’ అనే పదం చారిత్రక, వేదాంతపరమైన ఉద్రిక్తతను నిలుపుతుంది; దానిని కేవలం ఆధ్యాత్మిక అర్థానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. ‘కైసరు,’ ‘శాసనాలు,’ ‘రాజు’ అనే పదాలు రోమా రాజకీయ నేపథ్యాన్ని స్పష్టంగా నిలుపుతాయి; వాక్య నిర్మాణం మాత్రం సహజ తెలుగు ప్రవాహానికి అనుగుణంగా ఉంది.
