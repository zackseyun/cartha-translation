source:
  edition: SBLGNT
  text: ξενίζοντα γάρ τινα εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν· βουλόμεθα οὖν γνῶναι ⸂τίνα θέλει⸃ ταῦτα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/020.yaml
  text: For you are bringing some strange things to our ears[b][a]. Therefore we want to know what these things mean.
translation:
  language: te
  text: ఎందుకంటే, నీవు మా చెవులకు కొన్ని వింతైన విషయాలను వినిపిస్తున్నావు.[a] కాబట్టి, ఈ విషయాల అర్థమేమిటో తెలుసుకోవాలని మేము కోరుతున్నాం.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వింతైన’ అనే పదాన్ని ‘విదేశీ’ లేదా ‘అపరిచితమైన’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం వినేవారికి కొత్తగా లేదా విదేశీగా ఉండడం వల్ల వింతగా అనిపించేదాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఈ విషయాలు ఏమై ఉండాలని కోరుతున్నాయో.’ ఇది ‘ఈ విషయాల అర్థమేమిటో’ లేదా ‘వీటి ప్రాముఖ్యత ఏమిటో’ అనే భావాన్నిచ్చే గ్రీకు నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ξενίζοντα τινα
  choice: కొన్ని వింతైన విషయాలు
  rationale: ξενίζοντα ఇక్కడ వినేవారికి కొత్తగా, పరాయిగా లేదా పరిచయం లేనివిగా అనిపించే విషయాలను సూచిస్తుంది. ‘వింతైన’ అనే పదం ఈ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; τινα లోని అనిర్దిష్టతను ‘కొన్ని’ నిలుపుతుంది.
- source_word: εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν
  choice: నీవు మాకు వినడానికి ... చెబుతున్నావు
  rationale: గ్రీకులో అక్షరార్థంగా ‘మా చెవుల్లోకి తీసుకొస్తున్నావు’ అనే రూపకం ఉంది. తెలుగులో అక్షరానువాదం అసహజంగా ఉండటంతో, వినికిడి భావాన్ని నిలుపుతూ సహజంగా ‘మాకు వినడానికి ... చెబుతున్నావు’ అని అనువదించబడింది.
- source_word: βουλόμεθα ... γνῶναι
  choice: తెలుసుకోవాలని మేము కోరుతున్నాం
  rationale: వారు ఆ విషయాల వివరణను తెలుసుకోవాలనే సంకల్పాన్ని ఈ సహజమైన, గౌరవప్రదమైన తెలుగు నిర్మాణం స్పష్టంగా తెలియజేస్తుంది.
- source_word: τίνα θέλει ταῦτα εἶναι
  choice: వీటి అర్థమేమిటో
  rationale: అక్షరార్థ రూపం ‘ఇవి ఏమై ఉండాలని కోరుతున్నాయి?’ అయినప్పటికీ, ఇది వాటి భావం లేదా ప్రాముఖ్యత ఏమిటని అడిగే గ్రీకు నుడికారం. అందువల్ల ‘వీటి అర్థమేమిటో’ సందర్భానుకూలంగా ఉంది.
- source_word: γάρ ... οὖν
  choice: ఎందుకంటే ... కాబట్టి
  rationale: γάρ ముందటి అభ్యర్థనకు కారణాన్ని, οὖν దానినుంచి వచ్చే నిర్ధారణను సూచిస్తాయి. ఈ సంబంధాలను ఆధునిక తెలుగులో స్పష్టంగా చూపించాయి.
