translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. గ్రీకు వినికిడి రూపకాన్ని అసహజమైన అక్షరానువాదంగా కాకుండా సహజ తెలుగు వ్యక్తీకరణగా అందించగా, దాని ఆధారం నిర్ణయ గమనికలో నమోదు చేయబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
