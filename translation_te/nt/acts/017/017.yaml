id: ACT.17.17
reference: Acts 17:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διελέγετο μὲν οὖν ἐν τῇ συναγωγῇ τοῖς Ἰουδαίοις καὶ τοῖς σεβομένοις καὶ ἐν τῇ ἀγορᾷ κατὰ πᾶσαν ἡμέραν πρὸς τοὺς παρατυγχάνοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/017.yaml
  text: So he was reasoning in the synagogue with the Jews and those who worshiped God[b][a], and in the marketplace every day with those who happened to be there.
translation:
  language: te
  text: కాబట్టి అతడు సమాజమందిరంలో యూదులతోనూ దేవుణ్ణి ఆరాధించేవారితోనూ[a], ప్రతిరోజూ సంతవీధిలో[b] అక్కడ తారసపడిన వారితో తర్కిస్తూ ఉండేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవభయంగలవారు’; యూదుల ఆరాధనతో అనుబంధమున్న యూదేతరులను సూచించే మాట కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘సంతవీధి’ కొనుగోలు, అమ్మకాల స్థలమే కాకుండా ప్రజలు కూడే పౌర బహిరంగ ప్రదేశం కూడా.
    reason: cultural_note
lexical_decisions:
- source_word: διελέγετο
  choice: చర్చిస్తూ తర్కించేవాడు
  rationale: అసంపూర్ణ భూతకాల రూపం నిరంతరంగా లేదా పదేపదే జరిగిన క్రియను సూచిస్తుంది. ఈ ఎంపిక సంభాషణతో కూడిన చర్చనూ, కారణాలు చూపుతూ వాదించే భావాన్నీ కలిపి వ్యక్తం చేస్తుంది.
- source_word: μὲν οὖν
  choice: కాబట్టి
  rationale: మునుపటి సందర్భం నుంచి కొనసాగింపు మరియు ఫలిత సంబంధాన్ని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: συναγωγῇ
  choice: సమాజమందిరంలో
  rationale: ఇక్కడ ఇది యూదుల ఆరాధనా సమావేశ స్థలాన్ని సూచించే స్థిరమైన తెలుగు బైబిలు పదం.
- source_word: τοῖς Ἰουδαίοις
  choice: యూదులతోనూ
  rationale: ఈ సందర్భంలో సమాజమందిరంలో ఉన్న యూద సమాజ సభ్యులను నేరుగా సూచిస్తుంది.
- source_word: τοῖς σεβομένοις
  choice: దేవుణ్ణి ఆరాధించేవారితోనూ
  rationale: గ్రీకు రూపంలో కర్మ ప్రత్యక్షంగా లేకపోయినా, అపొస్తలుల కార్యముల సందర్భంలో యూదుల ఆరాధనతో అనుబంధమున్న యూదేతర దేవభక్తులను సూచిస్తుంది; స్పష్టత కోసం ‘దేవుణ్ణి’ సందర్భానుసారంగా చేర్చబడింది.
- source_word: ἀγορᾷ
  choice: సంతవీధిలో
  rationale: వ్యాపారంతో పాటు ప్రజలు కూడే పౌర బహిరంగ స్థలాన్ని సూచించే సహజమైన తెలుగు పదం; సాంస్కృతిక విస్తృతిని పాదటిప్పణి వివరిస్తుంది.
- source_word: κατὰ πᾶσαν ἡμέραν
  choice: ప్రతిరోజూ
  rationale: రోజువారీ పునరావృతిని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πρὸς τοὺς παρατυγχάνοντας
  choice: అక్కడ తారసపడిన వారితో
  rationale: ఆ ప్రదేశంలో యాదృచ్ఛికంగా ఎదురైన లేదా అక్కడ ఉన్నవారనే విస్తృత భావాన్ని నిలుపుతుంది; కేవలం దారిన పోయేవారికి పరిమితం చేయదు.
theological_decisions:
- issue: τοῖς σεβομένοις అనే వర్గం యొక్క గుర్తింపు
  choice: దేవుణ్ణి ఆరాధించేవారు
  alternative: దేవభయంగలవారు
  rationale: ప్రధాన పాఠంలో సాధారణ పాఠకునికి అర్థమయ్యే కార్యాత్మక వర్ణనను ఉంచి, యూదుల ఆరాధనతో అనుబంధమున్న యూదేతరులనే సాధ్యమైన ప్రత్యేక భావాన్ని పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. గ్రీకు వాక్యంలోని ఒకే అసంపూర్ణ క్రియ రెండు ప్రదేశాలకు వర్తించడాన్ని తెలుగులో స్పష్టత కోసం రెండో భాగంలో పునరుక్తి చేశాం. అన్ని పాదటిప్పణి సూచికలు సంబంధిత పదాల వెంట ప్రధాన పాఠంలో ఉంచబడ్డాయి.
