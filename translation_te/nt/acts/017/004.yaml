id: ACT.17.4
reference: Acts 17:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καί τινες ἐξ αὐτῶν ἐπείσθησαν καὶ προσεκληρώθησαν τῷ Παύλῳ καὶ τῷ Σιλᾷ, τῶν τε σεβομένων Ἑλλήνων ⸂πλῆθος πολὺ⸃ γυναικῶν τε τῶν πρώτων οὐκ ὀλίγαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/004.yaml
  text: And some of them were persuaded and joined Paul and Silas[a], along with a large number of the God-fearing Greeks and not a few of the leading women.
translation:
  language: te
  text: వారిలో కొందరు ఒప్పించబడి పౌలు, సీలలతో జత కలిశారు.[a] దేవుణ్ణి ఆరాధించే గ్రీకులలో పెద్ద సంఖ్యలోవారూ, ప్రముఖ స్త్రీలలో కొద్దిమంది కానివారూ కూడా పౌలు, సీలలతో జత కలిశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “పౌలు, సీలలతో తమ భాగ్యాన్ని కలుపుకున్నారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινες ἐξ αὐτῶν
  choice: వారిలో కొందరు
  rationale: మునుపటి వచనంలోని సమాజమందిరపు శ్రోతలను సూచించే భాగార్థక ప్రయోగాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπείσθησαν
  choice: ఒప్పించబడి
  rationale: ఇక్కడ వాడిన πείθω అనే క్రియకు అనుగుణంగా ‘విశ్వసించారు’ అని మరింత స్పష్టమైన విశ్వాసపదాన్ని చేర్చకుండా, సందేశం ద్వారా వారు ఒప్పించబడ్డారనే భావాన్ని నిలుపుతుంది.
- source_word: προσεκληρώθησαν
  choice: కలిశారు
  rationale: ఈ అరుదైన క్రియ ఎవరితోనైనా జతచేయబడడం లేదా వారి పక్షంలో చేరడం అనే భావాన్ని ఇస్తుంది. ప్రధాన పాఠ్యంలో ‘కలిశారు’ సహజంగా, స్పష్టంగా ఉంది; మరింత అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: పౌలు, సీలలతో
  rationale: సంబంధాన్ని సూచించే దత్తి విభక్తిని తెలుగులో సహజమైన ‘తో’ రూపంతో వ్యక్తం చేస్తుంది.
- source_word: τῶν τε σεβομένων Ἑλλήνων
  choice: దేవుణ్ణి ఆరాధించే గ్రీకులు
  rationale: అపొస్తలుల కార్యాలలో ఈ పదబంధం ఇశ్రాయేలు దేవుణ్ణి ఆరాధిస్తూ యూదుల సమాజమందిరంతో అనుబంధమున్న అన్యజనులను సూచిస్తుంది. తెలుగులో ఈ రూపం చారిత్రక-మతపరమైన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: πλῆθος πολὺ
  choice: పెద్ద సంఖ్యలో
  rationale: గణనీయమైన సంఖ్యను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: γυναικῶν τε τῶν πρώτων
  choice: ప్రముఖ స్త్రీలు
  rationale: πρῶτος ఇక్కడ కాలక్రమాన్ని కాక సామాజిక ప్రాముఖ్యతను లేదా ఉన్నత స్థానాన్ని సూచిస్తుంది.
- source_word: οὐκ ὀλίγαι
  choice: కొద్దిమంది కాకుండా
  rationale: లూకా వాడిన వ్యతిరేకోక్తిని ‘చాలామంది’గా సరళీకరించకుండా నిలుపుతుంది.
- source_word: τε ... τε
  choice: అలాగే ... నూ ... నూ
  rationale: మొదటి గుంపుతో పాటు మరో రెండు గుంపులను చేర్చే గ్రీకు నిర్మాణాన్ని తెలుగులో సహజమైన అనుసంధానంతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἐπείσθησαν అనే పదాన్ని స్పష్టమైన మార్పు లేదా విశ్వాస భాషతో అనువదించాలా
  choice: ఒప్పించబడి
  alternative: విశ్వసించి
  rationale: సందర్భం సువార్త ప్రకటనకు వచ్చిన స్పందనను వివరిస్తున్నా, గ్రీకులో πιστεύω కాక πείθω వాడబడింది. అందువల్ల పదభేదాన్ని నిలిపి, మూలపాఠం కంటే భావాన్ని మరింత నిర్దిష్టం చేయలేదు.
- issue: σεβομένων Ἑλλήνων యొక్క మతపరమైన గుర్తింపును ఎంత స్పష్టంగా చెప్పాలి
  choice: దేవుణ్ణి ఆరాధించే గ్రీకులు
  alternative: భక్తిగల గ్రీకులు
  rationale: అపొస్తలుల కార్యాలలోని చారిత్రక సందర్భంలో వీరు యూదుల ఆరాధనతో అనుబంధమున్న అన్యజనులు. ‘దేవుణ్ణి ఆరాధించే’ అనే రూపం అస్పష్టమైన సాధారణ భక్తికంటే మూలంలోని భావాన్ని స్పష్టంగా అందిస్తుంది; ప్రత్యేక సిద్ధాంతాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ఒప్పించబడి’ మూలంలోని కర్మణి భావాన్ని కాపాడుతుంది; ‘కొద్దిమంది కాకుండా’ మూలంలోని వ్యతిరేకోక్తిని నిలుపుతుంది.
