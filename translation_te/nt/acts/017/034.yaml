source:
  edition: SBLGNT
  text: τινὲς δὲ ἄνδρες κολληθέντες αὐτῷ ἐπίστευσαν, ἐν οἷς καὶ Διονύσιος ὁ Ἀρεοπαγίτης καὶ γυνὴ ὀνόματι Δάμαρις καὶ ἕτεροι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/034.yaml
  text: But some men joined him and believed[a], among whom were also Dionysius the Areopagite, and a woman named Damaris[b], and others with them.
translation:
  language: te
  text: అయితే కొందరు పురుషులు అతనితో చేరి విశ్వసించారు.[a] వారిలో అరియోపగీయుడైన దియొనూసియు, దామరి అనే ఒక స్త్రీ, వారితో పాటు ఇతరులు కూడా ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతనితో చేరి’ అనే మాటను ‘అతనితో సన్నిహితంగా కలిశారు’ లేదా ‘అతనికి అంటిపెట్టుకున్నారు’ అని కూడా అనువదించవచ్చు; గ్రీకు పదం పౌలుతో దగ్గరి వ్యక్తిగత అనుబంధాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ ἄνδρες
  choice: అయితే కొందరు పురుషులు
  rationale: ముందటి వచనంలోని ప్రతికూల స్పందనలకు స్వల్ప వ్యతిరేకతను δὲ సూచిస్తుంది; ἄνδρες ఇక్కడ స్పష్టంగా పురుషులను సూచిస్తుంది.
- source_word: κολληθέντες αὐτῷ
  choice: అతనితో చేరి
  rationale: కొల్లావొమై అనే క్రియ పౌలుతో సన్నిహితంగా కలవడం లేదా అతనికి అంటిపెట్టుకోవడం అనే భావాన్ని ఇస్తుంది; సహజమైన తెలుగులో ‘చేరి’ ఆ వ్యక్తిగత అనుబంధాన్ని తెలియజేస్తుంది.
- source_word: ἐπίστευσαν
  choice: విశ్వసించారు
  rationale: క్రియకు పేర్కొన్న కర్మ లేదు; అందువల్ల ‘పౌలును విశ్వసించారు’ అని అర్థాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా మూలంలోని సంక్షిప్తతను నిలుపుతుంది.
- source_word: ἐν οἷς καὶ
  choice: వారిలో
  rationale: విశ్వసించినవారిలో పేరుపేరున చెప్పబడిన వ్యక్తులను పరిచయం చేసే సహజమైన తెలుగు నిర్మాణం.
- source_word: Διονύσιος ὁ Ἀρεοπαγίτης
  choice: అరియోపగీయుడైన దియొనూసియు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు తగిన విధంగా లిప్యంతరీకరించి, Ἀρεοπαγίτης అనే సంబంధసూచక బిరుదును అనువదించింది; దాని కచ్చితమైన సంస్థాగత భావాన్ని పాదటిప్పణిలో తెరిచి ఉంచింది.
- source_word: γυνὴ ὀνόματι Δάμαρις
  choice: దమరి అనే స్త్రీ
  rationale: లింగాన్ని, వ్యక్తి పేరును రెండింటినీ స్పష్టంగా ఉంచే సహజమైన ఆధునిక తెలుగు వ్యక్తీకరణ.
- source_word: ἕτεροι σὺν αὐτοῖς
  choice: వారితోపాటు మరికొందరు
  rationale: పేర్లు చెప్పబడిన ఇద్దరితో కూడిన అదనపు వ్యక్తులను సూచించే σύν మరియు ἕτεροι భావాలను సంక్షిప్తంగా అందిస్తుంది.
theological_decisions:
- issue: ఈ సందర్భంలో πιστεύω స్వభావం
  choice: విశ్వసించారు
  alternative: విశ్వాసంలోకి వచ్చారు
  rationale: పౌలు ప్రకటించిన సందేశానికి వారు నిజంగా విశ్వాసంతో స్పందించారని సందర్భం సూచించినా, మూలపాఠం ఇక్కడ పూర్తి సిద్ధాంతపరమైన సూత్రీకరణను ఇవ్వదు. కాబట్టి సరళమైన క్రియారూపం ఆ ఉద్రిక్తతను, సంక్షిప్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘పురుషులు’ ద్వారా మూలంలోని స్పష్టమైన పుంలింగ సూచన నిలుపబడింది. సాంకేతిక గ్రీకు బిరుదును ప్రధాన పాఠంలో సంక్షిప్తంగా ఉంచి, దాని సాంస్కృతిక అస్పష్టతను పాదటిప్పణిలో వివరించాం.
