  terminology: «విశ్వసించారు» appropriately leaves the implicit object of ἐπίστευσαν unspecified. «అరియోపగీయుడైన» and the explanatory note preserve the noncommittal sense of Ἀρεοπαγίτης without asserting that Dionysius certainly held council membership.
