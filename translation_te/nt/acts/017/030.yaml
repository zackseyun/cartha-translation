source:
  edition: SBLGNT
  text: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας ὑπεριδὼν ὁ θεὸς τὰ νῦν ⸀παραγγέλλει τοῖς ἀνθρώποις ⸀πάντας πανταχοῦ μετανοεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/030.yaml
  text: Therefore[a], having overlooked the times of ignorance, God now commands all people everywhere to repent[b],
translation:
  language: te
  text: కాబట్టి, అజ్ఞానపు కాలాలను ఉపేక్షించిన[a] దేవుడు ఇప్పుడు మనుషులందరికీ[b] ప్రతిచోటా పశ్చాత్తాపపడమని ఆజ్ఞాపిస్తున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఉపేక్షించిన’ అంటే ఆ కాలాల అజ్ఞానాన్ని దేవుడు ఆమోదించాడని కాదు; ఆయన వెంటనే తీర్పు తీర్చకుండా సహించాడనే భావం.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులోని ‘మనుషులు’ అనే పదం ఇక్కడ పురుషులకు మాత్రమే కాక మానవులందరికీ వర్తిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας
  choice: కాబట్టి, అజ్ఞానపు కాలాలను
  rationale: οὖν సూచించే వాక్యసంబంధ పరిణామాన్ని ‘కాబట్టి’ తెలియజేస్తుంది. μὲν మరియు τὰ νῦν మధ్యనున్న గత–వర్తమాన వ్యత్యాసం తెలుగు వాక్యంలో ‘ఇప్పుడు’ ద్వారా సహజంగా వ్యక్తమవుతుంది. τῆς ἀγνοίας‌ను అదనపు వివరణ చేర్చకుండా ‘అజ్ఞానపు’ అని అనువదించాం.
- source_word: ὑπεριδὼν
  choice: ఉపేక్షించిన
  rationale: ఈ భూతకాల కృదంతం దేవుడు ఆ కాలాలపై వెంటనే తీర్పు అమలు చేయకుండా సహించిన భావాన్ని ఇస్తుంది. ‘ఉపేక్షించిన’ మూలంలోని సంక్షిప్తతను, అలాగే ఆ చర్యలోని ఉద్దేశపూర్వకంగా దాటివెళ్లే భావాన్ని నిలుపుతుంది.
- source_word: ὁ θεὸς τὰ νῦν παραγγέλλει
  choice: దేవుడు ఇప్పుడు ... ఆజ్ఞాపిస్తున్నాడు
  rationale: τὰ νῦν గతంలోని అజ్ఞాన కాలాలకు భిన్నమైన ప్రస్తుత పరిస్థితిని సూచిస్తుంది; παραγγέλλει‌లోని అధికారపూర్వక ఆదేశ భావాన్ని ‘ఆజ్ఞాపిస్తున్నాడు’ స్పష్టంగా నిలుపుతుంది.
- source_word: τοῖς ἀνθρώποις πάντας πανταχοῦ
  choice: ప్రతిచోటా ఉన్న మనుషులందరూ
  rationale: ἄνθρωποι ఇక్కడ పురుషులకు మాత్రమే కాక సమస్త మానవులకు వర్తించే సాధారణ పదం. πάντας మరియు πανταχοῦ కలిపి వ్యక్తుల పరంగా, స్థల పరంగా ఆజ్ఞ యొక్క సార్వత్రిక పరిధిని తెలియజేస్తాయి.
- source_word: μετανοεῖν
  choice: పశ్చాత్తాపపడాలని
  rationale: μετανοεῖν కేవలం ఆలోచన మార్చుకోవడమే కాక దేవుని వైపు నైతికంగా తిరిగే భావాన్నీ కలిగి ఉంది. ఆధునిక ప్రామాణిక తెలుగులో ‘పశ్చాత్తాపపడడం’ ఈ బైబిలీయ భావాన్ని సహజంగా, సంక్షిప్తంగా అందిస్తుంది.
theological_decisions:
- issue: అజ్ఞానపు కాలాల విషయంలో దేవుని మునుపటి చర్య అర్థం
  choice: ‘ఉపేక్షించిన’ అంటే వెంటనే తీర్పు తీర్చకుండా సహించడం
  alternative: ఆ అజ్ఞానాన్ని దేవుడు ఆమోదించాడు లేదా పాపాన్ని పూర్తిగా పట్టించుకోలేదు
  rationale: ὑπεριδών దైవిక సహనాన్ని సూచించగలిగినా, వెంటనే వచ్చే పశ్చాత్తాప ఆజ్ఞ నైతిక బాధ్యతను కొనసాగిస్తుంది. అనువాదం ఈ ఉద్రిక్తతను తొలగించదు; పాదటిప్పణి ఉపేక్షను ఆమోదంగా అపార్థం చేసుకోకుండా వివరిస్తుంది.
- issue: పశ్చాత్తాప ఆజ్ఞ యొక్క పరిధి
  choice: ప్రతిచోటా ఉన్న సమస్త మనుషులకు వర్తించే సార్వత్రిక ఆజ్ఞ
  alternative: పురుషులకు మాత్రమే లేదా అన్యజనులకు మాత్రమే ఇచ్చిన ఆజ్ఞ
  rationale: τοῖς ἀνθρώποις πάντας πανταχοῦ మానవులందరినీ, అన్ని ప్రదేశాల్లోనూ సమగ్రంగా సూచిస్తుంది. ‘మనుషులందరూ’ లింగపరంగా సంకుచితం చేయకుండా మూలార్థాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ప్రసంగ సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. ‘ఉపేక్షించిన’ మరియు ‘పశ్చాత్తాపపడాలని’ వంటి స్థిరమైన పదాలు మూలంలోని దైవిక సహనం, అధికారపూర్వక ఆజ్ఞ, నైతిక మలుపు అనే భావాలను అతివ్యాఖ్యానం లేకుండా నిలుపుతాయి.
