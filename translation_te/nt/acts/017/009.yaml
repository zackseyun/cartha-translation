id: ACT.17.9
reference: Acts 17:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λαβόντες τὸ ἱκανὸν παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν ἀπέλυσαν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/009.yaml
  text: And after taking security from Jason and the others[a], they released them.
translation:
  language: te
  text: యాసోను మరియు ఇతరుల నుండి పూచీకత్తు[a] తీసుకున్న తరువాత, వారిని విడుదల చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తగిన మొత్తాన్ని.” ఇది శాంతియుత ప్రవర్తనకు హామీగా సమర్పించిన చట్టపరమైన లేదా ధనపరమైన పూచీ అయి ఉండవచ్చు.
    reason: గ్రీకు τὸ ἱκανόν అక్షరార్థంగా ‘తగినది’ లేదా ‘తగిన మొత్తం’ అని అర్థం. ఈ సందర్భంలో అది చట్టపరమైన భద్రత లేదా హామీని సూచించే అవకాశం ఉంది.
lexical_decisions:
- source_word: λαβόντες
  choice: తీసుకున్న తరువాత
  rationale: అనంతరం జరిగిన ప్రధాన క్రియకు ముందు పూర్తయిన చర్యను సూచించే భూతకాల అసమాపక క్రియారూపం; తెలుగులో సహజంగా చర్యల క్రమాన్ని తెలియజేస్తుంది.
- source_word: τὸ ἱκανὸν
  choice: పూచీకత్తు
  rationale: ఈ న్యాయపరమైన సందర్భంలో తగిన హామీగా తీసుకున్న ధనం లేదా భద్రతను సూచించే గ్రీకు నుడికారానికి ఇది సహజమైన తెలుగు సమానం. నిర్దిష్ట ఆధునిక న్యాయవ్యవస్థకు చెందిన ‘బెయిల్’ వంటి పదాన్ని ఉపయోగించలేదు.
- source_word: παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν
  choice: యాసోను నుంచీ మిగిలినవారి నుంచీ
  rationale: παρά + షష్ఠీ విభక్తి మూలాన్ని, అంటే ఎవరి దగ్గర నుంచి తీసుకున్నారో సూచిస్తుంది; λοιποί ఇక్కడ అతనితో ఉన్న మిగతా వ్యక్తులను సూచిస్తుంది.
- source_word: ἀπέλυσαν
  choice: విడుదల చేశారు
  rationale: పౌర లేదా న్యాయపరమైన సందర్భంలో నిర్బంధంలో ఉన్నవారిని వెళ్లనివ్వడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: αὐτούς
  choice: వారిని
  rationale: అదుపులోకి తీసుకోబడిన యాసోను మరియు ఇతరులను సూచించే బహువచన సర్వనామం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయపరమైన శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలో కర్త స్పష్టంగా లేకపోవడంతో తెలుగులోనూ కొత్త కర్తను చేర్చలేదు.
