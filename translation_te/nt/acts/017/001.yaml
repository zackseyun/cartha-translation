source:
  edition: SBLGNT
  text: Διοδεύσαντες δὲ τὴν Ἀμφίπολιν καὶ ⸀τὴν Ἀπολλωνίαν ἦλθον εἰς Θεσσαλονίκην, ὅπου ⸀ἦν συναγωγὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/001.yaml
  text: After passing through Amphipolis and Apollonia[a], they came to Thessalonica[b], where there was a synagogue of the Jews.
translation:
  language: te
  text: వారు అంఫిపొలి, అపొల్లోనియ మీదుగా ప్రయాణించి థెస్సలొనీకకు వచ్చారు. అక్కడ యూదుల సమాజమందిరం ఒకటి ఉండేది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διοδεύσαντες
  choice: పట్టణాల గుండా వెళ్లి
  rationale: ఈ భూతకాల కృదంతం ప్రధాన క్రియకు ముందుగా జరిగిన ప్రయాణాన్ని సూచిస్తుంది. ‘గుండా వెళ్లి’ అనేది ఆ పట్టణాల మీదుగా ప్రయాణించిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది స్వల్ప కథన అనుసంధానాన్ని మాత్రమే సూచిస్తుంది; తెలుగులో వాక్యప్రవాహమే ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: Ἀμφίπολιν καὶ Ἀπολλωνίαν
  choice: అంఫిపొలి, అపొల్లోనియ పట్టణాలు
  rationale: స్థలనామాలను తెలుగు లిపిలో ధ్వన్యనుసారంగా ఇచ్చాం. ఇవి పట్టణాలని పాఠకుడికి వెంటనే స్పష్టమయ్యేలా ‘పట్టణాలు’ చేర్చాం.
- source_word: ἦλθον εἰς Θεσσαλονίκην
  choice: థెస్సలొనీకకు వచ్చారు
  rationale: ἔρχομαι అనే సాధారణ గమన క్రియను ‘వచ్చారు’గా, εἰς సూచించే గమ్యాన్ని ‘కు’ విభక్తితో సహజంగా వ్యక్తం చేశాం.
- source_word: συναγωγὴ τῶν Ἰουδαίων
  choice: యూదుల సమాజమందిరం ఒకటి
  rationale: συναγωγήకి సాధారణ తెలుగు బైబిలు వాడుకలో అర్థమయ్యే ‘సమాజమందిరం’ను ఎంచుకున్నాం. గ్రీకులో నిర్దేశక ఉపపదం లేకపోవడాన్ని ‘ఒకటి’ ద్వారా ప్రతిబింబించాం.
theological_decisions:
- issue: Ἰουδαίων అనే పదానికి సందర్భానుసారమైన అర్థం
  choice: యూదుల
  alternative: యూదయవాసుల
  rationale: ఇక్కడ ఈ పదం థెస్సలొనీకలోని సమాజమందిరంతో సంబంధమున్న యూద సముదాయాన్ని సూచిస్తుంది; భౌగోళికంగా యూదయ నివాసులనే పరిమితం చేయడం సందర్భానికి తగదు.
- issue: నిర్దేశక ఉపపదం లేని συναγωγή అనువాదం
  choice: సమాజమందిరం ఒకటి
  alternative: ఆ సమాజమందిరం
  rationale: గ్రీకు మూలంలో συναγωγή ముందు నిర్దేశక ఉపపదం లేదు. కాబట్టి నిర్దిష్టమైన ‘ఆ సమాజమందిరం’ అని కాకుండా, అక్కడ ఒక యూదుల సమాజమందిరం ఉందనే భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని కృదంత నిర్మాణాన్ని సహజ తెలుగు సంయుక్త క్రియగా మార్చి, స్థలనామాలను ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
