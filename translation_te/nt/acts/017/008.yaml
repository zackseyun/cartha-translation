    rationale: 'The draft’s ‘వారు ఈ మాటలు విన్నప్పుడు’ states that the unnamed people who caused disturbance heard the words. The Greek accusative participle ἀκούοντας modifies τὸν ὄχλον καὶ τοὺς πολιτάρχας: the crowd and city officials were the hearers.'
