  yaml_path: translation/nt/acts/017/008.yaml
  text: And they disturbed the crowd and the city officials when they heard these things,[a]
translation:
  language: te
  text: ఈ మాటలు విన్న జనసమూహాన్నీ నగర అధికారులనూ[a] వారు కలవరపరిచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో ‘పొలిటార్కులు’; ఇది పౌర అధికారులకు వాడిన స్థానిక మాసిదోనియా బిరుదు.
    reason: cultural_note
lexical_decisions:
- source_word: ἐτάραξαν
  choice: కలవరపరిచారు
  rationale: ఈ క్రియ అంతరంగిక ఆందోళనతో పాటు సామాజిక అశాంతిని కలిగించడాన్ని కూడా సూచించగలదు. ‘కలవరపరిచారు’ అనే పదం జనసమూహానికీ అధికారులకీ సహజంగా వర్తిస్తుంది; మూలంలో ఉన్నదానికంటే ప్రభావాన్ని అతిశయింపజేయదు.
- source_word: δὲ
  choice: సందర్భానుసారంగా ప్రత్యేక సంధాయక పదం లేకుండా
  rationale: δέ ఇక్కడ కథనాన్ని ముందుకు నడిపే స్వల్ప సంధాయకం. తెలుగులో వాక్యప్రవాహం సహజంగా ఉండేందుకు దాన్ని ప్రత్యేకంగా అనువదించకపోవడం సముచితం.
- source_word: ὄχλον
  choice: జనసమూహం
  rationale: ὄχλος తటస్థంగా గుమికూడిన ప్రజలను సూచిస్తుంది. ‘జనసమూహం’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంటుంది; ‘అల్లరిమూక’ అనవసరమైన శత్రుత్వ భావాన్ని చేర్చుతుంది.
- source_word: πολιτάρχας
  choice: నగర అధికారులు
  rationale: πολιτάρχης మాసిదోనియాలో వాడిన స్థానిక పౌర పరిపాలనా బిరుదు. ‘నగర అధికారులు’ సాధారణ పాఠకులకు అర్థవంతంగా ఉండి పదం యొక్క విస్తృత అధికార భావాన్ని నిలుపుతుంది; నిర్దిష్ట న్యాయపదవిని సూచించదు.
- source_word: ἀκούοντας ταῦτα
  choice: వారు ఈ మాటలు విన్నప్పుడు
  rationale: వర్తమాన కృదంతం జనసమూహానికీ నగర అధికారులకీ వర్తిస్తుంది. కాలార్థక ఉపవాక్యంగా అనువదించడం తెలుగులో సహజం; ‘ఈ మాటలు’ ταῦτα యొక్క బహువచన భావాన్ని సందర్భోచితంగా తెలియజేస్తుంది.
