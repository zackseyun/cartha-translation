translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి. మూలవాక్యంలోని కారణ-కాల సంబంధాన్ని, రెండు కర్మలపై క్రియ ప్రభావాన్ని స్పష్టంగా ఉంచాం.
