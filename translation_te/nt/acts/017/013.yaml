id: ACT.17.13
reference: Acts 17:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς δὲ ἔγνωσαν οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι ὅτι καὶ ἐν τῇ Βεροίᾳ κατηγγέλη ὑπὸ τοῦ Παύλου ὁ λόγος τοῦ θεοῦ, ἦλθον κἀκεῖ σαλεύοντες ⸂καὶ ταράσσοντες⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/013.yaml
  text: But when the Jews from Thessalonica learned that the word of God had been proclaimed by Paul in Berea also[a], they came there too[b], stirring up and troubling the crowds.
translation:
  language: te
  text: అయితే, బెరయలో కూడా పౌలు ద్వారా దేవుని వాక్యం ప్రకటించబడిందని తెస్సలొనీక నుంచి వచ్చిన యూదులు తెలుసుకున్నప్పుడు, వారు అక్కడికీ వచ్చి జనసమూహాలను రెచ్చగొట్టడానికి, కలవరపరచడానికి ప్రయత్నించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘జనసమూహాలను కదిలిస్తూ, కలవరపరుస్తూ.’ ఈ రెండు గ్రీకు క్రియల అర్థాలు కొంతవరకు ఒకదానితో ఒకటి కలుస్తాయి; కలిసి అవి ప్రజల్లో తీవ్రమైన అశాంతిని రేపడాన్ని సూచిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: అయితే, ...ప్పుడు
  rationale: δέ సూచించే కథన మలుపును ‘అయితే’తో, ὡς యొక్క కాలసంబంధ భావాన్ని ‘తెలుసుకున్నప్పుడు’ అనే నిర్మాణంతో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔγνωσαν
  choice: తెలుసుకున్నారు
  rationale: ఇక్కడ γινώσκω సమాచారం తెలిసికొనడాన్ని సూచిస్తుంది; ‘తెలుసుకున్నారు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంది.
- source_word: οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι
  choice: తెస్సలొనీక నుంచి వచ్చిన యూదులు
  rationale: ఇది యూదులందరినీ కాక, తెస్సలొనీకకు చెందిన నిర్దిష్ట సమూహాన్ని సూచిస్తుందని స్పష్టపరుస్తుంది.
- source_word: ὅτι καὶ ἐν τῇ Βεροίᾳ
  choice: బెరయలో కూడా
  rationale: καί ఇక్కడ అదనపు స్థలమైన బెరయను ప్రత్యేకంగా సూచిస్తుంది; ‘కూడా’ ఆ భావాన్ని నిలుపుతుంది.
- source_word: κατηγγέλη ὑπὸ τοῦ Παύλου
  choice: పౌలు ... ప్రకటించాడని
  rationale: గ్రీకు వాక్యంలో కర్మణి ప్రయోగం ఉన్నప్పటికీ, కర్తయైన పౌలును ముందుకు తెచ్చే కర్తరి ప్రయోగం తెలుగులో మరింత సహజం; బహిరంగంగా తెలియజేయడం అనే καταγγέλλω భావాన్ని ‘ప్రకటించాడు’ నిలుపుతుంది.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: దేవుని వాక్యం
  rationale: దేవుని నుంచి వచ్చిన ప్రకటిత సందేశం అనే భావంతో పాటు, ఈ స్థిరమైన బైబిలు పదబంధపు వేదాంత ప్రతిధ్వనిని కూడా నిలుపుతుంది.
- source_word: ἦλθον κἀκεῖ
  choice: వారు అక్కడికి కూడా వచ్చి
  rationale: κἀκεῖలోని ‘అక్కడికి కూడా’ అనే విస్తరణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: σαλεύοντες
  choice: రెచ్చగొడుతూ
  rationale: ప్రజల్లో అశాంతిని రేపడం, వారిని కదిలించడం అనే సందర్భోచిత భావాన్ని తెలియజేస్తుంది.
- source_word: καὶ ταράσσοντες
  choice: కలవరపరుస్తూ
  rationale: అశాంతి లేదా గందరగోళం కలిగించడం అనే రెండవ, అనుబంధ భావాన్ని మొదటి క్రియలో కలిపేయకుండా నిలుపుతుంది.
- source_word: τοὺς ὄχλους
  choice: జనసమూహాలను
  rationale: ὄχλοι అనే బహువచనాన్ని తటస్థంగా, ‘మూకలు’ అని అతిశయింపకుండా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ὁ λόγος τοῦ θεοῦ అనువాదం
  choice: దేవుని వాక్యం
  alternative: దేవుని సందేశం
  rationale: ‘దేవుని వాక్యం’ ప్రకటించబడుతున్న దైవిక సందేశాన్ని సూచించే సుపరిచితమైన పదబంధం; అదే సమయంలో సందర్భానికి మించిన సాంకేతిక అర్థాన్ని బలవంతంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే కథన గౌరవం మరియు మూలంలోని రెండు వేర్వేరు క్రియల బలాన్ని నిలుపుకుంది.
