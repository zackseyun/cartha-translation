id: ACT.17.5
reference: Acts 17:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ζηλώσαντες δὲ οἱ Ἰουδαῖοι καὶ προσλαβόμενοι⸃ τῶν ἀγοραίων ⸂ἄνδρας τινὰς⸃ πονηροὺς καὶ ὀχλοποιήσαντες ἐθορύβουν τὴν πόλιν, ⸂καὶ ἐπιστάντες⸃ τῇ οἰκίᾳ Ἰάσονος ἐζήτουν αὐτοὺς ⸀προαγαγεῖν εἰς τὸν δῆμον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/005.yaml
  text: But the Jews[a], becoming jealous and taking along some wicked men from the marketplace, formed a mob and were throwing the city into an uproar; and coming to Jason’s house, they were seeking to bring them out to the assembly.
translation:
  language: te
  text: అయితే యూదులు అసూయపడి, సంతలో ఉన్న కొందరు దుష్ట మనుష్యులను తమతో చేర్చుకొని, ఒక మూకను కూడగట్టి, పట్టణాన్ని అల్లకల్లోలం చేస్తూ, యాసోను ఇంటికి వచ్చి, వారిని బయటకు తీసుకువచ్చి ప్రజాసభకు తీసుకురావాలని ప్రయత్నించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζηλώσαντες
  choice: అసూయపడి
  rationale: ఈ సందర్భంలో చర్యలకు ప్రేరణ అయిన అసూయను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కృదంత నిర్మాణం ప్రధాన చర్యలకు ముందున్న కారణాన్ని సూచిస్తుంది.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: గ్రీకు పాఠంలో ఉన్న సామూహిక పదాన్ని సంకుచితం చేయకుండా నేరుగా అనువదిస్తుంది. సందర్భంలో ఇది థెస్సలొనీకలోని ఒక వర్గాన్ని సూచిస్తుంది; యూదులందరినీ కాదు.
- source_word: προσλαβόμενοι
  choice: తమతో చేర్చుకొని
  rationale: ఇతరులను తమ పక్షాన కలుపుకున్నారనే మధ్యమవాచక భావాన్ని చూపుతుంది; వారిని కూలికి పెట్టుకున్నారని అనవసరంగా నిర్ధారించదు.
- source_word: τῶν ἀγοραίων
  choice: సంతలోని
  rationale: ἀγοράతో సంబంధమున్న స్థలార్థాన్ని సహజంగా తెలియజేస్తుంది; ‘పనిలేక తిరిగేవారు’ వంటి అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: ἄνδρας τινὰς πονηρούς
  choice: కొందరు దుష్టులను
  rationale: τινάς యొక్క అనిర్దిష్టతను, πονηρούς యొక్క ప్రతికూల నైతిక భావాన్ని నిలుపుతుంది. తెలుగులో వ్యక్తులను సూచించే సందర్భం స్పష్టంగా ఉండడం వల్ల ‘మనుష్యులు’ అనే పదాన్ని వేరుగా చేర్చాల్సిన అవసరం లేదు.
- source_word: ὀχλοποιήσαντες
  choice: ఒక మూకను తయారుచేశారు
  rationale: కేవలం తటస్థమైన జనసమూహం కాక, కల్లోలం సృష్టించడానికి కూడిన శత్రుత్వపూరిత గుంపు అనే సందర్భార్థాన్ని ‘మూక’ తెలియజేస్తుంది.
- source_word: ἐθορύβουν τὴν πόλιν
  choice: పట్టణాన్ని అల్లకల్లోలం చేస్తూ
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న చర్యను ‘చేస్తూ’ నిలుపుతూ, θορυβέω యొక్క కల్లోల భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἐπιστάντες τῇ οἰκίᾳ Ἰάσονος
  choice: యాసోను ఇంటికి వచ్చి
  rationale: కథన క్రమంలో ఆ ఇంటివద్దకు చేరుకున్నారనే భావాన్ని ఇస్తుంది; గ్రీకు పదం స్పష్టంగా చెప్పనంతగా ‘దాడి చేశారు’ అని బలపరచదు.
- source_word: ἐζήτουν
  choice: ప్రయత్నించారు
  rationale: ఇక్కడ అనుసరించే ఉద్దేశార్థక క్రియతో కలిసి, వారిని బయటకు తీసుకురావడానికి చేసిన కొనసాగుతున్న ప్రయత్నాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: αὐτούς
  choice: వారిని
  rationale: సందర్భం ద్వారా గుర్తించగల సర్వనామాన్ని గ్రీకు పాఠం మాదిరిగానే నిలుపుతుంది; ‘పౌలు, సీల’ అని వివరణాత్మకంగా మార్చదు.
- source_word: προαγαγεῖν
  choice: బయటకు తీసుకొచ్చి … ఎదుట నిలబెట్టాలని
  rationale: ఇంటి నుంచి బయటకు తీసుకురావడం, ప్రజా సంస్థ ముందు హాజరుపరచడం అనే సందర్భంలోని రెండు దిశలను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰς τὸν δῆμον
  choice: ప్రజాసభ ఎదుట
  rationale: δῆμος ఇక్కడ సాధారణ గుంపును కాక, బహిరంగంగా కూడిన పౌర సమాజాన్ని సూచిస్తుంది. ‘ప్రజాసభ’ దాని సంస్థాగత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఘర్షణ కథనంలో οἱ Ἰουδαῖοι అనువాదం
  choice: యూదులు
  alternative: యూదుల నాయకులు / యూదయవారు
  rationale: మూలపాఠం చెప్పినదానికంటే సూచనను ‘నాయకులు’ అని సంకుచితం చేయకుండా, ‘యూదయవారు’ అని భౌగోళికంగా మార్చకుండా ఉంచబడింది. సందర్భం థెస్సలొనీకలోని ఒక నిర్దిష్ట యూదుల వర్గాన్ని సూచిస్తుంది; అన్ని కాలాల యూదులందరినీ కాదు.
- issue: δῆμος యొక్క ప్రజా-పౌర భావం
  choice: ప్రజాసభ
  alternative: ప్రజలు / జనసమూహం
  rationale: ఈ పదం కేవలం అదుపులేని గుంపును సూచిస్తుందని భావించకుండా, బహిరంగంగా కూడిన పౌర సమాజం లేదా సభ అనే చారిత్రక భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘మూక’, ‘అల్లకల్లోలం’, ‘ప్రజాసభ’ వంటి పదాలు మూలంలోని శత్రుత్వం, కొనసాగుతున్న కల్లోలం, పౌరసభ స్వభావాన్ని సంక్షిప్తంగా నిలుపుతాయి.
