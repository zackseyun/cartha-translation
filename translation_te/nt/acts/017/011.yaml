id: ACT.17.11
reference: Acts 17:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτοι δὲ ἦσαν εὐγενέστεροι τῶν ἐν Θεσσαλονίκῃ, οἵτινες ἐδέξαντο τὸν λόγον μετὰ πάσης προθυμίας, ⸀τὸ καθ’ ἡμέραν ἀνακρίνοντες τὰς γραφὰς εἰ ἔχοι ταῦτα οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/011.yaml
  text: These were more noble-minded than those in Thessalonica[a], for they received the word with all eagerness[b], examining the Scriptures daily to see whether these things were so.
translation:
  language: te
  text: వీరు థెస్సలొనీకయలోని వారికంటే మరింత ఉదాత్త మనస్కులు[a]. ఎందుకంటే వారు ఎంతో ఆసక్తితో వాక్యాన్ని స్వీకరించి[b], వారు చెప్పిన ఈ విషయాలు నిజమేనా అని ప్రతిరోజూ లేఖనాలను పరిశీలించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మరింత ఉదాత్తులు.” గ్రీకు పదం ప్రశంసనీయమైన మనోవైఖరిని లేదా—ఇక్కడ తక్కువ సంభావ్యతతో—ఉన్నత సామాజిక స్థితిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “సందేశాన్ని ఆహ్వానించారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐγενέστεροι
  choice: మరింత ఉదాత్త మనస్కులు
  rationale: ఈ తులనాత్మక విశేషణం ఉన్నత సామాజిక స్థితిని లేదా ప్రశంసనీయమైన మనోవైఖరిని సూచించగలదు. తరువాతి వాక్యం వారి ఆసక్తిపూర్వక స్వీకరణను, లేఖన పరిశీలనను వివరిస్తున్నందున ఇక్కడ మనోవైఖరిని సూచించే అనువాదం సందర్భోచితం.
- source_word: οἵτινες
  choice: ఎందుకంటే వారు
  rationale: ఈ సాపేక్ష సర్వనామం వారు ఎందుకు ఉదాత్త మనస్కులని పిలువబడ్డారో వివరించే భావాన్ని పరిచయం చేస్తుంది.
- source_word: ἐδέξαντο τὸν λόγον
  choice: వాక్యాన్ని స్వీకరించి
  rationale: λόγοςకు అపొస్తలుల కార్యములలో ఉన్న కథన, దైవశాస్త్ర ప్రతిధ్వనిని నిలుపుతూ, గ్రీకు నుడికారాన్ని సహజంగా అందిస్తుంది.
- source_word: μετὰ πάσης προθυμίας
  choice: ఎంతో ఆసక్తితో
  rationale: προθυμίαలోని సిద్ధత, ఇష్టం, ఉత్సుకత భావాలను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ πάσης యొక్క తీవ్రతను నిలుపుతుంది.
- source_word: τὸ καθ’ ἡμέραν
  choice: ప్రతిరోజూ
  rationale: ఈ పదబంధపు క్రియావిశేషణ, అలవాటైన చర్య భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀνακρίνοντες
  choice: పరిశీలించారు
  rationale: జాగ్రత్తగా పరీక్షించడం లేదా విచారించడం అనే భావాన్ని ఇక్కడ లేఖనాలను ఆధారంగా చేసుకొని పరిశీలించే సందర్భానికి తగిన విధంగా తెలియజేస్తుంది.
- source_word: τὰς γραφὰς
  choice: లేఖనాలను
  rationale: లూకా–అపొస్తలుల కార్యముల సందర్భంలో ఇది యూదుల పవిత్ర లేఖనాలను సూచిస్తుంది.
- source_word: εἰ ἔχοι ταῦτα οὕτως
  choice: ఈ విషయాలు అలాగే ఉన్నాయో లేదో తెలుసుకోవడానికి
  rationale: εἰతో వచ్చిన optative పరోక్ష విచారణను సూచిస్తుంది; ప్రతిపాదించిన విషయాలను లేఖనాలతో సరిచూసే భావాన్ని ఈ తెలుగు రూపం కాపాడుతుంది.
theological_decisions:
- issue: εὐγενέστεροι యొక్క సందర్భార్థం
  choice: ఉన్నత జన్మ లేదా హోదా కంటే ప్రశంసనీయమైన మనోవైఖరి—‘మరింత ఉదాత్త మనస్కులు’
  alternative: ‘మరింత ఉన్నత వంశస్థులు’ లేదా సాధారణంగా ‘మరింత ఉదాత్తులు’
  rationale: వారి ‘ఉదాత్తతను’ సందేశాన్ని ఆసక్తితో స్వీకరించడం, లేఖనాలను పరిశీలించడం ద్వారా వాక్యమే వివరిస్తుంది. అయినా గ్రీకు పదంలోని సామాజిక స్థితి సంభావ్యతను పాదసూచికలో ఉంచాం.
- issue: λόγος అనువాదం
  choice: ‘వాక్యం’ను ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘సందేశం’
  rationale: ఇది గ్రీకు పదానికి దగ్గరగా ఉండి, అపొస్తలుల కార్యములలోని పదప్రయోగ నిరంతరతను కాపాడుతుంది; సందర్భంలో సాధారణ పాఠకునికి అర్థమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఉదాత్త మనస్కులు,’ ‘వాక్యం,’ ‘లేఖనాలు’ వంటి పదాలు మూలంలోని భావగాంభీర్యాన్ని నిలుపుతాయి; వాక్య నిర్మాణాన్ని తెలుగు పఠనసౌలభ్యానికి అనుగుణంగా రెండు వాక్యాలుగా విభజించాం. మూలంలో స్పష్టమైన కాలసూచక ‘ఇప్పుడు’ లేకపోవడంతో దాన్ని చేర్చలేదు.
