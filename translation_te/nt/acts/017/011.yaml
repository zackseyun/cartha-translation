  terminology: “వాక్యం” and “లేఖనాలు” are appropriate established biblical terms. The footnote appropriately preserves the less likely social-status sense of εὐγενέστεροι, while the main text reflects its contextual sense of commendable disposition. Footnote anchors remain correctly placed.
