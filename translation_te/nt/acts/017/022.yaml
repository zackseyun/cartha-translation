source:
  edition: SBLGNT
  text: Σταθεὶς ⸀δὲ Παῦλος ἐν μέσῳ τοῦ Ἀρείου Πάγου ἔφη· Ἄνδρες Ἀθηναῖοι, κατὰ πάντα ὡς δεισιδαιμονεστέρους ὑμᾶς θεωρῶ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/022.yaml
  text: So Paul[a], standing in the midst of the Areopagus, said, “Men of Athens, I see that in every way you are very religious.”
translation:
  language: te
  text: 'అప్పుడు పౌలు అరేయోపగు మధ్యలో నిలబడి ఇలా అన్నాడు: “అథెన్సు పురుషులారా, మీరు అన్ని విషయాల్లో ఎంతో మతభక్తి గలవారిగా ఉన్నారని నేను గమనిస్తున్నాను.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇతరులకంటే ఎక్కువ మతభక్తి గలవారిగా”; లేదా, “మూఢనమ్మకాలు ఎక్కువగా కలిగినవారిగా.” గ్రీకు పదాన్ని అనుకూలంగానూ ప్రతికూలంగానూ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σταθεὶς
  choice: నిలబడి
  rationale: ఈ భూతకాల అసమాపక క్రియ ప్రసంగానికి ముందు పౌలు తీసుకున్న భంగిమను తెలియజేస్తుంది; ‘నిలబడి’ సహజంగా, సంక్షిప్తంగా దాన్ని వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ δέ కథనంలో స్వల్ప మార్పును సూచిస్తుంది. వ్యతిరేక భావాన్ని అనవసరంగా చేర్చకుండా ‘అప్పుడు’ తెలుగు కథన ప్రవాహాన్ని సహజంగా ఉంచుతుంది.
- source_word: ἐν μέσῳ τοῦ Ἀρείου Πάγου
  choice: అరేయోపగు మధ్యలో
  rationale: మూలంలోని స్థానార్థక భావాన్ని నిలుపుతూ, అది కేవలం సభ ఎదుట అని ముందే నిర్ణయించకుండా అనువదించబడింది.
- source_word: Ἀρείου Πάγου
  choice: అరేయోపగు
  rationale: గ్రీకు స్థల/సభ పేరును సంప్రదాయ రోమీయ సాంస్కృతిక సమానార్థక పేరుతో మార్చకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: ἔφη
  choice: ఇలా అన్నాడు
  rationale: కథనంలో ప్రసంగాన్ని పరిచయం చేసే సాధారణ క్రియగా సహజమైన తెలుగు రూపం.
- source_word: Ἄνδρες Ἀθηναῖοι
  choice: అథెన్సు పురుషులారా
  rationale: సంబోధన రూపాన్నీ, ἄνδρες అనే పురుషవాచక పదాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: κατὰ πάντα
  choice: అన్ని విషయాల్లో
  rationale: పౌలు చేసిన పరిశీలన అన్ని కోణాలకు వర్తిస్తుందనే విస్తృత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὡς
  choice: ఉన్నారని
  rationale: పౌలు గమనించిన విషయాన్ని తెలిపే ఉపవాక్యంతో తెలుగులో సహజంగా అనుసంధానిస్తుంది.
- source_word: δεισιδαιμονεστέρους
  choice: ఎంతో మతభక్తి గలవారిగా
  rationale: ఈ తులనాత్మక విశేషణానికి అనుకూలమైన ‘మతభక్తి’ భావమూ, ప్రతికూలమైన ‘మూఢనమ్మకం’ భావమూ ఉండవచ్చు. ప్రధాన పాఠంలో తటస్థతకు దగ్గరగా, సందర్భోచితంగా మర్యాదగల రూపాన్ని ఎంచుకుని ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచింది.
- source_word: θεωρῶ
  choice: నేను గమనిస్తున్నాను
  rationale: చూసి పరిశీలించడం లేదా గ్రహించడం అనే భావాన్ని ‘గమనిస్తున్నాను’ స్పష్టంగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: δεισιδαιμονεστέρους ద్వారా అథెన్సువాసుల మతాచరణపై పౌలు వ్యక్తం చేసిన స్వరం
  choice: ప్రధాన పాఠంలో తటస్థత నుంచి అనుకూలత వైపు ఉండే ‘ఎంతో మతభక్తి గలవారు’
  alternative: ‘మూఢనమ్మకాలు ఎక్కువగా గలవారు’ లేదా ‘ఇతరులకంటే ఎక్కువ మతభక్తి గలవారు’
  rationale: గ్రీకు పదం ప్రశంసాత్మకంగానూ విమర్శాత్మకంగానూ అర్థమవగలదు; ప్రసంగారంభంలో పౌలు ఉద్దేశించిన స్వరాన్ని ఒకే దిశలో ఖరారు చేయకుండా ప్రధాన పాఠం, పాదసూచిక కలిసి ఆ ఉద్రిక్తతను కాపాడుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహిరంగ ప్రసంగ శైలి వాడబడింది. ‘అరేయోపగు’ అనే పేరు లిప్యంతరీకరించబడింది; మూలంలోని పురుషవాచక సంబోధన ‘అథెన్సు పురుషులారా’గా నిలుపబడింది. సందిగ్ధమైన మతపరమైన విశేషణం ప్రధాన పాఠంలో అతిగా ప్రతికూలంగా చేయకుండా, దాని ప్రత్యామ్నాయ భావాలు పాదసూచికలో ఇవ్వబడ్డాయి.
