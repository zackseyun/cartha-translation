id: ACT.17.16
reference: Acts 17:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς Ἀθήναις ἐκδεχομένου αὐτοὺς τοῦ Παύλου, παρωξύνετο τὸ πνεῦμα αὐτοῦ ἐν αὐτῷ ⸀θεωροῦντος κατείδωλον οὖσαν τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/016.yaml
  text: While Paul was waiting for them in Athens[b][a], his spirit was provoked within him as he saw that the city was full of idols.
translation:
  language: te
  text: పౌలు ఏథెన్సులో వారి కోసం ఎదురుచూస్తుండగా, ఆ నగరం విగ్రహాలతో నిండిపోయి ఉండటం గమనించి, అతని ఆత్మ అతనిలో తీవ్రంగా కలవరపడింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతనిలో తీవ్ర ఉద్రేకం కలిగింది’ లేదా ‘అతని ఆత్మ రగిలిపోయింది’; గ్రీకు క్రియ పదునైన అంతర్గత కలతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδεχομένου
  choice: ఎదురుచూస్తుండగా
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న నిరీక్షణను, అలాగే వాక్యంలోని కాలసంబంధ పరిస్థితిని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: παρωξύνετο
  choice: తీవ్రంగా కలతచెందింది
  rationale: అసంపూర్ణ కాలరూపం సూచించే కొనసాగుతున్న అంతర్గత స్పందనను, క్రియలోని పదునైన ఉద్రేక భావాన్ని కలిపి తెలియజేస్తుంది; కేవలం దుఃఖంగా పరిమితం చేయదు.
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: అతని ఆత్మ
  rationale: స్వామ్య సర్వనామంతో ఉన్న మూలపాఠాన్ని నేరుగా అనుసరిస్తూ, పౌలు అంతరంగ స్పందనను సూచిస్తుంది.
- source_word: ἐν αὐτῷ
  choice: అతనిలో
  rationale: ఆ కలత పౌలు అంతరంగంలో చోటుచేసుకుందని మూలంలోని స్థానార్థక బలాన్ని నిలుపుతుంది.
- source_word: θεωροῦντος
  choice: చూసి
  rationale: జాగ్రత్తగా గమనించడం వల్ల కలిగిన సమకాలిక స్పందనను సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: κατείδωλον
  choice: విగ్రహాలతో నిండివుండడం
  rationale: నగరం విగ్రహాలతో నిండిపోయి ఉన్నదనే అరుదైన విశేషణపు బలాన్ని స్పష్టంగా, అతివ్యాఖ్యానం లేకుండా అందిస్తుంది.
- source_word: πόλιν
  choice: ఆ నగరం
  rationale: ముందే ప్రస్తావించిన ఏథెన్సును సూచించే మూలంలోని ‘నగరం’ అనే పదాన్ని నిలుపుతూ తెలుగు నిర్దేశక రూపంతో స్పష్టత ఇస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది బలమైన వ్యతిరేకతకన్నా కథన మార్పును సూచిస్తుంది; తెలుగు కాలవాచక ఉపవాక్య నిర్మాణమే ఆ అనుసంధానాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ‘ఆత్మ’ అనే పదం ఎవరిని సూచిస్తుంది?
  choice: పౌలు స్వంత మానవ ఆత్మ/అంతరంగం
  alternative: పరిశుద్ధాత్మ ప్రేరేపించాడనే సూచన
  rationale: ‘అతని ఆత్మ’ అనే స్వామ్య నిర్మాణం, ‘అతనిలో’ అనే పదబంధం పౌలు అంతర్గత స్పందనను సూచిస్తున్నాయి. పరిశుద్ధాత్మను పాఠం స్పష్టంగా పేర్కొననందున ఆ భావాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘అతని ఆత్మ అతనిలో’ అనే కొంత పునరుక్తి మూలంలోని τὸ πνεῦμα αὐτοῦ ἐν αὐτῷ నిర్మాణాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది. ప్రధాన పాఠంలో ఉన్న ఏకైక పాదసూచిక [a] పదార్థ ప్రత్యామ్నాయాలను వివరిస్తుంది.
