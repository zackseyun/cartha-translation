  to: పౌలు ఏథెన్సులో వారి కోసం ఎదురుచూస్తుండగా, ఆ నగరం విగ్రహాలతో నిండిపోయి ఉండటం గమనించి, అతని ఆత్మ అతనిలో తీవ్రంగా కలవరపడింది.[a]
