source:
  edition: SBLGNT
  text: εὐθέως δὲ τότε τὸν Παῦλον ἐξαπέστειλαν οἱ ἀδελφοὶ πορεύεσθαι ⸀ἕως ἐπὶ τὴν θάλασσαν· ⸂ὑπέμεινάν τε⸃ ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/014.yaml
  text: Then the brothers immediately sent Paul away to go as far as the sea[b][a], but both Silas and Timothy remained there.
translation:
  language: te
  text: అప్పుడు సహోదరులు[a] వెంటనే పౌలును సముద్రతీరం వరకు[b] వెళ్లేలా పంపివేశారు. అయితే సీల, తిమోతి ఇద్దరూ అక్కడే ఉండిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సహోదర సహోదరీలు’; గ్రీకులో ‘సహోదరులు’ అని ఉంది; ఈ పదం విశ్వాసులందరినీ సమష్టిగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సముద్రం దగ్గరకు’ లేదా ‘సముద్రం వైపుగా’; గ్రీకు పదబంధం తదుపరి ప్రయాణ విధానాన్ని స్పష్టంగా చెప్పకుండా, తీరం వరకు లేదా తీరం దిశగా కదలికను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως δὲ τότε
  choice: అప్పుడు ... వెంటనే
  rationale: δὲ τότε తెలిపే కథన పురోగతిని ‘అప్పుడు’తో, εὐθέως తెలిపే తక్షణ చర్యను ‘వెంటనే’తో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐξαπέστειλαν
  choice: పంపివేశారు
  rationale: ఒక స్థలం నుంచి పంపించడం అనే సంయుక్త క్రియ భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: οἱ ἀδελφοὶ
  choice: సహోదరులు
  rationale: గ్రీకు పుంలింగ బహువచన రూపాన్ని నిలుపుతూ, విశ్వాస సహవాసాన్ని సూచించగల గౌరవప్రదమైన తెలుగు పదాన్ని ఉపయోగిస్తుంది.
- source_word: πορεύεσθαι
  choice: వెళ్లేలా
  rationale: పంపిన చర్య యొక్క ఉద్దేశాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἕως ἐπὶ τὴν θάλασσαν
  choice: సముద్రతీరం వరకు
  rationale: తీరప్రాంతం వరకు కదలికను సూచిస్తూ, అక్కడి నుంచి సముద్రమార్గంలో వెళ్లాడా అనే విషయాన్ని నిర్ణయించకుండా ఉంచుతుంది.
- source_word: ὑπέμεινάν
  choice: ఉండిపోయారు
  rationale: ఈ సందర్భంలో కష్టాన్ని సహించడం కాక, అదే స్థలంలో మిగిలి ఉండడం అనే భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: సీల, తిమోతి—ఇద్దరూ
  rationale: τε ... καὶ లోని జత ప్రాధాన్యాన్ని సహజ తెలుగు నిర్మాణంతో నిలుపుతుంది.
- source_word: ἐκεῖ
  choice: అక్కడే
  rationale: స్థానార్థక భావంతో పాటు పౌలు వెళ్లిపోవడానికి విరుద్ధంగా వారు అదే చోట ఉన్నారనే సందర్భోచిత దృష్టిని ఇస్తుంది.
theological_decisions:
- issue: విశ్వాసుల సమూహానికి ἀδελφοί పదం అనువాదం
  choice: సహోదరులు
  alternative: సహోదర సహోదరీలు; విశ్వాసులు
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; అయితే సందర్భంలో ఇది స్త్రీపురుష విశ్వాసుల సమూహాన్ని కలిపి సూచించే అవకాశం ఉందని పాదటిప్పణిలో తెలియజేస్తుంది.
- issue: ἕως ἐπὶ τὴν θάλασσαν సూచించే గమ్యం
  choice: సముద్రతీరం వరకు
  alternative: సముద్రం దగ్గరకు; సముద్రం వైపుగా
  rationale: పౌలు తీరానికి చేరాడని సూచిస్తుంది గాని, అతడు అక్కడి నుంచి ఓడలో ప్రయాణించాడని పాఠ్యంలో లేని వివరాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘సముద్రతీరం’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది; ఎటువంటి సముద్రయాన నిర్ణయాన్నీ పాఠ్యంలో చేర్చదు. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
