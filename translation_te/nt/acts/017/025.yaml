language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδὲ ὑπὸ χειρῶν ⸀ἀνθρωπίνων θεραπεύεται προσδεόμενός τινος, αὐτὸς διδοὺς πᾶσι ζωὴν καὶ πνοὴν ⸂καὶ τὰ⸃ πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/025.yaml
  text: Nor is he served by human hands[a], as though he needed anything, since he himself gives to all life and breath and all things.
translation:
  language: te
  text: అలాగే, ఆయనకు ఏదైనా అవసరం ఉన్నవానిలా మానవ చేతుల ద్వారా ఆయన సేవించబడడు[a]. ఎందుకంటే ఆయనే అందరికీ జీవాన్నీ, ఊపిరినీ, సమస్తాన్నీ ఇస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ‘మానవ చేతుల ద్వారా ఆయనకు పరిచర్య చేయబడదు.’ గ్రీకు క్రియ మతపరమైన సందర్భంలో చేసే సేవను లేదా పరిచర్యను సూచించగలదు. ఇక్కడ భావం: దేవుడు మానవుల పరిచర్యపై ఆధారపడడు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: అంతేకాదు ... సేవించబడడు
  rationale: ముందటి వచనంలోని నిరాకరణను కొనసాగిస్తూ, ఆధునిక తెలుగులో సహజంగా అనుసంధానిస్తుంది.
- source_word: ὑπὸ χειρῶν ἀνθρωπίνων
  choice: మానవ చేతులతో
  rationale: మూలంలోని స్పష్టమైన చేతుల రూపకాన్ని, మానవ పరిచర్య భావాన్ని నిలుపుతుంది.
- source_word: θεραπεύεται
  choice: సేవించబడడు
  rationale: ఇక్కడ స్వస్థపరచడం అనే అర్థం కాదు; ఏదో కొరతగల దేవునికి మనుషులు చేసే సేవ లేదా మతపరమైన పరిచర్యను సూచిస్తుంది.
- source_word: προσδεόμενός τινος
  choice: ఆయనకు ఏదైనా అవసరమున్నట్లుగా
  rationale: దేవుడు అవసరంలో ఉన్నాడనే ఊహను పౌలు తిరస్కరిస్తున్న వాక్చాతుర్యాన్ని నిలుపుతుంది.
- source_word: αὐτὸς διδοὺς
  choice: ఇచ్చేది ఆయనే
  rationale: αὐτός లోని ఉద్ఘాటనను సహజమైన తెలుగు వాక్యనిర్మాణంతో స్పష్టం చేస్తుంది.
- source_word: πᾶσι
  choice: అందరికీ
  rationale: దాతృత్వం యొక్క విస్తృతమైన, పరిమితం చేయని పరిధిని తెలియజేస్తుంది.
- source_word: ζωὴν καὶ πνοὴν καὶ τὰ πάντα
  choice: జీవాన్ని, ఊపిరిని, సమస్తాన్ని
  rationale: మూడు అంశాల క్రమాన్నీ, చివరి పదబంధంలోని సమగ్రతనూ సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: θεραπεύεται ను ప్రత్యేకంగా ఆరాధనగా అనువదించాలా, లేక విస్తృతమైన సేవగా అనువదించాలా
  choice: సేవించబడడు
  alternative: ఆరాధించబడడు; పరిచర్య చేయబడడు
  rationale: సందర్భం మానవుల మతపరమైన పరిచర్యపై దేవుడు ఆధారపడడని చెబుతుంది. ‘సేవించబడడు’ ఆరాధనా సందర్భాన్ని కలుపుకుంటూనే, గ్రీకు పదాన్ని అంతరంగ ఆరాధనకే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘మానవ చేతులతో’ అనే మూల రూపకం, ‘ఇచ్చేది ఆయనే’ అనే ఉద్ఘాటన నిలుపబడ్డాయి.
