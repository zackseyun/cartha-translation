revisions:
- from: అంతేకాదు, ఆయనకు ఏదైనా అవసరమున్నట్లుగా మానవ చేతులతో ఆయన సేవించబడడు[a]. ఎందుకంటే అందరికీ జీవాన్ని, ఊపిరిని, సమస్తాన్ని ఇచ్చేది ఆయనే.
  to: అలాగే, ఆయనకు ఏదైనా అవసరం ఉన్నవానిలా మానవ చేతుల ద్వారా ఆయన సేవించబడడు[a]. ఎందుకంటే ఆయనే అందరికీ జీవాన్నీ, ఊపిరినీ, సమస్తాన్నీ ఇస్తాడు.
