id: ACT.17.24
reference: Acts 17:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ θεὸς ὁ ποιήσας τὸν κόσμον καὶ πάντα τὰ ἐν αὐτῷ, οὗτος οὐρανοῦ καὶ γῆς ⸂ὑπάρχων κύριος⸃ οὐκ ἐν χειροποιήτοις ναοῖς κατοικεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/024.yaml
  text: The God who made the world and everything in it[a], being Lord of heaven and earth, does not dwell in temples made by hands.
translation:
  language: te
  text: లోకాన్ని, అందులో ఉన్న సమస్తాన్నీ సృష్టించిన దేవుడు ఆకాశానికీ భూమికీ ప్రభువై ఉండి, మనుషుల చేతులతో నిర్మించిన దేవాలయాల్లో[a] నివసించడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘చేతులతో చేయబడిన దేవాలయాల్లో.’ అంటే మనుషులు నిర్మించిన దేవాలయాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας
  choice: సృష్టించిన
  rationale: ఇది ὁ θεόςను విశేషించే భూతకాల క్రియావిశేషణ రూపం. సృష్టి సందర్భంలో ‘సృష్టించిన’ అనేది సహజమైన ఆధునిక తెలుగు; దేవుడు లోకాన్ని ఉనికిలోకి తెచ్చాడనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: κόσμον
  choice: లోకాన్ని
  rationale: ఇక్కడ κόσμος సృష్టించబడిన లోకమంతటినీ సూచిస్తుంది. ‘లోకం’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి మూలపదపు విస్తృతిని నిలుపుతుంది.
- source_word: πάντα τὰ ἐν αὐτῷ
  choice: అందులో ఉన్న సమస్తాన్నీ
  rationale: κόσμοςలో ఉన్నవన్నీ అనే సమగ్ర భావాన్ని ‘సమస్తాన్నీ’ సహజంగా, గంభీరంగా వ్యక్తపరుస్తుంది.
- source_word: ὑπάρχων κύριος
  choice: ప్రభువై ఉండి
  rationale: ὑπάρχων సూచించే కొనసాగుతున్న స్థితిని నిలుపుతూ, దానిని కారణార్థకంగా మార్చకుండా తెలుగు వాక్యనిర్మాణంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: ఇక్కడ ఈ పదం ఆకాశం, భూమిపై దేవుని సార్వభౌమ అధికారాన్ని సూచిస్తుంది; ‘ప్రభువు’ ప్రామాణికమైన, సులభంగా అర్థమయ్యే అనువాదం.
- source_word: οὐρανοῦ καὶ γῆς
  choice: ఆకాశానికీ భూమికీ
  rationale: κύριοςతో సంబంధాన్ని తెలుగులో సహజమైన షష్ఠీ భావంతో వ్యక్తపరుస్తూ, మూలంలోని ఏకవచన ‘ఆకాశం’ను నిలుపుతుంది.
- source_word: χειροποιήτοις
  choice: మనుషుల చేతులతో నిర్మించిన
  rationale: ఈ పదం మానవ చేతులతో తయారైనదాన్ని సూచిస్తుంది. ‘మనుషుల’ అని స్పష్టం చేయడం తెలుగులో సహజంగా ఉండి, సృష్టికర్తకు మానవ నిర్మాణాలకు మధ్యనున్న వ్యత్యాసాన్ని తెలియజేస్తుంది.
- source_word: ναοῖς
  choice: దేవాలయాల్లో
  rationale: ναός పవిత్ర నివాసస్థలమైన ఆలయం లేదా దేవాలయాన్ని సూచిస్తుంది. అరేయోపగు సందర్భంలో ‘దేవాలయాలు’ స్పష్టమైన సాధారణ పదం.
- source_word: κατοικεῖ
  choice: నివసించడు
  rationale: κατοικέω అంటే నివసించడం లేదా స్థిరంగా ఉండడం. ‘నివసించడు’ ఆలయంలో దేవుడు నివసిస్తాడనే భావంతో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: దేవుని అతీతత్వం మరియు దేవాలయాలకు పరిమితం చేయడం
  choice: సృష్టికర్తయూ ఆకాశం, భూమికి ప్రభువూ అయిన దేవుడు మానవులు నిర్మించిన దేవాలయాల్లో నివసించడని వచనం నేరుగా చెబుతుంది.
  alternative: దేవుడు దేవాలయాలకు పరిమితుడు కాడని భావానువాదంగా చెప్పవచ్చు.
  rationale: మూలపాఠం ‘పరిమితం చేయబడడు’ అని వివరించకుండా ‘నివసించడు’ అని చెబుతుంది. అందువల్ల విస్తృతమైన సిద్ధాంత వివరణను చేర్చకుండా మూలంలోని ప్రత్యక్ష వాదనను, దానిలోని అతీతత్వ భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని participial నిర్మాణాన్ని ‘ప్రభువై ఉండి’ ద్వారా నిలుపుతూ, వాక్యం సాధారణ పాఠకులకు సులభంగా ఉండేలా రూపొందించాం.
