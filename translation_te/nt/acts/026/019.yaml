source:
  edition: SBLGNT
  text: Ὅθεν, βασιλεῦ Ἀγρίππα, οὐκ ἐγενόμην ἀπειθὴς τῇ οὐρανίῳ ὀπτασίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/019.yaml
  text: Therefore[a], King Agrippa, I was not disobedient to the heavenly vision,
translation:
  language: te
  text: కాబట్టి, అగ్రిప్పా రాజా, నేను పరలోక దర్శనానికి[a] అవిధేయుడిగా ఉండలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరలోకం నుండి వచ్చిన దర్శనానికి.”
    reason: οὐρανίῳ అనే విశేషణం దర్శనపు పరలోక స్వభావాన్నో, పరలోకం నుండి వచ్చిన మూలాన్నో సూచించగలదు.
lexical_decisions:
- source_word: Ὅθεν
  choice: కాబట్టి
  rationale: ముందు వివరించిన పౌలు దర్శనం, నియామకం ఆధారంగా వచ్చిన నిర్ణయాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: βασιλεῦ Ἀγρίππα
  choice: అగ్రిప్ప రాజా
  rationale: సంబోధన విభక్తినీ రాజబిరుదునీ సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: οὐκ ἐγενόμην
  choice: నేను ... ఉండలేదు
  rationale: γίνομαι మరియు విధేయతను సూచించే విశేషణం కలిసిన గ్రీకు ప్రయోగాన్ని తెలుగులో సహజమైన స్థితి-ప్రయోగంగా అందిస్తుంది; అక్షరార్థమైన ‘కాలేదు’ కంటే సందర్భానికి స్పష్టంగా ఉంటుంది.
- source_word: ἀπειθὴς
  choice: అవిధేయుడిగా
  rationale: దైవిక నియామకానికి లోబడకుండా ఉండడమనే సంకల్పపూర్వక భావాన్ని తెలియజేస్తుంది; కేవలం ‘నమ్మని’ అని అనువదిస్తే జ్ఞానపరమైన భావానికి పరిమితమవుతుంది.
- source_word: τῇ οὐρανίῳ ὀπτασίᾳ
  choice: పరలోక దర్శనానికి
  rationale: ὀπτασίαను ‘దర్శనం’గా, οὐράνιοςను దాని పరలోక మూలం లేదా స్వభావాన్ని సూచించేలా అనువదిస్తుంది. ἀπειθήςతో ఉన్న దత్తి విభక్తి తెలుగులో ‘-కి’తో సహజంగా వ్యక్తమవుతుంది.
theological_decisions:
- issue: దమస్కు మార్గంలో పౌలుకు కలిగిన అనుభవ స్వభావం
  choice: దర్శనం
  alternative: ప్రత్యక్షత; పరలోకం నుండి వచ్చిన దర్శనం
  rationale: ὀπτασία నేరుగా దర్శనం లేదా ప్రత్యక్షతను సూచిస్తుంది. ‘దర్శనం’ మూలపాఠంలోని వర్గీకరణను కాపాడుతూ, దాని స్వభావంపై మరింత సిద్ధాంతపరమైన వివరణను రుద్దదు. οὐρανίῳ దాని మూలాన్నైనా స్వభావాన్నైనా సూచించగల అస్పష్టతను పాదటిప్పణి నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన న్యాయస్థాన సంబోధనను ‘అగ్రిప్ప రాజా’గా ఉంచి, వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా తీర్చిదిద్దాం. మూలంలోని తార్కిక అనుసంధానం, నిరాకరణ, పరలోక దర్శనంలోని భావసందిగ్ధత నిలుపబడ్డాయి.
