id: ACT.26.16
reference: Acts 26:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ ἀνάστηθι καὶ στῆθι ἐπὶ τοὺς πόδας σου· εἰς τοῦτο γὰρ ὤφθην σοι, προχειρίσασθαί σε ὑπηρέτην καὶ μάρτυρα ὧν τε εἶδές ⸀με ὧν τε ὀφθήσομαί σοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/016.yaml
  text: 'But rise and stand on your feet[a], for I have appeared to you for this purpose: to appoint you as a servant and witness both of the things in which you have seen me and of the things in which I will appear to you,'
translation:
  language: te
  text: '“అయితే లేచి నీ కాళ్ల మీద నిలబడు. ఈ ఉద్దేశంతోనే నేను నీకు ప్రత్యక్షమయ్యాను: నీవు నన్ను చూసిన సంగతుల విషయంలోను, నేను నీకు ప్రత్యక్షమయ్యే సంగతుల విషయంలోను సేవకునిగాను సాక్షిగాను నిన్ను నియమించడానికి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνάστηθι
  choice: లేచి
  rationale: తక్షణ చర్యను కోరే ఆజ్ఞార్థక రూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: στῆθι ἐπὶ τοὺς πόδας σου
  choice: నీ కాళ్లపై నిలబడు
  rationale: పిలుపు, నియామక సందర్భంలోని సజీవమైన శారీరక ఆజ్ఞను అనవసర విస్తరణ లేకుండా నిలుపుతుంది.
- source_word: εἰς τοῦτο γὰρ
  choice: ఎందుకంటే ఈ ఉద్దేశంతోనే
  rationale: యేసు ప్రత్యక్షమైన ఉద్దేశాన్ని స్పష్టంగా పరిచయం చేస్తుంది; γάρ యొక్క కారణసంబంధాన్ని కూడా నిలుపుతుంది.
- source_word: ὤφθην σοι
  choice: నేను నీకు ప్రత్యక్షమయ్యాను
  rationale: వ్యాకరణపరంగా కర్మణి రూపమైనప్పటికీ, ఇక్కడ ఇది వ్యక్తిగత ప్రత్యక్షతను తెలిపే సాధారణ ప్రయోగం.
- source_word: προχειρίσασθαί σε
  choice: నిన్ను ... నియమించడానికి
  rationale: ఒక బాధ్యతాయుతమైన పాత్రకు అధికారికంగా ఏర్పరచడం లేదా నియమించడం అనే భావాన్ని అందిస్తుంది.
- source_word: ὑπηρέτην
  choice: సేవకునిగా
  rationale: అధీనంగా సేవచేసే వ్యక్తి అనే భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; సంఘపరమైన ప్రత్యేక పదవిని సూచించదు.
- source_word: μάρτυρα
  choice: సాక్షిగా
  rationale: చూసినదాని గురించి సాక్ష్యం చెప్పే వ్యక్తి అనే సందర్భోచిత అర్థాన్ని కచ్చితంగా ఇస్తుంది.
- source_word: ὧν τε εἶδές με
  choice: నీవు నన్ను చూసిన విషయాలకూ
  rationale: με అనే పాఠాన్ని స్పష్టంగా ప్రతిబింబిస్తూ, గ్రీకు సంబంధవాచక నిర్మాణంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: ὧν τε ὀφθήσομαί σοι
  choice: నేను నీకు ప్రత్యక్షమయ్యే విషయాలకూ
  rationale: భవిష్యత్తులో జరిగే ప్రత్యక్షతలతో పౌలు సాక్ష్యాన్ని అనుసంధానిస్తుంది; ‘చూపిస్తాను’ అని మార్చకుండా ప్రత్యక్షత భాషను కాపాడుతుంది.
theological_decisions:
- issue: ὤφθην / ὀφθήσομαί లోని ప్రత్యక్షత స్వభావం
  choice: రెండు క్రియలనూ ‘ప్రత్యక్షమయ్యాను / ప్రత్యక్షమయ్యే’ అని అనువదించడం
  alternative: ‘నీవు నన్ను చూశావు / చూస్తావు’ లేదా ‘నన్ను నేను బయలుపరచుకున్నాను / బయలుపరచుకుంటాను’
  rationale: లేచిన యేసు పౌలుకు వ్యక్తిగతంగా ప్రత్యక్షమై అతన్ని నియమిస్తున్న భావాన్ని ఇది నిలుపుతుంది; ప్రత్యక్షత ఏ విధంగా జరిగిందనే విషయాన్ని అనవసరంగా నిర్ధారించదు.
- issue: ὧν ... ὧν అనే సంక్షిప్త సంబంధవాచక నిర్మాణం
  choice: ‘నీవు నన్ను చూసిన విషయాలకూ, నేను నీకు ప్రత్యక్షమయ్యే విషయాలకూ’ అని ఉంచడం
  alternative: ‘నేను నీకు చూపించినవాటికీ, చూపించబోయే వాటికీ’
  rationale: మూలంలోని నిజమైన వ్యాకరణ సంక్షిప్తతను, కొంత అర్థసందిగ్ధతను నిలుపుతూ, యేసు ‘చూపిస్తాడు’ అని స్పష్టీకరించి మూలాన్ని మించిపోకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘పరిచారకుడు’ లేదా ‘మంత్రి’ వంటి పదవిసూచక పదాలకు బదులు సాధారణంగా అర్థమయ్యే ‘సేవకుడు’ ఎంచుకోబడింది. మూలంలోని ప్రత్యక్షత భాషను, చివరి భాగంలోని సంక్షిప్తతను సాధ్యమైనంతగా కాపాడాం.
