id: ACT.26.23
reference: Acts 26:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ παθητὸς ὁ χριστός, εἰ πρῶτος ἐξ ἀναστάσεως νεκρῶν φῶς μέλλει καταγγέλλειν τῷ ⸀τε λαῷ καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/023.yaml
  text: that the Messiah would suffer[a], and that, as the first to rise from the dead[d][c][b], he would proclaim light both to the people and to the Gentiles.
translation:
  language: te
  text: మెస్సీయ[a] బాధను అనుభవించవలసి ఉంటాడని, మృతులలోనుండి పునరుత్థానమైన వారిలో మొదటివాడిగా ఆయన ప్రజలకూ[b] అన్యజనులకూ[c] వెలుగును ప్రకటిస్తాడని.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘క్రీస్తు.’ ఇక్కడ ఈ బిరుదు ప్రవచన సందర్భంలో అభిషిక్తుణ్ణి సూచిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: ఇక్కడ ‘ప్రజలు’ అన్నది అన్యజనులకు భిన్నంగా యూద ప్రజలను సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: c
    text: మూలభాషలో ‘జనాలు’ లేదా ‘దేశాలు’ అని కూడా అనువదించగల పదం ఉంది; ఈ సందర్భంలో అది సాధారణంగా అన్యజనులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: παθητὸς
  choice: బాధపడవలసి ఉంటుందని
  rationale: ఈ విశేషణం బాధను అనుభవించగలవాడు లేదా బాధ అనుభవించడానికి నిర్ణయించబడినవాడు అనే భావాన్ని ఇస్తుంది. ప్రవచనాల సారాంశమైన ఈ సందర్భంలో ఈ క్రియాత్మక రూపం సహజంగా ఉండి, మెస్సీయ బాధపడాల్సి ఉందనే భావాన్ని తెలియజేస్తుంది.
- source_word: ὁ χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός వ్యక్తినామంలా కాక, మోషే మరియు ప్రవక్తలు చెప్పిన అభిషిక్తుని బిరుదుగా పనిచేస్తోంది; అందువల్ల ‘మెస్సీయ’ సముచితం.
- source_word: πρῶτος ἐξ ἀναστάσεως νεκρῶν
  choice: మృతుల పునరుత్థానంలో మొదటివాడిగా
  rationale: గ్రీకు పదబంధంలోని సంక్షిప్తతను, పునరుత్థానంలో ఆయనకున్న ప్రథమ స్థానాన్ని కాపాడుతుంది. అంతకు ముందు జరిగిన తాత్కాలిక జీవపునరుద్ధరణలతో దీనికి ఉన్న సంబంధాన్ని ప్రధాన పాఠ్యంలో వివరించి అర్థాన్ని పరిమితం చేయదు.
- source_word: φῶς
  choice: వెలుగును
  rationale: ప్రకటన, రక్షణ, నిరీక్షణ వంటి విస్తృతమైన బైబిలు రూపకాన్ని వ్యాఖ్యానించి సంకుచితం చేయకుండా నిలుపుతుంది.
- source_word: μέλλει καταγγέλλειν
  choice: ప్రకటిస్తాడని
  rationale: μέλλω సహితమైన infinitive ఇక్కడ భవిష్యత్తు లేదా నిర్ణీత కార్యాన్ని సూచిస్తుంది. పరోక్ష వాక్య నిర్మాణంలో ఈ రూపం సహజమైన తెలుగు.
- source_word: τῷ τε λαῷ
  choice: ప్రజలకూ
  rationale: మూలంలోని సాధారణ ‘ప్రజ’ పదాన్ని నిలుపుతుంది; అన్యజనులతో ఉన్న వ్యత్యాసం వల్ల ఇది యూద ప్రజలను సూచిస్తుందని సందర్భం తెలియజేస్తుంది.
- source_word: τοῖς ἔθνεσιν
  choice: అన్యజనులకూ
  rationale: యూద ప్రజలు–అన్యజనులు అనే వ్యత్యాసంలో ‘దేశాలు’ కంటే ‘అన్యజనులు’ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: τε ... καὶ
  choice: ప్రజలకూ ... అన్యజనులకూ
  rationale: తెలుగులోని ‘కూ ... కూ’ సముచ్చయ నిర్మాణం ఇరు గ్రహీత వర్గాలను సహజంగా జతచేస్తుంది.
theological_decisions:
- issue: పునరుత్థానంలో మెస్సీయ ‘మొదటివాడు’ అనే మాట
  choice: మృతుల పునరుత్థానంలో మొదటివాడిగా
  alternative: మళ్లీ ఎన్నడూ చనిపోకుండా లేచిన మొదటివాడిగా
  rationale: గ్రీకు పాఠ్యం ప్రథమ స్థానాన్ని చెబుతుంది గాని దాని పూర్తి సిద్ధాంత వివరణను ఇవ్వదు. అందువల్ల అనువాదం ఆ ఉద్రిక్తతను నిలుపుతూ అదనపు వివరణను ప్రధాన పాఠ్యంలో చేర్చదు.
- issue: ‘ప్రజలు’ అనే పదం ఎవరిని సూచిస్తుంది
  choice: ప్రజలు
  alternative: యూద ప్రజలు / ఇశ్రాయేలు ప్రజలు
  rationale: λαός అనే మూలపదాన్ని నిలుపుతూ, అన్యజనులతో ఉన్న వ్యత్యాసం ద్వారా యూద ప్రజలనే సూచిస్తున్నట్టు పాఠకుడు గ్రహించే వీలు కల్పించబడింది; స్పష్టీకరణను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. వచనం మునుపటి వాక్యంపై ఆధారపడే పరోక్ష వాక్య భాగం కావడంతో చివర ‘అని’తో ముగించబడింది. ‘మృతుల పునరుత్థానంలో మొదటివాడిగా’ అనే రూపం మూలంలోని సంక్షిప్తతను, సిద్ధాంతపరమైన ఉద్రిక్తతను నిలుపుతుంది.
