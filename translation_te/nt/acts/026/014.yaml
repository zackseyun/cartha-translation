id: ACT.26.14
reference: Acts 26:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάντων ⸀τε καταπεσόντων ἡμῶν εἰς τὴν γῆν ἤκουσα φωνὴν ⸀λέγουσαν πρός ⸀με τῇ Ἑβραΐδι διαλέκτῳ· Σαοὺλ Σαούλ, τί με διώκεις; σκληρόν σοι πρὸς κέντρα λακτίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/014.yaml
  text: And when we had all fallen to the ground[a], I heard a voice saying to me in the Hebrew language, ‘Saul, Saul[b], why are you persecuting me? It is hard for you to kick against the goads.’
translation:
  language: te
  text: 'మేమందరం నేలపై పడిపోయినప్పుడు, హీబ్రూ భాషలో[a] నాతో మాట్లాడిన ఒక స్వరం నేను విన్నాను: “సౌలా, సౌలా, నన్నెందుకు హింసిస్తున్నావు? మొనగల కర్రలకు ఎదురుగా తన్నడం నీకు కష్టం.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అరామిక్ భాషలో” అని భావం కావచ్చు; గ్రీకు పదబంధం అక్షరార్థంగా “హీబ్రూ భాషలో/మాండలికంలో” అని చెబుతుంది.
    reason: alternative_reading
  - marker: b
    text: ఇది ఒక సామెత. పశువును నడిపించడానికి వాడే మొనగల కర్రకు ఎదురుగా తన్నడం దానికే హాని కలిగిస్తుంది; అలాగే ప్రతిఘటించేవానికే హాని కలుగుతుందని దీని భావం.
    reason: cultural_note
lexical_decisions:
- source_word: πάντων τε καταπεσόντων ἡμῶν εἰς τὴν γῆν
  choice: మేమంతా నేలమీద పడిపోయినప్పుడు
  rationale: గ్రీకు genitive absolute నిర్మాణాన్ని సహజమైన కాలవాచక ఉపవాక్యంగా మార్చి, అందరూ పడిపోయారనే భావాన్నీ ప్రధాన క్రియకు ముందే అది జరిగిందనే క్రమాన్నీ నిలిపింది.
- source_word: ἤκουσα φωνὴν λέγουσαν πρός με
  choice: నాతో ఇలా అంటున్న ఒక స్వరం నేను విన్నాను
  rationale: φωνήను సందర్భానుసారం ‘స్వరం’గా అనువదించి, λέγουσαν πρός μεలోని ప్రత్యక్ష సంబోధనను సహజమైన తెలుగులో వ్యక్తం చేసింది.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: హెబ్రీ భాషలో
  rationale: గ్రీకు పదబంధంలోని ప్రత్యక్ష అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచింది; ఇది అరామిక్‌ను సూచించవచ్చనే అభిప్రాయాన్ని పాదసూచికలో తెలిపింది.
- source_word: Σαοὺλ Σαούλ
  choice: సౌలా, సౌలా
  rationale: పేరును తెలుగు లిపిలో ధ్వన్యంతరీకరించి, ప్రత్యక్ష సంబోధనకు తగిన విభక్తినీ గ్రీకులోని పునరుక్తినీ నిలిపింది.
- source_word: τί με διώκεις;
  choice: నన్నెందుకు హింసిస్తున్నావు?
  rationale: వర్తమాన క్రియలోని కొనసాగుతున్న చర్యను సహజమైన తెలుగు రూపంలో వ్యక్తం చేస్తూ, διώκωలోని శత్రుత్వపూర్వక హింస భావాన్ని నిలిపింది.
- source_word: σκληρόν σοι
  choice: నీకు కష్టం
  rationale: వ్యక్తిని ఉద్దేశించిన దత్తివాచక భావాన్ని ‘నీకు’తో, సామెతలోని σκληρόνను అతివ్యాఖ్యానం చేయకుండా ‘కష్టం’తో తెలిపింది.
- source_word: πρὸς κέντρα λακτίζειν
  choice: ముల్లుగర్రలకు ఎదురుగా తన్నడం
  rationale: పశువులను నడిపించడానికి వాడే మొనగల గర్రలను సూచించే κέντραను ‘ముల్లుగర్రలు’గా ఇచ్చి, ప్రతిఘటనను సూచించే సామెత రూపాన్ని నిలిపింది.
theological_decisions:
- issue: τῇ Ἑβραΐδι διαλέκτῳ యొక్క గుర్తింపు
  choice: హెబ్రీ భాషలో
  alternative: అరామిక్ భాషలో
  rationale: మూల గ్రీకు పదప్రయోగాన్ని ప్రధాన పాఠ్యంలో నేరుగా ప్రతిబింబించింది. అపొస్తలుల కార్యముల సందర్భంలో ఇది అరామిక్‌ను సూచిస్తుందని కొందరు అర్థం చేసుకున్నప్పటికీ, ఆ వ్యాఖ్యానాన్ని పాఠ్యంలో చేర్చకుండా పాదసూచికలో ప్రత్యామ్నాయంగా ఉంచింది.
- issue: ముల్లుగర్రలకు ఎదురుగా తన్నడం అనే సామెత
  choice: చిత్రాత్మక సామెతను యథాతథంగా నిలపడం
  alternative: ప్రతిఘటిస్తే నీకే హాని అని భావానువాదం చేయడం
  rationale: యేసు పలికిన చిత్రాత్మక మాటలోని ఉద్వేగాన్నీ రూపకాన్నీ ప్రధాన పాఠ్యంలో నిలిపి, దాని సాంస్కృతిక భావాన్ని పాదసూచికలో వివరించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా రూపొందించబడింది. మూలంలోని ప్రత్యక్ష సంభాషణ, పేరుపునరుక్తి, సామెత రూపం నిలిపివేయబడ్డాయి. అందించిన ఆంగ్ల పాఠ్యంలో పాదసూచిక గుర్తులు వాటి విషయాలకు అనుగుణమైన పదాల వద్ద లేకపోవడంతో, [a]ను ‘హెబ్రీ భాషలో’ వద్దకు మరియు [b]ను సామెత చివరికి ఉంచాం.
