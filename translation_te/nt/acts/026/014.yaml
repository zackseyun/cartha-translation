  to: 'మేమందరం నేలపై పడిపోయినప్పుడు, హీబ్రూ భాషలో[a] నాతో మాట్లాడిన ఒక స్వరం నేను విన్నాను: “సౌలా, సౌలా, నన్నెందుకు హింసిస్తున్నావు? మొనగల కర్రలకు ఎదురుగా తన్నడం నీకు కష్టం.”[b]'
