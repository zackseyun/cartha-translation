reference: Acts 26:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃ καὶ ἐποίησα ἐν Ἱεροσολύμοις, καὶ πολλούς ⸀τε τῶν ἁγίων ἐγὼ ⸀ἐν φυλακαῖς κατέκλεισα τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών, ἀναιρουμένων τε αὐτῶν κατήνεγκα ψῆφον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/010.yaml
  text: 'And this is what I did in Jerusalem: I not only locked up many of the saints in prisons[a], having received authority from the chief priests, but also, when they were being put to death[b], I cast my vote against them.'
translation:
  language: te
  text: 'అదే నేను యెరూషలేములో కూడా చేశాను: ప్రధాన యాజకుల నుండి అధికారం పొంది, పవిత్రులైన అనేకమందిని చెరసాలల్లో బంధించాను; వారిని చంపుతున్నప్పుడు, వారికి వ్యతిరేకంగా నా ఓటు కూడా వేశాను.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా ‘ఓటు గులకరాయిని వేశాను’ అనే భావం ఉంది. దీన్ని ‘వారి మరణానికి నా సమ్మతి తెలిపాను’ అని కూడా అర్థం చేసుకోవచ్చు; ఇది అధికారిక ఓటునే సూచిస్తుందో లేదో పాఠ్యం స్పష్టం చేయదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ καὶ ἐποίησα
  choice: నేను ... అదే చేశాను
  rationale: ముందటి వచనంలో చెప్పిన హింసాత్మక చర్యలను ὃ తిరిగి సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా, καί యొక్క భావాన్ని ‘అదే’లో కలిపి వ్యక్తపరచాం.
- source_word: ἐν Ἱεροσολύμοις
  choice: యెరూషలేములో
  rationale: స్థలనామానికి తెలుగులో స్థిరపడిన ప్రామాణిక రూపం.
- source_word: πολλούς τε τῶν ἁγίων
  choice: పవిత్రులలో చాలామందిని
  rationale: ἅγιοι యేసును విశ్వసించే దేవుని పవిత్ర ప్రజలను సూచిస్తుంది. ‘పవిత్రులు’ మూలపద సంబంధాన్ని నిలుపుతుంది; తరువాతి కాలపు ప్రత్యేక బిరుదు అనే అపార్థాన్ని పాదసూచిక నివారిస్తుంది.
- source_word: ἐν φυλακαῖς κατέκλεισα
  choice: చెరసాలల్లో బంధించాను
  rationale: κατακλείωలోని నిర్బంధించే భావాన్నీ, φυλακαῖς అనే బహువచనాన్నీ స్పష్టంగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών
  choice: ముఖ్య యాజకుల నుండి అధికారం పొంది
  rationale: పౌలు ఏ అధికార ఆధారంతో ఆ పని చేశాడో తెలిపే భాగవాక్యాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: ἀναιρουμένων τε αὐτῶν
  choice: వారు చంపబడుతున్నప్పుడు
  rationale: నిష్క్రియ వర్తమాన భాగవాచకాన్ని కాలసంబంధ ఉపవాక్యంగా అనువదించాం. ‘చంపబడటం’ మరణశిక్ష అనే న్యాయపరమైన వివరాన్ని అవసరానికి మించి నిర్ధారించదు.
- source_word: κατήνεγκα ψῆφον
  choice: వారికి వ్యతిరేకంగా నా ఓటు కూడా వేశాను
  rationale: ψῆφος ఓటు వేయడానికి ఉపయోగించే గులకరాయిని, విస్తృతార్థంలో ఓటును సూచిస్తుంది. ‘వ్యతిరేకంగా’ సందర్భం ద్వారా స్పష్టమయ్యే దిశను తెలుగులో సహజంగా తెలియజేస్తుంది; ఖచ్చితమైన సంస్థాగత విధానాన్ని పాదసూచిక నిర్ణయించదు.
theological_decisions:
- issue: అపొస్తలుల కార్యములలో ἅγιοι అర్థం
  choice: ‘పవిత్రులు’—యేసును విశ్వసించే దేవుని ప్రజలు
  alternative: ‘దేవుని ప్రజలు’ లేదా ‘విశ్వాసులు’
  rationale: ఈ పదం క్రైస్తవ సమాజంలోని సభ్యులను సూచిస్తుంది, ప్రత్యేకంగా గుర్తింపు పొందిన కొద్దిమందిని కాదు. మూలంలోని ‘పవిత్ర’ భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ఉద్దేశాన్ని పాదసూచికలో వివరించాం.
- issue: κατήνεγκα ψῆφον యొక్క బలం
  choice: ‘నా ఓటు వేశాను’
  alternative: ‘వారి మరణానికి నా సమ్మతి తెలిపాను’
  rationale: గ్రీకు పదబంధం ఓటు వేయడాన్ని నేరుగా సూచించగలదు; అయితే అది అధికారిక సభలోని చట్టబద్ధ ఓటేనా, లేక బలమైన ఆమోదాన్ని తెలిపే నానుడా అన్నది పాఠ్యం స్పష్టంగా నిర్ణయించదు. ప్రధాన పాఠ్యం ప్రత్యక్ష రూపాన్ని నిలిపి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడాం. ‘చెరసాలల్లో’ అనే బహువచనం, ‘ముఖ్య యాజకులు,’ ‘అధికారం’ వంటి మూల వివరాలను నిలిపాం. పునరుక్త τε...τε సంబంధాన్ని తెలుగులో అర్ధవిరామం మరియు ‘కూడా’ ద్వారా సహజంగా వ్యక్తపరచాం.
