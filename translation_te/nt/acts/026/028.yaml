source:
  edition: SBLGNT
  text: ὁ δὲ Ἀγρίππας πρὸς τὸν ⸀Παῦλον· Ἐν ὀλίγῳ με πείθεις Χριστιανὸν ⸀ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/028.yaml
  text: Then Agrippa said to Paul[a], “In a short time you are persuading me to become a Christian.”
translation:
  language: te
  text: అప్పుడు అగ్రిప్ప పౌలుతో, “ఇంత కొద్ది సమయంలోనే నేను క్రైస్తవుణ్ణి అయ్యేలా నన్ను ఒప్పిస్తున్నావు” అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను దాదాపు క్రైస్తవుణ్ణి అయ్యేలా నన్ను ఒప్పిస్తున్నావు.” లేదా, “ఇంత తక్కువ సమయంలో నన్ను క్రైస్తవుణ్ణి చేయగలనని అనుకుంటున్నావా?” అని కూడా అర్థం కావచ్చు. గ్రీకు పదబంధం కొద్ది సమయాన్నిగానీ, కొద్ది పరిమాణం లేదా స్థాయినిగానీ సూచించవచ్చు; అగ్రిప్ప మాటలు నిజాయితీతో అన్నవో, వ్యంగ్యంగా అన్నవో స్పష్టంగా లేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ Ἀγρίππας
  choice: అప్పుడు అగ్రిప్ప
  rationale: δέ స్వల్ప అనుసంధానాన్ని సూచిస్తుంది; కథన ప్రవాహంలో సహజంగా ఉండేందుకు ‘అప్పుడు’ అని అనువదించాం. గ్రీకులో వ్యక్తినామంతో ఉన్న article తెలుగులో వ్యక్తం చేయలేదు.
- source_word: πρὸς τὸν Παῦλον
  choice: పౌలుతో ... అన్నాడు
  rationale: మాట్లాడుటకు సంబంధించిన క్రియ గ్రీకులో అధ్యాహారంగా ఉంది. తెలుగులో ప్రత్యక్ష సంభాషణను సహజంగా చూపేందుకు ‘పౌలుతో ... అన్నాడు’ అని స్పష్టం చేశాం.
- source_word: Ἐν ὀλίγῳ
  choice: ఇంత కొద్ది సమయంలోనే
  rationale: ఈ పదబంధం కొద్ది కాలాన్నిగానీ, కొద్ది పరిమాణం లేదా స్థాయినిగానీ సూచించగలదు. ప్రధాన పాఠంలో కాలార్థాన్ని ఉంచి, ఇతర సాధ్యార్థాలను పాదసూచికలో భద్రపరిచాం.
- source_word: με πείθεις
  choice: నన్ను ... ఒప్పిస్తున్నావు
  rationale: వర్తమానకాల πείθεις ఈ సంభాషణలో కొనసాగుతున్న ఒప్పించే చర్యను సూచిస్తుంది; అందువల్ల ‘ఒప్పిస్తున్నావు’ సహజమైన సమానార్థకం.
- source_word: Χριστιανὸν
  choice: క్రైస్తవునిగా
  rationale: ποιῆσαιతో కలిసి ఇది ఫలితంగా కలిగే గుర్తింపు లేదా స్థితిని సూచిస్తుంది. పురుషుడైన అగ్రిప్పను ఉద్దేశించినందున ‘క్రైస్తవునిగా’ వాడాం.
- source_word: ποιῆσαι
  choice: చేయడానికి
  rationale: గ్రీకు నిర్మాణంలో ‘నన్ను క్రైస్తవునిగా చేయడం’ అనే causative/resultative భావం ప్రత్యక్షంగా ఉంది. తెలుగులోనూ ఆ నిర్మాణం సహజంగా ఉండటంతో ‘చేయడానికి’ అని ఉంచాం.
theological_decisions:
- issue: అగ్రిప్ప సమాధానంలోని స్వరం, ఉద్దేశం
  choice: ‘ఇంత కొద్ది సమయంలోనే నన్ను క్రైస్తవునిగా చేయడానికి ఒప్పిస్తున్నావు!’ అనే పైకి కనిపించే భావం
  alternative: ‘నన్ను దాదాపు క్రైస్తవునిగా ఒప్పించావు’ లేదా ‘ఇంత తక్కువ సమయంలో నన్ను క్రైస్తవునిగా చేయగలనని అనుకుంటున్నావా?’ అనే వ్యంగ్య ప్రశ్న
  rationale: Ἐν ὀλίγῳ కాలం లేదా స్థాయిని సూచించవచ్చు; అగ్రిప్ప స్వరం నిజాయితీతో కూడినదా, తప్పించుకునేదా, వ్యంగ్యమైనదా అనేది గ్రీకు వాక్యం తేల్చదు. ప్రధాన పాఠం ఉపరితల కాలార్థాన్ని ఇస్తూ, ఇతర పఠనాలను పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలిని వాడాం. మూలంలోని ప్రసిద్ధ సందిగ్ధతను ప్రధాన పాఠం మరియు పాదసూచిక కలిసి భద్రపరుస్తాయి.
