id: ACT.26.2
reference: Acts 26:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Περὶ πάντων ὧν ἐγκαλοῦμαι ὑπὸ Ἰουδαίων, βασιλεῦ Ἀγρίππα, ἥγημαι ἐμαυτὸν μακάριον ἐπὶ σοῦ μέλλων ⸂σήμερον ἀπολογεῖσθαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/002.yaml
  text: Concerning all the things of which I am accused by the Jews[a], King Agrippa, I consider myself fortunate that I am about to make my defense before you today,
translation:
  language: te
  text: “అగ్రిప్ప రాజా, యూదులు నాపై మోపుతున్న ఆరోపణలన్నిటి విషయమై ఈ రోజు మీ సమక్షంలో నా రక్షణ వాదనను వినిపించబోతున్నందుకు నన్ను నేను భాగ్యవంతుడిగా[a] భావిస్తున్నాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ధన్యుడిగా.” ఇక్కడ తన రక్షణ వాదనను అగ్రిప్ప సమక్షంలో వినిపించే అనుకూల అవకాశం లభించిందనే భావంలో “భాగ్యవంతుడిగా” అని ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ πάντων ὧν ἐγκαλοῦμαι
  choice: నాపై మోపుతున్న ఆరోపణలన్నిటి విషయమై
  rationale: περί విషయాన్ని సూచిస్తుంది; ἐγκαλοῦμαι న్యాయపరమైన సందర్భంలో ‘ఆరోపించబడుతున్నాను’ అనే భావం ఇస్తుంది. తెలుగు సహజ వాక్యనిర్మాణం కోసం కర్తను ముందుకు తెచ్చి ‘నాపై మోపుతున్న ఆరోపణలన్నిటి’ అని అనువదించాం.
- source_word: ὑπὸ Ἰουδαίων
  choice: యూదులు
  rationale: ὑπό ఆరోపణలు చేసేవారిని సూచిస్తుంది. సందర్భంలో ఇది పౌలును ఆరోపిస్తున్న యూదులను సూచిస్తుంది; యూదులందరిపైనా సాధారణీకరణ చేయదు.
- source_word: βασιλεῦ Ἀγρίππα
  choice: అగ్రిప్ప రాజా
  rationale: సంబోధన రూపాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: ἥγημαι ἐμαυτὸν μακάριον
  choice: నన్ను నేను భాగ్యవంతుడిగా భావిస్తున్నాను
  rationale: ἡγέομαι యొక్క ‘భావించు/ఎంచు’ భావాన్నీ, ἐμαυτόν యొక్క ఆత్మవాచక నిర్మాణాన్నీ నిలుపుతుంది. న్యాయవాదన చేసే అనుకూల అవకాశం దొరికిందనే సందర్భానికి ‘భాగ్యవంతుడు’ సరిపోతుంది; μακάριον లోని ‘ధన్యుడు’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: ἐπὶ σοῦ
  choice: మీ సమక్షంలో
  rationale: విచారణ లేదా అధికారిక వాదన సందర్భంలో ఒకరి ఎదుట హాజరై మాట్లాడడాన్ని సూచిస్తుంది. ‘మీ సమక్షంలో’ గౌరవప్రదంగా, సహజంగా ఉంది.
- source_word: μέλλων σήμερον ἀπολογεῖσθαι
  choice: ఈ రోజు ... నా తరఫున వాదించబోతున్నందుకు
  rationale: μέλλων సమీప భవిష్యత్తును సూచిస్తుంది; ἀπολογεῖσθαι న్యాయపరంగా తన రక్షణ వాదన వినిపించడాన్ని సూచిస్తుంది. ‘నా తరఫున వాదించు’ ఈ న్యాయార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: μακάριον యొక్క భావవ్యాప్తి
  choice: భాగ్యవంతుడిగా
  alternative: ధన్యుడిగా
  rationale: ఈ న్యాయసందర్భంలో అగ్రిప్ప ఎదుట తన వాదన వినిపించే అనుకూల అవకాశం కలిగినవాడనే భావం ప్రధానంగా ఉంది. అయినా పదానికి ‘ధన్యుడు’ అనే విస్తృత భావం కూడా ఉండగలదు కాబట్టి దాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయసందర్భ శైలిని ఉపయోగించాం. గ్రీకు వాక్యం తరువాతి వచనంలో కొనసాగుతున్నప్పటికీ, తెలుగు పఠన సౌలభ్యం కోసం ఈ వచనాన్ని సంపూర్ణ వాక్యంగా ఇచ్చాం.
