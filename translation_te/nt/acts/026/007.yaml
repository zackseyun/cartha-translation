  to: దానిని చేరుకోవాలని మన పన్నెండు గోత్రాల ప్రజలు[a] రాత్రింబగళ్లు ఎంతో అంకితభావంతో దేవునికి సేవ చేస్తూ[b] ఆశిస్తున్నారు. మహారాజా, ఈ ఆశను గురించే యూదులు[c] నాపై అభియోగం మోపుతున్నారు.
