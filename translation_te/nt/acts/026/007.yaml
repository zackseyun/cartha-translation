id: ACT.26.7
reference: Acts 26:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰς ἣν τὸ δωδεκάφυλον ἡμῶν ἐν ἐκτενείᾳ νύκτα καὶ ἡμέραν λατρεῦον ἐλπίζει καταντῆσαι· περὶ ἧς ἐλπίδος ἐγκαλοῦμαι ⸂ὑπὸ Ἰουδαίων, βασιλεῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/007.yaml
  text: to which our twelve tribes hope to attain[a], as they earnestly serve God night and day. It is concerning this hope that I am accused by the Jews[c][b], O king.
translation:
  language: te
  text: దానిని చేరుకోవాలని మన పన్నెండు గోత్రాల ప్రజలు[a] రాత్రింబగళ్లు ఎంతో అంకితభావంతో దేవునికి సేవ చేస్తూ[b] ఆశిస్తున్నారు. మహారాజా, ఈ ఆశను గురించే యూదులు[c] నాపై అభియోగం మోపుతున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మన పన్నెండు గోత్రాల జనము.” గ్రీకులో ఇశ్రాయేలును పన్నెండు గోత్రాలతో కూడిన ఒక సమష్టి ప్రజగా సూచించే ఏకవచన పదం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దేవుణ్ణి ఆరాధిస్తూ.” గ్రీకు క్రియ దేవునికి చేసే మతపరమైన సేవను లేదా ఆరాధనను సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: అంటే, పౌలుపై అభియోగం చేసిన యూదులు; యూదులందరినీ కలిపి చెప్పడం కాదు.
    reason: contextual_clarification
lexical_decisions:
- source_word: εἰς ἣν
  choice: దానిని చేరుకోవాలని
  rationale: మునుపటి వచనంలోని వాగ్దానాన్ని సూచిస్తూ, ఆశ దిశగా సాగుతున్న లక్ష్యభావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τὸ δωδεκάφυλον ἡμῶν
  choice: మన పన్నెండు గోత్రాల ప్రజలు
  rationale: గ్రీకులోని సమష్టి ఏకవచనం ఇశ్రాయేలును పన్నెండు గోత్రాలతో కూడిన ఒక ప్రజాసమూహంగా సూచిస్తుంది; ఈ రూపం తెలుగులో సహజంగా ఉండి ఆ సమష్టి భావాన్ని కాపాడుతుంది.
- source_word: ἐν ἐκτενείᾳ
  choice: ఆసక్తితో
  rationale: తీవ్రమైన, పట్టుదలగల అంకితభావాన్ని సామాన్య ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: νύκτα καὶ ἡμέραν
  choice: రాత్రింబగళ్లు
  rationale: గ్రీకు క్రమాన్నీ నిరంతర కార్యభావాన్నీ సహజమైన తెలుగు నుడికారంలో అందిస్తుంది.
- source_word: λατρεῦον
  choice: దేవునికి సేవ చేస్తూ
  rationale: ఈ క్రియ దేవునికి అర్పించే మతపరమైన సేవ లేదా ఆరాధనను సూచిస్తుంది. సందర్భానుసారంగా అంతర్లీనమైన దేవుణ్ణి స్పష్టం చేసి, క్రియ యొక్క విస్తృత సేవాభావాన్ని నిలుపుతుంది.
- source_word: ἐλπίζει καταντῆσαι
  choice: చేరుకోవాలని ... ఆశిస్తున్నారు
  rationale: ఆశించిన లక్ష్యాన్ని చేరడం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: περὶ ἧς ἐλπίδος
  choice: ఈ ఆశను గురించే
  rationale: περί యొక్క ‘గురించి’ అనే భావాన్ని నిలుపుతూ, ముందుగా పేర్కొన్న ఆశతో సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: ἐγκαλοῦμαι
  choice: నాపై నేరం మోపుతున్నారు
  rationale: న్యాయస్థాన సందర్భంలోని నిందారోపణ భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ὑπὸ Ἰουδαίων
  choice: యూదులు
  rationale: కర్తృవాచక నిర్మాణంలో సహజమైన తెలుగుగా మార్చినా, పౌలుపై నేరం మోపుతున్న యూదులను మాత్రమే సందర్భం సూచిస్తుంది.
- source_word: βασιλεῦ
  choice: మహారాజా
  rationale: అగ్రిప్పను నేరుగా సంబోధించే గౌరవప్రదమైన సంబోధనను సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: λατρεῦον యొక్క అంతర్లీన కర్మ
  choice: ‘దేవునికి సేవ చేస్తూ’ అని దేవుణ్ణి స్పష్టంగా పేర్కొనడం
  alternative: ‘ఆరాధిస్తూ’ లేదా కేవలం ‘సేవ చేస్తూ’
  rationale: గ్రీకు వాక్యంలో దేవుడు ప్రత్యక్షంగా లేకపోయినా, ఇశ్రాయేలు యొక్క నిరంతర మతపరమైన సేవ సందర్భంలో ఆయనే సహజమైన కర్మ. ఇది కొత్త సిద్ధాంతాన్ని చేర్చకుండా అర్థాన్ని స్పష్టం చేస్తుంది.
- issue: ఆశ దేనిని సూచిస్తుంది
  choice: మునుపటి వచనంలోని దేవుని వాగ్దానంతో సంబంధాన్ని ఉంచి, ఈ వచనంలో పునరుత్థానాన్ని ప్రత్యక్షంగా చేర్చకపోవడం
  alternative: ‘పునరుత్థాన ఆశ’ అని స్పష్టం చేయడం
  rationale: విస్తృత సందర్భంలో పునరుత్థానం ప్రధానమైనప్పటికీ, ఈ వచనం దానిని మళ్లీ ప్రత్యక్షంగా పేర్కొనదు. కాబట్టి మూలపాఠంలోని సూచనాత్మకతను నిలుపుతుంది.
- issue: ὑπὸ Ἰουδαίων యొక్క పరిధి
  choice: ‘యూదులు’ అని అనువదించి, సందర్భపరమైన పరిమితిని పాదటీకలో వివరించడం
  alternative: ‘కొందరు యూదులు’ అని ప్రధాన పాఠంలో చేర్చడం
  rationale: మూలంలో ‘కొందరు’ లేదు; అయితే ఇది యూదులందరినీ ఉద్దేశించిన సాధారణ ప్రకటన కాక, పౌలు మీద అభియోగం చేసినవారి గురించి న్యాయసందర్భంలోని మాట.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, బహిరంగ న్యాయవాదనకు తగిన శైలి. ‘మహారాజా’ అనే సంబోధన రాజును ఉద్దేశించిన వాక్చాతుర్యాన్ని నిలుపుతుంది; వాక్య నిర్మాణం సాధారణ పాఠకులకు స్పష్టంగా ఉంచబడింది.
