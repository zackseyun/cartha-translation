id: ACT.26.18
reference: Acts 26:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν, τοῦ ⸀ἐπιστρέψαι ἀπὸ σκότους εἰς φῶς καὶ τῆς ἐξουσίας τοῦ Σατανᾶ ἐπὶ τὸν θεόν, τοῦ λαβεῖν αὐτοὺς ἄφεσιν ἁμαρτιῶν καὶ κλῆρον ἐν τοῖς ἡγιασμένοις πίστει τῇ εἰς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/018.yaml
  text: to open their eyes[a], so that they may turn from darkness to light and from the authority of Satan to God[b], that they may receive forgiveness of sins and an inheritance among those who have been sanctified by faith in me.
translation:
  language: te
  text: వారి కళ్లను తెరిచేందుకు, వారు చీకటి నుండి వెలుగులోనికి, సాతాను అధికారంనుండి దేవునివైపుకు తిరిగి, పాపాల క్షమాపణను, నాపై విశ్వాసం ద్వారా పవిత్రపరచబడినవారి[b] మధ్య వారసత్వాన్ని పొందేలా.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సాతాను శక్తి’ లేదా ‘సాతాను ఆధిపత్యం.’ గ్రీకు పదం అధికారం, పాలనాశక్తి లేదా ఆధిపత్య పరిధిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పరిశుద్ధుల.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν
  choice: వారి కళ్లు తెరవడానికి
  rationale: ఆత్మీయ అవగాహనను సూచించే శరీరసంబంధ రూపకాన్ని యథాతథంగా ఉంచుతూ, ఉద్దేశాన్ని తెలిపే infinitive భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοῦ ἐπιστρέψαι
  choice: తద్వారా వారు ... తిరిగి
  rationale: Articular infinitive యొక్క ఉద్దేశ భావాన్ని చూపుతుంది. ‘తిరిగి’ అనేది మార్పు లేదా దిశామార్పును నిలుపుతుంది; ‘మతం మార్చుకొని’ వంటి సంకుచిత అర్థాన్ని రుద్దదు.
- source_word: ἀπὸ σκότους εἰς φῶς
  choice: చీకటి నుండి వెలుగువైపుకు
  rationale: మూలంలోని బలమైన రూపకాల విరుద్ధతను సహజంగా నిలుపుతుంది.
- source_word: τῆς ἐξουσίας τοῦ Σατανᾶ
  choice: సాతాను అధికారం
  rationale: ἐξουσία ఇక్కడ అధికారం, పాలనాధికారం లేదా ఆధిపత్య పరిధిని సూచించగలదు. ‘అధికారం’ నేరమైన ప్రధాన అనువాదం; ఇతర భావసాధ్యతలను పాదటిప్పణి సూచిస్తుంది.
- source_word: ἐπὶ τὸν θεόν
  choice: దేవునివైపుకు
  rationale: దిశ, అనుబంధ మార్పు రెండింటినీ సూచించే గ్రీకు ప్రయోగాన్ని ‘వైపుకు’ స్పష్టంగా నిలుపుతుంది.
- source_word: τοῦ λαβεῖν αὐτοὺς
  choice: వారు ... పొందేలా
  rationale: రెండవ ఉద్దేశ infinitive ను సహజమైన తెలుగు వాక్యనిర్మాణంలో చూపుతుంది.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: పాపాల క్షమాపణను
  rationale: ἄφεσις యొక్క విడుదల/క్షమాపణ భావంలో, ఈ సందర్భానికి స్పష్టమైన మరియు సాధారణ నూతన నిబంధన పదప్రయోగం.
- source_word: κλῆρον
  choice: వారసత్వాన్ని
  rationale: దేవుని ప్రజల మధ్య లభించే కేటాయింపబడిన భాగం లేదా స్వాస్థ్యాన్ని సూచిస్తుంది. ‘వారసత్వం’ నిబంధనాత్మక, భవిష్యదాశ సంబంధ భావాన్ని బాగా అందిస్తుంది; ‘వంతు’ కూడా సాధ్యమని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: ἐν τοῖς ἡγιασμένοις
  choice: పవిత్రపరచబడినవారి మధ్య
  rationale: Perfect passive participle లోని జరిగిన చర్య మరియు కొనసాగుతున్న స్థితి రెండింటినీ ‘పవిత్రపరచబడినవారు’ నిలుపుతుంది.
- source_word: πίστει τῇ εἰς ἐμέ
  choice: నాపై విశ్వాసం ద్వారా
  rationale: πίστις ను ‘విశ్వాసం’గా, εἰς ἐμέ ను దాని వ్యక్తిగత లక్ష్యంగా చూపుతుంది. Instrumental dative ను ‘ద్వారా’ వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: πίστει τῇ εἰς ἐμέ యొక్క భావం
  choice: నాపై విశ్వాసం ద్వారా
  alternative: నన్ను నమ్మడం ద్వారా
  rationale: ఇది వివాదాస్పదమైన pistis-Christou genitive నిర్మాణం కాదు; విశ్వాసానికి యేసే లక్ష్యమని εἰς ἐμέ స్పష్టంగా తెలుపుతుంది. ‘విశ్వాసం’ మూలపదానికి స్థిరమైన theological పదాన్ని నిలుపుతుంది.
- issue: ἐν τοῖς ἡγιασμένοις లో క్రియాత్మక భావం
  choice: పవిత్రపరచబడినవారి మధ్య
  alternative: పరిశుద్ధుల మధ్య
  rationale: Perfect passive participle ను కేవలం ఒక బిరుదుగా మార్చకుండా, వారు పవిత్రపరచబడి ఆ స్థితిలో ఉన్నారనే భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. మూలంలోని కళ్లు, చీకటి, వెలుగు రూపకాలను నిలుపుతూ, వరుస ఉద్దేశ వాక్యభావాన్ని సహజమైన తెలుగు నిర్మాణంలో అందించింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
