id: ACT.26.29
reference: Acts 26:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Παῦλος· Εὐξαίμην ἂν τῷ θεῷ καὶ ἐν ὀλίγῳ καὶ ἐν ⸀μεγάλῳ οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι παρεκτὸς τῶν δεσμῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/029.yaml
  text: But Paul said[a], “I would pray to God that whether in a short time or in a long time, not only you but also all who hear me today might become such as I am—except for these chains.”
translation:
  language: te
  text: 'అయితే పౌలు ఇలా అన్నాడు[a]: “కొద్ది కాలంలోనైనా, ఎక్కువ కాలంలోనైనా, నీవు మాత్రమే కాదు, ఈ రోజు నా మాట వింటున్న వారందరూ—ఈ సంకెళ్లు తప్ప—నాలాగే కావాలని నేను దేవునికి ప్రార్థిస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దాదాపుగానైనా, పూర్తిగానైనా”; ఈ గ్రీకు ప్రయోగం క్లిష్టమైనది. అది స్థాయి, ప్రయత్నం, లేదా కాలం/వ్యాప్తిని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐξαίμην ἂν τῷ θεῷ
  choice: నేను దేవుణ్ణి ప్రార్థిస్తున్నాను
  rationale: εὔχομαιతో వచ్చిన τῷ θεῷ ప్రార్థన ఎవరికి ఉద్దేశించబడిందో చూపుతుంది. సంభావనార్థక కోరికను తెలుగులో సహజంగా, గౌరవప్రదంగా వ్యక్తం చేయడానికి ఈ రూపం ఎంచుకోబడింది.
- source_word: ἐν ὀλίγῳ καὶ ἐν μεγάλῳ
  choice: కొద్ది కాలంలోనైనా, ఎక్కువ కాలంలోనైనా
  rationale: ఈ క్లిష్టమైన జంట ప్రయోగానికి కాలం, పరిమాణం, ప్రయత్నం లేదా స్థాయి అనే భావాలు ఉండవచ్చు. ప్రధాన పాఠంలో సందర్భానికి సరిపోయే కాలవ్యాప్తి భావాన్ని ఇచ్చి, ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον
  choice: నీవు మాత్రమే కాదు, ఈ రోజు నా మాట వింటున్న వారందరూ
  rationale: οὐ μόνον... ἀλλὰ καὶ అనే బలమైన వ్యత్యాసాన్ని, ప్రస్తుతం పౌలు మాట వింటున్నవారనే వర్తమాన కృదంత భావాన్ని సహజమైన తెలుగులో నిలిపింది.
- source_word: γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι
  choice: నాలాగే కావాలని
  rationale: పౌలు ఉన్న స్థితివలె శ్రోతలు కూడా కావాలనే ఆశించిన ఫలితాన్ని సూటిగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παρεκτὸς τῶν δεσμῶν τούτων
  choice: ఈ సంకెళ్లు తప్ప
  rationale: παρεκτός మినహాయింపును సూచిస్తుంది; δεσμοίకి ఖైదు సందర్భంలో స్పష్టమైన, సజీవమైన తెలుగు పదం ‘సంకెళ్లు’.
theological_decisions:
- issue: అగ్రిప్పా ముందటి మాటతో సంబంధించి ἐν ὀλίγῳ καὶ ἐν μεγάλῳ యొక్క అర్థం
  choice: కాలవ్యాప్తి భావంతో ‘కొద్ది కాలంలోనైనా, ఎక్కువ కాలంలోనైనా’
  alternative: ‘దాదాపుగానైనా, పూర్తిగానైనా’; ‘కొద్ది ప్రయత్నంతోనైనా, ఎక్కువ ప్రయత్నంతోనైనా’
  rationale: గ్రీకు ప్రయోగం నిజంగా సందిగ్ధమైనది. సందర్భానికి సరిపోయే కాలవ్యాప్తి భావాన్ని ప్రధాన పాఠంలో ఇచ్చి, ఇతర సాధ్యార్థాలను పాదసూచికలో భద్రపరచడం ద్వారా సందిగ్ధతను పూర్తిగా తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘నీవు’ రాజైన అగ్రిప్పాను ఉద్దేశించిన ఏకవచన రూపాన్ని నిలుపుతుంది; ‘ఈ సంకెళ్లు తప్ప’ అనే ముగింపు పౌలు మాటలోని హృదయపూర్వకతతో కూడిన చమత్కార వ్యత్యాసాన్ని కాపాడుతుంది.
