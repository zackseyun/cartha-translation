  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: προγινώσκοντές με ἄνωθεν, ἐὰν θέλωσι μαρτυρεῖν, ὅτι κατὰ τὴν ἀκριβεστάτην αἵρεσιν τῆς ἡμετέρας θρησκείας ἔζησα Φαρισαῖος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/005.yaml
  text: They have known me from the beginning[a], if they are willing to testify[b], that I lived as a Pharisee according to the strictest sect of our religion.
translation:
  language: te
  text: వారు నన్ను ఆరంభం నుంచే తెలిసినవారు[a]. వారు సాక్ష్యం చెప్పడానికి ఇష్టపడితే, మన మతంలోని అత్యంత కఠినమైన వర్గానికి[b] చెందిన పరిసయ్యునిగా నేను జీవించానని సాక్ష్యం చెప్పగలరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మొదటినుంచి’ లేదా ‘చాలాకాలంగా.’
    reason: lexical_alternative
  - marker: b
    text: ‘వర్గం’ అని అనువదించిన గ్రీకు పదం αἵρεσις. ఇక్కడ అది ఒక వర్గం లేదా పక్షం అని అర్థం; తరువాతి సాంకేతిక అర్థంలోని ‘మతభ్రంశం’ కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: προγινώσκοντές
  choice: ఎరిగినవారు
  rationale: పౌలుతో గతం నుంచి కొనసాగుతున్న పరిచయాన్ని తెలిపే సహజమైన, గౌరవప్రదమైన తెలుగు ప్రయోగం.
- source_word: ἄνωθεν
  choice: మొదటి నుంచే
  rationale: ఇక్కడ ‘పైనుండి’ అనే అర్థం కాదు; పౌలు జీవితపు తొలినాళ్ల నుంచి లేదా ఆరంభం నుంచే వారికి అతడు తెలుసని సూచిస్తుంది.
- source_word: ἐὰν θέλωσι μαρτυρεῖν
  choice: సాక్ష్యం చెప్పడానికి వారు ఇష్టపడితే
  rationale: θέλωσι లోని సుముఖతను, μαρτυρεῖν లోని న్యాయస్థాన సంబంధమైన సాక్ష్యభావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: ἀκριβεστάτην
  choice: అత్యంత కట్టుబాటైన
  rationale: మతాచరణలోని కఠినతను, నియమనిష్ఠను సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αἵρεσιν
  choice: తెగ
  rationale: ఇక్కడ యూదమతంలోని గుర్తింపు పొందిన వర్గాన్ని సూచిస్తుంది; తరువాతి సాంకేతిక అర్థంలోని ‘మతభ్రంశం’ను సూచించదు.
- source_word: θρησκείας
  choice: మతంలోని
  rationale: సందర్భంలో యూదుల ఉమ్మడి మతవ్యవస్థను సూచించే స్పష్టమైన తెలుగు పదం.
- source_word: ἔζησα Φαρισαῖος
  choice: పరిసయ్యునిగా జీవించాను
  rationale: పౌలు గత జీవనవిధానాన్ని మరియు వర్గపరమైన గుర్తింపును సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యూదుల చారిత్రక సందర్భంలో αἵρεσις అనువాదం
  choice: తెగ
  alternative: వర్గం; మతభ్రంశం
  rationale: ఈ పదం ఇక్కడ పరిసయ్యులను యూదమతంలోని ఒక గుర్తింపు పొందిన వర్గంగా సూచిస్తుంది. ‘మతభ్రంశం’ అనడం తరువాతి కాలపు ప్రతికూల వేదాంతార్థాన్ని అనవసరంగా దిగుమతి చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయసాక్ష్య సందర్భానికి తగిన గౌరవప్రదమైన శైలి. ‘ఎరిగినవారు’ కొద్దిగా ఉన్నత రిజిస్టర్‌లో ఉన్నా సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది. [a], [b] గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
