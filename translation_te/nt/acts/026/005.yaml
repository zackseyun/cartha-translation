revisions:
- from: వారు నన్ను మొదటి నుంచే ఎరిగినవారు[a]; సాక్ష్యం చెప్పడానికి వారు ఇష్టపడితే, మన మతంలోని అత్యంత కట్టుబాటైన తెగను అనుసరించి నేను పరిసయ్యునిగా జీవించానని చెప్పగలరు.[b]
  to: వారు నన్ను ఆరంభం నుంచే తెలిసినవారు[a]. వారు సాక్ష్యం చెప్పడానికి ఇష్టపడితే, మన మతంలోని అత్యంత కఠినమైన వర్గానికి[b] చెందిన పరిసయ్యునిగా నేను జీవించానని సాక్ష్యం చెప్పగలరు.
