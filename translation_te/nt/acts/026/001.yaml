id: ACT.26.1
reference: Acts 26:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀγρίππας δὲ πρὸς τὸν Παῦλον ἔφη· Ἐπιτρέπεταί σοι ⸀ὑπὲρ σεαυτοῦ λέγειν. τότε ὁ Παῦλος ⸂ἐκτείνας τὴν χεῖρα ἀπελογεῖτο⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/001.yaml
  text: 'Then Agrippa said to Paul[b][a], “You are permitted to speak on your own behalf.” Then Paul stretched out his hand and made his defense:'
translation:
  language: te
  text: 'అప్పుడు అగ్రిప్ప పౌలుతో, “నీ పక్షాన మాట్లాడడానికి నీకు అనుమతి ఉంది[a]” అని చెప్పాడు. అప్పుడు పౌలు చెయ్యి చాపి తనను సమర్థించుకుంటూ మాట్లాడాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ తరఫున మాట్లాడడానికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγρίππας
  choice: అగ్రిప్ప
  rationale: గ్రీకు వ్యక్తినామాన్ని ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ కథన పురోగతిని సూచించే δέను సహజమైన తెలుగు కాలక్రమ సంధానంతో వ్యక్తం చేశాం.
- source_word: πρὸς τὸν Παῦλον ἔφη
  choice: పౌలుతో ... అని చెప్పాడు
  rationale: మాట్లాడే క్రియతో వచ్చిన πρὸςను సహజ తెలుగు ప్రయోగంగా అనువదించాం.
- source_word: Ἐπιτρέπεταί σοι
  choice: నీకు అనుమతి ఉంది
  rationale: అనుమతి ఇవ్వబడిన భావాన్ని నిలుపుతూ, అధికారిక సందర్భానికి తగిన సహజ తెలుగు రూపాన్ని ఎంచుకున్నాం.
- source_word: ὑπὲρ σεαυτοῦ λέγειν
  choice: నీ పక్షంగా నీవు మాట్లాడడానికి
  rationale: న్యాయసంబంధ సందర్భంలో ὑπέρ సూచించే ‘తన తరఫున/తన పక్షంగా’ అనే భావాన్ని స్పష్టంగా ఉంచాం; దీనిని తప్పనిసరిగా ‘తనను సమర్థించుకోవడం’గా సంకుచితం చేయలేదు.
- source_word: τότε
  choice: అప్పుడు
  rationale: గ్రీకులో స్పష్టంగా ఉన్న కాలక్రమ సూచనను నిలిపాం.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: చెయ్యి చాపి
  rationale: శారీరక సంజ్ఞను అదనపు వ్యాఖ్యానం లేకుండా సహజంగా వ్యక్తం చేశాం.
- source_word: ἀπελογεῖτο
  choice: తన సమర్థనను వినిపించాడు
  rationale: న్యాయపరమైన ప్రతివాదం లేదా సమర్థనను అందించడం అనే క్రియార్థాన్ని, అసలు పాఠ్యంలో స్పష్టంగా లేని ‘ప్రారంభించాడు’ అనే భావాన్ని చేర్చకుండా వ్యక్తం చేశాం.
theological_decisions:
- issue: ὑπὲρ σεαυτοῦ యొక్క న్యాయసంబంధ భావవ్యాప్తి
  choice: నీ పక్షంగా నీవు మాట్లాడడానికి
  alternative: నీ గురించి నీవు మాట్లాడడానికి / నిన్ను నీవు సమర్థించుకోవడానికి
  rationale: ఈ సందర్భం న్యాయ విచారణకు సంబంధించినదైనా, గ్రీకు పదబంధంలోని విస్తృత ‘తన తరఫున మాట్లాడడం’ భావాన్ని నిలిపి, మరింత సంకుచితమైన సిద్ధాంతాత్మక లేదా న్యాయపర వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా పెట్టలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన న్యాయసభా సందర్భానికి సరిపోయే సరళమైన శైలి. ‘చెయ్యి’ సాధారణ ఆధునిక రూపం; వాక్యాంతంలోని ద్విబిందువు తరువాత వచ్చే పౌలు ప్రసంగాన్ని సూచిస్తుంది.
