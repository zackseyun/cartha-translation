  text: delivering you from the people and from the Gentiles[a], to whom I am sending you
translation:
  language: te
  text: ప్రజల నుండి, యూదేతరుల నుండి నిన్ను విడిపిస్తూ, నేను నిన్ను వారి వద్దకు పంపుతున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూద ప్రజల నుండి, యూదేతరుల నుండి నిన్ను రక్షిస్తూ.”
    reason: ‘ప్రజలు’ అనే పదానికి సందర్భానుసారమైన స్పష్టీకరణను, ἐξαιρούμενόςకు ‘రక్షిస్తూ’ అనే సమానార్థక ప్రత్యామ్నాయాన్ని చూపించడానికి.
lexical_decisions:
- source_word: ἐξαιρούμενός
  choice: కాపాడుతూ
  rationale: ἐξαιρέω అనే క్రియలో ప్రమాదం లేదా శత్రుత్వం నుంచి విడిపించడం/రక్షించడం అనే భావం ఉంది. వర్తమాన మధ్యమ కృదంత రూపాన్ని ప్రధాన క్రియతో సంబంధం కలిగిన కొనసాగుతున్న చర్యగా సహజమైన తెలుగులో ‘కాపాడుతూ’ అని ఇచ్చాం.
- source_word: τοῦ λαοῦ
  choice: ప్రజల
  rationale: గ్రీకులో నిర్దిష్టంగా ‘ప్రజలు’ అని మాత్రమే ఉంది; యూదేతరులతో ఉన్న వ్యత్యాసం వల్ల సందర్భంలో ఇది యూద ప్రజలను సూచిస్తుంది. మూలంలోని సంక్షిప్తతను, అంతర్గత యూద దృష్టికోణాన్ని నిలుపుకోవడానికి ప్రధాన పాఠంలో ‘ప్రజల’ అని ఉంచాం.
- source_word: τῶν ἐθνῶν
  choice: యూదేతరుల
  rationale: ఈ యూద–యూదేతర వ్యత్యాస సందర్భంలో ἔθνη దేశాలను కాక యూదులు కాని ప్రజలను సూచిస్తుంది. ఆధునిక తెలుగులో ‘యూదేతరులు’ ఆ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: εἰς οὓς
  choice: వారి దగ్గరికి
  rationale: పంపడం అనే క్రియ తరువాత εἰς οὓς గమ్యాన్ని సూచిస్తుంది. తెలుగులో వ్యక్తుల వద్దకు పంపడాన్ని సహజంగా ‘వారి దగ్గరికి’ అని వ్యక్తపరుస్తారు.
- source_word: ἀποστέλλω
  choice: నేను నిన్ను ... పంపుతున్నాను
  rationale: వర్తమాన కాలంలోని నియామక భావాన్ని, పంపబడుతున్న వ్యక్తి ‘నీవు’ అనే విషయాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ప్రజలు’ అనే పదం ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో ‘ప్రజలు’ అని ఉంచి, సందర్భంలో అది యూద ప్రజలను సూచిస్తుందని పాదసూచికలో తెలిపాం.
  alternative: ‘యూద ప్రజలు’ లేదా ‘ఇశ్రాయేలు ప్రజలు’ అని ప్రధాన పాఠంలో స్పష్టీకరించడం.
  rationale: యూదేతరులతో ఉన్న వ్యత్యాసం యూద ప్రజలనే సూచిస్తున్నప్పటికీ, గ్రీకు మూలంలో λαός మాత్రమే ఉంది. అందువల్ల మూల పదప్రయోగాన్ని నిలుపుతూ, అవసరమైన సందర్భ స్పష్టతను పాదసూచికలో ఇచ్చాం.
- issue: ἐξαιρούμενός యొక్క కార్యభావం
  choice: ‘కాపాడుతూ’—యేసు పౌలును శత్రుత్వం నుంచి రక్షించే చర్యగా అనువదించాం.
  alternative: ‘విడిపిస్తూ’ లేదా ‘బయటికి తీస్తూ.’
  rationale: ఈ సందర్భంలో పదం కేవలం ఒక సమూహం మధ్య నుంచి బయటకు తీయడంకంటే ప్రమాదం నుంచి రక్షించడం అనే భావాన్ని బలంగా కలిగి ఉంది; ‘కాపాడుతూ’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన శైలిని వాడాం. ‘నుండీ ... నుండీ’ అనే సమాంతర నిర్మాణం మూలంలోని ద్వంద్వ వ్యత్యాసాన్ని నిలుపుతుంది; ‘వారి దగ్గరికి’ పంపబడే గమ్యాన్ని సహజంగా తెలియజేస్తుంది. పాదసూచిక సూచిక [a] ప్రధాన పాఠంలో పొందుపరచబడింది.
