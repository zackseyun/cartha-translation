id: ACT.26.15
reference: Acts 26:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ δὲ εἶπα· Τίς εἶ, κύριε; ὁ δὲ ⸀κύριος εἶπεν· Ἐγώ εἰμι Ἰησοῦς ὃν σὺ διώκεις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/015.yaml
  text: And I said[a], ‘Who are you, Lord?’ And the Lord said, ‘I am Jesus, whom you are persecuting.’
translation:
  language: te
  text: అప్పుడు నేను, “ప్రభువా, నీవెవరు?”[a] అని అడిగాను. అందుకు ప్రభువు, “నేను యేసును; నీవు హింసిస్తున్నది నన్నే” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అయ్యా, నీవెవరు?” గ్రీకు κύριε అనే పదం గౌరవపూర్వక సంబోధనగా కూడా వాడవచ్చు. అయితే ఇక్కడ పరలోక దర్శనంలో మాట్లాడుతున్న వ్యక్తి వెంటనే యేసుగా గుర్తించబడుతున్నందున ప్రధాన పాఠ్యంలో “ప్రభువా” అని ఇచ్చాం.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ εἶπα
  choice: అప్పుడు నేను ... అని అడిగాను
  rationale: δέ ఇక్కడ స్వల్ప కథన అనుసంధానాన్ని సూచిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా ఉంటుంది. ప్రశ్నను పలికిన సందర్భంలో εἶπα ను అక్షరార్థమైన ‘చెప్పాను’ కంటే ‘అడిగాను’గా ఇవ్వడం సహజమైన సమానార్థాన్ని అందిస్తుంది.
- source_word: Τίς εἶ, κύριε;
  choice: ప్రభువా, నీవెవరు?
  rationale: τίς εἶ అంటే ‘నీవెవరు?’ κύριε సంబోధనను పరలోక దర్శన సందర్భం మరియు వెంటనే యేసుగా జరిగే గుర్తింపు దృష్ట్యా ‘ప్రభువా’గా అనువదించాం; గౌరవార్థక సంబోధన అనే సాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: ὁ δὲ κύριος εἶπεν
  choice: అందుకు ప్రభువు ... అని చెప్పాడు
  rationale: δέ ప్రతిస్పందనను అనుసంధానిస్తుంది కాబట్టి ‘అందుకు’ సహజంగా ఉంది. నిర్దిష్టంగా గుర్తించబడిన వక్తను ὁ κύριος సూచిస్తుంది; అందువల్ల ‘ప్రభువు’ అని ఇచ్చాం.
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: యేసును నేనే
  rationale: తెలుగులో గుర్తింపు వాక్యానికి ‘యేసును నేనే’ సహజంగా ఉండి, ముందున్న సంబంధవాచక ఉపవాక్యంతో సులభంగా కలుస్తుంది. Ἐγώ యొక్క వ్యక్త స్వరూపం ‘నేనే’లో ప్రతిఫలిస్తుంది; సందర్భానికి మించిన అదనపు భావం చేర్చదు.
- source_word: ὃν σὺ διώκεις
  choice: నీవు హింసిస్తున్న
  rationale: διώκεις యొక్క కొనసాగుతున్న శత్రుత్వ చర్యను ‘హింసిస్తున్న’ సహజంగా వ్యక్తపరుస్తుంది. వ్యక్తంగా ఉన్న σὺ ను ‘నీవు’గా నిలిపాం.
theological_decisions:
- issue: సౌలు చేసిన సంబోధనలో κύριε పదం
  choice: ప్రభువా
  alternative: అయ్యా
  rationale: κύριε కొన్నిసందర్భాల్లో సాధారణ గౌరవ సంబోధనగా ఉండగలదు. అయితే ఇక్కడ పరలోక దర్శనంలో మాట్లాడుతున్న వ్యక్తి వెంటనే యేసుగా తనను తెలియజేయడం, తరువాత కథకుడు ὁ κύριος అనడం వల్ల ప్రధాన పాఠ్యంలో ‘ప్రభువా’ సముచితం. అసలు పదంలోని సాధ్యమైన గౌరవార్థక భావాన్ని పాదసూచిక కాపాడుతుంది.
- issue: ὁ κύριος ద్వారా వక్త గుర్తింపు
  choice: ప్రభువు
  alternative: ఆ ప్రభువు
  rationale: గ్రీకు నిర్దిష్ట ఉపపదం ఇప్పటికే తెలిసిన వక్తను సూచిస్తుంది. తెలుగులో ‘ప్రభువు’ సహజంగా ఆ నిర్దిష్టతను తెలియజేస్తుంది; ‘ఆ’ చేర్చడం అనవసరమైన సూచనాత్మక బలాన్ని కలిగించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ‘నీవు’ అనే ఏకవచన రూపం మూలంలోని σὺ ను నిలుపుతుంది; దైవసంబోధనలో తెలుగు బైబిలు వాడుకకు అనుగుణంగా ఉంది.
