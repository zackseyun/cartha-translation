  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπίσταται γὰρ περὶ τούτων ὁ βασιλεύς, πρὸς ὃν ⸀καὶ παρρησιαζόμενος λαλῶ· λανθάνειν γὰρ ⸀αὐτὸν τούτων οὐ πείθομαι ⸀οὐθέν, οὐ γάρ ⸀ἐστιν ἐν γωνίᾳ πεπραγμένον τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/026.yaml
  text: For the king knows about these things[a], and I speak boldly to him. For I am persuaded that none of these things has escaped his notice[c][b], because this has not been done in a corner.
translation:
  language: te
  text: ఈ విషయాల గురించి రాజుకు తెలుసు; నేను ఆయనతో ధైర్యంగా మాట్లాడుతున్నాను.[a] ఈ విషయాల్లో ఏదీ ఆయనకు తెలియకుండా లేదని నాకు నిశ్చయం.[b] ఎందుకంటే ఇది మూలన జరిగినది కాదు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను ఆయనతో సంకోచం లేకుండా బహిరంగంగా మాట్లాడుతున్నాను.’ గ్రీకు పదం స్వేచ్ఛగా, బహిరంగంగా, ధైర్యంగా మాట్లాడడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఈ విషయాల్లో ఏదీ ఆయనకు దాగి లేదని’ లేదా ‘ఈ విషయాల్లో ఏదీ ఆయన గమనించకుండా పోలేదని.’
    reason: lexical_alternative
  - marker: c
    text: ‘మూలన జరిగినది కాదు’ అనేది అది రహస్యంగా లేదా ఎవరికీ తెలియకుండా జరగలేదని తెలిపే నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπίσταται
  choice: తెలుసు
  rationale: ఈ క్రియ రాజుకు ఈ విషయాలపై ఉన్న జ్ఞానాన్ని లేదా పరిచయాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘తెలుసు’ సహజమైన, నేరమైన పదం.
- source_word: περὶ τούτων
  choice: ఈ విషయాల గురించి
  rationale: περί + షష్ఠీ విభక్తి విషయసంబంధాన్ని సూచిస్తుంది; ‘గురించి’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παρρησιαζόμενος
  choice: ధైర్యంగా మాట్లాడుతున్నాను
  rationale: ఈ వర్తమాన కృదంతం బహిరంగంగా, సంకోచం లేకుండా, ధైర్యంగా మాట్లాడే భావాన్ని కలిగి ఉంది; ప్రధాన క్రియతో కలిపి సహజ తెలుగు వాక్యంగా ఇచ్చాం.
- source_word: πρὸς ὃν ... λαλῶ
  choice: నేను ఆయనతో ... మాట్లాడుతున్నాను
  rationale: πρός ఇక్కడ సంబోధించబడుతున్న వ్యక్తిని సూచిస్తుంది; ‘ఆయనతో మాట్లాడుతున్నాను’ ఆధునిక తెలుగులో సహజం.
- source_word: λανθάνειν ... αὐτὸν
  choice: ఆయన దృష్టికి రాకుండా పోలేదు
  rationale: λανθάνω నిర్మాణం ఒక విషయం ఎవరి గమనానికీ రాకపోవడాన్ని సూచిస్తుంది; ఈ తెలుగు ప్రయోగం దాని నుడికార భావాన్ని కాపాడుతుంది.
- source_word: οὐ πείθομαι οὐθέν
  choice: వీటిలో ఏదీ ... పోలేదని నాకు నమ్మకం
  rationale: గ్రీకు నిరాకరణ నిర్మాణం పౌలు కలిగిన దృఢ నమ్మకాన్ని వ్యక్తం చేస్తుంది; తెలుగులో సహజంగా సానుకూల నమ్మక వాక్యంగా మలిచాం.
- source_word: πεπραγμένον
  choice: జరిగినది
  rationale: πράσσω యొక్క పరిపూర్ణ కృదంతం పూర్తయిన సంఘటనను సూచిస్తుంది; సందర్భంలో ‘జరిగినది’ సహజంగా ఉండి, క్రియ యొక్క ఫలితస్థితిని తెలియజేస్తుంది.
- source_word: ἐν γωνίᾳ
  choice: ఏదో ఒక మూలలో
  rationale: మూల వచనంలోని ‘మూల’ రూపకాన్ని నిలుపుతూ, రహస్యంగా లేదా ఎవరికీ తెలియకుండా జరగలేదనే భావాన్ని సూచిస్తుంది.
- source_word: τοῦτο
  choice: ఇది
  rationale: సూచక సర్వనామం దేనిని సూచిస్తుందో వచనం ఖచ్చితంగా పరిమితం చేయదు; ‘ఇది’ ఆ ఉద్దేశపూర్వక విస్తృతిని కాపాడుతుంది.
theological_decisions:
- issue: ‘ఇది’ అనే పదం సూచించే పరిధి మరియు సంఘటనల బహిరంగ స్వభావం
  choice: ‘ఇది’ అని తటస్థంగా ఉంచి, జరిగినది బహిరంగంగా తెలిసిన విషయమనే భావాన్ని మాత్రమే వ్యక్తం చేయడం
  alternative: దీనిని యేసు మరణం, పునరుత్థానం మాత్రమే అని లేదా మొత్తం క్రైస్తవ ఉద్యమం మరియు పౌలు విచారణ అని స్పష్టీకరించడం
  rationale: τοῦτο ఏ సంఘటనల సముదాయాన్ని సూచిస్తుందో ఈ వాక్యం ఖచ్చితంగా నిర్వచించదు. అందువల్ల అనువాదం పరిధిని సంకుచితం చేయకుండా మూలంలోని అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ‘ఆయన’ రూపాన్ని ఉపయోగించాం. వాక్యం న్యాయస్థాన ప్రసంగానికి తగిన ధైర్యం, గంభీరతను కలిగి ఉండేలా, అయినా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా రూపొందించాం. మూలంలోని ‘మూలలో’ అనే రూపకాన్ని పాఠ్యంలో నిలిపి, దాని నుడికార భావాన్ని పాదటిప్పణిలో వివరించాం.
