  source_fidelity: మూలంలోని వ్యతిరేక భావం, ప్రకటనా క్రమం, దమస్కు–యెరూషలేము–యూదయ–యూదేతరులు అనే విస్తరణ, అలాగే పశ్చాత్తాపం, దేవుని వైపు తిరగడం, వాటికి తగిన కార్యాలు అనే సంబంధం ముసాయిదాలో సరిగానే ఉన్నాయి. అయితే [b] పాదసూచిక ‘పశ్చాత్తాపానికి తగిన కార్యాలు’ అనే పదబంధానికి సంబంధించినది; అది ప్రస్తుతం ‘చేయాలని’ వద్ద ఉండటం కంటే ఆ పదబంధం వెంట ఉండాలి.
  naturalness: డ్యాష్‌ల మధ్య దీర్ఘ ఉపవాక్యాన్ని ఉంచడం తెలుగులో కొంత అసహజంగా ఉంది. వాక్యాన్ని ‘నేను ... ప్రకటించాను’ అనే సహజ క్రమంలో ఉంచితే ఆధునిక ప్రామాణిక తెలుగు ప్రవాహం మెరుగవుతుంది. ‘కార్యాలు’ ఈ సందర్భంలో ‘పనులు’ కంటే కొంచెం మర్యాదపూర్వకమైన, బైబిలు సందర్భానికి తగిన పదం.
  terminology: ‘పశ్చాత్తాపపడాలి,’ ‘దేవుని వైపు తిరగాలి,’ ‘యూదేతరులు’ అనే పదాలు సందర్భానుకూలంగా, మూలార్థానికి నమ్మకంగా ఉన్నాయి. ‘తగిన కార్యాలు’ అనేది ἄξια ... ἔργα యొక్క అనుగుణత భావాన్ని కాపాడుతుంది; అది సంపాదనాధారమైన కార్యాల సిద్ధాంతాన్ని చేర్చదు.
