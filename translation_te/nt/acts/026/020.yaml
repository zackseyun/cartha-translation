revisions:
- from: కాని మొదట దమస్కులో ఉన్నవారికి, తరువాత యెరూషలేములోనివారికి, యూదయ ప్రాంతమంతటివారికి, అలాగే యూదేతరులకు[a]—వారు పశ్చాత్తాపపడి దేవుని వైపు తిరిగి, పశ్చాత్తాపానికి తగిన పనులు చేయాలని[b]—నేను ప్రకటిస్తూ వచ్చాను.
  to: కాని నేను మొదట దమస్కులో ఉన్నవారికి, తరువాత యెరూషలేములో ఉన్నవారికి, యూదయ ప్రాంతమంతటా ఉన్నవారికి, అలాగే యూదేతరులకు[a], వారు పశ్చాత్తాపపడి దేవుని వైపు తిరిగి, పశ్చాత్తాపానికి తగిన కార్యాలు[b] చేయాలని ప్రకటించాను.
  rationale: '[b] గుర్తును అది వివరించే ‘పశ్చాత్తాపానికి తగిన కార్యాలు’ పదబంధం వెంటికి మార్చాం. డ్యాష్‌లతో ఉన్న నిర్మాణాన్ని సహజమైన తెలుగు వాక్యక్రమంగా మార్చి, ‘పనులు’ స్థానంలో సందర్భానికి తగిన ‘కార్యాలు’ వాడాం. ఈ మార్పులు మూలంలోని అర్థం, క్రమం, లేదా పశ్చాత్తాపం మరియు కార్యాల మధ్య సంబంధాన్ని మార్చవు.'
