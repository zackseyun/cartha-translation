id: ACT.26.20
reference: Acts 26:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ τοῖς ἐν Δαμασκῷ πρῶτόν ⸀τε καὶ Ἱεροσολύμοις, ⸀πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας, καὶ τοῖς ἔθνεσιν ⸀ἀπήγγελλον μετανοεῖν καὶ ἐπιστρέφειν ἐπὶ τὸν θεόν, ἄξια τῆς μετανοίας ἔργα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/020.yaml
  text: but first to those in Damascus[a], then also in Jerusalem, and throughout all the region of Judea, and to the Gentiles, I proclaimed that they should repent and turn to God[b], doing works worthy of repentance.
translation:
  language: te
  text: కాని నేను మొదట దమస్కులో ఉన్నవారికి, తరువాత యెరూషలేములో ఉన్నవారికి, యూదయ ప్రాంతమంతటా ఉన్నవారికి, అలాగే యూదేతరులకు[a], వారు పశ్చాత్తాపపడి దేవుని వైపు తిరిగి, పశ్చాత్తాపానికి తగిన కార్యాలు[b] చేయాలని ప్రకటించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో ‘జనాలకు’ లేదా ‘దేశాలవారికి’ అని కూడా అనువదించవచ్చు. ఇక్కడ అది యూదులు కాని ప్రజలను సూచిస్తున్నందున ప్రధాన పాఠ్యంలో ‘యూదేతరులకు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పశ్చాత్తాపానికి తగిన కార్యాలు చేస్తూ.’ ఈ పదబంధం పశ్చాత్తాపానికి అనుగుణంగా ఉండే ఆచరణను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: కాని
  rationale: ముందటి వాక్యంలోని అవిధేయత చూపలేదనే మాటకు విరుద్ధంగా తాను చేసినదాన్ని పరిచయం చేసే సహజమైన వ్యతిరేక అవ్యయం.
- source_word: τοῖς ἐν Δαμασκῷ
  choice: దమస్కులో ఉన్నవారికి
  rationale: స్థలంలో ఉన్న ప్రజలను సూచించే దత్తివును స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πρῶτόν τε καὶ Ἱεροσολύμοις
  choice: మొదట దమస్కులో ఉన్నవారికి, తరువాత యెరూషలేములోనివారికి
  rationale: πρῶτον‌తో మొదలయ్యే క్రమాన్నీ, తరువాతి స్థలాన్ని చేర్చడాన్నీ సహజమైన తెలుగులో తెలియజేస్తుంది; ‘మొదట’ రెండు స్థలాలనూ సమానంగా విశేషిస్తున్నట్టు ఉండదు.
- source_word: πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας
  choice: యూదయ ప్రాంతమంతటివారికి
  rationale: χώρα యొక్క విస్తృత భౌగోళిక భావాన్ని ‘ప్రాంతం’ అందిస్తుంది; క్రియకు సంబంధించిన శ్రోతలు ప్రజలేనని తెలుగులో సహజంగా స్పష్టం చేస్తుంది.
- source_word: τοῖς ἔθνεσιν
  choice: యూదేతరులకు
  rationale: ఈ సందర్భంలో ἔθνη యూదయకు వెలుపలి జాతులను, ముఖ్యంగా యూదులు కానివారిని సూచిస్తుంది. ఆధునిక సాధారణ పాఠకునికి ‘యూదేతరులు’ స్పష్టంగా ఉంటుంది.
- source_word: ἀπήγγελλον
  choice: నేను ప్రకటిస్తూ వచ్చాను
  rationale: అసంపూర్ణ భూతకాల రూపం పౌలు కొనసాగిస్తూ చేసిన ప్రకటనను సూచించగలదు; ఈ అనువాదం ప్రజల మధ్య బహిరంగంగా తెలియజేసిన భావాన్నీ కొనసాగింపునూ ఉంచుతుంది.
- source_word: μετανοεῖν
  choice: పశ్చాత్తాపపడాలని
  rationale: దేవుని ఎదుట వైఖరి, దిశ మార్పును సూచించే సందర్భోచితమైన ప్రామాణిక తెలుగు పదం; కేవలం అభిప్రాయం మార్చుకోవడంగా పరిమితం చేయదు.
- source_word: ἐπιστρέφειν ἐπὶ τὸν θεόν
  choice: దేవుని వైపు తిరగాలని
  rationale: ἐπίతో కూడిన దిశాభావాన్ని దగ్గరగా నిలుపుతుంది. ‘తిరిగి రావడం’ అని అనువదిస్తే యూదేతరులందరికీ ముందటి ఒడంబడిక సంబంధం ఉందని అనవసరంగా సూచించవచ్చు.
- source_word: ἄξια τῆς μετανοίας ἔργα
  choice: పశ్చాత్తాపానికి తగిన పనులు
  rationale: ἄξιαను ‘తగిన’గా, ἔργαను సాధారణంగా అర్థమయ్యే ‘పనులు’గా అందించి, అవి పశ్చాత్తాపానికి అనుగుణమైన కార్యాలని తెలియజేస్తుంది.
- source_word: πράσσοντας
  choice: చేయాలని
  rationale: ప్రకటించిన ప్రతిస్పందనలో ఆచరణను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; పశ్చాత్తాపం, దేవుని వైపు తిరగడం, వాటికి తగిన కార్యాలు అనే నిర్మాణాన్ని ఉంచుతుంది.
theological_decisions:
- issue: పశ్చాత్తాపం, దేవుని వైపు తిరగడం, పనుల మధ్య సంబంధం
  choice: పశ్చాత్తాపానికి తగిన పనులు చేయాలని
  alternative: పశ్చాత్తాపమే ఆ పనులని చెప్పడం; లేదా ఆ పనులే దేవుని అంగీకారాన్ని సంపాదించే ఆధారమని చెప్పడం
  rationale: గ్రీకు వాక్యనిర్మాణంలో μετανοεῖν, ἐπιστρέφειν ప్రకటించబడిన ప్రతిస్పందనలు; πράσσοντας అనే కృదంతం వాటికి అనుగుణమైన ఆచరణను జతచేస్తుంది. ‘తగిన’ అనే మాట ఈ సంబంధాన్ని కాపాడుతుంది గాని కార్యాల పుణ్యార్జక పాత్రపై వాక్యం చెప్పనిదాన్ని చేర్చదు.
- issue: ἐπιστρέφειν ἐπὶ τὸν θεόν లో దిశా భావం
  choice: దేవుని వైపు తిరగాలని
  alternative: దేవుని దగ్గరకు తిరిగి రావాలని
  rationale: యూదేతరులు కూడా శ్రోతల్లో ఉన్నందున ‘తిరిగి రావడం’ ముందస్తు సంబంధాన్ని సూచించవచ్చు. ‘వైపు తిరగడం’ మూలంలోని దిశను, ఉద్దేశపూర్వక మలుపును కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకునికి అర్థమయ్యే శైలి. ‘యూదేతరులు’ స్పష్టత కోసం, ‘పశ్చాత్తాపం’ బైబిలు సందర్భంలోని సంపూర్ణ భావం కోసం వాడబడ్డాయి. దీర్ఘ జాబితిని చదవడానికి సులభంగా చేయడానికి విరామచిహ్నాలు ఉపయోగించబడ్డాయి; [a], [b] గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
