id: ACT.26.25
reference: Acts 26:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Παῦλος· Οὐ μαίνομαι, φησίν, κράτιστε Φῆστε, ἀλλὰ ἀληθείας καὶ σωφροσύνης ῥήματα ἀποφθέγγομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/025.yaml
  text: But Paul said[a], “I am not out of my mind, most excellent Festus[c][b], but I am speaking words of truth and sound judgment.”
translation:
  language: te
  text: 'కాని పౌలు ఇలా అన్నాడు: “అత్యంత ఘనుడవైన ఫేస్తూ[b], నేను మతిభ్రమించినవాణ్ణి కాను[a]. నేను సత్యం మరియు సుబుద్ధి గల మాటలు పలుకుతున్నాను[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నేను పిచ్చివాణ్ణి కాను.”
    reason: lexical_alternative
  - marker: b
    text: “అత్యంత ఘనుడవైన” అనేది ఉన్నత పదవిలో ఉన్న అధికారిని సంబోధించడానికి వాడే అధికారిక గౌరవవాచకం.
    reason: cultural_note
  - marker: c
    text: లేదా “సత్యం మరియు మానసిక స్వస్థత గల మాటలు”; లేదా “సత్యం మరియు నిగ్రహం గల మాటలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: కాని
  rationale: మునుపటి వచనంలో ఫేస్తు చేసిన ఆరోపణకు పౌలు ఇచ్చిన విరుద్ధ స్పందనను సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: μαίνομαι
  choice: నేను మతిభ్రమించినవాణ్ణి కాను
  rationale: పిచ్చి లేదా మానసిక స్థిమితం లేకపోవడాన్ని సూచించే గ్రీకు క్రియ భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: φησίν
  choice: ఇలా అన్నాడు
  rationale: రూపపరంగా వర్తమానకాలంలో ఉన్న చారిత్రక వర్తమానాన్ని తెలుగు కథనశైలికి సహజంగా భూతకాలంలో అందిస్తుంది.
- source_word: κράτιστε
  choice: మహా ఘనతగల
  rationale: ఉన్నతాధికారిని సంబోధించేటప్పుడు వాడే అధికారిక గౌరవవాచకాన్ని నిలుపుతుంది.
- source_word: ἀληθείας
  choice: సత్యమైన
  rationale: ‘సత్యానికి చెందిన మాటలు’ అనే గ్రీకు సంబంధార్థాన్ని సహజమైన తెలుగు విశేషణ రూపంలో వ్యక్తం చేస్తుంది.
- source_word: σωφροσύνης
  choice: వివేకంతో కూడిన
  rationale: మానసిక స్వస్థత, నిగ్రహం, స్థిరమైన తీర్పు అనే భావపరిధిని సందర్భానుసారంగా తెలియజేస్తూ, పౌలు మతిభ్రమించాడనే ఆరోపణకు ప్రతిస్పందనను నిలుపుతుంది.
- source_word: ῥήματα
  choice: మాటలు
  rationale: గ్రీకులోని స్పష్టమైన బహువచన నామవాచకాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: ἀποφθέγγομαι
  choice: నేను పలుకుతున్నాను
  rationale: స్పష్టంగా లేదా గంభీరంగా మాట్లాడటాన్ని సూచించే క్రియను అతిశయింపకుండా, సాధారణ ‘మాట్లాడుతున్నాను’ కంటే కొంత అధికారికమైన రీతిలో అందిస్తుంది.
theological_decisions:
- issue: σωφροσύνης అనే పదంలోని భావవిస్తృతి
  choice: వివేకంతో కూడిన
  alternative: మానసిక స్వస్థతతో కూడిన / నిగ్రహంతో కూడిన
  rationale: ఈ సందర్భంలో ఫేస్తు చేసిన మతిభ్రమణ ఆరోపణకు పౌలు జవాబిస్తున్నందున స్థిరమైన, హేతుబద్ధమైన ఆలోచన ప్రధానంగా కనిపిస్తుంది. అయితే ఈ పదంలో మానసిక స్వస్థత, నిగ్రహం అనే భావాలు కూడా ఉన్నందున వాటిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, అయితే రోమా అధికారి ఎదుట పౌలు మాట్లాడుతున్న సందర్భానికి తగిన గౌరవపూర్వక గంభీరతతో రూపొందించబడింది. పాదసూచిక గుర్తులు వాటికి సంబంధించిన పదబంధాల వెంట ఉంచబడ్డాయి.
