source:
  edition: SBLGNT
  text: Ἐν ⸀οἷς πορευόμενος εἰς τὴν Δαμασκὸν μετ’ ἐξουσίας καὶ ἐπιτροπῆς ⸀τῆς τῶν ἀρχιερέων
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/012.yaml
  text: In this connection[a], as I was traveling to Damascus with authority and a commission from the chief priests,
translation:
  language: te
  text: ఈ సందర్భంలో[a], ప్రధాన యాజకుల నుండి అధికారం మరియు నియోగం పొంది నేను దమస్కుకు ప్రయాణిస్తుండగా,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఈ సంగతులలో”; ఇది పౌలు ఇంతకుముందు చెప్పిన చర్యలను, ఉద్దేశాలను వెనక్కి సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν οἷς
  choice: ఈ పనిలో భాగంగా
  rationale: మునుపటి వచనాల్లో చెప్పిన హింసాత్మక చర్యలు, ఉద్దేశాలను వెనక్కి సూచించే గ్రీకు పదబంధం. సహజమైన తెలుగులో ఆ అనుసంధానాన్ని నిలుపుతుంది; అయితే ‘పని’ అనే పదం మూలంలో స్పష్టంగా లేనందున పాదసూచికలో అక్షరార్థాన్ని ఇచ్చాం.
- source_word: πορευόμενος
  choice: ప్రయాణిస్తుండగా
  rationale: వర్తమాన మధ్యమ కృదంతం సందర్భంలోని సంఘటనతో సమకాలీనంగా జరుగుతున్న ప్రయాణాన్ని సూచిస్తుంది; తెలుగులో ఈ రూపం సహజంగా ఉంటుంది.
- source_word: εἰς τὴν Δαμασκὸν
  choice: దమస్కుకు
  rationale: నగరాన్ని గమ్యస్థానంగా సూచించే εἰς కు సహజమైన తెలుగు ప్రయోగం.
- source_word: μετ’ ἐξουσίας
  choice: అధికారాన్నీ ... పొంది
  rationale: ఇక్కడ ἐξουσία ముడి శక్తిని కాక అప్పగించబడిన అధికారాన్ని సూచిస్తుంది. ‘పొంది’ అనేది ప్రధాన యాజకులే దాని మూలమని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: ἐπιτροπῆς
  choice: ఆదేశాన్నీ
  rationale: అధికారికంగా అప్పగించిన బాధ్యత లేదా నియోగాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; సైనిక ఆజ్ఞ అనే భావాన్ని అనవసరంగా బలపరచదు.
- source_word: τῆς τῶν ἀρχιερέων
  choice: ప్రధాన యాజకుల నుండి
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని తెలుగులో మూలాన్ని సూచించే ‘నుండి’తో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀρχιερέων
  choice: ప్రధాన యాజకులు
  rationale: ఇది ఒకే సమయంలో అనేక మంది మహాయాజకులు ఉన్నారని కాక, మహాయాజకత్వ నాయక వర్గాన్ని సూచించే స్థిరమైన సందర్భోచిత పదం.
