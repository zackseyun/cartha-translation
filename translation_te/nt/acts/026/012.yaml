translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. వాక్యం తదుపరి వచనంలో కొనసాగుతుందని సూచించేందుకు చివర కామా ఉంచబడింది.
