  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τί ἄπιστον κρίνεται παρ’ ὑμῖν εἰ ὁ θεὸς νεκροὺς ἐγείρει;
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/008.yaml
  text: Why is it judged unbelievable by you if God raises the dead?
translation:
  language: te
  text: దేవుడు మృతులను లేపితే, మీరు దానిని ఎందుకు నమ్మలేనిదిగా భావిస్తున్నారు?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί
  choice: ఎందుకు
  rationale: ఈ ప్రశ్నలో కారణాన్ని అడిగే సహజమైన తెలుగు రూపం.
- source_word: ἄπιστον
  choice: నమ్మశక్యం కానిదిగా
  rationale: ‘నమ్మలేనిది/అవిశ్వసనీయమైనది’ అనే భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: κρίνεται παρ’ ὑμῖν
  choice: మీకు ... అనిపిస్తోంది
  rationale: అక్షరార్థంగా ‘మీ చేత తీర్పు చేయబడుతోంది’ అయినప్పటికీ, ఇక్కడ వ్యక్తిగత అంచనా లేదా భావనను సూచించే గ్రీకు ప్రయోగాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది; ‘మీకు’ ద్వారా παρ’ ὑμῖν నిలుస్తుంది.
- source_word: εἰ
  choice: అనేది
  rationale: ఇక్కడ εἰ పునరుత్థాన ప్రతిపాదనను ప్రశ్నకు అంశంగా పరిచయం చేస్తోంది; తెలుగులో ‘అనేది’ సహజంగా ఆ సంబంధాన్ని చూపుతుంది.
- source_word: ὁ θεὸς νεκροὺς ἐγείρει
  choice: దేవుడు చనిపోయినవారిని లేపుతాడు
  rationale: ἐγείρει యొక్క వర్తమాన రూపాన్ని, మృతులను దేవుడు లేపడం అనే మూల భావాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: దేవుడు మృతులను లేపడం నిజమా లేక ఊహాత్మక షరతా?
  choice: ‘దేవుడు ... లేపుతాడనేది’ అని ప్రతిపాదనగా ఉంచడం
  alternative: ‘దేవుడు ... లేపితే’
  rationale: గ్రీకు εἰ వ్యాకరణపరంగా ‘అయితే’గా రావచ్చు; అయితే వాక్యసందర్భంలో పౌలు దేవుని పునరుత్థాన శక్తిని సందేహాస్పద ఊహగా కాక, శ్రోతలు నమ్మశక్యం కానిదిగా ఎందుకు తీర్మానిస్తున్నారనే ప్రశ్నలోని ప్రతిపాదనగా ఉంచుతున్నాడు. తెలుగు ‘అనేది’ ఆ భావాన్ని సహజంగా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ప్రశ్నారూపం. మూలంలోని అలంకారిక ప్రశ్నను నిలిపి, కృత్రిమమైన కర్మణి ప్రయోగాన్ని నివారించింది.
