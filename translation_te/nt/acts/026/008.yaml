revisions:
- from: దేవుడు చనిపోయినవారిని లేపుతాడనేది మీకు ఎందుకు నమ్మశక్యం కానిదిగా అనిపిస్తోంది?
  to: దేవుడు మృతులను లేపితే, మీరు దానిని ఎందుకు నమ్మలేనిదిగా భావిస్తున్నారు?
  rationale: The revision preserves the Greek conditional clause, renders the audience’s act of judgment with natural Telugu “భావిస్తున్నారు,” and uses the more idiomatic “నమ్మలేనిదిగా.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:08:45Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys God raising the dead and the rhetorical question, but its “మీకు ... అనిపిస్తోంది” reduces κρίνεται παρ’ ὑμῖν (“is judged/reckoned by you”) to a mere subjective impression. It also recasts εἰ as a nominal proposition (“అనేది”) rather than retaining the source’s conditional framing.
  naturalness: The draft is understandable, but “నమ్మశక్యం కానిదిగా అనిపిస్తోంది” is somewhat cumbersome. “నమ్మలేనిదిగా భావిస్తున్నారు” is natural modern standard Telugu and retains the evaluative force.
  terminology: “దేవుడు,” “మృతులను,” and “లేపుతాడు” are appropriate, clear, and theologically neutral. No footnote is needed.
  issues:
  - severity: medium
    issue: κρίνεται παρ’ ὑμῖν is weakened
    rationale: “మీకు ... అనిపిస్తోంది” means ‘seems to you,’ whereas the Greek expresses something being judged or regarded as unbelievable by the audience.
  - severity: low
    issue: Conditional εἰ is not represented directly
    rationale: The source presents the clause with εἰ. Telugu “లేపితే” preserves this syntax without deciding the rhetorical/theological force beyond what the Greek states.
  revised_text: దేవుడు మృతులను లేపితే, మీరు దానిని ఎందుకు నమ్మలేనిదిగా భావిస్తున్నారు?
  revised_footnotes: []
  revision_rationale: The revision preserves the Greek conditional clause, renders the audience’s act of judgment with natural Telugu “భావిస్తున్నారు,” and uses the more idiomatic “నమ్మలేనిదిగా.”
