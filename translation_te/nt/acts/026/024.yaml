  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. న్యాయపరమైన సమర్థన భావాన్ని ‘తన పక్షంగా వాదిస్తూ’ నిలుపుతూ, ఫేస్తు మాటల తీవ్రతను సాధారణ పాఠకుడికి స్పష్టంగా అందించింది.
