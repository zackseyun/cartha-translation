source:
  edition: SBLGNT
  text: Ταῦτα δὲ αὐτοῦ ἀπολογουμένου ὁ Φῆστος μεγάλῃ τῇ φωνῇ ⸀φησιν· Μαίνῃ, Παῦλε· τὰ πολλά σε γράμματα εἰς μανίαν περιτρέπει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/024.yaml
  text: As he was saying these things in his defense[a], Festus said with a loud voice, “You are out of your mind, Paul! Your great learning is driving you into madness.”
translation:
  language: te
  text: అతడు తన పక్షాన వాదిస్తూ ఈ సంగతులు చెబుతుండగా, ఫేస్తు బిగ్గరగా, “పౌలూ, నీకు మతిపోయింది! నీ అపారమైన పాండిత్యం నిన్ను పిచ్చిలోకి నెడుతోంది!” అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పౌలూ, నీకు పిచ్చి పట్టింది! నీ ఎంతో చదువు నిన్ను పిచ్చివాడిని చేస్తోంది.”
    reason: μαίνομαι, τὰ πολλά γράμματα, εἰς μανίαν περιτρέπει అనే పదబంధాలకు మరింత అక్షరార్థకమైన ప్రత్యామ్నాయాన్ని చూపుతుంది.
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: తన పక్షంగా వాదిస్తుండగా
  rationale: జనిటివ్ అబ్సల్యూట్ సమకాలీన చర్యను సూచిస్తుంది; ఈ సందర్భంలో ἀπολογέομαι న్యాయపరమైన లేదా మౌఖికమైన సమర్థనను తెలియజేస్తుంది.
- source_word: μεγάλῃ τῇ φωνῇ
  choice: పెద్ద స్వరంతో
  rationale: రీతిని సూచించే ఈ దత్తివ విభక్తి పదబంధాన్ని సహజమైన తెలుగులో అందిస్తూ, ఫేస్తు బిగ్గరగా అడ్డుపడిన దృశ్యాన్ని నిలుపుతుంది.
- source_word: φησιν
  choice: అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నా, తెలుగు కథనశైలిలో భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: Μαίνῃ
  choice: నీకు మతిపోయింది
  rationale: μαίνομαι మతిస్థిమితం కోల్పోవడం లేదా పిచ్చిగా ఉండడం అనే బలమైన ఆరోపణను సూచిస్తుంది; ఈ రూపం ఆధునిక తెలుగులో సహజంగా, ప్రత్యక్షంగా ఉంటుంది.
- source_word: τὰ πολλά ... γράμματα
  choice: నీ విస్తారమైన విద్య
  rationale: γράμματα అక్షరాలు, రచనలు, విద్య లేదా పాండిత్యాన్ని సూచించగలదు; ఇక్కడ ఫేస్తు పౌలు విస్తృత అధ్యయనం లేదా విద్యను ఉద్దేశిస్తున్నాడు.
- source_word: εἰς μανίαν
  choice: పిచ్చివాడిగా
  rationale: εἰς ఫలిత స్థితిలోకి మారడాన్ని సూచిస్తుంది; తెలుగు వాక్య నిర్మాణంలో περιτρέπειతో కలిపి ఈ భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: περιτρέπει
  choice: మారుస్తోంది
  rationale: ఒక స్థితిలోకి తిప్పడం లేదా చేర్చడం అనే కారణార్థక భావాన్ని నిలుపుతుంది.
