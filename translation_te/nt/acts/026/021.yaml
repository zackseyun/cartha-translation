  yaml_path: translation/nt/acts/026/021.yaml
  text: Because of these things the Jews seized me in the temple and were trying to kill me[a][b].
translation:
  language: te
  text: ఈ సంగతుల కారణంగా[a] యూదులు దేవాలయ ప్రాంగణంలో[b] నన్ను పట్టుకొని, నన్ను చంపడానికి ప్రయత్నిస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ కారణం వల్ల’ లేదా ‘ఈ సంగతులను బట్టి.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి గ్రీకు పదం లోపలి పరిశుద్ధస్థలాన్ని మాత్రమే కాక, దేవాలయ సముదాయాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἕνεκα τούτων
  choice: ఈ సంగతుల కారణంగానే
  rationale: ἕνεκα తో జనిటివ్ కారణాన్ని సూచిస్తుంది; ఈ పదబంధం పౌలు ఇంతకుముందు చెప్పిన సంగతులవైపు తిరిగి చూపుతుంది. ‘నే’ కారణ సంబంధాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: με
  choice: నన్ను
  rationale: సυλλαβόμενοι అనే కృదంతానికి ప్రత్యక్ష కర్మగా ఉన్న ప్రథమ పురుష ఏకవచన ద్వితీయా విభక్తిని నేరుగా తెలియజేస్తుంది.
- source_word: Ἰουδαῖοι
  choice: యూదులు
  rationale: సంఘటనలో పౌలును పట్టుకున్న యూదు ప్రత్యర్థులను సూచిస్తుంది; యూదులందరినీ సమష్టిగా నిందిస్తున్నట్లు అనవసరంగా విస్తరించదు.
- source_word: συλλαβόμενοι
  choice: పట్టుకొని
  rationale: శత్రుత్వపూర్వకంగా ఒకరిని పట్టుకోవడం అనే భావాన్ని ఇస్తుంది; అధికారిక అరెస్టు అనే అదనపు భావాన్ని చేర్చదు.
- source_word: ἐν τῷ ἱερῷ
  choice: దేవాలయ ప్రాంగణంలో
  rationale: ἱερόν అంతర్గర్భాలయాన్ని మాత్రమే కాక మొత్తం దేవాలయ సముదాయాన్ని సూచిస్తుంది; ‘ప్రాంగణంలో’ ఆ వ్యత్యాసాన్ని తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἐπειρῶντο
  choice: ప్రయత్నించారు
  rationale: గతంలో జరిగిన ప్రయత్నాన్ని సహజ తెలుగులో తెలియజేస్తుంది; తరువాతి అసమాపక క్రియతో కలిపి కొనసాగిన ఉద్దేశపూర్వక చర్య భావం నిలుస్తుంది.
- source_word: διαχειρίσασθαι
  choice: చంపడానికి
  rationale: ఈ సందర్భంలో హింసాత్మకంగా ప్రాణం తీయడం అనే స్పష్టమైన అర్థం; ‘హత్య చేయడానికి’ అనే న్యాయపరమైన లేదా నైతిక అదనపు ఛాయను చేర్చదు.
theological_decisions:
- issue: వివాదస్పద సందర్భంలో Ἰουδαῖοι పదం ఎవరిని సూచిస్తుంది
  choice: ‘యూదులు’ అని అనువదించి, సందర్భానుసారంగా పౌలును పట్టుకున్న నిర్దిష్ట యూదు ప్రత్యర్థులను సూచించేలా ఉంచడం
  alternative: ‘ఆ యూదులు’; ‘యూదు ప్రజలు’
  rationale: గ్రీకు పాఠం సంఘటనలో పాల్గొన్న సమూహాన్ని పేర్కొంటుంది. అనువాదం చారిత్రక సూచనను తొలగించకూడదు; అదే సమయంలో దాన్ని యూదు ప్రజలందరిపై నిందగా విస్తరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. కారణ సంబంధం, శత్రుత్వపూర్వకంగా పట్టుకోవడం, చంపే ప్రయత్నం స్పష్టంగా ఉన్నాయి. ἱερόν యొక్క విస్తృత అర్థాన్ని ప్రధాన పాఠంలో ‘దేవాలయ ప్రాంగణం’ ద్వారా, పాదసూచికలో మరింత స్పష్టంగా తెలిపాం.
