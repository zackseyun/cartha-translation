  text: Τὴν μὲν οὖν βίωσίν μου ⸀τὴν ἐκ νεότητος τὴν ἀπ’ ἀρχῆς γενομένην ἐν τῷ ἔθνει μου ἔν ⸀τε Ἱεροσολύμοις ἴσασι ⸀πάντες Ἰουδαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/004.yaml
  text: So then[a], all the Jews know my manner of life from my youth, which from the beginning took place among my own nation and also in Jerusalem,
translation:
  language: te
  text: కాబట్టి, నా యౌవనం నుంచీ, తొలినాళ్ల నుంచీ నా స్వజాతి ప్రజల మధ్యను యెరూషలేములోను సాగిన నా జీవన విధానం యూదులందరికీ తెలుసు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βίωσίν
  choice: జీవన విధానం
  rationale: ఈ పదం కేవలం ఉనికిని లేదా ప్రాణాన్ని కాక, ఒక వ్యక్తి జీవించిన తీరును, అతని జీవిత గమనాన్ని సూచిస్తుంది.
- source_word: ἐκ νεότητος
  choice: నా యౌవనం నుంచీ
  rationale: పౌలు జీవించిన తీరు ఏ కాలం నుంచి యూదులకు తెలిసి ఉందో సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀπ’ ἀρχῆς
  choice: మొదటి నుంచీ
  rationale: పౌలు చెప్పే కాలవ్యాప్తిని బలపరుస్తూ మూలంలోని సాధారణ భావాన్ని నిలుపుతుంది.
- source_word: γενομένην
  choice: సాగిన
  rationale: βίωσις‌తో కలిసి ఇది నిర్దిష్ట పరిసరాల్లో గడిచిన జీవిత గమనాన్ని సూచిస్తుంది; తెలుగులో ‘సాగిన జీవితం’ సహజంగా ఉంటుంది.
- source_word: ἐν τῷ ἔθνει μου
  choice: నా జాతి ప్రజల మధ్య
  rationale: ఇక్కడ ἔθνος ఆధునిక రాజకీయ దేశాన్ని కాక పౌలు సొంత ప్రజాసమూహాన్ని సూచిస్తుంది.
- source_word: ἔν τε Ἱεροσολύμοις
  choice: యెరూషలేములో
  rationale: ముందున్న ‘నా జాతి ప్రజల మధ్య’ అనే స్థలసంబంధ భావంతో యెరూషలేమును సమన్వయపరుస్తుంది; తెలుగు జాబితా నిర్మాణంలో అదనపు ‘కూడా’ అవసరం లేదు.
- source_word: ἴσασι
  choice: తెలుసు
  rationale: οἶδα యొక్క సంపూర్ణ రూపం ఇక్కడ వర్తమాన స్థితిని సూచిస్తుంది; ‘తెలుసు’ దానిని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: πάντες Ἰουδαῖοι
  choice: యూదులందరికీ
  rationale: మూలంలోని సమగ్రతను, జాతిసూచక పదాన్ని తగ్గించకుండా సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: μὲν οὖν
  choice: కాబట్టి
  rationale: పౌలు సమర్థనలో ముందున్న మాట నుంచి కొనసాగింపును, తార్కిక మార్పును సంక్షిప్తంగా సూచిస్తుంది.
