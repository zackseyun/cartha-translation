  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πιστεύεις, βασιλεῦ Ἀγρίππα, τοῖς προφήταις; οἶδα ὅτι πιστεύεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/027.yaml
  text: King Agrippa, do you believe the prophets? I know that you do believe.
translation:
  language: te
  text: అగ్రిప్ప రాజా, మీరు ప్రవక్తలను నమ్ముతున్నారా?[a] మీరు నమ్ముతున్నారని నాకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రవక్తల మాటను అంగీకరిస్తున్నారా?” లేదా “ప్రవక్తలను విశ్వసిస్తున్నారా?”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: నమ్ముతున్నారా
  rationale: వర్తమానకాల క్రియను అగ్రిప్పను గౌరవంగా సంబోధించే సహజమైన తెలుగు ప్రత్యక్ష ప్రశ్నగా అనువదించాం.
- source_word: βασιλεῦ Ἀγρίππα
  choice: అగ్రిప్ప రాజా
  rationale: సంబోధన విభక్తి బలాన్ని సహజమైన ఆధునిక తెలుగు పదక్రమంతో నిలిపాం; పేరును ప్రామాణిక తెలుగు రూపంలో లిప్యంతరీకరించాం.
- source_word: τοῖς προφήταις
  choice: ప్రవక్తలను
  rationale: πιστεύωతో వచ్చిన దత్తివిభక్తి ఇక్కడ ప్రవక్తల సాక్ష్యాన్ని లేదా సందేశాన్ని నమ్మడాన్ని సూచిస్తుంది; మూలంలోని వ్యక్తివాచక రూపాన్ని అలాగే ఉంచాం.
- source_word: οἶδα
  choice: నాకు తెలుసు
  rationale: రూపంలో పరిపూర్ణకాలమైనా వర్తమానార్థం గల క్రియను సూటిగా అనువదించాం.
- source_word: ὅτι πιστεύεις
  choice: మీరు నమ్ముతున్నారని
  rationale: మొదటి క్రియతో పదసామ్యాన్ని కాపాడుతూ, తెలిసిన విషయాన్ని తెలిపే సహజమైన తెలుగు ఉపవాక్యంగా ఇచ్చాం.
theological_decisions:
- issue: ‘ప్రవక్తలను నమ్మడం’ అనే మాట స్వభావం
  choice: ప్రవక్తల సాక్ష్యాన్ని నిజమని అంగీకరించే భావాన్ని కలిగించేలా ‘ప్రవక్తలను నమ్మడం’ అని ఉంచాం.
  alternative: ప్రవక్తల సందేశాన్ని అంగీకరించడం; ప్రవక్తలపై విశ్వాసముంచడం
  rationale: గ్రీకు πιστεύω + దత్తివిభక్తి ప్రవక్తలు చెప్పినదాన్ని నమ్మడం లేదా అంగీకరించడం అనే భావాన్ని ఇస్తుంది. దీనిని విధేయతగా గానీ, సంపూర్ణ రక్షణ విశ్వాసంగా గానీ విస్తరించకుండా మూలంలోని వాక్చాతుర్యపూర్వక ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవసూచక బహువచనాన్ని వాడాం. రాజసంబోధనకు ‘అగ్రిప్ప రాజా’ సహజంగా, గంభీరంగా ఉంది. చివరి వాక్యంలో గ్రీకు పునరుక్తిని నిలిపి, తెలుగులో కృత్రిమమైన అదనపు ఉద్ఘాటనను చేర్చలేదు.
