  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయసభలో పౌలు రాజుతో మాట్లాడుతున్న సందర్భానికి తగిన గౌరవపూర్వక, గంభీర శైలి. మూలంలోని కారణ సంబంధాన్ని తెలుగులో సహజంగా అమర్చేందుకు participial clause‌ను ‘కాబట్టి’ నిర్మాణంతో ప్రధాన విజ్ఞప్తికి అనుసంధానించాం.
