  rationale: The revision uses “యూదులకు సంబంధించిన” for the scope of κατὰ Ἰουδαίους and “నా మాటను వినాలని” for ἀκοῦσαί μου. It retains “ప్రత్యేకించి” to represent μάλιστα as a continuation of Paul’s statement from the preceding verse, while retaining the source’s causal connection and formal courtroom register. Footnote anchors are placed after the clause/request to which they pertain.
