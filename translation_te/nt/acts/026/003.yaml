source:
  edition: SBLGNT
  text: μάλιστα γνώστην ὄντα σε πάντων τῶν κατὰ Ἰουδαίους ⸀ἐθῶν τε καὶ ζητημάτων· διὸ ⸀δέομαι μακροθύμως ἀκοῦσαί μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/003.yaml
  text: especially because you are knowledgeable about all the customs and disputes among the Jews[b][a]. Therefore I beg you to listen to me patiently.
translation:
  language: te
  text: మీరు యూదులకు సంబంధించిన ఆచారాలన్నిటినీ, వివాదాలనూ బాగా తెలిసినవారు కాబట్టి ప్రత్యేకించి, నా మాటను ఓపికగా వినాలని మిమ్మల్ని వేడుకుంటున్నాను.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదుల ఆచారాలన్నిటినీ, వివాదాలనూ మీరు బాగా తెలిసినవారు కాబట్టి.”
    reason: lexical_alternative
  - marker: b
    text: “వేడుకుంటున్నాను” అనే గ్రీకు క్రియ హృదయపూర్వకమైన విజ్ఞప్తిని సూచిస్తుంది; “కోరుతున్నాను” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάλιστα
  choice: ప్రత్యేకంగా
  rationale: మునుపటి వాక్యంలో చెప్పిన సంతోషానికి అగ్రిప్పకున్న పరిజ్ఞానం ప్రత్యేక కారణమని ఈ పదం నొక్కిచెబుతుంది.
- source_word: γνώστην ὄντα σε
  choice: మీరు బాగా ఎరిగినవారు
  rationale: అగ్రిప్పకు ఈ విషయాలపై మంచి పరిచయం ఉందని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘నిపుణుడు’ అని చెప్పి భావాన్ని అతిశయింపజేయదు.
- source_word: πάντων τῶν κατὰ Ἰουδαίους ἐθῶν
  choice: యూదులలో ఉన్న ఆచారాలన్నిటినీ
  rationale: κατὰ Ἰουδαίους సూచించే యూదులకు సంబంధించిన లేదా వారి మధ్యనున్న పరిధిని సన్నిహితంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τε καὶ
  choice: ఆచారాలన్నిటినీ, వివాదాలనూ
  rationale: రెండు సంబంధిత వర్గాలను తెలుగు సముచ్చయ నిర్మాణంతో స్పష్టంగా కలుపుతుంది.
- source_word: ζητημάτων
  choice: వివాదాలను
  rationale: న్యాయవిచారణ సందర్భంలో చర్చకు, విభేదానికి గురైన అంశాలను సూచిస్తుంది; తటస్థమైన ‘ప్రశ్నలు’ కంటే సందర్భానికి సరిపోతుంది.
- source_word: διὸ
  choice: కాబట్టి
  rationale: అగ్రిప్ప పరిజ్ఞానం ఆధారంగా పౌలు చేస్తున్న విజ్ఞప్తికి కారణాత్మక అనుసంధానం కల్పిస్తుంది.
- source_word: δέομαι
  choice: వేడుకుంటున్నాను
  rationale: సాధారణంగా అడగడం కంటే హృదయపూర్వకమైన, గంభీరమైన విజ్ఞప్తిని వ్యక్తం చేస్తుంది; అతిగా ప్రాచీనంగా వినిపించదు.
- source_word: μακροθύμως
  choice: ఓపికగా
  rationale: పౌలు కోరుతున్న సహనపూర్వక వినికిడిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀκοῦσαί μου
  choice: నేను చెప్పేది ... వినాలని
  rationale: వ్యక్తి మాటను శ్రద్ధగా వినాలనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; మూలంలో లేని ‘చివరివరకు’ అనే భావాన్ని చేర్చదు.
