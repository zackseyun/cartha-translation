revisions:
- from: ప్రత్యేకంగా, యూదులలో ఉన్న ఆచారాలన్నిటినీ, వివాదాలనూ మీరు బాగా ఎరిగినవారు కాబట్టి[a], నేను చెప్పేది ఓపికగా వినాలని మిమ్మల్ని వేడుకుంటున్నాను.[b]
