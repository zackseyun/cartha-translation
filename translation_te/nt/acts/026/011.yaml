id: ACT.26.11
reference: Acts 26:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ κατὰ πάσας τὰς συναγωγὰς πολλάκις τιμωρῶν αὐτοὺς ἠνάγκαζον βλασφημεῖν, περισσῶς τε ἐμμαινόμενος αὐτοῖς ἐδίωκον ἕως καὶ εἰς τὰς ἔξω πόλεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/011.yaml
  text: And in all the synagogues[a], punishing them many times, I tried to force them to blaspheme; and being exceedingly enraged against them, I kept persecuting them even to the foreign cities.
translation:
  language: te
  text: సమాజమందిరాలన్నిటిలో వారిని పదేపదే శిక్షిస్తూ, దైవదూషణ చేయమని వారిని బలవంతపెట్టడానికి ప్రయత్నించేవాణ్ణి. వారిమీద విపరీతమైన ఆగ్రహంతో రగిలిపోతూ, వెలుపలి పట్టణాలకు కూడా వెళ్లి వారిని హింసించేవాణ్ణి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “బయటి పట్టణాలకు కూడా.” ఈ మాట యూదయకు వెలుపల ఉన్న పట్టణాలను సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πάσας τὰς συναγωγάς
  choice: సమాజమందిరాలన్నిటిలో
  rationale: κατά + accusative యొక్క పంపిణీ/స్థాన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πολλάκις τιμωρῶν
  choice: పదేపదే శిక్షిస్తూ
  rationale: πολλάκις లోని పునరావృత భావాన్నీ, వర్తమాన కృదంతంలోని సమకాలీన పరిస్థితి/సాధన భావాన్నీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἠνάγκαζον
  choice: బలవంతపెట్టడానికి ప్రయత్నించేవాణ్ణి
  rationale: అసంపూర్ణ భూతకాల క్రియలోని పునరావృతమైన, సందర్భానుసారంగా ప్రయత్నార్థకమైన చర్యను తెలియజేస్తుంది; ప్రతి ప్రయత్నం ఫలించిందని నిర్బంధించదు.
- source_word: βλασφημεῖν
  choice: దైవదూషణ చేయమని
  rationale: మూలంలో దూషణకు గురైన వ్యక్తి లేదా విషయం చెప్పబడలేదు; అందువల్ల యేసు అనే కర్మను చేర్చకుండా సాధారణ ధార్మిక అర్థాన్ని ఉంచుతుంది.
- source_word: περισσῶς τε ἐμμαινόμενος αὐτοῖς
  choice: వారిమీద విపరీతమైన ఆగ్రహంతో రగిలిపోతూ
  rationale: అతి తీవ్రమైన, ఉన్మత్తతకు చేరిన శత్రుత్వాన్ని ఆధునిక తెలుగులో మానసిక వ్యాధి భావం రాకుండా వ్యక్తం చేస్తుంది.
- source_word: ἐδίωκον
  choice: వారిని హింసిస్తూ వచ్చాను
  rationale: διώκω యొక్క సందర్భోచిత హింసార్థాన్నీ, imperfect లోని కొనసాగిన/పునరావృత చర్యనూ నిలుపుతుంది.
- source_word: ἕως καὶ εἰς τὰς ἔξω πόλεις
  choice: వెలుపలి పట్టణాల వరకు కూడా
  rationale: ἔξω అనే పదంలోని ‘బయట/అవతల’ భావాన్ని కాపాడి, అది ఖచ్చితంగా ‘విదేశీ’ అని ప్రధాన పాఠ్యంలో నిర్ణయించకుండా ఉంచుతుంది.
theological_decisions:
- issue: βλασφημεῖν యొక్క ఉద్దేశ్య కర్మ
  choice: కర్మను పేర్కొనకుండా ‘దైవదూషణ చేయమని’ అని అనువదించడం
  alternative: ‘యేసును దూషించమని’ లేదా ‘క్రైస్తవ విశ్వాసాన్ని శపించమని’
  rationale: సందర్భం యేసు లేదా ఆయన గురించిన సాక్ష్యంపై దూషణను సూచించినా, గ్రీకు వాక్యంలో కర్మ స్పష్టంగా లేదు; ఆ అస్పష్టతను నిలుపుకోవాలి.
- issue: ἔξω πόλεις యొక్క భౌగోళిక పరిధి
  choice: ‘వెలుపలి పట్టణాలు’ అని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘విదేశీ పట్టణాలు’ లేదా ‘యూదయ వెలుపలి పట్టణాలు’
  rationale: ఈ పదబంధం యూదయకు వెలుపలి పట్టణాలను సూచించే అవకాశం బలంగా ఉన్నా, మూలపాఠ్యం ఆ ప్రాంతాన్ని పేరుపెట్టి చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘సమాజమందిరం,’ ‘దైవదూషణ’ వంటి స్థిరమైన బైబిలు పదాలను ఉపయోగిస్తూ, అతిగా ప్రాచీనమైన శైలిని నివారించింది.
