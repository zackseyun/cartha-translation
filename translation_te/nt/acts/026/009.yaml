id: ACT.26.9
reference: Acts 26:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν οὖν ἔδοξα ἐμαυτῷ πρὸς τὸ ὄνομα Ἰησοῦ τοῦ Ναζωραίου δεῖν πολλὰ ἐναντία πρᾶξαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/009.yaml
  text: So I myself indeed thought that I ought to do many things in opposition to the name of Jesus the Nazarene[a].
translation:
  language: te
  text: కాబట్టి నజరేయుడైన యేసు నామానికి విరోధంగా అనేక కార్యాలు చేయడం నా కర్తవ్యమని నేనే అనుకున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నజరేతుకు చెందిన యేసు నామానికి వ్యతిరేకంగా.’
    reason: Ναζωραῖοςను బిరుదుగా ‘నజరేయుడు’ అని లేదా Herkunft సూచనగా ‘నజరేతుకు చెందినవాడు’ అని అనువదించవచ్చు; ἐναντίαతో కూడిన ప్రయోగానికి ‘విరోధంగా’తో పాటు ‘వ్యతిరేకంగా’ కూడా సహజమైన ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: Ἐγὼ
  choice: నేనే
  rationale: గ్రీకులో స్పష్టంగా ఉన్న సర్వనామం నొక్కిచెప్పే భావాన్ని కలిగిస్తుంది; ‘నేనే’ పౌలు తన పూర్వ వైఖరిని స్వయంగా ఒప్పుకుంటున్న బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: μὲν οὖν
  choice: కాబట్టి
  rationale: ఈ కణాల సముదాయం ముందటి మాటతో కొనసాగింపు లేదా నిర్ధారణ సంబంధాన్ని, స్వల్ప ఉద్ఘాటనతో సూచిస్తుంది. తెలుగులో ‘కాబట్టి’ ప్రధాన అనుసంధాన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘నేనే’ వాక్యంలో ఉద్ఘాటనను ఇప్పటికే అందిస్తుంది.
- source_word: ἔδοξα ἐμαυτῷ
  choice: అనుకున్నాను
  rationale: ఈ ప్రయోగం వ్యక్తి తనలో తాను ఏర్పరచుకున్న అభిప్రాయం లేదా తీర్పును సూచిస్తుంది. ‘అనుకున్నాను’ ఆధునిక తెలుగులో సహజంగా ఉండి, ‘నేనే’తో కలిసి ఆత్మసంబంధ భావాన్ని తెలియజేస్తుంది.
- source_word: πρὸς τὸ ὄνομα
  choice: నామానికి విరోధంగా
  rationale: ἐναντία πρᾶξαιతో కలిసిన πρός ఇక్కడ ప్రతికూల లేదా విరోధ దిశను సూచిస్తుంది. ‘నామానికి విరోధంగా’ మూలంలోని రూపక ప్రయోగాన్ని నిలుపుతూ సంబంధాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: ὄνομα
  choice: నామం
  rationale: ‘నామం’ అనే బైబిలు ప్రయోగం యేసు వ్యక్తిత్వం, ఖ్యాతి, అధికారాన్ని సూచించగల విస్తృతిని నిలుపుతుంది; వాటిలో ఏ ఒక్క భావానికీ అనువాదం పరిమితం చేయదు.
- source_word: Ἰησοῦ τοῦ Ναζωραίου
  choice: నజరేయుడైన యేసు
  rationale: Ναζωραῖος యేసు ఊరు లేదా గుర్తింపుతో సంబంధమున్న బిరుదు. ‘నజరేయుడైన యేసు’ ఆ బిరుదు స్వభావాన్ని నిలుపుతూ తెలుగులో గౌరవప్రదంగా, సహజంగా ఉంటుంది.
- source_word: δεῖν
  choice: కర్తవ్యమని
  rationale: ఇది పౌలు అప్పట్లో తనపై ఉందని భావించిన అవసరం లేదా బాధ్యతను సూచిస్తుంది. ‘కర్తవ్యమని’ అతని పూర్వ నైతిక నిర్ణయాన్ని తెలియజేస్తుంది; బాహ్యంగా తప్పనిసరిగా విధించబడిందనే అర్థాన్ని రుద్దదు.
- source_word: πολλὰ ἐναντία πρᾶξαι
  choice: విరోధంగా అనేక కార్యాలు చేయడం
  rationale: ఈ పదబంధం అనేక ప్రతికూల చర్యలను చేయడాన్ని సూచిస్తుంది. ‘అనేక కార్యాలు’ πολλὰ యొక్క బహుత్వాన్ని, ‘విరోధంగా’ ἐναντία యొక్క ప్రతికూల భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యేసుకు సంబంధించి ‘నామం’ అనే ప్రయోగం యొక్క భావం
  choice: ‘నామం’ అనే బైబిలు ప్రయోగాన్ని అలాగే నిలుపడం
  alternative: ‘యేసు అధికారం’ లేదా ‘యేసు పక్షం’ అని అర్థాన్ని నిర్దిష్టం చేయడం
  rationale: మూలపాఠం ఈ ప్రయోగాన్ని అధికారం, బోధ, ఉద్యమం వంటి ఒక్క భావానికి పరిమితం చేయదు. ‘నామం’ను నిలుపడం ద్వారా యేసు వ్యక్తి, ఆయన బహిరంగ గుర్తింపు, ఆయన ప్రాతినిధ్య అధికారం వంటి భావవ్యాప్తి అలాగే ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘నామం’ బైబిలు-ధార్మిక భావవ్యాప్తిని కాపాడుతుంది; మిగతా వాక్యనిర్మాణం సహజమైన తెలుగు క్రమంలో అమర్చబడింది.
