  revised_text: కాబట్టి, దేవుని నుండి సహాయం పొందినందున, నేను నేటివరకు నిలిచి ఉన్నాను; చిన్నవారికీ గొప్పవారికీ[a] సాక్ష్యమిస్తూ, ప్రవక్తలూ మోషే కూడా జరగబోతున్నాయని చెప్పిన విషయాలను తప్ప మరేమీ చెప్పడం లేదు[b].
