id: ACT.26.22
reference: Acts 26:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπικουρίας οὖν τυχὼν τῆς ⸀ἀπὸ τοῦ θεοῦ ἄχρι τῆς ἡμέρας ταύτης ἕστηκα μαρτυρόμενος μικρῷ τε καὶ μεγάλῳ, οὐδὲν ἐκτὸς λέγων ὧν τε οἱ προφῆται ἐλάλησαν μελλόντων γίνεσθαι καὶ Μωϋσῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/022.yaml
  text: Therefore[a], having received the help that is from God, I stand to this day, testifying to both small and great, saying nothing except what both the prophets and Moses said was going to happen[c][b],
translation:
  language: te
  text: కాబట్టి, దేవుని నుండి సహాయం పొందినందున, నేను నేటివరకు నిలిచి ఉన్నాను; చిన్నవారికీ గొప్పవారికీ[a] సాక్ష్యమిస్తూ, ప్రవక్తలూ మోషే కూడా జరగబోతున్నాయని చెప్పిన విషయాలను తప్ప మరేమీ చెప్పడం లేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చిన్నవారికీ గొప్పవారికీ’ అంటే అన్ని సామాజిక స్థాయులవారికీ అని అర్థం.
    reason: cultural_note
  - marker: b
    text: 'మరో విధంగా: ‘ప్రవక్తలూ మోషే కూడా జరుగుతాయని చెప్పినవాటిని తప్ప నేనేమీ చెప్పడం లేదు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικουρίας ... τῆς ἀπὸ τοῦ θεοῦ
  choice: దేవుని నుండి సహాయం
  rationale: సహాయానికి దేవుడే మూలమని గ్రీకు అత్రిబ్యూటివ్ పదబంధం స్పష్టంగా తెలుపుతుంది; ఆధునిక తెలుగులో ఇది సహజంగా, నేరుగా ఉంది.
- source_word: τυχὼν
  choice: పొందిన
  rationale: ఇక్కడ τυγχάνω అనే క్రియకు ‘పొందడం/లభించడం’ అనే భావం ఉంది; పూర్వకాలిక క్రియావిశేషణ సంబంధాన్ని తెలుగు భూతకృదంతం సహజంగా తెలియజేస్తుంది.
- source_word: ἄχρι τῆς ἡμέρας ταύτης ἕστηκα
  choice: ఈ రోజు వరకు నిలిచి
  rationale: ἕστηκα యొక్క ఫలితస్థితి ఇప్పటికీ కొనసాగుతుందనే భావాన్ని ‘ఈ రోజు వరకు నిలిచి’ నిలుపుతుంది; పౌలు భౌతికంగా నిలబడటమే కాక నిలకడగా కొనసాగుతున్నాడనే సందర్భార్థానికీ ఇది వీలు ఇస్తుంది.
- source_word: μαρτυρόμενος
  choice: సాక్ష్యం చెబుతున్నాను
  rationale: కొనసాగుతున్న సాక్ష్యకార్యాన్ని, న్యాయస్థాన నేపథ్యంలోని సాక్షి భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: μικρῷ τε καὶ μεγάλῳ
  choice: చిన్నవారికీ గొప్పవారికీ
  rationale: మూలంలోని సమతుల్య జంటను యథాతథంగా నిలిపి, అన్ని సామాజిక స్థాయులవారనే నుడికారార్థాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: οὐδὲν ἐκτὸς λέγων
  choice: మించి నేనేమీ చెప్పడం లేదు
  rationale: ἐκτός ఇక్కడ ‘వెలుపల/మించి’ అనే పరిమితి భావాన్ని ఇస్తుంది; ఇది లేఖనాలకు అతీతంగా ఏదీ చెప్పడం లేదనే బలమైన వాదనను సహజ తెలుగులో నిలుపుతుంది.
- source_word: οἱ προφῆται ... καὶ Μωϋσῆς
  choice: ప్రవక్తలూ మోషే కూడా
  rationale: గ్రీకు మూలంలోని ప్రవక్తలు—మోషే క్రమాన్ని కాపాడుతూ τε ... καί జోడింపు భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μελλόντων γίνεσθαι
  choice: జరగబోతున్నాయని
  rationale: ప్రవక్తలూ మోషే మాట్లాడిన కాలంతో పోలిస్తే భవిష్యత్తులో సంభవించనున్న విషయాలనే భావాన్ని నిలుపుతుంది; తప్పనిసరి విధి లేదా తక్షణత్వాన్ని అదనంగా చేర్చదు.
theological_decisions:
- issue: ఇశ్రాయేలు లేఖనాలతో పౌలు సాక్ష్యానికి ఉన్న కొనసాగింపు
  choice: ప్రవక్తలూ మోషే కూడా చెప్పిన వాటికి మించి తాను ఏమీ చెప్పడం లేదని బలంగా ప్రకటిస్తున్నట్లు అనువదించడం
  alternative: తన సందేశం లేఖనాలతో సాధారణంగా ఏకీభవిస్తుందని మాత్రమే చెప్పినట్లు సడలించి అనువదించడం
  rationale: οὐδὲν ἐκτὸς అనే నిర్మాణం పరిమితిని బలంగా సూచిస్తుంది. అనువాదం ఆ కొనసాగింపు వాదనను నిలుపుతుంది గానీ, ప్రవచన నెరవేర్పు వివరాలను ఈ వచనంలోకి అదనంగా చేర్చదు.
- issue: ἕστηκα యొక్క భావవ్యాప్తి
  choice: ‘ఈ రోజు వరకు నిలిచి’ అని అనువదించి ప్రస్తుతం కొనసాగుతున్న ఫలితస్థితిని నిలుపడం
  alternative: ‘ఈ రోజు వరకు బ్రతికి ఉన్నాను’ లేదా ‘స్థిరంగా ఉన్నాను’ అని సందర్భార్థాన్ని పూర్తిగా వివరణాత్మకంగా మార్చడం
  rationale: గ్రీకు పరిపూర్ణకాల రూపం ప్రస్తుత స్థితిని సూచిస్తుంది; ‘నిలిచి’ అనే రూపం భౌతిక, రూపకాలంకార భావాల మధ్య ఉన్న సహజ అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని ‘ప్రవక్తలు—మోషే’ క్రమం, ‘చిన్న—గొప్ప’ అలంకార జంట, లేఖనాలకు మించి ఏమీ చెప్పడం లేదనే బలమైన పరిమితి అన్నీ నిలుపబడ్డాయి. ప్రధాన వాక్యం అధికంగా పొడవవకుండా రెండు వాక్యాలుగా విభజించబడింది.
