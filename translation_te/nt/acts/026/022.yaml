revisions:
- from: కాబట్టి, దేవుని నుండి సహాయం పొందిన నేను ఈ రోజు వరకు నిలిచి, చిన్నవారికీ గొప్పవారికీ[a] సాక్ష్యం చెబుతున్నాను. ప్రవక్తలూ మోషే కూడా జరగబోతున్నాయని చెప్పిన వాటికి మించి నేనేమీ చెప్పడం లేదు[b].
  to: కాబట్టి, దేవుని నుండి సహాయం పొందినందున, నేను నేటివరకు నిలిచి ఉన్నాను; చిన్నవారికీ గొప్పవారికీ[a] సాక్ష్యమిస్తూ, ప్రవక్తలూ మోషే కూడా జరగబోతున్నాయని చెప్పిన విషయాలను తప్ప మరేమీ చెప్పడం లేదు[b].
  rationale: సవరణ అర్థాన్ని మార్చదు. ‘నిలిచి ఉన్నాను’ ద్వారా గ్రీకు పరిపూర్ణకాలపు కొనసాగుతున్న స్థితిని, ‘విషయాలను తప్ప మరేమీ’ ద్వారా οὐδὲν ἐκτὸς యొక్క బలమైన పరిమితిని సహజ తెలుగులో వ్యక్తం చేస్తుంది. μελλόντων γίνεσθαι యొక్క భవిష్యత్ భావాన్ని ‘జరగబోతున్నాయని’గా నిలుపుతుంది; అదనపు సిద్ధాంతార్థం చేర్చదు.
