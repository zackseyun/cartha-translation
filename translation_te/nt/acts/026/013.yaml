  to: మధ్యాహ్న సమయంలో[a], రాజా, నేను దారిలో వెళ్తుండగా, పరలోకం నుండి సూర్యుని ప్రకాశాన్ని మించిన ఒక వెలుగు నన్నూ నాతో ప్రయాణిస్తున్నవారినీ చుట్టుముట్టి వెలిగినట్లు చూశాను.
