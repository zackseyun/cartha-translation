id: ACT.26.13
reference: Acts 26:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡμέρας μέσης κατὰ τὴν ὁδὸν εἶδον, βασιλεῦ, οὐρανόθεν ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου περιλάμψαν με φῶς καὶ τοὺς σὺν ἐμοὶ πορευομένους·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/013.yaml
  text: At midday[a], along the road, I saw, O king, a light from heaven, brighter than the sun, shining around me and those traveling with me.
translation:
  language: te
  text: మధ్యాహ్న సమయంలో[a], రాజా, నేను దారిలో వెళ్తుండగా, పరలోకం నుండి సూర్యుని ప్రకాశాన్ని మించిన ఒక వెలుగు నన్నూ నాతో ప్రయాణిస్తున్నవారినీ చుట్టుముట్టి వెలిగినట్లు చూశాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దినమధ్యంలో.’ ఈ మాట దినమధ్య సమయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας μέσης
  choice: మధ్యాహ్న సమయంలో
  rationale: ఈ కాలసూచక గ్రీకు ప్రయోగం దినమధ్యాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: κατὰ τὴν ὁδὸν
  choice: దారిలో వెళ్తుండగా
  rationale: ప్రయాణ సందర్భంలోని స్థలాన్ని తెలియజేస్తుంది; తరువాతి సహప్రయాణికుల ప్రస్తావనతో సహజంగా అనుసంధానమవుతుంది.
- source_word: εἶδον
  choice: నేను చూశాను
  rationale: సాధారణ దృష్టిగ్రహణాన్ని తెలిపే భూతకాల క్రియకు నేరమైన అనువాదం.
- source_word: βασιλεῦ
  choice: రాజా
  rationale: అగ్రిప్పను నేరుగా సంబోధించే గౌరవప్రదమైన సంబోధన; తెలుగులో సహజమైన రూపం.
- source_word: οὐρανόθεν
  choice: ఆకాశం నుండి
  rationale: పైలోకం/ఆకాశం నుండి వచ్చిన మూలాన్ని సూచిస్తుంది; సందర్భంలోని దివ్య భావాన్ని బలవంతంగా విస్తరించకుండా నిలుపుతుంది.
- source_word: ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου
  choice: సూర్యుని ప్రకాశాన్ని మించిన
  rationale: ὑπέρ వ్యక్తం చేసే అధికతను, λαμπρότης అనే ‘ప్రకాశం’ నామవాచకాన్ని రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: φῶς
  choice: వెలుగు
  rationale: కనిపించిన ప్రకాశమయమైన దృగ్విషయాన్ని సహజమైన తెలుగు పదంతో సూచిస్తుంది.
- source_word: περιλάμψαν με ... καὶ τοὺς σὺν ἐμοὶ πορευομένους
  choice: నా చుట్టూ, నాతో ప్రయాణిస్తున్నవారి చుట్టూ ప్రకాశించడం
  rationale: περιλάμπω లోని చుట్టూ వెలిగే భావాన్ని, పౌలు మరియు అతని సహప్రయాణికులు ఇద్దరినీ ఆ వెలుగు ఆవరించిన విషయాన్ని కాపాడుతుంది.
theological_decisions:
- issue: οὐρανόθεν పదాన్ని దర్శనాత్మక సందర్భంలో అనువదించడం
  choice: ఆకాశం నుండి
  alternative: పరలోకం నుండి
  rationale: గ్రీకు పదం పై నుండి/ఆకాశం నుండి అనే మూలాన్ని తెలుపుతుంది. ‘ఆకాశం నుండి’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండి, ఘటన దివ్య మూలాన్ని సందర్భమే తెలియజేయనిస్తుంది; ‘పరలోకం నుండి’ మరింత స్పష్టమైన తాత్త్విక వ్యాఖ్యానాన్ని చేర్చవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘రాజా’ అనే సంబోధనను నిలుపుతూ, గ్రీకు వాక్యంలోని ప్రకాశం సూర్యుని ప్రకాశాన్ని అధిగమించిందనే బలమైన పోలికను సహజంగా వ్యక్తం చేశాం.
