id: ACT.26.6
reference: Acts 26:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ νῦν ἐπ’ ἐλπίδι τῆς ⸀εἰς τοὺς πατέρας ⸀ἡμῶν ἐπαγγελίας γενομένης ὑπὸ τοῦ θεοῦ ἕστηκα κρινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/006.yaml
  text: And now I stand on trial because of the hope of the promise made by God to our fathers,[a]
translation:
  language: te
  text: ఇప్పుడు దేవుడు మన పితరులకు[a] చేసిన వాగ్దానాన్ని గురించిన నిరీక్షణ కారణంగా నేను విచారణను ఎదుర్కొంటున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మన పూర్వీకులకు.’ గ్రీకు పాఠంలో ‘మన పితరులకు’ అని ఉంది; ఇది ఇశ్రాయేలు పూర్వపితరులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: ఇప్పుడు
  rationale: ప్రస్తుత న్యాయవిచారణను ముందటి వాదనతో అనుసంధానించే సహజమైన తెలుగు సంధాన పదం.
- source_word: ἐπ’ ἐλπίδι
  choice: నిరీక్షణ కారణంగానే
  rationale: దత్తివుతో కూడిన ἐπί ఇక్కడ ఆధారాన్ని లేదా కారణాన్ని సూచిస్తుంది; ‘కారణంగానే’ పౌలు ఎందుకు విచారణలో ఉన్నాడో స్పష్టంగా తెలియజేస్తుంది.
- source_word: τῆς ... ἐπαγγελίας
  choice: వాగ్దానాన్ని బట్టి కలిగిన నిరీక్షణ
  rationale: జనిటివ్ సంబంధాన్ని సహజమైన తెలుగులో చూపుతూ, నిరీక్షణ దేవుని వాగ్దానంపై ఆధారపడిందనే భావాన్ని తెలియజేస్తుంది; వాగ్దానం ఎలా నెరవేరుతుందో అదనంగా నిర్ధారించదు.
- source_word: τῆς εἰς τοὺς πατέρας ἡμῶν ἐπαγγελίας
  choice: మన పితరులకు చేసిన వాగ్దానం
  rationale: εἰς ఇక్కడ వాగ్దానం ఎవరి వైపు ఉద్దేశించబడిందో, అంటే దాని గ్రహీతలను సూచిస్తుంది.
- source_word: γενομένης ὑπὸ τοῦ θεοῦ
  choice: దేవుడు ... చేసిన
  rationale: ὑπό + షష్ఠీ విభక్తి దేవుని కర్తృత్వాన్ని తెలియజేస్తుంది; తెలుగులో కర్తరి ప్రయోగం సహజంగా ఉంటుంది.
- source_word: πατέρας ἡμῶν
  choice: మన పితరులు
  rationale: మూలంలోని పుంలింగ బహువచనాన్ని, ఇశ్రాయేలు ఒడంబడిక చరిత్రకు సంబంధించిన పూర్వపితరుల భావాన్ని నిలుపుతుంది.
- source_word: ἕστηκα
  choice: నిలబడి ఉన్నాను
  rationale: పరిపూర్ణ కాలరూపానికి ఇక్కడ ప్రస్తుత స్థితిని సూచించే బలం ఉంది.
- source_word: κρινόμενος
  choice: విచారణకు
  rationale: పౌలు ఎదుర్కొంటున్న న్యాయపరమైన విచారణను సాధారణ ఆధునిక తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘మన పితరులు’ ఎవరు?
  choice: ఇశ్రాయేలు పూర్వపితరులు/ఒడంబడిక పూర్వీకులు
  alternative: యూదా ప్రజల పూర్వీకులు అనే సాధారణ అర్థం
  rationale: అగ్రిప్పా ఎదుట పౌలు చేసిన ప్రసంగంలో ఈ పదబంధం ఇశ్రాయేలు చరిత్రలో దేవుని వాగ్దానాలను పొందిన పూర్వపితరులను గుర్తుచేస్తుంది. ప్రధాన పాఠం ఈ సంబంధాన్ని నిలుపుతూ దానిని మరీ విస్తరించి వ్యాఖ్యానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయస్థాన సందర్భానికి తగిన గౌరవప్రదమైన సాధారణ శైలి. ‘పితరులు’ అనే బైబిలు సంబంధ పదం మూలంలోని లింగసూచనను, ఒడంబడిక నేపథ్యాన్ని నిలుపుతుంది; పాదసూచిక సాధారణ ప్రత్యామ్నాయాన్ని ఇస్తుంది.
