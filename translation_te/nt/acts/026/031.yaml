id: ACT.26.31
reference: Acts 26:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀναχωρήσαντες ἐλάλουν πρὸς ἀλλήλους λέγοντες ὅτι Οὐδὲν θανάτου ⸂ἢ δεσμῶν ἄξιον⸃ ⸀τι πράσσει ὁ ἄνθρωπος οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/031.yaml
  text: And after they withdrew[a], they were speaking to one another, saying, “This man is doing nothing worthy of death or imprisonment.”
translation:
  language: te
  text: వారు అక్కడి నుంచి వెళ్లిపోయిన తర్వాత, “ఈ మనిషి మరణశిక్షకుగానీ, ఖైదుకుగానీ[a] తగినదేదీ చేయడం లేదు” అని ఒకరితో ఒకరు మాట్లాడుకుంటున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరణానికిగానీ, సంకెళ్లకుగానీ.” δεσμῶν అనే గ్రీకు పదానికి అక్షరార్థం “బంధాలు/సంకెళ్లు”; ఇక్కడ అది ఖైదు లేదా నిర్బంధాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναχωρήσαντες
  choice: అక్కడి నుంచి వెళ్లిపోయిన తర్వాత
  rationale: ప్రధాన సంభాషణకు ముందు వారు ఆ ప్రదేశం నుంచి తొలగిపోయినట్లు భూతకాల అసమాపక క్రియ సూచిస్తుంది; ఈ రూపం ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: ἐλάλουν πρὸς ἀλλήλους
  choice: ఒకరితో ఒకరు మాట్లాడుకుంటున్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న పరస్పర సంభాషణను సూచిస్తుంది; ‘మాట్లాడుకుంటున్నారు’ ఆ పరస్పరతను, కొనసాగింపును సహజంగా తెలియజేస్తుంది.
- source_word: λέγοντες ὅτι
  choice: … అని
  rationale: వారి సంభాషణలోని మాటలను తెలుగులో సహజమైన ప్రత్యక్ష ఉల్లేఖన నిర్మాణంతో పరిచయం చేస్తుంది.
- source_word: Οὐδὲν ... ἄξιον
  choice: తగినదేదీ
  rationale: ఆ మనిషి చేసినది పేర్కొన్న శిక్షల్లో దేనికీ అర్హమైనది కాదనే భావాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: θανάτου ἢ δεσμῶν
  choice: మరణశిక్షకుగానీ, ఖైదుకుగానీ
  rationale: న్యాయవిచారణ సందర్భంలో θανάτου మరణశిక్షను, δεσμῶν బంధనం ద్వారా ఖైదు లేదా నిర్బంధాన్ని సూచిస్తాయి. ప్రధాన పాఠంలో ఉద్దేశించిన న్యాయపరమైన భావాన్ని స్పష్టంగా ఇచ్చి, పదశః రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: τι πράσσει
  choice: చేయడం లేదు
  rationale: πράσσει అనే వర్తమానకాల క్రియను విస్తృతమైన ‘చేయడం’తో అందించడం ద్వారా మూలంలో లేని నేరార్థాన్ని అదనంగా చేర్చకుండా వర్తమాన భావాన్ని కాపాడుతుంది.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: ఈ మనిషి
  rationale: పౌలును సూచించే పుంలింగ ఏకవచన పదబంధానికి నేరుగా, సహజంగా సరిపోతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయపరమైన భాషను ఉపయోగించాం. కొనసాగుతున్న సంభాషణను ‘మాట్లాడుకుంటున్నారు’తో, పరస్పర భావాన్ని ‘ఒకరితో ఒకరు’తో నిలిపాం. పాదటిప్పణి సూచికను అది వివరిస్తున్న ‘ఖైదు’ పదం వద్ద ఉంచాం.
