  text: ⸀Ἀνέστη ⸀τε ὁ βασιλεὺς καὶ ὁ ἡγεμὼν ἥ τε Βερνίκη καὶ οἱ συγκαθήμενοι αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/030.yaml
  text: Then the king rose[a], and the governor and Bernice and those seated with them,
translation:
  language: te
  text: అప్పుడు రాజు, అధిపతి, బెర్నీకే[a], వారితో కూర్చున్నవారు లేచారు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“బెర్నీకే”: ప్రత్యామ్నాయ లిప్యంతరీకరణ “బెరెనీకే.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέστη
  choice: లేచాడు … లేచారు
  rationale: ἀνίστημι ఇక్కడ కూర్చున్న చోటునుంచి భౌతికంగా లేవడాన్ని సూచిస్తుంది. గ్రీకులో ఒక్కసారి వచ్చిన క్రియ మొత్తం సంయుక్త కర్తలకు వర్తిస్తుంది; తెలుగులో సహజత, స్పష్టత కోసం చివర బహువచన క్రియను కూడా ఉంచాం.
- source_word: τε
  choice: అప్పుడు; అలాగే
  rationale: మొదటి τε కథనంలోని తదుపరి చర్యను ముందుకు తీసుకెళ్తుంది; రెండవ τε సమన్వయాన్ని బలపరుస్తుంది. ఆధునిక తెలుగులో వాటి పనిని ‘అప్పుడు’, ‘అలాగే’ సహజంగా తెలియజేస్తాయి.
- source_word: ὁ βασιλεὺς
  choice: రాజు
  rationale: గ్రీకు పాఠం అగ్రిప్ప అనే పేరుకు బదులు అతని బిరుదునే ఉపయోగిస్తుంది; అందువల్ల ‘రాజు’ అని నిలిపాం.
- source_word: ὁ ἡγεμὼν
  choice: అధిపతి
  rationale: ἡγεμών ఇక్కడ రోమా పరిపాలనా అధికారి అయిన గవర్నరును సూచిస్తుంది. ‘అధిపతి’ గౌరవప్రదమైన, సులభంగా అర్థమయ్యే తెలుగు పదం; సందర్భం అతని అధికారిక హోదాను తెలియజేస్తుంది.
- source_word: Βερνίκη
  choice: బెర్నీకే
  rationale: గ్రీకు రూపం Βερνίκηకి సమీపమైన తెలుగు లిప్యంతరీకరణను ఎంచుకున్నాం. తెలుగులో పరిచితమైన ప్రత్యామ్నాయ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: οἱ συγκαθήμενοι αὐτοῖς
  choice: వారితో కూర్చున్నవారు
  rationale: సమూహంగా వారితో కూర్చున్నారనే దృశ్యాన్ని నేరుగా నిలుపుతుంది; వారి సామాజిక పాత్రను ఊహించి జోడించదు.
- source_word: καὶ
  choice: అలాగే / ,
  rationale: పునరావృత καί వ్యక్తులను, సమూహాన్ని ఒకే జాబితాలో కలుపుతుంది. తెలుగులో సంధానపదం మరియు జాబితా విరామచిహ్నాల ద్వారా ఈ సమన్వయం సహజంగా వ్యక్తమవుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని సంయుక్త జాబితాను నిలుపుతూ, తెలుగులో క్రియాసంబంధం స్పష్టంగా ఉండేందుకు క్రియను చివర బహువచనంలో పునరుక్తం చేశాం.
