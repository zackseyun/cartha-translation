source:
  edition: SBLGNT
  text: Ἀγρίππας δὲ τῷ Φήστῳ ἔφη· Ἀπολελύσθαι ἐδύνατο ὁ ἄνθρωπος οὗτος εἰ μὴ ἐπεκέκλητο Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/032.yaml
  text: Then Agrippa said to Festus[a], “This man could have been released if he had not appealed to Caesar.”
translation:
  language: te
  text: అప్పుడు అగ్రిప్ప ఫేస్తుతో, “అతడు కైసరుకు అప్పీలు చేసి ఉండకపోతే, ఈ మనిషిని విడుదల చేయడానికి వీలుండేది” అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు కైసరుకు అప్పీలు చేసి ఉండకపోతే, ఈ మనిషిని విడుదల చేసి ఉండవచ్చు.”
    reason: ἀπολύω న్యాయసందర్భంలో విడుదల చేయడాన్ని సూచిస్తుంది. ἐδύνατο విడుదల అనేది ఖచ్చితంగా జరిగేదని కాక, సాధ్యమని తెలియజేస్తుంది.
lexical_decisions:
- source_word: δὲ
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి ఘట్టానికి మార్పును సహజమైన తెలుగులో సూచిస్తుంది; సంధాన భావాన్ని విస్మరించదు.
- source_word: ἔφη
  choice: అన్నాడు
  rationale: φημί యొక్క అసంపూర్ణ భూతకాల రూపం ఇక్కడ కథనంలో సాధారణ వాక్యప్రవేశకంగా పనిచేస్తుంది; తెలుగులో ‘అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: Ἀπολελύσθαι
  choice: విడుదల చేయబడి ఉండేవాడు
  rationale: ἀπολύω యొక్క సంపూర్ణ క్రియానామ రూపం విడుదలైన స్థితిని సూచిస్తుంది. న్యాయపరమైన సందర్భానికి ఇది సరిపోతుంది; ‘నిర్దోషిగా తీర్పు పొందడం’ అనే అతిసంకుచిత భావాన్ని చేర్చదు.
- source_word: ἐδύνατο
  choice: చేయబడి ఉండేవాడు
  rationale: నెరవేరని గతకాల సాధ్యతను షరతు వాక్యంతో కలిపి సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: ఈ మనిషి
  rationale: నిర్దిష్ట పురుషుడైన పౌలును సూచించే నామవాచకాన్నీ, οὗτος లోని సూచన బలాన్నీ నిలుపుతుంది.
- source_word: εἰ μὴ
  choice: చేసుకోకపోయి ఉంటే
  rationale: గతంలో నెరవేరని వ్యతిరేక షరతును స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐπεκέκλητο
  choice: అప్పీలు చేసుకోకపోయి
  rationale: రోమా న్యాయ సందర్భంలో ἐπικαλέω అనేది చక్రవర్తి తీర్పును కోరుతూ పై న్యాయాధికారికి అప్పీలు చేయడాన్ని సూచిస్తుంది; ‘అప్పీలు చేసుకోవడం’ ఆ న్యాయార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: Καίσαρα
  choice: కైసరుకు
  rationale: చారిత్రకమైన అధికార బిరుదును అనువాద వివరణతో భర్తీ చేయకుండా మూలంలోని రూపాన్నే నిలుపుతుంది.
