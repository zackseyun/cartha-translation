- from: అప్పుడు అగ్రిప్ప ఫేస్తుతో, “ఈ మనిషి కైసరుకు అప్పీలు చేసుకోకపోయి ఉంటే విడుదల చేయబడి ఉండేవాడు[a]” అన్నాడు.
  to: అప్పుడు అగ్రిప్ప ఫేస్తుతో, “అతడు కైసరుకు అప్పీలు చేసి ఉండకపోతే, ఈ మనిషిని విడుదల చేయడానికి వీలుండేది” అన్నాడు.[a]
