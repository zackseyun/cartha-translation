  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘కొరడా దెబ్బలతో విచారించడం’ అనే మూలంలోని కఠినమైన భావాన్ని మృదువుపరచకుండా నిలిపి, ప్రత్యామ్నాయ సహజ వ్యక్తీకరణను పాదసూచికలో ఇచ్చాం.
