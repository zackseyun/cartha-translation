id: ACT.22.24
reference: Acts 22:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐκέλευσεν ⸂ὁ χιλίαρχος εἰσάγεσθαι αὐτὸν⸃ εἰς τὴν παρεμβολήν, ⸀εἴπας μάστιξιν ἀνετάζεσθαι αὐτὸν ἵνα ἐπιγνῷ δι’ ἣν αἰτίαν οὕτως ἐπεφώνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/024.yaml
  text: The tribune ordered him to be brought into the barracks[a], saying that he should be examined by scourging[b], so that he might find out for what reason they were shouting against him like this.
translation:
  language: te
  text: సైన్యాధికారి అతన్ని సైనిక శిబిరంలోకి[a] తీసుకెళ్లమని ఆజ్ఞాపించాడు; ప్రజలు అతనికి వ్యతిరేకంగా ఇలా కేకలు వేయడానికి కారణం ఏమిటో తాను తెలుసుకోవడానికి, అతన్ని కొరడాలతో కొడుతూ విచారించమని చెప్పాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సైనికుల బసస్థలంలోకి’ లేదా ‘కోటలోకి.’ ఇక్కడ ఈ పదం యెరూషలేములోని రోమా సైనిక స్థావరాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘కొరడా దెబ్బలతో అతన్ని విచారించమని.’ గ్రీకు వాక్యం విచారణను, దానికి ఉపయోగించే కొరడాలను స్పష్టంగా కలిపి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: సైన్యాధికారి
  rationale: ఇక్కడ రోమా సైన్యంలోని ఉన్నతాధికారిని సూచిస్తుంది. ‘సైన్యాధికారి’ ఆధునిక తెలుగు పాఠకులకు సహజంగా అర్థమవుతుంది; హోదాలోని సంఖ్యాపరమైన భావాన్ని అతిగా ముందుకు తెచ్చే ‘సహస్రాధిపతి’ కంటే సందర్భానికి తగినది.
- source_word: παρεμβολή
  choice: సైనికుల నివాసస్థలం
  rationale: యెరూషలేములోని రోమా సైనిక దళాల స్థావరం లేదా కోటలోని నివాస ప్రదేశాన్ని సూచిస్తుంది. ‘సైనికుల నివాసస్థలం’ దాని సందర్భోచిత కార్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἰσάγεσθαι
  choice: లోనికి తీసుకెళ్లమని
  rationale: ఇతరులు అతన్ని లోపలికి తీసుకెళ్లాలనే కర్మణి భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: μάστιξιν
  choice: కొరడా దెబ్బలతో
  rationale: బహువచన దత్తి రూపం విచారణ జరిపే సాధనాన్ని సూచిస్తుంది; ఇది సాధారణ ప్రశ్నించడం కాక తీవ్రమైన కొరడా శిక్షతో కూడిన విచారణ అని స్పష్టం చేస్తుంది.
- source_word: ἀνετάζεσθαι
  choice: విచారించమని
  rationale: ఈ క్రియ పరీక్షించడం లేదా ప్రశ్నించి విషయం రాబట్టడం అనే భావాన్ని ఇస్తుంది. దానికి తోడైన ‘కొరడా దెబ్బలతో’ అనే పదబంధం బలవంతపు పద్ధతిని వెల్లడిస్తుంది.
- source_word: ἐπιγνῷ
  choice: తెలుసుకోవడానికి
  rationale: సైన్యాధికారి నిజమైన కారణాన్ని కనుగొనాలనే ఉద్దేశాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δι’ ἣν αἰτίαν
  choice: ఎందుకు
  rationale: కారణాన్ని అడిగే గ్రీకు పదబంధాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది; మూలంలో స్పష్టంగా లేని న్యాయపరమైన ‘నేరారోపణ’ భావాన్ని చేర్చదు.
- source_word: οὕτως
  choice: అలా
  rationale: జనం చేస్తున్న కేకల తీరు లేదా తీవ్రతను సూచించే ప్రదర్శక భావాన్ని నిలుపుతుంది.
- source_word: ἐπεφώνουν αὐτῷ
  choice: అతనికి వ్యతిరేకంగా ... కేకలు వేస్తున్నారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న గట్టిపాటి అరుపును, అలాగే αὐτῷతో సందర్భంలో వ్యక్తమయ్యే విరోధ భావాన్ని తెలియజేస్తుంది.
