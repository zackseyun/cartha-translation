    reason: lexical_alternative
  revision_rationale: “జవాబిచ్చాను” ἀπεκρίθην యొక్క ప్రతిస్పందన భావాన్ని నిలుపుతుంది. యేసు మాటలను “నేను నజరేయుడైన యేసును; నీవు హింసిస్తున్నది నన్నే” అని చేయడం ద్వారా గ్రీకులోని స్వీయ-గుర్తింపు మరియు సంబంధ వాక్యార్థం ఆధునిక సహజ తెలుగులో స్పష్టంగా వస్తాయి. κύριε యొక్క అర్థసంభావ్యతను పాదసూచికలో అలాగే ఉంచాం. Footnote b is retained as an anchor even though the revised main text does not require a marker placement change; place [b] after “నజరేయుడైన” in typesetting.
