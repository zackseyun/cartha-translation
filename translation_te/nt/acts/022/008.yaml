id: ACT.22.8
reference: Acts 22:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἀπεκρίθην· Τίς εἶ, κύριε; εἶπέν τε πρὸς ⸀ἐμέ· Ἐγώ εἰμι Ἰησοῦς ὁ Ναζωραῖος ὃν σὺ διώκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/008.yaml
  text: And I answered[a], ‘Who are you, Lord?’ And he said to me, ‘I am Jesus the Nazarene[b], whom you are persecuting.’
translation:
  language: te
  text: నేను, “ప్రభువా,[a] నీవెవరు?” అని జవాబిచ్చాను. ఆయన నాతో, “నేను నజరేయుడైన యేసును; నీవు హింసిస్తున్నది నన్నే” అని చెప్పారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అయ్యా.” గ్రీకు κύριε అనే పదం “ప్రభువా” అనే బిరుదుగానే కాక, గౌరవపూర్వక సంబోధనగానూ వాడవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθην
  choice: అడిగాను
  rationale: ఇది ప్రత్యుత్తర సందర్భంలోని ἀποκρίνομαι. తెలుగులో తరువాత వచ్చే ప్రత్యక్ష ప్రశ్నతో ‘అని అడిగాను’ సహజంగా ఉంటుంది; ‘జవాబిచ్చాను’ కూడా మూలరూపానికి దగ్గరగా ఉన్నా ఇక్కడ తక్కువ సహజం.
- source_word: Τίς εἶ
  choice: నీవెవరు?
  rationale: ప్రశ్నార్థక సర్వనామం, క్రియను సహజమైన ఆధునిక తెలుగు ప్రశ్నగా అనువదిస్తుంది.
- source_word: κύριε
  choice: ప్రభువా
  rationale: κύριοςకు ప్రాజెక్టు అనుసరించే ప్రధాన సమానార్థకం. సౌలు అప్పటికి మాట్లాడుతున్నవారి గుర్తింపును పూర్తిగా తెలుసుకోకపోవడం వల్ల గౌరవసూచక సంబోధన అనే అర్థసాధ్యతను పాదసూచికలో నిలుపుతుంది.
- source_word: εἶπέν τε πρὸς ἐμέ
  choice: ఆయన నాతో … అని చెప్పారు
  rationale: πρὸς ἐμέతో λέγωను తెలుగులో సహజమైన మాటల నిర్మాణంగా ఇస్తుంది; τε యొక్క అనుసంధాన భావం వాక్యక్రమంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: యేసును నేనే
  rationale: తెలుగు గుర్తింపు వాక్యంలో సహజమైన నిర్మాణం; ἐγώ యొక్క ఉద్ఘాటనను ‘నేనే’ నిలుపుతుంది.
- source_word: ὁ Ναζωραῖος
  choice: నజరేయుడైన
  rationale: వ్యక్తికి సంబంధించిన బిరుదు/ప్రాంతీయ విశేషణంగా ఉన్న ఆర్టికల్‌తో కూడిన పదాన్ని దగ్గరగా ప్రతిబింబిస్తుంది; ‘నజరేతుకు చెందిన’ అనే భావం కూడా సాధ్యం.
- source_word: ὃν σὺ διώκεις
  choice: నీవు హింసిస్తున్న
  rationale: διώκω ఇక్కడ విరోధపూర్వకంగా వెంటాడి హింసించడం. వర్తమాన క్రియ కొనసాగుతున్న చర్యను తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: సౌలు సంబోధనలో κύριε అనువాదం
  choice: ప్రభువా
  alternative: అయ్యా
  rationale: ‘ప్రభువు’ అనే ప్రధాన అనువాదం కథనంలోని క్రీస్తు గుర్తింపుతో అనుసంధానాన్ని నిలుపుతుంది. అయితే సౌలు ఇంకా మాట్లాడుతున్నవారు ఎవరో అడుగుతున్నందున ఇది కేవలం గౌరవసూచక ‘అయ్యా’ కూడా కావచ్చు; ఆ ఉద్విగ్నతను పాదసూచికలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. యేసు మాటలకు గౌరవ బహువచన క్రియ ‘చెప్పారు’ వాడబడింది; ప్రత్యక్ష సంభాషణలో సౌలుకు ఏకవచన ‘నీవు’ మూలంలోని σὺను సహజంగా ప్రతిబింబిస్తుంది.
