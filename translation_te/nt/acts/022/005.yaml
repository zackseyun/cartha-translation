    text: లేదా, ‘సోదర సోదరీమణులకు.’ గ్రీకులో ‘సోదరులు’ అని ఉంది; కొన్ని సందర్భాల్లో ఈ పదం విస్తృతమైన సమూహాన్ని సూచించవచ్చు.
