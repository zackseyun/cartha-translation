id: ACT.22.5
reference: Acts 22:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς καὶ ὁ ἀρχιερεὺς μαρτυρεῖ μοι καὶ πᾶν τὸ πρεσβυτέριον· παρ’ ὧν καὶ ἐπιστολὰς δεξάμενος πρὸς τοὺς ἀδελφοὺς εἰς Δαμασκὸν ἐπορευόμην ἄξων καὶ τοὺς ἐκεῖσε ὄντας δεδεμένους εἰς Ἰερουσαλὴμ ἵνα τιμωρηθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/005.yaml
  text: as also the high priest and the whole council of elders can testify for me. From them I also received letters to the brothers in Damascus[a], and I was traveling there to bring also those who were there, bound, to Jerusalem so that they might be punished.
translation:
  language: te
  text: ఈ విషయానికి ప్రధాన యాజకుడూ పెద్దల మండలి అంతా నా గురించి సాక్ష్యం ఇస్తారు. వారి నుండి దమస్కులోని సోదరులకు[a] రాసిన ఉత్తరాలను కూడా తీసుకొని, అక్కడ ఉన్నవారిని కూడా బంధించబడిన వారిగా యెరూషలేముకు తీసుకురావడానికి దమస్కుకు వెళ్తున్నాను, వారు శిక్షించబడేందుకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సోదర సోదరీమణులకు.’ గ్రీకులో ‘సోదరులు’ అని ఉంది; కొన్ని సందర్భాల్లో ఈ పదం విస్తృతమైన సమూహాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς καὶ
  choice: ఇందుకు … కూడా
  rationale: పౌలు ముందుగా చెప్పిన విషయానికి ప్రధాన యాజకుని, పెద్దల సభను ధ్రువీకరణగా చూపుతున్న భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁ ἀρχιερεὺς
  choice: ప్రధాన యాజకుడు
  rationale: ఆ కాలపు అత్యున్నత యాజక అధికారికి ప్రామాణికమైన, స్పష్టమైన తెలుగు పదబంధం.
- source_word: μαρτυρεῖ μοι
  choice: నా పక్షంగా సాక్ష్యం చెప్పగలరు
  rationale: ముందు చెప్పిన వాదనను వారు ధ్రువీకరించగలరనే సందర్భార్థాన్ని సహజంగా తెలుపుతుంది.
- source_word: πᾶν τὸ πρεσβυτέριον
  choice: పెద్దల సభ అంతా
  rationale: ఇది కేవలం వృద్ధులను కాక, పెద్దలతో కూడిన అధికారిక సభను సూచిస్తుంది.
- source_word: παρ’ ὧν
  choice: వారి దగ్గర నుంచి
  rationale: ప్రధాన యాజకుడు, పెద్దల సభ అనే సమూహాన్ని తిరిగి సూచించే సహజమైన తెలుగు రూపం.
- source_word: ἐπιστολὰς
  choice: ఉత్తరాలు
  rationale: మూలపదపు సాధారణ అర్థాన్ని నిలుపుతుంది; అవి అధికారిక అనుమతి పత్రాలని సందర్భమే తెలియజేస్తుంది.
- source_word: πρὸς τοὺς ἀδελφοὺς
  choice: సోదరులకు
  rationale: గ్రీకు పురుష బహువచన సమూహపదాన్ని నేరుగా అనువదిస్తుంది; విస్తృత సమూహార్థం ఉండగలదనే అవకాశాన్ని పాదసూచికలో ఉంచింది.
- source_word: εἰς Δαμασκὸν ἐπορευόμην
  choice: దమస్కుకు వెళ్తూ ఉన్నాను
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న ప్రయాణ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἄξων
  choice: తీసుకువచ్చి
  rationale: గమన క్రియతో వచ్చిన భవిష్యత్ కృదంతంలోని ఉద్దేశ భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τοὺς ἐκεῖσε ὄντας
  choice: అక్కడ ఉన్నవారిని
  rationale: దమస్కులో ఉన్న వ్యక్తులను సూచించే మూలంలోని నామీకృత కృదంత పదబంధాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: δεδεμένους
  choice: బంధితులుగా
  rationale: వారిని నిర్బంధిత స్థితిలో తీసుకురావాలనే పరిపూర్ణ కర్మణి కృదంత భావాన్ని నిలుపుతుంది; సంకెళ్లు అనే అదనపు వివరాన్ని చేర్చదు.
- source_word: ἵνα τιμωρηθῶσιν
  choice: వారు శిక్షించబడేలా
  rationale: కర్మణి రూపాన్ని, శిక్ష విధించాలనే ఉద్దేశాన్ని నిలుపుతూ శిక్ష రకాన్ని నిర్దిష్టం చేయదు.
theological_decisions:
- issue: ἀδελφοί అనే పదం పురుషులను మాత్రమేనా లేక విస్తృత సమాజాన్నా సూచిస్తుంది
  choice: సోదరులకు
  alternative: సోదర సోదరీమణులకు; తోటి యూదులకు
  rationale: మూలంలోని పురుష బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భానుసారంగా విస్తృత సమాజాన్ని సూచించే అవకాశాన్ని పాదసూచికలో తెలియజేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. న్యాయపరమైన సందర్భాన్ని స్పష్టంగా ఉంచుతూ మూలంలో లేని శిక్షా విధానాన్ని లేదా సంకెళ్ల వివరాన్ని చేర్చలేదు.
