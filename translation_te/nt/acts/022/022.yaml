id: ACT.22.22
reference: Acts 22:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἤκουον δὲ αὐτοῦ ἄχρι τούτου τοῦ λόγου καὶ ἐπῆραν τὴν φωνὴν αὐτῶν λέγοντες· Αἶρε ἀπὸ τῆς γῆς τὸν τοιοῦτον, οὐ γὰρ καθῆκεν αὐτὸν ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/022.yaml
  text: They were listening to him up to this statement, and they raised their voices, saying, “Take such a man away from the earth, for it was not fitting for him to live.”
translation:
  language: te
  text: వారు ఈ మాట వరకు అతని మాట వింటూ ఉన్నారు. అప్పుడు తమ స్వరాలు ఎత్తి, “ఇలాంటివాణ్ణి భూమిమీద నుండి తొలగించండి[a]; ఇతడు బ్రతకడం తగదు[b]!” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత నుడికారంగా, “ఇలాంటివాడు భూమిమీద ఉండకూడదు.”
    reason: lexical_alternative
  - marker: b
    text: అంటే, వారు అతని మరణాన్ని కోరుతున్నారు. లేదా, “ఇతడు బ్రతకకూడదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: వింటూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ గతంలో కొనసాగుతున్న వినడాన్ని సూచిస్తుంది.
- source_word: ἄχρι τούτου τοῦ λόγου
  choice: ఈ మాట వరకు
  rationale: λόγος ఇక్కడ ఒక్క పదాన్ని కాక, పౌలు ప్రసంగంలో జనసమూహం ప్రతిస్పందనకు కారణమైన ఈ నిర్దిష్ట వాక్యాన్ని లేదా అంశాన్ని సూచిస్తుంది; తెలుగు సందర్భంలో ‘ఈ మాట వరకు’ సహజంగా రెండింటినీ మోయగలదు.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: తమ స్వరాలు ఎత్తి
  rationale: బిగ్గరగా కేకలు వేయడాన్ని సూచించే గ్రీకు నుడికారంలోని రూపకాన్ని తెలుగులో నిలుపుతుంది.
- source_word: Αἶρε ... τὸν τοιοῦτον
  choice: ఇలాంటివాణ్ణి ... తొలగించండి
  rationale: శత్రుత్వంతో పలికిన ఆజ్ఞలో αἴρω అంటే తొలగించడం; τὸν τοιοῦτον లోని తిరస్కార భావాన్ని ‘ఇలాంటివాణ్ణి’ తెలియజేస్తుంది.
- source_word: ἀπὸ τῆς γῆς
  choice: భూమిమీద నుండి
  rationale: γῆ కి ‘భూమి’ లేదా ‘దేశం’ అనే అర్థాలు ఉండవచ్చు; ఇక్కడ అతణ్ణి సజీవుల మధ్యనుండి తొలగించాలనే మరణదండన డిమాండును ‘భూమిమీద నుండి’ వ్యక్తం చేస్తుంది.
- source_word: οὐ γὰρ καθῆκεν αὐτὸν ζῆν
  choice: ఇతడు బ్రతకడం తగదు
  rationale: καθῆκεν లోని ‘తగినది, సముచితమైనది’ అనే భావాన్ని దగ్గరగా నిలుపుతూ, జనసమూహపు మరణ డిమాండును సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: జనసమూహపు మాట మరణాన్ని నేరుగా ఆజ్ఞాపిస్తుందా, లేక అతడు జీవించడం తగదని ప్రకటిస్తుందా
  choice: ఇతడు బ్రతకడం తగదు
  alternative: ఇతడు బ్రతకకూడదు
  rationale: మూలంలోని καθῆκεν ‘తగడం/సముచితంగా ఉండడం’ అనే భావాన్ని కాపాడుతుంది; సందర్భంలో అది అతని మరణాన్ని కోరుతున్నదనే ఉద్దేశం స్పష్టమే అయినా, అనువాదంలో ఆ భావాన్ని మరింత నేరుగా చేసి మూలంలోని వ్యక్తీకరణను మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని వాడాం. జనసమూహపు తిరస్కారం స్పష్టంగా ఉండేలా ‘ఇలాంటివాణ్ణి’ ఎంచుకున్నాం; అయితే అతిగా మాండలికంగా లేదా అవమానకరంగా వినిపించే పదాలను నివారించాం.
