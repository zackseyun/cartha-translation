  text: κἀγὼ εἶπον· Κύριε, αὐτοὶ ἐπίστανται ὅτι ἐγὼ ἤμην φυλακίζων καὶ δέρων κατὰ τὰς συναγωγὰς τοὺς πιστεύοντας ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/019.yaml
  text: And I said[a], ‘Lord[b], they themselves know that in every synagogue I was imprisoning and beating those who believe in you.’
translation:
  language: te
  text: 'నేను అన్నాను: “ప్రభువా, నీపై విశ్వాసం ఉంచేవారిని నేను ప్రతి సమాజమందిరంలో చెరసాలలో వేస్తూ కొడుతూ ఉండేవాడినని వారికే తెలుసు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమాజమందిరం నుండి సమాజమందిరానికి.” గ్రీకు పదబంధం అనేక సమాజమందిరాలలో పునరావృతంగా జరిగిన చర్యను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ εἶπον
  choice: అప్పుడు నేను ఇలా అన్నాను
  rationale: καὶ ἐγώలోని అనుసంధానాన్ని సందర్భానుసారంగా ‘అప్పుడు నేను’ అని సహజమైన తెలుగులో వ్యక్తపరచి, εἶπονను ‘ఇలా అన్నాను’గా అనువదించాం.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: యేసును ఉద్దేశించిన సంబోధనలో κύριος యొక్క గౌరవార్థక, క్రీస్తుసంబంధ బరువును ‘ప్రభువా’ నిలుపుతుంది.
- source_word: αὐτοὶ ἐπίστανται
  choice: వారికే తెలుసు
  rationale: αὐτοίలోని ఉద్ఘాటనను తెలుగు సహజ వాక్యనిర్మాణంలో ‘వారికే’ ద్వారా నిలిపాం.
- source_word: ἤμην φυλακίζων καὶ δέρων
  choice: చెరసాలలో వేస్తూ కొడుతూ ఉండేవాడిని
  rationale: περιφραστική imperfect తెలిపే కొనసాగిన లేదా అలవాటైన గత చర్యను ‘వేస్తూ కొడుతూ ఉండేవాడిని’ స్పష్టంగా తెలియజేస్తుంది; δέρωνను న్యాయపరమైన కొరడాదెబ్బలుగా అతిగా నిర్దిష్టం చేయలేదు.
- source_word: κατὰ τὰς συναγωγάς
  choice: సమాజమందిరం సమాజమందిరానికి వెళ్లి
  rationale: κατά + బహువచన accusativeలోని విభజనాత్మక భావాన్ని—అనేక సమాజమందిరాలలో పునరావృత చర్యను—సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: τοὺς πιστεύοντας ἐπὶ σέ
  choice: నీపై విశ్వాసముంచేవారిని
  rationale: πιστεύω ἐπίలోని యేసువైపు మళ్లిన విశ్వాసం/నమ్మకాన్ని ‘నీపై విశ్వాసముంచేవారు’ సహజంగా, తాత్త్వికంగా అతిగా వివరించకుండా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: యేసును ఉద్దేశించిన κύριος సంబోధన
  choice: ప్రభువా
  alternative: స్వామీ
  rationale: ‘ప్రభువా’ గౌరవాన్ని, అపొస్తలుల కార్యాలలోని క్రీస్తుసంబంధ భావబరువును నిలుపుతుంది; పాఠ్యం చెప్పేదానికన్నా అదనపు సిద్ధాంతాన్ని చేర్చదు.
- issue: పౌలు గత హింసాచర్య యొక్క కాలాంశం
  choice: చెరసాలలో వేస్తూ కొడుతూ ఉండేవాడిని
  alternative: చెరసాలలో వేసి కొట్టేవాడిని
  rationale: ἤμην + participles నిర్మాణంలోని కొనసాగిన/అలవాటైన గత చర్యను ఎంపిక చేసిన రూపం మరింత స్పష్టంగా కాపాడుతుంది.
- issue: πιστεύοντας ἐπὶ σέలో విశ్వాసం మరియు నమ్మకం మధ్య భావవ్యాప్తి
  choice: నీపై విశ్వాసముంచేవారు
  alternative: నిన్ను నమ్మేవారు
  rationale: ఎంపిక చేసిన పదబంధం మతసంబంధ సందర్భంలో సహజంగా ఉండి, యేసుపై ఆధారపడే నమ్మక భావాన్నీ పూర్తిగా నిరాకరించదు; ప్రత్యామ్నాయం మరింత సాధారణ భాష.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘సమాజమందిరం’ యూదుల synagogueను సూచిస్తుంది. ప్రధాన పాఠ్యంలో ఉన్న ఏకైక పాదసూచిక గుర్తు [a] పాదసూచికతో సరిపోలింది.
