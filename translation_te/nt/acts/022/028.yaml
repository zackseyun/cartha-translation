translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి వాడబడింది. రోమా సైనిక హోదాకు చారిత్రక ఖచ్చితత్వం కోసం ‘సహస్రాధిపతి’ ఉంచి వివరణను పాదసూచికలో ఇచ్చాం. పౌలు సమాధానంలోని సంక్షిప్తతను, కొనుగోలు ద్వారా పొందిన హోదా మరియు పుట్టుకతో వచ్చిన హోదా మధ్య వ్యత్యాసాన్ని నిలుపుకున్నాం.
