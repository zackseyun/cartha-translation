id: ACT.22.28
reference: Acts 22:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀δὲ ὁ χιλίαρχος· Ἐγὼ πολλοῦ κεφαλαίου τὴν πολιτείαν ταύτην ἐκτησάμην. ὁ δὲ Παῦλος ἔφη· Ἐγὼ δὲ καὶ γεγέννημαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/028.yaml
  text: But the tribune answered[a], “I acquired this citizenship for a large sum.” But Paul said[b], “But I was even born with it.”
translation:
  language: te
  text: అయితే సహస్రాధిపతి[a], “నేను చాలా పెద్ద మొత్తం చెల్లించి ఈ పౌరసత్వాన్ని సంపాదించుకున్నాను” అని జవాబిచ్చాడు. అయితే పౌలు, “నేనైతే పుట్టుకతోనే పౌరుణ్ణి[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సైన్యాధిపతి.” గ్రీకు పదం సుమారు వెయ్యిమంది సైనికులకు అధిపతిగా ఉన్న రోమా అధికారిని సూచిస్తుంది.
    reason: historical_term
  - marker: b
    text: అక్షరార్థంగా, “నేనైతే పుట్టాను కూడా”; పౌరసత్వం సందర్భం నుంచి అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: సహస్రాధిపతి
  rationale: రోమా సైన్యంలో సుమారు వెయ్యిమంది సైనికులకు అధిపతిగా ఉన్న అధికారిని సూచించే చారిత్రక పదం; సాధారణ ‘సేనాధిపతి’ కంటే మూలంలోని హోదాను స్పష్టంగా నిలుపుతుంది.
- source_word: πολλοῦ κεφαλαίου
  choice: చాలా పెద్ద మొత్తం చెల్లించి
  rationale: ఈ షష్ఠీవిభక్తి పదబంధం పెద్ద మొత్తంలో ధనం వెచ్చించడాన్ని సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు ‘చెల్లించి’ అని వ్యక్తం చేయబడింది; ప్రత్యామ్నాయ అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: πολιτείαν
  choice: పౌరసత్వాన్ని
  rationale: ఇక్కడ రాజకీయ జీవనాన్ని కాక, రోమా పౌరుని చట్టబద్ధ హోదాను సూచిస్తుంది.
- source_word: ἐκτησάμην
  choice: సంపాదించుకున్నాను
  rationale: మధ్యమ ప్రయోగంలోని ‘తనకోసం పొందడం/సంపాదించుకోవడం’ అనే భావాన్ని నిలుపుతుంది; ‘కొన్నాను’ అని అనువదిస్తే మూలం కంటే మరింత నిర్దిష్టమవుతుంది.
- source_word: καὶ γεγέννημαι
  choice: పుట్టుకతోనే పౌరుణ్ణి
  rationale: పరిపూర్ణ కర్మణి రూపం జన్మవల్ల ఆ హోదా కలిగినదనే భావాన్ని ఇస్తుంది; సందర్భంలో సూచితమైన పౌరసత్వాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తూ καί లోని బలాన్ని ‘నే’తో చూపుతుంది.
- source_word: δέ
  choice: అప్పుడు / అందుకు / నేనైతే
  rationale: సంభాషణ కొనసాగింపును, పౌలు మాటలోని వ్యత్యాసాన్ని తెలుగులో పదేపదే ‘కాని’ అనకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔφη
  choice: అన్నాడు
  rationale: అదనపు వాక్చాతుర్య బలం చేర్చకుండా సాధారణంగా మాట పలకడాన్ని సూచిస్తుంది.
