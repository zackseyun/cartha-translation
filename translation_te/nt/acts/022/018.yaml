id: ACT.22.18
reference: Acts 22:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδεῖν αὐτὸν λέγοντά μοι· Σπεῦσον καὶ ἔξελθε ἐν τάχει ἐξ Ἰερουσαλήμ, διότι οὐ παραδέξονταί ⸀σου μαρτυρίαν περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/018.yaml
  text: and I saw him saying to me[a], ‘Hurry and get out of Jerusalem quickly, because they will not accept your testimony about me.’
translation:
  language: te
  text: 'నేను ఆయనను చూశాను; ఆయన నాతో ఇలా అన్నాడు: “త్వరపడు! వెంటనే యెరూషలేము నుండి బయటికి వెళ్లిపో. ఎందుకంటే నా గురించి నీ సాక్ష్యాన్ని వారు అంగీకరించరు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్వీకరించరు.”
    reason: παραδέχομαι అనే పదానికి ఇక్కడ ‘అంగీకరించు’ లేదా ‘స్వీకరించు’ అనే సమీపార్థాలు సాధ్యమైనందున పదార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: ἰδεῖν αὐτὸν
  choice: నేను ఆయనను చూశాను
  rationale: ἰδεῖν రూపరీత్యా క్రియావిశేష రూపమైనప్పటికీ, దర్శనాన్ని వివరిస్తున్న ఈ కథన నిర్మాణంలో తెలుగులో సమాపక క్రియగా అనువదించడం సహజంగా ఉంటుంది. αὐτόν‌ను సందర్భం వివరించినట్లే ‘ఆయనను’గా ఉంచి, ‘ప్రభువును’ లేదా ‘యేసును’ అని స్పష్టీకరించలేదు.
- source_word: λέγοντά μοι
  choice: ఆయన నాతో ఇలా అన్నాడు
  rationale: మూలంలోని ‘నాతో చెబుతూ’ అనే భాగాన్ని ప్రత్యక్ష సంభాషణకు సహజమైన ఆధునిక తెలుగు నిర్మాణంగా ఇచ్చింది.
- source_word: Σπεῦσον
  choice: త్వరపడు!
  rationale: ఏకవచన ఆజ్ఞారూపంలోని తీవ్ర ఆవశ్యకతను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἔξελθε ἐν τάχει
  choice: వెంటనే ... బయటికి వెళ్లిపో
  rationale: ἔξελθεలోని బయటికి కదలికను, ἐν τάχειలోని తక్షణత్వాన్ని రెండింటినీ నిలుపుతుంది. ముందు ఉన్న ‘త్వరపడు’తో కలిసి గ్రీకులోని ద్విగుణ అత్యవసరతను ప్రతిబింబిస్తుంది.
- source_word: ἐξ Ἰερουσαλήμ
  choice: యెరూషలేము నుండి బయటికి
  rationale: ἐξ సూచించే నగరం లోపలి నుండి బయటికి వెళ్లే దిశను స్పష్టంగా తెలియజేస్తుంది.
- source_word: διότι
  choice: ఎందుకంటే
  rationale: ముందటి ఆజ్ఞకు కారణాన్ని తెలిపే ఆధునిక తెలుగు అనుసంధానం.
- source_word: οὐ παραδέξονταί
  choice: వారు అంగీకరించరు
  rationale: παραδέχομαι ఇక్కడ సాక్ష్యాన్ని అనుకూలంగా అంగీకరించడం లేదా స్వీకరించడం అనే అర్థం ఇస్తుంది. ‘అంగీకరించరు’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: σου μαρτυρίαν περὶ ἐμοῦ
  choice: నా గురించి నీవిచ్చే సాక్ష్యాన్ని
  rationale: σουలోని ద్వితీయ పురుష సంబంధాన్ని ‘నీవిచ్చే’ ద్వారా సహజ తెలుగులో వ్యక్తం చేసి, περὶ ἐμοῦను ‘నా గురించి’గా నిలిపింది. μαρτυρίαలోని సాక్ష్యార్థాన్ని ‘సాక్ష్యం’గా అనువదించింది.
theological_decisions:
- issue: దర్శనంలో ‘ఆయన’ అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: మూలంలో ఉన్నట్లే ‘ఆయనను’ అని ఉంచడం
  alternative: ‘ప్రభువును’ లేదా ‘యేసును’ అని ప్రధాన పాఠ్యంలో స్పష్టంగా చేర్చడం
  rationale: ముందటి సందర్భం మాట్లాడుతున్న వ్యక్తిని ప్రభువు/యేసుగా గుర్తిస్తుంది; అయితే ఈ వచనం సర్వనామాన్నే వాడుతుంది. మూలంలో లేని బిరుదు లేదా పేరును చేర్చి వ్యాఖ్యానాన్ని పాఠ్యంలో కలపకుండా సర్వనామాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ‘త్వరపడు! వెంటనే’ అనే పదబంధం పునరుక్తిలా తొలగించకుండా గ్రీకు పాఠ్యంలోని బలమైన ద్విగుణ అత్యవసరతను నిలిపింది.
