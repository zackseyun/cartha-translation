revisions:
- from: 'అప్పుడు నేను ఆయనను చూశాను. ఆయన నాతో ఇలా అన్నాడు: “త్వరపడు! వెంటనే యెరూషలేము నుండి బయటికి వెళ్లిపో. ఎందుకంటే నా గురించి నీవిచ్చే సాక్ష్యాన్ని వారు అంగీకరించరు[a].”'
  to: 'నేను ఆయనను చూశాను; ఆయన నాతో ఇలా అన్నాడు: “త్వరపడు! వెంటనే యెరూషలేము నుండి బయటికి వెళ్లిపో. ఎందుకంటే నా గురించి నీ సాక్ష్యాన్ని వారు అంగీకరించరు[a].”'
  rationale: The revision removes an added temporal nuance and renders the possessive ‘your testimony’ directly. It otherwise retains the draft’s accurate rendering of the vision, the pronoun’s contextual ambiguity, the force of departure ‘out of Jerusalem,’ and the emphatic urgency ‘త్వరపడు! వెంటనే.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:07:35Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the vision, the speaker’s command, the urgent departure from Jerusalem, and the refusal to accept testimony concerning him. However, ‘అప్పుడు’ adds a temporal transition where the Greek has simple καί (‘and’), and ‘నీవిచ్చే’ makes explicit an act of giving that is not stated in the possessive phrase σου μαρτυρίαν (‘your testimony’).
  naturalness: The Telugu is clear, modern, and appropriately reverential. The revised wording is slightly leaner and more idiomatic while preserving the twofold urgency of Σπεῦσον and ἐν τάχει.
  terminology: ‘ఆయనను,’ ‘సాక్ష్యం,’ and ‘అంగీకరించరు’ are suitable. Retaining the pronoun avoids importing ‘Lord’ or ‘Jesus’ into this verse. The lexical-alternative footnote remains appropriately anchored to ‘అంగీకరించరు.’
  issues:
  - severity: low
    issue: ‘అప్పుడు’ for καί
    rationale: The source uses simple connective καί, not an explicit temporal adverb. Although narratively possible in Telugu, omitting ‘అప్పుడు’ more closely preserves the source relation.
  - severity: low
    issue: ‘నీవిచ్చే సాక్ష్యాన్ని’ for σου μαρτυρίαν
    rationale: The Greek says ‘your testimony about me’ and does not explicitly include a verb ‘give.’ ‘నీ సాక్ష్యాన్ని’ preserves the possessive construction without adding that nuance.
  revised_text: 'నేను ఆయనను చూశాను; ఆయన నాతో ఇలా అన్నాడు: “త్వరపడు! వెంటనే యెరూషలేము నుండి బయటికి వెళ్లిపో. ఎందుకంటే నా గురించి నీ సాక్ష్యాన్ని వారు అంగీకరించరు[a].”'
  revised_footnotes:
