  source_fidelity: 'ప్రధాన అనువాదం గ్రీకు మూలానికి విశ్వసనీయంగా ఉంది: ‘నాతో ఉన్నవారు,’ ‘వెలుగు,’ ‘చూశారు,’ ‘స్వరం,’ మరియు ‘వినలేదు’ అన్న ఎంపికలు వరుసగా οἱ σὺν ἐμοὶ ὄντες, φῶς, ἐθεάσαντο, φωνή, οὐκ ἤκουσαν పదాలను సముచితంగా ప్రతిబింబిస్తున్నాయి. ‘నాతో మాట్లాడుతున్న వ్యక్తి’ వర్తమాన కృదంతమైన λαλοῦντος భావాన్ని కాపాడుతుంది. అయితే పాదటిప్పణి వినకపోవడం/అర్థం చేసుకోకపోవడం అనే భాగానికి సంబంధించినది కనుక దాని గుర్తును ‘వెలుగును చూశారు’ వద్ద కాక, ‘వినలేదు’ వద్ద ఉంచాలి.'
