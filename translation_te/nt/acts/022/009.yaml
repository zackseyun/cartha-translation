id: ACT.22.9
reference: Acts 22:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ σὺν ἐμοὶ ὄντες τὸ μὲν φῶς ⸀ἐθεάσαντο τὴν δὲ φωνὴν οὐκ ἤκουσαν τοῦ λαλοῦντός μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/009.yaml
  text: Those who were with me saw the light[a], but they did not hear the voice of the one speaking to me.
translation:
  language: te
  text: నాతో ఉన్నవారు ఆ వెలుగును చూశారు; అయితే నాతో మాట్లాడుతున్న వ్యక్తి స్వరాన్ని వినలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు ఆ స్వరాన్ని అర్థం చేసుకోలేదు.” అపొస్తలుల కార్యాలు 9:7లో పౌలు వెంట ఉన్నవారు శబ్దాన్ని లేదా స్వరాన్ని విన్నారని ఉంది. వారు శబ్దాన్ని విన్నప్పటికీ, మాట్లాడుతున్న వ్యక్తి మాటలను అర్థం చేసుకోలేదని ఈ వ్యత్యాసం సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ σὺν ἐμοὶ ὄντες
  choice: నాతో ఉన్నవారు
  rationale: లింగాన్ని అనవసరంగా చేర్చకుండా, ఆర్టికల్‌తో కూడిన కృదంత నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τὸ μὲν φῶς
  choice: ఆ వెలుగును
  rationale: φῶς యొక్క ప్రత్యక్ష అర్థం ‘వెలుగు’. μέν ... δέ సూచించే వ్యత్యాసాన్ని ‘అయితే’ ద్వారా తెలిపాం; ఈ వచనంలో లేని ‘ప్రకాశవంతమైన’ అనే విశేషణాన్ని చేర్చలేదు.
- source_word: ἐθεάσαντο
  choice: చూశారు
  rationale: θεάομαι ఇక్కడ చూడడం లేదా గమనించడం అనే సాధారణ భావాన్ని ఇస్తుంది; ‘చూశారు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: τὴν δὲ φωνὴν
  choice: స్వరాన్ని
  rationale: φωνήకు ‘స్వరం’ లేదా ‘శబ్దం’ అనే అర్థాలు ఉండవచ్చు. ‘నాతో మాట్లాడుతున్న వ్యక్తి’ అనే వివరణ వ్యక్తిగత వక్తను సూచిస్తున్నందున ‘స్వరం’ అనేది తగిన ఎంపిక.
- source_word: οὐκ ἤκουσαν
  choice: వారు వినలేదు
  rationale: ἀκούω యొక్క ప్రత్యక్ష, సాధారణ అర్థమైన ‘వినడం’ను ప్రధాన పాఠంలో నిలిపాం. ‘అర్థం చేసుకోలేదు’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: τοῦ λαλοῦντός μοι
  choice: నాతో మాట్లాడుతున్న వ్యక్తి
  rationale: వర్తమాన కృదంతమైన λαλοῦντος సూచించే కొనసాగుతున్న చర్యను ‘మాట్లాడుతున్న’ అని నిలిపాం. ‘వ్యక్తి’ అనడం లింగాన్ని గ్రీకు పాఠం కంటే ఎక్కువగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: పౌలు వెంట ఉన్నవారు స్వరాన్ని విన్నారా అనే విషయంలో అపొస్తలుల కార్యాలు 9:7తో కనిపించే ఉద్రిక్తత
  choice: ప్రధాన పాఠంలో ‘స్వరాన్ని వారు వినలేదు’ అని ప్రత్యక్షంగా అనువదించడం
  alternative: ‘స్వరాన్ని వారు అర్థం చేసుకోలేదు’ లేదా ‘మాటల భావం వారికి వినిపించలేదు’
  rationale: ఈ వచనంలోని గ్రీకు సహజంగా ‘మాట్లాడుతున్న వ్యక్తి స్వరాన్ని వినలేదు’ అని చెబుతుంది. అయితే ἀκούω మరియు φωνή పదాల భావపరిధి కారణంగా శబ్దం వినిపించినా వక్త మాటలు అర్థం కాలేదనే అవకాశం ఉంది. ఆ అవకాశాన్ని ప్రధాన పాఠంలో బలవంతంగా చేర్చకుండా పాదటిప్పణిలో పేర్కొని, సమాంతర వృత్తాంతంతో ఉన్న ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని μέν ... δέ వ్యత్యాసాన్ని సెమికోలన్ మరియు ‘అయితే’తో వ్యక్తపరిచాం. పాదటిప్పణి గుర్తు సంబంధిత వాక్యాంతంలో ఉంచాం.
