id: ACT.22.4
reference: Acts 22:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς ταύτην τὴν ὁδὸν ἐδίωξα ἄχρι θανάτου, δεσμεύων καὶ παραδιδοὺς εἰς φυλακὰς ἄνδρας τε καὶ γυναῖκας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/004.yaml
  text: I persecuted this Way to the death[a], binding and delivering both men and women into prisons[b],
translation:
  language: te
  text: పురుషులనూ స్త్రీలనూ బంధించి చెరసాలలకు అప్పగిస్తూ, నేను ఈ మార్గాన్ని[a] మరణం వరకూ[b] హింసించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఈ బాట’ అని కూడా అనువదించవచ్చు. గ్రీకులో అక్షరార్థంగా ‘ఈ మార్గం’; అపొస్తలుల కార్యములలో ఇది తరచుగా క్రైస్తవ విశ్వాసాన్ని, దానిని అనుసరించే సమూహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘మరణం దాకా.’ ఈ మాట హింస ప్రాణాంతక స్థాయి వరకు వెళ్లిన తీవ్రతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην τὴν ὁδὸν
  choice: ఈ మార్గాన్ని
  rationale: ὁδός అనే పదానికి అక్షరార్థంగా ‘మార్గం’ అని అర్థం; అపొస్తలుల కార్యములలో ఇది క్రైస్తవ విశ్వాసాన్ని, దానిని అనుసరించే సమూహాన్ని సూచించే గుర్తింపు పేరుగా కూడా వాడబడింది. ‘ఈ మార్గం’ ఆ రెండు కోణాలనూ నిలుపుతుంది.
- source_word: ἐδίωξα
  choice: హింసించాను
  rationale: ఈ సందర్భంలో διώκω తటస్థంగా వెంబడించడం కాదు; విశ్వాసులను శత్రుత్వంతో పట్టుకొని బాధించడం. అందువల్ల ‘హింసించాను’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἄχρι θανάτου
  choice: మరణం వరకూ
  rationale: ఈ పదబంధం హింస మరణం దాకా వెళ్లిన తీవ్రతను తెలియజేస్తుంది; పౌలు స్వయంగా ప్రతి మరణాన్నీ కలిగించాడని అదనంగా నిర్ధారించదు.
- source_word: δεσμεύων
  choice: బంధించి
  rationale: δεσμεύω యొక్క ప్రత్యక్ష భావమైన కట్టివేయడం లేదా బంధించడం అనే చిత్రాన్ని నిలుపుతుంది; కేవలం ‘అరెస్టు చేసి’ అనే వ్యాఖ్యానాత్మక పదానికి పరిమితం చేయదు.
- source_word: παραδιδοὺς
  choice: అప్పగిస్తూ
  rationale: ఇక్కడ ఈ పదం వ్యక్తులను అధికార నిర్బంధానికి అప్పగించడాన్ని సూచిస్తుంది. ‘అప్పగిస్తూ’ న్యాయపరమైన, నిర్బంధ సంబంధమైన భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: εἰς φυλακὰς
  choice: చెరసాలలకు
  rationale: εἰς సూచించే గమనాన్ని, φυλακάς లోని బహువచనాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: పురుషులనూ స్త్రీలనూ
  rationale: τε καὶ నిర్మాణం హింస పురుషులకే కాక స్త్రీలకు కూడా విస్తరించిందని నొక్కి చెబుతుంది; తెలుగులోని ‘నూ…నూ’ ఆ సమగ్రతను సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ἡ ὁδόςను సాధారణ నామవాచకంగా అనువదించాలా, క్రైస్తవ ఉద్యమానికి గుర్తింపు పేరుగా చూపాలా
  choice: ‘ఈ మార్గం’ అని అనువదించి, దాని ప్రత్యేక సూచనను పాదటిప్పణిలో వివరించడం
  alternative: ‘ఈ మత ఉద్యమం’ లేదా ‘ఈ విశ్వాస మార్గం’
  rationale: అపొస్తలుల కార్యములలో ‘మార్గం’ క్రైస్తవ విశ్వాసం/సమాజానికి గుర్తింపు పదంగా పనిచేస్తుంది. అయితే మూలంలోని రూపకాన్ని తొలగించి మరింత స్పష్టీకరించడం కంటే ‘మార్గం’ అనే పదమే అక్షరార్థాన్ని, ప్రత్యేక సూచనను రెండింటినీ కాపాడుతుంది.
- issue: ἄχρι θανάτου పౌలు చర్యల ఫలితాన్ని సూచిస్తుందా లేక హింస తీవ్రతను సూచిస్తుందా
  choice: ‘మరణం వరకూ’ అని అనువదించి అస్పష్టతను నిలుపడం
  alternative: ‘చంపేంతగా’ లేదా ‘వారిని చంపిస్తూ’
  rationale: మూలపదబంధం ప్రాణాంతక స్థాయి వరకు సాగిన హింసను సూచిస్తుంది; పౌలు స్వయంగా చంపాడనే విధంగా క్రియను మరింత నిర్దిష్టం చేయడం మూలంలో ఉన్నదానికంటే ఎక్కువగా చెప్పడం అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరమైనప్పటికీ సహజమైన వాక్యనిర్మాణం వాడబడింది. గ్రీకు వాక్యంలోని ప్రధాన ప్రకటనకు ముందు బంధించడం, చెరసాలలకు అప్పగించడం అనే చర్యలను ఉంచడం తెలుగులో ప్రవాహవంతంగా ఉండి మూలంలోని భావసంబంధాన్ని నిలుపుతుంది.
