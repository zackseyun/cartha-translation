  text: Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατέ μου τῆς πρὸς ὑμᾶς νυνὶ ἀπολογίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/001.yaml
  text: Men[a], brothers and fathers, hear now my defense to you.
translation:
  language: te
  text: “పురుషులారా, సోదరులారా, తండ్రులారా, నేను ఇప్పుడు మీకు చేయబోయే నా సమర్థనను వినండి.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοὶ
  choice: సోదరులారా
  rationale: గ్రీకులో ἄνδρες అనే సంబోధన ἀδελφοίతో కలిసి పురుష శ్రోతలను గౌరవంగా ఉద్దేశిస్తుంది. తెలుగులో ‘పురుషులారా, సోదరులారా’ అనడం అనవసర పునరుక్తిగా, అసహజంగా ఉంటుంది; ‘సోదరులారా’ సహజంగా సంబోధన భావాన్ని అందిస్తుంది.
- source_word: πατέρες
  choice: పెద్దలారా
  rationale: ఇక్కడ పదశః ‘తండ్రులారా’ కంటే, వయస్సు లేదా గౌరవస్థానంలో పెద్దవారిని ఉద్దేశించే భావాన్ని ‘పెద్దలారా’ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; దీన్ని అధికారిక ‘మూక పెద్దలు’గా పరిమితం చేయదు.
- source_word: ἀκούσατέ
  choice: వినండి
  rationale: రెండవ పురుష బహువచన ఆజ్ఞార్థక రూపాన్ని గౌరవప్రదమైన, సహజమైన తెలుగు ఆజ్ఞగా అనువదిస్తుంది.
- source_word: μου ... ἀπολογίας
  choice: నేను ... చెప్పే సమర్థనను
  rationale: ἀπολογία పశ్చాత్తాపార్థక ‘క్షమాపణ’ కాదు; ఆరోపణలకు ఇచ్చే సమర్థన లేదా ప్రతివాదం. μουను సహజమైన తెలుగు సంబంధవాక్య నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: πρὸς ὑμᾶς
  choice: మీ ఎదుట చెప్పే
  rationale: సమర్థన శ్రోతల వైపు ఉద్దేశించబడిందనే భావాన్ని, బహిరంగ ప్రసంగ సందర్భానికి సరిపోయే సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: νυνὶ
  choice: ఇప్పుడు
  rationale: అభ్యర్థనలోని తక్షణత్వాన్ని నేరుగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహిరంగ సంబోధన. గ్రీకు పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, దాని గౌరవం, తక్షణత్వం, న్యాయవాద భావం నిలిచేలా సహజ తెలుగు వాక్య నిర్మాణం వాడబడింది.
