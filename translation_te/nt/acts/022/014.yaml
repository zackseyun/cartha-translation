id: ACT.22.14
reference: Acts 22:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὁ θεὸς τῶν πατέρων ἡμῶν προεχειρίσατό σε γνῶναι τὸ θέλημα αὐτοῦ καὶ ἰδεῖν τὸν δίκαιον καὶ ἀκοῦσαι φωνὴν ἐκ τοῦ στόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/014.yaml
  text: And he said[a], ‘The God of our fathers has appointed you to know his will, to see the Righteous One[b], and to hear a voice from his mouth,’
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “మన పితరుల దేవుడు తన చిత్తాన్ని నీవు తెలుసుకోవడానికీ, నీతిమంతుణ్ణి[b] చూడడానికీ, ఆ నీతిమంతుని నోటి నుండి ఒక స్వరాన్ని వినడానికీ నిన్ను నియమించాడు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిన్ను ఎంపిక చేసుకున్నాడు.’ గ్రీకు క్రియ ఒక పని కోసం ఎవరినైనా ఎంపిక చేయడం లేదా నియమించడం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘నీతిమంతుడు’ అనేది ఇక్కడ యేసును సూచించే బిరుదు; దీన్ని ‘న్యాయవంతుడు’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: προεχειρίσατό
  choice: నిన్ను నియమించాడు
  rationale: ఈ క్రియ ఒక పని లేదా ఉద్దేశం కోసం ఎవరినైనా ఎంపిక చేసి నియమించడాన్ని సూచిస్తుంది. తరువాత వచ్చే మూడు క్రియార్థక రూపాలతో ‘నియమించాడు’ సహజంగా అనుసంధానమై, కేవలం ముందుగానే నిర్ణయించాడనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: γνῶναι
  choice: తెలుసుకోవడానికి
  rationale: γινώσκω యొక్క భావాన్ని సూటిగా తెలియజేస్తుంది. ‘తెలుసుకుంటూ రావడానికి’ అనే ప్రక్రియాత్మక భావాన్ని సందర్భం స్పష్టంగా కోరనందున దాన్ని చేర్చలేదు.
- source_word: θέλημα
  choice: చిత్తం
  rationale: దేవుని సంకల్పం లేదా ఇష్టాన్ని సూచించే విస్తృత అర్థాన్ని కాపాడే, తెలుగు బైబిలు భాషలో స్థిరపడిన పదం.
- source_word: ἰδεῖν
  choice: చూడడానికి
  rationale: సాధారణమైన, స్పష్టమైన ఆధునిక తెలుగు; మూలంలోని ప్రత్యక్ష దర్శన భావాన్ని అలంకారికత లేకుండా కాపాడుతుంది.
- source_word: τὸν δίκαιον
  choice: నీతిమంతుణ్ణి
  rationale: δίκαιος యొక్క నీతి/న్యాయ భావాన్ని కాపాడుతూ, ఈ సందర్భంలో యేసును సూచించే బిరుదుగా సహజంగా పనిచేస్తుంది.
- source_word: ἀκοῦσαι φωνὴν
  choice: స్వరం వినడానికి
  rationale: φωνή ఇక్కడ నోటి నుండి వినబడే పలుకును సూచిస్తుంది. తెలుగులో ఉపపదాలు లేనందున గ్రీకులోని అనిర్దిష్టతను ‘స్వరం’ సహజంగా కాపాడుతుంది.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: ఆయన నోటి నుండి
  rationale: మూలంలోని స్పష్టమైన శరీరాంగ రూపకాన్ని అలాగే ఉంచి, ఆయన నుండి నేరుగా పలికిన మాటను వినడమనే భావాన్ని తెలియజేస్తుంది.
- source_word: Ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: మన పితరుల దేవుడు
  rationale: ఇశ్రాయేలు ఒడంబడిక వారసత్వాన్ని సూచించే సంప్రదాయబద్ధమైన భావాన్ని, πατέρων లోని పుంలింగ రూపాన్ని కాపాడుతుంది.
- source_word: ὁ δὲ εἶπεν
  choice: అప్పుడు అతడు ఇలా అన్నాడు
  rationale: δὲ యొక్క కథన కొనసాగింపు భావాన్ని తెలుగులో సహజమైన ‘అప్పుడు’తో వ్యక్తం చేసి, ప్రత్యక్ష వాక్యాన్ని ‘ఇలా అన్నాడు’తో పరిచయం చేసింది.
theological_decisions:
- issue: τὸν δίκαιον ను క్రీస్తును సూచించే బిరుదుగా అనువదించాలా, కేవలం వర్ణనాత్మక విశేషణంగా అనువదించాలా
  choice: యేసును సూచించే బిరుదుగా ‘నీతిమంతుడు’
  alternative: ‘న్యాయవంతుడు’ లేదా ప్రత్యేక బిరుదుగా సూచించకుండా ‘నీతిమంతుడైన వాడు’
  rationale: అపొస్తలుల కార్యములలో ఇదే వ్యక్తీకరణ యేసుకు బిరుదుగా ఉపయోగించబడుతుంది (3:14; 7:52). అయినా ప్రధాన పాఠ్యంలో యేసు అనే పేరును చేర్చకుండా మూలంలోని రూపాన్ని కాపాడి, వివరణను పాదసూచికలో ఇచ్చాం.
- issue: πατέρων ను లింగనిరపేక్షంగా ‘పూర్వీకులు’ అని మార్చాలా
  choice: ‘పితరులు’ అని నిలిపివేశాం
  alternative: ‘పూర్వీకులు’
  rationale: గ్రీకు పదం స్పష్టంగా ‘పితరులు’ అని ఉంది; ఇది ఇశ్రాయేలు విశ్వాస వారసత్వానికి సంబంధించిన స్థిరమైన ఒడంబడిక వ్యక్తీకరణ కూడా.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని పాటించాం. ఉద్దేశాన్ని తెలిపే మూడు సమాంతర క్రియారూపాలను ‘తెలుసుకోవడానికీ… చూడడానికీ… వినడానికీ’గా నిలిపి, మూల వాక్య నిర్మాణాన్ని చదవడానికి సులభంగా ఉంచాం. పాదసూచిక [a] దానికి సంబంధించిన ‘నియమించాడు’ తరువాత, [b] బిరుదైన ‘నీతిమంతుణ్ణి’ తరువాత ఉంచబడింది.
