id: ACT.22.20
reference: Acts 22:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὅτε ⸀ἐξεχύννετο τὸ αἷμα Στεφάνου τοῦ μάρτυρός σου, καὶ αὐτὸς ἤμην ἐφεστὼς καὶ συνευδοκῶν ⸀καὶ φυλάσσων τὰ ἱμάτια τῶν ἀναιρούντων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/020.yaml
  text: And when the blood of Stephen your witness was being poured out[a], I myself was standing by and approving, and guarding the cloaks of those who were killing him.
translation:
  language: te
  text: నీ సాక్షి[a] అయిన స్తెఫను రక్తం చిందించబడుతున్నప్పుడు, నేనే అక్కడ నిలబడి, అతన్ని చంపడాన్ని సమ్మతిస్తూ, అతన్ని చంపుతున్నవారి పైవస్త్రాలకు కాపలా కాస్తూ ఉన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హతసాక్షి.’ గ్రీకు పదానికి ‘సాక్షి’ అని అర్థం; క్రైస్తవ వాడుకలో, తాను ఇచ్చిన సాక్ష్యం కారణంగా మరణించిన వ్యక్తిని సూచించడానికి ఇది ప్రత్యేకంగా వాడబడసాగింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεχύννετο
  choice: చిందించబడుతున్నప్పుడు
  rationale: అసంపూర్ణ భూతకాల కర్మణి రూపంలోని కొనసాగుతున్న చర్యను తెలుగులో సహజంగా వ్యక్తం చేస్తూ, రక్తం చిందించబడటం అనే స్పష్టమైన చిత్రాన్ని నిలుపుతుంది.
- source_word: αἷμα
  choice: రక్తం
  rationale: మూలపదానికి నేరమైన, ప్రామాణిక ఆధునిక తెలుగు సమానార్థకం.
- source_word: μάρτυρός
  choice: సాక్షి
  rationale: ఈ గ్రీకు పదపు ప్రాథమిక అర్థం ‘సాక్షి.’ స్తెఫను మరణ సందర్భం వల్ల ‘హతసాక్షి’ అనే భావసంబంధం ఉన్నప్పటికీ, తరువాతి క్రైస్తవ పారిభాషిక అర్థాన్ని ప్రధాన పాఠ్యంలో ముందుగానే చేర్చకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐφεστὼς
  choice: అక్కడ నిలబడి
  rationale: సంఘటన జరుగుతున్న చోట సమీపంగా ఉండి నిలబడటాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: συνευδοκῶν
  choice: దానికి సమ్మతిస్తూ
  rationale: కేవలం అక్కడ ఉండటం కాక, ఆ చర్యకు అంగీకారం తెలపడం అనే క్రియాశీల భావాన్ని నిలుపుతుంది.
- source_word: φυλάσσων
  choice: కాపలా కాస్తూ
  rationale: వస్త్రాలను చూసుకుంటూ కాపాడటం అనే సందర్భోచితమైన స్పష్ట అర్థాన్ని ఇస్తుంది.
- source_word: ἱμάτια
  choice: పైవస్త్రాలు
  rationale: రాళ్లు వేయడానికి ముందు తీసివేసిన బయటి వస్త్రాలను సూచించే సందర్భానికి సరిపోతూ, సాధారణ ‘బట్టలు’ కంటే మూలపదాన్ని మరింత నిర్దిష్టంగా ప్రతిబింబిస్తుంది.
- source_word: ἀναιρούντων
  choice: చంపుతున్నవారి
  rationale: ఇక్కడ ‘ప్రాణం తీయడం’ అనే అర్థాన్ని సహజమైన ఆధునిక తెలుగులో ఇస్తుంది; ‘హత్య చేస్తున్న’ అనడం మూలపదంలో ప్రత్యక్షంగా లేని అదనపు నైతిక తీర్పును చేర్చవచ్చు.
- source_word: αὐτὸς
  choice: నేనే
  rationale: పౌలు తన స్వంత ప్రమేయాన్ని నొక్కిచెప్పే గ్రీకు సర్వనామ బలాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: స్తెఫనును సూచించే μάρτυς పదం అనువాదం
  choice: సాక్షి
  alternative: హతసాక్షి
  rationale: మూల గ్రీకులో ప్రాథమిక లాక్షణిక అర్థం ‘సాక్షి.’ స్తెఫను విశ్వాసం కోసం మరణించినందున ‘హతసాక్షి’ అనే తరువాతి క్రైస్తవ వాడుక సందర్భానికి అన్వయించినా, ఆ పారిభాషిక అర్థాన్ని ప్రధాన పాఠ్యంలో నిర్బంధించకుండా నిజమైన భావసంబంధాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘నేనే’ ద్వారా మూలంలోని ఉద్ఘాటనను, ‘చిందించబడుతున్నప్పుడు’ మరియు ‘కాపలా కాస్తూ ఉన్నాను’ ద్వారా కొనసాగుతున్న చర్యల భావాన్ని నిలిపాం.
