source:
  edition: SBLGNT
  text: Ἐγένετο δέ μοι πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ περὶ μεσημβρίαν ἐξαίφνης ἐκ τοῦ οὐρανοῦ περιαστράψαι φῶς ἱκανὸν περὶ ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/006.yaml
  text: It happened that as I was traveling and drawing near to Damascus[a], about noon, suddenly a bright light from heaven flashed around me,
translation:
  language: te
  text: 'నేను ప్రయాణిస్తూ దమస్కుకు సమీపిస్తున్నప్పుడు, దాదాపు మధ్యాహ్నం వేళ, అకస్మాత్తుగా ఆకాశం నుండి ఒక గొప్ప వెలుగు[a] నా చుట్టూ ప్రకాశించింది.


    [a] లేదా, “తీవ్రమైన వెలుగు.” గ్రీకు పదబంధం వెలుగు పరిమాణాన్ని లేదా దాని తీవ్రతను సూచించవచ్చు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తీవ్రమైన వెలుగు.” గ్రీకు పదబంధం వెలుగు పరిమాణాన్ని లేదా దాని తీవ్రతను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: నేను … ఉన్నప్పుడు … మెరిసింది
  rationale: గ్రీకు ఘటనను పరిచయం చేసే నిర్మాణాన్ని తెలుగులో సహజమైన మొదటి పురుష కాలవాచక వాక్యంగా కలిపాం; μοιలోని మొదటి పురుష దృక్కోణం స్పష్టంగా నిలిచింది.
- source_word: πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ
  choice: ప్రయాణిస్తూ దమస్కుకు సమీపిస్తున్నప్పుడు
  rationale: కొనసాగుతున్న ప్రయాణాన్ని, గమ్యస్థానానికి దగ్గరవుతున్న భావాన్ని వర్తమాన క్రియార్థక నిర్మాణాలతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: περὶ μεσημβρίαν
  choice: మధ్యాహ్నం వేళ
  rationale: సుమారు మధ్యాహ్న సమయాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; περὶ ఇచ్చే కాలసామీప్య భావం ‘వేళ’ అనే సందర్భోచిత రూపంలో నిలుస్తుంది.
- source_word: ἐξαίφνης
  choice: అకస్మాత్తుగా
  rationale: సంఘటన హఠాత్తుగా జరిగినదనే భావాన్ని నేరుగా కాపాడుతుంది.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: ఆకాశం నుండి
  rationale: οὐρανός యొక్క పైలోక/దివ్య మూల భావాన్ని తెలుగులో సాధారణంగా అర్థమయ్యే ‘ఆకాశం’ ద్వారా కాపాడుతుంది; ఇది కేవలం వాతావరణ సంబంధమైన వివరణకు పరిమితం కాదు.
- source_word: περιαστράψαι
  choice: నా చుట్టూ మెరిసింది
  rationale: περί ఉపసర్గ సూచించే చుట్టుముట్టే దిశను, ఆకస్మికంగా ప్రకాశించడాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: φῶς ἱκανὸν
  choice: ప్రకాశవంతమైన వెలుగు
  rationale: ἱκανός సూచించగల గణనీయమైన తీవ్రతను సహజ తెలుగులో తెలియజేస్తుంది; ‘గొప్ప వెలుగు’ అనే పరిమాణాధార ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: περὶ ἐμέ
  choice: నా చుట్టూ
  rationale: వెలుగు పౌలు చుట్టూ వ్యాపించిన స్థల సంబంధాన్ని సూటిగా కాపాడుతుంది.
theological_decisions:
- issue: ἐκ τοῦ οὐρανοῦ లో οὐρανός భావం
  choice: ఆకాశం నుండి
  alternative: ఆకాశమండలం నుండి / పై నుండి
  rationale: లూకా–అపొస్తలుల కార్యముల సందర్భంలో దర్శనానికి దివ్య మూలం ఉన్న భావాన్ని నిలుపుతూ, తెలుగులో అతిగా సిద్ధాంతపరమైన పదాన్ని చేర్చకుండా ‘ఆకాశం నుండి’ అని అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పౌలు చెప్పే సాక్ష్యానికి తగిన సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. గ్రీకు వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా, కొనసాగుతున్న ప్రయాణం మరియు అకస్మిక ప్రకాశం మధ్య వ్యత్యాసాన్ని స్పష్టంగా ఉంచాం.
