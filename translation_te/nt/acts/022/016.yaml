id: ACT.22.16
reference: Acts 22:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ νῦν τί μέλλεις; ἀναστὰς βάπτισαι καὶ ἀπόλουσαι τὰς ἁμαρτίας σου ἐπικαλεσάμενος τὸ ὄνομα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/016.yaml
  text: And now why are you waiting? Rise[a], be baptized, and wash away your sins[b], calling on his name.
translation:
  language: te
  text: 'ఇప్పుడింకెందుకు ఆలస్యం చేస్తున్నావు?[a] లేచి, బాప్తిస్మం పొందు; నీ పాపాలను కడిగివేసుకో—ఆయన నామాన్ని పిలుచుకుంటూ.[b]


    [a] లేదా, “ఎందుకు తాత్సారం చేస్తున్నావు?”


    [b] “ఆయన నామాన్ని పిలుచుకుంటూ” అనే మాటను “ఆయన నామాన్ని పిలుచుకోవడం ద్వారా” అని కూడా అర్థం చేసుకోవచ్చు. బాప్తిస్మం పొందడం, పాపాలను కడిగివేసుకోవడం, ఆయన నామాన్ని పిలుచుకోవడం—వీటి మధ్య ఉన్న ఖచ్చితమైన సంబంధాన్ని గ్రీకు వాక్యనిర్మాణం పూర్తిగా నిర్దేశించదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకు తాత్సారం చేస్తున్నావు?”
    reason: τί μέλλεις అనే ప్రశ్న ఆలస్యాన్ని నిలదీసే భావాన్ని మరో సహజమైన తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
  - marker: b
    text: “ఆయన నామాన్ని పిలుచుకుంటూ” అనే మాటను “ఆయన నామాన్ని పిలుచుకోవడం ద్వారా” అని కూడా అర్థం చేసుకోవచ్చు. బాప్తిస్మం పొందడం, పాపాలను కడిగివేసుకోవడం, ఆయన నామాన్ని పిలుచుకోవడం—వీటి మధ్య ఉన్న ఖచ్చితమైన సంబంధాన్ని గ్రీకు వాక్యనిర్మాణం పూర్తిగా నిర్దేశించదు.
    reason: ἐπικαλεσάμενος అనే participle తోడుచర్యగానూ లేదా సాధనాన్ని సూచించేదిగానూ అర్థమయ్యే అవకాశాన్ని తెలియజేస్తుంది; ఆ వ్యాకరణ సంబంధాన్ని ఒక సిద్ధాంతపరమైన వివరణగా ఖరారు చేయదు.
lexical_decisions:
- source_word: τί μέλλεις
  choice: నీవెందుకు ఆలస్యం చేస్తున్నావు?
  rationale: ప్రశ్నార్థక ప్రయోగంలో μέλλω ఇక్కడ భవిష్యత్ ఉద్దేశాన్ని అడగడం కంటే ఆలస్యాన్ని నిలదీసే భావాన్ని ఇస్తుంది. ఈ తెలుగు రూపం ఆ తక్షణతను సహజంగా తెలియజేస్తుంది.
- source_word: ἀναστὰς
  choice: లేచి
  rationale: అనంతర ఆజ్ఞలతో కలిసి వచ్చే aorist participleను తెలుగులో సహజమైన పూర్వకాలిక క్రియారూపంగా ఇచ్చి, ఆజ్ఞ యొక్క వేగాన్ని నిలిపాం.
- source_word: βάπτισαι
  choice: బాప్తిస్మం పొందు
  rationale: మధ్యమ ఆజ్ఞారూపాన్ని ఆధునిక తెలుగు క్రైస్తవ వాడుకలో స్పష్టంగా, సహజంగా వినిపించే విధంగా అనువదించాం; కార్యాన్ని కేవలం స్వయంక్రియగా మార్చలేదు.
- source_word: ἀπόλουσαι
  choice: కడిగివేసుకో
  rationale: ἀπολούομαι లోని కడిగి తొలగించుకోవడం అనే భావాన్నీ, మధ్యమ రూపంలోని వ్యక్తిగత సంబంధాన్నీ ఈ రూపం వ్యక్తం చేస్తుంది.
- source_word: τὰς ἁμαρτίας σου
  choice: నీ పాపాలను
  rationale: ἁμαρτία యొక్క సాధారణ నూతన నిబంధన భావాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నేరుగా అనువదించాం.
- source_word: ἐπικαλεσάμενος
  choice: పిలుస్తూ
  rationale: ఈ participle కాలసంబంధమైన తోడు చర్యనో, సాధనాన్నో సూచించవచ్చు. “పిలుస్తూ” అని ఇవ్వడం ద్వారా ఆ సంబంధాన్ని ఒక్క విధంగా ఖరారు చేయకుండా ఉంచాం.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: ఆయన నామాన్ని
  rationale: మూలపాఠంలో స్పష్టమైన బిరుదుకు బదులు αὐτοῦ అనే సర్వనామం ఉంది. అందువల్ల సందర్భంలోని వ్యక్తిని వివరణాత్మకంగా పేరుపెట్టకుండా నేరుగా “ఆయన” అని అనువదించాం.
theological_decisions:
- issue: బాప్తిస్మం, పాపాలను కడిగివేసుకోవడం, ఆయన నామాన్ని పిలవడం మధ్య సంబంధం
  choice: గ్రీకు వాక్యంలోని వరుసను, చివరి participle యొక్క అనిశ్చిత సంబంధాన్ని ప్రధాన పాఠంలో నిలిపాం.
  alternative: బాప్తిస్మమే పాపక్షాళనకు సాధనం అని స్పష్టీకరించడం; లేదా ఆయన నామాన్ని పిలవడమే పాపక్షాళనకు సాధనం అని స్పష్టీకరించడం; లేదా ఈ మూడు అంశాలను ఒకే దీక్షా సముదాయంగా వ్యాఖ్యానించడం.
  rationale: రెండు ఆజ్ఞారూపాలు మరియు participle మధ్య సంబంధం గురించి వేర్వేరు సిద్ధాంతపరమైన పఠనాలు సాధ్యమవుతాయి. మూలపాఠం వాటిలో ఒక్కదాన్ని అనువాదకుడు తప్పనిసరిగా ఎంచుకోవాలని నిర్బంధించదు; కాబట్టి ఆ ఉద్వేగాన్ని పరిష్కరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకుడికి అర్థమయ్యే, గౌరవప్రదమైన శైలి. “బాప్తిస్మం” మరియు “నామం” వంటి స్థిరపడిన బైబిలు పదాలను ఉంచి, మిగతా వాక్యాన్ని సహజమైన ఆధునిక నిర్మాణంలో ఇచ్చాం.
