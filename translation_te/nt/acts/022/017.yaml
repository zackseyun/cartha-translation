source:
  edition: SBLGNT
  text: Ἐγένετο δέ μοι ὑποστρέψαντι εἰς Ἰερουσαλὴμ καὶ προσευχομένου μου ἐν τῷ ἱερῷ γενέσθαι με ἐν ἐκστάσει
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/017.yaml
  text: And it happened to me that[a], after I had returned to Jerusalem and while I was praying in the temple, I fell into a trance[b],
translation:
  language: te
  text: నేను యెరూషలేముకు తిరిగి వచ్చిన తర్వాత, దేవాలయ ప్రాంగణంలో[a] ప్రార్థిస్తూ ఉండగా, నాకు పారవశ్య స్థితి కలిగింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి గ్రీకు పదం దేవాలయ అంతర్గర్భాలయాన్ని ప్రత్యేకంగా కాక, దేవాలయ సముదాయాన్ని లేదా ప్రాంగణాలను సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా, “తన్మయ స్థితిలోకి వెళ్లాను.” గ్రీకు పదబంధం అటువంటి స్థితిలోకి ప్రవేశించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: నేను ... వెళ్లాను
  rationale: గ్రీకు కథన సూత్రాన్ని తెలుగులో పదేపదే ‘నాకు ఇలా జరిగింది’ అని అనువదించడం అసహజంగా ఉంటుంది; వ్యక్తిగత అనుభవాన్ని ప్రధాన క్రియతో సహజంగా వ్యక్తం చేశాం.
- source_word: ὑποστρέψαντι εἰς Ἰερουσαλὴμ
  choice: నేను యెరూషలేముకు తిరిగి వచ్చిన తర్వాత
  rationale: అయోరిస్టు కృదంతం ప్రధాన సంఘటనకు ముందున్న చర్యను సూచిస్తుంది; ‘తర్వాత’ ఆ కాలక్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: καὶ προσευχομένου μου
  choice: ప్రార్థిస్తూ ఉండగా
  rationale: జెనిటివ్ అబ్సల్యూట్ ప్రధాన సంఘటనతో సమకాలంలో కొనసాగుతున్న ప్రార్థనను సూచిస్తుంది.
- source_word: ἐν τῷ ἱερῷ
  choice: దేవాలయ ప్రాంగణంలో
  rationale: ἱερόν అంతర్గర్భాలయాన్ని మాత్రమే కాక దేవాలయ సముదాయాన్ని లేదా ఆవరణాన్ని సూచిస్తుంది; ‘ప్రాంగణం’ ఈ భేదాన్ని సహజంగా కాపాడుతుంది.
- source_word: γενέσθαι με ἐν ἐκστάσει
  choice: నేను దర్శనపారవశ్యంలోకి వెళ్లాను
  rationale: ఈ పదబంధం దర్శనానికి సంబంధించిన అసాధారణ చైతన్యస్థితిలోకి ప్రవేశించడాన్ని సూచిస్తుంది. ‘వెళ్లాను’ స్థితిలోకి ప్రవేశించే భావాన్ని తెలుగులో సహజంగా ఇస్తుంది.
theological_decisions:
- issue: ἐκστάσει అనే అనుభవ స్వభావం
  choice: దర్శనపారవశ్యం
  alternative: మైమరపు స్థితి; పారవశ్యం
  rationale: సందర్భం దర్శనాత్మక అనుభవాన్ని సూచించినా, దాని ప్రక్రియను లేదా ఖచ్చిత స్వభావాన్ని వాక్యం నిర్వచించదు. ఈ పదం అనుభవాన్ని తెలియజేస్తుంది కాని అదనపు సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని కాలక్రమం, సమకాలిక ప్రార్థన, దర్శనస్థితిలోకి ప్రవేశం కాపాడబడ్డాయి.
