  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయసంబంధ ప్రశ్నలోని గంభీరతను నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. మూలంలో లేని పాదసూచికను చేర్చలేదు; అందువల్ల ప్రధాన పాఠ్యంలో పాదసూచిక గుర్తు లేదు.
