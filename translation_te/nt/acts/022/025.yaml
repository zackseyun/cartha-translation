source:
  edition: SBLGNT
  text: ὡς δὲ ⸀προέτειναν αὐτὸν τοῖς ἱμᾶσιν εἶπεν πρὸς τὸν ἑστῶτα ἑκατόνταρχον ὁ Παῦλος· Εἰ ἄνθρωπον Ῥωμαῖον καὶ ἀκατάκριτον ἔξεστιν ὑμῖν μαστίζειν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/025.yaml
  text: But when they had stretched him out with the straps[a], Paul said to the centurion standing there, “Is it lawful for you to flog a Roman citizen who is uncondemned?”
translation:
  language: te
  text: అయితే వారు అతనిని చర్మపు పట్టీలతో చాపి కట్టినప్పుడు, పౌలు అక్కడ నిలబడి ఉన్న శతాధిపతితో, “దోషిగా తీర్పు పొందని ఒక రోమా పౌరుణ్ణి కొరడాలతో కొట్టడం మీకు చట్టబద్ధమేనా?” అని అడిగాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προέτειναν ... τοῖς ἱμᾶσιν
  choice: తోలు పట్టీలతో అతన్ని సాగదీసి కట్టినప్పుడు
  rationale: క్రియలోని సాగదీసే భావాన్నీ, ἱμᾶσιν సూచించే పట్టీలతో బిగించే చర్యనూ సహజమైన తెలుగులో కలిపి తెలియజేస్తుంది.
- source_word: ἑστῶτα
  choice: అక్కడ నిలబడి ఉన్న
  rationale: శతాధిపతి సమీపంలో ఉండి ఈ చర్యను పర్యవేక్షిస్తున్న దృశ్యాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἑκατόνταρχον
  choice: శతాధిపతి
  rationale: రోమా సైనిక హోదాకు తెలుగులో స్థిరపడిన, సంక్షిప్తమైన పదం.
- source_word: ἄνθρωπον Ῥωμαῖον
  choice: ఒక రోమా పౌరుణ్ణి
  rationale: గ్రీకు పదబంధం అక్షరార్థంగా ‘రోమా మనిషి’ అయినా, ఈ న్యాయసంబంధ సందర్భంలో రోమా పౌరసత్వ హోదానే ప్రశ్నకు ఆధారం; ‘రోమా పౌరుడు’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: ἀκατάκριτον
  choice: తీర్పు పొందని
  rationale: న్యాయస్థానం దోషిగా తీర్పు ఇవ్వని స్థితిని స్పష్టంగా తెలియజేస్తుంది; ‘ఖండించబడని’ కంటే న్యాయసందర్భంలో సహజం.
- source_word: ἔξεστιν
  choice: మీకు చట్టబద్ధమేనా
  rationale: కేవలం అనుమతి గురించే కాక, న్యాయపరమైన చెల్లుబాటు గురించి పౌలు అడిగిన ప్రశ్నను తెలియజేస్తుంది.
- source_word: μαστίζειν
  choice: కొరడాలతో కొట్టడం
  rationale: తీవ్రమైన శారీరక శిక్షను సాధారణ ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
