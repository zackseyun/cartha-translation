  source_fidelity: మూలంలోని προέτειναν αὐτὸν τοῖς ἱμᾶσιν అనేది కొరడాదెబ్బలకు సిద్ధం చేయడానికి తోలు పట్టీలతో పౌలును చాపి/బిగించిన చర్యను సూచిస్తుంది. ముసాయిదాలోని “సాగదీసి కట్టినప్పుడు”లో ‘సాగదీయడం’కు లాగడం లేదా ఈడ్చడం అనే అనవసరమైన ఛాయ ఉండవచ్చు. “చాపి కట్టినప్పుడు” దృశ్యాన్నీ ఉద్దేశాన్నీ మరింత నిశితంగా తెలియజేస్తుంది. ἄνθρωπον Ῥωμαῖονకు న్యాయసందర్భంలో “రోమా పౌరుడు” సరైనది; ἀκατάκριτονకు “దోషిగా తీర్పు పొందని” న్యాయపరమైన భావాన్ని స్పష్టం చేస్తుంది.
