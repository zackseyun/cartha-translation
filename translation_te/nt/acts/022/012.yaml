  yaml_path: translation/nt/acts/022/012.yaml
  text: A certain man[a], Ananias, devout according to the law, well spoken of by all the Jews living there,
translation:
  language: te
  text: ధర్మశాస్త్రం ప్రకారం భక్తిగలవాడూ, అక్కడ నివసించే యూదులందరిచేత మంచి పేరు పొందినవాడూ అయిన అననీయ అనే ఒక వ్యక్తి[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదులు” అనే పదాన్ని మత-సామాజిక గుర్తింపుగా కాక జాతి-భౌగోళిక పదంగా తీసుకుంటే, “యూదయవారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἁνανίας
  choice: అననీయ
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: δέ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది స్వల్ప కథన మార్పును సూచిస్తుంది; ఈ అసంపూర్ణ వాక్యభాగంలో తెలుగు సహజ ప్రవాహం కోసం ప్రత్యేక సంధాయక పదాన్ని చేర్చలేదు.
- source_word: τις ἀνὴρ
  choice: అనే ఒక వ్యక్తి
  rationale: ముందుగా పరిచయం చేయని నిర్దిష్ట పురుషుణ్ణి సూచించే అనిశ్చిత భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: εὐλαβὴς κατὰ τὸν νόμον
  choice: ధర్మశాస్త్రం ప్రకారం భక్తిగలవాడు
  rationale: మోషే ధర్మశాస్త్రానికి అనుగుణమైన భక్తి, మతనిష్ఠ అనే భావాన్ని దగ్గరగా వ్యక్తపరుస్తుంది.
- source_word: μαρτυρούμενος ὑπὸ πάντων
  choice: అందరిచేత మంచి పేరు పొందినవాడు
  rationale: ఇతరులు అతని గురించి అనుకూల సాక్ష్యం చెప్పారనే కర్మణి భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τῶν κατοικούντων Ἰουδαίων
  choice: అక్కడ నివసించే యూదులు
  rationale: నివాస భావాన్ని సందర్భంలోని దమస్కుతో అనుసంధానిస్తూ, మత-సామాజిక గుర్తింపును సూచించే సాధారణ తెలుగు పదాన్ని వాడుతుంది.
theological_decisions:
- issue: Ἰουδαίων పదానికి అర్థం
  choice: యూదులు
  alternative: యూదయవారు
  rationale: ఇక్కడ దమస్కులో నివసించే యూద సమాజమే ఉద్దేశం; యూదయ ప్రాంత మూలాన్ని ప్రధానంగా చెప్పడం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు మూలంలోని వాక్యం తరువాతి భాగానికి కొనసాగుతున్నందున చివర కామాను నిలిపాం. మూలంలో పాదసూచికకు సహజంగా సరిపడే వివాదాస్పద పదమైన “యూదులు” వద్ద [a] గుర్తును ఉంచాం.
