id: ACT.22.30
reference: Acts 22:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον βουλόμενος γνῶναι τὸ ἀσφαλὲς τὸ τί κατηγορεῖται ⸀ὑπὸ τῶν Ἰουδαίων ἔλυσεν ⸀αὐτόν, καὶ ἐκέλευσεν ⸀συνελθεῖν τοὺς ἀρχιερεῖς καὶ ⸀πᾶν τὸ ⸀συνέδριον, καὶ καταγαγὼν τὸν Παῦλον ἔστησεν εἰς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/030.yaml
  text: But on the next day[a], wanting to know for certain what he was being accused of by the Jews, he released him and ordered the chief priests and the whole council to assemble; and bringing Paul down[b], he set him before them.
translation:
  language: te
  text: అయితే మరుసటి రోజు, అతనిపై యూదులు[a] ఏ ఆరోపణ చేస్తున్నారో ఖచ్చితంగా తెలుసుకోవాలని సేనాధిపతి అతని బంధాలను విప్పి, ప్రధాన యాజకులు మరియు మహాసభ[b] అంతా సమావేశం కావాలని ఆజ్ఞాపించాడు. పౌలును కిందికి తీసుకువచ్చి వారి ఎదుట నిలబెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “యూదులు” అనేది పౌలుపై ఆరోపణ చేసిన వారిని సూచిస్తుంది; యూదులందరినీ తేడా లేకుండా సూచించదు. ప్రత్యామ్నాయంగా, సందర్భానుసారం “యూదుల నాయకులు” లేదా “యూదయులు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “మహాసభ” అనేది యెరూషలేములోని యూదుల పాలక మండలి అయిన సన్హెద్రిన్‌ను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: మరుసటి రోజు
  rationale: కాలసూచక దత్తివిభక్తి ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో చూపుతుంది; δέ కథనంలోని స్వల్ప మలుపును సూచించినా ప్రత్యేక విరోధార్థక పదం అవసరం లేదు.
- source_word: βουλόμενος γνῶναι τὸ ἀσφαλές
  choice: ఖచ్చితంగా తెలుసుకోవాలని
  rationale: అధిపతి ఉద్దేశాన్నీ, విశ్వసనీయమైన వాస్తవాన్ని నిర్ధారించుకోవాలనే భావాన్నీ సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ τί κατηγορεῖται ὑπὸ τῶν Ἰουδαίων
  choice: యూదులు అతనిపై ఏ నేరం మోపుతున్నారో
  rationale: κατηγορέω యొక్క ఆరోపణ భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో ఇస్తుంది; Ἰουδαίων అనే రూపాన్ని వ్యాఖ్యానాత్మకంగా కుదించకుండా ‘యూదులు’గా ఉంచింది.
- source_word: ἔλυσεν αὐτόν
  choice: పౌలును బంధాలనుంచి విడిపించి
  rationale: λύω ఇక్కడ కట్టులు లేదా బంధాలను విప్పడాన్ని సూచిస్తుంది. ‘విడుదల చేశాడు’ అనడం సంపూర్ణ నిర్బంధ విముక్తిగా అపార్థమయ్యే అవకాశం ఉన్నందున, సందర్భాన్ని స్పష్టంగా చూపే ఈ రూపం ఎంచుకుంది.
- source_word: ἐκέλευσεν συνελθεῖν
  choice: సమావేశం కావాలని ఆజ్ఞాపించాడు
  rationale: అధికారపూర్వక ఆదేశాన్నీ, కలిసి రావడాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: τοὺς ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: ఆలయ యాజక నాయకులను సూచించే బహువచన బిరుదుకు ప్రామాణిక తెలుగు రూపం.
- source_word: πᾶν τὸ συνέδριον
  choice: మహాసభ అంతా
  rationale: సυνέδριον ను యెరూషలేములోని యూదుల పాలక మండలిగా సూచించే సుపరిచితమైన పదంతో అనువదించి, πᾶν ను ‘అంతా’గా నిలిపింది.
- source_word: καταγαγὼν τὸν Παῦλον
  choice: పౌలును కిందికి తీసుకొచ్చి
  rationale: కోట లేదా శిబిరం ఉన్న ఎత్తైన ప్రదేశం నుంచి సభాస్థలానికి కిందికి తీసుకురావడమనే కథన కదలికను కాపాడుతుంది.
- source_word: ἔστησεν εἰς αὐτούς
  choice: వారి ఎదుట నిలబెట్టాడు
  rationale: పౌలును అధికారికంగా సభ ఎదుట హాజరుపరచిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: అపొస్తలుల కార్యములలో Ἰουδαίων పదప్రయోగం
  choice: యూదులు
  alternative: యూదుల నాయకులు / యూదయులు
  rationale: గ్రీకు పదరూపాన్ని ప్రధాన పాఠంలో నిలిపింది. సందర్భంలో ఇది పౌలుపై ఆరోపణ చేసిన నిర్దిష్ట వర్గాన్ని సూచిస్తుంది; యూదులందరినీ తేడా లేకుండా సూచించదు. ‘నాయకులు’ అని ప్రధాన పాఠంలో చేర్చడం మూలంలో లేని వివరణను దిగుమతి చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; అధికారిక న్యాయసభ సందర్భానికి తగిన గౌరవప్రదమైన శైలి. పొడవైన గ్రీకు వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించింది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత సందర్భ వివరణను అందిస్తుంది.
