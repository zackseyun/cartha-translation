revisions:
- from: మరుసటి రోజు, యూదులు అతనిపై ఏ నేరం మోపుతున్నారో ఖచ్చితంగా తెలుసుకోవాలని అధిపతి పౌలును బంధాలనుంచి విడిపించి, ప్రధాన యాజకులు, మహాసభ అంతా సమావేశం కావాలని ఆజ్ఞాపించాడు. తరువాత పౌలును కిందికి తీసుకొచ్చి వారి ఎదుట నిలబెట్టాడు.[a]
  to: అయితే మరుసటి రోజు, అతనిపై యూదులు[a] ఏ ఆరోపణ చేస్తున్నారో ఖచ్చితంగా తెలుసుకోవాలని సేనాధిపతి అతని బంధాలను విప్పి, ప్రధాన యాజకులు మరియు మహాసభ[b] అంతా సమావేశం కావాలని ఆజ్ఞాపించాడు. పౌలును కిందికి తీసుకువచ్చి వారి ఎదుట నిలబెట్టాడు.
  rationale: The revision preserves the source's neutral passive accusation and represents ἔλυσεν as unbinding rather than an unqualified release. It also restores a light narrative turn for δέ and separates the two audit-trail footnotes, placing each marker immediately after its relevant term.
