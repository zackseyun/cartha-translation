- from: అతడు నా దగ్గరకు వచ్చి, నా పక్కన నిలబడి, ‘సోదరుడా సౌలా, చూపు పొందు’ అని నాతో అన్నాడు. ఆ క్షణంలోనే నేను చూపు పొంది అతని వైపు చూశాను.[a]
  to: అతడు నా దగ్గరకు వచ్చి, నా పక్కన నిలబడి, ‘సోదరుడా సౌలా, చూపు పొందు’ అని నాతో అన్నాడు. అదే గంటలో నేను చూపు పొంది అతని వైపు చూశాను.[a]
