  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐλθὼν πρὸς ⸀ἐμὲ καὶ ἐπιστὰς εἶπέν μοι· Σαοὺλ ἀδελφέ, ἀνάβλεψον· κἀγὼ αὐτῇ τῇ ὥρᾳ ἀνέβλεψα εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/013.yaml
  text: He came to me[a], and standing by me said to me, ‘Brother Saul, receive your sight.’ And in that very hour I received my sight and looked at him.
translation:
  language: te
  text: అతడు నా దగ్గరకు వచ్చి, నా పక్కన నిలబడి, ‘సోదరుడా సౌలా, చూపు పొందు’ అని నాతో అన్నాడు. అదే గంటలో నేను చూపు పొంది అతని వైపు చూశాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చూపు పొందు,’ ‘చూపు పొంది’ అనే రెండు చోట్లా ‘మళ్లీ చూడు,’ ‘మళ్లీ చూశాను’ అని కూడా అనువదించవచ్చు. ἀναβλέπω అనే గ్రీకు క్రియకు ‘పైకి చూడు’ అనే అర్థం కూడా ఉండవచ్చు; అయితే ఇక్కడ అంధత్వం తొలగిన సందర్భం చూపు తిరిగి రావడాన్నే సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν πρὸς ἐμέ
  choice: అతడు నా దగ్గరకు వచ్చి
  rationale: కర్తృవాచక భూతకాల కృదంతం మరియు πρός యొక్క దిశాభావాన్ని సహజమైన తెలుగు కథనశైలిలో వ్యక్తం చేస్తుంది.
- source_word: ἐπιστάς
  choice: నా పక్కన నిలబడి
  rationale: అననీయ పౌలు సమీపంలో స్థానం తీసుకున్నాడనే స్థలార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: Σαοὺλ ἀδελφέ
  choice: సోదరుడా సౌలా
  rationale: సంబోధన రూపాన్ని తెలుగులో సహజమైన క్రమంతో ఉంచి, సహోదరత్వం లేదా విశ్వాససమాజపు అనుబంధాన్ని అనవసరంగా విస్తరించకుండా కాపాడుతుంది.
- source_word: ἀνάβλεψον
  choice: చూపు పొందు
  rationale: ఈ అంధత్వం-స్వస్థత సందర్భంలో క్రియకు ‘మళ్లీ చూడడం/చూపు తిరిగి పొందడం’ అనే అర్థం ఉంది; సంక్షిప్తమైన తెలుగు ఆజ్ఞారూపంగా ‘చూపు పొందు’ సరిపోతుంది.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: ఆ క్షణంలోనే
  rationale: ὥρα పదం ఇక్కడ ఖచ్చితమైన తక్షణ సమయాన్ని సూచించే ప్రయోగం; తెలుగులో ‘ఆ గంటలోనే’ కంటే ‘ఆ క్షణంలోనే’ సహజంగా ఉండి కాలపరమైన గాఢతను నిలుపుతుంది.
- source_word: ἀνέβλεψα
  choice: నేను చూపు పొంది
  rationale: ముందటి ఆజ్ఞతో పదార్థ సంబంధాన్ని నిలుపుతూ చూపు పునరుద్ధరణను తెలుపుతుంది.
- source_word: εἰς αὐτόν
  choice: అతని వైపు చూశాను
  rationale: εἰς లోని దిశాభావాన్ని నిలుపుతూ, చూపు వచ్చిన తరువాత అననీయ వైపు దృష్టి మళ్లించినట్లు తెలుపుతుంది.
- source_word: εἶπέν μοι
  choice: నాతో అన్నాడు
  rationale: μοι ను విస్మరించకుండా, తెలుగులో సహజమైన రీతిలో మాట పౌలుతో చెప్పబడిందని తెలియజేస్తుంది.
