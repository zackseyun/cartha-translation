translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘సోదరుడా సౌలా’ అనే సంబోధన మూలంలోని రెండు సంబోధన పదాలను నిలుపుతుంది. పాదసూచిక గుర్తు ప్రధాన వాక్యాంతంలో ఉంచబడింది.
