id: ACT.22.7
reference: Acts 22:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔπεσά τε εἰς τὸ ἔδαφος καὶ ἤκουσα φωνῆς λεγούσης μοι· Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/007.yaml
  text: I fell to the ground and heard a voice saying to me, ‘Saul, Saul, why are you persecuting me?’
translation:
  language: te
  text: నేను నేలమీద పడి, ‘సౌలా, సౌలా, నీవు నన్నెందుకు హింసిస్తున్నావు?’ అని నాతో పలికిన ఒక స్వరం విన్నాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσά
  choice: నేను ... పడి
  rationale: πίπτω క్రియ యొక్క ఏకకాల భూతార్థాన్ని సహజమైన తెలుగు వర్తమాన క్రియావిశేషణ నిర్మాణంలో చూపుతుంది; తరువాతి ప్రధాన క్రియ ‘విన్నాను’తో సంఘటనల క్రమం స్పష్టమవుతుంది.
- source_word: τε
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: ఇది ముందున్న వాక్యభాగంతో అనుసంధానించే అవ్యయం; తెలుగు వాక్యప్రవాహంలో ‘పడి’ అనే నిర్మాణమే ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἰς τὸ ἔδαφος
  choice: నేలమీద
  rationale: పడిపోవడాన్ని సూచించే సందర్భంలో ఇది ఆధునిక తెలుగులో సహజమైన ప్రయోగం; ‘భూమికి’ కంటే సందర్భోచితంగా ఉంది.
- source_word: ἤκουσα
  choice: విన్నాను
  rationale: ἀκούω యొక్క ప్రథమ పురుష ఏకవచన భూతార్థాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: φωνῆς
  choice: ఒక స్వరం
  rationale: తరువాత స్పష్టమైన మాటలు వినిపిస్తున్నందున φωνή ఇక్కడ ‘స్వరం’ అనే అర్థంలో ఉంది; గ్రీకులోని అనిర్దిష్టతను ‘ఒక’ నిలుపుతుంది.
- source_word: λεγούσης μοι
  choice: నాతో పలికిన
  rationale: స్వరం సౌలును ఉద్దేశించి మాటలాడిందనే μοι భావాన్ని నిలుపుతూ, తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉంది.
- source_word: Σαοὺλ Σαούλ
  choice: సౌలా, సౌలా
  rationale: వ్యక్తి పేరును తెలుగు లిప్యంతరీకరణతో, సంబోధన రూపంలో ఇచ్చి, మూలంలోని పునరుక్తి మరియు దాని ఉద్ఘాటనను నిలిపింది.
- source_word: τί
  choice: ఎందుకు
  rationale: చర్యకు కారణాన్ని అడిగే ఈ గ్రీకు ప్రయోగానికి ‘ఎందుకు’ సహజమైన తెలుగు సమానార్థకం.
- source_word: με
  choice: నన్ను
  rationale: వక్తను సూచించే ప్రత్యక్ష కర్మను యథాతథంగా నిలుపుతుంది.
- source_word: διώκεις
  choice: హింసిస్తున్నావు
  rationale: ఈ సందర్భంలో διώκω శత్రుత్వపూర్వకంగా వేధించడం లేదా పీడించడం అనే భావం కలిగి ఉంది; తెలుగు కొనసాగుతున్న వర్తమాన రూపం గ్రీకు వర్తమాన కాలంలోని సాగుతున్న చర్యను సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: విశ్వాసులపై సౌలు చేసిన హింసను వక్త తనపై చేసిన హింసగా పేర్కొనడం
  choice: ‘నన్ను’ అనే ప్రత్యక్ష ప్రథమ పురుష సూచనను ఎలాంటి వివరణాత్మక విస్తరణ లేకుండా నిలిపాం.
  alternative: ‘నా ప్రజలను’ లేదా ‘నా అనుచరులను’ అని వివరణాత్మకంగా విస్తరించడం.
  rationale: మూలవాక్యం సౌలు చేసిన హింసను వక్త నేరుగా తనతో అనుసంధానిస్తుంది. ఆ వేదాంతపరమైన ఉద్వేగాన్ని అనువాదం వివరించి పరిష్కరించకుండా యథాతథంగా కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ప్రత్యక్ష సంభాషణలో సంబోధన రూపం ‘సౌలా’ ఉపయోగించబడింది; మూలంలోని పునరుక్తి, ప్రశ్న, మరియు ‘నన్ను’ అనే వేదాంతపరంగా ముఖ్యమైన ప్రత్యక్ష సూచన నిలుపబడ్డాయి.
