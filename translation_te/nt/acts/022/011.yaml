source:
  edition: SBLGNT
  text: ὡς δὲ οὐκ ἐνέβλεπον ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου, χειραγωγούμενος ὑπὸ τῶν συνόντων μοι ἦλθον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/011.yaml
  text: And since I could not see because of the brightness of that light[a], I came into Damascus being led by the hand by those who were with me.
translation:
  language: te
  text: ఆ వెలుగు ప్రకాశంవల్ల[a] నేను చూడలేకపోవడంతో, నాతో ఉన్నవారు నా చెయ్యి పట్టుకొని నడిపించగా దమస్కుకు వచ్చాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఆ వెలుగు మహిమవల్ల.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέβλεπον
  choice: చూడలేకపోయాను
  rationale: ఈ సందర్భంలో ἐμβλέπω కేవలం తదేకంగా చూడడాన్ని కాక, ఆ ప్రకాశం కారణంగా చూడలేని స్థితిని సూచిస్తుంది. ‘చూడలేకపోయాను’ అనేది ఆచరణాత్మక ఫలితాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου
  choice: ఆ వెలుగు తేజస్సువల్ల
  rationale: δόξα ఇక్కడ చూపును పోగొట్టిన వెలుగు యొక్క ప్రకాశవంతమైన తేజస్సును సూచిస్తుంది. ‘తేజస్సు’ భౌతిక ప్రకాశాన్నీ అసాధారణ వైభవాన్నీ సహజంగా వ్యక్తం చేస్తుంది; మరింత అక్షరార్థమైన ‘మహిమ’ను పాదసూచికలో ఉంచాం.
- source_word: χειραγωγούμενος
  choice: నా చెయ్యి పట్టుకొని నడిపించగా
  rationale: ఈ కృదంతంలో చెయ్యి పట్టుకొని నడిపించడం అనే స్పష్టమైన భావం ఉంది. తెలుగు వాక్య నిర్మాణంలో కర్తను స్పష్టం చేయడానికి ‘నాతో ఉన్నవారు’తో అనుసంధానించి సహజంగా అనువదించాం.
- source_word: ὑπὸ τῶν συνόντων μοι
  choice: నాతో ఉన్నవారు
  rationale: సύνειμι అంటే ‘తో ఉండడం, వెంట రావడం.’ ‘నాతో ఉన్నవారు’ మూలంలోని సంబంధపూర్వక వర్ణనను కాపాడుతుంది; వారిని ప్రత్యేక హోదాగల సహచరులుగా అతిగా నిర్వచించదు.
- source_word: ἦλθον εἰς Δαμασκόν
  choice: దమస్కుకు వచ్చాను
  rationale: ἔρχομαι + εἰς ఒక స్థలంవైపు లేదా దానిలోకి కదలికను సూచిస్తుంది. ఆధునిక తెలుగులో ‘దమస్కుకు వచ్చాను’ సహజంగా ఉండి గమ్యస్థాన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ὡς δὲ
  choice: కాబట్టి
  rationale: ఇక్కడ ὡς తదుపరి చర్యకు కారణమైన పరిస్థితిని పరిచయం చేస్తుంది; δέ కథనాన్ని కొనసాగిస్తుంది. ముందరి కారణాన్ని తరువాతి చేతిపట్టుకొని నడిపించడానికీ రావడానికీ అనుసంధానించేందుకు ‘కాబట్టి’ సహజంగా పనిచేస్తుంది.
theological_decisions:
- issue: దైవ ప్రత్యక్షతను సూచించే సందర్భంలో δόξα అనువాదం
  choice: తేజస్సు
  alternative: మహిమ
  rationale: ఈ వాక్యంలో δόξα ప్రధానంగా చూపును పోగొట్టిన వెలుగు యొక్క దృశ్య ప్రకాశాన్ని సూచిస్తుంది. ‘తేజస్సు’ తక్షణ సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది; అదే సమయంలో ‘మహిమ’ అనే అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా పదంలోని సాధ్యమైన దైవశాస్త్రీయ ప్రతిధ్వనిని తొలగించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘నా చెయ్యి పట్టుకొని నడిపించగా’ అనే రూపం మూలంలోని స్పష్టమైన చేతి సహాయాన్ని కాపాడుతుంది.
