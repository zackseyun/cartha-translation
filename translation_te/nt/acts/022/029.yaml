source:
  edition: SBLGNT
  text: εὐθέως οὖν ἀπέστησαν ἀπ’ αὐτοῦ οἱ μέλλοντες αὐτὸν ἀνετάζειν· καὶ ὁ χιλίαρχος δὲ ἐφοβήθη ἐπιγνοὺς ὅτι Ῥωμαῖός ἐστιν καὶ ὅτι ⸂αὐτὸν ἦν⸃ δεδεκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/029.yaml
  text: Therefore those who were about to examine him withdrew from him at once[b][a], and the tribune also became afraid when he realized that he was a Roman citizen and that he had bound him.
translation:
  language: te
  text: కాబట్టి, అతన్ని విచారించబోతున్నవారు[a] వెంటనే అతని దగ్గరనుంచి వెనక్కి తగ్గారు. సైన్యాధికారి[b] కూడా, అతడు రోమా పౌరుడని, తానే అతన్ని బంధించాడని గ్రహించి భయపడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ సందర్భంలో మరింత నిర్దిష్టంగా, “కొరడాలతో విచారించబోతున్నవారు” అని అర్థం కావచ్చు. గ్రీకు క్రియ అధికారిక విచారణను సూచించగలదు; ముందరి వచనం ఆ విచారణ పద్ధతిని స్పష్టం చేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “సహస్రాధిపతి”; ఇది రోమా సైనిక అధికారికి ఉపయోగించిన గ్రీకు బిరుదు. బిరుదు వెయ్యిమందితో సంబంధం కలిగి ఉన్నప్పటికీ, వాస్తవంగా అతని ఆధీనంలోని సైనికుల సంఖ్య మారవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: εὐθέως οὖν
  choice: కాబట్టి ... వెంటనే
  rationale: οὖν తెలిపే ముందరి వాక్యంతోని తార్కిక సంబంధాన్ని ‘కాబట్టి’తో, εὐθέως తెలిపే తక్షణ ప్రతిస్పందనను ‘వెంటనే’తో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπέστησαν ἀπ’ αὐτοῦ
  choice: అతని దగ్గరనుంచి వెనక్కి తగ్గారు
  rationale: వారు పౌలును విచారించే చర్యను నిలిపి అతని నుంచి తొలగిపోయారనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: οἱ μέλλοντες αὐτὸν ἀνετάζειν
  choice: అతన్ని విచారించబోతున్నవారు
  rationale: μέλλω + infinitive లోని సమీప ఉద్దేశాన్ని ‘బోతున్నవారు’ నిలుపుతుంది; ἀνετάζωను ‘విచారించు’గా అనువదించడం అధికారిక విచారణ అనే అర్థాన్ని కాపాడుతూ, కొరడాలతో విచారించడం అనే సందర్భార్థాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: χιλίαρχος
  choice: సహస్రాధిపతి
  rationale: రోమా సైన్యంలోని ఉన్నతాధికారిని సూచించే చారిత్రక బిరుదుకు సంక్షిప్తమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం; దాని కార్యపరమైన అర్థాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: ἐφοβήθη
  choice: భయపడ్డాడు
  rationale: విషయం గ్రహించినప్పుడు కలిగిన భయప్రతిస్పందనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπιγνοὺς
  choice: గ్రహించినప్పుడు
  rationale: పరిస్థితి యొక్క ప్రాముఖ్యతను పూర్తిగా తెలుసుకున్న కారణ-కాల భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: Ῥωμαῖός ἐστιν
  choice: అతడు రోమా పౌరుడని
  rationale: ఇక్కడ జాతి గుర్తింపుకన్నా చట్టబద్ధమైన పౌరసత్వమే ముఖ్యమైనందున ‘పౌరుడు’ను స్పష్టంగా చేర్చింది.
- source_word: αὐτὸν ἦν δεδεκώς
  choice: తాను అతన్ని బంధించానని
  rationale: పూర్తయిన బంధన చర్యకు కొనసాగుతున్న చట్టపరమైన ప్రాముఖ్యత ఉందనే perfect నిర్మాణ భావాన్ని తెలుగులో సహజంగా అందిస్తుంది; కర్త సహస్రాధిపతేనని ‘తాను’ స్పష్టం చేస్తుంది.
