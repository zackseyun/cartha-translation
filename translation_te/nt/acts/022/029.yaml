translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. చారిత్రక బిరుదైన ‘సహస్రాధిపతి’ని ప్రధాన పాఠ్యంలో ఉంచి సాధారణ అర్థాన్ని పాదసూచికలో ఇచ్చాం. మూలంలోని అధికారిక ‘విచారణ’ పదాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, సందర్భం సూచించే కొరడాల వినియోగాన్ని ప్రత్యామ్నాయంగా మాత్రమే పేర్కొన్నాం.
