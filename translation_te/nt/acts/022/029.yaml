revisions:
- from: కాబట్టి అతన్ని విచారించబోతున్నవారు వెంటనే అతని దగ్గరనుంచి వెనక్కి తగ్గారు.[a] అతడు రోమా పౌరుడని, తాను అతన్ని బంధించానని సహస్రాధిపతి[b] గ్రహించినప్పుడు అతడు కూడా భయపడ్డాడు.
  to: కాబట్టి, అతన్ని విచారించబోతున్నవారు[a] వెంటనే అతని దగ్గరనుంచి వెనక్కి తగ్గారు. సైన్యాధికారి[b] కూడా, అతడు రోమా పౌరుడని, తానే అతన్ని బంధించాడని గ్రహించి భయపడ్డాడు.
  rationale: The revision removes a potentially misleading first-person nuance in the final indirect clause, preserves the Greek perfect as a prior binding action, and uses a natural modern Telugu designation for the Roman officer. Footnote anchors are placed directly after the terms they explain, and the historical note is qualified to avoid implying a fixed troop total.
  reviewer_model: gpt-5.6-terra
