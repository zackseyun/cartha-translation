  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Ἐγώ εἰμι ἀνὴρ Ἰουδαῖος, γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας, ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ παρὰ τοὺς πόδας Γαμαλιήλ, πεπαιδευμένος κατὰ ἀκρίβειαν τοῦ πατρῴου νόμου, ζηλωτὴς ὑπάρχων τοῦ θεοῦ καθὼς πάντες ὑμεῖς ἐστε σήμερον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/003.yaml
  text: I am a Jewish man[a], born in Tarsus of Cilicia, but brought up in this city at the feet of Gamaliel, educated according to the strictness of the law of our fathers[b], being zealous for God just as all of you are today.
translation:
  language: te
  text: “నేను యూదుణ్ని; కిలికియలోని తార్సులో పుట్టాను, అయితే ఈ పట్టణంలో గమలీయేలు పాదాల దగ్గర[a] పెరిగి, పూర్వీకుల ధర్మశాస్త్రం యొక్క కఠినత ప్రకారం విద్యాభ్యాసం చేశాను; ఈ రోజు మీరందరూ ఉన్నట్లే దేవునిపట్ల ఉత్సాహం గలవాడిని.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గమలీయేలు పాదాల దగ్గర’ అనేది ఆయన వద్ద శిష్యుడిగా విద్యాభ్యాసం చేయడాన్ని సూచించే నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνὴρ Ἰουδαῖος
  choice: యూదుణ్ని
  rationale: తెలుగులో ‘యూదుడు’ అనే పుంలింగ రూపం వయోజన పురుషుడనే భావాన్ని సహజంగా సూచిస్తుంది; ‘యూద పురుషుణ్ని’ అనడం అనవసరంగా కృత్రిమంగా ఉంటుంది.
- source_word: γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας
  choice: కిలికియలోని తార్సులో పుట్టాను
  rationale: జన్మస్థలాన్నీ, కిలికియతో దాని భౌగోళిక సంబంధాన్నీ సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ
  choice: అయితే ఈ పట్టణంలోనే ... పెరిగి
  rationale: ἀνατρέφω ఇక్కడ పోషణకన్నా పెంపకం, ఎదుగుదలను సూచిస్తుంది; δέ జన్మస్థలానికీ పెరిగిన స్థలానికీ ఉన్న వ్యత్యాసాన్ని చూపుతుంది.
- source_word: παρὰ τοὺς πόδας Γαμαλιήλ
  choice: గమలీయేలు పాదాల దగ్గర
  rationale: గురువు శిష్యరికంలో విద్యాభ్యాసం చేయడాన్ని సూచించే సజీవమైన మూలభాషా నుడికారాన్ని నిలుపుతుంది; పాదసూచిక దాని సాంస్కృతిక అర్థాన్ని వివరిస్తుంది.
- source_word: πεπαιδευμένος κατὰ ἀκρίβειαν
  choice: కచ్చితంగా పాటించేలా శిక్షణ పొందాను
  rationale: పౌలు పొందిన విద్య ధర్మశాస్త్రపు సూక్ష్మ నియమాలకు కట్టుబడే కఠినమైన శిక్షణ అని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: τοῦ πατρῴου νόμου
  choice: పితృపారంపర్య ధర్మశాస్త్రాన్ని
  rationale: πατρῷος అనే విశేషణంలోని ‘పూర్వీకులనుంచి వచ్చిన’ భావాన్ని నిలుపుతూ, గ్రీకులో స్పష్టంగా లేని ‘మన’ అనే సర్వనామాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: ζηλωτὴς ὑπάρχων τοῦ θεοῦ
  choice: దేవునిపట్ల అమితాసక్తి గలవాడిని
  rationale: ζηλωτής లోని తీవ్ర ఉత్సాహం, నిబద్ధతలను తెలియజేస్తూ, రాజకీయ వర్గమైన ‘జీలాట్లు’ అనే సాంకేతిక భావాన్ని దిగుమతి చేయదు.
- source_word: καθὼς πάντες ὑμεῖς ἐστε σήμερον
  choice: ఈ రోజు మీరందరూ ఉన్నట్లే
  rationale: శ్రోతల ప్రస్తుత ఆసక్తితో పౌలు తనను పోల్చుకుంటున్న వాక్చాతుర్యాన్ని యథాతథంగా ఉంచుతుంది.
theological_decisions:
- issue: πατρῴου νόμου లోని సామూహిక పూర్వీకత్వ భావాన్ని ఎలా వ్యక్తం చేయాలి
  choice: పితృపారంపర్య ధర్మశాస్త్రం
  alternative: మన పూర్వీకుల ధర్మశాస్త్రం
  rationale: గ్రీకు విశేషణం పూర్వీకులనుంచి వచ్చిన ధర్మశాస్త్రాన్ని సూచిస్తుంది కానీ ‘మన’ అని ప్రత్యక్షంగా చెప్పదు. ప్రధాన పాఠ్యం ఆ రూపాన్ని కాపాడుతుంది; సందర్భంలోని యూద సామూహిక వారసత్వ భావాన్ని ప్రత్యామ్నాయ పాదసూచిక తెలియజేస్తుంది.
- issue: παρὰ τοὺς πόδας Γαμαλιήλ అనే నుడికారాన్ని ఉంచాలా, అర్థాన్ని మాత్రమే ఇవ్వాలా
  choice: గమలీయేలు పాదాల దగ్గర
  alternative: గమలీయేలు శిష్యరికంలో
  rationale: మూలంలోని గురు-శిష్య దృశ్యాన్ని నిలుపుతూ, పాదసూచిక ద్వారా అపార్థాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రసంగశైలిని వాడాం. పొడవైన గ్రీకు వాక్య నిర్మాణాన్ని చదవడానికి సులభంగా రెండు వాక్యాలుగా విభజించాం; జన్మస్థలం, పెంపకం, విద్య, దేవునిపట్ల ఆసక్తి అనే భావక్రమాన్ని మాత్రం నిలిపాం. ఆంగ్ల సంప్రదింపు పాఠ్యంలో [a] సూచిక తప్పు స్థానంలో కనిపించినందున, దాని పాదసూచిక విషయానికి సరిపోయేలా గమలీయేలు నుడికారం తర్వాత ఉంచాం.
