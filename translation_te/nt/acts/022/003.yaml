  to: “నేను యూదుణ్ని; కిలికియలోని తార్సులో పుట్టాను, అయితే ఈ పట్టణంలో గమలీయేలు పాదాల దగ్గర[a] పెరిగి, పూర్వీకుల ధర్మశాస్త్రం యొక్క కఠినత ప్రకారం విద్యాభ్యాసం చేశాను; ఈ రోజు మీరందరూ ఉన్నట్లే దేవునిపట్ల ఉత్సాహం గలవాడిని.”
