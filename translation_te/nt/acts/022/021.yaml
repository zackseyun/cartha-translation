id: ACT.22.21
reference: Acts 22:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρός με· Πορεύου, ὅτι ἐγὼ εἰς ἔθνη μακρὰν ἐξαποστελῶ σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/021.yaml
  text: And he said to me[a], ‘Go, because I will send you far away to the Gentiles.’
translation:
  language: te
  text: 'ఆయన నాతో ఇలా అన్నాడు: “వెళ్లు, ఎందుకంటే నేను నిన్ను చాలా దూరంలోని అన్యజనుల దగ్గరికి[a] పంపుతాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “జాతుల దగ్గరికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρός με
  choice: ఆయన నాతో ఇలా అన్నాడు
  rationale: πρός + ద్వితీయా విభక్తితో వచ్చిన λέγω నేరుగా ఉద్దేశించి చెప్పిన మాటను పరిచయం చేస్తుంది. తెలుగు ప్రత్యక్ష వాక్యానికి ముందు “ఇలా అన్నాడు” సహజంగా ఉంటుంది.
- source_word: Πορεύου
  choice: వెళ్లు
  rationale: πορεύομαι వర్తమాన మధ్యమ ఆజ్ఞారూపం ఇక్కడ వెళ్లమనే సూటి ఆజ్ఞగా పనిచేస్తుంది; “వెళ్లు” ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఇక్కడ ὅτι ఆజ్ఞకు కారణాన్ని పరిచయం చేస్తుంది; కారణ సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐγὼ
  choice: నేను
  rationale: గ్రీకులో స్పష్టంగా ఉన్న కర్త సర్వనామం కొంత ఉద్ఘాటనను కలిగిస్తుంది; “నేను”ను ఉంచడం ఆ భావాన్ని కాపాడుతుంది.
- source_word: εἰς ἔθνη
  choice: అన్యజనుల దగ్గరికి
  rationale: అపొస్తలుల కార్యములలోని ఈ మిషన్ సందర్భంలో ἔθνη యూదేతర ప్రజలను సూచిస్తుంది. “అన్యజనులు” యూదులు–యూదేతరుల చారిత్రక భేదాన్ని తెలియజేస్తుంది; “జనాలు” అనే విస్తృత ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: μακρὰν
  choice: దూరంగా
  rationale: μακράν పంపబడే స్థల దూరాన్ని నొక్కిచెబుతుంది; “దూరంగా” దాని క్రియావిశేషణ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἐξαποστελῶ
  choice: పంపుతాను
  rationale: ἐξαποστέλλω భవిష్యత్ రూపం బయటికి పంపడం అనే భావాన్ని కలిగించినా, సందర్భంలో “పంపుతాను” సరళమైన, సరిపడిన తెలుగు రూపం.
- source_word: σε
  choice: నిన్ను
  rationale: పంపే క్రియకు ఏకవచన ద్వితీయ పురుష ప్రత్యక్ష కర్మగా మూలపాఠాన్ని సూటిగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: అపొస్తలిక సేవా సందర్భంలో ἔθνη అనువాదం
  choice: అన్యజనులు
  alternative: జనాలు
  rationale: ఈ వచనం పౌలు యూదేతరుల దగ్గరికి పంపబడడాన్ని సూచిస్తుంది. “అన్యజనులు” ఆ చారిత్రక-వేదాంతపరమైన భేదాన్ని అదనపు సిద్ధాంతాన్ని చేర్చకుండా కాపాడుతుంది; ἔθνηకి సాధ్యమైన విస్తృత అర్థమైన “జనాలు”ను పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ప్రత్యక్ష వాక్యాన్ని సహజంగా పరిచయం చేస్తూ, గ్రీకు వాక్యంలోని కారణ సంబంధం, దూరం, యూదేతరుల వైపు పంపబడటం అనే అంశాలను నిలుపుకుంది.
