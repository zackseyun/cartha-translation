id: ACT.22.26
reference: Acts 22:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ ἑκατοντάρχης προσελθὼν ⸂τῷ χιλιάρχῳ ἀπήγγειλεν⸃ λέγων· ⸀Τί μέλλεις ποιεῖν; ὁ γὰρ ἄνθρωπος οὗτος Ῥωμαῖός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/026.yaml
  text: When the centurion heard this[a], he went to the commander and reported it, saying[b], “What are you about to do? For this man is a Roman citizen.”
translation:
  language: te
  text: శతాధిపతి అది విని, సహస్రాధిపతి దగ్గరకు వెళ్లి, “మీరు ఏమి చేయబోతున్నారు?[a] ఎందుకంటే ఈ మనిషి రోమా పౌరుడు[b]” అని అతనికి తెలియజేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు ఏమి చేయనున్నారు?” గ్రీకు ప్రయోగం వెంటనే చేయబోయే చర్యను లేదా చేయాలనే ఉద్దేశాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఈ మనిషి రోమీయుడు.” ఈ సందర్భంలో అతనికి రోమా పౌరసత్వం ఉందనేది భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: అది విని
  rationale: ఈ క్రియావిశేషణ రూపం ప్రధాన చర్యకు ముందు జరిగిన విషయాన్ని సూచిస్తుంది. ‘అది విని’ అనేది సహజమైన తెలుగులో ఆ కాలసంబంధాన్ని నిలుపుతుంది.
- source_word: ἑκατοντάρχης
  choice: శతాధిపతి
  rationale: రోమా సైన్యంలోని నిర్దిష్ట హోదాను సూచించే ప్రాచుర్యంలో ఉన్న తెలుగు పదం; సాధారణమైన ‘అధికారి’ కంటే మూలంలోని హోదాను స్పష్టంగా ఉంచుతుంది.
- source_word: προσελθὼν
  choice: దగ్గరకు వెళ్లి
  rationale: పై అధికారివైపు వెళ్లడాన్ని సహజమైన తెలుగు కథన శైలిలో వ్యక్తం చేస్తుంది.
- source_word: χιλιάρχῳ
  choice: సహస్రాధిపతి
  rationale: రోమా సైన్యంలోని ఉన్నతాధికార హోదాను సూచిస్తుంది; ‘శతాధిపతి’తో ఉన్న హోదా భేదాన్ని కూడా నిలుపుతుంది.
- source_word: ἀπήγγειλεν
  choice: అతనికి తెలియజేశాడు
  rationale: సమాచారాన్ని పై అధికారికి నివేదించడం అనే సందర్భోచిత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: Τί μέλλεις ποιεῖν;
  choice: మీరు ఏమి చేయబోతున్నారు?
  rationale: μέλλω + క్రియారూపం సమీపంలో జరగబోయే చర్యను లేదా ఉద్దేశించిన చర్యను సూచించగలదు. ప్రధాన అనువాదం సమీప చర్య భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ద్వంద్వార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: ὁ γὰρ ἄνθρωπος οὗτος
  choice: ఎందుకంటే ఈ మనిషి
  rationale: γάρ ఇచ్చే కారణ సంబంధాన్ని ‘ఎందుకంటే’ స్పష్టంగా చూపుతుంది; ἄνθρωπος ఇక్కడ ఒక పురుషుణ్ణి సూచిస్తున్నందున ‘మనిషి’ సరిపోతుంది.
- source_word: Ῥωμαῖός ἐστιν
  choice: రోమా పౌరుడు
  rationale: ఈ న్యాయపరమైన సందర్భంలో ‘రోమీయుడు’ అనేది జాతి లేదా నివాసాన్ని కాక రోమా పౌరసత్వాన్ని సూచిస్తుంది; అందువల్ల సందర్భార్థాన్ని స్పష్టంగా తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యనిర్మాణాన్ని ఉపయోగిస్తూ, రోమా సైనిక హోదాల మధ్య భేదాన్ని నిలుపడానికి ‘శతాధిపతి’, ‘సహస్రాధిపతి’ అనే గౌరవప్రదమైన సంప్రదాయ పదాలను వాడాం. పై అధికారిని సంబోధించడంలో తెలుగు మర్యాదా వాడుకకు అనుగుణంగా ‘మీరు’ ఉపయోగించాం. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల వెంట ఉంచాం.
