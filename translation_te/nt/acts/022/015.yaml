  text: ὅτι ἔσῃ μάρτυς αὐτῷ πρὸς πάντας ἀνθρώπους ὧν ἑώρακας καὶ ἤκουσας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/015.yaml
  text: For you will be a witness for him to all people of what you have seen and heard[a][b].
translation:
  language: te
  text: ఎందుకంటే, నీవు చూసినవాటినీ విన్నవాటినీ గురించి ప్రజలందరికీ[a] ఆయన తరఫున[b] సాక్షిగా ఉంటావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రజలందరి ఎదుట.’ గ్రీకు పదబంధం సాక్ష్యం చేరే ప్రజలందరినీ సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆయనకు.’ ఇక్కడి గ్రీకు దత్తివిభక్తిని ఈ రెండు సన్నిహిత భావాల్లో అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఇక్కడ ὅτι పౌలు పొందిన పిలుపుకు వివరణను ఇస్తోంది; ‘ఎందుకంటే’ దాని వివరణాత్మక బలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἔσῃ
  choice: ఉంటావు
  rationale: εἰμί క్రియ భవిష్యత్ రూపాన్ని సరళమైన, సహజమైన తెలుగు భవిష్యత్ క్రియగా అనువదించింది.
- source_word: μάρτυς
  choice: సాక్షిగా
  rationale: μάρτυς చూసినదీ విన్నదీ గురించి సాక్ష్యం చెప్పే వ్యక్తిని సూచిస్తుంది; సందర్భానికి ‘సాక్షిగా’ స్పష్టంగా సరిపోతుంది.
- source_word: αὐτῷ
  choice: ఆయన తరఫున
  rationale: దత్తివిభక్తి రూపం ఎవరి పక్షంగా లేదా ఎవరి విషయమై సాక్ష్యం ఇస్తాడో సూచించగలదు. ‘ఆయన తరఫున’ యేసు పక్షంగా ప్రజల ఎదుట సాక్ష్యం చెప్పే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; సమీప ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: ప్రజలందరి ఎదుట
  rationale: πρός ఇక్కడ సాక్ష్యం చేరే మానవ శ్రోతలను సూచిస్తుంది. ‘ప్రజలందరి ఎదుట’ బహిరంగ సాక్ష్య భావాన్ని, ἀνθρώπους యొక్క సమగ్ర మానవ సూచనను సహజంగా తెలియజేస్తుంది.
- source_word: ὧν
  choice: గురించి
  rationale: సాక్ష్యపు విషయాన్ని తరువాతి ‘చూసినవాటినీ విన్నవాటినీ’తో అనుసంధానించడానికి తెలుగులో ‘గురించి’ సహజమైన సంబంధాన్ని ఏర్పరుస్తుంది.
- source_word: ἑώρακας
  choice: చూసినవాటినీ
  rationale: గ్రీకు పరిపూర్ణ కాలరూపం గతంలో ప్రత్యక్షంగా చూసిన అనుభవాన్ని ప్రస్తుత సాక్ష్యానికి ఆధారంగా చూపుతుంది; నామీకృత తెలుగు రూపం ఆ విషయార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: καὶ ἤκουσας
  choice: విన్నవాటినీ
  rationale: చూడడం, వినడం అనే జత అనుభవాలను సమాంతరంగా ఉంచి, సాక్ష్యం వాటిపై ఆధారపడిందని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: పౌలు పొందిన ఆజ్ఞలో αὐτῷ ఎవరిని, ఏ సంబంధాన్ని సూచిస్తోంది
  choice: ప్రభువైన యేసు తరఫున పౌలు సాక్షిగా ఉంటాడనే భావంతో ‘ఆయన తరఫున’
  alternative: దత్తివిభక్తిని మరింత అక్షరార్థంగా ‘ఆయనకు’ అని అనువదించడం
  rationale: తక్షణ సందర్భంలో పౌలు ప్రభువైన యేసును గూర్చి ఇతరుల ఎదుట సాక్ష్యం ఇవ్వడానికి నియమించబడుతున్నాడు. అయితే గ్రీకు దత్తివిభక్తిలోని సమీప సంబంధార్థాల మధ్య ఉన్న సందిగ్ధతను పూర్తిగా తొలగించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ప్రజలు’ లింగభేదం లేకుండా సమస్త మానవులను సూచిస్తుంది; వాక్యక్రమం తెలుగు సహజత్వానికి అనుగుణంగా మార్చబడింది.
