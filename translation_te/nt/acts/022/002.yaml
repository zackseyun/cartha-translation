- from: 'అతడు తమతో హెబ్రీ భాషలో[a] మాట్లాడుతున్నాడని వారు విన్నప్పుడు, ఇంకా నిశ్శబ్దంగా ఉన్నారు. అప్పుడు అతడు ఇలా అన్నాడు:'
  to: 'అతడు వారితో హెబ్రీ భాషలో[a] మాట్లాడుతున్నాడని వారు విన్నప్పుడు, వారు మరింత నిశ్శబ్దం పాటించారు. మరియు అతడు ఇలా అన్నాడు:'
  rationale: The revision corrects the reflexive pronoun, makes the comparative increase in silence explicit, and renders καὶ φησίν with a direct narrative connector. It retains the source wording ‘Hebrew language’ and preserves the historical-linguistic ambiguity solely in the footnote.
