id: ACT.22.2
reference: Acts 22:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ ὅτι τῇ Ἑβραΐδι διαλέκτῳ προσεφώνει αὐτοῖς μᾶλλον παρέσχον ἡσυχίαν. καὶ φησίν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/002.yaml
  text: 'But when they heard that he was addressing them in the Hebrew language[a], they became even more quiet. And he said:'
translation:
  language: te
  text: 'అతడు వారితో హెబ్రీ భాషలో[a] మాట్లాడుతున్నాడని వారు విన్నప్పుడు, వారు మరింత నిశ్శబ్దం పాటించారు. మరియు అతడు ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, బహుశా ‘అరామిక్ భాషలో.’ గ్రీకు పాఠంలో ‘హెబ్రీ భాషలో’ అని ఉంది; ఈ సందర్భంలో అది యూదయ ప్రాంతపు సెమిటిక్ వాడుకభాషను సూచిస్తుండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: వారు విన్నప్పుడు
  rationale: Aorist participle expresses the circumstance preceding the main reaction. Telugu temporal construction naturally conveys this; δὲ is left implicit because an explicit adversative would be unnatural here and the contextual turn remains clear.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: హెబ్రీ భాషలో
  rationale: The Greek explicitly says ‘Hebrew language/dialect.’ The main text retains that wording rather than resolving the possible historical referent as Aramaic.
- source_word: προσεφώνει αὐτοῖς
  choice: అతడు తమతో ... మాట్లాడుతున్నాడని
  rationale: The imperfect depicts ongoing directed speech. ‘తమతో మాట్లాడుతున్నాడు’ is current, natural Telugu and retains the sense that he was addressing them.
- source_word: μᾶλλον παρέσχον ἡσυχίαν
  choice: ఇంకా నిశ్శబ్దంగా ఉన్నారు
  rationale: This naturally represents the idiom ‘provided greater silence’ and preserves the comparative force of μᾶλλον.
- source_word: καὶ φησίν
  choice: 'అప్పుడు అతడు ఇలా అన్నాడు:'
  rationale: The historical present is rendered as Telugu narrative past; ‘అప్పుడు’ provides a natural transition into the quoted speech, and the colon signals that it follows.
theological_decisions:
- issue: ‘Hebrew language’ అనే పదబంధపు సూచన
  choice: ప్రధాన పాఠంలో ‘హెబ్రీ భాష’ను నిలుపుకోవడం
  alternative: ఆ ప్రాంతపు సెమిటిక్ వాడుకభాష అయిన ‘అరామిక్’ అని అర్థం చేసుకోవడం
  rationale: గ్రీకు పాఠం స్పష్టంగా ‘హెబ్రీ’ అంటుంది. అది ఈ సందర్భంలో అరామిక్‌ను సూచించే అవకాశం ఉన్నప్పటికీ, ఆ చారిత్రక-భాషాపరమైన అనిశ్చితిని ప్రధాన పాఠంలో తీర్చకుండా పాదసూచికలో తెలియజేయడం మూలభాషకు నిబద్ధంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘హెబ్రీ’ అనే మూలపాఠ పదాన్ని ప్రధాన వాక్యంలో ఉంచి, సాధ్యమైన అరామిక్ సూచనను పాదసూచికలో ఇచ్చాం.
