translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. చారిత్రక హోదాకు అతి సాంకేతికమైన పదాన్ని ప్రధాన వచనంలో పెట్టకుండా, వివరాన్ని పాదసూచికలో ఇచ్చాం; Ῥωμαῖος లోని సంక్షిప్తతను ‘రోమీయుడు’గా నిలిపి పౌరసత్వ భావాన్ని పాదసూచికలో స్పష్టం చేశాం.
