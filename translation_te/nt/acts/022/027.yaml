id: ACT.22.27
reference: Acts 22:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: προσελθὼν δὲ ὁ χιλίαρχος εἶπεν αὐτῷ· Λέγε μοι, ⸀σὺ Ῥωμαῖος εἶ; ὁ δὲ ἔφη· Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/027.yaml
  text: So the tribune came up and said to him[a], “Tell me, are you a Roman?” And he said[b], “Yes.”
translation:
  language: te
  text: అప్పుడు సైన్యాధిపతి[a] అతని దగ్గరకు వచ్చి, “నాకు చెప్పు, నువ్వు రోమీయుడివా?[b]” అని అడిగాడు. అతడు, “అవును” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సైనిక దళాధిపతి.” గ్రీకు χιλίαρχος అనే పదం రోమా సైన్యంలో ఒక దళానికి అధికారిగా ఉన్న వ్యక్తిని సూచిస్తుంది; దీనిని సంప్రదాయంగా “ట్రిబ్యూన్” అని కూడా అంటారు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “రోమీయుడు” అంటే చట్టపరమైన అర్థంలో రోమా పౌరుడు అని పరిసర సందర్భం స్పష్టం చేస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: దగ్గరకు వచ్చి
  rationale: προσέρχομαι అనే క్రియలోని సమీపించి రావడం అనే భావాన్ని సహజమైన తెలుగు కథన శైలిలో వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక కథనంలోని తదుపరి చర్యను సూచిస్తుంది.
- source_word: χιλίαρχος
  choice: సైన్యాధిపతి
  rationale: రోమా సైన్యంలో ఒక దళానికి అధికారిగా ఉన్న వ్యక్తిని సూచించే ఈ పదానికి, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన తెలుగు పదం ఇది; నిర్దిష్ట చారిత్రక హోదా పాదసూచికలో వివరించబడింది.
- source_word: εἶπεν αὐτῷ
  choice: అతనితో … అని అడిగాడు
  rationale: మూలంలో సాధారణంగా ‘అతనితో అన్నాడు’ ఉన్నా, వెంట వచ్చే ప్రశ్నను బట్టి తెలుగులో ‘అడిగాడు’ సహజంగా ఉంటుంది; αὐτῷ సూచించే వ్యక్తి సంబంధాన్ని ‘అతని దగ్గరకు’ అనే నిర్మాణం, సంభాషణ సందర్భం స్పష్టం చేస్తాయి.
- source_word: Λέγε μοι
  choice: నాకు చెప్పు
  rationale: ఆజ్ఞార్థక క్రియతో దత్తివాచక సర్వనామం కలిగిన గ్రీకు మాటకు నేరుగా, సహజంగా సరిపోతుంది.
- source_word: σὺ
  choice: నువ్వు
  rationale: గ్రీకులో స్పష్టంగా ఉన్న సర్వనామం ఇచ్చే స్వల్ప ఉద్ఘాటనను తెలుగులో సర్వనామాన్ని ప్రత్యక్షంగా ఉంచడం ద్వారా నిలుపుతుంది.
- source_word: Ῥωμαῖος
  choice: రోమీయుడు
  rationale: విశేషణం నామవాచకంగా వాడబడింది. ఇది సందర్భంలో చట్టపరమైన రోమా పౌరసత్వాన్ని సూచించినా, మూలపదంలోని సంక్షిప్త రూపాన్ని నిలుపుతూ వివరణను పాదసూచికలో ఇస్తుంది.
- source_word: Ναί
  choice: అవును
  rationale: ఏ విస్తరణనూ జోడించకుండా సరళమైన అంగీకార జవాబును ఇస్తుంది.
