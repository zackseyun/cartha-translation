  source_fidelity: The Telugu accurately represents the narrative movement (προσελθών), the Roman officer (χιλίαρχος), the direct imperative question, the explicit second-person pronoun, and Paul's succinct affirmative response. “అడిగాడు” is a natural Telugu speech verb for εἶπεν followed by a direct question and does not alter the sense.
  naturalness: The verse reads naturally in modern standard Telugu. “అతని దగ్గరకు వచ్చి,” “నాకు చెప్పు,” and “నువ్వు రోమీయుడివా?” form an idiomatic, appropriately direct exchange. The concise “అవును” preserves the Greek's brevity.
  terminology: “సైన్యాధిపతి” is an understandable main-text rendering of χιλίαρχος, while footnote a appropriately identifies the more specific Roman military sense and the traditional term “ట్రిబ్యూన్.” “రోమీయుడు” preserves the source's concise wording; footnote b correctly clarifies the contextual sense of Roman citizenship without importing it into the text.
