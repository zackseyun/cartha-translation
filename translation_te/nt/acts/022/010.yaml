id: ACT.22.10
reference: Acts 22:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπον δέ· Τί ποιήσω, κύριε; ὁ δὲ κύριος εἶπεν πρός με· Ἀναστὰς πορεύου εἰς Δαμασκόν, κἀκεῖ σοι λαληθήσεται περὶ πάντων ὧν τέτακταί σοι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/010.yaml
  text: Then I said[a], ‘What should I do, Lord?’ And the Lord said to me, ‘Get up and go into Damascus[b], and there you will be told about everything that has been appointed for you to do.’
translation:
  language: te
  text: అప్పుడు నేను, “ప్రభువా, నేను ఏమి చేయాలి?” అని అన్నాను. ప్రభువు నాతో, “లేచి దమస్కులోకి వెళ్లు. నీవు చేయడానికి నియమించబడిన వాటన్నిటి గురించి అక్కడ నీకు చెప్పబడుతుంది” అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీకు చేయమని అప్పగించబడిన వాటన్నిటి గురించి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ποιήσω
  choice: నేను ఏమి చేయాలి?
  rationale: సలహా లేదా తదుపరి కర్తవ్యాన్ని అడిగే deliberative aorist subjunctive భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κύριε / ὁ ... κύριος
  choice: ప్రభువా / ప్రభువు
  rationale: దమస్కు మార్గ సందర్భంలో యేసును ఉద్దేశించిన κύριος బిరుదులోని క్రీస్తుసంబంధ బలాన్ని నిలుపుతుంది.
- source_word: Ἀναστὰς πορεύου
  choice: లేచి ... వెళ్లు
  rationale: క్రియల వరుసలో ఆజ్ఞార్థకంగా పనిచేసే participleను సహజంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: εἰς Δαμασκόν
  choice: దమస్కులోకి
  rationale: εἰς సూచించే నగరంలోకి ప్రవేశించే గమనాన్ని నిలుపుతుంది.
- source_word: κἀκεῖ σοι λαληθήσεται
  choice: అక్కడ నీకు చెప్పబడుతుంది
  rationale: భవిష్యత్ కర్మణి రూపాన్ని తెలుగులో సహజమైన కర్మణి నిర్మాణంతో వ్యక్తం చేస్తుంది; చెప్పేవారిని మూలపాఠం పేర్కొననందున చేర్చదు.
- source_word: περὶ πάντων
  choice: వాటన్నిటి గురించి
  rationale: περίతో వచ్చిన సమాచార విషయాన్ని స్పష్టంగా తెలియజేస్తూ, తరువాతి సంబంధవాచక భావంతో అనుసంధానిస్తుంది.
- source_word: ὧν τέτακταί σοι ποιῆσαι
  choice: నీవు చేయడానికి నియమించబడిన వాటన్నిటి
  rationale: τάσσω perfect passiveలోని ఇప్పటికే నిర్ణయించబడి కొనసాగుతున్న భావాన్ని నిలుపుతూ, ఎవరు నియమించారో లేదా ఏ సిద్ధాంతపరమైన విధంగా నియమించారో అతిగా నిర్ధారించదు.
theological_decisions:
- issue: τέτακταίలో దైవిక నిర్దేశం మరియు పౌలు సేవా నియామకానికి ఉన్న బలం
  choice: నీవు చేయడానికి నియమించబడిన
  alternative: నీకు చేయమని అప్పగించబడిన
  rationale: పౌలు చేయబోయే కార్యాలు ముందే నిర్దేశించబడ్డాయనే భావాన్ని నిలుపుతుంది; అయితే ఈ వాక్యం చెప్పేదానికంటే బలమైన పూర్వనిర్ణయ సిద్ధాంతాన్ని దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ప్రత్యక్ష సంభాషణ సహజంగా ఉంచబడింది; కర్మణి నిర్మాణం ద్వారా మూలంలోని అనిర్దిష్ట కర్తను కాపాడాం. ఫుట్‌నోట్ సూచిక ప్రధాన పాఠ్యంలో సంబంధిత వాక్యాంతంలో ఉంచబడింది.
