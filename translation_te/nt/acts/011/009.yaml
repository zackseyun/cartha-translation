id: ACT.11.9
reference: Acts 11:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη δὲ ⸂φωνὴ ἐκ δευτέρου⸃ ἐκ τοῦ οὐρανοῦ· Ἃ ὁ θεὸς ἐκαθάρισεν σὺ μὴ κοίνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/009.yaml
  text: But a voice answered from heaven a second time[a], ‘What God has made clean, you must not call common.’
translation:
  language: te
  text: 'అయితే పరలోకం నుండి ఒక స్వరం రెండవసారి జవాబిచ్చింది: “దేవుడు శుద్ధి చేసినవాటిని నీవు సామాన్యమైనవిగా పిలవవద్దు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు శుద్ధి చేసినవాటిని నీవు అపవిత్రమైనవిగా పరిగణించవద్దు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: జవాబిచ్చింది
  rationale: ἀποκρίνομαι యొక్క సందర్భానుగుణ అర్థం ‘జవాబివ్వడం’; కథన క్రమంలో ఇది సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: φωνὴ
  choice: ఒక స్వరం
  rationale: గ్రీకులో నిర్దిష్ట వక్తను పేర్కొనకుండా φωνή కర్తగా ఉంది; ‘ఒక స్వరం’ ఆ అనిర్దిష్టతను నిలుపుతుంది.
- source_word: ἐκ δευτέρου
  choice: రెండోసారి
  rationale: ఈ గ్రీకు నుడికారం ‘రెండవసారి’ అని అర్థం; ‘రెండోసారి’ సహజమైన ఆధునిక తెలుగు.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: పరలోకం నుండి
  rationale: ఈ దర్శన సందర్భంలో οὐρανός కేవలం ఆకాశాన్ని కాక పరలోకాన్ని సూచిస్తుంది.
- source_word: Ἃ
  choice: చేసినవాటిని
  rationale: నపుంసక బహువచన సంబంధ సర్వనామ భావాన్ని తెలుగు బహువచన రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ θεὸς
  choice: దేవుడు
  rationale: గ్రీకు కర్తకు నేరమైన, సాధారణ తెలుగు అనువాదం.
- source_word: ἐκαθάρισεν
  choice: శుద్ధి చేసిన
  rationale: καθαρίζω అంటే శుభ్రపరచడం లేదా శుద్ధి చేయడం; ఆచారపరమైన పరిశుద్ధత సందర్భాన్ని ‘శుద్ధి చేసిన’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: σὺ
  choice: నీవు
  rationale: గ్రీకులోని స్పష్టమైన సర్వనామం నొక్కిచెప్పబడింది; ‘నీవు’ దానిని తెలుగులో నిలుపుతుంది.
- source_word: μὴ κοίνου
  choice: అపవిత్రమైనవిగా ఎంచవద్దు
  rationale: κοινόω ఇక్కడ ‘సామాన్యమైనది/ఆచారపరంగా అపవిత్రమైనది అని పరిగణించడం’ అనే భావంలో ఉంది. ‘ఎంచవద్దు’ మానవ వర్గీకరణను సూచిస్తూ సహజంగా ఉంటుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
theological_decisions:
- issue: κοινόωలోని శుద్ధి–అపవిత్రత భావసూక్ష్మత
  choice: అపవిత్రమైనవిగా ఎంచవద్దు
  alternative: సామాన్యమైనవిగా పిలవవద్దు
  rationale: ‘సామాన్యమైనవి’ అనే అక్షరార్థ తెలుగు ఈ ఆచారపరమైన సందర్భంలో సాధారణ పాఠకులకు అస్పష్టంగా ఉండవచ్చు. ‘అపవిత్రమైనవిగా ఎంచవద్దు’ శుద్ధి వర్గీకరణను సహజంగా తెలియజేస్తుంది; అయితే κοινόω యొక్క ‘common/profane’ భావాన్ని పాదసూచికలో భద్రపరచడం ద్వారా మూలంలోని భావ ఉద్రిక్తతను పూర్తిగా చెరపలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. ‘పరలోకం’, ‘శుద్ధి’, ‘అపవిత్రం’ పదాలు సందర్భంలోని ఆచారపరమైన భావాన్ని కాపాడుతాయి.
