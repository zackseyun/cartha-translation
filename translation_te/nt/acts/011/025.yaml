    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: వెళ్లాడు
  rationale: ἐξέρχομαι అనే క్రియలోని బయలుదేరి వెళ్లే భావం సందర్భంలో సహజమైన ఆధునిక తెలుగులో ‘వెళ్లాడు’తో వ్యక్తమవుతుంది; ‘బయలుదేరాడు’ అని అనువదిస్తే గమ్యస్థానానికి వెళ్లిన భావం కొంత తగ్గుతుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ δέ వ్యతిరేకతను కాక కథనాన్ని ముందుకు నడిపే సున్నితమైన అనుసంధానాన్ని సూచిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన ప్రవాహాన్ని ఇస్తుంది.
- source_word: εἰς Ταρσόν
  choice: తార్సుకు
  rationale: చలన క్రియతో εἰς గమ్యస్థానాన్ని సూచిస్తుంది; తెలుగు విభక్తి రూపమైన ‘తార్సుకు’ ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀναζητῆσαι
  choice: వెదకడానికి
  rationale: ఈ ఆరిస్ట్ ఇన్ఫినిటివ్ ఉద్దేశాన్ని తెలియజేస్తుంది. ‘వెదకడానికి’ స్పష్టమైన, సాధారణ ఆధునిక తెలుగు; మూలపదంలో ఉండగల మరింత శ్రద్ధగా వెతికే భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: Σαῦλον
  choice: సౌలును
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు రూపంలో లిప్యంతరీకరించి, వాక్యంలోని కర్మను స్పష్టంగా చూపేందుకు ద్వితీయా విభక్తి చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని పదక్రమాన్ని కఠినంగా అనుకరించకుండా, ఉద్దేశార్థక క్రియారూపాన్ని సహజంగా ఉంచాం.
