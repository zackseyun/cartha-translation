id: ACT.11.24
reference: Acts 11:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ἦν ἀνὴρ ἀγαθὸς καὶ πλήρης πνεύματος ἁγίου καὶ πίστεως. καὶ προσετέθη ὄχλος ἱκανὸς τῷ κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/024.yaml
  text: For he was a good man[a], full of the Holy Spirit and of faith. And a considerable crowd was added to the Lord.
translation:
  language: te
  text: ఎందుకంటే అతడు మంచి మనిషి, పరిశుద్ధాత్మతోనూ విశ్వాసంతోనూ[a] నిండినవాడు. గణనీయమైన జనసమూహం ప్రభువుకు చేర్చబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నమ్మకత్వంతోనూ.” గ్రీకు పదమైన పిస్టిస్‌కు “విశ్వాసం,” “నమ్మకం,” లేదా “నమ్మకత్వం” అనే అర్థాలు ఉండవచ్చు; ఇక్కడ ప్రధాన పాఠ్యంలో సాధారణ అనువాదమైన “విశ్వాసం” ఉంచబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలో బర్నబా గురించి చెప్పిన విషయానికి కారణాన్ని లేదా వివరణను పరిచయం చేసే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀνὴρ ἀγαθὸς
  choice: మంచి మనిషి
  rationale: బర్నబాను సూచించే పురుష ఏకవచన భావాన్నీ, ἀγαθός తెలిపే నైతిక మంచితనాన్నీ నేరుగా నిలుపుతుంది.
- source_word: πλήρης πνεύματος ἁγίου
  choice: పరిశుద్ధాత్మతో నిండినవాడు
  rationale: పరిశుద్ధాత్మను దైవిక వ్యక్తిగా సూచిస్తూ, πλήρης‌తో వచ్చిన సంబంధాన్ని సహజమైన తెలుగు ప్రయోగంలో అందిస్తుంది.
- source_word: πίστεως
  choice: విశ్వాసం
  rationale: πίστις‌కు సాధారణంగా సరిపోయే అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచుతుంది; ఈ సందర్భంలో సాధ్యమైన ‘నమ్మకత్వం’ అనే భావాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: προσετέθη
  choice: చేర్చబడ్డారు
  rationale: గ్రీకు కర్మణి రూపాన్ని నిలుపుతూ, వ్యక్తులు ప్రభువుకు చేర్చబడినట్లు సహజమైన తెలుగులో చెబుతుంది.
- source_word: ὄχλος ἱκανὸς
  choice: అనేకమంది
  rationale: ‘గణనీయమైన జనసమూహం’ అనే మూలభావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; వచనసమ్మతి కోసం క్రియను బహువచనంలో ఉంచింది.
- source_word: τῷ κυρίῳ
  choice: ప్రభువుకు
  rationale: గ్రీకు పాఠ్యంలో స్పష్టంగా ఉన్న లక్ష్యాన్ని ‘సంఘానికి’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: πνεύματος ἁγίου యొక్క సూచన
  choice: దైవిక వ్యక్తియైన పరిశుద్ధాత్మ
  alternative: పరిశుద్ధమైన ఆత్మ లేదా స్వభావం
  rationale: లూకా–అపొస్తలుల కార్యములలో ఈ పదబంధం సాధారణంగా పరిశుద్ధాత్మనే సూచిస్తుంది; ఇక్కడ బర్నబా లక్షణవర్ణన కూడా అదే భావానికి అనుగుణంగా ఉంది.
- issue: πίστεως యొక్క భావఛాయ
  choice: విశ్వాసం
  alternative: నమ్మకత్వం
  rationale: ఈ సందర్భంలో దేవునిపై నమ్మకం మరియు విశ్వసనీయ స్వభావం రెండూ భావసాధ్యాలు. ప్రధాన పాఠ్యంలో సాధారణ అర్థమైన ‘విశ్వాసం’ ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
- issue: προσετέθη ... τῷ κυρίῳలో ఎవరికి చేర్చబడ్డారనే విషయం
  choice: ప్రభువుకు చేర్చబడ్డారు
  alternative: సంఘానికి లేదా విశ్వాసుల సమాజానికి చేర్చబడ్డారు
  rationale: సంఘంలో చేరడం సందర్భపరంగా అంతర్లీనంగా ఉన్నా, గ్రీకు పాఠ్యం నేరుగా ‘ప్రభువుకు’ అని చెబుతుంది; అందువల్ల ఆ ఉద్రిక్తతను వ్యాఖ్యానంతో తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘అనేకమంది’ అనే రూపం ὄχλος ἱκανός యొక్క సమూహార్థాన్ని సహజంగా అందిస్తుంది; ‘ప్రభువుకు’ అనే అసలు సంబంధాన్ని యథాతథంగా నిలిపాం.
