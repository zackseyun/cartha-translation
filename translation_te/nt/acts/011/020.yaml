id: ACT.11.20
reference: Acts 11:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἦσαν δέ τινες ἐξ αὐτῶν ἄνδρες Κύπριοι καὶ Κυρηναῖοι, οἵτινες ⸀ἐλθόντες εἰς Ἀντιόχειαν ἐλάλουν ⸀καὶ πρὸς τοὺς ⸀Ἑλληνιστάς, εὐαγγελιζόμενοι τὸν κύριον Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/020.yaml
  text: But some of them were men from Cyprus and Cyrene[a], who, when they came to Antioch, were also speaking to the Hellenists, proclaiming the good news about the Lord Jesus.
translation:
  language: te
  text: అయితే వారిలో కొందరు కుప్రు, కురేనేలకు చెందిన పురుషులు; వారు అంతియొకయకు వచ్చినప్పుడు, గ్రీకు భాష మాట్లాడే యూదులతో[a] కూడా మాట్లాడుతూ, ప్రభువైన యేసును గురించిన శుభవార్తను ప్రకటించేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో “గ్రీకు భాష మాట్లాడే యూదులు”కు బదులుగా “గ్రీకులు” అని ఉంది. ఆ పాఠమే మూలపాఠమైతే, వారు గ్రీకు భాష మాట్లాడే యూదులతో కాక యూదేతరులతో మాట్లాడారని అర్థం.
    reason: textual_variant
lexical_decisions:
- source_word: τινες
  choice: కొందరు
  rationale: ముందు ప్రస్తావించిన సమూహంలోని నిర్దిష్టంగా గుర్తించని కొంతమందిని సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన రూపం.
- source_word: ἄνδρες
  choice: పురుషులు
  rationale: మూలంలోని పదం వయోజన మగవారిని ప్రత్యేకంగా సూచిస్తుంది; సాధారణ వ్యక్తులనే సూచించే పదంగా మార్చలేదు.
- source_word: Κύπριοι καὶ Κυρηναῖοι
  choice: కుప్రు, కురేనేలకు చెందిన
  rationale: ఈ విశేషణాలు వారి స్వస్థలాలను సూచిస్తున్నాయి; తెలుగులో ప్రాంతాలకు చెందినవారని చెప్పడం సహజంగా ఉంటుంది.
- source_word: ἐλθόντες εἰς Ἀντιόχειαν
  choice: వారు అంతియొకయకు వచ్చినప్పుడు
  rationale: అయోరిస్ట్ కృదంతానికి ఇక్కడ కాలసంబంధమైన భావం ఉంది; దానిని సహజమైన తెలుగు ఉపవాక్యంగా వ్యక్తం చేసింది.
- source_word: ἐλάλουν
  choice: మాట్లాడుతూ ... ప్రకటించేవారు
  rationale: ఇంపర్ఫెక్ట్ రూపంలోని కొనసాగుతున్న లేదా పునరావృతమైన కార్యభావాన్ని ‘ప్రకటించేవారు’ కాపాడుతుంది.
- source_word: καὶ
  choice: కూడా
  rationale: మునుపటి శ్రోతల పరిధికి ఈ వర్గం కూడా చేరిందనే అనుబంధ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: గ్రీకు భాష మాట్లాడే యూదులతో
  rationale: SBLGNTలోని Ἑλληνιστάς సాధారణంగా గ్రీకు భాష మాట్లాడే యూదులను సూచిస్తుంది; అపరిచితమైన పారిభాషిక పదం కంటే అర్థాన్ని స్పష్టంగా తెలిపింది.
- source_word: εὐαγγελιζόμενοι
  choice: శుభవార్తను ప్రకటిస్తూ
  rationale: మాట్లాడిన దాని స్వభావం సువార్త ప్రకటన అని సులభంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὸν κύριον Ἰησοῦν
  choice: ప్రభువైన యేసును గురించిన
  rationale: κύριος అనే క్రీస్తుసంబంధ బిరుదును ‘ప్రభువు’గా నిలిపి, తెలుగులో శుభవార్త యొక్క విషయాన్ని సహజంగా వ్యక్తం చేసింది.
theological_decisions:
- issue: τοὺς Ἑλληνιστάς అనే పాఠం మరియు Ἕλληνας అనే పాఠాంతరం
  choice: ప్రధాన పాఠంలో SBLGNTలోని ‘గ్రీకు భాష మాట్లాడే యూదులు’ అనే పాఠాన్ని అనుసరించింది.
  alternative: కొన్ని ప్రతుల ప్రకారం ‘గ్రీకులు,’ అంటే యూదేతరులు.
  rationale: ఇది కథనంలో సువార్త విస్తరణ ఎవరికి జరిగిందనే విషయంలో ప్రాముఖ్యమైన పాఠాంతరం. అందించిన గ్రీకు మూలపాఠాన్ని ప్రధాన పాఠంలో అనుసరిస్తూ, ప్రత్యామ్నాయ పాఠాన్ని పాదసూచికలో భద్రపరచడం అసలైన అనిశ్చితిని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించింది. ‘హెల్లెనిస్టులు’ అనే అపరిచిత పదానికి బదులుగా దాని సందర్భోచిత అర్థమైన ‘గ్రీకు భాష మాట్లాడే యూదులు’ అని ఇచ్చింది; ప్రధాన పాఠంలోని [a] గుర్తు పాఠాంతర పాదసూచికతో అనుసంధానించబడింది.
