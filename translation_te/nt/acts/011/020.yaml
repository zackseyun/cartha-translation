revisions:
- from: అయితే వారిలో కొందరు కుప్రు, కురేనేలకు చెందిన పురుషులు. వారు అంతియొకయకు వచ్చినప్పుడు, గ్రీకు భాష మాట్లాడే యూదులతో[a] కూడా మాట్లాడుతూ, ప్రభువైన యేసును గురించిన శుభవార్తను ప్రకటించేవారు.
