id: ACT.11.21
reference: Acts 11:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἦν χεὶρ κυρίου μετ’ αὐτῶν, πολύς τε ἀριθμὸς ⸀ὁ πιστεύσας ἐπέστρεψεν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/021.yaml
  text: And the hand of the Lord was with them[b][a], and a great number who believed turned to the Lord.
translation:
  language: te
  text: ప్రభువు హస్తం వారికి తోడుగా ఉండింది[a], మరియు గొప్ప సంఖ్యలో ప్రజలు విశ్వసించి[b] ప్రభువు వైపు తిరిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రభువు చెయ్యి’; ఈ బైబిలీయ నానుడి ప్రభువు క్రియాశీల శక్తిని లేదా అనుగ్రహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘విశ్వసించినవారు’.
    reason: lexical_alternative
lexical_decisions:
- source_word: χεὶρ κυρίου
  choice: ప్రభువు హస్తం
  rationale: ప్రభువు క్రియాశీల శక్తిని లేదా అనుగ్రహాన్ని సూచించే బైబిలీయ రూపకాన్ని నిలుపుతుంది. ‘చెయ్యి’ కంటే ‘హస్తం’ ఈ స్థిరమైన గౌరవప్రద ప్రయోగంలో సహజంగా ఉంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: గ్రీకు బిరుదును బలహీనపరచకుండా, సందర్భం నిర్దిష్టంగా చెప్పనిదాన్ని అనువాదంలో చేర్చకుండా ఉంచుతుంది.
- source_word: μετ’ αὐτῶν
  choice: వారికి తోడుగా
  rationale: దైవిక సన్నిధి మరియు సహాయం వారితో ఉన్నాయనే μετά + genitive భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πολύς τε ἀριθμός
  choice: గొప్ప సంఖ్యలోని ప్రజలు
  rationale: వ్యక్తుల గొప్ప సంఖ్యను సూచించే నామవాచక నిర్మాణాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ πιστεύσας
  choice: విశ్వసించిన
  rationale: ఆర్టికల్‌తో ఉన్న aorist participle‌ను సమూహార్థంలో ఉంచుతుంది; క్రియల మధ్య ఖచ్చితమైన కాలక్రమాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: ἐπέστρεψεν ἐπὶ τὸν κύριον
  choice: ప్రభువు వైపు తిరిగారు
  rationale: ప్రభువు వైపు మళ్లడం లేదా పరివర్తన చెందడం అనే భావాన్ని కాపాడుతూ, మూలంలో స్పష్టంగా లేని ‘పశ్చాత్తాపం’ లేదా ‘తిరిగి రావడం’ అనే భావాలను చేర్చదు.
theological_decisions:
- issue: ఈ సందర్భంలో ‘ప్రభువు’ ఎవరిని సూచిస్తుంది
  choice: రెండు చోట్లా ‘ప్రభువు’ అని మాత్రమే అనువదించడం
  alternative: ‘యేసు ప్రభువు’ అని స్పష్టీకరించడం లేదా ‘దేవుడు’ అని పేర్కొనడం
  rationale: అపొస్తలుల కార్యములలో κύριος సందర్భానుసారం యేసును సూచించగలిగినా, ఈ గ్రీకు వాక్యం కేవలం ‘ప్రభువు’ అని చెబుతుంది. అందువల్ల మూలంలోని భావవిస్తృతిని కాపాడాం.
- issue: విశ్వాసం మరియు ప్రభువు వైపు తిరగడం మధ్య సంబంధం
  choice: ‘విశ్వసించిన’ అనే participle భావాన్ని నిలుపుతూ రెండు క్రియలను అనువదించడం
  alternative: ‘విశ్వసించి ప్రభువు వైపు తిరిగారు’ అని స్పష్టమైన వరుసను నిర్ణయించడం
  rationale: aorist participle ప్రధాన క్రియకు ముందున్న చర్యను సూచించవచ్చుగానీ, ఇక్కడ అది విశ్వసించిన సమూహాన్ని వర్ణించడమూ కావచ్చు. అనువాదం ఆ స్వల్ప అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రద శైలి. బైబిలీయ రూపకాన్ని నిలుపుతూ వాక్య నిర్మాణాన్ని సహజంగా ఉంచాం; footnote గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
