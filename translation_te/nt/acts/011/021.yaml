  - marker: b
    text: లేదా ‘విశ్వసించినవారు’.
    reason: lexical_alternative
  revision_rationale: The revision changes the first clause to past tense in accordance with ἦν and replaces an unnatural nominal phrase with standard Telugu. ‘విశ్వసించి’ appropriately renders the aorist participle in relation to the main verb; the alternative footnote records the collective substantival sense. The Lord’s identity remains unexpanded, as in the Greek.
