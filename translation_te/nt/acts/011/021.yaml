revisions:
- from: ప్రభువు హస్తం వారికి తోడుగా ఉంది[a]. విశ్వసించిన[b] గొప్ప సంఖ్యలోని ప్రజలు ప్రభువు వైపు తిరిగారు.
  to: ప్రభువు హస్తం వారికి తోడుగా ఉండింది[a], మరియు గొప్ప సంఖ్యలో ప్రజలు విశ్వసించి[b] ప్రభువు వైపు తిరిగారు.
  rationale: The revision changes the first clause to past tense in accordance with ἦν and replaces an unnatural nominal phrase with standard Telugu. ‘విశ్వసించి’ appropriately renders the aorist participle in relation to the main verb; the alternative footnote records the collective substantival sense. The Lord’s identity remains unexpanded, as in the Greek.
