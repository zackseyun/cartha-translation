id: ACT.11.19
reference: Acts 11:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διασπαρέντες ἀπὸ τῆς θλίψεως τῆς γενομένης ἐπὶ Στεφάνῳ διῆλθον ἕως Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας μηδενὶ λαλοῦντες τὸν λόγον εἰ μὴ μόνον Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/019.yaml
  text: So then[a], those who had been scattered because of the affliction that arose over Stephen went as far as Phoenicia and Cyprus and Antioch[c][b], speaking the word to no one except Jews.
translation:
  language: te
  text: కాబట్టి, స్తెఫను విషయంలో తలెత్తిన శ్రమ[a] కారణంగా చెదరిపోయినవారు ఫొయినీకే, కుప్ర, అంతియొకయ వరకు వెళ్లారు; యూదులకు తప్ప మరెవరికీ వాక్యాన్ని[b] చెప్పలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శ్రమ’కు బదులుగా ‘హింస’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం సందర్భానుసారం బాధ, ఇబ్బంది, ఒత్తిడి లేదా హింసను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘వాక్యం’ అంటే యేసును గురించి ప్రకటించిన సందేశం; ‘సందేశం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διασπαρέντες
  choice: చెదరిపోయినవారు
  rationale: అఒరిస్ట్ కర్మణి కృదంతంలోని గత సంఘటనను, కర్మణి భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: θλίψεως
  choice: శ్రమ
  rationale: ఈ సందర్భంలో హింసాత్మక ఒత్తిడి ఉన్నప్పటికీ, గ్రీకు పదం బాధ, ఇబ్బంది, శ్రమ వంటి విస్తృత అర్థపరిధిని కలిగి ఉంది; ‘శ్రమ’ ఆ విస్తృతిని కాపాడుతుంది.
- source_word: τῆς γενομένης ἐπὶ Στεφάνῳ
  choice: స్తెఫను విషయంలో తలెత్తిన
  rationale: స్తెఫనుతో సంబంధమున్న సంఘటనల వల్ల చెలరేగిన శ్రమ అనే అనుబంధ/కారణ భావాన్ని, అతని వ్యక్తిగత బాధకే పరిమితం చేయకుండా తెలియజేస్తుంది.
- source_word: διῆλθον ἕως
  choice: వరకు వెళ్లి
  rationale: ప్రయాణం విస్తరించిన భౌగోళిక హద్దును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας
  choice: ఫొయినీకే, కుప్ర, అంతియొకయ
  rationale: మూల భాషలోని స్థలనామాలకు దగ్గరగా ఉండే, తెలుగు బైబిలు పాఠకులకు పరిచితమైన రూపాలు.
- source_word: λαλοῦντες τὸν λόγον
  choice: వాక్యాన్ని ప్రకటించారు
  rationale: ‘వాక్యం’ అనే లూకా రచనలలో పునరావృతమయ్యే పదప్రయోగాన్ని నిలుపుతూ, ఈ సందర్భంలో ఇతరులకు సందేశం తెలియజేయడాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μηδενὶ ... εἰ μὴ μόνον Ἰουδαίοις
  choice: యూదులకు మాత్రమే
  rationale: εἰ μή మరియు μόνον కలిగించే నిర్బంధక ఉద్ఘాటనను సంక్షిప్తమైన సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: స్తెఫను తరువాతి విరోధం యొక్క స్వభావం
  choice: θλῖψις‌ను ప్రధాన పాఠంలో ‘శ్రమ’గా అనువదించడం
  alternative: హింస
  rationale: కథా సందర్భం హింసను సూచించినా, మూలపదం దానికంటే విస్తృతమైన బాధ లేదా ఒత్తిడిని సూచించగలదు; అందువల్ల ప్రధాన పాఠం అర్థాన్ని అనవసరంగా సంకుచితం చేయదు.
- issue: అపొస్తలుల కార్యములలో τὸν λόγον అర్థం
  choice: ‘వాక్యం’ అనే మూలానికి సమీపమైన పదాన్ని నిలుపడం
  alternative: సందేశం; యేసును గురించిన సువార్త సందేశం
  rationale: లూకా రచనలలోని అంశపరమైన పదప్రయోగాన్ని నిలుపుతుంది; మరింత వివరణాత్మక అర్థాన్ని ప్రధాన పాఠంలో చేర్చకుండా పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ‘వాక్యం’ వంటి లూకా రచనల కీలక పదప్రయోగం నిలుపబడింది. ‘యూదులకు మాత్రమే’ ద్వారా మూలంలోని ఉద్ఘాటన కాపాడబడింది.
