id: ACT.11.18
reference: Acts 11:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ ταῦτα ἡσύχασαν καὶ ⸀ἐδόξασαν τὸν θεὸν λέγοντες· ⸀Ἄρα καὶ τοῖς ἔθνεσιν ὁ θεὸς τὴν μετάνοιαν ⸂εἰς ζωὴν ἔδωκεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/018.yaml
  text: When they heard these things[a], they became quiet and glorified God, saying[b], “Then God has also granted to the Gentiles the change of mind that leads to life.”
translation:
  language: te
  text: 'వారు ఈ సంగతులు విన్నప్పుడు నిశ్శబ్దమై, దేవుణ్ణి మహిమపరుస్తూ ఇలా అన్నారు: “అయితే దేవుడు యూదేతరులకు[a] కూడా జీవానికి నడిపించే మారుమనస్సును[b] అనుగ్రహించాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘జనములకు.’ ఇక్కడ ἔθνεσιν యూదులు కానివారిని సూచిస్తుంది; అందువల్ల ‘యూదేతరులకు’ అనేది సందర్భానికి తగినది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘జీవంలోనికి తీసుకెళ్లే మారుమనస్సును’ లేదా ‘జీవం కోసం మారుమనస్సును.’ εἰς ζωήν అనే గ్రీకు పదబంధం జీవం వైపు గమ్యాన్ని లేదా జీవం అనే ఫలితాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες δὲ ταῦτα
  choice: వారు ఈ సంగతులు విన్నప్పుడు
  rationale: అయోరిస్ట్ కృదంతంలోని కాలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; δέ ఇక్కడ స్వల్ప అనుసంధాన పదం కావడంతో వాక్యప్రవాహంలో కలిసిపోయింది.
- source_word: ἡσύχασαν
  choice: నిశ్శబ్దమై
  rationale: మునుపటి అభ్యంతరాలు ఆగి వారు మౌనమైన భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; వారు వెంటనే మాట్లాడారనే తరువాతి వాక్యంతో విరోధం కలగదు.
- source_word: ἐδόξασαν τὸν θεόν
  choice: దేవుణ్ణి మహిమపరుస్తూ
  rationale: δοξάζω యొక్క బలమైన ఆరాధనా భావాన్ని, లూకా–అపొస్తలుల కార్యములలోని పదప్రయోగానికి అనుగుణంగా నిలుపుతుంది.
- source_word: λέγοντες
  choice: ఇలా అన్నారు
  rationale: వారి ప్రతిస్పందనలోని మాటలను సహజ తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో పరిచయం చేస్తుంది.
- source_word: Ἄρα καὶ
  choice: అయితే ... కూడా
  rationale: Ἄρα సూచించే నిర్ధారణను ‘అయితే’ వ్యక్తం చేస్తుంది; καί దేవుని కార్యం యూదేతరులకూ విస్తరించిందనే సమ్మిళిత ఉద్ఘాటనను ‘కూడా’ నిలుపుతుంది.
- source_word: τοῖς ἔθνεσιν
  choice: యూదేతరులకు
  rationale: ఈ సందర్భంలో ἔθνη భౌగోళిక దేశాలను కాక యూదులు కాని ప్రజలను సూచిస్తుంది; ‘యూదేతరులు’ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: τὴν μετάνοιαν
  choice: మారుమనస్సును
  rationale: μετάνοιαను కేవలం విచారంగా పరిమితం చేయకుండా, మనస్సు మరియు దిశ మార్పు అనే బైబిలు భావాన్ని తెలిపే స్థిరమైన తెలుగు పదాన్ని ఉపయోగిస్తుంది.
- source_word: εἰς ζωὴν
  choice: జీవానికి నడిపించే
  rationale: εἰς లోని గమ్యం లేదా ఫలితం అనే నిజమైన అర్థసంభావ్యతను సహజ తెలుగులో నిలుపుతుంది; దానిని కేవలం కారణం లేదా సాధనంగా నిర్ణయించదు.
- source_word: ἔδωκεν
  choice: అనుగ్రహించాడు
  rationale: దేవుడు మారుమనస్సును ఇచ్చాడనే బహుమాన భావాన్ని వ్యక్తం చేస్తుంది; గ్రీకు అయోరిస్ట్ సూచించే పూర్తయిన కార్యాన్ని తెలుగు భూతకాలంలో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: మారుమనస్సు దేవుడు ఇచ్చినదిగా వర్ణించబడటం
  choice: ‘దేవుడు ... మారుమనస్సును అనుగ్రహించాడు’ అని స్పష్టంగా ఉంచడం
  alternative: ‘వారు మారుమనస్సు పొందే అవకాశం ఇచ్చాడు’ లేదా మానవ ప్రతిస్పందనను ముందుకు తెచ్చే విస్తృత రూపం
  rationale: గ్రీకు వాక్యంలో దేవుడే కర్త, μετάνοια ఇచ్చిన వరంగా ఉంటుంది. ఈ వచనం చెప్పినదానికంటే ముందుకు వెళ్లి దైవ కార్యం–మానవ ప్రతిస్పందన సంబంధాన్ని ఒక నిర్దిష్ట సిద్ధాంతంతో పరిష్కరించకుండా అదే ఉద్రిక్తతను నిలుపుతుంది.
- issue: εἰς ζωήν లో గమ్యం లేదా ఫలితం
  choice: ‘జీవానికి నడిపించే’
  alternative: ‘జీవం కోసం’ లేదా ‘జీవంలోనికి’
  rationale: గ్రీకు ప్రయోగం జీవాన్ని గమ్యంగా లేదా ఫలితంగా సూచించగలదు. ఎంచుకున్న రూపం రెండింటి మధ్య ఉన్న సమీప భావాన్ని కాపాడుతూ సహజ తెలుగులో అర్థమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘మారుమనస్సు’ బైబిలు పరిచయం ఉన్న పదమే అయినా, ‘పశ్చాత్తాపం’లో ఉండే కేవలం విచార భావం కంటే మూలపదంలోని దిశామార్పును మెరుగ్గా నిలుపుతుంది. మూల ఇంగ్లీషు సంప్రదింపు పాఠ్యంలో సూచికలు సంబంధంలేని స్థానాల్లో కనిపించినందున, [a]ను ἔθνεσιν అనువాదం వద్దకు, [b]ను μετάνοια εἰς ζωήν అనువాదం వద్దకు ఉంచి పాదటిప్పణుల విషయంతో సరిపోల్చాం.
