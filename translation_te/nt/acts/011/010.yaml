  yaml_path: translation/nt/acts/011/010.yaml
  text: This happened three times[a], and everything was drawn up again into heaven.
translation:
  language: te
  text: ఇది మూడుసార్లు జరిగింది; అంతా మళ్లీ పరలోకంలోకి ఎత్తబడింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అంతా మళ్లీ పరలోకంలోకి తీసుకోబడింది.”
    reason: ἀνεσπάσθη అనే కర్మణి క్రియకు ‘ఎత్తబడింది’తో పోలిస్తే కొంత సాధారణమైన మరో సహజ అనువాదం.
lexical_decisions:
- source_word: τοῦτο
  choice: ఇది
  rationale: ముందు వివరించిన సంఘటనను సూచిస్తుంది. మూలంలో ‘దర్శనం’ అనే పదం స్పష్టంగా లేనందున దాన్ని చేర్చలేదు.
- source_word: δὲ
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి పరిణామాన్ని సహజమైన ఆధునిక తెలుగులో కలిపే మృదువైన సంధాన పదంగా వాడబడింది.
- source_word: ἐγένετο
  choice: జరిగింది
  rationale: ఒక సంఘటన సంభవించడాన్ని తెలిపే సహజమైన తెలుగు రూపం.
- source_word: ἐπὶ τρίς
  choice: మూడుసార్లు
  rationale: అదే సంఘటన మూడు పర్యాయాలు జరిగినదనే గ్రీకు నుడికారాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: ἀνεσπάσθη
  choice: పైకి లాగబడింది
  rationale: బయటి శక్తిచేత పైకి కదిలించబడిన భావాన్నీ, గ్రీకులోని కర్మణి ప్రయోగాన్నీ నిలుపుతుంది; కర్తను ఊహించి చేర్చదు.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: తిరిగి లేదా మరొకసారి జరిగిన పైకి కదలికను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἅπαντα
  choice: అంతా
  rationale: దేనిని ప్రత్యేకంగా సూచిస్తున్నదో సంకుచితం చేయకుండా, సమగ్రతను తెలిపే గ్రీకు నపుంసక బహువచన భావాన్ని నిలుపుతుంది.
- source_word: εἰς τὸν οὐρανόν
  choice: పరలోకంలోకి
  rationale: εἰς యొక్క దిశార్థాన్ని ‘లోకి’ నిలుపుతుంది; దర్శన సందర్భంలో οὐρανός కేవలం కనబడే ఆకాశం కాక పరలోకాన్ని సూచిస్తుంది.
theological_decisions:
- issue: పేతురు వివరించిన దర్శనంలో ἅπαντα దేనిని సూచిస్తుంది?
  choice: ‘అంతా’ అని విస్తృతంగానే అనువదించబడింది.
  alternative: ‘ఆ వస్తువంతా,’ ‘అందులో ఉన్నవన్నీ,’ లేదా ‘జంతువులన్నీ’
  rationale: గ్రీకు పదం సమగ్రతను తెలియజేస్తుంది గాని ఈ వచనంలో దాని నిర్దిష్ట సూచ్యాన్ని చెప్పదు. ‘అంతా’ అనే రూపం వస్త్రాన్నో జంతువులనో ప్రత్యేకంగా నిర్ణయించకుండా మూలంలోని అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన కథన శైలి. మూలంలోని కర్మణి ప్రయోగం, పైదిశ భావం, ἅπαντα యొక్క నిర్దిష్టం కాని సూచన కాపాడబడ్డాయి.
