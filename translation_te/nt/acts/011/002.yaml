id: ACT.11.2
reference: Acts 11:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ὅτε δὲ⸃ ἀνέβη Πέτρος εἰς ⸀Ἰερουσαλήμ, διεκρίνοντο πρὸς αὐτὸν οἱ ἐκ περιτομῆς
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/002.yaml
  text: But when Peter went up to Jerusalem[a], those of the circumcision were disputing with him.
translation:
  language: te
  text: అయితే పేతురు యెరూషలేముకు పైకి వెళ్లినప్పుడు[a], సున్నతి వర్గానికి చెందినవారు[b] అతనితో వాదిస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో ‘అయితే పేతురు యెరూషలేముకు పైకి వెళ్లినప్పుడు’ అనే మాటలు లేవు.
    reason: textual_variant
  - marker: b
    text: లేదా ‘సున్నతికి చెందినవారు,’ ‘సున్నతి పక్షంవారు,’ లేదా ‘సున్నతి పొందిన విశ్వాసులు.’ గ్రీకు పాఠం సున్నతితో ఉన్న అనుబంధం ఆధారంగా ఒక సమూహాన్ని గుర్తిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: అయితే … వెళ్లినప్పుడు
  rationale: δέ కథనాన్ని ముందుకు నడిపిస్తూ స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది; ‘అయితే’ ఆ అనుసంధానాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀνέβη
  choice: వెళ్లినప్పుడు
  rationale: యెరూషలేముకు వెళ్లడాన్ని సూచించే ‘పైకి వెళ్లాడు’ అనే మూలభాషా ప్రయోగం తెలుగులో అక్షరార్థంగా అసహజంగా ఉండవచ్చు; ‘వెళ్లినప్పుడు’ గమ్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: Ἰερουσαλήμ
  choice: యెరూషలేము
  rationale: స్థలనామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: διεκρίνοντο
  choice: వాదిస్తూ ఉన్నారు
  rationale: ఇక్కడ క్రియ పేతురుతో కొనసాగుతున్న అభ్యంతరపూర్వక వాదనను సూచిస్తుంది; అపూర్ణ భూతకాల భావాన్ని ‘వాదిస్తూ ఉన్నారు’ నిలుపుతుంది.
- source_word: πρὸς αὐτόν
  choice: అతనితో
  rationale: వాదన ఒక వ్యక్తితో జరుగుతోందనే సహజ తెలుగు వ్యక్తీకరణ; ‘అతనికి వ్యతిరేకంగా’ అని అనవసరంగా శత్రుత్వాన్ని తీవ్రం చేయదు.
- source_word: οἱ ἐκ περιτομῆς
  choice: సున్నతి వర్గానికి చెందినవారు
  rationale: అక్షరార్థంగా ‘సున్నతికి చెందినవారు’; సందర్భంలో సున్నతితో గుర్తింపబడిన విశ్వాసుల సమూహాన్ని సూచిస్తుంది. ‘వర్గం’ అనేది అధికారిక పార్టీ అనే భావాన్ని తప్పనిసరిగా మోపకుండా సమూహ గుర్తింపును స్పష్టం చేస్తుంది.
theological_decisions:
- issue: οἱ ἐκ περιτομῆς అనే సమూహపు గుర్తింపు
  choice: సున్నతి వర్గానికి చెందినవారు
  alternative: సున్నతి పొందినవారు; సున్నతి పక్షంవారు; సున్నతి పొందిన విశ్వాసులు
  rationale: గ్రీకు పదబంధం సున్నతితో అనుబంధం ద్వారా ఒక సమూహాన్ని గుర్తిస్తుంది. అది యూద విశ్వాసులందరినీ సూచిస్తుందా, లేక సున్నతి విషయంలో ప్రత్యేక అభ్యంతరం తెలిపిన ఉపసమూహాన్నా అన్నదాన్ని వచనం పూర్తిగా తేల్చదు; అందువల్ల అధికారిక పార్టీగా గట్టిగా నిర్వచించకుండా గుర్తింపును నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘వాదిస్తూ ఉన్నారు’ కొనసాగుతున్న అభ్యంతరాన్ని తెలియజేస్తుంది; పాదటిప్పణి మూలపదబంధంలోని గుర్తింపు సంబంధిత అనిశ్చితిని నిలుపుతుంది.
