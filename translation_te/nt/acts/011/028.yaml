id: ACT.11.28
reference: Acts 11:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ εἷς ἐξ αὐτῶν ὀνόματι Ἅγαβος ἐσήμανεν διὰ τοῦ πνεύματος λιμὸν ⸀μεγάλην μέλλειν ἔσεσθαι ἐφ’ ὅλην τὴν οἰκουμένην· ⸀ἥτις ἐγένετο ἐπὶ ⸀Κλαυδίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/028.yaml
  text: And one of them[a], named Agabus, stood up and indicated by the Spirit that a great famine was about to come over the whole inhabited world—which happened in the time of Claudius.
translation:
  language: te
  text: వారిలో అగబు అనే ఒకడు లేచి, జనావాసమున్న లోకమంతటా[a] తీవ్రమైన కరవు రాబోతుందని ఆత్మ ద్వారా తెలియజేశాడు. అది క్లౌదియుని కాలంలో సంభవించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లోకమంతటా.” లూకా రచనల్లో “జనావాసమున్న లోకం” అనే మాట మరింత ప్రత్యేకంగా రోమా ప్రపంచాన్ని కూడా సూచించవచ్చు.
    reason: οἰκουμένη అనే పదానికి ఉన్న విస్తృత అర్థాన్నీ, సందర్భంలో సాధ్యమైన రోమా ప్రపంచ భావాన్నీ సంరక్షించడానికి.
lexical_decisions:
- source_word: ἀναστὰς
  choice: లేచి
  rationale: సమావేశంలో అగబు చేసిన చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; గ్రీకు క్రియలోని భౌతిక భావాన్ని నిలుపుతుంది.
- source_word: ἐσήμανεν
  choice: తెలియజేశాడు
  rationale: సూచించడం లేదా తెలియజేయడం అనే మూలార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది; ప్రవచన విధానాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: διὰ τοῦ πνεύματος
  choice: ఆత్మ ద్వారా
  rationale: διά + షష్ఠీ విభక్తి తెలిపే సాధనం లేదా కార్యసాధకత్వాన్ని కాపాడుతుంది; అపొస్తలుల కార్యముల సందర్భంలో ఇది పరిశుద్ధాత్మను సూచిస్తుంది.
- source_word: λιμὸν μεγάλην
  choice: తీవ్రమైన కరవు
  rationale: తెలుగులో కరవు తీవ్రతను సహజంగా వ్యక్తం చేస్తుంది; μεγάλην యొక్క సందర్భార్థాన్ని అందిస్తుంది.
- source_word: μέλλειν ἔσεσθαι
  choice: రాబోతుందని
  rationale: త్వరలో లేదా భవిష్యత్తులో సంభవించబోయే విషయాన్ని సూచించే గ్రీకు నిర్మాణంలోని భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: ἐφ’ ὅλην τὴν οἰκουμένην
  choice: జనావాసమున్న లోకమంతటా
  rationale: οἰκουμένη యొక్క ‘నివాసిత లోకం’ అనే విస్తృత మూలార్థాన్ని నిలుపుతుంది; ప్రధాన పాఠ్యంలో దానిని ముందుగానే రోమా సామ్రాజ్యానికి మాత్రమే పరిమితం చేయదు.
- source_word: ἥτις ἐγένετο
  choice: అది ... సంభవించింది
  rationale: గ్రీకు సంబంధవాచక నిర్మాణాన్ని తెలుగులో స్పష్టమైన స్వతంత్ర వాక్యంగా సహజీకరిస్తూ, ముందే తెలిపిన కరవు నిజంగా సంభవించిందనే సంబంధాన్ని కాపాడుతుంది.
- source_word: ἐπὶ Κλαυδίου
  choice: క్లౌదియ కాలంలో
  rationale: పాలకుని కాలాన్ని సూచించే ἐπί + షష్ఠీ విభక్తి భావాన్ని అదనంగా ‘పరిపాలన’ అనే పదం చేర్చకుండా అందిస్తుంది.
theological_decisions:
- issue: διὰ τοῦ πνεύματος లో ‘ఆత్మ’ ఎవరిని సూచిస్తుంది
  choice: సందర్భానుసారం పరిశుద్ధాత్మను సూచించే ‘ఆత్మ’
  alternative: నిర్దిష్టత తక్కువగా ఉన్న ఆత్మప్రేరిత ప్రకటన
  rationale: అపొస్తలుల కార్యములలో ప్రవచన సందర్భాల్లో ‘ఆత్మ’ సాధారణంగా పరిశుద్ధాత్మను సూచిస్తుంది. అయినా గ్రీకులో లేని ‘పరిశుద్ధ’ అనే విశేషణాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా ‘ఆత్మ’ అని అనువదించబడింది.
- issue: οἰκουμένη యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘జనావాసమున్న లోకమంతటా’
  alternative: ‘లోకమంతటా’ లేదా ‘రోమా లోకమంతటా’
  rationale: ఈ పదం విస్తృతంగా జనావాసమున్న లోకాన్ని సూచించగలదు; లూకా రచనల్లో రోమా సామ్రాజ్య ప్రపంచాన్ని మరింత ప్రత్యేకంగా సూచించే అవకాశం కూడా ఉంది. అసలు పాఠ్యంలోని విస్తృతతను ప్రధాన పాఠ్యంలో ఉంచి, సందర్భసాధ్యమైన అర్థాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. గ్రీకు సంబంధవాచక ఉపవాక్యాన్ని తెలుగులో సహజంగా రెండు వాక్యాలుగా ఇచ్చాం. ‘జనావాసమున్న లోకం’ కొంత పదశః స్వరూపాన్ని ఉంచినా, పద పరిధిలోని నిజమైన అనిశ్చితిని కాపాడేందుకు ఎంచుకోబడింది.
