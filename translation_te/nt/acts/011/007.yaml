  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἤκουσα δὲ ⸀καὶ φωνῆς λεγούσης μοι· Ἀναστάς, Πέτρε, θῦσον καὶ φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/007.yaml
  text: And I also heard a voice saying to me, ‘Get up, Peter; kill and eat.’
translation:
  language: te
  text: 'నేను కూడా నాతో ఇలా చెబుతున్న ఒక స్వరాన్ని విన్నాను: “పేతురూ, లేచి, చంపి తిను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναστάς
  choice: లేచి
  rationale: ఆజ్ఞార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సందర్భంలో నేలపై ఉన్న జంతువులను చేరుకొని చర్య తీసుకోవాలని సూచిస్తుంది.
- source_word: θῦσον
  choice: చంపి
  rationale: ఇక్కడ ఆహారార్థం జంతువులను వధించమనే సాధారణ భావం ఉంది; ‘బలి అర్పించు’ అనే ఆచారపరమైన అర్థాన్ని అనవసరంగా రుద్దకుండా మూలంలోని చర్యను స్పష్టంగా అందిస్తుంది.
- source_word: φάγε
  choice: తిను
  rationale: సరళమైన ఆజ్ఞార్థక క్రియగా మూలపాఠాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: φωνῆς
  choice: ఒక స్వరం
  rationale: గ్రీకు పదంలోని వినిపించిన స్వరం అనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది; మాట్లాడిన వ్యక్తి గుర్తింపును పాఠం చెప్పినదానికంటే ఎక్కువగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: θῦσον అనే పదానికి బలి సంబంధిత అర్థం ఉండగలదా
  choice: చంపి
  alternative: వధించి / బలి అర్పించి
  rationale: ఈ దర్శన సందర్భంలో జంతువులను చంపి తినమనే ఆజ్ఞ ఉద్దేశం. ‘బలి అర్పించి’ అని అనువదిస్తే మూలంలో తప్పనిసరిగా లేని ఆచారపరమైన భావాన్ని చేర్చే ప్రమాదం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, అయినా గౌరవప్రదంగా ఉండే ప్రత్యక్ష వాక్య నిర్మాణం. ‘పేతురూ’ అనే సంబోధన తెలుగు విభక్తికి అనుగుణంగా ఇవ్వబడింది.
