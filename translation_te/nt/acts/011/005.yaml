id: ACT.11.5
reference: Acts 11:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος καὶ εἶδον ἐν ἐκστάσει ὅραμα, καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ἀρχαῖς καθιεμένην ἐκ τοῦ οὐρανοῦ, καὶ ἦλθεν ἄχρι ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/005.yaml
  text: 'I was in the city of Joppa praying[a], and in a trance I saw a vision: something like a large sheet was coming down, being lowered from heaven by four corners[b], and it came to me.'
translation:
  language: te
  text: 'నేను యొప్పే పట్టణంలో ప్రార్థిస్తూ ఉండగా, మైమరపు స్థితిలో నేను ఒక దర్శనం చూశాను: పెద్ద గుడ్డలాంటిది ఏదో ఒక వస్తువు ఆకాశం నుండి నాలుగు మూలలచేత కిందికి దించబడుతూ నా దగ్గరకు వచ్చింది.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆకాశం నుండి నాలుగు చివరలచేత కిందికి వదలబడుతూ.”
    reason: τέσσαρσιν ἀρχαῖς మరియు καθιεμένην పదబంధానికి మరింత అక్షరార్థమైన ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος
  choice: నేను యొప్పే పట్టణంలో ప్రార్థిస్తూ ఉన్నాను
  rationale: గ్రీకులోని స్పష్టమైన ప్రథమ పురుష సర్వనామాన్ని సహజమైన తెలుగులో ఉంచి, πόλις అనే ‘పట్టణం’ పదాన్ని కూడా నిలిపాము. వర్తమాన కృదంతం సూచించే కొనసాగుతున్న ప్రార్థనను ‘ప్రార్థిస్తూ ఉన్నాను’గా వ్యక్తం చేశాము.
- source_word: ἐν ἐκστάσει ὅραμα
  choice: పారవశ్య స్థితిలో నాకు ఒక దర్శనం కలిగింది
  rationale: ἐκστάσις సూచించే సాధారణ చైతన్యానికి భిన్నమైన దర్శనాత్మక స్థితిని ‘పారవశ్య స్థితి’గా, ὅραμαను ‘దర్శనం’గా వేర్వేరుగా నిలిపాము; ‘నాకు ... కలిగింది’ సహజ తెలుగు కథనరీతి.
- source_word: σκεῦός τι ὡς ὀθόνην μεγάλην
  choice: పెద్ద దుప్పటిలాంటి ఏదో ఒక వస్తువు
  rationale: σκεῦος విస్తృతార్థకమైన వస్తువు లేదా పాత్రను సూచిస్తుంది కాబట్టి దాని స్వరూపాన్ని ముందుగానే నిర్దిష్టం చేయకుండా ‘ఏదో ఒక వస్తువు’ అని, ὀθόνη యొక్క పెద్ద గుడ్డవంటి రూపాన్ని సాధారణ పాఠకులకు స్పష్టమైన ‘పెద్ద దుప్పటిలాంటి’ అని అనువదించాము.
- source_word: τέσσαρσιν ἀρχαῖς καθιεμένην ἐκ τοῦ οὐρανοῦ
  choice: నాలుగు మూలలతో ఆకాశం నుండి కిందికి దించబడుతూ
  rationale: ἀρχαί ఇక్కడ అంచులు లేదా మూలలను సూచిస్తుంది. καθιεμένην నిష్క్రియ భావాన్ని ‘దించబడుతూ’గా నిలిపాము. దర్శన సందర్భంలో οὐρανόςకు ‘ఆకాశం’ సహజమైన తెలుగు పదం; ఇది ‘పరలోకం’ అని మరీ నిర్దిష్టం చేయదు.
- source_word: ἦλθεν ἄχρι ἐμοῦ
  choice: నా దగ్గరికి వచ్చింది
  rationale: ἄχρι ἐμοῦలోని పేతురు ఉన్న స్థానం వరకు చేరిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దర్శన అనుభవానికి సంబంధించిన ἐκστάσει మరియు ὅραμα పదాల భేదం
  choice: పారవశ్య స్థితిలో నాకు ఒక దర్శనం కలిగింది
  alternative: మైమరపు స్థితిలో నేను ఒక దర్శనం చూశాను
  rationale: రెండు గ్రీకు పదాల భావాలను ఒకటిగా కలపకుండా, మారిన చైతన్య స్థితినీ అందులో కలిగిన దర్శనాన్నీ వేరుగా నిలిపాం. ‘పారవశ్యం’ భావోద్వేగ ఆనందానికే పరిమితం కాకుండా ఇక్కడ దర్శనాత్మక స్థితిని సూచించేలా ‘స్థితిలో’ అని జోడించాం.
- issue: ἐκ τοῦ οὐρανοῦ యొక్క భావం
  choice: ఆకాశం నుండి
  alternative: పరలోకం నుండి
  rationale: οὐρανόςకు సందర్భానుసారంగా ఆకాశం లేదా పరలోకం అనే అర్థాలు ఉండవచ్చు. దృశ్యంలోని పై నుండి దిగివచ్చే భావాన్ని నిలిపి, మూలపాఠం అనుమతించే సందిగ్ధతను అతి వివరణతో తొలగించకుండా ‘ఆకాశం నుండి’ ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలి. ‘యొప్పే’ అనే ప్రాచుర్యంలో ఉన్న తెలుగు స్థలనామాన్ని వాడాం. మూలంలోని ఒకే దీర్ఘ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; దర్శనం లోపలి క్రమాన్ని కొలన్‌తో నిలిపాం.
