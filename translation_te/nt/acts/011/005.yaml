  revision_rationale: The revision explicitly renders Peter’s act of seeing, uses a neutral large-cloth/sheet comparison for ὀθόνη, and clarifies that the object was lowered by its four extremities. It retains the source’s distinction between the altered state (ἐν ἐκστάσει) and the vision (ὅραμα), and preserves the semantic openness of οὐρανοῦ as “ఆకాశం.”
