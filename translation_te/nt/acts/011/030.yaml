base_translation:
  language: en
  yaml_path: translation/nt/acts/011/030.yaml
  text: And they did so[a], sending it to the elders by the hand of Barnabas and Saul.
translation:
  language: te
  text: వారు అలాగే చేసి, ఆ సహాయాన్ని బర్నబా మరియు సౌలు చేతుల మీదుగా పెద్దల వద్దకు పంపారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బర్నబా మరియు సౌలు ద్వారా.” గ్రీకు నుడికారానికి అక్షరార్థం, “బర్నబా మరియు సౌలు చేతి ద్వారా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ καὶ ἐποίησαν
  choice: వారు అలాగే చేసి
  rationale: ὃ మునుపటి వచనంలో నిర్ణయించిన సహాయాన్ని సూచిస్తుంది; తెలుగులో ‘అలాగే చేసి’ అనేది సంక్షిప్తంగా, సహజంగా ఆ అనుసంధానాన్ని తెలియజేస్తుంది.
- source_word: ἀποστείλαντες
  choice: పంపారు
  rationale: ఈ భూతకాల అసమాపక క్రియ ప్రధాన చర్య ఎలా నెరవేరిందో తెలియజేస్తుంది; తెలుగులో వాక్యాన్ని సహజంగా ఉంచేందుకు ప్రధాన క్రియగా అనువదించబడింది.
- source_word: implicit object from context
  choice: ఆ సహాయాన్ని
  rationale: గ్రీకులో కర్మ సందర్భం ద్వారా అర్థమవుతుంది; మునుపటి వచనంలోని సహాయక విరాళాన్ని తెలుగులో స్పష్టంగా, కానీ అతిగా నిర్దిష్టం చేయకుండా ‘ఆ సహాయాన్ని’ అని పేర్కొనడం సహజం.
- source_word: πρὸς τοὺς πρεσβυτέρους
  choice: సంఘపెద్దల దగ్గరికి
  rationale: πρεσβύτεροι గుర్తింపు పొందిన సంఘ నాయకులను సూచిస్తుంది. ‘సంఘపెద్దలు’ ఆధునిక తెలుగు పాఠకులకు స్పష్టమైన, సాధారణ పదం.
- source_word: διὰ χειρὸς
  choice: చేతుల మీదుగా
  rationale: ఈ గ్రీకు నుడికారం నియమించబడిన వ్యక్తుల ద్వారా పంపడాన్ని సూచిస్తుంది; ‘చేతుల మీదుగా’ మూలంలోని స్పష్టమైన రూపకాన్ని నిలుపుతూ తెలుగులో అర్థమయ్యేలా ఉంది.
- source_word: Βαρναβᾶ καὶ Σαύλου
  choice: బర్నబా, సౌలు
  rationale: వ్యక్తుల పేర్లు ప్రామాణిక తెలుగు రూపాల్లో లిప్యంతరీకరించబడ్డాయి.
