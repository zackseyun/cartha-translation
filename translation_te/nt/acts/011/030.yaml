revisions:
- from: వారు అలాగే చేసి, ఆ సహాయాన్ని బర్నబా, సౌలు చేతుల మీదుగా సంఘపెద్దల దగ్గరికి పంపారు.[a]
  to: వారు అలాగే చేసి, ఆ సహాయాన్ని బర్నబా మరియు సౌలు చేతుల మీదుగా పెద్దల వద్దకు పంపారు.[a]
  rationale: The revision retains the contextual explicit object ‘ఆ సహాయాన్ని’ and the agency idiom, while rendering the recipient phrase more directly and in a suitably formal modern Telugu register. The footnote continues to offer the ordinary agency alternative and accurately notes the literal singular-hand idiom.
