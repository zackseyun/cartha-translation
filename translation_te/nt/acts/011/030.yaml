translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు, గౌరవప్రదమైన కథన శైలి. గ్రీకు నుడికారంలోని ప్రతినిధిత్వ భావాన్ని ప్రధాన పాఠంలో నిలిపి, మరింత సాధారణ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
