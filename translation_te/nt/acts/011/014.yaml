source:
  edition: SBLGNT
  text: ὃς λαλήσει ῥήματα πρὸς σὲ ἐν οἷς σωθήσῃ σὺ καὶ πᾶς ὁ οἶκός σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/014.yaml
  text: He will speak words to you by which you and all your household will be saved[a].
translation:
  language: te
  text: అతడు నీతో మాటలు చెబుతాడు; వాటి ద్వారా నీవు, నీ ఇంటివారందరూ రక్షించబడతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వాటిలో’; ఇక్కడి గ్రీకు ప్రయోగం ఆ మాటలు రక్షణ కలిగే సాధనమని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: అతడు
  rationale: ముందు ప్రస్తావించిన పేతురును సూచించే సంబంధ సర్వనామం. తెలుగులో స్వతంత్ర వాక్యంగా సహజంగా ఉండేందుకు ‘అతడు’ అని ఇచ్చాం.
- source_word: λαλήσει ῥήματα πρὸς σὲ
  choice: నీతో కొన్ని మాటలు చెబుతాడు
  rationale: λαλέω మరియు ῥήματα యొక్క ‘మాటలు చెప్పడం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపాం; πρός + ద్వితీయా విభక్తి ఇక్కడ సంభాషణ ఎవరితో జరుగుతుందో సూచిస్తుంది.
- source_word: ἐν οἷς
  choice: వాటి ద్వారా
  rationale: ἐν ఇక్కడ సాధనార్థకంగా ఉండి, ఆ మాటలు రక్షణ కలిగే సాధనమని సూచిస్తుంది. ‘వాటి ద్వారా’ ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: σωθήσῃ
  choice: రక్షించబడతారు
  rationale: σῴζω యొక్క భవిష్యత్ కర్మణి రూపం. ఈ సువార్త సందర్భంలో రక్షణ అనే ప్రధాన భావాన్ని నిలుపుతుంది.
- source_word: σὺ καὶ πᾶς ὁ οἶκός σου
  choice: నీవూ నీ ఇంటివారందరూ
  rationale: స్పష్టమైన σὺ లోని ఉద్ఘాటనను ‘నీవూ’ నిలుపుతుంది; οἶκος ఇక్కడ భవనం కాక కుటుంబం/ఇంటి సమూహాన్ని సూచిస్తున్నందున ‘ఇంటివారందరూ’ అని అనువదించాం.
theological_decisions:
- issue: కొర్నేలి ఇంటివారి సందర్భంలో రక్షణ భావం
  choice: ‘రక్షించబడతారు’ అని అనువదించి, ప్రకటించబడే మాటల ద్వారా రక్షణ వస్తుందని వాక్యం చెప్పేంతవరకే ఉంచాం.
  alternative: ‘విడిపించబడతారు’
  rationale: సందర్భం సువార్త వినడం మరియు రక్షణ పొందడం గురించి ఉంది. ప్రతి వ్యక్తి ఎలా పాలుపంచుకుంటాడనే తరువాతి సిద్ధాంత వివరణలను అనువాదంలో చేర్చలేదు.
- issue: ‘నీ ఇంటివారందరూ’ అనే మాట పరిధి
  choice: ఇంటివారి సమూహమంతటినీ సూచించేలా అనువదించాం; స్పందనతో సంబంధం లేకుండా స్వయంచాలక రక్షణ అని పేర్కొనలేదు.
  alternative: ‘నీ ఇంటివారంతా’
  rationale: గ్రీకు పాఠం వాగ్దానపు గృహపరిధిని చెబుతుంది గానీ, అన్ని కథనాత్మక లేదా సిద్ధాంతపరమైన అర్హతలను ఈ వాక్యంలో వివరించదు. అందువల్ల ఆ ఉద్రిక్తతను అలాగే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలి. ‘ఇంటివారందరూ’ అనే రూపం οἶκος యొక్క సమూహార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
