revisions:
- from: ఇదిగో, వెంటనే కైసరయ నుండి నా దగ్గరకు పంపబడిన ముగ్గురు మనుషులు మేమున్న ఇంటికి వచ్చారు.
  to: ఇదిగో, ఆ క్షణంలోనే కైసరయ నుండి నా దగ్గరకు పంపబడిన ముగ్గురు వ్యక్తులు మేమున్న ఇంటికి వచ్చారు.
  rationale: A light revision improves modern Telugu idiom and represents the immediate temporal connection of ἐξαυτῆς more fully. The source’s passive participle, origin from Caesarea, and direction to Peter are retained. No footnote is needed because the wording does not introduce a material ambiguity requiring explanation.
