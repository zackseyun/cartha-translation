id: ACT.11.11
reference: Acts 11:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἐξαυτῆς τρεῖς ἄνδρες ἐπέστησαν ἐπὶ τὴν οἰκίαν ἐν ᾗ ⸀ἦμεν, ἀπεσταλμένοι ἀπὸ Καισαρείας πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/011.yaml
  text: And behold[a], immediately three men arrived at the house where we were, having been sent to me from Caesarea.
translation:
  language: te
  text: ఇదిగో, ఆ క్షణంలోనే కైసరయ నుండి నా దగ్గరకు పంపబడిన ముగ్గురు వ్యక్తులు మేమున్న ఇంటికి వచ్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: కథనంలో సంభవించిన ముఖ్యమైన పరిణామం వైపు శ్రోతల దృష్టిని మళ్లించే మూలపదపు సంభాషణాత్మక బలాన్ని సహజమైన తెలుగు పదంతో నిలుపుతుంది.
- source_word: ἐξαυτῆς
  choice: వెంటనే
  rationale: దర్శనం తరువాత ఆలస్యం లేకుండా జరిగిన సంఘటనను సూచించే తక్షణత్వాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τρεῖς ἄνδρες
  choice: ముగ్గురు మనుషులు
  rationale: సంఖ్యనూ, పురుషులను సూచించే ἄνδρες పదాన్నీ నేరుగా ప్రతిబింబిస్తుంది.
- source_word: ἐπέστησαν ἐπὶ τὴν οἰκίαν
  choice: ఇంటికి వచ్చారు
  rationale: ఈ సందర్భంలో అకస్మాత్తుగా అక్కడికి చేరుకోవడం అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἐν ᾗ ἦμεν
  choice: మేమున్న
  rationale: వారు ఉన్న స్థలాన్ని మాత్రమే తెలిపే మూలంలోని సంబంధ వాక్యాన్ని అదనపు 'బసచేయడం' భావం చేర్చకుండా సంక్షిప్తంగా అందిస్తుంది.
- source_word: ἀπεσταλμένοι
  choice: పంపబడిన
  rationale: వారు రావడానికి ముందే పంపించబడ్డారని సూచించే కర్మణి భావాన్ని నిలుపుతుంది.
- source_word: ἀπὸ Καισαρείας
  choice: కైసరయ నుండి
  rationale: ἀπό సూచించే ఆరంభస్థలాన్ని, స్థలనామాన్ని సాధారణ తెలుగు రూపంలో అందిస్తుంది.
- source_word: πρός με
  choice: నా దగ్గరకు
  rationale: పేతురు లక్ష్యంగా వారి పంపకం, ప్రయాణ దిశ రెండింటినీ సహజమైన తెలుగులో తెలియజేస్తుంది.
