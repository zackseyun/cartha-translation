translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, పంపబడిన వారి మూలస్థానం మరియు గమ్యాన్ని తెలుగులో స్పష్టంగా అమర్చింది; అర్థపరమైన అదనాలు చేయలేదు.
