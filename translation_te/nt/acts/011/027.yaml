  source_fidelity: ‘ఆ రోజుల్లో’ accurately renders the temporal frame Ἐν ταύταις δὲ ταῖς ἡμέραις without forcing the light connective δέ. ‘యెరూషలేము నుండి అంతియొకయకు దిగివచ్చారు’ preserves the source, destination, completed movement, and the downward/topographical nuance of κατῆλθον. ‘ప్రవక్తలు’ is a direct and appropriately broad rendering of προφῆται.
