base_translation:
  language: en
  yaml_path: translation/nt/acts/011/027.yaml
  text: In those days prophets came down from Jerusalem to Antioch[a].
translation:
  language: te
  text: ఆ రోజుల్లో ప్రవక్తలు యెరూషలేము నుండి అంతియొకయకు దిగివచ్చారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెరూషలేము నుండి అంతియొకయకు దిగివెళ్లారు.” గ్రీకు క్రియను సందర్భ దృష్టికోణాన్ని బట్టి “దిగివచ్చారు” లేదా “దిగివెళ్లారు” అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ταύταις δὲ ταῖς ἡμέραις
  choice: ఆ రోజుల్లో
  rationale: కాలసూచక పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. δέ యొక్క స్వల్ప అనుసంధాన భావాన్ని ప్రత్యేక పదంతో అతిగా అనువదించలేదు.
- source_word: κατῆλθον
  choice: దిగివచ్చారు
  rationale: κατέρχομαι లోని దిగివెళ్లడం/దిగిరావడం అనే భౌగోళిక భావాన్ని నిలుపుతూ, గమ్యస్థానమైన అంతియొకయకు చేరిక దృష్టికోణంలో సహజంగా ఉంది.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: యెరూషలేము నుండి
  rationale: ἀπό యొక్క మూలస్థాన భావాన్ని సూటిగా తెలియజేస్తుంది; గ్రీకులో రూపపరంగా బహువచనమైన స్థలనామాన్ని తెలుగులో ప్రామాణిక ఏకవచన స్థలనామంగా ఇచ్చింది.
- source_word: προφῆται
  choice: ప్రవక్తలు
  rationale: మూలంలోని సాధారణ పదాన్ని దాని సేవా పరిధిని కృత్రిమంగా కుదించకుండా నిలుపుతుంది.
- source_word: εἰς Ἀντιόχειαν
  choice: అంతియొకయకు
  rationale: εἰς సూచించే గమ్యదిశను నగరనామంతో సహజమైన తెలుగు చతుర్థీ విభక్తి ద్వారా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యెరూషలేము–అంతియొకయ సంఘ సందర్భంలో ‘ప్రవక్తలు’ అనే పదం యొక్క స్వభావం
  choice: προφῆται ను వివరణాత్మకంగా కుదించకుండా ‘ప్రవక్తలు’గా అనువదించడం
  alternative: ప్రవచన బోధకులు; దైవప్రేరిత సందేశకులు
  rationale: ఈ వాక్యం వారి పరిచర్య యొక్క ఖచ్చితమైన పరిధిని నిర్వచించదు. విస్తృత పదాన్ని ఉంచడం ద్వారా ఏ ప్రత్యేక సంఘపరమైన అర్థాన్నీ రుద్దకుండా మూలంలోని భావ ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘దిగివచ్చారు’ భౌగోళిక దిగుదల భావాన్ని నిలుపుతుంది; ప్రత్యామ్నాయ దృష్టికోణాన్ని పాదసూచికలో ఇచ్చాం.
