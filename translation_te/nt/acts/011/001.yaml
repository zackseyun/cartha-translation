id: ACT.11.1
reference: Acts 11:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἤκουσαν δὲ οἱ ἀπόστολοι καὶ οἱ ἀδελφοὶ οἱ ὄντες κατὰ τὴν Ἰουδαίαν ὅτι καὶ τὰ ἔθνη ἐδέξαντο τὸν λόγον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/001.yaml
  text: The apostles and the brothers who were throughout Judea heard that the Gentiles also had received the word of God[a].
translation:
  language: te
  text: అపొస్తలులు, యూదయ అంతటా ఉన్న సహోదరులు[a], అన్యజనులు కూడా దేవుని వాక్యాన్ని స్వీకరించారని విన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సహోదర సహోదరీలు’; గ్రీకు మూలంలో ‘సహోదరులు’ అని ఉంది, అయితే అది తోటి విశ్వాసులందరినీ విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: విన్నారు
  rationale: ἀκούω యొక్క భూతకాల రూపం ఇక్కడ వార్త తెలిసిన విషయాన్ని తెలియజేస్తుంది; ‘విన్నారు’ సహజమైనదీ మూలానికి సమీపమైనదీ.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక కథనంలోని మార్పును సూచిస్తుంది. తెలుగులో వాక్యక్రమమే ఆ మార్పును సహజంగా తెలియజేస్తుంది; ‘అయితే’ అని పెడితే లేని వ్యతిరేక భావం కలగవచ్చు.
- source_word: οἱ ἀπόστολοι
  choice: అపొస్తలులు
  rationale: అపొస్తలుల కార్యముల సందర్భంలో గుర్తింపుపొందిన అపొస్తలుల సమూహాన్ని సూచించే స్థిరమైన తెలుగు పదం.
- source_word: οἱ ἀδελφοὶ
  choice: సహోదరులు
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని నిలుపుతుంది; సందర్భంలో ఇది స్త్రీపురుష విశ్వాసుల సమాజాన్ని విస్తృతంగా సూచించే అవకాశం పాదటిప్పణిలో తెలియజేయబడింది.
- source_word: οἱ ὄντες κατὰ τὴν Ἰουδαίαν
  choice: యూదయ అంతటా ఉన్న
  rationale: κατά యొక్క విస్తరణాత్మక భావాన్ని ‘అంతటా’ సహజంగా వ్యక్తపరుస్తుంది; కేవలం ‘యూదయలో’ అనే అర్థం కంటే మూలంలోని వ్యాప్తిని మెరుగ్గా నిలుపుతుంది.
- source_word: καὶ τὰ ἔθνη
  choice: అన్యజనులు కూడా
  rationale: ఈ సందర్భంలో τὰ ἔθνη యూదేతరులను సూచిస్తుంది; καί వారి చేర్పును అదనపు, ఆశ్చర్యకర విషయంగా నొక్కిచెబుతుంది.
- source_word: ἐδέξαντο
  choice: స్వీకరించారని
  rationale: δέχομαι ఇక్కడ ప్రకటించబడిన సందేశాన్ని అంగీకరించి స్వీకరించడాన్ని సూచిస్తుంది; తెలుగు వాక్య నిర్మాణంలో వార్త యొక్క విషయాన్ని తెలిపేందుకు ‘అని’ రూపం సహజం.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: దేవుని వాక్యాన్ని
  rationale: దేవుని ప్రకటిత సందేశాన్ని సూచించే బైబిలీయ నుడికారాన్ని, దాని ధార్మిక ప్రతిధ్వనిని నిలుపుతుంది.
theological_decisions:
- issue: మిశ్రమ విశ్వాసుల సమాజాన్ని సూచించగల ἀδελφοὶ అనువాదం
  choice: సహోదరులు
  alternative: సహోదర సహోదరీలు; విశ్వాసులు
  rationale: మూలంలోని వ్యాకరణపరమైన పుంలింగ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది విస్తృతంగా తోటి విశ్వాసులను—సహోదరీలను కూడా—సూచించవచ్చనే భావాన్ని పాదటిప్పణిలో ఇస్తుంది. దీనివల్ల మూలరూపమూ సందర్భంలోని విస్తృత సూచనమూ రెండూ సంరక్షించబడతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘అపొస్తలులు,’ ‘అన్యజనులు,’ ‘దేవుని వాక్యం’ వంటి సుపరిచిత బైబిలీయ పదాలను నిలిపి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సహజంగా ఉంచాం.
