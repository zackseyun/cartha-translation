id: ACT.11.8
reference: Acts 11:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπον δέ· Μηδαμῶς, κύριε, ⸀ὅτι κοινὸν ἢ ἀκάθαρτον οὐδέποτε εἰσῆλθεν εἰς τὸ στόμα μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/008.yaml
  text: But I said, ‘By no means, Lord, because nothing common or unclean has ever entered my mouth.’
translation:
  language: te
  text: కానీ నేను, ‘ప్రభువా, ఎంతమాత్రమూ కాదు! ఎందుకంటే సామాన్యమైనదిగానీ అపవిత్రమైనదిగానీ ఏదీ ఎన్నడూ నా నోటిలోకి రాలేదు’ అన్నాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: అసలే వద్దు
  rationale: బలమైన నిరాకరణను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κύριε
  choice: ప్రభువా
  rationale: సంబోధన రూపాన్ని, సందర్భంలోని ప్రభువు అనే బిరుదును నిలుపుతుంది.
- source_word: κοινὸν
  choice: సామాన్యమైనది
  rationale: ఆచారపరంగా ప్రత్యేకపరచబడని లేదా అపవిత్రంగా పరిగణించబడే దాని భావాన్ని, ἀκάθαρτον‌తో ఉన్న భేదాన్ని చెరపకుండా నిలుపుతుంది.
- source_word: ἀκάθαρτον
  choice: అపవిత్రమైనది
  rationale: ఆచారపరమైన అశుద్ధతను సూచించే సాధారణ బైబిలు పదప్రయోగం.
- source_word: εἰσῆλθεν εἰς τὸ στόμα μου
  choice: నా నోటిలోకి ప్రవేశించలేదు
  rationale: మూలంలోని స్పష్టమైన రూపకల్పనను కాపాడుతూ తెలుగులో అర్థవంతంగా ఉంటుంది.
theological_decisions:
- issue: κοινόν మరియు ἀκάθαρτον మధ్య సంబంధం
  choice: ‘సామాన్యమైనదేదీ గానీ అపవిత్రమైనదేదీ గానీ’ అని రెండు పదాలను విడిగా ఉంచడం
  alternative: రెండింటినీ కలిపి ‘అపవిత్రమైనదేదీ’ అని అనువదించడం
  rationale: మూలపాఠంలోని రెండు వేర్వేరు ఆచారపరమైన వర్గీకరణలను కలిపివేయకుండా, వాటి మధ్య ఉండగల భావభేదాన్ని నిలుపుతుంది.
- issue: ὅτι యొక్క సంబంధార్థం
  choice: ‘ఎందుకంటే’
  alternative: ‘ఏలయనగా’ లేదా సంబంధాన్ని అస్పష్టంగా వదలడం
  rationale: ఇక్కడ పేతురు తన నిరాకరణకు కారణం చెబుతున్నాడనే సహజమైన పఠనాన్ని ప్రతిబింబిస్తుంది; ఆంగ్ల సంప్రదింపుపాఠంతోనూ సరిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని బలమైన నిరాకరణ, కారణసంబంధం, ఆచారపరమైన రెండు పదాల భేదం నిలుపబడ్డాయి.
