revisions:
- from: అప్పుడు నేను, ‘ప్రభువా, అసలే వద్దు! ఎందుకంటే సామాన్యమైనదేదీ గానీ అపవిత్రమైనదేదీ గానీ ఎన్నడూ నా నోటిలోకి ప్రవేశించలేదు’ అన్నాను.
