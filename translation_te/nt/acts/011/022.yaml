id: ACT.11.22
reference: Acts 11:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἠκούσθη δὲ ὁ λόγος εἰς τὰ ὦτα τῆς ἐκκλησίας τῆς ⸀οὔσης ἐν ⸀Ἰερουσαλὴμ περὶ αὐτῶν, καὶ ἐξαπέστειλαν ⸀Βαρναβᾶν ἕως Ἀντιοχείας·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/022.yaml
  text: The report about them reached the ears of the church in Jerusalem[a], and they sent out Barnabas as far as Antioch.
translation:
  language: te
  text: యెరూషలేములోని సంఘానికి వారి గురించిన వార్త తెలిసింది[a]; వారు బర్నబాను అంతియొకయ వరకు పంపారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెరూషలేములోని సంఘం చెవులకు చేరింది’; అక్షరార్థంగా, ‘యెరూషలేములోని సంఘం చెవుల్లోకి ఆ వార్త వినబడింది.’
    reason: ἠκούσθη ... εἰς τὰ ὦτα అనే గ్రీకు నుడికారంలో ఉన్న అక్షరార్థ చెవి-రూపకాన్ని మరియు ‘వినబడింది’ అనే నిష్క్రియ క్రియను తెలియజేయడానికి.
lexical_decisions:
- source_word: ἠκούσθη
  choice: చెవికి చేరింది
  rationale: క్రియ అక్షరార్థంగా ‘వినబడింది’ అయినా, εἰς τὰ ὦτα అనే నుడికారంతో కలిసి సమాచారం సంఘం దృష్టికి వచ్చిందనే భావాన్ని ఇస్తుంది. ‘చెవికి చేరింది’ ఆ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὁ λόγος
  choice: వార్త
  rationale: ఈ కథన సందర్భంలో λόγος అనేది అంతియొకయలో జరిగినవాటిని గురించిన సమాచారం లేదా వార్తను సూచిస్తుంది; ‘వాక్యం’ అని అనువదిస్తే ఇక్కడ ఉద్దేశించని వేదాంతార్థం కలగవచ్చు.
- source_word: εἰς τὰ ὦτα
  choice: చెవికి చేరింది
  rationale: సమాచారం ఎవరి దృష్టికైనా రావడాన్ని సూచించే గ్రీకు నుడికారంలోని చెవి రూపకాన్ని తెలుగులో సహజంగా కాపాడుతుంది.
- source_word: ἐκκλησίας
  choice: సంఘం
  rationale: అపొస్తలుల కార్యముల సందర్భంలో ఇది క్రైస్తవ విశ్వాసుల సమాజాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘సంఘం’ సహజమైన ఎంపిక.
- source_word: τῆς οὔσης ἐν Ἰερουσαλήμ
  choice: యెరూషలేములోని
  rationale: ఏ సంఘమో గుర్తించే గ్రీకు కృదంత పదబంధాన్ని అర్థనష్టం లేకుండా సంక్షిప్తమైన తెలుగు విశేషణ రూపంలో అందిస్తుంది.
- source_word: περὶ αὐτῶν
  choice: వారిని గురించిన
  rationale: బహువచన సర్వనామాన్ని అలాగే నిలిపి, ముందటి సందర్భంలోని వ్యక్తులను సూచించే సహజమైన భావాన్ని ఇస్తుంది.
- source_word: ἐξαπέστειλαν
  choice: పంపించారు
  rationale: ఈ సందర్భంలో ‘బయటకు పంపారు/పంపించారు’ అనే భావం ఉంది. తెలుగులో గమ్యస్థానం వెంట వచ్చినప్పుడు ‘పంపించారు’ సహజంగా, గౌరవప్రయోగానికి అనుగుణంగా ఉంటుంది.
- source_word: Βαρναβᾶν
  choice: బర్నబాను
  rationale: వ్యక్తి పేరును ప్రాచుర్యంలో ఉన్న తెలుగు లిప్యంతరీకరణలో, వాక్యంలోని కర్మ విభక్తితో ఇచ్చాం.
- source_word: ἕως Ἀντιοχείας
  choice: అంతియొకయ వరకు
  rationale: ἕως సూచించే గమ్యపు హద్దు లేదా విస్తృతిని సాధారణ ‘అంతియొకయకు’ కంటే స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘వారు పంపించారు’ అనే క్రియకు కర్త ఎవరు?
  choice: యెరూషలేములోని సంఘాన్ని సమష్టిగా సూచించే ‘వారు’
  alternative: ఆ సంఘంలోని అపొస్తలులు లేదా నాయకులు
  rationale: దగ్గరలో స్పష్టంగా పేర్కొన్న పూర్వపదం ‘యెరూషలేములోని సంఘం.’ మూలపాఠం అపొస్తలులనో పెద్దలనో ప్రత్యేకంగా పేర్కొనదు; అందువల్ల అనువాదం ఆ పరిమితిని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే కథన గౌరవాన్ని నిలుపుతూ రూపొందించబడింది. δὲ యొక్క స్వల్ప అనుసంధాన బలం తెలుగు వాక్యప్రవాహం మరియు విరామచిహ్నం ద్వారా వ్యక్తమైంది; మూలంలో లేని కాలసూచక ‘ఇప్పుడు’ చేర్చలేదు. καί సంబంధాన్ని సెమీకోలన్‌తో సహజంగా కలిపి, కారణార్థాన్ని అదనంగా చేర్చలేదు.
