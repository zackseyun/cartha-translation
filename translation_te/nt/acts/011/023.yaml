id: ACT.11.23
reference: Acts 11:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς παραγενόμενος καὶ ἰδὼν τὴν χάριν ⸀τὴν τοῦ θεοῦ, ἐχάρη καὶ παρεκάλει πάντας τῇ προθέσει τῆς καρδίας ⸀προσμένειν τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/023.yaml
  text: When he arrived and saw the grace of God, he rejoiced and kept urging them all to remain devoted to the Lord with purpose of heart,
translation:
  language: te
  text: అతడు అక్కడికి వచ్చి దేవుని కృపను[a] చూసి సంతోషించాడు; వారందరినీ హృదయ దృఢసంకల్పంతో ప్రభువుతో నిలిచి ఉండాలని[b] ప్రోత్సహిస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని అనుగ్రహాన్ని.’ ఈ పదబంధం వారిలో కనిపించిన దేవుని కృపాపూర్వక కార్యాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ప్రభువుతో కొనసాగాలని’ లేదా ‘ప్రభువుకు నమ్మకంగా ఉండాలని.’
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενος
  choice: అక్కడికి వచ్చి
  rationale: బర్నబా ఆ ప్రదేశానికి చేరుకోవడాన్ని సూచించే భూతకాల అసమాపక క్రియను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἰδὼν
  choice: చూసినప్పుడు
  rationale: ὁράω అనే సాధారణ దృష్టి క్రియను యథాతథంగా ఉంచుతుంది; సందర్భంలో దేవుని కార్యాన్ని గ్రహించడం అంతర్లీనంగా ఉన్నా దానిని వివరణగా చేర్చదు.
- source_word: τὴν χάριν τὴν τοῦ θεοῦ
  choice: దేవుని కృపను
  rationale: అంతియొకయలో కనిపించిన దేవుని కృపాపూర్వక కార్యాన్ని సూచించగల θεοῦ χάρις యొక్క వేదాంతపరమైన విస్తృతిని కాపాడుతుంది.
- source_word: ἐχάρη
  choice: సంతోషించాడు
  rationale: ఈ రూపం సందర్భంలో ‘సంతోషించు’ అనే అర్థాన్ని ఇస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: παρεκάλει
  choice: ప్రోత్సహిస్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న చర్యను ‘ఉంటూ’ నిర్మాణం తెలియజేస్తుంది; παρακαλέω లోని ప్రోత్సాహం/హెచ్చరికతో కూడిన విజ్ఞప్తి భావానికి సందర్భానుకూలం.
- source_word: πάντας
  choice: వారందరూ
  rationale: సందర్భంలోని విశ్వాసులందరినీ సహజమైన తెలుగులో సూచిస్తుంది; తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా వారిని అంతర్లీన వాక్యపు కర్తలుగా చూపుతుంది.
- source_word: τῇ προθέσει τῆς καρδίας
  choice: హృదయపూర్వక సంకల్పంతో
  rationale: πρόθεσις లోని దృఢమైన ఉద్దేశాన్ని, καρδία లోని అంతరంగ/సంకల్ప భావాన్ని సహజంగా కలిపి వ్యక్తపరుస్తుంది.
- source_word: προσμένειν
  choice: హత్తుకొని ఉండాలని
  rationale: προσμένω లోని కొనసాగుతూ అనుబంధంగా ఉండడం, పట్టుకొని నిలవడం అనే భావాన్ని తెలుగులో సజీవంగా వ్యక్తపరుస్తుంది; కేవలం భౌతికంగా ‘తో ఉండడం’ అనే అపార్థాన్ని తగ్గిస్తుంది.
- source_word: τῷ κυρίῳ
  choice: ప్రభువును
  rationale: κύριος అనే బిరుదుకు సాంప్రదాయబద్ధమైన, ఆధునిక పాఠకులకు సులభమైన తెలుగు సమానార్థకం. ‘హత్తుకొని ఉండు’ అనే తెలుగు ప్రయోగానికి అనుగుణంగా ద్వితీయా విభక్తి వాడబడింది.
theological_decisions:
- issue: ‘దేవుని కృప’ అనే పదబంధం యొక్క సందర్భార్థం
  choice: అంతియొకయ విశ్వాసుల మధ్య కనిపించిన దేవుని కృపాపూర్వక కార్యాన్ని సూచించగలిగేలా ‘దేవుని కృప’ అనే పదబంధాన్నే నిలిపివేయడం
  alternative: ‘దేవుడు చేసిన కార్యం’ అని స్పష్టీకరించడం
  rationale: గ్రీకు పాఠం కృపను కనిపించే దేవుని కార్యంగా సూచించవచ్చు, కానీ దానిని నేరుగా కార్యం అని వ్యాఖ్యానించదు. అందువల్ల వేదాంతపరమైన విస్తృతిని, ఉద్విగ్నతను అనువాదం నిలుపుతుంది.
- issue: προσμένειν τῷ κυρίῳ యొక్క బలం
  choice: ప్రభువుతో నిలకడైన అనుబంధాన్ని ‘ప్రభువును హత్తుకొని ఉండడం’గా వ్యక్తపరచడం
  alternative: ‘ప్రభువుతో కొనసాగడం’ లేదా ‘ప్రభువుకు నమ్మకంగా ఉండడం’
  rationale: ఈ పదబంధం ప్రభువుతో కొనసాగుతూ అంటిపెట్టుకొని ఉండే భావాన్ని కలిగి ఉంది. ఎంపిక చేసిన తెలుగు ప్రయోగం తరువాతి సిద్ధాంతపరమైన ‘పట్టుదల’ వర్గాన్ని బలవంతంగా దిగుమతి చేయకుండా ఆ అనుబంధాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘హృదయపూర్వక సంకల్పంతో’ అంతరంగ దృఢనిశ్చయాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘హత్తుకొని ఉండాలని’ నిలకడైన వ్యక్తిగత అనుబంధాన్ని సాధారణ పాఠకులకు అర్థమయ్యే రీతిలో వ్యక్తపరుస్తుంది.
