revisions:
- from: అతడు అక్కడికి వచ్చి దేవుని కృపను[a] చూసినప్పుడు సంతోషించాడు. వారందరూ హృదయపూర్వక సంకల్పంతో ప్రభువును హత్తుకొని ఉండాలని[b] ప్రోత్సహిస్తూ ఉన్నాడు.
  to: అతడు అక్కడికి వచ్చి దేవుని కృపను[a] చూసి సంతోషించాడు; వారందరినీ హృదయ దృఢసంకల్పంతో ప్రభువుతో నిలిచి ఉండాలని[b] ప్రోత్సహిస్తూ ఉన్నాడు.
  rationale: The revision replaces the overly concrete and grammatically shifted “ప్రభువును హత్తుకొని ఉండాలని” with “ప్రభువుతో నిలిచి ఉండాలని,” which more faithfully expresses προσμένειν τῷ κυρίῳ as ongoing steadfast association with the Lord. “హృదయ దృఢసంకల్పంతో” preserves τῇ προθέσει τῆς καρδίας without unnecessary expansion, and the footnote anchors remain attached to the corresponding phrases.
