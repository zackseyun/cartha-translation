source:
  edition: SBLGNT
  text: εἰς ἣν ἀτενίσας κατενόουν καὶ εἶδον τὰ τετράποδα τῆς γῆς καὶ τὰ θηρία καὶ τὰ ἑρπετὰ καὶ τὰ πετεινὰ τοῦ οὐρανοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/006.yaml
  text: As I looked intently into it[a], I was considering it, and I saw the four-footed animals of the earth, the wild beasts, the reptiles, and the birds of the sky.
translation:
  language: te
  text: నేను దానిలోకి తదేకంగా చూసి, దాన్ని జాగ్రత్తగా పరిశీలిస్తూ ఉండగా, భూమికి చెందిన నాలుగు కాళ్ల జంతువులను, అడవి మృగాలను, పాకే ప్రాణులను[a], ఆకాశ పక్షులను చూశాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సరీసృపాలను.” మూలపదం పాకే లేదా నేలమీద కదిలే ప్రాణులనే విస్తృత వర్గాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν
  choice: దానిలోకి
  rationale: ఈ స్త్రీలింగ సర్వనామం ముందు వచనంలోని వస్త్రంలాంటి పాత్రను సూచిస్తుంది. εἰς చూపు దాని లోపలికి మళ్లిన భావాన్ని తెలియజేస్తుంది.
- source_word: ἀτενίσας
  choice: తదేకంగా చూసి
  rationale: దృష్టిని నిలిపి, శ్రద్ధగా చూడడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κατενόουν
  choice: దాన్ని జాగ్రత్తగా పరిశీలిస్తూ ఉండగా
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న పరిశీలనను నిలుపుతూ, తరువాతి εἶδον అనే నిర్దిష్ట దర్శనక్రియతో తేడాను చూపుతుంది.
- source_word: εἶδον
  choice: చూశాను
  rationale: సాధారణ దర్శనార్థాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: τετράποδα τῆς γῆς
  choice: భూమికి చెందిన నాలుగు కాళ్ల జంతువులను
  rationale: నాలుగు కాళ్ల జీవుల వర్గాన్ని స్పష్టంగా తెలుపుతూ, τῆς γῆς లోని భూమికి చెందిన అనే వర్గీకరణను నిలుపుతుంది.
- source_word: θηρία
  choice: అడవి మృగాలను
  rationale: సాధారణ నాలుగు కాళ్ల జంతువుల వర్గం నుంచి అడవి జంతువులను ప్రత్యేకంగా చూపే గ్రీకు పదభేదాన్ని కాపాడుతుంది.
- source_word: ἑρπετά
  choice: పాకే ప్రాణులను
  rationale: కేవలం శాస్త్రీయ వర్గమైన సరీసృపాలకు పరిమితం చేయకుండా, పాకే లేదా నేలమీద కదిలే జీవుల విస్తృత బైబిలు వర్గాన్ని నిలుపుతుంది.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: ఆకాశ పక్షులను
  rationale: ఈ జంతువుల జాబితాలో concrete sense ను సహజంగా అందిస్తూ, ఆకాశానికి చెందిన పక్షుల వర్గీకరణను కాపాడుతుంది.
