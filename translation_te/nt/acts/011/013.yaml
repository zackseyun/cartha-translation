  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπήγγειλεν ⸀δὲ ἡμῖν πῶς εἶδεν τὸν ἄγγελον ἐν τῷ οἴκῳ αὐτοῦ σταθέντα καὶ ⸀εἰπόντα· Ἀπόστειλον εἰς ⸀Ἰόππην καὶ μετάπεμψαι Σίμωνα τὸν ἐπικαλούμενον Πέτρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/013.yaml
  text: And he reported to us how he had seen the angel standing in his house and saying[a], ‘Send to Joppa and summon Simon, who is called Peter.’
translation:
  language: te
  text: 'అతడు, తన ఇంట్లో దేవదూత నిలబడి ఇలా చెప్పడాన్ని తాను ఎలా చూశాడో మాకు వివరించాడు: “యొప్పేకు పంపి, పేతురు అని పిలువబడే సీమోనును పిలిపించు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యొప్పేకు పంపి, పేతురు అని పిలువబడే సీమోనును రప్పించు.” ‘పిలిపించు’గా అనువదించిన క్రియకు ఒక వ్యక్తి కోసం పంపి అతనిని రప్పించు అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: వివరించాడు
  rationale: ἀπαγγέλλω ఇక్కడ ఇతరులకు జరిగినదాన్ని తెలియజేయడం లేదా నివేదించడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగు కథనంలో ‘వివరించాడు’ సహజంగా ఉంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: δέ స్వల్ప కథన అనుసంధానంగా తదుపరి విషయాన్ని ముందుకు నడిపిస్తుంది; తెలుగులో ‘అప్పుడు’ సహజమైన మార్పును సూచిస్తుంది, బలమైన వ్యత్యాసాన్ని కల్పించదు.
- source_word: πῶς
  choice: ఎలా
  rationale: πῶς లోని విధానం/వివరణ భావాన్ని నిలుపుతుంది; దాన్ని కేవలం ‘అని’గా సరళీకరించదు.
- source_word: εἶδεν
  choice: తాను ... చూశాడో
  rationale: గ్రీకు ఏఒరిస్టు నివేదికకు ముందు జరిగిన దర్శనాన్ని సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ‘చూశాడో’ కాలక్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τὸν ἄγγελον
  choice: దేవదూత
  rationale: సందర్భంలో ముందే పేర్కొన్న నిర్దిష్ట దూత ఉద్దేశించబడ్డాడు. తెలుగులో ఈ వాక్యంలో ప్రత్యేక నిర్దేశకాన్ని బలవంతంగా చేర్చకుండానే సందర్భం ఆ నిర్దిష్టతను అందిస్తుంది.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: తన ఇంట్లో
  rationale: οἶκος ఇక్కడ నివాసస్థలాన్ని సూచిస్తుంది. కర్తను తిరిగి సూచించే ‘తన’ తెలుగు భాషలో అస్పష్టతను తగ్గిస్తుంది.
- source_word: σταθέντα
  choice: నిలబడి
  rationale: దేవదూత దర్శనంలో ఉన్న భంగిమ/సన్నిధిని సహజ తెలుగు క్రియావిశేష రూపంలో వ్యక్తం చేస్తుంది.
- source_word: εἰπόντα
  choice: తనతో ఇలా చెప్పడం
  rationale: σταθέντα తో సమన్వయమైన కృదంత భావాన్ని నిలుపుతూ, తెలుగులో ఉద్ధరణకు సహజమైన పరిచయాన్ని ఇస్తుంది.
- source_word: Ἀπόστειλον
  choice: మనుషులను పంపి
  rationale: గ్రీకులో కర్మ స్పష్టంగా లేకపోయినా, μετάπεμψαι (‘రప్పించు/పిలిపించు’) చర్యను చేయడానికి వ్యక్తులను పంపడం తెలుగులో సహజంగా వ్యక్తం కావడానికి ‘మనుషులను’ సందర్భానుగుణంగా పూరించబడింది.
- source_word: εἰς Ἰόππην
  choice: యొప్పేకు
  rationale: నగరాన్ని గమ్యస్థానంగా చూపే εἰς భావాన్ని ‘-కు’ సహజంగా అందిస్తుంది; Ἰόππηకు తెలుగు సంప్రదాయ రూపం ‘యొప్పే’.
- source_word: μετάπεμψαι
  choice: రప్పించు
  rationale: μεταπέμπομαι ఎవరో వచ్చేందుకు వారి కోసం పంపడం అనే భావాన్ని కలిగి ఉంది. ‘రప్పించు’ ఫలితమైన రావడాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: Σίμωνα τὸν ἐπικαλούμενον Πέτρον
  choice: పేతురు అని పిలువబడే సీమోనును
  rationale: సీమోనును సాధారణంగా ఉపయోగించే మరో పేరుతో గుర్తించే కృదంత నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది.
