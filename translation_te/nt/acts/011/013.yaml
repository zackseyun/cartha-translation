- from: 'అప్పుడు అతడు, తన ఇంట్లో దేవదూత నిలబడి తనతో ఇలా చెప్పడం తాను ఎలా చూశాడో మాకు వివరించాడు: “యొప్పేకు మనుషులను పంపి, పేతురు అని పిలువబడే సీమోనును రప్పించు.[a]”'
  to: 'అతడు, తన ఇంట్లో దేవదూత నిలబడి ఇలా చెప్పడాన్ని తాను ఎలా చూశాడో మాకు వివరించాడు: “యొప్పేకు పంపి, పేతురు అని పిలువబడే సీమోనును పిలిపించు.[a]”'
