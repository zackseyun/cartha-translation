id: ACT.11.12
reference: Acts 11:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂τὸ πνεῦμά μοι⸃ συνελθεῖν αὐτοῖς μηδὲν ⸀διακρίναντα. ἦλθον δὲ σὺν ἐμοὶ καὶ οἱ ἓξ ἀδελφοὶ οὗτοι, καὶ εἰσήλθομεν εἰς τὸν οἶκον τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/012.yaml
  text: And the Spirit told me to go with them[a], making no distinction. These six brothers also came with me, and we entered the man's house.
translation:
  language: te
  text: వారితో వెళ్లమని, ఎలాంటి భేదమూ చేయవద్దని ఆత్మ నాతో చెప్పింది.[a] ఈ ఆరుగురు సహోదరులు కూడా నాతో వచ్చారు; మేము ఆ మనిషి ఇంట్లోకి ప్రవేశించాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఏ మాత్రం సంకోచించకుండా,” లేదా “ఏ మాత్రం సందేహించకుండా.” గ్రీకు పదబంధం భేదం చేయకపోవడాన్ని లేదా తటపటాయించకపోవడాన్ని సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμά
  choice: ఆత్మ
  rationale: ప్రకటన ద్వారా నడిపించే ఈ సందర్భంలో ఇది పరిశుద్ధాత్మను సూచిస్తుంది. అయితే మూలంలో ‘పరిశుద్ధ’ అనే విశేషణం లేనందున ‘ఆత్మ’ అని ఉంచాం.
- source_word: εἶπεν ... μοι
  choice: నాకు చెప్పాడు
  rationale: ఇక్కడ λέγω ఆదేశాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగులో ‘నాకు చెప్పాడు’ సహజంగా ఉండి ఆ నిర్దేశ భావాన్ని నిలుపుతుంది.
- source_word: συνελθεῖν αὐτοῖς
  choice: వారితో వెళ్లాలని
  rationale: సందర్భంలో συνέρχομαι ఆ మనుషులతో కలిసి వెళ్లడాన్ని సూచిస్తుంది; ఈ భావానికి ఇది స్పష్టమైన సహజ తెలుగు.
- source_word: μηδὲν διακρίναντα
  choice: ఎలాంటి భేదం చూపకూడదని
  rationale: διακρίνω ఇక్కడ యూదులు, అన్యజనుల మధ్య భేదం చూపకపోవడాన్ని సూచించే అవకాశం బలంగా ఉంది. సందేహించకుండా లేదా సంకోచించకుండా అనే నిజమైన ప్రత్యామ్నాయ భావాలను పాదసూచికలో ఉంచాం.
- source_word: οἱ ἓξ ἀδελφοὶ οὗτοι
  choice: ఈ ఆరుగురు సహోదరులు
  rationale: οὗτοι మరియు ἓξ రెండింటినీ స్పష్టంగా నిలుపుతూ, ఇక్కడి పురుష సహచరులకు ἀδελφοί అనే పదాన్ని లింగసూచకంగా అనువదించాం.
- source_word: εἰσήλθομεν
  choice: మేము ... ప్రవేశించాము
  rationale: అయోరిస్ట్ క్రియకు నేరమైన, కథన శైలికి తగిన అనువాదం.
- source_word: τὸν οἶκον τοῦ ἀνδρός
  choice: ఆ మనిషి ఇంట్లోకి
  rationale: ἀνήρ సూచించే నిర్దిష్ట పురుషుణ్ణి నిలుపుతూ, తెలుగు వాక్య నిర్మాణానికి సహజంగా అనువదించాం.
theological_decisions:
- issue: μηδὲν διακρίναντα అనే పదబంధం యొక్క భావం
  choice: ఎలాంటి భేదం చూపకూడదని
  alternative: సంకోచించకుండా; సందేహించకుండా
  rationale: పేతురు అన్యజనుడి ఇంట్లోకి వెళ్లడాన్ని సమర్థిస్తున్న తక్షణ సందర్భంలో యూదులు, అన్యజనుల మధ్య భేదం చూపకపోవడం ప్రధాన భావంగా సరిపోతుంది. అయితే గ్రీకు పదానికి సంకోచించకపోవడం లేదా సందేహించకపోవడం అనే భావాలు కూడా సాధ్యమైనందున వాటిని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘ఆత్మ’ అనే సంక్షిప్త రూపాన్ని నిలిపి, వివాదాస్పద గ్రీకు పదబంధంలోని భావ వైవిధ్యాన్ని పాదసూచికలో భద్రపరిచాం.
