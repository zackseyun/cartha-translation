  to: వారితో వెళ్లమని, ఎలాంటి భేదమూ చేయవద్దని ఆత్మ నాతో చెప్పింది.[a] ఈ ఆరుగురు సహోదరులు కూడా నాతో వచ్చారు; మేము ఆ మనిషి ఇంట్లోకి ప్రవేశించాము.
