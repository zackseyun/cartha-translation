  terminology: ‘ఆత్మ,’ ‘సహోదరులు,’ and ‘భేదం’ are appropriate. ‘భేదమూ చేయవద్దని’ preserves the source's disputed wording without importing a more interpretive term such as discrimination. The footnote retains both viable alternatives.
