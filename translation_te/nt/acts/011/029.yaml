id: ACT.11.29
reference: Acts 11:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῶν δὲ μαθητῶν καθὼς εὐπορεῖτό τις ὥρισαν ἕκαστος αὐτῶν εἰς διακονίαν πέμψαι τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/029.yaml
  text: So the disciples determined[a], each according to his ability[b], to send relief to the brothers living in Judea.
translation:
  language: te
  text: కాబట్టి శిష్యులు తమలో ప్రతి ఒక్కరూ తమ ఆర్థిక స్థోమతకు తగినట్లుగా[a] యూదయలో నివసిస్తున్న సహోదరులకు[b] సహాయం పంపాలని నిర్ణయించుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఎవరికి ఎంత సమృద్ధి కలిగిందో దాని ప్రకారం”; భావం, ప్రతి ఒక్కరూ తాము ఇవ్వగలిగినంతగా.
    reason: lexical_alternative
  - marker: b
    text: “సహోదరులు” అనే పదం ఇక్కడ యూదయలోని తోటి విశ్వాసులను, విస్తృత క్రైస్తవ సమాజాన్ని సూచించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητῶν
  choice: శిష్యులు
  rationale: అపొస్తలుల కార్యముల సందర్భంలో యేసును అనుసరించేవారిని సూచించే స్థిరమైన, సహజమైన తెలుగు పదం.
- source_word: καθὼς εὐπορεῖτό τις
  choice: తమ ఆర్థిక స్థోమతకు తగినట్లుగా
  rationale: εὐπορέω ఇక్కడ సాధారణ సామర్థ్యాన్ని కాక, ఒకరి వద్ద ఉన్న ఆర్థిక వనరులు లేదా ఇవ్వగల స్థితిని సూచిస్తుంది.
- source_word: ὥρισαν
  choice: నిర్ణయించుకున్నారు
  rationale: ఆలోచించి తీసుకున్న ఉద్దేశపూర్వక నిర్ణయాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἕκαστος αὐτῶν
  choice: తమలో ప్రతి ఒక్కరూ
  rationale: మూలంలోని పంపిణీ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: εἰς διακονίαν πέμψαι
  choice: సహాయం పంపాలని
  rationale: ఈ సందర్భంలో διακονία అవసరంలో ఉన్న విశ్వాసులకు అందించే ఆచరణాత్మక సేవ లేదా సహాయాన్ని సూచిస్తుంది; తెలుగులో ఈ కలయిక సహజంగా ఉంటుంది.
- source_word: τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ
  choice: యూదయలో నివసిస్తున్న
  rationale: నివాసాన్ని సూచించే గ్రీకు వర్తమాన కృదంతాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: ἀδελφοῖς
  choice: సహోదరులకు
  rationale: గ్రీకు పుంలింగ బహువచన కుటుంబసంబంధ పదాన్ని నిలుపుతూ, సంఘసభ్యుల మధ్య ఆత్మీయ బంధాన్ని వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ἀδελφοῖς అనే పుంలింగ బహువచనం యూదయలోని క్రైస్తవ సమాజాన్ని సూచించడం
  choice: సహోదరులకు
  alternative: తోటి విశ్వాసులకు; సహోదర సహోదరీలకు
  rationale: మూలంలోని పుంలింగ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది విస్తృత విశ్వాసుల సమాజాన్ని కూడా సూచించవచ్చనే భావాన్ని పాదసూచికలో తెలియజేస్తుంది; తద్వారా మూలంలోని రూపాన్ని గానీ, సందర్భంలోని సమగ్రతను గానీ ఏకపక్షంగా తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. “ఆర్థిక స్థోమత” ద్వారా సందర్భంలోని వనరుల భావం స్పష్టమవుతుంది; “సహాయం పంపడం” ద్వారా διακονία యొక్క ఆచరణాత్మక సేవాభావం సహజంగా వ్యక్తమవుతుంది.
