revisions:
- from: 'అప్పుడు ప్రభువు చెప్పిన మాట నాకు గుర్తొచ్చింది: “యోహాను నీళ్లతో బాప్తిస్మం ఇచ్చాడు; అయితే మీరు పరిశుద్ధాత్మలో[a] బాప్తిస్మం పొందుతారు.”'
  to: 'అప్పుడు ప్రభువు చెప్పిన మాట నాకు గుర్తొచ్చింది: “యోహాను నీటితో బాప్తిస్మం ఇచ్చాడు; అయితే మీరు పరిశుద్ధాత్మలో[a] బాప్తిస్మం పొందుతారు.”'
  rationale: 'Two limited revisions improve formal register and grammatical precision: “నీటితో” replaces the more conversational “నీళ్లతో,” and the footnote correctly calls ἐν a Greek preposition. The source’s ambiguity concerning ἐν is preserved in the main text and footnote.'
