id: ACT.11.16
reference: Acts 11:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐμνήσθην δὲ τοῦ ῥήματος ⸀τοῦ κυρίου ὡς ἔλεγεν· Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ βαπτισθήσεσθε ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/016.yaml
  text: Then I remembered the word of the Lord[a], how he said, ‘John baptized with water, but you will be baptized in the Holy Spirit.’
translation:
  language: te
  text: 'అప్పుడు ప్రభువు చెప్పిన మాట నాకు గుర్తొచ్చింది: “యోహాను నీటితో బాప్తిస్మం ఇచ్చాడు; అయితే మీరు పరిశుద్ధాత్మలో[a] బాప్తిస్మం పొందుతారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిశుద్ధాత్మతో.” గ్రీకు ఉపసర్గ ఇక్కడ “లో” అనే భావాన్నిగానీ, “తో” అనే సాధనార్థాన్నిగానీ ఇవ్వవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθην
  choice: నాకు గుర్తొచ్చింది
  rationale: ఈ రూపం భావపరంగా కర్తరి అర్థంలో ఉంది. ఆధునిక తెలుగులో జ్ఞాపకానికి వచ్చిన సందర్భాన్ని ‘నాకు గుర్తొచ్చింది’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ బలమైన వ్యతిరేకతకన్నా కథనంలోని తదుపరి పరిణామాన్ని సూచిస్తుంది.
- source_word: τοῦ ῥήματος τοῦ κυρίου
  choice: ప్రభువు చెప్పిన మాట
  rationale: ῥῆμα ఇక్కడ పలికిన మాటను సూచిస్తుంది; సంబంధవిభక్తి నిర్మాణాన్ని సహజమైన తెలుగులో ‘ప్రభువు చెప్పిన మాట’గా వ్యక్తపరిచాం. κύριος యొక్క అధికారభావాన్ని ‘ప్రభువు’ నిలుపుతుంది.
- source_word: ὡς ἔλεγεν
  choice: చెప్పిన
  rationale: ఇక్కడ అసంపూర్ణ భూతకాల రూపం తప్పనిసరిగా అలవాటుగా పలుమార్లు చెప్పడాన్ని సూచించదు. తెలుగులో ఉల్లేఖనాన్ని పరిచయం చేసే సహజ నిర్మాణంలో దీనిని ముందరి నామబంధంతో కలిపాం.
- source_word: μὲν ... δὲ
  choice: అయితే
  rationale: యోహాను చేసిన బాప్తిస్మానికి శ్రోతలు పొందబోయే బాప్తిస్మానికి మధ్య ఉన్న వ్యత్యాసాన్ని సహజంగా చూపుతుంది.
- source_word: ἐβάπτισεν ὕδατι
  choice: నీళ్లతో బాప్తిస్మం ఇచ్చాడు
  rationale: ὕδατι సాధనార్థక దత్తివుగా ఉంది. తెలుగు క్రైస్తవ వాడుకలో కర్తరి వాక్యానికి ‘బాప్తిస్మం ఇచ్చాడు’ సహజంగా ఉంటుంది.
- source_word: βαπτισθήσεσθε
  choice: బాప్తిస్మం పొందుతారు
  rationale: భవిష్యత్ కర్మణి భావాన్ని తెలుగులో సహజమైన ‘పొందుతారు’ నిర్మాణంతో నిలిపాం.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: పరిశుద్ధాత్మలో
  rationale: ἐν యొక్క స్థానార్థక అవకాశాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, సాధనార్థకమైన ‘పరిశుద్ధాత్మతో’ అనే సాధ్యమైన అనువాదాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: κύριος పదానికి అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఈ సందర్భంలో ఇది యేసు అధికారపూర్వకంగా చెప్పిన మాటను సూచిస్తుంది. ‘ప్రభువు’ మూలంలోని అధికార మరియు ధార్మిక ప్రాధాన్యాన్ని సహజంగా నిలుపుతుంది.
- issue: ἐν πνεύματι ἁγίῳ లోని ἐν
  choice: పరిశుద్ధాత్మలో
  alternative: పరిశుద్ధాత్మతో
  rationale: ἐν ఇక్కడ స్థానార్థకంగానూ సాధనార్థకంగానూ అర్థం కావచ్చు. ప్రధాన పాఠ్యంలో ‘లో’ను ఉంచి, మరొక సమర్థనీయ పఠనాన్ని పాదసూచికలో ఇవ్వడం ద్వారా మూలంలోని అనిశ్చితిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘బాప్తిస్మం’ మరియు ‘పరిశుద్ధాత్మ’ వంటి స్థిరపడిన బైబిలు పదాలను నిలిపి, అతిగా పాతబడిన శైలిని నివారించాం.
