id: ACT.11.17
reference: Acts 11:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ οὖν τὴν ἴσην δωρεὰν ἔδωκεν αὐτοῖς ὁ θεὸς ὡς καὶ ἡμῖν πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν, ⸀ἐγὼ τίς ἤμην δυνατὸς κωλῦσαι τὸν θεόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/017.yaml
  text: If then God gave to them the same gift as also to us who believed in the Lord Jesus the Messiah[b][a], who was I that I could hinder God?
translation:
  language: te
  text: కాబట్టి, ప్రభువైన యేసు మెస్సీయపై[a] విశ్వాసముంచిన మనకు[b] ఇచ్చిన అదే వరాన్ని దేవుడు వారికీ ఇచ్చినట్లయితే, దేవుణ్ణి అడ్డగించగల నేను ఎవరు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘క్రీస్తుపై’. గ్రీకు Χριστόν అంటే ‘మెస్సీయ’ లేదా ‘క్రీస్తు’. ఇక్కడ అది బిరుదుగా అర్థవంతంగా ఉంది.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘మనం ప్రభువైన యేసు మెస్సీయపై విశ్వాసముంచినప్పుడు మనకు’. గ్రీకు కృదంతాన్ని సందర్భంలో కాలార్థకంగా కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσην δωρεάν
  choice: అదే వరాన్ని
  rationale: ἴσην ఇక్కడ రెండు వర్గాలకు దేవుడు ఇచ్చిన వరం సమానమైనదని సూచిస్తుంది. సందర్భంలో ‘అదే వరం’ సహజంగా ఉండి ఆ సమానత్వాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν
  choice: ప్రభువైన యేసు మెస్సీయపై విశ్వాసముంచిన మనకు
  rationale: πιστεύσασιν అనేది ἡμῖν‌తో ఏకీభవించే భూతకాల కృదంతం; అందువల్ల ప్రధాన పాఠంలో దాని వర్ణనాత్మక సంబంధాన్ని నిలిపాం. ἐπὶ + ద్వితీయా విభక్తి విశ్వాసం ఎవరిపై ఉంచబడిందో సూచిస్తుంది.
- source_word: κύριον
  choice: ప్రభువైన
  rationale: ఇది యేసుకు చెందిన బిరుదు. తెలుగులో తరువాతి పేరుతో సహజంగా కలిసేలా ‘ప్రభువైన’ అని అనువదించాం.
- source_word: Χριστόν
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ అర్థవంతమైన బిరుదుగా ఉంది; అందువల్ల దాని మెస్సీయ సంబంధిత భావాన్ని అనువాదంలో నిలిపాం.
- source_word: ἐγὼ τίς ἤμην δυνατὸς
  choice: నేనెవరిని?
  rationale: దేవుని కార్యాన్ని ఎదిరించగల హక్కు లేదా సామర్థ్యం తనకు లేదని పేతురు తెలిపే అలంకార ప్రశ్నను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘అడ్డుకోవడానికి’తో కలిపి δυνατός భావం సందర్భంలో వ్యక్తమవుతుంది.
- source_word: κωλῦσαι τὸν θεόν
  choice: దేవుణ్ణి అడ్డుకోవడానికి
  rationale: κωλύω యొక్క అడ్డగించడం/నిరోధించడం అనే భావాన్ని, దేవుడే ప్రత్యక్ష కర్మగా ఉన్న గ్రీకు వాక్యంలోని బలమైన వ్యక్తీకరణను నిలుపుతుంది.
theological_decisions:
- issue: κύριον Ἰησοῦν Χριστόν లో Χριστόν అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός కేవలం పేరులో భాగంలా కాక అర్థవంతమైన బిరుదుగా పనిచేస్తోంది. ‘మెస్సీయ’ ఆ యూదీయ అభిషిక్తుని భావాన్ని నిలుపుతుంది; పరిచితమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: πιστεύσασιν మరియు ἡμῖν మధ్య సంబంధం
  choice: 'వర్ణనాత్మకంగా: ‘విశ్వాసముంచిన మనకు’'
  alternative: 'కాలార్థకంగా: ‘మనం విశ్వసించినప్పుడు’'
  rationale: కృదంతం వ్యాకరణపరంగా ἡμῖν‌తో ఏకీభవిస్తుంది. ప్రధాన పాఠం ఆ నిర్మాణాన్ని నిలుపుతుంది; అయితే సందర్భంలో కాలార్థం కూడా సాధ్యమైనందున దాన్ని పాదసూచికలో ఇచ్చి రక్షణక్రమంపై అనవసరమైన సిద్ధాంత నిర్ణయాన్ని నివారించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘వరాన్ని’, ‘విశ్వాసముంచిన’, ‘అడ్డుకోవడానికి’ వంటి సాధారణంగా అర్థమయ్యే పదాలను ఉపయోగించాం. గ్రీకు వాక్యంలోని అలంకార ప్రశ్నను అలాగే నిలిపాం.
