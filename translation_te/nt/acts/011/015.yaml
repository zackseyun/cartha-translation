id: ACT.11.15
reference: Acts 11:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν ἐπέπεσεν τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτοὺς ὥσπερ καὶ ἐφ’ ἡμᾶς ἐν ἀρχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/015.yaml
  text: And as I began to speak[c][b][a], the Holy Spirit fell on them just as it had on us at the beginning.
translation:
  language: te
  text: నేను మాట్లాడడం మొదలుపెట్టినప్పుడు,[a] ఆరంభంలో మన మీదికి వచ్చినట్టే[b] పరిశుద్ధాత్మ వారి మీదికి వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను మాట్లాడడం మొదలుపెట్టగానే.” గ్రీకు నిర్మాణాన్ని “మొదలుపెట్టినప్పుడు” లేదా “మొదలుపెట్టగానే” అని అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ఆరంభంలో” అనేది శిష్యుల మీద పరిశుద్ధాత్మ కుమ్మరించబడడం మొదలైన సందర్భాన్ని, అంటే పెంతెకొస్తును, సూచించే అవకాశం ఉంది.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν
  choice: నేను మాట్లాడడం మొదలుపెట్టగానే
  rationale: ἐν + articular infinitive సమకాలిక సమయాన్ని సూచిస్తుంది. ‘మొదలుపెట్టగానే’ సహజమైన తెలుగులో పేతురు ప్రసంగం ఆరంభమైనప్పుడే సంఘటన జరిగిందనే భావాన్ని నిలుపుతుంది; ‘మొదలుపెట్టినప్పుడు’ కూడా సాధ్యమే.
- source_word: ἐπέπεσεν
  choice: మీదికి వచ్చాడు
  rationale: ἐπιπίπτω యొక్క పదచిత్రం అక్షరార్థంగా ‘మీద పడ్డాడు’ అయినా, పరిశుద్ధాత్మను ఉద్దేశించిన ఆధునిక తెలుగులో ‘మీదికి వచ్చాడు’ సహజంగా, గౌరవప్రదంగా ఉండి, ఆత్మ ప్రజలపైకి రావడం అనే అపొస్తలుల కార్యముల వాడుకను తెలియజేస్తుంది.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: పరిశుద్ధాత్మ
  rationale: ఇది ఆధునిక ప్రామాణిక తెలుగులో స్థిరమైన, స్పష్టమైన దైవిక బిరుదు.
- source_word: ἐπ’ αὐτούς
  choice: వారి మీదికి
  rationale: ἐπί సూచించే దిశను నిలుపుతూ, తరువాతి ‘మన మీదికి’ అనే సమాంతర నిర్మాణంతో సరిపోలుతుంది.
- source_word: ὥσπερ καὶ ἐφ’ ἡμᾶς
  choice: మన మీదికి వచ్చినట్టే
  rationale: ὥσπερ యొక్క సన్నిహిత పోలికను ‘వచ్చినట్టే’ తెలియజేస్తుంది; καί లోని ‘కూడా/అలాగే’ భావం తెలుగు ‘-ట్టే’ నిర్మాణంలో సహజంగా వ్యక్తమవుతుంది. అర్థమయ్యేందుకు సందర్భంలో సూచితమైన క్రియను పూరించాం.
- source_word: ἐν ἀρχῇ
  choice: ఆరంభంలో
  rationale: సృష్టి ఆరంభం అనే అపార్థాన్ని రానీయకుండా, పోల్చబడుతున్న మునుపటి అనుభవపు ఆరంభాన్ని విస్తృతంగానే ఉంచే సహజ కాలసూచన.
theological_decisions:
- issue: ἐν ἀρχῇ (‘ఆరంభంలో’) దేనిని సూచిస్తుంది?
  choice: అనువాదంలో ‘ఆరంభంలో’ అని విస్తృతంగా ఉంచి, పాదసూచికలో పెంతెకొస్తు సంఘటనను సంభావ్య సూచనగా పేర్కొనడం
  alternative: నేరుగా ‘పెంతెకొస్తు రోజున’ అని అనువదించడం; లేదా నిర్దిష్ట సూచన లేకుండా ‘మొదట్లో’ అని మాత్రమే ఇవ్వడం
  rationale: సందర్భంలో పేతురు అన్యజనులపై ఆత్మ రావడాన్ని ‘మన మీదికి’ వచ్చిన మునుపటి సంఘటనతో పోలుస్తున్నాడు; ఇది అపొస్తలుల కార్యములు 2లోని పెంతెకొస్తును బలంగా సూచిస్తుంది. అయితే గ్రీకు పాఠం పెంతెకొస్తు అని ప్రత్యక్షంగా చెప్పదు కాబట్టి ప్రధాన పాఠంలో ఆ గుర్తింపును ఖరారు చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా, అయితే వాక్య గాంభీర్యాన్ని కాపాడే శైలి. ‘మీద పడ్డాడు’ అనే అత్యక్షరార్థ రూపం తెలుగులో అనవసర ప్రతికూల ఛాయ కలిగించగలందున ‘మీదికి వచ్చాడు’ వాడబడింది. మూలంలోని పోలిక మరియు ‘ఆరంభం’ గురించిన వ్యాఖ్యాన విస్తృతి నిలుపబడ్డాయి.
