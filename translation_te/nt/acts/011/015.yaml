review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the Holy Spirit's coming upon 'them' in comparison with the earlier coming upon 'us,' and it appropriately leaves ἐν ἀρχῇ broad in the main text. However, 'మొదలుపెట్టగానే' can suggest 'immediately after I began,' whereas ἐν τῷ + infinitive is more directly contemporaneous ('when/as I began').
  naturalness: The Telugu is clear and suitably formal. 'నేను మాట్లాడడం మొదలుపెట్టినప్పుడు' is more natural for the source's temporal construction than 'మొదలుపెట్టగానే.'
  terminology: ‘పరిశుద్ధాత్మ’ is standard modern Telugu Christian terminology. ‘వారి మీదికి వచ్చాడు’ is an acceptable idiomatic rendering of ἐπέπεσεν in this context and retains the parallel with ‘మన మీదికి.’
  issues:
  - severity: medium
    issue: Temporal force of ‘మొదలుపెట్టగానే’
    rationale: This wording may imply that the event occurred immediately after Peter began speaking. The Greek construction indicates the time at which/as he began speaking, without requiring a subsequent sequence. ‘మొదలుపెట్టినప్పుడు’ preserves that sense more safely.
  revised_text: నేను మాట్లాడడం మొదలుపెట్టినప్పుడు,[a] ఆరంభంలో మన మీదికి వచ్చినట్టే[b] పరిశుద్ధాత్మ వారి మీదికి వచ్చాడు.
