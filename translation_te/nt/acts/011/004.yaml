translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని స్వల్ప వ్యత్యాస సూచనను ‘అయితే’తో, క్రమబద్ధ వివరణ భావాన్ని ‘వరుసగా’తో నిలిపాం. ‘జరిగినదాన్ని’ అనేది ἐξετίθετο యొక్క సందర్భసిద్ధ కర్మను తెలుగులో స్పష్టంచేస్తుంది.
