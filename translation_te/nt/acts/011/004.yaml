  text: ἀρξάμενος ⸀δὲ Πέτρος ἐξετίθετο αὐτοῖς καθεξῆς λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/004.yaml
  text: But Peter began and explained it to them in order[a], saying,
translation:
  language: te
  text: 'అయితే పేతురు మొదలుపెట్టి, జరిగినదాన్ని వారికి వరుసగా వివరించాడు[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఒక్కొక్కటిగా క్రమపద్ధతిలో వారికి తెలియజేశాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρξάμενος
  choice: మొదలుపెట్టి
  rationale: ἄρχω క్రియకు చెందిన ఈ భూతకాల మధ్యమ కృదంతం ప్రధాన క్రియతో క్రియావిశేషణాత్మకంగా అనుసంధానమైంది. ‘మొదలుపెట్టి’ అనే రూపం ఆ కృదంత సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వచనంలోని అభ్యంతరం నుంచి పేతురు ఇచ్చిన సమాధానానికి స్వల్ప వ్యత్యాసంతో కూడిన మార్పును సూచిస్తుంది.
- source_word: Πέτρος
  choice: పేతురు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ἐξετίθετο
  choice: వివరించాడు
  rationale: ఇక్కడ ἐκτίθημι అంటే ఒక విషయాన్ని ముందుంచి విపులంగా తెలియజేయడం. అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న వివరణ భావం సందర్భం మరియు తరువాత వచ్చే ప్రత్యక్ష ప్రసంగం ద్వారా వ్యక్తమవుతుంది.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: పేతురుతో మాట్లాడిన వారిని సూచించే బహువచన సంప్రదాన రూపానికి సహజమైన తెలుగు సమానం.
- source_word: καθεξῆς
  choice: వరుసగా
  rationale: సంఘటనలను క్రమానుసారంగా తెలియజేశాడనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది; ‘మొదటినుంచి’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: λέγων
  choice: 'వివరించాడు:'
  rationale: ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేసే λέγων భావాన్ని తెలుగు విరామచిహ్నమైన ద్విబిందువు సహజంగా నిర్వహిస్తుంది; ‘అంటూ’ అని విడిగా ఉంచితే తదుపరి వచనంతో కలిసినప్పుడు అసహజత కలగవచ్చు.
