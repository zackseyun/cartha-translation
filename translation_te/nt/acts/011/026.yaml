id: ACT.11.26
reference: Acts 11:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εὑρὼν ⸀ἤγαγεν εἰς Ἀντιόχειαν. ἐγένετο δὲ ⸂αὐτοῖς καὶ⸃ ἐνιαυτὸν ὅλον συναχθῆναι ⸀ἐν τῇ ἐκκλησίᾳ καὶ διδάξαι ὄχλον ἱκανόν, χρηματίσαι τε ⸀πρώτως ἐν Ἀντιοχείᾳ τοὺς μαθητὰς Χριστιανούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/026.yaml
  text: And when he found him, he brought him to Antioch. And for a whole year they met together with the church and taught a considerable crowd; and it was in Antioch that the disciples were first called Christians.
translation:
  language: te
  text: అతన్ని కనుగొని, అంతియొకయకు తీసుకొచ్చాడు. వారిద్దరూ ఒక సంవత్సరం అంతా సంఘంతో కలిసి సమావేశమై[a], గణనీయమైన జనసమూహానికి బోధించారు. అంతియొకయలో శిష్యులు మొదటిసారిగా “క్రైస్తవులు” అని పిలవబడ్డారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సంఘంలో సమావేశమై.” ఇక్కడ ‘సంఘం’ అనేది భవనం కన్నా విశ్వాసుల సమాజాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు వాక్యం అక్షరార్థంగా, “శిష్యులు మొదట క్రైస్తవులు అని పిలవబడ్డారు” అని చెబుతుంది. ఈ పేరు అంతియొకయలో ప్రజలు వారిని గుర్తించడానికి ఉపయోగించిన పేరుగా మొదలై ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: εὑρὼν
  choice: అతన్ని కనుగొని
  rationale: ముఖ్య క్రియకు ముందు జరిగిన చర్యను సూచించే భూతకాల కృదంతాన్ని తెలుగులో సహజమైన పూర్వకాల క్రియారూపంతో వ్యక్తం చేస్తుంది.
- source_word: ἤγαγεν
  choice: తీసుకొచ్చాడు
  rationale: సందర్భంలో సౌలును అంతియొకయకు వెంట తీసుకురావడమే భావం; ఇది ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: ἐνιαυτὸν ὅλον
  choice: ఒక సంవత్సరం అంతా
  rationale: కాలవ్యవధిని స్పష్టంగా, మూలంలోని సంపూర్ణత భావంతో తెలియజేస్తుంది.
- source_word: συναχθῆναι ἐν τῇ ἐκκλησίᾳ
  choice: సంఘంతో కలిసి సమావేశమై
  rationale: ἐκκλησίαను భవనంగా కాక విశ్వాసుల సమాజంగా గ్రహిస్తూ, కూడికలో వారితో పాలుపంచుకున్న భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκκλησίᾳ
  choice: సంఘం
  rationale: అపొస్తలుల కార్యముల సందర్భంలో ఈ పదం సాధారణంగా క్రైస్తవ సమాజాన్ని సూచిస్తుంది; ‘సంఘం’ భవనార్థాన్ని అనవసరంగా సూచించదు.
- source_word: ὄχλον ἱκανόν
  choice: చాలామందికి
  rationale: గణనీయమైన సంఖ్యలో ప్రజలకు బోధించారనే భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: χρηματίσαι
  choice: అని పిలవబడింది
  rationale: ఒక సమూహానికి పేరు లేదా ప్రజా గుర్తింపు ఏర్పడిన భావాన్ని మూలంలోని నిష్క్రియ రూపానికి దగ్గరగా ఉంచుతుంది.
- source_word: πρώτως
  choice: మొదటిసారిగా
  rationale: ఆ పేరు మొదట అక్కడే వాడబడిందనే తొలి సంభవాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: Χριστιανούς
  choice: క్రైస్తవులు
  rationale: ఇది Χριστός అనే బిరుదు యొక్క సాధారణ ప్రయోగం కాక, స్థిరపడిన సమూహనామం; తెలుగులో ప్రామాణికమైన, సహజమైన సమానార్థక నామం ‘క్రైస్తవులు’.
theological_decisions:
- issue: Χριστιανούς అనే సమూహనామాన్ని ఎలా అనువదించాలి
  choice: క్రైస్తవులు
  alternative: క్రీస్తువాదులు / మెస్సీయవాదులు
  rationale: ఇక్కడ పదం ఒక స్థిరపడిన ప్రజా సమూహనామంగా పనిచేస్తుంది. దాని వ్యుత్పత్తిని బలవంతంగా ముందుకు తెచ్చే ప్రత్యామ్నాయాలు తెలుగులో అసహజంగా ఉండటమే కాక, మూలంలో లేని సిద్ధాంతపరమైన లేదా పక్షపాత భావాన్ని కలిగించవచ్చు.
- issue: ἐν τῇ ἐκκλησίᾳ సంఘభవనాన్నా లేక విశ్వాసుల సమాజాన్నా సూచిస్తుంది
  choice: సంఘంతో కలిసి
  alternative: సంఘంలో
  rationale: మూలంలోని ἐν నిర్మాణం కొంత విస్తృతంగా ఉన్నప్పటికీ, తొలి క్రైస్తవ సందర్భంలో ἐκκλησία ప్రధానంగా ప్రజల సమాజాన్ని సూచిస్తుంది. ఎంపిక చేసిన రూపం భవనార్థాన్ని రుద్దకుండా సమాజంతో కూడి సమావేశమైన భావాన్ని ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మొదటి వాక్యంలో మూలంలో వ్యక్తుల పేర్లు లేకపోవడం వల్ల వాటిని చేర్చలేదు; సందర్భం ద్వారా బర్నబా, సౌలు స్పష్టమవుతారు. చివరి వాక్యంలో ‘అంతియొకయలోనే’ అనే కేంద్రీకరణ πρώτως మరియు స్థాన ప్రాధాన్యాన్ని సహజ తెలుగులో బలపరుస్తుంది.
