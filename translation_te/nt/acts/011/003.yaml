  text: λέγοντες ὅτι ⸂Εἰσῆλθες πρὸς ἄνδρας ἀκροβυστίαν ἔχοντας καὶ συνέφαγες⸃ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/003.yaml
  text: saying[a], “You went in to uncircumcised men and ate with them.”
translation:
  language: te
  text: అంటూ[a], “నువ్వు సున్నతి లేని పురుషుల వద్దకు వెళ్లి, వారితో కలిసి భోజనం చేశావు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సున్నతి లేని పురుషుల దగ్గరికి”; ఈ మాట సున్నతి అనే యూదుల ఒడంబడిక గుర్తు లేనివారిని, అంటే అన్యజనులను, సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: అంటూ
  rationale: వర్తమాన కృదంతం మునుపటి వాక్యంతో అనుసంధానమై ఆరోపణలోని మాటలను పరిచయం చేస్తుంది; ‘అంటూ’ సహజమైన తెలుగు ప్రయోగం.
- source_word: ὅτι
  choice: ప్రత్యక్ష ఉల్లేఖన చిహ్నాలు
  rationale: ఇక్కడ ὅτι ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది; తెలుగులో ఉల్లేఖన చిహ్నాలతో చూపడం సహజం.
- source_word: Εἰσῆλθες πρὸς
  choice: దగ్గరికి వెళ్లి
  rationale: వ్యక్తుల వద్దకు వెళ్లడం లేదా వారితో సహవాసంలోకి ప్రవేశించడం అనే భావం ఉంది; ఆరోపణలోని వారి సమీపానికి వెళ్లిన భావాన్ని ఇది సహజంగా నిలుపుతుంది.
- source_word: ἄνδρας
  choice: పురుషుల
  rationale: ἀνήρ ఇక్కడ సాధారణంగా ప్రజలు అని కాక పురుషులను సూచిస్తుంది.
- source_word: ἀκροβυστίαν ἔχοντας
  choice: సున్నతి లేని
  rationale: ‘సున్నతి లేకపోవడం కలిగిన’ అనే మూలభాషా వ్యక్తీకరణను సహజమైన తెలుగులో అందిస్తూ, అన్యజనులు అని వివరణాత్మకంగా మార్చకుండా ఒడంబడిక చిహ్నానికి సంబంధించిన ఆరోపణను నిలుపుతుంది.
- source_word: συνέφαγες αὐτοῖς
  choice: వారితో కలిసి భోజనం చేశావు
  rationale: συνεσθίω కలిసి తినడాన్ని సూచిస్తుంది; ‘కలిసి భోజనం చేశావు’ సహభోజన భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ἀκροβυστίαν ἔχοντας ను ‘అన్యజనులు’గా అర్థానువాదం చేయాలా, లేక సున్నతి లేనివారిగా అనువదించాలా
  choice: సున్నతి లేని పురుషులు
  alternative: అన్యజనులు
  rationale: వక్తల అభ్యంతరం కేవలం జాతి గుర్తింపుపై కాక, సున్నతి అనే ఒడంబడిక గుర్తు మరియు సామాజిక-మత హద్దుపై కేంద్రీకృతమైంది. అందువల్ల మూలంలోని ఉద్రిక్తతను ‘సున్నతి లేని’ అనే రూపం మెరుగుగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ప్రత్యక్ష ఆరోపణలోని ఏకవచన సంబోధనను ‘నువ్వు’తో, పురుషులను సూచించే మూలపదాన్ని ‘పురుషులు’తో నిలిపాం.
