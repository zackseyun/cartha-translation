id: ACT.18.24
reference: Acts 18:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰουδαῖος δέ τις Ἀπολλῶς ὀνόματι, Ἀλεξανδρεὺς τῷ γένει, ἀνὴρ λόγιος, κατήντησεν εἰς Ἔφεσον, δυνατὸς ὢν ἐν ταῖς γραφαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/024.yaml
  text: A certain Jew named Apollos[a], an Alexandrian by birth, an eloquent man, arrived in Ephesus, being mighty in the Scriptures.
translation:
  language: te
  text: అలెగ్జాండ్రియాలో పుట్టిన అపొల్లో అనే ఒక యూదుడు ఎఫెసుకు వచ్చాడు. అతడు వాక్చాతుర్యం గలవాడు[a], లేఖనాల్లో ఎంతో ప్రావీణ్యం గలవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాండిత్యం గలవాడు.” గ్రీకు పదం వాక్చాతుర్యాన్ని లేదా పాండిత్యాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: యూదుడు
  rationale: ఇక్కడ ఈ పదం అపొల్లో భౌగోళికంగా యూదయవాడని కాక, అతని జాతి-మత గుర్తింపును సూచిస్తుంది.
- source_word: δέ τις
  choice: ఒక
  rationale: δέ కథనంలో కొత్త వ్యక్తిని పరిచయం చేసే మార్పును సూచిస్తుంది; τις లోని అనిర్దిష్టతను సహజమైన తెలుగు ‘ఒక’ వ్యక్తపరుస్తుంది. ప్రత్యేకమైన కాలసూచక పదాన్ని చేర్చలేదు.
- source_word: Ἀπολλῶς ὀνόματι
  choice: అపొల్లో అనే
  rationale: ఒక వ్యక్తి పేరును పరిచయం చేసే గ్రీకు నుడికారానికి ఇది సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: Ἀλεξανδρεὺς τῷ γένει
  choice: అలెగ్జాండ్రియాలో పుట్టిన
  rationale: ఈ పదబంధం అతని జన్మస్థలాన్ని లేదా మూలాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: ἀνὴρ λόγιος
  choice: అతడు వాక్చాతుర్యం గలవాడు
  rationale: ἀνήρ అపొల్లో పురుషుడని సూచిస్తుంది; λόγιοςకు ‘వాక్చాతుర్యం గల’ లేదా ‘పాండిత్యం గల’ అనే రెండు భావాలు సాధ్యమైనందున ప్రధాన పాఠ్యంలో మొదటి భావాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: κατήντησεν εἰς Ἔφεσον
  choice: ఎఫెసుకు వచ్చాడు
  rationale: గమ్యస్థానానికి చేరుకోవడాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: δυνατὸς ὢν ἐν ταῖς γραφαῖς
  choice: లేఖనాల్లో ఎంతో ప్రావీణ్యం గలవాడు
  rationale: δυνατός తెలిపే బలమైన సామర్థ్యాన్ని ‘ఎంతో ప్రావీణ్యం’ వ్యక్తపరుస్తుంది; γραφαί ఇక్కడ పవిత్ర లేఖనాలను సూచిస్తుంది.
theological_decisions:
- issue: λόγιος అనే పదంలోని భావసందిగ్ధత
  choice: వాక్చాతుర్యం గలవాడు
  alternative: పాండిత్యం గలవాడు
  rationale: ఈ గ్రీకు పదం వాక్పటిమను గానీ పాండిత్యాన్ని గానీ సూచించవచ్చు. వెంటనే వచ్చే లేఖనప్రావీణ్య ప్రస్తావన ఏ భావాన్నీ పూర్తిగా నిర్ధారించదు; అందువల్ల ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్య నిర్మాణాన్ని ఉపయోగిస్తూ, ‘లేఖనాలు’ వంటి గౌరవప్రదమైన బైబిలు పదజాలాన్ని నిలిపాం. గ్రీకు వాక్యంలోని అనేక వివరణాత్మక భాగాలను తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా అమర్చాం.
