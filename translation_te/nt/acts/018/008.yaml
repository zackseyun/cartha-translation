id: ACT.18.8
reference: Acts 18:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Κρίσπος δὲ ὁ ἀρχισυνάγωγος ἐπίστευσεν τῷ κυρίῳ σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ, καὶ πολλοὶ τῶν Κορινθίων ἀκούοντες ἐπίστευον καὶ ἐβαπτίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/008.yaml
  text: But Crispus[a], the synagogue ruler, believed in the Lord together with his whole household, and many of the Corinthians, hearing, were believing and were being baptized.
translation:
  language: te
  text: అయితే సమాజమందిరపు అధికారి క్రిస్పు తన ఇంటివారందరితో కలిసి ప్రభువును విశ్వసించాడు. కొరింథీయుల్లో చాలామంది విని, విశ్వసిస్తూ బాప్తిస్మం పొందుతూ ఉండేవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత సహజంగా: “కొరింథీయుల్లో చాలామంది విని విశ్వసించారు, బాప్తిస్మం పొందారు.” గ్రీకులోని క్రియారూపాలు ఈ ప్రతిస్పందన కొనసాగుతూ లేదా వరుసగా జరుగుతున్నట్లు చిత్రిస్తాయి.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κρίσπος
  choice: క్రిస్పు
  rationale: వ్యక్తి పేరును తెలుగు బైబిల్ వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: ἀρχισυνάγωγος
  choice: సమాజమందిరపు అధికారి
  rationale: సమాజమందిరంలోని ప్రధాన బాధ్యతగల అధికారిని సూచిస్తుంది; పరిపాలనా వివరాలను అదనంగా ఊహించకుండా సహజమైన తెలుగులో ఇచ్చాం.
- source_word: ἐπίστευσεν τῷ κυρίῳ
  choice: ప్రభువును విశ్వసించాడు
  rationale: πιστεύωతో దత్తి విభక్తి ఇక్కడ విశ్వాసం ఉంచడాన్ని సూచిస్తుంది. తెలుగు సహజ ప్రయోగంలో ‘ప్రభువును విశ్వసించాడు’ అని ఇచ్చి, κύριοςను మూలంలోని విధంగానే ‘ప్రభువు’గా ఉంచాం.
- source_word: σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: తన ఇంటివారందరితో కలిసి
  rationale: οἶκος ఇక్కడ భవనాన్ని కాక కుటుంబం/గృహస్థులను సూచిస్తుంది; ὅλῳ భావాన్ని ‘అందరితో’ నిలిపాం.
- source_word: πολλοὶ τῶν Κορινθίων
  choice: కొరింథీయుల్లో చాలామంది
  rationale: భాగార్థక షష్ఠీ భావాన్ని సహజ తెలుగులో ‘కొరింథీయుల్లో చాలామంది’గా వ్యక్తం చేశాం.
- source_word: ἀκούοντες
  choice: విని
  rationale: వినడం తరువాతి ప్రతిస్పందనతో సమకాలికంగా లేదా దానికి సందర్భంగా ఉందని సహజంగా తెలుపుతుంది; వినిన విషయం మూలంలో మౌనంగా ఉన్నందున చేర్చలేదు.
- source_word: ἐπίστευον
  choice: విశ్వసిస్తూ
  rationale: అసంపూర్ణ భూతకాల రూపం అనేకమందిలో కొనసాగుతూ/వరుసగా జరుగుతున్న ప్రతిస్పందనను చిత్రిస్తుంది.
- source_word: ἐβαπτίζοντο
  choice: బాప్తిస్మం పొందుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న భావాన్నీ, కర్మణి స్వరాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: ‘తన ఇంటివారందరితో కలిసి’ అనే మాటలో ఇంటివారి విశ్వాస పరిధి
  choice: ఇంటివారందరితో కలిసి అని నేరుగా అనువదించి, ప్రతి వ్యక్తి విశ్వాసం ఎలా వ్యక్తమైందో వివరించలేదు.
  alternative: ఇంటిలోని ప్రతి వ్యక్తి వ్యక్తిగతంగా అదే విధంగా విశ్వసించాడని స్పష్టీకరించడం; లేదా ఇంటిని కేవలం సమష్టిగా మాత్రమే వర్ణించడం.
  rationale: గ్రీకు వాక్యం క్రిస్పు తన ఇంటివారందరితో కలిసి విశ్వసించాడని చెబుతుంది; గృహ విశ్వాసం లేదా బాప్తిస్మంపై వర్గపరమైన నిర్ణయాన్ని అది వివరించదు.
- issue: ‘ప్రభువు’ అనే బిరుదు ఎవరిని సూచిస్తుంది
  choice: మూలంలో ఉన్నట్లే ‘ప్రభువు’ అని ఉంచాం.
  alternative: ‘ప్రభువైన యేసు’ అని విస్తరించడం.
  rationale: అపొస్తలుల కార్యముల సందర్భంలో యేసు సూచితుడని అర్థమైనప్పటికీ, ఈ వాక్యంలో గ్రీకు పాఠం κύριος అనే బిరుదునే ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘సమాజమందిరం,’ ‘ప్రభువు,’ ‘బాప్తిస్మం’ వంటి స్థిరమైన బైబిల్ పదజాలాన్ని ఉపయోగించాం; అసంపూర్ణ క్రియల భావాన్ని ప్రధాన పాఠంలో నిలిపి, మరింత సహజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
