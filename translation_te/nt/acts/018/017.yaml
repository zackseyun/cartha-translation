id: ACT.18.17
reference: Acts 18:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπιλαβόμενοι δὲ ⸀πάντες Σωσθένην τὸν ἀρχισυνάγωγον ἔτυπτον ἔμπροσθεν τοῦ βήματος· καὶ οὐδὲν τούτων τῷ Γαλλίωνι ⸀ἔμελεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/017.yaml
  text: Then they all seized Sosthenes[a], the synagogue ruler, and beat him in front of the tribunal. But Gallio paid no attention to these things.
translation:
  language: te
  text: అప్పుడు వారందరూ సమాజమందిరపు అధికారి సోస్తెనేసును[a] పట్టుకొని, న్యాయపీఠం ఎదుట కొడుతూ ఉన్నారు. అయితే గల్లియో ఈ సంగతులేమీ పట్టించుకోలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో కేవలం ‘వారందరూ’ అనే పాఠానికి బదులుగా ‘గ్రీకులందరూ’ అని ఉంది. ప్రాచీనమైన పాఠం సంక్షిప్తంగా ఉండి, ఆ గుంపు ఎవరో నిర్దిష్టంగా చెప్పదు.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιλαβόμενοι
  choice: పట్టుకొని
  rationale: శత్రుత్వంతో ఒకరిని అదుపులోకి తీసుకునే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; వెంటనే జరిగే దాడికి అనుకూలంగా ఉంది.
- source_word: πάντες
  choice: వారందరూ
  rationale: గ్రీకు పదంలోని సమగ్రతను నిలుపుతూ, ఆ గుంపు ఎవరో మూలపాఠం చెప్పనందున వారి గుర్తింపును నిర్దిష్టం చేయదు.
- source_word: ἀρχισυνάγωγον
  choice: సమాజమందిరపు అధికారి
  rationale: సినగోగులో నాయకత్వ బాధ్యతగల అధికారిని ఆధునిక పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἔτυπτον
  choice: కొడుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న లేదా పునరావృత దెబ్బల భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἔμπροσθεν τοῦ βήματος
  choice: న్యాయపీఠం ఎదుట
  rationale: βῆμα సూచించే అధికారిక న్యాయవిచారణ వేదికను సంక్షిప్తంగా, సందర్భోచితంగా తెలియజేస్తుంది.
- source_word: οὐδὲν τούτων ... ἔμελεν
  choice: ఈ సంగతులేమీ పట్టించుకోలేదు
  rationale: ఏదీ గల్లియోకు శ్రద్ధకు లేదా ఆందోళనకు కారణం కాలేదనే గ్రీకు నుడికారాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: δέ
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి సంఘటనకు మార్పును సూచిస్తుంది.
- source_word: καί
  choice: అయితే
  rationale: గుంపు హింసకు గల్లియో నిర్లక్ష్యానికి మధ్య సందర్భంలో ఉన్న వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: πάντες (‘అందరూ’) ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో ‘వారందరూ’ అని ఉంచి గుంపు గుర్తింపును నిర్దిష్టం చేయలేదు.
  alternative: ‘గ్రీకులందరూ’ లేదా ‘యూదులందరూ’
  rationale: SBLGNT పాఠంలో కేవలం πάντες మాత్రమే ఉంది; స్పష్టమైన నామవాచక కర్త లేదు. కాబట్టి మూలపాఠం వదిలిన అస్పష్టతను అనువాదం కూడా నిలుపుతుంది; పాఠాంతరాన్ని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘సమాజమందిరం,’ ‘న్యాయపీఠం’ వంటి పదాలు చారిత్రక-న్యాయ సందర్భాన్ని స్పష్టంగా ఉంచుతాయి; మూలంలోని గుంపు గుర్తింపు అస్పష్టతను జాగ్రత్తగా కాపాడింది.
