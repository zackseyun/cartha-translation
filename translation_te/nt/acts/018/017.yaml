  source_fidelity: మూల గ్రీకు పాఠంలోని అస్పష్టమైన πάντες‌ను ‘వారందరూ’గా సరిగ్గా నిలుపుతుంది. ἐπιλαβόμενοι యొక్క ‘పట్టుకొని,’ ἔτυπτον అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న చర్యను తెలిపే ‘కొడుతూ ఉన్నారు,’ మరియు βῆμα యొక్క న్యాయసందర్భాన్ని తెలిపే ‘న్యాయపీఠం ఎదుట’ అన్నీ సందర్భానుకూలంగా ఉన్నాయి. గల్లియోకు ఈ సంఘటనలు పట్టలేదు అనే οὐδὲν τούτων τῷ Γαλλίωνι ἔμελεν భావం కూడా విశ్వసనీయంగా వ్యక్తమైంది.
