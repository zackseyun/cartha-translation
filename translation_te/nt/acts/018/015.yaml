id: ACT.18.15
reference: Acts 18:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ ⸀ζητήματά ἐστιν περὶ λόγου καὶ ὀνομάτων καὶ νόμου τοῦ καθ’ ὑμᾶς, ὄψεσθε αὐτοί· ⸀κριτὴς ἐγὼ τούτων οὐ βούλομαι εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/015.yaml
  text: But if these are questions about a word and names and your own law[a], you yourselves will see to it; I do not want to be a judge of these things.
translation:
  language: te
  text: కాని ఇవి ఒక మాట, పేర్లు, మీ సొంత ధర్మశాస్త్రం గురించిన ప్రశ్నలైతే, వాటిని మీరే చూసుకోండి; ఈ విషయాలకు న్యాయాధిపతిగా ఉండదలచుకోను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητήματά
  choice: ప్రశ్నలు
  rationale: ఈ పదం విచారణకు లేదా వివాదానికి సంబంధించిన అంశాలను సూచిస్తుంది. ‘ప్రశ్నలు’ న్యాయపరమైన సందర్భానికి సరిపోతూ, వాటిని తప్పనిసరిగా శత్రుత్వపూరిత వివాదాలుగా పరిమితం చేయదు.
- source_word: περὶ λόγου
  choice: ఒక మాటను గురించిన
  rationale: λόγος అనే పదానికి మాట, సందేశం, బోధ వంటి విస్తృత అర్థాలు ఉన్నాయి. ‘ఒక మాట’ మూలానికి దగ్గరగా ఉండి, గల్లియో ఉద్దేశాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా అస్పష్టతను నిలుపుతుంది.
- source_word: ὀνομάτων
  choice: పేర్లు
  rationale: మూలంలోని బహువచనాన్ని నేరుగా ప్రతిబింబిస్తూ, ఇవి వ్యక్తుల పేర్లా, బిరుదులా, లేక ఇతర నామాలా అన్నది తెరిచి ఉంచుతుంది.
- source_word: νόμου τοῦ καθ’ ὑμᾶς
  choice: మీ సొంత ధర్మశాస్త్రం
  rationale: ఇది రోమా పౌర న్యాయానికి కాక యూద పక్షాలకు సంబంధించిన ధర్మశాస్త్రమని గల్లియో చూపిస్తున్న దూరాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὄψεσθε αὐτοί
  choice: వాటిని మీరే చూసుకోండి
  rationale: భవిష్యత్ మధ్యమ రూపం ఇక్కడ ‘మీరే పరిష్కరించుకోండి/చూసుకోండి’ అనే ప్రయోగార్థాన్ని ఇస్తుంది; ‘మీరే’ αὐτοί లోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: κριτὴς
  choice: న్యాయాధిపతి
  rationale: న్యాయస్థాన సందర్భంలో తీర్పు చెప్పే అధికారిని స్పష్టంగా, గౌరవప్రదంగా సూచిస్తుంది.
- source_word: οὐ βούλομαι εἶναι
  choice: ఉండడానికి నాకు ఇష్టం లేదు
  rationale: βούλομαι లోని వ్యక్తిగత సంకల్పం లేదా ఇష్టంలేమిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; దీనిని అతిగా అధికారిక నిరాకరణగా మార్చదు.
theological_decisions:
- issue: గల్లియో మాటల్లో λόγος యొక్క పరిధి
  choice: ‘ఒక మాట’ అని సాధారణంగా అనువదించి, ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
  alternative: ‘ఒక సందేశం,’ ‘ఒక బోధ’
  rationale: ఈ యూద అంతర్గత వివాదంలో λόγος ఖచ్చితంగా దేనిని సూచిస్తుందో వాక్యం చెప్పదు. అందువల్ల నిర్దిష్ట సిద్ధాంతార్థాన్ని చేర్చకుండా మూలంలోని అర్థ విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన న్యాయస్థాన శైలిని ఉపయోగించాం. ‘ధర్మశాస్త్రం’ యూదుల మతనియమాన్ని సూచిస్తుంది; ‘మీ సొంత’ గల్లియో చూపిన అధికార పరిధి దూరాన్ని ప్రతిబింబిస్తుంది.
