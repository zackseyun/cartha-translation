source:
  edition: SBLGNT
  text: λέγοντες ὅτι Παρὰ τὸν νόμον ⸂ἀναπείθει οὗτος⸃ τοὺς ἀνθρώπους σέβεσθαι τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/013.yaml
  text: saying[b][a], “This man is persuading people to worship God contrary to the law.”
translation:
  language: te
  text: 'వారు ఇలా అన్నారు: “ఈ వ్యక్తి చట్టానికి[a] విరుద్ధంగా[b] దేవుణ్ణి ఆరాధించేలా ప్రజలను ఒప్పిస్తున్నాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఆరోపణ చేసినవారు యూదుల ధర్మశాస్త్రాన్ని ఉద్దేశించి ఉండవచ్చు; అయితే గ్రీకు పాఠ్యంలో కేవలం “చట్టం” అని ఉంది.
    reason: cultural_note
  - marker: b
    text: లేదా “చట్టానికి వ్యతిరేకంగా,” “చట్టాన్ని ఉల్లంఘిస్తూ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: 'వారు ఇలా అన్నారు:'
  rationale: వర్తమాన కృదంతం ఆరోపణలోని మాటలను పరిచయం చేస్తోంది. తెలుగులో కర్తను స్పష్టంచేసి ప్రత్యక్ష వాక్యాన్ని సహజంగా ప్రారంభించడానికి ఈ రూపం సరిపోతుంది.
- source_word: Παρὰ τὸν νόμον
  choice: చట్టానికి విరుద్ధంగా
  rationale: παρά + ద్వితీయా విభక్తి ఇక్కడ వ్యతిరేకత లేదా ఉల్లంఘన భావాన్ని ఇస్తుంది. ‘చట్టం’ అనే పదం మూలంలోని సాధారణ νόμοςను నిలుపుతూ న్యాయపరమైన ఆరోపణ ధోరణిని తెలియజేస్తుంది.
- source_word: ἀναπείθει
  choice: ఒప్పిస్తున్నాడు
  rationale: ఇది ప్రభావితం చేసి ఒప్పించడం అనే భావాన్ని ఇస్తుంది. గ్రీకు పదం తప్పనిసరిగా సూచించని ‘తప్పుదారి పట్టిస్తున్నాడు’ అనే ప్రతికూల భావాన్ని చేర్చలేదు; వర్తమాన చర్యను కూడా నిలిపింది.
- source_word: οὗτος
  choice: ఈ వ్యక్తి
  rationale: ఆరోపణలోని చూపుడు భావాన్ని నిలుపుతుంది; అయితే అనవసరమైన అవమానార్థాన్ని చేర్చదు.
- source_word: τοὺς ἀνθρώπους
  choice: ప్రజలను
  rationale: ἄνθρωποι ఇక్కడ పురుషులకు మాత్రమే పరిమితం కాకుండా సాధారణంగా మనుషులను సూచిస్తుంది. ‘ప్రజలు’ ఆధునిక తెలుగులో సహజమైన సమగ్ర పదం.
- source_word: σέβεσθαι τὸν θεόν
  choice: దేవుణ్ణి ఆరాధించమని
  rationale: ఈ సందర్భంలో σέβομαι మతపరమైన భక్తి, ఆరాధనను సూచిస్తుంది. ‘ఆరాధించడం’ స్పష్టమైన, సహజమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: ఆరోపణలో ‘చట్టం’ దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘చట్టం’ అనే సాధారణ పదాన్ని ఉంచడం
  alternative: యూదుల ధర్మశాస్త్రం; మా ధర్మశాస్త్రం
  rationale: ఆరోపణ చేసినవారు యూదుల ధర్మశాస్త్రాన్నే ఉద్దేశించి ఉండవచ్చు. అయినా గ్రీకు పాఠ్యం కేవలం τὸν νόμον (‘చట్టం/ధర్మశాస్త్రం’) అని మాత్రమే చెబుతుంది. అందువల్ల సందర్భ వివరణను పాఠ్యంలో చేర్చకుండా పాదసూచికలో ఇచ్చాం.
- issue: ἀνθρώπους యొక్క సమగ్ర అర్థం
  choice: ప్రజలను
  alternative: పురుషులను
  rationale: ఇక్కడ పుంలింగ బహువచనం పురుషులను మాత్రమే కాక సాధారణంగా మనుషులను సూచిస్తుంది. అందువల్ల ‘ప్రజలను’ మూల ఉద్దేశాన్ని సరిగ్గా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయస్థాన ఆరోపణకు తగిన గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలిని వాడాం. మూలంలోని ‘చట్టం’ అనే అస్పష్టతను ప్రధాన పాఠ్యంలో నిలిపాం.
