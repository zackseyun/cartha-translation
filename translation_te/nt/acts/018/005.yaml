id: ACT.18.5
reference: Acts 18:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὡς δὲ κατῆλθον ἀπὸ τῆς Μακεδονίας ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος, συνείχετο τῷ ⸀λόγῳ ὁ Παῦλος, διαμαρτυρόμενος τοῖς Ἰουδαίοις ⸀εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/005.yaml
  text: But when Silas and Timothy came down from Macedonia[a], Paul was occupied with the word[b], solemnly testifying to the Jews that Jesus is the Messiah.
translation:
  language: te
  text: అయితే సీల, తిమోతి మాసిదోనియా నుండి వచ్చినప్పుడు, పౌలు వాక్య ప్రకటనలో పూర్తిగా నిమగ్నమై[a], యేసే మెస్సీయ[b] అని యూదులకు గంభీరంగా సాక్ష్యమిస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాక్యంచేత బంధించబడి” లేదా “సందేశ ప్రకటనకే తనను అంకితం చేసుకొని.” గ్రీకు క్రియ ఏదో ఒక దానిచేత పట్టుబడడం, ఒత్తిడి చేయబడడం, లేదా దానిలో పూర్తిగా నిమగ్నమవడం అనే భావాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పదం “క్రీస్తు.” ఇక్కడ అది బిరుదుగా వాడబడింది కాబట్టి, దాని మెస్సీయ సంబంధిత భావాన్ని నిలపడానికి “మెస్సీయ” అని అనువదించాం.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς δὲ
  choice: అయితే … వచ్చినప్పుడు
  rationale: δέ సూచించే సంధాన భావాన్ని, ὡς సూచించే కాల భావాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో నిలుపుతుంది.
- source_word: κατῆλθον ἀπὸ τῆς Μακεδονίας
  choice: మాసిదోనియ నుండి వచ్చినప్పుడు
  rationale: κατέρχομαι అక్షరార్థంగా ‘దిగి రావడం’ అయినప్పటికీ, తెలుగులో ఈ ప్రయాణ సందర్భంలో ‘నుండి రావడం’ సహజంగా ఉండి మూలార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: సీల, తిమోతి
  rationale: τε … καί ఇద్దరినీ కలిపి పేర్కొంటుంది; తెలుగు సంయుక్త కర్త నిర్మాణం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: συνείχετο
  choice: పూర్తిగా నిమగ్నుడై
  rationale: ఈ క్రియ ఏదో ఒక దానిచేత పట్టుబడి ఉండడం, దానిలో మునిగి ఉండడం, లేదా దానికి అంకితమై ఉండడం అనే భావ పరిధిని కలిగి ఉంది. సందర్భంలో పౌలు వాక్యంపై సంపూర్ణంగా కేంద్రీకరించిన స్థితిని ఈ పదబంధం సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: τῷ λόγῳ
  choice: వాక్యంలో
  rationale: λόγος ను పారదర్శకంగా ‘వాక్యం’గా నిలుపుతూ, దానిలో నిమగ్నమై ఉన్నాడనే సంభావ్య దత్తి భావాన్ని తెలియజేస్తుంది.
- source_word: διαμαρτυρόμενος
  choice: దృఢంగా సాక్ష్యమిస్తూ
  rationale: διαμαρτύρομαι లోని బలమైన, గంభీరమైన సాక్ష్య భావాన్ని అతిశయోక్తి లేకుండా వ్యక్తం చేస్తుంది.
- source_word: τοῖς Ἰουδαίοις
  choice: యూదులకు
  rationale: ఈ సందర్భంలో Ἰουδαῖοι యూదు ప్రజలను సూచిస్తుంది; ఇది నేరుగా, సహజంగా ఉన్న అనువాదం.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: యేసే మెస్సీయ అని
  rationale: మూలంలోని విధేయ నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, యేసు వాగ్దానం చేయబడిన మెస్సీయ అనే ప్రకటనను స్పష్టం చేస్తుంది.
theological_decisions:
- issue: Χριστός ను బిరుదుగా అనువదించాలా, పేరులో భాగంలా అనువదించాలా
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός ఆర్టికల్‌తో విధేయ స్థానంలో ఉండి, యూదులకు చేసిన ప్రకటనలో బిరుదుగా స్పష్టంగా పనిచేస్తోంది. అందువల్ల దాని మెస్సీయ సంబంధిత భావాన్ని ‘మెస్సీయ’ అని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘వాక్యం,’ ‘సాక్ష్యమిస్తూ,’ ‘మెస్సీయ’ వంటి పరిచిత బైబిలు పదాలను నిలిపి, వాక్య నిర్మాణాన్ని సహజంగా ఉంచాం. మూలంలోని అసంపూర్ణ కాల క్రియ సూచించే కొనసాగుతున్న కార్యాన్ని ‘సాక్ష్యమిస్తూ ఉన్నాడు’ ద్వారా వ్యక్తం చేశాం.
