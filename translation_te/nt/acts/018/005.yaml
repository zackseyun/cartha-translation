- from: అయితే సీల, తిమోతి మాసిదోనియ నుండి వచ్చినప్పుడు, పౌలు వాక్యంలో పూర్తిగా నిమగ్నుడై[a], యేసే మెస్సీయ[b] అని యూదులకు దృఢంగా సాక్ష్యమిస్తూ ఉన్నాడు.
  to: అయితే సీల, తిమోతి మాసిదోనియా నుండి వచ్చినప్పుడు, పౌలు వాక్య ప్రకటనలో పూర్తిగా నిమగ్నమై[a], యేసే మెస్సీయ[b] అని యూదులకు గంభీరంగా సాక్ష్యమిస్తూ ఉన్నాడు.
  rationale: The correction standardizes the Macedonian place name, clarifies that Paul was engaged in proclaiming the word/message rather than merely in a textual ‘word,’ and refines the lexical footnote so that it reflects the semantic range of συνείχετο. It preserves the source’s temporal transition, pair of travelers, continuing action, solemn testimony, and titular use of χριστός.
