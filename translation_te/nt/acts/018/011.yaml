translation_notes:
  register: సామాన్య ఆధునిక పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన ప్రామాణిక తెలుగు వాడబడింది. మూలంలోని కొనసాగింపు భావం, కాలవ్యవధి, సమూహం మధ్య బోధించిన భావం నిలుపబడ్డాయి.
