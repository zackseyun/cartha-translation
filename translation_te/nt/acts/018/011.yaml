id: ACT.18.11
reference: Acts 18:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐκάθισεν ⸀δὲ ἐνιαυτὸν καὶ μῆνας ἓξ διδάσκων ἐν αὐτοῖς τὸν λόγον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/011.yaml
  text: So he stayed there a year and six months, teaching the word of God among them.
translation:
  language: te
  text: అతడు అక్కడ ఒక సంవత్సరం ఆరు నెలలు ఉండి, వారి మధ్య దేవుని వాక్యాన్ని బోధించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθισεν
  choice: అక్కడే ఉండి
  rationale: ఈ సందర్భంలో క్రియకు అక్షరార్థమైన ‘కూర్చున్నాడు’ కంటే, కొంతకాలం ఒక చోట ఉండిపోయాడనే నుడికారార్థం ఉంది. ‘అక్కడే ఉండి’ సహజమైన తెలుగులో ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: δὲ
  choice: అందుచేత
  rationale: δέ స్వల్ప అనుసంధాన పదం. ముందటి వచనాల్లో లభించిన ప్రభువు ప్రోత్సాహానికి పౌలు స్పందించినట్లు కథన ప్రవాహం సూచిస్తున్నందున ‘అందుచేత’ సరిపోతుంది; ఇది వ్యతిరేక భావాన్ని చేర్చదు.
- source_word: ἐνιαυτὸν καὶ μῆνας ἓξ
  choice: ఒక సంవత్సరం ఆరు నెలలు
  rationale: ఇది కాలవ్యవధిని నేరుగా తెలుపుతుంది. ఈ రూపం ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: διδάσκων
  choice: బోధిస్తూ ఉన్నాడు
  rationale: వర్తమాన కృదంతం అతడు అక్కడ ఉన్న కాలమంతటా సాగిన సమకాలిక కార్యాన్ని సూచిస్తుంది. ‘బోధిస్తూ ఉన్నాడు’ ఆ కొనసాగింపు భావాన్ని స్పష్టంగా చూపుతుంది.
- source_word: ἐν αὐτοῖς
  choice: వారి మధ్య
  rationale: ἐν తో కూడిన బహువచన సర్వనామం ఇక్కడ సామాజిక లేదా సమూహ సంబంధమైన స్థానాన్ని సూచిస్తుంది. ‘వారి మధ్య’ సహజమైన తెలుగు వ్యక్తీకరణ.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: దేవుని వాక్యాన్ని
  rationale: అపొస్తలుల కార్యములలో λόγος తరచుగా దేవుని నుండి ప్రకటించబడే సందేశాన్ని సూచిస్తుంది. ‘దేవుని వాక్యం’ స్థిరపడిన బైబిలు ప్రయోగాన్ని, దాని వేదాంతపరమైన ప్రతిధ్వనిని కాపాడుతుంది.
