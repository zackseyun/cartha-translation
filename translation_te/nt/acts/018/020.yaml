  text: ἐρωτώντων δὲ αὐτῶν ἐπὶ πλείονα χρόνον ⸀μεῖναι οὐκ ἐπένευσεν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/020.yaml
  text: But when they asked him to stay for a longer time[a], he did not consent,
translation:
  language: te
  text: అయితే, ఇంకా ఎక్కువకాలం ఉండమని వారు అతన్ని అడిగినప్పుడు, అతడు అంగీకరించలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఒప్పుకోలేదు’; గ్రీకు క్రియ ఒక అభ్యర్థనకు సమ్మతించడం లేదా అంగీకరించడం అనే అర్థం ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτώντων
  choice: అడిగినప్పుడు
  rationale: వర్తమాన కృదంతంతో ఉన్న genitive absolute‌ను సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా అనువదించాం; సందర్భంలో ఇది ఒక అభ్యర్థనను సూచిస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వాక్యంతో ఉన్న స్వల్ప వ్యత్యాసాన్ని, కథనంలోని మలుపును సహజంగా తెలియజేస్తుంది.
- source_word: αὐτῶν
  choice: వారు అతన్ని
  rationale: αὐτῶν ఎఫెసులో అభ్యర్థించిన ప్రజలను సూచిస్తుంది; తెలుగు వాక్యంలో సందర్భానుసారంగా కర్తను, కర్మను స్పష్టంగా వ్యక్తం చేశాం.
- source_word: ἐπὶ πλείονα χρόνον
  choice: ఇంకా ఎక్కువకాలం
  rationale: πλείονα లోని తులనాత్మక భావాన్ని నిలుపుతూ, పొడిగించిన కాలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μεῖναι
  choice: ఉండమని
  rationale: ప్రయాణ సందర్భంలో ‘నిలిచియుండుట’ కంటే ‘ఉండడం’ సహజంగా ఉంది; అభ్యర్థనకు అనుగుణంగా ఉద్ధరణార్థక రూపం వాడాం.
- source_word: οὐκ ἐπένευσεν
  choice: అంగీకరించలేదు
  rationale: ἐπινεύω అనే క్రియ అభ్యర్థనకు సమ్మతి తెలపడం అనే అర్థం ఇస్తుంది; ‘నిరాకరించాడు’ కంటే ఇది మూలంలోని మితమైన భావాన్ని మెరుగ్గా కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘అంగీకరించలేదు’ అనే పదం మూలంలోని మితమైన నిరాకరణ భావాన్ని నిలుపుతుంది; పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
