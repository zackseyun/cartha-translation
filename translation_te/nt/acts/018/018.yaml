  rationale: The revision places ‘కెంక్రేయలో తన తల వెంట్రుకలు కత్తిరించుకొని’ before ‘బయలుదేరాడు,’ preserving the normal antecedent force of the Greek aorist participle while retaining the draft’s cautious rendering of hair cutting. ‘అతనికి ఒక మొక్కుబడి ఉండేది’ directly expresses the explanatory γάρ clause without identifying the vow more specifically than the source does. All footnote anchors and notes are retained and remain correctly matched to the relevant expressions.
