id: ACT.18.18
reference: Acts 18:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁ δὲ Παῦλος ἔτι προσμείνας ἡμέρας ἱκανὰς τοῖς ἀδελφοῖς ἀποταξάμενος ἐξέπλει εἰς τὴν Συρίαν, καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας, κειράμενος ⸂ἐν Κεγχρεαῖς τὴν κεφαλήν⸃, εἶχεν γὰρ εὐχήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/018.yaml
  text: After Paul had remained many more days[a], he said farewell to the brothers and sailed away for Syria, and with him were Priscilla and Aquila. In Cenchreae he had his head shaved[e][d][c][b], for he had a vow.
translation:
  language: te
  text: పౌలు ఇంకా చాలారోజులు ఉండి, సహోదరులకు[a] వీడ్కోలు చెప్పి, కెంక్రేయలో తన తల వెంట్రుకలు కత్తిరించుకొని[b][c][d] సిరియాకు ఓడలో బయలుదేరాడు; ప్రిస్కిల్ల, అకుల కూడా అతనితోపాటు వెళ్లారు. అతనికి ఒక మొక్కుబడి ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘సహోదరులు’ అనే పదం క్రీస్తును విశ్వసించిన సమాజాన్ని సూచిస్తుంది; అందులో స్త్రీలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తల గొరిగించుకున్నాడు.’ గ్రీకు క్రియ వెంట్రుకలు కత్తిరించడాన్ని లేదా గొరగడాన్ని సూచించగలదు; పూర్తిగా గుండు చేయించుకోవడమే అని తప్పనిసరిగా చెప్పదు.
    reason: lexical_alternative
  - marker: c
    text: కొంతమంది ఈ చర్యను అకులకు అన్వయిస్తారు. అయితే గ్రీకు వ్యాకరణం అత్యంత సహజంగా దీనిని పౌలుకు అన్వయిస్తుంది.
    reason: alternative_reading
  - marker: d
    text: మూలపాఠం ‘ఒక మొక్కుబడి’ అని మాత్రమే చెబుతుంది. దాన్ని నాజీరు వ్రతంతో చాలామంది అనుసంధానించినా, ఈ వచనం అలా స్పష్టంగా పేర్కొనదు.
    reason: cultural_note
lexical_decisions:
- source_word: ἔτι προσμείνας ἡμέρας ἱκανὰς
  choice: ఇంకా చాలారోజులు ఉండి
  rationale: ἔτι యొక్క ‘ఇంకా’ భావాన్ని, ἡμέρας ἱκανὰς యొక్క గణనీయమైన కాలవ్యవధిని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది. మూలంలో లేని స్థలసూచకమైన ‘అక్కడ’ను చేర్చలేదు.
- source_word: τοῖς ἀδελφοῖς ἀποταξάμενος
  choice: సహోదరులకు వీడ్కోలు చెప్పి
  rationale: ἀποτάσσομαι ఇక్కడ వీడ్కోలు చెప్పి సెలవు తీసుకోవడాన్ని సూచిస్తుంది. ‘సహోదరులు’ అనే కుటుంబసంబంధ పదాన్ని నిలిపి, దాని సమూహార్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: ἐξέπλει εἰς τὴν Συρίαν
  choice: సిరియాకు ఓడలో బయలుదేరాడు
  rationale: ἐκπλέω యొక్క ఓడలో ప్రయాణం ఆరంభించి వెళ్లిపోవడం అనే భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας
  choice: ప్రిస్కిల్ల, అకుల కూడా అతనితోపాటు వెళ్లారు
  rationale: వారు పౌలుతో ఉన్న ప్రయాణ సహచరులని స్పష్టం చేస్తూ, గ్రీకు వాక్యంలోని అనుబంధ సమాచారాన్ని తెలుగులో సహజమైన స్వతంత్ర వాక్యంగా అందిస్తుంది.
- source_word: κειράμενος ... τὴν κεφαλήν
  choice: తన తల వెంట్రుకలు కత్తిరించుకున్నాడు
  rationale: κείρω అంటే వెంట్రుకలను కత్తిరించడం లేదా గొరగడం; పూర్తిగా గుండు చేయించుకున్నాడని తప్పనిసరిగా నిర్ధారించదు. అందువల్ల విస్తృత భావమున్న ‘కత్తిరించుకున్నాడు’ను ప్రధాన పాఠంలో వాడాం.
- source_word: ἐν Κεγχρεαῖς
  choice: కెంక్రేయలో
  rationale: స్థలనామాన్ని తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో ఇచ్చి, ἐν యొక్క స్థానార్థాన్ని ‘లో’తో తెలిపాం.
- source_word: εἶχεν γὰρ εὐχήν
  choice: అతనికి ఒక మొక్కుబడి ఉండడం వల్ల
  rationale: εὐχή ఇక్కడ దేవునికి చేసిన ప్రమాణం లేదా మొక్కుబడిని సూచిస్తుంది. గ్రీకు వచనం చెప్పని ప్రత్యేక వ్రత రకాన్ని చేర్చకుండా సాధారణ పదాన్ని ఎంచుకున్నాం.
theological_decisions:
- issue: κειράμενος అనే పురుష ఏకవచన అసమాపక క్రియకు కర్త ఎవరు?
  choice: ప్రధాన పాఠంలో పౌలునే కర్తగా చూపించడం
  alternative: అకుల తన తల వెంట్రుకలు కత్తిరించుకున్నాడనే వ్యాఖ్యానం
  rationale: వాక్యానికి ప్రధాన కర్త పౌలు; κειράμενος అనే పురుష ఏకవచన రూపం అత్యంత సహజంగా అతనికే అన్వయిస్తుంది. అకుల పేరు దగ్గరగా ఉండటంతో వచ్చిన ప్రత్యామ్నాయ వ్యాఖ్యానాన్ని పాదసూచికలో నిలిపాం.
- issue: εὐχή యొక్క స్వభావం
  choice: సాధారణంగా ‘ఒక మొక్కుబడి’
  alternative: నాజీరు వ్రతం
  rationale: వచనం ఏ ప్రత్యేక వ్రతాన్ని పేర్కొనదు. కాబట్టి నాజీరు వ్రతమని ప్రధాన పాఠంలో నిర్ధారించకుండా వ్యాఖ్యాన పరిమితిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని అనుసరించాం. గ్రీకు వాక్యంలోని పొడవైన నిర్మాణాన్ని చదవడానికి సులభంగా మూడు వాక్యాలుగా విభజించాం; అయినా చర్యల క్రమాన్ని, పౌలు ప్రధాన కర్తగా ఉండటాన్ని నిలిపాం.
