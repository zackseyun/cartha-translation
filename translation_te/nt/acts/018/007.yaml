id: ACT.18.7
reference: Acts 18:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ μεταβὰς ἐκεῖθεν ⸀εἰσῆλθεν εἰς οἰκίαν τινὸς ὀνόματι ⸀Τιτίου Ἰούστου σεβομένου τὸν θεόν, οὗ ἡ οἰκία ἦν συνομοροῦσα τῇ συναγωγῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/007.yaml
  text: And after leaving there[a], he entered the house of a man named Titius Justus, who worshiped God[b], whose house was next to the synagogue.
translation:
  language: te
  text: అతడు అక్కడి నుంచి వెళ్లి, దేవుణ్ణి ఆరాధించే[a] తీతియు యూస్తు అనే వ్యక్తి ఇంట్లోకి ప్రవేశించాడు. అతని ఇల్లు సమాజమందిరాన్ని ఆనుకొని ఉండేది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవునికి భయపడే’ లేదా ‘దేవుణ్ణి ఆరాధించే వ్యక్తి.’ గ్రీకు పదబంధం ఇశ్రాయేలు దేవునిపట్ల భక్తి కలిగిన అన్యజనుని వర్ణిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘సమాజమందిరం పక్కనే ఉండేది’ లేదా ‘సమాజమందిరంతో సరిహద్దు పంచుకునేది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: అక్కడి నుంచి వెళ్లి
  rationale: స్థలాన్ని విడిచి వెళ్లడాన్ని తెలిపే భూతకాల క్రియావిశేషణ రూపాన్నీ, ἐκεῖθεν లోని ‘అక్కడి నుంచి’ అనే భావాన్నీ సహజమైన తెలుగు క్రమంలో వ్యక్తపరుస్తుంది.
- source_word: εἰσῆλθεν εἰς οἰκίαν τινὸς
  choice: ఒక వ్యక్తి ఇంట్లోకి ప్రవేశించాడు
  rationale: εἰσῆλθεν యొక్క ప్రవేశ భావాన్ని స్పష్టంగా ఉంచుతూ, τινὸς అనే అనిర్దిష్ట సూచనను ‘ఒక వ్యక్తి’గా సహజంగా అందిస్తుంది.
- source_word: ὀνόματι Τιτίου Ἰούστου
  choice: తీతియు యూస్తు అనే
  rationale: గ్రీకు వ్యక్తినామాలను తెలుగు లిపిలో ధ్వన్యనుసారంగా ఇచ్చి, ὀνόματι నిర్మాణాన్ని సహజమైన ‘అనే’ రూపంలో వ్యక్తపరుస్తుంది.
- source_word: σεβομένου τὸν θεόν
  choice: దేవుణ్ణి ఆరాధించే
  rationale: σέβομαι ఇక్కడ ఇశ్రాయేలు దేవునిపట్ల భక్తి, ఆరాధన కలిగిన అన్యజనుని వర్ణిస్తుంది. సాంకేతిక వర్గపేరును చేర్చకుండా వివరణాత్మక భావాన్ని నిలుపుతుంది.
- source_word: οὗ ἡ οἰκία
  choice: అతని ఇల్లు
  rationale: గ్రీకు సంబంధసర్వనామాన్ని తెలుగులో స్పష్టమైన సర్వనామంతో రెండవ వాక్యంగా మార్చడం సహజ పఠనాన్ని ఇస్తుంది; యజమాన్య సంబంధం యథాతథంగా ఉంటుంది.
- source_word: συνομοροῦσα τῇ συναγωγῇ
  choice: సమాజమందిరాన్ని ఆనుకొని ఉండేది
  rationale: συνομορέω తెలిపే పక్కనే ఉండడం లేదా సరిహద్దు పంచుకోవడం అనే స్థలసంబంధాన్ని dignified modern Teluguలో ‘ఆనుకొని’ అని సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: తీతియు యూస్తును σεβόμενος τὸν θεόν అని వర్ణించడం
  choice: దేవుణ్ణి ఆరాధించే
  alternative: దేవునికి భయపడే; దేవభక్తుడు
  rationale: ఈ గ్రీకు పదబంధం ఇశ్రాయేలు దేవునిపట్ల అతని భక్తిని సూచిస్తుంది; అయితే అతన్ని నిర్దిష్ట సామాజిక-మత వర్గానికి చెందినవాడిగా ప్రధాన పాఠ్యంలో ఖరారు చేయదు. అందువల్ల వివరణాత్మక అనువాదాన్ని ఎంచుకుని ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. పొడవైన గ్రీకు సంబంధవాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి స్పష్టత పెంచాం; భావసంబంధాలన్నీ నిలుపుకున్నాం. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల వెంట ఉంచాం.
