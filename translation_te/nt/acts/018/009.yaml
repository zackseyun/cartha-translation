  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος ⸂ἐν νυκτὶ δι’ ὁράματος⸃ τῷ Παύλῳ· Μὴ φοβοῦ, ἀλλὰ λάλει καὶ μὴ σιωπήσῃς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/009.yaml
  text: And the Lord said to Paul in the night through a vision[a], “Do not be afraid, but keep speaking and do not be silent,”
translation:
  language: te
  text: 'రాత్రివేళ ప్రభువు దర్శనం ద్వారా[a] పౌలుతో ఇలా అన్నాడు: “భయపడకు; మాట్లాడుతూనే ఉండు, మౌనంగా ఉండకు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దర్శనంలో.” గ్రీకు పదబంధం అక్షరార్థంగా “దర్శనం ద్వారా” అని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: ప్రభువు
  rationale: ఇది గౌరవపూర్వకమైన బిరుదును నిలుపుతుంది. అపొస్తలుల కార్యముల సందర్భంలో ఇది సహజంగా పునరుత్థానుడైన యేసును సూచించినప్పటికీ, మూలపాఠంలో లేని ‘యేసు’ అనే పేరును అనువాదంలో చేర్చలేదు.
- source_word: ἐν νυκτὶ
  choice: రాత్రివేళ
  rationale: కాలాన్ని సూచించే గ్రీకు పదబంధాన్ని ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: δι’ ὁράματος
  choice: దర్శనం ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సాధనం లేదా మాధ్యమాన్ని సూచిస్తుంది. అందువల్ల ‘ద్వారా’ మూల నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది; ‘దర్శనంలో’ అనే అర్థసంభావ్యతను పాదసూచికలో ఇచ్చాం.
- source_word: Μὴ φοβοῦ
  choice: భయపడకు
  rationale: నిషేధ ఆజ్ఞను సాధారణ ఆధునిక తెలుగులో నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἀλλὰ λάλει
  choice: మాట్లాడుతూనే ఉండు
  rationale: వర్తమాన ఆజ్ఞారూపంలోని కొనసాగింపు భావాన్ని ‘తూనే ఉండు’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: καὶ μὴ σιωπήσῃς
  choice: మౌనంగా ఉండకు
  rationale: మాట్లాడడం ఆపకూడదనే జత నిషేధాన్ని స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ‘ప్రభువు’ అనే బిరుదు ఎవరిని సూచిస్తుంది?
  choice: ప్రభువు
  alternative: ప్రభువైన యేసు
  rationale: గ్రీకు మూలపాఠం ὁ κύριος అని మాత్రమే చెబుతుంది. సందర్భంలో ఇది యేసును సూచించే అవకాశం బలంగా ఉన్నా, పాఠంలో లేని పేరును చేర్చి ఆ సూచనను అనువాదమే పూర్తిగా నిర్ధారించకుండా బిరుదును యథాతథంగా నిలిపాం.
translation_notes:
  register: సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. ‘ప్రభువు,’ ‘దర్శనం’ వంటి బైబిలు సందర్భానికి తగిన గౌరవపూర్వక పదాలను ఉంచుతూ, వాక్య నిర్మాణాన్ని సహజంగా తీర్చిదిద్దాం.
