  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ప్రధాన వాక్యంలో గ్రీకు కృదంతాన్ని సహజమైన వరుస క్రియలుగా మార్చి, అక్షరార్థ రూపాన్ని పాదసూచికలో నిలిపాం.
