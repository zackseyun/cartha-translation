id: ACT.18.22
reference: Acts 18:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ κατελθὼν εἰς Καισάρειαν, ἀναβὰς καὶ ἀσπασάμενος τὴν ἐκκλησίαν, κατέβη εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/022.yaml
  text: And after going down to Caesarea[a], he went up and greeted the church, then went down to Antioch.
translation:
  language: te
  text: అతడు కైసరయకు దిగివచ్చి, పైకి వెళ్లి[a] సంఘాన్ని పలకరించి, అంతియొకయకు దిగివెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ఉద్దేశించబడింది బహుశా యెరూషలేములోని సంఘమే. అనేక అనువాదాలు ‘యెరూషలేము’ అని స్పష్టంగా చేర్చుతాయి; అయితే గ్రీకు మూలపాఠంలో ఆ పేరు లేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: κατελθὼν
  choice: దిగివచ్చి
  rationale: ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచించే భూతకాల అసమాపక క్రియారూపం; లూకా వాడిన దిశా/భౌగోళిక భాషను నిలుపుతుంది.
- source_word: Καισάρειαν
  choice: కైసరయకు
  rationale: ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణమైన స్థలనామ రూపం; సందర్భంలో సముద్రతీర కైసరయ ఉద్దేశించబడింది.
- source_word: ἀναβὰς
  choice: పైకి వెళ్లి
  rationale: గ్రీకు పదంలోని దిశా భావాన్ని నిలుపుతూ, మూలపాఠంలో లేని ‘యెరూషలేముకు’ అనే గమ్యాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: ἀσπασάμενος
  choice: పలకరించిన తరువాత
  rationale: సంఘాన్ని అభివాదం చేయడం లేదా పలకరించడం అనే సాధారణ అర్థాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; కేవలం ‘సందర్శించాడు’ అని విస్తరించదు.
- source_word: τὴν ἐκκλησίαν
  choice: సంఘాన్ని
  rationale: అపొస్తలుల కార్యములలో క్రైస్తవ సమాజాన్ని సూచించే ἐκκλησίαకు సహజమైన, స్థిరపడిన తెలుగు పదం.
- source_word: κατέβη
  choice: దిగివెళ్లాడు
  rationale: గ్రీకు మూలంలోని దిశా/భౌగోళిక భావాన్ని నిలుపుతుంది; ముందు వచ్చిన ‘పైకి వెళ్లి’తో ఉన్న వ్యత్యాసాన్ని కూడా స్పష్టంగా చూపుతుంది.
- source_word: Ἀντιόχειαν
  choice: అంతియొకయకు
  rationale: తెలుగు బైబిలు సంప్రదాయంలో స్థిరపడిన స్థలనామ రూపం; సందర్భం సిరియా అంతియొకయను స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ‘పైకి వెళ్లి’ అన్నప్పుడు సూచిత గమ్యం యెరూషలేమేనా?
  choice: ప్రధాన పాఠ్యంలో గమ్యాన్ని చెప్పకుండా ఉంచడం
  alternative: ‘యెరూషలేముకు పైకి వెళ్లి’ అని స్పష్టంగా అనువదించడం
  rationale: కైసరయ నుంచి పైకి వెళ్లడం, ‘సంఘాన్ని’ పలకరించడం, ఆపై అంతియొకయకు దిగివెళ్లడం అనే క్రమం యెరూషలేమును బలంగా సూచిస్తుంది. అయినప్పటికీ గ్రీకు మూలపాఠం యెరూషలేము పేరును చెప్పదు; కాబట్టి సూచనను పాఠ్యంలోనే పరిష్కరించకుండా పాదటిప్పణిలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘దిగివచ్చి—పైకి వెళ్లి—దిగివెళ్లాడు’ అనే దిశా క్రమాన్ని నిలుపుతూ, ‘అక్కడి నుంచి’ అనే స్వల్ప అనుసంధానంతో తెలుగు వాక్య ప్రవాహాన్ని స్పష్టం చేసింది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో ఉంది.
