id: ACT.18.27
reference: Acts 18:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: βουλομένου δὲ αὐτοῦ διελθεῖν εἰς τὴν Ἀχαΐαν προτρεψάμενοι οἱ ἀδελφοὶ ἔγραψαν τοῖς μαθηταῖς ἀποδέξασθαι αὐτόν· ὃς παραγενόμενος συνεβάλετο πολὺ τοῖς πεπιστευκόσιν διὰ τῆς χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/027.yaml
  text: And when he wanted to go across to Achaia[a], the brothers encouraged him and wrote to the disciples to welcome him. When he arrived[b], he greatly helped those who had believed through grace.
translation:
  language: te
  text: అతడు అకయకు వెళ్లాలని కోరుకున్నప్పుడు, సోదరులు[b] అతన్ని ప్రోత్సహించి, అతనికి స్వాగతం పలకాలని శిష్యులకు ఉత్తరం రాశారు. అతడు అక్కడికి చేరుకున్నాక, కృప ద్వారా[a] విశ్వసించినవారికి ఎంతో సహాయం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విశ్వసించినవారికి అతడు కృప ద్వారా ఎంతో సహాయం చేశాడు.” గ్రీకులో “కృప ద్వారా” అనే మాటలను వారి విశ్వాసంతో కాకుండా అపొల్లో చేసిన సహాయంతో అనుసంధానించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: గ్రీకులో ఇక్కడ పుంలింగ రూపం ఉంది. అయితే “సోదరులు” అనే మాట స్త్రీలతో సహా విస్తృత విశ్వాసుల సమాజాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλομένου ... αὐτοῦ
  choice: అతడు ... కోరుకున్నప్పుడు
  rationale: అపొల్లో ఉద్దేశాన్ని తెలిపే genitive absolute నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో కాలసూచక ఉపవాక్యంగా వ్యక్తం చేస్తుంది; స్వచ్ఛంద కోరిక భావాన్ని నిలుపుతుంది.
- source_word: διελθεῖν εἰς τὴν Ἀχαΐαν
  choice: అకయకు వెళ్లాలని
  rationale: అకయ ప్రాంతానికి ప్రయాణించాలనే భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది. గ్రీకు క్రియలోని దాటి వెళ్లే ప్రయాణ ఛాయ తెలుగులో బలవంతంగా చేరిస్తే వాక్యం అసహజమవుతుంది.
- source_word: προτρεψάμενοι
  choice: అతన్ని ప్రోత్సహించి
  rationale: సందర్భంలో అపొల్లో ప్రయాణానికి తోడ్పడే ప్రోత్సాహాన్ని సూచిస్తుంది; ‘బలవంతపెట్టి’ అనే అతిశయ భావం రాకుండా సానుకూల ప్రేరణను తెలియజేస్తుంది.
- source_word: οἱ ἀδελφοὶ
  choice: సోదరులు
  rationale: గ్రీకులోని పుంలింగ బహువచన రూపాన్ని నిలుపుతుంది. తొలి క్రైస్తవ వాడుకలో ఇది విస్తృత విశ్వాసుల సమాజాన్ని సూచించగలదని పాదసూచిక తెలియజేస్తుంది.
- source_word: ἔγραψαν τοῖς μαθηταῖς
  choice: శిష్యులకు ఉత్తరం రాశారు
  rationale: దత్తివుతో వచ్చిన γράφω భావాన్ని సహజ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; μαθηταίకు ప్రామాణికమైన ‘శిష్యులు’ పదాన్ని నిలుపుతుంది.
- source_word: ἀποδέξασθαι αὐτόν
  choice: అతనికి స్వాగతం పలకాలని
  rationale: అపొల్లోను అనుకూలంగా, ఆతిథ్యంతో చేర్చుకోవాలనే సందర్భోచిత భావాన్ని సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ὃς παραγενόμενος
  choice: అతడు అక్కడికి చేరుకున్నాక
  rationale: సంబంధసర్వనామం మరియు కృదంతం కలిపి తెలిపే తదుపరి కాలక్రమ చర్యను సులభమైన తెలుగు వాక్యంగా మలుస్తుంది; ‘అక్కడికి’ అనేది అకయను సూచిస్తుంది.
- source_word: συνεβάλετο πολὺ
  choice: ఎంతో సహాయం చేశాడు
  rationale: మధ్యమ ప్రయోగంలో ఉన్న గణనీయమైన తోడ్పాటు భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τοῖς πεπιστευκόσιν
  choice: విశ్వసించినవారికి
  rationale: విశ్వాసంలోకి వచ్చినవారిని సూచించే perfect participle భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; తెలుగు సందర్భంలో ముందే జరిగిన చర్య స్పష్టంగా ఉంటుంది.
- source_word: διὰ τῆς χάριτος
  choice: కృప ద్వారా
  rationale: గ్రీకు విభక్తి నిర్మాణంలోని సాధన భావాన్ని అదనంగా ‘దేవుని’ అని చేర్చకుండా పదబద్ధంగా నిలుపుతుంది.
theological_decisions:
- issue: διὰ τῆς χάριτος అనే పదబంధం దేనితో అనుసంధానమవుతుంది?
  choice: ‘కృప ద్వారా విశ్వసించినవారు’—ఈ పదబంధం వారి విశ్వాసంతో అనుసంధానమయ్యేలా ప్రధాన పాఠంలో ఉంచబడింది.
  alternative: ‘కృప ద్వారా అతడు విశ్వసించినవారికి ఎంతో సహాయం చేశాడు’—ఇది అపొల్లో చేసిన సహాయం కృప ద్వారా జరిగిందని అర్థం చేసుకుంటుంది.
  rationale: పదక్రమం మరియు సందర్భం ప్రకారం కృపను వారి విశ్వాసంతో అనుసంధానించడం సహజమైన పఠనం. అయితే గ్రీకు వాక్యనిర్మాణం అపొల్లో సహాయంతో అనుసంధానించే అవకాశాన్ని పూర్తిగా తొలగించదు; అందువల్ల ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘అకయ’, ‘శిష్యులు’, ‘కృప’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని సాధారణ పాఠకులకు అర్థమయ్యే శైలితో సమతుల్యం చేశాం. మూలంలోని లింగరూపం మరియు ‘కృప ద్వారా’ అనే పదబంధపు నిజమైన అనిశ్చితి పాదసూచికల్లో నిలుపబడ్డాయి.
