source:
  edition: SBLGNT
  text: καὶ ποιήσας χρόνον τινὰ ἐξῆλθεν, διερχόμενος καθεξῆς τὴν Γαλατικὴν χώραν καὶ Φρυγίαν, ⸀στηρίζων πάντας τοὺς μαθητάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/023.yaml
  text: And after spending some time there[a], he departed and traveled from place to place through the Galatian region and Phrygia, strengthening all the disciples.
translation:
  language: te
  text: అక్కడ కొంతకాలం గడిపిన తరువాత అతడు బయలుదేరి, గలతీయ ప్రాంతం, ఫ్రుగియా గుండా వరుసగా ప్రయాణిస్తూ, శిష్యులందరినీ బలపరుస్తూ వెళ్లాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσας χρόνον τινά
  choice: అక్కడ కొంతకాలం గడిపిన తరువాత
  rationale: ποιέω + χρόνον అనే నుడికారం ‘కొంతకాలం గడపడం’ అనే అర్థమిస్తుంది. ‘అక్కడ’ అనేది గ్రీకు పాఠంలో ప్రత్యక్షంగా లేకపోయినా, ముందుగా ప్రస్తావించిన స్థలాన్ని సూచించే సందర్భార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐξῆλθεν
  choice: అతడు బయలుదేరి
  rationale: ప్రయాణ వర్ణనలో ఈ క్రియ ఒక స్థలం నుంచి బయలుదేరడాన్ని సూచిస్తుంది; ‘బయలుదేరి’ అనేది సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: διερχόμενος
  choice: ప్రయాణిస్తూ
  rationale: ప్రాంతాల గుండా కొనసాగిన సంచారాన్ని ఈ వర్తమాన కృదంతం తెలియజేస్తుంది. ‘ప్రయాణిస్తూ’ ఆ కొనసాగుతున్న చర్యను సహజంగా నిలుపుతుంది.
- source_word: καθεξῆς
  choice: వరుసగా
  rationale: ఈ పదం క్రమానుసారంగా లేదా ఒకదాని తరువాత మరొకటిగా సాగడాన్ని సూచిస్తుంది. ‘వరుసగా’ సంక్షిప్తంగా ఆ భావాన్ని ఇస్తుంది; దాని సాధ్యమైన విస్తృత భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: τὴν Γαλατικὴν χώραν
  choice: గలతీయ ప్రాంతం
  rationale: χώρα విస్తృతమైన ప్రాంతం లేదా భూభాగాన్ని సూచిస్తుంది. ఇది సాంకేతికంగా రోమా పరిపాలనా ప్రావిన్సును మాత్రమే నిర్దేశించకుండా గ్రీకు పదంలోని విస్తృతతను కాపాడుతుంది.
- source_word: καὶ Φρυγίαν
  choice: ఫ్రుగియా
  rationale: స్థలనామాన్ని తెలుగులో లిప్యంతరీకరించాం. ముందున్న ‘ప్రాంతం’ అనే భావం సందర్భంలో దీనికీ వర్తిస్తుంది; తెలుగులో అనవసర పునరుక్తిని నివారించాం.
- source_word: στηρίζων
  choice: బలపరిచాడు
  rationale: στηρίζω అంటే బలపరచడం, స్థిరపరచడం అనే భావాలు ఉన్నాయి. శిష్యుల పరిచర్య సందర్భంలో ‘బలపరిచాడు’ భావాన్ని అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
- source_word: πάντας τοὺς μαθητάς
  choice: శిష్యులందరినీ
  rationale: μαθηταί యేసు అనుచరులకు అపొస్తలుల కార్యములలో స్థిరంగా వాడే పదం; πάντας లోని సమగ్రతను ‘అందరినీ’ స్పష్టంగా నిలుపుతుంది.
