translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని అనుసరించాం. గ్రీకు వాక్యంలోని ప్రధాన ప్రయాణక్రియతో పాటు కొనసాగుతున్న ప్రయాణం, శిష్యులను బలపరచడం అనే కృదంత భావాలను తెలుగులో సహజమైన క్రియా నిర్మాణంతో వ్యక్తం చేశాం.
