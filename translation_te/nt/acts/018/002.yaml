id: ACT.18.2
reference: Acts 18:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εὑρών τινα Ἰουδαῖον ὀνόματι Ἀκύλαν, Ποντικὸν τῷ γένει, προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ διὰ τὸ ⸀διατεταχέναι Κλαύδιον χωρίζεσθαι πάντας τοὺς Ἰουδαίους ⸀ἀπὸ τῆς Ῥώμης, προσῆλθεν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/002.yaml
  text: And he found a Jew named Aquila[a], a native of Pontus, who had recently come from Italy with Priscilla his wife because Claudius had ordered all the Jews to leave Rome; and he went to them.
translation:
  language: te
  text: పౌలు పొంతు దేశస్థుడైన అకుల అనే ఒక యూదుణ్ణి కనుగొన్నాడు. యూదులందరూ రోము నుండి వెళ్లిపోవాలని[a] క్లౌదియుస్ ఆజ్ఞాపించినందువల్ల, అకుల తన భార్య ప్రిస్కిల్లతో కలిసి ఇటీవలే ఇటలీ నుండి వచ్చాడు. పౌలు వారి దగ్గరకు వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదులందరినీ రోము నుండి బహిష్కరించాలని.” గ్రీకు పదబంధం అక్షరార్థంగా రోము నుండి వేరై వెళ్లడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρών
  choice: కనుగొన్నాడు
  rationale: ఇది పౌలు అకులను కనుగొని, ఆ తరువాత వారి దగ్గరకు వెళ్లిన కథన క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τινα Ἰουδαῖον
  choice: ఒక యూదుణ్ణి
  rationale: τινα సూచించే అనిర్దిష్ట వ్యక్తిని, Ἰουδαῖον సూచించే జాతి-మత గుర్తింపును నేరుగా వ్యక్తపరుస్తుంది.
- source_word: ὀνόματι Ἀκύλαν
  choice: అకుల అనే
  rationale: ఒక వ్యక్తి పేరును పరిచయం చేయడానికి ఆధునిక తెలుగులో సహజమైన ప్రయోగం.
- source_word: Ποντικὸν τῷ γένει
  choice: పొంతు ప్రాంతానికి చెందిన
  rationale: అకుల జన్మస్థలం లేదా భౌగోళిక మూలాన్ని సహజంగా తెలియజేస్తుంది; ‘జన్మతః పొంతీయుడు’ కంటే సాధారణ పాఠకులకు స్పష్టం.
- source_word: προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας
  choice: ఇటీవలే ఇటలీ నుండి వచ్చాడు
  rationale: ప్రధాన కథన చర్యకు ముందు జరిగిన ఇటీవలి రాకను, దాని ప్రస్తుత సందర్భ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ
  choice: తన భార్య ప్రిస్కిల్లతో కలిసి
  rationale: ప్రిస్కిల్ల అకుల భార్య అని, ఆమె అతనితో పాటు ఇటలీ నుండి వచ్చిందని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: διὰ τὸ διατεταχέναι Κλαύδιον
  choice: క్లౌదియ ఆజ్ఞాపించినందువల్ల
  rationale: διά తో కూడిన articular infinitive తెలిపే కారణాన్ని, చక్రవర్తి ఇచ్చిన అధికారిక ఆజ్ఞ భావాన్ని కాపాడుతుంది.
- source_word: χωρίζεσθαι πάντας τοὺς Ἰουδαίους ἀπὸ τῆς Ῥώμης
  choice: యూదులందరూ రోము నుండి వెళ్లిపోవాలని
  rationale: χωρίζεσθαι యొక్క ‘వేరై వెళ్లడం’ అనే భావాన్ని సహజంగా అందిస్తుంది; ‘బహిష్కరించబడాలని’ అనడం గ్రీకు పదబంధం కన్నా బలమైన వ్యాఖ్యానం కావచ్చు.
- source_word: προσῆλθεν αὐτοῖς
  choice: పౌలు వారి దగ్గరకు వెళ్లాడు
  rationale: వారి వద్దకు చేరడం లేదా సమీపించడం అనే భావాన్ని సహజ తెలుగులో ఇస్తుంది. తెలుగు వాక్య విభజన వల్ల కర్త సందిగ్ధం కాకుండా సందర్భంలో స్పష్టమైన ‘పౌలు’ పేరును ఉపయోగించింది.
theological_decisions:
- issue: Ἰουδαῖον / Ἰουδαίους పదాల అర్థం
  choice: యూదుడు / యూదులు
  alternative: యూదయవాడు / యూదయవారు
  rationale: ఇక్కడ క్లౌదియ ఆజ్ఞ రోములో నివసించే యూద ప్రజలకు సంబంధించినది; కేవలం యూదయ ప్రాంత నివాసులను సూచించడం లేదు. అందువల్ల జాతి-మత గుర్తింపును తెలిపే ‘యూదుడు/యూదులు’ సరైనది.
- issue: χωρίζεσθαι యొక్క బలప్రయోగ భావం
  choice: రోము నుండి వెళ్లిపోవాలని
  alternative: రోము నుండి బహిష్కరించబడాలని
  rationale: మూలపదం నేరుగా ‘వేరు కావడం/విడిచి వెళ్లడం’ అని చెబుతుంది. ఆజ్ఞ కారణంగా బలవంతపు నిష్క్రమణ సూచితమైనప్పటికీ, ప్రధాన పాఠ్యంలో ‘బహిష్కరించబడడం’ అని మరింత నిర్దిష్టంగా తీర్మానించకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. గ్రీకు మూలంలోని ఒకే దీర్ఘ వాక్యాన్ని తెలుగులో స్పష్టత కోసం మూడు వాక్యాలుగా విభజించాం; అకుల ఇటలీ నుండి వచ్చిన కారణసంబంధాన్ని అలాగే నిలిపాం. ‘పొంతు,’ ‘అకుల,’ ‘ప్రిస్కిల్ల,’ ‘క్లౌదియ,’ ‘రోము’ రూపాలు తెలుగు బైబిలు నామాల గౌరవప్రద శైలికి అనుగుణంగా ఉన్నాయి.
