id: ACT.18.4
reference: Acts 18:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διελέγετο δὲ ἐν τῇ συναγωγῇ κατὰ πᾶν σάββατον, ἔπειθέν τε Ἰουδαίους καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/004.yaml
  text: And he was reasoning in the synagogue every Sabbath and persuading Jews and Greeks[a][b][c].
translation:
  language: te
  text: అతడు ప్రతి విశ్రాంతి దినాన సమాజమందిరంలో తర్కించేవాడు[a], యూదులనూ గ్రీకులనూ ఒప్పించేవాడు[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చర్చించేవాడు’ లేదా ‘వాదించేవాడు.’ గ్రీకు క్రియ తర్కబద్ధమైన సంభాషణను లేదా వాదనను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఒప్పించడానికి ప్రయత్నించేవాడు.’ గ్రీకు అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న లేదా పునరావృత ప్రయత్నాన్ని నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: సమాజమందిర సందర్భంలో, వీరు అక్కడికి వచ్చే లేదా దానితో సంబంధమున్న గ్రీకులై ఉండవచ్చు; కొందరు దీన్ని విస్తృతంగా ‘అన్యజనులు’ అని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: διελέγετο
  choice: చర్చిస్తూ
  rationale: ఈ క్రియ తర్కబద్ధమైన సంభాషణ, వివరణ లేదా వాదనను సూచించగలదు. అసంపూర్ణ భూతకాల రూపం పునరావృతంగా సాగిన కార్యాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగులో ‘చర్చిస్తూ’ సహజంగా ఉండి సంభాషణాత్మక భావాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక కథనాన్ని స్వల్పంగా ముందుకు నడిపే అనుసంధానాన్ని సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో దాన్ని ప్రత్యేకంగా వ్యక్తపరచకపోవడం సహజం.
- source_word: ἐν τῇ συναγωγῇ
  choice: సమాజమందిరంలో
  rationale: ἐν తో కూడిన దత్తివిభక్తి స్పష్టమైన స్థలార్థాన్ని ఇస్తుంది. ‘సమాజమందిరం’ యూదుల కూడిక స్థలాన్ని సూచించే స్థిరమైన, అర్థవంతమైన తెలుగు పదం.
- source_word: κατὰ πᾶν σάββατον
  choice: ప్రతి విశ్రాంతి దినాన
  rationale: κατά + πᾶν ఇక్కడ పంపిణీయ భావంతో ‘ప్రతి’ అని అర్థమిస్తుంది. ఇది వారానికొకసారి పునరావృతమైన కార్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἔπειθέν
  choice: ఒప్పించేవాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతూ లేదా పునరావృతమవుతూ ఉన్న ఒప్పించే కార్యాన్ని సూచిస్తుంది. గ్రీకు పదం ప్రయత్నాన్ని మాత్రమే తప్పనిసరిగా సూచించదు కాబట్టి ప్రధాన పాఠ్యంలో ‘ప్రయత్నించేవాడు’ అని జోడించలేదు.
- source_word: τε
  choice: వాక్య సమన్వయంలో వ్యక్తీకరించబడింది
  rationale: τε ముందున్న కార్యంతో ఒప్పించే కార్యాన్ని సున్నితంగా కలుపుతుంది. తెలుగులో క్రియాంత ‘-ూ’ రూపం మరియు వాక్య నిర్మాణం ఈ అనుసంధానాన్ని సహజంగా అందిస్తాయి.
- source_word: Ἰουδαίους
  choice: యూదులను
  rationale: ఇక్కడ పదం యూదులను జాతి-మత సమూహంగా సూచిస్తుంది; ‘యూదులు’ స్పష్టమైన సాధారణ తెలుగు రూపం.
- source_word: Ἕλληνας
  choice: గ్రీకులను
  rationale: మూలపాఠం ప్రత్యేకంగా ‘గ్రీకులు’ అని చెబుతుంది. వారిని ‘అన్యజనులు’ లేదా ‘దేవునికి భయపడే గ్రీకులు’ అని మరింత నిర్దిష్టపరచకుండా మూలంలోని పదాన్ని నిలిపింది.
theological_decisions:
- issue: సమాజమందిర సందర్భంలో Ἕλληνας గుర్తింపు
  choice: గ్రీకులు
  alternative: అన్యజనులు; దేవునికి భయపడే గ్రీకులు
  rationale: వీరు సమాజమందిరంతో సంబంధమున్న అన్యజనులై ఉండవచ్చు; అయితే వాక్యం వారిని కేవలం Ἕλληνας అని మాత్రమే పేర్కొంటుంది. అందువల్ల ప్రధాన పాఠ్యం వారి మతస్థితిని మరింత నిర్దిష్టంగా నిర్ణయించదు.
- issue: ἔπειθέν కార్యం ఫలితమా లేక కొనసాగిన ప్రయత్నమా
  choice: ఒప్పించేవాడు
  alternative: ఒప్పించడానికి ప్రయత్నించేవాడు
  rationale: గ్రీకు అసంపూర్ణ భూతకాలం కొనసాగిన లేదా పునరావృత కార్యాన్ని చూపుతుంది గాని, విఫలమైన ప్రయత్నాన్ని తప్పనిసరిగా సూచించదు. ఆ సాధ్యమైన ఛాయను పాదటీపులో ఉంచి ప్రధాన పాఠ్యాన్ని అతిగా వ్యాఖ్యానించకుండా ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. పునరావృత కార్యాన్ని ‘ప్రతి ... దినాన’ మరియు ‘-ేవాడు’ రూపాలతో తెలిపింది. మూలంలోని అర్థసందిగ్ధతలను ప్రధాన పాఠ్యంలో అతిగా పరిష్కరించకుండా పాదటీపుల్లో నిలిపింది.
