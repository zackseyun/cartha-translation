- source_word: διακατηλέγχετο
  choice: వాదనలను ... ఖండిస్తూ వచ్చాడు
  rationale: క్రియలోని సమగ్ర ప్రతివాద భావాన్ని, అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న చర్యను వ్యక్తం చేస్తుంది. సందర్భంలోని యూదులనే మొత్తంగా కాక వారి వాదనలను ఖండించాడనే ఉద్దేశాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: τοῖς Ἰουδαίοις
  choice: యూదుల వాదనలను
  rationale: గ్రీకులో యూదులు దత్తివిభక్తిలో ప్రతివాదులుగా ఉన్నారు; తెలుగులో ‘యూదులను ఖండించాడు’ అనే అపార్థాన్ని నివారిస్తూ వాదప్రసంగ సందర్భాన్ని తెలియజేస్తుంది.
- source_word: δημοσίᾳ
  choice: బహిరంగంగా
  rationale: చర్య ప్రజల సమక్షంలో జరిగినదని సంక్షిప్తంగా, సహజంగా తెలుపుతుంది.
- source_word: ἐπιδεικνὺς
  choice: చూపిస్తూ
  rationale: లేఖనాధారంగా నిరూపించి చూపే భావాన్ని సాధారణ పాఠకులకు సహజంగా అందిస్తుంది.
- source_word: διὰ τῶν γραφῶν
  choice: లేఖనాల ద్వారా
  rationale: διά + genitive తెలిపే సాధనార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: τὸν χριστὸν
