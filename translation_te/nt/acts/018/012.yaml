id: ACT.18.12
reference: Acts 18:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Γαλλίωνος δὲ ⸂ἀνθυπάτου ὄντος⸃ τῆς Ἀχαΐας κατεπέστησαν ⸂ὁμοθυμαδὸν οἱ Ἰουδαῖοι⸃ τῷ Παύλῳ καὶ ἤγαγον αὐτὸν ἐπὶ τὸ βῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/012.yaml
  text: But while Gallio was proconsul of Achaia[a], the Jews rose up together against Paul and brought him before the tribunal[b],
translation:
  language: te
  text: అయితే గల్లియో అకయకు ప్రోకాన్సల్‌గా ఉన్నప్పుడు, యూదులు[a] ఒక్కటై పౌలుకు వ్యతిరేకంగా లేచి, అతణ్ణి న్యాయపీఠం[b] ఎదుటికి తీసుకొచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘యూదులు’ అని ఉంది. ఇక్కడ ఇది పౌలుకు వ్యతిరేకంగా చర్య తీసుకున్న స్థానిక యూదుల వర్గాన్ని సూచిస్తుంది; ప్రపంచంలోని యూదులందరినీ కాదు.
    reason: cultural_note
  - marker: b
    text: లేదా ‘తీర్పు చెప్పే పీఠం.’ గ్రీకు పదం అధికారిక న్యాయవిచారణ జరిగే పీఠాన్ని లేదా వేదికను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γαλλίωνος
  choice: గల్లియో
  rationale: వ్యక్తి పేరును ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: δὲ
  choice: అయితే
  rationale: కథనంలో కొత్త పరిస్థితిని పరిచయం చేస్తూనే స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: ἀνθυπάτου ὄντος
  choice: ప్రోకాన్సల్‌గా ఉన్నప్పుడు
  rationale: ఈ genitive absolute నిర్మాణంలోని కాలసూచక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀνθύπατος
  choice: ప్రోకాన్సల్
  rationale: ఇది సాధారణ పాలకుని పదవి కాదు; రోమా పరిపాలనలోని నిర్దిష్ట ప్రాంతీయ అధికార పదవి. అందువల్ల నిర్దిష్ట బిరుదును లిప్యంతరీకరించాం.
- source_word: Ἀχαΐας
  choice: అకయకు
  rationale: రోమా ప్రాంతపు పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో ఇచ్చాం; విభక్తి ద్వారా అధికార పరిధిని స్పష్టం చేశాం.
- source_word: κατεπέστησαν
  choice: వ్యతిరేకంగా లేచి
  rationale: పౌలుపై జరిగిన శత్రుత్వపూర్వక చర్యను వ్యక్తం చేస్తుంది; మూలంలో లేని ప్రత్యక్ష హింసను అదనంగా సూచించదు.
- source_word: ὁμοθυμαδὸν
  choice: ఒక్కటై
  rationale: సమష్టిగా, ఒకే ఉద్దేశంతో చర్య చేపట్టిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: మూలంలోని ప్రత్యక్ష పదప్రయోగాన్ని నిలిపాం; దాని సందర్భోచిత పరిధిని పాదసూచికలో వివరించాం.
- source_word: τῷ Παύλῳ
  choice: పౌలుకు వ్యతిరేకంగా
  rationale: κατεπέστησαν‌తో కలిసిన dative ఇక్కడ శత్రుత్వ చర్యకు గురైన వ్యక్తిని సూచిస్తుంది.
- source_word: ἤγαγον αὐτὸν
  choice: అతణ్ణి ... తీసుకొచ్చారు
  rationale: న్యాయపరమైన సందర్భానికి తగిన తటస్థ అర్థాన్ని ఇస్తుంది; ‘ఈడ్చుకొచ్చారు’ వంటి మూలంలో స్పష్టంగా లేని కఠిన భావాన్ని చేర్చదు.
- source_word: ἐπὶ τὸ βῆμα
  choice: న్యాయపీఠం ఎదుటికి
  rationale: అధికారిక న్యాయవిచారణ జరిగే పీఠం లేదా వేదికను సూచిస్తుంది; తెలుగులో న్యాయసందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: విరోధ సందర్భంలో οἱ Ἰουδαῖοι అనే పదబంధం
  choice: యూదులు
  alternative: యూదుల నాయకులు / యూదయవారు
  rationale: గ్రీకు పాఠం నాయకులని ప్రత్యేకంగా చెప్పదు కాబట్టి దాని పరిధిని అనవసరంగా కుదించలేదు. అదే సమయంలో ఇది యూదులందరినీ సార్వత్రికంగా నిందిస్తున్నట్లు పాఠకులు భావించకుండా, సందర్భంలోని స్థానిక వర్గాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. చారిత్రక రోమా పదవిని ఖచ్చితంగా చూపేందుకు ‘ప్రోకాన్సల్’ అనే లిప్యంతరీకృత బిరుదును ఉంచాం. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదాల వెంటనే అమర్చాం.
