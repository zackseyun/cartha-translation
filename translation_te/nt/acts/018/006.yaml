id: ACT.18.6
reference: Acts 18:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀντιτασσομένων δὲ αὐτῶν καὶ βλασφημούντων ἐκτιναξάμενος τὰ ἱμάτια εἶπεν πρὸς αὐτούς· Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν· καθαρὸς ἐγώ· ἀπὸ τοῦ νῦν εἰς τὰ ἔθνη πορεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/006.yaml
  text: But when they opposed and reviled him, he shook out his garments and said to them, “Your blood be on your own heads. I am innocent. From now on I will go to the Gentiles.”
translation:
  language: te
  text: 'కానీ వారు ఎదిరిస్తూ దూషించినప్పుడు,[a] అతడు తన వస్త్రాలను విదిలించి వారితో ఇలా అన్నాడు: “మీ రక్తం మీ తలలమీదే ఉండుగాక.[b] నేను నిర్దోషిని. ఇకనుంచి నేను యూదేతరుల వద్దకు వెళ్తాను.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవదూషణ చేసినప్పుడు.” గ్రీకు క్రియ దేవునికి విరోధమైన మాటలనూ, దూషణపూర్వకమైన మాటలనూ సూచించగలదు; ఎవరిని లేదా దేనిని దూషించారో ఇక్కడ స్పష్టంగా చెప్పలేదు.
    reason: lexical_alternative
  - marker: b
    text: “మీ రక్తం మీ తలలమీదే ఉండుగాక” అంటే, కలిగే పరిణామాలకు బాధ్యత వారిదేనని తెలిపే నుడికారం.
    reason: cultural_note
  - marker: c
    text: లేదా “జనముల వద్దకు.” ఈ సందర్భంలో అది యూదులు కానివారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιτασσομένων
  choice: ఎదిరిస్తూ
  rationale: వారు పౌలు ప్రకటించిన సందేశానికి చురుకుగా ఎదురుతిరిగిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: βλασφημούντων
  choice: దూషణగా మాట్లాడినప్పుడు
  rationale: ఈ క్రియ దేవదూషణను గానీ, దూషణపూర్వకమైన మాటలను గానీ సూచించవచ్చు. గ్రీకులో ప్రత్యక్ష కర్మ స్పష్టంగా లేనందున ‘అతణ్ణి దూషించినప్పుడు’ అని జోడించకుండా అస్పష్టతను నిలుపుతుంది.
- source_word: ἐκτιναξάμενος τὰ ἱμάτια
  choice: తన వస్త్రాలను విదిలించి
  rationale: సంబంధాన్ని, బాధ్యతను వదులుకుంటున్నట్లు సూచించే ప్రతీకాత్మక చర్యను మూలానికి దగ్గరగా, తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν
  choice: మీ రక్తం మీ తలలమీదే ఉండుగాక
  rationale: పరిణామాలకు బాధ్యత వారిదేనని తెలిపే గంభీరమైన బైబిలీయ నుడికారాన్ని వివరణగా మార్చకుండా కాపాడుతుంది.
- source_word: καθαρὸς ἐγώ
  choice: నేను నిర్దోషిని
  rationale: అక్షరార్థమైన ‘శుద్ధుణ్ణి’ కంటే, ఈ సందర్భంలోని బాధ్యత లేదా అపరాధం నుంచి విముక్తి అనే రూపకార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἀπὸ τοῦ νῦν
  choice: ఇకనుంచి
  rationale: పౌలు సేవలో నిర్ణయాత్మకమైన మార్పును సంక్షిప్తమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: εἰς τὰ ἔθνη
  choice: యూదేతరుల దగ్గరికి
  rationale: సమాజమందిరంలోని యూదులకు విరుద్ధంగా ఇక్కడ τὰ ἔθνη యూదులు కానివారిని సూచిస్తుంది; ‘జనాల దగ్గరికి’ కంటే సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: πορεύσομαι
  choice: వెళ్తాను
  rationale: ఉద్దేశించిన ప్రయాణం లేదా పరిచర్య దిశను సరళంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: “మీ రక్తం మీ తలలమీదే” అనే బాధ్యత సూత్రం
  choice: సందేశాన్ని తిరస్కరించడం వల్ల కలిగే పరిణామాలకు వినేవారే బాధ్యులని, పౌలు కాదని తెలిపే గంభీర ప్రకటనగా నుడికారాన్ని అలాగే ఉంచడం.
  alternative: దీనిని మరింత బలమైన శాపవాక్యంగా స్పష్టీకరించడం.
  rationale: ఈ మాట బైబిలీయ కాపలాదారు-బాధ్యత భావనను ప్రతిధ్వనిస్తుంది. మూలపాఠం నిర్దేశించని మరింత తీవ్రమైన శాపార్థాన్ని చేర్చకుండా దాని గంభీరతను, ఉద్రిక్తతను నిలుపుతుంది.
- issue: βλασφημούντων యొక్క లక్ష్యం మరియు భావం
  choice: కర్మను జోడించకుండా ‘దూషణగా మాట్లాడినప్పుడు’ అని అనువదించడం.
  alternative: ‘అతణ్ణి దూషించినప్పుడు’ లేదా ‘దేవదూషణ చేసినప్పుడు’ అని నిర్దిష్టీకరించడం.
  rationale: గ్రీకు పాఠం ఎవరిని లేదా దేనిని దూషించారో స్పష్టంగా చెప్పదు; అందువల్ల పౌలునా, అతని సందేశాన్నా, దేవునినా అని అనువాదంలో నిర్ణయించడం తగదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే వాక్యంలోని గంభీరమైన న్యాయపరమైన ధోరణిని కాపాడేలా రూపొందించబడింది. ‘వస్త్రాలు,’ ‘నిర్దోషిని,’ ‘ఉండుగాక’ వంటి పదాలు గౌరవప్రదమైన బైబిలీయ శైలిని నిలుపుతాయి; అతి ప్రాచీన లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించాం.
