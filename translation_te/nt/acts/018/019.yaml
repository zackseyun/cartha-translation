source:
  edition: SBLGNT
  text: ⸀κατήντησαν δὲ εἰς Ἔφεσον, κἀκείνους κατέλιπεν αὐτοῦ, αὐτὸς δὲ εἰσελθὼν εἰς τὴν συναγωγὴν ⸀διελέξατο τοῖς Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/019.yaml
  text: They came to Ephesus[a], and he left them there[c][b]; but he himself entered into the synagogue and reasoned with the Jews.
translation:
  language: te
  text: వారు ఎఫెసుకు చేరుకున్నారు[a]. అతడు వారిని అక్కడే విడిచిపెట్టాడు[b]; అయితే తానే సమాజమందిరంలోకి వెళ్లి యూదులతో చర్చించాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఎఫెసుకు వచ్చి చేరుకున్నారు.’
    reason: lexical_alternative
  - marker: b
    text: అంటే, ముందటి వచనంలో పేర్కొన్న తన సహచరులైన ప్రిస్కిల్లను, అకులును అతడు అక్కడ విడిచిపెట్టాడు.
    reason: cross_reference
  - marker: c
    text: లేదా ‘తర్కిస్తూ సంభాషించాడు.’ గ్రీకు పదం తర్కబద్ధమైన సంభాషణను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατήντησαν
  choice: చేరుకున్నారు
  rationale: ఈ క్రియ ఒక గమ్యస్థానానికి చేరుకోవడాన్ని సూచిస్తుంది. కథన ప్రవాహంలో ‘ఎఫెసుకు చేరుకున్నారు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: δὲ … δὲ
  choice: మొదటి సందర్భంలో విరామచిహ్నం ద్వారా కథన కొనసాగింపు; రెండవ సందర్భంలో ‘అయితే’
  rationale: మొదటి δέ స్వల్ప అనుసంధానాన్ని, రెండవది ఇతరులను అక్కడ విడిచిపెట్టి తానే చేసిన పనితో ఉన్న వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: κἀκείνους
  choice: వారిని
  rationale: ఇది ‘మరియు వారిని/ఆ వారిని’ అనే భావం ఇచ్చి, ముందటి వచనంలోని సహచరులను సూచిస్తుంది. పేర్లను మూలపాఠ్యంలోకి చేర్చకుండా సర్వనామాన్ని నిలిపాం.
- source_word: κατέλιπεν … αὐτοῦ
  choice: అక్కడే విడిచిపెట్టాడు
  rationale: క్రియ ‘వెనుక విడిచిపెట్టడం’ అనే భావాన్ని, αὐτοῦ స్థలార్థంగా ‘అక్కడ’ అనే భావాన్ని ఇస్తాయి. ‘అక్కడే’ స్థలాన్ని, వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτὸς
  choice: తానే
  rationale: ఈ ఉద్ఘాటక సర్వనామం, అక్కడ ఉండిపోయిన సహచరులకు భిన్నంగా అతడు స్వయంగా చేసిన పనిని ముందుకు తెస్తుంది.
- source_word: εἰσελθὼν
  choice: లోకి వెళ్లి
  rationale: ఈ కృదంతం ప్రధాన క్రియకు ముందు జరిగిన నేపథ్య చర్యను తెలుగులో సహజమైన వరుస క్రియారూపంతో తెలియజేస్తుంది.
- source_word: συναγωγήν
  choice: సమాజమందిరం
  rationale: ఈ యూదు సందర్భంలో ఇది యూదులు ఆరాధనకూ బోధకూ కూడే స్థలాన్ని సూచిస్తుంది. ఆధునిక తెలుగు బైబిలు వాడుకలో ‘సమాజమందిరం’ సుపరిచితమైన పదం.
- source_word: διελέξατο
  choice: చర్చించాడు
  rationale: ఈ క్రియ ఆలోచనలను పరస్పరం ఉంచుతూ తర్కబద్ధంగా మాట్లాడటాన్ని సూచిస్తుంది. ‘చర్చించాడు’ సంభాషణాత్మక స్వభావాన్ని నిలుపుతూ, ‘వాదించాడు’లో కలిగే అనవసరమైన ఘర్షణ భావాన్ని నివారిస్తుంది.
- source_word: τοῖς Ἰουδαίοις
  choice: యూదులతో
  rationale: గ్రీకు పదబంధంలోని జాతి-మత సంబంధ సూచనను నేరుగా అందిస్తుంది; ‘నాయకులు’ అని పరిమితం చేయడానికి మూలపాఠ్యంలో ఆధారం లేదు.
