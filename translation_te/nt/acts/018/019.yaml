translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని ఉద్ఘాటనను ‘తానే’తో, సంభాషణాత్మకమైన తర్క భావాన్ని ‘చర్చించాడు’తో నిలిపాం. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదాల వద్ద ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
