id: ACT.18.10
reference: Acts 18:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διότι ἐγώ εἰμι μετὰ σοῦ καὶ οὐδεὶς ἐπιθήσεταί σοι τοῦ κακῶσαί σε, διότι λαός ἐστί μοι πολὺς ἐν τῇ πόλει ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/010.yaml
  text: because I am with you[a], and no one will attack you to harm you[b], because I have many people in this city.
translation:
  language: te
  text: ఎందుకంటే నేను నీకు తోడుగా ఉన్నాను; నీకు హాని చేయడానికి ఎవ్వరూ నీ మీద దాడి చేయరు[a]. ఎందుకంటే ఈ పట్టణంలో నాకు చెందినవారు చాలామంది ఉన్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీకు హాని చేయడానికి ఎవ్వరూ నీ మీద చేయి వేయరు.”
    reason: lexical_alternative
  - marker: b
    text: “ఈ పట్టణంలో నాకు చెందినవారు చాలామంది ఉన్నారు” అనే మాట, కొరింథులో ప్రభువుకు చెందినవారిని—ఇంకా విశ్వసించబోయేవారితో సహా—సూచిస్తుండవచ్చు.
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలోని ఆజ్ఞకు కారణాన్ని, అలాగే వాగ్దానానికి ఆధారాన్ని తెలియజేసే కారణార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐγώ εἰμι μετὰ σοῦ
  choice: నేను నీకు తోడుగా ఉన్నాను
  rationale: దైవిక సన్నిధి, సహాయం అనే భావాన్ని సహజంగా తెలియజేస్తుంది; స్పష్టంగా ఉన్న ἐγώ వల్ల వచ్చే ఉద్ఘాటనను ‘నేను’ నిలుపుతుంది.
- source_word: οὐδεὶς ἐπιθήσεταί σοι
  choice: ఎవ్వరూ నీ మీద దాడి చేయరు
  rationale: ఈ సందర్భంలో ἐπιτίθημι తెలిపే శత్రుత్వపూర్వక చర్యను స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοῦ κακῶσαί σε
  choice: నీకు హాని చేయడానికి
  rationale: ఆ దాడి యొక్క ఉద్దేశం లేదా ఫలితాన్ని తెలిపే ఆర్టిక్యులర్ ఇన్ఫినిటివ్ భావాన్ని విస్తృతంగా నిలుపుతుంది.
- source_word: λαός ἐστί μοι πολύς
  choice: నాకు చెందినవారు చాలామంది ఉన్నారు
  rationale: εἰμίతో కూడిన దత్తివిభక్తి μοι తెలిపే స్వాధీన లేదా చెందిన సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది. λαόςను కేవలం జనాభాగా కాక, ప్రభువుతో సంబంధమున్న సమూహంగా సూచిస్తుంది; అయితే వారు ఏ విధంగా ఆయనకు చెందినవారో ప్రధాన పాఠ్యంలో నిర్ణయించదు.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: ఈ పట్టణంలో
  rationale: కొరింథు అనే పట్టణ కేంద్రాన్ని సూచించే πόλιςకు సహజమైన తెలుగు రూపం; ταύτῃ యొక్క సూచనార్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఈ పట్టణంలో ‘నాకు చెందినవారు చాలామంది’ అనే మాట అర్థం
  choice: ప్రభువు తనకు చెందినవారిగా పేర్కొనే అనేకమందిని సూచించేలా అనువదించడం, కానీ వారు ఇప్పటికే విశ్వసించినవారా లేక తరువాత విశ్వసించబోయేవారా అన్నది ప్రధాన పాఠ్యంలో నిర్ధారించకపోవడం.
  alternative: ఇప్పటికే పౌలుకు అనుకూలంగా ఉన్న అనేకమందిని మాత్రమే సూచిస్తుందని తీసుకోవచ్చు.
  rationale: λαός మరియు μοι కలిసి కేవలం పట్టణ జనసంఖ్యకన్నా ప్రభువుతో చెందిన సంబంధాన్ని సూచిస్తాయి. అయినప్పటికీ కాలపరమైన లేదా సిద్ధాంతపరమైన వివరాన్ని గ్రీకు పాఠ్యం ప్రత్యక్షంగా చెప్పదు; అందువల్ల ఆ ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా దైవిక వాక్యానికి తగిన గంభీరతతో రూపొందించబడింది. ‘నీకు తోడుగా’ సన్నిధి మరియు సహాయ భావాలను సహజంగా అందిస్తుంది. రెండు పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో సంబంధిత స్థానాల్లో ఉంచబడ్డాయి.
