- from: 'అయితే పౌలు నోరు తెరిచి మాట్లాడబోతుండగా[a], గల్లియో యూదులతో ఇలా అన్నాడు: “యూదులారా, ఇది ఏదైనా అన్యాయమైన పని గురించో దుష్టమైన నేరం గురించో అయితే, మీ మాట వినడానికి నాకు తగిన కారణం ఉండేది.[b]'
  to: 'అయితే పౌలు నోరు తెరవబోతుండగా[a], గల్లియో యూదులతో ఇలా అన్నాడు: “యూదులారా, ఇది ఏదైనా అన్యాయమైన పని గురించో దుష్టమైన నేరం గురించో అయితే, మిమ్మల్ని సహించడానికి నాకు సముచితమైన కారణం ఉండేది.”[b]'
  rationale: The revision retains the draft’s faithful legal and rhetorical sense while restoring the direct object and dismissive force of ἀνεσχόμην ὑμῶν. It also smooths the imminent-action idiom and corrects quotation punctuation. No doctrinal or interpretive expansion has been introduced.
