id: ACT.18.14
reference: Acts 18:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μέλλοντος δὲ τοῦ Παύλου ἀνοίγειν τὸ στόμα εἶπεν ὁ Γαλλίων πρὸς τοὺς Ἰουδαίους· Εἰ ⸀μὲν ἦν ἀδίκημά τι ἢ ῥᾳδιούργημα πονηρόν, ὦ Ἰουδαῖοι, κατὰ λόγον ἂν ἀνεσχόμην ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/014.yaml
  text: But as Paul was about to open his mouth[a], Gallio said to the Jews, “If it were some wrongdoing or a serious crime, O Jews[c][b], I would reasonably put up with you.
translation:
  language: te
  text: 'అయితే పౌలు నోరు తెరవబోతుండగా[a], గల్లియో యూదులతో ఇలా అన్నాడు: “యూదులారా, ఇది ఏదైనా అన్యాయమైన పని గురించో దుష్టమైన నేరం గురించో అయితే, మిమ్మల్ని సహించడానికి నాకు సముచితమైన కారణం ఉండేది.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పౌలు మాట్లాడబోతుండగా.” మూలభాషలో అక్షరార్థంగా “నోరు తెరవబోతుండగా” అని ఉంది; ఇది మాట్లాడడం మొదలుపెట్టడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నేను మిమ్మల్ని భరించడానికి తగిన కారణం ఉండేది.” ఇక్కడి గ్రీకు పదబంధం, వారి ఫిర్యాదును వినడాన్ని సందర్భానుసారంగా సూచించవచ్చుగానీ, అక్షరార్థంగా వారిని సహించడం లేదా భరించడం అనే భావాన్ని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλοντος ... τοῦ Παύλου ἀνοίγειν τὸ στόμα
  choice: పౌలు నోరు తెరిచి మాట్లాడబోతుండగా
  rationale: Genitive absolute with μέλλω marks an action just about to occur. ‘నోరు తెరిచి’ preserves the Greek idiom, while ‘మాట్లాడబోతుండగా’ makes its meaning immediately clear in natural Telugu.
- source_word: δὲ
  choice: అయితే
  rationale: 'Marks the mild contrast and narrative turn: Paul is about to respond, but Gallio speaks first.'
- source_word: Γαλλίων
  choice: గల్లియో
  rationale: The personal name is transliterated in a natural Telugu form.
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: యూదులతో
  rationale: Naturally expresses the addressees of Gallio’s speech without adding the interpretive label ‘accusers.’
- source_word: ἀδίκημά τι
  choice: ఏదైనా అన్యాయమైన పని
  rationale: Keeps the broad legal sense of a wrongful act without specifying a particular offense.
- source_word: ῥᾳδιούργημα πονηρόν
  choice: దుష్టమైన నేరం
  rationale: Preserves both the criminal and morally evil force of the phrase rather than reducing it merely to seriousness.
- source_word: ὦ Ἰουδαῖοι
  choice: యూదులారా
  rationale: Natural Telugu vocative that conveys direct rhetorical address without an artificial equivalent for ὦ.
- source_word: κατὰ λόγον
  choice: తగిన కారణం ఉండేది
  rationale: Conveys ‘with good reason’ or ‘justifiably’ idiomatically in Telugu.
- source_word: ἀνεσχόμην ὑμῶν
  choice: మీ మాట వినడానికి
  rationale: In this judicial setting the idiom refers to bearing with the complainants by giving their case a hearing. This contextual rendering is more natural than a literal Telugu expression that could suggest merely tolerating their presence.
theological_decisions: []
translation_notes:
  register: Modern standard Telugu with a dignified narrative register. The verse preserves the legal tone and Gallio’s somewhat dismissive stance, while avoiding archaic vocatives and opaque literalism.
