source:
  edition: SBLGNT
  text: ⸂ἀλλὰ ἀποταξάμενος καὶ⸃ ⸀εἰπών· ⸀Πάλιν ἀνακάμψω πρὸς ὑμᾶς τοῦ θεοῦ θέλοντος ἀνήχθη ἀπὸ τῆς Ἐφέσου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/021.yaml
  text: but after taking leave and saying[a], “I will return to you again[b], if God wills,” he set sail from Ephesus.
translation:
  language: te
  text: కాని అతడు వీడ్కోలు చెప్పి, “దేవుడు ఇష్టపడితే[b] నేను మళ్లీ మీ దగ్గరికి వస్తాను” అని చెప్పి[a], ఎఫెసు నుండి ఓడలో బయలుదేరాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో ‘అని చెప్పి, “దేవుడు ఇష్టపడితే నేను మళ్లీ మీ దగ్గరికి వస్తాను”’ అనే మాటలు లేవు.
    reason: textual_variant
  - marker: b
    text: లేదా, ‘దేవుని చిత్తమైతే.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: కాని
  rationale: మునుపటి వచనంలో మరికొంతకాలం ఉండమని వారు కోరినదానికి విరుద్ధంగా పౌలు బయలుదేరడాన్ని సహజంగా సూచిస్తుంది.
- source_word: ἀποταξάμενος
  choice: వీడ్కోలు చెప్పి
  rationale: విడిచి వెళ్లేముందు వీడ్కోలు పలకడాన్ని తెలిపే ఏకకాలిక కృదంత భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: καὶ εἰπών
  choice: అని చెప్పి
  rationale: గ్రీకు పాఠంలోని రెండవ కృదంతాన్ని నిలుపుతూ, ప్రత్యక్ష వాక్యంతో తెలుగులో సహజంగా అనుసంధానిస్తుంది.
- source_word: Πάλιν
  choice: మళ్లీ
  rationale: తిరిగి రావడాన్ని తెలిపే సాధారణ, సహజమైన క్రియావిశేషణం.
- source_word: ἀνακάμψω
  choice: వస్తాను
  rationale: πρὸς ὑμᾶςతో కలిపి ‘మీ దగ్గరికి వస్తాను’ అని చెప్పడం తెలుగులో సహజంగా తిరిగి రావడాన్ని వ్యక్తం చేస్తుంది; ‘మళ్లీ’ పునరాగమన భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: πρὸς ὑμᾶς
  choice: మీ దగ్గరికి
  rationale: వ్యక్తులవైపు గమనాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοῦ θεοῦ θέλοντος
  choice: దేవుడు ఇష్టపడితే
  rationale: దేవుని చిత్తంపై ప్రయాణ ప్రణాళిక ఆధారపడిన షరతును స్పష్టంగా నిలుపుతుంది; మూలంలో ఉన్న θεόςను ‘ప్రభువు’గా మార్చదు.
- source_word: ἀνήχθη
  choice: ఓడలో బయలుదేరాడు
  rationale: ప్రయాణ సందర్భంలో ఈ క్రియకు ఉన్న సముద్రయానార్థాన్ని స్పష్టంగా, సామాన్య పాఠకులకు అర్థమయ్యేలా తెలియజేస్తుంది.
- source_word: ἀπὸ τῆς Ἐφέσου
  choice: ఎఫెసు నుండి
  rationale: నగరం నుండి బయలుదేరిన గమనాన్ని నేరుగా తెలుపుతుంది; ‘ఎఫెసు’ తెలుగు బైబిలు వాడుకలో స్థిరపడిన రూపం.
theological_decisions:
- issue: పౌలు ప్రయాణ ప్రణాళికలో దేవుని చిత్తం
  choice: దేవుడు ఇష్టపడితే
  alternative: దేవుని చిత్తమైతే
  rationale: మూలంలోని τοῦ θεοῦ θέλοντος అనే షరతు భావాన్ని సహజంగా నిలుపుతుంది; దేవుని చిత్తంపై ఆధారాన్ని తగ్గించదు, అలాగే మూలంలో లేని ‘ప్రభువు’ అనే పదాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు కృదంతాల క్రమాన్ని తెలుగు వాక్య నిర్మాణానికి తగినట్లు ఉంచి, సముద్రయాన భావాన్ని ‘ఓడలో బయలుదేరాడు’ అని స్పష్టం చేసింది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాఠాంతర పాదటిప్పణితో సరిపోలుతుంది.
