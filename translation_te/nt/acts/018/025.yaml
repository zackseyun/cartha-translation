id: ACT.18.25
reference: Acts 18:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτος ἦν κατηχημένος τὴν ὁδὸν τοῦ κυρίου, καὶ ζέων τῷ πνεύματι ἐλάλει καὶ ἐδίδασκεν ἀκριβῶς τὰ περὶ τοῦ ⸀Ἰησοῦ, ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/025.yaml
  text: This man had been instructed in the way of the Lord[a], and being fervent in spirit, he was speaking and teaching accurately the things concerning Jesus, knowing only the baptism of John.
translation:
  language: te
  text: ఇతడు ప్రభువు మార్గంలో ఉపదేశం పొందినవాడు. ఆత్మలో[a] ఎంతో ఉత్సాహంగా ఉండి, యేసును గురించిన సంగతులను సరిగ్గా మాట్లాడుతూ బోధిస్తూ ఉండేవాడు; యోహాను బాప్తిస్మం మాత్రమే తెలిసినవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆత్మలో’ అనేది అపొల్లో సొంత ఆత్మను సూచించవచ్చు; లేదా పరిశుద్ధాత్మను సూచిస్తూ, ‘పరిశుద్ధాత్మలో ఎంతో ఉత్సాహంగా ఉండి’ అని అర్థం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: κατηχημένος
  choice: ఉపదేశం పొందాడు
  rationale: పూర్ణ కర్మణి కృదంతం గతంలో పొందిన బోధన ఫలితం కొనసాగుతున్నదని సూచిస్తుంది. ‘ఉపదేశం పొందాడు’ అనే ప్రయోగం మౌఖికంగా బోధించబడిన భావాన్ని సహజమైన ఆధునిక తెలుగులో ఇస్తుంది; తరువాతి కాలపు సాంకేతిక సంఘపదాన్ని అనవసరంగా చేర్చదు.
- source_word: τὴν ὁδὸν τοῦ κυρίου
  choice: ప్రభువు మార్గాన్ని గురించి
  rationale: ‘మార్గం’ అనే ఆదిమ క్రైస్తవ ప్రయోగాన్ని నిలుపుతూ, తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉండేందుకు ‘గురించి’ వాడబడింది. κύριος ను ‘ప్రభువు’గా అనువదించాం.
- source_word: ζέων τῷ πνεύματι
  choice: ఆత్మలో ఎంతో ఉత్సాహం గలవాడై
  rationale: ζέων లోని మండే ఉత్సాహ భావాన్ని సహజ తెలుగులో ‘ఎంతో ఉత్సాహం’ తెలియజేస్తుంది. τῷ πνεύματι అపొల్లో అంతరాత్మను గానీ పరిశుద్ధాత్మను గానీ సూచించవచ్చు; ప్రధాన పాఠం ఆ సందిగ్ధతను నిర్ణయించదు.
- source_word: ἐλάλει καὶ ἐδίδασκεν
  choice: చెబుతూ బోధిస్తూ ఉండేవాడు
  rationale: రెండు అపూర్ణకాల క్రియలు కొనసాగుతున్న లేదా అలవాటైన కార్యాన్ని సూచిస్తాయి. ‘ఉండేవాడు’ ఆ కాలభావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; λαλέω కు ‘చెబుతూ’ నేరమైన సమానార్థకం.
- source_word: ἀκριβῶς
  choice: ఖచ్చితంగా
  rationale: అతని బోధనలోని సరిగ్గా ఉండటం, నిర్దిష్టత అనే భావాన్ని ‘ఖచ్చితంగా’ స్పష్టంగా అందిస్తుంది.
- source_word: τὰ περὶ τοῦ Ἰησοῦ
  choice: యేసును గురించిన సంగతులను
  rationale: యేసుకు సంబంధించిన బోధనాంశాల విస్తృత పరిధిని కుదించకుండా గ్రీకు పదబంధాన్ని సహజ తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου
  choice: అతనికి తెలిసింది యోహాను బాప్తిస్మం మాత్రమే
  rationale: μόνον యొక్క పరిమితిని స్పష్టంగా నిలుపుతుంది. గ్రీకులోని కృదంతాన్ని తెలుగులో సహజమైన ఉపవాక్యంగా మార్చి, అపొల్లో జ్ఞానంలోని పరిమితిని తెలియజేస్తుంది.
theological_decisions:
- issue: ζέων τῷ πνεύματι లో τῷ πνεύματι యొక్క భావం
  choice: ‘ఆత్మలో’ అని ఉంచి, అపొల్లో అంతరంగ ఉత్సాహం అనే పఠనానికి అవకాశం ఇవ్వడం
  alternative: పరిశుద్ధాత్మలో ఉత్సాహం గలవాడై
  rationale: గ్రీకు రూపం మానవ అంతరాత్మనూ పరిశుద్ధాత్మనూ సూచించగలదు. తెలుగులో ‘ఆత్మ’ అనే పదమే రెండు అవకాశాలనూ సహజంగా నిలుపుతుంది; పాదసూచిక ఆ నిజమైన వ్యాఖ్యాన సందిగ్ధతను స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే వాక్య గౌరవాన్ని నిలుపుకునేలా రూపొందించబడింది. ‘బాప్తిస్మం’ అనే విస్తృతంగా గుర్తించదగిన బైబిలు పదం నిలుపబడింది. పాఠంలోని [a] గుర్తు సందిగ్ధమైన ‘ఆత్మలో’ అన్న పదబంధం వెంటనే ఉంచబడింది.
