  register: సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన ప్రామాణిక తెలుగు వాడబడింది. గ్రీకు అసంపూర్ణ భూతకాల భావాన్ని ‘పని చేసేవాడు’ ద్వారా వ్యక్తం చేసి, σκηνοποιοί పదంలోని నిజమైన నిఘంటు అనిశ్చితిని పాదటిప్పణిలో నిలుపుకున్నాం.
