source:
  edition: SBLGNT
  text: καὶ διὰ τὸ ὁμότεχνον εἶναι ἔμενεν παρ’ αὐτοῖς καὶ ⸀ἠργάζετο, ἦσαν γὰρ σκηνοποιοὶ ⸂τῇ τέχνῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/003.yaml
  text: And because he was of the same trade[a], he stayed with them and worked, for they were tentmakers by trade.
translation:
  language: te
  text: అతనికి కూడా వారిదే వృత్తి కావడంతో, అతడు వారి దగ్గర ఉండి పనిచేస్తుండేవాడు. ఎందుకంటే వారు గుడారాలు తయారుచేసే వృత్తివారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తోలు పనివారు’ కావచ్చు; గ్రీకు పదం గుడారాలు తయారుచేసేవారినే కాక, సంబంధిత చేతివృత్తి చేసేవారిని కూడా విస్తృతంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ ὁμότεχνον εἶναι
  choice: అతనిది కూడా అదే వృత్తి కావడంతో
  rationale: διάతో కూడిన articular infinitive కారణాన్ని తెలియజేస్తుంది. ὁμότεχνος ఒకే వృత్తి లేదా చేతిపని కలిగి ఉండడాన్ని సూచిస్తుంది; ఈ అనువాదం పౌలుకు వారితో ఒకే వృత్తి ఉందనే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἔμενεν παρ’ αὐτοῖς
  choice: అతడు వారితో ఉండి
  rationale: μένω ఇక్కడ వారితో నివసించడం లేదా ఉండడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వారితో ఉండి’ సహజంగా, సందర్భానికి తగినట్లుగా ఉంది.
- source_word: ἠργάζετο
  choice: పని చేసేవాడు
  rationale: ἐργάζομαι వృత్తిపరమైన చేతిపనిలో నిమగ్నమవడాన్ని సూచిస్తుంది. అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న లేదా అలవాటైన చర్యను ‘పని చేసేవాడు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: σκηνοποιοὶ
  choice: గుడారాలు తయారుచేసేవారు
  rationale: σκηνοποιός యొక్క సంప్రదాయికమైన, అత్యంత సంభావ్యమైన అర్థం గుడారాలు తయారుచేసేవారు. అయితే సంబంధిత తోలు పనివారనే విస్తృత అవకాశం పాదటిప్పణిలో భద్రపరచబడింది.
- source_word: τῇ τέχνῃ
  choice: వృత్తిరీత్యా
  rationale: τέχνη ఇక్కడ నైపుణ్యంతో కూడిన చేతివృత్తిని సూచిస్తుంది. దత్తి విభక్తి ప్రయోగాన్ని ‘వృత్తిరీత్యా’ సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
