id: ACT.18.26
reference: Acts 18:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτός τε ἤρξατο παρρησιάζεσθαι ἐν τῇ συναγωγῇ· ἀκούσαντες δὲ αὐτοῦ ⸂Πρίσκιλλα καὶ Ἀκύλας⸃ προσελάβοντο αὐτὸν καὶ ἀκριβέστερον αὐτῷ ἐξέθεντο τὴν ⸂ὁδὸν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/026.yaml
  text: And he began to speak boldly in the synagogue. But when Priscilla and Aquila heard him[a], they took him aside and explained the way of God to him more accurately.
translation:
  language: te
  text: అతడు సమాజమందిరంలో ధైర్యంగా మాట్లాడడం మొదలుపెట్టాడు. అయితే ప్రిస్కిల్లా, అక్విలా అతని మాట విని, అతన్ని పక్కకు తీసుకొని[a], దేవుని మార్గాన్ని అతనికి మరింత కచ్చితంగా వివరించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతన్ని తమతో చేర్చుకొని”; లేదా “అతన్ని స్వీకరించి.” గ్రీకు క్రియకు ఒకరిని తమతో చేర్చుకోవడం లేదా స్వీకరించడం అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός τε ἤρξατο
  choice: అతడు ... మొదలుపెట్టాడు
  rationale: οὗτος ముందరి సందర్భంలోని అపొల్లోను సూచిస్తుంది; τέ స్వల్ప అనుసంధాన భావాన్ని ఇస్తుంది. తెలుగులో సహజమైన వాక్యప్రవాహం కోసం ప్రత్యేక సంధిపదం లేకుండానే భావం నిలుస్తుంది.
- source_word: παρρησιάζεσθαι
  choice: ధైర్యంగా మాట్లాడడం
  rationale: ఈ క్రియ బహిరంగంగా, ఆత్మవిశ్వాసంతో, ధైర్యంగా మాట్లాడడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఈ ఎంపిక సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ἐν τῇ συναγωγῇ
  choice: సమాజమందిరంలో
  rationale: యూదుల synagogue‌ను సూచించే స్థిరమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: ἀκούσαντες δὲ αὐτοῦ
  choice: అయితే ... అతని మాట విని
  rationale: కృదంతానికి సందర్భానుగుణ కాలార్థం ఉంది; δέ స్వల్ప మలుపును సూచిస్తుంది. αὐτοῦను తెలుగులో సహజంగా ‘అతని మాట’ అని వ్యక్తం చేశాం.
- source_word: Πρίσκιλλα καὶ Ἀκύλας
  choice: ప్రిస్కిల్ల, అకుల
  rationale: గ్రీకు పేర్లకు ప్రాచుర్యంలో ఉన్న తెలుగు లిప్యంతరీకరణలు; మూలంలోని పేర్ల క్రమం నిలిపాం.
- source_word: προσελάβοντο αὐτὸν
  choice: అతన్ని పక్కకు తీసుకువెళ్లి
  rationale: తమ వద్దకు తీసుకోవడం, వెంట తీసుకెళ్లడం, స్వీకరించడం అనే భావాలు సాధ్యమైనప్పటికీ, వెంటనే వచ్చే వ్యక్తిగత వివరణ సందర్భంలో ‘పక్కకు తీసుకువెళ్లి’ కథన ప్రవాహానికి సరిపోతుంది. ఇతర సాధ్యార్థాలను పాదటిప్పణిలో నిలిపాం.
- source_word: ἀκριβέστερον
  choice: మరింత కచ్చితంగా
  rationale: తులనాత్మక భావాన్ని స్పష్టంగా నిలుపుతూ, అపొల్లోకు అప్పటికే కొంత అవగాహన ఉందని సూచిస్తుంది.
- source_word: ἐξέθεντο
  choice: వివరించారు
  rationale: ఇక్కడ మధ్యమవాచక రూపం విషయాన్ని విపులంగా వివరించడం అనే అర్థంలో ఉంది; ‘వివరించారు’ ఆధునిక తెలుగులో సహజం.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: దేవుని మార్గాన్ని
  rationale: మూలంలోని ‘దేవుని మార్గం’ అనే విస్తృతమైన వ్యక్తీకరణను అలాగే ఉంచి, దాని భావాన్ని ఒక నిర్దిష్ట సిద్ధాంత సూత్రంగా కుదించలేదు.
- source_word: αὐτῷ
  choice: అతనికి
  rationale: ἐξέθεντο క్రియకు పరోక్ష కర్మగా ఉన్న దత్తివును సహజమైన తెలుగు రూపంలో ఇచ్చాం.
theological_decisions:
- issue: ప్రిస్కిల్ల, అకుల అపొల్లో పట్ల చేసిన చర్య స్వభావం
  choice: వ్యక్తిగతంగా మరింత వివరణ ఇవ్వడానికి అతన్ని పక్కకు తీసుకువెళ్లారు
  alternative: అతన్ని తమతో తీసుకువెళ్లారు లేదా ఆహ్వానించి స్వీకరించారు
  rationale: προσελάβοντοకు స్వీకరించడం లేదా వెంట తీసుకోవడం అనే అర్థాలు కూడా ఉన్నాయి. అయితే తరువాతి వివరణ సందర్భం వ్యక్తిగత, సహాయక బోధనను సూచిస్తుంది. అనువాదం బహిరంగ మందలింపునో, పాఠ్యంలో లేని అధికార నిర్మాణాన్నో సూచించదు; పదంలోని నిజమైన సందిగ్ధతను పాదటిప్పణి కాపాడుతుంది.
- issue: ‘దేవుని మార్గం’ అనే పదబంధం అర్థం
  choice: మూలంలోని విస్తృత పదబంధాన్ని యథాతథంగా నిలపడం
  alternative: దేవుని నైతిక మార్గం మాత్రమే, లేదా సంపూర్ణ క్రైస్తవ విశ్వాసానికి సాంకేతిక నామం
  rationale: సందర్భంలో ఇది దేవుని రక్షణ మార్గం లేదా క్రైస్తవ సందేశాన్ని సూచించే అవకాశమున్నప్పటికీ, మూలపాఠ్యం దానిని మరింత నిర్దిష్టంగా నిర్వచించదు. అందువల్ల సిద్ధాంతపరంగా అతిగా వివరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘మరింత కచ్చితంగా’ అనే రూపం మూలంలోని తులనాత్మక భావాన్ని నిలుపుతుంది. ప్రధాన పాఠ్యంలో [a] గుర్తు సంబంధిత క్రియాపదం వెంట ఉంచబడింది.
