revisions:
- from: అప్పుడు అతడు వారిని న్యాయపీఠం దగ్గర నుండి వెళ్లగొట్టాడు.[a]
  to: అతడు వారిని న్యాయపీఠం నుండి వెళ్లగొట్టాడు.[a]
  rationale: The revision removes the added temporal nuance of ‘అప్పుడు’ and renders ἀπὸ τοῦ βήματος directly as ‘న్యాయపీఠం నుండి.’ It preserves the source’s concise narrative style, legal setting, and forceful action.
  reviewer_model: gpt-5.6-terra
