review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the forcible, authoritative removal expressed by ἀπήλασεν and retains the contextual pronoun ‘వారిని.’ However, ‘అప్పుడు’ adds a temporal ‘then’ nuance not explicitly expressed by the simple connective καί, and ‘దగ్గర నుండి’ (‘from near’) weakens ἀπὸ τοῦ βήματος, which denotes removal from the judicial platform/tribunal setting.
  naturalness: ‘వెళ్లగొట్టాడు’ is natural modern standard Telugu for authoritative driving away. ‘న్యాయపీఠం నుండి’ is both idiomatic and more direct than ‘న్యాయపీఠం దగ్గర నుండి.’ Telugu need not mechanically reproduce initial καί; the unmarked narrative continuation is natural.
  terminology: ‘న్యాయపీఠం’ suitably renders βῆμα in this legal context. The note appropriately explains its possible sense as the official judicial seat or hearing platform.
  issues:
  - severity: medium
    issue: ‘అప్పుడు’ over-translates καί.
    rationale: καί is a straightforward narrative conjunction (‘and’), not specifically a temporal adverb (‘then’). Omitting an explicit connector is a natural Telugu way to preserve simple continuation without adding temporal force.
  - severity: medium
    issue: ‘దగ్గర నుండి’ weakens the locative force of ἀπὸ τοῦ βήματος.
    rationale: The phrase means ‘from the judgment seat/tribunal,’ namely the judicial hearing area. ‘From near the judgment seat’ introduces proximity that the Greek does not state.
  revised_text: అతడు వారిని న్యాయపీఠం నుండి వెళ్లగొట్టాడు.[a]
  revised_footnotes:
  - marker: a
    text: లేదా, ‘న్యాయస్థాన వేదిక’; గ్రీకు పదం βῆμα న్యాయాధికారి కూర్చునే అధికారిక ఆసనాన్ని లేదా న్యాయవిచారణ జరిగే వేదికను సూచిస్తుంది.
    reason: lexical_alternative
