translation:
  language: te
  text: అతడు వారిని న్యాయపీఠం నుండి వెళ్లగొట్టాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘న్యాయస్థాన వేదిక’; గ్రీకు పదం βῆμα న్యాయాధికారి కూర్చునే అధికారిక ఆసనాన్ని లేదా న్యాయవిచారణ జరిగే వేదికను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: అప్పుడు
  rationale: ఇక్కడ καί కథనాన్ని ముందుకు నడిపే అనుసంధానంగా ఉంది; ఆధునిక తెలుగులో ‘అప్పుడు’ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: ἀπήλασεν
  choice: వెళ్లగొట్టాడు
  rationale: ἀπελαύνω బలవంతంగా లేదా అధికారపూర్వకంగా దూరం చేయడాన్ని సూచిస్తుంది. ‘వెళ్లగొట్టాడు’ అనే పదం ‘పంపివేశాడు’ కంటే ఆ బలమైన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: αὐτοὺς
  choice: వారిని
  rationale: సర్వనామాన్ని సందర్భానుసారంగా ‘వారిని’ అని ఉంచడం ద్వారా ఎవరిని ఉద్దేశించిందో అనవసరంగా మరింత నిర్దిష్టం చేయకుండా మూలంలోని సూచనను కాపాడుతుంది.
- source_word: ἀπὸ τοῦ βήματος
  choice: న్యాయపీఠం దగ్గర నుండి
  rationale: ἀπό దూరం చేయబడిన స్థలాన్ని సూచిస్తుంది; βῆμα ఈ న్యాయ సందర్భంలో అధికారి విచారణ నిర్వహించే అధికారిక ఆసనం లేదా వేదిక. ‘దగ్గర నుండి’ అనేది వారిని ఆసనం మీద నుంచే తొలగించారనే అపార్థాన్ని నివారిస్తుంది.
- source_word: βήματος
  choice: న్యాయపీఠం
  rationale: βῆμα ఇక్కడ న్యాయాధికారి అధికారిక ఆసనం లేదా న్యాయవిచారణ వేదికను సూచిస్తుంది. ‘న్యాయపీఠం’ ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా, స్పష్టంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. చర్యలోని అధికారపూర్వక బలాన్ని నిలుపుతూ, న్యాయపరమైన సందర్భాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలిపే పదాలు ఎంచుకున్నాం.
