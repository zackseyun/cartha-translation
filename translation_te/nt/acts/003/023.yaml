source:
  edition: SBLGNT
  text: ἔσται δὲ πᾶσα ψυχὴ ἥτις ⸀ἂν μὴ ἀκούσῃ τοῦ προφήτου ἐκείνου ἐξολεθρευθήσεται ἐκ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/023.yaml
  text: And every person who does not listen to that prophet will be utterly destroyed from among the people[a].
translation:
  language: te
  text: ఆ ప్రవక్త మాట వినని ప్రతి వ్యక్తి ప్రజల మధ్య నుండి పూర్తిగా నాశనం చేయబడతాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రజల మధ్య నుండి తొలగించబడతాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ψυχὴ
  choice: ప్రతి వ్యక్తి
  rationale: అక్షరార్థంగా ‘ప్రతి ప్రాణం’ అయినా, ఈ గ్రీకు నుడికారంలో ψυχή ఒక వ్యక్తిని సూచిస్తుంది. ‘ప్రతి వ్యక్తి’ ఆధునిక తెలుగులో సహజంగా ఉండి, అనవసరమైన ఆత్మ-శరీర ద్వైత భావాన్ని దిగుమతి చేయదు.
- source_word: ἥτις ἂν μὴ ἀκούσῃ
  choice: మాట వినని
  rationale: ఈ నిర్మాణం ‘ఎవరైతే వినరో’ అనే అనిర్దిష్ట భావాన్ని వ్యక్తం చేస్తుంది. ἀκούω ఇక్కడ కేవలం శబ్దం వినడమే కాక, ప్రవక్త చెప్పినదాన్ని ఆలకించి విధేయత చూపడాన్ని సూచించగలదు; తెలుగులో ‘మాట వినని’ ఈ స్పందనాత్మక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: τοῦ προφήτου ἐκείνου
  choice: ఆ ప్రవక్త
  rationale: మునుపటి వచనంలో చెప్పబడిన మోషే వంటి ప్రవక్తను ఇది తిరిగి సూచిస్తుంది. గ్రీకులో ఇది ప్రత్యేక బిరుదుగా గుర్తించబడలేదు కాబట్టి సాధారణ రూపమే ఉంచబడింది.
- source_word: ἐξολεθρευθήσεται
  choice: పూర్తిగా నాశనం చేయబడతాడు
  rationale: ἐξολεθρεύω సంపూర్ణ నిర్మూలన లేదా తొలగింపును సూచించే బలమైన క్రియ. ‘పూర్తిగా నాశనం చేయబడతాడు’ ఆ తీవ్రతను నిలుపుతుంది; ‘తొలగించబడతాడు’ అనే నేపథ్య నుడికారాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐκ τοῦ λαοῦ
  choice: ప్రజల మధ్య నుండి
  rationale: ἐκ అనే విభక్తి సమాజం లోపలి నుండి తొలగింపును సూచిస్తుంది. మూలంలో స్వామ్యసూచక పదం లేనందున ‘తన ప్రజల’ అని చేర్చలేదు.
theological_decisions:
- issue: ప్రవక్త మాట విననివారికి ప్రకటించిన తీర్పు స్వభావం
  choice: నాశనం మరియు ప్రజల మధ్య నుండి తొలగింపు అనే తీవ్ర హెచ్చరికను అనువదించి, దాని కాలం లేదా విధానాన్ని నిర్దిష్టం చేయలేదు.
  alternative: నిబంధన సమాజం నుండి బహిష్కరణ మాత్రమే; లేదా అంతిమ దైవ తీర్పు మాత్రమే.
  rationale: వచనం తీవ్రమైన దైవ తీర్పును ప్రకటిస్తుంది; అయితే అది తాత్కాలికమా, నిబంధన సంబంధమైనదా, అంత్యకాల సంబంధమైనదా అనేది ఇక్కడ పూర్తిగా నిర్వచించదు. కాబట్టి అనువాదం ఈ ఉద్రిక్తతను అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘మాట వినని’ అనేది కేవలం వినికిడికన్నా ఆలకించి లోబడే భావాన్ని అందిస్తుంది. ప్రధాన పాఠంలో గ్రీకు క్రియ తీవ్రతను ఉంచి, ప్రత్యామ్నాయ సమాజ-తొలగింపు నుడికారాన్ని పాదసూచికలో ఇచ్చాం.
