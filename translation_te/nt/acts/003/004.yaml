id: ACT.3.4
reference: Acts 3:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀτενίσας δὲ Πέτρος εἰς αὐτὸν σὺν τῷ Ἰωάννῃ εἶπεν· Βλέψον εἰς ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/004.yaml
  text: And Peter[a], together with John, fixed his gaze on him and said, “Look at us.”
translation:
  language: te
  text: పేతురు యోహానుతో కలిసి అతనివైపు తదేకంగా చూసి, “మమ్మల్ని చూడు” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτενίσας
  choice: తదేకంగా చూసి
  rationale: ఈ క్రియ సాధారణంగా చూడడం కంటే దృష్టిని కేంద్రీకరించి తీక్షణంగా చూడడాన్ని సూచిస్తుంది. ‘తదేకంగా చూసి’ అనేది ఆ తీవ్రతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాకుండా కథనాన్ని ముందుకు నడిపే స్వల్ప అనుసంధానంగా ఉంది. తెలుగు కథనశైలిలో ‘అప్పుడు’ సహజంగా సరిపోతుంది.
- source_word: σὺν τῷ Ἰωάννῃ
  choice: యోహానుతో కలిసి
  rationale: σύν + చతుర్థీ విభక్తి తోడుగా ఉండడాన్ని సూచిస్తుంది; ‘తో కలిసి’ పేతురు చేసిన కార్యంలో యోహాను కూడా భాగంగా ఉన్నాడనే భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: εἶπεν
  choice: అన్నాడు
  rationale: సందర్భంలో ఇది సాధారణంగా మాట్లాడడాన్ని సూచించే క్రియ. ప్రత్యక్ష వాక్యానికి ముందు ‘అన్నాడు’ సహజమైన తెలుగు ప్రయోగం.
- source_word: Βλέψον
  choice: చూడు
  rationale: ఏకవచన ఆజ్ఞారూపం నేరుగా దృష్టి పెట్టమని చెబుతుంది. ‘చూడు’ సరళమైన, సహజమైన ఆజ్ఞ.
- source_word: εἰς ἡμᾶς
  choice: మా వైపు
  rationale: చూడడాన్ని సూచించే క్రియతో εἰς దృష్టి మళ్లే లక్ష్యాన్ని తెలియజేస్తుంది. ‘మా వైపు’ తెలుగులో సహజంగా ఆ దిశానిర్దేశాన్ని నిలుపుతుంది.
- source_word: εἰς αὐτόν
  choice: అతని వైపు
  rationale: ἀτενίζωతో వచ్చిన εἰς కేంద్రీకృత దృష్టి ఎవరిపై ఉందో సూచిస్తుంది. ‘అతని వైపు’ మూలంలోని దిశాభావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
