translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గంభీరమైన కథన శైలి. మూలంలోని రెండు తీవ్ర స్పందన పదాల మధ్య భేదాన్ని ‘విస్మయం’, ‘దిగ్భ్రాంతి’తో నిలిపింది; పదశః అనవసరమైన అనుసంధానాలను తెలుగు వాక్యప్రవాహానికి అనుగుణంగా సర్దింది.
