id: ACT.3.10
reference: Acts 3:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπεγίνωσκον ⸀δὲ αὐτὸν ὅτι ⸀οὗτος ἦν ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος ἐπὶ τῇ Ὡραίᾳ Πύλῃ τοῦ ἱεροῦ, καὶ ἐπλήσθησαν θάμβους καὶ ἐκστάσεως ἐπὶ τῷ συμβεβηκότι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/010.yaml
  text: And they recognized him[a], that this was the man who used to sit for alms at the Beautiful Gate of the temple[b], and they were filled with amazement and astonishment at what had happened to him.
translation:
  language: te
  text: అతడు ఆలయపు[b] సుందర ద్వారం దగ్గర భిక్ష కోసం కూర్చుంటూ ఉండే వ్యక్తేనని[a] వారు గుర్తుపట్టారు. అతనికి జరిగినదాన్ని బట్టి వారు విస్మయంతోనూ దిగ్భ్రాంతితోనూ నిండిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత రూపానుగుణంగా, “భిక్ష కోసం కూర్చున్న వ్యక్తి.” సందర్భంలో ఇది అతడు మామూలుగా అక్కడ కూర్చుండేవాడనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పదం ἱερόν అంతరాలయాన్ని మాత్రమే కాక ఆలయ ప్రాంగణ సముదాయాన్ని సాధారణంగా సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεγίνωσκον
  choice: గుర్తుపట్టారు
  rationale: క్రియ యొక్క అసంపూర్ణ భూతకాల రూపం జనులు అతణ్ణి గుర్తించి, ఇతడే మునుపటి వ్యక్తి అని నిర్ధారించుకున్న భావాన్ని ఇస్తుంది. తెలుగు కథనంలో ‘గుర్తుపట్టారు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: δὲ
  choice: వాక్య ప్రవాహంలో ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప కథన అనుసంధానకంగా ఉంది. ముందు వాక్యంతో సహజంగా కొనసాగే తెలుగులో దాన్ని ప్రత్యేకంగా ‘మరియు’ అని పెట్టడం అవసరం లేదు.
- source_word: οὗτος ἦν
  choice: అతడు ... వ్యక్తేనని
  rationale: స్వస్థత పొందిన ఇతడే తమకు తెలిసిన యాచకుడని నొక్కిచెప్పే సూచనాత్మక భావాన్ని ‘వ్యక్తే’లోని ఏకారంతో నిలిపింది.
- source_word: ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος
  choice: భిక్ష కోసం కూర్చుంటూ ఉండే వ్యక్తి
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతం అతని మునుపటి, అలవాటైన స్థితిని వర్ణిస్తోంది. ‘కూర్చుంటూ ఉండే’ ఆ సందర్భోచిత పునరావృత భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐλεημοσύνην
  choice: భిక్ష
  rationale: ఇక్కడ పేదవానికి ఇచ్చే ధనం లేదా కానుకలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘భిక్ష’ సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: ἐπὶ τῇ Ὡραίᾳ Πύλῃ
  choice: సుందర ద్వారం దగ్గర
  rationale: Ὡραία ఇక్కడ ద్వారానికి వాడే పేరుగా ఉంది. ‘సుందర ద్వారం’ ఆ పేరును సహజంగా నిలుపుతుంది; ἐπίకి సందర్భానుసారంగా ‘దగ్గర’ సరిపోతుంది.
- source_word: τοῦ ἱεροῦ
  choice: ఆలయపు
  rationale: ἱερόν అంతరాలయాన్ని మాత్రమే కాక ఆలయ ప్రాంగణ సముదాయాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో సాధారణమైన ‘ఆలయం’ను ఉంచి, విస్తృత భావాన్ని పాదసూచికలో తెలిపింది.
- source_word: ἐπλήσθησαν
  choice: నిండిపోయారు
  rationale: భావోద్వేగాలను సూచించే షష్ఠీ విభక్తి పదాలతో వచ్చిన ఈ కర్మణి క్రియను ‘నిండిపోయారు’ సహజంగా, బలంగా వ్యక్తం చేస్తుంది.
- source_word: θάμβους
  choice: విస్మయం
  rationale: θάμβος దిగ్భ్రమ కలిగించే అబ్బురాన్ని సూచిస్తుంది. ‘విస్మయం’ తరువాతి పదంతో భేదాన్ని కొంతవరకు నిలుపుతుంది.
- source_word: ἐκστάσεως
  choice: దిగ్భ్రాంతి
  rationale: ఈ సందర్భంలో ἔκστασις ఆధ్యాత్మిక పరవశం కంటే జరిగినదానివల్ల తనను తాను మరచేంత ఆశ్చర్యస్థితిని సూచిస్తుంది. ‘దిగ్భ్రాంతి’ ఆ తీవ్రతను స్పష్టంగా ఇస్తుంది.
- source_word: ἐπὶ τῷ συμβεβηκότι αὐτῷ
  choice: అతనికి జరిగినదాన్ని బట్టి
  rationale: పరిపూర్ణ కృదంతం అప్పటికే జరిగినప్పటికీ ప్రస్తుతం ప్రభావం చూపుతున్న సంఘటనను సూచిస్తుంది. ‘జరిగినదాన్ని బట్టి’ వారి స్పందనకు కారణమైన సంఘటనను సహజంగా తెలియజేస్తుంది.
