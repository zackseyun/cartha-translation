id: ACT.3.25
reference: Acts 3:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑμεῖς ἐστε ⸀οἱ υἱοὶ τῶν προφητῶν καὶ τῆς διαθήκης ἧς ⸂διέθετο ὁ θεὸς⸃ πρὸς τοὺς πατέρας ⸀ὑμῶν, λέγων πρὸς Ἀβραάμ Καὶ ἐν τῷ σπέρματί σου ⸀ἐνευλογηθήσονται πᾶσαι αἱ πατριαὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/025.yaml
  text: You are the sons of the prophets and of the covenant that God made with your fathers[a], saying to Abraham[b], ‘And in your offspring all the families of the earth will be blessed.’
translation:
  language: te
  text: 'మీరు ప్రవక్తల వారసులూ[a], మీ పితరులతో దేవుడు చేసిన నిబంధన వారసులూ అయి ఉన్నారు. దేవుడు అబ్రాహాముతో ఇలా అన్నాడు: “నీ సంతానంలో[b] భూమిమీద ఉన్న కుటుంబాలన్నీ ఆశీర్వదించబడతాయి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘కుమారులు.’ ఇక్కడ ఈ మాట ప్రవక్తల వాగ్దాన పరంపరకు, అలాగే నిబంధన వారసత్వానికి చెందినవారిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేక, ‘విత్తనంలో.’ ‘సంతానం’ అనే మాట అబ్రాహాము వంశస్థులను సమూహంగా సూచించగలదు; బైబిలు-వేదాంత సందర్భంలో ఒక ప్రతినిధిని సూచించే భావాన్ని కూడా మోయగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: సంతానమూ / వారసులూ
  rationale: గ్రీకు పదానికి అక్షరార్థం ‘కుమారులు.’ అయితే ఇక్కడ జీవసంబంధమైన కుమారులను మాత్రమే కాక, ప్రవక్తల వాగ్దాన పరంపరకు మరియు నిబంధనకు చెందిన వారిని సూచిస్తుంది. అందువల్ల మొదటి సంబంధంలో ‘సంతానం,’ నిబంధనతో సంబంధంలో సహజమైన ‘వారసులు’ వాడాం; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: προφητῶν
  choice: ప్రవక్తల
  rationale: మూలంలోని సంబంధార్థక షష్ఠీ విభక్తిని నేరుగా నిలిపింది; ఇది ఒక్కొక్క ప్రవక్తకు జీవసంబంధమైన సంతానమనే భావం కాక, వారి వాగ్దాన పరంపరకు చెందినవారనే భావం.
- source_word: διαθήκης
  choice: నిబంధన
  rationale: అబ్రాహాము మరియు పితరుల సందర్భంలో διαθήκη దేవుడు స్థాపించిన ఒడంబడికను సూచిస్తుంది; ఆధునిక తెలుగు బైబిలు వాడుకలో ‘నిబంధన’ స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: διέθετο
  choice: చేసిన
  rationale: διαθήκηతో కలిసినప్పుడు ‘నిబంధన చేయడం/స్థాపించడం’ అనే భావం. ‘చేసిన’ సహజమైన తెలుగును ఇస్తుంది.
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: మీ పితరులతో
  rationale: నిబంధన స్థాపనలోని పరస్పర సంబంధాన్ని తెలుగులో సహజంగా తెలియజేయడానికి πρός‌ను ‘తో’గా వ్యక్తం చేశాం.
- source_word: λέγων πρὸς Ἀβραάμ
  choice: దేవుడు అబ్రాహాముతో ఇలా అన్నాడు
  rationale: గ్రీకు వర్తమాన కృదంత నిర్మాణాన్ని తెలుగులో స్పష్టమైన ప్రధాన వాక్యంగా మార్చి, మాట్లాడేవాడు దేవుడేనని సందర్భానుసారం నిలిపాం.
- source_word: σπέρματί
  choice: సంతానంలో
  rationale: ‘సంతానం’ సమూహార్థాన్నీ, ఏకవచన ప్రతినిధి భావానికి ఉన్న అవకాశాన్నీ నిలుపుతుంది. ἐν‌ను ‘లో’గా ఉంచి మూలంలోని ఉద్దేశపూర్వక విస్తృతిని పరిష్కరించకుండా వదిలాం.
- source_word: ἐνευλογηθήσονται
  choice: ఆశీర్వదించబడతాయి
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నేరుగా నిలిపింది.
- source_word: πατριαὶ
  choice: కుటుంబాలన్నీ
  rationale: πατριάకు ‘కుటుంబ సమూహాలు/వంశాలు’ అనే పరిధి ఉంది; విశ్వవ్యాప్త అబ్రాహాము వాగ్దాన సందర్భంలో ‘కుటుంబాలు’ సహజంగా, విస్తృతంగా ఉంటుంది.
- source_word: γῆς
  choice: భూమిమీద ఉన్న
  rationale: ఇక్కడ వాగ్దానం విశ్వవ్యాప్తమైనది కాబట్టి పరిమిత భూభాగాన్ని సూచించే ‘దేశం’ కంటే ‘భూమి’ తగినది.
theological_decisions:
- issue: υἱοὶలోని పుంలింగ ప్రతినిధి భాష
  choice: ప్రవక్తల సంతానమూ, నిబంధనకు వారసులూ
  alternative: ప్రవక్తల కుమారులూ, నిబంధన కుమారులూ
  rationale: అక్షరార్థమైన ‘కుమారులు’ను అసహజంగా పునరావృతం చేయకుండా, ఈ యూద నిబంధన సందర్భంలోని వారసత్వం మరియు భాగస్వామ్య భావాన్ని సహజ తెలుగులో వ్యక్తం చేశాం. మూలంలోని పుంలింగ రూపాన్ని పాదసూచికలో తెలిపాం.
- issue: σπέρμαలోని అబ్రాహాము వాగ్దాన భావవ్యాప్తి
  choice: సంతానం
  alternative: విత్తనం / సంతానుడు
  rationale: ‘సంతానం’ అబ్రాహాము వంశస్థుల సమూహార్థాన్నీ, ఒక ప్రతినిధిని సూచించగల ఏకసమూహ పద స్వభావాన్నీ బలవంతంగా విడదీయకుండా నిలుపుతుంది.
- issue: ἐν τῷ σπέρματίలో ἐν యొక్క సంబంధం
  choice: నీ సంతానంలో
  alternative: నీ సంతానం ద్వారా
  rationale: ‘ద్వారా’ అని అనువదిస్తే సాధనార్థాన్ని ఖచ్చితంగా నిర్ణయించినట్లవుతుంది. ‘లో’ మూలంలోని నిర్మాణాన్నీ దాని వ్యాఖ్యాన విస్తృతినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడాం. ‘పితరులు,’ ‘నిబంధన,’ ‘ఆశీర్వదించబడతాయి’ వంటి పదాలు బైబిలు సందర్భానికి తగిన గంభీరతను ఉంచుతాయి; అసహజమైన ‘నిబంధన కుమారులు’ అనే అక్షరానువాదాన్ని భావసమానమైన ‘నిబంధనకు వారసులు’గా ఇచ్చాం.
