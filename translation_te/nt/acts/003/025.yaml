review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the Abrahamic covenant, God as its maker, the address to Abraham, the collective yet potentially representative force of σπέρμα, the future passive blessing, and the universal scope of the earth’s families. However, ‘ప్రవక్తల సంతానం’ normally suggests biological descendants of the prophets in modern Telugu. In this context, υἱοὶ τῶν προφητῶν denotes those who inherit or stand within the prophetic legacy/promises, in parallel with being heirs of the covenant. A parallel rendering with ‘వారసులు’ is more faithful to the idiomatic force without asserting literal descent.
  naturalness: The proposed revision is natural, dignified modern standard Telugu. Repeating ‘వారసులు’ makes the coordinated Greek expression clear and avoids the slightly uneven pairing of ‘సంతానం’ with ‘వారసులు.’
  terminology: ‘నిబంధన,’ ‘పితరులు,’ ‘అబ్రాహాము,’ ‘సంతానం,’ and ‘ఆశీర్వదించబడతాయి’ are suitable and consistent biblical-register terms. The footnote on ‘సంతానం’ appropriately retains the alternative ‘విత్తనం’ and does not force either a solely collective or singular interpretation.
  issues:
  - severity: medium
    issue: ‘ప్రవక్తల సంతానం’ can be read as physical descent from prophets.
    rationale: The source expression is an idiomatic covenantal/prophetic-inheritance designation and is coordinated with ‘sons/heirs of the covenant.’ Rendering the first member as biological ‘offspring’ while rendering the second as ‘heirs’ weakens that parallel and may over-specify the first phrase.
  revised_text: 'మీరు ప్రవక్తల వారసులూ[a], మీ పితరులతో దేవుడు చేసిన నిబంధన వారసులూ అయి ఉన్నారు. దేవుడు అబ్రాహాముతో ఇలా అన్నాడు: “నీ సంతానంలో[b] భూమిమీద ఉన్న కుటుంబాలన్నీ ఆశీర్వదించబడతాయి.”'
