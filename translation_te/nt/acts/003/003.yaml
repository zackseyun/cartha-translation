- from: అతడు పేతురు, యోహాను దేవాలయ ప్రాంగణంలోకి వెళ్లబోతుండగా చూసి, తనకు భిక్ష ఇవ్వమని అడుగుతూ ఉన్నాడు.
  to: అతడు దేవాలయ ప్రాంగణంలోకి ప్రవేశించబోతున్న పేతురును, యోహానును చూసి, తనకు భిక్ష ఇవ్వమని అడుగుతూ ఉన్నాడు.
