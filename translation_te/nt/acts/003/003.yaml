id: ACT.3.3
reference: Acts 3:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς ἰδὼν Πέτρον καὶ Ἰωάννην μέλλοντας εἰσιέναι εἰς τὸ ἱερὸν ἠρώτα ἐλεημοσύνην ⸀λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/003.yaml
  text: When he saw Peter and John about to go into the temple, he began asking to receive alms.
translation:
  language: te
  text: అతడు దేవాలయ ప్రాంగణంలోకి ప్రవేశించబోతున్న పేతురును, యోహానును చూసి, తనకు భిక్ష ఇవ్వమని అడుగుతూ ఉన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς ἰδὼν
  choice: అతడు ... చూసి
  rationale: మునుపటి వచనంలోని కుంటివానినే సంబంధవాచక సర్వనామం సూచిస్తుంది. Aorist participleను తెలుగులో సహజమైన పూర్వకాలిక క్రియారూపం ‘చూసి’గా ఇచ్చాం.
- source_word: Πέτρον καὶ Ἰωάννην
  choice: పేతురు, యోహాను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాలు.
- source_word: μέλλοντας εἰσιέναι
  choice: వెళ్లబోతుండగా
  rationale: μέλλω + infinitive ఇక్కడ సమీప భవిష్యత్తును, వారు ప్రవేశించబోయే క్షణాన్ని సూచిస్తుంది.
- source_word: εἰς τὸ ἱερόν
  choice: దేవాలయ ప్రాంగణంలోకి
  rationale: ἱερόν అంతర్గత పరిశుద్ధ మందిరాన్ని మాత్రమే కాక దేవాలయ సముదాయం లేదా ప్రాంగణాన్ని సూచిస్తుంది; తెలుగులో ఈ భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టం చేశాం.
- source_word: ἠρώτα
  choice: అడుగుతూ ఉన్నాడు
  rationale: Imperfect రూపం కొనసాగుతున్న లేదా పదేపదే చేస్తున్న అభ్యర్థనను సూచిస్తుంది. ప్రారంభాన్ని ప్రత్యేకంగా చెప్పని గ్రీకును ‘అడుగుతూ ఉన్నాడు’ సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἐλεημοσύνην λαβεῖν
  choice: తనకు భిక్ష ఇవ్వమని
  rationale: ఇక్కడ ἐλεημοσύνη పేదవానికి ఇచ్చే దానాన్ని సూచిస్తుంది. గ్రీకు వాక్యార్థమైన ‘భిక్ష పొందడానికి అడగడం’ను తెలుగులో సహజంగా, గ్రహీతను స్పష్టం చేస్తూ ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘దేవాలయ ప్రాంగణం’ ద్వారా ἱερόν–ναός వ్యత్యాసాన్ని పాఠ్యంలోనే నిలిపాం; అందువల్ల ప్రత్యేక పాదసూచిక అవసరం లేదు.
