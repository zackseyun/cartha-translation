id: ACT.3.13
reference: Acts 3:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ θεὸς Ἀβραὰμ καὶ ⸂Ἰσαὰκ καὶ⸃ Ἰακώβ, ὁ θεὸς τῶν πατέρων ἡμῶν, ἐδόξασεν τὸν παῖδα αὐτοῦ Ἰησοῦν, ὃν ὑμεῖς ⸀μὲν παρεδώκατε καὶ ⸀ἠρνήσασθε κατὰ πρόσωπον Πιλάτου, κρίναντος ἐκείνου ἀπολύειν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/013.yaml
  text: The God of Abraham and Isaac and Jacob[a], the God of our fathers, has glorified his servant Jesus, whom you handed over and denied before Pilate, when he had decided to release him.
translation:
  language: te
  text: అబ్రాహాము, ఇస్సాకు, యాకోబుల దేవుడు—మన పితరుల దేవుడు—తన సేవకుడైన యేసును[a] మహిమపరిచాడు. మీరు ఆయనను అప్పగించారు; పిలాతు ఆయనను విడుదల చేయాలని నిర్ణయించినప్పుడు, అతని ఎదుటే ఆయనను నిరాకరించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన బిడ్డయైన యేసును.” గ్రీకు παῖς అనే పదానికి “బిడ్డ” లేదా “సేవకుడు” అనే అర్థాలు రావచ్చు. ఇక్కడ యెషయా గ్రంథంలోని సేవకుని భాష ప్రతిధ్వనించే అవకాశం ఉన్నందున “సేవకుడు” అని అనువదించాం.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: అబ్రాహాము, ఇస్సాకు, యాకోబుల దేవుడు
  rationale: నిబంధనాత్మక పితరుల సూత్రాన్ని నిలుపుతూ, తెలుగు భాషలో సహజంగా ముగ్గురు పేర్లను సముచ్చయంగా ఇచ్చింది.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: మన పితరుల దేవుడు
  rationale: πατέρων యొక్క పితృసంబంధమైన, నిబంధనాత్మక ప్రతిధ్వనిని ‘పితరులు’ నిలుపుతుంది; ‘పూర్వికులు’ కూడా సాధ్యమే కాని ఇక్కడ అంత నిర్దిష్టం కాదు.
- source_word: ἐδόξασεν
  choice: మహిమపరిచాడు
  rationale: δοξάζω యొక్క బలమైన ధార్మిక భావాన్ని నిలుపుతుంది. గ్రీకు ఏఒరిస్టును తెలుగు సాధారణ భూతకాలంతో సహజంగా తెలిపింది.
- source_word: τὸν παῖδα αὐτοῦ Ἰησοῦν
  choice: తన సేవకుడైన యేసును
  rationale: παῖς అనే పదానికి ‘బిడ్డ’ అనే అర్థం సాధ్యమైనా, యెషయా గ్రంథంలోని యెహోవా సేవకుని ప్రతిధ్వని కారణంగా ‘సేవకుడు’ సందర్భానికి మెరుగ్గా సరిపోతుంది.
- source_word: παρεδώκατε
  choice: మీరు ఆయనను అప్పగించారు
  rationale: అధికారుల చేతికి అప్పగించడాన్ని సహజంగా తెలియజేస్తుంది; ‘ద్రోహం చేశారు’ అని అనువదించడం మూలపదం కంటే ఎక్కువ వ్యాఖ్యానాత్మకం అవుతుంది.
- source_word: ἠρνήσασθε
  choice: ఆయనను నిరాకరించారు
  rationale: ἀρνέομαι యొక్క ప్రత్యక్ష భావాన్ని నిలుపుతూ, యేసును అంగీకరించకపోవడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: κατὰ πρόσωπον Πιλάτου
  choice: పిలాతు ఎదుటే
  rationale: ‘పిలాతు ముఖం ఎదుట’ అనే గ్రీకు నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; ‘ఏ’ బహిరంగంగా అతని సమక్షంలో జరిగినదనే భావానికి తగిన ఉద్ఘాటన ఇస్తుంది.
- source_word: κρίναντος ἐκείνου ἀπολύειν
  choice: పిలాతు ఆయనను విడుదల చేయాలని నిర్ణయించినప్పుడు
  rationale: జెనిటివ్ అబ్సల్యూట్‌ను కాలసంబంధంగా అనువదించి, κρίναντοςలోని న్యాయపరమైన నిర్ణయ భావాన్ని మరియు ἀπολύεινలోని విడుదల భావాన్ని నిలిపింది.
theological_decisions:
- issue: యేసును సూచించే παῖς పదం
  choice: సేవకుడు
  alternative: బిడ్డ
  rationale: ఈ సందర్భంలో యెషయా సేవకుని నేపథ్యం బలంగా కనిపిస్తుంది. అయినా పదంలోని నిజమైన ద్వంద్వార్థాన్ని పాదటిప్పణిలో నిలిపాం; ‘కుమారుడు’ అని అనువదించి మూలంలో లేని ప్రత్యేక పుత్రత్వ పదజాలాన్ని చేర్చలేదు.
- issue: ἐδόξασεν యొక్క కాలరూపం
  choice: మహిమపరిచాడు
  alternative: మహిమపరచి ఉన్నాడు
  rationale: గ్రీకు ఏఒరిస్టు దేవుని కార్యాన్ని సమగ్రంగా తెలియజేస్తుంది. తెలుగు సాధారణ భూతకాలం దానిని సహజంగా వ్యక్తం చేస్తుంది; కొనసాగుతున్న ఫలితాన్ని వ్యాకరణంలో బలవంతంగా చేర్చదు.
- issue: κρίναντος అనే కృదంతం యొక్క సంబంధం
  choice: నిర్ణయించినప్పుడు
  alternative: నిర్ణయించినప్పటికీ
  rationale: గ్రీకు నిర్మాణం కాలసంబంధ భావాన్ని నేరుగా అనుమతిస్తుంది; సందర్భంలో వ్యతిరేకత ఉన్నా, దానిని స్పష్టమైన concessive రూపంగా మార్చకుండా మూలంలోని స్వల్ప అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘పితరులు,’ ‘మహిమపరిచాడు,’ ‘సేవకుడు’ వంటి పదాలు బైబిలు నిబంధనాత్మక మరియు క్రీస్తుసంబంధ ప్రతిధ్వనులను నిలుపుతాయి. సర్వనామ గందరగోళం తగ్గించేందుకు చివరి ఉపవాక్యంలో పిలాతు పేరును మళ్లీ స్పష్టంగా ఇచ్చాం.
