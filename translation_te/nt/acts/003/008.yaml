  - severity: low
    issue: Redundant expression of rising in the opening clause
    rationale: The draft’s “గంతువేసి లేచి నిలబడి” has both “లేచి” and “నిలబడి” after the leap. Greek has one participle of springing/leaping and then “he stood”; removing the extra “లేచి” preserves the sequence more naturally.
