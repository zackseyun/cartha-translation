id: ACT.3.8
reference: Acts 3:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐξαλλόμενος ἔστη καὶ περιεπάτει, καὶ εἰσῆλθεν σὺν αὐτοῖς εἰς τὸ ἱερὸν περιπατῶν καὶ ἁλλόμενος καὶ αἰνῶν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/008.yaml
  text: And leaping up, he stood and began to walk, and he entered the temple with them, walking and jumping and praising God.
translation:
  language: te
  text: అతడు గంతువేసి నిలబడి నడవసాగాడు. తరువాత వారితో కలిసి దేవాలయ ప్రాంగణంలోకి వెళ్లాడు; నడుస్తూ, గంతులు వేస్తూ, దేవుణ్ణి స్తుతిస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαλλόμενος
  choice: గంతువేసి లేచి
  rationale: ἐξάλλομαι ఇక్కడ పైకి గంతువేయడం లేదా ఒక్కసారిగా ఎగిరిలేవడం అనే భావాన్ని ఇస్తుంది; స్వస్థత పొందిన వెంటనే జరిగిన ఉత్సాహభరిత కదలికను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: περιεπάτει / περιπατῶν
  choice: నడవడం మొదలుపెట్టాడు / నడుస్తూ
  rationale: మొదటి అసంపూర్ణ భూతకాల క్రియను సందర్భానుసారంగా ప్రారంభమైన, కొనసాగుతున్న చర్యగా చూపి, తరువాతి వర్తమాన కృదంతంలో సాధారణ కొనసాగింపు భావాన్ని నిలిపాం.
- source_word: τὸ ἱερόν
  choice: దేవాలయ ప్రాంగణం
  rationale: ἱερόν సాధారణంగా ఆలయ భవనం మాత్రమే కాక మొత్తం దేవాలయ పరిసరాలను సూచిస్తుంది; అందువల్ల ‘ప్రాంగణం’ సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἁλλόμενος
  choice: గంతులు వేస్తూ
  rationale: ἅλλομαι యొక్క పునరావృత, కొనసాగుతున్న గంతుల భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ముందున్న ἐξαλλόμενοςతో ఉన్న పదభేదాన్ని కూడా కొంతవరకు కాపాడుతుంది.
- source_word: αἰνῶν τὸν θεόν
  choice: దేవుణ్ణి స్తుతిస్తూ
  rationale: మూలంలోని దేవునికి ప్రశంస చెల్లించే కొనసాగుతున్న చర్యను నేరుగా, గౌరవప్రదంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే వాక్యంలోని ఉత్సాహం మరియు వరుస చర్యలు నిలిచేలా రూపొందించబడింది. ‘దేవాలయ ప్రాంగణం’ యెరూషలేము ఆలయ సముదాయాన్ని సూచించే ἱερόν పరిధిని ప్రతిబింబిస్తుంది.
