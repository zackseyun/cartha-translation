id: ACT.3.19
reference: Acts 3:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μετανοήσατε οὖν καὶ ἐπιστρέψατε ⸀πρὸς τὸ ἐξαλειφθῆναι ὑμῶν τὰς ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/019.yaml
  text: Therefore repent and turn back[a], so that your sins may be wiped away,
translation:
  language: te
  text: కాబట్టి పశ్చాత్తాపపడండి, తిరిగి రండి, తద్వారా మీ పాపాలు తుడిచివేయబడతాయి[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేక, ‘చెరిపివేయబడతాయి.’
    reason: ἐξαλείφω అనే పదంలోని చెరిపివేయడం/తొలగించడం అనే చిత్రాన్ని ప్రతిబింబించే సమీప పద ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: μετανοήσατε
  choice: పశ్చాత్తాపపడండి
  rationale: నిర్ణయాత్మకమైన నైతిక మార్పుకు పిలిచే aorist active imperative. ‘మనసు మార్చుకోండి’ కంటే పాపాన్ని గుర్తించి మారే భావాన్ని ఇది సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది; వెంట వచ్చే ἐπιστρέψατε భావాన్ని అనవసరంగా కలిపివేయదు.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాదననుంచి వచ్చే నిర్ధారణను ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: ἐπιστρέψατε
  choice: తిరిగి రండి
  rationale: తిరిగి మళ్లే దిశాభావాన్ని, active imperative బలాన్ని నిలుపుతుంది. మూలంలో స్పష్టంగా లేని ‘దేవుని వైపు’ అనే పదాలను పాఠ్యంలో చేర్చలేదు.
- source_word: πρὸς τὸ ἐξαλειφθῆναι
  choice: తుడిచివేయబడేందుకు
  rationale: πρὸς τό + infinitive లోని ఉద్దేశం/ఫలితం భావాన్ని తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది; ఖచ్చితమైన కారణ-కార్య సిద్ధాంతాన్ని అదనంగా నిర్ణయించదు.
- source_word: ἐξαλειφθῆναι
  choice: తుడిచివేయబడేందుకు
  rationale: ἐξαλείφω లోని పూర్తిగా తొలగించే చిత్రాన్ని సులభమైన ఆధునిక తెలుగులో నిలుపుతుంది. ‘చెరిపివేయబడేందుకు’ అనే సమీప ప్రత్యామ్నాయం పాదటిప్పణిలో ఇచ్చింది.
- source_word: ἁμαρτίας
  choice: పాపాలు
  rationale: బహువచన ἁμαρτίας కు నేరుగా సరిపడే, సాధారణంగా అర్థమయ్యే ప్రామాణిక పదం.
theological_decisions:
- issue: పశ్చాత్తాపం/తిరిగి రావడం మరియు పాపాల తొలగింపు మధ్య సంబంధం
  choice: ‘మీ పాపాలు తుడిచివేయబడేందుకు’ అని ఉద్దేశం/ఫలితం సంబంధాన్ని నిలిపాము.
  alternative: ‘మీ పాపాలు తుడిచివేయబడేలా’ లేదా మరింత కారణార్థకంగా ‘మీ పాపాల తొలగింపు కోసం’ అని అనువదించడం.
  rationale: వాక్యం ఆజ్ఞాపించిన స్పందనను పాపాల తొలగింపుతో అనుసంధానిస్తుంది; అయితే రక్షణ క్రమాన్ని పూర్తిగా వ్యవస్థీకరించదు. అందువల్ల మూలంలోని సంబంధాన్ని ఉంచి, ఏ ప్రత్యేక మతశాఖ సిద్ధాంతాన్నీ చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. రెండు ఆజ్ఞలను వేరుగా నిలిపి, మూలంలో లేని కర్తవ్య గమ్యాన్ని చేర్చలేదు. గ్రీకు వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివర కామాను నిలిపాము; పాదటిప్పణి గుర్తును అది వివరిస్తున్న ‘తుడిచివేయబడేందుకు’ పదం వెంట ఉంచాము.
