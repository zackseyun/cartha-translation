revisions:
- from: కాబట్టి పశ్చాత్తాపపడండి, తిరిగి రండి; మీ పాపాలు తుడిచివేయబడేందుకు[a],
  to: కాబట్టి పశ్చాత్తాపపడండి, తిరిగి రండి, తద్వారా మీ పాపాలు తుడిచివేయబడతాయి[a],
  rationale: The revision resolves the Telugu syntactic break while preserving the two coordinated imperatives and the purpose/result relation to the removal of sins. It does not specify a doctrinal mechanism or add an unstated object such as ‘to God.’
