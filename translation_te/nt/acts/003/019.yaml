review_pass:
  verdict: revise
  source_fidelity: ‘పశ్చాత్తాపపడండి’ accurately conveys μετανοήσατε, and ‘తిరిగి రండి’ appropriately preserves the active, directional force of ἐπιστρέψατε without adding an explicit object absent from the Greek. The draft’s purpose expression, however, is syntactically detached by the semicolon. Recasting it with ‘తద్వారా’ gives a clear Telugu purpose/result connection for πρὸς τὸ ἐξαλειφθῆναι while retaining the Greek ambiguity between purpose and result.
  naturalness: The semicolon before ‘మీ పాపాలు తుడిచివేయబడేందుకు’ makes the Telugu read as an incomplete, disconnected phrase. A comma and ‘తద్వారా’ form a fluent modern-standard Telugu sentence. The final comma is retained because the Greek sentence continues into the following verse.
  terminology: ‘పశ్చాత్తాపపడండి,’ ‘పాపాలు,’ and ‘తుడిచివేయబడతాయి’ are clear, standard, and suitably dignified. The footnote alternative ‘చెరిపివేయబడతాయి’ preserves the erasure/blotting image of ἐξαλείφω and now matches the revised finite construction.
  issues:
  - severity: medium
    issue: The purpose phrase is syntactically disconnected from the imperatives.
    rationale: In ‘పశ్చాత్తాపపడండి, తిరిగి రండి; మీ పాపాలు తుడిచివేయబడేందుకు,’ the -ేందుకు phrase lacks a natural governing connection after the semicolon. This obscures the intended relationship expressed by πρὸς τὸ + infinitive.
  revised_text: కాబట్టి పశ్చాత్తాపపడండి, తిరిగి రండి, తద్వారా మీ పాపాలు తుడిచివేయబడతాయి[a],
  revised_footnotes:
  - marker: a
    text: లేక, ‘చెరిపివేయబడతాయి.’
    reason: ἐξαλείφω అనే పదంలోని చెరిపివేయడం/తొలగించడం అనే చిత్రాన్ని ప్రతిబింబించే సమీప పద ప్రత్యామ్నాయం.
  revision_rationale: The revision resolves the Telugu syntactic break while preserving the two coordinated imperatives and the purpose/result relation to the removal of sins. It does not specify a doctrinal mechanism or add an unstated object such as ‘to God.’
