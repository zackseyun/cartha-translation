source:
  edition: SBLGNT
  text: ὑμεῖς δὲ τὸν ἅγιον καὶ δίκαιον ἠρνήσασθε καὶ ᾐτήσασθε ἄνδρα φονέα χαρισθῆναι ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/014.yaml
  text: But you denied the Holy and Righteous One[a], and asked for a murderer to be granted to you,
translation:
  language: te
  text: కానీ మీరైతే పరిశుద్ధుడూ నీతిమంతుడూ అయినవానిని నిరాకరించి, మీకు ఒక హంతకుణ్ణి అనుగ్రహించమని అడిగారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ సందర్భంలో మరింత స్పష్టంగా, “మీకు విడుదల చేయమని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ
  choice: కాని మీరైతే
  rationale: δέ సూచించే వ్యతిరేకతను ‘కాని’ తెలియజేస్తుంది; స్పష్టంగా వాడిన ὑμεῖς లోని నొక్కిచెప్పే భావాన్ని ‘మీరైతే’ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τὸν ἅγιον καὶ δίκαιον
  choice: పరిశుద్ధుడూ నీతిమంతుడూ అయినవాణ్ణి
  rationale: ఒకే వ్యక్తిని సూచించే substantival విశేషణ జంటను ఇది స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది; ‘అయినవాణ్ణి’ చేర్చడం వల్ల రెండు బిరుదులు ఒకే వ్యక్తికి చెందినవని తెలుస్తుంది.
- source_word: ἠρνήσασθε
  choice: నిరాకరించి
  rationale: ἀρνέομαι లోని తిరస్కరించడం, తనకు సంబంధం లేదని చెప్పడం అనే భావాలను ‘నిరాకరించు’ సందర్భానుకూలంగా మోస్తుంది.
- source_word: ᾐτήσασθε
  choice: అడిగారు
  rationale: αἰτέω యొక్క సాధారణ అర్థమైన ‘అడుగు/కోరు’ను సరళమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἄνδρα φονέα
  choice: ఒక హంతకుణ్ణి
  rationale: తెలుగులో ‘హంతకుడు’ అనే నామవాచకమే పురుష వ్యక్తిని సహజంగా సూచిస్తుంది; ‘హంతకుడైన ఒక మనిషి’ అని విడిగా అనువదించడం అనవసరంగా భారంగా ఉంటుంది.
- source_word: χαρισθῆναι ὑμῖν
  choice: మీకు అనుగ్రహించమని
  rationale: χαρίζομαι లోని అనుగ్రహంగా ఇవ్వడం లేదా మంజూరు చేయడం అనే విస్తృత భావాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది. న్యాయసంబంధ సందర్భంలో ఉద్దేశించిన ‘విడుదల చేయడం’ అనే స్పష్టమైన భావాన్ని పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: ‘పరిశుద్ధుడూ నీతిమంతుడూ అయినవాడు’ అనే పదబంధపు క్రీస్తుసంబంధ బిరుదు భావం
  choice: రెండు లక్షణాలూ ఒకే వ్యక్తిని సూచించే బిరుదుసదృశ వర్ణనగా అనువదించడం
  alternative: సాధారణ వర్ణనాత్మక విశేషణాలుగా మాత్రమే చదవడం
  rationale: ఒకే article కింద ఉన్న substantival విశేషణాలు యేసును ప్రత్యేకంగా గుర్తిస్తున్నాయి. తెలుగు రూపం అదనపు సిద్ధాంతార్థం చేర్చకుండా ఆ గుర్తింపు బలాన్ని నిలుపుతుంది.
- issue: χαρισθῆναι యొక్క న్యాయసంబంధ భావం
  choice: ప్రధాన పాఠ్యంలో ‘మీకు అనుగ్రహించమని’
  alternative: ‘మీ కోసం విడుదల చేయమని’
  rationale: క్రియ స్వయంగా ‘అనుగ్రహంగా ఇవ్వడం/మంజూరు చేయడం’ అనే విస్తృత భావం కలిగి ఉంది; బరబ్బాను విడుదల చేసిన సందర్భం దానిని ‘విడుదల’గా నిర్దిష్టం చేస్తుంది. అందువల్ల మూలానికి దగ్గరైన రూపాన్ని ప్రధాన పాఠ్యంలో, సందర్భాన్ని స్పష్టం చేసే రూపాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘మీరైతే’ ప్రత్యక్ష ఆరోపణలోని నొక్కును, ‘పరిశుద్ధుడూ నీతిమంతుడూ అయినవాణ్ణి’ ఒకే వ్యక్తిని సూచించే బిరుదుసదృశ నిర్మాణాన్ని నిలుపుతాయి.
