revisions:
- from: అతడు పేతురును యోహానును గట్టిగా పట్టుకొని ఉండగా[a], ప్రజలంతా విస్తుపోయి, సొలొమోనుదని పిలిచే మంటపం[b] దగ్గర ఉన్న వారి వద్దకు పరుగెత్తుకుంటూ వచ్చారు.
