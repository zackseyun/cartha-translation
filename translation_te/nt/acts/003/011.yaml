translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించింది. గ్రీకు వాక్యంలోని సమకాలిక చర్య, ప్రజల సమష్టి కదలిక, తీవ్రమైన ఆశ్చర్యం నిలుపబడ్డాయి. రెండు పాదటిప్పణి సూచికలూ ప్రధాన పాఠ్యంలో సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
