source:
  edition: SBLGNT
  text: Κρατοῦντος δὲ ⸀αὐτοῦ τὸν Πέτρον καὶ ⸀τὸν Ἰωάννην συνέδραμεν ⸂πᾶς ὁ λαὸς πρὸς αὐτοὺς⸃ ἐπὶ τῇ στοᾷ τῇ καλουμένῃ Σολομῶντος ἔκθαμβοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/011.yaml
  text: While he was holding on to Peter and John[a], all the people, utterly astonished[b], ran together to them at the portico called Solomon’s.
translation:
  language: te
  text: అతడు పేతురును యోహానును గట్టిగా పట్టుకొని ఉండగా[a], ప్రజలంతా విస్తుపోయి, సొలొమోను మంటపం[b] వద్ద ఉన్న వారి దగ్గరకు పరుగెత్తుకుంటూ వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు పేతురును యోహానును అంటిపెట్టుకొని ఉండగా.” గ్రీకు క్రియ గట్టిగా పట్టుకోవడం లేదా అంటిపెట్టుకొని ఉండడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: “మంటపం” అంటే ఆలయ ఆవరణలో కప్పుతో, స్తంభాల వరుసతో ఉన్న నడవ. సంప్రదాయంగా దీనిని సొలొమోను మంటపం అని పిలిచేవారు.
    reason: cultural_note
lexical_decisions:
- source_word: Κρατοῦντος δὲ αὐτοῦ
  choice: అతడు ... గట్టిగా పట్టుకొని ఉండగా
  rationale: వర్తమాన కృదంతంతో కూడిన genitive absolute, ప్రధాన క్రియతో సమకాలంలో జరుగుతున్న చర్యను సూచిస్తుంది. κρατέω ఇక్కడ గట్టిగా పట్టుకోవడం లేదా పట్టుకొని ఉండడం అనే భావాన్ని ఇస్తుంది; ఉద్దేశాన్ని లేదా భావోద్వేగాన్ని అధికంగా ఊహించకుండా శారీరక పట్టును వ్యక్తం చేయడానికి ఈ రూపం సహజంగా ఉంది.
- source_word: τὸν Πέτρον καὶ τὸν Ἰωάννην
  choice: పేతురును యోహానును
  rationale: వ్యక్తుల పేర్లకు ప్రామాణిక తెలుగు బైబిలు లిప్యంతరీకరణను అనుసరించింది; గ్రీకు కర్మవిభక్తి సంబంధాన్ని తెలుగు ద్వితీయా విభక్తితో తెలిపింది.
- source_word: συνέδραμεν
  choice: పరుగెత్తుకుంటూ వచ్చారు
  rationale: συντρέχω వేగంగా పరుగెత్తి ఒకచోట చేరడాన్ని సూచిస్తుంది. తెలుగు బహువచన సమష్టి కర్తకు అనుగుణంగా, గమ్యస్థానం వైపు త్వరగా చేరిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πᾶς ὁ λαὸς
  choice: ప్రజలంతా
  rationale: λαός ను సందర్భానుసారంగా ‘ప్రజలు’గా ఉంచి, πᾶς యొక్క సమగ్రతను ‘అంతా’తో వ్యక్తం చేసింది; ‘గుంపు’ అని సంకుచితం చేయలేదు.
- source_word: πρὸς αὐτούς
  choice: వారి వద్దకు
  rationale: πρός + accusative వ్యక్తుల వైపు కదలికను సూచిస్తుంది. ‘వారి వద్దకు’ తెలుగు వాక్యంలో గమ్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐπὶ τῇ στοᾷ
  choice: మంటపం దగ్గర
  rationale: στοά అనేది కప్పుతో కూడిన స్తంభాల మంటపం. సాధారణ పాఠకులకు అర్థమయ్యే ‘మంటపం’ను వాడి, నిర్మాణ వివరాన్ని పాదటిప్పణిలో ఇచ్చింది. ἐπί యొక్క స్థానిక భావాన్ని ‘దగ్గర’తో తెలిపింది.
- source_word: τῇ καλουμένῃ Σολομῶντος
  choice: సొలొమోనుదని పిలిచే
  rationale: καλουμένῃ యొక్క ‘అని పిలువబడే’ భావాన్ని సహజమైన క్రియారూపంలో తెలిపింది. Σολομῶντος అనే సంబంధవాచక స్థలనామాన్ని ‘సొలొమోనుదని’గా వ్యక్తం చేసింది.
- source_word: ἔκθαμβοι
  choice: విస్తుపోయి
  rationale: ἔκθαμβος బలమైన ఆశ్చర్యం, దిగ్భ్రాంతితో కూడిన విస్మయాన్ని సూచిస్తుంది. ‘విస్తుపోయి’ ఆ తీవ్రతను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
