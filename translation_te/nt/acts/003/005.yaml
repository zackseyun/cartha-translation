  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘దానం’ లేదా ‘భిక్ష’ అని మూలంలో లేని వివరాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు; ἐπεῖχεν లోని శ్రద్ధ/దృష్టి భావ వైవిధ్యాన్ని పాదసూచికలో నిలిపాం.
