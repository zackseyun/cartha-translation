lexical_decisions:
- source_word: ὁ δὲ
  choice: అప్పుడు అతడు
  rationale: δέ కథనాన్ని ముందుకు నడిపించే మృదువైన అనుసంధానం; ఇక్కడ సహజమైన తెలుగు కథన ప్రవాహానికి ‘అప్పుడు’ సరిపోతుంది. ‘అతడు’ కుంటివానిని సూచిస్తుంది.
- source_word: ἐπεῖχεν
  choice: శ్రద్ధగా చూశాడు
  rationale: ఈ సందర్భంలో ἐπέχω వారి మీద తన దృష్టిని, శ్రద్ధను నిలపడం అనే భావాన్ని ఇస్తుంది. అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న శ్రద్ధను సహజమైన తెలుగులో ఈ ప్రయోగం తెలియజేస్తుంది.
- source_word: αὐτοῖς
  choice: వారివైపు
  rationale: ఇది పేతురు, యోహానులను సూచిస్తుంది; ‘శ్రద్ధగా చూశాడు’ అనే తెలుగు ప్రయోగంతో ‘వారివైపు’ సహజంగా సరిపోతుంది.
- source_word: προσδοκῶν
  choice: ఆశిస్తూ
  rationale: వారి నుంచి ఏదో లభిస్తుందనే నిరీక్షణతో కూడిన ఎదురుచూపును సూచిస్తుంది.
- source_word: τι
  choice: ఏదైనా
  rationale: ఏమి లభిస్తుందో నిర్దిష్టంగా చెప్పని అనిర్దిష్ట వస్తువును సూచిస్తుంది; సందర్భంలో అది దానం కావచ్చని తెలుస్తున్నా మూలపాఠం దానిని స్పష్టంగా పేర్కొనదు.
- source_word: παρ’ αὐτῶν
  choice: వారి దగ్గర నుంచి
  rationale: παρά షష్ఠీ విభక్తితో మూలాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వారి దగ్గర నుంచి’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: λαβεῖν
  choice: దొరుకుతుందని
  rationale: ఇక్కడ పొందబోయే దానిని స్వీకరించడం అనే భావం ఉంది. ‘దొరుకుతుందని’ భిక్ష ఆశిస్తున్న సందర్భంలో సహజంగా ఉన్నప్పటికీ, క్రియాశీలంగా ‘తీసుకోవడం’ అనే అపార్థాన్ని నివారిస్తుంది.
