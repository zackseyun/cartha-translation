- from: అప్పుడు అతడు, వారి దగ్గర నుంచి ఏదైనా దొరుకుతుందని ఆశిస్తూ, వారివైపు శ్రద్ధగా చూశాడు.[a]
  to: అతడు వారివైపు దృష్టి నిలిపాడు,[a] వారి నుండి ఏదైనా పొందుతానని ఎదురుచూస్తూ.
