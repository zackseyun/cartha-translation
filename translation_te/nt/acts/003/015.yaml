source:
  edition: SBLGNT
  text: τὸν δὲ ἀρχηγὸν τῆς ζωῆς ἀπεκτείνατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, οὗ ἡμεῖς μάρτυρές ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/015.yaml
  text: but you killed the Author of life[a], whom God raised from the dead[b], of which we are witnesses.
translation:
  language: te
  text: కానీ జీవానికి మూలకర్తను మీరు చంపారు[a]; దేవుడు ఆయనను మృతులలోనుండి లేపాడు, దీనికి మేము సాక్షులం[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “జీవాధిపతిని,” “జీవనాయకుణ్ణి,” లేదా “జీవానికి ఆదికర్తను.” గ్రీకు పదం మూలం, ఆరంభం, నాయకత్వం లేదా అగ్రస్థానం అనే భావాలను వ్యక్తం చేయగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఆయన గురించి మేము సాక్షులం.” గ్రీకు పదబంధం లేపబడిన ఆయననో, ఆయన పునరుత్థాన ఘటననో సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: కానీ
  rationale: మునుపటి వాక్యంలోని విరుద్ధతను కొనసాగిస్తూ, జీవాన్ని ప్రసాదించేవానిని చంపారనే వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀρχηγὸν τῆς ζωῆς
  choice: జీవానికి మూలకర్తను
  rationale: ἀρχηγόςలో మూలం, ఆరంభం, నాయకత్వం అనే భావాలు ఉన్నాయి. ఈ సందర్భంలో జీవానికి మూలమైనవానిని చంపారనే ఉద్దేశపూర్వక విరోధాభాసాన్ని ‘మూలకర్త’ స్పష్టంగా అందిస్తుంది; ఇతర భావాలను పాదసూచికలో ఉంచాం.
- source_word: ἀπεκτείνατε
  choice: మీరు చంపారు
  rationale: క్రియలోని ప్రత్యక్ష ఆరోపణను అదనపు న్యాయపరమైన భావం చేర్చకుండా సరళంగా నిలుపుతుంది.
- source_word: ἤγειρεν ἐκ νεκρῶν
  choice: మృతుల్లోనుండి లేపాడు
  rationale: ἐκ νεκρῶνలోని బహువచన భావాన్ని నిలుపుతూ పునరుత్థాన ప్రకటనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: οὗ ἡμεῖς μάρτυρές ἐσμεν
  choice: దీనికి మేము సాక్షులం
  rationale: సమీపంలోని పునరుత్థాన ఘటనను సూచించే పఠనాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; సంబంధసర్వనామం లేపబడిన వ్యక్తినీ సూచించగల అస్పష్టతను పాదసూచికలో సంరక్షించాం.
theological_decisions:
- issue: క్రీస్తుకు వర్తించిన ἀρχηγός అనే బిరుదు
  choice: జీవానికి మూలకర్త
  alternative: జీవాధిపతి; జీవనాయకుడు; జీవానికి ఆదికర్త
  rationale: ఈ పదం ఆరంభకుడు, నాయకుడు, అగ్రగామి వంటి భావాలను మోస్తుంది. సందర్భంలోని జీవం–మరణం విరోధాభాసాన్ని ‘మూలకర్త’ స్పష్టంగా చూపుతుండగా, పదార్థ పరిధిని ఒక్క భావానికే పరిమితం చేయకుండా ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
- issue: οὗ యొక్క సూచితం
  choice: పునరుత్థాన ఘటన—‘దీనికి మేము సాక్షులం’
  alternative: లేపబడిన వ్యక్తి—‘ఆయనకు మేము సాక్షులం’
  rationale: గ్రీకు నిర్మాణం లేపబడిన ఆయననో, ఆయన పునరుత్థాన వాస్తవాన్నో సూచించగలదు. ప్రధాన పాఠంలో సందర్భానికి సహజమైన ఘటనార్థాన్ని ఎంచుకొని, నిజమైన అస్పష్టతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రత్యక్షమైన, గౌరవప్రదమైన ప్రకటన. ‘మూలకర్త’ సాధారణ పాఠకునికి అర్థమయ్యేలా ఉండి బిరుదు యొక్క గంభీరతను నిలుపుతుంది. గ్రీకు వాక్యప్రవాహాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా ఇచ్చాం; భావసంబంధాన్ని అర్ధవిరామంతో కొనసాగించాం.
