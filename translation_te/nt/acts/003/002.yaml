translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. మొదటి అసంపూర్ణ క్రియను జరుగుతున్న దృశ్యంగా, రెండవదాన్ని ‘ప్రతిరోజూ’తో కూడిన అలవాటు చర్యగా వేరు చేసి అనువదించాం. మూలంలోని ఒకే దీర్ఘ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం.
