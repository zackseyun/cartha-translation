id: ACT.3.2
reference: Acts 3:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καί τις ἀνὴρ χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ ὑπάρχων ἐβαστάζετο, ὃν ἐτίθουν καθ’ ἡμέραν πρὸς τὴν θύραν τοῦ ἱεροῦ τὴν λεγομένην Ὡραίαν τοῦ αἰτεῖν ἐλεημοσύνην παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/002.yaml
  text: And a certain man[a], lame from his mother’s womb, was being carried, whom they would place every day at the gate of the temple called Beautiful, to ask for alms from those entering into the temple[c][b],
translation:
  language: te
  text: తన తల్లి గర్భం నుంచే[a] కుంటివాడిగా ఉన్న ఒక మనిషిని మోసుకొని వచ్చేవారు. దేవాలయంలోకి[b] ప్రవేశించేవారి వద్ద భిక్ష అడగడానికి, అతణ్ణి ప్రతిరోజూ ‘సుందరం’ అని పిలువబడే దేవాలయ ద్వారం వద్ద ఉంచేవారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పుట్టుకతోనే.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ వాడిన గ్రీకు పదం ἱερόν దేవాలయపు అంతర్గత పరిశుద్ధ స్థలాన్ని మాత్రమే కాకుండా మొత్తం దేవాలయ సముదాయాన్ని లేదా ప్రాంగణాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: ద్వారం పేరుకు అక్షరార్థం ‘సుందరము.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τις ἀνὴρ
  choice: ఒక మనిషి
  rationale: τις ఒక నిర్దిష్టమైనప్పటికీ ఇంకా పేరు చెప్పని వ్యక్తిని పరిచయం చేస్తుంది; ἀνήρ అతడు పురుషుడని సూచిస్తుంది. ‘ఒక మనిషి’ ఆధునిక తెలుగులో సహజంగా ఈ రెండింటినీ తెలియజేస్తుంది.
- source_word: χωλὸς
  choice: కుంటివాడిగా
  rationale: నడకకు సంబంధించిన శారీరక వైకల్యాన్ని నేరుగా తెలియజేస్తుంది; మూలపదం చెప్పినదానికంటే ఎక్కువ వైద్యవివరాన్ని జోడించదు.
- source_word: ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: తన తల్లి గర్భం నుంచే
  rationale: మూలంలోని గర్భం అనే దృశ్యరూపాన్ని నిలుపుతూ, ఆ స్థితి పుట్టుక నుంచే ఉందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐβαστάζετο
  choice: కొందరు మోసుకొస్తున్నారు
  rationale: తెలుగులో కర్మణి ప్రయోగంకన్నా అనిర్దిష్ట కర్తతో కూడిన కర్తరి ప్రయోగం సహజం. అసంపూర్ణ భూతకాల రూపం కథలో జరుగుతున్న చర్యను సూచించేందుకే వర్తమాన కథనశైలిలో ‘మోసుకొస్తున్నారు’ అని ఇచ్చాం.
- source_word: ἐτίθουν καθ’ ἡμέραν
  choice: వారు అతణ్ణి ప్రతిరోజూ … ఉంచేవారు
  rationale: అసంపూర్ణ భూతకాలం మరియు ‘ప్రతిరోజూ’ కలిసి సూచించే అలవాటైన, పునరావృత చర్యను ‘ఉంచేవారు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: θύραν τοῦ ἱεροῦ
  choice: దేవాలయ ద్వారం
  rationale: ఈ ప్రజా నిర్మాణ సందర్భంలో θύραకు ‘ద్వారం’ సహజం. ἱερόν మొత్తం దేవాలయ ప్రాంగణాన్ని సూచించగలదనే భేదాన్ని పాదసూచికలో తెలిపాం.
- source_word: τὴν λεγομένην Ὡραίαν
  choice: ‘సుందరము’ అని పిలిచే
  rationale: Ὡραίαν ద్వారానికి వాడిన పేరుగా పనిచేస్తుంది. దాని అక్షరార్థాన్ని పేరు రూపంలో నిలిపాం.
- source_word: τοῦ αἰτεῖν ἐλεημοσύνην
  choice: భిక్ష అడగడానికి
  rationale: ఆర్టిక్యులర్ ఇన్ఫినిటివ్ తెలిపే ఉద్దేశాన్ని ‘అడగడానికి’ స్పష్టంగా అందిస్తుంది; అవసరంలో ఉన్నవారికి ఇచ్చే దానాన్ని ఈ సందర్భంలో ‘భిక్ష’ సహజంగా సూచిస్తుంది.
- source_word: παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν
  choice: దేవాలయంలోకి ప్రవేశించేవారి దగ్గర
  rationale: లోపలికి వెళ్తున్న ప్రజల నుండి అడగడం అనే భావాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
