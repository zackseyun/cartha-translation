revisions:
- from: 'అయితే పేతురు, “వెండీ బంగారమూ నా దగ్గర లేవు; కానీ నా దగ్గర ఉన్నదే నీకు ఇస్తున్నాను: నజరేయుడైన యేసు మెస్సీయ[a] పేరున, నడువు” అన్నాడు.[b]'
  to: 'అయితే పేతురు, “వెండీ బంగారమూ నా దగ్గర లేవు; కానీ నా దగ్గర ఉన్నది నీకు ఇస్తున్నాను: నజరేయుడైన యేసు మెస్సీయ[a] పేరున, నడువు.”[b] అన్నాడు.'
  rationale: A small stylistic revision improves natural Telugu and avoids adding a restrictive nuance. The title ‘మెస్సీయ,’ the designation ‘నజరేయుడైన,’ and the textual-variant footnote are retained. The variant marker is placed directly after the quoted command, the part of the verse to which the note pertains.
