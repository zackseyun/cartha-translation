id: ACT.3.6
reference: Acts 3:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ Πέτρος· Ἀργύριον καὶ χρυσίον οὐχ ὑπάρχει μοι, ὃ δὲ ἔχω τοῦτό σοι δίδωμι· ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου ⸀περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/006.yaml
  text: 'But Peter said[a], “Silver and gold I do not have, but what I do have, this I give to you: in the name of Jesus the Messiah the Nazarene[b], walk.”'
translation:
  language: te
  text: 'అయితే పేతురు, “వెండీ బంగారమూ నా దగ్గర లేవు; కానీ నా దగ్గర ఉన్నది నీకు ఇస్తున్నాను: నజరేయుడైన యేసు మెస్సీయ[a] పేరున, నడువు.”[b] అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యేసు క్రీస్తు.” గ్రీకు Χριστός అనే బిరుదు అర్థాన్ని నిలుపడానికి ఇక్కడ “మెస్సీయ” అని అనువదించాం.
    reason: alternative_reading
  - marker: b
    text: కొన్ని ప్రాచీన ప్రతుల్లో “లేచి నడువు” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀργύριον καὶ χρυσίον
  choice: వెండీ బంగారమూ
  rationale: మూలంలో పేర్కొన్న రెండు లోహాలనూ అలాగే ఉంచి, ధనసంపదను సూచించే జంటప్రయోగాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: οὐχ ὑπάρχει μοι
  choice: నా దగ్గర లేవు
  rationale: స్వాధీనాన్ని తెలిపే గ్రీకు ప్రయోగానికి ఇది సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ὃ δὲ ἔχω τοῦτό σοι δίδωμι
  choice: కానీ నా దగ్గర ఉన్నదే నీకు ఇస్తున్నాను
  rationale: లేనిదానికీ ఉన్నదానికీ మధ్యనున్న వ్యత్యాసాన్ని, τοῦτο లోని ఉద్ఘాటనను ‘ఉన్నదే’ ద్వారా నిలుపుతుంది.
- source_word: ἐν τῷ ὀνόματι
  choice: పేరున
  rationale: అధికారం లేదా ప్రతినిధిత్వ భావాన్ని ముందే విప్పి చెప్పకుండా, గ్రీకు నామప్రయోగపు ధార్మిక ప్రతిధ్వనిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తున్నందున దాని అర్థాన్ని తెలిపే ‘మెస్సీయ’ను ఉపయోగించాం; సంప్రదాయ ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: τοῦ Ναζωραίου
  choice: నజరేయుడైన
  rationale: ‘నజరేతువాడు’ అని భౌగోళిక అర్థానికే పరిమితం చేయకుండా, గ్రీకులోని విశేషణాత్మక/బిరుదు స్వరూపాన్ని నిలుపుతుంది.
- source_word: περιπάτει
  choice: నడువు
  rationale: వర్తమాన ఆజ్ఞార్థక క్రియను అదనపు వ్యాఖ్యానం లేకుండా నేరుగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: Χριστοῦ అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: స్వస్థపరిచే ఈ ప్రకటనలో Χριστός బిరుదు భావం స్పష్టంగా ఉంది. అందువల్ల దాని అర్థాన్ని అనువదించాం; సుపరిచితమైన ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో ఉంచాం.
- issue: ἐν τῷ ὀνόματι లోని భావం
  choice: పేరున
  alternative: అధికారంతో
  rationale: ఈ పదబంధంలో అధికారం అంతర్లీనంగా ఉండవచ్చు; అయితే దానిని ఒక్క భావానికి కుదించకుండా మూలంలోని ఉద్దేశపూర్వక విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనా సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం వాడాం. ‘వెండీ బంగారమూ’ అనే జంటను, ‘పేరున’ అనే సంక్షిప్త నామప్రయోగాన్ని నిలిపాం. SBLGNT ప్రధాన పాఠంలో περιπάτει మాత్రమే ఉన్నందున ‘నడువు’ను ప్రధాన పాఠంగా తీసుకుని, లేచి నడవమనే విస్తృత పాఠభేదాన్ని పాదసూచికలో తెలిపాం.
