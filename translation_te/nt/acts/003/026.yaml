source:
  edition: SBLGNT
  text: ὑμῖν πρῶτον ⸂ἀναστήσας ὁ θεὸς⸃ τὸν παῖδα ⸀αὐτοῦ ἀπέστειλεν αὐτὸν εὐλογοῦντα ὑμᾶς ἐν τῷ ἀποστρέφειν ἕκαστον ἀπὸ τῶν πονηριῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/026.yaml
  text: To you first[a], God, having raised up his servant[b], sent him to bless you by turning each of you from your wicked ways.
translation:
  language: te
  text: మొదట మీ కోసం దేవుడు తన సేవకుణ్ణి[a] లేపి[b], మీలో ప్రతి ఒక్కరినీ మీ దుష్ట మార్గాల నుండి తిప్పడం ద్వారా మిమ్మల్ని ఆశీర్వదించడానికి ఆయనను పంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన బిడ్డను’; గ్రీకు παῖς అనే పదానికి ‘సేవకుడు’ లేదా ‘బిడ్డ’ అనే అర్థాలు ఉన్నాయి. అయితే ఇక్కడ యెషయా గ్రంథంలోని సేవకుని నేపథ్యం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘లేపి’ అనేది చనిపోయినవారిలోనుండి లేపడాన్ని సూచించవచ్చు; లేదా దేవుడు తన సేవకుణ్ణి ఉద్భవింపజేయడం లేదా నియమించడం అనే అర్థం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμῖν πρῶτον
  choice: మొదట మీ కోసమే
  rationale: యూదులైన శ్రోతలకు ఇచ్చిన ప్రాధాన్యాన్ని, దత్తివిభక్తిలోని ప్రయోజన/దిశ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀναστήσας
  choice: లేపి
  rationale: చనిపోయినవారిలోనుండి లేపడం లేదా ఒక సేవకుణ్ణి ఉద్భవింపజేయడం/నియమించడం అనే గ్రీకు పదంలోని సాధ్యమైన ద్వంద్వార్థాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: τὸν παῖδα αὐτοῦ
  choice: తన సేవకుణ్ణి
  rationale: παῖς అనే పదానికి ‘బిడ్డ’ అనే అర్థం సాధ్యమైనప్పటికీ, ఇక్కడ యెషయా గ్రంథంలోని సేవకుని నేపథ్యాన్ని ‘సేవకుడు’ మెరుగ్గా ప్రతిబింబిస్తుంది; ‘కుమారుడు’ అనడం మూలంలో ఉన్నదానికంటే ఎక్కువ నిర్దిష్టతను చేర్చుతుంది.
- source_word: ἀπέστειλεν
  choice: పంపాడు
  rationale: అతిగా వ్యాఖ్యానించకుండా పంపబడిన కార్యాన్ని సూటిగా వ్యక్తపరుస్తుంది.
- source_word: εὐλογοῦντα ὑμᾶς
  choice: మిమ్మల్ని ఆశీర్వదించడానికి
  rationale: పంపడంలో ఉన్న ఉద్దేశం లేదా ఫలితాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν τῷ ἀποστρέφειν
  choice: తిప్పడం ద్వారా
  rationale: ఆశీర్వాదం ఏ విధంగా కలుగుతుందో తెలిపే సాధనార్థక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἕκαστον
  choice: మీలో ప్రతి ఒక్కరినీ
  rationale: పదంలోని పంపిణీ భావాన్ని, అది సంబోధితులలో ఒక్కొక్కరికి వర్తిస్తుందనే విషయాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀπὸ τῶν πονηριῶν ὑμῶν
  choice: మీ దుష్ట మార్గాల నుండి
  rationale: బహువచన రూపంలోని చెడు ప్రవర్తనల విస్తృత భావాన్ని తెలుగులో సహజంగా, నైతిక బరువుతో తెలియజేస్తుంది.
theological_decisions:
- issue: యేసును గురించి ἀναστήσας పదం సూచించే భావం
  choice: ప్రధాన పాఠ్యంలో ‘లేపి’ అని ఉంచి, అది పునరుత్థానాన్నా లేక సేవకుణ్ణి ఉద్భవింపజేయడం/నియమించడాన్నా సూచిస్తుందో నిర్ధారించలేదు.
  alternative: ‘చనిపోయినవారిలోనుండి లేపి’ లేదా ‘ఉద్భవింపజేసి/నియమించి’
  rationale: గ్రీకు పదం పునరుత్థాన భావాన్ని అనుమతిస్తుంది; అదే సమయంలో ప్రవక్తను లేదా సేవకుణ్ణి దేవుడు లేపుతాడనే వాగ్దానాన్ని కూడా ప్రతిధ్వనింపజేయవచ్చు. కాబట్టి వ్యాఖ్యానపరమైన ఉద్రిక్తతను పరిష్కరించకుండా నిలిపాం.
- issue: παῖς పదంలోని క్రీస్తుసంబంధమైన భావఛాయ
  choice: ‘సేవకుడు’
  alternative: ‘బిడ్డ’ లేదా ‘కుమారుడు’
  rationale: ‘సేవకుడు’ యెషయా సేవకుని నేపథ్యాన్ని కాపాడుతుంది. ‘బిడ్డ’ పదార్థపరంగా సాధ్యమే; ‘కుమారుడు’ అయితే ఈ వచనంలోని గ్రీకు పదం కంటే స్పష్టమైన పుత్రత్వ వ్యాఖ్యానాన్ని చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘మొదట మీ కోసమే’ ప్రాధాన్యాన్ని సహజంగా చూపిస్తుంది; ‘దుష్ట మార్గాలు’ విస్తృత ప్రవర్తనా భావాన్ని నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
