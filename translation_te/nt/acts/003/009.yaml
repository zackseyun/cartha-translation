  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶδεν ⸂πᾶς ὁ λαὸς αὐτὸν⸃ περιπατοῦντα καὶ αἰνοῦντα τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/009.yaml
  text: And all the people saw him walking and praising God,
translation:
  language: te
  text: ప్రజలందరూ నడుస్తూ దేవుణ్ణి స్తుతిస్తున్న అతనిని చూశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: (తెలుగులో ప్రత్యేకంగా అనువదించలేదు)
  rationale: మునుపటి వాక్యంతో ఉన్న సాధారణ అనుసంధానం తెలుగులో వాక్యప్రవాహం ద్వారా సహజంగా వ్యక్తమవుతుంది; ‘మరియు’ అని ప్రారంభించడం కృత్రిమంగా ఉంటుంది.
- source_word: εἶδεν
  choice: చూశారు
  rationale: ప్రజలు స్వస్థత పొందిన వ్యక్తి చేస్తున్న కార్యాలను ప్రత్యక్షంగా గమనించారని సూటిగా తెలియజేస్తుంది. ‘ప్రజలందరూ’ అనే గౌరవ/బహువచన కర్తకు అనుగుణంగా బహువచన క్రియ వాడబడింది.
- source_word: πᾶς ὁ λαὸς
  choice: ప్రజలందరూ
  rationale: ఒక సమూహంగా అక్కడి ప్రజలందరినీ సూచించే గ్రీకు సమష్టి భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: αὐτὸν
  choice: అతడు
  rationale: మునుపటి సందర్భంలోని స్వస్థత పొందిన వ్యక్తినే సూచిస్తుంది. గ్రీకులో ఇది ప్రధాన క్రియకు కర్మ అయినప్పటికీ, తెలుగు అనుబంధ క్రియా నిర్మాణంలో ‘అతడు … చేయడం’ అని కర్తరూపం సహజం.
- source_word: περιπατοῦντα
  choice: నడుస్తూ
  rationale: అతడు నిజంగా నడుస్తున్నాడనే స్వస్థతకు కీలకమైన కనిపించే కార్యాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: καὶ αἰνοῦντα
  choice: స్తుతించడం
  rationale: దేవుని పట్ల ఆరాధనతో కూడిన ప్రశంసను సూచిస్తుంది. ‘నడుస్తూ … స్తుతించడం’ అనే నిర్మాణం రెండు సమకాలిక కార్యాలను సహజంగా కలుపుతుంది.
- source_word: τὸν θεόν
  choice: దేవుణ్ణి
  rationale: స్తుతికి నిర్దిష్ట కర్మగా ఉన్న దేవునిని సాధారణ ఆధునిక తెలుగు కర్మరూపంలో వ్యక్తం చేస్తుంది.
