translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని రెండు ప్రత్యక్ష కార్యాలు—నడవడం, దేవుణ్ణి స్తుతించడం—స్పష్టంగా నిలుపబడ్డాయి.
