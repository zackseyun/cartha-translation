id: ACT.3.18
reference: Acts 3:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ἃ προκατήγγειλεν διὰ στόματος πάντων τῶν ⸀προφητῶν παθεῖν τὸν χριστὸν ⸀αὐτοῦ ἐπλήρωσεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/018.yaml
  text: But God thus fulfilled what he had announced beforehand through the mouth of all the prophets[b][a], that his Messiah would suffer.
translation:
  language: te
  text: అయితే దేవుడు తన మెస్సీయ[b] బాధపడతాడని ప్రవక్తలందరి నోటి ద్వారా[a] ముందుగానే ప్రకటించిన దానిని ఈ విధంగా నెరవేర్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రవక్తలందరి ద్వారా’ అని కూడా అనువదించవచ్చు. గ్రీకు మూలంలో మరింత అక్షరార్థంగా ‘ప్రవక్తలందరి నోటి ద్వారా’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ‘తన క్రీస్తు’; Χριστός ఇక్కడ బిరుదుగా ఉన్నందున ‘తన మెస్సీయ’ అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వచనంలో ప్రజలు చేసిన దానికి, దేవుడు చేసిన కార్యానికి మధ్య ఉన్న వ్యత్యాసాన్ని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: προκατήγγειλεν
  choice: ముందుగానే ప్రకటించిన
  rationale: క్రియలోని ముందస్తు కాలభావాన్నీ, బహిరంగంగా తెలియజేయడమనే భావాన్నీ నిలుపుతుంది.
- source_word: διὰ στόματος πάντων τῶν προφητῶν
  choice: ప్రవక్తలందరి నోటి ద్వారా
  rationale: గ్రీకు మూలంలోని స్పష్టమైన బైబిలీయ నుడికారాన్ని నిలుపుతూ, πάντων అనే ‘అందరి’ భావాన్ని కూడా కాపాడుతుంది.
- source_word: παθεῖν
  choice: బాధలు అనుభవిస్తాడని
  rationale: ఇది దేవుడు ముందుగా ప్రకటించిన విషయాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; మూలంలో ప్రత్యక్షంగా లేని ‘తప్పక’ అనే అవసరార్థాన్ని చేర్చదు.
- source_word: τὸν χριστὸν αὐτοῦ
  choice: తన మెస్సీయ
  rationale: Χριστός ఇక్కడ వ్యక్తిపేరుగా కాక బిరుదుగా పనిచేస్తోంది; αὐτοῦ దేవునికి చెందిన లేదా దేవుడు నియమించిన మెస్సీయను సూచిస్తుంది.
- source_word: ἐπλήρωσεν
  choice: నెరవేర్చాడు
  rationale: ప్రవచన నెరవేర్పు సందర్భంలో πληρόω భావాన్ని స్పష్టంగా, సుపరిచితంగా వ్యక్తం చేస్తుంది.
- source_word: οὕτως
  choice: ఈ విధంగా
  rationale: ఇప్పుడే వివరించిన మెస్సీయ బాధల ద్వారా దేవుడు తన ముందస్తు ప్రకటనను ఏ విధంగా నెరవేర్చాడో సూచిస్తుంది.
theological_decisions:
- issue: Χριστός పదం అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు; అభిషిక్తుడు
  rationale: ఈ సందర్భంలో పదం బిరుదుగా ఉంది. ‘మెస్సీయ’ అనేది పేతురు ప్రసంగంలోని యూదుల మెస్సీయ నిరీక్షణ నేపథ్యాన్ని నిలుపుతుంది.
- issue: παθεῖν పదంలోని విధ్యర్థం
  choice: బాధలు అనుభవిస్తాడని
  alternative: బాధలు అనుభవించవలసి ఉందని; బాధపడాలని
  rationale: ప్రవక్తలు ముందుగా ప్రకటించిన విషయాన్ని ఇది తెలియజేస్తుంది; ఈ క్రియారూపం ఒక్కటే స్పష్టంగా చెప్పని దైవిక అనివార్యతను అనువాదంలో అదనంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘నోటి ద్వారా’ అనే మూల నుడికారం ఉద్దేశపూర్వకంగా నిలుపబడింది; వాక్యక్రమం మాత్రం సహజమైన తెలుగు ప్రవాహానికి అనుగుణంగా అమర్చబడింది.
