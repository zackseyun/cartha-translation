    issue: “బాధలు అనుభవిస్తాడని” introduces an explicit plural noun.
    rationale: παθεῖν means “to suffer” and does not itself specify plural “sufferings.” “బాధపడతాడని” conveys the verbal sense directly without reducing or expanding the source.
