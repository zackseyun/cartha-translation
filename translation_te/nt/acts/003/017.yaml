id: ACT.3.17
reference: Acts 3:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ νῦν, ἀδελφοί, οἶδα ὅτι κατὰ ἄγνοιαν ἐπράξατε, ὥσπερ καὶ οἱ ἄρχοντες ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/017.yaml
  text: And now[a], brothers, I know that you acted in ignorance, just as your rulers also did.
translation:
  language: te
  text: ఇప్పుడు, సోదరులారా,[a] మీరు తెలియక అలా చేశారని నాకు తెలుసు; మీ పాలకులు కూడా అలాగే చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సోదర సోదరీమణులారా’; గ్రీకు పదం అక్షరార్థంగా ‘సోదరులారా’ అని ఉన్నప్పటికీ, అది స్త్రీపురుషులందరినీ ఉద్దేశించిన ప్రతినిధి సంబోధన కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ νῦν
  choice: ఇప్పుడు
  rationale: మునుపటి ఆరోపణ నుంచి ప్రస్తుత విజ్ఞప్తికి మార్పును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. గ్రీకులోని καί అనుసంధాన భావం సందర్భ ప్రవాహంలో అంతర్లీనంగా ఉంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: సంబోధన బహువచనానికి నేరమైన, గౌరవప్రదమైన తెలుగు సమానం. సమూహంలో స్త్రీలు కూడా ఉండే అవకాశాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: οἶδα
  choice: నాకు తెలుసు
  rationale: పేతురు తనకు తెలిసిన విషయాన్ని నేరుగా ప్రకటిస్తున్న భావాన్ని సహజంగా అందిస్తుంది.
- source_word: κατὰ ἄγνοιαν
  choice: తెలియక
  rationale: అవగాహనలేమితో చేసిన చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది; అయితే అది వారిని పూర్తిగా నిర్దోషులుగా ప్రకటించదు.
- source_word: ἐπράξατε
  choice: మీరు ... అలా చేశారు
  rationale: క్రియకు ఈ వచనంలో స్పష్టమైన కర్మ లేకపోవడాన్ని కాపాడుతూ, ముందరి సందర్భంలో చెప్పిన కార్యాన్ని ‘అలా’ సూచిస్తుంది.
- source_word: ὥσπερ καὶ
  choice: కూడా అలాగే
  rationale: ప్రజలు చేసినట్లే వారి పాలకులు కూడా చేశారనే పోలికతో కూడిన అదనపు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἱ ἄρχοντες ὑμῶν
  choice: మీ పాలకులు
  rationale: యెరూషలేములో రాజకీయ-మత అధికారాన్ని కలిగిన నాయకులను సూచించే ἄρχοντες భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: తెలియక చేసిన చర్య వారి అపరాధాన్ని పూర్తిగా తొలగిస్తుందా?
  choice: ‘మీరు తెలియక అలా చేశారు’ అని ఉంచి, అవగాహనలేమిని అంగీకరించడమే గాని నిర్దోషిత్వాన్ని ప్రకటించలేదు.
  alternative: ‘మీకు తెలియనందువల్ల అలా చేశారు’ లేదా ‘అనుకోకుండా చేశారు’
  rationale: ఈ వాక్యం అవగాహనలేమిని చర్యలో ఒక అంశంగా పేర్కొంటుంది; అయినా 19వ వచనంలో పశ్చాత్తాపానికి పిలుపు ఉంది. అందువల్ల అపరాధం మరియు అవగాహనలేమి మధ్య ఉన్న ఉద్వేగాన్ని అనువాదం అలాగే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి. ‘తెలియక’ అనే సాధారణ పదప్రయోగం మూలంలోని అవగాహనలేమి భావాన్ని అతిగా వివరణ చేయకుండా అందిస్తుంది.
