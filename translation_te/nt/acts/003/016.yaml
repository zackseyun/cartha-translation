id: ACT.3.16
reference: Acts 3:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀ἐπὶ τῇ πίστει τοῦ ὀνόματος αὐτοῦ τοῦτον ὃν θεωρεῖτε καὶ οἴδατε ἐστερέωσεν τὸ ὄνομα αὐτοῦ, καὶ ἡ πίστις ἡ δι’ αὐτοῦ ἔδωκεν αὐτῷ τὴν ὁλοκληρίαν ταύτην ἀπέναντι πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/016.yaml
  text: And on the basis of faith in his name[a], his name itself has made strong this man whom you see and know[c][b]; and the faith that is through him has given him this wholeness in the presence of all of you.
translation:
  language: te
  text: ఆయన నామంపై ఉంచిన విశ్వాసం[a] ఆధారంగానే, మీరు చూస్తున్న, మీకు తెలిసిన ఈ మనిషిని ఆయన నామమే బలపరిచింది. ఆయన ద్వారా కలిగిన ఆ విశ్వాసం[b] మీ అందరి సమక్షంలో ఇతనికి ఈ సంపూర్ణ స్వస్థతను[c] ఇచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆయన నామంపై ఉంచిన నమ్మకం.’ గ్రీకు పదం πίστις‌కు ‘విశ్వాసం,’ ‘నమ్మకం,’ కొన్ని సందర్భాల్లో ‘విశ్వసనీయత’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆయన ద్వారా కలిగిన’ అనే గ్రీకు పదబంధం సంక్షిప్తంగా ఉంది. అది యేసు ద్వారా మధ్యవర్తిత్వం పొందిన లేదా ఆయన ద్వారా అనుగ్రహించబడిన విశ్వాసాన్ని సూచించవచ్చు; ఈ వచనం ఆ విశ్వాసం ఎవరిదో స్పష్టంగా చెప్పదు.
    reason: theological_ambiguity
  - marker: c
    text: లేదా ‘పూర్తి ఆరోగ్యాన్ని’ లేదా ‘సంపూర్ణ శరీర స్వస్థతను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ πίστει
  choice: విశ్వాసం ఆధారంగానే
  rationale: ἐπί + దత్తి ఇక్కడ సాధనం కంటే ఆధారం లేదా పునాదిని సూచిస్తుంది. ‘ఆధారంగానే’ అనే రూపం ఆ భావాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: πίστει
  choice: విశ్వాసం
  rationale: ఈ సందర్భంలో πίστις యేసు నామంపై ఆధారపడే నమ్మకాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో స్థిరమైన బైబిలు పదమైన ‘విశ్వాసం’ ఉంచి, ‘నమ్మకం’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: τοῦ ὀνόματος αὐτοῦ
  choice: ఆయన నామంపై
  rationale: πίστις‌తో ఉన్న సంబంధాన్ని తెలుగులో సహజంగా ‘నామంపై విశ్వాసం’ అని వ్యక్తం చేశాం. ‘నామం’ యేసు వ్యక్తిత్వం, అధికారం రెండింటినీ సూచించే లూకా ప్రయోగాన్ని నిలుపుతుంది.
- source_word: ἐστερέωσεν
  choice: బలపరిచింది
  rationale: ఈ క్రియ దృఢపరచడం లేదా బలవంతునిగా చేయడం అనే అర్థం ఇస్తుంది. స్వస్థత పొందిన మనిషి శరీరంలో కనిపించిన ఫలితానికి ‘బలపరిచింది’ సరిపోతుంది.
- source_word: θεωρεῖτε καὶ οἴδατε
  choice: మీరు చూస్తున్న, మీకు తెలిసిన
  rationale: ప్రజలు ఆ మనిషిని కళ్లారా చూస్తున్నారనీ, ముందునుంచి అతన్ని గుర్తెరిగినవారనీ ఈ జంట క్రియలు నొక్కిచెబుతాయి.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: ఆయన నామమే
  rationale: గ్రీకులో ‘నామం’ మళ్లీ కర్తగా రావడాన్ని, దానిపై ఉన్న ఉద్ఘాటనను ‘నామమే’ నిలుపుతుంది; దాన్ని ‘యేసే’ లేదా ‘ఆయన నామశక్తి’ అని వివరణాత్మకంగా మార్చలేదు.
- source_word: ἡ πίστις ἡ δι’ αὐτοῦ
  choice: ఆయన ద్వారా కలిగిన ఆ విశ్వాసం
  rationale: తెలుగులో సహజమైన వాక్య నిర్మాణం కోసం ‘కలిగిన’ చేర్చాం. అయితే δι’ αὐτοῦ యేసు ద్వారా మధ్యవర్తిత్వం పొందిన విశ్వాసాన్నా, ఆయన ద్వారా అనుగ్రహించబడిన విశ్వాసాన్నా సూచిస్తుందనే ప్రశ్నను పాదసూచికలో తెరిచి ఉంచాం.
- source_word: ἔδωκεν αὐτῷ
  choice: ఇతనికి … ఇచ్చింది
  rationale: గ్రీకు సాధారణ భూతకాల క్రియను తెలుగులో సహజమైన భూతకాలంతో అనువదించాం; కనిపిస్తున్న ఫలితం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: ὁλοκληρίαν
  choice: సంపూర్ణ స్వస్థతను
  rationale: ὁλοκληρία శరీర సంపూర్ణత, పూర్తి ఆరోగ్యం అనే భావాన్ని ఇస్తుంది. ‘సంపూర్ణ స్వస్థత’ వైద్యపరమైన పునరుద్ధరణతో పాటు సంపూర్ణతను కూడా తెలియజేస్తుంది.
- source_word: ἀπέναντι πάντων ὑμῶν
  choice: మీ అందరి సమక్షంలో
  rationale: స్వస్థత బహిరంగంగా, అందరి కళ్లముందు జరిగినదనే సాక్ష్యభావాన్ని ఈ సహజ తెలుగు పదబంధం నిలుపుతుంది.
theological_decisions:
- issue: విశ్వాసం ఎవరిది, అది యేసు ద్వారా ఎలా సంబంధించింది
  choice: విశ్వాసాన్ని నిర్దిష్ట మానవ కర్తకు ఆపాదించకుండా, ‘ఆయన ద్వారా కలిగిన ఆ విశ్వాసం’ అని అనువదించడం
  alternative: స్వస్థత పొందిన మనిషి విశ్వాసం; అపొస్తలుల విశ్వాసం; యేసు కలిగించిన విశ్వాసం
  rationale: ఈ వచనం విశ్వాసం ఎవరిదో స్పష్టంగా చెప్పదు. యేసు నామం స్వస్థపరిచే కార్యానికి కేంద్రంగా ఉందని చెప్పినా, విశ్వాసపు మానవ కర్తను నిర్ణయించదు. అందువల్ల అనువాదం ఆ ఉద్రిక్తతను పరిష్కరించదు.
- issue: ‘నామం’ యొక్క ప్రతీకాత్మక అర్థం
  choice: ‘ఆయన నామమే’ అనే మూలరూపాన్ని నిలుపడం
  alternative: యేసే ఈ మనిషిని బలపరిచాడు; ఆయన నామశక్తి ఈ మనిషిని బలపరిచింది
  rationale: అపొస్తలుల కార్యాలలో ‘నామం’ యేసు వ్యక్తిత్వం, అధికారం, కార్యసామర్థ్యాన్ని సూచిస్తుంది. దాన్ని వివరణగా విప్పితే లూకా ఉద్దేశపూర్వక పదప్రయోగం మందగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘నామం,’ ‘విశ్వాసం,’ ‘స్వస్థత’ వంటి పరిచిత బైబిలు పదాలను నిలుపుతూ, వాక్యాన్ని సాధారణ పాఠకుడు సులభంగా గ్రహించేలా రెండు వాక్యాలుగా అమర్చాం.
