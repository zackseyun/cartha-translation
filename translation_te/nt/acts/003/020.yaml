translation:
  language: te
  text: ప్రభువు సన్నిధి నుండి సేదతీర్పు కాలాలు వచ్చునట్లును, మీ కోసం నియమించబడిన[a] మెస్సీయ అయిన యేసును ఆయన పంపునట్లును,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీకు నియమించబడినది”; లేదా, “మీ కోసం ముందుగానే నియమించబడినది.”
    reason: προκεχειρισμένον ὑμῖν లోని దత్తి విభక్తి యొక్క సాధ్యమైన అనువాదాలను, అలాగే προ- ఉపసర్గ సూచించే ముందస్తు నియామక భావాన్ని తెలియజేస్తుంది.
lexical_decisions:
- source_word: ὅπως ἂν
  choice: వచ్చేలా … పంపేలా
  rationale: ముందటి పశ్చాత్తాప పిలుపుతో అనుసంధానమైన ఉద్దేశం/ఫలితాన్ని తెలుగులో సహజంగా చూపిస్తుంది; ἄνతో కూడిన సంభావనను అతిగా నిశ్చయార్థకంగా చేయదు.
- source_word: ἔλθωσιν
  choice: వచ్చేలా
  rationale: ὅπως ἄν తరువాతి aorist subjunctive భావాన్ని ఉద్దేశం లేదా ఆశించిన ఫలితంగా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καιροὶ
  choice: కాలాలు
  rationale: καιρός సూచించే ప్రత్యేక సమయాలు లేదా ఋతువుల విస్తృత భావాన్ని పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: ἀναψύξεως
  choice: సేదదీర్పు
  rationale: ఉపశమనం, నూతనోత్తేజం, తాజాదనం అనే రూపకాల పరిధిని గౌరవప్రదమైన ఆధునిక తెలుగులో సంక్షిప్తంగా అందిస్తుంది.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: ప్రభువు సన్నిధి నుండి
  rationale: πρόσωπον అక్షరార్థంగా ‘ముఖం’ అయినా, ఈ నుడికారంలో ‘సన్నిధి’ సహజంగా ఉద్దేశిత భావాన్ని ఇస్తుంది.
- source_word: ἀποστείλῃ
  choice: ఆయన పంపేలా
  rationale: మునుపటి subjunctive క్రియతో సమన్వయాన్ని నిలుపుతూ, ప్రభువునే కర్తగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: προκεχειρισμένον
  choice: నియమించబడిన
  rationale: ముందుగా ఎంపిక చేసి నియమించడం అనే భావాన్ని ప్రధాన పాఠ్యంలో అనవసరంగా విస్తరించకుండా అందిస్తుంది.
- source_word: ὑμῖν
  choice: మీ కోసం
  rationale: దత్తి విభక్తిలోని ‘మీకు’ లేదా ‘మీ కోసం’ అనే సాధ్యార్థాలలో, సందర్భానికి తగిన ప్రయోజనార్థక భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: χριστὸν
  choice: మెస్సీయ
  rationale: ఇక్కడ ఇది వ్యక్తినామంలో భాగంలా కాక యూదుల నిరీక్షణకు సంబంధించిన బిరుదుగా పనిచేస్తుంది.
- source_word: Ἰησοῦν
  choice: యేసు
  rationale: వ్యక్తినామానికి ప్రామాణిక తెలుగు రూపం.
theological_decisions:
- issue: χριστὸν అనే పదాన్ని బిరుదుగా అనువదించాలా, సంప్రదాయ రూపంలో ఉంచాలా
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో χριστός యేసుకు చెందిన మెస్సీయ బిరుదుగా పనిచేస్తుంది; ‘మెస్సీయ’ దాని యూదీయ సందర్భార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: προκεχειρισμένον ὑμῖν యొక్క భావం
  choice: మీ కోసం నియమించబడిన
  alternative: మీకు నియమించబడిన; మీ కోసం ముందుగానే నియమించబడిన
  rationale: కృదంతంలో ముందస్తు నియామక భావం ఉన్నప్పటికీ, దానిని ప్రధాన పాఠ్యంలో ప్రత్యేకంగా విప్పి చెప్పడం అవసరం లేదు. ‘మీ కోసం’ ప్రయోజనార్థక దత్తిని సహజంగా అందిస్తుంది; ఇతర సాధ్యార్థాలు పాదటిప్పణిలో ఇవ్వవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ఈ వచనం 19వ వచనంతో కొనసాగుతున్నందున చివర కామా ఉంచబడింది. సమర్పించిన ఆంగ్ల పాదటిప్పణి marker [a] ‘Lord’ తరువాత ఉన్నప్పటికీ దాని విషయం προκεχειρισμένον ὑμῖνకు సంబంధించినది; అందుచేత తప్పుదారి పట్టించే markerను ప్రధాన పాఠ్యంలో చేర్చలేదు.
