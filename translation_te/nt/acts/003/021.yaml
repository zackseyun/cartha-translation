id: ACT.3.21
reference: Acts 3:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃν δεῖ οὐρανὸν μὲν δέξασθαι ἄχρι χρόνων ἀποκαταστάσεως πάντων ὧν ἐλάλησεν ὁ θεὸς διὰ ⸀στόματος τῶν ἁγίων ⸂ἀπ’ αἰῶνος αὐτοῦ προφητῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/021.yaml
  text: whom heaven must receive until the times of the restoration of all things that God spoke through the mouth of his holy prophets from of old.
translation:
  language: te
  text: దేవుడు పూర్వకాలం నుంచీ తన పవిత్ర ప్రవక్తల నోటి ద్వారా పలికిన సమస్త విషయాల పునరుద్ధరణ కాలాల వరకు పరలోకం ఆయనను స్వీకరించవలసి ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃν
  choice: ఆయనను
  rationale: ముందటి వాక్యంలో ప్రస్తావించబడిన యేసును సూచించే సంబంధ సర్వనామాన్ని తెలుగులో సహజంగా స్పష్టీకరించింది.
- source_word: δεῖ ... δέξασθαι
  choice: స్వీకరించాలి
  rationale: దైవిక అవసరాన్ని సూచించే δεῖ భావాన్ని నిలుపుతూ, δέχομαι యొక్క స్వీకరించడం అనే ప్రాథమిక అర్థాన్ని ఇచ్చింది.
- source_word: οὐρανὸν
  choice: పరలోకం
  rationale: ఇక్కడ ఆకాశం కంటే క్రీస్తు ఉండే దైవిక లోకాన్ని సూచించే సహజ తెలుగు పదం.
- source_word: ἄχρι χρόνων
  choice: కాలాల వరకు
  rationale: χρόνων యొక్క బహువచనాన్ని కాపాడింది.
- source_word: ἀποκαταστάσεως πάντων
  choice: సమస్తం పునరుద్ధరించబడే
  rationale: అన్నిటి పునరుద్ధరణ అనే భావాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేసింది; πάντων యొక్క విస్తృతిని ముందుగానే పరిమితం చేయలేదు.
- source_word: διὰ στόματος
  choice: నోట
  rationale: గ్రీకు భాషలోని ప్రవక్తల నోటి ద్వారా అనే సాధనార్థక భావాన్ని సంక్షిప్తంగా, సహజంగా అందించింది.
- source_word: ἀπ’ αἰῶνος
  choice: పూర్వకాలం నుంచీ
  rationale: అతి ప్రాచీన కాలం నుండి అనే కాలార్థాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో తెలిపింది.
theological_decisions:
- issue: ἀποκαταστάσεως πάντων యొక్క పరిధి
  choice: సమస్తం పునరుద్ధరించబడే
  alternative: అన్ని విషయాల పునరుద్ధరణ
  rationale: గ్రీకు పదబంధపు విస్తృతమైన, సందర్భపరంగా ఉద్వేగభరితమైన భావాన్ని ఏ ప్రత్యేక సిద్ధాంతానికి పరిమితం చేయకుండా ఉంచింది.
- issue: ὧν యొక్క సంబంధం
  choice: దేవుడు ... పలికిన సమస్తం
  alternative: వాటి గురించి దేవుడు ... పలికాడు
  rationale: ὧν ను πάντων తో నేరుగా అనుసంధానించే మూలపాఠ నిర్మాణాన్ని అనుసరించింది; పునరుద్ధరణ గురించి దేవుడు మాట్లాడాడనే ప్రత్యామ్నాయ అవగాహనను పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన పదక్రమంతో, అయితే మూలంలోని దైవిక అవసరం, కాలాల బహువచనం, ‘సమస్తం’ అనే విస్తృతిని నిలిపింది.
