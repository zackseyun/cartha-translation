id: ACT.3.12
reference: Acts 3:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ⸀ὁ Πέτρος ἀπεκρίνατο πρὸς τὸν λαόν· Ἄνδρες Ἰσραηλῖται, τί θαυμάζετε ἐπὶ τούτῳ, ἢ ἡμῖν τί ἀτενίζετε ὡς ἰδίᾳ δυνάμει ἢ εὐσεβείᾳ πεποιηκόσιν τοῦ περιπατεῖν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/012.yaml
  text: But when Peter saw it[a], he answered the people, “Men of Israel, why do you marvel at this[b], or why do you stare at us as though by our own power or godliness we had made him walk?”
translation:
  language: te
  text: 'పేతురు అది చూసి ప్రజలకు ఇలా జవాబిచ్చాడు: “ఇశ్రాయేలు పురుషులారా, దీని గురించి మీరెందుకు ఆశ్చర్యపడుతున్నారు? మేమే మా సొంత శక్తివల్లనో, మా దైవభక్తివల్లనో[b] ఇతన్ని నడిచేలా చేసినట్టుగా మా వైపు ఎందుకు తదేకంగా[a] చూస్తున్నారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మా వైపు ఎందుకు కళ్లప్పగించి చూస్తున్నారు?” మూలపదం నిలకడగా, ఏకాగ్రంగా చూడడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “దైవభక్తి”కి “భక్తి” లేదా “మతనిష్ఠ” అని కూడా అనువదించవచ్చు. ఆ మనిషి స్వస్థత తమ సొంత మతనిష్ఠ లేదా ఆధ్యాత్మిక గుణంవల్ల కలిగిందనే భావాన్ని పేతురు తిరస్కరిస్తున్నాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πέτρος
  choice: పేతురు అది చూసి
  rationale: అనిశ్చిత భూతకాల కృదంతాన్ని సహజమైన తెలుగు కాలసంబంధ నిర్మాణంగా అనువదించాం. సందర్భం సూచించే ప్రజల ప్రతిస్పందనను ‘అది’ సూచిస్తుంది; δέ ఇక్కడ స్వల్ప కథన మలుపును సూచిస్తుంది కాబట్టి ప్రత్యేక విరోధార్థక పదం అవసరం లేదు.
- source_word: ἀπεκρίνατο πρὸς τὸν λαόν
  choice: ప్రజలకు ఇలా జవాబిచ్చాడు
  rationale: ముందు ప్రత్యక్ష ప్రశ్న లేకపోయినా, ἀποκρίνομαι ఒక పరిస్థితికి స్పందించడాన్ని సూచించగలదు. ‘ఇలా’ ప్రత్యక్ష ప్రసంగంలోకి సహజంగా నడిపిస్తుంది.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: ఇశ్రాయేలు పురుషులారా
  rationale: గ్రీకులోని పురుషలింగ సంబోధనను సాధారణ ‘ప్రజలారా’గా తటస్థీకరించకుండా స్పష్టంగా నిలిపింది.
- source_word: τί θαυμάζετε ἐπὶ τούτῳ
  choice: దీని గురించి మీరెందుకు ఆశ్చర్యపడుతున్నారు?
  rationale: θαυμάζωలోని ఆశ్చర్యభావాన్ని ప్రస్తుత తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘దీని’ స్వస్థత సంఘటనను సూచిస్తుంది.
- source_word: ἢ ἡμῖν τί ἀτενίζετε
  choice: మా వైపు ఎందుకు తదేకంగా చూస్తున్నారు?
  rationale: ἀτενίζω సూచించే నిలకడైన, ఏకాగ్రమైన చూపును ‘తదేకంగా చూడడం’ స్పష్టంగా అందిస్తుంది.
- source_word: ὡς ἰδίᾳ δυνάμει ἢ εὐσεβείᾳ
  choice: మా సొంత శక్తివల్లనో, మా భక్తివల్లనో ... చేసినట్టు
  rationale: ὡςను ‘చేసినట్టు’గా ఇచ్చి పేతురు తిరస్కరిస్తున్న తప్పుడు ఊహను నిలిపాం. ἰδίᾳలోని స్వకీయ భావాన్ని రెండు కారణాలకూ స్పష్టంగా వర్తింపజేశాం.
- source_word: πεποιηκόσιν τοῦ περιπατεῖν αὐτόν
  choice: మేమే ఇతన్ని నడిచేలా చేసినట్టు
  rationale: పూర్తయిన ఫలితంగా ఆ మనిషి నడవగలగడాన్ని, దానికి అపొస్తలులే కారణమనే జనుల ఊహను సహజమైన కారణార్థక తెలుగు నిర్మాణంతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: εὐσεβείᾳ స్వస్థత అపొస్తలుల ఆధ్యాత్మిక యోగ్యతవల్ల కలిగిందని సూచిస్తుందా?
  choice: మా భక్తివల్లనో
  alternative: మా దైవభక్తివల్లనో / మా భక్తిశ్రద్ధవల్లనో
  rationale: ‘భక్తి’ దేవునిపట్ల భక్తిపూర్వక జీవనాన్ని సహజంగా సూచిస్తుంది. అయితే పేతురు స్వస్థతకు తమ భక్తే కారణమని స్పష్టంగా తిరస్కరిస్తున్నాడు; అనువాదం పుణ్యం, యోగ్యత వంటి తరువాతి సిద్ధాంతపరమైన భావాలను చేర్చదు.
- issue: Ἄνδρες Ἰσραηλῖταιలోని పురుషలింగ సంబోధన
  choice: ఇశ్రాయేలు పురుషులారా
  alternative: ఇశ్రాయేలీయులారా / ఇశ్రాయేలు ప్రజలారా
  rationale: మూలంలోని ἄνδρες అనే పురుషలింగ రూపాన్ని నిలిపాం; అదే సమయంలో అక్కడున్న సమూహం గురించి మూలం చెప్పనిదాన్ని అదనంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన బహిరంగ ప్రసంగ శైలిని వాడాం. ‘తదేకంగా’ కొంత ఉన్నత పదమే అయినా సాధారణ పాఠకునికి అర్థమయ్యేలా ఉంది; పాదసూచనలో మరింత చిత్రాత్మక ప్రత్యామ్నాయం ఇచ్చాం. మూలంలోని అలంకారిక ప్రశ్నల నిర్మాణాన్ని నిలిపాం.
