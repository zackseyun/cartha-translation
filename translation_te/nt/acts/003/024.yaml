  text: καὶ πάντες δὲ οἱ προφῆται ἀπὸ Σαμουὴλ καὶ τῶν καθεξῆς ὅσοι ἐλάλησαν καὶ κατήγγειλαν τὰς ἡμέρας ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/024.yaml
  text: And all the prophets from Samuel and those after him[a], as many as spoke[c][b], also announced these days.
translation:
  language: te
  text: సమూయేలు మొదలుకొని, ఆయన తర్వాత వరుసగా వచ్చిన మాట్లాడిన ప్రవక్తలందరూ[a] ఈ దినాలను[c] కూడా ప్రకటించారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆయన తర్వాత వచ్చినవారు,’ ‘ఆయనను అనుసరించినవారు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘చాటిచెప్పారు’; సందర్భాన్ని మరింత వ్యాఖ్యానాత్మకంగా అనువదిస్తే, ‘ముందుగానే తెలియజేశారు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ఈ కాలాన్ని.’ ఈ పదబంధం పేతురు ప్రసంగంలో ఇప్పుడు నెరవేరుతున్న కాలాన్ని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες δὲ οἱ προφῆται
  choice: ప్రవక్తలందరూ
  rationale: δέకు ఇక్కడ స్వల్ప అనుసంధాన భావమే ఉంది; సహజమైన తెలుగులో దాన్ని ప్రత్యేక పదంతో చూపనవసరం లేదు. πάντες అనే సమగ్ర భావాన్ని ‘అందరూ’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀπὸ Σαμουὴλ
  choice: సమూయేలు మొదలుకొని
  rationale: ἀπό ఇక్కడ వరుసకు ఆరంభ బిందువును సూచిస్తుంది; ‘మొదలుకొని’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: τῶν καθεξῆς
  choice: ఆయన తర్వాత వరుసగా వచ్చిన
  rationale: καθεξῆςలోని క్రమం లేదా వారసత్వ వరుస భావాన్ని నిలుపుతూ, ముందు ప్రస్తావించిన సమూయేలుతో సంబంధాన్ని ‘ఆయన తర్వాత’ స్పష్టం చేస్తుంది.
- source_word: ὅσοι ἐλάλησαν
  choice: మాట్లాడిన వారందరూ
  rationale: ὅσοιలోని సమగ్ర పరిమాణ భావాన్ని ‘వారందరూ’ నిలుపుతుంది; ἐλάλησανకు సరళమైన ‘మాట్లాడిన’ అనే అర్థమే ఇచ్చింది.
- source_word: καὶ κατήγγειλαν
  choice: కూడా ప్రకటించారు
  rationale: καταγγέλλω బహిరంగంగా తెలియజేయడం లేదా ప్రకటించడం అనే భావాన్ని ఇస్తుంది. ‘ముందుగానే ప్రవచించారు’ అని అనువదించడం సందర్భానుకూలమైనా మూలపదం కంటే ఎక్కువ వ్యాఖ్యాత్మకం; καίను ‘కూడా’గా చూపింది.
- source_word: τὰς ἡμέρας ταύτας
  choice: ఈ దినాలను
  rationale: గ్రీకు కాలసూచక పదబంధాన్ని నేరుగా నిలుపుతుంది; ఇది పేతురు మాట్లాడుతున్న నెరవేర్పు కాలాన్ని సూచించినప్పటికీ అనువాదంలో ఆ భావాన్ని మరింత విప్పి చెప్పలేదు.
theological_decisions:
- issue: ప్రస్తుత రక్షణ-చరిత్రాత్మక నెరవేర్పు కాలానికి ప్రవక్తల సూచన
  choice: ఈ దినాలను
  alternative: ఈ కాలాన్ని
  rationale: ఈ పదబంధం మెస్సీయతోను పేతురు ప్రకటిస్తున్న సంఘటనలతోను సంబంధించిన నెరవేర్పు కాలాన్ని సూచించే అవకాశం ఉంది. అయితే గ్రీకు వచనంలోని ‘దినాలు’ అనే రూపకాన్ని ఉంచి, అంత్యకాల భావాన్ని అనువాదంలో మితిమీరి నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. గ్రీకు వాక్యంలోని విస్తృత కర్తను స్పష్టంగా ఉంచేందుకు ‘మాట్లాడిన వారందరూ’ అనే భాగాన్ని విరామచిహ్నాల మధ్య ఇచ్చాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన వచనంలో చేర్చబడింది.
