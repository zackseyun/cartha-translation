- from: సమూయేలు మొదలుకొని, ఆయన తర్వాత వరుసగా వచ్చిన ప్రవక్తలందరూ[a]—మాట్లాడిన వారందరూ—ఈ దినాలను కూడా ప్రకటించారు[b][c].
