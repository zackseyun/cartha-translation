id: ACT.3.7
reference: Acts 3:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πιάσας αὐτὸν τῆς δεξιᾶς χειρὸς ἤγειρεν ⸀αὐτόν· παραχρῆμα δὲ ἐστερεώθησαν ⸂αἱ βάσεις αὐτοῦ⸃ καὶ τὰ ⸀σφυδρά,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/007.yaml
  text: And taking him by the right hand[a], he raised him up; and immediately his feet and ankles were strengthened.
translation:
  language: te
  text: అతని కుడిచేతిని పట్టుకుని అతన్ని పైకి లేపాడు; వెంటనే అతని పాదాలు, చీలమండలు[a] బలపడ్డాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చీలమండ ఎముకలు.”
    reason: σφυδράకు సాధ్యమైన మరింత నిర్దిష్టమైన శరీరనిర్మాణ సంబంధ అర్థాన్ని సూచించడానికి.
lexical_decisions:
- source_word: πιάσας
  choice: పట్టుకొని
  rationale: ఈ భూతకాల అసమాపక క్రియ ప్రధాన చర్యకు ముందు జరిగిన శారీరక సహాయాన్ని సూచిస్తుంది. ‘పట్టుకొని’ అనేది సహజమైన ఆధునిక తెలుగు; కఠిన భావం కలిగించే పదాలను నివారిస్తుంది.
- source_word: τῆς δεξιᾶς χειρός
  choice: అతని కుడిచేయి
  rationale: πιάσας తరువాతి షష్ఠీ విభక్తి నిర్మాణాన్ని తెలుగులో సహజంగా ‘అతని కుడిచేయి పట్టుకొని’ అని అందించాం. ‘అతని’ అనేది సందర్భం ద్వారా స్పష్టమైన సంబంధాన్ని తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἤγειρεν αὐτόν
  choice: అతన్ని పైకి లేపాడు
  rationale: ἐγείρω ఇక్కడ నేలపై ఉన్న వ్యక్తిని లేపే భౌతిక చర్యను సూచిస్తుంది. ‘పైకి లేపాడు’ మూలార్థాన్ని స్పష్టంగా, సహజంగా కాపాడుతుంది; కేవలం ‘సహాయం చేశాడు’ అని అర్థాన్ని సడలించదు.
- source_word: παραχρῆμα
  choice: వెంటనే
  rationale: స్వస్థత అకస్మాత్తుగా, ఆలస్యం లేకుండా సంభవించిందనే భావాన్ని ‘వెంటనే’ సహజంగా తెలియజేస్తుంది.
- source_word: ἐστερεώθησαν
  choice: బలపడ్డాయి
  rationale: ఈ నిష్క్రియారూపం అవయవాలకు బలం కలిగిన ఫలితాన్ని తెలియజేస్తుంది. తెలుగులో ‘బలపడ్డాయి’ సహజంగా ఉండి, ఈ వాక్యంలో స్పష్టంగా చెప్పని కార్యసాధకుడిని చేర్చదు.
- source_word: αἱ βάσεις αὐτοῦ
  choice: అతని పాదాలు
  rationale: βάσεις శరీరాన్ని నిలబెట్టే ఆధార భాగాలను సూచిస్తుంది. శరీర సందర్భంలో ‘పాదాలు’ సహజమైనది; ‘అరికాళ్లు’ అని అనడం మూలపదం కంటే మరీ సంకుచితంగా ఉంటుంది.
- source_word: τὰ σφυδρά
  choice: చీలమండలు
  rationale: ఈ పదం చీలమండ ప్రాంతం లేదా కీళ్లను సూచిస్తుంది. ‘చీలమండలు’ ఆధునిక తెలుగులో సహజమైన, తగినంత ఖచ్చితమైన పదం; ‘చీలమండ ఎముకలు’ అని ప్రత్యేకీకరించడం అవసరం లేదు.
theological_decisions:
- issue: స్వస్థత స్వరూపాన్ని వర్ణించడం
  choice: శరీర అవయవాలు వెంటనే బలపడినట్లు నేరుగా వర్ణించడం
  alternative: ‘స్వస్థపడ్డాయి’ అని విస్తరించడం లేదా ఈ వాక్యంలోనే దేవుని కార్యసాధకుడిగా స్పష్టంగా పేర్కొనడం
  rationale: మూలవాక్యం సంఘటనను పాదాలు, చీలమండలు బలపడినట్లు నిర్దిష్ట శారీరక పదాలతో చెబుతుంది. అద్భుత స్వభావం సందర్భం ద్వారా వెల్లడవుతుంది; వాక్యంలో లేని కార్యవిధానాన్ని లేదా కార్యసాధకుడిని అనువాదం చేర్చదు.
translation_notes:
  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. కథనంలోని చర్యల క్రమాన్ని కాపాడుతూ, సాధారణ పాఠకులకు వెంటనే అర్థమయ్యే శరీర సంబంధ పదాలను ఉపయోగించాం. మూలంలోని విరామ నిర్మాణాన్ని తెలుగులో రెండు వాక్యాలుగా అందించడం ద్వారా స్పష్టత పెరిగింది.
