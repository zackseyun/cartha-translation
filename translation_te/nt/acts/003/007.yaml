revisions:
- from: అతని కుడిచేయి పట్టుకొని, అతన్ని పైకి లేపాడు. వెంటనే అతని పాదాలు, చీలమండలు బలపడ్డాయి.
  to: అతని కుడిచేతిని పట్టుకుని అతన్ని పైకి లేపాడు; వెంటనే అతని పాదాలు, చీలమండలు[a] బలపడ్డాయి.
