  naturalness: ‘అతని కుడిచేతిని పట్టుకుని’ is idiomatic modern standard Telugu and makes the physical action unambiguous. A semicolon retains the close Greek linkage between the action and its immediate result without making the Telugu cumbersome.
  terminology: ‘పాదాలు’ and ‘చీలమండలు’ suitably render βάσεις and σφυδρά in this bodily context. The lexical alternative for σφυδρά should be retained in a Telugu footnote, anchored at ‘చీలమండలు.’
  issues:
  - severity: low
    issue: The object of ‘పట్టుకొని’ is not explicitly case-marked.
    rationale: Changing ‘అతని కుడిచేయి’ to ‘అతని కుడిచేతిని’ clarifies that Peter took hold of the man's right hand and is more natural in formal modern Telugu narrative.
  - severity: low
    issue: The lexical-alternative footnote for σφυδρά is absent from the Telugu text.
    rationale: The English audit trail supplies an ‘ankle bones’ alternative. Retaining an anchored Telugu equivalent supports lexical transparency without narrowing the main rendering.
