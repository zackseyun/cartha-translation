  revision_rationale: The revision makes the right hand the explicit object of ‘taking hold,’ while preserving the source’s action sequence, immediate timing, and passive/resultative description of the feet and ankles. The footnote carries forward the audit trail’s lexical alternative without imposing it on the main text.
