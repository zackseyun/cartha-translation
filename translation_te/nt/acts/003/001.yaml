source:
  edition: SBLGNT
  text: ⸂Πέτρος δὲ⸃ καὶ Ἰωάννης ἀνέβαινον εἰς τὸ ἱερὸν ἐπὶ τὴν ὥραν τῆς προσευχῆς τὴν ἐνάτην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/001.yaml
  text: Peter and John were going up to the temple at the hour of prayer[a], the ninth hour.
translation:
  language: te
  text: పేతురు, యోహాను ప్రార్థన సమయమైన తొమ్మిదవ గంటకు[a] దేవాలయానికి వెళ్తూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ఆధునిక కాలగణన ప్రకారం మధ్యాహ్నం సుమారు మూడు గంటలకు.
    reason: cultural_note
lexical_decisions:
- source_word: δέ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ కథనాన్ని స్వల్పంగా ముందుకు నడిపే అనుసంధానక పదం; బలమైన వ్యతిరేకతను లేదా కాలార్థకమైన ‘ఇప్పుడు’ను సూచించదు. తెలుగు వాక్యప్రవాహంలో ప్రత్యేక పదం లేకుండానే దాని పని సహజంగా వ్యక్తమవుతుంది.
- source_word: ἀνέβαινον
  choice: వెళ్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న క్రియాభావాన్ని నిలుపుతుంది. దేవాలయానికి ‘పైకి వెళ్లడం’ అనే మూలభావం ఉన్నప్పటికీ, ఆధునిక తెలుగులో ‘దేవాలయానికి వెళ్తూ ఉన్నారు’ మరింత సహజం; సందర్భంలో గమ్యం స్పష్టంగా ఉంది.
- source_word: ἱερόν
  choice: దేవాలయం
  rationale: ఈ పదం అంతర్గర్భాలయాన్ని మాత్రమే కాక దేవాలయ ప్రాంగణ సముదాయాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో సాధారణంగా అర్థమయ్యే ‘దేవాలయం’ తగినది.
- source_word: ἐπὶ τὴν ὥραν
  choice: సమయమైన ... గంటకు
  rationale: నిర్ణయించబడిన ప్రార్థనా సమయానికి సంబంధించి వారు వెళ్తున్నారనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τῆς προσευχῆς
  choice: ప్రార్థన సమయం
  rationale: గ్రీకు షష్ఠీ విభక్తి సంబంధాన్ని తెలుగులో సహజమైన ‘ప్రార్థన సమయం’ అనే పదబంధంతో వ్యక్తం చేస్తుంది.
- source_word: τὴν ἐνάτην
  choice: తొమ్మిదవ గంట
  rationale: మూలపాఠ్యంలోని యూదుల కాలగణన విధానాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; ఆధునిక కాలమాన సమానార్థాన్ని పాదటిప్పణిలో వివరిస్తుంది.
