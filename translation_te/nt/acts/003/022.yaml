id: ACT.3.22
reference: Acts 3:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μωϋσῆς ⸀μὲν εἶπεν ὅτι Προφήτην ὑμῖν ἀναστήσει κύριος ὁ ⸀θεὸς ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ· αὐτοῦ ἀκούσεσθε κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/022.yaml
  text: Moses indeed said[a], ‘The Lord God will raise up for you a prophet from among your brothers, like me[b]. You shall listen to him in everything he says to you.’
translation:
  language: te
  text: 'మోషే నిజానికి ఇలా అన్నాడు: “ప్రభువైన దేవుడు[b] మీ సహోదరులలోనుంచి[a] నా వంటి ఒక ప్రవక్తను మీ కోసం లేవనెత్తుతాడు. ఆయన మీతో చెప్పే ప్రతి విషయములో మీరు ఆయన మాట వినాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీ తోటి ఇశ్రాయేలీయులలోనుంచి.” గ్రీకు పాఠంలో అక్షరార్థంగా “మీ సహోదరులలోనుంచి” అని ఉంది; ఇక్కడ పురుష బంధుత్వ భాష నిబంధన సమాజాన్ని ప్రతినిధిత్వపూర్వకంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ అపొస్తలుల కార్యములు 3:22, ద్వితీయోపదేశకాండం 18:15ను కొద్దిగా భిన్నమైన పదాలతో ఉల్లేఖిస్తుంది. ముఖ్యంగా, అపొస్తలుల కార్యముల గ్రీకు పాఠంలో “ప్రభువైన దేవుడు” అని ఉంది; “ప్రభువైన మీ దేవుడు” అని లేదు.
    reason: cross_reference
lexical_decisions:
- source_word: Μωϋσῆς
  choice: మోషే
  rationale: తెలుగులో స్థిరపడిన బైబిలు వ్యక్తినామ రూపం.
- source_word: μὲν
  choice: నిజానికి
  rationale: ఈ అవ్యయం ఇచ్చే ఉద్ఘాటనను, ప్రసంగం ముందుకు సాగే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: εἶπεν ὅτι
  choice: 'ఇలా అన్నాడు: “…”'
  rationale: ప్రత్యక్ష ఉల్లేఖన సూత్రాన్ని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: Προφήτην
  choice: ఒక ప్రవక్తను
  rationale: గ్రీకులో నిర్దిష్ట ఉపపదం లేనందున ‘ఒక ప్రవక్త’ అని అనువదించడం సముచితం; వాక్యంలో ‘మెస్సీయ’ అని వ్యాఖ్యానాత్మకంగా చేర్చలేదు.
- source_word: ἀναστήσει
  choice: లేవనెత్తుతాడు
  rationale: ద్వితీయోపదేశకాండంలోని వాగ్దానంతో ఉన్న పదసంబంధాన్ని కాపాడుతూ, దేవుడు ఒక ప్రవక్తను ముందుకు తీసుకురావడం అనే ప్రధాన భావాన్ని వ్యక్తపరుస్తుంది; పునరుత్థాన భావాన్ని మాత్రమే నిర్బంధంగా సూచించదు.
- source_word: κύριος ὁ θεὸς
  choice: ప్రభువైన దేవుడు
  rationale: ‘ప్రభువు’ మరియు ‘దేవుడు’ అనే రెండు గ్రీకు పదాలను సహజమైన తెలుగు నిర్మాణంలో నిలుపుతుంది; మూలంలో లేని ‘మీ దేవుడు’ అనే పదాన్ని చేర్చదు.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: మీ సహోదరులలోనుంచి
  rationale: ἐκ యొక్క ‘మధ్యనుంచి’ భావాన్ని, ἀδελφῶν యొక్క పురుష బంధుత్వ పదప్రయోగాన్ని కాపాడుతుంది; సందర్భంలోని తోటి ఇశ్రాయేలీయుల విస్తృత భావాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: ὡς ἐμέ
  choice: నా వంటి
  rationale: మోషేతో పోలికను నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: αὐτοῦ ἀκούσεσθε
  choice: మీరు ఆయన మాట వినాలి
  rationale: భవిష్యత్ రూపంలో ఉన్న ఆజ్ఞాత్మక/నిబంధనాత్మక బలాన్ని కేవలం శబ్దం వినడంగా కాక, విధేయతతో ఆలకించడంగా వ్యక్తపరుస్తుంది.
- source_word: κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς
  choice: ఆయన మీతో ఏమేమి చెబుతాడో వాటన్నిటిలో
  rationale: గ్రీకు పదబంధంలోని సమగ్ర, విభజనాత్మక భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో కాపాడుతుంది.
theological_decisions:
- issue: ద్వితీయోపదేశకాండం 18లోని ప్రవచన ఉల్లేఖనం మరియు మెస్సీయ సంబంధం
  choice: మూలంలో ఉన్నట్లే ‘ఒక ప్రవక్త’ అని ఉంచడం
  alternative: ‘ఆ ప్రవక్త’ అని లేదా ‘మెస్సీయ అయిన ప్రవక్త’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: అపొస్తలుల కార్యముల సందర్భంలో పేతురు ఈ వాక్యాన్ని యేసుకు అన్వయించినా, ఈ ఉల్లేఖనంలోని గ్రీకు పాఠం స్వయంగా ‘ఒక ప్రవక్త’ అని చెబుతుంది. కాబట్టి క్రీస్తు సంబంధ అన్వయాన్ని ప్రధాన వాక్యంలో అదనంగా చేర్చలేదు.
- issue: ἀδελφῶν యొక్క నిబంధనాత్మక సామూహిక అర్థం
  choice: సహోదరులు
  alternative: తోటి ఇశ్రాయేలీయులు
  rationale: మూలంలోని పురుష బంధుత్వ భాషను ప్రధాన పాఠంలో కాపాడి, అది తోటి ఇశ్రాయేలీయులను ప్రతినిధిత్వపూర్వకంగా సూచిస్తుందని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ఉల్లేఖనానికి తగిన గంభీరతను నిలుపుకుంది. ‘లేవనెత్తుతాడు’ మూలపద సంబంధాన్ని కాపాడే బైబిలు శైలిలోని పదమే అయినా సందర్భంలో సులభంగా అర్థమవుతుంది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో సంబంధిత స్థానాల్లో ఉన్నాయి.
