  to: 'మోషే నిజానికి ఇలా అన్నాడు: “ప్రభువైన దేవుడు[b] మీ సహోదరులలోనుంచి[a] నా వంటి ఒక ప్రవక్తను మీ కోసం లేవనెత్తుతాడు. ఆయన మీతో చెప్పే ప్రతి విషయములో మీరు ఆయన మాట వినాలి.”'
