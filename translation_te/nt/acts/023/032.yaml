id: ACT.23.32
reference: Acts 23:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῇ δὲ ἐπαύριον ἐάσαντες τοὺς ἱππεῖς ⸀ἀπέρχεσθαι σὺν αὐτῷ ὑπέστρεψαν εἰς τὴν παρεμβολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/032.yaml
  text: But on the next day[a], after letting the horsemen go on with him, they returned to the barracks.
translation:
  language: te
  text: మరుసటి రోజు, గుర్రపు దళంలోని సైనికులను అతనితోపాటు వెళ్లనిచ్చి, వారు సైనిక శిబిరానికి[a] తిరిగి వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సైనిక స్థావరానికి.” గ్రీకు పదం శిబిరాన్ని లేదా సైనికులు ఉండే స్థలాన్ని సూచించగలదు; ఇక్కడ అది బహుశా యెరూషలేములోని రోమీయుల సైనిక నివాసాన్ని లేదా కోటను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: మరుసటి రోజు
  rationale: ఈ గ్రీకు కాలసూచక పదబంధం ‘తరువాతి రోజు’ అనే అర్థం ఇస్తుంది. δέ ఇక్కడ బలమైన వ్యతిరేకత కంటే కథనంలోని స్వల్ప మార్పును సూచిస్తుంది; సహజమైన తెలుగు వాక్యంలో దానిని ప్రత్యేక సంధానపదంతో అనువదించాల్సిన అవసరం లేదు.
- source_word: ἐάσαντες
  choice: వెళ్లనిచ్చి
  rationale: ἐάω అనే క్రియ ఇక్కడ ‘అనుమతించు/వెళ్లనివ్వు’ అని అర్థం. ప్రధాన క్రియకు ముందు జరిగిన చర్యను తెలుగు అసమాపక క్రియ సహజంగా తెలియజేస్తుంది.
- source_word: τοὺς ἱππεῖς
  choice: గుర్రపు దళ సైనికులను
  rationale: ἱππεῖς అనేది గుర్రాలపై ప్రయాణించే సైనికులను సూచిస్తుంది. ‘గుర్రపు దళ సైనికులు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, కేవలం ‘గుర్రపు రౌతులు’ కంటే సైనిక సందర్భాన్ని బాగా తెలియజేస్తుంది.
- source_word: ἀπέρχεσθαι σὺν αὐτῷ
  choice: అతనితోపాటు ముందుకు వెళ్ల
  rationale: ἀπέρχομαι ఇక్కడ ప్రయాణాన్ని కొనసాగిస్తూ వెళ్లడాన్ని, σύν సహవాసాన్ని సూచిస్తాయి. మిగిలినవారు తిరిగి వెళ్లగా గుర్రపు దళ సైనికులు పౌలుతో ప్రయాణం కొనసాగించారనే సందర్భాన్ని ‘ముందుకు వెళ్ల’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑπέστρεψαν
  choice: తిరిగి వెళ్లారు
  rationale: ὑποστρέφω అంటే ‘తిరిగివెళ్లు/వెనక్కి వెళ్లు.’ తెలుగు కథనంలో ‘తిరిగి వెళ్లారు’ సహజమైన, మూలానికి దగ్గరైన రూపం.
- source_word: εἰς τὴν παρεμβολήν
  choice: సైనిక శిబిరానికి
  rationale: παρεμβολή శిబిరాన్ని లేదా సైనికులు ఉండే స్థావరాన్ని సూచించగలదు. ‘సైనిక శిబిరం’ మూలపదంలోని విస్తృత అర్థాన్ని నిలుపుతూ సందర్భాన్ని స్పష్టం చేస్తుంది; యెరూషలేములోని రోమా సైనిక నివాసం/కోట ఇక్కడ ఉద్దేశితమై ఉండవచ్చు.
