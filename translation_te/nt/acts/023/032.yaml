- from: మరుసటి రోజు, గుర్రపు దళ సైనికులను అతనితోపాటు ముందుకు వెళ్లనిచ్చి, వారు సైనిక శిబిరానికి[a] తిరిగి వెళ్లారు.
  to: మరుసటి రోజు, గుర్రపు దళంలోని సైనికులను అతనితోపాటు వెళ్లనిచ్చి, వారు సైనిక శిబిరానికి[a] తిరిగి వెళ్లారు.
