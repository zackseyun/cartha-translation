translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. అసలు గ్రీకులో తిరిగి వెళ్లినవారి గుర్తింపు ఈ వాక్యంలో ప్రత్యేకంగా చెప్పబడలేదు కాబట్టి ‘వారు’ అని ఉంచి, సందర్భం ఆధారంగా అర్థమయ్యేలా చేశాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘సైనిక శిబిరానికి’ అనే పదబంధం వద్ద ఉంచాం.
