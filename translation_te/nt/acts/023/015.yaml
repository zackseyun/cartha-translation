id: ACT.23.15
reference: Acts 23:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: νῦν οὖν ὑμεῖς ἐμφανίσατε τῷ χιλιάρχῳ σὺν τῷ συνεδρίῳ ⸀ὅπως ⸂καταγάγῃ αὐτὸν εἰς⸃ ὑμᾶς ὡς μέλλοντας διαγινώσκειν ἀκριβέστερον τὰ περὶ αὐτοῦ· ἡμεῖς δὲ πρὸ τοῦ ἐγγίσαι αὐτὸν ἕτοιμοί ἐσμεν τοῦ ἀνελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/015.yaml
  text: Now therefore[a], you, together with the council, make it known to the commander so that he may bring him down to you, as though you were about to examine more carefully the things concerning him[c][b]. But we are ready to kill him before he comes near.
translation:
  language: te
  text: కాబట్టి, ఇప్పుడు మీరు మహాసభతో కలిసి, మీరు అతని గురించిన విషయాలను మరింత కచ్చితంగా విచారించబోతున్నట్టుగా అతన్ని మీ దగ్గరకు కిందికి తీసుకురావాలని[a] సహస్రాధిపతికి తెలియజేయండి[b]. అయితే అతను దగ్గరికి రాకముందే[c] అతన్ని చంపడానికి మేము సిద్ధంగా ఉన్నాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతన్ని మీ ఎదుటికి తీసుకురావాలని.’ గ్రీకు క్రియలో అక్షరార్థంగా ‘కిందికి తీసుకురావడం’ అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతని గురించిన విషయాలను మరింత జాగ్రత్తగా పరిశీలించబోతున్నట్టుగా.’ ఈ మాటలు మరింత న్యాయవిచారణ జరపబోతున్నామనే నెపాన్ని సూచిస్తున్నాయి.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘అతను చేరుకోకముందే.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφανίσατε
  choice: తెలియజేయండి
  rationale: అధికారికి ఒక విషయాన్ని అధికారికంగా తెలియజేయడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘విన్నవించండి’ అని అనువదిస్తే అభ్యర్థన భావాన్ని మూలపాఠం కంటే ఎక్కువగా నిర్దిష్టం చేసినట్టవుతుంది.
- source_word: χιλιάρχῳ
  choice: సహస్రాధిపతికి
  rationale: రోమా సైనిక హోదాను సూచించే చారిత్రక పదం; సాధారణ ‘అధిపతి’ కంటే మూలపదంలోని ప్రత్యేకతను నిలుపుతుంది.
- source_word: σὺν τῷ συνεδρίῳ
  choice: మహాసభతో కలిసి
  rationale: యూదుల పాలక మండలిని సూచించే సందర్భానుకూలమైన, సుపరిచితమైన తెలుగు పదం; σύν లోని సహచర్య భావాన్ని ‘కలిసి’ నిలుపుతుంది.
- source_word: καταγάγῃ αὐτὸν εἰς ὑμᾶς
  choice: అతన్ని మీ దగ్గరికి కిందికి తీసుకురావాలని
  rationale: κατάγω లోని ‘కిందికి తీసుకురావడం’ అనే దిశాసూచక భావాన్ని నిలుపుతూ తెలుగులో అర్థమయ్యేలా ఉంది.
- source_word: ὡς μέλλοντας
  choice: విచారించబోతున్నట్టు చెప్పండి
  rationale: వారు అధికారికి చూపించవలసిన ఉద్దేశం నిజమైనది కాదనే సందర్భగత మోసపూరిత భావాన్ని ‘అని నెపంతో’ వంటి అతివ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
- source_word: διαγινώσκειν ἀκριβέστερον
  choice: మరింత కచ్చితంగా విచారించడానికి
  rationale: న్యాయపరమైన పరిశీలనను ‘విచారించు’ సహజంగా సూచిస్తుంది; తులనాత్మక ἀκριβέστερον లోని ఎక్కువ ఖచ్చితత్వ భావాన్ని ‘మరింత కచ్చితంగా’ నిలుపుతుంది.
- source_word: τὰ περὶ αὐτοῦ
  choice: అతని గురించిన విషయాలను
  rationale: మూలంలోని విస్తృతమైన పదబంధాన్ని ‘అతని కేసు’ అని పరిమితం చేయకుండా పారదర్శకంగా అనువదిస్తుంది.
- source_word: πρὸ τοῦ ἐγγίσαι αὐτὸν
  choice: అతను దగ్గరికి రాకముందే
  rationale: ἐγγίζω లోని సమీపించడమనే స్థలసంబంధ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τοῦ ἀνελεῖν αὐτόν
  choice: అతన్ని చంపడానికి
  rationale: ఈ సందర్భంలో ἀναιρέω యొక్క ప్రత్యక్ష అర్థం ‘చంపడం’; ‘హత్య చేయడం’ అనే నైతిక మూల్యాంకనాన్ని అదనంగా చేర్చదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘సహస్రాధిపతి’, ‘మహాసభ’ అనే చారిత్రక-సంస్థాగత పదాలను నిలిపి, వాక్య నిర్మాణాన్ని సహజమైన తెలుగుకు అనుగుణంగా రెండు వాక్యాలుగా అమర్చాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
