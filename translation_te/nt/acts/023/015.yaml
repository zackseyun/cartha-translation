revisions:
- from: కాబట్టి ఇప్పుడు మీరు మహాసభతో కలిసి, అతన్ని మీ దగ్గరికి కిందికి తీసుకురావాలని సహస్రాధిపతికి తెలియజేయండి[a]. అతని గురించిన విషయాలను మరింత కచ్చితంగా విచారించబోతున్నట్టు చెప్పండి[b]. అయితే అతను దగ్గరికి రాకముందే[c] అతన్ని చంపడానికి మేము సిద్ధంగా ఉంటాం.
  to: కాబట్టి, ఇప్పుడు మీరు మహాసభతో కలిసి, మీరు అతని గురించిన విషయాలను మరింత కచ్చితంగా విచారించబోతున్నట్టుగా అతన్ని మీ దగ్గరకు కిందికి తీసుకురావాలని[a] సహస్రాధిపతికి తెలియజేయండి[b]. అయితే అతను దగ్గరికి రాకముందే[c] అతన్ని చంపడానికి మేము సిద్ధంగా ఉన్నాము.
  rationale: సవరణ మూల గ్రీకులోని ఆజ్ఞను, దాని ఉద్దేశ్యాన్ని, అలాగే ὡς μέλλοντας సూచించే కపటమైన విచారణ-ప్రదర్శనను ఒకే వాక్య నిర్మాణంలో పునరుద్ధరిస్తుంది. వర్తమానమైన ἕτοιμοί ἐσμενను ‘సిద్ధంగా ఉన్నాము’గా సరిచేసింది. చారిత్రక పదాలు, ‘కిందికి’ అనే దిశాభావం, మరియు పాదసూచికల ప్రత్యామ్నాయ అనువాదాలు నిలుపబడ్డాయి.
