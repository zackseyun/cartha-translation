id: ACT.23.21
reference: Acts 23:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: σὺ οὖν μὴ πεισθῇς αὐτοῖς, ἐνεδρεύουσιν γὰρ αὐτὸν ἐξ αὐτῶν ἄνδρες πλείους τεσσεράκοντα, οἵτινες ἀνεθεμάτισαν ἑαυτοὺς μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀνέλωσιν αὐτόν, καὶ νῦν ⸂εἰσιν ἕτοιμοι⸃ προσδεχόμενοι τὴν ἀπὸ σοῦ ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/021.yaml
  text: So do not be persuaded by them, for more than forty men from among them are lying in ambush for him, who have bound themselves under a curse neither to eat nor to drink until they have killed him. And now they are ready, waiting for the promise from you.
translation:
  language: te
  text: కాబట్టి మీరు వారి మాటకు ఒప్పుకోవద్దు. ఎందుకంటే వారిలో నలభై మందికంటే ఎక్కువమంది అతనిపై దాడి చేయడానికి పొంచి ఉన్నారు. అతన్ని చంపేవరకు తినకుండా, తాగకుండా ఉంటామని వారు తమను తాము శాపానికి లోబరచుకున్నారు[a]. ఇప్పుడు వారు సిద్ధంగా ఉండి, మీ నుండి వచ్చే వాగ్దానం కోసం ఎదురుచూస్తున్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమపై శాపం తెచ్చేలా ఒట్టు పెట్టుకున్నారు.” గ్రీకు పదబంధంలో, తాము మాట తప్పితే తమపై శాపం రావాలని కోరుకునే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ఇది వారి అభ్యర్థనకు మీరు ఇచ్చే సమ్మతి లేదా అనుమతిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεισθῇς
  choice: వారి మాటకు ఒప్పుకోవద్దు
  rationale: నిష్క్రియ ఆజ్ఞారూపంలోని ‘వారి చేత ఒప్పింపబడవద్దు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; వారి అభ్యర్థనకు లొంగవద్దనే సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: ἐνεδρεύουσιν
  choice: మాటువేసి ఉన్నారు
  rationale: రహస్యంగా దాడి చేయడానికి పొంచి ఉండడమనే స్పష్టమైన భావాన్ని సహజమైన తెలుగు ప్రయోగంతో నిలుపుతుంది.
- source_word: ἐξ αὐτῶν
  choice: వారిలో
  rationale: ఆ మనుషులు ఇంతకుముందు ప్రస్తావించిన గుంపులోనివారనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἄνδρες πλείους τεσσεράκοντα
  choice: నలభై మందికంటే ఎక్కువమంది
  rationale: సంఖ్యతో కూడిన తులనాత్మక గ్రీకు నిర్మాణాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: తమను తాము శాపానికి లోబరచుకున్నారు
  rationale: తాము విఫలమైతే తమపై శాపం రావాలని స్వయంగా బంధించుకున్న ప్రమాణభావాన్ని కేవలం ‘ఒట్టు పెట్టుకున్నారు’ అని తగ్గించకుండా నిలుపుతుంది.
- source_word: μήτε φαγεῖν μήτε πιεῖν
  choice: తినకుండా, తాగకుండా ఉంటామని
  rationale: రెండు చర్యలనూ విడివిడిగా నిరాకరించే గ్రీకు సమాంతర నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἕως οὗ ἀνέλωσιν αὐτόν
  choice: అతన్ని చంపేవరకు
  rationale: ἀναιρέω ఇక్కడ హింసాత్మకంగా ప్రాణం తీయడాన్ని సూచిస్తుంది; ఉద్దేశాన్ని అస్పష్టంగా చేయకుండా స్పష్టంగా అందిస్తుంది.
- source_word: εἰσιν ἕτοιμοι
  choice: వారు సిద్ధంగా ఉండి
  rationale: వారు అప్పటికే కార్యాచరణకు సిద్ధంగా ఉన్నారనే స్థితిని సరళంగా వ్యక్తపరుస్తుంది.
- source_word: προσδεχόμενοι
  choice: ఎదురుచూస్తున్నారు
  rationale: ఆశతో లేదా నిరీక్షణతో వేచి ఉండడమనే వర్తమాన కృదంత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: τὴν ἀπὸ σοῦ ἐπαγγελίαν
  choice: నీ నుండి సమ్మతి వస్తుందని
  rationale: ἐπαγγελία యొక్క సాధారణ అర్థం ‘వాగ్దానం’ అయినా, ఈ సందర్భంలో అధికారియిచ్చే అంగీకారం లేదా అనుమతినే సూచిస్తుంది; ప్రధాన వాక్యంలో సహజమైన సందర్భార్థాన్ని ఇచ్చి, ప్రత్యక్ష రూపాన్ని పాదసూచికలో ఉంచింది.
