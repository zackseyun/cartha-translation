translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. సందర్భంలోని ప్రత్యక్ష సంభాషణకు అనుగుణంగా ఏకవచన ‘నువ్వు/నీ’ వాడబడింది. ‘మాటువేసి’ అనే సహజ ప్రయోగం దాడి కోసం పొంచి ఉండడాన్ని నిలుపుతుంది; శాపంతో కూడిన ప్రమాణభావం ప్రధాన పాఠ్యంలోనూ పాదసూచికలోనూ స్పష్టంగా ఉంచబడింది.
