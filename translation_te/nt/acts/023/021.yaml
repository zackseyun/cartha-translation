  to: కాబట్టి మీరు వారి మాటకు ఒప్పుకోవద్దు. ఎందుకంటే వారిలో నలభై మందికంటే ఎక్కువమంది అతనిపై దాడి చేయడానికి పొంచి ఉన్నారు. అతన్ని చంపేవరకు తినకుండా, తాగకుండా ఉంటామని వారు తమను తాము శాపానికి లోబరచుకున్నారు[a]. ఇప్పుడు వారు సిద్ధంగా ఉండి, మీ నుండి వచ్చే వాగ్దానం కోసం ఎదురుచూస్తున్నారు[b].
  rationale: The revision restores “వాగ్దానం” in the main text for the Greek ἐπαγγελία and confines the contextual interpretation to the footnote. It also uses respectful modern Telugu address appropriate to the dialogue’s social setting and makes the hostile purpose of the ambush explicit without adding a distinct event.
