review_pass:
  verdict: revise
  source_fidelity: 'The translation accurately conveys the impending-action force of μέλλει + infinitive, the whitewashed-wall metaphor, and the contrast between judging according to the law and acting unlawfully. A small adjustment is warranted: the Greek places God''s threatened action before the vocative insult, and κρίνων is better represented as the attendant role/action of one seated in judgment rather than a purpose clause.'
  naturalness: The Telugu is clear and modern. Reordering the opening rebuke and using ‘తీర్పు తీర్చడానికి’ gives a more direct, idiomatic judicial expression while retaining the sharp rhetorical question.
  terminology: ‘ధర్మశాస్త్రం’ appropriately maintains the legal-register repetition of νόμος. ‘సున్నం పూసిన గోడా’ faithfully retains the concrete metaphor without interpretive expansion. The footnote accurately records the less imminent future alternative.
  issues:
  - severity: low
    issue: The vocative ‘సున్నం పూసిన గోడా!’ precedes the threat in the draft.
    rationale: The Greek order is ‘God is about to strike you, whitewashed wall.’ Reversing the Telugu clauses preserves the source's rhetorical progression without harming naturalness.
  - severity: low
    issue: ‘నాకు తీర్పు చెప్పడానికి కూర్చుని’ makes κρίνων sound primarily purposive.
    rationale: κρίνων is a present participle describing the person's judicial activity while seated. ‘నన్ను ధర్మశాస్త్రం ప్రకారం తీర్పు తీర్చడానికి కూర్చుని’ more naturally represents the judicial setting and action in Telugu.
