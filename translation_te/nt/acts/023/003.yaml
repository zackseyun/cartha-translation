id: ACT.23.3
reference: Acts 23:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν· Τύπτειν σε μέλλει ὁ θεός, τοῖχε κεκονιαμένε· καὶ σὺ κάθῃ κρίνων με κατὰ τὸν νόμον, καὶ παρανομῶν κελεύεις με τύπτεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/003.yaml
  text: Then Paul said to him[a], “God is about to strike you, you whitewashed wall! And do you sit judging me according to the law, and yet in violation of the law command me to be struck?”
translation:
  language: te
  text: అప్పుడు పౌలు అతనితో, “దేవుడు నిన్ను కొట్టబోతున్నాడు, సున్నం పూసిన గోడా![a] నువ్వు ధర్మశాస్త్రం ప్రకారం నన్ను తీర్పు తీర్చడానికి కూర్చుని, ధర్మశాస్త్రానికి విరుద్ధంగా నన్ను కొట్టమని ఆజ్ఞాపిస్తున్నావా?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు నిన్ను కొడతాడు.” గ్రీకులో అక్షరార్థంగా, “దేవుడు నిన్ను కొట్టబోతున్నాడు” అని ఉంది; ఇది ఆ చర్య అతి త్వరలో జరగబోతోందని నొక్కిచెప్పవచ్చు.
    reason: μέλλει + infinitiveలోని సమీప భవిష్యత్తు భావాన్ని తెలియజేస్తూ, సాధారణ భవిష్యత్తు అనువాద ప్రత్యామ్నాయాన్ని నమోదు చేయడం.
lexical_decisions:
- source_word: Τύπτειν σε μέλλει ὁ θεός
  choice: దేవుడు నిన్ను కొట్టబోతున్నాడు
  rationale: μέλλει + క్రియార్థక రూపం సాధారణంగా త్వరలో లేదా సమీప భవిష్యత్తులో జరగనున్న చర్యను సూచిస్తుంది. ‘కొట్టబోతున్నాడు’ ఆ సమీపతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; సాధారణ భవిష్యత్తు రూపమైన ‘కొడతాడు’ను పాదసూచికలో ఇచ్చాం.
- source_word: τοῖχε κεκονιαμένε
  choice: సున్నం పూసిన గోడా
  rationale: κεκονιαμένε అనేది సున్నం లేదా పూత పూయబడిన స్థితిని సూచించే సంపూర్ణ కృదంతం. ‘సున్నం పూసిన గోడ’ మూలంలోని దృశ్యరూపకాన్ని వివరణతో భర్తీ చేయకుండా నిలుపుతుంది.
- source_word: κάθῃ
  choice: కూర్చుని
  rationale: పౌలు ఎదుట న్యాయనిర్ణేతగా కూర్చున్న concrete భావాన్ని నిలుపుతూ, తెలుగు వాక్యనిర్మాణంలో సహజంగా rhetorical questionతో కలుస్తుంది.
- source_word: κρίνων με κατὰ τὸν νόμον
  choice: ధర్మశాస్త్రం ప్రకారం నాకు తీర్పు చెప్పడానికి
  rationale: κατά ఇక్కడ ధర్మశాస్త్రాన్ని ప్రమాణంగా తీసుకోవడాన్ని సూచిస్తుంది. ‘ధర్మశాస్త్రం ప్రకారం’ అనే రూపం న్యాయసంబంధ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: παρανομῶν
  choice: ధర్మశాస్త్రానికి విరుద్ధంగా
  rationale: ఈ కృదంతం ధర్మశాస్త్రానికి వ్యతిరేకంగా ప్రవర్తించడాన్ని సూచిస్తుంది. ముందు వచ్చిన ‘ధర్మశాస్త్రం ప్రకారం’తో ఉద్దేశపూర్వకమైన వ్యత్యాసాన్ని ఈ ఎంపిక నిలుపుతుంది.
- source_word: κελεύεις με τύπτεσθαι
  choice: నన్ను కొట్టమని ఆజ్ఞాపిస్తున్నావా
  rationale: κελεύω యొక్క అధికారపూర్వక భావాన్ని ‘ఆజ్ఞాపించు’ తెలియజేస్తుంది; τύπτεσθαιలోని కర్మణి భావం తెలుగులో సహజమైన ‘నన్ను కొట్టమని’ నిర్మాణం ద్వారా వ్యక్తమవుతుంది.
- source_word: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν
  choice: అప్పుడు పౌలు అతనితో … అన్నాడు
  rationale: మూలంలోని సరళమైన కథన పరిచయాన్ని అదనపు వివరణ లేకుండా సహజ తెలుగు మాటల క్రమంలో అందిస్తుంది.
theological_decisions:
- issue: ‘దేవుడు నిన్ను కొట్టబోతున్నాడు’ అనే పౌలు మాట స్వభావం
  choice: కోరిక లేదా శాపవాక్యంగా కాక, దేవుడు త్వరలో చేయబోయే కార్యాన్ని ప్రకటించే వాక్యంగా అనువదించాం.
  alternative: ‘దేవుడు నిన్ను కొట్టుగాక’ అనే శాపం లేదా కోరికగా అనువదించడం.
  rationale: μέλλει + క్రియార్థక రూపం సాధారణంగా జరగబోయే చర్యను ప్రకటిస్తుంది; కోరికను వ్యక్తం చేయదు. పౌలు మాట నైతికంగా సముచితమా కాదా అనే తీర్పును అనువాదంలో చేర్చకుండా, మూలంలోని న్యాయ/ప్రవచన ఉద్వేగాన్ని యథాతథంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే న్యాయస్థాన సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. ‘ధర్మశాస్త్రం ప్రకారం/ధర్మశాస్త్రానికి విరుద్ధంగా’ అనే సమాంతర వ్యత్యాసం మరియు పౌలు ప్రశ్నలోని పదును నిలుపబడ్డాయి.
