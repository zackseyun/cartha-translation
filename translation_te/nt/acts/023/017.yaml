translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. రోమా సైనిక హోదాలకు తెలుగు బైబిలు పాఠకులకు పరిచితమైన ‘శతాధిపతి,’ ‘సహస్రాధిపతి’ పదాలను నిలిపాం; సంభాషణలో గౌరవార్థక క్రియారూపాన్ని వాడాం.
