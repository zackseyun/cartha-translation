  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: προσκαλεσάμενος δὲ ὁ Παῦλος ἕνα τῶν ἑκατονταρχῶν ἔφη· Τὸν νεανίαν τοῦτον ⸀ἄπαγε πρὸς τὸν χιλίαρχον, ἔχει γὰρ ⸂ἀπαγγεῖλαί τι⸃ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/017.yaml
  text: So Paul called one of the centurions and said[a], “Take this young man to the commander, for he has something to report to him.”
translation:
  language: te
  text: అప్పుడు పౌలు శతాధిపతుల్లో ఒకరిని తన దగ్గరికి పిలిచి, “ఈ యువకుణ్ణి సహస్రాధిపతి దగ్గరికి తీసుకెళ్లండి; ఇతడు ఆయనకు ఒక విషయం తెలియజేయాలి[a]” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చెప్పాలి.’ గ్రీకు క్రియకు నివేదించడం, ప్రకటించడం లేదా చెప్పడం అనే అర్థాలు రావచ్చు. ఇక్కడ అత్యవసర సమాచారాన్ని చేరవేస్తున్న సందర్భం కావడంతో ‘తెలియజేయాలి’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: తన దగ్గరికి పిలిచి
  rationale: క్రియలోని తనవైపు పిలిపించుకోవడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ వ్యతిరేకత కంటే కథనంలోని తదుపరి చర్యను సూచిస్తుంది; ‘అప్పుడు’ ఆ కథన ప్రవాహాన్ని సహజంగా కొనసాగిస్తుంది.
- source_word: ἕνα τῶν ἑκατονταρχῶν
  choice: శతాధిపతుల్లో ఒకరిని
  rationale: ἑκατοντάρχης అనే రోమా సైనిక హోదాకు తెలుగు బైబిలు వాడుకలో స్థిరపడిన, మూలపద నిర్మాణాన్నీ ప్రతిబింబించే సమానార్థకం.
- source_word: νεανίαν
  choice: యువకుణ్ణి
  rationale: νεανίας సూచించే యువ పురుషుణ్ణి సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἄπαγε
  choice: తీసుకెళ్లండి
  rationale: ఒక వ్యక్తిని మరొకరి దగ్గరికి వెంట తీసుకుపోవాలనే ఆజ్ఞను సహజంగా వ్యక్తం చేస్తుంది; గౌరవార్థక బహువచనం తెలుగు సంభాషణకు తగినది.
- source_word: πρὸς τὸν χιλίαρχον
  choice: సహస్రాధిపతి దగ్గరికి
  rationale: χιλίαρχος అనే సైనిక హోదాను మూలానికి దగ్గరగా ఉంచుతూ, పాఠకులకు అర్థమయ్యే ప్రాచుర్యమైన తెలుగు పదాన్ని ఉపయోగిస్తుంది.
- source_word: ἔχει γὰρ ἀπαγγεῖλαί τι αὐτῷ
  choice: ఇతడు ఆయనకు ఒక విషయం తెలియజేయాలి
  rationale: ἔχει + infinitive నిర్మాణంలోని చేయవలసిన విషయం ఉందనే భావాన్నీ, ἀπαγγέλλωలోని సమాచారం అందించడం లేదా నివేదించడం అనే భావాన్నీ సహజమైన తెలుగులో అందిస్తుంది.
