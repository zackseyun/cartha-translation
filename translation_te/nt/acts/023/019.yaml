id: ACT.23.19
reference: Acts 23:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπιλαβόμενος δὲ τῆς χειρὸς αὐτοῦ ὁ χιλίαρχος καὶ ἀναχωρήσας κατ’ ἰδίαν ἐπυνθάνετο· Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/019.yaml
  text: So the commander took him by the hand and[a], drawing aside in private, began asking[b], “What is it that you have to report to me?”
translation:
  language: te
  text: అప్పుడు సైనికాధికారి ఆ యువకుని చెయ్యి పట్టుకొని, అతణ్ణి పక్కకు తీసుకువెళ్లి, ఏకాంతంలో, “నువ్వు నాకు తెలియజేయాల్సిన విషయం ఏమిటి?” అని అడగడం మొదలుపెట్టాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος ... τῆς χειρὸς αὐτοῦ
  choice: ఆ యువకుని చెయ్యి పట్టుకొని
  rationale: ఈ పదబంధం అతని చెయ్యిని పట్టుకోవడమనే స్పష్టమైన చర్యను సూచిస్తుంది. సందర్భం వల్ల సర్వనామాన్ని ‘ఆ యువకుని’గా వ్యక్తం చేయడం తెలుగులో సహజంగా ఉంటుంది; ‘పట్టుకొని’ అనవసరంగా బలప్రయోగాన్ని సూచించదు.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ δέ కథనంలోని తదుపరి చర్యకు మార్పును సూచిస్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు’ సహజమైన కథన అనుసంధానం.
- source_word: ὁ χιλίαρχος
  choice: సేనాధిపతి
  rationale: χילίαρχος రోమా సైన్యంలోని ఉన్నతాధికారిని సూచిస్తుంది. ‘సేనాధిపతి’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, హోదా యొక్క సైనిక స్వభావాన్ని నిలుపుతుంది.
- source_word: ἀναχωρήσας κατ’ ἰδίαν
  choice: అతణ్ణి పక్కకు తీసుకెళ్లి ఏకాంతంగా
  rationale: ἀναχωρήσας దూరంగా లేదా పక్కకు వెళ్లడాన్ని, κατ’ ἰδίαν ఇతరులకు వినబడని వ్యక్తిగత పరిస్థితిని సూచిస్తాయి. గ్రీకులో కర్మ ప్రత్యక్షంగా లేకపోయినా, సందర్భానుసారంగా యువకుడినే పక్కకు తీసుకెళ్లాడని తెలుగులో స్పష్టం చేయడం సహజం.
- source_word: ἐπυνθάνετο
  choice: అడిగాడు
  rationale: అసంపూర్ణ భూతకాల రూపం అడగడం ప్రారంభించడం లేదా ప్రశ్నిస్తూ ఉండడం అనే ఛాయను కలిగి ఉండవచ్చు. అయితే ఒక ప్రత్యక్ష ప్రశ్నను పరిచయం చేసే తెలుగు కథనంలో ‘అడిగాడు’ అత్యంత సహజం; ప్రత్యామ్నాయ ఛాయను పాదసూచికలో ఉంచాం.
- source_word: Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι
  choice: నువ్వు నాకు తెలియజేయాల్సిన విషయం ఏమిటి?
  rationale: ἔχεις + infinitive ఇక్కడ అతడు తెలియజేయదలచిన లేదా తెలియజేయవలసిన విషయాన్ని సూచిస్తుంది; ἀπαγγεῖλαι సమాచారాన్ని నివేదించడం లేదా తెలియజేయడం. ఈ రూపం సైనిక-న్యాయ సందర్భానికి సరిపోయే గౌరవప్రదమైన, సహజమైన తెలుగు.
