translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలి ఉపయోగించబడింది. ‘నువ్వు’ అనేది అధికారి యువకునితో మాట్లాడే సందర్భానికి తగిన సహజ ఏకవచన సంబోధన. వాక్య నిర్మాణం మూలంలోని చర్యల క్రమాన్ని నిలుపుతూ, తెలుగులో భారంగా అనిపించకుండా మార్చబడింది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
