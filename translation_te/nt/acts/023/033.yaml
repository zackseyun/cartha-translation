translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, అధికారిక సందర్భానికి తగిన గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని చర్యల క్రమాన్ని ‘ప్రవేశించి… అందజేసి… హాజరుపరిచారు’ అనే నిర్మాణంతో నిలిపి ఉంచింది.
