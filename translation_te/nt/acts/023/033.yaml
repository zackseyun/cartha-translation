revisions:
- from: వారు కైసరయలో ప్రవేశించి, గవర్నరుకు ఉత్తరాన్ని అందజేసి[a], పౌలును కూడా అతని ఎదుట హాజరుపరిచారు[b].
  to: వారు కైసరయ నగరంలోకి ప్రవేశించి, గవర్నరుకు ఉత్తరాన్ని అందజేసి[a], పౌలును కూడా అతని ఎదుట హాజరుపరిచారు[b].
