id: ACT.23.33
reference: Acts 23:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἵτινες εἰσελθόντες εἰς τὴν Καισάρειαν καὶ ἀναδόντες τὴν ἐπιστολὴν τῷ ἡγεμόνι παρέστησαν καὶ τὸν Παῦλον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/033.yaml
  text: When they entered Caesarea and delivered the letter to the governor[b][a], they also presented Paul to him.
translation:
  language: te
  text: వారు కైసరయ నగరంలోకి ప్రవేశించి, గవర్నరుకు ఉత్తరాన్ని అందజేసి[a], పౌలును కూడా అతని ఎదుట హాజరుపరిచారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గవర్నరుకు ఉత్తరాన్ని అప్పగించి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పౌలును కూడా అతని ఎదుటకు తీసుకువచ్చారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: వారు
  rationale: మునుపటి వచనంలో పేర్కొన్న సైనికులను సూచిస్తుంది. తెలుగులో స్వతంత్ర వాక్యానికి ‘వారు’ సహజమైన కర్త.
- source_word: εἰσελθόντες
  choice: ప్రవేశించి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను తెలిపే భూతకాల క్రియావిశేషణ రూపాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Καισάρειαν
  choice: కైసరయ
  rationale: స్థలనామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: ἀναδόντες
  choice: అందజేసి
  rationale: అధికారికి అధికారిక ఉత్తరాన్ని సమర్పించిన సందర్భానికి తగిన, సహజమైన పదం; ‘అప్పగించి’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: ἐπιστολήν
  choice: ఉత్తరం
  rationale: అధికారికంగా పంపిన లిఖిత సందేశాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἡγεμόνι
  choice: గవర్నరుకు
  rationale: ఇక్కడ రోమా ప్రాంతీయ పాలనాధికారిని సూచిస్తుంది; ‘గవర్నరు’ ఆధునిక తెలుగులో ఖచ్చితంగా, సులభంగా అర్థమవుతుంది.
- source_word: παρέστησαν
  choice: ఎదుట హాజరుపరిచారు
  rationale: ఒక వ్యక్తిని అధికారికంగా పాలనాధికారి సమక్షంలో నిలబెట్టడం లేదా అప్పగించడం అనే న్యాయపరమైన సందర్భాన్ని వ్యక్తం చేస్తుంది.
- source_word: καὶ
  choice: కూడా
  rationale: ఉత్తరాన్ని అందజేయడంతో పాటు పౌలును సైతం హాజరుపరిచారనే అదనపు భావాన్ని స్పష్టం చేస్తుంది.
- source_word: Παῦλον
  choice: పౌలును
  rationale: వ్యక్తి పేరుకు తెలుగులో స్థిరపడిన రూపం; వాక్యంలో కర్మను సూచించే విభక్తితో వాడబడింది.
- source_word: αὐτῷ
  choice: అతని ఎదుట
  rationale: సర్వనామం గవర్నరును సూచిస్తుంది; ఎంచుకున్న క్రియతో ‘అతని ఎదుట’ సహజంగా సరిపోతుంది.
