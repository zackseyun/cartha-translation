  terminology: “శతాధిపతి,” “కైసరయ,” and “బల్లెపు యోధులు” are appropriate. The lexical uncertainty of δεξιολάβους is retained in the footnote without presenting the alternative as certain.
  issues:
  - severity: medium
    issue: Temporal participial attachment is ambiguous in the draft.
