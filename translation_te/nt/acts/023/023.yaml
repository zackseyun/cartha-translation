  revised_text: అతడు శతాధిపతుల్లో ఇద్దరిని తన దగ్గరికి పిలిచి, “రాత్రి మూడో గంటకు[b] కైసరయ వరకు బయలుదేరేందుకు రెండువందల మంది సైనికులను, డెబ్బై మంది అశ్వదళ సైనికులను, రెండువందల మంది బల్లెపు యోధులను[a] సిద్ధం చేయండి” అని చెప్పాడు.
