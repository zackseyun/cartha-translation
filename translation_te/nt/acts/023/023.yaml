translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన సైనిక కథన శైలిని ఉపయోగించాం. ప్రాచీన హోదా ‘శతాధిపతి’ని నిలిపి, అశ్వదళాన్ని సాధారణ పాఠకునికి స్పష్టంగా చెప్పాం. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల దగ్గరే ఉంచాం.
