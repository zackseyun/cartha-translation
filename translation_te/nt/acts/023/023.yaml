id: ACT.23.23
reference: Acts 23:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενός ⸂τινας δύο⸃ τῶν ἑκατονταρχῶν εἶπεν· Ἑτοιμάσατε στρατιώτας διακοσίους ὅπως πορευθῶσιν ἕως Καισαρείας, καὶ ἱππεῖς ἑβδομήκοντα καὶ δεξιολάβους διακοσίους, ἀπὸ τρίτης ὥρας τῆς νυκτός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/023.yaml
  text: And calling two of the centurions to him[a], he said, “Prepare two hundred soldiers to go as far as Caesarea, and seventy horsemen and two hundred spearmen[b], at the third hour of the night.”
translation:
  language: te
  text: అతడు శతాధిపతుల్లో ఇద్దరిని తన దగ్గరికి పిలిచి, “రాత్రి మూడో గంటకు[b] కైసరయ వరకు బయలుదేరేందుకు రెండువందల మంది సైనికులను, డెబ్బై మంది అశ్వదళ సైనికులను, రెండువందల మంది బల్లెపు యోధులను[a] సిద్ధం చేయండి” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కుడిచేతి గార్డులు.” “బల్లెపు యోధులు” అని అనువదించిన అరుదైన గ్రీకు పదం యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం.
    reason: lexical_alternative
  - marker: b
    text: అంటే, రాత్రి ప్రారంభమైన తర్వాత మూడో గంట; యూదుల కాలగణన ప్రకారం సుమారు రాత్రి 9 గంటలకు.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενός
  choice: తన దగ్గరికి పిలిచి
  rationale: మధ్యమ ప్రయోగంలోని ఈ భూతకాల అసమాపక క్రియ, వారిని తన సమక్షానికి పిలిపించుకున్న భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τινας δύο τῶν ἑκατονταρχῶν
  choice: శతాధిపతుల్లో ఇద్దరిని
  rationale: τινας రెండు అనే సంఖ్యను స్వల్పంగా అనిర్దిష్టం చేస్తుంది; తెలుగులో ‘ఇద్దరిని’ అనడం సహజం. ἑκατοντάρχης అనే రోమా సైనిక హోదాకు ‘శతాధిపతి’ స్థిరమైన, గౌరవప్రదమైన పదం.
- source_word: Ἑτοιμάσατε
  choice: సిద్ధం చేయండి
  rationale: అధికారిక సైనిక ఆజ్ఞ యొక్క ప్రత్యక్షతను, బహువచన సంబోధనను నిలుపుతుంది.
- source_word: στρατιώτας διακοσίους
  choice: రెండువందల మంది సైనికులను
  rationale: ఇతర ప్రత్యేక దళాల నుంచి వేరుగా పేర్కొన్న సాధారణ సైనిక వర్గాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: ὅπως πορευθῶσιν
  choice: వెళ్లడానికి
  rationale: ὅπως తో కూడిన సంభావనార్థక క్రియ తెలిపే ఉద్దేశాన్ని సహజమైన తెలుగు ప్రయోజనార్థక నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: ἕως Καισαρείας
  choice: కైసరయ వరకు
  rationale: ἕως తెలిపే గమ్య పరిమితిని ‘వరకు’ నేరుగా నిలుపుతుంది.
- source_word: ἱππεῖς ἑβδομήκοντα
  choice: డెబ్బై మంది గుర్రపు దళ సైనికులను
  rationale: ఇది కేవలం గుర్రపు స్వారీలను కాక సైనిక అశ్వదళాన్ని సూచిస్తుందని ఆధునిక పాఠకునికి స్పష్టం చేస్తుంది.
- source_word: δεξιολάβους διακοσίους
  choice: రెండువందల మంది బల్లెపు యోధులను
  rationale: అరుదైన ఈ సైనిక పదం యొక్క ఖచ్చితమైన అర్థం వివాదాస్పదం. సందర్భానికి సరిపోయే సాధారణ అర్థంగా ‘బల్లెపు యోధులు’ ఎంచుకొని, అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: ἀπὸ τρίτης ὥρας τῆς νυκτός
  choice: రాత్రి మూడో గంటకు బయలుదేరి
  rationale: ἀπό తెలిపే ఆరంభ సమయాన్ని ప్రయాణారంభంతో సహజంగా అనుసంధానిస్తూ, ప్రాచీన కాలగణనను ప్రధాన వాక్యంలో నిలుపుతుంది.
