- from: అతడు శతాధిపతుల్లో ఇద్దరిని తన దగ్గరికి పిలిచి, “రాత్రి మూడో గంటకు[b] బయలుదేరి కైసరయ వరకు వెళ్లడానికి రెండువందల మంది సైనికులను, డెబ్బై మంది గుర్రపు దళ సైనికులను, రెండువందల మంది బల్లెపు యోధులను[a] సిద్ధం చేయండి” అని చెప్పాడు.
