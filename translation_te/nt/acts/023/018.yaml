id: ACT.23.18
reference: Acts 23:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ μὲν οὖν παραλαβὼν αὐτὸν ἤγαγεν πρὸς τὸν χιλίαρχον καὶ φησίν· Ὁ δέσμιος Παῦλος προσκαλεσάμενός με ἠρώτησεν τοῦτον τὸν ⸀νεανίαν ἀγαγεῖν πρὸς σέ, ἔχοντά τι λαλῆσαί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/018.yaml
  text: So he took him and brought him to the commander and said[a], “The prisoner Paul called me to him and asked me to bring this young man to you[b], because he has something to say to you.”
translation:
  language: te
  text: అప్పుడు అతడు ఆ యువకుణ్ణి వెంటబెట్టుకొని సైన్యాధిపతి[a] దగ్గరికి తీసుకువెళ్లి, “ఖైదీ పౌలు నన్ను తన దగ్గరికి పిలిపించుకొని, మీతో ఏదో చెప్పవలసి ఉన్న ఈ యువకుణ్ణి మీ దగ్గరికి తీసుకురమ్మని అడిగాడు” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదం χιλίαρχος; ఇది రోమా సైన్యంలోని ఒక ఉన్నతాధికారిని సూచిస్తుంది. అక్షరార్థంగా ‘వెయ్యిమందికి అధిపతి’; సాంప్రదాయంగా ‘సహస్రాధిపతి’ అని కూడా అనువదిస్తారు.
    reason: cultural_note
lexical_decisions:
- source_word: παραλαβὼν αὐτὸν
  choice: అతడు ఆ యువకుణ్ణి వెంటబెట్టుకొని
  rationale: παραλαμβάνω ఇక్కడ యువకుణ్ణి తనతో తీసుకొని వెళ్లడాన్ని సూచిస్తుంది. సందర్భంలోని పూర్వపదాన్ని స్పష్టంగా చూపేందుకు αὐτόν‌ను ‘ఆ యువకుణ్ణి’ అని అనువదించాం.
- source_word: ἤγαγεν πρὸς τὸν χιλίαρχον
  choice: సైన్యాధిపతి దగ్గరికి తీసుకువెళ్లి
  rationale: ἄγω గమ్యస్థానానికి నడిపించడం లేదా తీసుకువెళ్లడం; χιλίαρχος రోమా సైన్యంలోని ఉన్నతాధికారి. ‘సైన్యాధిపతి’ ఆధునిక తెలుగు పాఠకులకు సహజంగా అర్థమవుతుంది.
- source_word: φησίν
  choice: అని చెప్పాడు
  rationale: గ్రీకులో ఇది చారిత్రక వర్తమాన కాలంలో ఉన్నా, తెలుగు కథనశైలిలో భూతకాల రూపం సహజం.
- source_word: Ὁ δέσμιος Παῦλος
  choice: ఖైదీ పౌలు
  rationale: δέσμιος బంధంలో లేదా నిర్బంధంలో ఉన్న వ్యక్తిని సూచిస్తుంది; ఈ సందర్భంలో ‘ఖైదీ’ స్పష్టమైన సాధారణ పదం.
- source_word: προσκαλεσάμενός με
  choice: నన్ను తన దగ్గరికి పిలిపించుకొని
  rationale: మధ్యమ రూపం పౌలు అతణ్ణి తన దగ్గరకు పిలిపించుకున్న భావాన్ని తెలియజేస్తుంది.
- source_word: ἠρώτησεν ... ἀγαγεῖν
  choice: తీసుకురమ్మని అడిగాడు
  rationale: ἐρωτάω ఇక్కడ ప్రశ్నించడం కాక అభ్యర్థించడం అనే అర్థంలో ఉంది; తెలుగు పరోక్ష వాక్యంలో ఈ నిర్మాణం సహజం.
- source_word: νεανίαν
  choice: యువకుణ్ణి
  rationale: νεανίας యువ పురుషుణ్ణి సూచిస్తుంది; ‘యువకుడు’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన పదం.
- source_word: ἔχοντά τι λαλῆσαί σοι
  choice: నీతో ఏదో చెప్పవలసి ఉన్న
  rationale: ఈ కృదంత పదబంధం యువకుణ్ణి విశేషిస్తూ, అతడు అధికారితో ఏదో చెప్పాలనుకుంటున్నాడని తెలియజేస్తుంది. మూలంలోని ‘ఏదో’ అనే అనిర్దిష్టతను నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. అధికారి సమక్షంలో సైనికుడు మాట్లాడుతున్నప్పటికీ, గ్రీకు ఏకవచన సంబోధనను అనుసరించి ‘నీతో/నీ దగ్గరికి’ రూపాలను ఉంచాం. మూలంలో లేని కారణసూచక పదాన్ని ప్రత్యేకంగా చేర్చకుండా కృదంత సంబంధాన్ని తెలుగులో విశేషణ నిర్మాణంతో వ్యక్తం చేశాం.
