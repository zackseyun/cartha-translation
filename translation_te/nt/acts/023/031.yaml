id: ACT.23.31
reference: Acts 23:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν στρατιῶται κατὰ τὸ διατεταγμένον αὐτοῖς ἀναλαβόντες τὸν Παῦλον ἤγαγον ⸀διὰ νυκτὸς εἰς τὴν Ἀντιπατρίδα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/031.yaml
  text: So the soldiers[a], according to what had been ordered them[b], took Paul and brought him by night to Antipatris.
translation:
  language: te
  text: కాబట్టి సైనికులు తమకు ఆజ్ఞాపించబడిన ప్రకారం పౌలును వెంటబెట్టుకొని, రాత్రివేళ అంతిపత్రికి తీసుకువెళ్లారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ μὲν οὖν στρατιῶται
  choice: కాబట్టి సైనికులు
  rationale: οὖν కథనంలోని కొనసాగింపును, ముందటి ఆజ్ఞకు అనుగుణంగా జరిగిన చర్యను సూచిస్తుంది; μέν‌ను తెలుగులో విడిగా అనువదిస్తే అసహజంగా ఉంటుంది.
- source_word: κατὰ τὸ διατεταγμένον αὐτοῖς
  choice: తమకు ఆజ్ఞాపించబడిన ప్రకారం
  rationale: διατάσσω యొక్క సంపూర్ణ కర్మణి అసమాపక రూపం ముందే వారికి ఇవ్వబడిన ఆజ్ఞను సూచిస్తుంది; ఈ అనువాదం కర్మణి భావాన్ని నిలుపుతుంది.
- source_word: ἀναλαβόντες
  choice: వెంటబెట్టుకొని
  rationale: ఈ సందర్భంలో పౌలును తమ అధీనంలో తీసుకొని ప్రయాణానికి వెంట తీసుకెళ్లిన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; 'ఎత్తుకొని' అనే అనవసర శారీరక భావాన్ని నివారిస్తుంది.
- source_word: ἤγαγον
  choice: తీసుకువెళ్లారు
  rationale: గమ్యస్థానం పేర్కొనబడినందున ἄγω ఇక్కడ ఒకరిని అక్కడికి తీసుకెళ్లడం అనే భావంలో ఉంది.
- source_word: διὰ νυκτός
  choice: రాత్రివేళ
  rationale: διά + νυκτός రాత్రి సమయంలో జరిగిన ప్రయాణాన్ని సూచిస్తుంది; ప్రయాణం రాత్రంతా కొనసాగిందని తప్పనిసరిగా చెప్పదు.
- source_word: Ἀντιπατρίδα
  choice: అంతిపత్రికి
  rationale: గ్రీకు స్థలనామాన్ని తెలుగు ధ్వని, విభక్తి పద్ధతులకు అనుగుణంగా లిప్యంతరీకరించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని చర్యల క్రమాన్ని నిలుపుతూ, అసమాపక క్రియను సహజమైన తెలుగు సంయుక్త క్రియగా మలిచాం.
