  text: Ἀκούσας δὲ ὁ υἱὸς τῆς ἀδελφῆς Παύλου ⸂τὴν ἐνέδραν⸃ παραγενόμενος καὶ εἰσελθὼν εἰς τὴν παρεμβολὴν ἀπήγγειλεν τῷ Παύλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/016.yaml
  text: But when Paul’s sister’s son heard of the ambush[c][b][a], he came and entered the barracks and reported it to Paul.
translation:
  language: te
  text: అయితే, పౌలు సోదరి కుమారుడు[a] ఆ మాటు[b] గురించి విని, వచ్చి సైనిక శిబిరంలోకి[c] ప్రవేశించి పౌలుకు ఆ సంగతి తెలియజేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘పౌలు సోదరి కుమారుడు’; అంటే పౌలు మేనల్లుడు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పన్నాగం’ లేదా ‘కుట్ర.’ గ్రీకు పదం మరింత నిర్దిష్టంగా దాగి ఉండి దాడి చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘సైనికుల శిబిరంలోకి.’ ఈ సందర్భంలో ఈ పదం రోమా సైనికుల బారక్సును సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: గురించి విని
  rationale: అనంతర చర్యకు ముందు జరిగిన క్రియను సూచించే aorist participle; తెలుగులో సహజమైన క్రమాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: కుట్ర నుండి అది బయటపడిన సందర్భానికి కథన మలుపును, స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: ὁ υἱὸς τῆς ἀδελφῆς Παύλου
  choice: పౌలు సోదరి కుమారుడు
  rationale: మూలంలోని బంధుత్వ వర్ణనను వ్యాఖ్యానాత్మక సంక్షిప్త పదం కంటే నేరుగా, స్పష్టంగా నిలుపుతుంది.
- source_word: τὴν ἐνέδραν
  choice: ఆ మాటు
  rationale: ἐνέδρα సూచించే దాగి ఉండి దాడి చేయాలనే నిర్దిష్ట భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: παραγενόμενος
  choice: వచ్చి
  rationale: తదుపరి ప్రవేశ చర్యకు ముందు అతడు అక్కడికి చేరడాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: εἰσελθὼν εἰς τὴν παρεμβολὴν
  choice: సైనిక శిబిరంలోకి ప్రవేశించి
  rationale: παρεμβολήకు శిబిరం లేదా సైనికుల నివాస స్థలం అనే అర్థాలు ఉన్నాయి; యెరూషలేములోని రోమా సైనిక సందర్భాన్ని స్పష్టం చేస్తూనే మూలపద విస్తృతిని నిలుపుతుంది.
- source_word: ἀπήγγειλεν
  choice: ఆ సంగతి తెలియజేశాడు
  rationale: తెలుసుకున్న సమాచారాన్ని పౌలుకు చేరవేశాడనే నివేదిక భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: τῷ Παύλῳ
  choice: పౌలుకు
  rationale: దత్తివాచక పరోక్ష కర్మను తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
