id: ACT.23.24
reference: Acts 23:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κτήνη τε παραστῆσαι ἵνα ἐπιβιβάσαντες τὸν Παῦλον διασώσωσι πρὸς Φήλικα τὸν ἡγεμόνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/024.yaml
  text: and provide mounts[a], so that they may put Paul on them and bring him safely to Felix the governor[b],
translation:
  language: te
  text: పౌలును వాటిపై ఎక్కించి, అతనిని గవర్నరు ఫేలిక్సు వద్దకు క్షేమంగా చేర్చడానికి స్వారీ జంతువులను కూడా[a] సిద్ధం చేయండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “జంతువులను” లేదా “బరువు మోయు జంతువులను”; గ్రీకు పదం ఏ రకమైన జంతువో నిర్దిష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήνη
  choice: స్వారీ జంతువులను
  rationale: ఈ గ్రీకు పదం నిర్దిష్టంగా గుర్రాలను కాకుండా స్వారీకి లేదా బరువు మోయడానికి ఉపయోగించే జంతువులను సూచిస్తుంది. సందర్భంలో పౌలును ఎక్కించాలనే ఉద్దేశం ఉన్నందున ‘స్వారీ జంతువులు’ సహజంగా ఉండి, జంతువు రకాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: τε
  choice: వాక్య ప్రవాహంలో ప్రత్యేకంగా అనువదించలేదు
  rationale: τε ముందున్న ఆదేశాలతో దీనిని అనుసంధానిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ఆ సంబంధం సందర్భం ద్వారానే స్పష్టంగా ఉండడంతో ప్రత్యేక సంధాన పదం అవసరం లేదు.
- source_word: παραστῆσαι
  choice: సిద్ధంగా ఉంచండి
  rationale: ఆదేశ సందర్భంలో అవసరమైన జంతువులను అందుబాటులో సిద్ధం చేయించాలనే భావాన్ని ఇది సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα
  choice: చేర్చడానికి
  rationale: గ్రీకు ఉద్దేశార్థక భావాన్ని తెలుగు క్రియార్థక నిర్మాణంతో సహజంగా తెలిపింది.
- source_word: ἐπιβιβάσαντες
  choice: పౌలును వాటిపై ఎక్కించి
  rationale: ఈ కృదంతం పౌలును జంతువులపై ఎక్కించిన తరువాతి చర్యను సూచిస్తుంది; ‘ఎక్కించి’ చర్యల క్రమాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: διασώσωσι
  choice: క్షేమంగా చేర్చడానికి
  rationale: ప్రమాదం నుంచి కాపాడుతూ గమ్యానికి సురక్షితంగా తీసుకెళ్లే భావం రెండింటినీ ‘క్షేమంగా చేర్చడం’ వ్యక్తం చేస్తుంది.
- source_word: πρὸς
  choice: దగ్గరికి
  rationale: వ్యక్తి వైపు తీసుకెళ్లడాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: ἡγεμόνα
  choice: అధిపతి
  rationale: రోమా పరిపాలనా అధికారిని సూచించే గౌరవప్రదమైన, సాధారణ తెలుగు పదం; ‘పాలనాధికారి’ కూడా సాధ్యమే అయినా ఇది సంక్షిప్తంగా ఉంది.
