translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ఆదేశ వాక్యంగా రూపొందించబడింది. గ్రీకు మూలంలోని జంతువు రకానికి సంబంధించిన అనిర్దిష్టతను నిలుపుతూ, అధికారిక సందర్భానికి తగిన గౌరవప్రదమైన శైలి పాటించబడింది.
