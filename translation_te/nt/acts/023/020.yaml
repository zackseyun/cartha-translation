id: ACT.23.20
reference: Acts 23:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὅτι Οἱ Ἰουδαῖοι συνέθεντο τοῦ ἐρωτῆσαί σε ὅπως αὔριον ⸂τὸν Παῦλον καταγάγῃς εἰς τὸ συνέδριον⸃ ὡς ⸀μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/020.yaml
  text: He said[a], “The Jews have agreed to ask you to bring Paul down to the Sanhedrin tomorrow[b], as though they were going to inquire more accurately about him.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “యూదులు, అతని గురించి మరింత కచ్చితంగా విచారించబోతున్నట్టుగా, రేపు పౌలును సన్హెద్రిన్ మహాసభకు కిందికి తీసుకురమ్మని నిన్ను అడగడానికి అంగీకరించారు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: గ్రీకు పదబంధాన్ని నేరుగా అనువదించాం. సందర్భంలో ఇది పౌలుకు వ్యతిరేకంగా పన్నాగంలో పాల్గొన్న నిర్దిష్ట యూదుల సమూహాన్ని సూచిస్తుంది; యూదులందరినీ కాదు.
- source_word: συνέθεντο
  choice: ఒక నిర్ణయానికి వచ్చారు
  rationale: కలిసి అంగీకరించి ఒక పథకం నిర్ణయించుకున్న భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; పదానికే ‘కుట్రపన్నారు’ అనే తీవ్ర భావాన్ని జోడించదు.
- source_word: τοῦ ἐρωτῆσαί σε
  choice: నిన్ను అడగడానికి
  rationale: ఈ సందర్భంలో ἐρωτάω అభ్యర్థించడం అనే అర్థంలో ఉంది; ఉద్దేశాన్ని తెలిపే ఆర్టిక్యులర్ ఇన్ఫినిటివ్‌ను సహజంగా అనువదిస్తుంది.
- source_word: καταγάγῃς
  choice: కిందికి తీసుకురావాలని
  rationale: κατά-లోని దిగువకు కదలికను నిలుపుతూ, కోట ప్రాంతం నుంచి సభ దగ్గరికి పౌలును తీసుకురావడాన్ని సూచిస్తుంది.
- source_word: συνέδριον
  choice: మహాసభ
  rationale: ఇక్కడ యెరూషలేములోని యూదుల పాలక మండలైన సన్హెద్రినును సూచిస్తుంది. ‘మహాసభ’ సాధారణ తెలుగు పాఠకునికి సహజమైన సంస్థాగత పదం.
- source_word: ὡς
  choice: విచారించబోతున్నట్టుగా
  rationale: వారి ప్రకటిత ఉద్దేశం నిజమైనది కాదనే నటన లేదా నెపం భావాన్ని అతిగా విపులీకరించకుండా తెలియజేస్తుంది.
- source_word: μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ
  choice: అతని గురించి మరింత కచ్చితంగా విచారించబోతున్నట్టుగా
  rationale: μέλλον యొక్క ఉద్దేశ్య/సమీప కార్య భావాన్ని, πυνθάνομαι యొక్క విచారణ ద్వారా తెలుసుకోవడం అనే అర్థాన్ని, ἀκριβέστερον యొక్క తులనాత్మక భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: వ్యతిరేక సందర్భంలో ‘యూదులు’ అనే పదం ఎవరిని సూచిస్తుంది
  choice: మూలంలోని Οἱ Ἰουδαῖοιను ‘యూదులు’ అని నేరుగా అనువదించడం
  alternative: యూదు నాయకులు; యూదయవారు
  rationale: మూలపాఠం స్పష్టంగా చెప్పినదానికంటే పరిధిని అనువాదంలో కుదించలేదు. అయితే కథాసందర్భం దీనిని పౌలుకు వ్యతిరేకంగా పన్నాగం చేసిన నిర్దిష్ట సమూహానికి పరిమితం చేస్తుంది.
- issue: ὡς సూచించే ప్రకటిత ఉద్దేశం
  choice: నిజంగా విచారించాలనే ఉద్దేశం ఉన్నట్టుగా నటించే భావాన్ని నిలుపడం
  alternative: వారు మరింత కచ్చితంగా విచారించేందుకు
  rationale: ὡς ఇక్కడ నెపం లేదా పైకి కనిపించే ఉద్దేశాన్ని సూచిస్తుంది. దానిని నిజమైన ఉద్దేశంగా మార్చకుండా కథలోని మోసపూరిత ఉద్వేగాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే కథన శైలి. ఈ వచనానికి పాదటిప్పణులు అవసరం లేదని నిర్ణయించాం; అందువల్ల ప్రధాన పాఠ్యంలో గుర్తులు లేవు.
