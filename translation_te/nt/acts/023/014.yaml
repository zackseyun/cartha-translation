id: ACT.23.14
reference: Acts 23:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἵτινες προσελθόντες τοῖς ἀρχιερεῦσιν καὶ τοῖς πρεσβυτέροις εἶπαν· Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς μηδενὸς γεύσασθαι ἕως οὗ ἀποκτείνωμεν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/014.yaml
  text: These men came to the chief priests and the elders and said[a], “We have bound ourselves under a curse to taste nothing until we kill Paul.”
translation:
  language: te
  text: 'వారు ప్రధాన యాజకులూ పెద్దలూ వద్దకు వెళ్లి ఇలా అన్నారు: “పౌలును చంపేవరకు ఏమీ రుచి చూడబోమని శాప ప్రమాణంతో మమ్మల్ని మేమే బంధించుకున్నాం.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “శాపంతో మమ్మల్ని మేమే శపించుకున్నాం.” గ్రీకు మాటలు తమపైనే శాపాన్ని ఆహ్వానిస్తూ చేసిన ప్రమాణాన్ని సూచిస్తున్నాయి.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: వారు
  rationale: మునుపటి వచనంలోని కుట్రదారులను సూచించే సంబంధ సర్వనామాన్ని తెలుగు కథన ప్రవాహంలో సహజంగా ‘వారు’ అని వ్యక్తం చేసింది.
- source_word: προσελθόντες
  choice: దగ్గరికి వచ్చి
  rationale: ప్రధాన క్రియకు ముందుగా జరిగిన సమీపించడాన్ని తెలిపే ఏఓరిస్ట్ కృదంతానికి సహజమైన తెలుగు రూపం.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: ప్రధాన యాజకుల దగ్గరికి
  rationale: రెండవ దేవాలయకాల యూదా నాయకత్వంలోని సమూహాన్ని సూచించే ప్రామాణిక తెలుగు పదబంధం.
- source_word: τοῖς πρεσβυτέροις
  choice: పెద్దల దగ్గరికి
  rationale: ఇక్కడ వయోవృద్ధులను మాత్రమే కాక గుర్తింపు పొందిన సమాజ నాయకులను సూచిస్తుంది.
- source_word: Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς
  choice: మమ్మల్ని మేమే శాపానికి బంధించుకున్నాం
  rationale: స్వయంగా తమపై శాపాన్ని ఆహ్వానిస్తూ చేసిన తీవ్రమైన ప్రమాణ భావాన్ని, తరువాతి మతపరమైన సాంకేతిక అర్థాలను చేర్చకుండా వ్యక్తం చేస్తుంది.
- source_word: μηδενὸς γεύσασθαι
  choice: ఏమీ రుచి చూడకూడదని
  rationale: γεύομαι యొక్క ‘రుచి చూడు/పాలు పంచుకో’ అనే ప్రత్యక్ష భావాన్ని, μηδενός యొక్క సంపూర్ణ నిరాకరణను కాపాడుతుంది.
- source_word: ἕως οὗ
  choice: చంపేంతవరకు
  rationale: ప్రమాణానికి కాలపరమైన హద్దును తెలిపే సహజమైన తెలుగు నిర్మాణం.
- source_word: ἀποκτείνωμεν
  choice: చంపే
  rationale: ఉద్దేశించిన కార్యాన్ని నేరుగా తెలియజేస్తుంది; ‘హత్య చేయు’ వంటి అదనపు న్యాయపరమైన తీర్పును చేర్చదు.
- source_word: τὸν Παῦλον
  choice: పౌలును
  rationale: Παῦλος అనే వ్యక్తినామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
theological_decisions:
- issue: Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς అనే ప్రమాణ సూత్రం
  choice: మమ్మల్ని మేమే శాపానికి బంధించుకున్నాం
  alternative: మా మీద మేమే శాపం పెట్టుకున్నాం; ఘోరంగా ప్రమాణం చేసుకున్నాం
  rationale: ఇది తరువాతి సంఘపరమైన ‘అనాథెమా’ అనే సాంకేతిక సిద్ధాంత పదం కాదు; ప్రమాణం విఫలమైతే తమపై శాపం రావాలని ఒప్పుకునే స్వశాప ప్రమాణం. ఎంపిక చేసిన రూపం ఆ తీవ్రతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘రుచి చూడకూడదు’ అనే అక్షరార్థ భావాన్ని నిలిపి, స్వశాప ప్రమాణంలోని తీవ్రతను పాదసూచికతో స్పష్టం చేసింది.
