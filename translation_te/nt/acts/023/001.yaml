id: ACT.23.1
reference: Acts 23:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀτενίσας δὲ ⸂ὁ Παῦλος τῷ συνεδρίῳ⸃ εἶπεν· Ἄνδρες ἀδελφοί, ἐγὼ πάσῃ συνειδήσει ἀγαθῇ πεπολίτευμαι τῷ θεῷ ἄχρι ταύτης τῆς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/001.yaml
  text: And Paul[a], looking intently at the council, said, “Brothers, I have lived before God with an entirely good conscience up to this day.”
translation:
  language: te
  text: పౌలు మహాసభను తదేకంగా చూసి, “సోదరులారా, ఈ రోజు వరకు నేను దేవుని ఎదుట పూర్తిగా మంచి మనస్సాక్షితో జీవించాను[a]” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని ఎదుట పౌరునిగా ప్రవర్తించాను.” గ్రీకు క్రియలో పౌరుని ప్రవర్తనకు సంబంధించిన ఛాయ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: తదేకంగా చూసి
  rationale: ఈ క్రియలో ఒక వైపు దృష్టిని నిలిపి శ్రద్ధగా చూడడం అనే భావం ఉంది; ‘తదేకంగా చూసి’ ఆధునిక తెలుగులో సహజంగా ఆ బలాన్ని తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించకుండా వాక్యప్రవాహంలో వ్యక్తీకరించబడింది
  rationale: ఇక్కడ δέ స్వల్ప కథన అనుసంధానకం. తెలుగులో ‘అప్పుడు’ లేదా ‘మరి’ చేర్చడం అవసరానికి మించిన బలాన్ని ఇవ్వవచ్చు; సహజ వాక్యక్రమమే కథన పురోగతిని తెలియజేస్తుంది.
- source_word: τῷ συνεδρίῳ
  choice: మహాసభవైపు
  rationale: ఈ సందర్భంలో συνέδριον యూదుల పాలక మండలిని సూచిస్తుంది. ‘మహాసభ’ పారదర్శకమైన, గౌరవప్రదమైన తెలుగు పదం; ‘వైపు’ అనేది చూడడం అనే క్రియతో సహజంగా సరిపోతుంది.
- source_word: Ἄνδρες ἀδελφοί
  choice: సోదరులారా
  rationale: ఇది పురుషులతో కూడిన సభను ఉద్దేశించిన సంప్రదాయ ప్రత్యక్ష సంబోధన. గ్రీకు ద్వంద్వ సంబోధనను కృత్రిమంగా ‘పురుషులారా, సోదరులారా’ అనకుండా ‘సోదరులారా’ సహజంగా అందిస్తుంది.
- source_word: πάσῃ συνειδήσει ἀγαθῇ
  choice: పూర్తిగా మంచి మనస్సాక్షితో
  rationale: దత్తి విభక్తి జీవించిన తీరును సూచిస్తుంది; πάσῃ వాక్యంలోని సమగ్ర బలాన్ని ఇస్తుంది. ఈ రూపం పౌలు వాదన బలాన్ని నిలుపుతూ పాపరహితత్వం అనే అదనపు భావాన్ని చేర్చదు.
- source_word: πεπολίτευμαι
  choice: జీవించాను
  rationale: పరిపూర్ణ కాలరూపం గతం నుండి ప్రస్తుత దినం వరకు తన ప్రవర్తనను వెనుదిరిగి సమీక్షించే భావాన్ని ఇస్తుంది. ప్రధాన పాఠ్యంలో ‘జీవించాను’ సహజం; క్రియలో ఉండగల పౌర ప్రవర్తన ఛాయను పాదటిప్పణిలో ఉంచాం.
- source_word: τῷ θεῷ
  choice: దేవుని ఎదుట
  rationale: దేవునితో సంబంధంలో, ఆయన దృష్టిలో జీవించడం అనే భావాన్ని తెలుగు సహజంగా వ్యక్తపరుస్తుంది; కేవలం ‘దేవునికి’ కంటే మనస్సాక్షి సందర్భంతో మెరుగ్గా సరిపోతుంది.
- source_word: ἄχρι ταύτης τῆς ἡμέρας
  choice: ఈ రోజు వరకు
  rationale: గతం నుండి మాట్లాడుతున్న ప్రస్తుత క్షణం వరకు కొనసాగిన కాలపరిమితిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: πεπολίτευμαι లోని జీవన ప్రవర్తన మరియు పౌర సంబంధ ఛాయ
  choice: ప్రధాన పాఠ్యంలో దేవుని ఎదుట జీవించిన తీరు అనే సాధారణ నైతిక భావాన్ని ఇచ్చి, పౌరునిగా ప్రవర్తించడం అనే ఛాయను పాదటిప్పణిలో నిలుపడం
  alternative: ‘నేను దేవుని ఎదుట పౌరునిగా ప్రవర్తించాను’ అని ప్రధాన పాఠ్యంలో మరింత అక్షరార్థంగా అనువదించడం
  rationale: πολιτεύομαι పౌర జీవనానికి సంబంధించిన ఛాయను కలిగి ఉండగలదు; అయితే ఈ సందర్భంలో ప్రధానంగా దేవుని ఎదుట మంచి మనస్సాక్షితో తన ప్రవర్తన గురించిన పౌలు వాదన ఉద్దేశించబడింది. ‘జీవించాను’ రాజకీయ లేదా పౌర హోదా భావాన్ని అతిగా ముందుకు తేవదు; పాదటిప్పణి అసలు పదంలోని నిజమైన ఛాయను సంరక్షిస్తుంది.
- issue: ‘మంచి మనస్సాక్షి’ వాక్యాన్ని నైతిక పరిపూర్ణతగా చదివే అవకాశం
  choice: పాఠ్యంలోని బలమైన స్వీయవివరణను యథాతథంగా ఉంచడం, కానీ ‘పాపరహితంగా’ వంటి వివరణాత్మక పదాన్ని చేర్చకపోవడం
  alternative: దీనిని సంపూర్ణ నిర్దోషిత్వం లేదా పాపరహితత్వ ప్రకటనగా స్పష్టీకరించడం
  rationale: గ్రీకు పాఠ్యం మంచి మనస్సాక్షితో జీవించానని చెబుతుంది; అది పౌలు ఉద్దేశాన్ని లేదా దైవశాస్త్ర సంబంధిత పరిమితులను మరింతగా నిర్వచించదు. అనువాదం ఆ ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి. ‘మహాసభ’, ‘మనస్సాక్షి’ వంటి స్థిరమైన పదాలను ఉపయోగించాం. మూలపాఠ్యంలోని గంభీరతను నిలుపుతూ అసహజమైన అక్షరానువాదాన్ని నివారించాం; పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
