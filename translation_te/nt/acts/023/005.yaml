id: ACT.23.5
reference: Acts 23:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔφη τε ὁ Παῦλος· Οὐκ ᾔδειν, ἀδελφοί, ὅτι ἐστὶν ἀρχιερεύς· γέγραπται γὰρ ⸀ὅτι Ἄρχοντα τοῦ λαοῦ σου οὐκ ἐρεῖς κακῶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/005.yaml
  text: And Paul said, “I did not know, brothers, that he is the high priest; for it is written, ‘You shall not speak evil of a ruler of your people.’”
translation:
  language: te
  text: 'పౌలు ఇలా అన్నాడు: “సోదరులారా, ఆయన ప్రధాన యాజకుడని నాకు తెలియదు. ఎందుకంటే, ‘నీ ప్రజల పాలకుణ్ణి దూషించకూడదు’[a] అని రాసి ఉంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ ప్రజల పాలకుని గురించి చెడుగా మాట్లాడకూడదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη τε ὁ Παῦλος
  choice: అప్పుడు పౌలు ఇలా అన్నాడు
  rationale: τέ స్వల్ప కథన అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో ‘అప్పుడు’ సందర్భ ప్రవాహాన్ని సహజంగా తెలియజేస్తుంది, ‘ఇలా అన్నాడు’ ప్రత్యక్ష వాక్యాన్ని ప్రవేశపెడుతుంది.
- source_word: Οὐκ ᾔδειν
  choice: నాకు తెలియదు
  rationale: తెలుసుకొనివుండటం అనే οἶδα భావాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: పురుషలింగ సంబోధన బహువచనాన్ని, ఈ పురుషుల సభ సందర్భాన్ని యథార్థంగా నిలుపుతుంది.
- source_word: ὅτι ἐστὶν ἀρχιερεύς
  choice: ఆయన ప్రధాన యాజకుడని
  rationale: ἀρχιερεύς పదవిని ‘ప్రధాన యాజకుడు’గా అందిస్తుంది; తెలుగు పరోక్ష వాక్య నిర్మాణంలో కాలాన్ని అనవసరంగా గతకాలంగా మార్చకుండా గ్రీకు వర్తమాన భావాన్ని నిలుపుతుంది.
- source_word: γέγραπται γὰρ
  choice: ఎందుకంటే ... అని రాసి ఉంది
  rationale: పరిపూర్ణ కర్మణి citation formula యొక్క నిలిచి ఉన్న లిఖిత అధికార భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: Ἄρχοντα τοῦ λαοῦ σου
  choice: నీ ప్రజల పాలకుణ్ణి
  rationale: ἄρχωνను పాలనాధికారం గల వ్యక్తిగా ‘పాలకుడు’తో, λαόςను సమాజ/ప్రజల భావంతో అనువదిస్తుంది.
- source_word: οὐκ ἐρεῖς κακῶς
  choice: దూషించకూడదు
  rationale: ఆజ్ఞార్థకంగా వాడిన భవిష్యత్ రూపాన్ని తెలుగు నిషేధ ఆజ్ఞగా అందిస్తుంది; κακῶς λέγωలోని చెడుగా లేదా అవమానకరంగా మాట్లాడే భావాన్ని సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ἀδελφοίను సమ్మిళిత లింగ పదంగా అనువదించాలా
  choice: సోదరులారా
  alternative: సోదర సోదరీమణులారా
  rationale: మూలపదం వ్యాకరణపరంగా పురుషలింగ బహువచనం; ఈ సందర్భంలో పౌలు పురుషులతో కూడిన సభను సంబోధిస్తున్నాడు.
- issue: పౌలు ప్రధాన యాజకుని గురించి చెప్పిన మాటలో వర్తమాన/భూతకాల సంబంధం
  choice: ఆయన ప్రధాన యాజకుడని నాకు తెలియదు
  alternative: ఆయన ప్రధాన యాజకుడై ఉన్నాడని నాకు తెలియదు
  rationale: ἐστίν వర్తమాన రూపాన్ని తెలుగులో సహజమైన నామవాచక పరోక్ష వాక్యంతో నిలుపుతూ, పౌలు మాట వెనుక ఉద్దేశాన్ని—నిజమైన అజ్ఞానమా, గుర్తించలేకపోవడమా, వ్యంగ్యమా—నిర్ణయించకుండా వదిలివేస్తుంది.
- issue: లేఖన ఉల్లేఖనంలోని κακῶς λέγω పరిధి
  choice: దూషించకూడదు
  alternative: చెడుగా మాట్లాడకూడదు
  rationale: ‘దూషించు’ అవమానకరంగా మాట్లాడే ప్రధాన భావాన్ని సహజంగా ఇస్తుంది; విస్తృత పదప్రతిపదార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా భావపరిధిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన ‘ఆయన’ వాడకం, సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం, మరియు లేఖన ఉల్లేఖనానికి సహజమైన కానీ గంభీరమైన శైలి పాటించబడ్డాయి.
