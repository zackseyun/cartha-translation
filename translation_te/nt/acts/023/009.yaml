revisions:
- from: అప్పుడు పెద్ద కేకలు చెలరేగాయి. పరిసయ్యుల పక్షానికి చెందిన కొందరు శాస్త్రులు లేచి తీవ్రంగా వాదిస్తూ, “ఈ మనిషిలో మాకు ఏ తప్పూ కనిపించడం లేదు. ఒక ఆత్మగానీ దేవదూతగానీ అతనితో మాట్లాడి ఉంటే—”[a] అన్నారు.
  to: అప్పుడు పెద్ద కలకలం చెలరేగింది. పరిసయ్యుల పక్షానికి చెందిన కొందరు శాస్త్రులు లేచి తీవ్రంగా వాదిస్తూ, “ఈ మనిషిలో మాకు ఏ తప్పూ కనిపించడం లేదు. కానీ ఒక ఆత్మ[b]గానీ దేవదూతగానీ అతనితో మాట్లాడి ఉంటే—”[a] అన్నారు.
  rationale: The revision replaces the pluralized expression for the great outcry with a natural singular collective expression, while retaining the event's intensity. It preserves the Greek clause's abrupt ending with an em dash and restores the audit-trail footnote for πνεῦμα so that the translation does not resolve its possible sense beyond what the source warrants.
