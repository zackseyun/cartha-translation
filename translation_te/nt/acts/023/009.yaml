id: ACT.23.9
reference: Acts 23:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγένετο δὲ κραυγὴ μεγάλη, καὶ ἀναστάντες ⸂τινὲς τῶν γραμματέων⸃ τοῦ μέρους τῶν Φαρισαίων διεμάχοντο λέγοντες· Οὐδὲν κακὸν εὑρίσκομεν ἐν τῷ ἀνθρώπῳ τούτῳ· εἰ δὲ πνεῦμα ἐλάλησεν αὐτῷ ἢ ⸀ἄγγελος—
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/009.yaml
  text: Then a great outcry arose[a], and some of the scribes of the party of the Pharisees stood up and contended, saying, “We find nothing wrong in this man[b]. But if a spirit or an angel has spoken to him—”
translation:
  language: te
  text: అప్పుడు పెద్ద కలకలం చెలరేగింది. పరిసయ్యుల పక్షానికి చెందిన కొందరు శాస్త్రులు లేచి తీవ్రంగా వాదిస్తూ, “ఈ మనిషిలో మాకు ఏ తప్పూ కనిపించడం లేదు. కానీ ఒక ఆత్మ[b]గానీ దేవదూతగానీ అతనితో మాట్లాడి ఉంటే—”[a] అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు వాక్యం ఇక్కడ ఆకస్మికంగా అసంపూర్ణంగా ఆగిపోతుంది.
    reason: source_text_abrupt_ending
  - marker: b
    text: ఇక్కడ “ఆత్మ” అనేది సాధారణంగా ఒక ఆత్మసంబంధ జీవిని సూచించవచ్చు; కొందరు దీనిని “పరిశుద్ధాత్మ”గా అర్థం చేసుకుంటారు. అయితే “దేవదూత”తో జతగా ఉండటం సాధారణ అర్థానికే అనుకూలంగా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: κραυγὴ μεγάλη
  choice: పెద్ద కేకలు
  rationale: κραυγή గట్టిగా వినిపించే కేకలను లేదా కల్లోలభరితమైన అరుపులను సూచిస్తుంది. తెలుగు సహజ వాడుకలో బహువచనం ఈ సభలోని గొడవను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀναστάντες
  choice: లేచి
  rationale: సభలో మాట్లాడటానికి వారు లేచిన చర్యను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τινὲς τῶν γραμματέων
  choice: కొందరు శాస్త్రులు
  rationale: యూదుల ధర్మశాస్త్రంలో నిపుణులైన γραμματεῖς‌కు తెలుగు బైబిలు సందర్భంలో స్థిరమైన, సంక్షిప్తమైన పదం ‘శాస్త్రులు’.
- source_word: τοῦ μέρους τῶν Φαρισαίων
  choice: పరిసయ్యుల పక్షానికి చెందిన
  rationale: μέρος ఇక్కడ సభలోని ఒక పక్షాన్ని లేదా వర్గాన్ని సూచిస్తుంది; ‘పక్షానికి చెందిన’ అనుబంధాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: διεμάχοντο
  choice: తీవ్రంగా వాదిస్తూ
  rationale: అపూర్ణ భూతకాల రూపం కొనసాగుతున్న బలమైన వాదనను సూచిస్తుంది; ఈ తెలుగు పదబంధం దాని తీవ్రతనూ కొనసాగింపునూ అందిస్తుంది.
- source_word: Οὐδὲν κακὸν εὑρίσκομεν
  choice: మాకు ఏ తప్పూ కనిపించడం లేదు
  rationale: న్యాయవిచారణ సందర్భంలో κακόν‌ను ‘తప్పు’గా అనువదించడం నిందించదగిన దోషం ఏదీ కనబడలేదనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: ఈ మనిషిలో
  rationale: గ్రీకు నిర్మాణాన్ని దగ్గరగా అనుసరిస్తూ పౌలును నిర్దిష్టంగా సూచిస్తుంది.
- source_word: εἰ δὲ
  choice: … ఉంటే—
  rationale: δὲ యొక్క వ్యతిరేక మలుపును తెలుగు వాక్యప్రవాహంలో ప్రత్యేక ‘కాని’ లేకుండానే షరతు రూపం తెలియజేస్తుంది; చివరి విరామరేఖ అసంపూర్ణతను నిలుపుతుంది.
- source_word: πνεῦμα
  choice: ఒక ఆత్మ
  rationale: ἄγγελος‌తో ఉన్న ప్రత్యామ్నాయ జత కారణంగా ఇక్కడ సాధారణ ఆత్మసంబంధ జీవి అనే భావమే సహజం; పరిశుద్ధాత్మ అని ప్రత్యేకీకరించదు.
- source_word: ἐλάλησεν αὐτῷ
  choice: అతనితో మాట్లాడి ఉంటే
  rationale: సంభవించి ఉండవచ్చని ఊహిస్తున్న గత సంఘటనను తెలుగు షరతు రూపంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἄγγελος
  choice: దేవదూత
  rationale: అలౌకిక సందర్భంలో ἄγγελος మానవ దూతను కాక దేవదూతను సూచిస్తుంది.
theological_decisions:
- issue: ἄγγελος‌తో పోల్చబడిన πνεῦμα యొక్క అర్థం
  choice: ఒక ఆత్మ
  alternative: పరిశుద్ధాత్మ
  rationale: ‘ఆత్మగానీ దేవదూతగానీ’ అనే జత పరిసయ్యులు అంగీకరించిన ఆత్మసంబంధ జీవుల వర్గాలను ప్రతిబింబిస్తుంది. అందువల్ల పరిశుద్ధాత్మ అని నిర్దిష్టంగా నిర్ణయించకుండా మూలంలోని అనిశ్చితిని నిలుపుతుంది.
- issue: చివరి షరతు వాక్యం అసంపూర్ణంగా ఉండటం
  choice: విరామరేఖతో అసంపూర్ణ వాక్యంగానే ఉంచడం
  alternative: ‘అయితే ఏమిటి?’ వంటి భావాన్ని జోడించి పూర్తి ప్రశ్నగా మార్చడం
  rationale: గ్రీకు పాఠం ἄγγελος తరువాత ఆకస్మికంగా ఆగుతుంది. ఊహించిన ముగింపును చేర్చకుండా ఆ వాక్యభంగాన్ని కాపాడటం మూలానికి విధేయమైనది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. సభలోని ఉద్రిక్తతను ‘పెద్ద కేకలు చెలరేగాయి’, ‘తీవ్రంగా వాదిస్తూ’ అనే సహజ పదబంధాలతో తెలిపాం; చివరి వాక్యాన్ని మూలంలాగే అసంపూర్ణంగా ఉంచాం.
