  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸν ἄνδρα τοῦτον συλλημφθέντα ὑπὸ τῶν Ἰουδαίων καὶ μέλλοντα ἀναιρεῖσθαι ὑπ’ αὐτῶν ἐπιστὰς σὺν τῷ στρατεύματι ⸀ἐξειλάμην, μαθὼν ὅτι Ῥωμαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/027.yaml
  text: This man was seized by the Jews and was about to be killed by them[a], and I came with the troops and rescued him, having learned that he is a Roman.
translation:
  language: te
  text: ఈ మనిషిని యూదులు[a] పట్టుకున్నారు; వారు అతనిని చంపబోతుండగా, నేను సైనికులతో అక్కడికి వచ్చి అతనిని రక్షించాను, అతడు రోమీయుడని తెలుసుకొని.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదయ ప్రజలు.’ గ్రీకు పదం జాతి-మతపరమైన అర్థంలో యూదులను లేదా భౌగోళిక అర్థంలో యూదయ ప్రాంత ప్రజలను సూచించవచ్చు; ఇక్కడ అది ఎక్కువగా యెరూషలేములోని యూదుల గుంపును లేదా ప్రత్యర్థులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: συλλημφθέντα
  choice: పట్టుకొని
  rationale: శత్రుత్వంతో అదుపులోకి తీసుకోవడాన్ని సహజంగా తెలియజేస్తుంది; అధికారిక అరెస్టు అని అవసరానికి మించి సూచించదు.
- source_word: Ἰουδαίων
  choice: యూదులు
  rationale: ఇక్కడ యెరూషలేములో పౌలును వ్యతిరేకించిన యూదుల గుంపును సూచించే సహజమైన సందర్భోచిత పదం; భౌగోళిక ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
- source_word: μέλλοντα ἀναιρεῖσθαι
  choice: చంపబోతుండగా
  rationale: సమీపిస్తున్న హత్యను స్పష్టంగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπιστὰς
  choice: అక్కడికి వచ్చి
  rationale: హఠాత్తుగా అక్కడికి వచ్చి జోక్యం చేసుకున్న భావాన్ని సందర్భంలో సహజంగా అందిస్తుంది.
- source_word: σὺν τῷ στρατεύματι
  choice: సైనికులతో
  rationale: సైనిక దళాన్ని సూచిస్తుంది; దళ పరిమాణాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: ἐξειλάμην
  choice: అతన్ని రక్షించాను
  rationale: తక్షణ ప్రాణాపాయం నుంచి విడిపించిన చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: μαθὼν
  choice: తెలుసుకొని
  rationale: గ్రీకు భూతకాల క్రియావిశేషణ రూపంలోని పూర్వ లేదా అనుబంధ చర్యను సహజంగా నిలుపుతుంది.
- source_word: Ῥωμαῖός ἐστιν
  choice: ఇతడు రోమీయుడని
  rationale: మూలంలోని ‘రోమీయుడు’ అనే ప్రత్యక్ష పదాన్ని నిలుపుతుంది; పౌరసత్వ భావాన్ని సందర్భానికే వదిలేస్తుంది.
theological_decisions:
- issue: సైన్యాధిపతి ఉత్తరంలోని చారిత్రక-వాక్చాతుర్య ప్రదర్శన
  choice: సైన్యాధిపతి చేసిన వాదనను ఉన్నట్లుగానే అనువదించడం
  alternative: అపొస్తలుల కార్యములు 21–22లోని విస్తృత కథనంతో ఉన్న ఉద్రిక్తతను తొలగించేలా వివరణాత్మకంగా మార్చడం
  rationale: క్లౌదియ లూసియ తన చర్యలను అనుకూలంగా చూపిస్తూ చెప్పిన మాటలే ఈ వచనంలో నమోదయ్యాయి. అనువాదం ఆ ఉద్రిక్తతను మౌనంగా సమన్వయపరచకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. గ్రీకు వాక్యంలోని సమన్వయాన్ని అదనపు విరోధార్థక సంధి లేకుండా నిలిపి, ఉత్తర రచయిత స్వప్రయోజనాత్మక వర్ణనలోని ఉద్రిక్తతను పరిష్కరించకుండా ఉంచింది.
