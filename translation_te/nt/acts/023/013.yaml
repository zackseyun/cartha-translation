  text: ἦσαν δὲ πλείους τεσσεράκοντα οἱ ταύτην τὴν συνωμοσίαν ⸀ποιησάμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/013.yaml
  text: There were more than forty who had formed this conspiracy[a].
translation:
  language: te
  text: ఈ కుట్ర పన్నినవారు నలభై మందికంటే ఎక్కువ మంది ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నలభై మందికి పైగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείους τεσσεράκοντα
  choice: నలభై మందికి పైగా
  rationale: ఈ తులనాత్మక ప్రయోగం ‘నలభైకంటే ఎక్కువ’ అని అర్థమిస్తుంది. తెలుగులో వ్యక్తుల సంఖ్యను సహజంగా తెలిపేందుకు ‘మంది’ వాడబడింది.
- source_word: συνωμοσίαν
  choice: కుట్ర
  rationale: ఈ పదం రహస్యంగా కుదుర్చుకున్న కుట్ర లేదా పన్నాగాన్ని సూచిస్తుంది. సందర్భాన్ని అతిగా విస్తరించకుండా ‘కుట్ర’ దాని భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ποιησάμενοι
  choice: చేసినవారు
  rationale: ποιέω యొక్క భూతకాల మధ్యమ కృదంత రూపం συνωμοσίανతో కలిసి ‘కుట్ర చేసినవారు/రూపొందించినవారు’ అనే భావాన్ని ఇస్తుంది. ‘చేసినవారు’ సరళమైన, సహజమైన తెలుగు.
- source_word: ἦσαν δὲ
  choice: ఉన్నారు
  rationale: గుంపు ఉనికిని తెలిపే గ్రీకు నిర్మాణాన్ని తెలుగు వాక్యక్రమంలో సహజంగా ‘ఉన్నారు’ అని ఇచ్చాం. δέ స్వల్ప అనుసంధానకమైనందున ప్రత్యేక పదంతో అనువదించలేదు.
- source_word: οἱ ταύτην τὴν συνωμοσίαν ποιησάμενοι
  choice: ఈ కుట్ర చేసినవారు
  rationale: నామవాచకంగా పనిచేసే article + participle నిర్మాణాన్ని తెలుగులో సహజమైన కృదంత నామ నిర్మాణంతో అందించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘నలభై మందికి పైగా’ సాధారణ పాఠకులకు సహజంగా ఉండి గ్రీకు మూలంలోని పరిమాణార్థాన్ని కాపాడుతుంది.
