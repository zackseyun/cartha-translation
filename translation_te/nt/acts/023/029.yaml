    issue: The main text renders ζητημάτων as ‘వివాదాస్పద విషయాలు.’
    rationale: While ζητήματα may denote disputed matters, ‘questions’ is the more neutral wording in the source. Making dispute explicit in the main text slightly narrows the sense; it should be an alternative in the footnote.
  - severity: low
    issue: ‘ఆరోపణలు ... చేస్తున్నారని’ uses an active construction.
    rationale: The Greek has a passive participle, ‘being accused.’ ‘అతనిపై ఆరోపణలు మోపబడుతున్నాయని’ is both more idiomatic and more directly faithful.
