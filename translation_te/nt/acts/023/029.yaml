id: ACT.23.29
reference: Acts 23:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃν εὗρον ἐγκαλούμενον περὶ ζητημάτων τοῦ νόμου αὐτῶν, μηδὲν ⸀δὲ ἄξιον θανάτου ἢ δεσμῶν ⸂ἔχοντα ἔγκλημα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/029.yaml
  text: I found that he was being accused concerning questions of their law[b][a], but charged with nothing deserving death or imprisonment.
translation:
  language: te
  text: వారి ధర్మశాస్త్రానికి సంబంధించిన ప్రశ్నల గురించి అతనిపై ఆరోపణలు మోపబడుతున్నాయని[a], అయితే మరణశిక్షకుగానీ కారాగార శిక్షకుగానీ తగిన ఏ నేరారోపణా అతనిపై లేదని నేను కనుగొన్నాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి ధర్మశాస్త్రంలోని వివాదాస్పద విషయాల గురించి.’
    reason: ζητήματα అనే పదం ‘ప్రశ్నలు’ అనే సాధారణ అర్థంతో పాటు, ‘వివాదంలో ఉన్న విషయాలు’ అనే అర్థాన్నీ కలిగి ఉండవచ్చు.
  - marker: b
    text: అక్షరార్థంగా, ‘మరణానికిగానీ సంకెళ్లకుగానీ.’
    reason: δεσμῶν అనే పదానికి అక్షరార్థం ‘బంధాలు’ లేదా ‘సంకెళ్లు’; ఈ న్యాయసందర్భంలో అది కారాగార శిక్షను సూచిస్తుంది.
lexical_decisions:
- source_word: ἐγκαλούμενον
  choice: అతనిపై ఆరోపణలు ... చేస్తున్నారని
  rationale: నిష్క్రియార్థక వర్తమాన అసమాపక క్రియ ఆరోపణలు అతనిపై మోపబడుతున్న కొనసాగుతున్న భావాన్ని సూచిస్తుంది; తెలుగులో ఈ నిర్మాణం సహజంగా అదే భావాన్ని తెలియజేస్తుంది.
- source_word: περὶ ζητημάτων
  choice: వివాదాస్పద విషయాల గురించే
  rationale: ζητήματα అనేది కేవలం ప్రశ్నలను మాత్రమే కాక చర్చకు లేదా వివాదానికి లోనైన అంశాలను సూచిస్తుంది. ‘వివాదాస్పద విషయాలు’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ‘గురించే’ ఆరోపణల పరిధి అక్కడికే పరిమితమని సందర్భానుసారంగా చూపుతుంది.
- source_word: τοῦ νόμου αὐτῶν
  choice: వారి ధర్మశాస్త్రంలోని
  rationale: రోమా అధికారి దృష్టికోణంలో ఉన్న αὐτῶν అనే స్వామ్యార్థాన్ని ‘వారి’ నిలుపుతుంది. యూదుల ధార్మిక-న్యాయ తోరాను సూచించడానికి ‘ధర్మశాస్త్రం’ తెలుగు బైబిలు వాడుకలో స్పష్టమైన పదం.
- source_word: μηδὲν ... ἄξιον θανάτου ἢ δεσμῶν
  choice: మరణశిక్షకుగానీ కారాగార శిక్షకుగానీ తగిన ... ఏదీ
  rationale: ἄξιον న్యాయపరంగా శిక్షకు తగినదనే భావం ఇస్తుంది. θάνατος సందర్భంలో మరణదండనను, δεσμά సందర్భంలో బంధనం ద్వారా కారాగార శిక్షను సహజ తెలుగులో వ్యక్తం చేశాం; అక్షరార్థమైన ‘సంకెళ్లు’ను పాదటిప్పణిలో ఉంచాం.
- source_word: ἔχοντα ἔγκλημα
  choice: తగిన నేరారోపణ ఏదీ అతనిపై లేదని
  rationale: ἔγκλημα ఇక్కడ నిరూపిత నేరం కంటే మోపబడిన నేరారోపణను సూచిస్తుంది. ‘నేరారోపణ’ దోషిగా తీర్పు ఇచ్చిన భావాన్ని అనవసరంగా చేర్చకుండా న్యాయపరమైన సందర్భాన్ని కాపాడుతుంది.
- source_word: εὗρον
  choice: నేను తెలుసుకున్నాను
  rationale: విచారణ ద్వారా వచ్చిన అధికారిక నిర్ధారణను తెలుగులో సహజంగా తెలియజేస్తుంది; ‘కనుగొన్నాను’ అనే భౌతికంగా వెదికి దొరకబుచ్చుకున్న భావాన్ని నివారిస్తుంది.
