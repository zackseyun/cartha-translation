revisions:
- from: అతనిపై ఆరోపణలు వారి ధర్మశాస్త్రంలోని వివాదాస్పద విషయాల గురించే చేస్తున్నారని[a], అయితే మరణశిక్షకుగానీ కారాగార శిక్షకుగానీ[b] తగిన నేరారోపణ ఏదీ అతనిపై లేదని నేను తెలుసుకున్నాను.
