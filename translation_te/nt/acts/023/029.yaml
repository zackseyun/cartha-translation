translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన లేఖా సందర్భానికి తగిన గౌరవప్రదమైన శైలి. వాక్య నిర్మాణం గ్రీకు వాక్యంలోని ఆరోపణ-నిర్దోషిత్వ వ్యత్యాసాన్ని నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉండేలా రూపొందించబడింది.
