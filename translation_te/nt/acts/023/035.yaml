source:
  edition: SBLGNT
  text: Διακούσομαί σου, ἔφη, ὅταν καὶ οἱ κατήγοροί σου παραγένωνται· ⸀κελεύσας ἐν τῷ πραιτωρίῳ ⸀τοῦ Ἡρῴδου φυλάσσεσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/035.yaml
  text: “I will hear your case,” he said[b][a], “when your accusers also arrive.” And he ordered that he be kept under guard in Herod’s praetorium.
translation:
  language: te
  text: అతడు, “నీ మీద నేరారోపణ చేసేవారు కూడా వచ్చినప్పుడు నీ వాదన వింటాను” అని చెప్పాడు. తరువాత పౌలును హేరోదు ప్రేటోరియంలో[a] కాపలా కింద ఉంచాలని ఆదేశించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ప్రేటోరియం” అంటే రోమా పాలకుని అధికార నివాసం లేదా ప్రధాన కార్యాలయం. ఇక్కడ అది కైసరయలోని హేరోదు రాజభవనాన్ని సూచించే అవకాశం ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: Διακούσομαί σου
  choice: నీ వాదన వింటాను
  rationale: διακούω న్యాయసంబంధ సందర్భంలో ఒకరి వాదనను విచారణార్థం వినడాన్ని సూచిస్తుంది. ‘నీ వాదన’ అనేది తెలుగులో సహజమైన న్యాయపరమైన వ్యక్తీకరణ; క్రియలో ఉండగల ‘పూర్తిగా వినడం’ అనే సూక్ష్మభావాన్ని ప్రధాన పాఠంలో అతిగా స్పష్టీకరించదు.
- source_word: ὅταν καὶ οἱ κατήγοροί σου παραγένωνται
  choice: నీ మీద నేరారోపణ చేసేవారు కూడా వచ్చినప్పుడు
  rationale: ὅταν తో కూడిన సంభావ్యార్థక క్రియ భవిష్యత్తులో జరిగే పరిస్థితిని సూచిస్తుంది. κατήγοροί అనేది న్యాయపరంగా ఆరోపణ చేసేవారిని సూచిస్తుంది; παραγένωνται ఇక్కడ ‘వచ్చినప్పుడు’ అని సహజంగా అనువదించబడింది.
- source_word: κελεύσας
  choice: తరువాత ... ఆదేశించాడు
  rationale: అనుబంధ ఏఓరిస్ట్ కృదంతాన్ని తెలుగు కథనశైలికి తగిన విధంగా సమాపక క్రియగా మార్చి, తరువాతి ఆదేశాన్ని స్పష్టంగా తెలిపింది.
- source_word: ἐν τῷ πραιτωρίῳ τοῦ Ἡρῴδου
  choice: హేరోదు ప్రేటోరియంలో
  rationale: πραιτώριον అనే చారిత్రక-పరిపాలనా పదాన్ని లిప్యంతరీకరించడం ద్వారా నిర్దిష్ట స్థలపదాన్ని నిలిపి, దాని అర్థాన్ని పాదసూచికలో వివరించింది.
- source_word: φυλάσσεσθαι αὐτόν
  choice: పౌలును ... కాపలా కింద ఉంచాలని
  rationale: φυλάσσεσθαι ఇక్కడ నిర్బంధ కాపలాను సూచిస్తుంది. దూరంలోని సర్వనామ సూచనలో అయోమయం రాకుండా αὐτόν యొక్క సందర్భోచిత వ్యక్తి అయిన పౌలు పేరును వాడింది.
