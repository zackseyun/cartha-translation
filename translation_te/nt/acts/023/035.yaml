translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. న్యాయసంబంధ సందర్భాన్ని సహజంగా తెలియజేయడానికి ‘నీ వాదన వింటాను’ అని అనువదించబడింది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోతుంది.
