translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని హింసాత్మక తీవ్రతను మృదువుచేయకుండా, సంభావ్య భయాన్ని మాత్రం నిశ్చిత ఫలితంగా మార్చకుండా జాగ్రత్తపడింది. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోలుతున్నాయి.
