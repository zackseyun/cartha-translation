id: ACT.23.10
reference: Acts 23:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πολλῆς δὲ ⸀γινομένης στάσεως ⸀φοβηθεὶς ὁ χιλίαρχος μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν ἐκέλευσεν τὸ στράτευμα ⸀καταβὰν ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν, ἄγειν ⸀τε εἰς τὴν παρεμβολήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/010.yaml
  text: And when a great dispute arose[a], the commander, fearing that Paul might be torn apart by them, ordered the troops to go down, seize him from among them[c][b], and bring him into the barracks.
translation:
  language: te
  text: పెద్ద కలహం చెలరేగగా[a], వారు పౌలును ముక్కలుగా చీల్చివేస్తారేమోనని సహస్రాధిపతి భయపడి, సైనికులు కిందికి వెళ్లి వారి మధ్యనుండి అతణ్ణి బలవంతంగా లాక్కొని, సైనిక శిబిరంలోకి[b] తీసుకురావాలని ఆజ్ఞాపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కలహం’ అనే మాటను ‘విభేదం,’ ‘ఘర్షణ,’ లేదా ‘అల్లకల్లోలం’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం στάσις తీవ్రమైన అంతర్గత ఘర్షణను, కొన్ని సందర్భాల్లో తిరుగుబాటును కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘సైనిక శిబిరం’ అని అనువదించిన గ్రీకు పదం παρεμβολή. ఇక్కడ అది యెరూషలేములోని రోమా సైనికుల నివాస స్థావరాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: πολλῆς ... γινομένης στάσεως
  choice: కలహం మరింత తీవ్రమవుతుండగా
  rationale: జనిటివ్ అబ్సల్యూట్ నిర్మాణాన్ని సందర్భాన్ని సూచించే ఉపవాక్యంగా ఇచ్చాం. στάσις ఇక్కడ సభలో పెరుగుతున్న తీవ్రమైన అంతర్గత కలహాన్ని సూచిస్తుంది; πολλῆς దాని తీవ్రతను తెలియజేస్తుంది.
- source_word: φοβηθεὶς
  choice: భయపడి
  rationale: అనంతర ఆజ్ఞకు కారణమైన సహస్రాధిపతి భయాన్ని సహజమైన తెలుగు క్రియావిశేష రూపంలో తెలిపింది.
- source_word: χιλίαρχος
  choice: సహస్రాధిపతి
  rationale: రోమా సైన్యంలోని ఉన్నతాధికారిని సూచించే పదానికి తెలుగు బైబిలు పాఠకులకు పరిచితమైన, గౌరవప్రదమైన సమానార్థక పదం; పదవిని కేవలం సాధారణ ‘అధికారి’గా చేయకుండా మూలంలోని ప్రత్యేకతను నిలుపుతుంది.
- source_word: μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν
  choice: వారు పౌలును ముక్కలుగా చీల్చివేస్తారేమోనని
  rationale: διασπάω లోని హింసాత్మకమైన ‘చీల్చివేయు’ భావాన్ని నిలిపి, μή తో కూడిన సంభావ్య భయాన్ని ‘ఏమోనని’ ద్వారా తెలిపింది.
- source_word: ἐκέλευσεν
  choice: ఆజ్ఞాపించాడు
  rationale: సైనిక సందర్భంలోని అధికారపూర్వక ఆదేశాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ στράτευμα
  choice: సైనికులు
  rationale: సమష్టిగా ఉన్న సైనిక దళాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καταβὰν
  choice: కిందికి వెళ్లి
  rationale: కోట ప్రాంతం నుంచి కింద ఉన్న సభవైపు జరిగిన స్థలచలనాన్ని నిలుపుతుంది.
- source_word: ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν
  choice: వారి మధ్యనుండి అతణ్ణి బలవంతంగా లాక్కొని
  rationale: ἁρπάζω సూచించే ఆకస్మికమైన, బలవంతపు తొలగింపును ‘బలవంతంగా లాక్కొని’ స్పష్టంగా అందిస్తుంది; ἐκ μέσου αὐτῶν ను ‘వారి మధ్యనుండి’గా నిలిపింది.
- source_word: ἄγειν τε
  choice: తీసుకురావాలని
  rationale: గమ్యస్థానానికి సైనికుల ఆధీనంలో నడిపించడాన్ని సందర్భానుకూలంగా, సహజంగా తెలియజేస్తుంది.
- source_word: παρεμβολήν
  choice: సైనిక శిబిరంలోకి
  rationale: పదం మౌలికంగా శిబిరం లేదా సైనిక స్థావరాన్ని సూచిస్తుంది; ఇక్కడ యెరూషలేములోని రోమా సైనిక నివాస ప్రదేశమని పాదటిప్పణి వివరిస్తుంది.
