id: ACT.23.12
reference: Acts 23:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ποιήσαντες ⸂συστροφὴν οἱ Ἰουδαῖοι⸃ ἀνεθεμάτισαν ἑαυτοὺς λέγοντες μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/012.yaml
  text: When day came[a], the Jews formed a conspiracy and bound themselves under a curse[b], saying that they would neither eat nor drink until they had killed Paul.
translation:
  language: te
  text: పగలు కాగానే, యూదులు[a] కుట్ర పన్ని, పౌలును చంపేవరకు తాము తినబోమని, తాగబోమని చెప్పి తమను తాము శాపానికి లోబరచుకున్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో ‘యూదులు’ అని ఉంది. ఇక్కడ అది యూదులందరినీ కాక, ఈ కుట్రలో పాల్గొన్న యూదులలోని ఒక నిర్దిష్ట గుంపును సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా ‘తమ మీద తామే శాపం పెట్టుకున్నారు.’ తాము చేసిన ఒట్టును నిలబెట్టుకోకపోతే తమ మీదికి తీర్పు రావాలని కోరుకునే స్వయంశాప ప్రమాణాన్ని ఈ మాట సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: పగలు కాగానే
  rationale: ఈ genitive absolute కాలసంబంధమైన కథన మార్పును సూచిస్తుంది. ‘పగలు కాగానే’ అనేది మూలంలోని భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ποιήσαντες συστροφὴν
  choice: కుట్ర పన్నారు
  rationale: ఈ సందర్భంలో ఈ పదబంధం పౌలును హతమార్చడానికి ఉద్దేశించిన సంఘటిత రహస్య పన్నాగాన్ని సూచిస్తుంది; ‘గుంపుగా చేరారు’ అనడం దాని కుట్రపూరిత ఉద్దేశాన్ని పూర్తిగా తెలియజేయదు.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: మూలపాఠంలో ఉన్న సాధారణ సమూహనామాన్ని ప్రధాన వాక్యంలో అలాగే ఉంచాం. అయితే సందర్భంలో ఇది యూదులందరినీ కాక కుట్రలో పాల్గొన్న ఒక నిర్దిష్ట గుంపును సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: తమను తాము శాపానికి లోబరచుకున్నారు
  rationale: వారు తమ మాట తప్పితే తమ మీదికి తీర్పు లేదా శాపం రావాలని స్వయంగా ఒట్టు పెట్టుకున్న భావాన్ని ఇది తెలియజేస్తుంది; కేవలం ‘ఒట్టు పెట్టుకున్నారు’ అనడం మూలంలోని శాపార్థాన్ని కోల్పోతుంది.
- source_word: λέγοντες μήτε φαγεῖν μήτε πιεῖν
  choice: తాము ఏమీ తినబోమని, తాగబోమని చెప్పుకుంటూ
  rationale: జతగా ఉన్న రెండు నిషేధాలను సహజమైన తెలుగులో నిలుపుతూ, ఇవి వారి శాపపూర్వక ఒట్టు యొక్క విషయమని తెలియజేస్తుంది.
- source_word: ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον
  choice: పౌలును చంపేవరకు
  rationale: వారి ఉపవాస ప్రతిజ్ఞ ముగిసే పరిమితిని సరళంగా, మూలంలోని ఉద్దేశానికి అనుగుణంగా వ్యక్తపరుస్తుంది.
