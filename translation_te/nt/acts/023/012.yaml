    issue: ‘చెప్పుకుంటూ’ is slightly imprecise in context.
    rationale: λέγοντες introduces the stated content of the oath, not necessarily speech directed to themselves. ‘చెప్పి’ naturally links their declaration with placing themselves under a curse.
