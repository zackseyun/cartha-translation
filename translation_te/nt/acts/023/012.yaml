translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించాం. మూలంలోని ‘యూదులు’ అనే పదాన్ని మార్చకుండా ఉంచి, సందర్భపరమైన పరిమితిని పాదసూచికలో స్పష్టం చేశాం. శాపంతో కూడిన ఒట్టు అనే భావాన్ని ప్రధాన వాక్యంలోనే నిలిపాం.
