source:
  edition: SBLGNT
  text: ὁ μὲν οὖν χιλίαρχος ἀπέλυσε τὸν ⸀νεανίσκον παραγγείλας μηδενὶ ἐκλαλῆσαι ὅτι ταῦτα ἐνεφάνισας πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/022.yaml
  text: So the commander dismissed the young man[a], instructing him, “Tell no one that you have reported these things to me.”
translation:
  language: te
  text: అప్పుడు సహస్రాధిపతి, “నువ్వు ఈ విషయాలు నాకు తెలియజేశావని ఎవరికీ చెప్పవద్దు” అని అతనికి ఆదేశించి, ఆ యువకుణ్ణి పంపివేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιλίαρχος
  choice: సహస్రాధిపతి
  rationale: రోమా సైన్యంలో ఉన్న ఉన్నతాధికారిని సూచించే పదం. ‘సహస్రాధిపతి’ మూలపదంలోని సైనిక హోదాను సంక్షిప్తంగా నిలుపుతుంది; సందర్భంలో అతని అధికారస్థానం స్పష్టంగా ఉంటుంది.
- source_word: ἀπέλυσε
  choice: పంపివేస్తూ
  rationale: ఇక్కడ నిర్బంధం నుంచి విడుదల చేయడం కంటే, సంభాషణ ముగిసిన తరువాత యువకుణ్ణి వెళ్లనివ్వడం భావం. తెలుగు వాక్యనిర్మాణంలో తరువాతి కృదంతంతో సహజంగా అనుసంధానించడానికి ఈ రూపం ఎంచుకున్నాం.
- source_word: νεανίσκον
  choice: యువకుణ్ణి
  rationale: తక్కువ వయస్సున్న పురుషుణ్ణి గౌరవప్రదంగా, ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది; ‘బాలుడు’ అనే మరీ చిన్న వయస్సు భావాన్ని నివారిస్తుంది.
- source_word: παραγγείλας
  choice: ఆదేశించాడు
  rationale: అధికారి ఇచ్చిన స్పష్టమైన నిర్దేశాన్ని తెలియజేస్తుంది; కేవలం సలహా ఇచ్చాడనే బలహీన భావం రాకుండా చేస్తుంది.
- source_word: μηδενὶ ἐκλαλῆσαι
  choice: ఎవరికీ చెప్పవద్దు
  rationale: ఎవరికీ విషయాన్ని వెల్లడించకూడదనే నిషేధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐνεφάνισας
  choice: తెలియజేశావు
  rationale: ఒక విషయాన్ని అధికారికి తెలియపరచడం లేదా నివేదించడం అనే మూలభావాన్ని సహజంగా అందిస్తుంది; తప్పనిసరిగా లాంఛనప్రాయ నివేదిక అనే భావాన్ని రుద్దదు.
- source_word: ταῦτα
  choice: ఈ విషయాలు
  rationale: బహువచన సూచనను నిలుపుతూ, ముందు తెలిపిన సమాచారాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: πρὸς ἐμέ
  choice: నాకు
  rationale: తెలియజేయడం అనే క్రియతో సమాచార గ్రహీతను సూచించే సహజమైన తెలుగు విభక్తి రూపం.
