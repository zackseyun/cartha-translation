id: ACT.23.30
reference: Acts 23:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μηνυθείσης δέ μοι ἐπιβουλῆς εἰς τὸν ⸀ἄνδρα ἔσεσθαι ⸀ἐξαυτῆς ἔπεμψα πρὸς σέ, παραγγείλας καὶ τοῖς κατηγόροις ⸀λέγειν πρὸς αὐτὸν ἐπὶ ⸀σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/030.yaml
  text: And when I was informed that there would be a plot against the man[a], I sent him to you at once, also ordering his accusers to state their case before you.
translation:
  language: te
  text: ఆ మనిషికి వ్యతిరేకంగా కుట్ర జరగబోతుందని నాకు సమాచారం అందగానే, నేను వెంటనే అతణ్ణి మీ దగ్గరికి పంపాను. అతని మీద నేరారోపణలు చేసేవారు తమ వాదనను మీ ఎదుట వినిపించాలని కూడా ఆదేశించాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనికి వ్యతిరేకంగా తమ ఆరోపణలను మీ ఎదుట సమర్పించాలని.” గ్రీకు వాక్యం అక్షరార్థంగా “మీ ఎదుట అతనితో/అతనికి వ్యతిరేకంగా మాట్లాడాలని” అంటుంది; ఇది న్యాయస్థానంలో వాడే భాష.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηνυθείσης
  choice: నాకు సమాచారం అందగానే
  rationale: ఇది aorist passive genitive absolute. తెలుగులో సహజమైన కాలసూచక ఉపవాక్యంగా మార్చి, సమాచారం ఇతరుల ద్వారా అందిందనే passive భావాన్ని నిలిపింది.
- source_word: ἐπιβουλῆς
  choice: కుట్ర
  rationale: శత్రుత్వపూర్వకమైన పథకం లేదా యుక్తిని సూచిస్తుంది. సందర్భం కన్నా ఎక్కువ నిర్దిష్టంగా ఉండే ‘దాడి పథకం’ కంటే ‘కుట్ర’ విస్తృతమైన, సహజమైన పదం.
- source_word: εἰς τὸν ἄνδρα
  choice: ఆ మనిషికి వ్యతిరేకంగా
  rationale: εἰς ఇక్కడ శత్రుత్వ దిశను సూచిస్తుంది. ἄνδρα లోని article‌ను సందర్భానుసారంగా ‘ఆ’తో ప్రతిబింబిస్తూ, పౌలు అనే పేరును స్వయంగా చేర్చలేదు.
- source_word: ἔσεσθαι
  choice: జరగబోతుందని
  rationale: భవిష్యత్ infinitive కుట్ర త్వరలో సంభవించబోతుందనే నివేదిత విషయాన్ని తెలియజేస్తుంది.
- source_word: ἐξαυτῆς
  choice: వెంటనే
  rationale: ఆలస్యం లేకుండా తక్షణమే చేసిన చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἔπεμψα πρὸς σέ
  choice: అతణ్ణి మీ దగ్గరికి పంపాను
  rationale: గ్రీకులో కర్మ స్పష్టంగా లేకపోయినా సందర్భంలో అది పౌలే; తెలుగులో వాక్యం సహజంగా ఉండేందుకు సర్వనామం చేర్చబడింది.
- source_word: παραγγείλας
  choice: కూడా ఆదేశించాను
  rationale: అనుబంధంగా జరిగిన చర్యను తెలిపే aorist participle‌ను తెలుగులో సమన్విత finite verb‌గా మార్చి, καί లోని అదనపు భావాన్ని ‘కూడా’తో నిలిపింది.
- source_word: τοῖς κατηγόροις
  choice: అతని మీద నేరారోపణలు చేసేవారు
  rationale: న్యాయ సందర్భంలోని ‘accusers’ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; వారు పౌలును ఆరోపిస్తున్నారని ‘అతని మీద’ ద్వారా చూపిస్తుంది.
- source_word: λέγειν πρὸς αὐτὸν
  choice: తమ వాదనను … వినిపించాలని
  rationale: అక్షరార్థంగా ‘అతనితో/అతనికి వ్యతిరేకంగా మాట్లాడడం’; న్యాయస్థాన సందర్భంలో తమ ఆరోపణాత్మక వాదనను సమర్పించడం అనే భావాన్ని సహజంగా అందిస్తుంది. గ్రీకు పదబంధంలోని కొంత అస్పష్టతను పాదసూచికలో తెలిపింది.
- source_word: ἐπὶ σοῦ
  choice: మీ ఎదుట
  rationale: అధికారిగా ఫేలిక్సు సమక్షంలో కేసును వినిపించడాన్ని సూచించే న్యాయపరమైన భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
