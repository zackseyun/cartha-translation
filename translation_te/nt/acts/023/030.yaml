translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, అధికారిక ఉత్తరానికి తగిన గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి. న్యాయపరమైన సందర్భాన్ని స్పష్టంగా ఉంచుతూ మూలంలోని λέγειν πρὸς αὐτὸν అనే పదబంధానికి ఉన్న ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో నిలిపింది.
