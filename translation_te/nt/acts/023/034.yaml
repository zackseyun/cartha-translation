translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని అనేక క్రియావిశేషణ రూపాలను సహజ తెలుగు వాక్య నిర్మాణంగా విభజించినప్పటికీ, చర్యల క్రమం మరియు పరిపాలనా సందర్భం నిలుపబడ్డాయి. వచనం తరువాతి వాక్యంతో కొనసాగుతున్నందున చివర కామా ఉంచబడింది.
