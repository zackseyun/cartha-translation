source:
  edition: SBLGNT
  text: ἀναγνοὺς ⸀δὲ καὶ ἐπερωτήσας ἐκ ποίας ⸀ἐπαρχείας ἐστὶν καὶ πυθόμενος ὅτι ἀπὸ Κιλικίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/034.yaml
  text: After reading it and asking what province he was from[a], and learning that he was from Cilicia,
translation:
  language: te
  text: అతడు ఆ ఉత్తరం చదివి, పౌలు ఏ పరిపాలనా ప్రాంతానికి చెందినవాడో అడిగి, అతడు కిలికియకు చెందినవాడని తెలుసుకొని,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναγνοὺς
  choice: ఆ ఉత్తరం చదివి
  rationale: ఇది ἀναγινώσκω క్రియ యొక్క భూతకాల క్రియావిశేషణ రూపం. ముందున్న సందర్భంలో ప్రస్తావించిన ఉత్తరమే ఉద్దేశం కాబట్టి తెలుగులో సహజమైన స్పష్టత కోసం ‘ఆ ఉత్తరం’ అని వ్యక్తం చేయబడింది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప అనుసంధానాన్ని సూచిస్తుంది; తెలుగు వాక్యప్రవాహమే దాని కార్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ
  choice: క్రమబద్ధమైన క్రియల అనుసంధానం
  rationale: గ్రీకు వాక్యంలోని వరుస క్రియలను తెలుగులో ‘చదివి… అడిగాడు… తెలుసుకున్న తరువాత’ అనే సహజ నిర్మాణంతో అనుసంధానించబడింది.
- source_word: ἐπερωτήσας
  choice: అడిగాడు
  rationale: ἐπερωτάω యొక్క భూతకాల క్రియావిశేషణ రూపం ప్రత్యక్షంగా విచారించడాన్ని సూచిస్తుంది. తెలుగు వాక్యాన్ని సులభంగా అర్థమయ్యేలా ప్రధాన క్రియగా మార్చబడింది.
- source_word: ἐκ ποίας ἐπαρχείας ἐστίν
  choice: ఏ ప్రాంతానికి చెందినవాడని
  rationale: ἐπαρχεία రోమా పరిపాలనా ప్రాంతాన్ని సూచిస్తుంది. ‘ఏ ప్రాంతానికి చెందినవాడు’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి ఆ పరిపాలనా భావాన్ని నిలుపుతుంది.
- source_word: πυθόμενος
  choice: తెలుసుకున్న తరువాత
  rationale: πυνθάνομαι సమాచారం తెలుసుకోవడం లేదా విచారణ ద్వారా గ్రహించడాన్ని సూచిస్తుంది. సంఘటనల క్రమాన్ని తెలుగులో స్పష్టంగా తెలియజేయడానికి ఈ రూపం ఎంచుకోబడింది.
- source_word: ὅτι ἀπὸ Κιλικίας
  choice: అతడు కిలికియకు చెందినవాడని
  rationale: ἀπό స్థల మూలాన్ని సూచిస్తుంది. తెలుగులో ‘కిలికియకు చెందినవాడు’ అనేది వ్యక్తి ఏ ప్రాంతం నుండి వచ్చాడనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: Κιλικίας
  choice: కిలికియ
  rationale: గ్రీకు ప్రాంతనామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
