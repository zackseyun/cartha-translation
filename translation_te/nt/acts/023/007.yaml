id: ACT.23.7
reference: Acts 23:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο δὲ αὐτοῦ ⸀λαλοῦντος ἐγένετο στάσις τῶν Φαρισαίων ⸂καὶ Σαδδουκαίων⸃, καὶ ἐσχίσθη τὸ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/007.yaml
  text: And as he was saying this[a], a dispute arose between the Pharisees and Sadducees[b], and the assembly was divided.
translation:
  language: te
  text: అతడు ఇలా మాట్లాడుతుండగా, పరిసయ్యులకూ సద్దూకయ్యులకూ మధ్య వివాదం తలెత్తింది; అక్కడ కూడిన సమూహం చీలిపోయింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο δὲ αὐτοῦ λαλοῦντος
  choice: అతడు ఇలా మాట్లాడుతుండగా
  rationale: వర్తమాన కృదంతంతో ఉన్న జనిటివ్ అబ్సల్యూట్, అతడు మాట్లాడుతున్న సమయంలోనే తదుపరి సంఘటన జరిగిందని సూచిస్తుంది. ‘మాట్లాడుతుండగా’ ఆ సమకాలీన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐγένετο
  choice: తలెత్తింది
  rationale: στάσις‌తో కలిసి ఇది వివాదం ఆరంభమైందనే భావాన్ని ఇస్తుంది. ‘తలెత్తింది’ ఆధునిక తెలుగు కథనశైలిలో సహజంగా ఉంది.
- source_word: στάσις
  choice: వివాదం
  rationale: ఈ పదానికి కలహం, విభేదం, వర్గపోరు వంటి భావాలు ఉండవచ్చు. ఇక్కడి తక్షణ వాగ్వివాద సందర్భానికి ‘వివాదం’ స్పష్టంగా సరిపోతుంది; సంఘటన తీవ్రతను అతిశయింపజేయదు.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: పరిసయ్యులకూ సద్దూకయ్యులకూ మధ్య
  rationale: గ్రీకులోని సంబంధ విభక్తి నిర్మాణం పరస్పరం ఎదిరించిన రెండు వర్గాలను సూచిస్తుంది. తెలుగులో ‘మధ్య’ అనడం ఆ సంబంధాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: ἐσχίσθη
  choice: చీలిపోయింది
  rationale: σχίζω యొక్క కర్మణి రూపం అక్షరార్థంగా చీలిపోవడాన్ని సూచిస్తుంది; ఇక్కడ అది సమూహం వర్గాలుగా విడిపోవడానికి రూపకంగా వాడబడింది. ‘చీలిపోయింది’ ఆ రూపకాన్ని నిలుపుతుంది.
- source_word: τὸ πλῆθος
  choice: అక్కడ కూడిన సమూహం
  rationale: πλῆθος అనేది పెద్ద సంఖ్యలో కూడిన ప్రజలను లేదా సమూహాన్ని సూచిస్తుంది. సందర్భాన్ని స్పష్టం చేయడానికి ‘అక్కడ కూడిన’ అని చేర్చినా, దానిని తప్పనిసరిగా అధికారిక ‘సభ’గా నిర్ధారించకుండా మూలంలోని విస్తృత భావాన్ని కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. ‘పరిసయ్యులు’, ‘సద్దూకయ్యులు’ అనే స్థిరపడిన తెలుగు బైబిలు రూపాలు వాడబడ్డాయి. మూలంలోని సమకాలీన చర్యను, వివాదం తలెత్తడాన్ని, సమూహం చీలిపోవడాన్ని క్రమంగా నిలుపుతూ అనవసరమైన సిద్ధాంత వివరణను జోడించలేదు.
