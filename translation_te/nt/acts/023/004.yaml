  yaml_path: translation/nt/acts/023/004.yaml
  text: Those standing nearby said[a], “Are you insulting God’s high priest?”
translation:
  language: te
  text: పక్కనే నిలబడి ఉన్నవారు, “దేవుని ప్రధాన యాజకుణ్ణి దూషిస్తున్నావా?[a]” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవుని ప్రధాన యాజకుణ్ణి అవమానిస్తున్నావా?”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ παρεστῶτες
  choice: అప్పుడు పక్కన నిలబడి ఉన్నవారు
  rationale: ఈ నామవాచకార్థక కృదంతం పౌలు సమీపంలో నిలబడి ఉన్నవారిని సూచిస్తుంది. ‘పక్కన నిలబడి ఉన్నవారు’ అనేది స్థలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; δὲ కథనంలోని తదుపరి ప్రతిస్పందనను సూచించేందుకు ‘అప్పుడు’గా వ్యక్తమైంది.
- source_word: εἶπαν
  choice: అని అన్నారు
  rationale: కథనాన్ని ముందుకు నడిపించే aorist indicative‌ను తెలుగులో సహజమైన సాధారణ భూతకాలంగా అనువదించింది.
- source_word: ἀρχιερέα
  choice: ప్రధాన యాజకుణ్ణి
  rationale: ఈ సందర్భంలో ἀρχιερεύς యూదుల ప్రధాన యాజకుని పదవిని సూచిస్తుంది; ‘ప్రధాన యాజకుడు’ ఆధునిక తెలుగులో స్పష్టమైన, ప్రామాణిక పదం.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: ఈ genitive ప్రధాన యాజకుని పదవికి దేవునితో ఉన్న సంబంధాన్ని తెలియజేస్తుంది. తెలుగు విభక్తి రూపం మూలంలోని సంక్షిప్తతను సహజంగా నిలుపుతుంది.
- source_word: λοιδορεῖς
  choice: దూషిస్తున్నావా
  rationale: λοιδορέω మాటలతో అవమానించడం, నిందించడం, దుర్భాషలాడడం అనే భావాన్ని కలిగి ఉంది. ‘దూషిస్తున్నావా’ ఆ గంభీరమైన మాటల దాడిని సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయంగా మరింత సాధారణ భాషలో ‘అవమానిస్తున్నావా’ అనవచ్చు.
theological_decisions:
- issue: τοῦ θεοῦ అనే పదబంధం ప్రధాన యాజకునికి వర్తించే విధానం
  choice: ‘దేవుని ప్రధాన యాజకుడు’ అనే సంబంధార్థంతో అనువదించడం
  alternative: ‘దేవునికి చెందిన ప్రధాన యాజకుడు’
  rationale: ఈ పదబంధం ఆ పదవిని దేవునితో సంబంధపరుస్తుంది. ఆ వ్యక్తి ప్రవర్తనకు దేవుని ఆమోదం ఉందని మూలపాఠం చెప్పినదానికంటే ఎక్కువగా సూచించకుండా, పదవికి సంబంధించిన మూలంలోని భావాన్ని మాత్రమే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే న్యాయసభ సందర్భానికి తగిన గౌరవప్రదమైన శైలి. ప్రశ్నలోని మందలింపు స్వరం అలాగే ఉంచబడింది.
