  terminology: ‘ప్రధాన యాజకుడు’ is the standard and appropriate equivalent for ἀρχιερεύς in this context. ‘దూషిస్తున్నావా?’ suitably conveys λοιδορεῖς (revile/insult); the alternative ‘అవమానిస్తున్నావా?’ is a valid lexical alternative.
