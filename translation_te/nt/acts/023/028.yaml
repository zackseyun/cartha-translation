  text: βουλόμενός ⸀τε ⸀ἐπιγνῶναι τὴν αἰτίαν δι’ ἣν ἐνεκάλουν αὐτῷ, ⸀κατήγαγον εἰς τὸ συνέδριον αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/028.yaml
  text: And wanting to know the charge for which they were accusing him[a], I brought him down to their council.
translation:
  language: te
  text: వారు అతనిమీద ఏ అభియోగం మోపుతున్నారో తెలుసుకోవాలని, నేను అతన్ని వారి సభకు కిందికి తీసుకువచ్చాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి సన్హెద్రిన్.” ఇక్కడ గ్రీకు συνέδριον అనే పదం యెరూషలేములోని యూదుల పాలక మండలిని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενός τε ἐπιγνῶναι
  choice: తెలుసుకోవాలని
  rationale: లూసియ ఉద్దేశాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ἐπιγνῶναι లోని విషయాన్ని నిర్ధారించుకోవాలనే భావం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: τὴν αἰτίαν δι’ ἣν ἐνεκάλουν αὐτῷ
  choice: వారు అతని మీద మోపుతున్న నేరం ఏమిటో
  rationale: న్యాయసంబంధ సందర్భంలో αἰτίαను ‘నేరం’గా, ἐγκαλέωను ‘మీద మోపడం’గా కలిపి అనువదించడం ఆరోపణకు ఆధారమైన అభియోగాన్ని సహజంగా వ్యక్తం చేస్తుంది; అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న చర్యను ‘మోపుతున్న’ నిలుపుతుంది.
- source_word: κατήγαγον
  choice: తీసుకువెళ్లాను
  rationale: గ్రీకులోని ‘కిందికి తీసుకువెళ్లాను’ అనే దిశార్థం తెలుగులో స్థలవివరాలు లేకుండా కృత్రిమంగా వినిపించవచ్చు; ప్రధాన చర్యను సహజంగా అందిస్తుంది.
- source_word: εἰς τὸ συνέδριον αὐτῶν
  choice: వారి న్యాయసభ ఎదుటికి
  rationale: συνέδριον ఇక్కడ యెరూషలేములోని యూదుల పాలక న్యాయసభను సూచిస్తుంది. ‘ఎదుటికి’ అనేది వ్యక్తిని సభ ముందు హాజరుపరచిన భావాన్ని తెలుగులో స్పష్టంగా ఇస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; అధికారిక నివేదికకు తగిన గౌరవప్రదమైన, కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే న్యాయపరమైన భాష. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
