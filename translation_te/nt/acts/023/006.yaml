id: ACT.23.6
reference: Acts 23:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Γνοὺς δὲ ὁ Παῦλος ὅτι τὸ ἓν μέρος ἐστὶν Σαδδουκαίων τὸ δὲ ἕτερον Φαρισαίων ⸀ἔκραζεν ἐν τῷ συνεδρίῳ· Ἄνδρες ἀδελφοί, ἐγὼ Φαρισαῖός εἰμι, υἱὸς ⸀Φαρισαίων· περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν ⸀ἐγὼ κρίνομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/006.yaml
  text: But Paul[a], knowing that one part were Sadducees and the other Pharisees, cried out in the council, “Men, brothers, I am a Pharisee, a son of Pharisees[c][b]. It is concerning the hope and resurrection of the dead that I am being judged.”
translation:
  language: te
  text: 'అయితే, అక్కడ ఒక వర్గం సద్దూకయ్యులదని, మరొక వర్గం పరిసయ్యులదని పౌలు గ్రహించి, మహాసభలో[a] బిగ్గరగా ఇలా అన్నాడు: “సోదరులారా, నేను పరిసయ్యుణ్ణి, పరిసయ్యుల కుమారుణ్ణి.[b] నిరీక్షణను, మృతుల పునరుత్థానాన్ని గూర్చి నేను విచారణకు గురవుతున్నాను.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సన్హెద్రిన్‌లో.” గ్రీకు పదం ప్రత్యేకంగా యూదుల పాలక మహాసభను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “పరిసయ్యులైన తల్లిదండ్రులకు పుట్టినవాణ్ణి” లేదా “పరిసయ్యుల వంశానికి చెందినవాణ్ణి.”
    reason: alternative_reading
  - marker: c
    text: లేదా “మృతుల పునరుత్థాన నిరీక్షణను గూర్చి నేను విచారణకు గురవుతున్నాను.”
    reason: alternative_reading
lexical_decisions:
- source_word: Γνοὺς
  choice: గ్రహించి
  rationale: అయోరిస్ట్ కృదంతం పౌలు పలికిన మాటలకు దారితీసిన పరిస్థితిని సూచిస్తుంది; ‘గ్రహించి’ దాని కృదంత భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τὸ ἓν μέρος ... τὸ δὲ ἕτερον
  choice: ఒక వర్గం ... మరొక వర్గం
  rationale: μέρος సభలోని విభాగాన్ని సూచిస్తుంది. తెలుగులో ‘వర్గం’ సందర్భాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: Σαδδουκαίων / Φαρισαίων
  choice: సద్దూకయ్యులు / పరిసయ్యులు
  rationale: యూదా మతవర్గాల పేర్లకు తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణలు.
- source_word: ἔκραζεν
  choice: బిగ్గరగా ఇలా అన్నాడు
  rationale: క్రియలోని గట్టిగా బహిరంగంగా పలికే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν τῷ συνεδρίῳ
  choice: మహాసభలో
  rationale: సందర్భంలో συνέδριον యూదుల పాలక మండలిని సూచిస్తుంది; ‘మహాసభ’ అర్థవంతమైన తెలుగు రూపం. ‘సన్హెద్రిన్’ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: Ἄνδρες ἀδελφοί
  choice: సోదరులారా
  rationale: ఇది పురుషులను ఉద్దేశించిన సంబోధన అని సందర్భం స్పష్టం చేస్తుంది; రెండు గ్రీకు పదాలను యాంత్రికంగా విడివిడిగా అనువదించడం తెలుగులో అసహజం కాబట్టి గౌరవప్రదమైన సహజ సంబోధన వాడాం.
- source_word: Φαρισαῖός εἰμι
  choice: నేను పరిసయ్యుణ్ణి
  rationale: వర్తమానకాల స్వీయ గుర్తింపును నేరుగా నిలుపుతుంది.
- source_word: υἱὸς Φαρισαίων
  choice: పరిసయ్యుల కుమారుణ్ణి
  rationale: బహువచనమైన Φαρισαίωνను, కుటుంబ సంబంధ రూపకాన్ని నిలుపుతూ, తల్లిదండ్రులనో పూర్వీకులనో అనవసరంగా ఖచ్చితపరచదు.
- source_word: περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν
  choice: నిరీక్షణను, మృతుల పునరుత్థానాన్ని గూర్చి
  rationale: ἐλπίδος మరియు ἀναστάσεωςలను καί సమన్వయపరుస్తుంది. ప్రధాన పాఠం రెండు సన్నిహిత భావాలను విడిగా ఉంచుతుంది; ఒకే ‘పునరుత్థాన నిరీక్షణ’గా చదివే అవకాశాన్ని పాదసూచికలో నిలిపాం.
- source_word: κρίνομαι
  choice: నేను విచారణకు గురవుతున్నాను
  rationale: వర్తమాన కర్మణి రూపాన్ని, పౌలు ఎదుర్కొంటున్న న్యాయ విచారణ సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: υἱὸς Φαρισαίων అనే పౌలు వాదన యొక్క పరిధి
  choice: ‘పరిసయ్యుల కుమారుణ్ణి’ అనే కుటుంబ సంబంధ నుడికారాన్ని యథాతథంగా నిలిపాం.
  alternative: ‘పరిసయ్యులైన తల్లిదండ్రులకు పుట్టినవాణ్ణి’ లేదా ‘పరిసయ్యుల వంశానికి చెందినవాణ్ణి.’
  rationale: గ్రీకు బహువచనం తల్లిదండ్రులు, పూర్వీకులు లేదా కుటుంబ-వర్గ అనుబంధం అనే ఛాయలకు అవకాశం ఇస్తుంది. పాఠం చెప్పినదానికంటే సంకుచితమైన చారిత్రక నిర్ధారణను అనువాదం రుద్దకూడదు.
- issue: ‘నిరీక్షణ’కు ‘మృతుల పునరుత్థానం’తో ఉన్న సంబంధం
  choice: ‘నిరీక్షణను, మృతుల పునరుత్థానాన్ని’ అని సమన్వయ రూపాన్ని నిలిపాం.
  alternative: ‘మృతుల పునరుత్థాన నిరీక్షణను గూర్చి.’
  rationale: గ్రీకులో ἐλπίδος మరియు ἀναστάσεως καίతో కలపబడ్డాయి. ఇవి దగ్గరి సంబంధమున్న రెండు అంశాలుగానూ, పునరుత్థానంపై కేంద్రీకృతమైన ఒకే నిరీక్షణగానూ అర్థమవవచ్చు; ప్రధాన పాఠం ఆ ఉద్వేగాన్ని పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయసభా శైలిని వాడాం. ‘పరిసయ్యుల కుమారుడు’ అనే కొద్దిగా శాస్త్రీయ నుడికారాన్ని మూలంలోని ఉద్దేశపూర్వక అస్పష్టత కోసం నిలిపాం; పాదసూచికలు సాధ్యమైన అర్థాలను వివరిస్తాయి.
