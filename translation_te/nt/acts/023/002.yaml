  yaml_path: translation/nt/acts/023/002.yaml
  text: But the high priest Ananias ordered those standing by him to strike him on the mouth[a].
translation:
  language: te
  text: అయితే ప్రధాన యాజకుడైన అననీయుడు తన దగ్గర నిలబడి ఉన్నవారికి పౌలు నోటిమీద కొట్టమని ఆజ్ఞాపించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పౌలు నోటిమీద చెంపదెబ్బ కొట్టమని.’ గ్రీకు క్రియ సాధారణంగా కొట్టడాన్ని సూచించగలదు; ‘చెంపదెబ్బ కొట్టడం’ సాధ్యమైనదే గాని మరింత నిర్దిష్టమైన అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: పౌలు ముందుగా చెప్పిన మాటకు ఎదురుగా వచ్చిన ఆకస్మిక ప్రతిస్పందనను, అతిగా బలమైన విరోధార్థం కలిగించకుండా సూచిస్తుంది.
- source_word: ἀρχιερεὺς
  choice: ప్రధాన యాజకుడు
  rationale: ఆ కాలంలోని ఏకవచన అధికార పదవిని తెలిపే సహజమైన, స్థిరమైన తెలుగు సమానం.
- source_word: Ἁνανίας
  choice: అననీయ
  rationale: గ్రీకు వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: ἐπέταξεν
  choice: ఆజ్ఞాపించాడు
  rationale: అధికారంతో ఆదేశించడమనే క్రియ బలాన్ని సహజమైన గౌరవప్రద తెలుగు భాషలో నిలుపుతుంది.
- source_word: τοῖς παρεστῶσιν αὐτῷ
  choice: తన దగ్గర నిలబడి ఉన్నవారికి
  rationale: అననీయ సమీపంలో ఉన్న వ్యక్తులను సూచించే స్థలార్థాన్ని స్పష్టంగా నిలుపుతుంది; αὐτῷ అననీయను సూచించేలా సహజంగా అనువదించబడింది.
- source_word: τύπτειν
  choice: కొట్టమని
  rationale: కొట్టడం లేదా దెబ్బకొట్టడం అనే విస్తృత అర్థాన్ని నిలుపుతుంది; చెంపదెబ్బ అని విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: αὐτοῦ τὸ στόμα
  choice: పౌలు నోటిమీద
  rationale: గ్రీకులోని సర్వనామం సందర్భానుసారంగా పౌలును సూచిస్తుంది. తెలుగులో రెండు సర్వనామాల వల్ల కలిగే అయోమయాన్ని నివారిస్తూ, దెబ్బ తగలవలసిన భాగాన్ని సహజంగా వ్యక్తం చేస్తుంది.
