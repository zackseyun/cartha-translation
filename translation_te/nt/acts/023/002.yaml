translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘తన’ అనేది అననీయను, ‘పౌలు’ అనేది దెబ్బకు గురయ్యే వ్యక్తిని స్పష్టంగా సూచించేలా నిర్మాణం ఎంచుకోబడింది. ప్రధాన పాఠంలోని [a] సూచిక సంబంధిత పాదటీకతో సరిపోతుంది.
