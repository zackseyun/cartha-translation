id: ACT.23.11
reference: Acts 23:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπιούσῃ νυκτὶ ἐπιστὰς αὐτῷ ὁ κύριος εἶπεν· ⸀Θάρσει, ὡς γὰρ διεμαρτύρω τὰ περὶ ἐμοῦ εἰς Ἰερουσαλὴμ οὕτω σε δεῖ καὶ εἰς Ῥώμην μαρτυρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/011.yaml
  text: But on the following night[a], the Lord stood by him and said, “Take courage, for just as you have testified about me in Jerusalem[b], so you must also testify in Rome.”
translation:
  language: te
  text: మరుసటి రాత్రి ప్రభువు అతని పక్కన నిలబడి, “ధైర్యంగా ఉండు! నీవు యెరూషలేములో నా గురించి సాక్ష్యమిచ్చినట్లే[a], రోములో కూడా సాక్ష్యమివ్వాలి” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సాక్ష్యమిచ్చినట్లే … సాక్ష్యమివ్వాలి.” గ్రీకులో గత సాక్ష్యానికి, భవిష్యత్తు సాక్ష్యానికి వాడిన క్రియలు ఒకే సాక్ష్యం/సాక్ష్యమివ్వడం అనే పదకుటుంబానికి చెందినవి.
    reason: గ్రీకులోని διεμαρτύρω మరియు μαρτυρῆσαι మధ్య ఉన్న పదసంబంధాన్ని చూపడానికి.
lexical_decisions:
- source_word: Τῇ δὲ ἐπιούσῃ νυκτί
  choice: అయితే ఆ తరువాతి రాత్రి
  rationale: ἐπιούσῃ νυκτί అంటే తరువాతి రాత్రి. δέకు ఉన్న స్వల్ప సంధాన/వ్యతిరేక భావాన్ని సహజమైన తెలుగు కథనశైలిలో ‘అయితే’తో వ్యక్తం చేశాం.
- source_word: ἐπιστὰς αὐτῷ
  choice: అతని పక్కన నిలబడి
  rationale: ప్రభువు పౌలు సమీపంలో వచ్చి నిలిచిన భావాన్ని ఇది నేరుగా తెలియజేస్తుంది; ‘ప్రత్యక్షమై’ అని అనువదిస్తే మూలంలో ఉన్నదానికంటే ఎక్కువ వ్యాఖ్యానం చేరుతుంది.
- source_word: ὁ κύριος
  choice: ప్రభువు
  rationale: κύριοςకు సందర్భానుకూలమైన, గౌరవప్రదమైన సాధారణ తెలుగు పదం. మూలం చెప్పినదానికంటే స్పష్టంగా ‘ప్రభువైన యేసు’ అని విస్తరించలేదు.
- source_word: Θάρσει
  choice: ధైర్యంగా ఉండు
  rationale: వర్తమాన ఆజ్ఞారూపంలోని ప్రోత్సాహాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: διεμαρτύρω … μαρτυρῆσαι
  choice: సాక్ష్యమిచ్చినట్లే … సాక్ష్యమివ్వాలి
  rationale: గ్రీకులోని రెండు క్రియల సాక్ష్యం/సాక్ష్యమివ్వడం అనే పదబంధ సంబంధాన్ని తెలుగులో ఒకే పదకుటుంబంతో నిలిపాం.
- source_word: τὰ περὶ ἐμοῦ
  choice: నా గురించి
  rationale: యేసుకు సంబంధించిన విషయాలు అనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς Ἰερουσαλὴμ … εἰς Ῥώμην
  choice: యెరూషలేములో … రోములో
  rationale: నగరాలలో సాక్ష్యమిచ్చే స్థలార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేశాం; కొయినే గ్రీకులో εἰς ఇక్కడ స్థానార్థక ప్రయోగంగా ఉంది.
- source_word: οὕτω … καί
  choice: అలాగే … కూడా
  rationale: యెరూషలేములో జరిగిన సాక్ష్యానికి, రోములో జరగవలసిన సాక్ష్యానికి మధ్య ఉన్న సమాంతరతను స్పష్టంగా నిలుపుతుంది.
- source_word: σε δεῖ
  choice: సాక్ష్యమివ్వాలి
  rationale: δεῖ తెలిపే అవసరతను స్పష్టంగా ఉంచుతుంది; దాన్ని విధివాదంగా లేదా ముందే నిర్ణయించబడిన గమ్యంగా విస్తరించదు.
theological_decisions:
- issue: ὁ κύριος ఎవరిని సూచిస్తుంది?
  choice: ‘ప్రభువు’ అని మాత్రమే అనువదించడం
  alternative: ‘ప్రభువైన యేసు’ అని స్పష్టీకరించడం
  rationale: అపొస్తలుల కార్యముల సందర్భంలో మాట్లాడుతున్నవాడు పునరుత్థానుడైన యేసు అని అర్థమవుతుంది. అయినా గ్రీకు మూలం ‘ప్రభువు’ అని మాత్రమే ఉన్నందున అనువాదం ఆ రూపాన్నే నిలిపి, వివరణాత్మక పదాన్ని చేర్చదు.
- issue: δεῖ యొక్క బలం
  choice: ‘సాక్ష్యమివ్వాలి’ అనే అవసరత
  alternative: ‘సాక్ష్యమివ్వడం నీకు తప్పనిసరి’ లేదా ‘నీవు సాక్ష్యమివ్వడానికి నిర్ణయించబడ్డావు’
  rationale: ఇక్కడ దైవిక అవసరత అంతర్లీనంగా ఉన్నప్పటికీ, మూలవాక్యం దాని విధానాన్ని వివరించదు. అందువల్ల అవసరతను నిలిపి, విధివాద లేదా పూర్వనిర్ణయ భావాన్ని అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే కథన గౌరవం మరియు ప్రభువు పలికిన ప్రోత్సాహభరిత స్వరం నిలిచేలా రూపొందించబడింది. గ్రీకులోని రెండు సాక్ష్యక్రియల పదసంబంధాన్ని తెలుగులో స్పష్టంగా కాపాడాం.
