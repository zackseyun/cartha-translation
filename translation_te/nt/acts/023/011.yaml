review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the Lord''s standing near Paul, the imperative of encouragement, Paul''s prior testimony in Jerusalem, and the necessary future testimony in Rome. The wording “ఆ తరువాతి రాత్రి” is potentially less precise than the Greek: it can suggest a night following some unspecified event, whereas ἐπιούσῃ νυκτί naturally means “the next/following night.”'
  naturalness: The sentence is otherwise fluent, dignified modern Telugu. Replacing “అయితే ఆ తరువాతి రాత్రి” with “మరుసటి రాత్రి” is more idiomatic and temporally exact. “అతని పక్కన నిలబడి” is natural and suitably preserves the non-interpretive sense of ἐπιστάς αὐτῷ.
  terminology: “ప్రభువు,” “ధైర్యంగా ఉండు,” and the paired expressions “సాక్ష్యమిచ్చినట్లే … సాక్ష్యమివ్వాలి” appropriately preserve the register and the Greek witness/testimony word-group connection. “సాక్ష్యమివ్వాలి” retains the necessity of δεῖ without adding a theory of predestination.
  issues:
  - severity: low
    issue: Temporal phrase is slightly imprecise/awkward.
    rationale: “ఆ తరువాతి రాత్రి” can be read as ‘the night after that,’ while Τῇ δὲ ἐπιούσῃ νυκτί is most naturally ‘the following/next night.’ “మరుసటి రాత్రి” is both natural Telugu and closer to the source.
  revised_text: మరుసటి రాత్రి ప్రభువు అతని పక్కన నిలబడి, “ధైర్యంగా ఉండు! నీవు యెరూషలేములో నా గురించి సాక్ష్యమిచ్చినట్లే[a], రోములో కూడా సాక్ష్యమివ్వాలి” అని చెప్పాడు.
