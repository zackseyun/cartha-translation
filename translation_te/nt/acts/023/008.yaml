    rationale: The Greek has singular ἄγγελον and πνεῦμα, and πνεῦμα need not be framed as a personal plural referent in Telugu. “దేవదూత గానీ ఆత్మ గానీ ఉండవని” maintains the coordinated negation while remaining neutral and natural.
