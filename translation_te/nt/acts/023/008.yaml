source:
  edition: SBLGNT
  text: Σαδδουκαῖοι ⸀μὲν γὰρ λέγουσιν μὴ εἶναι ἀνάστασιν ⸀μήτε ἄγγελον μήτε πνεῦμα, Φαρισαῖοι δὲ ὁμολογοῦσιν τὰ ἀμφότερα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/008.yaml
  text: For the Sadducees say there is no resurrection[a], nor angel nor spirit, but the Pharisees acknowledge both.
translation:
  language: te
  text: ఎందుకంటే, పునరుత్థానం లేదని, దేవదూత గానీ ఆత్మ గానీ ఉండవని సద్దూకయ్యులు అంటారు; అయితే పరిసయ్యులు ఆ రెండింటినీ అంగీకరిస్తారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిసయ్యులు ఆ మూడింటినీ అంగీకరిస్తారు”—అంటే పునరుత్థానం, దేవదూత, ఆత్మ. గ్రీకు పాఠంలో అక్షరార్థంగా “రెండింటినీ” అని ఉంది; ఇది అత్యంత నేరుగా “దేవదూత,” “ఆత్మ”లను సూచిస్తుంది. అయితే సందర్భాన్ని బట్టి కొందరు దీనిని మూడు అంశాలన్నిటినీ సూచించేదిగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: సద్దూకయ్యులు
  rationale: యూదులలోని ఈ వర్గం పేరుకు ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: μὲν γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి సందర్భానికి వివరణ ఇచ్చే గ్రీకు అవ్యయాల భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: λέγουσιν
  choice: అంటారు
  rationale: ఒక వర్గం సాధారణంగా ప్రకటించే నమ్మకాన్ని వర్తమాన కాలంలో సహజంగా నివేదిస్తుంది.
- source_word: μὴ εἶναι ἀνάστασιν
  choice: పునరుత్థానం లేదని
  rationale: ఉనికిని నిరాకరించే గ్రీకు infinitival clause‌ను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μήτε ἄγγελον μήτε πνεῦμα
  choice: దేవదూతగానీ ఆత్మగానీ లేరని
  rationale: μήτε…μήτε అనే జత నిరాకరణను నిలుపుతుంది. వ్యక్తులను లేదా వ్యక్తిత్వమున్న సత్తలను సూచించే అవకాశం కారణంగా తెలుగు వాక్యసమ్మతికి ‘లేరు’ వాడబడింది.
- source_word: Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: యూదులలోని ఈ వర్గానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: ὁμολογοῦσιν
  choice: అంగీకరిస్తారు
  rationale: ఇక్కడ ‘నిజమని ఒప్పుకోవడం/ధృవీకరించడం’ అనే భావం; ‘ఒప్పుకుంటారు’ కంటే ‘అంగీకరిస్తారు’ గంభీరంగా, స్పష్టంగా ఉంటుంది.
- source_word: τὰ ἀμφότερα
  choice: ఆ రెండింటినీ
  rationale: గ్రీకులోని ‘రెండూ’ అనే పదాన్ని నేరుగా నిలుపుతూ, అత్యంత సమీపంలోని ‘దేవదూత’ మరియు ‘ఆత్మ’ అనే జతను సూచిస్తుంది; విస్తృత సందర్భార్థాన్ని పాదటిప్పణిలో ఉంచింది.
theological_decisions:
- issue: పరిసయ్యులు అంగీకరించే ‘రెండింటి’ పరిధి
  choice: ప్రధాన పాఠంలో ‘ఆ రెండింటినీ’ అని ఉంచి, అత్యంత సమీపంలోని దేవదూత మరియు ఆత్మను సూచించేలా గ్రీకు పదాన్ని యథాతథంగా నిలుపడం.
  alternative: పరిసయ్యులు పునరుత్థానం, దేవదూత, ఆత్మ అనే మూడింటినీ అంగీకరిస్తారు.
  rationale: τὰ ἀμφότερα అక్షరార్థంగా ‘రెండూ’; అది ‘మూడూ’ అని చెప్పదు. అయితే వాక్యంలోని మూడు అంశాలు మరియు పరిసయ్యుల పునరుత్థాన విశ్వాసం కారణంగా విస్తృత అవగాహన సాధ్యమే. అందువల్ల ఆ ఉద్వేగాన్ని పరిష్కరించకుండా పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. గ్రీకు పాఠంలోని వివరణాత్మక సంబంధం, జత నిరాకరణ, ‘రెండూ’ అనే ఉద్దేశపూర్వక అస్పష్టత నిలుపబడ్డాయి. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠంలో స్పష్టంగా చేర్చబడింది.
