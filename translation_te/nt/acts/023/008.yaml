  source_fidelity: The draft faithfully renders the explanatory force of μὲν γάρ, the three denied items, and τὰ ἀμφότερα as “రెండింటినీ,” while preserving the broader contextual interpretation in a footnote. A small adjustment avoids assigning an unnecessarily personal plural form to πνεῦμα (“spirit”).
