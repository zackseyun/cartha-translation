- from: కొందరైతే చెప్పబడుతున్న విషయాలకు ఒప్పుకున్నారు; అయితే మరికొందరు నమ్మకపోయారు[a].
  to: కొందరు చెప్పబడుతున్న మాటలకు ఒప్పుకోగా, మరికొందరు నమ్మలేదు[a].
