  yaml_path: translation/nt/acts/028/024.yaml
  text: And some were persuaded by what was being said[a], but others disbelieved.
translation:
  language: te
  text: కొందరు చెప్పబడుతున్న మాటలకు ఒప్పుకోగా, మరికొందరు నమ్మలేదు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విశ్వసించలేదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείθοντο
  choice: ఒప్పుకున్నారు
  rationale: అసంపూర్ణ కాలంలోని మధ్యమ/కర్మణి రూపం, చెప్పబడుతున్న విషయాల ప్రభావంతో కొందరు ఒప్పించబడుతున్న ప్రతిస్పందనను సూచిస్తుంది. సహజమైన తెలుగులో ‘ఒప్పుకున్నారు’ ఆ భావాన్ని తెలియజేస్తుంది; దాన్ని పూర్తి రక్షణాత్మక విశ్వాసంగా ముందే నిర్ణయించదు.
- source_word: τοῖς λεγομένοις
  choice: చెప్పబడుతున్న విషయాలకు
  rationale: వర్తమాన కర్మణి కృదంతం కొనసాగుతున్న ప్రసంగంలోని విషయాలను సూచిస్తుంది. ‘చెప్పబడుతున్న’ అనే రూపం ఆ కొనసాగుతున్న చర్యను నిలుపుతుంది.
- source_word: ἠπίστουν
  choice: నమ్మకపోయారు
  rationale: ఈ క్రియ నమ్మకపోవడం లేదా అవిశ్వాసం చూపడం అనే భావాన్ని ఇస్తుంది. ‘నమ్మకపోయారు’ అనేది సంకల్పపూర్వక నిరాకరణను అనవసరంగా చేర్చకుండా మూలంలోని విస్తృత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: కొందరైతే ... అయితే మరికొందరు
  rationale: ఈ సహసంబంధ నిర్మాణం ఒకే సమూహంలో వచ్చిన రెండు భిన్న ప్రతిస్పందనలను స్పష్టంగా విభజిస్తుంది.
- source_word: καὶ
  choice: ప్రత్యేక పదంగా అనువదించకుండా వాక్యప్రవాహంలో కలపబడింది
  rationale: ఇక్కడ καί ముందరి కథనంతో సరళమైన అనుసంధానాన్ని కలిగిస్తుంది. తెలుగులో వాక్యారంభంలో అదనపు సంధిపదం లేకుండానే సందర్భం ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రతిస్పందనల స్వభావం
  choice: ఒక వర్గం చెప్పబడుతున్న విషయాలకు ఒప్పుకోగా, మరో వర్గం వాటిని నమ్మలేదని మాత్రమే పేర్కొనడం
  alternative: మొదటి వర్గం రక్షణ పొందిన నిజ విశ్వాసులు, రెండవ వర్గం కఠినపడిన అవిశ్వాసులు అని స్పష్టీకరించడం
  rationale: గ్రీకు వాక్యం ఆ సందేశానికి వచ్చిన తక్షణ భిన్న ప్రతిస్పందనలను మాత్రమే తెలియజేస్తుంది; వారి అంతిమ ఆధ్యాత్మిక స్థితిని నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘ఒప్పుకున్నారు’ మరియు ‘నమ్మకపోయారు’ మధ్య తేడాను ఉంచి, మూలంలోని భావపరమైన ఉద్రిక్తతను కాపాడింది.
