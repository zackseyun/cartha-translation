id: ACT.28.6
reference: Acts 28:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ προσεδόκων αὐτὸν μέλλειν πίμπρασθαι ἢ καταπίπτειν ἄφνω νεκρόν. ἐπὶ πολὺ δὲ αὐτῶν προσδοκώντων καὶ θεωρούντων μηδὲν ἄτοπον εἰς αὐτὸν γινόμενον, ⸀μεταβαλόμενοι ἔλεγον ⸂αὐτὸν εἶναι θεόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/006.yaml
  text: But they were expecting him to swell up or suddenly fall down dead. But after they had waited a long time and saw that nothing unusual was happening to him[a], they changed their minds and began saying that he was a god.
translation:
  language: te
  text: కాని, అతడు ఉబ్బిపోతాడని లేదా అకస్మాత్తుగా కూలిపోయి చనిపోతాడని వారు ఎదురుచూస్తూ ఉన్నారు. వారు చాలాసేపు ఎదురుచూసి, అతనికి అసాధారణమైనదేదీ జరగకపోవడం చూసిన తర్వాత, తమ అభిప్రాయాన్ని మార్చుకొని, అతడు ఒక దేవుడని చెప్పడం మొదలుపెట్టారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεδόκων
  choice: ఎదురుచూస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న నిరీక్షణను సూచిస్తుంది; ఆధునిక తెలుగులో ఈ ప్రయోగం ఆ కాలవ్యాప్తిని సహజంగా తెలియజేస్తుంది.
- source_word: μέλλειν πίμπρασθαι
  choice: శరీరం ఉబ్బిపోతుందని
  rationale: పాముకాటు సందర్భంలో πίμπρασθαι శరీరం ఉబ్బడాన్ని సూచిస్తుంది; μέλλειν వారి సమీపకాల అంచనాలో అంతర్భూతంగా వ్యక్తమవుతుంది. స్పష్టత కోసం ‘శరీరం’ సందర్భానుగుణంగా చేర్చబడింది.
- source_word: καταπίπτειν ἄφνω νεκρόν
  choice: అకస్మాత్తుగా కిందపడి చనిపోతాడని
  rationale: కూలిపోవడాన్నీ మరణ ఫలితాన్నీ రెండింటినీ నిలుపుతూ, ἄφνωను ‘అకస్మాత్తుగా’గా వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ πολὺ
  choice: చాలాసేపు
  rationale: దీర్ఘకాలం గమనిస్తూ ఎదురుచూసిన భావాన్ని సంక్షిప్తమైన సహజ తెలుగు కాలవ్యక్తీకరణతో అందిస్తుంది.
- source_word: θεωρούντων
  choice: చూసినప్పుడు
  rationale: కేవలం చూడడం కంటే శ్రద్ధగా గమనించి నిర్ధారించుకున్న భావం సందర్భంలో ఉంది; వాక్య నిర్మాణంలో ‘చూసినప్పుడు’ సహజంగా పనిచేస్తుంది.
- source_word: μηδὲν ἄτοπον
  choice: అసాధారణమైనదేదీ
  rationale: ἄτοποςలోని విచిత్రమైనది, మామూలుకు భిన్నమైనది, సరిగా లేనిది అనే విస్తృత భావాన్ని ‘హాని’గా అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: μεταβαλόμενοι
  choice: తమ అభిప్రాయం మార్చుకొని
  rationale: వారి మునుపటి నిర్ణయం పూర్తిగా మారినట్లు స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἔλεγον
  choice: చెప్పడం మొదలుపెట్టారు
  rationale: అసంపూర్ణ భూతకాలంలోని ఆరంభ లేదా కొనసాగింపు భావానికి అనుగుణంగా, మారిన అభిప్రాయాన్ని వారు పలకడం ప్రారంభించారని తెలియజేస్తుంది.
- source_word: θεόν
  choice: ఒక దేవుడు
  rationale: అనిర్దిష్ట θεόνను, స్థానికుల బహుదేవతా నేపథ్యాన్ని బట్టి ‘ఒక దేవుడు’గా అనువదించడం సముచితం; ‘దేవుడే’ లేదా ఏకైక దేవుడు అనే భావాన్ని దిగుమతి చేయదు.
theological_decisions:
- issue: αὐτὸν εἶναι θεόν అనే మాటను పౌలు స్థితిపై తరువాతి క్రైస్తవ వాదనగా అనిపించకుండా అనువదించడం
  choice: అతడు ఒక దేవుడని
  alternative: అతడే దేవుడని; అతడు దైవికుడని
  rationale: ఇది ద్వీపవాసుల పొరపాటు నిర్ధారణను కథనం నివేదిస్తున్న సందర్భం. అనిర్దిష్ట θεόν మరియు వారి బహుదేవతా దృష్టిని ‘ఒక దేవుడు’ సరిగ్గా ప్రతిబింబిస్తుంది; పౌలును ఏకైక దేవునితో సమానపరచదు.
translation_notes:
  register: సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యే, అయితే గౌరవప్రదమైన ప్రామాణిక తెలుగు ఉపయోగించబడింది. మొదటి వాక్యంలో పునరుక్తిని నివారించకుండా గ్రీకు వాక్యంలోని కొనసాగుతున్న నిరీక్షణను నిలిపాము; ‘శరీరం’ సందర్భ స్పష్టత కోసం చేర్చబడింది. ప్రధాన పాఠంలోని [a] గుర్తు పాదసూచికతో సరిపోలుతుంది.
