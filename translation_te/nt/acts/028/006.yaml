revisions:
- from: కాని అతని శరీరం ఉబ్బిపోతుందని, లేదా అతడు అకస్మాత్తుగా కిందపడి చనిపోతాడని వారు ఎదురుచూస్తూ ఉన్నారు. వారు చాలాసేపు ఎదురుచూసి, అతనికి అసాధారణమైనదేదీ జరగకపోవడం చూసినప్పుడు[a], తమ అభిప్రాయం మార్చుకొని, అతడు ఒక దేవుడని చెప్పడం మొదలుపెట్టారు.
  to: కాని, అతడు ఉబ్బిపోతాడని లేదా అకస్మాత్తుగా కూలిపోయి చనిపోతాడని వారు ఎదురుచూస్తూ ఉన్నారు. వారు చాలాసేపు ఎదురుచూసి, అతనికి అసాధారణమైనదేదీ జరగకపోవడం చూసిన తర్వాత, తమ అభిప్రాయాన్ని మార్చుకొని, అతడు ఒక దేవుడని చెప్పడం మొదలుపెట్టారు.
  rationale: The revision retains the source meaning and the English audit trail while improving standard Telugu idiom. “కూలిపోయి చనిపోతాడని” naturally expresses the sudden fall and resulting death. The corrected footnote offers valid, intelligible alternatives for the broad sense of ἄτοπον.
