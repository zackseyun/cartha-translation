id: ACT.28.22
reference: Acts 28:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀξιοῦμεν δὲ παρὰ σοῦ ἀκοῦσαι ἃ φρονεῖς, περὶ μὲν γὰρ τῆς αἱρέσεως ταύτης γνωστὸν ⸂ἡμῖν ἐστιν⸃ ὅτι πανταχοῦ ἀντιλέγεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/022.yaml
  text: But we consider it proper to hear from you what you think[a], for concerning this sect it is known to us that it is spoken against everywhere.
translation:
  language: te
  text: అయితే, నీ అభిప్రాయం ఏమిటో నీ నుంచే వినడం సముచితమని మేము భావిస్తున్నాం. ఎందుకంటే, ఈ వర్గం[a] గురించి ప్రతిచోటా వ్యతిరేకంగా మాట్లాడుతున్నారని మాకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పక్షం,” “ఉద్యమం.” ఇక్కడి గ్రీకు పదం αἵρεσις తరువాత కాలంలో ఏర్పడిన సాంకేతిక అర్థంలో తప్పనిసరిగా “మతవిరోధ బోధ” అని అర్థం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀξιοῦμεν
  choice: సముచితమని మేము భావిస్తున్నాం
  rationale: ఈ సందర్భంలో ఈ క్రియ యోగ్యత లేదా సముచితతపై మర్యాదపూర్వకమైన నిర్ణయాన్ని వ్యక్తం చేస్తుంది; బలమైన ఆజ్ఞగా గానీ కేవలం కోరికగా గానీ అనువదించదు.
- source_word: παρὰ σοῦ ἀκοῦσαι
  choice: నీ నుంచే వినడం
  rationale: παρά + షష్ఠీ విభక్తి పౌలు స్వయంగా చెప్పేది వినాలనే ప్రత్యక్ష మూల భావాన్ని ఇస్తుంది; ‘నుంచే’ దానిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἃ φρονεῖς
  choice: నీ అభిప్రాయం ఏమిటో
  rationale: φρονέω ఇక్కడ వ్యక్తి కలిగిన దృక్కోణం లేదా అభిప్రాయాన్ని సూచిస్తుంది; ఈ రూపం ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: αἱρέσεως
  choice: వర్గం
  rationale: అపొస్తలుల కార్యముల సందర్భంలో αἵρεσις ఒక మతసామాజిక సమూహం లేదా పక్షాన్ని సూచిస్తుంది; తరువాతి సాంకేతిక అర్థమైన ‘మతవిరోధ బోధ’ను ఇక్కడ రుద్దకూడదు.
- source_word: γνωστὸν ἡμῖν ἐστιν
  choice: మాకు తెలుసు
  rationale: గ్రీకు భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; కృత్రిమమైన కర్మణి నిర్మాణాన్ని నివారించినా జ్ఞానం తమకు ఉందనే అర్థం నిలుస్తుంది.
- source_word: πανταχοῦ
  choice: ప్రతిచోటా
  rationale: విస్తృతమైన స్థలవ్యాప్తిని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἀντιλέγεται
  choice: వ్యతిరేకంగా మాట్లాడుతున్నారని
  rationale: కేవలం నైరూప్యమైన వ్యతిరేకతకంటే, ప్రజలు ఈ వర్గానికి విరోధంగా మాట్లాడుతున్నారనే గ్రీకు క్రియాత్మక భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: αἵρεσις పదానికి అనువాదం
  choice: వర్గం
  alternative: మతవిరోధ వర్గం / భ్రాంతబోధ
  rationale: ఇక్కడ ఈ పదం బయటివారి దృష్టిలో క్రైస్తవ ఉద్యమం అనే గుర్తించదగిన సమూహాన్ని సూచిస్తుంది; తరువాతి సంఘపరమైన సాంకేతిక అర్థమైన ‘heresy’ని చేర్చడం మూలపాఠానికి మించిన వ్యాఖ్యానం అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో మర్యాదపూర్వకమైన, గంభీరమైన సంభాషణ శైలి. ‘నీ’ అనే ఏకవచన సంబోధన మూలంలోని σοῦను ప్రతిబింబిస్తుంది. వాక్య నిర్మాణం సహజంగా ఉండేందుకు γνωστὸν ἡμῖν ἐστινను కర్తరి రూపంలో ఇచ్చాం; ἀντιλέγεταιలోని మాటల ద్వారా వ్యక్తమయ్యే వ్యతిరేకతను స్పష్టంగా నిలిపాం.
