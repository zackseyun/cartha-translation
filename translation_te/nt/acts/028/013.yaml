source:
  edition: SBLGNT
  text: ὅθεν ⸀περιελόντες κατηντήσαμεν εἰς Ῥήγιον. καὶ μετὰ μίαν ἡμέραν ἐπιγενομένου νότου δευτεραῖοι ἤλθομεν εἰς Ποτιόλους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/013.yaml
  text: From there[a], after weighing anchor, we came to Rhegium. And after one day, when a south wind came up, on the second day we came to Puteoli,
translation:
  language: te
  text: అక్కడి నుండి లంగరు ఎత్తి[a] రేగియానికి చేరుకున్నాం. ఒక రోజు గడిచిన తర్వాత దక్షిణ గాలి లేవగా, రెండవ రోజున పొతియొలీకి వచ్చాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రయాణం మొదలుపెట్టి.” గ్రీకు పదం περιελόντες నౌకాయానానికి సంబంధించినది; అది ప్రత్యేకంగా లంగరు ఎత్తడాన్ని గానీ, మరింత సాధారణంగా సముద్రయానం ప్రారంభించడాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: అక్కడి నుండి
  rationale: కథనంలోని స్థల మార్పును సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: περιελόντες
  choice: లంగరు ఎత్తి
  rationale: ఈ నౌకాయాన సందర్భంలో ఓడను నిలిపి ఉంచిన దానిని తొలగించి ప్రయాణం మొదలుపెట్టడాన్ని సూచించే సంభావ్య నిర్దిష్ట అర్థం; విస్తృత అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: κατηντήσαμεν
  choice: చేరుకున్నాం
  rationale: గమ్యస్థానానికి చేరడాన్ని సహజంగా, ఖచ్చితంగా వ్యక్తపరుస్తుంది.
- source_word: Ῥήγιον
  choice: రేగియు
  rationale: ప్రాచీన స్థలనామానికి తెలుగు లిప్యంతరీకరణ; విభక్తితో ‘రేగియుకు’గా వచ్చింది.
- source_word: μετὰ μίαν ἡμέραν
  choice: ఒక రోజు గడిచిన తర్వాత
  rationale: కాలవ్యవధిని తెలుగులో సహజంగా తెలియజేస్తూ మూలంలోని ‘ఒక రోజు తర్వాత’ అనే భావాన్ని నిలుపుతుంది.
- source_word: ἐπιγενομένου νότου
  choice: దక్షిణ గాలి వీచడంతో
  rationale: దక్షిణ గాలి ఏర్పడిన అనుబంధ పరిస్థితిని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: δευτεραῖοι
  choice: రెండవ రోజున
  rationale: రెండవ రోజున గమ్యానికి చేరినట్లు మూలంలోని కాలసూచనను పారదర్శకంగా నిలుపుతుంది.
- source_word: ἤλθομεν
  choice: వచ్చాం
  rationale: గమ్యస్థానాన్ని సూచించే సాధారణ గమన క్రియకు సహజమైన తెలుగు సమానం.
- source_word: Ποτιόλους
  choice: పొతియొలీ
  rationale: గ్రీకు స్థలనామానికి తెలుగు లిప్యంతరీకరణ; విభక్తితో ‘పొతియొలీకి’గా వచ్చింది.
