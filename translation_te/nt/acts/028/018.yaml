source:
  edition: SBLGNT
  text: οἵτινες ἀνακρίναντές με ἐβούλοντο ἀπολῦσαι διὰ τὸ μηδεμίαν αἰτίαν θανάτου ὑπάρχειν ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/018.yaml
  text: who[a], after examining me, wanted to release me because there was no basis for the death penalty in my case.
translation:
  language: te
  text: వారు నన్ను విచారించిన తర్వాత, నా విషయంలో మరణశిక్ష విధించడానికి ఎలాంటి ఆధారమూ లేకపోవడంతో నన్ను విడుదల చేయాలనుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాపై మరణశిక్షకు తగిన నేరారోపణ ఏదీ లేకపోవడంతో.”
    reason: αἰτία θανάτου అనే న్యాయపరమైన పదబంధాన్ని ‘మరణశిక్ష విధించడానికి ఆధారం’ అని లేదా ‘మరణశిక్షకు తగిన నేరారోపణ’ అని అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: οἵτινες
  choice: వారు
  rationale: ముందటి వాక్యంలో ప్రస్తావించిన రోమా అధికారులను సూచించే సంబంధార్థాన్ని తెలుగులో సహజంగా కొనసాగించడానికి ‘వారు’ అని అనువదించాం; ఇక్కడ ὅστις యొక్క ప్రత్యేక గుణాత్మక ఛాయను విస్తరించడం అవసరం లేదు.
- source_word: ἀνακρίναντές με
  choice: నన్ను విచారించిన తర్వాత
  rationale: న్యాయపరమైన పరిశీలనను, అలాగే ప్రధాన క్రియకు ముందు జరిగిన చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐβούλοντο
  choice: చేయాలనుకున్నారు
  rationale: గతంలో అధికారులకు ఉన్న ఉద్దేశాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; అది తప్పనిసరిగా కార్యరూపం దాల్చిందని సూచించదు.
- source_word: ἀπολῦσαι
  choice: నన్ను విడుదల
  rationale: న్యాయ నిర్బంధం నుంచి విడిచిపెట్టడమనే సందర్భార్థాన్ని ‘విడుదల’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: διὰ τὸ ... ὑπάρχειν
  choice: లేకపోవడంతో
  rationale: διάతో కూడిన articular infinitive తెలిపే కారణ సంబంధాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: మరణశిక్ష విధించడానికి ఎలాంటి ఆధారమూ
  rationale: αἰτία యొక్క న్యాయపరమైన ‘ఆధారం/కారణం’ భావాన్ని, θανάτου సూచించే మరణదండన ఫలితాన్ని స్పష్టంగా అందిస్తుంది; ప్రత్యామ్నాయంగా ‘మరణానికి తగిన నేరం’ అనే భావమూ సాధ్యమే.
- source_word: ἐν ἐμοί
  choice: నా విషయంలో
  rationale: అక్షరార్థమైన ‘నాలో’ కంటే, పౌలు కేసుకు సంబంధించి ఎలాంటి మరణదండన ఆధారమూ లేదనే న్యాయపరమైన భావాన్ని సహజంగా తెలియజేస్తుంది.
