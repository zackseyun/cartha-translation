    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν οὖν
  choice: అప్పుడు అతడు
  rationale: ὁ ఇక్కడ పౌలును సూచించే సర్వనామంగా పనిచేస్తుంది; μέν οὖν కథనాన్ని కొనసాగించే స్వల్ప సంధాన భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు అతడు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: ἀποτινάξας
  choice: విదిలించిన తర్వాత
  rationale: భూతకాల అసమాపక క్రియ ప్రధాన క్రియకు ముందే జరిగిన చర్యను సూచిస్తుంది. ‘విదిలించిన తర్వాత’ ఆ క్రమాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τὸ θηρίον
  choice: ఆ జంతువును
  rationale: θηρίον సాధారణంగా ఒక జంతువును, తరచుగా అడవి జంతువును సూచిస్తుంది. సందర్భంలో అది పాము అయినప్పటికీ, ఈ వచనంలోని గ్రీకు పదం అంత నిర్దిష్టంగా లేదు; అందువల్ల ‘జంతువు’ మూలంలోని సాధారణతను నిలుపుతుంది.
- source_word: εἰς τὸ πῦρ
  choice: మంటలోకి
  rationale: εἰς + ద్వితీయా విభక్తి దిశను సూచిస్తుంది. ‘మంటలోకి’ ప్రత్యక్షమైన, సహజమైన తెలుగు రూపం.
- source_word: ἔπαθεν οὐδὲν κακόν
  choice: అతనికి ఏ హానీ కలగలేదు
  rationale: ఈ పదబంధం గాయం లేదా చెడు ప్రభావం ఏదీ కలగలేదని సూచిస్తుంది. తెలుగులో ‘ఏ హానీ కలగలేదు’ సహజంగా, సంక్షిప్తంగా అదే అర్థాన్ని ఇస్తుంది.
