id: ACT.28.8
reference: Acts 28:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγένετο δὲ τὸν πατέρα τοῦ Ποπλίου πυρετοῖς καὶ ⸀δυσεντερίῳ συνεχόμενον κατακεῖσθαι, πρὸς ὃν ὁ Παῦλος εἰσελθὼν καὶ προσευξάμενος ἐπιθεὶς τὰς χεῖρας αὐτῷ ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/008.yaml
  text: It happened that the father of Publius was lying sick with fevers and dysentery. Paul went in to him[a], and after praying and laying his hands on him, healed him.
translation:
  language: te
  text: అప్పుడు జరిగింది ఏమిటంటే, పుబ్లియుస్ తండ్రి జ్వరాలతోను డిసెంటరీతోను బాధపడుతూ మంచంపై పడి ఉన్నాడు. పౌలు అతని దగ్గరికి వెళ్లి, ప్రార్థించి, అతనిమీద చేతులు ఉంచి అతన్ని స్వస్థపరిచాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: ఉన్నాడు
  rationale: గ్రీకు కథన పరివర్తనను తెలుగులో కృత్రిమమైన ‘అప్పుడు ఇలా జరిగింది’ అనే ఉపోద్ఘాతం లేకుండా సహజ వాక్య నిర్మాణంలో వ్యక్తం చేశాం.
- source_word: πατέρα τοῦ Ποπλίου
  choice: పొప్లి తండ్రి
  rationale: గ్రీకు సంబంధార్థక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా అందిస్తుంది.
- source_word: πυρετοῖς
  choice: జ్వరాలతో
  rationale: మూలంలోని బహువచనాన్ని నిలుపుతూ, పునరావృతమయ్యే లేదా పలురకాల జ్వర బాధను అతిగా నిర్దిష్టం చేయకుండా సూచిస్తుంది.
- source_word: δυσεντερίῳ
  choice: విరేచన వ్యాధితో
  rationale: ‘డిసెంటరీ’ అనే వైద్యార్థాన్ని సాధారణ తెలుగు పాఠకులకు సులభంగా అర్థమయ్యే విధంగా అందిస్తుంది.
- source_word: συνεχόμενον
  choice: బాధపడుతూ
  rationale: వ్యాధులచేత పట్టబడి లేదా పీడింపబడుతున్న నిరంతర స్థితిని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κατακεῖσθαι
  choice: మంచాన పడి ఉన్నాడు
  rationale: అనారోగ్య సందర్భంలో పడుకొని ఉన్న స్థితిని స్పష్టంగా తెలియజేస్తుంది; పూర్తిగా కదలలేని స్థితిని అనవసరంగా జోడించదు.
- source_word: πρὸς ὃν ... εἰσελθὼν
  choice: అతని దగ్గరికి లోపలికి వెళ్లి
  rationale: పౌలు రోగి ఉన్న చోటికి ప్రవేశించిన దిశాత్మక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: προσευξάμενος
  choice: ప్రార్థించి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన ప్రార్థనను తెలుగు క్రమసూచక అసమాపక క్రియ సహజంగా తెలియజేస్తుంది.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: అతని మీద చేతులు ఉంచి
  rationale: మూలంలోని బహువచన ‘చేతులు’ను మరియు స్వస్థత సందర్భంలోని శారీరక చర్యను నేరుగా నిలుపుతుంది.
- source_word: ἰάσατο αὐτόν
  choice: అతన్ని స్వస్థపరిచాడు
  rationale: స్వస్థత కలిగించిన కథన వాదనను నేరుగా అందిస్తూ, వైద్యపరమైన లేదా మతశాస్త్రపరమైన అదనపు వివరణను చేర్చదు.
theological_decisions:
- issue: పౌలు చేసిన స్వస్థపరిచే కార్య స్వభావం
  choice: ప్రార్థన, చేతులు ఉంచడం, స్వస్థపరచడం అనే క్రమాన్ని సూటిగా చెప్పడం
  alternative: దీనిని సాంకేతికంగా ‘అద్భుత స్వస్థత’గా లేదా వైద్య చికిత్సగా స్పష్టీకరించడం
  rationale: వచనం స్వస్థతను స్పష్టంగా చెబుతుంది; అయితే అది తక్షణమైందని, సాక్రమెంటల్ కార్యమని, లేదా వైద్య చికిత్స అని ప్రత్యేకంగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. ‘పొప్లి’ రూపం గ్రీకు Πόπλιος పేరుకు తెలుగు విభక్తి ప్రయోగంలో సహజంగా సరిపోతుంది.
