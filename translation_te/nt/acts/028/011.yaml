id: ACT.28.11
reference: Acts 28:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μετὰ δὲ τρεῖς μῆνας ⸀ἀνήχθημεν ἐν πλοίῳ παρακεχειμακότι ἐν τῇ νήσῳ Ἀλεξανδρίνῳ, παρασήμῳ Διοσκούροις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/011.yaml
  text: After three months we set sail in an Alexandrian ship that had wintered on the island[a], with the Dioscuri as its figurehead.
translation:
  language: te
  text: మూడు నెలల తర్వాత, ఆ ద్వీపంలో చలికాలం గడిపిన, దియోస్కూరులు[a] చిహ్నంగా ఉన్న అలెగ్జాండ్రియకు చెందిన ఓడలో మేము సముద్రయానానికి బయలుదేరాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: దియోస్కూరులు అంటే గ్రీకు-రోమా పురాణాలలో కాస్టర్, పొలక్స్ అనే కవల సోదరులు.
    reason: లిప్యంతరీకరించిన గ్రీకు పురాణ నామాన్ని సంక్షిప్తంగా వివరిస్తుంది; విభిన్న పురాణ సంప్రదాయాలలో మారే వంశావళి వివరాన్ని నిర్దిష్టంగా చెప్పదు.
lexical_decisions:
- source_word: Μετὰ δὲ τρεῖς μῆνας
  choice: మూడు నెలల తర్వాత
  rationale: μετά + ద్వితీయా విభక్తి గడిచిన కాలానంతరాన్ని సూచిస్తుంది; δέ స్వల్ప అనుసంధానార్థకం కావడంతో సహజమైన తెలుగులో ప్రత్యేకంగా అనువదించలేదు.
- source_word: ἀνήχθημεν
  choice: మేము బయలుదేరాము
  rationale: సముద్రయాన సందర్భంలో ἀνάγω అంటే ఓడలో సముద్రయానానికి బయలుదేరడం; సందర్భం వల్ల తెలుగులో ఈ భావం స్పష్టంగా ఉంటుంది.
- source_word: ἐν πλοίῳ
  choice: ఓడలో
  rationale: πλοῖον ఇక్కడ పెద్ద సముద్రయాన ఓడను సూచిస్తుంది; తెలుగు వాడుకలో ప్రయాణాన్ని ‘ఓడలో’ అని చెప్పడం సహజం.
- source_word: παρακεχειμακότι ἐν τῇ νήσῳ
  choice: ఆ ద్వీపంలో చలికాలమంతా నిలిచివున్న
  rationale: పరిపూర్ణ కృదంతం ఆ ఓడ అక్కడ చలికాలం గడిపి ఇప్పటికీ ఉన్న స్థితిని సూచిస్తుంది; ‘చలికాలమంతా నిలిచివున్న’ అనేది ఓడకు సహజమైన తెలుగు.
- source_word: Ἀλεξανδρίνῳ
  choice: అలెగ్జాండ్రియ ఓడ
  rationale: విశేషణం ఓడ యొక్క అలెగ్జాండ్రియా సంబంధాన్ని లేదా మూలాన్ని సూచిస్తుంది; ‘అలెగ్జాండ్రియ ఓడ’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: παρασήμῳ
  choice: ఆ ఓడ గుర్తు
  rationale: పదం ఓడను ప్రత్యేకంగా గుర్తించే చిహ్నం, పేరు లేదా శిల్పచిహ్నాన్ని సూచించగలదు. మూలంలోని విస్తృతార్థాన్ని కాపాడటానికి ‘గుర్తు’ను ఎంచుకున్నాం; నిర్దిష్టంగా ‘ముందుభాగపు బొమ్మ’ అని పరిమితం చేయలేదు.
- source_word: Διοσκούροις
  choice: దియోస్కూరులు
  rationale: గ్రీకు పురాణ నామాన్ని లిప్యంతరీకరించడం ద్వారా మూలంలోని సాంస్కృతిక సూచనను నిలుపుతూ, వివరణను పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: అన్యదేవతా సంబంధమైన Διοσκούροις అనే ఓడ చిహ్నం
  choice: దియోస్కూరులు
  alternative: కవల దేవతలు / కాస్టర్, పొలక్స్
  rationale: వాక్యం ఆ అన్యమత చిహ్నాన్ని కేవలం నివేదిస్తోంది, ఆమోదించడం లేదు. సరైన నామాన్ని ఉంచడం మూలానికి దగ్గరగా ఉండి, ‘దేవతలు’ అనే వ్యాఖ్యాత్మక పదాన్ని ప్రధాన వచనంలో చేర్చకుండా ఉంటుంది; అవసరమైన వివరణ పాదసూచికలో ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన సరళమైన, గౌరవప్రదమైన శైలి. ‘ఓడ గుర్తు’ అనే పదబంధం παρασήμῳలోని చిహ్నం/నామం/శిల్పచిహ్నం అనే సాధ్యార్థాలను అనవసరంగా కుదించదు.
