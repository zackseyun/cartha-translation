revisions:
- from: మూడు నెలల తర్వాత, ఆ ద్వీపంలో చలికాలమంతా నిలిచివున్న అలెగ్జాండ్రియ ఓడలో మేము బయలుదేరాము. ఆ ఓడ గుర్తు దియోస్కూరులు[a].
  to: మూడు నెలల తర్వాత, ఆ ద్వీపంలో చలికాలం గడిపిన, దియోస్కూరులు[a] చిహ్నంగా ఉన్న అలెగ్జాండ్రియకు చెందిన ఓడలో మేము సముద్రయానానికి బయలుదేరాము.
  rationale: The revision retains every source element while recasting the ship emblem as a natural Telugu modifier. It also uses a clear expression for the Alexandrian origin/association and gives a neutral, accurate explanatory footnote.
