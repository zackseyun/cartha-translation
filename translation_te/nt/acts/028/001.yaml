  text: Καὶ διασωθέντες τότε ⸀ἐπέγνωμεν ὅτι ⸀Μελίτη ἡ νῆσος καλεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/001.yaml
  text: After we had been brought safely through[d][c][b][a], we then learned that the island was called Malta.
translation:
  language: te
  text: మేము క్షేమంగా బయటపడిన తర్వాత[a], ఆ ద్వీపాన్ని మాల్టా[b] అని పిలుస్తారని అప్పుడు తెలుసుకున్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘క్షేమంగా తప్పించుకున్న తర్వాత,’ లేదా ‘రక్షించబడిన తర్వాత.’ గ్రీకు క్రియ ప్రమాదం గుండా సురక్షితంగా బయటపడడాన్ని నొక్కి చెప్పవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'గ్రీకు: మెలితే (Melitē); సంప్రదాయంగా మాల్టా ద్వీపంగా గుర్తించబడింది.'
    reason: cultural_note
lexical_decisions:
- source_word: διασωθέντες
  choice: క్షేమంగా బయటపడిన తర్వాత
  rationale: ఈ భూతకాల కర్మణి అసమాపక క్రియ ప్రమాదం గుండా సురక్షితంగా తప్పించబడడం లేదా రక్షించబడడం అనే భావాన్ని ఇస్తుంది. తెలుగు సహజ వాడుకలో ‘క్షేమంగా బయటపడిన తర్వాత’ ఆ విజయవంతమైన విముక్తిని స్పష్టంగా తెలియజేస్తుంది; కర్మణి భావంలోని సూక్ష్మతను పాదసూచికలో ఉంచింది.
- source_word: τότε
  choice: అప్పుడు
  rationale: సంఘటనల క్రమాన్ని సూచించే సాధారణ కాలవాచకం; తెలుగులో ‘అప్పుడు’ సహజంగా కథన క్రమాన్ని నిలుపుతుంది.
- source_word: ἐπέγνωμεν
  choice: తెలుసుకున్నాం
  rationale: ఇక్కడ ఈ క్రియ గుర్తుపట్టడం కంటే కొత్త సమాచారాన్ని తెలుసుకోవడాన్ని సూచిస్తుంది.
- source_word: Μελίτη
  choice: మాల్టా
  rationale: గ్రీకు Μελίτη అనే ద్వీపనామానికి ఆధునిక తెలుగులో ప్రామాణికంగా, విస్తృతంగా గుర్తించబడే రూపం ‘మాల్టా’.
- source_word: ἡ νῆσος
  choice: ఆ ద్వీపాన్ని
  rationale: గ్రీకు నిర్దిష్ట నామవాచక పదబంధాన్ని తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా ‘ఆ ద్వీపాన్ని’ అని ఇచ్చింది.
- source_word: καλεῖται
  choice: అని పిలుస్తారని
  rationale: గ్రీకులోని వర్తమాన కర్మణి రూపం ‘అని పిలువబడుతుంది’ అనే భావాన్ని ఇస్తుంది. నివేదిత సమాచారంలో ‘అని పిలుస్తారని’ అనేది సహజమైన ఆధునిక తెలుగు రూపం; ద్వీపానికి అప్పట్లో మాత్రమే ఉన్న పేరు అన్న భావాన్ని కలిగించదు.
