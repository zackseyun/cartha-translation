translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించింది. ‘క్షేమంగా బయటపడిన’ అనే రూపం సాధారణ పాఠకులకు స్పష్టంగా ఉండగా, గ్రీకు కర్మణి రూపంలోని ప్రత్యామ్నాయ భావాలను పాదసూచికలో నిలిపింది. ‘అప్పుడు’ ద్వారా τότε సూచించే క్రమాన్ని స్పష్టంగా ఉంచింది.
