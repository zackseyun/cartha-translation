source:
  edition: robinson-pierpont-2005-byzantine
  text: Καὶ ταῦτα αὐτοῦ εἰπόντος, ἀπῆλθον οἱ Ἰουδαῖοι, πολλὴν ἔχοντες ἐν ἑαυτοῖς συζήτησιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/029.yaml
  text: And when he had [a]said these things, the Jews departed, having a great dispute among themselves.
translation:
  language: te
  text: అతడు ఈ మాటలు చెప్పిన తరువాత,[a] యూదులు తమలో తాము గొప్ప వాదవివాదం చేసుకుంటూ వెళ్లిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనం మొత్తం తొలి గ్రీకు ప్రతులలో లేదు; వాటిలో క్రీ.శ. 3వ శతాబ్దపు పాపిరస్ 74, క్రీ.శ. 4వ శతాబ్దపు సీనాయిటికస్ మరియు వాటికానస్ ప్రతులు ఉన్నాయి. ప్రాచీన కాప్టిక్ అనువాదాల్లో కూడా ఇది లేదు. అయితే, ఇది బైజాంటైన్ మెజారిటీ పాఠసంప్రదాయంలో, అలాగే ప్రాచీన లాటిన్ మరియు సిరియాక్ అనువాదాల్లో ఉంది. యూదు నాయకులు వెళ్లిపోయిన సంగతితో ఈ కథన ఘట్టాన్ని ముగించడానికి, తరువాతి కాలంలో ఒక లేఖకుడు దీన్ని విస్తరణగా చేర్చి ఉండవచ్చని భావించబడుతుంది.
    reason: textual_critical
lexical_decisions:
- source_word: συζήτησις
  choice: తీవ్రంగా వాదించుకోవడం
  rationale: ఈ పదానికి చర్చ, వాదం, వివాదం అనే అర్థాలు ఉన్నాయి. పౌలు చెప్పిన సందేశం విషయంలో వారిలో ఏర్పడిన విభేద తీవ్రతను సందర్భానుసారంగా సహజమైన తెలుగులో తెలియజేయడానికి ఈ ప్రయోగం ఎంచుకోబడింది.
- source_word: ἀπέρχομαι
  choice: వెళ్లిపోయారు
  rationale: ఇది ఒక చోటు విడిచి వెళ్లడాన్ని సూచించే సాధారణ క్రియ. ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండేందుకు ‘వెళ్లిపోయారు’ అని అనువదించబడింది.
- source_word: πολλὴν ἔχοντες ἐν ἑαυτοῖς συζήτησιν
  choice: తమలో తాము తీవ్రంగా వాదించుకుంటూ
  rationale: గ్రీకు వాక్యంలోని ‘తమ మధ్య గొప్ప వాదం కలిగి’ అనే భావాన్ని పదబద్ధమైన అసహజ నిర్మాణంతో కాకుండా, చర్య కొనసాగుతుండగానే వారు వెళ్లిపోయారనే భావం నిలిచే సహజ తెలుగు క్రియారూపంలో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘departed’కు అతి సాహిత్యికమైన ‘నిష్క్రమించారు’ బదులు సామాన్య పాఠకులకు స్పష్టమైన ‘వెళ్లిపోయారు’ ఎంచుకోబడింది. పాఠభేద సూచిక [a] సంబంధిత వాక్యభాగం తరువాత ఉంచబడింది.
