source:
  edition: SBLGNT
  text: ἀντιλεγόντων δὲ τῶν Ἰουδαίων ἠναγκάσθην ἐπικαλέσασθαι Καίσαρα, οὐχ ὡς τοῦ ἔθνους μου ἔχων τι ⸀κατηγορεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/019.yaml
  text: But because the Jews objected[b][a], I was compelled to appeal to Caesar—not because I had anything to accuse my nation of.
translation:
  language: te
  text: కాని యూదులు అభ్యంతరం చెప్పడంతో[a][b], నేను కైసరుకు అప్పీలు చేయవలసి వచ్చింది—నా జాతిపై ఆరోపణ చేయడానికి నా వద్ద ఏదైనా ఉందని కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదులు నన్ను వ్యతిరేకిస్తుండగా’; లేదా, ‘యూదులు నాతో వాదించడంతో.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘యూదులు’ అనేది ఈ న్యాయసందర్భంలో పౌలును ఎదిరించిన యూదులను సూచిస్తుంది; యూదులందరి గురించి చేసిన సాధారణ వ్యాఖ్య కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: ἀντιλεγόντων
  choice: అభ్యంతరం చెప్పడంతో
  rationale: వర్తమాన కృదంతంతో కూడిన genitive absolute పౌలు చర్యకు దారితీసిన పరిస్థితిని తెలియజేస్తుంది. న్యాయపరమైన సందర్భంలో ‘అభ్యంతరం చెప్పడం’ సహజంగా ఉండి, కేవలం మాటల్లో విభేదించడం కంటే క్రియాశీల వ్యతిరేకతను సూచిస్తుంది.
- source_word: δὲ
  choice: కాని
  rationale: ముందటి వాక్యంతో స్వల్ప వ్యతిరేకతను లేదా కథనంలోని తదుపరి మలుపును సూచిస్తుంది.
- source_word: Ἰουδαίων
  choice: యూదులు
  rationale: గ్రీకు మూలంలో ఉన్న సాధారణ పదాన్ని అదనపు నిర్దిష్టత చేర్చకుండా నిలుపుతుంది. సందర్భం దీనిని పౌలును న్యాయపరంగా ఎదిరించిన యూదులకు పరిమితం చేస్తుంది.
- source_word: ἠναγκάσθην
  choice: చేసుకోవలసి వచ్చింది
  rationale: బాహ్య ఒత్తిడి లేదా తప్పనిసరి పరిస్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఇది కర్తరి అర్థాన్ని చేర్చకుండా గ్రీకు కర్మణి భావాన్ని నిలుపుతుంది.
- source_word: ἐπικαλέσασθαι Καίσαρα
  choice: కైసరుకు విజ్ఞప్తి చేసుకోవడం
  rationale: చక్రవర్తి తీర్పును కోరే న్యాయపరమైన అప్పీలును సూచిస్తుంది. ‘కైసరు’ అనే మూలపాఠంలోని బిరుదును నిలుపుతూ, తెలుగులో అర్థమయ్యే న్యాయప్రయోగాన్ని ఉపయోగిస్తుంది.
- source_word: οὐχ ὡς
  choice: అయితే ... అనే ఉద్దేశంతో కాదు
  rationale: పౌలు తన చర్య వెనుక ఉన్న ఉద్దేశాన్ని నిరాకరిస్తున్నాడనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘అలా అన్నట్టు కాదు’ అనే మరింత అక్షరార్థ ప్రత్యామ్నాయం కూడా సాధ్యమే.
- source_word: τοῦ ἔθνους μου
  choice: నా జాతిమీద
  rationale: ἔθνος ఇక్కడ పౌలు చెందిన జాతీయ-జాతివర్గ సమూహాన్ని సూచిస్తుంది. ‘నా ప్రజలు’ సాధ్యమైనప్పటికీ, ‘నా జాతి’ మూలంలోని సామూహిక భావాన్ని మరింత ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: ἔχων τι κατηγορεῖν
  choice: ఏదైనా నేరారోపణ చేయాలనే
  rationale: κατηγορεῖν యొక్క న్యాయపరమైన భావాన్ని ‘నేరారోపణ చేయడం’ స్పష్టంగా అందిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ఉద్దేశ నిరాకరణతో సహజంగా అనుసంధానించబడింది.
theological_decisions:
- issue: సున్నితమైన జాతి/మత సూచనలో ‘యూదులు’ అనే పదం ఎవరిని సూచిస్తుంది
  choice: ప్రధాన పాఠంలో τῶν Ἰουδαίωνను నేరుగా ‘యూదులు’ అని అనువదించడం
  alternative: ‘యూదు నాయకులు’ లేదా ‘యూదయవారు’
  rationale: మూలపాఠం నాయకులు అని ప్రత్యేకంగా చెప్పదు; కాబట్టి ప్రధాన పాఠంలో ఆ పరిమితిని చేర్చలేదు. అయితే ఈ న్యాయసందర్భంలో పౌలును ఎదిరించిన యూదు పక్షాన్నే ఇది సూచిస్తుంది, యూదులందరినీ కాదు; ఆ సందర్భ పరిమితిని పాదసూచికలో స్పష్టం చేశాం.
- issue: οὐχ ὡς ద్వారా పౌలు నిరాకరిస్తున్న అంశం
  choice: తన జాతిపై నేరారోపణ చేయాలనే ఉద్దేశం తనకు లేదని తెలియజేయడం
  alternative: తన జాతిపై ఆరోపించదగిన విషయం ఏదీ తన వద్ద లేదని మరింత అక్షరార్థంగా చెప్పడం
  rationale: ἔχων τι κατηγορεῖν అక్షరార్థంగా ‘ఆరోపించడానికి ఏదైనా కలిగి ఉండడం’ అయినప్పటికీ, οὐχ ὡς ఇక్కడ అప్పీలు చేసిన ఉద్దేశాన్ని వివరిస్తుంది. తెలుగు అనువాదం ఉద్దేశ నిరాకరణను సహజంగా చూపిస్తూ, ఆరోపణకు సంబంధించిన న్యాయపరమైన భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే న్యాయ-కథన శైలి. ‘కైసరు,’ ‘విజ్ఞప్తి,’ ‘నేరారోపణ’ పదాలు సందర్భంలోని అధికారికతను నిలుపుతాయి; వాక్యనిర్మాణం మాత్రం సాధారణ పాఠకునికి సహజంగా ఉంచబడింది.
