revisions:
- from: కాని యూదులు అభ్యంతరం చెప్పడంతో[a][b], నేను కైసరుకు విజ్ఞప్తి చేసుకోవలసి వచ్చింది—అయితే నా జాతిమీద ఏదైనా నేరారోపణ చేయాలనే ఉద్దేశంతో కాదు.
  to: కాని యూదులు అభ్యంతరం చెప్పడంతో[a][b], నేను కైసరుకు అప్పీలు చేయవలసి వచ్చింది—నా జాతిపై ఆరోపణ చేయడానికి నా వద్ద ఏదైనా ఉందని కాదు.
