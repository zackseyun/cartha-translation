id: ACT.28.21
reference: Acts 28:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ πρὸς αὐτὸν εἶπαν· Ἡμεῖς οὔτε γράμματα περὶ σοῦ ἐδεξάμεθα ἀπὸ τῆς Ἰουδαίας, οὔτε παραγενόμενός τις τῶν ἀδελφῶν ἀπήγγειλεν ἢ ἐλάλησέν τι περὶ σοῦ πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/021.yaml
  text: But they said to him[a], “We have received no letters from Judea about you[b], nor has any of the brothers who came reported or spoken anything evil about you.”
translation:
  language: te
  text: 'అయితే వారు అతనితో ఇలా అన్నారు: “యూదయ నుండి నీ గురించి మాకు ఏ ఉత్తరాలూ అందలేదు; వచ్చిన సహోదరులలో ఎవరూ నీ గురించి చెడ్డదేదీ నివేదించలేదు, చెప్పనూ లేదు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నీ గురించి చెడ్డదేదీ తెలియజేయలేదు లేదా చెప్పలేదు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ πρὸς αὐτὸν εἶπαν
  choice: అయితే వారు అతనితో ఇలా అన్నారు
  rationale: δέ సంభాషణలో స్వల్ప ప్రతిస్పందనాత్మక భావాన్ని సూచిస్తుంది; ‘అయితే’ దానిని అతిగా విరోధార్థకం చేయకుండా సహజంగా వ్యక్తం చేస్తుంది. πρὸς αὐτόν ను మాటల సందర్భంలో ‘అతనితో’గా అందించాం.
- source_word: οὔτε γράμματα περὶ σοῦ ἐδεξάμεθα ἀπὸ τῆς Ἰουδαίας
  choice: యూదయ నుండి నీ గురించి మాకు ఏ ఉత్తరాలూ అందలేదు
  rationale: γράμματα ఇక్కడ లేఖలు లేదా ఉత్తరాలను సూచిస్తుంది. οὔτε అనే మొదటి నిరాకరణను తెలుగులో ‘ఏ ... అందలేదు’గా సహజంగా వ్యక్తం చేశాం.
- source_word: παραγενόμενός τις τῶν ἀδελφῶν
  choice: వచ్చిన సహోదరుల్లో ఎవరూ
  rationale: παραγενόμενος వచ్చిన లేదా చేరుకున్న వ్యక్తిని సూచిస్తుంది. మూలంలో లేని ‘ఇక్కడికి’ అనే పదాన్ని చేర్చలేదు. ἀδελφῶν ను గుర్తింపును ముందే నిర్ణయించకుండా ‘సహోదరులు’గా ఉంచాం.
- source_word: ἀπήγγειλεν ἢ ἐλάλησέν τι περὶ σοῦ πονηρόν
  choice: నీ గురించి చెడ్డ విషయం ఏదీ నివేదించలేదు, చెప్పనూ లేదు
  rationale: ἀπήγγειλεν మరియు ἐλάλησεν మధ్యనున్న స్వల్ప భేదాన్ని ‘నివేదించలేదు’ మరియు ‘చెప్పనూ లేదు’తో నిలిపాం. πονηρόν ను సందర్భానుసారంగా ‘చెడ్డ విషయం’గా అనువదించాం.
theological_decisions:
- issue: τῶν ἀδελφῶν అనే పదబంధం ఎవరిని సూచిస్తుంది?
  choice: ‘సహోదరులు’ అని మాత్రమే అనువదించి, వారు క్రైస్తవ విశ్వాసులని నిర్దిష్టంగా చెప్పలేదు.
  alternative: ‘తోటి యూదులు’ లేదా ‘క్రైస్తవ సహోదరులు’
  rationale: రోమాలోని యూద నాయకులు యూదయ నుండి వచ్చిన సమాచారం గురించి మాట్లాడుతున్నారు. ఇది తోటి యూదులను సూచించే అవకాశం ఉన్నప్పటికీ, గ్రీకు పాఠం వారిని క్రైస్తవులుగా గానీ మరే నిర్దిష్ట వర్గంగా గానీ స్పష్టంగా గుర్తించదు. అందువల్ల మూలంలోని అనిశ్చితిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడాం. ‘నివేదించలేదు, చెప్పనూ లేదు’ అనే జంట ప్రయోగంతో మూలంలోని రెండు మాటక్రియలను నిలిపి, తెలుగులో సహజమైన సమన్వయాన్ని సాధించాం.
