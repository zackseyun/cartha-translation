  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. మూలంలోని గౌరవ పద పునరుక్తి తెలుగులో భారంగా అనిపించకుండా ప్రధాన పాఠ్యంలో భావానువాదం చేసి, అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
