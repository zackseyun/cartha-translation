source:
  edition: SBLGNT
  text: οἳ καὶ πολλαῖς τιμαῖς ἐτίμησαν ἡμᾶς καὶ ἀναγομένοις ἐπέθεντο τὰ πρὸς ⸂τὰς χρείας⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/010.yaml
  text: They also honored us greatly[a], and when we were setting sail[c][b], they put on board what we needed.
translation:
  language: te
  text: వారు మమ్మల్ని ఎంతో గౌరవించారు[a]. మేము ఓడను నడిపిస్తూ బయలుదేరుతున్నప్పుడు[b], మాకు అవసరమైన వస్తువులను ఓడపై ఎక్కించారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో అక్షరార్థంగా, “అనేక గౌరవాలతో మమ్మల్ని గౌరవించారు” అని గౌరవాన్ని సూచించే పదం పునరుక్తమవుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మేము సముద్రంలోకి బయలుదేరుతున్నప్పుడు.” ఇక్కడి గ్రీకు పదం ఓడ ప్రయాణాన్ని ప్రారంభించడాన్ని సూచించే నావిక పదం.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “మాకు అవసరమైన వస్తువులను సమకూర్చారు.” మూల గ్రీకులో మరింత అక్షరార్థంగా, “అవసరాలకు తగిన వస్తువులను [ఓడపై] ఉంచారు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλαῖς τιμαῖς
  choice: ఎంతో ఘనంగా
  rationale: ఈ దత్తివ విభక్తి పదబంధం అనేక గౌరవ సూచక క్రియలను లేదా గొప్ప గౌరవాన్ని తెలియజేస్తుంది. తెలుగులో సహజంగా ఉండేందుకు క్రియావిశేషణ రూపంలో అనువదించాం; మూలంలోని పునరుక్తిని పాదటిప్పణిలో నిలిపాం.
- source_word: ἐτίμησαν
  choice: సత్కరించారు
  rationale: τιμάω అంటే గౌరవించడం, విలువనివ్వడం. ఈ సందర్భంలో ఆతిథ్యంతో వ్యక్తమైన గౌరవాన్ని ‘సత్కరించారు’ సహజంగా తెలియజేస్తుంది.
- source_word: ἀναγομένοις
  choice: మేము ఓడలో బయలుదేరుతున్నప్పుడు
  rationale: ἀνάγω అనే పదం ఇక్కడ నావిక సందర్భంలో ఓడ ప్రయాణాన్ని ప్రారంభించడం, సముద్రంలోకి బయలుదేరడం అనే అర్థమిస్తుంది.
- source_word: ἐπέθεντο
  choice: ఓడలో ఉంచారు
  rationale: ἐπιτίθημι మధ్యమ రూపం ప్రయాణికుల కోసం వస్తువులను ఓడపై పెట్టడాన్ని సూచిస్తుంది. సందర్భంలో అంతర్లీనంగా ఉన్న ఓడను తెలుగులో స్పష్టంచేశాం.
- source_word: τὰ πρὸς τὰς χρείας
  choice: మాకు అవసరమైనవాటిని
  rationale: ఈ పదబంధం అవసరాలకు సంబంధించిన వస్తువులను, అంటే కావలసిన సరఫరాలను సూచిస్తుంది. అనవసరమైన పునరుక్తి లేకుండా సహజ తెలుగులో అర్థాన్ని అందిస్తుంది.
