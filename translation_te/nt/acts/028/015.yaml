source:
  edition: SBLGNT
  text: κἀκεῖθεν οἱ ἀδελφοὶ ἀκούσαντες τὰ περὶ ἡμῶν ⸀ἦλθαν εἰς ἀπάντησιν ἡμῖν ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν, οὓς ἰδὼν ὁ Παῦλος εὐχαριστήσας τῷ θεῷ ἔλαβε θάρσος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/015.yaml
  text: And from there the brothers[a], when they heard about us, came to meet us as far as Appius Forum and Three Taverns. When Paul saw them, he gave thanks to God and took courage.
translation:
  language: te
  text: అక్కడి నుండి సోదరులు[a] మా సంగతులు విని, మమ్మల్ని కలుసుకోవడానికి అప్పీయు సంత వరకు, మూడు సత్రాల వరకు వచ్చారు. పౌలు వారిని చూసి దేవునికి కృతజ్ఞతలు చెప్పి ధైర్యం పొందాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సోదర సోదరీలు.” గ్రీకులో “సోదరులు” అని ఉంది; సందర్భాన్ని బట్టి తోటి విశ్వాసులను సూచించే ఈ సాధారణ పదంలో స్త్రీలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: అక్కడి
  rationale: καί + ἐκεῖθεν ప్రయాణ కథనంలోని స్థల మార్పును సూచిస్తుంది. తెలుగులో ‘అక్కడి సోదరులు’ అనే నిర్మాణం ఆ స్థలంతో వారికున్న సంబంధాన్ని సహజంగా తెలియజేస్తుంది; καί యొక్క కథన అనుసంధానం సందర్భంలో అంతర్లీనంగా ఉంటుంది.
- source_word: οἱ ἀδελφοὶ
  choice: సోదరులు
  rationale: ఇక్కడ ఈ పదం రోములోని తోటి క్రైస్తవులను సూచిస్తుంది. గ్రీకు masculine plural రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భానుసారంగా స్త్రీలు కూడా ఇందులో ఉండవచ్చనే విషయాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: ἀκούσαντες τὰ περὶ ἡμῶν
  choice: మా గురించి విని
  rationale: కాలసూచక participle‌ను సహజమైన తెలుగు క్రియారూపంగా ఇచ్చాం. τὰ περὶ ἡμῶν‌ను అదనంగా ‘వార్త’ అని చేర్చకుండా, దాని సరళమైన భావమైన ‘మా గురించి’గా అనువదించాం.
- source_word: ἦλθαν εἰς ἀπάντησιν ἡμῖν
  choice: మమ్మల్ని కలుసుకోవడానికి ... వచ్చారు
  rationale: వచ్చేవారిని ఎదుర్కొని స్వాగతించడానికి వెళ్లడాన్ని సూచించే గ్రీకు నుడికారాన్ని తెలుగులో సహజంగా తెలిపే రూపం.
- source_word: ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν
  choice: అప్పీయు సంత వరకు, మూడు సత్రాల వరకు
  rationale: ἄχρι ప్రయాణ విస్తృతిని సూచిస్తుంది. రెండు వేర్వేరు ప్రదేశాల నుంచి విశ్వాసులు వచ్చిన భావం తెలుగులో స్పష్టంగా ఉండేందుకు ‘వరకు’ పునరుక్తి చేశాం. Forum అనే ప్రదేశనామంలోని మార్కెట్ భావానికి ‘సంత’, Tabernaeకు ‘సత్రాలు’ వాడాం.
- source_word: οὓς ἰδὼν ὁ Παῦλος
  choice: పౌలు వారిని చూసి
  rationale: సంబంధవాచక నిర్మాణాన్ని తెలుగులో సహజమైన క్రమసూచక participial రూపంగా మార్చాం; ‘వారిని’ ముందున్న సోదరులను సూచిస్తుంది.
- source_word: εὐχαριστήσας τῷ θεῷ
  choice: దేవునికి కృతజ్ఞతలు చెప్పి
  rationale: దేవుడు కృతజ్ఞతకు గ్రహీత అని dative స్పష్టంగా చూపుతుంది. ఈ చర్య ప్రధాన క్రియకు ముందున్నదని ‘చెప్పి’ తెలియజేస్తుంది.
- source_word: ἔλαβε θάρσος
  choice: ధైర్యం తెచ్చుకున్నాడు
  rationale: అక్షరార్థంగా ‘ధైర్యాన్ని పొందాడు’ అనే నుడికారాన్ని సహజ తెలుగులో, పౌలు మనసులో ధైర్యం పుంజుకున్న భావంతో ఇచ్చాం; దీనిని ‘ధైర్యంగా మాట్లాడాడు’ అని అతిగా నిర్దిష్టం చేయలేదు.
theological_decisions:
- issue: మిశ్రమ క్రైస్తవ సమూహాన్ని సూచించవచ్చే ἀδελφοί పదం
  choice: సోదరులు
  alternative: సోదర సోదరీలు; విశ్వాసులు
  rationale: మూలంలోని పురుష బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం. అయితే ఇది తోటి విశ్వాసుల సమూహానికి సాధారణ సంబోధనగా ఉండి స్త్రీలను కూడా కలుపుకోవచ్చనే పరిధిని పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ప్రదేశనామాలకు తెలుగులో అర్థవంతమైన సంప్రదాయ రూపాలు—‘అప్పీయు సంత,’ ‘మూడు సత్రాలు’—వాడబడ్డాయి. మూలంలోని చర్యల క్రమం, ἀδελφοί పదంలోని సమావేషక సంభావ్యత, ἔλαβε θάρσος నుడికారంలోని అంతరంగ ధైర్య భావం నిలుపబడ్డాయి.
