  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γνωστὸν οὖν ⸂ἔστω ὑμῖν⸃ ὅτι τοῖς ἔθνεσιν ἀπεστάλη ⸀τοῦτο τὸ σωτήριον τοῦ θεοῦ· αὐτοὶ καὶ ⸀ἀκούσονται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/028.yaml
  text: Therefore let it be known to you that this salvation of God has been sent to the Gentiles[b][a]; they also will listen.
translation:
  language: te
  text: కాబట్టి, దేవుని ఈ రక్షణ[a] అన్యజనులకు పంపబడిందని మీకు తెలియాలి; వారు కూడా వింటారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని నుండి వచ్చిన ఈ రక్షణ.’ గ్రీకులోని సంబంధ విభక్తిని దగ్గరగా ముడిపడిన ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారు కూడా శ్రద్ధగా వింటారు.’ గ్రీకు క్రియ సందర్భాన్ని బట్టి కేవలం వినడాన్నో, శ్రద్ధగా విని స్పందించడాన్నో సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: కాబట్టి ... మీకు తెలిసి ఉండాలి
  rationale: οὖν తెలిపే తార్కిక ముగింపును ‘కాబట్టి’ వ్యక్తం చేస్తుంది. γνωστὸν ἔστω ὑμῖν అనే అధికారిక ప్రకటనను సహజమైన ఆధునిక తెలుగులో ‘మీకు తెలిసి ఉండాలి’గా అందించాం.
- source_word: τοῖς ἔθνεσιν
  choice: అన్యజనులకు
  rationale: అపొస్తలుల కార్యములలోని యూదులు–యూదేతరులు అనే సందర్భంలో ἔθνη దేశాలను సాధారణంగా కాక యూదేతర ప్రజలను సూచిస్తుంది; అందువల్ల ‘అన్యజనులు’ సందర్భానుకూలంగా స్పష్టంగా ఉంది.
- source_word: ἀπεστάλη
  choice: పంపబడింది
  rationale: అయోరిస్ట్ పాసివ్ రూపం పూర్తయిన పంపడాన్ని తెలుపుతుంది. తెలుగు భూతకాల కర్మణి రూపం మూలంలోని భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: τοῦτο τὸ σωτήριον τοῦ θεοῦ
  choice: దేవుని ఈ రక్షణ
  rationale: σωτήριονను వివరణాత్మకంగా ‘రక్షణ సందేశం’గా మార్చకుండా ‘రక్షణ’గానే ఉంచాం. ‘దేవుని’ అనే సంబంధ విభక్తి దీన్ని దేవునికి చెందిన రక్షణగా లేదా దేవుని నుండి వచ్చే రక్షణగా గ్రహించగల మూలంలోని సన్నిహిత భావవైవిధ్యాన్ని నిలుపుతుంది.
- source_word: αὐτοὶ καὶ ἀκούσονται
  choice: వారు కూడా వింటారు
  rationale: αὐτοὶ καί లోని ఉద్ఘాటనను ‘వారు కూడా’ తెలియజేస్తుంది. ἀκούω వినడాన్నీ, శ్రద్ధగా విని స్వీకరించడాన్నీ సూచించగలదు; ‘వింటారు’ ఈ సందర్భంలో సహజంగా ఉండి ఆ భావవిస్తృతిని కాపాడుతుంది.
theological_decisions:
- issue: ఈ సందర్భంలో σωτήριον అర్థం
  choice: రక్షణ
  alternative: రక్షణ సందేశం
  rationale: గ్రీకు పదం స్వయంగా రక్షణను సూచిస్తుంది. సందర్భంలో ప్రకటన ఉన్నప్పటికీ, ‘సందేశం’ అని చేర్చడం మూలపాఠం తప్పనిసరిగా చెప్పని వివరణను దిగుమతి చేస్తుంది.
- issue: ἀκούσονται యొక్క భావబలం
  choice: వింటారు
  alternative: శ్రద్ధగా వింటారు / ఆలకిస్తారు
  rationale: సందర్భం అన్యజనులు స్వీకారంతో వింటారని సూచించినా, క్రియకు సాధారణంగా ‘వింటారు’ అనే అర్థమూ ఉంది. ప్రధాన పాఠంలో విస్తృతిని నిలిపి, స్వీకారపూర్వకంగా వినే అవకాశాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే పౌలు చేసే బహిరంగ ప్రకటనకు తగిన గంభీరతతో అనువదించాం. ‘అన్యజనులు’ బైబిలు సందర్భంలో స్థిరపడిన, స్పష్టమైన పదం; మిగతా వాక్య నిర్మాణాన్ని అతిగా గ్రాంథికం కాకుండా ఉంచాం.
