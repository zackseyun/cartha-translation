  source_fidelity: 'ముసాయిదా మూలగ్రీకు భావాన్ని ప్రధానంగా సరిగ్గా తెలియజేస్తుంది: అక్కడి విశ్వాసులను కనుగొనడం, వారితో ఏడు రోజులు ఉండమని ఆహ్వానించబడడం, తరువాత రోముకు రావడం అన్న క్రమం నిలిచింది. అయితే “ఉండమని వారు మమ్మల్ని కోరారు” కంటే “మేము ... ఉండాలని వారు మమ్మల్ని కోరారు” అనే నిర్మాణం ఆధునిక తెలుగులో మరింత సహజంగా, అభ్యర్థన యొక్క విషయాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది. καὶ οὕτως కు “ఇలా” సహజమైన కథన-సంధానంగా ఉంటుంది.'
