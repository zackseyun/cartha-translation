source:
  edition: SBLGNT
  text: οὗ εὑρόντες ἀδελφοὺς παρεκλήθημεν ⸀παρ’ αὐτοῖς ἐπιμεῖναι ἡμέρας ἑπτά· καὶ οὕτως εἰς τὴν Ῥώμην ἤλθαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/014.yaml
  text: There we found brothers, and we were invited to stay with them seven days. And so we came to Rome.
translation:
  language: te
  text: అక్కడ మేము సహోదరులను[a] కనుగొన్నాం; మేము వారితో ఏడు రోజులు ఉండాలని వారు మమ్మల్ని కోరారు. ఇలా మేము రోముకు వచ్చాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తోటి విశ్వాసులను’; గ్రీకులో అక్షరార్థంగా ‘సహోదరులను’ అని ఉంది, అయితే ఈ సందర్భంలో అది స్త్రీపురుషులైన తోటి విశ్వాసులందరినీ సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: అక్కడ
  rationale: ఇది ముందుగా ప్రస్తావించిన పొతియొలీ అనే స్థలాన్ని సూచించే స్థానవాచక సంబంధ క్రియావిశేషణం. ఆధునిక తెలుగులో వాక్యారంభంలో ‘అక్కడ’ సహజంగా ఉంటుంది.
- source_word: εὑρόντες
  choice: మేము ... కనుగొన్నాం
  rationale: కర్తృవాచక భూతకాల అసమాపక క్రియను తెలుగులో సహజమైన సమాపక క్రియగా ఇచ్చి, ముందుగా సహోదరులను కనుగొన్నారనే కార్యక్రమాన్ని నిలిపింది.
- source_word: ἀδελφοὺς
  choice: సహోదరులను
  rationale: గ్రీకు పదంలోని పుంలింగ రూపాన్ని నిలుపుతూ, అపొస్తలుల కార్యముల సందర్భంలో ఇది సాధారణంగా తోటి క్రైస్తవ విశ్వాసులను సూచిస్తుంది.
- source_word: παρεκλήθημεν
  choice: వారు మమ్మల్ని కోరారు
  rationale: ఇక్కడ παρακαλέω ఆతిథ్య సందర్భంలో చేసిన విన్నపాన్ని సూచిస్తుంది. గ్రీకు కర్మణి రూపాన్ని తెలుగులో సహజమైన కర్తరి నిర్మాణంగా మార్చినా, అభ్యర్థన భావం నిలిచింది.
- source_word: παρ’ αὐτοῖς ἐπιμεῖναι
  choice: వారితో ... ఉండమని
  rationale: παρά తో కూడిన దత్తివిభక్తి వారి సహవాసంలో లేదా వారి వద్ద బస చేయడాన్ని సూచిస్తుంది; ప్రయాణ సందర్భంలో ‘వారితో ఉండడం’ సహజమైన తెలుగు.
- source_word: ἡμέρας ἑπτά
  choice: ఏడు రోజులు
  rationale: ఇది కాలవ్యాప్తిని తెలిపే ద్వితీయావిభక్తి ప్రయోగం; ‘ఉండమని’తో కలిపినప్పుడు వ్యవధి స్పష్టంగా ఉంటుంది.
- source_word: καὶ οὕτως
  choice: ఆ విధంగా
  rationale: ప్రయాణ కథనంలోని విధానం లేదా తదుపరి పరిణామాన్ని తెలియజేస్తుంది; గ్రీకు పదబంధంలోని కొంత విస్తృత భావాన్ని సంకుచితం చేయకుండా ఉంచుతుంది.
- source_word: εἰς τὴν Ῥώμην ἤλθαμεν
  choice: మేము రోముకు వచ్చాం
  rationale: εἰς‌తో కూడిన ἔρχομαι గమ్యస్థానానికి రావడాన్ని సూచిస్తుంది; లూకా ఉపయోగించిన ప్రథమ పురుష ప్రయాణ కథనాన్ని ఇది నిలుపుతుంది.
theological_decisions:
- issue: ἀδελφοὺς అనే పదం ఎవరిని సూచిస్తుంది?
  choice: స్థానిక క్రైస్తవ సమాజంలోని తోటి విశ్వాసులు
  alternative: శారీరక సహోదరులు లేదా సాధారణంగా యూద జాతివారు
  rationale: అపొస్తలుల కార్యముల ప్రయాణ కథనాల్లో ‘సహోదరులు’ సాధారణంగా తోటి క్రైస్తవులను సూచిస్తుంది. ఇక్కడ వారి ఆతిథ్య విన్నపం కూడా ఆ భావానికి మద్దతిస్తుంది. అయితే ప్రధాన పాఠ్యంలో మూలంలోని బంధుత్వ పదాన్ని నిలిపి, విస్తృత సందర్భార్థాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ప్రయాణ కథన శైలిని ఉపయోగించాం. ‘కోరారు’ అనే పదం ఆహ్వానం మరియు విన్నపం మధ్యనున్న మూలపద భావాన్ని అతిగా నిర్దిష్టం చేయకుండా అందిస్తుంది.
