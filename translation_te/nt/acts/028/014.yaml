  terminology: ἀδελφοὺς కు ప్రధాన పాఠ్యంలో ‘సహోదరులను’ ఉంచడం మూలంలోని పుంలింగ బంధుత్వ పదాన్ని కాపాడుతుంది. పాదసూచికలో సందర్భానుసారంగా స్త్రీపురుష విశ్వాసులను సూచించే అవకాశం ఉందని చెప్పడం తగినది; దాన్ని ప్రధాన పాఠ్యంలోకి చేర్చి అతిగా వ్యాఖ్యానించలేదు. ‘రోముకు’ మరియు ‘ఏడు రోజులు’ సరైనవి.
