translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. మూలంలోని οὐ τὴν τυχοῦσαν అనే నిరాకరణాత్మక నుడికారాన్ని ప్రధాన పాఠ్యంలో సహజమైన సానుకూల రూపంలో ఇచ్చి, మరింత రూపసామ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం. ప్రధాన పాఠ్యంలో ప్రతి పాదసూచిక సూచిక [a], [b] చేర్చబడింది.
