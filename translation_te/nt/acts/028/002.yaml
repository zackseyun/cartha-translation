id: ACT.28.2
reference: Acts 28:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἵ ⸀τε βάρβαροι παρεῖχον οὐ τὴν τυχοῦσαν φιλανθρωπίαν ἡμῖν, ⸀ἅψαντες γὰρ πυρὰν προσελάβοντο πάντας ἡμᾶς διὰ τὸν ὑετὸν τὸν ἐφεστῶτα καὶ διὰ τὸ ψῦχος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/002.yaml
  text: And the local people showed us extraordinary kindness[b][a], for they lit a fire and welcomed all of us because of the rain that had set in and because of the cold.
translation:
  language: te
  text: అక్కడి ప్రజలు మాపట్ల అసాధారణమైన దయ[a][b] చూపించారు. వర్షం కురుస్తూ ఉండడం వల్ల, చలి వల్ల వారు మంట వేసి మా అందరినీ ఆదరంగా స్వీకరించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదం βάρβαροι అక్షరార్థంగా ‘బార్బరులు’; అంటే గ్రీకు భాష మాట్లాడని ప్రజలు. ఇక్కడ అది క్రూరులు లేదా అనాగరికులు అనే భావం తప్పనిసరిగా లేకుండా, ద్వీపంలోని స్థానిక నివాసులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘సాధారణమైనది కాని దయ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: βάρβαροι
  choice: అక్కడి ప్రజలు
  rationale: ఈ సందర్భంలో ఈ పదం గ్రీకు భాష మాట్లాడని స్థానిక నివాసులను సూచిస్తుంది; ఆధునిక తెలుగులో ప్రతికూల భావం కలిగించే ‘అనాగరికులు’ అనే అర్థాన్ని మోపకుండా సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: οὐ τὴν τυχοῦσαν φιλανθρωπίαν
  choice: అసాధారణమైన దయ
  rationale: ‘సామాన్యమైనది కాని మానవీయ దయ’ అనే గ్రీకు నుడికారపు బలాన్ని స్పష్టమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: παρεῖχον
  choice: చూపించారు
  rationale: φιλανθρωπίανతో కలిసి ‘దయ చూపించారు’ అనేది సహజమైన తెలుగు ప్రయోగం.
- source_word: ἅψαντες πυρὰν
  choice: మంట వేసి
  rationale: మంటను రాజేయడం అనే కార్యాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; ‘చలిమంట’ అని చెప్పి పరిమాణాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: προσελάβοντο
  choice: ఆదరంగా చేర్చుకున్నారు
  rationale: ఇక్కడ ఆశ్రయం లేదా వసతి మాత్రమే కాక ఆతిథ్యంతో స్వీకరించడం ప్రధాన భావం; అందువల్ల ఈ పదబంధం సందర్భాన్ని సహజంగా అందిస్తుంది.
- source_word: πάντας ἡμᾶς
  choice: మా అందరినీ
  rationale: స్వాగతం పొందినవారిలో ఎవరూ మినహాయించబడలేదనే మూలంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: διὰ τὸν ὑετὸν τὸν ἐφεστῶτα
  choice: వర్షం పట్టి ఉండడం వల్ల
  rationale: వర్షం వచ్చి అప్పటికీ కొనసాగుతున్నదనే ἐφεστῶτα భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: διὰ τὸ ψῦχος
  choice: చలి వల్ల
  rationale: ψῦχος సూచించే చల్లదనాన్ని సంక్షిప్తంగా, నేరుగా అందిస్తుంది.
