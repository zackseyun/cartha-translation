source:
  edition: SBLGNT
  text: Ταξάμενοι δὲ αὐτῷ ἡμέραν ⸀ἧκον πρὸς αὐτὸν εἰς τὴν ξενίαν πλείονες, οἷς ἐξετίθετο διαμαρτυρόμενος τὴν βασιλείαν τοῦ θεοῦ πείθων τε ⸀αὐτοὺς περὶ τοῦ Ἰησοῦ ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν ἀπὸ πρωῒ ἕως ἑσπέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/023.yaml
  text: After they had arranged a day with him[a], more of them came to him at his lodging. To them he was explaining, solemnly testifying about the kingdom of God and persuading them concerning Jesus from both the Law of Moses and the Prophets[c][b], from morning until evening.
translation:
  language: te
  text: వారు అతనితో ఒక రోజు నిర్ణయించుకున్న తర్వాత, ఇంకా ఎక్కువమంది అతడు బసచేస్తున్న చోటికి[a] వచ్చారు. ఉదయం నుండి సాయంత్రం వరకు అతడు వారికి దేవుని రాజ్యం గురించి వివరಿಸುತ್ತూ, గంభీరంగా సాక్ష్యమిస్తూ, మోషే ధర్మశాస్త్రం నుండీ ప్రవక్తల గ్రంథాల నుండీ యేసు గురించి వారిని ఒప్పించేందుకు ప్రయత్నిస్తూ ఉండేవాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతని బసకు” లేదా “అతడు ఉంటున్న వసతికి.” గ్రీకు పదం బస చేసే చోటు లేదా వసతిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “వారిని ఒప్పిస్తూ ఉండేవాడు.” గ్రీకు రూపం ఒప్పించే కార్యాన్ని సూచించవచ్చు; ఆ ప్రయత్నం అందరి విషయంలో విజయవంతమైందని తప్పనిసరిగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταξάμενοι ... αὐτῷ ἡμέραν
  choice: వారు అతనితో ఒక రోజు నిర్ణయించుకున్న తర్వాత
  rationale: మధ్యవాచక భూతకాల అసమాపక క్రియ ఇక్కడ సమావేశానికి ఒక రోజును పరస్పరం నిర్ణయించుకోవడాన్ని సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో ఈ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: εἰς τὴν ξενίαν
  choice: అతడు బసచేస్తున్న చోటికి
  rationale: ξενία అంటే బస లేదా వసతి; సందర్భం పౌలు ఉంటున్న ప్రదేశాన్ని సూచిస్తుంది. తెలుగు పాఠకులకు స్పష్టంగా ఉండే సాధారణ పదబంధం ఎంచుకోబడింది.
- source_word: πλείονες
  choice: ఇంకా ఎక్కువమంది
  rationale: ఇది కేవలం ‘అనేకులు’ అనే భావం కాకుండా తులనాత్మకంగా ‘మరింతమంది’ అనే భావాన్ని కలిగిస్తుంది.
- source_word: ἐξετίθετο
  choice: వివరించి
  rationale: అసంపూర్ణ కాలరూపం కొనసాగుతున్న వివరణను సూచిస్తుంది; వాక్యంలోని ఇతర క్రియలతో సహజంగా కలిసే రూపం.
- source_word: διαμαρτυρόμενος
  choice: గంభీరంగా సాక్ష్యమిస్తూ
  rationale: క్రియలోని బలమైన, గంభీరమైన సాక్ష్యప్రకటన భావాన్ని నిలుపుతుంది.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: మూలపదబంధానికి పారదర్శకమైన, స్థిరమైన తెలుగు సమానార్థకం.
- source_word: πείθων τε αὐτοὺς
  choice: వారిని ఒప్పించడానికి ప్రయత్నించాడు
  rationale: వర్తమాన అసమాపక క్రియ కొనసాగుతున్న ఒప్పించే కార్యాన్ని సూచిస్తుంది; అందరూ నిజంగా ఒప్పించబడ్డారని నిర్ధారించకుండా ప్రయత్నభావాన్ని నిలుపుతుంది.
- source_word: περὶ τοῦ Ἰησοῦ
  choice: యేసు గురించి
  rationale: సహజమైన ఆధునిక తెలుగులో విషయసూచక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν
  choice: మోషే ధర్మశాస్త్రం నుండీ ప్రవక్తల గ్రంథాల నుండీ
  rationale: ἀπό వాదనకు ఆధారం లేదా మూలాన్ని సూచిస్తుంది; τε ... καί జతను రెండు ‘నుండీ’ రూపాలతో ప్రతిబింబిస్తుంది. ‘గ్రంథాలు’ అనే పదం ప్రవక్తల రచనలను సూచించే తెలుగు వాడుకలో స్పష్టతనిస్తుంది.
- source_word: ἀπὸ πρωῒ ἕως ἑσπέρας
  choice: ఉదయం నుండి సాయంత్రం వరకు
  rationale: కాలవ్యాప్తిని అతిశయోక్తి లేకుండా నేరుగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: యేసు గురించిన సాక్ష్యానికి దేవుని రాజ్యంతో ఉన్న సంబంధం
  choice: దేవుని రాజ్యం గురించి వివరణ, యేసు గురించి ఒప్పించే ప్రయత్నం—రెండింటినీ ఒకే నిరంతర బోధనలో అనుసంధానంగా ఉంచడం
  alternative: వీటిని పరస్పర సంబంధంలేని రెండు వేర్వేరు విషయాలుగా చూపడం
  rationale: గ్రీకు వాక్యనిర్మాణం దేవుని రాజ్యంపై సాక్ష్యాన్ని, యేసు గురించిన ఒప్పించే కార్యాన్ని ఒకే వివరణాత్మక కార్యక్రమంలో కలుపుతుంది; అంతకుమించిన సిద్ధాంతవ్యాఖ్యను అనువాదం చేర్చదు.
- issue: πείθων విజయాన్ని సూచిస్తుందా, ప్రయత్నాన్ని సూచిస్తుందా
  choice: ఒప్పించడానికి ప్రయత్నించాడు
  alternative: ఒప్పించాడు
  rationale: ఈ అసమాపక క్రియ ఒప్పించే కార్యాన్ని సూచించినా, శ్రోతలందరూ ఫలితంగా ఒప్పుకున్నారని తప్పనిసరిగా చెప్పదు. ఫలితాన్ని ముందుగానే నిర్ణయించకుండా ప్రక్రియను వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలి. ‘ధర్మశాస్త్రం,’ ‘దేవుని రాజ్యం,’ ‘సాక్ష్యమిస్తూ’ వంటి పరిచిత బైబిలు పదాలను నిలుపుతూ, క్లిష్టమైన పాతకాలపు వాక్యనిర్మాణాన్ని నివారించాం.
