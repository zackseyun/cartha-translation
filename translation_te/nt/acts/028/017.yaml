source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς συγκαλέσασθαι ⸀αὐτὸν τοὺς ὄντας τῶν Ἰουδαίων πρώτους· συνελθόντων δὲ αὐτῶν ἔλεγεν πρὸς αὐτούς· ⸂Ἐγώ, ἄνδρες ἀδελφοί⸃, οὐδὲν ἐναντίον ποιήσας τῷ λαῷ ἢ τοῖς ἔθεσι τοῖς πατρῴοις δέσμιος ἐξ Ἱεροσολύμων παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/017.yaml
  text: It happened that after three days he called together the leading men of the Jews[a]. And when they had come together, he said to them, “I, brothers, though I had done nothing against the people or the customs of our fathers[d][c][b], was delivered as a prisoner from Jerusalem into the hands of the Romans.”
translation:
  language: te
  text: 'మూడు రోజుల తర్వాత, అతడు యూదుల్లో ప్రముఖులైనవారిని[a] సమావేశానికి పిలిచాడు. వారు సమావేశమైనప్పుడు అతడు వారితో ఇలా అన్నాడు: “సోదరులారా[b], నేను ప్రజలకు గానీ పూర్వీకుల ఆచారాలకు[c] గానీ విరుద్ధంగా ఏమీ చేయకపోయినా, యెరూషలేము నుండి ఖైదీగా రోమీయుల చేతికి అప్పగించబడ్డాను[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యూదుల నాయకులను,” “యూదుల్లో అగ్రగణ్యులైనవారిని.”
    reason: lexical_alternative
  - marker: b
    text: “సోదరులారా” అనేది గ్రీకు సంబోధన ἀδελφοίకు అనువాదం. ఇక్కడ పౌలు తాను సమావేశానికి పిలిచిన యూద పురుష ప్రముఖులను ఉద్దేశించి మాట్లాడుతున్నాడు.
    reason: cultural_note
  - marker: c
    text: లేదా “పారంపర్య ఆచారాలకు.”
    reason: lexical_alternative
  - marker: d
    text: 'అక్షరార్థానికి దగ్గరగా: “రోమీయుల చేతుల్లోకి అప్పగించబడ్డాను.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς
  choice: మూడు రోజుల తర్వాత
  rationale: తెలుగులో సహజమైన కాలసూచనగా అనువదించబడింది; Ἐγένετο δὲ అనే లూకా కథన మార్పును విడిగా కృత్రిమంగా చూపకుండా వాక్య ప్రవాహంలో ప్రతిబింబిస్తుంది.
- source_word: συγκαλέσασθαι αὐτὸν
  choice: అతడు ... సమావేశానికి పిలిచాడు
  rationale: συν-లోని కలిసి సమకూర్చే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοὺς ὄντας τῶν Ἰουδαίων πρώτους
  choice: యూదుల్లో ప్రముఖులైనవారిని
  rationale: πρώτους ఇక్కడ క్రమంలో మొదటివారు కాక, హోదా లేదా ప్రాముఖ్యత కలిగినవారిని సూచిస్తుంది.
- source_word: Ἐγώ, ἄνδρες ἀδελφοί
  choice: సోదరులారా, నేను
  rationale: తెలుగు సంబోధన క్రమానికి అనుగుణంగా మార్చి, ἀδελφοίలోని సహోదర ఐక్యతను మరియు Ἐγώలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: οὐδὲν ἐναντίον ποιήσας
  choice: విరుద్ధంగా ఏమీ చేయకపోయినా
  rationale: సందర్భంలోని concessive భావాన్ని—ఏ తప్పూ చేయకపోయినా అప్పగించబడటం—స్పష్టంగా, కానీ వ్యాఖ్యానాన్ని జోడించకుండా వ్యక్తం చేస్తుంది.
- source_word: τῷ λαῷ
  choice: మన ప్రజలకు
  rationale: గ్రీకులో స్వామ్యసూచకం లేకపోయినా, పౌలు యూద నాయకులను ‘సోదరులారా’ అని సంబోధిస్తున్న సందర్భంలో సంబంధిత సమూహాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τοῖς ἔθεσι τοῖς πατρῴοις
  choice: మన పూర్వీకుల ఆచారాలకు
  rationale: πατρῴοις యొక్క వారసత్వ/పూర్వీకుల భావాన్ని ఆధునిక, సమగ్ర తెలుగులో అందిస్తుంది.
- source_word: δέσμιος
  choice: ఖైదీగా
  rationale: పౌలు అప్పగించబడినప్పటి నిర్బంధ స్థితిని సంక్షిప్తంగా, న్యాయ-నిర్బంధ సందర్భానికి తగినట్లు తెలియజేస్తుంది.
- source_word: παρεδόθην ... εἰς τὰς χεῖρας τῶν Ῥωμαίων
  choice: రోమీయుల చేతికి అప్పగించబడ్డాను
  rationale: గ్రీకు ‘చేతుల్లోకి అప్పగించబడటం’ అనే రూపకాన్ని తెలుగులో సహజంగా నిలుపుతూ, న్యాయపరమైన బదిలీ భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: ἄνδρες ἀδελφοί అనే పురుష సంబోధన
  choice: సోదరులారా
  alternative: సోదర సోదరీమణులారా
  rationale: ఇక్కడ పౌలు పిలిపించిన యూద పురుష ప్రముఖులను సంబోధిస్తున్నాడు; అందువల్ల మూలంలోని వ్యాకరణ లింగాన్ని మరియు సందర్భాన్ని నిలుపుతుంది.
- issue: οὐδὲν ἐναντίον ποιήσας యొక్క సంబంధం
  choice: 'రాయితీ భావం: ‘ఏమీ చేయకపోయినా’'
  alternative: 'సాధారణ పూర్వక్రియ భావం: ‘ఏమీ చేయకుండా/చేయని నేను’'
  rationale: తాను నిర్దోషినని చెప్పినప్పటికీ రోమీయులకు అప్పగించబడ్డాననే వాక్యంలోని ఉద్రిక్తతను నిలుపుతుంది.
- issue: παρεδόθην యొక్క దైవిక లేదా మానవ కార్యసాధకుడు
  choice: కర్తను పేర్కొనని కర్మణి రూపం
  alternative: ‘యూదులు నన్ను అప్పగించారు’ అని కర్తను స్పష్టీకరించడం
  rationale: గ్రీకు వాక్యం కార్యసాధకుడిని ఇక్కడ స్పష్టంగా చెప్పదు; కాబట్టి అనవసరమైన బాధ్యత నిర్ధారణను అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. ‘ప్రముఖులు,’ ‘పూర్వీకుల ఆచారాలు,’ ‘ఖైదీగా,’ ‘చేతికి అప్పగించబడ్డాను’ వంటి పదబంధాలు మూలంలోని సామాజిక, సాంస్కృతిక, న్యాయపరమైన భావాలను సహజంగా నిలుపుతాయి.
