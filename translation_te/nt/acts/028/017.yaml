  to: 'మూడు రోజుల తర్వాత, అతడు యూదుల్లో ప్రముఖులైనవారిని[a] సమావేశానికి పిలిచాడు. వారు సమావేశమైనప్పుడు అతడు వారితో ఇలా అన్నాడు: “సోదరులారా[b], నేను ప్రజలకు గానీ పూర్వీకుల ఆచారాలకు[c] గానీ విరుద్ధంగా ఏమీ చేయకపోయినా, యెరూషలేము నుండి ఖైదీగా రోమీయుల చేతికి అప్పగించబడ్డాను[d].”'
