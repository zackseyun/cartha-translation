  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ప్రయాణ వర్ణన. గ్రీకు వాక్యంలోని క్రమాన్ని సాధ్యమైనంతవరకు నిలిపి, నౌకాయాన సూక్ష్మార్థాన్ని పాదసూచికలో భద్రపరచాము.
