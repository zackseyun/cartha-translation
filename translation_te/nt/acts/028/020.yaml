    issue: Unwarranted emphatic suffix in “ఈ కారణంగానే” and “నిరీక్షణ కారణంగానే.”
    rationale: The suffix -గానే can imply exclusivity or heightened emphasis. The Greek states causation and inference, but does not explicitly mark either cause as exclusive. Plain causal phrasing better preserves the source.
