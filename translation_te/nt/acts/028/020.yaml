  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ ταύτην οὖν τὴν αἰτίαν παρεκάλεσα ὑμᾶς ἰδεῖν καὶ προσλαλῆσαι, ἕνεκεν γὰρ τῆς ἐλπίδος τοῦ Ἰσραὴλ τὴν ἅλυσιν ταύτην περίκειμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/020.yaml
  text: For this reason[a], therefore, I asked to see you and to speak with you, for it is because of the hope of Israel that I am wearing this chain.
translation:
  language: te
  text: కాబట్టి, ఈ కారణం వల్ల మిమ్మల్ని చూడాలని, మీతో మాట్లాడాలని కోరాను. ఎందుకంటే ఇశ్రాయేలు నిరీక్షణ కారణంగా నేను ఈ గొలుసును ధరించి ఉన్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలుకు సంబంధించిన నిరీక్షణ.” ఇది పౌలు ప్రకటిస్తున్న నిబంధన సంబంధమైన నిరీక్షణను, ముఖ్యంగా పునరుత్థాన నిరీక్షణను సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ ταύτην οὖν τὴν αἰτίαν
  choice: అందుచేత, ఈ కారణంగానే
  rationale: οὖν యొక్క నిర్ధారణ భావాన్నీ, διὰ ταύτην τὴν αἰτίαν యొక్క కారణ భావాన్నీ నిలుపుతూ తెలుగులో సహజంగా వినిపిస్తుంది.
- source_word: παρεκάλεσα
  choice: కోరాను
  rationale: ఇక్కడ స్థానిక యూదు నాయకులను కలుసుకోవడానికి చేసిన అభ్యర్థనను సహజంగా తెలియజేస్తుంది; న్యాయపరమైన ‘విన్నవించాను’ అనే అర్థాన్ని అనవసరంగా చేర్చదు.
- source_word: ἰδεῖν
  choice: మిమ్మల్ని చూడాలని
  rationale: మూలంలోని ‘చూడడం’ అనే ప్రత్యక్ష భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: προσλαλῆσαι
  choice: మీతో మాట్లాడాలని
  rationale: ఒకవైపు ప్రసంగించడం కాకుండా పరస్పరంగా మాట్లాడే భావాన్ని అందిస్తుంది.
- source_word: ἕνεκεν γὰρ
  choice: ఎందుకంటే ... కారణంగానే
  rationale: γάρ యొక్క వివరణాత్మక సంబంధాన్నీ, ἕνεκεν యొక్క స్పష్టమైన కారణ భావాన్నీ నిలుపుతుంది.
- source_word: τῆς ἐλπίδος τοῦ Ἰσραὴλ
  choice: ఇశ్రాయేలు నిరీక్షణ
  rationale: సంబంధ విభక్తి పదబంధాన్ని సంక్షిప్తంగా ఉంచి, అది ఇశ్రాయేలు కలిగిన నిరీక్షణనా లేక ఇశ్రాయేలుకు సంబంధించిన నిరీక్షణనా అనే మూలంలోని విస్తృతిని కాపాడుతుంది.
- source_word: τὴν ἅλυσιν ταύτην
  choice: ఈ గొలుసును
  rationale: ఏకవచనాన్ని, పౌలు నిర్బంధానికి సంబంధించిన స్పష్టమైన భౌతిక చిత్రాన్ని నిలుపుతుంది.
- source_word: περίκειμαι
  choice: ధరించి ఉన్నాను
  rationale: తన చుట్టూ లేదా మీద ఏదో ఉండటం అనే క్రియ యొక్క సజీవమైన చిత్రాన్ని కాపాడుతుంది; కేవలం ‘బంధించబడ్డాను’ అని వ్యాఖ్యానాత్మకంగా మార్చదు.
theological_decisions:
- issue: ‘ఇశ్రాయేలు నిరీక్షణ’ యొక్క అర్థం
  choice: ఇశ్రాయేలు నిరీక్షణ
  alternative: ఇశ్రాయేలుకు వాగ్దానం చేయబడిన నిరీక్షణ; పునరుత్థానంపై ఇశ్రాయేలు నిరీక్షణ; ఇశ్రాయేలు మెస్సీయ నిరీక్షణ
  rationale: ఈ పదబంధం నిబంధన, మెస్సీయ, పునరుత్థాన నిరీక్షణలను సూచించవచ్చు; అయితే గ్రీకు వాక్యం దానిని సంక్షిప్తంగా, సూచనాత్మకంగా ఉంచుతుంది. అందువల్ల అనువాదం ఏ ఒక్క వివరణకూ దాన్ని పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. తార్కిక అనుసంధానాలూ మూలంలోని సజీవమైన ‘గొలుసును ధరించడం’ అనే చిత్రమూ నిలుపబడ్డాయి.
