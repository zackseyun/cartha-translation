id: ACT.28.7
reference: Acts 28:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον ὑπῆρχεν χωρία τῷ πρώτῳ τῆς νήσου ὀνόματι Ποπλίῳ, ὃς ἀναδεξάμενος ἡμᾶς ⸂τρεῖς ἡμέρας⸃ φιλοφρόνως ἐξένισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/007.yaml
  text: In the area around that place there were lands belonging to the chief man of the island[a], named Publius[c][b], who welcomed us and hosted us courteously for three days.
translation:
  language: te
  text: ఆ స్థలం చుట్టుపక్కల, పొప్లియు అనే ఆ ద్వీపపు ప్రముఖునికి చెందిన భూములు[a] ఉండేవి.[b] ఆయన మమ్మల్ని స్వీకరించి, మూడు రోజుల పాటు సాదరంగా ఆతిథ్యమిచ్చాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “భూసంపత్తులు” లేదా “ఎస్టేట్లు.” గ్రీకు పదం χωρία సమీప ప్రాంతంలోని భూములు లేదా భూసంపత్తులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఆ ద్వీపపు ప్రధాన అధికారి.” గ్రీకు పదబంధం τῷ πρώτῳ τῆς νήσου ద్వీపంలోని ప్రముఖుణ్ణి సూచించవచ్చు; అది అధికారిక హోదాను కూడా సూచించే అవకాశం ఉంది.
    reason: alternative_reading
  - marker: c
    text: లేదా “మమ్మల్ని ఆహ్వానించి, మూడు రోజులు దయతో అతిథులుగా ఉంచాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον
  choice: ఆ స్థలం చుట్టుపక్కల
  rationale: περὶ τὸν τόπον ఆ స్థల పరిసర ప్రాంతాన్ని సూచిస్తుంది. δέ ఇక్కడ స్వల్ప కథన సంధానకంగా ఉంది; తెలుగులో ప్రత్యేక పదం చేర్చకుండానే వాక్యప్రవాహం దాని పనిని నెరవేర్చుతుంది.
- source_word: ὑπῆρχεν χωρία
  choice: భూములు ఉండేవి
  rationale: ὑπῆρχεν ఉనికిని తెలియజేస్తుంది; χωρία బహువచనంగా భూసంపత్తులను లేదా ఎస్టేట్లను సూచిస్తుంది. 'భూములు' అర్థాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: τῷ πρώτῳ τῆς νήσου
  choice: ఆ ద్వీపపు ప్రధాన అధికారి
  rationale: πρῶτος ఇక్కడ కేవలం క్రమసంఖ్య కాకుండా ప్రముఖ లేదా అత్యున్నత స్థానాన్ని సూచించే బిరుదుగా కనిపిస్తుంది. 'ప్రధాన అధికారి' సంభావ్య అధికారిక హోదాను సహజ తెలుగులో తెలియజేస్తూ, నిర్దిష్ట పరిపాలనా పదవిని బలవంతంగా నిర్ణయించదు.
- source_word: ὀνόματι Ποπλίῳ
  choice: పొప్లియు అనే వ్యక్తి
  rationale: ὀνόματι తో కూడిన దత్తివిభక్తి వ్యక్తి పేరును పరిచయం చేస్తుంది. Ποπλίῳ అనే గ్రీకు రూపానికి 'పొప్లియు' సమీప లిప్యంతరీకరణ.
- source_word: ἀναδεξάμενος ἡμᾶς
  choice: మమ్మల్ని ఆహ్వానించి
  rationale: ఈ కృదంతం అతిథులను స్వీకరించడం లేదా సాదరంగా ఆహ్వానించడాన్ని సూచిస్తుంది. ఆతిథ్య సందర్భంలో 'ఆహ్వానించి' సహజంగా ఉంటుంది.
- source_word: τρεῖς ἡμέρας
  choice: మూడు రోజులు
  rationale: ఇది కాలవ్యాప్తిని తెలిపే accusative; తెలుగులో 'మూడు రోజులు' సహజమైన వ్యక్తీకరణ.
- source_word: φιλοφρόνως ἐξένισεν
  choice: ఆదరంగా ఆతిథ్యమిచ్చాడు
  rationale: φιλοφρόνως స్నేహపూర్వకమైన, దయగల వ్యవహారాన్ని; ἐξένισεν అతిథిగా ఉంచి సత్కరించడాన్ని సూచిస్తాయి. ఈ కలయిక రెండు భావాలనూ సంక్షిప్తంగా అందిస్తుంది.
theological_decisions:
- issue: τῷ πρώτῳ τῆς νήσου అధికారిక బిరుదా లేదా సాధారణ ప్రముఖత సూచనా
  choice: ప్రధాన అధికారి
  alternative: ద్వీపంలోని ప్రముఖుడు
  rationale: మూలపదం అత్యున్నత స్థానం లేదా నాయకత్వాన్ని సూచించవచ్చు; మాల్టా సందర్భంలో అది అధికారిక బిరుదై ఉండవచ్చును. అయితే ఖచ్చితమైన పదవిపేరును ఊహించకుండా 'ప్రధాన అధికారి'గా అనువదించి, ప్రత్యామ్నాయాన్ని పాదటీపులో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. 'పొప్లియు' మూల గ్రీకు పేరుకు సమీప లిప్యంతరీకరణ. ప్రధాన పాఠ్యంలో అన్ని పాదటీపు గుర్తులు [a], [b], [c] చేర్చబడ్డాయి.
