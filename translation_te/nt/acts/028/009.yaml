  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, మూలంలోని కర్మణి భావం మరియు రోగాల బహువచనం నిలుపబడ్డాయి.
