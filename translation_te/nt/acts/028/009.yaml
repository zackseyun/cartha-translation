  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τούτου ⸀δὲ γενομένου καὶ οἱ λοιποὶ οἱ ⸂ἐν τῇ νήσῳ ἔχοντες ἀσθενείας⸃ προσήρχοντο καὶ ἐθεραπεύοντο,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/009.yaml
  text: And after this happened[a], the rest of those on the island who had diseases also came and were healed.
translation:
  language: te
  text: ఇది జరిగిన తర్వాత, ద్వీపంలో రోగాలు ఉన్న మిగతావారు కూడా వచ్చి స్వస్థత పొందారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτου δὲ γενομένου
  choice: ఇది జరిగిన తర్వాత
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణంలోని కాలక్రమ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; δέ ఇక్కడ కథన మార్పును సూచిస్తుంది.
- source_word: οἱ λοιποί
  choice: మిగతావారు
  rationale: ఇంతకు ముందు స్వస్థత పొందిన వ్యక్తిని మినహాయించి ద్వీపంలోని ఇతర రోగులను సూచించే సంక్షిప్తమైన సహజ ప్రయోగం.
- source_word: οἱ ἐν τῇ νήσῳ
  choice: ద్వీపంలో
  rationale: ఆ సమూహం ద్వీపంలో ఉన్నదని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἔχοντες ἀσθενείας
  choice: రోగాలు ఉన్న
  rationale: ἔχοντες అనే ‘కలిగి ఉన్న’ భావాన్నీ, ἀσθενείας అనే బహువచనంలోని వివిధ రోగాల భావాన్నీ నిలుపుతుంది.
- source_word: προσήρχοντο
  choice: వచ్చి
  rationale: అసంపూర్ణ భూతకాల రూపం సందర్భంలో వరుసగా రావడాన్ని సూచిస్తుంది; లక్ష్యవ్యక్తిని మూలంలో స్పష్టంగా చెప్పనందున ‘పౌలు దగ్గరకు’ అని చేర్చలేదు.
- source_word: ἐθεραπεύοντο
  choice: స్వస్థత పొందారు
  rationale: గ్రీకు క్రియలోని కర్మణి భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: καὶ
  choice: కూడా
  rationale: మునుపటి స్వస్థత సంఘటనకు ఈ ఇతరుల స్వస్థతను కొనసాగింపుగా కలుపుతుంది.
theological_decisions: []
