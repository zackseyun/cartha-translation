source:
  edition: SBLGNT
  text: συστρέψαντος δὲ τοῦ Παύλου φρυγάνων ⸀τι πλῆθος καὶ ἐπιθέντος ἐπὶ τὴν πυράν, ἔχιδνα ⸀ἀπὸ τῆς θέρμης ⸀ἐξελθοῦσα καθῆψε τῆς χειρὸς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/003.yaml
  text: But when Paul had gathered a bundle of sticks and put them on the fire[b][a], a viper came out because of the heat and fastened onto his hand.
translation:
  language: te
  text: పౌలు ఎండు పుల్లల కట్టను పోగుచేసి మంట మీద వేయగా, వేడి కారణంగా[a] ఒక విషసర్పం బయటికి వచ్చి అతని చేతిని గట్టిగా పట్టుకుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వేడి నుండి.’ గ్రీకు ఉపసర్గను అక్షరార్థంగా ఇలా అనువదించవచ్చు; అయితే ఇక్కడ మంట వేడి కారణంగా విషసర్పం బయటికి వచ్చిందనే భావం ఎక్కువ సంభావ్యం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతని చేతిని పట్టుకుంది’ లేదా ‘అతని చేతిని కరిచింది.’ గ్రీకు క్రియకు విస్తృతంగా ‘గట్టిగా పట్టుకోవడం’ లేదా ‘అంటిపెట్టుకోవడం’ అనే అర్థం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: συστρέψαντος
  choice: పోగుచేసి
  rationale: ఈ సందర్భంలో ఈ క్రియ ఎండు పుల్లలను ఒకచోట చేర్చడాన్ని సూచిస్తుంది. ‘పోగుచేసి’ అనేది సహజమైన ఆధునిక తెలుగు; ‘మెలిపెట్టి’ అనే అక్షరార్థం ఇక్కడ సందర్భోచితం కాదు.
- source_word: φρυγάνων τι πλῆθος
  choice: కొన్ని ఎండు పుల్లలను
  rationale: φρύγανα మంటకు పనికివచ్చే ఎండు పుల్లలు లేదా పొదచితుకులను సూచిస్తుంది; τι πλῆθος నిర్దిష్టం కాని పరిమాణాన్ని తెలియజేస్తుంది. అందువల్ల ‘కొన్ని ఎండు పుల్లలను’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: ἐπιθέντος ἐπὶ τὴν πυράν
  choice: మంట మీద వేసినప్పుడు
  rationale: రెండవ భూతకాల కృదంతాన్ని ప్రధాన సంఘటనకు నేపథ్యంగా తెలుగులో సహజమైన కాలవాచక ఉపవాక్యంగా ఇచ్చాం. πυράను ‘మంట’గా అనువదించడం సందర్భానికి సరిపోతుంది.
- source_word: ἔχιδνα
  choice: ఒక విషసర్పం
  rationale: ἔχιδνα సాధారణ పాము కంటే విషసర్పాన్ని, ముఖ్యంగా వైపర్ జాతి పామును సూచిస్తుంది. సాధారణ తెలుగు పాఠకులకు సహజంగా అర్థమయ్యేలా ‘విషసర్పం’ ఎంచుకున్నాం.
- source_word: ἀπὸ τῆς θέρμης
  choice: వేడి కారణంగా
  rationale: ἀπόకు అక్షరార్థంగా ‘నుండి’ అని చెప్పవచ్చు; ఇక్కడ అది సర్పం బయటికి రావడానికి వేడి కారణమైందనే భావాన్ని వ్యక్తం చేయడం ఎక్కువ సంభావ్యం.
- source_word: ἐξελθοῦσα
  choice: బయటికి వచ్చి
  rationale: సర్పం వేడి వల్ల దాగిన చోటు నుంచి వెలుపలికి వచ్చిన వరుస చర్యను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: καθῆψε τῆς χειρὸς αὐτοῦ
  choice: అతని చేతికి గట్టిగా పట్టుకుంది
  rationale: καθάπτω యొక్క విస్తృత భావం ‘పట్టుకోవడం/అంటిపెట్టుకోవడం.’ ‘కరిచింది’ అని మాత్రమే అనడం మూలపదం కంటే నిర్దిష్టంగా ఉంటుంది; ఈ ఎంపిక సర్పం చేతికి గట్టిగా అంటుకున్న దృశ్యాన్ని కాపాడుతుంది.
