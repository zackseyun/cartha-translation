translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. గ్రీకు కృదంతాల వరుసను తెలుగులో సహజమైన కాలవాచక ఉపవాక్యంగా మార్చాం. ‘విషసర్పం’ సాధారణ పాఠకునికి ‘వైపర్’ కంటే సులభంగా అర్థమవుతుంది; చివరి క్రియలో కాటు జరిగిందని మూలపాఠం స్పష్టంగా చెప్పని కారణంగా ఆ వివరాన్ని ప్రధాన పాఠ్యంలో నిర్దిష్టం చేయలేదు.
