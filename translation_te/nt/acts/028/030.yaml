    issue: “తన దగ్గరికి లోపలికి వచ్చేవారందరినీ” is awkward Telugu.
    rationale: The sequence combines two directional expressions in a way that is not idiomatic. The Greek’s spatial nuance can be retained in a lexical note without making the Telugu main text stilted.
  - severity: medium
    issue: “ఆహ్వానిస్తూ ఉండేవాడు” may mean ‘was inviting.’
    rationale: ἀπεδέχετο describes welcoming/receiving people who were already coming, not necessarily extending invitations to them. “స్వాగతించేవాడు” is more precise.
