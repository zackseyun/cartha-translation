id: ACT.28.30
reference: Acts 28:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Ἐνέμεινεν ⸀δὲ διετίαν ὅλην ἐν ἰδίῳ μισθώματι, καὶ ἀπεδέχετο πάντας τοὺς εἰσπορευομένους πρὸς αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/030.yaml
  text: And he stayed for two whole years in his own rented lodging[a], and he welcomed all who came in to him[b],
translation:
  language: te
  text: అతడు తాను అద్దెకు తీసుకున్న నివాసంలో[a] పూర్తి రెండు సంవత్సరాలు ఉండి, తన దగ్గరికి వచ్చేవారందరినీ[b] స్వాగతించేవాడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన సొంత అద్దె నివాసంలో.’ గ్రీకు μίσθωμα అద్దెకు తీసుకున్న వసతిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తన దగ్గరికి లోపలికి వచ్చేవారందరినీ.’ గ్రీకు పదబంధం అక్షరార్థంగా ‘తన దగ్గరికి లోపలికి వచ్చేవారిని’ అంటుంది; బహుశా అతని నివాసంలోకి ప్రవేశించిన సందర్శకులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνέμεινεν
  choice: ఉండి
  rationale: ἐμμένω ఇక్కడ ఒక చోట కొనసాగి ఉండడాన్ని సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో ‘ఉండి’ సహజంగా ఉండి, తదుపరి కొనసాగుతున్న క్రియతో అనుసంధానమవుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ ఇక్కడ బలమైన వ్యతిరేకతను కాక కథనాన్ని స్వల్పంగా ముందుకు నడిపే అనుసంధానాన్ని సూచిస్తుంది. తెలుగులో వాక్యారంభ సంధిపదం లేకుండానే ఆ ప్రవాహం సహజంగా వ్యక్తమవుతుంది.
- source_word: διετίαν ὅλην
  choice: పూర్తి రెండు సంవత్సరాలు
  rationale: కాలవ్యాప్తిని తెలిపే διετίανతో ఉన్న ὅλην మొత్తం కాలవ్యవధిని నొక్కి చెబుతుంది; ‘పూర్తి రెండు సంవత్సరాలు’ ఆ ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: ἐν ἰδίῳ μισθώματι
  choice: తన సొంత అద్దె నివాసంలో
  rationale: μίσθωμα అద్దెకు తీసుకున్న వసతిని సూచిస్తుంది; ‘అద్దె నివాసం’ ఆధునిక తెలుగులో సహజం. ἰδίῳను ‘తన సొంత’గా అనువదించడం అది అతని ఏర్పాటులో ఉన్న నివాసమని తెలియజేస్తుంది.
- source_word: ἀπεδέχετο
  choice: ఆహ్వానిస్తూ ఉండేవాడు
  rationale: అసంపూర్ణ భూతకాల రూపం పునరావృతమైన లేదా కొనసాగిన చర్యను సూచిస్తుంది. ఈ సందర్భంలో ἀποδέχομαι సందర్శకులను స్వాగతపూర్వకంగా చేర్చుకోవడాన్ని తెలుపుతుంది; ‘ఆహ్వానిస్తూ ఉండేవాడు’ ఆ కొనసాగింపు, ఆతిథ్య భావాలను అందిస్తుంది.
- source_word: πάντας τοὺς εἰσπορευομένους πρὸς αὐτόν
  choice: తన దగ్గరికి లోపలికి వచ్చేవారందరినీ
  rationale: εἰσπορεύομαιలోని లోపలికి ప్రవేశించే స్థలార్థాన్ని ‘లోపలికి’ నిలుపుతుంది; πάνταςను ‘అందరినీ’గా సంపూర్ణంగా వ్యక్తం చేస్తుంది.
