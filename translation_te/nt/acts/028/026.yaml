  source_fidelity: The Telugu accurately represents the SBLGNT wording. “అంటూ” appropriately preserves λέγων as a participial introduction; “ఈ ప్రజల దగ్గరికి వెళ్లి ఇలా చెప్పు” conveys both imperatives and the collective, prophetic force of πρὸς τὸν λαὸν τοῦτον. “వింటూనే ఉంటారు” / “చూస్తూనే ఉంటారు” naturally communicates the emphatic repeated sensory language, while “ఎంతమాత్రమూ” adequately renders the emphatic οὐ μή negations. “గ్రహించరు” is contextually justified for the final ἴδητε and does not overstate the source, since the lexical sight-word ambiguity is retained in the footnote.
  naturalness: The wording is fluent modern standard Telugu with an appropriately elevated but accessible prophetic register. The paired clauses are balanced and readily intelligible. The nested quotation punctuation is coherent.
