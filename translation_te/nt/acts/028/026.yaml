id: ACT.28.26
reference: Acts 28:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀λέγων· Πορεύθητι πρὸς τὸν λαὸν τοῦτον καὶ εἰπόν· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/026.yaml
  text: 'saying[a], ‘Go to this people and say: You will indeed hear, but you will never understand; and seeing, you will indeed see[b], but you will never perceive.’'
translation:
  language: te
  text: 'అంటూ,[a] “నీవు ఈ ప్రజల దగ్గరికి వెళ్లి ఇలా చెప్పు: ‘మీరు వింటూనే ఉంటారు, కానీ ఎంతమాత్రమూ అర్థం చేసుకోరు; చూస్తూనే ఉంటారు, కానీ ఎంతమాత్రమూ గ్రహించరు.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకులో వినడం, చూడడం రెండింటికీ సజాత పదాల పునరుక్తి ఉంది: అక్షరార్థంగా, “వినికిడితో వింటారు ... చూస్తూ చూస్తారు ... చూడరు.” ఈ హెబ్రీయ శైలి నిశ్చయాన్ని లేదా బలమైన ఉద్ఘాటనను సూచిస్తుంది. చివరి “చూడరు” సందర్భంలో “గ్రహించరు” అనే అంతర్గత భావాన్నీ ఇవ్వగలదు.'
    reason: మూలంలోని ఉద్ఘాటనాత్మక పునరుక్తిని, అలాగే చివరి చూపు-క్రియలోని పదార్థ సందిగ్ధతను నమోదు చేయడం.
lexical_decisions:
- source_word: λέγων
  choice: అంటూ
  rationale: వర్తమాన కృదంతం ముందున్న వాక్యంతో ఈ ఉల్లేఖనాన్ని అనుసంధానిస్తుంది; ‘అంటూ’ ఆ సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: Πορεύθητι πρὸς τὸν λαὸν τοῦτον
  choice: నీవు ఈ ప్రజల దగ్గరికి వెళ్లు
  rationale: πορεύθητι ఆజ్ఞార్థక గమనాన్ని సూచిస్తుంది; λαὸν τοῦτον అనే సమష్టి, ప్రవచనాత్మక సంబోధనను ‘ఈ ప్రజలు’గా ఉంచి, πρὸς భావాన్ని ‘దగ్గరికి’తో వ్యక్తం చేశాం.
- source_word: εἰπόν
  choice: ఇలా చెప్పు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే ఆజ్ఞార్థక రూపానికి సహజమైన తెలుగు.
- source_word: Ἀκοῇ ἀκούσετε
  choice: మీరు వింటూనే ఉంటారు
  rationale: నామవాచకం-సజాత క్రియ పునరుక్తితో ఉన్న హెబ్రీయ శైలిని పదశః అనుకరించకుండా, నిరంతర/నిశ్చిత వినికిడి భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: οὐ μὴ συνῆτε
  choice: ఎంతమాత్రమూ అర్థం చేసుకోరు
  rationale: οὐ μή యొక్క బలమైన నిరాకరణను ‘ఎంతమాత్రమూ ... కాదు’ అనే ఆధునిక తెలుగు నిర్మాణం వ్యక్తం చేస్తుంది; συνίημι ఇక్కడ అంతర్గత అవగాహనను సూచిస్తుంది.
- source_word: βλέποντες βλέψετε
  choice: చూస్తూనే ఉంటారు
  rationale: కృదంతం మరియు సజాత క్రియలోని పునరుక్తి బలాన్ని సహజమైన తెలుగు నిరంతర రూపంతో వ్యక్తం చేసి, మొదటి అర్ధవాక్యంతో సమాంతరతను కాపాడాం.
- source_word: οὐ μὴ ἴδητε
  choice: ఎంతమాత్రమూ గ్రహించరు
  rationale: ἴδητε పదానికి ‘చూడరు’ అనే ప్రత్యక్ష అర్థం ఉన్నప్పటికీ, సందర్భంలో అంతర్గత గ్రహింపును కూడా సూచించగలదు; ప్రధాన పాఠంలో ‘గ్రహించరు’ ఆ వ్యత్యాసాన్ని తెలుపుతుంది, పదపునరుక్తిని పాదటీపులో నిలిపాం.
theological_decisions:
- issue: యెషయా ప్రవచన ఉల్లేఖనంలోని బాహ్య వినికిడి/చూపు మరియు అంతర్గత అవగాహన మధ్య ఉద్రిక్తత
  choice: చివరి క్రియను ‘గ్రహించరు’గా అనువదించడం
  alternative: ‘చూడరు’ అని అనువదించి గ్రీకు చూపు-పదాల పునరుక్తిని పూర్తిగా నిలుపడం
  rationale: సందర్భం ఇంద్రియానుభవం ఉన్నప్పటికీ అంతర్గత అవగాహన లేకపోవడాన్ని సూచిస్తుంది. ‘గ్రహించరు’ ఆ భావాన్ని వ్యక్తం చేస్తుంది; అయితే మూలంలోని ఒకే భావక్షేత్రపు పునరుక్తిని పాదటీపు ద్వారా స్పష్టంగా ఉంచడం వల్ల నిజమైన పదార్థ సందిగ్ధత తొలగిపోదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా, అయితే ప్రవచన ఉల్లేఖనానికి తగిన గంభీరతతో రూపొందించబడింది. ‘ఈ ప్రజలు’ సమష్టి సంబోధనను నిలుపుతుంది; ‘ఎంతమాత్రమూ’ బలమైన గ్రీకు నిరాకరణను తెలియజేస్తుంది.
