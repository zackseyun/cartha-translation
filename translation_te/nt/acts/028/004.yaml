id: ACT.28.4
reference: Acts 28:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς δὲ εἶδον οἱ βάρβαροι κρεμάμενον τὸ θηρίον ἐκ τῆς χειρὸς αὐτοῦ, ⸂πρὸς ἀλλήλους ἔλεγον⸃· Πάντως φονεύς ἐστιν ὁ ἄνθρωπος οὗτος ὃν διασωθέντα ἐκ τῆς θαλάσσης ἡ δίκη ζῆν οὐκ εἴασεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/004.yaml
  text: When the islanders saw the creature hanging from his hand[a], they said to one another, “Surely this man is a murderer, whom Justice has not allowed to live[d][c][b], though he was brought safely from the sea.”
translation:
  language: te
  text: 'ఆ జంతువు అతని చేతికి వేలాడుతూ ఉండడం చూసిన ద్వీపవాసులు[a] ఒకరితో ఒకరు ఇలా అనుకున్నారు: “ఈ మనిషి తప్పకుండా హంతకుడే. ఇతడు సముద్రం నుంచి సురక్షితంగా బయటపడినా, న్యాయం[b] ఇతన్ని బ్రతకనివ్వలేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా ‘అన్యభాషీయులు’; అంటే గ్రీకు మాట్లాడని స్థానిక ప్రజలు. ఇది వారిని అనాగరికులని తీర్పు చెప్పే పదం కాదు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పదం dikē అంటే ‘న్యాయం’. ఇక్కడ అది దోషులను శిక్షించే శక్తిగా వ్యక్తీకరించబడింది; ద్వీపవాసులు దానిని దేవతగా భావించి ఉండవచ్చు. ఇది వారి అభిప్రాయం, కథకుని సమర్థన కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: βάρβαροι
  choice: ద్వీపవాసులు
  rationale: ఇక్కడ ఈ పదం గ్రీకు మాట్లాడని మాల్టా స్థానికులను సూచిస్తుంది; ఆధునిక అర్థంలోని ‘అనాగరికులు’ అనే నైతిక తీర్పు కాదు. సందర్భంలో ‘ద్వీపవాసులు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: κρεμάμενον τὸ θηρίον
  choice: ఆ జంతువు ... వేలాడుతూ ఉండడం
  rationale: θηρίον సాధారణంగా జంతువు/ప్రాణి అని సూచిస్తుంది; ఈ వాక్యంలోనే ‘పాము’ అని ప్రత్యేకీకరించకుండా మూలంలోని సాధారణ పదాన్ని నిలుపుతుంది. κρεμάμενον దాని వేలాడే దృశ్యాన్ని తెలియజేస్తుంది.
- source_word: πρὸς ἀλλήλους ἔλεγον
  choice: ఒకరితో ఒకరు ... అని చెప్పుకున్నారు
  rationale: పరస్పరం మాట్లాడుకున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; imperfect రూపంలోని కొనసాగుతున్న సంభాషణ భావాన్నీ అనుమతిస్తుంది.
- source_word: Πάντως
  choice: తప్పకుండా
  rationale: కనిపించిన దానిని బట్టి వారు బలంగా చేసుకున్న నిర్ధారణను సహజంగా తెలియజేస్తుంది.
- source_word: φονεύς
  choice: హంతకుడు
  rationale: ఉద్దేశపూర్వకంగా మనిషిని చంపినవాడనే అర్థానికి స్పష్టమైన, ప్రామాణిక తెలుగు పదం.
- source_word: διασωθέντα ἐκ τῆς θαλάσσης
  choice: సముద్రం నుంచి సురక్షితంగా బయటపడినా
  rationale: సముద్ర ప్రమాదం నుంచి క్షేమంగా బయటపడిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది. గ్రీకు participle లోని concessive సంబంధాన్ని సందర్భానుసారంగా ‘అయినా’తో చూపుతుంది.
- source_word: ἡ δίκη
  choice: న్యాయదేవత
  rationale: ఇక్కడ δίκη ప్రతీకార న్యాయాన్ని వ్యక్తీకరించిన శక్తిగా, బహుశా ద్వీపవాసుల అన్యమత అవగాహనలో దేవతగా భావించబడింది. తెలుగులో కేవలం ‘న్యాయం’ అనడం వల్ల వ్యక్తీకరణ స్పష్టంగా కనిపించకపోవచ్చు; ‘న్యాయదేవత’ దాన్ని సంక్షిప్తంగా తెలియజేస్తుంది, పాదసూచికలో పరిమితి వివరించబడింది.
- source_word: ζῆν οὐκ εἴασεν
  choice: బ్రతకనివ్వలేదు
  rationale: ‘జీవించడానికి అనుమతించలేదు’ అనే భావాన్ని సహజమైన ప్రత్యక్ష తెలుగు ప్రయోగంతో అందిస్తుంది.
theological_decisions:
- issue: δίκη యొక్క వ్యక్తీకరణ
  choice: ప్రధాన పాఠ్యంలో ‘న్యాయదేవత’ అని అనువదించి, ఇది ద్వీపవాసుల అభిప్రాయమని పాదసూచికలో స్పష్టం చేయడం
  alternative: ‘న్యాయం’ లేదా ‘ప్రతీకార న్యాయం’
  rationale: వాక్యం ద్వీపవాసుల దృష్టికోణాన్ని నివేదిస్తుంది; కథకుడు వారి అన్యమత భావనను సమర్థిస్తున్నాడని చెప్పదు. వ్యక్తీకరణను దాచకుండా, నిర్దిష్ట పురాణ గుర్తింపును అతిగా నిర్ణయించకుండా అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘అతని చేతి నుంచి’ అనే అక్షరార్థ నిర్మాణం తెలుగులో జంతువు చేతి నుండి వేరై వేలాడుతోందనే అపార్థం కలిగించవచ్చు కాబట్టి, దృశ్యార్థానికి అనుగుణంగా ‘అతని చేతికి వేలాడుతూ’ వాడబడింది. ప్రధాన పాఠ్యంలోని [a], [b] గుర్తులు సంబంధిత పాదసూచికలతో సరిపోలుతున్నాయి.
