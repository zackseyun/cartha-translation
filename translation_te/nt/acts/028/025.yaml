  to: 'వారు పరస్పరం ఏకీభవించకపోవడంతో, పౌలు చివరిగా ఒక మాట[a] చెప్పిన తర్వాత వారు వెళ్లిపోవడం మొదలుపెట్టారు: “పరిశుద్ధాత్మ యెషయా ప్రవక్త ద్వారా మీ పితరులను ఉద్దేశించి సరిగ్గా పలికాడు:'
