  text: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους ἀπελύοντο, εἰπόντος τοῦ Παύλου ῥῆμα ἓν ὅτι Καλῶς τὸ πνεῦμα τὸ ἅγιον ἐλάλησεν διὰ Ἠσαΐου τοῦ προφήτου πρὸς τοὺς πατέρας ⸀ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/025.yaml
  text: 'And since they were disagreeing with one another, they were leaving after Paul had said one final word: “The Holy Spirit spoke rightly through Isaiah the prophet to your fathers'
translation:
  language: te
  text: 'వారు పరస్పరం ఏకీభవించకపోవడంతో, పౌలు చివరిగా ఒక మాట[a] చెప్పిన తర్వాత వారు వెళ్లిపోవడం మొదలుపెట్టారు: “పరిశుద్ధాత్మ యెషయా ప్రవక్త ద్వారా మీ పితరులను ఉద్దేశించి సరిగ్గా పలికాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఒక మాట” లేదా “ఒక ప్రకటన.” గ్రీకులో అక్షరార్థంగా “ఒక మాట” అని ఉంది; ఇక్కడ అది ముగింపు వ్యాఖ్యను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους
  choice: వారు ఒకరితో ఒకరు ఏకీభవించకపోవడంతో
  rationale: పరస్పర అసమ్మతి స్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కృదంత నిర్మాణాన్ని కారణార్థక ఉపవాక్యంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπελύοντο
  choice: వెళ్లిపోతున్నారు
  rationale: అసంపూర్ణ భూతకాల రూపంలో కనిపించే, సమూహం చెదరి వెళ్లిపోతున్న ప్రక్రియను నిలుపుతుంది; ‘విడిచిపెట్టబడ్డారు’ అనే అనవసర కర్మణి భావాన్ని నివారిస్తుంది.
- source_word: εἰπόντος τοῦ Παύλου
  choice: పౌలు ... చెప్పిన తర్వాత
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణాన్ని తెలుగులో సహజమైన కాలార్థక నిర్మాణంగా అనువదిస్తుంది; εἰπόντος కు ‘చెప్పిన’ సరైన సమానార్థకం.
- source_word: ῥῆμα ἓν
  choice: చివరిగా ఒక మాట
  rationale: అక్షరార్థమైన ‘ఒక మాట’ను నిలుపుతూ, సందర్భంలో అది ముగింపు వ్యాఖ్యగా పనిచేస్తున్నదని ‘చివరిగా’ ద్వారా తెలియజేస్తుంది.
- source_word: Καλῶς
  choice: సరిగానే
  rationale: పరిశుద్ధాత్మ పలికిన మాట సరైనదని పౌలు నిర్ధారిస్తున్న మూలపాఠంలోని మూల్యాంకన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: పరిశుద్ధాత్మ
  rationale: వ్యక్తిగత దైవిక సూచనను సహజమైన ప్రామాణిక తెలుగు బైబిలు పదంతో వ్యక్తం చేస్తుంది.
- source_word: ἐλάλησεν
  choice: మాట్లాడాడు
  rationale: λαλέω యొక్క ‘మాట్లాడు/పలుకు’ భావాన్ని, ప్రవక్త ద్వారా జరిగిన ప్రసంగ సందర్భంలో స్పష్టంగా అందిస్తుంది.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: యెషయా ప్రవక్త ద్వారా
  rationale: διά తో కూడిన షష్ఠీ విభక్తి సూచించే మధ్యవర్తిత్వం లేదా సాధనత్వాన్ని నేరుగా నిలుపుతుంది.
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: మీ పితరులతో
  rationale: πατέρας అనే పురుషలింగ బహువచన కుటుంబపదాన్ని నిలుపుతూ, ఇశ్రాయేలు పూర్వపితరులను సూచిస్తుంది.
theological_decisions:
- issue: ప్రవచన వాక్యంలో పరిశుద్ధాత్మ కర్తృత్వం
  choice: పరిశుద్ధాత్మ యెషయా ప్రవక్త ద్వారా ... మాట్లాడాడు
  alternative: యెషయా ప్రవక్త పరిశుద్ధాత్మ ప్రేరణతో మాట్లాడాడు
  rationale: మూలపాఠం మాటల కర్తగా పరిశుద్ధాత్మను, మధ్యవర్తిగా యెషయాను స్పష్టంగా ఉంచుతుంది; ప్రత్యామ్నాయం భావానికి సమీపమైనా వాక్యంలోని కర్తృత్వ నిర్మాణాన్ని మారుస్తుంది.
- issue: τοὺς πατέρας ὑμῶν యొక్క సూచన
  choice: మీ పితరులతో
  alternative: మీ పూర్వీకులతో
  rationale: మూలంలోని ‘తండ్రులు/పితరులు’ అనే నిర్దిష్ట పురుషలింగ పదాన్ని నిలుపుతుంది; సందర్భంలో ఇది ఇశ్రాయేలు పూర్వపితరులను సూచిస్తుంది.
- issue: Καλῶς యొక్క మూల్యాంకన బలం
  choice: సరిగానే
  alternative: చక్కగా
  rationale: ఇక్కడ పలుకుబడి శైలిని ప్రశంసించడం కంటే ప్రవచన వాక్యం సరైనదని ధృవీకరించే భావమే ప్రధానమైనది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని అసంపూర్ణ భూతకాల ప్రక్రియను ‘వెళ్లిపోతున్నారు’తో, ప్రవక్త ద్వారా పరిశుద్ధాత్మ మాట్లాడిన కర్తృత్వ నిర్మాణాన్ని యథాతథంగా నిలిపింది. వాక్యం తదుపరి వచనంలో కొనసాగే ప్రత్యక్ష ఉల్లేఖనాన్ని ప్రారంభిస్తున్నందున ముగింపు ఉద్ధరణ చిహ్నం పెట్టలేదు.
