id: ACT.28.31
reference: Acts 28:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κηρύσσων τὴν βασιλείαν τοῦ θεοῦ καὶ διδάσκων τὰ περὶ τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ πάσης παρρησίας ἀκωλύτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/031.yaml
  text: proclaiming the kingdom of God and teaching the things concerning the Lord Jesus the Messiah with all boldness[a], unhindered.
translation:
  language: te
  text: దేవుని రాజ్యాన్ని ప్రకటిస్తూ, ప్రభువైన యేసు మెస్సీయ గురించిన సంగతులను పూర్తి ధైర్యంతో[a], ఏ ఆటంకమూ లేకుండా బోధిస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువైన యేసు క్రీస్తు.” గ్రీకు Χριστός పదం “మెస్సీయ” అనే బిరుదుగా గానీ, కొన్ని సందర్భాల్లో “క్రీస్తు” అనే నామసదృశమైన రూపంగా గానీ వాడబడవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: κηρύσσων
  choice: ప్రకటిస్తూ
  rationale: కొనసాగుతున్న బహిరంగ ప్రకటనను సూచించే వర్తమాన కృదంత భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: దేవుని రాజ్యాన్ని
  rationale: βασιλείαలోని రాజ్యం మరియు పరిపాలన అనే భావవిస్తృతిని పూర్తిగా సంకుచితం చేయకుండా, తెలుగులో స్థిరంగా మరియు సహజంగా ఉన్న రూపం.
- source_word: διδάσκων
  choice: బోధిస్తూ ఉన్నాడు
  rationale: κηρύσσωνతో సమన్వయంగా పౌలు కొనసాగిస్తూ వచ్చిన కార్యాన్ని తెలియజేస్తుంది; తెలుగు వాక్యానికి అవసరమైన సమాపక క్రియను కూడా అందిస్తుంది.
- source_word: τὰ περὶ
  choice: గురించిన సంగతులను
  rationale: గ్రీకు పదబంధంలోని ‘సంబంధించిన విషయాలు’ అనే నిర్మాణాన్ని అతిగా పరామర్శించకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τοῦ κυρίου Ἰησοῦ Χριστοῦ
  choice: ప్రభువైన యేసు మెస్సీయ
  rationale: κύριοςను క్రీస్తు సంబంధిత బిరుదుగా ‘ప్రభువు’ అని, Χριστόςలోని అభిషిక్తుడు/మెస్సీయ అనే బిరుదు భావాన్ని ‘మెస్సీయ’ అని వ్యక్తపరుస్తుంది.
- source_word: μετὰ πάσης παρρησίας
  choice: పూర్తి ధైర్యంతో
  rationale: παρρησίαలోని బహిరంగ, నిర్భయ వాక్స్వాతంత్ర్య భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; πάσης తీవ్రతను ‘పూర్తి’ నిలుపుతుంది.
- source_word: ἀκωλύτως
  choice: ఏ ఆటంకమూ లేకుండా
  rationale: అపొస్తలుల కార్యముల ముగింపులోని నిర్ణాయక భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: Χριστόςను క్రీస్తు సంబంధిత బిరుదుల వరుసలో అనువదించడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστόςకు ఉన్న బిరుదు భావాన్ని పాఠకునికి వెల్లడించేందుకు ‘మెస్సీయ’ను ప్రధాన పాఠ్యంలో ఉంచాం; సంప్రదాయ నామసదృశ రూపమైన ‘క్రీస్తు’ను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకులోని రెండు సమాంతర కృదంతాలను ‘ప్రకటిస్తూ ... బోధిస్తూ ఉన్నాడు’గా నిలిపి, చివరి ἀκωλύτωςకు ముగింపు బలం ఇచ్చాం.
