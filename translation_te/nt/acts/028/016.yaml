translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘విడిగా’ అనే పదం పౌలు ఇతర ఖైదీలకు వేరుగా ఉండటాన్ని తెలియజేస్తూ, కాపలా సైనికుడు అతనితో ఉన్నాడనే వాక్యంలోని ఉద్వేగాన్ని నిలుపుతుంది.
