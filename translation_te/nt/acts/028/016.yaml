id: ACT.28.16
reference: Acts 28:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὅτε δὲ ⸀εἰσήλθομεν εἰς Ῥώμην, ⸂ἐπετράπη τῷ Παύλῳ⸃ μένειν καθ’ ἑαυτὸν σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/016.yaml
  text: When we entered Rome[a], Paul was permitted to stay by himself with the soldier guarding him.
translation:
  language: te
  text: మేము రోములో ప్రవేశించినప్పుడు[a], పౌలు తనకు కాపలా కాస్తున్న సైనికునితో కలిసి విడిగా ఉండడానికి అనుమతి పొందాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పౌలు తనకు కాపలా కాస్తున్న ఒక సైనికునితో కలిసి విడిగా నివసించడానికి అనుమతి పొందాడు.’
    reason: ‘ఉండడానికి’ అనే పదానికి ‘నివసించడానికి’ అనే సందర్భోచిత ప్రత్యామ్నాయాన్ని, అలాగే సైనికుని అనిర్దిష్టంగా వ్యక్తపరిచే సాధ్యమైన అనువాదాన్ని చూపుతుంది.
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: ప్రవేశించినప్పుడు
  rationale: ὅτε కాలసంబంధాన్ని తెలియజేస్తుంది. δέ ఇక్కడ స్వల్ప అనుసంధాన పదం మాత్రమే; సహజమైన ఆధునిక తెలుగులో దాన్ని ప్రత్యేకంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: εἰσήλθομεν εἰς Ῥώμην
  choice: మేము రోములో ప్రవేశించినప్పుడు
  rationale: εἰσέρχομαι కదలికతో లోపలికి ప్రవేశించడాన్ని సూచిస్తుంది. మొదటి పురుష బహువచనాన్ని ‘మేము’ స్పష్టంగా నిలుపుతుంది.
- source_word: ἐπετράπη τῷ Παύλῳ
  choice: పౌలు … అనుమతి పొందాడు
  rationale: గ్రీకు కర్మణి ప్రయోగం పౌలుకు అనుమతి ఇవ్వబడిందని తెలుపుతుంది. తెలుగులో ‘అనుమతి పొందాడు’ సహజంగా ఉండి అదే భావాన్ని కాపాడుతుంది.
- source_word: μένειν
  choice: ఉండడానికి
  rationale: ఈ సందర్భంలో బస చేయడం లేదా నివసించడం అనే భావం ఉంది. ‘ఉండడానికి’ అనేది కాలవ్యవధిని నిర్దిష్టం చేయకుండా సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: καθ’ ἑαυτόν
  choice: విడిగా
  rationale: ఇది ఇతర ఖైదీల నుంచి ప్రత్యేకంగా ఉండడాన్ని సూచిస్తుంది; తరువాత సైనికుడు అతనితో ఉన్నాడని చెప్పబడుతున్నందున ‘ఒంటరిగా’ అనడం అతిశయార్థాన్ని కలిగించవచ్చు.
- source_word: σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ
  choice: తనకు కాపలా కాస్తున్న సైనికునితో కలిసి
  rationale: σύν సహవాసాన్ని, φυλάσσοντι కొనసాగుతున్న కాపలా బాధ్యతను సూచిస్తాయి. గ్రీకు నిర్దిష్ట ఉపపదానికి అనుగుణంగా ‘సైనికునితో’ అని నిర్దిష్టంగా అనువదించబడింది.
