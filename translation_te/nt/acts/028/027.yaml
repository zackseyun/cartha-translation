id: ACT.28.27
reference: Acts 28:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/027.yaml
  text: For the heart of this people has become dull[a], and with their ears they heard heavily, and they closed their eyes; otherwise they might see with their eyes and hear with their ears and understand with their heart and turn back[b], and I would heal them.
translation:
  language: te
  text: ఎందుకంటే ఈ ప్రజల హృదయం మొద్దుబారిపోయింది, వారు తమ చెవులతో వినడంలో మందగించారు, తమ కళ్లను మూసుకున్నారు; లేకపోతే[a] వారు తమ కళ్లతో చూసి, తమ చెవులతో విని, తమ హృదయంతో గ్రహించి, వెనుదిరిగేవారు[b]; అప్పుడు నేను వారిని స్వస్థపరచేవాణ్ణి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు తమ కళ్లతో చూసి, తమ చెవులతో విని, తమ హృదయంతో గ్రహించి, వెనుదిరిగి, నేను వారిని స్వస్థపరచకుండా ఉండునట్లు.’ గ్రీకు μήποτε ఈ యెషయా ఉల్లేఖనంలో మరింత బలమైన ‘అలా జరగకుండునట్లు’ లేదా ‘వారు ... చేయకుండునట్లు’ అనే భావాన్ని కూడా కలిగించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘వెనుదిరిగేవారు’ను ‘తిరిగేవారు,’ ‘తిరిగి వచ్చేవారు,’ లేదా సందర్భానుసారం ‘పశ్చాత్తాపపడేవారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: మొద్దుబారిపోయింది
  rationale: అక్షరార్థంగా ‘మందంగా/లావుగా అయింది’ అనే రూపకాన్ని ఆధ్యాత్మిక స్పందనలేమి భావంతో సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: καρδία
  choice: హృదయం
  rationale: బైబిలు మానవ స్వభావ పరిభాషను నిలుపుతూ, తరువాతి ‘హృదయంతో గ్రహించి’ అన్న పదబంధంతో భావ ఐక్యతను కాపాడుతుంది.
- source_word: βαρέως ἤκουσαν
  choice: మందకొడిగా విన్నారు
  rationale: ‘భారంగా విన్నారు’ అనే అసహజ అక్షరానువాదం కాకుండా, వినికిడిలోని మందత్వాన్ని తెలియజేస్తూ మూలంలోని రూపక స్వరాన్ని సాధ్యమైనంతగా నిలుపుతుంది.
- source_word: ἐκάμμυσαν
  choice: మూసుకున్నారు
  rationale: కళ్లను మూయడం అనే క్రియను స్పష్టంగా, సహజంగా తెలుపుతుంది; కర్తల బాధ్యతను కూడా నిలుపుతుంది.
- source_word: μήποτε
  choice: లేకపోతే
  rationale: వాక్యాన్ని ఆధునిక తెలుగులో చదవదగినదిగా ఉంచుతూ, ప్రతికూల ఫలితం/ఉద్దేశం మధ్య ఉన్న మూలభాషా సందిగ్ధతను ప్రధాన పాఠ్యంలో అతిగా పరిష్కరించదు; బలమైన ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: συνῶσιν
  choice: గ్రహించి
  rationale: కేవలం సమాచారం తెలుసుకోవడం కాక లోతుగా అర్థం చేసుకోవడం అనే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπιστρέψωσιν
  choice: వెనుదిరిగేవారు
  rationale: దిశామార్పు రూపకాన్ని నిలుపుతుంది; ‘పశ్చాత్తాపపడడం’ లేదా ‘మారుమనస్సు పొందడం’ వంటి మరింత నిర్దిష్టమైన ధార్మిక వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: ἰάσομαι
  choice: నేను వారిని స్వస్థపరచేవాణ్ణి
  rationale: μήποτεతో మొదలయ్యే సంభావ్య/నిరోధిత పరిణామ శ్రేణిలో భవిష్యత్ క్రియ యొక్క భావాన్ని సహజ తెలుగు షరతు నిర్మాణంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యెషయా ఉల్లేఖనంలో దేవుని ఉద్దేశం మరియు న్యాయతీర్పు
  choice: ప్రధాన పాఠ్యంలో ‘లేకపోతే’ అని ఉంచి, బలమైన నిరోధక/ఉద్దేశార్థాన్ని పాదసూచికలో ఇవ్వడం
  alternative: ‘వారు చూడకుండా...’ లేదా ‘చూస్తారేమో’ అనే బలమైన μήποτε ప్రయోగం
  rationale: గ్రీకు పాఠ్యంలో దైవిక న్యాయతీర్పు మరియు మానవ బాధ్యత మధ్య ఉన్న ఉద్రిక్తతను ఒకే సిద్ధాంత దిశలో పరిష్కరించకుండా కాపాడుతుంది.
- issue: ἐπιστρέψωσιν యొక్క మార్పు/పరివర్తన భావం
  choice: వెనుదిరిగేవారు
  alternative: తిరిగేవారు; తిరిగి వచ్చేవారు; పశ్చాత్తాపపడేవారు
  rationale: దేవునివైపు తిరుగుదల సూచనను నిలుపుతూ, క్రియలో స్పష్టంగా లేని ప్రత్యేక మతపరమైన సాంకేతిక పదాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ‘మందకొడిగా విన్నారు’ మూలంలోని అసాధారణ రూపకాన్ని కొంత నిలుపుతుంది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో అమర్చబడింది.
