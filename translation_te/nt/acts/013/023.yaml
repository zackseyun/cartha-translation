source:
  edition: SBLGNT
  text: τούτου ὁ θεὸς ἀπὸ τοῦ σπέρματος κατ’ ἐπαγγελίαν ἤγαγεν τῷ Ἰσραὴλ ⸂σωτῆρα Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/023.yaml
  text: From this man's offspring[a], God has brought to Israel a Savior, Jesus[b], according to promise.
translation:
  language: te
  text: దేవుడు తన వాగ్దానం ప్రకారం ఈయన సంతానం నుండి ఇశ్రాయేలుకు రక్షకుడైన యేసును తీసుకువచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτου
  choice: ఈయన
  rationale: ముందటి వచనంలోని దావీదును సూచించే షష్ఠీ విభక్తి సర్వనామం. తెలుగులో ‘ఈయన సంతానం’ అనడం వ్యక్తిగత పూర్వపదాన్ని సహజంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: ἀπὸ τοῦ σπέρματος
  choice: సంతానం నుండి
  rationale: σπέρμα ఇక్కడ అక్షరార్థమైన ‘విత్తనం’ కాకుండా దావీదు వంశపరంపరను సూచిస్తుంది. ‘సంతానం’ ఆధునిక తెలుగులో సహజంగా ఉండి వంశసంబంధ భావాన్ని నిలుపుతుంది.
- source_word: κατ’ ἐπαγγελίαν
  choice: తన వాగ్దానం ప్రకారం
  rationale: ఈ పదబంధం దేవుడు చేసిన వాగ్దానానికి అనుగుణంగా జరిగిన కార్యాన్ని సూచిస్తుంది. గ్రీకులో కర్త స్పష్టంగా చెప్పబడకపోయినా సందర్భంలోని దేవునితో సంబంధం తెలుగులో సహజంగా తెలియడానికి ‘తన’ వాడబడింది; ఏ ప్రత్యేక వాగ్దానమో ప్రధాన పాఠ్యంలో విస్తరించలేదు.
- source_word: ἤγαγεν
  choice: తీసుకువచ్చాడు
  rationale: ἄγω యొక్క ప్రాథమిక భావం ‘తీసుకురావడం/నడిపించడం.’ ‘లేపాడు’ అని అనువదిస్తే పునరుత్థాన భావంతో గందరగోళం కలగవచ్చు; ‘తీసుకువచ్చాడు’ పూర్తయిన దైవకార్యాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: τῷ Ἰσραήλ
  choice: ఇశ్రాయేలుకు
  rationale: దత్తివిభక్తిని ‘ఇశ్రాయేలుకు’ అని నేరుగా అనువదించడం గ్రంథానికి సమీపంగా ఉండి, ప్రయోజనార్థక ఛాయను కూడా సహజంగా కలిగి ఉంటుంది.
- source_word: σωτῆρα
  choice: రక్షకుడైన
  rationale: σωτήρ కు క్రీస్తుసంబంధ సందర్భంలో ప్రమాణబద్ధమైన, గంభీరమైన తెలుగు సమానం ‘రక్షకుడు.’ యేసుతో అన్వయాన్ని సహజంగా చూపేందుకు ‘రక్షకుడైన’ వాడబడింది.
- source_word: Ἰησοῦν
  choice: యేసు
  rationale: వ్యక్తినామాన్ని ప్రామాణిక తెలుగు రూపంలో లిప్యంతరీకరించాం.
theological_decisions:
- issue: దావీదు వాగ్దానంతో యేసుకు ఉన్న సంబంధం
  choice: దేవుడు వాగ్దానం ప్రకారం దావీదు సంతానం నుండి యేసును ఇశ్రాయేలుకు తీసుకువచ్చాడని మాత్రమే పాఠ్యం చెబుతుంది.
  alternative: ‘దావీదుకు చేసిన వాగ్దానాన్ని నెరవేర్చుతూ’ అని మరింత స్పష్టంగా విపులీకరించడం.
  rationale: గ్రీకు పాఠ్యం దావీదు వంశసంబంధాన్ని, వాగ్దానానుగుణమైన దేవుని కార్యాన్ని కలుపుతుంది; అయితే వాగ్దానపు స్వరూపాన్ని ఇక్కడ స్వయంగా విపులీకరించదు. అందువల్ల వివరణాత్మక సిద్ధాంతాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యే సహజమైన వాక్యనిర్మాణంతో పాటు బైబిలు సందర్భానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, వాగ్దానం దేవుని కార్యాన్ని విశేషిస్తుందని స్పష్టమయ్యేలా తెలుగు పదక్రమం అమర్చబడింది.
