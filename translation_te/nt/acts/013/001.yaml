id: ACT.13.1
reference: Acts 13:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἦσαν ⸀δὲ ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν προφῆται καὶ διδάσκαλοι ὅ τε Βαρναβᾶς καὶ Συμεὼν ὁ καλούμενος Νίγερ, καὶ Λούκιος ὁ Κυρηναῖος, Μαναήν τε Ἡρῴδου τοῦ τετραάρχου σύντροφος καὶ Σαῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/001.yaml
  text: 'In Antioch[a], in the church there, there were prophets and teachers: Barnabas, Simeon who was called Niger, Lucius the Cyrenian, Manaen, a close companion of Herod the tetrarch[c][b], and Saul.'
translation:
  language: te
  text: 'అంతియొకయలోని సంఘంలో ప్రవక్తలూ బోధకులూ ఉన్నారు: బర్నబా, నీగెరు అని పిలువబడిన సిమ్యోను[a], కురేనీయుడైన లూకియ[b], చతుర్థాధిపతియైన హేరోదుతో కలిసి పెరిగిన మనయేను[c], సౌలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నీగెరు” అనే లాటిన్ పేరుకు “నలుపు” అని అర్థం. ఇక్కడ దాన్ని అనువదించకుండా వ్యక్తినామంగానే ఉంచాం.
    reason: lexical_alternative
  - marker: b
    text: అంటే, లూకియ ఉత్తర ఆఫ్రికాలోని కురేనె పట్టణానికి చెందినవాడు.
    reason: cultural_note
  - marker: c
    text: లేదా “చతుర్థాధిపతియైన హేరోదు పాల సోదరుడైన మనయేను,” లేదా “చతుర్థాధిపతియైన హేరోదుతో పెంచబడిన మనయేను.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: ఉన్నారు
  rationale: Ἦσαν ఉనికిని తెలిపే ప్రధాన క్రియ. δέ స్వల్ప అనుసంధాన పదం; సందర్భ ప్రవాహం తెలుగులో సహజంగానే వ్యక్తమవుతున్నందున ప్రత్యేకంగా ‘అప్పుడు’ లేదా ‘అయితే’ అని జోడించలేదు.
- source_word: ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν
  choice: అంతియొకయలోని సంఘంలో
  rationale: అంతియొకయలో ఉన్న స్థానిక క్రైస్తవ సమాజాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది; గ్రీకు కృదంతాన్ని అనవసరంగా పదేపదే అనుకరించదు.
- source_word: προφῆται καὶ διδάσκαλοι
  choice: ప్రవక్తలూ బోధకులూ
  rationale: సంఘంలోని రెండు గుర్తింపబడిన సేవా పాత్రలను నేరుగా, సిద్ధాంతపరమైన అదనపు భావాలు లేకుండా తెలియజేస్తుంది.
- source_word: Συμεὼν ὁ καλούμενος Νίγερ
  choice: నీగెరు అని పిలువబడిన సుమెయోను
  rationale: Συμεώνను ‘సీమోను’తో కలపకుండా సుమెయోను అని లిప్యంతరీకరించింది. Νίγερ‌ను అర్థానువాదం చేయకుండా వ్యక్తినామంగా నిలిపింది.
- source_word: Λούκιος ὁ Κυρηναῖος
  choice: కురేనీయుడైన లూకియ
  rationale: కురేనె పట్టణానికి చెందినవాడనే భౌగోళిక గుర్తింపును సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: Ἡρῴδου τοῦ τετραάρχου
  choice: చతుర్థాధిపతియైన హేరోదు
  rationale: గ్రీకు పాఠంలోని అధికార బిరుదును నిలిపి, పాఠంలో లేని ‘అంతిప’ అనే చారిత్రక పేరును చేర్చలేదు.
- source_word: σύντροφος
  choice: తో కలిసి పెరిగిన
  rationale: ఈ పదం సాధారణంగా ఒకరితో పాటు పెంచబడిన లేదా పెరిగిన సంబంధాన్ని సూచిస్తుంది. ‘పాల సోదరుడు’ వంటి మరింత నిర్దిష్టమైన సామాజిక సంబంధాన్ని నిర్బంధించకుండా మూలార్థాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: అంతియొకయ సంఘంలోని సేవా పాత్రల స్వభావం
  choice: προφῆται καὶ διδάσκαλοι అనే పదాలను ‘ప్రవక్తలూ బోధకులూ’ అని నేరుగా అనువదించడం
  alternative: వీటిని తరువాతి కాలపు నిర్దిష్ట సంఘాధికార పదవులుగా వివరించడం
  rationale: వాక్యం ఈ వ్యక్తులను ప్రవక్తలు, బోధకులు అని గుర్తిస్తుంది గాని తరువాతి సంస్థాగత హోదాల నిర్మాణాన్ని నిర్వచించదు.
- issue: మనయేనుకు హేరోదుతో ఉన్న సంబంధం
  choice: ‘హేరోదుతో కలిసి పెరిగిన’
  alternative: ‘హేరోదు పాల సోదరుడు’ లేదా ‘హేరోదుకు సన్నిహిత సహచరుడు’
  rationale: σύντροφος ఉమ్మడి పెంపకాన్ని సూచించగలదు; అయితే అది పాల సోదరత్వాన్నే తప్పనిసరిగా నిర్ధారించదు. ఎంపిక చేసిన రూపం ఈ అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: సరళమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. వ్యక్తి, స్థలనామాలకు తెలుగు బైబిలు పాఠకులకు పరిచితమైన రూపాలు ఎంచుకోబడ్డాయి. జాబితా స్పష్టత కోసం మొదటి వాక్యం తరువాత ‘వారు’తో పేర్లను పరిచయం చేశాం; మూలంలోని సమాచారాన్ని మార్చలేదు.
