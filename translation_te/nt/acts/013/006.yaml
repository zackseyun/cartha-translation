id: ACT.13.6
reference: Acts 13:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διελθόντες δὲ ⸀ὅλην τὴν νῆσον ἄχρι Πάφου εὗρον ⸀ἄνδρα τινὰ μάγον ψευδοπροφήτην Ἰουδαῖον ᾧ ὄνομα ⸀Βαριησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/006.yaml
  text: And after they had gone through the whole island as far as Paphos[a], they found a certain man, a magician, a false prophet, a Jew, whose name was Bar-Jesus.
translation:
  language: te
  text: వారు ద్వీపమంతటా ప్రయాణించి పాఫోసు వరకు వెళ్లిన తరువాత, బార్-యేసు[a] అనే ఒక వ్యక్తిని కనుగొన్నారు. అతడు మాంత్రికుడు, అబద్ధ ప్రవక్త, యూదుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: బార్-యేసు అనే పేరును బార్యేసు అని కూడా రాయవచ్చు. ఇది బహుశా “యేసు కుమారుడు” లేదా “యెహోషువ కుమారుడు” అనే అర్థమిచ్చే సెమిటిక్ పితృనామ రూపం.
    reason: వ్యక్తిపేరు యొక్క ప్రత్యామ్నాయ రచనను, సంభావ్య వ్యుత్పత్తిని తెలియజేయడం; అనిశ్చిత అర్థాన్ని ప్రధాన పాఠంలో ఖరారు చేయకుండా ఉంచడం.
lexical_decisions:
- source_word: διελθόντες
  choice: ప్రయాణించి ... వెళ్లిన తరువాత
  rationale: ప్రధాన క్రియ εὗρον కంటే ముందుగా పూర్తయిన ప్రయాణాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ప్రయాణ విధానాన్ని అదనంగా ఊహించదు.
- source_word: δὲ
  choice: వాక్యాన్ని ముందరి కథనంతో సహజంగా కొనసాగించడం
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక, కథనాన్ని ముందుకు నడిపించే స్వల్ప అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో ప్రత్యేక సంధిపదం లేకుండానే ఆ సంబంధం సహజంగా వ్యక్తమవుతుంది.
- source_word: ὅλην τὴν νῆσον
  choice: ద్వీపమంతటా
  rationale: ద్వీపం అంతటా సాగిన ప్రయాణ విస్తారాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἄχρι Πάφου
  choice: పాఫోసు వరకు
  rationale: ἄχρι సూచించే భౌగోళిక గమ్యపరిమితిని స్పష్టంగా నిలుపుతుంది.
- source_word: εὗρον
  choice: కనుగొన్నారు
  rationale: సాధారణ కథన క్రియలోని కనుగొనడం లేదా తారసపడడం అనే భావాన్ని అదనపు వ్యాఖ్యానం లేకుండా అందిస్తుంది.
- source_word: ἄνδρα τινὰ
  choice: ఒక వ్యక్తిని
  rationale: τινά లోని అనిర్దిష్టతను ‘ఒక’ నిలుపుతుంది; ఆధునిక తెలుగులో ‘ఒకానొక మనిషి’ కంటే ‘ఒక వ్యక్తి’ సహజంగా ఉంటుంది.
- source_word: μάγον
  choice: మాంత్రికుడు
  rationale: ఈ సందర్భంలో క్షుద్ర లేదా గూఢ విద్యలను ఆచరించే వ్యక్తిని సూచిస్తుంది. ‘మాంత్రికుడు’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతూ, ‘క్షుద్రవాది’ వంటి మరింత బలమైన వ్యాఖ్యానాన్ని మోపదు.
- source_word: ψευδοπροφήτην
  choice: అబద్ధ ప్రవక్త
  rationale: ప్రవక్తననే మతపరమైన దావాను, ఆ దావా అసత్యమనే మూలపాఠ భావాన్ని రెండింటినీ పారదర్శకంగా నిలుపుతుంది.
- source_word: Ἰουδαῖον
  choice: యూదుడు
  rationale: ఈ సందర్భంలో వ్యక్తి యొక్క యూద గుర్తింపును సూచిస్తుంది; ప్రత్యేకంగా యూదయ ప్రాంతవాసి అనే భౌగోళిక భావం అవసరం లేదు.
- source_word: ᾧ ὄνομα Βαριησοῦ
  choice: బార్-యేసు అనే
  rationale: తెలుగులో పేరు పరిచయం చేసే సహజ నిర్మాణాన్ని వాడింది. పేరును అర్థానువాదం చేయకుండా లిప్యంతరీకరించింది; హైఫన్ ‘బార్’ అనే పితృనామ భాగాన్ని గుర్తించడానికి సహాయపడుతుంది.
theological_decisions:
- issue: Βαριησοῦ అనే వ్యక్తిపేరు అనువాదం
  choice: బార్-యేసు
  alternative: బార్యేసు; ‘యేసు కుమారుడు’ లేదా ‘యెహోషువ కుమారుడు’
  rationale: మూలపాఠంలో ఇది వ్యక్తిపేరుగా పనిచేస్తున్నందున అర్థానువాదం చేయకుండా లిప్యంతరీకరించబడింది. దాని సంభావ్య సెమిటిక్ అర్థాన్ని ప్రధాన పాఠంలో ఖరారు చేయకుండా పాదటిప్పణిలో ఉంచడం ద్వారా ఉన్న అనిశ్చితి నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. గ్రీకు వాక్యంలోని వరుస విశేషణాలను తెలుగులో స్పష్టత కోసం రెండవ వాక్యంగా అమర్చినా, వాటి భావం మరియు క్రమం నిలుపబడ్డాయి.
