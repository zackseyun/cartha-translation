id: ACT.13.10
reference: Acts 13:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν· Ὦ πλήρης παντὸς δόλου καὶ πάσης ῥᾳδιουργίας, υἱὲ διαβόλου, ἐχθρὲ πάσης δικαιοσύνης, οὐ παύσῃ διαστρέφων τὰς ⸀ὁδοὺς κυρίου τὰς εὐθείας;
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/010.yaml
  text: And he said[a], “You who are full of every kind of deceit and every kind of villainy, son of the devil, enemy of all righteousness, will you not stop twisting the straight ways of the Lord?”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “సకల మోసంతోను సమస్త దుర్మార్గంతోను నిండినవాడా, అపవాది కుమారుడా, సమస్త నీతికి శత్రువా![a] ప్రభువు యొక్క నేరైన మార్గాలను వక్రీకరించడం మానవా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమస్త న్యాయానికి శత్రువా!” సందర్భాన్ని బట్టి గ్రీకు పదం నీతిని లేదా న్యాయాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης παντὸς δόλου
  choice: సకల మోసంతో నిండినవాడా
  rationale: πλήρης + షష్ఠీ విభక్తి ఒక లక్షణంతో పూర్తిగా నిండియుండడాన్ని సూచిస్తుంది. δόλοςలోని మోసం, కపటం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘మోసం’ తెలియజేస్తుంది; ‘సకల’ παντός యొక్క సమగ్ర భావాన్ని నిలుపుతుంది.
- source_word: πάσης ῥᾳδιουργίας
  choice: సమస్త దుర్మార్గంతో
  rationale: ῥᾳδιουργία సాధారణ చెడుకంటే నీతినియమాలు లేని కుటిలమైన దుష్ప్రవర్తనను సూచిస్తుంది. ‘దుర్మార్గం’ ఆ తీవ్రమైన నైతిక నిందను తెలియజేస్తూ ‘మోసం’తో కలిసిపోకుండా వేరుగా నిలుస్తుంది.
- source_word: υἱὲ διαβόλου
  choice: అపవాది కుమారుడా
  rationale: υἱέను అక్షరార్థానికి దగ్గరగా ‘కుమారుడా’ అని అనువదించడం ద్వారా నైతిక పోలిక లేదా సంబంధాన్ని తెలిపే బైబిలు నుడికారపు తీవ్రత నిలుస్తుంది. διάβολοςకు సంప్రదాయబద్ధంగా, స్పష్టంగా ‘అపవాది’ వాడబడింది.
- source_word: ἐχθρὲ πάσης δικαιοσύνης
  choice: సమస్త నీతికి శత్రువా
  rationale: δικαιοσύνη ఇక్కడ నైతికంగా సరైనదానిని, యథార్థమైనదానిని సూచిస్తుంది కాబట్టి ప్రధాన పాఠ్యంలో ‘నీతి’ సహజంగా సరిపోతుంది. ‘న్యాయం’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: οὐ παύσῃ
  choice: మానవా?
  rationale: భవిష్యత్ మధ్యమ నిర్దేశక రూపం ఇక్కడ మందలింపుతో కూడిన అలంకార ప్రశ్నగా పనిచేస్తుంది. ముందున్న క్రియానామంతో ‘వక్రీకరించడం మానవా?’ అనడం ఆ సవాలు చేసే ప్రశ్నను సహజ తెలుగులో నిలుపుతుంది.
- source_word: διαστρέφων
  choice: వక్రీకరించడం
  rationale: διαστρέφω నేరుగా ఉన్నదాన్ని తిప్పడం, వక్రం చేయడం లేదా చెడగొట్టడం అనే భావం ఇస్తుంది. ‘వక్రీకరించడం’ మార్గాల రూపకాన్ని మరియు నైతిక భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: τὰς ὁδοὺς κυρίου τὰς εὐθείας
  choice: ప్రభువు సరళమైన మార్గాలను
  rationale: ὁδοίకి ‘మార్గాలు’ అక్షరార్థం, రూపకార్థం రెండింటికీ సరిపోతుంది. εὐθείαςలోని straight భావాన్ని ‘సరళమైన’ నిలుపుతుంది; κύριοςను ‘ప్రభువు’గా అనువదించాం.
- source_word: Ὦ
  choice: నిండినవాడా … కుమారుడా … శత్రువా
  rationale: Ὦ బలమైన ప్రత్యక్ష సంబోధనను సూచిస్తుంది. తెలుగులో కృత్రిమమైన ప్రత్యేక ఉద్గార పదం చేర్చకుండా వరుస సంబోధనలలోని ‘-ఆ’ రూపాలు ఆ తీవ్రతను సహజంగా వ్యక్తం చేస్తాయి.
theological_decisions:
- issue: δικαιοσύνη యొక్క అనువాదం
  choice: నీతి
  alternative: న్యాయం
  rationale: ఈ సందర్భంలో పౌలు ఎదిరిస్తున్నది నైతికంగా సరైనదంతటికీ ఉన్న విరోధం; అందువల్ల ‘నీతి’ ప్రధాన భావాన్ని బాగా అందిస్తుంది. అయితే δικαιοσύνηకి ‘న్యాయం’ అనే భావం కూడా సాధ్యమైనందున దానిని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, నేరుగా మందలించే స్వరం వాడబడింది. మూలంలోని వరుస సంబోధనలను చిన్న ఉద్గార వాక్యాలుగా ఉంచి వాక్యబలాన్ని నిలిపాం; అనవసరంగా ప్రాచీనంగా వినిపించే రూపాలను నివారించాం.
