id: ACT.13.7
reference: Acts 13:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς ἦν σὺν τῷ ἀνθυπάτῳ Σεργίῳ Παύλῳ, ἀνδρὶ συνετῷ. οὗτος προσκαλεσάμενος Βαρναβᾶν καὶ Σαῦλον ἐπεζήτησεν ἀκοῦσαι τὸν λόγον τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/007.yaml
  text: who was with the proconsul Sergius Paulus[a], an intelligent man[b]. This man summoned Barnabas and Saul and sought to hear the word of God.
translation:
  language: te
  text: అతడు వివేకవంతుడైన[a] ప్రోకాన్సల్ సెర్గియస్ పౌలుతో కలిసి ఉండేవాడు. ఈ ప్రోకాన్సల్ బర్నబాను, సౌలును తన వద్దకు పిలిచి, దేవుని వాక్యాన్ని[b] వినాలని కోరాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తెలివిగల” లేదా “గ్రహణశక్తిగల.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “దేవుని సందేశాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθυπάτῳ
  choice: ప్రోకాన్సల్
  rationale: ఇది సాధారణ పాలకుడిని కాక, రోమా పరిపాలనలోని నిర్దిష్ట అధికార హోదాను సూచిస్తుంది; అందువల్ల ఆ హోదాను లిప్యంతరీకరించడం చారిత్రక కచ్చితత్వాన్ని కాపాడుతుంది.
- source_word: σὺν
  choice: కలిసి ఉండేవాడు
  rationale: ఇక్కడ వ్యక్తిగత సహవాసం లేదా అనుబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀνδρὶ συνετῷ
  choice: వివేకవంతుడైన
  rationale: συνετός లోని గ్రహణశక్తి, తెలివి, వివేకం అనే భావాలను ‘వివేకవంతుడు’ సహజంగా అందిస్తుంది; ఇది నైతిక సద్గుణాన్ని అతిగా ప్రకటించదు.
- source_word: οὗτος
  choice: ఈ ప్రోకాన్సల్
  rationale: మధ్యలో వచ్చిన వివరణ తరువాత సెర్గియస్ పౌలును మళ్లీ స్పష్టంగా సూచించి, గ్రీకు నిర్దేశక సర్వనామంలోని స్వల్ప ఉద్ఘాటనను నిలుపుతుంది.
- source_word: προσκαλεσάμενος
  choice: తన దగ్గరికి పిలిపించి
  rationale: బర్నబా, సౌలులను తన సమక్షానికి పిలిచిన అధికారిక చొరవను తెలుగులో స్పష్టంగా తెలియజేస్తుంది; బలవంతపు భావాన్ని అనవసరంగా చేర్చదు.
- source_word: ἐπεζήτησεν
  choice: కోరాడు
  rationale: వినాలనే ఉద్దేశపూర్వకమైన ఆకాంక్షను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀκοῦσαι
  choice: వినాలని
  rationale: సందేశాన్ని స్వయంగా వినాలనే భావాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λόγον τοῦ θεοῦ
  choice: దేవుని వాక్యం
  rationale: గ్రీకు పదబంధ రూపాన్ని కాపాడుతూ, ప్రకటించబడే దేవుని సందేశాన్ని సూచించే పరిచితమైన బైబిలు వ్యక్తీకరణను ఉపయోగిస్తుంది.
- source_word: Σεργίῳ Παύλῳ
  choice: సెర్గియస్ పౌలు
  rationale: వ్యక్తి పేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: బర్నబాను, సౌలును
  rationale: వ్యక్తి పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, విభక్తి ప్రత్యయాలను సహజంగా చేర్చింది.
theological_decisions:
- issue: λόγον τοῦ θεοῦ పదబంధం
  choice: దేవుని వాక్యం
  alternative: దేవుని సందేశం
  rationale: ‘దేవుని సందేశం’ సందర్భార్థాన్ని స్పష్టం చేసినా, ‘దేవుని వాక్యం’ మూలపదబంధానికి మరింత పారదర్శకంగా ఉండి, అదనపు సిద్ధాంతార్థాన్ని చేర్చకుండా దాని బైబిలు ప్రతిధ్వనిని నిలుపుతుంది.
- issue: సెర్గియస్ పౌలును వర్ణించే συνετῷ భావం
  choice: వివేకవంతుడైన
  alternative: తెలివిగల / అవగాహనగల
  rationale: ఈ పదం గ్రహణశక్తి లేదా వివేకాన్ని సూచిస్తుంది; అతనికి ప్రత్యేక ఆధ్యాత్మిక స్థితి లేదా సంపూర్ణ నైతిక సద్గుణం ఉందని అనవసరంగా ప్రకటించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. ‘ప్రోకాన్సల్’ అనే నిర్దిష్ట రోమా అధికార హోదా చారిత్రక కచ్చితత్వం కోసం నిలుపబడింది. ముందున్న వచనంలోని వ్యక్తిని సూచించే ‘అతడు’ను అలాగే ఉంచి, οὗτος ఎవరిని సూచిస్తుందో సందిగ్ధత రాకుండా ‘ఈ ప్రోకాన్సల్’ అని అనువదించబడింది.
