id: ACT.13.31
reference: Acts 13:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς ὤφθη ἐπὶ ἡμέρας πλείους τοῖς συναναβᾶσιν αὐτῷ ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ, οἵτινες ⸀νῦν εἰσὶ μάρτυρες αὐτοῦ πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/031.yaml
  text: He appeared for many days to those who had gone up with him from Galilee to Jerusalem[b][a], who are now his witnesses to the people.
translation:
  language: te
  text: ఆయన అనేక రోజులపాటు తనతో కలిసి గలిలయ నుండి యెరూషలేముకు వెళ్లినవారికి కనిపించాడు[a]. వారే ఇప్పుడు ప్రజలకు[b] ఆయన సాక్షులుగా ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అనేక రోజులపాటు ఆయనను చూశారు.’ పునరుత్థాన ప్రత్యక్షతల సందర్భంలో గ్రీకు క్రియను ‘కనిపించాడు’కు బదులుగా ఇలా మరింత రూపానుసారంగా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘ప్రజలు’ అనే మాట సందర్భానుసారంగా ప్రత్యేకంగా యూద ప్రజలను, అంటే ఇశ్రాయేలును, సూచించే అవకాశం ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς
  choice: ఆయన
  rationale: ఈ సంబంధ సర్వనామం ముందటి వచనంలోని యేసును సూచిస్తుంది. తెలుగులో వాక్యారంభంలో ‘ఆయన’ అని మళ్లీ పేర్కొనడం సహజంగా ఉండి, మూలంలోని సూచనను స్పష్టంగా ఉంచుతుంది.
- source_word: ὤφθη
  choice: కనిపించాడు
  rationale: ὁράω క్రియ యొక్క ఈ రూపం పునరుత్థాన ప్రత్యక్షతల సందర్భంలో సాధారణంగా ‘కనిపించాడు/ప్రత్యక్షమయ్యాడు’ అనే భావాన్ని ఇస్తుంది. ‘కనిపించాడు’ మూలంలోని చూడబడటం అనే భావాన్ని సహజ తెలుగులో కాపాడుతుంది.
- source_word: ἐπὶ ἡμέρας πλείους
  choice: అనేక రోజులపాటు
  rationale: ఇక్కడ కాలవ్యాప్తి వ్యక్తమవుతోంది; ‘అనేక రోజులపాటు’ సహజమైనదీ మూలానికి నమ్మకమైనదీ.
- source_word: τοῖς συναναβᾶσιν αὐτῷ
  choice: తనతో కలిసి ... వెళ్లినవారికి
  rationale: ఈ కృదంతం ఆయనతో ప్రయాణించినవారిని సూచిస్తుంది. ‘కలిసి’ సహప్రయాణ భావాన్ని నిలుపుతుంది; గలిలయ నుండి యెరూషలేముకు వెళ్లడాన్ని తరువాతి భౌగోళిక పదబంధంతో కలిపి సహజంగా చెప్పాం.
- source_word: ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ
  choice: గలిలయ నుండి యెరూషలేముకు
  rationale: ప్రయాణ ఆరంభస్థలం, గమ్యస్థలాన్ని నేరుగా తెలియజేసే అనువాదం.
- source_word: οἵτινες νῦν εἰσὶν
  choice: వారే ఇప్పుడు ... ఉన్నారు
  rationale: οἵτινες ఆ గుంపునే ప్రస్తుత సాక్షులుగా గుర్తిస్తుంది. ‘వారే’ ఆ గుర్తింపు బలాన్ని, ‘ఇప్పుడు’ νῦν యొక్క కాలసూచనను తెలియజేస్తాయి.
- source_word: μάρτυρες αὐτοῦ
  choice: ఆయన సాక్షులుగా
  rationale: ఇది వారు ఆయనకు చెందినవారిగా, ఆయనను గూర్చి సాక్ష్యమిచ్చేవారిగా ఉన్న సంబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది; జనిటివ్ సంబంధాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: πρὸς τὸν λαόν
  choice: ప్రజలకు
  rationale: πρός ఇక్కడ సాక్ష్యం ఉద్దేశించబడిన శ్రోతల దిశను సూచిస్తుంది. తెలుగులో ‘ప్రజలకు’ ఈ పాత్రను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λαόν
  choice: ప్రజలు
  rationale: సందర్భంలో ఇది ఇశ్రాయేలు లేదా యూద ప్రజలను సూచించే అవకాశమున్నా, గ్రీకు మూలం కేవలం ‘ప్రజలు’ అంటుంది. అందువల్ల ప్రధాన పాఠంలో ఆ సాధారణ పదాన్నే ఉంచాం.
theological_decisions:
- issue: పునరుత్థాన ప్రత్యక్షత భాష స్వరూపం
  choice: కనిపించాడు
  alternative: కనిపించబడ్డాడు / ఆయనను చూశారు
  rationale: ఈ సందర్భం పునరుత్థానమైన యేసు నియమిత సాక్షులకు కనిపించడాన్ని చెబుతుంది. ‘కనిపించాడు’ చారిత్రక సాక్ష్య భావాన్ని తగ్గించకుండా సహజంగా వ్యక్తం చేస్తుంది; మూలంలోని రూపానికి దగ్గరైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: ‘ప్రజలు’ అనే పదం పరిధి
  choice: ప్రజలు
  alternative: ఇశ్రాయేలు ప్రజలు / యూద ప్రజలు
  rationale: సందర్భం ఇశ్రాయేలు లేదా యూద ప్రజలను బలంగా సూచించినప్పటికీ, మూలంలో ఆ వివరణ స్పష్టంగా జోడించబడలేదు. అందుకే ప్రధాన పాఠంలో అసలు పదం యొక్క విస్తృత రూపాన్ని నిలిపి, సందర్భసూచనను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. దీర్ఘ గ్రీకు సంబంధ వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి, ‘వారే’ ద్వారా సంబంధాన్ని నిలిపాం. ‘యెరూషలేము’ వంటి సాధారణ తెలుగు బైబిలు స్థలనామ రూపాన్ని ఉపయోగించాం.
