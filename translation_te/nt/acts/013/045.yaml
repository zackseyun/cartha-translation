    issue: The verbal aspect and syntactic relation of ἀντέλεγον and βλασφημοῦντες are weakened.
    rationale: ‘ఎదురు మాట్లాడుతూ దూషణ మాటలు పలికారు’ presents the latter as a separate perfective event and leaves the former somewhat general. The Greek imperfect ἀντέλεγον with the participle βλασφημοῦντες depicts ongoing contradiction accompanied by blasphemous/abusive speech.
  revised_text: అయితే యూదులు జనసమూహాలను చూసినప్పుడు[a], అసూయతో[b] నిండిపోయి, పౌలు చెబుతున్న విషయాలను[c] ఖండిస్తూ, దూషిస్తూ ఉండేవారు.
