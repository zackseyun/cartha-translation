id: ACT.13.45
reference: Acts 13:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ Ἰουδαῖοι τοὺς ὄχλους ἐπλήσθησαν ζήλου καὶ ἀντέλεγον τοῖς ⸀ὑπὸ Παύλου ⸀λαλουμένοις ⸀βλασφημοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/045.yaml
  text: But when the Jews saw the crowds[a], they were filled with jealousy and began contradicting what was spoken by Paul[c][b], blaspheming.
translation:
  language: te
  text: అయితే యూదులు జనసమూహాలను చూసినప్పుడు[a], అసూయతో[b] నిండిపోయి, పౌలు చెబుతున్న విషయాలను[c] ఖండిస్తూ, దూషిస్తూ ఉండేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘యూదులు’ అంటే ఈ సంఘటనలో పౌలును ఎదిరించిన స్థానిక యూదు సమూహం; యూదు ప్రజలందరూ అని కాదు.
    reason: cultural_note
  - marker: b
    text: లేదా ‘ఉత్సాహంతో’; అయితే ఇక్కడి సందర్భం ప్రతికూలమైన ‘అసూయ’ అనే అర్థానికే అనుకూలంగా ఉంది.
    reason: lexical_alternative
  - marker: c
    text: 'మరొక విధంగా: ‘పౌలు చెప్పిన మాటలను.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: చూసినప్పుడు
  rationale: అనంతర ప్రధాన చర్యకు కాలసంబంధాన్ని చూపే aorist participleను సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా అనువదించింది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వచనంలోని సానుకూల స్పందనకు విరుద్ధమైన కథన మలుపును మృదువుగా సూచిస్తుంది.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: మూలపాఠంలోని సాధారణ జాతి/సమూహ సూచనను నిలుపుతుంది; ‘నాయకులు’ అని మూలంలో లేని పరిమితిని చేర్చదు. సందర్భపరమైన పరిధిని పాదసూచిక వివరిస్తుంది.
- source_word: τοὺς ὄχλους
  choice: జనసమూహాలను
  rationale: గ్రీకులోని బహువచనాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: ἐπλήσθησαν ζήλου
  choice: అసూయతో నిండిపోయి
  rationale: ζῆλος‌కు ‘ఉత్సాహం’ అనే అర్థం కూడా ఉన్నప్పటికీ, జనసమూహాలను చూసిన తరువాత కలిగిన వ్యతిరేకత మరియు దూషణ అనే సందర్భం ప్రతికూలమైన ‘అసూయ’ భావాన్ని బలపరుస్తుంది; ‘నిండిపోయి’ అనే రూపం గ్రీకు నుడికారాన్ని నిలుపుతుంది.
- source_word: ἀντέλεγον
  choice: ఎదురు మాట్లాడుతూ
  rationale: imperfect రూపంలోని కొనసాగుతున్న వ్యతిరేక చర్యను సహజంగా వ్యక్తం చేస్తుంది; పౌలు మాటలను కేవలం విశ్లేషణాత్మకంగా ‘ఖండించారు’ అనడం కంటే మాటలతో ప్రతిఘటించిన భావాన్ని నిలుపుతుంది.
- source_word: τοῖς ὑπὸ Παύλου λαλουμένοις
  choice: పౌలు చెప్పిన మాటలకు
  rationale: articular passive participle సూచించే పౌలు పలికిన విషయాన్ని తెలుగులో సహజమైన నామవాచక పదబంధంగా అందిస్తుంది. కర్తగా పౌలును స్పష్టంగా ఉంచినా భావాన్ని మార్చదు.
- source_word: βλασφημοῦντες
  choice: దూషణ మాటలు పలికారు
  rationale: తోడు చర్య/రీతిని తెలిపే participleను ముందున్న ‘ఎదురు మాట్లాడుతూ’తో అనుసంధానిస్తుంది. దూషణ ఎవరిని లక్ష్యంగా చేసిందో మూలపాఠం చెప్పనందున ‘దైవదూషణ’ అని అతిగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: οἱ Ἰουδαῖοι అనే పదబంధాన్ని యూదులందరిపై సాధారణ నిందగా చదివే అవకాశం
  choice: యూదులు
  alternative: యూదు నాయకులు / యూదయులు
  rationale: గ్రీకు పాఠం ‘నాయకులు’ అని పరిమితం చేయదు కాబట్టి మూలంలోని పదాన్ని నిలిపింది. అయితే ఇది ఈ సంఘటనలో పౌలును ఎదిరించిన స్థానిక యూదు సమూహాన్ని సూచిస్తుందని పాదసూచిక స్పష్టం చేస్తుంది; యూదు ప్రజలందరినీ నిందించే భావాన్ని చేర్చదు.
- issue: βλασφημοῦντες యొక్క లక్ష్యం
  choice: దూషణ మాటలు పలికారు
  alternative: దైవదూషణ చేశారు
  rationale: పదానికి దైవదూషణ అనే బలమైన భావం ఉండగలదు; అయితే ఈ వాక్యంలో దూషణకు గురైన వ్యక్తి లేదా విషయం స్పష్టంగా పేర్కొనబడలేదు. అందువల్ల ఆ అస్పష్టతను నిలుపుతూ చర్య తీవ్రతను తెలియజేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని చర్యల క్రమం, బహువచనం, ζῆλος‌లోని అర్థసంభావ్యత, βλασφημοῦντες లక్ష్యంలోని అస్పష్టత నిలుపబడ్డాయి.
