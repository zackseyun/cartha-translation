id: ACT.13.16
reference: Acts 13:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Παῦλος καὶ κατασείσας τῇ χειρὶ εἶπεν· Ἄνδρες Ἰσραηλῖται καὶ οἱ φοβούμενοι τὸν θεόν, ἀκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/016.yaml
  text: So Paul stood up[a], and motioning with his hand said, “Men of Israel and you who fear God, listen.”
translation:
  language: te
  text: 'అప్పుడు పౌలు లేచి, చేతితో సైగ చేసి ఇలా అన్నాడు: “ఇశ్రాయేలు పురుషులారా, దేవునికి భయపడేవారలారా,[a] వినండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవభయస్థులారా.” ఈ మాటలు దేవునికి భయపడేవారిని సూచిస్తున్నాయి; బహుశా వీరు సమాజమందిరంతో అనుబంధమున్న అన్యజన ఆరాధకులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: లేచి
  rationale: ఇక్కడ ἀνίστημι యొక్క భూతకాల క్రియావిశేషణ రూపం పౌలు మాట్లాడే ముందు చేసిన శారీరక చర్యను సూచిస్తుంది. ‘లేచి’ అనేది సహజమైన ఆధునిక తెలుగు.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక కథన పురోగతిని సూచిస్తుంది. ‘అప్పుడు’ ఆ ప్రవాహాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: κατασείσας τῇ χειρὶ
  choice: చేతితో సైగ చేసి
  rationale: మాట్లాడే ముందు శ్రోతల దృష్టిని ఆకర్షించడానికి లేదా నిశ్శబ్దంగా ఉండమని సూచించడానికి చేసిన చేతి సంజ్ఞను ఇది తెలియజేస్తుంది; ‘సైగ చేసి’ అనవసరంగా ‘చేయి ఊపాడు’ అనే భావాన్ని కలిగించదు.
- source_word: εἶπεν
  choice: ఇలా అన్నాడు
  rationale: ప్రత్యక్ష సంభాషణను పరిచయం చేసే సాధారణ కథన ప్రయోగం; ‘ఇలా’ తరువాత వచ్చే మాటలతో సహజంగా కలుపుతుంది.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: ఇశ్రాయేలు పురుషులారా
  rationale: ἄνδρες అనే పుంలింగ సంబోధనను, Ἰσραηλῖται అనే గుర్తింపును రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: οἱ φοβούμενοι τὸν θεόν
  choice: దేవునికి భయపడే వారలారా
  rationale: క్రియావిశేషణ రూపంలోని ‘దేవునికి భయపడే’ అనే భావాన్ని నిలుపుతూ, సాంకేతిక బిరుదుగా మార్చకుండా ప్రత్యక్ష సంబోధనగా అందిస్తుంది.
- source_word: ἀκούσατε
  choice: వినండి
  rationale: శ్రద్ధగా వినమని పిలిచే ఆజ్ఞార్థక రూపానికి సహజమైన, గంభీరమైన తెలుగు ప్రయోగం.
theological_decisions:
- issue: సమాజమందిరంలోని ఇశ్రాయేలీయులను, వారితో అనుబంధమున్న అన్యజన ఆరాధకులను సంబోధించడం
  choice: “ఇశ్రాయేలు పురుషులారా, దేవునికి భయపడే వారలారా”
  alternative: “ఇశ్రాయేలు పురుషులారా, దేవభయస్థులారా”
  rationale: గ్రీకు వాక్యం జాతిపరమైన ఇశ్రాయేలీయులను, దేవునికి భయపడేవారిగా వర్ణించిన రెండవ వర్గాన్ని వేరుగా సంబోధిస్తుంది. రెండవ వర్గం సమాజమందిరంతో అనుబంధమున్న అన్యజనులై ఉండవచ్చు; ప్రధాన పాఠం ఆ సాధ్యమైన గుర్తింపును సాంకేతిక పదంగా ఖరారు చేయకుండా అసలు వర్ణనను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన ప్రత్యక్ష సంబోధనను ఉపయోగించాం. అసలు గ్రీకులోని రెండు శ్రోతల వర్గాల మధ్య భేదాన్ని నిలిపాం. [a] గుర్తును అది వివరిస్తున్న ‘దేవునికి భయపడే వారలారా’ అనే పదబంధం వెంట ఉంచాం.
