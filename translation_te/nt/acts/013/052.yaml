  text: οἵ ⸀τε μαθηταὶ ἐπληροῦντο χαρᾶς καὶ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/052.yaml
  text: And the disciples were filled with joy and the Holy Spirit[a].
translation:
  language: te
  text: మరియు శిష్యులు ఆనందంతోను పరిశుద్ధాత్మతోను నింపబడుతూ ఉండేవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆనందంతోను పరిశుద్ధాత్మతోను నింపబడ్డారు.” గ్రీకు అసంపూర్ణ భూతకాల కర్మణి క్రియ గతంలో కొనసాగిన లేదా పునరావృతమైన నింపబడటాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε μαθηταὶ
  choice: శిష్యులు
  rationale: τε ముందున్న కథనంతో ఈ వాక్యాన్ని కొనసాగింపుగా కలుపుతుంది. తెలుగులో వాక్యక్రమమే ఆ కొనసాగింపును సహజంగా తెలియజేస్తుంది; μαθηταίకు స్థిరమైన, సందర్భోచిత పదం ‘శిష్యులు’.
- source_word: ἐπληροῦντο
  choice: నింపబడుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల కర్మణి రూపం గతంలో కొనసాగుతున్న లేదా పునరావృతమవుతున్న నింపబడటాన్ని సూచించగలదు. ఈ అనువాదం కర్మణి భావాన్నీ, కొనసాగింపు కోణాన్నీ నిలుపుతుంది.
- source_word: χαρᾶς
  choice: ఆనందంతో
  rationale: πληρόω తరువాతి షష్ఠీ విభక్తి నింపబడిన దానిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఆనందంతో’ సహజమైన సమానార్థకం.
- source_word: πνεύματος ἁγίου
  choice: పవిత్రాత్మతో
  rationale: అపొస్తలుల కార్యముల సందర్భంలో ఈ పదబంధం సంఘ మిషన్‌లో క్రియాశీలుడైన దైవిక పవిత్రాత్మను సూచిస్తుంది. తెలుగులో ‘పవిత్రాత్మతో’ సహజంగా, వ్యక్తిగత సూచనతో ఉంటుంది.
theological_decisions:
- issue: πνεύματος ἁγίου వ్యక్తిగత దైవిక పవిత్రాత్మను సూచిస్తుందా, లేక కేవలం పవిత్రమైన ఆత్మస్థితిని సూచిస్తుందా?
  choice: పవిత్రాత్మతో
  alternative: పవిత్రమైన ఆత్మతో
  rationale: అపొస్తలుల కార్యముల అంతటా πνεῦμα ἅγιον సాధారణంగా సంఘ మిషన్‌లో పనిచేసే దైవిక పవిత్రాత్మను సూచిస్తుంది. అందువల్ల వ్యక్తిగత సూచనను నిలుపుతూ అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘నింపబడుతూ ఉన్నారు’ ద్వారా గ్రీకు imperfect passive యొక్క కొనసాగింపు లేదా పునరావృత భావాన్ని ఉంచి, సరళ భూతకాల ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
