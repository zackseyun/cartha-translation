source:
  edition: SBLGNT
  text: ⸂ὡς ἔτεσι τετρακοσίοις καὶ πεντήκοντα. καὶ μετὰ ταῦτα⸃ ἔδωκεν κριτὰς ἕως Σαμουὴλ ⸀τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/020.yaml
  text: For about four hundred and fifty years[a]. And after these things he gave judges until Samuel the prophet.
translation:
  language: te
  text: దాదాపు నాలుగువందల యాభై సంవత్సరాలు.[a] ఆ తరువాత ఆయన సమూయేలు ప్రవక్త వరకు న్యాయాధిపతులను ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, కొన్ని అనువాదాల్లో కాలసూచనను వేరుగా అనుసంధానిస్తారు: “సమూయేలు ప్రవక్త వరకు ఆయన దాదాపు నాలుగువందల యాభై సంవత్సరాలపాటు న్యాయాధిపతులను ఇచ్చాడు.” ఇక్కడి గ్రీకు పదాల అన్వయం, విరామచిహ్నాల అమరిక వివాదాస్పదమైనవి.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς
  choice: దాదాపు
  rationale: సంఖ్యకు ముందు వచ్చిన ὡς ఆ సంఖ్య ఖచ్చితమైనది కాదని, సుమారుగా చెప్పబడిందని సూచిస్తుంది.
- source_word: ἔτεσι τετρακοσίοις καὶ πεντήκοντα
  choice: నాలుగువందల యాభై సంవత్సరాలు
  rationale: కాలవ్యవధిని సూచించే గ్రీకు పదబంధంలోని పూర్తి సంఖ్యను సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: καὶ μετὰ ταῦτα
  choice: ఆ తరువాత
  rationale: కథనంలోని కాలక్రమాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; గ్రీకులోని బహువచన సూచనను తెలుగులో యాంత్రికంగా అనుకరించదు.
- source_word: ἔδωκεν
  choice: ఇచ్చాడు
  rationale: δίδωμι అనే క్రియ యొక్క ప్రాథమిక భావాన్ని, దేవుడు న్యాయాధిపతులను అనుగ్రహించాడనే బైబిలు నుడికారాన్ని కాపాడుతుంది.
- source_word: κριτὰς
  choice: న్యాయాధిపతులను
  rationale: రాజ్యపాలనకు ముందున్న ఇశ్రాయేలు చారిత్రక కాలంలోని ‘న్యాయాధిపతులు’ అనే ప్రత్యేక పాత్రను ఖచ్చితంగా సూచిస్తుంది.
- source_word: ἕως
  choice: వరకు
  rationale: న్యాయాధిపతుల క్రమానికి సమూయేలు అంతిమ హద్దుగా ఉన్నాడనే భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: Σαμουὴλ τοῦ προφήτου
  choice: సమూయేలు ప్రవక్త
  rationale: సమూయేలును అతని పాత్రతో గుర్తించే గ్రీకు అన్వయాన్ని సహజమైన తెలుగు రూపంలో అందిస్తుంది.
theological_decisions:
- issue: ‘దాదాపు నాలుగువందల యాభై సంవత్సరాలు’ అనే కాలసూచనను ఏ వాక్యభాగంతో అనుసంధానించాలి
  choice: ఇచ్చిన SBLGNT పాఠ్యక్రమాన్ని అనుసరించి కాలవ్యవధిని స్వతంత్ర వాక్యఖండంగా ఉంచి, తరువాత న్యాయాధిపతుల గురించిన వాక్యాన్ని ప్రారంభించడం
  alternative: ‘సమూయేలు ప్రవక్త వరకు ఆయన దాదాపు నాలుగువందల యాభై సంవత్సరాలపాటు న్యాయాధిపతులను ఇచ్చాడు’ అని కాలవ్యవధిని న్యాయాధిపతుల కాలంతో నేరుగా అనుసంధానించడం
  rationale: ఈ వచనంలోని గ్రీకు పదక్రమం, విరామచిహ్నాల అమరిక వివాదాస్పదమైనవి. ఇచ్చిన మూలపాఠం కాలపదబంధాన్ని ‘ఆ తరువాత’ అనే మాటలకు ముందు ఉంచుతుంది. అందువల్ల ప్రధాన పాఠ్యంలో దానిని అలాగే కాపాడి, మరొక సాధ్యమైన అనుసంధానాన్ని పాదసూచికలో తెలియజేయడం ద్వారా అసలైన సందిగ్ధతను పరిష్కరించినట్లు చూపకుండా నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. మూలంలోని అసంపూర్ణంగా వినిపించే కాలవ్యవధి వాక్యఖండాన్ని ఉద్దేశపూర్వకంగా నిలిపి, పాఠ్యసంబంధమైన సందిగ్ధతను పాదసూచికలో వివరించాం.
