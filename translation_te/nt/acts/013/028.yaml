  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ μηδεμίαν αἰτίαν θανάτου εὑρόντες ᾐτήσαντο Πιλᾶτον ἀναιρεθῆναι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/028.yaml
  text: And though they found no basis for a death sentence[b][a], they asked Pilate to have him executed.
translation:
  language: te
  text: మరణశిక్షకు తగిన ఏ ఆధారమూ వారికి దొరకకపోయినా[a], ఆయనను మరణశిక్షకు గురిచేయమని[b] పిలాతును అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరణానికి తగిన ఏ నేరమూ” లేదా “మరణశిక్షకు ఏ న్యాయపరమైన ఆధారమూ.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆయనను చంపమని” లేదా “ఆయనను మరణానికి అప్పగించమని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: మరణశిక్ష విధించడానికి తగిన ఏ ఆధారమూ
  rationale: న్యాయవిచారణ సందర్భంలో αἰτία అనేది కారణం, నేరారోపణ లేదా న్యాయపరమైన ఆధారం అనే భావాలను కలిగి ఉంటుంది; θανάτουతో కలిసి ఇది మరణశిక్షకు తగిన ఆధారాన్ని సూచిస్తుంది.
- source_word: εὑρόντες
  choice: దొరకకపోయినా
  rationale: 'క్రియావిశేషణ రూపాన్ని సందర్భంలోని వ్యతిరేక భావంతో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది: ఆధారం దొరకనప్పటికీ వారు మరణాన్ని కోరారు.'
- source_word: ᾐτήσαντο
  choice: అడిగారు
  rationale: పిలాతుకు చేసిన అభ్యర్థనను సరళంగా, సహజంగా తెలియజేస్తుంది; వాక్య సందర్భం దాని అధికారిక స్వభావాన్ని స్పష్టం చేస్తుంది.
- source_word: Πιλᾶτον
  choice: పిలాతును
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ἀναιρεθῆναι αὐτόν
  choice: ఆయనను చంపించమని
  rationale: కర్మణి భావాన్ని, పిలాతు అధికారంతో మరణశిక్ష అమలు చేయించాలనే న్యాయపరమైన సందర్భాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: καὶ
  choice: (వాక్య ప్రవాహంలో అంతర్లీనంగా)
  rationale: καί కథనాన్ని ముందుకు కొనసాగిస్తుంది. ఒంటరి వచనంగా తెలుగులో ప్రారంభ ‘మరియు’ అసహజంగా ఉండేందున, కొనసాగింపు భావాన్ని వాక్య నిర్మాణంలోనే ఉంచాం.
theological_decisions:
- issue: క్రియావిశేషణ ఉపవాక్యంలో వ్యతిరేక భావాన్ని స్పష్టంగా చూపాలా
  choice: దొరకకపోయినా
  alternative: దొరకక, / దొరికిన తరువాత
  rationale: గ్రీకు రూపం స్వతహాగా పరిస్థితి లేదా కాల సంబంధాన్ని సూచించగలిగినా, ఈ సందర్భంలో సరైన ఆధారం లేకున్నా మరణాన్ని కోరారనే ఉద్రిక్తత స్పష్టంగా ఉంది. ‘పోయినా’ దాన్ని అదనపు సిద్ధాంతార్థం చేర్చకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఆయన’ యేసును సూచిస్తూ సాధారణ తెలుగు బైబిలు గౌరవప్రయోగాన్ని నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
