id: ACT.13.47
reference: Acts 13:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως γὰρ ἐντέταλται ἡμῖν ὁ κύριος· Τέθεικά σε εἰς φῶς ἐθνῶν τοῦ εἶναί σε εἰς σωτηρίαν ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/047.yaml
  text: 'For so the Lord has commanded us: ‘I have set you as a light for the nations[b][a], so that you may be for salvation to the end of the earth.’'
translation:
  language: te
  text: 'ఎందుకంటే ప్రభువు మాకు ఇలా ఆజ్ఞాపించాడు: “జనాలకు[a] వెలుగుగా నిన్ను నియమించాను; భూమి అంచు వరకు[b] నీవు రక్షణగా ఉండేలా.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదేతరులకు.” గ్రీకు పదమైన ἐθνῶνకు ‘జనాలు’ లేదా సందర్భాన్ని బట్టి ‘యూదేతరులు’ అనే అర్థం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “భూమి చివరల వరకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: ఇలా
  rationale: ముందున్న చర్యకు ఆధారంగా ప్రభువు ఆజ్ఞను పరిచయం చేసే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ἐντέταλται
  choice: ఆజ్ఞాపించాడు
  rationale: పూర్తయినప్పటికీ కొనసాగుతున్న అధికారబద్ధమైన ఆజ్ఞను తెలుగు సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: ὁ κύριος
  choice: ప్రభువు
  rationale: లేఖనంలోని దైవిక వక్తను సూచించే గౌరవప్రదమైన, సాధారణ తెలుగు పదం.
- source_word: Τέθεικά σε
  choice: నిన్ను నియమించాను
  rationale: τέθεικα సూచించే స్థిరమైన నియామక భావాన్ని తెలియజేస్తుంది; కేవలం భౌతికంగా ‘ఉంచడం’ అనే అర్థానికి పరిమితం చేయదు.
- source_word: εἰς φῶς ἐθνῶν
  choice: జనాలకు వెలుగుగా
  rationale: εἰς యొక్క నియామక/ఫలిత భావాన్ని ‘గా’తో, φῶς రూపకాన్ని ‘వెలుగు’తో నిలుపుతుంది; ἐθνῶν యొక్క విస్తృత ప్రజాసమూహ భావాన్ని ‘జనాలు’ తెలియజేస్తుంది.
- source_word: τοῦ εἶναί σε εἰς σωτηρίαν
  choice: నీవు రక్షణగా ఉండేలా నిన్ను ఉంచాను
  rationale: ఉద్దేశం లేదా ఫలితాన్ని స్పష్టంగా తెలియజేస్తూ, వ్యక్తి స్వయంగా రక్షణనా లేక రక్షణకు సాధనమా అన్న భావాన్ని అతిగా విప్పి చెప్పదు.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: భూమి అంచు వరకు
  rationale: గ్రీకు ఏకవచనంలోని భూమి అత్యంత దూరపు అంచు భావాన్ని దగ్గరగా, సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: యెషయా వాక్యంలోని ఏకవచన ‘నీవు’ను పౌలు, బర్నబాల పరిచర్యకు అన్వయించడం
  choice: ఉల్లేఖనంలోని ఏకవచన సంబోధనను అలాగే ఉంచడం
  alternative: దీనిని అపొస్తలులను నేరుగా ఉద్దేశించిన బహువచనంగా వివరణాత్మకంగా మార్చడం
  rationale: గ్రీకు పాఠం లేఖనాన్ని ఏకవచనంలో నేరుగా ఉల్లేఖించి, సేవకుని వాక్యానికి అపొస్తలుల పరిచర్యతో ఉన్న సంబంధాన్ని వివరించకుండా వదిలేస్తుంది. అనువాదం ఆ theological tension‌ను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన లేఖన శైలి. ఉల్లేఖనంలోని ఏకవచనాన్ని, రక్షణకు సంబంధించిన సంక్షిప్త రూపకాన్ని నిలుపుతూ అనవసరమైన సిద్ధాంత వివరణను నివారించాం.
