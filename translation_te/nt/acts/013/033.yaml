id: ACT.13.33
reference: Acts 13:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ταύτην ὁ θεὸς ἐκπεπλήρωκεν τοῖς τέκνοις ⸀ἡμῶν ἀναστήσας Ἰησοῦν, ὡς καὶ ἐν τῷ ⸂ψαλμῷ γέγραπται τῷ δευτέρῳ⸃· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/033.yaml
  text: 'that God has fulfilled this for our children by raising up Jesus[a], as it is also written in the second Psalm: ‘You are my Son[b]; today I have begotten you.’'
translation:
  language: te
  text: 'దేవుడు యేసును లేవనెత్తడం ద్వారా దీనిని మన పిల్లలకు[a] నెరవేర్చాడు[b], రెండవ కీర్తనలో కూడా వ్రాయబడి ఉన్నట్లుగా:


    “నీవు నా కుమారుడివి;

    నేడు నేను నిన్ను కన్నాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి పిల్లలమైన మన కోసం.” కొన్ని ప్రతులలో “మన పిల్లలకు” అని ఉండగా, మరికొన్ని ప్రతులు “వారి పిల్లలమైన మన కోసం” అనే పాఠానికి మద్దతిస్తాయి.
    reason: textual_variant
  - marker: b
    text: “యేసును మృతులలోనుండి లేపడం ద్వారా” అని కూడా అర్థం కావచ్చు; ఇక్కడి గ్రీకు పదానికి ఒకరిని ముందుకు తీసుకురావడం లేదా నియమించడం అనే భావంలో “లేవనెత్తడం” అనే అర్థం కూడా ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπεπλήρωκεν
  choice: నెరవేర్చాడు
  rationale: పూర్తయిన కార్యానికి ఇప్పటికీ కొనసాగుతున్న ప్రాముఖ్యత ఉందనే పరిపూర్ణ కాల భావాన్ని సందర్భంలో సహజంగా తెలియజేస్తూ, వాగ్దాన నెరవేర్పు భాషను నిలుపుతుంది.
- source_word: ταύτην
  choice: దీనిని
  rationale: ముందటి వచనంలోని వాగ్దానాన్ని సూచించే సర్వనామాన్ని, మూలంలో లేని నామవాచకాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా అలాగే ఉంచుతుంది.
- source_word: τοῖς τέκνοις ἡμῶν
  choice: మన పిల్లల కోసం
  rationale: పాఠ్యంలో ఉన్న ‘మన పిల్లలు’ అనే రూపాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; ప్రత్యామ్నాయ పాఠాంతరాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: ἀναστήσας Ἰησοῦν
  choice: యేసును లేపడం ద్వారా
  rationale: యేసును మృతులలోనుండి లేపడం అనే భావానికీ, ఆయనను ముందుకు తెచ్చి నియమించడం అనే భావానికీ అవకాశం ఉండేలా మూలంలోని ఉద్విగ్నతను సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: γέγραπται
  choice: రాసి ఉంది
  rationale: లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే గ్రీకు పరిపూర్ణ కర్మణి ప్రయోగానికి సహజమైన తెలుగు రూపం; వ్రాయబడినది ఇప్పటికీ ప్రామాణికంగా ఉందనే భావాన్ని ఇస్తుంది.
- source_word: ψαλμῷ ... τῷ δευτέρῳ
  choice: రెండవ కీర్తనలో
  rationale: గ్రీకు పదక్రమ భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: Υἱός μου εἶ σύ
  choice: నీవు నా కుమారుడివి
  rationale: గ్రీకు వాక్యంలోని ప్రత్యక్ష గుర్తింపును స్పష్టమైన, సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: σήμερον γεγέννηκά σε
  choice: ఈ రోజు నేను నిన్ను కన్నాను
  rationale: γεννάω యొక్క ప్రత్యక్ష భావాన్ని, కీర్తన 2:7తో ఉన్న అంతర్గ్రంథ సంబంధాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
theological_decisions:
- issue: ఈ సందర్భంలో ἀναστήσας Ἰησοῦν అర్థం
  choice: ‘యేసును లేపడం ద్వారా’ అని అనువదించి భావసందిగ్ధతను నిలిపాము.
  alternative: ‘యేసును మృతులలోనుండి లేపడం ద్వారా’ లేదా ‘యేసును ముందుకు తెచ్చి నియమించడం ద్వారా.’
  rationale: తరువాతి వచనంలో పునరుత్థానం మరింత స్పష్టంగా చెప్పబడుతుంది; అపొస్తలుల కార్యములలో ఇదే క్రియ ఒక నాయకుణ్ణి లేదా విమోచకుణ్ణి దేవుడు లేవనెత్తడం అనే అర్థంలోనూ వస్తుంది. అందువల్ల ప్రధాన పాఠ్యం ఏ ఒక్క అర్థాన్నీ బలవంతంగా నిర్ణయించదు.
- issue: ‘ఈ రోజు నేను నిన్ను కన్నాను’ అనే మాటలోని క్రీస్తు సంబంధిత భావం
  choice: కీర్తన ఉల్లేఖనాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నేరుగా ఉంచాము.
  alternative: దీనిని రాజుగా ప్రతిష్ఠించడం, కుమారునిగా ప్రకటించడం, లేదా పునరుత్థానంలో నిర్ధారించడం అని విపులీకరించడం.
  rationale: అనువాదం తరువాతి సిద్ధాంత చర్చలను పాఠ్యంలోకి చేర్చి భావాన్ని ముందుగానే నిర్ణయించకూడదు; కీర్తన 2:7 మాటలను ఉన్నట్లుగా నిలపడం మూలంలోని ధార్మిక ఉద్విగ్నతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేఖన ఉల్లేఖనానికి తగిన గౌరవప్రదమైన శైలిలో అనువదించబడింది. ‘కన్నాను’ ప్రత్యక్షమైన ఆధునిక పదం; దాని ధార్మిక భావాన్ని ప్రధాన పాఠ్యంలో వ్యాఖ్యానించి పరిమితం చేయలేదు. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
