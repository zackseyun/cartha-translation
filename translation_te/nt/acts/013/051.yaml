  text: οἱ δὲ ἐκτιναξάμενοι τὸν κονιορτὸν τῶν ⸀ποδῶν ἐπ’ αὐτοὺς ἦλθον εἰς Ἰκόνιον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/051.yaml
  text: But they shook off the dust from their feet against them and went to Iconium[a].
translation:
  language: te
  text: అయితే వారు తమ పాదాల ధూళిని వారికి వ్యతిరేకంగా దులిపివేసి, ఇకొనియకు వెళ్లారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పాదాల ధూళిని దులిపివేయడం అనేది తమకు వారితో సంబంధం లేదని చూపిస్తూ, సందేశాన్ని తిరస్కరించినవారికి వ్యతిరేకంగా సాక్ష్యమిచ్చే సంకేతాత్మక చర్య.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ
  choice: అయితే వారు
  rationale: δέ స్వల్ప వ్యతిరేకతను లేదా కథన మలుపును సూచిస్తుంది; సందర్భంలో ‘వారు’ పౌలు, బర్నబాలను సూచిస్తుంది.
- source_word: ἐκτιναξάμενοι
  choice: దులిపివేసి
  rationale: ἐκτινάσσω బలంగా దులిపి తొలగించడాన్ని సూచిస్తుంది; పూర్వకాలక క్రియావిశేషణ రూపాన్ని సహజమైన తెలుగు క్రమక్రియగా అనువదించాం.
- source_word: τὸν κονιορτὸν τῶν ποδῶν
  choice: తమ పాదాల ధూళిని
  rationale: κονιορτός నేలపై ఉండే సన్నని ధూళిని సూచిస్తుంది; సంబంధాన్ని తెలుగులో సహజంగా ‘పాదాల ధూళి’గా ఉంచాం.
- source_word: ἐπ’ αὐτοὺς
  choice: వారికి విరోధంగా
  rationale: ἐπί + ద్వితీయా విభక్తి ఇక్కడ సంకేతాత్మక చర్య ఎవరికి వ్యతిరేకంగా జరిగిందో తెలియజేస్తుంది; దాని తీర్పు భావాన్ని ప్రధాన పాఠ్యంలో విస్తరించలేదు.
- source_word: ἦλθον εἰς Ἰκόνιον
  choice: ఈకొనియకు వెళ్లారు
  rationale: గమ్యస్థానంవైపు ప్రయాణాన్ని తెలుగులో సహజంగా ‘వెళ్లారు’తో తెలిపాం; Ἰκόνιον అనే స్థలనామాన్ని ‘ఈకొనియ’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: పాదాల ధూళిని దులిపివేసే సంకేతాత్మక చర్య
  choice: ప్రధాన పాఠ్యంలో చర్యను ‘వారికి విరోధంగా’ అని మాత్రమే స్పష్టంగా అనువదించడం
  alternative: ‘వారికి సాక్ష్యంగా’ లేదా ‘వారిపై తీర్పుకు సూచనగా’ అని వివరణాత్మకంగా అనువదించడం
  rationale: గ్రీకు పాఠ్యం చర్యను, దాని దిశను మాత్రమే ప్రత్యక్షంగా చెబుతుంది. వియోజనమూ సందేశాన్ని తిరస్కరించినవారికి వ్యతిరేక సాక్ష్యమూ అనే సాంస్కృతిక భావాన్ని పాదటిప్పణిలో ఇచ్చి, ప్రధాన పాఠ్యంలో వ్యాఖ్యానాన్ని కలపలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని సంక్షిప్తతను నిలుపుతూ, సాంస్కృతిక అర్థాన్ని పాదటిప్పణికి పరిమితం చేశాం.
