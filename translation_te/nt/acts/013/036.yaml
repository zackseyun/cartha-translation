source:
  edition: SBLGNT
  text: Δαυὶδ μὲν γὰρ ἰδίᾳ γενεᾷ ὑπηρετήσας τῇ τοῦ θεοῦ βουλῇ ἐκοιμήθη καὶ προσετέθη πρὸς τοὺς πατέρας αὐτοῦ καὶ εἶδεν διαφθοράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/036.yaml
  text: For David[a], after serving God's purpose in his own generation[d][c][b], fell asleep and was gathered to his fathers and saw decay.
translation:
  language: te
  text: 'దావీదు తన తరంలో దేవుని సంకల్పాన్ని నెరవేర్చిన తరువాత[a], నిద్రించాడు[b]; తన పితరుల చెంతకు చేర్చబడ్డాడు[c], క్షయాన్ని చూశాడు[d].


    [a] లేదా, “దేవుని సంకల్పం ప్రకారం తన తరానికి సేవ చేసిన తరువాత.” గ్రీకు వాక్య నిర్మాణం ఈ రెండు అర్థాలకు అవకాశం ఇస్తుంది.


    [b] “నిద్రించాడు” అనేది మరణాన్ని సూచించే బైబిలు పరిభాష.


    [c] అక్షరార్థంగా, “తన పితరుల చెంతకు చేర్చబడ్డాడు”; అంటే, మరణంలో తన పూర్వీకులతో కలిశాడు.


    [d] అంటే, అతని శరీరం కుళ్లిపోయింది; తరువాతి వచనంలోని వ్యత్యాసాన్ని చూడండి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని సంకల్పం ప్రకారం తన తరానికి సేవ చేసిన తరువాత.” గ్రీకు వాక్య నిర్మాణం ఈ రెండు అర్థాలకు అవకాశం ఇస్తుంది.
    reason: syntactic_ambiguity
  - marker: b
    text: “నిద్రించాడు” అనేది మరణాన్ని సూచించే బైబిలు పరిభాష.
    reason: cultural_note
  - marker: c
    text: అక్షరార్థంగా, “తన పితరుల చెంతకు చేర్చబడ్డాడు”; అంటే, మరణంలో తన పూర్వీకులతో కలిశాడు.
    reason: idiom_note
  - marker: d
    text: అంటే, అతని శరీరం కుళ్లిపోయింది; తరువాతి వచనంలోని వ్యత్యాసాన్ని చూడండి.
    reason: contextual_note
lexical_decisions:
- source_word: ἰδίᾳ γενεᾷ
  choice: తన తరంలో
  rationale: దావీదు సేవ చేసిన కాలపరిధిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; అదే సమయంలో దత్తి విభక్తి వల్ల సాధ్యమయ్యే ‘తన తరానికి’ అనే అర్థాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: ὑπηρετήσας
  choice: సేవ చేసిన తరువాత
  rationale: ముఖ్య క్రియలకు ముందుగా జరిగిన కార్యాన్ని సూచించే భూతకాల కృదంత భావాన్ని స్పష్టంగా అందిస్తుంది; మతపరంగా సంకుచితమైన ‘పరిచర్య చేశాడు’ కంటే ‘సేవ చేశాడు’ విస్తృతమైనది.
- source_word: τῇ τοῦ θεοῦ βουλῇ
  choice: దేవుని సంకల్పానికి
  rationale: βουλήలోని ఉద్దేశం, నిర్ణయం, ప్రణాళిక అనే భావాలను ఆధునిక పాఠకునికి సహజంగా అందిస్తుంది. గ్రీకు వాక్య నిర్మాణంలోని ప్రత్యామ్నాయ అన్వయాన్ని పాదసూచికలో కాపాడింది.
- source_word: ἐκοιμήθη
  choice: నిద్రించాడు
  rationale: మరణానికి మూలపాఠం ఉపయోగించిన సౌమ్యోక్తిని, దాని బైబిలు ప్రతిధ్వనిని తొలగించకుండా నిలుపుతుంది.
- source_word: προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  choice: తన పితరుల చెంతకు చేర్చబడ్డాడు
  rationale: మరణంలో పూర్వీకులతో కలవడాన్ని తెలిపే సెమిటిక్ శైలిని దాని రూపకత్వంతో సహా కాపాడుతుంది.
- source_word: εἶδεν διαφθοράν
  choice: క్షయాన్ని చూశాడు
  rationale: ‘క్షయాన్ని చూడడం’ అనే మూలపాఠపు ప్రత్యక్ష పదబంధాన్ని నిలిపి, కీర్తన ఉల్లేఖనంతోనూ తరువాతి వచనంలోని వ్యత్యాసంతోనూ ఉన్న వాక్చాతుర్య సంబంధాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ἰδίᾳ γενεᾷ మరియు τῇ τοῦ θεοῦ βουλῇ పదబంధాల అన్వయం
  choice: తన తరంలో దేవుని సంకల్పానికి సేవ చేశాడు
  alternative: దేవుని సంకల్పం ప్రకారం తన తరానికి సేవ చేశాడు
  rationale: గ్రీకు దత్తి పదబంధాల అన్వయం నిజంగా సందిగ్ధమైనది. ప్రధాన పాఠం కాలపరిధి అనే పఠనాన్ని అనుసరిస్తుంది; దావీదు తన తరానికి సేవ చేశాడనే మరో సాధ్యమైన పఠనాన్ని పాదసూచికలో స్పష్టంగా కాపాడుతుంది.
- issue: దావీదు మరణానికి ఉపయోగించిన సౌమ్యోక్తి
  choice: నిద్రించాడు
  alternative: చనిపోయాడు
  rationale: మూలపాఠం నేరుగా ‘చనిపోయాడు’ అనకుండా κοιμάομαι అనే సౌమ్యోక్తిని ఉపయోగిస్తుంది. దీనిని నిలపడం వల్ల మూలంలోని రూపకం ఉంటుంది; దాని అర్థాన్ని పాదసూచిక వివరిస్తుంది.
- issue: διαφθορά యొక్క శరీర సంబంధ భావం
  choice: క్షయాన్ని చూశాడు
  alternative: అతని శరీరం కుళ్లిపోయింది
  rationale: ప్రధాన పాఠంలో మూలపాఠపు రూపాన్ని, తరువాతి వచనంతో ఉన్న వ్యత్యాసాన్ని కాపాడుతూ, ఇది శరీర కుళ్లుదలను సూచిస్తుందని పాదసూచికలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి. ‘సంకల్పం,’ ‘పితరులు,’ ‘క్షయం’ వంటి బైబిలు సందర్భానికి తగిన పదాలను ఉపయోగించి, అస్పష్టంగా ఉండగల ‘నిద్రించాడు’ మరియు ‘క్షయాన్ని చూశాడు’ పదబంధాలను పాదసూచికలతో వివరించింది. గ్రీకు వాక్య నిర్మాణంలోని నిజమైన అన్వయ సందిగ్ధతను పరిష్కరించినట్టు చూపకుండా ప్రత్యామ్నాయాన్ని నమోదు చేసింది.
