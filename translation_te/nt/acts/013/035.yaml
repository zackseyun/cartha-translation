source:
  edition: SBLGNT
  text: ⸀διότι καὶ ἐν ἑτέρῳ λέγει· Οὐ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/035.yaml
  text: Therefore he also says in another psalm[c][b][a], ‘You will not let your Holy One see decay.’
translation:
  language: te
  text: 'అందుచేత ఆయన మరొక కీర్తనలో[a] కూడా ఇలా అంటున్నాడు: “నీ పరిశుద్ధుణ్ణి[b] క్షయాన్ని[c] చూడనివ్వవు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరొక చోట” లేదా “మరొక లేఖన భాగంలో”; గ్రీకులో కేవలం “మరొకదానిలో” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీ నమ్మకమైనవాణ్ణి” లేదా “నీ భక్తుణ్ణి.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “కుళ్లు” లేదా “క్షీణత.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: అందుచేత
  rationale: ముందటి వాదన నుంచి తీసుకునే నిర్ధారణను సందర్భంలో సహజంగా తెలియజేస్తుంది; ఇక్కడ ‘ఎందుకంటే’ కంటే అనుమానార్థక/నిగమనార్థక సంబంధమే బలంగా ఉంది.
- source_word: καὶ
  choice: కూడా
  rationale: ఇంకొక లేఖన సాక్ష్యాన్ని జోడిస్తున్న భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν ἑτέρῳ
  choice: మరొక కీర్తనలో
  rationale: గ్రీకులో నామవాచకం అధ్యాహారంగా ఉన్నా, ఉల్లేఖనం కీర్తన 16 నుంచి వచ్చింది; అందువల్ల పాఠకునికి స్పష్టత కోసం ‘కీర్తన’ను పూరించడం సందర్భానుగుణం. గ్రీకు పదబంధం విస్తృతంగా ‘మరొక చోట’ అని కూడా అర్థమవుతుందని పాదసూచికలో ఉంచబడింది.
- source_word: λέγει
  choice: ఆయన ... అంటున్నాడు
  rationale: వర్తమానకాల లేఖన-ఉల్లేఖన సూత్రాన్ని నిలుపుతుంది. గ్రీకులో కర్త వ్యక్తంగా లేకపోయినా, సందర్భంలో దేవుడు మాట్లాడుతున్నాడనే పౌలు వాదనకు ‘ఆయన’ సరిపోతుంది; లేఖనం మాట్లాడుతున్నదనే వ్యాకరణ అవకాశాన్ని అతిగా వివరించదు.
- source_word: Οὐ δώσεις
  choice: చూడనివ్వవు
  rationale: δίδωμι + క్రియార్థక రూపం ఇక్కడ అనుమతించడం అనే నుడికారార్థం ఇస్తుంది; ‘ఇవ్వవు’ అనే అక్షరార్థం కంటే ‘చూడనివ్వవు’ సహజంగా ఉంటుంది.
- source_word: τὸν ὅσιόν σου
  choice: నీ పరిశుద్ధుణ్ణి
  rationale: ὅσιος దేవునికి ప్రత్యేకంగా అంకితమైన, భక్తిగల లేదా నమ్మకమైన వ్యక్తిని సూచించగలదు. అపొస్తలుల కార్యములు 13లో ఈ వాక్యం యేసుకు అన్వయించబడుతున్నందున ‘పరిశుద్ధుడు’ సందర్భోచితం; ‘నమ్మకమైనవాడు’ అనే నిజమైన ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: ἰδεῖν
  choice: చూడ
  rationale: ὁράω యొక్క ప్రత్యక్ష అర్థమైన ‘చూడడం’ను నిలుపుతూ, లేఖన ఉల్లేఖనంలోని రూపక నుడికారాన్ని అనవసరంగా ‘అనుభవించడం’గా విప్పదు.
- source_word: διαφθοράν
  choice: క్షయం
  rationale: పునరుత్థాన వాదనలో శరీరపు కుళ్లు లేదా విచ్ఛిన్నతను సూచించే గంభీరమైన, సంక్షిప్తమైన తెలుగు పదం. మరింత సాధారణమైన ‘కుళ్లు’ పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: కీర్తన ఉల్లేఖనంలోని τὸν ὅσιόν σου ఎవరిని సూచిస్తుంది
  choice: ‘నీ పరిశుద్ధుణ్ణి’ అని అనువదించడం
  alternative: ‘నీ నమ్మకమైనవాణ్ణి’ లేదా ‘నీ భక్తుణ్ణి’
  rationale: ఈ ప్రసంగంలో పౌలు కీర్తనను యేసు పునరుత్థానానికి స్పష్టంగా అన్వయిస్తున్నాడు. అయినా ὅσιος పదంలోని ‘నమ్మకమైన/భక్తిగల’ భావసాధ్యతను పాదసూచికలో నిలుపుతున్నాం; ఏ ప్రత్యేక సంప్రదాయ వ్యాఖ్యానాన్నీ పదంలోకి చేర్చడం లేదు.
- issue: ἐν ἑτέρῳ తరువాత అధ్యాహారంగా ఉన్న నామవాచకం
  choice: ప్రధాన పాఠ్యంలో ‘మరొక కీర్తనలో’ అని స్పష్టీకరించడం
  alternative: ‘మరొక చోట’ లేదా ‘మరొక భాగంలో’
  rationale: ఉల్లేఖనం కీర్తన 16 నుంచి వచ్చినందున ‘కీర్తన’ సందర్భానికి ఖచ్చితంగా సరిపోతుంది. అయితే గ్రీకు కేవలం ‘మరొకదానిలో’ అని మాత్రమే చెప్పినందున విస్తృత ప్రత్యామ్నాయాన్ని పాదసూచికలో కాపాడుతున్నాం.
- issue: διαφθοράν యొక్క శరీర సంబంధమైన భావం
  choice: ‘క్షయం’ అని ఉంచి ‘చూడడం’ అనే మూల నుడికారాన్ని నిలుపడం
  alternative: ‘కుళ్లు’ లేదా వివరణాత్మకంగా ‘కుళ్లిపోవడం’
  rationale: సందర్భం శరీర క్షయాన్ని సూచించినా, మూలంలోని సంక్షిప్తత మరియు పునరుత్థాన సంబంధిత ఉద్వేగాన్ని అలాగే ఉంచుతుంది; సాధ్యమైన పదార్థాన్ని అతిగా సిద్ధాంతీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ లేఖన ఉల్లేఖనానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘క్షయం చూడనివ్వవు’ అనే కొద్దిగా ఉన్నతమైన నుడికారాన్ని మూలంలోని ‘see decay’ రూపాన్ని కాపాడేందుకు ఉద్దేశపూర్వకంగా నిలిపాం. పాదసూచిక గుర్తులన్నీ ప్రధాన పాఠ్యంలో సంబంధిత పదబంధాల వెంట ఉన్నాయి.
