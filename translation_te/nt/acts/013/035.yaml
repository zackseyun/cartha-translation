  naturalness: ‘నీ పరిశుద్ధుణ్ణి క్షయం చూడనివ్వవు’ అర్థమయ్యేదే అయినా, ఆధునిక ప్రామాణిక తెలుగులో ‘క్షయాన్ని చూడనివ్వవు’ మరింత సహజం మరియు వ్యాకరణపరంగా స్పష్టం. పాదసూచికలోని ‘భ్రష్టత’ శారీరక క్షయానికి సహజమైన ప్రత్యామ్నాయం కాదు; దానికి నైతిక పతనార్థం బలంగా ఉంటుంది.
  terminology: ‘పరిశుద్ధుణ్ణి’ ఈ సందర్భంలోని ὅσιος కు తగిన, గౌరవప్రదమైన అనువాదం; ‘నమ్మకమైనవాణ్ణి,’ ‘భక్తుణ్ణి’ ప్రత్యామ్నాయాలుగా ఉంచడం సరైనది. διαφθοράకు ‘క్షయం’ ప్రధాన పాఠ్యంలో సముచితం; ‘కుళ్లు’ మరియు ‘క్షీణత’ పాదసూచిక ప్రత్యామ్నాయాలుగా మరింత సహజమైనవి.
