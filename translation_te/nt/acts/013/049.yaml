  text: And the word of the Lord was being spread throughout the whole region[a].
translation:
  language: te
  text: ప్రభువు వాక్యం ఆ ప్రాంతమంతటా వ్యాపింపజేయబడుతూ ఉండేది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రభువు సందేశం.’
    reason: λόγος అనే పదానికి ఈ సందర్భంలో ‘సందేశం’ అనే అర్థమూ ఉంది.
lexical_decisions:
- source_word: διεφέρετο
  choice: వ్యాపింపజేయబడుతూ ఉంది
  rationale: అసంపూర్ణ భూతకాల కర్మణి రూపం గతంలో కొనసాగుతున్న చర్యను, అలాగే ఆ వాక్యం ఇతరుల ద్వారా వ్యాప్తి చేయబడిందనే భావాన్ని తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప కథన అనుసంధానంగా పనిచేస్తుంది. తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండానే ఆ సంబంధం సహజంగా వ్యక్తమవుతుంది.
- source_word: ὁ λόγος
  choice: వాక్యం
  rationale: అపొస్తలుల కార్యములలో λόγος ప్రకటించబడే సువార్త సందేశాన్ని సూచిస్తుంది. ‘వాక్యం’ లూకా రచనలోని పునరావృత పదప్రయోగాన్నీ దాని ధార్మిక ప్రతిధ్వనినీ కాపాడుతుంది; ‘సందేశం’ సందర్భార్థాన్ని మరింత స్పష్టంగా తెలిపే ప్రత్యామ్నాయం.
- source_word: τοῦ κυρίου
  choice: ప్రభువు
  rationale: సంబంధార్థక రూపమైన τοῦ κυρίου ను తెలుగులో సహజమైన ‘ప్రభువు వాక్యం’ అనే నిర్మాణంతో తెలిపాం; ఇది ప్రభువుకు చెందిన లేదా ప్రభువును గురించిన సందేశం అనే ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది.
- source_word: δι’ ὅλης
  choice: అంతటా
  rationale: διά + షష్ఠీ విభక్తి ఒక భూభాగమంతటా విస్తరించడాన్ని సూచిస్తుంది; ὅλης లోని సమగ్రతను ‘అంతటా’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τῆς χώρας
  choice: ఆ ప్రాంతం
  rationale: χώρα ఆధునిక దేశరాజ్యాన్ని కాక పరిసర భౌగోళిక ప్రాంతాన్ని సూచిస్తుంది. సందర్భంలో నిర్దిష్టమైన ప్రాంతం కావడంతో ‘ఆ ప్రాంతం’ స్పష్టంగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: κύριος పదం అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: అపొస్తలుల కార్యముల సందర్భంలో ‘ప్రభువు’ అనే పదం అధికార భావంతోపాటు పునరుత్థానుడైన యేసుకు సంబంధించిన క్రీస్తు-కేంద్రీయ, లేఖనసంబంధ ప్రతిధ్వనిని కాపాడుతుంది.
- issue: ‘ప్రభువు వాక్యం’ అనే సంబంధ నిర్మాణంలోని విస్తృతి
  choice: అస్పష్టతను అలాగే ఉంచడం
  alternative: ‘ప్రభువును గురించిన సందేశం’ అని స్పష్టీకరించడం
  rationale: τοῦ κυρίου అనేది ప్రభువుకు చెందిన వాక్యం లేదా ప్రభువును గురించిన సందేశం అనే భావాలను అనుమతించగలదు. మూలంలోని ఈ విస్తృతిని ప్రధాన పాఠంలో సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘వ్యాపింపజేయబడుతూ ఉంది’ కొంత అధికారికంగా ఉన్నప్పటికీ, గ్రీకు అసంపూర్ణ భూతకాలంలోని కొనసాగింపు భావాన్నీ కర్మణి ప్రయోగాన్నీ కాపాడుతుంది.
