  text: ὁ δὲ θεὸς ἤγειρεν αὐτὸν ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/030.yaml
  text: But God raised him from the dead.
translation:
  language: te
  text: కాని దేవుడు ఆయనను మృతులలోనుండి లేపాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: కాని
  rationale: మునుపటి వచనంలో మనుషులు యేసును చంపి సమాధిలో ఉంచిన చర్యకు, దేవుడు చేసిన కార్యానికి మధ్య ఉన్న వ్యత్యాసాన్ని సహజమైన తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: θεὸς
  choice: దేవుడు
  rationale: ఈ క్రియకు కర్త దేవుడే అని మూలపాఠం నేరుగా చెబుతోంది.
- source_word: ἤγειρεν
  choice: లేపాడు
  rationale: పునరుత్థాన సందర్భంలో ἐγείρω అంటే ‘లేపడం’; ‘లేపాడు’ అనేది తెలుగులో సహజంగా ఉండి, దేవుని కార్యంగా పునరుత్థానాన్ని తెలియజేస్తుంది.
- source_word: αὐτὸν
  choice: ఆయనను
  rationale: ఈ సర్వనామం సమీప సందర్భంలోని యేసును సూచిస్తుంది; యేసును గురించి చెప్పేటప్పుడు గౌరవార్థక ఏకవచనం ఆధునిక ప్రామాణిక తెలుగులో సహజం.
- source_word: ἐκ νεκρῶν
  choice: మృతులలోనుండి
  rationale: ఇది మృతుల మధ్యనుండి లేపబడటాన్ని తెలిపే గ్రీకు పునరుత్థాన ప్రయోగాన్ని సంక్షిప్తంగా, మూలానికి దగ్గరగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పునరుత్థాన వాక్యనిర్మాణం
  choice: దేవుడు ఆయనను మృతులలోనుండి లేపాడు
  alternative: దేవుడు ఆయనను మృతుల మధ్యనుండి లేపాడు
  rationale: ఈ అనువాదం యేసు పునరుత్థానాన్ని దేవుని కార్యంగా స్పష్టంగా పేర్కొంటుంది. ‘మృతులలోనుండి’ అనేది ἐκ νεκρῶν అనే మూలప్రయోగాన్ని కాపాడుతూ, అదనపు సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సంక్షిప్తమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘ఆయనను’ అనే గౌరవార్థక రూపం సందర్భంలోని యేసును సహజంగా సూచిస్తుంది.
