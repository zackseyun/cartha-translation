id: ACT.13.44
reference: Acts 13:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τῷ ⸀δὲ ἐρχομένῳ σαββάτῳ σχεδὸν πᾶσα ἡ πόλις συνήχθη ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/044.yaml
  text: On the coming Sabbath[b][a], nearly the whole city gathered together to hear the word of the Lord.
translation:
  language: te
  text: తరువాతి విశ్రాంతి దినాన[a] ప్రభువు వాక్యాన్ని[b] వినడానికి దాదాపు పట్టణమంతా ఒకచోట కూడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రాబోయే విశ్రాంతి దినాన’ లేదా ‘ఆ తరువాతి విశ్రాంతి దినాన.’
    reason: lexical_alternative
  - marker: b
    text: ‘ప్రభువు వాక్యం’ అనే మాటను ‘ప్రభువు సందేశం’ అని, లేదా సందర్భానుసారంగా ‘ప్రభువును గూర్చిన సందేశం’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Τῷ δὲ ἐρχομένῳ σαββάτῳ
  choice: తరువాతి విశ్రాంతి దినాన
  rationale: కాలసూచక దత్తివ విభక్తి నిర్మాణం ‘రాబోయే/తరువాతి విశ్రాంతి దినాన’ అని అర్థమిస్తుంది. సందర్భంలో సహజమైన ఆధునిక తెలుగు కోసం ‘తరువాతి’ ఎంచుకున్నాం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: σχεδὸν
  choice: దాదాపు
  rationale: ‘దాదాపు/ఇంచుమించు’ అనే అర్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πᾶσα ἡ πόλις
  choice: పట్టణమంతా
  rationale: ఇది పట్టణ నివాసులను సమష్టిగా సూచించే విస్తృత ప్రయోగం; ప్రతి వ్యక్తీ తప్పక వచ్చాడని కచ్చితంగా చెప్పదు. ‘పట్టణమంతా’ మూలంలోని బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: συνήχθη
  choice: ఒకచోట కూడింది
  rationale: సమూహంగా సమావేశమయ్యారనే అకర్మక భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀκοῦσαι
  choice: వినడానికి
  rationale: వారు కూడిన ఉద్దేశాన్ని తెలిపే infinitive భావాన్ని నేరుగా అందిస్తుంది.
- source_word: τὸν λόγον
  choice: వాక్యాన్ని
  rationale: అపొస్తలుల కార్యములలో λόγος ప్రకటిత సందేశానికి పునరావృతమయ్యే పదం. ‘వాక్యం’ ఆ పదసంబంధాన్ని నిలుపుతుంది; ‘సందేశం’ అనే భావం పాదసూచికలో సూచించబడింది.
- source_word: τοῦ κυρίου
  choice: ప్రభువు
  rationale: κύριοςకు గౌరవభరితమైన సాధారణ తెలుగు సమానార్థకం ‘ప్రభువు’. షష్ఠీ సంబంధాన్ని ‘ప్రభువు వాక్యం’గా నిలిపి, అది ప్రభువు నుండి వచ్చినదా లేక ప్రభువును గూర్చినదా అనే భావవ్యాప్తిని సంకుచితం చేయలేదు.
theological_decisions:
- issue: κύριος పదం అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఈ క్రైస్తవ ప్రకటన సందర్భంలో ‘ప్రభువు’ సహజమైనది, గౌరవభరితమైనది; మూలపాఠం పేర్కొన్నదానికంటే నిర్దిష్టంగా సూచిత వ్యక్తిని నిర్ణయించదు.
- issue: ‘ప్రభువు వాక్యం’ అనే షష్ఠీ నిర్మాణ భావం
  choice: సాంప్రదాయిక సంక్షిప్త నిర్మాణమైన ‘ప్రభువు వాక్యం’ను నిలుపడం
  alternative: ప్రభువు సందేశం / ప్రభువును గూర్చిన సందేశం
  rationale: ఈ నిర్మాణం ప్రభువుకు చెందిన లేదా ప్రభువు నుండి వచ్చిన సందేశం, సందర్భానుసారంగా ప్రభువును గూర్చిన సందేశం అనే పరస్పరం మిళితమైన భావాలను మోయగలదు. ప్రధాన పాఠంలో ఒకే భావంగా పరిష్కరించకుండా మూలంలోని ఉద్దేశపూర్వక విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవభరితమైన శైలిని వాడాం. ‘విశ్రాంతి దినం,’ ‘ప్రభువు వాక్యం’ వంటి బైబిలు పరిచిత పదబంధాలను ఉంచుతూ వాక్య నిర్మాణాన్ని సహజంగా తీర్చిదిద్దాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
