revisions:
- from: 'కాబట్టి జాగ్రత్తపడండి; ప్రవక్తల గ్రంథాల్లో[a] చెప్పబడినది మీ మీదికి రాకూడదు:'
  to: 'కాబట్టి, ప్రవక్తల గ్రంథాల్లో[a] చెప్పబడినది మీ మీదికి రాకుండా జాగ్రత్తపడండి:'
  rationale: 'The revision removes the misleading standalone prohibition and expresses the imperative warning with a Telugu purpose/prevention construction: ‘take care lest what has been spoken come upon you.’ No theological or interpretive expansion has been introduced.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:26:35Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the warning force of βλέπετε, the inferential οὖν, and the scriptural-corpus sense of ἐν τοῖς προφήταις. However, ‘మీ మీదికి రాకూడదు’ by itself is a prohibition (‘must not come upon you’) rather than the Greek imperative-plus-μή warning, ‘watch out lest it come upon you.’
  naturalness: ‘కాబట్టి, ... రాకుండా జాగ్రత్తపడండి’ is natural modern standard Telugu and makes the syntactic relationship between the command and the impending consequence clear. The colon appropriately introduces the quotation that follows in the next verse.
  terminology: ‘ప్రవక్తల గ్రంథాల్లో’ suitably conveys the likely reference to the prophetic writings. The footnote preserves the Greek wording and the viable alternative sense ‘through/by the prophets’ without treating it as the main reading.
  issues:
  - severity: medium
    issue: The negative clause is rendered as an independent prohibition.
    rationale: ‘మీ మీదికి రాకూడదు’ can imply that the spoken thing itself ought not come, whereas μή ἐπέλθῃ after βλέπετε warns the hearers to take care so that it does not come upon them. Recasting it with ‘రాకుండా జాగ్రత్తపడండి’ preserves the Greek construction and agency of the warning.
  revised_text: 'కాబట్టి, ప్రవక్తల గ్రంథాల్లో[a] చెప్పబడినది మీ మీదికి రాకుండా జాగ్రత్తపడండి:'
  revised_footnotes:
  - marker: a
    text: లేదా, ‘ప్రవక్తల ద్వారా.’ గ్రీకులో అక్షరార్థంగా ‘ప్రవక్తలలో’ అని ఉంది; ఈ హెచ్చరిక ప్రవక్తల రచనల్లో ఉన్నదని ఇది సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  revision_rationale: 'The revision removes the misleading standalone prohibition and expresses the imperative warning with a Telugu purpose/prevention construction: ‘take care lest what has been spoken come upon you.’ No theological or interpretive expansion has been introduced.'
