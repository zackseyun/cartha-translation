id: ACT.13.40
reference: Acts 13:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: βλέπετε οὖν μὴ ⸀ἐπέλθῃ τὸ εἰρημένον ἐν τοῖς προφήταις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/040.yaml
  text: 'Therefore watch out[a], lest what has been spoken in the prophets come upon you:'
translation:
  language: te
  text: 'కాబట్టి, ప్రవక్తల గ్రంథాల్లో[a] చెప్పబడినది మీ మీదికి రాకుండా జాగ్రత్తపడండి:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రవక్తల ద్వారా.’ గ్రీకులో అక్షరార్థంగా ‘ప్రవక్తలలో’ అని ఉంది; ఈ హెచ్చరిక ప్రవక్తల రచనల్లో ఉన్నదని ఇది సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: జాగ్రత్తపడండి
  rationale: రెండవ పురుష బహువచన వర్తమాన ఆజ్ఞార్థక రూపం ఇక్కడ తీవ్రమైన హెచ్చరికగా పనిచేస్తుంది. ‘జాగ్రత్తపడండి’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ హెచ్చరిక బలాన్ని నిలుపుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి ప్రకటన నుంచి వచ్చే నిర్ధారణను, హెచ్చరికతో దాని తార్కిక సంబంధాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: μὴ ἐπέλθῃ
  choice: మీ మీదికి రాకూడదు
  rationale: ఆజ్ఞార్థకం తర్వాత μήతో కూడిన అనిశ్చయార్థక క్రియ ప్రతికూల హెచ్చరికను సూచిస్తుంది. ‘మీ మీదికి రాకూడదు’ రాబోయే తీర్పు వారిపై సంభవించే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: τὸ εἰρημένον
  choice: చెప్పబడినది
  rationale: నపుంసక ఏకవచన కర్మణి భూతకృదంతం నామవాచకంగా వాడబడింది. ఈ ఎంపిక ‘చెప్పబడిన విషయం’ అనే అర్థాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἐν τοῖς προφήταις
  choice: ప్రవక్తల గ్రంథాల్లో
  rationale: ఇక్కడ ἐν ప్రవచన రచనల్లో ఈ హెచ్చరిక ఉన్న స్థలాన్ని సూచించే అవకాశం బలంగా ఉంది; వెంటనే హబక్కూకు వాక్యం ఉదహరించబడుతుంది. ‘ప్రవక్తల గ్రంథాల్లో’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ లిఖిత సంపుటి భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ప్రవక్తలు’ అనే పదబంధం దేనిని సూచిస్తుంది?
  choice: ప్రవక్తల లిఖిత గ్రంథాల సమాహారాన్ని సూచించేలా ‘ప్రవక్తల గ్రంథాల్లో’
  alternative: మానవ ప్రవక్తల ద్వారా చెప్పబడిన మాటలను ప్రధానంగా సూచించేలా ‘ప్రవక్తల ద్వారా’
  rationale: తర్వాతి వాక్యంలో పౌలు హబక్కూకు గ్రంథాన్ని ఉదహరిస్తున్నందున, ఈ పదబంధం ప్రవక్తల లేఖనాల్లో ఉన్న హెచ్చరికను సూచిస్తుంది. అయినప్పటికీ గ్రీకు ἐν τοῖς προφήταις వల్ల మానవ ప్రవక్తల సంబంధమైన భావం పూర్తిగా తొలగిపోదు; అందుకే ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన హెచ్చరిక శైలి వాడబడింది. వాక్యాంతంలోని ద్విబిందువు తరువాత వచ్చే ప్రవచన ఉదాహరణతో సంబంధాన్ని నిలుపుతుంది.
