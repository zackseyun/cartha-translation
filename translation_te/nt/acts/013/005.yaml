id: ACT.13.5
reference: Acts 13:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ γενόμενοι ἐν Σαλαμῖνι κατήγγελλον τὸν λόγον τοῦ θεοῦ ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων· εἶχον δὲ καὶ Ἰωάννην ὑπηρέτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/005.yaml
  text: And when they arrived at Salamis[a], they proclaimed the word of God in the synagogues of the Jews[b]; and they also had John as an assistant.
translation:
  language: te
  text: 'వారు సలమీసుకు చేరుకున్నప్పుడు[a], యూదుల సమాజమందిరాల్లో దేవుని వాక్యాన్ని ప్రకటించారు. వారితో యోహాను కూడా సహాయకునిగా[b] ఉన్నాడు.


    [a] లేదా, “సలమీసుకు వచ్చి.”


    [b] లేదా, “తోడ్పడేవానిగా” లేదా “పరిచారకునిగా.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సలమీసుకు వచ్చి.”
    reason: γενόμενοι అనే కృదంత నిర్మాణాన్ని కాలవాక్యంగా కాకుండా మరింత రూపసన్నిహితంగా అనువదించే ప్రత్యామ్నాయం.
  - marker: b
    text: లేదా, “తోడ్పడేవానిగా” లేదా “పరిచారకునిగా.”
    reason: ὑπηρέτης సహాయకుడు, తోడ్పడేవాడు లేదా పరిచారకుడు అనే పరిధిని కలిగి ఉంది.
lexical_decisions:
- source_word: γενόμενοι ἐν Σαλαμῖνι
  choice: సలమీసుకు చేరుకున్నప్పుడు
  rationale: స్థలాన్ని సూచించే ἐν తో వచ్చిన γενόμενοι ఇక్కడ ఒక ప్రదేశానికి చేరుకోవడాన్ని సహజంగా సూచిస్తుంది. కాలసంబంధమైన కృదంత భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: κατήγγελλον
  choice: ప్రకటించారు
  rationale: καταγγέλλω బహిరంగంగా తెలియజేయడం లేదా ప్రకటించడం అనే భావాన్ని ఇస్తుంది. ‘ప్రకటించారు’ అనే పదం దానిని కేవలం ప్రసంగించడం అనే అర్థానికి పరిమితం చేయదు.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: దేవుని వాక్యాన్ని
  rationale: మూలంలోని సంబంధ నిర్మాణాన్ని నిలుపుతూ, దేవుని సందేశం లేదా ప్రకటన అనే భావాన్ని అతిగా వివరణ చేయకుండా తెలియజేసే స్థిరమైన తెలుగు ప్రయోగం.
- source_word: ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων
  choice: యూదుల సమాజమందిరాల్లో
  rationale: సందర్భంలో συναγωγαί యూదుల ఆరాధనా-సమావేశ స్థలాలను సూచిస్తుంది. ‘సమాజమందిరాలు’ ఆధునిక తెలుగు బైబిలు పాఠకులకు స్పష్టమైన, స్థిరమైన పదం.
- source_word: εἶχον δὲ καὶ Ἰωάννην ὑπηρέτην
  choice: యోహాను కూడా వారికి సహాయకుడిగా ఉన్నాడు
  rationale: δέ యొక్క స్వల్ప మార్పు లేదా చేర్పును, καί యొక్క ‘కూడా’ భావాన్ని సహజ తెలుగులో ఉంచుతుంది. ὑπηρέτης ఇక్కడ ప్రయాణ-పరిచర్య సందర్భంలో సహాయకుడు లేదా పరిచారకుడు; ‘సహాయకుడు’ అనవసరమైన దాస్య భావాన్ని రానివ్వదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘సమాజమందిరాలు,’ ‘దేవుని వాక్యం’ వంటి స్థిరమైన పదాలను ఉంచుతూ, మూలంలోని స్వల్ప అనిశ్చితులకు పాదసూచికలు ఇచ్చాం. ఆంగ్ల పాఠంలో [b] గుర్తు ‘యూదులు’ తరువాత కనిపించినా, దాని విషయం ὑπηρέτην గురించినందున తెలుగులో దాన్ని ‘సహాయకుడిగా’ తరువాత సరైన స్థానంలో ఉంచాం.
