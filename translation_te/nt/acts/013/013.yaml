id: ACT.13.13
reference: Acts 13:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀναχθέντες δὲ ἀπὸ τῆς Πάφου οἱ ⸀περὶ Παῦλον ἦλθον εἰς Πέργην τῆς Παμφυλίας· Ἰωάννης δὲ ἀποχωρήσας ἀπ’ αὐτῶν ὑπέστρεψεν εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/013.yaml
  text: After setting sail from Paphos[a], those with Paul came to Perga in Pamphylia; but John, departing from them[b], returned to Jerusalem.
translation:
  language: te
  text: పాఫోసు నుండి ఓడలో బయలుదేరిన తరువాత[a], పౌలుతో ఉన్నవారు[b] పంఫూలియలోని పెర్గేకు వచ్చారు. అయితే యోహాను వారి నుండి వెళ్లిపోయి, యెరూషలేముకు తిరిగి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సముద్రంలోకి బయలుదేరిన తరువాత’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పౌలు, అతని సహచరులు’; అక్షరార్థంగా ‘పౌలు చుట్టూ ఉన్నవారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: ఓడలో బయలుదేరిన తరువాత
  rationale: సముద్రయాన సందర్భంలో ἀνάγω అంటే ఓడను సముద్రంలోకి నడిపించడం లేదా ఓడలో బయలుదేరడం. తెలుగు పాఠకులకు సహజంగా ఉండేలా సముద్రయాన భావాన్ని స్పష్టంగా ఉంచింది.
- source_word: οἱ περὶ Παῦλον
  choice: పౌలుతో ఉన్నవారు
  rationale: οἱ περὶ + వ్యక్తి అనే గ్రీకు ప్రయోగం ఆ వ్యక్తితో కూడిన బృందాన్ని సూచిస్తుంది. నాయకత్వం లేదా బృంద నిర్మాణం గురించి మూలంలో లేనిదాన్ని చేర్చకుండా ఈ రూపం భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: ἦλθον
  choice: వచ్చారు
  rationale: ἔρχομαι యొక్క సాధారణ ప్రయాణార్థాన్ని అనుసరిస్తూ, తెలుగు కథన శైలికి సహజమైన రూపాన్ని వాడింది.
- source_word: Πέργην τῆς Παμφυλίας
  choice: పంఫూలియలోని పెర్గేకు
  rationale: సంబంధ విభక్తి ఇక్కడ పెర్గే ఉన్న ప్రాంతాన్ని గుర్తిస్తుంది; తెలుగులో ‘పంఫూలియలోని’ అనేది సహజమైన స్థల సూచన.
- source_word: ἀποχωρήσας ἀπ’ αὐτῶν
  choice: వారి నుండి వెళ్లిపోయి
  rationale: యోహాను బృందం నుండి వెళ్లిన చర్యను మాత్రమే తెలిపే తటస్థ పదబంధం. అతని ఉద్దేశం లేదా నైతిక స్థితి గురించి అదనపు తీర్పును చేర్చదు.
- source_word: ὑπέστρεψεν
  choice: తిరిగి వెళ్లాడు
  rationale: ὑποστρέφω యొక్క ‘తిరిగి వెళ్లడం’ అనే సాధారణ అర్థాన్ని సహజమైన తెలుగు ప్రయాణ కథనంగా అందిస్తుంది.
- source_word: Ἱεροσόλυμα
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన నగరనామ రూపాన్ని అనుసరించింది.
theological_decisions:
- issue: యోహాను వెళ్లిపోవడంలో నైతిక లేదా ఆధ్యాత్మిక వైఫల్యం సూచించబడిందా?
  choice: వారి నుండి వెళ్లిపోయి
  alternative: వారిని విడిచిపెట్టి / వారిని వదిలేసి
  rationale: ఈ వచనం యోహాను వెళ్లి యెరూషలేముకు తిరిగాడని మాత్రమే చెబుతుంది. తరువాతి సందర్భం ఈ సంఘటనను ప్రతికూలంగా చూడవచ్చుగానీ, ఇక్కడే అతని ఉద్దేశాన్ని లేదా తప్పును నిర్ధారించకుండా మూలంలోని సంయమనాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడింది. వ్యక్తి, ప్రాంత నామాలకు తెలుగు బైబిలు పాఠకులకు పరిచితమైన రూపాలను ఎంచుకుంది. ఆంగ్ల సంప్రదింపు పాఠంలో పాదసూచిక గుర్తులు వాటి విషయాలకు సరిపోనట్లు కనిపించినందున, గ్రీకు పదబంధాలకు అనుగుణంగా [a]ను సముద్రయాన క్రియ వద్ద, [b]ను ‘పౌలుతో ఉన్నవారు’ వద్ద ఉంచింది.
