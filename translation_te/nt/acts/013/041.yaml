review_pass:
  verdict: revise
  source_fidelity: The draft conveys the warning, divine present action, and emphatic unbelief well. However, ఆశ్చర్యపడి makes the first imperative sound subordinate ('having been astonished'), whereas θαυμάσατε is an independent imperative. The conditional wording is also clearer when its result is expressed with a finite future verb.
  naturalness: తృణీకరించేవారలారా is understandable but comparatively stiff in modern standard Telugu. చులకనగా చూసేవారలారా is more idiomatic while retaining the sense of contempt. Recasting the final apposition as two natural Telugu clauses improves readability without changing its force.
  terminology: నశించిపోండి appropriately preserves the severe warning carried by ἀφανίσθητε. కార్యం is suitable for ἔργον. సవివరంగా చెప్పినా better reflects ἐκδιηγῆται ('recount/tell in detail') than పూర్తిగా వివరించినా, which can suggest explanation rather than narration.
  issues:
  - severity: medium
    issue: ఆశ్చర్యపడి is not a coordinate imperative.
    rationale: θαυμάσατε is an aorist imperative alongside Ἴδετε and ἀφανίσθητε. ఆశ్చర్యపడండి preserves the imperative sequence and prophetic rhetoric.
  - severity: low
    issue: The final conditional-relative construction is somewhat awkward and obscures the future force of οὐ μὴ πιστεύσητε.
    rationale: A finite Telugu future-negative, మీరు ఎంతమాత్రమూ నమ్మరు, naturally conveys the emphatic prediction. The repeated reference to the work can be maintained with దానిని.
  - severity: low
    issue: The rendering of ἐκδιηγῆται as పూర్తిగా వివరించడం leans toward explaining.
    rationale: The verb primarily denotes recounting or relating in detail; సవివరంగా చెప్పడం retains this nuance more closely.
  revised_text: “చూడండి, చులకనగా చూసేవారలారా![a] ఆశ్చర్యపడండి, నశించిపోండి! ఎందుకంటే మీ రోజుల్లో నేను ఒక కార్యం చేస్తున్నాను—ఎవరైనా దానిని మీకు సవివరంగా చెప్పినా[b] మీరు ఎంతమాత్రమూ నమ్మరు.”
