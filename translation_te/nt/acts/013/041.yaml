source:
  edition: SBLGNT
  text: Ἴδετε, οἱ καταφρονηταί, καὶ θαυμάσατε καὶ ἀφανίσθητε, ὅτι ἔργον ⸂ἐργάζομαι ἐγὼ⸃ ἐν ταῖς ἡμέραις ὑμῶν, ⸀ἔργον ὃ οὐ μὴ πιστεύσητε ἐάν τις ἐκδιηγῆται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/041.yaml
  text: Look[a], you scoffers, and marvel, and perish; for I am doing a work in your days[c][b], a work that you will certainly not believe if someone tells it to you.
translation:
  language: te
  text: “చూడండి, చులకనగా చూసేవారలారా![a] ఆశ్చర్యపడండి, నశించిపోండి! ఎందుకంటే మీ రోజుల్లో నేను ఒక కార్యం చేస్తున్నాను—ఎవరైనా దానిని మీకు సవివరంగా చెప్పినా[b] మీరు ఎంతమాత్రమూ నమ్మరు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తృణీకరించేవారలారా!” గ్రీకు పదం ధిక్కారంతో లేదా చులకనగా చూసి తిరస్కరించేవారిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు క్రియకు “విపులంగా వర్ణించడం” లేదా “సవివరంగా చెప్పడం” అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἴδετε
  choice: చూడండి
  rationale: బహువచన ఆజ్ఞారూపంలోని శ్రద్ధాకర్షణను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οἱ καταφρονηταί
  choice: తృణీకరించేవారలారా
  rationale: కేవలం అపనమ్మకం కాక, చులకనగా చూసి తిరస్కరించే భావాన్ని నిలుపుతుంది; సంబోధనను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: θαυμάσατε
  choice: ఆశ్చర్యపడి
  rationale: ప్రవచనాత్మక ఉద్ధరణలోని విస్మయభరితమైన, హెచ్చరికతో కూడిన స్వరాన్ని సహజంగా అందిస్తుంది.
- source_word: ἀφανίσθητε
  choice: నశించిపోండి
  rationale: అదృశ్యమవడం లేదా నాశనానికి లోనవడం అనే బలమైన హెచ్చరికను సందర్భానుగుణంగా తెలియజేస్తుంది.
- source_word: ἔργον
  choice: కార్యం
  rationale: దేవుడు చేసే ప్రాముఖ్యమైన చర్యను సూచించేందుకు గౌరవప్రదమైన, విస్తృతార్థక తెలుగు పదం.
- source_word: ἐργάζομαι ἐγώ
  choice: నేను ఒక కార్యం చేస్తున్నాను
  rationale: వర్తమాన కార్యాన్ని, స్పష్టంగా ఉన్న ἐγώ ఇచ్చే కర్తృత్వ ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἐν ταῖς ἡμέραις ὑμῶν
  choice: మీ రోజుల్లో
  rationale: కాలసూచనను మరియు శ్రోతలకు సంబంధించిన తక్షణత్వాన్ని నేరుగా నిలుపుతుంది.
- source_word: οὐ μὴ πιστεύσητε
  choice: మీరు ఎంతమాత్రమూ నమ్మని
  rationale: οὐ μή యొక్క బలమైన నిరాకరణను సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐάν τις ἐκδιηγῆται ὑμῖν
  choice: ఎవరైనా దానిని మీకు పూర్తిగా వివరించినా
  rationale: ἐκδιηγέομαι లోని విపులంగా కథనం చేయడం లేదా పూర్తిగా వివరించడం అనే భావాన్ని నిలుపుతూ షరతును తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: హబక్కూకు ప్రవచనంలోని తీర్పు హెచ్చరికను అపొస్తలుల కార్యములలో ఉద్ధరించిన విధానం
  choice: “నశించిపోండి” అనే బలమైన హెచ్చరికను, “ఎంతమాత్రమూ నమ్మని” అనే ఉద్ఘాటిత అపనమ్మకాన్ని నిలుపడం
  alternative: “అదృశ్యమైపోండి” అని మరింత పదశః అనువదించడం లేదా తీర్పు భావాన్ని మృదువుగా చేయడం
  rationale: మూలవాక్యం దేవుని కార్యాన్ని తృణీకరించేవారికి గంభీరమైన హెచ్చరికగా పనిచేస్తుంది. ఏ ప్రత్యేక సిద్ధాంతాన్ని చేర్చకుండా దాని తీవ్రతను నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రవచనాత్మక స్వరం ఉంచబడింది. బహువచన సంబోధన, బలమైన ఆజ్ఞలు, ఉద్ఘాటిత నిరాకరణ కాపాడబడ్డాయి; పాతకాలపు లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించాం.
