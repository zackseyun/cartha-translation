review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the contrast (δέ), God as the agent of raising, the resurrection-context sense of ἤγειρεν, negation, and the Psalm-derived idiom ‘see decay.’ However, ‘కుళ్లును’ is not a natural modern Telugu object form here.
  naturalness: ‘కుళ్లును చూడలేదు’ is awkward and sounds nonstandard/elliptical in modern Telugu. ‘క్షయాన్ని చూడలేదు’ is idiomatic in biblical-register modern Telugu and preserves the established Psalm 16 resonance. The alternative should be expressed as the verbal noun ‘కుళ్లిపోవడాన్ని,’ not the bare noun ‘కుళ్లు.’
  terminology: Use ‘క్షయం’ in the text for διαφθορά, with ‘కుళ్లిపోవడం’ as the clear bodily-decay alternative in the note. ‘దేవుడు లేపినవాడు’ appropriately retains the source’s relative construction without unnecessarily supplying the name Jesus.
  issues:
  - severity: medium
    issue: The phrase ‘కుళ్లును చూడలేదు’ is unnatural Telugu.
    rationale: The bare form ‘కుళ్లు’ does not function naturally as the object in this modern Telugu sentence. This impairs readability despite conveying the intended bodily-decay sense.
  - severity: low
    issue: The footnote’s alternative ‘క్షయాన్ని’ is less effective than a bodily-decay alternative once ‘క్షయం’ is adopted as the main text.
    rationale: Using ‘కుళ్లిపోవడాన్ని’ gives readers a clear natural alternative and accurately conveys the semantic range of διαφθορά without changing the verse’s meaning.
  revised_text: కాని దేవుడు లేపినవాడు క్షయాన్ని చూడలేదు[a].
