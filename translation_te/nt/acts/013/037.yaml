  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃν δὲ ὁ θεὸς ἤγειρεν οὐκ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/037.yaml
  text: But the one whom God raised up did not see decay[a].
translation:
  language: te
  text: కాని దేవుడు లేపినవాడు క్షయాన్ని చూడలేదు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కుళ్లిపోవడాన్ని.’ గ్రీకు పదం శరీరం కుళ్లిపోవడాన్ని లేదా క్షయాన్ని సూచించగలదు; ‘క్షయం’ అనే పదం గ్రీకు లేఖనాల్లోని కీర్తన 16:10 మాటల ప్రతిధ్వనిని మరింత స్పష్టంగా నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: లేపినవాడు
  rationale: గ్రీకు సంబంధ సర్వనామం ముందుగా ప్రస్తావించిన యేసును సూచిస్తుంది. తెలుగులో ‘దేవుడు లేపినవాడు’ అనే సంబంధార్థక నిర్మాణం సహజంగా ఉండి మూలార్థాన్ని కాపాడుతుంది.
- source_word: δὲ
  choice: కాని
  rationale: మునుపటి వచనంలో దావీదు కుళ్లు చూశాడనే మాటకు ఇది స్పష్టమైన వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: ὁ θεὸς
  choice: దేవుడు
  rationale: తెలుగులో సహజమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: ἤγειρεν
  choice: లేపిన
  rationale: ఈ సందర్భంలో మృతులలోనుండి లేపడాన్ని సూచిస్తుంది; అదే సమయంలో ‘లేపు’ అనే మూల క్రియారూపాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: οὐκ εἶδεν
  choice: చూడలేదు
  rationale: కీర్తన 16 గ్రీకు పాఠంతో ఉన్న ప్రతిధ్వనిని కాపాడేందుకు ‘అనుభవించలేదు’ వంటి వివరణాత్మక పదానికి బదులు ‘చూడలేదు’ అని అనువదించబడింది.
- source_word: διαφθοράν
  choice: కుళ్లు
  rationale: ఇక్కడ శరీరం కుళ్లిపోవడాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; విస్తృతమైన ‘క్షయం’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: ἤγειρεν అనే క్రియ యొక్క పునరుత్థాన భావం
  choice: దేవుడు యేసును మృతులలోనుండి లేపాడనే సందర్భార్థంతో ‘లేపిన’
  alternative: నియమించాడు లేదా ప్రజల మధ్యకు తీసుకొచ్చాడు అనే అర్థంలో ‘లేవనెత్తిన’
  rationale: దావీదు చనిపోయి కుళ్లు చూశాడనే ముందటి వాక్యానికి భిన్నంగా, దేవుడు లేపినవాడు కుళ్లు చూడలేదని ఈ వచనం చెబుతుంది. అందువల్ల ఇక్కడ పునరుత్థాన భావమే సందర్భానుసారంగా నిర్ణాయకం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. కీర్తన ప్రతిధ్వనిని నిలుపేందుకు ‘చూడలేదు’ అనే రూపాన్ని ఉద్దేశపూర్వకంగా కాపాడాం; ‘కుళ్లు’ శరీర క్షయాన్ని సామాన్య పాఠకునికి నేరుగా తెలియజేస్తుంది.
