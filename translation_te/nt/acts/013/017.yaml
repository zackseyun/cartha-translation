  source_fidelity: 'The Telugu accurately represents all three coordinated aorist actions: God chose the fathers, elevated the people during their foreign residence in Egypt, and led them out with an uplifted arm. “పరదేశులుగా నివసించిన కాలంలో” appropriately conveys παροικία, and “అక్కడి నుండి” naturally refers back to Egypt without adding interpretation.'
