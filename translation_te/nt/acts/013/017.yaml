  terminology: “ఈ ఇశ్రాయేలు ప్రజల దేవుడు,” “మన పితరులను,” and “ఆ ప్రజలను గొప్పగా చేశాడు” are sound choices. The rendering of ὕψωσεν remains appropriately broad, not restricting it to numerical growth or social exaltation alone. “ఎత్తిన బాహువుతో” retains the Exodus metaphor without doctrinal overinterpretation.
