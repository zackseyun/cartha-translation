id: ACT.13.17
reference: Acts 13:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ θεὸς τοῦ λαοῦ τούτου ⸀Ἰσραὴλ ἐξελέξατο τοὺς πατέρας ἡμῶν, καὶ τὸν λαὸν ὕψωσεν ἐν τῇ παροικίᾳ ἐν γῇ ⸀Αἰγύπτου, καὶ μετὰ βραχίονος ὑψηλοῦ ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/017.yaml
  text: The God of this people Israel chose our fathers[a], and made the people great during their sojourn in the land of Egypt[d][c][b], and with an uplifted arm he led them out from it.
translation:
  language: te
  text: ఈ ఇశ్రాయేలు ప్రజల దేవుడు మన పితరులను[a] ఎన్నుకున్నాడు; వారు ఐగుప్తు దేశంలో పరదేశులుగా నివసించిన కాలంలో ఆ ప్రజలను గొప్పగా చేశాడు[b]; ఎత్తిన బాహువుతో[c] వారిని అక్కడి నుండి బయటకు నడిపించాడు[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మన పూర్వీకులను.” గ్రీకులో అక్షరార్థంగా “మన తండ్రులను.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఆ ప్రజలను హెచ్చించాడు” లేదా “ఆ ప్రజలను విస్తరింపజేశాడు.”
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా “ఎత్తైన బాహువుతో”; ఇది దేవుడు తన శక్తితో విమోచించడాన్ని సూచించే నిర్గమకాలపు నుడికారం.
    reason: cultural_note
  - marker: d
    text: లేదా “వారిని అక్కడి నుండి బయటకు తీసుకొచ్చాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς τοῦ λαοῦ τούτου Ἰσραήλ
  choice: ఈ ఇశ్రాయేలు ప్రజల దేవుడు
  rationale: గ్రీకులోని ‘ఈ ప్రజలు—ఇశ్రాయేలు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగు పదక్రమంలో వ్యక్తం చేస్తూ, ఇశ్రాయేలును విశేషణంగా పూర్తిగా మార్చకుండా ప్రజల గుర్తింపుగా నిలుపుతుంది.
- source_word: ἐξελέξατο
  choice: ఎన్నుకున్నాడు
  rationale: దేవుడు ఉద్దేశపూర్వకంగా ఎంపిక చేసిన భావాన్ని సహజంగా తెలియజేస్తుంది; మధ్యమ ప్రయోగాన్ని తెలుగులో విడిగా వ్యక్తం చేయాల్సిన అవసరం లేదు.
- source_word: τοὺς πατέρας ἡμῶν
  choice: మన పితరులను
  rationale: గ్రీకు మూలంలోని పుంలింగ కుటుంబపదాన్ని, ప్రసంగంలోని ఒడంబడిక-చరిత్ర సందర్భాన్ని నిలుపుతుంది; ‘పూర్వీకులు’ అనే విస్తృత ప్రత్యామ్నాయాన్ని పాదటీపులో ఇస్తుంది.
- source_word: τὸν λαὸν ὕψωσεν
  choice: ఆ ప్రజలను గొప్పగా చేశాడు
  rationale: ὕψόωలో ఉన్న హెచ్చింపు, అభివృద్ధి లేదా సంఖ్యావృద్ధి భావాల్లో ఒక్కదానికే పరిమితం కాకుండా ఫలితాన్ని విస్తృతంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ παροικίᾳ ἐν γῇ Αἰγύπτου
  choice: వారు ఐగుప్తు దేశంలో పరదేశులుగా నివసించిన కాలంలో
  rationale: παροικίαలోని పరదేశ నివాస భావాన్ని స్పష్టమైన, సహజమైన తెలుగులో తెలియజేస్తూ γῇ Αἰγύπτουను ‘ఐగుప్తు దేశం’గా ప్రతిబింబిస్తుంది.
- source_word: μετὰ βραχίονος ὑψηλοῦ
  choice: ఎత్తిన బాహువుతో
  rationale: నిర్గమ సంప్రదాయంలోని రూపకాన్ని వ్యాఖ్యానించి ‘శక్తితో’ అని మాత్రమే మార్చకుండా నిలుపుతుంది.
- source_word: ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς
  choice: వారిని అక్కడి నుండి బయటకు నడిపించాడు
  rationale: ἐξάγωలోని బయటకు తీసుకువెళ్లే దిశాభావాన్ని వ్యక్తం చేస్తుంది; స్త్రీలింగ సర్వనామం సూచించే ఐగుప్తును తెలుగులో సహజంగా ‘అక్కడి నుండి’ అని తెలుపుతుంది.
theological_decisions:
- issue: ఇశ్రాయేలు పూర్వీకుల సంబోధన
  choice: మన పితరులను
  alternative: మన పూర్వీకులను
  rationale: πατέρας అనే మూలపదాన్ని యథార్థంగా నిలుపుతూ, పౌలు సమాజంతో పంచుకుంటున్న ఒడంబడిక-చరిత్ర సంబంధాన్ని కాపాడుతుంది.
- issue: ఐగుప్తులో దేవుడు ప్రజలను ὕψωσεν చేయడం
  choice: ఆ ప్రజలను గొప్పగా చేశాడు
  alternative: ఆ ప్రజలను హెచ్చించాడు / విస్తరింపజేశాడు
  rationale: ఈ క్రియ స్థాయి పెంపును గానీ సంఖ్యావృద్ధిని గానీ సూచించవచ్చు. ప్రధాన పాఠం ఆ రెండు అవకాశాల్లో ఒకదానిని అనవసరంగా ఖరారు చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలి. ‘పితరులు,’ ‘బాహువు’ వంటి బైబిలు-చారిత్రక పదాలను సందర్భ గౌరవార్థం ఉంచి, వాటి అర్థసంభావ్యతలను పాదటీపుల్లో స్పష్టం చేశాం. గ్రీకు వాక్యంలోని మూడు సమన్విత క్రియలను అర్ధవిరామాలతో ఒకే వాక్యంగా నిలిపాం.
