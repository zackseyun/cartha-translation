id: ACT.13.15
reference: Acts 13:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μετὰ δὲ τὴν ἀνάγνωσιν τοῦ νόμου καὶ τῶν προφητῶν ἀπέστειλαν οἱ ἀρχισυνάγωγοι πρὸς αὐτοὺς λέγοντες· Ἄνδρες ἀδελφοί, εἴ ⸀τίς ἐστιν ⸂ἐν ὑμῖν λόγος⸃ παρακλήσεως πρὸς τὸν λαόν, λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/015.yaml
  text: After the reading of the Law and the Prophets[a], the synagogue rulers sent word to them, saying, “Brothers, if there is among you any word of encouragement for the people[b], speak.”
translation:
  language: te
  text: 'ధర్మశాస్త్రం మరియు ప్రవక్తల గ్రంథాల పఠనం తరువాత, సమాజమందిరపు నాయకులు వారికి కబురు పంపిస్తూ ఇలా అన్నారు: “సోదరులారా,[a] ప్రజలకు చెప్పడానికి మీలో ఎవరికైనా ప్రోత్సాహం ఇచ్చే సందేశం[b] ఉంటే చెప్పండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో పదశః “పురుషులారా, సోదరులారా”; ఇది గౌరవంతో కూడిన ఆత్మీయ సంబోధన.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ప్రబోధ సందేశం.” గ్రీకు పదబంధం ప్రోత్సాహం, ప్రబోధం అనే రెండు భావాలనూ కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγνωσιν
  choice: చదివిన తరువాత
  rationale: సమాజమందిర ఆరాధనలో లేఖనాలను బహిరంగంగా చదవడాన్ని సందర్భం స్పష్టం చేస్తుంది; తెలుగులో సహజంగా క్రియారూపంలో వ్యక్తం చేశాం.
- source_word: τοῦ νόμου καὶ τῶν προφητῶν
  choice: ధర్మశాస్త్రం, ప్రవక్తల గ్రంథాలు
  rationale: యూదుల లేఖనాల్లో గుర్తింపుపొందిన రెండు విభాగాలను సూచిస్తుంది. ‘ప్రవక్తల గ్రంథాలు’ అని చెప్పడం వల్ల ఇక్కడ ప్రవక్తల వ్యక్తుల కంటే వారి లేఖనాలు చదివారనే భావం స్పష్టమవుతుంది.
- source_word: ἀρχισυνάγωγοι
  choice: సమాజమందిరపు నాయకులు
  rationale: సమాజమందిరపు కార్యక్రమాన్ని పర్యవేక్షించే అధికారులను సూచించే సహజమైన ఆధునిక తెలుగు పదబంధం.
- source_word: ἀπέστειλαν ... πρὸς αὐτοὺς λέγοντες
  choice: వారి దగ్గరికి కబురు పంపి ఇలా అన్నారు
  rationale: భౌతికంగా ఎవరినో పంపడం కంటే వారికి ఆహ్వాన సందేశం పంపించారనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: Ἄνδρες ἀδελφοί
  choice: సోదరులారా
  rationale: గౌరవంతో కూడిన పురుష సంబోధనను సహజంగా నిలుపుతుంది; గ్రీకు పదశః రూపాన్ని పాదసూచికలో తెలిపాం.
- source_word: εἴ τίς ἐστιν ἐν ὑμῖν
  choice: మీలో ఎవరి దగ్గరైనా ... ఉంటే
  rationale: గ్రీకు భాషలోని ‘మీలో ఏదైనా ఉంటే’ అనే నిర్మాణాన్ని తెలుగులో సహజమైన వ్యక్తిగత నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: λόγος παρακλήσεως
  choice: ప్రోత్సాహం ఇచ్చే సందేశం
  rationale: παράκλησιςలో ప్రోత్సాహం, బోధపూర్వక ప్రబోధం అనే రెండు ఛాయలూ ఉండగలవు. ప్రధాన పాఠంలో విస్తృతంగా అర్థమయ్యే రూపాన్ని ఇచ్చి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: πρὸς τὸν λαόν
  choice: ప్రజల కోసం
  rationale: సందేశం ఉద్దేశించబడిన శ్రోతలను సూచిస్తుంది; తెలుగు వాక్యంలో సహజంగా ఉంది.
- source_word: λέγετε
  choice: చెప్పండి
  rationale: సమావేశాన్ని ఉద్దేశించి మాట్లాడమనే ఆహ్వానార్థక ఆజ్ఞను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సమాజమందిర సందర్భంలోని లింగసూచక సంబోధన
  choice: సోదరులారా
  alternative: సోదర సోదరీమణులారా
  rationale: Ἄνδρες ἀδελφοί స్పష్టంగా పురుషలింగ సంబోధన; మాట్లాడమని ఆహ్వానించబడుతున్న పౌలు, అతని సహచరులను ఉద్దేశించింది. అందువల్ల మూలంలోని లింగసూచనను సాధారణీకరించలేదు.
- issue: παράκλησις పదంలోని అర్థ వైవిధ్యం
  choice: ప్రోత్సాహం ఇచ్చే సందేశం
  alternative: ప్రబోధ సందేశం
  rationale: ఈ పదం ఆదరణ లేదా ప్రోత్సాహంతో పాటు హెచ్చరికతో కూడిన ప్రబోధాన్నీ సూచించగలదు. ప్రధాన పాఠంలో ఒక అర్థాన్ని సహజంగా ఇచ్చినా, మరొక నిజమైన అవకాశాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘సమాజమందిరం,’ ‘ధర్మశాస్త్రం’ వంటి స్థిరమైన బైబిలు సందర్భ పదాలను నిలుపుతూ, వాక్య నిర్మాణాన్ని సహజమైన తెలుగుకు అనుగుణంగా మార్చాం.
