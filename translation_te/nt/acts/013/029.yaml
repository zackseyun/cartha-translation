id: ACT.13.29
reference: Acts 13:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς δὲ ἐτέλεσαν πάντα τὰ περὶ αὐτοῦ γεγραμμένα, καθελόντες ἀπὸ τοῦ ξύλου ἔθηκαν εἰς μνημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/029.yaml
  text: And when they had carried out all that had been written concerning him[a], they took him down from the tree and laid him in a tomb.
translation:
  language: te
  text: వారు ఆయన గురించి రాయబడినవన్నీ నెరవేర్చినప్పుడు, ఆయనను చెట్టు నుండి దించి సమాధిలో ఉంచారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సిలువ.” గ్రీకు పదం ξύλον అక్షరార్థంగా “చెట్టు” లేదా “కలప”; అది మరణశిక్ష అమలు చేసే చెక్క సాధనాన్ని కూడా సూచించవచ్చు. ఇక్కడ ద్వితీయోపదేశకాండము 21:23 ప్రతిధ్వని ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: తరువాత
  rationale: సందర్భంలో ముందుగా జరిగిన కార్యాల అనంతర క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐτέλεσαν
  choice: నెరవేర్చిన
  rationale: వారు తమ చర్యల ద్వారా రాయబడిన సంగతులను పూర్తిగా కార్యరూపంలోకి తెచ్చారనే భావాన్ని ఇస్తుంది; ప్రవచన నెరవేర్పు నిగూఢార్థాన్నీ నిలుపుతుంది.
- source_word: πάντα τὰ περὶ αὐτοῦ γεγραμμένα
  choice: ఆయన గురించి రాయబడినవన్నీ
  rationale: యేసును గురించిన లేఖన విషయాల సమగ్రతను సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: καθελόντες
  choice: దించి
  rationale: ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను తెలుగు క్రియాక్రమంలో సహజంగా చూపుతుంది.
- source_word: ἀπὸ τοῦ ξύλου
  choice: మాను మీదనుండి
  rationale: ξύλον అనే పదంలోని ‘చెట్టు/కలప’ భావాన్ని, ఉరితీయడానికి ఉపయోగించిన కలప సాధనాన్ని సూచించే బైబిలీయ ప్రయోగాన్ని నిలుపుతుంది; ‘సిలువ’ అని నేరుగా వ్యాఖ్యానించదు.
- source_word: ἔθηκαν
  choice: ఉంచారు
  rationale: దేహాన్ని సమాధిలో పెట్టడాన్ని ఆధునిక తెలుగులో సహజంగా, గౌరవంగా తెలియజేస్తుంది.
- source_word: εἰς μνημεῖον
  choice: ఒక సమాధిలో
  rationale: ఈ సందర్భంలో μνημεῖον మృతదేహాన్ని ఉంచే సమాధిని సూచిస్తుంది.
theological_decisions:
- issue: యేసు మరణ సాధనాన్ని సూచించే ξύλον అనువాదం
  choice: మాను
  alternative: సిలువ
  rationale: మూలంలో σταυρός కాక ξύλον ఉంది. ‘మాను’ దాని చెట్టు/కలప భావాన్నీ ద్వితీయోపదేశకాండము 21:23తో ఉండగల ప్రతిధ్వనినీ నిలుపుతుంది; సందర్భానుసారమైన సాధారణ ప్రత్యామ్నాయం ‘సిలువ’ను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘మాను’ కొంత బైబిలీయ గంభీరత కలిగిన పదమైనప్పటికీ, ξύλον యొక్క ఉద్దేశపూర్వక పదప్రయోగాన్ని నిలుపడానికి ఎంచుకోబడింది; పాదసూచిక సాధారణ పాఠకునికి సందర్భాన్ని స్పష్టం చేస్తుంది.
