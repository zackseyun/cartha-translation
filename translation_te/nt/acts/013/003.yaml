  text: τότε νηστεύσαντες καὶ προσευξάμενοι καὶ ἐπιθέντες τὰς χεῖρας αὐτοῖς ἀπέλυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/003.yaml
  text: Then[a], after fasting and praying and laying their hands on them, they sent them off.
translation:
  language: te
  text: అప్పుడు వారు ఉపవాసముండి, ప్రార్థించి, వారిమీద చేతులు ఉంచి, వారిని పంపివేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారిని విడిచిపెట్టారు,” లేదా “వారిని వెళ్లనిచ్చారు.” ఈ సందర్భంలో బర్నబా, సౌలు తమ పరిచర్య ప్రయాణానికి బయలుదేరేందుకు వారిని వెళ్లనిచ్చారనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: మునుపటి ప్రవచనాత్మక ఆదేశం తరువాత జరిగిన చర్యను సహజమైన కాలక్రమ సూచనతో తెలియజేస్తుంది.
- source_word: νηστεύσαντες
  choice: ఉపవాసముండి
  rationale: ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను తెలుగులో సహజమైన పూర్వకాల క్రియారూపంతో వ్యక్తం చేస్తుంది.
- source_word: προσευξάμενοι
  choice: ప్రార్థించి
  rationale: ఉపవాసం, చేతులు ఉంచడం అనే సిద్ధపాటు చర్యలతో సమన్వయంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: ἐπιθέντες τὰς χεῖρας αὐτοῖς
  choice: వారిమీద చేతులు ఉంచి
  rationale: నిర్దిష్టమైన సంఘపరమైన లేదా సంస్కారపరమైన అర్థాన్ని చేర్చకుండా, మూలంలోని స్పష్టమైన శారీరక చర్యను నిలుపుతుంది.
- source_word: ἀπέλυσαν
  choice: వారిని పంపించారు
  rationale: ఈ సందర్భంలో బర్నబా, సౌలు పరిచర్య ప్రయాణానికి బయలుదేరేలా చేసిన భావాన్ని సహజంగా ఇస్తుంది; ‘విడిచిపెట్టారు’ లేదా ‘వీడ్కోలు చెప్పారు’ అనే అర్థసాధ్యతను పాదటీపులో నిలుపుతుంది.
- source_word: αὐτοῖς
  choice: వారిమీద
  rationale: చేతులు ఉంచే చర్యకు సంబంధించిన దత్తివాచక సర్వనామాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; సూచితులు బర్నబా, సౌలు.
theological_decisions:
- issue: చేతులు ఉంచిన చర్య స్వభావం
  choice: నిర్దిష్ట మతసంస్కార లేదా అభిషేక సిద్ధాంతాన్ని చేర్చకుండా చర్యను వర్ణనాత్మకంగా అనువదించడం
  alternative: అభిషేకం, ఆశీర్వాదం, లేదా అధికారిక నియామకం అని స్పష్టీకరించడం
  rationale: వచనం ఉపవాసం, ప్రార్థన, చేతులు ఉంచడం, పంపించడం గురించి చెబుతుంది; అయితే ఆ చర్యకు ఖచ్చితమైన సంఘపరమైన లేదా సంస్కారపరమైన హోదాను స్వయంగా నిర్వచించదు.
- issue: ἀπέλυσαν యొక్క సందర్భార్థం
  choice: వారిని పంపించారు
  alternative: వారిని విడిచిపెట్టారు లేదా వారిని వెళ్లనిచ్చారు
  rationale: మిషన్ సందర్భంలో ‘పంపించారు’ సహజంగా ఉన్నప్పటికీ, గ్రీకు క్రియలోని ‘విడిచిపెట్టడం/వెళ్లనివ్వడం’ అనే భావాన్ని పాదటీపు ద్వారా భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. వరుసగా ఉన్న గ్రీకు భూతకాల కృదంతాలను ‘ఉపవాసముండి, ప్రార్థించి, ... ఉంచి’ అనే తెలుగు క్రియాశ్రేణితో అందించి, ప్రధాన క్రియను చివర ఉంచాం.
