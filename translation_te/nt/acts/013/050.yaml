id: ACT.13.50
reference: Acts 13:50
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ Ἰουδαῖοι παρώτρυναν τὰς σεβομένας ⸀γυναῖκας τὰς εὐσχήμονας καὶ τοὺς πρώτους τῆς πόλεως καὶ ἐπήγειραν διωγμὸν ἐπὶ τὸν Παῦλον ⸀καὶ Βαρναβᾶν, καὶ ἐξέβαλον αὐτοὺς ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/050.yaml
  text: But the Jews stirred up the devout women of high standing and the leading men of the city[b][a], and stirred up persecution against Paul and Barnabas and drove them out of their district.
translation:
  language: te
  text: అయితే యూదులు భక్తిగల, ఉన్నత స్థాయిగల స్త్రీలను[a], పట్టణంలోని ప్రముఖ పురుషులను రెచ్చగొట్టారు. పౌలు, బర్నబాలకు వ్యతిరేకంగా హింసను రేపి, వారిని పట్టణ ప్రాంతం నుండి వెళ్లగొట్టారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవునికి భయపడే స్త్రీలను.” ఈ పదబంధం ఇశ్రాయేలు దేవుణ్ణి ఆరాధించిన, బహుశా సమాజమందిరంతో అనుబంధమున్న అన్యజాతి స్త్రీలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “పట్టణ ప్రాంతం” అని అనువదించిన గ్రీకు పదం “సరిహద్దులు,” “భూభాగం,” లేదా ఆ సరిహద్దులలోని ప్రాంతాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρώτρυναν
  choice: రెచ్చగొట్టారు
  rationale: ఇతరులను శత్రుత్వపూరిత చర్యకు ప్రేరేపించిన క్రియాశీల ఒత్తిడిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: σεβομένας γυναῖκας
  choice: భక్తిగల ... స్త్రీలను
  rationale: దేవునిపట్ల భక్తితో ఆరాధించే స్త్రీలను సూచిస్తుంది; వారు సమాజమందిరంతో అనుబంధమున్న అన్యజనులే అని ప్రధాన పాఠ్యంలో ఖచ్చితంగా నిర్ణయించదు.
- source_word: εὐσχήμονας
  choice: ఉన్నత సామాజిక స్థానం కలిగిన
  rationale: ఈ సందర్భంలో గౌరవనీయతతో పాటు సామాజిక ప్రాముఖ్యతను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τοὺς πρώτους τῆς πόλεως
  choice: పట్టణంలోని ప్రముఖ పురుషులను
  rationale: పట్టణ పౌరజీవితంలో ముందున్నవారిని సూచిస్తూ, గ్రీకులోని పురుషలింగ సూచనను నిలుపుతుంది.
- source_word: ἐπήγειραν διωγμὸν
  choice: హింసను రేపి
  rationale: హింస తలెత్తేలా చేసిన కారణార్థక బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐπὶ τὸν Παῦλον καὶ Βαρναβᾶν
  choice: పౌలు, బర్నబాలకు వ్యతిరేకంగా
  rationale: హింస ఎవరిని లక్ష్యంగా చేసుకుందో స్పష్టంగా చూపిస్తుంది.
- source_word: ἐξέβαλον
  choice: వెళ్లగొట్టారు
  rationale: బలవంతంగా బయటకు పంపిన భావాన్ని సాధారణ ఆధునిక తెలుగులో బలంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: తమ ప్రాంతం నుండి
  rationale: ὅρια అనే పదానికి సాధ్యమైన సరిహద్దులు/ప్రాంతం అనే భావాలలో, ఇక్కడ స్థానిక అధికార పరిధిని సహజంగా సూచిస్తుంది.
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: అయితే యూదులు
  rationale: మునుపటి వచనంలోని అనుకూల స్పందనకు విరుద్ధంగా కథనంలో వచ్చిన మలుపును తెలియజేస్తుంది.
theological_decisions:
- issue: σεβομένας అనే పదం సూచించే మతపరమైన స్థితి
  choice: భక్తిగల స్త్రీలు
  alternative: దేవునికి భయపడే స్త్రీలు
  rationale: వారు ఇశ్రాయేలు దేవుణ్ణి ఆరాధించినవారని సూచిస్తూ, సమాజమందిరంతో అనుబంధమున్న అన్యజనులనే సాంకేతిక గుర్తింపును ప్రధాన పాఠ్యంలో బలవంతంగా విధించదు.
- issue: పట్టణ ప్రముఖులకు సంబంధించిన పురుషలింగ సూచన
  choice: ప్రముఖ పురుషులు
  alternative: పట్టణ నాయకులు
  rationale: గ్రీకు మూలంలోని స్పష్టమైన పురుషలింగ బహువచనాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. పొడవైన గ్రీకు వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; చర్యల క్రమం, విరుద్ధ కథన మలుపు, బలవంతపు బహిష్కరణ భావం నిలుపబడ్డాయి.
