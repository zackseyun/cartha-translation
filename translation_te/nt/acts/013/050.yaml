revisions:
- from: అయితే యూదులు భక్తిగల, ఉన్నత సామాజిక స్థానం కలిగిన స్త్రీలను[a], పట్టణంలోని ప్రముఖ పురుషులను రెచ్చగొట్టారు. పౌలు, బర్నబాలకు వ్యతిరేకంగా హింసను రేపి, వారిని తమ ప్రాంతం నుండి వెళ్లగొట్టారు.[b]
  to: అయితే యూదులు భక్తిగల, ఉన్నత స్థాయిగల స్త్రీలను[a], పట్టణంలోని ప్రముఖ పురుషులను రెచ్చగొట్టారు. పౌలు, బర్నబాలకు వ్యతిరేకంగా హింసను రేపి, వారిని పట్టణ ప్రాంతం నుండి వెళ్లగొట్టారు.[b]
  rationale: ప్రధాన సవరణ αὐτῶν యొక్క సూచనను తెలుగులో అస్పష్టత లేకుండా చేయడానికే. «పట్టణ ప్రాంతం» ὅριαకు ఉన్న ‘ప్రాంతం/సరిహద్దులు’ అనే భావవ్యాప్తిని పాదటిప్పణిలో కాపాడుతూ, పౌలు బర్నబాల స్వంత ప్రాంతం అన్న తప్పు పఠనాన్ని నివారించింది. εὐσχήμονας కోసం స్వల్ప శైలీ సవరణ చేశాం; మూలార్థంలో మార్పు లేదు.
