  text: And after destroying seven nations in the land of Canaan[a], he gave them their land as an inheritance.
translation:
  language: te
  text: కనాను దేశంలో ఏడు జనాంగాలను నాశనం చేసిన తరువాత, ఆయన వారి భూమిని ఇశ్రాయేలీయులకు స్వాస్థ్యంగా ఇచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన వారి భూమిని స్వాస్థ్యంగా కేటాయించాడు.” గ్రీకు క్రియ స్వాస్థ్యంగా పంచడం లేదా కేటాయించడం అనే భావాన్ని నొక్కిచెప్పగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: నాశనం చేసిన తరువాత
  rationale: καθαιρέω ఇక్కడ కనాను జనాలపై దేవుడు చేసిన జయకార్యాన్ని సూచిస్తుంది. ‘నాశనం చేసిన’ అనేది దాని బలాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ‘పడగొట్టిన’ కూడా సాధ్యమే గాని ఈ సందర్భంలో తక్కువ నిర్ణాయకంగా వినిపించవచ్చు.
- source_word: ἔθνη ἑπτὰ
  choice: ఏడు జనాలను
  rationale: ἔθνη అనేది ‘జనాలు’ లేదా ‘దేశాలు’ అని అర్థం కావచ్చు. ఇక్కడ భూభాగాలకన్నా కనానులో నివసించిన ప్రజాసమూహాలు ఉద్దేశించబడినందున ‘ఏడు జనాలు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: ἐν γῇ Χανάαν
  choice: కనాను దేశంలో
  rationale: మూలంలోని γῇ (‘దేశం/భూమి’)ను విడిచిపెట్టకుండా, తెలుగులో సహజంగా ‘కనాను దేశంలో’ అని అనువదించబడింది.
- source_word: κατεκληρονόμησεν
  choice: స్వాస్థ్యంగా ఇచ్చాడు
  rationale: ఈ క్రియ వారసత్వ హక్కుగా కేటాయించడం లేదా పంచివ్వడం అనే భావాన్ని కలిగి ఉంది. ప్రధాన పాఠం స్వాస్థ్య భావాన్ని నిలుపుతూ దేవుడు ఆ దేశాన్ని ఇశ్రాయేలీయులకు ఇచ్చాడనే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది; కేటాయింపు భావం పాదసూచికలో ఇవ్వబడింది.
- source_word: τὴν γῆν αὐτῶν
  choice: వారి దేశాన్ని
  rationale: αὐτῶν ఇప్పుడే ప్రస్తావించిన ఏడు జనాలను సూచిస్తుంది. అందువల్ల ‘వారి దేశాన్ని’ అనేది నేరుగా, సహజంగా ఉన్న అనువాదం.
theological_decisions:
- issue: క్రియల కర్త మరియు స్వాస్థ్యాన్ని పొందినవారు
  choice: రెండు క్రియలకూ దేవుడే కర్త; ఏడు జనాల దేశాన్ని ఇశ్రాయేలీయులకు స్వాస్థ్యంగా ఇచ్చాడు.
  alternative: దేవుడు వారి దేశాన్ని స్వాస్థ్యంగా కేటాయించాడు; గ్రీసు వాక్యంలో స్వీకర్త స్పష్టంగా పేర్కొనబడలేదు.
  rationale: సమీప సందర్భం ఇశ్రాయేలు చరిత్రలో దేవుడు చేసిన కార్యాలను వివరిస్తుంది. మూల గ్రీకులో పరోక్ష కర్మ స్పష్టంగా లేకపోయినా, చారిత్రక సందర్భంలో ఇశ్రాయేలీయులే ఆ దేశాన్ని పొందినవారు. వారిని ప్రధాన పాఠంలో పేర్కొనడం సందర్భాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది; క్రియలోని కేటాయింపు భావాన్ని పాదసూచిక నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘స్వాస్థ్యం’ అనే బైబిలు సందర్భానికి తగిన పదాన్ని నిలుపుతూ, వాక్య నిర్మాణాన్ని సహజంగా ఉంచాం.
