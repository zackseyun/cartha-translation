id: ACT.13.25
reference: Acts 13:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς δὲ ἐπλήρου ⸀Ἰωάννης τὸν δρόμον, ἔλεγεν· ⸂Τί ἐμὲ⸃ ὑπονοεῖτε εἶναι; οὐκ εἰμὶ ἐγώ· ἀλλ’ ἰδοὺ ἔρχεται μετ’ ἐμὲ οὗ οὐκ εἰμὶ ἄξιος τὸ ὑπόδημα τῶν ποδῶν λῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/025.yaml
  text: And as John was completing his course[a], he kept saying, ‘What do you suppose me to be? I am not he. But look, one is coming after me[b], the sandals of whose feet I am not worthy to untie.’
translation:
  language: te
  text: 'యోహాను తన పరుగును పూర్తి చేస్తుండగా ఇలా చెబుతూ ఉండేవాడు: “నేను ఎవరినని మీరు అనుకుంటున్నారు? నేను కాదు.[a] అయితే ఇదిగో, నా తరువాత ఒకరు వస్తున్నారు. ఆయన పాదాల చెప్పులను[b] విప్పడానికి కూడా నేను తగినవాణ్ణి కాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, భావాన్ని మరింత స్పష్టంగా చెప్పాలంటే, “నేను ఎవరినని మీరు అనుకుంటున్నారు? నేను మెస్సీయను కాను.” గ్రీకు పాఠ్యం యోహాను నిరాకరించిన గుర్తింపును స్పష్టంగా పేర్కొనదు; అయితే సందర్భం మెస్సీయను సూచిస్తోంది.
    reason: alternative_reading
  - marker: b
    text: కొన్ని ప్రతులు, అనువాదాలు దీన్ని మరింత నిర్దిష్టంగా “ఆయన చెప్పుల పట్టీని విప్పడానికి” అని ఇస్తాయి. అయితే ఇక్కడ ముద్రిత గ్రీకు పాఠ్యంలో ‘పట్టీ’ అనే పదం లేదు; అది కేవలం “ఆయన పాదాల చెప్పు/చెప్పులు ... విప్పడానికి” అని చెబుతుంది.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήρου ... τὸν δρόμον
  choice: తన పరుగును పూర్తి చేస్తుండగా
  rationale: πληρόω పూర్తికి తీసుకురావడాన్ని, δρόμος రూపకాలంకారంగా నియమిత జీవనకార్యం లేదా పరిచర్యను సూచిస్తాయి. ‘పరుగు’ అనే రూపకాన్ని నిలుపుతూ, అసంపూర్ణ భూతకాల క్రియ యొక్క కొనసాగుతున్న భావాన్ని ‘పూర్తి చేస్తుండగా’ తెలియజేస్తుంది.
- source_word: ἔλεγεν
  choice: చెబుతూ ఉండేవాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పదేపదే చేసిన ప్రకటనను సూచిస్తుంది; తెలుగు సహజ ప్రయోగంలో ఈ భావాన్ని ‘చెబుతూ ఉండేవాడు’ స్పష్టంగా అందిస్తుంది.
- source_word: Τί ἐμὲ ὑπονοεῖτε εἶναι;
  choice: నేను ఎవరినని మీరు అనుకుంటున్నారు?
  rationale: τί అక్షరార్థంగా ‘ఏమి’ అయినా, ఇక్కడ వ్యక్తి గుర్తింపును ప్రశ్నిస్తోంది. ఆధునిక తెలుగులో ‘ఎవరినని’ సహజంగా ఉండి, యోహానుకు శ్రోతలు ఏ గుర్తింపును ఆపాదిస్తున్నారో తెలియజేస్తుంది.
- source_word: οὐκ εἰμὶ ἐγώ
  choice: నేను కాను
  rationale: గ్రీకు వాక్యం నిరాకరించిన గుర్తింపును పేరుపెట్టి చెప్పకుండా సంక్షిప్తంగా, నొక్కిచెబుతుంది. తెలుగు అనువాదం కూడా ‘మెస్సీయ’ అని ప్రధాన పాఠ్యంలో చేర్చకుండా ఆ అస్పష్టతను నిలుపుతుంది.
- source_word: ἀλλ’ ἰδοὺ
  choice: అయితే ఇదిగో
  rationale: ἰδού శ్రద్ధను ఆకర్షించే సూచనాత్మక పదం. ‘ఇదిగో’ ఆధునిక ప్రమాణ తెలుగులో సహజంగానూ గంభీరంగానూ ఆ బలాన్ని నిలుపుతుంది.
- source_word: ἔρχεται μετ’ ἐμὲ
  choice: నా తరువాత ఒకరు వస్తున్నారు
  rationale: వర్తమానకాలం సమీపిస్తున్న రాకను సజీవంగా చూపుతుంది. గ్రీకులో సూచితమైన కర్తను తెలుగులో ‘ఒకరు’ అని సహజంగా వ్యక్తం చేసింది.
- source_word: οὗ ... τὸ ὑπόδημα τῶν ποδῶν λῦσαι
  choice: ఆయన పాదాల చెప్పులను ... విప్పడానికి
  rationale: ὑπόδημα చెప్పు లేదా పాదరక్షను సూచిస్తుంది; తెలుగు సహజ ప్రయోగం కోసం బహువచనమైన ‘చెప్పులను’ వాడింది. λύω ఇక్కడ కట్టిన చెప్పులను విప్పడాన్ని సూచిస్తుంది. మూలపాఠ్యంలో లేని ‘పట్టీ’ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: ἄξιος
  choice: తగినవాణ్ణి
  rationale: ἄξιος యోగ్యత లేదా అర్హతను సూచిస్తుంది. ‘తగినవాణ్ణి కాను’ యోహాను వినయాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: οὐκ εἰμὶ ἐγώలో యోహాను నిరాకరించిన గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో గుర్తింపును పేరుపెట్టి చెప్పకుండా ‘నేను కాను’ అని ఉంచడం
  alternative: ‘నేను మెస్సీయను కాను’ లేదా ‘నేను ఆయనను కాను’
  rationale: సందర్భం మెస్సీయను సూచిస్తున్నప్పటికీ గ్రీకు పాఠ్యం ఆ పేరును స్పష్టంగా చెప్పదు. అందువల్ల ప్రధాన పాఠ్యం ఆ సంక్షిప్తతను, అంతర్లీనతను నిలుపుతుంది; అడుగుసూచన సంభావ్య సూచనను వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని వాడింది. ‘పరుగు’ అనే మూల రూపకాన్ని నిలిపింది; పునరుక్త లేదా కొనసాగుతున్న సాక్ష్యాన్ని ‘చెబుతూ ఉండేవాడు’గా తెలిపింది. ప్రధాన పాఠ్యంలో మెస్సీయ గుర్తింపును అనవసరంగా స్పష్టం చేయలేదు. అడుగుసూచిక [a] సంబంధిత నిరాకరణ తరువాత, [b] సంబంధిత చెప్పుల పదబంధం తరువాత ఉంచబడ్డాయి.
