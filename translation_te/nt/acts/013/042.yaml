source:
  edition: SBLGNT
  text: Ἐξιόντων δὲ ⸀αὐτῶν ⸀παρεκάλουν εἰς τὸ μεταξὺ σάββατον λαληθῆναι αὐτοῖς τὰ ῥήματα ⸀ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/042.yaml
  text: As they were going out[b][a], they were urging that these words be spoken to them on the next Sabbath.
translation:
  language: te
  text: వారు బయటికి వెళ్తుండగా[a][b], ఈ మాటలను తరువాతి విశ్రాంతిదినాన వారికి చెప్పాలని వారు ఎంతో వేడుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో మరింత స్పష్టంగా, “పౌలు, బర్నబా బయటికి వెళ్తుండగా, ఈ మాటలను తరువాతి విశ్రాంతిదినాన తమకు చెప్పాలని ప్రజలు వేడుకున్నారు” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: లేదా, “వారు వెళ్లిపోతుండగా, ఈ విషయాలను రాబోయే విశ్రాంతిదినాన వారికి చెప్పాలని వారు అడిగారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξιόντων
  choice: బయటికి వెళ్తుండగా
  rationale: వర్తమాన కృదంతంతో ఉన్న జనిటివ్ అబ్సల్యూట్ నిర్మాణాన్ని కాలసూచక ఉపవాక్యంగా సహజంగా అనువదిస్తుంది; కొనసాగుతున్న క్రియాభావాన్ని కూడా నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించకుండా కాలసూచక నిర్మాణంలో కలపడం
  rationale: ఇక్కడ δέ స్వల్ప అనుసంధానకంగా పనిచేస్తుంది; తెలుగులో దానిని వేరుగా ‘అప్పుడు’ లేదా ‘మరి’ అని చేర్చడం అవసరానికి మించిన బలాన్ని ఇస్తుంది.
- source_word: αὐτῶν
  choice: వారు
  rationale: మూలపాఠంలోని సర్వనామ సూచనను వ్యక్తుల పేర్లతో స్పష్టీకరించకుండా ఉంచి, పాఠ్యపరమైన మరియు సందర్భపరమైన సందిగ్ధతను కాపాడుతుంది.
- source_word: παρεκάλουν
  choice: ఎంతో వేడుకున్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగిన లేదా పదేపదే చేసిన మనవిని సూచిస్తుంది. సందర్భంలో παρακαλέω ఓదార్చడం కాక earnest request అనే భావాన్ని ఇస్తుంది.
- source_word: εἰς τὸ μεταξὺ σάββατον
  choice: తరువాతి విశ్రాంతిదినాన
  rationale: ఈ కాలసూచక నుడికారం మధ్యలో రాబోయే, అంటే తదుపరి, సబ్బాతును సూచిస్తుంది. ‘తరువాతి విశ్రాంతిదినాన’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: λαληθῆναι
  choice: చెప్పాలని
  rationale: తెలుగులో కర్తరహిత అనుబంధ క్రియారూపం సందర్భానుసారంగా గ్రీకు కర్మణి infinitive భావాన్ని సహజంగా తెలియజేస్తుంది; ‘చెప్పబడాలని’ కంటే సాధారణ పాఠకునికి సులభం.
- source_word: αὐτοῖς
  choice: తమకు
  rationale: మనవి చేసినవారికే ఆ మాటలు చెప్పాలనే దత్తివాచక భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; వారి నిర్దిష్ట గుర్తింపును మాత్రం నిర్ణయించదు.
- source_word: τὰ ῥήματα ταῦτα
  choice: ఈ మాటలను
  rationale: ῥήματα యొక్క మాటలు/పలుకులు అనే భావానికి దగ్గరగా ఉండి, పౌలు అప్పుడే పలికిన ప్రసంగాన్ని సూచిస్తుంది; ‘ఈ సందేశాన్ని’ కంటే తక్కువ వ్యాఖ్యాత్మకం.
theological_decisions:
- issue: ఈ వచనంలోని సర్వనామాలు ఎవరిని సూచిస్తున్నాయి?
  choice: ప్రధాన పాఠంలో ‘వారు’ అని ఉంచి, బయటికి వెళ్తున్నవారు ఎవరో పేర్లతో నిర్ధారించలేదు.
  alternative: పౌలు, బర్నబా బయటికి వెళ్తుండగా ప్రజలు వారిని వేడుకున్నారని స్పష్టంగా పేర్కొనడం.
  rationale: ఈ పాఠరూపం వ్యక్తులను పేర్లతో పేర్కొనదు; అంతేకాక ఇక్కడ పాఠ్యభేదం, సూచనభేదం ఉన్నాయి. కాబట్టి మూలంలోని నిజమైన సందిగ్ధతను ప్రధాన పాఠం పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘విశ్రాంతిదినం’ అనే సుపరిచిత బైబిలు పదాన్ని ఉంచుతూ, సర్వనామాల విషయంలో మూలపాఠపు సందిగ్ధతను ఉద్దేశపూర్వకంగా కాపాడాం.
