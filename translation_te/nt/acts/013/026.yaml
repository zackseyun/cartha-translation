  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, υἱοὶ γένους Ἀβραὰμ καὶ οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν, ⸀ἡμῖν ὁ λόγος τῆς σωτηρίας ταύτης ⸀ἐξαπεστάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/026.yaml
  text: Brothers[a], sons of the family of Abraham, and those among you who fear God[c][b], to us the message of this salvation has been sent.
translation:
  language: te
  text: సోదరులారా[a], అబ్రాహాము వంశపు కుమారులారా, మీలో దేవునికి భయపడేవారూ[b], ఈ రక్షణ సందేశం[c] మనకు[d] పంపబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘పురుషులారా, సోదరులారా.’ గ్రీకు సంబోధన పురుషలింగంలో ఉంది; అయితే ఇది అక్కడ కూడిన విస్తృత శ్రోతల సమూహాన్ని కూడా ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మీలోని దేవభయస్థులారా.’ ఇది ఇశ్రాయేలు దేవుణ్ణి ఆరాధిస్తూ యూదుల సమాజమందిరంతో సంబంధం కలిగిన అన్యజనులను సూచించే చారిత్రక పదప్రయోగం కావచ్చు.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘ఈ రక్షణ వాక్యం.’
    reason: lexical_alternative
  - marker: d
    text: గ్రీకు పదం శ్రోతలను కలుపుతుందో లేదో ప్రత్యేకంగా చూపదు; అందువల్ల ‘మాకు’ అని కూడా అనువదించవచ్చు.
    reason: linguistic_note
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: సోదరులారా
  rationale: ఇది పురుషలింగ సంబోధన అయినప్పటికీ, తెలుగులో సహజమైన బహువచన సంబోధనగా ‘సోదరులారా’ మూలంలోని బంధుత్వ భావాన్ని నిలుపుతుంది; అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: υἱοὶ γένους Ἀβραὰμ
  choice: అబ్రాహాము వంశపు కుమారులారా
  rationale: υἱοί లోని ‘కుమారులు’ అనే స్పష్టమైన పురుషలింగ బంధుత్వ పదాన్నీ, γένος లోని వంశపారంపర్య భావాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν
  choice: మీలో దేవునికి భయపడేవారూ
  rationale: చారిత్రకంగా ఇది అన్యజనులైన సమాజమందిర అనుయాయులకు వాడిన అర్ధసాంకేతిక పదం కావచ్చు; అయినా గ్రీకు వాక్యాన్ని మొదట వివరణాత్మకంగానే అనువదించడం అర్థాన్ని ముందే పరిమితం చేయదు.
- source_word: ὁ λόγος τῆς σωτηρίας ταύτης
  choice: ఈ రక్షణ సందేశం
  rationale: λόγος ఇక్కడ ప్రకటించబడిన విషయం లేదా సందేశాన్ని సూచిస్తుంది. ‘సందేశం’ ఆధునిక తెలుగులో సహజంగా ఉండగా, ‘వాక్యం’ అనే దగ్గరి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: ἡμῖν
  choice: మనకు
  rationale: గ్రీకు మొదటి పురుష బహువచనం శ్రోతలను కలుపుతుందో లేదో వ్యాకరణపరంగా ప్రత్యేకంగా చూపదు. ప్రసంగ సందర్భంలో పౌలు తననూ శ్రోతలనూ కలిపి మాట్లాడుతున్నట్లు ‘మనకు’ సహజంగా ఉంది; తెలుగు భేదం వల్ల ఏర్పడే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: ἐξαπεστάλη
  choice: పంపబడింది
  rationale: అయోరిస్ట్ కర్మణి రూపం రక్షణ సందేశం పంపబడిన పూర్తయిన చర్యను తెలియజేస్తుంది; తెలుగు సాధారణ భూతకాల కర్మణి రూపం దానిని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవునికి భయపడేవారి గుర్తింపు
  choice: ‘మీలో దేవునికి భయపడేవారూ’ అని వివరణాత్మకంగా అనువదించడం
  alternative: ‘మీలోని దేవభయస్థులారా’ అనే చారిత్రక అర్ధసాంకేతిక బిరుదు
  rationale: ఈ మాట ఇశ్రాయేలు దేవుణ్ణి ఆరాధిస్తూ సమాజమందిరంతో సంబంధం కలిగిన అన్యజనులను సూచించే అవకాశం ఉంది. అయితే మూల వాక్యం వివరణాత్మకంగానూ చదవవచ్చు కాబట్టి ప్రధాన పాఠం ఆ సాధ్యమైన రెండు కోణాలను ముందే మూసివేయదు.
- issue: Ἄνδρες ἀδελφοί లోని లింగసూచక సంబోధన
  choice: ‘సోదరులారా’ అని ఉంచడం
  alternative: ‘సోదర సోదరీమణులారా’ లేదా అక్షరార్థంగా ‘పురుషులారా, సోదరులారా’
  rationale: గ్రీకు రూపం వ్యాకరణపరంగా పురుషలింగం. ‘సోదర సోదరీమణులారా’ అనడం మూలంలో లేని స్పష్టీకరణను చేర్చుతుంది; అక్షరార్థ రూపం తెలుగులో అసహజంగా ఉంటుంది. విస్తృత సభను ఉద్దేశించి ఉండవచ్చనే విషయాన్ని పాదటిప్పణి తెలియజేస్తుంది.
- issue: ἡμῖν ను తెలుగులో సమావేషకంగా లేదా అసమావేషకంగా చూపడం
  choice: ‘మనకు’ అనే సమావేషక రూపం
  alternative: ‘మాకు’ అనే అసమావేషక రూపం
  rationale: గ్రీకు ‘మాకు/మనకు’ అనే తెలుగు భేదాన్ని నిర్దిష్టం చేయదు. శ్రోతలను నేరుగా సంబోధిస్తూ రక్షణ సందేశం అందిన సమూహంలో వారిని చేర్చే సందర్భం ‘మనకు’కు మద్దతిస్తుంది; అయినా మూలంలోని అస్పష్టతను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బహిరంగ ప్రసంగానికి తగిన గౌరవప్రదమైన సంబోధనను వాడాం. వాక్య నిర్మాణం సహజంగా ఉండేలా ఉంచుతూ, మూలంలోని పురుషలింగ బంధుత్వ భాషను మరియు ‘దేవునికి భయపడేవారు’ అనే వివరణాత్మక భావాన్ని కాపాడాం.
