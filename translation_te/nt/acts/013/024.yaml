source:
  edition: SBLGNT
  text: προκηρύξαντος Ἰωάννου πρὸ προσώπου τῆς εἰσόδου αὐτοῦ βάπτισμα μετανοίας ⸂παντὶ τῷ λαῷ⸃ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/024.yaml
  text: before his coming[b][a], John had proclaimed to all the people of Israel a baptism of repentance.
translation:
  language: te
  text: ఆయన రాకకు ముందు[a], యోహాను ఇశ్రాయేలు ప్రజలందరికీ పశ్చాత్తాపపు బాప్తిస్మాన్ని[b] ప్రకటించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆయన ఆగమనానికి ముందు.’ గ్రీకులో అక్షరార్థంగా ‘ఆయన ప్రవేశపు ముఖానికి ముందు’ అని ఉంది; ఇది ఒకరి రాకకు ముందుగా అనే అర్థమిచ్చే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పశ్చాత్తాపం కోసం బాప్తిస్మాన్ని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: προκηρύξαντος
  choice: ప్రకటించాడు
  rationale: ఈ భూతకాల అసమాపక క్రియ యోహాను ముందుగా చేసిన బహిరంగ ప్రకటనను సూచిస్తుంది. కాలపరమైన ముందుతనం తరువాతి పదబంధంలో స్పష్టంగా ఉన్నందున, సహజమైన తెలుగులో ‘ప్రకటించాడు’ అని ఇచ్చాం.
- source_word: πρὸ προσώπου τῆς εἰσόδου αὐτοῦ
  choice: ఆయన రాకకు ముందు
  rationale: అక్షరార్థంగా ‘ఆయన ప్రవేశపు ముఖానికి ముందు’ అనే ఈ గ్రీకు నుడికారం, ఒకరి రాకకు ముందుగా జరగడాన్ని సూచిస్తుంది. ‘ఆయన రాకకు ముందు’ సహజంగా ఉండి, సర్వనామంలోని సందర్భానుసార సూచనను నిలుపుతుంది.
- source_word: εἰσόδου
  choice: రాక
  rationale: ఈ సందర్భంలో ‘ప్రవేశం’ అనే మూలభావం ఒక వ్యక్తి రావడం లేదా చేరుకోవడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘రాక’ సహజమైన ఎంపిక.
- source_word: βάπτισμα μετανοίας
  choice: పశ్చాత్తాపపు బాప్తిస్మం
  rationale: μετανοίας అనే సంబంధ విభక్తి నిర్మాణాన్ని నేరుగా నిలుపుతూ, పశ్చాత్తాపం మరియు బాప్తిస్మం మధ్య సంబంధాన్ని ముందే ఒక్క విధంగా నిర్ధారించకుండా ఉంచుతుంది.
- source_word: παντὶ τῷ λαῷ Ἰσραήλ
  choice: ఇశ్రాయేలు ప్రజలందరికీ
  rationale: πᾶς మరియు λαός రెండింటి భావాన్నీ నిలుపుతూ, ప్రకటనను అందుకున్నవారిని సూచించే సహజ తెలుగు దత్తివాచక నిర్మాణం.
- source_word: Ἰωάννου
  choice: యోహాను
  rationale: Ἰωάννης అనే పేరుకు తెలుగు బైబిలు వాడుకలో స్థిరపడిన రూపం.
theological_decisions:
- issue: ‘ఆయన రాక’లోని సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: సందర్భంలో దావీదు వంశం నుండి వచ్చిన రక్షకుడైన యేసును సూచించే ‘ఆయన’ను అలాగే ఉంచడం
  alternative: ఈ వచనంలో ‘యేసు రాకకు ముందు’ అని పేరును స్పష్టంగా చేర్చడం
  rationale: అపొస్తలుల కార్యములు 13:23–25 సందర్భం ఈ సర్వనామం యేసును సూచిస్తుందని తగినంత స్పష్టం చేస్తుంది. అయితే ఈ వచనంలోని గ్రీకు పాఠ్యంలో పేరు లేకపోవడంతో అనువాదంలో దాన్ని చేర్చలేదు.
- issue: βάπτισμα μετανοίαςలో సంబంధం
  choice: ‘పశ్చాత్తాపపు బాప్తిస్మం’ అనే సంబంధాన్ని నిలుపడం
  alternative: ‘పశ్చాత్తాపం కోసం బాప్తిస్మం’
  rationale: గ్రీకు సంబంధ విభక్తి ఉద్దేశం, లక్ష్యం, లేదా లక్షణం వంటి సంబంధ ఛాయలకు అవకాశం ఇస్తుంది. ప్రధాన పాఠ్యం దాన్ని ముందే ఒక్క అర్థానికి పరిమితం చేయకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘బాప్తిస్మం,’ ‘పశ్చాత్తాపం,’ ‘యోహాను,’ ‘ఇశ్రాయేలు’ వంటి స్థిరపడిన బైబిలు పదరూపాలు ఉపయోగించబడ్డాయి. మూలంలోని పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, తెలుగు సహజ వాక్యక్రమంలో భావం మరియు అనిశ్చితి నిలుపబడ్డాయి.
