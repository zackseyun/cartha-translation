  text: καί, ὡς τεσσερακονταετῆ χρόνον ἐτροποφόρησεν αὐτοὺς ἐν τῇ ἐρήμῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/018.yaml
  text: And for about forty years he put up with them in the wilderness[a].
translation:
  language: te
  text: అరణ్యంలో సుమారు నలభై సంవత్సరాలు ఆయన వారిని సహించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో “ఆయన వారిని సహించాడు” అనే మాటలకు బదులుగా “ఆయన వారిని పోషించాడు” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: καί
  choice: Implicit in the Telugu sentence flow
  rationale: The connective continues the historical narration, but a separate initial equivalent for καί is not required in natural Telugu at this verse boundary.
- source_word: ὡς
  choice: సుమారు
  rationale: With a time expression, ὡς marks approximation; సుమారు naturally conveys 'about.'
- source_word: τεσσερακονταετῆ χρόνον
  choice: నలభై సంవత్సరాలు
  rationale: This directly and idiomatically expresses the forty-year span in modern Telugu.
- source_word: ἐτροποφόρησεν
  choice: సహించాడు
  rationale: The SBLGNT reading most naturally means that God bore with or endured the people. సహించాడు preserves that sense without becoming colloquial or overly harsh.
- source_word: αὐτοὺς
  choice: వారిని
  rationale: The pronoun refers to the people of Israel and is naturally expressed by the respectful/common human plural వారిని.
- source_word: ἐν τῇ ἐρήμῳ
  choice: అరణ్యంలో
  rationale: అరణ్యం is the established biblical-geographical equivalent for the wilderness and preserves the Exodus resonance.
theological_decisions:
- issue: అరణ్యంలో ఇశ్రాయేలు ప్రజల పట్ల దేవుని చర్య
  choice: ఆయన వారిని సహించాడు
  alternative: ఆయన వారిని పోషించాడు
  rationale: The supplied SBLGNT text reads ἐτροποφόρησεν, supporting 'bore with/endured.' The nurturing sense rests on the variant ἐτροφοφόρησεν and is therefore retained in a footnote rather than substituted into the main text.
translation_notes:
  register: సహజమైన, ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరమైన వచనశైలి. సహించాడు అనే పదం మూలపాఠంలోని సహనంతో భరించడం అనే భావాన్ని నిలుపుతుంది; పాఠాంతరాన్ని పాదసూచికలో స్పష్టంగా తెలిపాం.
