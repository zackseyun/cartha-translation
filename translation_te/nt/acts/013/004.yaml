id: ACT.13.4
reference: Acts 13:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Αὐτοὶ μὲν οὖν ἐκπεμφθέντες ὑπὸ τοῦ ⸂ἁγίου πνεύματος⸃ κατῆλθον ⸀εἰς Σελεύκειαν, ἐκεῖθέν ⸀τε ἀπέπλευσαν ⸁εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/004.yaml
  text: So they[a], having been sent out by the Holy Spirit, went down to Seleucia, and from there sailed away to Cyprus.
translation:
  language: te
  text: కాబట్టి వారు, పవిత్రాత్మ చేత పంపబడినవారై, సెలూకయకు దిగివెళ్లి, అక్కడి నుండి కుప్రకు ఓడలో బయలుదేరారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτοὶ
  choice: వారు
  rationale: స్పష్టంగా ఉన్న సర్వనామాన్ని సహజమైన తెలుగు కథన శైలిలో ఉంచుతుంది; గ్రీకులోని స్వల్ప ఉద్ఘాటనను పదశః ‘వారే’ అని అతిగా బలపరచదు.
- source_word: μὲν οὖν
  choice: కాబట్టి
  rationale: ముందటి పంపింపు సంఘటనకు దీనిని అనుసంధానిస్తూ, కథన పురోగతితో కూడిన ఫలితార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκπεμφθέντες
  choice: పంపబడినవారై
  rationale: అనిశ్చిత భూతకాల కర్మణి కృదంతంలోని కర్మణి భావాన్ని, ప్రధాన క్రియలకు ముందుగా జరిగిన చర్యను నిలుపుతుంది.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: పవిత్రాత్మ చేత
  rationale: ὑπό + షష్ఠీ విభక్తి తెలిపే కార్యకర్త భావాన్ని ‘చేత’ స్పష్టంగా వ్యక్తం చేస్తుంది; అపొస్తలుల కార్యములలో ఇది వ్యక్తిగత దైవిక కార్యకర్తను సూచిస్తుంది.
- source_word: κατῆλθον
  choice: దిగివెళ్లి
  rationale: తీరప్రాంతానికి లేదా తక్కువ ఎత్తుకు వెళ్లడాన్ని సూచించే ‘దిగు’ భావాన్ని, సహజ తెలుగు గమనక్రియతో నిలుపుతుంది.
- source_word: εἰς Σελεύκειαν
  choice: సెలూకయకు
  rationale: గమ్యస్థానాన్ని దత్త విభక్తితో సహజంగా తెలుపుతూ, స్థలనామాన్ని ప్రామాణిక తెలుగు రూపంలో లిప్యంతరీకరిస్తుంది.
- source_word: ἐκεῖθεν τε
  choice: అక్కడి నుండి
  rationale: బయలుదేరిన స్థలాన్ని సహజంగా తెలుపుతుంది; τε యొక్క అనుసంధాన భావం వాక్య క్రమంలో ప్రతిఫలిస్తుంది.
- source_word: ἀπέπλευσαν
  choice: ఓడలో బయలుదేరారు
  rationale: ἀποπλέωలోని సముద్రమార్గ ప్రయాణం మరియు బయలుదేరే భావం రెండింటినీ సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: εἰς Κύπρον
  choice: కుప్రకు
  rationale: ద్వీపాన్ని గమ్యస్థానంగా చూపుతూ, దాని ప్రాచుర్యంలో ఉన్న తెలుగు బైబిలు స్థలనామ రూపాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: ἁγίου πνεύματος పదబంధం యొక్క అనువాదం
  choice: పవిత్రాత్మ
  alternative: పవిత్ర ఆత్మ
  rationale: ఈ సందర్భంలో పంపించే వ్యక్తిగత దైవిక కార్యకర్తను సూచిస్తున్నందున ‘పవిత్రాత్మ’ సహజమైన, స్థిరమైన తెలుగు రూపం. అయితే మూలంలోని పదబంధానికి మించిన సిద్ధాంత వివరణను వాక్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని కర్మణి నిర్మాణం, చర్యల క్రమం, సముద్రమార్గ బయలుదేరే భావం సాధ్యమైనంత స్పష్టంగా నిలుపబడ్డాయి.
