  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. ప్రదేశనామాలకు సుపరిచితమైన తెలుగు రూపాలు, synagogue‌కు ‘సమాజమందిరం’, Sabbath‌కు ‘విశ్రాంతి దినం’ ఉపయోగించబడ్డాయి.
