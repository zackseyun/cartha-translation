  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: αὐτοὶ δὲ διελθόντες ἀπὸ τῆς Πέργης παρεγένοντο εἰς Ἀντιόχειαν ⸂τὴν Πισιδίαν⸃, καὶ ⸀εἰσελθόντες εἰς τὴν συναγωγὴν τῇ ἡμέρᾳ τῶν σαββάτων ἐκάθισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/014.yaml
  text: But they went on from Perga and came to Antioch in Pisidia[a], and on the Sabbath day they entered the synagogue and sat down.
translation:
  language: te
  text: అయితే వారు పెర్గే నుండి ముందుకు ప్రయాణించి, పిసిదియలోని అంతియొకయకు[a] చేరుకున్నారు. సబ్బాతు దినాన వారు యూదుల సమాజమందిరంలోకి వెళ్లి కూర్చున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పిసిదియ అంతియొకయకు.” గ్రీకులో, “పిసిదియలోని అంతియొకయ” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: అయితే వారు
  rationale: δέ కథనాన్ని కొనసాగిస్తూ స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది; αὐτοὶలోని స్పష్టమైన కర్తను సహజమైన తెలుగులో ‘వారు’ తెలియజేస్తుంది.
- source_word: διελθόντες ἀπὸ τῆς Πέργης
  choice: పెర్గ నుండి ముందుకు ప్రయాణించి
  rationale: ప్రయాణ కథనంలో διέρχομαι ఒక స్థలం నుండి ప్రయాణాన్ని కొనసాగించడాన్ని సూచిస్తుంది; ఈ అనువాదం ఆ కొనసాగింపును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παρεγένοντο
  choice: చేరుకున్నారు
  rationale: ప్రయాణ సందర్భంలో παραγίνομαι ఒక ప్రదేశానికి రావడం లేదా చేరుకోవడం అనే అర్థమిస్తుంది.
- source_word: Ἀντιόχειαν τὴν Πισιδίαν
  choice: పిసిదియలోని అంతియొకయకు
  rationale: ఇది అనేక అంతియొకయ పట్టణాల్లో పిసిదియతో సంబంధమున్న పట్టణాన్ని గుర్తిస్తుంది; ప్రధాన పాఠంలో ప్రాంత సంబంధాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేసింది.
- source_word: εἰσελθόντες εἰς τὴν συναγωγήν
  choice: సమాజమందిరంలోకి వెళ్లి
  rationale: యూదుల synagogue‌ను తెలుగులో విస్తృతంగా అర్థమయ్యే ‘సమాజమందిరం’తో అనువదించి, దానిలో ప్రవేశించిన చర్యను సహజంగా తెలిపింది.
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: విశ్రాంతి దినాన
  rationale: గ్రీకులో బహువచన రూపం ఉన్నప్పటికీ, ఈ యూదు కాలసూచక నానుడి ఏకవచన సబ్బాతు దినాన్ని సూచిస్తుంది; ‘విశ్రాంతి దినం’ దాని భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἐκάθισαν
  choice: కూర్చున్నారు
  rationale: సాధారణ భూతకాల చర్యను సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
