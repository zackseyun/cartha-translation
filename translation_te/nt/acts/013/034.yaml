review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies God as the implied subject of ἀνέστησεν and εἴρηκεν, and it accurately conveys resurrection from the dead and the Isaiah 55:3 quotation. However, “కుళ్లిపోవడానికి తిరిగి వెళ్లడు” is not a natural or precise Telugu expression for returning to bodily decay. “మళ్లీ క్షయానికి లోబడబోవడం లేదు” clearly conveys that, after resurrection, he is not to undergo decay again while retaining the prospective force of μέλλοντα.
  naturalness: The opening and quotation are generally clear in modern standard Telugu. Replacing the idiomatically awkward “కుళ్లిపోవడానికి తిరిగి వెళ్లడు” with “మళ్లీ క్షయానికి లోబడబోవడం లేదు” yields natural, dignified Telugu appropriate to biblical narrative.
  terminology: “మృతులలోనుండి లేపాడు” is appropriate resurrection terminology. “క్షయం” avoids the possible colloquial harshness of “కుళ్లిపోవడం” and accurately denotes bodily decay here. “దావీదుకు సంబంధించిన పవిత్రమైన, నిశ్చయమైన దీవెనలు” responsibly represents the elliptical Greek phrase without making the blessings David’s personal qualities; the traditional “కృపలు” remains appropriately noted.
  issues:
  - severity: medium
    issue: “కుళ్లిపోవడానికి తిరిగి వెళ్లడు” is an unnatural Telugu rendering of εἰς διαφθοράν ὑποστρέφειν.
    rationale: The wording can suggest physically going back somewhere in order to rot. The Greek idiom concerns again becoming subject to bodily decay. “మళ్లీ క్షయానికి లోబడబోవడం లేదు” is clear, natural, and preserves the intended future/prospective sense.
  revised_text: 'దేవుడు ఆయనను మృతులలోనుండి లేపాడనే విషయానికి వస్తే, ఇక ఆయన మళ్లీ క్షయానికి లోబడబోవడం లేదు; దేవుడు ఇలా చెప్పాడు: “దావీదుకు సంబంధించిన పవిత్రమైన, నిశ్చయమైన దీవెనలను[a] నేను మీకు ఇస్తాను.”'
  revised_footnotes:
