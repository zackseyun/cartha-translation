id: ACT.13.34
reference: Acts 13:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι δὲ ἀνέστησεν αὐτὸν ἐκ νεκρῶν μηκέτι μέλλοντα ὑποστρέφειν εἰς διαφθοράν, οὕτως εἴρηκεν ὅτι Δώσω ὑμῖν τὰ ὅσια Δαυὶδ τὰ πιστά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/034.yaml
  text: 'And that he raised him from the dead, no longer about to return to decay, he has spoken in this way: ‘I will give you the holy and sure blessings of David.’'
translation:
  language: te
  text: 'దేవుడు ఆయనను మృతులలోనుండి లేపాడనే విషయానికి వస్తే, ఇక ఆయన మళ్లీ క్షయానికి లోబడబోవడం లేదు; దేవుడు ఇలా చెప్పాడు: “దావీదుకు సంబంధించిన పవిత్రమైన, నిశ్చయమైన దీవెనలను[a] నేను మీకు ఇస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంప్రదాయ అనువాదంలో, “దావీదు యొక్క నిశ్చయమైన కృపలు.” ఈ గ్రీకు పదబంధం యెషయా 55:3ను ప్రతిధ్వనిస్తూ దావీదుతో ముడిపడిన పవిత్రమైన, నమ్మదగిన నిబంధన వాగ్దానాలను సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέστησεν αὐτὸν ἐκ νεκρῶν
  choice: దేవుడు ఆయనను మృతులలోనుంచి లేపిన
  rationale: సందర్భం ద్వారా కర్త దేవుడని స్పష్టమవుతుంది; ‘మృతులలోనుంచి లేపిన’ అనేది పునరుత్థానాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μηκέτι μέλλοντα ὑποστρέφειν εἰς διαφθοράν
  choice: ఇక ఆయన ఎన్నటికీ కుళ్లిపోవడానికి తిరిగి వెళ్లడు
  rationale: μηκέτι యొక్క ఇకపై జరగని భావాన్ని ‘ఇక...ఎన్నటికీ’ స్పష్టంగా వ్యక్తం చేస్తుంది; διαφθορά ఇక్కడ నైతిక భ్రష్టతను కాక శరీర క్షయాన్ని సూచిస్తున్నందున ‘కుళ్లిపోవడం’ ఎంచుకోబడింది.
- source_word: οὕτως εἴρηκεν
  choice: దేవుడు ఇలా చెప్పాడు
  rationale: లేఖన ఉల్లేఖనాన్ని సహజంగా పరిచయం చేస్తుంది. గ్రీకులోని పరిపూర్ణ కాలరూపాన్ని తెలుగులో కృత్రిమంగా అనుకరించకుండా, ఇప్పటికీ ప్రామాణికంగా ఉన్న లేఖన వాక్యమనే సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: Δώσω ὑμῖν
  choice: నేను మీకు ఇస్తాను
  rationale: భవిష్యత్ వాగ్దానాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὰ ὅσια Δαυὶδ τὰ πιστά
  choice: దావీదుకు సంబంధించిన పవిత్రమైన, నిశ్చయమైన దీవెనలు
  rationale: ఈ కఠినమైన, సంక్షిప్త గ్రీకు పదబంధం యెషయా 55:3ను ప్రతిధ్వనిస్తూ దావీదుతో ముడిపడిన పవిత్రమైన, విశ్వసనీయమైన నిబంధన వరాలను సూచిస్తుంది. ‘దీవెనలు’ భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా చేస్తుంది; ‘నిశ్చయమైన’ అనేది τὰ πιστά యొక్క ఆధారపడదగిన స్వభావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: τὰ ὅσια Δαυὶδ τὰ πιστά అనే యెషయా 55:3 ఉల్లేఖనాన్ని ఎలా అనువదించాలి
  choice: దావీదుకు సంబంధించిన పవిత్రమైన, నిశ్చయమైన దీవెనలు
  alternative: దావీదు యొక్క నిశ్చయమైన కృపలు
  rationale: ఈ పదబంధం దావీదు వ్యక్తిగత భక్తిని కాక, అతనితో ముడిపడిన నిలకడైన నిబంధన వరాలు లేదా వాగ్దానాలను సూచిస్తుంది. ప్రధాన పాఠం ఈ భావాన్ని స్పష్టంగా ఉంచుతుంది; సంప్రదాయబద్ధమైన ‘కృపలు’ పఠనాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేఖన ఉల్లేఖనానికి తగిన గౌరవప్రదమైన శైలి. ప్రారంభంలోని అంశ-సూచక గ్రీకు నిర్మాణాన్ని ‘విషయానికొస్తే’తో నిలిపి, మధ్య భాగాన్ని గీతల మధ్య ఉంచడం ద్వారా వాక్య సంబంధాన్ని స్పష్టం చేసింది.
