revisions:
- from: 'దేవుడు ఆయనను మృతులలోనుంచి లేపిన విషయానికొస్తే—ఇక ఆయన ఎన్నటికీ కుళ్లిపోవడానికి తిరిగి వెళ్లడు—దేవుడు ఇలా చెప్పాడు: “దావీదుకు సంబంధించిన పవిత్రమైన, నిశ్చయమైన దీవెనలను[a] నేను మీకు ఇస్తాను.”'
  to: 'దేవుడు ఆయనను మృతులలోనుండి లేపాడనే విషయానికి వస్తే, ఇక ఆయన మళ్లీ క్షయానికి లోబడబోవడం లేదు; దేవుడు ఇలా చెప్పాడు: “దావీదుకు సంబంధించిన పవిత్రమైన, నిశ్చయమైన దీవెనలను[a] నేను మీకు ఇస్తాను.”'
  rationale: 'The revision only improves the Telugu rendering of the resurrection’s permanence: Jesus will not again become subject to bodily decay. It preserves the implied divine subject, the structure introducing the scriptural quotation, and the deliberate main-text/footnote treatment of τὰ ὅσια Δαυὶδ τὰ πιστά.'
