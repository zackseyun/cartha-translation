  yaml_path: translation/nt/acts/013/012.yaml
  text: Then[a], when the proconsul saw what had happened, he believed[b], being astonished at the teaching of the Lord.
translation:
  language: te
  text: అప్పుడు ప్రోకన్సలు జరిగినదాన్ని[a] చూసి, ప్రభువు బోధను[b] బట్టి ఆశ్చర్యపోతూ విశ్వసించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘జరిగిన సంఘటనను.’
    reason: lexical_alternative
  - marker: b
    text: ‘ప్రభువు బోధ’ అంటే ‘ప్రభువు చేసిన బోధ’ లేదా ‘ప్రభువును గురించిన బోధ’ అని కూడా అర్థం కావచ్చు. గ్రీకు షష్ఠీ విభక్తి ఒకటి కంటే ఎక్కువ విధాలుగా అర్థమవుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: కథనంలో తదుపరి సంఘటనను సూచించే సహజమైన కాలక్రమ పదం.
- source_word: ἰδὼν
  choice: చూసి
  rationale: గ్రీకు భూతకాల అసమాపక క్రియ ప్రధాన క్రియకు ముందు లేదా దానితో ముడిపడి జరిగిన చర్యను సూచిస్తుంది; తెలుగులో ‘చూసి’ సహజంగా ఆ సంబంధాన్ని నిలుపుతుంది.
- source_word: ὁ ἀνθύπατος
  choice: రోమా ప్రాంత పాలకుడు
  rationale: ఇది సాధారణ పాలకుడిని కాక రోమా పరిపాలనలోని ప్రోకాన్సల్ పదవిని సూచిస్తుంది; సాధారణ పాఠకునికి అర్థమయ్యేలా చారిత్రక నేపథ్యాన్ని తెలియజేస్తుంది.
- source_word: τὸ γεγονός
  choice: జరిగినదాన్ని
  rationale: పూర్తయిన సంఘటనను సూచించే substantival perfect participle భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: ἐπίστευσεν
  choice: విశ్వసించాడు
  rationale: మూలంలో విశ్వాసానికి సంబంధించిన కర్మ స్పష్టంగా చెప్పబడలేదు; అందువల్ల అదనంగా ‘ప్రభువును’ లేదా ‘సందేశాన్ని’ చేర్చలేదు.
- source_word: ἐκπλησσόμενος
  choice: ఆశ్చర్యపోయాడు
  rationale: ప్రధాన క్రియతో పాటు ఉన్న అతని గాఢమైన ఆశ్చర్యాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ τῇ διδαχῇ
  choice: బోధకు
  rationale: ఆశ్చర్యానికి కారణం లేదా ఆధారమైన బోధను సూచిస్తుంది.
- source_word: τοῦ κυρίου
  choice: ప్రభువు
  rationale: ‘ప్రభువు బోధ’ అనే నిర్మాణం గ్రీకు షష్ఠీ విభక్తిలోని సంబంధాన్ని సంక్షిప్తంగా ఉంచి, అది ప్రభువు నుండి వచ్చిన బోధా లేక ప్రభువును గురించిన బోధా అనే భావాన్ని ప్రధాన వాక్యంలో పూర్తిగా నిర్ణయించదు.
theological_decisions:
- issue: కర్మ చెప్పని πιστεύω అర్థం
  choice: ‘విశ్వసించాడు’ అని మాత్రమే అనువదించడం
  alternative: ‘ప్రభువును విశ్వసించాడు’ లేదా ‘సందేశాన్ని విశ్వసించాడు’
  rationale: సందర్భం క్రైస్తవ విశ్వాసాన్ని సూచించినప్పటికీ, గ్రీకు వాక్యం కర్మను పేర్కొనదు. మూలంలోని సంక్షిప్తతను, భావ విస్తృతిని నిలిపాం.
- issue: ‘ప్రభువు బోధ’లో షష్ఠీ విభక్తి భావం
  choice: ‘ప్రభువు బోధ’ అని ఉంచడం
  alternative: ‘ప్రభువు చేసిన బోధ’ లేదా ‘ప్రభువును గురించిన బోధ’
  rationale: τοῦ κυρίου అనే షష్ఠీ విభక్తి కర్తృసంబంధంగా, విషయసంబంధంగా లేదా స్వామ్యసంబంధంగా అర్థమవవచ్చు; ఒకే భావాన్ని బలవంతంగా ఎంచుకోకుండా అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకునికి స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని కర్మలేని ‘విశ్వసించాడు’ అనే రూపాన్ని, ‘ప్రభువు బోధ’లోని భావ విస్తృతిని నిలిపింది.
