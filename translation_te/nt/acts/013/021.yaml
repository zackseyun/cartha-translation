id: ACT.13.21
reference: Acts 13:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κἀκεῖθεν ᾐτήσαντο βασιλέα, καὶ ἔδωκεν αὐτοῖς ὁ θεὸς τὸν Σαοὺλ υἱὸν Κίς, ἄνδρα ἐκ φυλῆς Βενιαμίν, ἔτη τεσσεράκοντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/021.yaml
  text: And from there they asked for a king[a], and God gave them Saul son of Kish, a man from the tribe of Benjamin[b], for forty years.
translation:
  language: te
  text: అక్కడి నుండి[a] వారు తమకు ఒక రాజు కావాలని అడిగారు. దేవుడు వారికి కీషు కుమారుడూ బెన్యామీను గోత్రానికి చెందిన వ్యక్తియూ అయిన సౌలును నలభై సంవత్సరాలపాటు[b] ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ తరువాత.’ ప్రారంభంలోని గ్రీకు పదం చారిత్రక సంఘటనల క్రమంలో మార్పును సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: పాత నిబంధనలోని కాలసంబంధ వివరాలతో పోల్చినప్పుడు ‘నలభై సంవత్సరాలు’ అనే మాటపై కొందరు ప్రశ్నలను గమనిస్తారు. ఇక్కడ అనువాదం లూకా వాక్యాన్ని ఉన్నట్లుగానే నిలుపుతుంది.
    reason: cross_reference
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: ఆ తరువాత
  rationale: ఇక్కడ ఈ పదం చారిత్రక సంఘటనల క్రమంలో మార్పును సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఆ తరువాత’ సహజంగా ఉంటుంది; ‘అక్కడి నుండి’ అనే స్థానార్థ అవకాశాన్ని పాదసూచికలో నిలుపుకున్నాం.
- source_word: ᾐτήσαντο
  choice: తమకు ... కావాలని అడిగారు
  rationale: మధ్యమ ప్రయోగం ప్రజలు తమ కోసం రాజును కోరారని సూచిస్తుంది. ‘అడిగారు’ మూలంలోని అభ్యర్థన భావాన్ని నిలుపుతుంది; ‘పట్టుబట్టారు’ లేదా ‘డిమాండ్ చేశారు’ అనడం స్వరాన్ని అనవసరంగా తీవ్రం చేస్తుంది.
- source_word: βασιλέα
  choice: ఒక రాజు
  rationale: నిర్దిష్టంగా ముందే గుర్తించిన వ్యక్తిని కాక, వారు కోరిన పాలకుని రకాన్ని ఈ అనిర్దిష్ట నామవాచకం సూచిస్తుంది.
- source_word: ἔδωκεν
  choice: ఇచ్చాడు
  rationale: మూల క్రియకు నేరమైన సాధారణ అర్థం ‘ఇచ్చాడు.’ ‘నియమించాడు’ అంటే భావాన్ని మరీ కుదించినట్లవుతుంది; ‘అనుగ్రహించాడు’ అదనపు వ్యాఖ్యాన ఛాయను కలిగిస్తుంది.
- source_word: ὁ θεὸς
  choice: దేవుడు
  rationale: గ్రీకులో స్పష్టంగా ఉన్న కర్తను తెలుగులోనూ నిలుపుకున్నాం.
- source_word: τὸν Σαοὺλ
  choice: సౌలును
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించి, వాక్యంలో కర్మగా సహజంగా అమర్చాం.
- source_word: υἱὸν Κίς
  choice: కీషు కుమారుడైన
  rationale: వంశసంబంధాన్ని తెలిపే ఈ పదబంధాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంలో అందించాం.
- source_word: ἄνδρα
  choice: చెందిన
  rationale: గ్రీకులోని ‘ఒక మనిషి/పురుషుడు’ అనే అనుబంధ వివరణను తెలుగులో ‘బెన్యామీను గోత్రానికి చెందిన’ అనే సహజ నిర్మాణంలో భావపరంగా వ్యక్తం చేశాం; విడిగా ‘ఒక మనిషి’ అనడం తెలుగులో కృత్రిమంగా ఉంటుంది.
- source_word: ἐκ φυλῆς Βενιαμίν
  choice: బెన్యామీను గోత్రానికి చెందిన
  rationale: సౌలు ఏ గోత్రం నుండి వచ్చాడో స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἔτη τεσσεράκοντα
  choice: నలభై సంవత్సరాలపాటు
  rationale: ద్వితీయా విభక్తిలోని ఈ పదబంధం కాలవ్యవధిని సూచిస్తుంది. తెలుగులో ‘-పాటు’ ఆ వ్యవధిని స్పష్టంగా తెలుపుతూ, దేవుడు సౌలును ఇచ్చిన వాక్యభాగానికే సహజంగా అనుసంధానిస్తుంది.
theological_decisions:
- issue: ἔτη τεσσεράκοντα అనే కాలవ్యవధి పదబంధం దేనికి అనుసంధానమవుతుంది?
  choice: దేవుడు సౌలును వారికి ఇచ్చిన కాలవ్యవధిగా ‘నలభై సంవత్సరాలపాటు’ అని అనువదించాం.
  alternative: దీనిని చారిత్రక సారాంశంలోని కాలసూచనగా మరింత విస్తృతంగా గ్రహించవచ్చు; పాత నిబంధన కాలక్రమంతో పోల్చినప్పుడు కొందరు ప్రశ్నలను గమనిస్తారు.
  rationale: గ్రీకు వాక్యప్రవాహంలో ఈ పదబంధం వెంటనే ముందున్న దేవుడు సౌలును ఇచ్చాడనే వాక్యభాగానికే అత్యంత సహజంగా అనుసంధానమవుతుంది. కాలక్రమ సంబంధమైన ఉద్రిక్తతను సమన్వయపరచి తొలగించకుండా లూకా మాటలను యథాతథంగా నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలిని ఉపయోగించాం. గ్రీకు వాక్య నిర్మాణాన్ని తెలుగులో బలవంతంగా అనుకరించకుండా రెండు సహజ వాక్యాలుగా విభజించాం. ‘ఇచ్చాడు’ మరియు ‘నలభై సంవత్సరాలపాటు’ అనే రూపాలు మూలంలోని సరళతను, కాలవ్యవధి సంబంధాన్ని కాపాడుతాయి.
