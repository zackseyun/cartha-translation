- from: కాబట్టి సహోదరులారా,[a] ఈయన ద్వారానే[b] పాపక్షమాపణ మీకు ప్రకటించబడుతోందనీ, మోషే ధర్మశాస్త్రం ద్వారా మీరు వేటన్నిటి నుండి నీతిమంతులుగా తీర్చబడలేకపోయారో,[c] వాటన్నిటి నుండి—[d]
  to: 'కాబట్టి, సహోదరులారా,[a] మీరు తెలుసుకోవలసిన విషయం ఏమిటంటే: ఈయన ద్వారా[b] పాపాల క్షమాపణ మీకు ప్రకటించబడుతోంది; మోషే ధర్మశాస్త్రం ద్వారా మీరు నీతిమంతులుగా తీర్చబడలేకపోయిన వాటన్నిటి నుండి—[c][d]'
  rationale: The revision restores the omitted opening imperative, removes the unsupported exclusive emphasis from ‘ద్వారానే,’ and smooths the relative clause. It deliberately does not import the completion from verse 39, since the supplied SBLGNT text for verse 38 ends with δικαιωθῆναι and the sentence continues in the next verse.
