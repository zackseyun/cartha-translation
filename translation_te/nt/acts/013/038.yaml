source:
  edition: SBLGNT
  text: γνωστὸν οὖν ἔστω ὑμῖν, ἄνδρες ἀδελφοί, ὅτι διὰ τούτου ὑμῖν ἄφεσις ἁμαρτιῶν καταγγέλλεται, καὶ ἀπὸ πάντων ὧν οὐκ ἠδυνήθητε ⸀ἐν νόμῳ Μωϋσέως δικαιωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/038.yaml
  text: Therefore let it be known to you[a], brothers, that through this one forgiveness of sins is proclaimed to you, and from all the things from which you could not be justified by the law of Moses[c][b], everyone who believes is justified.
translation:
  language: te
  text: 'కాబట్టి, సహోదరులారా,[a] మీరు తెలుసుకోవలసిన విషయం ఏమిటంటే: ఈయన ద్వారా[b] పాపాల క్షమాపణ మీకు ప్రకటించబడుతోంది; మోషే ధర్మశాస్త్రం ద్వారా మీరు నీతిమంతులుగా తీర్చబడలేకపోయిన వాటన్నిటి నుండి—[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సమావేశమైన శ్రోతలందరినీ ఉద్దేశించిన సంబోధనగా గ్రహిస్తే, ‘సహోదర సహోదరీలారా’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, ఇంతకుముందు ప్రస్తావించబడిన యేసు ద్వారా.
    reason: cross_reference
  - marker: c
    text: లేదా, ‘నీతిమంతులమని ప్రకటించబడలేకపోయిన వాటన్నిటి నుండి.’
    reason: lexical_alternative
  - marker: d
    text: ఈ వాక్యం 39వ వచనంలో పూర్తవుతుంది.
    reason: verse_boundary
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: కాబట్టి ... మీరు తెలుసుకోవాలి
  rationale: తెలుగులో సహజమైన విధంగా ఈ పరోక్ష ఆజ్ఞ యొక్క ప్రకటనాత్మక బలాన్ని తెలియజేస్తుంది; ‘కాబట్టి’ οὖν యొక్క తార్కిక అనుసంధానాన్ని నిలుపుతుంది.
- source_word: ἄνδρες ἀδελφοί
  choice: సహోదరులారా
  rationale: ఇది గౌరవప్రదమైన కుటుంబసంబంధ సంబోధన. గ్రీకు పదబంధంలోని పురుష బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, సంభావ్య సమ్మిళిత అర్థాన్ని పాదటిప్పణిలో సూచించింది.
- source_word: διὰ τούτου
  choice: ఈయన ద్వారానే
  rationale: τούτου సమీపంలో ప్రస్తావించబడిన యేసును సూచిస్తుంది. ‘ఈయన’ వ్యక్తిగత సూచనను సహజంగా తెలియజేస్తుంది; ‘ద్వారానే’ సాధనార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἄφεσις ἁμαρτιῶν
  choice: పాపక్షమాపణ
  rationale: ఈ సందర్భంలో ‘పాపాల క్షమాపణ’ అనే స్థిరమైన భావాన్ని సంక్షిప్తంగా, సులభంగా తెలియజేసే ప్రస్తుత ప్రామాణిక తెలుగు పదం.
- source_word: καταγγέλλεται
  choice: ప్రకటించబడుతోంది
  rationale: వర్తమాన కర్మణి రూపాన్నీ, బహిరంగ ప్రకటన భావాన్నీ నిలుపుతుంది.
- source_word: ἀπὸ πάντων ὧν
  choice: వేటన్నిటి నుండి ... వాటన్నిటి నుండి
  rationale: గ్రీకు సంబంధవాచక నిర్మాణాన్ని తెలుగులో సహజంగా అమర్చి, 39వ వచనంలో పూర్తయ్యే భావానికి సిద్ధం చేస్తుంది.
- source_word: οὐκ ἠδυνήθητε
  choice: మీరు ... తీర్చబడలేకపోయారో
  rationale: అసమర్థతను నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν νόμῳ Μωϋσέως
  choice: మోషే ధర్మశాస్త్రం ద్వారా
  rationale: ἐν ఇక్కడ సాధనం లేదా పరిధిని సూచిస్తుంది; ‘ద్వారా’ ఆ భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: δικαιωθῆναι
  choice: నీతిమంతులుగా తీర్చబడడం
  rationale: న్యాయస్థాన సంబంధమైన ‘నీతిమంతులని ప్రకటించడం/తీర్చడం’ అనే భావాన్ని కేవలం నైతిక మార్పుగా కుదించకుండా కర్మణి రూపంలో నిలుపుతుంది.
theological_decisions:
- issue: δικαιωθῆναι యొక్క న్యాయపరమైన, ధార్మిక భావం
  choice: నీతిమంతులుగా తీర్చబడడం
  alternative: నీతిమంతులని ప్రకటించబడడం
  rationale: ఎంచుకున్న పదబంధం తెలుగులో స్థిరమైన బైబిలు ధార్మిక వాడుకకు అనుకూలంగా ఉండి, దేవుని న్యాయనిర్ణయానికి సంబంధించిన భావాన్ని నిలుపుతుంది. ప్రత్యామ్నాయం న్యాయప్రకటన భావాన్ని మరింత బహిర్గతం చేస్తుంది; దానిని పాదటిప్పణిలో ఇచ్చాం.
- issue: ἄνδρες ἀδελφοί సంబోధనలో లింగ సూచన
  choice: సహోదరులారా
  alternative: సహోదర సహోదరీలారా
  rationale: గ్రీకు పాఠ్యంలోని పురుష బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం. సమావేశమైన శ్రోతలందరినీ ఉద్దేశించిన సమ్మిళిత ప్రయోగంగా గ్రహించే అవకాశాన్ని పాదటిప్పణిలో తెలిపాం.
- issue: 38వ వచనం చివర ఉన్న అసంపూర్ణ వాక్యనిర్మాణం
  choice: వాక్యం కొనసాగుతోందని దీర్ఘరేఖతో సూచించడం
  alternative: 39వ వచనంలోని ‘విశ్వసించే ప్రతివాడూ నీతిమంతునిగా తీర్చబడుతున్నాడు’ అనే మాటలను 38వ వచనంలో చేర్చడం
  rationale: అందించిన SBLGNT 38వ వచనం δικαιωθῆναι వద్ద ముగిసి, దాని వాక్యనిర్మాణం 39వ వచనంలో పూర్తవుతుంది. మూల వచన విభజనను గౌరవిస్తూ తదుపరి వచనంలోని మాటలను ఇక్కడ చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన బహిరంగ ప్రసంగ శైలిని ఉపయోగించాం. ‘పాపక్షమాపణ,’ ‘మోషే ధర్మశాస్త్రం,’ ‘నీతిమంతులుగా తీర్చబడడం’ వంటి సులభంగా గుర్తించగల బైబిలు పదజాలాన్ని ఉంచాం. మూలంలోని వచన సరిహద్దును కాపాడేందుకు 39వ వచనపు ముగింపు ఖండాన్ని 38వ వచనంలోకి తీసుకురాలేదు.
