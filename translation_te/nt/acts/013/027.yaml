  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ γὰρ κατοικοῦντες ἐν Ἰερουσαλὴμ καὶ οἱ ἄρχοντες αὐτῶν τοῦτον ἀγνοήσαντες καὶ τὰς φωνὰς τῶν προφητῶν τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας κρίναντες ἐπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/027.yaml
  text: For those who live in Jerusalem and their rulers[a], because they did not recognize this one and by condemning him fulfilled the voices of the prophets that are read every Sabbath[b],
translation:
  language: te
  text: ఎందుకంటే, యెరూషలేములో నివసించేవారూ వారి పాలకులూ ఈయనను[a] గుర్తించక, ఈయనను దోషిగా తీర్పు తీర్చడం ద్వారా, ప్రతి విశ్రాంతిదినాన చదివే ప్రవక్తల స్వరాలను[b] నెరవేర్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనను.’ గ్రీకులో ‘ఈయనను’ అనే నిర్దేశక సర్వనామం ఉంది; అది యేసును ప్రత్యేకంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ప్రవక్తల మాటలను.’ అక్షరార్థంగా, ‘ప్రవక్తల స్వరాలను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικοῦντες ἐν Ἰερουσαλήμ
  choice: యెరూషలేములో నివసించేవారు
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తుల సమూహంగా తెలియజేస్తుంది.
- source_word: οἱ ἄρχοντες αὐτῶν
  choice: వారి పాలకులు
  rationale: ఈ సందర్భంలోని పరిపాలనా, న్యాయాధికార భావాన్ని ‘నాయకులు’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: τοῦτον
  choice: ఈయనను
  rationale: యేసును సూచించే గ్రీకు నిర్దేశక సర్వనామంలోని స్పష్టమైన సూచనను, గౌరవప్రదమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἀγνοήσαντες
  choice: గుర్తించక
  rationale: యేసు ఉనికి గురించి తెలియకపోవడం కంటే ఆయన ఎవరో గుర్తించడంలో విఫలమైన సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: τὰς φωνὰς τῶν προφητῶν
  choice: ప్రవక్తల స్వరాలను
  rationale: φωνάς అనే మూలపదంలోని ‘స్వరాలు’ అనే సజీవ రూపకాన్ని నిలుపుతుంది; ఇది ప్రవక్తల మాటలను సూచిస్తుంది.
- source_word: τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας
  choice: ప్రతి విశ్రాంతిదినాన చదివే
  rationale: పునరావృత ఆచారాన్ని సహజ తెలుగులో తెలియజేస్తూ, ఈ విశేషణ భాగాన్ని ‘ప్రవక్తల స్వరాలు’తో అనుసంధానిస్తుంది.
- source_word: κρίναντες
  choice: దోషిగా తీర్పు తీర్చడం ద్వారా
  rationale: ఇక్కడ సాధారణంగా విచారించడం కాక యేసుపై విధించిన ప్రతికూల న్యాయతీర్పును, నెరవేర్పుకు సాధనమైన చర్యగా వ్యక్తం చేస్తుంది.
- source_word: ἐπλήρωσαν
  choice: నెరవేర్చారు
  rationale: ప్రవక్తల వాక్యాలు వారి చర్యల ద్వారా నెరవేరినట్లు తెలిపే ప్రామాణికమైన, స్పష్టమైన తెలుగు పదం.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి ఈ వాక్యం ఇచ్చే వివరణాత్మక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
theological_decisions:
- issue: యేసును గురించిన వారి అజ్ఞానం స్వభావం
  choice: ఈయనను గుర్తించక
  alternative: ఈయనను ఎరుగక
  rationale: వారికి యేసు ఉనికి అసలు తెలియదని అతిశయంగా చెప్పకుండా, ఆయన నిజమైన గుర్తింపును గ్రహించడంలో వారి వైఫల్యాన్ని తెలియజేస్తూ వాక్యంలోని బాధ్యత–అజ్ఞానం మధ్య ఉన్న ఉద్రిక్తతను నిలుపుతుంది.
- issue: ప్రవచన నెరవేర్పుతో దోషతీర్పు సంబంధం
  choice: ఈయనను దోషిగా తీర్పు తీర్చడం ద్వారా నెరవేర్చారు
  alternative: ఈయనకు తీర్పు తీర్చి నెరవేర్చారు
  rationale: κρίναντες సందర్భంలో ప్రతికూల న్యాయతీర్పును సూచిస్తుందని తెలియజేస్తూ, ఆ చర్య ద్వారానే ప్రవక్తల సాక్ష్యం నెరవేరిందనే భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘ఈయన’ నిర్దేశక బలాన్ని నిలుపుతుంది; ‘విశ్రాంతిదినం’ సాధారణ పాఠకునికి అర్థమయ్యే బైబిలీయ పదప్రయోగం. మూలంలోని దీర్ఘ వాక్య నిర్మాణాన్ని చదవదగిన క్రమంలో ఉంచుతూ, కృదంతాల భావసంబంధాలను స్పష్టపరచింది.
