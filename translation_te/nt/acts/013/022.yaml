id: ACT.13.22
reference: Acts 13:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ μεταστήσας αὐτὸν ἤγειρεν ⸂τὸν Δαυὶδ αὐτοῖς⸃ εἰς βασιλέα, ᾧ καὶ εἶπεν μαρτυρήσας· Εὗρον Δαυὶδ τὸν τοῦ Ἰεσσαί, ἄνδρα κατὰ τὴν καρδίαν μου, ὃς ποιήσει πάντα τὰ θελήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/022.yaml
  text: And after removing him[a], he raised up David for them as king, to whom he also bore witness and said, ‘I have found David the son of Jesse, a man according to my heart[b], who will do all my will.’
translation:
  language: te
  text: 'ఆయన అతణ్ణి తొలగించిన తరువాత, వారి కోసం దావీదును రాజుగా నిలబెట్టాడు. దావీదు గురించి సాక్ష్యమిస్తూ ఆయన ఇలా అన్నాడు: “యెష్షయి కుమారుడైన దావీదును నేను కనుగొన్నాను. అతడు నా హృదయానికి అనుగుణమైన మనిషి[a]. అతడు నా సంకల్పాలన్నిటినీ[b] నెరవేరుస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత సంప్రదాయబద్ధంగా, “నా హృదయానుసారమైన మనిషి.” గ్రీకు అక్షరార్థంగా “నా హృదయం ప్రకారం” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో “సంకల్పాలు” అనే నామవాచకం బహువచనంలో ఉంది; భావానువాదంగా “నా చిత్తమంతటినీ” అని కూడా చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστήσας
  choice: తొలగించిన తరువాత
  rationale: ఈ సందర్భంలో దేవుడు సౌలును రాజస్థానం నుంచి తొలగించడాన్ని సూచిస్తుంది. ‘తొలగించడం’ మూలపదం విస్తృత భావాన్ని కాపాడుతుంది; ‘పదవీచ్యుతుణ్ణి చేయడం’ కంటే తక్కువ వ్యాఖ్యాత్మకం.
- source_word: ἤγειρεν
  choice: నిలబెట్టాడు
  rationale: ఇక్కడ ἐγείρω ఒక నాయకుణ్ణి ముందుకు తెచ్చి రాజుగా ఏర్పరచడాన్ని సూచిస్తుంది. తెలుగులో ‘నిలబెట్టాడు’ సహజంగా ఉండి, పునరుత్థాన భావాన్ని అనవసరంగా కలిగించదు.
- source_word: αὐτοῖς εἰς βασιλέα
  choice: వారి కోసం … రాజుగా
  rationale: దత్తివాచకమైన αὐτοῖς ఇశ్రాయేలీయుల కోసం లేదా వారి ప్రయోజనార్థం అనే భావాన్ని ఇస్తుంది; εἰς βασιλέα దావీదుకు కలిగిన రాజు పాత్రను తెలియజేస్తుంది.
- source_word: ᾧ καὶ εἶπεν μαρτυρήσας
  choice: దావీదు గురించి సాక్ష్యమిస్తూ ఆయన ఇలా అన్నాడు
  rationale: గ్రీకు సంబంధ సర్వనామం దత్తివాచకంలో ఉన్నా, సందర్భార్థం దావీదు గురించి దేవుడు సాక్ష్యం చెప్పాడనేది. తెలుగులో ఈ రూపం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: Εὗρον
  choice: నేను కనుగొన్నాను
  rationale: పూర్తయిన కార్యాన్ని తెలిపే గ్రీకు భూతకాల రూపాన్ని తెలుగులో సహజమైన భూతకాలంతో అందించింది.
- source_word: τὸν τοῦ Ἰεσσαί
  choice: యెష్షయి కుమారుడైన
  rationale: ఈ సంక్షిప్త గ్రీకు షష్ఠీవిభక్తి ప్రయోగం సందర్భంలో ‘యెష్షయి కుమారుడు’ అనే అర్థాన్ని ఇస్తుంది.
- source_word: ἄνδρα
  choice: మనిషి
  rationale: ἀνήρ ఇక్కడ దావీదు అనే పురుషుణ్ణి సూచిస్తుంది. ‘మనిషి’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని వ్యక్తిగత సూచనను కాపాడుతుంది.
- source_word: κατὰ τὴν καρδίαν μου
  choice: నా హృదయానికి అనుగుణమైన
  rationale: κατά + ద్వితీయావిభక్తి ఇక్కడ దేవుని హృదయం లేదా అంతరంగ సంకల్పానికి అనుగుణతను సూచిస్తుంది. ఈ అనువాదం కేవలం భావోద్వేగ సాన్నిహిత్యంగా అపార్థం కాకుండా మూల రూపకాన్ని నిలుపుతుంది.
- source_word: πάντα τὰ θελήματά μου
  choice: నా సంకల్పాలన్నిటినీ
  rationale: θελήματα గ్రీకులో బహువచనం. ‘సంకల్పాలన్నిటినీ’ ఆ సంఖ్యను సహజమైన తెలుగులో కాపాడి, దేవుని వివిధ ఉద్దేశాలు లేదా ఆదేశాల భావాన్ని తెలియజేస్తుంది.
- source_word: ποιήσει
  choice: నెరవేరుస్తాడు
  rationale: ‘చేస్తాడు’ అనే అక్షరార్థ రూపం ఈ వాక్యంలో తెలుగులో అసహజంగా ఉంటుంది. సంకల్పాలకు సంబంధించిన సందర్భంలో ‘నెరవేరుస్తాడు’ ποιέω యొక్క కార్యసాధన భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: దావీదు దేవుని హృదయానికి అనుగుణమైనవాడనే వర్ణన
  choice: నా హృదయానికి అనుగుణమైన మనిషి
  alternative: నా మనసుకు నచ్చిన మనిషి
  rationale: ఎంచుకున్న రూపం గ్రీకు ‘హృదయం’ రూపకాన్ని మరియు అనుగుణత భావాన్ని కాపాడుతుంది. ప్రత్యామ్నాయం దీన్ని వ్యక్తిగత ఇష్టానికి మాత్రమే పరిమితం చేసే ప్రమాదం ఉంది.
- issue: దేవుడు దావీదును రాజుగా ‘లేవనెత్తడం’
  choice: రాజుగా నిలబెట్టాడు
  alternative: రాజుగా లేవనెత్తాడు
  rationale: ఇక్కడ భావం పునరుత్థానం కాదు, రాజుగా ముందుకు తేవడం. ‘నిలబెట్టాడు’ సందర్భార్థాన్ని స్పష్టం చేస్తూనే దేవుని కార్యసాధక పాత్రను నిలుపుతుంది.
- issue: θελήματα యొక్క బహువచనం
  choice: నా సంకల్పాలన్నిటినీ
  alternative: నా చిత్తమంతటినీ
  rationale: మూలంలోని బహువచనాన్ని కాపాడటం దేవుని అనేక ఉద్దేశాలు లేదా కోరిన కార్యాల భావాన్ని నిలుపుతుంది; ఏకవచన ప్రత్యామ్నాయం తెలుగులో సులభమైనా మూల సంఖ్యను సమతలీకరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘రాజుగా నిలబెట్టాడు,’ ‘హృదయానికి అనుగుణమైన,’ ‘సంకల్పాలన్నిటినీ’ వంటి రూపాలు సహజత్వం మరియు మూలభాషా ఖచ్చితత్వం మధ్య సమతుల్యతను కాపాడుతాయి.
