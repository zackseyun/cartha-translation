id: ACT.13.32
reference: Acts 13:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ὑμᾶς εὐαγγελιζόμεθα τὴν πρὸς τοὺς πατέρας ἐπαγγελίαν γενομένην
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/032.yaml
  text: And we ourselves proclaim to you the good news of the promise made to the fathers,[a]
translation:
  language: te
  text: మరియు మేము మీకు, పితరులకు చేసిన వాగ్దానాన్ని గురించిన శుభవార్తను ప్రకటిస్తున్నాం:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పూర్వీకులు.” గ్రీకు మూలంలో “పితరులు” అని ఉంది; ఇది ఇశ్రాయేలు ఒడంబడిక చరిత్రలోని పూర్వపితరులను సూచించే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: కూడా
  rationale: మునుపటి వాదనతో అనుసంధానిస్తూ, పౌలు సహచరుల ప్రస్తుత ప్రకటనను ముందున్న సాక్ష్యంతో కలుపుతుంది.
- source_word: ἡμεῖς
  choice: మేము
  rationale: తెలుగులో క్రియారూపమే కర్తను తెలుపగలిగినా, ప్రత్యేక సర్వనామాన్ని ఉంచడం గ్రీకులోని వ్యక్త కర్తకు ఉన్న ఉద్ఘాటనను సహజంగా ప్రతిబింబిస్తుంది; ‘మేమే’ అనడం అతిగా ప్రత్యేకతను సూచించవచ్చు.
- source_word: ὑμᾶς
  choice: మీకు
  rationale: εὐαγγελιζόμεθα క్రియతో శుభవార్త అందుకునే వారిని తెలుగులో సహజంగా చతుర్థీ విభక్తితో సూచిస్తుంది.
- source_word: εὐαγγελιζόμεθα
  choice: శుభవార్తను ప్రకటిస్తున్నాం
  rationale: మంచి వార్తను తెలియజేయడం అనే క్రియార్థాన్ని స్పష్టంగా ఉంచుతూ, కేవలం మతపరమైన పారిభాషిక పదంపై ఆధారపడదు.
- source_word: τὴν ... ἐπαγγελίαν
  choice: వాగ్దానాన్ని
  rationale: ఇక్కడ సాధారణ ప్రకటనకన్నా దేవుడు చేసిన నిర్దిష్ట వాగ్దానమే ఉద్దేశం.
- source_word: πρὸς τοὺς πατέρας
  choice: పితరులకు
  rationale: గ్రీకులోని పురుష కుటుంబపదాన్ని, ఇశ్రాయేలు ఒడంబడిక చరిత్రలోని పూర్వపితరుల సూచనను నిలుపుతుంది; మూలంలో లేని ‘మన’ అనే స్వామ్యార్థాన్ని చేర్చదు.
- source_word: γενομένην
  choice: చేసిన
  rationale: వాగ్దానం పితరులకు చేయబడిందనే భావాన్ని సహజమైన తెలుగు ప్రయోగంలో ఇస్తుంది; తరువాతి వచనంలోని నెరవేర్పును ముందుగానే చేర్చదు.
theological_decisions:
- issue: πατέρες పదం అనువాదం
  choice: పితరులు
  alternative: పూర్వీకులు
  rationale: πατέρες అనే మూలపదంలోని పురుష కుటుంబార్థాన్నీ, ఇశ్రాయేలు ఒడంబడిక చరిత్రకు సంబంధించిన సూచననూ ప్రధాన పాఠంలో నిలుపుతూ, సాధారణ పాఠకునికి స్పష్టమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనదిగా, అయితే గౌరవప్రదమైన బైబిలు శైలిని నిలుపుతూ రూపొందించబడింది. ‘పితరులు’ కొంత శాస్త్రగ్రంథీయ పదమైనా, మూలంలోని ఒడంబడిక-చారిత్రక భావాన్ని కాపాడుతుంది; పాదసూచిక సాధారణ ప్రత్యామ్నాయాన్ని వివరిస్తుంది.
