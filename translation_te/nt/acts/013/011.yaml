revisions:
- from: ఇప్పుడు ఇదిగో, ప్రభువు చెయ్యి నీ మీద ఉంది. నీవు కొంతకాలం సూర్యుణ్ణి చూడలేక గుడ్డివాడిగా ఉంటావు.” వెంటనే అతని మీద మసకా చీకటీ కమ్ముకున్నాయి; అతడు అటూ ఇటూ తిరుగుతూ, తనను చెయ్యిపట్టుకొని నడిపించేవారి కోసం వెదికాడు.
  to: “ఇప్పుడు ఇదిగో, ప్రభువు చేయి నీ మీద ఉంది; నీవు కొంతకాలం సూర్యుణ్ణి చూడకుండా గుడ్డివాడిగా ఉంటావు.” వెంటనే అతని మీద మసక, చీకటి పడిపోయాయి; అతడు అటూ ఇటూ తిరుగుతూ, తనను చేతిపట్టుకొని నడిపించేవారి కోసం వెదుకుతున్నాడు.
  rationale: The revision corrects the unmatched quotation mark and makes small, safe adjustments for closer fidelity to the Greek event and imperfect aspect. It retains the biblical metaphor ‘ప్రభువు చేయి,’ the unspecified temporary duration, and the non-interpretive sense of περιάγων as moving about.
