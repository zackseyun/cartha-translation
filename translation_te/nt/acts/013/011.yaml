id: ACT.13.11
reference: Acts 13:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ χεὶρ κυρίου ἐπὶ σέ, καὶ ἔσῃ τυφλὸς μὴ βλέπων τὸν ἥλιον ἄχρι καιροῦ. παραχρῆμα ⸀δὲ ⸀ἔπεσεν ἐπ’ αὐτὸν ἀχλὺς καὶ σκότος, καὶ περιάγων ἐζήτει χειραγωγούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/011.yaml
  text: And now[a], behold, the hand of the Lord is upon you, and you will be blind, not seeing the sun for a time. Immediately a mist and darkness fell upon him, and going about[c][b], he was seeking people to lead him by the hand.
translation:
  language: te
  text: “ఇప్పుడు ఇదిగో, ప్రభువు చేయి నీ మీద ఉంది; నీవు కొంతకాలం సూర్యుణ్ణి చూడకుండా గుడ్డివాడిగా ఉంటావు.” వెంటనే అతని మీద మసక, చీకటి పడిపోయాయి; అతడు అటూ ఇటూ తిరుగుతూ, తనను చేతిపట్టుకొని నడిపించేవారి కోసం వెదుకుతున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే మూలపద ప్రయోగాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, సజీవంగా నిలుపుతుంది.
- source_word: χεὶρ κυρίου
  choice: ప్రభువు చెయ్యి
  rationale: దైవ కార్యాన్ని, ఇక్కడ తీర్పును సూచించే బైబిలు రూపకాన్ని వివరణగా మార్చకుండా యథాతథంగా నిలుపుతుంది.
- source_word: ἔσῃ τυφλὸς μὴ βλέπων τὸν ἥλιον
  choice: సూర్యుణ్ణి చూడలేక గుడ్డివాడిగా ఉంటావు
  rationale: గుడ్డితనాన్ని మరియు సూర్యుణ్ణి చూడకపోవడాన్ని రెండింటినీ సహజమైన తెలుగు వాక్యనిర్మాణంలో స్పష్టంగా ఉంచుతుంది.
- source_word: ἄχρι καιροῦ
  choice: కొంతకాలం
  rationale: ముగింపు నిర్దిష్టంగా చెప్పని తాత్కాలిక వ్యవధిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παραχρῆμα
  choice: వెంటనే
  rationale: తీర్పు తక్షణమే అమలైన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀχλὺς καὶ σκότος
  choice: మసకా చీకటీ
  rationale: చూపును కమ్మే మసకను మరియు చీకటిని వేర్వేరు కాని అనుసంధానమైన అనుభవాలుగా నిలుపుతుంది.
- source_word: περιάγων
  choice: అటూ ఇటూ తిరుగుతూ
  rationale: మూలంలోని ‘తిరుగుతూ/చుట్టూ వెళుతూ’ అనే భావాన్ని అంధత్వ సందర్భంలో అతిగా ‘తడుముకుంటూ’ అని వ్యాఖ్యానించకుండా సహజంగా అందిస్తుంది.
- source_word: ἐζήτει χειραγωγούς
  choice: తనను చెయ్యిపట్టుకొని నడిపించేవారి కోసం వెదికాడు
  rationale: χειραγωγός అనే పదంలోని చేతిపట్టి నడిపించే నిర్దిష్ట భావాన్ని సాధారణ ‘మార్గదర్శకులు’ కంటే స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘ప్రభువు చెయ్యి’ అనే రూపకం స్వభావం
  choice: ప్రభువు చెయ్యి నీ మీద ఉంది
  alternative: ప్రభువు తీర్పు నీ మీద ఉంది / ప్రభువు నిన్ను శిక్షిస్తున్నాడు
  rationale: సందర్భంలో ఇది దైవ తీర్పును సూచించినా, మూలంలోని బైబిలు రూపకాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. ‘చెయ్యి’ మరియు ‘చెయ్యిపట్టుకొని’ రూపాలు ప్రస్తుత వాడుకలో సహజంగా ఉండి, మూలంలోని concrete imageryని నిలుపుతాయి.
