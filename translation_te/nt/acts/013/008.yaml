  - severity: medium
    issue: ἀνθύπατος is rendered by the overly general «అధిపతి».
    rationale: ἀνθύπατος denotes the Roman provincial office “proconsul.” «ప్రాంతాధిపతి» better preserves its governmental and provincial specificity without requiring an awkward untranslated loanword.
