source:
  edition: SBLGNT
  text: ἀνθίστατο δὲ αὐτοῖς Ἐλύμας ὁ μάγος, οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ, ζητῶν διαστρέψαι τὸν ἀνθύπατον ἀπὸ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/008.yaml
  text: But Elymas the magician opposed them—for that is how his name is translated—seeking to turn the proconsul away from the faith[a][b].
translation:
  language: te
  text: అయితే మాంత్రికుడైన ఎలీమా వారిని ఎదిరించాడు—అతని పేరు ఇలా అనువదించబడుతుంది—అతడు ప్రాంతాధిపతిని విశ్వాసం నుండి తిప్పివేయడానికి ప్రయత్నించాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ఆ విశ్వాసం నుండి.” గ్రీకు పదబంధం అతణ్ణి ప్రత్యేకంగా క్రైస్తవ విశ్వాసం నుండి తిప్పివేయడాన్నిగానీ, సాధారణంగా విశ్వసించకుండా చేయడాన్నిగానీ సూచించవచ్చు.'
    reason: alternative_reading
  - marker: b
    text: “ఎలీమా” అనేది అనువదించబడిన లేదా వ్యాఖ్యానించబడిన పేరుగా ఇక్కడ వివరించబడింది; దాని ఖచ్చితమైన వ్యుత్పత్తి అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθίστατο
  choice: ఎదిరించాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న ప్రతిఘటనను సూచిస్తుంది; ‘ఎదిరించాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి విరోధ భావాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి సందర్భంలోని అనుకూల స్వీకరణకు విరుద్ధతను సూచిస్తుంది.
- source_word: αὐτοῖς
  choice: వారిని
  rationale: సందర్భంలో ముందే ప్రస్తావించబడిన బర్నబా, సౌలులను సూచించే సర్వనామాన్ని మూలానికి దగ్గరగా ఉంచుతుంది.
- source_word: Ἐλύμας ὁ μάγος
  choice: మాంత్రికుడైన ఎలుమా
  rationale: పేరును లిప్యంతరీకరించి, μάγος అనే పదాన్ని సులభంగా అర్థమయ్యే ‘మాంత్రికుడు’గా అనువదిస్తుంది; అవసరానికి మించిన నిందార్థాన్ని జోడించదు.
- source_word: οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ
  choice: అతని పేరు ఇలా అనువదించబడుతుంది
  rationale: పేరును అనువదించడం లేదా వ్యాఖ్యానించడం అనే μεθερμηνεύεται భావాన్ని, దాని వ్యుత్పత్తి ఖచ్చితమని చెప్పకుండా నిలుపుతుంది.
- source_word: ζητῶν
  choice: ప్రయత్నించాడు
  rationale: ఎదిరించడంలో ఉన్న ఉద్దేశాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: διαστρέψαι
  choice: తిప్పివేయడానికి
  rationale: వ్యక్తిని విశ్వాసం నుండి దూరం చేయాలనే సందర్భోచిత భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὸν ἀνθύπατον
  choice: అధిపతిని
  rationale: రోమా పరిపాలనా పదవిని సూచించే ἀνθύπατοςకు గౌరవప్రదమైన, చదవడానికి సులభమైన తెలుగు పదాన్ని ఎంచుకుంది.
- source_word: ἀπὸ τῆς πίστεως
  choice: విశ్వాసం నుండి
  rationale: πίστιςకు ‘విశ్వాసం’ అనే ప్రాథమిక భావాన్ని నిలుపుతూ, అది నిర్దిష్ట క్రైస్తవ విశ్వాసాన్నా లేక విశ్వసించే స్పందననో సూచించవచ్చనే సందిగ్ధతను ప్రధాన పాఠంలో బలవంతంగా పరిష్కరించదు.
theological_decisions:
- issue: ἀπὸ τῆς πίστεως లో πίστις భావం
  choice: విశ్వాసం నుండి
  alternative: ఆ విశ్వాసం నుండి / నమ్మకుండా
  rationale: గ్రీకు నిర్దిష్ట ఉపపదం సందర్భంలో క్రైస్తవ విశ్వాసాన్ని సూచించవచ్చు; అయినా ఈ పదబంధం విశ్వసించే స్పందన నుండి దూరం చేయడమనే విస్తృత భావాన్నీ అనుమతిస్తుంది. తెలుగు ప్రధాన పాఠం ఈ రెండింటికీ చోటిస్తుంది; వివరణను పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. వివరణాత్మక మధ్యవాక్యాన్ని దీర్ఘవిరామాలతో నిలిపి, మూలంలోని వ్యాఖ్య స్వరూపాన్ని కాపాడింది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
