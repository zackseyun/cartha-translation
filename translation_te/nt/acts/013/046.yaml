id: ACT.13.46
reference: Acts 13:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: παρρησιασάμενοί ⸀τε ὁ Παῦλος καὶ ὁ Βαρναβᾶς εἶπαν· Ὑμῖν ἦν ἀναγκαῖον πρῶτον λαληθῆναι τὸν λόγον τοῦ θεοῦ· ⸀ἐπειδὴ ἀπωθεῖσθε αὐτὸν καὶ οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς, ἰδοὺ στρεφόμεθα εἰς τὰ ἔθνη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/046.yaml
  text: So Paul and Barnabas spoke boldly and said[a], “It was necessary that the word of God be spoken first to you. Since you are rejecting it and judging yourselves unworthy of eternal life, look, we are turning to the Gentiles.”
translation:
  language: te
  text: 'అప్పుడు పౌలు, బర్నబా ధైర్యంగా ఇలా అన్నారు: “దేవుని వాక్యం మీకు ముందుగా చెప్పబడడం అవసరం. మీరు దాన్ని తోసిపుచ్చుతూ, నిత్యజీవానికి అర్హులు కారని మిమ్మల్ని మీరే తీర్పు తీర్చుకుంటున్నారు కాబట్టి, ఇదిగో, మేము అన్యజనులవైపు[a] తిరుగుతున్నాం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “జనాలవైపు.” ఇక్కడ ఈ మాట సమాజమందిరంలోని యూదు శ్రోతలకు భిన్నంగా యూదేతరులను సూచిస్తుంది; అందుకే ప్రధాన పాఠ్యంలో “అన్యజనులు” అని వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησιασάμενοί
  choice: ధైర్యంగా
  rationale: ఈ కృదంతం ధైర్యంతో, బహిరంగంగా మాట్లాడడాన్ని సూచిస్తుంది. తెలుగులో ప్రధాన క్రియకు క్రియావిశేషణంగా ‘ధైర్యంగా ఇలా అన్నారు’ అనడం సహజంగా ఉండి మూలంలోని భావాన్ని నిలుపుతుంది.
- source_word: Ὑμῖν ... πρῶτον
  choice: మొదట మీకే
  rationale: దేవుని వాక్యం మొదట ఈ శ్రోతలకు చెప్పబడాలనే క్రమప్రాధాన్యాన్ని ‘మీకే’ స్పష్టంగా తెలియజేస్తుంది; ‘మాత్రమే’ అనే భావాన్ని జోడించదు.
- source_word: λαληθῆναι τὸν λόγον τοῦ θεοῦ
  choice: దేవుని వాక్యం ... చెప్పబడడం
  rationale: λαληθῆναι యొక్క కర్మణి రూపాన్ని కాపాడుతూ, λόγος τοῦ θεοῦ అనే స్థిరమైన బైబిలు పదబంధాన్ని ‘దేవుని వాక్యం’గా అందిస్తుంది.
- source_word: ἀπωθεῖσθε αὐτόν
  choice: మీరు దాన్ని తోసిపుచ్చుతూ
  rationale: ἀπωθέομαιలోని క్రియాశీల నిరాకరణ, దూరంగా నెట్టివేయడం అనే బలాన్ని ‘తోసిపుచ్చుతూ’ వ్యక్తం చేస్తుంది. ‘దాన్ని’ అనేది దేవుని వాక్యాన్ని సూచిస్తుంది.
- source_word: οὐκ ἀξίους κρίνετε ἑαυτούς
  choice: అర్హులు కారని మిమ్మల్ని మీరే తీర్పు తీర్చుకుంటున్నారు
  rationale: κρίνετεలోని తీర్పు భావాన్నీ, ἑαυτούςలోని ఆత్మనిర్దేశక బలాన్నీ స్పష్టంగా కాపాడుతుంది; పౌలు వారిని అనర్హులని తీర్పు తీర్చాడనే భావాన్ని చేర్చదు.
- source_word: τῆς αἰωνίου ζωῆς
  choice: నిత్యజీవానికి
  rationale: ἀξίουςతో వచ్చే సంబంధాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తూ ‘eternal life’ అనే భావాన్ని ‘నిత్యజీవం’గా నిలుపుతుంది.
- source_word: ἰδοὺ στρεφόμεθα εἰς τὰ ἔθνη
  choice: ఇదిగో, మేము అన్యజనులవైపు తిరుగుతున్నాం
  rationale: ἰδούలోని దృష్టి ఆకర్షణను ‘ఇదిగో’తో, వర్తమాన క్రియలోని మలుపును ‘తిరుగుతున్నాం’తో కాపాడుతుంది. సందర్భంలో τὰ ἔθνη యూదేతరులను సూచిస్తున్నందున ‘అన్యజనులు’ వాడబడింది.
theological_decisions:
- issue: τὰ ἔθνη యొక్క సందర్భార్థం
  choice: అన్యజనులు
  alternative: జనాలు / దేశాల ప్రజలు
  rationale: సమాజమందిరంలోని యూదు శ్రోతలకూ యూదేతరులకూ మధ్య ఉన్న తక్షణ వ్యత్యాసాన్ని ‘అన్యజనులు’ స్పష్టంగా చూపిస్తుంది; భౌగోళిక దేశాలను మాత్రమే సూచిస్తున్నట్లు భావాన్ని కుదించదు.
- issue: οὐκ ἀξίους κρίνετε ἑαυτούς యొక్క తీర్పు ఎవరిది
  choice: తమను తామే అర్హులు కారని తీర్పు తీర్చుకుంటున్నారు
  alternative: పౌలు వారిని నిత్యజీవానికి అనర్హులని తీర్పు తీర్చుతున్నాడు
  rationale: గ్రీకు వాక్యంలో κρίνετεకు కర్త శ్రోతలే; ἑαυτούς ఆ తీర్పు తిరిగి వారిపైనే పడుతుందని స్పష్టపరుస్తుంది. అందువల్ల మూలంలోని బాధ్యతను నిలుపుతూ అదనపు సిద్ధాంత నిర్ణయాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. ‘దేవుని వాక్యం,’ ‘నిత్యజీవం,’ ‘అన్యజనులు’ వంటి విస్తృతంగా గుర్తించబడే బైబిలు పదాలు నిలుపబడ్డాయి. మూలంలోని ధైర్యవంతమైన ప్రకటన, క్రమప్రాధాన్యం, శ్రోతల స్వీయ తీర్పు, అన్యజనులవైపు మలుపు అన్నీ స్పష్టంగా ఉంచబడ్డాయి.
