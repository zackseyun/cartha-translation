  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν τούτῳ πᾶς ὁ πιστεύων δικαιοῦται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/039.yaml
  text: In him everyone who believes is justified[a].
translation:
  language: te
  text: ఆయనలో విశ్వసించే ప్రతి ఒక్కరూ నీతిమంతులుగా తీర్చబడతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈయన ద్వారా ప్రతి విశ్వాసి నీతిమంతునిగా తీర్చబడతాడు.” గ్రీకు పదబంధాన్ని మరింత అక్షరార్థంగా “ఈయనలో/ఈయన ద్వారా” అని అనువదించవచ్చు; ఇక్కడ అది యేసును సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ఆయనలో
  rationale: సమీప సందర్భంలో సూచించబడిన యేసును τούτῳ వ్యక్తిగతంగా తిరిగి సూచిస్తుంది. ‘ఆయనలో’ అనే రూపం గ్రీకు ἐν నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: πᾶς ὁ πιστεύων
  choice: విశ్వసించే ప్రతి ఒక్కరూ
  rationale: ఆర్టికల్‌తో ఉన్న వర్తమాన కృదంతం సాధారణంగా విశ్వసించే ప్రతి వ్యక్తిని సూచిస్తుంది; ఈ రూపం దాని సార్వత్రిక, సాధారణ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: δικαιοῦται
  choice: నీతిమంతులుగా తీర్చబడుతున్నారు
  rationale: δικαιόω యొక్క న్యాయస్థాన సంబంధ భావాన్ని కాపాడుతూ, నైతికంగా మార్పు చెందడం అనే భావంతో కలిపివేయకుండా తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ἐν τούτῳ దేనిని సూచిస్తుంది?
  choice: యేసును వ్యక్తిగతంగా సూచించే ‘ఆయనలో’
  alternative: ‘ఈయన ద్వారా’ లేదా ‘ఈయనలో’
  rationale: ముందటి సందర్భంలో పాపక్షమాపణ యేసు ద్వారా ప్రకటించబడుతుందని ఉంది; అందువల్ల వ్యక్తిగత సూచన వాక్యప్రవాహానికి అనుగుణం. అయితే గ్రీకు పదబంధంలోని సాధనార్థక అవకాశాన్ని పాదసూచికలో ఉంచాం.
- issue: పౌలు సందర్భంలో δικαιοῦται అనువాదం
  choice: ‘నీతిమంతులుగా తీర్చబడుతున్నారు’ అనే న్యాయస్థాన సంబంధ భావం
  alternative: ‘నీతిమంతులని ప్రకటించబడుతున్నారు’ లేదా ‘నిర్దోషులుగా విడుదల చేయబడుతున్నారు’
  rationale: తక్షణ సందర్భంలో ధర్మశాస్త్రం మరియు నీతిమంతులుగా తీర్చబడటం మధ్య వ్యత్యాసం ఉంది. ఎంచుకున్న రూపం న్యాయస్థాన సంబంధ భావాన్ని నిలుపుతూ, దానిని నైతిక పరివర్తనగా గానీ కేవలం నిర్దోషిగా విడుదల చేయడంగా గానీ కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘నీతిమంతులుగా తీర్చబడుతున్నారు’ అనే రూపం ధార్మిక పరిచయం ఉన్న పదజాలాన్ని వాడినా, సాధారణ పాఠకునికి అర్థమయ్యేలా న్యాయనిర్ణయ భావాన్ని నిలుపుతుంది.
