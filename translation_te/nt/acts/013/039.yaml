revisions:
- from: ఆయనలో విశ్వసించే ప్రతి ఒక్కరూ నీతిమంతులుగా తీర్చబడుతున్నారు.[a]
  to: ఆయనలో విశ్వసించే ప్రతి ఒక్కరూ నీతిమంతులుగా తీర్చబడతారు.[a]
  rationale: The revision removes an unwarranted progressive nuance from the generic present passive and repairs the footnote’s scope while preserving the personally referential reading of ἐν τούτῳ and the forensic force of δικαιοῦται.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:26:38Z'
review_pass:
  verdict: revise
  source_fidelity: ‘ఆయనలో’ appropriately takes ἐν τούτῳ as an anaphoric personal reference to Jesus, and ‘విశ్వసించే ప్రతి ఒక్కరూ’ accurately represents πᾶς ὁ πιστεύων. However, ‘తీర్చబడుతున్నారు’ gives an unnecessarily progressive, ongoing sense. The Greek present passive is generic here and is more naturally conveyed in Telugu with ‘తీర్చబడతారు.’
  naturalness: The revised wording is natural modern standard Telugu and retains a dignified scriptural register. ‘నీతిమంతులుగా తీర్చబడతారు’ communicates a judicial verdict without excessive paraphrase.
  terminology: ‘నీతిమంతులుగా తీర్చబడతారు’ is retained for δικαιοῦται because it preserves the established forensic/justification sense. The alternative footnote is recast so that ‘through/by this one’ modifies the justification, not the act of believing.
  issues:
  - severity: medium
    issue: Progressive form in the main text
    rationale: ‘నీతిమంతులుగా తీర్చబడుతున్నారు’ can imply that justification is presently in process. In this generic assertion, δικαιοῦται is better rendered ‘నీతిమంతులుగా తీర్చబడతారు.’
  - severity: medium
    issue: Footnote has misplaced syntactic attachment
    rationale: ‘ఈయన ద్వారా విశ్వసించే ప్రతి ఒక్కరూ’ can mean ‘everyone who believes through him,’ whereas the alternative rendering ‘by this one’ qualifies δικαιοῦται. The Telugu footnote should attach ‘ఈయన ద్వారా’ to the declaration/justification.
  revised_text: ఆయనలో విశ్వసించే ప్రతి ఒక్కరూ నీతిమంతులుగా తీర్చబడతారు.[a]
  revised_footnotes:
