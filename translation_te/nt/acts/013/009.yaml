id: ACT.13.9
reference: Acts 13:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Σαῦλος δέ, ὁ καὶ Παῦλος, πλησθεὶς πνεύματος ⸀ἁγίου ἀτενίσας εἰς αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/009.yaml
  text: But Saul[a], who was also called Paul, filled with the Holy Spirit, looked intently at him
translation:
  language: te
  text: అయితే పౌలు అని కూడా పిలువబడే సౌలు[a], పరిశుద్ధాత్మతో నింపబడి, అతని వైపు తదేకంగా చూశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పౌలు అనే పేరు కూడా ఉన్న సౌలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σαῦλος
  choice: సౌలు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
- source_word: δέ
  choice: అయితే
  rationale: ముందటి కథనంతో స్వల్ప వ్యత్యాసాన్ని, కథన మలుపును సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: ὁ καὶ Παῦλος
  choice: పౌలు అనే పేరు కూడా ఉన్న
  rationale: సౌలుకు పౌలు అనే మరో పేరు కూడా ఉందని వివరణాత్మక సమాసం తెలియజేస్తుంది; పేరు మారిందని మూలపాఠం చెప్పని కారణంగా అలా అనువదించలేదు.
- source_word: πλησθεὶς
  choice: నింపబడి
  rationale: πίμπλημι క్రియలోని కర్మణి భావాన్ని నిలుపుతూ, తరువాతి ప్రధాన క్రియతో సహజంగా అనుసంధానిస్తుంది.
- source_word: πνεύματος ἁγίου
  choice: పరిశుద్ధాత్మతో
  rationale: నింపబడటానికి సంబంధించిన సాధన/విషయ భావాన్ని సహజమైన తెలుగు విభక్తితో వ్యక్తం చేస్తుంది; అపొస్తలుల కార్యముల సందర్భంలో ఇది దేవుని పరిశుద్ధాత్మను సూచిస్తుంది.
- source_word: ἀτενίσας
  choice: తదేకంగా చూశాడు
  rationale: స్థిరంగా, శ్రద్ధగా చూపు నిలిపే క్రియ బలాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: εἰς αὐτόν
  choice: అతని వైపు
  rationale: ఎలుమపై చూపు కేంద్రీకరించిన దిశను εἰς సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: πνεύματος ἁγίου అనువాదం
  choice: పరిశుద్ధాత్మ
  alternative: ఒక పరిశుద్ధ ఆత్మ
  rationale: అపొస్తలుల కార్యములలో, ముఖ్యంగా శక్తినిచ్చి నింపే సందర్భాలలో, ఈ పదబంధం దేవుని పరిశుద్ధాత్మనే సూచిస్తుంది; అనిర్దిష్టమైన ఆత్మను కాదు.
- issue: సౌలు–పౌలు పేర్ల సంబంధం
  choice: పౌలు అనే పేరు కూడా ఉన్న సౌలు
  alternative: పౌలు అని కూడా పిలువబడిన సౌలు
  rationale: ὁ καὶ Παῦλος అదనపు పేరును గుర్తిస్తుంది; పేరు మార్పు జరిగిందని చెప్పదు. ప్రధాన అనువాదం ఈ అంశాన్ని అతిగా వివరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి. ‘తదేకంగా’ అనే పదం ἀτενίζω యొక్క గాఢమైన చూపు భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
