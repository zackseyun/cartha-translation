id: ACT.13.48
reference: Acts 13:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀκούοντα δὲ τὰ ἔθνη ⸀ἔχαιρον καὶ ἐδόξαζον τὸν λόγον τοῦ ⸀κυρίου, καὶ ἐπίστευσαν ὅσοι ἦσαν τεταγμένοι εἰς ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/048.yaml
  text: When the Gentiles heard this[a], they began rejoicing and glorifying the word of the Lord, and all who had been appointed for eternal life believed.
translation:
  language: te
  text: అన్యజనులు ఇది విన్నప్పుడు సంతోషించారు మరియు ప్రభువు వాక్యాన్ని మహిమపరిచారు. నిత్యజీవం కొరకు నియమించబడినవారందరూ[a] విశ్వసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిత్యజీవం వైపు మొగ్గుచూపినవారందరూ.” గ్రీకు కృదంతాన్ని వ్యాఖ్యాతలు వేర్వేరు విధాలుగా అర్థం చేసుకున్నారు; అయితే ఇక్కడ “నియమించబడిన” అనే కర్మణి అర్థమే అత్యంత సూటియైనది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούοντα
  choice: ఇది విని
  rationale: వర్తమాన కృదంతాన్ని ప్రధాన క్రియలకు సందర్భాన్ని తెలిపే విధంగా సహజమైన తెలుగులో ఇచ్చాం; సందర్భంలో వారు విన్న సందేశాన్ని సూచించడానికి ‘ఇది’ చేర్చాం.
- source_word: τὰ ἔθνη
  choice: అన్యజనులు
  rationale: అపొస్తలుల కార్యముల సందర్భంలో ఈ పదం సాధారణంగా యూదులు కానివారిని సూచిస్తుంది; ‘అన్యజనులు’ ఆ వ్యత్యాసాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἔχαιρον
  choice: సంతోషిస్తూ
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; తప్పనిసరిగా లేని ఆరంభ భావాన్ని జోడించదు.
- source_word: ἐδόξαζον
  choice: మహిమపరిచారు
  rationale: δοξάζω పదంలోని ‘మహిమపరచడం/ఘనపరచడం’ అనే లూకా రచనలకు సాధారణమైన భావాన్ని నిలుపుతుంది.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: ప్రభువు వాక్యాన్ని
  rationale: λόγος ఇక్కడ ప్రకటించబడిన సందేశాన్ని సూచించినా, ‘వాక్యం’ మూలపాఠపు రూపకాన్ని మరియు బైబిలు వాడుకను నిలుపుతుంది.
- source_word: ἐπίστευσαν
  choice: విశ్వసించారు
  rationale: ఆరిస్ట్ సూచక క్రియను అదనపు వ్యాఖ్యానం లేకుండా సరళ భూతకాలంగా అందిస్తుంది.
- source_word: ὅσοι
  choice: వారందరూ
  rationale: ὅσοι లోని పరిమాణాత్మక భావాన్ని తెలుగులో సహజంగా ‘వారందరూ’ వ్యక్తం చేస్తుంది.
- source_word: τεταγμένοι
  choice: నియమించబడినవారు
  rationale: τάσσω యొక్క పరిపూర్ణ కర్మణి కృదంతాన్ని కర్మణి రూపంలోనే నిలిపి, ముందే నియమించబడి ఉన్న స్థితిని సూచిస్తుంది.
- source_word: εἰς ζωὴν αἰώνιον
  choice: నిత్యజీవం కోసం
  rationale: εἰς లోని లక్ష్యార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: τεταγμένοι అనే పదం దైవిక నియామకాన్ని సూచిస్తుందా, లేక మానవుల అంతరంగ మొగ్గును సూచిస్తుందా?
  choice: నిత్యజీవం కోసం నియమించబడినవారు
  alternative: నిత్యజీవం వైపు మొగ్గుచూపినవారు
  rationale: గ్రీకు పరిపూర్ణ కర్మణి కృదంతానికి ‘నియమించబడినవారు’ అనేది అత్యంత సూటియైన అర్థం. అయితే ఈ వాక్యం చెప్పిన దానికంటే విస్తృతమైన పూర్వనిర్ణయ సిద్ధాంతాన్ని అనువాదం చేర్చదు; వివాదాస్పద ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన బైబిలు శైలిని ఉపయోగించాం. ‘ప్రభువు వాక్యం,’ ‘నిత్యజీవం,’ ‘విశ్వసించారు’ వంటి సుపరిచిత పదబంధాలను నిలిపాం; వివాదాస్పదమైన τεταγμένοι అర్థాన్ని ప్రధాన పాఠ్యంలో కర్మణి రూపంగా ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
