source:
  edition: SBLGNT
  text: λυθείσης δὲ τῆς συναγωγῆς ἠκολούθησαν πολλοὶ τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων τῷ Παύλῳ καὶ τῷ Βαρναβᾷ, οἵτινες προσλαλοῦντες ⸀αὐτοῖς ἔπειθον· αὐτοὺς ⸀προσμένειν τῇ χάριτι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/043.yaml
  text: After the synagogue had been dismissed[a], many of the Jews and devout proselytes followed Paul and Barnabas, who, speaking with them[c][b], were urging them to continue in the grace of God.
translation:
  language: te
  text: సమాజమందిరంలోని సమావేశం ముగిసిన తర్వాత[a], యూదులలోను యూదమతాన్ని స్వీకరించిన భక్తులలోను చాలామంది పౌలును, బర్నబాను అనుసరించారు. వారిద్దరూ వారితో మాట్లాడుతూ, దేవుని కృపలో కొనసాగాలని వారిని ఒప్పిస్తూ ఉన్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమాజమందిరంలో కూడిన సభ రద్దైన తర్వాత.” ఇక్కడ గ్రీకు పదబంధం భవనాన్ని కాక, కూడిన సభ ముగియడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దేవుని కృపలో నిలిచి ఉండాలని వారిని ఒప్పిస్తూ ఉన్నారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λυθείσης ... τῆς συναγωγῆς
  choice: సమాజమందిరపు సమావేశం ముగిసిన తర్వాత
  rationale: జనసమూహం లేదా సమావేశం ముగియడాన్ని సూచించే గ్రీకు ప్రయోగాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; భవనం తొలగించబడిందనే అపార్థాన్ని నివారిస్తుంది.
- source_word: ἠκολούθησαν
  choice: అనుసరించారు
  rationale: సమావేశం అనంతరం పౌలు, బర్నబాల వెంట వెళ్లిన చర్యను నేరుగా తెలియజేస్తుంది; సందర్భంలో అక్షరార్థం, విస్తృతార్థం రెండింటికీ సరిపోతుంది.
- source_word: πολλοὶ τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων
  choice: యూదుల్లో చాలామంది, భక్తిగల యూదమత స్వీకర్తలు చాలామంది
  rationale: రెండు వర్గాలకూ వర్తించే భాగార్థక నిర్మాణాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది. προσήλυτοι అనేది కేవలం సానుభూతిపరులను కాక యూదమతాన్ని స్వీకరించినవారిని సూచిస్తుంది.
- source_word: προσλαλοῦντες αὐτοῖς
  choice: వారితో మాట్లాడుతూ
  rationale: కొనసాగుతున్న, వారిని ఉద్దేశించిన సంభాషణను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔπειθον
  choice: ప్రోత్సహిస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న చర్యను ప్రతిబింబిస్తుంది; ఈ సందర్భంలోని విజ్ఞాపనాత్మక భావాన్ని తెలుపుతుంది. ‘ఒప్పిస్తూ ఉన్నారు’ కూడా సాధ్యమే.
- source_word: αὐτοὺς προσμένειν
  choice: కొనసాగాలని వారిని
  rationale: ప్రసμένωలోని నిలిచి ఉండడం, కొనసాగడం అనే భావాన్ని సందర్భానుకూలంగా అందిస్తుంది.
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: దేవుని కృపలో
  rationale: గ్రీకు దత్తి విభక్తి సూచించే పరిధి లేదా స్థితిని ‘లో’తో నిలుపుతుంది; దేవుని అనుగ్రహకార్యం మరియు ఆ కృప రూపుదిద్దే జీవన పరిధి మధ్య ఉన్న భావవిస్తృతిని సంకుచితం చేయదు.
theological_decisions:
- issue: ‘దేవుని కృపలో కొనసాగడం’ అనే అపొస్తలుల ప్రోత్సాహం యొక్క అర్థం
  choice: దేవుని కృపలో కొనసాగాలని
  alternative: దేవుని అనుగ్రహంలో నిలిచి ఉండాలని / దేవుని కృపను గురించిన సందేశంలో కొనసాగాలని
  rationale: మూలపదబంధం దేవుని కృపాకార్యాన్నీ, ఆ కృపలో జీవించే స్థితినీ సూచించగలదు. ఒకే సిద్ధాంతపరమైన వివరణకు పరిమితం చేయకుండా మూలంలోని భావవిస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వచనం. ‘సినగోగు’కు బదులు సాధారణ పాఠకులకు అర్థమయ్యే ‘సమాజమందిరం’ వాడబడింది. ‘యూదమత స్వీకర్తలు’ అనేది ప్రసήλυτοι యొక్క పూర్తి మతమార్పిడి భావాన్ని స్పష్టపరుస్తుంది.
