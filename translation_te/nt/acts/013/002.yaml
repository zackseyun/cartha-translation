id: ACT.13.2
reference: Acts 13:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λειτουργούντων δὲ αὐτῶν τῷ κυρίῳ καὶ νηστευόντων εἶπεν τὸ πνεῦμα τὸ ἅγιον· Ἀφορίσατε δή μοι τὸν Βαρναβᾶν ⸀καὶ Σαῦλον εἰς τὸ ἔργον ὃ προσκέκλημαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/002.yaml
  text: While they were ministering to the Lord and fasting[a], the Holy Spirit said, “Set apart for me Barnabas and Saul for the work to which I have called them.”
translation:
  language: te
  text: 'వారు ప్రభువుకు సేవ చేస్తూ[a], ఉపవాసం ఉంటుండగా పవిత్రాత్మ ఇలా అన్నాడు: “నేను వారిని ఏ పని కోసం పిలిచానో, ఆ పని కోసం బర్నబాను, సౌలును నాకోసం ప్రత్యేకపరచండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రభువును ఆరాధిస్తూ.” గ్రీకు క్రియ ఆరాధనాత్మక లేదా ఆచార సంబంధమైన భావఛాయలు గల సేవను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργούντων
  choice: సేవ చేస్తూ
  rationale: ఈ క్రియ ఆరాధన సంబంధమైన భావఛాయలు గల సేవను సూచించగలదు. ‘సేవ చేస్తూ’ అనేది సేవ అనే ప్రధాన భావాన్ని సహజమైన తెలుగులో నిలుపుతూ, దానిని కేవలం ఒక నిర్దిష్ట ఆరాధనా విధిగా పరిమితం చేయదు.
- source_word: τῷ κυρίῳ
  choice: ప్రభువుకు
  rationale: దత్తి విభక్తి ఆ సేవ ఎవరికి ఉద్దేశించబడిందో తెలియజేస్తుంది; ‘ప్రభువుకు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: νηστευόντων
  choice: ఉపవాసం ఉంటుండగా
  rationale: ఈ వర్తమాన కృదంతం మునుపటి క్రియతో సమకాలంలో జరుగుతున్న కార్యాన్ని సూచిస్తుంది.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: పవిత్రాత్మ
  rationale: తెలుగులో స్థిరపడిన, సహజమైన పదం; గ్రీకు వాక్యంలో మాట్లాడే వ్యక్తిగత కర్తగా ఉన్న ఆత్మను నేరుగా నిలుపుతుంది.
- source_word: Ἀφορίσατε
  choice: ప్రత్యేకపరచండి
  rationale: ఒక విశిష్ట ఉద్దేశం కోసం వేరుగా ఉంచడం అనే భావాన్ని ఇస్తుంది; నియామకం లేదా సంఘపరమైన అభిషేకం వంటి సాంకేతిక భావాలను అనవసరంగా చేర్చదు.
- source_word: δή
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఆజ్ఞకు బలం లేదా తక్షణత్వం చేకూర్చే ఈ అవ్యయాన్ని తెలుగులో ‘ఇప్పుడే’ అని పెడితే కాలపరమైన భావం అతిగా నిర్దిష్టమవుతుంది. ప్రత్యక్ష ఆజ్ఞ రూపమే దాని బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: μοι
  choice: నాకోసం
  rationale: ప్రత్యేకపరచడం ఎవరి ఉద్దేశం కోసం జరుగుతుందో స్పష్టంగా తెలియజేస్తుంది.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: బర్నబాను, సౌలును
  rationale: వ్యక్తుల పేర్లను తెలుగులో సాధారణంగా వాడే రూపాల్లో లిప్యంతరీకరించింది.
- source_word: εἰς τὸ ἔργον
  choice: ఆ పని కోసం
  rationale: ἔργον యొక్క విస్తృత అర్థాన్ని నిలుపుతుంది; దానిని ముందుగానే ‘పరిచర్య’ లేదా ఒక నిర్దిష్ట పదవిగా సంకుచితం చేయదు.
- source_word: ὃ προσκέκλημαι αὐτούς
  choice: నేను వారిని ఏ పని కోసం పిలిచానో
  rationale: పూర్ణకాల మధ్యమ రూపం గతంలో జరిగిన పిలుపుకు ప్రస్తుతం కొనసాగుతున్న ప్రాసంగికత ఉందని సూచిస్తుంది; తెలుగు సంబంధ వాక్య నిర్మాణం దాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సామూహిక భక్తి, ఉపవాస సందర్భంలో λειτουργούντων అనువాదం
  choice: ప్రభువుకు సేవ చేస్తూ
  alternative: ప్రభువును ఆరాధిస్తూ
  rationale: మూలపదంలో ఆరాధనాత్మక లేదా ఆచార సంబంధమైన సేవ భావం ఉండవచ్చు, కాని వచనం దానిని కేవలం అధికారిక ఆరాధనకే పరిమితం చేయదు. ప్రధాన పాఠంలో విస్తృత భావాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
- issue: పవిత్రాత్మ వాక్యంలోని మాట్లాడే కర్త
  choice: పవిత్రాత్మ ఇలా అన్నాడు
  alternative: పవిత్రాత్మ ద్వారా చెప్పబడింది
  rationale: గ్రీకు పాఠం పవిత్రాత్మనే ప్రత్యక్షంగా మాట్లాడే కర్తగా చూపుతుంది; కర్తను వ్యక్తిత్వరహితంగా మార్చకుండా దాన్ని నిలిపింది.
- issue: ἀφορίσατε ... εἰς τὸ ἔργον యొక్క భావబలం
  choice: ఆ పని కోసం ... నాకోసం ప్రత్యేకపరచండి
  alternative: పరిచర్యకు నియమించండి
  rationale: విశిష్టమైన దైవిక పని కోసం వేరుగా ఉంచడాన్ని పాఠం చెబుతుంది; అయితే సాంకేతిక అభిషేకం, నియామకం లేదా సంఘ పదవిని అది ఇక్కడ స్పష్టంగా పేర్కొనదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించింది. ‘ప్రత్యేకపరచండి’ ద్వారా ఆజ్ఞ యొక్క బలాన్ని నిలుపుతూ పాతకాలపు క్రియాంతాలను నివారించింది. సంబంధ వాక్యాన్ని ముందుకు తెచ్చి గ్రీకు భావసంబంధాన్ని స్పష్టమైన తెలుగు వాక్యక్రమంలో వ్యక్తం చేసింది.
