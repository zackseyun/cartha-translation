id: ACT.12.4
reference: Acts 12:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃν καὶ πιάσας ἔθετο εἰς φυλακήν, παραδοὺς τέσσαρσιν τετραδίοις στρατιωτῶν φυλάσσειν αὐτόν, βουλόμενος μετὰ τὸ πάσχα ἀναγαγεῖν αὐτὸν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/004.yaml
  text: After arresting him[a], he put him in prison, handing him over to four squads of soldiers to guard him[b], intending to bring him out to the people after the Passover.
translation:
  language: te
  text: అతన్ని అరెస్టు చేసి చెరసాలలో పెట్టి, అతనికి కాపలా కాయడానికి నాలుగు సైనిక బృందాలకు[a] అప్పగించాడు. పస్కా పండుగ[b] తరువాత అతన్ని ప్రజల ముందుకు తీసుకురావాలని అతడు ఉద్దేశించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘సైనికుల నాలుగు చతుష్టయాలు’; అంటే నలుగురు చొప్పున ఉన్న నాలుగు బృందాలు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు πάσχα అంటే ‘పస్కా’; కొన్ని పాత ఆంగ్ల అనువాదాలు ఇక్కడ ‘ఈస్టర్’ అని అనువదించాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: πιάσας
  choice: పట్టుకొని
  rationale: ఈ భూతకాల అసమాపక క్రియ ప్రధాన క్రియకు ముందు జరిగిన అరెస్టును సూచిస్తుంది; సందర్భంలో ‘పట్టుకొని’ అనేది సహజంగా, నిర్బంధంలోకి తీసుకోవడం అనే భావంతో వస్తుంది.
- source_word: ἔθετο εἰς φυλακήν
  choice: చెరసాలలో పెట్టి
  rationale: నిర్బంధించడాన్ని తెలిపే గ్రీకు నుడికారానికి సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు రూపం.
- source_word: παραδοὺς
  choice: అప్పగించాడు
  rationale: పేతురును సైనికుల అదుపుకు అప్పగించడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τέσσαρσιν τετραδίοις στρατιωτῶν
  choice: నాలుగు సైనిక బృందాలకు
  rationale: τετράδιον నలుగురు సైనికుల బృందాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన పదబంధాన్ని వాడి, ప్రతి బృందంలోని ఖచ్చిత సంఖ్యను పాదసూచికలో ఇచ్చాం.
- source_word: φυλάσσειν αὐτόν
  choice: అతనికి కాపలా ఉండడానికి
  rationale: అప్పగించిన ఉద్దేశాన్ని తెలిపే క్రియారూపాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: βουλόμενος
  choice: ఉద్దేశించాడు
  rationale: హేరోదు చేసిన స్థిరమైన యోచనను తెలియజేస్తుంది; కేవలం కోరికగా గానీ, మరీ నిర్దిష్టమైన న్యాయప్రణాళికగా గానీ అతిశయింపదు.
- source_word: μετὰ τὸ πάσχα
  choice: పస్కా పండుగ తరువాత
  rationale: πάσχα యూదుల పస్కాను సూచిస్తుంది. తెలుగు పాఠకులకు పండుగను స్పష్టంగా గుర్తించేందుకు ‘పండుగ’ను జోడించాం.
- source_word: ἀναγαγεῖν αὐτὸν τῷ λαῷ
  choice: అతన్ని ప్రజల ముందుకు తీసుకురావాలని
  rationale: ప్రజల సమక్షంలో బహిరంగంగా ప్రవేశపెట్టే భావాన్ని సహజంగా అందిస్తుంది; మూలపాఠ్యంలో స్పష్టంగా లేని అధికారిక విచారణను చేర్చదు.
- source_word: λαῷ
  choice: ప్రజల
  rationale: ప్రజాసమూహాన్ని సూచించే విస్తృతమైన, సహజమైన తెలుగు పదం.
theological_decisions:
- issue: πάσχα పదం అనువాదం
  choice: పస్కా పండుగ
  alternative: ఈస్టర్
  rationale: గ్రీకు πάσχα ఇక్కడ యూదుల పస్కాను సూచిస్తుంది. కొన్ని పాత ఆంగ్ల అనువాదాల్లో ఉన్న ‘Easter’ మూలపదపు ప్రత్యక్ష భావం కాదు; అందువల్ల మూలభాషకు ప్రాధాన్యమిస్తూ ‘పస్కా పండుగ’ను ప్రధాన పాఠ్యంలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని అనుసరించాం. గ్రీకు వాక్యంలోని వరుస చర్యలను తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం. పాదసూచిక గుర్తులను అవి వివరించే పదబంధాలకే నేరుగా జతచేశాం.
