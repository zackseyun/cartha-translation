  text: κρούσαντος δὲ ⸀αὐτοῦ τὴν θύραν τοῦ πυλῶνος προσῆλθε παιδίσκη ὑπακοῦσαι ὀνόματι Ῥόδη,
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/013.yaml
  text: When he knocked at the door of the gateway[a], a servant girl named Rhoda came to answer.
translation:
  language: te
  text: అతడు గుమ్మపు తలుపు తట్టినప్పుడు, రోదే అనే పనిపిల్ల స్పందించడానికి వచ్చింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాసిపిల్ల.’ గ్రీకు పదం ఇంటిలో పనిచేసే చిన్న వయస్కురాలైన పనిపిల్లను లేదా బానిసగా ఉన్న అమ్మాయిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρούσαντος δὲ αὐτοῦ
  choice: అతడు ... తట్టినప్పుడు
  rationale: Aorist participle with δέ advances the narrative and has temporal force; Telugu ‘తట్టినప్పుడు’ expresses this naturally.
- source_word: θύραν τοῦ πυλῶνος
  choice: ద్వారమండపపు తలుపు
  rationale: θύρα is a door, while πυλών denotes the gateway or entrance structure. ‘ద్వారమండపపు తలుపు’ preserves both the actual door and its entrance setting.
- source_word: προσῆλθε
  choice: వచ్చింది
  rationale: In this household scene, the simple Telugu verb ‘వచ్చింది’ naturally conveys approaching the entrance.
- source_word: παιδίσκη
  choice: పనిపిల్ల
  rationale: The word can denote a young female household servant or an enslaved girl. ‘పనిపిల్ల’ is natural Telugu for her household role without deciding her precise legal status.
- source_word: ὑπακοῦσαι
  choice: ఎవరో తెలుసుకోవడానికి
  rationale: At a closed door, ὑπακούω idiomatically means responding to a knock, often by asking or ascertaining who is there. This Telugu expression communicates that situational purpose naturally without implying that she opened the door.
- source_word: ὀνόματι Ῥόδη
  choice: రోదే అనే
  rationale: The dative construction identifies her name. ‘రోదే’ is a direct Telugu transliteration of Ῥόδη.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ద్వారమండపం’ ద్వారా ఇంటి బయటి ప్రవేశ నిర్మాణం స్పష్టమవుతుంది; ‘ఎవరో తెలుసుకోవడానికి’ అనేది తలుపు తెరవకముందే తట్టినవారికి స్పందించే సందర్భార్థాన్ని అందిస్తుంది.
