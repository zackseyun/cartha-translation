id: ACT.12.5
reference: Acts 12:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ μὲν οὖν Πέτρος ἐτηρεῖτο ἐν τῇ φυλακῇ· προσευχὴ δὲ ἦν ⸀ἐκτενῶς γινομένη ὑπὸ τῆς ἐκκλησίας πρὸς τὸν θεὸν ⸀περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/005.yaml
  text: So Peter was being kept in the prison[a], but earnest prayer was being made to God by the church for him.
translation:
  language: te
  text: కాబట్టి పేతురు చెరసాలలో ఉంచబడి ఉన్నాడు. అయితే సంఘం అతని కోసం దేవునికి పట్టుదలతో[a] ప్రార్థిస్తూనే ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తీవ్రంగా”; గ్రీకు పదం ప్రార్థనలోని తీవ్రతను లేదా నిరంతర పట్టుదలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτηρεῖτο
  choice: ఉంచబడి ఉన్నాడు
  rationale: అసంపూర్ణకాల కర్మణి రూపం కొనసాగుతున్న నిర్బంధాన్ని సూచిస్తుంది. ఈ పదబంధం కర్మణి భావాన్నీ, కొనసాగుతున్న స్థితినీ నిలుపుతుంది; కాపలా విధానాన్ని అనవసరంగా ప్రత్యేకించదు.
- source_word: φυλακῇ
  choice: చెరసాలలో
  rationale: ఇక్కడ నిర్బంధ స్థలాన్ని సూచిస్తుంది. కథన సందర్భంలో ‘చెరసాల’ సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: προσευχὴ ... ἦν ... γινομένη
  choice: ప్రార్థిస్తూనే ఉంది
  rationale: ἦν మరియు వర్తమాన కృదంతం కలిసిన నిర్మాణం కొనసాగుతున్న కార్యాన్ని తెలియజేస్తుంది. తెలుగులో క్రియాశీల నిర్మాణం సహజంగా ఉండి, నిరంతర ప్రార్థన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἐκτενῶς
  choice: పట్టుదలతో
  rationale: ఈ క్రియావిశేషణం తీవ్రతను లేదా నిరంతర పట్టుదలను సూచించగలదు. ‘పట్టుదలతో’ సందర్భంలో సహజంగా ఉండి, ప్రార్థనలోని నిలకడైన శ్రద్ధను వ్యక్తం చేస్తుంది; తీవ్రత భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: ὑπὸ τῆς ἐκκλησίας
  choice: సంఘం
  rationale: ఇది పేతురు కోసం ప్రార్థిస్తున్న క్రైస్తవ సమాజాన్ని సూచిస్తుంది. ‘సంఘం’ ఆధునిక తెలుగు బైబిలు వాడుకలో సహజమైనది; తరువాతి సంస్థాగత అర్థాన్ని తప్పనిసరిగా రుద్దదు.
- source_word: πρὸς τὸν θεὸν
  choice: దేవునికి
  rationale: πρός ఇక్కడ ప్రార్థన ఎవరికి ఉద్దేశించబడిందో తెలియజేస్తుంది. ‘దేవునికి’ సహజమైన తెలుగు ప్రార్థనా ప్రయోగం.
- source_word: περὶ αὐτοῦ
  choice: అతని కోసం
  rationale: మధ్యవర్తిత్వ ప్రార్థన సందర్భంలో περί + షష్ఠీ విభక్తి పేతురు పక్షంగా చేసే ప్రార్థనను సూచిస్తుంది. ‘అతని కోసం’ తెలుగులో సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: μὲν οὖν ... δὲ
  choice: కాబట్టి ... అయితే ...
  rationale: ఈ అవ్యయ జంట కథన పురోగతితో పాటు పేతురు నిర్బంధానికి, సంఘం ప్రార్థనకు మధ్య స్వల్ప వ్యత్యాసాన్ని చూపుతుంది. ఈ తెలుగు జంట ఆ ప్రవాహాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ἐκκλησία పదం అనువాదం
  choice: సంఘం
  alternative: సమాజం / సమూహం
  rationale: ఇక్కడ పేతురు కోసం ప్రార్థిస్తున్న క్రైస్తవ విశ్వాసుల సమాజమే ఉద్దేశం. ‘సంఘం’ సందర్భోచితంగా, సాధారణ తెలుగు పాఠకులకు స్పష్టంగా ఉంటుంది; ఏ ప్రత్యేక సంఘశాఖ పాలనా భావాన్నీ నిర్బంధంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. కొనసాగుతున్న చర్యలను ‘ఉంచబడి ఉన్నాడు,’ ‘ప్రార్థిస్తూనే ఉంది’ అనే రూపాలతో వ్యక్తం చేశాం. మూలంలోని తీవ్రత–పట్టుదల అర్థ విస్తృతిని పాదసూచికలో నిలిపాం.
