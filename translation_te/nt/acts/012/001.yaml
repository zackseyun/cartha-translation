id: ACT.12.1
reference: Acts 12:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Κατ’ ἐκεῖνον δὲ τὸν καιρὸν ἐπέβαλεν Ἡρῴδης ὁ βασιλεὺς τὰς χεῖρας κακῶσαί τινας τῶν ἀπὸ τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/001.yaml
  text: About that time Herod the king laid hands on some from the church to mistreat them[a][b][c].
translation:
  language: te
  text: ఆ సమయం దరిదాపుల్లో[a] రాజైన హేరోదు సంఘానికి చెందిన కొందరిని బాధించడానికి[c] వారిపై చేయి వేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ సమయంలో”; లేదా, “ఆ కాలంలో.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “చేతులు వేశాడు.” ఈ నానుడి సంఘానికి చెందిన కొందరిపై శత్రుత్వపూర్వక చర్య తీసుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “హాని చేయడానికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατ’ ἐκεῖνον δὲ τὸν καιρόν
  choice: ఆ కాలంలో
  rationale: κατάతో వచ్చిన కాలసూచక పదబంధం ఆ కాలం చుట్టుపక్కల లేదా ఆ సమయంలో అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘ఆ కాలంలో’ సహజంగా ఉండి కథన మార్పును కూడా తేలికగా మోస్తుంది; δέను ప్రత్యేక సంధానపదంతో అతిగా అనువదించలేదు.
- source_word: ἐπέβαλεν ... τὰς χεῖρας
  choice: వారిపై చేయి వేశాడు
  rationale: గ్రీకు పదబంధంలోని శరీరాంగ బహువచనాన్ని యథాతథంగా కాక, తెలుగులో సహజమైన ఏకవచన జాతీయంగా ఇచ్చాం. సందర్భంలో ఇది ఆశీర్వాదం కాదు, శత్రుత్వపూర్వక చర్యను సూచిస్తుంది; ‘అరెస్టు చేశాడు’ అనడం భావాన్ని అనవసరంగా సంకుచితం చేస్తుంది.
- source_word: Ἡρῴδης ὁ βασιλεύς
  choice: రాజైన హేరోదు
  rationale: గ్రీకు అన్వయాన్ని కాపాడుతూ ఆధునిక తెలుగులో సహజంగా వ్యక్తి పేరుతో అతని రాజపదవిని కలిపే రూపం.
- source_word: κακῶσαί
  choice: బాధించడానికి
  rationale: ఈ క్రియ హాని చేయడం లేదా దుర్వ్యవహారం చేయడం అనే విస్తృత భావాన్ని కలిగి ఉంది. ‘బాధించడానికి’ వ్యక్తులపై ఉద్దేశించిన హానికర చర్యను సహజంగా తెలుపుతుంది; ‘హింసించడానికి’ అనేది అవసరానికి మించిన తీవ్రత లేదా సాంకేతిక మతపీడన భావాన్ని సూచించవచ్చు.
- source_word: τινας τῶν ἀπὸ τῆς ἐκκλησίας
  choice: సంఘానికి చెందిన కొందరిని
  rationale: ἐκκλησίαతో సంబంధమున్న నిర్దిష్ట సమూహంలోని కొందరిని సూచించే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἐκκλησία పదం అనువాదం
  choice: సంఘం
  alternative: సమాజం; సభ
  rationale: అపొస్తలుల కార్యముల సందర్భంలో ఇది క్రైస్తవ విశ్వాసుల సముదాయాన్ని సూచిస్తుంది. ‘సంఘం’ ఆధునిక తెలుగు బైబిలు వాడుకలో స్పష్టంగా, సహజంగా ఉంటుంది; ‘సభ’ కేవలం సమావేశం అనే భావానికి పరిమితమయ్యే అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కథన శైలి. గ్రీకు నానుడిని తెలుగు నానుడితో నిలుపుతూ, దాని శత్రుత్వ భావాన్ని పాదటిప్పణిలో స్పష్టం చేశాం. అన్ని పాదటిప్పణి గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
