id: ACT.12.7
reference: Acts 12:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄγγελος κυρίου ἐπέστη, καὶ φῶς ἔλαμψεν ἐν τῷ οἰκήματι· πατάξας δὲ τὴν πλευρὰν τοῦ Πέτρου ἤγειρεν αὐτὸν λέγων· Ἀνάστα ἐν τάχει· καὶ ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/007.yaml
  text: And behold[a], an angel of the Lord stood near, and a light shone in the cell. Striking Peter on the side, he woke him, saying[b], “Get up quickly.” And his chains fell off from his hands.
translation:
  language: te
  text: ఇదిగో, ప్రభువు దూత పేతురు దగ్గర నిలిచాడు[a]; ఆ గదిలో[b] వెలుగు ప్రకాశించింది. అతడు పేతురు పక్కలో కొట్టి అతనిని మేల్కొలిపి, “త్వరగా లేచి నిలబడు” అన్నాడు. అతని చేతులనుండి సంకెళ్లు ఊడిపోయాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతని పక్కన నిలిచాడు” లేదా “అకస్మాత్తుగా ప్రత్యక్షమయ్యాడు.” గ్రీకు క్రియ సమీపంలో నిలబడడాన్నీ, ఆకస్మికంగా అక్కడికి రావడాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “చెరసాల గదిలో.” గ్రీకు పదం సాధారణంగా “గది” లేదా “నివాసస్థలం” అని అర్థమిస్తుంది; ఇక్కడి సందర్భం చెరసాలది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: కథనంలోని ఆకస్మిక సంఘటనవైపు పాఠకుని దృష్టిని మళ్లించే గ్రీకు సంభాషణ సూచకపు సజీవ బలాన్ని నిలుపుతుంది.
- source_word: ἄγγελος κυρίου
  choice: ప్రభువు దూత
  rationale: దూత ప్రభువుకు చెందినవాడని లేదా ఆయన పంపినవాడని సూచించే జనిటివ్ నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐπέστη
  choice: అకస్మాత్తుగా అక్కడ నిలిచాడు
  rationale: ఈ క్రియలో ఉండగల ఆకస్మిక ప్రత్యక్షతను, సమీపంలో నిలబడడాన్ని రెండింటినీ సందర్భానుగుణంగా అందిస్తుంది.
- source_word: φῶς ἔλαμψεν
  choice: వెలుగు ప్రకాశించింది
  rationale: నామవాచకం-క్రియ నిర్మాణాన్ని స్పష్టమైన, సహజమైన తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: ἐν τῷ οἰκήματι
  choice: ఆ గదిలో
  rationale: οἴκημα సాధారణంగా గది లేదా నివాసస్థలాన్ని సూచిస్తుంది; చెరసాల సందర్భాన్ని పాఠకుడు గ్రహించగలిగేలా చేస్తూ మూలంలోని సాధారణతను కాపాడుతుంది.
- source_word: πατάξας τὴν πλευρὰν
  choice: పేతురు పక్కన తట్టి
  rationale: πατάσσω యొక్క శారీరక తాకిడి భావాన్ని నిలుపుతూ, మేల్కొలిపే సందర్భంలో అతిగా హింసాత్మకంగా వినిపించని సహజ తెలుగు ప్రయోగాన్ని ఎంచుకుంది.
- source_word: ἤγειρεν αὐτόν
  choice: అతణ్ణి మేల్కొలిపి
  rationale: ἐγείρωకు ‘లేపడం’ అనే విస్తృత అర్థం ఉన్నా, ఇక్కడ నిద్రిస్తున్న పేతురును మేల్కొలపడమే సందర్భార్థం.
- source_word: Ἀνάστα ἐν τάχει
  choice: త్వరగా లేచి నిలబడు
  rationale: ఆజ్ఞలోని అత్యవసరతను, ἀνίστημι సూచించే పైకి లేచి నిలబడే చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν
  choice: పేతురు చేతుల నుంచి సంకెళ్లు ఊడిపడ్డాయి
  rationale: సంకెళ్లు స్వయంగా విడిపోయి పడిన ఆకస్మిక విడుదలను, χείρ అనే ‘చేతులు’ పదాన్ని వ్యాఖ్యానాత్మకంగా ‘మణికట్లు’గా మార్చకుండా కాపాడుతుంది.
theological_decisions:
- issue: ἄγγελος κυρίου లో κύριος అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: నూతన నిబంధనలో దేవుని సూచించే ఈ సందర్భానికి ప్రామాణికమైన ‘ప్రభువు’ సరిపోతుంది; అదనపు మతశాఖాపరమైన భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. మూలంలోని సజీవత కోసం ‘ఇదిగో’ను నిలిపి, ἐπέστη మరియు οἴκημα పదాల అర్థ పరిధిని పాదసూచికల్లో వెల్లడించింది.
