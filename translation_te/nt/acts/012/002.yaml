translation:
  language: te
  text: అతడు యోహాను సోదరుడైన యాకోబును ఖడ్గంతో చంపాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హతమార్చాడు,’ ‘మరణశిక్ష అమలు చేశాడు.’ గ్రీకు పదం యాకోబును చంపినట్లు చెబుతుంది; విస్తృత సందర్భం ఇది అధికారికంగా అమలు చేసిన మరణశిక్ష అయి ఉండవచ్చని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῖλεν
  choice: చంపించాడు
  rationale: ἀναιρέω ఇక్కడ యాకోబు మరణానికి హేరోదు కారకుడయ్యాడని సూచిస్తుంది. సందర్భంలో రాజు స్వయంగా కాక తన అధికారంతో ఈ చర్య చేయించిన భావాన్ని సహజమైన తెలుగులో ‘చంపించాడు’ తెలియజేస్తుంది; అయితే న్యాయపరమైన మరణశిక్షను పదంలోనే నిర్దిష్టం చేయదు.
- source_word: δὲ
  choice: అతడు
  rationale: δέ కథనాన్ని ముందుకు నడిపే స్వల్ప అనుసంధాన పదం. తెలుగులో ప్రత్యేక సంధిపదం లేకుండానే వాక్యప్రవాహం సహజంగా ఉంటుంది; కర్తను సూచించే ‘అతడు’ మునుపటి వాక్యంలోని హేరోదును కొనసాగిస్తుంది.
- source_word: Ἰάκωβον
  choice: యాకోబును
  rationale: గ్రీకు Ἰάκωβος పేరుకు మూలభాషానుసారమైన తెలుగు లిప్యంతరీకరణ.
- source_word: τὸν ἀδελφὸν Ἰωάννου
  choice: యోహాను సోదరుడైన
  rationale: ఏ యాకోబు ఉద్దేశించబడుతున్నాడో తెలిపే ఈ వివరణను సహజమైన తెలుగు విశేషణ నిర్మాణంలో అందిస్తుంది.
- source_word: μαχαίρῃ
  choice: ఖడ్గంతో
  rationale: μάχαιρα ఖడ్గాన్ని లేదా పొట్టి కత్తిని సూచిస్తుంది; ఇక్కడ దత్తివిభక్తి సాధనార్థకంగా ఉంది. ‘ఖడ్గంతో’ ఆయుధాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: హేరోదు చర్య స్వభావం
  choice: ప్రధాన పాఠ్యంలో న్యాయపరమైన మరణశిక్ష అని నిర్దిష్టం చేయకుండా, అతడు యాకోబును చంపించాడని అనువదించబడింది.
  alternative: ‘యాకోబుకు మరణశిక్ష విధించి అమలు చేయించాడు’ అని అనువదించి, ప్రభుత్వపరమైన శిక్షను నొక్కిచెప్పడం.
  rationale: ἀνεῖλεν మరణానికి కారణమయ్యే చర్యను తెలియజేస్తుంది; μαχαίρῃ దాని సాధనాన్ని తెలుపుతుంది. విస్తృత సందర్భం అధికారిక హింసను సూచించినా, ఈ వచనం న్యాయప్రక్రియను స్పష్టంగా పేర్కొనదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘ఖడ్గం’ బైబిలు సందర్భానికి తగినదిగా ఉండి సాధారణ పాఠకులకు అర్థమయ్యే పదం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
