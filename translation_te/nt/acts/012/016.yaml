translation:
  language: te
  text: అయితే పేతురు తలుపు తట్టుతూనే ఉన్నాడు[a]. వారు తలుపు తెరిచి[b], అతన్ని చూసి ఆశ్చర్యపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తట్టడం కొనసాగించాడు’ లేదా ‘పట్టుదలగా తట్టుతూనే ఉన్నాడు.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘తెరిచి, అతన్ని చూసి ఆశ్చర్యపోయారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμενεν
  choice: తడుతూనే ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న లేదా పదేపదే జరుగుతున్న చర్యను సూచిస్తుంది; కృదంతంతో కలిపి ఈ తెలుగు ప్రయోగం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: κρούων
  choice: తలుపు తడుతూ
  rationale: ఈ సందర్భంలో κρούω తలుపు తట్టడాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘తలుపు తడుట’ సహజమైన ప్రయోగం.
- source_word: ἀνοίξαντες
  choice: వారు తలుపు తెరిచి
  rationale: భూతకాల కృదంతాన్ని వరుసగా జరిగిన చర్యగా సహజంగా అనువదించాం. మూలంలో కర్మ స్పష్టంగా లేకపోయినా, తలుపు తట్టే సందర్భం వల్ల ‘తలుపు’ను చేర్చాం.
- source_word: εἶδαν αὐτὸν
  choice: అతన్ని చూసినప్పుడు
  rationale: కథన సందర్భంలో ὁράωకు సరళమైన అర్థాన్ని నిలిపి, తెలుగు వాక్య ప్రవాహం కోసం కాలార్థక నిర్మాణంలో ఉంచాం.
- source_word: ἐξέστησαν
  choice: ఎంతో ఆశ్చర్యపోయారు
  rationale: ఈ క్రియ బలమైన విస్మయాన్ని సూచిస్తుంది; ‘ఎంతో’ ఆ తీవ్రతను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మొదటి δέ ముందటి సందర్భంతో వ్యత్యాసాన్ని సూచిస్తుంది. రెండవ δέను తెలుగు వాక్య నిర్మాణంలో ప్రత్యేకంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: Πέτρος
  choice: పేతురు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన పేరురూపాన్ని ఉపయోగించాం.
