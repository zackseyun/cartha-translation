id: ACT.12.10
reference: Acts 12:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διελθόντες δὲ πρώτην φυλακὴν καὶ δευτέραν ἦλθαν ἐπὶ τὴν πύλην τὴν σιδηρᾶν τὴν φέρουσαν εἰς τὴν πόλιν, ἥτις αὐτομάτη ἠνοίγη αὐτοῖς, καὶ ἐξελθόντες προῆλθον ῥύμην μίαν, καὶ εὐθέως ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/010.yaml
  text: After they had passed the first guard and the second[a], they came to the iron gate leading into the city, which opened to them by itself; and after they went out, they went along one street[b], and immediately the angel departed from him.
translation:
  language: te
  text: వారు మొదటి కాపలా స్థావరాన్నీ, రెండవ కాపలా స్థావరాన్నీ దాటి, పట్టణంలోకి వెళ్లే ఇనుప గుమ్మం దగ్గరికి వచ్చారు. అది వారికి దానంతట అదే తెరుచుకుంది. వారు బయటికి వెళ్లి ఒక వీధి మేర ముందుకు సాగారు; వెంటనే ఆ దూత అతనిని విడిచి వెళ్లిపోయాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελθόντες
  choice: దాటి
  rationale: ముఖ్య క్రియకు ముందుగా పూర్తయిన కదలికను సహజమైన తెలుగు కథన క్రమంలో తెలియజేస్తుంది.
- source_word: φυλακὴν
  choice: కాపలా స్థావరం
  rationale: ఈ సందర్భంలో వరుసగా దాటిన భద్రతా స్థానాలను సూచిస్తుంది; కేవలం ‘కాపలా’ అనడం కంటే స్థలార్థాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: πύλην τὴν σιδηρᾶν
  choice: ఇనుప గుమ్మం
  rationale: గుమ్మం తయారైన పదార్థంపై గ్రీకు పాఠంలోని ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: τὴν φέρουσαν εἰς τὴν πόλιν
  choice: పట్టణంలోకి వెళ్లే
  rationale: ఆ గుమ్మం ఇచ్చే ప్రవేశ దిశను సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: αὐτομάτη
  choice: దానంతట అదే
  rationale: యాంత్రిక ‘ఆటోమేటిక్’ భావాన్ని రానివ్వకుండా, ఎవరూ తెరవకుండానే గుమ్మం తెరుచుకున్నదనే భావాన్ని అందిస్తుంది.
- source_word: ῥύμην μίαν
  choice: ఒక వీధి దూరం
  rationale: ఇక్కడ accusative of extent భావాన్ని ప్రతిబింబిస్తూ, వారు ఒక వీధి మేర ముందుకు వెళ్లారని స్పష్టం చేస్తుంది.
- source_word: εὐθέως ἀπέστη
  choice: వెంటనే ... వెళ్లిపోయాడు
  rationale: దూత అకస్మాత్తుగా పేతురు నుంచి వేరైన తక్షణ క్రమాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: గుమ్మం తెరుచుకున్న స్వభావం
  choice: వారి కోసం దానంతట అదే తెరుచుకుంది
  alternative: వారి కోసం తనంతట తానే తెరుచుకుంది
  rationale: అద్భుత సంఘటనను పాఠం చెప్పినంతవరకే ఉంచి, దాని విధానాన్ని అదనంగా వివరించదు.
- issue: φυλακή యొక్క సందర్భార్థం
  choice: కాపలా స్థావరం
  alternative: కాపలా / కావలి
  rationale: పేతురు వరుస భద్రతా అడ్డంకులను దాటుతున్న సందర్భానికి స్థావరార్థం సరిపోతుంది; వేరువేరు చెరసాలలు అన్న అపార్థాన్ని నివారిస్తుంది.
- issue: ῥύμην μίαν యొక్క వ్యాకరణ భావం
  choice: ఒక వీధి దూరం
  alternative: ఒక వీధిలో
  rationale: ఈ పదబంధం కదలిక జరిగిన దూరాన్ని సూచించే అవకాశం బలంగా ఉంది; స్థలాన్ని మాత్రమే సూచించినట్లు తేల్చకుండా ఆ భావాన్ని ప్రధాన పాఠంలో ప్రతిబింబిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ‘కాపలా స్థావరం’ భద్రతా స్థానాన్ని స్పష్టం చేస్తుంది; ‘దానంతట అదే’ అద్భుతాన్ని యాంత్రికంగా వినిపించకుండా తెలియజేస్తుంది.
