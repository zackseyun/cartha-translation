source:
  edition: SBLGNT
  text: παραχρῆμα δὲ ἐπάταξεν αὐτὸν ἄγγελος κυρίου ἀνθ’ ὧν οὐκ ἔδωκεν ⸀τὴν δόξαν τῷ θεῷ, καὶ γενόμενος σκωληκόβρωτος ἐξέψυξεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/023.yaml
  text: Immediately an angel of the Lord struck him[a], because he did not give the glory to God, and becoming worm-eaten[c][b], he died.
translation:
  language: te
  text: వెంటనే ప్రభువు దూత అతన్ని కొట్టాడు, ఎందుకంటే అతడు దేవునికి మహిమ ఇవ్వలేదు. పురుగులచేత తినబడుతూ అతడు మరణించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు ప్రాణం విడిచాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: వెంటనే
  rationale: తీర్పు ఆలస్యం లేకుండా సంభవించిందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπάταξεν
  choice: కొట్టాడు
  rationale: మూల క్రియలోని ‘కొట్టు/దెబ్బకొట్టు’ అనే భావాన్ని నిలుపుతుంది; మరణ ఫలితాన్ని ఈ క్రియలోనే చేర్చకుండా, తరువాతి ἐξέψυξεν‌కు వదిలివేస్తుంది.
- source_word: ἄγγελος κυρίου
  choice: ప్రభువు దూత
  rationale: అనిర్దిష్ట గ్రీకు నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘ప్రభువు’ అనే బిరుదును నిలుపుతుంది.
- source_word: ἀνθ’ ὧν
  choice: దీనికి కారణం
  rationale: ఈ ప్రయోగంలోని కారణార్థాన్ని స్పష్టంగా తెలియజేస్తూ, తీర్పుకు చెప్పబడిన కారణాన్ని ముందరి చర్యతో కలుపుతుంది.
- source_word: οὐκ ἔδωκεν τὴν δόξαν τῷ θεῷ
  choice: దేవునికి మహిమ ఇవ్వలేదు
  rationale: దేవునికి చెందవలసిన ఘనతను ఆయనకు ఆపాదించలేదనే మూల భావాన్ని సహజంగా అందిస్తుంది; గ్రీకులోని article‌ను తెలుగులో కృత్రిమంగా ప్రతిబింబించదు.
- source_word: γενόμενος σκωληκόβρωτος
  choice: అతనికి పురుగులు పట్టి
  rationale: పురుగులచేత తినబడే స్థితికి వచ్చాడనే తీవ్రమైన చిత్రణను తెలుగులో అర్థమయ్యే విధంగా వ్యక్తం చేస్తుంది; ఖచ్చితమైన వైద్య వివరణను జోడించదు.
- source_word: ἐξέψυξεν
  choice: మరణించాడు
  rationale: ఈ క్రియ యొక్క సందర్భోచిత అర్థాన్ని గౌరవప్రదమైన, సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: వివరించబడిన తీర్పు స్వభావం
  choice: హేరోదు మరణాన్ని ప్రభువు దూత ద్వారా అమలైన దైవ తీర్పుగా వచనం చెప్పినట్లే అనువదించడం
  alternative: ఇది కేవలం సహజ మరణాన్ని మతపరమైన భాషలో వర్ణించిందని భావించడం, లేదా దూత కొట్టిన క్షణంలోనే మరణం సంభవించిందని ఖచ్చితంగా చెప్పడం
  rationale: మూలపాఠం కొట్టినవాడు ‘ప్రభువు దూత’ అని, కారణం దేవునికి మహిమ ఇవ్వకపోవడమని స్పష్టంగా చెబుతుంది. అయితే ‘పురుగులు పట్టి, మరణించాడు’ అనే క్రమం ఖచ్చితమైన వైద్య ప్రక్రియను గానీ, దెబ్బకూ మరణానికీ మధ్య వ్యవధిని గానీ నిర్దేశించదు; అనువాదం కూడా వాటిని నిర్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. పొడవైన గ్రీకు వాక్యాన్ని స్పష్టత కోసం మూడు తెలుగు వాక్యాలుగా విభజించాం. మూలంలోని సంఘటనల క్రమాన్ని నిలిపి, వాటి మధ్య ఖచ్చితమైన కాలవ్యవధిని ఊహించలేదు.
