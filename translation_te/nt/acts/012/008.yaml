id: ACT.12.8
reference: Acts 12:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ ὁ ἄγγελος πρὸς αὐτόν· ⸀Ζῶσαι καὶ ὑπόδησαι τὰ σανδάλιά σου· ἐποίησεν δὲ οὕτως. καὶ λέγει αὐτῷ· Περιβαλοῦ τὸ ἱμάτιόν σου καὶ ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/008.yaml
  text: And the angel said to him[a], “Tie on your belt and put on your sandals.” And he did so. And he says to him[c][b], “Put on your cloak and follow me.”
translation:
  language: te
  text: అప్పుడు దేవదూత అతనితో, “నీ నడికట్టు బిగించుకో[a], నీ చెప్పులు వేసుకో” అన్నాడు. అతడు అలాగే చేశాడు. తరువాత దేవదూత అతనితో, “నీ పైవస్త్రం కప్పుకో[b], నా వెంట రా” అంటాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నడికట్టు కట్టుకో.” గ్రీకు ఆజ్ఞ సిద్ధంగా ఉండేందుకు నడికట్టును బిగించుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నీ పైవస్త్రాన్ని నీ చుట్టూ వేసుకో.”
    reason: lexical_alternative
  - marker: c
    text: గ్రీకులో “అంటాడు” అని వర్తమాన కాలంలో ఉంది; ఇది కథనాన్ని సజీవంగా చెప్పడానికి వాడే చారిత్రక వర్తమానం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: దేవదూత
  rationale: చెరసాలలో ప్రత్యక్షమైన పరలోక దూతను సందర్భం సూచిస్తోంది; అందువల్ల సాధారణ ‘దూత’ కంటే ‘దేవదూత’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: Ζῶσαι
  choice: నీ నడికట్టు బిగించుకొని
  rationale: ζώννυμι యొక్క మధ్యమ ఆజ్ఞారూపం నడికట్టును కట్టుకొని సిద్ధపడే చర్యను సూచిస్తుంది. ఆధునిక తెలుగులో ‘నడికట్టు బిగించుకొని’ ఆ స్పష్టమైన చర్యను తెలియజేస్తుంది.
- source_word: ὑπόδησαι τὰ σανδάλιά σου
  choice: నీ చెప్పులు వేసుకో
  rationale: సందర్భంలో చెప్పులను పాదాలకు వేసుకోవడమే ఉద్దేశం. ‘చెప్పులు వేసుకో’ సహజమైన ఆధునిక తెలుగు.
- source_word: ἐποίησεν δὲ οὕτως
  choice: అతడు అలాగే చేశాడు
  rationale: οὕτως ముందున్న ఆజ్ఞలకు పేతురు విధేయత చూపినట్లు సంక్షిప్తంగా సూచిస్తుంది.
- source_word: λέγει
  choice: అంటాడు
  rationale: గ్రీకు పాఠం భూతకాల కథనంలో చారిత్రక వర్తమానాన్ని ఉపయోగిస్తుంది; ‘అంటాడు’ ఆ కథన సజీవతను నిలుపుతుంది.
- source_word: Περιβαλοῦ τὸ ἱμάτιόν σου
  choice: నీ పైవస్త్రం కప్పుకొని
  rationale: ἱμάτιον బయటి వస్త్రాన్ని సూచిస్తుంది; περιβάλλω దానిని తన చుట్టూ వేసుకోవడం లేదా కప్పుకోవడం అనే భావాన్ని కలిగిస్తుంది. ‘పైవస్త్రం కప్పుకొని’ వస్త్ర రకాన్నీ చర్యనూ సహజంగా అందిస్తుంది.
- source_word: ἀκολούθει μοι
  choice: నన్ను వెంబడించు
  rationale: ἀκολουθέω యొక్క ప్రాథమిక అర్థం ‘వెంబడించు’; ఇక్కడ అది అక్షరార్థమైన కదలికకు సంబంధించిన ఆజ్ఞ అయినప్పటికీ మూలపద సంబంధాన్ని నిలుపుతుంది.
