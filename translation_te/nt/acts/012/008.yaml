translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. గ్రీకులోని మొదటి భూతకాల క్రియకూ తరువాతి చారిత్రక వర్తమానానికీ ఉన్న మార్పును ప్రధాన పాఠంలో నిలిపి, పాదటిప్పణిలో వివరించాం. ‘పైవస్త్రం’ ἱμάτιον యొక్క బయటి వస్త్ర భావాన్ని కాపాడుతుంది.
