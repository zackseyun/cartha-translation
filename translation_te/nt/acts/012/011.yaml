id: ACT.12.11
reference: Acts 12:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὁ Πέτρος ⸂ἐν ἑαυτῷ γενόμενος⸃ εἶπεν· Νῦν οἶδα ἀληθῶς ὅτι ἐξαπέστειλεν ⸀ὁ κύριος τὸν ἄγγελον αὐτοῦ καὶ ἐξείλατό με ἐκ χειρὸς Ἡρῴδου καὶ πάσης τῆς προσδοκίας τοῦ λαοῦ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/011.yaml
  text: And Peter[a], coming to himself, said[c][b], “Now I truly know that the Lord sent his angel and rescued me from Herod’s hand and from all the expectation of the people of the Jews.”
translation:
  language: te
  text: పేతురు తేరుకొని[a], “ప్రభువు తన దేవదూతను పంపి, హేరోదు చేతిలోనుండి[b], యూదు ప్రజలు ఎదురుచూసినదంతటి నుండి[c] నన్ను రక్షించాడని ఇప్పుడు నాకు నిజంగా తెలిసింది” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “స్పృహలోకి వచ్చి” లేదా “తనకు తాను తేరుకొని.”
    reason: lexical_alternative
  - marker: b
    text: “హేరోదు చేతిలోనుండి” అంటే హేరోదు అధికారం లేదా అదుపు నుండి అని అర్థం.
    reason: cultural_note
  - marker: c
    text: మూలభాషలో అక్షరార్థంగా, “యూదు ప్రజల నిరీక్షణ అంతటినుండి”; అంటే వారు ఎదురుచూసినదంతటి నుండి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑαυτῷ γενόμενος
  choice: తేరుకొని
  rationale: దర్శనం వంటి అనుభవం తర్వాత పేతురు పూర్తి స్పృహలోకి వచ్చిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; గ్రీకు జాతీయాన్ని పదేపదే అనువదించకుండా దాని అర్థాన్ని నిలుపుతుంది.
- source_word: ἀληθῶς
  choice: నిజంగా
  rationale: పేతురుకు ఇప్పుడు కలిగిన నిశ్చయాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐξαπέστειλεν
  choice: పంపి
  rationale: ఈ సందర్భంలో సాధారణమైన ‘పంపాడు’ అనే అర్థమే ఉద్దేశితం; సంయుక్త క్రియలోని ఉపసర్గను కృత్రిమంగా విస్తరించాల్సిన అవసరం లేదు.
- source_word: κύριος
  choice: ప్రభువు
  rationale: ఎవరిని సూచిస్తుందో గ్రీకు వాక్యం మరింత నిర్దిష్టంగా చెప్పదు; ‘ప్రభువు’ ఆ అనిర్దిష్టతను నిలుపుతుంది.
- source_word: ἄγγελον
  choice: దూతను
  rationale: కథా సందర్భంలో ఇది దేవదూతను సూచిస్తుంది. తెలుగులో ‘తన దూత’ అనే రూపం సహజంగా ఉండి పరలోక దూత భావాన్ని సందర్భమే స్పష్టం చేస్తుంది.
- source_word: ἐξείλατό με
  choice: నన్ను రక్షించాడని
  rationale: ప్రమాదకరమైన అధికార పరిధి నుండి విడిపించిన కార్యాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐκ χειρὸς Ἡρῴδου
  choice: హేరోదు చేతిలోనుండి
  rationale: అధికారం లేదా అదుపు అనే రూపకార్థాన్ని కలిగిన మూలభాషా జాతీయాన్ని తెలుగులోనూ అర్థమయ్యే విధంగా నిలుపుతుంది.
- source_word: πάσης τῆς προσδοκίας
  choice: నాకు జరగాలని ఎదురుచూసినదంతటినుండి
  rationale: ‘నిరీక్షణ’ అనే అమూర్త నామవాచకాన్ని కృత్రిమంగా ఉంచకుండా, ప్రజలు పేతురుకు ఏదో జరగాలని ఆశించిన భావాన్ని సహజంగా వ్యక్తపరుస్తుంది. ‘నాకు’ అనేది సందర్భం నుండి స్పష్టీకరించబడింది.
- source_word: τοῦ λαοῦ τῶν Ἰουδαίων
  choice: యూదా ప్రజలు
  rationale: గ్రీకు షష్ఠీ నిర్మాణం సూచించే సమూహాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: κύριος ఎవరిని సూచిస్తుంది?
  choice: ప్రభువు
  alternative: దేవుడు; పునరుత్థానుడైన యేసు
  rationale: ఈ వాక్యంలో గ్రీకు పాఠం κύριος అని మాత్రమే చెబుతుంది. ‘దేవుడు’ లేదా ‘యేసు’ అని నిర్దిష్టీకరించకుండా ‘ప్రభువు’ అని అనువదించడం మూలంలోని భావసంభావ్యతను, దైవ కార్యనిర్వహణకు సంబంధించిన ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే కథన గాంభీర్యాన్ని నిలుపుతూ రూపొందించబడింది. ‘తేరుకొని’ మరియు ‘ఎదురుచూసినదంతటినుండి’ సహజ తెలుగు ప్రయోగాలు; మూలంలోని రూపకం, అనిశ్చితి అవసరమైన చోట పాదటిప్పణుల్లో భద్రపరచబడ్డాయి.
