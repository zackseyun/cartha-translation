translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే కథనానికి తగిన గంభీరతతో అనువదించబడింది. మూలంలోని litotes‌ను అసహజ అక్షరానువాదంగా కాకుండా ‘పెద్ద కలకలమే’ అనే ఉద్ఘాటక నిర్మాణంతో ప్రతిఫలింపజేశాం.
