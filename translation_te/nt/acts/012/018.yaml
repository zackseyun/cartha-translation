id: ACT.12.18
reference: Acts 12:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ἦν τάραχος οὐκ ὀλίγος ἐν τοῖς στρατιώταις, τί ἄρα ὁ Πέτρος ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/018.yaml
  text: When day came[a], there was no small disturbance among the soldiers over what had become of Peter.
translation:
  language: te
  text: తెల్లవారినప్పుడు, పేతురుకు ఏమైందో అని సైనికుల మధ్య పెద్ద కలకలమే చెలరేగింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: తెల్లవారినప్పుడు
  rationale: ఈ genitive absolute కాలసూచకంగా ఉంది; δέ కథనంలోని మార్పును సూచిస్తుంది. ‘తెల్లవారినప్పుడు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం, ప్రత్యేకంగా ‘ఇప్పుడు’ వంటి మూలంలో లేని పదాన్ని చేర్చదు.
- source_word: τάραχος οὐκ ὀλίγος
  choice: పెద్ద కలకలమే చెలరేగింది
  rationale: οὐκ ὀλίγος అనే litotes‌ను తెలుగులో అక్షరార్థంగా ‘కొద్దిపాటి కాని’ అనడం అసహజం. ‘పెద్ద ... మే’ గణనీయమైన తీవ్రతను, మూలంలోని ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: ἐν τοῖς στρατιώταις
  choice: సైనికుల మధ్య
  rationale: στρατιώταις‌కు నేరమైన అర్థం ‘సైనికులు’; సందర్భం వల్ల ‘కాపలాదారులు’ అనవచ్చుగానీ, మూలపదంలోని విస్తృత అర్థాన్ని నిలుపుకోవడానికి ‘సైనికులు’ ఎంచుకున్నాం. ἐν ఇక్కడ ఆ కలకలం ఏర్పడిన సమూహాన్ని సూచిస్తుంది.
- source_word: τί ἄρα
  choice: ఏమైందో అని
  rationale: ఇది ఆశ్చర్యం లేదా అయోమయం కలిసిన పరోక్ష ప్రశ్నను పరిచయం చేస్తుంది. తెలుగులో ‘ఏమైందో అని’ ఆ సందిగ్ధ విచారణను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ Πέτρος
  choice: పేతురు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ἐγένετο
  choice: ఏమైంది
  rationale: వ్యక్తిని ఉద్దేశించిన τί ... ἐγένετο అనే ప్రయోగం ‘అతనికి ఏమైంది/అతడు ఏమయ్యాడు’ అనే భావం ఇస్తుంది. సందర్భంలో పేతురు కనిపించకపోవడంపై సైనికుల అయోమయాన్ని ‘పేతురుకు ఏమైంది’ సహజంగా తెలియజేస్తుంది.
