id: ACT.12.9
reference: Acts 12:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν ⸀ἠκολούθει, καὶ οὐκ ᾔδει ὅτι ἀληθές ἐστιν τὸ γινόμενον διὰ τοῦ ἀγγέλου, ἐδόκει δὲ ὅραμα βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/009.yaml
  text: And he went out and followed[a], and he did not know that what was happening through the angel was real, but thought he was seeing a vision.
translation:
  language: te
  text: అతడు బయటికి వెళ్లి ఆ దూతను వెంబడించాడు. ఆ దూత ద్వారా[a] జరుగుతున్నది నిజమైనదని అతనికి తెలియలేదు; అయితే, తాను ఒక దర్శనం చూస్తున్నానని అనుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ దూత చేత.” గ్రీకు పదబంధం కార్యకర్తను కూడా సూచించగలదు; “ద్వారా” అనే అనువాదం మధ్యవర్తిత్వ భావాన్ని నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: బయటికి వెళ్లి
  rationale: ముఖ్య క్రియకు ముందు జరిగిన కదలికను తెలుగులో సహజమైన పూర్వకాలిక క్రియారూపంతో వ్యక్తపరుస్తుంది.
- source_word: ἠκολούθει
  choice: ఆ దూతను వెంబడించాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న అనుసరణను సందర్భంలో సహజంగా తెలియజేస్తుంది; కర్మను సందర్భం నుంచి స్పష్టంగా పేర్కొనడం తెలుగు వాక్యానికి సహజత్వం ఇస్తుంది.
- source_word: οὐκ ᾔδει
  choice: అతనికి తెలియలేదు
  rationale: జ్ఞానం లేదా అవగాహన లేకపోవడాన్ని నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀληθές
  choice: నిజమైనది
  rationale: దర్శనంగా అనిపించిన అనుభవానికి విరుద్ధంగా, జరుగుతున్న సంఘటన వాస్తవమైనదనే భావాన్ని తెలియజేస్తుంది.
- source_word: τὸ γινόμενον
  choice: జరుగుతున్నది
  rationale: సాగుతున్న సంఘటనను సూచించే గ్రీకు వర్తమాన కృదంత భావాన్ని నిలుపుతుంది.
- source_word: διὰ τοῦ ἀγγέλου
  choice: ఆ దూత ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సూచించే మధ్యవర్తిత్వం లేదా కార్యకర్త భావాన్ని అతిశయింపకుండా నిలుపుతుంది.
- source_word: ἐδόκει
  choice: అనుకున్నాడు
  rationale: పేతురు తన అనుభవాన్ని ఎలా గ్రహించాడో తెలిపే సందర్భానుకూలమైన ఆధునిక తెలుగు పదం.
- source_word: ὅραμα
  choice: ఒక దర్శనం
  rationale: ప్రకటనాత్మక లేదా అసాధారణ దృశ్యానుభవానికి నూతన నిబంధనలో సాధారణంగా సరిపోయే పదం.
- source_word: βλέπειν
  choice: చూస్తున్నానని
  rationale: తాను ఆ సమయంలో చూస్తున్నానని పేతురు భావించిన కొనసాగుతున్న అనుభూతిని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దూత కార్యం యొక్క స్వభావం
  choice: ఆ దూత ద్వారా
  alternative: ఆ దూత చేత
  rationale: గ్రీకు διά + షష్ఠీ విభక్తిలోని మధ్యవర్తిత్వ భావాన్ని కాపాడుతూ, దూత స్వతంత్ర శక్తి గురించి పాఠ్యాన్ని మించిన వాదన చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మొదటి వాక్యంలో సందర్భస్పష్టత కోసం ‘ఆ దూతను’ చేర్చబడింది. దర్శనం–వాస్తవం మధ్యనున్న వ్యత్యాసం స్పష్టంగా ఉంచబడింది; గ్రీకు పాఠంలోని భావసందిగ్ధతను పాదసూచికలో నిలుపబడింది.
