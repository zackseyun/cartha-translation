  to: అతడు బయటికి వెళ్లి ఆ దూతను వెంబడించాడు. ఆ దూత ద్వారా[a] జరుగుతున్నది నిజమైనదని అతనికి తెలియలేదు; అయితే, తాను ఒక దర్శనం చూస్తున్నానని అనుకున్నాడు.
