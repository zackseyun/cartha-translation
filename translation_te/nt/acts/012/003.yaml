source:
  edition: SBLGNT
  text: ⸂ἰδὼν δὲ⸃ ὅτι ἀρεστόν ἐστιν τοῖς Ἰουδαίοις προσέθετο συλλαβεῖν καὶ Πέτρον (ἦσαν ⸀δὲ ἡμέραι τῶν ἀζύμων),
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/003.yaml
  text: And when he saw that it was pleasing to the Jews[a], he proceeded to arrest Peter also[b]. (Now these were the days of Unleavened Bread.)
translation:
  language: te
  text: అది యూదులకు[a] నచ్చిందని అతడు గమనించి, పేతురును కూడా అరెస్టు చేయించాడు. (అప్పుడు పులియని రొట్టెల పండుగ రోజులు జరుగుతున్నాయి.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యూదయవాసులకు”; సందర్భాన్ని మరింత సంకుచితంగా తీసుకుంటే “యూదు నాయకులకు.” కొన్ని సందర్భాల్లో గ్రీకు పదానికి ఈ అర్థాలు రావచ్చు; అయితే ఇక్కడ మూలపాఠం కేవలం “యూదులకు” అని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: గమనించి
  rationale: ఆ తదుపరి చర్యకు ముందు అతడు ప్రజల స్పందనను గ్రహించిన క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀρεστόν ἐστιν
  choice: నచ్చిందని
  rationale: ‘ఇష్టకరంగా/ఆమోదయోగ్యంగా ఉండడం’ అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘అది’ మునుపటి చర్యను సూచిస్తుంది.
- source_word: τοῖς Ἰουδαίοις
  choice: యూదులకు
  rationale: గ్రీకు పదంలోని ప్రత్యక్షమైన జాతి-మతపరమైన సూచనను నిలుపుతుంది; పాఠ్యంలో లేని ‘నాయకులు’ అనే సంకుచిత అర్థాన్ని ప్రధాన వాక్యంలో చేర్చదు.
- source_word: προσέθετο
  choice: పూనుకున్నాడు
  rationale: క్రియారూపంతో కలిసి ‘మరొక పని చేయడానికి ముందుకు సాగాడు’ అనే గ్రీకు నుడికార భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: συλλαβεῖν
  choice: అరెస్టు చేయడానికి
  rationale: ఈ అధికారిక నిర్బంధ సందర్భంలో ‘పట్టుకోవడం’ కంటే ‘అరెస్టు చేయడం’ స్పష్టమైన ఆధునిక సమానార్థకం.
- source_word: καὶ Πέτρον
  choice: పేతురును కూడా
  rationale: అంతకుముందు యాకోబుపై చేసిన చర్యకు అదనంగా పేతురు మరో లక్ష్యమయ్యాడనే καί యొక్క చేర్పు భావాన్ని నిలుపుతుంది.
- source_word: ἦσαν δὲ ἡμέραι τῶν ἀζύμων
  choice: అప్పుడు పులియని రొట్టెల పండుగ రోజులు
  rationale: కాల నేపథ్యాన్ని తెలుపుతూ, గ్రీకులోని ప్రత్యేక పండుగ పేరును ‘పస్కా’గా మార్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: అపొస్తలుల కార్యములలో Ἰουδαίοις అనువాదం
  choice: యూదులకు
  alternative: యూదయవాసులకు; యూదు నాయకులకు
  rationale: ఈ సందర్భంలో వ్యతిరేకించిన వర్గం మరింత పరిమితమైనదై ఉండవచ్చుగానీ, మూలపాఠం భౌగోళికంగా గానీ నాయకత్వానికి గానీ సూచనను స్పష్టంగా పరిమితం చేయదు. అందువల్ల ప్రధాన పాఠ్యంలో విస్తృత పదమే ఉంచబడింది.
- issue: τῶν ἀζύμων అనే పండుగ పదబంధం
  choice: పులియని రొట్టెల పండుగ
  alternative: పస్కా పండుగ
  rationale: గ్రీకు పాఠం పస్కాకు సంబంధించినదైనా దానితో భేదమున్న ‘పులియని రొట్టెల రోజులు’ అని ప్రత్యేకంగా పేర్కొంటుంది; ఆ భేదాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలో కర్త పేరు పునరుక్తం కాకపోవడంతో ‘అతడు’ అని ఉంచి, ముందు వచనంతో అనుసంధానం నిలుపబడింది. కుండలీకరణలోని కాలసూచక వ్యాఖ్యను అలాగే ప్రత్యేకంగా ఉంచాం.
