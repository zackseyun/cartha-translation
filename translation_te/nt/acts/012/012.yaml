  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన కథనశైలి. గ్రీకు వాక్యాన్ని తెలుగులో సహజత కోసం రెండు వాక్యాలుగా విభజించాం. అవసరంలేని వివరణాత్మక పదాలు లేదా సంప్రదాయపరమైన భావాలను చేర్చలేదు.
