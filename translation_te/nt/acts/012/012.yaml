source:
  edition: SBLGNT
  text: Συνιδών τε ἦλθεν ἐπὶ τὴν οἰκίαν ⸀τῆς Μαρίας τῆς μητρὸς Ἰωάννου τοῦ ἐπικαλουμένου Μάρκου, οὗ ἦσαν ἱκανοὶ συνηθροισμένοι καὶ προσευχόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/012.yaml
  text: And when he realized this[a], he went to the house of Mary, the mother of John who was called Mark, where many had gathered together and were praying.
translation:
  language: te
  text: పేతురు ఇది గ్రహించినప్పుడు, మార్కు అని పిలువబడే యోహాను తల్లి అయిన మరియ ఇంటికి వెళ్లాడు. అక్కడ చాలామంది సమకూడి ప్రార్థన చేస్తున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνιδών
  choice: అది గ్రహించిన పేతురు
  rationale: సందర్భంలో దేవదూత వెళ్లిపోయిన తరువాత తనకు జరిగినదాన్ని పేతురు పూర్తిగా గ్రహించడాన్ని ఈ భూతకాల క్రియావిశేషణ రూపం సూచిస్తుంది. తెలుగులో కర్తను స్పష్టంగా చెప్పడం సహజం; ‘అది’ మునుపటి సందర్భాన్ని సూచిస్తుంది.
- source_word: τε
  choice: వాక్యప్రవాహంలో ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది స్వల్ప అనుసంధాన అవ్యయం. తెలుగు కథన ప్రవాహంలో కామాతో అనుసంధానం సహజంగా ఉండి, ప్రత్యేకంగా ‘మరియు’ చేర్చకపోయినా భావం నిలుస్తుంది.
- source_word: ἦλθεν ἐπὶ τὴν οἰκίαν
  choice: ఇంటికి వెళ్లాడు
  rationale: ἐπί + ద్వితీయా విభక్తి ఒక స్థలంవైపు కదలికను సూచిస్తుంది. కథన దృష్టికోణానికి ‘వెళ్లాడు’ సహజమైన తెలుగు రూపం.
- source_word: οἰκίαν
  choice: ఇంటి
  rationale: ఇక్కడ ప్రజలు కూడిన భౌతిక నివాసస్థలమే ప్రధానంగా ఉద్దేశించబడింది; ‘ఇల్లు’ సంబంధార్థక రూపంలో ‘ఇంటి’ అవుతుంది.
- source_word: τῆς Μαρίας
  choice: మరియ
  rationale: Μαρία అనే వ్యక్తినామానికి తెలుగు బైబిలు వాడుకలో సుపరిచితమైన లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: τῆς μητρὸς Ἰωάννου
  choice: యోహాను తల్లి
  rationale: మరియను గుర్తించేందుకు మూలంలోని సంబంధాన్ని నేరుగా, సహజమైన తెలుగు పదక్రమంలో ఉంచాం.
- source_word: τοῦ ἐπικαλουμένου Μάρκου
  choice: మార్కు అని పిలువబడే
  rationale: ἐπικαλουμένου యోహానుకు వాడబడిన మరో పేరును తెలియజేస్తుంది. మూలంలో ‘కూడా’ అనే అవ్యయం తప్పనిసరిగా లేనందున దాన్ని చేర్చలేదు.
- source_word: οὗ
  choice: అక్కడ
  rationale: సంబంధ అవ్యయం మరియ ఇంటిని స్థలంగా తిరిగి సూచిస్తుంది; వాక్యాన్ని రెండుగా విభజించిన తెలుగులో ‘అక్కడ’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: ἱκανοὶ
  choice: చాలామంది
  rationale: బహువచనంలో ἱκανός గణనీయమైన సంఖ్యను సూచిస్తుంది; ‘చాలామంది’ సాధారణ ఆధునిక తెలుగులో సహజం.
- source_word: συνηθροισμένοι
  choice: కూడి
  rationale: ప్రజలు ముందే సమకూడి ఆ స్థితిలో ఉన్నారనే ఫలితస్థితిని సందర్భం తెలియజేస్తుంది. ‘కూడి ... ఉన్నారు’ ఆ నిర్మాణాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ προσευχόμενοι
  choice: ప్రార్థిస్తూ ఉన్నారు
  rationale: వారు కూడి ఉన్న సమయంలో ప్రార్థన కొనసాగుతున్న క్రియ అని వర్తమాన క్రియావిశేషణం సూచిస్తుంది; ‘ప్రార్థిస్తూ ఉన్నారు’ ఆ కొనసాగింపును స్పష్టం చేస్తుంది.
