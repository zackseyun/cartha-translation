id: ACT.12.20
reference: Acts 12:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἦν ⸀δὲ θυμομαχῶν Τυρίοις καὶ Σιδωνίοις· ὁμοθυμαδὸν δὲ παρῆσαν πρὸς αὐτόν, καὶ πείσαντες Βλάστον τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως ᾐτοῦντο εἰρήνην διὰ τὸ τρέφεσθαι αὐτῶν τὴν χώραν ἀπὸ τῆς βασιλικῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/020.yaml
  text: He was very angry with the Tyrians and Sidonians[a]. But they came to him with one accord, and after persuading Blastus, the king’s chamberlain, they were asking for peace[d][c][b], because their country was fed from the king’s domain.
translation:
  language: te
  text: అతడు తూరు, సీదోను ప్రజల మీద తీవ్రమైన కోపంతో ఉన్నాడు[a]. అయితే వారంతా ఏకమనస్సుతో అతని దగ్గరికి వచ్చి, రాజు శయనగది అధికారి అయిన బ్లాస్తును[b] ఒప్పించిన తర్వాత, వారి ప్రాంతానికి రాజ్య భూభాగం నుండి ఆహార సరఫరా అందుతుండేది కాబట్టి శాంతి కోసం వేడుకుంటూ ఉన్నారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తూరు, సీదోను ప్రజల పట్ల తీవ్ర శత్రుత్వంతో ఉన్నాడు.” గ్రీకు పదం తీవ్రమైన కోపం లేదా శత్రుత్వాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “రాజు శయనగది మీద నియమించబడినవాడు.” ఇతడు రాజు వ్యక్తిగత గదుల్లోకి వెళ్లగల రాజసభ అధికారి అయి ఉండవచ్చు.
    reason: cultural_note
  - marker: c
    text: '“రాజ్య భూభాగం” అంటే రాజుకు చెందిన దేశం, ప్రాంతం లేదా రాజాధీన భూభాగం. భావం: వారి ప్రాంతం తన ఆహార సరఫరా కోసం ఆ భూభాగంపై ఆధారపడి ఉండేది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμομαχῶν
  choice: తీవ్రమైన కోపంతో ఉన్నాడు
  rationale: ఈ పదం తీవ్రమైన కోపాన్ని లేదా క్రియాశీల శత్రుత్వాన్ని సూచిస్తుంది. తెలుగు వాక్యం సహజంగా ఉండేలా, దాని తీవ్రతను నిలుపుతూ ఈ రూపం ఎంచుకోబడింది.
- source_word: Τυρίοις καὶ Σιδωνίοις
  choice: తూరు, సీదోను ప్రజల మీద
  rationale: ఇవి తూరు, సీదోను పట్టణాల నివాసులను సూచించే జాతివాచక రూపాలు; ఆధునిక తెలుగు పాఠకులకు ప్రదేశనామాలతో ‘ప్రజలు’ అనడం స్పష్టంగా ఉంటుంది.
- source_word: ὁμοθυμαδόν
  choice: ఏకమనస్సుతో
  rationale: కేవలం కలిసి రావడం కాకుండా, ఒకే ఉద్దేశంతో ఐక్యంగా వ్యవహరించారనే భావాన్ని నిలుపుతుంది.
- source_word: παρῆσαν πρὸς αὐτόν
  choice: అతని దగ్గరికి వచ్చారు
  rationale: అతని సమక్షానికి వచ్చారనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πείσαντες
  choice: ఒప్పించిన తర్వాత
  rationale: అసలు పాఠంలోని భూతకాల కృదంతం ప్రధాన చర్యకు ముందుగా జరిగిన చర్యను సూచిస్తుంది; ‘తర్వాత’ ఆ క్రమాన్ని స్పష్టం చేస్తుంది.
- source_word: Βλάστον
  choice: బ్లాస్తు
  rationale: వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించింది.
- source_word: τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως
  choice: రాజు శయనగది అధికారి
  rationale: రాజు వ్యక్తిగత గదులకు ప్రవేశం కలిగిన రాజసభ అధికారిని సూచించే మూలభాషా రూపకాన్ని సాధ్యమైనంత స్పష్టంగా నిలుపుతుంది.
- source_word: ᾐτοῦντο εἰρήνην
  choice: శాంతి కోసం వేడుకుంటూ ఉన్నారు
  rationale: దౌత్యపరమైన శాంతిని కోరుతూ కొనసాగించిన విజ్ఞప్తిని గ్రీకు అసంపూర్ణ భూతకాల క్రియ సూచిస్తుంది.
- source_word: διὰ τὸ τρέφεσθαι
  choice: ఆహారం సరఫరా అవుతుండేది కాబట్టి
  rationale: διάతో కూడిన కర్తరివిరుద్ధ క్రియారూపం కారణాన్ని, ఆహారంపై ఆధారపడటాన్ని సూచిస్తుంది.
- source_word: αὐτῶν τὴν χώραν
  choice: వారి ప్రాంతానికి
  rationale: χώρα ఇక్కడ ప్రాంతం, భూభాగం లేదా దేశం అనే భావం కలిగి ఉంది; తూరు-సీదోను పరిసర భూభాగానికి ‘ప్రాంతం’ సహజంగా సరిపోతుంది.
- source_word: ἀπὸ τῆς βασιλικῆς
  choice: రాజభూభాగం నుంచి
  rationale: స్త్రీలింగ విశేషణం ఇక్కడ నామవాచకార్థంలో వాడబడి రాజుకు చెందిన ప్రాంతం లేదా రాజాధీన భూభాగాన్ని సూచిస్తుంది.
