translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. దౌత్య సందర్భాన్ని తెలిపేందుకు ‘శాంతి కోసం వేడుకుంటూ ఉన్నారు’ అని, ఆర్థిక ఆధారాన్ని సహజంగా తెలిపేందుకు ‘ఆహారం సరఫరా అవుతుండేది’ అని అనువదించాం. మూలంలోని δέను సందర్భానుసార విరుద్ధ సంబంధంగా ‘అయితే’తో తెలిపాం; లేని కాలసూచక పదాన్ని చేర్చలేదు.
