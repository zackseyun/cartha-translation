id: ACT.12.17
reference: Acts 12:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κατασείσας δὲ αὐτοῖς τῇ χειρὶ σιγᾶν διηγήσατο αὐτοῖς πῶς ὁ κύριος αὐτὸν ἐξήγαγεν ἐκ τῆς φυλακῆς, εἶπέν ⸀τε· Ἀπαγγείλατε Ἰακώβῳ καὶ τοῖς ἀδελφοῖς ταῦτα. καὶ ἐξελθὼν ἐπορεύθη εἰς ἕτερον τόπον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/017.yaml
  text: But motioning to them with his hand to be silent[a], he explained to them how the Lord had brought him out of the prison. And he said, “Report these things to James and to the brothers.” Then he departed and went to another place.
translation:
  language: te
  text: అయితే అతడు నిశ్శబ్దంగా ఉండమని వారికి చేతితో సైగ చేసి, ప్రభువు తనను చెరసాలలోనుండి ఎలా బయటికి తీసుకువచ్చాడో వారికి వివరించాడు. తరువాత, “ఈ సంగతులు యాకోబుకూ సహోదరులకూ తెలియజేయండి[a]” అని చెప్పాడు. ఆపై అతడు అక్కడి నుండి బయలుదేరి వేరొక చోటికి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సహోదర సహోదరీలకు తెలియజేయండి.” గ్రీకు మూలపాఠంలో “సహోదరులకు” అని ఉంది; సందర్భాన్ని బట్టి అది విశ్వాసుల విస్తృత సమాజాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατασείσας ... τῇ χειρὶ σιγᾶν
  choice: నిశ్శబ్దంగా ఉండమని ... చేతితో సైగ చేసి
  rationale: నిశ్శబ్దం కోరుతూ చేసిన చేతి కదలికను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సైగ స్వరూపాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: διηγήσατο
  choice: వివరించాడు
  rationale: జరిగినదాన్ని క్రమంగా, వివరంగా తెలియజేయడం అనే భావాన్ని సందర్భానుకూలంగా అందిస్తుంది.
- source_word: πῶς
  choice: ఎలా
  rationale: పేతురు వివరించిన విషయాన్ని పరిచయం చేసే మూలపాఠంలోని విధానార్థాన్ని నిలుపుతుంది.
- source_word: ὁ κύριος
  choice: ప్రభువు
  rationale: κύριος అనే బిరుదును సంప్రదాయబద్ధమైన, గౌరవప్రదమైన తెలుగులో ఇస్తూ దాని నిర్దిష్ట సూచనను అనువాదంలో అదనంగా నిర్ణయించదు.
- source_word: ἐξήγαγεν ἐκ τῆς φυλακῆς
  choice: చెరసాలలోనుండి ... బయటికి తీసుకువచ్చాడు
  rationale: బంధించబడిన స్థలం నుండి బయటకు నడిపించడం లేదా తీసుకురావడం అనే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: Ἀπαγγείλατε
  choice: తెలియజేయండి
  rationale: ముఖ్యమైన సమాచారాన్ని మరొకరికి చేరవేయాలనే ఆజ్ఞను సహజమైన తెలుగులో అందిస్తుంది.
- source_word: Ἰακώβῳ
  choice: యాకోబుకు
  rationale: కొత్త నిబంధనలో ఈ పేరుకు వాడుకలో ఉన్న తెలుగు రూపాన్ని ఉపయోగిస్తుంది.
- source_word: τοῖς ἀδελφοῖς
  choice: సహోదరులకు
  rationale: గ్రీకు పుంలింగ బహువచన రూపాన్ని నేరుగా నిలుపుతుంది; సందర్భంలో విస్తృత విశ్వాసుల సమాజాన్ని సూచించే అవకాశం పాదసూచికలో ఇవ్వబడింది.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: అక్కడి నుండి బయలుదేరి ... వెళ్లాడు
  rationale: ప్రస్తుత స్థలాన్ని విడిచిపెట్టడం, మరొక చోటికి వెళ్లడం అనే రెండు కదలికల భావాన్ని పునరుక్తి లేకుండా నిలుపుతుంది.
- source_word: εἰς ἕτερον τόπον
  choice: వేరొక చోటికి
  rationale: స్థలాన్ని నిర్దిష్టం చేయకుండా ἕτερον లోని మరొక/వేరైన అనే భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: κύριος పదం ఎవరిని సూచిస్తుంది?
  choice: ప్రభువు
  alternative: ప్రత్యేకంగా ప్రభువైన యేసు; లేదా విస్తృతంగా దేవుడు
  rationale: మూలపాఠం κύριος అని మాత్రమే చెబుతుంది. అపొస్తలుల కార్యములలో ఇది పునరుత్థానుడైన యేసును సూచించగలిగినా, ఇక్కడ అనువాదం ఆ సూచనను మూలపాఠం కంటే ఎక్కువగా నిర్దిష్టం చేయకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ప్రధాన పాఠంలో గ్రీకు నిర్మాణం మరియు భావక్రమం నిలుపుతూ సహజమైన తెలుగు వాక్యనిర్మాణం ఉపయోగించబడింది.
