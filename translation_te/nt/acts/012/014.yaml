id: ACT.12.14
reference: Acts 12:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐπιγνοῦσα τὴν φωνὴν τοῦ Πέτρου ἀπὸ τῆς χαρᾶς οὐκ ἤνοιξεν τὸν πυλῶνα, εἰσδραμοῦσα δὲ ἀπήγγειλεν ἑστάναι τὸν Πέτρον πρὸ τοῦ πυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/014.yaml
  text: And when she recognized Peter’s voice[a], because of her joy she did not open the gate[b], but ran in and reported that Peter was standing at the gate.
translation:
  language: te
  text: ఆమె పేతురు స్వరాన్ని గుర్తుపట్టి, సంతోషం వల్ల గుమ్మం[a] తెరవకుండా లోపలికి పరుగెత్తి, పేతురు గుమ్మం ముందు నిలబడి ఉన్నాడని[b] తెలియజేసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గుమ్మం’ (πυλών) అంటే వీధి నుండి ఇంటి ప్రాంగణంలోకి వెళ్లే బయటి ద్వారం లేదా ప్రవేశమార్గం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘పేతురు గుమ్మం ముందు నిలబడి ఉన్నాడని తెలియజేసింది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοῦσα
  choice: గుర్తుపట్టి
  rationale: విని పేతురు స్వరమని గుర్తించిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὴν φωνὴν τοῦ Πέτρου
  choice: పేతురు స్వరాన్ని
  rationale: ఈ సందర్భంలో φωνή ఒక వ్యక్తి మాట్లాడే స్వరాన్ని సూచిస్తుంది; ‘స్వరం’ ఖచ్చితమైన సహజ ప్రయోగం.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: సంతోషం వల్ల
  rationale: ἀπό ఇక్కడ కారణాన్ని తెలియజేస్తుంది; ఆమె గుమ్మం తెరవకపోవడానికి ఆనందమే కారణమని స్పష్టంగా ఉంచుతుంది.
- source_word: οὐκ ἤνοιξεν
  choice: తెరవకుండా
  rationale: గ్రీకు క్రియ ‘తెరవడం’ మాత్రమే చెబుతుంది; ‘తాళం తీయడం’ వంటి అదనపు భావాన్ని చేర్చదు.
- source_word: τὸν πυλῶνα / τοῦ πυλῶνος
  choice: గుమ్మం
  rationale: πυλών వీధి నుండి ఇంటి ప్రాంగణంలోకి వెళ్లే బయటి ప్రవేశద్వారాన్ని సూచించగలదు; తెలుగు గృహ సందర్భంలో ‘గుమ్మం’ సహజంగా సరిపోతుంది.
- source_word: εἰσδραμοῦσα
  choice: లోపలికి పరుగెత్తి
  rationale: లోపలివైపు వేగంగా పరుగెత్తిన చర్యను, కథన వేగాన్ని కాపాడుతూ వ్యక్తం చేస్తుంది.
- source_word: ἀπήγγειλεν
  choice: తెలియజేసింది
  rationale: వార్తను లోపలున్నవారికి చెప్పిన భావాన్ని గౌరవప్రదమైన సాధారణ తెలుగులో అందిస్తుంది.
- source_word: ἑστάναι
  choice: నిలబడి ఉన్నాడని
  rationale: పరిపూర్ణ infinitive సూచించే కొనసాగుతున్న స్థితిని సహజ తెలుగులో నిలుపుతుంది.
- source_word: πρὸ τοῦ πυλῶνος
  choice: గుమ్మం ముందు
  rationale: πρό + genitive యొక్క ‘ముందు/ఎదుట’ అనే స్థలార్థాన్ని సూటిగా కాపాడుతుంది.
