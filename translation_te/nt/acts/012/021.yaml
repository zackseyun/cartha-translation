id: ACT.12.21
reference: Acts 12:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τακτῇ δὲ ἡμέρᾳ ὁ Ἡρῴδης ἐνδυσάμενος ἐσθῆτα βασιλικὴν ⸀καὶ καθίσας ἐπὶ τοῦ βήματος ἐδημηγόρει πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/021.yaml
  text: On an appointed day[a], Herod, having put on royal clothing and having sat down on the tribunal[b], was delivering a public address to them.
translation:
  language: te
  text: నిర్ణయించిన రోజున హేరోదు రాజవస్త్రాలు ధరించి, అధికారిక వేదికపై కూర్చొని, వారిని ఉద్దేశించి బహిరంగంగా ప్రసంగిస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τακτῇ ... ἡμέρᾳ
  choice: నియమించబడిన ఒక రోజున
  rationale: τακτός నిర్ణయించబడిన లేదా నియమించబడిన సమయాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో సహజత్వం కోసం అనిర్దిష్ట భావాన్ని ‘ఒక’తో వ్యక్తం చేశాం.
- source_word: ἐνδυσάμενος
  choice: ధరించి
  rationale: హేరోదు తానే వస్త్రాలు వేసుకున్న చర్యను సూచించే మధ్యమ ప్రయోగాన్ని తెలుగులో సహజమైన పూర్వకాలిక క్రియారూపంతో అందిస్తుంది.
- source_word: ἐσθῆτα βασιλικὴν
  choice: రాజవస్త్రాలు
  rationale: ఇది రాజుకు తగిన వస్త్రధారణను సూచిస్తుంది. గ్రీకు ఏకవచనం సమష్టిగా వస్త్రధారణను సూచించగలదు; ‘రాజవస్త్రాలు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: καθίσας
  choice: కూర్చుని
  rationale: మొదట వస్త్రాలు ధరించడం, తరువాత ఆసనం మీద కూర్చోవడం అనే క్రియాక్రమాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἐπὶ τοῦ βήματος
  choice: న్యాయపీఠం మీద
  rationale: βῆμα అధికారిక ఆసనం లేదా ఎత్తైన వేదికను సూచించగలదు. ‘న్యాయపీఠం’ దాని అధికారిక భావాన్ని నిలుపుతుంది; ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: ἐδημηγόρει
  choice: బహిరంగంగా ప్రసంగిస్తూ ఉన్నాడు
  rationale: δημηγορέω ప్రజాసమూహాన్ని ఉద్దేశించి ప్రసంగించడాన్ని సూచిస్తుంది; అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న చర్యను ‘ప్రసంగిస్తూ ఉన్నాడు’ తెలియజేస్తుంది.
- source_word: πρὸς αὐτούς
  choice: వారికి
  rationale: ప్రసంగం ఎవరిని ఉద్దేశించిందో సరళంగా, సహజంగా వ్యక్తం చేస్తుంది.
