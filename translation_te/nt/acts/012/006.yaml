  terminology: ‘హేరోదు,’ ‘పేతురు,’ ‘సైనికులు,’ ‘గొలుసులు,’ and ‘చెరసాల’ are appropriate. ‘కాపలాదారులు ... కాపాడుతూ’ preserves the source’s guard/guarding expression without the slightly bureaucratic sense of ‘నిఘా ఉంచడం.’
