  source_fidelity: The draft accurately conveys Herod's imminent action, Peter's location between two soldiers, his restraint with two chains, and the guards stationed before the door. However, ‘చెరసాలపై నిఘా ఉంచుతూ’ is somewhat less direct than τηρέω with τὴν φυλακήν, which here denotes guarding the prison.
