translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. గ్రీకు వాక్యంలోని కొనసాగుతున్న చర్యలను ‘నిద్రపోతూ ఉన్నాడు,’ ‘నిఘా ఉంచుతూ ఉన్నారు’ అనే రూపాలతో నిలిపాం. మూలంలో లేని ప్రారంభ ‘ఇప్పుడు’ వంటి సంభాషణ సూచికను చేర్చలేదు. పాఠంలోని [b] గుర్తును అది వివరిస్తున్న ἐτήρουν τὴν φυλακήν భాగం వద్ద ఉంచాం.
