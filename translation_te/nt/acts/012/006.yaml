id: ACT.12.6
reference: Acts 12:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὅτε δὲ ἤμελλεν ⸂προαγαγεῖν αὐτὸν⸃ ὁ Ἡρῴδης, τῇ νυκτὶ ἐκείνῃ ἦν ὁ Πέτρος κοιμώμενος μεταξὺ δύο στρατιωτῶν δεδεμένος ἁλύσεσιν δυσίν, φύλακές τε πρὸ τῆς θύρας ἐτήρουν τὴν φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/006.yaml
  text: When Herod was about to bring him out[a], on that very night Peter was sleeping between two soldiers, bound with two chains[b], and guards before the door were keeping watch over the prison.
translation:
  language: te
  text: హేరోదు అతన్ని బయటకు తీసుకురావబోతుండగా[a], సరిగ్గా ఆ రాత్రే పేతురు ఇద్దరు సైనికుల మధ్య రెండు గొలుసులతో బంధించబడి నిద్రపోతూ ఉన్నాడు; తలుపు ముందు కాపలాదారులు చెరసాలను కాపాడుతూ ఉన్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతన్ని ముందుకు తీసుకురావబోతుండగా.’ గ్రీకు క్రియ ఒకరిని ప్రజల ఎదుట హాజరుపరచడానికి లేదా విచారణకు తీసుకువెళ్లడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘చెరసాలకు కాపలా కాస్తూ ఉన్నారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμελλεν
  choice: తీసుకురాబోతున్నప్పుడు
  rationale: μέλλω రాబోయే చర్య సమీపంలో ఉందనే భావాన్ని తెలియజేస్తుంది; ‘బోతున్నప్పుడు’ ఆ ఆసన్నతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: προαγαγεῖν αὐτόν
  choice: అతన్ని బయటకు తీసుకురావడం
  rationale: సందర్భంలో పేతురును నిర్బంధం నుండి ప్రజల ఎదుటకు లేదా విచారణకు తీసుకురావడాన్ని సూచిస్తుంది. ‘బయటకు తీసుకురావడం’ కదలికను, చెరసాల సందర్భాన్ని రెండింటినీ స్పష్టంగా ఉంచుతుంది.
- source_word: τῇ νυκτὶ ἐκείνῃ
  choice: సరిగ్గా ఆ రాత్రే
  rationale: ἐκείνῃ ఇచ్చే నిర్దిష్టతను, కథనంలోని ఉత్కంఠను ‘ఆ రాత్రే’ తెలియజేస్తుంది; ‘సరిగ్గా’ దాని నొక్కిచెప్పే భావాన్ని సహజంగా బలపరుస్తుంది.
- source_word: κοιμώμενος
  choice: నిద్రపోతూ ఉన్నాడు
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న చర్యను ఈ రూపం కాపాడుతుంది.
- source_word: μεταξὺ δύο στρατιωτῶν
  choice: ఇద్దరు సైనికుల మధ్య
  rationale: ఇది స్పష్టమైన, సహజమైన స్థలసూచక అనువాదం.
- source_word: δεδεμένος ἁλύσεσιν δυσίν
  choice: రెండు గొలుసులతో బంధించబడి
  rationale: పేతురు అప్పటికే బంధింపబడి ఉన్న స్థితిని పరిపూర్ణ కర్మణి కృదంతం సూచిస్తుంది; సాధనాన్ని ‘రెండు గొలుసులతో’ స్పష్టపరుస్తుంది.
- source_word: φύλακες πρὸ τῆς θύρας
  choice: తలుపు ముందు కాపలాదారులు
  rationale: చెరసాల సందర్భంలో φύλακεςకు ‘కాపలాదారులు’ స్పష్టమైన ఆధునిక సమానార్థకం; πρό యొక్క స్థలార్థాన్ని ‘తలుపు ముందు’ నిలుపుతుంది.
- source_word: ἐτήρουν τὴν φυλακήν
  choice: చెరసాలపై నిఘా ఉంచుతూ ఉన్నారు
  rationale: τηρέωలోని జాగ్రత్తగా కాపాడే భావాన్ని, φυλακήలోని చెరసాల అర్థాన్ని వ్యక్తం చేస్తుంది; ‘కాపలాదారులు కాపలా’ అనే అనవసర పునరుక్తిని నివారిస్తుంది.
