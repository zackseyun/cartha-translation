id: ACT.12.22
reference: Acts 12:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ δῆμος ἐπεφώνει· ⸂Θεοῦ φωνὴ⸃ καὶ οὐκ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/022.yaml
  text: And the crowd kept shouting[a], “The voice of a god, and not of a man!”
translation:
  language: te
  text: అప్పుడు జనసమూహం, “ఇది ఒక దేవుని స్వరం, మనిషి స్వరం కాదు!” అని పదేపదే కేకలు వేసింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇది దేవుని స్వరం, మనిషి స్వరం కాదు!” అని అనువదించవచ్చు. గ్రీకు వాక్యాన్ని ఇలా కూడా అర్థం చేసుకోవచ్చు; అయితే సందర్భంలో హేరోదును అన్యమత పద్ధతిలో దైవంగా పొగిడే భావంతో “ఒక దేవుని” అనేదే ఎక్కువ సంభావ్యమైనది.
    reason: alternative_reading
lexical_decisions:
- source_word: δῆμος
  choice: జనసమూహం
  rationale: ఇక్కడ ఇది అధికారిక రాజకీయ సభను కాకుండా అక్కడ కూడిన ప్రజలను సూచిస్తుంది; ‘జనసమూహం’ ఆధునిక తెలుగులో సహజంగా దృశ్యాన్ని తెలియజేస్తుంది.
- source_word: ἐπεφώνει
  choice: పదేపదే కేకలు వేసింది
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగిన లేదా పునరావృతమైన కేకలను సూచిస్తుంది; ఈ అనువాదం ఆ క్రియాంశాన్ని నిలుపుతుంది.
- source_word: Θεοῦ
  choice: ఒక దేవుని
  rationale: అన్యమత నేపథ్యంలోని ఈ ప్రశంసలో వ్యాసరహిత θεοῦ సాధారణంగా ‘ఒక దేవుని’ అనే భావాన్ని ఇస్తుంది; ఇశ్రాయేలు దేవుని గురించి నిర్దిష్ట ప్రకటనగా మార్చదు.
- source_word: φωνὴ
  choice: స్వరం
  rationale: నామవాచక రూపంలోని ఈ ఉద్ఘాటనను నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: ἀνθρώπου
  choice: మనిషి
  rationale: ‘దేవుని’ అనే పదంతో ఉన్న ప్రత్యక్ష ఏకవచన వ్యత్యాసాన్ని కాపాడుతుంది; ‘మానవ స్వరం’ కంటే మూలరూపానికి దగ్గరగా ఉంటుంది.
theological_decisions:
- issue: θεοῦను ‘దేవుని’గా నిర్దిష్టంగా అర్థం చేసుకోవాలా, ‘ఒక దేవుని’గా అర్థం చేసుకోవాలా
  choice: ఒక దేవుని
  alternative: దేవుని
  rationale: హేరోదును దైవిక గౌరవంతో పొగిడే అన్యమత జనసమూహమే సందర్భం; గ్రీకులో నిర్దిష్ట వ్యాసం లేదు. ‘దేవుని’ అని మాత్రమే అనువదిస్తే వారు ఏకైక దేవుణ్ణి ఉద్దేశించారని తప్పుగా తోచవచ్చు. అయితే గ్రీకు రూపానికి రెండవ పఠనం సాధ్యమైనందున దాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. అసంపూర్ణ భూతకాల క్రియ యొక్క పునరావృత భావాన్ని ‘పదేపదే’ ద్వారా వ్యక్తం చేశాం; θεοῦలోని నిజమైన అర్థసందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
