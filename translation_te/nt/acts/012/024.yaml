  text: But the word of God continued to grow and multiply[a].
translation:
  language: te
  text: అయితే దేవుని వాక్యం పెరుగుతూ విస్తరిస్తూ ఉండింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని సందేశం పెరుగుతూ విస్తరిస్తూ ఉండింది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: వాక్యం
  rationale: లూకా రచనల్లో తరచుగా కనిపించే ‘దేవుని వాక్యం’ అనే ప్రయోగాన్ని, అలాగే దేవుని గురించి ప్రకటించబడే సందేశం అనే విస్తృత భావాన్ని నిలుపుతుంది. సందర్భంలో ‘సందేశం’ కూడా సాధ్యమే.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: దేవునికి చెందిన లేదా దేవుని నుండి వచ్చిన వాక్యం అనే సంబంధాన్ని సహజమైన తెలుగు షష్ఠీ రూపంలో తెలియజేస్తుంది.
- source_word: ηὔξανεν
  choice: అంతకంతకూ వృద్ధి చెంది
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న ప్రక్రియను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπληθύνετο
  choice: విస్తరించింది
  rationale: ముందున్న ‘వృద్ధి చెంది’తో తేడాను నిలుపుతూ, దేవుని వాక్యం మరింతగా వ్యాపించిందనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: హేరోదు మరణానికి సంబంధించిన ముందటి వృత్తాంతంతో ఉన్న వ్యత్యాసాన్ని సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: ‘దేవుని వాక్యం’ను మరింత భావానువాదంగా ‘దేవుని సందేశం’ అని ఇవ్వాలా?
  choice: దేవుని వాక్యం
  alternative: దేవుని సందేశం
  rationale: ‘దేవుని వాక్యం’ లూకా పదప్రయోగంతో అంతర్గ్రంథ స్థిరత్వాన్ని కాపాడుతుంది; అదే సమయంలో ప్రకటిత సందేశం అనే విస్తృత భావాన్ని అనవసరంగా సంకుచితం చేయదు. ‘దేవుని సందేశం’ సందర్భానుకూలమైన ప్రత్యామ్నాయం కావడంతో పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే బైబిలు ప్రయోగానికి తగిన గౌరవప్రదమైన శైలి. జతగా ఉన్న గ్రీకు క్రియల భావభేదాన్ని ‘వృద్ధి చెంది విస్తరించింది’తో నిలిపాం.
