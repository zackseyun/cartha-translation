source:
  edition: SBLGNT
  text: Ἡρῴδης δὲ ἐπιζητήσας αὐτὸν καὶ μὴ εὑρὼν ἀνακρίνας τοὺς φύλακας ἐκέλευσεν ἀπαχθῆναι, καὶ κατελθὼν ἀπὸ τῆς Ἰουδαίας ⸀εἰς Καισάρειαν διέτριβεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/019.yaml
  text: But Herod[a], after searching for him and not finding him, examined the guards and ordered them to be led away to execution. Then he went down from Judea to Caesarea and stayed there.
translation:
  language: te
  text: హేరోదు అతని కోసం వెదికి, అతడు కనిపించకపోవడంతో, కాపలాదారులను విచారించి, వారిని మరణశిక్ష కోసం తీసుకుపోవాలని ఆజ్ఞాపించాడు.[a] తరువాత అతడు యూదయ నుంచి కైసరయకు దిగివెళ్లి అక్కడ కొంతకాలం ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వారిని తీసుకుపోవాలని ఆజ్ఞాపించాడు.” ఈ సందర్భంలో వారిని మరణశిక్ష అమలు చేయడానికి తీసుకుపోయారని భావం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιζητήσας
  choice: అతని కోసం వెదికి
  rationale: హేరోదు పేతురును కనుగొనడానికి ఉద్దేశపూర్వకంగా వెదికిన చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది; అసమాపక క్రియ ప్రధాన చర్యకు ముందు జరిగినదని కూడా సూచిస్తుంది.
- source_word: μὴ εὑρὼν
  choice: అతడు కనిపించకపోవడంతో
  rationale: వెదకడం విఫలమైన తరువాత విచారణ జరిగిందనే క్రమాన్ని సహజంగా చూపిస్తుంది.
- source_word: ἀνακρίνας
  choice: విచారించి
  rationale: న్యాయపరమైన లేదా అధికారిక ప్రశ్నాపరిశీలన భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: τοὺς φύλακας
  choice: కాపలాదారులను
  rationale: పేతురుకు కాపలా ఉంచబడిన వారిని సూచించే సులభమైన ఆధునిక పదం.
- source_word: ἐκέλευσεν ἀπαχθῆναι
  choice: వారిని తీసుకుపోయి మరణశిక్ష అమలు చేయాలని ఆజ్ఞాపించాడు
  rationale: ἀπαχθῆναι యొక్క ప్రాథమిక ‘తీసుకుపోవడం’ భావాన్ని ఉంచుతూ, ఈ సందర్భంలో బలంగా సూచించబడే మరణశిక్ష ఉద్దేశాన్ని ప్రధాన పాఠ్యంలో స్పష్టం చేస్తుంది.
- source_word: κατελθὼν
  choice: దిగివెళ్లి
  rationale: యూదయ నుంచి తీరప్రాంతంలోని కైసరయకు ప్రయాణాన్ని తెలిపే గ్రీకు భౌగోళిక ప్రయోగాన్ని నిలుపుతుంది.
- source_word: τῆς Ἰουδαίας
  choice: యూదయ నుంచి
  rationale: ప్రామాణిక తెలుగు భౌగోళిక నామాన్ని వాడుతుంది.
- source_word: εἰς Καισάρειαν
  choice: కైసరయకు
  rationale: స్థల నామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: διέτριβεν
  choice: అక్కడ కొంతకాలం ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగింపు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἀπαχθῆναιను కేవలం ‘తీసుకుపోవడం’గా ఉంచాలా, లేక సందర్భంలో సూచితమైన మరణశిక్షను స్పష్టం చేయాలా
  choice: వారిని తీసుకుపోయి మరణశిక్ష అమలు చేయాలని ఆజ్ఞాపించాడు
  alternative: వారిని తీసుకుపోవాలని ఆజ్ఞాపించాడు
  rationale: గ్రీకు పదం స్వయంగా చంపడాన్ని నేరుగా చెప్పకపోయినా, ఖైదీ తప్పించుకున్న తరువాత కాపలాదారుల విషయంలో హేరోదు ఇచ్చిన ఆజ్ఞ సందర్భానుసారంగా మరణశిక్షను బలంగా సూచిస్తుంది. ప్రధాన పాఠ్యం ఆ భావాన్ని స్పష్టం చేస్తూ, అక్షరార్థాన్ని పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని చర్యల క్రమాన్ని నిలుపుతూ, దీర్ఘమైన అసమాపక నిర్మాణాలను తెలుగు పాఠకులకు స్పష్టంగా ఉండేలా అనుసంధానించాం. మరణశిక్ష భావాన్ని సందర్భానుసారంగా ప్రధాన పాఠ్యంలో తెలిపి, గ్రీకు పదబంధపు అక్షరార్థాన్ని [a] పాదసూచికలో ఇచ్చాం.
