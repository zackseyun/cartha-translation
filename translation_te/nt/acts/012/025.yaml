  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ καὶ Σαῦλος ὑπέστρεψαν, ⸀εἰς Ἰερουσαλὴμ πληρώσαντες τὴν διακονίαν, ⸀συμπαραλαβόντες Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/025.yaml
  text: But Barnabas and Saul returned to Jerusalem after completing the ministry, taking along John, who was called Mark.
translation:
  language: te
  text: అయితే బర్నబా, సౌలు ఆ పరిచర్యను పూర్తిచేసి, మార్కు అని పిలువబడే యోహానును తమ వెంట తీసుకొని యెరూషలేముకు తిరిగి వచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘యెరూషలేముకు’ బదులు ‘యెరూషలేము నుండి’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: తిరిగి వచ్చారు
  rationale: ὑποστρέφω అనే క్రియకు ఇక్కడ ‘తిరిగి రావడం’ అనే సహజమైన అర్థం ఉంది; ఆధునిక తెలుగులో ‘తిరిగి వచ్చారు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: εἰς Ἰερουσαλήμ
  choice: యెరూషలేముకు
  rationale: అందించిన SBLGNT పాఠంలో εἰς సాధారణంగా గమ్యాన్ని సూచించే ‘కు’ అనే అర్థాన్ని ఇస్తుంది. కథన సందర్భంతో కష్టత ఉన్నప్పటికీ ప్రధాన పాఠాన్ని యథాతథంగా అనుసరించాం; ప్రత్యామ్నాయ పాఠాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: πληρώσαντες τὴν διακονίαν
  choice: తమ పరిచర్యను పూర్తిచేసి
  rationale: πληρόω ఇక్కడ ‘పూర్తిచేయడం’, διακονία ‘సేవ/పరిచర్య’ను సూచిస్తాయి. ‘తమ పరిచర్యను పూర్తిచేసి’ అప్పగించబడిన సేవ ముగిసిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: διακονίαν
  choice: పరిచర్యను
  rationale: సందర్భం సహాయక కానుకను అందించే సేవను సూచించినప్పటికీ, గ్రీకు పదం విస్తృతమైన ‘సేవ/పరిచర్య’ అనే భావాన్ని కలిగి ఉంది. ప్రధాన పాఠంలో సందర్భానుసారమైన ప్రత్యేక వివరణను చేర్చకుండా ‘పరిచర్య’ను ఎంచుకున్నాం.
- source_word: συμπαραλαβόντες
  choice: తమ వెంట తీసుకొచ్చారు
  rationale: ఈ కృదంతం మరొకరిని తమతో పాటు తీసుకువెళ్లడం లేదా తీసుకురావడం సూచిస్తుంది. ‘తమ వెంట తీసుకొచ్చారు’ తెలుగులో సహజంగా ఉండి, ప్రధాన క్రియకు అనుబంధ చర్యను స్పష్టంగా చూపుతుంది.
- source_word: ἐπικληθέντα Μᾶρκον
  choice: మార్కు అని పిలువబడే
  rationale: ἐπικαλέω కర్మణి రూపం ‘అని పిలువబడే/పేరుగల’ అనే అర్థాన్ని ఇస్తుంది. గ్రీకులో ‘కూడా’ స్పష్టంగా లేకపోవడంతో పేరుకు సంబంధించి దానిని చేర్చలేదు.
theological_decisions:
- issue: గమ్యం లేదా బయలుదేరిన స్థలాన్ని సూచించే పాఠాంతరం
  choice: యెరూషలేముకు
  alternative: యెరూషలేము నుండి
  rationale: అందించిన SBLGNT పాఠం εἰς Ἰερουσαλήμ (‘యెరూషలేముకు’) అని ఉంది కాబట్టి ప్రధాన పాఠంలో దానినే అనుసరించాం. కొన్ని ప్రతుల్లోని ἐξ Ἰερουσαλήμ (‘యెరూషలేము నుండి’) కథన ప్రవాహానికి అనుకూలంగా కనిపించినా, మూలపాఠంలోని నిజమైన పాఠాంతరాన్ని పరిష్కరించినట్లు చూపకుండా పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. పేర్లకు సాధారణ తెలుగు బైబిలు రూపాలైన ‘బర్నబా, సౌలు, యెరూషలేము, యోహాను, మార్కు’ ఉపయోగించాం. గ్రీకు కృదంతాలను తెలుగులో సహజమైన వరుస చర్యలుగా మలిచాం.
