revisions:
- from: అయితే బర్నబా, సౌలు తమ పరిచర్యను పూర్తిచేసి యెరూషలేముకు[a] తిరిగి వచ్చారు. మార్కు అని పిలువబడే యోహానును కూడా తమ వెంట తీసుకొచ్చారు.
  to: అయితే బర్నబా, సౌలు ఆ పరిచర్యను పూర్తిచేసి, మార్కు అని పిలువబడే యోహానును తమ వెంట తీసుకొని యెరూషలేముకు తిరిగి వచ్చారు.[a]
  rationale: The revision removes two small additions not present in the Greek (‘తమ’ and ‘కూడా’), retains the supplied SBLGNT reading ‘to Jerusalem,’ preserves the textual-variant footnote, and expresses the Greek participles as a natural Telugu sequence without changing the meaning.
