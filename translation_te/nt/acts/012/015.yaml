id: ACT.12.15
reference: Acts 12:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ πρὸς αὐτὴν εἶπαν· Μαίνῃ. ἡ δὲ διϊσχυρίζετο οὕτως ἔχειν. οἱ δὲ ἔλεγον· Ὁ ἄγγελός ⸂ἐστιν αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/015.yaml
  text: But they said to her[a], “You are out of your mind.” But she kept insisting that it was so. And they kept saying, “It is his angel.”
translation:
  language: te
  text: అయితే వారు ఆమెతో, “నీకు మతిపోయింది” అన్నారు. కానీ ఆమె అది నిజమేనని పట్టుబడుతూనే ఉంది. అప్పుడు వారు, “అది అతని దూత[a]” అని పదేపదే అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని సంరక్షక దేవదూత,” “అతనికి ప్రాతినిధ్యం వహించే దూత”; కొందరి అభిప్రాయం ప్రకారం, “అతని ఆత్మ/ప్రేతాత్మ.” గ్రీకు పాఠంలో కేవలం “అతని దూత” అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Μαίνῃ
  choice: నీకు మతిపోయింది
  rationale: μαίνομαι ఇక్కడ ఎదుటివారి మాటను నమ్మకుండా ఆమెకు మతిపోయిందని నిందించే నుడికార ప్రయోగం. ఈ రూపం ఆధునిక తెలుగులో సహజంగా ఉండి, వైద్యపరమైన నిర్ధారణలా కాకుండా మూలంలోని తీవ్రతను నిలుపుతుంది.
- source_word: διϊσχυρίζετο
  choice: పట్టుబడుతూనే ఉంది
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగిన చర్యను, క్రియలోని బలమైన నొక్కిచెప్పడాన్ని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం ఆమె పదేపదే గట్టిగా వాదించిన భావాన్ని ఇస్తుంది.
- source_word: οὕτως ἔχειν
  choice: అది నిజమేనని
  rationale: ‘విషయం అలాగే ఉంది’ అనే గ్రీకు నుడికారాన్ని సందర్భానుసారంగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ఆమె చెప్పింది నిజమనే దావాను సూచిస్తుంది.
- source_word: ἔλεγον
  choice: పదేపదే అన్నారు
  rationale: అసంపూర్ణ భూతకాలం వారు ఆ మాటను కొనసాగిస్తూ లేదా మళ్లీ మళ్లీ అన్నారని సూచిస్తుంది.
- source_word: ἄγγελός
  choice: దూత
  rationale: ἄγγελος యొక్క ప్రాథమిక అర్థం ‘దూత’; ఈ సందర్భంలో దైవిక దూత భావం సాధ్యమైనప్పటికీ, ‘దేవదూత’ అని విస్తరించకుండా మూలంలోని సంక్షిప్తతను, వ్యాఖ్యాన అవకాశాన్ని నిలుపుతుంది.
- source_word: αὐτοῦ
  choice: అతని
  rationale: గ్రీకు షష్ఠీ విభక్తి సర్వనామాన్ని సహజమైన తెలుగు స్వామ్యరూపంతో అనువదిస్తుంది; సందర్భంలో ఇది పేతురును సూచిస్తుంది.
theological_decisions:
- issue: ‘అతని దూత’ అనే మాట యొక్క అర్థం
  choice: మూలంలోని విధంగానే ‘అతని దూత’ అని వ్యాఖ్యానం జోడించకుండా అనువదించడం
  alternative: అతని సంరక్షక దేవదూత; అతని ప్రతినిధి దూత; అతని ఆత్మ/ప్రేతాత్మ
  rationale: గ్రీకు పాఠం ὁ ἄγγελος αὐτοῦ అని మాత్రమే చెబుతుంది; వారి నమ్మకం ఏమిటో వివరించదు. అందువల్ల ఒక నిర్దిష్ట దేవదూత సిద్ధాంతాన్ని లేదా ‘ఆత్మ’ అనే వ్యాఖ్యానాన్ని ప్రధాన పాఠంలో ప్రవేశపెట్టకుండా, సాధ్యమైన అర్థాలను పాదసూచికలో ఉంచడం మూలంలోని వేదాంతపరమైన ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. అసంపూర్ణ భూతకాల క్రియల కొనసాగింపు భావాన్ని ‘పట్టుబడుతూనే ఉంది,’ ‘పదేపదే అన్నారు’ ద్వారా స్పష్టంచేశాం. పాదసూచిక సూచిక [a] ప్రధాన పాఠంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
