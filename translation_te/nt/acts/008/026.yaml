source:
  edition: SBLGNT
  text: Ἄγγελος δὲ κυρίου ἐλάλησεν πρὸς Φίλιππον λέγων· Ἀνάστηθι καὶ πορεύου κατὰ μεσημβρίαν ἐπὶ τὴν ὁδὸν τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν· αὕτη ἐστὶν ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/026.yaml
  text: An angel of the Lord spoke to Philip[a], saying[b], “Get up and go south to the road that goes down from Jerusalem to Gaza.” This is a deserted road.
translation:
  language: te
  text: 'ప్రభువు యొక్క ఒక దూత ఫిలిప్పుతో ఇలా చెప్పాడు: “లేచి, దక్షిణ దిశగా[a] యెరూషలేము నుండి గాజాకు దిగివెళ్లే దారికి వెళ్లు.” ఆ దారి నిర్మానుష్యమైనది[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మధ్యాహ్న సమయంలో.” ఈ గ్రీకు పదబంధం దిశను (“దక్షిణ దిశగా”) లేదా సమయాన్ని (“మధ్యాహ్న సమయంలో”) సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా “ఇది ఎడారి.” ఈ మాట దారి నిర్మానుష్యంగా ఉందని కాకుండా, ఆ మార్గం ఎడారి ప్రాంతం గుండా వెళ్తుందని సూచిస్తూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγγελος δὲ κυρίου
  choice: ప్రభువు దూత
  rationale: Ἄγγελος సందర్భంలో దేవుని తరఫున సందేశం లేదా ఆదేశం అందించే దూతను సూచిస్తుంది. అనిర్దిష్ట గ్రీకు రూపాన్ని తెలుగులో సహజంగా ‘ప్రభువు దూత’ అని ఇచ్చాం; δὲను ప్రత్యేక పదంగా చేర్చకుండా వాక్యప్రవాహంలో ప్రతిబింబించాం.
- source_word: ἐλάλησεν πρὸς Φίλιππον λέγων
  choice: ఫిలిప్పుతో మాట్లాడుతూ ఇలా అన్నాడు
  rationale: λαλέω, λέγων రెండింటి భావాన్ని సాధ్యమైనంత వరకు నిలుపుతూ, తెలుగులో సహజంగా ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది.
- source_word: Ἀνάστηθι καὶ πορεύου
  choice: నువ్వు లేచి … వెళ్లు
  rationale: రెండు ఆజ్ఞల తక్షణ కార్యభావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: κατὰ μεσημβρίαν
  choice: దక్షిణ దిశగా
  rationale: ప్రయాణ ఆదేశం ఉన్న సందర్భంలో దిశను సూచించే అర్థం ఎక్కువ సంభావ్యమైనది; ‘మధ్యాహ్న సమయంలో’ అనే నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐπὶ τὴν ὁδὸν
  choice: దారి వైపు
  rationale: ఒక నిర్దిష్ట మార్గం వైపు వెళ్లడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν
  choice: యెరూషలేము నుండి గాజాకు వెళ్లే
  rationale: καταβαίνουσανలోని భౌగోళిక దిగుదల భావం తెలుగులో ‘దిగిపోయే’ అని ఇస్తే అసహజంగా ఉండవచ్చు; గమ్యమార్గాన్ని స్పష్టంగా, సహజంగా తెలిపేందుకు ‘వెళ్లే’ అని అనువదించాం.
- source_word: αὕτη ἐστὶν ἔρημος
  choice: ఆ దారి నిర్మానుష్యమైనది
  rationale: స్త్రీలింగ αὕτη, ἔρημος పదాలు ὁδόςను తిరిగి సూచిస్తున్నట్లు తీసుకుని, తెలుగులో భావస్పష్టత కోసం ‘దారి’ని మళ్లీ పేర్కొన్నాం. ఎడారి ప్రాంతాన్ని సూచించే అవకాశాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: ‘ప్రభువు దూత’ అనే పదబంధంలో ప్రభువు మరియు దూత యొక్క నిర్దిష్ట గుర్తింపు
  choice: పాఠ్యంలో ఉన్నట్లే ‘ప్రభువు దూత’ అని మాత్రమే అనువదించడం
  alternative: ‘దేవుడు పంపిన ఒక దూత’ లేదా ఒక ప్రత్యేక దైవ ప్రత్యక్షతగా వివరించడం
  rationale: గ్రీకు పాఠ్యం దూతను ప్రభువుతో సంబంధం ఉన్న దైవిక ప్రతినిధిగా పేర్కొంటుంది; అయితే ఆ దూత యొక్క మరింత నిర్దిష్టమైన దైవశాస్త్రీయ గుర్తింపును నిర్ణయించదు. అనువాదం ఆ పరిమితిని గౌరవిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. ప్రత్యక్ష ఆజ్ఞలో సహజమైన ఏకవచన ‘నువ్వు’ రూపాన్ని ఉపయోగించాం. స్థలనామాలను సాధారణ బైబిలు తెలుగు రూపాలైన ‘యెరూషలేము’, ‘గాజా’గా ఇచ్చాం.
