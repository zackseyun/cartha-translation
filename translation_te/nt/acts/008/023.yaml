  yaml_path: translation/nt/acts/008/023.yaml
  text: For I see that you are in the gall of bitterness and the bond of unrighteousness[a][b].
translation:
  language: te
  text: ఎందుకంటే, నీవు చేదుతనపు పిత్తరసంలో[a], అనీతి బంధంలో[b] ఉన్నావని నేను చూస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చేదుతనపు పిత్తరసం’ అనేది బలమైన రూపకం. ఇది విషపూరితమైన చేదుతనాన్ని చెప్పే పాత నిబంధన భాషను ప్రతిధ్వనింపజేస్తుండవచ్చు (ద్వితీయోపదేశకాండము 29:18 యొక్క గ్రీకు అనువాదంతో పోల్చండి). సందర్భానుసారంగా ‘చేదుతనపు విషం’ అని కూడా అనువదించవచ్చు.
    reason: cross_reference_and_lexical_alternative
  - marker: b
    text: ‘అన్యాయపు సంకెళ్లు’ లేదా ‘దుష్టత్వపు బంధనం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς
  choice: లో
  rationale: ὁρῶ σε ὄντα అనే నిర్మాణంలో ఇది సీమోను ఉన్న స్థితిని సూచిస్తుంది; తెలుగులో ‘లో ఉన్నావు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: పేతురు ముందుగా పలికిన గద్దింపుకు కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: χολὴν πικρίας
  choice: చేదుతనపు విషం
  rationale: χολήకు పైత్యరసం/విషం అనే భావాలు ఉన్నాయి. ఇక్కడ పాత నిబంధనలోని విషపూరితమైన చేదుతనపు ప్రతిధ్వనిని నిలుపుతూ, ఆధునిక పాఠకునికి అర్థమయ్యేలా ‘విషం’ ఎంచుకోబడింది; రూపకాన్ని కేవలం ‘చేదుతనం’గా చదును చేయలేదు.
- source_word: σύνδεσμον ἀδικίας
  choice: అనీతి బంధం
  rationale: σύνδεσμος బంధించే దానిని, ἀδικία నీతికి విరుద్ధమైన స్థితి లేదా ప్రవర్తనను సూచిస్తాయి. ‘అనీతి బంధం’ వ్యక్తిగత నైతిక స్థితిని తెలియజేస్తూనే మూలంలోని రూపకాన్ని నిలుపుతుంది.
- source_word: ὁρῶ
  choice: నేను చూస్తున్నాను
  rationale: ఇక్కడ గ్రహించడం లేదా వివేచించడం అనే విస్తృత భావం ఉన్నప్పటికీ, ‘చూస్తున్నాను’ మూలపదానికి దగ్గరగా ఉండి తెలుగులో కూడా ఆ అంతర్భావాన్ని సహజంగా మోయగలదు.
- source_word: σε ὄντα
  choice: నీవు … ఉన్నావని
  rationale: కర్మవిభక్తి పదంతో కూడిన వర్తమాన కృదంత నిర్మాణాన్ని తెలుగులో సహజమైన విషయవాచక ఉపవాక్యంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సీమోను ఆధ్యాత్మిక, నైతిక స్థితిని వర్ణించే రెండు రూపకాలు
  choice: ‘చేదుతనపు విషంలో, అనీతి బంధంలో’ అని రూపకాలుగానే నిలుపబడింది.
  alternative: ‘నీవు తీవ్రమైన చేదుతో నిండి పాపానికి బానిసవై ఉన్నావు’ అని వివరణాత్మకంగా అనువదించడం.
  rationale: గ్రీకు పాఠం సీమోను స్థితిని బలమైన, సంక్షిప్తమైన రూపకాలతో వర్ణిస్తుంది; అది నిర్దిష్టమైన సిద్ధాంత వివరణను ఇవ్వదు. అందువల్ల రూపకాల తీవ్రతను, కొంత భావవిస్తృతిని నిలుపుతూ అదనపు సిద్ధాంతార్థాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకునికి అర్థమయ్యేలా గంభీరమైన శైలి వాడబడింది. ‘నీవు’ గౌరవభరితమైన బైబిలు వచనశైలిని నిలుపుతుంది; అసలు పాఠంలోని విషం, బంధం అనే రూపకాలు వివరణలో కరిగిపోకుండా ఉంచబడ్డాయి.
