id: ACT.8.1
reference: Acts 8:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Σαῦλος δὲ ἦν συνευδοκῶν τῇ ἀναιρέσει αὐτοῦ. Ἐγένετο δὲ ἐν ἐκείνῃ τῇ ἡμέρᾳ διωγμὸς μέγας ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις· πάντες δὲ διεσπάρησαν κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας πλὴν τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/001.yaml
  text: Saul was approving of his execution. And on that day a great persecution arose against the church in Jerusalem[a], and they were all scattered throughout the regions of Judea and Samaria, except the apostles.
translation:
  language: te
  text: సౌలు అతనిని చంపడాన్ని[a] సమ్మతిస్తూ ఉన్నాడు. ఆ రోజున యెరూషలేములోని సంఘానికి వ్యతిరేకంగా తీవ్రమైన హింస చెలరేగింది. అపొస్తలులు తప్ప, వారందరూ యూదయ, సమరయ ప్రాంతాలంతటా చెదరిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని వధకు.” గ్రీకు పదం కేవలం అతని మరణాన్ని కాదు, అతనిని చంపిన కార్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σαῦλος
  choice: సౌలు
  rationale: వ్యక్తి పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: συνευδοκῶν
  choice: సమ్మతిస్తూ ఉన్నాడు
  rationale: ἦν తో కూడిన వర్తమాన కృదంతం అప్పటిలో కొనసాగుతున్న అనుకూల సమ్మతిని సూచిస్తుంది; ప్రత్యక్షంగా చంపడంలో పాల్గొన్నాడని అదనంగా చెప్పదు.
- source_word: τῇ ἀναιρέσει αὐτοῦ
  choice: అతని వధకు
  rationale: ἀναίρεσις అతన్ని చంపే కార్యాన్ని సూచిస్తుంది. ‘వధ’ ఆ కార్యాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; చట్టబద్ధతను సూచించే ‘మరణశిక్ష’ను గానీ, మూలపదం కంటే బలమైన న్యాయనిర్ణయాన్ని గానీ చేర్చదు.
- source_word: Ἐγένετο
  choice: చెలరేగింది
  rationale: హింస ఆరంభమై వ్యాపించిన సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: διωγμὸς μέγας
  choice: తీవ్రమైన హింస
  rationale: μέγας సూచించే తీవ్రతను సహజ తెలుగులో అందిస్తుంది; ‘గొప్ప హింస’ అనే అసహజ పదబంధాన్ని నివారిస్తుంది.
- source_word: ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις
  choice: యెరూషలేములోని సంఘానికి వ్యతిరేకంగా
  rationale: ἐπί యొక్క శత్రుత్వ దిశను ‘వ్యతిరేకంగా’ స్పష్టంగా తెలియజేస్తూ, సంఘం ఉన్న స్థలాన్ని సహజంగా కలుపుతుంది.
- source_word: πάντες δὲ διεσπάρησαν
  choice: వారందరూ ... చెదరిపోయారు
  rationale: బలవంతపు చెదరగొట్టబడటాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘వారందరూ’ అనే సందర్భసూచిత కర్త సంఘంలోని వారిని సూచిస్తుంది.
- source_word: κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας
  choice: యూదయ, సమరయ ప్రాంతాలంతటా
  rationale: κατά యొక్క విస్తరణ భావాన్ని ‘అంతటా’తో, χώρας యొక్క భౌగోళిక భావాన్ని ‘ప్రాంతాలు’తో అందిస్తుంది.
- source_word: πλὴν τῶν ἀποστόλων
  choice: అపొస్తలులు తప్ప
  rationale: πλήν తెలిపే మినహాయింపును నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: స్తెఫను మరణానికి సంబంధించి ἀναιρέσει αὐτοῦ ను ఎలా అనువదించాలి
  choice: అతని వధకు
  alternative: అతని మరణానికి / అతన్ని చంపడానికి / అతని మరణశిక్షకు
  rationale: మూలపాఠం మరణించిన వాస్తవాన్ని మాత్రమే కాక చంపే కార్యాన్ని సూచిస్తుంది. ‘మరణశిక్ష’ చట్టబద్ధమైన తీర్పు భావాన్ని చేర్చవచ్చు; ‘హత్య’ మూలపదం స్వయంగా ప్రకటించేదానికంటే బలమైన నైతిక-న్యాయ నిర్ణయంగా వినిపించవచ్చు. ‘వధ’ ఈ రెండింటినీ నివారిస్తుంది.
- issue: πάντες అనే ‘అందరూ’ పదం యొక్క పరిధి
  choice: వారందరూ ... అపొస్తలులు తప్ప
  alternative: విశ్వాసులందరూ / ప్రతి ఒక్కరూ
  rationale: మూలపాఠమే అపొస్తలులను మినహాయిస్తుంది. ‘వారందరూ’ సాహిత్య బలాన్ని నిలుపుతూ, సందర్భంలో యెరూషలేము సంఘానికి చెందిన వారిని సూచించేందుకు వీలు కల్పిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయినా గౌరవప్రదమైన శైలిలో ఉంది. వాక్యారంభంలోని δέ ను కృత్రిమంగా ‘ఇప్పుడు’ అని అనువదించలేదు. మొదటి వాక్యంలోని ‘అతని’ సందర్భపరంగా స్తెఫనును సూచిస్తుంది; మూలంలో పేరును మళ్లీ చేర్చలేదు.
