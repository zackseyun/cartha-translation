source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Πῶς γὰρ ἂν δυναίμην ἐὰν μή τις ⸀ὁδηγήσει με; παρεκάλεσέν τε τὸν Φίλιππον ἀναβάντα καθίσαι σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/031.yaml
  text: And he said[a], “How could I[b], unless someone guides me?” Then he urged Philip to come up and sit with him.
translation:
  language: te
  text: అతడు, “ఎవరైనా నాకు మార్గం చూపితే[a] తప్ప, నాకెలా సాధ్యమవుతుంది?” అని అన్నాడు. అప్పుడు ఫిలిప్పు పైకి ఎక్కి తనతో కూర్చోవాలని అతన్ని కోరాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎవరైనా నన్ను నడిపిస్తే.’ గ్రీకు క్రియ దారిలో నడిపించడాన్నీ, అర్థం చేసుకునేలా మార్గదర్శనం చేయడాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఫిలిప్పు పైకి ఎక్కి తనతో కూర్చోవాలని ఆహ్వానించాడు.’ ఈ గ్రీకు క్రియ పట్టుదలతో చేసే అభ్యర్థనను లేదా ఆహ్వానాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πῶς γὰρ ἂν δυναίμην
  choice: నాకెలా సాధ్యమవుతుంది?
  rationale: ἄνతో కూడిన optative సాధ్యతను, షరతు నెరవేరకపోతే తనకు అది సాధ్యం కాదనే భావాన్ని తెలియజేస్తుంది. గ్రీకు వాక్యంలో కర్మ స్పష్టంగా చెప్పబడనందున తెలుగులోనూ దానిని అనవసరంగా చేర్చలేదు.
- source_word: ἐὰν μή τις ὁδηγήσει με
  choice: ఎవరైనా నాకు మార్గం చూపిస్తే తప్ప
  rationale: ὁδηγέω అనే క్రియకు దారిలో నడిపించడం, అవగాహనకు మార్గదర్శనం చేయడం అనే రెండు భావాలూ ఉన్నాయి. ‘మార్గం చూపు’ ఈ సందర్భంలో రెండింటినీ సహజంగా నిలుపుతుంది.
- source_word: παρεκάλεσέν
  choice: మనవి చేశాడు
  rationale: παρακαλέω ఇక్కడ మర్యాదతో కూడిన గట్టియైన అభ్యర్థనను సూచిస్తుంది. ‘అడిగాడు’ కంటే ‘మనవి చేశాడు’ ఆ బలాన్ని మెరుగ్గా వ్యక్తం చేస్తుంది; ‘బతిమాలాడు’ అంత తీవ్రమైన భావాన్ని అనవసరంగా కలిగిస్తుంది.
- source_word: τε
  choice: తర్వాత
  rationale: τέ రెండు వాక్యభాగాలను సున్నితంగా అనుసంధానిస్తుంది. కథన క్రమాన్ని ఆధునిక తెలుగులో సహజంగా చూపించడానికి ‘తర్వాత’ వాడబడింది.
- source_word: ἀναβάντα
  choice: పైకి ఎక్కి
  rationale: ἀναβαίνω పైకి వెళ్లడం లేదా ఎక్కడాన్ని సూచిస్తుంది. రథం ఉన్న సందర్భంలో ‘పైకి ఎక్కి’ మూలంలోని స్థలసంబంధ చిత్రాన్ని నిలుపుతుంది; మూలంలో ఈ వాక్యంలో ‘రథం’ అనే పదం లేనందున దానిని చేర్చలేదు.
- source_word: καθίσαι σὺν αὐτῷ
  choice: తనతో కూర్చోమని
  rationale: σύνతో కూడిన καθίζω ఒకరితో కలిసి కూర్చోవడాన్ని సూచిస్తుంది. ‘తనతో కూర్చోమని’ సహజమైనదిగా ఉండి, ‘తన పక్కన’ అనే సాధ్యమైన కాని మరింత నిర్దిష్టమైన అర్థాన్ని చేర్చదు.
- source_word: Φίλιππον
  choice: ఫిలిప్పు
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడింది.
