translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి వాడబడింది. మూలంలోని అస్పష్ట కర్మను అలాగే ఉంచి, ‘మార్గం చూపు’ ద్వారా భౌతిక మార్గదర్శకత్వం మరియు లేఖన అవగాహన అనే రెండు భావాలనూ నిలుపుకున్నాం.
