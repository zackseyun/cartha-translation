source:
  edition: robinson-pierpont-2005-byzantine
  text: Εἶπεν δὲ ὁ Φίλιππος, Εἰ πιστεύεις ἐξ ὅλης τῆς καρδίας, ἔξεστιν. Ἀποκριθεὶς δὲ εἶπεν, Πιστεύω τὸν υἱὸν τοῦ θεοῦ εἶναι τὸν Ἰησοῦν Χριστόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/037.yaml
  text: And Philip[a] said, “If you believe with all your heart, you may.” And he answered and said, “I believe that Jesus is the Messiah, the Son of God.”
translation:
  language: te
  text: ఫిలిప్పు[a], “నీవు పూర్ణ హృదయంతో విశ్వసిస్తే, బాప్తిస్మం పొందవచ్చు” అని చెప్పాడు. అందుకు అతడు, “యేసు మెస్సీయయని, దేవుని కుమారుడని నేను నమ్ముతున్నాను” అని జవాబిచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనం అత్యంత ప్రాచీన గ్రీకు ప్రతుల్లో—మూడవ శతాబ్దపు పపైరస్ ప్రతులతోపాటు నాలుగవ శతాబ్దపు సీనాయిటికస్, వాటికానస్ ప్రతుల్లో—మరియు ప్రాచీన కాప్టిక్ అనువాదాల్లో లేదు. అయితే ఇది బైజాంటైన్ అధికసంఖ్యాక ప్రతుల సంప్రదాయంలోనూ లాటిన్ సంప్రదాయంలోనూ ఉంది. రెండవ శతాబ్దం చివర్లో ఇరేనేయస్, మూడవ శతాబ్దంలో సిప్రియన్ వంటి తొలి సంఘ పితరులు దీనిని ఉదహరించారు. ఇది తొలినాటి బాప్తిస్మ ఆరాధనా ప్రకటనగా ఉండి, తరువాత అపొస్తలుల కార్యాల కథన పాఠ్యంలో చేరిందని పండితులు తరచుగా వివరిస్తారు.
    reason: textual_critical
lexical_decisions:
- source_word: ἔξεστιν
  choice: నీవు బాప్తిస్మం పొందవచ్చు
  rationale: ఈ అవ్యక్త క్రియ అనుమతి లేదా సాధ్యతను సూచిస్తుంది. సందర్భంలో అడిగినది బాప్తిస్మం పొందడం గురించి కాబట్టి, తెలుగులో సహజంగా ఉండేందుకు ఆ భావాన్ని స్పష్టంగా పేర్కొన్నాం.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: నీ పూర్ణహృదయంతో
  rationale: సంపూర్ణమైన నిష్కపట విశ్వాసం, అంకితభావం అనే బైబిలు నుడికారాన్ని నిలుపుతూ ఆధునిక తెలుగులో గంభీరంగా వ్యక్తపరుస్తుంది.
- source_word: Πιστεύω
  choice: నేను నమ్ముతున్నాను
  rationale: ఈ విశ్వాస ప్రకటనలో యేసు ఎవరో అంగీకరించి విశ్వసించడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὸν Ἰησοῦν Χριστόν
  choice: యేసు మెస్సీయ
  rationale: Χριστόςను కేవలం పేరులో భాగంగా కాక, ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదుగా చూపుతుంది; గ్రీకు పదక్రమాన్నీ సాధ్యమైనంతగా అనుసరిస్తుంది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: గ్రీకులోని Χριστός ఇక్కడ యేసు గుర్తింపును ప్రకటించే బిరుదు. ‘మెస్సీయ’ దాని భావాన్ని సాధారణ పాఠకునికి స్పష్టం చేస్తుంది; ఏ ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్నీ చేర్చదు.
- issue: ἔξεστινలో అంతర్లీనంగా ఉన్న కార్యం
  choice: బాప్తిస్మం పొందవచ్చు అని సందర్భానుసారంగా స్పష్టం చేయడం
  alternative: పొందవచ్చు / అనుమతి ఉంది
  rationale: ముందటి వచనంలో నపుంసకుడు బాప్తిస్మం గురించి అడిగాడు. తెలుగులో కేవలం ‘పొందవచ్చు’ అంటే అస్పష్టంగా ఉండే అవకాశం ఉన్నందున సందర్భంలో అంతర్లీనమైన కార్యాన్ని వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు కథనంలోని ‘చెప్పాడు/జవాబిచ్చాడు’ నిర్మాణాన్ని నిలిపి, అనవసరమైన ప్రాచీన పదజాలాన్ని నివారించాం. పాఠాంతర సూచిక [a]ను ‘ఫిలిప్పు’ తరువాత ఉంచాం.
