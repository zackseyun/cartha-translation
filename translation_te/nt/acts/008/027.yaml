source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἐπορεύθη, καὶ ἰδοὺ ἀνὴρ Αἰθίοψ εὐνοῦχος δυνάστης ⸀Κανδάκης βασιλίσσης Αἰθιόπων, ὃς ἦν ἐπὶ πάσης τῆς γάζης αὐτῆς, ὃς ἐληλύθει προσκυνήσων εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/027.yaml
  text: So he got up and went[a]. And behold, an Ethiopian man, a eunuch, a high official of Candace, queen of the Ethiopians, who was over all her treasury, had come to Jerusalem to worship[b],
translation:
  language: te
  text: అప్పుడు అతడు లేచి వెళ్లాడు. ఇదిగో, ఒక ఇతియోపీయుడు, ఒక నపుంసకుడు[a], ఇతియోపీయుల రాణియైన కందాకే[b]కు ఉన్నతాధికారి, ఆమె ఖజానా అంతటికీ బాధ్యుడు, ఆరాధించడానికి యెరూషలేముకు వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రాజసభ అధికారి.” గ్రీకు పదం కొన్ని సందర్భాల్లో రాజసభ అధికారిని సూచించవచ్చు; అయితే ఇక్కడ అక్షరార్థమైన “నపుంసకుడు” అనే భావమే ఉద్దేశించి ఉండే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: b
    text: “కందాకే” అనేది వ్యక్తిగత పేరు కాకుండా రాణుల వంశపారంపర్య బిరుదు అయి ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναστὰς
  choice: లేచి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను సహజమైన తెలుగు క్రియావిశేషణ రూపంలో తెలియజేస్తుంది.
- source_word: ἐπορεύθη
  choice: వెళ్లాడు
  rationale: సందర్భంలోని సాధారణ గమన క్రియను సరళంగా, సహజంగా అందిస్తుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: లూకా ఉపయోగించిన కథన దృష్టి-ఆహ్వాన సూచకాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἀνὴρ Αἰθίοψ
  choice: ఇతియోపీయుడైన ఒక మనిషి
  rationale: ἀνήρ లోని పురుష సూచనను, Αἰθίοψ లోని జాతి/ప్రాంత గుర్తింపును రెండింటినీ నిలుపుతుంది.
- source_word: εὐνοῦχος
  choice: నపుంసకుడు
  rationale: పదం యొక్క ప్రాథమిక, అక్షరార్థ భావాన్ని ఇస్తుంది; అధికారికి సంబంధించిన భావాన్ని δυνάστης వేరుగా తెలియజేస్తుంది.
- source_word: δυνάστης
  choice: ఉన్నతాధికారి
  rationale: అతనికి ఉన్న అధికారం, హోదాను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; అతను స్వయంగా పరిపాలకుడని అతిశయంగా సూచించదు.
- source_word: Κανδάκης βασιλίσσης Αἰθιόπων
  choice: ఇతియోపీయుల రాణి కందాకే
  rationale: గ్రీకు బహువచన జాతినామాన్ని అనుసరిస్తూ, Κανδάκηను లిప్యంతరీకరిస్తుంది.
- source_word: ἐπὶ πάσης τῆς γάζης αὐτῆς
  choice: ఆమె ఖజానా అంతటికీ బాధ్యుడు
  rationale: ἐπί లోని పరిపాలనా బాధ్యతను, γάζα లోని రాజఖజానా భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ἐληλύθει
  choice: వచ్చి ఉన్నాడు
  rationale: కథనంలోని ప్రస్తుత దృశ్యానికి ముందే అతడు వచ్చినట్లు సంపూర్ణ భూతకాల భావాన్ని నిలుపుతుంది.
- source_word: προσκυνήσων
  choice: ఆరాధించడానికి
  rationale: భవిష్యత్ కృదంతంలోని ఉద్దేశార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς Ἰερουσαλήμ
  choice: యెరూషలేముకు
  rationale: నగరం వైపు జరిగిన గమనాన్ని తెలుగులో సహజమైన దత్తివిభక్తితో తెలియజేస్తుంది.
theological_decisions:
- issue: εὐνοῦχος అనే పదాన్ని అక్షరార్థంగా అనువదించాలా, లేక సాధారణంగా రాజసభ అధికారిగా అనువదించాలా
  choice: ప్రధాన పాఠ్యంలో “నపుంసకుడు”
  alternative: రాజసభ అధికారి
  rationale: అక్షరార్థమే పదం యొక్క ప్రాథమిక భావం; అంతేకాక అధికార హోదాను δυνάστης ఇప్పటికే వేరుగా తెలియజేస్తుంది. విస్తృత పరిపాలనా అర్థం సాధ్యమని పాదటిప్పణిలో ఉంచడం ద్వారా అస్పష్టతను సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే కథన శైలిని ఉపయోగించాం. దీర్ఘమైన గ్రీకు వాక్యాన్ని తెలుగులో స్పష్టత కోసం చిన్న వాక్యాలుగా విభజించాం; “ఇదిగో” అనే కథన సూచకాన్ని మాత్రం నిలిపాం. పాదటిప్పణి సూచికలను అవి వివరిస్తున్న పదాల దగ్గరే ఉంచాం.
