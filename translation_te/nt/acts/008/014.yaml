    issue: Register of the directional expression
    rationale: For πρὸς αὐτούς, ‘వారి దగ్గరకు’ has the correct meaning but is comparatively colloquial. ‘వారి వద్దకు’ better fits modern standard Telugu biblical prose while retaining the referent and direction.
  revised_text: యెరూషలేములో ఉన్న అపొస్తలులు సమరయ దేవుని వాక్యాన్ని స్వీకరించిందని విన్నప్పుడు, పేతురును యోహానును వారి వద్దకు పంపారు.
