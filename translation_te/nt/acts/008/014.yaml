  source_fidelity: The draft accurately renders the temporal participle, Jerusalem-based apostles, Samaria as the metonymic singular subject, God's word, and the sending of Peter and John. The perfect force of δέδεκται is acceptably conveyed in Telugu through the completed-action form in the reported clause.
  naturalness: The sentence is generally natural modern Telugu. However, ‘వారి దగ్గరకు’ is more conversational than needed in this formal narrative register; ‘వారి వద్దకు’ is the more idiomatic and suitably formal expression here.
  terminology: ‘అపొస్తలులు,’ ‘సమరయ,’ ‘దేవుని వాక్యం,’ ‘పేతురు,’ and ‘యోహాను’ are appropriate established Telugu biblical terms. Retaining the singular place name ‘సమరయ’ correctly preserves the Greek metonymy without interpretively substituting ‘సమరయులు.’
  issues:
