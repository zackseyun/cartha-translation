id: ACT.8.14
reference: Acts 8:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ οἱ ἐν Ἱεροσολύμοις ἀπόστολοι ὅτι δέδεκται ἡ Σαμάρεια τὸν λόγον τοῦ θεοῦ, ἀπέστειλαν πρὸς ⸀αὐτοὺς Πέτρον καὶ Ἰωάννην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/014.yaml
  text: When the apostles in Jerusalem heard that Samaria had received the word of God, they sent Peter and John to them,
translation:
  language: te
  text: యెరూషలేములో ఉన్న అపొస్తలులు సమరయ దేవుని వాక్యాన్ని స్వీకరించిందని విన్నప్పుడు, పేతురును యోహానును వారి వద్దకు పంపారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: విన్నప్పుడు
  rationale: అనంతరం జరిగిన ప్రధాన క్రియకు ముందున్న సందర్భాన్ని తెలిపే ఏరిస్టు కృదంతాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా అందిస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది బలమైన వ్యతిరేకత కాకుండా కథన పురోగతిని సూచించే స్వల్ప అనుసంధాన పదం; తెలుగు వాక్య ప్రవాహంలో ప్రత్యేక అనుసంధాన పదం అవసరం లేదు.
- source_word: οἱ ἐν Ἱεροσολύμοις ἀπόστολοι
  choice: యెరూషలేములో ఉన్న అపొస్తలులు
  rationale: అపొస్తలులు యెరూషలేములో ఉన్నారనే స్థానార్థాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: δέδεκται
  choice: స్వీకరించిందని
  rationale: δέχομαι యొక్క స్వీకరణ భావాన్ని నిలుపుతుంది; సమరయ అనే ఏకవచన స్థలనామానికి అనుగుణంగా క్రియను ఏకవచనంలో ఉంచింది. పర్ఫెక్ట్ ఫలితభావం సందర్భంలో గ్రహించబడుతుంది.
- source_word: ἡ Σαμάρεια
  choice: సమరయ
  rationale: ప్రజలను సూచించే స్థలనామ రూపకాన్ని మూలంలోని విధంగానే నిలుపుతుంది; ‘సమరయులు’ అని వ్యాఖ్యానాత్మకంగా మార్చలేదు.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: దేవుని వాక్యాన్ని
  rationale: ‘దేవుని వాక్యం’ అనే పరిచిత బైబిలు నుడికారాన్ని, దాని ధార్మిక ప్రతిధ్వనిని నిలుపుతుంది; ఇక్కడ ప్రకటించబడిన సందేశం ఉద్దేశితం.
- source_word: ἀπέστειλαν
  choice: పంపారు
  rationale: సాధారణ ఏరిస్టు ప్రధాన క్రియకు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: πρὸς αὐτούς
  choice: వారి దగ్గరకు
  rationale: ముందు సమరయ అనే స్థలనామంతో సమష్టిగా సూచించబడిన ప్రజల వైపు పంపడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Πέτρον καὶ Ἰωάννην
  choice: పేతురును యోహానును
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాలను, కర్మవిభక్తితో, ఉపయోగిస్తుంది.
theological_decisions:
- issue: ‘సమరయ’ అనే స్థలనామం ప్రజలను సమష్టిగా సూచించడం
  choice: సమరయ దేవుని వాక్యాన్ని స్వీకరించింది
  alternative: సమరయులు దేవుని వాక్యాన్ని స్వీకరించారు
  rationale: గ్రీకు మూలం ప్రాంతనామాన్నే ఏకవచన కర్తగా వాడుతుంది. దాన్ని నిలుపుకోవడం మూలంలోని రూపకాన్ని, దాని స్వల్ప అస్పష్టతను కాపాడుతుంది; సందర్భం అక్కడి ప్రజలే ఉద్దేశమని తెలియజేస్తుంది.
- issue: λόγος ను ‘వాక్యం’గా అనువదించడం
  choice: దేవుని వాక్యం
  alternative: దేవుని సందేశం
  rationale: ‘వాక్యం’ మూలపదానికి దగ్గరగా ఉండి, పరిచితమైన బైబిలు ధార్మిక నుడికారాన్ని నిలుపుతుంది; ‘సందేశం’ అర్థాన్ని స్పష్టం చేసినా కొంత వ్యాఖ్యానాత్మకం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. మూలంలోని స్థలనామ రూపకం నిలుపబడింది. పాఠ్యంలో పాదటిప్పణులు లేవు.
