id: ACT.8.30
reference: Acts 8:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: προσδραμὼν δὲ ὁ Φίλιππος ἤκουσεν αὐτοῦ ἀναγινώσκοντος ⸂Ἠσαΐαν τὸν προφήτην⸃ καὶ εἶπεν· Ἆρά γε γινώσκεις ἃ ἀναγινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/030.yaml
  text: So Philip ran up and heard him reading Isaiah the prophet[a], and said, “Do you really understand what you are reading?”
translation:
  language: te
  text: అప్పుడు ఫిలిప్పు పరుగెత్తుకుంటూ అతని దగ్గరకు వెళ్లి, అతడు యెషయా ప్రవక్త గ్రంథాన్ని చదువుతుండగా విన్నాడు. ఫిలిప్పు, “నువ్వు చదువుతున్నది నీకు నిజంగా అర్థమవుతోందా?”[a] అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నువ్వు చదువుతున్నది నీకు అసలు అర్థమవుతోందా?” గ్రీకు ప్రశ్నార్థక నిపాతాలు ఫిలిప్పు ప్రశ్నకు ప్రత్యేక బలాన్ని ఇస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδραμὼν
  choice: పరుగెత్తుకుంటూ అతని దగ్గరకు వెళ్లి
  rationale: ఈ భూతకాల కృదంతం రథం వైపు వేగంగా కదలడాన్ని సూచిస్తుంది. ఈ ప్రయోగం ఆ చలనంలోని సజీవతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ δέ కథన పురోగతిని సూచిస్తుంది; ‘అప్పుడు’ సందర్భంలోని తదుపరి చర్యను సహజంగా కలుపుతుంది.
- source_word: ἤκουσεν αὐτοῦ ἀναγινώσκοντος
  choice: అతడు ... చదువుతుండగా విన్నాడు
  rationale: ἀκούωతో వచ్చిన షష్ఠీ విభక్తి కృదంత నిర్మాణం, ఆ వ్యక్తి చదువుతున్న సమయంలో ఫిలిప్పు విన్నాడని తెలియజేస్తుంది. గట్టిగా చదివాడని గ్రీకు పాఠం స్పష్టంగా చెప్పదు కాబట్టి దాన్ని చేర్చలేదు.
- source_word: Ἠσαΐαν τὸν προφήτην
  choice: యెషయా ప్రవక్త గ్రంథాన్ని
  rationale: ‘యెషయా ప్రవక్త’ అనే భావాన్ని నిలుపుతూ, తెలుగులో ఒక వ్యక్తినే చదువుతున్నట్టు వినిపించకుండా సహజార్థం కోసం ‘గ్రంథాన్ని’ స్పష్టీకరణగా చేర్చబడింది.
- source_word: εἶπεν
  choice: అని అడిగాడు
  rationale: λέγω ప్రాథమికంగా ‘చెప్పు’ అయినప్పటికీ, ఇక్కడ ప్రత్యక్ష వాక్యం ప్రశ్న కావడంతో తెలుగు కథనంలో ‘అడిగాడు’ సహజమైన మాటల క్రియ.
- source_word: Ἆρά γε
  choice: నిజంగా ... దా
  rationale: ఈ రెండు ప్రశ్నార్థక నిపాతాలు ప్రశ్నకు ప్రత్యేక బలాన్ని ఇస్తాయి. ‘నిజంగా’ ఆ పరిశీలనాత్మక బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γινώσκεις
  choice: అర్థమవుతోందా
  rationale: ఇక్కడ భావం చదివిన విషయాన్ని తెలుసుకోవడం మాత్రమే కాక, దాని అర్థాన్ని గ్రహించడం.
- source_word: ἃ ἀναγινώσκεις
  choice: నువ్వు చదువుతున్నది
  rationale: సంబంధవాచక సర్వనామం చదువుతున్న విషయాన్ని సూచిస్తుంది; వర్తమాన కొనసాగింపు భావాన్ని ‘చదువుతున్నది’ నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా ‘యెషయా ప్రవక్త గ్రంథాన్ని’ అని స్పష్టీకరించబడింది; మూలంలో లేని ‘బిగ్గరగా’ అనే భావాన్ని చేర్చలేదు. సంభాషణలో సందర్భానుకూలమైన సాధారణ ఏకవచన ‘నువ్వు’ వాడబడింది.
