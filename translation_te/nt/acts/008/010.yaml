source:
  edition: SBLGNT
  text: ᾧ προσεῖχον ⸀πάντες ἀπὸ μικροῦ ἕως μεγάλου λέγοντες· Οὗτός ἐστιν ἡ Δύναμις τοῦ θεοῦ ἡ ⸀καλουμένη Μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/010.yaml
  text: They all paid attention to him[a], from the least to the greatest, saying, “This man is the power of God that is called Great.”
translation:
  language: te
  text: చిన్నవారి నుంచి గొప్పవారి వరకు అందరూ అతనికి శ్రద్ధగా చెవియొగ్గుతూ, “ఇతడే గొప్పది అని పిలువబడే దేవుని శక్తి” అని చెప్పేవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని మహాశక్తి అని పిలువబడేది ఇతడే.” గ్రీకు పదబంధాన్ని ఒక బిరుదులా మరింత సంక్షిప్తంగా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ᾧ προσεῖχον
  choice: అతని పట్ల శ్రద్ధ చూపుతూ
  rationale: προσέχω ఇక్కడ సీమోను వైపు తమ దృష్టిని, శ్రద్ధను నిలిపారని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం భక్తి లేదా విధేయత అనే అదనపు భావాన్ని చేర్చకుండా ఆ దిశానిర్దేశిత శ్రద్ధను సహజంగా తెలియజేస్తుంది.
- source_word: πάντες
  choice: అందరూ
  rationale: మూలంలోని సమగ్ర బహువచన భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: చిన్నవారి నుంచి గొప్పవారి వరకు
  rationale: సమాజంలోని అన్ని స్థాయుల వారినీ సూచించే మూలభాషా సమగ్ర నుడికారాన్ని తెలుగు రూపంలో నిలుపుతుంది.
- source_word: λέγοντες
  choice: అని చెప్పేవారు
  rationale: ప్రధాన క్రియతో సమకాలికంగా కొనసాగిన మాటలను సహజమైన తెలుగు వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: Οὗτός
  choice: ఇతడే
  rationale: సీమోను అనే వ్యక్తిని చూపిస్తూ చేసిన ఉద్ఘాటనను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἡ Δύναμις τοῦ θεοῦ
  choice: దేవుని శక్తి
  rationale: నిర్దిష్టమైన, బిరుదును పోలిన మూల నిర్మాణాన్ని అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: ἡ καλουμένη Μεγάλη
  choice: ‘గొప్పది’ అని పిలువబడే
  rationale: καλουμένη లోని పేరు పెట్టబడే భావాన్ని, అలాగే Μεγάλη అనే విశేషణం ‘శక్తి’ని సూచిస్తున్న సంబంధాన్ని నిలుపుతుంది; దీనిని ముందుగానే స్థిరమైన అధికారిక బిరుదుగా నిర్ణయించదు.
- source_word: Μεγάλη
  choice: గొప్పది
  rationale: మూలంలోని ‘గొప్ప’ అనే విశేషణార్థాన్ని కాపాడుతుంది. తెలుగు వాక్యంలో ఇది ‘శక్తి’ని తిరిగి సూచించేందుకు ‘గొప్పది’గా రూపుదిద్దుకుంది.
theological_decisions:
- issue: జనసమూహం పలికిన మాటను అధికారిక దైవబిరుదుగా అనువదించాలా, లేక సీమోను గురించి వారు చేసిన వాదనగా అనువదించాలా
  choice: “ఇతడే ‘గొప్పది’ అని పిలువబడే దేవుని శక్తి” అని జనసమూహం చేసిన వాదనగానే ఉంచడం
  alternative: “ఇతడే దేవుని మహాశక్తి” లేదా “దేవుని మహాశక్తి అని పిలువబడేది ఇతడే”
  rationale: మూలవాక్యం సీమోను గురించి ప్రజలు చెప్పిన మాటను నివేదిస్తుంది; కథకుడు ఆ వాదనను సమర్థిస్తున్నట్లు అనిపించకూడదు. ప్రధాన పాఠం పేరుపెట్టబడే భావాన్ని స్పష్టంగా ఉంచగా, సంక్షిప్త బిరుదు-రూపాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్య గౌరవాన్ని నిలుపుతూ రూపొందించబడింది. ‘అతని పట్ల శ్రద్ధ చూపుతూ’ అనేది పాతకాలపు ‘చెవియొగ్గి’ కంటే సహజంగా ఉంది. ఉద్ధరణలోని అసాధారణ బిరుదు-నిర్మాణాన్ని పూర్తిగా సాఫీ చేసి దాని అనిశ్చితిని తొలగించకుండా ఉంచాం.
