id: ACT.8.12
reference: Acts 8:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐπίστευσαν τῷ Φιλίππῳ εὐαγγελιζομένῳ ⸀περὶ τῆς βασιλείας τοῦ θεοῦ καὶ τοῦ ὀνόματος Ἰησοῦ Χριστοῦ, ἐβαπτίζοντο ἄνδρες τε καὶ γυναῖκες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/012.yaml
  text: But when they believed Philip as he proclaimed the good news about the kingdom of God and the name of Jesus the Messiah[a], they were being baptized, both men and women.
translation:
  language: te
  text: అయితే, దేవుని రాజ్యం గురించీ మెస్సీయ అయిన యేసు పేరు గురించీ ఫిలిప్పు ప్రకటించిన శుభవార్తను వారు నమ్మినప్పుడు, పురుషులూ స్త్రీలూ బాప్తిస్మం పొందుతూ వచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు క్రీస్తు పేరు.” గ్రీకు Χριστός ఇక్కడ బిరుదు భావంలో ఉన్నందున ప్రధాన పాఠంలో “మెస్సీయ” అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: అయితే ... నమ్మినప్పుడు
  rationale: ὅτε యొక్క కాలసూచక భావాన్ని ‘నప్పుడు’తో, δέ సూచించే స్వల్ప కథన మలుపును ‘అయితే’తో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐπίστευσαν τῷ Φιλίππῳ
  choice: ఫిలిప్పు ప్రకటించిన శుభవార్తను వారు నమ్మినప్పుడు
  rationale: దత్తి విభక్తిలోని Φιλίππῳ, ఫిలిప్పును రక్షక విశ్వాసానికి వస్తువుగా కాక నమ్మదగిన సందేశకునిగా సూచిస్తుంది. తెలుగులో ‘ఫిలిప్పును నమ్మారు’ అనేది వ్యక్తిపట్ల విశ్వాసంగా అపార్థమయ్యే అవకాశం ఉన్నందున, సందర్భం స్పష్టం చేసే సందేశాన్ని నమ్మడం అనే సహజ నిర్మాణం ఎంచుకోబడింది.
- source_word: εὐαγγελιζομένῳ
  choice: ప్రకటించిన శుభవార్తను
  rationale: ఈ వర్తమాన కృదంతం ఫిలిప్పు శుభవార్త ప్రకటిస్తున్న సందర్భాన్ని తెలియజేస్తుంది; తెలుగు వాక్యనిర్మాణంలో దాని సందేశార్థాన్ని సహజంగా కలుపుతుంది.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: దేవుని రాజ్యం గురించి
  rationale: περί విషయాన్ని సూచిస్తుంది; βασιλεία యొక్క స్థిరమైన, పారదర్శక అనువాదంగా ‘రాజ్యం’ నిలుస్తుంది.
- source_word: τοῦ ὀνόματος Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ పేరును గురించి
  rationale: ὄνομα ను తొలగించకుండా ‘పేరు’గా ఉంచి, అది వ్యక్తి, అధికారం, వెల్లడైన గుర్తింపును సూచించగల విస్తృతిని కాపాడుతుంది. Χριστός ఇక్కడ బిరుదుగా ఉన్నందున ‘మెస్సీయ’గా ఇచ్చబడింది.
- source_word: ἐβαπτίζοντο
  choice: బాప్తిస్మం పొందుతూ వచ్చారు
  rationale: అసంపూర్ణ భూతకాల కర్మణి రూపం గతంలో కొనసాగిన లేదా వరుసగా జరిగిన కార్యాన్ని సూచిస్తుంది; ‘పొందుతూ వచ్చారు’ ఆ దృక్కోణాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἄνδρες τε καὶ γυναῖκες
  choice: పురుషులూ స్త్రీలూ
  rationale: τε ... καὶ రెండు వర్గాలనూ కలిపి పేర్కొంటుంది; ఈ రూపం సంక్షిప్తంగా, సహజంగా రెండింటినీ స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ లో Χριστοῦ అనువాదం
  choice: యేసు మెస్సీయ
  alternative: యేసు క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός పేరులాంటి రెండో భాగం కంటే అభిషిక్త రాజును సూచించే బిరుదు భావాన్ని కలిగి ఉంది. ‘మెస్సీయ’ ఆ బిరుదు భావాన్ని నిలుపుతుంది; ‘క్రీస్తు’ అనే సుపరిచిత ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
- issue: ἐπίστευσαν τῷ Φιλίππῳ యొక్క విశ్వాస సంబంధం
  choice: ఫిలిప్పు ప్రకటించిన శుభవార్తను నమ్మారు
  alternative: ఫిలిప్పును నమ్మారు
  rationale: ఫిలిప్పునే రక్షణాత్మక విశ్వాసానికి వస్తువుగా చూపకుండా, గ్రీకు దత్తి నిర్మాణంలోని సాక్షి/సందేశకుని నమ్మడం అనే భావాన్ని సందర్భానుగుణంగా వ్యక్తపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘శుభవార్త’, ‘దేవుని రాజ్యం’, ‘బాప్తిస్మం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉపయోగిస్తూ, గ్రీకు అసంపూర్ణ భూతకాలంలోని కొనసాగింపు భావాన్ని ‘పొందుతూ వచ్చారు’తో నిలుపుకుంది.
