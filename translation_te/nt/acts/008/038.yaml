id: ACT.8.38
reference: Acts 8:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐκέλευσεν στῆναι τὸ ἅρμα, καὶ κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος, καὶ ἐβάπτισεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/038.yaml
  text: And he ordered the chariot to stop[a], and both Philip and the eunuch went down into the water, and he baptized him.
translation:
  language: te
  text: అతడు రథాన్ని ఆపమని ఆజ్ఞాపించాడు. ఫిలిప్పు, నపుంసకుడు ఇద్దరూ నీళ్లలోకి[a] దిగారు. ఫిలిప్పు అతనికి బాప్తిస్మం ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీళ్లవద్దకు’; అయితే గ్రీకులోని ఉపసర్గ సాధారణంగా నీళ్లలోకి కదలికను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: ఆజ్ఞాపించాడు
  rationale: κέλευωలోని అధికారపూర్వక ఆదేశ భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: στῆναι τὸ ἅρμα
  choice: రథాన్ని ఆపమని
  rationale: వాహనాన్ని నిలిపివేయించడమే సందర్భార్థం; ‘ఆపమని’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: ἅρμα
  choice: రథం
  rationale: గ్రీకు పదానికి నేరమైన, సాంప్రదాయిక తెలుగు సమానం; కథనంలోని వాహనాన్ని తప్పుగా నిర్దిష్టం చేయదు.
- source_word: κατέβησαν
  choice: దిగారు
  rationale: καταβαίνωలోని కిందికి వెళ్లే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀμφότεροι
  choice: ఇద్దరూ
  rationale: ఇద్దరు వ్యక్తులూ కలిసి చేసిన చర్యను గ్రీకు వచనం ఉద్ఘాటించినట్లే స్పష్టంగా ఉంచుతుంది.
- source_word: εἰς τὸ ὕδωρ
  choice: నీళ్లలోకి
  rationale: εἰς సాధారణంగా లోపలికి కదలికను సూచిస్తుంది; ‘నీళ్లలోకి’ దాని దిశార్థాన్ని కాపాడుతుంది.
- source_word: ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος
  choice: ఫిలిప్పు, నపుంసకుడు
  rationale: ఇద్దరు పాల్గొన్నవారినీ స్పష్టంగా గుర్తిస్తుంది; ముందున్న ‘ఇద్దరూ’తో కలిసి గ్రీకు ఉద్ఘాటనను నిలుపుతుంది.
- source_word: εὐνοῦχος
  choice: నపుంసకుడు
  rationale: ఈ సందర్భంలో పదం యొక్క సాధారణ ప్రత్యక్ష అర్థాన్ని, కథనంలోని పదసంబంధ కొనసాగింపును కాపాడుతుంది; కేవలం ‘అధికారి’ అని మార్చి వివరాన్ని తొలగించదు.
- source_word: ἐβάπτισεν αὐτόν
  choice: అతనికి బాప్తిస్మం ఇచ్చాడు
  rationale: స్థిరపడిన తెలుగు క్రైస్తవ వాడుకను అనుసరిస్తూ చర్యను తెలుపుతుంది; బాప్తిస్మ విధానాన్ని అనువాదంలోనే నిర్ణయించదు.
theological_decisions:
- issue: బాప్తిస్మ విధానాన్ని ఈ వాక్యపు పదప్రయోగంతో నిర్ణయించాలా?
  choice: ‘నీళ్లలోకి దిగారు’, ‘బాప్తిస్మం ఇచ్చాడు’ అని మూలంలోని దిశార్థం మరియు క్రియను నిలుపడం
  alternative: βαπτίζωను ‘ముంచాడు’ అని అనువదించడం, లేదా εἰςను ‘నీళ్ల దగ్గరకు’ అని ప్రధాన పాఠ్యంలో మృదువుచేయడం
  rationale: ఇద్దరూ నీళ్లలోకి దిగారని, ఫిలిప్పు అతనికి బాప్తిస్మం ఇచ్చాడని గ్రీకు పాఠ్యం చెబుతుంది. అంతకుమించి బాప్తిస్మ విధానంపై ఒక సంఘపరమైన నిర్ధారణను అనువాదం చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘రథం’, ‘బాప్తిస్మం’ వంటి స్థిరపడిన పదాలను ఉంచి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సులభంగా తీర్చిదిద్దాం.
