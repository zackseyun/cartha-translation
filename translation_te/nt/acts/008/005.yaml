source:
  edition: SBLGNT
  text: Φίλιππος δὲ κατελθὼν εἰς ⸀τὴν πόλιν τῆς Σαμαρείας ἐκήρυσσεν αὐτοῖς τὸν χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/005.yaml
  text: Philip went down to the city of Samaria and proclaimed the Messiah to them[a][b].
translation:
  language: te
  text: ఫిలిప్పు సమరయ పట్టణానికి దిగివెళ్లి, వారికి మెస్సీయను ప్రకటించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమరయ ప్రాంతంలోని ఒక పట్టణానికి.” గ్రీకు పదబంధాన్ని సమరయ అనే ప్రాంతంలోని ఒక పట్టణాన్ని సూచించేదిగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: ప్రత్యేక పదంతో అనువదించలేదు
  rationale: ఇది కథనాన్ని ముందుకు నడిపించే స్వల్ప అనుసంధాన పదం. తెలుగులో ‘అప్పుడు’ అని చేరిస్తే మూలంలో లేని కాలసూచన బలపడుతుంది; వాక్యప్రవాహమే దాని పనిని సహజంగా మోస్తుంది.
- source_word: κατελθὼν
  choice: దిగివెళ్లి
  rationale: κατέρχομαι లోని దిగువ దిశ భావాన్ని నిలుపుతూ, ప్రధాన క్రియకు ముందున్న గ్రీకు అసమాపక క్రియను సహజమైన తెలుగు క్రియాశ్రేణిగా అందిస్తుంది.
- source_word: τὴν πόλιν τῆς Σαμαρείας
  choice: సమరయ పట్టణానికి
  rationale: గ్రీకులోని నిర్దిష్ట ఉపపదాన్ని గౌరవిస్తూ ‘సమరయ పట్టణం’ అనే నిర్దిష్ట భావాన్ని ఇస్తుంది. ఇది సమరయ ప్రాంతంలోని ఒక పట్టణమని కూడా అర్థం చేసుకునే అవకాశం ఉన్నందున ఆ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐκήρυσσεν
  choice: ప్రకటించాడు
  rationale: బహిరంగంగా అధికారపూర్వకంగా తెలియజేయడం అనే κηρύσσω భావాన్ని, కేవలం సంఘపరమైన పరిభాషకు పరిమితం కాకుండా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: αὐτοῖς
  choice: అక్కడివారికి
  rationale: ‘వారికి’ అనే శ్రోతల భావాన్ని స్పష్టంగా ఉంచుతూ, తెలుగులో దాని సూచిత సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τὸν χριστόν
  choice: మెస్సీయను
  rationale: ఇక్కడ Χριστός వ్యక్తిపేరులా కాక అభిషిక్తుడైన వాగ్దాన రాజు అనే బిరుదుగా పనిచేస్తుంది; అందువల్ల బిరుదు భావాన్ని ‘మెస్సీయ’గా నిలిపాం.
theological_decisions:
- issue: Χριστός పదానికి అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు / ఆ క్రీస్తు
  rationale: ప్రకటన సందర్భం మరియు నిర్దిష్ట ఉపపదం దీనిని బిరుదుగా చూపుతున్నాయి. ‘మెస్సీయ’ యూదుల నిరీక్షణ నేపథ్యాన్ని నిలుపుతుంది; ‘క్రీస్తు’ ఇక్కడ సాధారణంగా వ్యక్తిపేరులా వినిపించే అవకాశం ఉంది.
- issue: సమరయ అనే పదం పట్టణాన్నా ప్రాంతాన్నా సూచిస్తుంది
  choice: సమరయ పట్టణం అనే నిర్దిష్ట భావాన్ని ప్రధాన పాఠ్యంలో ఉంచాం
  alternative: సమరయ ప్రాంతంలోని ఒక పట్టణం
  rationale: ముద్రిత గ్రీకు పాఠ్యంలో πόλις ముందు నిర్దిష్ట ఉపపదం ఉంది. అయినా జన్యర్థక నిర్మాణం మరియు పాఠభేదం కారణంగా ప్రాంతంలోని అనిర్దిష్ట పట్టణం అనే అవగాహన సాధ్యమే; దానిని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడాం. ‘దిగివెళ్లి’ భౌగోళిక దిశను నిలుపుతుంది; ‘అక్కడివారికి’ శ్రోతలను సహజంగా గుర్తిస్తుంది. ‘సమరయ’ మరియు ‘మెస్సీయ’ రూపాలు సాధారణ తెలుగు బైబిలు వినియోగానికి అనుగుణంగా ఉన్నాయి.
