id: ACT.8.20
reference: Acts 8:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πέτρος δὲ εἶπεν πρὸς αὐτόν· Τὸ ἀργύριόν σου σὺν σοὶ εἴη εἰς ἀπώλειαν ὅτι τὴν δωρεὰν τοῦ θεοῦ ἐνόμισας διὰ χρημάτων κτᾶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/020.yaml
  text: But Peter said to him[a], “May your silver perish with you[b], because you thought you could acquire the gift of God with money.”
translation:
  language: te
  text: అయితే పేతురు అతనితో, “దేవుని వరాన్ని డబ్బుతో సంపాదించుకోవచ్చని[b] నువ్వు అనుకున్నావు కాబట్టి, నీ వెండి[a] నీతోపాటు నాశనమైపోవుగాక!” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “డబ్బు.” ఇక్కడి గ్రీకు పదానికి అక్షరార్థం “వెండి”; వెండిని డబ్బుగా ఉపయోగించినందున అది సాధారణంగా డబ్బును కూడా సూచించేది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “పొందవచ్చని” లేదా “కొనుక్కోవచ్చని.” దేవుని వరాన్ని డబ్బు చెల్లించి పొందగల వస్తువుగా సీమోను భావించాడనే అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριόν
  choice: వెండి
  rationale: మూలపదం అక్షరార్థంగా ‘వెండి’ లేదా ‘వెండి నాణేలు’ అని సూచిస్తుంది; సందర్భంలో అది డబ్బును సూచించినా, ‘వెండి’ అనే స్పష్టమైన రూపాన్ని నిలుపుతుంది. తరువాతి διὰ χρημάτων ను ‘డబ్బుతో’ అని అనువదించడం వల్ల మూలంలోని పదభేదం కూడా నిలుస్తుంది.
- source_word: σὺν σοὶ
  choice: నీతోపాటు
  rationale: సీమోను మరియు అతని వెండి రెండూ ఒకే వినాశన ప్రకటనలో కలిపి చెప్పబడుతున్న తీవ్రతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: εἴη εἰς ἀπώλειαν
  choice: నాశనమైపోవుగాక
  rationale: εἴη అనే optative రూపం కోరిక లేదా తీవ్ర శాపోక్తిని వ్యక్తపరుస్తుంది. ‘నాశనమైపోవుగాక’ దాని బలాన్ని నిలుపుతూ, మూలంలో స్పష్టంగా లేని నిత్యశిక్ష సంబంధిత భావాన్ని అదనంగా చేర్చదు.
- source_word: δωρεὰν
  choice: వరం
  rationale: దేవుడు ఉచితంగా ఇచ్చేదనే భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; కొనుగోలు చేయలేనిదనే వ్యత్యాసం వాక్యంలోనే స్పష్టంగా ఉంది.
- source_word: ἐνόμισας
  choice: నువ్వు అనుకున్నావు
  rationale: ఆలోచించడం లేదా అలా భావించడం అనే సాధారణ అర్థాన్ని నేరుగా, స్పష్టంగా అందిస్తుంది.
- source_word: διὰ χρημάτων
  choice: డబ్బుతో
  rationale: διά + genitive ఇక్కడ సాధనాన్ని సూచిస్తుంది; ‘డబ్బుతో’ ఆధునిక తెలుగులో సహజమైన ప్రయోగం.
- source_word: κτᾶσθαι
  choice: సంపాదించుకోవచ్చు
  rationale: ఏదైనా పొందడం లేదా స్వాధీనం చేసుకోవడం అనే భావాన్ని వ్యక్తపరుస్తుంది. ‘డబ్బుతో’ అనే పదబంధం చెల్లింపు ద్వారా పొందాలనే వాణిజ్య భావాన్ని సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వచనంలో సీమోను చేసిన అభ్యర్థనకు పేతురు ఇచ్చిన విరుద్ధమైన ప్రతిస్పందనను సూచిస్తుంది.
theological_decisions:
- issue: పేతురు సీమోను మరియు అతని వెండి గురించి పలికిన మాట యొక్క బలం
  choice: కోరిక/శాపోక్తి రూపంలోని వినాశన ప్రకటనగా ‘నీ వెండి నీతోపాటు నాశనమైపోవుగాక’
  alternative: వినాశనం సంభవిస్తుందని తెలిపే సాధారణ భవిష్యద్వాక్యంగా అనువదించడం; లేదా నిత్యనరక తీర్పును స్పష్టంగా ప్రకటించేలా మరింత బలపరచడం
  rationale: εἴη రూపం సాధారణ వాస్తవ ప్రకటనకంటే కోరిక లేదా శాపోక్తిని సూచిస్తుంది. ἀπώλεια వినాశనం/నష్టం అనే తీవ్ర భావాన్ని కలిగించినా, ఈ వచనం మాత్రమే నిత్యశిక్షను నిర్దిష్టంగా ప్రకటిస్తుందని అనువాదంలో నిర్ణయించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గంభీరమైన ప్రత్యక్ష సంభాషణను ఉపయోగించాం. పేతురు గద్దింపు తీవ్రతను ‘నాశనమైపోవుగాక’ నిలుపుతుంది; కానీ మూలంలో లేని నిర్దిష్ట నిత్యశిక్ష భావాన్ని చేర్చలేదు. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
