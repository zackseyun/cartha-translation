revisions:
- from: వారు అక్కడికి వచ్చి, వారు పరిశుద్ధాత్మను పొందాలని వారి కోసం ప్రార్థించారు.[a][b]
  to: వారు దిగివచ్చి, వారు పరిశుద్ధాత్మను పొందాలని వారికోసం ప్రార్థించారు.[a][b]
  rationale: The revision restores the explicit descent sense of καταβάντες with ‘దిగివచ్చి.’ It retains the aorist-participle sequence, the intercessory force of περὶ αὐτῶν, the purpose expressed by ὅπως λάβωσιν, and the contextual reference of πνεῦμα ἅγιον. Both existing footnote anchors are retained, and their wording is adjusted to match the corrected main text.
