  - severity: medium
    issue: ‘అక్కడికి వచ్చి’ does not preserve the directional sense of καταβάντες.
    rationale: καταβαίνω means ‘go/come down.’ While ‘అక్కడికి వచ్చి’ communicates arrival, it omits the descent that the Greek explicitly states. ‘దిగివచ్చి’ preserves the source wording without becoming unnatural.
  - severity: low
