  text: οἵτινες καταβάντες προσηύξαντο περὶ αὐτῶν ὅπως λάβωσιν πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/015.yaml
  text: who came down and prayed for them so that they might receive the Holy Spirit[a][b].
translation:
  language: te
  text: వారు దిగివచ్చి, వారు పరిశుద్ధాత్మను పొందాలని వారికోసం ప్రార్థించారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అక్కడికి వచ్చి’.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వారు దిగివచ్చిన తరువాత, వారికోసం ప్రార్థించారు’.
    reason: previous_rendering
lexical_decisions:
- source_word: οἵτινες
  choice: వారు
  rationale: మునుపటి వచనంలోని పేతురు, యోహానులను సూచించే సంబంధార్థక సర్వనామం. తెలుగు వాక్యప్రవాహంలో ‘వారు’ సహజంగా ఆ సంబంధాన్ని కొనసాగిస్తుంది.
- source_word: καταβάντες
  choice: అక్కడికి వచ్చి
  rationale: καταβαίνω యొక్క భూతకాల క్రియావిశేషణ రూపం ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచిస్తుంది. భౌగోళికంగా ‘దిగివచ్చి’ అనడం సాధ్యమైనా, ఆధునిక తెలుగులో ‘అక్కడికి వచ్చి’ సహజంగా ఉండి క్రమాన్ని నిలుపుతుంది.
- source_word: προσηύξαντο
  choice: ప్రార్థించారు
  rationale: προσεύχομαι యొక్క భూతకాల మధ్యమ రూపం; ఇక్కడ ప్రత్యేక మధ్యమార్థాన్ని తెలుగులో వ్యక్తం చేయాల్సిన అవసరం లేదు.
- source_word: περὶ αὐτῶν
  choice: వారి కోసం
  rationale: ప్రార్థన సందర్భంలో περί + షష్ఠీ విభక్తి వారి పక్షాన చేసిన విజ్ఞాపనను సూచిస్తుంది; ‘వారి కోసం’ సహజమైన తెలుగు.
- source_word: ὅπως
  choice: అని
  rationale: ప్రార్థన యొక్క ఉద్దేశించిన ఫలితాన్ని తెలుగులో ‘పొందాలని’ నిర్మాణంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λάβωσιν
  choice: పొందాలని
  rationale: ὅπως తరువాతి భూతకాల సబ్జంక్టివ్ ఉద్దేశాన్ని సూచిస్తుంది; ‘పొందాలని’ అనేది అనిశ్చితిని అదనంగా చేర్చకుండా ఆ ఉద్దేశార్థాన్ని అందిస్తుంది.
- source_word: πνεῦμα ἅγιον
  choice: పరిశుద్ధాత్మను
  rationale: అపొస్తలుల కార్యముల సందర్భంలో ఇది విశ్వాసులకు అనుగ్రహించబడే దైవిక పరిశుద్ధాత్మను సూచిస్తుంది; తెలుగు క్రైస్తవ వాడుకలో ‘పరిశుద్ధాత్మ’ సహజమైన, గౌరవప్రదమైన పదం.
theological_decisions:
- issue: πνεῦμα ἅγιον సాధారణ పవిత్ర ఆత్మను సూచిస్తుందా, లేక దైవిక పరిశుద్ధాత్మను సూచిస్తుందా
  choice: పరిశుద్ధాత్మను
  alternative: ఒక పవిత్ర ఆత్మను
  rationale: అపొస్తలుల కార్యములలోని ఈ కథన సందర్భం వాగ్దానం చేయబడి విశ్వాసులకు అనుగ్రహించబడే దైవిక ఆత్మను సూచిస్తుంది. ‘పరిశుద్ధాత్మ’ అనడం పాఠ్యానికి మించిన సిద్ధాంత వివరణను జోడించకుండా ఆ సందర్భార్థాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు భూతకాల క్రియావిశేషణంలోని ముందస్తు చర్యను ప్రధాన పాఠ్యంలో సముచ్చయ నిర్మాణంతో, ప్రత్యామ్నాయ కాలసంబంధ అర్థాన్ని పాదటిప్పణుల్లో నిలిపాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
