revisions:
- from: కాబట్టి వారు ప్రభువు వాక్యాన్ని గంభీరంగా సాక్ష్యమిచ్చి ప్రకటించిన తరువాత, యెరూషలేముకు తిరిగి వెళ్తూ, సమరయుల అనేక గ్రామాల్లో సువార్త ప్రకటిస్తూ ఉన్నారు.
  to: కాబట్టి వారు గంభీరంగా సాక్ష్యమిచ్చి, ప్రభువు వాక్యాన్ని ప్రకటించిన తరువాత, యెరూషలేముకు తిరిగి వెళ్తూనే సమరయుల అనేక గ్రామాల్లో సువార్తను ప్రకటిస్తూ ఉన్నారు.
