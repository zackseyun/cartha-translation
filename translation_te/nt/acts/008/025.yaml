id: ACT.8.25
reference: Acts 8:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διαμαρτυράμενοι καὶ λαλήσαντες τὸν λόγον τοῦ κυρίου ⸀ὑπέστρεφον εἰς ⸀Ἱεροσόλυμα, πολλάς τε κώμας τῶν Σαμαριτῶν ⸀εὐηγγελίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/025.yaml
  text: So[a], after they had solemnly testified and spoken the word of the Lord, they were returning to Jerusalem[b], and were proclaiming the good news in many Samaritan villages.
translation:
  language: te
  text: కాబట్టి వారు గంభీరంగా సాక్ష్యమిచ్చి, ప్రభువు వాక్యాన్ని ప్రకటించిన తరువాత, యెరూషలేముకు తిరిగి వెళ్తూనే సమరయుల అనేక గ్రామాల్లో సువార్తను ప్రకటిస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαμαρτυράμενοι
  choice: గంభీరంగా సాక్ష్యమిచ్చి
  rationale: క్రియలోని బలమైన, గంభీరమైన సాక్ష్యార్థాన్ని నిలుపుతుంది; సందర్భం స్పష్టంగా చెప్పని ‘హెచ్చరించారు’ అనే సంకుచిత భావాన్ని చేర్చదు.
- source_word: λαλήσαντες
  choice: ప్రకటించిన
  rationale: ‘ప్రభువు వాక్యం’ అనే ప్రత్యక్ష కర్మతో సహజమైన ఆధునిక తెలుగు కోసం ‘మాట్లాడిన’ కంటే ‘ప్రకటించిన’ను ఎంచుకున్నాం; సందేశాన్ని తెలియజేయడమనే భావాన్ని కాపాడుతుంది.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: ప్రభువు వాక్యాన్ని
  rationale: λόγος యొక్క సాంప్రదాయికమైనదీ, ఈ ప్రకటన సందర్భంలో స్పష్టమైనదీ అయిన ‘వాక్యం’ను నిలుపుతుంది; κυρίου ను ‘ప్రభువు’గా అనువదించింది.
- source_word: ὑπέστρεφον
  choice: తిరిగి వెళ్తూ
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న చర్యను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ἱεροσόλυμα
  choice: యెరూషలేముకు
  rationale: స్థలనామానికి ప్రామాణిక తెలుగు బైబిలు రూపం.
- source_word: πολλάς τε κώμας τῶν Σαμαριτῶν
  choice: సమరయుల అనేక గ్రామాల్లో
  rationale: గ్రామాలు సమరయులకు చెందినవి లేదా వారు నివసించేవి అనే సంబంధాన్ని స్పష్టంగా ఉంచుతూ సహజమైన తెలుగు నిర్మాణాన్ని ఇస్తుంది.
- source_word: εὐηγγελίζοντο
  choice: సువార్త ప్రకటిస్తూ ఉన్నారు
  rationale: కొనసాగుతున్న చర్యను నిలుపుతూ, ecclesiastical jargon‌కు పరిమితం కాకుండా సాధారణ పాఠకులకు స్పష్టమైన రూపాన్ని ఇస్తుంది.
theological_decisions:
- issue: అవ్యక్త బహువచన కర్త ఎవరు?
  choice: ‘వారు’ అని మాత్రమే ఉంచడం
  alternative: ‘పేతురు, యోహాను’ అని స్పష్టంగా చేర్చడం
  rationale: సమీప సందర్భంలో పేతురు, యోహాను సూచించబడుతున్నప్పటికీ, ఈ వాక్యంలోని గ్రీకు పాఠం పేర్లు చెప్పకుండా బహువచన కర్తను మాత్రమే సూచిస్తుంది. అందువల్ల అనువాదం పేర్లను చేర్చదు.
- issue: ప్రభువు అనే పదానికి నిర్దిష్ట సూచితుడు
  choice: ‘ప్రభువు’ అనే మూలపాఠ రూపాన్ని నిలుపడం
  alternative: ‘యేసు ప్రభువు’ అని స్పష్టీకరించడం
  rationale: సందర్భం సూచనను అందించినా, మూలపాఠం ఇక్కడ పేరు చేర్చదు; కాబట్టి ఉన్నంత theological resonance‌ను నిలుపుతూ అతిగా నిర్దిష్టం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. రెండు imperfect క్రియల సమకాలీన/కొనసాగుతున్న భావాన్ని ‘తిరిగి వెళ్తూ … ప్రకటిస్తూ ఉన్నారు’ అనే నిర్మాణంతో వ్యక్తం చేసింది. గ్రీకులో పాఠాంతర సూచనలు ఉన్నప్పటికీ, అందించిన వాక్యార్థాన్ని ప్రభావితం చేసే స్పష్టమైన ప్రత్యామ్నాయ పఠనం ఇక్కడ ఇవ్వబడలేదు; అందువల్ల నిరాధారమైన పాదటిప్పణులు చేర్చలేదు.
