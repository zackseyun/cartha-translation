id: ACT.8.40
reference: Acts 8:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον, καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάρειαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/040.yaml
  text: But Philip was found at Azotus[a], and as he passed through, he was proclaiming the good news to all the cities until he came to Caesarea.
translation:
  language: te
  text: అయితే ఫిలిప్పు అజోతులో కనుగొనబడ్డాడు[a]. అతడు వెళ్తూ, కైసరయకు చేరే వరకు పట్టణాలన్నిటిలో శుభవార్త ప్రకటిస్తూ వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అజోతులో ప్రత్యక్షమయ్యాడు.” గ్రీకు పదానికి అక్షరార్థంగా “అజోతులో కనుగొనబడ్డాడు” అని అర్థం. సందర్భంలో దేవుడు అతణ్ణి అకస్మాత్తుగా అక్కడికి చేర్చాడనే భావం ఉండవచ్చు; అయితే ఈ మాట దాన్ని స్పష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వాక్యంలో ఆత్మ ఫిలిప్పును తీసుకుపోయిన సంఘటన నుంచి స్వల్ప కథన మార్పును, వ్యత్యాసాన్ని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: εὑρέθη
  choice: కనిపించాడు
  rationale: గ్రీకు నిష్క్రియారూపంలోని ‘కనుగొనబడ్డాడు/కనిపించాడు’ అనే భావాన్ని సహజమైన తెలుగులో ఇస్తుంది; అకస్మాత్తుగా అక్కడికి చేరడం దైవిక కార్యమని సందర్భం సూచించినా, ప్రధాన పాఠం దాన్ని అదనంగా స్పష్టీకరించదు.
- source_word: εἰς Ἄζωτον
  choice: అజోతులో
  rationale: ఇక్కడ εἰς ఫిలిప్పు చేరిన తరువాత ఉన్న స్థలాన్ని సూచిస్తుంది; తెలుగులో స్థానార్థకమైన ‘అజోతులో’ సహజంగా ఉంటుంది.
- source_word: διερχόμενος
  choice: ఆ ప్రాంతం గుండా వెళ్తూ
  rationale: ప్రధాన క్రియతో సమకాలంలో సాగిన ప్రయాణాన్ని వర్తమాన క్రియావిశేషణ రూపంలో తెలియజేస్తుంది; ‘ఆ ప్రాంతం’ అనేది మార్గంలోని పట్టణాల సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: εὐηγγελίζετο
  choice: శుభవార్త ప్రకటించాడు
  rationale: εὐαγγελίζω యొక్క అర్థాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా, మతపరమైన సాంకేతిక పదజాలం లేకుండా అందిస్తుంది. ప్రయాణమంతటా కొనసాగిన చర్యను ‘వెళ్తూ’ మరియు ‘చేరుకునే వరకు’ అనే నిర్మాణం తెలియజేస్తాయి.
- source_word: τὰς πόλεις πάσας
  choice: పట్టణాలన్నిటిలో
  rationale: అతని ప్రయాణమార్గంలో ఉన్న పట్టణాలన్నిటినీ సమష్టిగా, పంపిణీ భావంతో సూచిస్తుంది.
- source_word: ἕως τοῦ ἐλθεῖν αὐτὸν
  choice: చేరుకునే వరకు
  rationale: కొనసాగిన ప్రకటన కార్యానికి ముగింపు బిందువును సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: εἰς Καισάρειαν
  choice: కైసరయకు
  rationale: εἰς ఇక్కడ గమ్యస్థానాన్ని సూచిస్తుంది; ‘కైసరయకు’ ఆ దిశా భావాన్ని స్పష్టంగా ఇస్తుంది.
theological_decisions:
- issue: εὑρέθη అనే పదం ఫిలిప్పు అద్భుతరీతిగా ప్రత్యక్షమయ్యాడని స్పష్టంగా అర్థం చెప్పాలా?
  choice: ప్రధాన పాఠంలో తటస్థమైన ‘కనిపించాడు’ అనే రూపాన్ని ఉంచడం
  alternative: ‘అజోతులో ప్రత్యక్షమయ్యాడు’
  rationale: మునుపటి సందర్భం దైవికంగా అకస్మాత్తుగా స్థలం మారడాన్ని బలంగా సూచిస్తుంది; అయితే గ్రీకు పదం స్వయంగా ‘కనిపించాడు/కనుగొనబడ్డాడు’ అని మాత్రమే చెబుతుంది. అందువల్ల అద్భుత స్వభావాన్ని ప్రధాన పాఠంలో అదనంగా నిర్ధారించకుండా, మూలంలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘శుభవార్త ప్రకటించాడు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఎంపిక చేయబడింది; ‘సువార్త ప్రకటించాడు’ అనే పరిచితమైన మతపరమైన పదబంధం కంటే మూల క్రియ యొక్క సాధారణ అర్థాన్ని ముందుకు తెస్తుంది.
