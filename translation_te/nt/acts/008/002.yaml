source:
  edition: SBLGNT
  text: συνεκόμισαν δὲ τὸν Στέφανον ἄνδρες εὐλαβεῖς καὶ ⸀ἐποίησαν κοπετὸν μέγαν ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/002.yaml
  text: But devout men buried Stephen and made great lamentation over him[a][b].
translation:
  language: te
  text: అయితే భక్తిపరులైన పురుషులు స్తెఫనును సమాధి చేసి[a], అతనిని గూర్చి ఎంతో విలపించారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘స్తెఫను మృతదేహాన్ని అంత్యక్రియలకు సిద్ధం చేసి’ లేదా ‘సమాధి చేయడానికి తీసుకెళ్లి’; గ్రీకు క్రియ మృతదేహాన్ని తీసుకెళ్లడం లేదా దానికి అంత్యక్రియలు నిర్వహించడం అనే అంశాన్ని కూడా నొక్కిచెప్పగలదు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘ఎంతో విలపించారు’ అనేది కేవలం అంతరంగ దుఃఖాన్నే కాక, వినిపించేలా మరియు బహిరంగంగా దుఃఖాన్ని వ్యక్తం చేయడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκόμισαν
  choice: సమాధి చేసి
  rationale: ఈ సందర్భంలో ఈ క్రియ స్తెఫను మృతదేహాన్ని తీసుకెళ్లడం, అంత్యక్రియలకు సిద్ధం చేయడం, సమాధి చేయడం అనే భావపరిధిని కలిగి ఉంది. ప్రధాన పాఠంలో సహజమైన తెలుగు కోసం కార్యం యొక్క అంతిమ ఫలితమైన ‘సమాధి చేసి’ అని ఇచ్చి, విస్తృత భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: δέ
  choice: అయితే
  rationale: ముందటి వాక్యంలోని స్తెఫను మరణవివరణ నుంచి భక్తిపరుల చర్యవైపు వచ్చే స్వల్ప కథన మలుపును సూచిస్తుంది; ‘అయితే’ ఆ మార్పును సహజంగా తెలియజేస్తుంది.
- source_word: ἄνδρες εὐλαβεῖς
  choice: భక్తిపరులైన కొందరు పురుషులు
  rationale: ἄνδρες యొక్క పురుషలింగ సూచనను ‘పురుషులు’తో నిలిపి, εὐλαβεῖς లోని భక్తి, దైవభీతి, గౌరవభావాన్ని ఆధునిక తెలుగులో ‘భక్తిపరులు’గా వ్యక్తం చేశాం. తెలుగు వాక్య సహజత్వం కోసం అనిర్దిష్ట బహువచన భావాన్ని ‘కొందరు’తో తెలిపాం.
- source_word: ἐποίησαν
  choice: విలపించారు
  rationale: ἐποίησαν κοπετόν అనే గ్రీకు పదబంధాన్ని తెలుగులో పదశః ‘విలాపం చేశారు’ అనకుండా, సహజమైన క్రియారూపమైన ‘విలపించారు’గా అనువదించాం.
- source_word: κοπετὸν μέγαν
  choice: ఎంతో విలపించారు
  rationale: κοπετός బహిరంగంగా, వినిపించే విధంగా వ్యక్తమయ్యే దుఃఖవిలాపాన్ని సూచించగలదు; μέγαν దాని తీవ్రతను తెలియజేస్తుంది. ‘ఎంతో విలపించారు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ తీవ్రతను నిలుపుతుంది.
- source_word: ἐπ’ αὐτῷ
  choice: అతని కోసం
  rationale: విలాప సందర్భంలో ఈ పదబంధం స్తెఫను విషయంగా లేదా అతని మరణాన్ని బట్టి దుఃఖించడం అనే భావాన్ని ఇస్తుంది. ‘అతని కోసం’ తెలుగులో సహజంగా ఉంది; ‘అతనిని గూర్చి’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
