translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలిని ఉపయోగించాం. ‘భక్తిపరులు,’ ‘సమాధి చేసి,’ ‘విలపించారు’ వంటి సాధారణంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం; మూలంలోని శరీరాన్ని నిర్వహించడం/సమాధి చేయడం అనే పదార్థ విస్తృతిని పాదటిప్పణిలో నిలిపాం.
