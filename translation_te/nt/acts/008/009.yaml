id: ACT.8.9
reference: Acts 8:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀνὴρ δέ τις ὀνόματι Σίμων προϋπῆρχεν ἐν τῇ πόλει μαγεύων καὶ ⸀ἐξιστάνων τὸ ἔθνος τῆς Σαμαρείας, λέγων εἶναί τινα ἑαυτὸν μέγαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/009.yaml
  text: A certain man named Simon had previously been in the city practicing magic and astonishing the people of Samaria[a], saying that he himself was someone great[b],
translation:
  language: te
  text: సీమోను అనే ఒక మనిషి అంతకుముందు నుంచే ఆ పట్టణంలో మాంత్రిక విద్యలు చేస్తూ[a], సమరయ ప్రజలను ఆశ్చర్యపరుస్తూ, తాను ఎవరో గొప్పవాడినని[b] చెప్పుకుంటూ ఉండేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మంత్రవిద్యను ఆచరిస్తూ.” గ్రీకు క్రియ మాంత్రిక కళల్లో నిమగ్నమై ఉండడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తాను గొప్ప వ్యక్తినని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: ఒక మనిషి
  rationale: Ἀνήρ పురుషుణ్ణి సూచిస్తుంది; τις అనిర్దిష్టతను ‘ఒక’ ద్వారా తెలియజేస్తుంది. δέ యొక్క స్వల్ప సంధాన భావాన్ని తెలుగులో సహజమైన వాక్యప్రవాహంలో ప్రత్యేక పదం లేకుండానే ఉంచాం.
- source_word: ὀνόματι Σίμων
  choice: సీమోను అనే
  rationale: పేరును అనువదించకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించి, ὀνόματι నిర్మాణాన్ని సహజమైన తెలుగు ప్రయోగంతో తెలిపాం.
- source_word: προϋπῆρχεν
  choice: అంతకుముందు నుంచే ... ఉండేవాడు
  rationale: ఇప్పుడే వర్ణించిన సంఘటనలకు ముందే అతడు అక్కడ ఉండి ఈ పనులు చేస్తుండేవాడనే పూర్వకాల, కొనసాగుతున్న భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ πόλει
  choice: ఆ పట్టణంలో
  rationale: నేపథ్యంలో ముందుగా ప్రస్తావించిన పట్టణాన్ని గ్రీకు నిర్దిష్ట ఉపపదం సూచిస్తున్నందున ‘ఆ పట్టణంలో’ అని అనువదించాం.
- source_word: μαγεύων
  choice: మంత్రవిద్యను అభ్యసిస్తూ
  rationale: మాంత్రిక కళల్లో నిమగ్నమై ఉండడాన్ని తెలిపే గ్రీకు క్రియకు ఇది స్పష్టమైన, ఆధునిక తెలుగు రూపం; దాని మూలం లేదా శక్తి గురించి వచనం చెప్పనిదేదీ చేర్చదు.
- source_word: ἐξιστάνων
  choice: ఆశ్చర్యపరుస్తూ
  rationale: ప్రజలను విస్మయానికి గురిచేస్తున్న కొనసాగుతున్న చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: τὸ ἔθνος τῆς Σαμαρείας
  choice: సమరయ ప్రజలను
  rationale: ἔθνος ఇక్కడ రాజకీయ ‘దేశం’ కంటే సమరయ ప్రాంతపు ప్రజాసమూహాన్ని సూచిస్తుంది.
- source_word: λέγων
  choice: చెప్పుకుంటూ
  rationale: సీమోను తన గురించి తానే పలుకుతున్నాడనే భావాన్ని తెలుగులో సహజంగా తెలుపుతుంది; ‘ప్రకటిస్తూ’ లేదా ‘దావా చేస్తూ’ వంటి అదనపు తీర్పును చేర్చదు.
- source_word: εἶναί τινα ἑαυτὸν μέγαν
  choice: తాను ఎవరో గొప్పవాడినని
  rationale: ἑαυτόν లోని స్వీయ సూచనను ‘తాను’తో, τινα μέγαν లోని ‘గొప్పవాడైన ఎవరో ఒకడు’ అనే స్వీయ ప్రాముఖ్యత భావాన్ని సహజమైన తెలుగు నుడికారంతో నిలిపాం.
theological_decisions:
- issue: సీమోను చేస్తున్న మాంత్రిక కార్యాల స్వభావం
  choice: మంత్రవిద్యను అభ్యసిస్తూ
  alternative: చేతబడులు చేస్తూ / మాంత్రిక క్రియలు చేస్తూ
  rationale: వచనం అతడు మాంత్రిక కళల్లో నిమగ్నమయ్యాడని చెబుతుంది; అయితే వాటి శక్తి దయ్యాలవల్ల వచ్చిందా, మోసమా అనే విషయాన్ని ఈ వచనం నిర్ధారించదు. అందువల్ల ఆ అనిశ్చితిని పరిష్కరించే సిద్ధాంతపరమైన పదాలను చేర్చలేదు.
- issue: సీమోను తన గొప్పతనాన్ని చెప్పుకోవడం
  choice: తాను ఎవరో గొప్పవాడినని
  alternative: తాను గొప్ప వ్యక్తినని
  rationale: గ్రీకు వాక్యంలోని స్వీయ గొప్పతన ప్రకటనను నిలిపి, అతడు ఏ ప్రత్యేక బిరుదును తనకు ఆపాదించుకున్నాడో వచనం చెప్పనందున దాన్ని నిర్దిష్టీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని వాడాం. గ్రీకు వాక్యంలోని ప్రధాన క్రియ, దానితో కూడిన కొనసాగుతున్న క్రియల సంబంధాన్ని తెలుగులో ‘ఉండేవాడు’ నిర్మాణంతో సహజంగా వ్యక్తం చేశాం.
