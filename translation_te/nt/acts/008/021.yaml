  text: οὐκ ἔστιν σοι μερὶς οὐδὲ κλῆρος ἐν τῷ λόγῳ τούτῳ, ἡ γὰρ καρδία σου οὐκ ἔστιν εὐθεῖα ⸀ἔναντι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/021.yaml
  text: You have neither part nor share in this matter, because your heart is not right before God.
translation:
  language: te
  text: ఈ విషయంలో నీకు భాగమూ లేదు, వాటా కూడా లేదు; ఎందుకంటే నీ హృదయం దేవుని ఎదుట యథార్థమైనది కాదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μερὶς οὐδὲ κλῆρος
  choice: భాగమూ లేదు, వాటా కూడా లేదు
  rationale: దగ్గర అర్థాలున్న రెండు గ్రీకు పదాల సంయుక్త బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; κλῆρος యొక్క మూలార్థమైన ‘చీటి’ని ఇక్కడ సందర్భానుసారంగా ‘వాటా’గా వ్యక్తపరుస్తుంది.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: ఈ విషయంలో
  rationale: λόγος ఇక్కడ ‘మాట’ కంటే సందర్భంలోని కార్యం లేదా విషయం అనే భావాన్ని సూచిస్తుంది.
- source_word: ἡ καρδία σου
  choice: నీ హృదయం
  rationale: అంతరంగ ఉద్దేశం, వైఖరి అనే బైబిలీయ రూపకాన్ని నిలుపుతుంది.
- source_word: εὐθεῖα
  choice: యథార్థంగా
  rationale: ‘నేరుగా/సూటిగా’ అనే రూపకార్థాన్ని దేవుని ఎదుట అంతరంగ సమగ్రత, నిజాయితీ అనే సహజ తెలుగు భావంతో అందిస్తుంది.
- source_word: ἔναντι τοῦ θεοῦ
  choice: దేవుని ఎదుట
  rationale: దేవుని సమక్షంలో మరియు ఆయన తీర్పులో అనే మూలపాఠ భావాన్ని సూటిగా నిలుపుతుంది.
theological_decisions:
- issue: ‘భాగం’ మరియు ‘వాటా’ అనే ద్వంద్వ వ్యక్తీకరణ
  choice: రెండు పదాలనూ నిలుపడం
  alternative: ‘నీకు ఇందులో ఎలాంటి భాగమూ లేదు’ అని ఒకే పదబంధంగా కుదించడం
  rationale: పేతురు పలికిన సంపూర్ణ నిరాకరణకు గ్రీకు సమాంతర పదాలు ఇచ్చే బలాన్ని అనవసరంగా తగ్గించకూడదు.
- issue: హృదయం ‘సరైనది’ కాదనే వాక్యం
  choice: ‘యథార్థంగా లేదు’
  alternative: ‘సరిగా లేదు’ లేదా ‘నిటారుగా లేదు’
  rationale: నైతిక, ఆధ్యాత్మిక అంతరంగ స్థితిని సూచిస్తుంది; ఏ ప్రత్యేక సిద్ధాంతపరమైన నిర్ధారణనూ అదనంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘భాగమూ లేదు, వాటా కూడా లేదు’ ద్వారా మూలంలోని రెండు సమీపార్థక పదాల ఉద్ఘాటన నిలుపబడింది.
