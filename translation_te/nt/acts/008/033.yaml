  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν τῇ ⸀ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη· ⸀τὴν γενεὰν αὐτοῦ τίς διηγήσεται; ὅτι αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/033.yaml
  text: In his humiliation justice was taken away from him[b][a]. Who will recount his generation? For his life is taken from the earth.
translation:
  language: te
  text: ఆయన అవమాన స్థితిలో ఆయనకు న్యాయం దక్కకుండా పోయింది.[b] ఆయన తరాన్ని ఎవరు వివరంగా చెప్పగలరు?[a] ఎందుకంటే ఆయన జీవితం భూమి నుండి తీసివేయబడుతోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆయన సంతానాన్ని’ లేదా ‘ఆయన సమకాలికులను’; గ్రీకులోని ‘తరం’ అనే పదం యెషయా 53 ఉల్లేఖనంలోని అస్పష్టతను నిలుపుతుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘ఆయన తీర్పు తీసివేయబడింది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώσει
  choice: అవమానస్థితిలో
  rationale: ఈ నామవాచకం అణచివేతకు, అవమానానికి గురైన స్థితిని సూచిస్తుంది. సందర్భంలోని అన్యాయమైన బాధను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: κρίσις
  choice: న్యాయం
  rationale: ఈ సందర్భంలో న్యాయమైన తీర్పు లేదా న్యాయపరమైన వ్యవహారం నిరాకరించబడిందనే భావం ప్రధానంగా ఉంది; ‘న్యాయం’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἤρθη
  choice: దక్కకుండా పోయింది
  rationale: αἴρω యొక్క భూతకాల కర్మణి రూపం ఇక్కడ తొలగింపు లేదా నిరాకరణను సూచిస్తుంది. తెలుగులో న్యాయం విషయంలో ‘దక్కకుండా పోయింది’ సహజంగా ఉంది.
- source_word: γενεὰν
  choice: తరాన్ని
  rationale: γενεάకు తరం, సమకాలికులు, సంతానం వంటి విస్తృత భావాలు ఉండవచ్చు. ‘తరం’ మూలంలోని అస్పష్టతను ప్రధాన వచనంలో సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: διηγήσεται
  choice: వివరించగలరు
  rationale: ఈ క్రియ వివరంగా చెప్పడం లేదా వర్ణించడం అనే భావాన్ని ఇస్తుంది; అలంకారప్రశ్నగా తెలుగులో ఇది సహజంగా ఉంటుంది.
- source_word: αἴρεται
  choice: తీసివేయబడుతోంది
  rationale: వర్తమాన కర్మణి రూపంలోని సజీవమైన చర్యను నిలుపుతూ, భూమిమీద జీవితం నుండి తొలగింపును వ్యక్తం చేస్తుంది.
- source_word: γῆς
  choice: భూమి
  rationale: ఇక్కడ γῆ భూమి లేదా లోకంలోని జీవన పరిధిని సూచిస్తుంది; ‘భూమి మీదనుండి’ తెలుగు వాడుకలో స్పష్టంగా ఉంటుంది.
- source_word: ζωὴ
  choice: జీవం
  rationale: ఇక్కడ భౌతిక జీవితం ఉద్దేశించబడింది. ‘జీవం’ జీవితం తీసివేయబడటాన్ని సంక్షిప్తంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘ఆయన తరం’ అనే పదబంధం యొక్క అర్థం
  choice: ప్రధాన వచనంలో ‘ఆయన తరం’ అనే అస్పష్టమైన రూపాన్ని నిలుపడం.
  alternative: ఆయన సంతానం; ఆయన సమకాలికులు
  rationale: యెషయా 53 ఉల్లేఖనంలోని ఈ పదబంధం సంతానం, సమకాలికులు లేదా ఆయన కాలానికి సంబంధించిన వారిని సూచించవచ్చు. ఒక అర్థాన్ని మాత్రమే నిర్ణయించకుండా మూలంలోని వ్యాఖ్యాన ఉద్రిక్తతను నిలుపాం.
- issue: κρίσις యొక్క భావం
  choice: ‘న్యాయం’ అని అనువదించడం.
  alternative: తీర్పు
  rationale: ఈ బాధాసందర్భంలో కేవలం తీర్పు తొలగించబడటం కన్నా న్యాయమైన వ్యవహారం నిరాకరించబడటం అనే భావం సహజంగా కనిపిస్తుంది. ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలిని వాడాం. మూలంలోని కర్మణి నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, ‘తరం’ మరియు κρίσις పదాల వ్యాఖ్యాన అస్పష్టతలను పాదసూచికల్లో చూపాం.
