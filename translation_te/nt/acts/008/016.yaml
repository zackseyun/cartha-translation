id: ACT.8.16
reference: Acts 8:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀οὐδέπω γὰρ ἦν ἐπ’ οὐδενὶ αὐτῶν ἐπιπεπτωκός, μόνον δὲ βεβαπτισμένοι ὑπῆρχον εἰς τὸ ὄνομα τοῦ ⸀κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/016.yaml
  text: For he had not yet fallen upon any of them[b][a]; they had only been baptized into the name of the Lord Jesus.
translation:
  language: te
  text: ఎందుకంటే, అప్పటివరకు పరిశుద్ధాత్మ వారిలో ఎవరిమీదా దిగివరలేదు; వారు ప్రభువైన యేసు నామంలోకి[a] బాప్తిస్మం మాత్రమే పొందారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రభువైన యేసు నామంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέπω
  choice: అప్పటివరకు … ఉండలేదు
  rationale: ఆ సమయం వరకు సంఘటన జరగలేదనే కాలార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπ’ οὐδενὶ αὐτῶν
  choice: వారిలో ఎవరి మీదా
  rationale: ἐπί యొక్క వ్యక్తుల మీదికి రావడం అనే దిశాత్మక-స్థానిక భావచిత్రాన్ని నిలుపుతుంది.
- source_word: ἐπιπεπτωκός
  choice: దిగివచ్చి ఉండలేదు
  rationale: అక్షరార్థమైన ‘పడడం’ తెలుగులో అపార్థం కలిగించవచ్చు; అపొస్తలుల కార్యములలో ఆత్మ వ్యక్తుల మీదికి రావడాన్ని సూచించే భావాన్ని, perfect ఫలితస్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μόνον
  choice: మాత్రమే
  rationale: ఆత్మ దిగివచ్చే అనుభవంతో పోల్చి బాప్తిస్మానికి మాత్రమే పరిమితమైన స్థితిని సూచిస్తుంది.
- source_word: βεβαπτισμένοι ὑπῆρχον
  choice: బాప్తిస్మం … పొంది ఉన్నారు
  rationale: ముందు జరిగిన బాప్తిస్మం వల్ల కొనసాగుతున్న స్థితిని తెలిపే పరిభాషాత్మక నిర్మాణాన్ని ప్రతిబింబిస్తుంది.
- source_word: εἰς τὸ ὄνομα
  choice: నామంలోకి
  rationale: εἰς యొక్క ‘లోనికి’ భావాన్ని నిలుపుతూ తెలుగులో గ్రహించదగిన రూపాన్ని ఎంచుకుంది; సాధారణ ‘నామంలో’ రూపాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: κυρίου Ἰησοῦ
  choice: ప్రభువైన యేసు
  rationale: κύριος అనే బిరుదును స్పష్టంగా యేసుతో అనుసంధానిస్తూ సహజమైన తెలుగు పదబంధాన్ని ఇస్తుంది.
theological_decisions:
- issue: ‘దిగివచ్చి ఉండలేదు’ అనే క్రియకు అంతర్లీన కర్త
  choice: మునుపటి వచన సందర్భం ఆధారంగా ‘పరిశుద్ధాత్మ’ను స్పష్టంగా చేర్చడం
  alternative: గ్రీకులో ఉన్నట్లే కర్తను వ్యక్తంగా చెప్పకుండా వదలడం
  rationale: గ్రీకు వాక్యంలో కర్త అంతర్లీనంగా ఉన్నా, 15వ వచనంలో పరిశుద్ధాత్మ స్పష్టంగా ప్రస్తావించబడ్డాడు. తెలుగులో అయోమయం నివారించడానికి ఆ సందర్భసిద్ధ కర్తను పునరుద్ధరించడం కొత్త సిద్ధాంతార్థాన్ని జోడించదు.
- issue: బాప్తిస్మం మరియు యేసు నామానికి సంబంధించిన εἰς పదప్రయోగం
  choice: ‘ప్రభువైన యేసు నామంలోకి’
  alternative: ‘ప్రభువైన యేసు నామంలో’
  rationale: మూలంలోని εἰς దిశాత్మక భావాన్ని సంరక్షిస్తుంది; ఈ వాక్యం తరువాతి బాప్తిస్మ సూత్రాల లేదా సంస్కార సిద్ధాంతాల వివాదాలను తేల్చేదిగా అనువదించబడలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘దిగివచ్చి’ అనేది గ్రీకు క్రియ యొక్క భావచిత్రాన్ని సహజ తెలుగులో అందిస్తుంది; ‘నామంలోకి’ మూలంలోని εἰς ను ఉద్దేశపూర్వకంగా ప్రతిబింబిస్తుంది.
