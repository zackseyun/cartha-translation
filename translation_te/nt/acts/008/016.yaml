revisions:
- from: ఎందుకంటే అప్పటివరకు పరిశుద్ధాత్మ వారిలో ఎవరి మీదా దిగివచ్చి ఉండలేదు; వారు ప్రభువైన యేసు నామంలోకి[a] బాప్తిస్మం మాత్రమే పొంది ఉన్నారు.
  to: ఎందుకంటే, అప్పటివరకు పరిశుద్ధాత్మ వారిలో ఎవరిమీదా దిగివరలేదు; వారు ప్రభువైన యేసు నామంలోకి[a] బాప్తిస్మం మాత్రమే పొందారు.
  rationale: The revision improves modern Telugu flow without altering the verse’s meaning. It retains the supplied contextual subject, the contrast between the Spirit’s not yet coming and baptism alone, and the more literal directional rendering ‘నామంలోకి’; the idiomatic alternative remains anchored in the footnote.
