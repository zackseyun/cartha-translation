  - severity: low
    issue: Verb choice for the Spirit’s coming is unnecessarily cumbersome
    rationale: ‘దిగివరలేదు’ is more idiomatic modern Telugu than ‘దిగివచ్చి ఉండలేదు’ while retaining the contextual image of the Spirit coming upon people.
  revised_text: ఎందుకంటే, అప్పటివరకు పరిశుద్ధాత్మ వారిలో ఎవరిమీదా దిగివరలేదు; వారు ప్రభువైన యేసు నామంలోకి[a] బాప్తిస్మం మాత్రమే పొందారు.
