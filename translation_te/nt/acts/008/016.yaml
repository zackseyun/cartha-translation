review_pass:
  verdict: revise
  source_fidelity: The draft correctly supplies పరిశుద్ధాత్మ from the immediate context, preserves the temporal force of οὐδέπω, the ‘upon’ imagery of ἐπ’ οὐδενί, and the limiting force of μόνον. ‘నామంలోకి’ appropriately retains the directional nuance of εἰς, with the idiomatic alternative noted.
  naturalness: ‘దిగివచ్చి ఉండలేదు’ and especially ‘బాప్తిస్మం మాత్రమే పొంది ఉన్నారు’ are somewhat heavy in modern standard Telugu. ‘దిగివరలేదు’ and ‘బాప్తిస్మం మాత్రమే పొందారు’ communicate the sense more naturally and clearly.
  terminology: పరిశుద్ధాత్మ, ప్రభువైన యేసు, and బాప్తిస్మం are appropriate, respectful, and consistent theological terms. No doctrinal interpretation beyond the immediate context is introduced.
  issues:
