id: ACT.8.3
reference: Acts 8:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Σαῦλος δὲ ἐλυμαίνετο τὴν ἐκκλησίαν κατὰ τοὺς οἴκους εἰσπορευόμενος, σύρων τε ἄνδρας καὶ γυναῖκας παρεδίδου εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/003.yaml
  text: But Saul was ravaging the church[a], entering house after house; dragging off both men and women[b], he was handing them over to prison.
translation:
  language: te
  text: అయితే సౌలు సంఘాన్ని నాశనం చేస్తూ ఉండేవాడు.[a] అతడు ఇంటింటిలోకి[b] ప్రవేశిస్తూ, పురుషులనూ స్త్రీలనూ ఈడ్చుకుపోతూ జైలుకు అప్పగించేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సంఘాన్ని పాడుచేస్తూ ఉండేవాడు.” గ్రీకు క్రియ సాధారణమైన “హింసించడం” కంటే బలమైన విధ్వంసకర చర్యను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఒక్కో ఇంటిలోకి.” గ్రీకు పదబంధం అనేక ఇళ్లలో వరుసగా ప్రవేశించడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλυμαίνετο
  choice: నాశనం చేస్తూ ఉండేవాడు
  rationale: ఈ క్రియ సాధారణంగా హింసించడంకంటే బలమైన విధ్వంసకర, క్రూరమైన చర్యను సూచిస్తుంది. అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న లేదా పదేపదే జరిగిన చర్యను ‘చేస్తూ ఉండేవాడు’ నిలుపుతుంది.
- source_word: ἐκκλησίαν
  choice: సంఘాన్ని
  rationale: ఇక్కడ ఈ పదం పౌరసభను కాక, యేసును విశ్వసించే ప్రజల సమాజాన్ని సూచిస్తుంది; ఆధునిక తెలుగు బైబిలు వాడుకలో ‘సంఘం’ సహజమైన పదం.
- source_word: κατὰ τοὺς οἴκους
  choice: ఇంటింటిలోకి
  rationale: κατά బహువచన నామవాచకంతో కలసి ఇచ్చే పంపిణీ భావాన్ని, అనేక ఇళ్లలో వరుసగా ప్రవేశించడాన్ని, ఈ రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰσπορευόμενος
  choice: ప్రవేశించి
  rationale: సౌలు సంఘాన్ని ఎలా నాశనం చేస్తున్నాడో తెలిపే భాగాన్ని సంక్షిప్తంగా, మూలానికి దగ్గరగా వ్యక్తం చేస్తుంది.
- source_word: σύρων
  choice: ఈడ్చుకుపోయి
  rationale: σύρωలోని బలవంతంగా లాగడం, అక్కడి నుంచి తీసుకుపోవడం అనే భావాలు రెండింటినీ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἄνδρας καὶ γυναῖκας
  choice: పురుషులనూ స్త్రీలనూ
  rationale: సౌలు చర్యలు లింగభేదం లేకుండా ఇద్దరిపైనా జరిగాయని నొక్కిచెప్పే గ్రీకు నిర్మాణాన్ని ‘నూ…నూ’ నిలుపుతుంది.
- source_word: παρεδίδου
  choice: వేయించేవాడు
  rationale: అధికారిక నిర్బంధానికి అప్పగించి జైలులో పెట్టించాడనే సందర్భోచిత భావాన్ని సహజమైన తెలుగులో ఇస్తుంది; అలవాటుగా లేదా పదేపదే జరిగిన చర్యను కూడా వ్యక్తం చేస్తుంది.
- source_word: εἰς φυλακήν
  choice: జైలులో
  rationale: ఇక్కడ φυλακή కాపలా అనే సాధారణ భావంలో కాక నిర్బంధ స్థలమైన జైలును సూచిస్తుంది.
theological_decisions:
- issue: మారుమనస్సుకు ముందు సౌలు చేసిన చర్యల తీవ్రత
  choice: సంఘాన్ని నాశనం చేస్తూ ఉండేవాడు
  alternative: సంఘాన్ని హింసిస్తూ ఉండేవాడు
  rationale: మూలంలోని λυμαίνομαι సాధారణ హింసకంటే తీవ్రమైన విధ్వంసకర చర్యను చిత్రిస్తుంది. బలమైన పదాన్ని ఉంచడం వచనంలోని తీవ్రతను కాపాడుతుంది; అయితే సౌలు సంఘాన్ని పూర్తిగా నాశనం చేయడంలో విజయం సాధించాడని చెప్పకుండా కొనసాగుతున్న ప్రయత్నం లేదా చర్యగానే చూపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘జైలు’ ప్రస్తుత వాడుకలో స్పష్టమైన పదం; ‘పురుషులనూ స్త్రీలనూ’ మూలంలోని సమగ్ర నొక్కును నిలుపుతుంది. గ్రీకు వాక్యాన్ని తెలుగు పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించినా, చర్యల క్రమం మరియు కొనసాగుతున్న స్వభావం కాపాడబడ్డాయి.
