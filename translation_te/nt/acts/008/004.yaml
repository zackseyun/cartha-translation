revisions:
- from: కాబట్టి చెదరగొట్టబడినవారు వాక్యాన్ని సువార్తగా ప్రకటిస్తూ[a] అక్కడక్కడికి వెళ్లారు.
  to: కాబట్టి చెదరగొట్టబడినవారు అక్కడక్కడికి వెళ్లి వాక్యాన్ని ప్రకటించారు.[a]
  rationale: The revision uses the natural Telugu expression “వాక్యాన్ని ప్రకటించారు” for εὐαγγελιζόμενοι τὸν λόγον and explains in the note that the Greek verb carries the sense of proclaiming as good news. “వెళ్లి” expresses the attendant travel-and-proclamation action naturally, without adding a specified region.
  reviewer_model: gpt-5.6-terra
