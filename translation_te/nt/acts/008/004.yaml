  yaml_path: translation/nt/acts/008/004.yaml
  text: So those who had been scattered went through the region proclaiming the word[a][b][c].
translation:
  language: te
  text: కాబట్టి చెదరగొట్టబడినవారు అక్కడక్కడికి వెళ్లి వాక్యాన్ని ప్రకటించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో, “వాక్యాన్ని సువార్తగా ప్రకటిస్తూ”; ఇక్కడ “వాక్యం” అంటే యేసును గురించిన సందేశం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν
  choice: కాబట్టి … వారు
  rationale: οὖν ముందు చెప్పిన హింస, చెదరగొట్టబడడం వల్ల ఏర్పడిన పరిణామాన్ని సూచిస్తుంది; μέν ఇక్కడ ప్రత్యేక పదంతో అనువదించాల్సిన అవసరం లేని కథన అనుసంధాన కణం.
- source_word: διασπαρέντες
  choice: చెదరగొట్టబడినవారు
  rationale: గ్రీకు నిష్క్రియార్థాన్ని నిలుపుతూ, వారు స్వయంగా వెళ్లిపోలేదని—వారిని చెదరగొట్టారని—తెలియజేస్తుంది.
- source_word: διῆλθον
  choice: అక్కడక్కడికి వెళ్లారు
  rationale: ఒక చోటు నుంచి మరొక చోటుకు వెళ్తూ సంచరించిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; గ్రీకులో లేని నిర్దిష్ట ‘ప్రాంతం’ అనే పదాన్ని చేర్చదు.
- source_word: εὐαγγελιζόμενοι
  choice: సువార్తగా ప్రకటిస్తూ
  rationale: ప్రయాణిస్తూ శుభవార్తను ప్రకటించిన సహవర్తి చర్యను తెలియజేస్తుంది; కేవలం సంఘపరమైన ‘ప్రసంగిస్తూ’ అనే పరిమిత భావాన్ని తప్పిస్తుంది.
- source_word: τὸν λόγον
  choice: వాక్యాన్ని
  rationale: లూకా వాడే సంక్షిప్త పదప్రయోగాన్ని నిలుపుతుంది. సందర్భంలో ఇది యేసును గురించిన సందేశాన్ని సూచించినా, ప్రధాన పాఠ్యంలో వివరణాత్మక పదాలను చేర్చలేదు.
theological_decisions:
- issue: εὐαγγελιζόμενοι τὸν λόγον అనే నిర్మాణం
  choice: వాక్యాన్ని సువార్తగా ప్రకటిస్తూ
  alternative: వాక్యాన్ని ప్రకటిస్తూ; సువార్త సందేశాన్ని ప్రకటిస్తూ
  rationale: గ్రీకులో ‘వాక్యం’ క్రియకు ప్రత్యక్ష కర్మ; సువార్త అనే భావం క్రియలోనే ఉంది. ఎంపిక చేసిన రూపం ఈ రెండు అంశాలను నిలుపుతూ, వాటి మధ్య గ్రీకులో లేని ‘యొక్క’ సంబంధాన్ని సృష్టించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలి. ‘చెదరగొట్టబడినవారు’ నిష్క్రియార్థాన్ని, ‘అక్కడక్కడికి వెళ్లారు’ సంచార భావాన్ని నిలుపుతాయి.
