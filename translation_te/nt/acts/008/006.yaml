- from: ఫిలిప్పు చెప్పిన మాటలను వింటూ, అతడు చేస్తున్న సూచక కార్యాలను చూస్తూ, జనసమూహాలు ఏకమనస్సుతో[b] ఆ మాటలపై శ్రద్ధ పెట్టారు[a].
  to: ఫిలిప్పు చెప్పిన మాటలను జనసమూహాలు ఏకమనస్సుతో[b] శ్రద్ధగా విన్నారు[a], అతనిని వింటూ, అతడు చేస్తున్న సూచక కార్యాలను చూస్తూ.
  rationale: The revision restores the contextual object ‘అతనిని’ for αὐτούς. It also places the main action, ‘శ్రద్ధగా విన్నారు,’ before the attendant participial actions in a natural Telugu order, while retaining the Greek imperfect’s scene-setting sense through ‘వింటూ’ and ‘చూస్తూ.’
