translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘సూచక కార్యాలు’ అనే పదబంధం బైబిలు సందర్భానికి తగినదిగా ఉండి, సాధారణ పాఠకుడికీ అర్థమయ్యేలా ఉంది. మానవ సమూహాన్ని భావానుసారంగా గౌరవ బహువచన క్రియతో అనుసంధానించాం.
