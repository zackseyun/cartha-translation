source:
  edition: SBLGNT
  text: προσεῖχον ⸀δὲ οἱ ὄχλοι τοῖς λεγομένοις ὑπὸ τοῦ Φιλίππου ὁμοθυμαδὸν ἐν τῷ ἀκούειν αὐτοὺς καὶ βλέπειν τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/006.yaml
  text: And the crowds with one accord paid close attention to what was being said by Philip[b][a], as they heard him and saw the signs that he was doing.
translation:
  language: te
  text: ఫిలిప్పు చెప్పిన మాటలను జనసమూహాలు ఏకమనస్సుతో[b] శ్రద్ధగా విన్నారు[a], అతనిని వింటూ, అతడు చేస్తున్న సూచక కార్యాలను చూస్తూ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చెవియొగ్గారు” లేదా “శ్రద్ధగా ఆలకించారు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అందరూ కలిసి” లేదా “ఒకే ఉద్దేశంతో”; గ్రీకు పదం వారి ఉమ్మడి, ఐక్య స్పందనను నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: శ్రద్ధ పెట్టారు
  rationale: ప్రసంగంలోని మాటలవైపు మనస్సును మళ్లించి శ్రద్ధగా ఉండడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; గ్రీకు అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న చర్య భావాన్ని సందర్భం ద్వారా నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది స్వల్ప కథన అనుసంధాన పదం. తెలుగులో వాక్యప్రవాహమే ఆ సంబంధాన్ని స్పష్టంగా చూపుతుంది; ‘కాని’ అని పెడితే లేని వ్యతిరేక భావం చేరుతుంది.
- source_word: οἱ ὄχλοι
  choice: జనసమూహాలు
  rationale: మూలంలోని బహువచనాన్ని, గుమికూడిన ప్రజల భావాన్ని నిలుపుతుంది.
- source_word: τοῖς λεγομένοις ὑπὸ τοῦ Φιλίππου
  choice: ఫిలిప్పు చెప్పిన మాటలు
  rationale: కర్మణి ప్రయోగంలోని భావాన్ని సహజమైన తెలుగు కర్తరి నిర్మాణంలో అందిస్తూ, ప్రసంగ విషయాన్నే సూచిస్తుంది.
- source_word: ὁμοθυμαδὸν
  choice: ఏకమనస్సుతో
  rationale: కేవలం ఒకేచోట ఉండడం కాకుండా, ప్రజల ఉమ్మడి స్పందనను మరియు మనస్సుల ఐక్యతను తెలియజేస్తుంది.
- source_word: ἐν τῷ ἀκούειν αὐτοὺς καὶ βλέπειν
  choice: వింటూ ... చూస్తూ
  rationale: ἐν τῷ + infinitive నిర్మాణంలోని సమకాలిక పరిస్థితిని సహజమైన తెలుగు అసమాపక క్రియలతో వ్యక్తం చేస్తుంది. αὐτούςను సందర్భానుసారంగా జనసమూహాలనే సూచించే infinitive కర్తగా గ్రహించి, అనవసరమైన ‘అతనిని’ అనే కర్మను చేర్చలేదు.
- source_word: τὰ σημεῖα
  choice: సూచక కార్యాలు
  rationale: σημεῖα యొక్క ‘signs’ భావాన్ని నిలుపుతుంది; మూలంలో లేని ‘అద్భుతమైన’ అనే వివరణను చేర్చదు.
- source_word: ἃ ἐποίει
  choice: అతడు చేస్తున్న
  rationale: ἐποίειలోని కొనసాగుతున్న చర్య భావాన్ని నిలుపుతూ, ఆ కార్యాలకు ఫిలిప్పే కర్త అని స్పష్టం చేస్తుంది.
