source:
  edition: SBLGNT
  text: ⸀ἰδὼν δὲ ὁ Σίμων ὅτι διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων δίδοται τὸ ⸀πνεῦμα προσήνεγκεν αὐτοῖς χρήματα
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/018.yaml
  text: But when Simon saw that the Spirit was given through the laying on of the apostles’ hands[a], he offered them money,
translation:
  language: te
  text: అయితే అపొస్తలులు చేతులు ఉంచడం ద్వారా ఆత్మ ఇవ్వబడుతోందని సీమోను చూసి, వారికి డబ్బు ఇవ్వజూపాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పరిశుద్ధాత్మ.” గ్రీకు పాఠ్యంలో ఇక్కడ “ఆత్మ” అని మాత్రమే ఉంది; సందర్భంలో సూచించబడుతున్నది పరిశుద్ధాత్మే.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: చూసి
  rationale: ὁράω పదానికి చెందిన భూతకాల అసమాపక క్రియారూపం; సీమోను చూసినదే అతని తదుపరి చర్యకు దారితీసిందనే క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: కథనంలో స్వల్ప మలుపును, సీమోను ప్రతిస్పందన వైపు మార్పును సూచిస్తుంది; అతిగా బలమైన వ్యతిరేకతను కల్పించదు.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων
  choice: అపొస్తలులు చేతులు ఉంచడం ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సాధనం లేదా మాధ్యమాన్ని సూచిస్తుంది. ఈ రూపం అపొస్తలుల చేతులుంచడాన్ని మాధ్యమంగా చూపుతుంది గాని వారే ఆత్మకు మూలమని చెప్పదు.
- source_word: δίδοται
  choice: అనుగ్రహించబడుతున్నాడని
  rationale: వర్తమాన కర్మణి రూపంలోని కొనసాగుతున్న లేదా సాధారణంగా గమనించిన ప్రక్రియను నిలుపుతుంది. ఆత్మ వ్యక్తిగత సూచ్యుడు కావడంతో గౌరవ ఏకవచన క్రియను వాడింది.
- source_word: τὸ πνεῦμα
  choice: ఆత్మ
  rationale: గ్రీకు మూలంలో ఉన్న సంక్షిప్త రూపాన్నే ప్రధాన పాఠ్యంలో ఉంచింది; సందర్భంలో పరిశుద్ధాత్మ సూచ్యుడని పాదటిప్పణి స్పష్టం చేస్తుంది.
- source_word: προσήνεγκεν αὐτοῖς χρήματα
  choice: వారికి డబ్బు ఇచ్చేందుకు ముందుకొచ్చాడు
  rationale: προσφέρω ఇక్కడ సమర్పించడం లేదా ఇవ్వజూపడాన్ని సూచిస్తుంది. కేవలం డబ్బు తీసుకొచ్చాడనే భావం కాకుండా చెల్లింపుగా ఇవ్వజూపిన ఉద్దేశాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: τὸ πνεῦμα యొక్క సూచ్యుడు
  choice: ప్రధాన పాఠ్యంలో “ఆత్మ”; సందర్భార్థంగా పరిశుద్ధాత్మ
  alternative: “పరిశుద్ధాత్మ” అని నేరుగా అనువదించడం
  rationale: గ్రీకు పాఠ్యంలో ఇక్కడ τὸ πνεῦμα, అంటే “ఆత్మ” అని మాత్రమే ఉంది; ముందరి సందర్భం పరిశుద్ధాత్మను స్పష్టంగా సూచిస్తుంది. ప్రధాన పాఠ్యం మూలపదాన్ని కాపాడగా పాదటిప్పణి సూచ్యుడిని వివరిస్తుంది.
- issue: ఆత్మ అనుగ్రహించబడటంలో అపొస్తలుల పాత్ర
  choice: “చేతులు ఉంచడం ద్వారా” అని మాధ్యమాన్ని సూచించడం
  alternative: అపొస్తలులే ఆత్మను ఇచ్చారని చెప్పడం
  rationale: వాక్యం చేతులుంచడాన్ని సాధనంగా చెబుతుంది; ఆత్మకు అంతిమ దాత ఎవరు అనే విషయాన్ని ఈ వాక్యానికి మించి నిర్ధారించదు. అందువల్ల మతశాఖాపరమైన అదనపు నిర్ణయాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. “చేతులు ఉంచడం” సాధారణ పాఠకులకు స్పష్టంగా ఉండే రూపం; “అనుగ్రహించబడుతున్నాడు” దైవిక వరం అనే సందర్భానికి తగినదిగా, కర్మణి ప్రయోగాన్ని కాపాడేలా ఎంచుకోబడింది.
