source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν· Δεήθητε ὑμεῖς ὑπὲρ ἐμοῦ πρὸς τὸν κύριον ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ ὧν εἰρήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/024.yaml
  text: But Simon answered[a], “You pray to the Lord for me, so that nothing of what you have said may come upon me.”
translation:
  language: te
  text: 'అయితే సీమోను జవాబిచ్చి ఇలా అన్నాడు: “మీరు నా కోసం ప్రభువును ప్రార్థించండి, మీరు చెప్పిన వాటిలో ఏదీ నా మీదికి రాకుండా ఉండేలా.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν
  choice: అప్పుడు సీమోను జవాబిస్తూ ... అన్నాడు
  rationale: δέ ఇక్కడ పేతురు గద్దింపునుంచి సీమోను ప్రతిస్పందనకు కథనాన్ని మళ్లిస్తుంది; దాన్ని సహజమైన తెలుగు కథన సంధి అయిన ‘అప్పుడు’తో తెలిపాం. ἀποκριθείς ... εἶπεν అనే గ్రీకు వాక్యప్రయోగంలోని ప్రతిస్పందన భావాన్ని ‘జవాబిస్తూ ... అన్నాడు’ నిలుపుతుంది.
- source_word: Δεήθητε ὑμεῖς
  choice: మీరు ... ప్రార్థించండి
  rationale: δέομαι ఇక్కడ దేవునికి విన్నపం చేయడం అనే అర్థంలో ఉంది. స్పష్టంగా ఉన్న ὑμεῖς వల్ల కలిగే ఉద్ఘాటనను ‘మీరు’ అనే కర్తను ప్రత్యక్షంగా ఉంచడం ద్వారా నిలిపాం.
- source_word: ὑπὲρ ἐμοῦ
  choice: నా కోసం
  rationale: ὑπέρ + షష్ఠీ విభక్తి ఇక్కడ మరొకరి పక్షంగా చేసే ప్రార్థనను సూచిస్తుంది; ‘నా కోసం’ సహజమైన ఆధునిక తెలుగు.
- source_word: πρὸς τὸν κύριον
  choice: ప్రభువును
  rationale: ప్రార్థన ఎవరికి ఉద్దేశించబడిందో తెలుగులో ‘ప్రభువును ప్రార్థించండి’ అనే ప్రయోగం సహజంగా తెలియజేస్తుంది. κύριος యొక్క సాధారణ బైబిలు సమానార్థకంగా ‘ప్రభువు’ను వాడాం.
- source_word: ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ
  choice: ఏదీ నా మీదికి రాకుండా ఉండాలి
  rationale: ὅπως తో వచ్చిన ఉద్దేశిత ఫలితాన్ని తెలుగు నిషేధార్థక ప్రయోజన నిర్మాణంతో తెలిపాం. ἐπέρχομαι + ἐπί లోని విపత్తు లేదా తీర్పు ఒకరి మీదికి రావడం అనే గంభీర భావాన్ని ‘నా మీదికి రాకుండా’ నిలుపుతుంది.
- source_word: ὧν εἰρήκατε
  choice: మీరు చెప్పిన వాటిలో
  rationale: సంబంధసూచక షష్ఠీ నిర్మాణాన్ని ‘మీరు చెప్పిన వాటిలో ఏదీ’గా అనువదించడం ద్వారా హెచ్చరికలో చెప్పబడిన విషయాల్లో ఒక్కటీ సంభవించకూడదనే భావం స్పష్టంగా, సహజంగా వస్తుంది.
theological_decisions:
- issue: τὸν κύριον (‘ప్రభువు’) ఎవరిని సూచిస్తుంది?
  choice: ప్రభువు
  alternative: దేవుడు; ప్రభువైన యేసు
  rationale: గ్రీకు పాఠం కేవలం τὸν κύριον అని మాత్రమే చెబుతుంది. అపొస్తలుల కార్యములలో ఇది సందర్భానుసారం దేవునినిగానీ యేసునిగానీ సూచించగలదు; ఈ వచనం ఆ సూచనను మరింత నిర్దిష్టం చేయదు. కాబట్టి మూలంలోని ఉద్దేశపూర్వక నిర్దిష్టత స్థాయినే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. గ్రీకు వాక్యంలోని ‘మీరు’ అనే ఉద్ఘాటనను నిలిపి, ప్రభువు అనే పదం ఎవరిని సూచిస్తుందో అనువాదంలో అదనంగా నిర్ధారించలేదు.
