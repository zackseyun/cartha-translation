id: ACT.8.7
reference: Acts 8:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀πολλοὶ γὰρ τῶν ἐχόντων πνεύματα ἀκάθαρτα βοῶντα φωνῇ μεγάλῃ ⸀ἐξήρχοντο, πολλοὶ δὲ παραλελυμένοι καὶ χωλοὶ ἐθεραπεύθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/007.yaml
  text: For many who had unclean spirits[a], they came out crying with a loud voice; and many who were paralyzed and lame were healed.
translation:
  language: te
  text: ఎందుకంటే, అపవిత్ర ఆత్మలు పట్టిన అనేకమందిలోనుండి ఆ ఆత్మలు పెద్దగా కేకలు వేస్తూ బయటికి వచ్చాయి.[a] పక్షవాతం ఉన్నవారిలోను కుంటివారిలోను అనేకులు స్వస్థపడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పెద్ద స్వరంతో కేకలు వేస్తూ”; గ్రీకు కృదంతం అపవిత్ర ఆత్మలే బయటికి వస్తూ కేకలు వేశాయని సహజంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ γὰρ τῶν ἐχόντων
  choice: ఎందుకంటే, అపవిత్రాత్మలు పట్టిన అనేకమందిలోనుంచి
  rationale: γάρ ముందున్న వాక్యానికి కారణాన్ని వివరిస్తుంది కాబట్టి ‘ఎందుకంటే’ అని అనువదించాం. గ్రీకు వాక్యనిర్మాణం అసాధారణంగా ఉన్నందున, అపవిత్రాత్మలు ఉన్న వ్యక్తులను సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో తెలిపాం.
- source_word: πνεύματα ἀκάθαρτα
  choice: అపవిత్రాత్మలు
  rationale: లూకా–అపొస్తలుల కార్యాలు గ్రంథాల్లో దయ్య సంబంధమైన ఆత్మలను సూచించే స్థిరమైన, సందర్భోచిత పదబంధం.
- source_word: βοῶντα φωνῇ μεγάλῃ
  choice: పెద్దగా కేకలు వేస్తూ
  rationale: βοάω యొక్క బలమైన స్వరార్థాన్ని, φωνῇ μεγάλῃ సూచించే గట్టితనాన్ని సహజమైన తెలుగులో రెండింటినీ నిలిపింది.
- source_word: ἐξήρχοντο
  choice: బయటికి వచ్చాయి
  rationale: సందర్భంలో అపవిత్రాత్మలు బాధితులలోనుంచి నిష్క్రమించడాన్ని సూచిస్తుంది; అసంపూర్ణ భూతకాల క్రియను సహజ తెలుగు కథనరీతిలో ఇచ్చాం.
- source_word: παραλελυμένοι
  choice: పక్షవాతం ఉన్నవారు
  rationale: పక్షవాతం వల్ల ఏర్పడిన స్థితిని సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: χωλοὶ
  choice: కుంటివారు
  rationale: నడవడంలో శారీరక వైకల్యం ఉన్నవారిని తెలిపే సాధారణ తెలుగు పదం; సందర్భంలోని వర్గసూచనను నిలుపుతుంది.
- source_word: ἐθεραπεύθησαν
  choice: స్వస్థపడ్డారు
  rationale: చికిత్స లేదా స్వస్థత పొందిన భావాన్ని సహజంగా తెలియజేస్తూ, గ్రీకు కర్మణి రూపం పేర్కొనని కార్యసాధకుణ్ణి అదనంగా చేర్చదు.
theological_decisions:
- issue: కేకలు వేస్తూ బయటికి వచ్చినవారు ఎవరు?
  choice: అపవిత్రాత్మలే కేకలు వేస్తూ బాధితులలోనుంచి బయటికి వచ్చాయి.
  alternative: అపవిత్రాత్మలు బయటికి వస్తున్నప్పుడు వాటి పట్టులో ఉన్న వ్యక్తులే కేకలు వేశారు.
  rationale: నపుంసక బహువచనమైన βοῶντα, πνεύματα ἀκάθαρτα అనే పదబంధంతో సహజంగా ఏకీభవిస్తుంది. అందువల్ల కేకలు వేయడమూ బయటికి రావడమూ ఆత్మలకే సంబంధించినవిగా ప్రధాన పాఠంలో స్పష్టం చేశాం; గ్రీకు వాక్యనిర్మాణం వల్ల కలిగే మరో అవగాహనను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథనశైలిని వాడాం. మొదటి ఉపవాక్యంలోని అసాధారణ గ్రీకు నిర్మాణాన్ని తెలుగులో స్పష్టంగా పునర్వ్యవస్థీకరించాం; అయినా దాని నిజమైన సూచనాసందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
