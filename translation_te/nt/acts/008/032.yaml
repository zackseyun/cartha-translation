id: ACT.8.32
reference: Acts 8:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ δὲ περιοχὴ τῆς γραφῆς ἣν ἀνεγίνωσκεν ἦν αὕτη· Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη, καὶ ὡς ἀμνὸς ἐναντίον τοῦ ⸀κείραντος αὐτὸν ἄφωνος, οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/032.yaml
  text: 'The passage of Scripture that he was reading was this: “Like a sheep he was led to slaughter[a], and like a lamb before the one shearing it is silent[b], so he does not open his mouth.”'
translation:
  language: te
  text: 'అతడు చదువుతున్న లేఖన భాగం ఇదే: “గొర్రెవలె అతడు వధకు నడిపించబడ్డాడు[a]; దాని బొచ్చు కత్తిరించేవాని ఎదుట మౌనంగా ఉన్న గొర్రెపిల్లవలె, అతడు తన నోరు తెరవడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వధస్థలానికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιοχὴ τῆς γραφῆς
  choice: లేఖన భాగం
  rationale: ఇక్కడ περιοχή అంటే చదువుతున్న పవిత్ర లేఖనంలోని నిర్దిష్ట భాగం. ‘లేఖన భాగం’ ఆధునిక తెలుగులో సహజంగా ఉండి γραφή యొక్క పవిత్ర లేఖన సూచనను నిలుపుతుంది.
- source_word: ἀνεγίνωσκεν
  choice: చదువుతున్న
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న చర్యను సూచిస్తుంది; ‘చదువుతున్న’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: Ὡς πρόβατον
  choice: గొర్రెలా
  rationale: ὡς ఉపమానాన్ని ప్రవేశపెడుతుంది. ‘గొర్రెలా’ సంక్షిప్తంగా, సహజంగా ఆ ఉపమానాన్ని నిలుపుతుంది.
- source_word: ἐπὶ σφαγὴν
  choice: వధకు
  rationale: ఈ పదబంధం వధ వైపు నడిపించబడడాన్ని సూచిస్తుంది. ‘వధకు’ స్పష్టమైన, సహజమైన తెలుగు రూపం.
- source_word: ἤχθη
  choice: నడిపించబడ్డాడు
  rationale: ἄγω యొక్క కర్మణి రూపం ఇక్కడ ఇతరులచేత నడిపించబడడాన్ని తెలియజేస్తుంది; తెలుగు కర్మణి రూపం మూలంలోని భావాన్ని నిలుపుతుంది.
- source_word: ἀμνὸς
  choice: గొర్రెపిల్ల
  rationale: ἀμνός ప్రత్యేకంగా చిన్న గొర్రెను సూచిస్తుంది; πρόβατον‌కు వాడిన ‘గొర్రె’తో ఉన్న పదభేదాన్ని ‘గొర్రెపిల్ల’ నిలుపుతుంది.
- source_word: ἐναντίον τοῦ κείραντος αὐτὸν
  choice: తన బొచ్చు కత్తిరిస్తున్నవాని ఎదుట
  rationale: ‘దానిని కత్తిరిస్తున్నవాని ఎదుట’ అనే గ్రీకు నిర్మాణాన్ని అర్థస్పష్టమైన తెలుగులో ఇస్తుంది. సందర్భంలో కత్తిరించేది గొర్రెపిల్ల బొచ్చు కనుక దానిని స్పష్టంగా పేర్కొనడం సహజం.
- source_word: ἄφωνος
  choice: మౌనంగా ఉండే
  rationale: పదశః ‘స్వరంలేని’ అనే భావం ఉన్నా, ఈ ఉపమానంలో శబ్దం చేయకుండా ఉండడమే ఉద్దేశం; ‘మౌనంగా ఉండే’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ
  choice: అతడు తన నోరు తెరవడు
  rationale: గ్రీకులోని వర్తమాన కాలాన్ని తెలుగు సాధారణ వర్తమాన రూపంలో నిలిపి, ఉల్లేఖనంలోని సజీవతను కాపాడుతుంది.
theological_decisions:
- issue: యెషయా 53లోని సేవకుని వాక్యం సందర్భంలో యేసుకు అన్వయించబడటం
  choice: వచనంలోని ఉపమానాన్ని యథాతథంగా ఉంచి, ఈ వచనంలోనే యేసు పేరును చేర్చలేదు.
  alternative: ‘యేసు గొర్రెలా...’ అని క్రీస్తుసంబంధ అన్వయాన్ని అనువాదంలోనే స్పష్టపరచడం.
  rationale: తరువాతి కథనం ఈ లేఖనాన్ని యేసుతో అనుసంధానిస్తుంది; అయితే ఈ వచనం స్వయంగా లేఖన ఉల్లేఖనాన్ని మాత్రమే ఇస్తుంది. అందువల్ల సందర్భం వెల్లడించే అన్వయాన్ని ముందుగానే అనువాదంలో చేర్చకుండా మూలంలోని నిర్మాణం, ఉద్వేగం నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి వాడబడింది. యెషయా ఉల్లేఖనంలోని కవితాత్మక సమాంతరత కోసం ‘గొర్రెలా’ మరియు ‘గొర్రెపిల్లలా’ అనే రూపాలు ఉంచబడ్డాయి; మూలంలో లేని ప్రారంభ కాలసూచక పదం చేర్చబడలేదు.
