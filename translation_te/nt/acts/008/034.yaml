source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ εὐνοῦχος τῷ Φιλίππῳ εἶπεν· Δέομαί σου, περὶ τίνος ὁ προφήτης λέγει ⸀τοῦτο; περὶ ἑαυτοῦ ἢ περὶ ἑτέρου τινός;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/034.yaml
  text: Then the eunuch answered Philip and said[a], “I ask you, about whom does the prophet say this—about himself or about someone else?”
translation:
  language: te
  text: 'అప్పుడు నపుంసకుడు ఫిలిప్పును ఇలా అడిగాడు: “దయచేసి చెప్పండి[a], ప్రవక్త ఇది ఎవరి గురించి చెబుతున్నాడు? తన గురించా, లేక మరొకరి గురించా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను మిమ్మల్ని వేడుకుంటున్నాను.” గ్రీకు మాట గౌరవపూర్వకమైన అభ్యర్థనను తెలియజేస్తుంది; సందర్భాన్ని బట్టి మరింత బలమైన వేడుకోలుగానూ అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: అప్పుడు ... అని అడిగాడు
  rationale: ἀποκριθείς ... εἶπεν అనే గ్రీకు కథన ప్రయోగం మాటకు ప్రతిస్పందనగా పలకడాన్ని సూచిస్తుంది. తెలుగులో ‘అప్పుడు ... అని అడిగాడు’ సహజంగా ఉండి, తరువాత వచ్చే ప్రశ్న స్వభావాన్నీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὁ εὐνοῦχος
  choice: నపుంసకుడు
  rationale: εὐνοῦχος అనే నిర్దిష్ట పదాన్ని ‘అధికారి’గా సాధారణీకరించకుండా, పాత్ర గుర్తింపును నిలుపుకునే ప్రామాణిక తెలుగు పదం వాడబడింది.
- source_word: τῷ Φιλίππῳ
  choice: ఫిలిప్పుతో
  rationale: దత్తివిభక్తి సంభాషణ ఎవరిని ఉద్దేశించిందో సూచిస్తుంది; ‘ఫిలిప్పుతో’ ఆధునిక తెలుగులో సహజమైన రూపం.
- source_word: Δέομαί σου
  choice: దయచేసి చెప్పండి
  rationale: ఈ పదబంధం గౌరవపూర్వకమైన, కొంత వేడుకోలు భావమున్న అభ్యర్థన. సందర్భానుకూలమైన తెలుగు సంభాషణలో ‘దయచేసి చెప్పండి’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: περὶ τίνος
  choice: ఎవరి గురించి
  rationale: περί + షష్ఠీ విషయాన్ని లేదా వ్యక్తి సూచనను తెలుపుతుంది; ‘ఎవరి గురించి’ నేరుగా, సహజంగా ఉంటుంది.
- source_word: ὁ προφήτης λέγει τοῦτο
  choice: ప్రవక్త ఇలా చెప్పేది
  rationale: τοῦτο ముందే చదివిన వాక్యభాగాన్ని సూచిస్తుంది. తెలుగులో ‘ఇలా చెప్పేది’ ఆ ఉల్లేఖనాన్ని సహజంగా వెనక్కి సూచిస్తుంది.
- source_word: περὶ ἑαυτοῦ ἢ περὶ ἑτέρου τινός
  choice: తన గురించా, లేక మరొకరి గురించా
  rationale: ప్రవక్తనే సూచించే ఆత్మవాచక సర్వనామాన్నీ, వేరొక అనిర్దిష్ట వ్యక్తితో ఉన్న వ్యత్యాసాన్నీ యథాతథంగా నిలుపుతుంది.
