translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవపూర్వక సంభాషణను ఉపయోగించాం. మూలంలోని ప్రశ్నాత్మక నిర్మాణం, ‘తన గురించి/మరొకరి గురించి’ అనే వ్యత్యాసం నిలుపబడ్డాయి.
