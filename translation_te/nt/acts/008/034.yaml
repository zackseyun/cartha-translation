- from: అప్పుడు నపుంసకుడు ఫిలిప్పుతో, “దయచేసి చెప్పండి[a], ప్రవక్త ఇలా చెప్పేది ఎవరి గురించి? తన గురించా, లేక మరొకరి గురించా?” అని అడిగాడు.
  to: 'అప్పుడు నపుంసకుడు ఫిలిప్పును ఇలా అడిగాడు: “దయచేసి చెప్పండి[a], ప్రవక్త ఇది ఎవరి గురించి చెబుతున్నాడు? తన గురించా, లేక మరొకరి గురించా?”'
  rationale: “ఇలా” స్థానంలో “ఇది” వాడి τοῦτο యొక్క సూచనను స్పష్టంగా నిలిపాం. ప్రశ్నను “ప్రవక్త ఇది ఎవరి గురించి చెబుతున్నాడు?”గా మార్చడం ద్వారా ఆధునిక ప్రామాణిక తెలుగులో సహజత్వం పెరిగింది. “ఫిలిప్పును ఇలా అడిగాడు” అనేది మూలంలోని జవాబుగా పలికి ప్రశ్న అడిగిన కథన విధానాన్ని తెలుగు కథనరీతిలో సంక్షిప్తంగా, అర్థనష్టంలేకుండా తెలియజేస్తుంది.
