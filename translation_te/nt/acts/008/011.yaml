id: ACT.8.11
reference: Acts 8:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: προσεῖχον δὲ αὐτῷ διὰ τὸ ἱκανῷ χρόνῳ ταῖς μαγείαις ἐξεστακέναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/011.yaml
  text: And they paid attention to him because for a considerable time he had amazed them with his magic arts[a][b].
translation:
  language: te
  text: అతడు చాలాకాలం తన మంత్రవిద్యలతో వారిని ఆశ్చర్యపరిచినందువల్ల, వారు అతనిపై శ్రద్ధ పెట్టేవారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దీర్ఘకాలంగా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మాంత్రిక క్రియలతో’; ‘చేతబడులతో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: శ్రద్ధ పెట్టేవారు
  rationale: ఈ సందర్భంలో προσέχω ఒక వ్యక్తివైపు శ్రద్ధ మళ్లించి అతని మాటలను పట్టించుకోవడాన్ని సూచిస్తుంది. అసంపూర్ణ భూతకాల భావాన్ని ‘పెట్టేవారు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτῷ
  choice: అతనిపై
  rationale: προσέχωతో వచ్చిన దత్తివును ఆధునిక తెలుగులో సహజంగా ‘అతనిపై శ్రద్ధ పెట్టేవారు’ అని అనువదించవచ్చు.
- source_word: διὰ τὸ ἱκανῷ χρόνῳ
  choice: చాలాకాలంగా ... ఉండడం వల్ల
  rationale: διάతో కూడిన ఆర్టిక్యులర్ ఇన్ఫినిటివ్ కారణాన్ని తెలియజేస్తుంది; ἱκανῷ χρόνῳ గణనీయమైన లేదా దీర్ఘమైన కాలవ్యవధిని సూచిస్తుంది.
- source_word: ταῖς μαγείαις
  choice: తన మంత్రవిద్యలతో
  rationale: μαγεία మాంత్రిక ఆచారాలు లేదా విద్యలను సూచిస్తుంది. సందర్భానుసారం ‘తన’ను చేర్చడం వల్ల అవి సీమోనుకు చెందిన ఆచారాలని స్పష్టమవుతుంది; వాటి స్వరూపాన్ని మోసం లేదా అతీంద్రియ శక్తిగా నిర్ణయించదు.
- source_word: ἐξεστακέναι
  choice: ఆశ్చర్యపరుస్తూ ఉండడం
  rationale: ἐξίστημι ఇక్కడ విస్మయానికి గురిచేయడం అనే భావం ఇస్తుంది. గ్రీకు పరిపూర్ణ ఇన్ఫినిటివ్ చూపే పూర్వ ప్రభావం, కొనసాగిన పరిస్థితి తెలుగులో కారణ నిర్మాణంతో సహజంగా వ్యక్తమవుతుంది.
- source_word: αὐτούς
  choice: వారిని
  rationale: ఇది ἐξεστακέναι యొక్క ప్రత్యక్ష కర్మ; ముందు ప్రస్తావించిన ప్రజలను సూచిస్తుంది.
theological_decisions:
- issue: μαγείαιςలో సీమోను ఆచారాల స్వభావం
  choice: మంత్రవిద్యలు
  alternative: మాంత్రిక క్రియలు; చేతబడులు
  rationale: వచనం సీమోను ఆచారాలను μαγεία అని, అవి ప్రజలను ఆశ్చర్యపరిచాయని చెబుతుంది; అయితే అవి కేవలం మోసపూరిత విన్యాసాలా, క్షుద్ర ఆచారాలా, లేక రెండూ కలిసినవా అని నిర్ధారించదు. ‘మంత్రవిద్యలు’ ఆ అనిశ్చితిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. ప్రధాన వాక్యంలో గ్రీకు కారణ సంబంధం మరియు కొనసాగిన శ్రద్ధ భావం నిలుపబడ్డాయి.
