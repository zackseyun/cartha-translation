id: ACT.8.13
reference: Acts 8:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Σίμων καὶ αὐτὸς ἐπίστευσεν, καὶ βαπτισθεὶς ἦν προσκαρτερῶν τῷ Φιλίππῳ, θεωρῶν τε ⸂σημεῖα καὶ δυνάμεις μεγάλας γινομένας⸃ ἐξίστατο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/013.yaml
  text: And Simon himself also believed[a], and after being baptized he continued with Philip, and as he saw signs and great works of power happening, he was amazed.
translation:
  language: te
  text: సీమోను కూడా నమ్మాడు. బాప్తిస్మం పొందిన తరువాత అతడు ఫిలిప్పుతోనే ఉండేవాడు. జరుగుతున్న సూచక క్రియలను, గొప్ప శక్తికార్యాలను[a] చూస్తూ అతడు విస్మయపడేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గొప్ప అద్భుతాలను.” ఇక్కడి గ్రీకు పదం శక్తి ప్రదర్శనలను, అద్భుత కార్యాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: తాను కూడా
  rationale: αὐτός లోని నొక్కిచెప్పే భావాన్ని, καί లోని ‘కూడా’ అనే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐπίστευσεν
  choice: నమ్మాడు
  rationale: క్రియ చెప్పినదానికంటే మించి సీమోను విశ్వాసం నిజమైనదా కాదా అని నిర్ణయించకుండా, మూలంలోని సరళమైన ప్రకటనను నిలుపుతుంది.
- source_word: βαπτισθεὶς
  choice: బాప్తిస్మం పొందిన తరువాత
  rationale: ఈ భూతకాల కర్మణి అసమాపక క్రియ ప్రధాన చర్యకు ముందే జరిగినదని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἦν προσκαρτερῶν τῷ Φιλίππῳ
  choice: ఫిలిప్పుతోనే ఉంటూ వచ్చాడు
  rationale: కొనసాగుతూ ఉన్న సన్నిహిత అనుబంధాన్ని సూచించే గ్రీకు పరిభాషాత్మక అసంపూర్ణ భూతకాల భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: θεωρῶν
  choice: చూస్తూ
  rationale: జరుగుతున్న వాటిని అతడు నిరంతరం గమనించడానికీ, అతని ఆశ్చర్యానికీ ఉన్న సంబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: σημεῖα
  choice: సూచక క్రియలు
  rationale: కేవలం అద్భుత సంఘటనలు అనే అర్థమే కాక, అవి మరొక వాస్తవాన్ని సూచించే క్రియలనే భావాన్నీ నిలుపుతుంది.
- source_word: δυνάμεις μεγάλας
  choice: గొప్ప శక్తికార్యాలు
  rationale: దైవిక శక్తి ప్రత్యక్షమయ్యే కార్యాలు అనే మూలపద భావాన్ని ‘అద్భుతాలు’ అని మాత్రమే వ్యాఖ్యానించి పరిమితం చేయకుండా ప్రతిబింబిస్తుంది.
- source_word: γινομένας
  choice: జరుగుతున్న
  rationale: ఆ కార్యాలు సీమోను కళ్లముందు జరుగుతూ ఉన్నాయనే వర్తమాన అసమాపక క్రియ భావాన్ని నిలుపుతుంది.
- source_word: ἐξίστατο
  choice: ఆశ్చర్యచకితుడయ్యాడు
  rationale: సాధారణ ఆశ్చర్యంకన్నా బలమైన విస్మయాన్ని సూచించే ἐξίστατο భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: సీమోను నమ్మడం నిజమైన మారుమనస్సా కాదా అని అనువాదంలోనే నిర్ణయించాలా
  choice: ἐπίστευσεν ను ఎలాంటి అర్హతా పదం లేకుండా ‘నమ్మాడు’ అని అనువదించడం
  alternative: ‘నిజంగా నమ్మాడు,’ ‘నమ్మినట్లు ప్రకటించాడు,’ లేదా ‘పైపైకి నమ్మాడు’
  rationale: ఈ వచనం అతడు నమ్మి బాప్తిస్మం పొందాడని చెబుతుంది; తరువాతి కథనం వ్యాఖ్యాన సంబంధమైన ఉద్రిక్తతను కలిగిస్తుంది. అందువల్ల గ్రీకు స్పష్టంగా చెప్పినదానినే అనువదించి, విశ్వాస స్వభావాన్ని ముందుగానే తీర్మానించలేదు.
- issue: δυνάμεις ను నేరుగా ‘అద్భుతాలు’గా వ్యాఖ్యానించాలా
  choice: ప్రధాన పాఠ్యంలో ‘శక్తికార్యాలు’ అని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇవ్వడం
  alternative: ‘గొప్ప అద్భుతాలు’
  rationale: δυνάμεις శక్తి ప్రదర్శనలకూ అద్భుత కార్యాలకూ వాడబడగలదు. ‘శక్తికార్యాలు’ మూలరూపకాన్ని నిలుపుతుండగా, పాదసూచిక సాధారణ ప్రత్యామ్నాయాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. పొడవైన గ్రీకు వాక్యాన్ని మూడు తెలుగు వాక్యాలుగా విభజించి సహజ ప్రవాహాన్ని కల్పించాం; భావసంబంధాలు మాత్రం నిలుపుకున్నాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘గొప్ప శక్తికార్యాలను’ అన్న పదబంధం వెంట ఉంచాం.
