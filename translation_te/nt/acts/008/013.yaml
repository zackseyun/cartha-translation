revisions:
- from: సీమోను తాను కూడా నమ్మాడు. బాప్తిస్మం పొందిన తరువాత అతడు ఫిలిప్పుతోనే ఉంటూ వచ్చాడు. జరుగుతున్న సూచక క్రియలను, గొప్ప శక్తికార్యాలను[a] చూస్తూ అతడు ఆశ్చర్యచకితుడయ్యాడు.
  to: సీమోను కూడా నమ్మాడు. బాప్తిస్మం పొందిన తరువాత అతడు ఫిలిప్పుతోనే ఉండేవాడు. జరుగుతున్న సూచక క్రియలను, గొప్ప శక్తికార్యాలను[a] చూస్తూ అతడు విస్మయపడేవాడు.
  rationale: The revision uses idiomatic Telugu for Simon's emphatic inclusion, clarifies his continuing attachment to Philip, and renders the ongoing force of the final imperfect as “విస్మయపడేవాడు.” It preserves the source's theological restraint concerning Simon's belief and retains the lexical ambiguity of δυνάμεις in the footnote.
