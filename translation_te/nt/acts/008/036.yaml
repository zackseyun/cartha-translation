id: ACT.8.36
reference: Acts 8:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς δὲ ἐπορεύοντο κατὰ τὴν ὁδόν, ἦλθον ἐπί τι ὕδωρ, καί φησιν ὁ εὐνοῦχος· Ἰδοὺ ὕδωρ, τί κωλύει με ⸀βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/036.yaml
  text: And as they were going along the road, they came to some water, and the eunuch says, “Look, water! What prevents me from being baptized?”
translation:
  language: te
  text: వారు దారిలో వెళ్తుండగా కొంత నీరు ఉన్న చోటికి వచ్చారు. అప్పుడు నపుంసకుడు, “ఇదిగో, నీరు! నేను బాప్తిస్మం పొందడానికి అడ్డేమిటి?” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ εὐνοῦχος
  choice: నపుంసకుడు
  rationale: మూలంలోని రాజసభాధికారి శారీరక/సామాజిక హోదాను నేరుగా నిలుపుతుంది; కేవలం ‘అధికారి’ అని అనువదిస్తే మూలపదంలోని ముఖ్య భావం పోతుంది.
- source_word: ἐπί τι ὕδωρ
  choice: కొంత నీరు ఉన్న చోటికి
  rationale: ‘ఏదో నీటి దగ్గరకు’ అనే అక్షరార్థపు అసహజతను నివారిస్తూ, నిర్దిష్టం కాని నీటి ప్రదేశాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: φησιν
  choice: అన్నాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని తెలుగు కథనశైలిలో సహజమైన భూతకాలంతో అందిస్తుంది; మాట యొక్క తక్షణత్వం ప్రత్యక్ష సంభాషణలో నిలుస్తుంది.
- source_word: βαπτισθῆναι
  choice: బాప్తిస్మం పొందడానికి
  rationale: కర్మణి రూపాన్ని నిలుపుతూ, క్రైస్తవ సందర్భంలో విస్తృతంగా అర్థమయ్యే ప్రామాణిక పదాన్ని ఉపయోగిస్తుంది.
- source_word: τί κωλύει με
  choice: నాకు అడ్డేమిటి?
  rationale: అనుమతి లేదా అర్హత గురించి స్పష్టమైన సమాధానాన్ని ముందుగానే చేర్చకుండా, మూలంలోని తెరచిన ప్రశ్నను నిలుపుతుంది.
theological_decisions:
- issue: బాప్తిస్మానికి అడ్డంకి ఏమిటనే ప్రశ్న
  choice: “నేను బాప్తిస్మం పొందడానికి అడ్డేమిటి?”
  alternative: “నేను బాప్తిస్మం పొందకూడదనడానికి కారణమేమిటి?”
  rationale: మూలంలోని సంక్షిప్తమైన, తెరచిన ప్రశ్నను నిలుపుతుంది; బాప్తిస్మానికి సంబంధించిన అదనపు సిద్ధాంతపరమైన షరతులను ఈ వచనంలోకి చేర్చదు.
- issue: కొన్ని తరువాతి ప్రతుల్లో కనిపించే అపొస్తలుల కార్యములు 8:37
  choice: ఈ వచనంలో అదనపు విశ్వాస ప్రకటనను చేర్చలేదు
  alternative: విశ్వాస ఒప్పుకోలును తెలిపే 8:37 పాఠాన్ని ఇక్కడ జోడించడం
  rationale: అందించిన SBLGNT మూలపాఠంలో ఆ వాక్యం లేదు; కాబట్టి 8:36 అనువాదంలో దాన్ని దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘నపుంసకుడు’ మూలపదాన్ని స్పష్టంగా నిలుపుతుంది; ‘బాప్తిస్మం’ సాధారణ తెలుగు క్రైస్తవ వాడుకకు అనుగుణం.
