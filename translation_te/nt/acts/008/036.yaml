revisions:
- from: వారు దారిలో వెళ్తుండగా కొంత నీరు ఉన్న చోటికి వచ్చారు. అప్పుడు నపుంసకుడు, “ఇదిగో, ఇక్కడ నీరు ఉంది! నేను బాప్తిస్మం పొందడానికి అడ్డేమిటి?” అన్నాడు.
  to: వారు దారిలో వెళ్తుండగా కొంత నీరు ఉన్న చోటికి వచ్చారు. అప్పుడు నపుంసకుడు, “ఇదిగో, నీరు! నేను బాప్తిస్మం పొందడానికి అడ్డేమిటి?” అన్నాడు.
  rationale: The revision removes the unstated locative “ఇక్కడ” and renders the eunuch’s exclamation with the source’s concise, emphatic “ఇదిగో, నీరు!” All other wording is retained because it is accurate, natural modern Telugu and preserves the source’s open question without importing baptismal conditions.
