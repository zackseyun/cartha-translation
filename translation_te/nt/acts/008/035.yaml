source:
  edition: SBLGNT
  text: ἀνοίξας δὲ ὁ Φίλιππος τὸ στόμα αὐτοῦ καὶ ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/035.yaml
  text: Then Philip opened his mouth[a], and beginning from this Scripture[b], he proclaimed the good news about Jesus to him.
translation:
  language: te
  text: అప్పుడు ఫిలిప్పు నోరు తెరిచి[a], ఈ లేఖనం నుండి మొదలుపెట్టి, అతనికి యేసును గురించిన శుభవార్తను ప్రకటించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, మాట్లాడడం మొదలుపెట్టి.
    reason: idiom_explanation
  - marker: b
    text: లేదా, ‘అతనికి యేసును ప్రకటించాడు.’ గ్రీకు వాక్యనిర్మాణంలో యేసు ప్రకటించిన శుభవార్త యొక్క విషయాన్ని సూచిస్తాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοίξας ... τὸ στόμα αὐτοῦ
  choice: నోరు తెరిచి
  rationale: ఇది మాట్లాడడం మొదలుపెట్టడాన్ని సూచించే గ్రీకు నుడికారం. తెలుగు పాఠకులకు అర్థమయ్యే విధంగానే ఉండి, మూలంలోని గంభీరమైన కథన శైలిని కూడా నిలుపుతుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ δέ కథనాన్ని తదుపరి చర్యవైపు నడిపిస్తుంది. ‘అప్పుడు’ ఆ పురోగతిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης
  choice: ఈ లేఖనం నుండి మొదలుపెట్టి
  rationale: ἀπό సూచించే ఆరంభ బిందువును ‘నుండి’ స్పష్టంగా నిలుపుతుంది. γραφήను కేవలం ఒక వాక్యభాగంగా కాక పవిత్ర లేఖనంగా సూచించేందుకు ‘లేఖనం’ వాడబడింది.
- source_word: εὐηγγελίσατο
  choice: శుభవార్తను ప్రకటించాడు
  rationale: ఈ క్రియ శుభవార్తను తెలియజేయడం లేదా ప్రకటించడం అనే భావాన్ని ఇస్తుంది. ‘ప్రకటించాడు’ సందర్భానికి తగినదిగా, సాధారణ పాఠకులకు సులభంగా ఉంటుంది.
- source_word: αὐτῷ
  choice: అతనికి
  rationale: గ్రీకు సర్వనామాన్ని నేరుగా అనువదిస్తూ, ఈ వచనంలో లేని నామవాచకాన్ని చేర్చకుండా ముందున్న ఇతియోపీయ అధికారిని సూచిస్తుంది.
- source_word: τὸν Ἰησοῦν
  choice: యేసును గురించిన
  rationale: εὐαγγελίζομαιతో వచ్చిన కర్మకారక రూపం ప్రకటించిన శుభవార్త యొక్క విషయాన్ని సూచించగలదు. సహజమైన తెలుగులో యేసే ఆ ప్రకటనకు కేంద్రం అని ఇది స్పష్టం చేస్తుంది; అక్షరార్థ నిర్మాణం పాదసూచికలో నిలుపబడింది.
theological_decisions:
- issue: εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν యొక్క భావం
  choice: అతనికి యేసును గురించిన శుభవార్తను ప్రకటించాడు
  alternative: అతనికి యేసును ప్రకటించాడు
  rationale: గ్రీకు నిర్మాణంలో యేసు సువార్త ప్రకటన యొక్క విషయం, కేంద్రంగా ఉన్నాడు. ఎంపిక చేసిన రూపం ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘నోరు తెరిచి’ అనే మూల నుడికారాన్ని నిలిపి దాని భావాన్ని పాదసూచికలో వివరించాం. ‘లేఖనం’ పవిత్ర గ్రంథాన్ని సూచించే సందర్భోచిత పదంగా వాడబడింది.
