id: ACT.8.22
reference: Acts 8:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μετανόησον οὖν ἀπὸ τῆς κακίας σου ταύτης, καὶ δεήθητι τοῦ ⸀κυρίου εἰ ἄρα ἀφεθήσεταί σοι ἡ ἐπίνοια τῆς καρδίας σου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/022.yaml
  text: Therefore repent of this wickedness of yours[a], and pray to the Lord, if perhaps the intent of your heart may be forgiven you.
translation:
  language: te
  text: కాబట్టి నీ ఈ దుష్టత్వాన్ని విడిచి పశ్చాత్తాపపడు; నీ హృదయంలోని ఉద్దేశం[a] నీకు క్షమించబడుతుందేమో అని ప్రభువును వేడుకో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ హృదయంలోని ఆలోచన నీకు క్షమించబడుతుందేమో.”
    reason: ἐπίνοια అనే పదానికి ‘ఉద్దేశం’తో పాటు ‘ఆలోచన’ అనే అర్థమూ ఉండగలదని చూపించే పదార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: μετανόησον
  choice: పశ్చాత్తాపపడు
  rationale: నిర్ణయాత్మకమైన మనోమార్పు మరియు పాపం నుండి తిరుగుదలను సూచించే ఆజ్ఞ; ఆధునిక తెలుగు క్రైస్తవ వాడుకలో సహజంగా, గంభీరంగా ఉంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి గద్దింపు నుండి వచ్చే తార్కిక పర్యవసానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀπὸ τῆς κακίας σου ταύτης
  choice: నీ ఈ దుష్టత్వాన్ని విడిచి
  rationale: ἀπόలోని ‘నుండి దూరమవడం’ అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, κακίαను నైతిక దుష్టత్వంగా చూపిస్తుంది.
- source_word: δεήθητι
  choice: వేడుకో
  rationale: సాధారణ ప్రార్థనకన్నా earnest plea అనే బలాన్ని నిలుపుతుంది; ప్రభువును ఉద్దేశించి చేసే మనవికి సహజమైన తెలుగు.
- source_word: τοῦ κυρίου
  choice: ప్రభువును
  rationale: κύριοςకు ప్రామాణికమైన, గౌరవప్రదమైన సమానార్థకం; ఇక్కడ అది యేసునా లేక దేవుడా అన్నదాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: εἰ ἄρα
  choice: …ఉందేమో అని
  rationale: క్షమాపణను హామీగా కాక సాధ్యతతో, జాగ్రత్తగా చెప్పే గ్రీకు భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀφεθήσεταί σοι
  choice: నీకు క్షమించబడుతుందేమో
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ, క్షమించేవారిని వాక్యంలో స్పష్టంగా చేర్చకుండా దైవిక క్షమాపణ భావాన్ని కాపాడుతుంది.
- source_word: ἡ ἐπίνοια τῆς καρδίας σου
  choice: నీ హృదయంలోని ఉద్దేశం
  rationale: ἐπίνοιαలోని ఆలోచన/ఉద్దేశం అనే అర్థవిస్తృతిలో, సందర్భంలోని అంతరంగ సంకల్పాన్ని ‘ఉద్దేశం’ స్పష్టంగా తెలియజేస్తుంది; ‘హృదయంలోని’ సహజమైన తెలుగు సంబంధాన్ని ఇస్తుంది.
theological_decisions:
- issue: క్షమాపణ లభించే సాధ్యతలోని నిశ్చయ స్థాయి
  choice: ‘క్షమించబడుతుందేమో’ అని షరతుతో కూడిన ఆశను వ్యక్తం చేయడం
  alternative: పశ్చాత్తాపపడితే తప్పక క్షమించబడుతుందని హామీ ఇవ్వడం; లేదా క్షమాపణ దాదాపు అసాధ్యమని సూచించడం
  rationale: εἰ ἄρα క్షమాపణను హామీగా గానీ నిరాశగా గానీ మార్చకుండా జాగ్రత్తతో కూడిన సాధ్యతను వ్యక్తం చేస్తుంది.
- issue: ‘ప్రభువు’ అనే పదం ఎవరిని సూచిస్తుంది
  choice: అర్థాన్ని ‘ప్రభువు’గానే ఉంచి వ్యక్తిని మరింత నిర్దిష్టం చేయకపోవడం
  alternative: ‘ప్రభువైన యేసు’ లేదా ‘దేవుడు’ అని విస్తరించడం
  rationale: మూలపాఠం κύριος మాత్రమే అంటుంది; అనువాదం సందర్భం అనుమతించే సూచన పరిధిని కుదించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఏకవచన సంభాషణ. ‘పశ్చాత్తాపపడు,’ ‘ప్రభువు,’ ‘క్షమించబడుతుంది’ వంటి పరిచిత బైబిలు పదజాలాన్ని ఉంచి, గ్రీకు వాక్యంలోని షరతు మరియు అంతరంగ ఉద్దేశంపై ఉన్న దృష్టిని కాపాడింది.
