- from: అప్పుడు వారు వారి మీద చేతులు ఉంచుతూ ఉండగా, వారు పవిత్రాత్మను పొందుతూ ఉన్నారు.[a]
  to: అప్పుడు వారు వారిమీద చేతులు ఉంచారు, వారు పరిశుద్ధాత్మను పొందారు.[a]
  rationale: The revision removes the unsupported temporal subordination introduced by “ఉండగా,” restores the source’s coordinate presentation, and uses fluent modern Telugu narrative. The footnote preserves the relevant fact that both Greek verbs are imperfect, consistent with the English audit trail, while avoiding an awkward main-text rendering.
