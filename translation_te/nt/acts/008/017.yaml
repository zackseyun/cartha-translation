    reason: క్రియల దృక్కోణానికి సంబంధించిన అనువాద ప్రత్యామ్నాయం
  revision_rationale: The revision removes the unsupported temporal subordination introduced by “ఉండగా,” restores the source’s coordinate presentation, and uses fluent modern Telugu narrative. The footnote preserves the relevant fact that both Greek verbs are imperfect, consistent with the English audit trail, while avoiding an awkward main-text rendering.
