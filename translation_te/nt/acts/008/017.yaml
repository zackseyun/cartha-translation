translation:
  language: te
  text: అప్పుడు వారు వారిమీద చేతులు ఉంచారు, వారు పరిశుద్ధాత్మను పొందారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, గ్రీకు క్రియల అపూర్ణ భూతకాల రూపాన్ని మరింత స్పష్టంగా చూపుతూ: “అప్పుడు వారు వారిమీద చేతులు ఉంచుతూ ఉన్నారు, వారు పరిశుద్ధాత్మను పొందుతూ ఉన్నారు.”'
    reason: క్రియల దృక్కోణానికి సంబంధించిన అనువాద ప్రత్యామ్నాయం
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: తరువాత జరిగిన కార్యాన్ని సూచించే సహజమైన తెలుగు కాలక్రమ పదం.
- source_word: ἐπετίθεσαν τὰς χεῖρας ἐπ’ αὐτούς
  choice: వారు వారి మీద చేతులు ఉంచుతూ ఉండగా
  rationale: చేతులు ఉంచడం అనే గ్రీకు ప్రయోగాన్ని సహజంగా వ్యక్తపరుస్తూ, అపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న లేదా పునరావృత కార్యాన్ని నిలుపుతుంది.
- source_word: ἐλάμβανον
  choice: పొందుతూ ఉన్నారు
  rationale: అపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న లేదా పలువురికి వరుసగా జరిగిన స్వభావాన్ని అతిగా నిర్దిష్టం చేయకుండా ప్రతిబింబిస్తుంది.
- source_word: πνεῦμα ἅγιον
  choice: పవిత్రాత్మను
  rationale: లూకా–అపొస్తలుల కార్యముల సందర్భంలో ఇది దేవుని పవిత్రాత్మను సూచిస్తుంది; తెలుగు క్రైస్తవ వాడుకలో సహజమైన వ్యక్తిగత దైవ సూచన.
theological_decisions:
- issue: πνεῦμα ἅγιον నిర్దిష్టమైన దేవుని ఆత్మనా, అనిర్దిష్టమైన పవిత్ర ఆత్మనా
  choice: పవిత్రాత్మను
  alternative: ఒక పవిత్ర ఆత్మను
  rationale: తక్షణ సందర్భం మరియు లూకా–అపొస్తలుల కార్యముల వాడుక వాగ్దానం చేయబడిన దేవుని ఆత్మనే సూచిస్తాయి; అనిర్దిష్ట రూపం భావాన్ని తప్పుదోవ పట్టిస్తుంది.
- issue: రెండు అపూర్ణ భూతకాల క్రియల దృక్కోణాన్ని ఎలా వ్యక్తపరచాలి
  choice: చేతులు ఉంచుతూ ఉండగా ... పొందుతూ ఉన్నారు
  alternative: చేతులు ఉంచారు ... పవిత్రాత్మను పొందారు
  rationale: గ్రీకులో రెండు క్రియలూ imperfect రూపంలో ఉన్నాయి. ప్రధాన పాఠం వాటి కొనసాగుతున్న లేదా వరుసగా జరుగుతున్న స్వభావాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది; అయితే సాధారణ భూతకాల అనువాదం సహజమైన కథన ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు imperfect రూపాల నిజమైన దృక్కోణాన్ని ప్రధాన పాఠంలో నిలుపుతూ, సహజ కథన రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
