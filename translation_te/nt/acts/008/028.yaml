  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἦν ⸀τε ὑποστρέφων καὶ καθήμενος ἐπὶ τοῦ ἅρματος αὐτοῦ καὶ ἀνεγίνωσκεν τὸν προφήτην Ἠσαΐαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/028.yaml
  text: And he was returning[a], seated in his chariot[b], and was reading Isaiah the prophet.
translation:
  language: te
  text: అతడు తిరిగి వెళ్తూ, తన రథంలో కూర్చొని, యెషయా ప్రవక్త గ్రంథాన్ని[a] చదువుతూ ఉన్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో అక్షరార్థంగా ‘ప్రవక్త యెషయాను’ అని ఉంది; ఇక్కడ యెషయా పేరుతో ఆయన గ్రంథం ఉద్దేశించబడింది.
    reason: lexical_alternative
  - marker: b
    text: ప్రాచీన కాలంలో తరచుగా బిగ్గరగా చదివేవారు. కాబట్టి ‘బిగ్గరగా చదువుతూ ఉన్నాడు’ అనే భావం సాధ్యమే; అయితే ఇక్కడి గ్రీకు క్రియ దానిని స్పష్టంగా చెప్పదు.
    reason: cultural_note
lexical_decisions:
- source_word: ἦν τε ὑποστρέφων
  choice: అతడు తిరిగి వెళ్తూ
  rationale: ἦν తో వర్తమాన కృదంతం కలిసి గతంలో కొనసాగుతున్న చర్యను సూచిస్తుంది. ‘తిరిగి వెళ్తూ’ ఆ కొనసాగుతున్న భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; మూలంలో లేని ‘ఇంటికి’ అనే భావాన్ని చేర్చదు. τέ అనే స్వల్ప అనుసంధాన పదాన్ని తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా అనువదించలేదు.
- source_word: καθήμενος
  choice: కూర్చొని
  rationale: ప్రయాణ సమయంలో అతని శరీరస్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπὶ τοῦ ἅρματος αὐτοῦ
  choice: తన రథంలో
  rationale: ἐπί అక్షరార్థంగా ‘మీద’ అనే భావం ఇవ్వగలిగినా, వాహనంలో ప్రయాణించడాన్ని తెలుగులో ‘రథంలో’ అనడం సహజం. αὐτοῦ సందర్భానుసారంగా ‘తన’ అని అనువదించబడింది.
- source_word: ἀνεγίνωσκεν
  choice: చదువుతున్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న చర్యను సూచిస్తుంది. ప్రాచీన కాలంలో బిగ్గరగా చదవడం సాధారణమైనా, ఈ క్రియ స్వయంగా ‘బిగ్గరగా’ అని స్పష్టంగా చెప్పదు.
- source_word: τὸν προφήτην Ἠσαΐαν
  choice: యెషయా ప్రవక్త గ్రంథాన్ని
  rationale: గ్రీకులో అక్షరార్థంగా ‘యెషయా ప్రవక్తను’ అని ఉన్నా, ఇక్కడ వ్యక్తి పేరుతో అతని గ్రంథాన్ని సూచించే ప్రయోగం ఉంది. ఆధునిక తెలుగు పాఠకులకు అర్థం స్పష్టంగా ఉండేందుకు ‘గ్రంథాన్ని’ చేర్చబడింది; ‘రాసిన’ అని చేర్చి మూలానికి మించిన స్పష్టీకరణ చేయలేదు.
