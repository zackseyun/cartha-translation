  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. కొనసాగుతున్న చర్యల భావాన్ని కృదంతం మరియు ‘చదువుతున్నాడు’ రూపాలతో నిలిపి ఉంచాం.
