id: ACT.8.19
reference: Acts 8:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγων· Δότε κἀμοὶ τὴν ἐξουσίαν ταύτην ἵνα ᾧ ἐὰν ἐπιθῶ τὰς χεῖρας λαμβάνῃ πνεῦμα ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/019.yaml
  text: saying[a], “Give me also this authority, so that anyone on whom I lay my hands may receive the Holy Spirit.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “నేను ఎవరి మీద చేతులు ఉంచితే వారు పరిశుద్ధాత్మను పొందుతారో, ఈ అధికారాన్ని[a] నాకు కూడా ఇవ్వండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “శక్తిని.” గ్రీకు పదం అధికారం, హక్కు, లేదా పనిచేయగల శక్తిని సూచించవచ్చు. నేరుగా ‘శక్తి’ని సూచించే ఇతర గ్రీకు పదాల నుంచి పదభేదాన్ని నిలుపడానికి ఇక్కడ “అధికారాన్ని” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: అతడు ఇలా అన్నాడు
  rationale: ముందటి వాక్యంతో అనుసంధానమైన వర్తమాన కృదంతాన్ని తెలుగు కథనశైలిలో సహజంగా ప్రధాన క్రియగా వ్యక్తం చేస్తుంది.
- source_word: Δότε
  choice: ఇవ్వండి
  rationale: δίδωμι యొక్క బహువచన ఆజ్ఞారూపానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: κἀμοί
  choice: నాకు కూడా
  rationale: καί + ἐμοίలోని చేర్పు భావాన్ని స్పష్టంగా నిలుపుతుంది; సీమోను తానూ అదే పొందాలని అడుగుతున్నాడు.
- source_word: ἐξουσίαν
  choice: అధికారం
  rationale: ἐξουσίαలోని అధికారం, హక్కు, కార్యనిర్వహణ సామర్థ్యం అనే పరిధిలో ‘అధికారం’ ప్రధాన భావాన్ని నిలుపుతూ, నేరుగా శక్తిని సూచించే ఇతర గ్రీకు పదాల నుంచి పదభేదాన్ని కాపాడుతుంది.
- source_word: ταύτην
  choice: ఈ
  rationale: సీమోను ఇప్పుడే గమనించిన నిర్దిష్ట అధికారాన్ని సూచిస్తుంది.
- source_word: ἵνα
  choice: ఎవరి మీద…వారు…పొందుతారో
  rationale: తెలుగులో కోరుతున్న అధికారం యొక్క ఉద్దేశిత ఫలితాన్ని సహజమైన సంబంధ వాక్య నిర్మాణంలో తెలియజేస్తుంది.
- source_word: ᾧ ἐὰν
  choice: ఎవరి మీద…వారు
  rationale: సాపేక్ష సర్వనామం మరియు ἐάν కలిగించే అనిర్దిష్టమైన ‘ఎవరైనా’ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπιθῶ τὰς χεῖρας
  choice: నేను…చేతులు ఉంచితే
  rationale: చేతులు ఉంచడం అనే స్పష్టమైన క్రియాచిత్రాన్ని నిలుపుతుంది; గ్రీకులోని బహువచన ‘చేతులు’నూ కాపాడుతుంది.
- source_word: λαμβάνῃ
  choice: పొందుతారో
  rationale: ἵναతో వచ్చిన వర్తమాన సంభావనార్థక రూపం సూచించే ఉద్దేశిత ఫలితాన్ని తెలుగు వాక్య నిర్మాణంలో సహజంగా తెలియజేస్తుంది.
- source_word: πνεῦμα ἅγιον
  choice: పరిశుద్ధాత్మను
  rationale: అపొస్తలుల కార్యముల సందర్భంలో ఇది దేవుని ఆత్మనే సూచిస్తుంది; తెలుగులో ఈ వ్యక్తిగత దైవిక సూచనకు ‘పరిశుద్ధాత్మ’ సహజమైన రూపం.
theological_decisions:
- issue: గ్రీకులో ఉపపదం లేనందున πνεῦμα ἅγιονను అనిర్దిష్టంగా అర్థం చేసుకోవాలా?
  choice: పరిశుద్ధాత్మను
  alternative: ఒక పరిశుద్ధ ఆత్మను
  rationale: అపొస్తలుల కార్యముల కథన సందర్భం దేవుని పరిశుద్ధాత్మను స్పష్టంగా సూచిస్తుంది. ‘ఒక పరిశుద్ధ ఆత్మ’ అని అనువదించడం సందర్భం మద్దతు ఇవ్వని వేరొక అర్థాన్ని కలిగిస్తుంది.
- issue: ἐξουσίαను ‘అధికారం’గా లేదా ‘శక్తి’గా అనువదించాలా?
  choice: అధికారం
  alternative: శక్తి
  rationale: పదం అధికారం, హక్కు, కార్యసామర్థ్యం అనే అర్థపరిధిని కలిగి ఉంది. ఇక్కడ ప్రభావవంతమైన శక్తి సందర్భంలో అంతర్భూతమైనా, ‘అధికారం’ మూలపదంలోని ప్రత్యేక భావాన్ని మెరుగ్గా నిలుపుతుంది; ‘శక్తి’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, ఉద్దేశ్య సంబంధాన్ని తెలుగులో స్పష్టంగా చూపేందుకు సంబంధ-షరతు నిర్మాణం వాడబడింది. పాదసూచిక గుర్తు సంబంధిత ‘అధికారాన్ని’ పదం తరువాత ఉంచబడింది.
