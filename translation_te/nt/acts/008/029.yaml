  revision_rationale: The revision retains the Greek sequence, ‘the Spirit,’ the proximal ‘this chariot,’ and the instruction to approach and remain close. It avoids an unnecessarily physical interpretation of κολλήθητι and removes an overly familiar explicit pronoun. The footnote preserves the viable contextual alternative of accompanying the chariot.
