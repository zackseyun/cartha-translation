revisions:
- from: అప్పుడు ఆత్మ ఫిలిప్పుతో, “నువ్వు దగ్గరికి వెళ్లి ఈ రథాన్ని అంటిపెట్టుకొని ఉండు[a]” అని చెప్పాడు.
  to: అప్పుడు ఆత్మ ఫిలిప్పుతో, “ఈ రథం దగ్గరకు వెళ్లి, దానికి దగ్గరగా ఉండు[a]” అని చెప్పింది.
  rationale: The revision retains the Greek sequence, ‘the Spirit,’ the proximal ‘this chariot,’ and the instruction to approach and remain close. It avoids an unnecessarily physical interpretation of κολλήθητι and removes an overly familiar explicit pronoun. The footnote preserves the viable contextual alternative of accompanying the chariot.
