id: ACT.8.29
reference: Acts 8:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ τὸ πνεῦμα τῷ Φιλίππῳ· Πρόσελθε καὶ κολλήθητι τῷ ἅρματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/029.yaml
  text: Then the Spirit said to Philip[a], “Go over and join this chariot.”
translation:
  language: te
  text: అప్పుడు ఆత్మ ఫిలిప్పుతో, “ఈ రథం దగ్గరకు వెళ్లి, దానికి దగ్గరగా ఉండు[a]” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దగ్గరకు వెళ్లి ఈ రథంతో పాటు ఉండు.”
    reason: κολλήθητι రథానికి చేరి దానికి సన్నిహితంగా, దానితో పాటు ఉండమనే భావాన్ని తెలియజేస్తుంది.
lexical_decisions:
- source_word: εἶπεν
  choice: చెప్పాడు
  rationale: ప్రత్యక్ష సంభాషణను పరిచయం చేసే కథన సందర్భంలో λέγω యొక్క భూతకాల రూపానికి సహజమైన తెలుగు ప్రయోగం.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ బలమైన వ్యతిరేకత కంటే కథన క్రమంలోని తదుపరి చర్యను సూచిస్తుంది.
- source_word: τὸ πνεῦμα
  choice: ఆత్మ
  rationale: మూలంలో ἅγιον లేకపోవడంతో ‘పరిశుద్ధాత్మ’ అని విస్తరించకుండా, అపొస్తలుల కార్యముల సందర్భంలో దైవిక వ్యక్తిని సూచించే నిర్దిష్ట రూపాన్ని నిలుపుతుంది.
- source_word: τῷ Φιλίππῳ
  choice: ఫిలిప్పుతో
  rationale: చెప్పే క్రియతో తెలుగు భాషలో సహజంగా వాడే సంభాషణ గ్రహీత రూపం.
- source_word: Πρόσελθε
  choice: దగ్గరికి వెళ్లి
  rationale: రథం వైపు కదలమనే ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; వక్తవైపు రావడం అనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: κολλήθητι
  choice: అంటిపెట్టుకొని ఉండు
  rationale: κολλάομαι లోని దగ్గరగా చేరి దానితో పాటు ఉండే భావాన్ని, కేవలం ‘చేరు’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: τῷ ἅρματι τούτῳ
  choice: ఈ రథాన్ని
  rationale: ἅρμα ను సందర్భోచితంగా ‘రథం’గా, τούτῳ యొక్క సమీప సూచనను ‘ఈ’గా అనువదిస్తుంది; ‘అంటిపెట్టుకొని ఉండు’తో సహజ తెలుగు కర్మరూపం వాడబడింది.
theological_decisions:
- issue: τὸ πνεῦμα యొక్క సూచిత వ్యక్తి
  choice: ‘ఆత్మ’—సందర్భంలో పరిశుద్ధాత్మను సూచిస్తుంది
  alternative: స్పష్టత కోసం ‘పరిశుద్ధాత్మ’ అని విస్తరించడం; లేదా వ్యక్తిత్వరహితమైన ఆత్మీయ ప్రేరణగా గ్రహించడం
  rationale: అపొస్తలుల కార్యములలో విశ్వాసులకు దైవిక దిశానిర్దేశం ఇచ్చే ‘ఆత్మ’ సాధారణంగా పరిశుద్ధాత్మే. అయినా మూలంలో ‘పరిశుద్ధ’ అనే విశేషణం లేనందున అనువాదం ‘ఆత్మ’ అనే రూపాన్నే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ఏకవచన ఆజ్ఞకు ‘నువ్వు’ భావం సహజంగా ఉన్నప్పటికీ, తెలుగులో స్పష్టత కోసం వాక్యంలో చేర్చబడింది. పురాతన వాహన సందర్భాన్ని నిలుపుటకు ‘రథం’ వాడబడింది.
