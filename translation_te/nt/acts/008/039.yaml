id: ACT.8.39
reference: Acts 8:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος, πνεῦμα κυρίου ἥρπασεν τὸν Φίλιππον, καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος, ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/039.yaml
  text: And when they came up out of the water[a], the Spirit of the Lord carried Philip away, and the eunuch saw him no longer, for he went on his way rejoicing.
translation:
  language: te
  text: వారు నీటి నుండి పైకి వచ్చినప్పుడు, ప్రభువు ఆత్మ ఫిలిప్పును తీసుకుపోయింది[a]. ఆ నపుంసకుడు ఇక అతన్ని చూడలేదు; అతడు సంతోషిస్తూ తన దారిన సాగిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఫిలిప్పును లాక్కొని తీసుకుపోయింది.” గ్రీకు క్రియ అకస్మాత్తుగా, బలంగా తొలగించడాన్ని నొక్కిచెప్పగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν ἐκ τοῦ ὕδατος
  choice: నీళ్లలోనుంచి పైకి వచ్చినప్పుడు
  rationale: ἀναβαίνω మరియు ἐκ కలిపి నీటిలోనుంచి పైకి రావడాన్ని సూచిస్తాయి. ఈ పదబంధం స్థలచలనాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, బాప్తిస్మ విధానంపై అదనపు నిర్ణయాన్ని రుద్దదు.
- source_word: πνεῦμα κυρίου
  choice: ప్రభువు ఆత్మ
  rationale: లూకా–అపొస్తలుల కార్యములు వాడుకలో ఇది దేవుని ఆత్మ యొక్క వ్యక్తిగత దైవిక కార్యాన్ని సహజంగా సూచిస్తుంది. తెలుగు బైబిలు భాషలో ‘ప్రభువు ఆత్మ’ స్పష్టమైన, గౌరవప్రదమైన రూపం.
- source_word: ἥρπασεν
  choice: ఎత్తుకొని వెళ్లిపోయాడు
  rationale: ἁρπάζω అకస్మాత్తుగా, బలంగా ఒకచోటినుంచి తీసివేయడాన్ని సూచించగలదు. ప్రధాన పాఠంలోని ఈ రూపం దైవికంగా తొలగించబడిన భావాన్ని సహజంగా అందిస్తుంది; బలాత్కార ఆకస్మికతను మరింత స్పష్టంచేసే ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: οὐκ εἶδεν αὐτὸν οὐκέτι
  choice: ఇక అతన్ని చూడలేదు
  rationale: ఈ సంఘటన తర్వాత నపుంసకుడు ఫిలిప్పును మళ్లీ చూడలేదనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ὁ εὐνοῦχος
  choice: ఆ నపుంసకుడు
  rationale: గ్రీకు నామవాచకాన్ని నేరుగా అనువదిస్తూ, ముందటి కథనంలోని వ్యక్తితో సంబంధాన్ని ‘ఆ’ ద్వారా కొనసాగిస్తుంది.
- source_word: ἐπορεύετο τὴν ὁδὸν αὐτοῦ
  choice: తన దారిన వెళ్లిపోయాడు
  rationale: అసంపూర్ణ క్రియ కొనసాగుతున్న ప్రయాణాన్ని చిత్రిస్తుంది. ‘తన దారిన వెళ్లిపోయాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి అతడు ప్రయాణం కొనసాగించాడనే భావాన్ని అందిస్తుంది.
- source_word: χαίρων
  choice: సంతోషిస్తూ
  rationale: వర్తమాన కృదంతం ప్రయాణంతో పాటు కొనసాగిన ఆనందాన్ని తెలియజేస్తుంది; ‘సంతోషిస్తూ’ దాని క్రియాత్మక స్వరూపాన్ని నిలుపుతుంది.
theological_decisions:
- issue: πνεῦμα κυρίου పరిశుద్ధాత్మను సూచిస్తుందా, లేక ప్రభువు నుండి వచ్చిన అవ్యక్త శక్తిని సూచిస్తుందా
  choice: వ్యక్తిగత దైవిక కార్యాన్ని సూచించే ‘ప్రభువు ఆత్మ’
  alternative: ‘ప్రభువు నుండి వచ్చిన ఒక ఆత్మ’ లేదా అవ్యక్త దైవశక్తి
  rationale: లూకా–అపొస్తలుల కార్యములలో ఈ పదబంధం సాధారణంగా దేవుని ఆత్మ స్వయంగా కార్యం చేయడాన్ని సూచిస్తుంది. ‘ప్రభువు ఆత్మ’ మూలపాఠానికి మించి వివరణను చేర్చకుండా ఆ సహజ పఠనాన్ని నిలుపుతుంది.
- issue: ἥρπασεν అద్భుతమైన, అకస్మాత్తు తొలగింపును ఎంత స్పష్టంగా వ్యక్తపరచాలి
  choice: ‘ఎత్తుకొని వెళ్లిపోయాడు’ ద్వారా దైవిక తొలగింపును తెలిపి, బలమైన ఆకస్మికతను పాదసూచికలో చూపడం
  alternative: ప్రధాన పాఠంలోనే ‘లాక్కొని వెళ్లిపోయాడు’ అని బలంగా అనువదించడం
  rationale: కథనం దైవిక జోక్యాన్ని సూచిస్తుంది; అయితే క్రియలోని బలాన్ని అతిగా కఠినంగా వినిపించకుండా ప్రధాన పాఠం చదవదగినదిగా ఉంచి, నిజమైన పదార్థ పరిధిని పాదసూచిక సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘నీళ్లు,’ ‘తన దారిన,’ ‘సంతోషిస్తూ’ వంటి సాధారణ పదాలతో పఠన సౌలభ్యం నిలుపబడింది; ‘ప్రభువు ఆత్మ,’ ‘నపుంసకుడు’ మూలపాఠానికి దగ్గరగా ఉండే స్థిరమైన బైబిలు పదజాలంగా ఉంచబడ్డాయి.
