  to: 'అయితే పౌలు ఇలా అన్నాడు: “నేను కైసరు న్యాయపీఠం[a] ఎదుట నిలిచి ఉన్నాను; ఇక్కడే నాకు విచారణ జరగాలి. యూదులకు నేను ఏ అపకారమూ చేయలేదు[b]—ఈ సంగతి మీకు కూడా బాగా తెలుసు.”'
