id: ACT.25.10
reference: Acts 25:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Παῦλος· ⸂Ἐπὶ τοῦ βήματος Καίσαρος ἑστώς⸃ εἰμι, οὗ με δεῖ κρίνεσθαι. Ἰουδαίους οὐδὲν ⸀ἠδίκησα, ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/010.yaml
  text: But Paul said[a], “I am standing before Caesar’s tribunal, where I ought to be judged. I have done no wrong to the Jews[c][b], as you yourself know very well.”
translation:
  language: te
  text: 'అయితే పౌలు ఇలా అన్నాడు: “నేను కైసరు న్యాయపీఠం[a] ఎదుట నిలిచి ఉన్నాను; ఇక్కడే నాకు విచారణ జరగాలి. యూదులకు నేను ఏ అపకారమూ చేయలేదు[b]—ఈ సంగతి మీకు కూడా బాగా తెలుసు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కైసరు న్యాయస్థానం.” గ్రీకు βῆμα అధికారిక న్యాయాసనాన్ని లేదా న్యాయస్థానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “యూదుల విషయంలో నేను ఏ నేరమూ చేయలేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βῆμα
  choice: న్యాయపీఠం
  rationale: రోమా అధికారిక న్యాయవిచారణ స్థానాన్ని సూచించే పదం. ‘న్యాయపీఠం’ భౌతిక ఆసనంతో పాటు న్యాయాధికార భావాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: Καίσαρος
  choice: కైసరు
  rationale: సామ్రాజ్య బిరుదును, రోమా చారిత్రక-న్యాయ నేపథ్యాన్ని నిలుపుతుంది.
- source_word: ἑστώς εἰμι
  choice: నిలిచి ఉన్నాను
  rationale: పరిపూర్ణ కృదంతం మరియు εἰμί కలిసిన నిర్మాణం పౌలు ప్రస్తుతం ఆ న్యాయాధికార పరిధిలో నిలిచి ఉన్న స్థితిని నొక్కి చెబుతుంది.
- source_word: οὗ
  choice: ఇక్కడే
  rationale: న్యాయపీఠాన్ని తిరిగి సూచిస్తూ, తన విచారణకు ఇదే తగిన అధికారస్థానమని పౌలు చెప్పే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δεῖ
  choice: జరగాలి
  rationale: వ్యక్తిగత కోరికకన్నా న్యాయపరమైన అవసరం లేదా సముచిత అధికార పరిధిని సూచిస్తుంది.
- source_word: κρίνεσθαι
  choice: తీర్పు జరగాలి
  rationale: న్యాయపరమైన నిష్క్రియార్థాన్ని స్పష్టంగా తెలియజేస్తుంది; సందర్భానుసారం ‘విచారణ జరగాలి’ అనే భావమూ సాధ్యమే.
- source_word: Ἰουδαίους
  choice: యూదులకు
  rationale: ప్రత్యక్ష దత్తివిభక్తి భావంతో, పౌలు అన్యాయం చేశాడని ఆరోపించబడిన ప్రజలను సూచిస్తుంది; భౌగోళికంగా ‘యూదయులు’ అని కుదించదు.
- source_word: οὐδὲν ἠδίκησα
  choice: నేను ఏ అన్యాయమూ చేయలేదు
  rationale: ἀδικέω లోని నైతిక మరియు న్యాయపరమైన తప్పు చేయడం అనే రెండు ఛాయలనూ స్పష్టంగా నిలుపుతుంది.
- source_word: ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις
  choice: ఈ సంగతి నీకే చాలా బాగా తెలుసు
  rationale: καὶ σὺ లోని ఉద్ఘాటనను ‘నీకే’తో, κάλλιον ἐπιγινώσκεις లోని బలమైన అవగాహనను ‘చాలా బాగా తెలుసు’తో సహజంగా అందిస్తుంది; ‘ఇంకా బాగా’ అనే అక్షరార్థ తులనను సందర్భం స్పష్టంగా నిర్దేశించదు.
