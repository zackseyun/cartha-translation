  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయపరమైన శైలి ఉపయోగించబడింది. ‘కైసరు’ చారిత్రక బిరుదుగా నిలుపబడింది. ప్రధాన వాక్యంలో ఉన్న ప్రతి పాదసూచిక గుర్తుకు అనుగుణమైన పాదసూచిక ఇవ్వబడింది.
