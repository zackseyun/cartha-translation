  yaml_path: translation/nt/acts/025/002.yaml
  text: So the chief priests and the leading men of the Jews presented their case against Paul to him[a], and they urged him,
translation:
  language: te
  text: 'అప్పుడు ప్రధాన యాజకులు, యూదులలో ప్రముఖులు ఫేస్తు ఎదుట పౌలుకు వ్యతిరేకంగా తమ ఫిర్యాదును ఉంచి[a], అతణ్ణి పదేపదే వేడుకున్నారు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పౌలు గురించి అతనికి తెలియజేసి”; లేదా “పౌలుకు వ్యతిరేకంగా అతని ఎదుట ఆరోపణలు ఉంచి.” గ్రీకు క్రియకు ఒక విషయాన్ని తెలియజేయడం అనే అర్థం ఉండవచ్చు; ఈ సందర్భంలో దానికి న్యాయపరమైన భావం ఉండే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεφάνισάν
  choice: తమ విషయాన్ని ... ముందు ఉంచి
  rationale: అధికారి ఎదుట ఒక విషయాన్ని తెలియజేయడం లేదా న్యాయపరంగా సమర్పించడం అనే భావాన్ని ఇక్కడి సందర్భానికి తగినట్లుగా వ్యక్తం చేస్తుంది; గ్రీకులో స్పష్టంగా లేని ‘అధికారిక అభియోగాలు మోపారు’ అనే అతిశయాన్ని నివారిస్తుంది.
- source_word: τε
  choice: అప్పుడు
  rationale: ముందటి కథనంతో ఈ వాక్యాన్ని సహజంగా అనుసంధానించే కథన సూచకం.
- source_word: αὐτῷ
  choice: ఫేస్తు ముందు
  rationale: సందర్భంలో సర్వనామం ఫేస్తును సూచిస్తుంది; తెలుగులో సూచన స్పష్టత కోసం పేరును ఉపయోగించడం సహజం.
- source_word: οἱ ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: యెరూషలేము ఆలయ యాజక నాయకవర్గానికి ఆధునిక ప్రామాణిక తెలుగు పదబంధం.
- source_word: οἱ πρῶτοι τῶν Ἰουδαίων
  choice: యూదులలో ప్రముఖులు
  rationale: సామాజికంగా లేదా రాజకీయంగా అగ్రస్థానంలో ఉన్నవారనే భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: κατὰ τοῦ Παύλου
  choice: పౌలుకు వ్యతిరేకంగా
  rationale: κατά + షష్ఠీ ఇక్కడ ప్రతికూలమైన, ఆరోపణాత్మక సంబంధాన్ని సూచిస్తుంది.
- source_word: παρεκάλουν
  choice: పదేపదే వేడుకున్నారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న లేదా పునరావృత అభ్యర్థన భావాన్ని తెలుగులో స్పష్టం చేస్తుంది; సందర్భానికి తగ్గ బలమైన విజ్ఞప్తిని సూచిస్తుంది.
- source_word: αὐτόν
  choice: అతణ్ణి
  rationale: ఇది మళ్లీ ఫేస్తునే సూచించే కర్మ సర్వనామం.
