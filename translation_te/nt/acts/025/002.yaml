translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. వాక్యం తరువాతి వచనంలో పూర్తయ్యే అభ్యర్థనకు దారితీస్తున్నందున చివర ద్విబిందువు ఉంచబడింది; మూలంలోని న్యాయపరమైన సూచనను నిలుపుతూ దాని తీవ్రతను అతిగా నిర్దిష్టం చేయలేదు.
