id: ACT.25.12
reference: Acts 25:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε ὁ Φῆστος συλλαλήσας μετὰ τοῦ συμβουλίου ἀπεκρίθη· Καίσαρα ἐπικέκλησαι, ἐπὶ Καίσαρα πορεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/012.yaml
  text: Then Festus[a], after conferring with the council, answered, “You have appealed to Caesar; to Caesar you will go.”
translation:
  language: te
  text: అప్పుడు ఫేస్తు మండలితో సంప్రదించిన తరువాత, “నీవు కైసరుకు అప్పీలు చేశావు; కైసరు వద్దకే వెళ్తావు[a]” అని జవాబిచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కైసరు ఎదుటకు వెళ్తావు.” అప్పీలు చేసిన తరువాత చక్రవర్తి న్యాయస్థానం ముందు హాజరవడమనే న్యాయపరమైన భావం ఈ మాటల్లో ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: కథనంలోని తరువాతి సంఘటనను సూచించే సహజమైన కాలక్రమ సంధానం.
- source_word: συλλαλήσας
  choice: సంప్రదించిన తరువాత
  rationale: ప్రధాన క్రియకు ముందు జరిగిన ఆలోచనాత్మక చర్చను భూతకాల అసమాపక క్రియ భావంతో స్పష్టంగా తెలియజేస్తుంది.
- source_word: μετὰ τοῦ συμβουλίου
  choice: మండలితో
  rationale: న్యాయపరిపాలనా సందర్భంలోని సంప్రదింపుల బృందాన్ని సూచిస్తుంది; గ్రీకులో లేని ‘తన’ అనే భావాన్ని చేర్చదు.
- source_word: ἀπεκρίθη
  choice: జవాబిచ్చాడు
  rationale: న్యాయపరమైన అధికారిక సందర్భానికి తగిన సహజ తెలుగు కథన క్రియ.
- source_word: Καίσαρα
  choice: కైసరుకు
  rationale: రోమా చక్రవర్తి బిరుదును చారిత్రక, న్యాయపరమైన సందర్భంతో సహా లిప్యంతరీకరించి నిలుపుతుంది.
- source_word: ἐπικέκλησαι
  choice: అప్పీలు చేశావు
  rationale: ἐπικαλέω పరిపూర్ణ మధ్యమ రూపానికి ఇక్కడ ఉన్న న్యాయపరమైన అర్థాన్ని ఆధునిక పాఠకులకు నేరుగా తెలియజేస్తుంది.
- source_word: ἐπὶ Καίσαρα
  choice: కైసరు దగ్గరికే
  rationale: అప్పీలు చేసిన అధికారిని ఉద్దేశించి వెళ్లడమనే గమనార్థాన్ని సహజంగా నిలుపుతుంది; ఆయన న్యాయస్థానం ముందు హాజరవడమనే న్యాయభావం పాదసూచికలో ఇవ్వబడింది.
- source_word: πορεύσῃ
  choice: వెళ్తావు
  rationale: భవిష్యత్ మధ్యమ రూపంలోని నేరమైన గమనార్థాన్ని నిలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘పంపబడతావు’ అనే కర్మణి భావాన్ని చేర్చదు.
