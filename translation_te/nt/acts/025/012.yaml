    issue: The phrase “కైసరు దగ్గరికే” is relatively colloquial in a formal judicial pronouncement.
    rationale: The Greek ἐπὶ Καίσαρα denotes going to/for Caesar in consequence of an appeal. “కైసరు వద్దకే” retains that directional and legal sense in more neutral standard Telugu.
