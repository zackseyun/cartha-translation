translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా న్యాయపరమైన గంభీరతను నిలిపాం. ‘అప్పీలు’ అనే విస్తృతంగా వాడే ఆధునిక న్యాయపదాన్ని ఉపయోగించాం; ‘కైసరు’ అనే బైబిలు సందర్భానికి సుపరిచితమైన రూపాన్ని నిలిపాం.
