source:
  edition: SBLGNT
  text: Ἀγρίππας δὲ πρὸς τὸν ⸀Φῆστον· Ἐβουλόμην καὶ αὐτὸς τοῦ ἀνθρώπου ἀκοῦσαι. ⸀Αὔριον, φησίν, ἀκούσῃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/022.yaml
  text: Then Agrippa said to Festus[a], “I myself would like to hear the man.” “Tomorrow,” he says[c][b], “you will hear him.”
translation:
  language: te
  text: అప్పుడు అగ్రిప్పా ఫేస్తుతో, “నేనూ ఆ మనిషి మాట స్వయంగా వినాలని కోరుకుంటున్నాను[a]” అన్నాడు. ఫేస్తు, “రేపు అతని మాట వింటావు[b],” అంటున్నాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేనూ ఆ మనిషి మాట వినాలని కోరుకున్నాను.” καὶ αὐτόςలో ‘నేనూ’ అనే అదనపు భావం ఉండవచ్చు; αὐτός ఉద్ఘాటనను కూడా సూచించవచ్చు. Ἐβουλόμηνను గతకాల కోరికగా కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అతని నుండి వింటావు.” గ్రీకు ప్రయోగం ఆ వ్యక్తి మాట్లాడేది ప్రత్యక్షంగా వినడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: 'గ్రీకులో ఇక్కడ చారిత్రక వర్తమాన కాలం ఉంది: “అంటున్నాడు.” దీన్ని “అన్నాడు” అని కూడా సహజీకరించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγρίππας
  choice: అగ్రిప్ప
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: δὲ
  choice: అప్పుడు
  rationale: కథన పురోగతిని సహజంగా సూచిస్తుంది; బలమైన విరోధార్థాన్ని చేర్చదు.
- source_word: πρὸς τὸν Φῆστον
  choice: ఫేస్తుతో ... అన్నాడు
  rationale: మాట ఎవరిని ఉద్దేశించి చెప్పబడిందో తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ἐβουλόμην
  choice: వినాలని కోరుకుంటున్నాను
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న లేదా మర్యాదపూర్వక కోరికను సహజ తెలుగులో తెలియజేస్తుంది; కేవలం గతకాల కోరికగా నిర్ణయించదు.
- source_word: καὶ αὐτὸς
  choice: నేను కూడా స్వయంగా
  rationale: καί యొక్క అదనపు భావాన్నీ αὐτός యొక్క ఉద్ఘాటననూ రెండింటినీ నిలుపుతుంది.
- source_word: τοῦ ἀνθρώπου ἀκοῦσαι
  choice: ఆ మనిషి మాట వినాలని
  rationale: జనిటివ్‌తో ఉన్న ἀκούω ఇక్కడ ఆ వ్యక్తి మాట్లాడేది ప్రత్యక్షంగా వినడాన్ని సూచిస్తుంది; తెలుగులో ‘మాట వినడం’ సహజం.
- source_word: Αὔριον
  choice: రేపు
  rationale: కాలవాచక క్రియావిశేషణానికి నేరమైన సమానార్థకం.
- source_word: φησίν
  choice: అంటున్నాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమాన కాలాన్ని నిలుపుతూ కథనానికి ఉన్న సజీవతను కాపాడుతుంది.
- source_word: ἀκούσῃ αὐτοῦ
  choice: అతని మాట వింటావు
  rationale: ఆ వ్యక్తి మాట్లాడేది వినడం అనే భావాన్ని సహజ తెలుగులో అందిస్తుంది; ‘అతని నుండి వింటావు’ అనే భావసంభావ్యతను పాదసూచికలో ఉంచాం.
