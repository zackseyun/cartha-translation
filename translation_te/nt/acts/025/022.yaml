translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు, గౌరవప్రదమైన కథన శైలి. మూలంలోని καὶ αὐτός ఉద్ఘాటన/అదనపు భావాలనూ, Ἐβουλόμην కాల-భావ సూక్ష్మతనూ, φησίν చారిత్రక వర్తమానాన్నీ సాధ్యమైనంతవరకు నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
