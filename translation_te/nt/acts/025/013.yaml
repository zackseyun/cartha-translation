translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని కాలపరమైన నేపథ్యం, రాజబిరుదు, గమ్యం, పలకరించే ఉద్దేశం నిలుపబడ్డాయి.
