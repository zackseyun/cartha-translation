source:
  edition: SBLGNT
  text: Ἡμερῶν δὲ διαγενομένων τινῶν Ἀγρίππας ὁ βασιλεὺς καὶ Βερνίκη κατήντησαν εἰς Καισάρειαν ἀσπασάμενοι τὸν Φῆστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/013.yaml
  text: After some days had passed[a], King Agrippa and Bernice arrived at Caesarea to greet Festus.
translation:
  language: te
  text: కొన్ని రోజులు గడిచిన తర్వాత, అగ్రిప్ప రాజు మరియు బెర్నీకే[a] ఫేస్తును పలకరించడానికి కైసరయకు వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: బెర్నీకే అనే పేరును బెరెనీకే అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: ఆంగ్ల పరిశీలన-గమనికలో సూచించిన వ్యక్తిపేరు ప్రత్యామ్నాయ లిప్యంతరీకరణను, పేరుకే స్పష్టంగా అనుసంధానించి నిలుపుతుంది.
lexical_decisions:
- source_word: Ἡμερῶν δὲ διαγενομένων τινῶν
  choice: కొన్ని రోజులు గడిచిన తర్వాత
  rationale: ఈ genitive absolute కాలపరమైన నేపథ్యాన్ని సూచిస్తుంది. δέ స్వల్ప అనుసంధానాన్ని చూపుతుంది; తెలుగులో ప్రత్యేక అనుసంధాన పదం లేకుండానే కథన ప్రవాహం సహజంగా ఉంటుంది.
- source_word: Ἀγρίππας ὁ βασιλεὺς
  choice: అగ్రిప్ప రాజు
  rationale: βασιλεύς అనే నిజమైన రాజబిరుదును నిలుపుతూ, పేరుకు వెంట బిరుదు ఉంచడం సహజమైన తెలుగు ప్రయోగం.
- source_word: Βερνίκη
  choice: బెర్నీకే
  rationale: గ్రీకు Βερνίκη ఉచ్చారణకు సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: κατήντησαν
  choice: వచ్చారు
  rationale: గమ్యస్థానానికి చేరడాన్ని సూచించే క్రియ; కైసరయకు అనే గమనార్థక విభక్తితో ‘వచ్చారు’ సహజంగా ఉంటుంది.
- source_word: εἰς Καισάρειαν
  choice: కైసరయకు
  rationale: εἰς యొక్క గమ్యార్థాన్ని ‘కు’ ద్వారా స్పష్టంగా నిలుపుతుంది.
- source_word: ἀσπασάμενοι τὸν Φῆστον
  choice: ఫేస్తును పలకరించడానికి
  rationale: పాల్గొనేవారి రాకతో అనుసంధానమైన ఉద్దేశం/పరిస్థితిని సహజంగా వ్యక్తం చేస్తుంది; రాజాస్థాన మర్యాద అనే అదనపు భావాన్ని చేర్చదు.
- source_word: Φῆστον
  choice: ఫేస్తు
  rationale: గ్రీకు Φῆστος పేరుకు మూలభాషానుసారమైన తెలుగు లిప్యంతరీకరణ.
