id: ACT.25.11
reference: Acts 25:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἀδικῶ καὶ ἄξιον θανάτου πέπραχά τι, οὐ παραιτοῦμαι τὸ ἀποθανεῖν· εἰ δὲ οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου, οὐδείς με δύναται αὐτοῖς χαρίσασθαι· Καίσαρα ἐπικαλοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/011.yaml
  text: If[a], then, I am doing wrong and have done anything deserving death, I do not refuse to die. But if there is nothing to the things these men are accusing me of, no one can hand me over to them as a favor. I appeal to Caesar.
translation:
  language: te
  text: కాబట్టి, నేను అన్యాయం చేస్తున్నవాడినై మరణశిక్షకు తగినదేదైనా చేసి ఉంటే, మరణాన్ని నేను నిరాకరించను. అయితే వీరు నాపై మోపుతున్న ఆరోపణలకు ఆధారమేమీ లేకపోతే, వారిని సంతోషపెట్టడానికి నన్ను వారికి అప్పగించగలవాడు ఎవ్వరూ లేరు.[a] నేను కైసరుకు అప్పీలు చేస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను వారికి అనుగ్రహంగా అప్పగించగలవాడు ఎవ్వరూ లేరు.” గ్రీకు క్రియ ఒకరిని అనుగ్రహంగా లేదా ఉపకారంగా అప్పగించడం అనే భావాన్ని కలిగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶ
  choice: నేను అన్యాయం చేస్తూ
  rationale: వర్తమాన కాలంలోని క్రియను కొనసాగుతున్న లేదా ప్రస్తుత దోషస్థితిగా ఉంచుతుంది; నైతిక-న్యాయ భావాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: ἄξιον θανάτου
  choice: మరణానికి తగినదేదైనా
  rationale: మరణశిక్షకు పాత్రమైన కార్యం అనే మూల భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: πέπραχά τι
  choice: చేసి ఉంటే
  rationale: పూర్తయిన కార్యానికి ప్రస్తుత న్యాయసంబంధ ప్రాముఖ్యత ఉందనే పరిపూర్ణ కాల భావాన్ని షరతు వాక్యంలో సహజంగా తెలియజేస్తుంది.
- source_word: οὐ παραιτοῦμαι τὸ ἀποθανεῖν
  choice: చనిపోవడానికి నేను నిరాకరించను
  rationale: παραιτέομαι లోని ‘తిరస్కరించు/నిరాకరించు’ భావాన్ని నేరుగా నిలుపుతూ, దోషి అయితే మరణాన్ని స్వీకరించడానికి సిద్ధమనే న్యాయపరమైన భావాన్ని కాపాడుతుంది.
- source_word: οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου
  choice: వీరు నాపై మోపుతున్న నేరారోపణల్లో ఏమీ లేకపోతే
  rationale: ఆ ఆరోపణలకు వాస్తవమైన ఆధారం లేదా సారం లేదనే గ్రీకు ప్రయోగార్థాన్ని ‘నిజం’ అనే పదాన్ని అదనంగా చేర్చకుండా తెలియజేస్తుంది.
- source_word: χαρίσασθαι
  choice: నన్ను వారికి అనుకూలంగా అప్పగించే
  rationale: ఒక అనుగ్రహంగా లేదా వారిని సంతోషపెట్టేందుకు నిందితుణ్ణి అప్పగించడం అనే న్యాయ-రాజకీయ ఛాయను వ్యక్తం చేస్తుంది.
- source_word: Καίσαρα ἐπικαλοῦμαι
  choice: నేను కైసరుకు విజ్ఞప్తి చేస్తున్నాను
  rationale: చక్రవర్తి న్యాయస్థానానికి చేసే సాంకేతిక న్యాయ విజ్ఞప్తిని ఆధునిక, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: μὲν οὖν ... δὲ
  choice: కాబట్టి ... అయితే
  rationale: పౌలు వాదనలోని మొదటి షరతు, దానికి విరుద్ధమైన రెండవ షరతు మధ్య సంబంధాన్ని సహజంగా చూపుతుంది.
theological_decisions:
- issue: మరణశిక్షను అంగీకరించడం మరియు కైసరుకు విజ్ఞప్తి చేయడంలోని న్యాయపరమైన ఉద్వేగం
  choice: పౌలు నిజంగా మరణానికి తగిన తప్పు చేసి ఉంటే మరణాన్ని నిరాకరించనని షరతుతో చెబుతూ, ఆరోపణలు నిరాధారమైతే తనను అన్యాయంగా అప్పగించే హక్కు ఎవరికీ లేదని వాదిస్తున్నాడు.
  alternative: పౌలు న్యాయప్రక్రియ చెల్లుబాటును ఏ విధంగానూ అంగీకరించకుండా కేవలం అలంకారికంగా మాట్లాడుతున్నాడు.
  rationale: వాక్యం ప్రధానంగా న్యాయపరమైనది. విస్తృతమైన మరణశిక్ష సిద్ధాంతాన్ని ఇందులోకి చేర్చకుండా, షరతుతో కూడిన మరణ అంగీకారాన్నీ న్యాయమైన విచారణ హక్కుపై పట్టుదలనూ అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయసందర్భానికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘కైసరు’ అనే సంప్రదాయ బైబిలు నామరూపాన్ని నిలిపి, వాక్య నిర్మాణాన్ని సహజ తెలుగుకు అనుగుణంగా ఉంచింది.
