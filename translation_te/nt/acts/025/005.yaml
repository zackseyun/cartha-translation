id: ACT.25.5
reference: Acts 25:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἱ οὖν ⸂ἐν ὑμῖν, φησίν, δυνατοὶ⸃ συγκαταβάντες εἴ τί ἐστιν ἐν τῷ ἀνδρὶ ⸀ἄτοπον κατηγορείτωσαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/005.yaml
  text: Therefore[a], let those among you who are able go down with me, and if there is anything wrong in the man[b], let them accuse him.
translation:
  language: te
  text: “కాబట్టి, మీలో సమర్థులైనవారు[a] నాతో కలిసి కిందికి వచ్చి, ఆ మనిషిలో ఏదైనా తప్పు ఉంటే అతనిమీద అభియోగం మోపాలి[b]” అని అతడు అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీలో పలుకుబడిగలవారు,” “మీలో ప్రముఖులు,” లేదా “మీలో అధికారమున్నవారు.” గ్రీకు పదానికి సమర్థులు, శక్తిగలవారు, పలుకుబడిగలవారు, లేదా అధికారమున్నవారు అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అతనిపై ఆరోపణ చేయాలి.” ఇక్కడి గ్రీకు క్రియ ఒకరిని నిందించడం లేదా న్యాయపరంగా అతనిపై అభియోగం మోపడం అనే అర్థం ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν
  choice: కాబట్టి, ... వారు
  rationale: οὖν ముందున్న మాటకు కొనసాగింపును లేదా దాని ఆధారంగా వచ్చే నిర్ణయాన్ని సూచిస్తుంది. విశేషణంతో కూడిన Οἱ తెలుగులో ‘...వారు’ అనే వ్యక్తివాచక నిర్మాణంగా సహజంగా వ్యక్తమవుతుంది.
- source_word: ἐν ὑμῖν ... δυνατοὶ
  choice: మీలో సమర్థులైనవారు[a]
  rationale: δυνατοί అనే పదానికి సమర్థులు, శక్తిగలవారు, పలుకుబడిగలవారు లేదా అధికారస్థులు అనే అర్థాలు రావచ్చు. ప్రధాన పాఠంలో ‘సమర్థులైనవారు’ అని ఉంచడం ద్వారా సామాజిక హోదాను అనవసరంగా నిర్ధారించకుండా పదంలోని సామర్థ్య భావాన్ని నిలుపుతుంది; ఇతర సాధ్యార్థాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: φησίν
  choice: అని అతడు అన్నాడు
  rationale: ఇది మాటలను ఎవరు పలికారో తెలిపే కుండలీకృత నివేదన. తెలుగులో ఉల్లేఖనం చివర ‘అని అతడు అన్నాడు’ అని ఇవ్వడం సహజంగా ఉండి మూలంలోని నివేదనా సూచనను స్పష్టంగా నిలుపుతుంది.
- source_word: συγκαταβάντες
  choice: నాతో కలిసి కిందికి వచ్చి
  rationale: సύν- కలిసి ప్రయాణించడాన్ని, καταβαίνω కిందికి వెళ్లడం/రావడం అనే భౌగోళిక ప్రయోగాన్ని సూచిస్తాయి. వక్తతో ప్రయాణం కావడం వల్ల తెలుగులో ‘నాతో కలిసి ... వచ్చి’ సహజంగా ఉంది.
- source_word: εἴ τί ἐστιν ἐν τῷ ἀνδρὶ ἄτοπον
  choice: ఆ మనిషిలో ఏదైనా తప్పు ఉంటే
  rationale: షరతుతో కూడిన అనిశ్చితిని εἴ τί నిలుపుతుంది. ἐν అనే ‘లో’ భావాన్ని కాపాడుతూ, ἄτοπον‌ను ‘నేరం’ అని మరీ నిర్దిష్టం చేయకుండా విస్తృతమైన ‘తప్పు’గా అనువదించబడింది.
- source_word: κατηγορείτωσαν αὐτοῦ
  choice: అతనిమీద అభియోగం మోపాలి[b]
  rationale: న్యాయపరమైన సందర్భంలో κατηγορέω ఒకరిపై ఆరోపణ లేదా అభియోగం చేయడాన్ని సూచిస్తుంది. మూడవ పురుష ఆజ్ఞార్థక భావం తెలుగులో ‘మోపాలి’గా సహజంగా వ్యక్తమవుతుంది.
