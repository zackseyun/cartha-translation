translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయపరమైన శైలి వాడబడింది. ‘ఆ మనిషి’ అనే కొంత దూరాన్ని చూపే సూచనను, అలాగే ‘తప్పు’ అనే విస్తృత పదాన్ని మూలానికి అనుగుణంగా నిలుపుకున్నాం; δυνατοίలోని నిజమైన అర్థసందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
