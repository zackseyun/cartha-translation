id: ACT.25.17
reference: Acts 25:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: συνελθόντων ⸀οὖν ἐνθάδε ἀναβολὴν μηδεμίαν ποιησάμενος τῇ ἑξῆς καθίσας ἐπὶ τοῦ βήματος ἐκέλευσα ἀχθῆναι τὸν ἄνδρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/017.yaml
  text: So when they had come together here[a], I made no delay, but on the next day I sat on the judgment seat and ordered the man to be brought.
translation:
  language: te
  text: కాబట్టి వారు ఇక్కడికి వచ్చినప్పుడు, నేను ఏమాత్రం ఆలస్యం చేయకుండా, మరుసటి రోజు న్యాయపీఠంపై కూర్చొని[a], ఆ మనిషిని తీసుకురమ్మని ఆదేశించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘న్యాయవిచారణ వేదికపై ఆసీనుడనై.’ ఇక్కడి గ్రీకు పదం βῆμα అధికారిక న్యాయాధికారి ఆసనాన్ని లేదా న్యాయస్థాన వేదికను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνελθόντων οὖν ἐνθάδε
  choice: కాబట్టి వారు ఇక్కడికి వచ్చినప్పుడు
  rationale: జనిటివ్ అబ్సల్యూట్ నిర్మాణంలోని సమూహంగా రావడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, οὖν తెలిపే పూర్వాపర సంబంధాన్ని ‘కాబట్టి’ నిలుపుతుంది.
- source_word: ἀναβολὴν μηδεμίαν ποιησάμενος
  choice: నేను ఏమాత్రం ఆలస్యం చేయకుండా
  rationale: విచారణను వాయిదా వేయకపోవడం లేదా జాప్యం చేయకపోవడం అనే న్యాయపరమైన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τῇ ἑξῆς
  choice: మరుసటి రోజే
  rationale: తరువాతి రోజునే చర్య తీసుకున్నాడనే కాలసూచనను, ఆలస్యం చేయలేదనే సందర్భానుగుణ ఉద్ఘాటనతో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: న్యాయపీఠం మీద కూర్చొని
  rationale: βῆμα సూచించే అధికారిక న్యాయాధికారి ఆసనం లేదా న్యాయవిచారణ వేదిక అనే భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: ἐκέλευσα ἀχθῆναι τὸν ἄνδρα
  choice: ఆ మనిషిని తీసుకురమ్మని ఆదేశించాను
  rationale: అధికారిక ఆజ్ఞను తెలిపే ἐκέλευσαను ‘ఆదేశించాను’గా, ἀχθῆναι యొక్క కర్మణి భావాన్ని సహజ తెలుగు ఆజ్ఞారూప నిర్మాణంతో అందిస్తుంది; మూలంలో లేని ‘నిందితుడు’ అనే విశేషణాన్ని చేర్చదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయపర శైలిని ఉపయోగించాం. వాక్యంలోని కార్యాల క్రమాన్ని, ఫేస్తు పలుకులోని అధికారిక స్వరాన్ని నిలిపాం.
