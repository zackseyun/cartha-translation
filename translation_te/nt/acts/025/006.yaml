id: ACT.25.6
reference: Acts 25:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διατρίψας δὲ ἐν αὐτοῖς ἡμέρας ⸂οὐ πλείους ὀκτὼ⸃ ἢ δέκα, καταβὰς εἰς Καισάρειαν, τῇ ἐπαύριον καθίσας ἐπὶ τοῦ βήματος ἐκέλευσεν τὸν Παῦλον ἀχθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/006.yaml
  text: After spending among them no more than eight or ten days[a], he went down to Caesarea, and on the next day, after taking his seat on the tribunal, he ordered Paul to be brought in.
translation:
  language: te
  text: అతడు వారితో ఎనిమిది లేదా పది రోజులకు మించి కాకుండా గడిపిన తరువాత, కైసరయకు దిగివెళ్లాడు. మరుసటి రోజు న్యాయపీఠంపై ఆసీనుడై[a], పౌలును తీసుకురమ్మని ఆజ్ఞాపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తీర్పు ఆసనంపై కూర్చొని.” గ్రీకు βῆμα అనే పదం అధికారిక న్యాయవిచారణ ఆసనాన్ని లేదా వేదికను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διατρίψας
  choice: గడిపి
  rationale: రోజులతో కలిసి వచ్చినప్పుడు διατρίβωకు ‘గడిపి’ అనేది సహజమైన తెలుగు ప్రయోగం; ఇది ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను తెలియజేస్తుంది.
- source_word: ἐν αὐτοῖς
  choice: వారి మధ్య
  rationale: ముందటి సందర్భంలో ప్రస్తావించబడిన వారితో/వారి ప్రాంతంలో ఫేస్తు ఉన్నాడనే విస్తృత భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἡμέρας οὐ πλείους ὀκτὼ ἢ δέκα
  choice: ఎనిమిది లేక పది రోజులకు మించకుండా
  rationale: οὐ πλείους అనే గరిష్ఠ పరిమితి భావాన్నీ, ὀκτὼ ἢ δέκαలోని ప్రత్యామ్నాయ/సుమారు లెక్కనూ పరిష్కరించకుండా నిలుపుతుంది.
- source_word: καταβὰς εἰς Καισάρειαν
  choice: కైసరయకు దిగివెళ్లాడు
  rationale: యెరూషలేము నుండి కైసరయకు ప్రయాణాన్ని తెలిపే భౌగోళిక దిశా ప్రయోగాన్ని కాపాడుతుంది.
- source_word: τῇ ἐπαύριον
  choice: మరుసటి రోజు
  rationale: చేరుకున్న తరువాతి రోజును సూచించే సహజమైన ఆధునిక తెలుగు కాలప్రయోగం.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: న్యాయపీఠం మీద కూర్చొని
  rationale: βῆμα ఇక్కడ అధికారిక న్యాయవిచారణ ఆసనం లేదా వేదికను సూచిస్తుంది; ‘న్యాయపీఠం’ న్యాయ సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐκέλευσεν
  choice: ఆజ్ఞాపించాడు
  rationale: అధికారిక న్యాయ సందర్భంలోని ఆదేశాన్ని గౌరవప్రదమైన, సాధారణ తెలుగు పదంతో వ్యక్తపరుస్తుంది.
- source_word: τὸν Παῦλον ἀχθῆναι
  choice: పౌలును తీసుకురమ్మని
  rationale: ἄγω యొక్క కర్మణి భావాన్ని తెలుగు పరోక్ష ఆజ్ఞ నిర్మాణంలో సహజంగా వ్యక్తపరుస్తూ, పౌలును విచారణ స్థలానికి తీసుకురావడాన్ని సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన న్యాయపరమైన శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని ‘ఎనిమిది లేక పది’ అనే అనిశ్చిత లెక్కను అలాగే ఉంచాం.
