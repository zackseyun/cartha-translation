translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయపరమైన సందర్భానికి తగిన గౌరవప్రదమైన కానీ సామాన్య పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని షరతు క్రమాన్ని తెలుగులో సహజంగా అమర్చి, ముఖాముఖి ఎదుర్కొనడం మరియు సమర్థించుకునే అవకాశం అనే రెండు న్యాయ హక్కులను నిలిపాం.
