  to: 'వారికి నేను ఇలా జవాబిచ్చాను: నిందితుడు తనపై ఆరోపణ చేసేవారిని ముఖాముఖిగా ఎదుర్కొని, ఆ అభియోగానికి సంబంధించి తన పక్షాన వాదించడానికి అవకాశం పొందకముందే ఏ వ్యక్తినైనా అప్పగించడం[a] రోమీయుల ఆచారం కాదు.[b]'
