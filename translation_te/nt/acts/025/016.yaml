id: ACT.25.16
reference: Acts 25:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πρὸς οὓς ἀπεκρίθην ὅτι οὐκ ἔστιν ἔθος Ῥωμαίοις χαρίζεσθαί τινα ⸀ἄνθρωπον πρὶν ἢ ὁ κατηγορούμενος κατὰ πρόσωπον ἔχοι τοὺς κατηγόρους τόπον τε ἀπολογίας λάβοι περὶ τοῦ ἐγκλήματος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/016.yaml
  text: To them I answered that it is not the custom of the Romans to hand over any man before the accused has the accusers face to face and receives an opportunity for a defense concerning the charge[a][b].
translation:
  language: te
  text: 'వారికి నేను ఇలా జవాబిచ్చాను: నిందితుడు తనపై ఆరోపణ చేసేవారిని ముఖాముఖిగా ఎదుర్కొని, ఆ అభియోగానికి సంబంధించి తన పక్షాన వాదించడానికి అవకాశం పొందకముందే ఏ వ్యక్తినైనా అప్పగించడం[a] రోమీయుల ఆచారం కాదు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక వ్యక్తిని అనుగ్రహంగా ఇచ్చివేయడం”; గ్రీకు క్రియ, ఆరోపణ చేసేవారి అభ్యర్థనను మన్నించి ఒకరిని వారికి అప్పగించడం అనే భావాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో “ఏ మనిషినైనా”; ఈ పదబంధం వ్యాకరణరీత్యా పుంలింగంలో ఉన్నా, ఈ న్యాయ సందర్భంలో సాధారణంగా ఏ వ్యక్తినైనా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθος
  choice: ఆచారం
  rationale: స్థిరపడిన న్యాయపద్ధతి లేదా సంప్రదాయాన్ని సూచిస్తుంది; ఈ సందర్భంలో ‘ఆచారం’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: Ῥωμαίοις
  choice: రోమీయుల
  rationale: దత్తివ బహువచనం ఇక్కడ రోమీయుల న్యాయవ్యవస్థలో అమలైన ఆచారాన్ని సూచిస్తుంది.
- source_word: χαρίζεσθαί
  choice: వారికి అప్పగించడం
  rationale: ఎదుటివారి అభ్యర్థనను అనుగ్రహిస్తూ ఒక వ్యక్తిని వారి చేతికి ఇవ్వడం అనే సందర్భోచిత భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τινα ἄνθρωπον
  choice: ఏ వ్యక్తినైనా
  rationale: గ్రీకు పదబంధం వ్యాకరణరీత్యా పుంలింగ ఏకవచనమైనా, ఈ న్యాయ సందర్భంలో సాధారణార్థకంగా ఉంది; తెలుగులో ‘ఏ వ్యక్తినైనా’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὁ κατηγορούμενος
  choice: నిందితుడు
  rationale: ఆరోపణకు గురైన వ్యక్తిని సూచించే సంక్షిప్తమైన, సాధారణ న్యాయపదం.
- source_word: κατὰ πρόσωπον
  choice: ముఖాముఖిగా
  rationale: నేరారోపణ చేసేవారి ప్రత్యక్ష సమక్షంలో ఎదుర్కోవడాన్ని తెలిపే గ్రీకు నుడికార బలాన్ని నిలుపుతుంది.
- source_word: τόπον ... ἀπολογίας
  choice: సమర్థించుకోవడానికి అవకాశం
  rationale: τόπος ఇక్కడ భౌతిక స్థలం కాక అవకాశాన్ని, ἀπολογία న్యాయపరమైన ప్రతివాదాన్ని సూచిస్తాయి; ఈ తెలుగు ప్రయోగం సహజంగా రెండింటినీ అందిస్తుంది.
- source_word: ἐγκλήματος
  choice: అభియోగం
  rationale: న్యాయపరంగా మోపబడిన ఆరోపణ లేదా నేరారోపణను సూచించే తగిన పదం.
