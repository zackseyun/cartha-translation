translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘పౌలుకు సంబంధించిన విషయాలు’ అనే విస్తృత పదబంధంతో న్యాయపరమైన సందర్భాన్ని సూచించినప్పటికీ మూలంలోని భావవిస్తృతిని నిలిపి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం. ప్రత్యక్ష సంభాషణను తెలుగు విరామచిహ్నాలతో స్పష్టంగా చూపించాం.
