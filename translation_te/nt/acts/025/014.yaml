source:
  edition: SBLGNT
  text: ὡς δὲ πλείους ἡμέρας ⸀διέτριβον ἐκεῖ, ὁ Φῆστος τῷ βασιλεῖ ἀνέθετο τὰ κατὰ τὸν Παῦλον λέγων· Ἀνήρ τίς ἐστιν καταλελειμμένος ὑπὸ Φήλικος δέσμιος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/014.yaml
  text: And as they stayed there many days[a], Festus laid before the king the matters concerning Paul, saying[b], “There is a certain man left behind by Felix as a prisoner,”
translation:
  language: te
  text: 'వారు అక్కడ చాలా రోజులు ఉంటుండగా, ఫేస్తు పౌలుకు సంబంధించిన విషయాలను[a] రాజు ముందు ఉంచి[b] ఇలా అన్నాడు: “ఫేలిక్సు ఖైదీగా ఉంచివెళ్లిన ఒక వ్యక్తి ఉన్నాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పౌలు విషయమైన కేసును.” ఈ పదబంధం పౌలుకు సంబంధించిన విషయాలన్నిటినీ సూచించవచ్చు; ఈ సందర్భంలో ప్రత్యేకంగా అతని న్యాయపరమైన పరిస్థితిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “రాజుకు వివరించి.” గ్రీకు పదం కేవలం సమాచారం అందించడం మాత్రమే కాకుండా, ఒక విషయాన్ని పరిశీలన కోసం మరొకరి ముందు ఉంచడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείους ἡμέρας
  choice: చాలారోజులు
  rationale: కాలవ్యవధిని సూచించే ఈ తులనాత్మక రూపం సందర్భంలో ‘చాలా రోజులు’ లేదా ‘కొన్ని రోజులు’ అనే సహజ అర్థాన్ని ఇస్తుంది; ఇక్కడ కొంత దీర్ఘమైన బసను ‘చాలారోజులు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: διέτριβον
  choice: గడుపుతుండగా
  rationale: διατρίβω ఒక చోట ఉండడం లేదా కాలం గడపడం అనే భావాన్ని ఇస్తుంది. అసంపూర్ణ భూతకాల రూపాన్ని, ὡς‌తో ఉన్న కాలసంబంధాన్ని ఈ ప్రయోగం సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἀνέθετο
  choice: రాజు ముందు ఉంచి
  rationale: ఈ మధ్యమ రూపం ఒక విషయాన్ని మరొకరి పరిశీలనకు సమర్పించడం లేదా వివరించడం అనే భావాన్ని కలిగి ఉంది. ‘ముందు ఉంచి’ అనేది కేవలం సమాచారం చెప్పడం కంటే ఆ భావాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: τὰ κατὰ τὸν Παῦλον
  choice: పౌలుకు సంబంధించిన విషయాలను
  rationale: ఈ గ్రీకు నానుడి పౌలుకు సంబంధించిన వ్యవహారాలను, సందర్భంలో అతని న్యాయవిషయాన్ని, సూచిస్తుంది. అనవసరంగా ‘కేసు’ అని నిర్దిష్టం చేయకుండా మూలంలోని విస్తృతతను కాపాడుతుంది.
- source_word: Ἀνήρ τίς ἐστιν
  choice: ఒక మనిషి ఉన్నాడు
  rationale: τίς నిర్దిష్టమైనప్పటికీ పేరు చెప్పని వ్యక్తిని పరిచయం చేస్తుంది. ఆధునిక తెలుగులో ‘ఒక మనిషి ఉన్నాడు’ సహజంగా అదే అనిర్దిష్ట పరిచయాన్ని తెలియజేస్తుంది.
- source_word: καταλελειμμένος
  choice: వదిలివెళ్లిన
  rationale: పరిపూర్ణ కర్మణి కృదంతం గతంలో వదిలిన చర్య వల్ల కొనసాగుతున్న స్థితిని సూచిస్తుంది. ‘వదిలివెళ్లిన’ ఆ చర్యను, దాని కొనసాగుతున్న ఫలితాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘పరిత్యజించిన’ అనే భావోద్వేగ ఛాయను జోడించదు.
- source_word: δέσμιος
  choice: ఖైదీగా
  rationale: δέσμιος అంటే ఖైదీ. ‘ఖైదీగా’ అనేది ఫేలిక్సు అతణ్ణి ఏ స్థితిలో వదిలివెళ్లాడో స్పష్టం చేస్తుంది.
- source_word: βασιλεῖ
  choice: రాజు
  rationale: మూలపాఠంలో ఈ వచనంలో వ్యక్తిపేరు మళ్లీ చెప్పకుండా ‘రాజు’ అనే బిరుదే ఉంది; సందర్భం అతడు అగ్రిప్పా అని స్పష్టం చేస్తుంది.
