- from: 'వారు అక్కడ చాలారోజులు గడుపుతుండగా, ఫేస్తు పౌలుకు సంబంధించిన విషయాలను[a] రాజు ముందు ఉంచి[b] ఇలా అన్నాడు: “ఫేలిక్సు ఖైదీగా వదిలివెళ్లిన ఒక మనిషి ఉన్నాడు.”'
