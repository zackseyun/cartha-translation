id: ACT.25.20
reference: Acts 25:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπορούμενος δὲ ἐγὼ τὴν περὶ ⸀τούτων ζήτησιν ἔλεγον εἰ βούλοιτο πορεύεσθαι εἰς ⸀Ἱεροσόλυμα κἀκεῖ κρίνεσθαι περὶ τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/020.yaml
  text: And since I was at a loss about the investigation concerning these matters[b][a], I asked whether he wanted to go to Jerusalem and be judged there concerning them.
translation:
  language: te
  text: అయితే ఈ విషయాల గురించిన విచారణ విషయంలో నేను సందిగ్ధంలో ఉండి[a], అతడు యెరూషలేముకు వెళ్లి అక్కడ ఈ విషయాల గురించి తీర్పు పొందాలనుకుంటున్నాడా[b] అని అడిగాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ విషయాల గురించిన వివాదం విషయంలో అయోమయంలో ఉండి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతడు యెరూషలేముకు వెళ్లి అక్కడ ఈ విషయాల గురించి విచారణకు లోబడడానికి సమ్మతిస్తున్నాడా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπορούμενος
  choice: నాకు దారి తోచక
  rationale: ఈ కృదంతం అయోమయం లేదా ఏం చేయాలో తెలియని స్థితిని సూచిస్తుంది. సందర్భంలో కారణార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ζήτησιν
  choice: విచారణలో
  rationale: న్యాయపరమైన సందర్భంలో పరిశీలన లేదా విచారణ అనే భావం సరిపోతుంది; అయితే ‘వివాదం’ అనే అర్థసంభావ్యతను పాదసూచికలో నిలిపాం.
- source_word: περὶ τούτων
  choice: ఈ విషయాలకు సంబంధించిన
  rationale: ఆరోపణలు, మతపరమైన వివాదాంశాలు సహా ముందుగా ప్రస్తావించిన సంగతులను విస్తృతంగా సూచిస్తుంది.
- source_word: ἔλεγον
  choice: అడిగాను
  rationale: పదశః ‘చెప్పాను’ అయినా, వెంట వచ్చే εἰ పరోక్ష ప్రశ్నను పరిచయం చేస్తున్నందున తెలుగులో ‘అడిగాను’ కార్యార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: εἰ βούλοιτο
  choice: ఇష్టపడుతున్నాడా
  rationale: పౌలు కోరికను లేదా సమ్మతిని గురించి ఫేస్తు అడిగిన ప్రశ్నను సహజంగా వ్యక్తం చేస్తుంది; ‘సమ్మతిస్తున్నాడా’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: πορεύεσθαι
  choice: వెళ్లి
  rationale: గమనం అనే సాధారణ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: Ἱεροσόλυμα
  choice: యెరూషలేముకు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన స్థలనామ రూపాన్ని ఉపయోగించాం.
- source_word: κἀκεῖ κρίνεσθαι
  choice: అక్కడ ... తీర్పు పొందడానికి
  rationale: క్రియ యొక్క న్యాయపరమైన నిష్క్రియార్థాన్ని నిలుపుతూ, కేవలం విచారణ జరగడం కంటే విస్తృతమైన న్యాయనిర్ణయ భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: κρίνεσθαι అనే న్యాయపదం యొక్క పరిధి
  choice: తీర్పు పొందడానికి
  alternative: విచారణకు హాజరవడానికి
  rationale: మూలపదం అధికారిక విచారణను సూచించగలిగినా, దాని విస్తృతమైన ‘న్యాయనిర్ణయం పొందడం’ అనే భావాన్ని ప్రధాన పాఠంలో కాపాడాం; ప్రత్యేక న్యాయప్రక్రియను అనవసరంగా నిర్దేశించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయపరమైన శైలిని పాటించాం. గ్రీకు వాక్యంలోని కారణార్థక కృదంతాన్ని సహజంగా మార్చినా, విచారణ/వివాదం మరియు ఇష్టం/సమ్మతి మధ్య ఉన్న భావభేదాలను పాదసూచికల్లో నిలిపాం.
