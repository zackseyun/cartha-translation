source:
  edition: SBLGNT
  text: ὁ Φῆστος δὲ ⸂θέλων τοῖς Ἰουδαίοις⸃ χάριν καταθέσθαι ἀποκριθεὶς τῷ Παύλῳ εἶπεν· Θέλεις εἰς Ἱεροσόλυμα ἀναβὰς ἐκεῖ περὶ τούτων ⸀κριθῆναι ἐπ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/009.yaml
  text: But Festus[a], wanting to do the Jews a favor, answered Paul and said[c][b], “Do you want to go up to Jerusalem and there be judged before me concerning these things?”
translation:
  language: te
  text: 'కానీ ఫేస్తు యూదులకు[a] ఒక ఉపకారం చేయాలని కోరుకుంటూ పౌలుతో ఇలా అన్నాడు: “నువ్వు యెరూషలేముకు వెళ్లి, అక్కడ ఈ విషయాల గురించి నా సమక్షంలో విచారణకు గురికావడానికి[c] ఇష్టపడుతున్నావా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “యూదులు” అనే మాట యూదులందరినీ కాక, సందర్భానుసారంగా పౌలుపై కేసు నడిపిస్తున్న యూదు నిందారోపకులను లేదా నాయకులను సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా “విచారణకు నిలబడడానికి” లేదా “తీర్పు పొందడానికి”; న్యాయ సందర్భంలో ఈ పదం విచారణకు లోనవడం లేదా తీర్పు పొందడం అనే భావాలను కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: కోరుకొని
  rationale: వర్తమాన కృదంతం ఫేస్తు ఉద్దేశాన్ని తెలియజేస్తుంది; ‘కోరుకొని’ సహజంగా ఉండి ఉద్దేశాన్ని అతిగా బలపరచదు.
- source_word: τοῖς Ἰουδαίοις
  choice: యూదులకు
  rationale: గ్రీకు పదాన్ని నేరుగా నిలుపుతుంది; సందర్భంలో ఇది పౌలుపై కేసు నడిపిస్తున్న యూదు నిందారోపకులు లేదా నాయకులను సూచిస్తుంది.
- source_word: χάριν καταθέσθαι
  choice: మేలు చేయాలని
  rationale: ఎవరికైనా అనుకూలంగా వ్యవహరించడం లేదా ఉపకారం చేయడం అనే నానుడి భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; ‘ప్రసన్నం చేసుకోవాలని’ అనడం మూలంలో కంటే రాజకీయ స్వార్థాన్ని ఎక్కువగా సూచించవచ్చు.
- source_word: ἀποκριθεὶς τῷ Παύλῳ εἶπεν
  choice: పౌలుతో ఇలా అన్నాడు
  rationale: గ్రీకు కథన సూత్రంలోని ‘సమాధానమిస్తూ అన్నాడు’ అనే ద్వంద్వ వ్యక్తీకరణను సహజ తెలుగులో సంక్షిప్తంగా అందిస్తుంది.
- source_word: Θέλεις
  choice: ఇష్టపడుతున్నావా
  rationale: పౌలు సమ్మతి లేదా అభిలాషను అడిగే ప్రత్యక్ష ప్రశ్నను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: εἰς Ἱεροσόλυμα ἀναβὰς
  choice: యెరూషలేముకు వెళ్లి
  rationale: ἀναβαίνωలోని ‘పైకి వెళ్లడం’ అనే భావం ఉన్నప్పటికీ తెలుగులో ‘యెరూషలేముకు పైకి వెళ్లి’ కృత్రిమంగా ఉంటుంది; గమ్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: περὶ τούτων
  choice: ఈ విషయాల గురించి
  rationale: మూలంలోని విస్తృత సూచనను నిలుపుతుంది; ‘ఈ ఆరోపణల గురించి’ అనేది సందర్భసిద్ధమైనా మూలం కంటే నిర్దిష్టంగా ఉంటుంది.
- source_word: κριθῆναι
  choice: విచారించబడడానికి
  rationale: న్యాయ సందర్భంలో κρίνω యొక్క కర్మణి రూపం కేసు విచారణకు లోనవడాన్ని సూచిస్తుంది; ‘తీర్పు పొందడానికి’ కంటే ప్రక్రియను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐπ’ ἐμοῦ
  choice: నా సమక్షంలో
  rationale: ఫేస్తు సమక్షంలో లేదా అతని అధికార పర్యవేక్షణలో విచారణ జరగడం అనే భావాన్ని నిలుపుతుంది; అతడే ఒక్కడు తీర్పరి అని అనవసరంగా నిర్ణయించదు.
theological_decisions:
- issue: ‘యూదులు’ అనే పదాన్ని యూదులందరికీ వర్తింపజేసే ప్రమాదం
  choice: ప్రధాన పాఠ్యంలో మూలంలోని విస్తృత పదానికి అనుగుణంగా ‘యూదులకు’ అని ఉంచి, సందర్భార్థాన్ని పాదసూచికలో వివరించడం.
  alternative: ‘యూదు నాయకులకు’ లేదా ‘యూదు నిందారోపకులకు’ అని ప్రధాన పాఠ్యంలోనే సంకుచితం చేయడం.
  rationale: τοῖς Ἰουδαίοις అనే మూల పదాన్ని కాపాడుతూనే, ఈ కథన సందర్భంలో అది పౌలుపై కేసు నడిపిస్తున్న వర్గాన్ని సూచిస్తుందని స్పష్టం చేయడం సామూహిక దోషారోపణను నివారిస్తుంది.
- issue: ἐπ’ ἐμοῦలో న్యాయాధికార స్వరూపం
  choice: ‘నా సమక్షంలో’ అని అనువదించడం.
  alternative: ‘నా చేత తీర్పు పొందడానికి’ లేదా ‘నా అధికారంలో విచారించబడడానికి’.
  rationale: ఈ పదబంధం ఫేస్తు సమక్షం లేదా అధికారాన్ని సూచించగలదు; అతడే స్వయంగా తుది తీర్పు ఇస్తాడని మూలం కంటే స్పష్టంగా నిర్ధారించకుండా ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. మూలంలోని న్యాయపరమైన అస్పష్టతను ‘విచారించబడడానికి’ మరియు ‘నా సమక్షంలో’ ద్వారా నిలిపాం. ప్రధాన పాఠ్యంలో ఉన్న ప్రతి పాదసూచిక గుర్తుకు అనుగుణమైన పాదసూచిక ఇవ్వబడింది.
