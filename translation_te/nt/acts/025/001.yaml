id: ACT.25.1
reference: Acts 25:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Φῆστος οὖν ἐπιβὰς τῇ ἐπαρχείᾳ μετὰ τρεῖς ἡμέρας ἀνέβη εἰς Ἱεροσόλυμα ἀπὸ Καισαρείας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/001.yaml
  text: So Festus[a], after arriving in the province, went up from Caesarea to Jerusalem after three days,
translation:
  language: te
  text: కాబట్టి ఫేస్తు[a] ప్రావిన్సుకు చేరి మూడు రోజుల తర్వాత, కైసరయ నుండి యెరూషలేముకు పైకి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రావిన్సులో ప్రవేశించిన”; సందర్భాన్ని బట్టి, “ప్రావిన్సు పాలనాబాధ్యతలు స్వీకరించిన” అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సందర్భంతో ఉన్న కథన సంబంధాన్ని చూపిస్తుంది; గ్రీకు అనుసంధాన పదంలోని పర్యవసాన/పురోగమన భావాన్ని నిలుపుతుంది.
- source_word: ἐπιβὰς τῇ ἐπαρχείᾳ
  choice: ఆ ప్రాంతానికి వచ్చిన
  rationale: ἐπιβὰς అనే కృదంతంలోని ‘ప్రవేశించిన/చేరుకున్న’ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; అధికార బాధ్యతలు స్వీకరించాడనే సూచనను ప్రధాన పాఠ్యంలో అతిగా నిర్ధారించదు.
- source_word: ἐπαρχείᾳ
  choice: ప్రాంతం
  rationale: రోమా పరిపాలనా ప్రావిన్సును సూచిస్తుంది; సాధారణ ఆధునిక తెలుగు పాఠకులకు ‘ప్రాంతం’ సహజంగా అర్థమవుతుంది.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: మూడు రోజుల తర్వాత
  rationale: μετά + ద్వితీయా విభక్తి ఇక్కడ కాలానంతర భావాన్ని సూచిస్తుంది; తెలుగు వాక్యక్రమంలో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: ἀνέβη
  choice: వెళ్లాడు
  rationale: యెరూషలేముకు ‘పైకి వెళ్లడం’ అనే భౌగోళిక/సాంప్రదాయిక భావం గ్రీకులో ఉన్నప్పటికీ, ఆధునిక తెలుగులో ‘వెళ్లాడు’ సహజం; మూలంలోని ‘పైకి’ భావాన్ని పాదసూచికలో అనవసరంగా భారంగా చేయలేదు.
- source_word: εἰς Ἱεροσόλυμα
  choice: యెరూషలేముకు
  rationale: గమ్యస్థానాన్ని సహజమైన తెలుగు చతుర్థీ రూపంలో వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ Καισαρείας
  choice: కైసరయ నుంచి
  rationale: ἀπό సూచించే బయలుదేరిన స్థలాన్ని ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: Φῆστος
  choice: ఫేస్తు
  rationale: గ్రీకు Φῆστος ఉచ్చారణకు దగ్గరగా, తెలుగులో సులభంగా చదవదగిన లిప్యంతరీకరణ.
theological_decisions:
- issue: ἐπιβὰς τῇ ἐπαρχείᾳ పరిపాలనా భావం
  choice: ప్రధాన పాఠ్యంలో ‘ఆ ప్రాంతానికి వచ్చిన’ అని ఉంచడం
  alternative: ‘ఆ ప్రాంతపు పాలనాబాధ్యతలు చేపట్టిన’
  rationale: కృదంతం రావడం/ప్రవేశించడం అనే ప్రత్యక్ష భావాన్ని కలిగి ఉంది; పదవీ బాధ్యతలు చేపట్టడం సందర్భం వల్ల సూచితమయ్యే అవకాశం ఉన్నా, దానినే ఏకైక అర్థంగా నిర్ణయించకుండా పాదసూచికలో ప్రత్యామ్నాయాన్ని నమోదు చేయడం మూలంలోని అర్థవిస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథన శైలిలో అనువదించబడింది. ‘ప్రావిన్సు’ కంటే ‘ప్రాంతం’ సాధారణంగా సహజమైనది. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో ఫేస్తు పేరుకు వెంటనే ఉంచబడింది.
