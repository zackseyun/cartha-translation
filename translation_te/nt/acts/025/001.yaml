    reason: lexical_alternative
  revision_rationale: The text is revised only to retain the Roman administrative specificity of ἐπαρχείᾳ and the ‘went up’ sense of ἀνέβη. The temporal participial relationship and the footnoted ambiguity of ἐπιβὰς are preserved.
