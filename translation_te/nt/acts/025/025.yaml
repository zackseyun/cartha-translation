translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. న్యాయసంబంధ పదంగా ‘అప్పీలు’ సాధారణ వాడుకలో స్పష్టంగా ఉండటంతో దానిని ఉపయోగించాం. ప్రధాన పాఠ్యంలో [a] గుర్తు ఉంచబడింది.
