  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ⸀κατελαβόμην μηδὲν ἄξιον ⸂αὐτὸν θανάτου⸃ πεπραχέναι, ⸀αὐτοῦ δὲ τούτου ἐπικαλεσαμένου τὸν Σεβαστὸν ἔκρινα ⸀πέμπειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/025.yaml
  text: But I found that he had done nothing deserving death; and because he himself appealed to the Emperor[a], I decided to send him.
translation:
  language: te
  text: కానీ, అతడు మరణానికి తగినదేదీ చేయలేదని నేను నిర్ధారించాను; అయితే అతనే చక్రవర్తికి[a] అప్పీల్ చేసినందున, అతణ్ణి పంపాలని నిర్ణయించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అగుస్తు.’ గ్రీకు బిరుదైన Σεβαστός ఇక్కడ రోమా చక్రవర్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελαβόμην
  choice: నేను గ్రహించాను
  rationale: విచారణ అనంతరం ఫేస్తు చేసిన నిర్ధారణను ఈ న్యాయసంబంధ సందర్భంలో సహజంగా తెలియజేస్తుంది; అధికారిక తీర్పు అనే భావాన్ని అతిగా మోపదు.
- source_word: μηδὲν ἄξιον ... θανάτου
  choice: మరణానికి తగినదేదీ
  rationale: మరణశిక్షకు పాత్రమైన పని ఏదీ లేదనే భావాన్ని గ్రీకు పదబంధానికి దగ్గరగా ఉంచుతుంది; ‘మరణశిక్ష’ అని చెప్పి రోమా న్యాయపరమైన భావాన్ని మరీ స్పష్టీకరించదు.
- source_word: πεπραχέναι
  choice: చేయలేదు
  rationale: πράσσω యొక్క విస్తృతమైన కార్యార్థాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; సందర్భమే న్యాయపరమైన భావాన్ని తెలియజేస్తుంది.
- source_word: αὐτοῦ δὲ τούτου ἐπικαλεσαμένου
  choice: అతడే ... అప్పీలు చేసుకున్నందువల్ల
  rationale: τούτου యొక్క ఉద్ఘాటనను ‘అతడే’ నిలుపుతుంది; జెనిటివ్ అబ్సల్యూట్‌లోని కారణాత్మక సందర్భాన్ని ‘అందువల్ల’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸν Σεβαστόν
  choice: చక్రవర్తికి
  rationale: Σεβαστός ఇక్కడ రోమా పాలకుని సామ్రాజ్య బిరుదుగా వాడబడింది. ఆధునిక పాఠకుడికి ‘చక్రవర్తి’ సూచిత వ్యక్తిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἔκρινα πέμπειν
  choice: పంపాలని నిర్ణయించుకున్నాను
  rationale: ఫేస్తు తీసుకున్న అధికారిక కార్యనిర్ణయాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; సందర్భం నుంచి అవసరమైన కర్మను ‘అతణ్ణి’గా స్పష్టం చేసింది.
