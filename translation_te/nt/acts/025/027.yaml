translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయపరమైన సందర్భానికి తగిన గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని వ్యక్తిగత అంచనా భావం మరియు ‘కూడా’ అనే అదనపు బలం నిలుపబడ్డాయి.
