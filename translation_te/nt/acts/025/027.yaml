  text: ἄλογον γάρ μοι δοκεῖ πέμποντα δέσμιον μὴ καὶ τὰς κατ’ αὐτοῦ αἰτίας σημᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/027.yaml
  text: For it seems unreasonable to me[a], when sending a prisoner, not also to indicate the charges against him.
translation:
  language: te
  text: ఎందుకంటే, ఒక ఖైదీని పంపేటప్పుడు అతనిమీద ఉన్న ఆరోపణలను కూడా తెలియజేయకపోవడం నాకు సమంజసంగా అనిపించడం లేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనిమీద ఉన్న ఆరోపణలను స్పష్టంగా పేర్కొనకపోవడం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλογον
  choice: సమంజసంగా అనిపించడం లేదు
  rationale: ఈ సందర్భంలో పరిపాలనా చర్యకు తగిన కారణబద్ధత లేదనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘అసంబద్ధం’ కంటే ఇది తక్కువ కఠినంగా ఉండి ఫేస్తు వ్యక్తిగత అంచనాకు సరిపోతుంది.
- source_word: δοκεῖ μοι
  choice: నాకు ... అనిపించడం లేదు
  rationale: గ్రీకు ప్రయోగంలోని వ్యక్తిగత, కొంత మృదువైన అంచనా భావాన్ని నిలుపుతుంది.
- source_word: πέμποντα
  choice: పంపేటప్పుడు
  rationale: వర్తమాన కృదంతం తెలిపే సందర్భ సంబంధాన్ని సహజమైన తెలుగు కాలార్థక నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: δέσμιον
  choice: ఒక ఖైదీని
  rationale: న్యాయపరమైన నిర్బంధంలో ఉన్న వ్యక్తిని సూచించే స్పష్టమైన, సాధారణ తెలుగు పదం.
- source_word: μὴ καὶ
  choice: కూడా ... తెలియజేయకపోవడం
  rationale: καί లోని అదనపు భావాన్ని ‘కూడా’ ద్వారా నిలుపుతూ తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా అమర్చింది.
- source_word: τὰς κατ’ αὐτοῦ αἰτίας
  choice: అతనిమీద ఉన్న ఆరోపణలను
  rationale: న్యాయ సందర్భంలోని αἰτίαι భావాన్ని సహజంగా తెలియజేస్తుంది; ఇది వ్యక్తికి వ్యతిరేకంగా మోపబడిన అభియోగాలను సూచిస్తుంది.
- source_word: σημᾶναι
  choice: తెలియజేయడం
  rationale: ‘సూచించడం/తెలియజేయడం’ అనే మూల భావాన్ని పరిపాలనా సందర్భానికి తగిన సహజ తెలుగులో అందిస్తుంది; ‘స్పష్టంగా పేర్కొనడం’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
