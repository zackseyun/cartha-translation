translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే కథన శైలి ఉపయోగించబడింది. గ్రీకు వాక్యంలోని దీర్ఘ genitive-absolute నిర్మాణాన్ని రెండు సహజ తెలుగు వాక్యాలుగా విభజించి, సంఘటనల క్రమాన్ని యథాతథంగా నిలిపింది.
