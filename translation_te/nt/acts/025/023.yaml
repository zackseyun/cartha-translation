id: ACT.25.23
reference: Acts 25:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τῇ οὖν ἐπαύριον ἐλθόντος τοῦ Ἀγρίππα καὶ τῆς Βερνίκης μετὰ πολλῆς φαντασίας καὶ εἰσελθόντων εἰς τὸ ἀκροατήριον σύν ⸀τε χιλιάρχοις καὶ ἀνδράσιν τοῖς κατ’ ⸀ἐξοχὴν τῆς πόλεως καὶ κελεύσαντος τοῦ Φήστου ἤχθη ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/023.yaml
  text: So on the next day, Agrippa and Bernice came with great pomp and entered the audience hall with both the military tribunes and the prominent men of the city, and at Festus's command Paul was brought in.
translation:
  language: te
  text: అప్పుడు, మరుసటి రోజు అగ్రిప్ప, బెర్నీకే ఎంతో వైభవంగా[a] వచ్చి, సైనిక దళాధిపతులతోను పట్టణంలోని ప్రముఖ పురుషులతోను కలిసి విచారణ మందిరంలోకి ప్రవేశించారు. ఫేస్తు ఆజ్ఞ ఇవ్వగా పౌలును లోపలికి తీసుకొచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎంతో ఆడంబరంతో”; లేదా, “ఎంతో వేడుకపూర్వకంగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ οὖν ἐπαύριον
  choice: కాబట్టి మరుసటి రోజు
  rationale: కాలసూచక దత్తివ విభక్తి ప్రయోగాన్ని సహజమైన తెలుగులో ‘మరుసటి రోజు’గా, οὖν తెలిపే కథన అనుసంధానాన్ని ‘కాబట్టి’గా వ్యక్తం చేసింది.
- source_word: ἐλθόντος τοῦ Ἀγρίππα καὶ τῆς Βερνίκης
  choice: అగ్రిప్ప, బెర్నీకే ... వచ్చి
  rationale: గ్రీకు genitive absolute నిర్మాణాన్ని తెలుగులో సహజమైన పూర్వకాలిక క్రియారూపంతో తెలిపింది; వ్యక్తినామాలను తెలుగు లిపిలో ధ్వన్యనుసారంగా ఇచ్చింది.
- source_word: μετὰ πολλῆς φαντασίας
  choice: ఎంతో ఆడంబరంతో
  rationale: φαντασία ఇక్కడ బహిరంగ ప్రదర్శన, వైభవం, వేడుకపూర్వక ఆడంబరం అనే భావాన్ని సూచిస్తుంది. ‘ఎంతో ఆడంబరంతో’ ఆ దృశ్య ప్రదర్శన భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: εἰσελθόντων εἰς τὸ ἀκροατήριον
  choice: విచారణ మందిరంలోకి ప్రవేశించారు
  rationale: ἀκροατήριον వినికిడి లేదా అధికారిక విచారణ జరిగే స్థలాన్ని సూచిస్తుంది; సందర్భానికి అనుగుణంగా ‘విచారణ మందిరం’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: σύν τε χιλιάρχοις
  choice: సైనిక దళాధిపతులతోనూ
  rationale: χιλίαρχοι ఉన్నత స్థాయి సైనిక అధికారులను సూచిస్తుంది. పదశః ‘సహస్రాధిపతులు’ కంటే ఆధునిక పాఠకులకు ‘సైనిక దళాధిపతులు’ సులభంగా అర్థమవుతుంది; ‘-తోనూ ... -తోనూ’ τε ద్వారా కలిపిన రెండు వర్గాలను ప్రతిబింబిస్తుంది.
- source_word: ἀνδράσιν τοῖς κατ’ ἐξοχὴν τῆς πόλεως
  choice: పట్టణంలోని ప్రముఖులతోనూ
  rationale: κατ’ ἐξοχήν సామాజిక ప్రాముఖ్యత లేదా విశిష్ట స్థానాన్ని సూచిస్తుంది. ‘ప్రముఖులు’ సహజమైన ఆధునిక తెలుగు; గ్రీకులోని ἀνδράσιν పురుషులను స్పష్టంగా సూచిస్తుందనే విషయాన్ని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: κελεύσαντος τοῦ Φήστου
  choice: ఫేస్తు ఆజ్ఞ ఇవ్వగా
  rationale: Genitive absolute‌ను అధికారిక ఆజ్ఞ మరియు తదనంతర చర్య మధ్య సంబంధాన్ని నిలుపుతూ సహజమైన తెలుగు ఉపవాక్యంగా మార్చింది.
- source_word: ἤχθη ὁ Παῦλος
  choice: పౌలును లోపలికి తీసుకొచ్చారు
  rationale: ἄγω కర్మణి రూపం పౌలు ఇతరుల చేత నడిపించబడి లేదా తీసుకురాబడ్డాడని సూచిస్తుంది; తెలుగు అనిర్దిష్ట బహువచన క్రియ కర్మణి భావాన్ని సహజంగా అందిస్తుంది.
