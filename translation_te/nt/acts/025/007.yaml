translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన న్యాయపరమైన శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని participial నిర్మాణాన్ని సహజ తెలుగు వాక్యక్రమంలో అందిస్తూ, ఆరోపణల తీవ్రతను మరియు వాటిని రుజువు చేయలేకపోయిన అంశాన్ని నిలిపాం.
