id: ACT.25.7
reference: Acts 25:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: παραγενομένου δὲ αὐτοῦ περιέστησαν ⸀αὐτὸν οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι, πολλὰ καὶ βαρέα αἰτιώματα ⸀καταφέροντες ἃ οὐκ ἴσχυον ἀποδεῖξαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/007.yaml
  text: And when he arrived[a], the Jews who had come down from Jerusalem stood around him[b], bringing many serious charges that they were not able to prove.
translation:
  language: te
  text: అతడు వచ్చినప్పుడు, యెరూషలేము నుండి దిగివచ్చిన యూదులు[b] అతని చుట్టూ నిలబడి[a], అతనిపై అనేక తీవ్రమైన ఆరోపణలు మోపారు; వాటిని వారు రుజువు చేయలేకపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతన్ని చుట్టుముట్టి.’ గ్రీకు క్రియ ఒకరి చుట్టూ నిలబడడాన్ని నొక్కి చెప్పగలదు; న్యాయవిచారణ సందర్భంలో ఈ భంగిమ ఒత్తిడిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘యూదయవాసులు.’ ఇక్కడ యెరూషలేము నుండి వచ్చిన యూదు నిందారోపకులే సూచించబడుతున్నారు కాబట్టి ప్రధాన పాఠంలో ‘యూదులు’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενομένου δὲ αὐτοῦ
  choice: అతడు వచ్చినప్పుడు
  rationale: ఈ genitive absolute కాలసంబంధ పరిస్థితిని సూచిస్తుంది. సహజమైన తెలుగులో సంఘటనల క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: περιέστησαν αὐτὸν
  choice: అతని చుట్టూ నిలబడి
  rationale: క్రియ యొక్క ప్రాథమిక భావమైన ఒకరి చుట్టూ నిలబడడాన్ని నిలుపుతూ, న్యాయవిచారణ సందర్భంలోని ఒత్తిడిని అతిగా వ్యాఖ్యానించకుండా చూపిస్తుంది.
- source_word: οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι
  choice: యెరూషలేము నుండి దిగివచ్చిన యూదులు
  rationale: Ἰουδαῖοι అనే పదానికి ‘యూదులు’ లేదా ‘యూదయ ప్రాంతవాసులు’ అనే భావాలు ఉండవచ్చు. ఇక్కడ యెరూషలేము నుండి వచ్చిన యూదు నిందారోపకులే ఉద్దేశం; భౌగోళిక అంశం ఇప్పటికే ‘యెరూషలేము నుండి’ అని స్పష్టమైంది.
- source_word: πολλὰ καὶ βαρέα αἰτιώματα
  choice: అనేక తీవ్రమైన నేరారోపణలు
  rationale: αἰτιώματα న్యాయపరమైన అభియోగాలను సూచిస్తుంది; βαρέα వాటి తీవ్రతను తెలియజేస్తుంది. ‘నేరారోపణలు’ న్యాయస్థాన సందర్భాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: καταφέροντες
  choice: మోపారు
  rationale: న్యాయపరమైన సందర్భంలో ఆరోపణలను ఒకరిపై తీసుకురావడం లేదా మోపడం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἃ οὐκ ἴσχυον ἀποδεῖξαι
  choice: వాటిని వారు రుజువు చేయలేకపోయారు
  rationale: ἰσχύω + infinitive సామర్థ్యాన్ని, ἀποδεῖξαι రుజువు చేయడాన్ని సూచిస్తాయి. మూలంలోని కొనసాగుతున్న అసమర్థతను సహజంగా తెలియజేస్తుంది.
