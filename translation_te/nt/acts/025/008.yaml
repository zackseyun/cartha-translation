source:
  edition: SBLGNT
  text: ⸂τοῦ Παύλου ἀπολογουμένου⸃ ὅτι Οὔτε εἰς τὸν νόμον τῶν Ἰουδαίων οὔτε εἰς τὸ ἱερὸν οὔτε εἰς Καίσαρά τι ἥμαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/008.yaml
  text: 'Paul made his defense: “I have sinned in nothing against either the law of the Jews[a], or the temple, or Caesar.”'
translation:
  language: te
  text: పౌలు తన పక్షంగా వాదిస్తూ, “యూదుల ధర్మశాస్త్రానికి గానీ, దేవాలయానికి గానీ, కైసరుకు గానీ వ్యతిరేకంగా నేను ఏ పాపమూ చేయలేదు[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదుల ధర్మశాస్త్రానికి గానీ, దేవాలయానికి గానీ, కైసరుకు గానీ వ్యతిరేకంగా నేను ఏ నేరమూ చేయలేదు.”
    reason: ἥμαρτον అనే క్రియకు ఈ న్యాయస్థాన సందర్భంలో ‘నేరం చేయడం’ లేదా ‘తప్పు చేయడం’ అనే భావం కూడా సాధ్యమని చూపే పదార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: తన పక్షంగా వాదిస్తూ
  rationale: న్యాయస్థాన సందర్భంలోని ఆత్మరక్షణ వాదన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ὅτι
  choice: ప్రత్యక్ష ఉద్ధరణగా విరామచిహ్నాలతో సూచించబడింది
  rationale: ఇది పౌలు వాదనలోని మాటలను పరిచయం చేస్తుంది; తెలుగులో ప్రత్యక్ష ఉద్ధరణ సహజంగా ఉంటుంది.
- source_word: νόμον τῶν Ἰουδαίων
  choice: యూదుల ధర్మశాస్త్రం
  rationale: గ్రీకు షష్ఠీ విభక్తి సంబంధాన్ని కాపాడుతూ, νόμος యొక్క మతపరమైన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἱερόν
  choice: దేవాలయం
  rationale: ఇక్కడ లోపలి పరిశుద్ధ స్థలానికే పరిమితం కాకుండా దేవాలయ సముదాయాన్ని సూచించే సాధారణ పదం.
- source_word: Καίσαρά
  choice: కైసరు
  rationale: రోమా పాలకుని గ్రీకు బిరుదును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరిస్తుంది.
- source_word: τι
  choice: ఏ ... కూడా
  rationale: నిరాకరణతో కలిసి పౌలు చేసిన సంపూర్ణ నిర్దోష ప్రకటనను తెలుగులో సహజంగా బలపరుస్తుంది.
- source_word: ἥμαρτον
  choice: పాపం చేయలేదు
  rationale: న్యాయపరమైన సందర్భం ఉన్నప్పటికీ, ἁμαρτάνω పదంలోని నైతిక-ఆధ్యాత్మిక అనుసంధానాన్ని నిలుపుతుంది.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: గానీ ... గానీ ... గానీ
  rationale: మూడు అంశాలపైనా ఉన్న సమాంతర నిరాకరణను సహజమైన తెలుగు నిర్మాణంలో కాపాడుతుంది.
theological_decisions:
- issue: ἥμαρτον పదంలోని న్యాయపరమైన భావం మరియు నైతిక భావం
  choice: పాపం చేయలేదు
  alternative: ఏ నేరమూ చేయలేదు / ఏ తప్పూ చేయలేదు
  rationale: సందర్భం న్యాయస్థాన సంబంధమైనదైనా, మూలపదం సాధారణంగా ‘పాపం చేయడం’ అనే భావాన్ని కలిగి ఉంది. ప్రధాన పాఠం ఆ పదసంబంధాన్ని నిలుపుతుంది; పాదటిప్పణి సందర్భానుగుణ న్యాయార్థాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన న్యాయస్థాన శైలి. ‘తన పక్షంగా వాదిస్తూ’ అనే రూపం గ్రీకు genitive absolute నిర్మాణాన్ని సహజంగా అందిస్తుంది; ‘ధర్మశాస్త్రం,’ ‘దేవాలయం,’ ‘కైసరు’ సాధారణ బైబిలు పదజాలంతో సరిపోతాయి.
