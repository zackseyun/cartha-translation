    reason: καταδίκην న్యాయస్థానపు ఖండన లేదా దోషనిర్ణయాన్ని సూచిస్తుంది.
  revision_rationale: The revision represents περὶ οὗ and ἐνεφάνισαν more precisely as a matter reported to an authority, while preserving the distinct request (αἰτούμενοι) for a judicial condemnation (καταδίκην) against Paul. It also makes the lexical-alternative footnote correspond more closely to the Greek legal term.
