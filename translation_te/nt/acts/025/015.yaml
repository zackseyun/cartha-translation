revisions:
- from: నేను యెరూషలేముకు వచ్చినప్పుడు, యూదుల ముఖ్య యాజకులు, పెద్దలు అతని గురించి నా దగ్గర ఫిర్యాదు చేసి, అతన్ని దోషిగా తీర్పు తీర్చాలని[a] కోరారు.
  to: నేను యెరూషలేముకు వచ్చినప్పుడు, యూదుల ముఖ్య యాజకులు, పెద్దలు అతని విషయాన్ని నాకు నివేదించి, అతన్ని దోషిగా తీర్పు ఇవ్వాలని[a] కోరారు.
  rationale: The revision represents περὶ οὗ and ἐνεφάνισαν more precisely as a matter reported to an authority, while preserving the distinct request (αἰτούμενοι) for a judicial condemnation (καταδίκην) against Paul. It also makes the lexical-alternative footnote correspond more closely to the Greek legal term.
