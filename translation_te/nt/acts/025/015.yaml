id: ACT.25.15
reference: Acts 25:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: περὶ οὗ γενομένου μου εἰς Ἱεροσόλυμα ἐνεφάνισαν οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τῶν Ἰουδαίων, αἰτούμενοι κατ’ αὐτοῦ ⸀καταδίκην·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/015.yaml
  text: Concerning him[a], when I arrived in Jerusalem, the chief priests and the elders of the Jews informed me, asking for a sentence of condemnation against him.
translation:
  language: te
  text: నేను యెరూషలేముకు వచ్చినప్పుడు, యూదుల ముఖ్య యాజకులు, పెద్దలు అతని విషయాన్ని నాకు నివేదించి, అతన్ని దోషిగా తీర్పు ఇవ్వాలని[a] కోరారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనికి వ్యతిరేకంగా దోషనిర్ణయ తీర్పు ఇవ్వాలని.”
    reason: καταδίκην న్యాయస్థానపు ఖండన లేదా దోషనిర్ణయాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: περὶ οὗ
  choice: అతని గురించి
  rationale: సంబంధ సర్వనామం పౌలును సూచిస్తూ, అతడే వారి ఫిర్యాదుకు సంబంధించిన వ్యక్తి అని తెలియజేస్తుంది.
- source_word: γενομένου μου εἰς Ἱεροσόλυμα
  choice: నేను యెరూషలేముకు వచ్చినప్పుడు
  rationale: γίνομαι తో εἰς మరియు స్థలనామం కలిసిన ఈ ప్రయోగం ఒక ప్రదేశానికి రావడం లేదా చేరుకోవడాన్ని సూచిస్తుంది; కాలార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేసింది.
- source_word: ἐνεφάνισαν
  choice: నా దగ్గర ఫిర్యాదు చేసి
  rationale: అధికారికి ఒక విషయాన్ని తెలియజేయడం లేదా అధికారికంగా నివేదించడం అనే న్యాయపరమైన సందర్భార్థాన్ని ‘ఫిర్యాదు చేసి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἱ ἀρχιερεῖς
  choice: ముఖ్య యాజకులు
  rationale: ఇది ఒక ప్రధాన యాజకుణ్ణి కాక, ప్రముఖ యాజక అధికారులను సూచించే బహువచన బిరుదు.
- source_word: οἱ πρεσβύτεροι τῶν Ἰουδαίων
  choice: యూదుల ... పెద్దలు
  rationale: జననవిభక్తి ఏ పెద్దలను ఉద్దేశిస్తున్నదో గుర్తిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ‘యూదుల ముఖ్య యాజకులు, పెద్దలు’ అని ఉమ్మడిగా చెప్పడం సహజం.
- source_word: αἰτούμενοι
  choice: కోరారు
  rationale: ఫిర్యాదు చేయడంతోపాటు వారు చేసిన అభ్యర్థనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: κατ’ αὐτοῦ
  choice: అతన్ని ... తీర్పు తీర్చాలని
  rationale: ఈ న్యాయసందర్భంలో κατά ప్రతికూలంగా అతనిపై న్యాయచర్య కోరడాన్ని సూచిస్తుంది; తెలుగులో కర్మరూపంతో ఆ భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: καταδίκην
  choice: దోషిగా తీర్పు తీర్చాలని
  rationale: ఈ పదం సాధారణ నిందను కాక న్యాయపరమైన దోషనిర్ణయాన్ని సూచిస్తుంది; తెలుగు న్యాయవాడుకలో అర్థమయ్యే సహజ రూపాన్ని ఎంచుకున్నాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన న్యాయ-పరిపాలనా శైలిని ఉపయోగించాం. గ్రీకు వాక్యక్రమాన్ని యథాతథంగా అనుసరించకుండా, సమాచార సంబంధాలను కాపాడుతూ సహజ తెలుగు క్రమాన్ని ఎంచుకున్నాం.
