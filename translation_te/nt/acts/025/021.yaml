  register: ఆధునిక ప్రామాణిక తెలుగులో న్యాయసందర్భానికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘అప్పీలు’, ‘నిర్బంధం’ వంటి ప్రస్తుత న్యాయపదాలు ఎంచుకోబడ్డాయి; మూలంలోని రెండు సామ్రాజ్య బిరుదుల భేదాన్ని ‘చక్రవర్తి’ మరియు ‘కైసరు’గా నిలిపాం.
