source:
  edition: SBLGNT
  text: τοῦ δὲ Παύλου ἐπικαλεσαμένου τηρηθῆναι αὐτὸν εἰς τὴν τοῦ Σεβαστοῦ διάγνωσιν, ἐκέλευσα τηρεῖσθαι αὐτὸν ἕως οὗ ⸀ἀναπέμψω αὐτὸν πρὸς Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/021.yaml
  text: But when Paul appealed to be kept in custody for the decision of the Emperor[a], I ordered that he be kept in custody until I send him to Caesar.
translation:
  language: te
  text: అయితే పౌలు చక్రవర్తి[a] నిర్ణయం కోసం తనను నిర్బంధంలో ఉంచమని అప్పీలు చేసినప్పుడు, అతణ్ణి కైసరు వద్దకు పంపేవరకు నిర్బంధంలో ఉంచాలని నేను ఆదేశించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చక్రవర్తి’ అనే చోట గ్రీకులో సెబాస్తోస్ ఉంది; ఇది ‘పూజనీయుడు’ అనే భావమున్న, లాటిన్ ‘అగస్టస్’కు సమానమైన సామ్రాజ్య బిరుదు.
    reason: మూలంలోని సామ్రాజ్య బిరుదు ప్రధాన పాఠంలోని సహజ అనువాదంలో కనబడకపోవడం వల్ల దాని పదార్థం, చారిత్రక విలువను తెలియజేయడానికి.
lexical_decisions:
- source_word: ἐπικαλεσαμένου
  choice: అప్పీలు చేసుకున్నప్పుడు
  rationale: రోమా న్యాయసందర్భంలో ఈ మధ్యమవాచక క్రియ అధికారికంగా పై అధికారికి అప్పీలు చేయడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘అప్పీలు చేసుకోవడం’ సహజమైన న్యాయపదప్రయోగం.
- source_word: τηρηθῆναι / τηρεῖσθαι
  choice: నిర్బంధంలో ఉంచాలని / నిర్బంధంలో ఉంచాలని
  rationale: ఇక్కడ τηρέω సాధారణంగా కాపాడడాన్ని కాక అధికారిక నిర్బంధాన్ని సూచిస్తుంది. రెండు సందర్భాల్లోనూ ఒకే పదబంధాన్ని వాడటం మూలంలోని పునరుక్తిని నిలుపుతుంది.
- source_word: διάγνωσιν
  choice: నిర్ణయం
  rationale: ఈ నామవాచకం న్యాయపరమైన నిర్ధారణ లేదా తీర్పును సూచించగలదు. ‘నిర్ణయం’ విచారణ విధానాన్ని గానీ దోషనిర్ణయాన్ని గానీ అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: Σεβαστοῦ
  choice: చక్రవర్తి[a]
  rationale: Σεβαστός ఇక్కడ వ్యక్తిపేరు కాదు; లాటిన్ ‘Augustus’కు సమానమైన సామ్రాజ్య బిరుదు. పాఠకులకు వెంటనే అర్థమయ్యేలా ప్రధాన పాఠంలో ‘చక్రవర్తి’ అని ఇచ్చి, మూలంలోని బిరుదును పాదటిప్పణిలో వివరించాం.
- source_word: ἀναπέμψω
  choice: పంపేవరకు
  rationale: ఈ సందర్భంలో పౌలును ఉన్నత సామ్రాజ్య అధికారమైన కైసరు వద్దకు పంపించడమే భావం. తెలుగులో ‘పంపు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: πρὸς Καίσαρα
  choice: కైసరు దగ్గరికి
  rationale: Καίσαρ రోమా పాలకుని బిరుదుగా వాడబడింది. ‘కైసరు’ చారిత్రక పదరూపాన్ని నిలుపుతుంది; ‘దగ్గరికి’ వ్యక్తి ఎదుటికి పంపబడే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
