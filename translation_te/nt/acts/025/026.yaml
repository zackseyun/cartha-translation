revisions:
- from: అతని గురించి నా ప్రభువుకు[a] రాయడానికి నిర్దిష్టమైన విషయం ఏదీ నా దగ్గర లేదు. అందుకే అతన్ని మీ అందరి ముందుకు, ప్రత్యేకంగా అగ్రిప్ప రాజా, నీ ముందుకు తీసుకొచ్చాను. విచారణ జరిగిన తర్వాత[b] రాయడానికి నాకు ఏదైనా విషయం దొరుకుతుందనే ఉద్దేశంతో ఇలా చేశాను.
  to: అతని విషయమై నా ప్రభువుకు[a] రాయడానికి నాకు నిర్దిష్టమైనదేదీ లేదు. అందుచేత అతన్ని మీ అందరి ఎదుటకు, ముఖ్యంగా నీ ఎదుటకు, అగ్రిప్ప రాజా, తీసుకొచ్చాను; విచారణ జరిగిన తర్వాత[b] నేను రాయడానికి ఏదైనా ఉండేలా చేశాను.
  rationale: సవరించిన పాఠం ἀσφαλές τιను ‘నిర్దిష్టమైనదేదీ’గా, ἐφ’ ὑμῶνను ‘మీ అందరి ఎదుటకు’గా, μάλιστα ἐπὶ σοῦను ‘ముఖ్యంగా నీ ఎదుటకు’గా, అలాగే ὅπως ... σχῶ τί γράψωను ‘నేను రాయడానికి ఏదైనా ఉండేలా’గా నేరుగా ప్రతిబింబిస్తుంది. అవసరం లేని ‘ఇలా చేశాను’ అనే అదనపు సూచన తొలగించబడింది. పాదసూచిక గుర్తులు ప్రధాన పాఠంలోని సంబంధిత పదాల వెంటనే ఉన్నాయి.
