id: ACT.25.26
reference: Acts 25:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: περὶ οὗ ἀσφαλές τι γράψαι τῷ κυρίῳ οὐκ ἔχω· διὸ προήγαγον αὐτὸν ἐφ’ ὑμῶν καὶ μάλιστα ἐπὶ σοῦ, βασιλεῦ Ἀγρίππα, ὅπως τῆς ἀνακρίσεως γενομένης σχῶ τί ⸀γράψω·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/026.yaml
  text: Concerning him I have nothing definite to write to my lord[a]. Therefore I have brought him before you all, and especially before you, King Agrippa, so that, after the examination has taken place[b], I may have something to write.
translation:
  language: te
  text: అతని విషయమై నా ప్రభువుకు[a] రాయడానికి నాకు నిర్దిష్టమైనదేదీ లేదు. అందుచేత అతన్ని మీ అందరి ఎదుటకు, ముఖ్యంగా నీ ఎదుటకు, అగ్రిప్ప రాజా, తీసుకొచ్చాను; విచారణ జరిగిన తర్వాత[b] నేను రాయడానికి ఏదైనా ఉండేలా చేశాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత స్పష్టంగా, “చక్రవర్తికి.” ఈ సామ్రాజ్య సందర్భంలో గ్రీకు పాఠం κύριος అనే సాధారణ బిరుదును ఉపయోగిస్తూ “నా ప్రభువుకు” అని చెబుతుంది.
    reason: alternative_reading
  - marker: b
    text: “విచారణ”ను “న్యాయపరమైన పరిశీలన” లేదా “విచారణ-సభ” అని కూడా అనువదించవచ్చు. ఇది పౌలు కేసుకు సంబంధించిన న్యాయపర పరిశోధనను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλές τι
  choice: నిర్దిష్టమైన విషయం ఏదీ
  rationale: ἀσφαλής ఇక్కడ అధికారిక నివేదికలో రాయదగిన నిశ్చితమైన లేదా ఆధారపూర్వకమైన విషయాన్ని సూచిస్తుంది. సహజమైన న్యాయపర సందర్భంలో ‘నిర్దిష్టమైన విషయం’ దీనిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τῷ κυρίῳ
  choice: నా ప్రభువుకు
  rationale: κύριος అనే మూలపదపు ‘ప్రభువు’ భావాన్ని నిలుపుతూ, ఈ సామ్రాజ్య పరిపాలనా సందర్భంలో చక్రవర్తిని సూచిస్తుందని పాదసూచికలో స్పష్టం చేయబడింది.
- source_word: προήγαγον αὐτὸν ἐφ’ ὑμῶν
  choice: అతన్ని మీ అందరి ముందుకు ... తీసుకొచ్చాను
  rationale: προάγω ఇక్కడ సభ ఎదుటికి తీసుకురావడాన్ని సూచిస్తుంది; బహువచనమైన ὑμῶνను ‘మీ అందరి’ అని ఇవ్వడం ద్వారా తరువాతి ఏకవచన సంబోధనతో ఉన్న వ్యత్యాసం నిలుస్తుంది.
- source_word: μάλιστα ἐπὶ σοῦ, βασιλεῦ Ἀγρίππα
  choice: ప్రత్యేకంగా అగ్రిప్ప రాజా, నీ ముందుకు
  rationale: μάλιστα అగ్రిప్పపై ప్రత్యేక దృష్టిని పెడుతుంది. βασιλεῦ Ἀγρίππα సంబోధన కాబట్టి తెలుగులో సహజంగా ‘అగ్రిప్ప రాజా’ అని అనువదించబడింది.
- source_word: τῆς ἀνακρίσεως γενομένης
  choice: విచారణ జరిగిన తర్వాత
  rationale: ἀνάκρισις న్యాయపరమైన పరిశీలన, విచారణ లేదా వినికిడిని సూచిస్తుంది. జనిటివ్ అబ్సల్యూట్ నిర్మాణాన్ని కాలార్థకంగా ‘జరిగిన తర్వాత’ అని సహజీకరించాం.
- source_word: σχῶ τί γράψω
  choice: రాయడానికి నాకు ఏదైనా విషయం దొరుకుతుంది
  rationale: అక్షరార్థంగా ‘నేను ఏమి రాయాలో అది నాకు లభించేలా’ అనే భావాన్ని, అధికారిక నివేదికకు కావలసిన విషయం లభించాలనే ఉద్దేశంగా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవేతర సామ్రాజ్య సందర్భంలో κύριος అనువాదం
  choice: నా ప్రభువుకు
  alternative: చక్రవర్తికి
  rationale: ఈ సందర్భంలో κύριος దేవుణ్ణి లేదా మెస్సీయను కాక రోమా చక్రవర్తిని సూచిస్తుంది. అయినప్పటికీ మూలపదపు బిరుదు రూపాన్ని ప్రధాన పాఠంలో నిలిపి, సూచిత వ్యక్తిని పాదసూచికలో స్పష్టం చేయడం ద్వారా అసలు భాషా రూపమూ సందర్భార్థమూ రెండూ పరిరక్షించబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన పరిపాలనా-న్యాయ శైలి పాటించబడింది. సమూహాన్ని సూచించే ‘మీ అందరి’కి, అగ్రిప్పను నేరుగా సంబోధించే ‘నీ’కి మధ్య మూలంలోని బహువచన-ఏకవచన వ్యత్యాసం నిలుపబడింది. ‘నా ప్రభువు’ కొంత అధికారికంగా వినిపించినా మూలంలోని సామ్రాజ్య బిరుదును కాపాడుతుంది; పాదసూచిక దాని సూచనను వివరిస్తుంది.
