id: ACT.25.24
reference: Acts 25:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καί φησιν ὁ Φῆστος· Ἀγρίππα βασιλεῦ καὶ πάντες οἱ συμπαρόντες ἡμῖν ἄνδρες, θεωρεῖτε τοῦτον περὶ οὗ ⸀ἅπαν τὸ πλῆθος τῶν Ἰουδαίων ⸀ἐνέτυχόν μοι ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε, ⸀βοῶντες μὴ δεῖν ⸂αὐτὸν ζῆν⸃ μηκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/024.yaml
  text: And Festus says[a], “King Agrippa, and all the men present with us, you see this man, about whom the whole body of the Jews petitioned me, both in Jerusalem and here[b], shouting that he ought no longer to live.”
translation:
  language: te
  text: 'ఫేస్తు ఇలా అన్నాడు: “అగ్రిప్ప రాజా, మాతో కలిసి ఉన్న పురుషులారా, ఈ మనిషిని చూడండి. ఇతని గురించి యూదుల సమూహమంతా[a] యెరూషలేములోనూ ఇక్కడా నాకు విజ్ఞప్తి చేశారు; ఇతడు ఇక జీవించి ఉండకూడదని[b] కేకలు వేశారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యూదుల జనసమూహమంతా.” ఇది ఫేస్తు చేసిన సమష్టి వర్ణన; మినహాయింపులేకుండా ప్రతి యూదు వ్యక్తినీ తప్పనిసరిగా సూచించదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఇతడు ఇక బ్రతకకూడదని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: ఇలా అన్నాడు
  rationale: గ్రీకులో ఇది చారిత్రక వర్తమాన కాలంలో ఉన్నప్పటికీ, తెలుగు కథనంలో సహజమైన భూతకాల రూపం వాడటం లూకా చెప్పే సంఘటనల క్రమాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: συμπαρόντες ἡμῖν ἄνδρες
  choice: మాతోపాటు ఇక్కడ ఉన్న పురుషులారా
  rationale: సమావేశంలో ఫేస్తుతో కలిసి ఉన్న పురుషులను ఉద్దేశించిన సంబోధనను లింగసూచనతో సహా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: θεωρεῖτε τοῦτον
  choice: మీరు ఈ మనిషిని చూస్తున్నారు
  rationale: సభ ఎదుట ఉన్న పౌలు వైపు ఫేస్తు దృష్టి మళ్లిస్తున్న భావాన్ని వర్తమాన రూపంలో నిలుపుతుంది.
- source_word: ἅπαν τὸ πλῆθος τῶν Ἰουδαίων
  choice: యూదుల సమూహమంతా
  rationale: πλῆθος అనే సమష్టి పదాన్ని నిలుపుతూ, ప్రతి యూదు వ్యక్తినీ మినహాయింపులేకుండా సూచిస్తున్నట్టుగా అనవసరంగా విస్తరించదు.
- source_word: ἐνέτυχόν μοι
  choice: నాకు విజ్ఞప్తి చేశారు
  rationale: అధికారిని ఒక అభ్యర్థనతో సంప్రదించిన న్యాయపరమైన, అధికారిక సందర్భానికి తగిన రూపం.
- source_word: ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε
  choice: యెరూషలేములోనూ ఇక్కడా
  rationale: రెండు ప్రదేశాలనూ జతచేసే గ్రీకు నిర్మాణాన్ని సంక్షిప్తమైన సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: βοῶντες
  choice: కేకలు వేశారు
  rationale: బిగ్గరగా, పట్టుదలతో చేసిన డిమాండును స్పష్టంగా తెలియజేస్తుంది.
- source_word: μὴ δεῖν αὐτὸν ζῆν μηκέτι
  choice: ఇతడు ఇక జీవించి ఉండకూడదు
  rationale: అతడు ఇక జీవించడం సముచితం కాదనే వారి వాదనలోని అవసరతను నిలుపుతుంది; దీనిని ప్రత్యేకమైన న్యాయశిక్ష సూత్రంగా మార్చదు.
theological_decisions:
- issue: వ్యతిరేక న్యాయసందర్భంలో ‘యూదులు’ అనే ప్రస్తావన
  choice: గ్రీకులోని జాతి-సామాజిక సూచనను ‘యూదులు’గా ఉంచి, πλῆθοςను ‘సమూహం’గా అనువదించడం
  alternative: యూదు నాయకులు / యూదులందరూ
  rationale: మూలపాఠం ‘యూదులు’ అని స్పష్టంగా చెబుతుంది కాబట్టి దానిని ‘నాయకులు’గా కుదించకూడదు. అదే సమయంలో ఇది ఫేస్తు చేసిన సమష్టి వర్ణన; ప్రతి యూదు వ్యక్తి వ్యతిరేకించాడని తప్పనిసరిగా చెప్పదు.
- issue: δεῖν ద్వారా వ్యక్తమయ్యే అవసరత లేదా సముచితత్వం
  choice: ఇక జీవించి ఉండకూడదు
  alternative: ఇక జీవించడానికి వీల్లేదు / ఇతనికి మరణశిక్ష విధించాలి
  rationale: మూలంలోని బలమైన నిరాకరణను నిలుపుతూ, అక్కడ నేరుగా లేని నిర్దిష్ట మరణశిక్షా సూత్రాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన సభా-న్యాయశైలిని ఉపయోగించాం. ‘విజ్ఞప్తి చేశారు’ అధికారిక సందర్భాన్ని, ‘కేకలు వేశారు’ గ్రీకు క్రియలోని తీవ్రతను నిలుపుతాయి.
