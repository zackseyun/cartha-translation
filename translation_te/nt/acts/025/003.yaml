id: ACT.25.3
reference: Acts 25:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: αἰτούμενοι χάριν κατ’ αὐτοῦ ὅπως μεταπέμψηται αὐτὸν εἰς Ἰερουσαλήμ, ἐνέδραν ποιοῦντες ἀνελεῖν αὐτὸν κατὰ τὴν ὁδόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/003.yaml
  text: asking a favor against him[a], that he would have him brought to Jerusalem, while setting an ambush to kill him on the way.
translation:
  language: te
  text: అతనికి వ్యతిరేకంగా ఒక ఉపకారం చేయమని, అంటే అతన్ని యెరూషలేముకు రప్పించాలని[a] కోరారు; దారిలో అతన్ని చంపడానికి మాటు వేస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతన్ని యెరూషలేముకు పిలిపించాలని.” గ్రీకు క్రియకు “పిలిపించు” లేదా “రప్పించు” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτούμενοι
  choice: కోరారు
  rationale: వర్తమాన మధ్యమ కృదంతం మునుపటి వచనంలోని కర్తతో సంబంధం కలిగి ఉంది. తెలుగులో సహజమైన సంపూర్ణ వాక్యంగా ఉండేందుకు ప్రధాన క్రియగా అనువదించబడింది; సమకాలీన చర్యను మరో కృదంత నిర్మాణం ద్వారా నిలిపాం.
- source_word: χάριν
  choice: ఒక ఉపకారం
  rationale: αἰτεῖν χάριν అనే ప్రయోగం ఒక ఉపకారం లేదా అనుకూలమైన మినహాయింపును కోరడాన్ని సూచిస్తుంది. ‘ఒక ఉపకారం’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: κατ’ αὐτοῦ
  choice: అతనికి వ్యతిరేకంగా
  rationale: సందర్భంలో ఇది పౌలును గురించిన తటస్థ అభ్యర్థన కాదు, అతనికి హాని కలిగించే శత్రుత్వపూరిత అభ్యర్థన.
- source_word: ὅπως
  choice: —అతన్ని ... రప్పించాలని—
  rationale: కోరిన ఉపకారం యొక్క విషయాన్ని లేదా ఉద్దేశాన్ని పరిచయం చేస్తుంది. విరామచిహ్నాలతో వివరణాత్మక సంబంధాన్ని స్పష్టంగా చూపించాం.
- source_word: μεταπέμψηται
  choice: రప్పించాలని
  rationale: మధ్యమ ప్రయోగంలోని ఈ క్రియ ‘పిలిపించు’ లేదా ‘రప్పించు’ అనే భావాన్ని ఇస్తుంది. ఇక్కడ ఫేస్తు పౌలును యెరూషలేముకు తరలించే ఏర్పాటు చేయాలనే ఉద్దేశం కాబట్టి ‘రప్పించాలని’ సహజంగా సరిపోతుంది.
- source_word: εἰς Ἰερουσαλήμ
  choice: యెరూషలేముకు
  rationale: గమ్యస్థానాన్ని సూచించే సహజమైన తెలుగు రూపం.
- source_word: ἐνέδραν ποιοῦντες
  choice: మాటు వేస్తూ
  rationale: ప్రధాన అభ్యర్థనతో సమకాలంలో సాగుతున్న కుట్రను కృదంత రూపంలో నిలుపుతుంది; ‘మాటు వేయడం’ ఆధునిక తెలుగులో ఆకస్మిక దాడి కోసం దాక్కోవడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀνελεῖν
  choice: చంపడానికి
  rationale: ఈ సందర్భంలో ἀναιρέω ప్రాణం తీయడాన్ని నేరుగా సూచిస్తుంది; ‘చంపడానికి’ అదనపు నైతిక లేదా న్యాయపరమైన వ్యాఖ్యానం లేకుండా భావాన్ని అందిస్తుంది.
- source_word: κατὰ τὴν ὁδόν
  choice: దారిలో
  rationale: ప్రయాణ మార్గమధ్యంలో అనే భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
