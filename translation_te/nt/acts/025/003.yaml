revisions:
- from: దారిలో అతన్ని చంపడానికి మాటు వేస్తూ, అతనికి వ్యతిరేకంగా తమకు ఒక ఉపకారం చేయాలని—అతన్ని యెరూషలేముకు రప్పించాలని[a]—కోరారు.
  to: అతనికి వ్యతిరేకంగా ఒక ఉపకారం చేయమని, అంటే అతన్ని యెరూషలేముకు రప్పించాలని[a] కోరారు; దారిలో అతన్ని చంపడానికి మాటు వేస్తూ ఉన్నారు.
  rationale: Removed the added “తమకు” and recast the sentence so that the request and its content are clear without supplying an unstated beneficiary. The final participial clause now explicitly conveys the ongoing/simultaneous ambush preparation while retaining the source meaning.
