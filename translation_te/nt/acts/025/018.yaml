translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయసభ సందర్భానికి తగిన గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. మూలంలోని ‘దుష్కార్యాలు’ అనే విస్తృత భావాన్ని ప్రధాన పాఠంలో నిలిపి, ‘నేరాలు’ అనే న్యాయపరమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
