id: ACT.25.18
reference: Acts 25:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: περὶ οὗ σταθέντες οἱ κατήγοροι οὐδεμίαν αἰτίαν ⸀ἔφερον ὧν ⸂ἐγὼ ὑπενόουν⸃ ⸀πονηρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/018.yaml
  text: Concerning him[a], when the accusers stood up, they brought no charge of the evil things that I was suspecting,
translation:
  language: te
  text: అతని గురించి ఆరోపణలు చేసినవారు నిలబడ్డప్పుడు, నేను అనుమానించిన దుష్కార్యాలకు సంబంధించి వారు ఏ ఆరోపణనూ మోపలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను అనుమానించిన నేరాలకు సంబంధించి వారు ఏ ఆరోపణనూ మోపలేదు.” గ్రీకు పాఠంలో ‘దుష్కార్యాలు’ అనే విస్తృత భావమున్న పదం ఉంది; అది చట్టపరంగా నిర్వచించిన నేరాలకే పరిమితం కాకుండా సాధారణ తప్పులను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: అతని గురించి
  rationale: περί + షష్ఠీ విభక్తి ఇక్కడ పౌలును గురించి చర్చిస్తున్న విషయాన్ని సూచిస్తుంది; ఈ తెలుగుపదబంధం సహజంగా ఆ సూచనను నిలుపుతుంది.
- source_word: σταθέντες
  choice: నిలబడి
  rationale: ἵστημι క్రియ యొక్క భూతకృదంతం న్యాయసభలో నిందారోపకులు తమ వాదన వినిపించడానికి నిలబడిన సందర్భాన్ని తెలియజేస్తుంది.
- source_word: οἱ κατήγοροι
  choice: నిందారోపకులు
  rationale: న్యాయపరమైన సందర్భంలో ఆరోపణలు చేసేవారిని సూచించే κατήγοροι అనే పదానికి ఇది స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగు రూపం.
- source_word: οὐδεμίαν αἰτίαν ἔφερον
  choice: దేనినీ అతనిపై మోపలేదు
  rationale: φέρειν αἰτίαν అనే న్యాయపరమైన ప్రయోగం ఆరోపణ మోపడాన్ని సూచిస్తుంది. ముందున్న ‘దుష్కార్యాల్లో’తో కలిపి ఈ రూపం తెలుగులో సహజంగా పూర్తి భావాన్ని ఇస్తుంది.
- source_word: ὧν
  choice: దుష్కార్యాల్లో దేనినీ
  rationale: షష్ఠీ బహువచన సంబంధ సర్వనామం, ఫేస్తు ఊహించిన రకమైన దుష్కార్యాల్లో ఒక్కదానికీ ఆరోపణ రాలేదనే సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐγὼ ὑπενόουν
  choice: నేను అనుమానించిన
  rationale: ὑπονοέω యొక్క అసంపూర్ణ భూతకాల రూపం అప్పటివరకు కొనసాగిన అనుమానం లేదా ముందస్తు అంచనాను సూచిస్తుంది; సందర్భంలో ‘అనుమానించిన’ సహజంగా ఉంది.
- source_word: πονηρῶν
  choice: దుష్కార్యాలు
  rationale: నపుంసక బహువచనమైన πονηρῶν సాధారణంగా చెడ్డ పనులు లేదా తప్పులను సూచించగలదు. ‘నేరాలు’ అని పరిమితం చేయకుండా మూలంలోని విస్తృత భావాన్ని ఇది నిలుపుతుంది.
