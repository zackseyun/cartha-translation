revisions:
- from: అతని గురించి నిందారోపకులు నిలబడి, నేను అనుమానించిన దుష్కార్యాల్లో దేనినీ అతనిపై మోపలేదు.[a]
  to: అతని గురించి ఆరోపణలు చేసినవారు నిలబడ్డప్పుడు, నేను అనుమానించిన దుష్కార్యాలకు సంబంధించి వారు ఏ ఆరోపణనూ మోపలేదు.[a]
  rationale: The revision makes αἰτίαν (“charge/accusation”) the explicit object of the verb and connects it to the suspected πονηρῶν (“evil things/wrongdoings”) by “కు సంబంధించి.” This removes a possible semantic ambiguity while preserving the source’s legal register and lexical breadth.
