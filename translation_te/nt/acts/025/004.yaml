  text: ὁ μὲν οὖν Φῆστος ἀπεκρίθη τηρεῖσθαι τὸν Παῦλον ⸂εἰς Καισάρειαν⸃, ἑαυτὸν δὲ μέλλειν ἐν τάχει ἐκπορεύεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/004.yaml
  text: Festus therefore answered that Paul was being kept in Caesarea, and that he himself was about to leave shortly.
translation:
  language: te
  text: 'అందుకు ఫేస్తు ఇలా జవాబిచ్చాడు: పౌలును కైసరయలో అదుపులో ఉంచారని,[a] తాను మాత్రం త్వరలో బయలుదేరబోతున్నానని.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కైసరయకు/కైసరయలో’ అనే పదబంధం మూల గ్రీకు పాఠంలో సందిగ్ధమైనది. సందర్భాన్ని బట్టి ఇక్కడ పౌలు కైసరయలో అదుపులో ఉన్నాడనే భావంతో అనువదించబడింది.
    reason: SBLGNTలో ⸂εἰς Καισάρειαν⸃ బ్రాకెట్లలో ఉండటాన్ని సూచిస్తూ, అనువాదం ఎంచుకున్న సందర్భార్థాన్ని పారదర్శకంగా తెలియజేస్తుంది.
lexical_decisions:
- source_word: τηρεῖσθαι
  choice: కాపలాలో ఉన్నాడని
  rationale: వర్తమాన కర్మణి భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; పౌలు స్వేచ్ఛగా నివసించడం కాక అధికారుల అదుపులో ఉంచబడిన సందర్భాన్నీ తెలియజేస్తుంది.
- source_word: εἰς Καισάρειαν
  choice: కైసరయలో
  rationale: ఈ చోట పాఠాంతర/వ్యాకరణ అసాధారణత ఉన్నప్పటికీ సందర్భార్థం పౌలు కైసరయలో నిర్బంధంలో ఉన్నాడనే దిశలో స్పష్టంగా ఉంది; తెలుగులో స్థానార్థక రూపం సహజం.
- source_word: ἐν τάχει ἐκπορεύεσθαι
  choice: త్వరలోనే అక్కడికి బయలుదేరబోతున్నాను
  rationale: μέλλειν తో కలిసిన భావాన్ని సమీప భవిష్యత్తుగా, ἐν τάχει ను ఆలస్యం లేక త్వరలోగా, ἐκπορεύεσθαι ను ప్రయాణానికి బయలుదేరడంగా అందిస్తుంది. గమ్యం సందర్భం ద్వారా కైసరయ కావడంతో 'అక్కడికి' చేర్చడం తెలుగులో స్పష్టతనిస్తుంది.
