  register: ఆధునిక ప్రామాణిక తెలుగు; కథనశైలికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన వాక్య నిర్మాణం. పరోక్ష వచనంలోని రెండు అంశాలను ‘అనీ…అనీ’తో సమాంతరంగా ఉంచాం.
