id: ACT.25.19
reference: Acts 25:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ζητήματα δέ τινα περὶ τῆς ἰδίας δεισιδαιμονίας εἶχον πρὸς αὐτὸν καὶ περί τινος Ἰησοῦ τεθνηκότος, ὃν ἔφασκεν ὁ Παῦλος ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/019.yaml
  text: Rather[a], they had certain disputes with him about their own religion and about a certain Jesus who had died, whom Paul claimed to be alive.
translation:
  language: te
  text: అందుకు బదులుగా, తమ సొంత మతం[a] గురించి, చనిపోయిన యేసు అనే ఒక వ్యక్తి గురించి వారికి అతనితో కొన్ని వివాదాలు ఉన్నాయి. ఆ యేసు బతికే ఉన్నాడని పౌలు వాదించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమ సొంత మూఢనమ్మకం.’ ఇక్కడున్న గ్రీకు పదాన్ని ‘మతం’ అనే తటస్థ భావంలోనూ, బయటి వ్యక్తి తక్కువచేసి ‘మూఢనమ్మకం’ అనే భావంలోనూ ఉపయోగించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματα
  choice: వివాదాలు
  rationale: ఈ పదం తటస్థమైన ప్రశ్నలను కాక, విభేదానికి లోనైన విషయాలను సూచిస్తుంది. సందర్భంలోని ప్రతికూల వాదనల భావాన్ని ‘వివాదాలు’ సహజంగా నిలుపుతుంది.
- source_word: δέ
  choice: అందుకు బదులుగా
  rationale: ముందటి వచనంలో తాను ఊహించిన నేరారోపణలు లేవన్న మాటకు, వాస్తవంగా ఉన్న అంశాలను వ్యతిరేకంగా చూపించే సరిదిద్దే అనుసంధానాన్ని ఇది స్పష్టం చేస్తుంది.
- source_word: τινα
  choice: కొన్ని
  rationale: ζητήματα అనే నామవాచకాన్ని నిర్దిష్టంగా వివరించకుండా పరిమితం చేసే అనిర్దిష్ట విశేషణ భావాన్ని ఇది సహజమైన తెలుగులో అందిస్తుంది.
- source_word: περὶ τῆς ἰδίας δεισιδαιμονίας
  choice: తమ సొంత మతం గురించి
  rationale: δεισιδαιμονία అనే పదానికి తటస్థంగా ‘మతం’ అనే అర్థమూ, తక్కువచేసే విధంగా ‘మూఢనమ్మకం’ అనే అర్థమూ ఉండవచ్చు. ఆధునిక తెలుగులో అనవసరంగా తీవ్రమైన అవమాన భావాన్ని చేర్చకుండా ‘మతం’ అని అనువదించి, మరో అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἰδίας
  choice: తమ సొంత
  rationale: ఫేస్తు దృష్టిలో అది ఆరోపణ చేసినవారికి ప్రత్యేకంగా చెందిన మతపరమైన పరిధి అనే దూరభావాన్ని ఈ పదబంధం నిలుపుతుంది.
- source_word: εἶχον πρὸς αὐτόν
  choice: వారికి అతనితో ... ఉన్నాయి
  rationale: వారు పౌలుతో విభేదించిన విషయాలు ఉన్నాయనే గ్రీకు ప్రయోగాన్ని, అదనపు న్యాయపరమైన భావం చేర్చకుండా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καὶ περί τινος Ἰησοῦ
  choice: యేసు అనే ఒక వ్యక్తి గురించి
  rationale: τινος అనే పదం ఫేస్తుకు యేసు గురించి పరిచయం లేనట్టుగా లేదా ఆయనను దూరంగా ప్రస్తావిస్తున్నట్టుగా చూపుతుంది. ‘యేసు అనే ఒక వ్యక్తి’ ఆ భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: τεθνηκότος
  choice: చనిపోయిన
  rationale: మరణించి ఆ స్థితిలో ఉన్నాడనే పరిపూర్ణ కృదంత భావాన్ని ఇది సహజంగా అందించి, తరువాతి ‘బతికే ఉన్నాడు’ అనే వాదనతో వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ὃν ἔφασκεν ὁ Παῦλος ζῆν
  choice: ఆ యేసు బతికే ఉన్నాడని పౌలు వాదించాడు
  rationale: φάσκω మరొకరి ప్రకటనను వక్త స్వయంగా సమర్థించకుండా ‘వాదించు/దృఢంగా చెప్పు’ అనే భావంతో నివేదిస్తుంది. ఇది ఫేస్తు బయటి వ్యక్తిగా చెబుతున్న దృష్టికోణాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ఫేస్తు మాటలో δεισιδαιμονία అనువాదం
  choice: మతం
  alternative: మూఢనమ్మకం; మతాచారం
  rationale: ఇది యూదుల విశ్వాసాన్ని అన్యమత అధికారియైన ఫేస్తు వర్ణిస్తున్న సందర్భం. గ్రీకు పదం తప్పనిసరిగా సూచించేదానికంటే ఎక్కువ అవమాన భావాన్ని ఆధునిక అనువాదంలో చేర్చకుండా ‘మతం’ అని ఇచ్చాం; ప్రతికూల అర్థసంభావ్యతను పాదసూచికలో నిలిపాం.
- issue: యేసు బతికే ఉన్నాడనే ప్రకటనను నివేదించడం
  choice: ఆ యేసు బతికే ఉన్నాడని పౌలు వాదించాడు
  alternative: ఆ యేసు బతికే ఉన్నాడని పౌలు చెప్పాడు
  rationale: ఈ ఉపవాక్యం కథకుడి ప్రత్యక్ష నిర్ధారణ కాదు; పౌలు మాటను ఫేస్తు నివేదిస్తున్నాడు. ‘వాదించాడు’ అనే పదం φάσκω భావాన్ని, ఫేస్తు దూర దృష్టికోణాన్ని నిలుపుతుంది; అదే సమయంలో పునరుత్థాన సత్యాన్ని తిరస్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ఫేస్తు చూపించే దూరభావాన్ని ‘తమ సొంత’ మరియు ‘యేసు అనే ఒక వ్యక్తి’ ద్వారా నిలిపాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత పదం వెంట ఉంచబడింది.
