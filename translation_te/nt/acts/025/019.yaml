  terminology: ‘మతం’ is an appropriate primary rendering of δεισιδαιμονία in this context, and the footnote responsibly preserves the potentially pejorative alternative ‘మూఢనమ్మకం.’ ‘చనిపోయిన’ and ‘బతికే ఉన్నాడు’ preserve the intended death/alive contrast. Names and theological language are handled accurately and without interpretive overstatement.
