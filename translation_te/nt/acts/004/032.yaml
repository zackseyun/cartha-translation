id: ACT.4.32
reference: Acts 4:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τοῦ δὲ πλήθους τῶν πιστευσάντων ἦν ⸀καρδία καὶ ⸀ψυχὴ μία, καὶ οὐδὲ εἷς τι τῶν ὑπαρχόντων ⸀αὐτῷ ἔλεγεν ἴδιον εἶναι, ἀλλ’ ἦν αὐτοῖς ⸀πάντα κοινά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/032.yaml
  text: The multitude of those who had believed were of one heart and soul[a], and not even one of them said that anything belonging to him was his own[b], but all things were held in common among them.
translation:
  language: te
  text: విశ్వసించినవారి సమూహమంతా ఒకే హృదయం, ఒకే ప్రాణం గలవారిగా ఉన్నారు. వారిలో ఒక్కరూ తనకు చెందిన దేనినీ తన సొంతమని చెప్పుకోలేదు; అన్నీ వారికి ఉమ్మడిగా ఉండేవి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, భావానువాదంగా: “వారు అన్నీ పంచుకున్నారు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήθους
  choice: సమూహమంతా
  rationale: πλῆθος పెద్ద సంఖ్యలో ఉన్న ప్రజాసమూహాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో సహజంగా ఉండటంతోపాటు సమష్టిత్వ భావాన్ని నిలుపుతుంది.
- source_word: τῶν πιστευσάντων
  choice: విశ్వసించినవారి
  rationale: అయోరిస్ట్ కృదంతంలోని క్రియాత్మక భావాన్ని ‘విశ్వసించినవారు’గా నిలిపి, కేవలం నామవాచకమైన ‘విశ్వాసులు’గా కుదించలేదు.
- source_word: καρδία καὶ ψυχὴ μία
  choice: ఒకే హృదయం, ఒకే ప్రాణం గలవారిగా
  rationale: అంతరంగం, సంకల్పం, జీవితం విషయంలోని గాఢ ఐక్యతను తెలిపే గ్రీకు జంటపదాలను రెండింటినీ నిలుపుతుంది.
- source_word: οὐδὲ εἷς
  choice: ఒక్కరు కూడా ... లేదు
  rationale: ‘ఒక్కరు కూడా కాదు’ అనే మూలంలోని నొక్కిచెప్పే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τι τῶν ὑπαρχόντων αὐτῷ
  choice: తమకు చెందిన దేనినీ
  rationale: వ్యక్తి వ్యక్తికి వర్తించే గ్రీకు ఏకవచన భావాన్ని తెలుగులో సహజమైన లింగతటస్థ పంపిణీ ప్రయోగమైన ‘తమకు’ ద్వారా తెలియజేస్తుంది.
- source_word: ἔλεγεν ἴδιον εἶναι
  choice: తమ సొంతమని చెప్పుకోలేదు
  rationale: ἴδιον లోని వ్యక్తిగత సొంతం అనే భావాన్ని కాపాడుతూ, బలవంతపు వ్యవస్థ లేదా న్యాయపరమైన హక్కు త్యాగం వంటి అదనపు భావాన్ని చేర్చదు.
- source_word: πάντα κοινά
  choice: అన్నీ వారికి ఉమ్మడిగా ఉండేవి
  rationale: గ్రీకు సంధాయక వాక్య నిర్మాణాన్నీ κοινά లోని పంచుకున్న/సామాన్యమైన భావాన్నీ నిలుపుతుంది; ‘అన్నీ పంచుకున్నారు’ కంటే తక్కువ వ్యాఖ్యాత్మకం.
theological_decisions:
- issue: యెరూషలేము సంఘంలోని ఆస్తుల సామూహిక వినియోగం
  choice: ఎవరూ తమ వస్తువులను ప్రత్యేకంగా తమ సొంతమని చెప్పుకోక, అన్నీ వారికి ఉమ్మడిగా ఉండేవని వర్ణనాత్మకంగా అనువదించడం
  alternative: ‘వారు అన్నిటినీ కలిసే సొంతం చేసుకున్నారు’ అని బలమైన వ్యవస్థీకృత సామూహిక యాజమాన్య భావాన్ని ఇవ్వడం, లేదా పంచుకోవడాన్ని తగ్గించి చూపడం
  rationale: మూలపాఠం వ్యక్తిగత సొంతమనే పట్టుదల లేకపోవడాన్నీ, వస్తువులు ఉమ్మడిగా ఉండడాన్నీ చెబుతుంది; అయితే తరువాతి రాజకీయ, ఆర్థిక లేదా సంఘపరమైన వ్యవస్థను నిర్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ప్రాణం’ అనే పదం ψυχή ను నిలుపుతుంది; ‘ఉమ్మడిగా’ κοινά యొక్క సామూహిక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోతుంది.
