id: ACT.4.37
reference: Acts 4:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑπάρχοντος αὐτῷ ἀγροῦ πωλήσας ἤνεγκεν τὸ χρῆμα καὶ ἔθηκεν ⸀παρὰ τοὺς πόδας τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/037.yaml
  text: Since he owned a field[b][a], he sold it and brought the money and laid it at the apostles’ feet.
translation:
  language: te
  text: అతనికి ఒక పొలం ఉండగా[a], దాన్ని అమ్మి, ఆ డబ్బును[b] తీసుకొచ్చి అపొస్తలుల పాదాల దగ్గర ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతనికి ఒక పొలం ఉన్నందున.’ గ్రీకు నిర్మాణం నేపథ్య పరిస్థితిని తెలుపుతుంది; అది సందర్భానుసారంగా కారణార్థాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అమ్మగా వచ్చిన సొమ్మును.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπάρχοντος αὐτῷ ἀγροῦ
  choice: అతనికి ఒక పొలం ఉండగా
  rationale: జెనిటివ్ అబ్సల్యూట్ నేపథ్య పరిస్థితిని తెలియజేస్తుంది. ఈ తెలుగు రూపం స్వామ్యభావాన్ని సహజంగా వ్యక్తపరుస్తూ, కారణార్థాన్ని అతిగా నిర్ధారించకుండా గ్రీకు వాక్యంలోని పరిస్థితిగత అస్పష్టతను నిలుపుతుంది.
- source_word: ἀγροῦ
  choice: ఒక పొలం
  rationale: ἀγρός సాధారణంగా పొలం లేదా భూభాగాన్ని సూచిస్తుంది. ఇక్కడ ‘పొలం’ నేరుగా, సహజంగా ఉంది; ‘వ్యవసాయ క్షేత్రం’ లేదా ‘భూమి ముక్క’ కంటే తక్కువ వ్యాఖ్యానాత్మకం.
- source_word: πωλήσας
  choice: దాన్ని అమ్మి
  rationale: అయోరిస్ట్ పార్టిసిపిల్ ప్రధాన క్రియలకు ముందు జరిగిన చర్యను సూచిస్తుంది. ‘దాన్ని అమ్మి’ ఆ క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἤνεγκεν
  choice: తీసుకొచ్చి
  rationale: φέρω ఇక్కడ ఒక వస్తువును తీసుకురావడం అనే అర్థంలో ఉంది. ‘తీసుకొచ్చి’ డబ్బును అపొస్తలుల వద్దకు తెచ్చిన చర్యను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τὸ χρῆμα
  choice: ఆ డబ్బును
  rationale: χρῆμα ఇక్కడ అమ్మకం ద్వారా వచ్చిన డబ్బును సూచిస్తుంది. ‘ఆ డబ్బు’ సరళంగా ఉండి, ‘అమ్మకపు సొమ్ము’ అనే స్పష్టీకరణను ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చదు.
- source_word: ἔθηκεν
  choice: ఉంచాడు
  rationale: τίθημι అంటే పెట్టడం లేదా ఉంచడం. పాదాల దగ్గర ఏదైనా సమర్పించే సందర్భంలో ‘ఉంచాడు’ ఆధునిక తెలుగులో సహజంగా, గంభీరంగా ఉంటుంది.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: అపొస్తలుల పాదాల దగ్గర
  rationale: గ్రీకులోని స్పష్టమైన భౌతిక దృశ్యాన్ని ఈ అనువాదం నిలుపుతుంది. కేవలం ‘అపొస్తలులకు ఇచ్చాడు’ అని భావానువాదం చేయకుండా, సమర్పణ మరియు వారి నిర్వహణకు అప్పగించడం అనే కథన సూచనను అలాగే ఉంచుతుంది.
theological_decisions:
- issue: డబ్బును అపొస్తలుల అధికారానికి సమర్పించిన భౌతిక రూపకాన్ని నిలుపాలా
  choice: ‘అపొస్తలుల పాదాల దగ్గర ఉంచాడు’ అనే స్పష్టమైన చిత్రణను నిలిపాం.
  alternative: ‘అపొస్తలులకు ఇచ్చాడు’ అని భావాన్ని మాత్రమే అనువదించడం.
  rationale: మూలపాఠం నిజమైన సమర్పణ చర్యను వర్ణించడంతో పాటు, ఆ కానుకను అపొస్తలుల పర్యవేక్షణకు అప్పగించిన సామాజిక భావాన్ని సూచిస్తుంది. భౌతిక రూపకాన్ని నిలపడం అదనపు సంఘపాలనా సిద్ధాంతాన్ని చేర్చకుండా రెండు పార్శ్వాలనూ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘ఉండగా’ ద్వారా మూలంలోని నేపథ్య పరిస్థితి మరియు సంభావ్య కారణార్థం రెండింటినీ అతిగా నిర్ణయించకుండా నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో పొందుపరచబడ్డాయి.
