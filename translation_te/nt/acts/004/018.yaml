id: ACT.4.18
reference: Acts 4:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ καλέσαντες αὐτοὺς παρήγγειλαν ⸀τὸ καθόλου μὴ φθέγγεσθαι μηδὲ διδάσκειν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/018.yaml
  text: And after calling them in[a], they ordered them not to speak at all nor teach in the name of Jesus.
translation:
  language: te
  text: వారిని లోపలికి పిలిచి, యేసు నామంలో అసలు మాట్లాడవద్దనీ బోధించవద్దనీ వారికి ఆజ్ఞాపించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καλέσαντες αὐτοὺς
  choice: వారిని లోపలికి పిలిచి
  rationale: ముఖ్య క్రియకు ముందు జరిగిన చర్యను సూచించే భూతకాల కృదంతాన్ని తెలుగులో సహజమైన పూర్వకాల క్రియారూపంతో అనువదించాం. సందర్భం ప్రకారం వారు సభలోకి తిరిగి పిలువబడ్డారని ‘లోపలికి’ స్పష్టం చేస్తుంది.
- source_word: παρήγγειλαν
  choice: ఆజ్ఞాపించారు
  rationale: అధికారపూర్వకమైన నిర్దేశాన్ని సూచించే ఈ క్రియ బలాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τὸ καθόλου μὴ φθέγγεσθαι
  choice: అసలు మాట్లాడవద్దని
  rationale: καθόλου నిషేధపు సంపూర్ణతను బలపరుస్తుంది; ‘అసలు ... వద్దు’ ఆ ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది. φθέγγεσθαι యొక్క సాధారణ అర్థాన్ని ‘మాట్లాడు’గా ఇచ్చాం.
- source_word: μηδὲ διδάσκειν
  choice: బోధించవద్దని
  rationale: మాట్లాడటంతో పాటు బోధించడాన్నీ నిషేధించే రెండవ సమన్విత క్రియగా అనువదించాం.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: యేసు నామంలో
  rationale: యేసు నామాన్ని ఆధారంగా చేసుకొని, దానితో సంబంధంగా లేదా ఆయన అధికారంతో మాట్లాడటం, బోధించడం అనే భావవ్యాప్తిని సంప్రదాయబద్ధంగానూ సహజంగానూ నిలుపుతుంది.
- source_word: Ἰησοῦ
  choice: యేసు
  rationale: తెలుగులో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
theological_decisions:
- issue: యేసుతో సంబంధమైన సాక్ష్యంపై నిషేధం ఎంత విస్తృతమైనది
  choice: మాట్లాడటం, బోధించడం రెండింటిపైనా సంపూర్ణ నిషేధం
  alternative: కేవలం బహిరంగ ప్రకటనపైనే నిషేధం
  rationale: τὸ καθόλου అనే ఉద్ఘాటనతో పాటు μὴ φθέγγεσθαι μηδὲ διδάσκειν అనే రెండు క్రియలు విస్తృతమైన నిషేధాన్ని తెలియజేస్తాయి. గ్రీకు పాఠం పేర్కొనని విధంగా దీనిని కేవలం బహిరంగ ప్రకటనకు పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే అధికారిక విచారణ సందర్భానికి తగిన గౌరవప్రదమైన శైలి. ‘ఆజ్ఞాపించారు’ అధికార బలాన్ని, ‘అసలు’ సంపూర్ణ నిషేధపు ఉద్ఘాటనను నిలుపుతాయి.
