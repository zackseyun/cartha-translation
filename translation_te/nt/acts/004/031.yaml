id: ACT.4.31
reference: Acts 4:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ δεηθέντων αὐτῶν ἐσαλεύθη ὁ τόπος ἐν ᾧ ἦσαν συνηγμένοι, καὶ ἐπλήσθησαν ἅπαντες ⸂τοῦ ἁγίου πνεύματος⸃, καὶ ἐλάλουν τὸν λόγον τοῦ θεοῦ μετὰ παρρησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/031.yaml
  text: And when they had prayed[a], the place in which they were gathered was shaken[b], and they were all filled with the Holy Spirit and were speaking the word of God with boldness.
translation:
  language: te
  text: వారు ప్రార్థించిన తరువాత, వారు కూడి ఉన్న[a] స్థలం కంపించింది. వారందరూ పరిశుద్ధాత్మతో నింపబడి, దేవుని వాక్యాన్ని ధైర్యంగా[b] మాట్లాడుతూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు సమావేశమై ఉన్న.’ గ్రీకు నిర్మాణం వారు కూడిన స్థితిలో ఉన్నారని తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నిర్భయంగా,’ ‘బహిరంగంగా.’ ఈ పదం భయం లేకుండా స్వేచ్ఛగా మాట్లాడడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεηθέντων αὐτῶν
  choice: వారు ప్రార్థించిన తరువాత
  rationale: జనిటివ్ అబ్సల్యూట్‌లోని ఏయోరిస్ట్ పార్టిసిపుల్ ప్రధాన ఘటనకు ముందున్న కాలసంబంధ నేపథ్యాన్ని సూచిస్తుంది. ‘ప్రార్థించిన తరువాత’ అనేది సహజమైన ఆధునిక తెలుగు.
- source_word: ἐσαλεύθη
  choice: కంపించింది
  rationale: స్థలం భౌతికంగా కదిలించబడిందనే బలాన్ని నిలుపుతూ, తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉంది.
- source_word: ὁ τόπος
  choice: స్థలం
  rationale: విశ్వాసులు కూడి ఉన్న భౌతిక ప్రదేశాన్ని సూటిగా సూచిస్తుంది.
- source_word: ἐν ᾧ ἦσαν συνηγμένοι
  choice: వారు సమావేశమై ఉన్న
  rationale: ἦσαν మరియు పర్ఫెక్ట్ పార్టిసిపుల్ కలయిక వారు కూడిన స్థితిలో ఉన్నారని సూచిస్తుంది; ‘సమావేశమై ఉన్న’ ఆ స్థితిని నిలుపుతుంది.
- source_word: ἐπλήσθησαν
  choice: నింపబడి
  rationale: క్రియలోని పాసివ్ భావాన్ని, లూకా రచనల్లో కనిపించే ఆత్మతో నింపబడే భాషను నిలుపుతుంది.
- source_word: ἅπαντες
  choice: వారందరూ
  rationale: సమూహంలోని ప్రతి ఒక్కరినీ కలుపుకొనే సంపూర్ణతను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τοῦ ἁγίου πνεύματος
  choice: పరిశుద్ధాత్మతో
  rationale: ‘నింపబడటం’ అనే క్రియతో ఈ జనిటివ్‌ను తెలుగులో సహజంగా ‘తో’ అని వ్యక్తం చేయవచ్చు; దైవిక వ్యక్తిని సూచించే ప్రామాణిక పదరూపం.
- source_word: ἐλάλουν
  choice: ప్రకటిస్తూ ఉన్నారు
  rationale: ఇంపర్ఫెక్ట్ క్రియ సూచించే కొనసాగుతున్న మాటల చర్యను నిలుపుతుంది; సందర్భంలో దేవుని వాక్యాన్ని బహిరంగంగా తెలియజేయడాన్ని ‘ప్రకటించడం’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: దేవుని వాక్యాన్ని
  rationale: లూకా రచనల్లో దైవిక సందేశాన్ని సూచించే స్థిరమైన బైబిలు పదబంధాన్ని నిలుపుతుంది.
- source_word: μετὰ παρρησίας
  choice: ధైర్యంగా
  rationale: భయం లేకుండా, బహిరంగంగా మాట్లాడే భావాన్ని సందర్భానుకూలమైన సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: పరిశుద్ధాత్మతో నింపబడే భాష
  choice: వారందరూ పరిశుద్ధాత్మతో నింపబడి
  alternative: వారందరినీ పరిశుద్ధాత్మ నింపగా
  rationale: మూలంలోని పాసివ్ నిర్మాణాన్ని, ‘ఆత్మతో నింపబడటం’ అనే లూకా ప్రయోగాన్ని నిలుపుతుంది; ఇది ప్రత్యేకమైన తదుపరి ఆధ్యాత్మిక అనుభవం గురించిన ఏ సంప్రదాయ సిద్ధాంతాన్నీ వాక్యంలోకి చేర్చదు.
- issue: ἐλάλουν క్రియ యొక్క కాలదృక్కోణం
  choice: ప్రకటిస్తూ ఉన్నారు
  alternative: ప్రకటించారు
  rationale: ఇంపర్ఫెక్ట్ రూపం కొనసాగుతున్న సాక్ష్యప్రకటనను చూపుతుంది; ఒకే క్షణంలో ముగిసిన చర్యగా మార్చకుండా ఆ భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. మూలంలోని సంఘటనల క్రమం, పాసివ్ ఆత్మ-నింపుదల, కొనసాగుతున్న ప్రకటన నిలుపబడ్డాయి. సంప్రదింపుగా ఇచ్చిన ఆంగ్ల పాఠ్యంలో పాదసూచిక గుర్తులు వాటి విషయాలకు సరిపోని స్థానాల్లో ఉన్నందున, [a]ను ‘సమావేశమై ఉన్న’ వద్దకు, [b]ను ‘ధైర్యంగా’ వద్దకు ఉంచాం.
