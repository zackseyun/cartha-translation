  source_fidelity: The sequence of prayer, shaking of the physical place, filling of the entire group with the Holy Spirit, and ongoing bold speech is retained. However, ‘ప్రకటిస్తూ’ (‘proclaiming’) is more specific than ἐλάλουν (‘were speaking’). In this context proclamation is plausible, but the source itself uses the broader verb, so a less interpretive Telugu verb is preferable.
