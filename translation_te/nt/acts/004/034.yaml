id: ACT.4.34
reference: Acts 4:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ἐνδεής τις ⸀ἦν ἐν αὐτοῖς· ὅσοι γὰρ κτήτορες χωρίων ἢ οἰκιῶν ὑπῆρχον, πωλοῦντες ἔφερον τὰς τιμὰς τῶν πιπρασκομένων
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/034.yaml
  text: For there was not even any needy person among them[a], for as many as were owners of fields or houses were selling them and bringing the proceeds of what was sold.
translation:
  language: te
  text: ఎందుకంటే, వారిలో అవసరంలో ఉన్న ఒక్కరూ లేరు. పొలాలు గాని ఇళ్లు గాని కలిగివున్నవారందరూ వాటిని అమ్ముతూ, అమ్మబడిన వాటి ధరలను తీసుకొచ్చేవారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: ఎందుకంటే ... ఒక్కడు కూడా లేడు
  rationale: γάρ ముందున్న వాక్యాన్ని వివరిస్తుంది; οὐδέలోని బలాన్ని సహజమైన తెలుగులో ‘ఒక్కడు కూడా’ తెలియజేస్తుంది.
- source_word: ἐνδεής
  choice: అవసరంలో ఉన్నవాడు
  rationale: కేవలం ఆర్థిక పేదరికానికే పరిమితం చేయకుండా కొరతలో లేదా అవసరంలో ఉన్న స్థితిని తెలియజేస్తుంది.
- source_word: τις ἦν ἐν αὐτοῖς
  choice: వారిలో ... ఉన్నవాడు ... లేడు
  rationale: గ్రీకు అస్తిత్వ నిర్మాణాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: ὅσοι
  choice: కలిగివున్నవారందరూ
  rationale: ప్రస్తావించిన వర్గంలో ఉన్న వారందరినీ సూచించే విస్తృతిని కాపాడుతుంది.
- source_word: κτήτορες
  choice: కలిగివున్నవారు
  rationale: ఆస్తిపై యాజమాన్యం లేదా స్వాధీనం ఉన్నవారిని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: χωρίων ἢ οἰκιῶν
  choice: పొలాలు గాని ఇళ్లు గాని
  rationale: χωρίωνను సందర్భానుగుణంగా ‘పొలాలు’గా, οἰκιῶνను నేరుగా ‘ఇళ్లు’గా అనువదిస్తుంది; ἢలోని ప్రత్యామ్నాయ భావాన్ని ‘గాని ... గాని’తో నిలుపుతుంది.
- source_word: πωλοῦντες ἔφερον
  choice: అమ్ముతూ ... తీసుకొచ్చేవారు
  rationale: క్రియావిశేషణ రూపంలోని అమ్మే చర్యతో పాటు, imperfect ἔφερον సూచించే పునరావృత లేదా అలవాటైన చర్యను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὰς τιμὰς τῶν πιπρασκομένων
  choice: అమ్మబడిన వాటి వెలను
  rationale: τιμάς యొక్క అక్షరార్థమైన ‘వెల/ధర’ను కాపాడుతూ, అమ్మకం ద్వారా వచ్చిన మొత్తాన్ని సందర్భం తెలియజేయనిస్తుంది.
theological_decisions:
- issue: ఆస్తి అమ్మకం యొక్క పరిధి
  choice: ‘కలిగివున్నవారందరూ వాటిని అమ్ముతూ’ అని గ్రీకు వాక్యపు సాధారణ విస్తృతిని నిలుపడం
  alternative: ప్రతి వ్యక్తి తన ఆస్తి మొత్తాన్ని తప్పనిసరిగా అమ్మాడని స్పష్టీకరించడం
  rationale: మూల వాక్యం ఆ వర్గానికి చెందినవారి ఆచరణను వివరిస్తుంది; ప్రతి ఆస్తి అంతటినీ అమ్మారనే అదనపు సిద్ధాంత నిర్ధారణను ఇది స్వయంగా చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి. ‘అవసరంలో ఉన్నవాడు’ మూలంలోని విస్తృత భావాన్ని కాపాడుతుంది; ‘తీసుకొచ్చేవారు’ పునరావృత చర్యను సహజంగా తెలియజేస్తుంది.
