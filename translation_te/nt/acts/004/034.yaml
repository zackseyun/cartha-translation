revisions:
- from: ఎందుకంటే, వారిలో అవసరంలో ఉన్నవాడు ఒక్కడు కూడా లేడు. పొలాలు గాని ఇళ్లు గాని కలిగివున్నవారందరూ వాటిని అమ్ముతూ, అమ్మబడిన వాటి వెలను[a] తీసుకొచ్చేవారు.
  to: ఎందుకంటే, వారిలో అవసరంలో ఉన్న ఒక్కరూ లేరు. పొలాలు గాని ఇళ్లు గాని కలిగివున్నవారందరూ వాటిని అమ్ముతూ, అమ్మబడిన వాటి ధరలను తీసుకొచ్చేవారు.
  rationale: The revision resolves the singular/plural error, uses inclusive and idiomatic Telugu for the indefinite person, and preserves the source’s ongoing/repeated sense in ‘అమ్ముతూ ... తీసుకొచ్చేవారు.’ The footnote retains the legitimate lexical alternative and explains why ‘ధరలను’ can refer contextually to sale proceeds.
  reviewer_model: gpt-5.6-terra
