id: ACT.4.9
reference: Acts 4:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ ἡμεῖς σήμερον ἀνακρινόμεθα ἐπὶ εὐεργεσίᾳ ἀνθρώπου ἀσθενοῦς, ἐν τίνι οὗτος ⸀σέσωσται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/009.yaml
  text: If we are being examined today concerning a good deed done to a sick man[b][a], by what means this man has been healed—
translation:
  language: te
  text: ఈ రోజు మేము ఒక బలహీనుడికి చేసిన మేలు విషయమై, అతడు దేని ద్వారా స్వస్థపరచబడ్డాడో అని మమ్మల్ని విచారిస్తున్నారంటే, [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రక్షించబడ్డాడు’ లేదా ‘స్వస్థుడయ్యాడు.’ గ్రీకు క్రియ రక్షించడం, కాపాడడం లేదా స్వస్థపరచడం అనే అర్థాలను సూచించగలదు; ఇక్కడి తక్షణ సందర్భం శారీరక స్వస్థతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακρινόμεθα
  choice: విచారణకు గురవుతున్నాము
  rationale: న్యాయపరమైన ప్రశ్నించడం లేదా పరిశీలించడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘న్యాయవిచారణలో ఉన్నాము’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: ἐπὶ εὐεργεσίᾳ
  choice: చేసిన మేలు గురించి
  rationale: విచారణకు కారణమైన ఉపకార కార్యాన్ని స్పష్టంగా తెలియజేస్తూ, మంచి పని చేసినందుకే ప్రశ్నింపబడుతున్నారనే వ్యంగ్యభావాన్ని నిలుపుతుంది.
- source_word: ἀνθρώπου ἀσθενοῦς
  choice: ఒక బలహీనుడికి
  rationale: ἀσθενής శారీరక బలహీనతను సూచిస్తుంది; సందర్భంలో ఇతడు పుట్టుకతో కుంటివాడు. ‘రోగి’ కంటే ‘బలహీనుడు’ మూలపద పరిధిని అధికంగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: ἐν τίνι
  choice: దేని ద్వారా
  rationale: సాధనం లేదా కార్యసాధక కారణాన్ని అడిగే గ్రీకు పదబంధపు విస్తృతతను కాపాడుతుంది; తదుపరి వచనం సమాధానంగా యేసును పేర్కొననివ్వుతుంది.
- source_word: σέσωσται
  choice: స్వస్థపరచబడ్డాడు
  rationale: ఈ సందర్భంలో శారీరక స్వస్థత ప్రధాన భావం. అయితే σῴζω రక్షించడం, కాపాడడం అనే విస్తృత భావాలనూ కలిగి ఉన్నందున వాటిని పాదటిప్పణిలో నిలుపుతున్నాం.
theological_decisions:
- issue: స్వస్థత సందర్భంలో σέσωσται అనువాదం
  choice: స్వస్థపరచబడ్డాడు
  alternative: రక్షించబడ్డాడు; బాగుచేయబడ్డాడు
  rationale: మునుపు కుంటివాడైన వ్యక్తి శారీరకంగా పునరుద్ధరించబడటమే తక్షణ సందర్భం. అయినా క్రియలోని రక్షణార్థక ప్రతిధ్వనిని తొలగించకుండా పాదటిప్పణిలో చూపించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే న్యాయవిచారణ శైలి. గ్రీకు వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివర కామా ఉంచబడింది; వివరణాత్మక ఉపవాక్యాన్ని డాష్‌లతో గుర్తించాం.
