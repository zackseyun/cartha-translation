id: ACT.4.4
reference: Acts 4:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πολλοὶ δὲ τῶν ἀκουσάντων τὸν λόγον ἐπίστευσαν, καὶ ἐγενήθη ⸀ὁ ἀριθμὸς τῶν ἀνδρῶν ⸀ὡς χιλιάδες πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/004.yaml
  text: But many of those who had heard the message believed[b][a], and the number of the men became about five thousand.
translation:
  language: te
  text: అయితే సందేశాన్ని విన్నవారిలో చాలామంది నమ్మారు.[a] పురుషుల సంఖ్య సుమారు ఐదు వేలు అయింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాక్యాన్ని విన్నవారిలో.” ఇక్కడ “వాక్యం” అపొస్తలులు ప్రకటించిన సందేశాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో “పురుషుల సంఖ్య.” ఇది స్త్రీలతో కలిసిన మొత్తం జనసమూహాన్ని కాకుండా, లెక్కించబడిన పురుషులను సూచించే అవకాశం ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: πολλοὶ
  choice: చాలామంది
  rationale: నిర్దిష్ట సంఖ్యను చెప్పకుండా, πολλοὶ యొక్క పరిమాణార్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వచనాల్లోని వ్యతిరేకత, అరెస్టుకు భిన్నంగా ఏర్పడిన ఫలితాన్ని సూచిస్తుంది.
- source_word: ἀκουσάντων τὸν λόγον
  choice: సందేశాన్ని విన్నవారిలో
  rationale: λόγος ఇక్కడ అపొస్తలుల ప్రకటనను సూచిస్తుంది; ‘సందేశం’ ఆధునిక పాఠకులకు భావాన్ని స్పష్టంగా తెలియజేస్తుంది. సమూహంలో కొందరిని సూచించే τῶν నిర్మాణాన్ని ‘విన్నవారిలో’ సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἐπίστευσαν
  choice: నమ్మారు
  rationale: πιστεύω యొక్క సరళమైన క్రియారూపాన్ని కాపాడి, అదనపు వేదాంత వివరణను చేర్చదు.
- source_word: ἐγενήθη
  choice: చేరింది
  rationale: సంఖ్య ఏర్పడిన ఫలిత స్థితిని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘పెరిగింది’ అని అనువదించి వృద్ధి ప్రక్రియను అతిగా స్పష్టీకరించదు.
- source_word: ὁ ἀριθμὸς τῶν ἀνδρῶν
  choice: పురుషుల సంఖ్య
  rationale: ἀνδρῶν యొక్క లింగనిర్దిష్ట అర్థాన్ని ‘ప్రజలు’గా సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: ὡς χιλιάδες πέντε
  choice: సుమారు ఐదువేలకు
  rationale: సంఖ్యకు ముందు ఉన్న ὡς తెలిపే ఉజ్జాయింపు భావాన్ని ‘సుమారు’ స్పష్టంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: τῶν ἀνδρῶνలో లింగనిర్దిష్ట లెక్కింపు
  choice: పురుషుల సంఖ్య
  alternative: ప్రజల సంఖ్య / విశ్వసించినవారి సంఖ్య
  rationale: ἀνήρ సాధారణంగా పురుషుడిని సూచిస్తుంది. అందువల్ల మూలంలోని లింగనిర్దిష్ట పదాన్ని నిలిపాం; అయితే సంఘంలోని స్త్రీలు లేరని లేదా మొత్తం సమూహం పురుషులకే పరిమితమని ఈ వచనం నిర్ణయించదు.
- issue: ἐπίστευσαν యొక్క విశ్వాసార్థం
  choice: నమ్మారు
  alternative: విశ్వాసంలోకి వచ్చారు / ఆయనపై విశ్వాసముంచారు
  rationale: గ్రీకు వాక్యంలో ప్రత్యక్ష కర్మ లేదా ‘ఆయనపై’ అనే పూరకం లేదు. అందువల్ల ఆ వేదాంత సంబంధాన్ని అనువాదంలో అదనంగా చేర్చకుండా క్రియ యొక్క సరళతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘సందేశం’ భావస్పష్టతను ఇస్తుంది; ‘పురుషులు’ మూలంలోని లింగనిర్దిష్టతను కాపాడుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో పొందుపరచబడ్డాయి.
