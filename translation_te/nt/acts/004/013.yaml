id: ACT.4.13
reference: Acts 4:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Θεωροῦντες δὲ τὴν τοῦ Πέτρου παρρησίαν καὶ Ἰωάννου καὶ καταλαβόμενοι ὅτι ἄνθρωποι ἀγράμματοί εἰσιν καὶ ἰδιῶται, ἐθαύμαζον, ἐπεγίνωσκόν τε αὐτοὺς ὅτι σὺν τῷ Ἰησοῦ ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/013.yaml
  text: As they observed the boldness of Peter and John[a], and realized that they were uneducated and ordinary men, they were astonished, and they recognized that they had been with Jesus.
translation:
  language: te
  text: వారు పేతురు, యోహానుల ధైర్యాన్ని గమనించి, పేతురు, యోహానులు శాస్త్రవిద్యలో శిక్షణ లేని సామాన్యులని[a] గ్రహించి, ఆశ్చర్యపోయారు; వీరు యేసుతో కలిసి ఉండేవారని గుర్తించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అక్షరజ్ఞానం లేని, సామాన్యులు.” గ్రీకు పదాలు వారికి అధికారిక శాస్త్రవిద్యలో శిక్షణ, వృత్తిపరమైన లేదా అధికారిక మతపరమైన హోదా లేవని సూచిస్తాయి; వారు తప్పనిసరిగా నిరక్షరాస్యులని కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωροῦντες
  choice: గమనించి
  rationale: కేవలం చూడడం కంటే ఉద్దేశపూర్వకంగా పరిశీలించడాన్ని ఈ సందర్భంలో సూచిస్తుంది.
- source_word: παρρησίαν
  choice: ధైర్యాన్ని
  rationale: బహిరంగంగా, వెనుకాడకుండా మాట్లాడే సాహసాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: καταλαβόμενοι
  choice: గ్రహించినప్పుడు
  rationale: పేతురు, యోహానుల స్థితి గురించి అధికారులకు అవగాహన కలిగిన భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἀγράμματοί
  choice: విద్యాభ్యాసం లేని
  rationale: నిరక్షరాస్యులు అని తప్పుగా అర్థం కాకుండా, అధికారిక శాస్త్ర లేదా రబ్బీ విద్యలో శిక్షణ లేకపోవడాన్ని సూచిస్తుంది.
- source_word: ἰδιῶται
  choice: సామాన్య మనుషులు
  rationale: అధికారిక మతపరమైన హోదా లేదా వృత్తిపరమైన శిక్షణ లేని సాధారణ వ్యక్తులనే భావాన్ని, అవమానకర ధ్వని లేకుండా తెలియజేస్తుంది.
- source_word: ἐθαύμαζον
  choice: ఆశ్చర్యపోయారు
  rationale: వారి కొనసాగుతున్న విస్మయ స్పందనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπεγίνωσκόν
  choice: గుర్తించారు
  rationale: వారి గత అనుబంధాన్ని గుర్తించడం లేదా నిర్ధారించుకోవడం అనే భావాన్ని ఇస్తుంది.
- source_word: σὺν τῷ Ἰησοῦ ἦσαν
  choice: యేసుతో కలిసి ఉండేవారు
  rationale: ప్రస్తుత సంఘటనకు ముందు యేసుతో వారికి కొనసాగిన సహవాసాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: పేతురు, యోహానుల సామాజిక-విద్యా స్థితి
  choice: విద్యాభ్యాసం లేని సామాన్య మనుషులు
  alternative: అక్షరజ్ఞానం లేని వారు మరియు సామాన్యులు; చదువులేని అనధికార వ్యక్తులు
  rationale: గ్రీకు పదాలు వారిని తెలివిలేని వారిగా లేదా తప్పనిసరిగా నిరక్షరాస్యులుగా పేర్కొనవు; అధికారిక శాస్త్ర విద్య, వృత్తిపరమైన మత హోదా లేనివారిగా అధికారుల దృష్టిలో చూపిస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా, సాధారణ పాఠకులకు సులభంగా ఉండే వాక్య నిర్మాణం వాడబడింది. మూలంలోని రెండు పరిశీలనాత్మక క్రియాభావాలు, అధికారుల ఆశ్చర్యం, యేసుతో పూర్వ సహవాసాన్ని గుర్తించడం విడివిడిగా స్పష్టంగా నిలుపబడ్డాయి.
