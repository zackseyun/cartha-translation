review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the observation, Peter and John’s boldness, their lack of formal learning/nonprofessional standing, the authorities’ amazement, and recognition of their prior association with Jesus. However, “గ్రహించినప్పుడు” makes the second participle overtly temporal (“when they realized”), whereas Greek coordinates the observations as grounds for the reaction. “శాస్త్రవిద్యలో శిక్షణ లేని” is more precise than the broad “విద్యాభ్యాసం లేని” for ἀγράμματοι in this setting.
  naturalness: The opening order “పేతురు, యోహానుల ధైర్యాన్ని వారు” is less natural than placing the subject first. A coordinated Telugu construction with “గమనించి … గ్రహించి” better reflects the flow of the Greek sentence.
  terminology: “ధైర్యం” suitably renders παρρησία in this context. “సామాన్యులు” naturally expresses ἰδιῶται without the misleading harshness of “అజ్ఞానులు.” The footnote appropriately prevents “శాస్త్రవిద్యలో శిక్షణ లేని” from being read as necessary illiteracy.
  issues:
  - severity: low
    issue: The wording “గ్రహించినప్పుడు” adds a temporal relationship.
    rationale: καταλαβόμενοι is a coordinated aorist participle with Θεωροῦντες, presenting a further realization that accompanies and explains their reaction. “గ్రహించి” retains this relationship without specifically making it a ‘when’ clause.
  - severity: low
    issue: The phrase “విద్యాభ్యాసం లేని” is overly broad and the initial word order is somewhat marked.
    rationale: In context, ἀγράμματοι concerns lack of recognized scholarly/religious training, rather than a blanket claim of no education. Subject-first order is smoother in modern standard Telugu.
  revised_text: వారు పేతురు, యోహానుల ధైర్యాన్ని గమనించి, పేతురు, యోహానులు శాస్త్రవిద్యలో శిక్షణ లేని సామాన్యులని[a] గ్రహించి, ఆశ్చర్యపోయారు; వీరు యేసుతో కలిసి ఉండేవారని గుర్తించారు.
