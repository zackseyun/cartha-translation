id: ACT.4.22
reference: Acts 4:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐτῶν γὰρ ἦν πλειόνων τεσσεράκοντα ὁ ἄνθρωπος ἐφ’ ὃν ⸀γεγόνει τὸ σημεῖον τοῦτο τῆς ἰάσεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/022.yaml
  text: For the man on whom this sign of healing had happened was more than forty years old[a].
translation:
  language: te
  text: ఎందుకంటే, ఈ స్వస్థత సూచక కార్యం ఎవరి మీద జరిగిందో, ఆ మనిషికి నలభై ఏళ్లకు మించిన వయసు ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐτῶν ... πλειόνων τεσσεράκοντα
  choice: నలభై ఏళ్లకు పైగా వయసు
  rationale: తులనాత్మక పదంతో ఉన్న గ్రీకు వయస్సు ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలోని విషయానికి ఈ వాక్యం వివరణాత్మక ఆధారం ఇస్తున్న సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ὁ ἄνθρωπος
  choice: ఆ వ్యక్తి
  rationale: సందర్భంలో ఇప్పటికే పరిచయమైన నిర్దిష్ట పురుషుణ్ణి సూచిస్తుంది; తెలుగులో ‘ఆ వ్యక్తి’ సహజంగా ఉంటుంది.
- source_word: ἐφ’ ὃν ... γεγόνει
  choice: జరిగిన ఆ వ్యక్తికి
  rationale: ἐπί సూచించే ప్రభావిత వ్యక్తిని తెలుగులో ‘వ్యక్తికి’ అని సహజంగా తెలుపుతూ, γίνομαι యొక్క సంఘటన-కేంద్రీకృత భావాన్ని ‘జరిగిన’గా నిలుపుతుంది.
- source_word: τὸ σημεῖον τοῦτο τῆς ἰάσεως
  choice: ఈ స్వస్థత సూచకకార్యం
  rationale: σημεῖον యొక్క ‘సూచన/గుర్తు’ భావాన్ని, ἴασις యొక్క స్వస్థత భావాన్ని ఒక సహజమైన తెలుగు సమాసంలో నిలుపుతుంది; దాన్ని కేవలం అద్భుతంగా పరిమితం చేయదు.
theological_decisions:
- issue: అద్భుత సందర్భంలో σημεῖον అనువాదం
  choice: సూచకకార్యం
  alternative: అద్భుతం; సూచన
  rationale: ఈ కార్యం ఆశ్చర్యకరమైనదే కాక దేవుని కార్యానికి సూచనగా ఉన్న భావాన్ని ‘సూచకకార్యం’ నిలుపుతుంది.
- issue: γεγόνειలో కర్తృత్వ సూచన
  choice: జరిగిన
  alternative: చేయబడిన; నెరవేర్చబడిన
  rationale: గ్రీకు వాక్యం కార్యాన్ని ఎవరు చేశారనే విషయాన్ని ఈ క్రియలో స్పష్టంగా చెప్పదు. ‘జరిగిన’ అనడం ఆ సంఘటన-కేంద్రీకృత నిర్మాణాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదంగా మరియు సంక్షిప్తంగా రూపొందించబడింది. గ్రీకులోని వివరణాత్మక γάρ సంబంధం స్పష్టంగా ఉంచబడింది.
