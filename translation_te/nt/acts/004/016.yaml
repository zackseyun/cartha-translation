- from: 'వారు ఇలా అన్నారు: “ఈ మనుషులతో మనం ఏమి చేయాలి? వారి ద్వారా అందరికీ తెలిసిన ఒక సూచకకార్యం జరిగింది. అది యెరూషలేములో నివసించే వారందరికీ స్పష్టంగా ఉంది; దాన్ని మనం కాదనలేం.”'
