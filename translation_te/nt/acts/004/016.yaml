  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγοντες· Τί ⸀ποιήσωμεν τοῖς ἀνθρώποις τούτοις; ὅτι μὲν γὰρ γνωστὸν σημεῖον γέγονεν δι’ αὐτῶν πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν, καὶ οὐ δυνάμεθα ⸀ἀρνεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/016.yaml
  text: saying[a], “What should we do with these men? For indeed, a notable sign has happened through them, evident to all who live in Jerusalem, and we cannot deny it.”
translation:
  language: te
  text: 'వారు ఇలా అన్నారు: “ఈ మనుషుల విషయంలో మనం ఏమి చేయాలి? ఎందుకంటే, వారి ద్వారా ప్రసిద్ధమైన[a] ఒక సూచన జరిగిందని యెరూషలేములో నివసించే వారందరికీ స్పష్టంగా ఉంది; దానిని మనం కాదనలేం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అందరికీ తెలిసిన ఒక సూచన.” గ్రీకు γνωστόν అంటే “తెలిసిన,” “బాగా తెలిసిన,” లేదా సందర్భానుసారం “ప్రజలకు గుర్తింపుపొందిన” అని అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: వారు ఇలా అన్నారు
  rationale: ముందటి సందర్భంతో అనుసంధానమైన వర్తమాన కృదంతాన్ని తెలుగు కథనంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Τί ποιήσωμεν τοῖς ἀνθρώποις τούτοις
  choice: ఈ మనుషులతో మనం ఏమి చేయాలి?
  rationale: Deliberative aorist subjunctive భావాన్ని ‘ఏమి చేయాలి?’ సహజంగా చూపుతుంది; సందర్భంలో పేతురు, యోహాను ఉద్దేశించబడ్డారు.
- source_word: ὅτι μὲν γὰρ
  choice: ఎందుకంటే ... నిజమే
  rationale: గ్రీకు పదసమూహంలోని వివరణాత్మక, నొక్కిచెప్పే బలాన్ని తెలుగు వాక్య నిర్మాణంలో సహజంగా ప్రతిబింబిస్తుంది.
- source_word: γνωστὸν σημεῖον
  choice: అందరికీ తెలిసిన ఒక సూచకకార్యం
  rationale: γνωστόν యొక్క ‘తెలిసిన/బహిరంగంగా గుర్తించబడిన’ భావాన్ని సందర్భంలోని ప్రజా గుర్తింపుతో కలిపి చూపుతుంది; σημεῖον యొక్క theological ‘sign’ భావాన్ని ‘సూచకకార్యం’ నిలుపుతుంది.
- source_word: γέγονεν
  choice: జరిగింది
  rationale: పూర్తయిన సంఘటనకు ప్రస్తుతం కొనసాగుతున్న ఫలితం ఉందనే perfect భావం సందర్భం ద్వారా స్పష్టమవుతుంది; ‘జరిగింది’ సహజమైన తెలుగు.
- source_word: δι’ αὐτῶν
  choice: వారి ద్వారా
  rationale: διά + genitive తెలిపే సాధనత్వం/మధ్యవర్తిత్వాన్ని నిలుపుతుంది; స్వతంత్ర కర్తృత్వాన్ని అతిశయింపదు.
- source_word: πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν
  choice: అది యెరూషలేములో నివసించే వారందరికీ స్పష్టంగా ఉంది
  rationale: సూచకకార్యం బహిరంగంగా తెలిసినదనే predicate భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: οὐ δυνάμεθα ἀρνεῖσθαι
  choice: దాన్ని మనం కాదనలేం
  rationale: గ్రీకులో అంతర్లీనంగా ఉన్న కర్మను తెలుగులో ‘దాన్ని’ అని సహజంగా వ్యక్తం చేసి, నిరాకరించలేని స్థితిని నిలుపుతుంది.
theological_decisions:
- issue: ప్రజలముందు జరిగిన అద్భుత సందర్భంలో σημεῖον స్వభావం
  choice: సూచకకార్యం
  alternative: అద్భుతం
  rationale: ‘అద్భుతం’ అసాధారణ కార్యాన్ని మాత్రమే ముందుకు తెచ్చే అవకాశం ఉంది; ‘సూచకకార్యం’ లూకా వాడిన σημεῖον లోని దానికంటే మించిన వాస్తవాన్ని సూచించే theological బరువును నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని దీర్ఘ నిర్మాణాన్ని స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; భావ సంబంధాన్ని నిలిపాం.
