source:
  edition: SBLGNT
  text: (καὶ ⸂Ἅννας ὁ ἀρχιερεὺς καὶ Καϊάφας καὶ Ἰωάννης καὶ Ἀλέξανδρος⸃ καὶ ὅσοι ἦσαν ἐκ γένους ἀρχιερατικοῦ),
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/006.yaml
  text: and Annas the high priest[a], and Caiaphas, and John, and Alexander, and all who were of the high-priestly family,
translation:
  language: te
  text: ప్రధాన యాజకుడైన అన్నా, కయప, యోహాను, అలెగ్జాండరు, మరియు ప్రధాన యాజక వంశానికి[a] చెందిన వారందరూ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రధాన యాజక కుటుంబానికి చెందిన వారందరూ”; అక్షరార్థంగా, “ప్రధాన యాజక వంశం నుండి వచ్చిన వారందరూ.”
    reason: ἐκ γένους ἀρχιερατικοῦలో γένοςకు “కుటుంబం/వంశం” అనే సాధ్యమైన భావాలను సూచించడానికి.
lexical_decisions:
- source_word: Ἅννας
  choice: అన్న
  rationale: గ్రీకు వ్యక్తినామానికి తెలుగులో స్థిరపడిన బైబిలు లిప్యంతరీకరణను వాడింది.
- source_word: ὁ ἀρχιερεὺς
  choice: ప్రధాన యాజకుడైన
  rationale: అన్నకు అన్వయించే ఏకవచన బిరుదును చారిత్రక సమన్వయం చేయకుండా నేరుగా నిలుపుతుంది.
- source_word: Καϊάφας
  choice: కయప
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: Ἰωάννης
  choice: యోహాను
  rationale: తెలుగులో సుపరిచితమైన సంప్రదాయ బైబిలు నామరూపం.
- source_word: Ἀλέξανδρος
  choice: అలెగ్జాండరు
  rationale: గ్రీకు వ్యక్తినామాన్ని సహజమైన తెలుగు రూపంలో లిప్యంతరీకరించింది.
- source_word: ὅσοι ἦσαν
  choice: వారందరూ అక్కడ ఉన్నారు
  rationale: జాబితి సందర్భంలో పరిమాణార్థక సంబంధ పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; సందర్భం సూచించే సమక్షతను 'అక్కడ' స్పష్టం చేస్తుంది.
- source_word: ἐκ γένους ἀρχιερατικοῦ
  choice: ప్రధాన యాజకుని వంశానికి చెందిన
  rationale: γένος యొక్క కుటుంబం/వంశం అనే భావాన్ని, ἀρχιερατικός యొక్క ప్రధాన యాజకత్వ సంబంధాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ఈ కాలంలో కయప పదవిలో ఉన్నప్పటికీ అన్నను ὁ ἀρχιερεύς అని పేర్కొనడం
  choice: ప్రధాన యాజకుడైన అన్న
  alternative: మాజీ ప్రధాన యాజకుడైన అన్న; ముఖ్య యాజకుడైన అన్న
  rationale: గ్రీకు పాఠం అన్నకు ఇచ్చిన బిరుదును అనువాదం యథాతథంగా నిలుపుతుంది; చారిత్రక సమస్యను సమన్వయం చేయడానికి 'మాజీ' అనే వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ఈ వచనం ముందున్న వాక్య నిర్మాణంలో భాగమైనప్పటికీ, ఇచ్చిన భాగాన్ని చదవదగిన తెలుగు వాక్యంగా అందించడానికి చివర క్రియను సహజంగా అమర్చింది.
