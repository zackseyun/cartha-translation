id: ACT.4.12
reference: Acts 4:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν ἐν ἄλλῳ οὐδενὶ ἡ σωτηρία, ⸀οὐδὲ γὰρ ὄνομά ἐστιν ἕτερον ⸂ὑπὸ τὸν οὐρανὸν⸃ τὸ δεδομένον ἐν ἀνθρώποις ἐν ᾧ δεῖ σωθῆναι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/012.yaml
  text: And there is salvation in no one else[a], for there is no other name under heaven given among men by which we must be saved.
translation:
  language: te
  text: మరెవరిలోనూ రక్షణ లేదు; ఎందుకంటే ఆకాశం కింద మనుష్యుల మధ్య ఇవ్వబడిన మరే పేరు లేదు; ఆ పేరు ద్వారానే మనం తప్పనిసరిగా రక్షించబడాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మనుష్యుల మధ్య’ అనే మాట ఇక్కడ సమస్త మానవాళిని సూచిస్తుంది.
    reason: lexical_clarification
lexical_decisions:
- source_word: σωτηρία
  choice: రక్షణ
  rationale: ఈ సందర్భంలో యేసు ద్వారా లభించే కాపుదల అనే విస్తృత భావంతో పాటు వాక్యంలోని ఆధ్యాత్మిక బలాన్ని కూడా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν ἄλλῳ οὐδενί
  choice: మరెవరిలోనూ
  rationale: ἐν అనే ఉపసర్గను నిలుపుతూ, రక్షణ మరొక వ్యక్తిలో లేదనే గ్రీకు వాక్యంలోని వ్యక్తిగత ప్రత్యేకతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὄνομα
  choice: పేరు
  rationale: వ్యక్తి, అధికారం, వెల్లడైన గుర్తింపు వంటి అంతర్లీన బైబిలు భావాలను వివరించి కుదించకుండా మూలంలోని రూపకాన్ని నిలుపుతుంది.
- source_word: ἕτερον
  choice: మరే
  rationale: నిషేధ వాక్యంలో వేరొక పేరు ఏదీ లేదనే ప్రత్యేకతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑπὸ τὸν οὐρανόν
  choice: ఆకాశం కింద
  rationale: ప్రపంచవ్యాప్త మానవ పరిధిని సూచించే మూలభాషా నుడికారాన్ని, దాని గంభీర స్వరాన్ని నిలుపుతుంది.
- source_word: δεδομένον ἐν ἀνθρώποις
  choice: మనుష్యుల మధ్య ఇవ్వబడలేదు
  rationale: కృదంతం ‘పేరు’ను విశేషిస్తుందని నిలుపుతూ, ἐν ἀνθρώποις ను ‘మనుష్యులకు’ అని కాక ‘మానవుల మధ్య’ అనే భావంలో అనువదిస్తుంది.
- source_word: ἐν ᾧ
  choice: ద్వారా
  rationale: సంబంధ సర్వనామం ‘పేరు’ను సూచిస్తుంది; రక్షణకు సాధనం అనే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: δεῖ
  choice: అవసరమైన
  rationale: రక్షించబడడం తప్పనిసరి లేదా అవసరం అనే δεῖ బలాన్ని వాక్య నిర్మాణంలో సహజంగా నిలుపుతుంది.
- source_word: σωθῆναι
  choice: రక్షించబడడానికి
  rationale: మూలంలోని కర్మణి అనంతక్రియను నిలుపుతూ σωτηρία తో పదార్థ సమన్వయాన్ని కాపాడుతుంది.
theological_decisions:
- issue: యేసుకు సంబంధించి రక్షణ యొక్క ప్రత్యేకత
  choice: ‘మరెవరిలోనూ రక్షణ లేదు’ అని ఎలాంటి సడలింపూ లేకుండా అనువదించబడింది.
  alternative: ‘రక్షణకు వేరే మార్గం లేదు’
  rationale: గ్రీకు పాఠం రక్షణ మరెవరిలోనూ లేదని వ్యక్తుల పరంగా నేరుగా చెబుతుంది; ‘మార్గం’ అని మార్చడం మూలంలోని ‘ఎవరు/పేరు’ అనే వ్యక్తిగత దృష్టిని బలహీనపరుస్తుంది.
- issue: ἀνθρώποις యొక్క సమగ్ర మానవార్థం
  choice: ప్రధాన పాఠంలో ‘మనుష్యుల మధ్య’, పాదసూచికలో ‘మానవుల మధ్య’ అనే ప్రత్యామ్నాయం.
  alternative: మానవుల మధ్య
  rationale: ἀνθρώποις ఇక్కడ పురుషులను మాత్రమే కాక సమస్త మానవాళిని సూచిస్తుంది. సాధారణ తెలుగులో ‘మనుష్యులు’ సమగ్రార్థంలో సహజంగా ఉండగా, పాదసూచిక ఆ అర్థాన్ని స్పష్టం చేస్తుంది.
- issue: δεῖ లోని అవసరత
  choice: ‘మనం రక్షించబడడానికి అవసరమైన ... పేరు’ అనే నిర్మాణం.
  alternative: ‘మనం రక్షించబడవలసిన’
  rationale: δεῖ సూచించే అవసరతను నిలుపుతూ, రక్షణ మన స్వీయ సాధనమని కాక కర్మణి రూపంలో పొందేదని స్పష్టంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే అపొస్తలుల ప్రకటనకు తగిన గంభీరతతో రూపొందించబడింది. ‘ఆకాశం కింద’, ‘పేరు’ వంటి మూలంలోని బైబిలు నుడికారాలు నిలుపబడ్డాయి.
