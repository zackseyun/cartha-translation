    rationale: ‘మనం రక్షించబడడానికి అవసరమైన మరే పేరు’ అని చెప్పడం వల్ల పేరు అవసరమైనదన్న భావం ముందుకు వస్తుంది. మూలంలో δεῖ (‘తప్పనిసరి/అవశ్యం’) అనేది ἡμᾶς σωθῆναι (‘మనం రక్షించబడటం’)ను నియంత్రిస్తుంది; ἐν ᾧ పేరు ద్వారా రక్షణకు సాధనాన్ని సూచిస్తుంది.
