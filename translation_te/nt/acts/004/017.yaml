id: ACT.4.17
reference: Acts 4:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα μὴ ἐπὶ πλεῖον διανεμηθῇ εἰς τὸν λαόν, ⸀ἀπειλησώμεθα αὐτοῖς μηκέτι λαλεῖν ἐπὶ τῷ ὀνόματι τούτῳ μηδενὶ ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/017.yaml
  text: But so that it may not spread any further among the people, let us warn them not to speak any longer to anyone in this name.
translation:
  language: te
  text: అయితే ఇది ప్రజల మధ్య మరింతగా వ్యాపించకుండా ఉండేందుకు, ఇకపై ఈ పేరు మీద ఎవ్వరితోనూ మాట్లాడవద్దని వారిని బెదిరిద్దాం[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గట్టిగా హెచ్చరిద్దాం.” గ్రీకు క్రియలో అధికారంతో భయపెట్టే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: διανεμηθῇ
  choice: వ్యాపించకుండా
  rationale: ఈ సందర్భంలో వార్త లేదా బోధ ప్రజల్లో విస్తరించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వ్యాపించు’ సహజంగా ఈ భావాన్ని తెలియజేస్తుంది.
- source_word: ἐπὶ πλεῖον
  choice: ఇంకా ఎక్కువగా
  rationale: ఇప్పటికే జరిగిన వ్యాప్తికి మించి మరింత విస్తరించకూడదనే తులనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: εἰς τὸν λαόν
  choice: ప్రజల్లో
  rationale: ప్రజాసమూహంలోకి లేదా ప్రజల మధ్యకు వ్యాప్తి చెందడం అనే గ్రీకు దిశాత్మక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀπειλησώμεθα
  choice: వారిని బెదిరిద్దాం
  rationale: క్రియ యొక్క ప్రధాన అర్థం ‘బెదిరించు’; అధికారుల బలవంతపు, భయపెట్టే వైఖరిని పలుచన చేయకుండా నేరుగా అనువదిస్తుంది.
- source_word: μηκέτι λαλεῖν
  choice: ఇకపై ... మాట్లాడవద్దని
  rationale: μηκέτι లోని ‘ఇక మీదట కాదు’ అనే కాలసంబంధ నిషేధాన్ని సహజమైన తెలుగు ఆజ్ఞారూపంలో తెలియజేస్తుంది.
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: ఈ పేరునుబట్టి
  rationale: ఆ పేరుతో సంబంధం కలిగి, దాని ఆధారంగా లేదా అధికారంతో మాట్లాడడం అనే విస్తృత భావాన్ని ఉద్దేశపూర్వకంగా పూర్తిగా కుదించకుండా ఉంచుతుంది.
- source_word: μηδενὶ ἀνθρώπων
  choice: ఎవ్వరితోనూ
  rationale: నిషేధిత మాటకు ఉద్దేశించిన శ్రోత ఎవరూ కాకూడదనే సాధారణ, లింగనిరపేక్ష భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: సభ చర్యలో ἀπειλησώμεθα యొక్క బలం
  choice: బెదిరిద్దాం
  alternative: గట్టిగా హెచ్చరిద్దాం
  rationale: న్యాయసభ అధికారపూర్వకంగా భయపెట్టే ప్రయత్నం చేస్తున్నందున ‘బెదిరించు’ మూలపద బలాన్ని స్పష్టంగా కాపాడుతుంది; దాన్ని కేవలం సాధారణ హెచ్చరికగా మృదువుపరచదు.
- issue: ἐπὶ τῷ ὀνόματι τούτῳ యొక్క సంబంధార్థం
  choice: ఈ పేరునుబట్టి
  alternative: ఈ పేరులో / ఈ పేరు గురించి
  rationale: గ్రీకు ప్రయోగం ఆ పేరుతో సంబంధం, ఆధారం లేదా అధికారం వంటి భావాలను కలిగి ఉండవచ్చు. ‘పేరునుబట్టి’ ఈ పరిధిని కొంత తెరిచి ఉంచి, ఒక్క వ్యాఖ్యానానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సభలోని అధికారపూర్వక ఉద్దేశాన్ని తెలిపే గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన వాక్యనిర్మాణం. ప్రధాన పాఠంలో మూల గ్రీకు క్రియ యొక్క బలమైన అర్థాన్ని నిలిపి, తక్కువ బలమైన ప్రత్యామ్నాయాన్ని పాదటీకలో ఇచ్చాం.
