revisions:
- from: అయితే ఇది ప్రజల్లో ఇంకా ఎక్కువగా వ్యాపించకుండా ఉండేందుకు, ఇకపై ఈ పేరునుబట్టి ఎవ్వరితోనూ మాట్లాడవద్దని వారిని బెదిరిద్దాం[a].
  to: అయితే ఇది ప్రజల మధ్య మరింతగా వ్యాపించకుండా ఉండేందుకు, ఇకపై ఈ పేరు మీద ఎవ్వరితోనూ మాట్లాడవద్దని వారిని బెదిరిద్దాం[a].
  rationale: The revision preserves the source’s purpose clause, the sense of further spread among the people, and the council’s threat. It replaces a Telugu expression that means ‘because of this name’ with the more contextually accurate and idiomatic ‘ఈ పేరు మీద.’
