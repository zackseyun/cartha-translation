  text: and they were laying them at the apostles’ feet[b][a], and it was being distributed to each one according as anyone had need.
translation:
  language: te
  text: వాటిని అపొస్తలుల పాదాల దగ్గర ఉంచుతూ ఉండేవారు[b][a]; ఎవరికైనా అవసరం ఉన్నంత మేరకు ప్రతి ఒక్కరికీ పంచబడుతూ ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అపొస్తలుల ఎదుట.’ గ్రీకులో అక్షరార్థంగా ‘అపొస్తలుల పాదాల దగ్గర’ అని ఉంది; ఇది వాటిని అపొస్తలుల పర్యవేక్షణకు అప్పగించిన దృశ్యాన్ని నిలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘వాటిని ఉంచేవారు,’ ‘పంచబడేది’ అనే మాటలకు సంబంధించినది మునుపటి వచనంలో చెప్పబడిన, అమ్మిన వాటి వెల.
    reason: cross_reference
lexical_decisions:
- source_word: ἐτίθουν
  choice: ఉంచుతూ ఉండేవారు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతూ లేదా పదేపదే జరిగిన ఆచరణను సూచిస్తుంది; ఈ రూపం ఆ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: అపొస్తలుల పాదాల దగ్గర
  rationale: అపొస్తలుల పర్యవేక్షణకు అప్పగించడమనే భావం ఉన్నప్పటికీ, మూలంలోని స్పష్టమైన పాదాల దృశ్యాన్ని అలాగే నిలుపుతుంది.
- source_word: διεδίδετο
  choice: పంచబడుతూ ఉండేది
  rationale: అసంపూర్ణ భూతకాల కర్మణి రూపం కొనసాగుతూ లేదా అలవాటుగా జరిగిన పంపిణీని తెలియజేస్తుంది; ఎవరు పంచారో మూలం చెప్పకపోవడాన్ని కర్మణి రూపం కాపాడుతుంది.
- source_word: ἑκάστῳ
  choice: ప్రతి ఒక్కరికీ
  rationale: వ్యక్తిగతంగా ఒక్కొక్కరికి జరిగిన పంపిణీ భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: ఎవరికెంత అవసరం ఉండేదో అంత చొప్పున
  rationale: అవసరానికి అనుగుణమైన పరిమాణం లేదా నిష్పత్తిని καθότι సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ఈ భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: τις
  choice: ఎవరికెంత
  rationale: ఇక్కడ అనిర్దిష్ట సర్వనామం లింగభేదం లేకుండా ఎవరినైనా సూచిస్తుంది.
- source_word: χρείαν
  choice: అవసరం
  rationale: సాధారణ ఆధునిక తెలుగులో అవసరం లేదా కొరత భావాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఉంచినది, పంచబడినది ఏమిటో స్పష్టంగా చేర్చాలా
  choice: మునుపటి వచనాన్ని సూచించే ‘వాటిని’ అనే సర్వనామాన్ని మొదటి భాగంలో వాడి, రెండవ భాగంలో కర్తను మళ్లీ స్పష్టంగా చేర్చకుండా ఉంచడం.
  alternative: రెండు భాగాల్లోనూ ‘అమ్మిన వాటి వెల’ లేదా ‘డబ్బు’ అని స్పష్టంగా చేర్చడం.
  rationale: గ్రీకు మూలంలో కర్మ మునుపటి వచనం నుంచి గ్రహించబడుతుంది. ‘వాటిని’ పాఠకునికి సంబంధాన్ని అందిస్తూనే, ‘డబ్బు’ లేదా ‘అమ్మిన వాటి వెల’ అని మూలానికి మించిన నిర్దిష్టతను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. రెండు అసంపూర్ణ భూతకాల క్రియల కొనసాగింపు/పునరావృత భావాన్ని ‘ఉంటూ ఉండేవారు/ఉండేది’ నిర్మాణాలతో నిలుపుతూ, మూలంలోని కర్మణి రూపం మరియు అంతర్లీన కర్మను కాపాడింది.
