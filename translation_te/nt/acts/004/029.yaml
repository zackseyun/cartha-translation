id: ACT.4.29
reference: Acts 4:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν, κύριε, ἔπιδε ἐπὶ τὰς ἀπειλὰς αὐτῶν καὶ δὸς τοῖς δούλοις σου μετὰ παρρησίας πάσης λαλεῖν τὸν λόγον σου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/029.yaml
  text: And now[a], Lord, look upon their threats and grant your servants to speak your word with all boldness,
translation:
  language: te
  text: ఇప్పుడు, ప్రభువా, వారి బెదిరింపులను గమనించి, నీ సేవకులు[a] నీ వాక్యాన్ని పూర్తి ధైర్యంతో మాట్లాడేలా అనుగ్రహించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ దాసులు.” గ్రీకు దౌలోయి (δοῦλοι) యజమానికి చెందినవారిని సూచించగలదు. ఇక్కడ ప్రార్థన సందర్భంలో “సేవకులు” అనే పదం వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τὰ νῦν
  choice: ఇప్పుడు
  rationale: ప్రార్థనలో గత సంఘటనల వివరణ నుంచి ప్రస్తుత విన్నపానికి మార్పును సహజంగా సూచిస్తుంది. గ్రీకు పదబంధంలోని ‘ప్రస్తుత పరిస్థితిలో’ అనే భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: κύριε
  choice: ప్రభువా
  rationale: దేవునికి చేసే ప్రత్యక్ష సంబోధనకు ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన రూపం.
- source_word: ἔπιδε ἐπὶ
  choice: గమనించి
  rationale: ఇక్కడ దేవుడు వారి బెదిరింపులపై దృష్టిపెట్టి వాటిని పరిగణించాలని చేసే విన్నపం. ‘చూడు’ కంటే ‘గమనించు’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τὰς ἀπειλὰς αὐτῶν
  choice: వారి బెదిరింపులను
  rationale: బహువచన ἀπειλάς యొక్క సాధారణ, స్పష్టమైన తెలుగు సమానం.
- source_word: δὸς
  choice: అనుగ్రహించు
  rationale: అక్షరార్థంగా ‘ఇవ్వు’; అయితే ఏదైనా చేయగల సామర్థ్యం లేదా అవకాశం ఇవ్వమని దేవునికి చేసే ప్రార్థనలో ‘అనుగ్రహించు’ సహజంగా ఉంటుంది.
- source_word: τοῖς δούλοις σου
  choice: నీ సేవకులు
  rationale: δοῦλος యజమానికి చెందిన దాసుడు లేదా సేవకుడిని సూచించగలదు. ఈ ప్రార్థనలో దేవునికి లోబడిన సేవాభావం ముందున్నందున ‘సేవకులు’ సహజమైన ఎంపిక; చెందినవారనే బలమైన ఛాయను పూర్తిగా ముందుకు తేవదు.
- source_word: μετὰ παρρησίας πάσης
  choice: సంపూర్ణ ధైర్యంతో
  rationale: παρρησία ఇక్కడ భయంలేకుండా బహిరంగంగా మాట్లాడే ధైర్యాన్ని సూచిస్తుంది; πάσης ఇచ్చే సంపూర్ణతను ‘సంపూర్ణ’ నిలుపుతుంది.
- source_word: λαλεῖν
  choice: ప్రకటించేలా
  rationale: మూలపదానికి ప్రాథమికంగా ‘మాట్లాడు’ అనే అర్థం ఉన్నా, ఇక్కడ దేవుని వాక్యాన్ని ప్రజలకు చెప్పే సందర్భంలో ‘ప్రకటించు’ సహజంగా ఉంది. ఇది వాక్యప్రచార సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: τὸν λόγον σου
  choice: నీ వాక్యాన్ని
  rationale: λόγος ఇక్కడ దేవుని సందేశాన్ని సూచిస్తుంది. ‘వాక్యం’ మూల రూపకాన్ని, అపొస్తలుల కార్యములలోని ధార్మిక ప్రతిధ్వనిని నిలుపుతుంది.
theological_decisions:
- issue: దేవునితో సంబంధంలో δοῦλος పదం
  choice: నీ సేవకులు
  alternative: నీ దాసులు
  rationale: δοῦλος యాజమాన్యానికి చెందిన స్థితిని బలంగా సూచించగలదు. అయినా ఈ సామూహిక ప్రార్థనలో వినయపూర్వకంగా దేవునికి సేవచేసే గుర్తింపు ముందుంది. అందువల్ల ప్రధాన పాఠ్యంలో ‘సేవకులు’ సహజంగా ఉంది; ‘దాసులు’ అనే ప్రత్యామ్నాయం పదబలాన్ని ఎక్కువగా చూపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవభరితమైనా సాధారణ పాఠకులకు సులభమైన శైలి. వాక్య నిర్మాణం గ్రీకు విన్నప క్రమాన్ని ప్రధానంగా నిలుపుతూ తెలుగులో సహజంగా మార్చబడింది.
