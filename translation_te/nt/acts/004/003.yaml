  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐπέβαλον αὐτοῖς τὰς χεῖρας καὶ ἔθεντο εἰς τήρησιν εἰς τὴν αὔριον, ἦν γὰρ ἑσπέρα ἤδη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/003.yaml
  text: And they laid hands on them and put them in custody until the next day[b][a], for it was already evening.
translation:
  language: te
  text: వారు పేతురు, యోహానులను పట్టుకుని[a], మరుసటి రోజు వరకు వారిని నిర్బంధంలో ఉంచారు[b], ఎందుకంటే అప్పటికే సాయంకాలమైపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘వారి మీద చేతులు వేశారు.’ గ్రీకు జాతీయ ప్రయోగం శత్రుత్వపూరితంగా వారిని పట్టుకోవడం లేదా అరెస్టు చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారిని చెరలో ఉంచారు’ లేదా ‘కాపలా కింద ఉంచారు.’ గ్రీకు పదం వారిని అదుపులో ఉంచడాన్ని సూచిస్తుంది గానీ, ఏ రకమైన నిర్బంధ స్థలమో స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον ... τὰς χεῖρας
  choice: చేతులు వేసి
  rationale: గ్రీకు జాతీయాన్ని నేరుగా నిలుపుతూ, ఈ శత్రుత్వపూరిత సందర్భంలో వారిని బలవంతంగా పట్టుకున్నారనే భావాన్ని తెలియజేస్తుంది.
- source_word: αὐτοῖς
  choice: పేతురు, యోహానుల మీద
  rationale: సందర్భంలోని సూచిత వ్యక్తులను తెలుగులో స్పష్టంగా పేర్కొనడం సహజంగా ఉండి, అస్పష్టతను నివారిస్తుంది.
- source_word: ἔθεντο εἰς τήρησιν
  choice: వారిని కాపలాలో ఉంచారు
  rationale: τήρησις సూచించే నిర్బంధం లేదా కాపలా భావాన్ని తెలియజేస్తుంది; నిర్దిష్టంగా జైలు భవనమని మూలపాఠం చెప్పనందున దానిని అనవసరంగా నిర్ధారించదు.
- source_word: εἰς τὴν αὔριον
  choice: మరుసటి రోజు వరకు
  rationale: కథన సందర్భంలో కాలపరిమితిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἦν γὰρ ἑσπέρα ἤδη
  choice: అప్పటికే సాయంకాలం అయింది
  rationale: విచారణను మరుసటి రోజుకు వాయిదా వేయడానికి గల కారణాన్ని గ్రీకు క్రమానికి అనుగుణంగా స్పష్టంగా తెలియజేస్తుంది.
