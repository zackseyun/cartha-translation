  source_fidelity: The draft correctly conveys the hostile apprehension, overnight detention, and the reason that it was already evening. However, “కాపలాలో ఉంచారు” can suggest merely keeping someone under guard and does not as clearly express official custody/detention (εἰς τήρησιν).
  naturalness: “వారి మీద చేతులు వేసి” is understandable but less idiomatic here than “వారిని పట్టుకుని”; retaining the literal idiom in the footnote is preferable. “సాయంకాలం అయింది” is natural, though “అప్పటికే సాయంకాలమైపోయింది” more directly reflects ἤδη.
  terminology: “నిర్బంధంలో ఉంచారు” is modern, clear Telugu for official custody without specifying a jail. The names పేతురు and యోహాను are appropriate. The footnote’s “గ్రీకు జాతీయం” should be “గ్రీకు జాతీయ ప్రయోగం.”
  issues:
  - severity: medium
    issue: “కాపలాలో ఉంచారు” is semantically weaker than detention/custody.
    rationale: The Greek εἰς τήρησιν denotes being placed in custody; the wording can be read as guarded supervision without clearly stating that they were detained.
  - severity: low
    issue: The main-text expression “వారి మీద చేతులు వేసి” is somewhat awkward in modern Telugu in this arrest context.
    rationale: “వారిని పట్టుకుని” is more natural and conveys the contextual force of the Greek idiom; the literal idiom can be preserved as a footnote alternative.
  - severity: low
    issue: Footnote a calls the idiom “గ్రీకు జాతీయం.”
    rationale: “గ్రీకు జాతీయ ప్రయోగం” is the natural and accurate Telugu description.
