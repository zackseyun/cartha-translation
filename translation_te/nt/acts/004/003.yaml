translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘చేతులు వేసి’ అనే మూల జాతీయాన్ని ప్రధాన పాఠంలో నిలిపి, దాని సందర్భార్థాన్ని పాదటిప్పణిలో స్పష్టం చేశాం. ‘కాపలాలో’ అనే పదబంధం నిర్దిష్ట జైలు సౌకర్యాన్ని ఊహించకుండా అధికారిక నిర్బంధ భావాన్ని కాపాడుతుంది.
