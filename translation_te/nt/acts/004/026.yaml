id: ACT.4.26
reference: Acts 4:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: παρέστησαν οἱ βασιλεῖς τῆς γῆς καὶ οἱ ἄρχοντες συνήχθησαν ἐπὶ τὸ αὐτὸ κατὰ τοῦ κυρίου καὶ κατὰ τοῦ χριστοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/026.yaml
  text: The kings of the earth took their stand[a], and the rulers were gathered together against the Lord and against his Messiah.
translation:
  language: te
  text: భూమిమీది రాజులు ఎదిరించి నిలబడ్డారు; పాలకులు ప్రభువుకు, ఆయన అభిషిక్తునికి[a] వ్యతిరేకంగా కలిసి సమకూడారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మెస్సీయ’ లేదా ‘క్రీస్తు’; గ్రీకు పదం ‘క్రీస్తోస్,’ అంటే ‘ఆయన అభిషిక్తుడు.’
    reason: Χριστός అనే బిరుదుకు ఉన్న ప్రాచుర్యమైన ప్రత్యామ్నాయ రూపాలను తెలియజేయడం.
lexical_decisions:
- source_word: παρέστησαν
  choice: ఎదిరించి నిలబడ్డారు
  rationale: ఇది కేవలం నిలబడడాన్ని కాక, కీర్తన 2:2 నేపథ్యంలోని ఉద్దేశపూర్వక ప్రతిఘటనను సూచిస్తుంది.
- source_word: βασιλεῖς
  choice: రాజులు
  rationale: మూలపదం నిర్దిష్టంగా రాజులను సూచిస్తుంది; కీర్తనలోని రాజకీయ సమాంతరతను నిలుపుతుంది.
- source_word: τῆς γῆς
  choice: భూమి
  rationale: ఈ కీర్తన ఉల్లేఖనంలో స్థానిక ‘దేశం’ కంటే విస్తృతమైన ప్రపంచార్థం సహజం.
- source_word: ἄρχοντες
  choice: పాలకులు
  rationale: రాజులతో సమాంతరంగా అధికారంలో ఉన్నవారిని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: συνήχθησαν
  choice: కూడబడ్డారు
  rationale: గ్రీకులోని కర్మణి రూపాన్ని నిలుపుతూ, వారు సమీకరించబడిన భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ τὸ αὐτό
  choice: ఒకచోట
  rationale: ఈ నుడికారం ‘ఒకేచోట’ లేదా ‘కలిసి’ అనే అర్థం ఇస్తుంది; ఇక్కడ ‘ఒకచోట’ మూలరూపానికి దగ్గరగా ఉంది.
- source_word: κατὰ
  choice: వ్యతిరేకంగా
  rationale: రెండు సందర్భాల్లోనూ స్పష్టమైన శత్రుత్వపూర్వక ప్రతిఘటనను సూచిస్తుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: దేవునిని సూచించే ఈ లేఖన ఉల్లేఖనంలో κύριος యొక్క గౌరవభరితమైన సాధారణ తెలుగు రూపం.
- source_word: χριστοῦ
  choice: అభిషిక్తుడు
  rationale: కీర్తన 2:2 ఉల్లేఖనంలో ఇది పేరులా కాక బిరుదుగా ఉంది; ‘అభిషిక్తుడు’ అనే రూపం χριστός యొక్క మూలార్థాన్ని, పాత నిబంధన నేపథ్యాన్ని నేరుగా నిలుపుతుంది.
- source_word: αὐτοῦ
  choice: ఆయన
  rationale: ఈ సర్వనామం ప్రభువును తిరిగి సూచించి, అభిషిక్తుడు ఆయనకు చెందినవాడనే సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: కీర్తన 2 ఉల్లేఖనంలో Χριστός అనువాదం
  choice: అభిషిక్తుడు
  alternative: మెస్సీయ; క్రీస్తు
  rationale: ఇక్కడ χριστός ఒక బిరుదుగా, ప్రభువుతో సంబంధంలో ఉన్న అభిషిక్త రాజును సూచిస్తుంది. ‘అభిషిక్తుడు’ మూలార్థాన్ని మరియు కీర్తన నేపథ్యాన్ని స్పష్టంగా ఉంచుతుంది; ‘మెస్సీయ’ మరియు ‘క్రీస్తు’ అదే బిరుదుకు ప్రాచుర్యంలో ఉన్న రూపాలు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తన ఉల్లేఖనానికి తగిన గౌరవభరితమైన లయతో అనువదించబడింది. ‘ఎదిరించి నిలబడ్డారు’ ప్రతిఘటన భావాన్ని స్పష్టం చేస్తుంది; ‘ఒకచోట కూడబడ్డారు’ గ్రీకు కర్మణి రూపాన్నీ సమూహ చర్యనూ నిలుపుతుంది.
