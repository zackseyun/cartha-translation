translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. ‘న్యాయసభ’ అనే పదం యూదుల పాలక మండలి/సన్హెద్రిన్‌ను సందర్భానుగుణంగా సూచిస్తుంది.
