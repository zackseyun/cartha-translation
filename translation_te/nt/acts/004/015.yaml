  yaml_path: translation/nt/acts/004/015.yaml
  text: But after ordering them to go outside the council[a], they began conferring with one another[b],
translation:
  language: te
  text: అయితే, వారిని న్యాయసభ వెలుపలికి వెళ్లమని ఆదేశించిన తర్వాత, వారు ఒకరితో ఒకరు చర్చించసాగారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు తమలో తాము చర్చించుకుంటున్నారు,” లేదా “వారు పరస్పరం సంప్రదించుకుంటున్నారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κελεύσαντες
  choice: ఆదేశించిన తర్వాత
  rationale: అధికారపూర్వక ఆజ్ఞను సూచించే క్రియను, ప్రధాన క్రియకు ముందుగా జరిగిన చర్యగా సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి బహిరంగ విచారణ నుంచి న్యాయసభ సభ్యుల అంతర్గత చర్చకు మారే స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: αὐτοὺς
  choice: వారిని
  rationale: సందర్భంలో పేతురు, యోహానులను సూచించే సహజమైన సర్వనామ రూపం.
- source_word: ἔξω τοῦ συνεδρίου
  choice: న్యాయసభ వెలుపలికి
  rationale: συνέδριον ఇక్కడ యూదుల పాలక మండలిని లేదా సమావేశమైన న్యాయసభను సూచిస్తుంది; వారు దాని సమక్షం లేదా సమావేశ స్థలం నుంచి బయటకు వెళ్లాలనే భావాన్ని తెలుపుతుంది.
- source_word: ἀπελθεῖν
  choice: వెళ్లమని
  rationale: ἔξωతో కలిసి ‘వెలుపలికి వెళ్లడం’ అనే సహజమైన తెలుగు నిర్మాణాన్ని ఇస్తుంది.
- source_word: συνέβαλλον
  choice: సంప్రదించుకోవడం మొదలుపెట్టారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న లేదా ఆరంభమైన పరస్పర చర్చ భావాన్ని సందర్భానుగుణంగా అందిస్తుంది.
- source_word: πρὸς ἀλλήλους
  choice: ఒకరితో ఒకరు
  rationale: పరస్పరంగా చర్చించడాన్ని స్పష్టంగా తెలియజేసే సహజమైన తెలుగు ప్రయోగం.
