id: ACT.4.36
reference: Acts 4:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Ἰωσὴφ δὲ ὁ ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων, ὅ ἐστιν μεθερμηνευόμενον υἱὸς παρακλήσεως, Λευίτης, Κύπριος τῷ γένει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/036.yaml
  text: Joseph[a], who was called Barnabas by the apostles—which translated means son of encouragement—a Levite, a native of Cyprus,
translation:
  language: te
  text: అపొస్తలులు బర్నబా అని పిలిచిన యోసేపు—ఆ పేరును అనువదిస్తే “ప్రోత్సాహపు కుమారుడు” అని అర్థం[a]—లేవీయుడు, పుట్టుకతో కుప్రుకు చెందినవాడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఉద్బోధనపు కుమారుడు,” “ఆదరణపు కుమారుడు,” లేదా “ఓదార్పు కుమారుడు.” గ్రీకు పదానికి ప్రోత్సహించడం, ఉద్బోధించడం, ఆదరించడం లేదా ఓదార్చడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωσὴφ
  choice: యోసేపు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది స్వల్ప కథన సంధిని సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో పదబద్ధంగా ‘ఇక’ లేదా ‘అయితే’ చేర్చకుండానే సహజంగా వ్యక్తమవుతుంది.
- source_word: ὁ ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων
  choice: అపొస్తలులు బర్నబా అని పిలిచిన
  rationale: పేరు అపొస్తలుల నుండి వచ్చిందనే భావాన్ని సహజమైన కర్తరి ప్రయోగంలో స్పష్టంగా తెలియజేస్తుంది; మూలంలో లేని ‘కూడా’ అనే భావాన్ని చేర్చదు.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: ఆ పేరుకు అనువాదం
  rationale: సెమిటిక్ పేరుకు లూకా ఇచ్చిన వివరణను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: υἱὸς παρακλήσεως
  choice: ప్రోత్సాహపు కుమారుడు
  rationale: సెమిటిక్ ‘కుమారుడు’ నిర్మాణాన్ని నిలుపుతూ παράκλησις యొక్క విస్తృతమైన ప్రోత్సాహ భావాన్ని ప్రధాన పాఠ్యంలో ఇస్తుంది.
- source_word: Λευίτης
  choice: లేవీయుడు
  rationale: గోత్ర-మత సంబంధమైన గుర్తింపుకు తెలుగులో స్థిరమైన పదం.
- source_word: Κύπριος τῷ γένει
  choice: పుట్టుకతో కుప్ర ద్వీపానికి చెందినవాడు
  rationale: τῷ γένει సూచించే జన్మస్థల లేదా మూలస్థాన భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: παρακλήσεως అనే పదం సూచించే భావవ్యాప్తి
  choice: ప్రధాన పాఠ్యంలో ‘ప్రోత్సాహపు’ అని అనువదించడం
  alternative: ‘ఉద్బోధనపు,’ ‘ఆదరణపు,’ లేదా ‘ఓదార్పు యొక్క’
  rationale: ఈ పదం ప్రోత్సహించడం, బతిమాలడం లేదా ఉద్బోధించడం, ఆదరించడం, ఓదార్చడం వంటి భావాలను కలిగి ఉండగలదు. వచనం వాటిలో ఒకదానికే భావాన్ని పరిమితం చేయదు కాబట్టి విస్తృతమైన పదాన్ని ప్రధాన పాఠ్యంలో ఉంచి ఇతర భావాలను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. పేరుకు సంబంధించిన వివరణను డాష్‌ల మధ్య ఉంచి గ్రీకు వాక్యంలోని అనుబంధ నిర్మాణాన్ని స్పష్టంగా చూపించాం.
