id: ACT.4.27
reference: Acts 4:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: συνήχθησαν γὰρ ἐπ’ ἀληθείας ⸂ἐν τῇ πόλει ταύτῃ⸃ ἐπὶ τὸν ἅγιον παῖδά σου Ἰησοῦν, ὃν ἔχρισας, Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος σὺν ἔθνεσιν καὶ λαοῖς Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/027.yaml
  text: For truly in this city Herod and Pontius Pilate[a], together with the Gentiles and the peoples of Israel, were gathered against your holy servant Jesus, whom you anointed[b],
translation:
  language: te
  text: ఎందుకంటే, నిజంగా ఈ పట్టణంలో నీవు అభిషేకించిన నీ పరిశుద్ధ సేవకుడైన[a] యేసుకు విరోధంగా హేరోదు, పొంతి పిలాతు, అన్యజనులతోనూ ఇశ్రాయేలు ప్రజలతోనూ[b] కలిసి సమకూడారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ పరిశుద్ధ బిడ్డయైన.” గ్రీకు παῖς అనే పదానికి “సేవకుడు” లేదా “బిడ్డ” అనే అర్థం ఉండవచ్చు. ఇక్కడ యెషయా గ్రంథంలోని సేవకుని భాష ప్రతిధ్వనించే అవకాశం ఉన్నందున “సేవకుడు” అనే అనువాదానికి ప్రాధాన్యం ఇవ్వబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “జనములతోనూ ఇశ్రాయేలు ప్రజలతోనూ.” గ్రీకులో “అన్యజనులు/జనములు” మరియు ఇశ్రాయేలు “ప్రజలు” (బహువచనం) అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: సమకూడారు
  rationale: పూర్తిగా జరిగిన సమీకరణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. గ్రీకులోని నిష్క్రియారూపాన్ని తెలుగులో అక్షరాలా అనుసరిస్తే అసహజంగా ఉండే అవకాశం ఉన్నందున, కర్తృసమూహం కలిసి కూడిన భావాన్ని కాపాడే సహజ రూపం ఎంచుకోబడింది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని కీర్తన ఉల్లేఖనాన్ని ఈ సంఘటన ఎలా నెరవేర్చిందో వివరించే సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: ἐπ’ ἀληθείας
  choice: నిజంగా
  rationale: ‘వాస్తవంగా/నిజముగా’ అనే నొక్కిచెప్పే క్రియావిశేషణ భావాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: ఈ పట్టణంలో
  rationale: మూలంలోని స్థలసూచనను నేరుగా కాపాడుతుంది; సందర్భంలో అది యెరూషలేమని అనవసరంగా పాఠ్యంలో చేర్చదు.
- source_word: ἐπὶ τὸν
  choice: విరోధంగా
  rationale: విరోధపూర్వకంగా ఒకరి మీదికి కూడడం అనే సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἅγιον
  choice: పరిశుద్ధ
  rationale: దేవునికి ప్రత్యేకంగా చెందినవాడు అనే ప్రతిష్ఠిత భావాన్నీ పరిశుద్ధత భావాన్నీ కాపాడే ప్రామాణిక తెలుగు పదం.
- source_word: παῖδά σου
  choice: నీ ... సేవకుడైన
  rationale: παῖς అనే పదానికి ‘సేవకుడు’ లేదా ‘బిడ్డ’ అనే అర్థాలు ఉండవచ్చు. అపొస్తలుల కార్యములలోని సమీప సందర్భం మరియు యెషయా సేవకుని ప్రతిధ్వని కారణంగా ‘సేవకుడు’ ఇక్కడ సముచితం; ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: Ἰησοῦν
  choice: యేసు
  rationale: వ్యక్తినామానికి ప్రామాణిక తెలుగు రూపం.
- source_word: ὃν ἔχρισας
  choice: నీవు అభిషేకించిన
  rationale: χρίω యొక్క ప్రత్యక్షమైన ‘అభిషేకించు’ అర్థాన్ని, అలాగే దైవ నియామకానికి సంబంధించిన మెస్సీయ సూచనను కాపాడుతుంది.
- source_word: Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος
  choice: హేరోదు, పొంతియు పిలాతు
  rationale: వ్యక్తినామాల ప్రామాణిక తెలుగు రూపాలను ఉపయోగించి, τε καὶ ద్వారా కలిపిన ఇద్దరు పాలకులను సహజంగా వరుసగా ఉంచుతుంది.
- source_word: σὺν ἔθνεσιν καὶ λαοῖς Ἰσραήλ
  choice: అన్యజనులతోనూ ఇశ్రాయేలు ప్రజలతోనూ కలిసి
  rationale: ఇశ్రాయేలుతో ఉన్న జాతి-మత వ్యత్యాసాన్ని ‘అన్యజనులు’ స్పష్టంగా తెలియజేస్తుంది. λαοῖς బహువచనాన్ని ప్రధాన పాఠ్యంలో సహజమైన ‘ప్రజలు’తో అందించి, రూపభేదాన్ని పాదసూచికలో సూచిస్తుంది.
theological_decisions:
- issue: యేసును సూచించే παῖς పదం
  choice: సేవకుడు
  alternative: బిడ్డ; కుమారుడు
  rationale: ఈ ప్రార్థనలో యెషయా గ్రంథంలోని సేవకుని భాష ప్రతిధ్వనిస్తుంది; అందువల్ల ‘సేవకుడు’ సందర్భానికి బాగా సరిపోతుంది. ‘బిడ్డ’ సాధ్యమైన నిఘంటు అర్థం కావడంతో పాదసూచికలో ఇవ్వబడింది. ‘కుమారుడు’ క్రైస్తవ సత్యానికి అనుగుణమైనప్పటికీ ఈ నిర్దిష్ట గ్రీకు పదాన్ని అతిగా వ్యాఖ్యానిస్తుంది.
- issue: ἔθνεσιν మరియు ఇశ్రాయేలు మధ్య వ్యత్యాసం
  choice: అన్యజనులు
  alternative: జనాలు/దేశాలు
  rationale: ‘ఇశ్రాయేలు ప్రజలు’తో సమన్వయంగా వచ్చినందున, ఇక్కడ రాజకీయ దేశాలకన్నా ఇశ్రాయేలేతర ప్రజలనే సూచించే వ్యత్యాసం ప్రధానంగా ఉంది. ‘అన్యజనులు’ దానిని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- issue: సమకూర్చబడటంలో దైవ కార్యసాధకత్వం
  choice: సహజ తెలుగు రూపమైన ‘సమకూడారు’
  alternative: ‘సమకూర్చబడ్డారు’ లేదా ‘కూడగట్టబడ్డారు’
  rationale: గ్రీకు నిష్క్రియారూపం కార్యసాధకుడిని పేర్కొనదు. తెలుగులో బలమైన నిష్క్రియారూపం దేవుడే వారిని కూడగట్టాడనే భావాన్ని అవసరానికి మించి ముందుకు తెచ్చే అవకాశం ఉంది. అందువల్ల కార్యసాధకుడిని నిర్ణయించకుండా సంఘటనను తెలిపే సహజ రూపం ఎంచుకోబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలిని ఉంచుతూ, సాధారణ పాఠకులకు సహజంగా వినిపించే వాక్యక్రమం వాడబడింది. ‘నీ’, ‘నీవు’ రూపాలు దేవునితో ప్రత్యక్ష సంభాషణను స్పష్టంగా ఉంచుతాయి. మూలంలోని పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, యేసుకు విరోధంగా కూడిన వ్యక్తులు మరియు సమూహాలు స్పష్టంగా కనిపించేలా తెలుగు వాక్య నిర్మాణం అమర్చబడింది.
