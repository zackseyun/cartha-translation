id: ACT.4.14
reference: Acts 4:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τόν ⸀τε ἄνθρωπον βλέποντες σὺν αὐτοῖς ἑστῶτα τὸν τεθεραπευμένον οὐδὲν εἶχον ἀντειπεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/014.yaml
  text: And seeing the man who had been healed standing with them[a], they had nothing to say in reply.
translation:
  language: te
  text: స్వస్థత పొందిన ఆ మనిషి వారితో కలిసి నిలబడి ఉండడాన్ని చూసి, వారికీ ఎదురు చెప్పడానికి ఏమీ లేకపోయింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు దానికి వ్యతిరేకంగా ఏమీ చెప్పలేకపోయారు”; లేదా, “వారు ఏదీ ఖండించలేకపోయారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τε
  choice: చూసి
  rationale: τε ఈ వాక్యాన్ని ముందున్న కథనంతో అనుసంధానిస్తుంది. తెలుగులో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండా, వరుస క్రియారూపమైన ‘చూసి’ ద్వారా కథన ప్రవాహం సహజంగా కొనసాగుతుంది.
- source_word: ἄνθρωπον
  choice: ఆ మనిషి
  rationale: మునుపటి సందర్భంలో స్వస్థత పొందిన నిర్దిష్ట పురుషుణ్ణి సూచిస్తుంది; ‘ఆ మనిషి’ సహజంగా, సందర్భానికి తగినట్లు ఉంది.
- source_word: βλέποντες
  choice: చూసి
  rationale: ప్రధాన క్రియతో సమకాలికమైన వర్తమాన కృదంతాన్ని తెలుగులో సహజమైన అనుసంధాన క్రియారూపంతో వ్యక్తం చేస్తుంది.
- source_word: σὺν αὐτοῖς
  choice: వారితో కలిసి
  rationale: σύν సహవాసం లేదా తోడుగా ఉండడాన్ని సూచిస్తుంది; ‘వారితో కలిసి’ దాని భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἑστῶτα
  choice: నిలబడి ఉండడం
  rationale: ἵστημι యొక్క పరిపూర్ణ కృదంతం కొనసాగుతున్న నిలిచిన స్థితిని సూచిస్తుంది; ‘నిలబడి ఉండడం’ ఆ స్థితిగత భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: τεθεραπευμένον
  choice: స్వస్థత పొందిన
  rationale: θεραπεύω యొక్క పరిపూర్ణ కర్మణి కృదంతం పూర్తయిన స్వస్థతను, దాని కొనసాగుతున్న ఫలితాన్ని సూచిస్తుంది; ‘స్వస్థత పొందిన’ అద్భుత స్వస్థత సందర్భానికి తగినది.
- source_word: οὐδὲν
  choice: ఏమీ లేకపోయింది
  rationale: పూర్తి లేమిని వ్యక్తం చేసే οὐδέν భావాన్ని సహజ తెలుగు నిషేధ నిర్మాణంతో అందిస్తుంది.
- source_word: εἶχον ἀντειπεῖν
  choice: ఎదురు చెప్పడానికి ఏమీ లేకపోయింది
  rationale: ἀντειπεῖν లోని ప్రతివాద లేదా విరోధ స్పందన భావాన్ని ‘ఎదురు చెప్పడం’ నిలుపుతుంది; ἔχω + infinitive నిర్మాణాన్ని ‘చెప్పడానికి ఏమీ లేకపోయింది’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు కృదంత నిర్మాణాలను తెలుగు వరుస క్రియలు మరియు స్థితి వ్యక్తీకరణలతో అందిస్తూ, ἀντειπεῖν లోని ప్రతివాద భావాన్ని ప్రధాన పాఠంలో నిలిపింది.
