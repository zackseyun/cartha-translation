id: ACT.4.8
reference: Acts 4:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε Πέτρος πλησθεὶς πνεύματος ἁγίου εἶπεν πρὸς αὐτούς· Ἄρχοντες τοῦ λαοῦ καὶ ⸀πρεσβύτεροι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/008.yaml
  text: Then Peter, filled with the Holy Spirit, said to them, “Rulers of the people and elders,”
translation:
  language: te
  text: 'అప్పుడు పేతురు పరిశుద్ధాత్మతో నింపబడి వారితో ఇలా అన్నాడు: “ప్రజల పాలకులారా, పెద్దలారా,[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో “ఇశ్రాయేలు పెద్దలారా” అని ఉంది.
    reason: πρεσβύτεροι వద్ద ఉన్న పాఠాంతరాన్ని పాఠకునికి తెలియజేయడం.
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: తర్వాత జరిగిన సంఘటనను పరిచయం చేసే సహజమైన కాలసూచక పదం.
- source_word: Πέτρος
  choice: పేతురు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: πλησθεὶς
  choice: నింపబడి
  rationale: πίμπλημι యొక్క భూతకాల కర్మణి అసమాపక క్రియారూపాన్ని నిలుపుతూ, పేతురు నింపబడినవాడని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: πνεύματος ἁγίου
  choice: పరిశుద్ధాత్మతో
  rationale: πλησθεὶς తరువాతి సంబంధాన్ని తెలుగులో ‘తో నింపబడి’ అని సహజంగా వ్యక్తపరుస్తూ, సందర్భంలోని పరిశుద్ధాత్మను స్పష్టంగా సూచిస్తుంది.
- source_word: εἶπεν πρὸς αὐτούς
  choice: వారితో ఇలా అన్నాడు
  rationale: ప్రత్యక్ష సంభాషణను తెలుగులో సహజంగా పరిచయం చేసే రూపం; ‘ఇలా’ అనే పదం ఉద్ధరణ ప్రారంభాన్ని సూచిస్తుంది.
- source_word: Ἄρχοντες τοῦ λαοῦ
  choice: ప్రజల పాలకులారా
  rationale: ప్రజలపై అధికారమున్న వారిని ఉద్దేశించిన సంబోధనను నేరుగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: πρεσβύτεροι
  choice: పెద్దలారా
  rationale: ఇక్కడ కేవలం వృద్ధులను కాక, గుర్తింపు పొందిన పాలక మండలి పెద్దలను సూచిస్తుంది; సంబోధన రూపం మూలంలోని vocative భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: πνεύματος ἁγίου యొక్క సూచన
  choice: పరిశుద్ధాత్మ
  alternative: పరిశుద్ధమైన ఆత్మ
  rationale: అపొస్తలుల కార్యముల సందర్భంలో ఈ పదబంధం సాక్ష్యమివ్వడానికి శక్తినిచ్చే దైవిక పరిశుద్ధాత్మను సూచిస్తుంది; ‘పరిశుద్ధాత్మ’ అనే స్థిరమైన తెలుగు రూపం అదనపు సిద్ధాంతార్థాన్ని చేర్చకుండా ఆ సూచనను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సభా సంబోధన వాడబడింది. వాక్య నిర్మాణం మూలంలోని క్రమాన్ని ప్రధానంగా నిలుపుతూ తెలుగు ప్రత్యక్ష సంభాషణకు తగినట్లుగా ‘ఇలా’ చేర్చబడింది.
