id: ACT.4.1
reference: Acts 4:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Λαλούντων δὲ αὐτῶν πρὸς τὸν λαὸν ἐπέστησαν αὐτοῖς οἱ ⸀ἱερεῖς καὶ ὁ στρατηγὸς τοῦ ἱεροῦ καὶ οἱ Σαδδουκαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/001.yaml
  text: While they were speaking to the people[a], the priests and the captain of the temple and the Sadducees came upon them[b],
translation:
  language: te
  text: వారు ప్రజలతో మాట్లాడుతుండగా, యాజకులు, ఆలయ అధికారి[a], సద్దూకయ్యులు వారి దగ్గరికి వచ్చారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆలయ అధికారి’ ఆలయ ప్రాంగణంలో క్రమశిక్షణ, భద్రతను పర్యవేక్షించే అధికారి.
    reason: cultural_note
  - marker: b
    text: లేదా ‘వారి వద్దకు వచ్చి నిలబడ్డారు.’ గ్రీకు క్రియ దగ్గరికి రావడాన్ని లేదా అకస్మాత్తుగా వచ్చి నిలబడడాన్ని సూచించగలదు; ఇక్కడ అధికారులు వారి మాటలకు అంతరాయం కలిగించిన సందర్భం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λαλούντων δὲ αὐτῶν
  choice: వారు ... మాట్లాడుతుండగా
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా అనువదించాం. δέ కథన కొనసాగింపును సూచిస్తుంది; తెలుగులో అదనపు సంధాయక పదం లేకుండానే ఈ నిర్మాణం సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: πρὸς τὸν λαὸν
  choice: ప్రజలతో
  rationale: λαός ఇక్కడ ఆలయ ప్రాంగణంలో కూడిన ప్రజలను సూచిస్తుంది. తెలుగు వాడుకలో ‘ప్రజలతో మాట్లాడటం’ సహజంగా ఉండి, ‘గుంపు’ అనే మరింత వ్యాఖ్యానాత్మక భావాన్ని చేర్చదు.
- source_word: ἐπέστησαν αὐτοῖς
  choice: వారి దగ్గరికి వచ్చారు
  rationale: ἐφίστημι దగ్గరికి రావడం, సమీపించడం లేదా అకస్మాత్తుగా వచ్చి నిలవడం అనే భావాలను కలిగి ఉంటుంది. ఈ ఎంపిక అధికారిక అంతరాయాన్ని సందర్భంలో గ్రహించనిస్తూ, క్రియలో స్పష్టంగా లేని శత్రుత్వాన్ని చేర్చదు.
- source_word: οἱ ἱερεῖς
  choice: యాజకులు
  rationale: మూలంలో సాధారణ ἱερεῖς ఉంది, ἀρχιερεῖς కాదు; అందువల్ల ‘ప్రధాన యాజకులు’ అని హోదాను పెంచకుండా ‘యాజకులు’ అని అనువదించాం.
- source_word: ὁ στρατηγὸς τοῦ ἱεροῦ
  choice: ఆలయ అధికారి
  rationale: στρατηγός ఇక్కడ ఆలయ ప్రాంగణ క్రమశిక్షణ, భద్రత బాధ్యతగల అధికారిని సూచిస్తుంది. ‘ఆలయ అధికారి’ సాధారణ తెలుగు పాఠకునికి సహజంగా ఉంటుంది; అతని బాధ్యతను పాదసూచిక వివరిస్తుంది.
- source_word: οἱ Σαδδουκαῖοι
  choice: సద్దూకయ్యులు
  rationale: ఈ యూదు మతవర్గపు పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణను ఉపయోగించాం.
theological_decisions:
- issue: అధికారుల రాకలో శత్రుత్వ భావం
  choice: ‘వారి దగ్గరికి వచ్చారు’ అని తటస్థంగా అనువదించడం
  alternative: ‘వారిని ఎదుర్కొన్నారు’ లేదా ‘వారిపైకి వచ్చారు’
  rationale: తరువాతి సందర్భం వ్యతిరేకతను చూపించినా, ఈ క్రియ స్వతహాగా బలమైన ఘర్షణను తప్పనిసరిగా సూచించదు. తటస్థ అనువాదం కథనంలోని ఉద్రిక్తతను ముందుగానే పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని అనుసరించాం. మూలంలోని పదక్రమాన్ని కఠినంగా అనుకరించకుండా సహజ తెలుగు వాక్యక్రమాన్ని వాడాం; అధికారుల రాకకు మూలంలో లేనంత శత్రుత్వాన్ని జోడించలేదు.
