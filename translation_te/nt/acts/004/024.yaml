id: ACT.4.24
reference: Acts 4:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ὁμοθυμαδὸν ἦραν φωνὴν πρὸς τὸν θεὸν καὶ εἶπαν· Δέσποτα, ⸀σὺ ὁ ποιήσας τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/024.yaml
  text: When they heard this[a], they lifted their voices together to God and said, “Master, you are the one who made heaven and earth and sea[b], and everything in them,”
translation:
  language: te
  text: 'వారు అది విన్నప్పుడు, అందరూ ఏకమనస్సుతో దేవునికి తమ స్వరం ఎత్తి ఇలా అన్నారు: “సర్వాధికారీ,[a] ఆకాశాన్ని, భూమిని, సముద్రాన్ని, వాటిలో ఉన్న సమస్తాన్నీ సృష్టించినవాడివి నీవే,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యజమానీ.” గ్రీకు పదం Δέσποτα సంపూర్ణ అధికారం గల యజమానిని సూచించే సంబోధన; ఇది సాధారణంగా “ప్రభువు” అని అనువదించే κύριος అనే పదానికి భిన్నమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: వారు అది విన్నప్పుడు
  rationale: సందర్భంలో కాలార్థకంగా ఉన్న భూతకాల కృదంతాన్ని సహజమైన తెలుగులో చూపిస్తుంది; ‘అది’ అనేది వారు విన్న సమాచారాన్ని సందర్భం నుంచి స్పష్టం చేస్తుంది.
- source_word: ὁμοθυμαδόν
  choice: అందరూ ఏకమనస్సుతో
  rationale: సమూహమంతా ఒకే ఉద్దేశంతో కలిసి ప్రార్థించిన భావాన్ని ఆధునిక, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἦραν φωνήν
  choice: తమ స్వరం ఎత్తి
  rationale: గ్రీకులోని ఏకవచన ‘స్వరం’ను నిలుపుతూ, వారి సమైక్య ప్రార్థనను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: πρὸς τὸν θεόν
  choice: దేవునికి
  rationale: ప్రార్థనలో దేవుని ఉద్దేశించి పలికిన మాటల దిశను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: Δέσποτα
  choice: సర్వాధికారీ
  rationale: యజమాని లేదా సంపూర్ణ అధికారం గలవాడు అనే δεσπότης భావాన్ని దైవ సంబోధనకు తగిన గౌరవప్రదమైన తెలుగులో అందిస్తుంది; κύριοςకు సాధారణంగా వాడే ‘ప్రభువు’తో ఉన్న పదభేదాన్ని కాపాడుతుంది.
- source_word: σὺ ὁ ποιήσας
  choice: సృష్టించినవాడివి నీవే
  rationale: దేవుడే సృష్టికర్త అని గుర్తింపుతో కూడిన నొక్కిచెప్పే నిర్మాణాన్ని సహజమైన తెలుగు వాక్యక్రమంలో నిలుపుతుంది.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν
  choice: ఆకాశాన్ని, భూమిని, సముద్రాన్ని
  rationale: సృష్టిని సూచించే మూడు విభాగాల సూత్రాన్ని స్పష్టంగా, సంప్రదాయబద్ధమైనప్పటికీ ఆధునికంగా అర్థమయ్యే తెలుగులో అందిస్తుంది.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: వాటిలో ఉన్న సమస్తాన్నీ
  rationale: ఆకాశం, భూమి, సముద్రంలో ఉన్న సృష్టి అంతటినీ సమగ్రంగా సూచిస్తుంది.
theological_decisions:
- issue: Δέσποτα అనే దైవ బిరుదు అనువాదం
  choice: సర్వాధికారీ
  alternative: యజమానీ; సార్వభౌమ ప్రభువా; ప్రభువా
  rationale: దేవుని సంపూర్ణ అధికారాన్ని తెలియజేస్తూ, మూలంలో లేని అదనపు ‘ప్రభువు’ బిరుదును చేర్చదు; అలాగే δεσπότηςను κύριοςతో కలిపివేయకుండా పదార్థ భేదాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామూహిక ప్రార్థనకు తగిన గౌరవప్రదమైన ధోరణి. ‘తమ స్వరం’ అనే ఏకవచనం మూలంలోని సమైక్య స్వరాన్ని నిలుపుతుంది. పాదసూచిక గుర్తు సంబంధిత దైవ బిరుదు వెంట ఉంచబడింది.
