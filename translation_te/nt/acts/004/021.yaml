translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని కారణ సంబంధాన్ని రెండు వాక్యాలుగా సహజంగా అమర్చాం; అపరిపూర్ణ క్రియ యొక్క కొనసాగుతున్న భావాన్ని ‘మహిమపరుస్తూ ఉన్నారు’గా నిలిపాం.
