id: ACT.4.21
reference: Acts 4:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ προσαπειλησάμενοι ἀπέλυσαν αὐτούς, μηδὲν εὑρίσκοντες τὸ πῶς ⸀κολάσωνται αὐτούς, διὰ τὸν λαόν, ὅτι πάντες ἐδόξαζον τὸν θεὸν ἐπὶ τῷ γεγονότι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/021.yaml
  text: So after further threatening them[a], they released them, finding no way to punish them because of the people, since everyone was glorifying God for what had happened.
translation:
  language: te
  text: వారు వారిని ఇంకా బెదిరించిన తర్వాత[a] విడుదల చేశారు. ప్రజల కారణంగా వారిని ఎలా శిక్షించాలో వారికి ఏ మార్గమూ కనిపించలేదు; ఎందుకంటే జరిగిన దానికిగాను అందరూ దేవుణ్ణి మహిమపరుస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మళ్లీ బెదిరించిన తర్వాత,’ లేదా ‘ఇంకా బెదిరింపులు చేసిన తర్వాత.’ προσαπειλησάμενοι అనే గ్రీకు పదం ఇంతకుముందు చేసిన బెదిరింపులకు అదనంగా, లేదా వాటిని మరింత తీవ్రం చేస్తూ, బెదిరించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαπειλησάμενοι
  choice: మరింతగా బెదిరించి
  rationale: πρός ఉపసర్గ ఇంతకుముందు చేసిన బెదిరింపులకు అదనంగా లేదా మరింత తీవ్రంగా బెదిరించారనే భావాన్ని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἀπέλυσαν
  choice: విడుదల చేశారు
  rationale: నిర్బంధం నుంచి వెళ్లనివ్వడం అనే న్యాయపరమైన సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: μηδὲν εὑρίσκοντες τὸ πῶς κολάσωνται αὐτούς
  choice: వారిని ఎలా శిక్షించాలో వారికి ఏ మార్గమూ కనిపించలేదు
  rationale: అక్షరార్థంగా ‘వారిని ఎలా శిక్షించాలనే దానికి ఏమీ కనుగొనక’ అనే నిర్మాణాన్ని, τὸ πῶς సూచించే విధానం/మార్గం భావంతో సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: διὰ τὸν λαόν
  choice: ప్రజల కారణంగా
  rationale: διά + accusative ఇక్కడ కారణాన్ని సూచిస్తుంది; λαός విస్తృత ప్రజానీకాన్ని సూచిస్తున్నందున ‘ప్రజలు’ అనేది ‘గుంపు’ కంటే తగినది.
- source_word: πάντες ἐδόξαζον τὸν θεόν
  choice: అందరూ దేవుణ్ణి మహిమపరుస్తూ ఉన్నారు
  rationale: πάντες యొక్క సమగ్ర భావాన్నీ, ἐδόξαζον యొక్క కొనసాగుతున్న అపరిపూర్ణ క్రియాంశాన్నీ, దేవునికి మహిమ చెల్లించే భావాన్నీ నిలుపుతుంది.
- source_word: ἐπὶ τῷ γεγονότι
  choice: జరిగినదానిని బట్టి
  rationale: పూర్తయిన సంఘటనే దేవుణ్ణి మహిమపరచడానికి ఆధారం లేదా కారణం అని ἐπί + dative తెలిపే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
