id: ACT.4.19
reference: Acts 4:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος καὶ Ἰωάννης ἀποκριθέντες ⸂εἶπον πρὸς αὐτούς⸃· Εἰ δίκαιόν ἐστιν ἐνώπιον τοῦ θεοῦ ὑμῶν ἀκούειν μᾶλλον ἢ τοῦ θεοῦ, κρίνατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/019.yaml
  text: But Peter and John answered and said to them[a], “If it is right in the sight of God to listen to you rather than to God, judge for yourselves.”
translation:
  language: te
  text: 'అయితే పేతురు, యోహాను జవాబిచ్చి వారితో ఇలా అన్నారు: “మీ మాట వినడం దేవుని మాట వినడం కంటే దేవుని దృష్టిలో సరైనదో, మీరే తీర్పు చెప్పండి.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, భావాన్ని మరింత స్పష్టంగా చెబితే: “దేవునికి లోబడడం కంటే మీకు లోబడడమే దేవుని దృష్టిలో సరైనదో, మీరే తీర్పు చెప్పండి.” గ్రీకు క్రియకు అక్షరార్థం ‘వినడం’; ఈ సందర్భంలో అది అధికారాన్ని మన్నించి లోబడే భావాన్నీ కలిగి ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Πέτρος καὶ Ἰωάννης
  choice: అయితే పేతురు, యోహాను
  rationale: δέ ఇక్కడ అధికారుల ఆజ్ఞకు ప్రతిస్పందనగా స్వల్ప వ్యతిరేక మలుపును సూచిస్తుంది; ఆధునిక తెలుగులో ‘అయితే’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ἀποκριθέντες εἶπον πρὸς αὐτούς
  choice: వారికి జవాబిస్తూ ఇలా అన్నారు
  rationale: కృదంతం మరియు సమాపక క్రియ రెండింటి భావాన్నీ సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది; ‘వారికి’ πρὸς αὐτούςను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: δίκαιόν
  choice: న్యాయం
  rationale: ఇక్కడ δίκαιός దేవుని సమక్షంలో ఏది సరి, న్యాయసమ్మతం అనే నైతిక-న్యాయ నిర్ణయాన్ని సూచిస్తుంది. ‘న్యాయం’ సాధారణ పాఠకులకు సహజంగా ఉండి ఆ బలాన్ని నిలుపుతుంది.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: దేవుని దృష్టిలో
  rationale: దేవుని సమక్షంలో ఆయన తీర్పుకు ఏది సరైనదో అనే మూలపాఠంలోని మూల్యాంకన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ὑμῶν ἀκούειν μᾶλλον ἢ τοῦ θεοῦ
  choice: దేవుని మాట వినడం కంటే మీ మాట వినడం
  rationale: తెలుగులో పోలిక సహజంగా ఉండేందుకు గ్రీకు పదక్రమాన్ని మార్చినా, ‘మీ మాట వినడం’ మరియు ‘దేవుని మాట వినడం’ మధ్యనున్న ఉద్దేశపూర్వక వ్యత్యాసాన్ని నిలుపుతుంది. ἀκούεινను ‘వినడం’గా అనువదించడం ద్వారా దాని ప్రాథమిక అర్థాన్ని కాపాడుతూ, సందర్భంలోని లోబడే భావాన్ని సూచనగానే ఉంచుతుంది.
- source_word: κρίνατε
  choice: మీరే తీర్పు చెప్పండి
  rationale: రెండవ పురుష బహువచన ఆజ్ఞను స్పష్టంగా అందిస్తుంది; ‘మీరే’ వారి స్వంత నిర్ణయానికే ఈ ప్రశ్నను అప్పగిస్తున్న సవాలు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἀκούεινను అధికారానికి లోబడడమనే సందర్భార్థంతో ‘లోబడడం/విధేయత చూపడం’గా అనువదించాలా?
  choice: ప్రధాన పాఠంలో ‘మాట వినడం’ను ఉంచడం
  alternative: ‘మీకు లోబడడం కంటే దేవునికి లోబడడం’
  rationale: సందర్భం విధేయతను స్పష్టంగా సూచించినప్పటికీ, గ్రీకు పాఠం ప్రత్యేకమైన విధేయతా క్రియకు బదులు ἀκούω (‘విను’)ను ఉపయోగిస్తుంది. అందువల్ల ప్రధాన పాఠం మూలపదాన్ని కాపాడి, సందర్భార్థాన్ని పాదటిప్పణిలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ప్రత్యక్ష సంభాషణలో సహజత్వం కోసం ‘ఇలా అన్నారు’ వాడబడింది. ‘వినడం’ అనే మూల రూపాన్ని నిలుపుతూ, సందర్భంలోని విధేయత భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
