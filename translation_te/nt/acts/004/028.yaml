  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ποιῆσαι ὅσα ἡ χείρ σου καὶ ἡ ⸀βουλὴ προώρισεν γενέσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/028.yaml
  text: to do whatever your hand and your purpose had predestined to happen[a].
translation:
  language: te
  text: నీ చెయ్యి, నీ సంకల్పం ముందుగానే జరగాలని నిర్ణయించినవన్నీ చేయడానికి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ముందే నిర్దేశించినవి’ లేదా ‘ముందే నిర్ణయించుకున్నవి.’ గ్రీకు క్రియ ముందస్తు నిర్ణయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι
  choice: జరగడానికి
  rationale: ఈ అసమాపక క్రియ ముందటి వచనంలోని వ్యక్తులు కూడివచ్చిన ఉద్దేశం/ఫలితంతో అనుసంధానమై ఉంది. తెలుగులో γενέσθαιతో కలిపి ‘జరగడానికి’ అని సహజంగా వ్యక్తమవుతుంది; ప్రత్యేకంగా ‘చేయడానికి’ అని చేరిస్తే వాక్యం బరువుగా మారుతుంది.
- source_word: ὅσα
  choice: నిర్ణయించినదంతా
  rationale: నపుంసక బహువచన సంబంధ సర్వనామం సూచించే సమగ్ర భావాన్ని ‘దంతా’ సహజంగా తెలియజేస్తుంది.
- source_word: χείρ
  choice: చెయ్యి
  rationale: మూలంలోని స్పష్టమైన ‘చెయ్యి’ రూపకాన్ని నిలుపుతుంది; ఇక్కడ అది దేవుని శక్తి లేదా కార్యసాధకత్వాన్ని సూచించినా, దానిని వివరణాత్మకంగా మార్చలేదు.
- source_word: βουλή
  choice: సంకల్పం
  rationale: ఆలోచించి ఏర్పరచుకున్న ఉద్దేశం లేదా నిర్ణయాన్ని సూచిస్తుంది. ‘ప్రణాళిక’కన్నా మూలపదంలోని ఉద్దేశపూర్వకతను, గంభీరతను సహజ తెలుగులో కాపాడుతుంది.
- source_word: προώρισεν
  choice: ముందుగానే నిర్ణయించిన
  rationale: προορίζωలోని ముందస్తు నిర్ణయ భావాన్ని స్పష్టంగా కాపాడుతుంది; ఒక ప్రత్యేక సిద్ధాంత వ్యవస్థకు చెందిన సాంకేతిక పదాన్ని అనవసరంగా రుద్దదు.
- source_word: γενέσθαι
  choice: జరగడానికి
  rationale: సంఘటనలు సంభవించడం అనే γίνομαι యొక్క భావాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: దేవుని సార్వభౌమ సంకల్పం మరియు మానవ బాధ్యత మధ్య ఉద్రిక్తతలో προώρισεν అనువాదం
  choice: ముందుగానే నిర్ణయించిన
  alternative: ముందే నిర్దేశించిన; ముందే నిర్ణయించుకున్న
  rationale: గ్రీకు క్రియ దేవుని ముందస్తు నిర్ణయాన్ని బలంగా తెలియజేస్తుంది. ఈ వచనం యేసు బాధలకు సంబంధించిన సంఘటనలపై దేవుని ముందస్తు సంకల్పాన్ని ప్రకటిస్తుంది; అయితే మానవ బాధ్యతతో దాని సంబంధాన్ని ఇక్కడ వివరణాత్మకంగా పరిష్కరించదు. అందువల్ల ఆ ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘నీ చెయ్యి, నీ సంకల్పం’ అనే సమన్విత కర్తలను అలాగే ఉంచి మూలంలోని బైబిలీయ రూపకాన్ని కాపాడాం. ఇది వాక్యఖండం కావడం ముందటి వచనంతో ఉన్న వ్యాకరణ సంబంధాన్ని ప్రతిబింబిస్తుంది.
