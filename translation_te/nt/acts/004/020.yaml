  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ δυνάμεθα γὰρ ἡμεῖς ἃ εἴδαμεν καὶ ἠκούσαμεν μὴ λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/020.yaml
  text: For we are not able not to speak about what we have seen and heard[a].
translation:
  language: te
  text: ఎందుకంటే మేము చూసినవాటినీ విన్నవాటినీ చెప్పకుండా ఉండలేము.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదానుసారంగా: “ఎందుకంటే మేము చూసినవాటినీ విన్నవాటినీ చెప్పకుండా ఉండడం మాకు సాధ్యం కాదు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δυνάμεθα ... μὴ λαλεῖν
  choice: చెప్పకుండా ఉండలేము
  rationale: గ్రీకులోని ‘మాట్లాడకుండా ఉండడం మాకు సాధ్యం కాదు’ అనే అసమర్థత భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఇది కేవలం మాట్లాడాలనే సంకల్పంగా భావాన్ని బలహీనపరచదు.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు కారణాన్ని తెలిపే వివరణాత్మక అనుసంధానాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἡμεῖς
  choice: మేము
  rationale: స్పష్టంగా ఉన్న గ్రీకు సర్వనామాన్ని ప్రతిబింబిస్తుంది; తెలుగులో ‘మేమే’ అనడం అవసరానికి మించిన ఉద్ఘాటన అవుతుంది.
- source_word: ἃ
  choice: వాటిని
  rationale: చూసినవి, విన్నవి అనే సాక్ష్య విషయాలను సహజంగా సూచిస్తుంది.
- source_word: εἴδαμεν καὶ ἠκούσαμεν
  choice: చూసినవాటినీ విన్నవాటినీ
  rationale: రెండు ప్రత్యక్ష అనుభవాలనూ సమాంతరంగా ఉంచి అపొస్తలుల సాక్ష్య స్వభావాన్ని కాపాడుతుంది.
- source_word: λαλεῖν
  choice: చెప్పడం
  rationale: ఈ సందర్భంలో వారు చూశినదీ విన్నదీ ఇతరులకు తెలియజేయడాన్ని సూచిస్తుంది; ‘మాట్లాడడం’ కంటే ‘చెప్పడం’ తెలుగులో కర్మతో మరింత సహజంగా సరిపోతుంది.
theological_decisions:
- issue: అపొస్తలుల మాటను సంకల్పంగా అర్థం చేసుకోవాలా, మాట్లాడకుండా ఉండలేని అసమర్థతగా అర్థం చేసుకోవాలా
  choice: వారు చెప్పకుండా ఉండలేరని వాక్యం తెలియజేస్తుంది.
  alternative: ‘మేము చెప్పడం ఆపము’ అని, కేవలం దృఢ సంకల్పంగా అనువదించడం.
  rationale: οὐ δυνάμεθα ... μὴ λαλεῖν నిర్మాణం మౌనంగా ఉండలేని అసమర్థతను నేరుగా వ్యక్తం చేస్తుంది. అందువల్ల దాన్ని కేవలం నిరాకరణ లేదా సంకల్పంగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే శైలి. ‘చెప్పకుండా ఉండలేము’ గ్రీకు అసమర్థత భావాన్ని సహజమైన తెలుగు ద్వినిషేధ నిర్మాణంలో నిలుపుతుంది.
