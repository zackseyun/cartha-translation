  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸂δυνάμει μεγάλῃ⸃ ἀπεδίδουν τὸ μαρτύριον οἱ ἀπόστολοι ⸂τῆς ἀναστάσεως τοῦ κυρίου Ἰησοῦ⸃, χάρις τε μεγάλη ἦν ἐπὶ πάντας αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/033.yaml
  text: And with great power the apostles were giving their testimony about the resurrection of the Lord Jesus[a], and great favor was upon them all.
translation:
  language: te
  text: అపొస్తలులు గొప్ప శక్తితో ప్రభువైన యేసు పునరుత్థానం గురించి సాక్ష్యం ఇస్తూ ఉన్నారు. వారందరిపై గొప్ప అనుగ్రహం[a] ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గొప్ప అనుకూలత.” గ్రీకు పదం χάριςకు ‘అనుగ్రహం/కృప’ లేదా ‘అనుకూలత’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ దేవుని కృపను, లేదా విశ్వాసుల పట్ల ఉన్న అనుకూల దృష్టిని, లేదా ఈ రెండింటినీ సూచించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμει μεγάλῃ
  choice: గొప్ప శక్తితో
  rationale: కరణార్థక చతుర్థీ విభక్తి భావాన్ని సహజంగా తెలియజేస్తుంది; లూకా–అపొస్తలుల కార్యములలో δύναμις సూచించే శక్తిమంతమైన ప్రభావాన్ని నిలుపుతుంది, అయితే అద్భుత కార్యాలను ప్రత్యేకంగా చేర్చదు.
- source_word: ἀπεδίδουν
  choice: ఇస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న లేదా పునరావృత చర్యను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ μαρτύριον
  choice: సాక్ష్యం
  rationale: μαρτύριον యొక్క సాక్ష్యమిచ్చే భావాన్ని నేరుగా, సహజంగా అందిస్తుంది. గ్రీకులో లేని స్వామ్యసూచక పదాన్ని చేర్చాల్సిన అవసరం తెలుగులో లేదు.
- source_word: τῆς ἀναστάσεως
  choice: పునరుత్థానం గురించి
  rationale: ఇది సాక్ష్యంలోని విషయాన్ని తెలిపే సంబంధ విభక్తిగా గ్రహించబడుతుంది; ‘గురించి’ ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన రూపం.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: ప్రభువైన యేసు
  rationale: κύριοςను ‘ప్రభువు’గా నిలుపుతూ, యేసుతో దాని సంబంధాన్ని తెలుగులో సహజమైన విశేషణ నిర్మాణంతో తెలియజేస్తుంది.
- source_word: χάρις
  choice: అనుగ్రహం
  rationale: χάριςలోని కృప మరియు అనుకూలత రెండింటినీ తెలుగులో కొంతవరకు మోయగల గౌరవప్రదమైన పదం. మూలం దాని మూలాన్ని దేవునికో ప్రజలకో పరిమితం చేయదు.
- source_word: τε
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: తెలుగు వాక్య విభజనలో రెండవ వాక్యం సహజంగా ముందటి వాక్యానికి అనుసంధానమవుతుంది; ‘మరియు’ చేర్చడం ఇక్కడ అవసరం లేదు.
- source_word: ἐπὶ πάντας αὐτούς
  choice: వారందరిపై
  rationale: ఏదో సమస్త సమూహం మీద నిలిచి లేదా వ్యాపించి ఉందనే ἐπί భావాన్ని, అలాగే అందరినీ చేర్చే ఉద్ఘాటనను నిలుపుతుంది.
theological_decisions:
- issue: χάρις యొక్క సందర్భార్థం
  choice: మొత్తం సమాజంపై ఉన్న అనుగ్రహం
  alternative: దేవుని కృప; లేదా ప్రజల అనుకూల దృష్టి
  rationale: ఈ అనుగ్రహం ఎవరి నుండి వచ్చిందో వచనం నిర్దిష్టంగా చెప్పదు. ‘అనుగ్రహం’ అనే పదం దైవిక కృపను గానీ అనుకూల ఆదరణను గానీ పూర్తిగా తొలగించకుండా మూలంలోని ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. కొనసాగుతున్న సాక్ష్యక్రియను ‘ఇస్తూ ఉన్నారు’తో వ్యక్తం చేసి, χάριςలోని అర్థవిస్తృతిని ప్రధాన పాఠం మరియు పాదటిప్పణిలో సంరక్షించాం.
