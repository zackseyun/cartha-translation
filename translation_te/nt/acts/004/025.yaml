id: ACT.4.25
reference: Acts 4:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃ διὰ ⸂πνεύματος ἁγίου⸃ στόματος Δαυὶδ παιδός σου εἰπών· Ἱνατί ἐφρύαξαν ἔθνη καὶ λαοὶ ἐμελέτησαν κενά;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/025.yaml
  text: 'who[a], through the Holy Spirit, by the mouth of David your servant, said: ‘Why did the nations rage[b], and the peoples devise vain things?’'
translation:
  language: te
  text: 'పరిశుద్ధాత్మ ద్వారా, నీ సేవకుడైన దావీదు నోటి ద్వారా, ఇలా చెప్పావు[a]: “జనములు ఎందుకు ఉగ్రంగా చెలరేగాయి? ప్రజలు వ్యర్థమైన వాటిని ఎందుకు ఆలోచించారు[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'కొన్ని ప్రతుల్లో “మన తండ్రియైన దావీదు, నీ సేవకుడు” అని ఉంది. అప్పుడు పరిచయం: “పరిశుద్ధాత్మ ద్వారా, మన తండ్రియైన దావీదు అనే నీ సేవకుని నోటి ద్వారా, ఇలా చెప్పావు” అని ఉంటుంది.'
    reason: textual_variant
  - marker: b
    text: లేదా “వ్యర్థమైన వాటిని పన్నారు.” గ్రీకు క్రియకు “ఆలోచించారు/ధ్యానించారు” అనే అర్థమూ, ఈ సందర్భంలో “పన్నారు” అనే అర్థమూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πνεύματος ἁγίου
  choice: పరిశుద్ధాత్మ ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సాధనాన్ని లేదా కార్యనిర్వాహక మాధ్యమాన్ని సూచిస్తుంది; ఈ రూపం ఆ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: στόματος Δαυὶδ παιδός σου
  choice: నీ సేవకుడైన దావీదు నోటితో
  rationale: στόματος అనే బైబిలీయ ప్రవచన వాక్యప్రయోగాన్ని నిలుపుతూ, παῖς‌కు దావీదు సందర్భంలో తగిన ‘సేవకుడు’ అనే అర్థాన్ని ఇస్తుంది.
- source_word: ἐφρύαξαν
  choice: ఉగ్రంగా చెలరేగాయి
  rationale: ఈ క్రియలోని అల్లకల్లోలమైన, ధిక్కారపూరితమైన ఉద్రేకాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἔθνη
  choice: జనాలు
  rationale: ఇక్కడ మతసామాజిక వర్గంగా ‘అన్యజనులు’ కంటే, కీర్తనలోని విస్తృత దేశజన సమూహాల భావమే ప్రధానమైనది.
- source_word: λαοὶ
  choice: ప్రజలు
  rationale: గ్రీకు బహువచనాన్ని, కీర్తనా సమాంతర నిర్మాణాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἐμελέτησαν
  choice: తలపోశారు
  rationale: ఈ క్రియకు ధ్యానించడం, ఆలోచించడం, పన్నడం అనే పరిధి ఉంది; ‘తలపోశారు’ మూలంలోని ఉద్దేశపూర్వక ఆలోచనను నిలుపుతూ సందర్భానుసారమైన కుట్ర భావాన్ని బలవంతంగా చేర్చదు.
- source_word: κενά
  choice: వ్యర్థమైన వాటిని
  rationale: ‘ఖాళీ’ మరియు ‘ఫలించని’ అనే భావాలను కలిగిన పదాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ఉద్ధరణ పరిచయంలో τοῦ πατρὸς ἡμῶν ఉన్న పాఠభేదం
  choice: ప్రధాన పాఠంలో ‘మన తండ్రి’ అనే పదబంధాన్ని చేర్చకుండా, దేవునితో అనుసంధానించే ‘చెప్పినవాడవు’ రూపాన్ని వాడటం
  alternative: ‘మన తండ్రియైన నీ సేవకుడు దావీదు నోటితో’ అని చేర్చడం
  rationale: ఈ పదబంధం పాఠపరంగా అనిశ్చితమైనది, SBLGNT‌లోని స్థానం కూడా తెలుగులో నేరుగా ప్రతిబింబిస్తే అసహజంగా ఉంటుంది. అందువల్ల ప్రధాన పాఠం వాక్యార్థాన్ని స్పష్టంగా ఉంచి, ప్రత్యామ్నాయ పాఠాన్ని పాదటిప్పణిలో సంరక్షిస్తుంది.
- issue: ἐμελέτησαν యొక్క భావ పరిధి
  choice: తలపోశారు
  alternative: కుట్ర పన్నారు
  rationale: శత్రుత్వ సందర్భం ‘కుట్ర పన్నారు’ అనే భావానికి అనుకూలమైనా, క్రియలో ‘ఆలోచించారు/ధ్యానించారు’ అనే నిజమైన సందిగ్ధత ఉంది. ప్రధాన పాఠం దానిని నిలుపుతుంది; సందర్భానుసార ప్రత్యామ్నాయాన్ని పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనా-కీర్తనా సందర్భానికి తగిన గౌరవప్రదమైన శైలి. ‘దావీదు నోటితో’ అనే బైబిలీయ రూపకాన్ని నిలిపి, మిగతా వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా తీర్చిదిద్దాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠంలో ఉన్నాయి.
