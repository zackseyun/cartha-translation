  to: స్వస్థత కలిగించడానికి నీవు నీ చెయ్యి చాపుతుండగా, నీ పరిశుద్ధ సేవకుడైన యేసు[a] నామం ద్వారా సూచకాలూ అద్భుతాలూ జరుగుతాయి.
  rationale: Only the rendering of σημεῖα has been adjusted, from “సూచక క్రియలు” to the more natural and less interpretively expanded “సూచకాలు.” The temporal syntax, healing purpose, signs-and-wonders pairing, agency through Jesus’ name, and the carefully footnoted ambiguity of παῖς are retained.
