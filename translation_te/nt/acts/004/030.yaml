id: ACT.4.30
reference: Acts 4:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν τῷ τὴν χεῖρά ⸀σου ἐκτείνειν σε εἰς ἴασιν καὶ σημεῖα καὶ τέρατα γίνεσθαι διὰ τοῦ ὀνόματος τοῦ ἁγίου παιδός σου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/030.yaml
  text: while you stretch out your hand for healing[a], and signs and wonders are done through the name of your holy servant Jesus.
translation:
  language: te
  text: స్వస్థత కలిగించడానికి నీవు నీ చెయ్యి చాపుతుండగా, నీ పరిశుద్ధ సేవకుడైన యేసు[a] నామం ద్వారా సూచకాలూ అద్భుతాలూ జరుగుతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ పరిశుద్ధ బిడ్డ అయిన యేసు.” గ్రీకు పదమైన παῖς (పైస్)కు “బిడ్డ” లేదా “సేవకుడు” అనే అర్థాలు రావచ్చు. ఇక్కడ యెషయాలోని సేవకుని గురించిన భాష ప్రతిధ్వనిస్తున్నందున “సేవకుడు” అని అనువదించాం.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ ... ἐκτείνειν
  choice: చాపుతుండగా
  rationale: ἐν τῷ + క్రియారూపం సమకాలీన పరిస్థితిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘చాపుతుండగా’ సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: τὴν χεῖρά σου
  choice: నీ చెయ్యి
  rationale: దేవుని కార్యశక్తిని సూచించే మూలభాషా రూపకాన్ని వివరణాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
- source_word: εἰς ἴασιν
  choice: స్వస్థత కలిగించడానికి
  rationale: εἰς + ἴασιν లోని ఉద్దేశ భావాన్నీ, ἴασις లోని స్వస్థత భావాన్నీ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: σημεῖα καὶ τέρατα
  choice: సూచక క్రియలూ అద్భుతాలూ
  rationale: అపొస్తలుల కార్యాలలో తరచుగా కలిసి వచ్చే ఈ పదజోడులో σημεῖον యొక్క ‘సూచన’ భావాన్ని ‘సూచక క్రియ’ నిలుపుతుంది; τέρας ను ‘అద్భుతం’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: γίνεσθαι
  choice: జరుగుతాయి
  rationale: γίνομαι ఇక్కడ సంఘటనలు సంభవించడాన్ని సూచిస్తుంది; ‘జరుగుతాయి’ అనవసరమైన కర్తను చేర్చకుండా ఆ భావాన్ని అందిస్తుంది.
- source_word: διὰ τοῦ ὀνόματος
  choice: నామం ద్వారా
  rationale: διά + షష్ఠీ విభక్తిలోని సాధన లేదా మాధ్యమ భావాన్ని ‘ద్వారా’ నేరుగా నిలుపుతుంది; ‘నామం’లో నిగూఢంగా ఉన్న అధికార భావాన్ని అతిగా వివరించదు.
- source_word: τοῦ ἁγίου παιδός σου Ἰησοῦ
  choice: నీ పరిశుద్ధ సేవకుడైన యేసు
  rationale: παῖς కు ‘బిడ్డ’ లేదా ‘సేవకుడు’ అనే రెండు అర్థాలు సాధ్యమైనా, అపొస్తలుల కార్యాలు 3–4 అధ్యాయాల్లో యెషయా సేవకుని భాషతో ఉన్న సంబంధం వల్ల ‘సేవకుడు’కు ప్రాధాన్యం ఇచ్చాం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: యేసును సూచించే παῖς పదం అనువాదం
  choice: సేవకుడు
  alternative: బిడ్డ
  rationale: παῖς అనే పదంలో నిజమైన ద్వంద్వార్థం ఉంది. ఈ సందర్భంలో యెషయాలోని ప్రభువు సేవకుని ప్రతిధ్వని ‘సేవకుడు’ను బలపరుస్తుంది; అయితే పదానికి సాధ్యమైన ‘బిడ్డ’ అర్థాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. వాక్యం ముందరి ప్రార్థనను కొనసాగిస్తున్నప్పటికీ, అందించిన వచన భాగంలో లేని ఆజ్ఞార్థక క్రియను చేర్చకుండా మూలంలోని సమకాలీన నిర్మాణాన్ని నిలిపాం.
