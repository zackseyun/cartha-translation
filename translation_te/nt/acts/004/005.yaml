  text: Ἐγένετο δὲ ἐπὶ τὴν αὔριον συναχθῆναι αὐτῶν τοὺς ἄρχοντας καὶ ⸀τοὺς πρεσβυτέρους καὶ ⸁τοὺς γραμματεῖς ⸀ἐν Ἰερουσαλήμ
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/005.yaml
  text: And it happened that on the next day their rulers and elders and scribes were gathered together in Jerusalem,[a]
translation:
  language: te
  text: 'మరుసటి రోజు ఇలా జరిగింది: వారి పాలకులు, పెద్దలు, శాస్త్రులు యెరూషలేములో సమావేశమయ్యారు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒకచోట చేర్చబడ్డారు’ లేదా ‘కూడివచ్చారు.’ గ్రీకులో క్రియ కర్మణి రూపంలో ఉంది (‘ఒకచోట చేర్చబడ్డారు’).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: మరుసటి రోజు... సమావేశమయ్యారు
  rationale: గ్రీకు కథన సూత్రం కథను ముందుకు నడిపిస్తుంది. తెలుగులో ‘అప్పుడు ఇలా జరిగింది’ అని విడిగా అనువదించడం భారంగా ఉంటుంది కాబట్టి, సంఘటనను నేరుగా చెప్పే సహజ కథన నిర్మాణంలో దాని భావాన్ని కలిపాం.
- source_word: ἐπὶ τὴν αὔριον
  choice: మరుసటి రోజు
  rationale: తరువాతి రోజును సూచించే ఈ కాలవాచక నుడికారానికి ఇది సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: συναχθῆναι
  choice: సమావేశమయ్యారు
  rationale: అందరూ ఒకచోట కూడిన భావాన్ని సహజంగా తెలియజేస్తుంది. గ్రీకు రూపం కర్మణి ప్రయోగంలో ఉన్నందున ఆ విషయాన్ని పాదటిప్పణిలో సూచించాం.
- source_word: αὐτῶν
  choice: వారి
  rationale: సర్వనామాన్ని నిలుపుతూ, ఈ వచనంలోనే దాని పూర్వపదాన్ని అతిగా నిర్దిష్టం చేయకుండా గ్రీకు సంబంధార్థాన్ని కాపాడుతుంది.
- source_word: τοὺς ἄρχοντας
  choice: పాలకులు
  rationale: ఈ సందర్భంలోని అధికార నాయకులను సూచించే విస్తృతమైన, స్పష్టమైన పదం.
- source_word: τοὺς πρεσβυτέρους
  choice: పెద్దలు
  rationale: ఇక్కడ కేవలం వయోవృద్ధులు కాక, సమాజంలో గుర్తింపు పొందిన నాయకులను సూచిస్తుంది; ‘పెద్దలు’ తెలుగులో ఆ సంస్థాగత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: τοὺς γραμματεῖς
  choice: శాస్త్రులు
  rationale: ధర్మశాస్త్ర పరిజ్ఞానం, ప్రతిలేఖనం, వ్యాఖ్యానం సంబంధిత గుర్తింపు పొందిన వర్గానికి తెలుగు బైబిలు వాడుకలో స్థిరమైన పదం; వారి పాత్రను ‘ధర్మశాస్త్ర బోధకులు’గా విస్తరించి వ్యాఖ్యానించదు.
- source_word: ἐν Ἰερουσαλήμ
  choice: యెరూషలేములో
  rationale: స్థలార్థాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: αὐτῶν అనే సర్వనామానికి పూర్వపదం
  choice: ‘వారి’ అని అనువదించి గ్రీకులోని సంబంధ సర్వనామాన్ని నిలిపాం.
  alternative: సర్వనామాన్ని వదిలేయడం లేదా ‘యూదుల పాలకులు’ అని మరింత నిర్దిష్టంగా చెప్పడం.
  rationale: ఈ వచనంలో పూర్వపదం స్పష్టంగా పేర్కొనబడలేదు. అందువల్ల గ్రీకు పాఠంలోని అనిశ్చితిని నిలుపుతూ, సందర్భానికి మించిన గుర్తింపును చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘శాస్త్రులు’ అనే పదం సంప్రదాయ బైబిలు పరిచయాన్ని నిలుపుతూనే మూలంలోని వర్గపేరును సంక్షిప్తంగా ప్రతిబింబిస్తుంది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠంలో చేర్చబడింది.
