id: ACT.4.11
reference: Acts 4:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ λίθος ὁ ἐξουθενηθεὶς ὑφ’ ὑμῶν τῶν ⸀οἰκοδόμων, ὁ γενόμενος εἰς κεφαλὴν γωνίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/011.yaml
  text: This is the stone that was rejected by you[a], the builders, which has become the cornerstone.
translation:
  language: te
  text: ఇల్లు కట్టేవారైన మీరు తిరస్కరించిన రాయి ఈయనే; ఈయనే మూలరాయిగా[a] మారాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పైభాగపు ముగింపు రాయిగా”; అక్షరార్థంగా, “మూలకు తలరాయిగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: ఈయనే
  rationale: సమీప సందర్భంలో యేసును నొక్కిచెప్పుతూ సూచిస్తుంది; వ్యక్తిని సూచించడానికి సహజమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: λίθος
  choice: రాయి
  rationale: కీర్తన 118:22లోని నిర్మాణ రూపకాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἐξουθενηθεὶς
  choice: తిరస్కరించిన
  rationale: పనికిరానిదిగా లేదా విలువలేనిదిగా ఎంచి పక్కన పెట్టడాన్ని నిర్మాణ రూపకంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὑφ’ ὑμῶν τῶν οἰκοδόμων
  choice: ఇల్లు కట్టే మీరే
  rationale: ‘మీరు’ అనే ప్రత్యక్ష నిందను, ‘కట్టేవారు’ అనే రూపకాన్ని రెండింటినీ నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: ὁ γενόμενος
  choice: మారింది
  rationale: తిరస్కరించబడిన రాయికి విరుద్ధంగా దాని కొత్త గౌరవస్థానాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: κεφαλὴν γωνίας
  choice: మూలకు ప్రధాన రాయి
  rationale: ‘మూలకు శిరస్సు’ అనే మూలభాషా రూపాన్ని అర్థవంతమైన ఆధునిక తెలుగులో అందిస్తూ, ఖచ్చితమైన వాస్తుశిల్ప సంబంధ గుర్తింపును అతిగా నిర్ణయించదు.
theological_decisions:
- issue: కీర్తన 118:22లోని κεφαλὴ γωνίας నిర్మాణ రూపకం
  choice: మూలకు ప్రధాన రాయి
  alternative: మూలరాయి; పై మూలరాయి; అక్షరార్థంగా ‘మూలకు శిరస్సు’
  rationale: యేసును తిరస్కరించబడినా గౌరవస్థానానికి వచ్చిన రాయిగా గుర్తించే రూపకాన్ని నిలుపుతుంది. ఆ రాయి భవనం పునాదిలోని మూలరాయా లేక పైభాగంలోని ముగింపు రాయా అనేది పదబంధం ఒక్కటే ఖచ్చితంగా తేల్చదు; అందువల్ల ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రత్యక్ష నిందలోని బలాన్ని ‘మీరే’తో నిలిపి, వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా మరియు గౌరవప్రదంగా రూపొందించాం.
