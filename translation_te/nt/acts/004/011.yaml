review_pass:
  verdict: revise
  source_fidelity: The draft retains the direct address ('by you'), the builders metaphor, rejection, and the stone's subsequent exalted architectural role. However, 'మూలకు ప్రధాన రాయి' is not idiomatic modern Telugu, and the repeated 'ఆ రాయి' weakens the Greek's emphatic identification of Jesus as the stone.
  naturalness: ‘ఇల్లు కట్టే మీరే’ is understandable but syntactically awkward, since it places the emphatic pronoun where the appositional description of the addressees should stand. ‘ఇల్లు కట్టేవారైన మీరు’ is clear and natural. ‘మూలరాయి’ is the established natural rendering; the architectural ambiguity can be retained in a footnote.
  terminology: Use ‘మూలరాయి’ in the text for the conventional cornerstone sense, while explicitly noting the possible capstone/‘head of the corner’ understanding. ‘తలరాయి’ is included in the note as a more literal representation of κεφαλὴ γωνίας, without asserting a disputed architectural identification.
  issues:
  - severity: medium
    issue: ‘మూలకు ప్రధాన రాయి’ is an unnatural Telugu construction.
    rationale: Although it attempts to represent ‘head of the corner,’ it is not a normal modern Telugu architectural expression and reads awkwardly. ‘మూలరాయి’ is idiomatic and its interpretive limitation can be addressed in a note.
  - severity: low
    issue: ‘ఇల్లు కట్టే మీరే’ has awkward word order and emphasis.
    rationale: The Greek directly addresses ‘you, the builders.’ ‘ఇల్లు కట్టేవారైన మీరు’ preserves both the address and the metaphor more naturally.
  - severity: low
    issue: The second clause’s ‘ఆ రాయి’ weakens the personal, emphatic reference established by ‘ఈయనే.’
    rationale: Using ‘ఈయనే’ again maintains the verse’s direct identification of Jesus while retaining the stone metaphor.
  revised_text: ఇల్లు కట్టేవారైన మీరు తిరస్కరించిన రాయి ఈయనే; ఈయనే మూలరాయిగా[a] మారాడు.
  revised_footnotes:
  - marker: a
    text: లేదా “పైభాగపు ముగింపు రాయిగా”; అక్షరార్థంగా, “మూలకు తలరాయిగా.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the Psalm 118 stone-and-builders imagery, the direct plural accusation, and the emphatic identification in the Greek. It replaces awkward Telugu with standard modern forms and retains the debated architectural sense through a concise footnote rather than making the main text artificially literal or doctrinally specific.
