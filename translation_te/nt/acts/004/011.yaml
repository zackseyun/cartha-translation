revisions:
- from: ఇల్లు కట్టే మీరే తిరస్కరించిన రాయి ఈయనే; ఆ రాయి మూలకు ప్రధాన రాయిగా[a] మారింది.
  to: ఇల్లు కట్టేవారైన మీరు తిరస్కరించిన రాయి ఈయనే; ఈయనే మూలరాయిగా[a] మారాడు.
  rationale: The revision preserves the Psalm 118 stone-and-builders imagery, the direct plural accusation, and the emphatic identification in the Greek. It replaces awkward Telugu with standard modern forms and retains the debated architectural sense through a concise footnote rather than making the main text artificially literal or doctrinally specific.
