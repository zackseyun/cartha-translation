id: ACT.4.10
reference: Acts 4:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γνωστὸν ἔστω πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραὴλ ὅτι ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου, ὃν ὑμεῖς ἐσταυρώσατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, ἐν τούτῳ οὗτος παρέστηκεν ἐνώπιον ὑμῶν ὑγιής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/010.yaml
  text: let it be known to all of you and to all the people of Israel that in the name of Jesus the Messiah the Nazarene[a], whom you crucified[c][b], whom God raised from the dead—by this name this man stands before you healthy.
translation:
  language: te
  text: 'మీ అందరికీ, ఇశ్రాయేలు ప్రజలందరికీ తెలియాలి: మీరు సిలువ వేసి, దేవుడు మృతులలోనుండి లేపిన నజరేతువాడైన మెస్సీయ యేసు నామంలో ఈ మనిషి మీ ఎదుట స్వస్థుడిగా నిలబడి ఉన్నాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωστὸν ἔστω
  choice: ఇది తెలియాలి
  rationale: బహిరంగ ప్రకటనగా ఉన్న గ్రీకు ఆజ్ఞార్థక నిర్మాణపు బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραήλ
  choice: మీ అందరికీ, ఇశ్రాయేలు ప్రజలందరికీ
  rationale: ప్రత్యక్షంగా వింటున్నవారిని, విస్తృత ఇశ్రాయేలు ప్రజలను వేర్వేరు శ్రోతలుగా నిలుపుతుంది.
- source_word: ἐν τῷ ὀνόματι
  choice: నామంలోనే
  rationale: మూలంలోని ‘నామంలో’ అనే భాషను నిలుపుతూ, ‘నే’ ద్వారా స్వస్థతకు సంబంధించిన ప్రభావవంతమైన సాధనాన్ని నొక్కిచెబుతుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: మెస్సీయ యేసు
  rationale: Χριστόςను ఇంటిపేరులా కాక ‘మెస్సీయ’ అనే బిరుదుగా అనువదించి, సహజమైన తెలుగు పదక్రమాన్ని ఉపయోగిస్తుంది.
- source_word: τοῦ Ναζωραίου
  choice: నజరేయుడైన
  rationale: నజరేతుతో యేసుకు ఉన్న గుర్తింపును సంక్షిప్తమైన, గౌరవప్రదమైన తెలుగు రూపంలో తెలియజేస్తుంది.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: మీరు సిలువ వేసిన
  rationale: శ్రోతలపై పేతురు చేసిన ప్రత్యక్ష ఆరోపణను తగ్గించకుండా నిలుపుతుంది.
- source_word: ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν
  choice: దేవుడు మృతులలోనుంచి లేపిన
  rationale: దేవుని కార్యసాధకత్వాన్ని, మృతులలోనుంచి లేపబడటాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐν τούτῳ
  choice: ఆయన ద్వారానే
  rationale: సూచక సర్వనామం ఇప్పుడే పేర్కొన్న యేసును సూచిస్తుందని తీసుకొని, సాధనార్థక భావాన్ని సహజంగా తెలుపుతుంది; ‘ఈ నామం ద్వారానే’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: οὗτος
  choice: ఈ మనిషి
  rationale: సభ ఎదుట ఉన్న స్వస్థపరచబడిన వ్యక్తినే సూచిస్తున్నట్లు తెలుగులో స్పష్టం చేస్తుంది.
- source_word: παρέστηκεν ἐνώπιον ὑμῶν
  choice: మీ ఎదుట నిలబడి ఉన్నాడు
  rationale: గత కార్యం వల్ల ఏర్పడిన ప్రస్తుత స్థితిని తెలిపే గ్రీకు సంపూర్ణకాల భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑγιής
  choice: స్వస్థుడిగా
  rationale: శారీరక ఆరోగ్యం తిరిగి పొందిన స్థితిని సందర్భానుకూలంగా, సాధారణ పాఠకులకు స్పష్టంగా తెలుపుతుంది.
theological_decisions:
- issue: Χριστοῦను బిరుదుగా అనువదించాలా, పేరులో భాగంగా ఉంచాలా
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇశ్రాయేలు నాయకుల ఎదుట యేసు గుర్తింపును ప్రకటిస్తున్న సందర్భంలో బిరుదు భావం సజీవంగా ఉంది; ప్రత్యామ్నాయంగా పేరులాంటి ‘క్రీస్తు’ రూపాన్ని పాదటిప్పణిలో ఉంచింది.
- issue: ἐν τούτῳ దేనిని సూచిస్తుంది
  choice: ఆయన ద్వారానే
  alternative: ఈ నామం ద్వారానే
  rationale: దగ్గరగా పేర్కొన్న యేసునే సూచించే సాధనార్థక భావాన్ని ప్రధాన పాఠ్యంలో ఉంచింది; ‘నామం’ను సూచించే సాధ్యతను నిరాకరించకుండా పాదటిప్పణిలో కాపాడింది.
- issue: పునరుత్థాన వాక్యరూపం
  choice: దేవుడు మృతులలోనుంచి లేపిన
  alternative: దేవుడు చనిపోయినవారిలోనుంచి లేపిన
  rationale: దేవుని కార్యసాధకత్వం మరియు యేసు మృతులలోనుంచి లేపబడిన ప్రకటన రెండింటినీ అదనపు సిద్ధాంత వివరణ లేకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సభ ఎదుట చేసే గంభీరమైన బహిరంగ ప్రకటన ధోరణిని నిలిపాం. వాక్యాన్ని సహజమైన తెలుగు సమాచార క్రమంలో అమర్చినా, ఆరోపణ, దేవుని పునరుత్థాన కార్యం, యేసు నామంతో స్వస్థత అనే మూడు ప్రధాన అంశాలను తగ్గించలేదు. ‘మెస్సీయ,’ ‘ఆయన ద్వారానే,’ ‘స్వస్థుడిగా’ అనే చోట్ల మూలంలోని నిజమైన ప్రత్యామ్నాయ భావాలను పాదటిప్పణుల్లో కాపాడాం.
