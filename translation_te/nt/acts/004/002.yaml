  verdict: revise
  source_fidelity: The causal construction, the two coordinated infinitives, and the deliberately open rendering of ἐν τῷ Ἰησοῦ are retained. ‘ఎంతో కలత చెందారు’ can suggest inward distress more than the Greek’s vexation/irritation; ‘బాగా విసిగిపోయారు’ more directly represents διαπονούμενοι without overstating it. ‘మృతులలోనుండి పునరుత్థానాన్ని’ retains the qualifying force of ἐκ νεκρῶν clearly.
  naturalness: The revised wording is natural modern standard Telugu. The contrast between ‘వీరు’ (the speakers) and ‘వారు’ (the disturbed parties) is retained, while the footnote is recast for smoother Telugu.
