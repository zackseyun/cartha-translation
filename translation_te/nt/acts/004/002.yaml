  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διαπονούμενοι διὰ τὸ διδάσκειν αὐτοὺς τὸν λαὸν καὶ καταγγέλλειν ἐν τῷ Ἰησοῦ τὴν ἀνάστασιν ⸂τὴν ἐκ⸃ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/002.yaml
  text: being greatly disturbed because they were teaching the people and proclaiming in Jesus the resurrection from the dead,[a]
translation:
  language: te
  text: వీరు ప్రజలకు బోధిస్తూ, యేసులో మృతులలోనుండి పునరుత్థానాన్ని ప్రకటిస్తున్నందున వారు బాగా విసిగిపోయారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు విషయంలో మృతులలోనుండి పునరుత్థానాన్ని ప్రకటిస్తూ.” “యేసులో” అనే గ్రీకు పదబంధం, యేసు స్వయంగా మృతులలోనుండి లేవడంలో వ్యక్తమైన పునరుత్థానాన్ని ప్రత్యేకంగా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: διαπονούμενοι
  choice: ఎంతో కలత చెందారు
  rationale: ఈ పదం అధికారుల తీవ్రమైన చికాకు లేదా మనోవేదనను సూచిస్తుంది. ‘ఎంతో కలత చెందారు’ తీవ్రతను తెలియజేస్తూనే అతిగా భావోద్వేగ రంగు పులమదు.
- source_word: διὰ τὸ διδάσκειν
  choice: బోధిస్తూ ... ప్రకటిస్తున్నందుకు
  rationale: διά తో కూడిన articular infinitive కారణాన్ని తెలియజేస్తుంది. తెలుగులో ‘-తున్నందుకు’ నిర్మాణం ఆ కారణ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτοὺς
  choice: వీరు
  rationale: ఈ సర్వనామం మునుపు ప్రస్తావించబడిన పేతురు, యోహానులను సూచిస్తుంది. పేర్లను చేర్చకుండా అన్వయాన్ని నిలుపుకోవడానికి ‘వీరు’ వాడబడింది.
- source_word: τὸν λαὸν
  choice: ప్రజలకు
  rationale: λαός ఇక్కడ సమష్టిగా ప్రజలను సూచిస్తుంది; కేవలం అక్కడున్న గుంపును మాత్రమే కాదు.
- source_word: καταγγέλλειν
  choice: ప్రకటిస్తున్నందుకు
  rationale: ఈ క్రియ బహిరంగంగా తెలియజేయడం లేదా ప్రకటించడం అనే భావాన్ని కలిగిస్తుంది. ‘ప్రకటించడం’ సందర్భానికి తగిన గౌరవప్రదమైన సాధారణ పదం.
- source_word: ἐν τῷ Ἰησοῦ
  choice: యేసులో
  rationale: గ్రీకు పదబంధాన్ని నేరుగా ఉంచడం ద్వారా పునరుత్థానం యేసులో ప్రత్యక్షమైందా, ఆయనను కేంద్రంగా చేసుకున్నదా, లేక ఆయన విషయంలో చూపబడిందా అనే భావసాధ్యతలను ముందుగానే కుదించకుండా నిలుపుతుంది.
- source_word: ἀνάστασιν τὴν ἐκ νεκρῶν
  choice: మృతుల పునరుత్థానాన్ని
  rationale: ἐκ νεκρῶν అంటే మృతులలోనుండి లేవడం. ఆధునిక తెలుగు బైబిలు వాడుకలో ‘మృతుల పునరుత్థానం’ సహజంగా, సంక్షిప్తంగా ఈ భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ἐν τῷ Ἰησοῦ అనే పదబంధానికి పునరుత్థాన ప్రకటనతో ఉన్న సంబంధం
  choice: యేసులో
  alternative: యేసు విషయంలో; యేసు ద్వారా
  rationale: ἐν అనే విభక్త్యర్థక అవ్యయం ఇక్కడ పరస్పరం దగ్గరగా ఉన్న అనేక భావఛాయలకు వీలు కల్పిస్తుంది. ప్రధాన పాఠంలో ‘యేసులో’ అని ఉంచి ఆ తెరచిన భావాన్ని కాపాడగా, పాదసూచికలో ‘యేసు విషయంలో’ అనే సాధ్యతను తెలిపాం.
- issue: ‘మృతుల పునరుత్థానం’ యొక్క పరిధి
  choice: యేసు పునరుత్థానాన్ని మరియు ఆయనలో నిర్ధారించబడిన విస్తృత పునరుత్థాన ఆశను రెండింటినీ అనుమతించే పదప్రయోగం
  alternative: కేవలం యేసు పునరుత్థానం; లేదా కేవలం భవిష్యత్తులోని సాధారణ పునరుత్థానం
  rationale: లూకా వాక్యరచన యేసు లేచిన సంగతిని వెంటనే సూచించగలదే కాక, ఆయనలో ప్రత్యక్షమైన సాధారణ పునరుత్థాన నిరీక్షణను కూడా సూచించగలదు. అనువాదం ఈ రెండింటిలో ఒక్కదానికే భావాన్ని పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘వీరు’ బోధిస్తున్న పేతురు, యోహానులను సూచించగా, ‘వారు’ మునుపటి వచనంలో ప్రస్తావించబడిన అధికారులను సూచిస్తుంది; దీనివల్ల గ్రీకు సర్వనామ అన్వయం పేర్లను అదనంగా చేర్చకుండా స్పష్టమవుతుంది. ‘యేసులో’ కొంత అసాధారణంగా వినిపించినా, మూలంలోని ఉద్దేశపూర్వక భావవిస్తృతిని కాపాడటానికి అలాగే ఉంచబడింది.
