  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀπολυθέντες δὲ ἦλθον πρὸς τοὺς ἰδίους καὶ ἀπήγγειλαν ὅσα πρὸς αὐτοὺς οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/023.yaml
  text: After they were released[a], they went to their own people and reported all that the chief priests and the elders had said to them.
translation:
  language: te
  text: వారు విడుదలైన తర్వాత, తమవారి దగ్గరికి[a] వెళ్లి, ప్రధాన యాజకులూ పెద్దలూ తమతో చెప్పిన విషయాలన్నిటినీ తమవారికి తెలియజేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమ సహచరుల దగ్గరికి’; మరింత అక్షరార్థంగా, ‘తమవారి వద్దకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπολυθέντες
  choice: వారు విడుదలైన తర్వాత
  rationale: ἀπολύω పదానికి చెందిన భూతకాల కర్మణి అసమాపక క్రియ ప్రధాన క్రియకు ముందే జరిగిన చర్యను సూచిస్తుంది. నిర్బంధం నుంచి విడిచిపెట్టబడిన సందర్భాన్ని ‘విడుదలైన తర్వాత’ సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ స్వల్ప అనుసంధాన అవ్యయం. తెలుగు వాక్యంలో ‘విడుదలైన తర్వాత’ అనే కాలసూచక నిర్మాణమే ఆ అనుసంధానాన్ని సహజంగా అందిస్తుంది.
- source_word: ἦλθον
  choice: వెళ్లి
  rationale: ἔρχομαι సందర్భానుసారం ‘వచ్చారు’ లేదా ‘వెళ్లారు’ కావచ్చు. కథన దృష్టికోణం గమ్యస్థానంలో నిలవనందున πρὸς తో కలిసి ఇక్కడ ‘వెళ్లి’ సహజమైన ఎంపిక.
- source_word: πρὸς τοὺς ἰδίους
  choice: తమవారి దగ్గరికి
  rationale: τοὺς ἰδίους అక్షరార్థంగా ‘తమవారు’ అని, వారి సొంత సహచరులు లేదా సమూహాన్ని సూచిస్తుంది. ‘తమవారి దగ్గరికి’ మూలంలోని సంక్షిప్తతనూ సూచనలోని కొంత విస్తృతతనూ నిలుపుతుంది.
- source_word: ἀπήγγειλαν
  choice: తెలియజేశారు
  rationale: ἀπαγγέλλω అందుకున్న సమాచారాన్ని తిరిగి నివేదించడం లేదా తెలియజేయడం అనే భావం కలిగి ఉంది. ఈ సందర్భంలో ‘తెలియజేశారు’ గౌరవప్రదమైన, సహజమైన ఆధునిక తెలుగు.
- source_word: ὅσα
  choice: చెప్పినదంతా
  rationale: ὅσα నివేదించిన విషయమంతటినీ సమగ్రంగా సూచిస్తుంది; ‘-దంతా’ ఆ సంపూర్ణ భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: πρὸς αὐτοὺς
  choice: తమతో
  rationale: λέγω తో πρός + ద్వితీయా విభక్తి సాధారణంగా ఎవరితోనైనా లేదా ఎవరికైనా మాట్లాడడాన్ని సూచిస్తుంది. తెలుగు వాడుకలో ‘తమతో చెప్పిన’ సహజంగా ఉంది; విరోధార్థాన్ని అనవసరంగా చేర్చదు.
- source_word: οἱ ἀρχιερεῖς
  choice: ముఖ్య యాజకులు
  rationale: ఈ బహువచన బిరుదు ప్రధాన యాజక అధికారులను సూచిస్తుంది; అనేక మంది ఏకైక ‘ప్రధాన యాజకులు’ ఉన్నారని సూచించకుండా ‘ముఖ్య యాజకులు’ సంస్థాగత భావాన్ని అందిస్తుంది.
- source_word: οἱ πρεσβύτεροι
  choice: పెద్దలు
  rationale: ఈ సంస్థాగత సందర్భంలో πρεσβύτεροι కేవలం వృద్ధులను కాక గుర్తింపు పొందిన యూదు నాయకులను సూచిస్తుంది. ‘పెద్దలు’ స్థిరమైన, సహజమైన తెలుగు పదం.
- source_word: εἶπαν
  choice: చెప్పిన
  rationale: తెలుగులో సంబంధక కృదంత నిర్మాణం ఆ మాటలు నివేదికకు ముందే చెప్పబడ్డాయని సహజంగానే తెలియజేస్తుంది; ప్రత్యేక పూర్వభూతకాల రూపం అవసరం లేదు.
