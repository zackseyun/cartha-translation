  to: వారు విడుదలైన తర్వాత, తమవారి దగ్గరికి[a] వెళ్లి, ప్రధాన యాజకులూ పెద్దలూ తమతో చెప్పిన విషయాలన్నిటినీ తమవారికి తెలియజేశారు.
