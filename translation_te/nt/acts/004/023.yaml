translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని ‘తమవారు’ అనే ఉద్దేశపూర్వకంగా విస్తృత సూచనను ప్రధాన పాఠంలో నిలిపి, సాధ్యమైన ‘సహచరులు’ అనే వివరణను పాదసూచికలో ఇచ్చాం. పాదసూచిక గుర్తు వాక్యాంతంలో ఉంచబడింది.
