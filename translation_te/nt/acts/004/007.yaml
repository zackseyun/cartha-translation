id: ACT.4.7
reference: Acts 4:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ στήσαντες αὐτοὺς ἐν ⸀τῷ μέσῳ ἐπυνθάνοντο· Ἐν ποίᾳ δυνάμει ἢ ἐν ποίῳ ὀνόματι ἐποιήσατε τοῦτο ὑμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/007.yaml
  text: And after setting them in the midst[a], they began asking, “By what power or in what name did you do this?”
translation:
  language: te
  text: 'వారిని మధ్యలో నిలబెట్టి, వారు ఇలా అడుగుతూ ఉన్నారు[a]: “మీరు ఏ శక్తితో లేదా ఏ నామంలో దీన్ని చేశారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అడగడం మొదలుపెట్టారు” లేదా “అడిగారు.” గ్రీకు ఇంపర్ఫెక్ట్ రూపం విచారణ కొనసాగడాన్ని లేదా అది మొదలవడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσαντες
  choice: నిలబెట్టి
  rationale: అఒరిస్ట్ కృదంతం ప్రశ్నించడానికి ముందు జరిగిన చర్యను సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘నిలబెట్టి’ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: ἐν τῷ μέσῳ
  choice: మధ్యలో
  rationale: గ్రీకు పదబంధంలోని ‘మధ్యలో’ అనే స్థానార్థాన్ని కాపాడుతుంది; ‘వారి ఎదుట’ అని వ్యాఖ్యానాత్మకంగా మార్చదు.
- source_word: ἐπυνθάνοντο
  choice: అడుగుతూ ఉన్నారు
  rationale: ఇంపర్ఫెక్ట్ రూపంలోని కొనసాగుతున్న విచారణ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఆరంభ భావాన్ని తప్పనిసరిగా నిర్ణయించదు.
- source_word: Ἐν ποίᾳ δυνάμει
  choice: ఏ శక్తితో
  rationale: ἐν ఇక్కడ సాధనార్థకంగా ఉంది; δύναμις‌కు నేరమైన సమానార్థం ‘శక్తి.’ ‘అధికారం’ అని అనువదిస్తే భావం ἐξουσία వైపు మారుతుంది.
- source_word: ἢ ἐν ποίῳ ὀνόματι
  choice: లేదా ఏ నామంలో
  rationale: ఎవరి ప్రతినిధిగా లేదా ఎవరి నామాన్ని ఆధారంగా చేసుకొని పనిచేయడమనే బైబిలీయ నుడికారాన్ని కాపాడుతుంది.
- source_word: ἐποιήσατε τοῦτο
  choice: మీరు దీన్ని ... చేశారు
  rationale: అఒరిస్ట్ సూచకరూపాన్ని సాధారణ భూతకాలంగా అందిస్తుంది; ‘ఇది’ దేనిని సూచిస్తుందో వివరణాత్మక పదాలను చేర్చకుండా మూలంలోని విస్తృతతను నిలుపుతుంది.
- source_word: ὑμεῖς
  choice: మీరు
  rationale: గ్రీకులోని స్పష్టమైన కర్త సర్వనామాన్ని తెలుగులో ఉంచి దాని ఉద్ఘాటనను సహజంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: δύναμις‌ను ‘శక్తి’గా అనువదించాలా, ‘అధికారం’గా వ్యాఖ్యానించాలా
  choice: శక్తి
  alternative: అధికారం
  rationale: మూలంలో δύναμις ఉంది; దాని సాధారణ అర్థం ‘శక్తి.’ తరువాతి ‘ఏ నామంలో’ అనే పదబంధం ప్రతినిధిత్వ అధికార భావాన్ని ఇప్పటికే మోస్తుంది. అందువల్ల రెండింటి మధ్య ఉన్న భావభేదాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. న్యాయసభలాంటి విచారణ సందర్భాన్ని ‘మధ్యలో నిలబెట్టి’ కాపాడాం. మూలంలోని ప్రశ్న క్రమం, ‘శక్తి/నామం’ భేదం, ఇంపర్ఫెక్ట్ రూపంలోని అస్పష్టత నిలుపబడ్డాయి.
