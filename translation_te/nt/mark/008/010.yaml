id: MRK.8.10
reference: Mark 8:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐμβὰς εἰς τὸ πλοῖον μετὰ τῶν μαθητῶν αὐτοῦ ἦλθεν εἰς τὰ μέρη Δαλμανουθά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/010.yaml
  text: And immediately[a], getting into the boat with his disciples, he went to the region of Dalmanutha.
translation:
  language: te
  text: వెంటనే ఆయన తన శిష్యులతో కలిసి పడవ ఎక్కి, దల్మనూతా ప్రాంతాలకు[a] వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దల్మనూతా ప్రాంతానికి.’ గ్రీకులో అక్షరార్థంగా ‘దల్మనూతా ప్రాంతాలు/భాగాలు’ అనే బహువచన ప్రయోగం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు కథనంలోని తక్షణత్వాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐμβὰς
  choice: పడవ ఎక్కి
  rationale: ἐμβαίνω క్రియ యొక్క పూర్వకాల అసమాపక క్రియారూపం ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచిస్తుంది; తెలుగులో ‘ఎక్కి’ సహజంగా ఆ క్రమాన్ని నిలుపుతుంది.
- source_word: πλοῖον
  choice: పడవ
  rationale: గలిలయ సముద్ర నేపథ్యానికి ‘పడవ’ సందర్భోచితమైన, సాధారణ తెలుగు పదం.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: తన శిష్యులతో కలిసి
  rationale: μετά + సంబంధ విభక్తి తెలిపే సహవాస భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἦλθεν
  choice: వెళ్లాడు
  rationale: గమ్యస్థానం వైపు కథన చలనాన్ని బాహ్య దృష్టికోణం నుంచి ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τὰ μέρη
  choice: ప్రాంతాలకు
  rationale: గ్రీకు బహువచన రూపాన్ని నిలుపుతూ, ఒక పట్టణం చుట్టుపక్కల ప్రాంతాలు అనే భౌగోళిక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: Δαλμανουθά
  choice: దల్మనూతా
  rationale: స్థలనామాన్ని గ్రీకు ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, చర్యల క్రమం మరియు τὰ μέρη లోని నిజమైన బహువచన భావం నిలుపబడింది.
