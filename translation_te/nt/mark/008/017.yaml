id: MRK.8.17
reference: Mark 8:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀γνοὺς λέγει αὐτοῖς· Τί διαλογίζεσθε ὅτι ἄρτους οὐκ ἔχετε; οὔπω νοεῖτε οὐδὲ συνίετε; ⸀πεπωρωμένην ἔχετε τὴν καρδίαν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/017.yaml
  text: And knowing[a], he says to them[c][b], “Why are you discussing that you have no bread? Do you not yet perceive or understand? Do you have your heart hardened?”
translation:
  language: te
  text: 'ఇది తెలుసుకున్న యేసు వారితో ఇలా అన్నాడు: “మీ దగ్గర రొట్టెలు లేవని మీలో మీరు ఎందుకు చర్చించుకుంటున్నారు? మీరింకా గ్రహించలేదా? అర్థం చేసుకోలేదా? మీ హృదయాలు కఠినమై ఉన్నాయా?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: ఇది తెలుసుకున్న
  rationale: ఈ అసమాపక క్రియ యేసు శిష్యుల చర్చను తెలుసుకున్నాడని సూచిస్తుంది. సందర్భం ద్వారా తెలిసే కర్మను ‘ఇది’ అని సహజమైన తెలుగులో వ్యక్తం చేసింది.
- source_word: διαλογίζεσθε
  choice: మీలో మీరు ... చర్చించుకుంటున్నారు
  rationale: ఈ రూపం పరస్పర ఆలోచన లేదా చర్చ భావాన్ని ఇస్తుంది. శిష్యులు తమలో తాము మాట్లాడుకుంటున్న సందర్భాన్ని ఈ పదబంధం స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἄρτους
  choice: రొట్టెలు
  rationale: గ్రీకు పదం బహువచనంలో ఉంది. తెలుగులో ‘రొట్టెలు’ సహజంగా ఉండడమే కాక మూలంలోని బహువచనాన్ని కూడా నిలుపుతుంది.
- source_word: νοεῖτε
  choice: గ్రహించడంలేదా
  rationale: మనసుతో గుర్తించడం లేదా గ్రహించడం అనే భావాన్ని ఇస్తుంది; వెంట వచ్చే συνίετεతో ఉన్న భావభేదాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: συνίετε
  choice: అర్థం చేసుకోవడంలేదా
  rationale: విషయార్థాన్ని అవగాహన చేసుకోవడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πεπωρωμένην
  choice: కఠినమైపోయిందా
  rationale: పరిపూర్ణ కర్మణి రూపం ఏర్పడిన కఠినత్వం కొనసాగుతున్న స్థితిని సూచిస్తుంది. ‘కఠినమైపోయింది’ ఆ ఫలితస్థితిని తెలియజేస్తూ కర్తను పేర్కొనదు.
- source_word: καρδίαν
  choice: హృదయం
  rationale: ఇక్కడ ‘హృదయం’ భావోద్వేగాలకే కాక అంతరంగ గ్రహింపు, స్పందనలను సూచించే మూల రూపకాన్ని నిలుపుతుంది. గ్రీకులోని ఏకవచనాన్ని కూడా అలాగే ఉంచింది.
theological_decisions:
- issue: శిష్యుల హృదయ స్థితిని తెలిపే చివరి ప్రశ్న
  choice: మీ హృదయం కఠినమైపోయిందా?
  alternative: మీ హృదయాన్ని కఠినమైన స్థితిలో ఉంచుకున్నారా?
  rationale: ἔχετε + కర్మ + కృదంతం అనే గ్రీకు నిర్మాణాన్ని తెలుగులో అక్షరాలా అనుసరిస్తే అసహజంగా ఉండి, శిష్యులే ఉద్దేశపూర్వకంగా హృదయాన్ని కఠినపరచుకున్నారనే అదనపు భావం కలగవచ్చు. ఎంచుకున్న అనువాదం కొనసాగుతున్న కఠిన స్థితిని, మూలంలోని ఏకవచన ‘హృదయం’ రూపకాన్ని, పేర్కొనని కర్తను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ప్రశ్నల వరుసలోని గద్దింపు ధోరణిని నిలిపి, νοεῖτε మరియు συνίετεలను వరుసగా ‘గ్రహించడం,’ ‘అర్థం చేసుకోవడం’గా వేరు చేసింది. మూలంలో స్పష్టంగా లేని కారణం లేదా కర్తను చేర్చలేదు.
