translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని వరుస చర్యలను తెలుగులో రెండు సహజ వాక్యాలుగా ఇచ్చాం; గంపల పరిమాణానికి సంబంధించిన పదభేదాన్ని పాదసూచికలో నిలిపాం.
