  yaml_path: translation/nt/mark/008/008.yaml
  text: And they ate and were satisfied[a], and they picked up seven baskets of leftover pieces.
translation:
  language: te
  text: వారు తిని తృప్తి చెందారు. మిగిలిన ముక్కలతో నిండిన ఏడు గంపలను ఎత్తుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘గంపలు’ అని అనువదించిన గ్రీకు పదం σπυρίδας; ఇది బహుశా పెద్ద గంపలను సూచిస్తుంది. ఐదు వేల మందికి ఆహారం పెట్టిన సందర్భంలో మార్కు వేరొక గ్రీకు పదమైన κόφινοιని ఉపయోగించాడు (6:43).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: తిని
  rationale: ἐσθίω యొక్క సాధారణ కథనార్థాన్ని సహజమైన తెలుగు భూతకాల వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: ἐχορτάσθησαν
  choice: తృప్తి పొందారు
  rationale: కడుపు నిండేంతగా తిన్నారనే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἦραν
  choice: పోగుచేశారు
  rationale: మిగిలిన ముక్కలను ఎత్తి సేకరించిన సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: περισσεύματα κλασμάτων
  choice: మిగిలిపోయిన ముక్కలను
  rationale: భోజనం తరువాత అధికంగా మిగిలిన విరిగిన ఆహారపు ముక్కల భావాన్ని స్పష్టంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: ἑπτὰ σπυρίδας
  choice: ఏడు గంపలలో
  rationale: σπυρίς సూచించే, సాధారణంగా పెద్దదైన బుట్టకు ‘గంప’ సరైన సహజ తెలుగు పదం; సంఖ్యను యథాతథంగా ఉంచుతుంది.
