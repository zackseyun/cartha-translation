revisions:
- from: వారు తిని తృప్తి పొందారు. మిగిలిపోయిన ముక్కలను ఏడు గంపలలో పోగుచేశారు.[a]
  to: వారు తిని తృప్తి చెందారు. మిగిలిన ముక్కలతో నిండిన ఏడు గంపలను ఎత్తుకున్నారు.[a]
  rationale: 'The revision retains the plain narrative sense while restoring the Greek syntax: the disciples picked up seven baskets containing the leftover broken pieces. It also retains the lexical footnote and makes the relevant contrast term explicit.'
