  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀναβλέψας ἔλεγεν· Βλέπω τοὺς ἀνθρώπους ὅτι ὡς δένδρα ὁρῶ περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/024.yaml
  text: And looking up, he said, “I see people, because I see them walking around like trees.”
translation:
  language: te
  text: అతడు పైకి చూసి, “నాకు మనుషులు కనిపిస్తున్నారు; వారు చెట్లలా నడుస్తున్నట్టు నాకు కనిపిస్తున్నారు” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβλέψας
  choice: పైకి చూసి
  rationale: పదానికి సందర్భంలో ‘పైకి చూడడం’ లేదా ‘మళ్లీ చూపు పొందడం’ అనే భావాలు ఉండవచ్చు; చూపు పరీక్షించబడుతున్న దృశ్యానికి సహజంగా సరిపోయే ప్రత్యక్ష అర్థాన్ని ఎంచుకున్నాం.
- source_word: τοὺς ἀνθρώπους
  choice: మనుషులు
  rationale: సాధారణ, లింగసమగ్ర అర్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὅτι
  choice: ;
  rationale: ఇక్కడ రెండవ వాక్యభాగం మొదటి మాటను వివరించే విధంగా ఉంది. కృత్రిమమైన కారణార్థక సంధానాన్ని బలవంతంగా చేర్చకుండా, వివరణాత్మక సంబంధాన్ని విరామచిహ్నంతో నిలిపాం.
- source_word: ὡς δένδρα ... περιπατοῦντας
  choice: వారు చెట్లలా నడుస్తున్నట్టు
  rationale: అస్పష్టమైన చూపులో మనుషులు నడిచే చెట్లలా కనిపిస్తున్నారనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘నడుస్తున్నవారు’ అనేది మనుషులకే అన్వయించబడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గౌరవప్రదమైన ప్రత్యక్ష వాక్యం. మూలంలోని పునరుక్త ‘కనిపిస్తున్నారు/కనిపిస్తున్నారు’ భావాన్ని చూపు ఇంకా అస్పష్టంగా ఉందని తెలియజేయడానికి నిలిపాం.
