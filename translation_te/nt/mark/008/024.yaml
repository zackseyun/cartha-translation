  source_fidelity: 'The Telugu accurately represents the sequence and sense of the Greek: after looking up, the man says that he sees people and describes them as appearing to walk like trees. The repeated perception wording appropriately reflects the two occurrences of βλέπω/ὁρῶ. The semicolon responsibly leaves ὅτι’s precise connective force unforced, rather than adopting the English audit trail’s more interpretive “because.”'
