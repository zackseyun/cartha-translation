source:
  edition: SBLGNT
  text: οἱ δὲ ⸂εἶπαν αὐτῷ λέγοντες⸃ ⸀ὅτι Ἰωάννην τὸν βαπτιστήν, καὶ ἄλλοι Ἠλίαν, ἄλλοι δὲ ⸂ὅτι εἷς⸃ τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/028.yaml
  text: They told him[a], saying, “John the Baptist; and others, Elijah; but others, one of the prophets.”
translation:
  language: te
  text: 'వారు ఆయనకు ఇలా చెప్పారు: “కొందరు బాప్తిస్మమిచ్చే యోహాను అని, మరికొందరు ఏలీయా అని, ఇంకొందరు ప్రవక్తలలో ఒకరు అని అంటున్నారు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: వారు
  rationale: మునుపటి సందర్భంలోని శిష్యులనే సూచించే పునరారంభక కర్త. δέ యొక్క స్వల్ప అనుసంధాన భావాన్ని తెలుగులో ప్రత్యేక పదంతో చూపకపోవడం సహజం.
- source_word: εἶπαν αὐτῷ λέγοντες
  choice: ఆయనతో … అన్నారు
  rationale: ఒకే λέγω ధాతువుతో వచ్చిన క్రియ-కృదంత ద్విరుక్తి గ్రీకులో సాధారణ నివేదన నిర్మాణం. తెలుగులో దాన్ని యథాతథంగా రెండుసార్లు అనువదిస్తే కృత్రిమంగా ఉంటుంది; ప్రత్యక్ష వాక్యంతో ‘అన్నారు’ సహజంగా భావాన్ని అందిస్తుంది.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: బాప్తిస్మమిచ్చే యోహాను
  rationale: βαπτιστής అనే కార్యసూచక బిరుదును ఆధునిక పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; ఏ సంఘశాఖ పేరునూ సూచించదు.
- source_word: ἄλλοι ... ἄλλοι δὲ
  choice: కొందరు … మరికొందరు … ఇంకొందరు
  rationale: వేర్వేరు ప్రజాసమూహాలు వేర్వేరు అభిప్రాయాలు చెప్పిన పంపిణీ భావాన్ని సహజమైన తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: Ἠλίαν
  choice: ఏలీయా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన పేరురూపం.
- source_word: ὅτι εἷς τῶν προφητῶν
  choice: ప్రవక్తల్లో ఒకరు అని
  rationale: గ్రీకులో నిగూఢంగా ఉన్న ‘నీవు’ అనే కర్తను తెలుగులో చేర్చకుండా, సంక్షిప్త గుర్తింపును నిలుపుతుంది.
- source_word: προφητῶν
  choice: ప్రవక్తలు
  rationale: ఇశ్రాయేలు ప్రవక్తలను సూచించే προφήτης పదానికి సహజమైన ప్రామాణిక తెలుగు సమానం.
theological_decisions:
- issue: యేసును గూర్చిన ప్రజల గుర్తింపులను ఎలా నివేదించాలి
  choice: ప్రతి గుర్తింపును ‘అని’తో కూడిన సంక్షిప్త జాబితాగా ఉంచి, చివరలో మాత్రమే ‘అంటున్నారు’ అని స్పష్టం చేయడం
  alternative: ప్రతి భాగంలో ‘నీవు … అని అంటున్నారు’ అని పూర్తిగా విస్తరించడం
  rationale: మూలంలోని సంక్షిప్తతను, ప్రజల్లో ఉన్న విభిన్న అభిప్రాయాల ఉద్వేగాన్ని నిలుపుతూ, తెలుగులో ఎవరు ఏమంటున్నారో స్పష్టంగా చేస్తుంది. నిగూఢమైన ‘నీవు’ను అనవసరంగా పూరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన ‘ఆయన’ రూపం. గ్రీకు నివేదన నిర్మాణాన్ని పదేపదే అనుకరించకుండా సహజమైన ప్రత్యక్ష వాక్యంగా మలిచాం. ‘బాప్తిస్మమిచ్చే యోహాను’ కార్యసూచకంగా, సామాన్య పాఠకునికి స్పష్టంగా ఉంది.
