id: MRK.8.4
reference: Mark 8:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀπεκρίθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ὅτι Πόθεν τούτους δυνήσεταί τις ὧδε χορτάσαι ἄρτων ἐπ’ ἐρημίας;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/004.yaml
  text: And his disciples answered him[a], “From where will anyone be able to satisfy these people with bread here in a desolate place?”
translation:
  language: te
  text: అందుకు ఆయన శిష్యులు ఆయనతో, “ఈ నిర్మానుష్య ప్రదేశంలో ఈ ప్రజలకు రొట్టెలతో తృప్తిగా తినిపించడానికి ఎక్కడి నుంచి ఎవరైనా సమర్థులవుతారు?” అని జవాబిచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ అరణ్య ప్రదేశంలో ఈ ప్రజలకు రొట్టెలు పెట్టి తృప్తిపరచడానికి ఎవరు సమర్థులు అవుతారు?”
    reason: Πόθεν అనే ‘ఎక్కడి నుంచి’ ప్రశ్నను సందర్భంలో ‘ఎలా/ఎవరి వల్ల’ అనే సామర్థ్యప్రశ్నగా కూడా సహజంగా వ్యక్తం చేయవచ్చు; χορτάσαιకు ‘తృప్తిపరచడం’ మరింత సన్నిహిత ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: జవాబిచ్చారు
  rationale: కథన సందర్భంలోని సాధారణ ప్రతిస్పందన క్రియను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὅτι
  choice: ప్రత్యక్ష ఉక్తిని సూచించే ఉద్ధరణ చిహ్నాలు
  rationale: మాట్లాడే క్రియ తరువాత ὅτι ప్రత్యక్ష ఉక్తిని పరిచయం చేస్తోంది; తెలుగులో ప్రత్యేక పదం కంటే ఉద్ధరణ చిహ్నాలు సహజం.
- source_word: Πόθεν
  choice: ఎక్కడి నుంచి
  rationale: సమకూర్పు ఏ మూలం నుంచి వస్తుందనే ప్రశ్నను నేరుగా నిలుపుతుంది; ‘ఎలా’ అని వ్యాఖ్యానాత్మకంగా మార్చదు.
- source_word: τούτους
  choice: ఈ ప్రజలకు
  rationale: సర్వనామం జనసమూహాన్ని సూచిస్తోంది; లింగపరంగా అనవసరంగా పరిమితం చేయకుండా తెలుగులో సూచ్యార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: δυνήσεταί τις
  choice: ఎవరికైనా ... దొరుకుతాయి
  rationale: భవిష్యత్ సామర్థ్య భావాన్ని తెలుగులో సహజమైన అలంకారప్రశ్నగా వ్యక్తం చేస్తుంది; అక్షరార్థంగా ‘ఎవరు సమర్థులు అవుతారు’ అనడం కంటే సందర్భానుకూలం.
- source_word: ὧδε
  choice: ఈ ... ప్రదేశంలో
  rationale: ‘ఇక్కడ’ అనే స్థానిక భావాన్ని తరువాతి ప్రదేశపదబంధంతో సహజంగా ఏకీకరిస్తుంది.
- source_word: χορτάσαι
  choice: తృప్తిగా తినిపించడానికి
  rationale: కేవలం ఆహారం ఇవ్వడం కాక, కడుపు నిండేంతగా పోషించడమనే భావాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: ἄρτων
  choice: రొట్టెలు
  rationale: ἄρτος యొక్క ఆహారార్థాన్ని నేరుగా అందిస్తుంది; సందర్భంలో జనసమూహానికి కావలసిన పరిమాణాన్ని సహజంగా సూచిస్తుంది.
- source_word: ἐπ’ ἐρημίας
  choice: నిర్మానుష్య ప్రదేశంలో
  rationale: జనం నివసించని, ఆహారం సులభంగా దొరకని ప్రదేశాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
