translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. ప్రధాన పాఠం మూలంలోని ‘ఎక్కడి నుంచి’ అనే ప్రశ్నను నిలుపుతూ, χορτάσαι యొక్క కడుపు నిండేంతగా తినిపించే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది. పాదసూచిక గుర్తు ప్రధాన పాఠంలో ఉంచబడింది.
