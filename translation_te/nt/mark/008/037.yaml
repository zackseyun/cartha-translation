source:
  edition: SBLGNT
  text: ⸂τί γὰρ⸃ ⸀δοῖ ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/037.yaml
  text: For what can a man give in exchange for his life?[a]
translation:
  language: te
  text: ఎందుకంటే, ఒక మనిషి తన ప్రాణానికి బదులుగా ఏమి ఇవ్వగలడు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన ఆత్మకు”; గ్రీకు పదం సందర్భానుసారం “ప్రాణం,” “జీవితం,” “తాను,” లేదా “ఆత్మ” అని అర్థమివ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: ఎందుకంటే ... ఏమి
  rationale: τί ప్రశ్నను సూచిస్తుండగా, γάρ ముందటి వాక్యంతో వివరణాత్మక సంబంధాన్ని కలుపుతుంది. తెలుగులో సహజంగా ఈ రెండింటినీ ‘ఎందుకంటే ... ఏమి’ ద్వారా వ్యక్తం చేశాం.
- source_word: δοῖ
  choice: ఇవ్వగలడు
  rationale: δίδωμι క్రియ యొక్క ఈ సంభావ్య/ఆలోచనాత్మక ప్రశ్నారూపం, వాస్తవంగా ఇవ్వగల ప్రత్యామ్నాయం ఏదైనా ఉందా అనే అలంకారిక ప్రశ్నను సూచిస్తుంది. ‘ఇవ్వగలడు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἄνθρωπος
  choice: ఒక మనిషి
  rationale: ἄνθρωπος ఇక్కడ ఏ ఒక్క వ్యక్తికైనా ప్రాతినిధ్యం వహించే ఏకవచన రూపం. ‘ఒక మనిషి’ మూలరూపాన్ని నిలుపుతూ తెలుగులో సాధారణ మానవుని సూచిస్తుంది.
- source_word: ἀντάλλαγμα
  choice: బదులుగా
  rationale: ఈ పదం ప్రతిగా లేదా మార్పిడిగా ఇచ్చేదాన్ని సూచిస్తుంది. ‘ఇవ్వు’ క్రియతో ‘బదులుగా’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: τῆς ψυχῆς αὐτοῦ
  choice: తన ప్రాణానికి
  rationale: ψυχή సందర్భానుసారం ప్రాణం, జీవితం, స్వయం, లేదా ఆత్మ అనే భావాలను కలిగి ఉంటుంది. మార్కు 8:35–37లో కోల్పోయే జీవితం/మొత్తం వ్యక్తిత్వం అనే పొరలుగల భావానికి ‘ప్రాణం’ సహజంగా సరిపోతుంది; ‘ఆత్మ’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: రక్షణసంబంధ సందర్భంలో ψυχή పదం అనువాదం
  choice: ప్రాణం
  alternative: ఆత్మ; జీవితం; స్వయం
  rationale: ఈ సందర్భం లోకమంతా సంపాదించడాన్ని ψυχή కోల్పోవడంతో పోలుస్తుంది. ‘ప్రాణం’ భౌతిక జీవితానికే పరిమితం కాకుండా వ్యక్తి ఉనికిని కూడా సూచించగల సహజ తెలుగు పదం. అయినప్పటికీ మూలపదంలోని ‘ఆత్మ’ మరియు ‘స్వయం’ భావసాధ్యతలను పాదటిప్పణి ద్వారా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. ముందటి వాక్యంతో గల γάρ సంబంధాన్ని ‘ఎందుకంటే’ ద్వారా స్పష్టంగా ఉంచి, అలంకారిక ప్రశ్న యొక్క బలాన్ని నిలిపాం.
