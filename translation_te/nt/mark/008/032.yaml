source:
  edition: SBLGNT
  text: καὶ παρρησίᾳ τὸν λόγον ἐλάλει. καὶ προσλαβόμενος ⸂ὁ Πέτρος αὐτὸν⸃ ἤρξατο ἐπιτιμᾶν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/032.yaml
  text: And he was speaking the word openly[a]. And Peter took him aside and began to rebuke him.
translation:
  language: te
  text: ఆయన ఆ మాటను స్పష్టంగా[a] చెబుతూ ఉన్నాడు. మరియు పేతురు ఆయనను పక్కకు తీసుకొని, ఆయనను గద్దించడం మొదలుపెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బహిరంగంగా’ లేదా ‘ధైర్యంగా.’ గ్రీకు పదం దాపరికం లేకుండా, సూటిగా మాట్లాడడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: బహిరంగంగా
  rationale: ఈ పదం దాపరికం లేకుండా, స్పష్టంగా మాట్లాడడాన్ని సూచిస్తుంది. సందర్భంలో యేసు తన మాటను దాచకుండా చెప్పాడనే భావాన్ని ‘బహిరంగంగా’ సహజంగా తెలియజేస్తుంది; ‘స్పష్టంగా’ మరియు ‘ధైర్యంగా’ కూడా సాధ్యమైన భావ ఛాయలు.
- source_word: τὸν λόγον
  choice: ఆ మాటను
  rationale: ఇది ముందటి వచనంలో యేసు చెప్పిన శ్రమలు, మరణం, పునరుత్థానం గురించిన ప్రకటనను తిరిగి సూచిస్తుంది. తెలుగులో ‘ఆ మాటను’ సహజంగా ఉండి, గ్రీకు పదబంధంలోని ఏకవచన సూచనను నిలుపుతుంది.
- source_word: ἐλάλει
  choice: చెబుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న చర్యను సూచిస్తుంది. ‘చెప్పాడు’ కంటే ‘చెబుతూ ఉన్నాడు’ ఆ ప్రగతిశీల భావాన్ని మెరుగుగా నిలుపుతుంది.
- source_word: προσλαβόμενος
  choice: పక్కకు తీసుకెళ్లి
  rationale: సందర్భంలో పేతురు యేసును ప్రత్యేకంగా పక్కకు తీసుకొని మాట్లాడిన భావం ఉంది. తెలుగు వాడుకలో ‘పక్కకు తీసుకెళ్లి’ సహజంగా, సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἤρξατο ἐπιτιμᾶν
  choice: గద్దించడం మొదలుపెట్టాడు
  rationale: ἤρξατο తో కూడిన క్రియారూపం చర్య ప్రారంభాన్ని స్పష్టంగా సూచిస్తుంది. ‘మొదలుపెట్టాడు’ దానిని నిలుపుతుంది; ‘గద్దించడం’ తీవ్రమైన మందలింపు భావాన్ని సహజ ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: యేసు తన శ్రమల ప్రకటనను παρρησίᾳ చెప్పిన విధానం
  choice: బహిరంగంగా
  alternative: స్పష్టంగా; ధైర్యంగా
  rationale: ప్రధాన భావం దాపరికం లేకుండా సూటిగా చెప్పడం. ‘బహిరంగంగా’ ఆ స్వేచ్ఛాయుత, దాచిపెట్టని మాటను ముందుకు తెస్తుంది; పేతురు ప్రతిస్పందనకు కారణమైన స్పష్టతను నిలుపుతూ అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: పేతురు యేసుపట్ల చేసిన చర్య యొక్క తీవ్రత
  choice: ఆయనను గద్దించడం
  alternative: ఆయనను మందలించడం; ఆయనను హెచ్చరించడం
  rationale: ἐπιτιμάω బలమైన అభ్యంతరం లేదా మందలింపును సూచిస్తుంది. ‘గద్దించడం’ పేతురు యేసును తీవ్రంగా సరిదిద్దడానికి ప్రయత్నించిన కథన ఉద్రిక్తతను నిలుపుతుంది; ‘హెచ్చరించడం’ బలహీనంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథన శైలిలో అనువదించబడింది. కొనసాగుతున్న చర్యకు ‘చెబుతూ ఉన్నాడు,’ కథన క్రమానికి ‘అప్పుడు,’ తీవ్రమైన మందలింపుకు ‘గద్దించడం’ వాడబడ్డాయి.
