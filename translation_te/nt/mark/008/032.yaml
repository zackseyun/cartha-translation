  to: ఆయన ఆ మాటను స్పష్టంగా[a] చెబుతూ ఉన్నాడు. మరియు పేతురు ఆయనను పక్కకు తీసుకొని, ఆయనను గద్దించడం మొదలుపెట్టాడు.
