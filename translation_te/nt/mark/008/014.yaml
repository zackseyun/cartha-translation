- from: వారు రొట్టెలు తీసుకురావడం మరిచిపోయారు[a]. పడవలో తమతో ఉన్న ఒక్క రొట్టె తప్ప, వారి దగ్గర మరే రొట్టె లేదు.
  to: వారు రొట్టెలు తీసుకురావడం మరిచిపోయారు[a]. పడవలో వారి దగ్గర ఒక్క రొట్టె తప్ప మరే రొట్టెలూ లేవు.
