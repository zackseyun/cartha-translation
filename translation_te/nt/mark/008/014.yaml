id: MRK.8.14
reference: Mark 8:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐπελάθοντο λαβεῖν ἄρτους, καὶ εἰ μὴ ἕνα ἄρτον οὐκ εἶχον μεθ’ ἑαυτῶν ἐν τῷ πλοίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/014.yaml
  text: And they had forgotten to take bread[a], and except for one loaf they had no bread with them in the boat.
translation:
  language: te
  text: వారు రొట్టెలు తీసుకురావడం మరిచిపోయారు[a]. పడవలో వారి దగ్గర ఒక్క రొట్టె తప్ప మరే రొట్టెలూ లేవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, “రొట్టెలను తీసుకురావడం మరిచిపోయారు.” బహువచనమైన ἄρτους విడివిడిగా ఉన్న రొట్టెలను లేదా సాధారణంగా రొట్టె సరఫరాను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπελάθοντο
  choice: మరిచిపోయారు
  rationale: అఒరిస్ట్ రూపం శిష్యులు రొట్టెలు తీసుకురావడం మరిచిన గత సంఘటనను తెలియజేస్తుంది; తెలుగు కథనంలో ఈ రూపం సహజంగా ఉంటుంది.
- source_word: λαβεῖν
  choice: తీసుకురావడం
  rationale: ప్రయాణంలో తమ వెంట రొట్టెలను తెచ్చుకోవడం అనే సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἄρτους
  choice: రొట్టెలు
  rationale: గ్రీకు బహువచనాన్ని నిలుపుతూ, ఆహారంగా తీసుకువచ్చే రొట్టెలను సూచిస్తుంది; సాధారణ ‘ఆహారం’గా విస్తరించలేదు.
- source_word: εἰ μὴ ἕνα ἄρτον
  choice: ఒక్క రొట్టె తప్ప
  rationale: εἰ μή ఇక్కడ షరతును కాక మినహాయింపును సూచిస్తుంది; ἕνα ἄρτον యొక్క ఏకవచన, సంఖ్యార్థాన్ని కాపాడుతుంది.
- source_word: οὐκ εἶχον
  choice: మరే రొట్టె లేదు
  rationale: మినహాయింపు నిర్మాణంతో కలిపి, ఒక్క రొట్టె కాక మరొకటి లేదనే భావాన్ని స్పష్టమైన తెలుగులో అందిస్తుంది.
- source_word: μεθ’ ἑαυτῶν
  choice: తమతో
  rationale: రిఫ్లెక్సివ్ భావాన్ని సహజంగా వ్యక్తం చేసి, అది శిష్యుల వెంట ఉన్నదని తెలుపుతుంది.
- source_word: ἐν τῷ πλοίῳ
  choice: పడవలో
  rationale: ἐν యొక్క స్థలార్థాన్ని నేరుగా, సహజంగా అందిస్తుంది.
