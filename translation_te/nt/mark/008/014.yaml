translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మొదటి వాక్యంలో గ్రీకు బహువచనం నిలుపబడింది; రెండవ వాక్యంలో ఒక్క రొట్టె మాత్రమే ఉందనే మినహాయింపు నిర్మాణం స్పష్టంగా వ్యక్తమైంది.
