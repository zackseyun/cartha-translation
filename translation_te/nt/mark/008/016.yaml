  text: And they were discussing with one another that they had no bread[a].
translation:
  language: te
  text: తమ దగ్గర రొట్టెలు లేవని వారు ఒకరితో ఒకరు చర్చించుకుంటూ ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελογίζοντο
  choice: చర్చించుకుంటూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న పరస్పర చర్చను సూచిస్తుంది. ఈ తెలుగు ప్రయోగం ఆ కొనసాగింపు భావాన్నీ సహజమైన శైలినీ నిలుపుతుంది.
- source_word: πρὸς ἀλλήλους
  choice: తమలో తాము
  rationale: ఇది పరస్పర సంభాషణను సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: ὅτι
  choice: అని
  rationale: ఇక్కడ ὅτι కారణాన్ని కాకుండా చర్చలోని విషయాన్ని పరిచయం చేస్తుంది; ప్రత్యక్ష ఉల్లేఖనానికి సమానమైన సహజ తెలుగు నిర్మాణంలో ‘అని’ దానిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἄρτους
  choice: రొట్టెలు
  rationale: గ్రీకు పదం బహువచనంలో లెక్కించదగిన రొట్టెలను సూచిస్తుంది. సమీప సందర్భంలో రొట్టెల సంఖ్య ప్రాధాన్యం కలిగినందున తెలుగులో బహువచనాన్ని నిలిపాం.
- source_word: οὐκ ἔχουσιν
  choice: మన దగ్గర ... లేవు
  rationale: గ్రీకులోని వర్తమానకాల రూపం చర్చలోని మాటల విషయంగా ఉంది. తెలుగులో ప్రత్యక్ష ఉల్లేఖన రూపం సహజంగా ఉండడంతో వర్తమాన స్థితిని ‘లేవు’గా నిలిపి, కర్తను సందర్భానుగుణంగా ‘మన’గా వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ప్రధాన పాఠ్యంలో ప్రత్యక్ష ఉల్లేఖనం తెలుగు పాఠకులకు స్పష్టతనిస్తుంది; పాదటిప్పణిలో మూలంలోని పరోక్ష వచన నిర్మాణాన్ని భద్రపరిచాం.
