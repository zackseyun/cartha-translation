  text: Having eyes[a], do you not see? And having ears, do you not hear? And do you not remember?
translation:
  language: te
  text: కళ్లు ఉండి కూడా మీరు చూడటం లేదా? చెవులు ఉండి కూడా మీరు వినటం లేదా? మీకు గుర్తు లేదా?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀφθαλμοὺς ἔχοντες
  choice: కళ్లు ఉండి కూడా
  rationale: గ్రీకు కృదంత నిర్మాణంలోని భావసూచక విరుద్ధతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. ‘కళ్లు కలిగి’ అనేది మరింత రూపానుగతమైనదైనా ఇక్కడ అసహజంగా ఉంటుంది.
- source_word: βλέπετε
  choice: మీరు చూడటం లేదా
  rationale: మూలంలోని సాధారణ దృష్టి క్రియను నిలుపుతుంది; సందర్భం సూచించే ‘గ్రహించడం’ అనే రూపకాలంకార భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టీకరించదు.
- source_word: ὦτα ἔχοντες
  choice: చెవులు ఉండి కూడా
  rationale: మొదటి కృదంత పదబంధానికి సమాంతరతను, గద్దింపుతో కూడిన ప్రశ్న ధోరణిని నిలుపుతుంది.
- source_word: ἀκούετε
  choice: మీరు వినటం లేదా
  rationale: గ్రీకు క్రియ యొక్క ప్రాథమిక అర్థమైన ‘వినడం’ను ఉంచి, ‘అర్థం చేసుకోవడం’ లేదా ‘పట్టించుకోవడం’ అనే సందర్భసిద్ధ భావాన్ని పాఠకుడికి తెరిచి ఉంచుతుంది.
- source_word: μνημονεύετε
  choice: మీకు గుర్తు లేదా
  rationale: ‘మీరు జ్ఞాపకం చేసుకోవడం లేదా?’ కంటే ఇది సహజమైన ఆధునిక తెలుగు; గతంలో జరిగినదాన్ని గుర్తుంచుకోలేకపోవడంపై ఉన్న గద్దింపును స్పష్టంగా తెలియజేస్తుంది.
- source_word: καὶ
  choice: మరి
  rationale: చివరి ప్రశ్నను ముందున్న రెండు ప్రశ్నలకు జోడిస్తూ, తెలుగులో సహజమైన సంచిత ప్రశ్నా ధోరణిని ఇస్తుంది.
- source_word: οὐ / οὐκ
  choice: లేదా
  rationale: ప్రతికూల అలంకార ప్రశ్నలను తెలుగులో సహజంగా నిర్మిస్తుంది.
theological_decisions:
- issue: చూడటం, వినటం అనే క్రియల ప్రత్యక్ష ఇంద్రియార్థమా లేక రూపకాలంకార గ్రహణార్థమా
  choice: ప్రధాన పాఠ్యంలో ‘చూడటం’, ‘వినటం’ అనే ప్రత్యక్ష క్రియలనే ఉంచి, ఆత్మీయ మందబుద్ధి భావాన్ని సందర్భం సూచించనివ్వడం.
  alternative: ‘గ్రహించడం’, ‘అర్థం చేసుకోవడం’ అని రూపకాలంకార భావాన్ని నేరుగా చెప్పడం.
  rationale: ఈ మాటలు ప్రవచన గ్రంథాల్లోని ఆత్మీయ స్పందనలేమిని ప్రతిధ్వనింపజేయవచ్చు; అయినా గ్రీకు పాఠ్యం సాధారణ ఇంద్రియ క్రియలనే ఉపయోగిస్తుంది. వాటిని నిలపడం వాక్యంలోని అలంకారిక, అంతర్గ్రంథ సంబంధిత ఉద్వేగాన్ని అతివ్యాఖ్యానం చేయకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన గద్దింపు ధోరణి. ‘ఉండి కూడా’ ద్వారా గ్రీకు కృదంతాల విరుద్ధార్థక బలం వ్యక్తమవుతుంది; మూడు ప్రశ్నల సమాంతర నిర్మాణం సాధ్యమైనంతవరకు నిలుపబడింది.
