  yaml_path: translation/nt/mark/008/003.yaml
  text: And if I send them away hungry to their homes[a], they will collapse on the way, and some of them have come from far away.
translation:
  language: te
  text: వారిని ఆకలితో వారి ఇళ్లకు పంపివేస్తే, దారిలో నీరసించి పడిపోతారు[a]. వారిలో కొందరు చాలా దూరం నుండి వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దారిలో సొమ్మసిల్లిపోతారు.’ గ్రీకు క్రియ బలహీనపడడం లేదా పూర్తిగా నీరసించిపోవడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσω
  choice: పంపివేస్తే
  rationale: ఈ సందర్భంలో జనసమూహాన్ని వెళ్లనివ్వడం అనే భావం; బంధవిముక్తి వంటి అసంబద్ధ అర్థాలను రానివ్వకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: νήστεις
  choice: ఆకలితోనే
  rationale: ఇక్కడ ఉద్దేశపూర్వక మతపరమైన ఉపవాసం కంటే ఆహారం లేక ఆకలితో ఉన్న స్థితినే సూచిస్తుంది.
- source_word: εἰς οἶκον αὐτῶν
  choice: వారి ఇళ్లకు
  rationale: ప్రతి ఒక్కరూ తమ తమ ఇంటికి వెళ్లే విభజనాత్మక భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐκλυθήσονται
  choice: నీరసించి పడిపోతారు
  rationale: బలహీనమై పూర్తిగా సొమ్మసిల్లే స్థాయిని తెలియజేస్తుంది; కేవలం అలసట కంటే సందర్భంలోని తీవ్రతను నిలుపుతుంది.
- source_word: ἐν τῇ ὁδῷ
  choice: దారిలో
  rationale: ప్రయాణమధ్యంలో అనే భావానికి సరళమైన, సహజమైన తెలుగు.
- source_word: καί τινες αὐτῶν
  choice: వారిలో కొందరు
  rationale: జనసమూహంలోని కొందరిని స్పష్టంగా సూచిస్తుంది; గ్రీకు వాక్యంలోని సమన్వయ భావం తెలుగులో కొత్త వాక్యంగా సహజంగా కొనసాగుతుంది.
- source_word: ἀπὸ μακρόθεν
  choice: చాలా దూరం నుండి
  rationale: వారు ప్రయాణించి వచ్చిన దూరాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἥκασιν
  choice: వచ్చారు
  rationale: వారు దూరం నుండి వచ్చి ప్రస్తుతం అక్కడ ఉన్నారనే ఫలితస్థితి సందర్భం ద్వారా స్పష్టమవుతుంది; తెలుగులో సహజంగా ఉంటుంది.
