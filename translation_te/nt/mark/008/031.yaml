review_pass:
  verdict: revise
  source_fidelity: The draft retains all major elements of the Greek, including the necessity expressed by δεῖ and the temporal wording μετὰ τρεῖς ἡμέρας as “మూడు రోజుల తర్వాత.” However, its mixed infinitival construction makes the rejection clause unnecessarily active (“పెద్దలు ... తిరస్కరించడం”), whereas Greek presents the Son of Man as receiving this action. A consistently passive Telugu construction represents the source more clearly.
  naturalness: The current long nominalized sentence is understandable but stiff. Introducing the teaching content with “ఇలా” and using finite/passive verbal forms produces more natural modern standard Telugu while retaining the linked scope of “must.”
  terminology: “మనుష్యకుమారుడు,” “ప్రధాన యాజకులు,” and “శాస్త్రులు” are appropriate established renderings. “పెద్దలు” is acceptable in context for the leadership group. “తిరిగి లేవడం” appropriately reflects the intransitive ἀναστῆναι without changing it to a passive ‘be raised.’
  issues:
  - severity: medium
    issue: The rejection is phrased as an active action by the leaders within an otherwise nominalized list.
    rationale: 'ἀποδοκιμασθῆναι is passive: the Son of Man is to be rejected by the elders, chief priests, and scribes. Although the draft’s meaning is recoverable, a passive Telugu expression better preserves the grammatical perspective and reads more smoothly.'
  - severity: low
    issue: 'The title is written as two separate words: “మనుష్య కుమారుడు.”'
    rationale: “మనుష్యకుమారుడు” is the more established and visually clear Telugu form for the Gospel title, distinguishing it from an ordinary descriptive noun phrase.
  revised_text: మనుష్యకుమారుడు అనేక బాధలు అనుభవించి, పెద్దలచేత, ప్రధాన యాజకులచేత, శాస్త్రులచేత తిరస్కరించబడి, చంపబడి, మూడు రోజుల తర్వాత[a] తిరిగి లేవడం తప్పనిసరి అని ఆయన వారికి బోధించడం మొదలుపెట్టాడు.
