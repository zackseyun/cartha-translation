id: MRK.8.31
reference: Mark 8:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο διδάσκειν αὐτοὺς ὅτι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ⸀ὑπὸ τῶν πρεσβυτέρων καὶ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ ἀποκτανθῆναι καὶ μετὰ τρεῖς ἡμέρας ἀναστῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/031.yaml
  text: And he began to teach them that the Son of Man must suffer many things[a], and be rejected by the elders and the chief priests and the scribes, and be killed, and after three days rise again.
translation:
  language: te
  text: మనుష్యకుమారుడు అనేక బాధలు అనుభవించి, పెద్దలచేత, ప్రధాన యాజకులచేత, శాస్త్రులచేత తిరస్కరించబడి, చంపబడి, మూడు రోజుల తర్వాత[a] తిరిగి లేవడం తప్పనిసరి అని ఆయన వారికి బోధించడం మొదలుపెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకు పాఠంలో ‘మూడు రోజుల తర్వాత’ అని ఉంది; కొన్ని అనువాద సంప్రదాయాలు దీనిని ‘మూడవ రోజున’ అని ఇస్తాయి.
    reason: మార్కు ఉపయోగించిన కాలవ్యక్తీకరణను ఇతర సమాంతర వాక్యాలతో సమన్వయపరచకుండా స్పష్టపరచడం.
lexical_decisions:
- source_word: ἤρξατο διδάσκειν
  choice: బోధించడం మొదలుపెట్టాడు
  rationale: ἄρχομαιతో కూడిన వర్తమాన క్రియార్థక రూపంలోని ఆరంభ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: δεῖ
  choice: తప్పనిసరి
  rationale: బాధలు, తిరస్కారం, మరణం, తిరిగి లేవడం అన్నిటికీ వర్తించే బలమైన ఆవశ్యకతను నిలుపుతుంది; ఆ ఆవశ్యకత ఎలా ఏర్పడిందో వాక్యంలో అదనంగా నిర్ధారించదు.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: సువార్తల్లోని బిరుదును, దాని అంతర్గ్రంథ ప్రతిధ్వనులను కాపాడే స్థిరమైన తెలుగు అనువాదం.
- source_word: πολλὰ παθεῖν
  choice: అనేక బాధలు అనుభవించడం
  rationale: πολλά సూచించే బాధల విస్తృతిని స్పష్టంగా ఉంచుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: ἀποδοκιμασθῆναι
  choice: తిరస్కరించడం
  rationale: అధికార నాయకులు పరిశీలించి నిరాకరించే భావాన్ని సందర్భానికి తగిన సూటి పదంతో తెలియజేస్తుంది; తెలుగు వాక్య నిర్మాణం కోసం కర్తృప్రయోగంగా అమర్చినా, యేసు తిరస్కారానికి గురవుతాడనే మూల భావం మారదు.
- source_word: ὑπὸ τῶν πρεσβυτέρων
  choice: పెద్దలు
  rationale: ఇక్కడ సాధారణంగా వృద్ధులను కాక యూదుల గుర్తింపు పొందిన నాయకవర్గాన్ని సూచించే సంప్రదాయ చారిత్రక పదం.
- source_word: τῶν ἀρχιερέων
  choice: ప్రధాన యాజకులు
  rationale: ఒకే ప్రధాన యాజకుని పదవిని కాక ప్రధాన యాజకవర్గాన్ని సూచించే బహువచనానికి సరిపోతుంది.
- source_word: τῶν γραμματέων
  choice: శాస్త్రులు
  rationale: యూదుల ధర్మశాస్త్ర నిపుణుల చారిత్రక వర్గాన్ని సూచించే స్థిరమైన తెలుగు పదం.
- source_word: ἀποκτανθῆναι
  choice: చంపబడడం
  rationale: మూలంలోని కర్మణి క్రియను సూటిగా, బరువును తగ్గించకుండా వ్యక్తపరుస్తుంది.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: మూడు రోజుల తర్వాత
  rationale: μετάతో కూడిన ద్వితీయా విభక్తి పదబంధపు సాధారణ అర్థమైన ‘తర్వాత’ను కాపాడి, సమాంతర వాక్యాలతో ‘మూడవ రోజున’ అని సమన్వయపరచదు.
- source_word: ἀναστῆναι
  choice: తిరిగి లేవడం
  rationale: అకర్మక క్రియారూపాన్ని కాపాడుతుంది; మరణం నుంచి లేవడాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేయడానికి ‘తిరిగి’ ఉపయోగించబడింది.
theological_decisions:
- issue: δεῖతో వ్యక్తమైన బాధానుభవ ఆవశ్యకత
  choice: తప్పనిసరి
  alternative: అవసరం
  rationale: దైవ ప్రణాళికకు సంబంధించిన బలమైన ఆవశ్యకతను నిలుపుతుంది; అయితే దాని విధానాన్ని లేదా సిద్ధాంతపరమైన కారణాన్ని అనువాదంలో అదనంగా వివరించదు.
- issue: μετὰ τρεῖς ἡμέρας అనే కాలవ్యక్తీకరణ
  choice: మూడు రోజుల తర్వాత
  alternative: మూడవ రోజున
  rationale: మార్కు గ్రీకు పాఠంలోని స్వంత మాటను అనువదిస్తుంది; ఇతర సువార్తలలోని రూపంతో నిశ్శబ్దంగా సమన్వయపరచదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. వరుస గ్రీకు కర్మణి క్రియార్థక రూపాలను తెలుగులో సులభంగా గ్రహించేందుకు మిశ్రమ కర్తృ–కర్మణి నిర్మాణంలో అమర్చినా, ప్రతి సంఘటన మరియు వాటన్నిటిపై ఉన్న ఆవశ్యకత యథాతథంగా ఉంచబడ్డాయి. పాదసూచిక గుర్తు సంబంధిత కాలపదబంధం వెంట ఉంచబడింది.
