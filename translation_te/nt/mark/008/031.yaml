revisions:
- from: మనుష్య కుమారుడు అనేక బాధలు అనుభవించడం, పెద్దలు, ప్రధాన యాజకులు, శాస్త్రులు ఆయనను తిరస్కరించడం, ఆయన చంపబడడం, మూడు రోజుల తర్వాత[a] తిరిగి లేవడం తప్పనిసరి అని ఆయన వారికి బోధించడం మొదలుపెట్టాడు.
