review_pass:
  verdict: revise
  source_fidelity: The prohibition is rendered faithfully, and the textual-variant footnote correctly keeps the longer reading out of the main text. However, ‘తన ఇంటికి’ normally refers back to the grammatical subject (‘ఆయన’) in Telugu and can therefore suggest Jesus’ own home, whereas αὐτοῦ refers to the man who was sent. ‘పంపిస్తూ’ also gives an unnecessary progressive sense for the aorist ἀπέστειλεν.
  naturalness: The draft is generally clear and appropriately dignified. Recasting the clause with ‘పంపి’ is more idiomatic Telugu narrative style, and ‘ప్రవేశించవద్దు’ explicitly conveys εἰσέλθῃς (‘enter’).
  terminology: ‘గ్రామం’ appropriately renders κώμη, and ‘అసలు’ suitably conveys the emphatic force of μηδέ in natural modern Telugu. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: Ambiguous possessive in ‘తన ఇంటికి’
    rationale: In this Telugu sentence, reflexive ‘తన’ most naturally refers to the subject, ‘ఆయన,’ rather than to the object, ‘అతన్ని.’ The Greek αὐτοῦ here identifies the healed man’s home. ‘అతని ఇంటికి’ removes the ambiguity.
  - severity: low
    issue: Aspectual awkwardness in ‘పంపిస్తూ’
    rationale: ἀπέστειλεν is an aorist main verb, not a progressive action. Telugu ‘పంపి ... చెప్పాడు’ naturally represents the narrative sequence while preserving the accompanying speech.
  revised_text: ఆయన అతన్ని అతని ఇంటికి పంపి, “ఆ గ్రామంలోకి అసలు ప్రవేశించవద్దు” అని చెప్పాడు.[a]
  revised_footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో, “గ్రామంలో ఎవరికీ చెప్పవద్దు” అనే మాటలు అదనంగా ఉన్నాయి.
    reason: textual_variant
  revision_rationale: The revision clarifies that the destination is the man’s own home, avoids an unintended progressive nuance, and retains both the emphatic prohibition and the source-text distinction from the longer manuscript reading.
