revisions:
- from: ఆయన అతన్ని తన ఇంటికి పంపిస్తూ, “ఆ గ్రామంలోకి అసలు వెళ్లవద్దు” అని చెప్పాడు.[a]
  to: ఆయన అతన్ని అతని ఇంటికి పంపి, “ఆ గ్రామంలోకి అసలు ప్రవేశించవద్దు” అని చెప్పాడు.[a]
  rationale: The revision clarifies that the destination is the man’s own home, avoids an unintended progressive nuance, and retains both the emphatic prohibition and the source-text distinction from the longer manuscript reading.
  reviewer_model: gpt-5.6-terra
