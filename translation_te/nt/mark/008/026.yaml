source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν αὐτὸν ⸀εἰς οἶκον αὐτοῦ λέγων· Μηδὲ εἰς τὴν κώμην ⸀εἰσέλθῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/026.yaml
  text: And he sent him to his home[a], saying, “Do not even enter the village.”
translation:
  language: te
  text: ఆయన అతన్ని అతని ఇంటికి పంపి, “ఆ గ్రామంలోకి అసలు ప్రవేశించవద్దు” అని చెప్పాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో, “గ్రామంలో ఎవరికీ చెప్పవద్దు” అనే మాటలు అదనంగా ఉన్నాయి.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: పంపిస్తూ
  rationale: ఇక్కడ యేసు ఆ వ్యక్తిని అక్కడి నుంచి తన ఇంటికి పంపించిన భావం ఉంది. తెలుగు వాక్యంలో λέγωνతో సహజంగా అనుసంధానించడానికి ‘పంపిస్తూ’ అని అనువదించాం.
- source_word: εἰς οἶκον αὐτοῦ
  choice: తన ఇంటికి
  rationale: గ్రీకు పదబంధం అతని స్వంత నివాసాన్ని గమ్యస్థానంగా సూచిస్తుంది; ఆధునిక తెలుగులో ‘తన ఇంటికి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: λέγων
  choice: అని చెప్పాడు
  rationale: ప్రధాన క్రియతో అనుసంధానమైన మాటను తెలుగులో సహజ కథనశైలిలో వ్యక్తపరుస్తుంది.
- source_word: Μηδὲ
  choice: అసలు ... వద్దు
  rationale: μηδέలోని బలమైన నిషేధ భావాన్ని కేవలం ‘వద్దు’ కంటే ‘అసలు ... వద్దు’ సహజంగా తెలియజేస్తుంది.
- source_word: κώμην
  choice: గ్రామం
  rationale: κώμη సాధారణంగా చిన్న జనావాసాన్ని సూచిస్తుంది; ‘గ్రామం’ దానికి ప్రత్యక్షమైన ఆధునిక తెలుగు సమానం.
- source_word: εἰσέλθῃς
  choice: వెళ్లవద్దు
  rationale: εἰς‌తో కూడిన εἰσέρχομαι ఇక్కడ ‘లోపలికి వెళ్లడం/ప్రవేశించడం’ అనే భావాన్ని ఇస్తుంది. ‘గ్రామంలోకి వెళ్లవద్దు’ సాధారణ పాఠకులకు సహజమైన నిషేధ వాక్యం.
theological_decisions:
- issue: గ్రామానికి సంబంధించిన యేసు నిషేధం యొక్క పరిధి
  choice: గ్రామంలోకి వెళ్లవద్దనే ఆజ్ఞను మాత్రమే ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: కొన్ని ప్రతుల్లో ఉన్నట్లుగా గ్రామంలో ఎవరికీ చెప్పవద్దనే అదనపు ఆజ్ఞను ప్రధాన పాఠ్యంలో చేర్చడం
  rationale: SBLGNT ప్రధాన పాఠ్యంలో గ్రామంలోకి ప్రవేశించవద్దనే నిషేధం మాత్రమే ఉంది. ఉద్దేశాన్ని ఊహించకుండా, విస్తృత ప్రతుల పాఠాన్ని ప్రధాన వాక్యంలో కలపకుండా మూలపాఠాన్ని అనుసరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథనశైలిలో అనువదించాం. బలమైన నిషేధాన్ని ‘అసలు ... వద్దు’తో వ్యక్తపరిచాం.
