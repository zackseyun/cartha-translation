id: MRK.8.22
reference: Mark 8:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ⸀ἔρχονται εἰς Βηθσαϊδάν. καὶ φέρουσιν αὐτῷ τυφλὸν καὶ παρακαλοῦσιν αὐτὸν ἵνα αὐτοῦ ἅψηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/022.yaml
  text: And they came to Bethsaida. And they brought a blind man to him and begged him to touch him.
translation:
  language: te
  text: వారు బేత్సయిదాకు వచ్చారు. వారు ఒక అంధుడైన మనిషిని ఆయన దగ్గరికి తీసుకువచ్చి, ఆయన అతనిని తాకాలని వేడుకున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: వచ్చారు
  rationale: గ్రీకులో ఇది కథన వర్తమాన కాలమైనా, సహజమైన తెలుగు కథనశైలిలో భూతకాలం సంఘటనల క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἰς Βηθσαϊδάν
  choice: బేత్సయిదాకు
  rationale: స్థలనామంతో εἰς సూచించే గమ్యాన్ని తెలుగులో ‘-కు’ సహజంగా వ్యక్తం చేస్తుంది; స్థలనామం లిప్యంతరీకరించబడింది.
- source_word: φέρουσιν
  choice: తీసుకొచ్చి
  rationale: కథన వర్తమానాన్ని సహజమైన తెలుగు భూతకాల కథనంగా మార్చాం. ‘మోసుకొచ్చి’ అనడం తీసుకొచ్చిన విధానాన్ని అనవసరంగా నిర్దిష్టం చేస్తుంది.
- source_word: τυφλὸν
  choice: ఒక గుడ్డివాణ్ణి
  rationale: ఇది పుంలింగ ఏకవచనంలో వ్యక్తిని సూచించే నామవాచకార్థ విశేషణం. ఈ సందర్భంలో ‘ఒక గుడ్డివాణ్ణి’ సహజంగా, అర్థనిష్ఠగా ఉంది.
- source_word: παρακαλοῦσιν
  choice: వేడుకున్నారు
  rationale: ఇక్కడ సాధారణంగా అడగడం కంటే గాఢమైన విన్నపం ఉంది; ‘వేడుకున్నారు’ ఆ భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἵνα αὐτοῦ ἅψηται
  choice: అతణ్ణి ముట్టుకోవాలని
  rationale: ἵνα తో కూడిన ఉపవాక్యం విన్నపంలోని విషయాన్ని తెలియజేస్తుంది. ‘ముట్టుకోవాలని’ అనే నిర్మాణం తెలుగులో సహజంగా ఉండి, ἅπτομαι యొక్క ‘ముట్టు’ అర్థాన్ని నిలుపుతుంది.
- source_word: καὶ
  choice: వారు … వచ్చారు; అక్కడ కొందరు … తీసుకొచ్చి
  rationale: మార్కు వాడిన అనుసంధాన కథన ప్రవాహాన్ని నిలుపుతూ, తెలుగు సహజత్వం కోసం మొదటి καί ను ప్రత్యేకంగా అనువదించలేదు; రెండవదాని అనుసంధాన భావాన్ని ‘అక్కడ’ మరియు క్రియానుసంధానం ద్వారా వ్యక్తం చేశాం.
