translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథనశైలి. గ్రీకు బహువచన క్రియల్లో కర్త స్పష్టంగా లేకపోవడంతో, రెండవ వాక్యంలో సహజమైన తెలుగు కోసం ‘కొందరు’ ఉపయోగించబడింది; ఇది నిర్దిష్ట వ్యక్తులను గుర్తించదు.
