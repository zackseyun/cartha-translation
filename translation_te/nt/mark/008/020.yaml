id: MRK.8.20
reference: Mark 8:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτε ⸀καὶ τοὺς ἑπτὰ εἰς τοὺς τετρακισχιλίους, πόσων σπυρίδων πληρώματα κλασμάτων ἤρατε; ⸂καὶ λέγουσιν αὐτῷ⸃· Ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/020.yaml
  text: And when the seven were for the four thousand[a], how many large baskets full of broken pieces did you pick up? They said to him, “Seven.”
translation:
  language: te
  text: నాలుగు వేల మందికి ఆ ఏడు రొట్టెలు పంచినప్పుడు, విరిగిన ముక్కలతో నిండిన పెద్ద గంపలు ఎన్ని సేకరించారు?[a] అని అడిగాడు. వారు ఆయనకు, “ఏడు” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘పెద్ద గంపలు’గా అనువదించిన గ్రీకు పదం σπυρίς. మార్కు 8:19లో వాడిన చిన్న బుట్టను సూచించే పదానికి ఇది భిన్నమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε καὶ
  choice: పంచినప్పుడు
  rationale: ముందటి అద్భుతంతో యేసు చేస్తున్న పోలికలోని రెండవ సందర్భాన్ని సహజమైన తెలుగు కాలవాచక నిర్మాణంతో తెలియజేస్తుంది; καὶ యొక్క అనుసంధాన భావం పరిసర సందర్భంలో స్పష్టంగా ఉంది.
- source_word: τοὺς ἑπτὰ
  choice: ఆ ఏడు రొట్టెలు
  rationale: గ్రీకులో ‘ఏడు’ మాత్రమే ఉన్నప్పటికీ, అది మార్కు 8:5–6లోని ఏడు రొట్టెలను సూచిస్తుంది. తెలుగులో సహజంగా, స్పష్టంగా ఉండేందుకు సూచనాత్మకమైన ‘ఆ’తో ‘రొట్టెలు’ను పూరించాం.
- source_word: εἰς τοὺς τετρακισχιλίους
  choice: నాలుగు వేల మందికి
  rationale: εἰς ఇక్కడ ఆహారం అందుకున్న సమూహంతో సంబంధం లేదా వారి ప్రయోజనాన్ని సూచిస్తుంది; ‘మందికి’ సహజమైన తెలుగు ప్రయోగం.
- source_word: πόσων σπυρίδων
  choice: పెద్ద గంపలు ఎన్ని
  rationale: σπυρίς పెద్ద గంపను సూచిస్తుంది; 8:19లోని κόφινος అనే చిన్న బుట్టకు వాడిన పదంతో ఉన్న భేదాన్ని ‘పెద్ద గంపలు’ నిలుపుతుంది.
- source_word: πληρώματα κλασμάτων
  choice: మిగిలిన ముక్కలతో నిండిన
  rationale: ‘ముక్కలతో నిండిన’ πληρώματα మరియు κλασμάτων భావాలను స్పష్టంగా తెలియజేస్తుంది; భోజనం తరువాత సేకరించినవి కావడం వల్ల ‘మిగిలిన’ సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἤρατε
  choice: ఎత్తారు
  rationale: αἴρω యొక్క ప్రాథమిక ‘ఎత్తడం/తీసుకోవడం’ భావాన్ని సంక్షిప్తంగా నిలుపుతూ, మిగిలిన ముక్కల గంపలను సేకరించిన సందర్భానికి సరిపోతుంది.
- source_word: καὶ λέγουσιν αὐτῷ
  choice: వారు ఆయనతో ... అన్నారు
  rationale: గ్రీకు కథన వర్తమాన కాలాన్ని సహజమైన తెలుగు కథన భూతకాలంలో అందించాం; αὐτῷను ‘ఆయనతో’గా వ్యక్తం చేశాం.
- source_word: Ἑπτά
  choice: ఏడు
  rationale: యేసు ప్రశ్నకు నేరుగా ఇచ్చిన సంఖ్యాత్మక జవాబు.
