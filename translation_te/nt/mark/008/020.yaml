translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నోత్తర శైలిని వాడాం. గ్రీకు వాక్యంలోని ‘ఆ ఏడు’ అనే సంక్షిప్త సూచన తెలుగులో సందిగ్ధంగా ఉండకూడదని ‘ఆ ఏడు రొట్టెలు’గా స్పష్టం చేశాం; పెద్ద గంప/చిన్న బుట్ట అనే పదభేదాన్ని పాఠ్యంలోనూ పాదటిప్పణిలోనూ నిలిపాం.
