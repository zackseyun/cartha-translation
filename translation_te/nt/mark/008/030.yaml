source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτοῖς ἵνα μηδενὶ λέγωσιν περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/030.yaml
  text: And he warned them to tell no one about him[a].
translation:
  language: te
  text: తన గురించి ఎవరికీ చెప్పవద్దని ఆయన వారిని గట్టిగా హెచ్చరించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన వారిని గద్దించాడు”; లేదా, “ఆయన వారికి కఠినంగా ఆజ్ఞాపించాడు.”
    reason: ἐπιτιμάω అనే గ్రీకు క్రియకు సందర్భానుసారం ‘గద్దించు,’ ‘గట్టిగా హెచ్చరించు,’ లేదా ‘కఠినంగా ఆజ్ఞాపించు’ అనే భావాలు ఉండవచ్చు.
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: గట్టిగా హెచ్చరించాడు
  rationale: ఈ క్రియకు సాధారణంగా ‘గద్దించు’ అనే భావం ఉన్నప్పటికీ, ఇక్కడ శిష్యులు తన గుర్తింపును వెల్లడించకూడదని యేసు బలంగా ఆదేశిస్తున్న సందర్భం. ‘గట్టిగా హెచ్చరించాడు’ ఆ నిషేధంలోని తీవ్రతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: αὐτοῖς
  choice: వారిని
  rationale: సమీప సందర్భంలో యేసు సంబోధించిన శిష్యులను సూచించే బహువచన సర్వనామం.
- source_word: ἵνα
  choice: చెప్పవద్దని
  rationale: ఆజ్ఞ లేదా హెచ్చరికను అనుసరించే ἵνα ఉపవాక్యాన్ని తెలుగులో ఉద్ధరణార్థక ‘అని’ నిర్మాణంతో సహజంగా వ్యక్తం చేశాం.
- source_word: μηδενὶ
  choice: ఎవరికీ ... వద్దు
  rationale: μηδείς యొక్క చతుర్థీ ఏకవచన రూపం ఇక్కడ ‘ఎవరికీ కాదు’ అనే సంపూర్ణ నిషేధాన్ని సూచిస్తుంది.
- source_word: λέγωσιν
  choice: చెప్పవద్దని
  rationale: μηδενί అనే పరోక్ష కర్మతో, περὶ αὐτοῦ అనే విషయ సూచనతో కలిసి λέγω ఇక్కడ ‘చెప్పు’ అనే అర్థంలో సహజంగా ఉంటుంది.
- source_word: περὶ αὐτοῦ
  choice: తన గురించి
  rationale: περί + షష్ఠీ ‘గురించి’ అనే అర్థాన్ని ఇస్తుంది. αὐτοῦ యేసునే సూచిస్తుండటంతో తెలుగు పరోక్ష వాక్య నిర్మాణంలో ‘తన గురించి’ సహజంగా, స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: యేసు ఆజ్ఞలోని తీవ్రత మరియు తన గుర్తింపును రహస్యంగా ఉంచాలనే సందర్భం
  choice: తన గురించి ఎవరికీ చెప్పవద్దని ఆయన వారిని గట్టిగా హెచ్చరించాడు
  alternative: ఆయన వారిని గద్దించి, తన గురించి ఎవరికీ చెప్పవద్దని ఆదేశించాడు
  rationale: వచనం వెల్లడింపును బలంగా నిషేధిస్తుంది; అయితే దానికి కారణమైన విస్తృతమైన దైవశాస్త్ర సిద్ధాంతాన్ని అనువాదంలో చొప్పించదు. ‘గట్టిగా హెచ్చరించాడు’ ఆజ్ఞ తీవ్రతను కాపాడుతూ, ‘గద్దించాడు’ వల్ల కలగగల తప్పుచేసినందుకు మందలింపు అనే అధిక భావాన్ని ప్రధాన పాఠ్యంలో నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని బలమైన నిషేధాన్ని ‘గట్టిగా’ మరియు ‘చెప్పవద్దని’ ద్వారా నిలిపి, క్రియలోని నిజమైన పదార్థ వైవిధ్యాన్ని పాదటిప్పణిలో భద్రపరిచాం.
