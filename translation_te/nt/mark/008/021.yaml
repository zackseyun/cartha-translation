id: MRK.8.21
reference: Mark 8:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· ⸀Οὔπω συνίετε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/021.yaml
  text: And he was saying to them[a], “Do you not yet understand?”
translation:
  language: te
  text: ఆయన వారితో, “మీకు ఇంకా అర్థం కావడం లేదా?”[a] అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు ఇంకా గ్రహించలేదా?”
    reason: συνίετε అనే పదానికి ‘అర్థం కావడం’తో పాటు ‘గ్రహించడం’ అనే సహజ ప్రత్యామ్నాయ అనువాదం ఉంది; οὔπωతో కలిపినప్పుడు తెలుగులో భూతకాల రూపం కూడా ఇదే కొనసాగుతున్న భావాన్ని వ్యక్తపరచగలదు.
lexical_decisions:
- source_word: καὶ
  choice: ప్రత్యేక పదంగా అనువదించకుండా వాక్య అనుసంధానంలో వ్యక్తపరచడం
  rationale: గ్రీకులో ఇది సాధారణ కథన అనుసంధాన పదం. తెలుగులో ఇక్కడ ‘మరియు’ అని పెట్టడం అసహజంగా ఉంటుంది; ముందటి సందర్భంతో అనుసంధానం వాక్య క్రమంలోనే స్పష్టంగా ఉంది. ‘అప్పుడు’ అని అనువదిస్తే మూలంలో లేని స్పష్టమైన కాలార్థం చేరవచ్చు.
- source_word: ἔλεγεν
  choice: అని అన్నాడు
  rationale: ఇది λέγω అనే క్రియ యొక్క అసంపూర్ణ భూతకాల రూపం. సందర్భంలో ప్రశ్నను పరిచయం చేసే సహజ తెలుగు ప్రయోగంగా ‘అని అన్నాడు’ ఎంచుకున్నాం; ‘అంటూ ఉన్నాడు’ రూపం గ్రీకు క్రియాంశాన్ని మరింత స్పష్టంగా చూపినా, ఈ ఒక్క ప్రశ్నలో తెలుగులో అనవసరంగా కొనసాగింపు లేదా పునరుక్తిని సూచించవచ్చు.
- source_word: αὐτοῖς
  choice: వారితో
  rationale: మూలంలో నామవాచకం లేకుండా బహువచన సర్వనామమే ఉంది. అందువల్ల సందర్భంలోని వ్యక్తులను ‘శిష్యులు’ అని పాఠ్యంలో చేర్చకుండా ‘వారితో’ అని నేరుగా అనువదించాం.
- source_word: Οὔπω
  choice: ఇంకా … లేదా
  rationale: οὔπω అంటే ‘ఇంకా కాదు/ఇప్పటికీ కాదు.’ తెలుగు ప్రశ్నలో ‘ఇంకా … లేదా?’ అనే నిర్మాణం ఆ కొనసాగుతున్న లోపాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: συνίετε
  choice: మీకు … అర్థం కావడం
  rationale: συνίημι ఇక్కడ మానసికంగా గ్రహించడం, అర్థం చేసుకోవడం అనే భావాన్ని ఇస్తుంది. సాధారణ ఆధునిక తెలుగులో ‘మీకు అర్థం కావడం’ స్పష్టంగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: ప్రశ్నకు ‘ఇది’ లేదా ‘దీనిని’ అనే కర్మను చేర్చాలా?
  choice: 'కర్మను చెప్పకుండా ఉంచడం: ‘మీకు ఇంకా అర్థం కావడం లేదా?’'
  alternative: ‘ఇది మీకు ఇంకా అర్థం కావడం లేదా?’
  rationale: గ్రీకు పాఠ్యంలో ప్రశ్నకు కర్మ స్పష్టంగా లేదు. దానిని చేర్చితే యేసు ప్రశ్న యొక్క విస్తృత, బహిరంగ ప్రయోగాన్ని అనవసరంగా ఒక నిర్దిష్ట విషయానికి పరిమితం చేసినట్లు అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘గ్రహించడం’ కంటే ప్రధాన పాఠ్యంలో మరింత సాధారణమైన ‘అర్థం కావడం’ వాడబడింది; మూలంలో లేని ‘శిష్యులు’ లేదా ‘ఇది’ చేర్చలేదు.
