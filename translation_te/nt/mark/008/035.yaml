id: MRK.8.35
reference: Mark 8:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ⸂ψυχὴν αὐτοῦ⸃ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ⸀ἀπολέσει τὴν ⸄ψυχὴν αὐτοῦ⸅ ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου ⸀σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/035.yaml
  text: For whoever wants to save his life will lose it[b][a], but whoever loses his life for my sake and for the gospel will save it.
translation:
  language: te
  text: ఎందుకంటే, తన ప్రాణాన్ని[a] కాపాడుకోవాలని కోరుకునేవాడు దాన్ని పోగొట్టుకుంటాడు; అయితే నా నిమిత్తమూ సువార్త నిమిత్తమూ తన ప్రాణాన్ని పోగొట్టుకునేవాడు దాన్ని కాపాడుకుంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘ప్రాణం’గా అనువదించిన గ్రీకు పదం సందర్భాన్ని బట్టి ‘జీవితం,’ ‘వ్యక్తి’ లేదా ‘ఆత్మ’ అనే భావాలను కూడా సూచించగలదు; ఈ వచనమంతటా ఇదే పదం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψυχή
  choice: ప్రాణం
  rationale: ఈ సందర్భంలో ఈ పదం ఒక వ్యక్తి జీవాన్ని లేదా జీవనాన్నే ప్రధానంగా సూచిస్తుంది. ‘ప్రాణం’ అనే తెలుగు పదం జీవితం–వ్యక్తి అనే విస్తృత భావాన్ని సహజంగా మోస్తూ, దాన్ని కాపాడుకోవడం మరియు పోగొట్టుకోవడం మధ్యనున్న వైరుధ్యాన్ని నిలుపుతుంది.
- source_word: σῶσαι / σώσει
  choice: కాపాడుకోవడం / కాపాడుకుంటాడు
  rationale: ప్రాణాన్ని కాపాడుకోవడం అనే సహజ తెలుగు ప్రయోగం సందర్భానికి సరిపోతుంది; రెండు చోట్ల ఒకే పదమూలాన్ని వాడడం ద్వారా వాక్యంలోని వైరుధ్యాత్మక సమాంతరత నిలుస్తుంది.
- source_word: ἀπολέσει
  choice: పోగొట్టుకుంటాడు
  rationale: ψυχήతో కలిసినప్పుడు ‘కోల్పోవడం’ అనే భావమే సందర్భానుకూలం. ఆత్మనాశనం వంటి మరింత సంకుచితమైన అర్థాన్ని అనవసరంగా చేర్చకుండా ఇది వాక్యంలోని పదవైరుధ్యాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου
  choice: నా నిమిత్తమూ సువార్త నిమిత్తమూ
  rationale: ἕνεκεν తెలిపే కారణం లేదా ఉద్దేశాన్ని రెండు సమన్విత అంశాలకూ స్పష్టంగా వర్తింపజేస్తూ, తెలుగులో సహజమైన గౌరవప్రదమైన నిర్మాణాన్ని ఇస్తుంది.
- source_word: εὐαγγέλιον
  choice: సువార్త
  rationale: మార్కు రచనలో కీలకమైన ఈ పదానికి ‘సువార్త’ స్థిరపడిన, సంక్షిప్తమైన, ఆధునిక తెలుగు సమానార్థకం.
- source_word: ὃς ... ὃς
  choice: కోరుకునేవాడు ... పోగొట్టుకునేవాడు
  rationale: గ్రీకు సంబంధవాచక నిర్మాణంలోని సాధారణ, ఎవరైనా వర్తించే భావాన్ని తెలుగులో సహజమైన క్రియాజన్య నామరూపాలతో వ్యక్తం చేస్తుంది.
- source_word: θέλῃ
  choice: కాపాడుకోవాలని కోరుకునే
  rationale: చర్య చేయాలనే సంకల్పాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘ఆశించు’ వంటి కొంత భిన్నమైన భావఛాయను నివారిస్తుంది.
- source_word: αὐτοῦ / αὐτήν
  choice: తన / దాన్ని
  rationale: ఒకే వ్యక్తిని సూచించే ప్రతిబింబ సంబంధాన్ని ‘తన’ సహజంగా చూపుతుంది; ‘దాన్ని’ ముందున్న ‘ప్రాణం’ను తిరిగి సూచిస్తుంది.
theological_decisions:
- issue: ψυχή పదంలోని మానవశాస్త్ర సంబంధ భావపరిధి
  choice: ప్రధాన పాఠ్యంలో ‘ప్రాణం’
  alternative: ‘ఆత్మ’ లేదా ‘జీవితం’
  rationale: సందర్భం శిష్యత్వం కోసం జీవాన్ని కాపాడుకోవడం లేదా కోల్పోవడం గురించిన వైరుధ్యోక్తి. ‘ఆత్మ’ అని అనువదిస్తే పదాన్ని శరీరానికి భిన్నమైన అమూర్త భాగానికే పరిమితం చేసే ప్రమాదం ఉంది; ‘జీవితం’ సాధ్యమైనప్పటికీ, ‘ప్రాణం’ జీవం మరియు వ్యక్తి అనే విస్తృత ప్రతిధ్వనిని నిలుపుతుంది.
- issue: సార్వత్రికంగా వర్తించే ఏకవచన వ్యక్తి సూచన
  choice: ‘తన ... వాడు’ అనే ఏకవచన సాధారణ నిర్మాణం
  alternative: బహువచన లేదా లింగరహిత పునర్నిర్మాణం
  rationale: గ్రీకు వాక్యంలోని ఏకవచన, సామాన్య వర్తనను తెలుగులో సహజంగా ఉంచుతుంది. ఇది బోధ ఎవరికి వర్తిస్తుందో పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వినిపించే, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘కాపాడుకోవడం—పోగొట్టుకోవడం’ అనే పునరావృత పదజంట ద్వారా మూలంలోని వైరుధ్యోక్తిని స్పష్టంగా నిలిపాం; ‘నా నిమిత్తమూ సువార్త నిమిత్తమూ’ అనే నిర్మాణం రెండు కారణాలనూ సమానంగా వ్యక్తం చేస్తుంది.
