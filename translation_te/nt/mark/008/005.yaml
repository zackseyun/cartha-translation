  text: καὶ ⸀ἠρώτα αὐτούς· Πόσους ἔχετε ἄρτους; οἱ δὲ εἶπαν· Ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/005.yaml
  text: And he asked them, “How many loaves do you have?” They said, “Seven.”
translation:
  language: te
  text: ఆయన వారిని, “మీ దగ్గర ఎన్ని రొట్టెలు ఉన్నాయి?” అని అడిగాడు. వారు, “ఏడు” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: అప్పుడు
  rationale: మార్కు కథనంలోని సరళ అనుసంధానాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; సందర్భానికి మించిన బలమైన కాలార్థాన్ని చేర్చదు.
- source_word: ἠρώτα
  choice: అడిగాడు
  rationale: అసంపూర్ణ భూతకాల రూపమైనప్పటికీ, ఇక్కడ ఒక ప్రశ్నను పరిచయం చేసే కథన సందర్భంలో సాధారణ తెలుగు భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: αὐτούς
  choice: వారిని
  rationale: ఈ బహువచన కర్మ సర్వనామం శిష్యులను సూచిస్తుంది.
- source_word: Πόσους
  choice: ఎన్ని
  rationale: లెక్కించగల వస్తువుల సంఖ్యను అడిగే సహజ తెలుగు ప్రశ్నార్థక రూపం.
- source_word: ἔχετε
  choice: మీ దగ్గర ... ఉన్నాయి
  rationale: రెండవ పురుష బహువచన వర్తమాన స్వామ్యార్థాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἄρτους
  choice: రొట్టెలు
  rationale: లెక్కించబడుతున్న విడివిడి ఆహారపు రొట్టెలను సూచించడానికి సాధారణంగా అర్థమయ్యే తెలుగు పదం.
- source_word: οἱ δὲ εἶπαν
  choice: వారు ... అన్నారు
  rationale: ప్రతిస్పందించే సమూహాన్ని స్పష్టంగా చూపుతుంది; δέ యొక్క స్వల్ప కథన మార్పు వాక్య విభజన ద్వారానే సహజంగా వ్యక్తమవుతుంది.
- source_word: Ἑπτά
  choice: ఏడు
  rationale: సంఖ్యను నేరుగా, సంక్షిప్తంగా అనువదిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైన, గౌరవప్రదమైన కథన శైలి. ప్రత్యక్ష సంభాషణను సహజంగా ఉంచుతూ మూలంలోని సంక్షిప్తతను కాపాడింది.
