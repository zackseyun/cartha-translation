reference: Mark 8:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὰς κώμας Καισαρείας τῆς Φιλίππου· καὶ ἐν τῇ ὁδῷ ἐπηρώτα τοὺς μαθητὰς αὐτοῦ λέγων αὐτοῖς· Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/027.yaml
  text: And Jesus went out[a], with his disciples, to the villages of Caesarea Philippi. And on the way he was asking his disciples, saying to them, “Who do people say that I am?”
translation:
  language: te
  text: 'యేసు తన శిష్యులతో కలిసి కైసరయ ఫిలిప్పీ గ్రామాలకు వెళ్లాడు. దారిలో ఆయన తన శిష్యులను ఇలా అడుగుతూ ఉన్నాడు: “నేను ఎవరినని ప్రజలు[a] అంటున్నారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులోని ἄνθρωποι అనే పదాన్ని అక్షరార్థానికి దగ్గరగా “మనుషులు” అని కూడా అనువదించవచ్చు; ఇక్కడ అది పురుషులను మాత్రమే కాక, సాధారణంగా ప్రజలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: బయలుదేరాడు
  rationale: ἐξέρχομαιలోని ప్రయాణాన్ని ప్రారంభించి వెళ్లడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సందర్భం ఇవ్వని ప్రత్యేక బయలుదేరిన స్థలాన్ని చేర్చదు.
- source_word: κώμας
  choice: గ్రామాలకు
  rationale: κώμη ప్రధాన నగరంకన్నా చిన్న గ్రామం లేదా గ్రామీణ నివాసాన్ని సూచిస్తుంది; బహువచనాన్ని అలాగే ఉంచుతుంది.
- source_word: Καισαρείας τῆς Φιλίππου
  choice: ఫిలిప్పు కైసరయ ప్రాంతంలోని
  rationale: స్థలనామాన్ని తెలుగు లిప్యంతరీకరణ సంప్రదాయానికి అనుగుణంగా ఉంచి, ఆ పట్టణానికి సంబంధించిన గ్రామాలు అనే గ్రీకు షష్ఠీవిభక్తి సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ ὁδῷ
  choice: దారిలో
  rationale: ప్రయాణం సాగుతున్నప్పుడు అనే అర్థాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐπηρώτα
  choice: అడుగుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం సూచించే కొనసాగుతున్న నేపథ్య చర్యను సాధారణ ‘అడిగాడు’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: λέγων αὐτοῖς
  choice: ఇలా
  rationale: తదనంతర ప్రత్యక్ష ప్రశ్నను పరిచయం చేస్తూ గ్రీకు participial construction యొక్క పనిని సహజమైన తెలుగులో అందిస్తుంది; ‘వారితో చెబుతూ’ అనే కృత్రిమ పునరుక్తిని నివారిస్తుంది.
- source_word: Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
  choice: నేను ఎవరినని ప్రజలు చెబుతున్నారు?
  rationale: τίνα ... εἶναιలోని వ్యక్తిత్వాన్ని గురించిన ప్రశ్నను నేరుగా ఉంచుతుంది. ἄνθρωποι ఇక్కడ పురుషులకు మాత్రమే కాక సాధారణంగా ప్రజలను సూచిస్తుంది.
- source_word: οἱ μαθηταὶ αὐτοῦ / τοὺς μαθητὰς αὐτοῦ
  choice: తన శిష్యులతో / తన శిష్యులను
  rationale: రెండు సందర్భాల్లోనూ ఉన్న αὐτοῦ అనే స్వామ్య సంబంధాన్ని తెలుగులో సహజంగా ‘తన’తో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యేసు ప్రశ్నలోని generic ἄνθρωποι
  choice: ప్రజలు
  alternative: మనుషులు / పురుషులు
  rationale: వ్యాకరణపరంగా పుంలింగ రూపమైనా, ఈ సందర్భంలో ἄνθρωποι సాధారణ ప్రజానీకాన్ని సూచిస్తుంది. ‘ప్రజలు’ అని అనువదించడం పురుషులను మాత్రమే ఉద్దేశించినట్టు అనవసరంగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మార్కు సువార్తలోని ప్రయాణ గమనాన్ని ‘దారిలో’ నిలుపుతూ, గ్రీకు అసంపూర్ణ భూతకాల భావాన్ని ‘అడుగుతూ ఉన్నాడు’తో వ్యక్తం చేసింది. సంప్రదింపునకు ఇచ్చిన ఆంగ్ల పాఠంలో [a] గుర్తు ‘went out’ తరువాత ఉన్నప్పటికీ, ఆ పాదసూచిక విషయం ἄνθρωποι గురించినది కాబట్టి తెలుగు ప్రధాన పాఠంలో దాన్ని ‘ప్రజలు’ తరువాత ఉంచాం.
