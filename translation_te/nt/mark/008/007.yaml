  text: καὶ εἶχον ἰχθύδια ὀλίγα· καὶ εὐλογήσας ⸀αὐτὰ εἶπεν ⸂καὶ ταῦτα παρατιθέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/007.yaml
  text: And they had a few small fish[a]; and after blessing them[b], he said to set these also before them.
translation:
  language: te
  text: వారి దగ్గర కొన్ని చిన్న చేపలు ఉన్నాయి. ఆయన వాటిని దీవించి, వాటిని కూడా వడ్డించమని[a] చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి ముందు పెట్టమని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰχθύδια ὀλίγα
  choice: కొన్ని చిన్న చేపలు
  rationale: ἰχθύδια అనే అల్పార్థక రూపంలోని ‘చిన్న చేపలు’ అనే భావాన్ని, ὀλίγα సూచించే పరిమిత సంఖ్యను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: εὐλογήσας αὐτά
  choice: ఆయన వాటిని దీవించి
  rationale: అసమాపక క్రియ ప్రధాన క్రియకు ముందుగా జరిగిన కార్యాన్ని సూచిస్తుంది; αὐτά చిన్న చేపలను తిరిగి సూచిస్తుంది. ‘దీవించి’ అనేది εὐλογέωకు నేరమైన సమానార్థకం; భోజన సందర్భంలో కృతజ్ఞత చెప్పడం అనే భావం కలిసివచ్చినా దానినే నిర్బంధించదు.
- source_word: καὶ ταῦτα
  choice: వాటిని కూడా
  rationale: καί యొక్క చేర్పు భావాన్ని, ταῦτα యొక్క సూచనను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παρατιθέναι
  choice: వడ్డించమని
  rationale: భోజన సందర్భంలో ఈ క్రియ ఆహారాన్ని ఎదుట పెట్టడం లేదా వడ్డించడం అని అర్థం. తెలుగు వాడుకలో ‘వడ్డించమని’ సహజంగా ఉండి, శిష్యులకు ఉద్దేశించిన ఆదేశ భావాన్ని నిలుపుతుంది.
- source_word: εἶπεν
  choice: చెప్పాడు
  rationale: λέγω యొక్క సాధారణ అర్థాన్ని నిలుపుతూ, దాని వెంట ఉన్న క్రియారూపం ద్వారా వ్యక్తమయ్యే ఆదేశాన్ని తెలుగులో సహజంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘వారి దగ్గర’ అనేది εἶχονను సందర్భానుసారంగా సహజంగా వ్యక్తం చేస్తుంది; ‘వడ్డించమని’ భోజన సందర్భంలోని παρατιθέναιకు సాధారణ పాఠకులకు స్పష్టమైన రూపం.
