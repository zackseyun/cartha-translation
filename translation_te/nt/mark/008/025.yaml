source:
  edition: SBLGNT
  text: εἶτα πάλιν ⸀ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ, καὶ ⸂διέβλεψεν καὶ ἀπεκατέστη καὶ ἐνέβλεπεν⸃ τηλαυγῶς ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/025.yaml
  text: Then again he laid his hands on his eyes[a], and he saw clearly and was restored[b], and he was seeing everything distinctly.
translation:
  language: te
  text: తర్వాత ఆయన మళ్లీ ఆ మనిషి కళ్ల మీద తన చేతులు ఉంచాడు[a]. అతడు స్పష్టంగా చూశాడు; అతని చూపు బాగుపడింది, అతడు ప్రతిదీ స్పష్టంగా చూస్తూ ఉన్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో, “ఆయన అతని కళ్ల మీద చేతులు ఉంచాడు; అతడు తేరి చూశాడు, అతని చూపు బాగుపడింది, ప్రతిదీ స్పష్టంగా చూశాడు” అని అనువదించదగిన పాఠం ఉంది.
    reason: textual_variant
  - marker: b
    text: లేదా “అతడు ప్రతిదీ స్పష్టంగా చూడగలిగాడు.” చివరి భాగంలో కొనసాగుతున్న చర్యను సూచించే క్రియతో స్పష్టమైన చూపును తెలిపే క్రియావిశేషణం ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα πάλιν
  choice: తర్వాత ... మళ్లీ
  rationale: εἶτα సూచించే క్రమాన్ని ‘తర్వాత’తో, πάλιν సూచించే పునరావృతిని ‘మళ్లీ’తో సహజంగా నిలుపుతుంది.
- source_word: ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: ఆ మనిషి కళ్ల మీద తన చేతులు ఉంచాడు
  rationale: చేతుల బహువచనాన్ని, కళ్లపై జరిగిన స్పష్టమైన శారీరక చర్యను నిలుపుతుంది; తెలుగు వాక్యంలో సర్వనామ గందరగోళం రాకుండా ‘ఆ మనిషి’ అని చెప్పబడింది.
- source_word: διέβλεψεν
  choice: అతనికి స్పష్టంగా కనిపించింది
  rationale: διαβλέπω ఇక్కడ స్పష్టమైన చూపు కలగడాన్ని సూచిస్తుంది; ‘తేరి చూశాడు’ వంటి పాఠాంతర ప్రభావాన్ని దిగుమతి చేయదు.
- source_word: ἀπεκατέστη
  choice: అతని చూపు పూర్తిగా బాగుపడింది
  rationale: పూర్వపు లేదా సక్రమ స్థితికి పునరుద్ధరింపబడిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘పూర్తిగా’ అనేది సందర్భంలోని సంపూర్ణ పునరుద్ధరణను తెలియజేస్తుంది.
- source_word: ἐνέβλεπεν
  choice: చూస్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ యొక్క కొనసాగుతున్న లేదా ఫలితస్థితి భావాన్ని తెలుగులో నిలుపుతుంది.
- source_word: τηλαυγῶς
  choice: స్పష్టంగా
  rationale: స్పష్టమైన, నిర్మలమైన చూపును సహజంగా వ్యక్తం చేస్తుంది; దూరం నుంచి చూడటం అనే సాధ్యమైన వ్యుత్పత్తి ఛాయను సందర్భం నిర్బంధించనందున ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: ἅπαντα
  choice: ప్రతిదీ
  rationale: నపుంసక బహువచన సమగ్రార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: రెండు దశల్లో జరిగిన స్వస్థత యొక్క కథన చిత్రణ
  choice: మొదట స్పష్టంగా కనిపించడం, తర్వాత చూపు పూర్తిగా బాగుపడటం, అనంతరం చూస్తూ ఉండటం అనే క్రమాన్ని నిలుపడం
  alternative: అన్ని క్రియలనూ ఒకే క్షణంలో పూర్తయిన సాధారణ భూతకాల చర్యలుగా కుదించడం
  rationale: గ్రీకు వాక్యంలో వరుసగా ఉన్న క్రియలు, ముఖ్యంగా ἐνέβλεπεν అనే imperfect రూపం, అభివృద్ధి చెందుతున్న చర్యను మరియు కొనసాగిన ఫలితస్థితిని సూచిస్తాయి. అనువాదం ఈ కథన ఉద్వేగాన్ని వ్యాఖ్యానంతో తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఆ మనిషి’ అనే స్పష్టీకరణ తెలుగు సర్వనామాల వల్ల కలిగే సందిగ్ధతను నివారిస్తుంది. గ్రీకు క్రియల క్రమం మరియు imperfect భావం సాధ్యమైనంత సహజంగా నిలుపబడ్డాయి.
