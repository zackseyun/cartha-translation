language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθον οἱ Φαρισαῖοι καὶ ἤρξαντο συζητεῖν αὐτῷ, ζητοῦντες παρ’ αὐτοῦ σημεῖον ἀπὸ τοῦ οὐρανοῦ, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/011.yaml
  text: And the Pharisees came out and began to argue with him[a], seeking from him a sign from heaven, testing him.
translation:
  language: te
  text: పరిసయ్యులు బయటికి వచ్చి, ఆయనతో వాదించడం మొదలుపెట్టారు; ఆయనను పరీక్షిస్తూ, ఆయన దగ్గర పరలోకం నుండి ఒక సూచనను కోరారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆకాశం నుండి ఒక సూచనను.’ ఈ పదబంధం ఇక్కడ భౌతిక ఆకాశం కంటే పరలోకమైన, అంటే దైవిక మూలం లేదా అధికారమున్న సూచనను ఎక్కువగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: బయటికి వచ్చి
  rationale: కదలికను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; వారు ఎక్కడి నుండి వచ్చారో మూలపాఠం చెప్పనందున దానిని నిర్దిష్టం చేయదు.
- source_word: ἤρξαντο συζητεῖν
  choice: వాదించడం మొదలుపెట్టారు
  rationale: ἤρξαντο యొక్క ఆరంభ భావాన్ని, పరీక్షించాలనే ప్రతికూల సందర్భంలో συζητεῖν యొక్క వాదనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: αὐτῷ
  choice: ఆయనతో
  rationale: సర్వనామాన్ని పేరుతో భర్తీ చేయకుండా, συζητεῖν తరువాతి దత్తివిభక్తి సంబంధాన్ని సహజంగా అందిస్తుంది.
- source_word: ζητοῦντες παρ’ αὐτοῦ
  choice: తమకు చూపించమని అడిగారు
  rationale: వారు ఆయన నుండి ఒక సూచకకార్యాన్ని కోరుతున్నారనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘తమకు’ సందర్భం సూచించే ప్రయోజన సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: σημεῖον
  choice: సూచకకార్యం
  rationale: కేవలం అద్భుత శక్తికన్నా, రుజువుగా లేదా ధృవీకరణగా పనిచేసే కార్యం అనే σημεῖον భావాన్ని తెలియజేస్తుంది.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: ఆకాశం నుండి
  rationale: గ్రీకు పదబంధంలోని రూపక అస్పష్టతను నిలుపుతుంది; సందర్భంలో ఇది దైవిక మూలం లేదా అధికారాన్ని ఎక్కువగా సూచిస్తుంది.
- source_word: πειράζοντες αὐτόν
  choice: ఆయనను పరీక్షిస్తూ
  rationale: విరోధపూర్వకంగా ఆయనను పరీక్షించాలనే ఉద్దేశాన్ని తెలియజేస్తుంది; పాపానికి ప్రలోభపెట్టడం అనే అనవసర భావాన్ని రుద్దదు.
theological_decisions:
- issue: ‘ఆకాశం నుండి’ అనే పదబంధం సూచించే భావం
  choice: ప్రధాన పాఠంలో ‘ఆకాశం నుండి’ అని ఉంచి, దైవిక మూలం లేదా అధికారమనే సంభావ్య భావాన్ని పాదటిప్పణిలో తెలియజేయడం
  alternative: భౌతిక ఆకాశం నుండి వచ్చే సూచకకార్యం
  rationale: ἀπὸ τοῦ οὐρανοῦ పదబంధం అక్షరార్థంగా ఆకాశాన్ని సూచించగలిగినా, సువార్తల యూదీయ సందర్భంలో దేవుని నుండి వచ్చిన ధృవీకరణ అనే భావం ఎక్కువగా సంభవిస్తుంది. అనువాదం ఈ ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘ఆయన’ అనే గౌరవ సర్వనామం తెలుగు బైబిల్ శైలికి అనుకూలంగా ఉంది; మూలంలో లేని యేసు అనే పేరును చేర్చలేదు.
