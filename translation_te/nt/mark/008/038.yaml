id: MRK.8.38
reference: Mark 8:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς γὰρ ἐὰν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους ἐν τῇ γενεᾷ ταύτῃ τῇ μοιχαλίδι καὶ ἁμαρτωλῷ, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται αὐτὸν ὅταν ἔλθῃ ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/038.yaml
  text: For whoever is ashamed of me and of my words in this adulterous and sinful generation[a], the Son of Man will also be ashamed of him when he comes in the glory of his Father with the holy angels.
translation:
  language: te
  text: ఎందుకంటే, ఈ వ్యభిచారమైన, పాపభరితమైన తరంలో ఎవరు నన్నుగూర్చి, నా మాటలుగూర్చి సిగ్గుపడతారో, మనుష్య కుమారుడు తన తండ్రి మహిమలో పరిశుద్ధ దూతలతో వచ్చినప్పుడు వారి విషయంలో కూడా సిగ్గుపడతాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ నమ్మకద్రోహమైన, పాపభరితమైన తరంలో.’ గ్రీకు పదం అక్షరార్థంగా ‘వ్యభిచారమైన’ అని ఉంది; ప్రవక్తల భాషలో ఇది దేవునిపట్ల నిబంధనాపరమైన అవిశ్వాసానికి రూపకంగా వాడబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχυνθῇ / ἐπαισχυνθήσεται
  choice: సిగ్గుపడతారో / సిగ్గుపడతాడు
  rationale: వ్యక్తిని లేదా అతని మాటలను అంగీకరించడానికి సిగ్గుపడే భావాన్ని నేరుగా వ్యక్తపరుస్తుంది; మూలంలోని వర్తమాన మానవ స్పందనకు, భవిష్యత్తులో మనుష్య కుమారుని ప్రతిస్పందనకు మధ్య ఉన్న పరస్పరతను నిలుపుతుంది.
- source_word: λόγους
  choice: మాటలు
  rationale: గ్రీకు బహువచనాన్ని నిలుపుతూ, యేసు పలికిన మాటలపై వ్యక్తిగతమైన దృష్టిని కాపాడుతుంది; ‘సందేశం’ కంటే తక్కువ వ్యాఖ్యానాత్మకం.
- source_word: γενεᾷ
  choice: తరం
  rationale: ప్రస్తుత కాలంలోని నైతిక-సామాజిక సమూహాన్ని సూచించే సహజమైన సమానార్థకం; ‘యుగం’ అని అనువదిస్తే మూలంలో అవసరం లేని కాలాత్మక విస్తృతి వస్తుంది.
- source_word: μοιχαλίδι
  choice: వ్యభిచారమైన
  rationale: ప్రవక్తల భాషలో నిబంధనాపరమైన లేదా ఆత్మీయ అవిశ్వాసానికి వాడే స్పష్టమైన వ్యభిచార రూపకాన్ని కాపాడుతుంది.
- source_word: ἁμαρτωλῷ
  choice: పాపభరితమైన
  rationale: పాపంతో లక్షణీకరించబడిన తరాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘దుష్టమైన’ అనేది మూలపదం కోరని అదనపు తీవ్రతను చేర్చవచ్చు.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: స్థిరపడిన క్రీస్తు సంబంధమైన బిరుదును, దాని దానియేలు గ్రంథ సంబంధ ప్రతిధ్వనిని నిలుపుతుంది; దానిని ‘నేను’గా మార్చి భావాన్ని పరిష్కరించదు.
- source_word: δόξῃ
  choice: మహిమ
  rationale: దైవిక గౌరవం, ప్రకాశం, వైభవం అనే బైబిలు భావభారాన్ని మోసే స్థిరమైన తెలుగు పదం.
- source_word: μετὰ τῶν ἀγγέλων τῶν ἁγίων
  choice: పరిశుద్ధ దూతలతో
  rationale: గ్రీకు విశేషణ నిర్మాణాన్ని సహజంగా అందిస్తుంది; మూలంలో లేని ‘తన దూతలు’ అనే స్వామ్యాన్ని చేర్చదు.
- source_word: ὃς γὰρ ἐὰν
  choice: ఎందుకంటే ... ఎవరు ... వారో
  rationale: γάρ యొక్క వివరణాత్మక అనుసంధానాన్ని, షరతుతో కూడిన సార్వత్రిక వ్యక్తి సూచనను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐν τῇ γενεᾷ ταύτῃ
  choice: ఈ తరంలో
  rationale: సిగ్గుపడటం వ్యక్తమయ్యే సామాజిక-నైతిక పరిసరాన్ని సరళంగా సూచిస్తుంది.
theological_decisions:
- issue: ‘వ్యభిచారమైన’ అనే పదంలోని రూపకార్థం
  choice: ప్రధాన పాఠ్యంలో ‘వ్యభిచారమైన’ అని ఉంచి, ప్రవక్తల సంప్రదాయంలోని ఆత్మీయ/నిబంధనాపరమైన అవిశ్వాస రూపకాన్ని నిలుపడం.
  alternative: ‘విశ్వాసఘాతకమైన’ లేదా ‘నమ్మకద్రోహమైన’ అని రూపకార్థాన్ని నేరుగా చెప్పడం.
  rationale: μοιχαλίδι స్పష్టమైన వ్యభిచార రూపకాన్ని ఉపయోగిస్తుంది. దానిని నిలపడం వల్ల అంతర్గ్రంథ సంబంధమైన, ధార్మికమైన భావగాఢత చెదరదు; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణి వివరిస్తుంది.
- issue: ‘మనుష్య కుమారుడు’ అనే సూచన
  choice: స్వీయసూచకమైన మెస్సీయ బిరుదు ‘మనుష్య కుమారుడు’ని అలాగే ఉంచడం.
  alternative: ‘నేను’ లేదా ‘మెస్సీయ’ అని మార్చడం.
  rationale: గ్రీకు పాఠ్యం ప్రత్యేకమైన క్రీస్తు సంబంధ, అంత్యకాల బిరుదును ఉపయోగిస్తుంది. దాన్ని ప్రత్యామ్నాయ పదంతో మార్చడం మూలంలోని ధార్మిక ఉద్వేగాన్ని, సూచనాత్మక బలాన్ని తగ్గిస్తుంది.
- issue: αὐτόν అనే ఏకవచన పుంలింగ సర్వనామం
  choice: తెలుగులో సాధారణ ప్రతినిధి వ్యక్తిని సహజంగా సూచించేందుకు ముందు ‘ఎవరు’ అని, తరువాత ‘వారి గురించి’ అని గౌరవ/సాధారణ ఏకవచన రూపంతో అనుసంధానించడం.
  alternative: ‘అతని గురించి’ అని వ్యాకరణ పుంలింగాన్ని ప్రత్యక్షంగా నిలుపడం.
  rationale: గ్రీకులోని సాధారణ ఏకవచన సూచనను కాపాడుతూనే, ఆధునిక ప్రామాణిక తెలుగులో ‘ఎవరు ... వారు’ నిర్మాణం సహజంగా ఉంటుంది; ఇది బహువచన సమూహంగా అర్థాన్ని మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ‘మనుష్య కుమారుడు,’ ‘మహిమ,’ ‘పరిశుద్ధ దూతలు’ వంటి బైబిలు కీలక పదాలను నిలిపి, మూలంలోని పరస్పర ‘సిగ్గుపడటం’ నిర్మాణాన్ని స్పష్టంగా ఉంచింది.
