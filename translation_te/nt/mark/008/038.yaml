  to: ఎందుకంటే, ఈ వ్యభిచారమైన, పాపభరితమైన తరంలో ఎవరు నన్నుగూర్చి, నా మాటలుగూర్చి సిగ్గుపడతారో, మనుష్య కుమారుడు తన తండ్రి మహిమలో పరిశుద్ధ దూతలతో వచ్చినప్పుడు వారి విషయంలో కూడా సిగ్గుపడతాడు.[a]
