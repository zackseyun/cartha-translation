source:
  edition: SBLGNT
  text: καὶ ⸀παραγγέλλει τῷ ὄχλῳ ἀναπεσεῖν ἐπὶ τῆς γῆς· καὶ λαβὼν τοὺς ἑπτὰ ἄρτους εὐχαριστήσας ἔκλασεν καὶ ἐδίδου τοῖς μαθηταῖς αὐτοῦ ἵνα ⸀παρατιθῶσιν καὶ παρέθηκαν τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/006.yaml
  text: And he instructed the crowd to recline on the ground[a]. Then, taking the seven loaves, after giving thanks he broke them and kept giving them to his disciples so that they might set them before the crowd[b], and they set them before the crowd.
translation:
  language: te
  text: ఆయన జనసమూహాన్ని నేలమీద ఆనుకొని కూర్చోవాలని[a] ఆదేశించాడు. తరువాత ఆయన ఆ ఏడు రొట్టెలను తీసుకొని, కృతజ్ఞతలు తెలిపి, వాటిని విరిచి, జనసమూహం ముందు ఉంచడానికి[b] తన శిష్యులకు ఇస్తూ ఉన్నాడు. వారు వాటిని జనసమూహం ముందు ఉంచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘భోజనం కోసం కూర్చోవాలని.’ గ్రీకు క్రియ ప్రత్యేకంగా భోజనం కోసం ఆనుకొని కూర్చోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వడ్డించడానికి.’ గ్రీకు పదానికి అక్షరార్థంగా ‘ముందు ఉంచడం’ అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγέλλει
  choice: ఆదేశించాడు
  rationale: అధికారపూర్వకమైన సూచన లేదా ఆజ్ఞ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగు కథనశైలికి తగిన భూతకాలంలో ఇచ్చాం.
- source_word: ἀναπεσεῖν
  choice: భోజనానికి కూర్చోవాలని
  rationale: ఈ క్రియ భోజనం కోసం ఆనుకొని కూర్చోవడాన్ని సూచిస్తుంది. తెలుగులో ‘పడుకోవడం’ అని పదశః అనువదిస్తే అపార్థం కలగవచ్చు; ‘భోజనానికి కూర్చోవడం’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐπὶ τῆς γῆς
  choice: నేలమీద
  rationale: జనులు కూర్చున్న ఉపరితలాన్ని సూచించే సందర్భోచితమైన సహజ తెలుగు ప్రయోగం.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: ఆ ఏడు రొట్టెలను
  rationale: ఆహార సందర్భంలో ἄρτοι రొట్టెలను సూచిస్తుంది; నిర్దిష్ట సూచనను ‘ఆ’తో నిలిపాం.
- source_word: εὐχαριστήσας
  choice: కృతజ్ఞతలు చెల్లించి
  rationale: గ్రీకులో కృతజ్ఞత ఎవరికి చెల్లించాడో ప్రత్యక్షంగా చెప్పలేదు; అందువల్ల ‘దేవునికి’ అని పాఠ్యంలో చేర్చలేదు.
- source_word: ἔκλασεν
  choice: వాటిని విరిచి
  rationale: ముందు పేర్కొన్న రొట్టెలే కర్మ అని తెలుగులో స్పష్టత కోసం ‘వాటిని’ చేర్చాం.
- source_word: ἐδίδου
  choice: ఇస్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న లేదా పునరావృత పంపిణీ భావాన్ని నిలుపుతుంది.
- source_word: ἵνα παρατιθῶσιν
  choice: జనసమూహం ముందు ఉంచడానికి
  rationale: ఆహారాన్ని ఎవరి ముందైనా ఉంచడం అనే παρατίθημι క్రియ యొక్క దృశ్యార్థాన్ని నిలుపుతుంది; కేవలం ‘వడ్డించడానికి’ అనే వ్యాఖ్యాత్మక పదానికి పరిమితం చేయలేదు.
- source_word: παρέθηκαν
  choice: వారు వాటిని జనసమూహం ముందు ఉంచారు
  rationale: శిష్యులు చేసిన పూర్తయిన చర్యను తెలుపుతూ, ముందు వచ్చిన παρατιθῶσιν‌తో పదార్థ సారూప్యతను నిలుపుతుంది.
- source_word: ὄχλος
  choice: జనసమూహం
  rationale: ఆధునిక ప్రమాణ తెలుగులో గౌరవప్రదంగా, స్పష్టంగా ‘crowd’ భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: కథన క్రమం మరియు యూకరిస్టు ప్రతిధ్వని
  choice: εὐχαριστήσας‌ను ‘కృతజ్ఞతలు చెల్లించి’ అని సూటిగా అనువదించాం.
  alternative: ‘దేవునికి కృతజ్ఞతలు చెల్లించి’ లేదా ప్రత్యేక సంస్కార సంబంధ పదజాలం
  rationale: సందర్భం భోజనంపై కృతజ్ఞతలు చెల్లించడాన్ని సూచించినా, గ్రీకు పాఠ్యం కర్మను స్పష్టంగా పేర్కొనదు; కాబట్టి సంస్కార సిద్ధాంతాన్ని లేదా పాఠ్యంలో లేని పదాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ప్రాచీన భోజన భంగిమను ప్రధాన పాఠ్యంలో అపార్థం లేకుండా ‘భోజనానికి కూర్చోవడం’గా ఇచ్చి, మరింత నిర్దిష్టమైన భావాన్ని పాదసూచికలో నిలిపాం. ‘జనసమూహం ముందు ఉంచడం’ అనే పునరుక్తిని మూలంలోని పదసామ్యాన్ని కాపాడేందుకు ఉద్దేశపూర్వకంగా ఉంచాం.
