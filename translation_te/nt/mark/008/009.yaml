  text: ἦσαν ⸀δὲ ὡς τετρακισχίλιοι. καὶ ἀπέλυσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/009.yaml
  text: There were about four thousand[a], and he sent them away.
translation:
  language: te
  text: దాదాపు నాలుగు వేలమంది ఉన్నారు. ఆయన వారిని పంపివేశాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారిని వెళ్లనిచ్చాడు.’
    reason: ἀπέλυσεν అనే పదానికి ఈ సందర్భంలో ‘పంపివేశాడు’తో పాటు ‘వెళ్లనిచ్చాడు’ అనే అర్థ ఛాయ కూడా సాధ్యమని తెలియజేస్తుంది.
lexical_decisions:
- source_word: ἦσαν
  choice: ఉన్నారు
  rationale: ఇక్కడ εἰμί సమూహంలోని వారి సంఖ్యను సూచిస్తుంది; తెలుగులో ‘ఉన్నారు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ స్వల్ప కథన అనుసంధానకం. ఈ చిన్న వాక్యంలో తెలుగు వాక్యక్రమం, సందర్భమే దాని అనుసంధాన భావాన్ని సహజంగా తెలియజేస్తాయి.
- source_word: ὡς
  choice: దాదాపు
  rationale: సంఖ్యతో వచ్చిన ὡς సుమారు అనే భావాన్ని సూచిస్తుంది; ‘దాదాపు’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ఎంపిక.
- source_word: τετρακισχίλιοι
  choice: నాలుగు వేలమంది
  rationale: ఈ సంఖ్య ప్రజల సమూహాన్ని సూచిస్తున్నందున వ్యక్తులను లెక్కించే ‘మంది’ని జోడించడం తెలుగులో అవసరమైన, సహజమైన రూపం.
- source_word: ἀπέλυσεν
  choice: పంపివేశాడు
  rationale: ఈ సందర్భంలో ἀπολύω కూడిన ప్రజలను వెళ్లిపోవడానికి పంపడం లేదా విసర్జించడం అనే భావం ఇస్తుంది; ‘పంపివేశాడు’ కథనానికి సరిపోయే స్పష్టమైన సాధారణ తెలుగు.
- source_word: αὐτούς
  choice: వారిని
  rationale: ఈ సర్వనామం ముందున్న ప్రజల సమూహాన్ని తిరిగి సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. గ్రీకు మూలంలోని సుమారు సంఖ్యను ‘దాదాపు’తో నిలుపుతూ, స్వల్ప అనుసంధానకమైన δέను తెలుగులో భారంగా వినిపించే ప్రత్యేక పదంతో వ్యక్తం చేయలేదు.
