id: MRK.8.29
reference: Mark 8:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ⸂ἐπηρώτα αὐτούς⸃· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸀ἀποκριθεὶς ὁ Πέτρος λέγει αὐτῷ· Σὺ εἶ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/029.yaml
  text: And he was asking them[a], “But who do you say that I am?” Peter answered him, “You are the Messiah.”
translation:
  language: te
  text: 'ఆయన వారిని ఇలా అడిగాడు: “అయితే మీరు నన్ను ఎవరని అంటున్నారు?” పేతురు ఆయనకు జవాబిస్తూ ఇలా అన్నాడు: “మీరే మెస్సీయ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు.”
    reason: χριστός అనే గ్రీకు బిరుదుకు సంప్రదాయ తెలుగు రూపాంతరాన్ని ప్రత్యామ్నాయంగా తెలియజేయడం.
lexical_decisions:
- source_word: ἐπηρώτα
  choice: ఇంకా ఇలా అడిగాడు
  rationale: అసంపూర్ణ భూతకాల రూపం ముందటి ప్రశ్నను కొనసాగిస్తూ ఆయన మరొక ప్రశ్న అడిగినట్లు చూపుతుంది. తెలుగులో సహజంగా ఉండేందుకు ‘అడుగుతూ ఉన్నాడు’ అనే కృత్రిమ రూపం బదులు ‘ఇంకా ఇలా అడిగాడు’ అని ఇచ్చాం.
- source_word: Ὑμεῖς δὲ
  choice: మరి మీరు
  rationale: Ὑμεῖς అనే స్పష్ట సర్వనామంలోని ఉద్ఘాటనను ‘మీరు’ నిలుపుతుంది; δέ ముందుగా చెప్పిన ఇతరుల అభిప్రాయంతో శిష్యుల జవాబును పోల్చే వ్యత్యాసాన్ని ‘మరి’ సహజంగా తెలియజేస్తుంది.
- source_word: τίνα με λέγετε εἶναι
  choice: నేను ఎవరినని అంటున్నారు
  rationale: గ్రీకు accusative-plus-infinitive నిర్మాణానికి సహజమైన ఆధునిక తెలుగు సమానార్థక రూపం; యేసు తన గుర్తింపు గురించి అడిగిన ప్రశ్నను యథాతథంగా ఉంచుతుంది.
- source_word: ἀποκριθεὶς … λέγει αὐτῷ
  choice: ఆయనకు జవాబిస్తూ … అన్నాడు
  rationale: కృదంతం మరియు మార్కు వాడిన చారిత్రక వర్తమానాన్ని సహజ తెలుగు కథనంలో ఒకే సమగ్ర జవాబు నిర్మాణంగా అందిస్తుంది.
- source_word: Σὺ εἶ
  choice: మీరే
  rationale: స్పష్టంగా ఉన్న గ్రీకు సర్వనామపు ఉద్ఘాటనను ‘-ఏ’ నిలుపుతుంది. యేసును సంబోధించేటప్పుడు ఆధునిక తెలుగులో సహజమైన గౌరవ బహువచనం వాడబడింది.
- source_word: ὁ χριστός
  choice: మెస్సీయ
  rationale: χριστός ఇక్కడ వ్యక్తినామం కాదు, దేవుడు నియమించిన అభిషిక్తుని సూచించే బిరుదు. ‘మెస్సీయ’ యూదుల నిరీక్షణ నేపథ్యాన్ని ఆధునిక తెలుగు పాఠకులకు గుర్తించదగిన రీతిలో తెలియజేస్తుంది.
theological_decisions:
- issue: χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ పదం పేరు వలె కాక బిరుదుగా పనిచేస్తుంది. యూదుల మెస్సీయ నిరీక్షణను స్పష్టంగా ఉంచేందుకు ప్రధాన పాఠంలో ‘మెస్సీయ’ వాడి, సంప్రదాయ గ్రీకు ఆధారిత రూపమైన ‘క్రీస్తు’ను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి వాడబడింది. యేసుకు ‘మీరు’ అనే గౌరవ సంబోధనను, ఉద్ఘాటన కోసం ‘మీరే’ అనే రూపాన్ని ఎంచుకున్నాం.
