  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἐμβὰς⸃ ἀπῆλθεν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/013.yaml
  text: And leaving them[a], he got back into the boat and went to the other side.
translation:
  language: te
  text: ఆయన వారిని విడిచిపెట్టి, తిరిగి పడవ ఎక్కి[a] అవతలి ఒడ్డుకు వెళ్లిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మళ్లీ పడవ ఎక్కి, అవతలి ఒడ్డుకు వెళ్లిపోయాడు.” πάλιν అనే పదాన్ని “తిరిగి” అని కాకుండా “మళ్లీ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεὶς
  choice: విడిచిపెట్టి
  rationale: ἀφίημι యొక్క భూతకాల అసమాపక క్రియారూపం ఇక్కడ వ్యక్తులను అక్కడే విడిచి వెళ్లడాన్ని సూచిస్తుంది; ‘విడిచిపెట్టి’ ప్రధాన క్రియతో దాని సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: αὐτοὺς
  choice: వారిని
  rationale: సమీప సందర్భంలోని పరిసయ్యులను సూచించే ప్రత్యక్ష కర్మ సర్వనామం.
- source_word: πάλιν
  choice: తిరిగి
  rationale: πάλινకు ‘మళ్లీ’ లేదా ‘తిరిగి’ అనే అర్థాలు ఉండవచ్చు. ప్రయాణ సందర్భంలో ‘తిరిగి పడవ ఎక్కి’ సహజంగా ఉండి, పడవలోకి తిరిగి ప్రవేశించిన భావాన్ని ఇస్తుంది; ప్రత్యామ్నాయ నిర్మాణాన్ని పాదసూచికలో నిలుపుతున్నాం.
- source_word: ἐμβὰς
  choice: పడవ ఎక్కి
  rationale: ఈ అసమాపక క్రియారూపం లోపలికి వెళ్లడం లేదా ఎక్కడాన్ని సూచిస్తుంది. సందర్భం ద్వారా పడవ స్పష్టంగా ఉన్నందున దానిని తెలుగులో వ్యక్తంగా చేర్చడం పాఠకుడికి స్పష్టతనిస్తుంది.
- source_word: ἀπῆλθεν
  choice: వెళ్లిపోయాడు
  rationale: ἀπέρχομαι ఇక్కడ అక్కడి నుంచి బయలుదేరి వెళ్లడాన్ని సూచిస్తుంది; ‘వెళ్లిపోయాడు’ విడిచి వెళ్లిన భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: εἰς τὸ πέραν
  choice: అవతలి ఒడ్డుకు
  rationale: మార్కు ప్రయాణ వర్ణనలో ఈ పదబంధం సరస్సు లేదా సముద్రం అవతలి వైపును సూచిస్తుంది; తెలుగులో ‘అవతలి ఒడ్డుకు’ భౌగోళిక భావాన్ని స్పష్టంగా అందిస్తుంది.
