id: MRK.8.19
reference: Mark 8:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτε τοὺς πέντε ἄρτους ἔκλασα εἰς τοὺς πεντακισχιλίους, πόσους κοφίνους ⸂κλασμάτων πλήρεις⸃ ἤρατε; λέγουσιν αὐτῷ· Δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/019.yaml
  text: When I broke the five loaves for the five thousand[a], how many baskets full of broken pieces did you pick up?” They said to him[c][b], “Twelve.”
translation:
  language: te
  text: “నేను ఆ ఐదు రొట్టెలను ఐదువేలమంది కోసం విరిచినప్పుడు, ముక్కలతో నిండిన ఎన్ని గంపలను మీరు ఎత్తుకున్నారు?[a]” అని అడిగాడు. వారు ఆయనకు, “పన్నెండు” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎన్ని గంపలను మీరు తీసుకున్నారు?”
    reason: ἤρατε అనే పదానికి ‘ఎత్తుకున్నారు’తో పాటు ‘తీసుకున్నారు’ అనే సహజమైన అనువాదం కూడా సాధ్యమని చూపిస్తుంది.
lexical_decisions:
- source_word: ὅτε
  choice: విరిచినప్పుడు
  rationale: గతంలో జరిగిన రొట్టెల అద్భుతాన్ని గుర్తుచేసే కాలవాచక ఉపవాక్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τοὺς πέντε ἄρτους
  choice: ఆ ఐదు రొట్టెలను
  rationale: లెక్కించదగిన ἄρτους‌కు ‘రొట్టెలు’ సరైనది; నిర్దిష్టమైన గత సంఘటనను సూచించేందుకు ‘ఆ’ వాడబడింది.
- source_word: ἔκλασα
  choice: నేను ... విరిచినప్పుడు
  rationale: κλάω యొక్క రొట్టెను విరిచే స్పష్టమైన చర్యను నేరుగా నిలుపుతుంది.
- source_word: εἰς τοὺς πεντακισχιλίους
  choice: ఐదువేలమంది కోసం
  rationale: ఇక్కడ εἰς సూచించే ఆ జనసమూహం పట్ల జరిగిన పంపిణీ/ప్రయోజన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; మూలంలో లేని ‘పురుషులు’ అనే నిర్దిష్టతను చేర్చదు.
- source_word: κοφίνους
  choice: గంపలను
  rationale: κόφινος అనేది మోసుకెళ్లగల బుట్ట లేదా గంప. ఆధునిక సాధారణ తెలుగులో ఈ సందర్భానికి ‘గంప’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: κλασμάτων πλήρεις
  choice: ముక్కలతో నిండిన
  rationale: విరిచిన రొట్టెల నుంచి మిగిలిన ముక్కలను సూచిస్తూ κλασμάτων మరియు πλήρεις రెండింటి భావాన్నీ నిలుపుతుంది.
- source_word: ἤρατε
  choice: మీరు ఎత్తుకున్నారు
  rationale: αἴρω యొక్క ప్రాథమిక ‘ఎత్తుకోవడం/తీసుకోవడం’ భావాన్ని నిలుపుతూ, మిగిలిన ముక్కల గంపలను సేకరించిన సందర్భంలో సహజంగా ఉంటుంది.
- source_word: λέγουσιν αὐτῷ
  choice: వారు ఆయనతో ... అన్నారు
  rationale: చారిత్రక వర్తమానాన్ని తెలుగు కథనంలో సహజమైన భూతకాలంతో అనువదించి, αὐτῷను ‘ఆయనతో’గా స్పష్టంగా నిలుపుతుంది.
- source_word: Δώδεκα
  choice: పన్నెండు
  rationale: ప్రశ్నకు ఇచ్చిన సంక్షిప్త సంఖ్యాత్మక సమాధానాన్ని యథాతథంగా ఉంచుతుంది.
theological_decisions:
- issue: πεντακισχιλίους యొక్క సూచన పరిధి
  choice: ఐదువేలమంది
  alternative: ఐదువేలమంది పురుషులు
  rationale: గ్రీకు రూపం పుంలింగమైనప్పటికీ ఈ వాక్యంలో అది జనసమూహానికి ప్రాచుర్యంలో ఉన్న సంఖ్యాత్మక పేరుగా పనిచేస్తుంది. ‘పురుషులు’ అని చేర్చడం ఈ వాక్యంలోని ప్రత్యక్ష పదప్రయోగం కంటే ఎక్కువ నిర్దిష్టతను తెస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; యేసు ప్రశ్నలోని ప్రత్యక్షతను, శిష్యుల సంక్షిప్త జవాబును నిలుపుతూ గౌరవప్రదమైన సాధారణ శైలి వాడబడింది.
