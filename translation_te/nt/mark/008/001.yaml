source:
  edition: SBLGNT
  text: Ἐν ἐκείναις ταῖς ἡμέραις ⸂πάλιν πολλοῦ⸃ ὄχλου ὄντος καὶ μὴ ἐχόντων τί φάγωσιν, ⸀προσκαλεσάμενος τοὺς ⸀μαθητὰς λέγει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/001.yaml
  text: In those days[a], when again a large crowd was present and they had nothing to eat, he called his disciples and says to them[b],
translation:
  language: te
  text: 'ఆ రోజుల్లో, మళ్లీ పెద్ద జనసమూహం ఉండగా[a], వారికి తినడానికి ఏమీ లేకుండగా, ఆయన తన శిష్యులను పిలిచి వారితో అంటున్నాడు[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మళ్లీ పెద్ద జనసమూహం ఉన్నప్పుడు’ అని కూడా అనువదించవచ్చు. గ్రీకులో ఇది ప్రధాన క్రియకు నేపథ్య పరిస్థితిని తెలిపే genitive absolute నిర్మాణం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘వారితో అంటున్నాడు.’ మార్కు గత సంఘటనలను చెబుతున్నప్పుడు కూడా తరచుగా వర్తమాన కాలాన్ని ఉపయోగిస్తాడు; అందువల్ల ‘వారితో అన్నాడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείναις ταῖς ἡμέραις
  choice: ఆ రోజుల్లో
  rationale: కాల నేపథ్యాన్ని సహజమైన ఆధునిక తెలుగు ప్రయోగంతో తెలియజేస్తుంది; వ్యవధిని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: మార్కు కథనంలో ఇలాంటి పరిస్థితి పునరావృతమైందనే భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: πολλοῦ ὄχλου ὄντος
  choice: పెద్ద జనసమూహం కూడి ఉండగా
  rationale: గ్రీకు genitive absolute ఇచ్చే నేపథ్య పరిస్థితిని సహజమైన తెలుగు ఉపవాక్యంగా వ్యక్తం చేస్తుంది; πολλοῦ సూచించే అధిక సంఖ్యను ‘పెద్ద’ నిలుపుతుంది.
- source_word: καὶ μὴ ἐχόντων τί φάγωσιν
  choice: వారికి తినడానికి ఏమీ లేకపోవడంతో
  rationale: ఆహారం లేనివారు జనసమూహంలోని వారేనని స్పష్టం చేస్తూ, గ్రీకు భావాన్ని సహజమైన తెలుగు కారణార్థక నిర్మాణంలో అందిస్తుంది.
- source_word: προσκαλεσάμενος
  choice: పిలిచి
  rationale: శిష్యులను తన వద్దకు పిలిచాడనే సందర్భార్థాన్ని అతిగా విస్తరించకుండా సంక్షిప్తంగా అందిస్తుంది.
- source_word: τοὺς μαθητάς
  choice: తన శిష్యులను
  rationale: గ్రీకులో స్వామ్యసూచక పదం లేకపోయినా, సందర్భంలో వీరు యేసు శిష్యులని తెలుగు సహజ ప్రయోగం స్పష్టం చేస్తుంది.
- source_word: λέγει αὐτοῖς
  choice: వారితో అంటున్నాడు
  rationale: λέγει లోని కథన వర్తమాన కాలాన్ని నిలుపుతూ, మాటలు తరువాత వస్తున్నాయని తెలుగు పాఠకునికి సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: మార్కు ఉపయోగించిన కథన వర్తమాన కాలం
  choice: ‘వారితో అంటున్నాడు’ అని వర్తమాన కాలాన్ని నిలిపాం
  alternative: ‘వారితో అన్నాడు’ అని భూతకాలంలో సహజీకరించడం
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కాదు; మార్కు కథనశైలిలోని సజీవతను, గ్రీకు λέγει రూపాన్ని ప్రతిబింబించే అనువాద నిర్ణయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. వాక్యం తరువాతి వచనంలోని ప్రత్యక్ష వాక్యానికి దారితీయడం వల్ల చివర ద్విబిందువు ఉంచబడింది.
