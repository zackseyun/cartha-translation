id: MRK.8.15
reference: Mark 8:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ διεστέλλετο αὐτοῖς λέγων· Ὁρᾶτε, βλέπετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ τῆς ζύμης Ἡρῴδου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/015.yaml
  text: And he kept instructing them[a], saying, “Watch out[b]; beware of the leaven of the Pharisees and the leaven of Herod.”
translation:
  language: te
  text: 'ఆయన వారిని హెచ్చరిస్తూనే ఇలా చెప్పాడు: “చూసుకోండి; పరిసయ్యుల పులిసిన పిండి నుండీ, హేరోదు యొక్క పులిసిన పిండి నుండీ జాగ్రత్తగా ఉండండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεστέλλετο
  choice: హెచ్చరిస్తూనే
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా మళ్లీమళ్లీ చేయబడుతున్న గంభీర హెచ్చరికను సూచిస్తుంది. తెలుగు వాక్యంలో సహజంగా ఉండేలా ‘హెచ్చరిస్తూనే’ అని అనువదించాం.
- source_word: λέγων
  choice: అని చెప్పాడు
  rationale: ఈ కృదంతం హెచ్చరికలోని మాటలను పరిచయం చేస్తుంది; తెలుగులో సహజమైన ప్రత్యక్ష వాక్య నిర్మాణాన్ని ఉపయోగించాం.
- source_word: Ὁρᾶτε
  choice: చూసుకోండి
  rationale: ఇక్కడ ఇది కేవలం చూడడాన్ని కాక అపాయాన్ని గుర్తించి అప్రమత్తం కావడాన్ని ఆదేశిస్తుంది. తరువాతి సమానార్థక ఆజ్ఞతో ఉన్న ఉద్ఘాటనను నిలిపింది.
- source_word: βλέπετε
  choice: జాగ్రత్తగా ఉండండి
  rationale: మొదటి ఆజ్ఞతో కలిసి బలమైన ద్విగుణ హెచ్చరికను ఇస్తుంది; ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: ἀπὸ
  choice: విషయంలోనూ
  rationale: హెచ్చరికకు సంబంధించిన తెలుగు ప్రయోగంలో సహజమైన నిర్మాణం. గ్రీకులోని ‘నుండి దూరంగా ఉండాలి’ అనే అంతర్భావాన్ని హెచ్చరిక సందర్భం అందిస్తుంది.
- source_word: ζύμης
  choice: పులిసిన పిండి
  rationale: పిండంతటా వ్యాపించే పదార్థం అనే రూపకాన్ని ‘ఈస్ట్’ కంటే స్పష్టంగా నిలుపుతుంది; తెలుగు బైబిలు పరిభాషలోనూ అర్థమయ్యే వ్యక్తీకరణ.
- source_word: Φαρισαίων
  choice: పరిసయ్యుల
  rationale: సమూహనామానికి ప్రామాణిక తెలుగు రూపం; షష్ఠీ సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: Ἡρῴδου
  choice: హేరోదు
  rationale: మూలపాఠం హేరోదునే నేరుగా పేర్కొంటుంది. అతని కుటుంబం, వర్గం లేదా సిద్ధాంతం అని ప్రధాన పాఠంలో వ్యాఖ్యానాత్మకంగా విస్తరించలేదు.
theological_decisions:
- issue: ‘పులిసిన పిండి’ అనే రూపకం యొక్క అర్థం
  choice: రూపకాన్ని వివరించకుండా ప్రధాన పాఠంలో అలాగే నిలపడం
  alternative: బోధ, వేషధారణ, లేదా చెడగొట్టే ప్రభావం అని నేరుగా అనువదించడం
  rationale: సందర్భం ప్రతికూలంగా వ్యాపించే ప్రభావాన్ని సూచించినప్పటికీ, మార్కు 8:15 దాని నిర్దిష్ట స్వభావాన్ని చెప్పదు. అందువల్ల వచనంలోని వ్యాఖ్యాన విస్తృతిని, ధార్మిక ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘చూసుకోండి; ... జాగ్రత్తగా ఉండండి’ అనే జంట ఆజ్ఞలు గ్రీకు మూలంలోని ఉద్ఘాటనను సహజంగా నిలుపుతాయి.
