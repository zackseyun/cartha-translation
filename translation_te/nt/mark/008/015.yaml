revisions:
- from: ఆయన వారిని హెచ్చరిస్తూనే, “చూసుకోండి; పరిసయ్యుల పులిసిన పిండి[a] విషయంలోనూ, హేరోదు పులిసిన పిండి విషయంలోనూ జాగ్రత్తగా ఉండండి[b]” అని చెప్పాడు.
  to: 'ఆయన వారిని హెచ్చరిస్తూనే ఇలా చెప్పాడు: “చూసుకోండి; పరిసయ్యుల పులిసిన పిండి నుండీ, హేరోదు యొక్క పులిసిన పిండి నుండీ జాగ్రత్తగా ఉండండి.”'
  rationale: The revision replaces the non-equivalent “విషయంలోనూ” with “నుండీ,” preserving the Greek ἀπό and the sense of guarding oneself against an influence. It also makes Herod’s possessive relation explicit and parallel to “పరిసయ్యుల.” The metaphor remains untranslated in the main text, preserving the source text’s interpretive openness.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:02:07Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the repeated/continuing force of διεστέλλετο, the paired warning imperatives, and the unexpanded metaphor of ζύμη. However, “విషయంలోనూ” (“regarding”) does not adequately represent ἀπό in a warning construction, which calls for avoidance/separation “from.”
  naturalness: The proposed revision is more idiomatic and direct in modern standard Telugu. It avoids the awkward repeated “విషయంలోనూ” construction while retaining the emphatic double warning.
  terminology: “పరిసయ్యులు,” “హేరోదు,” and “పులిసిన పిండి” are suitable. “పులిసిన పిండి” retains the biblical metaphor without prematurely identifying its precise referent in the main text.
  issues:
  - severity: medium
    issue: The expression “పులిసిన పిండి విషయంలోనూ” renders ἀπό too weakly.
    rationale: The Greek warning is to beware/keep away from the Pharisees’ and Herod’s leaven, not merely to be cautious concerning it. “నుండి” preserves the avoidance sense.
  - severity: low
    issue: The two possessive phrases should be made syntactically parallel.
    rationale: Adding “యొక్క” with Herod makes the parallel genitives clear and natural in Telugu.
