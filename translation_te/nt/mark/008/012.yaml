id: MRK.8.12
reference: Mark 8:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀναστενάξας τῷ πνεύματι αὐτοῦ λέγει· Τί ἡ γενεὰ αὕτη ⸂ζητεῖ σημεῖον⸃; ἀμὴν λέγω ⸀ὑμῖν, εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/012.yaml
  text: And sighing deeply in his spirit[a], he says, “Why does this generation seek a sign? Truly I say to you, no sign will be given to this generation.”
translation:
  language: te
  text: 'ఆయన తన ఆత్మలో[a] లోతుగా నిట్టూర్చి ఇలా అంటున్నాడు: “ఈ తరం సూచకాన్ని ఎందుకు కోరుతోంది? నేను మీతో నిజంగా చెబుతున్నాను: ఈ తరానికి ఎలాంటి సూచకమూ ఇవ్వబడదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “ఈ తరానికి సూచకం ఇవ్వబడితే…” ఇది ఏ సూచకమూ ఇవ్వబడదని తెలిపే గ్రీకు ప్రమాణంలాంటి ప్రయోగం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστενάξας
  choice: లోతుగా నిట్టూర్చి
  rationale: ἀνα- ఉపసర్గతో బలపరచబడిన నిట్టూర్పు భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; అతిగా నాటకీయంగా చేయదు.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: తన ఆత్మలో
  rationale: గ్రీకు దత్తివిభక్తిలోని పరిధి/సంబంధ భావాన్ని, అలాగే మానవ అంతరంగానికి వాడిన ‘ఆత్మ’ అనే భాషను కాపాడుతుంది.
- source_word: λέγει
  choice: ఇలా అంటున్నాడు
  rationale: మార్కు ఉపయోగించిన చారిత్రక వర్తమాన కాలపు సజీవ కథన శైలిని నిలుపుతుంది.
- source_word: Τί
  choice: ఎందుకు
  rationale: క్రియతో కూడిన τί ఇక్కడ కారణాన్ని అడిగే ప్రయోగం; తెలుగులో ‘ఎందుకు’ సహజమైన సమానార్థకం.
- source_word: γενεὰ
  choice: తరం
  rationale: సమకాలీన ప్రజాసమూహం మరియు కాలసంబంధ భావాలు రెండింటినీ సంక్షిప్తంగా కాపాడుతుంది.
- source_word: ζητεῖ
  choice: కోరుతోంది
  rationale: సందర్భంలో ఒక సూచనను పొందాలని ఆశించడం/అడగడం అనే భావాన్ని ఇస్తుంది; ‘డిమాండ్ చేస్తోంది’ అని అనవసరంగా తీవ్రతను పెంచదు.
- source_word: σημεῖον
  choice: సూచక క్రియ
  rationale: కేవలం గుర్తు కాక, ధృవీకరించే కార్యం అనే సందర్భోచిత భావాన్ని తెలియజేస్తుంది; ‘అద్భుతం’ అనే అదనపు నిర్దిష్టతను బలవంతంగా చేర్చదు.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: నేను మీతో నిజంగా చెబుతున్నాను
  rationale: యేసు మాటలోని గంభీరమైన ధృవీకరణ సూత్రాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον
  choice: ఈ తరానికి ఏ సూచక క్రియా ఇవ్వబడదు
  rationale: εἰ తో ఉన్న సెమిటిక్ ప్రమాణసదృశ అసంపూర్ణ వాక్యం బలమైన నిరాకరణను సూచిస్తుంది; దాని ఉద్దేశిత అర్థాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: ἀμὴν λέγω ὑμῖν తరువాత వచ్చే ప్రమాణసదృశ εἰ వాక్యాన్ని ఎలా అనువదించాలి
  choice: బలమైన నిరాకరణగా—‘ఈ తరానికి ఏ సూచక క్రియా ఇవ్వబడదు’
  alternative: అక్షరార్థంగా—‘ఈ తరానికి సూచక క్రియా ఇవ్వబడితే…’
  rationale: గ్రీకు రూపంలోని అసంపూర్ణ ప్రమాణ ప్రయోగం అర్థపరంగా గట్టి నిరాకరణ. ప్రధాన పాఠంలో దానిని స్పష్టంగా తెలుపుతూ, అసలు రూపాన్ని పాదసూచికలో ఉంచడం అర్థాన్నీ మూలంలోని ఉద్వేగాన్నీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గంభీరంగా ఉంది. మార్కు చారిత్రక వర్తమానాన్ని ‘అంటున్నాడు’గా నిలిపి, ‘తన ఆత్మలో’ అనే మూల భాషా రూపాన్ని సాఫీగా కాపాడింది.
