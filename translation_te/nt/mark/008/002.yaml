id: MRK.8.2
reference: Mark 8:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/002.yaml
  text: I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat.
translation:
  language: te
  text: “ఈ జనసమూహం పట్ల నాకు కనికరం కలుగుతోంది, ఎందుకంటే వీరు ఇప్పటికే మూడు రోజులుగా నాతో ఉంటున్నారు, మరియు తినడానికి వీరి దగ్గర ఏమీ లేదు.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σπλαγχνίζομαι
  choice: నాకు కనికరం కలుగుతోంది
  rationale: ఈ క్రియ లోతైన కనికరాన్ని సూచిస్తుంది. వర్తమాన కాల భావాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉండే వ్యక్తీకరణను ఎంచుకున్నాం.
- source_word: ἐπὶ τὸν ὄχλον
  choice: ఈ జనసమూహం మీద
  rationale: ἐπί + ద్వితీయా విభక్తి కనికరానికి గురైనవారిని సూచిస్తుంది. సందర్భంలో ఉన్న నిర్దిష్ట సమూహాన్ని తెలుగులో సహజంగా సూచించడానికి ‘ఈ’ వాడాం.
- source_word: ὅτι
  choice: '[తదుపరి వాక్యంగా కారణ వివరణ]'
  rationale: ὅτι యేసు కనికరానికి కారణాన్ని పరిచయం చేస్తుంది. తెలుగులో ఉల్లేఖనంలోని ప్రత్యక్ష మాటగా ‘ఎందుకంటే’ అని భారంగా చేయకుండా, తరువాతి వాక్యమే కారణాన్ని స్పష్టంగా తెలిపేలా నిర్మించాం.
- source_word: ἤδη ἡμέραι τρεῖς
  choice: ఇప్పటికే మూడు రోజులుగా
  rationale: ἤδη యొక్క ‘ఇప్పటికే’ భావాన్నీ, మూడు రోజుల కాలవ్యవధినీ సహజమైన తెలుగు రూపంలో నిలిపాం.
- source_word: προσμένουσίν μοι
  choice: నాతోనే ఉంటున్నారు
  rationale: ప్రజలు యేసుతో కొనసాగుతూ ఉండడాన్ని సూచిస్తుంది. ‘ఉంటున్నారు’ వర్తమాన కొనసాగింపు భావాన్ని ఇస్తుంది; ‘నే’ వారి నిలకడను సహజంగా నొక్కిచెబుతుంది.
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: తినడానికి వీరి దగ్గర ఏమీ లేదు
  rationale: ఆహారం లేకపోవడాన్ని సూటిగా, సామాన్య ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ప్రత్యక్ష వాక్య నిర్మాణం. మూలంలోని వర్తమాన భావం, మూడు రోజుల కొనసాగింపు, ఆహారలేమి నిలుపబడ్డాయి.
