source:
  edition: SBLGNT
  text: καὶ ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ ⸀ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης, καὶ πτύσας εἰς τὰ ὄμματα αὐτοῦ, ἐπιθεὶς τὰς χεῖρας αὐτῷ, ἐπηρώτα αὐτόν· Εἴ τι ⸀βλέπεις;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/023.yaml
  text: And taking the blind man by the hand[a], he led him out of the village; and after spitting on his eyes and laying his hands on him, he asked him, “Do you see anything?”
translation:
  language: te
  text: ఆయన ఆ గుడ్డివాని చెయ్యి పట్టుకొని, అతన్ని గ్రామం వెలుపలికి తీసుకెళ్లాడు. తరువాత అతని కళ్ల మీద ఉమ్మివేసి[a], అతని మీద చేతులు ఉంచి, “నీకు ఏమైనా కనిపిస్తున్నదా?” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “అతని కళ్లలో ఉమ్మివేసి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιλαβόμενος τῆς χειρὸς
  choice: చెయ్యి పట్టుకొని
  rationale: జన్యర్థక విభక్తితో ఉన్న ఈ గ్రీకు ప్రయోగం ఒకరి చెయ్యి పట్టుకోవడాన్ని సూచిస్తుంది. ‘చెయ్యి పట్టుకొని’ సహజమైన ఆధునిక తెలుగు; స్పష్టమైన శారీరక చర్యను కూడా నిలుపుతుంది.
- source_word: τοῦ τυφλοῦ
  choice: ఆ గుడ్డివాని
  rationale: τυφλός ఇక్కడ నామవాచకంగా వాడబడింది. ముందే ప్రస్తావించబడిన పురుషుణ్ణి సూచించేందుకు ‘ఆ గుడ్డివాని’ సందర్భోచితంగా, సహజంగా ఉంది.
- source_word: ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης
  choice: అతన్ని గ్రామం వెలుపలికి తీసుకెళ్లాడు
  rationale: చెయ్యి పట్టుకొని బయటికి తీసుకెళ్లే సందర్భంలో ἐκφέρω యొక్క దిశాత్మక భావాన్ని ‘వెలుపలికి తీసుకెళ్లాడు’ సహజంగా వ్యక్తం చేస్తుంది; κώμηకి ‘గ్రామం’ సరైన సమానార్థకం.
- source_word: πτύσας εἰς τὰ ὄμματα αὐτοῦ
  choice: అతని కళ్ల మీద ఉమ్మివేసి
  rationale: εἰς పదబంధం అక్షరార్థంగా ‘కళ్లలోకి’ అనే సజీవమైన భావాన్ని ఇవ్వగలిగినా, ఈ చర్యను తెలుగులో సహజంగా ‘కళ్ల మీద ఉమ్మివేసి’ అని చెప్పవచ్చు. మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: అతని మీద చేతులు ఉంచి
  rationale: మూలంలోని బహువచనమైన ‘చేతులు’ను, ప్రత్యక్ష స్పర్శను ఈ రూపం నిలుపుతుంది; దీనికి తరువాతి కాలపు ఆచారపరమైన అర్థాన్ని జోడించదు.
- source_word: ἐπηρώτα αὐτόν
  choice: అని అడిగాడు
  rationale: గ్రీకు అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న చర్యను సూచించగలిగినా, ఈ ప్రత్యక్ష ప్రశ్న ఉన్న కథనంలో సాధారణ భూతకాలమైన ‘అడిగాడు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: Εἴ τι βλέπεις;
  choice: నీకు ఏమైనా కనిపిస్తున్నదా?
  rationale: τι యొక్క అనిర్దిష్ట భావాన్ని ‘ఏమైనా’ నిలుపుతుంది. చూపు వచ్చిందా అని విచారించే ప్రశ్నకు ఈ తెలుగు రూపం సహజంగా ఉంది.
theological_decisions:
- issue: స్వస్థపరిచే చర్యల భౌతిక స్పష్టత
  choice: కళ్ల మీద ఉమ్మివేయడం, చేతులు ఉంచడం అనే స్పష్టమైన చర్యల క్రమాన్ని యథాతథంగా నిలుపడం
  alternative: ఆధునిక పాఠకులకు అసౌకర్యం కలగకుండా ఈ వివరాలను సున్నితమైన భావానువాదంగా మార్చడం
  rationale: మూలపాఠం స్వస్థత ప్రక్రియలోని స్పష్టమైన, ఆశ్చర్యం కలిగించగల భౌతిక చర్యలను ఉద్దేశపూర్వకంగా వివరిస్తుంది; అనువాదం వాటిని తగ్గించకూడదు.
- issue: ‘చేతులు ఉంచడం’లో ఆచారపరమైన అర్థం ఉండే అవకాశం
  choice: సందర్భంలోని స్వస్థపరిచే స్పర్శగా మాత్రమే ‘అతని మీద చేతులు ఉంచి’ అని అనువదించడం
  alternative: దీనిని అధికారిక మతాచారంగా లేదా సంస్కారక్రియగా వివరించడం
  rationale: ఈ సందర్భంలో పదబంధం యేసు చేసిన శారీరక స్పర్శను వివరిస్తుంది. మూలం కోరని తరువాతి సంఘపరమైన లేదా ఆచారపరమైన భావాలను జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలిని వాడాం. ‘చెయ్యి’ సహజ వాడుకను, ‘చేతులు’ మూలంలోని బహువచనాన్ని నిలుపుతుంది. సంప్రదింపు ఆంగ్ల పాఠ్యంలో [a] గుర్తు ‘చెయ్యి’ తరువాత కనిపించినా, ఆ పాదసూచిక πτύσας εἰς τὰ ὄμματα అనే పదబంధానికి సంబంధించినందున మూలాధారాన్ని అనుసరించి దాన్ని ‘ఉమ్మివేసి’ తరువాత ఉంచాం.
