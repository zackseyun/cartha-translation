id: MRK.8.33
reference: Mark 8:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπιστραφεὶς καὶ ἰδὼν τοὺς μαθητὰς αὐτοῦ ἐπετίμησεν ⸀Πέτρῳ ⸂καὶ λέγει⸃· Ὕπαγε ὀπίσω μου, Σατανᾶ, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/033.yaml
  text: But turning around and seeing his disciples[a], he rebuked Peter and said, “Get behind me, Satan, because you are not setting your mind on the things of God, but on the things of men.”
translation:
  language: te
  text: 'అయితే ఆయన తిరిగి, తన శిష్యులను చూసి, పేతురును గద్దించి ఇలా అన్నాడు: “సాతానా, నా వెనుకకు పో! ఎందుకంటే నీ మనసు దేవుని విషయాల మీద లేదు, మనుషుల విషయాల[a] మీదే ఉంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “మనుషులు” అనే పదం పురుషులను మాత్రమే కాక, మానవులందరినీ సాధారణంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστραφεὶς
  choice: వెనక్కి తిరిగి
  rationale: సందర్భంలో యేసు శరీరపరంగా తిరిగి శిష్యులవైపు చూడడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἰδὼν
  choice: చూసి
  rationale: రెండు క్రియల క్రమాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: μαθητὰς
  choice: శిష్యులను
  rationale: సువార్తల సందర్భంలో యేసు వద్ద నేర్చుకుంటూ ఆయనను అనుసరించేవారికి ప్రామాణికమైన తెలుగు పదం.
- source_word: ἐπετίμησεν
  choice: గద్దిస్తూ
  rationale: పదంలోని తీవ్రమైన మందలింపు భావాన్ని వ్యక్తం చేస్తుంది; వెంటనే వచ్చే ప్రత్యక్ష మాటతో సహజంగా కలుస్తుంది.
- source_word: Ὕπαγε ὀπίσω μου
  choice: నా వెనుకకు పో
  rationale: పేతురు యేసుకు ముందుండి దారి నిర్దేశించే స్థానంలో కాక, ఆయన వెనుక ఉండవలసినవాడనే స్థలసంబంధ భావాన్ని పరిష్కరించకుండా నిలుపుతుంది.
- source_word: Σατανᾶ
  choice: సాతానా
  rationale: సంబోధన విభక్తి బలాన్ని నిలుపుతూ కొత్త నిబంధనలో స్థిరపడిన పేరును ఉపయోగిస్తుంది.
- source_word: φρονεῖς
  choice: నీ మనసు … మీద లేదు … మీదే ఉంది
  rationale: కేవలం ఆలోచనను కాక, మనస్సు యొక్క మొగ్గు, దృక్పథం, శ్రద్ధ అనే విస్తృత భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: τὰ τοῦ θεοῦ
  choice: దేవుని విషయాలు
  rationale: విస్తృతమైన గ్రీకు నామవాచక ప్రయోగాన్ని ప్రత్యేకంగా ‘చిత్తం’ లేదా ‘ప్రయోజనాలు’ అని పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: τὰ τῶν ἀνθρώπων
  choice: మనుషుల విషయాలు
  rationale: దేవునికి సంబంధించిన వాటితో మానవులకు సంబంధించిన వాటి వ్యత్యాసాన్ని నిలుపుతుంది; ‘మనుషులు’ ఇక్కడ మానవులందరినీ సూచించే సాధారణ పదం.
theological_decisions:
- issue: ‘సాతానా’ అనే సంబోధన ఎవరిని సూచిస్తుంది?
  choice: యేసు పేతురునే నేరుగా ‘సాతానా’ అని గద్దించినట్లుగా పాఠాన్ని అనువదించడం.
  alternative: పేతురు వెనుక ఉన్న సాతానును యేసు సంబోధించాడని, లేదా ‘విరోధి’ అనే వ్యక్తిరహిత అర్థం మాత్రమే ఉందని స్పష్టీకరించడం.
  rationale: గ్రీకు వాక్యంలో గద్దింపుకు ప్రత్యక్ష పాత్ర పేతురు; తరువాతి సంబోధన అతనికే వర్తిస్తుంది. అయితే పేతురే అక్షరార్థంగా సాతాను అని అదనపు నిర్ధారణను అనువాదం చేయదు.
- issue: ‘దేవుని విషయాలు’ మరియు ‘మనుషుల విషయాలు’ అనే వ్యత్యాసం
  choice: రెండు విస్తృత పదబంధాలనూ ‘విషయాలు’ అని సమాంతరంగా ఉంచడం.
  alternative: వాటిని ‘దేవుని చిత్తం’ మరియు ‘మానవ ప్రయోజనాలు’ అని వివరణాత్మకంగా అనువదించడం.
  rationale: మూలంలోని విస్తృతి, సమాంతర నిర్మాణం, ధార్మిక ఉద్వేగం నిలుస్తాయి; ఒకే నిర్దిష్ట వ్యాఖ్యానానికి భావాన్ని కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలి ఉపయోగించబడింది. ‘గద్దిస్తూ’, ‘నా వెనుకకు పో’ అనే పదాలు వాక్యంలోని తీవ్రతను, స్థలసంబంధ రూపకాన్ని నిలుపుతాయి. గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే భాషను ఎంచుకున్నాం.
