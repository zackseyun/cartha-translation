id: MRK.8.36
reference: Mark 8:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τί γὰρ ⸀ὠφελεῖ ⸀ἄνθρωπον ⸂κερδῆσαι τὸν κόσμον ὅλον καὶ ζημιωθῆναι⸃ τὴν ψυχὴν αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/036.yaml
  text: For what does it profit a man to gain the whole world and forfeit his life?[a][b]
translation:
  language: te
  text: ఎందుకంటే, ఒక మనిషి[b] లోకమంతటినీ సంపాదించుకొని తన ప్రాణాన్ని[a] కోల్పోతే, అతనికి ఏమి ప్రయోజనం?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన ఆత్మను.’ గ్రీకు ψυχή అనే పదానికి సందర్భానుసారం ‘ప్రాణం,’ ‘జీవితం,’ ‘ఆత్మ,’ లేదా ‘స్వయం’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘ఒక మనిషి’ అనేది సాధారణంగా ఏ మానవునినైనా సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: τί γὰρ
  choice: ఎందుకంటే, ... ఏమి
  rationale: τί అలంకార ప్రశ్నను ప్రవేశపెడుతుంది; γάρ ముందున్న బోధకు వివరణాత్మక సంబంధాన్ని చూపుతుంది. తెలుగులో ‘ఎందుకంటే’ మరియు ‘ఏమి’ కలిపి ఈ రెండు భావాలనూ సహజంగా నిలుపుతాయి.
- source_word: ὠφελεῖ
  choice: ప్రయోజనం
  rationale: ὠφελέω అంటే మేలు చేయడం లేదా లాభం కలిగించడం. ‘ప్రయోజనం’ సంపాదించడం–కోల్పోవడం అనే ఆర్థిక రూపకంతో సరిపోతూ ప్రశ్నను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἄνθρωπον
  choice: ఒక మనిషి
  rationale: ἄνθρωπος ఇక్కడ ఏ మానవునికైనా వర్తించే ఏకవచన సాధారణ ప్రయోగం. ‘ఒక మనిషి’ మూలంలోని ఏకవచన రూపాన్ని నిలుపుతుంది.
- source_word: κερδῆσαι
  choice: సంపాదించుకొని
  rationale: κερδαίνω లాభపడడం లేదా సంపాదించడం అనే అర్థం ఇస్తుంది. ‘సంపాదించుకొని’ లోకమంతటినీ పొందడాన్ని, తదుపరి నష్టంతో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా చూపుతుంది.
- source_word: τὸν κόσμον ὅλον
  choice: లోకమంతటినీ
  rationale: κόσμος ఇక్కడ ప్రపంచాన్ని సమగ్రంగా సూచిస్తుంది; ὅλον దాని సంపూర్ణతను నొక్కి చెబుతుంది. ‘లోకమంతటినీ’ ఈ సమగ్ర పరిధిని సహజంగా తెలియజేస్తుంది.
- source_word: ζημιωθῆναι
  choice: కోల్పోతే
  rationale: ζημιόω కర్మణి రూపంలో నష్టపోవడం లేదా విలువైనదాన్ని కోల్పోవడం అనే భావం ఉంది. ‘కోల్పోతే’ సంపాదించడం–నష్టపోవడం అనే వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: తన ప్రాణాన్ని
  rationale: ψυχή సందర్భానుసారం ప్రాణం, జీవితం, ఆత్మ లేదా స్వయం అనే భావాలు కలిగి ఉంటుంది. మార్కు 8:35–37లో ప్రాణాన్ని కాపాడుకోవడం లేదా పోగొట్టుకోవడం అనే సందర్భానికి ‘తన ప్రాణాన్ని’ సహజంగా సరిపోతుంది; ‘ఆత్మను’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: శిష్యత్వ బోధలో ψυχή పదాన్ని ‘ప్రాణం’గా లేదా ‘ఆత్మ’గా అనువదించడం
  choice: ప్రాణం
  alternative: ఆత్మ
  rationale: మార్కు 8:35లో ψυχήను కాపాడుకోవడం లేదా యేసు మరియు సువార్త నిమిత్తం పోగొట్టుకోవడం గురించి ఉన్న తక్షణ సందర్భం ‘ప్రాణం’ అనే భావానికి బలం ఇస్తుంది. ఇది ఒక నిర్దిష్ట మానవ స్వభావ సిద్ధాంతాన్ని అనువాదంలోకి చొప్పించకుండా సందర్భంలోని విరోధాభాసాన్ని నిలుపుతుంది. అయితే ‘ఆత్మ’ కూడా సాధ్యమైన, సంప్రదాయబద్ధమైన అర్థం కాబట్టి పాదటిప్పణిలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన అలంకార ప్రశ్నగా రూపొందించబడింది. ‘లోకమంతటినీ సంపాదించుకొని’ మరియు ‘కోల్పోతే’ అనే పదబంధాలు మూలంలోని లాభ–నష్టం వ్యత్యాసాన్ని నిలుపుతాయి; పాదటిప్పణి సూచికలు సంబంధిత పదాల వెంటనే ఉంచబడ్డాయి.
