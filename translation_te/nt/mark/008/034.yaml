id: MRK.8.34
reference: Mark 8:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ εἶπεν αὐτοῖς· ⸂Εἴ τις⸃ θέλει ὀπίσω μου ⸀ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/034.yaml
  text: And after calling the crowd together with his disciples[a], he said to them, “If anyone wants to come after me, let him deny himself, take up his cross[b], and follow me.”
translation:
  language: te
  text: 'ఆయన తన శిష్యులతో పాటు జనసమూహాన్ని తన దగ్గరికి పిలిచి, వారితో ఇలా అన్నాడు: “ఎవరైనా నా వెంబడి రావాలని కోరుకుంటే, తనను తాను నిరాకరించుకొని, తన సిలువను[a] ఎత్తుకొని, నన్ను అనుసరించాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తన సిలువను ఎత్తుకోవడం” అనే మాటను కేవలం ఏదో ఒక భారాన్ని లేదా కష్టాన్ని భరించడంగా మార్చకుండా, మూలపాఠంలోని సిలువ చిత్రాన్ని యథాతథంగా ఉంచాం.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: తన దగ్గరికి పిలిచి
  rationale: ఈ మధ్యప్రయోగ కృదంతం జనసమూహాన్ని తనవద్దకు పిలిచిన భావాన్ని, ప్రధాన క్రియకు ముందున్న చర్యగా సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τὸν ὄχλον
  choice: జనసమూహాన్ని
  rationale: ὄχλος సూచించే గుంపును ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: తన శిష్యులతో పాటు
  rationale: σύν తెలిపే సహవాస భావాన్ని నిలుపుతూ, జనసమూహం మరియు శిష్యులు ఇద్దరూ పిలువబడి సంబోధించబడ్డారని స్పష్టం చేస్తుంది.
- source_word: Εἴ τις θέλει
  choice: ఎవరైనా ... కోరుకుంటే
  rationale: τις యొక్క అనిర్దిష్ట, అందరికీ తెరిచిన భావాన్ని మరియు θέλει యొక్క సంకల్ప భావాన్ని సహజమైన షరతు వాక్యంగా అందిస్తుంది.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: నా వెంబడి రావాలని
  rationale: శిష్యత్వానికి సంబంధించిన ‘నా వెనుక రావడం’ అనే రూపకాన్ని నిలుపుతుంది; తరువాతి ἀκολουθείτω మοι ను వేరుగా ‘నన్ను అనుసరించాలి’ అని అనువదించడానికి వీలు కల్పిస్తుంది.
- source_word: ἀπαρνησάσθω ἑαυτόν
  choice: తనను తాను నిరాకరించుకొని
  rationale: స్వీయనిరాకరణ అనే బలమైన ఆజ్ఞను నిలుపుతుంది; దానిని కేవలం చిన్న కోరికలను అదుపుచేసుకోవడంగా సంకుచితం చేయదు.
- source_word: ἀράτω
  choice: ఎత్తుకొని
  rationale: αἴρω యొక్క ‘పైకి ఎత్తుకొని మోయడానికి స్వీకరించడం’ అనే భావాన్ని ఈ సిలువ రూపకంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: తన సిలువను
  rationale: σταυρός ను ‘బాధ’ లేదా ‘భారం’ అని వివరణాత్మకంగా మార్చకుండా సిలువ అనే చారిత్రక, రూపకాలంకార చిత్రాన్ని యథాతథంగా ఉంచుతుంది; αὐτοῦ వ్యక్తిగత అన్వయాన్ని నిలుపుతుంది.
- source_word: ἀκολουθείτω μοι
  choice: నన్ను అనుసరించాలి
  rationale: వర్తమాన ఆజ్ఞార్థక క్రియలోని కొనసాగుతున్న శిష్యత్వ భావాన్ని సహజమైన తెలుగులో ఆజ్ఞాత్మక అవసరంగా తెలియజేస్తుంది.
theological_decisions:
- issue: శిష్యత్వ ఆజ్ఞల బలం
  choice: ‘ఎవరైనా ... కోరుకుంటే’ అనే అందరికీ తెరిచిన షరతుతో పాటు, ‘నిరాకరించుకొని ... ఎత్తుకొని ... అనుసరించాలి’ అనే తప్పనిసరి ఆజ్ఞాత్మక బలాన్ని ఉంచడం.
  alternative: ప్రతి క్రియతో విడివిడిగా ‘తప్పక’ అని చేర్చడం.
  rationale: గ్రీకులో షరతు వాక్యం తరువాత మూడవ పురుష ఆజ్ఞార్థక క్రియలు ఉన్నాయి. తెలుగు రూపం ఆహ్వానంలోని స్వేచ్ఛను, శిష్యత్వ పిలుపులోని నిర్బంధ బలాన్ని రెండింటినీ ఏ మతశాఖ వ్యాఖ్యానాన్నీ చేర్చకుండా నిలుపుతుంది.
- issue: σταυρός యొక్క అర్థం
  choice: ‘సిలువ’ అని అక్షరార్థ చిత్రాన్ని నిలుపడం.
  alternative: ‘భారం,’ ‘బాధ,’ లేదా ‘మరణశిక్ష సాధనం’ అని వివరణాత్మకంగా మార్చడం.
  rationale: ఈ రూపకం రోమా సిలువ అనే చారిత్రక వాస్తవంలో పాతుకుపోయింది. దానిని కేవలం సాధారణ బాధగా మార్చడం మూలపాఠంలోని తీవ్రతను, విస్తృతిని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన వాక్యనిర్మాణంతో పాటు గంభీరమైన బైబిలు శైలిని నిలిపింది. ‘నా వెంబడి రావడం’ మరియు ‘నన్ను అనుసరించడం’ అనే మూలపాఠంలోని రెండు సంబంధిత కాని వేర్వేరు పదబంధాలను వేరుగా ఉంచింది.
