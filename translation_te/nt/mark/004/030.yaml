source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν· ⸀Πῶς ὁμοιώσωμεν τὴν βασιλείαν τοῦ θεοῦ, ἢ ἐν ⸀τίνι ⸂αὐτὴν παραβολῇ θῶμεν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/030.yaml
  text: And he was saying[a], “How should we compare the kingdom of God, or in what parable should we set it forth?”
translation:
  language: te
  text: 'ఆయన ఇలా చెబుతూ ఉన్నాడు: “దేవుని రాజ్యాన్ని ఎలా పోల్చుదాం? లేక ఏ ఉపమానంలో దాన్ని చూపుదాం[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఏ ఉపమానం ద్వారా దాన్ని వివరించుదాం?” గ్రీకు పదబంధాన్ని సాధనార్థకంగా కూడా అనువదించవచ్చు; అప్పుడు దేవుని రాజ్యాన్ని వివరించడానికి ఉపమానం ఒక సాధనమని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ఇలా చెబుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న లేదా పునరావృతమవుతున్న మాటల భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: Πῶς
  choice: ఎలా
  rationale: పోల్చే విధానాన్ని అడిగే ప్రశ్నను నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁμοιώσωμεν
  choice: పోల్చుదాం
  rationale: మొదటి పురుష బహువచన deliberative subjunctive భావాన్ని ‘పోల్చుదాం’ సహజంగా నిలుపుతుంది.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: ‘దేవుని రాజ్యం’ స్థిరపడిన, పారదర్శకమైన తెలుగు పదబంధం; రాజ్యం మరియు రాజపాలన రెండింటి భావపరిధినీ తెరిచి ఉంచుతుంది.
- source_word: ἐν τίνι ... παραβολῇ
  choice: ఏ ఉపమానంలో
  rationale: ἐν అనే విభక్తి సంబంధాన్ని స్థల/పరిధి భావంతో దగ్గరగా నిలుపుతూ తెలుగులో అర్థమయ్యేలా ఉంటుంది; సాధనార్థక పఠనాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: παραβολῇ
  choice: ఉపమానం
  rationale: సువార్తలలోని ఈ బోధనా రూపానికి తెలుగులో స్థిరమైన, సందర్భోచితమైన పదం.
- source_word: αὐτὴν ... θῶμεν
  choice: దాన్ని చూపుదాం
  rationale: ‘ఉంచుదాం’ అనే అక్షరార్థ రూపం తెలుగులో కృత్రిమంగా ఉంటుంది; ఉపమానంలో ఒక విషయాన్ని ముందుంచి వెల్లడించే τίθημι భావాన్ని ‘చూపుదాం’ సహజంగా అందిస్తుంది.
