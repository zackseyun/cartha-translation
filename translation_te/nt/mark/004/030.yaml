  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. గ్రీకు వాక్యంలోని రెండు సమాంతర deliberative ప్రశ్నలు నిలుపబడ్డాయి; ἐν యొక్క నిజమైన వ్యాకరణ అస్పష్టతను ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా సంరక్షించాం.
