id: MRK.4.21
reference: Mark 4:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν ⸀αὐτοῖς· Μήτι ⸂ἔρχεται ὁ λύχνος⸃ ἵνα ὑπὸ τὸν μόδιον τεθῇ ἢ ὑπὸ τὴν κλίνην, οὐχ ἵνα ἐπὶ τὴν λυχνίαν ⸀τεθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/021.yaml
  text: And he was saying to them[a], “A lamp does not come to be put under a basket or under a bed[b], does it? Is it not to be put on the lampstand?”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా చెబుతూ ఉన్నాడు: “దీపం[a] కొలపాత్ర[b] కిందో మంచం కిందో పెట్టబడడానికి వస్తుందా? దీపస్తంభం మీద పెట్టబడడానికే కదా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత సహజమైన అనువాదంలో, “దీపాన్ని కొలపాత్ర కిందో మంచం కిందో పెట్టడానికి తీసుకొస్తారా?” అని చెప్పవచ్చు. గ్రీకులో దీపమే ‘వస్తుంది’ అన్న సజీవమైన వ్యక్తీకరణ ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘కొలపాత్ర’ అని అనువదించిన గ్రీకు పదం పొడి పదార్థాలను కొలిచే ప్రమాణాన్నీ, ఆ కొలతకు ఉపయోగించే పాత్రనూ సూచిస్తుంది; సాంప్రదాయంగా దీనిని ‘బుషెల్’ అని అనువదించారు.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: ఇలా అంటూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న మాటల భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Μήτι
  choice: '... వస్తుందా?'
  rationale: ప్రతికూల సమాధానాన్ని ఆశించే గ్రీకు ప్రశ్నను తెలుగులో సందర్భసహజమైన అలంకారిక ప్రశ్నగా నిలుపుతుంది.
- source_word: ἔρχεται ὁ λύχνος
  choice: దీపం ... పెట్టబడడానికి వస్తుందా?
  rationale: దీపాన్ని వ్యక్తీకరించే గ్రీకు భాషా చిత్రాన్ని వ్యాఖ్యానాత్మక కర్మణి రూపంగా మార్చకుండా సాధ్యమైనంతగా నిలుపుతుంది.
- source_word: λύχνος
  choice: దీపం
  rationale: ఇది వెలుగు అనే అమూర్త భావాన్ని కాకుండా చేతితో తీసుకువెళ్లగల నూనె దీపాన్ని సూచిస్తుంది.
- source_word: μόδιον
  choice: కొలపాత్ర
  rationale: మోదియోస్ అనేది పొడి పదార్థాలను కొలిచే ప్రమాణమూ, ఆ కొలతకు వాడే పాత్రయూ; ‘కొలపాత్ర’ ఆ సాంస్కృతిక భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: κλίνην
  choice: మంచం
  rationale: ఇంటి సందర్భంలో κλίνη సూచించే పడక లేదా పరుపు పీటకు సాధారణ ఆధునిక తెలుగు పదం.
- source_word: λυχνίαν
  choice: దీపస్తంభం
  rationale: దీపాన్ని ఉంచే ప్రత్యేక ఆధారాన్ని సూచించి, ఇంటి దృశ్యాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τεθῇ
  choice: పెట్టబడడానికి / పెట్టబడడానికే
  rationale: τίθημι యొక్క కర్మణి భావాన్నీ, ἵνα తెలిపే ఉద్దేశాన్నీ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘దీపం వస్తుంది’ అనే మూలంలోని వ్యక్తీకరణను నిలపాలా, లేక ‘దీపాన్ని తీసుకొస్తారా’ అని సహజీకరించాలా?
  choice: ‘దీపం ... పెట్టబడడానికి వస్తుందా?’ అని వ్యక్తీకరణను నిలిపాం.
  alternative: ‘దీపాన్ని ... పెట్టడానికి తీసుకొస్తారా?’
  rationale: సామెతలాంటి ఈ మాటలోని సజీవమైన గ్రీకు చిత్రాన్ని నిలపడం మూలానికి దగ్గరగా ఉంటుంది; పాదసూచిక సాధారణ భావాన్ని వివరిస్తుంది.
- issue: ὁ λύχνος లోని నిర్దిష్ట ఉపపదాన్ని ఎలా వ్యక్తం చేయాలి?
  choice: సాధారణ సూత్రాన్ని సూచించే ‘దీపం’ అని అనువదించాం.
  alternative: ‘ఆ దీపం’
  rationale: ఇక్కడ ఒక నిర్దిష్ట దీపం ఉద్దేశం కాదు; ఏ దీపానికైనా వర్తించే సాధారణ సత్యం ఉద్దేశం. తెలుగు నామవాచకం సహజంగానే ఈ సాధారణ భావాన్ని మోయగలదు.
- issue: రెండవ ప్రశ్నలోని οὐχ ఆశించే సానుకూల సమాధానాన్ని ఎలా నిలపాలి?
  choice: ‘పెట్టబడడానికే కదా?’
  alternative: ‘పెట్టబడడానికి కాదా?’
  rationale: ‘కదా’ రూపం ఆశించిన అంగీకారాన్ని సహజ తెలుగులో స్పష్టంగా వినిపిస్తూ అలంకారిక బలాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన సంభాషణ శైలిని వాడాం. గ్రీకు వాక్యంలోని దీపపు వ్యక్తీకరణను ప్రధాన పాఠ్యంలో నిలిపి, సహజీకరించిన అర్థాన్ని పాదసూచికలో ఇచ్చాం. అలంకారిక ప్రశ్నల ప్రతికూల–సానుకూల అంచనాలను ‘వస్తుందా?’ మరియు ‘కదా?’ ద్వారా వ్యక్తం చేశాం.
