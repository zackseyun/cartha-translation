id: MRK.4.31
reference: Mark 4:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς ⸀κόκκῳ σινάπεως, ὃς ὅταν σπαρῇ ἐπὶ τῆς γῆς, ⸂μικρότερον ὂν⸃ πάντων τῶν ⸀σπερμάτων τῶν ἐπὶ τῆς γῆς—
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/031.yaml
  text: It is like a mustard seed[a], which, when it is sown on the ground[b], being smaller than all the seeds on the ground—
translation:
  language: te
  text: అది ఆవగింజ[a] లాంటిది. దాన్ని నేలలో విత్తినప్పుడు, అది నేలలోని విత్తనాలన్నిటికంటే చిన్నదిగా ఉంటుంది[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆవ విత్తనం.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ‘అతి చిన్నది’ అనే అత్యుత్తమ రూపం కాదు; ‘అన్నిటికంటే చిన్నది’ అనే తులనాత్మక రూపం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: అది ... లాంటిది
  rationale: మునుపటి వచనంలోని దేవుని రాజ్యాన్ని దేనితో పోల్చాలనే ప్రశ్నపై ఆధారపడిన అసంపూర్ణ గ్రీకు పోలికను సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: κόκκῳ σινάπεως
  choice: ఆవగింజ
  rationale: κόκκος అంటే గింజ లేదా విత్తనం; సినాపి మొక్క గింజకు ఆధునిక తెలుగులో సహజంగా అర్థమయ్యే పదం ‘ఆవగింజ’.
- source_word: ὅταν σπαρῇ
  choice: విత్తినప్పుడు
  rationale: అనిర్దిష్ట కాలార్థమున్న ὅταν మరియు కర్మణి క్రియను సాధారణ ఉదాహరణకు తగిన సహజ తెలుగు కర్మణి నిర్మాణంతో అందిస్తుంది.
- source_word: ἐπὶ τῆς γῆς
  choice: నేలలో
  rationale: వ్యవసాయ సందర్భంలో γῆ ప్రపంచాన్ని కాక మట్టిని సూచిస్తుంది. తెలుగు వాడుకలో విత్తనాన్ని ‘నేలలో విత్తడం’ సహజం; ఇది గ్రీకు ἐπίని యాంత్రికంగా అనుకరించకుండా సందర్భార్థాన్ని అందిస్తుంది.
- source_word: μικρότερον ὂν
  choice: చిన్నదిగా ఉంటుంది
  rationale: μικρότερονలోని తులనాత్మక భావాన్ని ‘అన్నిటికంటే చిన్నదిగా’ అనే తెలుగు తులన నిర్మాణంలో ఉంచి, వాక్యాన్ని సహజంగా పూర్తి చేస్తుంది.
- source_word: πάντων τῶν σπερμάτων τῶν ἐπὶ τῆς γῆς
  choice: నేలలోని విత్తనాలన్నిటికంటే
  rationale: తులనాత్మక షష్ఠీ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తూ, గ్రీకులో పునరుక్తమైన నేల సంబంధిత పరిమితిని నిలుపుతుంది.
theological_decisions:
- issue: ఆవగింజ పరిమాణాన్ని తులనాత్మకంగా లేదా అత్యుత్తమ స్థాయిగా చెప్పడం
  choice: విత్తనాలన్నిటికంటే చిన్నదిగా ఉంటుంది
  alternative: విత్తనాలన్నిటిలోకెల్లా అతి చిన్నది
  rationale: గ్రీకులో స్పష్టమైన అత్యుత్తమ రూపం కాక μικρότερον అనే తులనాత్మక రూపం ఉంది. తెలుగు ‘అన్నిటికంటే చిన్నది’ మూలంలోని విస్తృత పోలికను నిలుపుతుంది; ‘అతి చిన్నది’ అనే మరింత బలమైన పదాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండే ‘ఆవగింజ’, ‘నేలలో విత్తడం’ పదబంధాలు వాడబడ్డాయి. మూలవాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివర దీర్ఘ విరామచిహ్నం ఉంచబడింది.
