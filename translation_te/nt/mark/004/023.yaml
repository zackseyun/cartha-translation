review_pass:
  verdict: revise
  source_fidelity: The conditional, the plural ‘ears,’ and the repeated verb ‘విను’ are retained. However, the Greek third-person present imperative ἀκουέτω is better represented in Telugu by an explicit imperative/volitive form than by ‘వినాలి,’ which can primarily express obligation (‘should/must hear’).
  naturalness: The draft is understandable and suitably concise. ‘ఎవరికైనా … అతడు’ is grammatically possible but sounds somewhat less smooth in modern standard Telugu because the indefinite antecedent and masculine pronoun are separated. ‘ఆ వ్యక్తి’ gives a natural singular generic reference without introducing male-specific meaning absent from τις.
  terminology: No special theological terminology occurs. ‘వినడానికి చెవులు’ appropriately preserves the idiomatic wording and the rhetorical repetition of ἀκούειν / ἀκουέτω.
  issues:
  - severity: medium
    issue: ‘వినాలి’ weakens the imperative force of ἀκουέτω.
    rationale: ἀκουέτω is a present active imperative, not merely a statement of what someone ought to do. ‘విననివ్వండి’ is an idiomatic modern Telugu third-person imperative and retains the command-like force.
  - severity: low
    issue: The masculine pronoun ‘అతడు’ can imply specifically male reference in Telugu.
    rationale: The Greek τις is an indefinite generic singular, not a male-specific noun. A singular neutral expression such as ‘ఆ వ్యక్తి’ preserves singularity without adding a gender specification. The footnote should describe the actual Telugu alternative clearly.
  revised_text: ఎవరికైనా వినడానికి చెవులు ఉంటే[a], ఆ వ్యక్తి విననివ్వండి.
