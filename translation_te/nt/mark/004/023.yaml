  text: If anyone has ears to hear[a], let him hear.
translation:
  language: te
  text: ఎవరికైనా వినడానికి చెవులు ఉంటే[a], ఆ వ్యక్తి విననివ్వండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత సాంప్రదాయికంగా: “ఎవరికైనా వినడానికి చెవులు ఉంటే, అతడు విననివ్వండి.” గ్రీకు వాక్యం అనిర్దిష్ట ఏకవచనంలో ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: ఎవరికైనా … ఉంటే
  rationale: గ్రీకు షరతు రూపాన్నీ, అందరినీ ఉద్దేశించే అనిర్దిష్ట భావాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἔχει ὦτα
  choice: చెవులు ఉంటే
  rationale: స్వాధీనాన్ని సూచించే ἔχειకి తెలుగు సహజ ప్రయోగం ‘ఉండు’; ὦτα యొక్క బహువచనాన్ని యథాతథంగా ఉంచింది.
- source_word: ἀκούειν
  choice: వినడానికి
  rationale: ఉద్దేశం లేదా సామర్థ్యాన్ని సూచించే ధాతురూపాన్ని సహజంగా తెలియజేస్తూ, తరువాతి ἀκουέτωతో ఉన్న పదపునరుక్తిని నిలుపుతుంది.
- source_word: ἀκουέτω
  choice: వినాలి
  rationale: మూడవ పురుష ఏకవచన ఆజ్ఞార్థక భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: అనిర్దిష్ట వ్యక్తిని సూచించే ఏకవచన ఆజ్ఞ
  choice: అతడు వినాలి
  alternative: వారు వినాలి
  rationale: గ్రీకులో τιςతో పాటు మూడవ పురుష ఏకవచన ఆజ్ఞ ఉంది. మూలంలోని ప్రతినిధి ఏకవచనాన్ని నిలుపుతూ, బహువచనంగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సరళంగా, అయితే వాక్యంలోని సూక్తిరూప గంభీరతను మరియు ‘విను’ అనే క్రియ పునరుక్తిని నిలిపింది.
