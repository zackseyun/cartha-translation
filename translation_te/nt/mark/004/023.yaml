revisions:
- from: ఎవరికైనా వినడానికి చెవులు ఉంటే[a], అతడు వినాలి.
  to: ఎవరికైనా వినడానికి చెవులు ఉంటే[a], ఆ వ్యక్తి విననివ్వండి.
  rationale: The revision retains the Greek conditional saying, the plural ‘ears,’ and the deliberate repetition of ‘విను.’ It uses a singular gender-neutral Telugu referent for τις and an explicit third-person imperative for ἀκουέτω. The footnote preserves the traditional masculine-singular alternative while accurately noting the Greek’s indefinite singular form.
