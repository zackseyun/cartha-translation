  text: And as he was sowing[a], some seed fell along the path, and the birds came and devoured it.
translation:
  language: te
  text: ఆయన విత్తుతుండగా, విత్తనంలో కొంత దారి పక్కన[a] పడింది. పక్షులు వచ్చి దాన్ని తినివేశాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దారి వెంట.’ గ్రీకు పదబంధం దారికి పక్కగా లేదా దాని వెంట అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ σπείρειν
  choice: ఆయన విత్తుతుండగా
  rationale: ἐγένετο ἐν + క్రియార్థక నామరూపం ఇక్కడ ఒక పని జరుగుతున్న సమయంలో జరిగినదాన్ని తెలిపే కథన ప్రయోగం. ‘ఆయన విత్తుతుండగా’ కాలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ὃ μὲν
  choice: విత్తనంలో కొంత
  rationale: నపుంసక ఏకవచన సంబంధసర్వనామం μένతో కలిసి చల్లబడుతున్న విత్తనంలోని ఒక భాగాన్ని సూచిస్తుంది. ‘విత్తనంలో కొంత’ ఆ విభాగార్థాన్ని, సమష్టి ఏకవచన భావాన్ని నిలుపుతుంది.
- source_word: ἔπεσεν
  choice: పడింది
  rationale: πίπτω క్రియకు ఈ సందర్భంలో నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: παρὰ τὴν ὁδόν
  choice: దారి పక్కన
  rationale: παρά + ద్వితీయా విభక్తి ఇక్కడ దారికి ఆనుకొని లేదా దాని వెంట ఉన్న స్థానాన్ని సూచిస్తుంది. పొలం సందర్భంలో ‘దారి పక్కన’ సహజంగా ఉంటుంది; ‘దారి వెంట’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: τὰ πετεινὰ
  choice: పక్షులు
  rationale: πετεινά సాధారణంగా పక్షులను సూచిస్తుంది. ఈ వచనంలో ‘ఆకాశపు’ వంటి అదనపు విశేషణం లేదు.
- source_word: κατέφαγεν
  choice: మింగివేశాయి
  rationale: κατεσθίω సాధారణంగా తినడం కంటే పూర్తిగా తినివేయడాన్ని బలంగా సూచిస్తుంది. ‘మింగివేశాయి’ ఆ తీవ్రతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: αὐτό
  choice: దాన్ని
  rationale: ఈ ఏకవచన సర్వనామం సమష్టిగా చెప్పబడిన విత్తనభాగాన్ని తిరిగి సూచిస్తుంది; ‘దాన్ని’ ఆ ఏకవచన అనుసంధానాన్ని నిలుపుతుంది.
