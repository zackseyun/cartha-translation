id: MRK.4.34
reference: Mark 4:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: χωρὶς δὲ παραβολῆς οὐκ ἐλάλει αὐτοῖς, κατ’ ἰδίαν δὲ τοῖς ⸂ἰδίοις μαθηταῖς⸃ ἐπέλυεν πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/034.yaml
  text: And he was not speaking to them without a parable[b][a], but in private he was explaining everything to his own disciples.
translation:
  language: te
  text: ఆయన ఉపమానం లేకుండా వారితో మాట్లాడేవాడు కాదు; అయితే ఏకాంతంలో తనవారైన శిష్యులకు అన్నిటినీ వివరించేవాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వివరించేవాడు’ అనే పదాన్ని ‘అర్థం చెప్పేవాడు’ లేదా ‘వ్యాఖ్యానించేవాడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς ... παραβολῆς
  choice: ఉపమానం లేకుండా
  rationale: గ్రీకు పదబంధంలోని ‘లేకుండా/వేరుగా’ అనే భావాన్ని, ఏకవచనంలోని ‘ఉపమానం’ను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: οὐκ ἐλάλει αὐτοῖς
  choice: వారికి ఏమీ చెప్పేవాడు కాదు
  rationale: నిరాకరణతో కూడిన గ్రీకు అసంపూర్ణ భూతకాలం ఇక్కడ అలవాటుగా లేదా పునరావృతంగా జరిగేదాన్ని సూచిస్తుంది; ‘చెప్పేవాడు కాదు’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది. తెలుగులో ‘ఏమీ’ చేర్చడం నిరాకరణను సహజంగా చేస్తుంది.
- source_word: κατ’ ἰδίαν
  choice: ఏకాంతంగా ఉన్నప్పుడు
  rationale: బహిరంగంగా ఉపమానాలతో చెప్పడానికి విరుద్ధంగా, ఇతరులకు దూరంగా వ్యక్తిగతంగా వివరించిన సందర్భాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τοῖς ἰδίοις μαθηταῖς
  choice: తన సొంత శిష్యులకు
  rationale: ἰδίοις లోని ‘తనవారైన/సొంత’ అనే ప్రత్యేక ఉద్ఘాటనను వదలకుండా కాపాడుతుంది.
- source_word: ἐπέλυεν
  choice: వివరించేవాడు
  rationale: ఈ సందర్భంలో ‘వివరించడం, అర్థం చెప్పడం, వ్యాఖ్యానించడం’ అనే అర్థపరిధిని కలిగి ఉంది; అసంపూర్ణ భూతకాలంలోని పునరావృత భావాన్ని ‘వివరించేవాడు’ నిలుపుతుంది.
- source_word: πάντα
  choice: అన్నిటినీ
  rationale: గ్రీకు మూలంలోని సమగ్రతను కాపాడుతూ, దాని పరిధిని కేవలం ఉపమానాలకు లేదా ఆయన చెప్పిన మాటలకు అనువాదంలోనే పరిమితం చేయదు.
theological_decisions:
- issue: యేసు ఏకాంతంగా వివరించిన వాటి పరిధి
  choice: πάντα ను ‘అన్నిటినీ’ అని అనువదించి పరిధిని నిర్దిష్టంగా కుదించలేదు.
  alternative: ‘ఉపమానాలన్నిటినీ’ లేదా ‘తాను చెప్పినవన్నీ’
  rationale: సందర్భం ఉపమానాలను సూచించవచ్చుగానీ, గ్రీకు వాక్యం కేవలం ‘అన్నిటినీ’ అంటుంది. అందువల్ల మూలంలోని విస్తృతతను, సాధ్యమైన అనిశ్చితిని అలాగే ఉంచడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గంభీరతను కాపాడుతూ అనువదించబడింది. ‘తన సొంత శిష్యులకు’ ద్వారా గ్రీకు ἰδίοις లోని ఉద్ఘాటనను ప్రధాన వాక్యంలోనే నిలిపినందున దానికి ప్రత్యేక పాదసూచిక అవసరం లేదు.
