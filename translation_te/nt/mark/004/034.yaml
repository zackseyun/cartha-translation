    reason: lexical_alternative
  revision_rationale: The revision removes the added temporal nuance from the private setting, makes the first clause more closely mirror the Greek construction, and retains the imperfect habitual sense, the emphatic reference to Jesus’ own disciples, and the unrestricted scope of ‘everything.’
