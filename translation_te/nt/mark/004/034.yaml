revisions:
- from: ఆయన ఉపమానం లేకుండా వారికి ఏమీ చెప్పేవాడు కాదు; అయితే ఏకాంతంగా ఉన్నప్పుడు తన సొంత శిష్యులకు అన్నిటినీ వివరించేవాడు.[a]
  to: ఆయన ఉపమానం లేకుండా వారితో మాట్లాడేవాడు కాదు; అయితే ఏకాంతంలో తనవారైన శిష్యులకు అన్నిటినీ వివరించేవాడు.[a]
  rationale: The revision removes the added temporal nuance from the private setting, makes the first clause more closely mirror the Greek construction, and retains the imperfect habitual sense, the emphatic reference to Jesus’ own disciples, and the unrestricted scope of ‘everything.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:01:09Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the customary/iterative force of both imperfect verbs, the comprehensive πάντα (‘అన్నిటినీ’), and the possessive emphasis in τοῖς ἰδίοις μαθηταῖς. However, ‘ఏకాంతంగా ఉన్నప్పుడు’ introduces a temporal conditional (‘when [he] was alone’) not expressed by κατ’ ἰδίαν, which means ‘privately/in private.’
  naturalness: ‘ఉపమానం లేకుండా వారితో మాట్లాడేవాడు కాదు’ is more direct and idiomatic than ‘వారికి ఏమీ చెప్పేవాడు కాదు,’ while retaining the intended negated manner of speaking. ‘ఏకాంతంలో’ naturally expresses the private setting without supplying an unstated condition. ‘తనవారైన శిష్యులకు’ is natural modern Telugu and preserves the emphasis of ἰδίοις.
  terminology: ‘ఉపమానం,’ ‘శిష్యులు,’ and ‘వివరించేవాడు’ are appropriate modern standard Telugu renderings. The footnote appropriately records viable lexical alternatives for ἐπέλυεν without imposing a narrower interpretive sense.
  issues:
  - severity: medium
    issue: ‘ఏకాంతంగా ఉన్నప్పుడు’ adds a temporal condition.
    rationale: κατ’ ἰδίαν is an adverbial expression meaning ‘privately’ or ‘in private’; it does not say ‘when he was alone.’ ‘ఏకాంతంలో’ preserves the source wording more closely.
  - severity: low
    issue: ‘వారికి ఏమీ చెప్పేవాడు కాదు’ is less direct than the Greek construction.
    rationale: Although not materially wrong, the Greek says that he was not speaking to them without a parable. ‘ఉపమానం లేకుండా వారితో మాట్లాడేవాడు కాదు’ retains that relationship more transparently.
  revised_text: ఆయన ఉపమానం లేకుండా వారితో మాట్లాడేవాడు కాదు; అయితే ఏకాంతంలో తనవారైన శిష్యులకు అన్నిటినీ వివరించేవాడు.[a]
  revised_footnotes:
