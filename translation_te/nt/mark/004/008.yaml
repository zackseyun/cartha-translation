source:
  edition: SBLGNT
  text: καὶ ⸀ἄλλα ἔπεσεν εἰς τὴν γῆν τὴν καλήν, καὶ ἐδίδου καρπὸν ἀναβαίνοντα καὶ ⸀αὐξανόμενα, καὶ ἔφερεν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/008.yaml
  text: And other seed fell into the good soil[a], and it was producing fruit, growing up and increasing, and bearing thirtyfold and sixtyfold and a hundredfold.
translation:
  language: te
  text: మరికొన్ని విత్తనాలు మంచి నేలలో[a] పడ్డాయి; అవి మొలకెత్తి పెరుగుతూ ఫలాన్ని ఇస్తూ, ముప్పై రెట్లు, అరవై రెట్లు, నూరు రెట్లు దిగుబడినిచ్చాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సందర్భం నుండి ‘విత్తనాలు’ అని అర్థం చేసుకొని, “మరికొన్ని మంచి నేలలో పడ్డాయి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: మరికొన్ని విత్తనాలు
  rationale: ఇది నపుంసక బహువచన విశేషణం; ఉపమాన సందర్భంలో ఇంతకుముందు చెప్పిన విత్తనాలను సూచిస్తుంది. ఆధునిక తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు ‘విత్తనాలు’ చేర్చబడింది.
- source_word: γῆν τὴν καλήν
  choice: మంచి నేల
  rationale: విత్తే వ్యవసాయ సందర్భంలో γῆ భౌగోళిక ‘దేశం’ లేదా ‘భూమి’ కంటే పంటకు అనుకూలమైన నేలను సూచిస్తుంది.
- source_word: ἐδίδου καρπὸν
  choice: ఫలించాయి
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న ఫల ఉత్పత్తిని సూచిస్తుంది; ‘ఫలించాయి’ సహజమైన, సంక్షిప్తమైన తెలుగు ప్రయోగం.
- source_word: ἀναβαίνοντα
  choice: మొలకెత్తి
  rationale: వ్యవసాయ సందర్భంలో పైకి రావడం లేదా ఎదగడం అనే భావాన్ని ‘మొలకెత్తి’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: αὐξανόμενα
  choice: పెరిగి
  rationale: కొనసాగుతూ వృద్ధి చెందడాన్ని సూచిస్తుంది; ముందు ఉన్న ‘మొలకెత్తి’ అనే భావం నుండి దీనిని వేరుగా ఉంచుతుంది.
- source_word: ἔφερεν
  choice: దిగుబడినిచ్చాయి
  rationale: ఫలాన్ని మోయడం అనే మూల భావాన్ని వ్యవసాయ సందర్భానికి తగిన దిగుబడి భాషలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: కొన్ని ముప్పై రెట్లు, కొన్ని అరవై రెట్లు, కొన్ని నూరు రెట్లు
  rationale: ఈ సంఖ్యలు విత్తిన పరిమాణంతో పోల్చిన దిగుబడి నిష్పత్తులను సూచిస్తాయి. పునరావృతమైన ἓν‌ను ‘కొన్ని’గా వ్యక్తపరచడం ద్వారా మూడు వేర్వేరు దిగుబడులు స్పష్టమవుతాయి.
