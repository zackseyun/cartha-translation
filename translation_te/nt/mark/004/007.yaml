  yaml_path: translation/nt/mark/004/007.yaml
  text: And other seed fell among the thorns[a], and the thorns came up and choked it[b], and it yielded no fruit.
translation:
  language: te
  text: మరికొంత విత్తనం ముళ్లపొదల మధ్య పడింది. ముళ్లపొదలు పెరిగి దాన్ని అణిచివేశాయి; అది ఫలించలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλο
  choice: మరికొంత విత్తనం
  rationale: నపుంసక ఏకవచన విశేషణం ముందున్న సందర్భంలోని విత్తనాన్ని సూచిస్తుంది. తెలుగులో సహజత, స్పష్టత కోసం సూచిత నామవాచకమైన ‘విత్తనం’ చేర్చబడింది.
- source_word: ἔπεσεν
  choice: పడింది
  rationale: πίπτω క్రియకు నేరమైన, సహజమైన అర్థం ‘పడింది’; ‘విత్తబడింది’ అని అనువదిస్తే మూల క్రియలో లేని భావాన్ని దిగుమతి చేసినట్లవుతుంది.
- source_word: εἰς τὰς ἀκάνθας
  choice: ముళ్లపొదల మధ్య
  rationale: εἰς అక్షరార్థంగా ‘లోనికి’ అయినప్పటికీ, ముళ్లు పెరిగివున్న నేలలో విత్తనం పడిన దృశ్యాన్ని ఆధునిక తెలుగులో ‘ముళ్లపొదల మధ్య’ సహజంగా తెలియజేస్తుంది.
- source_word: ἀνέβησαν
  choice: పెరిగి
  rationale: మొక్కలు పైకి రావడం లేదా పెరగడం అనే భావాన్ని సందర్భానుకూలంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: συνέπνιξαν
  choice: అణిచివేశాయి
  rationale: ముళ్లపొదలు విత్తనం ఎదగకుండా నొక్కివేసిన భావాన్ని సహజ తెలుగు వ్యవసాయ చిత్రణలో తెలియజేస్తుంది; ‘గొంతు నులిమాయి’ అనే అతి అక్షరార్థ మానవీకరణను నివారిస్తుంది.
- source_word: αὐτό
  choice: దాన్ని
  rationale: ఏకవచన సర్వనామం ముందున్న విత్తనాన్ని సూచిస్తుంది; తెలుగులో ‘దాన్ని’ సరిపోతుంది.
- source_word: καρπὸν οὐκ ἔδωκεν
  choice: అది ఫలించలేదు
  rationale: అక్షరార్థమైన ‘ఫలాన్ని ఇవ్వలేదు’ అనే భావాన్ని సహజమైన, వ్యవసాయ సందర్భానికి తగిన తెలుగు క్రియతో వ్యక్తపరుస్తుంది.
