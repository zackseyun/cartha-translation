id: MRK.4.18
reference: Mark 4:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀ἄλλοι εἰσὶν οἱ εἰς τὰς ἀκάνθας σπειρόμενοι· ⸂οὗτοί εἰσιν⸃ οἱ τὸν λόγον ⸀ἀκούσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/018.yaml
  text: And others are those sown among the thorns[a]; these are the ones who have heard the word[b],
translation:
  language: te
  text: మరికొందరు ముళ్ల మధ్య[a] విత్తబడినవారు; వీరు వాక్యాన్ని[b] విన్నవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ముళ్లలోనికి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘సందేశాన్ని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι
  choice: మరికొందరు
  rationale: మునుపటి నేలలతో సూచించబడిన వారికంటే వేరొక వర్గాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: εἰς τὰς ἀκάνθας
  choice: ముళ్ల మధ్య
  rationale: εἰς అక్షరార్థంగా ‘లోనికి’ అనే భావం ఇవ్వగలిగినా, విత్తనం ముళ్లు ఉన్న ప్రదేశంలో పడటాన్ని తెలుగులో ‘ముళ్ల మధ్య’ సహజంగా వ్యక్తపరుస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ἀκάνθας
  choice: ముళ్లు
  rationale: ఉపమానంలోని thorn plantsను సాధారణ పాఠకులకు స్పష్టంగా, సంక్షిప్తంగా సూచిస్తుంది.
- source_word: σπειρόμενοι
  choice: విత్తబడినవారు
  rationale: వర్తమాన కర్మణి కృదంతాన్ని వ్యక్తులకు వర్తించే విత్తన రూపకాన్ని అలాగే నిలుపుతూ సహజ తెలుగులో అందిస్తుంది.
- source_word: οὗτοί εἰσιν
  choice: వీరు
  rationale: వివరణాత్మక గుర్తింపును తెలుగులో అనవసర పునరుక్తి లేకుండా సహజంగా తెలియజేస్తుంది.
- source_word: οἱ ... ἀκούσαντες
  choice: విన్నవారు
  rationale: తరువాత జరిగే విషయానికి ముందున్న వినికిడి చర్యను అఓరిస్ట్ కృదంతానికి తగిన విధంగా సంక్షిప్తంగా సూచిస్తుంది.
- source_word: τὸν λόγον
  choice: వాక్యాన్ని
  rationale: ప్రకటించబడిన మాట/సందేశం అనే భావాన్ని ఇస్తూ, ఉపమాన సందర్భంలోని బైబిలీయ పదప్రయోగాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఉపమాన వివరణలో మనుషులను విత్తనంతో రూపకంగా గుర్తించడం
  choice: ‘ముళ్ల మధ్య విత్తబడినవారు’ అనే రూపకాన్ని అలాగే నిలుపడం
  alternative: ‘ముళ్ల నేలలోని విత్తనంలాంటి వారు’ అని రూపకాన్ని వివరణాత్మకంగా విప్పడం
  rationale: గ్రీకు పాఠం మనుషులను విత్తబడిన వారిగా నేరుగా పేర్కొంటూ విత్తన రూపకాన్ని కొనసాగిస్తుంది; దానిని వ్యాఖ్యానాత్మకంగా మార్చకుండా సాహిత్య నిర్మాణాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే ఉపమాన గౌరవగంభీరతను మరియు మూలపాఠంలోని రూపకాన్ని నిలుపుతూ రూపొందించబడింది.
