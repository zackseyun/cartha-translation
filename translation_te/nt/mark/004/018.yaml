  source_fidelity: ‘మరికొందరు’ accurately represents substantival ἄλλοι, and ‘ముళ్ల మధ్య విత్తబడినవారు’ preserves the parable’s passive sowing metaphor and the agricultural sense of εἰς τὰς ἀκάνθας. ‘వీరు వాక్యాన్ని విన్నవారు’ faithfully conveys the resumptive identification and the prior act expressed by οἱ ... ἀκούσαντες. The verse-final full stop appropriately reflects the Telugu excerpt while the Greek sentence continues into the next verse.
