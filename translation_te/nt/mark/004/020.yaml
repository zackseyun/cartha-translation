id: MRK.4.20
reference: Mark 4:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀ἐκεῖνοί εἰσιν οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες, οἵτινες ἀκούουσιν τὸν λόγον καὶ παραδέχονται καὶ καρποφοροῦσιν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/020.yaml
  text: 'And those are the ones sown on the good soil: they hear the word and receive it and bear fruit—thirtyfold and sixtyfold and a hundredfold[a].'
translation:
  language: te
  text: 'మంచి నేలలో విత్తబడినవారు వీరే: వీరు వాక్యాన్ని విని, దాన్ని స్వీకరించి, ముప్పై రెట్లు, అరవై రెట్లు, వంద రెట్లు ఫలిస్తారు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘స్వీకరించి’ అనే మాటకు ‘అంగీకరించి’ లేదా ‘ఆదరంగా చేర్చుకొని’ అని కూడా అనువదించవచ్చు (παραδέχονται).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοί
  choice: వీరే
  rationale: ఉపమాన వివరణలో చివరి వర్గాన్ని సూచించే నిర్దేశక సర్వనామం. తెలుగు సందర్భంలో సమీపంగా ప్రస్తావిస్తున్న ఈ వర్గానికి ‘వీరే’ సహజంగా ఉండి, గుర్తింపునిచ్చే బలాన్ని నిలుపుతుంది.
- source_word: οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες
  choice: మంచి నేలలో విత్తబడినవారు
  rationale: నిష్క్రియ కృదంత రూపాన్నీ, విత్తనం-నేల వ్యవసాయ రూపకాన్నీ నిలుపుతుంది. గ్రీకులోని ἐπί భావాన్ని తెలుగులో సహజమైన ‘నేలలో’ ద్వారా వ్యక్తం చేశాం.
- source_word: γῆν τὴν καλὴν
  choice: మంచి నేల
  rationale: ఈ వ్యవసాయ సందర్భంలో γῆకి ‘నేల’ సహజమైన ఆధునిక తెలుగు పదం; καλὴν యొక్క విలువనిర్ణయ భావాన్ని ‘మంచి’ స్పష్టంగా అందిస్తుంది.
- source_word: οἵτινες
  choice: వీరు
  rationale: ఈ వర్గాన్ని నిర్వచించే లక్షణాలను కొత్త వాక్యభాగంగా తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: ἀκούουσιν τὸν λόγον
  choice: వాక్యాన్ని విని
  rationale: మార్కు 4లో పునరావృతమయ్యే λόγος పదబంధాన్ని, దాని అంతర్గ్రంథ సంబంధాన్ని ‘వాక్యం’ నిలుపుతుంది.
- source_word: παραδέχονται
  choice: దాన్ని స్వీకరించి
  rationale: అనుకూలంగా అంగీకరించడం లేదా ఆదరంగా స్వీకరించడం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది. ‘దాన్ని’ అనేది ముందు వచ్చిన ‘వాక్యాన్ని’ స్పష్టంగా సూచిస్తుంది.
- source_word: καρποφοροῦσιν
  choice: ఫలిస్తారు
  rationale: వ్యవసాయ రూపకాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతూ ఆధ్యాత్మిక భావాన్ని అదనంగా వివరించదు.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: ముప్పై రెట్లు, అరవై రెట్లు, వంద రెట్లు
  rationale: దిగుబడి పరిమాణాలను తెలుగులో స్పష్టంగా తెలియజేస్తుంది. ప్రతి సంఖ్యతో ‘రెట్లు’ ఉంచడం గ్రీకు పదబంధంలోని లయను కొంతవరకు నిలుపుతుంది; జాబితాలో తెలుగు సహజ విరామచిహ్నాలు వాడాం.
theological_decisions:
- issue: మంచి నేలవారు వాక్యానికి చూపే స్పందన స్వభావం
  choice: వారు వాక్యాన్ని నిజంగా స్వీకరించి ఫలిస్తారని మాత్రమే వచనం చెప్పిన మేరకు అనువదించాం.
  alternative: ఇది తప్పనిసరిగా అంతిమ స్థిరత్వాన్ని సూచిస్తుందని లేదా కేవలం తొలి స్పందననే సూచిస్తుందని స్పష్టీకరించడం.
  rationale: గ్రీకు పాఠం వినడం, స్వీకరించడం, ఫలించడం అనే క్రమాన్ని చెబుతుంది; స్థిరత్వం లేదా విశ్వాసభ్రంశం గురించి తరువాతి సిద్ధాంత నిర్ణయాన్ని ఇందులో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. వ్యవసాయ రూపకాన్ని కాపాడుతూ, సాధారణ పాఠకులకు వెంటనే అర్థమయ్యే ‘నేల’, ‘విత్తబడినవారు’, ‘ఫలిస్తారు’, ‘రెట్లు’ వంటి పదాలను ఎంచుకున్నాం.
