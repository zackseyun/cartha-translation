id: MRK.4.13
reference: Mark 4:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ λέγει αὐτοῖς· Οὐκ οἴδατε τὴν παραβολὴν ταύτην, καὶ πῶς πάσας τὰς παραβολὰς γνώσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/013.yaml
  text: And he says to them[a], “Do you not understand this parable? Then how will you understand all the parables?”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అంటున్నాడు: “ఈ ఉపమానం మీకు అర్థం కావడం లేదా?[a] అలాగైతే, ఉపమానాలన్నిటినీ మీరెలా అర్థం చేసుకుంటారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత రూపానుగుణంగా: “ఈ ఉపమానం మీకు తెలియదా? మరి ఉపమానాలన్నిటినీ మీరెలా తెలుసుకుంటారు?” గ్రీకులోని రెండు క్రియలకు ‘తెలుసు/తెలుసుకోవడం’ అనే అర్థం ఉండవచ్చు; ఇక్కడ అవి భావాన్ని గ్రహించడాన్ని సూచిస్తున్నాయి.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: అంటున్నాడు
  rationale: మార్కు రచనలోని చారిత్రక వర్తమాన కాలాన్ని నిలుపుతూ, తెలుగు కథనంలో సహజంగా ఉండే రూపాన్ని ఎంచుకున్నాం.
- source_word: οἴδατε
  choice: అర్థం కావడం
  rationale: ఉపమానం గురించి ఇక్కడ ఉద్దేశం కేవలం తెలుసుకోవడం కాదు, దాని భావాన్ని గ్రహించడం; అందువల్ల సందర్భానుసారంగా ‘అర్థం కావడం’ సహజంగా ఉంది.
- source_word: παραβολὴν
  choice: ఉపమానం
  rationale: యేసు బోధనలోని ఈ సాహిత్య, బోధనా రూపానికి ప్రామాణికమైన తెలుగు పదం.
- source_word: ταύτην
  choice: ఈ
  rationale: ఇప్పుడే చెప్పబడిన ఉపమానాన్ని సూచించే సమీప సూచనార్థక పదం.
- source_word: καὶ πῶς
  choice: అలాగైతే, ... ఎలా
  rationale: రెండు ప్రశ్నల మధ్య ఉన్న నిర్ధారణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; గ్రీకు καί యొక్క కేవలం సంధానార్థాన్ని మించి కొత్త భావాన్ని చేర్చదు.
- source_word: πάσας τὰς παραβολὰς
  choice: ఉపమానాలన్నిటినీ
  rationale: బహువచనంలోని πᾶς భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: γνώσεσθε
  choice: అర్థం చేసుకుంటారు
  rationale: ఇక్కడ ఉపమానాల భావాన్ని గ్రహించడమే సందర్భార్థం. భవిష్యత్ రూపాన్ని ‘చేసుకుంటారు’ ద్వారా నిలిపాం.
theological_decisions:
- issue: οἴδατε మరియు γνώσεσθε మధ్య సంబంధం
  choice: రెండింటినీ సందర్భానుసారంగా ‘అర్థం’ అనే భావంతో అనువదించాం.
  alternative: మొదటిదాన్ని ‘తెలుసు’, రెండవదాన్ని ‘తెలుసుకుంటారు’ అని మరింత రూపానుగుణంగా అనువదించవచ్చు.
  rationale: వాక్యం ఉపమానాల గురించి సమాచారం కలిగి ఉండడాన్ని కాక వాటి భావాన్ని గ్రహించడాన్ని ప్రశ్నిస్తోంది. అయితే గ్రీకులో వేర్వేరు క్రియలు ఉన్న విషయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలిని వాడాం. మార్కు ఉపయోగించిన చారిత్రక వర్తమానాన్ని ‘అంటున్నాడు’గా నిలిపాం; ప్రశ్నలోని మందలింపు స్వరాన్ని అతిశయింపకుండా కాపాడాం.
