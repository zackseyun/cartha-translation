    issue: The main text adds “ఇంత” in the first question.
    rationale: δειλοί means fearful/timid/cowardly; the Greek does not explicitly include an intensifier equivalent to “so/this much.” Removing it better preserves source scope.
  - severity: low
    issue: Footnote b's “విశ్వాసం కలగలేదా?” can imply that faith has not arisen or developed.
    rationale: ἔχετε πίστιν is more directly 'have faith.' Recasting the alternative with “కలిగి లేరా” preserves the possession/state expression more closely.
