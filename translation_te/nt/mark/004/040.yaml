  text: καὶ εἶπεν αὐτοῖς· Τί δειλοί ἐστε; ⸀οὔπω ἔχετε πίστιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/040.yaml
  text: And he said to them[c][b][a], “Why are you so fearful? Do you still have no faith?”
translation:
  language: te
  text: ఆయన వారితో, “మీరెందుకు భయపడుతున్నారు?[a] మీకు ఇంకా విశ్వాసం లేదా?[b][c]” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “మీరెందుకు పిరికివారిగా ఉన్నారు?”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీరు ఇంకా విశ్వాసం కలిగి లేరా?”
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ “విశ్వాసం” అనే పదాన్ని “నమ్మకం” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: ఆయన ... అని అన్నాడు
  rationale: ముందటి వృత్తాంతంతో అనుసంధానించే సాధారణ సంధాయకం; తెలుగులో సహజమైన ప్రత్యక్ష వాక్య నిర్మాణంలో ప్రత్యేకంగా ‘మరియు’ అని చేర్చకుండానే అనుసంధానం వ్యక్తమవుతుంది.
- source_word: εἶπεν αὐτοῖς
  choice: ఆయన వారితో ... అని అన్నాడు
  rationale: ప్రత్యక్ష సంభాషణను పరిచయం చేసే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: Τί
  choice: ఎందుకు
  rationale: విశేషణం, ‘ఉండు’ క్రియతో కూడిన ఈ గ్రీకు ప్రశ్నలో Τί కారణాన్ని ప్రశ్నిస్తూ మందలింపు భావాన్ని ఇస్తుంది.
- source_word: δειλοί
  choice: ఇంత భయపడుతున్నారు
  rationale: తుఫాను సందర్భంలోని శిష్యుల భయాన్ని సహజంగా తెలియజేస్తూ పదంలోని ప్రతికూల మందలింపు భావాన్ని నిలుపుతుంది; బలమైన ‘పిరికివారు’ అనే భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: οὔπω
  choice: ఇంకా ... లేదా
  rationale: ‘ఇంకా లేదు/ఇప్పటికీ లేదు’ అనే కాలసంబంధమైన, అలంకారిక ప్రశ్నార్థక బలాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἔχετε πίστιν
  choice: మీకు ... విశ్వాసం లేదా
  rationale: ἔχω యొక్క స్థితి/కలిగియుండుట భావాన్ని తెలుగు దత్తి నిర్మాణంతో సహజంగా వ్యక్తపరుస్తూ πίστις‌ను సాధారణంగా ‘విశ్వాసం’గా అనువదిస్తుంది.
theological_decisions:
- issue: ఈ సందర్భంలో πίστις‌ను ‘విశ్వాసం’గా లేదా ‘నమ్మకం’గా అనువదించడం
  choice: విశ్వాసం
  alternative: నమ్మకం
  rationale: గ్రీకు నామవాచకానికి విస్తృతమైన ధార్మిక, సంబంధాత్మక పరిధిని ‘విశ్వాసం’ నిలుపుతుంది. ప్రమాదంలో యేసుపై ఆధారపడే భావంలో ‘నమ్మకం’ కూడా సాధ్యమైనందున దానిని పాదసూచికలో సూచించాం.
- issue: δειλοί యొక్క మందలింపు తీవ్రత
  choice: భయపడుతున్నారు
  alternative: పిరికివారిగా ఉన్నారు
  rationale: తక్షణ సందర్భంలోని భయాన్ని ప్రధాన పాఠం సహజంగా తెలియజేస్తుంది; అయితే గ్రీకు పదంలో ఉండగల బలమైన నైతిక మందలింపు భావాన్ని ప్రత్యామ్నాయంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వృత్తాంత శైలి. ప్రశ్నలలోని యేసు మందలింపును నిలుపుతూ, మూలంలోని కాలసంబంధమైన οὔπω భావాన్నీ πίστις పదంలోని విశ్వాసం/నమ్మకం విస్తృతినీ పాదసూచికలతో సంరక్షించింది.
