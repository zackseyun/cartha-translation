revisions:
- from: వారిలో వేరు లేదు; వారు కొంతకాలం మాత్రమే నిలుస్తారు. తరువాత వాక్యం కారణంగా శ్రమగానీ హింసగానీ కలిగినప్పుడు, వెంటనే తొట్రుపడి వెనుదిరుగుతారు.[a]
  to: తమలో వేరు లేదు; వారు కొంతకాలమే ఉంటారు. తరువాత, వాక్యం కారణంగా శ్రమగానీ హింసగానీ కలిగినప్పుడు, వారు వెంటనే తొట్రుపడతారు.[a]
  rationale: The revision corrects the reflexive nuance of ἐν ἑαυτοῖς and avoids placing an interpretive expansion of σκανδαλίζονται in the main text. It retains the Greek metaphor, syntax, causal relationship, and the English POB audit trail’s recognition that the final verb may denote a serious falling away in context without defining that outcome more narrowly than the text does.
