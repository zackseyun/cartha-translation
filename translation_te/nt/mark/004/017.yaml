id: MRK.4.17
reference: Mark 4:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔχουσιν ῥίζαν ἐν ἑαυτοῖς ἀλλὰ πρόσκαιροί εἰσιν, εἶτα γενομένης θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον ⸀εὐθὺς σκανδαλίζονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/017.yaml
  text: and they have no root in themselves[a], but are temporary; then, when affliction or persecution arises because of the word, they immediately fall away.
translation:
  language: te
  text: తమలో వేరు లేదు; వారు కొంతకాలమే ఉంటారు. తరువాత, వాక్యం కారణంగా శ్రమగానీ హింసగానీ కలిగినప్పుడు, వారు వెంటనే తొట్రుపడతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పడిపోతారు,’ ‘తొట్రుపడేలా చేయబడతారు,’ లేదా ‘అభ్యంతరపడతారు.’ గ్రీకు క్రియకు అడ్డంకి వల్ల తొట్రుపడడం, అభ్యంతరం చెందడం, లేదా సందర్భానుసారంగా వెనుదిరగడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν ἐν ἑαυτοῖς
  choice: వారిలో వేరు
  rationale: విత్తనం-నేల ఉపమానంలోని వ్యవసాయ రూపకాన్ని యథాతథంగా ఉంచుతుంది; గ్రీకులో లేని ‘లోతైన’ లేదా ‘బలమైన’ అనే భావాలను చేర్చదు.
- source_word: πρόσκαιροί
  choice: కొంతకాలం మాత్రమే నిలుస్తారు
  rationale: ఒక కాలం వరకే కొనసాగే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; వ్యక్తిత్వ అస్థిరత అనే అదనపు భావాన్ని మోపదు.
- source_word: γενομένης θλίψεως ἢ διωγμοῦ
  choice: శ్రమగానీ హింసగానీ కలిగినప్పుడు
  rationale: జెనిటివ్ అబ్సల్యూట్‌ను కాలసూచకంగా అనువదిస్తుంది. θλῖψις‌లోని ఒత్తిడి/బాధ భావానికి ‘శ్రమ’, διωγμός‌కు ‘హింస’ సహజమైన సందర్భోచిత పదాలు.
- source_word: διὰ τὸν λόγον
  choice: వాక్యం కారణంగా
  rationale: ఉపమానమంతటా పునరావృతమయ్యే λόγος పదబంధాన్ని ‘వాక్యం’గా నిలుపుతూ, దాని నిమిత్తంగా శ్రమ లేదా హింస కలుగుతుందని స్పష్టం చేస్తుంది.
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు సువార్తకు ప్రత్యేకమైన తక్షణత్వాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: σκανδαλίζονται
  choice: తొట్రుపడి వెనుదిరుగుతారు
  rationale: మూలపదంలోని తొట్రుపాటు రూపకాన్నీ, ఈ సందర్భంలో వాక్యాన్ని విడిచిపెట్టే ఫలితాన్నీ కలిపి వ్యక్తం చేస్తుంది; తుది రక్షణపై పాఠానికి మించిన సిద్ధాంత నిర్ణయం చేయదు.
theological_decisions:
- issue: శిష్యత్వం/వెనుదిరుగుదల సందర్భంలో σκανδαλίζονται అనువాదం
  choice: తొట్రుపడి వెనుదిరుగుతారు
  alternative: తొట్రుపడతారు; అభ్యంతరపడతారు; పడిపోతారు
  rationale: ఇక్కడ మొదట వాక్యాన్ని స్వీకరించినవారు ఒత్తిడి వచ్చినప్పుడు నిలవలేకపోవడం వర్ణించబడింది. ‘తొట్రుపడి వెనుదిరుగుతారు’ అనేది ఆ తీవ్రతను తెలియజేస్తూనే, వారి తుది రక్షణ స్థితిని పాఠం కంటే ఎక్కువగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. వ్యవసాయ రూపకం, ‘వాక్యం’ అనే సందర్భపదం, అలాగే σκανδαλίζονταιలోని ఉద్దేశపూర్వక సందిగ్ధత సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
