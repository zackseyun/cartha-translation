source:
  edition: SBLGNT
  text: ⸂καὶ ἄλλο⸃ ἔπεσεν ἐπὶ τὸ πετρῶδες ⸀ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ ⸀εὐθὺς ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/005.yaml
  text: And other seed fell on the rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil.
translation:
  language: te
  text: మరికొంత విత్తనం రాతినేలపై[a] పడింది. అక్కడ మట్టి ఎక్కువగా లేదు. మట్టి లోతుగా లేకపోవడం వల్ల అది వెంటనే మొలకెత్తింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రాళ్లతో నిండిన నేలపై.’ గ్రీకు పదం, రాతిపై పలుచని మట్టిపొర మాత్రమే ఉన్న భూభాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: మరికొంత విత్తనం
  rationale: నపుంసక ఏకవచన విశేషణం నామవాచకంగా వాడబడి, ముందరి సందర్భంలోని విత్తనాన్ని సూచిస్తోంది. తెలుగులో భావం స్పష్టంగా ఉండేందుకు ‘విత్తనం’ చేర్చి, విత్తన పరిమాణాన్ని సహజంగా సూచించేందుకు ‘మరికొంత’ ఎంచుకున్నాం.
- source_word: πετρῶδες
  choice: రాతినేల
  rationale: ఇది కేవలం అక్కడక్కడ రాళ్లు ఉన్న నేలను కాకుండా, పైపొరలో కొద్దిపాటి మట్టి మాత్రమే ఉన్న రాతి భూభాగాన్ని సూచిస్తుంది. ‘రాతినేల’ సంక్షిప్తంగా, సహజంగా ఆ వ్యవసాయ దృశ్యాన్ని తెలియజేస్తుంది.
- source_word: γῆν πολλήν
  choice: మట్టి ఎక్కువగా
  rationale: ఇక్కడ γῆ అంటే విస్తారమైన భూమి కాదు, మొక్క పెరిగేందుకు ఉపయోగపడే మట్టి. ‘మట్టి ఎక్కువగా లేదు’ ఆధునిక తెలుగులో సహజంగా పరిమాణ భావాన్ని నిలుపుతుంది.
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: క్రియ తక్షణంగా జరిగిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐξανέτειλεν
  choice: మొలకెత్తింది
  rationale: వ్యవసాయ సందర్భంలో విత్తనం నేలనుంచి మొలకగా పైకి రావడాన్ని ఖచ్చితంగా, సహజంగా సూచిస్తుంది.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: మట్టి లోతుగా లేకపోవడం వల్ల
  rationale: διάతో కూడిన articular infinitive కారణాన్ని వ్యక్తపరుస్తుంది. ఈ తెలుగు నిర్మాణం కారణ సంబంధాన్ని స్పష్టంగా ఉంచుతూ, పలుచని మట్టిపొర అనే దృశ్యాన్ని కాపాడుతుంది.
- source_word: ὅπου
  choice: అక్కడ
  rationale: ముందు పేర్కొన్న రాతినేలలోని పరిస్థితిని సహజమైన తెలుగు వాక్య విభజనతో సూచిస్తుంది; గ్రీకు మూలంలోని స్థాన సంబంధం నిలుస్తుంది.
