source:
  edition: SBLGNT
  text: καὶ ἀφέντες τὸν ὄχλον παραλαμβάνουσιν αὐτὸν ὡς ἦν ἐν τῷ πλοίῳ, καὶ ἄλλα ⸀πλοῖα ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/036.yaml
  text: And leaving the crowd[a], they take him with them just as he was, in the boat[b], and other boats were with him.
translation:
  language: te
  text: 'వారు జనసమూహాన్ని విడిచిపెట్టి, ఆయన పడవలో ఉన్నట్టుగానే ఆయనను తమ వెంట తీసుకువెళ్లారు[a]. ఇతర పడవలు కూడా ఆయనతోపాటు ఉన్నాయి.


    [a] లేదా, “ఆయన ఉన్నట్టుగానే, పడవలో ఆయనను తమ వెంట తీసుకువెళ్లారు.” గ్రీకు వాక్య నిర్మాణం యేసు అప్పటికే పడవలో ఉన్నాడనే విషయాన్ని నొక్కిచెప్పవచ్చు; లేదా ఎలాంటి అదనపు సిద్ధత లేకుండా ఆయనను ఉన్న స్థితిలోనే తీసుకువెళ్లారని సూచించవచ్చు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన ఉన్నట్టుగానే, పడవలో ఆయనను తమ వెంట తీసుకువెళ్లారు.” గ్రీకు వాక్య నిర్మాణం యేసు అప్పటికే పడవలో ఉన్నాడనే విషయాన్ని నొక్కిచెప్పవచ్చు; లేదా ఎలాంటి అదనపు సిద్ధత లేకుండా ఆయనను ఉన్న స్థితిలోనే తీసుకువెళ్లారని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφέντες
  choice: విడిచిపెట్టి
  rationale: ఇది ప్రధాన క్రియకు ముందు జరిగిన అనుబంధ చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; జనసమూహాన్ని అధికారికంగా పంపివేశారనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: τὸν ὄχλον
  choice: జనసమూహాన్ని
  rationale: సందర్భంలోని కూడివచ్చిన ప్రజలను సూచించే సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: παραλαμβάνουσιν αὐτόν
  choice: ఆయనను తమ వెంట తీసుకువెళ్లారు
  rationale: παραλαμβάνωలోని ‘తమతో తీసుకుపోవడం’ అనే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది. గ్రీకులోని చారిత్రక వర్తమాన కాలాన్ని సహజమైన తెలుగు కథనశైలికి అనుగుణంగా భూతకాలంలో ఇచ్చాం.
- source_word: ὡς ἦν
  choice: ఉన్నట్టుగానే
  rationale: యేసును ఆయన ఉన్న స్థితిలోనే, మరే అదనపు సిద్ధత లేకుండా తీసుకెళ్లారనే సాధ్యమైన భావాన్ని నిలుపుతుంది; దీనికి స్థలసూచక పదబంధంతో ఉన్న సంబంధంలోని అస్పష్టతను పాదసూచిక వివరిస్తుంది.
- source_word: ἐν τῷ πλοίῳ
  choice: పడవలో
  rationale: గలిలయ సముద్రపు కథన సందర్భంలో πλοῖονకు ‘పడవ’ సహజమైన సమానార్థకం. యేసు అప్పటికే పడవలో ఉన్నాడనే సాధ్యమైన భావాన్ని వాక్యక్రమం నిలుపుతుంది.
- source_word: ἄλλα πλοῖα
  choice: మరికొన్ని పడవలు
  rationale: ‘ఇతర పడవలు’ అనే భావాన్ని సహజమైన తెలుగులో ఇస్తుంది; మూలంలో లేని ‘చిన్న’ వంటి విశేషణాన్ని చేర్చదు.
- source_word: ἦν μετ’ αὐτοῦ
  choice: ఆయనతోపాటు ఉన్నాయి
  rationale: మరికొన్ని పడవలు యేసుతో కలిసి ప్రయాణించాయని మూలంలోని సంక్షిప్త కథన గమనికను సరళంగా నిలుపుతుంది.
theological_decisions:
- issue: ὡς ἦν ἐν τῷ πλοίῳ పదబంధపు అన్వయం
  choice: ప్రధాన పాఠంలో ‘ఆయన పడవలో ఉన్నట్టుగానే’ అని ఇచ్చి, యేసు అప్పటికే పడవలో ఉన్నాడనే భావాన్ని ముందుంచాం.
  alternative: ‘ఆయన ఉన్నట్టుగానే, పడవలో ఆయనను తమ వెంట తీసుకువెళ్లారు’—ఇది ఆయనను అదనపు సిద్ధత లేకుండా తీసుకెళ్లారనే భావాన్ని ముందుంచుతుంది.
  rationale: గ్రీకు పదక్రమం స్థితి మరియు స్థలాన్ని దగ్గరగా ఉంచుతుంది; రెండింటి మధ్య సంబంధాన్ని పూర్తిగా నిర్ణయించడం కష్టం. అందువల్ల ప్రధాన పాఠం ఒక సహజ పఠనాన్ని ఇస్తూ, నిజమైన భాషాత్మక అస్పష్టతను పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘ఆయన’ అనే గౌరవసూచక సర్వనామం సాధారణ తెలుగు బైబిల్ పఠనానికి అనుగుణంగా ఉంది. గ్రీకులోని చారిత్రక వర్తమానాన్ని తెలుగులో సహజమైన భూతకాల కథనంగా మార్చాం; మూలంలోని భావసంబంధ అస్పష్టతను పాదసూచికలో భద్రపరిచాం.
