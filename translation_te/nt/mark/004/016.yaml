id: MRK.4.16
reference: Mark 4:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὗτοί εἰσιν ⸀ὁμοίως οἱ ἐπὶ τὰ πετρώδη σπειρόμενοι, οἳ ὅταν ἀκούσωσιν τὸν λόγον ⸀εὐθὺς μετὰ χαρᾶς λαμβάνουσιν αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/016.yaml
  text: 'And these are likewise the ones sown on the rocky ground: when they hear the word[a], they immediately receive it with joy,'
translation:
  language: te
  text: ఇదే విధంగా, రాతినేలపై[a] విత్తబడినవారు వీరే; వారు వాక్యాన్ని విన్నప్పుడు వెంటనే దాన్ని సంతోషంతో స్వీకరిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రాళ్లతో కూడిన నేలపై’; లేదా ‘రాతి ప్రదేశాలపై.’
    reason: ἐπὶ τὰ πετρώδη అనే పదబంధం రాతిపొరగల నేలను గానీ, రాళ్లతో కూడిన ప్రదేశాలను గానీ సూచించగల పదప్రయోగ పరిధిని చూపించడం.
lexical_decisions:
- source_word: ὁμοίως
  choice: అలాగే
  rationale: మునుపటి వివరణతో ఈ వర్గాన్ని పోలిక ద్వారా అనుసంధానించే గ్రీకు క్రియావిశేషణ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐπὶ τὰ πετρώδη
  choice: రాతినేలలో
  rationale: రాళ్లతో కూడిన లేదా కింద రాతిపొర ఉన్న సాగునేల దృశ్యాన్ని సహజంగా తెలియజేస్తుంది; విత్తనానికి సంబంధించిన సందర్భంలో తెలుగు వాడుకకు ‘లో’ సరిపోతుంది.
- source_word: σπειρόμενοι
  choice: విత్తబడినవారు
  rationale: వర్తమాన కర్మణి కృదంతంలోని రూపకభాషను వ్యాఖ్యానించి మార్చకుండా, ప్రజలనే ‘విత్తబడినవారు’గా సూచించే గ్రీకు నిర్మాణాన్ని నిలుపుతుంది.
- source_word: τὸν λόγον
  choice: వాక్యాన్ని
  rationale: మార్కు సువార్తలో పునరావృతమయ్యే λόγος పదానికి స్థిరత్వం, బైబిలు ప్రతిధ్వని రెండింటినీ కాపాడుతుంది; సందర్భంలో ఇది ప్రకటించబడిన సందేశాన్ని సూచిస్తుంది.
- source_word: εὐθύς
  choice: వెంటనే
  rationale: మార్కు రచనలో తరచుగా కనిపించే తక్షణత్వాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μετὰ χαρᾶς
  choice: సంతోషంతో
  rationale: ఆనందంతో స్వీకరించే విధానాన్ని గ్రీకు విభక్త్యర్థానికి అనుగుణంగా నేరుగా తెలియజేస్తుంది.
- source_word: λαμβάνουσιν αὐτόν
  choice: దాన్ని … స్వీకరిస్తారు
  rationale: λαμβάνω యొక్క సాధారణ ‘స్వీకరించు’ భావాన్ని నిలుపుతూ, ఆ స్వీకరణ శాశ్వతమని లేదా నిజమైన విశ్వాసమని అదనంగా నిర్ణయించదు.
theological_decisions:
- issue: ‘విత్తబడినవారు’ అనే పదబంధం ఎవరిని సూచిస్తుంది?
  choice: మనుషులను ‘రాతినేలలో విత్తబడినవారు’గానే పేర్కొంటూ ఉపమాన భాషను నిలుపడం.
  alternative: ‘రాతినేలలాంటి హృదయాలు గలవారు’ అని వివరణాత్మకంగా మార్చడం.
  rationale: యేసు ఇచ్చిన వివరణ విత్తడం అనే ఉపమాన చిత్రాన్ని ఉద్దేశపూర్వకంగా కొనసాగిస్తుంది. ప్రత్యామ్నాయం మూలపాఠంలో లేని ‘హృదయాలు’ అనే వ్యాఖ్యానాన్ని చేర్చి భావాన్ని ముందే పరిష్కరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘అలాగే’ వాక్యసంబంధాన్ని, ‘వెంటనే’ మార్కు సువార్తలోని వేగాన్ని నిలుపుతాయి. మూలంలోని ఉపమానాత్మక ఉద్రిక్తతను వివరించి తొలగించకుండా ‘విత్తబడినవారు’ అనే రూపాన్ని ఉంచాం.
