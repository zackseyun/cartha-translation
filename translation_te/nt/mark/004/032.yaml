revisions:
- from: అది విత్తబడినప్పుడు మొలకెత్తి, తోట మొక్కలన్నిటికంటే పెద్దదవుతుంది; పెద్ద కొమ్మలు వేస్తుంది. అందువల్ల దాని నీడ కింద ఆకాశ పక్షులు[a] గూళ్లు కట్టుకోగలుగుతాయి.[b]
  to: అది విత్తబడినప్పుడు మొలకెత్తి, తోట మొక్కలన్నిటికంటే పెద్దదవుతుంది; పెద్ద కొమ్మలు వేస్తుంది. అందువల్ల దాని నీడ కింద ఆకాశంలోని పక్షులు[a] నివసించగలుగుతాయి.[b]
