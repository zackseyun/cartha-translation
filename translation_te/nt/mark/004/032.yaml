id: MRK.4.32
reference: Mark 4:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὅταν σπαρῇ, ἀναβαίνει καὶ γίνεται ⸂μεῖζον πάντων τῶν λαχάνων⸃ καὶ ποιεῖ κλάδους μεγάλους, ὥστε δύνασθαι ὑπὸ τὴν σκιὰν αὐτοῦ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/032.yaml
  text: and when it is sown[a], it comes up and becomes larger than all the garden plants, and it produces large branches[b], so that the birds of the sky are able to nest under its shade.
translation:
  language: te
  text: అది విత్తబడినప్పుడు మొలకెత్తి, తోట మొక్కలన్నిటికంటే పెద్దదవుతుంది; పెద్ద కొమ్మలు వేస్తుంది. అందువల్ల దాని నీడ కింద ఆకాశంలోని పక్షులు[a] నివసించగలుగుతాయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరలోకపు పక్షులు’; సంప్రదాయంగా, ‘గాలి పక్షులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘గూళ్లు కట్టుకోగలుగుతాయి’ లేదా ‘స్థిరపడగలుగుతాయి.’ గొప్ప వృక్షంలో పక్షులు ఆశ్రయం పొందే పాత నిబంధన చిత్రణను ఈ మాటలు ప్రతిధ్వనింపజేయవచ్చు (ఉదా., యెహెజ్కేలు 17:23; దానియేలు 4:12).
    reason: cross_reference
lexical_decisions:
- source_word: σπαρῇ
  choice: విత్తబడినప్పుడు
  rationale: ὅταν‌తో ఉన్న అనిర్దిష్ట కాలవాక్య భావాన్ని సహజంగా తెలియజేస్తూ, విత్తనం అనే ఉపమానంలోని వ్యవసాయ చిత్రణను నిలుపుతుంది.
- source_word: ἀναβαίνει
  choice: మొలకెత్తి
  rationale: వ్యవసాయ సందర్భంలో నేలలోనుంచి పైకి రావడాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: γίνεται
  choice: పెద్దదవుతుంది
  rationale: మొక్క ఎదిగి ఒక ఫలిత స్థితికి చేరే భావాన్ని నిలుపుతుంది.
- source_word: μεῖζον πάντων τῶν λαχάνων
  choice: తోట మొక్కలన్నిటికంటే పెద్దదవుతుంది
  rationale: λάχανα ఇక్కడ కూరగాయలకు మాత్రమే పరిమితం కాకుండా తోటలో పెంచే మొక్కలను సూచిస్తుంది; గ్రీకు తులనాత్మక నిర్మాణాన్ని నేరుగా నిలుపుతుంది.
- source_word: ποιεῖ κλάδους μεγάλους
  choice: పెద్ద కొమ్మలు వేస్తుంది
  rationale: కొమ్మలు ఉత్పత్తి చేయడాన్ని తెలుగులో సహజంగా ‘కొమ్మలు వేయడం’ అని వ్యక్తం చేస్తారు.
- source_word: ὥστε δύνασθαι
  choice: అందువల్ల … కట్టుకోగలుగుతాయి
  rationale: ὥστεతో కూడిన ఫలిత భావాన్నీ, δύνασθαιలోని సామర్థ్య భావాన్నీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὑπὸ τὴν σκιὰν αὐτοῦ
  choice: దాని నీడ కింద
  rationale: ఆశ్రయం కలిగించే నీడ అనే సందర్భోచిత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: ఆకాశ పక్షులు
  rationale: οὐρανός‌ను ఇక్కడ ‘ఆకాశం’గా తీసుకోవడం సందర్భానికి తగినది; సంప్రదాయబద్ధమైన వాక్యరూపాన్ని కూడా నిలుపుతుంది.
- source_word: κατασκηνοῦν
  choice: గూళ్లు కట్టుకోగలుగుతాయి
  rationale: పక్షుల సందర్భంలో నివసించడం లేదా స్థిరపడడం అనే క్రియను సహజమైన దృశ్యంగా వ్యక్తం చేస్తుంది; విస్తృతమైన అర్థసాధ్యతను పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: కొమ్మలలో లేదా నీడలో పక్షులు ఆశ్రయం పొందే పాత నిబంధన చిత్రణతో సంభావ్య సంబంధం
  choice: ప్రధాన వచనంలో చిత్రణను వ్యాఖ్యానించకుండా యథాతథంగా నిలుపడం
  alternative: పాత నిబంధన రాజ్య-వృక్ష చిత్రణను మరింత స్పష్టంగా సూచించేలా ‘నివసించగలుగుతాయి’ అని అనువదించడం
  rationale: గ్రీకు వచనం ఈ చిత్రాన్ని ఇస్తుంది గాని దాని ప్రతీకార్థాన్ని ప్రత్యక్షంగా వివరించదు. కాబట్టి ప్రధాన వచనం భావాన్ని నిర్ధారించకుండా ఉంచి, సంభావ్య ప్రతిధ్వనిని పాదసూచికలో మాత్రమే సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. వ్యవసాయ చిత్రణకు ‘విత్తబడినప్పుడు,’ ‘మొలకెత్తి,’ ‘కొమ్మలు వేస్తుంది’ వంటి సహజ ప్రయోగాలు వాడబడ్డాయి. వాక్యాన్ని రెండు భాగాలుగా విభజించి ఫలిత సంబంధాన్ని ‘అందువల్ల’తో స్పష్టం చేశాం.
