id: MRK.4.11
reference: Mark 4:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ὑμῖν ⸂τὸ μυστήριον δέδοται⸃ τῆς βασιλείας τοῦ θεοῦ· ἐκείνοις δὲ τοῖς ἔξω ἐν παραβολαῖς τὰ πάντα γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/011.yaml
  text: And he was saying to them, “To you the mystery of the kingdom of God has been given, but to those outside everything comes in parables,”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా చెబుతుండేవాడు: “దేవుని రాజ్య మర్మం మీకు ఇవ్వబడింది; కానీ బయటివారికి ప్రతిదీ ఉపమానాల రూపంలో వస్తుంది.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ μυστήριον
  choice: మర్మం
  rationale: ఇది కేవలం అర్థంకాని ‘రహస్యం’ కాక, దేవుడు బయలుపరచే దాచబడిన సత్యాన్ని సూచిస్తుంది; ‘మర్మం’ ఈ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: δέδοται
  choice: అనుగ్రహించబడింది
  rationale: పరిపూర్ణ కర్మణి రూపంలోని ‘ఇవ్వబడింది’ అనే భావాన్ని, దేవుని వరంగా ఇవ్వబడినదనే సందర్భార్థంతో తెలియజేస్తుంది.
- source_word: τοῖς ἔξω
  choice: బయటివారికి
  rationale: శిష్యుల వర్గానికి వెలుపల ఉన్నవారనే రూపక, సామాజిక భావాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: ἐν παραβολαῖς
  choice: ఉపమానాల రూపంలోనే
  rationale: παραβολήకు సాధారణ బైబిలు తెలుగు పదమైన ‘ఉపమానం’ను ఉంచి, ἐν యొక్క విధానార్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὰ πάντα γίνεται
  choice: ప్రతిదీ … జరుగుతుంది
  rationale: γίνεταιను ‘ఉంటుంది’గా స్థిరీకరించకుండా, దాని గతి/సంభవ భావాన్ని ‘జరుగుతుంది’గా కాపాడుతుంది.
theological_decisions:
- issue: దేవుని రాజ్య మర్మం ఎవరికీ ఎలా లభిస్తుంది
  choice: ‘మీకు అనుగ్రహించబడింది’ అని కర్మణి నిర్మాణాన్ని నిలుపుట
  alternative: ‘మీరు తెలుసుకున్నారు’ లేదా ‘దేవుడు మీకు తెలియజేశాడు’
  rationale: మూలంలోని దైవ కర్మణిని స్పష్టంగా దేవుని పేరు చేర్చి పరిష్కరించకుండా ఉంచి, అది పొందిన వరమనే భావాన్ని కాపాడుతుంది.
- issue: బయటివారికి ఉపమానాల సంబంధం
  choice: ‘ప్రతిదీ ఉపమానాల రూపంలోనే జరుగుతుంది’
  alternative: ‘ప్రతిదీ ఉపమానాలుగా ఉంటుంది’
  rationale: γίνεταιలోని చలనాత్మక భావాన్ని నిలుపుతూ, ఉపమానాలు బయటి వారికి బోధ చేరే విధానమని తెలుపుతుంది; వాటి ఉద్దేశాన్ని ఈ వాక్యంలోనే అదనంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘చెబుతూ ఉండేవాడు’ గ్రీకు అసంపూర్ణ కాలంలోని పునరావృత/కొనసాగింపు ఛాయను కాపాడుతుంది.
