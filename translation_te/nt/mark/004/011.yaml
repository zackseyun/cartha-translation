revisions:
- from: 'ఆయన వారితో ఇలా చెబుతూ ఉండేవాడు: “దేవుని రాజ్య మర్మం మీకు అనుగ్రహించబడింది; కానీ బయటివారికి ప్రతిదీ ఉపమానాల రూపంలోనే జరుగుతుంది.”'
  to: 'ఆయన వారితో ఇలా చెబుతుండేవాడు: “దేవుని రాజ్య మర్మం మీకు ఇవ్వబడింది; కానీ బయటివారికి ప్రతిదీ ఉపమానాల రూపంలో వస్తుంది.”'
  rationale: The revision removes unsupported emphasis, retains the Greek passive without interpretive expansion, and renders τὰ πάντα γίνεται ἐν παραβολαῖς as 'everything comes in the form of parables,' in line with both the Greek and the English POB audit trail. No footnote is needed because the translation does not resolve a disputed textual or theological ambiguity.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:01:04Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the imperfect introductory verb, the passive perfect 'has been given,' the contrast between the disciples and 'those outside,' and the parabolic mode. However, the emphatic suffix in 'రూపంలోనే' is not represented in the Greek, and 'అనుగ్రహించబడింది' slightly strengthens the simple passive 'has been given.'
  naturalness: The wording is broadly clear and modern. 'ఉపమానాల రూపంలో వస్తుంది' is more idiomatic and more closely reflects γίνεται ('comes/is presented') than 'ఉపమానాల రూపంలోనే జరుగుతుంది.'
  terminology: '''దేవుని రాజ్య మర్మం'' suitably renders τὸ μυστήριον τῆς βασιλείας τοῦ θεοῦ in a concise biblical register. ''బయటివారికి'' appropriately retains the relational, group-boundary sense of τοῖς ἔξω without unnecessarily specifying who they are.'
  issues:
  - severity: low
    issue: Unwarranted emphasis in 'రూపంలోనే'
    rationale: The Greek ἐν παραβολαῖς states the manner ('in parables') but contains no explicit restrictive/emphatic element corresponding to '-నే.'
  - severity: low
    issue: '''అనుగ్రహించబడింది'' is somewhat interpretive'
    rationale: δέδοται is simply 'has been given.' Although divine gifting is contextually plausible, 'ఇవ్వబడింది' preserves the passive without adding the nuance of gracious bestowal.
  - severity: medium
    issue: '''ప్రతిదీ … జరుగుతుంది'' is less precise and less natural here'
    rationale: γίνεται in this clause is well represented by 'comes/is presented'; 'జరుగుతుంది' can suggest that events take place, rather than that all communication comes in parables.
  revised_text: 'ఆయన వారితో ఇలా చెబుతుండేవాడు: “దేవుని రాజ్య మర్మం మీకు ఇవ్వబడింది; కానీ బయటివారికి ప్రతిదీ ఉపమానాల రూపంలో వస్తుంది.”'
  revised_footnotes: []
  revision_rationale: The revision removes unsupported emphasis, retains the Greek passive without interpretive expansion, and renders τὰ πάντα γίνεται ἐν παραβολαῖς as 'everything comes in the form of parables,' in line with both the Greek and the English POB audit trail. No footnote is needed because the translation does not resolve a disputed textual or theological ambiguity.
