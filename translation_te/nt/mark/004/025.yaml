id: MRK.4.25
reference: Mark 4:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἔχει, δοθήσεται αὐτῷ· καὶ ὃς οὐκ ἔχει, καὶ ⸀ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/025.yaml
  text: For whoever has[a], more will be given to him; and whoever does not have, even what he has will be taken away from him.
translation:
  language: te
  text: ఎందుకంటే, కలిగియున్నవానికి ఇవ్వబడుతుంది; మరియు కలిగి లేనివానికి ఉన్నది కూడా అతని దగ్గరనుండి తీసివేయబడుతుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς
  choice: …వానికి / …వాని
  rationale: సామాన్యంగా ఎవరినైనా సూచించే అనిర్దిష్ట సంబంధార్థక ప్రయోగాన్ని తెలుగు సామెత శైలిలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి మాటకు కారణం లేదా వివరణను అనుసంధానించే భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἔχει
  choice: కలిగియున్న
  rationale: ఏది కలిగి ఉన్నాడో పేర్కొనకుండా, మూలంలోని విస్తృతమైన స్వాధీన భావాన్ని అలాగే ఉంచుతుంది.
- source_word: δοθήσεται αὐτῷ
  choice: ఇవ్వబడుతుంది
  rationale: గ్రీకులో కర్మ స్పష్టంగా లేదు. తెలుగులోనూ కర్మను చేర్చకుండా సహజమైన కర్మణి ప్రయోగంతో మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను కాపాడుతుంది.
- source_word: οὐκ ἔχει
  choice: కలిగిలేని
  rationale: స్వాధీనం లేకపోవడాన్ని సంక్షిప్తంగా, సామెతకు తగిన రీతిలో తెలుపుతుంది.
- source_word: ὃ ἔχει
  choice: అతనికి ఉన్నది
  rationale: ఏ వస్తువు లేదా వరమో నిర్దిష్టం చేయకుండా, నపుంసక సంబంధ సర్వనామంలోని విస్తృత సూచనను నిలుపుతుంది.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: అతని దగ్గరనుండి … తీసివేయబడుతుంది
  rationale: ἀπόతో కూడిన αἴρω ఇక్కడ వాని వద్దనుండి తొలగించబడే నష్టాన్ని సూచిస్తుంది; ఈ తెలుగు రూపం ఆ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: δοθήσεταιలో స్పష్టంగా చెప్పని కర్మ
  choice: “ఇవ్వబడుతుంది” అని కర్మను చేర్చకుండా అనువదించడం
  alternative: “మరింత ఇవ్వబడుతుంది” అని అంతర్లీనమైన పెరుగుదల భావాన్ని స్పష్టపరచడం
  rationale: గ్రీకు పాఠ్యంలో ‘మరింత’కు సమానమైన పదం లేదు. విరుద్ధ నిర్మాణం పెరుగుదలను సూచించగలిగినా, తెలుగు వాక్యం కర్మ లేకుండానే సహజంగా ఉండటంతో మూలంలోని అస్పష్టతను ప్రధాన పాఠ్యంలో నిలుపాము.
- issue: వ్యాకరణపరంగా పుంలింగ ఏకవచనమైన సాధారణ సూచన
  choice: “కలిగియున్నవానికి … కలిగిలేనివాని … అతనికి” అనే ఏకవచన పుంలింగ రూపాలు
  alternative: “కలిగియున్నవారికి … కలిగిలేనివారి” అనే బహువచన, విస్తృత రూపం
  rationale: మూలంలోని ఏకవచన ప్రతినిధి నిర్మాణాన్ని నిలుపుతూ, ఇది సాధారణంగా ప్రతి వ్యక్తికి వర్తించే సామెత అని తెలుగు రూపం తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సంక్షిప్తమైన సామెత శైలిని మరియు గంభీరతను నిలుపుకున్నాం. “కలిగియున్న” కొద్దిగా ఉన్నత శైలికి చెందినదైనా బైబిలు సందర్భంలో సులభంగా అర్థమవుతుంది; మూలంలోని ‘కలిగి ఉండడం’ అనే నిర్దిష్టం కాని భావాన్ని కాపాడుతుంది.
