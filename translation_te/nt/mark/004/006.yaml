source:
  edition: SBLGNT
  text: ⸂καὶ ὅτε ἀνέτειλεν ὁ ἥλιος⸃ ⸀ἐκαυματίσθη καὶ διὰ τὸ μὴ ἔχειν ῥίζαν ἐξηράνθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/006.yaml
  text: And when the sun rose[a], it was scorched, and because it had no root, it withered.
translation:
  language: te
  text: సూర్యుడు ఉదయించినప్పుడు, అది ఎండకు మాడిపోయి, వేరు లేకపోవడం వల్ల ఎండిపోయింది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వాడిపోయింది.’ గ్రీకు క్రియ ఎండిపోవడం లేదా వాడిపోవడం అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὅτε ἀνέτειλεν ὁ ἥλιος
  choice: సూర్యుడు ఉదయించినప్పుడు
  rationale: కాలాన్ని సూచించే ὅτε ఉపవాక్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. వాక్యారంభంలోని καὶను ప్రత్యేకంగా అనువదించకపోయినా కథన ప్రవాహం తెలుగులో నిలుస్తుంది.
- source_word: ἐκαυματίσθη
  choice: ఎండకు మాడిపోయింది
  rationale: సూర్యుని వేడి వల్ల మొక్క దెబ్బతిన్నదనే కర్మణి భావాన్ని స్పష్టంగా, వ్యవసాయ సందర్భానికి సహజంగా తెలియజేస్తుంది.
- source_word: διὰ τὸ μὴ ἔχειν ῥίζαν
  choice: వేరు లేకపోవడం వల్ల
  rationale: διάతో కూడిన ఆర్టిక్యులర్ ఇన్ఫినిటివ్ తెలిపే కారణ సంబంధాన్ని నేరుగా నిలుపుతుంది; ῥίζανలోని ఏకవచనాన్ని ‘వేరు’గా ఉంచుతుంది.
- source_word: ἐξηράνθη
  choice: ఎండిపోయింది
  rationale: ξηραίνω యొక్క ఎండిపోవడం లేదా వాడిపోవడం అనే భావాన్ని ఈ మొక్కల సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ భావఛాయను పాదసూచికలో నిలిపింది.
