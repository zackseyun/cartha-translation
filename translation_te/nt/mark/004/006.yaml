  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా సంక్షిప్తంగా మరియు గౌరవప్రదంగా అనువదించబడింది. పాదసూచిక గుర్తును అది వివరిస్తున్న ἐξηράνθη అనువాదం వద్ద ఉంచాం.
