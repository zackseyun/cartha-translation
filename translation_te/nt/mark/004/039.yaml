source:
  edition: SBLGNT
  text: καὶ διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ εἶπεν τῇ θαλάσσῃ· Σιώπα, πεφίμωσο. καὶ ἐκόπασεν ὁ ἄνεμος, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/039.yaml
  text: And having awakened[a], he rebuked the wind and said to the sea, “Be silent! Be still!” And the wind ceased[b], and there was a great calm.
translation:
  language: te
  text: ఆయన మేల్కొని[a], గాలిని గద్దించి, సముద్రంతో[b], “నిశ్శబ్దంగా ఉండు! నోరు మూసుకో!” అన్నాడు. అప్పుడు గాలి ఆగిపోయింది; గొప్ప ప్రశాంతత నెలకొంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన మేల్కొలిపబడిన తరువాత.” గ్రీకు క్రియారూపం పాసివ్ భావాన్ని కలిగి ఉండవచ్చు; మునుపటి వచనంలో శిష్యులు ఆయనను మేల్కొలిపారు.
    reason: lexical_alternative
  - marker: b
    text: ఇది గలిలయ సముద్రం; భౌగోళికంగా ఇది మంచినీటి సరస్సు. గ్రీకులో ‘సముద్రం’ అని ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: διεγερθεὶς
  choice: మేలుకొని
  rationale: అయోరిస్ట్ పాసివ్ పార్టిసిపిల్ సందర్భంలో నిద్రనుంచి లేచిన తరువాత జరిగిన చర్యను సూచిస్తుంది. కర్తను ఎవరు మేల్కొలిపారో ప్రధాన వాక్యంలో అవసరానికి మించి నిర్దిష్టం చేయకుండా, తెలుగులో సహజంగా కాలసంబంధాన్ని తెలియజేస్తుంది.
- source_word: ἐπετίμησεν
  choice: గద్దించి
  rationale: మార్కు సువార్తలో అధికారపూర్వకమైన తీవ్ర ఆజ్ఞను సూచించే క్రియాబలాన్ని ‘గద్దించి’ నిలుపుతుంది.
- source_word: ἀνέμῳ
  choice: గాలిని
  rationale: మూలపదం ప్రత్యేకంగా గాలినే సూచిస్తుంది; సందర్భంలోని తుఫానును అనువాదంలో చేర్చలేదు.
- source_word: θαλάσσῃ
  choice: సముద్రంతో
  rationale: మూలంలోని θάλασσα ను ‘సముద్రం’గా ఉంచి, భౌగోళిక వివరణార్థం ‘సరస్సు’గా మార్చలేదు.
- source_word: Σιώπα
  choice: నిశ్శబ్దంగా ఉండు!
  rationale: వెంటనే మౌనంగా ఉండమనే ప్రత్యక్ష, బలమైన ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πεφίμωσο
  choice: బిగించబడిపో!
  rationale: φιμόω లోని ‘మూతికి చిక్కం బిగించడం’ అనే రూపకాన్ని పూర్తిగా మృదువుచేయకుండా పాసివ్ ఆజ్ఞారూప బలాన్ని నిలుపుతుంది; అసాధారణత మూలంలోని సజీవ రూపకానికే చెందుతుంది.
- source_word: ἐκόπασεν
  choice: ఆగిపోయింది
  rationale: గాలి తగ్గి నిలిచిపోయిందనే ఫలితాన్ని తెలుగులో నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐγένετο
  choice: నెలకొంది
  rationale: తదనంతరంగా ఏర్పడిన స్థితిని ‘ప్రశాంతత నెలకొంది’ అనే సహజ తెలుగు ప్రయోగంతో వ్యక్తం చేస్తుంది.
- source_word: γαλήνη μεγάλη
  choice: గొప్ప ప్రశాంతత
  rationale: మార్కు వాడిన ‘గొప్ప’ అనే పరిమాణ విశేషణాన్ని నిలుపుతూ, గాలి పూర్తిగా అణగిన ప్రశాంత స్థితిని తెలియజేస్తుంది.
theological_decisions:
- issue: యేసు సముద్రానికి ఇచ్చిన రెండవ ఆజ్ఞలోని φιμόω రూపకాన్ని మృదువుచేయాలా
  choice: ‘బిగించబడిపో!’ అని రూపకబలాన్ని నిలుపడం
  alternative: ‘నిశ్చలంగా ఉండు!’ లేదా ‘శాంతించు!’
  rationale: గ్రీకులో ‘శాంతి’ అనే నామవాచకం లేదు; మౌనంగా ఉండమని, మూతికి చిక్కం బిగించబడినట్టు ఉండమని రెండు ఆజ్ఞలు ఉన్నాయి. అందువల్ల సంప్రదాయ వాక్యరూపాన్ని దిగుమతి చేయకుండా మూలంలోని తీవ్ర అధికారభావాన్ని నిలిపాం.
- issue: θάλασσα ను ‘సముద్రం’గా అనువదించాలా, ‘సరస్సు’గా సందర్భీకరించాలా
  choice: ‘సముద్రం’
  alternative: ‘సరస్సు’
  rationale: మూలపాఠంలోని పదాన్ని నేరుగా అనుసరించడం ద్వారా కథన భాషను, సముద్రంపై అధికారమనే విస్తృత ప్రతిధ్వనిని నిలుపుతుంది; భౌగోళిక గుర్తింపును పాదసూచికలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘బిగించబడిపో’ సాధారణ సంభాషణలో అరుదైనా, మూలంలోని ‘మూతికి చిక్కం బిగించు’ అనే కఠినమైన రూపకాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
