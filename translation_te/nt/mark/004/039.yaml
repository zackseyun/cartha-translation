revisions:
- from: ఆయన మేలుకొని[a], గాలిని గద్దించి, సముద్రంతో, “నిశ్శబ్దంగా ఉండు! బిగించబడిపో!” అన్నాడు. అప్పుడు గాలి ఆగిపోయింది; గొప్ప ప్రశాంతత నెలకొంది.[b]
  to: ఆయన మేల్కొని[a], గాలిని గద్దించి, సముద్రంతో[b], “నిశ్శబ్దంగా ఉండు! నోరు మూసుకో!” అన్నాడు. అప్పుడు గాలి ఆగిపోయింది; గొప్ప ప్రశాంతత నెలకొంది.
  rationale: The second command is revised to idiomatic Telugu that clearly commands silence, rather than using a term that primarily means being tied up. Footnote c preserves the vivid literal image of the Greek perfect passive imperative without burdening the main text with an unnatural expression. The sea-identification note is moved to its proper textual anchor, and footnote a is adjusted to describe the passive grammatical alternative accurately.
