  naturalness: The Telugu is generally fluent and modern. “రాత్రింబగళ్లు” and “మొలకెత్తి ఎదుగుతుంది” are natural in this parabolic context. Replacing “అతనికే” with “అతనికి మాత్రం” preserves the contrast and emphasis without implying that no one else knows.
  terminology: “విత్తనం,” “మొలకెత్తి,” and “ఎదుగుతుంది” are suitable modern-standard Telugu renderings. The footnotes are correctly anchored to the growth phrase and the final knowledge clause, respectively.
