source:
  edition: SBLGNT
  text: καὶ καθεύδῃ καὶ ἐγείρηται νύκτα καὶ ἡμέραν, καὶ ὁ σπόρος ⸀βλαστᾷ καὶ μηκύνηται ὡς οὐκ οἶδεν αὐτός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/027.yaml
  text: and he sleeps and rises night and day[a], and the seed sprouts and grows[b], though he himself does not know how.
translation:
  language: te
  text: అతడు రాత్రింబగళ్లు నిద్రపోతూ, మేల్కొంటూ ఉంటాడు; విత్తనం మొలకెత్తి ఎదుగుతుంది[a]. కానీ అది ఎలా జరుగుతుందో అతనికి మాత్రం తెలియదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మొలకెత్తి పొడవుగా పెరుగుతుంది.” రెండో క్రియ ప్రత్యేకంగా పొడవు లేదా ఎత్తు పెరగడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అతనికి తెలియనట్లుగా”; సందర్భంలోని భావం, “అది ఎలా జరుగుతుందో అతనికి మాత్రం తెలియదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεύδῃ
  choice: నిద్రపోతూ ఉంటాడు
  rationale: వర్తమానకాల సుబ్జంక్టివ్ ఈ ఉపమాన క్రమంలో పునరావృతమయ్యే, కొనసాగుతున్న సాధారణ చర్యను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐγείρηται
  choice: మేల్కొంటూ ఉంటాడు
  rationale: ఇక్కడ మధ్యమ/కర్మణి రూపం అకర్మకంగా నిద్రనుంచి లేవడాన్ని సూచిస్తుంది. ‘మేల్కొంటూ’ అనడం పునరుత్థాన భావాన్ని అనవసరంగా రానివ్వదు.
- source_word: νύκτα καὶ ἡμέραν
  choice: రాత్రింబగళ్లు
  rationale: కాలం నిరంతరం సాగుతున్న చక్రాన్ని సూచించే ఈ జంటకు ‘రాత్రింబగళ్లు’ సహజమైన, సంక్షిప్తమైన తెలుగు నుడికారం.
- source_word: ὁ σπόρος
  choice: విత్తనం
  rationale: నిర్దేశక పదంతో ఉన్న ఈ నామవాచకం ఉపమానంలో ముందుగా చల్లిన విత్తనాన్నే తిరిగి సూచిస్తుంది.
- source_word: βλαστᾷ
  choice: మొలకెత్తి
  rationale: మొక్క పెరుగుదలలో ఆరంభ దశను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: μηκύνηται
  choice: ఎదుగుతుంది
  rationale: మూలక్రియలో పొడవు లేదా ఎత్తు పెరగడం అనే ప్రత్యేక ఛాయ ఉన్నప్పటికీ, మొక్క సందర్భంలో ‘ఎదుగుతుంది’ సహజంగా ఉండి ఆ అభివృద్ధి భావాన్ని నిలుపుతుంది; ప్రత్యేక ఛాయను పాదటిప్పణిలో తెలిపాం.
- source_word: ὡς οὐκ οἶδεν αὐτός
  choice: కానీ అది ఎలా జరుగుతుందో అతనికే తెలియదు
  rationale: అక్షరార్థ నిర్మాణం తెలుగులో అసహజంగా ఉంటుంది. ‘ఎలా’ అని స్పష్టం చేయడం తెలియనిది పెరుగుదల జరిగే విధానమేనని చూపుతుంది; ‘అతనికే’ αὐτός లోని ఉద్ఘాటనను నిలుపుతుంది. ‘కానీ’ అతని సాధారణ జీవనక్రమం మరియు అతనికి తెలియకుండానే జరిగే పెరుగుదల మధ్య వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఉపమానంలో విత్తనం ఎదగడానికి కారణమైన కార్యశక్తి
  choice: విత్తనం ఎలా ఎదుగుతుందో విత్తినవానికి తెలియదని మాత్రమే చెప్పి, ఆ కార్యశక్తిని ఈ వచనంలో పేరుపెట్టి వివరించలేదు.
  alternative: దేవుడే దాన్ని పెంచుతున్నాడని స్పష్టంగా చేర్చడం; లేదా ఇది కేవలం సహజ ప్రక్రియ మాత్రమేనని చెప్పడం.
  rationale: గ్రీకు పాఠం విత్తినవాని అవగాహనకు అతీతంగా జరిగే పెరుగుదలను ముందుకు తెస్తుంది; దైవ కార్యాన్ని స్పష్టంగా చేర్చడమో, పూర్తిగా సహజవాదంగా పరిమితం చేయడమో పాఠంలోని ఉద్దేశపూర్వక ఉద్వేగాన్ని తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. నిరంతర/పునరావృత చర్యకు ‘నిద్రపోతూ, మేల్కొంటూ ఉంటాడు’ అని, మొక్క సహజ అభివృద్ధికి ‘మొలకెత్తి ఎదుగుతుంది’ అని ఇచ్చాం. పాదటిప్పణి గుర్తులను అవి వివరిస్తున్న పదబంధాల వెంట ఉంచాం.
