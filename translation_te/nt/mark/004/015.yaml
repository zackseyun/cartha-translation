  revision_rationale: The revision keeps the draft’s faithful core while distinguishing the general temporal clause (“వారు వినినప్పుడు”) from Mark’s explicit “immediately” (“వెంటనే”). The footnote is retained because εἰς αὐτούς may be expressed with a directional nuance, but its Telugu wording is made idiomatic.
