id: MRK.4.15
reference: Mark 4:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτοι δέ εἰσιν οἱ παρὰ τὴν ὁδὸν ὅπου σπείρεται ὁ λόγος, καὶ ὅταν ἀκούσωσιν ⸀εὐθὺς ἔρχεται ὁ Σατανᾶς καὶ αἴρει τὸν λόγον τὸν ἐσπαρμένον ⸂εἰς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/015.yaml
  text: 'And these are the ones along the road where the word is sown: when they hear[a], Satan immediately comes and takes away the word that was sown in them.'
translation:
  language: te
  text: 'వాక్యం విత్తబడే దారి పక్కన ఉన్నవారు వీరే: వారు దానిని వినినప్పుడు, సాతాను వెంటనే వచ్చి వారిలో విత్తబడిన వాక్యాన్ని తీసివేస్తాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారిలోకి విత్తబడిన వాక్యాన్ని.’
    reason: εἰς αὐτούς అనే గ్రీకు పదబంధంలోని దిశార్థక (‘లోకి’) ఛాయను చూపే పదార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: οὗτοι δέ εἰσιν οἱ παρὰ τὴν ὁδόν
  choice: దారి పక్కన ఉన్నవారు వీరే
  rationale: παράతో కూడిన పదబంధం దారి పక్కన ఉన్న స్థానాన్ని సూచిస్తుంది; ఉపమానంలోని నేల మనుషులను సూచిస్తోందని తెలుగులో సహజంగా వ్యక్తమవుతుంది. δέను ప్రత్యేక విరోధార్థక పదంతో భారంగా చేయకుండా వాక్యప్రవాహంలో ఉంచాం.
- source_word: σπείρεται ὁ λόγος
  choice: వాక్యం విత్తబడే
  rationale: λόγοςను ‘వాక్యం’గా అనువదించడం ఉపమానంలోని పునరుక్తిని, బైబిలు సంబంధిత భావాన్ని కాపాడుతుంది; σπείρεται యొక్క కర్మణి రూపాన్ని నిలుపుతుంది.
- source_word: ὅταν ἀκούσωσιν
  choice: వారు దానిని వినగానే
  rationale: సాధారణంగా పునరావృతమయ్యే సందర్భాన్ని సూచించే గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘దానిని’ అనేది వాక్యాన్ని సూచించే స్పష్టీకరణ.
- source_word: εὐθύς
  choice: వెంటనే
  rationale: మార్కు రచనలో కనిపించే తక్షణత్వాన్ని సహజమైన ఆధునిక తెలుగు పదంతో కాపాడుతుంది.
- source_word: ὁ Σατανᾶς
  choice: సాతాను
  rationale: గ్రీకులో వ్యక్తిగత దుష్టశక్తిని సూచించే పేరు/బిరుదును ప్రామాణిక తెలుగు రూపంలో నేరుగా అందిస్తుంది.
- source_word: αἴρει
  choice: తీసివేస్తాడు
  rationale: αἴρω యొక్క ‘తీసివేయు’ అనే విస్తృత అర్థాన్ని కాపాడుతుంది; ‘లాక్కుంటాడు’ వంటి అధిక వ్యాఖ్యానాత్మక బలాన్ని చేర్చదు.
- source_word: τὸν λόγον τὸν ἐσπαρμένον εἰς αὐτούς
  choice: వారిలో విత్తబడిన వాక్యాన్ని
  rationale: కృదంతం ‘వాక్యాన్ని’ విశేషిస్తున్న నిర్మాణాన్ని నిలుపుతుంది. εἰς αὐτούςను ‘వారిలో’ అని ఇవ్వడం అంతర్గత స్వీకరణ భావాన్ని సహజంగా తెలియజేస్తుంది; ‘వారిలోనికి’ కూడా సాధ్యమైన రూపం.
theological_decisions:
- issue: ఉపమాన వివరణలో సాతాను వ్యక్తిగత కార్యసాధకుడిగా ఉండటం
  choice: ‘సాతాను’ వచ్చి వాక్యాన్ని తీసివేస్తాడని నేరుగా అనువదించడం
  alternative: ‘విరోధి’ వంటి మరింత సామాన్య లేదా వ్యక్తిత్వరహిత రూపం
  rationale: ὁ Σατανᾶς అనే నిర్దిష్ట పేరు/బిరుదు ఇక్కడ వ్యక్తిగత దుష్టుని సహజంగా సూచిస్తుంది; అనువాదం దానిని అమూర్తమైన శక్తిగా మార్చకూడదు.
- issue: εἰς αὐτούς యొక్క స్థానార్థక భావం
  choice: వారిలో విత్తబడిన
  alternative: వారిలోనికి విత్తబడిన; వారి మధ్య విత్తబడిన
  rationale: సందర్భం విన్న వ్యక్తులలో వాక్యం స్వీకరించబడటాన్ని సూచిస్తుంది. అయితే గ్రీకు εἰς యొక్క దిశార్థక ఛాయను ‘వారిలోనికి’ మరింత స్పష్టంగా చూపగలదు; ఈ నిజమైన సూక్ష్మ భేదాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. వ్యవసాయ ఉపమానంలోని ‘విత్తడం’ మరియు λόγος యొక్క పునరుక్తికి ‘వాక్యం’ను స్థిరంగా ఉంచాం. పాదటిప్పణి గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
