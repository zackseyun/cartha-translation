id: MRK.4.22
reference: Mark 4:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ⸀κρυπτὸν ἐὰν μὴ ⸀ἵνα φανερωθῇ, οὐδὲ ἐγένετο ἀπόκρυφον ἀλλ’ ἵνα ⸂ἔλθῃ εἰς φανερόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/022.yaml
  text: For nothing is hidden except to be revealed[b][a], nor has anything become concealed except to come to light.
translation:
  language: te
  text: ఎందుకంటే, బయలుపరచబడటానికే తప్ప దాగి ఉన్నదేదీ లేదు[a]; వెలుగులోకి రావటానికే తప్ప మరుగున పడినదేదీ లేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాగి ఉన్నదేదీ బయలుపరచబడకుండా ఉండదు … మరుగున పడినదేదీ వెలుగులోకి రాకుండా ఉండదు.’ గ్రీకులోని ἵνα ఉపవాక్యాలు ఉద్దేశాన్ని గానీ ఫలితాన్ని గానీ సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, ‘కనిపించే/బహిరంగమైన దానిలోకి రావటం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτόν
  choice: దాగి ఉన్నది
  rationale: ఈ పదం కనిపించకుండా లేదా తెలియకుండా ఉన్నదాన్ని సూచిస్తుంది. ‘దాగి ఉన్నది’ ఆధునిక తెలుగులో సహజంగా ఉండి, తరువాతి ‘బయలుపరచబడటం’తో స్పష్టమైన వ్యతిరేకతను నిలుపుతుంది.
- source_word: ἐὰν μὴ ἵνα
  choice: …టానికే తప్ప
  rationale: ఈ నిర్మాణంలోని మినహాయింపు భావాన్నీ, ἵναలోని ఉద్దేశం లేదా ఫలితం ఛాయనూ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: φανερωθῇ
  choice: బయలుపరచబడటం
  rationale: φανερόω కర్మణి రూపం కనిపించేలా లేదా తెలిసేలా చేయబడటాన్ని సూచిస్తుంది. ఈ ఎంపిక కర్మణి భావాన్ని కాపాడుతుంది.
- source_word: ἀπόκρυφον
  choice: మరుగునకు వచ్చినది
  rationale: కంటికి లేదా అవగాహనకు అందకుండా ఉన్న స్థితిని సూచిస్తూ, κρυπτόνకు వాడిన పదాన్ని యథాతథంగా పునరావృతం చేయకుండా సమాంతర భావాన్ని నిలుపుతుంది.
- source_word: ἐγένετο
  choice: మరుగునకు వచ్చినది
  rationale: γίνομαιలోని ఒక స్థితిలోకి రావడం అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి విశేషణ భావంతో కలిపి అనువదించబడింది.
- source_word: ἔλθῃ εἰς φανερόν
  choice: వెలుగులోకి రావటం
  rationale: ‘కనిపించే దానిలోకి రావడం’ అనే గ్రీకు చలన చిత్రణను సహజమైన తెలుగు నుడికారంతో తెలియజేస్తుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి మాటకు ఈ వాక్యం ఇచ్చే వివరణాత్మక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: రెండు ἵνα ఉపవాక్యాల్లో ఉద్దేశం–ఫలితం మధ్య భావ ఛాయ
  choice: ‘…టానికే తప్ప’ అని అనువదించి ఉద్దేశ భావాన్ని ప్రధాన పాఠ్యంలో నిలపడం
  alternative: ‘…బడకుండా ఉండదు’ లేదా ‘చివరకు …బడుతుంది’ అని ఫలిత భావంతో అనువదించడం
  rationale: ἵνα సాధారణంగా ఉద్దేశాన్ని సూచించినా, కొయినే గ్రీకులో ఫలిత భావాన్నీ కలిగి ఉండగలదు. ప్రధాన అనువాదం ఉద్దేశ ఛాయను ఉంచుతుంది; పాదటిప్పణి రెండవ సాధ్య భావాన్ని తెలియజేసి దైవ కారణత్వంపై అదనపు నిర్ణయాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. రెండు అర్ధవాక్యాల సమాంతర నిర్మాణం, దాగి ఉండటం–బయలుపడటం అనే వ్యతిరేకత, అలాగే గ్రీకులోని చలన చిత్రణ సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
