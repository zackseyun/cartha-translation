review_pass:
  verdict: revise
  source_fidelity: The first clause faithfully conveys κρυπτόν, the exception-plus-ἵνα construction, and the passive φανερωθῇ. In the second clause, however, “మరుగునకు వచ్చినది” is less idiomatic and does not clearly express ἐγένετο ἀπόκρυφον (“became concealed”). “మరుగున పడినది” naturally conveys entering a concealed state while retaining the Greek contrast with subsequent disclosure.
  naturalness: The proposed revision improves the second parallel member in modern standard Telugu. It retains the concise, proverbial cadence and the parallel “...టానికే తప్ప ... లేదు” structure.
  terminology: “దాగి ఉన్నది / బయలుపరచబడటం” and “మరుగున పడినది / వెలుగులోకి రావటం” provide appropriately differentiated parallel terms. The footnote preserves the debated purpose/result shading of ἵνα without forcing a doctrinal conclusion.
  issues:
  - severity: medium
    issue: “మరుగునకు వచ్చినదేదీ” is awkward and semantically imprecise.
    rationale: This wording can sound like something that has ‘come toward concealment,’ rather than something that ‘became concealed’ (ἐγένετο ἀπόκρυφον). “మరుగున పడినదేదీ” is a natural Telugu expression for entering a hidden/concealed condition.
