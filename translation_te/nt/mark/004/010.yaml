id: MRK.4.10
reference: Mark 4:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂Καὶ ὅτε⸃ ἐγένετο κατὰ μόνας, ⸀ἠρώτων αὐτὸν οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα ⸂τὰς παραβολάς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/010.yaml
  text: And when he was alone[a], those around him with the Twelve were asking him about the parables.
translation:
  language: te
  text: ఆయన ఏకాంతంలో ఉన్నప్పుడు, ఆయన చుట్టూ ఉన్నవారు[a] పన్నెండుమందితో కలిసి ఆయనను ఉపమానాల గురించి అడుగుతూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనతో ఉన్నవారు.” ఈ మాట యేసు చుట్టూ ఉన్న విస్తృత అనుచర వర్గాన్ని సూచించవచ్చు; అది పన్నెండుమందిని మాత్రమే సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: అప్పుడు
  rationale: καί అనే కథన అనుసంధానాన్ని, ὅτε అనే కాలసూచనను కలిపి ఆధునిక తెలుగులో సహజమైన కథన ప్రవాహంతో వ్యక్తం చేస్తుంది.
- source_word: ἐγένετο κατὰ μόνας
  choice: ఆయన ఏకాంతంగా ఉన్నప్పుడు
  rationale: κατὰ μόνας అనే నుడికారానికి ‘ఏకాంతంగా’ అనేది ఒంటరిగా లేదా జనసమూహానికి దూరంగా ఉన్న భావాన్ని సహజంగా అందిస్తుంది; γίνομαιను అక్షరార్థంగా అనువదించకుండా సందర్భార్థాన్ని ఇస్తుంది.
- source_word: ἠρώτων
  choice: అడుగుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న లేదా పునరావృత చర్య భావాన్ని నిలుపుతుంది.
- source_word: οἱ περὶ αὐτὸν
  choice: ఆయన చుట్టూ ఉన్నవారు
  rationale: యేసును అనుసరించిన విస్తృత వర్గాన్ని సూచించే వ్యక్తీకరణను నిలుపుతూ, వారిని పన్నెండుమందితో సమానంగా పరిమితం చేయదు.
- source_word: σὺν τοῖς δώδεκα
  choice: పన్నెండుమందితో కలిసి
  rationale: σύν తెలిపే సహవాసాన్ని స్పష్టంగా వ్యక్తం చేసి, విస్తృత అనుచర వర్గానికీ పన్నెండుమందికీ మధ్య ఉన్న వాక్యనిర్మాణ భేదాన్ని కాపాడుతుంది.
- source_word: τὰς παραβολάς
  choice: ఉపమానాల గురించి
  rationale: SBLGNTలోని బహువచనాన్ని నిలుపుతుంది; προηγటి ఉపమాన బోధను సూచిస్తుంది.
theological_decisions:
- issue: ప్రశ్నించినవారి గుర్తింపు
  choice: యేసు చుట్టూ ఉన్న విస్తృత అనుచర వర్గం పన్నెండుమందితో కలిసి అడిగింది.
  alternative: పన్నెండుమంది మాత్రమే అడిగారు; లేదా పన్నెండుమందికి వేరైన అంతరంగిక వర్గం అడిగింది.
  rationale: οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα అనే వాక్యనిర్మాణం యేసు చుట్టూ ఉన్నవారిని పన్నెండుమందితో కలిపి చూపుతుంది. అనువాదం వారిని ఒకే గుంపుగా కుదించకుండా ఈ భేదాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కథన శైలి. ‘ఉపమానాలు’ అనే స్థిరమైన బైబిలు పదాన్ని కొనసాగిస్తూ, మిగతా వాక్యాన్ని సహజమైన తెలుగు క్రమంలో ఇచ్చాం.
