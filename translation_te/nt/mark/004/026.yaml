source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν· Οὕτως ἐστὶν ἡ βασιλεία τοῦ θεοῦ ⸀ὡς ἄνθρωπος βάλῃ τὸν σπόρον ἐπὶ τῆς γῆς
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/026.yaml
  text: 'And he was saying[c][b][a], “The kingdom of God is like this: as when a man casts the seed upon the ground,”'
translation:
  language: te
  text: 'ఆయన ఇలా చెబుతూ ఉన్నాడు: “దేవుని రాజ్యం ఈ విధంగా ఉంది: ఒక మనిషి నేలపై విత్తనం చల్లినట్లుగా—[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని రాజ్యం ఒక మనిషి నేలపై విత్తనం చల్లినట్లుగా ఉంది.” గ్రీకు వాక్యనిర్మాణం సంక్షిప్తంగా ఉంది; పోలిక తరువాతి వచనంలో కొనసాగుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: చెబుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న మాటను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; కేవలం ‘చెప్పాడు’ అనే సరళ భూతకాలం కంటే మూలంలోని క్రియాంశాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: Οὕτως
  choice: ఇలా
  rationale: తరువాత వచ్చే ఉపమాన విధానాన్ని పరిచయం చేసే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: βασιλεία τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: ‘రాజ్యం’ అనే పదం దేవుని పరిపాలనను, ఆయన రాజ్య పరిధిని రెండింటినీ సూచించగలదు; సువార్తల ఉపమానాలలో సుపరిచితమైన, తగిన రూపం.
- source_word: ὡς
  choice: …చల్లినట్లుగా
  rationale: గ్రీకులోని పోలికను తెలుగులో క్రియకు జతచేసిన ‘తట్లుగా’ రూపంతో వ్యక్తం చేస్తుంది; పోలిక తదుపరి వచనంలో కొనసాగుతుందనే తెరచిన నిర్మాణాన్ని నిలుపుతుంది.
- source_word: ἄνθρωπος
  choice: ఒక మనిషి
  rationale: మూలంలోని వ్యాకరణపరంగా పుంలింగ ఏకవచన ప్రతినిధి పాత్రను నేరుగా ప్రతిబింబిస్తుంది.
- source_word: βάλῃ
  choice: చల్లిన
  rationale: βάλλω యొక్క ‘వేయడం/చల్లడం’ దృశ్యాన్ని వ్యవసాయ సందర్భంలో సహజంగా తెలియజేస్తుంది; ‘విత్తిన’ అని మాత్రమే అనువదించి మూలంలోని చల్లే భావాన్ని కోల్పోకుండా ఉంటుంది.
- source_word: τὸν σπόρον
  choice: విత్తనం
  rationale: ఈ సందర్భంలో గ్రీకు నిర్దేశక పదంతో ఉన్న నామవాచకం సామాన్యార్థకంగా విత్తనాన్ని సూచిస్తుంది; తెలుగులో ‘విత్తనం’ సహజం.
- source_word: ἐπὶ τῆς γῆς
  choice: నేలపై
  rationale: వ్యవసాయ సందర్భంలో γῆ విశ్వార్థంలోని ‘భూమి’ కంటే విత్తనం పడే నేలను సూచిస్తుంది; ἐπί భావాన్ని ‘పై’ నిలుపుతుంది.
theological_decisions:
- issue: తదుపరి వచనంలో కొనసాగుతున్న సంక్షిప్త ఉపమాన నిర్మాణం
  choice: '‘ఇలా ఉంటుంది: … చల్లినట్లుగా—’ అని పోలికను పూర్తి చేయకుండా తెరిచి ఉంచడం'
  alternative: ‘దేవుని రాజ్యం, ఒక మనిషి నేలపై విత్తనం చల్లినట్లుగా ఉంటుంది’ అని ఈ వచనంలోనే వాక్యాన్ని పూర్తి చేయడం
  rationale: Οὕτως…ὡς అనే గ్రీకు నిర్మాణం సంక్షిప్తంగా ఉండి, పోలిక యొక్క వివరణ 27వ వచనంలో కొనసాగుతుంది. దీన్ని ఈ వచనంలోనే పూర్తిచేయడం మూలంలోని ప్రవాహాన్ని మృదువుగా మార్చేస్తుంది; డాష్ ఆ కొనసాగింపును సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘చెబుతూ ఉన్నాడు’ మూలంలోని కొనసాగుతున్న క్రియాంశాన్ని నిలుపుతుంది. చివరి డాష్ ఉపమానం 27వ వచనంలో కొనసాగుతుందని చూపిస్తుంది.
