id: MRK.4.12
reference: Mark 4:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα βλέποντες βλέπωσι καὶ μὴ ἴδωσιν, καὶ ἀκούοντες ἀκούωσι καὶ μὴ συνιῶσιν, μήποτε ἐπιστρέψωσιν καὶ ἀφεθῇ ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/012.yaml
  text: so that seeing they may see and not perceive[a], and hearing they may hear and not understand[c][b], lest they turn back and it be forgiven them.
translation:
  language: te
  text: వారు చూస్తూ చూసినా గ్రహించకుండా, వింటూ విన్నా అర్థం చేసుకోకుండా ఉండునట్లు, ఎక్కడైనా వారు వెనుదిరిగి వారికి క్షమాపణ లభిస్తుందేమో అని.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: …కుండునట్లు
  rationale: ఉద్దేశం/ఫలితం అనే బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది; వాక్యంలోని కఠినమైన భావాన్ని కేవలం వివరణగా మెత్తబరచదు.
- source_word: βλέποντες βλέπωσι
  choice: చూస్తూ చూస్తూనే ఉన్నా
  rationale: కృదంతం, సమాపక క్రియ రెండింటినీ ప్రతిబింబిస్తూ పునరుక్తి వల్ల వచ్చే ప్రవచనాత్మక ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἴδωσιν
  choice: గ్రహించు
  rationale: βλέπωతో ఉన్న భేదాన్ని చూపుతూ, కేవలం కంటితో చూడడం కాక నిజంగా గుర్తించి తెలుసుకోవడం అనే భావాన్ని ఇస్తుంది.
- source_word: ἀκούοντες ἀκούωσι
  choice: వింటూ వింటూనే ఉన్నా
  rationale: మూలంలోని ద్విరుక్తిని సహజమైన ఆధునిక తెలుగులో నిలిపి, యెషయా ప్రతిధ్వనిలోని వాక్చాతుర్యాన్ని కాపాడుతుంది.
- source_word: συνιῶσιν
  choice: అర్థం చేసుకో
  rationale: మానసిక, ఆధ్యాత్మిక అవగాహన రెండింటికీ తగిన స్పష్టమైన సాధారణ తెలుగు పదబంధం.
- source_word: μήποτε
  choice: …కుండునట్లు
  rationale: ప్రతికూల సంభావ్యత/నిరోధ భావాన్ని సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది; 'లేకపోతే' అని మార్చి సంబంధాన్ని మెత్తబరచదు.
- source_word: ἐπιστρέψωσιν
  choice: వెనుదిరుగు
  rationale: తిరగడం/తిరిగి రావడం అనే మూల రూపకాన్ని నిలుపుతుంది; పశ్చాత్తాపం అనే సందర్భార్థాన్ని ప్రధాన పాఠంలో అతిగా స్పష్టం చేయదు.
- source_word: ἀφεθῇ αὐτοῖς
  choice: క్షమాపణ పొందు
  rationale: దైవకర్తను ప్రకటించకుండా గ్రీకు దైవ కర్మణి భావాన్ని సహజమైన తెలుగు కర్మణ్యర్థక నిర్మాణంలో అందిస్తుంది.
theological_decisions:
- issue: యెషయా ఉల్లేఖనంలోని ఉద్దేశం/ఫలితం మరియు ఉపమానాలు పశ్చాత్తాపాన్ని నిరోధిస్తున్నాయనే సంభావ్య భావం
  choice: ఉద్దేశం/ఫలితాన్ని సూచించే ‘…కుండునట్లు’ నిర్మాణాన్ని నిలుపడం
  alternative: ‘అందువల్ల వారు…’ లేదా ‘లేకపోతే వారు…’
  rationale: గ్రీకు వాక్యంలోని దైవ తీర్పు మరియు ప్రజల స్పందనలేమి మధ్యనున్న ఉద్దేశపూర్వక ఉద్రిక్తతను పరిష్కరించకుండా అలాగే ఉంచుతుంది.
- issue: ἐπιστρέψωσινలో పశ్చాత్తాప భావం
  choice: ప్రధాన పాఠంలో ‘వెనుదిరిగి’; పాదటిప్పణిలో ‘తిరిగి/పశ్చాత్తాపపడటం’ అనే అవకాశాలు
  alternative: ప్రధాన పాఠంలోనే ‘పశ్చాత్తాపపడి’
  rationale: ప్రవచన సందర్భంలో పశ్చాత్తాప ఛాయ ఉన్నప్పటికీ, గ్రీకు క్రియకు ఉన్న విస్తృతమైన తిరగడం/తిరిగి రావడం అనే అర్థాన్ని ప్రధాన పాఠం కాపాడుతుంది.
- issue: ἀφεθῇ αὐτοῖςలో సూచిత కర్త
  choice: కర్తను పేర్కొనకుండా ‘క్షమాపణ పొందకుండునట్లు’
  alternative: ‘దేవుడు వారిని క్షమించకుండునట్లు’
  rationale: దేవుడే సూచిత కర్త కావచ్చని అంగీకరిస్తూనే, మూలంలోని కర్మణి రూపం వెల్లడించని కర్తను అనువాదంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన ప్రవచన ధోరణిని ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. ‘చూస్తూ చూస్తూనే’, ‘వింటూ వింటూనే’ అనే పునరుక్తులు మూలంలోని సెమీయ ఉద్ఘాటనను సహజంగా ప్రతిబింబిస్తాయి. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
