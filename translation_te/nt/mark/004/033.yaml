source:
  edition: SBLGNT
  text: Καὶ τοιαύταις παραβολαῖς πολλαῖς ἐλάλει αὐτοῖς τὸν λόγον, καθὼς ἠδύναντο ἀκούειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/033.yaml
  text: And with many such parables he was speaking the word to them[b][a], as they were able to hear it.
translation:
  language: te
  text: ఈ విధమైన అనేక ఉపమానాలతో ఆయన వారికి వాక్యాన్ని[b] చెప్పేవాడు, వారు వినగలిగినంత మేరకు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు వినగలిగినంతగా” లేదా “వారి వినే సామర్థ్యానికి తగినట్లుగా.”
    reason: lexical_alternative
  - marker: b
    text: ‘వాక్యాన్ని’ అనే చోట “సందేశాన్ని” లేదా “బోధను” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιαύταις παραβολαῖς πολλαῖς
  choice: ఇలాంటి అనేక ఉపమానాలతో
  rationale: ముందు చెప్పిన ఉపమానాల రకాన్ని సూచించే τοιαύταις భావాన్ని ‘ఇలాంటి’ సహజంగా తెలియజేస్తుంది; παραβολαῖςకు స్థిరమైన తెలుగు బైబిలు పదం ‘ఉపమానాలు’; πολλαῖςను ‘అనేక’గా ఇచ్చాం.
- source_word: ἐλάλει αὐτοῖς
  choice: ఆయన వారికి ... బోధిస్తూ ఉండేవాడు
  rationale: λαλέω యొక్క ప్రాథమిక భావం మాట్లాడడం అయినా, ఇక్కడ బోధనా సందర్భంలో కర్మగా ‘వాక్యాన్ని’ తీసుకోవడం వల్ల ‘బోధిస్తూ’ సహజంగా ఉంది. అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న లేదా అలవాటైన చర్యను ‘ఉండేవాడు’ నిలుపుతుంది.
- source_word: τὸν λόγον
  choice: వాక్యాన్ని
  rationale: λόγος ఇక్కడ యేసు ప్రకటించిన సందేశం లేదా బోధను సూచిస్తుంది. ‘వాక్యం’ గ్రీకు వ్యక్తీకరణను, మార్కు సువార్తలోని ప్రతిధ్వనిని కాపాడుతుంది; అర్థాన్ని ఒక నిర్దిష్ట సిద్ధాంతానికి పరిమితం చేయదు.
- source_word: καθὼς ἠδύναντο ἀκούειν
  choice: వారు వినగలిగినంత మేరకు
  rationale: καθὼς ఇక్కడ సామర్థ్యానికి అనుగుణమైన పరిమాణాన్ని సూచిస్తుంది. ‘వినగలిగినంత మేరకు’ అనే రూపం ఆ కొలత భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; ἀκούεινను ‘అర్థం చేసుకోవడం’గా విస్తరించకుండా ‘వినడం’గానే ఉంచుతుంది.
theological_decisions:
- issue: τὸν λόγον యొక్క భావం
  choice: ప్రధాన పాఠంలో ‘వాక్యాన్ని’
  alternative: ‘సందేశాన్ని’ లేదా ‘బోధను’
  rationale: ఇది యేసు ప్రకటించిన విషయాన్ని సూచిస్తుంది. ‘వాక్యం’ మూలంలోని రూపాన్ని, బైబిలు ప్రయోగాన్ని కాపాడుతుంది; ప్రత్యామ్నాయ భావాలను పాదసూచికలో తెలియజేస్తుంది.
- issue: ἀκούειν సూచించే భావం
  choice: ‘వినగలిగినంత’
  alternative: ‘అర్థం చేసుకోగలిగినంత’ లేదా ‘స్వీకరించగలిగినంత’
  rationale: సందర్భంలో గ్రహించడం అంతర్భావంగా ఉండవచ్చుగానీ, గ్రీకు పదం ప్రత్యక్షంగా ‘వినడం’నే చెబుతుంది. అందువల్ల మూలపాఠంలోని భావ ఉద్రిక్తతను పరిష్కరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘బోధిస్తూ ఉండేవాడు’ అసంపూర్ణ భూతకాల భావాన్ని తెలుగులో సహజంగా అందిస్తుంది. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠంలో ఉంచబడ్డాయి.
