source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Βλέπετε τί ἀκούετε. ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν καὶ προστεθήσεται ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/024.yaml
  text: And he was saying to them[a], “Pay attention to what you hear. With the measure you use, it will be measured to you[b], and more will be added to you.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా చెబుతూ ఉన్నాడు: “మీరు ఏమి వింటున్నారో జాగ్రత్తగా గమనించండి. మీరు ఏ కొలతతో కొలుస్తారో, అదే కొలతతో మీకు కొలిచి ఇవ్వబడుతుంది; ఇంకా మీకు మరింత జతచేయబడుతుంది.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మీకు చేర్చబడుతుంది.” సందర్భంలో ఇది అదనంగా కలిగేదాన్ని సూచిస్తుంది; అది ఏమిటో వాక్యం ప్రత్యేకంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: చెబుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న లేదా పునరావృతమవుతున్న మాటల భావాన్ని నిలుపుతూ, తెలుగు కథనంలో సహజంగా వినిపించే రూపాన్ని ఎంచుకున్నాం.
- source_word: Βλέπετε
  choice: జాగ్రత్తగా గమనించండి
  rationale: ఇక్కడ అక్షరార్థమైన ‘చూడండి’ కంటే, శ్రద్ధగా వినాలనే హెచ్చరిక లేదా ప్రోత్సాహం ఉద్దేశించబడింది.
- source_word: τί ἀκούετε
  choice: మీరు ఏమి వింటున్నారో
  rationale: τί అనేది ‘ఏమి’ అని నేరుగా సూచిస్తుంది. లూకా 8:18లోని ‘ఎలా వింటున్నారో’ అనే భావంతో దీనిని సమన్వయపరచలేదు.
- source_word: ἐν ᾧ μέτρῳ μετρεῖτε
  choice: మీరు ఏ కొలతతో కొలుస్తారో
  rationale: కొలత అనే రూపకాన్ని, కొలిచే ప్రమాణం లేదా సాధనం అనే గ్రీకు నిర్మాణ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: μετρηθήσεται ὑμῖν
  choice: అదే కొలతతో మీకు కొలవబడుతుంది
  rationale: భవిష్యత్ కర్మణి రూపాన్ని, పరస్పర ప్రతిఫల భావాన్ని నిలుపుతుంది. తెలుగులో వాక్యం స్పష్టంగా ఉండేందుకు సందర్భంలో అంతర్లీనంగా ఉన్న ‘అదే కొలతతో’ అని పేర్కొన్నాం.
- source_word: προστεθήσεται ὑμῖν
  choice: మీకు మరింత ఇవ్వబడుతుంది
  rationale: προστίθημι యొక్క ‘చేర్చు/అదనంగా కలుపు’ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. ‘మరింత’ అనేది పెరుగుదల భావాన్ని స్పష్టం చేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: కొలతకు తగిన ప్రతిఫలం అనే మాట యొక్క అన్వయం
  choice: యేసు బోధను వినడం అనే తక్షణ సందర్భంలో ఉంచినా, ఇది కేవలం అవగాహన, తీర్పు, దాతృత్వం లేదా ప్రతిఫలం గురించేనని ప్రధాన పాఠ్యంలో పరిమితం చేయలేదు.
  alternative: ‘మరింత’ అనేది యేసు బోధను స్వీకరించేవారికి పెరిగే ఆధ్యాత్మిక అవగాహనను మాత్రమే సూచిస్తుందని స్పష్టీకరించడం.
  rationale: సందర్భం వినడం మరియు స్వీకరించడం గురించి ఉన్నప్పటికీ, కొలత రూపకం విస్తృతంగా ఉంది. అందువల్ల దాని నిజమైన దైవశాస్త్రీయ విస్తృతిని, ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘ఏమి వింటున్నారో’ అనే మార్కు ప్రత్యేక పదప్రయోగాన్ని నిలిపి, ఇతర సువార్తలతో సమన్వయపరచలేదు; కొలత రూపకాన్ని కూడా వివరణాత్మకంగా మార్చకుండా ఉంచాం.
