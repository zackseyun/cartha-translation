  text: Listen! Behold[a], the sower went out to sow.
translation:
  language: te
  text: “వినండి! ఇదిగో, విత్తేవాడు విత్తడానికి బయలుదేరాడు.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούετε
  choice: వినండి!
  rationale: వర్తమానకాల క్రియాశీల ఆజ్ఞార్థక బహువచనం; శ్రోతల దృష్టిని ఆకర్షించే ఆజ్ఞగా ఉన్న బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἰδού
  choice: ఇదిగో,
  rationale: తరువాత చెప్పబోయేదానిపై దృష్టి నిలిపే సంభాషణ సూచకం. ‘ఇదిగో’ గ్రీకు పదంలోని కథనాత్మక దృష్టి-ఆహ్వాన బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐξῆλθεν
  choice: బయలుదేరాడు
  rationale: బయటకు వెళ్లడాన్ని సూచించే భూతకాల క్రియ. ఈ సందర్భంలో ఒక పనికోసం వెళ్లడాన్ని ‘బయలుదేరాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: ὁ σπείρων
  choice: విత్తేవాడు
  rationale: నామవాచకంగా వాడిన వర్తమాన కృదంతం; సందర్భంలో పాత్రను సూచిస్తున్నందున ‘విత్తేవాడు’ స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: σπεῖραι
  choice: విత్తడానికి
  rationale: ἐξῆλθεν తరువాత ఉద్దేశాన్ని తెలిపే అనిర్దిష్ట క్రియారూపం; ‘విత్తడానికి’ ఆ ప్రయోజన సంబంధాన్ని నేరుగా వ్యక్తం చేస్తుంది.
theological_decisions: []
