id: MRK.4.35
reference: Mark 4:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ λέγει αὐτοῖς ἐν ἐκείνῃ τῇ ἡμέρᾳ ὀψίας γενομένης· Διέλθωμεν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/035.yaml
  text: And he says to them on that day[a], when evening had come, “Let us go across to the other side.”
translation:
  language: te
  text: ఆ రోజు సాయంకాలమైనప్పుడు ఆయన వారితో, “మనం అవతలి ఒడ్డుకు వెళ్దాం[a],” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మనం అవతలి ఒడ్డుకు దాటి వెళ్దాం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: అన్నాడు
  rationale: మార్కు వాడిన కథన వర్తమాన కాలాన్ని తెలుగులో యథాతథంగా ‘అంటున్నాడు’ అని అనువదిస్తే ఈ సందర్భంలో అసహజంగా ఉంటుంది; సహజమైన తెలుగు కథనశైలిలో భూతకాల రూపం వాడబడింది.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ఆ రోజు
  rationale: కాలాన్ని సూచించే గ్రీకు పదబంధానికి సహజమైన, స్పష్టమైన ఆధునిక తెలుగు రూపం.
- source_word: ὀψίας γενομένης
  choice: సాయంకాలమైనప్పుడు
  rationale: జెనిటివ్ అబ్సల్యూట్ తెలిపే సమయ సంబంధాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: Διέλθωμεν
  choice: మనం ... వెళ్దాం
  rationale: ప్రథమ పురుష బహువచన ప్రేరణార్థక సబ్జంక్టివ్‌ను సహజమైన తెలుగు ఆహ్వాన రూపంలో వ్యక్తపరుస్తుంది; సరస్సు దాటే భావం అవతలి ఒడ్డుకు అనే సందర్భంతో స్పష్టమవుతుంది.
- source_word: εἰς τὸ πέραν
  choice: అవతలి ఒడ్డుకు
  rationale: ఈ సరస్సు ప్రయాణ సందర్భంలో ‘మరో వైపుకు’ కంటే గమ్యాన్ని మరింత సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగులో అసహజంగా బలవంతం చేయకుండా సాధారణ కథన భూతకాలంతో అనువదించాం.
