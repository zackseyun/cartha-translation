  text: καὶ ἔλεγεν· ⸂Ὃς ἔχει⸃ ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/009.yaml
  text: And he was saying[a], “Whoever has ears to hear, let him hear.”
translation:
  language: te
  text: 'ఆయన ఇలా చెబుతూ ఉండేవాడు: “వినడానికి చెవులు ఉన్నవాడు వినాలి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: ఇలా
  rationale: తెలుగులో ప్రత్యక్ష వాక్యాన్ని సహజంగా పరిచయం చేస్తుంది; καὶ యొక్క సాధారణ అనుసంధాన భావం సందర్భంలో కొనసాగింపుగా వ్యక్తమవుతుంది.
- source_word: ἔλεγεν
  choice: చెబుతూ ఉండేవాడు
  rationale: అసంపూర్ణ భూతకాల క్రియారూపంలోని కొనసాగింపు లేదా అలవాటుసూచక కోణాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; పునరావృతిని అతిగా బలపరచదు.
- source_word: Ὃς ἔχει
  choice: ఉన్నవాడు
  rationale: గ్రీకు ఏకవచన సాధారణ సంబంధ నిర్మాణాన్ని తెలుగులో సహజమైన సాధారణ వ్యక్తి సూచనగా వ్యక్తపరుస్తుంది; ఇది పురుషులకు మాత్రమే పరిమితమైన అర్థాన్ని ఇవ్వదు.
- source_word: ὦτα
  choice: చెవులు
  rationale: బహువచన నామవాచకానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: ἀκούειν
  choice: వినడానికి
  rationale: చెవుల ఉద్దేశాన్ని తెలిపే క్రియార్థక నిర్మాణాన్ని సహజంగా వ్యక్తపరచడంతో పాటు తదుపరి క్రియతో ఉన్న పదపునరుక్తిని నిలుపుతుంది.
- source_word: ἀκουέτω
  choice: వినాలి
  rationale: మూడవ పురుష ఆజ్ఞార్థక బలాన్ని తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది; ‘విననివ్వండి’ కంటే వ్యక్తికి ఇచ్చే పిలుపును మెరుగ్గా అందిస్తుంది.
theological_decisions:
- issue: సామెతసదృశమైన వాక్యంలో సాధారణ పుంలింగ ఏకవచన నిర్మాణం
  choice: “ఉన్నవాడు వినాలి” అని సాధారణ వ్యక్తిని సూచించే ఏకవచనంగా అనువదించడం
  alternative: “ఎవరికైనా ... వారు వినాలి” లేదా “చెవులు గలవాడు వినుగాక”
  rationale: గ్రీకు పుంలింగ ఏకవచనం ఇక్కడ పురుషుణ్ణి మాత్రమే కాక సాధారణంగా ఎవరినైనా సూచిస్తుంది. తెలుగు ‘వాడు’ ఈ సామెతసదృశ నిర్మాణంలో సహజమైన సాధారణ ఏకవచనంగా పనిచేస్తుంది; మూలంలోని ఏకవచన నిర్మాణం, ఆజ్ఞ రెండూ నిలుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘వినడానికి ... వినాలి’ అనే పునరుక్తి మూలంలోని ἀκούειν/ἀκουέτω పదప్రతిధ్వనిని ఉద్దేశపూర్వకంగా నిలుపుతుంది.
