  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐδίδασκεν αὐτοὺς ἐν παραβολαῖς πολλά καὶ ἔλεγεν αὐτοῖς ἐν τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/002.yaml
  text: 'And he was teaching them many things in parables[a], and in his teaching he was saying to them:'
translation:
  language: te
  text: 'ఆయన వారికి ఉపమానాల ద్వారా అనేక విషయాలు బోధిస్తూ, తన బోధలో వారితో ఇలా చెబుతూ ఉన్నాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: బోధిస్తూ
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న చర్యను సహజమైన తెలుగు క్రియారూపంతో నిలుపుతుంది.
- source_word: ἐν παραβολαῖς
  choice: ఉపమానాల ద్వారా
  rationale: ἐν + చతుర్థీ ఇక్కడ బోధనా మాధ్యమాన్ని లేదా విధానాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజంగా ఉంటుంది.
- source_word: πολλά
  choice: అనేక విషయాలు
  rationale: నపుంసక బహువచన రూపంలోని విస్తృతార్థాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది; 'ఎంతో' అనే సంక్షిప్త ప్రత్యామ్నాయం కన్నా ఇక్కడ సహజం.
- source_word: ἔλεγεν
  choice: చెబుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న వాక్చర్యను, తరువాత వచ్చే ప్రత్యక్ష ప్రసంగానికి దారితీసే విధంగా నిలుపుతుంది.
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: తన బోధలో
  rationale: గ్రీకు నిర్మాణాన్ని దగ్గరగా అనుసరిస్తూ, తరువాత చెప్పేది ఆయన బోధలో భాగమని తెలియజేస్తుంది.
- source_word: καὶ
  choice: ఆయన
  rationale: తెలుగులో వాక్యారంభంలో 'మరియు' అనడం కృత్రిమంగా ఉండేందున, కథన అనుసంధానాన్ని సందర్భానికి వదలి సహజమైన కర్తతో ప్రారంభించబడింది.
- source_word: αὐτοὺς / αὐτοῖς
  choice: వారికి / వారితో
  rationale: తెలుగు వాడుకలో 'బోధించు' క్రియకు సహజమైన సంప్రదాన రూపం 'వారికి'; 'చెప్పు'తో సంభాషణ భావానికి 'వారితో' సహజంగా సరిపోతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. రెండు గ్రీకు అసంపూర్ణ భూతకాల క్రియల కొనసాగింపు భావాన్ని 'బోధిస్తూ ... చెబుతూ ఉన్నాడు' ద్వారా నిలిపి, తరువాతి వచనంలోని ప్రత్యక్ష ప్రసంగానికి అనుకూలంగా ద్విబిందువుతో ముగించబడింది.
