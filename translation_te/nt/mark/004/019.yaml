source:
  edition: SBLGNT
  text: καὶ αἱ μέριμναι τοῦ ⸀αἰῶνος καὶ ἡ ἀπάτη τοῦ πλούτου καὶ αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι εἰσπορευόμεναι συμπνίγουσιν τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/019.yaml
  text: and the cares of the age[a], and the deceitfulness of riches, and the desires for other things entering in choke the word[d][c][b], and it becomes unfruitful.
translation:
  language: te
  text: ఈ యుగపు చింతలు[a], సంపద యొక్క మోసం[b], ఇతర విషయాలపట్ల కోరికలు లోనికి చొరబడి వాక్యాన్ని ఊపిరాడనీయకుండా అణచివేస్తాయి; అప్పుడు వాక్యం ఫలంలేనిదిగా అవుతుంది.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఈ లోకపు చింతలు.’ గ్రీకు పదం ‘యుగం’ అని, విస్తృతార్థంలో ప్రస్తుత లోకవ్యవస్థ అని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సంపద కలిగించే మోసం.’
    reason: lexical_alternative
  - marker: c
    text: గ్రీకులో అక్షరార్థంగా ‘అది ఫలంలేనిదిగా అవుతుంది.’ సందర్భంలో ఇది ‘వాక్యాన్ని’ సూచించడం సహజమైన అర్థం; విన్న వ్యక్తి లేదా విత్తనం/మొక్క ఫలించదనే భావంతోనూ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: μέριμναι
  choice: చింతలు
  rationale: ఈ పదం బాధ్యతలతో కూడిన చింతలను లేదా ఆందోళనలను సూచించగలదు. ‘చింతలు’ సహజమైన ఆధునిక తెలుగు పదం; భావాన్ని అతిగా మానసిక స్థితికే పరిమితం చేయదు.
- source_word: αἰῶνος
  choice: యుగపు
  rationale: αἰών యొక్క ప్రాథమిక కాలసంబంధ భావాన్ని నిలుపుతూ ‘ఈ యుగపు’ అని అనువదించాం; సందర్భంలో ఇది ప్రస్తుత లోకవ్యవస్థను కూడా సూచించవచ్చు.
- source_word: ἀπάτη τοῦ πλούτου
  choice: సంపద కలిగించే మోసం
  rationale: సంపద మనిషిని తప్పుదారి పట్టించే స్వభావాన్ని ఈ రూపం స్పష్టంగా, సహజంగా తెలియజేస్తుంది; గ్రీకు షష్ఠీ విభక్తి సంబంధంలోని కొంత అస్పష్టతను పాదసూచికలో నిలిపాం.
- source_word: αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι
  choice: ఇతర వాటిపట్ల కోరికలు
  rationale: ‘మిగిలిన/ఇతర విషయాల వైపు ఉన్న కోరికలు’ అనే విస్తృత భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: εἰσπορευόμεναι
  choice: లోపలికి ప్రవేశించి
  rationale: బయటినుంచి చొరబడే ప్రక్రియను చూపే గ్రీకు కృదంతపు సజీవ చిత్రాన్ని నిలుపుతుంది.
- source_word: συμπνίγουσιν
  choice: అణచివేస్తాయి
  rationale: విత్తనం చుట్టూ ముళ్లు పెరిగి దానిని ఊపిరాడకుండా చేసే ఉపమానాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸν λόγον
  choice: వాక్యాన్ని
  rationale: మార్కు సువార్తలోని ప్రకటిత సందేశాన్ని సూచించే λόγος కు బైబిలు వాడుకతో అనుసంధానమున్న, అర్థమయ్యే తెలుగు పదం.
- source_word: ἄκαρπος γίνεται
  choice: అది ఫలించకుండా పోతుంది
  rationale: ‘ఫలంలేనిదిగా అవుతుంది’ అనే ప్రక్రియ-ఫలిత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, ఏకవచనంలోని ‘అది’ని సమీప పూర్వపదమైన ‘వాక్యం’తో అనుసంధానిస్తుంది.
theological_decisions:
- issue: చివరి ఏకవచన క్రియ, విశేషణం దేనిని సూచిస్తున్నాయి?
  choice: ‘అది’ అనేది సమీప ఏకవచన పూర్వపదమైన ‘వాక్యాన్ని’ సూచిస్తుంది.
  alternative: విన్న వ్యక్తి ఫలించకుండా పోతాడు; లేదా విత్తనం/మొక్క ఫలించదు.
  rationale: వ్యాకరణపరంగా τὸν λόγον సమీపంలోని స్పష్టమైన ఏకవచన పూర్వపదం. ఉపమానంలో వాక్యమే విత్తనంగా నాటబడి అణచివేయబడి ఫలించకుండా అవుతుంది. అయితే ఇతర సందర్భానుగుణ అన్వయాలను పాదసూచికలో పేర్కొని ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని మూడు కర్తలను సమాన జాబితాగా ఉంచి, కృదంతాన్ని ‘లోపలికి ప్రవేశించి’గా సహజీకరించాం. ఉపమాన చిత్రాన్ని కాపాడేందుకు ‘వాక్యం,’ ‘ఫలించకుండా’ అనే పదాలను ఉపయోగించాం.
