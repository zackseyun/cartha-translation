  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ σπείρων τὸν λόγον σπείρει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/014.yaml
  text: The sower sows the word[a].
translation:
  language: te
  text: విత్తేవాడు వాక్యాన్ని[a] విత్తుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సందేశాన్ని.’ గ్రీకు λόγος అనే పదం సందర్భాన్ని బట్టి ‘వాక్యం’ లేదా ‘సందేశం’ అని అర్థమివ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σπείρων
  choice: విత్తేవాడు
  rationale: నిర్దేశక పదంతో కూడిన వర్తమాన కృదంతం నామవాచకంగా పనిచేసి, విత్తే వ్యక్తిని సూచిస్తుంది. ‘విత్తేవాడు’ సహజంగా ఉండి ఉపమానంలోని విత్తే క్రియను ముందుకు తెస్తుంది; ‘రైతు’ అనడం మూలంలో ఉన్నదానికంటే విస్తృతమైన వృత్తి భావాన్ని చేర్చుతుంది.
- source_word: τὸν λόγον
  choice: వాక్యాన్ని
  rationale: λόγος అనే పదానికి ‘వాక్యం’, ‘సందేశం’ వంటి అర్థాలు ఉండవచ్చు. ఇక్కడ ‘వాక్యం’ అని అనువదించడం మూలంలోని సాధారణతను కాపాడుతుంది; దానిని ‘దేవుని వాక్యం’ లేదా ‘సువార్త’ అని విస్తరించి వ్యాఖ్యానించదు.
- source_word: σπείρει
  choice: విత్తుతాడు
  rationale: వర్తమాన సూచక క్రియ ఇక్కడ ఉపమాన వివరణలో సాధారణంగా జరిగే కార్యాన్ని తెలుపుతుంది. ‘విత్తుతాడు’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తూ, ὁ σπείρων—σπείρει మధ్య ఉన్న పదపునరుక్తిని ‘విత్తేవాడు—విత్తుతాడు’గా నిలుపుతుంది.
theological_decisions:
- issue: ఉపమాన వివరణలో ‘వాక్యం’ దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘వాక్యం’ అని మాత్రమే ఉంచడం
  alternative: ‘సందేశం’, ‘దేవుని వాక్యం’, లేదా ‘సువార్త’
  rationale: గ్రీకు పాఠ్యంలో τὸν λόγον అని మాత్రమే ఉంది. సందర్భం ప్రకటించబడిన దైవిక సందేశాన్ని సూచించినప్పటికీ, ప్రధాన పాఠ్యంలో మరింత నిర్దిష్టంగా చెప్పడం మూలంలో స్పష్టంగా లేని వ్యాఖ్యానాన్ని చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. మూలంలోని విత్తడం సంబంధమైన పదపునరుక్తి మరియు λόγος పదంలోని భావ విస్తృతి కాపాడబడ్డాయి.
