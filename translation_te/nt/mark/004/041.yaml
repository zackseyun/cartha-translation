source:
  edition: SBLGNT
  text: καὶ ἐφοβήθησαν φόβον μέγαν, καὶ ἔλεγον πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ ὁ ἄνεμος καὶ ἡ θάλασσα ⸀ὑπακούει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/041.yaml
  text: And they feared a great fear[a], and they said to one another, “Who then is this, that even the wind and the sea obey him?”
translation:
  language: te
  text: వారు ఎంతో భయపడ్డారు[a]; ఒకరితో ఒకరు ఇలా అన్నారు, “అయితే ఈయన ఎవరు? గాలీ సముద్రమూ కూడా ఈయనకు లోబడుతున్నాయే?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో పదశః, “వారు గొప్ప భయాన్ని భయపడ్డారు.” ఈ ప్రయోగం వారి భయ తీవ్రతను నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: ఎంతో భయపడి
  rationale: క్రియతో పాటు అదే మూలానికి చెందిన కర్మను వాడిన గ్రీకు ప్రయోగం భయ తీవ్రతను పెంచుతుంది. తెలుగులో అసహజమైన పదశః పునరుక్తి లేకుండా ‘ఎంతో భయపడి’ ఆ ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: ἔλεγον
  choice: చెప్పుకున్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ సంభాషణ కొనసాగిన భావాన్ని ఇవ్వగలదు; పరస్పరార్థక పదబంధంతో కలిసి ‘చెప్పుకున్నారు’ సహజమైన తెలుగు కథన రూపం.
- source_word: πρὸς ἀλλήλους
  choice: ఒకరితో ఒకరు
  rationale: శిష్యులు పరస్పరం మాట్లాడుకున్నారని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: అయితే ఈయన ఎవరు?
  rationale: ἄρα లోని ఆశ్చర్యంతో కూడిన నిర్ధారణాత్మక భావాన్ని ‘అయితే’ నిలుపుతుంది; గౌరవసూచకమైన ‘ఈయన’ ఆధునిక తెలుగు సందర్భానికి తగినది.
- source_word: ὅτι
  choice: …వింటున్నాయే
  rationale: ఇక్కడి ὅτι వారి ప్రశ్నకు ఆధారమైన ఆశ్చర్యకర విషయాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘-యే’ ప్రశ్నకు కారణమైన ఆశ్చర్యాన్ని సహజంగా కలుపుతుంది.
- source_word: καὶ ὁ ἄνεμος καὶ ἡ θάλασσα
  choice: గాలి, సముద్రం కూడా
  rationale: మొదటి καὶ లోని ‘కూడా/సైతం’ ఉద్ఘాటనను ‘కూడా’తో, రెండవ καὶ సమన్వయాన్ని జాబితా నిర్మాణంతో తెలియజేస్తుంది.
- source_word: ὑπακούει αὐτῷ
  choice: ఈయన మాట వింటున్నాయే
  rationale: ὑπακούω అంటే విధేయత చూపడం లేదా మాట వినడం. ప్రకృతి యేసు ఆజ్ఞకు స్పందించిన వ్యక్తీకరణను ‘మాట వినడం’ సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: సృష్టిపై యేసు అధికార చిత్రణ
  choice: శిష్యుల ఆశ్చర్యకర ప్రశ్నను, గాలి సముద్రాలు ఆయన మాట వినడాన్ని నేరుగా ఉంచడం
  alternative: యేసు దైవిక గుర్తింపును వివరణాత్మకంగా స్పష్టీకరించే పదాలను చేర్చడం
  rationale: వచనం అసాధారణ అధికారాన్ని బలంగా సూచించినా, దానిని సిద్ధాంత ప్రకటనగా విస్తరించకుండా శిష్యుల ప్రశ్న రూపంలోనే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని తీవ్ర భయం, ఆశ్చర్యం, యేసు అధికార సూచన నిలుపబడ్డాయి; వివరణాత్మక సిద్ధాంత పదాలు చేర్చలేదు.
