  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘పెద్ద గాలివాన’ మూలంలోని తీవ్రతను అతిశయ వ్యాఖ్యానం లేకుండా నిలుపుతుంది; కొనసాగుతున్న అలల చర్యను తెలుగులో స్పష్టంగా చూపించడానికి ‘పదేపదే’ చేర్చబడింది.
