  yaml_path: translation/nt/mark/004/037.yaml
  text: And a great windstorm arose[a], and the waves were breaking into the boat[c][b], so that the boat was already filling.
translation:
  language: te
  text: ఒక పెద్ద గాలివాన చెలరేగింది[a], అలలు పడవలోకి పదేపదే కొట్టుకొస్తూ ఉన్నాయి[b]; దాంతో పడవ అప్పటికే నిండిపోతూ ఉంది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘గాలి వల్ల కలిగిన పెద్ద తుపాను.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అలలు పడవలోకి కొట్టుకుంటూనే ఉన్నాయి.’ గ్రీకు అసంపూర్ణ భూతకాల క్రియ పునరావృతంగా లేదా కొనసాగుతూ జరిగిన చర్యను చిత్రిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘పడవ అప్పటికే నింపబడుతోంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεται
  choice: చెలరేగింది
  rationale: మార్కు వాడే సజీవ చారిత్రక వర్తమానాన్ని సహజమైన తెలుగు కథన భూతకాలంలో వ్యక్తం చేస్తూ, తుపాను అకస్మాత్తుగా మొదలైన భావాన్ని తెలియజేస్తుంది.
- source_word: λαῖλαψ μεγάλη ἀνέμου
  choice: ఒక పెద్ద గాలివాన
  rationale: λαῖλαψ సూచించే బలమైన తుపానును, μεγάλη యొక్క తీవ్రతను, ἀνέμου యొక్క గాలి-సంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: κύματα
  choice: అలలు
  rationale: κῦμαకు సాధారణంగా అర్థమయ్యే సహజ తెలుగు సమానార్థకం.
- source_word: ἐπέβαλλεν εἰς τὸ πλοῖον
  choice: పడవలోకి పదేపదే కొట్టుకొస్తున్నాయి
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న లేదా పునరావృత చర్యను ‘పదేపదే’ ద్వారా స్పష్టం చేస్తూ, అలలు పడవను తాకి లోపలికి వస్తున్న భావాన్ని నిలుపుతుంది.
- source_word: πλοῖον
  choice: పడవ
  rationale: గలిలయ సముద్రపు సందర్భంలోని నౌకకు ఆధునిక తెలుగులో ‘పడవ’ సహజమైన పదం.
- source_word: ὥστε
  choice: దాంతో
  rationale: ముందటి అలల చర్య ఫలితంగా పడవ నిండుతున్నదనే ఫలిత సంబంధాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἤδη
  choice: అప్పటికే
  rationale: పడవ నిండే ప్రక్రియ అప్పటికి ముందుకు సాగిపోయిందనే కాల భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: γεμίζεσθαι τὸ πλοῖον
  choice: పడవ అప్పటికే నీటితో నిండిపోతోంది
  rationale: వర్తమాన అనంతక్రియ సూచించే కొనసాగుతున్న ఫలిత ప్రక్రియను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. ‘నీటితో’ అనేది సందర్భంలో స్పష్టంగా అంతర్భూతమైనదాన్ని తెలుగులో సహజత కోసం వెల్లడిస్తుంది.
