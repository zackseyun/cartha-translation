    issue: Narrative tense is inconsistent.
    rationale: The storm is said to have arisen in the past, while the waves and boat are described with bare present-progressive verbs. Past-progressive wording naturally presents the Greek imperfect and continuing result within a past narrative.
  - severity: low
    issue: ‘నీటితో’ is an unnecessary explicit addition.
    rationale: The boat's filling with water is strongly implied by the context, but γεμίζεσθαι does not state the content. Omitting it preserves the source's concise wording without reducing clarity.
