source:
  edition: SBLGNT
  text: ⸀αὐτομάτη ἡ γῆ καρποφορεῖ, πρῶτον χόρτον, ⸂εἶτα στάχυν, εἶτα⸃ ⸂πλήρης σῖτον⸃ ἐν τῷ στάχυϊ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/028.yaml
  text: 'The soil bears fruit by itself: first the stalk[a], then the head, then the full grain in the head.'
translation:
  language: te
  text: 'నేల తనంతట తానే పంటను ఇస్తుంది: మొదట లేత మొక్క, తరువాత కంకి, ఆ తరువాత కంకిలో నిండిన ధాన్యం.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτομάτη
  choice: తనంతట తానే
  rationale: కనిపించే మానవ చర్య లేకుండానే నేల పంటను ఉత్పత్తి చేస్తుందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἡ γῆ
  choice: నేల
  rationale: వ్యవసాయ సందర్భంలో సాగు నేలను సూచించే సహజమైన, సందర్భోచితమైన పదం.
- source_word: καρποφορεῖ
  choice: పంటను పండిస్తుంది
  rationale: ఇక్కడ సాధారణ ఫలాలకన్నా ధాన్యపు పంట ఎదిగి ఫలించడమే సందర్భం; ఈ ప్రయోగం వ్యవసాయ చిత్రాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: πρῶτον χόρτον
  choice: మొదట మొలక
  rationale: χόρτος ఇక్కడ ధాన్యపు మొక్క మొదట కనిపించే పచ్చని ఎదుగుదల దశను సూచిస్తుంది; 'మొలక' సాధారణ పాఠకులకు సహజంగా అర్థమవుతుంది.
- source_word: εἶτα στάχυν
  choice: తరువాత కంకి
  rationale: στάχυς ధాన్యపు గింజలు ఏర్పడే కంకిని సూచిస్తుంది; తెలుగు వ్యవసాయ వాడుకలో 'కంకి' సంక్షిప్తంగా, కచ్చితంగా ఉంటుంది.
- source_word: πλήρης σῖτον ἐν τῷ στάχυϊ
  choice: కంకిలో నిండిన ధాన్యం
  rationale: పూర్తిగా ఏర్పడిన ధాన్యం కంకిలో ఉందనే మూలవాక్య భావాన్ని, 'పండినది' అనే అదనపు పరిపక్వత భావాన్ని చేర్చకుండా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వ్యవసాయ పదజాలంతో, మూలంలోని మూడు దశల క్రమాన్ని సంక్షిప్తంగా నిలిపాం.
