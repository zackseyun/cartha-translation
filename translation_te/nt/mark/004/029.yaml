id: MRK.4.29
reference: Mark 4:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀παραδοῖ ὁ καρπός, ⸀εὐθὺς ἀποστέλλει τὸ δρέπανον, ὅτι παρέστηκεν ὁ θερισμός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/029.yaml
  text: But when the crop is ready[a], he immediately sends in the sickle, because the harvest has come.
translation:
  language: te
  text: అయితే పంట కోతకు సిద్ధమైనప్పుడు[a], కోతకాలం వచ్చేసింది కాబట్టి అతడు వెంటనే కొడవలిని పంపుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పంట దిగుబడి ఇచ్చినప్పుడు,” “పంట పండినప్పుడు.” మరింత అక్షరార్థంగా, “పంట తనను తాను అప్పగించినప్పుడు.” గ్రీకులో పంటే కర్తగా ఉన్న అసాధారణ క్రియాప్రయోగం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: అయితే … అయినప్పుడు
  rationale: ὅταν తెలిపే కాలసంబంధ అనిశ్చిత భావాన్ని ‘అయినప్పుడు’ తెలియజేస్తుంది; δέ ఇక్కడ స్వల్పమైన సంధి లేదా వ్యత్యాసాన్ని సూచిస్తున్నందున ‘అయితే’ సహజంగా సరిపోతుంది.
- source_word: παραδοῖ ὁ καρπός
  choice: పంట కోతకు సిద్ధమైనప్పుడు
  rationale: παραδοῖ సాధారణంగా ‘అప్పగిస్తుంది’ అని అర్థమిచ్చినా, ఇక్కడ పంటే కర్తగా ఉన్న అసాధారణ ప్రయోగం పంట కోయడానికి అనువైన దశకు చేరడాన్ని సూచిస్తుంది. ప్రధాన వాక్యంలో సహజమైన అర్థాన్ని ఇచ్చి, మూలంలోని ప్రత్యేక ప్రయోగాన్ని పాదసూచికలో ఉంచాం.
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: చర్యలోని తక్షణత్వాన్ని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀποστέλλει τὸ δρέπανον
  choice: కొడవలిని పంపుతాడు
  rationale: మూలంలోని ‘కొడవలిని పంపడం’ అనే సజీవీకరించిన వ్యవసాయ రూపకాన్ని నిలుపుతుంది; దాన్ని కేవలం ‘కోత మొదలుపెడతాడు’ అని వివరణాత్మకంగా మార్చలేదు.
- source_word: ὅτι παρέστηκεν ὁ θερισμός
  choice: కోతకాలం వచ్చేసింది కాబట్టి
  rationale: ὅτι కారణాన్ని తెలియజేస్తుంది. παρέστηκεν అనే పరిపూర్ణ కాలరూపం కోతకాలం వచ్చి ఇప్పుడు సమక్షంలో ఉందనే ఫలితస్థితిని సూచిస్తుంది; ‘వచ్చేసింది’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: దేవుని రాజ్య ఉపమానంలో పంట సిద్ధత, కోత రూపకాల భావం
  choice: వ్యవసాయ రూపకాన్ని యథాతథంగా ఉంచి, పంట కోతకు సిద్ధమవడం మరియు కోతకాలం రావడం అని అనువదించడం
  alternative: కోతను తీర్పు, సువార్త సేవ లేదా యుగాంతం అని వాక్యంలోనే స్పష్టీకరించడం
  rationale: ఈ వాక్యం రూపకానికి సంబంధించిన నిర్దిష్ట వేదాంత అన్వయాన్ని తానే ప్రకటించదు. అందువల్ల సాధ్యమైన అన్వయాల్లో ఏదో ఒకదాన్ని అనువాదంలో బలవంతంగా చేర్చకుండా మూలంలోని వేదాంత ఉద్వేగం, విశాలత నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, సామాన్య పాఠకులకు అర్థమయ్యేలా, అయినప్పటికీ గంభీరమైన ఉపమాన శైలిని నిలుపుతూ అనువదించాం. ‘కొడవలిని పంపుతాడు’ అనే కొంత కవితాత్మక ప్రయోగం మూలంలోని సజీవీకరణను ఉద్దేశపూర్వకంగా కాపాడుతుంది.
