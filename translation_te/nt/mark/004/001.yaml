id: MRK.4.1
reference: Mark 4:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ πάλιν ἤρξατο διδάσκειν παρὰ τὴν θάλασσαν. καὶ ⸀συνάγεται πρὸς αὐτὸν ὄχλος ⸀πλεῖστος, ὥστε αὐτὸν ⸂εἰς πλοῖον ἐμβάντα⸃ καθῆσθαι ἐν τῇ θαλάσσῃ, καὶ πᾶς ὁ ὄχλος πρὸς τὴν θάλασσαν ἐπὶ τῆς γῆς ⸀ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/001.yaml
  text: And again he began to teach beside the sea. And a very large crowd gathers to him, so that he got into a boat and sat on the sea, and the whole crowd was by the sea on the land.
translation:
  language: te
  text: ఆయన మళ్లీ సముద్రం ఒడ్డున బోధించడం మొదలుపెట్టాడు. ఆయన దగ్గరికి అత్యంత పెద్ద జనసమూహం చేరుకుంటుంది[a]. అందువల్ల ఆయన ఒక పడవ ఎక్కి, సముద్రంలో కూర్చున్నాడు[b]. జనసమూహమంతా సముద్రం ఒడ్డున, నేల మీద ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన దగ్గరికి చేరుతోంది.” మార్కు సజీవమైన కథనం కోసం గత సంఘటనలను తరచుగా వర్తమాన కాలంలో చెబుతాడు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, ఆయన సముద్రంలో పడవలో ఉండగా, జనసమూహం నేల మీద ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: πάλιν
  choice: మళ్లీ
  rationale: యేసు బోధించే కార్యం పునరావృతమైందని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἤρξατο διδάσκειν
  choice: బోధించడం మొదలుపెట్టాడు
  rationale: ఆరంభార్థక గ్రీకు నిర్మాణాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: παρὰ τὴν θάλασσαν
  choice: సముద్రం ఒడ్డున
  rationale: παρά సూచించే సముద్రం పక్కనున్న స్థలాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; మూలంలోని ‘సముద్రం’ అనే పదాన్ని ‘సరస్సు’గా ప్రత్యేకీకరించదు.
- source_word: συνάγεται
  choice: చేరుకుంటుంది
  rationale: మార్కు వాడిన చారిత్రక వర్తమాన కాలపు సజీవ కథనశైలిని నిలుపుతుంది.
- source_word: ὄχλος πλεῖστος
  choice: చాలా పెద్ద జనసమూహం
  rationale: πλεῖστος లోని తీవ్రతను సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: πρὸς αὐτόν
  choice: ఆయన దగ్గరికి
  rationale: యేసు వైపు జనసమూహం కదలి రావడాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: ὥστε
  choice: అందువల్ల
  rationale: జనసమూహం పెద్దదిగా ఉండటం వల్ల సంభవించిన ఫలితాన్ని తెలుగులో సహజంగా అనుసంధానిస్తుంది.
- source_word: εἰς πλοῖον ἐμβάντα
  choice: ఒక పడవ ఎక్కి
  rationale: భూతకాల ప్రధాన క్రియకు ముందు జరిగిన భాగధాతు చర్యను సంక్షిప్తమైన తెలుగు క్రమక్రియతో ప్రతిబింబిస్తుంది.
- source_word: καθῆσθαι ἐν τῇ θαλάσσῃ
  choice: సముద్రం మీద కూర్చున్నాడు
  rationale: మూలపాఠంలోని వ్యక్తీకరణను నిలుపుతూ, సందర్భంలో ఆయన పడవలో నీటిమీద ఉన్నాడనే అర్థాన్ని పాదసూచిక ద్వారా స్పష్టం చేస్తుంది.
- source_word: πᾶς ὁ ὄχλος
  choice: జనసమూహమంతా
  rationale: గ్రీకులోని సమష్టి ఏకవచన భావాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: πρὸς τὴν θάλασσαν ἐπὶ τῆς γῆς
  choice: సముద్రం ఒడ్డున, నేల మీద
  rationale: సముద్రానికి ఆనుకుని జనులు భూమిమీద ఉన్నారనే రెండు స్థానిక అంశాలనూ నిలుపుతుంది.
