id: MRK.4.38
reference: Mark 4:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸂αὐτὸς ἦν⸃ ⸀ἐν τῇ πρύμνῃ ἐπὶ τὸ προσκεφάλαιον καθεύδων· καὶ ⸀ἐγείρουσιν αὐτὸν καὶ λέγουσιν αὐτῷ· Διδάσκαλε, οὐ μέλει σοι ὅτι ἀπολλύμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/038.yaml
  text: But he himself was in the stern[a], asleep on the cushion; and they woke him and said to him, “Teacher, do you not care that we are perishing?”
translation:
  language: te
  text: కాని ఆయన మాత్రం పడవ వెనుక భాగంలో తలగడ[a] మీద నిద్రపోతూ ఉన్నాడు. వారు ఆయనను లేపి, ఆయనతో, “బోధకుడా, మేము నశించిపోతున్నామని నీకు పట్టదా?” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దిండు.” గ్రీకు పదం తలకు ఆధారంగా ఉపయోగించే కుషన్‌ను లేదా దిండును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς ἦν
  choice: ఆయన మాత్రం ... ఉన్నాడు
  rationale: స్పష్టంగా ఉన్న αὐτός ఇచ్చే వ్యత్యాసాత్మక ఉద్ఘాటనను సహజమైన తెలుగులో ‘మాత్రం’ ద్వారా నిలిపింది.
- source_word: πρύμνῃ
  choice: పడవ వెనుక భాగంలో
  rationale: పడవలోని వెనుక భాగాన్ని ఖచ్చితంగా తెలియజేస్తూ, సాంకేతిక పదం కంటే సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే రూపం.
- source_word: ἐπὶ τὸ προσκεφάλαιον
  choice: తలగడ మీద
  rationale: προσκεφάλαιον తలకు ఆధారంగా ఉపయోగించే కుషన్ లేదా దిండును సూచిస్తుంది; ‘తలగడ’ రెండింటికీ సరిపోయే సహజ తెలుగు పదం.
- source_word: καθεύδων
  choice: నిద్రపోతూ ఉన్నాడు
  rationale: ఆ సమయంలో కొనసాగుతున్న నిద్ర స్థితిని అసమాపక క్రియతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐγείρουσιν
  choice: లేపి
  rationale: గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగు కథనంలో సహజమైన భూతకాల క్రమంగా అందిస్తుంది.
- source_word: λέγουσιν αὐτῷ
  choice: అని అడిగారు
  rationale: వారు పలికిన మాట ప్రశ్నారూపంలో ఉన్నందున తెలుగులో ‘అడిగారు’ సహజం; దాని నిందారోపణతో కూడిన బలాన్ని తగ్గించదు.
- source_word: Διδάσκαλε
  choice: బోధకుడా
  rationale: διδάσκαλος యొక్క ప్రధాన భావమైన బోధించే వ్యక్తిని నేరుగా తెలియజేస్తుంది; ‘ప్రభువా’ వంటి అదనపు ధార్మిక భావాన్ని చేర్చదు.
- source_word: οὐ μέλει σοι
  choice: నీకు పట్టదా?
  rationale: శ్రద్ధ లేదా చింత లేదని నిలదీసే గ్రీకు ప్రశ్న యొక్క పదునైన, నిందారోపణతో కూడిన స్వరాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἀπολλύμεθα
  choice: మేము నశించిపోతున్నా
  rationale: సమీపిస్తున్న వినాశం లేదా మరణం అనే విస్తృత భావాన్ని ‘చనిపోతున్నాం’ అని పరిమితం చేయకుండా, కొనసాగుతున్న అత్యవసర ప్రమాదాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: శిష్యులు యేసును ప్రశ్నించిన మాటలోని కథనాత్మక, ధార్మిక ఉద్రిక్తత
  choice: “మేము నశించిపోతున్నా నీకు పట్టదా?” అనే పదునైన నిలదీతగా అనువదించడం
  alternative: “మేము చనిపోబోతున్నామనే విషయం నీకు ముఖ్యం కాదా?” అని మృదువుగా అనువదించడం
  rationale: గ్రీకు వాక్యం కేవలం సమాచారం అడగడం కాదు; అత్యవసరతతో కూడిన నిందారోపణ. యేసు ఉద్దేశం గురించి లేదా శిష్యుల విశ్వాసం గురించి వివరణను చేర్చకుండా ఆ ఉద్రిక్తతను అలాగే ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడింది. ‘పడవ వెనుక భాగం’ వంటి స్పష్టమైన సాధారణ పదబంధాన్ని ఎంచుకుంది; శిష్యుల ప్రశ్నలోని తీవ్రతను సంభాషణాత్మకమైన ‘నీకు పట్టదా?’ ద్వారా నిలిపింది.
