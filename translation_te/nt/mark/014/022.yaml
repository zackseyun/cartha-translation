id: MRK.14.22
reference: Mark 14:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐσθιόντων αὐτῶν ⸀λαβὼν ἄρτον εὐλογήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς καὶ εἶπεν· ⸀Λάβετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/022.yaml
  text: And as they were eating[a], he took bread, blessed it, broke it, and gave it to them, and said, “Take; this is my body.”
translation:
  language: te
  text: వారు భోజనం చేస్తుండగా, ఆయన రొట్టె తీసుకొని, దానిపై దీవెన పలికి, దాన్ని విరిచి వారికి ఇచ్చి, “తీసుకోండి; ఇది నా శరీరం[a]” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, వ్యాఖ్యానాత్మకంగా, “ఇది నా శరీరాన్ని సూచిస్తుంది” లేదా “దీని అర్థం నా శరీరం.” గ్రీకులో పదశః, “ఇది నా శరీరం” అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: వారు భోజనం చేస్తుండగా
  rationale: వర్తమాన కృదంతంతో ఉన్న genitive absolute, అదే సమయంలో కొనసాగుతున్న చర్యను సూచిస్తుంది. సందర్భానుసారంగా ‘భోజనం చేస్తుండగా’ సహజమైన ఆధునిక తెలుగు.
- source_word: λαβὼν ἄρτον
  choice: ఆయన రొట్టె తీసుకొని
  rationale: ἄρτονకు నిర్దిష్ట ఉపపదం లేదు; భోజన సందర్భంలో ‘రొట్టె’ సహజంగా ఉంటుంది. ‘ఒక రొట్టె’ లేదా ‘రొట్టె ముక్క’ అని మూలంలో లేని నిర్దిష్టతను చేర్చలేదు.
- source_word: εὐλογήσας
  choice: దానిపై దీవెన పలికి
  rationale: భోజన సందర్భంలో εὐλογέω రొట్టెపై ఆశీర్వాద వాక్యం పలకడాన్ని సూచించగలదు. ‘దాన్ని దీవించి’ కంటే ఈ రూపం తెలుగులో ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తూ, ‘కృతజ్ఞతలు తెలిపి’ అనే అధిక వ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: ἔκλασεν
  choice: దాన్ని విరిచి
  rationale: రొట్టెను పంచడానికి విరిచిన చర్యను నేరుగా తెలియజేస్తుంది; కర్మను సందర్భం నుంచి సహజంగా పూరించింది.
- source_word: ἔδωκεν αὐτοῖς
  choice: వారికి ఇచ్చి
  rationale: మూలంలోని సాధారణ ‘ఇచ్చాడు’ భావాన్ని నిలుపుతుంది; ‘పంచిపెట్టాడు’ వంటి వ్యాఖ్యానాత్మక విస్తరణను నివారిస్తుంది.
- source_word: Λάβετε
  choice: తీసుకోండి
  rationale: ఆజ్ఞార్థక రూపాన్ని నేరుగా, గౌరవబహువచనంతో సహజమైన తెలుగులో అందిస్తుంది.
- source_word: τοῦτό ἐστιν
  choice: ఇది
  rationale: తెలుగులో వర్తమానకాల ‘ఉంది/అయి ఉంది’ అనే అనుసంధాన క్రియ సాధారణంగా వ్యక్తం కాకుండానే ఉంటుంది. ‘ఇది నా శరీరం’ గ్రీకు copula నిర్మాణానికి నేరమైన, సహజమైన సమానం; ‘సూచిస్తుంది’ లేదా ‘అర్థం’ అని వ్యాఖ్యానించలేదు.
- source_word: τὸ σῶμά μου
  choice: నా శరీరం
  rationale: σῶμα యొక్క సాధారణ అర్థమైన ‘శరీరం’ను యథాతథంగా ఉంచి, అలంకారిక లేదా మతపరమైన వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
theological_decisions:
- issue: ప్రభుభోజన సందర్భంలో యేసు పలికిన τοῦτό ἐστιν τὸ σῶμά μου
  choice: “ఇది నా శరీరం” అని నేరుగా అనువదించడం
  alternative: “ఇది నా శరీరాన్ని సూచిస్తుంది” / “దీని అర్థం నా శరీరం”
  rationale: గ్రీకు పాఠ్యంలో సాధారణ అనుసంధాన క్రియ ἐστιν ఉంది. అందువల్ల వివిధ ప్రభుభోజన సిద్ధాంతాల మధ్య ఉన్న వేదాంతపరమైన ఉద్రిక్తతను అనువాదంలో పరిష్కరించకుండా, మూల వాక్యాన్ని నేరుగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా వాక్యానికి తగిన గంభీరతతో రూపొందించబడింది. గ్రీకు వాక్యంలోని వరుస చర్యలను సహజ తెలుగు కృదంత నిర్మాణాలతో నిలిపాం. ప్రధాన పాఠ్యంలో పాదసూచిక గుర్తులు లేవు, ఎందుకంటే వ్యాఖ్యానాత్మక ప్రత్యామ్నాయాన్ని పాదసూచికగా ఇవ్వడం మూలంలోని నిజమైన పాఠ్య ప్రత్యామ్నాయం కాదు.
