- from: కానీ అతడు దాన్ని నిరాకరిస్తూ, “నువ్వు ఏమి చెబుతున్నావో నాకు తెలియదు, అర్థమూ కావడం లేదు” అన్నాడు. తరువాత అతడు బయట ముంగిట్లోకి వెళ్లాడు. అప్పుడు కోడి కూసింది.[a]
