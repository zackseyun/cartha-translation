  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἠρνήσατο λέγων· ⸂Οὔτε οἶδα οὔτε ἐπίσταμαι σὺ τί⸃ λέγεις, καὶ ἐξῆλθεν ἔξω εἰς τὸ προαύλιον ⸂καὶ ἀλέκτωρ ἐφώνησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/068.yaml
  text: But he denied it[a], saying, “I neither know nor understand what you are saying.” And he went out into the forecourt, and a rooster crowed.
translation:
  language: te
  text: 'కానీ అతడు దాన్ని నిరాకరించి ఇలా అన్నాడు: “నువ్వు ఏమి చెబుతున్నావో నాకు తెలియదు, అర్థం కాదు.” తరువాత అతడు బయటకు, ముందరి ప్రాంగణంలోకి వెళ్లాడు; అప్పుడు ఒక కోడిపుంజు కూసింది.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో ‘అప్పుడు ఒక కోడిపుంజు కూసింది’ అనే మాటలు లేవు.
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνήσατο
  choice: దాన్ని నిరాకరిస్తూ
  rationale: ఈ క్రియ ఇక్కడ అంతకుముందు చేసిన ఆరోపణను లేదా మాటను తోసిపుచ్చడాన్ని సూచిస్తుంది. సందర్భానుసారంగా ‘దాన్ని’ అని చేర్చడం తెలుగులో స్పష్టంగా ఉంటుంది; అయితే మూలంలో యేసు ప్రత్యక్ష కర్మగా ప్రస్తావించబడలేదు కాబట్టి ‘ఆయనను ఎరుగనన్నాడు’ అని మరింత వ్యాఖ్యానాత్మకంగా అనువదించలేదు.
- source_word: Οὔτε οἶδα οὔτε ἐπίσταμαι
  choice: నాకు తెలియదు, అర్థమూ కావడం లేదు
  rationale: రెండు క్రియల పునరుక్తి పేతురు నిరాకరణ తీవ్రతను పెంచుతుంది. ‘తెలియదు’ మరియు ‘అర్థమూ కావడం లేదు’ అనే జత ఆ భావభేదాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: σὺ τί λέγεις
  choice: నువ్వు ఏమి చెబుతున్నావో
  rationale: ఇది మూలంలోని ‘నీవు ఏమి చెబుతున్నావో’ అనే ప్రత్యక్ష భావాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: ἐξῆλθεν ἔξω
  choice: బయట ... వెళ్లాడు
  rationale: క్రియతోపాటు ఉన్న ‘బయటకు’ అనే అవ్యయ బలాన్ని తెలుగులో ‘బయట’ ద్వారా వ్యక్తం చేశాం; గమ్యస్థానాన్ని తరువాతి పదం తెలియజేస్తుంది.
- source_word: προαύλιον
  choice: ముంగిట్లోకి
  rationale: ఈ పదం లోపలి ప్రాంగణానికి ముందున్న ప్రవేశ ప్రాంతాన్ని సూచిస్తుంది. ‘ముంగిట’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఆ స్థల సంబంధాన్ని తెలియజేస్తుంది.
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: కోడి కూసింది
  rationale: ఇది తెలుగులో సహజమైన నుడికారం. గ్రీకులో నిర్దిష్ట ఉపపదం లేకపోవడంతో ‘ఆ కోడి’ అని ప్రత్యేకీకరించలేదు.
theological_decisions:
- issue: καὶ ἀλέκτωρ ἐφώνησεν అనే వాక్యభాగాన్ని చేర్చడం
  choice: ‘అప్పుడు కోడి కూసింది’ అని ప్రధాన పాఠ్యంలో చేర్చడం
  alternative: కొన్ని ప్రాచీన ప్రతుల ప్రకారం ఈ వాక్యభాగాన్ని విడిచిపెట్టడం
  rationale: ఇచ్చిన SBLGNT పాఠ్యంలో ఈ వాక్యభాగం పాఠాంతర సూచనతో ఉంది. అందువల్ల దాన్ని ప్రధాన పాఠ్యంలో అనువదించి, ప్రతుల మధ్యనున్న అనిశ్చితిని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కథనానికి తగిన సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. సంభాషణలో ‘నువ్వు’ అనేది ఏకవచన గ్రీకు సర్వనామానికి సహజమైన సమానం. పాఠాంతర పాదటిప్పణి గుర్తును అది వర్తించే కోడి కూసిన వాక్యభాగం తరువాత ఉంచాం.
