id: MRK.14.12
reference: Mark 14:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων, ὅτε τὸ πάσχα ἔθυον, λέγουσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ· Ποῦ θέλεις ἀπελθόντες ἑτοιμάσωμεν ἵνα φάγῃς τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/012.yaml
  text: And on the first day of Unleavened Bread[a], when they were sacrificing the Passover lamb, his disciples said to him, “Where do you want us to go and prepare so that you may eat the Passover?”
translation:
  language: te
  text: పులియని రొట్టెల పండుగ మొదటి రోజున, పస్కా గొర్రెపిల్లను బలి అర్పించే రోజున,[a] ఆయన శిష్యులు ఆయనతో, “మీరు పస్కా భోజనం చేయడానికి మేము ఎక్కడికి వెళ్లి ఏర్పాట్లు చేయాలని కోరుకుంటున్నారు?” అని అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకును అక్షరార్థంగా “వారు పస్కాను బలి అర్పించే రోజున” అని కూడా అనువదించవచ్చు. ఈ సందర్భంలో “పస్కా” అనేది బలి అర్పించే పస్కా గొర్రెపిల్లను సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων
  choice: పులియని రొట్టెల పండుగ మొదటి రోజున
  rationale: గ్రీకులో ‘పండుగ’ అనే పదం ప్రత్యక్షంగా లేకపోయినా, ఈ పదబంధం పులియని రొట్టెల పండుగ కాలాన్ని సూచిస్తుంది. తెలుగులో సహజంగా, స్పష్టంగా ఉండేందుకు ‘పండుగ’ను చేర్చాం.
- source_word: ὅτε τὸ πάσχα ἔθυον
  choice: పస్కా గొర్రెపిల్లలను బలి అర్పించే సమయంలో
  rationale: θύω బలి అర్పించడాన్ని సూచిస్తుంది; దానితో వచ్చిన πάσχα ఇక్కడ పస్కా బలిపశువును, సందర్భానుసారంగా గొర్రెపిల్లను సూచిస్తుంది. గ్రీకు బహువచన క్రియలోని అనిర్దిష్ట కర్తను తెలుగు సహజ ప్రయోగంలో కర్మణార్థక కాలవాచక నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: λέγουσιν
  choice: అని అడిగారు
  rationale: ఇది కథనంలోని చారిత్రక వర్తమాన కాలం. శిష్యుల మాట ప్రశ్న కావడంతో ఆధునిక తెలుగు కథనశైలిలో ‘అడిగారు’ సహజంగా ఉంటుంది.
- source_word: Ποῦ θέλεις
  choice: ఎక్కడికి ... చేయాలని కోరుతున్నారు
  rationale: θέλω కోరిక లేదా ఉద్దేశాన్ని తెలియజేస్తుంది. గౌరవసూచక బహువచనంతో యేసును సంబోధించడం ఆధునిక ప్రామాణిక తెలుగులో సహజం.
- source_word: ἀπελθόντες ἑτοιμάσωμεν
  choice: మేము ఎక్కడికి వెళ్లి ఏర్పాట్లు చేయాలని
  rationale: కృదంతం మరియు ప్రధాన క్రియల క్రమాన్ని తెలుగులో సహజమైన ‘వెళ్లి ఏర్పాట్లు చేయడం’ అనే నిర్మాణంతో నిలిపాం.
- source_word: ἵνα φάγῃς τὸ πάσχα
  choice: మీరు పస్కా భోజనం చేయడానికి
  rationale: ἵνα ఉద్దేశాన్ని సూచిస్తుంది. φάγῃς తో ఉన్న πάσχα ఇక్కడ బలి అర్పణను కాక పస్కా భోజనాన్ని సూచిస్తుంది; అందువల్ల తెలుగులో ‘పస్కా భోజనం’ అని స్పష్టం చేశాం.
theological_decisions:
- issue: ఈ వచనంలో రెండుసార్లు వచ్చిన πάσχα పదం యొక్క సూచన
  choice: మొదటిసారి ‘పస్కా గొర్రెపిల్లలు’గా, రెండవసారి ‘పస్కా భోజనం’గా అనువదించడం
  alternative: రెండు చోట్లా కేవలం ‘పస్కా’ అని ఉంచడం
  rationale: 'సమీప క్రియాపదమే ప్రతి సందర్భంలోని భావాన్ని నిర్ణయిస్తుంది: θύωతో అది బలిపశువును, φάγῃςతో అది భోజనాన్ని సూచిస్తుంది. ఇది సిద్ధాంతపరమైన సమన్వయం కాదు; సందర్భాధారిత పదార్థ నిర్ణయం.'
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవసూచక సంబోధనను, సహజ కథన గతకాలాన్ని ఉపయోగించాం. ‘పస్కా’ అనే స్థిరమైన బైబిలు పదాన్ని నిలిపి, దాని రెండు సందర్భార్థాలను ప్రధాన పాఠ్యంలో స్పష్టం చేశాం.
