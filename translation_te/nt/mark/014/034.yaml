id: MRK.14.34
reference: Mark 14:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/034.yaml
  text: And he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అంటున్నాడు: “నా ప్రాణం మరణించేంతగా దుఃఖంతో నిండిపోయింది.[a][b] మీరు ఇక్కడే ఉండి మెలకువగా ఉండండి.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నేను ఎంతో దుఃఖిస్తున్నాను” లేదా “నా ప్రాణం చాలా దుఃఖంగా ఉంది.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “మరణం వరకు” లేదా “చనిపోయేంతగా.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “కనిపెడుతూ ఉండండి”; ఈ ఆజ్ఞలో నిద్రపోకుండా ఉండడం, అప్రమత్తంగా ఉండడం అనే రెండు భావాలూ ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: అంటున్నాడు
  rationale: మార్కు ఉపయోగించిన చారిత్రక వర్తమాన కాలాన్ని నిలుపుతూ, కథనంలోని సజీవతను ప్రతిబింబిస్తుంది.
- source_word: Περίλυπός
  choice: తీవ్రమైన దుఃఖంలో మునిగిపోయింది
  rationale: ఈ విశేషణం సూచించే గాఢమైన దుఃఖాన్ని సహజమైన ఆధునిక తెలుగులో బలంగా వ్యక్తం చేస్తుంది.
- source_word: ἡ ψυχή μου
  choice: నా ప్రాణం
  rationale: ఇక్కడ యేసు అంతరంగ జీవితం లేదా సంపూర్ణ వ్యక్తిత్వం అనుభవిస్తున్న వేదనను సూచించే ψυχή పదానికి ‘ప్రాణం’ సహజమైనదిగా, గంభీరమైనదిగా ఉంది.
- source_word: ἕως θανάτου
  choice: మరణమయ్యేంతగా
  rationale: దుఃఖం మరణపు అంచు వరకు చేరినంత తీవ్రమైందనే గ్రీకు ప్రయోగ బలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: μείνατε ὧδε
  choice: మీరు ఇక్కడే ఉండి
  rationale: వారు ఉన్న స్థలంలోనే నిలిచి ఉండాలనే ఆజ్ఞను స్పష్టంగా తెలియజేస్తుంది.
- source_word: γρηγορεῖτε
  choice: మెలకువగా ఉండండి
  rationale: నిద్రపోకుండా ఉండడాన్నీ, అప్రమత్తంగా కనిపెట్టడాన్నీ కలిపి సూచించగల సహజమైన తెలుగు వ్యక్తీకరణ.
theological_decisions:
- issue: యేసు మాటలో ψυχή పదం
  choice: ప్రాణం
  alternative: అంతరంగం; జీవం
  rationale: యేసు నిజమైన మానవ వేదనను తగ్గించకుండా, గ్రీకు పదంలోని అంతరంగ జీవితం మరియు సంపూర్ణ వ్యక్తిత్వానికి సంబంధించిన భావవిస్తృతిని నిలుపుతుంది.
- issue: γρηγορεῖτε ఆజ్ఞ యొక్క భావం
  choice: మెలకువగా ఉండండి
  alternative: కనిపెట్టండి; జాగరూకంగా ఉండండి
  rationale: ఈ సందర్భంలో శారీరకంగా మేల్కొని ఉండడం మరియు అప్రమత్తంగా కనిపెట్టడం రెండూ భావంలో ఉన్నాయి; అనువాదం ఒక భావాన్ని మాత్రమే నిర్బంధంగా ఎంచుకోదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. మార్కు కథనంలోని చారిత్రక వర్తమాన కాలాన్ని ‘అంటున్నాడు’ ద్వారా నిలిపి, అతి ప్రాచీన పదజాలాన్ని నివారించాం.
