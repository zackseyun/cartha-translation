revisions:
- from: 'ఆయన వారితో ఇలా అంటున్నాడు: “నా ప్రాణం మరణమయ్యేంతగా తీవ్రమైన దుఃఖంలో మునిగిపోయింది.[a][b] మీరు ఇక్కడే ఉండి మెలకువగా ఉండండి.[c]”'
  to: 'ఆయన వారితో ఇలా అంటున్నాడు: “నా ప్రాణం మరణించేంతగా దుఃఖంతో నిండిపోయింది.[a][b] మీరు ఇక్కడే ఉండి మెలకువగా ఉండండి.[c]”'
  rationale: The revision clarifies the death-extremity idiom while preserving the Greek historical present, the intense emotional force, and the paired commands. Footnote a is made a closer lexical alternative rather than an added metaphor. No doctrinal interpretation is introduced.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:14:58Z'
review_pass:
  verdict: revise
  source_fidelity: The historical present in λέγει is appropriately retained by “అంటున్నాడు.” The draft correctly conveys the intense sorrow of Περίλυπός, the idiomatic extremity of ἕως θανάτου, the command to remain, and γρηγορεῖτε as wakeful vigilance. However, “మరణమయ్యేంతగా” can suggest ‘to become death’ rather than sorrow reaching the point of death; “మరణించేంతగా” is clearer and idiomatic.
  naturalness: The revised wording is more natural modern standard Telugu. “దుఃఖంతో నిండిపోయింది” is a fluent predicate for “నా ప్రాణం” and avoids the slightly cumbersome “తీవ్రమైన దుఃఖంలో మునిగిపోయింది.” “మెలకువగా ఉండండి” remains natural and, with its note, preserves both wakefulness and vigilance.
  terminology: “ప్రాణం” is a suitable context-sensitive rendering of ψυχή in this expression, retaining the sense of Jesus’ inner life/person without imposing a technical anthropological interpretation. “మెలకువగా ఉండండి” suitably renders γρηγορεῖτε; the note supplies the broader vigilant sense.
  issues:
  - severity: low
    issue: “మరణమయ్యేంతగా” is semantically awkward.
    rationale: The Greek ἕως θανάτου is an idiom of extremity, ‘to the point of death.’ In Telugu, “మరణమయ్యేంతగా” may be heard as ‘enough to become death,’ whereas “మరణించేంతగా” clearly expresses the intended intensity.
  - severity: low
    issue: The alternative note for Περίλυπός is more paraphrastic than necessary.
    rationale: “దుఃఖంతో ఉక్కిరిబిక్కిరి అవుతోంది” is possible but adds an image not present in the Greek. A direct alternative better documents the lexical range.
  revised_text: 'ఆయన వారితో ఇలా అంటున్నాడు: “నా ప్రాణం మరణించేంతగా దుఃఖంతో నిండిపోయింది.[a][b] మీరు ఇక్కడే ఉండి మెలకువగా ఉండండి.[c]”'
