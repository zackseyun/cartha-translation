id: MRK.14.9
reference: Mark 14:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀμὴν ⸀δὲ λέγω ὑμῖν, ὅπου ⸀ἐὰν κηρυχθῇ τὸ ⸀εὐαγγέλιον εἰς ὅλον τὸν κόσμον, καὶ ὃ ἐποίησεν αὕτη λαληθήσεται εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/009.yaml
  text: Truly I tell you[a], wherever the good news is proclaimed in the whole world[b], what this woman has done will also be spoken of in memory of her.
translation:
  language: te
  text: '“నేను మీతో నిశ్చయంగా చెబుతున్నాను: ప్రపంచమంతటా సువార్త[a] ఎక్కడ ప్రకటించబడుతుందో, అక్కడ ఈమె చేసినది కూడా ఆమె జ్ఞాపకార్థంగా[b] చెప్పబడుతుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “శుభవార్త.”'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: “ఆమెకు స్మారకంగా.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: నిశ్చయంగా
  rationale: ఇది గంభీరమైన, అధికారపూర్వకమైన ప్రకటనకు ఉపోద్ఘాతం. ‘నిశ్చయంగా’ అనే పదం దాని బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: తెలుగు వాక్యప్రవాహంలో అంతర్లీనంగా ఉంచబడింది
  rationale: δέ ఇక్కడ స్వల్ప అనుసంధాన పదం. ప్రత్యేక సంధిపదాన్ని చేర్చకుండానే తెలుగు వాక్యప్రవాహం దాని సంభాషణాత్మక పనిని నిలుపుతుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో ... చెబుతున్నాను
  rationale: ప్రత్యక్ష సంబోధనను, ప్రకటనలోని గంభీరతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὅπου ἐὰν
  choice: ఎక్కడ ... అక్కడ
  rationale: ఏ ప్రదేశంలో ఆ పరిస్థితి నెరవేరినా అనే సాధారణ, అనిర్దిష్ట భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: κηρυχθῇ
  choice: ప్రకటించబడుతుందో
  rationale: κηρύσσωలోని బహిరంగ ప్రకటన భావాన్ని నిలుపుతుంది; దానిని కేవలం ప్రసంగం లేదా బోధకు పరిమితం చేయదు.
- source_word: τὸ εὐαγγέλιον
  choice: సువార్త
  rationale: ‘మంచి/శుభ వార్త’ అనే మూలార్థంతో పాటు స్థిరపడిన క్రైస్తవ వాడుకను కూడా ‘సువార్త’ సహజంగా మోస్తుంది. ‘శుభవార్త’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చాం.
- source_word: εἰς ὅλον τὸν κόσμον
  choice: ప్రపంచమంతటా
  rationale: విస్తృతమైన సార్వత్రిక పరిధిని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ
  choice: కూడా
  rationale: సువార్త ప్రకటించబడటంతో పాటు ఈమె చేసిన పని కూడా చెప్పబడుతుందనే చేర్పు భావాన్ని స్పష్టం చేస్తుంది.
- source_word: ὃ ἐποίησεν αὕτη
  choice: ఈమె చేసినది
  rationale: స్త్రీలింగ ఏకవచన సూచనసర్వనామమైన αὕτηను నిలుపుతూ, సమీప సందర్భంలోని స్త్రీని సహజంగా సూచిస్తుంది.
- source_word: λαληθήσεται
  choice: చెప్పబడుతుంది
  rationale: ఆమె చేసిన పని తరువాత మౌఖికంగా తెలియజేయబడుతుందనే భవిష్యత్ కర్మణి భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: ఆమె జ్ఞాపకార్థంగా
  rationale: ఆమెను జ్ఞాపకం చేసుకునే ఉద్దేశాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; నామవాచక రూపానికి దగ్గరైన ‘ఆమెకు స్మారకంగా’ అనే భావాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: ప్రపంచవ్యాప్త ప్రకటన సందర్భంలో εὐαγγέλιον పదాన్ని అనువదించడం
  choice: సువార్త
  alternative: శుభవార్త
  rationale: ‘సువార్త’ ఆధునిక తెలుగులో సహజంగా అర్థమయ్యే స్థిరపదం; అది మూలంలోని ‘మంచి వార్త’ భావాన్నీ క్రైస్తవ ప్రకటన సందర్భాన్నీ నిలుపుతుంది. ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇవ్వడం ద్వారా పదంలోని సాధారణ వార్తార్థం కూడా కనిపిస్తుంది.
- issue: αὕτηను స్పష్టంగా గుర్తించడం
  choice: ఈమె చేసినది
  alternative: ఆమె చేసినది
  rationale: గ్రీకు పదం సమీప సందర్భంలోని స్త్రీని సూచించే స్త్రీలింగ ఏకవచన సూచనసర్వనామం. ‘ఈమె’ దాని సూచనాత్మక బలాన్ని అనవసర వ్యాఖ్యానం లేకుండా నిలుపుతుంది.
- issue: εἰς μνημόσυνον αὐτῆςలోని జ్ఞాపక/స్మారక భావం
  choice: ఆమె జ్ఞాపకార్థంగా
  alternative: ఆమెకు స్మారకంగా
  rationale: మూలపదం జ్ఞాపకం చేసుకోవడం లేదా స్మారకంగా నిలవడం అనే రెండింటినీ అనుమతిస్తుంది. ప్రధాన పాఠం సహజమైన తెలుగు ప్రయోగాన్ని వాడగా, నామవాచక నిర్మాణానికి దగ్గరైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ప్రత్యక్ష వాక్యంలోని అధికారపూర్వక స్వరాన్ని నిలుపుతూ, అనవసరమైన ప్రాచీన లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించాం. పాదసూచిక గుర్తులను అవి వివరించే పదబంధాల వెంట ఉంచాం.
