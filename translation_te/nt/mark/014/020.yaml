id: MRK.14.20
reference: Mark 14:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν αὐτοῖς· ⸀Εἷς τῶν δώδεκα, ὁ ἐμβαπτόμενος μετ’ ἐμοῦ εἰς ⸀τὸ τρύβλιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/020.yaml
  text: And he said to them[a], “One of the twelve, the one dipping with me into the bowl.”
translation:
  language: te
  text: ఆయన వారితో, “పన్నెండుమందిలో ఒకడు—నాతో పాటు గిన్నెలో[a] ముంచుతున్నవాడే,” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పళ్లెం.” గ్రీకు పదం భోజనానికి ఉపయోగించే గిన్నెను లేదా పళ్లెాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ఆయన వారితో ... అని చెప్పాడు
  rationale: δέ ఇక్కడ బలమైన వ్యతిరేకతను కాక కథన కొనసాగింపును సూచిస్తుంది. తెలుగులో ప్రత్యేక సంధానపదం లేకుండానే సహజంగా కొనసాగించడం దాని స్వల్ప అనుసంధాన బలాన్ని నిలుపుతుంది.
- source_word: εἶπεν αὐτοῖς
  choice: ఆయన వారితో ... అని చెప్పాడు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే సాధారణ, సహజ తెలుగు రూపం; λέγωకు అదనపు వ్యాఖ్యానార్థం జోడించదు.
- source_word: Εἷς τῶν δώδεκα
  choice: పన్నెండుమందిలో ఒకడు
  rationale: యేసు సన్నిహిత శిష్యబృందానికి చెందిన వ్యక్తి అని స్పష్టంగా తెలియజేసే సహజ తెలుగు ప్రయోగం.
- source_word: ὁ ἐμβαπτόμενος
  choice: ముంచుతున్నవాడే
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న/తక్షణ చర్యను నిలుపుతూ, గుర్తింపును సూచించే గ్రీకు నిర్దిష్ట నిర్మాణాన్ని తెలుగులో ‘వాడే’ ద్వారా వ్యక్తం చేస్తుంది.
- source_word: μετ’ ἐμοῦ
  choice: నాతో కలిసి
  rationale: μετά + షష్ఠీ విభక్తి సూచించే సహచర్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἰς τὸ τρύβλιον
  choice: గిన్నెలో
  rationale: τρύβλιον భోజనానికి ఉపయోగించే గిన్నె లేదా పళ్లెాన్ని సూచించవచ్చు. ‘గిన్నె’ సాధారణ ఆధునిక తెలుగు; ‘లో’ ముంచే చర్యలోని అంతర్ముఖ గమనాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ద్రోహి గుర్తింపు యొక్క వాక్య నిర్మాణం
  choice: “పన్నెండుమందిలో ఒకడు—నాతో కలిసి గిన్నెలో ముంచుతున్నవాడే”
  alternative: “పన్నెండుమందిలో ఒకడు, నాతో కలిసి గిన్నెలో ముంచేవాడు”
  rationale: గ్రీకు వాక్యం పేరును చెప్పకుండా రెండు గుర్తింపు పదబంధాలను పక్కపక్కన ఉంచుతుంది. తెలుగు రూపం కూడా ఆ ఉద్విగ్నతను నిలుపుతుంది; అలవాటుగా చేసే చర్యగా మార్చకుండా సందర్భంలోని జరుగుతున్న చర్యను సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే గంభీరతను నిలుపుకునేలా రూపొందించబడింది. మూలంలోని అసంపూర్ణంగా వినిపించే గుర్తింపు వాక్య నిర్మాణం తెలుగు పఠనసౌలభ్యానికి అనుగుణంగా డాష్‌తో నిలుపబడింది.
