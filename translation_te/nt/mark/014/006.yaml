id: MRK.14.6
reference: Mark 14:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε αὐτήν· τί αὐτῇ κόπους παρέχετε; καλὸν ἔργον ἠργάσατο ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/006.yaml
  text: But Jesus said[a], “Leave her alone[c][b]. Why are you troubling her? She has done a beautiful work for me.”
translation:
  language: te
  text: అయితే యేసు, “ఆమెను వదిలేయండి. ఆమెను ఎందుకు ఇబ్బంది పెడుతున్నారు?[a] ఆమె నాకు ఒక చక్కని పని చేసింది.[b][c]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమెకు ఎందుకు కష్టం కలిగిస్తున్నారు?”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆమె నాకు ఒక మంచి పని చేసింది.”
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “నాలో”; ఇక్కడ ఆ పని యేసును ఉద్దేశించి జరిగిందనే భావంలో “నాకు” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφετε αὐτήν
  choice: ఆమెను వదిలేయండి
  rationale: ఆజ్ఞారూపం ఆమె విషయంలో జోక్యం చేసుకోవడం వెంటనే మానాలని సూచిస్తుంది. ఆధునిక తెలుగులో ఈ మాట సహజంగా, యేసు ఆమెను కాపాడుతున్న భావంతో వినిపిస్తుంది.
- source_word: τί αὐτῇ κόπους παρέχετε;
  choice: ఆమెను ఎందుకు ఇబ్బంది పెడుతున్నారు?
  rationale: κόπους παρέχετε అనే ప్రయోగం అక్షరార్థంగా ఆమెకు కష్టాలు కలిగించడాన్ని సూచించినా, సందర్భంలో వేధించడం లేదా ఇబ్బంది పెట్టడం అనే భావం సహజమైనది.
- source_word: καλὸν ἔργον
  choice: ఒక చక్కని పని
  rationale: καλός‌లోని మంచి, ప్రశంసనీయం, సుందరమైనది అనే భావపరిధిని ‘చక్కని’ కొంతవరకు నిలుపుతుంది; కేవలం నైతిక మంచితనానికే భావాన్ని పరిమితం చేయదు.
- source_word: ἠργάσατο
  choice: చేసింది
  rationale: ఈ సందర్భంలో క్రియకు సరళమైన, సహజమైన తెలుగు సమానం ‘చేసింది’.
- source_word: ἐν ἐμοί
  choice: నా పట్ల
  rationale: అక్షరార్థమైన ‘నాలో’ తెలుగులో ఈ సందర్భానికి అసహజంగా ఉంటుంది. ఆ పని యేసును ఉద్దేశించి, ఆయన పట్ల జరిగిందనే సంబంధార్థాన్ని ‘నా పట్ల’ నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందున్న విమర్శకు విరుద్ధంగా యేసు స్పందిస్తున్న కథన మలుపును సూచిస్తుంది.
theological_decisions:
- issue: καλὸν ἔργον ద్వారా స్త్రీ చేసిన పనికి ఇచ్చిన విలువ
  choice: చక్కని పని
  alternative: మంచి పని
  rationale: యేసు ఆ పనిని ప్రశంసించిన భావాన్నీ, అది సందర్భోచితంగా సుందరమైనదనే ఛాయనూ నిలుపుతూ, పుణ్యకార్యం లేదా ప్రత్యేక మతసిద్ధాంత భావాన్ని చేర్చకుండా ఉంటుంది.
- issue: ἐν ἐμοί యొక్క సంబంధార్థం
  choice: నా పట్ల
  alternative: నాలో; నా మీద; నాకు
  rationale: మూలంలోని అసాధారణ పదబంధాన్ని వ్యాఖ్యానంతో అతిగా నిర్దిష్టం చేయకుండా, ఆ పని యేసు వైపు ఉద్దేశించబడిందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. అక్షరార్థం పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి వాడబడింది. బహువచన క్రియారూపాలు విమర్శిస్తున్న సమూహాన్ని ఉద్దేశించినవిగా ఉన్నాయి; మూలంలోని అర్థసందిగ్ధతలు పాదసూచికల్లో నిలుపబడ్డాయి.
