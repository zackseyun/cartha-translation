id: MRK.14.48
reference: Mark 14:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/048.yaml
  text: And Jesus answered and said to them[a], “Have you come out as against a robber, with swords and clubs, to arrest me?”
translation:
  language: te
  text: 'యేసు వారికి జవాబిచ్చి ఇలా అన్నాడు: “మీరు ఒక బందిపోటును ఎదుర్కొనడానికి వచ్చినట్లుగా, నన్ను పట్టుకోవడానికి కత్తులతో, కర్రలతో వచ్చారా?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: ఇలా జవాబిచ్చాడు
  rationale: గ్రీకు భాషలో మాటను పరిచయం చేసే సాధారణ జంట ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో ఒకే క్రియాపదబంధంగా వ్యక్తం చేస్తుంది; ‘జవాబిచ్చి అన్నాడు’ అనే అసహజ పునరుక్తిని నివారిస్తుంది.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: ఒక బందిపోటు మీదికి వచ్చినట్లు
  rationale: యేసును ఆయుధాలతో ఎదుర్కోవలసిన ప్రమాదకర నేరస్థునిగా పరిగణించిన భావాన్ని, ὡς ἐπί నిర్మాణంలోని పోలికను నిలుపుతూ తెలియజేస్తుంది.
- source_word: λῃστὴν
  choice: బందిపోటు
  rationale: ఇది కేవలం దొంగను కాక హింసాత్మకంగా దోచుకునే దుండగుడు లేదా తిరుగుబాటుదారుని కూడా సూచించగల గ్రీకు పదానికి ‘దొంగ’ కంటే విస్తృతమైన, సందర్భోచితమైన తెలుగు పదం.
- source_word: ἐξήλθατε
  choice: వచ్చారా
  rationale: అరెస్టు చేయడానికి వారి వద్దకు వచ్చిన చర్యను తెలుగు సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది; గ్రీకులోని ‘బయలుదేరి వచ్చారు’ అనే భావాన్ని ప్రశ్న యొక్క సందర్భమే స్పష్టం చేస్తుంది.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: కత్తులతో, కర్రలతో
  rationale: μάχαιρα చిన్న కత్తి లేదా ఖడ్గాన్ని సూచించవచ్చు; ‘కత్తులు’ సహజమైన విస్తృత పదం. ξύλα ఇక్కడ ఆయుధాలుగా వాడే చెక్క కర్రలను సూచిస్తుంది.
- source_word: συλλαβεῖν με
  choice: నన్ను పట్టుకోవడానికి
  rationale: συλλαμβάνω యొక్క అదుపులోకి తీసుకోవడం/బంధించడం అనే భావాన్ని సాధారణ పాఠకులకు సహజంగా అందిస్తుంది; ‘అరెస్టు చేయడానికి’ కంటే కాలసందర్భానికి తటస్థంగా ఉంటుంది.
theological_decisions:
- issue: λῃστής పదంలోని నేర మరియు తిరుగుబాటు సంబంధిత భావవ్యాప్తి
  choice: ప్రధాన పాఠ్యంలో ‘బందిపోటు’; పాదసూచికలో ‘దోపిడీదొంగ, దుండగుడు, లేదా తిరుగుబాటుదారుడు’ అనే ప్రత్యామ్నాయాలు
  alternative: ‘దొంగ’ లేదా ‘తిరుగుబాటుదారుడు’ అని మాత్రమే అనువదించడం
  rationale: గ్రీకు పదాన్ని కేవలం సాధారణ దొంగతనానికో, రాజకీయ తిరుగుబాటుకో పరిమితం చేయకుండా దాని నిజమైన అర్థవ్యాప్తిని కాపాడుతుంది. వాక్యం యేసు గురించి ఆ ముద్రను అంగీకరించడం కాదు; ఆయనను అలా ఎదుర్కొన్న వారి చర్యను ప్రశ్నిస్తోంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి. గ్రీకు వాక్యంలోని అలంకారిక ప్రశ్నను, ఆయుధాలతో వచ్చిన దళంపై యేసు వ్యక్తం చేసిన వ్యతిరేక భావాన్ని సహజంగా నిలిపింది.
