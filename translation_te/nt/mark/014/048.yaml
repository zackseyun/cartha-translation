  to: 'యేసు వారికి జవాబిచ్చి ఇలా అన్నాడు: “మీరు ఒక బందిపోటును ఎదుర్కొనడానికి వచ్చినట్లుగా, నన్ను పట్టుకోవడానికి కత్తులతో, కర్రలతో వచ్చారా?”'
  rationale: The revision removes the added temporal meaning, renders the Greek comparative construction in idiomatic Telugu, and retains the lexical breadth of λῃστής in the existing footnote. The footnote marker remains attached to ‘బందిపోటు.’
