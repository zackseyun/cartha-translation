    text: లేదా “దోపిడీదొంగ,” “దుండగుడు,” లేదా “తిరుగుబాటుదారుడు.” గ్రీకు పదం కేవలం దొంగనే కాక, హింసాత్మక బందిపోటును లేదా తిరుగుబాటుదారుని కూడా సూచించవచ్చు.
    reason: lexical_alternative
