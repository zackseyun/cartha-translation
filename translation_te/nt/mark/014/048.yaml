review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the armed party’s purpose and preserves the rhetorical question. However, ‘అప్పుడు’ adds a temporal sense not present in καί, and ‘ఒక బందిపోటు మీదికి వచ్చినట్లు’ is not idiomatic Telugu for ὡς ἐπὶ λῃστήν (‘as against a bandit/robber’).
  naturalness: The revised wording uses natural modern Telugu while retaining the Greek comparison and the double purpose/action structure without needless repetition.
  terminology: ‘బందిపోటు’ suitably represents λῃστής as a potentially violent bandit, and the footnote appropriately preserves alternatives including an insurgent/rebel sense. ‘కత్తులు,’ ‘కర్రలు,’ and ‘పట్టుకోవడానికి’ are clear and contextually fitting.
  issues:
  - severity: medium
    issue: Unsupported temporal connective
    rationale: ‘అప్పుడు’ means ‘then,’ whereas the source has καί (‘and’) and does not explicitly add a temporal transition.
  - severity: medium
    issue: Awkward/inexact rendering of ὡς ἐπὶ λῃστήν
    rationale: ‘బందిపోటు మీదికి వచ్చినట్లు’ can suggest coming upon or attacking a bandit. ‘బందిపోటును ఎదుర్కొనడానికి వచ్చినట్లుగా’ naturally expresses treating Jesus as one would a dangerous bandit.
  revised_text: 'యేసు వారికి జవాబిచ్చి ఇలా అన్నాడు: “మీరు ఒక బందిపోటును ఎదుర్కొనడానికి వచ్చినట్లుగా, నన్ను పట్టుకోవడానికి కత్తులతో, కర్రలతో వచ్చారా?”'
  revised_footnotes:
