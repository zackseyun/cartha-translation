source:
  edition: SBLGNT
  text: καὶ ⸂πάλιν ἐλθὼν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ ⸂αὐτῶν οἱ ὀφθαλμοὶ⸃ ⸀καταβαρυνόμενοι, καὶ οὐκ ᾔδεισαν τί ⸂ἀποκριθῶσιν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/040.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down, and they did not know what they should answer him.
translation:
  language: te
  text: ఆయన మళ్లీ వచ్చి, వారు నిద్రపోతూ ఉండగా వారిని కనుగొన్నాడు. ఎందుకంటే వారి కళ్లు బరువెక్కిపోయి ఉన్నాయి[a]; ఆయనకు ఏమి జవాబివ్వాలో వారికి తెలియలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి కళ్లు భారంగా ఉన్నాయి.” గ్రీకు పదచిత్రం వారి కళ్లు భారంతో నొక్కబడినట్లు, లేదా బరువెక్కినట్లు సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: మళ్లీ
  rationale: కథనంలో పునరావృతమైన చర్యను సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἐλθὼν
  choice: వచ్చి
  rationale: ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను తెలుగులో సహజమైన క్రియావిశేషణ రూపంతో చూపిస్తుంది.
- source_word: εὗρεν αὐτοὺς καθεύδοντας
  choice: వారు నిద్రపోతూ ఉండడం చూశాడు
  rationale: καθεύδοντας సూచించే కొనసాగుతున్న నిద్ర స్థితిని నిలుపుతూ, ‘అలా ఉన్నట్లు కనుగొన్నాడు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ καταβαρυνόμενοι
  choice: ఎందుకంటే వారి కళ్లు బరువెక్కి ఉన్నాయి
  rationale: γάρ ఇచ్చే కారణ సంబంధాన్ని స్పష్టంగా ఉంచి, καταβαρυνόμενοι లోని బరువుతో అణగిపోతున్న దృశ్యరూపాన్ని సహజమైన తెలుగు ప్రయోగంతో నిలుపుతుంది.
- source_word: οὐκ ᾔδεισαν
  choice: వారికి తెలియలేదు
  rationale: ఇక్కడ జ్ఞానం లేకపోవడాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τί ἀποκριθῶσιν αὐτῷ
  choice: ఆయనకు ఏమని జవాబివ్వాలో
  rationale: పరోక్ష ప్రశ్నను, జవాబు యేసుకు ఉద్దేశించబడిందనే భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
