translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గంభీరమైన కథన శైలిలో రూపొందించబడింది. మూలంలోని కారణ సంబంధం, కొనసాగుతున్న నిద్ర స్థితి, కళ్లపై భారం అనే దృశ్యరూపం నిలుపబడ్డాయి.
