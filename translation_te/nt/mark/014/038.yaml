id: MRK.14.38
reference: Mark 14:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ ⸀ἔλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/038.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: te
  text: జాగరూకంగా ఉండి ప్రార్థించండి[a], మీరు శోధనలోకి ప్రవేశించకుండా ఉండేందుకు. ఆత్మ అయితే సుముఖంగా ఉంది, కానీ శరీరం బలహీనంగా ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “శోధన” అని అనువదించిన గ్రీకు పదానికి “పరీక్ష” లేదా “కష్టకాలం” అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: మేల్కొని ఉండండి
  rationale: బహువచన ఆజ్ఞారూపంలోని ‘మేల్కొని/జాగరూకంగా ఉండండి’ అనే భావాన్ని గెత్సేమనే సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: προσεύχεσθε
  choice: ప్రార్థించండి
  rationale: వర్తమాన ఆజ్ఞ యొక్క కొనసాగుతున్న ప్రోత్సాహక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἵνα μὴ ἔλθητε εἰς πειρασμόν
  choice: అప్పుడు మీరు శోధనలో పడరు
  rationale: ప్రయోజన/నివారణ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, ‘శోధనలో ప్రవేశించడం’ అనే మూలభాషా రూపకాన్ని ‘శోధనలో పడడం’గా అర్థవంతంగా అందిస్తుంది.
- source_word: πειρασμόν
  choice: శోధన
  rationale: ఈ హెచ్చరిక సందర్భంలో ప్రలోభం అనే భావానికి సరిపోతుంది; అయితే గ్రీకు పదానికి పరీక్ష లేదా కష్టం అనే విస్తృత అర్థం కూడా ఉన్నందున దాన్ని పాదసూచికలో ఉంచాం.
- source_word: τὸ μὲν πνεῦμα
  choice: ఆత్మ
  rationale: ‘శరీరం’తో ఉన్న వ్యత్యాసంలో మానవ అంతరంగ సంకల్పాన్ని సూచించే సహజమైన పదం; పరిశుద్ధాత్మ అని నిర్దిష్టంగా వ్యాఖ్యానించదు.
- source_word: πρόθυμον
  choice: సిద్ధంగానే ఉంది
  rationale: సుముఖత, సంసిద్ధత అనే భావాన్ని ఈ సందర్భంలో సహజంగా తెలియజేస్తుంది; గ్రీకు μέν సూచించే బలపరిచే వ్యత్యాసాన్ని ‘గానే’ కొంతవరకు ప్రతిబింబిస్తుంది.
- source_word: ἡ δὲ σὰρξ
  choice: కానీ శరీరం
  rationale: ఇక్కడ σάρξ మానవ బలహీనతను సూచిస్తుంది. ‘పాప స్వభావం’ అని ఇవ్వడం అవసరానికి మించిన సిద్ధాంత వ్యాఖ్యానం అవుతుంది; తెలుగులో ‘శరీరం’ సాధారణ పాఠకునికి సహజంగా ఉండి అంతరంగ సంకల్పంతో వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἀσθενής
  choice: బలహీనంగా ఉంది
  rationale: సిద్ధంగా ఉన్న ఆత్మకు విరుద్ధంగా మానవ అసమర్థతను స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: πνεῦμα యొక్క సూచన
  choice: మానవ ఆత్మ / అంతరంగ సంకల్పం
  alternative: పరిశుద్ధాత్మ
  rationale: నిద్రకు లోనైన శిష్యులతో యేసు మాట్లాడుతున్న సందర్భం, అలాగే ‘శరీరం’తో ఉన్న ప్రత్యక్ష వ్యత్యాసం, మానవ అంతరంగ సుముఖతను సూచిస్తున్నట్లు బలపరుస్తాయి. ‘పరిశుద్ధాత్మ’ అని అనువదించడం మూలపాఠం తప్పనిసరిగా చెప్పని అర్థాన్ని జోడిస్తుంది.
- issue: σάρξ యొక్క అనువాదం
  choice: శరీరం
  alternative: శరీర స్వభావం; పాప స్వభావం; దేహం
  rationale: ఇక్కడ ప్రధాన భావం ప్రత్యేకంగా పాపస్వభావ సిద్ధాంతం కాక, మానవ శారీరక బలహీనత. అందువల్ల సహజమైన తెలుగు ‘శరీరం’ను ఎంచుకోవడం ద్వారా మూలంలోని ఆత్మ–శరీర వ్యత్యాసాన్ని కాపాడుతూ అతివ్యాఖ్యానాన్ని నివారించాం.
- issue: πειρασμός యొక్క అర్థ పరిధి
  choice: శోధన
  alternative: పరీక్ష; కష్టం; ప్రలోభం
  rationale: సందర్భంలో శిష్యులు తప్పిపోవడానికి దారితీసే శోధన ప్రధానంగా కనిపిస్తుంది; అయినా ఈ గ్రీకు పదం పరీక్ష లేదా కష్టకాలాన్నీ సూచించగలదు కాబట్టి ఆ అస్పష్టతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం వాడబడింది. మూలంలోని సంక్షిప్తత, ఆత్మ–శరీర వ్యత్యాసం, πειρασμός పదంలోని అర్థ విస్తృతి సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
