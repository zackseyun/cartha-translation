revisions:
- from: మేల్కొని ఉండండి; ప్రార్థించండి[a]. అప్పుడు మీరు శోధనలో పడరు. ఆత్మ సిద్ధంగానే ఉంది, కానీ శరీరం బలహీనంగా ఉంది.
  to: జాగరూకంగా ఉండి ప్రార్థించండి[a], మీరు శోధనలోకి ప్రవేశించకుండా ఉండేందుకు. ఆత్మ అయితే సుముఖంగా ఉంది, కానీ శరీరం బలహీనంగా ఉంది.
  rationale: The revision restores the Greek purpose clause and its “enter into” imagery while preserving the lexical breadth of πειρασμός in a footnote. It retains the draft’s appropriately nonsectarian rendering of πνεῦμα and its contextually natural rendering of σάρξ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:14:59Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the two imperatives and the spirit–flesh contrast, but “అప్పుడు మీరు శోధనలో పడరు” changes the Greek purpose/prevention clause (ἵνα μή) into a consequential prediction (“then you will not fall”). It also replaces the source image of entering into πειρασμός with falling into it.
  naturalness: The revised wording is clear, modern standard Telugu and retains a direct but respectful plural imperative. “శోధనలోకి ప్రవేశించకుండా ఉండేందుకు” preserves the source construction without sounding archaic.
  terminology: “ఆత్మ” appropriately leaves πνεῦμα uncapitalized and does not identify it as the Holy Spirit. “శరీరం” is a natural contextual rendering of σάρξ here, emphasizing human frailty without importing “sinful nature.” The footnote should give “కష్టకాలం” rather than the overly broad “కష్టం” for the trial/testing sense.
  issues:
  - severity: medium
    issue: Purpose clause rendered as a result statement
    rationale: ἵνα μὴ ἔλθητε εἰς πειρασμόν means “so that/in order that you may not enter into temptation/testing.” “అప్పుడు మీరు ... పడరు” means “then you will not fall,” weakening the intended purpose and changing the verbal image.
  - severity: low
    issue: Footnote alternative “కష్టం” is imprecise
    rationale: For πειρασμός, “పరీక్ష” and “కష్టకాలం” better represent “testing” and “trial” than the broad term “కష్టం.”
  revised_text: జాగరూకంగా ఉండి ప్రార్థించండి[a], మీరు శోధనలోకి ప్రవేశించకుండా ఉండేందుకు. ఆత్మ అయితే సుముఖంగా ఉంది, కానీ శరీరం బలహీనంగా ఉంది.
  revised_footnotes:
