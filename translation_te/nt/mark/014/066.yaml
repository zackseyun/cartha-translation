translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. వాక్యం తరువాతి వచనంలో కొనసాగేలా మూలంలోని అసంపూర్ణ కథన ప్రవాహాన్ని నిలిపింది. παιδίσκη యొక్క సేవకురాలు/బానిస అనే న్యాయస్థితి అస్పష్టతను ప్రధాన పాఠంలో ‘పనిపిల్ల’ ద్వారా అనవసరంగా నిర్ణయించకుండా ఉంచింది.
