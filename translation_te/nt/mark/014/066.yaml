  text: Καὶ ὄντος τοῦ Πέτρου ⸂κάτω ἐν τῇ αὐλῇ⸃ ἔρχεται μία τῶν παιδισκῶν τοῦ ἀρχιερέως,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/066.yaml
  text: And while Peter was below in the courtyard[a], one of the high priest’s servant girls came,
translation:
  language: te
  text: పేతురు క్రింది ప్రాంగణంలో ఉండగా, ప్రధాన యాజకుని సేవకురాళ్లలో ఒకరు వచ్చింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రధాన యాజకుని బానిస స్త్రీలలో ఒకరు.” గ్రీకు పదం παιδίσκη స్త్రీ గృహసేవకురాలిని లేదా బానిస స్త్రీని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντος τοῦ Πέτρου
  choice: పేతురు … ఉండగా
  rationale: వర్తమాన కృదంతంతో ఉన్న జనిటివ్ అబ్సల్యూట్‌ను సహజమైన తెలుగు కాలసూచక ఉపవాక్యంగా అనువదించడం ద్వారా కొనసాగుతున్న నేపథ్యాన్ని నిలిపింది.
- source_word: κάτω
  choice: కింద
  rationale: ఇది దిగువన ఉన్న స్థలాన్ని సూచిస్తుంది; ప్రాంగణం నివాసంలోని ఇతర భాగాలకంటే కింద ఉందనే భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἐν τῇ αὐλῇ
  choice: ప్రాంగణంలో
  rationale: ఇక్కడ αὐλή ప్రధాన యాజకుని నివాస సముదాయంలోని బహిరంగ ఆవరణను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘ప్రాంగణం’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: ἔρχεται
  choice: వచ్చింది
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నా, తెలుగు కథన ప్రవాహంలో భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: μία τῶν παιδισκῶν
  choice: పనిపిల్లల్లో ఒకామె
  rationale: παιδίσκη ఇంటి పనులు చేసే యువ సేవకురాలిని లేదా బానిస స్త్రీని సూచించగలదు. సందర్భంలో ఆమె గృహసేవ పాత్ర ముందుకు వస్తున్నందున ‘పనిపిల్ల’ సహజమైన ఎంపిక; అయితే మూలపదం సూచించగల బానిస స్థితిని ఈ పదం నిర్దిష్టంగా తేల్చదు.
- source_word: τοῦ ἀρχιερέως
  choice: ప్రధాన యాజకుని
  rationale: ఈ సంబంధవిభక్తి ఆమె ప్రధాన యాజకుని ఇంటివారిలోని సేవకురాలు అనే అనుబంధాన్ని సహజంగా తెలియజేస్తుంది.
