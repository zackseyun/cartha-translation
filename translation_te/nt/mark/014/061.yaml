id: MRK.14.61
reference: Mark 14:61
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἐσιώπα καὶ ⸂οὐκ ἀπεκρίνατο οὐδέν⸃. πάλιν ὁ ἀρχιερεὺς ἐπηρώτα αὐτὸν καὶ λέγει αὐτῷ· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ εὐλογητοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/061.yaml
  text: But he kept silent and answered nothing[a]. Again the high priest questioned him and says to him, “Are you the Messiah[b], the Son of the Blessed One?”
translation:
  language: te
  text: 'అయితే ఆయన మౌనంగానే ఉండి, ఏ జవాబూ చెప్పలేదు. ప్రధాన యాజకుడు మళ్లీ ఆయనను ప్రశ్నిస్తూ ఆయనతో ఇలా అడిగాడు: “నీవు మెస్సీయవా[a], స్తోత్రార్హుని[b] కుమారుడవా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “క్రీస్తువా?” గ్రీకు Χριστός (క్రిస్టోస్) ఇక్కడ యూదుల మెస్సీయ సంబంధమైన సందర్భంలో ఒక బిరుదుగా ఉంది.
    reason: alternative_rendering
  - marker: b
    text: “స్తోత్రార్హుడు” అనేది దేవుణ్ణి గౌరవపూర్వకంగా సూచించే యూదుల పరోక్ష ప్రయోగం.
    reason: cultural_note
lexical_decisions:
- source_word: ἐσιώπα
  choice: మౌనంగానే ఉండి
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న మౌనాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘గానే’ ఆయన జవాబు ఇవ్వకుండా కొనసాగిన భావాన్ని బలపరుస్తుంది.
- source_word: ἀπεκρίνατο οὐδέν
  choice: ఏ జవాబూ చెప్పలేదు
  rationale: οὐδέν తెలిపే సంపూర్ణ నిరాకరణను సహజంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: ప్రధాన యాజకుడు ప్రశ్నను తిరిగి వేయడాన్ని సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: ἀρχιερεύς
  choice: ప్రధాన యాజకుడు
  rationale: యూదుల అత్యున్నత యాజక పదవికి ప్రామాణికమైన, సాధారణ పాఠకులకు అర్థమయ్యే తెలుగు పదబంధం.
- source_word: ἐπηρώτα
  choice: ప్రశ్నిస్తూ
  rationale: న్యాయవిచారణ సందర్భంలోని ప్రశ్నించడాన్ని తెలియజేస్తూ, అసంపూర్ణ భూతకాలంలోని కొనసాగింపు భావాన్ని కూడా నిలుపుతుంది.
- source_word: λέγει
  choice: అని అడిగాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని తెలుగు కథనంలో సహజమైన భూతకాలంగా వ్యక్తం చేస్తుంది; ఇది ప్రశ్న కావడంతో ‘అడిగాడు’ సందర్భానుకూలం.
- source_word: χριστός
  choice: మెస్సీయ
  rationale: యూదుల న్యాయవిచారణ సందర్భంలో ఇది వ్యక్తిపేరుగా కాక అభిషిక్త రాజు/విమోచకుని బిరుదుగా పనిచేస్తుంది; ‘మెస్సీయ’ ఆ సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: ὁ υἱὸς τοῦ εὐλογητοῦ
  choice: స్తుతింపదగినవాని కుమారుడు
  rationale: దేవుణ్ణి నేరుగా పేర్కొనకుండా గౌరవపూర్వకంగా సూచించే యూదుల ప్రయోగాన్ని ‘దేవుని కుమారుడు’గా విప్పకుండా నిలుపుతుంది.
theological_decisions:
- issue: χριστός అనే మెస్సీయ బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ప్రధాన యాజకుని ప్రశ్నలో ఈ పదం యూదులు ఎదురుచూసిన అభిషిక్తుని బిరుదుగా ఉంది. అందువల్ల పేరులా వినిపించే రూపం కంటే బిరుదు భావాన్ని స్పష్టంగా నిలిపే ‘మెస్సీయ’ను ఎంచుకున్నాం.
- issue: τοῦ εὐλογητοῦ అనే దేవునికి గౌరవపూర్వక పరోక్ష సూచన
  choice: స్తుతింపదగినవాని
  alternative: దేవుని
  rationale: మూలంలోని పరోక్షతను తొలగించి ‘దేవుడు’ అని స్పష్టీకరించకుండా, యూదుల గౌరవపూర్వక సంభాషణా శైలిని నిలిపాం.
- issue: λέγει అనే చారిత్రక వర్తమానం
  choice: అని అడిగాడు
  alternative: అని అంటున్నాడు
  rationale: మార్కు వాడిన చారిత్రక వర్తమానంలోని జీవంతత్వాన్ని అక్షరానుసారంగా అనుసరించడం తెలుగులో కాలక్రమాన్ని అసహజంగా చేస్తుంది. భావం మార్చకుండా సహజ కథన భూతకాలాన్ని వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయవిచారణ శైలిని అనుసరించాం. మూలంలోని కొనసాగుతున్న మౌనం, పునరావృత ప్రశ్న, మెస్సీయ బిరుదు, దేవునికి పరోక్ష గౌరవసూచన అన్నిటినీ నిలిపాం.
