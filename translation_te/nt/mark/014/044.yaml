  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఆయన’ అనే రూపం సందర్భానికి తగిన గౌరవాన్ని ఇస్తుంది; మూలంలోని ముందస్తు ఏర్పాటు, గుర్తింపు సంకేతం, గట్టి అదుపు అనే భావాలు సహజమైన వాక్యనిర్మాణంలో నిలుపబడ్డాయి.
