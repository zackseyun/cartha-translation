source:
  edition: SBLGNT
  text: δεδώκει δὲ ὁ παραδιδοὺς αὐτὸν σύσσημον αὐτοῖς λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτὸν καὶ ⸀ἀπάγετε ἀσφαλῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/044.yaml
  text: The one betraying him had given them a signal[a], saying, “The one I kiss is he[c][b]. Seize him and lead him away securely.”
translation:
  language: te
  text: 'ఆయనను అప్పగిస్తున్నవాడు వారికి ముందుగానే ఒక సంకేతం[a] ఇచ్చి ఇలా చెప్పాడు: “నేను ఎవరిని ముద్దుపెట్టుకుంటానో[b], ఆయనే. ఆయనను పట్టుకొని భద్రంగా తీసుకెళ్లండి[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గుర్తు.” గ్రీకు పదం ముందుగా అంగీకరించుకున్న గుర్తింపు సంకేతాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ముద్దుపెట్టుకోవడం ఆ కాలంలో సాధారణ పలకరింపు పద్ధతి; ఇక్కడ యూదా దానిని యేసును గుర్తించే సంకేతంగా ఉపయోగించాడు.
    reason: cultural_note
  - marker: c
    text: లేదా “సురక్షితంగా తీసుకెళ్లండి.” ఇక్కడ భావం ఆయనను గట్టి అదుపులో ఉంచి తీసుకెళ్లడమే కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: δεδώκει
  choice: ముందుగానే … ఇచ్చి ఇలా చెప్పాడు
  rationale: గ్రీకు భూతపూర్వకాల రూపం అరెస్టు జరగకముందే సంకేతం ఏర్పాటు చేయబడిందని సూచిస్తుంది. సహజమైన తెలుగులో ‘ముందుగానే’ ఆ ముందస్తు ఏర్పాటును స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: ఆయనను అప్పగిస్తున్నవాడు
  rationale: వర్తమాన కృదంత నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, ఈ సందర్భంలోని ద్రోహపూర్వకంగా అధికారులకు అప్పగించే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: σύσσημον
  choice: సంకేతం
  rationale: ముందుగా అంగీకరించుకున్న గుర్తింపు సూచన అనే భావాన్ని ‘సంకేతం’ సహజంగా అందిస్తుంది.
- source_word: Ὃν ἂν φιλήσω
  choice: నేను ఎవరిని ముద్దుపెట్టుకుంటానో
  rationale: ἄνతో కూడిన అనిర్దిష్ట సంబంధవాచక నిర్మాణాన్ని సహజమైన తెలుగు సంబంధ వాక్యంగా అందిస్తుంది; మూలంలో లేని ‘మనిషి’ వంటి పదాన్ని చేర్చదు.
- source_word: αὐτός ἐστιν
  choice: ఆయనే
  rationale: గ్రీకులోని బలమైన గుర్తింపును సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: κρατήσατε
  choice: పట్టుకొని
  rationale: ఇక్కడ క్రియ బలంగా అదుపులోకి తీసుకోవడాన్ని సూచిస్తుంది; న్యాయపరమైన ప్రక్రియను ముందుగా ఊహింపజేసే పదం కంటే ‘పట్టుకొని’ మూలానికి దగ్గరగా ఉంటుంది.
- source_word: ἀπάγετε ἀσφαλῶς
  choice: తప్పించుకోకుండా తీసుకెళ్లండి
  rationale: ఈ అరెస్టు సందర్భంలో ἀσφαλῶς యేసు క్షేమం కంటే ఆయన తప్పించుకోకుండా గట్టి అదుపులో తీసుకెళ్లడాన్ని సూచించే అవకాశం ఎక్కువ. తెలుగు పాఠకుడికి ఆ సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
