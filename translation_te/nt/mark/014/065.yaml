  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἤρξαντό τινες ἐμπτύειν αὐτῷ καὶ περικαλύπτειν ⸂αὐτοῦ τὸ πρόσωπον⸃ καὶ κολαφίζειν αὐτὸν καὶ λέγειν αὐτῷ· Προφήτευσον, καὶ οἱ ὑπηρέται ῥαπίσμασιν αὐτὸν ⸀ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/065.yaml
  text: And some began to spit on him[a], and to cover his face, and to strike him with their fists, and to say to him[b], “Prophesy!” And the officers received him with blows.
translation:
  language: te
  text: కొందరు ఆయనపై ఉమ్మివేయడం, ఆయన ముఖాన్ని కప్పడం[a], ఆయనను పిడికిళ్లతో కొట్టడం మొదలుపెట్టారు; ఆయనతో, “ప్రవచించు!” అని అన్నారు. కావలివారు ఆయనను దెబ్బలతో కొట్టారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన కళ్లకు గంతలు కట్టడం.” గ్రీకులో అక్షరార్థంగా “ఆయన ముఖాన్ని కప్పడం” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “కావలివారు ఆయనను దెబ్బలతో స్వీకరించారు”; లేదా, “కావలివారు ఆయనను దెబ్బలతో తీసుకుపోయారు.” గ్రీకు ప్రయోగం అక్షరార్థంగా “కావలివారు ఆయనను దెబ్బలతో స్వీకరించారు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντό τινες
  choice: కొందరు ... మొదలుపెట్టి
  rationale: అనిర్దిష్టమైన కొందరిని సూచిస్తూ, వరుసగా జరిగిన చర్యల ఆరంభాన్ని సహజమైన తెలుగు కథనశైలిలో వ్యక్తం చేస్తుంది.
- source_word: ἐμπτύειν αὐτῷ
  choice: ఆయన మీద ఉమ్మివేయడం
  rationale: దత్తి విభక్తితో ఉన్న గ్రీకు ప్రయోగం ప్రత్యక్ష అవమానకర చర్యను సూచిస్తుంది; తెలుగులో ఇది సహజమైన సమానార్థక ప్రయోగం.
- source_word: περικαλύπτειν αὐτοῦ τὸ πρόσωπον
  choice: ఆయన ముఖాన్ని కప్పడం
  rationale: గ్రీకు వాక్యంలోని ప్రత్యక్ష అర్థాన్ని కాపాడుతుంది; అది కళ్లకు గంతలు కట్టడంలా పనిచేసి ఉండవచ్చనే భావాన్ని ప్రధాన పాఠ్యంలో నిర్బంధించదు.
- source_word: κολαφίζειν αὐτὸν
  choice: ఆయనను పిడికిళ్లతో కొట్టడం
  rationale: κολαφίζω సాధారణంగా పిడికిలితో కొట్టడాన్ని సూచిస్తుంది; సాధారణమైన ‘కొట్టడం’ కంటే మూలంలోని నిర్దిష్టతను నిలుపుతుంది.
- source_word: Προφήτευσον
  choice: ప్రవచించు!
  rationale: వివరణాత్మక పదాలను చేర్చకుండా, మూలంలోని సంక్షిప్తమైన ఎగతాళి ఆజ్ఞను అలాగే ఉంచుతుంది.
- source_word: οἱ ὑπηρέται
  choice: పరిచారకులు
  rationale: న్యాయసభకు సేవచేసే కింది స్థాయి అధికార సిబ్బందిని సూచిస్తుంది; గృహ సేవకులు అనే భావాన్ని తప్పిస్తూ సంస్థాగత పాత్రను తెలుపుతుంది.
- source_word: ῥαπίσμασιν αὐτὸν ἔλαβον
  choice: ఆయనను దెబ్బలతో ఎదుర్కొన్నారు
  rationale: ‘దెబ్బలతో ఆయనను స్వీకరించారు’ అనే గ్రీకు నిర్మాణంలోని చిత్రాత్మకతను సాధ్యమైనంతగా నిలుపుతూ, ఆధునిక తెలుగులో అర్థమయ్యేలా ఉంది.
theological_decisions:
- issue: యేసు గుర్తింపుకు సంబంధించిన ఎగతాళి ఆజ్ఞ Προφήτευσον అనువాదం
  choice: ప్రవచించు!
  alternative: మాకు ప్రవచించు! / నీవు ప్రవక్తవని చూపించు!
  rationale: మూలపాఠ్యం కేవలం ఆజ్ఞనే ఇస్తుంది. అదనపు వివరణను చేర్చకుండా ఉండడం వల్ల కథనంలోని వ్యంగ్యాన్ని, క్రీస్తు గుర్తింపుతో ఉన్న ఉద్వేగాన్ని పాఠకుడు స్వయంగా గ్రహించగలడు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవసూచక ‘ఆయన’ను ఉపయోగించాం. వాక్యం దుర్వినియోగ చర్యల వేగవంతమైన వరుసను నిలుపుతుంది. ‘ప్రవచించు!’ అనే ఏకవచన ఆజ్ఞను వివరణ లేకుండా ఉంచాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
