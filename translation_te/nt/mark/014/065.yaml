- from: కొందరు ఆయన మీద ఉమ్మివేయడం, ఆయన ముఖాన్ని కప్పడం[a], ఆయనను పిడికిళ్లతో కొట్టడం మొదలుపెట్టి, “ప్రవచించు!” అని ఆయనతో అన్నారు. పరిచారకులు కూడా ఆయనను దెబ్బలతో ఎదుర్కొన్నారు.[b]
  to: కొందరు ఆయనపై ఉమ్మివేయడం, ఆయన ముఖాన్ని కప్పడం[a], ఆయనను పిడికిళ్లతో కొట్టడం మొదలుపెట్టారు; ఆయనతో, “ప్రవచించు!” అని అన్నారు. కావలివారు ఆయనను దెబ్బలతో కొట్టారు.[b]
