  yaml_path: translation/nt/mark/014/028.yaml
  text: But after I am raised[a], I will go ahead of you into Galilee.
translation:
  language: te
  text: కానీ నేను లేపబడిన తర్వాత[a], మీ కంటే ముందుగా గలిలయకు వెళ్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను లేపబడ్డ తర్వాత.’ గ్రీకు మూలంలో ‘లేపు’ అనే క్రియ కర్మణి రూపంలో ఉంది; పునరుత్థానాన్ని చెప్పడానికి ఈ రూపం సాధారణంగా వాడబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: ముందున్న చెదరిపోవడం గురించిన ప్రవచనానికి భిన్నంగా, తరువాత జరిగేదాన్ని చూపే సహజమైన వ్యతిరేక సంధానపదం.
- source_word: μετὰ τὸ ἐγερθῆναί με
  choice: నేను లేపబడిన తర్వాత
  rationale: μετά తో కూడిన ఆర్టిక్యులర్ ఇన్ఫినిటివ్ కాలక్రమంలో ‘తర్వాత’ అనే భావాన్ని ఇస్తుంది; క్రియలోని కర్మణి రూపాన్ని తెలుగు అనువాదం నిలుపుతుంది.
- source_word: ἐγερθῆναί
  choice: లేపబడిన
  rationale: ἐγείρω యొక్క ఏఓరిస్ట్ కర్మణి రూపాన్ని నిలుపుతూ, పునరుత్థాన సందర్భంలోని భావాన్ని అనవసర వివరణ లేకుండా వ్యక్తం చేస్తుంది.
- source_word: προάξω
  choice: మీకంటే ముందుగా ... వెళ్తాను
  rationale: శిష్యులకంటే ముందే గలిలయకు వెళ్లడమనే దిశాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὑμᾶς
  choice: మీ
  rationale: రెండవ పురుష బహువచనాన్ని తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: గలిలయకు
  rationale: గలిలయ వైపు గమనం అనే εἰς భావాన్ని సహజమైన తెలుగు గమ్య విభక్తితో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἐγερθῆναί με లోని పునరుత్థాన వాక్యరూపం
  choice: నేను లేపబడిన తర్వాత
  alternative: నేను లేచిన తర్వాత
  rationale: మూలంలోని కర్మణి క్రియారూపాన్ని నిలుపుతుంది; దాన్ని కర్తరి రూపంగా మార్చి ఎవరు లేపారనే అంశాన్ని గానీ, క్రియ స్వయంగా జరిగిందనే భావాన్ని గానీ అదనంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించబడింది. ‘లేపబడిన’ అనే కర్మణి రూపం కొంత అధికారికంగా వినిపించినా, మూలంలోని వ్యాకరణ రూపం మరియు పునరుత్థాన భావాన్ని కాపాడేందుకు ఉద్దేశపూర్వకంగా ఉపయోగించబడింది.
