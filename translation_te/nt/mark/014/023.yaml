  edition: SBLGNT
  text: καὶ ⸀λαβὼν ποτήριον εὐχαριστήσας ἔδωκεν αὐτοῖς, καὶ ἔπιον ἐξ αὐτοῦ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/023.yaml
  text: And taking a cup[a], after giving thanks he gave it to them, and they all drank from it.
translation:
  language: te
  text: ఆయన ఒక గిన్నెను[a] తీసుకొని, కృతజ్ఞతలు చెల్లించి వారికి ఇచ్చాడు; వారందరూ దాని నుండి తాగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ గిన్నెను.” గ్రీకులో “గిన్నె” అనే పదానికి నిర్దిష్ట ఉపపదం లేదు; అయితే భోజన సందర్భం ఒక నిర్దిష్ట గిన్నెను సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: తీసుకొని
  rationale: ప్రధాన క్రియకు ముందు జరిగిన అనుబంధ చర్యను సహజమైన తెలుగు క్రియావిశేషణ రూపంలో తెలియజేస్తుంది.
- source_word: ποτήριον
  choice: ఒక పాత్రను
  rationale: గ్రీకులో నిర్దేశక ఉపపదం లేదు. పానీయాన్ని ఉంచే పాత్ర అనే విస్తృత అర్థాన్ని ‘పాత్ర’ సహజంగా అందిస్తుంది; భోజన సందర్భంలో అది నిర్దిష్ట పాత్ర కావచ్చనే అవకాశాన్ని పాదటిప్పణి నిలుపుతుంది.
- source_word: εὐχαριστήσας
  choice: కృతజ్ఞతలు చెల్లించిన తరువాత
  rationale: ప్రధాన క్రియకు ముందుగా కృతజ్ఞత తెలిపిన చర్యను స్పష్టంగా చూపుతుంది; తరువాతి ఆరాధనా పారిభాషిక అర్థాన్ని వచనంలోకి దిగుమతి చేయదు.
- source_word: ἔδωκεν αὐτοῖς
  choice: వారికి ఇచ్చాడు
  rationale: ముందున్న ‘పాత్రను’ ఈ క్రియకు కర్మగా సహజంగానే గ్రహించవచ్చు; తెలుగులో అనవసరమైన సర్వనామ పునరుక్తిని నివారిస్తుంది.
- source_word: ἔπιον
  choice: తాగారు
  rationale: అయోరిస్ట్ క్రియకు సరళమైన, ఆధునిక తెలుగు సమానార్థకం.
- source_word: ἐξ αὐτοῦ
  choice: దానిలోనుంచి
  rationale: నపుంసకలింగ సర్వనామం ముందున్న పాత్రను సూచిస్తుంది; పాత్రలోని పానీయాన్ని తాగారనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πάντες
  choice: వారందరూ
  rationale: ప్రతి ఒక్కరూ తాగారనే సమగ్రతకు తగిన ప్రాధాన్యం ఇస్తుంది.
theological_decisions:
- issue: εὐχαριστήσας లో సంభావ్య ప్రభుభోజన సంబంధిత భావం
  choice: కృతజ్ఞతలు చెల్లించిన తరువాత
  alternative: దీవించిన తరువాత; కృతజ్ఞతార్పణ చేసిన తరువాత
  rationale: εὐχαριστέω యొక్క ప్రత్యక్ష భావం కృతజ్ఞతలు తెలియజేయడం. తరువాతి సంఘ ఆరాధనా పారిభాషికతను చేర్చకుండా మూలపాఠ భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని చర్యల క్రమాన్ని నిలుపుతూ, అనవసరమైన ఆరాధనా పారిభాషిక పదాలను నివారించాం.
