  text: Then they laid hands on him and seized him[a][b].
translation:
  language: te
  text: అప్పుడు వారు ఆయన మీద చేతులు వేసి, ఆయనను పట్టుకున్నారు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనపై తమ చేతులు వేశారు.’ ఈ గ్రీకు నుడికారం ఒకరిని పట్టుకోవడాన్ని, తరచుగా అరెస్టు చేయడానికి అదుపులోకి తీసుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆయనను అరెస్టు చేశారు.’
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: అప్పుడు వారు
  rationale: δέ ఇక్కడ స్వల్ప కథన పురోగతిని సూచిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన ప్రవాహాన్ని ఇస్తుంది, బలమైన వ్యతిరేక భావాన్ని మోపదు.
- source_word: ἐπέβαλαν τὰς χεῖρας αὐτῷ
  choice: ఆయన మీద చేతులు వేసి
  rationale: ఇది ఒకరిని అదుపులోకి తీసుకోవడానికి పట్టుకోవడం అనే శత్రుత్వపూర్వక సందర్భంలోని గ్రీకు నుడికారం. తెలుగు నుడికార రూపాన్ని నిలుపుతూ, తర్వాతి క్రియతో ఉన్న భేదాన్ని కాపాడుతుంది.
- source_word: ἐκράτησαν αὐτόν
  choice: ఆయనను పట్టుకున్నారు
  rationale: κρατέω ఇక్కడ బలవంతంగా పట్టుకొని అదుపులో ఉంచడాన్ని సూచిస్తుంది. ‘పట్టుకున్నారు’ గ్రీకు పదానికి సన్నిహితంగా ఉండి, సందర్భంలోని అరెస్టు భావాన్ని ప్రత్యేకంగా న్యాయపరమైన పదంతో పరిమితం చేయదు.
