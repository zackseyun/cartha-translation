  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὁ Πέτρος ἀπὸ μακρόθεν ἠκολούθησεν αὐτῷ ἕως ἔσω εἰς τὴν αὐλὴν τοῦ ἀρχιερέως καὶ ἦν συγκαθήμενος μετὰ τῶν ὑπηρετῶν καὶ θερμαινόμενος πρὸς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/054.yaml
  text: And Peter followed him from a distance[a], as far as inside the courtyard of the high priest. He was sitting with the officers and warming himself by the fire.
translation:
  language: te
  text: పేతురు దూరం నుంచి ఆయనను వెంబడించి, ప్రధాన యాజకుని ప్రాంగణం లోపలివరకు వెళ్లాడు. అక్కడ అతడు పరిచారకులతో కలిసి కూర్చొని, మంట దగ్గర[a] చలి కాచుకుంటూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘వెలుగు దగ్గర’ లేదా ‘వెలుగు వైపు’; ఇక్కడ ప్రాంగణంలోని మంట వెలుగు ఉద్దేశమై ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ μακρόθεν
  choice: దూరం నుంచే
  rationale: పేతురు కొంత దూరాన్ని పాటిస్తూ వెంబడించిన spatial భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἠκολούθησεν αὐτῷ
  choice: ఆయనను వెంబడిస్తూ ... వెళ్లాడు
  rationale: గ్రీకు కథనంలోని అనుసరించి వెళ్లిన చర్యను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; సర్వనామం గౌరవప్రయోగంలో ఉంది.
- source_word: ἕως ἔσω εἰς τὴν αὐλήν
  choice: ప్రాంగణం లోపలి వరకు వెళ్లాడు
  rationale: ἕως ἔσω εἰς సూచించే లోపలివరకు చేరిన భావాన్ని నిలుపుతుంది; ఇంటి లోపలికి వెళ్లాడని అతిగా చెప్పదు.
- source_word: ἀρχιερέως
  choice: ప్రధాన యాజకుని
  rationale: సువార్తల సందర్భంలో ἀρχιερεύςకు స్పష్టమైన, ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: ἦν συγκαθήμενος μετὰ τῶν ὑπηρετῶν
  choice: పరిచారకులతో కలిసి కూర్చుని ... ఉన్నాడు
  rationale: కొనసాగుతున్న నేపథ్య దృశ్యాన్ని, σύν/μετάల కలిసి ఉండే భావాన్ని కాపాడుతుంది. ὑπηρέταιను గృహ బానిసలుగా లేదా తప్పనిసరిగా సాయుధ భటులుగా నిర్దిష్టం చేయకుండా అధికారిక సేవకుల భావంలో ‘పరిచారకులు’గా అనువదించింది.
- source_word: θερμαινόμενος
  choice: చలి కాచుకుంటూ
  rationale: మంట దగ్గర తనను తాను వెచ్చబరచుకుంటున్న చర్యకు సహజమైన తెలుగు నుడికారం.
- source_word: πρὸς τὸ φῶς
  choice: మంట దగ్గర
  rationale: φῶς అక్షరార్థంగా ‘వెలుగు’ అయినప్పటికీ, చలి కాచుకునే సందర్భంలో అది మంట వెలుగును సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన సందర్భార్థాన్ని ఇచ్చి, అక్షరార్థాన్ని పాదటిప్పణిలో నిలిపింది.
