  terminology: ‘మనుష్య కుమారుడు,’ ‘పాపులు,’ and ‘అప్పగించబడుతున్నాడు’ are suitable and do not narrow the Greek. The genuine ambiguity of the opening clause is appropriately retained in footnote a.
