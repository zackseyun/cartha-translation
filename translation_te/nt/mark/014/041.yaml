id: MRK.14.41
reference: Mark 14:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔρχεται τὸ τρίτον καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἀπέχει· ἦλθεν ἡ ὥρα, ἰδοὺ παραδίδοται ὁ υἱὸς τοῦ ἀνθρώπου εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/041.yaml
  text: And he comes the third time and says to them[a], “Are you still sleeping and resting? It is enough; the hour has come. Look[c][b], the Son of Man is being handed over into the hands of sinners.”
translation:
  language: te
  text: ఆయన మూడోసారి వచ్చి వారితో, “ఇంకా నిద్రపోతూ విశ్రాంతి తీసుకుంటున్నారా?[a] చాలు;[b] ఆ ఘడియ వచ్చింది. ఇదిగో, మనుష్య కుమారుడు పాపుల చేతుల్లోకి అప్పగించబడుతున్నాడు” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇక నిద్రపోయి విశ్రాంతి తీసుకోండి.” గ్రీకు మాటలను వ్యంగ్య అనుమతి లేదా ఆజ్ఞగా గానీ, గద్దింపుతో కూడిన ప్రశ్నగా గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: '‘చాలు’ అని అనువదించిన గ్రీకు పదబంధం క్లిష్టమైనది. ఇతర ప్రతిపాదనలు: “చాలు!” లేదా, ఇక్కడ తక్కువ సంభావ్యంగా, “చెల్లింపు పూర్తిగా అందింది.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται τὸ τρίτον
  choice: మూడోసారి వచ్చి
  rationale: చారిత్రక వర్తమానాన్ని తెలుగు కథనశైలిలో సహజమైన భూతకాలంతో వ్యక్తం చేస్తూ, τὸ τρίτον యొక్క నిర్దిష్ట భావాన్ని ‘మూడోసారి’గా నిలిపింది.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: ఇంకా నిద్రపోతూ విశ్రాంతి తీసుకుంటున్నారా?
  rationale: సందర్భంలో ఇది గద్దింపుతో కూడిన అలంకారప్రశ్నగా సహజంగా వినిపిస్తుంది. అయితే గ్రీకు రూపం వ్యంగ్య అనుమతి లేదా ఆజ్ఞగా కూడా అర్థమవుతుంది; ఆ ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
- source_word: ἀπέχει
  choice: చాలు
  rationale: సందర్భంలోని నిర్ణాయక మలుపును సంక్షిప్తంగా తెలిపే సహజ తెలుగు. ఈ క్లిష్ట పదబంధానికి ఇతర ప్రతిపాదనలు ఉన్నందున పాదటిప్పణి ఇచ్చింది.
- source_word: ἦλθεν ἡ ὥρα
  choice: ఆ సమయం వచ్చింది
  rationale: ὥρα ఇక్కడ నియమిత క్షణాన్ని సూచిస్తుంది. తెలుగులో ‘ఆ సమయం’ సహజంగా ఉండి, నిర్దిష్ట నిర్ణాయక ఘడియ భావాన్ని నిలుపుతుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: దృష్టిని ఆకర్షించే గ్రీకు సూచనార్థక పదానికి సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: παραδίδοται
  choice: అప్పగించబడుతున్నాడు
  rationale: ‘ద్రోహం చేయబడుతున్నాడు’ అని అర్థాన్ని యూదా చర్యకే పరిమితం చేయకుండా, అప్పగింపు ప్రక్రియను మరియు కర్మణి రూపాన్ని నిలుపుతుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: ఈ స్వీయ బిరుదుకు స్థిరపడిన తెలుగు రూపాన్ని నిలుపుతుంది.
- source_word: εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν
  choice: పాపుల చేతుల్లోకి
  rationale: ఇతరుల అధికారంలోకి అప్పగించబడే స్పష్టమైన గ్రీకు రూపకాన్ని తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: Καθεύδετε ... καὶ ἀναπαύεσθε యొక్క వాక్యబలం
  choice: 'గద్దింపుతో కూడిన ప్రశ్న: ‘ఇంకా నిద్రపోతూ విశ్రాంతి తీసుకుంటున్నారా?’'
  alternative: 'వ్యంగ్య అనుమతి లేదా ఆజ్ఞ: ‘ఇక నిద్రపోయి విశ్రాంతి తీసుకోండి.’'
  rationale: ప్రాచీన గ్రీకు ప్రతులలో విరామచిహ్నాలు ఈ సమస్యను నిర్ణయించవు. సందర్భంలో ప్రశ్న సహజంగా ఉన్నా, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచి అసలు సందిగ్ధతను కాపాడింది.
- issue: ἀπέχει యొక్క అర్థం
  choice: చాలు
  alternative: ‘ఇంతటితో సరిపోతుంది’ లేదా, ఇక్కడ తక్కువ సంభావ్యంగా, వాణిజ్యార్థంలో ‘చెల్లింపు పూర్తిగా అందింది’
  rationale: తక్షణ కథన మలుపుకు ‘చాలు’ సరిపోతుంది; ఊహాత్మక సాంకేతిక లేదా సిద్ధాంతార్థాన్ని రుద్దదు.
- issue: παραδίδοται యొక్క అనువాదం
  choice: అప్పగించబడుతున్నాడు
  alternative: ద్రోహం చేయబడుతున్నాడు
  rationale: ఈ క్రియ యొక్క విస్తృత కథన, వేదాంత పరిధిని నిలుపుతూ, చర్యను యూదా ద్రోహానికే ముందుగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘మనుష్య కుమారుడు,’ ‘పాపులు,’ ‘అప్పగించబడుతున్నాడు’ వంటి ప్రధాన బైబిలు పదాలను స్పష్టంగా ఉంచింది; గ్రీకు వాక్యంలోని నిజమైన సందిగ్ధతను పాదటిప్పణిలో సంరక్షించింది.
