id: MRK.14.27
reference: Mark 14:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ λέγει αὐτοῖς ὁ Ἰησοῦς ὅτι Πάντες ⸀σκανδαλισθήσεσθε, ὅτι γέγραπται· Πατάξω τὸν ποιμένα, καὶ ⸂τὰ πρόβατα διασκορπισθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/027.yaml
  text: 'And Jesus says to them[a], “You will all fall away, because it is written: ‘I will strike the shepherd, and the sheep will be scattered.’”'
translation:
  language: te
  text: 'యేసు వారితో ఇలా అన్నాడు: “మీరందరూ తడబడతారు[a], ఎందుకంటే ఇలా వ్రాయబడి ఉంది: ‘నేను కాపరిని కొడతాను, గొర్రెలు చెదరిపోతాయి.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరందరూ తప్పిపోతారు” లేదా “మీరందరూ అభ్యంతరపడతారు”; ఇంకా అక్షరార్థంగా, “మీరందరూ తడబడేలా చేయబడతారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, ఆధునిక తెలుగు కథన శైలిలో భూతకాల రూపం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: σκανδαλισθήσεσθε
  choice: తడబడతారు
  rationale: ఈ క్రియలోని రూపక భావాన్ని, అలాగే శిష్యులు ఒత్తిడిలో విఫలమై చెదరిపోబోతున్న సందర్భాన్ని కాపాడుతుంది; పూర్తిగా విశ్వాసత్యాగం చేశారని అతిగా నిర్ధారించదు.
- source_word: γέγραπται
  choice: రాసి ఉంది
  rationale: లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే గ్రీకు పరిపూర్ణ కర్మణి రూపంలోని కొనసాగుతున్న ప్రామాణికతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: Πατάξω
  choice: నేను ... కొడతాను
  rationale: క్రియ బలాన్ని సరళమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ποιμένα
  choice: కాపరిని
  rationale: ప్రవచనంలోని మంద-కాపరి రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: τὰ πρόβατα
  choice: గొర్రెలు
  rationale: మందకు సంబంధించిన మూల రూపకాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: διασκορπισθήσονται
  choice: చెదరిపోతాయి
  rationale: కాపరి కొట్టబడిన తర్వాత మంద విడిపోవడాన్ని సూచించే కర్మణి భావాన్ని సహజమైన తెలుగు వ్యక్తీకరణతో అందిస్తుంది.
theological_decisions:
- issue: σκανδαλισθήσεσθε అనే పదం శిష్యుల ప్రతిస్పందనను ఎలా సూచిస్తోంది
  choice: తడబడతారు
  alternative: వెనక్కి తగ్గిపోతారు; తడబడేలా చేయబడతారు
  rationale: మూలపదంలోని ‘తడబడడం’ అనే రూపకాన్ని ఉంచి, సందర్భంలోని విఫలం మరియు చెదరిపోవడాన్ని పాఠకుడు గ్రహించేలా చేస్తుంది. ‘విశ్వాసాన్ని పూర్తిగా విడిచిపెడతారు’ అని అనువదించడం సందర్భానికి మించిన తాత్త్విక నిర్ణయం అవుతుంది; కర్మణి ఛాయను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని మంద-కాపరి రూపకం మరియు σκανδαλισθήσεσθε పదంలోని ఉద్దేశపూర్వక అస్పష్టత నిలుపబడ్డాయి.
