revisions:
- from: 'అప్పుడు యేసు వారితో ఇలా అన్నాడు: “మీరందరూ తడబడతారు[a]. ఎందుకంటే, ‘నేను కాపరిని కొడతాను; గొర్రెలు చెదరిపోతాయి’ అని రాసి ఉంది.”'
  to: 'యేసు వారితో ఇలా అన్నాడు: “మీరందరూ తడబడతారు[a], ఎందుకంటే ఇలా వ్రాయబడి ఉంది: ‘నేను కాపరిని కొడతాను, గొర్రెలు చెదరిపోతాయి.’”'
  rationale: The revision removes an unsupported temporal addition, more closely represents the Greek Scripture-citation formula, and improves the lexical-alternative note while retaining the source text’s ambiguity about the disciples’ failure.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:14:57Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prediction, the Scripture formula, and the shepherd/sheep imagery. However, the initial “అప్పుడు” adds a temporal inference not expressed by Καὶ, and “రాసి ఉంది” does not reflect as well the passive, standing-scripture force of γέγραπται.
  naturalness: The Telugu is generally clear and modern. Removing the unnecessary temporal adverb and using the conventional but still natural Scripture-introduction “వ్రాయబడి ఉంది” improves flow and register.
  terminology: “తడబడతారు” appropriately preserves the ambiguity of σκανδαλισθήσεσθε without asserting permanent apostasy. “కాపరి,” “గొర్రెలు,” and “చెదరిపోతాయి” are accurate and natural. The footnote is refined to give meaningful lexical alternatives and retain the passive nuance.
  issues:
  - severity: low
    issue: “అప్పుడు” has been added at the beginning.
    rationale: Καὶ here links the narrative but does not explicitly mean “then.” Telugu can begin directly with the subject without losing the connection.
  - severity: low
    issue: “రాసి ఉంది” weakens the passive/formulaic nuance of γέγραπται.
    rationale: “వ్రాయబడి ఉంది” is natural modern Telugu for a Scripture citation and better represents the Greek perfect passive formula.
  - severity: low
    issue: The footnote alternative “వెనక్కి తగ్గిపోతారు” is narrower and less direct than the lexical range of σκανδαλίζω.
    rationale: “తప్పిపోతారు” and “అభ్యంతరపడతారు” better present viable contextual and lexical alternatives, while the literal passive sense remains noted.
  revised_text: 'యేసు వారితో ఇలా అన్నాడు: “మీరందరూ తడబడతారు[a], ఎందుకంటే ఇలా వ్రాయబడి ఉంది: ‘నేను కాపరిని కొడతాను, గొర్రెలు చెదరిపోతాయి.’”'
  revised_footnotes:
  - marker: a
    text: లేదా, “మీరందరూ తప్పిపోతారు” లేదా “మీరందరూ అభ్యంతరపడతారు”; ఇంకా అక్షరార్థంగా, “మీరందరూ తడబడేలా చేయబడతారు.”
    reason: lexical_alternative
  revision_rationale: The revision removes an unsupported temporal addition, more closely represents the Greek Scripture-citation formula, and improves the lexical-alternative note while retaining the source text’s ambiguity about the disciples’ failure.
