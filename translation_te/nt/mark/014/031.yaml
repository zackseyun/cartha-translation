id: MRK.14.31
reference: Mark 14:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ⸂ἐκπερισσῶς ἐλάλει⸃· Ἐὰν ⸂δέῃ με⸃ συναποθανεῖν σοι, οὐ μή σε ⸀ἀπαρνήσομαι. ὡσαύτως δὲ καὶ πάντες ἔλεγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/031.yaml
  text: But he kept insisting all the more[a], “If I must die together with you[c][b], I will certainly not deny you.” And they all were saying the same thing.
translation:
  language: te
  text: 'అయితే అతడు మరింత బలంగా చెబుతూనే ఉన్నాడు[a]: “నేను నీతో కలిసి చనిపోవలసి వచ్చినా[b], నిన్ను అసలు నిరాకరించను[c].” అందరూ కూడా అదే మాట చెబుతూ ఉన్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు అత్యంత ఉద్ఘాటనతో మాట్లాడుతూ ఉన్నాడు.”
    reason: lexical_alternative
  - marker: b
    text: మూలంలో అక్షరార్థంగా, “నీతో కలిసి చనిపోవడం నాకు అవసరమైనా.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “నిన్ను ఎన్నటికీ నిరాకరించను.” గ్రీకులో బలమైన నిరాకరణ వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπερισσῶς
  choice: మరింత గట్టిగా
  rationale: ఈ క్రియావిశేషణం పేతురు మాటల తీవ్రత పెరిగిందని సూచిస్తుంది. ‘మరింత గట్టిగా’ అనేది ఆ తీవ్రతనూ, ముందటి మాటకంటే అధికమైన పట్టుదలనూ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐλάλει
  choice: చెబుతూనే ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగిన లేదా పదేపదే జరిగిన మాటను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ కొనసాగింపును నిలుపుతుంది.
- source_word: Ἐὰν δέῃ με
  choice: నేను ... చనిపోవలసి వచ్చినా
  rationale: δέῃ కేవలం సంభావ్యతను కాక అవసరాన్ని సూచిస్తుంది. షరతుతో కూడిన ఈ తెలుగు నిర్మాణం ఆ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: συναποθανεῖν σοι
  choice: నీతో కలిసి చనిపోవలసి
  rationale: συν- ఉపసర్గలోని ‘కలిసి’ అనే భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: οὐ μή
  choice: అసలు ... నిరాకరించను
  rationale: οὐ μή అనే బలమైన నిరాకరణను ఆధునిక తెలుగులో సహజంగా, ఉద్ఘాటనతో వ్యక్తపరుస్తుంది.
- source_word: ἀπαρνήσομαι
  choice: నిరాకరించను
  rationale: ఈ కథన సందర్భంలో యేసుతో తన సంబంధాన్ని కాదనడాన్ని సూచించే స్పష్టమైన, గౌరవప్రదమైన పదప్రయోగం.
- source_word: ὡσαύτως
  choice: అదే మాట
  rationale: ఇక్కడ ఇతర శిష్యులు పేతురు చెప్పిన విషయాన్నే చెప్పారని సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: πάντες
  choice: మిగతా వారందరూ
  rationale: గ్రీకు వాక్యంలో ‘అందరూ’ అని ఉన్నప్పటికీ, పేతురు తరువాత ప్రస్తావించబడిన సమూహం ఇతర శిష్యులని సహజ తెలుగులో స్పష్టం చేయడానికి ‘మిగతా’ చేర్చబడింది.
- source_word: ἔλεγον
  choice: చెబుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న లేదా సమూహంగా పలుకుతున్న క్రియాభావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పేతురు చేసిన ప్రతిజ్ఞలోని బలమైన నిరాకరణ
  choice: “నిన్ను అసలు నిరాకరించను”
  alternative: “నిన్ను ఎన్నటికీ నిరాకరించను”
  rationale: οὐ μή తో కూడిన భవిష్యత్ క్రియ బలమైన నిరాకరణను తెలియజేస్తుంది. ‘అసలు ... నిరాకరించను’ ఆ బలాన్ని నిలుపుతూ, పేతురు ధీమాకు మరియు తరువాతి వైఫల్యానికి మధ్య ఉన్న కథన ఉద్వేగాన్ని వ్యాఖ్యానంతో పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గౌరవప్రదమైన కథన శైలి. పేతురు మాటల కొనసాగింపు, పెరిగిన తీవ్రత, బలమైన ప్రతిజ్ఞ స్పష్టంగా నిలుపబడ్డాయి.
