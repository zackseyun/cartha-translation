  text: Καὶ ἔρχονται εἰς χωρίον οὗ τὸ ὄνομα Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς αὐτοῦ· Καθίσατε ὧδε ἕως προσεύξωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/032.yaml
  text: And they came to a place whose name was Gethsemane[a], and he says to his disciples, “Sit here until I pray.”
translation:
  language: te
  text: 'వారు గెత్సేమనే అనే చోటికి వచ్చారు. ఆయన తన శిష్యులతో ఇలా అన్నాడు: “నేను ప్రార్థించే వరకు ఇక్కడ కూర్చోండి.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “వారు ... చోటికి వస్తారు; ఆయన తన శిష్యులతో ఇలా అంటాడు.” మార్కు సజీవమైన కథనశైలిలో వర్తమాన కాలరూపాలను ఉపయోగించాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: వచ్చారు
  rationale: గ్రీకులో ఇది కథన వర్తమాన కాలరూపం. సహజమైన తెలుగు కథనశైలిలో భూతకాలం సందర్భానికి తగినది; మూలంలోని సజీవ వర్తమానాన్ని పాదసూచికలో సూచించాం.
- source_word: χωρίον
  choice: చోటు
  rationale: ఈ పదం స్థలం, భూభాగం లేదా ఆస్తిని సూచించగలదు. సందర్భం నిర్దిష్టంగా తోట లేదా పొలం అని చెప్పనందున విస్తృతమైన ‘చోటు’ను ఎంచుకున్నాం.
- source_word: οὗ τὸ ὄνομα Γεθσημανί
  choice: గెత్సేమనే అనే
  rationale: పేరును లిప్యంతరీకరిస్తూ, గ్రీకు నిర్మాణ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: λέγει
  choice: అన్నాడు
  rationale: ఇదీ గ్రీకులో కథన వర్తమానం. తెలుగు కథన ప్రవాహంలో ‘అన్నాడు’ సహజంగా ఉండి, కాలరూపంలోని మూలభేదాన్ని పాదసూచిక సంరక్షిస్తుంది.
- source_word: μαθηταῖς
  choice: శిష్యులతో
  rationale: బోధకుడు–శిష్యుడు సంబంధాన్ని ఖచ్చితంగా తెలిపే, సువార్తల్లో స్థిరపడిన సహజ పదం.
- source_word: Καθίσατε
  choice: కూర్చోండి
  rationale: ఆజ్ఞను గౌరవబహువచనంలో సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: ὧδε
  choice: ఇక్కడ
  rationale: స్థలాన్ని నేరుగా సూచించే సహజ తెలుగు సమానార్థకం.
- source_word: ἕως προσεύξωμαι
  choice: నేను ప్రార్థించే వరకు
  rationale: ἕως మరియు aorist subjunctive సూచించే కాలపరిమితిని నిలుపుతుంది; ‘నేను ప్రార్థిస్తుండగా’ అని అనువదిస్తే ముగింపు హద్దు భావం వ్యవధి భావంగా మారుతుంది.
