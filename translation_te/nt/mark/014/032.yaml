translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. గ్రీకులోని కథన వర్తమాన కాలాన్ని ప్రధాన వాక్యంలో సహజ తెలుగు భూతకాలంతో ఇచ్చి, దాని సజీవతను పాదసూచికలో భద్రపరిచాం.
