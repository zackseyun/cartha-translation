language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Καὶ Ἰούδας ⸂Ἰσκαριὼθ ὁ⸃ εἷς τῶν δώδεκα ἀπῆλθεν πρὸς τοὺς ἀρχιερεῖς ἵνα αὐτὸν ⸂παραδοῖ αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/010.yaml
  text: And Judas Iscariot[a], one of the Twelve, went to the chief priests in order to hand him over to them.
translation:
  language: te
  text: పన్నెండుగురిలో ఒకడైన యూదా ఇస్కరియోతు, ఆయనను ప్రధాన యాజకులకు అప్పగించడానికి[a] వారి దగ్గరకు వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనను వారికి ద్రోహం చేసి అప్పగించడానికి.” ఇక్కడి గ్రీకు క్రియకు “అప్పగించు” అనే అర్థం ఉంది; యూదా విషయంలో ఈ అప్పగింత ద్రోహకార్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: (తెలుగులో ప్రత్యేకంగా అనువదించలేదు)
  rationale: ఈ వాక్యం ముందటి కథనంతో అనుసంధానమై ఉందని తెలుగు కథన ప్రవాహమే తెలియజేస్తుంది; ‘మరియు’ అని పెట్టడం ఆధునిక తెలుగులో కృత్రిమంగా ఉంటుంది.
- source_word: Ἰούδας Ἰσκαριὼθ
  choice: యూదా ఇస్కరియోతు
  rationale: వ్యక్తి పేరు, బిరుదు తెలుగులో స్థిరపడిన లిప్యంతరీకరణ ప్రకారం ఇవ్వబడ్డాయి.
- source_word: ὁ εἷς τῶν δώδεκα
  choice: పన్నెండుమందిలో ఒకడైన
  rationale: ఇది యేసు ఏర్పరచుకున్న గుర్తింపుపొందిన పన్నెండుమంది శిష్యుల వర్గాన్ని సూచిస్తుంది; సహజమైన తెలుగులో ఆ సంబంధాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: ἀπῆλθεν
  choice: వెళ్లాడు
  rationale: సరళమైన కథన భూతకాల క్రియను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: ప్రధాన యాజకుల దగ్గరకు
  rationale: బహువచన పదం యెరూషలేములోని యాజక నాయకత్వాన్ని సూచిస్తుంది; ‘ప్రధాన యాజకులు’ ఆ సంస్థాగత భావాన్ని కాపాడుతుంది.
- source_word: ἵνα
  choice: అప్పగించడానికి
  rationale: క్రియార్థక రూపం ఉద్దేశాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: παραδοῖ
  choice: అప్పగించడానికి
  rationale: παραδίδωμι యొక్క విస్తృతమైన ‘చేతికి అప్పగించు’ భావాన్ని కాపాడుతుంది; ప్రధాన పాఠ్యంలోనే ‘ద్రోహం చేయు’ అనే నైతిక వ్యాఖ్యానానికి కుదించదు.
- source_word: αὐτὸν ... αὐτοῖς
  choice: ఆయనను ... వారికి
  rationale: ‘ఆయనను’ యేసును సూచిస్తుంది; తెలుగులో గౌరవప్రయోగాన్ని పాటిస్తూ వ్యక్తిని, స్వీకర్తలను స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: ద్రోహ సందర్భంలో παραδοῖ అనువాదం
  choice: ఆయనను ... అప్పగించడానికి
  alternative: ఆయనకు ద్రోహం చేసి వారికి పట్టించడానికి
  rationale: యూదా చేసిన పని ద్రోహమే అయినా, గ్రీకు క్రియకు ‘అప్పగించు’ అనే విస్తృత భావం ఉంది; ఇది శ్రమల కథనమంతటా ప్రతిధ్వనిస్తుంది. ప్రధాన పాఠ్యంలో ‘అప్పగించు’ అని ఉంచడం పదార్థాన్నీ వేదాంతపరమైన ఉద్వేగాన్నీ కాపాడుతుంది; ద్రోహ భావాన్ని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ప్రధాన యాజకులు’ అనే స్థిరమైన బైబిలు పదప్రయోగాన్ని ఉంచి, మిగతా వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సులభంగా తీర్చిదిద్దాం.
