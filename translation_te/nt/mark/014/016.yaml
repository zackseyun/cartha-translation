translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని వరుస క్రియలను సహజమైన తెలుగు వాక్య నిర్మాణంలో ఉంచి, τὸ πάσχα లోని నిజమైన అర్థసంభావ్యతను పాదసూచికలో నిలిపాం.
