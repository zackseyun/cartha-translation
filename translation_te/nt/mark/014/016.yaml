  text: καὶ ἐξῆλθον οἱ ⸀μαθηταὶ καὶ ἦλθον εἰς τὴν πόλιν καὶ εὗρον καθὼς εἶπεν αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/016.yaml
  text: And the disciples went out and came into the city[a], and found it just as he had told them, and they prepared the Passover.
translation:
  language: te
  text: శిష్యులు బయలుదేరి నగరంలోకి వచ్చారు. ఆయన వారికి చెప్పినట్లే వారు కనుగొన్నారు; పస్కాను[a] సిద్ధం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పస్కా భోజనాన్ని.” గ్రీకు పదం ఈ సందర్భంలో పస్కా పండుగను లేదా సిద్ధం చేస్తున్న పస్కా భోజనాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: బయలుదేరి
  rationale: మునుపటి స్థలం నుండి వెళ్లడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μαθηταὶ
  choice: శిష్యులు
  rationale: యేసును అనుసరిస్తూ ఆయన వద్ద నేర్చుకునేవారికి సువార్తల్లో స్థిరపడిన సహజమైన పదం.
- source_word: ἦλθον εἰς τὴν πόλιν
  choice: నగరంలోకి వచ్చారు
  rationale: εἰς సూచించే లోనికి ప్రవేశాన్ని కాపాడుతూ, ἦλθονను సహజంగా అనువదిస్తుంది.
- source_word: πόλιν
  choice: నగరం
  rationale: యెరూషలేమును సూచించే ఈ సందర్భంలో πόλιςకు నేరమైన, తగిన సమానార్థకం.
- source_word: εὗρον
  choice: కనుగొన్నారు
  rationale: గ్రీకులో కర్మ స్పష్టంగా లేకపోవడాన్ని తెలుగులోనూ అనవసరంగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: καθὼς εἶπεν αὐτοῖς
  choice: ఆయన తమతో చెప్పినట్లే
  rationale: ముందుగా యేసు చెప్పినదానికీ వారు చూసిన పరిస్థితికీ ఉన్న ఖచ్చితమైన అనురూపతను తెలియజేస్తుంది.
- source_word: ἡτοίμασαν
  choice: సిద్ధం చేశారు
  rationale: ఏర్పాట్లు చేసి సిద్ధపరచడం అనే ἑτοιμάζω భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ πάσχα
  choice: పస్కాను
  rationale: పండుగను గానీ సందర్భానుసారంగా పస్కా భోజనాన్ని గానీ సూచించగల మూలపదపు విస్తృతిని కాపాడుతుంది.
