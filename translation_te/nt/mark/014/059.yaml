translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయసందర్భ భాషను వాడాం. ἴση యొక్క పదశః భావాన్ని పాదటిప్పణిలో ఉంచి, ప్రధాన పాఠ్యంలో సందర్భార్థాన్ని స్పష్టంగా తెలిపాం.
