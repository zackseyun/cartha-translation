revisions:
- from: అయినా, ఈ విషయంలో కూడా వారి సాక్ష్యం ఒకదానితో ఒకటి సరిపోలలేదు.[a]
  to: ఈ విధంగా కూడా వారి సాక్ష్యాలు పరస్పరం సరిపోలలేదు.[a]
  rationale: The revision removes the unsupported adversative force, renders οὕτως as “ఈ విధంగా,” and uses idiomatic plural wording for mutually inconsistent witness testimony. The note preserves the contextual and literal alternatives for ἴση.
  reviewer_model: gpt-5.6-terra
