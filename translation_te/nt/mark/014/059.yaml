translation:
  language: te
  text: ఈ విధంగా కూడా వారి సాక్ష్యాలు పరస్పరం సరిపోలలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి సాక్ష్యాలు ఏకీభవించలేదు”; పదశః, “వారి సాక్ష్యం సమానమైనది కాదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: అయినా
  rationale: ముందటి వచనంలోని ఆరోపణను ప్రస్తుత విరుద్ధ ఫలితంతో అనుసంధానించే సందర్భానుకూల సంధిగా అనువదించబడింది; καὶ యొక్క సాధారణ అనుసంధాన బలాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: οὐδὲ
  choice: కూడా ... లేదు
  rationale: ఇంత చేసినప్పటికీ సాక్ష్యం సరిపోలలేదనే బలమైన నిరాకరణను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὕτως
  choice: ఈ విషయంలో
  rationale: వెంటనే ముందున్న సాక్ష్య ప్రకటన విధానాన్ని వెనక్కి సూచిస్తుంది; సందర్భంలో 'ఈ విధంగా' అనే ప్రత్యామ్నాయంకంటే ఇది సహజంగా ఉంది.
- source_word: ἴση
  choice: ఒకదానితో ఒకటి సరిపోలలేదు
  rationale: పదశః 'సమానంగా' అయినా, న్యాయసాక్ష్య సందర్భంలో వాంగ్మూలాలు పరస్పరం ఏకీభవించలేదనే భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: ἦν
  choice: లేదు
  rationale: εἰμί యొక్క భూతకాల రూపం ప్రతికూల వాక్యనిర్మాణంలో తెలుగులో సహజంగా 'లేదు'గా వ్యక్తమవుతుంది.
- source_word: ἡ μαρτυρία
  choice: సాక్ష్యం
  rationale: న్యాయ విచారణ సందర్భంలోని వాంగ్మూలం లేదా సాక్ష్య ప్రకటనను సూచించే గౌరవప్రదమైన సాధారణ తెలుగు పదం.
- source_word: αὐτῶν
  choice: వారి
  rationale: బహువచన షష్ఠీ సంబంధాన్ని సహజమైన తెలుగు స్వామ్యరూపంతో అందిస్తుంది.
