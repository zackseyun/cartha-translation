source:
  edition: SBLGNT
  text: ἠκούσατε τῆς βλασφημίας· τί ὑμῖν φαίνεται; οἱ δὲ πάντες κατέκριναν αὐτὸν ⸂ἔνοχον εἶναι⸃ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/064.yaml
  text: You have heard the blasphemy[b][a]. What does it seem to you? And they all condemned him as deserving death.
translation:
  language: te
  text: “మీరు ఈ దైవదూషణ విన్నారు. మీకు ఏమనిపిస్తోంది?[a]” వారందరూ ఆయనను మరణశిక్షకు పాత్రుడని తీర్పు చెప్పారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత భావానువాదంగా, “మీ అభిప్రాయం ఏమిటి?” లేదా “మీ తీర్పేమిటి?”
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఆయన మరణానికి అర్హుడని తీర్పు చెప్పారు,” “ఆయన మరణశిక్షకు బాధ్యుడని నిర్ధారించారు,” లేదా “ఆయన మరణదండనకు లోబడతాడని తీర్పు చెప్పారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσατε
  choice: మీరు ... విన్నారు
  rationale: గ్రీకు భూతకాల క్రియ ఇక్కడ వారు అప్పుడే విన్న మాటను సూచిస్తోంది; ఆధునిక తెలుగులో ‘విన్నారు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: τῆς βλασφημίας
  choice: ఈ దైవదూషణ
  rationale: నిర్దిష్టంగా అప్పుడే పలికినదానిపై మతపరమైన న్యాయారోపణను ‘దైవదూషణ’ నిలుపుతుంది. తెలుగు సందర్భంలో నిర్దిష్టతను సహజంగా తెలియజేయడానికి ‘ఈ’ వాడబడింది.
- source_word: τί ὑμῖν φαίνεται
  choice: మీకు ఏమనిపిస్తోంది?
  rationale: ఈ పదబంధం వారి అభిప్రాయాన్ని లేదా తీర్పును అడుగుతుంది. ఎంపిక చేసిన రూపం గ్రీకు వ్యక్తీకరణకు దగ్గరగా ఉండి ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: πάντες
  choice: వారందరూ
  rationale: πάντες నొక్కిచెప్పే ఏకగ్రీవతను స్పష్టంగా నిలుపుతుంది.
- source_word: κατέκριναν
  choice: తీర్పు చెప్పారు
  rationale: κατακρίνω న్యాయపరంగా దోషిగా నిర్ధారించడం లేదా ప్రతికూల తీర్పు ఇవ్వడం. తరువాతి మరణశిక్షార్హతతో కలిపి ఈ తెలుగు రూపం సహజమైన న్యాయార్థాన్ని ఇస్తుంది.
- source_word: ἔνοχον εἶναι θανάτου
  choice: మరణశిక్షకు పాత్రుడని
  rationale: ఈ నిర్మాణం మరణానికి బాధ్యుడు, మరణదండనకు అర్హుడు అనే న్యాయార్థాన్ని కలిగి ఉంది. ‘మరణశిక్షకు పాత్రుడు’ ఆధునిక పాఠకునికి ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: విచారణ సందర్భంలో βλασφημία అనే ఆరోపణ
  choice: దైవదూషణ
  alternative: దేవుణ్ణి దూషించే మాట
  rationale: ఇది మహాసభ చేసిన ఆరోపణను తెలియజేస్తుంది; కథకుడు ఆ ఆరోపణ న్యాయమైనదని నిర్ధారిస్తున్నట్లు మార్చకుండా, దాని మతపరమైన మరియు న్యాయపరమైన గంభీరతను నిలుపుతుంది.
- issue: ἔνοχον εἶναι θανάτου లోని న్యాయపరమైన భావం
  choice: మరణశిక్షకు పాత్రుడని
  alternative: మరణానికి దోషి అని / మరణానికి అర్హుడని
  rationale: గ్రీకు వాక్యం మరణానికి అర్హత లేదా మరణదండనకు లోబడే స్థితి అనే రెండింటినీ సూచించగలదు. ప్రధాన పాఠం న్యాయసందర్భాన్ని స్పష్టం చేస్తూ, ప్రత్యామ్నాయాలను పాదసూచనలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయసభ సందర్భానికి తగిన గంభీరతతోనూ సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన వాక్యనిర్మాణంతోనూ రూపొందించబడింది. ‘దైవదూషణ’ అనే స్థిరమైన మత-న్యాయ పదం నిలుపబడింది.
