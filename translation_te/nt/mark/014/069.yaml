    reason: τοῖς παρεστῶσιν అనే పదబంధం సమీపంలో నిలబడి ఉన్నవారిని లేదా సాధారణంగా అక్కడ ఉన్నవారిని సూచించవచ్చు.
  revision_rationale: The revision changes only the Telugu addressee construction and places the speech-introducing “ఇలా” before the quotation for smoother narrative syntax. It preserves the source’s ingressive “began,” repeated action (“again”), and the nearby/present sense of τοῖς παρεστῶσιν.
