  text: καὶ ἡ παιδίσκη ἰδοῦσα αὐτὸν ⸂ἤρξατο πάλιν⸃ λέγειν τοῖς ⸀παρεστῶσιν ὅτι Οὗτος ἐξ αὐτῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/069.yaml
  text: And the servant girl[a], seeing him, began again to say to those standing nearby, “This man is one of them.”
translation:
  language: te
  text: 'ఆ పనిపిల్ల అతణ్ణి చూసి, దగ్గర నిలబడి ఉన్నవారికి మళ్లీ ఇలా చెప్పడం మొదలుపెట్టింది: “ఇతడు వారిలో ఒకడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδίσκη
  choice: పనిపిల్ల
  rationale: యువ పనివారిని లేదా దాసిని సూచించే పదం. ‘పనిపిల్ల’ ఆధునిక తెలుగులో సహజంగా ఉండి, మూలపదం తప్పనిసరిగా నిర్ధారించని బానిస హోదాను వచనంలోకి అదనంగా చేర్చదు.
- source_word: ἰδοῦσα
  choice: అతణ్ణి చూసి
  rationale: కర్త చేసిన తదనంతర చర్యకు దారితీసిన పరిస్థితిని తెలుగులో సహజమైన పూర్వకాలిక క్రియారూపంతో వ్యక్తం చేస్తుంది.
- source_word: ἤρξατο πάλιν λέγειν
  choice: మళ్లీ ... చెప్పడం మొదలుపెట్టింది
  rationale: ἤρξατο లోని ప్రారంభ భావాన్ని, πάλιν లోని పునరావృత భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: τοῖς παρεστῶσιν
  choice: దగ్గర నిలబడి ఉన్నవారితో
  rationale: అక్కడ సమీపంలో నిలిచి ఉన్న వ్యక్తులను సూచించే మూలపదంలోని స్థలభావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: Οὗτος
  choice: ఇతడు
  rationale: పేతురును నేరుగా చూపిస్తూ చెప్పిన పురుషలింగ ఏకవచన సూచనను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐξ αὐτῶν
  choice: వారిలో ఒకడు
  rationale: ఆ గుంపులో సభ్యుడని తెలిపే గ్రీకు ప్రయోగానికి స్పష్టమైన తెలుగు సమానార్థకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలి వాడబడింది. ఆరోపణలోని నేరుగా చూపించే భావం, ‘మళ్లీ’ అనే పునరావృతం, ‘చెప్పడం మొదలుపెట్టింది’ అనే ప్రారంభ భావం నిలుపబడ్డాయి.
