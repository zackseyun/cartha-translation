id: MRK.14.7
reference: Mark 14:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, καὶ ὅταν θέλητε δύνασθε ⸀αὐτοῖς εὖ ποιῆσαι, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/007.yaml
  text: For you always have the poor with you[a], and whenever you want, you are able to do good to them; but you do not always have me.
translation:
  language: te
  text: ఎందుకంటే పేదవారు ఎల్లప్పుడూ మీతో ఉంటారు; మీరు కోరినప్పుడల్లా వారికి మేలు చేయగలరు.[a] కాని నేను ఎల్లప్పుడూ మీతో ఉండను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వారికి సహాయం చేయగలరు’ అని కూడా అనువదించవచ్చు. ఇక్కడి గ్రీకు ప్రయోగం వారికి కేవలం మంచిని కోరుకోవడం కాకుండా, వారి మేలు కోసం ప్రయోజనకరంగా పనిచేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: ఎల్లప్పుడూ
  rationale: నిరంతరంగా అందుబాటులో ఉండడాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదం; వాక్యంలోని రెండు సందర్భాల్లోనూ ఉన్న వ్యతిరేకతను నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి మాటకు ఈ వాక్యం ఇచ్చే వివరణాత్మక సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: πτωχούς
  choice: పేదవారు
  rationale: పేదరికంలో ఉన్న వ్యక్తులను వర్గంగా సూచించే substantival adjective భావాన్ని గౌరవప్రదమైన సాధారణ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἔχετε μεθ’ ἑαυτῶν
  choice: మీతో ఉంటారు
  rationale: గ్రీకు వాక్యబంధంలోని సమక్షం, అందుబాటు అనే భావాన్ని తెలుగు సహజ ప్రయోగంలో అందిస్తుంది; పదశః ‘కలిగి ఉంటారు’ అనడం వ్యక్తుల విషయంలో అసహజంగా ఉంటుంది.
- source_word: ὅταν θέλητε
  choice: మీరు కోరినప్పుడల్లా
  rationale: ὅταν తో subjunctive సూచించే అనిర్దిష్ట కాల షరతును, అంటే ఏ సందర్భంలో కోరితే ఆ సందర్భంలో అనే తెరచిన భావాన్ని నిలుపుతుంది.
- source_word: δύνασθε
  choice: చేయగలరు
  rationale: సామర్థ్యం లేదా అవకాశం అనే భావాన్ని సహజమైన తెలుగు క్రియారూపంలో వ్యక్తపరుస్తుంది.
- source_word: αὐτοῖς εὖ ποιῆσαι
  choice: వారికి మేలు చేయగలరు
  rationale: εὖ ποιέω అనే ప్రయోగం వారికోసం ప్రయోజనకరంగా పనిచేయడాన్ని సూచిస్తుంది; దానిని కేవలం దానం చేయడం వంటి ఒక చర్యకే పరిమితం చేయదు.
- source_word: ἐμὲ δὲ
  choice: కాని నేను
  rationale: δέ సూచించే వ్యతిరేకతను స్పష్టంగా చూపుతూ, తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా కర్తను ముందుకు తెస్తుంది.
- source_word: οὐ πάντοτε ἔχετε
  choice: ఎల్లప్పుడూ మీతో ఉండను
  rationale: గ్రీకు వర్తమాన రూపాన్నీ, πάντοτε తో ఉన్న అందుబాటు వ్యత్యాసాన్నీ నిలుపుతుంది; వివరణాత్మకంగా భవిష్యత్ కాలానికి మార్చదు.
theological_decisions:
- issue: పేదల పట్ల శ్రద్ధను యేసు తక్కువ చేస్తున్నాడనే సంభావ్య అపార్థం
  choice: పేదలకు మేలు చేసే నిరంతర అవకాశాన్ని అంగీకరిస్తూనే, వారి నిరంతర సమక్షానికీ యేసు పరిమిత సమక్షానికీ మధ్య ఉన్న వ్యత్యాసాన్ని అనువాదం నిలుపుతుంది.
  alternative: తన పట్ల భక్తికి ప్రాధాన్యం ఇస్తూ పేదల పట్ల శ్రద్ధను యేసు తోసిపుచ్చుతున్నాడని అర్థం చేయడం.
  rationale: ‘మీరు కోరినప్పుడల్లా వారికి మేలు చేయగలరు’ అనే ఉపవాక్యం పేదలకు మేలు చేసే అవకాశాన్ని సానుకూలంగా ధృవీకరిస్తుంది. అందువల్ల అనువాదం పాఠ్యంలో లేని నిరాకరణను చేర్చకుండా కాలసంబంధమైన, సందర్భసంబంధమైన ఉద్రిక్తతను అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. వ్యక్తులను ‘కలిగి ఉండడం’ అనే పదశః నిర్మాణాన్ని నివారించి, సమక్షాన్ని సహజంగా తెలిపేందుకు ‘మీతో ఉంటారు/ఉండను’ వాడబడింది. ‘మేలు చేయడం’ విస్తృత ప్రయోజనకర చర్యను నిలుపుతుంది.
