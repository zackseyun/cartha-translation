  source_fidelity: 'The Telugu accurately renders the Greek: γάρ is represented by “ఎందుకంటే”; πάντοτε and the contrast with οὐ πάντοτε are retained; τοὺς πτωχούς ἔχετε μεθ’ ἑαυτῶν is naturally conveyed as “పేదవారు ఎల్లప్పుడూ మీతో ఉంటారు”; ὅταν θέλητε preserves the indefinite ‘whenever’; δύνασθε conveys ability; and αὐτοῖς εὖ ποιῆσαι is correctly rendered broadly as “వారికి మేలు చేయగలరు.” The final contrast, “కాని నేను ఎల్లప్పుడూ మీతో ఉండను,” faithfully preserves the present-tense formulation without importing a future tense.'
