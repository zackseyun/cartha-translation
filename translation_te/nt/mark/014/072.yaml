id: MRK.14.72
reference: Mark 14:72
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐκ δευτέρου ἀλέκτωρ ἐφώνησεν· καὶ ἀνεμνήσθη ὁ Πέτρος τὸ ῥῆμα ⸀ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Πρὶν ἀλέκτορα ⸂φωνῆσαι δὶς τρίς με ἀπαρνήσῃ⸃, καὶ ἐπιβαλὼν ἔκλαιεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/072.yaml
  text: And immediately a rooster crowed a second time. And Peter remembered the word[a], how Jesus had said to him, “Before a rooster crows twice, you will deny me three times.” And breaking down, he wept.
translation:
  language: te
  text: వెంటనే కోడి రెండోసారి కూసింది. అప్పుడు పేతురు, “కోడి రెండుసార్లు కూయకముందే నీవు నన్ను మూడుసార్లు ఎరుగనని చెబుతావు” అని యేసు తనతో చెప్పిన మాటను జ్ఞాపకం చేసుకున్నాడు. అతడు విరిగి ఏడ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు దాని గురించి ఆలోచించి ఏడ్చాడు.” ఇక్కడున్న గ్రీకు కృదంతం ἐπιβαλών అర్థం కష్టం. దీనిని అంతరంగంగా ఆలోచించడం అని గానీ, బయటికి కనిపించే ఏదో శారీరక సంజ్ఞ అని గానీ వివిధ రీతుల్లో అర్థం చేసుకున్నారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు కథనంలోని తక్షణతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐκ δευτέρου
  choice: రెండోసారి
  rationale: ‘రెండవసారి’ అనే స్పష్టమైన సంఖ్యార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: కోడి కూసింది
  rationale: సందర్భంలో కోడి చేసే శబ్దానికి తెలుగులో సహజమైన ప్రయోగం.
- source_word: ἀνεμνήσθη
  choice: జ్ఞాపకం చేసుకున్నాడు
  rationale: పేతురు ఇంతకు ముందు పలికిన మాటను గుర్తుచేసుకున్నాడనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὸ ῥῆμα
  choice: మాటను
  rationale: ఇక్కడ ῥῆμα అనేది యేసు పలికిన నిర్దిష్టమైన వాక్యాన్ని సూచిస్తుంది; ‘మాట’ సహజంగా, సమీపార్థంతో ఉంది.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι δὶς
  choice: కోడి రెండుసార్లు కూయకముందే
  rationale: πρίν + infinitive కాలసంబంధాన్ని, δὶς యొక్క సంఖ్యార్థాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: τρίς με ἀπαρνήσῃ
  choice: నువ్వు నన్ను మూడుసార్లు ఎరుగనంటావు
  rationale: ఈ కథన సందర్భంలో ἀπαρνέομαι పేతురు యేసును ఎరుగనని చెప్పడాన్ని సూచిస్తుంది; తెలుగు వాడుకలో ‘ఎరుగనను’ కంటే ‘ఎరుగనంటావు’ సహజంగా ఉంది.
- source_word: ἐπιβαλών
  choice: కృంగిపోయి
  rationale: కష్టమైన ఈ కృదంతం సూచించే భావోద్వేగ విరుగుదలను సహజంగా అందిస్తుంది; నిర్ధారించలేని శారీరక సంజ్ఞను ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: ἔκλαιεν
  choice: ఏడ్చాడు
  rationale: అసంపూర్ణ భూతకాల క్రియను కథన తెలుగులో సంక్షిప్తంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἐπιβαλών అనే సందిగ్ధ కృదంతం పేతురు ప్రతిస్పందనను ఎలా చిత్రించాలి
  choice: ప్రధాన పాఠ్యంలో ‘కృంగిపోయి’ అని భావోద్వేగ విరుగుదలగా అనువదించడం
  alternative: ‘దాని గురించి ఆలోచించి’, ‘తలను కప్పుకొని’, లేదా ఏదో బాహ్య సంజ్ఞ చేసి ఏడ్చాడని అర్థం చేసుకోవడం
  rationale: గ్రీకు పదబంధం అర్థం వివాదాస్పదం. ఎంపిక చేసిన రూపం పేతురు దుఃఖాన్ని చూపుతుంది గాని, మూలంలో స్పష్టంగా లేని నిర్దిష్టమైన అంతరంగ చర్యను లేదా శారీరక సంజ్ఞను బలవంతంగా నిర్ణయించదు; ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ప్రత్యక్ష వాక్యంలో ‘నువ్వు’ వాడటం యేసు పేతురుతో నేరుగా మాట్లాడిన ఏకవచనాన్ని సహజంగా నిలుపుతుంది. ‘ఎరుగనంటావు’ కథన సందర్భంలోని నిరాకరణ స్వరూపాన్ని స్పష్టం చేస్తుంది. వివాదాస్పదమైన ἐπιβαλών అర్థాన్ని పాదసూచికతో పారదర్శకంగా ఉంచాం.
