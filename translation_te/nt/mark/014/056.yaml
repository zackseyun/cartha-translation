  yaml_path: translation/nt/mark/014/056.yaml
  text: For many were giving false testimony against him[a], and their testimonies were not consistent.
translation:
  language: te
  text: ఎందుకంటే చాలామంది ఆయనకు వ్యతిరేకంగా అబద్ధ సాక్ష్యం చెబుతూ ఉన్నారు; వారి సాక్ష్యాలు ఒకదానికొకటి సరిపోలలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదానుసారంగా: “ఆయనకు వ్యతిరేకంగా అబద్ధ సాక్ష్యం చెబుతూ ఉన్నారు; ఆ సాక్ష్యాలు ఒకేలా లేవు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: చాలామంది
  rationale: ఈ విశేషణం నామవాచకంగా వాడబడి అనేకమంది వ్యక్తులను సూచిస్తుంది. మూలంలో ‘సాక్షులు’ అనే నామవాచకం స్పష్టంగా లేనందున దాన్ని చేర్చలేదు.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: చుట్టూ ఉన్న కథనానికి వివరణాత్మక ఆధారాన్ని అందించే సంధానార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐψευδομαρτύρουν
  choice: అబద్ధ సాక్ష్యం చెబుతూ ఉన్నారు
  rationale: న్యాయవిచారణ సందర్భంలోని తప్పుడు సాక్ష్యార్థాన్ని, అలాగే అసంపూర్ణ భూతకాలం సూచించే కొనసాగుతున్న లేదా పునరావృత చర్యను నిలుపుతుంది.
- source_word: κατ’ αὐτοῦ
  choice: ఆయనకు వ్యతిరేకంగా
  rationale: γενitive‌తో κατά ఇక్కడ యేసుకు విరోధంగా ఉద్దేశించిన న్యాయసాక్ష్యాన్ని సూచిస్తుంది.
- source_word: ἴσαι
  choice: ఒకదానితో ఒకటి ఏకీభవించలేదు
  rationale: పదశః ‘సమానంగా’ అయినా, సాక్ష్యాల సందర్భంలో అవి పరస్పరం సరిపోలలేదనే భావం. తెలుగు న్యాయ/సాధారణ వాడుకలో ‘ఏకీభవించలేదు’ సహజంగా ఉంది.
- source_word: αἱ μαρτυρίαι
  choice: వారి సాక్ష్యాలు
  rationale: నిర్దిష్ట ఉపపదం ముందే ప్రస్తావించిన వారి సాక్ష్యాలను సూచిస్తుంది; తెలుగులో సంబంధాన్ని స్పష్టం చేయడానికి ‘వారి’ సహజం.
- source_word: οὐκ ἦσαν
  choice: ఏకీభవించలేదు
  rationale: ἴσαιతో కలిసి వచ్చిన నిరాకరణను తెలుగులో సహజమైన క్రియారూపంగా వ్యక్తం చేస్తుంది.
