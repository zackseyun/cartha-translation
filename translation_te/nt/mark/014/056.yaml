  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవసూచక ‘ఆయన’తో, న్యాయవిచారణ సందర్భానికి తగిన ‘అబద్ధ సాక్ష్యం’ మరియు ‘సాక్ష్యాలు’ అనే పదాలను ఉపయోగించాం. వాక్య నిర్మాణం స్పష్టంగా, గంభీరంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచబడింది.
