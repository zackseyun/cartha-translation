  yaml_path: translation/nt/mark/014/035.yaml
  text: And going a little farther[a], he fell to the ground and was praying that, if it were possible, the hour might pass from him.
translation:
  language: te
  text: ఆయన కొద్దిదూరం ముందుకు వెళ్లి[a], నేలమీద పడి, సాధ్యమైతే ఆ గడియ ఆయనను దాటిపోవాలని ప్రార్థిస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొద్దిగా ముందుకు వెళ్లి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: ఇంకొంచెం దూరం వెళ్లి
  rationale: ఇతరులను దాటి కొద్దిదూరం ముందుకు వెళ్లడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. ప్రత్యామ్నాయంగా ‘కొంచెం ముందుకు వెళ్లి’ అని కూడా అనువదించవచ్చు.
- source_word: ἔπιπτεν ἐπὶ τῆς γῆς
  choice: నేలమీద పడి
  rationale: కథనంలో నేలపై పడిన చర్యను సహజంగా వ్యక్తం చేస్తుంది; గ్రీకు అసంపూర్ణ భూతకాల రూపాన్ని తెలుగులో అసహజంగా యథాతథంగా అనుకరించదు.
- source_word: προσηύχετο
  choice: ప్రార్థిస్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాలంలో సూచితమైన కొనసాగుతున్న ప్రార్థనను నిలుపుతుంది.
- source_word: ἵνα
  choice: అని … ప్రార్థిస్తూ ఉన్నాడు
  rationale: ఇక్కడ ἵνα ప్రార్థనలోని విషయాన్ని పరిచయం చేస్తుంది; తెలుగు వాక్య నిర్మాణంలో ‘అని’ సహజమైన సమానార్థకం.
- source_word: εἰ δυνατόν ἐστιν
  choice: సాధ్యమైతే
  rationale: సంభావ్యతతో కూడిన షరతును సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది; అది సాధ్యమేనా కాదా అన్న ఉద్విగ్నతను పరిష్కరించదు.
- source_word: παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα
  choice: ఆ గడియ తన నుండి తొలగిపోవాలని
  rationale: παρέλθῃ ἀπ’ αὐτοῦలోని ‘అతని నుండి దాటిపోవడం/తొలగిపోవడం’ అనే భావాన్ని తెలుగులో స్పష్టంగా అందిస్తూ, ‘గడియ’ అనే ప్రతీకాత్మక పదాన్ని అలాగే ఉంచుతుంది.
theological_decisions:
- issue: ‘ఆ గడియ’ అనే పదబంధం యొక్క అర్థం
  choice: యేసు అనుభవించబోయే శ్రమ, మరణాలకు నియమితమైన సమయాన్ని సూచించే ‘ఆ గడియ’ అనే రూపాన్ని నిలుపడం
  alternative: ఆ సమయం; శ్రమ అనుభవించే సమయం
  rationale: మార్కు సువార్తలో ఈ పదబంధానికి ఉన్న కథనాత్మక, దైవశాస్త్రీయ భారాన్ని వివరణాత్మక పదబంధంతో ముందుగానే పరిష్కరించకుండా మూలపాఠంలోని ఉద్విగ్నతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి వాడబడింది. కొనసాగుతున్న ప్రార్థనను ‘ప్రార్థిస్తూ ఉన్నాడు’ ద్వారా చూపించి, ‘ఆ గడియ’ అనే మూలపాఠపు ప్రతీకాత్మక వ్యక్తీకరణను నిలుపుకున్నాం.
