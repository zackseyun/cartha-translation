    issue: “అప్పుడు” is added at the beginning.
    rationale: The Greek has καὶ λέγει, a connective plus historical present, but does not specifically say “then.” Removing “అప్పుడు” avoids adding a temporal relation while keeping the narrative flow.
  - severity: low
    issue: “అంటున్నాడు” is progressive in Telugu.
    rationale: λέγει is a present-form historical present; “అంటాడు” better conveys vivid narrative present without suggesting an action in progress.
  - severity: low
    issue: “నువ్వు” is comparatively colloquial in this solemn address.
    rationale: “నీవు” is modern standard Telugu and better fits the passage’s serious register while retaining the explicit Greek pronoun’s emphasis.
  revised_text: 'యేసు అతనితో ఇలా అంటాడు: “నేను నీతో నిజంగా చెబుతున్నాను: ఈ రోజే, ఈ రాత్రే, కోడి రెండుసార్లు కూయకముందే నీవు నన్ను మూడుసార్లు ఎరుగనంటావు.”'
