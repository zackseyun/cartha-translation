  source_fidelity: 'The draft retains the prediction’s essential elements: the historical present, both temporal expressions, the two rooster crows, and the three denials. However, “అప్పుడు” introduces a specific temporal-sequential nuance not expressed by καί, and “అంటున్నాడు” is progressive in Telugu rather than the straightforward historical present represented by λέγει.'
  naturalness: The sentence is otherwise clear modern Telugu. “అంటాడు” is a more idiomatic Telugu narrative historical present than “అంటున్నాడు.” “నీవు” maintains a suitably sober standard register in this solemn direct address.
  terminology: '“ఎరుగనంటావు” is contextually appropriate for ἀπαρνήσῃ: it naturally anticipates Peter’s denial of knowing Jesus without imposing an interpretive theological gloss. “కోడి ... కూయకముందే” accurately renders the temporal construction.'
  issues:
