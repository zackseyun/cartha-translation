revisions:
- from: 'అప్పుడు యేసు అతనితో ఇలా అంటున్నాడు: “నేను నీతో నిజంగా చెబుతున్నాను: ఈ రోజే, ఈ రాత్రే, కోడి రెండుసార్లు కూయకముందే నువ్వు నన్ను మూడుసార్లు ఎరుగనంటావు.”'
  to: 'యేసు అతనితో ఇలా అంటాడు: “నేను నీతో నిజంగా చెబుతున్నాను: ఈ రోజే, ఈ రాత్రే, కోడి రెండుసార్లు కూయకముందే నీవు నన్ను మూడుసార్లు ఎరుగనంటావు.”'
  rationale: The revision removes the unsupported temporal addition “అప్పుడు,” uses a Telugu historical-present narrative form, and slightly elevates the pronoun register. It preserves every semantically significant source element, including “today” and “this night” as distinct emphatic expressions, the numerical contrast of twice and three times, and the contextual sense of Peter’s denial.
