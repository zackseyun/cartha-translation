id: MRK.14.30
reference: Mark 14:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι σὺ σήμερον ⸂ταύτῃ τῇ νυκτὶ⸃ πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι τρίς ⸂με ἀπαρνήσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/030.yaml
  text: And Jesus says to him[a], “Truly I tell you, today, this very night, before a rooster crows twice, you will deny me three times.”
translation:
  language: te
  text: 'యేసు అతనితో ఇలా అంటాడు: “నేను నీతో నిజంగా చెబుతున్నాను: ఈ రోజే, ఈ రాత్రే, కోడి రెండుసార్లు కూయకముందే నీవు నన్ను మూడుసార్లు ఎరుగనంటావు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: అంటున్నాడు
  rationale: మార్కు ఉపయోగించిన చారిత్రక వర్తమాన కాలాన్ని నిలుపుతూ, తెలుగు కథనంలో సహజంగా వినిపించే రూపాన్ని ఎంచుకున్నాం.
- source_word: Ἀμὴν λέγω σοι
  choice: నేను నీతో నిజంగా చెబుతున్నాను
  rationale: ఇక్కడ Ἀμήν అనేది యేసు పలకబోయే మాట యొక్క నిశ్చయతను గంభీరంగా బలపరుస్తుంది; ఆధునిక తెలుగులో దాని భావాన్ని స్పష్టంగా తెలియజేసే రూపం ఇది.
- source_word: σὺ
  choice: నువ్వు
  rationale: గ్రీకులో కర్త సర్వనామం స్పష్టంగా ఉండి పేతురుపై ఉద్ఘాటన కలిగిస్తుంది; తెలుగులోనూ దాన్ని వ్యక్తంగా ఉంచాం.
- source_word: σήμερον
  choice: ఈ రోజే
  rationale: ‘ఈ రోజు’ అనే కాలసూచనను విడిచిపెట్టకుండా, ‘ఏ’ ద్వారా దాని తక్షణతను సహజంగా బలపరిచాం.
- source_word: ταύτῃ τῇ νυκτί
  choice: ఈ రాత్రే
  rationale: సూచకపదంలోని ఉద్ఘాటనను ఆధునిక తెలుగులో ‘ఈ రాత్రే’ సహజంగా అందిస్తుంది.
- source_word: δὶς ἀλέκτορα φωνῆσαι
  choice: కోడి రెండుసార్లు కూయడం
  rationale: సంఖ్యాపరమైన వివరాన్ని యథాతథంగా ఉంచి, కోడి చేసే శబ్దానికి సహజమైన తెలుగు క్రియను వాడాం.
- source_word: τρίς με ἀπαρνήσῃ
  choice: నువ్వు నన్ను మూడుసార్లు ఎరుగనంటావు
  rationale: ఈ సందర్భంలో ἀπαρνέομαι యేసుతో తనకున్న సంబంధాన్ని లేదనడాన్ని సూచిస్తుంది. ‘ఎరుగనంటావు’ ఆ భావాన్ని సామాన్యులకు సహజంగా, స్పష్టంగా తెలియజేస్తుంది; ‘తిరస్కరిస్తావు’ కంటే సందర్భానుకూలం.
theological_decisions:
- issue: σήμερον మరియు ταύτῃ τῇ νυκτί అనే రెండు కాలసూచనల సంబంధం
  choice: “ఈ రోజే, ఈ రాత్రే” అని రెండింటినీ నిలుపడం
  alternative: రెండింటినీ కలిపి “ఈ రాత్రే” అని మాత్రమే అనడం
  rationale: మూలపాఠంలో రెండూ ఉన్నాయి; అవి ప్రవచనం వెంటనే నెరవేరబోతున్నదనే తీవ్రతను పెంచుతాయి. ఒకదాన్ని తొలగించకుండా రెండింటినీ సహజమైన తెలుగులో ఉంచాం.
- issue: ἀπαρνέομαι యొక్క సందర్భార్థం
  choice: “ఎరుగనంటావు”
  alternative: “తిరస్కరిస్తావు” లేదా “నిరాకరిస్తావు”
  rationale: తరువాతి కథనంలో పేతురు యేసును ఎరుగనని చెప్పడం ద్వారా ఈ మాట నెరవేరుతుంది. అయినప్పటికీ ఈ అనువాదం అతని అంతర్గత ఉద్దేశం గురించి అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: మార్కు వాడిన చారిత్రక వర్తమాన కాలం
  choice: “యేసు ... అంటున్నాడు”
  alternative: “యేసు ... అన్నాడు”
  rationale: λέγει అనే వర్తమాన రూపాన్ని కనిపించేలా ఉంచి మార్కు కథనశైలిలోని సజీవతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే సంభాషణా శైలి. ‘ఈ రోజే, ఈ రాత్రే’ అనే పునరుక్తి మూలంలోని ఉద్ఘాటనను ఉద్దేశపూర్వకంగా నిలుపుతుంది. ఆంగ్ల సంప్రదింపుపాఠంలోని [a] గుర్తు దాని గమనికతో సరైన స్థానిక సంబంధం లేకపోవడం, అలాగే తెలుగు ప్రధాన పాఠం మూల నిర్మాణాన్ని ఇప్పటికే స్పష్టంగా అందించడం వల్ల నిరాధారమైన గమనికను చేర్చలేదు.
