id: MRK.14.21
reference: Mark 14:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ὅτι ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· ⸀καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/021.yaml
  text: For the Son of Man goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been good for him if that man had not been born.
translation:
  language: te
  text: ఎందుకంటే మనుష్యకుమారుడు తన గురించి రాయబడి ఉన్న ప్రకారమే వెళ్తున్నాడు; అయితే ఎవరి ద్వారా మనుష్యకుమారుడు అప్పగించబడుతున్నాడో, ఆ మనిషికి అయ్యో! ఆ మనిషి పుట్టకపోయి ఉంటే అతనికి మేలై ఉండేది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: వాక్యారంభంలో ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ὅτι ముందు మాటకు వివరణాత్మక అనుసంధానాన్ని ఇస్తుంది. తెలుగులో సందర్భమే ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది; ‘ఎందుకంటే’ అని పెట్టడం వాక్యాన్ని అనవసరంగా భారంగా చేస్తుంది.
- source_word: ὁ μὲν ... δὲ
  choice: '...; అయితే ...'
  rationale: μέν...δέ సూచించే పరస్పర విరుద్ధమైన రెండు వాక్యభాగాలను తెలుగులో మొదటి μένను విడిగా పలకకుండా, δέకు ‘అయితే’ అని ఇచ్చి సహజంగా నిలిపింది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: యేసు ఉపయోగించిన స్థిరమైన స్వీయనామాన్ని, దాని దానియేలు గ్రంథ సంబంధిత ప్రతిధ్వనిని కాపాడే సాంప్రదాయబద్ధమైన స్పష్టమైన రూపం.
- source_word: ὑπάγει
  choice: వెళ్లిపోతున్నాడు
  rationale: నిర్ణీత పరిణామం వైపు సాగడాన్ని వర్తమాన రూపంలో తెలియజేస్తుంది; కేవలం ప్రదేశాంతర గమనమని పరిమితం చేయదు.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: తన గురించి రాయబడి ఉన్న ప్రకారమే
  rationale: καθώςలోని అనురూపతను, γέγραπταιలోని ‘రాసి ఉన్నది’ అనే నిలకడైన ఫలితాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: οὐαὶ
  choice: అయ్యో!
  rationale: విలాపంతో కూడిన ప్రవక్తీయ హెచ్చరికను తెలుగులో గంభీరంగా, సహజంగా తెలియజేస్తుంది.
- source_word: δι’ οὗ
  choice: ఎవరి ద్వారా
  rationale: διά + genitiveలోని మాధ్యమం లేదా కార్యసాధకత్వ భావాన్ని నేరుగా కాపాడుతుంది.
- source_word: παραδίδοται
  choice: అప్పగించబడుతున్నాడు
  rationale: παραδίδωμι యొక్క ప్రాథమిక ‘అప్పగించు/చేతికి ఇవ్వు’ భావాన్ని నిలుపుతుంది. సందర్భంలో ద్రోహం స్పష్టమే అయినా, పదంలో లేని నైతిక వివరణను ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη
  choice: పుట్టకపోయి ఉంటే అతనికి మేలై ఉండేది
  rationale: అవాస్తవ గత షరతును, దానిపై చెప్పిన తీవ్రమైన మూల్యాంకనాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: ఆ మనిషి
  rationale: గ్రీకులోని నిర్దిష్ట సూచనను, గంభీరమైన పునరుక్తిని నిలుపుతుంది.
theological_decisions:
- issue: శ్రమల సందర్భంలో παραδίδοται అనువాదం
  choice: అప్పగించబడుతున్నాడు
  alternative: ద్రోహం చేయబడుతున్నాడు
  rationale: మూల క్రియ యొక్క విస్తృతమైన ‘అప్పగించు’ భావాన్ని కాపాడటం వల్ల శ్రమల కథనమంతటా ఉన్న పదబంధ సంబంధం కనిపిస్తుంది. యూదా ద్రోహం సందర్భం ద్వారా స్పష్టమవుతుంది; దానిని క్రియలోనే నిర్బంధించలేదు.
- issue: దైవ సంకల్పం మరియు మానవ బాధ్యత మధ్య ఉద్రిక్తత
  choice: ‘రాయబడి ఉన్న ప్రకారమే’ అన్న వాక్యంతో పాటు ద్రోహికి ‘అయ్యో’ అనే తీర్పును యథాతథంగా నిలిపింది
  alternative: ఒక వాక్యభాగాన్ని మరొకదాని ఆధారంగా వివరిస్తూ నిర్ణయవాదం లేదా బాధ్యతలేమి వైపు మొగ్గడం
  rationale: మూలపాఠ్యం మనుష్యకుమారుని గతి లేఖనానుసారమని, అదే సమయంలో ఆయనను అప్పగించే వ్యక్తి బాధ్యత వహిస్తాడని చెబుతుంది. అనువాదం ఈ రెండింటినీ పరిష్కరించకుండా కలిపి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా వాక్యంలోని గంభీరమైన తీర్పు స్వరాన్ని నిలుపుతూ రూపొందించబడింది. ఈ ముసాయిదాలో పాదసూచికలు అవసరం కాలేదు.
