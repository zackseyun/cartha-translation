source:
  edition: SBLGNT
  text: εἷς δέ ⸀τις τῶν παρεστηκότων σπασάμενος τὴν μάχαιραν ἔπαισεν τὸν δοῦλον τοῦ ἀρχιερέως καὶ ἀφεῖλεν αὐτοῦ τὸ ⸀ὠτάριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/047.yaml
  text: But one of those standing nearby drew his sword and struck the high priest’s servant[a], and cut off his ear.
translation:
  language: te
  text: అయితే, అక్కడ నిలబడి ఉన్నవారిలో ఒకడు తన కత్తిని బయటికి తీసి, ప్రధాన యాజకుని బానిసను[a] కొట్టి, ఆ బానిస చెవిని నరికివేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “దాసుణ్ణి” లేదా “సేవకుణ్ణి.” గ్రీకు: δοῦλος.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δέ τις
  choice: అయితే ... ఒకడు
  rationale: δέ తెలిపే స్వల్ప వ్యత్యాసాన్ని ‘అయితే’తో ఉంచుతూ, εἷς ... τις సూచించే అనిర్దిష్ట వ్యక్తిని ‘ఒకడు’గా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τῶν παρεστηκότων
  choice: అక్కడ నిలబడి ఉన్నవారిలో
  rationale: παρίστημι యొక్క స్థలార్థాన్ని, అక్కడ సమీపంలో నిలబడి ఉన్న సమూహాన్ని, సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: తన కత్తిని బయటికి తీసి
  rationale: ఆయుధ సందర్భంలో σπάομαι అంటే కత్తిని బయటికి తీయడం. గ్రీకులోని నిర్దిష్ట ఉపపదాన్ని తెలుగు సహజ ప్రయోగంలో స్వామ్యార్థక ‘తన’తో వ్యక్తపరచింది; ఒరను పాఠ్యంలో లేనందున చేర్చలేదు.
- source_word: ἔπαισεν
  choice: కొట్టి
  rationale: హింసాత్మక దెబ్బను సూచించే సరళమైన, ప్రస్తుత తెలుగు సమానార్థకం.
- source_word: τὸν δοῦλον τοῦ ἀρχιερέως
  choice: ప్రధాన యాజకుని బానిసను
  rationale: δοῦλος సూచించే అధీన సామాజిక స్థితిని ‘బానిస’ స్పష్టంగా నిలుపుతుంది; ἀρχιερεύς‌కు ‘ప్రధాన యాజకుడు’ ప్రామాణికమైన తెలుగు పదప్రయోగం.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτάριον
  choice: అతని చెవిని నరికేశాడు
  rationale: హింసాత్మక సందర్భంలో ἀφαιρέω ఫలితాన్ని ‘నరికేశాడు’ సహజంగా తెలియజేస్తుంది. ὠτάριον యొక్క రూపదృష్ట్యా అల్పార్థాన్ని తెలుగులో ‘చిన్న చెవి’గా అసహజంగా చూపలేదు; సమాంతర వృత్తాంతం నుంచి ‘కుడి చెవి’ని చేర్చలేదు.
theological_decisions:
- issue: కథనంలోని సామాజిక స్థితిని సూచించే δοῦλος అనువాదం
  choice: బానిస
  alternative: దాసుడు / సేవకుడు
  rationale: ప్రధాన యాజకునికి అధీనమైన వ్యక్తిని సూచించే ఈ సందర్భంలో ‘బానిస’ మూలపదంలోని సామాజిక వాస్తవాన్ని ‘సేవకుడు’కన్నా స్పష్టంగా నిలుపుతుంది. ‘దాసుడు’ సాధ్యమైన ప్రత్యామ్నాయం అయినా ఆధునిక తెలుగులో అది భక్తిపరమైన లేదా సాధారణ సేవకత్వ భావాన్ని కూడా కలిగించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన కథన శైలిని వాడింది. గ్రీకు క్రియాక్రమాన్ని సహజమైన తెలుగు వరుసక్రియలుగా అందిస్తూ, వ్యక్తి అనిర్దిష్టతను మరియు మార్కు వృత్తాంతంలో చెవి ఏ వైపుదో చెప్పని అంశాన్ని యథాతథంగా ఉంచింది.
