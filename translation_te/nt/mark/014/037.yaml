id: MRK.14.37
reference: Mark 14:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔρχεται καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Σίμων, καθεύδεις; οὐκ ἴσχυσας μίαν ὥραν γρηγορῆσαι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/037.yaml
  text: And he comes and finds them sleeping[a], and he says to Peter, “Simon, are you sleeping? Were you not able to stay awake one hour?”
translation:
  language: te
  text: 'ఆయన వచ్చి, వారు నిద్రపోతుండగా వారిని చూశాడు; పేతురుతో ఇలా అన్నాడు: “సీమోనూ, నిద్రపోతున్నావా? ఒక్క గంటసేపైనా మెలకువగా ఉండలేకపోయావా?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక్క గంటసేపైనా కాపలా కాయలేకపోయావా?”
    reason: γρηγορέω అనే క్రియకు ఇక్కడ ‘మెలకువగా ఉండడం’తో పాటు ‘కాపలా కాయడం/కాపలా ఉండడం’ అనే భావం కూడా ఉండవచ్చు.
lexical_decisions:
- source_word: ἔρχεται
  choice: వచ్చి
  rationale: గ్రీకులోని చారిత్రక వర్తమాన కాలం కథనానికి సజీవతను ఇస్తుంది; అయితే తెలుగు సహజ కథన శైలిలో తరువాతి క్రియతో కలిపిన ‘వచ్చి’ ఆ క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: వారు నిద్రపోతూ ఉండడం చూసి
  rationale: εὑρίσκω ఇక్కడ ‘కనుగొను/చూచు’ భావంలో ఉంది; వర్తమాన కృదంతమైన καθεύδοντας సూచించే కొనసాగుతున్న నిద్ర స్థితిని ‘నిద్రపోతూ ఉండడం’గా నిలిపాం.
- source_word: λέγει τῷ Πέτρῳ
  choice: పేతురుతో ... అని అన్నాడు
  rationale: తెలుగులో ప్రత్యక్ష వాక్యంతో సహజంగా వచ్చే నిర్మాణం. ‘పేతురు’ అనే గుర్తింపును తరువాతి సంబోధన ‘సీమోను’ నుండి వేరుగా ఉంచాం.
- source_word: Σίμων
  choice: సీమోనూ
  rationale: యేసు పేతురును అతని వ్యక్తిగత పేరైన సీమోను అని సంబోధిస్తున్న భేదాన్ని కాపాడాం; సంబోధనకు సహజమైన దీర్ఘాంత రూపం వాడాం.
- source_word: καθεύδεις
  choice: నిద్రపోతున్నావా?
  rationale: ప్రస్తుత క్షణంలో జరుగుతున్న నిద్రను ప్రశ్నిస్తూ మందలించే భావాన్ని సహజ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὐκ ἴσχυσας
  choice: ఉండలేకపోయావా?
  rationale: ఇక్కడ ἰσχύω శారీరక బలం కంటే సామర్థ్యాన్ని సూచిస్తుంది; ‘లేకపోయావా’ సందర్భానుకూలమైన సహజ రూపం.
- source_word: μίαν ὥραν
  choice: ఒక్క గంట
  rationale: కాలవ్యాప్తిని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘ఒక్క’ మందలింపులోని ‘అంత మాత్రమైన సమయం కూడా’ అనే ఉద్ఘాటనను ప్రతిబింబిస్తుంది.
- source_word: γρηγορῆσαι
  choice: మెలకువగా ఉండడం
  rationale: నిద్రకు ప్రత్యక్ష విరుద్ధంగా ఉన్న అర్థాన్ని ముందుకు తెస్తుంది; అదే క్రియకు సాధ్యమైన ‘కాపలా/జాగరూకతతో ఉండడం’ భావాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: మార్కు వాడిన చారిత్రక వర్తమాన క్రియల ప్రతిపాదన
  choice: తెలుగు సహజ కథన ప్రవాహం కోసం భూతకాల ప్రధాన క్రియతో అనుసంధానించిన కృదంత నిర్మాణం వాడాం.
  alternative: ‘ఆయన వస్తాడు ... చూస్తాడు ... చెబుతాడు’ అంటూ వర్తమాన కాలాన్ని యథాతథంగా ఉంచడం.
  rationale: గ్రీకు శైలి సజీవతను అక్షరానుసారంగా నిలిపితే తెలుగులో అసహజంగా లేదా సాధారణ అలవాటును సూచించినట్లుగా వినిపించవచ్చు. సంఘటనల క్రమం, ఆకస్మికతను సహజ తెలుగు కథన నిర్మాణంలో కాపాడాం.
- issue: γρηγορέω పదానికి సందర్భోచిత అర్థం
  choice: ‘మెలకువగా ఉండడం’ను ప్రధాన పాఠంలో వాడాం.
  alternative: ‘కాపలా ఉండడం’ లేదా ‘జాగరూకంగా ఉండడం’.
  rationale: ఈ వచనంలో నిద్రతో ఉన్న ప్రత్యక్ష వ్యత్యాసం కారణంగా అక్షరార్థమైన మెలకువను ప్రధానంగా చూపాం; ఆధ్యాత్మిక లేదా అప్రమత్తత భావాన్ని తొలగించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు సులభమైన కథన శైలి. ప్రత్యక్ష సంబోధనలో సహజమైన ‘సీమోనూ’ వాడబడింది. గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగులో యాంత్రికంగా అనుకరించకుండా సహజ భూతకాల కథనంగా మలిచాం.
