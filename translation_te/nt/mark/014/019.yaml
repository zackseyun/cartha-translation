  yaml_path: translation/nt/mark/014/019.yaml
  text: They began to be grieved and to say to him[a], one by one, “Surely not I?”
translation:
  language: te
  text: వారు దుఃఖపడడం మొదలుపెట్టి, ఒక్కొక్కరుగా ఆయనతో, “నేను కాను కదా?[a]” అని చెప్పసాగారు.
  philosophy: optimal-equivalence
  footnotes:
