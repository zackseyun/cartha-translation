    text: లేదా, “నేను కాదుగదా?” గ్రీకులోని μήτι అనే ప్రశ్నార్థక అవ్యయం ‘కాదు’ అనే సమాధానాన్ని ఆశిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: మొదలుపెట్టి
  rationale: పూరక క్రియారూపాలతో కలిసి చర్యలు ఆరంభమైనట్లు సూచిస్తుంది; తెలుగులో సంయుక్త వాక్య నిర్మాణంలో ‘మొదలుపెట్టి’ సహజంగా ఉంది.
- source_word: λυπεῖσθαι
  choice: దుఃఖపడడం
  rationale: వారు శోకానికి లేదా మనోవేదనకు లోనైన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καὶ λέγειν
  choice: అని అన్నారు
  rationale: ప్రశ్నార్థక విషయం ఉన్నప్పటికీ మూలంలోని λέγω సాధారణంగా ‘చెప్పు/అను’; అందువల్ల ప్రత్యేకంగా ‘అడిగారు’ అని మార్చలేదు.
- source_word: αὐτῷ
  choice: ఆయనతో
  rationale: మూలంలోని సర్వనామాన్ని నిలుపుతూ, సందర్భంలో యేసును గౌరవప్రదంగా సూచించే సహజ తెలుగు రూపం.
- source_word: εἷς κατὰ εἷς
  choice: ఒక్కొక్కరుగా
  rationale: ప్రతి వ్యక్తి వరుసగా స్పందించిన పంపిణీ భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: Μήτι ἐγώ;
  choice: నేను కాదుగదా?
  rationale: μήτι ఆశించే ప్రతికూల సమాధానాన్ని, అలాగే గ్రీకు వాక్యంలోని సంక్షిప్తతను తెలుగులో సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: శిష్యుల ప్రశ్నలోని భావబలం
  choice: ప్రతికూల సమాధానాన్ని ఆశించే ప్రశ్నగా ‘నేను కాదుగదా?’ అని అనువదించడం.
  alternative: ‘నేనేనా?’
  rationale: μήτι అనే ప్రశ్నార్థక అవ్యయం ‘కాదు’ అనే సమాధానాన్ని ఆశిస్తున్నట్లు సూచిస్తుంది. ‘నేనేనా?’ మాత్రమే అంటే ఆ నిరాకరణాపేక్ష, కలవరం లేదా అభ్యంతర భావం తగ్గిపోతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గంభీరమైన శైలి. మూలంలోని సర్వనామం, వరుస స్పందన, మరియు ప్రతికూల సమాధానాన్ని ఆశించే ప్రశ్నాభావం నిలుపబడ్డాయి.
