source:
  edition: SBLGNT
  text: καθ’ ἡμέραν ἤμην πρὸς ὑμᾶς ἐν τῷ ἱερῷ διδάσκων καὶ οὐκ ἐκρατήσατέ με· ἀλλ’ ἵνα πληρωθῶσιν αἱ γραφαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/049.yaml
  text: Day after day I was with you in the temple[a], teaching, and you did not seize me[c][b]. But let the Scriptures be fulfilled.
translation:
  language: te
  text: “రోజూ నేను దేవాలయ ప్రాంగణంలో మీతో ఉండి బోధిస్తూ ఉండేవాణ్ణి, అయినా మీరు నన్ను పట్టుకోలేదు.[a] కానీ లేఖనాలు నెరవేరేలా ఇదంతా జరిగింది.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పట్టుకోలేదు’ అనే మాటకు ‘అరెస్టు చేయలేదు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మూల గ్రీకు వాక్యం సంక్షిప్తంగా, ‘కానీ లేఖనాలు నెరవేరేలా’ అని మాత్రమే ఉంది; ప్రధాన క్రియ సందర్భం ద్వారా అర్థమవుతుంది. దీనిని ‘కానీ లేఖనాలు నెరవేరడానికి’ అని కూడా అనువదించవచ్చు.
    reason: source_ambiguity
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: రోజూ
  rationale: ఈ విభక్తి ప్రయోగం ‘ప్రతి రోజు/రోజు రోజుకూ’ అనే పునరావృత భావాన్ని ఇస్తుంది; ‘రోజూ’ ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: ἤμην πρὸς ὑμᾶς
  choice: నేను ... మీతో ఉండి
  rationale: πρός ఇక్కడ వ్యక్తులతో కలిసి ఉన్న బహిరంగ సాన్నిధ్యాన్ని సూచిస్తుంది; ‘మీతో ఉండి’ ఆ సంబంధ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐν τῷ ἱερῷ
  choice: దేవాలయ ప్రాంగణంలో
  rationale: ἱερόν ఇక్కడ అంతర్గర్భాలయాన్ని మాత్రమే కాక మొత్తం దేవాలయ సముదాయాన్ని సూచిస్తుంది; ‘దేవాలయ ప్రాంగణం’ ఆ పరిధిని స్పష్టం చేస్తుంది.
- source_word: διδάσκων
  choice: బోధించాను
  rationale: వర్తమాన కృదంతం యేసు అక్కడ ఉన్నప్పుడు కొనసాగించిన కార్యాన్ని తెలియజేస్తుంది; తెలుగులో ‘ఉండి బోధించాను’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: οὐκ ἐκρατήσατέ με
  choice: మీరు నన్ను పట్టుకోలేదు
  rationale: κρατέωకు పట్టుకోవడం, అదుపులోకి తీసుకోవడం అనే విస్తృత భావం ఉంది; ‘పట్టుకోలేదు’ శారీరకంగానూ అరెస్టు సందర్భంలోనూ సరిపోతూ, అర్థాన్ని అనవసరంగా న్యాయపరమైన పదానికే పరిమితం చేయదు.
- source_word: ἀλλ’ ἵνα
  choice: అయితే ... నెరవేరడానికి ఇదంతా జరిగింది
  rationale: గ్రీకులో ప్రధాన క్రియ వదిలివేయబడిన సంక్షిప్త నిర్మాణం ఉంది. తెలుగులో వాక్యం సహజంగా ఉండేందుకు సందర్భం సూచించే ‘ఇదంతా జరిగింది’ చేర్చబడింది; మూలంలోని సంక్షిప్తతను పాదసూచిక తెలియజేస్తుంది.
- source_word: πληρωθῶσιν αἱ γραφαί
  choice: లేఖనాలు నెరవేరడానికి
  rationale: ἵνα తరువాతి కర్మణి ప్రయోగం ఉద్దేశం లేదా ఫలితాన్ని సూచించగలదు. ‘నెరవేరడానికి’ ఆ సంబంధాన్ని సహజంగా ఉంచుతుంది; ‘లేఖనాలు’ ఇశ్రాయేలు పవిత్ర గ్రంథాలను సూచిస్తుంది.
theological_decisions:
- issue: లేఖనాల నెరవేర్పును తెలిపే అసంపూర్ణ ఉద్దేశ వాక్యం
  choice: అయితే లేఖనాలు నెరవేరడానికి ఇదంతా జరిగింది
  alternative: అయితే లేఖనాలు నెరవేరేలా
  rationale: ἀλλ’ ἵνα తరువాత ప్రధాన వాక్య క్రియ మూలంలో వ్యక్తంగా లేదు. ‘ఇదంతా జరిగింది’ అనేది సందర్భం ఆధారంగా పూరించబడిన సహజ తెలుగు; ఇది సంఘటనలు లేఖనాలకు అనుగుణంగా సాగుతున్నాయని తెలియజేస్తుంది, అయితే మూలంలో లేని మరింత బలమైన నిర్ణయవాద భావాన్ని చేర్చదు. పాదసూచిక అసలు నిర్మాణంలోని సంక్షిప్తతను, ఉద్దేశం/ఫలితం మధ్య ఉన్న స్వల్ప అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బహిరంగ పఠనానికి అనుకూలమైన గౌరవప్రదమైన శైలి. ‘దేవాలయ ప్రాంగణం’ ద్వారా ἱερόν యొక్క విస్తృత స్థలార్థం ప్రధాన పాఠ్యంలోనే స్పష్టం చేయబడింది. సంభాషణలోని నేరుగా ప్రశ్నించే స్వరం నిలుపుతూ, అనవసరంగా సాంకేతిక లేదా మతశాఖాపరమైన పదజాలం వాడలేదు.
