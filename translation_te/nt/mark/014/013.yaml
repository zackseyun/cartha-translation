revisions:
- from: 'ఆయన తన శిష్యుల్లో ఇద్దరిని పంపుతూ వారితో ఇలా అంటాడు: “పట్టణంలోకి వెళ్లండి. నీళ్ల కుండ మోసుకెళ్తున్న ఒక మనిషి మీకు ఎదురవుతాడు.[a] అతని వెంట వెళ్లండి.”'
  to: 'ఆయన తన శిష్యుల్లో ఇద్దరిని పంపి, వారితో ఇలా అంటాడు: “పట్టణంలోకి వెళ్లండి. నీటి కుండను మోస్తున్న ఒక మనిషి మీకు ఎదురవుతాడు.[a] అతని వెంట వెళ్లండి.”'
