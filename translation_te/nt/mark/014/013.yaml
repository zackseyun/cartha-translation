translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే కథనశైలి. మార్కు సువార్తలోని చారిత్రక వర్తమాన సజీవతను ‘పంపుతూ... అంటాడు’ ద్వారా నిలుపుకుంది.
