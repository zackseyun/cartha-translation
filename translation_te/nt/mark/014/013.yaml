id: MRK.14.13
reference: Mark 14:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν πόλιν, καὶ ἀπαντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/013.yaml
  text: And he sends two of his disciples and says to them[a], “Go into the city, and a man carrying a jar of water will meet you. Follow him,”
translation:
  language: te
  text: 'ఆయన తన శిష్యుల్లో ఇద్దరిని పంపి, వారితో ఇలా అంటాడు: “పట్టణంలోకి వెళ్లండి. నీటి కుండను మోస్తున్న ఒక మనిషి మీకు ఎదురవుతాడు.[a] అతని వెంట వెళ్లండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మట్టి కుండలో నీళ్లు మోస్తున్న ఒక మనిషి’ అని కూడా అనువదించవచ్చు.
    reason: κεράμιον అనే పదం మట్టితో చేసిన పాత్రను ప్రత్యేకంగా సూచించవచ్చు; ప్రధాన పాఠ్యంలో సహజమైన సంక్షిప్త రూపం ఉంచి ఈ పదార్థ వివరాన్ని ప్రత్యామ్నాయంగా తెలియజేస్తుంది.
lexical_decisions:
- source_word: ἀποστέλλει
  choice: పంపుతూ
  rationale: మార్కు వాడిన సజీవ చారిత్రక వర్తమానాన్ని సహజమైన తెలుగు కథనశైలిలో కొనసాగిస్తుంది; తరువాతి λέγειతో ఒకే చర్యాక్రమంగా కలుపుతుంది.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: తన శిష్యుల్లో ఇద్దరిని
  rationale: భాగార్థక నిర్మాణాన్ని సహజంగా తెలియజేస్తూ μαθηταίకు ప్రామాణికమైన ‘శిష్యులు’ అనే పదాన్ని వాడుతుంది.
- source_word: λέγει αὐτοῖς
  choice: వారితో ఇలా అంటాడు
  rationale: గ్రీకు వర్తమాన కాలంలోని కథన సజీవతను నిలుపుతూ ప్రత్యక్ష వాక్యాన్ని సహజంగా పరిచయం చేస్తుంది.
- source_word: Ὑπάγετε εἰς τὴν πόλιν
  choice: పట్టణంలోకి వెళ్లండి
  rationale: εἰς సూచించే లోపలికి కదలికను ‘లోకి’ స్పష్టంగా వ్యక్తపరుస్తుంది; ఆజ్ఞార్థాన్ని గౌరవ బహువచనంతో నిలుపుతుంది.
- source_word: ἀπαντήσει ὑμῖν
  choice: మీకు ఎదురవుతాడు
  rationale: సందర్భంలో ‘మీకు ఎదురుపడతాడు/కలుస్తాడు’ అనే భావాన్ని సహజంగా అందిస్తుంది; అతడు ఉద్దేశపూర్వకంగా వారిని కలవడానికి వస్తున్నాడని అదనంగా నిర్ధారించదు.
- source_word: ἄνθρωπος
  choice: ఒక మనిషి
  rationale: ఇక్కడ నిర్దిష్ట పురుష వ్యక్తిని సూచించే మూలపద భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: κεράμιον ὕδατος βαστάζων
  choice: నీళ్ల కుండ మోసుకెళ్తున్న
  rationale: పాత్రలో నీరు ఉందనే భావాన్నీ, కొనసాగుతున్న మోసే చర్యనూ సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: అతని వెంట వెళ్లండి
  rationale: ఈ ప్రయాణ సందర్భంలో ‘అతన్ని అనుసరించండి’ కంటే సహజంగా ఉండి, ప్రత్యక్ష ఆజ్ఞను స్పష్టంగా నిలుపుతుంది.
