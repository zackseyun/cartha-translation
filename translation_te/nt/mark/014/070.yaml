source:
  edition: SBLGNT
  text: ὁ δὲ πάλιν ἠρνεῖτο. καὶ μετὰ μικρὸν πάλιν οἱ παρεστῶτες ἔλεγον τῷ Πέτρῳ· Ἀληθῶς ἐξ αὐτῶν εἶ, καὶ γὰρ Γαλιλαῖος εἶ ⸂καὶ ἡ λαλιά σου ὁμοιάζει⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/070.yaml
  text: But he again denied it[a]. And after a little while, those standing nearby again were saying to Peter, “Surely you are one of them, for you are also a Galilean[b], and your speech is similar.”
translation:
  language: te
  text: అయితే అతడు మళ్లీ నిరాకరిస్తూనే ఉన్నాడు. కొద్దిసేపటి తర్వాత, దగ్గరగా నిలబడి ఉన్నవారు మళ్లీ పేతురుతో, “నిజంగా నువ్వు వారిలో ఒకడివి; ఎందుకంటే నువ్వు కూడా గలిలయుడివే, నీ మాటతీరు[a] కూడా వారిదిలాగే ఉంది[b]” అని అంటూనే ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ యాస కూడా వారిదిలాగే ఉంది,” లేక “నువ్వు మాట్లాడే తీరు కూడా వారిలాగే ఉంది.” గ్రీకు పదం λαλιά మాటతీరును, మాండలికాన్ని లేదా యాసను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రాచీన ప్రతుల్లో “నీ మాటతీరు కూడా వారిదిలాగే ఉంది” అనే మాటలు లేవు.
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνεῖτο
  choice: నిరాకరిస్తూనే ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం సందర్భంలో కొనసాగిన లేదా పునరావృతమైన నిరాకరణను సూచిస్తుంది. తెలుగులో ‘నిరాకరిస్తూనే ఉన్నాడు’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: μετὰ μικρὸν
  choice: కొద్దిసేపటి తర్వాత
  rationale: ఈ నుడికారం స్వల్ప కాలవ్యవధి గడిచినట్లు సూచిస్తుంది; ఈ అనువాదం ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: οἱ παρεστῶτες
  choice: దగ్గర నిలబడి ఉన్నవారు
  rationale: కృదంతం అక్కడ దగ్గర నిలిచివున్నవారిని సూచిస్తుంది; స్థల సంబంధమైన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἔλεγον
  choice: అని అంటూనే ఉన్నారు
  rationale: అసంపూర్ణ భూతకాలం కొనసాగుతున్న లేదా పునరావృతమైన మాటను సూచించగలదు; ‘అంటూనే ఉన్నారు’ ఆ క్రియారూప భావాన్ని తెలుగులో తెలియజేస్తుంది.
- source_word: Ἀληθῶς
  choice: నిజంగా
  rationale: వారు నిశ్చయంగా చేసిన వాదనను సహజమైన ప్రత్యక్ష సంభాషణలో వ్యక్తం చేస్తుంది.
- source_word: ἐξ αὐτῶν εἶ
  choice: నువ్వు వారిలో ఒకడివి
  rationale: యేసుతో సంబంధమున్న ఆ సమూహంలో పేతురు ఒకడని గుర్తించే భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: καὶ γὰρ
  choice: ఎందుకంటే నువ్వు కూడా
  rationale: γάρ కారణాన్ని, καί అదనపు గుర్తింపును తెలియజేస్తాయి; తెలుగు వాక్యనిర్మాణంలో రెండింటి బలాన్ని నిలుపుతుంది.
- source_word: Γαλιλαῖος
  choice: గలిలయుడివి
  rationale: గలిలయ ప్రాంతానికి చెందిన వ్యక్తిని సూచించే నామవాచక ప్రయోగం.
- source_word: ἡ λαλιά σου
  choice: నీ మాటతీరు
  rationale: λαλιά మాటల తీరు, మాండలికం లేదా ఉచ్చారణను సూచించగలదు. ‘మాటతీరు’ ఈ అర్థవిస్తృతిని అతిగా సంకుచితం చేయదు.
- source_word: ὁμοιάζει
  choice: వారిదిలాగే ఉంది
  rationale: క్రియ పోలికను సూచిస్తుంది. గ్రీకులో పోల్చబడుతున్న వర్గం అంతర్నిహితంగా ఉంది; తెలుగులో ‘వారిది’ అని సందర్భానుసారంగా స్పష్టం చేయడం సహజమైనది.
