translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. గ్రీకు అసంపూర్ణ భూతకాల క్రియల కొనసాగింపు భావాన్ని ‘నిరాకరిస్తూనే’, ‘అంటూనే’ అనే రూపాలతో నిలిపి, λαλιά యొక్క అర్థవిస్తృతిని ‘మాటతీరు’తో సంరక్షించాం.
