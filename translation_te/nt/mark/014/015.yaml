  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ὑμῖν δείξει ἀνάγαιον μέγα ἐστρωμένον ἕτοιμον· ⸀καὶ ἐκεῖ ἑτοιμάσατε ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/015.yaml
  text: And he himself will show you a large upper room[a], furnished and ready; prepare for us there.
translation:
  language: te
  text: అతడే మీకు అమర్చబడి సిద్ధంగా ఉన్న ఒక పెద్ద మేడగదిని[a] చూపిస్తాడు. అక్కడ మన కోసం సిద్ధం చేయండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అమర్చి సిద్ధంగా ఉంచిన ఒక పెద్ద పై అంతస్తు గదిని.’ ἐστρωμένον అనే పదం కేవలం సామగ్రి ఉన్న గదిని కాక, పరచి లేదా తగినట్లు అమర్చి సిద్ధం చేసిన గదిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: అతడే
  rationale: సర్వనామంలోని నొక్కిచెప్పే భావాన్ని సహజమైన తెలుగులో ‘అతడే’ నిలుపుతుంది.
- source_word: δείξει
  choice: చూపిస్తాడు
  rationale: భవిష్యత్ సూచక క్రియారూపాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἀνάγαιον μέγα
  choice: ఒక పెద్ద మేడగదిని
  rationale: ఇంటి పై అంతస్తులోని గదిని సూచించే పదానికి ‘మేడగది’ సంక్షిప్తమైన, సహజమైన తెలుగు సమానం; μέγα యొక్క పరిమాణ భావాన్ని ‘పెద్ద’ నిలుపుతుంది.
- source_word: ἐστρωμένον
  choice: అమర్చబడి
  rationale: στρώννυμι కృదంతం గది కేవలం సామగ్రి కలిగి ఉండటమే కాక, భోజనానికి తగినట్లు పరచి లేదా అమర్చి ఉంచబడిన భావాన్ని ఇవ్వగలదు; ‘అమర్చబడి’ ఆ విస్తృతిని కాపాడుతుంది.
- source_word: ἕτοιμον
  choice: సిద్ధంగా ఉన్న
  rationale: గది ఉపయోగానికి సిద్ధంగా ఉందనే స్థితిని స్పష్టంగా తెలియజేస్తుంది; తరువాతి ఆజ్ఞతో అనవసరమైన పదపునరుక్తి ఉన్నా మూలంలోని వేరే పదబంధాన్ని నిలుపుతుంది.
- source_word: ἐκεῖ
  choice: అక్కడ
  rationale: స్థలాన్ని సూచించే అవ్యయానికి సహజమైన తెలుగు సమానం.
- source_word: ἑτοιμάσατε
  choice: సిద్ధం చేయండి
  rationale: బహువచన ఆజ్ఞను గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: ἡμῖν
  choice: మన కోసం
  rationale: మాట్లాడేవాడు మరియు తనతో ఉన్నవారిని కలుపుకునే ‘మన’ రూపం ἡμῖν యొక్క సమూహార్థాన్ని సహజంగా తెలియజేస్తుంది; దాని సూచిత వ్యక్తులను విస్తరించి చెప్పదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవభరితమైన వాక్యనిర్మాణం వాడబడింది. αὐτός లోని ఉద్ఘాటనను ‘అతడే’తో నిలిపి, ἐστρωμένον యొక్క అర్థవిస్తృతిని ప్రధాన పాఠంలో ‘అమర్చబడి’తోను అడుగుసూచికలో ప్రత్యామ్నాయ వివరణతోను కాపాడాం.
