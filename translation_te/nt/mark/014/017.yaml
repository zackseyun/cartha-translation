translation:
  language: te
  text: సాయంకాలమైనప్పుడు, ఆయన పన్నెండుమందితో[a] వస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆ పన్నెండుమందితో’; యేసు ఏర్పరచుకున్న ప్రత్యేక అపొస్తలుల వర్గానికి స్థిరమైన పేరుగా ఈ మాటను పరిగణిస్తూ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: (ప్రత్యేక పదంగా అనువదించలేదు)
  rationale: తెలుగులో ఈ చిన్న వాక్యాన్ని ‘మరియు’తో ప్రారంభించడం అసహజంగా ఉంటుంది. కథన పరంపర సందర్భం ద్వారానే స్పష్టమవుతుంది; అందువల్ల గ్రీకు సంధాన పదం చేసే పనిని తెలుగు వాక్యప్రవాహం వ్యక్తపరుస్తుంది.
- source_word: ὀψίας γενομένης
  choice: సాయంకాలమైనప్పుడు
  rationale: ఈ genitive absolute కాలసంబంధ పరిస్థితిని సూచిస్తుంది. ‘సాయంకాలమైనప్పుడు’ అనేది సహజమైన ఆధునిక తెలుగు రూపం; ‘సాయంకాలం వచ్చినప్పుడు’ కంటే ఇది సాధారణంగా వినిపిస్తుంది.
- source_word: ἔρχεται
  choice: వస్తాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమాన కాలాన్ని నిలుపుతూ, మార్కు కథనంలోని సజీవతను వ్యక్తపరుస్తుంది. ‘వచ్చాడు’ మరింత సాధారణ తెలుగు కథన రూపమైనా, మూలంలోని కాలరూప ప్రభావాన్ని మృదువుపరుస్తుంది.
- source_word: μετὰ τῶν δώδεκα
  choice: పన్నెండుమందితో
  rationale: μετά + genitive సహవాసాన్ని సూచిస్తుంది. ఈ సందర్భంలో ‘పన్నెండుమంది’ యేసు ఏర్పరచుకున్న ప్రత్యేక శిష్యవర్గాన్ని సూచిస్తుంది; ‘శిష్యులు’ లేదా ‘అపొస్తలులు’ అని మూలంలో లేని పదాన్ని ప్రధాన వచనంలో చేర్చలేదు.
theological_decisions:
- issue: ‘పన్నెండుమంది’ ఎవరిని సూచిస్తున్నారు?
  choice: ఈ సందర్భంలో యూదాతో సహా యేసు యొక్క ప్రత్యేక పన్నెండుమంది శిష్యవర్గాన్ని సూచించే సంక్షిప్త పేరుగా ఉంచడం
  alternative: ‘పన్నెండు మంది శిష్యులతో’ లేదా ‘పన్నెండు మంది అపొస్తలులతో’ అని విస్తరించడం
  rationale: కథన సందర్భంలో సూచన స్పష్టంగా ఉంది. మూలంలోని సంక్షిప్తతను కాపాడటం ద్వారా ‘శిష్యులు’ లేదా ‘అపొస్తలులు’ అనే వివరణాత్మక పదాన్ని అనవసరంగా చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, సంక్షిప్తంగా, గౌరవప్రదంగా రూపొందించబడింది. మూలంలోని చారిత్రక వర్తమాన కాలాన్ని ‘వస్తాడు’ ద్వారా ఉద్దేశపూర్వకంగా నిలిపాం.
