source:
  edition: SBLGNT
  text: Καὶ ἀπήγαγον τὸν Ἰησοῦν πρὸς τὸν ἀρχιερέα, καὶ ⸀συνέρχονται πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι καὶ οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/053.yaml
  text: And they led Jesus away to the high priest[a], and all the chief priests and the elders and the scribes gathered together.
translation:
  language: te
  text: వారు యేసును ప్రధాన యాజకుని వద్దకు తీసుకెళ్లారు. ప్రధాన యాజకులు, పెద్దలు, ధర్మశాస్త్ర పండితులు అందరూ సమకూడారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘సమకూడుతున్నారు’ అనే వర్తమాన కాల రూపం ఉంది; గత సంఘటనను సజీవంగా చెప్పే కథన పద్ధతి ఇది.
    reason: చారిత్రక వర్తమాన కాలమైన συνέρχονται రూపాన్ని తెలుగు ప్రధాన పాఠ్యంలో సహజమైన గతకాలంగా ఇచ్చిన విషయాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: ἀπήγαγον
  choice: తీసుకెళ్లారు
  rationale: ἀπάγω ఇక్కడ అదుపులో ఒకరిని మరొకరి దగ్గరికి తీసుకెళ్లడాన్ని సూచిస్తుంది. ‘తీసుకెళ్లారు’ సహజమైన ఆధునిక తెలుగు; విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: ἀρχιερέα
  choice: ప్రధాన యాజకుని
  rationale: ఏకవచన రూపం ఇక్కడ ప్రధాన యాజక పదవిలో ఉన్న వ్యక్తిని సూచిస్తుంది; తరువాత వచ్చే బహువచన నాయకవర్గం నుండి దీనిని స్పష్టంగా వేరుచేస్తుంది.
- source_word: συνέρχονται
  choice: సమావేశమయ్యారు
  rationale: పదం కలిసి రావడం లేదా కూడడాన్ని సూచిస్తుంది. గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, సహజమైన తెలుగు గతకాల కథనానికి అనుగుణంగా గతకాలంలో అనువదించబడింది.
- source_word: πάντες
  choice: అందరూ
  rationale: సమావేశమైన నాయకవర్గాల సమగ్రతపై ఉన్న ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: బహువచనంలో ఇది ప్రధాన యాజక వర్గానికి చెందిన నాయకులను సూచిస్తుంది; తెలుగు బైబిలు సందర్భంలో ‘ప్రధాన యాజకులు’ స్పష్టమైన, సుపరిచితమైన పదప్రయోగం.
- source_word: πρεσβύτεροι
  choice: పెద్దలు
  rationale: ఇక్కడ వయస్సులో పెద్దవారిని మాత్రమే కాక, గుర్తింపు పొందిన సామాజిక-మత నాయకులను సూచిస్తుంది. ‘పెద్దలు’ ఆ సంస్థాగత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: γραμματεῖς
  choice: ధర్మశాస్త్ర పండితులు
  rationale: ఈ సందర్భంలో γραμματεῖς ధర్మశాస్త్రాన్ని అధ్యయనం చేసి బోధించే నిపుణులను సూచిస్తుంది. ‘శాస్త్రులు’ కంటే ‘ధర్మశాస్త్ర పండితులు’ సాధారణ ఆధునిక పాఠకులకు వెంటనే అర్థమవుతుంది.
theological_decisions:
- issue: గతకాల కథనంలో συνέρχονται అనే చారిత్రక వర్తమాన కాలం
  choice: తెలుగులో ‘సమావేశమయ్యారు’ అనే గతకాల రూపం
  alternative: ‘సమావేశమవుతున్నారు’ లేదా ‘సమావేశమవుతారు’ అని వర్తమాన రూపాన్ని నిలుపడం
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కాదు; కథన శైలికి సంబంధించినది. ఆధునిక తెలుగులో సహజమైన గతకాల ప్రవాహాన్ని నిలుపుతూ, గ్రీకు రూపంలోని సజీవమైన చారిత్రక వర్తమానాన్ని పాదసూచికలో తెలియజేయడం ఉత్తమ సమతుల్యతను ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి. ‘ప్రధాన యాజకుడు’ మరియు ‘ప్రధాన యాజకులు’ మధ్య ఏకవచన-బహువచన భేదం నిలుపబడింది. పాదసూచిక గుర్తు సంబంధిత ‘సమావేశమయ్యారు’ వాక్యాంతంలో ఉంచబడింది.
