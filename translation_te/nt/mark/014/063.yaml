  text: ὁ δὲ ἀρχιερεὺς διαρρήξας τοὺς χιτῶνας αὐτοῦ λέγει· Τί ἔτι χρείαν ἔχομεν μαρτύρων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/063.yaml
  text: Then the high priest tore his garments and said[b][a], “What further need do we have of witnesses?”
translation:
  language: te
  text: అప్పుడు ప్రధాన యాజకుడు తన వస్త్రాలను[a] చింపుకొని, “ఇక మనకు సాక్షుల అవసరం ఏముంది?” అని అన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన అంగీలను”; గ్రీకు పదం ప్రత్యేకంగా అంగీలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'గ్రీకులో చారిత్రక వర్తమాన కాలం వాడబడింది: “అని అంటున్నాడు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεὺς
  choice: ప్రధాన యాజకుడు
  rationale: ఈ విచారణకు అధ్యక్షత వహిస్తున్న ఏకవచన పదవిదారునికి ఆధునిక ప్రామాణిక తెలుగులో స్థిరమైన, స్పష్టమైన సమానార్థకం.
- source_word: διαρρήξας
  choice: చింపుకొని
  rationale: వస్త్రాలను చింపిన చర్యను సహజమైన తెలుగు క్రమంలో తెలిపి, అనంతరం పలికిన మాటతో క్రియాసంబంధాన్ని నిలుపుతుంది.
- source_word: τοὺς χιτῶνας αὐτοῦ
  choice: తన వస్త్రాలను
  rationale: χίτων ప్రత్యేకంగా అంగీని సూచించగలిగినా, ఇక్కడ బహువచనాన్ని నిలుపుతూ ఆ వస్త్రాలు ఆచారపరమైన ప్రత్యేక దుస్తులని అనవసరంగా నిర్ధారించకుండా విస్తృతమైన సహజ పదాన్ని వాడింది.
- source_word: λέγει
  choice: అని అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, తెలుగు కథనంలో సహజంగా వినిపించే భూతకాల రూపాన్ని వాడింది; మూలరూపాన్ని పాదసూచిక తెలియజేస్తుంది.
- source_word: Τί ἔτι χρείαν ἔχομεν
  choice: ఇక మనకు ... అవసరం ఏముంది?
  rationale: ἔτι లోని ‘ఇంకా/ఇకపై’ భావాన్ని ‘ఇక’ ద్వారా సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తూ ప్రశ్న యొక్క అలంకారిక బలాన్ని కాపాడుతుంది.
- source_word: μαρτύρων
  choice: సాక్షుల
  rationale: χρείαν తో ఉన్న షష్ఠీ సంబంధాన్ని తెలుగులో సహజమైన ‘సాక్షుల అవసరం’ నిర్మాణంతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ప్రధాన యాజకుడు వస్త్రాలు చింపుకోవడం యొక్క అర్థం
  choice: అతడు వస్త్రాలను నిజంగా చింపుకున్న చర్యగా మాత్రమే అనువదించి, దాని ఉద్దేశాన్ని వివరించలేదు.
  alternative: దైవదూషణగా భావించి ఆగ్రహంతో లేదా దుఃఖంతో వస్త్రాలు చింపుకున్నాడని స్పష్టీకరించడం.
  rationale: ఈ వచనం చర్యను, మాటను చెబుతుంది గాని ఆ సంకేతానికి కారణాన్ని స్వయంగా వివరించదు; అందువల్ల కథనంలోని వ్యాఖ్యాన స్వేచ్ఛను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ప్రధాన యాజకుడు’ అనే స్థిరమైన బైబిలు పదప్రయోగాన్ని ఉంచి, ప్రశ్నను సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే రీతిలో నిర్మించింది.
