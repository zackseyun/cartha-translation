  yaml_path: translation/nt/mark/014/050.yaml
  text: And leaving him, they all fled.
translation:
  language: te
  text: మరియు వారందరూ ఆయనను విడిచిపెట్టి పారిపోయారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: అప్పుడు
  rationale: ముందున్న అరెస్టు సంఘటనకు ఈ చర్యను సహజమైన తెలుగు కథన ప్రవాహంలో అనుసంధానిస్తుంది; ఇక్కడ అదనపు కారణార్థాన్ని చేర్చదు.
- source_word: ἀφέντες
  choice: విడిచిపెట్టి
  rationale: ἀφίημι యొక్క ఈ సందర్భార్థమైన ‘వెనుక విడిచిపెట్టడం’ను సహజమైన తెలుగు పూర్వకాలిక క్రియారూపంలో వ్యక్తం చేస్తుంది; ‘త్యజించి’ కంటే తక్కువ వ్యాఖ్యానాత్మకం.
- source_word: αὐτὸν
  choice: ఆయనను
  rationale: సందర్భంలో యేసును సూచించే కర్మ సర్వనామం; తెలుగులో గౌరవప్రదమైన సాధారణ సూచన.
- source_word: ἔφυγον
  choice: పారిపోయారు
  rationale: ప్రమాదం నుండి భయంతో వేగంగా వెళ్లిపోవడాన్ని సూచించే φεύγω అర్థాన్ని సహజంగా, గంభీరంగా తెలియజేస్తుంది.
- source_word: πάντες
  choice: వారందరూ
  rationale: అక్కడున్న యేసు సహచరులందరూ వెళ్లిపోయారనే సంపూర్ణతకు ఉన్న ఉద్ఘాటనను నిలుపుతుంది.
theological_decisions:
- issue: శిష్యులు విడిచిపెట్టిన పరిధి
  choice: వారందరూ ... పారిపోయారు
  alternative: అందరూ పారిపోయారు
  rationale: πάντες తెలిపే సంపూర్ణతను స్పష్టంగా ఉంచుతూ, ఈ సందర్భంలో యేసుతో ఉన్నవారందరూ ఆయనను విడిచిపోయారనే వాక్యపు సూటి భావాన్ని తగ్గించదు లేదా విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, సహజమైన కథన శైలి. ‘ఆయనను’ గౌరవప్రదంగా యేసును సూచిస్తుంది; మూలంలోని చర్యల క్రమం ‘విడిచిపెట్టి పారిపోయారు’గా నిలుపబడింది.
