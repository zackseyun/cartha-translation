  text: ὃ ⸀ἔσχεν ἐποίησεν, προέλαβεν μυρίσαι ⸂τὸ σῶμά μου⸃ εἰς τὸν ἐνταφιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/008.yaml
  text: She did what she could[a]; she anointed my body beforehand for burial.
translation:
  language: te
  text: ఆమె తనకు చేతనైనది చేసింది[a]. నా దేహానికి సమాధి చేయడానికి ముందుగానే సుగంధ ద్రవ్యం పూసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “ఆమె తనకు ఉన్నది చేసింది.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ ἔσχεν ἐποίησεν
  choice: ఆమె తనకు చేతనైనది చేసింది
  rationale: ‘తన వద్ద ఉన్నదానితో చేయగలిగినది చేసింది’ అనే గ్రీకు నుడికార భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: προέλαβεν
  choice: ముందుగానే
  rationale: ఆ పని సమాధికి ముందు జరిగిందనే కాలపూర్వక భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; కదలిక భావాన్ని అనవసరంగా చేర్చదు.
- source_word: μυρίσαι
  choice: పరిమళ తైలంతో అభిషేకించింది
  rationale: μυρίζω ఇక్కడ సుగంధ ద్రవ్యం లేదా తైలాన్ని దేహానికి పూయడాన్ని సూచిస్తుంది. ‘అభిషేకించింది’ సందర్భోచితం; ‘పరిమళ తైలంతో’ అనడం ఆధునిక పాఠకునికి చర్యను స్పష్టం చేస్తుంది.
- source_word: τὸ σῶμά μου
  choice: నా దేహాన్ని
  rationale: మూలంలోని ప్రత్యక్ష కర్మపదబంధానికి సహజమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: εἰς τὸν ἐνταφιασμόν
  choice: సమాధి కోసం
  rationale: సమాధి చేయడానికి సిద్ధపరచే ఉద్దేశాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; సందర్భంలో ‘నా’ అనేది ఇప్పటికే ‘నా దేహాన్ని’ ద్వారా స్పష్టమవుతుంది.
theological_decisions:
- issue: గ్రీకులో ఈ వాక్యంలో స్పష్టంగా లేని స్త్రీ కర్తను సందర్భం ఆధారంగా తెలుగులో వ్యక్తపరచడం
  choice: ఆమె ... చేసింది; ... అభిషేకించింది
  alternative: తన వద్ద ఉన్నది చేసింది; నా దేహాన్ని ముందుగానే అభిషేకించింది
  rationale: ముందరి సందర్భం కర్త స్త్రీ అని స్పష్టం చేస్తుంది. సహజమైన తెలుగుకు ‘ఆమె’ అవసరం; ఇది కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: ὃ ἔσχεν ἐποίησεν అనే నుడికారంలోని సామర్థ్య భావం మరియు అక్షరార్థ భావం
  choice: తనకు చేతనైనది చేసింది
  alternative: తన వద్ద ఉన్నది చేసింది
  rationale: ప్రధాన పాఠంలో నుడికార భావాన్ని సహజంగా అందించి, మూలంలోని ‘ఉన్నది/కలిగినది’ అనే నిజమైన అక్షరార్థ అవకాశాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గౌరవప్రదంగా రూపొందించబడింది. ‘పరిమళ తైలం’ burial-anointing సందర్భాన్ని స్పష్టం చేస్తుంది.
