source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ⸀εὐθὺς προσελθὼν αὐτῷ λέγει· ⸀Ῥαββί, καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/045.yaml
  text: And when he came[a], he immediately went up to him and said, “Rabbi!” and kissed him repeatedly.
translation:
  language: te
  text: అతడు వచ్చిన వెంటనే యేసు దగ్గరికి వెళ్లి, “రబ్బీ!” అని పలికి, ఆయనను గాఢంగా ముద్దుపెట్టుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పదేపదే ముద్దుపెట్టుకున్నాడు.” ఇక్కడి గ్రీకు క్రియ సాధారణంగా “ముద్దుపెట్టుకున్నాడు” అనేదానికంటే ఎక్కువ ఉద్ఘాటన కలది; అది పదేపదే లేదా గాఢంగా ముద్దుపెట్టుకోవడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: అతడు వచ్చి
  rationale: ἔρχομαι యొక్క భూతకాలిక క్రియావిశేషణ రూపం సంఘటనల క్రమాన్ని సూచిస్తుంది. ‘వచ్చి’ అనేది తెలుగులో సహజంగా ఆ క్రమాన్ని నిలుపుతుంది.
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు వర్ణనలోని వేగాన్ని, తక్షణ చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: προσελθὼν αὐτῷ
  choice: యేసు దగ్గరికి వెళ్లి
  rationale: యేసు వైపు భౌతికంగా సమీపించడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. సందర్భంలోని సర్వనామ సూచనను స్పష్టంచేయడానికి ‘యేసు’ వాడబడింది.
- source_word: λέγει
  choice: అని చెప్పి
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నా, తెలుగు కథన ప్రవాహంలో భూతకాల సంబంధ రూపం సహజంగా ఉంటుంది.
- source_word: Ῥαββί
  choice: రబ్బీ
  rationale: గ్రీకు పాఠంలోనూ లిప్యంతరీకరించబడిన చారిత్రక సంబోధనను అలాగే నిలుపుతుంది; దాని అర్థం ‘బోధకుడు’ అయినా, ఇక్కడ పలికిన బిరుదు యొక్క సాంస్కృతిక స్వరూపం ముఖ్యమైనది.
- source_word: κατεφίλησεν
  choice: గాఢంగా ముద్దుపెట్టుకున్నాడు
  rationale: καταφιλέω సాధారణ ‘ముద్దుపెట్టుకోవడం’ కంటే బలమైన లేదా ప్రత్యేకంగా ప్రదర్శితమైన ముద్దును సూచించగలదు. ‘గాఢంగా’ దాని ఉద్ఘాటనను తెలియజేస్తుంది; పునరావృతమనే ఒక్క అర్థానికే పరిమితం చేయదు.
theological_decisions:
- issue: యూదా పలికిన Ῥαββί అనే సంబోధన
  choice: రబ్బీ
  alternative: బోధకుడా
  rationale: దృశ్యంలో పలికిన సెమిటిక్ బిరుదును నిలుపడం చారిత్రక నేపథ్యాన్ని, ఆ సంబోధనలోని కథన వ్యంగ్యాన్ని వ్యాఖ్యానంతో విస్తరించకుండా కాపాడుతుంది.
- issue: κατεφίλησεν యొక్క ఉద్ఘాటిత భావం
  choice: గాఢంగా ముద్దుపెట్టుకున్నాడు
  alternative: పదేపదే ముద్దుపెట్టుకున్నాడు
  rationale: క్రియ బలమైన లేదా పునరావృత ముద్దును సూచించవచ్చు. ప్రధాన పాఠం ఉద్ఘాటనను నిలుపుతూ పునరావృతాన్ని నిర్బంధంగా నిర్ణయించదు; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘రబ్బీ’ చారిత్రక సంబోధనగా నిలుపబడింది; యూదా చర్య వెనుక భావాన్ని అనవసరంగా వ్యాఖ్యానించకుండా గ్రీకు క్రియలోని ఉద్ఘాటనను పాఠం మరియు పాదసూచిక ద్వారా తెలియజేశారు.
