revisions:
- from: ఆయన ఇంకా మాట్లాడుతుండగానే, వెంటనే పన్నెండుమందిలో ఒకడైన యూదా వచ్చాడు.[a] అతనితోపాటు ప్రధాన యాజకుల దగ్గర నుంచి, శాస్త్రుల దగ్గర నుంచి, పెద్దల దగ్గర నుంచి కత్తులు, దుడ్డుకర్రలు పట్టుకున్న ఒక గుంపు వచ్చింది.[b][c]
  to: ఆయన ఇంకా మాట్లాడుతుండగానే, వెంటనే పన్నెండుగురిలో ఒకడైన యూదా వచ్చాడు.[a] అతనితో పాటు కత్తులు, కర్రలు పట్టుకున్న ఒక గుంపు కూడా వచ్చింది.[b][c] ఆ గుంపు ప్రధాన యాజకులు, శాస్త్రులు, పెద్దల నుండి వచ్చింది.[d]
  rationale: The revision preserves the Greek’s immediate timing, Judas’s designation as one of the Twelve, the crowd’s weapons, and the authorities’ source/authorization connection. It improves idiomatic Telugu, avoids repeated and overly locative wording, and supplies a lexical note for ξύλα.
