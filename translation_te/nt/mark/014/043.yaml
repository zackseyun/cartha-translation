  text: Καὶ ⸀εὐθὺς ἔτι αὐτοῦ λαλοῦντος παραγίνεται ⸀Ἰούδας ⸀εἷς τῶν δώδεκα καὶ μετ’ αὐτοῦ ⸀ὄχλος μετὰ μαχαιρῶν καὶ ξύλων παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/043.yaml
  text: And immediately[a], while he was still speaking, Judas arrived, one of the Twelve, and with him a crowd with swords and clubs[d][c][b], from the chief priests and the scribes and the elders.
translation:
  language: te
  text: ఆయన ఇంకా మాట్లాడుతుండగానే, వెంటనే పన్నెండుగురిలో ఒకడైన యూదా వచ్చాడు.[a] అతనితో పాటు కత్తులు, కర్రలు పట్టుకున్న ఒక గుంపు కూడా వచ్చింది.[b][c] ఆ గుంపు ప్రధాన యాజకులు, శాస్త్రులు, పెద్దల నుండి వచ్చింది.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వచ్చాడు’ అని అనువదించిన గ్రీకు క్రియ అక్షరార్థంగా వర్తమాన కాలంలో ‘వస్తాడు/వస్తున్నాడు’ అని ఉంది; గత సంఘటనను సజీవంగా వర్ణించే చారిత్రక వర్తమానం ఇది.
    reason: lexical_alternative
  - marker: b
    text: ‘గుంపు’కు ‘మూక’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం స్వతహాగా ‘గుంపు’ అని అర్థం; సందర్భం మాత్రం ఆ గుంపు శత్రుత్వాన్ని చూపిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘కర్రలు’ అని అనువదించిన గ్రీకు పదానికి అక్షరార్థంగా ‘చెక్క వస్తువులు/చెక్క’ అనే అర్థం ఉంది; ఇక్కడ అది ఆయుధాలుగా ఉపయోగించే కర్రలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: d
    text: ‘నుండి’ అనే మాట ఆ గుంపు యొక్క మూలాన్ని లేదా అధికార సంబంధాన్ని సూచిస్తుంది; ‘ప్రధాన యాజకులు, శాస్త్రులు, పెద్దలు పంపిన’ అని కూడా భావించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు కథనంలోని ఆకస్మికతను, వేగాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: ఆయన ఇంకా మాట్లాడుతుండగానే
  rationale: సమకాలికంగా జరుగుతున్న చర్యను తెలిపే గ్రీకు genitive absolute నిర్మాణాన్ని సహజంగా వ్యక్తం చేస్తుంది; ἔτι భావాన్ని ‘ఇంకా’ నిలుపుతుంది.
- source_word: παραγίνεται
  choice: వచ్చాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని తెలుగు కథనానికి సహజమైన భూతకాలంలో అందిస్తుంది; ‘వచ్చాడు’ సన్నివేశంలో ప్రవేశించిన భావాన్ని స్పష్టంగా చెబుతుంది.
- source_word: εἷς τῶν δώδεκα
  choice: పన్నెండుమందిలో ఒకడైన
  rationale: ‘శిష్యుడు’ అనే పదాన్ని అదనంగా చేర్చకుండా గ్రీకు మూలంలోని సంక్షిప్త గుర్తింపును నిలుపుతుంది.
- source_word: ὄχλος
  choice: ఒక గుంపు
  rationale: పదానికి ప్రాథమికంగా ‘జనసమూహం/గుంపు’ అనే అర్థం ఉంది; ‘మూక’ అని అనువదిస్తే పదంలోనే లేని శత్రుత్వ భావం ముందుగానే బలపడుతుంది.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: కత్తులు, దుడ్డుకర్రలు పట్టుకున్న
  rationale: ఆయుధాలతో వచ్చిన భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ξύλα అక్షరార్థంగా ‘చెక్క వస్తువులు’ అయినా ఈ సందర్భంలో కొట్టడానికి ఉపయోగించే కర్రలను సూచిస్తుంది.
- source_word: παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων
  choice: ప్రధాన యాజకుల దగ్గర నుంచి, శాస్త్రుల దగ్గర నుంచి, పెద్దల దగ్గర నుంచి
  rationale: παρά + genitive తెలిపే మూలం లేదా అధికార సంబంధాన్ని నేరుగా నిలుపుతుంది; ‘పంపబడిన’ అని చెప్పి మూలంలో స్పష్టంగా లేని చర్యను చేర్చదు.
- source_word: ἀρχιερέων
  choice: ప్రధాన యాజకులు
  rationale: ఒకేసారి అనేకమంది మహాయాజకులు అనే భావం కాకుండా యాజక నాయకవర్గాన్ని సూచిస్తుంది.
- source_word: γραμματέων
  choice: శాస్త్రులు
  rationale: యూదుల ధర్మశాస్త్ర సంబంధిత లేఖకులు, పండితులు అనే చారిత్రక పదవిని నేరుగా సూచించే స్థిరమైన తెలుగు పదం.
- source_word: πρεσβυτέρων
  choice: పెద్దలు
  rationale: ఈ సంస్థాగత సందర్భంలో గుర్తింపు పొందిన యూదు నాయకులను సూచించే సహజమైన ప్రత్యక్ష సమానార్థకం.
theological_decisions:
- issue: παραγίνεται అనే చారిత్రక వర్తమాన కాలం
  choice: తెలుగు కథనంలో భూతకాలంగా ‘వచ్చాడు’
  alternative: గ్రీకు వర్ణనా సజీవతను ప్రతిబింబిస్తూ ‘వస్తున్నాడు/వస్తాడు’
  rationale: సందర్భం గతకాల కథనం కావడంతో తెలుగులో భూతకాలం సహజం; ఇది సంఘటన భావాన్ని మార్చకుండా గ్రీకు శైలీ లక్షణాన్ని లక్ష్యభాష కథనరీతికి సరిపరుస్తుంది.
- issue: నాయకులతో గుంపుకు ఉన్న సంబంధంలో παρά యొక్క భావం
  choice: ‘దగ్గర నుంచి’ అని మూలం/అధికార సంబంధాన్ని నిలుపడం
  alternative: ‘పంపిన’ లేదా ‘పంపబడిన’ అని స్పష్టీకరించడం
  rationale: నాయకులే గుంపుకు మూలం లేదా అధికారం అని వాక్యం సూచిస్తుంది; వారు పంపిన విధానాన్ని మాత్రం స్పష్టంగా చెప్పదు. కాబట్టి వ్యాఖ్యానాత్మక విస్తరణను నివారించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే కథనశైలి. మూలంలోని ‘వెంటనే’ భావం, యూదా గుర్తింపు, నాయకవర్గాల మూడు వేర్వేరు పేర్లు నిలుపబడ్డాయి. తెలుగు వాక్యస్పష్టత కోసం గ్రీకులో ఒక్కసారి ఉన్న క్రియను యూదా రాకకు, అతనితో వచ్చిన గుంపుకు అనుగుణంగా సహజంగా అమర్చాం.
