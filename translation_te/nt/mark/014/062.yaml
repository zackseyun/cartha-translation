id: MRK.14.62
reference: Mark 14:62
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἐγώ εἰμι, καὶ ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν καθήμενον τῆς δυνάμεως καὶ ἐρχόμενον μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/062.yaml
  text: And Jesus said[a], “I am[c][b], and you will see the Son of Man seated at the right hand of Power and coming with the clouds of heaven.”
translation:
  language: te
  text: అందుకు యేసు, “నేనే[a]. మనుష్యకుమారుడు ‘శక్తి’[b] కుడిపార్శ్వంలో కూర్చుని ఉండడాన్ని, ఆకాశపు మేఘాలతో రావడాన్ని మీరు చూస్తారు[c]” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ఆయననే.” గ్రీకు పాఠంలో ‘నేనే’ అని మాత్రమే ఉంది.
    reason: alternative_reading
  - marker: b
    text: ఇక్కడ ‘శక్తి’ అనేది దేవుణ్ణి గౌరవపూర్వకంగా సూచించే పరోక్ష నామం.
    reason: cultural_note
  - marker: c
    text: ఈ మాటలు కీర్తన 110:1; దానియేలు 7:13లను ప్రతిధ్వనింపజేస్తాయి.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: నేనే
  rationale: గ్రీకులో విధేయపదం లేకుండా ఉన్న బలమైన ప్రత్యక్ష జవాబును సహజమైన తెలుగులో ‘నేనే’ తెలియజేస్తుంది. ఇది ప్రధానయాజకుని ప్రశ్నకు ఇచ్చిన అంగీకార జవాబును చూపుతూనే, వాక్యంలో ఉండగల మరింత లోతైన ప్రతిధ్వనిని నిర్బంధంగా నిర్వచించదు.
- source_word: ὄψεσθε
  choice: మీరు చూస్తారు
  rationale: భవిష్యత్తులో ప్రత్యక్షంగా చూడటాన్ని సూచించే సరళమైన, సహజమైన సమానార్థకం.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: యేసు తనను గురించి ఉపయోగించిన స్థిరమైన బైబిలు బిరుదును, దానియేలు 7తో ఉన్న సంబంధాన్ని కాపాడుతుంది.
- source_word: ἐκ δεξιῶν
  choice: కుడివైపున
  rationale: గౌరవం, అధికారానికి సంబంధించిన స్థానాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τῆς δυνάμεως
  choice: ‘శక్తి’కి
  rationale: దేవుని నేరుగా పేర్కొనకుండా గౌరవపూర్వకంగా సూచించే మూలపద ప్రయోగాన్ని నిలుపుతుంది. ఉద్ధరణ చిహ్నాలు ఇది సాధారణ శక్తిని కాక ప్రత్యేక గౌరవసూచక నామాన్ని సూచిస్తోందని తెలియజేస్తాయి.
- source_word: καθήμενον
  choice: కూర్చుని ఉండటాన్ని
  rationale: కొనసాగుతున్న ఆసీన స్థితిని తెలియజేస్తుంది; సందర్భంలో అది అధికారపూర్వక సింహాసనస్థితిని సూచిస్తుంది.
- source_word: ἐρχόμενον
  choice: రావటాన్ని
  rationale: దానియేలు గ్రంథంలోని అంత్యకాల సంబంధిత ప్రతిధ్వనిని కాపాడే సూటి అనువాదం.
- source_word: μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: ఆకాశ మేఘాలతో
  rationale: మూలంలోని దృశ్యాన్ని, దానియేలు 7:13తో ఉన్న సంబంధాన్ని సంక్షిప్తంగా, సహజంగా కాపాడుతుంది.
- source_word: καὶ ... καὶ
  choice: -టాన్నీ ... -టాన్నీ
  rationale: ఆసీనుడై ఉండటం, రావడం అనే రెండు సమన్వయ దృశ్యాలను తెలుగులో సమాన బరువుతో అనుసంధానిస్తుంది.
theological_decisions:
- issue: Ἐγώ εἰμι అనే మాటను సాధారణ అంగీకారంగా అనువదించాలా, విస్తరించిన గుర్తింపుగా అనువదించాలా
  choice: ప్రధాన పాఠంలో ‘నేనే’
  alternative: ‘నేను ఆయననే’ లేదా ‘అవును, నేనే’
  rationale: గ్రీకు పాఠంలో స్పష్టమైన విధేయపదం లేదు. ‘నేనే’ తక్షణ ప్రశ్నకు సమాధానాన్ని సహజంగా ఇస్తూ, వాక్యానికి ఉండగల విస్తృత దైవశాస్త్ర ప్రతిధ్వనిని అతిగా నిర్ధారించకుండా ఉంచుతుంది.
- issue: τῆς δυνάμεως ఎవరిని సూచిస్తుందో ఎంత స్పష్టంగా చెప్పాలి
  choice: ‘శక్తి’ అనే గౌరవసూచక పరోక్ష నామాన్ని నిలుపడం
  alternative: ‘దేవుడు’ లేదా ‘సర్వశక్తిమంతుడు’
  rationale: మూలపాఠం దేవుని నేరుగా పేర్కొనకుండా గౌరవపూర్వక పరోక్ష పదాన్ని ఉపయోగిస్తుంది. దానిని ప్రత్యక్షంగా ‘దేవుడు’గా మార్చకుండా మూలంలోని భాషా, ధార్మిక ఉద్వేగాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే వాక్యనిర్మాణం వాడబడింది. ‘శక్తి’ అనే అసాధారణ గౌరవసూచక పదానికి ఉద్ధరణ చిహ్నాలు, పాదసూచిక వివరణ ఇవ్వబడ్డాయి; దానిని ‘దేవుడు’గా మార్చి మూలంలోని పరోక్షతను తొలగించలేదు.
