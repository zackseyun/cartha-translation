  to: అందుకు యేసు, “నేనే[a]. మనుష్యకుమారుడు ‘శక్తి’[b] కుడిపార్శ్వంలో కూర్చుని ఉండడాన్ని, ఆకాశపు మేఘాలతో రావడాన్ని మీరు చూస్తారు[c]” అని చెప్పాడు.
  rationale: 'సవరణ మూలంలోని వాక్యనిర్మాణాన్ని తెలుగులో స్పష్టంగా ప్రతిబింబిస్తుంది: చూడబడేది మనుష్యకుమారుడే; ఆయన శక్తి కుడిపార్శ్వంలో కూర్చుని ఉండటం మరియు ఆకాశపు మేఘాలతో రావడం ఆయనను విశేషిస్తాయి. ‘శక్తి’ అనే పరోక్ష దైవసూచనను మార్చలేదు; దాని పాదసూచిక ఆ పదానికే అమర్చబడింది. ‘నేనే’లో ఉన్న సంక్షిప్తత, సంభావ్య ప్రతిధ్వని రెండూ కాపాడబడ్డాయి.'
