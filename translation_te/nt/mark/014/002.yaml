translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. గ్రీకు వాక్యంలోని సంక్షిప్త ‘వద్దు’ నిర్మాణం, కొనసాగుతున్న మాటల భావం, అలాగే τοῦ λαοῦ లోని నిజమైన వ్యాకరణ సందిగ్ధత నిలుపబడ్డాయి.
