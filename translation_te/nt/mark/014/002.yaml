source:
  edition: SBLGNT
  text: ἔλεγον ⸀γάρ· Μὴ ἐν τῇ ἑορτῇ, μήποτε ⸂ἔσται θόρυβος⸃ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/002.yaml
  text: For they were saying[a], “Not during the feast, lest there be an uproar from the people.”
translation:
  language: te
  text: ఎందుకంటే వారు, “పండుగ సమయంలో కాదు; ప్రజల నుండి అల్లకల్లోలం చెలరేగుతుందేమో[a]” అని చెబుతూ ఉండేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజల మధ్య.” గ్రీకులో షష్ఠీ విభక్తిలో ఉన్న τοῦ λαοῦ, అల్లకల్లోలం ప్రజల నుండి పుడుతుందని గానీ, వారి మధ్య జరుగుతుందని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: చెప్పుకుంటూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పదేపదే జరిగిన మాటలను సూచిస్తుంది; ఈ తెలుగు ప్రయోగం ఆ కొనసాగింపు భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను జోడించే అనుసంధాన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: Μὴ
  choice: వద్దు
  rationale: ‘అప్పుడు చేయవద్దు’ అనే అంతర్లీన భావంతో ఉన్న సంక్షిప్త నిషేధాన్ని తెలుగులో సహజంగా, అంతే క్లుప్తంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ ἑορτῇ
  choice: పండుగ సమయంలో
  rationale: ἐν ఇక్కడ కాలార్థకంగా ఉంది; సందర్భంలో పండుగ కొనసాగే కాలాన్ని సూచిస్తున్నందున ఈ అనువాదం సహజంగా ఉంటుంది.
- source_word: μήποτε
  choice: …చెలరేగుతుందేమో
  rationale: జరుగుతుందని భయపడుతున్న ఫలితాన్ని సూచిస్తుంది; తెలుగులో ‘ఏమో’ ఆ ఆందోళనతో కూడిన సంభావ్యతను సహజంగా తెలియజేస్తుంది.
- source_word: ἔσται
  choice: చెలరేగుతుంది
  rationale: భవిష్యత్తులో సంభవించగల పరిస్థితిని సూచించే భావం ‘ఏమో’తో కలిసి తెలుగులో సహజంగా వ్యక్తమవుతుంది.
- source_word: θόρυβος
  choice: అల్లకల్లోలం
  rationale: గందరగోళంతో కూడిన బహిరంగ కలకలాన్ని సూచిస్తుంది; పూర్తి స్థాయి తిరుగుబాటు అని అతిశయింపకుండా మూలపదపు తీవ్రతను నిలుపుతుంది.
- source_word: τοῦ λαοῦ
  choice: ప్రజల నుంచి
  rationale: షష్ఠీ విభక్తి కలకలం ప్రజల నుంచి పుట్టవచ్చనే మూలార్థాన్ని సూచించగలదు; ఈ ఎంపిక ఆ మూలసంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
