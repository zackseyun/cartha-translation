review_pass:
  verdict: revise
  source_fidelity: 'The main sense is accurately conveyed: the priestly leaders and the entire council seek hostile testimony against Jesus with the purpose of putting him to death. However, the draft''s final “దొరకలేదు” is a simple completed past and does not adequately represent the imperfect ἠύρισκον (“were not finding”). The revision retains the ongoing/repeated force through “వెదుకుతూనే ఉన్నారు” and gives a natural contrasting result.'
  naturalness: The revised wording is clear, modern standard Telugu and fits formal narrative prose. “యేసుకు వ్యతిరేకంగా సాక్ష్యం కోసం” is more naturally ordered than placing “యేసును చంపేందుకు” before the hostile-testimony phrase.
  terminology: “ప్రధాన యాజకులు” accurately reflects the plural ἀρχιερεῖς. “మహాసభ” is a suitable meaning-based rendering of συνέδριον in this setting; the footnote supplies “సన్హెద్రిన్” as the conventional historical designation. “సాక్ష్యం” properly reflects judicial μαρτυρία.
  issues:
  - severity: medium
    issue: The final clause uses a simple completed past.
    rationale: “వారికి ఏ సాక్ష్యమూ దొరకలేదు” can describe the overall outcome, but it does not itself preserve the imperfect/durative force of καὶ οὐχ ηὕρισκον. Revising the preceding verbal phrase to “వెదుకుతూనే ఉన్నారు” clearly represents their sustained search while retaining idiomatic Telugu.
  - severity: low
    issue: The order of purpose and testimony phrases is less natural in Telugu.
    rationale: “యేసును చంపేందుకు ఆయనకు వ్యతిరేకంగా సాక్ష్యం” is understandable, but “యేసుకు వ్యతిరేకంగా సాక్ష్యం కోసం ... యేసును చంపడానికి” makes the syntactic relationships immediately clear.
  revised_text: ప్రధాన యాజకులూ, మహాసభ అంతా[a] యేసుకు వ్యతిరేకంగా సాక్ష్యం కోసం వెదుకుతూనే ఉన్నారు, ఆయనను చంపడానికి; కానీ వారికి ఏ సాక్ష్యమూ దొరకలేదు.
  revised_footnotes:
  - marker: a
    text: లేదా, మరింత నిర్దిష్టంగా, “సన్హెద్రిన్ అంతా.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek sequence of hostile testimony and purpose, represents the ongoing search naturally with “వెదుకుతూనే ఉన్నారు,” and retains the failure to find testimony. The footnote is streamlined to give the standard historical name without redundantly adding “సభ.”
