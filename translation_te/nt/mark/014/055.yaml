revisions:
- from: ప్రధాన యాజకులూ, మహాసభ అంతా[a] యేసును చంపేందుకు ఆయనకు వ్యతిరేకంగా సాక్ష్యం వెదుకుతూ ఉన్నారు; కానీ వారికి ఏ సాక్ష్యమూ దొరకలేదు.
  to: ప్రధాన యాజకులూ, మహాసభ అంతా[a] యేసుకు వ్యతిరేకంగా సాక్ష్యం కోసం వెదుకుతూనే ఉన్నారు, ఆయనను చంపడానికి; కానీ వారికి ఏ సాక్ష్యమూ దొరకలేదు.
  rationale: The revision preserves the Greek sequence of hostile testimony and purpose, represents the ongoing search naturally with “వెదుకుతూనే ఉన్నారు,” and retains the failure to find testimony. The footnote is streamlined to give the standard historical name without redundantly adding “సభ.”
