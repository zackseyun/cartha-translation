source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς καὶ ὅλον τὸ συνέδριον ἐζήτουν κατὰ τοῦ Ἰησοῦ μαρτυρίαν εἰς τὸ θανατῶσαι αὐτόν, καὶ οὐχ ηὕρισκον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/055.yaml
  text: The chief priests and the whole council were seeking testimony against Jesus in order to put him to death, and they were not finding any.
translation:
  language: te
  text: ప్రధాన యాజకులూ, మహాసభ అంతా[a] యేసుకు వ్యతిరేకంగా సాక్ష్యం కోసం వెదుకుతూనే ఉన్నారు, ఆయనను చంపడానికి; కానీ వారికి ఏ సాక్ష్యమూ దొరకలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత నిర్దిష్టంగా, “సన్హెద్రిన్ అంతా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: ప్రధాన యాజకులూ
  rationale: δέ స్వల్ప కథన సంధానాన్ని సూచిస్తుంది; తెలుగులో ప్రత్యేక కాలసూచక పదాన్ని చేర్చకుండా వాక్యప్రవాహంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: యెరూషలేములోని యాజక నాయకవర్గాన్ని సూచించే బహువచనానికి ఇది స్పష్టమైన, ప్రామాణిక తెలుగు పదబంధం.
- source_word: ὅλον τὸ συνέδριον
  choice: మహాసభ అంతా
  rationale: συνέδριον అనే పాలక న్యాయసభ భావాన్ని పాఠకులకు అర్థమయ్యే తెలుగులో అందిస్తూ, ὅλον లోని సంపూర్ణతను ‘అంతా’ నిలుపుతుంది.
- source_word: ἐζήτουν
  choice: వెదుకుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న ప్రయత్నాన్ని ఈ ప్రయోగం నిలుపుతుంది.
- source_word: κατὰ τοῦ Ἰησοῦ μαρτυρίαν
  choice: యేసుకు వ్యతిరేకంగా సాక్ష్యం
  rationale: κατά యొక్క ప్రతికూల భావాన్నీ, న్యాయసందర్భంలో μαρτυρία సూచించే సాక్ష్యవాక్య భావాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς τὸ θανατῶσαι αὐτόν
  choice: యేసును చంపేందుకు
  rationale: εἰς τὸ తో వచ్చిన క్రియారూపం ఉద్దేశాన్ని సూచిస్తుంది; θανατόω యొక్క మూలార్థాన్ని అనవసరమైన న్యాయపద్ధతి వివరాలు చేర్చకుండా తెలుపుతుంది.
- source_word: καὶ οὐχ ηὕρισκον
  choice: కానీ వారికి ఏ సాక్ష్యమూ దొరకలేదు
  rationale: καί అక్షరార్థంగా సంధానకమైనప్పటికీ, వెదికినా దొరకలేదనే సందర్భోచిత వ్యతిరేకతను ‘కానీ’ సహజంగా చూపుతుంది. ‘ఏ సాక్ష్యమూ’ ముందు పేర్కొన్న సాక్ష్యాన్ని స్పష్టంగా తిరిగి సూచిస్తుంది.
theological_decisions:
- issue: συνέδριον గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో ‘మహాసభ’
  alternative: ‘సంహెద్రీను’
  rationale: గ్రీకు పదం పాలక న్యాయసభను సూచిస్తుంది. ప్రధాన పాఠ్యంలో అర్థాన్ని అనువదించడం ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది; చారిత్రక పారిభాషిక నామాన్ని పాదసూచికలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. కొనసాగుతున్న అన్వేషణను ‘వెదుకుతూ ఉన్నారు’తో నిలిపి, ఫలితం లేకపోవడాన్ని సహజమైన తెలుగు భూతకాలంతో తెలిపింది.
