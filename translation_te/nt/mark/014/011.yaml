id: MRK.14.11
reference: Mark 14:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐχάρησαν καὶ ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι. καὶ ἐζήτει πῶς ⸂αὐτὸν εὐκαίρως παραδοῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/011.yaml
  text: When they heard it[a], they rejoiced and promised to give him money[b]. And he began seeking how he might betray him at an opportune time.
translation:
  language: te
  text: వారు అది విని సంతోషించి, అతనికి డబ్బు[a] ఇస్తామని వాగ్దానం చేశారు. ఆయనను అనుకూలమైన సమయంలో ఎలా అప్పగించవచ్చో అతడు వెదకసాగాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వెండి.’ గ్రీకు పదం అక్షరార్థంగా వెండిని లేదా సాధారణంగా డబ్బును సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆయనను ద్రోహం చేయవచ్చో.’ గ్రీకు క్రియకు ‘అప్పగించు’ లేదా ‘చేతికి అప్పగించు’ అనే అర్థాలు ఉన్నాయి; యూదా చేసిన ఈ చర్య సందర్భంలో అది ద్రోహభావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἀκούσαντες
  choice: వారు అది విని
  rationale: δέతో కూడిన కృదంత ప్రయోగం ముందరి సందర్భంలోని యూదా ప్రతిపాదన విన్న ప్రధాన యాజకుల ప్రతిస్పందనను తెలియజేస్తుంది. తెలుగులో సహజంగా ఉండేందుకు సందర్భం నుంచి ‘అది’ చేర్చబడింది.
- source_word: ἐχάρησαν
  choice: సంతోషించి
  rationale: χαίρω ఇక్కడ వారి ఆనందాన్ని సూచిస్తుంది. ‘సంతోషించి’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, వారి నైతికంగా కలవరపరిచే ప్రతిస్పందనను తగ్గించదు.
- source_word: ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι
  choice: అతనికి డబ్బు ఇస్తామని వాగ్దానం చేశారు
  rationale: ἐπαγγέλλομαι ఇచ్చిన మాట లేదా వాగ్దానాన్ని సూచిస్తుంది. ἀργύριον సందర్భంలో చెల్లింపుగా ఇచ్చే ధనాన్ని సూచిస్తున్నందున ‘డబ్బు’ స్పష్టమైన ఆధునిక ప్రయోగం.
- source_word: ἀργύριον
  choice: డబ్బు
  rationale: ఈ పదానికి అక్షరార్థంగా ‘వెండి’ అనే అర్థం ఉన్నా, కొయినే గ్రీకులో సాధారణంగా ధనం లేదా డబ్బును కూడా సూచిస్తుంది. మార్కు నాణేల సంఖ్యగానీ మొత్తంగానీ చెప్పలేదు.
- source_word: ἐζήτει
  choice: వెదకసాగాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా ఆరంభమైన ప్రయత్నాన్ని సూచిస్తుంది. ‘వెదకసాగాడు’ కథనంలోని కొత్త, కొనసాగుతున్న చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πῶς ... εὐκαίρως
  choice: అనువైన సమయం కోసం
  rationale: గ్రీకు పదబంధం అప్పగింపును సాధించడానికి తగిన లేదా అనుకూల సందర్భాన్ని వెదకడాన్ని సూచిస్తుంది. తెలుగులో ‘అనువైన సమయం కోసం’ అనే రూపం ఆ ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: παραδοῖ
  choice: ద్రోహం చేసి అప్పగించడానికి
  rationale: παραδίδωμι ప్రాథమికంగా ‘అప్పగించు’ అని అర్థమివ్వగలదు; యూదా చర్య సందర్భంలో అది ద్రోహపూర్వక అప్పగింపు. రెండు భావాలను తెలుగులో కలిపి చెప్పడం చర్యనూ దాని సందర్భబలాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: యూదా చర్యలో παραδίδωμι అనువాదం
  choice: ద్రోహం చేసి అప్పగించడానికి
  alternative: అప్పగించడానికి
  rationale: ఈ కథనంలో ఇది తటస్థమైన బదిలీ కాదు; యేసు విరోధులతో యూదా రహస్యంగా సహకరించడం. ‘ద్రోహం చేసి అప్పగించడానికి’ అనేది ఆ సందర్భబలాన్ని వ్యక్తం చేస్తూనే, క్రియ యొక్క ప్రాథమిక ‘అప్పగించు’ భావాన్ని కూడా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. యేసును సూచించేందుకు ‘ఆయన’ వాడబడింది; యూదాకు సందర్భానుగుణంగా ‘అతడు’ వాడబడింది. మూలంలోని కొనసాగుతున్న ప్రయత్నాన్ని ‘వెదకసాగాడు’ నిలుపుతుంది. పాదసూచిక గుర్తులు సంబంధిత పదాల వెంట సరిగా ఉంచబడ్డాయి.
