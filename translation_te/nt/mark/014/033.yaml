source:
  edition: SBLGNT
  text: καὶ παραλαμβάνει τὸν Πέτρον καὶ ⸂Ἰάκωβον καὶ⸃ Ἰωάννην μετ’ ⸀αὐτοῦ, καὶ ἤρξατο ἐκθαμβεῖσθαι καὶ ἀδημονεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/033.yaml
  text: And he takes Peter and James and John with him[a], and he began to be greatly distressed and troubled,
translation:
  language: te
  text: ఆయన పేతురును, యాకోబును, యోహానును తనతో పాటు తీసుకువెళ్లాడు; ఆయన తీవ్రంగా దిగ్భ్రాంతి చెంది వ్యాకులపడడం మొదలుపెట్టాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తీవ్రంగా కలవరపడి వ్యాకులపడడం మొదలుపెట్టాడు.” మొదటి గ్రీకు క్రియ ఈ సందర్భంలో తీవ్రమైన దిగ్భ్రాంతి, కలవరం లేదా వేదనను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαμβάνει
  choice: తన వెంట తీసుకువెళ్లాడు
  rationale: ఎంచుకున్న సహచరులను తనతో తీసుకువెళ్లడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగు కథనానికి సహజమైన భూతకాలంలో ఇచ్చాం.
- source_word: μετ’ αὐτοῦ
  choice: తన వెంట
  rationale: పేతురు, యాకోబు, యోహాను యేసుతో కలిసి వెళ్లారని స్పష్టంగా, సంక్షిప్తంగా తెలుపుతుంది.
- source_word: ἤρξατο
  choice: మొదలుపెట్టాడు
  rationale: భావోద్వేగ స్థితి ఆ సమయంలో ఆరంభమైందనే ingressive భావాన్ని నిలుపుతుంది.
- source_word: ἐκθαμβεῖσθαι
  choice: తీవ్రంగా కలవరపడడం
  rationale: ఈ సందర్భంలో కేవలం ఆశ్చర్యం కాక, తీవ్రమైన దిగ్భ్రాంతి లేదా మానసిక కలతను సూచిస్తుంది. 'కలవరపడడం' సాధారణ పాఠకులకు సహజంగా ఉండగా 'తీవ్రంగా' దాని బలాన్ని నిలుపుతుంది.
- source_word: ἀδημονεῖν
  choice: వ్యాకులపడడం
  rationale: లోతైన అంతరంగ వేదన, ఆందోళన అనే భావాన్ని తెలియజేసి, ముందున్న క్రియతో పూర్తిగా కలిపివేయకుండా రెండవ భావోద్వేగ పదంగా నిలుస్తుంది.
- source_word: καὶ ... καὶ
  choice: పేతురును, యాకోబును, యోహానును ... కలవరపడడం, వ్యాకులపడడం
  rationale: పేర్ల జాబితా మరియు రెండు భావోద్వేగ క్రియల సమన్వయాన్ని తెలుగులో సహజమైన విరామచిహ్నాలు, అనుసంధానంతో ప్రతిబింబించాం; మార్కు వాక్యంలోని సమీకృత గమనాన్ని నిలిపాం.
theological_decisions:
- issue: గెత్సేమనెలో యేసు భావోద్వేగ స్థితి
  choice: నిజమైన, తీవ్రమైన మానవ కలతను ‘తీవ్రంగా కలవరపడడం, వ్యాకులపడడం’ అని నేరుగా అనువదించడం
  alternative: మృదువుగా ‘ఆశ్చర్యపడి కలత చెందడం’ లేదా మరింత వ్యాఖ్యానాత్మకంగా ‘భయభ్రాంతుడై వేదనపడడం’
  rationale: మూలంలోని రెండు బలమైన క్రియలను తగ్గించకుండా, అదే సమయంలో ‘భయం’ లేదా ‘భీతావహం’ వంటి సందర్భానుసారమైన కాని మరింత నిర్దిష్ట వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చకుండా ఉంచుతుంది. యేసు నిజమైన మానవ వేదనను పాఠ్యం చెప్పినట్టే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా అర్థమయ్యే కథన శైలి. గ్రీకు చారిత్రక వర్తమానానికి తెలుగు కథనంలో సహజమైన భూతకాలం వాడబడింది. రెండు భావోద్వేగ క్రియల ప్రత్యేకతను కాపాడాం; వాటి మధ్య ఉన్న భావసామీప్యాన్ని పూర్తిగా పరిష్కరించకుండా నిలిపాం.
