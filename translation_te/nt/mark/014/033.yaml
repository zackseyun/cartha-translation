revisions:
- from: ఆయన పేతురును, యాకోబును, యోహానును తన వెంట తీసుకువెళ్లాడు. అప్పుడు ఆయన తీవ్రంగా కలవరపడడం, వ్యాకులపడడం మొదలుపెట్టాడు.[a]
  to: ఆయన పేతురును, యాకోబును, యోహానును తనతో పాటు తీసుకువెళ్లాడు; ఆయన తీవ్రంగా దిగ్భ్రాంతి చెంది వ్యాకులపడడం మొదలుపెట్టాడు.[a]
  rationale: The revision removes the unsupported temporal adverb, retains the source’s two coordinated narrative actions, and strengthens the first emotional verb to reflect ἐκθαμβεῖσθαι’s sense of intense alarm or shock. It preserves the distinct second verb and the ingressive “మొదలుపెట్టాడు,” without importing theological interpretation.
