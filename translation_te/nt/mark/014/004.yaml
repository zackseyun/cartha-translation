translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘తమలో తాము’ ద్వారా మూలంలోని పరస్పర/అంతరంగ స్పందన అస్పష్టతను నిలిపి, ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం. రెండు పాదటిప్పణి సూచికలూ వచనాంతంలో చేర్చబడ్డాయి.
