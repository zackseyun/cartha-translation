source:
  edition: SBLGNT
  text: ἦσαν δέ τινες ἀγανακτοῦντες πρὸς ⸀ἑαυτούς· Εἰς τί ἡ ἀπώλεια αὕτη τοῦ μύρου γέγονεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/004.yaml
  text: 'But some were indignant among themselves: “Why has this waste of the perfume happened?”[a][b]'
translation:
  language: te
  text: 'అయితే, కొందరు తమలో తాము[a] ఆగ్రహంతో ఇలా అన్నారు: “ఈ పరిమళ తైలం[b] ఇలా వృథా కావడం ఎందుకు జరిగింది?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఒకరితో ఒకరు” లేదా “తమ అంతరంగంలో.” గ్రీకు పదబంధం ఆ సమూహంలో పరస్పరం ఫిర్యాదు చేసుకోవడాన్నిగానీ, అంతరంగ స్పందననుగానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “సుగంధ లేపనం.” గ్రీకు పదం సువాసనగల నూనెను లేదా లేపనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: అయితే ... అన్నారు
  rationale: δέ ఇక్కడ స్త్రీ చేసిన కార్యానికి ఎదురుగా వచ్చిన ప్రతిస్పందనను సూచిస్తూ కథనాన్ని కొనసాగిస్తుంది; ఆధునిక తెలుగులో ‘అయితే’ ఆ స్వల్ప వ్యతిరేక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τινες
  choice: కొందరు
  rationale: నిర్దిష్టంగా గుర్తించని బహువచన సమూహాన్ని సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: ἀγανακτοῦντες
  choice: ఆగ్రహిస్తూ
  rationale: ఈ పదం సాధారణ అసంతృప్తికంటే బలమైన, తప్పు జరిగిందనే భావంతో కూడిన కోపాన్ని సూచిస్తుంది.
- source_word: πρὸς ἑαυτούς
  choice: తమలో తాము
  rationale: గ్రీకు పదబంధం పరస్పరం ఫిర్యాదు చేసుకోవడం లేదా అంతరంగంలో స్పందించడం అనే రెండు ఛాయలనూ అనుమతిస్తుంది; ‘తమలో తాము’ ఆ అస్పష్టతను కొంతవరకు నిలుపుతుంది.
- source_word: Εἰς τί
  choice: ఎందుకు
  rationale: ఉద్దేశం లేదా ఫలితాన్ని ప్రశ్నించే ఈ ప్రయోగానికి సందర్భానుగుణమైన సహజ తెలుగు రూపం.
- source_word: ἡ ἀπώλεια αὕτη
  choice: ఇలా ... వృథా
  rationale: ἀπώλεια నష్టం, నాశనం, వృథా అనే అర్థాలు కలిగి ఉంది; విలువైన పరిమళ తైలం పోయబడిన సందర్భంలో మాట్లాడువారి విమర్శను ‘వృథా’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τοῦ μύρου
  choice: ఈ పరిమళ తైలాన్ని
  rationale: μύρον సువాసనగల నూనె లేదా లేపనాన్ని సూచిస్తుంది; ‘పరిమళ తైలం’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి దాని ద్రవరూపం, సువాసన రెండింటినీ తెలియజేస్తుంది.
- source_word: γέγονεν
  choice: చేశారు
  rationale: గ్రీకులో అక్షరార్థంగా ‘జరిగింది/కలిగింది’ అనే సంపూర్ణ క్రియ ఉన్నా, తెలుగులో ‘వృథా జరిగింది’ అసహజంగా ఉంటుంది; సందర్భంలోని కార్యాన్ని సహజంగా వ్యక్తం చేస్తూ పూర్తయిన ఘటనను సూచించడానికి ‘చేశారు’ ఎంచుకోబడింది.
