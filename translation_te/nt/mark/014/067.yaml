revisions:
- from: పేతురు చలి కాచుకుంటుండగా ఆమె అతణ్ణి చూసి, అతని వైపు తేరిపార చూసి, “నువ్వు కూడా నజరేయుడైన యేసుతో ఉన్నావు కదా” అని అంటుంది.
  to: పేతురు చలి కాచుకుంటుండగా ఆమె అతనిని చూసి, అతని వైపు తేరిపార చూసి, “నువ్వు కూడా నజరేయుడైన యేసుతో ఉన్నావు” అని అంటుంది.
