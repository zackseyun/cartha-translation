  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδοῦσα τὸν Πέτρον θερμαινόμενον ἐμβλέψασα αὐτῷ λέγει· Καὶ σὺ μετὰ τοῦ Ναζαρηνοῦ ⸂ἦσθα τοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/067.yaml
  text: And seeing Peter warming himself, she looked at him and says, “You also were with Jesus the Nazarene.”
translation:
  language: te
  text: పేతురు చలి కాచుకుంటుండగా ఆమె అతనిని చూసి, అతని వైపు తేరిపార చూసి, “నువ్వు కూడా నజరేయుడైన యేసుతో ఉన్నావు” అని అంటుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θερμαινόμενον
  choice: చలి కాచుకుంటుండగా
  rationale: నిప్పు దగ్గర వెచ్చబడుతున్న చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐμβλέψασα αὐτῷ
  choice: అతని వైపు తేరిపార చూసి
  rationale: సాధారణంగా చూడడం కంటే శ్రద్ధగా, నిశితంగా చూడడాన్ని సూచించే ἐμβλέπω భావాన్ని నిలుపుతుంది.
- source_word: λέγει
  choice: అని అంటుంది
  rationale: గ్రీకు చారిత్రక వర్తమాన కాలాన్ని మూలంలో ఉన్న కథన సజీవతతోనే ఉంచుతుంది.
- source_word: τοῦ Ναζαρηνοῦ ... τοῦ Ἰησοῦ
  choice: నజరేయుడైన యేసుతో
  rationale: పాఠంలోని పదక్రమ భేదం ఉన్నప్పటికీ యేసును నజరేయుడిగా గుర్తించే భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: Καὶ σὺ వాక్యబలం
  choice: నువ్వు కూడా ... ఉన్నావు కదా
  alternative: నువ్వు కూడా ... ఉన్నావు
  rationale: ఇది కేవలం తటస్థ ప్రకటన కాక, గుర్తించి నిలదీసే మాటగా సందర్భంలో వినిపిస్తుంది; ‘కదా’ ఆ ప్రయోగబలాన్ని సహజ తెలుగులో తెలియజేస్తుంది, కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ కథన సంభాషణకు తగిన సహజమైన ఏకవచన సంబోధన. మూలంలోని చారిత్రక వర్తమానం ఉద్దేశపూర్వకంగా నిలుపబడింది.
