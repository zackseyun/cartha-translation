id: MRK.14.60
reference: Mark 14:60
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἰς μέσον ἐπηρώτησεν τὸν Ἰησοῦν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/060.yaml
  text: And the high priest stood up in the middle and questioned Jesus[a], saying[c][b], “Do you answer nothing? What are these men testifying against you?”
translation:
  language: te
  text: అప్పుడు ప్రధాన యాజకుడు లేచి మధ్యలోకి వచ్చి యేసును ప్రశ్నిస్తూ, “నువ్వేమీ జవాబు చెప్పవా? వీరు నీకు వ్యతిరేకంగా ఏమి సాక్ష్యమిస్తున్నారు?” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: లేచి
  rationale: ఇక్కడ ప్రధాన యాజకుడు కూర్చున్న స్థితి నుండి లేచిన భౌతిక చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ ἀρχιερεὺς
  choice: ప్రధాన యాజకుడు
  rationale: ఈ న్యాయసభకు అధ్యక్షత వహిస్తున్న యూదుల ప్రధాన యాజకుణ్ణి సూచించే ప్రామాణిక తెలుగు పదబంధం.
- source_word: εἰς μέσον
  choice: సభ మధ్యలో నిలబడి
  rationale: అక్షరార్థమైన ‘మధ్యలోకి’ అనే గమన భావాన్ని సందర్భానుసారంగా విప్పి, సభ ఎదుట కేంద్ర స్థానాన్ని తీసుకున్నాడనే భావాన్ని స్పష్టం చేస్తుంది; ‘సభ’ సందర్భం నుండి సరఫరా చేయబడింది.
- source_word: ἐπηρώτησεν
  choice: ప్రశ్నిస్తూ
  rationale: న్యాయ విచారణ సందర్భంలోని గంభీరమైన ప్రశ్నించడాన్ని తెలియజేస్తుంది; ‘విచారిస్తూ’ కంటే మూలానికి దగ్గరగా, ‘అడుగుతూ’ కంటే సందర్భోచితంగా ఉంది.
- source_word: ἀποκρίνῃ οὐδέν
  choice: నువ్వేమీ జవాబు చెప్పవా?
  rationale: మూలంలోని సూటి, గద్దింపు ధోరణిగల ప్రశ్నను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: οὗτοί
  choice: వీరు
  rationale: సమక్షంలో ఉన్న నిర్దిష్ట సాక్షులను సూచిస్తుంది. తెలుగులో గౌరవ/మానవ బహువచన సర్వనామం సహజంగా ఉండి, మూలంలోని పురుష బహువచనాన్ని అనవసరంగా ‘ఈ పురుషులు’ అని భారంగా చేయదు.
- source_word: καταμαρτυροῦσιν
  choice: నీకు వ్యతిరేకంగా ఇస్తున్న సాక్ష్యం
  rationale: ఎవరికి వ్యతిరేకంగా సాక్ష్యమివ్వడం అనే న్యాయపరమైన భావాన్ని, కొనసాగుతున్న చర్యను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: οὗτοί అనే పురుష బహువచన సూచన
  choice: వీరు
  alternative: ఈ మనుషులు / ఈ పురుషులు
  rationale: మూలంలో నిర్దిష్ట సాక్షులు ఉద్దేశించబడ్డారు. అయితే తెలుగులో ‘వీరు’ వారిని స్పష్టంగా సూచిస్తుంది; ‘ఈ పురుషులు’ అని చేర్చడం అసహజంగా ఉండటమే కాక మూలం కంటే లింగాన్ని అధికంగా ముందుకు తెస్తుంది.
- issue: τί οὗτοί σου καταμαρτυροῦσιν అనే ప్రశ్న నిర్మాణం
  choice: వీరు నీకు వ్యతిరేకంగా ఇస్తున్న సాక్ష్యం ఏమిటి?
  alternative: వీరు నీకు వ్యతిరేకంగా ఏమి సాక్ష్యమిస్తున్నారు?
  rationale: τί దేనిని ప్రశ్నిస్తున్నదో గ్రీకు నిర్మాణంలో కొంత కఠినత ఉంది. ఎంచుకున్న రూపం సాక్ష్యంలోని విషయాన్ని అడుగుతున్న భావాన్ని సహజంగా వ్యక్తపరుస్తుంది; దానిని కేవలం ‘ఎందుకు’ అనే ప్రశ్నగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయసభ సందర్భానికి తగిన గంభీరతను ఉంచుతూ సామాన్య పాఠకులకు సులభంగా ఉండే రూపం. ‘నువ్వు’ అనే ఏకవచన సంబోధన ప్రధాన యాజకుని సవాలు చేసే ధోరణికి సరిపోతుంది. మూలపాఠంలోని నిజమైన భావసంభావ్యతలను వ్యాఖ్యానంతో కుదించకుండా అనువదించబడింది.
