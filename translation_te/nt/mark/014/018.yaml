id: MRK.14.18
reference: Mark 14:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀνακειμένων αὐτῶν καὶ ἐσθιόντων ⸂ὁ Ἰησοῦς εἶπεν⸃· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με ὁ ἐσθίων μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/018.yaml
  text: And while they were reclining and eating[a], Jesus said, “Truly I tell you[c][b], one of you will betray me—one who is eating with me.”
translation:
  language: te
  text: 'వారు వాలుకొని భోజనం చేస్తుండగా[a], యేసు ఇలా అన్నాడు: “నిజంగా నేను మీతో చెబుతున్నాను[b]: మీలో ఒకడు—నాతో కలిసి భోజనం చేస్తున్నవాడే—నన్ను అప్పగిస్తాడు[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఆ కాలంలో భోజనం చేసేటప్పుడు బల్ల దగ్గర వాలుకొని ఉండటం ఆనవాయితీ.
    reason: cultural_note
  - marker: b
    text: మరింత అక్షరార్థంగా, “ఆమేన్, నేను మీతో చెబుతున్నాను.”
    reason: lexical_alternative
  - marker: c
    text: ఈ గ్రీకు క్రియకు “చేతికి అప్పగించడం,” “పట్టివ్వడం,” లేదా సందర్భాన్ని బట్టి “ద్రోహం చేయడం” అనే అర్థాలు రావచ్చు. ఇక్కడ యేసుతో కలిసి భోజనం చేస్తున్న సన్నిహిత సహచరుని చర్యలో ద్రోహభావం స్పష్టంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακειμένων
  choice: వాలుగా కూర్చుని
  rationale: ప్రాచీనకాలపు అధికారిక భోజనాల్లో ఉండే వాలుకుని భోజనం చేసే భంగిమను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కేవలం ‘కూర్చుని’ అనడం వల్ల పోయే చారిత్రక వివరాన్ని నిలుపుతుంది.
- source_word: ἐσθιόντων / ἐσθίων
  choice: భోజనం చేస్తుండగా / భోజనం చేస్తున్నవాడే
  rationale: ‘తినడం’ అనే మూలభావాన్ని సహజంగా అందిస్తుంది. చివరి సపద క్రియావిశేషణాన్ని వ్యక్తిని సూచించే రూపంలో అనువదించి, యేసుతో కలిసి భోజనం చేస్తున్న వ్యక్తే అతనిని అప్పగిస్తాడనే నొక్కిచెప్పడాన్ని నిలిపింది.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: నేను మీతో నిశ్చయంగా చెప్తున్నాను
  rationale: యేసు పలికే గంభీరమైన ధృవీకరణ సూత్రం యొక్క బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. ‘ఆమేన్’ అనే మరింత అక్షరార్థ రూపం పాదసూచికలో ఉంచబడింది.
- source_word: εἷς ἐξ ὑμῶν
  choice: మీలో ఒకడు
  rationale: సమూహంలోని ఒక సభ్యుణ్ణి సూచించే గ్రీకు భాగార్థక ప్రయోగానికి స్పష్టమైన, సహజమైన తెలుగు రూపం.
- source_word: παραδώσει
  choice: నన్ను అప్పగిస్తాడు
  rationale: క్రియ యొక్క ప్రాథమికమైన ‘అప్పగించడం/చేతికి ఇవ్వడం’ అనే భావాన్ని నిలుపుతూ, ద్రోహమనే సందర్భార్థాన్ని పాఠకుడు గ్రహించేలా చేస్తుంది. మూలపదంలో ఉన్న భావపరిధిని అనవసరంగా ఒకే అర్థానికి పరిమితం చేయదు.
- source_word: μετ’ ἐμοῦ
  choice: నాతో కలిసి
  rationale: సహవాసం మరియు ఒకే భోజనంలో పాలుపంచుకోవడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: యేసు శ్రమల సందర్భంలో παραδώσει అనువాదం
  choice: నన్ను అప్పగిస్తాడు
  alternative: నాకు ద్రోహం చేస్తాడు / నన్ను ద్రోహంగా అప్పగిస్తాడు
  rationale: గ్రీకు క్రియ స్వతహాగా ‘అప్పగించు’ అని అర్థం ఇవ్వగలదు; ఇక్కడ యేసుతో భోజనం చేస్తున్న సన్నిహిత సహచరుడు ఆయనకు విరోధంగా వ్యవహరించబోతున్నందున ద్రోహభావం సందర్భంలో స్పష్టమవుతుంది. ప్రధాన పాఠంలో ‘అప్పగిస్తాడు’ అని ఉంచడం మూలంలోని భావపరిధిని కాపాడుతుంది; ద్రోహార్థాన్ని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన వాక్యనిర్మాణంతో పాటు గంభీరతను నిలిపింది. చారిత్రక భోజన భంగిమను ప్రధాన పాఠంలో ఉంచి పాదసూచికలో వివరించింది. ‘అప్పగిస్తాడు’ అనే రూపం మూలంలోని పదార్థ విస్తృతిని కాపాడుతూ సందర్భంలోని ద్రోహాన్ని అతిగా ముందే నిర్ణయించకుండా ఉంచుతుంది.
