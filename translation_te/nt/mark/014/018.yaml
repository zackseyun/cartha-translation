revisions:
- from: 'వారు వాలుగా కూర్చుని భోజనం చేస్తుండగా[a], యేసు ఇలా అన్నాడు: “నేను మీతో నిశ్చయంగా చెప్తున్నాను[b]: మీలో ఒకడు—నాతో కలిసి భోజనం చేస్తున్నవాడే—నన్ను అప్పగిస్తాడు[c].”'
  to: 'వారు వాలుకొని భోజనం చేస్తుండగా[a], యేసు ఇలా అన్నాడు: “నిజంగా నేను మీతో చెబుతున్నాను[b]: మీలో ఒకడు—నాతో కలిసి భోజనం చేస్తున్నవాడే—నన్ను అప్పగిస్తాడు[c].”'
  rationale: The revision improves modern Telugu flow, retains the source’s reclining-meal detail and solemn formula, and preserves the deliberate lexical breadth of παραδώσει. The revised note removes the unsupported specification of enemies while still transparently explaining the contextual sense of betrayal.
