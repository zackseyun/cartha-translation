source:
  edition: SBLGNT
  text: ὁ δὲ ἤρξατο ἀναθεματίζειν καὶ ὀμνύναι ὅτι Οὐκ οἶδα τὸν ἄνθρωπον τοῦτον ὃν λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/071.yaml
  text: But he began to call down curses and to swear[a], “I do not know this man you are talking about.”
translation:
  language: te
  text: అయితే అతడు శాపాలు పెట్టడం, ప్రమాణం చేయడం మొదలుపెట్టి[a], “మీరు చెప్పే ఈ మనిషి నాకు తెలియదు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “శపించడం”; బహుశా “తనపై శాపాన్ని ఆహ్వానించుకోవడం.” గ్రీకు పాఠం శాపం ఎవరిమీదో స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξατο
  choice: మొదలుపెట్టి
  rationale: పూరక క్రియలతో వచ్చిన ἄρχω యొక్క ఆరంభార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀναθεματίζειν
  choice: శాపాలు పెట్టడం
  rationale: ఇది కేవలం అసభ్య పదాలు వాడడాన్ని కాక, శాపాన్ని ఆహ్వానించడం లేదా విధించడాన్ని సూచిస్తుంది. శాపం ఎవరిమీదో గ్రీకు పాఠం స్పష్టంగా చెప్పనందున కర్మను చేర్చలేదు.
- source_word: ὀμνύναι
  choice: ఒట్టు వేయడం
  rationale: ప్రమాణపూర్వకంగా చెప్పడం అనే అర్థాన్ని సాధారణ ఆధునిక తెలుగు వాడుకలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὅτι
  choice: ప్రత్యక్ష ఉల్లేఖనం
  rationale: ఇక్కడ ὅτι పేతురు చేసిన ప్రమాణం, నిరాకరణలోని మాటలను పరిచయం చేస్తుంది; తెలుగులో ప్రత్యక్ష వాక్యం సహజంగా ఉంటుంది.
- source_word: Οὐκ οἶδα
  choice: నాకు తెలియదు
  rationale: గ్రీకులోని సాధారణ ‘తెలుసు’ అనే అర్థాన్ని నిలుపుతూ నిరాకరణ తీవ్రతను కాపాడుతుంది.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: ఈ మనిషి
  rationale: τοῦτον లోని నిర్దేశక బలాన్ని ‘ఈ’ నిలుపుతుంది; మూలంలో తప్పనిసరిగా లేని తృణీకార ఛాయను చేర్చదు.
- source_word: ὃν λέγετε
  choice: మీరు చెప్పే
  rationale: వారు ప్రస్తావిస్తున్న వ్యక్తిని సూచించే ఈ సంబంధ వాక్యాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ὁ δὲ
  choice: అయితే అతడు
  rationale: δέ సూచించే స్వల్ప వ్యత్యాసంతో కూడిన కథన పురోగతిని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἀναθεματίζειν లో శాపం యొక్క లక్ష్యం
  choice: శాపాలు పెట్టాడని చెప్పి, అవి ఎవరిమీదో పేర్కొనకపోవడం
  alternative: అతడు తనమీదే శాపాన్ని ఆహ్వానించుకున్నాడు; లేదా అతడు శపించాడు
  rationale: ప్రమాణ సందర్భంలో స్వీయశాపం భావం సాధ్యమే అయినా, గ్రీకు పాఠం శాపం యొక్క కర్మను స్పష్టంగా పేర్కొనదు. అందువల్ల ప్రధాన పాఠం ఆ అనిశ్చితిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కథన శైలిని వాడాం. ‘ఒట్టు వేయడం’ ప్రజావాడుకలో సహజంగా ఉండి ఇక్కడ ప్రమాణార్థాన్నే తెలియజేస్తుంది; ‘శాపాలు పెట్టడం’ మూలంలోని అస్పష్ట కర్మను అలాగే ఉంచుతుంది.
