  yaml_path: translation/nt/mark/014/039.yaml
  text: And again he went away and prayed[b][a], saying the same words.
translation:
  language: te
  text: ఆయన మళ్లీ వెళ్లి, అవే మాటలు పలుకుతూ ప్రార్థించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో అక్షరార్థంగా ‘అదే మాట’ అని ఉంది; ఇక్కడ అది ఆయన ప్రార్థనలో పలికిన అదే విషయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: మళ్లీ
  rationale: చర్య పునరావృతమైందని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀπελθὼν
  choice: వెళ్లి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన వెళ్లిపోవడాన్ని తెలుగు క్రమసూచక క్రియారూపంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: προσηύξατο
  choice: ప్రార్థించాడు
  rationale: ప్రσεύχομαι క్రియకు స్పష్టమైన, ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: τὸν αὐτὸν λόγον
  choice: అవే మాటలు
  rationale: λόγος ఏకవచనంలో ఉన్నా, ఇక్కడ అది ప్రార్థనలో పలికిన మాటల విషయాన్ని సూచిస్తుంది. ‘అవే మాటలు’ తెలుగులో సహజంగా ఉండి, ప్రార్థనలోని విషయమే పునరావృతమైందని స్పష్టం చేస్తుంది; మూలంలోని ఏకవచన రూపాన్ని పాదసూచికలో తెలియజేశాం.
- source_word: εἰπών
  choice: పలుకుతూ
  rationale: ప్రార్థన చేసే సమయంలో అదే విషయాన్ని పలికాడనే అనుబంధ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
