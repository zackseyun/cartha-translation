  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι οὐκέτι οὐ μὴ πίω ἐκ τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω καινὸν ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/025.yaml
  text: Truly I tell you[c][b][a], I will certainly not drink again from the fruit of the vine until that day when I drink it new in the kingdom of God.
translation:
  language: te
  text: '“నేను మీతో నిజంగా చెబుతున్నాను: దేవుని రాజ్యంలో దానిని కొత్తగా[c] తాగే ఆ రోజు వరకు, ద్రాక్షావల్లి ఫలమునుండి[b] ఇకపై ఎన్నటికీ తాగను[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ద్రాక్షావల్లి ఫలమునుండి ఇక మళ్లీ ఎప్పటికీ తాగను.” గ్రీకులో ఇక్కడ చాలా బలమైన నిరాకరణ ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ద్రాక్షావల్లి ఫలమునుండి.” సందర్భంలో ఇది భోజన సమయంలో ఉపయోగించిన ద్రాక్షావల్లి ఫలపు పానీయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “మళ్లీ కొత్తగా.” గ్రీకు విశేషణం “కొత్తది” అని అర్థమివ్వగలదు; దేవుని రాజ్యంలో ఉండే అంత్యకాల కొత్తదనాన్ని కూడా సూచిస్తుండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: నేను మీతో నిజంగా చెబుతున్నాను
  rationale: గంభీరమైన ప్రకటన సూత్రాన్ని ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది; ἀμήν యొక్క ధృవీకరణ బలాన్ని ‘నిజంగా’ నిలుపుతుంది.
- source_word: οὐκέτι οὐ μὴ πίω
  choice: ఇక ఎన్నటికీ తాగను
  rationale: οὐκέτι లోని ‘ఇకపై కాదు’ అనే కాలభావాన్నీ, οὐ μή లోని బలమైన భవిష్యత్ నిరాకరణనూ సంక్షిప్తమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἐκ τοῦ γενήματος τῆς ἀμπέλου
  choice: ద్రాక్షావల్లి ఫలపానీయాన్ని
  rationale: త్రాగే వస్తువును తెలుగులో సహజంగా సూచిస్తూ, మూలపాఠంలోని ‘ద్రాక్షావల్లి ఫలం/ఉత్పత్తి’ అనే వ్యక్తీకరణను నిలుపుతుంది; దానిని నేరుగా ‘ద్రాక్షారసం’ లేదా ‘ద్రాక్షామద్యం’ అని మరింత నిర్దిష్టం చేయదు.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: ఆ రోజు వరకు
  rationale: కాలపరిమితినీ ἐκείνης లోని సూచనాత్మక బలాన్నీ సూటిగా నిలుపుతుంది.
- source_word: ὅταν αὐτὸ πίνω
  choice: దానిని … తాగే
  rationale: αὐτό ముందుగా పేర్కొన్న పానీయాన్ని సూచించేటట్లు ఉంచి, ὅταν తో కూడిన వర్తమాన సుబ్జంక్టివ్‌కు ఉన్న భవిష్యత్ సందర్భాన్ని తెలుగులో సహజమైన సంబంధ క్రియారూపంతో తెలియజేస్తుంది.
- source_word: καινὸν
  choice: కొత్తగా
  rationale: కొత్తదనం లేదా మళ్లీ కొత్త సందర్భంలో త్రాగడం అనే రెండింటికీ అవకాశం ఉండేలా సంక్షిప్తంగా అనువదిస్తుంది; భావాన్ని ఒకే వివరణకు పరిమితం చేయదు.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: దేవుని రాజ్యంలో
  rationale: ప్రామాణిక నూతన నిబంధన పదబంధాన్ని దాని సంపూర్ణ దైవశాస్త్ర బరువుతో సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: καινὸν యొక్క భావం
  choice: ‘కొత్తగా’ అని ఉంచి, గుణాత్మకమైన కొత్తదనమా లేక ‘మళ్లీ/నూతనంగా’ త్రాగడమా అనేది ప్రధాన పాఠంలో నిర్ణయించలేదు.
  alternative: మళ్లీ; నూతన రాజ్య విందులో కొత్తదిగా
  rationale: καινός కొత్త గుణం లేదా స్థితిని సూచించగలదు; సందర్భం అంత్యకాల సంబంధమైన కొత్తదనాన్ని సూచించినప్పటికీ, అది ఎలా కొత్తదో వాక్యం స్పష్టంగా నిర్వచించదు.
- issue: ద్రాక్షావల్లి ఫలపు సూచన
  choice: ‘ద్రాక్షావల్లి ఫలపానీయం’ అని అనువదించబడింది.
  alternative: ద్రాక్షారసం; ద్రాక్షామద్యం
  rationale: సందర్భంలో ఇది పాత్రలోని పానీయమే అయినా, గ్రీకు పాఠం నేరుగా οἶνος (‘ద్రాక్షామద్యం’) అనదు. అందువల్ల మూలపాఠం కంటే మరింత నిర్దిష్టమైన పదాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. ‘నేను మీతో నిజంగా చెబుతున్నాను’ ప్రకటన గంభీరతను నిలుపుతుంది; ‘ఇక ఎన్నటికీ’ బలమైన నిరాకరణను సహజంగా వ్యక్తం చేస్తుంది. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
