id: MRK.14.1
reference: Mark 14:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἦν δὲ τὸ πάσχα καὶ τὰ ἄζυμα μετὰ δύο ἡμέρας. καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς πῶς αὐτὸν ἐν δόλῳ κρατήσαντες ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/001.yaml
  text: The Passover and Unleavened Bread were two days away[a]. And the chief priests and the scribes were seeking how, by deceit, they might arrest him and kill him[c][b],
translation:
  language: te
  text: పస్కా పండుగ, పులియని రొట్టెల పండుగ[b] రావడానికి ఇంకా రెండు రోజులు ఉన్నాయి[a]. ప్రధాన యాజకులూ శాస్త్రులూ యేసును మోసంతో పట్టుకొని[c] చంపడం ఎలా అని వెదుకుతున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘రెండు రోజుల తర్వాత.’ ఈ మాట పస్కా, పులియని రొట్టెల పండుగ సమీపించాయని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా ‘పులియనివి’; ఇది పులియని రొట్టెల పండుగను సూచించే ప్రాచలిత ప్రయోగం.
    reason: cultural_note
  - marker: c
    text: లేదా ‘మోసంతో స్వాధీనపరచుకొని’; ‘పట్టుకొని’ అనే పదానికి ‘అదుపులోకి తీసుకోవడం’ అనే భావం కూడా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: ఉన్నాయి
  rationale: δέ యొక్క స్వల్ప కథన సంధిని తెలుగులో ప్రత్యేక పదంతో బలవంతంగా చూపకుండా, సహజ వాక్యప్రవాహంలో ఉంచాం. రెండు పండుగపేర్లకు అనుగుణంగా బహువచన క్రియ వాడాం.
- source_word: τὸ πάσχα
  choice: పస్కా పండుగ
  rationale: యూదుల పస్కా ఆచరణను సూచించే స్థిరమైన, స్పష్టమైన తెలుగు రూపం.
- source_word: τὰ ἄζυμα
  choice: పులియని రొట్టెల పండుగ
  rationale: అక్షరార్థంగా ‘పులియనివి’ అయినా, ఈ సందర్భంలో పండుగను సూచిస్తుంది; సాధారణ పాఠకునికి ఉద్దేశం స్పష్టమయ్యేలా ‘పండుగ’ చేర్చాం.
- source_word: μετὰ δύο ἡμέρας
  choice: రావడానికి ఇంకా రెండు రోజులు
  rationale: అక్షరార్థమైన ‘రెండు రోజుల తర్వాత’ అనే భావాన్ని, సమీపిస్తున్న పండుగల సందర్భంలో సహజ ఆధునిక తెలుగులో తెలిపాం.
- source_word: ἐζήτουν
  choice: మార్గం వెదుకుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న ప్రయత్న భావాన్ని నిలిపాం.
- source_word: οἱ ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: ఆలయానికి చెందిన అగ్రస్థాయి యాజక అధికారులను సూచించే ప్రామాణిక తెలుగు పదబంధం.
- source_word: οἱ γραμματεῖς
  choice: శాస్త్రులు
  rationale: ధర్మశాస్త్ర ప్రతులు, వివరణలతో సంబంధమున్న వర్గానికి సంప్రదాయబద్ధమైనప్పటికీ ఇంకా గ్రాహ్యమైన ప్రత్యక్ష సమానార్థకం.
- source_word: ἐν δόλῳ
  choice: మోసపూరితంగా
  rationale: రహస్యత్వం మాత్రమే కాక మోసం, కపటం అనే నైతిక భావాన్ని కూడా నిలుపుతుంది.
- source_word: κρατήσαντες
  choice: పట్టుకొని
  rationale: ‘పట్టుకోవడం/స్వాధీనపరచుకోవడం’ అనే మూలార్థాన్ని నిలుపుతుంది; అధికారిక అరెస్టు అనే భావాన్ని అనవసరంగా మరీ నిర్దిష్టం చేయదు.
- source_word: ἀποκτείνωσιν
  choice: చంపడానికి
  rationale: క్రియ యొక్క సూటి అర్థాన్ని సహజ తెలుగులో తెలిపింది.
theological_decisions:
- issue: పస్కా మరియు పులియని రొట్టెల పండుగ మధ్య సంబంధం
  choice: రెండు పేర్లనూ విడివిడిగా ‘పస్కా పండుగ, పులియని రొట్టెల పండుగ’ అని చూపడం
  alternative: రెండింటినీ కలిపి ఒకే పండుగపేరుగా చూపడం
  rationale: గ్రీకు మూలం రెండింటినీ పేర్కొంటుంది. అవి చారిత్రకంగా సన్నిహితంగా అనుసంధానమైనా, వచనంలోని రెండు సూచనలను కలిపివేయలేదు.
- issue: నాయకుల పథకంలోని నైతిక స్వభావం
  choice: ἐν δόλῳ ను ‘మోసపూరితంగా’ అని స్పష్టంగా అనువదించడం
  alternative: ‘రహస్యంగా’ అని అనువదించడం
  rationale: మూలపదం కేవలం గోప్యతను కాక మోసం లేదా కపటాన్ని సూచిస్తుంది; ఆ నైతిక తీవ్రతను నిలిపాం.
- issue: κρατήσαντες యొక్క అధికారికత
  choice: ‘పట్టుకొని’
  alternative: ‘అరెస్టు చేసి’
  rationale: సందర్భం అధికారుల చర్యను సూచించినా, గ్రీకు క్రియలోని ‘పట్టుకోవడం/స్వాధీనపరచుకోవడం’ అనే విస్తృత భావాన్ని నిలిపి, అధికారిక న్యాయ ప్రక్రియను అనవసరంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే శైలి. ‘శాస్త్రులు,’ ‘ప్రధాన యాజకులు,’ ‘పస్కా’ వంటి స్థిరమైన బైబిలు పదాలను నిలిపి, వాక్యనిర్మాణాన్ని సహజీకరించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
