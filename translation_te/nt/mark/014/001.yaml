- from: పస్కా పండుగ, పులియని రొట్టెల పండుగ రావడానికి ఇంకా రెండు రోజులు ఉన్నాయి[a]. ప్రధాన యాజకులూ శాస్త్రులూ యేసును మోసపూరితంగా పట్టుకొని[c] చంపడానికి మార్గం వెదుకుతూ ఉన్నారు[b].
  to: పస్కా పండుగ, పులియని రొట్టెల పండుగ[b] రావడానికి ఇంకా రెండు రోజులు ఉన్నాయి[a]. ప్రధాన యాజకులూ శాస్త్రులూ యేసును మోసంతో పట్టుకొని[c] చంపడం ఎలా అని వెదుకుతున్నారు.
