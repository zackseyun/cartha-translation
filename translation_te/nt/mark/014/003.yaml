id: MRK.14.3
reference: Mark 14:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὄντος αὐτοῦ ἐν Βηθανίᾳ ἐν τῇ οἰκίᾳ Σίμωνος τοῦ λεπροῦ κατακειμένου αὐτοῦ ἦλθεν γυνὴ ἔχουσα ἀλάβαστρον μύρου νάρδου πιστικῆς πολυτελοῦς· ⸀συντρίψασα ⸀τὴν ἀλάβαστρον κατέχεεν ⸀αὐτοῦ τῆς κεφαλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/003.yaml
  text: And while he was in Bethany[a], reclining at the house of Simon the leper, a woman came with an alabaster jar of very expensive pure nard perfume; she broke the jar and poured it on his head.
translation:
  language: te
  text: ఆయన బేతనియలో కుష్ఠరోగియైన సీమోను ఇంట్లో వాలియుండగా, ఒక స్త్రీ చాలా ఖరీదైన స్వచ్ఛమైన[a] నార్దు పరిమళ తైలం ఉన్న అలబాస్టర్ పాత్రతో వచ్చింది. ఆమె ఆ పాత్రను పగులగొట్టి, ఆ తైలాన్ని ఆయన తల మీద పోసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అసలైన నార్దు’; ‘స్వచ్ఛమైన’ అని అనువదించిన గ్రీకు విశేషణం (πιστικῆς) యొక్క ఖచ్చితమైన అర్థం వివాదాస్పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντος αὐτοῦ ... κατακειμένου αὐτοῦ
  choice: ఆయన ... ఆనుకొని కూర్చుని ఉండగా
  rationale: జెనిటివ్ అబ్సల్యూట్ నేపథ్య పరిస్థితిని తెలియజేస్తుంది. ప్రాచీన భోజన సందర్భంలోని reclining భావాన్ని, మూలంలో లేని ‘భోజనం’ లేదా ‘బల్ల’ను చేర్చకుండా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Βηθανίᾳ
  choice: బేతనియలో
  rationale: స్థలనామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: οἰκίᾳ Σίμωνος τοῦ λεπροῦ
  choice: కుష్ఠరోగి సీమోను ఇంట్లో
  rationale: గ్రీకు పాఠం సీమోనును నేరుగా ‘కుష్ఠరోగి’గా పేర్కొంటుంది. ‘మాజీ కుష్ఠరోగి’ అని మూలంలో లేని ఊహను చేర్చలేదు.
- source_word: γυνὴ
  choice: ఒక స్త్రీ
  rationale: ఈ సందర్భంలో ఆమెను గుర్తించే వివరాలు ఇవ్వనందున అనిర్దిష్టంగా అనువదించబడింది.
- source_word: ἀλάβαστρον
  choice: అలబాస్టర్ సీసా
  rationale: ఈ నామవాచకం అలబాస్టర్‌తో చేసిన పరిమళ తైలపు పాత్రను సూచిస్తుంది. ‘సీసా’ సాధారణ పాఠకునికి పాత్ర ఆకృతిని సహజంగా తెలియజేస్తుంది; పదార్థ విశిష్టతను ‘అలబాస్టర్’ నిలుపుతుంది.
- source_word: μύρου
  choice: పరిమళ తైలం
  rationale: μύρον సువాసనగల తైలం లేదా లేపనాన్ని సూచిస్తుంది. ‘పరిమళ తైలం’ దాని సువాసనను, ద్రవరూపాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: νάρδου
  choice: నార్దు
  rationale: నిర్దిష్టమైన సుగంధ ద్రవ్యపు పేరును సాధారణీకరించకుండా లిప్యంతరీకరించింది.
- source_word: πιστικῆς
  choice: స్వచ్ఛమైన[a]
  rationale: వివాదాస్పదమైన πιστικόςకు సందర్భోచితంగా ‘స్వచ్ఛమైన’ను ప్రధాన పాఠంలో ఉంచి, ‘అసలైన’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో నిలిపింది.
- source_word: πολυτελοῦς
  choice: చాలా ఖరీదైన
  rationale: ఆ పదార్థపు అధిక ధరను, తరువాతి వచనాల్లో కలిగే ప్రతిస్పందనకు సంబంధించిన ఆర్థిక బలాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: συντρίψασα τὴν ἀλάβαστρον
  choice: ఆమె ఆ సీసాను పగులగొట్టి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను తెలుగులో సహజమైన క్రమబద్ధ వాక్య నిర్మాణంతో తెలిపింది; ‘బద్దలు కొట్టి’ వంటి అతిశయార్థాన్ని నివారించింది.
- source_word: κατέχεεν αὐτοῦ τῆς κεφαλῆς
  choice: ఆ తైలాన్ని ఆయన తల మీద పోసింది
  rationale: పాత్రలోని పదార్థమే పోయబడిందని తెలుగులో అవసరమైన కర్మను స్పష్టం చేస్తూ, మూలంలోని ‘తల మీద పోయడం’ అనే చర్యను నేరుగా నిలిపింది.
theological_decisions:
- issue: ‘కుష్ఠరోగి సీమోను’ అనే గుర్తింపును క్రియాశీల వ్యాధిగా అర్థమవకుండా మృదువుగా మార్చాలా?
  choice: ప్రధాన పాఠంలో ‘కుష్ఠరోగి సీమోను’ అని నిలిపివేయడం
  alternative: ‘మాజీ కుష్ఠరోగి సీమోను’
  rationale: మూలపాఠం ఎటువంటి వివరణ లేకుండా ఈ గుర్తింపునే ఇస్తుంది. చారిత్రకంగా సాధ్యమైనప్పటికీ ‘మాజీ’ అని చేర్చడం పాఠంలో లేని నిర్ధారణను దిగుమతి చేస్తుంది.
- issue: πιστικῆς అనే విశేషణంలోని వివాదాస్పద భావం
  choice: ప్రధాన పాఠంలో ‘స్వచ్ఛమైన’
  alternative: ‘అసలైన’
  rationale: ఈ పదం నార్దు యొక్క స్వచ్ఛత లేదా ప్రామాణికతను సూచించవచ్చు. ఒక భావాన్ని ప్రధాన పాఠంలో సహజంగా ఇచ్చి, నిజమైన అనిశ్చితిని పాదసూచికలో సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ప్రాచీన భోజన భంగిమను ‘ఆనుకొని కూర్చుని’ అని తెలిపి, మూలంలో స్పష్టంగా లేని ‘భోజనం’ లేదా ‘బల్ల’ను చేర్చలేదు. వ్యక్తి, స్థలం, సుగంధ ద్రవ్యాల పేర్లకు సాధారణ తెలుగు లిప్యంతరీకరణను అనుసరించింది.
