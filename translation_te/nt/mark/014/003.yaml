revisions:
- from: ఆయన బేతనియలో కుష్ఠరోగి సీమోను ఇంట్లో ఆనుకొని కూర్చుని ఉండగా, ఒక స్త్రీ చాలా ఖరీదైన స్వచ్ఛమైన[a] నార్దు పరిమళ తైలం ఉన్న అలబాస్టర్ సీసాతో వచ్చింది. ఆమె ఆ సీసాను పగులగొట్టి, ఆ తైలాన్ని ఆయన తల మీద పోసింది.
