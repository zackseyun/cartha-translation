revisions:
- from: ఒక యువకుడు తన నగ్న శరీరంపై నారబట్టను మాత్రమే కప్పుకొని ఆయనను వెంబడిస్తూ ఉన్నాడు. వారు అతణ్ణి పట్టుకున్నారు.
  to: ఒక యువకుడు తన నగ్నదేహం మీద నారబట్టను[a] మాత్రమే కప్పుకొని ఆయన వెంట వెళ్తూ ఉన్నాడు. వారు అతణ్ణి పట్టుకుంటారు.
  rationale: సవరణ συνηκολούθει యొక్క కొనసాగుతున్న ‘వెంట వెళ్లడం’ భావాన్ని స్పష్టంగా చేసింది; κρατοῦσιν యొక్క చారిత్రక వర్తమానాన్ని “పట్టుకుంటారు”తో నిలిపింది. నారబట్ట అనే ప్రధాన అనువాదం కొనసాగించబడింది; దుప్పటి అనే సాధ్యమైన ప్రత్యామ్నాయానికి పాదటిప్పణి జతచేయబడింది.
