translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. σινδών యొక్క ఆకారాన్ని ‘వస్త్రం’ లేదా ‘దుప్పటి’గా అతిగా నిర్దిష్టం చేయకుండా ‘నారబట్ట’గా అనువదించబడింది. ఈ వచనం గ్రీకు పాఠంలో కామాతో తదుపరి వచనంలోకి సాగినా, ఇచ్చిన సూచన ప్రకారం స్వతంత్ర వాక్యంగా విరామచిహ్నం పెట్టబడింది.
