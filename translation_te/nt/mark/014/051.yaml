id: MRK.14.51
reference: Mark 14:51
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ⸂νεανίσκος τις⸃ ⸀συνηκολούθει αὐτῷ περιβεβλημένος σινδόνα ἐπὶ γυμνοῦ, καὶ κρατοῦσιν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/051.yaml
  text: And a certain young man was following him[a], wearing only a linen cloth over his naked body, and they seize him,
translation:
  language: te
  text: ఒక యువకుడు తన నగ్నదేహం మీద నారబట్టను[a] మాత్రమే కప్పుకొని ఆయన వెంట వెళ్తూ ఉన్నాడు. వారు అతణ్ణి పట్టుకుంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నార దుప్పటి.” గ్రీకు σινδών నారబట్టను లేదా దుప్పటి వంటి వస్త్రాన్ని సూచించవచ్చు.
    reason: σινδών యొక్క విస్తృతమైన పదార్థార్థాన్ని, దాని ఆకారాన్ని అతిగా నిర్దిష్టం చేయకుండా తెలియజేయడానికి.
lexical_decisions:
- source_word: νεανίσκος τις
  choice: ఒక యువకుడు
  rationale: νεανίσκος అంటే యువకుడు; τις అనిర్దిష్టంగా, అయితే ఒక ప్రత్యేక వ్యక్తిని కథలో పరిచయం చేసే భావంతో ఉంది. సహజమైన తెలుగులో ‘ఒక యువకుడు’ ఈ రెండింటినీ తెలియజేస్తుంది.
- source_word: συνηκολούθει
  choice: వెంబడిస్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం గతంలో కొనసాగుతున్న చర్యను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ కొనసాగింపు భావాన్ని నిలుపుతుంది.
- source_word: αὐτῷ
  choice: ఆయనను
  rationale: సందర్భంలో సర్వనామం యేసును సూచిస్తుంది; గౌరవప్రదమైన సహజ తెలుగు ప్రయోగంగా ‘ఆయనను’ వాడబడింది.
- source_word: περιβεβλημένος
  choice: కప్పుకొని
  rationale: ఈ కృదంతం వస్త్రాన్ని చుట్టుకోవడం లేదా ధరించడం సూచిస్తుంది; ఇక్కడ ఆకారం నిర్దిష్టం కాని నారబట్టకు ‘కప్పుకొని’ సహజంగా సరిపోతుంది.
- source_word: σινδόνα
  choice: నారబట్టను
  rationale: σινδών నారతో చేసిన బట్టను, దుప్పటి వంటి వస్త్రాన్ని లేదా వస్త్రఖండాన్ని సూచించవచ్చు. ‘నారబట్ట’ దాని ఖచ్చితమైన ఆకారాన్ని నిర్ణయించకుండా పదార్థాన్ని, సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: ἐπὶ γυμνοῦ
  choice: తన నగ్న శరీరంపై
  rationale: బట్టను మరే లోదుస్తులు లేకుండా నేరుగా నగ్న శరీరంపై వేసుకున్నాడనే భావాన్ని స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: κρατοῦσιν
  choice: పట్టుకున్నారు
  rationale: చారిత్రక వర్తమానకాలం కథనానికి సజీవత ఇస్తుంది; అయితే ఆధునిక సహజ తెలుగు గతకాల కథనంలో ‘పట్టుకున్నారు’ సులభంగా ప్రవహిస్తుంది. ఇది ‘అరెస్టు చేశారు’ అనే అధిక వ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: αὐτόν
  choice: అతణ్ణి
  rationale: ఇది కొత్తగా పరిచయమైన యువకుణ్ణి సూచించే ప్రత్యక్ష కర్మ.
