id: MRK.14.14
reference: Mark 14:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν εἰσέλθῃ εἴπατε τῷ οἰκοδεσπότῃ ὅτι Ὁ διδάσκαλος λέγει· Ποῦ ἐστιν τὸ κατάλυμά ⸀μου ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/014.yaml
  text: And wherever he enters[a], say to the master of the house, ‘The Teacher says, “Where is my guest room where I may eat the Passover with my disciples?”’
translation:
  language: te
  text: 'అతడు ఏ ఇంట్లోకి ప్రవేశిస్తాడో, ఆ ఇంటి యజమానితో, ‘బోధకుడు ఇలా అంటున్నాడు: “నేను నా శిష్యులతో కలిసి పస్కా భోజనం చేయగల నా అతిథి గది[a] ఎక్కడ ఉంది?”’ అని చెప్పండి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బసచేసే చోటు’ లేదా ‘గది’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం ఉండడానికి ఉపయోగించే స్థలాన్ని సూచిస్తుంది; ఇక్కడ అది వాణిజ్య సత్రం కంటే ఒక వ్యక్తిగత ఇంటిలోని అతిథి గదిని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν εἰσέλθῃ
  choice: అతడు ఎక్కడ ప్రవేశిస్తాడో అక్కడి
  rationale: ὅπου + ἐάν తో కూడిన అనిశ్చిత సంబంధార్థాన్ని ‘ఎక్కడ...అక్కడి’ అనే సహజమైన తెలుగు నిర్మాణం వ్యక్తం చేస్తుంది.
- source_word: εἴπατε
  choice: చెప్పండి
  rationale: ఇది ఇద్దరు శిష్యులకు ఇచ్చిన బహువచన ఆజ్ఞ; ప్రత్యక్ష సందేశాన్ని చెప్పమనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: οἰκοδεσπότῃ
  choice: ఇంటి యజమానితో
  rationale: οἰκοδεσπότης ఇంటికి లేదా కుటుంబానికి బాధ్యత వహించే వ్యక్తిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఇంటి యజమాని’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: Ὁ διδάσκαλος
  choice: బోధకుడు
  rationale: διδάσκαλος యొక్క సాధారణ అర్థమైన ‘బోధించేవాడు/ఉపాధ్యాయుడు’ అనే భావాన్ని నిలుపుతూ, సందర్భంలో యేసుకు గుర్తింపుగా వాడిన సంబోధనను తెలియజేస్తుంది.
- source_word: κατάλυμά μου
  choice: నా అతిథి గది
  rationale: ఈ సందర్భంలో κατάλυμα వాణిజ్య సత్రం కంటే ఒక ఇంటిలో అతిథులు ఉండే గదిని సూచించే అవకాశం ఎక్కువ; μου ను ‘నా’గా స్పష్టంగా అనువదించాం.
- source_word: τὸ πάσχα
  choice: పస్కా భోజనం
  rationale: πάσχα పండుగను లేదా దాని భోజనాన్ని సూచించగలదు; ఇక్కడ ‘తినడం’ అనే క్రియతో ఉన్నందున తెలుగులో ‘పస్కా భోజనం’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: నా శిష్యులతో కలిసి
  rationale: μαθηταίకి సువార్తల సందర్భంలో స్థిరమైన తెలుగు సమానార్థకం ‘శిష్యులు’; μετά సహవాసాన్ని ‘కలిసి’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: φάγω
  choice: భోజనం చేయడానికి
  rationale: స sought స్థలంలో చేయబోయే ఉద్దేశిత కార్యాన్ని ఈ సందర్భంలోని aorist subjunctive సూచిస్తుంది; తెలుగులో ఉద్దేశార్థక నిర్మాణం సహజంగా ఉంటుంది.
theological_decisions:
- issue: διδάσκαλος అనే యేసు స్వీయ-గుర్తింపును ఎలా అనువదించాలి
  choice: బోధకుడు
  alternative: ప్రభువు / గురువు
  rationale: గ్రీకు పదం ఇక్కడ యేసును గుర్తించే బిరుదులా వాడబడినా దాని సాధారణ భావం ‘బోధకుడు.’ ‘ప్రభువు’ అనడం మూలంలో లేని అధిక క్రీస్తుశాస్త్రీయ భావాన్ని చేర్చుతుంది; ‘గురువు’ సాధ్యమైనప్పటికీ ఇతర అధికారార్థ ఛాయలను కలిగించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన వచనం ఉపయోగించబడింది. ప్రత్యక్ష ఉల్లేఖనాల పొరలను స్పష్టంగా ఉంచి, గ్రీకు వాక్యంలోని ఉద్దేశార్థాన్ని సహజమైన తెలుగు నిర్మాణంతో వ్యక్తం చేశాం.
