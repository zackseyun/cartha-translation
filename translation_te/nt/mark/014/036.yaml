id: MRK.14.36
reference: Mark 14:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Αββα ὁ πατήρ, πάντα δυνατά σοι· παρένεγκε τὸ ποτήριον ⸂τοῦτο ἀπ’ ἐμοῦ⸃· ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/036.yaml
  text: And he was saying[a], “Abba, Father, all things are possible for you. Take this cup away from me. Yet not what I will[c][b], but what you will.”
translation:
  language: te
  text: 'ఆయన ఇలా చెబుతూ ఉన్నాడు[a]: “అబ్బా, తండ్రీ[b], నీకు అన్నీ సాధ్యమే. ఈ పాత్రను నా దగ్గర నుంచి తొలగించు[c]. అయినా, నేను కోరేది కాదు, నీవు కోరేదే జరగాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇలా అన్నాడు.” గ్రీకు అసంపూర్ణ భూతకాల రూపం మాట కొనసాగిందని లేదా మళ్లీ మళ్లీ పలికిందని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘అబ్బా’ అనేది తండ్రిని సంబోధించే అరామిక్ పదం. దాని వెంట గ్రీకులో ఉన్న ‘తండ్రీ’ అనే సంబోధనను కూడా మూలపాఠం నిలుపుతుంది.
    reason: cultural_note
  - marker: c
    text: ‘పాత్ర’ అనేది ఆయనకు నియమించబడిన శ్రమను సూచించే బైబిలీయ రూపకం; మార్కు 10:38 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: ἔλεγεν
  choice: ఇలా చెబుతూ ఉన్నాడు
  rationale: గ్రీకు అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న లేదా పునరావృతమైన మాటను సూచించగలదు; తెలుగులో సహజంగా ఆ క్రియాంశాన్ని నిలుపుతుంది.
- source_word: Αββα ὁ πατήρ
  choice: అబ్బా, తండ్రీ
  rationale: అరామిక్ సంబోధన ‘అబ్బా’ను లిప్యంతరీకరించి, దాని వెంట ఉన్న గ్రీకు సంబోధనను ‘తండ్రీ’గా ఇస్తుంది; మూలంలో స్పష్టంగా లేని ‘నా’ను చేర్చదు.
- source_word: πάντα δυνατά σοι
  choice: నీకు అన్నీ సాధ్యమే
  rationale: దత్తివాచక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, సమగ్ర పరిధిని నిలుపుతుంది.
- source_word: παρένεγκε ... ἀπ’ ἐμοῦ
  choice: నా దగ్గర నుంచి తొలగించు
  rationale: పాత్ర తన నుంచి తీసివేయబడాలనే ప్రార్థనలోని ఆజ్ఞార్థక విన్నపాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὸ ποτήριον τοῦτο
  choice: ఈ పాత్రను
  rationale: రాబోయే శ్రమను సూచించే బైబిలీయ రూపకాన్ని వ్యాఖ్యానించి మార్చకుండా అలాగే నిలుపుతుంది.
- source_word: ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ
  choice: అయినా, నేను కోరేది కాదు, నీవు కోరేదే జరగాలి
  rationale: గ్రీకులో చివర అర్థసూచితంగా ఉన్న క్రియను తెలుగులో సహజత కోసం ‘జరగాలి’గా పూర్తిచేస్తుంది; యేసు కోరికకూ తండ్రి కోరికకూ మధ్య ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దేవునికి యేసు చేసిన సంబోధనలో అరామిక్, గ్రీకు రూపాలు రెండూ ఉండటం
  choice: అబ్బా, తండ్రీ
  alternative: అబ్బా, నా తండ్రీ
  rationale: మూలపాఠం అరామిక్ సంబోధనతో పాటు దాని గ్రీకు వివరణనూ ఉంచుతుంది. స్పష్టంగా లేని స్వామ్యార్థక పదాన్ని చేర్చకుండా రెండింటినీ నిలుపుతుంది.
- issue: ‘పాత్ర’ అనే రూపకపు భావం
  choice: ఈ పాత్రను
  alternative: ఈ శ్రమను
  rationale: సందర్భంలో అది యేసుకు నియమించబడిన శ్రమను సూచించినప్పటికీ, మూలంలోని రూపకాన్నీ దాని అంతర్పాఠ్య, ధార్మిక ప్రతిధ్వనులనూ అనువాదం నిలుపుతుంది.
- issue: చివరి వాక్యంలో అర్థసూచిత క్రియను తెలుగులో వ్యక్తం చేయడం
  choice: నీవు కోరేదే జరగాలి
  alternative: నీవు కోరేదే
  rationale: గ్రీకులో క్రియ అర్థసూచితంగా ఉంది. ‘జరగాలి’ అని పూరించడం తెలుగులో వాక్యాన్ని సహజంగా చేస్తుంది; తండ్రి చిత్తం ఏమిటో అదనంగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలిని వాడాం. ‘అబ్బా’ను మూలంలోని అరామిక్ రూపంగా నిలిపి, ‘తండ్రీ’ని ప్రత్యక్ష సంబోధనగా ఇచ్చాం. ‘పాత్ర’ రూపకాన్ని వివరించి మార్చకుండా పాదసూచికలో సంక్షిప్తంగా స్పష్టం చేశాం.
