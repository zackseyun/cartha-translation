lexical_decisions:
- source_word: ἐγείρεσθε
  choice: లేవండి
  rationale: బహువచన ఆజ్ఞారూపం. ఈ సందర్భంలో నిద్ర మేలుకోవడం కంటే లేచి కదలడానికి సిద్ధపడమనే భావం ప్రధానంగా ఉంది.
- source_word: ἄγωμεν
