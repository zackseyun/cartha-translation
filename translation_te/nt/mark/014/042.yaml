  choice: ద్రోహంగా అప్పగించేవాడు
  alternative: అప్పగించేవాడు
  rationale: మూలపదంలోని ‘అప్పగించు’ అర్థాన్ని కోల్పోకుండా, ఈ సందర్భంలో యూదా చర్యకు స్పష్టంగా ఉన్న ద్రోహ స్వభావాన్ని తెలియజేస్తుంది. అయితే ‘అప్పగించేవాడు’ అనే మరింత అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఉంచి మూలంలోని పదార్థ విస్తృతిని కాపాడాం.
