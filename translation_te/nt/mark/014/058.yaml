revisions:
- from: 'అని: “చేతులతో చేసిన ఈ దేవాలయాన్ని నేను కూల్చివేసి, మూడు రోజులలో చేతులతో చేయనిది మరొకటి కడతానని ఇతడు చెబుతుండగా మేమే విన్నాం.”[a]'
  to: అని, “చేతులతో నిర్మించిన ఈ దేవాలయాన్ని నేను కూల్చివేసి, మూడు రోజుల్లో చేతులతో నిర్మించనిదైన మరొక దేవాలయాన్ని కడతాను” అని ఇతడు చెప్పడం మేమే విన్నామని అన్నారు.[a]
