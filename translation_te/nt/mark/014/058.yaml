id: MRK.14.58
reference: Mark 14:58
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι Ἡμεῖς ἠκούσαμεν αὐτοῦ λέγοντος ὅτι Ἐγὼ καταλύσω τὸν ναὸν τοῦτον τὸν χειροποίητον καὶ διὰ τριῶν ἡμερῶν ἄλλον ἀχειροποίητον οἰκοδομήσω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/058.yaml
  text: that[a], ‘We heard him saying, “I will destroy this temple made with hands[b], and in three days I will build another not made with hands.”’
translation:
  language: te
  text: అని, “చేతులతో నిర్మించిన ఈ దేవాలయాన్ని నేను కూల్చివేసి, మూడు రోజుల్లో చేతులతో నిర్మించనిదైన మరొక దేవాలయాన్ని కడతాను” అని ఇతడు చెప్పడం మేమే విన్నామని అన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మూడు రోజుల్లో” అనే గ్రీకు పదబంధం కార్యం మూడు రోజుల వ్యవధిలో జరుగుతుందని సూచిస్తుంది; “మూడు రోజులలో” అని కూడా అనువదించవచ్చు. “చేతులతో నిర్మించినది” మరియు “చేతులతో నిర్మించనిది” అనే మాటలు గ్రీకులోని ఉద్దేశపూర్వక విరుద్ధతను నిలుపుతున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: అని
  rationale: ఇది కారణాన్ని కాకుండా సాక్షులు చెప్పిన మాటల విషయాన్ని పరిచయం చేస్తుంది.
- source_word: Ἡμεῖς
  choice: మేమే
  rationale: గ్రీకులోని స్పష్టమైన సర్వనామానికి ఉన్న ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἠκούσαμεν αὐτοῦ λέγοντος
  choice: ఇతడు చెబుతుండగా మేమే విన్నాం
  rationale: అసమాపక క్రియారూపాన్ని సహజంగా తెలియజేస్తూ, ఇది సాక్షులు చేసిన వాదన అని స్పష్టం చేస్తుంది.
- source_word: καταλύσω
  choice: కూల్చివేస్తాను
  rationale: భవనం సందర్భంలో విడదీయడం లేదా ధ్వంసం చేయడం అనే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ναὸν τοῦτον
  choice: ఈ దేవాలయాన్ని
  rationale: ναός యొక్క ఆలయ భావాన్నీ, τοῦτον యొక్క సమీప సూచననూ నిలుపుతుంది.
- source_word: χειροποίητον
  choice: చేతులతో చేసిన
  rationale: ἀχειροποίητον‌తో ఉన్న పదబంధ విరుద్ధతను యథాతథంగా కాపాడుతుంది.
- source_word: διὰ τριῶν ἡμερῶν
  choice: మూడు రోజులలో
  rationale: మూడు రోజుల వ్యవధిలో కార్యం జరుగుతుందనే సహజమైన కాలార్థాన్ని నిలుపుతుంది; సందర్భాన్ని బట్టి ‘మూడు రోజుల్లో’ అని కూడా చెప్పవచ్చు.
- source_word: ἄλλον
  choice: మరొకటి
  rationale: మొదటిదానికి బదులుగా ఇంకొక దేవాలయాన్ని సూచిస్తుంది; తెలుగులో పునరుక్తిని నివారిస్తూ అర్థాన్ని నిలుపుతుంది.
- source_word: ἀχειροποίητον
  choice: చేతులతో చేయనిది
  rationale: చేతులతో చేసినది/చేయనిది అనే గ్రీకు సమాంతర విరుద్ధతను సంరక్షిస్తుంది.
- source_word: οἰκοδομήσω
  choice: కడతాను
  rationale: ‘నిర్మిస్తాను’ కంటే సాధారణ పాఠకులకు సహజంగా ఉండి, ‘తిరిగి కడతాను’ అనే మూలంలో లేని భావాన్ని చేర్చదు.
theological_decisions:
- issue: ఈ మాట యేసు పలికినదని కథకుడు ధృవీకరిస్తున్నాడా, లేక విరోధి సాక్షులు చేసిన వాదనగా మాత్రమే నివేదిస్తున్నాడా
  choice: వివరణాత్మక వ్యాఖ్యను చేర్చకుండా సాక్షుల ప్రత్యక్ష వాక్యంగా ఉంచడం
  alternative: వారు యేసు మాటలను వక్రీకరించారని అనువాదంలోనే స్పష్టీకరించడం
  rationale: వచనం సాక్షులు తాము విన్నామని చేసిన వాదనను మాత్రమే నివేదిస్తుంది; ఇతర వచనాలతో సమన్వయం చేసే వ్యాఖ్యను ప్రధాన పాఠ్యంలో చేర్చకూడదు.
- issue: చేతులతో చేసిన/చేయని దేవాలయం అనే విరుద్ధతకు ఉన్న సాధ్యమైన వేదాంతార్థం
  choice: ‘చేతులతో చేసిన’ / ‘చేతులతో చేయనిది’ అనే ప్రత్యక్ష విరుద్ధతను నిలుపడం
  alternative: ‘మానవ నిర్మితం’ / ‘దైవ నిర్మితం’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: గ్రీకు పదాలకు వేదాంత ప్రతిధ్వని ఉండవచ్చు; అయితే ‘దైవ నిర్మితం’ అని చెప్పడం మూలపాఠ్యం ప్రత్యక్షంగా చెప్పని వివరణను దిగుమతి చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి. సాక్షుల ఉద్ఘాటన కోసం ‘మేమే’ వాడబడింది. ఆలయాన్ని కట్టడం అనే సందర్భంలో సాధారణ పాఠకులకు సులభమైన ‘కడతాను’ ఎంచుకోబడింది. [a] సూచిక ప్రధాన పాఠ్యంలో ఉంది.
