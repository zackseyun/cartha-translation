  text: ἠδύνατο γὰρ τοῦτο ⸂τὸ μύρον⸃ πραθῆναι ἐπάνω ⸂δηναρίων τριακοσίων⸃ καὶ δοθῆναι τοῖς πτωχοῖς· καὶ ἐνεβριμῶντο αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/005.yaml
  text: For this perfume could have been sold for more than three hundred denarii and given to the poor.” And they scolded her[a][b].
translation:
  language: te
  text: “ఎందుకంటే ఈ సుగంధ తైలాన్ని[a] మూడు వందల దేనారాలకంటే ఎక్కువకు అమ్మి, ఆ డబ్బును పేదలకు ఇచ్చి ఉండవచ్చు కదా!” అని చెప్పి, వారు ఆమెను తీవ్రంగా మందలించారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పరిమళ ద్రవ్యం’ లేదా ‘సువాసనగల అభిషేక తైలం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వారు ఆమెను గద్దించారు.’ గ్రీకు క్రియ తీవ్రమైన అసంతృప్తిని లేదా కఠినమైన మందలింపును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μύρον
  choice: సుగంధ తైలం
  rationale: సువాసనగల అభిషేక తైలం లేదా పరిమళ ద్రవ్యాన్ని సూచించే μύρονకు ఇది సహజమైన, సందర్భానుకూలమైన ఆధునిక తెలుగు పదబంధం.
- source_word: πραθῆναι
  choice: అమ్మి
  rationale: ἠδύνατοతో కలిసి నెరవేరని సాధ్యతను తెలియజేస్తుంది; తెలుగులో తరువాతి ‘ఇవ్వవచ్చు’తో అనుసంధానించిన ‘అమ్మి’ సహజంగా ఉంటుంది.
- source_word: ἐπάνω δηναρίων τριακοσίων
  choice: మూడు వందల దేనారాలకంటే ఎక్కువకు
  rationale: ἐπάνω పరిమాణాన్ని మించిన విలువను సూచిస్తుంది; ప్రాచీన నాణెాన్ని ఆధునిక కరెన్సీగా మార్చకుండా దేనారం అనే రూపాన్ని నిలుపుతుంది.
- source_word: δοθῆναι τοῖς πτωχοῖς
  choice: ఆ డబ్బును పేదలకు ఇవ్వవచ్చు
  rationale: అమ్మకం ద్వారా వచ్చిన మొత్తమే ఇవ్వబడుతుందని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది; πτωχοῖςను సామాజిక వర్గంగా ‘పేదలకు’ అని అనువదిస్తుంది.
- source_word: ἐνεβριμῶντο αὐτῇ
  choice: వారు ఆమెను తీవ్రంగా మందలించారు
  rationale: క్రియలోని బలమైన అసంతృప్తి మరియు కఠినమైన గద్దింపును ‘తీవ్రంగా మందలించారు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: కదా
  rationale: ముందటి ఫిర్యాదుకు కారణంగా వారు చెప్పిన మాటలోని వివరణాత్మక, వాదనాత్మక భావాన్ని సహజ తెలుగు ప్రత్యక్ష వాక్యంలో తెలియజేస్తుంది.
- source_word: ἠδύνατο
  choice: ఇవ్వవచ్చు
  rationale: సందర్భంలో నెరవేరని గత సాధ్యతను తెలుగులో వాక్య నిర్మాణమంతటితో వ్యక్తం చేస్తుంది; అమ్మి ఇవ్వడం అనే సంయుక్త సాధ్యతకు ఈ క్రియ వర్తిస్తుంది.
