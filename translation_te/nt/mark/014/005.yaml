translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ప్రత్యక్ష వాక్యంలోని వాదనను సహజంగా ఉంచుతూ, దేనారం అనే చారిత్రక నాణెం పేరును నిలిపాం.
