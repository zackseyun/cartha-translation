translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన కథన శైలి. ‘నారబట్ట’ మూలంలోని వస్త్ర పదార్థాన్ని నిలుపుతూ దాని ఆకారాన్ని నిర్దిష్టం చేయదు; రెండు పాదసూచిక గుర్తులూ ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
