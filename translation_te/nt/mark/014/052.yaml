  text: ὁ δὲ καταλιπὼν τὴν σινδόνα γυμνὸς ⸀ἔφυγεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/052.yaml
  text: But he left the linen cloth behind and fled naked[a][b].
translation:
  language: te
  text: కానీ అతడు ఆ నారబట్టను విడిచిపెట్టి, నగ్నంగా పారిపోయాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నారబట్ట” అనే మాటను “నారతో చేసిన కప్పుకునే బట్ట” లేదా “నారవస్త్రం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “నగ్నంగా” అనే మాట కొన్ని సందర్భాల్లో “తగినంత దుస్తులు లేకుండా” అని కూడా అర్థమివ్వవచ్చు. అయితే ఇక్కడ అతడు తనను కప్పుకున్న బట్టను విడిచిపెట్టి తప్పించుకున్నాడనేదే తక్షణ భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: కానీ
  rationale: మునుపటి వచనంలోని పట్టుకునే చర్యకు విరుద్ధంగా అతడు తప్పించుకున్న కథన మలుపును సూచిస్తుంది.
- source_word: καταλιπὼν
  choice: విడిచిపెట్టి
  rationale: తప్పించుకునే క్రమంలో ఆ వస్త్రాన్ని అక్కడే వదిలివేసిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: σινδόνα
  choice: నారబట్టను
  rationale: ఇది నారతో చేసిన బట్ట లేదా శరీరంపై కప్పుకునే వస్త్రాన్ని సూచిస్తుంది; దాని ఖచ్చితమైన రూపాన్ని అనవసరంగా నిర్దేశించకుండా మూలపదంలోని పదార్థ సూచనను నిలుపుతుంది.
- source_word: γυμνὸς
  choice: నగ్నంగా
  rationale: ఈ సందర్భంలో ఆ యువకుడు తనను కప్పుకున్న బట్టను వదిలి పారిపోవడం వల్ల ‘నగ్నంగా’ అనేది అత్యంత ప్రత్యక్షమైన అర్థం; ఇతర సందర్భాల్లో తగినంత దుస్తులు లేని భావం కూడా ఉండవచ్చు.
- source_word: ἔφυγεν
  choice: పారిపోయాడు
  rationale: ప్రమాదం నుంచి వేగంగా తప్పించుకొని వెళ్లిన అత్యవసర చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
