  text: ὁ δὲ Πέτρος ἔφη αὐτῷ· ⸂Εἰ καὶ⸃ πάντες σκανδαλισθήσονται, ἀλλ’ οὐκ ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/029.yaml
  text: But Peter said to him[a], “Even if all fall away, I will not.”
translation:
  language: te
  text: అయితే పేతురు ఆయనతో, “అందరూ తొట్రిల్లిపోయినా[a], నేను మాత్రం తొట్రిల్లను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “విశ్వాసం విడిచిపోయినా,” “వైదొలగిపోయినా.” గ్రీకు క్రియకు తొట్రిల్లడం, అభ్యంతరపడడం, లేదా విశ్వాసం నుంచి వైదొలగడం అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: యేసు ముందుగా చెప్పిన మాటకు పేతురు విరుద్ధంగా స్పందిస్తున్న భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἔφη αὐτῷ
  choice: ఆయనతో … అన్నాడు
  rationale: గ్రీకు వాక్యంలోని సాధారణ ఉక్తి క్రియను, యేసును సూచించే సర్వనామాన్ని యథాతథంగా నిలుపుతూ సహజమైన తెలుగు వాక్యనిర్మాణాన్ని ఉపయోగిస్తుంది.
- source_word: Εἰ καὶ
  choice: …పోయినా
  rationale: షరతుతో కూడిన అంగీకార భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: πάντες
  choice: అందరూ
  rationale: సందర్భంలోని శిష్యులందరినీ సూచించే గ్రీకు పదపు సమగ్ర పరిధిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: σκανδαλισθήσονται
  choice: తొట్రిల్లిపోయినా
  rationale: ఈ క్రియలోని తొట్రుపాటు, అభ్యంతరం, వైదొలగడం వంటి భావవ్యాప్తిని పూర్తిగా ఒకే అర్థానికి పరిమితం చేయకుండా, సందర్భంలోని తీవ్రమైన శిష్యత్వ వైఫల్యాన్ని తెలియజేస్తుంది.
- source_word: ἀλλ’ οὐκ ἐγώ
  choice: నేను మాత్రం తొట్రిల్లను
  rationale: గ్రీకులోని సంక్షిప్తమైన, ‘నేను’ అనే పదాన్ని నొక్కిచెప్పే వ్యతిరేకతను తెలుగులో స్పష్టంగా నిలుపుతుంది; ముందరి క్రియను సహజంగా పునరుక్తి చేస్తుంది.
theological_decisions:
- issue: శిష్యుల వైఫల్య సందర్భంలో σκανδαλισθήσονται అర్థం
  choice: తొట్రిల్లిపోయినా
  alternative: విశ్వాసం విడిచిపోయినా / వైదొలగిపోయినా
  rationale: ఈ సందర్భంలో శిష్యులు యేసును విడిచి పారిపోవడం ఉద్దేశంలో ఉన్నప్పటికీ, అంతిమ మతభ్రష్టత్వమనే తీర్పును అనువాదంలో ముందుగానే చేర్చకుండా మూలపదంలోని ఉద్దేశపూర్వక భావవిస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘నేను మాత్రం’ అనే రూపం పేతురు తనను మిగతావారితో బలంగా వేరుచేసుకున్న భావాన్ని తెలియజేస్తుంది.
