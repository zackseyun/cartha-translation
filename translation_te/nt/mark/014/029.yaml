    text: లేదా “విశ్వాసం విడిచిపోయినా,” “వైదొలగిపోయినా.” గ్రీకు క్రియకు తొట్రిల్లడం, అభ్యంతరపడడం, లేదా విశ్వాసం నుంచి వైదొలగడం అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
