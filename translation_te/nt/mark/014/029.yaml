review_pass:
  verdict: approve
  source_fidelity: ‘అయితే’ appropriately conveys the contrastive δέ. ‘పేతురు ఆయనతో … అన్నాడు’ retains the pronoun αὐτῷ without unnecessarily supplying Jesus’ name. ‘అందరూ తొట్రిల్లిపోయినా’ preserves the conditional-concessive force of Εἰ καὶ πάντες σκανδαλισθήσονται and, unlike a categorical rendering such as ‘విశ్వాసం విడిచిపోయినా,’ does not prematurely narrow the verb’s semantic range. ‘నేను మాత్రం తొట్రిల్లను’ naturally supplies the ellipsis in ἀλλ’ οὐκ ἐγώ and preserves Peter’s emphatic self-contrast.
  naturalness: The sentence is fluent modern standard Telugu. The contrastive ‘అయితే,’ the concessive ‘...పోయినా,’ and emphatic ‘నేను మాత్రం’ are idiomatic and suit the restrained narrative register. The quotation punctuation is clear.
  terminology: ‘తొట్రిల్లిపోవడం’ is an appropriate main-text rendering for σκανδαλίζω here, retaining the image of being tripped up while allowing the context to suggest discipleship failure. The footnote responsibly gives ‘విశ్వాసం విడిచిపోయినా’ and ‘వైదొలగిపోయినా’ as contextual alternatives without treating either as the sole meaning. ‘పేతురు’ is standard Telugu biblical usage.
  issues: []
  revised_text: అయితే పేతురు ఆయనతో, “అందరూ తొట్రిల్లిపోయినా[a], నేను మాత్రం తొట్రిల్లను” అన్నాడు.
  revised_footnotes:
