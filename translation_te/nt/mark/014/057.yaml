  text: καί τινες ἀναστάντες ἐψευδομαρτύρουν κατ’ αὐτοῦ λέγοντες
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/057.yaml
  text: And some stood up and were giving false testimony against him[a], saying,
translation:
  language: te
  text: 'మరియు కొందరు లేచి నిలబడి ఆయనకు వ్యతిరేకంగా అబద్ధ సాక్ష్యం ఇస్తూ ఇలా అన్నారు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καί
  choice: అప్పుడు
  rationale: మార్కు కథనంలోని తదుపరి చర్యను సహజమైన ఆధునిక తెలుగులో అనుసంధానిస్తుంది; సందర్భానుసారంగా సాధారణ సంధానార్థాన్ని ఇస్తుంది.
- source_word: τινες
  choice: కొందరు
  rationale: వ్యక్తులు ఎవరో నిర్దిష్టంగా చెప్పని బహువచన భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἀναστάντες
  choice: లేచి నిలబడి
  rationale: న్యాయవిచారణ సందర్భంలో సాక్ష్యం చెప్పడానికి వారు లేచి నిలబడిన చర్యను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐψευδομαρτύρουν
  choice: అబద్ధ సాక్ష్యం చెబుతూ
  rationale: న్యాయపరమైన సాక్ష్య భావాన్ని స్పష్టంగా తెలియజేస్తూ, అపరిపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న చర్య భావాన్ని తెలుగు క్రియారూపం ద్వారా నిలుపుతుంది.
- source_word: κατ’ αὐτοῦ
  choice: ఆయనకు వ్యతిరేకంగా
  rationale: κατά + షష్ఠీ విభక్తికి ఈ న్యాయ సందర్భంలో ఉన్న ప్రతికూల, విరోధార్థాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: λέγοντες
  choice: 'ఇలా అన్నారు:'
  rationale: తరువాతి వచనంలో వచ్చే సాక్ష్యపు మాటలను పరిచయం చేస్తుంది; తెలుగులో ఉద్ధరణకు సహజమైన ప్రవేశరూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయవిచారణ సందర్భానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదజాలం వాడబడింది.
