revisions:
- from: 'అప్పుడు కొందరు లేచి నిలబడి ఆయనకు వ్యతిరేకంగా అబద్ధ సాక్ష్యం చెబుతూ[a] ఇలా అన్నారు:'
  to: 'మరియు కొందరు లేచి నిలబడి ఆయనకు వ్యతిరేకంగా అబద్ధ సాక్ష్యం ఇస్తూ ఇలా అన్నారు:'
  rationale: The revision preserves the source’s simple narrative connective and uses idiomatic Telugu legal terminology for false testimony. It maintains the ongoing force of the imperfect through “ఇస్తూ” and retains the direct lead-in to the testimony quoted in the following verse.
