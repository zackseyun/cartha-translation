  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: te
  text: వారు స్తుతిగీతం పాడి, ఒలీవల కొండకు బయలుదేరారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: తర్వాత
  rationale: గ్రీకు సంధానపదం కథనంలోని తదుపరి చర్యను కలుపుతుంది. తెలుగులో పూర్వకాలిక అసమాపక క్రియతో కలిపి ‘తర్వాత’ అనడం సహజమైన క్రమాన్ని వ్యక్తం చేస్తుంది.
- source_word: ὑμνήσαντες
  choice: స్తుతిగీతం పాడిన తర్వాత
  rationale: ὑμνέω అనే క్రియ స్తుతిగీతం పాడడాన్ని సూచిస్తుంది; భూతకాల అసమాపక రూపం ప్రధాన క్రియకంటే ముందుగా జరిగిన చర్యను తెలియజేస్తుంది.
- source_word: ἐξῆλθον
  choice: బయలుదేరి వెళ్లారు
  rationale: ἐξέρχομαι యొక్క సాధారణ కథనార్థం ‘వెలుపలికి వెళ్లడం/బయలుదేరడం.’ గమ్యస్థానానికి ప్రయాణాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ఈ ప్రయోగం ఎంచుకోబడింది.
- source_word: εἰς
  choice: కు
  rationale: ఇక్కడ గమ్యస్థానాన్ని సూచించే εἰς కు తెలుగు దత్తివిభక్తి ప్రత్యయం ‘కు’ సహజ సమానం.
- source_word: τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ఒలీవల కొండ
  rationale: ఇది స్థిరమైన భౌగోళిక నామం. ὄρος ఇక్కడ కొండను, τῶν Ἐλαιῶν ఒలీవ చెట్లతో సంబంధాన్ని సూచిస్తుంది.
