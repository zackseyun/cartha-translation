source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ αἷμά μου ⸀τῆς διαθήκης τὸ ⸂ἐκχυννόμενον ὑπὲρ πολλῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/024.yaml
  text: And he said to them[a], “This is my blood of the covenant[c][b], which is poured out for many.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా చెప్పాడు: “ఇది నిబంధనకు సంబంధించిన నా రక్తం[a]; ఇది అనేకుల కోసం[c] చిందించబడుతోంది[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లోను సమాంతర వాక్యాల్లోను ‘కొత్త నిబంధనకు సంబంధించిన నా రక్తం’ అని ఉంది. ఇక్కడ మార్కు గ్రీకు పాఠాన్ని ‘నిబంధనకు సంబంధించిన నా రక్తం’ అని చదవడమే ఉత్తమం.
    reason: textual_variant
  - marker: b
    text: లేదా, ‘చిందింపబడుతోంది’; సాంప్రదాయంగా, ‘ధారపోయబడుతోంది.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘అనేకుల పక్షంగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτό ἐστιν
  choice: ఇది ... రక్తం
  rationale: గ్రీకు సమానార్థక క్రియ నిర్మాణాన్ని నేరుగా నిలుపుతూ, ‘ఇది సూచిస్తుంది’ లేదా ‘దీనికి అర్థం’ వంటి వ్యాఖ్యానాత్మక భావాలను చేర్చలేదు.
- source_word: τὸ αἷμά μου
  choice: నా రక్తం
  rationale: స్వామ్య నిర్మాణాన్ని నేరుగా అనువదించి, సందర్భంలోని బలి మరియు నిబంధన ప్రతీకను కాపాడటానికి ‘మరణం’ వంటి వివరణాత్మక పదంతో మార్చలేదు.
- source_word: τῆς διαθήκης
  choice: నిబంధన రక్తమైన
  rationale: διαθήκη ఇక్కడ నిర్గమకాండము 24:8ను ప్రతిధ్వనించే నిబంధన భావంలో ఉంది. మూలపాఠంలో లేని ‘కొత్త’ అనే పదాన్ని చేర్చలేదు.
- source_word: ἐκχυννόμενον
  choice: చిందింపబడుతున్నది
  rationale: వర్తమానకాల నిష్క్రియార్థక కృదంతంలోని కొనసాగుతున్న భావాన్ని సహజమైన తెలుగు క్రియారూపంతో నిలిపింది; రక్తాన్ని బలిగా కుమ్మరించే చిత్రణను కూడా కాపాడింది.
- source_word: ὑπὲρ πολλῶν
  choice: అనేకుల కోసం
  rationale: ὑπέρ యొక్క ‘వారి మేలుకోసం/వారి పక్షంగా’ అనే విస్తృత భావాన్ని సహజంగా తెలియజేస్తూ, మూలంలోని ‘అనేకులు’ను ‘అందరూ’గా మార్చలేదు.
theological_decisions:
- issue: διαθήκηను నిబంధనగా అనువదించాలా, వీలునామాగా అనువదించాలా
  choice: నిబంధన
  alternative: వీలునామా
  rationale: చివరి భోజన సందర్భంలోని రక్తభాష నిబంధన స్థాపనను సూచించే నిర్గమకాండము 24:8తో సంబంధం కలిగి ఉంది; అందువల్ల ఇక్కడ ‘నిబంధన’యే సందర్భోచిత భావం.
- issue: సమాంతర వాక్యాల ఆధారంగా ‘కొత్త’ అనే పదాన్ని చేర్చాలా
  choice: నిబంధన రక్తం
  alternative: కొత్త నిబంధన రక్తం
  rationale: ఇచ్చిన SBLGNT పాఠంలో καινῆς (‘కొత్త’) లేదు. అందువల్ల మార్కు పాఠాన్ని ఇతర సమాంతర పాఠాలతో సమన్వయపరచకుండా, పాఠాంతరాన్ని పాదటిప్పణిలో మాత్రమే పేర్కొంది.
- issue: ὑπὲρ πολλῶνలోని విమోచన పరిధిని ఎలా ప్రతిబింబించాలి
  choice: అనేకుల కోసం
  alternative: అందరి కోసం; అనేకుల పక్షంగా
  rationale: యేసు పలికిన ‘అనేకులు’ అనే మాటను అలాగే నిలిపి, దానిని ‘అందరూ’గా మార్చి వేదాంత వివాదాన్ని అనువాదంలోనే పరిష్కరించలేదు. ‘కోసం’ ప్రతినిధిత్వం లేదా ప్రత్యామ్నాయత్వం గురించిన భావాన్ని అతిగా నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘నిబంధన రక్తమైన నా రక్తం’ అనే నిర్మాణం కొంత గంభీరంగా ఉన్నప్పటికీ గ్రీకు పదబంధంలోని ‘నా రక్తం’ మరియు ‘నిబంధన’ రెండింటి సంబంధాన్ని స్పష్టంగా నిలుపుతుంది. వర్తమాన కృదంత భావం కోసం ‘చిందింపబడుతున్నది’ వాడబడింది.
