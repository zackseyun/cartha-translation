id: MRK.3.27
reference: Mark 3:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ἀλλ’ οὐδεὶς δύναται⸃ ⸂εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθὼν τὰ σκεύη⸃ αὐτοῦ διαρπάσαι ἐὰν μὴ πρῶτον τὸν ἰσχυρὸν δήσῃ, καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/027.yaml
  text: But no one can enter the house of the strong man and plunder his goods unless he first ties up the strong man[b][a]; then indeed he will plunder his house.
translation:
  language: te
  text: అయితే, ముందుగా బలవంతుడిని[b] కట్టివేయకపోతే, ఎవ్వరూ అతని ఇంట్లోకి ప్రవేశించి అతని వస్తువులను[a] దోచుకోలేరు. అప్పుడు అతడు బలవంతుడి ఇంటిని దోచుకుంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని ఆస్తిని’; మరింత అక్షరార్థంగా ‘అతని పాత్రలను/సామగ్రిని.’
    reason: lexical_alternative
  - marker: b
    text: ‘బలవంతుడు’ అనేది సాతానును జయించడం గురించి యేసు ఉపయోగించిన రూపకంలో భాగం; ప్రధాన వాక్యం ఆ అర్థాన్ని నేరుగా చేర్చకుండా రూపకాన్ని నిలుపుతుంది.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: అయితే
  rationale: ముందున్న ఆరోపణకు యేసు ఇచ్చిన ప్రతివాదంతో ఈ మాటను అనుసంధానించే సహజమైన వ్యతిరేకార్థక ప్రయోగం.
- source_word: οὐδεὶς δύναται
  choice: ఎవ్వరూ ... దోచుకోలేరు
  rationale: అసాధ్యతను తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθὼν
  choice: అతని ఇంట్లోకి ప్రవేశించి
  rationale: ఇంటిలోకి వెళ్లడాన్ని సూచించే గ్రీకు కృదంత నిర్మాణాన్ని సహజమైన తెలుగు క్రియాక్రమంగా అందిస్తుంది; ‘అతని’ అనే పదం ముందున్న బలవంతుణ్ణి సూచిస్తుంది.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: బలవంతుణ్ణి
  rationale: విశేషణం నామవాచకంగా వాడబడింది. ‘బలవంతుడు’ రూపకం యొక్క వ్యక్తిగత, దృశ్య స్వభావాన్ని నిలుపుతుంది.
- source_word: τὰ σκεύη αὐτοῦ
  choice: అతని వస్తువులను
  rationale: σκεύη అనే పదం పాత్రలు లేదా పరికరాలు అనే మూలార్థం కలిగినా, ఇల్లు దోచుకునే సందర్భంలో ఇంటిలోని సామగ్రి లేదా ఆస్తిని విస్తృతంగా సూచిస్తుంది. ‘వస్తువులు’ సాధారణ పాఠకులకు సహజం.
- source_word: διαρπάσαι / διαρπάσει
  choice: దోచుకోలేరు / దోచుకుంటాడు
  rationale: బలవంతంగా స్వాధీనం చేసుకోవడం లేదా కొల్లగొట్టడం అనే క్రియ యొక్క బలాన్ని, అలాగే మొదటి క్రియలోని సామర్థ్య భావం మరియు చివరి క్రియలోని భవిష్యత్ ఫలితాన్ని సందర్భానుగుణంగా నిలుపుతుంది.
- source_word: ἐὰν μὴ πρῶτον ... δήσῃ
  choice: ముందుగా ... కట్టివేయకపోతే
  rationale: దోచుకోవడానికి ముందు తప్పనిసరిగా జరగవలసిన చర్యను స్పష్టమైన తెలుగు షరతు నిర్మాణంతో తెలియజేస్తుంది.
- source_word: καὶ τότε
  choice: కట్టివేసిన తరువాతే
  rationale: ముందటి షరతు నెరవేరిన తరువాత మాత్రమే తదుపరి చర్య జరుగుతుందనే కాలక్రమాన్నీ ఉద్ఘాటననూ తెలియజేస్తుంది.
- source_word: τὴν οἰκίαν αὐτοῦ διαρπάσει
  choice: అతని ఇంటిని దోచుకుంటాడు
  rationale: గ్రీకులో పునరావృతమైన ‘ఇల్లు’ అనే రూపక చిత్రాన్ని, ఏకవచన భవిష్యత్ ఫలితాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యేసు వాదనలో ‘బలవంతుడు’ అనే రూపకం
  choice: ప్రధాన వాక్యంలో రూపకాన్ని యథాతథంగా ఉంచడం
  alternative: ‘బలవంతుడు’ అంటే సాతాను అని ప్రధాన వాక్యంలోనే స్పష్టీకరించడం
  rationale: సందర్భంలో ఈ రూపకం సాతానును జయించడాన్ని సూచించినా, గ్రీకు వాక్యం దానిని రూపకంగానే చెబుతుంది. అనువాదం వ్యాఖ్యానాన్ని వాక్యంలో కలపకుండా ఆ రూపకాన్నే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, కానీ గంభీరత కోల్పోకుండా అనువదించబడింది. ‘బలవంతుడు,’ ‘ఇల్లు,’ ‘కట్టివేయడం,’ ‘దోచుకోవడం’ అనే సజీవ రూపక చిత్రాలు నిలుపబడ్డాయి.
