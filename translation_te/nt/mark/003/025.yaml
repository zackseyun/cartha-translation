source:
  edition: SBLGNT
  text: καὶ ἐὰν οἰκία ἐφ’ ἑαυτὴν μερισθῇ, οὐ ⸀δυνήσεται ⸂ἡ οἰκία ἐκείνη σταθῆναι⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/025.yaml
  text: And if a house is divided against itself[a], that house will not be able to stand.
translation:
  language: te
  text: మరియు ఒక ఇల్లు తనకు తానే విరోధంగా విభజించబడితే[a], ఆ ఇల్లు నిలబడలేకపోతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఇల్లు’ అనే పదానికి ‘కుటుంబం’ లేదా ‘ఇంటివారు’ అనే అర్థం కూడా ఉండవచ్చు. అయితే ఇక్కడ ‘నిలబడడం’ అనే రూపకం ‘ఇల్లు’ అనే అర్థానికే ఎక్కువగా అనుకూలంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: ఇల్లు
  rationale: ఈ పదానికి ‘ఇల్లు’ లేదా ‘ఇంటి వారు’ అనే అర్థాలు రావచ్చు. అయితే ‘నిలబడడం’ అనే రూపకం భవనాన్ని సూచించే ‘ఇల్లు’ అనే అనువాదానికి ప్రాధాన్యం ఇస్తుంది.
- source_word: ἐφ’ ἑαυτὴν
  choice: తనకు తానే వ్యతిరేకంగా
  rationale: ఈ ప్రయోగం అంతర్గత విరోధాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: μερισθῇ
  choice: చీలిపోతే
  rationale: అంతర్గత విభజన వల్ల ఏకత్వం చెదిరిపోవడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; షరతును కూడా నిలుపుతుంది.
- source_word: δυνήσεται
  choice: నిలబడగలగదు అనే క్రియారూపంలోని ‘గలగదు’
  rationale: భవిష్యత్ సామర్థ్యలేమిని సూచించే గ్రీకు క్రియ భావాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: σταθῆναι
  choice: నిలబడ
  rationale: ఇల్లు నిలిచి ఉండడం అనే ప్రత్యక్ష రూపకాన్ని కాపాడుతూ, నిలకడగా కొనసాగలేకపోవడం అనే అంతర్లీన భావాన్నీ అందిస్తుంది.
- source_word: ἡ οἰκία ἐκείνη
  choice: ఆ ఇల్లు
  rationale: ἐκείνη అనే నిర్దేశక పదం ఇచ్చే ఉద్ఘాటనను సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: καὶ ἐὰν
  choice: అలాగే, ... అయితే
  rationale: ముందటి వాక్యంలోని తర్కాన్ని కొనసాగించే καί భావాన్ని ‘అలాగే’ తెలియజేస్తుంది; ἐὰν సూచించే షరతు ‘-తే’ రూపంలో వ్యక్తమవుతుంది.
