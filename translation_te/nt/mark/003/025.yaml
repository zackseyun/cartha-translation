  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా అనువదించబడింది. ‘విభజించబడితే’ కంటే అంతర్గత పగను స్పష్టంగా తెలిపే ‘చీలిపోతే’ ఎంచుకోబడింది; మూలంలోని ఇల్లు–నిలబడడం రూపకం అలాగే ఉంచబడింది.
