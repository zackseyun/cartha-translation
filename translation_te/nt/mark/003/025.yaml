revisions:
- from: అలాగే, ఒక ఇల్లు తనకు తానే వ్యతిరేకంగా చీలిపోతే[a], ఆ ఇల్లు నిలబడగలగదు.
  to: మరియు ఒక ఇల్లు తనకు తానే విరోధంగా విభజించబడితే[a], ఆ ఇల్లు నిలబడలేకపోతుంది.
  rationale: The revision explicitly restores the negated future capability in οὐ δυνήσεται, uses a natural passive expression for μερισθῇ, and preserves both the conditional structure and the house–standing metaphor. The footnote retains the legitimate lexical alternative in idiomatic Telugu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:00:57Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly represents the conditional internal opposition and retains the house/standing imagery. However, “నిలబడగలగదు” ordinarily expresses ability (“can stand”), whereas the Greek οὐ δυνήσεται requires inability: “will not be able to stand.”'
  naturalness: “తనకు తానే వ్యతిరేకంగా చీలిపోతే” is understandable, but “తనకు తానే విరోధంగా విభజించబడితే” more directly and naturally conveys the source’s passive idiom of division against itself. The revised final clause is idiomatic modern standard Telugu.
  terminology: “ఇల్లు” appropriately preserves οἰκία and the linked metaphor of standing. The footnote’s alternative is better expressed as “కుటుంబం/ఇంటివారు,” rather than treating “ఇంటి వారు” as the sole lexical equivalent.
  issues:
  - severity: high
    issue: The final verb lacks the source negation.
    rationale: Greek οὐ δυνήσεται means “will not be able”; “నిలబడగలగదు” reads as “is able to stand.” The Telugu must explicitly express inability.
  - severity: low
    issue: “చీలిపోతే” is less exact than the passive sense of μερισθῇ.
    rationale: It can suggest physically cracking apart. “విభజించబడితే” preserves the source’s general passive sense of being divided while retaining the metaphor.
  revised_text: మరియు ఒక ఇల్లు తనకు తానే విరోధంగా విభజించబడితే[a], ఆ ఇల్లు నిలబడలేకపోతుంది.
  revised_footnotes:
  - marker: a
    text: ‘ఇల్లు’ అనే పదానికి ‘కుటుంబం’ లేదా ‘ఇంటివారు’ అనే అర్థం కూడా ఉండవచ్చు. అయితే ఇక్కడ ‘నిలబడడం’ అనే రూపకం ‘ఇల్లు’ అనే అర్థానికే ఎక్కువగా అనుకూలంగా ఉంది.
    reason: lexical_alternative
  revision_rationale: The revision explicitly restores the negated future capability in οὐ δυνήσεται, uses a natural passive expression for μερισθῇ, and preserves both the conditional structure and the house–standing metaphor. The footnote retains the legitimate lexical alternative in idiomatic Telugu.
