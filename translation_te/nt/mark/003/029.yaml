id: MRK.3.29
reference: Mark 3:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν βλασφημήσῃ εἰς τὸ πνεῦμα τὸ ἅγιον, οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα, ἀλλὰ ἔνοχός ἐστιν αἰωνίου ⸀ἁμαρτήματος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/029.yaml
  text: but whoever blasphemes against the Holy Spirit never has forgiveness[c][b][a], but is guilty of an eternal sin.
translation:
  language: te
  text: కాని పరిశుద్ధాత్మను దూషించేవాడికి ఎన్నటికీ క్షమాపణ ఉండదు[a]; అతడు శాశ్వతమైన పాపానికి బాధ్యుడు[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘యుగం వరకు క్షమాపణ కలిగి ఉండడు’; అంటే, ‘ఎన్నటికీ క్షమాపణ ఉండదు’ లేదా ‘ఎప్పటికీ అతనికి క్షమాపణ ఉండదు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘శాశ్వతమైన పాపానికి దోషిగా ఉంటాడు.’
    reason: lexical_alternative
  - marker: c
    text: కొన్ని ప్రాచీన ప్రతుల్లో ‘శాశ్వతమైన పాపం’కు బదులుగా ‘శాశ్వతమైన తీర్పు’ లేదా ‘శాశ్వతమైన శిక్షావిధి’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: కాని … చేసేవాడు
  rationale: ὃς తో ἄν అనిర్దిష్ట సంబంధవాక్యాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సాధారణ వర్తమాన భావంతో ‘… చేసేవాడు’ సహజంగా ఉంటుంది. δέ ముందున్న మాటతో స్వల్ప వ్యత్యాసాన్ని చూపుతుంది కాబట్టి ‘కాని’ వాడబడింది.
- source_word: βλασφημήσῃ
  choice: దూషించేవాడు
  rationale: ఇది సాధారణ షరతు భావాన్ని వ్యక్తం చేస్తుంది. ‘దూషించు’ అనే పదం అవమానకరంగా, అపవిత్రంగా మాట్లాడే భావాన్ని మరియు ఈ సందర్భంలోని మతపరమైన గంభీరతను నిలుపుతుంది.
- source_word: εἰς τὸ πνεῦμα τὸ ἅγιον
  choice: పరిశుద్ధాత్మను
  rationale: ఇక్కడ εἰς దూషణకు గురయ్యే లక్ష్యాన్ని సూచిస్తుంది. తెలుగులో కర్మవిభక్తితో ‘పరిశుద్ధాత్మను దూషించు’ అనడం సహజం.
- source_word: οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα
  choice: ఎన్నటికీ క్షమాపణ పొందడు
  rationale: ἄφεσις అంటే క్షమాపణ లేదా విడుదల. ప్రతికూల వాక్యంలో εἰς τὸν αἰῶνα ‘ఎప్పటికీ కాదు’ అనే భావాన్నిస్తుంది; ‘ఎన్నటికీ … పొందడు’ ఆ భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: ἀλλὰ
  choice: అతడు …
  rationale: ἀλλά ముందటి ప్రతికూల ప్రకటనకు విరుద్ధంగా తరువాతి పరిణామాన్ని బలంగా ఉంచుతుంది. తెలుగు వాక్య నిర్మాణంలో అర్థస్పష్టత కోసం సెమికోలన్ తరువాత కర్తను మళ్లీ పేర్కొనడం సహజం; వ్యత్యాసం మొత్తం నిర్మాణంలో నిలుస్తుంది.
- source_word: ἔνοχός ἐστιν
  choice: దోషిగా ఉంటాడు
  rationale: ἔνοχος ‘దోషి’ లేదా ‘బాధ్యుడు/శిక్షకు పాత్రుడు’ అనే న్యాయపరమైన భావం కలిగి ఉంది. ‘దోషిగా ఉంటాడు’ ప్రధాన అర్థాన్ని స్పష్టంగా ఉంచుతుంది; ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: αἰωνίου ἁμαρτήματος
  choice: శాశ్వతమైన పాపానికి
  rationale: అందించిన SBLGNT పాఠంలో ἁμαρτήματος అంటే ‘పాపం’; αἰωνίου దాని శాశ్వత స్వభావాన్ని సూచిస్తుంది. అందువల్ల పాఠంలోని అసాధారణమైనా ఉద్దేశపూర్వకమైన పదబంధాన్ని వివరణతో మార్చకుండా అనువదించబడింది.
theological_decisions:
- issue: క్షమాపణలేని అపరాధ స్వభావం
  choice: ‘పరిశుద్ధాత్మను దూషించేవాడు’ అనే వచనంలోని ప్రత్యక్ష పదప్రయోగాన్నే ఉంచడం
  alternative: ఇది ఉద్దేశపూర్వకంగా, నిరంతరంగా ఆత్మ సాక్ష్యాన్ని తిరస్కరించడం అని లేదా ఆత్మ కార్యాన్ని దయ్యాల శక్తికి ఆపాదించడం అని ప్రధాన పాఠంలో వివరించడం
  rationale: సందర్భం ఈ మాటను అర్థం చేసుకోవడానికి సహాయపడినా, ఈ వచనం స్వయంగా అపరాధాన్ని పరిశుద్ధాత్మను దూషించడం అని చెబుతుంది. ఒక నిర్దిష్ట సిద్ధాంత వివరణను ప్రధాన పాఠంలో చేర్చకుండా వచనంలోని ఉద్రిక్తత నిలుపబడింది.
- issue: వచనాంతంలోని పాఠాంతరం
  choice: SBLGNT పాఠం ప్రకారం ‘శాశ్వతమైన పాపం’ అని అనువదించడం
  alternative: ‘శాశ్వతమైన తీర్పు’ లేదా ‘శాశ్వతమైన శిక్షావిధి’
  rationale: అందించిన మూలపాఠంలో αἰωνίου ἁμαρτήματος ఉంది. అందువల్ల ప్రధాన పాఠం ‘శాశ్వతమైన పాపం’ అనే పాఠాన్నే అనుసరిస్తుంది; ఇతర ప్రతుల పాఠాంతరం పాదసూచికలో పారదర్శకంగా ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన శైలిని వాడాం. ‘పరిశుద్ధాత్మ’, ‘క్షమాపణ’, ‘పాపం’ వంటి విస్తృతంగా అర్థమయ్యే బైబిలు పదాలను నిలిపి, ప్రాచీన క్రియారూపాలను నివారించాం.
