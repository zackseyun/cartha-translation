translation:
  language: te
  text: ఆయన పన్నెండుగురిని నియమించాడు; సీమోనుకు పేతురు[a] అనే పేరు పెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పేతురు’ అనే పేరుకు ‘బండ’ అని అర్థం.
    reason: పేరైన Πέτρος యొక్క పదార్థాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: ἐποίησεν
  choice: నియమించి
  rationale: పదశః ‘చేశాడు’ అనే అర్థం ఉన్నా, ఇక్కడ పన్నెండుగురిని ఒక ప్రత్యేక సమూహంగా ఏర్పాటు చేసిన సందర్భంలో ‘నియమించాడు’ సహజంగా, సందర్భబద్ధంగా ఉంది.
- source_word: τοὺς δώδεκα
  choice: పన్నెండుగురిని
  rationale: యేసు ప్రత్యేకంగా ఏర్పరచిన పన్నెండు మంది శిష్యుల సమూహాన్ని సూచిస్తుంది; తెలుగులో సంఖ్యతో వ్యక్తులను సూచించే సహజ రూపం ఇది.
- source_word: ἐπέθηκεν ὄνομα
  choice: పేరు పెట్టాడు
  rationale: పదశః ‘పేరును ఉంచాడు’ అనే గ్రీకు నుడికారానికి సహజమైన తెలుగు సమానార్థక ప్రయోగం.
- source_word: Σίμωνι
  choice: సీమోనుకు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: Πέτρον
  choice: పేతురు
  rationale: ఇక్కడ ఇది సీమోనుకు పెట్టిన వ్యక్తి పేరు కాబట్టి అర్థానువాదం చేయకుండా తెలుగు సంప్రదాయ లిప్యంతరీకరణను ఉపయోగించాం; పేరులోని ‘బండ/రాయి’ భావాన్ని పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: పన్నెండుగురిపట్ల యేసు చేసిన కార్యం
  choice: పన్నెండుగురిని నియమించి
  alternative: పన్నెండుగురిని చేసి / పన్నెండుగురిగా ఏర్పాటు చేసి
  rationale: ఈ సందర్భం వారిని ప్రత్యేక సమూహంగా స్థాపించడాన్ని సూచిస్తుంది. ‘నియమించి’ ఆ అధికారిక భావాన్ని తెలియజేస్తుంది; తరువాతి సంఘపరమైన పదవీ వ్యవస్థను అనవసరంగా దిగుమతి చేయదు.
- issue: Πέτρος పేరును అనువదించే విధానం
  choice: పేతురు
  alternative: బండ / రాయి
  rationale: Πέτρος ఇక్కడ వ్యక్తి పేరుగా పనిచేస్తోంది కాబట్టి ప్రధాన పాఠ్యంలో లిప్యంతరీకరించాం. దాని పదార్థాన్ని పాదసూచికలో ఉంచడం ద్వారా పేరుగానూ దాని అర్థంగానూ రెండింటినీ కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. గ్రీకు వాక్యంలోని వరుస కార్యాలను ‘నియమించి … పేరు పెట్టాడు’ అనే అనుసంధానంతో స్పష్టంగా అందించాం.
