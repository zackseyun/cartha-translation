source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς ἀνέστη ἐφ’ ἑαυτὸν καὶ ⸀ἐμερίσθη, οὐ δύναται ⸀στῆναι ἀλλὰ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/026.yaml
  text: And if Satan has risen up against himself and is divided[a], he cannot stand, but has come to an end.
translation:
  language: te
  text: సాతాను తనకే విరోధంగా లేచి, తనలో తాను విభజించబడితే, అతడు నిలవలేడు; అతనికి అంతమే ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “అతనికి అంతం ఉంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σατανᾶς
  choice: సాతాను
  rationale: తెలుగులో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
- source_word: ἀνέστη ἐφ’ ἑαυτὸν
  choice: తనకే విరోధంగా లేచి
  rationale: ἐπίతో కూడిన ఆత్మవాచక సర్వనామం ఈ సందర్భంలో తనకు తానే వ్యతిరేకంగా తిరగబడే భావాన్ని ఇస్తుంది; ‘లేచి’ అనే పదం ἀνέστη యొక్క రూపకాన్ని నిలుపుతుంది.
- source_word: ἐμερίσθη
  choice: తనలో తాను విభజించబడితే
  rationale: కర్మణి రూపాన్నీ, అంతర్గత విభజన భావాన్నీ స్పష్టంగా తెలిపే సహజమైన తెలుగు ప్రయోగం.
- source_word: οὐ δύναται στῆναι
  choice: అతడు నిలవలేడు
  rationale: కొనసాగలేకపోవడం లేదా స్థిరంగా ఉండలేకపోవడం అనే సందర్భార్థాన్ని తెలియజేస్తూనే ‘నిలుచుట’ అనే మూల రూపకాన్ని కాపాడుతుంది.
- source_word: ἀλλὰ τέλος ἔχει
  choice: అతని అంతం వచ్చినట్టే
  rationale: అక్షరార్థమైన ‘అంతం కలిగి ఉన్నాడు’ తెలుగులో అసహజంగా ఉంటుంది. విభజన వల్ల అతడు ఇక నిలవలేడనే తార్కిక ఫలితాన్ని సహజంగా, అతిగా విస్తరించకుండా ఈ రూపం తెలియజేస్తుంది.
theological_decisions:
- issue: సాతాను అంతం గురించిన వాక్య స్వభావం
  choice: యేసు చేస్తున్న షరతుతో కూడిన తార్కిక వాదనలోని పరిణామంగా అనువదించాం.
  alternative: ఈ వచనాన్నే సాతాను యొక్క అంతిమ పరాజయం పూర్తయిందనే స్వతంత్ర సిద్ధాంత ప్రకటనగా అనువదించడం.
  rationale: ఈ సందర్భంలో యేసు, సాతాను తనకే విరోధంగా పనిచేస్తున్నాడనే ఆరోపణ అసంగతమని చూపుతున్నాడు. కాబట్టి మూలంలోని బలాన్ని నిలుపుతూ, ఈ ఒక్క వచనంలో లేనంత అంత్యకాల అర్థాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘తనకే విరోధంగా’, ‘నిలవలేడు’ అనే పదబంధాలు మూలంలోని ప్రతిఘటన మరియు నిలిచి ఉండలేకపోవడం అనే రూపకాలను కాపాడుతున్నాయి. పాదసూచిక గుర్తును అది వివరించే చివరి వాక్యభాగం వద్ద ఉంచాం.
