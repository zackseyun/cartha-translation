id: MRK.3.34
reference: Mark 3:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος ⸂τοὺς περὶ αὐτὸν κύκλῳ⸃ καθημένους λέγει· Ἴδε ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/034.yaml
  text: And looking around at those seated around him in a circle[a], he says, “Behold, my mother and my brothers!”
translation:
  language: te
  text: ఆయన తన చుట్టూ వలయంగా కూర్చున్నవారిని చుట్టూ చూసి, “ఇదిగో, వీరే నా తల్లి, నా సహోదరులు![a]” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తోబుట్టువులు.” గ్రీకు మూలంలో “సహోదరులు” అని ఉంది; అయితే యేసు చుట్టూ ఉన్న విస్తృత సమూహంలో స్త్రీలు కూడా ఉండి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: కలయచూసి
  rationale: యేసు తన చుట్టూ ఉన్నవారందరినీ ఉద్దేశపూర్వకంగా చుట్టూ చూడడాన్ని సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: τοὺς περὶ αὐτὸν κύκλῳ καθημένους
  choice: తన చుట్టూ వలయంగా కూర్చున్నవారిని
  rationale: περὶ αὐτόν, κύκλῳ, καθημένους అనే మూడు స్థలవివరాలనూ నిలుపుతూ, ఆయన చుట్టూ వలయాకారంగా కూర్చున్నారని స్పష్టంగా తెలియజేస్తుంది.
- source_word: λέγει
  choice: అని అన్నాడు
  rationale: గ్రీకులో మార్కు వాడిన చారిత్రక వర్తమానాన్ని తెలుగులో యథాతథంగా ఉంచితే అసహజంగా ఉండవచ్చు; సహజమైన తెలుగు కథనశైలికి భూతకాల రూపం అనుకూలం.
- source_word: Ἴδε
  choice: ఇదిగో
  rationale: దృష్టిని ఎదుట ఉన్నవారివైపు మళ్లించే Ἴδε పదబలాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: μήτηρ
  choice: తల్లి
  rationale: ప్రామాణికమైన ప్రత్యక్ష అర్థం.
- source_word: ἀδελφοί
  choice: సహోదరులు
  rationale: గ్రీకు పదంలోని పుంలింగ బహువచన రూపాన్ని నిలుపుతుంది; సందర్భంలో స్త్రీలు కూడా అంతర్భవించి ఉండవచ్చనే విస్తృత భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
theological_decisions:
- issue: యేసు చుట్టూ ఉన్న సమూహంలో స్త్రీలు కూడా ఉండవచ్చని సూచించే సందర్భంలో ἀδελφοί అనే లింగసూచక కుటుంబపదం
  choice: సహోదరులు
  alternative: తోబుట్టువులు / సహోదర సహోదరీలు
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, ఆ సంబోధన స్త్రీలను కూడా కలుపుకొని ఉండవచ్చనే నిజమైన సందర్భసంభావ్యతను పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వాక్య గౌరవాన్ని నిలుపుతూ అనువదించబడింది. “కలయచూసి” ఉద్దేశపూర్వకంగా చుట్టూ చూడడాన్ని, “వలయంగా” κύκλῳ యొక్క స్థలప్రాధాన్యాన్ని నిలుపుతాయి.
