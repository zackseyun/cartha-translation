source:
  edition: SBLGNT
  text: Καὶ ἀναβαίνει εἰς τὸ ὄρος καὶ προσκαλεῖται οὓς ἤθελεν αὐτός, καὶ ἀπῆλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/013.yaml
  text: And he went up on the mountain and called to himself those whom he wanted[b][a], and they came to him.
translation:
  language: te
  text: ఆయన కొండపైకి ఎక్కి, తాను కోరుకున్నవారిని తన దగ్గరికి పిలిచాడు; వారు ఆయన దగ్గరికి వెళ్లారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు ఆయన దగ్గరికి వచ్చారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβαίνει
  choice: ఎక్కి
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నా, తెలుగు కథనశైలిలో గత సంఘటనను సహజంగా తెలిపేందుకు సమాపక క్రియతో కలిసి ‘ఎక్కి’ అని అనువదించాం; పైకి వెళ్లే భావం నిలిచింది.
- source_word: εἰς τὸ ὄρος
  choice: కొండపైకి
  rationale: ἀναβαίνειతో కలిసి ఇది కొండమీదికి ఎక్కి వెళ్లడాన్ని సూచిస్తుంది. ‘కొండపైకి’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: προσκαλεῖται
  choice: తన దగ్గరికి పిలిచాడు
  rationale: మధ్యమ వాచ్యంలోని వ్యక్తిగత ప్రమేయాన్ని, తనవైపు పిలిచిన భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: οὓς ἤθελεν αὐτός
  choice: తాను కోరుకున్నవారిని
  rationale: ‘తాను’ అనే ఆత్మవాచక రూపం αὐτός ఇచ్చే కర్తపై నొక్కును తెలుగులో సహజంగా నిలుపుతుంది; ‘కోరుకున్న’ θέλω యొక్క సందర్భోచిత అర్థం.
- source_word: ἀπῆλθον πρὸς αὐτόν
  choice: వారు ఆయన దగ్గరికి వెళ్లారు
  rationale: ἀπέρχομαι యొక్క ‘వెళ్లారు’ అనే దిశాభావాన్ని నిలిపి, πρὸς αὐτόν ద్వారా గమ్యం ఆయన దగ్గరేనని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: పిలవబడినవారి విషయంలో యేసు స్వయంగా చేసిన ఎంపికపై నొక్కు
  choice: ‘తాను కోరుకున్నవారిని’ అని అనువదించి αὐτός యొక్క నొక్కును నిలిపాం.
  alternative: ‘ఆయన కోరుకున్నవారిని’
  rationale: వచనం యేసు స్వీయ చొరవను నొక్కి చెబుతుంది; అయితే దీనిని వచనం చెప్పని విస్తృతమైన ఎన్నిక సిద్ధాంతంగా వివరించలేదు.
- issue: ἀπῆλθον యొక్క దృక్కోణం
  choice: ‘వెళ్లారు’
  alternative: ‘వచ్చారు’
  rationale: గ్రీకు క్రియ సాధారణంగా వెళ్లడాన్ని సూచిస్తుంది; πρὸς αὐτόν కదలిక యేసువైపని తెలుపుతుంది. ‘వచ్చారు’ కూడా దృక్కోణపరంగా సాధ్యమైనందున పాదటీకలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన కథనశైలి. ‘తాను’ ద్వారా గ్రీకు αὐτός యొక్క నొక్కును అసహజ పునరుక్తి లేకుండా నిలిపాం.
