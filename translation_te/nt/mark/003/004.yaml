source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ἔξεστιν τοῖς σάββασιν ⸀ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ἀποκτεῖναι; οἱ δὲ ἐσιώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/004.yaml
  text: And he said to them[a], “Is it lawful on the Sabbath to do good or to do harm[b], to save a life or to kill?” But they were silent.
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “విశ్రాంతి దినాన[a] మేలు చేయడం ధర్మసమ్మతమా, కీడు చేయడం ధర్మసమ్మతమా? ప్రాణాన్ని కాపాడడమా, చంపడమా?” కాని వారు మౌనంగా ఉండిపోయారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకు పాఠంలో “విశ్రాంతి దినాల్లో” అని బహువచన రూపం ఉంది; ఇక్కడ అది “విశ్రాంతి దినాన” అనే అర్థాన్నిచ్చే సాధారణ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔξεστιν
  choice: ధర్మసమ్మతమా
  rationale: విశ్రాంతి రోజు ఆచరణకు సంబంధించిన ధార్మిక-న్యాయ వివాదంలో, ధర్మశాస్త్రం ప్రకారం ఏది అనుమతించబడిందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τοῖς σάββασιν
  choice: విశ్రాంతి రోజున
  rationale: గ్రీకులో బహువచనం ఉన్నప్పటికీ ఇది ఒక విశ్రాంతి రోజును సూచించే సాధారణ కొయినే ప్రయోగం; తెలుగు ఏకవచనం సందర్భానికి సహజంగా, స్పష్టంగా ఉంది. మూలరూపం పాదసూచికలో తెలిపబడింది.
- source_word: ἀγαθοποιῆσαι
  choice: మేలు చేయడం
  rationale: మంచి లేదా ప్రయోజనకరమైన పని చేయడం అనే ప్రత్యక్ష భావాన్ని సరళంగా నిలుపుతుంది.
- source_word: κακοποιῆσαι
  choice: కీడు చేయడం
  rationale: మేలు చేయడానికి వ్యతిరేకంగా చెడు లేదా హానికరమైన పని చేయడం అనే భావాన్ని ఇస్తుంది; తదుపరి ప్రాణాన్ని కాపాడడం లేదా చంపడం అనే వ్యత్యాసంతోనూ సరిపోతుంది.
- source_word: ψυχὴν σῶσαι
  choice: ప్రాణాన్ని కాపాడడం
  rationale: ఇక్కడ ψυχή అమూర్తమైన ఆత్మను కాక, చంపబడటానికి వ్యతిరేకంగా ఒకరి జీవప్రాణాన్ని సూచిస్తుంది.
- source_word: ἀποκτεῖναι
  choice: చంపడం
  rationale: హత్య అనే అదనపు న్యాయార్థాన్ని చేర్చకుండా క్రియ యొక్క ప్రాథమిక అర్థాన్ని నిలుపుతుంది.
- source_word: ἐσιώπων
  choice: మౌనంగా ఉండిపోయారు
  rationale: ప్రశ్నకు సమాధానం చెప్పకుండా వారు మౌనాన్ని కొనసాగించారనే అసంపూర్ణ భూతకాల కథన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: విశ్రాంతి రోజు ఆచరణలో ఏది అనుమతించబడిందనే ప్రశ్న
  choice: ధర్మసమ్మతమా
  alternative: అనుమతించబడిందా
  rationale: ఇది కేవలం సాధారణ అనుమతి గురించిన ప్రశ్న కాదు; విశ్రాంతి రోజు విషయంలో ధర్మశాస్త్రపరంగా ఏది సమ్మతమనే వివాదం. అయినప్పటికీ ఏ ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్నీ ఇందులో చేర్చలేదు.
- issue: τοῖς σάββασιν అనే బహువచన ప్రయోగం
  choice: ప్రధాన పాఠంలో సహజమైన ఏకవచనం “విశ్రాంతి రోజున”
  alternative: విశ్రాంతి రోజుల్లో
  rationale: సందర్భంలో ఒక విశ్రాంతి రోజున జరిగిన సంఘటనను సూచించే గ్రీకు వాడుక ఇది. బహువచనాన్ని తెలుగులో యథాతథంగా ఉంచితే అనేక రోజుల గురించి సాధారణ నియమం అడిగినట్టు అపార్థం కలగవచ్చు; మూలరూపం పాదసూచికలో సంరక్షించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. “చట్టబద్ధమా” అనే ఆధునిక లౌకిక న్యాయపదానికి బదులు, సందర్భంలోని ధర్మశాస్త్రపరమైన బలాన్ని తెలిపేందుకు “ధర్మసమ్మతమా” ఎంచుకోబడింది.
