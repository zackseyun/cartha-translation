id: MRK.3.22
reference: Mark 3:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οἱ γραμματεῖς οἱ ἀπὸ Ἱεροσολύμων καταβάντες ἔλεγον ὅτι Βεελζεβοὺλ ἔχει καὶ ὅτι ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/022.yaml
  text: And the scribes who had come down from Jerusalem were saying[a], “He has Beelzebul,” and[c][b], “By the ruler of the demons he casts out the demons.”
translation:
  language: te
  text: యెరూషలేము నుండి దిగివచ్చిన శాస్త్రులు, “ఇతనికి బయెల్జెబూలు పట్టాడు[a],” అనీ, “దయ్యాల అధిపతి ద్వారా ఇతడు దయ్యాలను వెళ్లగొడుతున్నాడు[b],” అనీ చెబుతూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత స్పష్టంగా: “ఇతడు బయెల్జెబూలు ఆధీనంలో ఉన్నాడు.” గ్రీకు పేరు Βεελζεβούλ; సంప్రదాయంగా దీనిని “బయెల్జెబూబు” అని కూడా అంటారు.'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: “దయ్యాల అధిపతి అధికారంతో.” ‘అధిపతి’ని “పాలకుడు” అని కూడా అనువదించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματεῖς
  choice: శాస్త్రులు
  rationale: సువార్తల సందర్భంలో యూదుల ధర్మశాస్త్రంలో నిపుణులైన అధికారిక బోధకులను సూచించే స్థిరమైన, సాధారణ తెలుగు పదం; కేవలం నకలు రాసేవారనే అపార్థాన్ని నివారిస్తుంది.
- source_word: ἀπὸ Ἱεροσολύμων καταβάντες
  choice: యెరూషలేము నుండి దిగివచ్చిన
  rationale: καταβάντες లోని దిశార్థాన్ని నిలుపుతూ తెలుగులో సహజమైన విశేషణ ఉపవాక్యంగా అనువదించబడింది.
- source_word: ἔλεγον
  choice: చెబుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న లేదా పదేపదే చేస్తున్న మాటల భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: Βεελζεβοὺλ
  choice: బయల్జెబూలు
  rationale: గ్రీకు Βεελζεβούλ రూపానికి సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: ἔχει
  choice: ఇతనిలో ... ఉన్నాడు
  rationale: గ్రీకు వాక్యం అక్షరార్థంగా ‘కలిగి ఉన్నాడు’ అని చెప్పినా, వ్యక్తిని కలిగి ఉండటం అనే నిర్మాణం తెలుగులో అసహజం. ‘ఇతనిలో ... ఉన్నాడు’ అనేది స్వాధీనత లేదా ఆధీనత అనే సందర్భార్థాన్ని పూర్తిగా విప్పి చెప్పకుండా సహజంగా నిలుపుతుంది.
- source_word: ἐν τῷ ἄρχοντι τῶν δαιμονίων
  choice: దయ్యాల అధిపతి శక్తితోనే
  rationale: ఇక్కడ ἐν సాధనార్థకంగా ఉంది. ‘శక్తితో’ అనేది ఆ అధిపతి ద్వారా లేదా అతని అధికారబలంతో చేస్తున్నాడనే నిందను సహజ తెలుగులో తెలియజేస్తుంది; ‘అధిపతి’ ἄρχων యొక్క అధికార భావాన్ని అందిస్తుంది.
- source_word: δαιμονίων / δαιμόνια
  choice: దయ్యాలు
  rationale: మూలంలోని δαιμόνιον కు నేరమైన, సాధారణ ఆధునిక తెలుగు సమానార్థకం; వేరే గ్రీకు పదబంధమైన ‘అపవిత్రాత్మలు’ను ఇక్కడ దిగుమతి చేయదు.
- source_word: ἐκβάλλει
  choice: వెళ్లగొడుతున్నాడు
  rationale: బలవంతంగా బయటకు పంపే భావాన్ని సహజ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: Βεελζεβοὺλ ἔχει అనే నిందను అనువదించడం
  choice: ఇతనిలో బయల్జెబూలు ఉన్నాడు
  alternative: ఇతడు బయల్జెబూలు పట్టినవాడు / ఇతడు బయల్జెబూలు ఆధీనంలో ఉన్నాడు
  rationale: మూలంలోని సంక్షిప్తమైన ‘కలిగి ఉన్నాడు’ అనే నుడికారాన్ని తెలుగులో సాధ్యమైనంత దగ్గరగా, సహజంగా ఉంచుతుంది. అది దయ్యం పట్టడం లేదా ఆధీనతను సూచిస్తుందని పాదటిప్పణిలో స్పష్టం చేస్తుంది; ప్రధాన పాఠంలో భావాన్ని అనవసరంగా పూర్తిగా నిర్ణయించదు.
- issue: ἄρχων ను అనువదించడం
  choice: అధిపతి
  alternative: పాలకుడు / అధికారి
  rationale: దయ్యాలపై అధికారమున్నవాడనే భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో స్పష్టంగా అందిస్తుంది; రాజకీయ పాలకుడనే పరిమిత భావాన్ని రుద్దదు.
- issue: సాధనార్థక ἐν ను వ్యక్తపరచడం
  choice: శక్తితోనే
  alternative: ద్వారా / అధికారంతో
  rationale: యేసు దయ్యాల అధిపతి బలంతోనే దయ్యాలను వెళ్లగొడుతున్నాడనే వారి ఆరోపణను తెలుగులో స్పష్టం చేస్తుంది. ‘నే’ మూలంలోని రెండు ఆరోపణల తార్కిక బలాన్ని సహజంగా ప్రతిబింబిస్తుంది, ఏ సిద్ధాంతపరమైన సమర్థనను జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు. వాక్య నిర్మాణం సాధారణ పాఠకులకు సహజంగా ఉండేలా చేసినప్పటికీ, మూలంలోని రెండు వేర్వేరు ఆరోపణలు మరియు ἔλεγον యొక్క కొనసాగుతున్న క్రియాభావం నిలుపబడ్డాయి. ‘శాస్త్రులు,’ ‘అధిపతి,’ ‘దయ్యాలు’ వంటి పరిచితమైన బైబిలు పదజాలాన్ని అనవసర పురాతనత్వం లేకుండా ఉపయోగించాం.
