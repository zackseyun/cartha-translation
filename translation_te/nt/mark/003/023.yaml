id: MRK.3.23
reference: Mark 3:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος αὐτοὺς ἐν παραβολαῖς ἔλεγεν αὐτοῖς· Πῶς δύναται Σατανᾶς Σατανᾶν ἐκβάλλειν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/023.yaml
  text: 'And after calling them to himself, he was speaking to them in parables: “How can Satan cast out Satan?”'
translation:
  language: te
  text: 'ఆయన వారిని తన దగ్గరికి పిలిచి, ఉపమానాలతో వారితో ఇలా మాట్లాడాడు: “సాతాను సాతానును ఎలా వెళ్లగొట్టగలడు?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: తన దగ్గరికి పిలిచి
  rationale: ఆయన వారిని తనవద్దకు పిలిచిన తరువాత మాట్లాడాడనే క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; మధ్యమ ప్రయోగంలోని ‘తనవద్దకు’ భావాన్ని నిలుపుతుంది.
- source_word: ἐν παραβολαῖς
  choice: ఉపమానాలతో
  rationale: సందర్భంలోని దృష్టాంతాత్మక పోలికలను సూచిస్తూ, గ్రీకు బహువచన భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἔλεγεν
  choice: ఇలా మాట్లాడాడు
  rationale: గ్రీకు అపూర్ణ భూతకాల రూపం సంభాషణ కొనసాగింపును సూచించగలదు; అయితే ఈ వాక్య ప్రవేశంలో సహజ తెలుగు కథనశైలికి ‘మాట్లాడాడు’ సరిపోతుంది.
- source_word: Πῶς δύναται
  choice: ఎలా ... గలడు?
  rationale: సాధ్యతను ప్రశ్నించే అలంకారిక ప్రశ్న బలాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: Σατανᾶς
  choice: సాతాను
  rationale: తెలుగులో స్థిరపడిన పేరురూపాన్ని ఉపయోగిస్తుంది; కర్త, కర్మ రెండింటిలోనూ సందర్భానుసార విభక్తితో అదే పేరును ఉంచుతుంది.
- source_word: ἐκβάλλειν
  choice: వెళ్లగొట్టగలడు
  rationale: మార్కు సందర్భంలో దయ్యాలను బయటికి తరిమివేయడాన్ని సూచించే క్రియను సాధారణ పాఠకులకు స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: సాతాను తనకే వ్యతిరేకంగా వ్యవహరించగలడా అనే యేసు ప్రశ్న బలం
  choice: “సాతాను సాతానును ఎలా వెళ్లగొట్టగలడు?” అనే అసాధ్యతను సూచించే అలంకారిక ప్రశ్నగా ఉంచడం
  alternative: “సాతాను సాతానును వెళ్లగొట్టడం ఎలా సాధ్యం?”
  rationale: గ్రీకు వాక్యం సాధ్యతను ప్రశ్నిస్తుంది; సందర్భంలోని ఆరోపణ అసంగతమని ప్రశ్న ద్వారా చూపుతుంది. ప్రధాన పాఠ్యంలో అదనపు సిద్ధాంత వివరణను చేర్చకుండా ఆ ప్రశ్న బలాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి. ‘ఉపమానాలతో’ అనే రూపం గ్రీకు బహువచనాన్ని సహజంగా అందిస్తుంది.
