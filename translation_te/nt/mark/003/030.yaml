translation:
  language: te
  text: ఎందుకంటే, “ఆయనలో అపవిత్ర ఆత్మ ఉంది” అని వారు అంటూ ఉండేవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత వాడుకగా: “ఆయనను అపవిత్ర ఆత్మ పట్టుకుంది” అని వారు అంటూ ఉండేవారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలో యేసు చేసిన ప్రకటనకు కారణాన్ని ఇది తెలియజేస్తోంది; అందువల్ల కారణార్థాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἔλεγον
  choice: అని వారు అంటూ ఉండేవారు
  rationale: అసంపూర్ణ భూతకాల రూపం వారు ఈ మాటను కొనసాగిస్తూ లేదా పదేపదే అన్నారనే భావాన్ని నిలుపుతుంది.
- source_word: Πνεῦμα ἀκάθαρτον
  choice: అపవిత్రాత్మ
  rationale: సువార్తల్లో దయ్య సంబంధమైన ఆత్మకు వాడే స్థిరమైన పదబంధం; ἀκάθαρτος అనే పదంలోని అపవిత్రత భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἔχει
  choice: ఆయనలో ... ఉంది
  rationale: గ్రీకు క్రియ యొక్క ప్రాథమిక అర్థం ‘కలిగి ఉన్నాడు’. తెలుగులో ఆత్మ సంబంధంగా సహజమైన ‘ఆయనలో ... ఉంది’ అనే నిర్మాణం వాడుతూ, ప్రధాన పాఠంలో ‘పట్టింది’ అనే వ్యాఖ్యానాత్మక విస్తరణను నివారించింది.
theological_decisions:
- issue: యేసుపై చేసిన ఆరోపణ స్వభావం
  choice: “ఆయనలో అపవిత్రాత్మ ఉంది” అనే ప్రత్యక్ష ఆరోపణను నిలుపడం
  alternative: “ఆయనను అపవిత్రాత్మ పట్టుకుంది”
  rationale: మూలపాఠం ἔχει (‘కలిగి ఉన్నాడు/ఉంది’) అనే సరళమైన పదాన్ని వాడుతుంది. ప్రత్యామ్నాయ రూపం అంతర్లీన భావాన్ని సహజంగా తెలియజేసినా, ప్రధాన పాఠంలో మూలంలోని కఠినమైన ఆరోపణను వ్యాఖ్యానాత్మకంగా విస్తరించకుండా ఉంచడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘అంటూ ఉండేవారు’ ద్వారా కొనసాగిన లేదా పునరావృతమైన ఆరోపణను వ్యక్తపరిచింది; ‘అపవిత్రాత్మ’ నూతన నిబంధనలో స్థిరపడిన పదప్రయోగాన్ని నిలుపుతుంది.
