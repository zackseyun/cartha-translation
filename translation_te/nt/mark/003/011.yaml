id: MRK.3.11
reference: Mark 3:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὰ πνεύματα τὰ ἀκάθαρτα, ὅταν αὐτὸν ⸂ἐθεώρουν, προσέπιπτον⸃ αὐτῷ καὶ ⸀ἔκραζον ⸀λέγοντα ὅτι Σὺ εἶ ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/011.yaml
  text: And whenever the unclean spirits saw him[a], they fell down before him and cried out, saying, “You are the Son of God.”
translation:
  language: te
  text: అపవిత్ర ఆత్మలు ఆయనను చూసినప్పుడల్లా, ఆయన ఎదుట పడిపోయేవి[a], “నీవే దేవుని కుమారుడవు” అని కేకలు వేసేవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన ఎదుట తమను తాము పడవేసుకునేవి.’ గ్రీకు క్రియ ఒకరి ఎదుట లోబడుతూ లేదా వేడుకుంటూ పడటాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα τὰ ἀκάθαρτα
  choice: అపవిత్ర ఆత్మలు
  rationale: ἀκάθαρτα అనే పదంలోని అపవిత్రత భావాన్ని నేరుగా నిలుపుతూ, సువార్తలలో స్థిరపడిన సహజమైన తెలుగు పదబంధాన్ని ఉపయోగిస్తుంది; ‘దుష్ట ఆత్మలు’ అనడం మూలంలో లేని వ్యాఖ్యానాన్ని జోడించవచ్చు.
- source_word: ὅταν
  choice: చూసినప్పుడల్లా
  rationale: తరువాతి అసంపూర్ణ భూతకాల క్రియలతో కలిసి ఇది పదేపదే జరిగిన చర్యను సూచిస్తుంది; ‘అప్పుడల్లా’ ఆ పునరావృత భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: ἐθεώρουν
  choice: చూసిన
  rationale: ఈ కథన సందర్భంలో సాధారణమైన ‘చూడు’ సరిపోతుంది; పునరావృత భావం ‘అప్పుడల్లా’ ద్వారా వ్యక్తమవుతుంది.
- source_word: προσέπιπτον αὐτῷ
  choice: ఆయన ఎదుట సాగిలపడి
  rationale: యేసు ఎదుట నేలకు వంగి లేదా పడిపోయే భౌతిక చర్యను సహజంగా తెలుపుతుంది; దానిని తప్పనిసరిగా ఆరాధనగా వ్యాఖ్యానించదు.
- source_word: ἔκραζον
  choice: కేకలు వేసేవి
  rationale: క్రియలోని బిగ్గరగా అరచే తీవ్రతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: λέγοντα
  choice: అని
  rationale: కేకలలో పలికిన మాటలను తెలుగులో సహజంగా ప్రత్యక్ష ఉల్లేఖనంతో అనుసంధానిస్తుంది.
- source_word: Σὺ εἶ
  choice: నీవే … వు
  rationale: గ్రీకులో స్పష్టంగా వాడిన Σὺ ఇచ్చే ఉద్ఘాటనను తెలుగు ‘ఏ’ ప్రత్యయంతో సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: దేవుని కుమారుడు
  rationale: మూలంలోని బిరుదాత్మక, క్రీస్తుసంబంధమైన భావాన్ని సూటిగా, పరిచితమైన రూపంలో నిలుపుతుంది.
theological_decisions:
- issue: యేసు ఎదుట అపవిత్ర ఆత్మలు పడిన చర్యను ఆరాధనగా అనువదించాలా, శారీరకంగా సాగిలపడటంగా అనువదించాలా
  choice: ‘ఆయన ఎదుట సాగిలపడి’ అని అనువదించబడింది; ‘ఆరాధించాయి’ అని కాదు.
  alternative: ‘ఆయనను ఆరాధించాయి’ లేదా ‘ఆయనకు నమస్కరించాయి’
  rationale: προσπίπτω లోబడటం, వేడుకోవడం, భయభక్తి లేదా బలవంతపు అధీనతలో ఎదుట పడటాన్ని సూచించగలదు. ఈ వాక్యం ఆ చర్యను స్పష్టంగా ఆరాధనగా పేర్కొనదు కాబట్టి, అనువాదం భౌతిక చర్యను నిలిపి దాని theological significanceను సందర్భానికే వదిలింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. బహువచన నపుంసక కర్తకు అనుగుణంగా ‘వేసేవి’ వాడి, ὅταν మరియు అసంపూర్ణ భూతకాల క్రియల పునరావృత భావాన్ని ‘చూసినప్పుడల్లా’ ద్వారా వ్యక్తం చేశాం.
