revisions:
- from: అపవిత్ర ఆత్మలు ఆయనను చూసినప్పుడల్లా, ఆయన ఎదుట సాగిలపడి[a], “నీవే దేవుని కుమారుడవు” అని కేకలు వేసేవి.
  to: అపవిత్ర ఆత్మలు ఆయనను చూసినప్పుడల్లా, ఆయన ఎదుట పడిపోయేవి[a], “నీవే దేవుని కుమారుడవు” అని కేకలు వేసేవి.
  rationale: The revision renders προσέπιπτον with the direct physical expression ‘పడిపోయేవి’ and keeps its repeated imperfect aspect parallel with ‘కేకలు వేసేవి.’ The footnote preserves the legitimate stronger lexical alternative while leaving the motive—submission, supplication, or another response—unstated.
