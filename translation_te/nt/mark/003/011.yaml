review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the iterative force of ὅταν with the imperfect verbs, identifies the subjects as unclean spirits, preserves the direct confession, and does not overtranslate προσέπιπτον as worship. A small revision makes the physical sense of προσέπιπτον (‘fell down before’) more direct and retains the coordinate imperfect actions without making one merely subordinate to the other.
  naturalness: The prose is natural modern standard Telugu. Replacing ‘సాగిలపడి’ with ‘పడిపోయేవి’ is plainer narrative Telugu and more closely matches the source verb’s physical action. ‘కేకలు వేసేవి’ remains appropriate for ἔκραζον.
  terminology: ‘అపవిత్ర ఆత్మలు’ appropriately preserves the established Gospel term and the sense of ἀκάθαρτα. ‘దేవుని కుమారుడు’ accurately retains the titular expression ὁ υἱὸς τοῦ θεοῦ. ‘నీవే’ suitably represents the emphatic explicit pronoun without imposing an extraneous theological interpretation.
  issues:
  - severity: low
    issue: ‘సాగిలపడి’ can suggest deliberate bowing/prostration more readily than falling down.
    rationale: προσέπιπτον principally describes falling before someone. Although the existing rendering is defensible, ‘ఆయన ఎదుట పడిపోయేవి’ more directly preserves the physical action and avoids suggesting a particular motive or posture.
  revised_text: అపవిత్ర ఆత్మలు ఆయనను చూసినప్పుడల్లా, ఆయన ఎదుట పడిపోయేవి[a], “నీవే దేవుని కుమారుడవు” అని కేకలు వేసేవి.
