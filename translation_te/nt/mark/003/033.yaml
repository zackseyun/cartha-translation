source:
  edition: SBLGNT
  text: καὶ ⸂ἀποκριθεὶς αὐτοῖς λέγει⸃· Τίς ἐστιν ἡ μήτηρ μου ⸀ἢ οἱ ἀδελφοί ⸀μου;
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/033.yaml
  text: And answering them[a], he says[b], “Who are my mother and my brothers?”
translation:
  language: te
  text: 'వారికి జవాబిస్తూ ఆయన ఇలా అంటాడు[a]: “నా తల్లి, నా సోదరులు ఎవరు?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత సాధారణ కథన శైలిలో, “ఆయన వారికి జవాబిచ్చాడు” అని అనువదించవచ్చు. గ్రీకులో అక్షరార్థంగా “జవాబిస్తూ … అంటాడు” అనే కృదంతం, చారిత్రక వర్తమాన కాలం ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు వాక్య నిర్మాణాన్ని మరింత నేరుగా అనుసరిస్తే, “నా తల్లి లేదా నా సోదరులు ఎవరు?” అని ఉంటుంది. అక్కడ ఏకవచన క్రియ మొదట వచ్చే “తల్లి”తో సరిపోతుంది.
    reason: source_structure
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: జవాబిస్తూ
  rationale: గ్రీకు భాషలోని కృదంత రూపాన్ని నిలుపుతూ, తరువాత వచ్చే చారిత్రక వర్తమాన కాల క్రియతో సహజంగా కలుస్తుంది.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: ఈ సంప్రదాన విభక్తి సర్వనామం యేసు జవాబు ఎవరిని ఉద్దేశించి చెప్పాడో సూచిస్తుంది.
- source_word: λέγει
  choice: అంటాడు
  rationale: మార్కు వాడే చారిత్రక వర్తమాన కాలాన్ని నిలిపి, కథనానికి సజీవతను ఇస్తుంది.
- source_word: Τίς
  choice: ఎవరు
  rationale: వ్యక్తుల గుర్తింపును అడిగే ప్రశ్నార్థక సర్వనామానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: μήτηρ
  choice: తల్లి
  rationale: ప్రామాణికమైన, గౌరవప్రదమైన కుటుంబ సంబంధ పదం.
- source_word: ἢ
  choice: ప్రధాన వాక్యంలో విరామచిహ్నంతో సహజీకరించబడింది
  rationale: గ్రీకులో రెండవ కుటుంబ వర్గాన్ని కలిపే ‘లేదా’ ఉంది; తెలుగులో దాన్ని నేరుగా చేరిస్తే ప్రశ్న అసహజంగా వినిపించే అవకాశం ఉన్నందున అర్థాన్ని జాబితా నిర్మాణంలో అందించి, మూల రూపాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: ἀδελφοί
  choice: సోదరులు
  rationale: పుంలింగ బహువచనాన్ని విస్తరించకుండా నిలుపుతుంది; సందర్భంలో యేసు పురుష సహోదరులను సూచిస్తుంది.
theological_decisions:
- issue: ἀδελφοί అనే కుటుంబ సంబంధ పదం
  choice: సోదరులు
  alternative: అన్నదమ్ములు; సహోదర సహోదరీలు
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పుంలింగ బహువచనం; ఈ సందర్భంలో దానిని లింగతటస్థంగా విస్తరించకుండా మూలంలోని నిర్దిష్టతను నిలిపాం.
- issue: μήτηρ మరియు ἀδελφοί మధ్య ప్రశ్న నిర్మాణం
  choice: సహజమైన తెలుగు జాబితా ప్రశ్న
  alternative: “నా తల్లి ఎవరు, లేదా నా సోదరులు ఎవరు?”
  rationale: గ్రీకు ఏకవచన క్రియ మొదటి కర్తతో సరిపోతుంది, ἢ రెండవ కర్తను కలుపుతుంది. తెలుగులో క్రియను వ్యక్తపరచని జాబితా ప్రశ్న మూల భావాన్ని స్పష్టంగా అందిస్తూ సంఖ్య సమస్యను నివారిస్తుంది; మూల నిర్మాణాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. “అంటాడు” ద్వారా మార్కు కథనంలోని చారిత్రక వర్తమాన కాల సజీవతను నిలిపాం; ప్రశ్నలో సహజ తెలుగు వాక్యనిర్మాణానికి ప్రాధాన్యం ఇచ్చి, గ్రీకు నిర్మాణాన్ని పాదటిప్పణిలో సంరక్షించాం.
