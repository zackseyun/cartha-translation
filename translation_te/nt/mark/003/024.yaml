revisions:
- from: ఒక రాజ్యం తనకు తానే విరోధంగా చీలిపోతే, ఆ రాజ్యం నిలబడలేదు.
  to: ఒక రాజ్యం తనకు తానే విరోధంగా చీలిపోతే, ఆ రాజ్యం నిలబడదు.
  rationale: Only the final verb is adjusted from a past/perfective negative to a modern Telugu general-result form, preserving the Greek conditional and its sense of inability to remain established. No footnotes are required.
