id: MRK.3.24
reference: Mark 3:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐὰν βασιλεία ἐφ’ ἑαυτὴν μερισθῇ, οὐ δύναται σταθῆναι ἡ βασιλεία ἐκείνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/024.yaml
  text: And if a kingdom is divided against itself, that kingdom cannot stand.
translation:
  language: te
  text: ఒక రాజ్యం తనకు తానే విరోధంగా చీలిపోతే, ఆ రాజ్యం నిలబడదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: '[ప్రత్యేక పదంగా అనువదించలేదు]'
  rationale: ముందటి వాక్యంతో ఉన్న అనుసంధానం సందర్భంలో సహజంగా స్పష్టమవుతుంది. తెలుగులో ‘మరియు’ అని ప్రారంభించడం కృతకంగా ఉంటుంది.
- source_word: ἐὰν
  choice: -తే
  rationale: సంభావ్య షరతును తెలిపే సహజమైన తెలుగు క్రియాంతం.
- source_word: βασιλεία
  choice: రాజ్యం
  rationale: ఇక్కడ పాలన అనే భావనకంటే ఒక సమష్టి రాజకీయ-సామాజిక వ్యవస్థను సూచించే ఉపమానం ప్రధానంగా ఉంది.
- source_word: ἐφ’ ἑαυτὴν
  choice: తనకు తానే విరోధంగా
  rationale: అంతర్గత వ్యతిరేకతను స్పష్టంగా, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: μερισθῇ
  choice: చీలిపోతే
  rationale: అంతర్గత విభజనను సహజంగా తెలియజేస్తూ, విభజనకు కారకుడు ఎవరో పాఠ్యంలో లేనందున దానిని చేర్చదు.
- source_word: οὐ δύναται
  choice: లేదు
  rationale: ‘నిలబడలేదు’ అనే సమగ్ర క్రియారూపంలో అసమర్థతను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: σταθῆναι
  choice: నిలబడ
  rationale: మూలంలోని నిలబడటం అనే రూపకాన్ని అలాగే ఉంచుతుంది; సందర్భంలో కొనసాగి ఉండటం అనే భావం వస్తుంది.
- source_word: ἡ βασιλεία ἐκείνη
  choice: ఆ రాజ్యం
  rationale: పునరుక్త నామవాచకంతో కూడిన సూచనను నిలుపుతూ తెలుగు వాక్యంలో సహజంగా ఉంటుంది.
theological_decisions:
- issue: ఈ సూక్తి స్వభావం
  choice: యేసు వాదనలోని సాధారణ సూత్రంగా మాత్రమే అనువదించడం
  alternative: రాజకీయ వ్యవస్థలకు లేదా సాతానుకు సంబంధించిన విస్తృత సిద్ధాంత ప్రకటనగా విపులీకరించడం
  rationale: మూలపాఠ్యం చెప్పిన ఉపమానాత్మక సూత్రాన్ని మాత్రమే నిలుపుతూ, సందర్భానికి మించిన సిద్ధాంతార్థాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన సూక్తి శైలి. ‘తనకు తానే విరోధంగా చీలిపోతే’ అంతర్గత విభేదాన్ని సహజంగా వ్యక్తపరుస్తుంది.
