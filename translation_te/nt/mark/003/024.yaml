review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the conditional saying, the internal opposition ('against itself'), and the repeated reference to 'that kingdom.' However, నిలబడలేదు is formally past/perfective ('did not/could not stand') and does not reliably convey the present general inability expressed by οὐ δύναται ... σταθῆναι.
  naturalness: తనకు తానే విరోధంగా చీలిపోతే is natural modern Telugu. Replacing the final past form with నిలబడదు gives a clear proverbial/general-result construction.
  terminology: రాజ్యం appropriately renders βασιλεία in this political-social analogy. విరోధంగా and చీలిపోతే communicate internal division without adding an agent or doctrinal interpretation.
  issues:
  - severity: medium
    issue: Tense/aspect of the final predicate
    rationale: The wording ఆ రాజ్యం నిలబడలేదు is past/perfective, whereas the Greek οὐ δύναται σταθῆναι states that the kingdom cannot stand. ఆ రాజ్యం నిలబడదు naturally expresses the general inability/result required by the conditional saying.
  revised_text: ఒక రాజ్యం తనకు తానే విరోధంగా చీలిపోతే, ఆ రాజ్యం నిలబడదు.
  revised_footnotes: []
  revision_rationale: Only the final verb is adjusted from a past/perfective negative to a modern Telugu general-result form, preserving the Greek conditional and its sense of inability to remain established. No footnotes are required.
