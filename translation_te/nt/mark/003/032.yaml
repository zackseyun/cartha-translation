source:
  edition: SBLGNT
  text: καὶ ἐκάθητο ⸂περὶ αὐτὸν ὄχλος⸃, ⸂καὶ λέγουσιν⸃ αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί ⸀σου ἔξω ζητοῦσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/032.yaml
  text: And a crowd was sitting around him[a], and they said to him, “Look, your mother and your brothers are outside looking for you.”
translation:
  language: te
  text: 'ఆయన చుట్టూ ఒక జనసమూహం కూర్చుని ఉండగా, వారు ఆయనతో ఇలా అన్నారు: “ఇదిగో, నీ తల్లి, నీ సహోదరులు బయట నీ కోసం వెదుకుతున్నారు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నిన్ను కోరుతున్నారు.” గ్రీకు క్రియకు “వెదుకు” లేదా “కోరు” అనే అర్థాలు రావచ్చు; ఇక్కడ వారు ఆయనను కనుగొనడానికి ప్రయత్నిస్తున్నారనే భావం ఎక్కువగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθητο
  choice: కూర్చుని ఉంది
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న నేపథ్య దృశ్యాన్ని సూచిస్తుంది; ఈ తెలుగు ప్రయోగం ఆ కొనసాగింపు భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: περὶ αὐτὸν ὄχλος
  choice: ఆయన చుట్టూ ఒక జనసమూహం
  rationale: περί + ద్వితీయా విభక్తి ఇక్కడ ఆయనను చుట్టుముట్టిన స్థల సంబంధాన్ని సూచిస్తుంది.
- source_word: λέγουσιν
  choice: అన్నారు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని సహజమైన తెలుగు కథన శైలిలో భూతకాలంగా అనువదించాం.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే గ్రీకు అవ్యయ బలాన్ని ఆధునిక, సహజ తెలుగు పదం నిలుపుతుంది.
- source_word: μήτηρ
  choice: తల్లి
  rationale: సందర్భానికి సరిపోయే సాధారణ బంధుత్వ పదం.
- source_word: ἀδελφοί
  choice: సహోదరులు
  rationale: గ్రీకు పదంలోని పుంలింగ బహువచన బంధుత్వ భావాన్ని, సంబంధంపై అదనపు వ్యాఖ్యానం చేర్చకుండా నిలుపుతుంది.
- source_word: ἔξω
  choice: బయట
  rationale: స్థలాన్ని సూచించే సరళమైన సందర్భార్థం.
- source_word: ζητοῦσίν σε
  choice: నీ కోసం వెదుకుతున్నారు
  rationale: ζητέω ఇక్కడ ఆయనను కనుగొనడానికి లేదా ఆయనను కలవడానికి ప్రయత్నిస్తున్న భావాన్ని సూచిస్తుంది; ‘వెదుకుతున్నారు’ మూలపదంలోని విస్తృతతను నిలుపుతుంది.
theological_decisions:
- issue: ‘సహోదరులు’ అనే పదం సూచించే బంధుత్వం
  choice: ἀδελφοίను వివరణాత్మక విస్తరణ లేకుండా ‘సహోదరులు’గా అనువదించడం
  alternative: అన్నదమ్ములు / దగ్గరి బంధువులు / తోబుట్టువులు
  rationale: ఈ వాక్యం సాధారణ బంధుత్వ పదాన్నే ఉపయోగిస్తుంది; యేసు కుటుంబ సంబంధంపై ఒక ప్రత్యేక సిద్ధాంతపరమైన నిర్ణయాన్ని ఇది స్పష్టంగా ఇవ్వదు. కాబట్టి ఆ వివాదాన్ని అనువాదంలో పరిష్కరించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. యేసును సూచించేటప్పుడు ‘ఆయన’ వాడబడింది; ప్రత్యక్ష సంభాషణలో మూలంలోని ఏకవచన ‘నీ’ నిలుపబడింది.
