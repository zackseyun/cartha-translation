  to: ఎందుకంటే ఆయన అనేకమందిని స్వస్థపరిచాడు. అందువల్ల బాధలతో ఉన్నవారందరూ ఆయనను తాకాలని ఆయన మీదికి తోసుకొచ్చేవారు.[a]
