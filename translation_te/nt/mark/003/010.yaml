review_pass:
  verdict: revise
  source_fidelity: The rendering accurately conveys that Jesus healed many and that those afflicted surged toward him in order to touch him. However, the present-tense “తోసుకొస్తున్నారు” is inconsistent with the preceding past narrative (“స్వస్థపరిచాడు”) and with the Greek construction in this narrative context. A past habitual/resultative form is preferable.
  naturalness: The Telugu is modern and clear. Changing the crowd action to “తోసుకొచ్చేవారు” makes the sequence natural and temporally coherent while preserving the force of ἐπιπίπτειν.
  terminology: “స్వస్థపరిచాడు” is appropriate for ἐθεράπευσεν, and “బాధలతో ఉన్నవారందరూ” suitably retains the broad figurative sense of μάστιγας without restricting it to a diagnosis. “ఆయనను తాకాలని” correctly expresses the purpose of ἵνα αὐτοῦ ἅψωνται.
  issues:
  - severity: medium
    issue: Narrative tense mismatch
    rationale: 'The draft has past tense for Jesus’ healing but present progressive for the crowd’s response: “ఆయన మీదికి తోసుకొస్తున్నారు.” The Greek describes the resulting crowd behavior within the past narrative. “తోసుకొచ్చేవారు” preserves the iterative/resultative sense naturally in Telugu.'
  revised_text: ఎందుకంటే ఆయన అనేకమందిని స్వస్థపరిచాడు. అందువల్ల బాధలతో ఉన్నవారందరూ ఆయనను తాకాలని ఆయన మీదికి తోసుకొచ్చేవారు.[a]
