id: MRK.3.10
reference: Mark 3:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πολλοὺς γὰρ ἐθεράπευσεν, ὥστε ἐπιπίπτειν αὐτῷ ἵνα αὐτοῦ ἅψωνται ὅσοι εἶχον μάστιγας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/010.yaml
  text: For he had healed many, so that all who had afflictions were pressing in on him in order to touch him.
translation:
  language: te
  text: ఎందుకంటే ఆయన అనేకమందిని స్వస్థపరిచాడు. అందువల్ల బాధలతో ఉన్నవారందరూ ఆయనను తాకాలని ఆయన మీదికి తోసుకొచ్చేవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన మీద పడేవారు.” గ్రీకు పదం జనులు బలంగా ఆయనవైపు దూసుకొస్తున్న దృశ్యాన్ని వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὺς
  choice: అనేకమందిని
  rationale: క్రియకు కర్మగా ఉన్న బహువచనాన్ని, వ్యక్తులను సూచిస్తున్నదని సహజంగా స్పష్టం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న కథన పరిస్థితికి కారణాన్ని లేదా వివరణను పరిచయం చేసే అనుసంధానాన్ని తెలుగులో సహజంగా చూపుతుంది.
- source_word: ἐθεράπευσεν
  choice: స్వస్థపరిచాడు
  rationale: యేసు చేసిన స్వస్థత కార్యాన్ని గౌరవప్రదమైన, సాధారణ తెలుగు బైబిల్ వాడుకలో తెలియజేస్తుంది; గ్రీకు ఏఓరిస్టును సందర్భానుసారంగా సాధారణ భూతకాలంతో వ్యక్తం చేస్తుంది.
- source_word: ὥστε
  choice: అందువల్ల
  rationale: అనేకమందిని స్వస్థపరచడం వల్ల కలిగిన ఫలితాన్ని సహజమైన తెలుగులో చూపుతుంది.
- source_word: ἐπιπίπτειν αὐτῷ
  choice: ఆయన మీదికి తోసుకొస్తున్నారు
  rationale: పదశః ‘ఆయన మీద పడడం’ అనే బలమైన భావాన్ని, జనసమూహం ఆయనవైపు ఒత్తిడిగా దూసుకొస్తున్న సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα αὐτοῦ ἅψωνται
  choice: ఆయనను తాకాలని
  rationale: ἵνα తెలిపే ఉద్దేశాన్ని సంక్షిప్తమైన తెలుగు ఉద్దేశార్థక నిర్మాణంతో, ἅπτομαι యొక్క భౌతిక స్పర్శ భావంతో ఇస్తుంది.
- source_word: ὅσοι εἶχον μάστιγας
  choice: బాధలతో ఉన్నవారందరూ
  rationale: ὅσοι యొక్క సమగ్ర భావాన్ని ‘అందరూ’తో నిలుపుతూ, μάστιγας అనే పదంలోని తీవ్రమైన పీడల విస్తృత భావాన్ని కేవలం వైద్యపరమైన వ్యాధులకు పరిమితం చేయదు.
theological_decisions:
- issue: స్వస్థత సందర్భంలో μάστιγας యొక్క స్వభావం
  choice: బాధలు
  alternative: వ్యాధులు; తీవ్రమైన రోగాలు; కొరడా దెబ్బలు
  rationale: మూలపదం పదశః ‘కొరడాలు/కొరడా దెబ్బలు’ అని అర్థమిచ్చినా, ఇక్కడ రూపకంగా తీవ్రమైన శారీరక పీడలను సూచిస్తుంది. ‘బాధలు’ అనేది ఆ విస్తృతతను నిలుపుతుంది; కేవలం ఒక వైద్య నిర్ధారణకు పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని కారణ–ఫలిత సంబంధాన్ని రెండు వాక్యాలుగా స్పష్టంగా ఉంచి, జనసమూహపు బలమైన కదలికను ప్రధాన పాఠ్యంలోనూ పాదసూచికలోనూ నిలిపింది.
