  yaml_path: translation/nt/mark/003/007.yaml
  text: And Jesus withdrew with his disciples to the sea[a], and a great crowd from Galilee followed, and from Judea[b],
translation:
  language: te
  text: యేసు తన శిష్యులతో కలిసి సముద్రం వైపుకు[a][b] తప్పుకొని వెళ్లాడు. గలిలయ నుండి ఒక పెద్ద జనసమూహం ఆయనను అనుసరించింది, అలాగే యూదయ నుండి,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సముద్రానికి.’ గ్రీకు విభక్త్యుపసర్గం సముద్రం దిశగా కదలికను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అంటే గలిలయ సముద్రం. గ్రీకు మూలంలో కేవలం ‘సముద్రం’ అని ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνεχώρησεν
  choice: వెళ్లిపోయాడు
  rationale: ఈ క్రియకు ‘వెనక్కి వెళ్లాడు/తప్పుకొని వెళ్లాడు’ అనే భావ ఛాయ ఉండవచ్చు. అయితే సందర్భంలో సహజమైన ఆధునిక తెలుగులో ‘వెళ్లిపోయాడు’ అని ఇచ్చి, కేవలం సాధారణ ప్రయాణాన్ని సూచించే ‘వెళ్లాడు’ కంటే ఉపసంహరణ భావాన్ని కొంత నిలిపాం.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: తన శిష్యులతో కలిసి
  rationale: ‘శిష్యులు’ సువార్తల సందర్భంలో నేర్చుకునేవారు, అనుసరించేవారు అనే సంబంధార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πρὸς τὴν θάλασσαν
  choice: సముద్రం వైపుకు
  rationale: πρός దిశగా కదలికను సూచించగలదు; ‘వైపుకు’ ఆ అర్థాన్ని స్పష్టంగా ఉంచుతుంది. θάλασσα ను మూలంలోని విధంగానే ‘సముద్రం’గా ఉంచాం.
- source_word: πολὺ πλῆθος
  choice: గొప్ప జనసమూహం
  rationale: పెద్ద సంఖ్యలో కూడిన ప్రజలను సూచించే పదబంధంలోని పరిమాణ ఉద్ఘాటనను గౌరవప్రదమైన, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἠκολούθησεν
  choice: వెంబడించింది
  rationale: ఇక్కడ జనసమూహం యేసు వెళ్లిన దారిలో ఆయన వెంట వెళ్లడాన్ని సూచిస్తుంది; ‘వెంబడించింది’ భౌగోళిక అనుసరణను సహజంగా తెలియజేస్తుంది.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: గలిలయ నుండి వచ్చిన
  rationale: జనసమూహం ఏ ప్రాంతం నుండి వచ్చిందో తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: యూదయ నుండి
  rationale: మూలంలో జాబితా తరువాతి వచనంలో కొనసాగుతుంది; అందువల్ల అసంపూర్ణంగా కొనసాగే నిర్మాణాన్ని కామాతో నిలిపాం.
