id: MRK.3.35
reference: Mark 3:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς ⸀γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ θεοῦ, οὗτος ἀδελφός μου καὶ ⸀ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/035.yaml
  text: For whoever does the will of God, this one is my brother and sister and mother.
translation:
  language: te
  text: ఎందుకంటే దేవుని చిత్తాన్ని నెరవేర్చే ఎవరైనా, ఆ వ్యక్తే నాకు సోదరుడు, సోదరి, తల్లి.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς ... ἂν ποιήσῃ
  choice: నెరవేర్చేవారు ఎవరైనా సరే
  rationale: సాపేక్ష సర్వనామం, ἄν, విధ్యర్థక క్రియ కలసి ఎవరైనా అనే సాధారణ, నిర్దిష్టం కాని షరతును వ్యక్తం చేస్తున్నాయి. తెలుగు సహజ వాక్యనిర్మాణంలో ‘ఎవరైనా సరే’ ఆ విస్తృత భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి మాటకు కారణం లేదా వివరణను పరిచయం చేసే అనుసంధాన భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: ποιήσῃ
  choice: నెరవేర్చేవారు
  rationale: ποιέω ఇక్కడ దేవుని చిత్తాన్ని చేయడం లేదా ఆచరణలో పెట్టడం అనే భావంలో ఉంది. ‘చిత్తాన్ని నెరవేర్చడం’ ఆధునిక తెలుగులో సహజమైన, స్పష్టమైన జోడీ.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: దేవుని చిత్తాన్ని
  rationale: గ్రీకు సంబంధ నిర్మాణాన్ని సంక్షిప్తంగా, సుపరిచితమైన బైబిలు తెలుగులో అందిస్తుంది.
- source_word: οὗτος
  choice: ఆ వ్యక్తే
  rationale: బలప్రయోగంతో ఉన్న సూచనాత్మక సర్వనామ భావాన్ని ‘ఆ వ్యక్తే’ నిలుపుతుంది; పురుషులకు మాత్రమే వర్తిస్తుందనే అపార్థాన్ని కలిగించదు.
- source_word: ἀδελφός μου καὶ ἀδελφὴ καὶ μήτηρ
  choice: నాకు సోదరుడు, సోదరి, తల్లి
  rationale: మూడు స్పష్టమైన బంధుత్వ పదాలను సాధారణ ‘కుటుంబ సభ్యుడు’గా మార్చకుండా విడివిడిగా నిలుపుతుంది. తెలుగు వాక్యక్రమంలో ‘నాకు’ అన్నది మూడింటికీ వర్తిస్తుంది.
- source_word: ἐστίν
  choice: '[తెలుగులో నామవాచక విధేయ నిర్మాణంలో అంతర్భావితం]'
  rationale: వర్తమానకాల ‘ఉండు’ క్రియను ఇలాంటి తెలుగు నామవాచక విధేయ వాక్యంలో సాధారణంగా విడిగా చెప్పరు; ‘ఆ వ్యక్తే నాకు…’ అనే నిర్మాణం గ్రీకు వర్తమాన సమానత్వ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: మిశ్ర లింగ బంధుత్వ పదాలతో ఉన్న ఏకవచన వ్యక్తి సూచన
  choice: ఆ వ్యక్తే
  alternative: అతడే; వారే
  rationale: గ్రీకులో వ్యాకరణపరంగా పుంలింగ ఏకవచనం ఉన్నా, విధేయంలో సోదరుడు, సోదరి, తల్లి అనే పురుష-స్త్రీ బంధాలు రెండూ ఉన్నాయి. ‘ఆ వ్యక్తే’ ఏకవచనాన్ని, సూచనాత్మక బలాన్ని నిలుపుతూ పురుషులకు మాత్రమే పరిమితం చేయదు.
- issue: యేసు ఉపయోగించిన కుటుంబ భాష స్వరూపం
  choice: సోదరుడు, సోదరి, తల్లి అనే నిర్దిష్ట బంధుత్వ పదాలను యథాతథంగా ఉంచడం
  alternative: కుటుంబ సభ్యుడు; బంధువు
  rationale: దేవుని చిత్తాన్ని నెరవేర్చడం ఆధారంగా కుటుంబ సంబంధాన్ని పునర్నిర్వచించే రూపక, వాక్చాతుర్య బలాన్ని సాధారణీకరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన సాధారణ శైలి. ‘ఎవరైనా సరే’ సహజమైన విస్తృత అన్వయాన్ని ఇస్తుంది; ‘ఆ వ్యక్తే’ గ్రీకు సూచనాత్మక బలాన్ని స్పష్టంగా నిలుపుతుంది.
