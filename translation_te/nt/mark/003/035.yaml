- from: ఎందుకంటే దేవుని చిత్తాన్ని నెరవేర్చేవారు ఎవరైనా సరే, ఆ వ్యక్తే[a] నాకు సోదరుడు, సోదరి, తల్లి.”
  to: ఎందుకంటే దేవుని చిత్తాన్ని నెరవేర్చే ఎవరైనా, ఆ వ్యక్తే నాకు సోదరుడు, సోదరి, తల్లి.”
