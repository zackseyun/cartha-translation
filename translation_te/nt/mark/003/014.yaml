  text: And he appointed twelve[a], so that they might be with him and so that he might send them out to preach[b],
translation:
  language: te
  text: ఆయన పన్నెండుమందిని నియమించాడు[a], వారు తనతో ఉండాలని, వారిని ప్రకటించడానికి పంపాలని[b].
  philosophy: optimal-equivalence
