lexical_decisions:
- source_word: ἐποίησεν
  choice: నియమించాడు
  rationale: పదశః ‘చేశాడు’ అనే అర్థం ఉన్నప్పటికీ, ఇక్కడ పన్నెండుమందితో ఒక ప్రత్యేక బృందాన్ని ఏర్పరచి బాధ్యతకు నియమించడాన్ని సూచిస్తుంది. ‘నియమించాడు’ ఈ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δώδεκα
  choice: పన్నెండుమందిని
  rationale: గ్రీకులో నామవాచకం లేకుండా ‘పన్నెండు’ అని మాత్రమే ఉంది. వ్యక్తులను సూచిస్తున్నందున తెలుగులో ‘పన్నెండుమందిని’ అనడం సహజం; ‘ఆ పన్నెండుమందిని’ అని నిర్దిష్టతను అదనంగా చేర్చలేదు.
- source_word: ἵνα ὦσιν μετ’ αὐτοῦ
  choice: వారు తనతో ఉండాలని
  rationale: ἵνα + subjunctive ఇక్కడ ఉద్దేశాన్ని తెలియజేస్తుంది. ఈ తెలుగు రూపం వారు ఆయనతో ఉండడం నియామకంలోని ఒక ఉద్దేశమని స్పష్టంగా చూపుతుంది.
- source_word: ἀποστέλλῃ
  choice: వారిని పంపాలని
  rationale: ఈ క్రియ పంపడాన్ని, సందర్భంలో బాధ్యతతో పంపడాన్ని సూచిస్తుంది. ‘పంపాలని’ మూలార్థాన్ని కాపాడుతూ, ఈ వాక్యంలో లేని ‘అపొస్తలులు’ అనే బిరుదును ప్రధాన పాఠ్యంలోకి తీసుకురాదు.
- source_word: κηρύσσειν
  choice: ప్రకటించడానికి
  rationale: ఈ క్రియ బహిరంగంగా సందేశాన్ని చాటడం లేదా ప్రకటించడాన్ని సూచిస్తుంది. ‘ప్రకటించడానికి’ మూలంలోని విస్తృత భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; ‘ప్రసంగించడానికి’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
theological_decisions:
- issue: ప్రధాన పాఠ్యంలో అపొస్తలులు అనే బిరుదును చేర్చాలా?
  choice: ప్రధాన పాఠ్యంలో ‘అపొస్తలులు’ అని చేర్చలేదు.
  alternative: ‘వారికి అపొస్తలులు అని కూడా పేరు పెట్టాడు’ అనే దీర్ఘ పాఠాన్ని చేర్చడం.
  rationale: ఇచ్చిన SBLGNT పాఠ్యంలో ఆ పదబంధం లేదు. కాబట్టి మూలపాఠ్యానికి పారదర్శకంగా ఉండేందుకు దాన్ని ప్రధాన వచనంలో చేర్చకుండా, పాఠాంతరంగా పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి వాడబడింది. గ్రీకు వాక్యంలోని రెండు ఉద్దేశాలను తెలుగులో సహజంగా తెలియజేయడానికి రెండో వాక్యంలో ‘ఆయన అలా చేశాడు’ అని స్పష్టీకరించబడింది.
