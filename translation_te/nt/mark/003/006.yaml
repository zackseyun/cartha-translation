revisions:
- from: అప్పుడు పరిసయ్యులు బయటికి వెళ్లి, వెంటనే హేరోదు పక్షీయులతో కలిసి ఆయనకు వ్యతిరేకంగా, ఆయనను ఎలా నాశనం చేయాలా[a] అని పన్నాగం పన్నడం మొదలుపెట్టారు.
  to: పరిసయ్యులు బయటికి వెళ్లి, వెంటనే హేరోదీయులతో కలిసి ఆయనను ఎలా నాశనం చేయాలో అని ఆయనకు వ్యతిరేకంగా కుట్ర పన్నారు.[a]
  rationale: The revision removes the unsupported ‘అప్పుడు,’ replaces an interpretive label with the conventional group name ‘హేరోదీయులు,’ and uses smoother modern Telugu for the hostile deliberation. It retains the source’s ‘how they might’ nuance, the adversative force of κατ’ αὐτοῦ, and the broader main-text rendering of ἀπόλλυμι; the footnote retains the contextually explicit lethal alternatives.
