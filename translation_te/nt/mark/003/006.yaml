  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες οἱ Φαρισαῖοι ⸀εὐθὺς μετὰ τῶν Ἡρῳδιανῶν συμβούλιον ⸀ἐδίδουν κατ’ αὐτοῦ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/006.yaml
  text: And the Pharisees went out and immediately began plotting with the Herodians against him[a], how they might destroy him.
translation:
  language: te
  text: పరిసయ్యులు బయటికి వెళ్లి, వెంటనే హేరోదీయులతో కలిసి ఆయనను ఎలా నాశనం చేయాలో అని ఆయనకు వ్యతిరేకంగా కుట్ర పన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ సందర్భంలో మరింత స్పష్టంగా, “ఆయనను ఎలా చంపాలా” లేదా “ఆయనను ఎలా మరణానికి గురిచేయాలా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: బయటికి వెళ్లి
  rationale: అయోరిస్టు కృదంతాన్ని తెలుగు కథనశైలికి సహజమైన పూర్వకాలిక క్రియగా అనువదించి, సమాజమందిరం నుంచి బయటికి వెళ్లిన కదలికను నిలుపుతుంది.
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు కథనంలో కనిపించే తక్షణత్వం, వేగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: హేరోదు పక్షీయులతో కలిసి
  rationale: μετά యొక్క సహవాస భావాన్ని నిలుపుతూ, Ἡρῳδιανοί అనే పేరు హేరోదు వర్గ ప్రయోజనాలకు అనుకూలులైన సమూహాన్ని సూచిస్తుందని సాధారణ పాఠకునికి స్పష్టం చేస్తుంది.
- source_word: συμβούλιον ἐδίδουν
  choice: పన్నాగం పన్నడం మొదలుపెట్టారు
  rationale: ఈ గ్రీకు నుడికారం సంప్రదించుకోవడం లేదా యోచన చేయడాన్ని సూచిస్తుంది; శత్రుత్వపూర్వక ఉద్దేశం వల్ల ‘పన్నాగం పన్నారు’ సందర్భోచితం. అసంపూర్ణ భూతకాల క్రియలోని ఆరంభ/కొనసాగింపు భావాన్ని ‘మొదలుపెట్టారు’ తెలియజేస్తుంది.
- source_word: κατ’ αὐτοῦ
  choice: ఆయనకు వ్యతిరేకంగా
  rationale: κατά ఇక్కడ కేవలం ఆయన గురించి కాక, శత్రుత్వంతో ఆయనకు వ్యతిరేకంగా చేసిన చర్యను సూచిస్తుంది.
- source_word: ὅπως
  choice: ఎలా ... చేయాలా అని
  rationale: తరువాతి సంభావనార్థక క్రియతో కలసి ఉద్దేశాన్ని, దానిని సాధించే విధానంపై ఆలోచనను సూచిస్తుంది; తెలుగు పన్నాగ సందర్భంలో ఈ నిర్మాణం సహజం.
- source_word: ἀπολέσωσιν
  choice: నాశనం చేయాలా
  rationale: ἀπόλλυμι యొక్క విస్తృతమైన ‘నాశనం చేయు/తొలగించు’ భావాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; ఈ సందర్భంలోని హత్యార్థక ఉద్దేశాన్ని పాదటిప్పణి స్పష్టం చేస్తుంది.
theological_decisions:
- issue: నాయకుల ఉద్దేశాన్ని ప్రధాన పాఠ్యంలోనే స్పష్టంగా హత్యగా పేర్కొనాలా
  choice: విస్తృత భావమున్న ‘నాశనం చేయాలా’ అనే పదబంధాన్ని ప్రధాన పాఠ్యంలో ఉంచడం.
  alternative: ‘చంపాలా’ లేదా ‘మరణశిక్షకు గురిచేయాలా’.
  rationale: ἀπόλλυμι అనే గ్రీకు క్రియ నాశనం చేయడం నుంచి చంపడం వరకు భావవ్యాప్తి కలిగి ఉంది. ఈ సందర్భంలో యేసును చంపాలనే ఉద్దేశం బలంగా ఉన్నా, ప్రధాన పాఠ్యంలో విస్తృత పదాన్ని ఉంచి, స్పష్టమైన సందర్భార్థాన్ని పాదటిప్పణిలో ఇవ్వడం మూలభాషలోని భావవ్యాప్తిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘హేరోదు పక్షీయులు’ అనే రూపం కేవలం లిప్యంతరీకరణకంటే సమూహ అనుబంధాన్ని సాధారణ పాఠకునికి స్పష్టం చేస్తుంది; ‘ఆయన’ అనే గౌరవ సూచక సర్వనామం తెలుగు బైబిలు కథనశైలికి అనుగుణం.
