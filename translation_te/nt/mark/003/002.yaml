revisions:
- from: విశ్రాంతి రోజున[a] ఆయన ఆ మనిషిని స్వస్థపరుస్తాడేమో అని వారు ఆయనను నిశితంగా గమనిస్తూ ఉన్నారు. ఆయన మీద నేరం మోపడానికి వారు అలా చేశారు.
  to: సబ్బాతు రోజున[a] ఆయన ఆ మనిషిని స్వస్థపరుస్తాడా అని, ఆయనపై ఆరోపణ చేయడానికి వారు ఆయనను నిశితంగా గమనిస్తూ ఉన్నారు.
  rationale: The revision retains the imperfect’s continuing hostile scrutiny (‘నిశితంగా గమనిస్తూ ఉన్నారు’), the indirect question (‘స్వస్థపరుస్తాడా అని’), and the explicit purpose of accusation. It also preserves the Sabbath as a named observance and keeps the Greek plural-form nuance in the footnote without making the Telugu main text unnatural.
