source:
  edition: SBLGNT
  text: καὶ παρετήρουν αὐτὸν εἰ τοῖς σάββασιν θεραπεύσει αὐτόν, ἵνα ⸀κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/002.yaml
  text: And they were watching him closely to see whether he would heal him on the Sabbath[a], so that they might accuse him.
translation:
  language: te
  text: సబ్బాతు రోజున[a] ఆయన ఆ మనిషిని స్వస్థపరుస్తాడా అని, ఆయనపై ఆరోపణ చేయడానికి వారు ఆయనను నిశితంగా గమనిస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో ఇక్కడ ‘సబ్బాతులలో’ అనే బహువచన రూపం ఉంది; అది ఒక సబ్బాతు రోజును సూచించే నానుడి ప్రయోగంగా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετήρουν
  choice: నిశితంగా గమనిస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న చర్యను సూచిస్తుంది; సందర్భంలో జాగ్రత్తతో కూడిన ప్రతికూల నిఘా భావాన్ని కూడా ఈ ప్రయోగం సహజంగా తెలియజేస్తుంది.
- source_word: εἰ
  choice: స్వస్థపరుస్తాడేమో అని
  rationale: గమనించడం అనే క్రియ తరువాత వచ్చే పరోక్ష ప్రశ్నను తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ఆయన స్వస్థపరుస్తాడా లేదా అని వారు ఎదురుచూసిన భావాన్ని నిలుపుతుంది.
- source_word: τοῖς σάββασιν
  choice: విశ్రాంతి రోజున
  rationale: గ్రీకులో బహువచన రూపం ఉన్నప్పటికీ, కొయినే గ్రీకులో అది ఒక విశ్రాంతి దినాన్ని సూచించే నానుడి ప్రయోగంగా ఉండగలదు. ఆధునిక తెలుగులో ఏకవచనమే సహజం.
- source_word: θεραπεύσει
  choice: స్వస్థపరుస్తాడేమో
  rationale: భవిష్యత్ సూచక రూపం గతకాల ప్రధాన క్రియపై ఆధారపడిన పరోక్ష ప్రశ్నలో ఉంది. తెలుగు వాక్యనిర్మాణంలో ‘-ఏమో’ ప్రశ్నాత్మక అనిశ్చితిని సహజంగా తెలియజేస్తుంది; θεραπεύω యొక్క భావం ‘స్వస్థపరచడం’.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: ఆయన మీద నేరం మోపడానికి
  rationale: ἵνα తో కూడిన సంభావనార్థక క్రియ వారి ఉద్దేశాన్ని సూచిస్తుంది. ‘నేరం మోపడం’ ఆరోపణ భావాన్ని స్పష్టంగా ఇస్తుంది, అయితే అధికారిక న్యాయవిచారణను అవసరానికి మించి సూచించదు.
theological_decisions:
- issue: గమనిస్తున్నవారి ఉద్దేశ చిత్రణ
  choice: ఆయన మీద నేరం మోపడానికి వారు ప్రతికూల ఉద్దేశంతో గమనించారు
  alternative: ఆయనను న్యాయస్థానంలో విచారింపజేయడానికి లేదా శిక్షింపజేయడానికి గమనించారు
  rationale: κατηγορέω న్యాయసంబంధ భావాన్ని కలిగి ఉండగలిగినా, ఈ వాక్యం వారు ఆరోపించడానికి కారణం వెదికారని మాత్రమే చెబుతుంది. అందువల్ల అధికారిక న్యాయచర్యను అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘సబ్బాతు’ అనే లిప్యంతరీకరణకు బదులుగా సాధారణ పాఠకుడికి వెంటనే అర్థమయ్యే ‘విశ్రాంతి రోజు’ వాడబడింది. నిరంతర గమనికను ‘గమనిస్తూ ఉన్నారు’తో, వారి ప్రతికూల ఉద్దేశాన్ని తరువాతి వాక్యంతో స్పష్టంగా ఉంచాం.
