  text: Καὶ εἰσῆλθεν πάλιν ⸀εἰς συναγωγήν, καὶ ἦν ἐκεῖ ἄνθρωπος ἐξηραμμένην ἔχων τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/001.yaml
  text: And he entered a synagogue again[c][b][a], and a man was there with a withered hand.
translation:
  language: te
  text: ఆయన మళ్లీ ఒక సమాజమందిరంలోకి ప్రవేశించాడు.[a] అక్కడ చెయ్యి ఎండిపోయిన[b] ఒక వ్యక్తి ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, తక్షణ సందర్భంలో ఇప్పటికే తెలిసిన నిర్దిష్ట సమాజమందిరాన్ని మార్కు ఉద్దేశించి ఉంటే, ‘ఆ సమాజమందిరంలోకి.’
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘చెయ్యి క్షీణించిన,’ ‘చెయ్యి వాడిపోయిన.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: ప్రవేశించాడు
  rationale: కథనంలోని భూతకాల చర్యను, లోపలికి వెళ్లడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: చర్య పునరావృతమైందనే భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: εἰς συναγωγήν
  choice: ఒక సమాజమందిరంలోకి
  rationale: εἰς యొక్క గమనార్థాన్ని ‘లోకి’ నిలుపుతుంది; గ్రీకులో నిర్దేశక ఉపపదం లేకపోవడం వల్ల ‘ఒక’ అని అనువదించడం సముచితం.
- source_word: ἦν ἐκεῖ
  choice: అక్కడ ... ఉన్నాడు
  rationale: ἐκεῖను ‘అక్కడ’గా స్పష్టంగా ప్రతిబింబిస్తూ, తెలుగు వాక్య నిర్మాణంలో సహజంగా వ్యక్తిని పరిచయం చేస్తుంది.
- source_word: ἄνθρωπος
  choice: ఒక వ్యక్తి
  rationale: ἄνθρωπος యొక్క సాధారణ ‘మనిషి/వ్యక్తి’ భావాన్ని అనవసరంగా లింగాన్ని నిర్దేశించకుండా సహజంగా అందిస్తుంది.
- source_word: ἐξηραμμένην ἔχων τὴν χεῖρα
  choice: చెయ్యి ఎండిపోయిన
  rationale: చెయ్యి ఎండిపోయి లేదా క్షీణించి ఉన్న స్థితిని తెలిపే పరిపూర్ణ కృదంత భావాన్ని సంక్షిప్తమైన సహజ తెలుగులో అందిస్తుంది.
- source_word: τὴν χεῖρα
  choice: చెయ్యి
  rationale: తెలుగులో శరీర భాగంతో యాజమాన్య సంబంధం సందర్భం ద్వారానే స్పష్టమవుతుంది; అదనంగా ‘అతని’ అనడం అవసరం లేదు.
