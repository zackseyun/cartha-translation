  text: καὶ Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν τοῦ Ἰακώβου (καὶ ἐπέθηκεν αὐτοῖς ⸀ὀνόματα Βοανηργές, ὅ ἐστιν Υἱοὶ Βροντῆς),
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/017.yaml
  text: and James the son of Zebedee[a], and John the brother of James (he gave them the name Boanerges, which means Sons of Thunder),
translation:
  language: te
  text: జెబెదయి కుమారుడైన యాకోబును, యాకోబు సోదరుడైన యోహానును (ఆయన వారికి బోయనెర్గెస్ అనే పేరు పెట్టాడు[a]; దానికి “ఉరుము కుమారులు” అని అర్థం),
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో “పేర్లు” అని బహువచనం ఉంది; ఇద్దరు సోదరులకు కలిపి ఇచ్చిన ఒకే మారు పేరును అది సమష్టిగా సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰάκωβον
  choice: యాకోబు
  rationale: Ἰάκωβος అనే పేరుకు మూలభాషకు దగ్గరగా ఉండే, తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: τὸν τοῦ Ζεβεδαίου
  choice: జెబెదయి కుమారుడైన
  rationale: ఆర్టికల్‌తో కూడిన షష్ఠీ విభక్తి నిర్మాణం ఇక్కడ తండ్రి-కొడుకు సంబంధాన్ని సూచిస్తుంది; తెలుగులో ఈ రూపం సహజంగా ఉంటుంది.
- source_word: Ἰωάννην
  choice: యోహాను
  rationale: Ἰωάννης అనే వ్యక్తిపేరుకు తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: τὸν ἀδελφὸν τοῦ Ἰακώβου
  choice: యాకోబు సోదరుడైన
  rationale: ἀδελφός ఇక్కడ నిజమైన కుటుంబ సంబంధంలోని సోదరుణ్ణి సూచిస్తుంది.
- source_word: ἐπέθηκεν αὐτοῖς ὀνόματα
  choice: ఆయన వారికి … అనే పేరు పెట్టాడు
  rationale: పదశః ‘వారిపై పేర్లు ఉంచాడు’ అనే భావాన్ని సహజమైన తెలుగు నామకరణ ప్రయోగంగా అందిస్తుంది; గ్రీకు బహువచనాన్ని పాదసూచికలో తెలిపాం.
- source_word: Βοανηργές
  choice: బోయనెర్గెస్
  rationale: వచనం విదేశీ మారు పేరునూ దాని అర్థాన్నీ రెండింటినీ ఇస్తున్నందున పేరును లిప్యంతరీకరించాం.
- source_word: ὅ ἐστιν
  choice: దానికి … అని అర్థం
  rationale: సెమిటిక్ మారు పేరుకు తరువాత వచ్చే వివరణను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: Υἱοὶ Βροντῆς
  choice: ఉరుము కుమారులు
  rationale: ఉపమానాత్మకమైన మారు పేరులోని బలమైన చిత్రాన్ని పదార్థానికి దగ్గరగా నిలుపుతుంది; βροντήకి ‘ఉరుము’ సహజమైన తెలుగు సమానం.
theological_decisions:
- issue: యాకోబు, యోహానులకు ఇచ్చిన వివరణాత్మక మారు పేరును అనువదించడం
  choice: ‘బోయనెర్గెస్’ అనే లిప్యంతరీకరణతో పాటు ‘ఉరుము కుమారులు’ అనే అర్థాన్నీ ఉంచడం
  alternative: లిప్యంతరీకరణను వదిలి అర్థాన్ని మాత్రమే ఇవ్వడం
  rationale: మూల వచనమే విదేశీ రూపాన్నీ దాని వివరణనూ భద్రపరుస్తుంది. రెండింటినీ ఉంచడం కథనంలోని భాషా స్వరూపాన్ని కాపాడుతుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: ὀνόματα అనే బహువచన రూపం
  choice: ప్రధాన వచనంలో సహజమైన ఏకవచనం ‘పేరు’; బహువచనాన్ని పాదసూచికలో నమోదు చేయడం
  alternative: ప్రధాన వచనంలో ‘పేర్లు పెట్టాడు’ అని అనువదించడం
  rationale: తరువాత ఒకే మారు పేరు రావడం వల్ల తెలుగు ఏకవచనం సందర్భార్థాన్ని సహజంగా అందిస్తుంది. అయితే గ్రీకు రూపంలోని నిజమైన సంఖ్యా భేదాన్ని పాదసూచికలో దాచకుండా చూపించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ఇది ముందున్న అపొస్తలుల జాబితాను కొనసాగించే వాక్యఖండం కాబట్టి చివర కామాను నిలిపాం.
