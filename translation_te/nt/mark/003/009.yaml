  text: καὶ εἶπεν τοῖς μαθηταῖς αὐτοῦ ἵνα πλοιάριον προσκαρτερῇ αὐτῷ διὰ τὸν ὄχλον ἵνα μὴ θλίβωσιν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/009.yaml
  text: And he told his disciples that a small boat should stay ready for him because of the crowd[a], so that they might not crush him.
translation:
  language: te
  text: జనం కారణంగా, వారు తనను నలిపివేయకుండా ఉండేందుకు తన కోసం ఒక చిన్న పడవ సిద్ధంగా ఉండాలని ఆయన తన శిష్యులకు చెప్పాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తనను ఒత్తకుండా.” గ్రీకు క్రియకు ఒత్తడం, గుంపుగా మీదికి రావడం, లేదా ఒత్తిడితో నలిపివేయడం అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: చెప్పాడు
  rationale: శిష్యులకు ఇచ్చిన ఆదేశాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μαθηταῖς
  choice: శిష్యులకు
  rationale: సువార్తలలో గురువు-అనుచర సంబంధాన్ని సూచించే ప్రామాణిక తెలుగు పదం.
- source_word: πλοιάριον
  choice: ఒక చిన్న పడవ
  rationale: గ్రీకు పదంలోని చిన్నదనపు భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: προσκαρτερῇ
  choice: సిద్ధంగా ఉండాలని
  rationale: పడవ నిరంతరం ఆయనకు అందుబాటులో, ఉపయోగానికి సిద్ధంగా ఉండాలనే సందర్భార్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: αὐτῷ
  choice: తన కోసం
  rationale: పడవ యేసు ఉపయోగానికి అందుబాటులో ఉండాలనే సంబంధాన్ని సహజ తెలుగులో చూపుతుంది.
- source_word: διὰ τὸν ὄχλον
  choice: వారి కారణంగా
  rationale: διά + accusative తెలిపే కారణార్థాన్ని వ్యక్తం చేస్తుంది; ముందున్న ‘జనం’నే సూచించేలా సర్వనామం వాడబడింది.
- source_word: θλίβωσιν
  choice: నలిపివేయకుండా
  rationale: జనం ఒత్తిడి చేయడం, మీద పడడం, నలిపివేయడం అనే బలమైన భౌతిక భావాన్ని నిలుపుతుంది.
