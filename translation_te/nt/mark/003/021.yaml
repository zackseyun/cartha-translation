id: MRK.3.21
reference: Mark 3:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες οἱ παρ’ αὐτοῦ ἐξῆλθον κρατῆσαι αὐτόν, ἔλεγον γὰρ ὅτι ἐξέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/021.yaml
  text: And when those close to him heard[a], they went out to seize him, for they were saying[b], “He is out of his mind.”
translation:
  language: te
  text: ఆయనకు సన్నిహితులైనవారు[a] విన్నప్పుడు, ఆయనను పట్టుకోవడానికి బయలుదేరారు. ఎందుకంటే, “ఆయన మతి తప్పాడు”[b] అని వారు చెబుతూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆయన కుటుంబ సభ్యులు” లేదా “ఆయన స్వంతవారు”; ఈ గ్రీకు నుడికారం యేసు ఇంటివారిని లేదా ఆయన సన్నిహిత వర్గానికి చెందినవారిని ప్రత్యేకంగా సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా “ఆయనకు మతిస్థిమితం లేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρ’ αὐτοῦ
  choice: ఆయనకు సన్నిహితంగా ఉన్నవారు
  rationale: ఈ గ్రీకు నుడికారం యేసు కుటుంబానికి లేదా ఆయన సన్నిహిత వర్గానికి చెందినవారిని సూచించవచ్చు. ‘ఆయనకు సన్నిహితంగా ఉన్నవారు’ అనే అనువాదం కుటుంబం అని నిర్దిష్టంగా తేల్చకుండా మూలంలోని అస్పష్టతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀκούσαντες
  choice: అది విని
  rationale: భూతకాల అసమాపక క్రియను కథన క్రమాన్ని సహజంగా తెలియజేసే కాలార్థక ప్రయోగంగా అనువదించాం. గ్రీకులో వినబడిన విషయం స్పష్టంగా చెప్పబడలేదు; తెలుగులో సహజత్వం కోసం సందర్భాన్ని సూచించే ‘అది’ వాడాం.
- source_word: ἐξῆλθον
  choice: బయలుదేరారు
  rationale: వారు ఉన్న చోటు నుంచి యేసు దగ్గరకు వెళ్లేందుకు బయలుదేరిన కథన కదలికను ఇది సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: κρατῆσαι
  choice: పట్టుకోవడానికి
  rationale: κρατέω ఇక్కడ బలంగా పట్టుకోవడం లేదా అదుపులోకి తీసుకోవడం అనే భావాన్ని ఇస్తుంది. ‘పట్టుకోవడానికి’ దాని బలాన్ని నిలుపుతూ, చట్టపరమైన అరెస్టు అని అతిగా నిర్దిష్టం చేయదు.
- source_word: ἔλεγον
  choice: అని వారు అంటూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పదేపదే చెప్పబడుతున్న మాటను సూచిస్తుంది; ‘అంటూ ఉన్నారు’ ఆ అంశాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἐξέστη
  choice: ఆయన మతి తప్పాడు
  rationale: ఇక్కడ ఈ పదం మానసిక సమతుల్యత కోల్పోయాడనే ఆరోపణను వ్యక్తం చేస్తుంది. ‘మతి తప్పాడు’ స్పష్టమైన, ప్రస్తుత వాడుకలోని తెలుగు; మూలంలో లేనంత వైద్యపరమైన నిర్ధారణను జోడించదు.
theological_decisions:
- issue: οἱ παρ’ αὐτοῦ ఎవరు?
  choice: ప్రధాన పాఠ్యంలో ‘ఆయనకు సన్నిహితంగా ఉన్నవారు’ అని విస్తృతంగా అనువదించాం.
  alternative: ‘ఆయన కుటుంబంవారు’ లేదా ‘ఆయనవారు’.
  rationale: తరువాతి సందర్భం యేసు కుటుంబాన్ని బలంగా సూచించినప్పటికీ, ఈ వచనంలోని గ్రీకు పదబంధం ప్రత్యక్ష బంధుత్వ పదం కాదు. అందువల్ల కుటుంబమే అని ప్రధాన పాఠ్యంలో నిర్ణయించకుండా, నిజమైన అస్పష్టతను నిలిపి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన కథన శైలిని వాడాం. ‘అరెస్టు చేయడానికి’ వంటి చట్టపరమైన అర్థాన్ని, ‘పిచ్చివాడు’ వంటి అవమానకరమైన లేదా అతిగా తీవ్ర పదాన్ని నివారించాం.
