  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్య నిర్మాణం వాడబడింది. మూలంలోని దీర్ఘ జాబితాను తెలుగులో చదవడానికి సులభంగా రెండు వాక్యాలుగా విభజించినా, ప్రదేశాల సంచయ క్రమం మరియు ఆయన కార్యాల గురించి విని రావడం మధ్య సంబంధం నిలుపబడింది.
