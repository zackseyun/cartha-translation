  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀπὸ Ἱεροσολύμων καὶ ἀπὸ τῆς Ἰδουμαίας ⸀καὶ πέραν τοῦ Ἰορδάνου ⸁καὶ περὶ Τύρον καὶ Σιδῶνα, πλῆθος πολύ, ⸀ἀκούοντες ὅσα ⸀ἐποίει ἦλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/008.yaml
  text: and from Jerusalem[a], and from Idumea, and beyond the Jordan, and around Tyre and Sidon, a great crowd, hearing what he was doing[c][b], came to him.
translation:
  language: te
  text: యెరూషలేము నుంచీ, ఇదూమయ నుంచీ, యొర్దాను అవతలి ప్రాంతం నుంచీ[a], తూరు, సీదోను పరిసర ప్రాంతాల నుంచీ[b] పెద్ద జనసమూహం, ఆయన చేస్తున్నవాటిని విని[c], ఆయన దగ్గరికి వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యొర్దానుకు అవతల.” ఇది యొర్దాను నదికి అవతలి ప్రాంతాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తూరు, సీదోనుల చుట్టుపక్కల ప్రాంతం నుంచీ.” గ్రీకు పదబంధం ఈ పట్టణాలనే కాక వాటి పరిసర ప్రాంతాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఆయన చేస్తున్నవన్నీ.” గ్రీకు సర్వనామం సమగ్ర భావాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ Ἱεροσολύμων
  choice: యెరూషలేము నుంచీ
  rationale: ἀπό + షష్ఠీ విభక్తి మూలస్థానాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నుంచీ’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: ἀπὸ τῆς Ἰδουμαίας
  choice: ఇదూమయ నుంచీ
  rationale: ప్రాంతనామాన్ని తెలుగు లిపిలో ఇచ్చి, ἀπό సూచించే బయలుదేరిన ప్రాంత భావాన్ని నిలిపింది.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: యొర్దాను అవతలి ప్రాంతం నుంచీ
  rationale: πέραν + షష్ఠీ విభక్తి నదికి అవతల ఉన్న ప్రాంతాన్ని సూచిస్తుంది. జాబితాలోని మూలస్థాన భావాన్ని తెలుగులో స్పష్టంగా తెలియజేయడానికి ‘నుంచీ’ని కొనసాగించింది.
- source_word: περὶ Τύρον καὶ Σιδῶνα
  choice: తూరు, సీదోను పట్టణాల చుట్టుపక్కల నుంచీ
  rationale: περί ఇక్కడ నగరాలనే కాక వాటి పరిసర ప్రాంతాన్ని సూచిస్తుంది; అందుకే ‘చుట్టుపక్కల’ అని అనువదించింది.
- source_word: πλῆθος πολύ
  choice: గొప్ప జనసమూహం
  rationale: చాలా పెద్ద సంఖ్యలో కూడిన ప్రజలను సూచించే సహజమైన, గౌరవప్రదమైన తెలుగు వ్యక్తీకరణ.
- source_word: ἀκούοντες
  choice: విని
  rationale: కృదంతం ప్రధాన క్రియతో కాల లేదా కారణ సంబంధాన్ని ఖచ్చితంగా నిర్ణయించకుండా అనుసంధానిస్తుంది; ‘విని’ తెలుగులో అదే సహజమైన సంక్షిప్తతను ఇస్తుంది.
- source_word: ὅσα ἐποίει
  choice: ఆయన చేస్తున్న వాటి గురించి
  rationale: ἐποίειలోని కొనసాగుతున్న కార్య భావాన్ని ‘చేస్తున్న’ నిలుపుతుంది; ὅσα యొక్క సమగ్ర భావాన్ని ప్రధాన పాఠంలో అతిగా నిర్దిష్టం చేయకుండా, ప్రత్యామ్నాయాన్ని పాదటీపులో ఇచ్చింది.
- source_word: ἦλθον πρὸς αὐτόν
  choice: వారు ఆయన దగ్గరికి వచ్చారు
  rationale: πρός వ్యక్తివైపు కదలికను సూచిస్తుంది. గ్రీకులోని బహువచన క్రియకు అనుగుణంగా, జనసమూహంలోని ప్రజలను ‘వారు’ అని స్పష్టం చేసింది.
- source_word: καὶ ... καὶ ... καὶ
  choice: … నుంచీ, … నుంచీ, … నుంచీ
  rationale: తెలుగులో ప్రతి ప్రాంతం తరువాత ‘నుంచీ’ని పునరావృతం చేయడం మూలంలోని సంచయాత్మక జాబితా ప్రభావాన్ని సహజంగా నిలుపుతుంది.
