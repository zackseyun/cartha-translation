id: MRK.3.18
reference: Mark 3:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ Ἀνδρέαν καὶ Φίλιππον καὶ Βαρθολομαῖον καὶ Μαθθαῖον καὶ Θωμᾶν καὶ Ἰάκωβον τὸν τοῦ Ἁλφαίου καὶ Θαδδαῖον καὶ Σίμωνα τὸν ⸀Καναναῖον
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/018.yaml
  text: and Andrew[a], and Philip, and Bartholomew, and Matthew, and Thomas, and James the son of Alphaeus, and Thaddaeus, and Simon the Cananaean.
translation:
  language: te
  text: మరియు అంద్రెయను, ఫిలిప్పును, బర్తొలొమయిని, మత్తయిని, తోమాను, అల్ఫయి కుమారుడైన యాకోబును, తద్దయిని, కనానయుడైన సీమోనును[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘కనానయుడు.’ ఇది బహుశా ‘ఉత్సాహవాది’ (జెలోతు) అనే అర్థమిచ్చే అరామిక్ పదానికి గ్రీకు రూపం; లూకా 6:15 చూడండి. దీన్ని ‘కనానీయుడు’ అని అర్థం చేసుకోవడం తప్పుదారి పట్టించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: ను (జాబితాలోని ప్రతి పేరుకు కర్మవిభక్తి ప్రత్యయం)
  rationale: తెలుగులో సహజమైన జాబితా నిర్మాణం కోసం గ్రీకు καὶ పదాన్ని ప్రతిసారీ విడిగా ‘మరియు’ అని అనువదించకుండా, పేర్లకు ‘ను’ జోడించి సమన్వయ భావాన్ని తెలిపాం. ముందరి వచనంలో ప్రారంభమైన ‘నియమించాడు’ అనే క్రియను స్పష్టత కోసం ఇక్కడ పూర్తిచేశాం.
- source_word: Ἀνδρέαν, Φίλιππον, Βαρθολομαῖον, Μαθθαῖον, Θωμᾶν, Θαδδαῖον
  choice: అంద్రెయ, ఫిలిప్పు, బర్తొలొమయి, మత్తయి, తోమా, తద్దయి
  rationale: ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా వ్యక్తినామాలను లిప్యంతరీకరించాం.
- source_word: Ἰάκωβον τὸν τοῦ Ἁλφαίου
  choice: అల్ఫయి కుమారుడైన యాకోబు
  rationale: ఆర్టికల్‌తో కూడిన సంబంధవాచక షష్ఠీ నిర్మాణం యాకోబును అతని తండ్రి ద్వారా గుర్తిస్తోంది; ‘కుమారుడైన’ అనేది తెలుగులో స్పష్టమైన సహజ రూపం.
- source_word: Σίμωνα τὸν Καναναῖον
  choice: కనానయుడైన సీమోను[a]
  rationale: మార్కు ఉపయోగించిన Καναναῖος అనే బిరుదును జాతిపేరుగా మార్చకుండా ధ్వన్యనువాదంతో నిలిపి, దాని సాధ్యమైన అరామిక్ అర్థాన్ని పాదసూచికలో వివరించాం.
theological_decisions:
- issue: సీమోనుకు ఇచ్చిన Καναναῖος అనే బిరుదు అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘కనానయుడు’ అని మూలరూపాన్ని ప్రతిబింబించి, పాదసూచికలో ‘ఉత్సాహవాది/జెలోతు’ అనే సంభావ్య అర్థాన్ని ఇవ్వడం
  alternative: ‘ఉత్సాహవాది సీమోను’ లేదా ‘జెలోతు సీమోను’ అని నేరుగా అనువదించడం
  rationale: లూకా 6:15లోని ζηλωτής ఈ బిరుదు ‘ఉత్సాహవాది/జెలోతు’ అనే అర్థంలో ఉందని బలంగా సూచిస్తుంది. అయినా మార్కు వాడిన ప్రత్యేక గ్రీకు రూపాన్ని ప్రధాన పాఠ్యంలో నిలపడం మూలపాఠ్య భేదాన్ని, స్వల్ప అనిశ్చితిని సంరక్షిస్తుంది; ‘కనానీయుడు’ అని అనడం కనాను ప్రాంతానికి చెందినవాడనే తప్పుదారి పట్టించే జాతి భావాన్ని కలిగించవచ్చు.
translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు వచనం ముందరి వాక్యానికి కొనసాగింపుగా పేర్ల జాబితా మాత్రమే అయినందున, తెలుగు స్వతంత్ర వచనంగా సహజంగా ఉండేందుకు సందర్భం నుంచి ‘నియమించాడు’ అనే క్రియను పూర్తిచేశాం. పునరుక్త καὶలను వరుసగా ‘మరియు’ అని పెట్టకుండా తెలుగు జాబితా నిర్మాణాన్ని వాడాం.
