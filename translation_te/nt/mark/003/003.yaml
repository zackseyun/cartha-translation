  yaml_path: translation/nt/mark/003/003.yaml
  text: And he says to the man with the withered hand[a], “Rise and come to the middle.”
translation:
  language: te
  text: చేయి ఎండిపోయిన ఆ మనిషితో ఆయన, “లేచి మధ్యకు రా” అని అంటున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: అంటున్నాడు
  rationale: మార్కు వాడిన చారిత్రక వర్తమాన కాలపు సజీవ కథనశైలిని నిలుపుతుంది.
- source_word: ἀνθρώπῳ
  choice: మనిషితో
  rationale: సందర్భంలో ఒక పురుషుణ్ణి సూచిస్తోంది; ఆధునిక తెలుగులో సహజమైన పదం.
- source_word: τὴν χεῖρα ἔχοντι ξηράν
  choice: చేయి చచ్చుబడిన
  rationale: పనిచేయని, వాడిపోయిన చేయి అనే శారీరక స్థితిని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది; కారణం లేదా నిర్దిష్ట వైద్య నిర్ధారణను చేర్చదు.
- source_word: Ἔγειρε
  choice: లేచి
  rationale: ఆజ్ఞలోని నేరుదనాన్ని నిలుపుతూ, తరువాతి గమనాన్ని తెలుగులో సహజంగా కలుపుతుంది.
- source_word: εἰς τὸ μέσον
  choice: మధ్యకు రా
  rationale: εἰς సూచించే మధ్యవైపు గమనాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది; ‘మధ్యలో నిలబడు’ అని స్థితిని మాత్రమే చెప్పదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సులభంగా అర్థమయ్యే కథనశైలి. గ్రీకు చారిత్రక వర్తమానాన్ని ‘అంటున్నాడు’తో నిలిపి, ఆజ్ఞను సహజమైన ప్రత్యక్ష సంభాషణగా ఇచ్చాం.
