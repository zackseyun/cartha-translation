  text: Καὶ ⸀ἔρχεται εἰς οἶκον· καὶ συνέρχεται πάλιν ⸀ὁ ὄχλος, ὥστε μὴ δύνασθαι αὐτοὺς ⸀μηδὲ ἄρτον φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/020.yaml
  text: And he comes into a house[a], and the crowd gathers again[c][b], so that they are not even able to eat bread.
translation:
  language: te
  text: ఆయన ఒక ఇంట్లోకి వచ్చాడు[a]. మళ్లీ జనసమూహం గుమికూడింది; దాంతో వారు భోజనం కూడా చేయలేకపోయారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇంటికి వచ్చాడు.” గ్రీకులో అక్షరార్థంగా “ఒక ఇంట్లోకి” అని ఉంది; అయితే ఈ పదబంధం వాడుకలో తన నివాసానికి తిరిగి రావడం అనే అర్థాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “రొట్టె తినలేకపోయారు”; అంటే భోజనం చేయలేకపోయారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: వచ్చాడు
  rationale: గ్రీకులో ఇది కథన వర్తమాన కాలంలో ఉన్నప్పటికీ, ఆధునిక తెలుగు కథనశైలిలో భూతకాల రూపం సహజంగా ఉంటుంది; క్రియ యొక్క సంఘటనార్థాన్ని యథాతథంగా అందిస్తుంది.
- source_word: εἰς οἶκον
  choice: ఒక ఇంటికి
  rationale: οἶκονకు నిర్దేశక ఉపపదమో స్వామ్యసూచకమో లేదు. అందువల్ల ఎవరి ఇల్లో నిర్ధారించకుండా గ్రీకు వాక్యంలోని అనిర్దిష్టతను నిలుపుతుంది.
- source_word: συνέρχεται πάλιν ὁ ὄχλος
  choice: మళ్లీ జనసమూహం గుమికూడింది
  rationale: సమూహం ఒకచోట చేరడాన్ని ‘గుమికూడింది’ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; πάλινలోని పునరావృత్తి భావాన్ని ‘మళ్లీ’ నిలుపుతుంది.
- source_word: ὥστε μὴ δύνασθαι αὐτοὺς
  choice: దాంతో వారు … చేయలేకపోయారు
  rationale: ὥστεతో కూడిన అనంతక్రియ ఫలితాన్ని సూచిస్తుంది. αὐτούςలో ఉన్న బహువచన సర్వనామాన్ని వివరణాత్మకంగా విస్తరించకుండా ‘వారు’గా ఉంచడం మూలంలోని సూచనను కాపాడుతుంది.
- source_word: μηδὲ ἄρτον φαγεῖν
  choice: భోజనం కూడా చేయలేకపోయారు
  rationale: ‘రొట్టె తినడం’ అనే గ్రీకు ప్రయోగం సందర్భంలో ఆహారం లేదా భోజనం చేయడాన్ని సూచిస్తుంది. సహజ తెలుగు కోసం భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
