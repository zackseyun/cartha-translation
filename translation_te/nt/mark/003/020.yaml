translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. మార్కు గ్రీకులోని కథన వర్తమానాన్ని తెలుగులో సహజమైన భూతకాలంగా మార్చాం. ఇంటి గుర్తింపు మరియు ‘వారు’ అనే సర్వనామపు సూచనను అనవసరంగా నిర్ధారించలేదు.
