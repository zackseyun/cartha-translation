revisions:
- from: ఆయన కోపంతో వారిచుట్టూ చూసి, వారి హృదయకాఠిన్యానికి దుఃఖిస్తూ, ఆ మనిషితో, “నీ చెయ్యి చాపు” అని అంటాడు. అతడు దాన్ని చాపాడు; అతని చెయ్యి మళ్లీ బాగైంది.[a]
  to: ఆయన కోపంతో వారందరినీ చుట్టూ చూసి, వారి హృదయాల కాఠిన్యాన్ని బట్టి దుఃఖిస్తూ, ఆ మనిషితో, “నీ చెయ్యి చాపు” అని అంటాడు. అతడు తన చెయ్యి చాపాడు; అతని చెయ్యి పునరుద్ధరించబడింది.
  rationale: The revision removes the unsupported textual-variant footnote, clarifies the directed surveying glance and the man’s responsive action, and renders ἀπεκατεστάθη with a Telugu expression that preserves the source’s passive restoration sense. The plural “హృదయాల” is idiomatic Telugu for the Greek singular collective expression with a plural possessor; no doctrinal or interpretive expansion is introduced.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:00:51Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains Jesus’ anger, grief caused by the hardness of the group’s heart(s), Mark’s historical present (“అంటాడు”), the command, and the restoration. However, “మళ్లీ బాగైంది” is less precise than the passive restoration expressed by ἀπεκατεστάθη, and the supplied textual-variant footnote is not anchored in the provided SBLGNT source or English POB audit trail.
  naturalness: The narrative is generally fluent modern Telugu. “వారందరినీ చుట్టూ చూసి” more clearly conveys a surveying look directed at the whole group, and explicitly repeating “తన చెయ్యి” is more natural and clearer than “దాన్ని.” “పునరుద్ధరించబడింది” is suitably clear and accurately formal for the healing/restoration conclusion.
  terminology: “కోపంతో,” “దుఃఖిస్తూ,” “హృదయాల కాఠిన్యం,” and “చెయ్యి చాపు” are accurate, natural choices. “పునరుద్ధరించబడింది” preserves the restoration sense without reducing it merely to becoming well.
  issues:
  - severity: medium
    issue: The footnote asserts a textual variant not represented in the supplied SBLGNT source context or English POB audit trail.
    rationale: A textual-variant note requires an identified textual basis and appropriate anchoring. Retaining it here introduces unsupported material and attaches the marker to the end of the verse rather than to a specific variant-bearing expression.
  - severity: low
    issue: “మళ్లీ బాగైంది” is comparatively colloquial and weakens the lexical restoration sense of ἀπεκατεστάθη.
    rationale: The Greek passive describes the hand as restored. “పునరుద్ధరించబడింది” better preserves both restoration and passive result.
  - severity: low
    issue: “అతడు దాన్ని చాపాడు” has a less explicit antecedent in Telugu.
    rationale: Repeating “తన చెయ్యి” retains the command-and-response echo and reads more naturally.
  revised_text: ఆయన కోపంతో వారందరినీ చుట్టూ చూసి, వారి హృదయాల కాఠిన్యాన్ని బట్టి దుఃఖిస్తూ, ఆ మనిషితో, “నీ చెయ్యి చాపు” అని అంటాడు. అతడు తన చెయ్యి చాపాడు; అతని చెయ్యి పునరుద్ధరించబడింది.
  revised_footnotes: []
