id: MRK.3.5
reference: Mark 3:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος αὐτοὺς μετ’ ὀργῆς, συλλυπούμενος ἐπὶ τῇ πωρώσει τῆς καρδίας αὐτῶν, λέγει τῷ ἀνθρώπῳ· Ἔκτεινον τὴν ⸀χεῖρα· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/005.yaml
  text: And after looking around at them with anger[a], grieved at the hardness of their hearts, he says to the man, “Stretch out your hand.” And he stretched it out, and his hand was restored.
translation:
  language: te
  text: ఆయన కోపంతో వారందరినీ చుట్టూ చూసి, వారి హృదయాల కాఠిన్యాన్ని బట్టి దుఃఖిస్తూ, ఆ మనిషితో, “నీ చెయ్యి చాపు” అని అంటాడు. అతడు తన చెయ్యి చాపాడు; అతని చెయ్యి పునరుద్ధరించబడింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: వారిచుట్టూ చూసి
  rationale: ఆ గుంపంతటినీ చుట్టూ కలయచూసిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; అఓరిస్ట్ కృదంతం ప్రధాన క్రియకు ముందున్న చర్యను సూచిస్తుంది.
- source_word: μετ’ ὀργῆς
  choice: కోపంతో
  rationale: μετά + షష్ఠీ విభక్తి తోడున్న భావరీతిని సూచిస్తుంది. యేసు కోపాన్ని తగ్గించకుండా సూటిగా వ్యక్తం చేస్తుంది.
- source_word: συλλυπούμενος
  choice: దుఃఖిస్తూ
  rationale: బాధపడటం లేదా దుఃఖించటం అనే భావాన్ని సహజంగా అందిస్తుంది; కోపం, దుఃఖం రెండూ ఏకకాలంలో ఉన్న ఉద్వేగాన్ని నిలుపుతుంది.
- source_word: ἐπὶ τῇ πωρώσει
  choice: హృదయకాఠిన్యానికి
  rationale: ἐπί ఇక్కడ దుఃఖానికి కారణం లేదా ఆధారాన్ని సూచిస్తుంది; πώρωσις లోని కఠినత్వ రూపకాన్ని నిలుపుతుంది.
- source_word: τῆς καρδίας αὐτῶν
  choice: వారి హృదయకాఠిన్యం
  rationale: గ్రీకులో ‘హృదయం’ ఏకవచనంలో ఉన్నా αὐτῶν బహువచనం; తెలుగు సమాస రూపం సమూహసూచక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: λέγει
  choice: అని అంటాడు
  rationale: మార్కు వాడిన చారిత్రక వర్తమాన కాలపు సజీవ కథనశైలిని నిలుపుతుంది.
- source_word: τῷ ἀνθρώπῳ
  choice: ఆ మనిషితో
  rationale: సందర్భంలోని నిర్దిష్ట పురుషుణ్ణి సహజంగా సూచిస్తుంది.
- source_word: Ἔκτεινον τὴν χεῖρα
  choice: నీ చెయ్యి చాపు
  rationale: నిర్ణయాత్మక ఆజ్ఞను సరళమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐξέτεινεν
  choice: అతడు దాన్ని చాపాడు
  rationale: ఆజ్ఞలోని క్రియను పునరావృతం చేస్తూ, సందర్భం ద్వారా ‘చెయ్యి’ని స్పష్టంగా గ్రహించగలిగేలా చేస్తుంది.
- source_word: ἀπεκατεστάθη
  choice: మళ్లీ బాగైంది
  rationale: పూర్వపు సరైన స్థితికి తిరిగి రావడం అనే ἀποκαθίστημι భావాన్ని సహజమైన సాధారణ తెలుగులో అందిస్తుంది; కేవలం వైద్యపరమైన ‘స్వస్థపడింది’ కంటే పునరుద్ధరణ భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యేసు స్పందనలో కోపం మరియు దుఃఖం
  choice: ‘కోపంతో’, ‘దుఃఖిస్తూ’ అని రెండు భావోద్వేగాలనూ సూటిగా అనువదించడం
  alternative: కోపాన్ని ‘ఆగ్రహం’ లేదా ‘అసంతృప్తి’గా తగ్గించి, దుఃఖాన్ని విస్తరించి చెప్పడం
  rationale: మూలపాఠం యేసు కోపాన్ని, దుఃఖాన్ని రెండింటినీ స్పష్టంగా ఉంచుతుంది. వాటి మధ్యనున్న నైతిక, దైవశాస్త్రీయ ఉద్వేగాన్ని తగ్గించకుండా నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళంగా, అయితే గౌరవప్రదమైన కథనశైలిలో అనువదించబడింది. మార్కు వాడిన చారిత్రక వర్తమానాన్ని ‘అంటాడు’ ద్వారా నిలిపి, ప్రధాన చర్యల సహజ తెలుగు క్రమాన్ని పాటించింది.
