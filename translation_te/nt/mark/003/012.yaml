    issue: The translation adds ‘ఎవరికీ’ (‘to anyone’).
    rationale: The Greek says only that they were not to make him known; it does not explicitly state ‘to anyone.’ Removing it preserves the source’s concise wording and avoids narrowing or expanding the implied audience.
