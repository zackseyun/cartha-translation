  text: καὶ πολλὰ ἐπετίμα αὐτοῖς ἵνα μὴ ⸂αὐτὸν φανερὸν⸃ ⸀ποιήσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/012.yaml
  text: And he sternly warned them many times not to make him known[a].
translation:
  language: te
  text: తనను తెలియపరచవద్దని ఆయన వాటిని పదేపదే గట్టిగా హెచ్చరించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తనను బహిర్గతం చేయవద్దని,’ ‘తనను ప్రజలకు వెల్లడించవద్దని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ
  choice: పదేపదే
  rationale: ఇక్కడ ἐπετίμαతో క్రియావిశేషణంగా వచ్చి, ఆజ్ఞాపించడం పునరావృతంగా లేదా తీవ్రంగా జరిగిందని సూచిస్తుంది. ఆధునిక తెలుగులో ‘పదేపదే’ సహజంగా పునరావృత భావాన్ని తెలియజేస్తుంది.
- source_word: ἐπετίμα
  choice: గట్టిగా ఆజ్ఞాపించాడు
  rationale: అపవిత్రాత్మలను ఉద్దేశించిన ఈ సందర్భంలో బలమైన మందలింపు మరియు నిషేధ ఆజ్ఞ రెండూ ఉన్నాయి. ‘గట్టిగా ఆజ్ఞాపించాడు’ ఆ అధికారపూర్వక బలాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: αὐτοῖς
  choice: వాటిని
  rationale: సమీప సందర్భంలోని అపవిత్రాత్మలను సూచిస్తుంది. తెలుగులో ఆత్మలను సూచించడానికి ‘వాటిని’ సహజమైన సర్వనామ రూపం.
- source_word: ἵνα μὴ
  choice: తెలియజేయవద్దని
  rationale: హెచ్చరిక లేదా ఆజ్ఞ యొక్క నిషేధాత్మక విషయాన్ని తెలుగులో సహజమైన పరోక్ష ఆజ్ఞ రూపంలో వ్యక్తపరుస్తుంది.
- source_word: αὐτὸν φανερὸν ποιήσωσιν
  choice: తనను ఎవరికీ తెలియజేయవద్దని
  rationale: φανερὸν ποιέω అనే ప్రయోగం ఒకరిని బహిర్గతం చేయడం లేదా తెలిసేలా చేయడం అనే భావాన్ని ఇస్తుంది. ‘తెలియజేయడం’ సహజంగా ఉంది; ‘ఎవరికీ’ ప్రజలకు వెల్లడించకూడదనే భావాన్ని తెలుగులో స్పష్టం చేస్తుంది, అయితే ఆయన గుర్తింపేమిటో అదనంగా నిర్దేశించదు.
theological_decisions:
- issue: అపవిత్రాత్మలకు యేసు ఇచ్చిన ఆజ్ఞ స్వభావం
  choice: ఆయనను ఇతరులకు తెలియజేయవద్దనే నిషేధంగా అనువదించబడింది; ఆయన గురించి ఏ గుర్తింపును వెల్లడించకూడదో వచనం చెప్పినదానికంటే ఎక్కువగా నిర్దేశించలేదు.
  alternative: ‘దేవుని కుమారుడు’ అని వెల్లడించవద్దని ప్రత్యేకంగా విస్తరించడం; లేదా కేవలం మాట్లాడవద్దనే సాధారణ మౌన ఆజ్ఞగా అనువదించడం.
  rationale: ముందటి సందర్భం యేసు గుర్తింపును సూచించినప్పటికీ, ఈ వచనం αὐτὸν φανερὸν ποιήσωσιν అని మాత్రమే చెబుతుంది. అందువల్ల క్రీస్తు గుర్తింపుకు సంబంధించిన వివరాన్ని చేర్చకుండా మూలంలోని ఉద్వేగం నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘గట్టిగా ఆజ్ఞాపించాడు’ మూలంలోని అధికారపూర్వక బలాన్ని, ‘పదేపదే’ πολλὰ యొక్క పునరావృత భావాన్ని అందిస్తాయి.
