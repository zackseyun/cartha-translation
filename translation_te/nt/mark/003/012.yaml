  verdict: revise
  source_fidelity: The draft correctly reflects the repeated, forceful warning and the prohibition on making Jesus known. However, ‘ఎవరికీ’ (‘to anyone’) adds an explicit recipient not stated in the Greek. The idiom αὐτὸν φανερὸν ποιήσωσιν is better retained without that added specification.
  naturalness: ‘తనను తెలియపరచవద్దని ఆయన వాటిని పదేపదే గట్టిగా హెచ్చరించాడు’ is natural modern standard Telugu. ‘హెచ్చరించాడు’ appropriately conveys the warning/charge in this context without over-specifying the mode of command.
  terminology: ‘తెలియపరచు’ conveys φανερὸν ποιεῖν (‘make known/reveal’) clearly. The alternatives in the footnote preserve the public-disclosure nuance. ‘వాటిని’ remains a contextually acceptable reference to the unclean spirits, while avoiding an unnecessary restatement.
  issues:
