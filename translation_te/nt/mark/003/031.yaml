  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂Καὶ ἔρχονται⸃ ⸂ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ⸃ καὶ ἔξω ⸀στήκοντες ἀπέστειλαν πρὸς αὐτὸν ⸀καλοῦντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/031.yaml
  text: Then his mother and his brothers came[a], and standing outside they sent word to him[b], calling him.
translation:
  language: te
  text: అప్పుడు ఆయన తల్లి, ఆయన సోదరులు వచ్చారు. వారు బయట నిలబడి, ఆయనను పిలవడానికి ఆయనకు కబురు పంపారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: అప్పుడు
  rationale: కథనాన్ని ముందుకు నడిపించే వాక్యారంభ సంధానార్థాన్ని సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: ἔρχονται
  choice: వచ్చారు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని తెలుగులో సహజమైన భూతకాలంతో వ్యక్తం చేశాం.
- source_word: ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: ఆయన తల్లి, ఆయన సహోదరులు
  rationale: సంబంధాలను ఉన్నట్లుగానే తెలుపుతుంది; ἀδελφοί అనే పురుష బహువచనానికి ‘సహోదరులు’ తటస్థమైన, గౌరవప్రదమైన సరిపోలిక.
- source_word: ἔξω στήκοντες
  choice: బయట నిలబడి
  rationale: స్థానాన్నీ, సమకాలిక పరిస్థితినీ సంక్షిప్తంగా, సహజంగా తెలుపుతుంది.
- source_word: ἀπέστειλαν πρὸς αὐτόν
  choice: ఆయన దగ్గరికి కబురు పంపారు
  rationale: ఎవరినో లేదా సందేశాన్నో ఆయన వద్దకు పంపిన సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; గ్రీకు వాక్యం పంపబడిన వ్యక్తి లేదా వస్తువును స్పష్టంగా పేర్కొనదు.
- source_word: καλοῦντες αὐτόν
  choice: ఆయనను పిలిపించడానికి
  rationale: ఈ అసమాపక క్రియ సందేశం పంపిన ఉద్దేశాన్ని తెలియజేస్తుంది; ఆయన బయటకు రావాలని కోరిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘ఆయన సహోదరులు’ అనే మాటలోని బంధుత్వ సంబంధం
  choice: సహోదరులు అని మాత్రమే అనువదించడం
  alternative: సొంత తమ్ముళ్లు/అన్నదమ్ములు లేదా విస్తృత బంధువులు అని వివరణాత్మకంగా అనువదించడం
  rationale: ἀδελφοί అనే పదం ఇక్కడ ‘సహోదరులు’ అని చెబుతుంది; వారి ఖచ్చితమైన కుటుంబ సంబంధంపై ఏ సంప్రదాయ వ్యాఖ్యానాన్నీ అనువాదంలో చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గౌరవప్రదమైన కథనశైలి. మూలంలో లేని నిర్దిష్ట దూతను చేర్చకుండా ‘కబురు పంపారు’ అని ఉంచాం.
