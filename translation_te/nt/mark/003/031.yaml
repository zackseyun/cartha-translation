revisions:
- from: అప్పుడు ఆయన తల్లి, ఆయన సహోదరులు వచ్చారు. వారు బయట నిలబడి, ఆయనను పిలిపించడానికి ఆయన దగ్గరికి కబురు పంపారు.
  to: అప్పుడు ఆయన తల్లి, ఆయన సోదరులు వచ్చారు. వారు బయట నిలబడి, ఆయనను పిలవడానికి ఆయనకు కబురు పంపారు.
  rationale: The revision retains the draft’s accurate narrative sense and register while replacing the causative expression with ‘ఆయనను పిలవడానికి,’ which directly conveys the purpose expressed by καλοῦντες αὐτόν. It also uses the recipient-oriented Telugu idiom ‘ఆయనకు కబురు పంపారు’ for ἀπέστειλαν πρὸς αὐτόν. No footnote is required because the translation does not introduce a disputed or materially expanded reading.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:00:59Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the narrative connective, historical-present verb with natural Telugu past tense, Jesus’ mother and brothers, and their position outside. However, ‘ఆయనను పిలిపించడానికి’ is causative (‘to cause someone to call him’), whereas καλοῦντες αὐτόν directly means ‘calling him.’ A non-causative purpose expression better preserves the Greek.
  naturalness: The revised wording is modern, clear, and suitably respectful Telugu. ‘ఆయనకు కబురు పంపారు’ naturally expresses sending word to him; ‘ఆయన దగ్గరికి కబురు పంపారు’ can sound more spatially directed than recipient-directed.
  terminology: ‘సోదరులు’ is an appropriate direct rendering of οἱ ἀδελφοὶ and does not prejudge the precise familial relationship. No doctrinal clarification should be added.
  issues:
  - severity: medium
    issue: ‘పిలిపించడానికి’ is causative.
    rationale: This wording can imply that they arranged for another person to summon Jesus. The Greek participle καλοῦντες has the family members as the callers and should be rendered non-causatively.
  - severity: low
    issue: ‘ఆయన దగ్గరికి కబురు పంపారు’ is less precise for πρὸς αὐτόν.
    rationale: The construction chiefly indicates that the message was directed to him. ‘ఆయనకు కబురు పంపారు’ is more idiomatic and avoids an unnecessary spatial nuance.
  revised_text: అప్పుడు ఆయన తల్లి, ఆయన సోదరులు వచ్చారు. వారు బయట నిలబడి, ఆయనను పిలవడానికి ఆయనకు కబురు పంపారు.
  revised_footnotes: []
  revision_rationale: The revision retains the draft’s accurate narrative sense and register while replacing the causative expression with ‘ఆయనను పిలవడానికి,’ which directly conveys the purpose expressed by καλοῦντες αὐτόν. It also uses the recipient-oriented Telugu idiom ‘ఆయనకు కబురు పంపారు’ for ἀπέστειλαν πρὸς αὐτόν. No footnote is required because the translation does not introduce a disputed or materially expanded reading.
