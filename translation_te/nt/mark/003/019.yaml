revisions:
- from: మరియు ఇస్కరియోతు యూదాను[a]—ఇతడే యేసును అప్పగించాడు.
  to: మరియు ఇస్కరియోతు యూదా—అతడు యేసును కూడా అప్పగించాడు.
  rationale: The revision removes the unwarranted emphasis in ‘ఇతడే’ and renders the relative clause as a natural Telugu resumptive clause. It retains the source-close ‘అప్పగించాడు,’ includes the Greek adverbial καί as ‘కూడా,’ and keeps the contextual ‘betrayed’ sense in the footnote.
  reviewer_model: gpt-5.6-terra
