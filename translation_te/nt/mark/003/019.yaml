  text: καὶ Ἰούδαν ⸀Ἰσκαριώθ, ὃς καὶ παρέδωκεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/019.yaml
  text: and Judas Iscariot[a], who also betrayed him.
translation:
  language: te
  text: మరియు ఇస్కరియోతు యూదా—అతడు యేసును కూడా అప్పగించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: మరియు
  rationale: మునుపటి అపొస్తలుల జాబితాలోని చివరి పేరును కలిపే సాధారణ సంధాన పదంగా అనువదించబడింది.
- source_word: Ἰούδαν
  choice: యూదాను
  rationale: తెలుగులో స్థిరపడిన బైబిలు నామరూపాన్ని, వాక్యంలోని కర్మ విభక్తితో ఉపయోగించాం.
- source_word: Ἰσκαριώθ
  choice: ఇస్కరియోతు
  rationale: వ్యుత్పత్తి అనిశ్చితంగా ఉన్న నామవిశేషణం కాబట్టి ఊహాత్మక అర్థానువాదం చేయకుండా ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణను ఎంచుకున్నాం.
- source_word: ὃς
  choice: ఇతడే
  rationale: యూదాను గురించి అదనపు గుర్తింపు ఇచ్చే సంబంధవాచక ఉపవాక్యాన్ని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ
  choice: -ఏ
  rationale: సంబంధవాచక ఉపవాక్యంలో καί ఇచ్చే అదనపు గుర్తింపు లేదా ఉద్ఘాటనను ‘ఇతడే’లోని నిశ్చయార్థక ప్రత్యయం సహజంగా ప్రతిబింబిస్తుంది.
- source_word: παρέδωκεν
  choice: అప్పగించాడు
  rationale: క్రియ యొక్క ప్రాథమిక భావమైన ‘వేరొకరి చేతికి అప్పగించడం’ను నిలుపుతూ, సందర్భంలోని ద్రోహభావాన్ని పాఠకుడు కథనంలో గ్రహించేలా చేస్తుంది.
- source_word: αὐτόν
  choice: యేసును
  rationale: సర్వనామ సూచనను తెలుగు పాఠకునికి స్వతంత్ర వచనంగా స్పష్టంగా చేయడానికి దాని సూచ్యమైన యేసు పేరును ఉపయోగించాం.
theological_decisions:
- issue: యూదా చేసిన కార్యాన్ని తెలిపే παραδίδωμι అనువాదం
  choice: అప్పగించాడు
  alternative: ద్రోహం చేశాడు
  rationale: గ్రీకు క్రియ ప్రత్యక్షంగా ‘అప్పగించు/చేతికి ఇవ్వు’ అని అర్థమివ్వగలదు; యూదా సందర్భంలో అది ద్రోహమే అయినప్పటికీ, ప్రధాన పాఠంలో ‘అప్పగించాడు’ అని ఉంచడం మూలంలోని పదార్థ విస్తృతిని, నైతిక ఉద్రిక్తతను కాపాడుతుంది. సందర్భార్థమైన ‘ద్రోహం చేశాడు’ను పాదసూచికలో అందించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఇది పేర్ల జాబితా ముగింపు భాగమని చూపేందుకు ప్రారంభ సంధాన పదాన్ని నిలిపాం. మూలంలోని αὐτόν సూచనను స్వతంత్ర వచనంలో స్పష్టత కోసం ‘యేసును’గా విప్పి చెప్పాం.
