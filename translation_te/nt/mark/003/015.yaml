  text: and to have authority to cast out demons[a].
translation:
  language: te
  text: మరియు దయ్యాలను వెళ్లగొట్టే అధికారం కలిగి ఉండడానికి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దయ్యాలను తరిమివేసే అధికారం కలిగి ఉండడానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: —
  rationale: ఈ వాక్యఖండం ముందున్న ఉద్దేశార్థక క్రియల వరుసలో భాగం. ఆధునిక తెలుగు వాక్యనిర్మాణంలో ఈ చివరి సమాంతర అంశానికి ప్రత్యేకంగా ‘మరియు’ చేర్చకపోవడం సహజం; అనుసంధానం సందర్భం ద్వారా స్పష్టంగా ఉంటుంది.
- source_word: ἔχειν
  choice: కలిగి ఉండడానికి
  rationale: వర్తమాన కర్తరి క్రియార్థక రూపాన్ని, ముందటి నియామక ఉద్దేశంతో అనుసంధానమయ్యే సహజ తెలుగు ఉద్దేశార్థక నిర్మాణంగా అనువదిస్తుంది.
- source_word: ἐξουσίαν
  choice: అధికారం
  rationale: కేవలం శక్తిని కాక, యేసు అప్పగించిన కార్యాధికారాన్ని లేదా హక్కుతో కూడిన సామర్థ్యాన్ని సూచిస్తుంది.
- source_word: ἐκβάλλειν
  choice: వెళ్లగొట్టే
  rationale: బయటకు పంపడం లేదా బలంగా తొలగించడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τὰ δαιμόνια
  choice: దయ్యాలను
  rationale: మూలంలోని δαιμόνιαకు నేరుగా సరిపోతుంది; ‘అపవిత్రాత్మలు’ అని అనువదిస్తే ఈ వచనంలో లేని సమీప పాఠ్యపదాన్ని దిగుమతి చేసినట్లవుతుంది.
theological_decisions:
- issue: శిష్యుల నియామకంలో ἐξουσία స్వభావం
  choice: అధికారం
  alternative: శక్తి
  rationale: ఇక్కడ యేసు ఇచ్చిన నియామకంతో కూడిన కార్యసామర్థ్యం ప్రధానంగా కనిపిస్తుంది. ‘అధికారం’ ఆ అప్పగింతను నిలుపుతూ, దయ్యాలను వెళ్లగొట్టడంలో ఉన్న అసాధారణ శక్తిని నిరాకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే గంభీరతను నిలుపుకునేలా రూపొందించబడింది. ఇది పూర్తి వాక్యం కాక ముందటి వచనంతో కొనసాగే ఉద్దేశార్థక వాక్యఖండం.
