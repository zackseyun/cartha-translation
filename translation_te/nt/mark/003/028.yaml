source:
  edition: SBLGNT
  text: Ἀμὴν λέγω ὑμῖν ὅτι πάντα ἀφεθήσεται ⸂τοῖς υἱοῖς τῶν ἀνθρώπων, τὰ ἁμαρτήματα⸃ καὶ ⸂αἱ βλασφημίαι ὅσα ἐὰν⸃ βλασφημήσωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/028.yaml
  text: Truly I tell you that all sins will be forgiven to the sons of men[a], and whatever blasphemies they may utter;
translation:
  language: te
  text: '“నేను మీతో నిజంగా చెబుతున్నాను: మనుష్యుల కుమారులకు[a] అన్ని పాపాలూ, వారు ఎన్ని దైవదూషణలు పలికినా అవన్నీ క్షమించబడతాయి;”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మానవులకు,” “ప్రజలకు.” “మనుష్యుల కుమారులు” అనే గ్రీకు ప్రయోగం మానవులందరినీ సాధారణంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: నిజంగా
  rationale: సమాంతర సువార్తల్లో యేసు గంభీరంగా ధృవీకరించి చెప్పే మాటను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; ‘ఆమేన్’ అని లిప్యంతరీకరించడం కన్నా భావం స్పష్టంగా ఉంటుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో ... చెబుతున్నాను
  rationale: ప్రత్యక్ష సంబోధనను, వర్తమానకాలపు గంభీర ప్రకటనను సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: πάντα ... τὰ ἁμαρτήματα καὶ αἱ βλασφημίαι
  choice: అన్ని పాపాలూ ... దైవదూషణలన్నీ
  rationale: πάντα యొక్క సమగ్ర పరిధిని తరువాతి రెండు నామవాచకాలతో స్పష్టంగా కలుపుతుంది. ‘పాపాలు’ క్రియారూప పాపాలను సూచించగా, ‘దైవదూషణలు’ సందర్భంలోని మతపరమైన తీవ్రతను నిలుపుతుంది.
- source_word: ἀφεθήσεται
  choice: క్షమించబడతాయి
  rationale: పాపాల సందర్భంలో ἀφίημι యొక్క భవిష్యత్ కర్మణి రూపానికి నేరమైన, ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: మనుష్యుల కుమారులకు
  rationale: మూలంలోని సెమిటిక్ శైలిగల, వ్యాకరణపరంగా పుంలింగమైన ప్రయోగాన్ని నిలుపుతుంది. ఇది పురుషులకు మాత్రమే పరిమితం కాదని పాదసూచిక వివరిస్తుంది.
- source_word: ὅσα ἐὰν βλασφημήσωσιν
  choice: వారు పలికే దైవదూషణలన్నీ
  rationale: ἐάνతో కూడిన అనిశ్చిత, విస్తృత పరిధిని ‘అన్నీ’ ద్వారా తెలియజేస్తూ, దూషణలు మాటల రూపంలో వెలువడతాయనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: తరువాతి వచనంలోని పరిశుద్ధాత్మ దూషణ హెచ్చరికకు సంబంధించి క్షమాపణ ప్రకటన పరిధి
  choice: ఈ వచనంలో ఉన్న విస్తృత క్షమాపణ ప్రకటనను ఎలాంటి ముందస్తు మినహాయింపూ చేర్చకుండా అనువదించడం.
  alternative: తరువాతి వచనంలోని మినహాయింపును ఈ వచనంలోనే అంతర్లీన పరిమితిగా చేర్చడం.
  rationale: ఈ వచనం మొదట క్షమాపణ యొక్క విస్తృతిని ప్రకటిస్తుంది; తరువాతి వచనం మినహాయింపును చెబుతుంది. మూలపాఠంలోని ఈ ధార్మిక ఉద్వేగాన్ని ముందుగానే పరిష్కరించకుండా నిలుపుతున్నాం.
- issue: τοῖς υἱοῖς τῶν ἀνθρώπων అనే సాధారణ పుంలింగ ప్రయోగం
  choice: ప్రధాన పాఠంలో ‘మనుష్యుల కుమారులకు’ అని ఉంచి, సమగ్ర మానవార్థాన్ని పాదసూచికలో వివరించడం.
  alternative: ‘మానవులకు’ లేదా ‘ప్రజలకు’ అని ప్రధాన పాఠంలోనే భావానువాదం చేయడం.
  rationale: మూలంలోని రూపకల్పనను, సెమిటిక్ వాసనను నిలుపుతూనే అది మానవులందరినీ సూచిస్తుందని పాఠకుడికి స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. యేసు ప్రకటనలోని ఔన్నత్యాన్ని ‘నిజంగా చెబుతున్నాను’ నిలుపుతుంది. వచనం తరువాతి మాటతో కొనసాగుతున్నందున చివరలో అర్ధవిరామం ఉంచబడింది.
