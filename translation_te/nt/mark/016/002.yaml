revisions:
- from: వారం మొదటి రోజున[a] తెల్లవారుజామునే, సూర్యుడు ఉదయించినప్పుడు[c] వారు సమాధి దగ్గరికి వస్తారు.[b]
  to: వారం మొదటి రోజున[a] చాలా తెల్లవారుజామున, సూర్యుడు ఉదయించినప్పుడు[c] వారు సమాధి వద్దకు వస్తారు.[b]
  rationale: The revision makes λίαν explicit, renders the movement toward the tomb more precisely, and corrects the lexical explanation of the Greek weekly idiom. It retains the historical present and does not impose a stronger temporal sequence than the genitive absolute warrants.
