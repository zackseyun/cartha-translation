  rationale: λίαν అనే తీవ్రతను తెలుగు సహజ ప్రయోగంలోని ‘-నే’ ద్వారా తెలియజేస్తూ, చాలా పొద్దున్నే అనే భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: τῇ μιᾷ τῶν σαββάτων
