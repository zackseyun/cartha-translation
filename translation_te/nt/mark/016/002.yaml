- source_word: ἔρχονται
  choice: వస్తారు
  rationale: మార్కు వాడిన చారిత్రక వర్తమాన కాలాన్ని నిలుపుతూ కథన సజీవతను కాపాడుతుంది.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: సమాధి దగ్గరికి
  rationale: సమాధి వైపు కదలికను, అక్కడికి చేరడాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἀνατείλαντος τοῦ ἡλίου
  choice: సూర్యుడు ఉదయించినప్పుడు
  rationale: జెనిటివ్ అబ్సల్యూట్ సూచించే కాలసంబంధాన్ని ‘ప్పుడు’తో వ్యక్తం చేస్తుంది; ‘తర్వాత’ అని గ్రీకులోకన్నా బలమైన క్రమార్థాన్ని జోడించదు.
