  yaml_path: translation/nt/mark/016/002.yaml
  text: And very early on the first day of the week[c][b][a], they come to the tomb when the sun had risen.
translation:
  language: te
  text: వారం మొదటి రోజున[a] చాలా తెల్లవారుజామున, సూర్యుడు ఉదయించినప్పుడు[c] వారు సమాధి వద్దకు వస్తారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా, ‘విశ్రాంతిదినాల మొదటి [రోజున].’ ఇది ‘వారం మొదటి రోజున’ అనే అర్థమిచ్చే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: మార్కు ఇక్కడ ‘వస్తారు’ అనే చారిత్రక వర్తమాన కాలాన్ని వాడుతున్నాడు; తెలుగులో ‘వచ్చారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘సూర్యుడు ఉదయించిన తరువాత.’ గ్రీకు జెనిటివ్ అబ్సల్యూట్ వారు సమాధి వద్దకు వచ్చిన సమయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
