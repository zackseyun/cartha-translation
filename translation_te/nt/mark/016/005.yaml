id: MRK.16.5
reference: Mark 16:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσαι εἰς τὸ μνημεῖον εἶδον νεανίσκον καθήμενον ἐν τοῖς δεξιοῖς περιβεβλημένον στολὴν λευκήν, καὶ ἐξεθαμβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/005.yaml
  text: And when they entered the tomb, they saw a young man sitting on the right, clothed in a white robe, and they were alarmed.
translation:
  language: te
  text: వారు సమాధిలోకి ప్రవేశించినప్పుడు, కుడివైపున తెల్లని పొడవాటి వస్త్రం ధరించి కూర్చున్న ఒక యువకుణ్ణి[a] చూశారు; వారు దిగ్భ్రాంతి చెందారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవదూతను.’ మార్కు ఇక్కడ అతణ్ణి ‘యువకుడు’ అని వర్ణిస్తున్నాడు; అయితే విస్తృత సందర్భం, సమాంతర వృత్తాంతాలు అతడు దేవదూత అని సూచిస్తున్నాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: ప్రవేశించినప్పుడు
  rationale: స్త్రీలను సూచించే భూతకాల క్రియావిశేషణ రూపాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా వ్యక్తపరుస్తుంది.
- source_word: μνημεῖον
  choice: సమాధి
  rationale: యేసు ఉంచబడిన శిలా సమాధిని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా సూచించే సాధారణ పదం.
- source_word: νεανίσκον
  choice: ఒక యువకుణ్ణి
  rationale: గ్రీకు పదం నేరుగా ‘యువకుడు’ అని వర్ణిస్తుంది; ప్రధాన పాఠ్యంలో అతణ్ణి దేవదూతగా ముందే నిర్ధారించదు.
- source_word: καθήμενον ἐν τοῖς δεξιοῖς
  choice: కుడివైపున ... కూర్చున్న
  rationale: సమాధిలో అతని స్థానాన్నీ భంగిమనూ సహజమైన తెలుగు పదక్రమంలో తెలియజేస్తుంది.
- source_word: περιβεβλημένον στολὴν λευκήν
  choice: తెల్లని పొడవాటి వస్త్రం ధరించి
  rationale: στολή సాధారణ వస్త్రం కంటే పొడవైన ప్రత్యేక వస్త్రాన్ని సూచించగలదు; ‘ధరించి’ పరిపూర్ణ కృదంతం తెలిపే స్థితిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐξεθαμβήθησαν
  choice: తీవ్రంగా దిగ్భ్రాంతి చెందారు
  rationale: కేవలం ఆశ్చర్యం కంటే బలమైన కలవరంతో కూడిన హఠాత్తు ప్రతిస్పందనను తెలియజేస్తుంది; ‘భయభ్రాంతులయ్యారు’ అన్నంతగా భయాన్ని మాత్రమే ముందుకు తేవదు.
theological_decisions:
- issue: νεανίσκος అనే వ్యక్తి గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో ‘యువకుడు’ అని వర్ణించడం
  alternative: దేవదూత
  rationale: మార్కు 16:5 స్వయంగా νεανίσκος అనే వర్ణననే ఉపయోగిస్తుంది. తెల్లని వస్త్రం, విస్తృత సందర్భం, సమాంతర వృత్తాంతాలు అతడు దేవదూతల సందేశవాహకుడని సూచించినా, ప్రధాన పాఠ్యం ఆ వ్యాఖ్యానాన్ని పదంలోకి చేర్చకుండా మార్కు వాడిన ఉద్దేశపూర్వక వర్ణనను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా సహజమైన వాక్యనిర్మాణం, అయితే మూలంలోని వర్ణనాత్మక అనిశ్చితి మరియు బలమైన భావోద్వేగ స్పందన నిలుపబడ్డాయి.
