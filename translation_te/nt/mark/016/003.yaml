id: MRK.16.3
reference: Mark 16:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔλεγον πρὸς ἑαυτάς· Τίς ἀποκυλίσει ἡμῖν τὸν λίθον ⸀ἐκ τῆς θύρας τοῦ μνημείου;
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/003.yaml
  text: And they were saying to one another[a], “Who will roll away the stone for us from the entrance of the tomb?”
translation:
  language: te
  text: 'వారు ఒకరితో ఒకరు ఇలా చెప్పుకుంటూ ఉన్నారు: “సమాధి ప్రవేశద్వారం నుండి మనకొరకు ఆ రాయిని ఎవరు దొర్లించి తొలగిస్తారు?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: అని అనుకుంటూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం ప్రయాణంలో కొనసాగిన లేదా పునరావృతమైన సంభాషణను సూచిస్తుంది; సహజమైన తెలుగులో ‘అని అనుకుంటూ ఉన్నారు’ ఆ కొనసాగుదలను వ్యక్తం చేస్తుంది.
- source_word: πρὸς ἑαυτάς
  choice: ఒకరితో ఒకరు
  rationale: పదశః ‘తమలో తాము’ అనే భావం ఉన్నా, ఈ బహువచన సందర్భంలో స్త్రీలు పరస్పరం మాట్లాడుకున్నారనే అర్థం; ‘ఒకరితో ఒకరు’ సహజంగా ఉంది.
- source_word: Τίς
  choice: ఎవరు
  rationale: ఆ పని చేయగల వ్యక్తి గురించి అడిగే ప్రశ్నార్థక సర్వనామానికి నేరమైన, సహజమైన సమానం.
- source_word: ἀποκυλίσει
  choice: దొర్లిస్తారు
  rationale: అడ్డుగా ఉన్న రాయిని దొర్లించి తొలగించడాన్ని క్రియ స్పష్టంగా సూచిస్తుంది; ‘దొర్లిస్తారు’ రాయి కదలికను నిలుపుతుంది.
- source_word: ἡμῖν
  choice: మన కోసం
  rationale: ఈ చతుర్థీ విభక్తి వారి ప్రయోజనార్థం లేదా వారి తరఫున పని చేయడాన్ని సూచిస్తుంది.
- source_word: τὸν λίθον
  choice: రాయిని
  rationale: మూలంలో కేవలం ‘రాయి’ మాత్రమే ఉంది; దాని పరిమాణాన్ని సూచించే విశేషణాన్ని చేర్చలేదు.
- source_word: ἐκ τῆς θύρας
  choice: ప్రవేశద్వారం దగ్గర నుండి
  rationale: ἐκ తొలగింపు మొదలయ్యే స్థలాన్ని, θύρα సమాధి తెరువును సూచిస్తాయి. తెలుగులో ‘ప్రవేశద్వారం దగ్గర నుండి’ అనేది రాయి ద్వారానికి అడ్డుగా ఉన్న దృశ్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τοῦ μνημείου
  choice: సమాధి
  rationale: ఈ సందర్భంలో μνημεῖον మృతదేహాన్ని ఉంచే సమాధి గుహను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘సమాధి’ స్పష్టమైన పదం.
