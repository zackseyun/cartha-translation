translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. స్త్రీల సంభాషణ కొనసాగుతున్న భావాన్ని నిలుపుతూ, మూలంలో లేని ‘పెద్ద’ వంటి వివరాలను చేర్చలేదు.
