id: MRK.16.6
reference: Mark 16:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ λέγει αὐταῖς· Μὴ ἐκθαμβεῖσθε· Ἰησοῦν ζητεῖτε τὸν Ναζαρηνὸν τὸν ἐσταυρωμένον· ἠγέρθη, οὐκ ἔστιν ὧδε· ἴδε ὁ τόπος ὅπου ἔθηκαν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/006.yaml
  text: But he says to them[a], “Do not be alarmed. You are looking for Jesus the Nazarene, the one who has been crucified. He has been raised; he is not here[b]. Look—the place where they laid him.”
translation:
  language: te
  text: 'అయితే అతడు వారితో ఇలా అంటున్నాడు: “కలవరపడకండి. సిలువ వేయబడిన నజరేయుడైన[a] యేసును మీరు వెదుకుతున్నారు. ఆయన లేపబడ్డాడు; ఆయన ఇక్కడ లేడు.[b] ఇదిగో, వారు ఆయనను ఉంచిన స్థలం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నజోరేయుడైన” లేదా “నజరేతుకు చెందిన” అని కూడా అనువదించవచ్చు. గ్రీకులో నజరేతు నుండి ఉద్భవించిన గుర్తింపు పదం వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: '“ఆయన లేచాడు” లేదా “ఆయన లేచి ఉన్నాడు” అని కూడా అనువదించవచ్చు. గ్రీకు క్రియ కర్మణి రూపంలో ఉంది: “ఆయన లేపబడ్డాడు.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκθαμβεῖσθε
  choice: భయంతో కలవరపడకండి
  rationale: ఈ క్రియ కేవలం ఆశ్చర్యాన్ని కాక, తీవ్రమైన దిగ్భ్రాంతి లేదా కలవరాన్ని సూచిస్తుంది. సందర్భంలో సహజంగా అర్థమయ్యేలా ఈ పదబంధం ఎంచుకోబడింది.
- source_word: Ναζαρηνὸν
  choice: నజరేయుడైన
  rationale: నజరేతుతో సంబంధాన్ని తెలిపే గ్రీకు విశేషణం ఇక్కడ యేసుకు ఒక గుర్తింపు పేరుగా ఉంది; ‘నజరేయుడు’ ఆ రూపాన్ని నిలుపుతుంది.
- source_word: ἐσταυρωμένον
  choice: సిలువ వేయబడిన
  rationale: పూర్తయిన చర్యతో కొనసాగుతున్న ప్రాముఖ్యతను సూచించే పరిపూర్ణ కృదంతం. తెలుగు సహజత్వంలో ఈ రూపం భావాన్ని తగినంతగా నిలుపుతుంది.
- source_word: ἠγέρθη
  choice: ఆయన లేపబడ్డాడు
  rationale: గ్రీకులోని కర్మణి ప్రయోగాన్ని నిలుపుతూ, ఎవరు లేపారో వాక్యంలో స్పష్టంగా చేర్చకుండా మూలంలోని సూచిత దైవకార్యానికి స్థలం ఇస్తుంది.
- source_word: ζητεῖτε
  choice: మీరు వెదుకుతున్నారు
  rationale: వర్తమాన కాలంలోని కొనసాగుతున్న అన్వేషణను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἴδε
  choice: ఇదిగో
  rationale: దృష్టిని నిర్దిష్ట స్థలంవైపు మళ్లించే ఆజ్ఞాత్మక ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: ἔθηκαν
  choice: వారు … ఉంచిన
  rationale: సమాధిలో శరీరాన్ని ఉంచిన కార్యాన్ని స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: λέγει αὐταῖς
  choice: అతడు వారితో ఇలా అంటున్నాడు
  rationale: మార్కు వాడిన చారిత్రక వర్తమాన కాలపు సజీవ కథనశైలిని తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: పునరుత్థాన క్రియ యొక్క కర్మణి రూపం
  choice: ఆయన లేపబడ్డాడు
  alternative: ఆయన లేచాడు / ఆయన లేచి ఉన్నాడు
  rationale: ἠγέρθη కర్మణి రూపంలో ఉంది. దాన్ని కర్మణిగానే అనువదించడం మూలరూపాన్ని, సూచిత దైవకార్యాన్ని కాపాడుతుంది; క్రియను కర్తరి రూపంగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అదే సమయంలో గౌరవప్రదమైన బైబిలు కథన శైలి పాటించబడింది. ‘నజరేయుడు’ అనే సంప్రదాయబద్ధమైన కానీ ఇప్పటికీ అర్థమయ్యే గుర్తింపు పదం నిలుపబడింది.
