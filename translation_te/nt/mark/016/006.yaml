revisions:
- from: 'అయితే అతడు వారితో ఇలా అంటున్నాడు: “భయంతో కలవరపడకండి. సిలువ వేయబడిన నజరేయుడైన యేసును మీరు వెదుకుతున్నారు. ఆయన లేపబడ్డాడు; ఇక్కడ లేడు.[a] ఇదిగో, వారు ఆయనను ఉంచిన స్థలం.”'
  to: 'అయితే అతడు వారితో ఇలా అంటున్నాడు: “కలవరపడకండి. సిలువ వేయబడిన నజరేయుడైన[a] యేసును మీరు వెదుకుతున్నారు. ఆయన లేపబడ్డాడు; ఆయన ఇక్కడ లేడు.[b] ఇదిగో, వారు ఆయనను ఉంచిన స్థలం.”'
  rationale: The revision removes the unwarranted specification “భయంతో,” while retaining the imperative’s force. It also restores a footnote for the ambiguous Nazareth-derived designation and separates it from the passive-resurrection alternative, matching the English POB audit trail’s two-note structure. Adding “ఆయన” before “ఇక్కడ లేడు” improves Telugu clarity without adding content.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:15:35Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the historical present (λέγει), the ongoing search (ζητεῖτε), the crucifixion participle, the passive force of ἠγέρθη, the empty-tomb assertion, and the demonstrative invitation. However, “భయంతో కలవరపడకండి” explicitly introduces fear, whereas ἐκθαμβεῖσθε denotes being strongly alarmed, dismayed, or overwhelmed and does not specifically state fear.
  naturalness: The Telugu is generally clear and suitably dignified for modern standard Telugu. “కలవరపడకండి” is more direct and avoids the unnecessary added motivation. “ఆయన లేపబడ్డాడు” appropriately retains the Greek passive, though it is necessarily somewhat formal in Telugu.
  terminology: “నజరేయుడైన యేసు” is a suitable rendering of Ναζαρηνός and preserves its titular/adjectival character. The existing resurrection wording properly avoids changing the passive Greek verb into an active formulation. The Nazareth/Nazorean lexical alternative should be supplied in a footnote, and the note markers should correspond to the audit-trail distinctions.
  issues:
  - severity: medium
    issue: “భయంతో” adds a specific emotion not explicitly expressed by ἐκθαμβεῖσθε.
    rationale: The Greek conveys acute alarm or dismay; fear may be contextual but should not be made explicit in the translation.
  - severity: low
    issue: The Telugu footnote set omits the lexical alternative for Ναζαρηνόν and assigns marker a to the resurrection note, unlike the source audit trail’s two distinct notes.
    rationale: Adding the Nazorean/Nazareth alternative and placing the resurrection note at marker b better preserves the lexical transparency and footnote-anchor logic without altering the verse’s meaning.
