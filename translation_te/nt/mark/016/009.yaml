id: MRK.16.9
reference: Mark 16:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⟦Ἀναστὰς δὲ πρωῒ πρώτῃ σαββάτου ἐφάνη πρῶτον Μαρίᾳ τῇ Μαγδαληνῇ, ⸀παρ’ ἧς ἐκβεβλήκει ἑπτὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/009.yaml
  text: After he had risen[a], early on the first day of the week, he appeared first to Mary Magdalene, from whom he had cast out seven demons.
translation:
  language: te
  text: 'ఆయన లేచిన తరువాత[a], వారంలో మొదటి రోజు తెల్లవారుజామున, మొదట మగ్దల మరియకు కనిపించాడు. ఆమె నుండి ఆయన అంతకుముందే ఏడు దయ్యాలను వెళ్లగొట్టాడు.


    [a] మార్కు 16:9–20 కొన్ని ప్రాచీన ప్రతులలో లేదు; మరికొన్ని ప్రతులలో ఈ భాగం ఉంది, అయితే కొన్నిసార్లు పాఠభేదాలతో కనిపిస్తుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మార్కు 16:9–20 కొన్ని ప్రాచీన ప్రతులలో లేదు; మరికొన్ని ప్రతులలో ఈ భాగం ఉంది, అయితే కొన్నిసార్లు పాఠభేదాలతో కనిపిస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀναστὰς
  choice: ఆయన లేచిన తరువాత
  rationale: ἀνίστημι క్రియ యొక్క భూతకాల కృదంత రూపం; ప్రధాన క్రియ అయిన ἐφάνηకు ముందు జరిగిన కార్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది స్వల్ప అనుసంధాన అవ్యయం. తెలుగులో వాక్యప్రవాహం సహజంగా ఉండేందుకు బలమైన ‘అయితే’ లేదా ‘ఇప్పుడు’ చేర్చలేదు.
- source_word: πρωῒ
  choice: తెల్లవారుజామున
  rationale: ఉదయపు తొలివేళను సహజంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: πρώτῃ σαββάτου
  choice: వారంలో మొదటి రోజు
  rationale: కొయినే యూదు-క్రైస్తవ వాడుకలోని కాలసూచక నుడికారానికి స్పష్టమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: ἐφάνη
  choice: కనిపించాడు
  rationale: పునరుత్థాన దర్శన సందర్భంలో ‘ప్రత్యక్షమయ్యాడు’ కంటే సాధారణ పాఠకులకు సహజంగా ఉండి, ‘appeared’ అనే సంఘటన భావాన్ని నిలుపుతుంది.
- source_word: πρῶτον
  choice: మొదట
  rationale: దర్శనాల క్రమాన్ని సూచించే క్రియావిశేషణార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: Μαρίᾳ τῇ Μαγδαληνῇ
  choice: మగ్దల మరియకు
  rationale: మరియను మగ్దలతో సంబంధపెట్టి గుర్తించే బిరుదును సంక్షిప్తంగా, తెలుగు పేర్ల సంప్రదాయానికి అనుగుణంగా ఇస్తుంది.
- source_word: παρ’ ἧς
  choice: ఆమె నుండి
  rationale: దయ్యాలు ఎవరి నుండి వెళ్లగొట్టబడ్డాయో తెలిపే మూలం/విడిపింపు భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐκβεβλήκει
  choice: వెళ్లగొట్టాడు
  rationale: పూర్వభూతకాల భావం సందర్భం ద్వారా స్పష్టమవుతుంది; భూతవైద్య సందర్భంలోని ἐκβάλλω బలాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἑπτὰ δαιμόνια
  choice: ఏడు దయ్యాలు
  rationale: సంఖ్యను యథాతథంగా ఉంచి, సువార్తల భూతవైద్య సందర్భంలోని δαιμόνιαకు సాధారణ తెలుగు పదాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: మార్కు 16:9 దీర్ఘ ముగింపులో ఉండటం మరియు దాని పాఠవిమర్శక స్థితి
  choice: అందించిన SBLGNT పాఠంలోని వచనాన్ని అనువదించి, 16:9–20 పాఠవివాదాన్ని పాదసూచికలో పేర్కొనడం
  alternative: కొన్ని ప్రాచీన ప్రతుల ప్రకారం మార్కు సువార్తను 16:8తో ముగించడం; ఇతర ప్రతులలో 16:9–20ను పాఠభేదాలతో చేర్చడం
  rationale: అందించిన గ్రీకు పాఠం ఈ వచనాన్ని కలిగి ఉన్నప్పటికీ దానిని ద్విగుణ కోష్ఠకాలతో వివాదాస్పద భాగంగా సూచిస్తుంది. కాబట్టి వచనాన్ని అనువదిస్తూ ప్రతుల సాక్ష్యంలోని ఉద్రిక్తతను పాదసూచికలో నిలిపాం.
- issue: πρωῒ అనే పదం ‘లేచిన’ కార్యానికా లేక ‘కనిపించిన’ కార్యానికా అనుసంధానమవుతుంది
  choice: ‘లేచిన తరువాత’ అనే భాగాన్ని ముగించి, ‘తెల్లవారుజామున’ను కనిపించిన సమయంతో చదివేలా విరామచిహ్నాలు పెట్టడం
  alternative: ‘వారంలో మొదటి రోజు తెల్లవారుజామున లేచి’ అని చదవడం
  rationale: గ్రీకు పదక్రమం రెండవ అనుసంధానానికి కూడా అవకాశం ఇస్తుంది; అయితే అందించిన పరిశీలిత POB పాఠం మరియు దాని వాక్యనిర్మాణ నిర్ణయం మొదటి పఠనాన్ని అనుసరిస్తాయి. వచనార్థానికి మించిన సిద్ధాంత నిర్ణయాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. ‘ప్రత్యక్షమయ్యాడు’కు బదులు ‘కనిపించాడు’, ‘వెళ్లగొట్టాడు’ వంటి ప్రస్తుత వాడుక పదాలను ఎంచుకున్నాం; పాఠవిమర్శక సమాచారాన్ని సంక్షిప్త పాదసూచికలో ఉంచాం.
