  verdict: revise
  source_fidelity: The draft accurately renders the resurrection, early-morning timing, first appearance, Mary Magdalene, and the seven demons. However, the simple past “వెళ్లగొట్టాడు” does not adequately represent the Greek pluperfect ἐκβεβλήκει, which identifies the expulsion as already completed before this appearance.
  naturalness: The Telugu is clear and modern. “మగ్దల మరియకు” is understandable and natural enough in context. A small adjustment to the final clause makes the prior-time relationship explicit without making the sentence heavy.
  terminology: “దయ్యాలు” is a current, comprehensible rendering of δαιμόνια in this Gospel exorcism context. The textual-variant footnote is accurate, appropriately restrained, and correctly anchored.
  issues:
  - severity: medium
    issue: The pluperfect force of ἐκβεβλήκει is not expressed.
    rationale: “ఆమె నుండి ఆయన ఏడు దయ్యాలను వెళ్లగొట్టాడు” can be read simply as a past event alongside the main past verb. “అంతకుముందే” preserves the source’s indication that the casting out had occurred prior to the appearance.
