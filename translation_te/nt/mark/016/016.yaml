  text: ὁ πιστεύσας καὶ βαπτισθεὶς σωθήσεται, ὁ δὲ ἀπιστήσας κατακριθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/016.yaml
  text: The one who has believed and been baptized will be saved[b][a], but the one who has disbelieved will be condemned.
translation:
  language: te
  text: నమ్మి బాప్తిస్మం పొందినవాడు రక్షించబడతాడు[a]; కాని నమ్మనివాడు ఖండించబడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత వ్యావహారికంగా: “ఎవరైతే నమ్మి బాప్తిస్మం పొందుతారో వారు రక్షించబడతారు; కాని నమ్మని వారు ఖండించబడతారు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύσας
  choice: నమ్మి … పొందినవాడు
  rationale: నిర్దిష్ట ఉపపదంతో వచ్చిన భూతకాల అసమాపక క్రియ నామవాచకంగా పనిచేసి, ఆ క్రియచేత గుర్తించబడే వ్యక్తిని సూచిస్తుంది. ‘నమ్మి … పొందినవాడు’ అనే రూపం ఏకవచన ప్రతినిధి భావాన్ని, రాబోయే ఫలితానికి ముందున్న చర్యను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: βαπτισθεὶς
  choice: బాప్తిస్మం పొందినవాడు
  rationale: భూతకాల కర్మణి అసమాపక క్రియను తెలుగులో సహజంగా కర్మణి భావంతో వ్యక్తం చేస్తుంది; బాప్తిస్మం ఆ వ్యక్తి స్వయంగా చేసుకున్న చర్యగా కాక, పొందినదిగా చూపుతుంది.
- source_word: σωθήσεται
  choice: రక్షించబడతాడు
  rationale: ఈ సందర్భంలో σῴζω రక్షణ సంబంధమైన అర్థాన్ని కలిగి ఉంది. ‘రక్షించబడతాడు’ భవిష్యత్ కర్మణి రూపాన్ని, అదనపు సిద్ధాంత వివరణ లేకుండా, నేరుగా తెలియజేస్తుంది.
- source_word: ὁ δὲ ἀπιστήσας
  choice: కాని నమ్మని వాడు
  rationale: ἀπιστέω, πιστεύωకు వ్యతిరేక భావం. ‘నమ్మని వాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, వ్యతిరేకతను స్పష్టంగా ఉంచుతుంది; గ్రీకు భూతకాల అసమాపక క్రియకు దగ్గరైన ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: κατακριθήσεται
  choice: దోషిగా తీర్పు పొందుతాడు
  rationale: κατακρίνω ఇక్కడ ప్రతికూల న్యాయతీర్పును సూచిస్తుంది. ఈ పదబంధం కేవలం శిక్షను కాక, దోషిగా నిర్ధారించే తీర్పును వ్యక్తం చేస్తుంది.
- source_word: καὶ
  choice: -ి … పొందినవాడు
  rationale: గ్రీకులోని ‘మరియు’ కలిపే పనిని తెలుగులో వరుస క్రియలను సహజంగా కలిపే ‘నమ్మి … పొందినవాడు’ నిర్మాణం నెరవేరుస్తుంది.
- source_word: δὲ
  choice: కాని
  rationale: మొదటి ఫలితానికి రెండవ ఫలితాన్ని వ్యతిరేకంగా నిలిపే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: నమ్మకానికి, బాప్తిస్మానికి, రక్షణకు మధ్య సంబంధం
  choice: నమ్మడం, బాప్తిస్మం పొందడం రెండింటినీ రక్షించబడే వ్యక్తి యొక్క వివరణగా నేరుగా కలిపి అనువదించడం
  alternative: బాప్తిస్మాన్ని రక్షణకు స్పష్టమైన సాధనకారణంగా చూపడం; లేదా దాన్ని వాక్యానికి సంబంధంలేని అనుబంధంగా బలహీనపరచడం
  rationale: గ్రీకు మొదటి వాక్యభాగంలో నమ్మినవాడిని, బాప్తిస్మం పొందినవాడిని ఒకే వ్యక్తిగా వర్ణిస్తుంది. రెండవ వాక్యభాగం బాప్తిస్మం పొందనివాడిని అని కాక, నమ్మనివాడిని దోషిగా తీర్పు పొందేవాడిగా చెబుతుంది. అందువల్ల అనువాదం ఈ ఉద్వేగాన్ని పరిష్కరించకుండా యథాతథంగా ఉంచుతుంది.
- issue: ప్రతినిధి ఏకవచన పుంలింగ నిర్మాణం
  choice: ‘…వాడు’ అనే ప్రతినిధి ఏకవచన రూపాన్ని ఉపయోగించడం
  alternative: ‘నమ్మినవారు … నమ్మనివారు’ అనే బహువచనం లేదా ‘ఎవరైతే’ అనే సాధారణీకరణ
  rationale: గ్రీకులోని నామవాచకంగా వాడిన అసమాపక క్రియలు పుంలింగ ఏకవచనంలో ఉన్నప్పటికీ సాధారణ మానవ సూచన కలిగినవి. తెలుగు ‘వాడు’ మూలంలోని ప్రతినిధి ఏకవచనాన్ని నిలుపుతుంది; ఇది పురుషులకు మాత్రమే పరిమితం చేసే ఉద్దేశంతో కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘బాప్తిస్మం’ సాధారణ తెలుగు క్రైస్తవ వాడుకలో స్థిరపడిన పదం. ప్రధాన పాఠంలో మూలంలోని ఏకవచనం, కర్మణి భావం, రెండు వాక్యభాగాల మధ్య వ్యతిరేకత నిలుపబడ్డాయి.
