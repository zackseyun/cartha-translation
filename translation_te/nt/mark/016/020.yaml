revisions:
- from: వారు బయలుదేరి వెళ్లి ప్రతిచోటా ప్రకటించారు. ప్రభువు వారితో కలిసి పనిచేస్తూ, వెంట వచ్చిన సూచక క్రియల ద్వారా ఆ సందేశాన్ని[a] ధృవపరిచాడు.[b]
  to: వారు బయలుదేరి వెళ్లి ప్రతిచోటా ప్రకటించారు. ప్రభువు వారితో కలిసి పనిచేస్తూ, తోడుగా వచ్చిన సూచక క్రియల[b] ద్వారా సందేశాన్ని[a] ధృవపరుస్తూ ఉన్నాడు.
