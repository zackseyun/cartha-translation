id: MRK.16.20
reference: Mark 16:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐκεῖνοι δὲ ἐξελθόντες ἐκήρυξαν πανταχοῦ, τοῦ κυρίου συνεργοῦντος καὶ τὸν λόγον βεβαιοῦντος διὰ τῶν ἐπακολουθούντων ⸀σημείων.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/020.yaml
  text: And they went out and proclaimed everywhere[b][a], while the Lord worked with them and confirmed the message through the accompanying signs.
translation:
  language: te
  text: వారు బయలుదేరి వెళ్లి ప్రతిచోటా ప్రకటించారు. ప్రభువు వారితో కలిసి పనిచేస్తూ, తోడుగా వచ్చిన సూచక క్రియల[b] ద్వారా సందేశాన్ని[a] ధృవపరుస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాక్యాన్ని.” ఇక్కడ గ్రీకు λόγος ప్రకటించబడిన సందేశాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “తోడుగా వచ్చిన సూచక క్రియలు” అనే మాటను “వెంట వచ్చిన సూచక క్రియలు” లేదా “అనుసరించిన సూచక క్రియలు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοι
  choice: వారు
  rationale: ముందు ప్రస్తావించిన శిష్యుల సమూహాన్ని సహజమైన తెలుగు సర్వనామంతో సూచిస్తుంది.
- source_word: ἐξελθόντες
  choice: బయలుదేరి వెళ్లి
  rationale: అయోరిస్టు కృదంతాన్ని కథనంలో ప్రధాన క్రియకు అనుబంధ చర్యగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκήρυξαν
  choice: ప్రకటించారు
  rationale: κηρύσσωలోని బహిరంగ ప్రకటన భావాన్ని సంఘపరమైన సంకుచిత అర్థం లేకుండా అందిస్తుంది.
- source_word: πανταχοῦ
  choice: ప్రతిచోటా
  rationale: ‘అన్నిచోట్లా/ప్రతిచోటా’ అనే విస్తృత భావాన్ని సరళంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τοῦ κυρίου
  choice: ప్రభువు
  rationale: κύριος అనే బిరుదుకు స్థిరమైన, గౌరవప్రదమైన తెలుగు రూపం; సమీప సందర్భంలో యేసును సూచిస్తుంది.
- source_word: συνεργοῦντος
  choice: వారితో కలిసి పనిచేస్తూ
  rationale: సహకార లేదా ఉమ్మడి కార్య భావాన్ని, ప్రధాన చర్యతో సమకాలీనతను నిలుపుతుంది.
- source_word: τὸν λόγον
  choice: ఆ సందేశాన్ని
  rationale: ఇక్కడ λόγος ప్రకటించబడిన విషయాన్ని సూచిస్తుంది; ‘సందేశం’ ఆధునిక పాఠకుడికి స్పష్టంగా ఉంటుంది, అయితే ‘వాక్యం’ అనే ప్రత్యామ్నాయం పాదటిప్పణిలో నిలుపబడింది.
- source_word: βεβαιοῦντος
  choice: ధృవపరిచాడు
  rationale: ప్రకటించిన సందేశానికి దైవిక నిర్ధారణ లేదా ప్రామాణికత కల్పించడాన్ని వ్యక్తం చేస్తుంది.
- source_word: διὰ τῶν ἐπακολουθούντων σημείων
  choice: వెంట వచ్చిన సూచక క్రియల ద్వారా
  rationale: διά యొక్క సాధనార్థాన్ని ‘ద్వారా’తో, ἐπακολουθούντων యొక్క ‘వెంట రావడం/అనుసరించడం’ భావాన్ని అనవసరంగా దేనికి వెంట వచ్చాయో నిర్ణయించకుండా నిలుపుతుంది.
theological_decisions:
- issue: ‘ప్రభువు’ ఎవరిని సూచిస్తుంది
  choice: బిరుదును ‘ప్రభువు’గానే ఉంచి, సమీప సందర్భంలో పునరుత్థానుడైన యేసును సూచించేలా అనువదించడం
  alternative: దేవుణ్ణి సాధారణంగా సూచిస్తుందని గ్రహించడం
  rationale: మార్కు 16:19లో ‘ప్రభువు’ యేసును సూచిస్తుంది; అయినా మూలంలోని బిరుదుకు మించి పేరును వచనంలో చేర్చలేదు.
- issue: సూచక క్రియల పాత్ర
  choice: అవి సందేశాన్ని ధృవపరచడానికి సాధనాలుగా పనిచేశాయని అనువదించడం
  alternative: ధృవీకరణ భావం లేకుండా అవి కేవలం వారి వెంట వచ్చాయని గ్రహించడం
  rationale: ‘సందేశాన్ని ధృవపరుస్తూ ... సూచక క్రియల ద్వారా’ అనే వాక్యనిర్మాణం వాటి ధృవీకరణ పాత్రను స్పష్టంగా కలుపుతుంది; వాటి కొనసాగింపు లేదా నేటి ప్రమాణత్వం గురించి వచనం చెప్పనిదాన్ని చేర్చదు.
- issue: ἐπακολουθούντων దేనిని అనుసరిస్తుంది
  choice: తెలుగులో ‘వెంట వచ్చిన’ అని ఉంచి సంబంధాన్ని ఉద్దేశపూర్వకంగా నిర్దిష్టం చేయకపోవడం
  alternative: ‘సందేశం వెంట వచ్చిన’ లేదా ‘వారి వెంట వచ్చిన’ అని స్పష్టీకరించడం
  rationale: గ్రీకు రూపం సూచక క్రియలను ‘వెంట వచ్చినవి/తోడుగా ఉన్నవి’గా వర్ణిస్తుంది గాని, తెలుగు అనువాదంలో ఒకే నిర్దిష్ట సంబంధాన్ని బలవంతంగా పెట్టనవసరం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. పొడవైన గ్రీకు వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి, సంబంధాలను స్పష్టంగా ఉంచాం. [a], [b] గుర్తులు రెండూ ప్రధాన పాఠ్యంలో ఉన్నాయి.
