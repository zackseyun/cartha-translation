source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἰς τὸν κόσμον ἅπαντα κηρύξατε τὸ εὐαγγέλιον πάσῃ τῇ κτίσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/015.yaml
  text: And he said to them[b][a], “Go into all the world and proclaim the good news to all creation.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “మీరు ప్రపంచమంతటా వెళ్లి, సమస్త సృష్టికి[a] సువార్తను[b] ప్రకటించండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రతి ప్రాణికీ.” గ్రీకు పదబంధాన్ని సమష్టిగా “సమస్త సృష్టికి” అని లేదా విభజనాత్మకంగా “ప్రతి ప్రాణికీ” అని అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా “శుభవార్తను.” గ్రీకు εὐαγγέλιον అనే పదానికి అక్షరార్థం “శుభవార్త.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευθέντες
  choice: వెళ్లి
  rationale: ప్రధాన ఆజ్ఞకు ముందు ఉన్న ఈ భూతకాల అసమాపక క్రియ సందర్భంలో అనుబంధ ఆజ్ఞ భావాన్ని ఇస్తుంది. తెలుగు భాషలో ‘వెళ్లి ... ప్రకటించండి’ సహజంగా ఉండి, పంపింపు ఆజ్ఞ బలాన్ని నిలుపుతుంది.
- source_word: κόσμον ἅπαντα
  choice: లోకమంతటికి
  rationale: κόσμος ఇక్కడ సువార్త సేవ జరిగే మానవ లోకాన్ని సూచిస్తుంది; ἅπαντα దాని సంపూర్ణ పరిధిని బలపరుస్తుంది. ‘లోకమంతటికి’ ఆధునిక తెలుగులో సహజంగా ఉండి విశ్వవ్యాప్త పరిధిని తెలియజేస్తుంది.
- source_word: κηρύξατε
  choice: ప్రకటించండి
  rationale: κηρύσσω బహిరంగంగా, అధికారపూర్వకంగా చాటిచెప్పడాన్ని సూచిస్తుంది. ‘ప్రకటించండి’ ఆ భావాన్ని స్పష్టంగా అందిస్తూ, కేవలం సంఘ ప్రసంగానికి పరిమితమైన భావాన్ని నివారిస్తుంది.
- source_word: τὸ εὐαγγέλιον
  choice: సువార్తను
  rationale: εὐαγγέλιον అంటే శుభవార్త. ‘సువార్త’ ఆధునిక తెలుగు క్రైస్తవ వాడుకలో స్థిరపడినప్పటికీ దాని శుభవార్త భావాన్ని కూడా మోస్తుంది; గ్రీకు పదానికి సంక్షిప్తమైన, సహజమైన సమానార్థకం.
- source_word: πάσῃ τῇ κτίσει
  choice: సృష్టి అంతటికీ
  rationale: κτίσις అనే పదానికి ‘సృష్టి’ లేదా ‘సృష్టించబడిన జీవి’ అనే భావాలు ఉండవచ్చు. ‘సృష్టి అంతటికీ’ గ్రీకు పదబంధంలోని విస్తృతమైన, సమష్టి పరిధిని నిలుపుతుంది; విభజనాత్మక భావాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: εἶπεν αὐτοῖς
  choice: ఆయన వారితో ఇలా అన్నాడు
  rationale: సాధారణ కథన పరిచయాన్ని సహజ తెలుగులో అందిస్తుంది. ‘ఇలా’ తరువాత వచ్చే ప్రత్యక్ష ఉల్లేఖనాన్ని స్పష్టంగా కలుపుతుంది; మూలంలో లేని అదనపు వ్యాఖ్యాన బలాన్ని చేర్చదు.
theological_decisions:
- issue: పంపింపు వాక్యంలో πάσῃ τῇ κτίσει యొక్క పరిధి
  choice: ‘సృష్టి అంతటికీ’ అని విస్తృత, సమష్టి భావంతో అనువదించడం
  alternative: ‘ప్రతి సృష్ట ప్రాణికీ’ లేదా ‘ప్రతి జీవికీ’
  rationale: ఈ గ్రీకు పదబంధం సమష్టిగా ‘సృష్టి అంతటికీ’ అని లేదా విభజనాత్మకంగా ‘ప్రతి సృష్ట ప్రాణికీ’ అని అర్థమవవచ్చు. ప్రధాన అనువాదం దాని విశాల పరిధిని నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా అసలులోని సందిగ్ధతను పరిష్కరించకుండా సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. ‘లోకమంతటికి వెళ్లి’ అనే నిర్మాణం గ్రీకు అనుబంధ ఆజ్ఞ భావాన్ని తెలుగులో సులభంగా వ్యక్తం చేస్తుంది. ‘సృష్టి అంతటికీ’ అనే విస్తృత పదబంధం మూలంలోని ధార్మిక ఉద్రిక్తతను నిలుపుతుంది.
