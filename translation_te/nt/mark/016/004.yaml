review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the women looking up and recognizing that the stone was already rolled away. However, it omits the explicit explanatory connector γάρ ('for'), and 'చాలా పెద్దది' somewhat weakens σφόδρα ('extremely/very exceedingly').
  naturalness: The wording is generally natural modern Telugu. Recasting the final clause with 'ఎందుకంటే' makes the Greek explanatory relation clear and produces a smoother complete sentence.
  terminology: ‘రాయి’ is appropriate for λίθος, and ‘దొర్లించబడి ఉంది’ naturally represents the perfect passive resultant state. No theological terminology is involved.
  issues:
  - severity: medium
    issue: The explanatory force of γάρ is not translated.
    rationale: The semicolon merely juxtaposes the clauses; γάρ explicitly explains why the women could see the stone’s changed position, so a connector such as ‘ఎందుకంటే’ should be included.
  - severity: low
    issue: ‘చాలా పెద్దది’ modestly underrepresents σφόδρα.
    rationale: While acceptable in ordinary usage, ‘అత్యంత పెద్దది’ better retains the strong intensification without sounding unnatural.
  revised_text: వారు పైకి చూసి[a], ఆ రాయి దొర్లించబడి ఉందని గమనించారు; ఎందుకంటే అది అత్యంత పెద్దది.
