  yaml_path: translation/nt/mark/016/004.yaml
  text: And looking up[a], they saw that the stone had been rolled away, for it was extremely large.
translation:
  language: te
  text: వారు పైకి చూసి[a], ఆ రాయి దొర్లించబడి ఉందని గమనించారు; ఎందుకంటే అది అత్యంత పెద్దది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు పైకి చూసినప్పుడు, ఆ రాయి దొర్లించబడి ఉందని చూశారు.’ గ్రీకు పరిపూర్ణ క్రియ, వారు చూసే సమయానికే రాయి దొర్లించబడిన స్థితిలో ఉందని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβλέψασαι
  choice: పైకి చూసి
  rationale: సమాధి వైపు చూపు పైకెత్తిన చర్యను సహజమైన ఆధునిక తెలుగులో, కృదంత భావాన్ని నిలుపుతూ వ్యక్తపరుస్తుంది.
- source_word: θεωροῦσιν
  choice: గమనించారు
  rationale: θεωρέω ఇక్కడ కేవలం చూడడమే కాక, కనిపించిన స్థితిని గుర్తించడాన్ని సూచిస్తుంది; కథన సందర్భానికి ‘గమనించారు’ సహజంగా సరిపోతుంది.
- source_word: ὅτι
  choice: ఉండడం
  rationale: వారు గమనించిన విషయాన్ని తెలుగులో సహజంగా కర్మనామ రూపంతో అనుసంధానిస్తుంది.
- source_word: ἀποκεκύλισται
  choice: దొర్లించబడి ఉండడం
  rationale: పరిపూర్ణ కర్మణి రూపం గతంలో జరిగిన చర్యతో ఏర్పడి అప్పటికీ కొనసాగుతున్న స్థితిని సూచిస్తుంది; ఈ తెలుగు రూపం ఆ ఫలితస్థితిని నిలుపుతుంది.
- source_word: ὁ λίθος
  choice: ఆ రాయి
  rationale: ముందు ప్రస్తావించిన సమాధి ప్రవేశద్వారపు నిర్దిష్ట రాయిని సూచించడానికి ‘ఆ రాయి’ సహజంగా ఉంటుంది; ‘సమాధి రాయి’ అని మూలంలో లేని వివరణను జోడించలేదు.
- source_word: ἦν γὰρ μέγας σφόδρα
  choice: అది చాలా పెద్దది
  rationale: σφόδρα యొక్క బలమైన తీవ్రతను ‘చాలా’ ద్వారా సహజంగా తెలియజేస్తుంది; γάρ ఇచ్చే వివరణాత్మక సంబంధాన్ని విరామచిహ్నంతో ప్రవాహబద్ధంగా ఉంచింది.
- source_word: καὶ
  choice: వారు
  rationale: తెలుగు కథనంలో వాక్యారంభ ‘మరియు’ అసహజంగా ఉండటంతో ప్రత్యక్ష పదసమానాన్ని పెట్టకుండా నిరంతర కథన ప్రవాహంలో విషయాన్ని స్పష్టంగా తెలిపింది.
