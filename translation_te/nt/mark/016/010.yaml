  text: ἐκείνη πορευθεῖσα ἀπήγγειλεν τοῖς μετ’ αὐτοῦ γενομένοις πενθοῦσι καὶ κλαίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/010.yaml
  text: She went and reported it to those who had been with him[a], who were mourning and weeping.
translation:
  language: te
  text: ఆయనతో ఉండినవారు దుఃఖిస్తూ ఏడుస్తుండగా, ఆమె వెళ్లి వారికి ఈ సంగతి తెలియజేసింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఈ సంగతి తెలియజేసింది’ లేదా ‘వారికి చెప్పింది.’ గ్రీకు వాక్యంలో చెప్పబడిన సంగతి ప్రత్యక్ష కర్మగా లేదు; ముందరి వచనంలోని సందర్భం ద్వారా అది అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνη
  choice: ఆమె
  rationale: ఈ సూచన సర్వనామం ముందరి వచనంలోని మగ్దలేని మరియను సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఆమె’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: πορευθεῖσα
  choice: వెళ్లి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచించే ఈ భూతకాల అసమాపక క్రియారూపాన్ని తెలుగులో సహజమైన క్రమబోధక రూపమైన ‘వెళ్లి’గా అనువదించాం.
- source_word: ἀπήγγειλεν
  choice: తెలియజేసింది
  rationale: ἀπαγγέλλω ఒక వార్తను లేదా సమాచారాన్ని చేరవేయడాన్ని సూచిస్తుంది. గ్రీకులో కర్మ ప్రత్యక్షంగా లేకపోయినా, ముందరి వచనంలోని దర్శనవార్త సందర్భం ద్వారా అర్థమవుతుంది; అందుకే తెలుగులో ‘ఈ సంగతి’ చేర్చాం.
- source_word: τοῖς μετ’ αὐτοῦ γενομένοις
  choice: ఆయనతో ఉండినవారికి
  rationale: ఈ పదబంధం యేసుతో కలిసి ఉన్న సమూహాన్ని గుర్తిస్తుంది. ‘ఆయనతో ఉండినవారు’ మూలంలోని విస్తృత భావాన్ని కాపాడుతుంది; ‘శిష్యులు’ లేదా ‘సహచరులు’ అని మరింత నిర్దిష్టం చేయదు.
- source_word: πενθοῦσι καὶ κλαίουσιν
  choice: దుఃఖిస్తూ ఏడుస్తుండగా
  rationale: రెండు వర్తమాన అసమాపక క్రియలు ఆ వ్యక్తులు అదే సమయంలో దుఃఖిస్తూ ఏడుస్తున్న స్థితిని తెలియజేస్తాయి. ఈ తెలుగు రూపం ఆ సమకాలీన పరిస్థితిని సహజంగా వ్యక్తం చేస్తుంది.
