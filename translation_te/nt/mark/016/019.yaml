review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the passive ascent (ἀνελήμφθη), destination (εἰς τὸν οὐρανόν), and enthronement idiom (ἐκ δεξιῶν τοῦ θεοῦ). However, “ఎత్తబడినవాడై” is an awkward participial construction and weakens the Greek’s coordinated finite aorist actions. Recasting it as “ఎత్తబడాడు” preserves the passive clearly and naturally.
  naturalness: “ఎత్తబడినవాడై” is not idiomatic modern standard Telugu in this sentence. Two coordinated finite verbs, joined by “మరియు,” give a clear, fluent rendering. “వారితో మాట్లాడిన తరువాత” is natural Telugu for the context, though the Greek specifically marks them as the addressees.
  terminology: “ప్రభువైన యేసు,” “పరలోకం,” and “దేవుని కుడివైపున” are appropriate, established Telugu biblical terminology. The footnote appropriately signals the significant textual uncertainty surrounding Mark 16:9–20 without making claims beyond the manuscript evidence.
  issues:
  - severity: medium
    issue: Awkward participial rendering of ἀνελήμφθη
    rationale: “పరలోకానికి ఎత్తబడినవాడై, దేవుని కుడివైపున కూర్చున్నాడు” uses a descriptive participial form where the Greek has a finite passive aorist followed by a finite active aorist. “ఎత్తబడాడు” is both more natural and more structurally faithful.
  revised_text: కాబట్టి ప్రభువైన యేసు వారితో మాట్లాడిన తరువాత పరలోకానికి ఎత్తబడాడు మరియు దేవుని కుడివైపున కూర్చున్నాడు.[a]
