id: MRK.16.19
reference: Mark 16:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁ μὲν οὖν κύριος ⸀Ἰησοῦς μετὰ τὸ λαλῆσαι αὐτοῖς ἀνελήμφθη εἰς τὸν οὐρανὸν καὶ ἐκάθισεν ἐκ δεξιῶν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/019.yaml
  text: So then, the Lord Jesus, after speaking to them, was taken up into heaven and sat down at the right hand of God.
translation:
  language: te
  text: కాబట్టి ప్రభువైన యేసు వారితో మాట్లాడిన తరువాత పరలోకానికి ఎత్తబడాడు మరియు దేవుని కుడివైపున కూర్చున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మార్కు 16:9–20 అనేక తరువాతి గ్రీకు ప్రతులలో ఉంది; అయితే అత్యంత ప్రాచీనమైన కొన్ని ముఖ్య ప్రతులలో లేదు. కొన్ని ప్రతులు మార్కు సువార్తకు వేరే ముగింపులను కలిగి ఉన్నాయి.
    reason: ఈ వచనం దీర్ఘ ముగింపులో భాగం. దాని పాఠ్య చరిత్రకు సంబంధించిన నిజమైన అనిశ్చితిని పాఠకుడికి తెలియజేయాలి.
lexical_decisions:
- source_word: μὲν οὖν
  choice: కాబట్టి
  rationale: ఈ కణసముదాయం మునుపటి మాటల నుంచి ముగింపు వైపు సాగే భావాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘కాబట్టి’ దాని అన్వయ, పరివర్తన బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: κύριος Ἰησοῦς
  choice: ప్రభువైన యేసు
  rationale: κύριος అనే క్రీస్తుసంబంధ బిరుదును ‘ప్రభువు’గా నిలుపుతూ, తెలుగు వాక్యంలో వ్యక్తినామంతో సహజంగా కలిసేందుకు ‘ప్రభువైన యేసు’ అని అనువదించబడింది.
- source_word: μετὰ τὸ λαλῆσαι αὐτοῖς
  choice: వారితో మాట్లాడిన తర్వాత
  rationale: μετά + articular infinitive తెలిపే కాలక్రమాన్ని ‘తర్వాత’ స్పష్టంగా ఉంచుతుంది. αὐτοῖς సందర్భంలో సంభాషణకు సంబంధించినవారు కావడంతో ‘వారితో’ సహజమైన తెలుగు ప్రయోగం.
- source_word: ἀνελήμφθη
  choice: ఎత్తబడినవాడై
  rationale: గ్రీకు క్రియలోని కర్మణి రూపాన్ని నిలుపుతుంది; ఎవరు ఎత్తారో వచనం స్పష్టంగా చెప్పనందున కర్తను అనువాదంలో చేర్చలేదు.
- source_word: εἰς τὸν οὐρανόν
  choice: పరలోకానికి
  rationale: గమ్యాన్ని సూచించే εἰς భావాన్ని తెలుగులో సహజమైన ‘-కి’ విభక్తితో వ్యక్తం చేస్తుంది; οὐρανός ఇక్కడ దేవుని లోకాన్ని సూచించే సందర్భంలో ‘పరలోకం’గా ఇవ్వబడింది.
- source_word: ἐκάθισεν
  choice: కూర్చున్నాడు
  rationale: కూర్చునే పూర్తయిన చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘ఆసీనుడయ్యాడు’ కంటే సాధారణ పాఠకులకు సులభం.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: దేవుని కుడివైపున
  rationale: ἐκ δεξιῶν అనే స్థిరమైన గ్రీకు నుడికారానికి అక్షరార్థమైన ‘నుండి’ కాకుండా స్థానాన్ని తెలిపే ‘కుడివైపున’ సరైన తెలుగు సమానం. ఇది గౌరవ, ఉన్నత స్థాన సూచనను అదనపు వ్యాఖ్యానం లేకుండా నిలుపుతుంది.
theological_decisions:
- issue: ఆరోహణలోని కర్మణి రూపం మరియు మహిమగల స్థానాన్ని అదనపు సిద్ధాంత వివరణ లేకుండా వ్యక్తం చేయడం
  choice: పరలోకానికి ఎత్తబడినవాడై, దేవుని కుడివైపున కూర్చున్నాడు
  alternative: పరలోకానికి చేర్చబడి, దేవుని కుడిచేతివద్ద ఆసీనుడయ్యాడు
  rationale: ఎత్తబడటం, కూర్చోవటం అనే మూలపాఠ చర్యలను నేరుగా నిలుపుతుంది. ఎత్తిన కర్తను పేర్కొనదు; ‘కుడివైపు’ అనే బైబిలీయ ఉన్నతస్థాన నుడికారానికి వ్యాఖ్యానాన్ని జోడించదు.
- issue: κύριοςను క్రీస్తుసంబంధ బిరుదుగా అనువదించడం
  choice: ప్రభువైన యేసు
  alternative: యజమానుడైన యేసు
  rationale: ‘ప్రభువు’ నూతన నిబంధనలో ఈ బిరుదుకు సాధారణమైన, గౌరవభరితమైన తెలుగు రూపం; ‘యజమాని’ అని ఇస్తే దాని భావం కేవలం సామాజిక సంబంధానికి పరిమితమయ్యే ప్రమాదం ఉంది.
- issue: మార్కు 16:9–20 పాఠ్య చరిత్రను పాఠకుడికి తెలియజేయడం
  choice: ప్రధాన వచనాన్ని అనువదించి పాఠ్య గమనికను జోడించడం
  alternative: గమనిక లేకుండా వచనాన్ని మాత్రమే ముద్రించడం
  rationale: ఈ వాక్యం అందించిన SBLGNT పాఠ్యంలో ఉన్నప్పటికీ, మార్కు సువార్త దీర్ఘ ముగింపు ప్రాచీన ప్రతులలో సమానంగా లభించదు. వచనాన్ని తొలగించకుండా, పాఠ్య సాక్ష్యంలోని ముఖ్యమైన అనిశ్చితిని పారదర్శకంగా తెలియజేయడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనా సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘ఆసీనుడయ్యాడు’ వంటి అధిక సాంప్రదాయ పదజాలం బదులు ‘కూర్చున్నాడు’ వాడబడింది; ‘దేవుని కుడివైపున’ అనే బైబిలీయ నుడికారం నిలుపబడింది.
