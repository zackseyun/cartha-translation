revisions:
- from: కాబట్టి ప్రభువైన యేసు వారితో మాట్లాడిన తర్వాత పరలోకానికి ఎత్తబడినవాడై, దేవుని కుడివైపున కూర్చున్నాడు.[a]
  to: కాబట్టి ప్రభువైన యేసు వారితో మాట్లాడిన తరువాత పరలోకానికి ఎత్తబడాడు మరియు దేవుని కుడివైపున కూర్చున్నాడు.[a]
  rationale: The revision replaces the unnatural participial phrase with the finite passive verb “ఎత్తబడాడు,” thereby retaining the unspecified-agent passive force of ἀνελήμφθη and matching the Greek sequence of two completed actions. The established terms and the textual-critical footnote are retained.
