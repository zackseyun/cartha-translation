reference: Mark 16:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ ὑπάγετε εἴπατε τοῖς μαθηταῖς αὐτοῦ καὶ τῷ Πέτρῳ ὅτι Προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν· ἐκεῖ αὐτὸν ὄψεσθε, καθὼς εἶπεν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/007.yaml
  text: But go[a], tell his disciples and Peter, ‘He is going ahead of you into Galilee. There you will see him[b], just as he told you.’
translation:
  language: te
  text: 'కాని మీరు వెళ్లి, ఆయన శిష్యులకూ పేతురుకూ[a] ఇలా చెప్పండి: “ఆయన మీకంటే ముందుగా గలిలయకు వెళ్తున్నాడు.[b] అక్కడ మీరు ఆయనను చూస్తారు, ఆయన మీతో చెప్పినట్టే.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పేతురును ‘ఆయన శిష్యులు’ అనే ప్రస్తావనతో పాటు విడిగా పేర్కొన్నారు. ఇది యేసును ఎరుగనని అతడు నిరాకరించిన తరువాత అతని పునరుద్ధరణను సూచించవచ్చు; అయితే గ్రీకు పాఠం ‘ముఖ్యంగా పేతురుకు’ అని స్పష్టంగా చెప్పదు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘గలిలయలోనికి.’ ఇక్కడ గ్రీకు ఉపసర్గను ‘కు’ లేదా ‘లోనికి’ అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: కాని
  rationale: మునుపటి పరిస్థితికి భిన్నంగా ఇప్పుడు చేయవలసిన కార్యాన్ని సూచించే బలమైన వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὑπάγετε
  choice: మీరు వెళ్లి
  rationale: బహువచన ఆజ్ఞ యొక్క తక్షణ కార్యబలాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: εἴπατε
  choice: ఇలా చెప్పండి
  rationale: దత్తివాచక గ్రహీతల తరువాత వచ్చే సందేశవిషయాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: τοῖς μαθηταῖς αὐτοῦ καὶ τῷ Πέτρῳ
  choice: ఆయన శిష్యులతోనూ పేతురుతోనూ
  rationale: పేతురును విడిగా పేర్కొన్న గ్రీకు సమన్వయ నిర్మాణాన్ని ‘ముఖ్యంగా’ లేదా ‘సహా’ అని వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: Προάγει ὑμᾶς
  choice: ఆయన మీకంటే ముందుగా ... వెళ్తున్నాడు
  rationale: యేసు వారి కంటే ముందు వెళ్లే దిశాత్మక భావాన్ని, వర్తమాన క్రియారూపాన్ని సహజంగా కాపాడుతుంది.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: గలిలయకు
  rationale: εἰς ఈ సందర్భంలో గమ్యాన్ని సూచిస్తుంది; తెలుగులో ‘గలిలయకు’ సహజమైనది. ‘గలిలయలోనికి’ కూడా సాధ్యమే గాని ఇక్కడ భారంగా ఉంటుంది.
- source_word: ἐκεῖ αὐτὸν ὄψεσθε
  choice: అక్కడ మీరు ఆయనను చూస్తారు
  rationale: స్థలసూచక అవ్యయాన్నీ భవిష్యత్ దర్శనాన్నీ నేరుగా, స్పష్టంగా అందిస్తుంది.
- source_word: καθὼς εἶπεν ὑμῖν
  choice: ఆయన మీతో చెప్పినట్టే
  rationale: యేసు ఇంతకుముందు చెప్పిన మాటకు ఈ సంఘటన సరిపోలుతుందని తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ఆయన శిష్యులు’ తరువాత పేతురును విడిగా పేర్కొనడం
  choice: ‘ఆయన శిష్యులతోనూ పేతురుతోనూ’ అనే సరళ సమన్వయాన్ని నిలుపడం
  alternative: ‘ఆయన శిష్యులతో, ముఖ్యంగా పేతురుతో’ లేదా ‘పేతురుతో సహా ఆయన శిష్యులతో’
  rationale: గ్రీకు పాఠం పేతురును ప్రత్యేకంగా పేరుపెడుతుంది; అయితే ‘ముఖ్యంగా’ అనీ, అతన్ని శిష్యులలో చేర్చడమే ఉద్దేశమనీ స్పష్టంగా చెప్పదు. కాబట్టి పునరుద్ధరణ వంటి సాధ్యమైన కథనార్థాన్ని ప్రధాన పాఠంలో నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ప్రత్యక్ష సందేశాన్ని ఉద్ధరణ చిహ్నాలతో చూపించి, గ్రీకు వాక్యంలోని సంక్షిప్తతను కాపాడాం. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోతుంది.
