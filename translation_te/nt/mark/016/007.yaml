revisions:
- from: 'కాని మీరు వెళ్లి, ఆయన శిష్యులతోనూ పేతురుతోనూ ఇలా చెప్పండి: “ఆయన మీకంటే ముందుగా గలిలయకు వెళ్తున్నాడు.[a] ఆయన మీతో చెప్పినట్టే, అక్కడ మీరు ఆయనను చూస్తారు.”'
  to: 'కాని మీరు వెళ్లి, ఆయన శిష్యులకూ పేతురుకూ[a] ఇలా చెప్పండి: “ఆయన మీకంటే ముందుగా గలిలయకు వెళ్తున్నాడు.[b] అక్కడ మీరు ఆయనను చూస్తారు, ఆయన మీతో చెప్పినట్టే.”'
  rationale: The principal correction changes the recipient marking from ‘తో’ to ‘కు,’ thereby preserving the Greek dative syntax and avoiding an unintended accompaniment meaning. Footnote a retains the source’s cautious, non-doctrinal observation about Peter’s separate mention. Footnote b supplies the documented lexical alternative for εἰς without altering the natural main-text rendering.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:15:35Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the contrast, the two imperatives, Jesus’ going ahead of the disciples to Galilee, their future seeing him there, and the correspondence with his prior statement. However, ‘ఆయన శిష్యులతోనూ పేతురుతోనూ ... చెప్పండి’ can mean ‘say [it] together with his disciples and Peter,’ rather than marking them as the recipients of the message. The Greek datives require ‘to his disciples and to Peter.’
  naturalness: The revised wording uses the ordinary Telugu recipient construction ‘శిష్యులకూ పేతురుకూ చెప్పండి.’ The remaining phrasing is modern, clear, and suitably reverent without being artificially formal.
  terminology: ‘శిష్యులు,’ ‘పేతురు,’ and ‘గలిలయ’ are appropriate established forms. The separate mention of Peter is retained without adding ‘especially’ or ‘including.’
  issues:
  - severity: medium
    issue: Recipient relation is ambiguous in ‘శిష్యులతోనూ పేతురుతోనూ ఇలా చెప్పండి.’
    rationale: With ‘చెప్పండి,’ the postposition ‘తో’ normally suggests accompaniment (‘say together with’), whereas τοῖς μαθηταῖς ... καὶ τῷ Πέτρῳ identifies the persons to whom the message is to be given. ‘కు’ correctly renders the dative recipients.
  - severity: low
    issue: The lexical alternative represented by English footnote b is absent from the Telugu footnote set.
    rationale: ‘గలిలయకు’ is a sound main-text rendering of εἰς τὴν Γαλιλαίαν, but a footnote can preserve the viable, more literal directional alternative ‘గలిలయలోనికి’ and maintain the audit-trail anchor coverage.
  revised_text: 'కాని మీరు వెళ్లి, ఆయన శిష్యులకూ పేతురుకూ[a] ఇలా చెప్పండి: “ఆయన మీకంటే ముందుగా గలిలయకు వెళ్తున్నాడు.[b] అక్కడ మీరు ఆయనను చూస్తారు, ఆయన మీతో చెప్పినట్టే.”'
