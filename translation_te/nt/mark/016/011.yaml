  text: κἀκεῖνοι ἀκούσαντες ὅτι ζῇ καὶ ἐθεάθη ὑπ’ αὐτῆς ἠπίστησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/011.yaml
  text: And they[a], when they heard that he was alive and had been seen by her[b], did not believe.
translation:
  language: te
  text: వారు కూడా ఆయన బతికి ఉన్నాడని[a], ఆమె ఆయనను చూసిందని[b] విన్నప్పుడు నమ్మలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన జీవిస్తున్నాడని.’ గ్రీకులో వర్తమానకాల క్రియ ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఆయన ఆమెచేత చూడబడ్డాడని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: వారు కూడా
  rationale: καί + ἐκεῖνοι ముందటి వాక్యంతో కథన సంబంధాన్ని కొనసాగిస్తూ, ఇప్పుడే ప్రస్తావించిన వారిని సూచిస్తుంది. ‘వారు కూడా’ ఈ రెండు భావాలనూ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀκούσαντες
  choice: విన్నప్పుడు
  rationale: ఇక్కడ భూతకాల కృదంతం కాలసంబంధమైన అర్థాన్ని ఇస్తుంది; ‘విన్నప్పుడు’ సంఘటనల క్రమాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ὅτι
  choice: అని
  rationale: వారు విన్న సమాచారంలోని విషయాన్ని పరిచయం చేసే సహజమైన తెలుగు పరోక్ష వాక్యరూపం.
- source_word: ζῇ
  choice: బతికి ఉన్నాడని
  rationale: వర్తమానకాల క్రియ యేసు మరణానంతరం జీవించి ఉన్నాడనే కొనసాగుతున్న స్థితిని సూచిస్తుంది. ‘బతికి ఉన్నాడు’ సాధారణ పాఠకులకు సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: καὶ
  choice: -ని, ... -ని
  rationale: తెలుగు సముచ్చయ నిర్మాణంలో రెండు పరోక్ష సమాచార అంశాలను ‘అని/నీ’ రూపాలతో సమన్వయపరచడం సహజం; మూలంలోని రెండు విషయాల అనుసంధానం నిలుస్తుంది.
- source_word: ἐθεάθη
  choice: ఆమె ... చూసిందని
  rationale: గ్రీకు భూతకాల కర్మణి రూపం అక్షరార్థంగా ‘ఆమెచేత చూడబడ్డాడు.’ తెలుగులో ఆ కర్మణి నిర్మాణం కృత్రిమంగా ఉండటంతో, అర్థాన్ని మార్చకుండా సహజమైన కర్తరి రూపం వాడబడింది; కర్మణి రూపం పాదసూచికలో తెలియజేయబడింది.
- source_word: ὑπ’ αὐτῆς
  choice: ఆమె
  rationale: సర్వనామం ముందటి సందర్భంలోని స్త్రీని సూచిస్తుంది. ఈ వచనంలో లేని ‘మరియ’ అనే పేరును చేర్చకుండా మూలంలోని సర్వనామాన్ని నిలుపుతుంది.
- source_word: ἠπίστησαν
  choice: నమ్మలేదు
  rationale: విన్న సమాచారాన్ని వారు విశ్వసించలేదనే అర్థాన్ని అదనపు ఉద్దేశపూర్వక నిరాకరణ భావం చేర్చకుండా నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: పునరుత్థానానంతర జీవాన్ని తెలిపే వర్తమానకాల వ్యక్తీకరణ
  choice: ఆయన బతికి ఉన్నాడని
  alternative: ఆయన జీవిస్తున్నాడని
  rationale: ζῇ వర్తమానకాలంలో ఉండి యేసు జీవించి ఉన్నాడని తెలియజేస్తుంది. తెలుగు పరోక్ష వాక్యంలో ‘బతికి ఉన్నాడు’ కొనసాగుతున్న జీవస్థితిని సహజంగా వ్యక్తం చేస్తుంది; ‘జీవిస్తున్నాడు’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- issue: ἐθεάθη కర్మణి రూపంలోని దృష్టికోణం
  choice: ఆమె ఆయనను చూసిందని
  alternative: ఆయన ఆమెచేత చూడబడ్డాడని
  rationale: మూలంలోని కర్మణి రూపం ఆయన ప్రత్యక్షమయ్యాడని తప్పనిసరిగా నిర్దేశించదు; అది ఆమె ఆయనను చూసిందనే విషయాన్ని చెబుతుంది. సహజ తెలుగు కోసం కర్తరి రూపం వాడి, అక్షరార్థ కర్మణి రూపాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. కృత్రిమమైన కర్మణి నిర్మాణాన్ని ప్రధాన వాక్యంలో నివారించి, మూలరూపాన్ని పాదసూచికలో పారదర్శకంగా నమోదు చేశాం.
