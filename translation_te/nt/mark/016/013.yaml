  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κἀκεῖνοι ἀπελθόντες ἀπήγγειλαν τοῖς λοιποῖς· οὐδὲ ἐκείνοις ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/013.yaml
  text: And they went away and reported it to the rest[a], but they did not believe them either.
translation:
  language: te
  text: వారు వెళ్లి మిగిలినవారికి[a] ఆ సంగతి తెలియజేశారు. అయితే మిగిలినవారు వీరిని కూడా నమ్మలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇతరులకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: వారు
  rationale: καί + ἐκεῖνοι అనే సంయుక్త రూపం ‘వారు కూడా/ఆ వారూ’ అనే భావాన్ని ఇస్తుంది. సందర్భంలో ఇద్దరు శిష్యులే సూచింపబడుతున్నందున సహజమైన తెలుగులో ‘వారు’ అని అనువదించాం; మూలంలో లేని ‘పురుషులు’ అనే పదాన్ని చేర్చలేదు.
- source_word: ἀπελθόντες
  choice: వెళ్లి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన వెళ్లడాన్ని సూచించే ఏఒరిస్ట్ కృదంతాన్ని తెలుగులో సహజమైన పూర్వకాలిక క్రియారూపమైన ‘వెళ్లి’తో వ్యక్తం చేశాం.
- source_word: ἀπήγγειλαν
  choice: తెలియజేశారు
  rationale: ἀπαγγέλλω ఇక్కడ తాము తెలుసుకున్న సంగతిని ఇతరులకు నివేదించడం లేదా చెప్పడం అనే భావంలో ఉంది. ‘తెలియజేశారు’ గౌరవప్రదమైన ఆధునిక తెలుగు కథనశైలికి సరిపోతుంది.
- source_word: τοῖς λοιποῖς
  choice: మిగిలినవారికి
  rationale: λοιπός సందర్భంలోని మిగతా సమూహ సభ్యులను సూచిస్తుంది. ‘మిగిలినవారికి’ మూలార్థాన్ని స్పష్టంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: οὐδὲ
  choice: కూడా … నమ్మలేదు
  rationale: οὐδέ ముందటి అవిశ్వాస ఘటనకు దీనిని జోడిస్తూ ‘వీరిని కూడా నమ్మలేదు’ అనే భావాన్ని ఇస్తుంది. వాక్య సంబంధాన్ని సహజం చేయడానికి ‘అయితే’ ఉపయోగించాం.
- source_word: ἐκείνοις
  choice: వీరిని
  rationale: దత్తివ విభక్తిలోని ἐκείνοις నివేదిక ఇచ్చిన ఆ ఇద్దరిని సూచిస్తుంది. తెలుగులో ‘నమ్ము’ క్రియతో సహజంగా వచ్చే కర్మరూపం ‘వీరిని’; ఇది మిగిలినవారితో వారిని స్పష్టంగా వేరు చేస్తుంది.
- source_word: ἐπίστευσαν
  choice: నమ్మలేదు
  rationale: πιστεύω ఇక్కడ సాక్ష్యాన్ని నిజమని అంగీకరించడాన్ని సూచిస్తుంది. వ్యక్తిగత ఆధారపడటం అనే భావాన్ని తెచ్చే ప్రత్యామ్నాయం కంటే ‘నమ్మలేదు’ సందర్భానికి నేరుగా సరిపోతుంది.
theological_decisions:
- issue: సాక్ష్యాన్ని స్వీకరించే కథన సందర్భంలో πιστεύω అనువాదం
  choice: నమ్మలేదు
  alternative: విశ్వసించలేదు / వారిపై నమ్మకం ఉంచలేదు
  rationale: ఇక్కడ క్రియకు సిద్ధాంతపరమైన ప్రత్యేక అర్థం కంటే వారు చెప్పిన విషయాన్ని నిజమని అంగీకరించకపోవడం అనే సాధారణ కథనార్థమే ప్రధానము. ‘నమ్మలేదు’ ఆ అర్థాన్ని భారం లేకుండా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి. గ్రీకులో స్పష్టంగా లేని కర్మను సందర్భానుసారంగా ‘ఆ సంగతి’ అని చేర్చాం. చివరి ఉపవాక్యంలో సర్వనామ గందరగోళాన్ని నివారించడానికి ‘మిగిలినవారు’ మరియు ‘వీరిని’ అని స్పష్టం చేశాం.
