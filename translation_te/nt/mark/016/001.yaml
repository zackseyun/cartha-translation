id: MRK.16.1
reference: Mark 16:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ διαγενομένου τοῦ σαββάτου ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸂ἡ τοῦ⸃ Ἰακώβου καὶ Σαλώμη ἠγόρασαν ἀρώματα ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/001.yaml
  text: And when the Sabbath was over[a], Mary Magdalene, Mary the mother of James, and Salome bought spices so that they might come and anoint him.
translation:
  language: te
  text: విశ్రాంతి దినం ముగిసిన తరువాత, మగ్దలేనే మరియ, యాకోబుతో సంబంధం ఉన్న మరియ[a], సలోమే ఆయనను అభిషేకించడానికి వెళ్లి ఉపయోగించేందుకు సుగంధ ద్రవ్యాలు కొన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా, “యాకోబుది అయిన మరియ”; అంటే యాకోబుతో ఉన్న సంబంధం ద్వారా గుర్తించబడిన మరియ. సంప్రదాయంగా ఆమెను యాకోబు తల్లిగా అర్థం చేసుకున్నారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαγενομένου τοῦ σαββάτου
  choice: విశ్రాంతి దినం ముగిసిన తరువాత
  rationale: ఈ genitive absolute ప్రధాన క్రియకు ముందున్న కాలాన్ని సూచిస్తుంది. ఈ తెలుగు రూపం సహజంగా ఉండి, విశ్రాంతి దినం గడిచిన తరువాత కొనుగోలు జరిగిందనే భావాన్ని నిలుపుతుంది.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: మగ్దలేనే మరియ
  rationale: ప్రదేశ సంబంధమైన బిరుదును గుర్తించదగిన ప్రామాణిక తెలుగు రూపంలో అందిస్తుంది.
- source_word: Μαρία ἡ τοῦ Ἰακώβου
  choice: యాకోబుకు సంబంధించిన మరియ
  rationale: గ్రీకు వాక్యం సంబంధాన్ని పేర్కొనకుండా ‘యాకోబుకు చెందిన/సంబంధించిన మరియ’ అని మాత్రమే గుర్తిస్తుంది. ప్రధాన పాఠంలో ‘తల్లి’ అని చేర్చి అస్పష్టతను తొలగించకుండా, సహజంగా సాధ్యమైనంతవరకు దానిని నిలిపి, పాదటిప్పణిలో సంప్రదాయ అవగాహనను తెలియజేస్తుంది.
- source_word: Σαλώμη
  choice: సలోమే
  rationale: వ్యక్తి పేరుకు గుర్తించదగిన తెలుగు లిప్యంతరీకరణ.
- source_word: ἠγόρασαν
  choice: కొన్నారు
  rationale: సాధారణ కథనంలోని aorist క్రియకు సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: ἀρώματα
  choice: సుగంధ ద్రవ్యాలు
  rationale: సమాధి సంబంధమైన శరీర సంస్కారంలో ఉపయోగించే పరిమళ పదార్థాలను స్పష్టంగా సూచిస్తుంది.
- source_word: ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν
  choice: ఆయనకు అభిషేకం చేయడానికి వెళ్లాలని
  rationale: ἵνα ఉద్దేశాన్ని సూచిస్తుంది; ἐλθοῦσαι ముందుగా వెళ్లి/వచ్చి చేరడాన్ని సూచిస్తుంది. తెలుగు సందర్భంలో సమాధి దగ్గరకు వెళ్లడమే ఉద్దేశం కావడంతో ఈ నిర్మాణం సహజంగా చర్యల క్రమాన్ని తెలియజేస్తుంది.
- source_word: ἀλείψωσιν
  choice: అభిషేకం చేయడానికి
  rationale: శరీరానికి సుగంధ పదార్థాలు పూయడం అనే అంత్యక్రియల సందర్భార్థాన్ని, విస్తృతంగా వ్యాఖ్యానించకుండా, నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: Μαρία ἡ τοῦ Ἰακώβουలో సంబంధాన్ని పూరించడం
  choice: ప్రధాన పాఠంలో ‘యాకోబుకు సంబంధించిన మరియ’ అని ఉంచి, పాదటిప్పణిలో ‘యాకోబు తల్లి’ అనే సంప్రదాయ అవగాహనను ఇవ్వడం
  alternative: యాకోబు తల్లి మరియ
  rationale: గ్రీకు మూలం సంబంధ స్వభావాన్ని స్పష్టంగా చెప్పదు. సందర్భం మరియు సువార్త సంప్రదాయం ‘తల్లి’ అనే అర్థానికి మద్దతిచ్చినా, దానిని ప్రధాన పాఠంలో నిర్ధారించడం మూలంలోని నిజమైన అస్పష్టతను తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘యాకోబుకు సంబంధించిన’ కొద్దిగా వివరణాత్మకంగా ఉన్నప్పటికీ, మూలంలోని సంబంధ అస్పష్టతను ఉద్దేశపూర్వకంగా కాపాడుతుంది.
