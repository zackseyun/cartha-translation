id: MRK.16.18
reference: Mark 16:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ὄφεις ἀροῦσιν κἂν θανάσιμόν τι πίωσιν οὐ μὴ αὐτοὺς βλάψῃ, ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν καὶ καλῶς ἕξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/018.yaml
  text: They will pick up snakes[a], and if they drink anything deadly, it will certainly not harm them; they will lay hands on the sick[d][c][b], and they will recover.
translation:
  language: te
  text: వారు పాములను[a][b] ఎత్తుకుంటారు; ప్రాణాంతకమైనది ఏదైనా[c] తాగినా, అది వారికి ఎంతమాత్రమూ హాని చేయదు. వారు రోగుల మీద చేతులు ఉంచుతారు; ఆ రోగులు కోలుకుంటారు.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో మార్కు 16:9–20 లేదు; ఈ వచనం మార్కు సువార్త యొక్క దీర్ఘ ముగింపులో భాగం.
    reason: textual_variant
  - marker: b
    text: లేదా, ‘సర్పాలను.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ప్రాణాంతకమైన దేనినైనా’; ఈ పదబంధం విస్తృతమైనది, కేవలం విషానికే పరిమితం కాదు.
    reason: lexical_alternative
  - marker: d
    text: అక్షరార్థంగా, ‘వారు బాగుంటారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφεις
  choice: పాములను
  rationale: సాధారణ ఆధునిక తెలుగులో సహజంగా అర్థమయ్యే పదం; ‘సర్పాలను’ అనే సాంప్రదాయ రూపం కంటే రోజువారీ భాషకు దగ్గరగా ఉండి, మూలార్థాన్ని నిలుపుతుంది.
- source_word: ἀροῦσιν
  choice: ఎత్తుకుంటారు
  rationale: αἴρω ఇక్కడ చేతితో తీసుకోవడం లేదా పైకెత్తడం అనే భౌతిక చర్యను సూచిస్తుంది; ‘ఎత్తుకుంటారు’ సహజమైన తెలుగు ప్రయోగం.
- source_word: κἂν
  choice: తాగినా
  rationale: καὶ ἐάν లోని షరతుతో కూడిన concessive భావాన్ని తెలుగు ‘-ఇనా’ రూపం సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: θανάσιμόν τι
  choice: ప్రాణాంతకమైనది ఏదైనా
  rationale: ఈ గ్రీకు పదబంధం మరణం కలిగించగల దేనినైనా విస్తృతంగా సూచిస్తుంది; దానిని కేవలం ‘విషం’గా పరిమితం చేయలేదు.
- source_word: οὐ μὴ ... βλάψῃ
  choice: ఎంతమాత్రమూ హాని చేయదు
  rationale: οὐ μή యొక్క బలమైన నిరాకరణను ‘ఎంతమాత్రమూ ... చేయదు’ సహజమైన తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν
  choice: రోగుల మీద చేతులు ఉంచుతారు
  rationale: చేతులను ఎవరి మీదనైనా ఉంచడం అనే మూలంలోని సాధారణ బైబిలు ప్రయోగాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: καλῶς ἕξουσιν
  choice: ఆ రోగులు కోలుకుంటారు
  rationale: అక్షరార్థంగా ‘వారు బాగుంటారు’; సందర్భంలో అనారోగ్యం నుండి బాగుపడడాన్ని ‘కోలుకుంటారు’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది. ‘ఆ రోగులు’ అని చెప్పడం తెలుగు వాక్యంలో కర్తను స్పష్టం చేస్తుంది.
theological_decisions:
- issue: వాగ్దానం చేసిన రక్షణలు, స్వస్థతల స్వభావం
  choice: విశ్వాసులతో కూడి జరిగే క్రియలు, ఫలితాలుగా వచనాన్ని సూటిగా అనువదించడం; అవి ప్రతి కాలంలోని ప్రతి విశ్వాసికి తప్పనిసరిగా వర్తిస్తాయా, ఒక నిర్దిష్ట కాలానికే పరిమితమా, లేక ప్రతీకాత్మకమా అని అదనంగా నిర్ణయించకపోవడం.
  alternative: ఈ సూచనలు అన్ని కాలాల్లో ప్రతి విశ్వాసికి ప్రమాణమని, అపొస్తలుల కాలానికే పరిమితమని, లేదా పూర్తిగా ప్రతీకాత్మకమని అనువాదంలోనే నిర్ధారించడం.
  rationale: గ్రీకు పాఠం భవిష్యత్ క్రియలను, వాటి ఫలితాలను నేరుగా చెబుతుంది; కొనసాగింపువాదం, నిలిపివేతవాదం లేదా ప్రతీకాత్మక వ్యాఖ్యానాన్ని అనువాదం దిగుమతి చేయకూడదు.
- issue: మార్కు 16:9–20 పాఠ్యస్థితి
  choice: అందించిన SBLGNT పాఠాన్ని అనువదిస్తూ, దీర్ఘ ముగింపు కొన్ని ప్రాచీన ప్రతుల్లో లేదనే విషయాన్ని పాదసూచికలో తెలియజేయడం.
  alternative: ఈ వచనాన్ని తొలగించడం లేదా ప్రధాన పాఠంలో కుండలీకరణ చేయడం.
  rationale: అందించిన మూలపాఠంలో వచనం ఉంది; అయితే ప్రసిద్ధ పాఠాంతర విషయాన్ని పాఠకునికి పారదర్శకంగా తెలియజేయడం అవసరం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ రూపొందించబడింది. ‘పాములు,’ ‘ఎత్తుకుంటారు,’ ‘కోలుకుంటారు’ వంటి సహజ పదాలను ఉపయోగించగా, బలమైన నిరాకరణను ‘ఎంతమాత్రమూ హాని చేయదు’గా వ్యక్తం చేశాం. మూలంలోని వాగ్దాన స్వరాన్ని తగ్గించలేదు లేదా ఏ మతశాఖ వ్యాఖ్యానంతోనూ పరిమితం చేయలేదు.
