  rationale: The revision improves modern Telugu idiom and reduces unnecessary heaviness while preserving every source-language element and the English audit trail’s interpretive restraint. The wording for γλώσσαις remains deliberately noncommittal, and the footnote keeps both the lexical alternative and the unresolved nature of the referent open.
