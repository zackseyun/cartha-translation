  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: σημεῖα δὲ τοῖς πιστεύσασιν ⸂ταῦτα παρακολουθήσει⸃, ἐν τῷ ὀνόματί μου δαιμόνια ἐκβαλοῦσιν, γλώσσαις λαλήσουσιν ⸀καιναῖς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/017.yaml
  text: 'And these signs will accompany those who have believed: in my name they will cast out demons[b][a]; they will speak in new tongues.'
translation:
  language: te
  text: 'విశ్వసించినవారికి ఈ సూచనలు తోడుగా ఉంటాయి[b]: నా నామంలో వారు దయ్యాలను వెళ్లగొడతారు; కొత్త భాషల్లో[a] మాట్లాడతారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘భాషలు’ అని అనువదించిన గ్రీకు పదానికి ‘నాలుకలు’ అనే అర్థమూ ఉండవచ్చు. ఇక్కడ ఇవి తెలిసిన మానవ భాషలా లేక వేరొక రకమైన ఉచ్చారణలా అన్నది వచనం ఖచ్చితంగా చెప్పదు.
    reason: lexical_alternative
  - marker: b
    text: ‘తోడుగా ఉంటాయి’ అని అనువదించిన గ్రీకు క్రియకు ‘వెంబడిస్తాయి’ లేదా ‘అనుసరిస్తాయి’ అని కూడా అనువదించవచ్చు. ఇక్కడ ఈ సూచనలు విశ్వసించినవారికి సహచరంగా ఉంటాయనే భావం ప్రధానంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: సూచక కార్యాలు
  rationale: ఈ పదం కేవలం అద్భుతాలను మాత్రమే కాక, ఒక వాస్తవాన్ని సూచించి ధ్రువీకరించే కార్యాలను కూడా తెలియజేస్తుంది. ‘సూచక కార్యాలు’ అనే పదబంధం ఆ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τοῖς πιστεύσασιν
  choice: విశ్వసించినవారి
  rationale: అయోరిస్ట్ పార్టిసిపుల్ విశ్వాసంలోకి వచ్చిన కార్యాన్ని సూచిస్తూనే, ఇక్కడ సాధారణ వర్గాన్ని కూడా తెలియజేస్తుంది. ‘విశ్వసించినవారి’ ఈ రెండు కోణాలను సంక్షిప్తంగా ప్రతిబింబిస్తుంది.
- source_word: ταῦτα
  choice: ఈ
  rationale: తరువాత పేర్కొనే సూచక కార్యాలను ముందుగానే చూపించే ప్రత్యక్ష సూచనార్థక పదంగా అనువదించబడింది.
- source_word: παρακολουθήσει
  choice: వెంట … ఉంటాయి
  rationale: ఈ క్రియ కేవలం కాలక్రమంలో తరువాత రావడాన్ని కాక, వారితో కలిసి ఉండడం లేదా వారిని అనుసరించడం అనే భావాన్ని కలిగి ఉంది. తెలుగులో ‘వెంట ఉంటాయి’ ఆ అనుబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐν τῷ ὀνόματί μου
  choice: నా నామంలో
  rationale: యేసు నామానికి సంబంధించిన అధికారంతో చేసే కార్యాన్ని తెలిపే మూలభాషా ప్రయోగాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: δαιμόνια
  choice: దయ్యాలను
  rationale: మూలపదం నేరుగా దయ్యాలను సూచిస్తుంది; ‘అపవిత్రాత్మలు’ అని అనువదిస్తే ఇక్కడ లేని వేరొక గ్రీకు పదబంధం దిగుమతి అవుతుంది.
- source_word: ἐκβαλοῦσιν
  choice: వెళ్లగొడతారు
  rationale: బలవంతంగా బయటకు పంపడం అనే భావాన్ని ఆధునిక, సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: γλώσσαις
  choice: భాషల్లో
  rationale: γλῶσσα అంటే ‘నాలుక’ లేదా ‘భాష’ కావచ్చు. మాట్లాడే సందర్భంలో ‘భాషలు’ సహజమైన తెలుగు; అయితే ఇక్కడ ఉద్దేశించిన మాటల స్వరూపాన్ని వచనం ఖచ్చితంగా నిర్వచించనందున దానిని పాదసూచికలో తెరిచి ఉంచాం.
- source_word: λαλήσουσιν
  choice: మాట్లాడతారు
  rationale: సాధారణంగా ‘మాట్లాడు’ అనే అర్థమిచ్చే క్రియకు ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: καιναῖς
  choice: కొత్త
  rationale: రకం లేదా స్వభావంలో కొత్తదనాన్ని సూచించే పదాన్ని నేరుగా అనువదించి, ఆ కొత్తదనం యొక్క ఖచ్చిత స్వరూపాన్ని నిర్ణయించకుండా ఉంచుతుంది.
theological_decisions:
- issue: ‘కొత్త భాషల్లో మాట్లాడతారు’ అనే మాటలోని భాషల స్వరూపం
  choice: ప్రధాన పాఠ్యంలో ‘కొత్త భాషల్లో’ అని ఉంచి, అవి తెలిసిన మానవ భాషలా లేక మరొక విధమైన ఉచ్చారణలా అన్నది నిర్ణయించలేదు.
  alternative: ‘కొత్త నాలుకలతో’ లేదా ‘కొత్త భాషలను మాట్లాడతారు’
  rationale: γλώσσαις అనే గ్రీకు పదం భాషలను సూచించగలదు; అయితే ఈ వాక్యం ఆ అనుభవాన్ని మరింత ఖచ్చితంగా నిర్వచించదు. ఏదైనా ప్రత్యేక సంఘపరమైన వ్యాఖ్యానాన్ని చేర్చకుండా అస్పష్టతను పాదసూచికలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘సూచక కార్యాలు’ మూలంలోని సూచనాత్మక అద్భుత భావాన్ని నిలుపుతుంది; ‘వెంట ఉంటాయి’ సహజమైన తెలుగు ప్రవాహంతో παρακολουθήσει యొక్క అనుబంధ భావాన్ని వ్యక్తం చేస్తుంది.
