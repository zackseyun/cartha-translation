review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the SBLGNT wording: the signs are associated with those who have believed; casting out demons is done in Jesus’ name; and speaking is in ‘new’ γλώσσαις. The rendering should retain the ambiguity of γλώσσαις rather than identify the speech as either known human languages or another specific phenomenon.'
  naturalness: ‘విశ్వసించినవారి వెంట ఈ సూచక కార్యాలు ఉంటాయి’ is understandable but somewhat awkward in modern standard Telugu, and ‘సూచక కార్యాలు’ is heavier than necessary. ‘విశ్వసించినవారికి ఈ సూచనలు తోడుగా ఉంటాయి’ is more idiomatic while preserving the accompanying sense.
  terminology: ‘సూచనలు’ appropriately conveys σημεῖα without reducing it simply to miracles. ‘దయ్యాలు’ and ‘వెళ్లగొడతారు’ accurately communicate δαιμόνια and ἐκβαλοῦσιν. ‘కొత్త భాషల్లో’ is a natural main-text rendering of γλώσσαις, provided the footnote preserves its lexical and contextual openness.
  issues:
  - severity: low
    issue: Awkward expression for accompaniment
    rationale: ‘విశ్వసించినవారి వెంట ... ఉంటాయి’ is less natural than a dative-plus-companion expression in Telugu. The revision expresses that the signs attend those who have believed without suggesting merely temporal succession.
  - severity: low
    issue: Overly weighty rendering of σημεῖα
    rationale: ‘సూచక కార్యాలు’ is defensible, but ‘సూచనలు’ is more concise and natural and still preserves the sign/attestation nuance.
  - severity: low
    issue: Footnote a’s wording is imprecise
    rationale: The phrase ‘మరొక విధమైన మాట’ is vague. The note should state plainly that the Greek can mean ‘tongues’ or ‘languages’ and that the text does not specify the nature of the speech.
  revised_text: 'విశ్వసించినవారికి ఈ సూచనలు తోడుగా ఉంటాయి[b]: నా నామంలో వారు దయ్యాలను వెళ్లగొడతారు; కొత్త భాషల్లో[a] మాట్లాడతారు.'
