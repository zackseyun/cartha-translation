id: MRK.16.8
reference: Mark 16:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐξελθοῦσαι ἔφυγον ἀπὸ τοῦ μνημείου, εἶχεν ⸀γὰρ αὐτὰς τρόμος καὶ ἔκστασις· καὶ οὐδενὶ οὐδὲν εἶπαν, ἐφοβοῦντο ⸁γάρ. ⟦Πάντα δὲ τὰ παρηγγελμένα τοῖς περὶ τὸν Πέτρον συντόμως ἐξήγγειλαν. μετὰ δὲ ταῦτα καὶ αὐτὸς ὁ Ἰησοῦς ἀπὸ ἀνατολῆς καὶ ἄχρι δύσεως ἐξαπέστειλεν δι’ αὐτῶν τὸ ἱερὸν καὶ ἄφθαρτον κήρυγμα τῆς αἰωνίου σωτηρίας. ἀμήν.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/008.yaml
  text: And they went out and fled from the tomb[a], for trembling and astonishment had seized them. And they said nothing to anyone, for they were afraid.
translation:
  language: te
  text: వారు సమాధిలోనుంచి బయటికి వచ్చి పారిపోయారు[a]. ఎందుకంటే వణుకు, దిగ్భ్రాంతి వారిని పట్టుకున్నాయి. వారు ఎవరికీ ఏమీ చెప్పలేదు; ఎందుకంటే వారు భయపడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'కొన్ని ప్రతుల్లో ‘సంక్షిప్త ముగింపు’ అని పిలిచే ఈ భాగం అదనంగా ఉంది: “తమకు ఆజ్ఞాపించబడిన వాటన్నిటినీ వారు పేతురు చుట్టూ ఉన్నవారికి క్లుప్తంగా తెలియజేశారు. ఆ తరువాత యేసు తానే వారి ద్వారా తూర్పు నుంచి పడమర వరకు నిత్య రక్షణకు సంబంధించిన పవిత్రమైన, నాశనం కాని ప్రకటనను పంపించాడు. ఆమేన్.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἐξελθοῦσαι
  choice: బయటికి వచ్చి
  rationale: స్త్రీలను సూచించే భూతకాల కృదంతాన్ని, ప్రధాన క్రియకు ముందున్న చర్యగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔφυγον
  choice: పారిపోయారు
  rationale: φεύγω లోని త్వరగా తప్పించుకొని వెళ్లే బలాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: μνημείου
  choice: సమాధి
  rationale: పునరుత్థాన వృత్తాంత సందర్భంలో μνημεῖονకు సహజమైన, నిర్దిష్టమైన తెలుగు పదం.
- source_word: εἶχεν αὐτὰς
  choice: వారిని ఆవరించాయి
  rationale: భావోద్వేగ స్థితులు వారిని పూర్తిగా పట్టుకున్నాయనే గ్రీకు ప్రయోగ తీవ్రతను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: τρόμος
  choice: వణుకు
  rationale: భయంతో కలిగే శారీరక కంపనాన్ని స్పష్టంగా చూపి, తరువాతి ‘భయపడ్డారు’తో అనవసర పునరుక్తిని తగ్గిస్తుంది.
- source_word: ἔκστασις
  choice: దిగ్భ్రాంతి
  rationale: ఈ సందర్భంలోని ఆశ్చర్యం, మానసిక కలవరంతో కూడిన స్థితిని తెలియజేస్తుంది; ఆధునిక అర్థంలో తప్పుదారి పట్టించే ‘పరవశం’ను నివారిస్తుంది.
- source_word: οὐδενὶ οὐδὲν
  choice: ఎవరికీ ఏమీ చెప్పలేదు
  rationale: గ్రీకులోని బలమైన సార్వత్రిక నిరాకరణను సహజ తెలుగు నిర్మాణంతో నిలుపుతుంది.
- source_word: ἐφοβοῦντο
  choice: వారు భయపడ్డారు
  rationale: వారి కొనసాగుతున్న భయస్థితిని సరళమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: రెండు చోట్లా కారణాన్ని స్పష్టంగా తెలియజేస్తుంది; చివరి వివరణాత్మక γάρ వల్ల కలిగే ఆకస్మిక ముగింపును కూడా అతిగా సవరించదు.
theological_decisions:
- issue: మార్కు 16:8 తరువాత ద్వికోష్ఠకాల్లో ఉన్న సంక్షిప్త ముగింపు
  choice: ప్రధాన వచనంలో చేర్చకుండా, పాఠాంతరంగా పాదసూచికలో ఇవ్వడం
  alternative: సంక్షిప్త ముగింపును ప్రధాన వచనంలో చేర్చడం లేదా రెండు ముగింపులనూ ప్రధాన పాఠంలో ముద్రించడం
  rationale: SBLGNT ఈ భాగాన్ని ద్వికోష్ఠకాల్లో ఉంచి ప్రధాన పాఠానికి చెందనిదిగా సూచిస్తుంది. అయినప్పటికీ పాఠకులకు పాఠాంతర సాక్ష్యాన్ని పారదర్శకంగా తెలియజేయడానికి దానిని పాదసూచికలో పూర్తిగా అందించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. మార్కు వృత్తాంతంలోని వేగాన్ని నిలుపుతూ, వణుకు–దిగ్భ్రాంతి–భయం మధ్య ఉన్న భావ భేదాలను కాపాడాం. పాదసూచిక గుర్తు ప్రధాన పాఠంలోని ‘సమాధి’ తరువాత ఉంచాం.
