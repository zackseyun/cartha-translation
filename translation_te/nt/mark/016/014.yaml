id: MRK.16.14
reference: Mark 16:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὕστερον ⸀δὲ ἀνακειμένοις αὐτοῖς τοῖς ἕνδεκα ἐφανερώθη, καὶ ὠνείδισεν τὴν ἀπιστίαν αὐτῶν καὶ σκληροκαρδίαν ὅτι τοῖς θεασαμένοις αὐτὸν ⸀ἐγηγερμένον οὐκ ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/014.yaml
  text: Later[a], he appeared to the eleven themselves as they were reclining at the table, and he rebuked their unbelief and hardness of heart[c][b], because they had not believed those who had seen him after he had been raised.
translation:
  language: te
  text: తరువాత[a], ఆ పదకొండుమంది భోజనం చేస్తూ ఆనుకొని కూర్చుని ఉండగా[b], ఆయన వారికి ప్రత్యక్షమయ్యాడు. ఆయన లేపబడిన తరువాత[c] ఆయనను చూసినవారిని వారు నమ్మలేదు కాబట్టి, వారి అవిశ్వాసాన్ని, హృదయ కాఠిన్యాన్ని ఆయన గద్దించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ తరువాత.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పదం భోజనం చేసేటప్పుడు ఆనుకొని కూర్చునే అప్పటి ఆచారాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: ‘ఆయన లేపబడిన తరువాత ఆయనను చూసినవారు’ అనే మాటలను మరింత అక్షరార్థంగా, ‘లేపబడిన ఆయనను చూసినవారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕστερον
  choice: తరువాత
  rationale: తదుపరి కాలాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది; సంఘటనల క్రమాన్ని కాపాడుతుంది.
- source_word: ἀνακειμένοις
  choice: భోజనానికి ఆనుకొని కూర్చుని ఉండగా
  rationale: ప్రాచీన కాలంలో భోజనం చేసేటప్పుడు ఆనుకొని కూర్చునే ఆచారాన్ని సూచించే క్రియార్థాన్ని, ఆధునిక పాఠకునికి భోజన సందర్భం స్పష్టమయ్యేలా అందిస్తుంది.
- source_word: τοῖς ἕνδεκα
  choice: ఆ పదకొండుమంది
  rationale: యూదా లేని తరువాత మిగిలిన శిష్యుల నిర్దిష్ట సమూహాన్ని సహజంగా సూచిస్తుంది.
- source_word: ἐφανερώθη
  choice: ప్రత్యక్షమయ్యాడు
  rationale: పునరుత్థాన దర్శన సందర్భంలో గ్రీకు నిష్క్రియ రూపానికి సహజమైన, స్థిరమైన తెలుగు వ్యక్తీకరణ.
- source_word: ὠνείδισεν
  choice: గద్దించాడు
  rationale: తీవ్రమైన మందలింపును సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπιστίαν
  choice: అవిశ్వాసాన్ని
  rationale: ఇచ్చిన సాక్ష్యాన్ని నమ్మకపోవడం లేదా నిరాకరించడం అనే సందర్భార్థాన్ని నేరుగా కాపాడుతుంది.
- source_word: σκληροκαρδίαν
  choice: హృదయ కాఠిన్యాన్ని
  rationale: ప్రతిఘటించే అంతరంగ వైఖరిని తెలిపే బైబిలు రూపకాన్ని సరళీకరించకుండా నిలుపుతుంది.
- source_word: θεασαμένοις
  choice: చూసినవారి
  rationale: పునరుత్థానమైన యేసును ప్రత్యక్షంగా చూసినవారిని సూటిగా సూచిస్తుంది.
- source_word: ἐγηγερμένον
  choice: లేపబడిన తరువాత
  rationale: పరిపూర్ణ నిష్క్రియ కృదంతంలోని పునరుత్థాన భావాన్నీ నిష్క్రియ రూపాన్నీ కాపాడుతూ తెలుగులో సహజమైన కాలసంబంధ వాక్యంగా అందిస్తుంది.
- source_word: οὐκ ἐπίστευσαν
  choice: నమ్మలేదు
  rationale: ఈ ప్రత్యక్షతకు ముందు వారు సాక్ష్యాన్ని అంగీకరించకపోవడాన్ని సందర్భం స్పష్టం చేస్తుంది; తెలుగులో సాధారణ భూతకాల రూపమే సహజం.
theological_decisions:
- issue: ἐγηγερμένον లోని పునరుత్థాన పదప్రయోగం
  choice: ఆయన లేపబడిన తరువాత
  alternative: లేచిన ఆయనను / లేపబడినవానిగా ఆయనను
  rationale: నిష్క్రియ రూపాన్ని నిలుపుతూ పునరుత్థాన ప్రకటనను స్పష్టంగా అందిస్తుంది; కార్యాన్ని ఎవరు చేశారో అనువాదంలో అదనంగా పేర్కొనదు.
- issue: σκληροκαρδία యొక్క భావం
  choice: హృదయ కాఠిన్యం
  alternative: మొండితనం / కఠిన హృదయం
  rationale: ఆధ్యాత్మిక ప్రతిఘటనను సూచించే మూల రూపకాన్నీ దాని బైబిలు-వేదాంత ప్రతిధ్వనినీ నిలుపుతుంది.
- issue: వ్యక్తులను నమ్మడం అనే గ్రీకు నిర్మాణం
  choice: చూసినవారి సాక్ష్యాన్ని వారు నమ్మలేదు
  alternative: చూసినవారిని వారు నమ్మలేదు
  rationale: గ్రీకులో నమ్మబడనివారు సాక్షులుగా పేర్కొనబడ్డారు; తెలుగులో ఉద్దేశం అపార్థం కాకుండా వారి సాక్ష్యమే తిరస్కరించబడిందని సహజంగా వ్యక్తం చేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘హృదయ కాఠిన్యం’ అనే బైబిలు రూపకం నిలుపబడింది. ప్రాచీన భోజన భంగిమను ప్రధాన పాఠ్యంలో సంక్షిప్తంగా తెలిపి, సాంస్కృతిక వివరణను పాదసూచికలో ఇచ్చాం. మూలంలోని నిష్క్రియ పునరుత్థాన పదప్రయోగాన్ని ‘లేపబడిన’ ద్వారా కాపాడాం.
