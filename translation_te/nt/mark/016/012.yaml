id: MRK.16.12
reference: Mark 16:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα δυσὶν ἐξ αὐτῶν περιπατοῦσιν ἐφανερώθη ἐν ἑτέρᾳ μορφῇ πορευομένοις εἰς ἀγρόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/012.yaml
  text: After these things[b][a], he appeared in a different form to two of them as they were walking on their way into the countryside.
translation:
  language: te
  text: ఈ సంగతుల తర్వాత, వారిలో ఇద్దరు పల్లెప్రాంతానికి[b] నడుచుకుంటూ వెళ్తుండగా, ఆయన వారికి భిన్నమైన రూపంలో[a] కనిపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వేరొక రూపంలో.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఒక పొలానికి.’ ఈ సందర్భంలో ἀγρός అనే పదానికి ‘పల్లెప్రాంతం’ అనే అర్థం సంభావ్యమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: ఈ సంగతుల తర్వాత
  rationale: μετά + ద్వితీయా విభక్తి సూచించే కాలక్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; δέ ఇక్కడ కథనాన్ని తిరిగి కొనసాగించే స్వల్ప అనుసంధానంగా ఉంది కాబట్టి ప్రత్యేకంగా అనువదించలేదు.
- source_word: δυσὶν ἐξ αὐτῶν
  choice: వారిలో ఇద్దరు
  rationale: పెద్ద సమూహంలోనుండి ఇద్దరిని సూచించే భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: περιπατοῦσιν
  choice: నడుచుకుంటూ
  rationale: ప్రధాన క్రియతో సమకాలంలో కొనసాగుతున్న నడకను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐφανερώθη
  choice: కనిపించాడు
  rationale: ఈ పునరుత్థానానంతర సందర్భంలో φανερόω కర్మణి రూపం ఎవరైనా ప్రత్యక్షంగా కనిపించడాన్ని సూచిస్తుంది; ‘కనిపించాడు’ స్పష్టమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: ἐν ἑτέρᾳ μορφῇ
  choice: భిన్నమైన రూపంలో
  rationale: ἑτέρᾳలోని భిన్నత్వాన్ని, μορφήలోని రూపం లేదా బాహ్య ఆకృతి భావాన్ని వివరణ జోడించకుండా నిలుపుతుంది.
- source_word: πορευομένοις
  choice: వెళ్తుండగా
  rationale: గమ్యస్థానం వైపు సాగుతున్న ఉద్దేశపూర్వక ప్రయాణాన్ని తెలియజేస్తుంది; περιπατοῦσινతో కలిసి ‘నడుచుకుంటూ వెళ్తుండగా’ అని సహజంగా చదవబడుతుంది.
- source_word: εἰς ἀγρόν
  choice: పల్లెప్రాంతానికి
  rationale: ἀγρόςకు ‘పొలం’ అనే అర్థం ఉన్నప్పటికీ, ఈ కథన సందర్భంలో ఒక ప్రత్యేక పొలం కంటే గ్రామీణ ప్రాంతం అనే భావం సంభావ్యమైనది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: ἐν ἑτέρᾳ μορφῇ వర్ణించే పునరుత్థాన ప్రత్యక్షత స్వభావం
  choice: ఎలా భిన్నంగా ఉన్నాడో వివరించకుండా ‘భిన్నమైన రూపంలో’ అని వర్ణనాత్మకంగా అనువదించడం.
  alternative: ‘వేరొక రూపంలో’ లేదా ‘భిన్నమైన ఆకృతితో.’
  rationale: ఈ భిన్నత్వం యేసు బాహ్య రూపంలోనిదా, చూసినవారి గ్రహింపులోనిదా, లేక గుర్తింపు విధానంలోనిదా అని వాక్యం నిర్దిష్టంగా చెప్పదు. కాబట్టి అనువాదం ఆ అనిశ్చితిని పరిష్కరించకుండా మూలపాఠంలోని వాదనను మాత్రమే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. రెండు సమకాలిక కృదంతాల భావాన్ని ‘నడుచుకుంటూ వెళ్తుండగా’ అనే సహజ నిర్మాణంతో వ్యక్తం చేశాం; మూలంలో లేని వివరణాత్మక లేదా సంప్రదాయపరమైన సిద్ధాంత భావాలను చేర్చలేదు.
