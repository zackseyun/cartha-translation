  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀ἦλθεν κηρύσσων ⸂εἰς τὰς συναγωγὰς⸃ αὐτῶν εἰς ὅλην τὴν Γαλιλαίαν καὶ τὰ δαιμόνια ἐκβάλλων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/039.yaml
  text: And he went throughout all Galilee[a], preaching in their synagogues and casting out demons.
translation:
  language: te
  text: ఆయన గలిలయ అంతటా సంచరిస్తూ, వారి సమాజమందిరాల్లో ప్రకటిస్తూ, దయ్యాలను వెళ్లగొడుతూ సంచరించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθεν
  choice: వెళ్లి
  rationale: ἔρχομαι యొక్క ఈ భూతకాల రూపానికి ‘వచ్చాడు’ అనే అర్థం సాధ్యమైనా, గలిలయ ప్రాంతమంతటా సాగిన సంచార పరిచర్యను సందర్భం సూచిస్తోంది. తెలుగులో ‘వెళ్లి’ సహజంగా ఆ కదలికను తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: κηρύσσων
  choice: ప్రకటిస్తూ
  rationale: κηρύσσω బహిరంగంగా సందేశాన్ని ప్రకటించడాన్ని సూచిస్తుంది. ‘ప్రకటిస్తూ’ మూలపదంలోని దూతవలె చాటిచెప్పే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: εἰς τὰς συναγωγὰς αὐτῶν
  choice: వారి సమాజమందిరాల్లో
  rationale: ఇక్కడ εἰς కార్యం జరిగే స్థలాన్ని సూచిస్తుంది. ‘వారి’ αὐτῶνను నిలుపుతుంది; ‘సమాజమందిరాలు’ యూదుల synagogueలను సూచించే గౌరవప్రదమైన, అర్థవంతమైన తెలుగు పదం.
- source_word: εἰς ὅλην τὴν Γαλιλαίαν
  choice: గలిలయ ప్రాంతమంతటా
  rationale: రెండవ εἰς మరియు ὅλην కలిసి పరిచర్య విస్తరించిన ప్రాంతాన్ని సూచిస్తాయి. ‘ప్రాంతమంతటా’ మొత్తం గలిలయలో సంచరించిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τὰ δαιμόνια
  choice: దయ్యాలను
  rationale: δαιμόνιαకు నేరుగా సరిపడే సాధారణ తెలుగు పదం ‘దయ్యాలు’. తెలుగు వాక్యనిర్మాణంలో నిర్దిష్ట ఉపపదం లేకుండానే ఇది సాధారణంగా అర్థమవుతుంది; ‘అపవిత్రాత్మలు’ అనే భిన్న గ్రీకు పదబంధాన్ని ఇక్కడికి తీసుకురాలేదు.
- source_word: ἐκβάλλων
  choice: వెళ్లగొడుతూ
  rationale: భూతవైద్య సందర్భంలో ἐκβάλλω బలవంతంగా బయటకు పంపడాన్ని సూచిస్తుంది. ‘వెళ్లగొడుతూ’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
theological_decisions:
- issue: τὰ δαιμόνια యొక్క స్వభావం
  choice: ‘దయ్యాలు’ అని వ్యక్తిగత ఆత్మసంబంధ జీవులను సూచించే సాధారణ అర్థంలో అనువదించాం.
  alternative: దుష్టాత్మలు
  rationale: మూలపాఠం యేసు δαιμόνιαపై అధికారం చూపినట్లు వర్ణిస్తుంది. ‘దయ్యాలు’ నేరుగా సరిపడే పదం; పాఠం చెప్పేదానికంటే అదనపు సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ప్రధాన క్రియకు అనుసంధానమైన రెండు వర్తమాన కృదంతాల సమాంతరత్వాన్ని ‘ప్రకటిస్తూ, ... వెళ్లగొడుతూ’ అని నిలిపాం; ἦλθενలోని నిజమైన పదార్థ సందిగ్ధతను [a] పాదటిప్పణిలో భద్రపరిచాం.
