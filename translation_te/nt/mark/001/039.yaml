- from: ఆయన గలిలయ ప్రాంతమంతటా వెళ్లి[a], వారి సమాజమందిరాల్లో ప్రకటిస్తూ, దయ్యాలను వెళ్లగొడుతూ ఉన్నాడు.
  to: ఆయన గలిలయ అంతటా సంచరిస్తూ, వారి సమాజమందిరాల్లో ప్రకటిస్తూ, దయ్యాలను వెళ్లగొడుతూ సంచరించాడు.
  rationale: 'The revised wording uses a finite past narrative verb, ‘సంచరించాడు,’ for the contextual itinerant force of ἦλθεν and retains the two participial activities as ‘ప్రకటిస్తూ’ and ‘వెళ్లగొడుతూ.’ To avoid repeating ‘సంచరించాడు’ in a way that is stylistically awkward, the text should instead use the following final form: ‘ఆయన గలిలయ అంతటా వారి సమాజమందిరాల్లో ప్రకటిస్తూ, దయ్యాలను వెళ్లగొడుతూ సంచరించాడు.’ This maintains source meaning, natural Telugu syntax, and the stated lexical ambiguity in the footnote.'
