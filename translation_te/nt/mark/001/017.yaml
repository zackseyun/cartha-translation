  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς γενέσθαι ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/017.yaml
  text: And Jesus said to them, “Come after me, and I will make you become fishers of men.”
translation:
  language: te
  text: యేసు వారితో, “నా వెంట రండి; నేను మిమ్మల్ని మనుషులను పట్టే జాలరులుగా చేస్తాను” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δεῦτε ὀπίσω μου
  choice: నా వెంట రండి
  rationale: శిష్యునిగా యేసును అనుసరించాలనే పిలుపును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘నా వెనుకకు రండి’ అనే అసహజ పదానువాదాన్ని నివారిస్తుంది.
- source_word: ποιήσω ὑμᾶς γενέσθαι
  choice: నేను మిమ్మల్ని … చేస్తాను
  rationale: ‘మీరు … అయ్యేలా చేస్తాను’ అనే మూలభావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది; యేసే వారిని ఆ పాత్రకు రూపుదిద్దుతాడనే భావాన్ని నిలుపుతుంది.
- source_word: ἁλιεῖς ἀνθρώπων
  choice: మనుషులను పట్టే జాలరులు
  rationale: చేపలు పట్టే వారి రూపకాన్ని నిలుపుతూ, ἀνθρώπωνను సమస్త మనుషులకు వర్తించే సాధారణ అర్థంలో అనువదిస్తుంది.
theological_decisions:
- issue: ‘మనుషులను పట్టే జాలరులు’ అనే రూపకం
  choice: రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: మనుషులను దేవుని దగ్గరకు తీసుకువచ్చేవారు
  rationale: మూలపాఠం రూపకాన్ని వివరణాత్మక వేదాంత భాషతో భర్తీ చేయకుండా, దాని ఉద్దేశపూర్వక విస్తృతతను మరియు ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ప్రత్యక్ష సంభాషణలో సంక్షిప్తతను నిలిపాం.
