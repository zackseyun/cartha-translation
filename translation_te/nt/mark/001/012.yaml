  edition: SBLGNT
  text: Καὶ εὐθὺς τὸ πνεῦμα αὐτὸν ἐκβάλλει εἰς τὴν ἔρημον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/012.yaml
  text: And immediately the Spirit drives him out into the wilderness[a].
translation:
  language: te
  text: వెంటనే ఆత్మ ఆయనను అరణ్యంలోకి నెట్టివేసింది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అరణ్యంలోకి వెళ్లగొట్టింది’ లేదా ‘బలవంతంగా పంపింది.’ గ్రీకు క్రియ బలమైనది; మార్కు దయ్యాలను వెళ్లగొట్టడాన్ని చెప్పడానికి ఇదే క్రియను తరచుగా ఉపయోగిస్తాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: వాక్యప్రవాహంలో ప్రత్యేకంగా అనువదించలేదు
  rationale: తెలుగులో ముందున్న వాక్యంతో అనుసంధానం సహజంగానే స్పష్టమవుతుంది; ‘మరియు’ అని ఉంచితే కథనశైలి కృత్రిమంగా ఉంటుంది.
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు కథనంలోని వేగాన్నీ తక్షణత్వాన్నీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: τὸ πνεῦμα
  choice: ఆత్మ
  rationale: ఇది 1:10లో ప్రస్తావించిన ఆత్మనే సూచిస్తుంది. మూలంలో ‘పరిశుద్ధ’ అనే విశేషణం లేనందున దాన్ని చేర్చలేదు.
- source_word: αὐτὸν
  choice: ఆయనను
  rationale: సూచిత వ్యక్తి యేసు; గౌరవప్రదమైన తెలుగు సర్వనామాన్ని వాడాం.
- source_word: ἐκβάλλει
  choice: బలంగా పంపాడు
  rationale: కేవలం ‘నడిపించాడు’ లేదా ‘పంపాడు’ అనే మృదువైన భావం కాకుండా, క్రియలోని బలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. ‘వెళ్లగొట్టాడు’ మరింత పదబద్ధమైనదైనా, యేసును తిరస్కరించి తరిమినట్టు అనవసర భావం కలిగించవచ్చు.
- source_word: εἰς τὴν ἔρημον
  choice: అరణ్యంలోకి
  rationale: ἔρημος సూచించే జనావాసం లేని నిర్జన ప్రదేశాన్ని ‘అరణ్యం’ సహజంగా వ్యక్తం చేస్తుంది; అది తప్పనిసరిగా ఇసుక ఎడారి అనే భావాన్ని రుద్దదు.
theological_decisions:
- issue: యేసుపట్ల ఆత్మ చేసిన చర్యలోని బలం
  choice: ‘బలంగా పంపాడు’ అని అనువదించి దైవిక చొరవనూ మూలక్రియలోని తీవ్రతనూ నిలిపాం.
  alternative: ‘నడిపించాడు’, ‘పంపాడు’, లేదా ‘వెళ్లగొట్టాడు’
  rationale: ἐκβάλλει బలమైన క్రియ. దాన్ని ‘నడిపించాడు’గా మృదుపరచడం ఇతర సువార్తల పదప్రయోగంతో సమన్వయం చేసినట్టవుతుంది; ‘వెళ్లగొట్టాడు’ అయితే తెలుగులో తిరస్కరణ భావాన్ని అతిగా కలిగించవచ్చు. ప్రధాన పాఠం సహజతతో పాటు అసలు వాక్యంలోని ఉద్వేగాన్ని కాపాడుతుంది; మరింత పదబద్ధమైన ప్రత్యామ్నాయాలను పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, వేగవంతమైన మార్కు కథనశైలిని నిలిపాం. ‘ఆయన’ అనే గౌరవప్రద సర్వనామం సాధారణ తెలుగు బైబిల్ వాడుకకు అనుగుణం. ప్రధాన పాఠంలో ‘బలంగా పంపాడు’ సహజతను మరియు క్రియాబలాన్ని సమతుల్యం చేస్తుంది.
