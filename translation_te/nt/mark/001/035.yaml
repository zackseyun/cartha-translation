id: MRK.1.35
reference: Mark 1:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ πρωῒ ἔννυχα λίαν ἀναστὰς ἐξῆλθεν καὶ ἀπῆλθεν εἰς ἔρημον τόπον κἀκεῖ προσηύχετο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/035.yaml
  text: And very early[a], while it was still dark, he got up, went out, and went away to a desolate place, and there he was praying.
translation:
  language: te
  text: తెల్లవారుజామునే, ఇంకా చీకటిగా ఉండగానే, ఆయన లేచి బయటికి వెళ్లి, నిర్జనమైన ఒక చోటికి[a] వెళ్లిపోయాడు; అక్కడ ఆయన ప్రార్థిస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పాడుబడిన ప్రదేశానికి,” “అరణ్యంలాంటి ప్రదేశానికి,” లేదా “ఏకాంత ప్రదేశానికి” అని కూడా అనువదించవచ్చు. గ్రీకు పదం జనావాసం లేని, పాడుబడిన, లేదా అరణ్యంలాంటి ప్రదేశాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρωῒ ἔννυχα λίαν
  choice: తెల్లవారుజామునే, ఇంకా చీకటిగా ఉండగానే
  rationale: మూడు పదాలు కలిపి సూచించే అత్యంత తెల్లవారిన సమయాన్ని, అప్పటికీ చీకటి కొనసాగుతున్నదనే భావంతో సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἀναστὰς
  choice: ఆయన లేచి
  rationale: ప్రధాన క్రియలకు ముందు జరిగిన అనుబంధ చర్యను సహజంగా, క్రమాన్ని కాపాడుతూ తెలియజేస్తుంది.
- source_word: ἐξῆλθεν
  choice: బయటికి వెళ్లి
  rationale: ఆయన ఉన్న స్థలం నుంచి బయటకు కదలడాన్ని స్పష్టంగా చూపి, తరువాతి ἀπῆλθεν క్రియతో ఉన్న భేదాన్ని నిలుపుతుంది.
- source_word: ἀπῆλθεν
  choice: వెళ్లిపోయాడు
  rationale: ముందటి స్థలం నుంచి దూరంగా మరొక చోటికి వెళ్లడాన్ని సూచిస్తూ, మార్కు ఉపయోగించిన రెండు కదలిక క్రియలను వేర్వేరుగా ప్రతిబింబిస్తుంది.
- source_word: εἰς ἔρημον τόπον
  choice: జనసంచారం లేని ఒక చోటికి
  rationale: ἔρημος సూచించే నిర్జనమైన, జనులు లేని స్థల స్వభావాన్ని సహజంగా తెలియజేస్తుంది; అది తప్పనిసరిగా భౌగోళిక అరణ్యమేనని నిర్ధారించదు.
- source_word: κἀκεῖ
  choice: అక్కడ
  rationale: καὶ ἐκεῖ యొక్క స్థలసూచనను సంక్షిప్తంగా, సహజంగా అందిస్తుంది; తెలుగు వాక్యంలోని విరామచిహ్నం కథన అనుసంధానాన్ని మోస్తుంది.
- source_word: προσηύχετο
  choice: ప్రార్థిస్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న చర్య భావాన్ని సాధారణ భూతకాలం కంటే స్పష్టంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: యేసు ప్రార్థనపై కథన ప్రాధాన్యం
  choice: యేసు ఏకాంతమైన ప్రదేశానికి వెళ్లి కొనసాగిస్తూ ప్రార్థించినట్లు మాత్రమే నేరుగా అనువదించడం.
  alternative: దీనిని శిష్యత్వానికి ఆదర్శంగా లేదా యేసు ప్రార్థనలోని క్రీస్తుశాస్త్ర సంబంధిత అర్థంగా అనువాద పదాల్లోనే వివరించడం.
  rationale: గ్రీకు వాక్యం ఆయన తెల్లవారుజామున వెళ్లి ప్రార్థించిన సంఘటనను మాత్రమే కథనంగా చెబుతుంది; దాని నుంచి వచ్చే సిద్ధాంతపరమైన నిర్ణయాలను అనువాదంలో చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథన శైలి. గ్రీకులోని కదలికల క్రమం మరియు ప్రార్థన కొనసాగుతున్న భావం నిలుపబడ్డాయి. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
