source:
  edition: SBLGNT
  text: ⸂καὶ ἐξῆλθεν⸃ ἡ ἀκοὴ αὐτοῦ εὐθὺς ⸀πανταχοῦ εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/028.yaml
  text: And the news about him went out at once everywhere into the whole surrounding region of Galilee[a][b].
translation:
  language: te
  text: వెంటనే ఆయన గురించిన వార్త గలిలయ చుట్టుపక్కల ప్రాంతమంతటా వ్యాపించింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆయన గురించిన నివేదిక’; లేదా ‘ఆయన కీర్తి’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: వ్యాపించింది
  rationale: వార్త బయటకు వెళ్లి విస్తరించడాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; గ్రీకు క్రియలోని బయలుదేరే భావాన్ని సందర్భానుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: ἀκοὴ
  choice: వార్త
  rationale: ఇక్కడ ἀκοή అంటే విన్న విషయం లేదా నివేదిక. భూతవైద్య సంఘటన తరువాత యేసు గురించి ప్రజలు విన్న విషయాన్ని ‘వార్త’ సహజంగా సూచిస్తుంది.
- source_word: αὐτοῦ
  choice: ఆయన గురించిన
  rationale: ఈ షష్ఠీ విభక్తి వార్త యొక్క యాజమాన్యాన్ని కాక, దాని విషయాన్ని సూచిస్తుంది.
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు వాడే తక్షణత్వాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: πανταχοῦ
  choice: అంతటా
  rationale: ‘ప్రతిచోటా’ అనే విస్తృతిని సంక్షిప్తంగా తెలియజేస్తుంది; ప్రాంతమంతటా అనే నిర్మాణంలో సహజంగా సరిపోతుంది.
- source_word: περίχωρον
  choice: చుట్టుపక్కల ప్రాంతం
  rationale: పరిసర ప్రాంతం లేదా జిల్లా అనే భౌగోళిక భావాన్ని, గ్రామీణ ప్రాంతమని అనవసరంగా నిర్దిష్టం చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας
  choice: గలిలయ చుట్టుపక్కల ప్రాంతమంతటా
  rationale: εἰς సూచించే వ్యాప్తి ఫలితాన్ని తెలుగులో సహజమైన ‘అంతటా’తో అందిస్తుంది. τῆς Γαλιλαίας‌ను గలిలయకు చెందిన లేదా దాని చుట్టుపక్కల ఉన్న ప్రాంతంగా ఉంచుతుంది.
theological_decisions:
- issue: ἀκοὴ αὐτοῦ యొక్క సూచన
  choice: ‘ఆయన గురించిన వార్త’ అని అనువదించబడింది.
  alternative: ‘ఆయన కీర్తి’ లేదా ‘ఆయనను గూర్చిన నివేదిక’
  rationale: వాక్యం యేసు గురించి విన్న విషయం వేగంగా వ్యాపించడాన్ని చెబుతుంది. ‘కీర్తి’ అనేది మూలపదం తప్పనిసరిగా చెప్పని ఖ్యాతి లేదా ప్రసిద్ధి భావాన్ని బలంగా జోడిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. గ్రీకు పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, వార్త విస్తరించిన భావాన్ని స్పష్టంగా ఉంచింది.
