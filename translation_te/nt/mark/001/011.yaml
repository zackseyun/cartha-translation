revisions:
- from: 'అప్పుడు ఆకాశాల నుండి[a] ఒక స్వరం వచ్చింది: “నీవు నా ప్రియ కుమారుడివి; నీలో నేను ఆనందించాను.[b]”'
  to: 'మరియు ఆకాశాల నుండి[a] ఒక స్వరం వచ్చింది: “నీవు నా ప్రియమైన కుమారుడివి; నీయందు నేను సంతోషించాను.[b]”'
  rationale: The revision replaces the unwarranted temporal “అప్పుడు” with the coordinative “మరియు,” improves idiomatic Telugu for the declaration of divine approval, and expands “ప్రియ” to the natural adjective “ప్రియమైన.” The plural “ఆకాశాల” and the past-tense representation of εὐδόκησα are retained. Footnote b now offers both a close lexical alternative for εὐδόκησα and the common idiomatic relational rendering of ἐν σοί.
  reviewer_model: gpt-5.6-terra
