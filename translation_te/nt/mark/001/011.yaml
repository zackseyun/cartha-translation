id: MRK.1.11
reference: Mark 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ φωνὴ ἐγένετο ἐκ τῶν οὐρανῶν· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν ⸀σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/011.yaml
  text: 'And a voice came from the heavens: “You are my beloved Son[b][a]; in you I am well pleased.”'
translation:
  language: te
  text: 'మరియు ఆకాశాల నుండి[a] ఒక స్వరం వచ్చింది: “నీవు నా ప్రియమైన కుమారుడివి; నీయందు నేను సంతోషించాను.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆకాశం నుండి.” గ్రీకు మూలంలో “ఆకాశాలు” అని బహువచనం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నీయందు నేను ఆనందించాను” లేదా “నీతో నేను సంతోషిస్తున్నాను.”
    reason: alternative_reading
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: ఒక స్వరం వచ్చింది
  rationale: ἐγένετο అనే కథన ప్రయోగం ఒక సంఘటన చోటుచేసుకున్నదని సూచిస్తుంది. ‘ఒక స్వరం వచ్చింది’ అనేది మూలంలోని కథన బలాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: ἐκ τῶν οὐρανῶν
  choice: ఆకాశాల నుండి
  rationale: గ్రీకు మూలంలో οὐρανῶν బహువచనంలో ఉంది. తెలుగులో అర్థవంతంగా ఉండేలా ఆ బహువచనాన్ని ప్రధాన పాఠంలో నిలిపాం; సుపరిచితమైన ఏకవచన రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: Σὺ εἶ
  choice: నీవు … కుమారుడివి
  rationale: గ్రీకులో స్పష్టంగా ఉన్న Σὺ అనే సర్వనామం ప్రత్యక్ష సంబోధనకు నొక్కిచెబుతుంది. ‘నీవు’ దానిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: నా ప్రియ కుమారుడివి
  rationale: ఈ రూపం కుమారునిగా ఉన్న సంబంధాన్నీ, ἀγαπητός సూచించే ప్రేమాభిమానాన్నీ సంక్షిప్తంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν σοὶ
  choice: నీలో
  rationale: ἐν అనే విభక్త్యర్థాన్ని నేరుగా నిలుపుతుంది. ‘నిన్ను బట్టి’ లేదా ‘నీ పట్ల’ అని అర్థాన్ని ముందే నిర్ణయించి చెప్పకుండా, మూలంలోని భావవ్యాప్తిని కాపాడుతుంది.
- source_word: εὐδόκησα
  choice: నేను ఆనందించాను
  rationale: εὐδοκέω ఇక్కడ సంతోషం, అనుగ్రహపూర్వక ఆమోదం లేదా ఆనందాన్ని సూచిస్తుంది. అఓరిస్ట్ రూపాన్ని గతకాల క్రియగా నిలుపుతూ ‘ఆనందించాను’ అని అనువదించాం; వర్తమాన స్థితిని సూచించే సహజ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: యేసును ఉద్దేశించిన దైవిక ప్రకటనలో కుమారత్వాన్నీ ప్రేమనూ ఎలా వ్యక్తం చేయాలి
  choice: నా ప్రియ కుమారుడివి
  alternative: నేను ప్రేమించే నా కుమారుడివి; నా కుమారుడివి, ప్రియుడివి
  rationale: ఈ పదబంధం మూలంలోని కుమారత్వాన్ని, ప్రేమను రెండింటినీ నిలుపుతుంది; అయితే ఈ వచనంలో లేని తరువాతి కాలపు సిద్ధాంత పదజాలాన్ని చేర్చదు.
- issue: οὐρανῶν అనే బహువచనాన్ని ఏకవచనంగా మార్చాలా
  choice: ఆకాశాల నుండి
  alternative: ఆకాశం నుండి; పరలోకం నుండి
  rationale: మూలంలోని బహువచనాన్ని ప్రధాన పాఠంలో నిలిపాం. ‘పరలోకం’ అని అనువదిస్తే సందర్భార్థాన్ని ఒక నిర్దిష్ట దిశగా పరిమితం చేసే అవకాశం ఉన్నందున దాన్ని ప్రధాన పాఠంలో ఉపయోగించలేదు.
- issue: ἐν σοὶ εὐδόκησα లోని కాలం మరియు సంబంధాన్ని ఎలా నిలుపాలి
  choice: నీలో నేను ఆనందించాను
  alternative: నిన్ను బట్టి నేను సంతోషిస్తున్నాను; నీ పట్ల నేను సంతోషించాను
  rationale: ప్రధాన పాఠం ἐν అనే పదాన్నీ అఓరిస్ట్ క్రియారూపాన్నీ దగ్గరగా అనుసరిస్తుంది. తెలుగులో మరింత సహజంగా వినిపించే వర్తమాన స్థితి భావాన్ని పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చి, మూలంలోని కాల-భావ ఉద్రిక్తతను ఒకే విధంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే దైవిక ప్రకటనకు తగిన గంభీరతతో అనువదించబడింది. ‘నీవు,’ ‘ప్రియ కుమారుడు’ వంటి రూపాలు ప్రత్యక్షతను, గౌరవభావాన్ని నిలుపుతాయి. మూలంలోని బహువచనం, ἐν ప్రయోగం, అఓరిస్ట్ కాలరూపం సాధ్యమైనంతవరకు ప్రధాన పాఠంలో కాపాడబడ్డాయి.
