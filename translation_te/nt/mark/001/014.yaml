id: MRK.1.14
reference: Mark 1:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂Καὶ μετὰ⸃ τὸ παραδοθῆναι τὸν Ἰωάννην ἦλθεν ὁ Ἰησοῦς εἰς τὴν Γαλιλαίαν κηρύσσων τὸ ⸀εὐαγγέλιον τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/014.yaml
  text: And after John was handed over[a], Jesus came into Galilee[c][b], proclaiming the good news of God.
translation:
  language: te
  text: యోహాను అప్పగించబడిన తరువాత[a], యేసు గలిలయకు వచ్చి, దేవుని శుభవార్తను[b][c] ప్రకటించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యోహాను బంధించబడిన తరువాత.’ గ్రీకులో మరింత అక్షరార్థంగా ‘అప్పగించబడిన తరువాత’ అని ఉంది. ఇదే పదజాలం మార్కు తరువాత వివరించే యేసు శ్రమల కథనంలోనూ ప్రతిధ్వనిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దేవుని సువార్తను.’
    reason: lexical_alternative
  - marker: c
    text: ‘దేవుని’ అనే పదబంధం దేవుని నుండి వచ్చిన, దేవునికి చెందిన, లేదా దేవునిని కేంద్రంగా చేసుకున్న శుభవార్త అనే భావాలను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὸ παραδοθῆναι
  choice: అప్పగించబడిన తరువాత
  rationale: μετάతో కూడిన ఈ నిర్మాణం ‘తరువాత’ అనే కాలార్థాన్ని ఇస్తుంది. παραδίδωμι అనే క్రియలోని ‘అప్పగించు’ భావాన్ని నిలుపుకోవడం ద్వారా, మార్కు తరువాత యేసు అప్పగించబడడం గురించి ఉపయోగించే భాషతో ఉన్న కథన సంబంధం కూడా నిలుస్తుంది.
- source_word: Ἰωάννην
  choice: యోహాను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన, సులభంగా గుర్తించగల వ్యక్తినామ రూపం.
- source_word: ἦλθεν
  choice: వచ్చి
  rationale: ἔρχομαι యొక్క సహజ అర్థం ‘వచ్చాడు.’ తరువాతి వర్తమాన కృదంతంతో తెలుగులో సహజంగా కలపడానికి ‘వచ్చి ... ప్రకటించాడు’ అని నిర్మించబడింది.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: గలిలయకు
  rationale: εἰς సూచించే గమనం లేదా దిశను సహజమైన ఆధునిక తెలుగులో ‘గలిలయకు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: κηρύσσων
  choice: ప్రకటించాడు
  rationale: κηρύσσω బహిరంగంగా చాటడం లేదా ప్రకటించడం అనే భావాన్ని ఇస్తుంది. తెలుగు వాక్యప్రవాహంలో ప్రధాన క్రియతో అనుసంధానించి ‘వచ్చి ... ప్రకటించాడు’ అని ఇవ్వడం సహజంగా ఉంటుంది.
- source_word: εὐαγγέλιον
  choice: శుభవార్త
  rationale: εὐαγγέλιον యొక్క మౌలిక భావమైన ‘మంచి/శుభమైన వార్త’ను సాధారణ ఆధునిక పాఠకుడికి పారదర్శకంగా తెలియజేస్తుంది; సంప్రదాయ పదమైన ‘సువార్త’ను పాదసూచికలో ఉంచింది.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: గ్రీకు సంబంధవిభక్తిలో ఉన్న విస్తృతిని తెలుగు ‘దేవుని’ సహజంగా నిలుపుతుంది; అది దేవుని నుండి వచ్చినదా, దేవునికి చెందినదా, లేక దేవుని గురించినదా అనే ఒక్క అర్థానికి వాక్యాన్ని పరిమితం చేయదు.
theological_decisions:
- issue: మార్కులోని శ్రమల కథన పదజాలంతో παραδοθῆναιకు ఉన్న సంబంధం
  choice: అప్పగించబడిన
  alternative: బంధించబడిన
  rationale: ‘బంధించబడిన’ అనేది సందర్భానుసారంగా సరైన వివరణ అయినప్పటికీ, ‘అప్పగించబడిన’ అనే రూపం గ్రీకు పదానికి మరింత దగ్గరగా ఉండి, తరువాత యేసు అప్పగించబడడం గురించి మార్కు ఉపయోగించే పదజాలంతో ఉన్న ప్రతిధ్వనిని కాపాడుతుంది.
- issue: τὸ εὐαγγέλιον τοῦ θεοῦలో τοῦ θεοῦ సంబంధవిభక్తి భావం
  choice: దేవుని శుభవార్త
  alternative: దేవుని నుండి వచ్చిన శుభవార్త / దేవుని గురించిన శుభవార్త
  rationale: మూలంలోని సంబంధవిభక్తి ఈ పరస్పర సంబంధమున్న భావాలలో ఒక్కదానినే తప్పనిసరిగా నిర్దేశించదు. అందువల్ల ప్రధాన పాఠం ఆ అర్థవిస్తృతిని ఉద్దేశపూర్వకంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘శుభవార్త’ సాధారణ పాఠకుడికి అర్థపారదర్శకంగా ఉండగా, సంప్రదాయ ‘సువార్త’ను పాదసూచికలో ఇచ్చాం. మూలంలోని సంబంధవిభక్తి అస్పష్టతను వివరణాత్మక అనువాదంతో తొలగించలేదు.
