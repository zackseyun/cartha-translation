id: MRK.1.3
reference: Mark 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/003.yaml
  text: 'A voice of one crying out in the wilderness: ‘Prepare the way of the Lord[b][a]; make his paths straight,’'
translation:
  language: te
  text: '“అరణ్యంలో[b] బిగ్గరగా పిలిచే ఒకరి స్వరం: ‘ప్రభువు[a] మార్గాన్ని సిద్ధం చేయండి; ఆయన బాటలను తిన్నగా చేయండి.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘ప్రభువు’ అనేది గ్రీకు kyriouకు అనువాదం. ఈ ఉల్లేఖనం యెషయా 40:3ను ప్రతిధ్వనిస్తుంది; అక్కడ హీబ్రూ పాఠం యెహోవా (YHWH)ను సూచిస్తుంది.
    reason: cross_reference
  - marker: b
    text: 'యెషయా ఉల్లేఖనానికి మరో విధంగా విరామచిహ్నాలు పెడితే ఇలా చదవవచ్చు: “బిగ్గరగా పిలిచే ఒకరి స్వరం: ‘అరణ్యంలో ప్రభువు మార్గాన్ని సిద్ధం చేయండి …’”'
    reason: alternative_reading
lexical_decisions:
- source_word: φωνὴ
  choice: స్వరం
  rationale: ఇక్కడ φωνή ఒక ప్రకటనకర్త స్వరాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘స్వరం’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: βοῶντος
  choice: బిగ్గరగా పిలిచే ఒకరి
  rationale: ఈ షష్ఠీ విభక్తి కృదంతం φωνήపై ఆధారపడి ‘బిగ్గరగా పిలిచే ఒకరి స్వరం’ అనే భావాన్ని ఇస్తుంది. ‘బిగ్గరగా పిలిచే’ అనే పదబంధం బలమైన ప్రకటన భావాన్ని నిలుపుతుంది.
- source_word: ἐν τῇ ἐρήμῳ
  choice: అరణ్యంలో
  rationale: ἔρημος నిర్జన ప్రదేశం లేదా ఎడారిని సూచించగలదు. మార్కు సందర్భంలో యోహాను ఉన్న నిర్జన ప్రాంతానికీ యెషయా ప్రతిధ్వనికీ ‘అరణ్యం’ సరిపోతుంది.
- source_word: Ἑτοιμάσατε
  choice: సిద్ధం చేయండి
  rationale: బహువచన ఆజ్ఞార్థక క్రియలోని నిర్ణయాత్మక పిలుపును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὴν ὁδὸν
  choice: మార్గాన్ని
  rationale: ὁδόςలోని భౌతిక దారి భావాన్నీ ప్రవచనాత్మక రూపక భావాన్నీ ‘మార్గం’ నిలుపుతుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριος అనే గ్రీకు బిరుదుకు ‘ప్రభువు’ సహజమైన సమానార్థకం. తెలుగు విభక్తి నిర్మాణంలో ‘ప్రభువు మార్గం’ అనేది ‘ప్రభువుకు చెందిన/ప్రభువు కోసం సిద్ధం చేసే మార్గం’ అనే సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εὐθείας
  choice: తిన్నగా
  rationale: ఇక్కడ εὐθύς నైతిక నిజాయితీని కాకుండా వంకరలేని దారిని సూచిస్తుంది; ‘తిన్నగా’ ఆ దృశ్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ποιεῖτε
  choice: చేయండి
  rationale: వర్తమాన బహువచన ఆజ్ఞార్థక రూపాన్ని నేరుగా, సహజంగా అందిస్తుంది; తెలుగులో క్రియాంశాన్ని అదనంగా నిర్దేశించాల్సిన అవసరం లేదు.
- source_word: τὰς τρίβους αὐτοῦ
  choice: ఆయన బాటలను
  rationale: τρίβοςకు ‘బాట’ సహజమైన తెలుగు పదం; బహువచనాన్ని, αὐτοῦ సూచించే ప్రభువుతో సంబంధాన్ని ‘ఆయన’ ద్వారా నిలుపుతుంది.
theological_decisions:
- issue: హీబ్రూ యెషయా సందర్భంలో YHWHను సూచించే κύριος పదానికి అనువాదం
  choice: ప్రభువు
  alternative: యెహోవా / సర్వేశ్వరుడు
  rationale: ప్రధాన పాఠం గ్రీకు మార్కు పాఠంలోని κύριος అనే బిరుదునే అనుసరిస్తుంది. యెషయా 40:3 హీబ్రూ నేపథ్యంలోని YHWH సూచనను ప్రధాన పాఠంలోకి దిగుమతి చేయకుండా పాదసూచికలో తెలియజేస్తుంది; తద్వారా మార్కు కథనంలోని సంబంధాన్ని పాఠకుడే గ్రహించగలడు.
- issue: ‘అరణ్యంలో’ అనే పదబంధం దేనితో అనుసంధానమవుతుంది
  choice: ‘బిగ్గరగా పిలిచే ఒకరి’తో
  alternative: ‘అరణ్యంలో ప్రభువు మార్గాన్ని సిద్ధం చేయండి’ అనే ఆజ్ఞతో
  rationale: మార్కు గ్రీకు పదక్రమం, తక్షణ వాక్యనిర్మాణం ప్రకారం ఇది పిలిచే వ్యక్తితో సహజంగా అనుసంధానమవుతుంది. అయితే యెషయా ఉల్లేఖనానికి మరో విరామచిహ్న పద్ధతి సాధ్యమైనందున దానిని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే ప్రవచన ఉల్లేఖనానికి తగిన గౌరవగంభీరతతో రూపొందించబడింది. ‘మార్గం/బాటలు’ అనే జత గ్రీకు ὁδός/τρίβοι మధ్య స్వల్ప పదభేదాన్ని నిలుపుతుంది.
