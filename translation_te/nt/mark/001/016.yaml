id: MRK.1.16
reference: Mark 1:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂Καὶ παράγων⸃ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν Σίμωνα καὶ Ἀνδρέαν τὸν ⸀ἀδελφὸν Σίμωνος ⸀ἀμφιβάλλοντας ἐν τῇ θαλάσσῃ, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/016.yaml
  text: And as he was passing along beside the Sea of Galilee, he saw Simon and Andrew, Simon’s brother, casting a net into the sea, for they were fishermen.
translation:
  language: te
  text: ఆయన గలిలయ సముద్రం ఒడ్డున వెళ్తుండగా, సీమోనును, అతని సోదరుడైన అంద్రెయను చూశాడు. వారు సముద్రంలోకి వల వేస్తున్నారు; ఎందుకంటే వారు జాలరులు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παράγων παρὰ τὴν θάλασσαν
  choice: సముద్రం ఒడ్డున నడుచుకుంటూ వెళ్తున్నప్పుడు
  rationale: వర్తమాన కృదంతం ప్రధాన క్రియతో సమకాలీనంగా కొనసాగుతున్న కదలికను సూచిస్తుంది; παρά + accusative ఒడ్డున లేదా పక్కగా సాగడాన్ని తెలియజేస్తుంది.
- source_word: τὴν θάλασσαν τῆς Γαλιλαίας
  choice: గలిలయ సముద్రం
  rationale: θάλασσα అనే మూలపదాన్ని, తెలుగులో స్థిరపడిన భౌగోళిక పేరును నిలుపుతుంది.
- source_word: εἶδεν
  choice: చూశాడు
  rationale: ὁράω యొక్క సరళమైన భూతకాల రూపానికి నేరమైన, సహజమైన అనువాదం.
- source_word: Σίμωνα καὶ Ἀνδρέαν
  choice: సీమోనును, ... అంద్రెయను
  rationale: వ్యక్తుల పేర్లకు ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణను ఉపయోగించింది.
- source_word: τὸν ἀδελφὸν Σίμωνος
  choice: అతని సోదరుడు
  rationale: అంద్రెయను సీమోను సోదరుడిగా గుర్తించే appositional genitive భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀμφιβάλλοντας ἐν τῇ θαλάσσῃ
  choice: సముద్రంలో వల వేస్తున్నారు
  rationale: ἀμφιβάλλω ప్రత్యేకంగా చేపల వల వేయడాన్ని సూచిస్తుంది; తెలుగు వాడుకలో 'సముద్రంలో వల వేయడం' సహజంగా చర్య యొక్క దిశను కూడా తెలియజేస్తుంది.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: ఎందుకంటే వారు జాలరులు
  rationale: γάρ ఇచ్చే వివరణాత్మక కారణ భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది; ἁλιεῖςకు 'జాలరులు' సంక్షిప్తమైన సహజ పదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సువార్త కథనానికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. గ్రీకు వాక్యంలోని దీర్ఘ కృదంత నిర్మాణాన్ని సహజ పఠనార్థం రెండు తెలుగు వాక్యాలుగా విభజించినా, సంఘటనల క్రమం మరియు γάρ యొక్క వివరణాత్మక సంబంధం నిలిపివేయబడ్డాయి.
