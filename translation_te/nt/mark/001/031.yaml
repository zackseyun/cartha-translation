source:
  edition: SBLGNT
  text: καὶ προσελθὼν ἤγειρεν αὐτὴν κρατήσας τῆς ⸀χειρός· καὶ ἀφῆκεν αὐτὴν ὁ ⸀πυρετός, καὶ διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/031.yaml
  text: And coming near[a], he raised her up, taking her by the hand; and the fever left her, and she served them.
translation:
  language: te
  text: ఆయన ఆమె దగ్గరకు వచ్చి, ఆమె చెయ్యి పట్టుకొని ఆమెను లేవనెత్తాడు. జ్వరం ఆమెను విడిచిపోయింది; ఆమె వారికి సేవ చేసింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమె వారికి సేవ చేయడం మొదలుపెట్టింది.” గ్రీకు అసంపూర్ణ భూతకాల క్రియ ఆమె సేవ చేస్తూ ఉండడాన్ని మాత్రమే వర్ణించవచ్చు; అయితే స్వస్థత పొందిన ఫలితంగా ఆమె సేవ చేయడం ప్రారంభించిందనే భావాన్నీ సందర్భం అనుమతిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: ఆమె దగ్గరకు వచ్చి
  rationale: ఈ భూతకాల అసమాపక క్రియ ప్రధాన చర్యకు ముందు యేసు ఆమెను సమీపించడాన్ని సూచిస్తుంది. కర్మ గ్రీకులో స్పష్టంగా లేకపోయినా సందర్భం వల్ల ఆమె అని తెలుస్తుంది; తెలుగులో సహజత కోసం దాన్ని వ్యక్తం చేశాం.
- source_word: ἤγειρεν
  choice: ఆమెను లేవనెత్తాడు
  rationale: ἐγείρω ఇక్కడ మంచం మీదున్న ఆమెను లేపడాన్ని సూచిస్తుంది. ‘లేవనెత్తాడు’ శారీరక చర్యను స్పష్టంగా చెబుతూ, మూలపదంలోని బలాన్ని కాపాడుతుంది.
- source_word: κρατήσας τῆς χειρός
  choice: ఆమె చెయ్యి పట్టుకొని
  rationale: κρατέω అంటే గట్టిగా పట్టుకోవడం లేదా పట్టుకొనడం. తెలుగులో ‘చెయ్యి పట్టుకొని’ సహజంగా ఉండి, ఆమెను లేవనెత్తిన విధానాన్ని తెలియజేస్తుంది.
- source_word: ἀφῆκεν αὐτὴν
  choice: ఆమెను విడిచిపోయింది
  rationale: జ్వరం ఆమెనుంచి తొలగిపోయిందనే భావంలో ἀφίημι వాడబడింది. ‘విడిచిపోయింది’ వ్యాధిని కర్తగా ఉంచిన గ్రీకు నిర్మాణాన్ని నిలుపుతుంది.
- source_word: πυρετός
  choice: జ్వరం
  rationale: తెలుగులో ఈ సందర్భంలో నిర్దిష్ట సూచనకు ప్రత్యేక నిర్దేశక పదం అవసరం లేదు; ‘జ్వరం’ సహజమైన సమానార్థకం.
- source_word: διηκόνει
  choice: సేవ చేసింది
  rationale: διακονέω ఇక్కడ అక్కడున్నవారికి అవసరమైన పరిచర్య చేయడాన్ని సూచిస్తుంది. అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న సేవను లేదా సేవ ఆరంభాన్ని సూచించవచ్చు; ప్రధాన పాఠం దానిని అతిగా నిర్దిష్టం చేయదు.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: బహువచన సర్వనామం యేసు ఒక్కరినే కాక అక్కడున్న సమూహాన్ని సూచిస్తుంది.
theological_decisions:
- issue: ἐγείρω పదానికి పునరుత్థాన భాషతో ఉండగల ప్రతిధ్వని
  choice: లేవనెత్తాడు
  alternative: లేపాడు / పైకి లేవడానికి సహాయం చేశాడు
  rationale: ఈ సందర్భంలో ఇది శారీరకంగా మంచం నుంచి లేపడమే. అయినా ‘లేవనెత్తాడు’ అనే పదం మూలంలోని బలమైన క్రియను నిలుపుతుంది; పునరుత్థాన భావాన్ని స్పష్టంగా చేర్చదు, అలాగే దాని సాధ్యమైన ప్రతిధ్వనిని పూర్తిగా తొలగించదు.
- issue: διηκόνει అనే అసంపూర్ణ భూతకాల క్రియ యొక్క దృక్కోణం
  choice: సేవ చేసింది
  alternative: సేవ చేయడం మొదలుపెట్టింది
  rationale: గ్రీకు అసంపూర్ణ భూతకాలం కొనసాగుతున్న చర్యను వర్ణించవచ్చు; సందర్భం స్వస్థత పొందిన వెంటనే సేవ మొదలుపెట్టిందనే భావాన్నీ అనుమతిస్తుంది. ప్రధాన పాఠంలో ‘మొదలుపెట్టింది’ అని నిర్బంధించకుండా, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. గృహసంబంధ సందర్భానికి అనుగుణంగా ‘సేవ చేసింది’ ఎంచుకుని, మరీ మతపరమైన ‘పరిచర్య చేసింది’ వంటి పదాన్ని ప్రధాన పాఠంలో నివారించాం.
