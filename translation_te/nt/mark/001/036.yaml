  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. ‘వెదుకుతూ వెంటపడ్డారు’ ద్వారా మూలంలోని బలమైన క్రియాభావాన్ని అతిశయోక్తి లేకుండా వ్యక్తం చేశాం.
