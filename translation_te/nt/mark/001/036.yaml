lexical_decisions:
- source_word: κατεδίωξεν
  choice: వెదుకుతూ వెంటపడ్డారు
  rationale: ఈ క్రియలో కేవలం వెదకడం కంటే బలమైన, పట్టుదలతో వెంబడించే భావం ఉంది. ‘వెదుకుతూ వెంటపడ్డారు’ అనేది సందర్భంలోని అన్వేషణనూ గ్రీకు క్రియలోని తీవ్రతనూ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: αὐτὸν
  choice: యేసును
  rationale: సర్వనామం సమీప సందర్భంలో యేసును సూచిస్తుంది. తెలుగులో కర్తల మధ్య గందరగోళం రాకుండా సూచిత నామాన్ని ఉపయోగించడం సహజం.
- source_word: Σίμων
  choice: సీమోను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన రూపాన్ని అనుసరించి వ్యక్తి పేరును లిప్యంతరీకరించాం.
- source_word: οἱ μετ’ αὐτοῦ
  choice: అతనితో ఉన్నవారు
  rationale: గ్రీకు పదబంధంలోని సాధారణ అర్థాన్ని అలాగే ఉంచి, వారు శిష్యులా లేక సహచరులా అనే అదనపు నిర్దిష్టతను చేర్చలేదు.
- source_word: καὶ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: గ్రీకులోని ప్రారంభ καὶ ముందరి కథనంతో వాక్యాన్ని కలుపుతుంది. తెలుగులో ‘సీమోను, అతనితో ఉన్నవారు’ అనే సహజ కథన నిర్మాణమే ఆ అనుసంధానాన్ని తెలియజేస్తుంది; ‘మరియు’ అని పెట్టడం కృత్రిమంగా ఉంటుంది.
theological_decisions: []
