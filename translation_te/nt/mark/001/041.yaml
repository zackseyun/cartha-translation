    text: కొన్ని ప్రతుల్లో “కనికరంతో కదిలి” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: కోపంతో
  rationale: SBLGNTలోని ὀργισθείς అనే పాఠానికి సహజమైన అర్థం ‘కోపంతో’ లేదా ‘కోపగించి.’ కోపానికి కారణాన్ని వచనం చెప్పనందున దానిని అనువాదంలో చేర్చలేదు.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: తన చెయ్యి చాపి
  rationale: చేతిని చాపిన స్పష్టమైన శారీరక చర్యను సహజమైన తెలుగు కథన క్రమంలో నిలుపుతుంది.
- source_word: ἥψατο
  choice: అతణ్ణి ముట్టుకొని
  rationale: ఈ సందర్భంలో ἅπτω మధ్యమ రూపం ‘ముట్టుకొను’ అనే అర్థాన్ని ఇస్తుంది; కుష్ఠరోగితో జరిగిన ప్రత్యక్ష శారీరక స్పర్శను ఇది స్పష్టంగా చూపుతుంది.
- source_word: λέγει αὐτῷ
  choice: అని అతనితో అన్నాడు
  rationale: గ్రీకులో ఇది చారిత్రక వర్తమాన కాలంలో ఉన్నప్పటికీ, ఆధునిక తెలుగు కథన శైలికి అనుగుణంగా భూతకాలంలో అనువదించబడింది.
- source_word: Θέλω
  choice: నాకు ఇష్టమే
  rationale: ఇక్కడ θέλω భవిష్యత్తును కాక, స్వచ్ఛంద సమ్మతిని మరియు సిద్ధతను వ్యక్తపరుస్తుంది. ముందు వచనంలోని రోగి మాటకు సహజమైన ప్రత్యుత్తరంగా ‘నాకు ఇష్టమే’ నిలుస్తుంది.
- source_word: καθαρίσθητι
  choice: శుద్ధుడివి అవు
  rationale: καθαρίζω యొక్క కర్మణి ఆజ్ఞార్థక రూపం శారీరక స్వస్థతతో పాటు శుద్ధత భావాన్నీ కలిగి ఉంది. ‘శుద్ధుడివి అవు’ ఆ విస్తృత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యేసు భావోద్వేగాన్ని వర్ణించే పదంలోని పాఠాంతరం
  choice: ప్రధాన పాఠంలో SBLGNTలోని ὀργισθείςను ‘కోపంతో’ అని అనువదించడం
  alternative: ‘కనికరంతో కదిలి’
  rationale: అందించిన మూల గ్రీకు పాఠానికి ప్రాధాన్యం ఇచ్చి ప్రధాన పాఠంలో కోపాన్ని నిలిపాము. ఈ పాఠాంతరం యేసు భావోద్వేగ చిత్రణను గణనీయంగా మార్చుతుంది కాబట్టి, ప్రత్యామ్నాయ పాఠాన్ని పాదసూచికలో తెలిపాము; కోపానికి కారణాన్ని ఊహించి వేదాంతపరంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘చెయ్యి,’ ‘ముట్టుకొని’ సహజమైన ప్రస్తుత తెలుగు రూపాలు; ‘శుద్ధుడివి అవు’ మూలంలోని శారీరక-ఆచార సంబంధ ద్వంద్వ భావాన్ని నిలుపుతుంది.
