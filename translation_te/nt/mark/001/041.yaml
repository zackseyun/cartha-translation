  yaml_path: translation/nt/mark/001/041.yaml
  text: And being angry[a], he stretched out his hand, touched him, and said to him, “I am willing; be cleansed.”
translation:
  language: te
  text: ఆయన కోపంతో[a] తన చెయ్యి చాపి అతణ్ణి తాకి, “నాకు ఇష్టమే; శుద్ధుడవు” అని అతనితో అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
