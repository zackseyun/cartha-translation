id: MRK.1.26
reference: Mark 1:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ σπαράξαν αὐτὸν τὸ πνεῦμα τὸ ἀκάθαρτον καὶ ⸀φωνῆσαν φωνῇ μεγάλῃ ἐξῆλθεν ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/026.yaml
  text: And the unclean spirit[a], after convulsing him and crying out with a loud voice[b], came out of him.
translation:
  language: te
  text: అపవిత్ర ఆత్మ అతనిని గిలగిల కొట్టించి[a], పెద్దగా కేక వేసి[b], అతనిలోనుండి బయటికి వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనిని విలవిలలాడించి.”
    reason: σπαράξανకు తీవ్రమైన శారీరక కుదుపు లేదా మెలికలు కలిగించడం అనే భావాన్ని చూపే సహజమైన ప్రత్యామ్నాయం.
  - marker: b
    text: లేదా, “బిగ్గర స్వరంతో.”
    reason: φωνῇ μεγάλῃలో ఉన్న “స్వరంతో” అనే పదాన్ని నిలుపుతూ, దాని సహజమైన భావాన్ని తెలియజేస్తుంది.
lexical_decisions:
- source_word: σπαράξαν αὐτόν
  choice: అతణ్ణి గిలగిల కొట్టుకునేలా చేసి
  rationale: ఈ భూతకాల అసమాపక క్రియ ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచిస్తుంది. ఆ ఆత్మ ఆ మనిషికి మూర్ఛవంటి తీవ్రమైన శరీర కదలికలు కలిగించిందనే భావాన్ని ఈ సహజమైన తెలుగు ప్రయోగం స్పష్టంగా తెలియజేస్తుంది; ‘చీల్చి’ అనే అతి అక్షరార్థ అనువాదం కలిగించే అపార్థాన్ని నివారిస్తుంది.
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: అపవిత్రాత్మ
  rationale: సువార్తల్లో దయ్య సంబంధమైన వ్యక్తిగత ఆత్మను సూచించే స్థిరమైన పదబంధం. ‘అపవిత్ర’ అనే మాట ἀκάθαρτος లోని అపవిత్రత భావాన్ని నిలుపుతుంది.
- source_word: φωνῆσαν φωνῇ μεγάλῃ
  choice: పెద్దగా కేక వేసి
  rationale: తెలుగులో సహజంగా ఉండే ఈ ప్రయోగం బిగ్గరగా వెలువడిన నాటకీయ స్వరాన్ని తెలియజేస్తుంది. గ్రీకులోని ‘గొప్ప స్వరంతో’ అనే నిర్మాణాన్ని అక్షరార్థంగా ప్రధాన పాఠ్యంలో ఉంచకుండా, దాని భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἐξῆλθεν ἐξ αὐτοῦ
  choice: అతనిలో నుంచి బయటికి వచ్చింది
  rationale: ఆ ఆత్మ ఆ మనిషిని విడిచి వెళ్లడాన్ని వ్యక్తిగతమైన, స్థలసంబంధ భావంతో నేరుగా తెలియజేస్తుంది.
- source_word: καὶ ... καὶ
  choice: అప్పుడు ... చేసి ... వేసి
  rationale: మార్కు కథనంలోని కొనసాగింపును ‘అప్పుడు’ తెలియజేస్తుంది; రెండు అసమాపక క్రియలను తెలుగులో సహజమైన క్రమంతో ప్రధాన క్రియకు అనుసంధానించింది.
theological_decisions:
- issue: ఆవహించిన సత్తా స్వభావం
  choice: ‘అపవిత్రాత్మ’ను చర్యలు చేసే వ్యక్తిగత సత్తాగా చూపించడం
  alternative: వ్యక్తిత్వం లేని దుష్టశక్తిగా చూపించడం
  rationale: మార్కు కథనంలో అది మనిషిని గిలగిల కొట్టుకునేలా చేస్తుంది, కేక వేస్తుంది, అతనిలో నుంచి బయటికి వస్తుంది. అందువల్ల మూలపాఠ్యంలో ఉన్న వ్యక్తిగత కర్తృత్వాన్ని అనువాదం నిలుపుతుంది; దానికిమించి సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గంభీరతను కాపాడుతూ అనువదించబడింది. అసమాపక క్రియల క్రమం ఆత్మ బయటికి రావడానికి ముందు జరిగిన చర్యలను స్పష్టంగా చూపుతుంది.
