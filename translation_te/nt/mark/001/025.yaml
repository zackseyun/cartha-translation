revisions:
- from: అప్పుడు యేసు ఆ అపవిత్రాత్మను గద్దిస్తూ, “నోరు మూసుకొని, ఇతనిలోనుంచి బయటికి రా!”[a] అని అన్నాడు.
  to: యేసు ఆ అపవిత్రాత్మను గద్దించి, “నోరు మూసుకో, ఇతనిలోనుండి బయటికి రా!”[a] అని అన్నాడు.
  rationale: Removed the unsupported temporal connective, rendered the aorist rebuke as a completed action, and made the imperative sequence idiomatic Telugu. The explicit noun ‘ఆ అపవిత్రాత్మను’ is retained to make the contextual referent clear, while ‘ఇతనిలోనుండి’ preserves the distinction between the spirit addressed and the afflicted man. The footnote now reflects the passive imagery of the Greek lexical form.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:00:33Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the rebuked and addressed referent as the unclean spirit and preserves the distinction from the man indicated by ‘out of him.’ However, ‘అప్పుడు’ adds a temporal nuance not expressed by καὶ, and ‘గద్దిస్తూ ... అని అన్నాడు’ does not represent the completed main verb ἐπετίμησεν as directly as Telugu ‘గద్దించి ... అన్నాడు.’
  naturalness: The revision uses fluent modern standard Telugu. ‘నోరు మూసుకో’ is a firm, idiomatic direct command; the two imperatives are coordinated naturally without implying that silence is merely a preliminary action.
  terminology: ‘అపవిత్రాత్మ’ appropriately renders the narrative referent in context. ‘గద్దించి’ communicates ἐπετίμησεν’s authoritative sharp rebuke without overtranslating it as a separate command. The footnote preserves the vivid muzzle imagery of Φιμώθητι while correctly reflecting its passive form.
  issues:
  - severity: low
    issue: ‘అప్పుడు’ for καὶ
    rationale: The Greek conjunction simply connects the action. ‘అప్పుడు’ can impose an explicit temporal sense not required by the source.
  - severity: medium
    issue: ‘గద్దిస్తూ ... అని అన్నాడు’ for ἐπετίμησεν λέγων
    rationale: The Greek has a completed main action (‘rebuked’) followed by a participle introducing the words spoken. ‘గద్దించి ... అన్నాడు’ more accurately and naturally represents this relation.
  - severity: low
    issue: Footnote wording uses an active/reflexive form
    rationale: ‘మూతికి చిక్కం వేసుకో’ means ‘put a muzzle on yourself,’ whereas Φιμώθητι is formally passive, ‘be muzzled.’
  revised_text: యేసు ఆ అపవిత్రాత్మను గద్దించి, “నోరు మూసుకో, ఇతనిలోనుండి బయటికి రా!”[a] అని అన్నాడు.
  revised_footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మూతికి చిక్కం వేయబడుము.”
    reason: lexical_alternative
  revision_rationale: Removed the unsupported temporal connective, rendered the aorist rebuke as a completed action, and made the imperative sequence idiomatic Telugu. The explicit noun ‘ఆ అపవిత్రాత్మను’ is retained to make the contextual referent clear, while ‘ఇతనిలోనుండి’ preserves the distinction between the spirit addressed and the afflicted man. The footnote now reflects the passive imagery of the Greek lexical form.
