  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/025.yaml
  text: And Jesus rebuked him[a], saying, “Be silent, and come out of him!”
translation:
  language: te
  text: యేసు ఆ అపవిత్రాత్మను గద్దించి, “నోరు మూసుకో, ఇతనిలోనుండి బయటికి రా!”[a] అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మూతికి చిక్కం వేయబడుము.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: గద్దిస్తూ
  rationale: ఈ క్రియ కఠినంగా మందలించడాన్ని, అధికారంతో ఆజ్ఞాపించడాన్ని సూచిస్తుంది. ‘గద్దిస్తూ’ అనేది మాటలోని తీవ్రతను, యేసు అధికారాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: αὐτῷ
  choice: ఆ అపవిత్రాత్మను
  rationale: గ్రీకులో పురుషలింగ ఏకవచన సర్వనామం ఉంది. ముందరి సందర్భం మరియు ‘ఇతనిలోనుంచి బయటికి రా’ అనే ఆజ్ఞ ప్రకారం అది మనిషిని కాదు, అపవిత్రాత్మను సూచిస్తుంది. తెలుగులో సూచన స్పష్టంగా ఉండేందుకు నామవాచకాన్ని పునరుక్తి చేశాం.
- source_word: λέγων
  choice: అని అన్నాడు
  rationale: ఈ వర్తమాన కృదంతం గద్దింపులో పలికిన మాటలను పరిచయం చేస్తుంది. తెలుగు వాక్య నిర్మాణంలో ‘అని అన్నాడు’ సహజంగా ఉండి ఆ సంబంధాన్ని నిలుపుతుంది.
- source_word: Φιμώθητι
  choice: నోరు మూసుకొని
  rationale: φιμόω యొక్క మౌలిక భావం మూతికి చిక్కం వేయడం; ఇక్కడ బలవంతంగా మౌనంగా ఉండమనే ఆజ్ఞ. ‘నోరు మూసుకొని’ ఆ ఆజ్ఞలోని తీవ్రతను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἔξελθε
  choice: బయటికి రా
  rationale: ఈ సందర్భంలో ఆవహించిన మనిషిలోనుంచి వెలుపలికి రావాలనే ఆజ్ఞ. ‘బయటికి రా’ ప్రత్యక్ష సంభాషణలో సహజమైన, స్పష్టమైన తెలుగు.
- source_word: ἐξ αὐτοῦ
  choice: ఇతనిలోనుంచి
  rationale: ἐξ లోపలి నుంచి వెలుపలికి కదలికను సూచిస్తుంది. ‘ఇతనిలోనుంచి’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తూ, సంబోధించబడిన ఆత్మకు మరియు బాధితుడైన మనిషికి మధ్య తేడాను నిలుపుతుంది.
theological_decisions:
- issue: యేసు ఎవరిని గద్దించాడు?
  choice: యేసు అపవిత్రాత్మను నేరుగా గద్దించాడు.
  alternative: వ్యాకరణపరంగా సమీప సూచనగా మనిషినే గద్దించాడని తీసుకోవడం.
  rationale: ముందరి సందర్భం మాట్లాడుతున్న శక్తిని అపవిత్రాత్మగా గుర్తిస్తుంది; ‘ఇతనిలోనుంచి బయటికి రా’ అనే మాట సంబోధితుడు ఆత్మేనని, ‘ఇతను’ బాధితుడైన మనిషని చూపుతుంది. అదనపు సిద్ధాంత నిర్ధారణలు చేర్చకుండా కథనంలోని ఈ భేదాన్ని అనువాదం స్పష్టంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి. ‘నోరు మూసుకొని’ కఠినమైన ప్రత్యక్ష ఆజ్ఞ; పాదసూచిక గ్రీకు పదంలోని ‘మూతికి చిక్కం వేయడం’ అనే సజీవ రూపకాన్ని కాపాడుతుంది.
