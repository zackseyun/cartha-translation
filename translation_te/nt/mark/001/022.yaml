revisions:
- from: ఆయన బోధకు వారు ఆశ్చర్యచకితులయ్యారు. ఎందుకంటే ఆయన అధికారంగలవానిలా[a] వారికి బోధిస్తున్నాడు, శాస్త్రులలా కాదు.
  to: ఆయన బోధకు వారు ఆశ్చర్యపోయారు; ఎందుకంటే ఆయన అధికారమున్నవానిలా వారికి బోధించేవాడు, శాస్త్రులవలె కాదు.[a]
  rationale: The revision keeps the descriptive contrast without defining the source of Jesus’ authority. It changes the main verb to a past narrative form and uses “బోధించేవాడు” to express the Greek ongoing past teaching naturally. The footnote marker is placed on the authority expression it explains.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:00:31Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the teaching, the contrast of authority, and the scribes. However, the present-tense “బోధిస్తున్నాడు” is not suitable in this past narrative and does not consistently represent the Greek imperfect/periphrastic past construction.
  naturalness: The wording is generally clear and modern, but “అధికారంగలవానిలా” is less idiomatic than “అధికారమున్నవానిలా,” and the narrative flows more naturally with past habitual/continuous wording.
  terminology: “బోధ,” “అధికారం,” and “శాస్త్రులు” are appropriate. “శాస్త్రులు” is retained as a concise conventional rendering of γραμματεῖς, without adding interpretive detail.
  issues:
  - severity: medium
    issue: Past narrative is rendered with a present-tense verb.
    rationale: ἦν ... διδάσκων is a past periphrastic imperfect. “ఆయన ... బోధిస్తున్నాడు” means ‘he is teaching,’ whereas the context requires ‘he was/used to be teaching.’
  - severity: low
    issue: The Telugu authority expression is somewhat awkward.
    rationale: “అధికారమున్నవానిలా” is the more natural modern-standard Telugu expression while preserving ὡς ἐξουσίαν ἔχων (‘as one having authority’).
  revised_text: ఆయన బోధకు వారు ఆశ్చర్యపోయారు; ఎందుకంటే ఆయన అధికారమున్నవానిలా వారికి బోధించేవాడు, శాస్త్రులవలె కాదు.[a]
  revised_footnotes:
  - marker: a
    text: లేదా, “అధికారం కలిగినవానిలా”; మరింత సహజంగా, “అధికారంతో.”
    reason: lexical_alternative
  revision_rationale: The revision keeps the descriptive contrast without defining the source of Jesus’ authority. It changes the main verb to a past narrative form and uses “బోధించేవాడు” to express the Greek ongoing past teaching naturally. The footnote marker is placed on the authority expression it explains.
