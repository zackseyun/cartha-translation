source:
  edition: SBLGNT
  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/022.yaml
  text: And they were astonished at his teaching[a], for he was teaching them as one having authority, and not as the scribes.
translation:
  language: te
  text: ఆయన బోధకు వారు ఆశ్చర్యపోయారు; ఎందుకంటే ఆయన అధికారమున్నవానిలా వారికి బోధించేవాడు, శాస్త్రులవలె కాదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అధికారం కలిగినవానిలా”; మరింత సహజంగా, “అధికారంతో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: ఆశ్చర్యచకితులయ్యారు
  rationale: బలమైన ఆశ్చర్యాన్ని తెలిపే పదం. గ్రీకు అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న ప్రతిస్పందనను తెలుగు కథనశైలిలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: ఆయన బోధకు
  rationale: ఇక్కడ διδαχή ఆయన బోధించిన విషయం లేదా బోధించిన తీరును సూచించవచ్చు. ‘బోధ’ ఈ భావవ్యాప్తిని సహజంగా నిలుపుతుంది.
- source_word: ἦν γὰρ διδάσκων
  choice: ఎందుకంటే ఆయన ... బోధిస్తున్నాడు
  rationale: ἦν మరియు వర్తమాన కృదంతం కలిసిన నిర్మాణం కొనసాగుతున్న క్రియను సూచిస్తుంది; ‘బోధిస్తున్నాడు’ దానిని తెలుగులో సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: అధికారంగలవానిలా
  rationale: ὡς ద్వారా వ్యక్తమైన పోలికను, ἐξουσίαలోని అధికారం/హక్కు భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: γραμματεῖς
  choice: శాస్త్రులు
  rationale: యూదుల ధర్మశాస్త్రంలో నిపుణులైన లేఖకులను సూచించే సంప్రదాయబద్ధమైన, సంక్షిప్తమైన తెలుగు పదం.
theological_decisions:
- issue: శాస్త్రులతో పోల్చినప్పుడు యేసు అధికార స్వభావం
  choice: మూలంలో ఉన్నట్లే ఆయన అధికారంగలవానిలా బోధించాడని వర్ణనాత్మకంగా అనువదించడం
  alternative: ‘దైవిక అధికారంతో’ అని వ్యాఖ్యానాత్మకంగా విస్తరించడం
  rationale: ఈ వాక్యం యేసు బోధనా తీరును శాస్త్రుల తీరుతో స్పష్టంగా పోలుస్తుంది; అయితే ఆ అధికార మూలాన్ని లేదా స్వరూపాన్ని ఇక్కడ నేరుగా నిర్వచించదు. అందువల్ల అదనపు సిద్ధాంత వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘శాస్త్రులు’ అనే పదం చారిత్రక యూదు సందర్భాన్ని సంక్షిప్తంగా నిలుపుతుంది; పాదసూచిక గ్రీకు పోలికకు దగ్గరైన రూపంతో పాటు సహజమైన ప్రత్యామ్నాయాన్ని ఇస్తుంది.
