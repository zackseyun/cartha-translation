translation_notes:
  register: సరళమైన, ఆధునిక, గౌరవప్రదమైన ప్రామాణిక తెలుగు. మార్కు కథనంలోని వేగవంతమైన ప్రవాహాన్ని తెలుగు వరుస క్రియారూపంతో నిలిపి, గ్రీకు చారిత్రక వర్తమానాన్ని సహజమైన తెలుగు భూతకాలంలో అందించాం.
