  text: καὶ ⸂εὗρον αὐτὸν καὶ⸃ λέγουσιν αὐτῷ ὅτι Πάντες ⸂ζητοῦσίν σε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/037.yaml
  text: And they found him and said to him[a], “Everyone is looking for you.”
translation:
  language: te
  text: వారు ఆయనను కనుగొని ఆయనతో, “అందరూ మీ కోసం వెతుకుతున్నారు[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అందరూ మిమ్మల్ని వెదుకుతున్నారు.” గ్రీకు ζητοῦσίν అనే పదాన్ని “వెదుకుతున్నారు” అని కూడా అనువదించవచ్చు; అయితే ఈ సందర్భంలో ప్రజలు యేసు ఎక్కడున్నారో కనుగొనడానికి ప్రయత్నిస్తున్నారని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρον
  choice: కనుగొని
  rationale: εὑρίσκω యొక్క భూతకాల కథన రూపం, వెదకడం విజయవంతమై ఆయనను కనుగొన్నారని సూచిస్తుంది; ‘కనుగొని’ సహజమైన ప్రత్యక్ష సమానం.
- source_word: λέγουσιν
  choice: చెప్పారు
  rationale: గ్రీకులో ఇది చారిత్రక వర్తమాన కాలంలో ఉన్నా, తెలుగు కథన ప్రవాహంలో భూతకాలమైన ‘చెప్పారు’ సహజంగా ఉంటుంది.
- source_word: ὅτι
  choice: ప్రత్యక్ష ఉల్లేఖన చిహ్నాలు మరియు ‘అని’
  rationale: ὅτι ఇక్కడ ప్రత్యక్ష మాటలను పరిచయం చేస్తుంది; తెలుగులో ఉల్లేఖన చిహ్నాలతో పాటు వాక్యాంతంలో ‘అని’ ఉపయోగించడం సహజం.
- source_word: Πάντες
  choice: అందరూ
  rationale: సందర్భంలో యేసును వెదుకుతున్న ప్రజల సమూహాన్ని సహజంగా సూచిస్తుంది; తక్షణ సందర్భాన్ని మించి సంపూర్ణ విశ్వవ్యాప్తతను బలవంతంగా సూచించదు.
- source_word: ζητοῦσίν σε
  choice: మీ కోసం వెతుకుతున్నారు
  rationale: ζητέω కు ‘వెదకు/అన్వేషించు’ అనే విస్తృత అర్థం ఉన్నా, ఈ సందర్భంలో ప్రజలు యేసు ఎక్కడున్నారో కనుగొనడానికి ప్రయత్నిస్తున్నారనే భౌతిక అన్వేషణ భావానికి ‘మీ కోసం వెతుకుతున్నారు’ సహజమైన ఆధునిక తెలుగు.
- source_word: καὶ
  choice: వారు ... కనుగొని
  rationale: καί యొక్క అనుసంధాన భావాన్ని తెలుగు వరుస క్రియారూపమైన ‘కనుగొని’ సహజంగా వ్యక్తం చేస్తుంది; అదనపు కారణార్థం లేదా కాలార్థం చేర్చదు.
- source_word: αὐτὸν / αὐτῷ / σε
  choice: ఆయనను / ఆయనతో / మీ
  rationale: విభక్తి విధులను నేరుగా ప్రతిబింబిస్తూ, యేసును ఉద్దేశించిన గౌరవప్రదమైన ఆధునిక తెలుగు సర్వనామాలను ఉపయోగించాం.
