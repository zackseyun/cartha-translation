source:
  edition: SBLGNT
  text: ⸂καὶ ἦν⸃ ὁ Ἰωάννης ἐνδεδυμένος τρίχας καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, καὶ ἔσθων ἀκρίδας καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/006.yaml
  text: John was clothed with camel’s hair and a leather belt around his waist[a], and he was eating locusts and wild honey.
translation:
  language: te
  text: యోహాను ఒంటె వెంట్రుకలతో చేసిన వస్త్రాన్ని ధరించి, తన నడుము చుట్టూ తోలు నడికట్టును కట్టుకుని ఉండేవాడు[a]; అతడు మిడతలను, అడవి తేనెను తింటూ ఉండేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యోహాను ధరించిన దుస్తులు 2 రాజులు 1:8లోని ఏలీయా వర్ణనను జ్ఞాపకం చేస్తాయి. ఇలా మార్కు యోహానును ముందుగా దారి చూపే ప్రవక్తగా చిత్రిస్తున్నాడు.
    reason: cross_reference
lexical_decisions:
- source_word: ἐνδεδυμένος τρίχας καμήλου
  choice: ఒంటె వెంట్రుకల వస్త్రం ధరించి
  rationale: గ్రీకు పదబంధం ఒంటె చర్మాన్ని కాకుండా ఒంటె వెంట్రుకలతో చేసిన వస్త్రాన్ని సూచిస్తుంది. ‘వస్త్రం’ అని స్పష్టీకరించడం ఆధునిక తెలుగులో సహజంగా ఉండి ఉద్దేశించిన భావాన్ని తెలియజేస్తుంది; పరిపూర్ణ కృదంతం సూచించే ధరించి ఉన్న స్థితిని ‘ధరించి’ నిలుపుతుంది.
- source_word: ζώνην δερματίνην
  choice: తోలు నడికట్టు
  rationale: ζώνη నడుము చుట్టూ కట్టుకునే బెల్టు లేదా నడికట్టు; δερματίνη దాని పదార్థం తోలు అని తెలుపుతుంది. ప్రాచీన దుస్తుల సందర్భంలో ‘తోలు నడికట్టు’ సహజమైన, స్పష్టమైన తెలుగు.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: తన నడుముకు ... కట్టుకున్నాడు
  rationale: ὀσφύς నడుము ప్రాంతాన్ని సూచిస్తుంది. తెలుగులో ‘నడుముకు ... కట్టుకున్నాడు’ అనేది ‘నడుము చుట్టూ’ అనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἔσθων
  choice: తింటూ ఉండేవాడు
  rationale: వర్తమాన కృదంతం యోహాను ఆహారపు అలవాటును లేదా కొనసాగుతున్న వర్ణనాత్మక చర్యను సూచించగలదు. ‘తింటూ ఉండేవాడు’ ఆ ఆచారార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀκρίδας
  choice: మిడతలను
  rationale: ἀκρίς యొక్క సాధారణ అర్థం తినదగిన మిడత అనే పురుగు; సందర్భంలో వేరే అర్థం తీసుకోవడానికి ఆధారం లేదు.
- source_word: μέλι ἄγριον
  choice: అడవి తేనెను
  rationale: μέλι ἄγριον అంటే అడవిలో లభించే తేనె. ‘అడవి తేనె’ సంక్షిప్తమైన, ప్రాచుర్యంలో ఉన్న తెలుగు ప్రయోగం.
- source_word: καὶ ἦν
  choice: ప్రత్యేక ఆరంభ అవ్యయం లేకుండా వాక్య నిర్మాణంలో కొనసాగింపు
  rationale: καί కథనాన్ని కొనసాగిస్తుంది; దానికి ప్రత్యేకంగా ‘ఇప్పుడు’ అనే కాలార్థం లేదు. తెలుగులో వాక్య సంబంధం ద్వారానే కొనసాగింపును సహజంగా తెలియజేయవచ్చు.
theological_decisions:
- issue: యోహాను దుస్తులు ఏలీయా రూపాన్ని జ్ఞాపకం చేయడం
  choice: ప్రధాన పాఠ్యంలో యోహాను రూపాన్ని వర్ణనాత్మకంగానే అనువదించి, ఏలీయాతో సంబంధాన్ని పాదసూచికలో పేర్కొనడం
  alternative: ప్రధాన పాఠ్యంలోనే యోహానును ఏలీయా వంటి ప్రవక్తగా స్పష్టంగా గుర్తించడం
  rationale: మార్కు 1:6 దుస్తులు 2 రాజులు 1:8లోని ఏలీయా వర్ణనను జ్ఞాపకం చేసినా, ఈ వచనం ఆ గుర్తింపును ప్రత్యక్షంగా ప్రకటించదు. అందువల్ల అంతర్పాఠ్య సూచనను నిలుపుతూ, పాఠ్యంలో లేని సిద్ధాంతాత్మక వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గౌరవప్రదమైన బైబిలు కథన శైలిలో రూపొందించబడింది. ‘ఒంటె వెంట్రుకల వస్త్రం’ చర్మం అనే అపార్థాన్ని నివారిస్తుంది; ‘నడికట్టు’ ప్రాచీన దుస్తుల సందర్భానికి సరిపోతుంది. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో సంబంధిత దుస్తుల వర్ణన వెంట ఉంచబడింది.
