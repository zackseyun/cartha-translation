id: MRK.1.45
reference: Mark 1:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἐξελθὼν ἤρξατο κηρύσσειν πολλὰ καὶ διαφημίζειν τὸν λόγον, ὥστε μηκέτι αὐτὸν δύνασθαι φανερῶς εἰς πόλιν εἰσελθεῖν, ἀλλὰ ἔξω ⸀ἐπ’ ἐρήμοις τόποις ἦν· καὶ ἤρχοντο πρὸς αὐτὸν ⸀πάντοθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/045.yaml
  text: But after he went out, he began to proclaim widely and to spread the message, so that Jesus could no longer enter a town openly, but stayed outside in deserted places; and people were coming to him from everywhere.
translation:
  language: te
  text: అయితే అతడు బయటికి వెళ్లిన తర్వాత, ఎంతో ప్రకటించడం, ఆ వార్తను వ్యాప్తి చేయడం మొదలుపెట్టాడు. అందువల్ల యేసు ఇక ఏ పట్టణంలోకీ బహిరంగంగా ప్రవేశించలేక, బయట నిర్జన ప్రదేశాల్లో ఉండేవాడు. అయినా ప్రజలు అన్ని వైపుల నుంచీ ఆయన దగ్గరికి వచ్చేవారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κηρύσσειν πολλὰ
  choice: విస్తృతంగా ప్రకటిస్తూ
  rationale: πολλά ఇక్కడ ప్రకటించిన విషయాల సంఖ్యకన్నా ప్రకటన విస్తృతిని లేదా అధికతను సూచిస్తుంది; సహజమైన తెలుగులో భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: διαφημίζειν τὸν λόγον
  choice: జరిగిన సంగతిని ... ప్రచారం చేయడం
  rationale: τὸν λόγον అనేది ఈ సందర్భంలో స్వస్థతకు సంబంధించిన వార్త లేదా సంగతి; 'వాక్యం' అని అనువదిస్తే తెలుగులో అనవసరమైన సాంకేతిక ధార్మిక భావం కలగవచ్చు.
- source_word: φανερῶς
  choice: బహిరంగంగా
  rationale: దాచుకోకుండా, ప్రజల దృష్టికి కనిపించే విధంగా ప్రవేశించడాన్ని నేరుగా వ్యక్తపరుస్తుంది.
- source_word: ἐπ’ ἐρήμοις τόποις
  choice: జనసంచారం లేని ప్రదేశాల్లో
  rationale: ἐρήμοις అనేది తప్పనిసరిగా ఎడారిని కాక, నిర్జనమైన లేదా జనావాసానికి దూరమైన ప్రదేశాలను సూచిస్తుంది.
- source_word: ἤρχοντο ... πάντοθεν
  choice: అన్ని వైపుల నుంచీ ... వస్తూనే ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతూ లేదా పునరావృతంగా జరిగిన రాకను సూచిస్తుంది.
theological_decisions:
- issue: αὐτόν యొక్క సూచ్యుడు
  choice: యేసు
  alternative: అతడు
  rationale: గ్రీకు సర్వనామం వ్యాకరణపరంగా సందర్భం ద్వారా యేసును సూచిస్తుంది; తెలుగులో వరుసగా రెండు పురుష సర్వనామాలు వస్తే కుష్ఠరోగి లేదా యేసు అనే అయోమయం ఏర్పడుతుంది కాబట్టి పేరును స్పష్టం చేశాం.
- issue: τὸν λόγον యొక్క అర్థం
  choice: జరిగిన సంగతి
  alternative: వాక్యం / సందేశం
  rationale: సమీప సందర్భం యేసు చేసిన స్వస్థతను సూచిస్తుంది. అయినప్పటికీ దాన్ని అతి నిర్దిష్టంగా 'తన స్వస్థత' అని పరిమితం చేయకుండా మూలంలోని కొంత విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కథన శైలి. మూలంలోని కారణ-ఫలిత సంబంధం, కొనసాగుతున్న క్రియాభావం, నిర్జన ప్రదేశాల భావం సహజంగా నిలిపివేయబడ్డాయి.
