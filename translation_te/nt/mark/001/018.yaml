  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἀφέντες τὰ ⸀δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/018.yaml
  text: And immediately they left the nets and followed him[a].
translation:
  language: te
  text: వెంటనే[a] వారు వలలను విడిచిపెట్టి ఆయనను అనుసరించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ క్షణమే.’
    reason: εὐθὺς పదానికి తక్షణత్వాన్ని వ్యక్తం చేసే మరో సహజ తెలుగు అనువాదం.
lexical_decisions:
- source_word: καὶ
  choice: (ప్రత్యేకంగా అనువదించలేదు)
  rationale: తెలుగులో వాక్యారంభంలో ‘మరియు’ అనడం సహజంగా ఉండదు. ముందు వాక్యంతోని కథన కొనసాగింపు పదక్రమం ద్వారానే స్పష్టమవుతుంది; కొత్త భావసూచన ఏదీ చేర్చలేదు.
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: ఆలస్యం లేకుండా తక్షణమే జరిగిన చర్యను సూచించే సహజమైన ఆధునిక తెలుగు పదం; మార్కు కథనంలోని వేగాన్ని నిలుపుతుంది.
- source_word: ἀφέντες
  choice: విడిచిపెట్టి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచించే గ్రీకు ఏరిస్ట్ పార్టిసిపల్‌ను తెలుగు పూర్వకాలిక క్రియారూపంతో సహజంగా వ్యక్తం చేస్తుంది. ‘త్యజించి’ అనడం మూలంలో లేని భావోద్వేగ తీవ్రతను చేర్చవచ్చు.
- source_word: τὰ δίκτυα
  choice: వలలను
  rationale: గ్రీకులో ఉన్న నిర్దిష్ట ఆర్టికల్‌కు తెలుగులో విడిగా సమాన పదం అవసరం లేదు. సందర్భంలో అవి వారి వలలేనని అర్థమైనా, మూలంలో లేని స్వామ్యసూచకాన్ని చేర్చలేదు.
- source_word: ἠκολούθησαν
  choice: అనుసరించారు
  rationale: ఈ పదం శారీరకంగా వెంబడి వెళ్లడాన్నీ, సందర్భంలో రూపుదిద్దుకుంటున్న శిష్యత్వ భావాన్నీ ఒకేసారి నిలుపుతుంది.
- source_word: αὐτῷ
  choice: ఆయనను
  rationale: సమీప సందర్భంలో ఈ సర్వనామం యేసును సూచిస్తుంది. మూలంలోని సర్వనామాన్ని పేరుతో విస్తరించకుండా, గౌరవప్రదమైన సహజ తెలుగు సర్వనామంతో అనువదించాం.
theological_decisions:
- issue: ἠκολούθησαν లోని శిష్యత్వ భావం
  choice: ‘ఆయనను అనుసరించారు’ అని అనువదించడం
  alternative: ‘ఆయన శిష్యులయ్యారు’ లేదా ‘ఆయనతో వెళ్లారు’
  rationale: ‘అనుసరించారు’ అనే రూపం ప్రత్యక్షంగా ఆయన వెంట వెళ్లడం మరియు శిష్యత్వానికి సంబంధించిన అంతర్భావం రెండింటినీ నిలుపుతుంది. ‘శిష్యులయ్యారు’ అని విస్తరించడం మూలపాఠం చెప్పినదానికంటే వ్యాఖ్యానాన్ని ఎక్కువగా చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన కథన శైలి. ‘వెంటనే’ని వాక్యారంభంలో ఉంచడం ద్వారా మార్కు రచనలోని వేగం స్పష్టమవుతుంది. పాదసూచిక గుర్తును అది వివరిస్తున్న పదం వెంట ఉంచాం.
