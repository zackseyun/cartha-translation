id: MRK.1.15
reference: Mark 1:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγων ὅτι Πεπλήρωται ὁ καιρὸς καὶ ἤγγικεν ἡ βασιλεία τοῦ θεοῦ· μετανοεῖτε καὶ πιστεύετε ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/015.yaml
  text: and saying[a], “The time has been fulfilled, and the kingdom of God has drawn near[b]. Repent and believe in the good news.”
translation:
  language: te
  text: 'ఆయన ఇలా చెప్పాడు: “సమయం నెరవేరింది; దేవుని రాజ్యం[a] సమీపించింది. పశ్చాత్తాపపడండి; శుభవార్తను[b] నమ్మండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని పరిపాలన.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “సువార్తను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπλήρωται
  choice: నెరవేరింది
  rationale: పరిపూర్ణ కాలరూపం పూర్తయిన కార్యం వల్ల ప్రస్తుతం కొనసాగుతున్న ఫలితాన్ని సూచిస్తుంది; ‘నెరవేరింది’ దీనిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καιρὸς
  choice: నిర్ణయించిన సమయం
  rationale: ఇక్కడ καιρός సాధారణ కాలాన్ని కాక నిర్ణాయకమైన, నియమిత సందర్భాన్ని సూచిస్తుంది; తెలుగులో ఆ భావాన్ని స్పష్టంగా అందించేందుకు ‘నిర్ణయించిన సమయం’ ఎంచుకున్నాం.
- source_word: ἤγγικεν
  choice: సమీపించింది
  rationale: పరిపూర్ణ కాలరూపం దగ్గరకు వచ్చి ఇప్పుడు సమీపంలో ఉన్న స్థితిని సూచిస్తుంది; ‘సమీపించింది’ ఆ అంశాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: βασιλεία τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: ‘రాజ్యం’ పాలన, రాజాధికారం, రాజ్యపరిధి అనే విస్తృత భావసాధ్యతను నిలుపుతుంది; దాన్ని కేవలం ప్రదేశంగా లేదా చర్యగా పరిమితం చేయదు.
- source_word: μετανοεῖτε
  choice: పశ్చాత్తాపపడండి
  rationale: మనస్సు, దిశ, జీవితం మారే పిలుపును తెలియజేసే సహజమైన ప్రామాణిక తెలుగు పదం; కేవలం విచారపడటంగా అర్థం చేసుకోకూడదనే వివరణ అవసరమున్నా, ప్రధాన వచనంలో ఇది సంక్షిప్తంగా సరిపోతుంది.
- source_word: πιστεύετε
  choice: నమ్మండి
  rationale: ఆజ్ఞారూపాన్ని నేరుగా, సహజంగా అందిస్తుంది; విశ్వాసం ఉంచడం అనే భావాన్ని కలిగిస్తుంది.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: శుభవార్తను
  rationale: πιστεύω తో వచ్చిన ἐν ను తెలుగులో సహజమైన సకర్మక నిర్మాణంగా ‘శుభవార్తను నమ్మండి’ అని అందించాం; ‘సువార్త’ అనే సంప్రదాయ పదాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: λέγων
  choice: ఇలా చెబుతూ ఉన్నాడు
  rationale: మునుపటి వచనంలోని కథనానికి కొనసాగింపుగా ఉన్న వర్తమాన కృదంత భావాన్ని సహజ తెలుగులో చూపుతుంది.
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ యొక్క భావవ్యాప్తి
  choice: దేవుని రాజ్యం
  alternative: దేవుని పరిపాలన
  rationale: ‘రాజ్యం’ అనే పదం దేవుని చురుకైన పరిపాలనతో పాటు రాజాధికారం, రాజ్యపరిధి వంటి విస్తృత భావాలను నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చి మూలంలోని ఉద్వేగాన్ని కాపాడాం.
- issue: εὐαγγέλιον పదానికి అనువాదం
  choice: శుభవార్త
  alternative: సువార్త
  rationale: ‘శుభవార్త’ సాధారణ ఆధునిక పాఠకునికి వెంటనే అర్థమవుతుంది; సంఘపరంపరలో స్థిరపడిన ‘సువార్త’ను పాదటిప్పణిలో నిలిపాం.
- issue: μετανοεῖτε καὶ πιστεύετε ఆజ్ఞల కాలభావం
  choice: పశ్చాత్తాపపడండి; ... నమ్మండి
  alternative: పశ్చాత్తాపపడుతూ ... నమ్ముతూ ఉండండి
  rationale: గ్రీకు వర్తమాన ఆజ్ఞల కొనసాగింపు భావాన్ని తెలుగులో తప్పనిసరిగా విస్తరించడం అధిక వ్యాఖ్యానం అవుతుంది; సరళ ఆజ్ఞలు పిలుపు యొక్క తక్షణతను, తెరచిన కాలభావాన్ని రెండింటినీ నిలుపుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, ప్రజలకు అర్థమయ్యే శైలి. ‘నిర్ణయించిన సమయం’ ద్వారా καιρός యొక్క నియమిత-నిర్ణాయక భావం వ్యక్తమవుతుంది. ఉద్ధరణకు ముందున్న కృదంతాన్ని ముందరి వచనంతో అనుసంధానించేలా ‘ఆయన ఇలా చెబుతూ ఉన్నాడు’గా ఇచ్చాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన వచనంలో ఉన్నాయి.
