id: MRK.1.8
reference: Mark 1:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἐγὼ ἐβάπτισα ⸀ὑμᾶς ὕδατι, αὐτὸς δὲ βαπτίσει ὑμᾶς ⸀ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/008.yaml
  text: I baptized you with water[a], but he will baptize you with the Holy Spirit.
translation:
  language: te
  text: నేను మీకు నీటితో బాప్తిస్మం ఇచ్చాను; అయితే ఆయన మీకు పరిశుద్ధాత్మతో[a] బాప్తిస్మం ఇస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిశుద్ధాత్మలో.” గ్రీకు ఉపసర్గను ఈ రెండు విధాలుగా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: నేను
  rationale: గ్రీకు మూలంలోని స్పష్టమైన కర్తృ సర్వనామాన్ని ఉంచి, తరువాతి ‘ఆయన’తో ఉన్న వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: ἐβάπτισα
  choice: బాప్తిస్మం ఇచ్చాను
  rationale: ఆచార సంబంధమైన భావాన్ని, సువార్తలోని పరస్పర సూచనలను కాపాడే సహజమైన ప్రామాణిక తెలుగు ప్రయోగం; ‘ముంచాను’ అనడం విధానాన్ని అవసరానికి మించి నిర్దిష్టం చేస్తుంది.
- source_word: ὑμᾶς
  choice: మీకు
  rationale: గ్రీకులో ఇది బహువచనం. తెలుగులో ‘మీకు’ ఆ బహువచన సంబోధనను సహజంగా తెలియజేస్తుంది.
- source_word: ὕδατι
  choice: నీళ్లతో
  rationale: దత్తివిభక్తిలోని సాధనార్థాన్ని సహజమైన తెలుగులో ‘తో’ ద్వారా వ్యక్తం చేస్తుంది.
- source_word: αὐτὸς
  choice: ఆయన
  rationale: రాబోయే వ్యక్తిని గౌరవప్రదంగా సూచిస్తూ, వాక్య నిర్మాణం ద్వారా ‘నేను—ఆయన’ వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: యోహాను ఇచ్చిన బాప్తిస్మానికి, రాబోయే వ్యక్తి ఇవ్వబోయే బాప్తిస్మానికి మధ్యనున్న స్పష్టమైన వ్యత్యాసాన్ని సహజంగా చూపుతుంది.
- source_word: βαπτίσει
  choice: బాప్తిస్మం ఇస్తాడు
  rationale: భవిష్యత్ కాలాన్ని కాపాడుతూ, ముందు వచ్చిన ‘బాప్తిస్మం ఇచ్చాను’ అనే పదబంధంతో పదసంబంధ నిరంతరతను నిలుపుతుంది.
- source_word: ἐν
  choice: తో
  rationale: ἐν + దత్తివిభక్తి ఇక్కడ సాధనం లేదా పరిధిని సూచించవచ్చు. ప్రధాన పాఠంలో ‘తో’ సహజంగా ఉండి, నీళ్లతో చేసే బాప్తిస్మానికి సమాంతరతను కాపాడుతుంది; ‘లో’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: πνεύματι ἁγίῳ
  choice: పరిశుద్ధాత్మ
  rationale: ఈ ప్రవచనాత్మక సందర్భంలో ఈ పదబంధం దేవుని పరిశుద్ధాత్మను సూచించడం అత్యంత సహజం; తెలుగు క్రైస్తవ వాడుకలో ఇది స్పష్టమైన, గౌరవప్రదమైన రూపం.
theological_decisions:
- issue: πνεύματι ἁγίῳ అనేది దేవుని పరిశుద్ధాత్మను సూచిస్తుందా, లేక వ్యక్తిత్వరహితమైన పవిత్ర శక్తిని సూచిస్తుందా?
  choice: పరిశుద్ధాత్మ
  alternative: పవిత్రమైన ఆత్మ / పవిత్ర శక్తి
  rationale: యోహాను నీళ్ల బాప్తిస్మాన్ని, తనకంటే బలవంతుడైన రాబోయే వ్యక్తి ఇచ్చే బాప్తిస్మంతో పోల్చే మార్కు సందర్భంలో, ఈ పదబంధం దేవుని పరిశుద్ధాత్మను సూచించడం అత్యంత సహజం. అయితే పాఠం చెప్పినదానికంటే ఎక్కువ వ్యక్తిత్వ వివరణను అనువాదంలో చేర్చలేదు.
- issue: ἐν πνεύματι ἁγίῳలోని ἐνను ఎలా అనువదించాలి?
  choice: పరిశుద్ధాత్మతో
  alternative: పరిశుద్ధాత్మలో
  rationale: గ్రీకు విభక్తి నిర్మాణం సాధనం (‘తో’) లేదా పరిధి (‘లో’) అనే రెండు భావాలకు వీలు కల్పిస్తుంది. సహజమైన తెలుగు, నీళ్లతో ఉన్న సమాంతరత కోసం ప్రధాన పాఠంలో ‘తో’ వాడి, నిజమైన వ్యాఖ్యాన అవకాశాన్ని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘బాప్తిస్మం’ అనే స్థిరమైన ఆచారపదాన్ని ఉంచి, బాప్తిస్మ విధానాన్ని అనువాదంలో అవసరానికి మించి నిర్దిష్టం చేయలేదు.
