  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐθαμβήθησαν ⸀ἅπαντες, ὥστε συζητεῖν ⸂πρὸς ἑαυτοὺς⸃ λέγοντας· Τί ἐστιν τοῦτο; ⸂διδαχὴ καινή⸃· κατ’ ἐξουσίαν καὶ τοῖς πνεύμασι τοῖς ἀκαθάρτοις ἐπιτάσσει, καὶ ὑπακούουσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/027.yaml
  text: And they were all amazed[a], so that they discussed among themselves, saying, “What is this? A new teaching with authority! He even commands the unclean spirits, and they obey him.”
translation:
  language: te
  text: 'అందరూ ఆశ్చర్యచకితులై తమలో తాము ఇలా చర్చించుకున్నారు: “ఇదేమిటి? అధికారంతో కూడిన కొత్త బోధ![a] ఈయన అపవిత్రాత్మలకు కూడా ఆజ్ఞాపిస్తున్నాడు; అవి ఈయనకు లోబడుతున్నాయి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇదేమిటి? అధికారంతో కూడిన ఈ కొత్త బోధ ఏమిటి?” గ్రీకు మూలానికి విరామచిహ్నాలు పెట్టే విధానాన్ని బట్టి ‘కొత్త బోధ’ను ప్రశ్నతో మరింత నేరుగా కలిపి చదవవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐθαμβήθησαν
  choice: ఆశ్చర్యచకితులై
  rationale: తీవ్ర ఆశ్చర్యానికి లోనైన ప్రతిస్పందనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; మూలంలోని భావతీవ్రతను అతిశయింపజేయదు.
- source_word: ἅπαντες
  choice: అందరూ
  rationale: సమూహమంతటికీ ఈ స్పందన కలిగిందనే సంపూర్ణతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὥστε συζητεῖν πρὸς ἑαυτούς
  choice: తమలో తాము ఇలా చర్చించుకున్నారు
  rationale: ὥστε సూచించే ఫలిత సంబంధాన్ని తెలుగు వాక్యక్రమంలో సహజంగా వ్యక్తం చేస్తూ, పరస్పర సంభాషణను చూపిస్తుంది.
- source_word: Τί ἐστιν τοῦτο;
  choice: ఇదేమిటి?
  rationale: ఆకస్మిక ఆశ్చర్యంతో అడిగిన సంక్షిప్త ప్రశ్నను నేరుగా నిలుపుతుంది.
- source_word: διδαχὴ καινή
  choice: కొత్త బోధ
  rationale: διδαχήకు సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన సమానార్థకం; సాంకేతికంగా వినిపించే ‘సిద్ధాంతం’ను నివారిస్తుంది.
- source_word: κατ’ ἐξουσίαν
  choice: అధికారంతో కూడిన
  rationale: బోధలో కనిపించిన అధికారాన్ని ముందుగా అనుసంధానిస్తుంది; అయితే గ్రీకు వాక్య నిర్మాణంలోని అనిశ్చితిని పాదసూచికలో నిలుపుతుంది.
- source_word: τοῖς πνεύμασι τοῖς ἀκαθάρτοις
  choice: అపవిత్రాత్మలకు
  rationale: ἀκάθαρτοςలోని అపవిత్రత భావాన్ని నిలుపుతూ, ఆధునిక తెలుగు క్రైస్తవ వాడుకలో సహజంగా ఉంటుంది.
- source_word: ἐπιτάσσει
  choice: ఆజ్ఞాపిస్తున్నాడు
  rationale: అధికారపూర్వక ఆదేశాన్ని స్పష్టంగా వ్యక్తం చేసి, ఈ వచనంలోని అధికార ఇతివృత్తాన్ని నిలుపుతుంది.
- source_word: ὑπακούουσιν αὐτῷ
  choice: అవి ఈయన మాట వింటున్నాయి
  rationale: సందర్భంలో ఆజ్ఞకు విధేయంగా స్పందించడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; కేవలం శబ్దం వినడమనే అర్థం ఇక్కడ ఉద్దేశం కాదు.
theological_decisions:
- issue: ‘అధికారంతో’ అనే పదబంధం వాక్యంలో దేనితో అనుసంధానమవుతుంది?
  choice: ప్రధాన పాఠ్యంలో ‘అధికారంతో కూడిన కొత్త బోధ!’ అని ఆశ్చర్యోక్తిగా ఇవ్వడం
  alternative: ‘ఇదేమిటి? అధికారంతో కూడిన ఈ కొత్త బోధ ఏమిటి?’ అని మొత్తం భాగాన్ని ప్రశ్నగా చదవడం; లేదా అధికారాన్ని తరువాతి ఆజ్ఞాపన క్రియతో ప్రధానంగా అనుసంధానించడం
  rationale: గ్రీకు పదక్రమం, విరామచిహ్నాల నిర్ణయం ఒకటి కంటే ఎక్కువ సహజ పఠనాలకు వీలు కల్పిస్తాయి. ప్రధాన పాఠ్యం బోధ యొక్క కొత్తదనాన్నీ అధికారాన్నీ ఉద్ఘాటిస్తుండగా, పాదసూచిక ప్రశ్నార్థక ప్రత్యామ్నాయాన్ని సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘ఈయన’ వాడకం సందర్భానుకూల గౌరవాన్ని ఇస్తుంది. మూలంలోని ఆశ్చర్యం, పరస్పర చర్చ, అధికార భావం నిలుపబడ్డాయి.
