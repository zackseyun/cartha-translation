  text: The beginning of the good news of Jesus the Messiah[a][b].
translation:
  language: te
  text: 'ఆరంభం: యేసు మెస్సీయ[b] శుభవార్తకు[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సువార్త.’ గ్రీకు εὐαγγέλιον అనే పదాన్ని ‘శుభవార్త’ అని లేదా సంప్రదాయంగా ‘సువార్త’ అని అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘యేసు క్రీస్తు.’ గ్రీకు Χριστός బిరుదుగా వాడినప్పుడు ‘మెస్సీయ’ అని అర్థం.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρχὴ
  choice: ఆరంభం
  rationale: మూలంలోని నామవాచక రూపాన్ని పూర్తి వాక్యంగా మార్చకుండా, శీర్షికలాంటి ప్రారంభ శైలిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: εὐαγγελίου
  choice: శుభవార్త
  rationale: గ్రీకు పదంలోని ‘మంచి వార్త’ అనే అర్థాన్ని ఆధునిక పాఠకులకు పారదర్శకంగా తెలియజేస్తుంది; సంప్రదాయ ‘సువార్త’ను పాదసూచికలో ఇచ్చాం.
- source_word: Ἰησοῦ
  choice: యేసు
  rationale: తెలుగులో స్థిరపడిన ప్రామాణిక నామరూపం.
- source_word: χριστοῦ
  choice: మెస్సీయ
  rationale: ఇక్కడ ఇది ఇంటిపేరులా కాక యేసు హోదాను సూచించే బిరుదుగా పనిచేస్తుంది; అందువల్ల భావాన్ని అనువదించిన బిరుదును వాడాం.
theological_decisions:
- issue: Χριστόςను అనువదించిన బిరుదుగా ఇవ్వాలా, సంప్రదాయ నామరూపంగా ఇవ్వాలా
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: మార్కు 1:1లో Χριστός యేసును మెస్సీయ హోదాతో గుర్తించే బిరుదుగా అర్థమవుతుంది. ‘మెస్సీయ’ ఆ బిరుదు శక్తిని నిలుపుతుంది; ‘క్రీస్తు’ అనే సంప్రదాయ రూపాన్ని పాదసూచికలో ఉంచాం.
- issue: Ἰησοῦ χριστοῦ అనే షష్ఠీ విభక్తి సంబంధాన్ని వివరణాత్మక పదాలతో స్పష్టీకరించాలా
  choice: ‘యేసు మెస్సీయ శుభవార్త’ అనే సంక్షిప్త సంబంధ నిర్మాణం
  alternative: ‘యేసు మెస్సీయను గురించిన శుభవార్త’ లేదా ‘యేసు మెస్సీయ యొక్క శుభవార్త’
  rationale: ‘గురించిన’ అని చేరిస్తే విషయార్థాన్ని, ‘యొక్క’ అని చేరిస్తే మూలం/స్వామ్యార్థాన్ని ముందుగానే నిర్ణయించే ప్రమాదం ఉంది. సంక్షిప్త తెలుగు నిర్మాణం మూలంలోని సంబంధార్థ విస్తృతిని సాధ్యమైనంతవరకు నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన శీర్షిక-శైలిని ఉపయోగించాం. మూలంలోని అసంపూర్ణ నామవాచక ప్రారంభాన్ని అలాగే నిలిపి, లేని క్రియను చేర్చలేదు. ప్రతి పాదసూచిక గుర్తును సంబంధిత పదం వెంట ఉంచాం.
