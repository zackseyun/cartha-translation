id: MRK.1.5
reference: Mark 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐξεπορεύετο πρὸς αὐτὸν πᾶσα ἡ Ἰουδαία χώρα καὶ οἱ Ἱεροσολυμῖται ⸂πάντες, καὶ ἐβαπτίζοντο⸃ ⸂ὑπ’ αὐτοῦ ἐν τῷ Ἰορδάνῃ ποταμῷ⸃ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/005.yaml
  text: And all the Judean countryside and all the people of Jerusalem were going out to him, and they were being baptized by him in the Jordan River, confessing their sins.
translation:
  language: te
  text: యూదయ ప్రాంతమంతటినుండి ప్రజలు, యెరూషలేము నివాసులందరూ అతని వద్దకు వెళ్తూ ఉండేవారు. వారు తమ పాపాలను ఒప్పుకుంటూ, యొర్దాను నదిలో అతనిచేత బాప్తిస్మం పొందుతూ ఉండేవారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπορεύετο
  choice: వెళ్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే గతకాలంలోని కొనసాగుతున్న లేదా పదేపదే జరిగిన చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πᾶσα ἡ Ἰουδαία χώρα
  choice: యూదయ ప్రాంతమంతటి నుంచీ ప్రజలు
  rationale: χώρα ఇక్కడ ప్రాంతం లేదా గ్రామీణ ప్రదేశాన్ని సూచిస్తుంది. ప్రాంతమే నడిచి వెళ్లిందనే గ్రీకు అలంకారాన్ని తెలుగులో సహజంగా అర్థమయ్యేలా ప్రజలను స్పష్టం చేస్తూ, πᾶσα యొక్క సమగ్ర భావాన్ని ‘ప్రాంతమంతటి నుంచీ’ నిలుపుతుంది.
- source_word: οἱ Ἱεροσολυμῖται πάντες
  choice: యెరూషలేము నివాసులందరూ
  rationale: Ἱεροσολυμῖται అంటే యెరూషలేము నివాసులు; πάντες యొక్క సమగ్ర బలాన్ని ‘అందరూ’ నేరుగా నిలుపుతుంది.
- source_word: ἐβαπτίζοντο
  choice: బాప్తిస్మం పొందుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న లేదా పునరావృత చర్యతో పాటు కర్మణి భావాన్ని కూడా నిలుపుతుంది.
- source_word: ὑπ’ αὐτοῦ
  choice: అతని చేత
  rationale: సందర్భంలో యోహానును సూచించే సర్వనామాన్ని పేరు చేర్చకుండా, కర్తృక కర్మణి సంబంధంతో నిలుపుతుంది.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: యొర్దాను నదిలో
  rationale: ποταμός అనే ‘నది’ పదాన్ని స్పష్టంగా అనువదిస్తూ, స్థలార్థక ἐνను ‘లో’తో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐξομολογούμενοι
  choice: ఒప్పుకుంటూ
  rationale: బాప్తిస్మం పొందే చర్యతోపాటు జరుగుతున్న పాపాల అంగీకారాన్ని సహజంగా తెలుపుతుంది.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: తమ పాపాలను
  rationale: ప్రధాన వాక్యంలోని వారినే తిరిగి సూచించే స్వాధీన భావాన్ని తెలుగులో సహజమైన ‘తమ’తో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యూదయ, యెరూషలేము విషయంలో ‘అంతా/అందరూ’ అనే పదాల పరిధి
  choice: గ్రీకు వాక్యంలోని సమగ్ర వాక్చాతుర్యాన్ని ‘ప్రాంతమంతటి నుంచీ’ మరియు ‘అందరూ’తో నిలపడం
  alternative: ‘యూదయ, యెరూషలేము నుండి చాలామంది’ అని సడలించి అనువదించడం
  rationale: πᾶσα, πάντεςలను తొలగించకూడదు. అదే సమయంలో ఇవి కథనంలో సమూహాన్ని విస్తృతంగా వర్ణించే సాధారణీకరణగా ఉండవచ్చు; ప్రతి వ్యక్తి మినహాయింపు లేకుండా వచ్చాడనే గణితపరమైన నిర్ధారణను అనువాదం బలవంతంగా విధించదు.
- issue: బాప్తిస్మం యొక్క విధానం లేదా సిద్ధాంతపరమైన అర్థం
  choice: ‘బాప్తిస్మం పొందుతూ ఉన్నారు’ అని తటస్థంగా అనువదించడం
  alternative: ‘ముంచబడుతూ ఉన్నారు’ లేదా ‘కడుగబడుతూ ఉన్నారు’ అని అర్థవివరణాత్మకంగా అనువదించడం
  rationale: ఈ వచనం ఆ చర్యను నివేదిస్తుంది గాని దాని విధానాన్ని లేదా తరువాతి సంప్రదాయాల సిద్ధాంతపరమైన అర్థాన్ని స్పష్టంగా నిర్వచించదు. అందువల్ల శాఖాపరమైన వ్యాఖ్యానాన్ని చేర్చకుండా స్థిరపడిన పదాన్ని ఉపయోగించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గంభీరమైన కథన శైలిని నిలిపే పదప్రయోగం. కొనసాగుతున్న గత చర్యలకు ‘వెళ్తూ ఉన్నారు’, ‘పొందుతూ ఉన్నారు’ అనే రూపాలు వాడబడ్డాయి.
