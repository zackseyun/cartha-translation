  source_fidelity: 'వచనం SBLGNTలోని క్రమాన్నీ భావాన్నీ సరిగ్గా ప్రతిబింబిస్తుంది: εὐθὺς‌కు “వెంటనే,” ἀπῆλθεν ἀπ’ αὐτοῦకు “అతన్ని విడిచిపోయింది,” ἐκαθαρίσθηకు “శుద్ధి పొందాడు” తగిన సమానార్థకాలు. చివరి క్రియలోని నిష్క్రియాత్మక/సంభవిత భావం మరియు శుద్ధి-సంబంధిత విస్తృతి నిలిచాయి.'
