  text: καὶ ⸀εὐθὺς ἀπῆλθεν ἀπ’ αὐτοῦ ἡ λέπρα, καὶ ἐκαθαρίσθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/042.yaml
  text: And immediately the leprosy left him[a], and he was cleansed.
translation:
  language: te
  text: వెంటనే ఆ కుష్ఠరోగం అతన్ని విడిచిపోయింది; అతడు శుద్ధి పొందాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శుద్ధుడయ్యాడు.” ఇక్కడి క్రియ కేవలం శారీరక స్వస్థతనే కాక, ఆచారపరమైన శుద్ధినీ సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు వర్ణనలో కనిపించే తక్షణత్వాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: అతన్ని విడిచిపోయింది
  rationale: రోగమే కర్తగా ఉన్న గ్రీకు నిర్మాణాన్ని నిలుపుతూ, ‘అతని నుండి వెళ్లిపోయింది’ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἡ λέπρα
  choice: ఆ కుష్ఠరోగం
  rationale: సందర్భంలో ముందే ప్రస్తావించబడిన వ్యాధిని నిర్దిష్టంగా సూచిస్తుంది. బైబిలు కాలపు λέπρα ఆధునిక హాన్సెన్స్ వ్యాధికన్నా విస్తృతమైన చర్మవ్యాధులను సూచించగలదన్న విషయాన్ని ఈ సంక్షిప్త పదం స్వయంగా పూర్తిగా తెలియజేయదు; అయినా తెలుగు బైబిలు వాడుకలో ఇది గుర్తించదగిన, సంక్షిప్త సమానార్థకం.
- source_word: ἐκαθαρίσθη
  choice: శుద్ధి పొందాడు
  rationale: శారీరక స్వస్థతతో పాటు ఆచారపరమైన అపవిత్రత తొలగించబడిన భావాన్నీ నిలుపుతుంది; కేవలం ‘స్వస్థపడ్డాడు’ అని అనువదించడం మూలంలోని καθαρίζω భావపరిధిని కుదిస్తుంది.
theological_decisions:
- issue: καθαρίζωలో శారీరక స్వస్థతకు, ఆచారపరమైన శుద్ధికి ఉన్న సంబంధం
  choice: ‘శుద్ధి పొందాడు’ అని అనువదించడం
  alternative: ‘స్వస్థపడ్డాడు’ లేదా ‘శుద్ధుడయ్యాడు’
  rationale: ఈ సందర్భంలో వ్యాధి తొలగిపోవడమే కాక, దానివల్ల కలిగిన అపవిత్ర స్థితి నుంచి శుద్ధి పొందడమూ సూచితమవుతుంది. ‘శుద్ధి పొందాడు’ ఈ రెండు కోణాలను అనవసరమైన సిద్ధాంత వివరణ లేకుండా నిలుపుతుంది.
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు; కథనంలోని వేగాన్ని, గౌరవప్రదమైన బైబిలు శైలిని నిలుపుతూ సామాన్య పాఠకులకు అర్థమయ్యే పదప్రయోగం.
