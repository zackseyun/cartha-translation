- from: ఆయన వారితో, “మనం వేరే చోటికి, చుట్టుపక్కల ఉన్న చిన్న పట్టణాలకు వెళ్దాం. అక్కడ కూడా నేను ప్రకటించాలి; ఇందుకోసమే నేను బయలుదేరి వచ్చాను[a]” అని అన్నాడు.
  to: ఆయన వారితో, “మనం వేరే చోటికి, సమీపంలోని చిన్న పట్టణాలకు వెళ్దాం. అక్కడ కూడా నేను ప్రకటించాలి; ఇందుకోసమే నేను బయలుదేరాను[a]” అని అన్నాడు.
