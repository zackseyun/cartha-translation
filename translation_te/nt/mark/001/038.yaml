id: MRK.1.38
reference: Mark 1:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ἄγωμεν ⸀ἀλλαχοῦ εἰς τὰς ἐχομένας κωμοπόλεις, ἵνα καὶ ἐκεῖ κηρύξω, εἰς τοῦτο γὰρ ⸀ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/038.yaml
  text: And he said to them[a], “Let us go elsewhere, to the neighboring towns, so that I may preach there also[b], for that is why I came out.”
translation:
  language: te
  text: ఆయన వారితో, “మనం వేరే చోటికి, సమీపంలోని చిన్న పట్టణాలకు వెళ్దాం. అక్కడ కూడా నేను ప్రకటించాలి; ఇందుకోసమే నేను బయలుదేరాను[a]” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఇందుకోసమే నేను బయటికి వచ్చాను” అని కూడా అనువదించవచ్చు. ఈ మాట యేసు ప్రస్తుత స్థలం నుండి బయలుదేరడాన్ని సూచించవచ్చు; లేదా ప్రకటించడానికి బయలుదేరిన ఆయన విస్తృత ఉద్దేశాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγωμεν
  choice: మనం ... వెళ్దాం
  rationale: ప్రథమ పురుష బహువచన ప్రేరణార్థక విధిని సహజమైన ఆధునిక తెలుగులో ఆహ్వాన స్వరంతో వ్యక్తం చేస్తుంది.
- source_word: ἀλλαχοῦ
  choice: వేరే చోటికి
  rationale: ప్రస్తుత స్థలం నుండి మరొక ప్రాంతానికి వెళ్లడాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐχομένας κωμοπόλεις
  choice: చుట్టుపక్కల ఉన్న చిన్న పట్టణాలకు
  rationale: ἐχομένας యొక్క సమీప ప్రాంతాల భావాన్ని, κωμοπόλεις సూచించే గ్రామాలకంటే కొంత పట్టణ స్వరూపమున్న చిన్న జనావాసాల భావాన్ని కలిపి వ్యక్తం చేస్తుంది.
- source_word: ἵνα καὶ ἐκεῖ κηρύξω
  choice: అక్కడ కూడా నేను ప్రకటించాలి
  rationale: ἵνα తెలిపే ఉద్దేశాన్ని తెలుగు సందర్భంలో ‘ప్రకటించాలి’ సహజంగా అందిస్తుంది; καὶ ἐκεῖలోని ‘అక్కడ కూడా’ అనే ప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: εἰς τοῦτο
  choice: ఇందుకోసమే
  rationale: ఉద్దేశం లేదా కారణాన్ని తెలిపే గ్రీకు నుడికారాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: ἐξῆλθον
  choice: నేను బయలుదేరి వచ్చాను
  rationale: ἐξέρχομαι యొక్క ‘బయటికి రావడం/బయలుదేరడం’ భావాన్ని నిలుపుతూ, సమీప స్థలం నుండి బయలుదేరడమా లేక విస్తృతమైన ప్రకటనా ఉద్దేశంతో రావడమా అన్న అస్పష్టతను పూర్తిగా ఒకే దిశలో తేల్చదు.
- source_word: λέγει αὐτοῖς
  choice: ఆయన వారితో ... అని అన్నాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని సహజ తెలుగు కథన శైలిలో భూతకాలంగా అందిస్తుంది.
theological_decisions:
- issue: ἐξῆλθον యొక్క పరిధి
  choice: ‘నేను బయలుదేరి వచ్చాను’ అని సాధారణంగా అనువదించి, స్థానిక మరియు విస్తృత ఉద్దేశ భావాలకు చోటు ఉంచడం
  alternative: ‘నేను ఇక్కడి నుండి బయలుదేరాను’ లేదా ‘ఈ కార్యం కోసమే లోకానికి వచ్చాను’
  rationale: ఈ క్రియ యేసు ప్రస్తుత స్థలం నుండి బయలుదేరడాన్ని సూచించవచ్చు; సందర్భంలో ఆయన ప్రకటనా కార్యం కోసం వచ్చిన విస్తృత ఉద్దేశాన్ని కూడా సూచించవచ్చు. మూలపాఠం తేల్చని అంశాన్ని అనువాదం సిద్ధాంతపరంగా తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘చిన్న పట్టణాలు’ అనే పదబంధం κωμοπόλεις సూచించే గ్రామం-పట్టణం మధ్యస్థ జనావాస భావాన్ని పాఠ్యంలోనే స్పష్టపరుస్తుంది.
