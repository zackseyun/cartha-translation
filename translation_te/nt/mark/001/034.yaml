source:
  edition: SBLGNT
  text: καὶ ἐθεράπευσεν πολλοὺς κακῶς ἔχοντας ποικίλαις νόσοις, καὶ δαιμόνια πολλὰ ἐξέβαλεν, καὶ οὐκ ἤφιεν λαλεῖν τὰ δαιμόνια, ὅτι ᾔδεισαν ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/034.yaml
  text: And he healed many who were sick with various diseases[a], and he cast out many demons, and he would not allow the demons to speak, because they knew him.
translation:
  language: te
  text: వివిధ రకాల వ్యాధులతో బాధపడుతున్న అనేక మందిని ఆయన స్వస్థపరిచాడు. అనేక దయ్యాలను వెళ్లగొట్టాడు. ఆ దయ్యాలకు ఆయన తెలుసు కాబట్టి, వాటిని మాట్లాడనివ్వలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన ఎవరో వాటికి తెలుసు.” గ్రీకు మూలంలో సరళంగా, “వాటికి ఆయన తెలుసు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθεράπευσεν
  choice: స్వస్థపరిచాడు
  rationale: స్వస్థపరచడం అనే పదం θεραπεύω యొక్క రోగనివారణ భావాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πολλοὺς κακῶς ἔχοντας
  choice: బాధపడుతున్న అనేక మందిని
  rationale: κακῶς ἔχω ఇక్కడ అనారోగ్యంతో ఉండడాన్ని సూచించే నుడికారం; తరువాత వచ్చే వ్యాధులు అనే పదంతో కలిపి ఈ రూపం తెలుగులో సహజంగా ఉంటుంది.
- source_word: ποικίλαις νόσοις
  choice: వివిధ రకాల వ్యాధులతో
  rationale: ποικίλος లోని వైవిధ్య భావాన్నీ νόσος లోని వ్యాధి భావాన్నీ స్పష్టంగా కాపాడుతుంది.
- source_word: δαιμόνια πολλὰ ἐξέβαλεν
  choice: అనేక దయ్యాలను వెళ్లగొట్టాడు
  rationale: ἐκβάλλω సూచించే బలవంతపు తొలగింపును ‘వెళ్లగొట్టాడు’ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὐκ ἤφιεν λαλεῖν
  choice: మాట్లాడనివ్వలేదు
  rationale: అనుమతించకపోవడాన్ని తెలుగులో సహజంగా తెలుపుతుంది; అపూర్ణ భూతకాల క్రియ యొక్క కొనసాగుతున్న నిరోధ భావం సందర్భంలో నిలుస్తుంది.
- source_word: ὅτι ᾔδεισαν αὐτόν
  choice: ఆ దయ్యాలకు ఆయన తెలుసు కాబట్టి
  rationale: మూలంలోని సరళమైన ‘వాటికి ఆయన తెలుసు’ అనే మాటను విస్తరించకుండా, ὅτι యొక్క కారణార్థాన్ని కాపాడుతుంది.
theological_decisions:
- issue: దయ్యాల జ్ఞానాన్ని స్పష్టమైన క్రీస్తు-గుర్తింపు ప్రకటనగా విస్తరించాలా
  choice: ఆ దయ్యాలకు ఆయన తెలుసు
  alternative: ఆయన ఎవరో ఆ దయ్యాలకు తెలుసు
  rationale: గ్రీకు మూలంలో కర్మ కేవలం αὐτόν, ‘ఆయనను/ఆయన’; ఆయన మెస్సీయా లేదా దేవుని కుమారుడు అని ఈ వాక్యంలో స్పష్టంగా లేదు. అందువల్ల ప్రధాన పాఠం సంక్షిప్తతను, వేదాంతపరమైన ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. పొడవైన గ్రీకు సమన్వయ వాక్యాన్ని తెలుగులో స్పష్టత కోసం మూడు వాక్యాలుగా విభజించాం. పాదటిప్పణి గుర్తును సంబంధిత చివరి వాక్యానంతరం ఉంచాం.
