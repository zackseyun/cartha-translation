id: MRK.1.40
reference: Mark 1:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἔρχεται πρὸς αὐτὸν λεπρὸς παρακαλῶν αὐτὸν καὶ ⸀γονυπετῶν λέγων αὐτῷ ὅτι Ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/040.yaml
  text: And a man with leprosy comes to him[a], pleading with him and kneeling, and saying to him, “If you are willing[d][c][b], you are able to make me clean.”
translation:
  language: te
  text: కుష్ఠవ్యాధిగల ఒక వ్యక్తి[a] ఆయన దగ్గరకు వచ్చి, ఆయనను వేడుకుంటూ, మోకాళ్లూని, “నీకు ఇష్టమైతే నన్ను శుద్ధి చేయగలవు[b]” అని ఆయనతో అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి గ్రీకు పదం వివిధ తీవ్రమైన చర్మవ్యాధులను సూచించవచ్చు; ఇది నేటి హాన్సెన్ వ్యాధికే పరిమితం కావాల్సిన అవసరం లేదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నన్ను శుభ్రం చేయగలవు.” ఈ గ్రీకు క్రియ శారీరక పునరుద్ధరణతో పాటు అపవిత్రత నుండి శుద్ధిని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λεπρὸς
  choice: ఒక కుష్ఠరోగి
  rationale: గ్రీకు విశేషణం నామవాచకంగా వాడబడి చర్మవ్యాధిగల వ్యక్తిని సూచిస్తుంది. ‘కుష్ఠరోగి’ సాధారణ తెలుగు బైబిలు పాఠకులకు సంక్షిప్తంగా, స్పష్టంగా ఉంటుంది; అయితే ప్రాచీన వ్యాధి నేటి హాన్సెన్ వ్యాధికే పరిమితం కాకపోవచ్చని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: παρακαλῶν
  choice: వేడుకుంటూ
  rationale: ఈ స్వస్థత సందర్భంలో గ్రీకు పదం గంభీరమైన విన్నపాన్ని సూచిస్తుంది; ‘వేడుకుంటూ’ సహజమైన ఆధునిక తెలుగు.
- source_word: γονυπετῶν
  choice: మోకాళ్లూని
  rationale: మోకాళ్లపై వంగిన భంగిమను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ἐὰν θέλῃς
  choice: నీకు ఇష్టమైతే
  rationale: భవిష్యత్ చర్యకన్నా యేసు సమ్మతి లేదా సంకల్పాన్ని సూచించే షరతును నిలుపుతుంది.
- source_word: δύνασαί
  choice: చేయగలవు
  rationale: δύναμαιలోని సామర్థ్య భావాన్ని సహజమైన తెలుగులో ప్రత్యక్షంగా తెలియజేస్తుంది.
- source_word: καθαρίσαι
  choice: నన్ను శుద్ధిచేయగలవు
  rationale: సాధారణ స్వస్థత క్రియకు బదులుగా మూలంలో ఉన్న శుద్ధి భావాన్ని నిలుపుతూ, శారీరక పునరుద్ధరణతో పాటు అపవిత్రత తొలగింపునూ సూచిస్తుంది.
- source_word: ἔρχεται
  choice: వచ్చి
  rationale: తెలుగు కథన ప్రవాహానికి అనుగుణంగా సమాపక క్రియ ‘అన్నాడు’తో కలిసే పూర్వకాలిక క్రియారూపం వాడబడింది; సంఘటనక్రమం మారదు.
theological_decisions:
- issue: కుష్ఠవ్యాధి సందర్భంలో καθαρίσαι సూచించే శుద్ధి స్వరూపం
  choice: శుద్ధిచేయగలవు
  alternative: స్వస్థపరచగలవు
  rationale: మూలపాఠం సాధారణంగా ‘స్వస్థపరచు’ అనే క్రియను వాడకుండా ‘శుద్ధిచేయు’ అంటుంది. అందువల్ల శారీరక పునరుద్ధరణ, ఆచారపరమైన అపవిత్రత తొలగింపు అనే రెండు కోణాల మధ్యనున్న ఉద్దేశపూర్వక విస్తృతిని అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. యేసును ఉద్దేశించిన ఏకవచన సంభాషణలో మూలంలోని ప్రత్యక్షతను నిలుపుతూ ‘నీకు’ వాడబడింది. వాక్యంలోని విన్నపం, మోకాళ్లూనడం, మాట పలకడం అనే చర్యలన్నీ స్పష్టంగా ఉంచబడ్డాయి.
