  yaml_path: translation/nt/mark/001/021.yaml
  text: And they went into Capernaum, and immediately on the Sabbath he began teaching in the synagogue.
translation:
  language: te
  text: వారు కపెర్నహూములోకి వెళ్లారు.[a] వెంటనే విశ్రాంతిదినాన[b] ఆయన సమాజమందిరంలో బోధిస్తూ ఉన్నాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు కపెర్నహూములోకి వెళ్తారు.’ సజీవమైన కథనం కోసం మార్కు తరచుగా చారిత్రక వర్తమాన కాలాన్ని ఉపయోగిస్తాడు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా ‘విశ్రాంతిదినాల్లో’; ఇది ‘విశ్రాంతిదినాన’ అనే అర్థమిచ్చే నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ఆయన బోధించడం ప్రారంభించాడు,’ లేదా ‘ఆయన బోధించాడు.’ గ్రీకు అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న చర్యను లేదా చర్య ఆరంభాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσπορεύονται
  choice: వెళ్లారు
  rationale: మార్కు సువార్తలో సాధారణంగా కనిపించే చారిత్రక వర్తమాన కాలాన్ని సహజమైన తెలుగు కథనశైలికి అనుగుణంగా భూతకాలంలో ఇచ్చాం; εἰς తో కూడిన గమన భావాన్ని ‘కపెర్నహూములోకి’ నిలుపుతుంది.
- source_word: Καφαρναούμ
  choice: కపెర్నహూము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన ప్రదేశనామ రూపం.
- source_word: εὐθύς
  choice: వెంటనే
  rationale: చర్యలోని తక్షణత్వాన్ని, మార్కు కథనంలోని వేగాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τοῖς σάββασιν
  choice: విశ్రాంతిదినాన
  rationale: గ్రీకులో రూపపరంగా బహువచనమైనా, ఇక్కడ ఒక విశ్రాంతిదినాన్ని సూచించే కాలవాచక నుడికారంగా గ్రహించడం సందర్భోచితం.
- source_word: ἐδίδασκεν
  choice: బోధిస్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న చర్య భావాన్ని స్పష్టంగా నిలుపుతుంది; ‘బోధించడం ప్రారంభించాడు’ అనే సాధ్యమైన ఆరంభార్థాన్ని ప్రధాన పాఠ్యంలో తప్పనిసరిగా నిర్ధారించదు.
- source_word: συναγωγήν
  choice: సమాజమందిరం
  rationale: ఈ యూదు సందర్భంలో సాధారణ సభను కాక స్థానిక సీనగాగును సూచిస్తుంది; ‘సమాజమందిరం’ తెలుగు క్రైస్తవ వాడుకలో స్పష్టమైన, స్థిరమైన పదం.
