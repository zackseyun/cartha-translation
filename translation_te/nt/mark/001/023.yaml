lexical_decisions:
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు వర్ణనలో వేగవంతమైన కథాగమనాన్ని సూచించే ఈ పదానికి సహజమైన, ఖచ్చితమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: ἦν
  choice: ఉన్న
  rationale: ఇక్కడ ఒక వ్యక్తి ఆ స్థలంలో ఉన్నాడనే అస్తిత్వార్థాన్ని తెలుగులో సహజమైన వాక్యనిర్మాణంతో తెలియజేస్తుంది.
- source_word: συναγωγῇ αὐτῶν
  choice: వారి సమాజమందిరంలో
  rationale: యూదుల synagogue‌ను సూచించే స్థిరమైన తెలుగు పదమైన ‘సమాజమందిరం’ను వాడి, αὐτῶν లోని ‘వారి’ని నిలిపింది.
- source_word: ἄνθρωπος
  choice: ఒక మనిషి
  rationale: కథనంలోని నిర్దిష్ట పురుష వ్యక్తిని సూచిస్తూ, మూలంలోని ఏకవచన అనిర్దిష్ట భావాన్ని కాపాడుతుంది.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: అపవిత్ర ఆత్మతో ఉన్న
  rationale: గ్రీకు పదబంధం అక్షరార్థంగా ‘అపవిత్ర ఆత్మలో’ అన్నప్పటికీ, తెలుగులో అర్థవంతంగా ఉండేందుకు ‘తో ఉన్న’ అని ఇచ్చాం; ‘పట్టిన’ లేదా ‘ఆవహించిన’ వంటి మరింత వ్యాఖ్యానాత్మక పదాలను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: ἀκαθάρτῳ
  choice: అపవిత్ర
  rationale: ఆచారపరమైన అపవిత్రతతో పాటు నైతిక/ఆధ్యాత్మిక భావఛాయలను కూడా నిలిపే సాంప్రదాయికమైన, స్పష్టమైన ఎంపిక.
- source_word: ἀνέκραξεν
  choice: బిగ్గరగా కేక వేశాడు
  rationale: క్రియలో అంతర్లీనంగా ఉన్న గట్టిగా చేసే ఆకస్మిక కేక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ἐν πνεύματι ἀκαθάρτῳలో దుష్టాత్మ సంబంధిత స్థితిని ఎలా అనువదించాలి
  choice: అపవిత్ర ఆత్మతో ఉన్న
  alternative: అపవిత్ర ఆత్మలో ఉన్న; అపవిత్ర ఆత్మ పట్టిన
  rationale: ‘తో ఉన్న’ అనేది దుష్టాత్మతో అతనికి ఉన్న సంబంధాన్ని స్పష్టంగా తెలియజేస్తూనే, మూలంలో ప్రత్యక్షంగా లేని ‘పట్టిన/ఆవహించిన’ అనే నిర్దిష్ట వివరణను బలవంతంగా చేర్చదు. అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచడం ద్వారా మూలంలోని అసాధారణ నిర్మాణం, దాని భావసంభావ్యత నిలుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వాక్య గౌరవాన్ని మరియు మార్కు కథన వేగాన్ని నిలిపే శైలి. ‘సమాజమందిరం,’ ‘అపవిత్ర ఆత్మ’ వంటి స్థిరపడిన బైబిలు పదజాలాన్ని ఉపయోగించాం.
