  text: And immediately there was in their synagogue a man with an unclean spirit[a], and he cried out[b],
translation:
  language: te
  text: 'వెంటనే వారి సమాజమందిరంలో అపవిత్ర ఆత్మతో ఉన్న ఒక మనిషి[a][b] ఉన్నాడు; అతడు బిగ్గరగా కేక వేశాడు.


    [a] మూలభాషలో మరింత అక్షరార్థంగా, “అపవిత్ర ఆత్మలో ఉన్న ఒక మనిషి.”


    [b] కొన్ని అనువాదాలు దీనిని “అపవిత్ర ఆత్మ పట్టిన ఒక మనిషి” అని అనువదిస్తాయి. ఇది గ్రీకు మూలంలోని వ్యక్తీకరణను వివరిస్తూ విస్తరించిన అనువాదం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో మరింత అక్షరార్థంగా, “అపవిత్ర ఆత్మలో ఉన్న ఒక మనిషి.”
    reason: lexical_alternative
  - marker: b
    text: కొన్ని అనువాదాలు దీనిని “అపవిత్ర ఆత్మ పట్టిన ఒక మనిషి” అని అనువదిస్తాయి. ఇది గ్రీకు మూలంలోని వ్యక్తీకరణను వివరిస్తూ విస్తరించిన అనువాదం.
