id: MRK.1.9
reference: Mark 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις ἦλθεν Ἰησοῦς ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας καὶ ἐβαπτίσθη ⸂εἰς τὸν Ἰορδάνην ὑπὸ Ἰωάννου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/009.yaml
  text: And it happened in those days that Jesus came from Nazareth of Galilee and was baptized in the Jordan by John[a].
translation:
  language: te
  text: 'ఆ రోజుల్లో ఇలా జరిగింది: యేసు గలిలయలోని నజరేతు నుండి వచ్చి, యోహాను ద్వారా యొర్దాను నదిలో బాప్తిస్మం పొందాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యొర్దాను నదిలోకి.” గ్రీకు ఉపసర్గను మరింత అక్షరార్థంగా ఇలా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις
  choice: ఆ రోజుల్లో
  rationale: గ్రీకు కథన సంధి ‘Καὶ ἐγένετο’ను తెలుగులో విడిగా అనువదిస్తే కృత్రిమంగా ఉంటుంది; ‘ఆ రోజుల్లో’తో కథన మార్పును సహజంగా తెలియజేస్తూ కాలసూచనను నిలుపుతుంది.
- source_word: ἦλθεν
  choice: వచ్చి
  rationale: ప్రాథమిక గమనార్థాన్ని సహజమైన తెలుగు కథన క్రమంలో చూపుతుంది.
- source_word: Ἰησοῦς
  choice: యేసు
  rationale: తెలుగులో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας
  choice: గలిలయలోని నజరేతు నుండి
  rationale: స్థలాల సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐβαπτίσθη
  choice: బాప్తిస్మం పొందాడు
  rationale: గ్రీకు నిష్క్రియ రూపాన్ని సహజమైన తెలుగులో అందిస్తూ, బాప్తిస్మ విధానాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: εἰς τὸν Ἰορδάνην
  choice: యొర్దాను నదిలో
  rationale: బాప్తిస్మం జరిగిన ప్రదేశాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; గ్రీకులోని εἰς మరింత అక్షరార్థంగా ‘యొర్దాను నదిలోకి’ అని కూడా అనువదించవచ్చని పాదటిప్పణి సూచిస్తుంది.
- source_word: ὑπὸ Ἰωάννου
  choice: యోహాను చేత
  rationale: నిష్క్రియ క్రియలో వ్యక్తిగత కర్తృత్వాన్ని గౌరవప్రదమైన, సహజ తెలుగు రూపంలో తెలియజేస్తుంది.
theological_decisions:
- issue: సంఘపరమైన సున్నితత్వం ఉన్న సందర్భంలో βαπτίζω అనువాదం
  choice: బాప్తిస్మం పొందాడు
  alternative: ముంచబడ్డాడు
  rationale: వచనం బాప్తిస్మ సంఘటనను చెబుతుంది; దాని విధానాన్ని ఒక నిర్దిష్ట సంఘ సంప్రదాయానికి అనుకూలంగా సంకుచితం చేయకుండా గ్రీకు పదానికి స్థిరపడిన తెలుగు రూపాన్ని ఉపయోగిస్తుంది.
- issue: εἰς యొక్క స్థల లేదా దిశ భావం
  choice: యొర్దాను నదిలో
  alternative: యొర్దాను నదిలోకి
  rationale: ప్రధాన పాఠంలో బాప్తిస్మం జరిగిన స్థలాన్ని సహజంగా తెలుపుతూ, గ్రీకు విభక్తిపూర్వక పదంలో ఉన్న దిశార్థ సాధ్యతను పాదటిప్పణిలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే వాక్యానికి తగిన గౌరవప్రదమైన బైబిలు కథన శైలిని నిలుపుతూ అనువదించబడింది.
