id: MRK.1.29
reference: Mark 1:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἐκ τῆς συναγωγῆς ⸂ἐξελθόντες ἦλθον⸃ εἰς τὴν οἰκίαν Σίμωνος καὶ Ἀνδρέου μετὰ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/029.yaml
  text: And immediately, after leaving the synagogue, they came into the house of Simon and Andrew, with James and John.
translation:
  language: te
  text: వెంటనే వారు సమాజమందిరం నుండి బయలుదేరి, యాకోబు, యోహానులతో కలిసి సీమోను, అంద్రెయల ఇంట్లోకి వచ్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు కథనంలో వేగవంతమైన గమనాన్ని సూచించే ఈ క్రియావిశేషణాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκ τῆς συναγωγῆς
  choice: సమాజమందిరం నుండి
  rationale: ἐκ సూచించే ‘నుండి/వెలుపలికి’ అనే భావాన్ని, బయలుదేరి అనే క్రియతో కలిసి సహజంగా తెలియజేస్తుంది.
- source_word: ἐξελθόντες ἦλθον
  choice: బయలుదేరి ... వచ్చారు
  rationale: మొదట బయటికి రావడం, ఆ తరువాత ఇంట్లోకి రావడం అనే క్రమాన్ని తెలుగు సంయుక్త క్రియా నిర్మాణంలో నిలుపుతుంది.
- source_word: ἦλθον
  choice: వచ్చారు
  rationale: ἔρχομαι సందర్భానుసారం ‘రావడం’ లేదా ‘వెళ్లడం’ కావచ్చు; గ్రీకు రూపానికి దగ్గరగా ఉండి, కథన దృక్కోణంలో సహజంగా వినిపించే ‘వచ్చారు’ ఎంచుకోబడింది.
- source_word: εἰς τὴν οἰκίαν
  choice: ఇంట్లోకి
  rationale: εἰς లోని లోపలికి కదలికను స్పష్టంగా నిలుపుతుంది; οἰκίαకు సాధారణ ఆధునిక తెలుగు పదం ‘ఇల్లు’.
- source_word: Σίμωνος καὶ Ἀνδρέου
  choice: సీమోను, అంద్రెయల
  rationale: రెండు పేర్లకూ సంబంధించిన ఒకే ఇంటిని తెలుగు సంబంధ విభక్తితో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μετὰ Ἰακώβου καὶ Ἰωάννου
  choice: యాకోబు యోహానులతో కలిసి
  rationale: μετά + సంబంధ విభక్తి తెలిపే సహవాస భావాన్ని ‘తో కలిసి’ స్పష్టంగా అందిస్తుంది.
- source_word: Σίμωνος / Ἀνδρέου / Ἰακώβου / Ἰωάννου
  choice: సీమోను / అంద్రెయ / యాకోబు / యోహాను
  rationale: తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన, ప్రమాణీకృత నామరూపాలను ఉపయోగిస్తుంది.
