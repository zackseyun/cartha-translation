translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని వేగం, క్రియల క్రమం, ఇంట్లోకి ప్రవేశించే దిశ, సహచరుల ప్రస్తావన అన్నీ నిలుపబడ్డాయి.
