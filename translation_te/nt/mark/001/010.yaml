id: MRK.1.10
reference: Mark 1:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἀναβαίνων ⸀ἐκ τοῦ ὕδατος εἶδεν σχιζομένους τοὺς οὐρανοὺς καὶ τὸ πνεῦμα ⸀ὡς περιστερὰν καταβαῖνον ⸀εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/010.yaml
  text: And immediately[a], as he was coming up out of the water[b], he saw the heavens being torn open and the Spirit descending like a dove upon him.
translation:
  language: te
  text: వెంటనే, ఆయన నీటిలోనుండి పైకి వస్తుండగా, ఆకాశాలు చీల్చబడుతూ ఉండడాన్ని, పావురంలా ఆత్మ ఆయన మీదికి దిగివస్తూ ఉండడాన్ని ఆయన చూశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు వర్ణనలోని వేగాన్ని, తక్షణత్వాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἀναβαίνων ἐκ τοῦ ὕδατος
  choice: ఆయన నీళ్లలోనుండి పైకి వస్తుండగా
  rationale: వర్తమాన కృదంతం ప్రధాన క్రియతో సమకాలికమైన చర్యను సూచిస్తుంది; ἐκ లోపలినుండి వెలుపలికి రావడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἶδεν
  choice: ఆయన చూశాడు
  rationale: దృష్టిగోచరమైన సంఘటనను తెలిపే సాధారణ భూతకాల క్రియకు నేరమైన, సహజమైన అనువాదం.
- source_word: σχιζομένους τοὺς οὐρανούς
  choice: ఆకాశాలు చీలిపోతుండడం
  rationale: σχίζω కేవలం తెరుచుకోవడం కంటే బలమైనది. ఈ పదబంధం మూలంలోని తీవ్ర దృశ్యాన్ని, బహువచనాన్ని నిలుపుతుంది.
- source_word: τὸ πνεῦμα
  choice: ఆత్మ
  rationale: సందర్భంలో ఇది దేవుని ఆత్మను సూచిస్తుంది; అయితే మూలంలో ‘పరిశుద్ధాత్మ’ అని స్పష్టంగా లేకపోవడంతో అదనపు విశేషణం చేర్చలేదు.
- source_word: ὡς περιστερὰν
  choice: పావురంలా
  rationale: ὡς తెలిపే పోలికను సహజంగా వ్యక్తం చేస్తూ, అది రూపానికా, దిగివచ్చిన విధానానికా, లేక రెండింటికా వర్తిస్తుందో నిర్దేశించకుండా ఉంచుతుంది.
- source_word: καταβαῖνον
  choice: దిగిరావడం
  rationale: కిందికి వస్తున్న కొనసాగుతున్న చర్యను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς αὐτόν
  choice: తన మీదికి
  rationale: εἰς సాధారణంగా ‘లోనికి’ అనే అర్థం ఇవ్వగలిగినా, ఆత్మ దిగివచ్చే ఈ సందర్భంలో ‘మీదికి’ సహజమైన అర్థం; మూలంలోని ప్రత్యామ్నాయ అవకాశాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: ‘ఆత్మ’ ఎవరిని సూచిస్తుంది?
  choice: దేవుని ఆత్మను సూచించే ‘ఆత్మ’
  alternative: ‘పరిశుద్ధాత్మ’
  rationale: బాప్తిస్మ సందర్భం దేవుని ఆత్మనే సూచిస్తుంది; అయినా గ్రీకు పాఠం τὸ πνεῦμα అని మాత్రమే ఉన్నందున మూలంలో లేని ‘పరిశుద్ధ’ అనే పదాన్ని చేర్చలేదు.
- issue: పావురంతో చేసిన పోలిక యొక్క స్వభావం
  choice: ‘పావురంలా’ అని మాత్రమే ఉంచడం
  alternative: ‘పావురం రూపంలో’ లేదా ‘పావురం దిగిన విధంగా’
  rationale: గ్రీకు ὡς పోలికను తెలియజేస్తుంది గాని పోలిక రూపానికా, కదలికకా, మరేదైనా లక్షణానికా అనేది స్పష్టం చేయదు; అందుచేత ఆ అస్పష్టతను నిలిపాం.
- issue: εἰς αὐτόν యొక్క దిశార్థం
  choice: ‘తన మీదికి’
  alternative: ‘ఆయనలోనికి’
  rationale: ఆత్మ దిగివచ్చే సందర్భంలో ‘మీదికి’ అనే భావం సహజంగా సరిపోతుంది. అయితే εἰς పదానికి ‘లోనికి’ అనే నిజమైన ప్రత్యామ్నాయ అర్థం ఉండటంతో దాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే వాక్య నిర్మాణం వాడబడింది. ‘నీళ్లలోనుండి’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది; ‘ఆకాశాలు,’ ‘ఆత్మ’ బైబిలు సందర్భానికి తగిన గౌరవభరిత పదాలు. మూలంలోని కొనసాగుతున్న దృశ్యాన్ని ‘వస్తుండగా,’ ‘చీలిపోతుండడం,’ ‘దిగిరావడం’ ద్వారా నిలిపాం.
