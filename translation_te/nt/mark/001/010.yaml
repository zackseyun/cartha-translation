    text: లేదా, ‘ఆకాశాలు చీలిపోతుండడం.’ ఇక్కడి గ్రీకు క్రియ కేవలం ‘తెరుచుకోవడం’ కంటే బలమైనది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆయనలోనికి.’ గ్రీకు εἰς అనే పదానికి ‘లోనికి’ అనే అర్థం రావచ్చు; అయితే ఇక్కడ ఆత్మ దిగివచ్చే సందర్భంలో ‘ఆయన మీదికి’ సహజంగా సరిపోతుంది.
    reason: lexical_alternative
