source:
  edition: SBLGNT
  text: ἐγένετο Ἰωάννης ⸀ὁ βαπτίζων ἐν τῇ ⸀ἐρήμῳ κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/004.yaml
  text: John the Baptist appeared in the wilderness[a], proclaiming a baptism of repentance for the forgiveness of sins.
translation:
  language: te
  text: బాప్తిస్మమిచ్చే యోహాను[a] అరణ్యంలో ప్రత్యక్షమై, పాపాల క్షమాపణ కోసం పశ్చాత్తాప బాప్తిస్మాన్ని ప్రకటించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘బాప్తిస్మమిస్తూ ఉన్న యోహాను.’ ఈ గ్రీకు పదబంధం యోహానును ఆయన బాప్తిస్మమిచ్చే కార్యం ద్వారా గుర్తిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ప్రత్యక్షమై
  rationale: మార్కు కథనంలో ఈ క్రియ ఒక వ్యక్తి రంగప్రవేశాన్ని సూచిస్తుంది. ‘ఉన్నాడు’ లేదా అక్షరార్థమైన ‘అయ్యాడు’ కంటే ‘ప్రత్యక్షమై’ ఆ కథన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: Ἰωάννης ὁ βαπτίζων
  choice: బాప్తిస్మమిచ్చే యోహాను
  rationale: ὁ βαπτίζων అనే విశేషణార్థక కృదంతం యోహానును ఆయన బాప్తిస్మమిచ్చే పాత్ర ద్వారా గుర్తిస్తుంది. ఈ రూపం తెలుగులో సహజంగా ఉండి మూలపాఠంలోని క్రియాత్మక భావాన్ని నిలుపుతుంది.
- source_word: ἐν τῇ ἐρήμῳ
  choice: అరణ్యంలో
  rationale: ἔρημος జనావాసం లేని నిర్జన ప్రాంతాన్ని సూచిస్తుంది; ఇక్కడ ‘అరణ్యం’ భౌగోళిక భావాన్నీ గ్రంథపరమైన ప్రతిధ్వనినీ అతిగా నిర్దిష్టం చేయకుండా అందిస్తుంది.
- source_word: κηρύσσων
  choice: ప్రకటించాడు
  rationale: κηρύσσωలోని బహిరంగంగా చాటిచెప్పే భావాన్ని ‘ప్రకటించు’ స్పష్టంగా, సాధారణ పాఠకులకు సహజంగా అందిస్తుంది.
- source_word: βάπτισμα μετανοίας
  choice: పశ్చాత్తాప బాప్తిస్మం
  rationale: ఈ సంక్షిప్త తెలుగు నిర్మాణం బాప్తిస్మానికి పశ్చాత్తాపంతో ఉన్న సంబంధాన్ని నిలుపుతుంది; ఆ సంబంధాన్ని ఫలితం, సాధనం లేదా కేవలం చిహ్నం అని అదనంగా నిర్వచించదు.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: పాపాల క్షమాపణ కోసం
  rationale: εἰς సూచించే ఉద్దేశం/ఫలితం మధ్య సహజమైన విస్తృతిని ‘కోసం’ నిలుపుతుంది. ἁμαρτιῶν యొక్క బహువచనాన్ని ‘పాపాల’గా కాపాడింది.
theological_decisions:
- issue: బాప్తిస్మం, పశ్చాత్తాపం, పాపక్షమాపణల మధ్య సంబంధం
  choice: ‘పాపాల క్షమాపణ కోసం పశ్చాత్తాప బాప్తిస్మం’ అని అనువదించడం
  alternative: ‘క్షమాపణను కలిగించే బాప్తిస్మం’ లేదా ‘క్షమాపణకు చిహ్నమైన బాప్తిస్మం’ అని వివరణాత్మకంగా అనువదించడం
  rationale: గ్రీకు వాక్యనిర్మాణం ఈ అంశాల మధ్య సంబంధాన్ని చెబుతుంది గాని, బాప్తిస్మం సాధనమా, చిహ్నమా, ప్రకటనమా అనే తరువాతి సిద్ధాంత వివాదాన్ని స్పష్టంగా తీర్చదు. అందువల్ల మూలంలోని భావ ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి వాడబడింది. ‘బాప్తిస్మం,’ ‘పశ్చాత్తాపం,’ ‘పాపక్షమాపణ’ వంటి స్థిరపడిన బైబిలు పదాలను నిలుపుతూ వాక్యాన్ని సహజ తెలుగు క్రమంలో అమర్చాం.
