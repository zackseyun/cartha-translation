  naturalness: '‘యెషయా ప్రవక్త గ్రంథంలో ఇలా వ్రాయబడి ఉన్నట్లుగా’ is grammatically awkward as a citation introduction: ‘ఇలా’ and ‘ఉన్నట్లుగా’ duplicate the introductory function, and the latter can leave a dangling comparative. ‘వ్రాయబడి ఉన్న ప్రకారం’ is natural, formal modern Telugu and retains the comparative/citation force of Καθὼς γέγραπται. ‘నీ ముందుగా’ is more idiomatic than ‘నీకు ముందుగా’ for spatial precedence.'
  terminology: ‘ఇదిగో,’ ‘దూతను,’ ‘మార్గాన్ని,’ and ‘సిద్ధం చేస్తాడు’ are appropriate modern standard Telugu with a suitably elevated scriptural register. ‘యెషయా ప్రవక్త గ్రంథంలో’ is a conventional and clear Telugu expression for the Greek citation formula.
