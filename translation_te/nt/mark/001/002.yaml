source:
  edition: SBLGNT
  text: ⸀Καθὼς γέγραπται ἐν ⸂τῷ Ἠσαΐᾳ τῷ προφήτῃ⸃· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/002.yaml
  text: 'Just as it is written in Isaiah the prophet: ‘Behold[a], I send my messenger before your face[c][b], who will prepare your way.’'
translation:
  language: te
  text: 'యెషయా ప్రవక్త గ్రంథంలో వ్రాయబడి ఉన్న ప్రకారం:


    “ఇదిగో, నేను నా దూతను నీ ముందుగా[c] పంపుతున్నాను;


    అతడు నీ మార్గాన్ని సిద్ధం చేస్తాడు.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ఈ ఉల్లేఖనంలో మలాకీ 3:1, యెషయా 40:3 వచనాల పదాలు కలిసివున్నాయి.
    reason: cross_reference
  - marker: c
    text: లేదా “నీ ఎదుట.” పదశః, “నీ ముఖం ముందు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς
  choice: వ్రాయబడి ఉన్నట్లుగా
  rationale: సరిపోలికను సూచించే గ్రీకు పదబంధ భావాన్ని నిలుపుతూ, ముందున్న వాక్యంతో సహజంగా అనుసంధానమయ్యే ఆధునిక తెలుగు రూపం.
- source_word: γέγραπται
  choice: వ్రాయబడి ఉంది
  rationale: లేఖన ఉల్లేఖనాల్లో వాడే పరిపూర్ణ కర్మణి సూత్రాన్ని, వ్రాత ఇప్పటికీ అధికారికంగా నిలిచి ఉందనే భావంతో సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ
  choice: యెషయా ప్రవక్త గ్రంథంలో
  rationale: తెలుగులో గ్రంథాన్ని ఉల్లేఖించే సహజ పద్ధతిని అనుసరిస్తూ, యెషయా ప్రవక్తను మూలంగా పేర్కొనే గ్రీకు భావాన్ని కాపాడుతుంది.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే ప్రవచనాత్మక, గంభీర స్వరాన్ని సహజమైన తెలుగు పదంతో నిలుపుతుంది.
- source_word: ἀποστέλλω
  choice: పంపుతున్నాను
  rationale: గ్రీకు వర్తమాన కాలంలోని తక్షణత్వాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἄγγελόν
  choice: దూతను
  rationale: ఈ సందర్భంలో ముందుగా పంపబడే సందేశవాహకుడనే సాధారణ అర్థాన్ని ఇస్తూ, తెలుగు బైబిలు శైలిలో సహజంగా ఉంటుంది.
- source_word: πρὸ προσώπου σου
  choice: నీకు ముందుగా
  rationale: పదశః రూపం తెలుగులో కృత్రిమంగా వినిపించకుండా, ‘నీ ఎదుట/నీ ముందుగా’ అనే దిశాత్మక భావాన్ని స్పష్టంగా తెలియజేస్తుంది; పదశః రూపం పాదటిప్పణిలో ఉంచబడింది.
- source_word: κατασκευάσει
  choice: సిద్ధం చేస్తాడు
  rationale: సిద్ధపరచడం లేదా తయారుచేయడం అనే క్రియార్థాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: τὴν ὁδόν σου
  choice: నీ మార్గాన్ని
  rationale: ప్రత్యక్ష మార్గం మరియు రూపకాలంకార భావం రెండింటినీ నిలుపగల సాధారణ తెలుగు రూపం.
theological_decisions:
- issue: ఈ మిశ్రమ ఉల్లేఖనంలో మలాకీ గ్రంథానికి సంబంధించిన పదాలు ఉన్నప్పటికీ మూలపాఠం యెషయా ప్రవక్తనే పేరుతో పేర్కొంటుంది.
  choice: ప్రధాన పాఠంలో ‘యెషయా ప్రవక్త గ్రంథంలో’ అని ఉంచడం.
  alternative: ప్రవక్తల గ్రంథాల్లో
  rationale: SBLGNT మూలపాఠంలోని ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ రూపాన్ని అనుసరించి, ఉల్లేఖన మూలాల మధ్య ఉన్న ఉద్రిక్తతను సమన్వయపరచకుండా నిలుపుతుంది. వేరే ప్రతుల పాఠాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా చదవదగినప్పటికీ, ప్రవచన ఉల్లేఖనానికి తగిన గంభీరత కోసం ‘ఇదిగో,’ ‘దూత,’ ‘మార్గం’ వంటి సుపరిచిత లేఖన పదాలను నిలిపాం. వాక్యం ముందున్న సందర్భంతో అనుసంధానమయ్యేలా ‘వ్రాయబడి ఉన్నట్లుగా’ అనే రూపాన్ని వాడాం.
