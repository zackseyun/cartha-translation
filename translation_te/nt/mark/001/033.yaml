  text: And the whole city was gathered at the door[a].
translation:
  language: te
  text: పట్టణమంతా తలుపు దగ్గర గుమికూడి ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తలుపు వైపుకు.’ గ్రీకు ఉపసర్గను ఇలా మరింత అక్షరార్థంగా అనువదించవచ్చు; అయితే సందర్భంలో ప్రజలు ఇంటి ప్రవేశద్వారం దగ్గర గుమికూడారని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν
  choice: ఉంది
  rationale: ἐπισυνηγμένη అనే కృదంతంతో కలిసి, కొనసాగుతున్న దృశ్యస్థితిని వర్ణించే అసంపూర్ణ భూతకాల రూపం. తెలుగులో సందర్భానుసారంగా ‘సమకూడి ఉంది’ సహజంగా ఆ స్థితిని తెలియజేస్తుంది.
- source_word: ὅλη ἡ πόλις
  choice: పట్టణమంతా
  rationale: గ్రీకు పదబంధంలోని ‘పట్టణమంతా’ అనే సజీవమైన సాధారణీకరణను బలహీనపరచకుండా, ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: ἐπισυνηγμένη
  choice: సమకూడి
  rationale: ἐπισυνάγω యొక్క పరిపూర్ణ కర్మణి కృదంతం; అందరూ ఒకచోట చేరి ఉన్న ఫలితస్థితిని ‘సమకూడి ఉంది’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: πρὸς τὴν θύραν
  choice: తలుపు దగ్గర
  rationale: స్థితిని తెలిపే ఈ సందర్భంలో πρός + accusative ఇంటి ప్రవేశద్వారం వద్ద గుమికూడిన స్థానాన్ని సూచిస్తుంది. ‘తలుపు దగ్గర’ సహజమైన తెలుగు.
- source_word: θύραν
  choice: తలుపు
  rationale: θύρα యొక్క ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది; సందర్భంలో ఇది ఇంటి ప్రవేశద్వారాన్ని సూచిస్తుంది.
