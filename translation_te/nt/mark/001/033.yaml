  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘పట్టణమంతా’ అనే మూలంలోని అతిశయోక్తిపూర్వక సాధారణీకరణను అలాగే నిలిపి, ‘తలుపు దగ్గర’ ద్వారా సందర్భానుగుణ స్థానార్థాన్ని వ్యక్తం చేసింది.
