base_translation:
  language: en
  yaml_path: translation/nt/mark/001/030.yaml
  text: Simon’s mother-in-law was lying sick with a fever[b][a], and immediately they told him about her.
translation:
  language: te
  text: సీమోను అత్త జ్వరంతో పడుకొని ఉంది. వెంటనే వారు ఆమె గురించి ఆయనకు చెప్పారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో అక్షరార్థంగా ‘చెబుతారు’ అనే కథన వర్తమానకాల రూపం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πενθερὰ
  choice: అత్త
  rationale: ఈ సందర్భంలో ఇది సీమోను భార్య తల్లిని సూచిస్తుంది. ఆధునిక తెలుగులో సహజమైన బంధుత్వపదం ‘అత్త’.
- source_word: κατέκειτο
  choice: పడుకొని ఉంది
  rationale: అసంపూర్ణ భూతకాల క్రియ ఆమె అప్పటికే పడుకొని ఉన్న కొనసాగుతున్న స్థితిని తెలియజేస్తుంది; ‘మంచానికే పరిమితమైంది’ అని అతిశయింపకుండా ఈ భావాన్ని నిలుపుతుంది.
- source_word: πυρέσσουσα
  choice: జ్వరంతో
  rationale: ఈ వర్తమాన కృదంతం జ్వరంతో బాధపడుతున్న స్థితిని సూచిస్తుంది. ‘జ్వరంతో పడుకొని ఉంది’ అనేది సహజమైన తెలుగు వ్యక్తీకరణ.
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు కథనంలో కనిపించే తక్షణత్వాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: λέγουσιν
  choice: చెప్పారు
  rationale: గ్రీకులో కథన వర్తమాన కాలం ఉన్నప్పటికీ, గత సంఘటనను తెలుగులో సహజంగా చెప్పడానికి భూతకాల రూపం వాడబడింది; మూలంలోని రూపం పాదసూచికలో తెలియజేయబడింది.
- source_word: περὶ αὐτῆς
  choice: ఆమె గురించి
  rationale: περί + షష్ఠీ విభక్తి ఇక్కడ ‘ఆమెను గురించి/ఆమె విషయం’ అనే అర్థం ఇస్తుంది; ‘ఆమె గురించి’ ఆధునిక తెలుగులో సహజం.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప కథన అనుసంధానకంగా పనిచేస్తుంది. తెలుగులో వాక్యక్రమం, కొత్త వాక్యారంభం ఆ అనుసంధానాన్ని సహజంగా మోస్తాయి; ‘అయితే’ అని పెడితే మూలంలో లేని బలమైన వ్యత్యాసం వినిపించవచ్చు.
