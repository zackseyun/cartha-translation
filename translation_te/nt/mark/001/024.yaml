source:
  edition: SBLGNT
  text: λέγων· ⸀Τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/024.yaml
  text: saying[a], “What have you to do with us[b], Jesus the Nazarene? Have you come to destroy us? I know who you are—the Holy One of God.”
translation:
  language: te
  text: 'ఇలా అన్నాడు: “నజరేయుడైన యేసూ[b], మాతో నీకేమి పని[a]? మమ్మల్ని నాశనం చేయడానికి వచ్చావా? నీవెవరో నాకు తెలుసు—నీవు దేవుని పరిశుద్ధుడివి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మాకూ నీకూ ఏమి సంబంధం?” ఈ గ్రీకు ప్రయోగం దూరంగా ఉండాలనే భావాన్ని లేదా విరోధాన్ని వ్యక్తం చేసే నానుడి.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నజరేతుకు చెందిన యేసూ.” గ్రీకులో, “నజరేయుడైన యేసూ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: ఇలా అన్నాడు
  rationale: గ్రీకు వర్తమాన కృదంతం ముందరి వాక్యంలోని క్రియను కొనసాగిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ప్రత్యక్ష ఉక్తిని సహజంగా పరిచయం చేయడానికి పరిమిత క్రియారూపం వాడబడింది.
- source_word: Τί ἡμῖν καὶ σοί
  choice: మాతో నీకేమి పని?
  rationale: అక్షరార్థంగా ‘మాకు, నీకు ఏమిటి?’ అనే ఈ సామెత వియోగం లేదా ప్రతిఘటనను సూచిస్తుంది. ఎంచుకున్న తెలుగు ప్రయోగం ఆ విరోధ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: నజరేయుడవైన యేసూ
  rationale: సంబోధన రూపాన్ని నిలుపుతూ, Ναζαρηνέ అనే విశేషణాత్మక బిరుదును ‘నజరేయుడు’గా దగ్గరగా అనువదించింది.
- source_word: ἦλθες
  choice: వచ్చావా
  rationale: ఈ ప్రత్యక్ష ప్రశ్నలోని గ్రీకు ఏఓరిస్టు క్రియను సందర్భానికి తగిన సహజ తెలుగు భూతకాల ప్రశ్నగా ఇచ్చింది.
- source_word: ἀπολέσαι
  choice: నాశనం చేయడానికి
  rationale: ఈ సందర్భంలో ἀπόλλυμι పూర్తిగా నాశనం చేయడం లేదా అంతం చేయడం అనే బలమైన భావాన్ని కలిగి ఉంది.
- source_word: ἡμᾶς
  choice: మమ్మల్ని
  rationale: మూలంలోని ప్రథమ పురుష బహువచనాన్ని యథాతథంగా నిలిపింది.
- source_word: οἶδά σε τίς εἶ
  choice: నీవెవరో నాకు తెలుసు
  rationale: మాట్లాడుతున్నవాడు యేసు గుర్తింపును తెలుసునని ప్రకటించే భావాన్ని స్పష్టమైన, సహజ తెలుగు రూపంలో అందిస్తుంది.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: దేవుని పరిశుద్ధుడు
  rationale: ఆర్టికల్‌తో ఉన్న పదబంధాన్ని బిరుదుగా ఉంచుతూ, τοῦ θεοῦ అనే షష్ఠీ సంబంధాన్ని విస్తరించి వ్యాఖ్యానించకుండా కాపాడింది.
theological_decisions:
- issue: దయ్యం గుర్తించిన క్రీస్తు సంబంధ బిరుదు
  choice: దేవుని పరిశుద్ధుడు
  alternative: దేవుని పవిత్రుడు; దేవునికి చెందిన పరిశుద్ధుడు
  rationale: మూలంలోని బిరుదు బలాన్ని నిలుపుతుంది; అయితే దానిని మరింత విస్తృతమైన సిద్ధాంత ప్రకటనగా మార్చదు. ‘పరిశుద్ధుడు’ ఆధునిక ప్రామాణిక తెలుగు క్రైస్తవ పరిభాషలో గౌరవప్రదంగా, స్పష్టంగా ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వినిపించే, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ శైలి. ‘మాతో నీకేమి పని?’ అనే నానుడి సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని విరోధ ధోరణిని నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
