id: MRK.1.7
reference: Mark 1:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐκήρυσσεν λέγων· Ἔρχεται ὁ ἰσχυρότερός μου ὀπίσω μου, οὗ οὐκ εἰμὶ ἱκανὸς κύψας λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/007.yaml
  text: And he was proclaiming[a], saying, “The one stronger than I is coming after me[c][b], of whom I am not worthy to stoop down and untie the strap of his sandals.”
translation:
  language: te
  text: 'అతడు ఇలా ప్రకటిస్తూ ఉండేవాడు: “నాకంటే బలమైనవాడు నా తర్వాత వస్తున్నాడు. వంగి ఆయన చెప్పుల పట్టీని విప్పడానికి కూడా నేను యోగ్యుణ్ణి కాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκήρυσσεν
  choice: ప్రకటిస్తూ ఉండేవాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగిన లేదా పునరావృతమైన ప్రకటనను సూచిస్తుంది; ‘ప్రకటించు’ అనే పదం κηρύσσω లోని బహిరంగ ప్రకటన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: λέγων
  choice: ఇలా
  rationale: ప్రకటనలోని మాటలను పరిచయం చేసే గ్రీకు కృదంతాన్ని తెలుగులో సహజమైన ఉద్ధరణ పరిచయంగా అందిస్తుంది.
- source_word: Ἔρχεται
  choice: వస్తున్నాడు
  rationale: వర్తమాన రూపంలోని తక్షణత్వాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ὁ ἰσχυρότερός μου
  choice: నాకంటే బలవంతుడు
  rationale: ఆర్టికల్‌తో నామవాచకంగా వాడిన తులనాత్మక విశేషణానికి ఇది స్పష్టమైన, సహజమైన తెలుగు రూపం.
- source_word: ὀπίσω μου
  choice: నా తర్వాత
  rationale: ఇక్కడ యోహాను తర్వాత రాబోయే వ్యక్తిని సూచించే కాలక్రమ భావాన్ని ప్రధానంగా తెలియజేస్తుంది; ‘నా వెనుక’ అనే స్థలార్థం సందర్భంలో తక్కువ సహజం.
- source_word: ἱκανὸς
  choice: యోగ్యుణ్ణి
  rationale: ఈ సందర్భంలో కేవలం సామర్థ్యలేమికన్నా రాబోయే వ్యక్తి ఎదుట యోహాను వ్యక్తం చేసిన అనర్హత, వినయాన్ని తెలియజేస్తుంది.
- source_word: κύψας λῦσαι
  choice: వంగి ... విప్పడానికి
  rationale: విప్పే ముందు లేదా దానితో పాటు జరిగే శారీరకంగా వంగే చర్యను సహజమైన తెలుగు క్రియాక్రమంలో నిలుపుతుంది.
- source_word: τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: ఆయన చెప్పుల పట్టీ
  rationale: పురాతన పాదరక్షలను కట్టే తోలు పట్టీని స్పష్టంగా సూచిస్తుంది; ‘చెప్పులు’ సాధారణ ఆధునిక తెలుగు పాఠకునికి సహజంగా అర్థమవుతుంది.
theological_decisions:
- issue: యోహాను వినయ ప్రకటనలో ἱκανός భావం
  choice: నేను యోగ్యుణ్ణి కాను
  alternative: నేను తగినవాణ్ణి కాను / నాకు సామర్థ్యం లేదు
  rationale: సందర్భం సాధారణ శారీరక సామర్థ్యలేమిని కాక, రాబోయే బలవంతుని ఎదుట యోహాను తన తక్కువ స్థితిని వ్యక్తం చేయడాన్ని సూచిస్తుంది. ‘యోగ్యుణ్ణి కాను’ ఈ భావాన్ని తెలియజేస్తుంది; పాఠ్యంలో లేని అదనపు సిద్ధాంత నిర్ధారణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. గ్రీకు అసంపూర్ణ భూతకాలాన్ని ‘ప్రకటిస్తూ ఉండేవాడు’తో, వర్తమాన తక్షణత్వాన్ని ‘వస్తున్నాడు’తో వ్యక్తం చేశాం. పాదరక్షల పట్టీ విప్పడం అనే సేవకుని స్థాయి పనిలోని వినయాన్ని వివరణ జోడించకుండా పాఠ్యమే తెలియజేసేలా ఉంచాం.
