  terminology: ‘యోగ్యుణ్ణి కాను’ ἱκανός సందర్భంలోని అనర్హత/వినయ భావాన్ని తగిన విధంగా ఇస్తుంది. ‘చెప్పుల పట్టీ’ పురాతన చెప్పుల తోలు పట్టీకి అర్థవంతమైన ఆధునిక పదబంధం. ‘బలవంతుడు’కి కొన్ని సందర్భాల్లో బలప్రయోగం చేసే వ్యక్తి అనే అనవసర సూచన ఉండవచ్చు; ‘బలమైనవాడు’ మూలంలోని తులనాత్మక శక్తి భావాన్ని మరింత తటస్థంగా తెలియజేస్తుంది.
