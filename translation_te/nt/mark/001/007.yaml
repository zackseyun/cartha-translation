  source_fidelity: గ్రీకు వాక్యంలోని అసంపూర్ణకాలపు నిరంతర ప్రకటన (ἐκήρυσσεν), వర్తమాన తక్షణత్వం (ἔρχεται), తులనాత్మక భావం, మరియు వంగి పట్టీ విప్పడం అన్న చర్యలను ముసాయిదా మొత్తం మీద విశ్వసనీయంగా ప్రతిబింబిస్తుంది. అయితే ἰσχυρότερος‌కు ‘బలవంతుడు’ కంటే ‘బలమైనవాడు’ మరింత తటస్థంగా, నేరుగా సరిపోతుంది.
