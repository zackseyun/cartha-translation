source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐκάλεσεν αὐτούς. καὶ ἀφέντες τὸν πατέρα αὐτῶν Ζεβεδαῖον ἐν τῷ πλοίῳ μετὰ τῶν μισθωτῶν ἀπῆλθον ὀπίσω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/020.yaml
  text: And immediately he called them[a], and leaving their father Zebedee in the boat with the hired workers, they went after him.
translation:
  language: te
  text: వెంటనే ఆయన వారిని పిలిచాడు. వారు తమ తండ్రి జెబెదయిని పడవలో కూలీలతో కలిసి విడిచిపెట్టి, ఆయన వెనుక వెళ్లారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనను అనుసరించారు.’ గ్రీకు పదబంధం భౌతికంగా ఆయన వెనుక వెళ్లడాన్నీ, శిష్యులుగా ఆయనను అనుసరించడం ప్రారంభించడాన్నీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు వర్ణనలోని తక్షణత్వాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐκάλεσεν
  choice: పిలిచాడు
  rationale: καλέω యొక్క సూటి భావాన్ని ఇస్తుంది; ‘ఆజ్ఞాపించాడు’ లేదా ‘ఆహ్వానించాడు’ అని అధికంగా నిర్దిష్టం చేయదు.
- source_word: ἀφέντες
  choice: విడిచిపెట్టి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన అనుబంధ చర్యను సహజంగా తెలియజేస్తుంది; ‘త్యజించి’ అనే మరీ కఠిన భావాన్ని చేర్చదు.
- source_word: πατέρα αὐτῶν Ζεβεδαῖον
  choice: తమ తండ్రి జెబెదయిని
  rationale: స్వాధీన సంబంధాన్ని సహజంగా తెలియజేస్తూ వ్యక్తి పేరును ప్రామాణిక తెలుగు రూపంలో ఇస్తుంది.
- source_word: ἐν τῷ πλοίῳ
  choice: పడవలో
  rationale: గలిలయ చేపల వేట సందర్భానికి ‘పడవ’ సహజమైన సమానార్థకం.
- source_word: μετὰ τῶν μισθωτῶν
  choice: కూలిపనివారితో పాటు
  rationale: జీతం లేదా కూలి కోసం పనిచేసేవారనే μισθωτός భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా ఇస్తుంది.
- source_word: ἀπῆλθον
  choice: వెళ్లారు
  rationale: స్థలాన్ని విడిచి కదిలిన భావాన్ని సందర్భం ఇప్పటికే స్పష్టం చేస్తుంది; తెలుగులో అనవసర పునరుక్తి లేకుండా సహజంగా ఉంటుంది.
- source_word: ὀπίσω αὐτοῦ
  choice: ఆయన వెనుక
  rationale: భౌతికంగా వెనుక వెళ్లడమనే భావాన్నీ, శిష్యులుగా అనుసరించడం మొదలుపెట్టడమనే సూచననూ ఒకేసారి నిలుపగలదు.
theological_decisions:
- issue: ὀπίσω αὐτοῦ లోని శిష్యత్వ సూచన
  choice: ఆయన వెనుక వెళ్లారు
  alternative: ఆయనను అనుసరించారు
  rationale: ఎంచుకున్న రూపం భౌతిక కదలికను నేరుగా ఉంచుతూ శిష్యత్వ భావాన్ని అంతర్లీనంగా అనుమతిస్తుంది; ‘అనుసరించారు’ ఒక్కటే వాడితే ఆ ద్వంద్వార్థం కొంత పరిష్కరించబడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కథన గాంభీర్యం మరియు మూలంలోని శిష్యత్వ ద్వంద్వార్థం నిలిచేలా అనువదించబడింది.
