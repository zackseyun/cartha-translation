source:
  edition: SBLGNT
  text: καὶ ⸀προβὰς ὀλίγον εἶδεν Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ αὐτοὺς ἐν τῷ πλοίῳ καταρτίζοντας τὰ δίκτυα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/019.yaml
  text: And going on a little farther[a], he saw James the son of Zebedee and John his brother, and they were in the boat mending the nets,
translation:
  language: te
  text: ఆయన ఇంకొంచెం ముందుకు వెళ్లి, జెబెదయి కుమారుడైన యాకోబును, అతని సోదరుడైన యోహానును చూశాడు. వారు పడవలో వలలను బాగుచేస్తూ ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “వలలను సరిచేస్తూ” లేదా “వలలను సిద్ధం చేస్తూ” అని కూడా అనువదించవచ్చు. గ్రీకు క్రియ దేనినైనా క్రమంలో పెట్టడం లేదా మళ్లీ సరైన స్థితికి తేవడం అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: προβὰς ὀλίγον
  choice: ఇంకొంచెం ముందుకు వెళ్లి
  rationale: ఈ భూతకాల అసమాపక క్రియ కొద్దిదూరం ముందుకు సాగిన తరువాత జరిగిన చర్యను సూచిస్తుంది. ఈ తెలుగు రూపం కదలిక కొనసాగిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἶδεν
  choice: చూశాడు
  rationale: ὁράω యొక్క సాధారణ కథనార్థాన్ని అదనపు నొక్కిచెప్పడం లేకుండా నేరుగా అందిస్తుంది.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: జెబెదయి కుమారుడైన యాకోబును
  rationale: గ్రీకు పదబంధం యాకోబును అతని తండ్రి పేరుతో గుర్తిస్తుంది; ఈ నిర్మాణం ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: అతని సోదరుడు యోహానును
  rationale: αὐτοῦ సహజంగా యాకోబును సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో బంధుత్వాన్ని పేరుకు ముందు ఉంచడం స్పష్టంగా ఉంటుంది.
- source_word: ἐν τῷ πλοίῳ
  choice: పడవలో
  rationale: నిర్దిష్ట పడవను సందర్భం సూచిస్తుంది; తెలుగులో విభక్తి రూపమే సహజంగా ఉండి ప్రత్యేక నిర్దేశక పదం అవసరం లేదు.
- source_word: καταρτίζοντας
  choice: బాగుచేస్తూ
  rationale: καταρτίζω దేనినైనా సరిచేయడం, సిద్ధం చేయడం, క్రమంలో పెట్టడం అనే విస్తృత భావాలను కలిగి ఉంది. చేపల వలల సందర్భంలో ‘బాగుచేస్తూ’ సహజంగా ఉండి, కేవలం చిరుగులు కుట్టడం అనే అర్థానికే పరిమితం చేయదు.
- source_word: τὰ δίκτυα
  choice: వలలను
  rationale: ఇవి చేపలు పట్టే వలలు. గ్రీకులో స్వామ్యసూచక పదం లేనందున తెలుగులోనూ ‘వారి’ అని చేర్చలేదు.
- source_word: καὶ αὐτούς
  choice: వారు కూడా
  rationale: αὐτούς అనేది చూశాడు అనే క్రియకు కర్మగా ఉండి, తరువాతి అసమాపక క్రియ వారు చేస్తున్న పనిని వివరిస్తుంది. తెలుగులో దీనిని కొత్త వాక్యంగా ‘వారు కూడా ... ఉన్నారు’ అని చెప్పడం సహజం; καί లోని సమాంతర భావాన్ని ‘కూడా’ నిలుపుతుంది.
