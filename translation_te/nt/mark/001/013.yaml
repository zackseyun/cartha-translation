review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly represents the wilderness, forty-day duration, Satan’s agency, the wild animals, and the angels’ ongoing service. However, the main rendering “శోధించబడుతూ” is less precise in current standard Telugu: it can readily suggest examination/investigation or testing rather than Satan’s enticement. The Greek πειραζόμενος retains a testing sense lexically, but in this context its primary sense is being tempted.'
  naturalness: The sentence is otherwise fluent and appropriately dignified. Replacing “శోధించబడుతూ” with “ప్రలోభపెట్టబడుతూ” communicates the hostile action naturally and clearly; the footnote can preserve “పరీక్షించబడుతూ” as the viable alternative.
  terminology: “అరణ్యంలో,” “సాతాను,” “అడవి జంతువులతో,” “దేవదూతలు,” and “సేవ చేస్తూ ఉన్నారు” are suitable modern-standard Telugu biblical terminology. The revised wording distinguishes temptation from testing without imposing an interpretive expansion.
  issues:
  - severity: medium
    issue: The main term “శోధించబడుతూ” is ambiguous in contemporary Telugu.
    rationale: While traditional biblical usage can employ శోధించు for temptation, modern readers may understand it chiefly as examining, investigating, or testing. Since Satan is explicitly the agent, “ప్రలోభపెట్టబడుతూ” more directly conveys the contextual force of πειραζόμενος. The alternative testing sense should remain in the footnote.
  revised_text: ఆయన అరణ్యంలో నలభై రోజులు సాతాను చేత ప్రలోభపెట్టబడుతూ[a] ఉన్నాడు; ఆయన అడవి జంతువులతో ఉన్నాడు, దేవదూతలు ఆయనకు సేవ చేస్తూ ఉన్నారు.
  revised_footnotes:
  - marker: a
    text: లేదా, “సాతాను చేత పరీక్షించబడుతూ.” గ్రీకు క్రియకు “ప్రలోభపెట్టు” లేదా “పరీక్షించు” అనే అర్థాలు ఉండవచ్చు; ఇక్కడ సాతాను కర్తగా ఉండడం వల్ల “ప్రలోభపెట్టబడుతూ” అనే అర్థం సందర్భానికి బాగా సరిపోతుంది.
    reason: lexical_alternative
  revision_rationale: The revision makes the principal contextual sense of πειραζόμενος explicit in modern Telugu while retaining the genuine lexical alternative, “being tested,” in the footnote. All other wording is retained because it accurately and naturally reflects the Greek narrative.
