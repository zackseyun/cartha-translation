  text: καὶ ⸀ἦν ἐν τῇ ἐρήμῳ ⸂τεσσεράκοντα ἡμέρας⸃ πειραζόμενος ὑπὸ τοῦ Σατανᾶ, καὶ ἦν μετὰ τῶν θηρίων, καὶ οἱ ἄγγελοι διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/013.yaml
  text: And he was in the wilderness forty days[a], being tempted by Satan; and he was with the wild animals, and the angels were ministering to him.
translation:
  language: te
  text: ఆయన అరణ్యంలో నలభై రోజులు సాతాను చేత ప్రలోభపెట్టబడుతూ[a] ఉన్నాడు; ఆయన అడవి జంతువులతో ఉన్నాడు, దేవదూతలు ఆయనకు సేవ చేస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సాతాను చేత పరీక్షించబడుతూ.” గ్రీకు క్రియకు “ప్రలోభపెట్టు” లేదా “పరీక్షించు” అనే అర్థాలు ఉండవచ్చు; ఇక్కడ సాతాను కర్తగా ఉండడం వల్ల “ప్రలోభపెట్టబడుతూ” అనే అర్థం సందర్భానికి బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρήμῳ
  choice: అరణ్యంలో
  rationale: జనావాసం లేని నిర్జన ప్రదేశాన్ని సహజంగా సూచిస్తుంది; ఇసుక ఎడారి అని అనవసరంగా నిర్దిష్టపరచకుండా బైబిలు సందర్భంలోని అరణ్య భావాన్ని నిలుపుతుంది.
- source_word: τεσσεράκοντα ἡμέρας
  choice: నలభై రోజులు
  rationale: కాలవ్యవధిని తెలిపే గ్రీకు పదబంధానికి నేరమైన, సహజమైన అనువాదం; పరీక్షా కాలాలకు సంబంధించిన బైబిలు ప్రతిధ్వనిని వివరణగా చేర్చకుండా అలాగే ఉంచుతుంది.
- source_word: πειραζόμενος
  choice: శోధించబడుతూ
  rationale: ఈ సందర్భంలో సాతాను కర్తగా ఉండడం వల్ల ప్రలోభపరచడం అనే ప్రతికూల భావం ప్రధానంగా ఉంది. ‘శోధించబడుతూ’ తెలుగు బైబిలు వాడుకలో ఆ భావాన్ని తెలియజేస్తూనే, పరీక్షించబడడం అనే మూలపదంలోని సాధ్యమైన అర్థాన్ని పూర్తిగా తొలగించదు.
- source_word: ὑπὸ τοῦ Σατανᾶ
  choice: సాతాను చేత
  rationale: వ్యక్తిగతమైన అతీంద్రియ విరోధిని సూచించే సంప్రదాయ నామరూపాన్ని నిలుపుతూ, గ్రీకులోని కర్తృత్వాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: μετὰ τῶν θηρίων
  choice: అడవి జంతువులతో
  rationale: మానవులకు మచ్చిక కాని జంతువులను స్పష్టమైన ఆధునిక తెలుగులో సూచిస్తుంది; ‘మృగాలు’ కంటే సాధారణ పాఠకులకు నేరుగా అర్థమవుతుంది.
- source_word: ἄγγελοι
  choice: దేవదూతలు
  rationale: ఈ అతీంద్రియ సందర్భంలో ἄγγελοι మానవ సందేశకులను కాక పరలోక జీవులను సూచిస్తుంది.
- source_word: διηκόνουν αὐτῷ
  choice: ఆయనకు సేవ చేస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న సేవ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: καὶ ἦν ... καὶ ἦν ... καὶ
  choice: ఉన్నాడు; ఆయన ... ఉన్నాడు, ...
  rationale: తెలుగులో చదవడానికి సహజంగా ఉండే విరామచిహ్నాలతో సంఘటనల వరుసను ఉంచి, మార్కు వాక్యంలోని సమాంతర నిర్మాణాన్ని అతిగా మెరుగుపరచకుండా కాపాడుతుంది.
theological_decisions:
- issue: సాతాను కర్తగా ఉన్నప్పుడు πειραζόμενος పదం యొక్క భావం
  choice: శోధించబడుతూ
  alternative: పరీక్షించబడుతూ
  rationale: సాతాను ప్రత్యక్ష కర్తగా ఉన్నందున ప్రలోభానికి గురిచేయడం అనే భావం సందర్భానికి బాగా సరిపోతుంది. అయినా గ్రీకు క్రియకు ‘పరీక్షించు’ అనే అర్థం కూడా ఉండగలదు కాబట్టి ఆ నిజమైన భావసందిగ్ధతను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కథన శైలి వాడబడింది. ‘అరణ్యం,’ ‘సాతాను,’ ‘దేవదూతలు’ వంటి స్థిరమైన బైబిలు పదాలను నిలుపుతూ, వాక్య నిర్మాణాన్ని సహజంగా ఉంచాం.
