revisions:
- from: ఆయన అరణ్యంలో నలభై రోజులు సాతాను చేత శోధించబడుతూ[a] ఉన్నాడు; ఆయన అడవి జంతువులతో ఉన్నాడు, దేవదూతలు ఆయనకు సేవ చేస్తూ ఉన్నారు.
  to: ఆయన అరణ్యంలో నలభై రోజులు సాతాను చేత ప్రలోభపెట్టబడుతూ[a] ఉన్నాడు; ఆయన అడవి జంతువులతో ఉన్నాడు, దేవదూతలు ఆయనకు సేవ చేస్తూ ఉన్నారు.
