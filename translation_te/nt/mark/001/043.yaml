    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβριμησάμενος
  choice: కఠినంగా హెచ్చరించి
  rationale: ఈ క్రియలో తీవ్రమైన భావోద్వేగంతో కూడిన గట్టి హెచ్చరిక లేదా కఠిన ఆదేశం అనే భావం ఉంది. తరువాతి వచనంలోని ఆజ్ఞను దృష్టిలో ఉంచుకొని, వ్యక్తిపై నిందను అనవసరంగా సూచించకుండా దాని తీవ్రతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: αὐτῷ
  choice: అతనిని
  rationale: స్వస్థత పొందిన వ్యక్తిని సూచించే దత్తివాచక సర్వనామం; తెలుగు ప్రయోగంలో ‘హెచ్చరించు’ క్రియకు సహజంగా కర్మరూపంలో ఇచ్చాం.
- source_word: εὐθύς
  choice: వెంటనే
  rationale: మార్కు కథనంలోని తక్షణత్వాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐξέβαλεν
  choice: అక్కడి నుండి పంపివేశాడు
  rationale: మూల క్రియ సాధారణంగా ‘బయటికి తోలివేయడం’ వంటి బలమైన భావాన్ని కలిగిస్తుంది. ఈ సందర్భంలో ‘పంపివేశాడు’ సహజంగా ఉండగా, ‘అక్కడి నుండి’ దిశాభావాన్ని తెలియజేస్తుంది; మరింత బలమైన ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: αὐτόν
  choice: అతనిని
  rationale: అదే స్వస్థత పొందిన వ్యక్తిని సూచించే కర్మవాచక సర్వనామం.
- source_word: καὶ
  choice: ఆయన
  rationale: తెలుగులో విడిగా ఉన్న వచనంగా సహజమైన వాక్యారంభం కోసం కర్తను స్పష్టం చేశాం; మూలంలోని సంధాన ప్రవాహం చర్యల వరుసలో నిలిచింది.
theological_decisions:
- issue: స్వస్థత పొందిన వ్యక్తిపట్ల యేసు చర్యలోని తీవ్రత
  choice: యేసు అతనికి కఠినమైన హెచ్చరిక ఇచ్చి బలంగా పంపివేసినట్లు అనువదించడం
  alternative: కేవలం దృఢమైన ఆదేశం ఇచ్చి సాధారణంగా పంపినట్లు అనువదించడం; లేదా ఆ వ్యక్తినే గద్దించినట్లు అనువదించడం
  rationale: ἐμβριμησάμενος, ἐξέβαλεν రెండూ అసాధారణమైన తీవ్రతను కలిగి ఉన్నాయి. అనువాదం ఆ బలాన్ని నిలుపుతుంది; అయితే యేసుకు పాపపూరిత కోపం ఉందని గానీ, ఆ వ్యక్తిపై శత్రుత్వం చూపాడని గానీ నిర్ణయించి చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గంభీరంగా ఉంది. మూలంలోని రెండు బలమైన క్రియల తీవ్రతను ప్రధాన పాఠం మరియు పాదసూచికల ద్వారా కాపాడింది.
