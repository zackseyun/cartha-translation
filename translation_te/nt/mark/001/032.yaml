source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης, ὅτε ⸀ἔδυ ὁ ἥλιος, ἔφερον πρὸς αὐτὸν πάντας τοὺς κακῶς ἔχοντας καὶ τοὺς δαιμονιζομένους·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/032.yaml
  text: When evening came[a], when the sun had set[d][c][b], they brought to him all who were sick and those who were demon-possessed.
translation:
  language: te
  text: సాయంకాలమై, సూర్యుడు అస్తమించినప్పుడు, అనారోగ్యంతో ఉన్న వారందరినీ, దయ్యాలు పట్టిన వారినీ[a] ఆయన దగ్గరికి తీసుకువస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దయ్యాల ప్రభావానికి లోనైన వారిని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: సాయంకాలమై
  rationale: ఈ genitive absolute కథనంలో కాలమార్పును సూచిస్తుంది. ‘సాయంకాలమై’ అనేది సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: ὅτε ἔδυ ὁ ἥλιος
  choice: సూర్యుడు అస్తమించినప్పుడు
  rationale: ὅτε యొక్క సాధారణ కాలార్థమైన ‘అప్పుడు/ఎప్పుడు’ను నిలుపుతూ, ἔδυ సూచించే సూర్యాస్తమయాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; ‘తర్వాత’ అని కారణాత్మక లేదా క్రమార్థాన్ని అధికంగా నిర్ధారించదు.
- source_word: ἔφερον
  choice: తీసుకువస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ ongoing లేదా వరుసగా జరిగిన చర్యను చిత్రిస్తుంది. తెలుగు ప్రగతిశీల రూపం ప్రజలను నిరంతరంగా తీసుకువస్తున్న కథన దృశ్యాన్ని నిలుపుతుంది.
- source_word: πρὸς αὐτὸν
  choice: ఆయన దగ్గరికి
  rationale: πρός + accusative ఇక్కడ ఒక వ్యక్తి వైపు కదలికను సూచిస్తుంది. మూలంలో పేరు పునరుక్తం కానందున ‘ఆయన’ను నిలిపాం.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: అనారోగ్యంతో ఉన్న వారందరినీ
  rationale: κακῶς ἔχειν అనే నుడికారం శారీరకంగా బాగోలేని లేదా జబ్బుపడిన స్థితిని సూచిస్తుంది. ఈ రూపం πάντας యొక్క సమగ్రతను కూడా స్పష్టంగా ఉంచుతుంది.
- source_word: τοὺς δαιμονιζομένους
  choice: దయ్యాలు పట్టిన వారిని
  rationale: దయ్యాల శక్తికి లోనైనవారిని సూచించే participle‌కు ఇది సాధారణ తెలుగు బైబిలు భాషలో స్పష్టమైన రూపం. దయ్యాల కార్యాన్ని కేవలం అనారోగ్యంగా మార్చకుండా, పదం తెలిపేదానికంటే విస్తృతమైన దయ్యశాస్త్రాన్ని కూడా చేర్చదు.
theological_decisions:
- issue: δαιμονιζομένουςను దయ్యాల వాస్తవ కార్యాన్ని తొలగించకుండా, దాని స్వభావాన్ని అతిగా నిర్దిష్టం చేయకుండా అనువదించడం
  choice: దయ్యాలు పట్టిన వారు
  alternative: దయ్యాల ప్రభావానికి లోనైన వారు
  rationale: ప్రధాన పాఠం పదం యొక్క బలాన్ని సాధారణ తెలుగులో తెలియజేస్తుంది. అయితే గ్రీకు participle ఆధునిక ‘possession’ అనే సాంకేతిక వర్గీకరణను తప్పనిసరిగా నిర్దేశించదు కాబట్టి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: ἔφερον యొక్క క్రియాంశం
  choice: తీసుకువస్తూ ఉన్నారు
  alternative: తీసుకువచ్చారు
  rationale: అసంపూర్ణ భూతకాలం కొనసాగుతున్న లేదా పునరావృతమైన చర్యను చూపుతుంది; ప్రగతిశీల తెలుగు రూపం ఆ కథన ప్రవాహాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘ఆయన దగ్గరికి’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది; ‘తీసుకువస్తూ ఉన్నారు’ మూలంలోని కొనసాగుతున్న చర్యను ఉద్దేశపూర్వకంగా నిలుపుతుంది.
