  to: 'ఆయన అతనితో ఇలా అన్నాడు: “జాగ్రత్తగా ఉండు; ఎవరికీ ఏమీ చెప్పకు. బదులుగా వెళ్లి యాజకునికి నిన్ను నీవు చూపించు, నీ శుద్ధీకరణ కోసం మోషే ఆజ్ఞాపించిన వాటిని వారికి సాక్ష్యంగా అర్పించు.[a]”'
  rationale: The revision corrects the Telugu reflexive imperative and restores the Greek syntactic relation in which the prescribed offering is made “as a testimony to them.” It preserves all material commands and retains the source’s ambiguity concerning the audience and force of the testimony.
