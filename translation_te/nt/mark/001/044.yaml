id: MRK.1.44
reference: Mark 1:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ὅρα μηδενὶ μηδὲν εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου ἃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/044.yaml
  text: And he says to him[a], “See that you say nothing to anyone; rather, go, show yourself to the priest, and offer for your cleansing what Moses commanded, as a testimony to them.”
translation:
  language: te
  text: 'ఆయన అతనితో ఇలా అన్నాడు: “జాగ్రత్తగా ఉండు; ఎవరికీ ఏమీ చెప్పకు. బదులుగా వెళ్లి యాజకునికి నిన్ను నీవు చూపించు, నీ శుద్ధీకరణ కోసం మోషే ఆజ్ఞాపించిన వాటిని వారికి సాక్ష్యంగా అర్పించు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారికి రుజువుగా”; ఈ పదబంధం యాజకులకు లేదా ఇతరులకు చూపబడే ఆధారాన్ని సూచించవచ్చు. కొందరు దీనిని మరింత కఠినమైన భావంలో “వారికి వ్యతిరేకంగా సాక్ష్యంగా” అని అర్థం చేసుకుంటారు.
    reason: ‘εἰς μαρτύριον αὐτοῖς’ అనే పదబంధంలో ‘వారు’ ఎవరనే విషయమూ, సాక్ష్యం కేవలం ఆధారమా లేక వ్యతిరేక సాక్ష్యమా అనే దిశయూ నిర్దిష్టంగా లేవు.
lexical_decisions:
- source_word: Ὅρα
  choice: జాగ్రత్త
  rationale: ఇక్కడ ఇది చూడమనే సాధారణ ఆజ్ఞ కాదు; వెంట వచ్చే నిషేధాన్ని గట్టిగా హెచ్చరించే ఆజ్ఞ. ఆధునిక తెలుగులో ‘జాగ్రత్త’ ఆ బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: μηδενὶ μηδὲν εἴπῃς
  choice: ఎవరికీ ఏమీ చెప్పకు
  rationale: రెండు నిరాకరణ సర్వనామాల సమగ్ర బలాన్ని, అంటే వ్యక్తి మరియు విషయం రెండింటినీ మినహాయింపులేకుండా నిషేధించడాన్ని, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀλλὰ
  choice: బదులుగా
  rationale: చేయకూడని పనికి విరుద్ధంగా చేయవలసిన పనిని సూచించే సరిదిద్దే వ్యత్యాసాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ὕπαγε
  choice: వెళ్లి
  rationale: సాధారణ గమన ఆజ్ఞకు నేరుగా, సహజంగా సరిపోతుంది; తరువాతి ఆజ్ఞతో తెలుగు వాక్యప్రవాహంలో అనుసంధానించబడింది.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: నిన్ను నీవు యాజకునికి చూపించుకో
  rationale: ప్రతిబింబక సర్వనామాన్ని నిలుపుతూ, ధర్మశాస్త్రానుసారమైన యాజక పరిశీలన సందర్భాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἱερεῖ
  choice: యాజకునికి
  rationale: నిర్దిష్టమైన, తగిన యాజక అధికారిని సూచించే గ్రీకు నిర్దేశక భావాన్ని తెలుగు సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: προσένεγκε
  choice: అర్పించు
  rationale: మోషే ధర్మశాస్త్రంలోని బలి/ఆరాధనా సందర్భం వల్ల సాధారణమైన ‘తీసుకురా’ కంటే ‘అర్పించు’ సముచితం.
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: నీ శుద్ధీకరణ కోసం
  rationale: ఆచారపరమైన శుద్ధిని సూచిస్తూ, సంబంధం లేదా ఉద్దేశాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἃ προσέταξεν Μωϋσῆς
  choice: మోషే ఆజ్ఞాపించిన వాటిని
  rationale: గ్రీకులోని నపుంసక బహువచన సంబంధ సర్వనామాన్ని తెలుగులో నేరుగా నిలుపుతూ, నిర్దేశించబడిన అర్పణల సమాహారాన్ని సూచిస్తుంది.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: అది వారికి సాక్ష్యంగా ఉంటుంది
  rationale: ఉద్దేశం లేదా ఫలిత భావాన్ని తెలియజేస్తూ, ‘వారికి’ అనే దిశార్థాన్ని నిలుపుతుంది; అది అనుకూల సాక్ష్యమా, వ్యతిరేక సాక్ష్యమా అన్నది ప్రధాన పాఠ్యంలో నిర్ణయించదు.
theological_decisions:
- issue: ‘εἰς μαρτύριον αὐτοῖς’లో ‘వారు’ ఎవరు, సాక్ష్యం ఏ స్వభావమైంది
  choice: ‘వారికి సాక్ష్యంగా’ అని విస్తృతంగానే ఉంచడం
  alternative: ‘యాజకులకు రుజువుగా’ లేదా ‘వారికి వ్యతిరేకంగా సాక్ష్యంగా’
  rationale: గ్రీకు పాఠ్యం ‘వ్యతిరేకంగా’ అని స్పష్టంగా చెప్పదు; ‘వారు’ యాజకులు కావచ్చు, ఇతర పరిశీలకులు లేదా సమాజం కావచ్చు. అందువల్ల సూచ్యార్థాన్ని, సాక్ష్యపు అనుకూల/ప్రతికూల బలాన్ని నిర్ణయించకుండా అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ఆజ్ఞల నేరత్వం, యాజక సంబంధిత ధర్మశాస్త్ర నేపథ్యం, చివరి పదబంధంలోని నిజమైన అస్పష్టత కాపాడబడ్డాయి.
