source:
  edition: SBLGNT
  text: οὐχ οὕτως δέ ⸀ἐστιν ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ⸂μέγας γενέσθαι⸃ ἐν ὑμῖν, ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/043.yaml
  text: But it is not so among you[a]. Instead, whoever wants to become great among you will be your servant[b],
translation:
  language: te
  text: అయితే మీ మధ్య అలా కాదు[a]. బదులుగా, మీ మధ్య గొప్పవాడిగా కావాలనుకునేవాడు మీ సేవకుడిగా ఉంటాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అయితే మీ మధ్య ఈ విధంగా కాదు.”
    reason: lexical_alternative
  - marker: b
    text: '“ఉంటాడు” అనే భవిష్యత్ క్రియ సందర్భంలో “ఉండాలి” అనే భావాన్ని కూడా ఇవ్వవచ్చు: మీ మధ్య గొప్పవాడిగా కావాలనుకునేవాడు మీ సేవకుడిగా ఉండాలి.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχ οὕτως δέ ἐστιν ἐν ὑμῖν
  choice: అయితే మీ మధ్య అలా కాదు
  rationale: δέ లోని వ్యతిరేక భావాన్ని ‘అయితే’ తెలియజేస్తుంది; οὐχ οὕτως అనే విధాననిషేధాన్ని సహజమైన ఆధునిక తెలుగులో ‘అలా కాదు’గా ఉంచింది. ἐν ὑμῖν సమాజ సంబంధమైన అర్థంలో ‘మీ మధ్య’గా అనువదించబడింది.
- source_word: ἀλλ’
  choice: దానికి బదులు
  rationale: లోకాధికారుల గొప్పతనపు పద్ధతికి యేసు చెప్పే పద్ధతి పూర్తిగా విరుద్ధమని స్పష్టంగా చూపిస్తుంది.
- source_word: ὃς ἂν θέλῃ
  choice: కావాలనుకునేవాడు
  rationale: ἄνతో కూడిన సంబంధవాచక నిర్మాణంలోని సాధారణ, అనిర్దిష్ట భావాన్నీ, θέλωలోని ఇచ్ఛా భావాన్నీ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: μέγας γενέσθαι
  choice: గొప్పవాడిగా కావాలని
  rationale: γενέσθαιలోని ‘అవడం/కావడం’ భావాన్ని నిలుపుతూ, μέγας సూచించే హోదాపరమైన గొప్పతనాన్ని ‘గొప్పవాడు’గా వ్యక్తపరుస్తుంది.
- source_word: ἐν ὑμῖν
  choice: మీ మధ్య
  rationale: శిష్యుల సమూహంలో లేదా వారి పరస్పర సంబంధాలలో అనే సామాజిక భావానికి ఇది సహజమైన తెలుగు రూపం.
- source_word: ἔσται ὑμῶν διάκονος
  choice: మీ సేవకుడిగా ఉంటాడు
  rationale: ἔσται అనే భవిష్యత్ రూపాన్ని ప్రత్యక్ష ఆజ్ఞగా మార్చకుండా భవిష్యత్ రూపంలోనే ఉంచింది. διάκονος ఇక్కడ సంఘపదవిని కాక సేవచేసే వ్యక్తిని సూచిస్తున్నందున ‘సేవకుడు’ సరైనది.
theological_decisions:
- issue: యేసు బోధలో ἔσται అనే భవిష్యత్ క్రియ యొక్క బలం
  choice: మీ సేవకుడిగా ఉంటాడు
  alternative: మీ సేవకుడిగా ఉండాలి
  rationale: సందర్భంలో ఈ భవిష్యత్ క్రియ నియమాత్మక లేదా ఆదేశాత్మక భావాన్ని కలిగి ఉండవచ్చు. అయినా ప్రధాన పాఠం గ్రీకు భవిష్యత్ రూపాన్ని నిలుపుతుంది; ప్రత్యామ్నాయ ఆదేశ భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
- issue: διάκονος పదం యొక్క అనువాదం
  choice: సేవకుడు
  alternative: పరిచారకుడు
  rationale: ఇక్కడ ఈ పదం తరువాత ఏర్పడిన సంఘపదవిని సూచించకుండా, సమాజంలో వినయంగా ఇతరులకు సేవచేసే వ్యక్తిని సూచిస్తుంది. అందువల్ల ‘సేవకుడు’ భావాన్ని స్పష్టంగా, మతశాఖాపరమైన అదనపు అర్థం లేకుండా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘గొప్పవాడిగా కావడం—సేవకుడిగా ఉండడం’ అనే వాక్యంలోని ఉద్దేశపూర్వక విరోధాభాసాన్ని నిలిపాం; διάκονοςను సంఘపదవిగా అర్థం వచ్చే పదంతో అనువదించలేదు.
