id: MRK.10.10
reference: Mark 10:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ⸂εἰς τὴν οἰκίαν⸃ πάλιν οἱ μαθηταὶ ⸂περὶ τούτου⸃ ⸀ἐπηρώτων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/010.yaml
  text: And in the house again[b][a], the disciples were asking him about this.
translation:
  language: te
  text: అప్పుడు ఇంట్లో, శిష్యులు ఈ విషయం గురించి ఆయనను మళ్లీ అడిగారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: అప్పుడు
  rationale: మునుపటి సంఘటనతో ఈ దృశ్యాన్ని సహజంగా అనుసంధానిస్తుంది; గ్రీకు సంధిపదానికి సందర్భానుగుణమైన కథన ప్రయోగం.
- source_word: εἰς τὴν οἰκίαν
  choice: ఇంట్లోకి వెళ్లినప్పుడు
  rationale: εἰς లోని గమన భావాన్ని నిలుపుతూ, తదుపరి సంభాషణ ఇంటి లోపల జరిగిందని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: ఈ పదం ఇంటికి వెళ్లడాన్ని సూచిస్తుందా లేక అడగడాన్ని సూచిస్తుందా అన్న నిర్మాణాత్మక సందిగ్ధత ఉంది; ప్రధాన పాఠంలో గ్రీకు పదక్రమానికి దగ్గరగా ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: οἱ μαθηταὶ
  choice: శిష్యులు
  rationale: సందర్భంలో ఇప్పటికే తెలిసిన యేసు శిష్యుల సమూహాన్ని సూచిస్తుంది; తెలుగులో నిర్దిష్ట ఉపపదం అవసరం లేదు.
- source_word: περὶ τούτου
  choice: ఈ విషయం గురించి
  rationale: ముందటి విడాకుల సంబంధిత బోధను సూచించే సహజమైన, స్పష్టమైన తెలుగు ప్రయోగం.
- source_word: ἐπηρώτων
  choice: అడుగుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న లేదా పునరావృత చర్య భావాన్ని అదనంగా ‘మొదలుపెట్టారు’ అని చేర్చకుండా వ్యక్తం చేస్తుంది.
- source_word: αὐτόν
  choice: ఆయనను
  rationale: యేసును సూచించే కర్మ సర్వనామం; గౌరవప్రదమైన సాధారణ తెలుగు రూపం.
theological_decisions:
- issue: πάλιν ఏ అంశాన్ని విశేషిస్తుందనే సందిగ్ధత
  choice: ప్రధాన పాఠంలో ‘మళ్లీ’ని ఇంట్లోకి వెళ్లడానికీ ప్రశ్నించడానికీ మధ్య భావసంబంధం తెరిచి ఉండే స్థానంలో ఉంచడం
  alternative: ‘శిష్యులు ఈ విషయం గురించి ఆయనను మళ్లీ అడుగుతూ ఉన్నారు’
  rationale: గ్రీకు పదక్రమం πάλινను εἰς τὴν οἰκίαν తరువాత ఉంచుతుంది; అయితే సందర్భంలో అది ప్రశ్నించడాన్ని కూడా సూచించవచ్చు. ఏ భావాన్నీ సిద్ధాంతపరంగా నిర్ణయించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా ఉండేలా, అదే సమయంలో గౌరవప్రదమైన కథన శైలిని పాటించాం. గ్రీకు అసంపూర్ణ భూతకాలాన్ని ‘అడుగుతూ ఉన్నారు’గా అనువదించాం.
