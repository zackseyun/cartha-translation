id: MRK.10.18
reference: Mark 10:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/018.yaml
  text: But Jesus said to him[a], “Why do you call me good? No one is good except one—God.”
translation:
  language: te
  text: 'అయితే యేసు అతనితో ఇలా అన్నాడు: “నన్ను మంచివాడని ఎందుకు అంటున్నావు?[a] దేవుడు ఒక్కడే తప్ప మరెవ్వరూ మంచివారు కారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “నన్ను మంచివాడని దేనికి అంటున్నావు?”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి సంభాషణకు ప్రతిస్పందనగా వచ్చే స్వల్ప వ్యత్యాసాన్ని, సహజమైన తెలుగు అనుసంధానంతో తెలియజేస్తుంది.
- source_word: εἶπεν αὐτῷ
  choice: అతనితో ... అన్నాడు
  rationale: λέγω క్రియతో పరోక్ష కర్మను తెలుగులో సహజంగా, వ్యాఖ్యానం జోడించకుండా వ్యక్తపరుస్తుంది.
- source_word: Τί
  choice: ఎందుకు
  rationale: τί అక్షరార్థంగా ‘ఏమి’ అయినా, ఈ నిర్మాణంలో కారణాన్ని అడిగే క్రియావిశేషణార్థం కలిగి ఉంది; తెలుగులో ‘ఎందుకు’ సహజమైన సమానార్థకం.
- source_word: με λέγεις ἀγαθόν
  choice: నన్ను మంచివాడని ... అంటున్నావు
  rationale: కర్మతో పాటు దానికి ఆపాదించిన గుణాన్ని నేరుగా నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: మంచివాడని / మంచివారు
  rationale: రెండు సందర్భాల్లోనూ ‘మంచి’ అనే ఒకే మూలపదాన్ని వాడి గ్రీకు పునరుక్తిని, వాక్యపు వాదనాత్మక బలాన్ని కాపాడుతుంది.
- source_word: οὐδεὶς
  choice: మరెవ్వరూ ... కారు
  rationale: సార్వత్రిక నిరాకరణను గౌరవప్రదమైన, సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἰ μὴ εἷς
  choice: ఒక్కడు తప్ప
  rationale: మినహాయింపు నిర్మాణాన్ని, అలాగే ఒక్కరే అనే ప్రత్యేక ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ὁ θεός
  choice: ఆ ఒక్కడు దేవుడే
  rationale: ముందున్న ‘ఒక్కడు’ ఎవరనేది స్పష్టంగా గుర్తిస్తూ, గ్రీకు వాక్యంలోని ప్రత్యేకతను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: మంచితనం గురించి యేసు పలికిన మాటల క్రీస్తుశాస్త్ర సంబంధ సూచన
  choice: యేసు ప్రశ్నను, దేవుడు ఒక్కడే మంచివాడనే ప్రకటనను అదనపు వ్యాఖ్యానాత్మక పదాలు లేకుండా నేరుగా అనువదించడం
  alternative: యేసు తన దైవత్వాన్ని నిరాకరిస్తున్నాడని లేదా ఈ వాక్యంలోనే దాన్ని బహిరంగంగా ప్రకటిస్తున్నాడని సూచించేలా అనువదించడం
  rationale: మూలవాక్యం మనిషి వాడిన ‘మంచివాడు’ అనే సంబోధనను ప్రశ్నిస్తుంది, కానీ దాని క్రీస్తుశాస్త్ర ఫలితాన్ని ఈ వాక్యంలో స్పష్టంగా తేల్చదు. అందువల్ల ఆ ఉద్దేశపూర్వక ఉద్రిక్తతను పరిష్కరించకుండా నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ప్రత్యక్ష సంభాషణలో ఏకవచన రూపాలు సందర్భానుకూలంగా వాడబడ్డాయి.
