revisions:
- from: అయితే యేసు అతనితో, “నన్ను మంచివాడని ఎందుకు అంటున్నావు?[a] ఒక్కడు తప్ప మరెవ్వరూ మంచివారు కారు—ఆ ఒక్కడు దేవుడే” అన్నాడు.
  to: 'అయితే యేసు అతనితో ఇలా అన్నాడు: “నన్ను మంచివాడని ఎందుకు అంటున్నావు?[a] దేవుడు ఒక్కడే తప్ప మరెవ్వరూ మంచివారు కారు.”'
  rationale: The revision makes only stylistic and syntactic improvements. It retains the source’s rhetorical question, its repeated “good,” the universal negation, and the exclusive identification of God as the one exception, without resolving the saying into a doctrinal conclusion.
