source:
  edition: SBLGNT
  text: ⸀Καὶ ⸀ἐπηρώτων αὐτὸν εἰ ἔξεστιν ἀνδρὶ γυναῖκα ἀπολῦσαι, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/002.yaml
  text: And they were asking him whether it is lawful for a man to divorce a wife[a], testing him.
translation:
  language: te
  text: ఆయనను పరీక్షిస్తూ, “ఒక పురుషుడు భార్యకు విడాకులు ఇవ్వడం చట్టబద్ధమేనా?” అని వారు ఆయనను అడుగుతూ ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక భర్త తన భార్యకు విడాకులు ఇవ్వడం చట్టబద్ధమేనా?”
    reason: ἀνήρ అనే గ్రీకు పదానికి సందర్భానుసారం ‘పురుషుడు’ లేదా ‘భర్త’ అనే అర్థాలు రావచ్చు.
lexical_decisions:
- source_word: Καὶ
  choice: అని వారు
  rationale: గ్రీకు సంధాన పదం కథన ప్రవాహాన్ని కొనసాగిస్తుంది; తెలుగు వాక్య నిర్మాణంలో ప్రశ్న తరువాత ‘అని వారు’ ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: ἐπηρώτων
  choice: అడుగుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పదేపదే జరుగుతున్న ప్రశ్నించడాన్ని సూచిస్తుంది.
- source_word: ἔξεστιν
  choice: ధర్మశాస్త్ర ప్రకారం సమ్మతమేనా
  rationale: ఇక్కడ ప్రశ్న సాధారణ అనుమతి గురించి కాక, ధర్మశాస్త్రపరమైన అనుమతి గురించి. ‘సమ్మతమేనా’ న్యాయపరమైన భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἀνδρὶ
  choice: ఒక పురుషుడు
  rationale: ἀνήρ అనే పదంలోని ‘పురుషుడు/భర్త’ అనే ద్వంద్వార్థంలో సాధారణ ప్రతినిధి రూపాన్ని ప్రధాన పాఠంలో నిలుపుతుంది.
- source_word: γυναῖκα
  choice: తన భార్యకు
  rationale: విడాకుల సందర్భంలో γυνή అంటే ‘భార్య’. సహజ తెలుగు ప్రయోగం కోసం ‘తన’ను చేర్చినా, గ్రీకులో స్వత్వసూచక పదం స్పష్టంగా లేదని పాదసూచిక తెలియజేస్తుంది.
- source_word: ἀπολῦσαι
  choice: విడాకులు ఇవ్వడం
  rationale: వివాహ-న్యాయ సందర్భంలో ఈ క్రియకు ఉన్న సాంకేతిక భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πειράζοντες
  choice: పరీక్షిస్తూ
  rationale: వారి ఉద్దేశం విరోధపూర్వకమై ఉండవచ్చనే సందర్భాన్ని అతిగా వివరించకుండా, గ్రీకు కృదంతంలోని ‘పరీక్షించడం’ అనే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ἀνδρὶ మరియు γυναῖκα పదాల వివాహసంబంధ అర్థం
  choice: ఒక పురుషుడు తన భార్యకు
  alternative: ఒక భర్త తన భార్యకు
  rationale: ప్రధాన పాఠం ἀνδρὶ లోని సాధారణ ‘పురుషుడు’ భావాన్ని నిలుపుతూ, విడాకుల సందర్భం వల్ల γυναῖκα ను ‘భార్య’గా స్పష్టం చేస్తుంది. ప్రత్యామ్నాయం వివాహ సంబంధాన్ని మరింత ప్రత్యక్షంగా చెబుతుంది.
- issue: ἔξεστιν యొక్క న్యాయపరమైన భావం
  choice: ధర్మశాస్త్ర ప్రకారం సమ్మతమేనా
  alternative: అనుమతి ఉందా
  rationale: వివాదం మోషే ధర్మశాస్త్రం అనుమతించే దానిపై కేంద్రీకృతమైనందున న్యాయ-ధార్మిక కోణాన్ని వ్యక్తం చేస్తుంది; ఏ నిర్దిష్ట మతపరమైన వ్యాఖ్యానాన్నీ ముందుగానే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ప్రశ్నారూపాన్ని ఉపయోగించాం. ‘ధర్మశాస్త్ర ప్రకారం’ న్యాయపరమైన సందర్భాన్ని స్పష్టం చేస్తుంది; ‘పరీక్షిస్తూ’ మూలంలోని ఉద్దేశపూర్వక పరీక్ష భావాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా నిలుపుతుంది. పాదసూచిక సూచిక [a] ప్రధాన పాఠంలో ఉంచబడింది.
