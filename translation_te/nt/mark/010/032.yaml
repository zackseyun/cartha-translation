id: MRK.10.32
reference: Mark 10:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ἐν τῇ ὁδῷ ἀναβαίνοντες εἰς Ἱεροσόλυμα, καὶ ἦν προάγων αὐτοὺς ὁ Ἰησοῦς, καὶ ἐθαμβοῦντο, ⸂οἱ δὲ⸃ ἀκολουθοῦντες ἐφοβοῦντο. καὶ παραλαβὼν πάλιν τοὺς δώδεκα ἤρξατο αὐτοῖς λέγειν τὰ μέλλοντα αὐτῷ συμβαίνειν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/032.yaml
  text: They were on the road[a], going up to Jerusalem, and Jesus was going ahead of them; and they were astonished, while those who were following were afraid. And taking the Twelve aside again[b], he began to tell them the things that were about to happen to him.
translation:
  language: te
  text: వారు యెరూషలేముకు ఎక్కి వెళ్తూ దారిలో[a] ఉన్నారు; యేసు వారికి ముందుగా వెళ్తున్నాడు[b]. వారు విస్మయపడుతూ ఉన్నారు, ఆయనను అనుసరిస్తున్నవారు భయపడుతూ ఉన్నారు. ఆయన మళ్లీ పన్నెండుమందిని తనతో తీసుకొని, తనకు సంభవించబోయే సంగతులను వారికి చెప్పడం మొదలుపెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మార్గంలో.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారికి ముందుండి వెళ్తున్నాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῇ ὁδῷ
  choice: దారిలో
  rationale: ప్రయాణం జరుగుతున్న భౌతిక సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో చూపుతుంది; ‘మార్గంలో’ కూడా సాధ్యమే.
- source_word: ἀναβαίνοντες εἰς Ἱεροσόλυμα
  choice: యెరూషలేముకు ఎక్కి వెళ్తూ
  rationale: యెరూషలేము వైపు ఎత్తుకు ప్రయాణించడాన్నీ, సంప్రదాయ యాత్రా ప్రయోగాన్నీ నిలుపుతుంది.
- source_word: προάγων αὐτούς
  choice: వారికంటే ముందుగా నడుస్తున్నాడు
  rationale: యేసు సమూహానికి ముందు ఉన్నాడనే ప్రత్యక్ష భావాన్ని నిలుపుతూ, ‘నడిపిస్తున్నాడు’ అనే అదనపు వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: ἐθαμβοῦντο
  choice: ఆశ్చర్యచకితులయ్యారు
  rationale: సాధారణ ఆశ్చర్యం కంటే బలమైన విస్మయం లేదా కలవరంతో కూడిన ఆశ్చర్యాన్ని తెలుపుతుంది; భయమనే భావాన్ని దీనిలో కలపదు.
- source_word: οἱ δὲ ἀκολουθοῦντες
  choice: అయితే వెనుక అనుసరిస్తూ వస్తున్నవారు
  rationale: క్రియావిశేషణ రూపాన్ని నిలుపుతుంది; ఈ గుంపు ఎవరో అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: ἐφοβοῦντο
  choice: భయపడ్డారు
  rationale: సందర్భంలో ఉన్న భయాన్ని సూటిగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παραλαβὼν ... τοὺς δώδεκα
  choice: పన్నెండుమందిని తన దగ్గరకు తీసుకొని
  rationale: యేసు వారిని ప్రత్యేకంగా తనతో తీసుకున్నాడనే భావాన్ని తెలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘పక్కకు’ అనే స్థలభావాన్ని బలవంతంగా చేర్చదు.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: ఇది పునరావృత చర్య అని సరళంగా తెలియజేస్తుంది.
- source_word: ἤρξατο αὐτοῖς λέγειν
  choice: వారికి చెప్పడం మొదలుపెట్టాడు
  rationale: ఆరంభార్థాన్ని నిలుపుతూ సహజమైన తెలుగు వాక్యనిర్మాణాన్ని ఉపయోగిస్తుంది.
- source_word: τὰ μέλλοντα αὐτῷ συμβαίνειν
  choice: తనకు సంభవించబోయే విషయాలను
  rationale: సమీప భవిష్యత్తులో యేసుకు జరగబోయే ఘటనలను సూచిస్తుంది; విధి లేదా అనివార్యత అనే మరింత బలమైన భావాన్ని అదనంగా చేర్చదు.
theological_decisions:
- issue: కథనంలోని రెండు వర్గాల భావోద్వేగ ప్రతిస్పందనల మధ్య తేడా
  choice: ἐθαμβοῦντοను ‘ఆశ్చర్యచకితులయ్యారు’గా, ἐφοβοῦντοను ‘భయపడ్డారు’గా వేర్వేరుగా అనువదించడం
  alternative: రెండింటినీ సాధారణ ఆశ్చర్యం లేదా భయానికి సంబంధించిన ఒకే విధమైన ప్రతిస్పందనగా అనువదించడం
  rationale: మూలపాఠ్యం రెండు వేర్వేరు క్రియలను ఉపయోగిస్తుంది. వాటి తేడాను నిలపడం కథనంలోని ఉద్విగ్నతను కాపాడుతుంది; వర్గాల ప్రతిస్పందనలను కలిపివేయదు.
- issue: παραλαβώνలో వ్యక్తమయ్యే చర్య
  choice: ‘తన దగ్గరకు తీసుకొని’ అని అనువదించడం
  alternative: ‘పక్కకు తీసుకొని’ అని అనువదించడం
  rationale: సందర్భం ప్రత్యేక బోధనను సూచించినా, గ్రీకు క్రియ స్వయంగా తప్పనిసరిగా ‘పక్కకు’ అని చెప్పదు. అందువల్ల ప్రధాన పాఠ్యం సందర్భాన్ని అతిగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘యెరూషలేముకు ఎక్కి వెళ్తూ’ అనే బైబిలు ప్రయాణ ప్రయోగాన్ని పాఠకులకు అర్థమయ్యే రూపంలో నిలిపింది. మొదటి ‘వారు’ ఎవరో మూలపాఠ్యం స్పష్టంగా చెప్పనందున అనువాదంలోనూ ఆ అనిశ్చితి నిలుపబడింది.
