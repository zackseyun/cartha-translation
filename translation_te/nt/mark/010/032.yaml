  verdict: revise
  source_fidelity: మూలంలోని అపూర్ణకాల భావాలను ముసాయిదా ఎక్కువగా పూర్తయిన చర్యలుగా చూపింది (‘ఆశ్చర్యచకితులయ్యారు,’ ‘భయపడ్డారు’). అలాగే οἱ ... ἀκολουθοῦντεςకు ‘వెనుక’ అనేది మూలంలో స్పష్టంగా లేని స్థానిక వివరాన్ని చేర్చుతుంది. సవరించిన పాఠం రెండు గుంపుల భిన్న ప్రతిస్పందనలను, కొనసాగుతున్న కథన దృశ్యాన్ని నిలుపుతుంది.
