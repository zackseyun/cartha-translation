revisions:
- from: వారు యెరూషలేముకు ఎక్కి వెళ్తూ దారిలో[a] ఉన్నారు. యేసు వారికంటే ముందుగా నడుస్తున్నాడు[b]. వారు ఆశ్చర్యచకితులయ్యారు; అయితే వెనుక అనుసరిస్తూ వస్తున్నవారు భయపడ్డారు. యేసు మళ్లీ పన్నెండుమందిని తన దగ్గరకు తీసుకొని, తనకు సంభవించబోయే విషయాలను వారికి చెప్పడం మొదలుపెట్టాడు.
  to: వారు యెరూషలేముకు ఎక్కి వెళ్తూ దారిలో[a] ఉన్నారు; యేసు వారికి ముందుగా వెళ్తున్నాడు[b]. వారు విస్మయపడుతూ ఉన్నారు, ఆయనను అనుసరిస్తున్నవారు భయపడుతూ ఉన్నారు. ఆయన మళ్లీ పన్నెండుమందిని తనతో తీసుకొని, తనకు సంభవించబోయే సంగతులను వారికి చెప్పడం మొదలుపెట్టాడు.
