  terminology: ‘యెరూషలేముకు ఎక్కి వెళ్తూ’ మూలంలోని ἀναβαίνοντεςను తగిన బైబిలు-సహజ ప్రయోగంతో ప్రతిఫలిస్తుంది. ‘పన్నెండుమందిని తనతో తీసుకొని’ παραλαβών యొక్క భావాన్ని కాపాడుతుంది; మూలక్రియలో తప్పనిసరి కాని ‘పక్కకు’ అనే స్థలభావాన్ని చేర్చదు. ‘సంభవించబోయే సంగతులు’ τὰ μέλλοντα αὐτῷ συμβαίνεινకు సహజమైన, అతిశయించని అనువాదం.
