id: MRK.10.15
reference: Mark 10:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/015.yaml
  text: Truly I say to you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: te
  text: '“నేను మీతో నిజంగా చెబుతున్నాను: ఎవరైతే దేవుని రాజ్యాన్ని ఒక బిడ్డలా[a] స్వీకరించరో, వారు దానిలో ఎంతమాత్రమూ ప్రవేశించరు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక బిడ్డగా.” ఈ మాట బిడ్డలోని వినయం, నమ్మకం లేదా ఆధారపడటాన్ని సూచించవచ్చు; అయితే గ్రీకు వచనం ఏ భావాన్ని ఉద్దేశించిందో ప్రత్యేకంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: నిజంగా
  rationale: గంభీరమైన, అధికారపూర్వకమైన ప్రకటనను పరిచయం చేసే పదం. ఆధునిక తెలుగులో దాని భావబలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో చెబుతున్నాను
  rationale: వర్తమానకాల క్రియను, బహువచన సంబోధనను స్పష్టంగా మరియు సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ὃς ἂν
  choice: ఎవడైనా … వాడు
  rationale: గ్రీకులోని అనిర్దిష్టమైన, సాధారణీకరించే భావాన్ని తెలుగు సంబంధ వాక్య నిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μὴ δέξηται
  choice: స్వీకరించనివాడు
  rationale: δέχομαι లోని స్వీకరించడం/అంగీకరించడం అనే భావాన్ని నిలుపుతూ, రాజ్యాన్ని సాధించడంకన్నా దాన్ని స్వీకరించడాన్ని ముందుకు తెస్తుంది.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: సమదర్శక సువార్తల్లో ప్రామాణికంగా వినిపించే పదబంధం; దేవుని పరిపాలన మరియు దాని పరిధి అనే రెండు భావసాధ్యతలను కాపాడుతుంది.
- source_word: ὡς παιδίον
  choice: ఒక చిన్నబిడ్డలా
  rationale: ὡς లోని ఉపమాన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది. παιδίον చిన్న వయసు బిడ్డను సూచించగలందున ‘చిన్నబిడ్డ’ అనేది సందర్భానికి తగినది; అయితే పోలికలోని నిర్దిష్ట లక్షణాన్ని వచనం నిర్ణయించదు.
- source_word: οὐ μὴ εἰσέλθῃ
  choice: ఎంతమాత్రమూ ప్రవేశించడు
  rationale: οὐ μή తో వ్యక్తమైన బలమైన నిరాకరణను ఆధునిక, గౌరవప్రదమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἰς αὐτήν
  choice: దానిలో
  rationale: స్త్రీలింగ సర్వనామం ముందున్న ‘రాజ్యం’ను సూచిస్తుంది; ‘దానిలో ప్రవేశించడు’ తెలుగు వాడుకలో సహజమైనది.
theological_decisions:
- issue: దేవుని రాజ్యాన్ని ‘ఒక చిన్నబిడ్డలా’ స్వీకరించడం అంటే ఏమిటి?
  choice: బిడ్డతో చేసిన ఉపమానాన్ని అలాగే ఉంచి, ఏ లక్షణం ఉద్దేశించబడిందో ప్రధాన వచనంలో నిర్దేశించలేదు.
  alternative: వినయం, నమ్మకం లేదా ఆధారపడే స్వభావంతో స్వీకరించడం అని స్పష్టీకరించడం.
  rationale: గ్రీకు వచనం పోలికను మాత్రమే ఇస్తుంది; ఉద్దేశించిన నిర్దిష్ట బాలస్వభావ లక్షణాన్ని పేర్కొనదు. ఒక వ్యాఖ్యాన సంప్రదాయాన్ని అనువాదంలో చేర్చకుండా మూలంలోని అర్థ విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి. ‘ఎంతమాత్రమూ’ బలమైన గ్రీకు నిరాకరణను తెలియజేస్తుంది. పాదసూచిక గుర్తు [a] ప్రధాన వచనంలో సంబంధిత ఉపమానం వెంట ఉంచబడింది.
