source:
  edition: SBLGNT
  text: Ἤρξατο ⸂λέγειν ὁ Πέτρος⸃ αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ⸀ἠκολουθήκαμέν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/028.yaml
  text: Peter began to say to him[a], “Look, we have left everything and followed you.”
translation:
  language: te
  text: పేతురు ఆయనతో, “ఇదిగో[a], మేము అన్నిటినీ విడిచిపెట్టి నిన్ను అనుసరించాం” అని చెప్పడం మొదలుపెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చూడు” లేదా “గమనించు.”
    reason: Ἰδοὺ అనే పదం దృష్టిని ఆకర్షించే సంభాషణ సూచకం; సందర్భాన్ని బట్టి ఈ ప్రత్యామ్నాయాలు కూడా సాధ్యమే.
lexical_decisions:
- source_word: Ἤρξατο λέγειν
  choice: చెప్పడం మొదలుపెట్టాడు
  rationale: ‘చెప్పడం ప్రారంభించాడు’ కంటే ఆధునిక తెలుగు కథనంలో సహజంగా ఉండే విధంగా, ఆరంభాన్ని సూచించే గ్రీకు నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ὁ Πέτρος
  choice: పేతురు
  rationale: తెలుగు బైబిలు సంప్రదాయంలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: αὐτῷ
  choice: ఆయనతో
  rationale: సందర్భంలో ఈ సర్వనామం యేసును సూచిస్తుంది. మూలంలో పేరును మళ్లీ చెప్పనందున ‘యేసుతో’ అని విప్పకుండా సర్వనామాన్నే ఉంచాం.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: వినేవారి దృష్టిని తాను చెప్పబోయే విషయంపై నిలిపే సంభాషణ సూచకంగా ఆధునిక తెలుగులో సహజంగా పనిచేస్తుంది.
- source_word: ἡμεῖς
  choice: మేము
  rationale: మూలంలోని స్పష్టమైన కర్త సర్వనామం పేతురు తనను, ఇతర శిష్యులను ప్రత్యేకంగా ముందుకు తెస్తున్న భావాన్ని నిలుపుతుంది.
- source_word: ἀφήκαμεν πάντα
  choice: అన్నిటినీ విడిచిపెట్టి
  rationale: వారు వదిలివచ్చిన సమస్తాన్ని సమగ్రంగా సూచిస్తుంది; ‘త్యజించి’ కంటే ‘విడిచిపెట్టి’ సహజంగా ఉండి భావాన్ని అతిశయింపజేయదు.
- source_word: ἠκολουθήκαμέν σοι
  choice: నిన్ను వెంబడించాం
  rationale: యేసును అనుసరించడానికి చేసిన కార్యాన్ని నేరుగా తెలియజేస్తుంది. గ్రీకు పరిపూర్ణ కాలంలోని కొనసాగుతున్న ప్రాముఖ్యత సందర్భం ద్వారా గ్రహించబడుతుంది; తెలుగులో ఈ రూపం సహజంగా ఉంది.
theological_decisions:
- issue: శిష్యత్వం కోసం తాము చేసిన త్యాగం గురించి పేతురు చెప్పిన మాట
  choice: పేతురు చేసిన వాదనను ఉన్నదున్నట్లుగా నేరుగా అనువదించడం
  alternative: ‘మేము సమస్తాన్ని త్యాగం చేశాం’ అని బలపరచడం లేదా తరువాత యేసు ఇచ్చే సమాధానాన్ని ముందుగానే సూచించేలా వ్యాఖ్యానించడం
  rationale: ఇది పేతురు చెప్పిన మాట; కథకుడు దానిని సమర్థిస్తున్నాడా, సరిదిద్దుతున్నాడా అని ఈ వాక్యం స్వయంగా చెప్పదు. కాబట్టి ఆ వేదాంత ఉద్వేగాన్ని అనువాదం పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. యేసును సూచించే కథన సర్వనామానికి ‘ఆయన’ను, ప్రత్యక్ష సంబోధనలో మూలంలోని ఏకవచనాన్ని ప్రతిబింబించేలా ‘నిన్ను’ను వాడాం. పాదసూచిక గుర్తు సంబంధిత పదమైన ‘ఇదిగో’ వెంట ఉంచాం.
