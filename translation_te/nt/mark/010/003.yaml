source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Τί ὑμῖν ἐνετείλατο Μωϋσῆς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/003.yaml
  text: But he answered them, “What did Moses command you?”
translation:
  language: te
  text: అందుకు ఆయన వారికి జవాబుగా, “మోషే మీకు ఏమి ఆజ్ఞాపించాడు?” అని అడిగాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: అందుకు
  rationale: δέ స్వల్ప అనుసంధానాన్ని, ముందటి ప్రశ్నకు ప్రతిస్పందనగా సంభాషణ మలుపును సూచిస్తుంది; ఆధునిక తెలుగులో ‘అందుకు’ సహజంగా ఈ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: ἀποκριθεὶς εἶπεν
  choice: అడిగాడు
  rationale: ఈ సందర్భంలో ప్రతిస్పందనగా పలికిన మాట ప్రత్యక్ష ప్రశ్న. తెలుగు వాక్య నిర్మాణంలో ‘అందుకు ... అని అడిగాడు’ అనేది ప్రతిస్పందన భావాన్నీ ప్రశ్న స్వభావాన్నీ సహజంగా అందిస్తుంది; గ్రీకు ప్రయోగాన్ని పదేపదే అనుసరించి ‘జవాబిస్తూ చెప్పాడు’ అనడం అనవసరంగా భారంగా ఉంటుంది.
- source_word: αὐτοῖς
  choice: వారితో
  rationale: మాట ఎవరిని ఉద్దేశించి పలికిందో తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: Τί
  choice: ఏమని
  rationale: ఆజ్ఞలోని విషయాన్ని అడిగే ప్రత్యక్ష ప్రశ్నను ‘ఏమని’ స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: ఆజ్ఞను అందుకున్నవారిని సూచించే దత్తి విభక్తిని నేరుగా నిలుపుతుంది.
- source_word: ἐνετείλατο
  choice: ఆజ్ఞాపించాడు
  rationale: చట్టపరమైన, అధికారపూర్వక ఆదేశ భావాన్ని ‘ఆజ్ఞాపించాడు’ సముచితంగా నిలుపుతుంది.
- source_word: Μωϋσῆς
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన సహజ నామరూపం.
theological_decisions:
- issue: యేసు జవాబులో మోషే అధికారానికి సూచన
  choice: మానవ మధ్యవర్తిగా పేరుపొందిన ‘మోషే’ను యథాతథంగా ఉంచడం
  alternative: ‘మోషే ధర్మశాస్త్రం’ లేదా ‘మోషే ద్వారా దేవుడు’ అని వివరణాత్మకంగా విస్తరించడం
  rationale: గ్రీకు మూలం మోషే పేరునే పేర్కొంటుంది; ధర్మశాస్త్రం లేదా దేవుని ద్వారా అని ఈ వచనంలో చేర్చదు. మూలంలోని సంక్షిప్త ప్రశ్నను అలాగే ఉంచడం అదనపు దైవశాస్త్ర వివరణను దిగుమతి చేయకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండే సంభాషణ శైలి, అయితే ‘ఆజ్ఞాపించాడు’ ద్వారా మూలంలోని అధికారపూర్వక భావం నిలుపబడింది.
