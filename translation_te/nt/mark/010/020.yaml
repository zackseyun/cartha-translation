- from: అతడు ఆయనతో, “బోధకుడా, వీటన్నిటినీ నా యౌవనం నుంచే పాటిస్తూ వచ్చాను” అన్నాడు.
  to: అతడు ఆయనతో, “బోధకుడా, నా యౌవనం నుండి వీటన్నిటినీ పాటించాను” అన్నాడు.
  rationale: The revision retains the draft’s faithful vocabulary and register while replacing the explicitly continuative construction with a simple summary form that better reflects the Greek aorist, and removes unrequired temporal emphasis.
