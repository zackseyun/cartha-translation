source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἔφη αὐτῷ· Διδάσκαλε, ταῦτα πάντα ἐφυλαξάμην ἐκ νεότητός μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/020.yaml
  text: And he said to him, “Teacher, I have kept all these things from my youth.”
translation:
  language: te
  text: అతడు ఆయనతో, “బోధకుడా, నా యౌవనం నుండి వీటన్నిటినీ పాటించాను” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: అన్నాడు
  rationale: సంభాషణను సహజంగా పరిచయం చేసే సాధారణ కథన క్రియ; సందర్భంలో ‘జవాబిచ్చాడు’ అనే భావాన్ని అదనంగా చేర్చదు.
- source_word: Διδάσκαλε
  choice: బోధకుడా
  rationale: διδάσκαλος యొక్క సంబోధన రూపం; బోధించే వ్యక్తి అనే మూలార్థాన్ని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ταῦτα πάντα
  choice: వీటన్నిటినీ
  rationale: ముందు పేర్కొన్న ఆజ్ఞలన్నిటినీ సూచించే సహజమైన తెలుగు సమాసరూపం.
- source_word: ἐφυλαξάμην
  choice: పాటిస్తూ వచ్చాను
  rationale: ఆజ్ఞల సందర్భంలో φυλάσσω అంటే వాటిని ఆచరించడం లేదా పాటించడం. యౌవనం నుండి ప్రస్తుత సంభాషణ సమయం వరకు కొనసాగిన జీవిత ప్రవర్తనను తెలుగు సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκ νεότητός μου
  choice: నా యౌవనం నుంచే
  rationale: ἐκ కాలారంభ బిందువును సూచిస్తుంది; νεότηςను ‘బాల్యం’గా అతిగా నిర్దిష్టం చేయకుండా ‘యౌవనం’గా నిలుపుతుంది.
- source_word: ὁ δὲ
  choice: అతడు
  rationale: δέ ఇక్కడ స్వల్ప కథన అనుసంధానం మాత్రమే; తెలుగులో ప్రత్యేకంగా ‘కాని’ లేదా ‘అప్పుడు’ చేర్చకుండా సహజ ప్రవాహాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా గౌరవప్రదమైన బైబిలు కథన శైలిలో రూపొందించబడింది. గ్రీకు వాక్యంలో ఉన్న వాదనను ధృవీకరించడమో ఖండించడమో చేయకుండా యథాతథంగా ఉంచింది.
