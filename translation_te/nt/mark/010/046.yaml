id: MRK.10.46
reference: Mark 10:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἰεριχώ. καὶ ἐκπορευομένου αὐτοῦ ἀπὸ Ἰεριχὼ καὶ τῶν μαθητῶν αὐτοῦ καὶ ὄχλου ἱκανοῦ ⸀ὁ υἱὸς Τιμαίου Βαρτιμαῖος ⸀τυφλὸς ⸂προσαίτης ἐκάθητο παρὰ τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/046.yaml
  text: And they came to Jericho[a]. And as he was going out from Jericho, along with his disciples and a considerable crowd, Bartimaeus, the son of Timaeus, a blind beggar[c][b], was sitting beside the road.
translation:
  language: te
  text: వారు యెరికోకు వచ్చారు.[a] ఆయన తన శిష్యులతోనూ గణనీయమైన జనసమూహంతోనూ[b] యెరికో నుండి బయలుదేరుతుండగా, తిమయి కుమారుడైన బర్తిమయి అనే అంధుడైన యాచకుడు దారిపక్కన[c] కూర్చుని ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ఇక్కడ ‘వస్తారు’ అనే కథనాత్మక వర్తమాన కాలం ఉంది; సహజమైన తెలుగు కథనశైలి కోసం దాన్ని గతకాలంలో అనువదించాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పెద్ద జనసమూహంతోనూ.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘దారి ప్రక్కనే.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: వచ్చారు
  rationale: గ్రీకులో కథనాత్మక వర్తమాన కాలం ఉన్నప్పటికీ, ఆధునిక తెలుగు కథనశైలిలో గతకాల రూపం సహజంగా ఉండి సంఘటనల క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐκπορευομένου αὐτοῦ
  choice: ఆయన ... బయలుదేరుతుండగా
  rationale: ఈ రూపం ప్రధాన సంఘటనతో ఏకకాలంలో జరుగుతున్న కదలికను సూచిస్తుంది; తెలుగు అసమాపక క్రియారూపం ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ὄχλου ἱκανοῦ
  choice: పెద్ద జనసమూహం
  rationale: ἱκανός ఇక్కడ జనసమూహం గణనీయమైన పరిమాణంలో ఉందని సూచిస్తుంది. ‘పెద్ద జనసమూహం’ సాధారణ పాఠకులకు సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ὁ υἱὸς Τιμαίου Βαρτιμαῖος
  choice: తిమయి కుమారుడైన బర్తిమయి
  rationale: మూలంలోని వ్యక్తిపేరునూ, దానికి ఇచ్చిన వివరణాత్మక గుర్తింపునూ రెండింటినీ నిలుపుతుంది.
- source_word: τυφλὸς
  choice: గుడ్డి
  rationale: వ్యక్తి చూపులేనివాడని తెలిపే నేరమైన, సాధారణ తెలుగు విశేషణం.
- source_word: προσαίτης
  choice: బిచ్చగాడు
  rationale: జీవనోపాధి కోసం యాచించే వ్యక్తిని సూచించే స్పష్టమైన, సాధారణ తెలుగు పదం.
- source_word: παρὰ τὴν ὁδόν
  choice: దారి పక్కన
  rationale: దారికి ఆనుకొని ఉన్న స్థానాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: Ἰεριχώ
  choice: యెరికో
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన స్థలనామ లిప్యంతరీకరణ.
theological_decisions:
- issue: బర్తిమయి గుర్తింపులో పేరు మరియు వివరణ
  choice: ‘బర్తిమయి’ అనే పేరుతో పాటు ‘తిమయి కుమారుడు’ అనే వివరణనూ ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: పేరును మాత్రమే ఉంచడం లేదా ‘తిమయి కుమారుడు’ అని మాత్రమే అనువదించడం
  rationale: మూలవాక్యం పేరు, వివరణ రెండింటినీ ఇస్తుంది. రెండింటినీ ఉంచడం మార్కు తెలిపిన కథన వివరాన్ని తగ్గించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. గ్రీకు వాక్యంలోని ఏకకాల చర్యను ‘బయలుదేరుతుండగా’ ద్వారా, బర్తిమయి పేరు మరియు దాని వివరణ రెండింటినీ ప్రధాన పాఠ్యంలో నిలిపాం.
