source:
  edition: SBLGNT
  text: καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν· ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ μία σάρξ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/008.yaml
  text: and the two will become one flesh. So they are no longer two[a], but one flesh.
translation:
  language: te
  text: ‘ఆ ఇద్దరూ ఒకే శరీరమవుతారు.’ కాబట్టి వారు ఇక ఇద్దరు కాదు, ఒకే శరీరం.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσονται
  choice: అవుతారు
  rationale: εἰμί రూపమైనప్పటికీ, εἰς తో కూడిన ఈ నిర్మాణం ఫలితంగా ఏర్పడే ఐక్యతను సూచిస్తుంది; అందువల్ల సహజమైన తెలుగులో ‘అవుతారు’ సరైనది.
- source_word: οἱ δύο
  choice: ఆ ఇద్దరూ
  rationale: వ్యాసంతో కూడిన సంఖ్యను స్పష్టంగా నిలుపుతూ, ముందుగా ప్రస్తావించిన ఇద్దరినీ సూచించే సహజ తెలుగు రూపం.
- source_word: εἰς σάρκα μίαν
  choice: ఒకే శరీరం
  rationale: వివాహ ఐక్యతను తెలిపే స్థిరమైన బైబిలు వ్యక్తీకరణను నిలుపుతుంది; ‘అవుతారు’లో గమ్యస్థితి భావం ఇప్పటికే వ్యక్తమవుతుంది.
- source_word: σάρκα / σάρξ
  choice: శరీరం
  rationale: ఇక్కడ σάρξ పాపస్వభావం అనే రూపకార్థంలో కాక, ఆదికాండంతో అనుసంధానమైన వివాహ ఐక్యత భావంలో ఉంది. ఆధునిక తెలుగులో ‘శరీరం’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: ὥστε
  choice: కాబట్టి
  rationale: ముందటి ప్రకటననుంచి వచ్చే ఫలితం లేదా నిర్ధారణను స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὐκέτι
  choice: ఇక ... కాదు
  rationale: మునుపటి స్థితి కొనసాగదనే భావాన్ని సంక్షిప్తమైన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀλλὰ μία σάρξ
  choice: ఒకే శరీరం
  rationale: ‘ఇద్దరు’ అనే స్థితికి వ్యతిరేకంగా ఐక్యతను బలంగా చూపుతుంది; మూలంలోని బైబిలు భావవ్యాప్తిని కాపాడుతుంది.
theological_decisions:
- issue: యేసు ఉటంకించిన ‘ఒకే శరీరం’ అనే మాట అర్థం
  choice: వివరణాత్మక విస్తరణ లేకుండా ‘ఒకే శరీరం’ అనే వివాహ ఐక్యత వ్యక్తీకరణను నిలుపడం
  alternative: ఒకే దేహం; ఒకే వ్యక్తి; లైంగికంగా ఏకమవడం
  rationale: ఈ పదబంధానికి విస్తృతమైన బైబిలు, మానవశాస్త్రీయ ప్రాముఖ్యత ఉంది; అయితే ఈ వచనం దానిని ఒక్క అర్థానికే పరిమితం చేయదు. మూల వ్యక్తీకరణను నిలపడం వచనంలోని ఉద్దేశపూర్వక భావవ్యాప్తిని సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఆదికాండపు ఉటంకింపును సూచించేందుకు మొదటి వాక్యానికి ఉటంకణ చిహ్నాలు వాడబడ్డాయి. ‘ఒకే’ అనే రూపం ఏకత్వంపై మూలపాఠంలోని ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
