  yaml_path: translation/nt/mark/010/016.yaml
  text: And he took them in his arms and blessed them[b][a], laying his hands on them.
translation:
  language: te
  text: ఆయన వారిని తన చేతుల్లోకి ఎత్తుకొని[a], వారిపై చేతులు ఉంచుతూ వారిని దీవిస్తూ ఉన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారిని కౌగిలించుకొని.’ గ్రీకు క్రియ ప్రత్యేకంగా ఎవరినైనా తన చేతుల్లోకి తీసుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు క్రియ బలపరచబడిన రూపంలో, అసంపూర్ణ భూతకాలంలో ఉంది. అందువల్ల ఆయన వారిని పదేపదే లేదా ప్రత్యేక శ్రద్ధతో దీవించాడనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναγκαλισάμενος
  choice: వారిని తన చేతుల్లోకి తీసుకొని
  rationale: ఈ క్రియ ఎవరినైనా చేతుల్లోకి తీసుకోవడాన్ని ప్రత్యేకంగా సూచిస్తుంది. తెలుగు వాక్యం ఆప్యాయమైన శారీరక చర్యను సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: κατευλόγει
  choice: వారిని ఎంతో దీవిస్తూ ఉన్నాడు
  rationale: ఉపసర్గతో బలపడిన క్రియారూపం మరియు అసంపూర్ణ భూతకాలం ఆ దీవెనలో తీవ్రతతో పాటు కొనసాగుతున్న లేదా పునరావృతమవుతున్న చర్యను సూచించగలవు. ప్రధాన పాఠంలో ‘ఎంతో దీవిస్తూ ఉన్నాడు’ అని ఇవ్వడం ఈ రెండింటినీ సహజంగా ప్రతిబింబిస్తుంది; పునరావృత భావంలోని అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: τιθεὶς τὰς χεῖρας ἐπ’ αὐτά
  choice: వారిపై చేతులు ఉంచుతూ
  rationale: ఈ వర్తమాన కృదంత పదబంధం దీవిస్తున్నప్పుడు దానికి తోడుగా జరిగిన చర్యను తెలియజేస్తుంది. ‘చేతులు ఉంచుతూ’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని సంజ్ఞను కాపాడుతుంది.
- source_word: αὐτὰ ... αὐτά
  choice: వారిని ... వారిపై
  rationale: ఈ నపుంసక బహువచన సర్వనామాలు ముందున్న పిల్లలను సూచిస్తున్నాయి. తెలుగులో వ్యక్తులను సూచించేటప్పుడు గౌరవప్రదమైన మానవ బహువచన రూపాలు సహజంగా ఉంటాయి.
- source_word: καὶ
  choice: ఆయన
  rationale: తెలుగులో విడి వచనంగా ‘మరియు’తో ప్రారంభించడం కృత్రిమంగా వినిపించవచ్చు. కథన అనుసంధానం సందర్భంలోనే స్పష్టంగా ఉండగా, కర్తను ముందుంచడం సహజమైన తెలుగు వాక్యాన్ని ఇస్తుంది.
theological_decisions:
- issue: పిల్లల పట్ల యేసు చేసిన చర్య స్వభావం
  choice: చేతుల్లోకి తీసుకోవడం, చేతులు ఉంచడం, దీవించడం అనే స్పష్టమైన చర్యలను మాత్రమే నిలుపుకోవడం
  alternative: దీనిని ఒక నిర్దిష్ట సంస్కారంగా లేదా తరువాతి ఆచారపద్ధతిగా పేర్కొనడం
  rationale: మూలపాఠం ఆప్యాయమైన స్వీకరణను, చేతులు ఉంచడాన్ని, దీవెనను వర్ణిస్తుంది; కానీ వాటికి తరువాతి సిద్ధాంతపరమైన లేదా ఆచారపరమైన ప్రత్యేక అర్థాన్ని నిర్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘తన చేతుల్లోకి తీసుకొని’ ఆప్యాయతను స్పష్టంగా చూపుతుంది; ‘వారిపై చేతులు ఉంచుతూ’ ఎటువంటి అదనపు ఆచారపరమైన పదజాలం లేకుండా మూలంలోని చర్యను నిలుపుతుంది.
