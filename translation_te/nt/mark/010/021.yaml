id: MRK.10.21
reference: Mark 10:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐμβλέψας αὐτῷ ἠγάπησεν αὐτὸν καὶ εἶπεν αὐτῷ· Ἕν ⸀σε ὑστερεῖ· ὕπαγε ὅσα ἔχεις πώλησον καὶ δὸς ⸀τοῖς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν οὐρανῷ, καὶ δεῦρο ἀκολούθει ⸀μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/021.yaml
  text: 'And Jesus[a], looking at him, loved him and said to him, “One thing you lack: go, sell whatever you have and give to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: te
  text: 'యేసు అతన్ని నిశితంగా చూసి, అతన్ని ప్రేమించి, అతనితో ఇలా అన్నాడు: “నీకు ఒకటి కొదువగా ఉంది. వెళ్లి, నీకు ఉన్నవన్నీ[a] అమ్మి పేదవారికి ఇవ్వు; పరలోకంలో నీకు నిధి ఉంటుంది. రా, నన్ను అనుసరించు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీకు ఉన్నదంతా.” గ్రీకు పదబంధాన్ని “నీకు ఉన్నవన్నీ” లేదా “నీకు ఉన్నదంతా” అని అనువదించవచ్చు; సందర్భం అతని ఆస్తి మొత్తం పరిధిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψας
  choice: నిశితంగా చూసి
  rationale: ఈ క్రియ అతనివైపు ఉద్దేశపూర్వకంగా, శ్రద్ధగా చూడడాన్ని సూచిస్తుంది. ‘నిశితంగా చూసి’ ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; దానిని కేవలం సాధారణ చూపుగా బలహీనపరచదు.
- source_word: ἠγάπησεν
  choice: ప్రేమించి
  rationale: గ్రీకు క్రియ నేరుగా ప్రేమించడాన్ని తెలియజేస్తుంది. ‘ప్రేమించి’ అనే మాట ఆ భావాన్ని తగ్గించకుండా, ప్రత్యేక సిద్ధాంతార్థాన్ని కూడా జోడించకుండా ఉంచుతుంది.
- source_word: Ἕν σε ὑστερεῖ
  choice: నీకు ఒకటి కొదువగా ఉంది
  rationale: ‘ఒకటి’ అనే నపుంసక ఏకవచనాన్ని వస్తువాచకంగా ఉంచి, ప్రస్తుతం ఉన్న లోటును నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ὅσα ἔχεις
  choice: నీకు ఉన్నవన్నీ
  rationale: ఈ సంబంధవాచక పదబంధం ‘నీకు ఉన్నవి ఏవైతే ఉన్నాయో’ లేదా ‘నీకు ఉన్నదంతా’ అనే విస్తృతిని కలిగి ఉంది. సందర్భంలో అతని ఆస్తి మొత్తాన్ని సూచించే సమగ్ర బలాన్ని ఈ ఎంపిక స్పష్టంగా నిలుపుతుంది.
- source_word: πώλησον
  choice: అమ్మి
  rationale: అమ్మమనే సూటి ఆజ్ఞను తెలుగులో సహజంగా తదుపరి ఆజ్ఞతో కలుపుతుంది.
- source_word: δὸς τοῖς πτωχοῖς
  choice: పేదవారికి ఇవ్వు
  rationale: πτωχοῖς పేద వ్యక్తులను సామాజిక వర్గంగా సూచిస్తుంది. ‘పేదవారికి’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంది.
- source_word: θησαυρὸν ἐν οὐρανῷ
  choice: పరలోకంలో నీకు నిధి
  rationale: ‘నిధి’ విలువైన, నిల్వచేయబడిన సంపద అనే రూపకాన్ని నిలుపుతుంది; ‘పరలోకంలో’ గ్రీకు ఏకవచన భావానికి సహజమైన తెలుగు సమానం.
- source_word: δεῦρο ἀκολούθει μοι
  choice: తరువాత వచ్చి నన్ను అనుసరించు
  rationale: δεῦροలోని రావాలనే పిలుపును, ἀκολούθει μοιలోని శిష్యత్వ పిలుపును వేర్వేరుగా నిలుపుతుంది. ‘అనుసరించు’ వర్తమాన ఆజ్ఞలో అంతర్లీనమైన నిరంతర శిష్యత్వ భావాన్ని సందర్భంలో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: యేసు ఆ మనిషిని ప్రేమించడం యొక్క భావం
  choice: ‘అతన్ని ప్రేమించి’ అని నిజమైన ప్రేమ వ్యక్తీకరణగా సూటిగా అనువదించబడింది.
  alternative: దాన్ని కేవలం దయతో ప్రవర్తించడంగా బలహీనపరచడం, లేదా సాంకేతిక అర్థంలో ఎన్నికకు సంబంధించిన ప్రేమగా నిర్వచించడం.
  rationale: వచనం ἠγάπησεν αὐτόν అని స్పష్టంగా చెబుతుంది. అందువల్ల ప్రేమను తగ్గించకూడదు; అదే సమయంలో వచనం చెప్పని తరువాతి సిద్ధాంత వ్యవస్థను దానిలో చేర్చకూడదు. ఇలా చేయడం కథలోని భావోద్వేగ, వేదాంత ఉద్రిక్తతను నిలుపుతుంది.
- issue: ఆస్తుల గురించి ఆజ్ఞ యొక్క పరిధి
  choice: అతనికి ఉన్నవన్నీ అమ్మాలనే సమగ్ర బలం నిలుపబడింది.
  alternative: దాన్ని సాధారణ ఉదారతకు పిలుపుగా మృదువుపరచడం, లేదా మూలంలోని పదబంధ వైవిధ్యాన్ని చూపకుండా వివరణాత్మకంగా విస్తరించడం.
  rationale: ὅσα ἔχεις సందర్భంలో అతని ఆస్తులన్నిటినీ సహజంగా సూచిస్తుంది. అనువాదం ఆజ్ఞ బలాన్ని నిలుపుతూ, పదబంధానికి సాధ్యమైన మరో రూపాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. యేసు ఆజ్ఞల సూటితనం, ప్రేమ మరియు కఠినమైన పిలుపు మధ్య ఉన్న ఉద్రిక్తత, అలాగే ‘వచ్చి నన్ను అనుసరించు’ అనే శిష్యత్వ పిలుపు యథాతథంగా నిలుపబడ్డాయి.
