source:
  edition: SBLGNT
  text: τὸ δὲ καθίσαι ἐκ δεξιῶν μου ⸀ἢ ἐξ εὐωνύμων οὐκ ἔστιν ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/040.yaml
  text: But to sit at my right or at my left is not mine to give[a], but for those for whom it has been prepared.
translation:
  language: te
  text: అయితే, నా కుడివైపున గానీ ఎడమవైపున గానీ కూర్చునే స్థానం ఇవ్వడం నా వంతు కాదు[a]; అది ఎవరి కోసం సిద్ధపరచబడిందో వారికే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇవ్వడం నాకు సంబంధించినది కాదు.”
    reason: οὐκ ἔστιν ἐμὸν δοῦναι అనే నిర్మాణాన్ని ‘నా వంతు కాదు’ లేదా ‘నాకు సంబంధించినది కాదు’ అని అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: τὸ ... καθίσαι
  choice: కూర్చునే స్థానం
  rationale: గ్రీకులోని నామవాచకార్థక క్రియారూపాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి సందర్భానుసారంగా ‘స్థానం’ చేర్చబడింది; కూర్చోవడం అనే క్రియాభావం నిలిచింది.
- source_word: ἐκ δεξιῶν μου
  choice: నా కుడివైపున
  rationale: ఈ ప్రయోగం వ్యక్తి కుడిపక్కనున్న స్థానాన్ని సూచిస్తుంది; మూలంలో లేని ‘చేయి’ అనే పదాన్ని చేర్చకుండా సహజమైన తెలుగు వాడబడింది.
- source_word: ἢ ἐξ εὐωνύμων
  choice: గానీ ఎడమవైపున గానీ
  rationale: కుడి, ఎడమ స్థానాల సమాంతర నిర్మాణాన్ని తెలుగులో సహజమైన ‘గానీ ... గానీ’ రూపంతో నిలిపింది.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: ఇవ్వడం నా వంతు కాదు
  rationale: ఇక్కడ ఆ స్థానాలను ఇవ్వడం తనకు చెందిన కార్యం లేదా హక్కు కాదనే భావాన్ని, సామర్థ్యం లేదని అతిగా నిర్ధారించకుండా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀλλ’ οἷς
  choice: అది ... వారికే
  rationale: గ్రీకులో ముందటి వాక్యం నుంచి భావం పూరించాల్సిన సంక్షిప్త నిర్మాణం ఉంది. తెలుగులో ‘అది’ అని సూచించి, ‘వారికే’తో వ్యత్యాసాన్ని స్పష్టంగా ఉంచింది.
- source_word: ἡτοίμασται
  choice: సిద్ధపరచబడిందో
  rationale: పూర్తయిన సిద్ధీకరణ ఫలితం కొనసాగుతోందనే పరిపూర్ణ కర్మణి భావాన్ని ఈ రూపం నిలుపుతుంది.
theological_decisions:
- issue: యేసు మాట ఆయన అధికారాన్ని సంపూర్ణంగా నిరాకరిస్తుందా, లేక ఈ సందర్భంలోని కేటాయింపును మాత్రమే సూచిస్తుందా?
  choice: ‘ఇవ్వడం నా వంతు కాదు’ అని మూలంలోని పరిమితిని వివరణాత్మక పదాలు చేర్చకుండా అనువదించడం.
  alternative: ‘తండ్రి చిత్తానికి వేరుగా ఇవ్వడం నా వంతు కాదు’ అని వివరణ చేర్చడం.
  rationale: గ్రీకు వాక్యం పరిమితిని చెబుతుంది గాని దానికి కారణాన్ని ఇక్కడ వివరించదు. ‘తండ్రి చిత్తానికి వేరుగా’ వంటి మాటలు చేర్చడం వచనంలోని తాత్త్విక ఉద్రిక్తతను ముందుగానే పరిష్కరిస్తుంది; అందువల్ల అవి చేర్చబడలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘కుడివైపున ... ఎడమవైపున’ అనే సమతుల్యతను నిలిపి, మూలంలో లేని తాత్త్విక వివరణను చేర్చలేదు.
