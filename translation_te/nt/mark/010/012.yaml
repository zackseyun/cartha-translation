  text: and if she divorces her husband and marries another man[a], she commits adultery.
translation:
  language: te
  text: అలాగే, ఆమె తన భర్తకు విడాకులు ఇచ్చి[a] మరొక పురుషుణ్ణి పెళ్లి చేసుకుంటే, ఆమె వ్యభిచారం చేస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, ‘తన భర్తను పంపివేసి.’ ఈ వివాహ సందర్భంలో దీని అర్థం ‘విడాకులు ఇచ్చి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: అలాగే
  rationale: ఈ మాటను 11వ వచనంలోని సమాంతర సందర్భంతో సహజంగా అనుసంధానిస్తుంది.
- source_word: ἐὰν
  choice: చేసుకుంటే
  rationale: గ్రీకు షరతును తెలుగులో సహజమైన ‘-తే’ రూపంతో వ్యక్తం చేస్తుంది.
- source_word: αὐτὴ
  choice: ఆమె
  rationale: గ్రీకులోని స్పష్టమైన స్త్రీలింగ కర్తను నిలుపుతుంది.
- source_word: ἀπολύσασα
  choice: విడాకులు ఇచ్చి
  rationale: పదశః ‘పంపివేసి’ అనే భావం ఉన్నప్పటికీ, వివాహ సందర్భంలో ఇది విడాకులను సూచిస్తుంది; ఆధునిక తెలుగులో ఈ ప్రయోగం స్పష్టంగా ఉంటుంది.
- source_word: τὸν ἄνδρα αὐτῆς
  choice: తన భర్తకు
  rationale: వివాహ సందర్భంలో ἀνήρ అంటే ‘భర్త’; తెలుగు వాక్యనిర్మాణంలో ‘విడాకులు ఇచ్చి’తో ‘భర్తకు’ సహజమైన విభక్తి రూపం.
- source_word: γαμήσῃ ἄλλον
  choice: మరొక పురుషుణ్ణి పెళ్లి చేసుకుంటే
  rationale: ἄλλον పుంలింగ రూపం కాబట్టి మరొక పురుషుడనే లింగనిర్దిష్ట భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: μοιχᾶται
  choice: వ్యభిచారం చేస్తుంది
  rationale: వర్తమాన క్రియ యొక్క నైతిక ప్రకటనను తెలుగులో నేరుగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: వాక్యంలోని లింగనిర్దిష్టతను నిలుపాలా
  choice: ‘ఆమె ... తన భర్తకు ... మరొక పురుషుణ్ణి’ అని స్పష్టంగా అనువదించడం
  alternative: ‘ఒక భార్య తన భర్తకు విడాకులు ఇచ్చి మరొకరిని పెళ్లి చేసుకుంటే’
  rationale: గ్రీకు పాఠంలో స్త్రీ కర్త, ఆమె భర్త, మరొక పురుషుడు అని లింగాలు స్పష్టంగా ఉన్నాయి; ఇవి ముందరి వచనంలోని సమాంతర వాక్యంతో ఉన్న ఉద్దేశపూర్వక సంబంధాన్ని నిలుపుతాయి.
- issue: ἀπολύωను పదశః అనువదించాలా, వివాహ సంబంధ న్యాయపదంగా అనువదించాలా
  choice: ‘విడాకులు ఇచ్చి’
  alternative: ‘తన భర్తను పంపివేసి’
  rationale: ఈ సందర్భం వివాహ బంధం రద్దు గురించి మాట్లాడుతోంది. ‘విడాకులు ఇచ్చి’ అనేది మూల భావాన్ని ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా అందిస్తుంది; పదశః రూపాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘వ్యభిచారం చేస్తుంది’ అనే రూపం సాధారణ పాఠకులకు స్పష్టంగా ఉండి, మూలంలోని నేరుగా చెప్పే నైతిక ప్రకటనను నిలుపుతుంది.
