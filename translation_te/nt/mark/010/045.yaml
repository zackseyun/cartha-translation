source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/045.yaml
  text: For even the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: te
  text: ఎందుకంటే మనుష్యకుమారుడు సైతం సేవ పొందడానికి రాలేదు; సేవ చేయడానికి, అనేకుల కోసం[a] విమోచన మూల్యంగా తన ప్రాణాన్ని ఇవ్వడానికి వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అనేకుల స్థానంలో.” ‘కోసం’ అని అనువదించిన గ్రీకు ఉపసర్గ స్థానభర్తీ లేదా మార్పిడి భావాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ఎందుకంటే … సైతం
  rationale: γάρ యొక్క వివరణాత్మక కారణార్థాన్ని ‘ఎందుకంటే’తో, καί యొక్క ఉద్ఘాటనను ‘సైతం’తో సహజమైన తెలుగులో నిలిపింది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: యేసు వాడిన స్థిరమైన స్వీయ సూచనను, దానియేలు గ్రంథంతో ఉన్న అంతర్గ్రంథ సంబంధాన్ని కాపాడే సంప్రదాయ తెలుగు బిరుదు.
- source_word: οὐκ ἦλθεν
  choice: రాలేదు
  rationale: తదనంతర ఉద్దేశార్థక క్రియారూపాలతో సహజంగా కలిసే సూటి అనువాదం.
- source_word: διακονηθῆναι
  choice: సేవ పొందడానికి
  rationale: కర్మణి భావాన్ని స్పష్టంగా తెలియజేస్తూ, తరువాతి ‘సేవ చేయడానికి’తో ఉన్న వాక్చాతుర్యపూర్వక వ్యతిరేకతను నిలుపుతుంది.
- source_word: ἀλλὰ διακονῆσαι
  choice: సేవ చేయడానికి
  rationale: అదే తెలుగు మూలపదాన్ని పునరావృతం చేసి, సేవ పొందడం–సేవ చేయడం మధ్యనున్న తిరుగుబాటు పోలికను స్పష్టంగా ఉంచుతుంది.
- source_word: δοῦναι
  choice: ఇవ్వడానికి
  rationale: క్రియ యొక్క ప్రాథమిక అర్థాన్ని కాపాడుతుంది; మూలంలో లేని మరింత సంకుచితమైన భావాన్ని చేర్చదు.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: తన ప్రాణాన్ని
  rationale: ఇక్కడ ψυχή అమూర్తమైన ‘ఆత్మ’ను మాత్రమే కాక, మరణం వరకు అర్పించబడే వ్యక్తి ప్రాణాన్ని సూచిస్తుంది.
- source_word: λύτρον
  choice: విమోచన మూల్యంగా
  rationale: విడుదల కోసం చెల్లించే మూల్యం అనే λύτρον భావాన్ని సాధారణ పాఠకులకు అర్థమయ్యే, గంభీరమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀντὶ πολλῶν
  choice: అనేకుల కోసం
  rationale: ప్రధాన వాక్యంలో సహజమైన తెలుగు ప్రవాహాన్ని ఇస్తుంది; ἀντίలోని మరింత స్పష్టమైన ప్రత్యామ్నాయ లేదా మార్పిడి భావాన్ని పాదటిప్పణి వెల్లడిస్తుంది.
theological_decisions:
- issue: విమోచన వాక్యంలో ἀντί యొక్క భావబలం
  choice: ప్రధాన పాఠ్యంలో ‘అనేకుల కోసం’ అని సహజంగా అనువదించి, ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో స్పష్టం చేయడం.
  alternative: ‘అనేకుల స్థానంలో’ లేదా ‘అనేకులకు బదులుగా’
  rationale: ἀντί సాధారణంగా స్థానభర్తీ లేదా మార్పిడి భావాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యం చదవడానికి సహజంగా ఉండగా, పాదటిప్పణి మూలపదంలోని బలమైన భావాన్ని ఏకపక్షంగా సిద్ధాంతీకరించకుండా సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యే సహజమైన వాక్యనిర్మాణంతో పాటు బైబిలు బిరుదు ‘మనుష్యకుమారుడు’ మరియు గంభీరమైన ‘విమోచన మూల్యం’ పదబంధం నిలుపబడ్డాయి. మూలంలోని ఉద్దేశార్థక సమాంతర నిర్మాణం తెలుగులో స్పష్టత కోసం చివర ‘వచ్చాడు’ను పూరించడం ద్వారా సహజంగా వ్యక్తమైంది.
