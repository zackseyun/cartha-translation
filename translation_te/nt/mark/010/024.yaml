source:
  edition: SBLGNT
  text: οἱ δὲ μαθηταὶ ἐθαμβοῦντο ἐπὶ τοῖς λόγοις αὐτοῦ. ὁ δὲ Ἰησοῦς πάλιν ἀποκριθεὶς λέγει αὐτοῖς· Τέκνα, πῶς δύσκολόν ⸀ἐστιν εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/024.yaml
  text: But the disciples were astonished at his words. Jesus answered again and said to them[a], “Children, how difficult it is to enter the kingdom of God!”
translation:
  language: te
  text: 'అయితే శిష్యులు ఆయన మాటలకు ఆశ్చర్యపడ్డారు. యేసు మళ్లీ వారికి ప్రత్యుత్తరమిచ్చి ఇలా అన్నాడు[a]: “పిల్లలారా, దేవుని రాజ్యంలో ప్రవేశించడం ఎంత కష్టం!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో, “పిల్లలారా, ధనాన్ని నమ్ముకునేవారికి దేవుని రాజ్యంలో ప్రవేశించడం ఎంత కష్టం!” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ἐθαμβοῦντο
  choice: ఆశ్చర్యపోతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న స్పందనను సూచిస్తుంది; ఈ తెలుగు ప్రయోగం ఆ కొనసాగుదలతో కూడిన బలమైన ఆశ్చర్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ τοῖς λόγοις αὐτοῦ
  choice: ఆయన మాటలకు
  rationale: ἐπί దత్తివుతో ఇక్కడ ఆశ్చర్యానికి కారణం లేదా ఆధారాన్ని సూచిస్తుంది; ‘ఆయన మాటలకు’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: యేసు తిరిగి లేదా మరొకసారి మాట్లాడడాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: ἀποκριθεὶς λέγει
  choice: వారితో ఇలా అన్నాడు
  rationale: గ్రీకులోని ‘సమాధానమిస్తూ చెప్పాడు’ అనే కథన సూత్రాన్ని పదేపదే అనువదిస్తే తెలుగులో కృత్రిమంగా ఉంటుంది. సందర్భంలో శిష్యుల స్పందనకు ప్రతిస్పందనగా పలికిన భావాన్ని ప్రవాహవంతమైన కథన రూపం ద్వారా అందిస్తుంది.
- source_word: Τέκνα
  choice: పిల్లలారా
  rationale: ఆప్యాయతతో కూడిన ప్రత్యక్ష సంబోధనను అదనంగా ‘నా’ అనే స్వామ్యార్థాన్ని చేర్చకుండా సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: πῶς δύσκολόν ἐστιν
  choice: ఎంత కష్టం
  rationale: πῶς కలిగించే ఆశ్చర్యోద్గార తీవ్రతను ‘ఎంత’ ద్వారా నిలుపుతూ δύσκολον అర్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν
  choice: దేవుని రాజ్యంలో ప్రవేశించడం
  rationale: గమ్యాన్ని సూచించే εἰς మరియు ప్రవేశాన్ని సూచించే εἰσελθεῖν భావాలను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘ధనాన్ని నమ్ముకునేవారు’ అనే దీర్ఘ పాఠాన్ని ప్రధాన వచనంలో చేర్చాలా
  choice: SBLGNTలోని సంక్షిప్త పాఠం ప్రకారం ‘దేవుని రాజ్యంలో ప్రవేశించడం ఎంత కష్టం’ అని ప్రధాన వచనంలో ఉంచడం
  alternative: ‘ధనాన్ని నమ్ముకునేవారు దేవుని రాజ్యంలో ప్రవేశించడం ఎంత కష్టం’
  rationale: అందించిన మూలపాఠంలో సంక్షిప్త పఠనమే ఉంది. దీర్ఘ పఠనం వాక్యాన్ని ధనంపై ఆధారపడేవారికి పరిమితం చేసి వ్యాఖ్యానాత్మకంగా స్పష్టీకరిస్తుంది; అందువల్ల దాన్ని ప్రధాన పాఠంలో చేర్చకుండా ప్రాముఖ్యమైన పాఠాంతరంగా పాదసూచికలో ఉంచడం మూలభాషా ప్రాధాన్యాన్ని, వాక్యంలోని ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘పిల్లలారా’లో యేసు సంబోధనలోని ఆప్యాయతను, ‘ఎంత కష్టం’లో గ్రీకు ఆశ్చర్యోద్గార బలాన్ని నిలిపాం.
