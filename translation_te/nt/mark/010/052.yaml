id: MRK.10.52
reference: Mark 10:52
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂καὶ ὁ⸃ Ἰησοῦς εἶπεν αὐτῷ· Ὕπαγε, ἡ πίστις σου σέσωκέν σε. καὶ ⸀εὐθὺς ἀνέβλεψεν, καὶ ἠκολούθει ⸀αὐτῷ ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/052.yaml
  text: And Jesus said to him[a], “Go[c][b]; your faith has saved you.” And immediately he regained his sight and followed him on the road.
translation:
  language: te
  text: యేసు అతనితో, “వెళ్లు; నీ విశ్వాసం[b] నిన్ను రక్షించింది[a]” అన్నాడు. వెంటనే అతనికి చూపు తిరిగి వచ్చింది; అతడు దారిలో[c] యేసును అనుసరిస్తూ వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిన్ను స్వస్థపరిచింది’ లేదా ‘నిన్ను బాగుచేసింది’ అని కూడా అనువదించవచ్చు. గ్రీకు క్రియ రక్షణతోపాటు స్వస్థతను కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘విశ్వాసం’ అనే మాటను ‘నమ్మకం’ అని కూడా వ్యక్తపరచవచ్చు.
    reason: alternative_reading
  - marker: c
    text: ‘మార్గంలో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕπαγε
  choice: వెళ్లు
  rationale: బయలుదేరి వెళ్లమనే ఆజ్ఞను అదనపు భావం చేర్చకుండా సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: πίστις
  choice: విశ్వాసం
  rationale: ఈ సందర్భంలో యేసుపై ఆ అంధుని నమ్మకాన్ని సూచిస్తుంది. కీలక పదానికి స్థిరత్వం ఇస్తూనే ‘నమ్మకం’ అనే భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: σέσωκέν
  choice: రక్షించింది
  rationale: σῴζω శారీరక స్వస్థతతోపాటు విస్తృతమైన రక్షణను కూడా సూచించగలదు. వెంటనే చూపు రావడం శారీరక స్వస్థతను స్పష్టం చేసినా, యేసు మాటలోని విస్తృత భావాన్ని సంకుచితం చేయకుండా ఉంచుతుంది.
- source_word: εὐθύς
  choice: వెంటనే
  rationale: మార్కు కథనంలోని వేగాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀνέβλεψεν
  choice: చూపు తిరిగి వచ్చింది
  rationale: అంధుడికి దృష్టి పునరుద్ధరించబడిందనే సందర్భోచిత అర్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἠκολούθει
  choice: అనుసరిస్తూ వెళ్లాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న చర్యను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐν τῇ ὁδῷ
  choice: దారిలో
  rationale: ప్రయాణానికి సంబంధించిన ప్రత్యక్ష దృశ్యాన్ని నిలుపుతూ, మార్కు సువార్తలో ఉండగల శిష్యత్వ సంబంధిత ‘మార్గం’ ప్రతిధ్వనిని పూర్తిగా తొలగించదు.
- source_word: καὶ ὁ Ἰησοῦς
  choice: యేసు
  rationale: తెలుగు కథన ప్రవాహంలో వాక్యారంభంలోని καίను ప్రత్యేక సంధానపదంగా అనువదించకపోవడం సహజం; సంఘటనల క్రమం సందర్భం ద్వారా స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: యేసు ప్రకటనలో σῴζω అర్థం
  choice: ‘నిన్ను రక్షించింది’ అని విస్తృతంగా అనువదించడం
  alternative: ‘నిన్ను స్వస్థపరిచింది’ లేదా ‘నిన్ను బాగుచేసింది’
  rationale: గ్రీకు క్రియ రక్షణనూ స్వస్థతనూ సూచించగలదు. చూపు పునరుద్ధరణ తక్షణ సందర్భంలో స్పష్టమైనప్పటికీ, యేసు మాటను కేవలం శారీరక స్వస్థతకే పరిమితం చేయకుండా మూలంలోని భావవిస్తృతినీ theological tensionనూ నిలుపుతుంది.
- issue: πίστις యొక్క సందర్భోచిత భావం
  choice: ప్రధాన పాఠ్యంలో ‘విశ్వాసం’
  alternative: ‘నమ్మకం’
  rationale: ఈ సందర్భంలో యేసుపై నమ్మకంతో ఆధారపడటమే ఉద్దేశం. ‘విశ్వాసం’ కీలక పద స్థిరత్వాన్ని కాపాడుతుంది; ‘నమ్మకం’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘అనుసరిస్తూ వెళ్లాడు’ కొనసాగుతున్న చర్యను సహజంగా తెలియజేస్తుంది; ‘రక్షించింది’ మూలపదంలోని స్వస్థత–రక్షణ భావవిస్తృతిని నిలుపుతుంది.
