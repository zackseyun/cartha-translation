source:
  edition: SBLGNT
  text: Καὶ προσπορεύονται αὐτῷ Ἰάκωβος καὶ Ἰωάννης ⸀οἱ υἱοὶ Ζεβεδαίου λέγοντες ⸀αὐτῷ· Διδάσκαλε, θέλομεν ἵνα ὃ ἐὰν αἰτήσωμέν ⸀σε ποιήσῃς ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/035.yaml
  text: And James and John[a], the sons of Zebedee, came to him and said to him, “Teacher, we want you to do for us whatever we ask of you.”
translation:
  language: te
  text: జెబెదయి కుమారులైన యాకోబు, యోహాను ఆయన దగ్గరికి వచ్చి[a], “బోధకుడా, మేము ఏది అడిగినా అది నీవు మాకు చేయాలని కోరుతున్నాం” అని ఆయనతో అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన దగ్గరకు వెళ్లి.” గ్రీకు క్రియ ఆయనవైపు కదలి వెళ్లడాన్ని మరింత ప్రత్యక్షంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσπορεύονται αὐτῷ
  choice: ఆయన దగ్గరికి వచ్చి
  rationale: క్రియ యేసువైపు కదలి రావడాన్ని సూచిస్తుంది. కథన వర్తమానాన్ని సహజమైన తెలుగు భూతకాల కథన రూపంలో అనువదించాం.
- source_word: οἱ υἱοὶ Ζεβεδαίου
  choice: జెబెదయి కుమారులైన
  rationale: గ్రీకులోని అనుబంధ గుర్తింపును సహజమైన తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: λέγοντες αὐτῷ
  choice: అని ఆయనతో అన్నారు
  rationale: గ్రీకు అసమాపక క్రియారూపాన్ని తెలుగు కథన శైలికి తగిన సమాపక క్రియగా మార్చి, αὐτῷ సూచించే వ్యక్తిని నిలిపాం.
- source_word: Διδάσκαλε
  choice: బోధకుడా
  rationale: బోధించే వ్యక్తి అనే మూల అర్థాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది; ‘ప్రభువా’ వంటి అధిక అర్థాన్ని చేర్చదు.
- source_word: θέλομεν
  choice: కోరుతున్నాం
  rationale: వారి ప్రత్యక్షమైన కోరికను సహజ తెలుగులో తెలియజేస్తుంది; అతిగా మర్యాదపూర్వకంగా లేదా సాహిత్యరీతిలో చేయదు.
- source_word: ὃ ἐὰν αἰτήσωμέν σε
  choice: మేము నిన్ను ఏది అడిగినా అది
  rationale: ὃ ἐάν లోని అనిర్దిష్ట భావాన్ని ‘ఏది...అది’ నిర్మాణంతో స్పష్టంగా నిలుపుతుంది.
- source_word: ποιήσῃς ἡμῖν
  choice: నీవు మాకు చేయాలని
  rationale: ποιέω యొక్క విస్తృతమైన ‘చేయు’ అర్థాన్ని కాపాడుతుంది; సందర్భార్థమైన ‘అనుగ్రహించు’ అని ముందే వ్యాఖ్యానించదు.
