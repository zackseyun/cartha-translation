  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని ప్రత్యక్షమైన, కొంత ధైర్యంగా వినిపించే అభ్యర్థనను మృదువుగా మార్చలేదు.
