id: MRK.10.38
reference: Mark 10:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω, ⸀ἢ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/038.yaml
  text: But Jesus said to them[a], “You do not know what you are asking. Are you able to drink the cup that I drink[b], or to be baptized with the baptism with which I am baptized?”
translation:
  language: te
  text: 'అయితే యేసు వారితో ఇలా అన్నాడు: “మీరు ఏమి అడుగుతున్నారో మీకు తెలియదు. నేను తాగే పానపాత్రను మీరు తాగగలరా?[a] లేదా నేను పొందుతున్న బాప్తిస్మంతో మీరు బాప్తిస్మం పొందగలరా?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పానపాత్ర’ అనేది ఒక వ్యక్తికి నిర్ణయించబడిన భాగాన్ని సూచించే బైబిలు రూపకం; ఇక్కడ అది ముఖ్యంగా యేసు త్వరలో అనుభవించబోయే బాధలను సూచిస్తుంది.
    reason: cross_reference
  - marker: b
    text: భావాన్ని మరింత స్పష్టంగా చెప్పాలంటే, “నేను అనుభవించే బాప్తిస్మాన్ని మీరు అనుభవించగలరా?” అని అనువదించవచ్చు. గ్రీకు మూలంలో నొక్కిచెప్పడానికి ‘బాప్తిస్మం’ అనే ఒకే పదకుటుంబానికి చెందిన నామవాచకం, క్రియ మళ్లీ మళ్లీ వాడబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: అయితే యేసు వారితో ... అని అన్నాడు
  rationale: δέ ఇక్కడ వారి అభ్యర్థనకు యేసు ఇచ్చే దిద్దుబాటు జవాబును సూచించే స్వల్ప వ్యత్యాసాన్ని తెలియజేస్తుంది. ‘అయితే’ ఆధునిక తెలుగులో సహజంగా ఆ మలుపును నిలుపుతుంది.
- source_word: Οὐκ οἴδατε
  choice: మీకు తెలియదు
  rationale: οἶδα యొక్క ప్రాథమిక అర్థమైన ‘తెలుసు’ను నిలుపుతుంది; సందర్భంలో ‘అర్థం కావడం లేదు’ అనే ఛాయ ఉన్నప్పటికీ దానిని ప్రధాన పాఠ్యంలో స్పష్టీకరించదు.
- source_word: τί αἰτεῖσθε
  choice: మీరు ఏమి అడుగుతున్నారో
  rationale: αἰτέω యొక్క సాధారణ అర్థమైన అడగడం లేదా కోరడాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: δύνασθε
  choice: మీరు ... గలరా?
  rationale: సామర్థ్యం లేదా శక్తి ఉందా అనే δύναμαι భావాన్ని తెలుగులో సహజమైన ప్రశ్నారూపంతో వ్యక్తం చేస్తుంది.
- source_word: πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω
  choice: నేను తాగే గిన్నెలోనిది మీరు తాగగలరా?
  rationale: తెలుగులో గిన్నెనే తాగడం అసహజం కాబట్టి ‘గిన్నెలోనిది’ అని చెప్పబడింది; అయినా ‘గిన్నె’ అనే ముఖ్యమైన బైబిలు రూపకం ప్రధాన పాఠ్యంలో నిలుపబడింది.
- source_word: ποτήριον
  choice: గిన్నె
  rationale: పానపాత్రను సూచించే సాధారణ, అర్థమయ్యే తెలుగు పదం. ‘బాధల గిన్నె’ అని విస్తరించకుండా మూలంలోని రూపకాన్ని నిలుపుతుంది.
- source_word: ἢ
  choice: లేదా
  rationale: SBLGNT పాఠంలోని విభాజక సంధిని యథాతథంగా నిలుపుతుంది; సమాంతర వాక్యాల ప్రభావంతో ‘మరియు’గా మార్చదు.
- source_word: τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι
  choice: నేను పొందుతున్న బాప్తిస్మంతో మీరు బాప్తిస్మం పొందగలరా?
  rationale: గ్రీకులోని βάπτισμα/βαπτίζω పదకుటుంబ పునరుక్తిని తెలుగులో సాధ్యమైనంత స్పష్టంగా నిలుపుతూ, రూపకాన్ని ‘అనుభవం’ లేదా ‘బాధ’ అని ముందుగానే వ్యాఖ్యానించదు.
- source_word: βαπτίζομαι ... βαπτισθῆναι
  choice: పొందుతున్న ... పొందగలరా
  rationale: తెలుగులో ‘బాప్తిస్మం పొందడం’ అనేది సహజమైన ప్రయోగం. రెండు నిష్క్రియ రూపాల భావాన్ని కర్తృప్రయోగంగా మార్చకుండా ఈ నిర్మాణం తెలియజేస్తుంది.
theological_decisions:
- issue: ‘గిన్నె’ మరియు ‘బాప్తిస్మం’ అనే రూపకాల భావం
  choice: రెండు రూపకాలనూ ప్రధాన పాఠ్యంలో నిలిపి, వాటిని బాధ, మరణం లేదా దేవుని ఉగ్రత అని అక్కడే విప్పి చెప్పలేదు.
  alternative: ‘నేను అనుభవించే బాధను మీరు అనుభవించగలరా?’ వంటి వ్యాఖ్యానాత్మక అనువాదం.
  rationale: సందర్భంలో ఈ రూపకాలు యేసు రాబోయే బాధలను సూచించినప్పటికీ, ఈ వాక్యం వాటి భావాన్ని పూర్తిగా నిర్వచించదు. రూపకాలను నిలపడం మూలపాఠ్యంలోని ధార్మిక విస్తృతిని, ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. ‘మీకు తెలియదు’, ‘అడుగుతున్నారో’, ‘గలరా’ వంటి సాధారణ రూపాలు వాడబడ్డాయి. బైబిలు రూపకాలైన ‘గిన్నె’, ‘బాప్తిస్మం’ వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపబడ్డాయి; గ్రీకు పునరుక్తి కారణంగా రెండవ ప్రశ్నలో ఉద్దేశపూర్వకమైన పదపునరావృతం ఉంది.
