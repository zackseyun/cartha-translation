id: MRK.10.51
reference: Mark 10:51
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸂αὐτῷ ὁ Ἰησοῦς εἶπεν⸃· Τί ⸂σοι θέλεις ποιήσω⸃; ὁ δὲ τυφλὸς εἶπεν αὐτῷ· Ραββουνι, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/051.yaml
  text: And answering him[a], Jesus said, “What do you want me to do for you?” And the blind man said to him, “Rabboni, that I may see again.”
translation:
  language: te
  text: 'యేసు అతనికి జవాబిచ్చి ఇలా అన్నాడు: “నేను నీ కోసం ఏమి చేయాలని నీవు కోరుతున్నావు?” ఆ అంధుడు ఆయనతో, “రబ్బూనీ[a], నేను మళ్లీ చూడగలిగేలా చేయండి” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రబ్బూనీ’ అనేది ‘నా గురువా’ లేదా ‘నా యజమానీ’ అనే అర్థమిచ్చే అరామిక్ సంబోధన రూపం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: జవాబిస్తూ
  rationale: గ్రీకులోని భూతకాల క్రియావిశేషణ రూపాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉండేలా అనువదించబడింది.
- source_word: Τί σοι θέλεις ποιήσω
  choice: నేను నీ కోసం ఏమి చేయాలని నీవు కోరుతున్నావు?
  rationale: σοι లోని ‘నీ కోసం’ అనే భావాన్నీ, θέλεις లోని కోరిక/ఇచ్ఛ భావాన్నీ స్పష్టంగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τυφλὸς
  choice: ఆ అంధుడు
  rationale: గ్రీకులో విశేషణం నామవాచకంగా వాడబడింది; తెలుగులో వ్యక్తిని సహజంగా సూచించడానికి ‘అంధుడు’ సరిపోతుంది.
- source_word: Ραββουνι
  choice: రబ్బూనీ
  rationale: మూల గ్రీకు పాఠం సంరక్షించిన అరామిక్ సంబోధనను లిప్యంతరీకరించడం ద్వారా దాని చారిత్రక, భావోద్వేగ ప్రత్యేకత నిలుస్తుంది; అర్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: ἵνα ἀναβλέψω
  choice: నాకు మళ్లీ చూపు కలగాలి
  rationale: స్వస్థత సందర్భంలో ἀναβλέπω అంటే తిరిగి చూడగలగడం లేదా చూపు పొందడం. ఈ రూపం ἵνα తెలిపే కోరుకున్న ఫలితాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: Ραββουνι అనే సంబోధన బిరుదు అనువాదం
  choice: ప్రధాన పాఠంలో ‘రబ్బూనీ’ని ఉంచి, పాదసూచికలో అర్థాన్ని వివరించడం
  alternative: ‘నా బోధకుడా’ లేదా ‘నా ప్రభువా’ అని నేరుగా అర్థానువాదం చేయడం
  rationale: గ్రీకు పాఠం సాధారణ గ్రీకు బిరుదును ఉపయోగించకుండా అరామిక్ సంబోధనను లిప్యంతరీకరించింది. అందువల్ల దానిని నిలుపుకోవడం మూలపాఠపు ప్రత్యేకతను కాపాడుతుంది; పాదసూచిక పాఠకునికి అర్థాన్ని అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి ఉపయోగించబడింది. వాక్య నిర్మాణం సహజంగా ఉండేలా స్వల్పంగా సవరించినప్పటికీ, గ్రీకు పాఠంలోని జవాబు, ప్రశ్న, సంబోధన, తిరిగి చూపు పొందాలనే కోరిక అన్నీ నిలుపబడ్డాయి.
