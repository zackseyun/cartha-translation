  text: ὁ δὲ εἶπεν αὐτοῖς· Τί θέλετε ⸀ποιήσω ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/036.yaml
  text: And he said to them, “What do you want me to do for you?”
translation:
  language: te
  text: ఆయన వారితో, “నేను మీ కోసం ఏమి చేయాలని మీరు కోరుకుంటున్నారు?” అని అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: ఆయన
  rationale: గ్రీకు పదబంధం కథనాన్ని కొనసాగిస్తూ కర్తను సూచిస్తుంది. తెలుగులో ‘ఆయన’ సహజంగా ఉంటుంది; δέకి ప్రత్యేక విరోధార్థం ఇక్కడ అవసరం లేదు.
- source_word: εἶπεν αὐτοῖς
  choice: వారితో … అని అన్నాడు
  rationale: λέγω యొక్క సాధారణ అర్థమైన ‘అను’ను నిలుపుతూ, దత్తివాచక αὐτοῖςను సహజ తెలుగు ప్రయోగమైన ‘వారితో’గా ఇచ్చాం.
- source_word: Τί θέλετε
  choice: ఏమి … మీరు కోరుకుంటున్నారు?
  rationale: τί ప్రశ్నార్థకంగా ‘ఏమి’; θέλω కోరికను సూచిస్తుంది. ‘కోరుకుంటున్నారు’ ఆధునిక, గౌరవప్రదమైన తెలుగు.
- source_word: ποιήσω
  choice: నేను … చేయాలని
  rationale: θέλετεతో వచ్చిన ఏకవచన ప్రథమ పురుష ఆఓరిస్ట్ సబ్జంక్టివ్, వారు తన చేత చేయించుకోవాలనుకునే కార్యాన్ని సూచిస్తుంది; తెలుగులో ‘నేను చేయాలని’ సహజ నిర్మాణం.
- source_word: ὑμῖν
  choice: మీ కోసం
  rationale: ఇక్కడ దత్తివాచకం వారి ప్రయోజనార్థం చేయబడే కార్యాన్ని సూచిస్తుంది; అందువల్ల ‘మీ కోసం’ అనేది ప్రయోజనార్థక భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ. మూలంలోని ప్రశ్న యొక్క సరళతను నిలుపుకుంది.
