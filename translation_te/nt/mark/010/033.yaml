id: MRK.10.33
reference: Mark 10:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ ⸀τοῖς γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/033.yaml
  text: that[a], ‘Look, we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and the scribes[b], and they will condemn him to death and hand him over to the Gentiles.’
translation:
  language: te
  text: “ఇదిగో, మనం యెరూషలేముకు వెళ్తున్నాం. మనుష్యకుమారుడు ముఖ్య యాజకులకు, శాస్త్రులకు అప్పగించబడతాడు[a]. వారు ఆయనకు మరణశిక్ష విధించి, ఆయనను అన్యజనులకు[b] అప్పగిస్తారు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారి చేతికి ఇవ్వబడతాడు.” గ్రీకులో ఇక్కడా, తరువాత “అప్పగిస్తారు” అన్న చోటా ఒకే క్రియ వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “జనాంగాలకు” లేదా “దేశాలకు”; ఈ సందర్భంలో యూదేతరులను సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: 'ఆయన ఇలా చెప్పాడు:'
  rationale: మునుపటి వాక్యంలో ప్రారంభమైన యేసు మాటల విషయాన్ని ὅτι పరిచయం చేస్తుంది. తెలుగులో స్వతంత్ర వచనంగా సహజంగా ఉండేందుకు సందర్భంలో ఉన్న కర్త, చెప్పే క్రియను స్పష్టపరుస్తూ ప్రత్యక్ష వాక్యాన్ని పరిచయం చేశాం; కారణార్థాన్ని చేర్చలేదు.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రోతల దృష్టిని ఆకర్షించే ఉద్ఘాటనను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదంతో నిలిపాం.
- source_word: ἀναβαίνομεν
  choice: మనం ... వెళ్తున్నాం
  rationale: యెరూషలేము వైపు సాగుతున్న ప్రస్తుత ప్రయాణాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది. ‘పైకి వెళ్తున్నాం’ అనే అక్షరార్థ రూపం తెలుగులో అనవసరంగా భౌగోళిక దిశను ముందుకు తెస్తుంది.
- source_word: εἰς Ἱεροσόλυμα
  choice: యెరూషలేముకు
  rationale: εἰς యొక్క గమ్యార్థాన్ని తెలుగు విభక్తితో సహజంగా తెలిపింది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: ఈ స్వీయ సంబోధనలోని పదరూపాన్నీ దాని దానియేలు గ్రంథ సంబంధిత, క్రీస్తు సంబంధిత ప్రతిధ్వనులనూ వ్యాఖ్యానాత్మకంగా సరళీకరించకుండా నిలుపుతుంది.
- source_word: παραδοθήσεται
  choice: అప్పగించబడతాడు
  rationale: ఇతరుల అధికారంలోకి ఇవ్వబడటాన్ని సూచించే విస్తృత భావాన్ని నిలుపుతుంది; ‘ద్రోహం చేయబడతాడు’ అని కార్యసాధకుని లేదా విధానాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: ముఖ్య యాజకులకు
  rationale: ఒకే ప్రధాన యాజకుణ్ణి కాక, యాజక నాయకుల సమూహాన్ని సూచిస్తుంది.
- source_word: τοῖς γραμματεῦσιν
  choice: శాస్త్రులకు
  rationale: యూదుల ధర్మశాస్త్ర ప్రతుల రచన, అధ్యయనం, బోధనతో సంబంధమున్న వర్గానికి స్థిరపడిన సంక్షిప్త తెలుగు పదం; విస్తృత వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: వారు ఆయనకు మరణశిక్ష విధించి
  rationale: ప్రతికూల న్యాయతీర్పు మరియు దాని మరణదండన ఫలితాన్ని సహజమైన న్యాయపరమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: παραδώσουσιν αὐτὸν
  choice: ఆయనను ... అప్పగిస్తారు
  rationale: మొదటి παραδίδωμι రూపానికి వాడిన అదే మూలపదాన్ని పునరావృతం చేసి అప్పగింతల వరుసను నిలుపుతుంది.
- source_word: τοῖς ἔθνεσιν
  choice: అన్యజనులకు
  rationale: ఈ శ్రమానుభవ సందర్భంలో యూదేతర అధికారుల చేతికి అప్పగించబడటాన్ని సూచిస్తుంది; ‘దేశాలకు’ అనే అమూర్త భావాన్ని నివారిస్తుంది.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου అనువాదం
  choice: మనుష్యకుమారుడు
  alternative: మానవుడు
  rationale: సాంప్రదాయిక అక్షరార్థ రూపం గ్రీకు పదబంధాన్నీ దాని దానియేలు గ్రంథ ప్రతిధ్వనినీ క్రీస్తు స్వీయ సంబోధననూ వ్యాఖ్యానాత్మకంగా కుదించకుండా కాపాడుతుంది.
- issue: τοῖς ἔθνεσιν అనువాదం
  choice: అన్యజనులకు
  alternative: జనాలకు / దేశాలకు
  rationale: తక్షణ శ్రమానుభవ సందర్భం యూదు నాయకుల నుండి యూదేతర పాలకుల చేతికి బదిలీ చేయడాన్ని సూచిస్తుంది. ఈ చారిత్రక భేదాన్ని నిలుపుతూ విస్తృత సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: παραδίδωμι యొక్క రెండు రూపాలు
  choice: రెండుచోట్లా ‘అప్పగించు’
  alternative: మొదట ‘ద్రోహం చేయు’, తరువాత ‘అప్పగించు’
  rationale: గ్రీకులోని పదపునరుక్తిని, ఒక అధికార వర్గం నుండి మరొకదానికి బదిలీ అయ్యే కథన క్రమాన్ని నిలుపుతుంది; మొదటి కార్యాన్ని ద్రోహానికి మాత్రమే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష వాక్య శైలి వాడబడింది. ‘ముఖ్య యాజకులు’, ‘శాస్త్రులు’, ‘మనుష్యకుమారుడు’, ‘అన్యజనులు’ వంటి బైబిలు పరిచిత పదాలను నిలిపి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా ఉంచాం. మూలంలోని καί పరంపరను తెలుగులో యాంత్రికంగా పునరావృతం చేయకుండా, సంఘటనల క్రమాన్ని వాక్య విభజనతో కాపాడాం.
