source:
  edition: SBLGNT
  text: καὶ στὰς ὁ Ἰησοῦς εἶπεν· ⸂Φωνήσατε αὐτόν⸃. καὶ φωνοῦσι τὸν τυφλὸν λέγοντες αὐτῷ· Θάρσει, ⸀ἔγειρε, φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/049.yaml
  text: And Jesus stopped and said[a], “Call him.” And they called the blind man, saying to him, “Take courage; get up[b], he is calling you.”
translation:
  language: te
  text: అప్పుడు యేసు ఆగి, “అతన్ని పిలవండి” అన్నాడు. వారు ఆ గుడ్డివాణ్ణి పిలిచి అతనితో, “ధైర్యంగా ఉండు; లే, ఆయన నిన్ను పిలుస్తున్నాడు” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: ఆగి
  rationale: ἵστημι యొక్క ఈ భూతకృదంత రూపం కథన సందర్భంలో యేసు తన ప్రయాణాన్ని నిలిపాడనే భావాన్ని ఇస్తుంది; ‘ఆగి’ సహజమైన ఆధునిక తెలుగు.
- source_word: Φωνήσατε αὐτόν
  choice: అతన్ని పిలవండి
  rationale: φωνέω ఇక్కడ ఒకరిని తన దగ్గరకు పిలిపించడం అనే భావంలో ఉంది. ఈ ఎంపిక ఆజ్ఞను సూటిగా తెలియజేస్తూ, తరువాతి పునరుక్తిని కూడా నిలుపుతుంది.
- source_word: φωνοῦσι
  choice: వారు ... పిలిచి
  rationale: ముందటి ఆజ్ఞలోని φωνέωతో పదసంబంధాన్ని నిలుపుతూ, తెలుగు కథన ప్రవాహానికి సహజంగా కృదంత నిర్మాణాన్ని ఉపయోగించాం.
- source_word: τὸν τυφλὸν
  choice: ఆ గుడ్డివాణ్ణి
  rationale: τυφλός ఇక్కడ నామవాచకంగా వాడబడింది; సందర్భంలో ఇప్పటికే తెలిసిన పురుషుణ్ణి సూచించేందుకు ‘ఆ గుడ్డివాణ్ణి’ సహజంగా ఉంది.
- source_word: Θάρσει
  choice: ధైర్యంగా ఉండు
  rationale: ఈ ఆజ్ఞ ప్రోత్సాహం, భరోసా రెండింటినీ వ్యక్తం చేస్తుంది. ‘ధైర్యంగా ఉండు’ ఆధునిక పాఠకులకు స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: ἔγειρε
  choice: లేచి రా
  rationale: ἐγείρω యొక్క ఆజ్ఞారూపం లేవమనే పిలుపు. సందర్భంలో అతడు పిలిచినవారి దగ్గరకు రావాల్సి ఉన్నందున ‘లేచి రా’ తెలుగులో సహజమైన ప్రత్యక్ష ప్రోత్సాహం.
- source_word: φωνεῖ σε
  choice: ఆయన నిన్ను పిలుస్తున్నాడు
  rationale: వర్తమాన కాలం పిలుపు ప్రస్తుతం కొనసాగుతున్న తక్షణతను తెలియజేస్తుంది; యేసును గౌరవంగా సూచించేందుకు ‘ఆయన’ వాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని అనుసరించాం. గ్రీకు వాక్యంలో φωνέω మూడుసార్లు రావడాన్ని తెలుగులో ‘పిలవండి/పిలిచి/పిలుస్తున్నాడు’గా నిలిపాం. అందించిన ఆంగ్ల పాఠంలోని పాదసూచికలు వాటి గుర్తులు, విషయాల మధ్య మార్పిడి జరిగినట్లు కనిపిస్తున్నందున, మూల గ్రీకు ఆధారంగా అవసరం లేని పాదసూచికలను చేర్చలేదు.
