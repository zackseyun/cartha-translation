revisions:
- from: మీలో ఎవరైతే మొదటివారిగా ఉండాలని కోరుకుంటారో, వారు అందరికీ బానిసగా ఉంటారు.[a]
  to: మీలో ఎవరైతే మొదటి స్థానంలో ఉండాలని కోరుకుంటారో, వారు అందరికీ బానిసగా ఉంటారు.[a]
  rationale: The revision retains the draft's faithful rendering of the saying while replacing the less natural «మొదటివారిగా» with an idiomatic expression for first rank. The note is refined to identify the contrast with 10:43 accurately. No disputed textual ambiguity is involved.
