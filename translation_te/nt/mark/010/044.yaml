review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the indefinite conditional force, status sense of ἐν ὑμῖν and πρῶτος, future form of ἔσται, universal scope of πάντων, and the stronger force of δοῦλος in contrast with 10:43. However, «మొదటివారిగా» mismatches the generic-singular sense and is less idiomatic for rank in this sentence.
  naturalness: «మొదటి స్థానంలో ఉండాలని» is clearer, idiomatic modern standard Telugu for being first in rank. The correlative generic construction «ఎవరైతే … కోరుకుంటారో, వారు» remains natural and appropriately non-gender-specific.
  terminology: «బానిస» suitably preserves the intensified, subordinated force of δοῦλος relative to διάκονος in the preceding verse. The footnote should call «దాసుడు» an alternative rendering rather than implying an alternative source reading, and should state the contrast with the preceding verse more precisely.
  issues:
  - severity: medium
    issue: «మొదటివారిగా» is awkward and introduces a plural-form impression.
    rationale: πρῶτος is singular and denotes first rank. In a generic Telugu construction with «వారు», «మొదటి స్థానంలో» communicates the intended social-ranking sense naturally without the number mismatch.
  - severity: low
    issue: The footnote's wording about the previous verse is imprecise.
    rationale: The stronger Greek term δοῦλος occurs in this verse; the preceding verse contains διάκονος, which is commonly rendered «సేవకుడు». Revising the note makes the lexical contrast explicit and avoids suggesting that δοῦλος itself occurred in the previous verse.
  revised_text: మీలో ఎవరైతే మొదటి స్థానంలో ఉండాలని కోరుకుంటారో, వారు అందరికీ బానిసగా ఉంటారు.[a]
