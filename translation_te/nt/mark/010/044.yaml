id: MRK.10.44
reference: Mark 10:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν θέλῃ ⸂ἐν ὑμῖν εἶναι⸃ πρῶτος, ἔσται πάντων δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/044.yaml
  text: And whoever wants to be first among you will be the servant of all[a].
translation:
  language: te
  text: మీలో ఎవరైతే మొదటి స్థానంలో ఉండాలని కోరుకుంటారో, వారు అందరికీ బానిసగా ఉంటారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అందరికీ దాసుడిగా.” ఇక్కడి గ్రీకు పదం δοῦλος (దూలోస్). ఇది మునుపటి వచనంలో ఉన్న, సాధారణంగా “సేవకుడు” అని అనువదించే గ్రీకు పదం కంటే బలమైనది.
    reason: δοῦλος పదంలోని బానిసత్వం/సేవకత్వం మధ్య ఉన్న అర్థవ్యాప్తిని, అలాగే 10:43తో ఉన్న తీవ్రతా భేదాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: ఎవరైతే … కోరుకుంటారో
  rationale: సాపేక్ష సర్వనామం, ἄν, సంభావనార్థక క్రియ కలిసి అనిశ్చితమైన సాధారణ షరతును సూచిస్తున్నాయి. ఈ తెలుగు నిర్మాణం ‘ఎవరైనా/ఎవరైతే’ అనే విస్తృత భావాన్నీ, θέλωలోని సంకల్పాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: ἐν ὑμῖν
  choice: మీలో
  rationale: ఇక్కడ ఇది కేవలం స్థలాన్ని కాక, శిష్యుల సమూహంలో హోదా లేదా ప్రాముఖ్యతను సూచిస్తుంది. ‘మీలో’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: πρῶτος
  choice: మొదటివారిగా
  rationale: πρῶτος ఇక్కడ వరుసలో మొదటివాడనే భావంతో పాటు హోదా, ప్రాముఖ్యతలో ముందుండడాన్ని సూచిస్తుంది. ‘మొదటివారిగా’ మూలంలోని రూపకాన్నీ సందర్భంలోని సామాజిక భావాన్నీ నిలుపుతుంది.
- source_word: ἔσται
  choice: ఉంటారు
  rationale: గ్రీకు భవిష్యత్ రూపాన్ని నేరుగా ప్రతిబింబిస్తూ, సందర్భంలో ఉన్న ఆదేశాత్మక బలాన్ని ‘తప్పక’ వంటి అదనపు పదంతో స్పష్టీకరించకుండా అలాగే ఉంచుతుంది.
- source_word: πάντων
  choice: అందరికీ
  rationale: δοῦλοςతో ఉన్న సంబంధం లేదా అధీనతను తెలుగులో దత్తివిభక్తితో సహజంగా వ్యక్తం చేస్తుంది; అలాగే ‘అందరు’ అనే సార్వత్రిక పరిధిని నిలుపుతుంది.
- source_word: δοῦλος
  choice: బానిస
  rationale: మునుపటి వచనంలోని διάκονοςకు సాధారణంగా వాడే ‘సేవకుడు’ కంటే δοῦλος బలమైన, అధీనతను సూచించే పదం. ‘బానిస’ ఆ తీవ్రతను, అత్యల్ప సామాజిక స్థితిని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: శిష్యత్వ బోధలో δοῦλος పదం అనువాదం
  choice: బానిస
  alternative: దాసుడు / సేవకుడు
  rationale: ఈ సందర్భంలో ఉన్నత స్థానం కోరుకోవడానికి విరుద్ధంగా సంపూర్ణంగా తన్నుతాను తగ్గించుకోవడం ప్రధానాంశం. 10:43లోని διάκονοςతో 10:44లోని δοῦλος మధ్య ఉన్న తీవ్రతా భేదాన్ని చెరపకుండా ఉండేందుకు ‘బానిస’ను ప్రధాన పాఠంలో ఉంచాం; ‘దాసుడు’ను పాదటిప్పణిలో ప్రత్యామ్నాయంగా ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వినిపించేందుకు ‘ఎవరైతే … కోరుకుంటారో, వారు’ అనే గౌరవసూచక సాధారణ నిర్మాణాన్ని వాడాం. వాక్యాన్ని గంభీరంగా కానీ సాధారణ పాఠకులకు సులభంగా ఉంచాం. ప్రధాన పాఠంలోని [a] గుర్తు పాదటిప్పణితో సరిపోలుతుంది.
