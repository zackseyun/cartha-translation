- from: '“ఆజ్ఞలు నీకు తెలుసు: హత్య చేయవద్దు[a]; వ్యభిచారం చేయవద్దు; దొంగతనం చేయవద్దు; అబద్ధ సాక్ష్యం చెప్పవద్దు; ఇతరులకు చెందవలసినదాన్ని అన్యాయంగా దక్కనివ్వకుండా చేయవద్దు[b]; నీ తండ్రిని, తల్లిని గౌరవించు.”'
  to: '“ఆజ్ఞలు నీకు తెలుసు: హత్య చేయవద్దు[a]; వ్యభిచారం చేయవద్దు; దొంగతనం చేయవద్దు; అబద్ధ సాక్ష్యం చెప్పవద్దు; ఎవరికైనా హక్కుగా చెందవలసినదాన్ని అన్యాయంగా అపహరించవద్దు[b]; నీ తండ్రినీ తల్లినీ గౌరవించు.”'
  rationale: Only the rendering of ἀποστερήσῃς and its supporting wording have been revised for idiomatic modern Telugu. “అపహరించవద్దు,” qualified by “ఎవరికైనా హక్కుగా చెందవలసినదాన్ని అన్యాయంగా,” communicates wrongful deprivation while retaining the distinction from the preceding prohibition of theft. The parental phrase is also smoothed to “తండ్రినీ తల్లినీ,” a natural paired Telugu construction.
