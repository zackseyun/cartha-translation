id: MRK.10.19
reference: Mark 10:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὰς ἐντολὰς οἶδας· Μὴ ⸂φονεύσῃς, Μὴ μοιχεύσῃς⸃, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Μὴ ἀποστερήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/019.yaml
  text: 'You know the commandments: Do not murder[a], do not commit adultery, do not steal, do not bear false witness, do not defraud[b], honor your father and mother.'
translation:
  language: te
  text: '“ఆజ్ఞలు నీకు తెలుసు: హత్య చేయవద్దు[a]; వ్యభిచారం చేయవద్దు; దొంగతనం చేయవద్దు; అబద్ధ సాక్ష్యం చెప్పవద్దు; ఎవరికైనా హక్కుగా చెందవలసినదాన్ని అన్యాయంగా అపహరించవద్దు[b]; నీ తండ్రినీ తల్లినీ గౌరవించు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చంపవద్దు.” ఇక్కడి గ్రీకు క్రియ సాధారణంగా చంపడమంతటినీ కాక, హత్యను లేదా అన్యాయంగా ప్రాణం తీయడాన్ని మరింత నిర్దిష్టంగా సూచిస్తుంది; అందుకే “హత్య చేయవద్దు” అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: దీనిని “మోసం చేయవద్దు,” “దక్కవలసినదాన్ని దక్కనివ్వవద్దు,” లేదా “అన్యాయంగా హరించవద్దు” అని కూడా అనువదించవచ్చు. ఈ పదం మరొకరికి హక్కుగా చెందవలసినదాన్ని, తరచుగా దోపిడీ ద్వారా, వారికి దక్కకుండా చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολάς
  choice: ఆజ్ఞలు
  rationale: పది ఆజ్ఞలను సూచించే ఈ సందర్భంలో సహజమైన, సుపరిచితమైన తెలుగు పదం.
- source_word: οἶδας
  choice: నీకు తెలుసు
  rationale: οἶδα పరిపూర్ణ రూపంలో ఉన్నా కొయినే గ్రీకులో వర్తమానార్థం ఇస్తుంది; తెలుగులో ఈ వ్యక్తీకరణ సహజం.
- source_word: Μὴ φονεύσῃς
  choice: హత్య చేయవద్దు
  rationale: φονεύω సాధారణంగా చంపడమంతటినీ కాక, అన్యాయంగా ప్రాణం తీయడాన్ని—హత్యను—సూచిస్తుంది.
- source_word: Μὴ μοιχεύσῃς
  choice: వ్యభిచారం చేయవద్దు
  rationale: వివాహ విశ్వాసాన్ని ఉల్లంఘించే లైంగిక పాపాన్ని సూచించే స్థిరమైన నైతిక-న్యాయ పదబంధం.
- source_word: Μὴ κλέψῃς
  choice: దొంగతనం చేయవద్దు
  rationale: κλέπτωకు స్పష్టమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: అబద్ధ సాక్ష్యం చెప్పవద్దు
  rationale: కేవలం అబద్ధం చెప్పడం అనే విస్తృత భావం కాకుండా, ψευδομαρτυρέωలోని సాక్ష్య సంబంధమైన న్యాయభావాన్ని నిలుపుతుంది.
- source_word: Μὴ ἀποστερήσῃς
  choice: ఇతరులకు చెందవలసినదాన్ని అన్యాయంగా దక్కనివ్వకుండా చేయవద్దు
  rationale: ἀποστερέω అంటే మరొకరికి న్యాయంగా చెందవలసినదాన్ని నిలిపివేయడం లేదా దోపిడీ ద్వారా వారికి దక్కకుండా చేయడం; ఒకే తెలుగు పదం కంటే ఈ వాక్యరూపం భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: Τίμα
  choice: గౌరవించు
  rationale: τιμάωలోని బలమైన కుటుంబ, నైతిక బాధ్యతను ‘గౌరవించు’ సహజంగా తెలియజేస్తుంది.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: నీ తండ్రిని, తల్లిని
  rationale: ఇద్దరు తల్లిదండ్రులను విడివిడిగా సూచించే గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగులో సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: పది ఆజ్ఞల ఉల్లేఖనాల శైలి
  choice: తెలుగులో సుపరిచితమైన ఆజ్ఞారూపాన్ని ఉంచుతూ గ్రీకు పదాల నిర్దిష్ట భావాన్ని అనుసరించడం
  alternative: సంప్రదాయ పదబంధాలను యథాతథంగా వాడడం లేదా స్వేచ్ఛగా భావానువాదం చేయడం
  rationale: ఇది ఆజ్ఞల జాబితా కాబట్టి గుర్తించదగిన ఆజ్ఞా శైలి అవసరం; అయితే φονεύωను విస్తృతమైన ‘చంపు’గా కాక ‘హత్య చేయు’గా, ἀποστερέωను కేవలం ‘దొంగిలించు’గా కాక హక్కుగా చెందవలసినదాన్ని దక్కనివ్వకపోవడంగా చూపడం మూలపాఠానికి మరింత నిష్ఠగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఆజ్ఞా శైలి వాడబడింది. ‘అన్యాయంగా దక్కనివ్వకుండా చేయవద్దు’ కొద్దిగా వివరణాత్మకమైనదైనా ἀποστερέω భావపరిధిని స్పష్టంగా నిలుపుతుంది.
