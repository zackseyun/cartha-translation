id: MRK.10.42
reference: Mark 10:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂καὶ προσκαλεσάμενος αὐτοὺς ὁ Ἰησοῦς⸃ λέγει αὐτοῖς· Οἴδατε ὅτι οἱ δοκοῦντες ἄρχειν τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι αὐτῶν κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/042.yaml
  text: And Jesus called them to himself and said to them[a], “You know that those who are considered rulers of the Gentiles lord it over them[b], and their great ones exercise authority over them.”
translation:
  language: te
  text: 'యేసు వారిని తన దగ్గరికి పిలిచి వారితో ఇలా అన్నాడు: “అన్యజనుల[a] పాలకులుగా పరిగణించబడేవారు[b] వారిపై పెత్తనం చేస్తారని, వారిలో గొప్పవారు వారిపై అధికారం చెలాయిస్తారని మీకు తెలుసు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేశాల.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “పాలిస్తున్నట్టు కనిపించేవారు.”
    reason: alternative_reading
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: తన దగ్గరికి పిలిచి
  rationale: మధ్యమ వాచకంలోని ‘తనవద్దకు పిలుచుకోవడం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను కూడా నిలుపుతుంది.
- source_word: λέγει
  choice: ఇలా అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, తెలుగు కథన శైలిలో భూతకాల రూపం సహజంగా ఉంటుంది. ‘ఇలా’ ప్రత్యక్ష వాక్యాన్ని సులభంగా పరిచయం చేస్తుంది.
- source_word: Οἴδατε
  choice: మీకు తెలుసు
  rationale: οἶδα రూపానికి ఇక్కడ వర్తమానార్థమే ఉంది; స్థిరంగా తెలిసిన విషయాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἱ δοκοῦντες ἄρχειν
  choice: పాలకులుగా పరిగణించబడేవారు
  rationale: δοκοῦντες‌లోని ‘అలా భావించబడడం/గుర్తించబడడం’ అనే ప్రజాభిప్రాయ భావాన్ని నిలుపుతుంది; వారి అధికారం కేవలం భ్రమ అని అనవసరంగా సూచించదు.
- source_word: τῶν ἐθνῶν
  choice: అన్యజనుల
  rationale: మార్కు సువార్తలోని యూద నేపథ్యానికి అనుగుణంగా యూదేతర ప్రజలను సూచిస్తుంది. ‘దేశాల’ అనే విస్తృత అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: κατακυριεύουσιν
  choice: పెత్తనం చేస్తారు
  rationale: సాధారణంగా పాలించడం కంటే బలవంతంగా, అణచివేసే రీతిలో ఆధిపత్యం చూపడం అనే బలమైన భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: οἱ μεγάλοι αὐτῶν
  choice: వారిలో గొప్పవారు
  rationale: నిర్దిష్ట అధికార పదవిని మూలపాఠం చెప్పనందున దాన్ని జోడించకుండా, సామాజికంగా ప్రముఖులైన లేదా శక్తిమంతులైన వారిని సూచిస్తుంది.
- source_word: κατεξουσιάζουσιν
  choice: అధికారం చెలాయిస్తారు
  rationale: ఇతరులపై అధికారాన్ని ప్రయోగించడం అనే భావాన్ని స్పష్టంగా తెలుపుతుంది; సమాంతర భాగంలోని ‘పెత్తనం’తో పదభేదాన్ని కూడా కాపాడుతుంది.
theological_decisions:
- issue: τῶν ἐθνῶν యొక్క సూచన
  choice: అన్యజనులు
  alternative: దేశాలు / జనాలు
  rationale: ఈ యూద నేపథ్య సందర్భంలో యూదేతర జనాలను సూచించడం సహజం. అయినప్పటికీ గ్రీకు పదానికి ‘దేశాలు/జనాలు’ అనే విస్తృత అర్థం కూడా ఉన్నందున దాన్ని పాదసూచికలో ఇచ్చాం.
- issue: δοκοῦντες యొక్క భావబలం
  choice: పాలకులుగా పరిగణించబడేవారు
  alternative: పాలిస్తున్నట్టు కనిపించేవారు
  rationale: వారు నిజంగా పాలకులు కారనే వ్యంగ్యార్థాన్ని బలవంతంగా రుద్దకుండా, సమాజం వారిని పాలకులుగా గుర్తిస్తుందనే భావాన్ని ప్రధాన పాఠంలో ఉంచాం; గ్రీకులోని ‘కనిపించడం’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘పెత్తనం చేస్తారు’ అనే ప్రయోగం κατακυριεύουσιν‌లోని ప్రతికూల ఆధిపత్య భావాన్ని సామాన్య పాఠకునికి స్పష్టంగా అందిస్తుంది; ‘అధికారం చెలాయిస్తారు’ రెండవ క్రియతో ఉన్న భావభేదాన్ని నిలుపుతుంది.
