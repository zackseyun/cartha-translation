id: MRK.10.5
reference: Mark 10:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν αὐτοῖς· Πρὸς τὴν σκληροκαρδίαν ὑμῶν ἔγραψεν ὑμῖν τὴν ἐντολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/005.yaml
  text: But Jesus said to them[c][b][a], “Because of your hardness of heart he wrote this commandment for you.”
translation:
  language: te
  text: అయితే యేసు వారితో, “మీ హృదయకాఠిన్యాన్ని బట్టి అతడు[a] మీ కోసం ఈ ఆజ్ఞను[b] రాశాడు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, మునుపటి వచనంలో ప్రస్తావించిన మోషే.
    reason: cross_reference
  - marker: b
    text: లేదా, ‘ఆదేశాన్ని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: సంభాషణలో స్వల్ప వ్యత్యాసాన్ని, మలుపును సహజంగా తెలియజేస్తుంది.
- source_word: Πρὸς
  choice: బట్టే
  rationale: వారి స్థితిని దృష్టిలో ఉంచుకొని, దాని కారణంగా ఈ ఆజ్ఞ రాయబడిందనే సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: σκληροκαρδίαν
  choice: హృదయకాఠిన్యం
  rationale: గ్రీకు సమాసంలోని ‘హృదయం’ అనే రూపకాన్ని, నైతిక మొండితనపు భావాన్ని కాపాడుతుంది.
- source_word: ἔγραψεν
  choice: అతడు రాశాడు
  rationale: గ్రీకులో కర్త పేరు మళ్లీ చెప్పబడలేదు; మునుపటి వచనంలోని మోషేను సూచించే ఏకవచన కర్తను అలాగే ఉంచుతుంది.
- source_word: ἐντολήν
  choice: ఆజ్ఞ
  rationale: అధికారపూర్వకమైన శాసన ఆదేశాన్ని సూచిస్తూ ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: ταύτην
  choice: ఈ
  rationale: చర్చలో ఉన్న నిర్దిష్ట ఆజ్ఞను సూటిగా సూచిస్తుంది.
theological_decisions:
- issue: ‘రాశాడు’ అనే క్రియకు మోషేను పేరుతో స్పష్టం చేయాలా
  choice: ప్రధాన పాఠ్యంలో ‘అతడు’ అని ఉంచి, పాదసూచికలో మోషే అని తెలియజేయడం
  alternative: ‘మోషే రాశాడు’ అని ప్రధాన పాఠ్యంలోనే స్పష్టం చేయడం
  rationale: గ్రీకు మూలంలో ఈ వచనంలో మోషే పేరు పునరుక్తం కాలేదు. సందర్భ సంబంధాన్ని కాపాడుతూ అనవసరమైన స్పష్టీకరణను ప్రధాన పాఠ్యంలో చేర్చకుండా ఉంటుంది.
- issue: σκληροκαρδίαν లోని బైబిలీయ రూపకాన్ని ఎలా నిలుపుకోవాలి
  choice: ‘హృదయకాఠిన్యం’
  alternative: ‘మొండితనం’ లేదా ‘కఠినహృదయం’
  rationale: ‘హృదయం’ అనే మూల రూపకాన్ని తగ్గించకుండా, దాని నైతిక భావబలాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని హృదయ రూపకాన్ని నిలుపుకోవడానికి ‘హృదయకాఠిన్యం’ ఎంచుకోబడింది; గ్రీకులో అంతర్లీనంగా ఉన్న కర్తను ‘అతడు’గా ఉంచి పాదసూచికలో గుర్తించబడింది.
