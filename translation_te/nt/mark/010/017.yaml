id: MRK.10.17
reference: Mark 10:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένου αὐτοῦ εἰς ὁδὸν προσδραμὼν εἷς καὶ γονυπετήσας αὐτὸν ἐπηρώτα αὐτόν· Διδάσκαλε ἀγαθέ, τί ποιήσω ἵνα ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/017.yaml
  text: And as he was going out onto the road[a], one man ran up and knelt before him and asked him, “Good Teacher, what must I do so that I may inherit eternal life?”
translation:
  language: te
  text: ఆయన దారిలోకి బయలుదేరుతుండగా[a], ఒక మనిషి పరుగెత్తుకుంటూ వచ్చి ఆయన ముందు మోకరించి, “మంచి బోధకుడా, శాశ్వత జీవాన్ని వారసత్వంగా పొందడానికి నేనేమి చేయాలి?” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన ప్రయాణం మొదలుపెడుతుండగా.” గ్రీకు పదబంధం దారిలోకి బయలుదేరడాన్ని గానీ, ప్రయాణాన్ని ప్రారంభించడాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ εἰς ὁδόν
  choice: ఆయన దారిలోకి బయలుదేరుతుండగా
  rationale: జనిటివ్ అబ్సల్యూట్ ప్రధాన చర్యకు సమకాలీనమైన నేపథ్య చర్యను సూచిస్తుంది. ఈ అనువాదం బయటకు వెళ్లి దారిలో ప్రవేశించే దృశ్యాన్ని సహజంగా ఉంచుతుంది; ప్రయాణం ప్రారంభించడం అనే భావసాధ్యతను పాదటిప్పణిలో నిలుపుతుంది.
- source_word: προσδραμὼν
  choice: పరుగెత్తుకుంటూ వచ్చి
  rationale: ఆ మనిషి వేగంగా, ఆతురతతో సమీపించిన సజీవ దృశ్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: εἷς
  choice: ఒక మనిషి
  rationale: పుంలింగ ఏకవచనంలో వ్యక్తిని పరిచయం చేస్తున్న మూలపదానికి లింగసూచనను నిలుపుతూ సరిపోతుంది.
- source_word: γονυπετήσας αὐτόν
  choice: ఆయన ముందు మోకరించి
  rationale: గౌరవం లేదా earnest supplication సూచించే మోకరించే భంగిమను స్పష్టంగా, అతిశయోక్తి లేకుండా తెలియజేస్తుంది.
- source_word: ἐπηρώτα αὐτόν
  choice: అని అడిగాడు
  rationale: గ్రీకు ఇంపర్ఫెక్ట్‌ను తెలుగు కథనంలో సహజంగా వ్యక్తం చేస్తుంది; కొనసాగుతున్న ప్రశ్నగా అనవసరంగా బలపరచదు.
- source_word: Διδάσκαλε ἀγαθέ
  choice: మంచి బోధకుడా
  rationale: διδάσκαλος అనే బోధించే వ్యక్తి అర్థాన్ని కాపాడి, తరువాతి సంభాషణకు ముఖ్యమైన ἀγαθέ అనే విశేషణాన్ని ప్రత్యక్ష సంబోధనలో నిలుపుతుంది.
- source_word: τί ποιήσω
  choice: నేనేమి చేయాలి?
  rationale: ఏ చర్య అవసరమో అడిగే deliberative ప్రశ్న యొక్క ఆచరణాత్మక బలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἵνα
  choice: పొందడానికి
  rationale: తెలుగులో సహజమైన ప్రయోజనార్థక నిర్మాణంతో లక్ష్యసంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ζωὴν αἰώνιον
  choice: శాశ్వత జీవం
  rationale: కాలాతీతత లేదా అంతంలేని జీవం అనే భావంతో పాటు వేదాంతపరమైన ప్రతిధ్వనిని కలిగిన స్పష్టమైన ఆధునిక తెలుగు పదబంధం.
- source_word: κληρονομήσω
  choice: వారసత్వంగా పొందడానికి
  rationale: κληρονομέωలోని వారసత్వ భావాన్ని కేవలం ‘పొందు’ అని చదును చేయకుండా స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: యేసును ఆ మనిషి సంబోధించిన విధానం
  choice: మంచి బోధకుడా
  alternative: మంచి గురువా; మంచి ప్రభువా
  rationale: మూలంలో διδάσκαλε ఉంది, κύριε లేదు. కాబట్టి మూలం చెప్పనంత బలమైన బిరుదును చేర్చకుండా, తరువాతి వచనంలోని ‘మంచి’ గురించిన ప్రతిస్పందనకు అవసరమైన పదాన్ని నిలుపుతుంది.
- issue: εἷς యొక్క లింగ సూచన
  choice: ఒక మనిషి
  alternative: ఒకరు; ఒక వ్యక్తి
  rationale: మూలంలోని పుంలింగ ఏకవచన రూపాన్ని కథన సందర్భంలో కాపాడుతుంది; అస్పష్ట లింగరహిత పదంతో దాన్ని చదును చేయదు.
- issue: κληρονομήσωలోని వారసత్వ రూపకం
  choice: వారసత్వంగా పొందడానికి
  alternative: పొందడానికి; సంపాదించడానికి
  rationale: వారసత్వంగా స్వీకరించడం అనే మూలపద భావాన్ని నిలుపుతుంది; ఆ మనిషి అడిగిన ‘చేయడం’ను జీవాన్ని సంపాదించడమనే సిద్ధాంత నిర్ణయంగా అనువాదం మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గౌరవప్రదమైన కథన శైలిలో రూపొందించబడింది. ‘మోకరించి,’ ‘వారసత్వంగా’ వంటి మూలార్థానికి ముఖ్యమైన పదాలను సహజమైన వాక్యనిర్మాణంలో ఉంచింది.
