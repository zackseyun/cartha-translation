id: MRK.10.14
reference: Mark 10:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ἠγανάκτησεν καὶ εἶπεν αὐτοῖς· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με, μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/014.yaml
  text: But when Jesus saw it[a], he was indignant and said to them, “Let the children come to me; do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: te
  text: 'అయితే యేసు అది చూసి ఆగ్రహించి వారితో ఇలా అన్నాడు: “పిల్లలను నా దగ్గరకు రానివ్వండి; వారిని అడ్డుకోకండి. ఎందుకంటే దేవుని రాజ్యం ఇలాంటివారిదే.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “ఎందుకంటే ఇలాంటివారిది దేవుని రాజ్యం.”'
    reason: మూలంలోని సంబంధార్థ నిర్మాణాన్ని, దేవుని రాజ్యాన్ని విషయంగా ఉంచే పదక్రమంతో మరింత ప్రత్యక్షంగా చూపే ప్రత్యామ్నాయ రూపం.
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Ἰησοῦς
  choice: అయితే యేసు అది చూసి
  rationale: ἰδών అనే భూతకాలిక క్రియావిశేషణం యేసు ప్రతిస్పందనకు దారితీసిన సందర్భాన్ని తెలుపుతుంది. తెలుగు సహజ వాక్యనిర్మాణంలో మునుపటి సంఘటనను సూచించడానికి ‘అది’ చేర్చబడింది; δέ మునుపటి వచనంలోని శిష్యుల చర్యకు స్వల్ప వ్యతిరేకతను చూపుతుంది.
- source_word: ἠγανάκτησεν
  choice: ఆగ్రహించి
  rationale: ఈ పదం బలమైన అసంతృప్తి లేదా న్యాయమైన ఆగ్రహాన్ని సూచిస్తుంది. ‘ఆగ్రహించి’ దాని తీవ్రతను నిలుపుతుంది; అదుపులేని కోపాన్ని అనవసరంగా సూచించదు.
- source_word: εἶπεν αὐτοῖς
  choice: వారితో ఇలా అన్నాడు
  rationale: గ్రీకు మాటల పరిచయ సూత్రానికి సహజమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: పిల్లలను నా దగ్గరకు రానివ్వండి
  rationale: Ἄφετε ఇక్కడ అనుమతించండి అనే ఆజ్ఞార్థాన్ని కలిగిస్తుంది. παιδίαను అనవసరంగా వయస్సు పరిమితం చేయకుండా ‘పిల్లలు’గా అనువదించాం.
- source_word: μὴ κωλύετε αὐτά
  choice: వారిని అడ్డుకోకండి
  rationale: κωλύω ప్రవేశాన్ని లేదా చర్యను నిరోధించడం అనే భావాన్ని ఇస్తుంది. వ్యక్తులను సూచించే తెలుగు సర్వనామంగా ‘వారిని’ సహజంగా ఉంటుంది.
- source_word: τῶν γὰρ τοιούτων ἐστὶν
  choice: ఎందుకంటే ... ఇలాంటివారిదే
  rationale: τοιούτων నిర్దిష్టంగా అక్కడున్న పిల్లలను మాత్రమే కాక, వారి వంటి వారిని ప్రతినిధిత్వంగా సూచిస్తుంది. ‘ఇలాంటివారిదే’ గ్రీకు సంబంధార్థాన్ని సహజ తెలుగులో ఇస్తుంది; ‘దే’ వాక్యంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: ఇది స్థిరమైన, పారదర్శకమైన బైబిలు పదబంధం; దేవుని పాలన భావాన్ని సంకుచితం చేయకుండా మూలంలోని ‘రాజ్యం’ రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘τῶν ... τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ’ అనే మాట యొక్క పరిధి
  choice: దేవుని రాజ్యం ‘ఇలాంటివారిది’ అని, పిల్లలను ప్రతినిధులుగా చూపే విధంగా అనువదించడం
  alternative: దేవుని రాజ్యం అక్కడున్న అక్షరార్థ పిల్లలకు మాత్రమే చెందుతుందని చెప్పడం; లేదా ‘ఇలాంటివారితో దేవుని రాజ్యం ఉంది’ అనే అతి అక్షరానువాదం
  rationale: τοιούτων అంటే ‘ఈ విధమైనవారు’ అని సహజంగా అర్థం. పిల్లల నిర్దోషిత్వం, రక్షణ స్థితి, లేదా ఏ ప్రత్యేక లక్షణం గురించి మూలపాఠం ఇక్కడ స్పష్టంగా చెప్పనందున అనువాదం వాటిని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిని నిలుపుతూ రూపొందించబడింది. ఆజ్ఞలకు బహువచన గౌరవ/సమూహ రూపమైన ‘-ండి’ వాడబడింది.
