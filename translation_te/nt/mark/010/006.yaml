translation:
  language: te
  text: కాని సృష్టి ఆరంభం నుండి, ఆయన వారిని పురుషునిగాను స్త్రీనిగాను చేశాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన వారిని పురుషునిగాను స్త్రీనిగాను సృష్టించాడు.” ఇక్కడి గ్రీకు క్రియకు ప్రత్యక్ష అర్థం “చేశాడు”; అయితే “సృష్టించాడు” అనేది ఆదికాండ నేపథ్యాన్ని ప్రతిబింబిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పురుషునిగాను స్త్రీనిగాను ఆయన వారిని చేశాడు.” ఇది గ్రీకు పదక్రమాన్ని మరింత దగ్గరగా అనుసరిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ δὲ ἀρχῆς κτίσεως
  choice: కాని సృష్టి ఆరంభం నుండి
  rationale: ἀπό కాలంలోని ఆరంభ బిందువును సూచిస్తుంది; δέ ముందు చెప్పిన విడాకుల అనుమతికి విరుద్ధతను చూపుతుంది. ఈ తెలుగు రూపం ‘సృష్టి ఆరంభం నుండి’ అనే సంబంధాన్ని సహజంగా ఉంచుతుంది.
- source_word: ἄρσεν καὶ θῆλυ
  choice: పురుషునిగాను స్త్రీనిగాను
  rationale: ఆదికాండపు సృష్టి ఉల్లేఖనంలోని మగ–ఆడ జతను గౌరవప్రదమైన, సాధారణ ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; సామాజిక పాత్రలపై అదనపు వివరణను చేర్చదు.
- source_word: ἐποίησεν
  choice: చేశాడు
  rationale: ποιέω యొక్క ప్రత్యక్ష అర్థం ‘చేయడం/తయారు చేయడం.’ ఆదికాండ నేపథ్యాన్ని బట్టి ‘సృష్టించాడు’ సాధ్యమైనా, మూలపదానికి పారదర్శకంగా ఉండేందుకు ‘చేశాడు’ ఎంచుకున్నాం.
- source_word: αὐτούς
  choice: వారిని
  rationale: ఈ బహువచన సర్వనామం పురుషుడు–స్త్రీగా ఉన్న మానవ జతను సూచిస్తుంది. ‘వారిద్దరినీ’ అనడం మూలంలో స్పష్టంగా లేని అదనపు ఉద్ఘాటనను చేర్చుతుంది.
theological_decisions:
- issue: ఆదికాండ ఉల్లేఖనంలోని లింగ పదాల అనువాదం
  choice: పురుషునిగాను స్త్రీనిగాను
  alternative: మగవానిగాను ఆడదానిగాను
  rationale: మూలంలోని ἄρσεν–θῆλυ జతను నిలుపుతూ, మనుషుల గురించి ఆధునిక తెలుగులో గౌరవప్రదంగా వినిపించే పదాలను ఉపయోగించాం. సంబంధపాత్రల గురించిన భావాన్ని అదనంగా చేర్చలేదు.
- issue: క్రియకు అంతర్నిహితమైన దైవిక కర్త
  choice: ఆయన వారిని ... చేశాడు
  alternative: దేవుడు వారిని ... చేశాడు
  rationale: గ్రీకులో కర్త పేరు ప్రత్యక్షంగా లేదు; ఏకవచన క్రియ ద్వారా సందర్భంలో అర్థమవుతుంది. ‘ఆయన’ అని ఉంచడం స్పష్టతనిస్తూనే, ఈ వచనంలో లేని ‘దేవుడు’ అనే నామాన్ని చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘కాని’ సందర్భంలోని వ్యత్యాసాన్ని నిలుపుతుంది; ‘ఆయన’ మూలంలోని అంతర్నిహిత కర్తను అతివివరణ లేకుండా వ్యక్తపరుస్తుంది.
