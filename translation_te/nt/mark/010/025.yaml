id: MRK.10.25
reference: Mark 10:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸂τῆς τρυμαλιᾶς τῆς⸃ ῥαφίδος ⸀διελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/025.yaml
  text: It is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God[a][b][c].
translation:
  language: te
  text: ఒంటె సూది కన్నులోంచి వెళ్లడం దేవుని రాజ్యంలోకి ధనవంతుడు ప్రవేశించడం కంటే సులభం[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, ‘సూది కన్ను గుండా.’
    reason: lexical_alternative
  - marker: b
    text: కొందరు ‘ఒంటె’కు బదులుగా ‘తాడు’ అని ప్రతిపాదించారు; అయితే ఇక్కడి గ్రీకు పాఠంలో ‘ఒంటె’ అని ఉంది.
    reason: alternative_reading
  - marker: c
    text: ‘ధనవంతుడు’ గ్రీకులోని పుంలింగ ఏకవచన రూపాన్ని ప్రతిబింబిస్తుంది; ఈ సూక్తిలో అది ప్రతినిధి భావంతో వాడబడింది.
    reason: cultural_note
lexical_decisions:
- source_word: εὐκοπώτερόν
  choice: సులభం
  rationale: తులనాత్మక భావం ‘మరింత సులభం’ అని ఉన్నప్పటికీ, ‘కంటే ... సులభం’ అనే సహజ తెలుగు నిర్మాణం ఆ పోలికను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: κάμηλον
  choice: ఒంటె
  rationale: మూలపాఠంలోని κάμηλος అనే పదానికి ప్రత్యక్ష అర్థం ‘ఒంటె’; అసాధ్యతను బలంగా చూపే అతిశయోక్తి చిత్రాన్ని ఇది నిలుపుతుంది.
- source_word: διὰ τῆς τρυμαλιᾶς τῆς ῥαφίδος
  choice: సూది బెజ్జం గుండా
  rationale: ఇది కుట్టు సూదిలోని రంధ్రాన్ని సూచిస్తుంది. ‘సూది బెజ్జం’ సహజమైన, స్పష్టమైన తెలుగు ప్రయోగం.
- source_word: διελθεῖν
  choice: వెళ్లడం
  rationale: ‘గుండా’తో కలిపి ‘వెళ్లడం’ అనడం διέρχομαι లోని ‘గుండా వెళ్లడం’ అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: πλούσιον
  choice: ధనవంతుడు
  rationale: గ్రీకులో ఇది పుంలింగ ఏకవచన విశేషణం నామవాచకంగా వాడబడింది. తెలుగు పదం మూలరూపాన్ని నిలుపుతూ ప్రతినిధి భావాన్నీ అనుమతిస్తుంది.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: దేవుని రాజ్యంలో
  rationale: ‘దేవుని రాజ్యం’ సువార్తల్లోని ప్రధాన పదబంధానికి సుపరిచితమైన, అర్థవంతమైన తెలుగు రూపం; ప్రవేశించడం అనే క్రియతో ‘రాజ్యంలో’ సహజంగా సరిపోతుంది.
- source_word: εἰσελθεῖν
  choice: ప్రవేశించడం
  rationale: εἰσέρχομαι అనే క్రియలోని ‘లోపలికి ప్రవేశించు’ భావాన్ని సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ఒంటె–సూది బెజ్జం చిత్రానికి వ్యాఖ్యానం
  choice: చిన్న ద్వారం అనే వివరణను చేర్చకుండా, ఒంటె మరియు సూది బెజ్జం అనే మూలపాఠంలోని అతిశయోక్తి చిత్రాన్ని యథాతథంగా ఉంచడం.
  alternative: యెరూషలేములో ‘సూది బెజ్జం’ అనే చిన్న ద్వారం ఉందని భావించడం; లేదా ‘ఒంటె’ స్థానంలో ‘తాడు’ అని చదవడం.
  rationale: గ్రీకు మూలపాఠం ఉద్దేశపూర్వకంగా తీవ్రమైన అసాధ్యతా చిత్రాన్ని ఇస్తుంది. తరువాతి వివరణలను అనువాదంలోకి తెచ్చి ఆ వాక్యపు తీవ్రతను తగ్గించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘కంటే ... సులభం’ పోలికను స్పష్టంగా ఉంచుతుంది. ‘సూది బెజ్జం’ సాధారణ పాఠకులకు అర్థమయ్యే స్థిర ప్రయోగం; మూలంలోని అతిశయోక్తి, theological tension రెండూ తగ్గించకుండా నిలుపబడ్డాయి.
