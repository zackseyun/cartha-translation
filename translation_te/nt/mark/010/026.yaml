  source_fidelity: The translation accurately conveys the participants, their intensified astonishment (περισσῶς ἐξεπλήσσοντο), their reciprocal discussion (πρὸς ἑαυτούς), the inferential force of «అయితే» for Καὶ in context, and the rhetorical question about the possibility of salvation. «రక్షించబడగలరు» appropriately preserves the passive salvation language of σωθῆναι without supplying an unstated agent.
