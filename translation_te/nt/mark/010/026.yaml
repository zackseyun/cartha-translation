  text: οἱ δὲ περισσῶς ἐξεπλήσσοντο λέγοντες πρὸς ⸀ἑαυτούς· Καὶ τίς δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/026.yaml
  text: And they were exceedingly astonished[a], saying to one another, “Then who can be saved?”
translation:
  language: te
  text: వారు మరింతగా విస్తుపోయి, “అయితే ఎవరు రక్షించబడగలరు?” అని ఒకరితో ఒకరు[a] చెప్పుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తమలో తాము’; మరింత అక్షరార్థంగా, ‘తమతో తాము.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: వారు
  rationale: మునుపటి సందర్భంలోని శిష్యులను సూచిస్తుంది. తెలుగులో సహజమైన కొనసాగింపుకోసం ప్రత్యేకంగా ‘అయితే’ లేదా ‘కాని’ చేర్చకుండా ‘వారు’ అని అనువదించాం.
- source_word: περισσῶς
  choice: మరింతగా
  rationale: మునుపటి ఆశ్చర్యం కంటే వారి విస్మయం పెరిగిందనే సందర్భానుగుణ తీవ్రతను తెలియజేస్తుంది; ‘అత్యంతగా’ అనే అర్థం కూడా సాధ్యమే.
- source_word: ἐξεπλήσσοντο
  choice: విస్తుపోయి
  rationale: తీవ్రమైన ఆశ్చర్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది. గ్రీకు అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న ప్రతిస్పందనను వాక్య నిర్మాణం సందర్భానుగుణంగా తెలియజేస్తుంది.
- source_word: λέγοντες
  choice: చెప్పుకున్నారు
  rationale: ప్రధాన క్రియతో సమకాలంలో జరిగిన వారి మాటలను తెలుగులో సహజంగా కలుపుతుంది.
- source_word: πρὸς ἑαυτούς
  choice: ఒకరితో ఒకరు
  rationale: బహువచన సంభాషణ సందర్భంలో పరస్పరార్థాన్ని స్పష్టంగా తెలియజేస్తుంది; అక్షరార్థానికి దగ్గరగా ‘తమలో తాము’ అని కూడా అనువదించవచ్చు.
- source_word: Καὶ
  choice: అయితే
  rationale: ఇక్కడ καί యేసు మాటలనుంచి వారు తీసుకున్న పర్యవసానాన్ని ప్రశ్నగా ప్రవేశపెడుతుంది.
- source_word: τίς δύναται σωθῆναι
  choice: ఎవరు రక్షించబడగలరు?
  rationale: సామర్థ్యం లేదా సాధ్యతను అడిగే ప్రశ్ననూ, σωθῆναι లోని దైవిక రక్షణకు సంబంధించిన నిష్క్రియార్థాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: సందర్భంలో σωθῆναι అనే రక్షణ భాష యొక్క భావం
  choice: రక్షించబడగలరు
  alternative: విడిపించబడగలరు; కాపాడబడగలరు
  rationale: చుట్టుపక్కల వచనాలు దేవుని రాజ్యంలో ప్రవేశించడం గురించి మాట్లాడుతున్నందున, ఇది కేవలం తాత్కాలిక ప్రమాదం నుంచి తప్పించుకోవడం కాక దేవుని రక్షణను సూచిస్తుంది. నిష్క్రియ రూపాన్ని ఉంచడం రక్షించేవారు ఎవరో ఈ వచనంలో స్వయంగా చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా వచనంలోని గంభీరతను నిలుపుతూ అనువదించాం. ‘రక్షించబడగలరు’ ద్వారా రక్షణకు సంబంధించిన ధార్మిక బరువును, నిష్క్రియ నిర్మాణాన్ని కాపాడాం.
