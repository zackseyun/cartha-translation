  terminology: «రక్షించబడగలరు» is the appropriate established Telugu salvation expression in this kingdom-of-God context. «విస్తుపోయి» is a natural strong expression for the disciples’ amazement. The footnote correctly preserves the viable, more literal alternatives for πρὸς ἑαυτούς.
