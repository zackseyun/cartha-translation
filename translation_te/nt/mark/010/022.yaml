  yaml_path: translation/nt/mark/010/022.yaml
  text: But he[a], becoming gloomy at the word, went away grieving[c][b], for he had many possessions.
translation:
  language: te
  text: అయితే అతడు ఆ మాట విని ముఖం మాడ్చుకొని[a], దుఃఖిస్తూ వెళ్లిపోయాడు; ఎందుకంటే అతనికి చాలా ఆస్తిపాస్తులు ఉండేవి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దిగులుపడ్డాడు’; గ్రీకు పదం ముఖంలో స్పష్టంగా కనిపించిన మ్లానతను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఎంతో ఆస్తి’ లేదా ‘చాలా ఆస్తులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: στυγνάσας
  choice: ముఖం మాడ్చుకొని
  rationale: ఈ పదం అతని అంతరంగ దుఃఖంతోపాటు ముఖంలో కనిపించిన దిగులును సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండే ఈ ప్రయోగం దృశ్యభావాన్ని నిలుపుతుంది.
- source_word: ἐπὶ τῷ λόγῳ
  choice: ఆ మాట విని
  rationale: ఈ పదబంధం అతని ప్రతిస్పందనకు ఆ మాట సందర్భం లేదా కారణమని తెలుపుతుంది. తెలుగులో ‘ఆ మాట విని’ సహజంగా ఉండి, λόγος యొక్క ఏకవచన భావాన్ని కాపాడుతుంది.
- source_word: ἀπῆλθεν
  choice: వెళ్లిపోయాడు
  rationale: కథనంలోని అతని నిష్క్రమణను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: λυπούμενος
  choice: దుఃఖిస్తూ
  rationale: అతడు వెళ్లిపోతున్నప్పుడు కొనసాగుతున్న దుఃఖాన్ని వర్తమాన కృదంత భావానికి అనుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: κτήματα πολλά
  choice: చాలా ఆస్తిపాస్తులు
  rationale: κτήματα భూములు సహా ఆస్తులు లేదా సంపదలను సూచించగలదు; ‘ఆస్తిపాస్తులు’ సాధారణ తెలుగులో విస్తృతమైన స్వాస్థ్య భావాన్ని ఇస్తుంది, πολλάను ‘చాలా’ ప్రతిబింబిస్తుంది.
- source_word: ἦν γὰρ ἔχων
  choice: ఎందుకంటే అతనికి ... ఉండేవి
  rationale: కొనసాగుతున్న స్వాధీన స్థితిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; γάρ ఇచ్చే కారణ సంబంధాన్ని ‘ఎందుకంటే’ స్పష్టంగా చూపిస్తుంది.
theological_decisions:
- issue: యేసు మాటకు ఆ మనిషి చూపిన భావోద్వేగ ప్రతిస్పందన స్వభావం
  choice: ముఖంలో కనిపించిన దిగులును, కొనసాగుతున్న దుఃఖాన్ని మాత్రమే వర్ణించడం
  alternative: అతడు కోపగించుకున్నాడని లేదా తిరుగుబాటు చేశాడని స్పష్టీకరించడం
  rationale: గ్రీకు పాఠం కనిపించే మ్లానతను, దుఃఖాన్ని చెబుతుంది; కోపం లేదా ఉద్దేశపూర్వక తిరుగుబాటును స్పష్టంగా చెప్పదు. అందువల్ల అదనపు నైతిక తీర్పు చేర్చకుండా కథనంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ముఖం మాడ్చుకొని’ దృశ్యభావాన్ని అందుబాటులో ఉంచుతుంది; ‘ఆస్తిపాస్తులు’ విస్తృతమైన స్వాస్థ్య భావాన్ని ఇస్తుంది. ప్రధాన పాఠంలోని ప్రతి పాదసూచిక గుర్తుకు అనుగుణమైన పాదసూచిక ఇవ్వబడింది.
