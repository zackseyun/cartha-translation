id: MRK.10.48
reference: Mark 10:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐπετίμων αὐτῷ πολλοὶ ἵνα σιωπήσῃ· ὁ δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/048.yaml
  text: And many were rebuking him so that he would be silent[a], but he was crying out all the more, “Son of David, have mercy on me!”
translation:
  language: te
  text: అతడు మౌనంగా ఉండాలని చాలామంది అతణ్ణి గద్దిస్తూ ఉన్నారు. కాని అతడు మరింతగా, “దావీదు కుమారుడా[a], నన్ను కరుణించు!” అని కేకలు వేస్తూనే ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దావీదు కుమారుడు” అనేది రాజ-మెస్సీయ బిరుదు. భావాన్ని “మెస్సీయా” అని కూడా వ్యక్తం చేయవచ్చు; అయితే ఇక్కడ గ్రీకు పదప్రయోగమే నిలుపబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμων
  choice: గద్దిస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న లేదా పదేపదే జరుగుతున్న గద్దింపును సూచిస్తుంది; ‘గద్దించు’ మూలపదంలోని తీవ్రతను నిలుపుతుంది.
- source_word: πολλοὶ
  choice: చాలామంది
  rationale: గ్రీకులో విశేషణం నామవాచకంగా వాడబడింది; ‘జనసమూహం’ అని లేని నిర్దిష్టతను చేర్చకుండా నేరుగా అనువదిస్తుంది.
- source_word: ἵνα σιωπήσῃ
  choice: అతడు మౌనంగా ఉండాలని
  rationale: గద్దించడం వెనుక ఉన్న ఉద్దేశాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πολλῷ μᾶλλον
  choice: ఇంకా ఎక్కువగా
  rationale: తులనాత్మక గ్రీకు నుడికారాన్ని నిలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘మరింత బిగ్గరగా’ అనే భావాన్ని చేర్చదు.
- source_word: ἔκραζεν
  choice: కేకలు వేస్తూనే ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాలం సూచించే నిరంతర చర్యను, κράζωలోని అత్యవసరమైన బిగ్గర పిలుపును తెలుపుతుంది.
- source_word: Υἱὲ Δαυίδ
  choice: దావీదు కుమారుడా
  rationale: రాజవంశీయ-మెస్సీయ సంబంధమున్న సంబోధనను వ్యాఖ్యానంగా మార్చకుండా మూలంలోని రూపంలోనే నిలుపుతుంది.
- source_word: ἐλέησόν με
  choice: నన్ను కరుణించు
  rationale: విన్నప రూపంలోని ఆజ్ఞార్థక క్రియను సహజంగా, దాని బలాన్ని నిలుపుతూ వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘దావీదు కుమారుడు’ అనే సంబోధనలోని మెస్సీయ ప్రాముఖ్యత
  choice: ‘దావీదు కుమారుడా’ అనే బిరుదును యథాతథంగా నిలుపడం
  alternative: ‘మెస్సీయా’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: గ్రీకు పాఠం Υἱὲ Δαυίδ అనే బిరుదునే నేరుగా ఉపయోగిస్తుంది. దాని అర్థాన్ని ముందుగానే పరిష్కరించకుండా, రాజవంశీయ మరియు మెస్సీయ ప్రతిధ్వనులను పాఠకుడు గ్రహించేలా మూలపదాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. కొనసాగుతున్న చర్యను ‘గద్దిస్తూ ఉన్నారు,’ ‘కేకలు వేస్తూనే ఉన్నాడు’ అనే రూపాలతో తెలిపింది.
