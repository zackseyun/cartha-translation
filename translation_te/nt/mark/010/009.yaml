  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/009.yaml
  text: Therefore[a], what God has joined together, man must not separate.
translation:
  language: te
  text: కాబట్టి దేవుడు జతపరచినదాన్ని ఏ మనిషీ[a] వేరు చేయకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో ‘మనిషి’ అనే ఏకవచన పదం సాధారణార్థంలో వాడబడింది; భావం ‘ఏ మానవుడూ’ లేదా ‘ఎవరూ’ అని.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: జతపరచినదాన్ని
  rationale: నపుంసక ఏకవచన సంబంధసర్వనామం ముందుగా చెప్పిన వివాహ ఐక్యతను సమష్టిగా సూచిస్తుంది. తెలుగులో సంబంధక్రియతో కూడిన ‘దాన్ని’ సహజంగా ఉండి, ‘ఎవరిని’ అని వ్యక్తుల వైపు అర్థాన్ని మార్చదు.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందున్న సృష్టి ఉద్దేశాన్ని ఆధారంగా చేసుకొని తీసుకునే నిర్ధారణను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὁ θεὸς
  choice: దేవుడు
  rationale: వాక్యంలోని కర్తను ఆధునిక ప్రామాణిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: συνέζευξεν
  choice: జతపరచిన
  rationale: συζεύγνυμι లోని కలిపి ఒక జతగా చేయడం అనే భావాన్ని సహజంగా అందిస్తుంది; ‘కాడికి కట్టిన’ వంటి అతి అక్షరార్థ రూపకం ఇక్కడ అసహజంగా ఉంటుంది.
- source_word: ἄνθρωπος
  choice: ఏ మనిషీ
  rationale: గ్రీకులోని ఏకవచన సాధారణ మానవ సూచనను తెలుగులో సహజమైన నిషేధ వాక్య నిర్మాణంతో అందిస్తుంది. ఇది పురుషులకు మాత్రమే పరిమితమైన అర్థం రాకుండా ‘ఏ మానవుడూ’ అనే వ్యాప్తిని నిలుపుతుంది.
- source_word: μὴ χωριζέτω
  choice: వేరు చేయకూడదు
  rationale: μή తో ఉన్న వర్తమాన ఆజ్ఞార్థక క్రియలోని నిషేధ బలాన్ని ప్రస్తుత తెలుగులో స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
theological_decisions:
- issue: వివాహ వాక్యంలో ἄνθρωπος యొక్క సాధారణ మానవార్థం
  choice: ప్రధాన పాఠ్యంలో ‘ఏ మనిషీ’ అని అనువదించడం
  alternative: ‘మనిషి’ లేదా ‘ఏ మానవుడూ’
  rationale: ἄνθρωπος ఇక్కడ ఒక పురుషుణ్ణి మాత్రమే కాక సాధారణంగా ఏ మనిషినైనా సూచిస్తుంది. ‘ఏ మనిషీ’ మూలంలోని ఏకవచనాన్ని, విశ్వవ్యాప్త నిషేధాన్ని రెండింటినీ సహజ తెలుగులో నిలుపుతుంది.
- issue: ὃ సూచించే దాని స్వభావం
  choice: ‘జతపరచినదాన్ని’ అని, వివాహ ఐక్యతను సమష్టిగా సూచించడం
  alternative: ‘జతపరచిన వారిని’
  rationale: మూలంలో నపుంసక ఏకవచనం ఉండటం వల్ల దృష్టి ఇద్దరు వ్యక్తులపై మాత్రమే కాక దేవుడు కలిగించిన ఐక్యతపై ఉంది. అందువల్ల వ్యక్తివాచక బహువచనంగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘కాబట్టి’ తార్కిక అనుసంధానాన్ని, ‘వేరు చేయకూడదు’ ఆజ్ఞాత్మక నిషేధాన్ని సహజంగా వ్యక్తపరుస్తాయి.
