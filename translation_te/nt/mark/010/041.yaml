  text: Καὶ ἀκούσαντες οἱ δέκα ἤρξαντο ἀγανακτεῖν περὶ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/041.yaml
  text: And when the ten heard it[a], they began to be indignant with James and John.
translation:
  language: te
  text: ఆ మాట విన్నప్పుడు, ఆ పదిమంది యాకోబు, యోహానుల మీద[a] ఆగ్రహపడడం మొదలుపెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యాకోబు, యోహానుల గురించి’ లేదా ‘యాకోబు, యోహానుల కారణంగా.’ గ్రీకు విభక్త్యవ్యయం వారి ఆగ్రహానికి లక్ష్యాన్ని గానీ సందర్భం/కారణాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: ఆ మాట విన్నప్పుడు
  rationale: గ్రీకు సంధాయకమైన Καὶ కథన ప్రవాహాన్ని కొనసాగిస్తుంది. తెలుగులో కాలార్థక ఉపవాక్యంతో సహజంగా కలిపినప్పుడు ప్రత్యేకంగా ‘మరియు’ అనడం అవసరం లేదు.
- source_word: ἀκούσαντες
  choice: ఆ మాట విన్నప్పుడు
  rationale: ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచించే aorist participle. సందర్భంలో ముందటి సంభాషణే వినబడిన విషయం కాబట్టి ‘ఆ మాట’ను సహజంగా పూరించాం.
- source_word: οἱ δέκα
  choice: ఆ పదిమంది
  rationale: మూలంలో అక్షరార్థంగా ‘ఆ పది మంది’ మాత్రమే ఉంది; ‘మిగతా శిష్యులు’ అని స్పష్టీకరించకుండా మూలంలోని సంక్షిప్తతను నిలిపాం.
- source_word: ἤρξαντο
  choice: మొదలుపెట్టారు
  rationale: ప్రతిస్పందన ఆరంభాన్ని తెలిపే ingressive భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ἀγανακτεῖν
  choice: ఆగ్రహపడడం
  rationale: తీవ్రమైన అసంతృప్తి, అభ్యంతరంతో కూడిన కోపం అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: περὶ Ἰακώβου καὶ Ἰωάννου
  choice: యాకోబు, యోహానుల మీద
  rationale: భావోద్వేగ ప్రతిస్పందనకు లక్ష్యంగా వారిని సూచించే సహజ తెలుగు ప్రయోగం. περί వారిని ఆగ్రహానికి విషయంగా లేదా కారణంగా కూడా సూచించగలదనే అర్థవిస్తృతిని పాదటిప్పణిలో ఉంచాం.
- source_word: Ἰακώβου
  choice: యాకోబు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: Ἰωάννου
  choice: యోహాను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
