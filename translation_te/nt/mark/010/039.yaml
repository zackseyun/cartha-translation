source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν αὐτῷ· Δυνάμεθα. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· ⸀Τὸ ποτήριον ὃ ἐγὼ πίνω πίεσθε καὶ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθήσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/039.yaml
  text: And they said to him[a], “We are able.” But Jesus said to them, “The cup that I drink, you will drink; and the baptism with which I am baptized[b], you will be baptized,”
translation:
  language: te
  text: 'వారు ఆయనతో, “మేము చేయగలం[a]” అన్నారు. అప్పుడు యేసు వారితో ఇలా అన్నాడు: “నేను తాగే గిన్నెలోనిది మీరు కూడా తాగుతారు; నేను పొందుతున్న బాప్తిస్మాన్ని మీరు కూడా పొందుతారు.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మాకు సాధ్యమే.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “గిన్నె,” “బాప్తిస్మం” అనేవి యేసు త్వరలో అనుభవించబోయే శ్రమను, ఆయనకు నిర్ణయించబడిన గమ్యాన్ని సూచించే రూపకాలు; ఆయన శిష్యులు కూడా వాటిలో పాలుపంచుకుంటారు.
    reason: cross_reference
lexical_decisions:
- source_word: Δυνάμεθα
  choice: మేము చేయగలం
  rationale: సందర్భంలో విడిగా ఉన్న δύναμαι రూపాన్ని సహజమైన ఆధునిక తెలుగులో సామర్థ్యాన్ని తెలిపే విధంగా అనువదించాం. గంభీరతను కొంత ఎక్కువగా వ్యక్తం చేసే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: ποτήριον
  choice: గిన్నె
  rationale: యేసుకు నిర్ణయించబడిన అనుభవాన్ని, ముఖ్యంగా శ్రమను సూచించే మూలభాష రూపకాన్ని వివరణగా మార్చకుండా నిలిపాం. తెలుగులో తాగేది పాత్ర కాదు, దానిలోనిదే కాబట్టి ‘గిన్నెలోనిది’ అనే సహజ ప్రయోగాన్ని వాడాం.
- source_word: πίνω / πίεσθε
  choice: నేను తాగే / మీరు తాగుతారు
  rationale: వర్తమాన–భవిష్యత్ సమాంతరతను సహజమైన తెలుగు క్రియారూపాలతో నిలిపి, గిన్నె రూపకాన్ని అలాగే ఉంచాం.
- source_word: βάπτισμα
  choice: బాప్తిస్మం
  rationale: మూలంలోని బాప్తిస్మ రూపకాన్ని నిలిపాం; ‘ముంచివేత’ లేదా ‘శ్రమ’ అని వివరణాత్మకంగా మార్చలేదు.
- source_word: βαπτίζομαι / βαπτισθήσεσθε
  choice: నేను పొందే / మీరూ పొందుతారు
  rationale: తెలుగులో ‘బాప్తిస్మం పొందడం’ ప్రామాణికమైన, సహజమైన ప్రయోగం. ‘మీరూ’ ద్వారా యేసు అనుభవంలో శిష్యుల భాగస్వామ్యాన్ని, మూలంలోని భవిష్యత్ భావాన్ని స్పష్టంగా వ్యక్తం చేశాం.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: అయితే యేసు వారితో
  rationale: δέ సూచించే స్వల్ప వ్యత్యాసాన్ని ‘అయితే’తో తెలిపాం; అది శిష్యుల ధీమాతో కూడిన జవాబుకు యేసు ఇచ్చే ప్రతిస్పందనను కలుపుతుంది.
theological_decisions:
- issue: గిన్నె, బాప్తిస్మం అనే రూపకాల అర్థం
  choice: ప్రధాన వాక్యంలో రెండు రూపకాలనూ యథాతథంగా నిలిపి, వాటి సందర్భార్థాన్ని పాదటిప్పణిలో సూచించాం.
  alternative: ప్రధాన వాక్యంలోనే వాటిని ‘శ్రమ’, ‘మరణం’ లేదా ‘హింస’ అని అనువదించడం.
  rationale: మూలపాఠం వివరణాత్మక పదాలను కాక, విస్తృతమైన బైబిలీయ భావభారం గల రూపకాలను ఉపయోగిస్తుంది. వాటిని నేరుగా వ్యాఖ్యానంగా మార్చడం పాఠంలోని అర్థవిస్తృతిని తగ్గిస్తుంది.
- issue: బాప్తిస్మం అనే పదానికి ఆచారసంబంధమైన అర్థం ఉందా?
  choice: βάπτισμαను ‘బాప్తిస్మం’గానే అనువదించి, ఈ సందర్భంలో అది యేసు ఎదుర్కోబోయే శ్రమను రూపకంగా సూచిస్తుందని పాదటిప్పణిలో తెలిపాం.
  alternative: ఆచార బాప్తిస్మంతో గందరగోళం రాకుండా ‘ముంచివేసే శ్రమ’ లేదా ‘తీవ్ర పరీక్ష’ అని అనువదించడం.
  rationale: గ్రీకు పదరూపాన్ని నిలపడం మూలానికి నమ్మకంగా ఉంటుంది; అదే సమయంలో తక్షణ సందర్భం దాని రూపకార్థాన్ని తెలియజేస్తుంది. అనువాదం ఏదైనా ప్రత్యేక సాక్రమెంటల్ సిద్ధాంతాన్ని పాఠంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలిని వాడాం. ‘చేయగలం’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది; ‘గిన్నెలోనిది’ తెలుగు నుడికారానికి అనుగుణంగా ఉండి మూల రూపకాన్ని కాపాడుతుంది. ‘బాప్తిస్మం పొందడం’ సంఘపరమైన ప్రత్యేక వ్యాఖ్యానం లేకుండా స్థిరపడిన తెలుగు ప్రయోగం.
