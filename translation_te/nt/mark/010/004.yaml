  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· ⸂Ἐπέτρεψεν Μωϋσῆς⸃ βιβλίον ἀποστασίου γράψαι καὶ ἀπολῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/004.yaml
  text: They said[b][a], “Moses permitted us to write a certificate of divorce and send her away.”
translation:
  language: te
  text: వారు, “విడాకుల పత్రం రాసి, ఆమెను పంపివేయడానికి[a] మోషే అనుమతించాడు” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆమెకు విడాకులివ్వడానికి.’ అక్షరార్థంగా, ‘ఆమెను పంపివేయడానికి’; ఇక్కడ ఇది విడాకుల సందర్భంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: వారు … అన్నారు
  rationale: ముందు ప్రస్తావించబడిన పరిసయ్యుల జవాబును సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది. δέ లోని కొనసాగింపు లేదా స్వల్ప వ్యత్యాసాన్ని సందర్భమే తెలియజేస్తుంది.
- source_word: Ἐπέτρεψεν
  choice: అనుమతించాడు
  rationale: ἐπιτρέπω అంటే అనుమతించడం. తరువాతి సందర్భంలో ‘ఆజ్ఞ’తో ఉన్న వ్యత్యాసాన్ని ఇది స్పష్టంగా కాపాడుతుంది.
- source_word: Μωϋσῆς
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: βιβλίον ἀποστασίου
  choice: విడాకుల పత్రం
  rationale: ద్వితీయోపదేశకాండము 24:1లో సూచించిన చట్టబద్ధమైన లిఖితపూర్వక విడాకుల పత్రాన్ని స్పష్టంగా, సంక్షిప్తంగా సూచిస్తుంది.
- source_word: γράψαι
  choice: రాసి
  rationale: γράφω యొక్క సాధారణ అర్థమైన ‘రాయడం’ను కాపాడుతూ, తరువాతి సమన్విత క్రియతో సహజమైన తెలుగు నిర్మాణాన్ని ఇస్తుంది.
- source_word: καὶ ἀπολῦσαι
  choice: ఆమెను పంపివేయడానికి
  rationale: వివాహ సందర్భంలో ἀπολύω విడాకులిచ్చి పంపివేయడాన్ని సూచిస్తుంది. ‘పంపివేయడం’ మూలపద చిత్రాన్ని కాపాడుతుంది; ‘ఆమెను’ అనే కర్మ గ్రీకులో వ్యక్తంగా లేకపోయినా సందర్భం నుంచి తెలుగులో సహజంగా పూరించబడింది.
theological_decisions:
- issue: విడాకుల ధర్మశాస్త్రంలో మోషే సూచన స్వభావం
  choice: మోషే విడాకులను ఆజ్ఞాపించకుండా అనుమతించాడు
  alternative: మోషే విడాకుల పత్రం రాయమని ఆజ్ఞాపించాడు
  rationale: Ἐπέτρεψεν స్పష్టంగా అనుమతిని సూచిస్తుంది. తరువాతి వచనాల్లో కఠినహృదయం కారణంగా ఇచ్చిన సడలింపుకు, సృష్టిలో దేవుని ఉద్దేశానికి మధ్య యేసు చూపే వ్యత్యాసాన్ని ఈ అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. చట్టపరమైన భావాన్ని ‘విడాకుల పత్రం’ ద్వారా స్పష్టంగా ఉంచి, ἀπολῦσαιలోని ‘పంపివేయడం’ అనే పదచిత్రాన్ని ప్రధాన పాఠంలో నిలిపింది.
