  terminology: ‘మోషే’ తెలుగు బైబిలు వాడుకకు అనుగుణమైన పేరు. ‘విడాకుల పత్రం’ చట్టబద్ధమైన వ్రాతపూర్వక పత్రం అనే అర్థాన్ని తగినంతగా ఇస్తుంది. ప్రధాన పాఠంలోని ‘పంపివేయడానికి’ మూలంలోని ἀπολῦσαι పదచిత్రాన్ని కాపాడగా, పాదసూచికలో ‘విడాకులివ్వడానికి’ అనే సందర్భానుగుణ ప్రత్యామ్నాయం ఇవ్వబడింది.
