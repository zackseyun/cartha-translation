  source_fidelity: మూల గ్రీకులోని Ἐπέτρεψεν (‘అనుమతించాడు’), βιβλίον ἀποστασίου (‘విడాకుల పత్రం’), γράψαι (‘రాసి’), మరియు ἀπολῦσαι (‘ఆమెను పంపివేయడానికి’) భావాలను అనువాదం విశ్వసనీయంగా ప్రతిబింబిస్తుంది. గ్రీకులో సందర్భం ద్వారా గ్రహించబడే స్త్రీ కర్మను ‘ఆమెను’గా తెలుగులో పూరించడం సముచితం. ‘అనుమతించాడు’ అనే పదం ఆజ్ఞ కాదని స్పష్టపరుస్తుంది.
