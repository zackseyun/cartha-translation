source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν αὐτῷ· Δὸς ἡμῖν ἵνα εἷς ⸂σου ἐκ δεξιῶν⸃ καὶ εἷς ἐξ ⸀ἀριστερῶν καθίσωμεν ἐν τῇ δόξῃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/037.yaml
  text: They said to him, “Grant to us that one of us may sit at your right and one at your left in your glory.”
translation:
  language: te
  text: 'వారు ఆయనతో ఇలా అన్నారు: “నీ మహిమలో మాలో ఒకడు నీ కుడివైపున, మరొకడు నీ ఎడమవైపున కూర్చునేలా మాకు అనుగ్రహించు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δὸς ἡμῖν
  choice: మాకు అనుగ్రహించు
  rationale: అభ్యర్థనలోని ‘ఇవ్వు/దయచేయి’ భావాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἷς ... καὶ εἷς
  choice: మాలో ఒకడు ... మరొకడు
  rationale: ఇద్దరు వక్తలు తమలో ఒక్కొక్కరిని ఉద్దేశిస్తున్న సందర్భార్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐκ δεξιῶν ... ἐξ ἀριστερῶν
  choice: నీ కుడివైపున ... నీ ఎడమవైపున
  rationale: గౌరవస్థానాలను సూచించే మూలంలోని స్థలపరమైన భాషను నేరుగా నిలుపుతుంది.
- source_word: ἐν τῇ δόξῃ σου
  choice: నీ మహిమలో
  rationale: δόξα అనే పదంలోని మహిమ భావాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా కాపాడుతుంది.
theological_decisions:
- issue: ‘నీ మహిమలో’ అనేది రాజ్యాధికారం, మహిమగల ప్రత్యక్షత, లేదా భవిష్యత్ స్థితిని సూచించవచ్చు.
  choice: నీ మహిమలో
  alternative: నీవు మహిమలో ఉన్నప్పుడు / నీ మహిమగల రాజ్యంలో
  rationale: మూలంలోని సంక్షిప్తతను, అర్థవిస్తృతిని నిలిపి, దానిని ప్రత్యేకంగా ‘రాజ్యం’గా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వాక్య గౌరవాన్ని నిలుపుతూ అనువదించబడింది. సంభాషణలో ఏకవచన సంబోధన యేసుతో ప్రత్యక్ష మాటకు సహజంగా ఉంది.
