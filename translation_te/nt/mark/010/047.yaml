revisions:
- from: అది నజరేయుడైన యేసు[a] అని అతడు విని, “దావీదు కుమారుడా, యేసూ, నన్ను కనికరించు!” అని బిగ్గరగా కేకలు వేయడం మొదలుపెట్టాడు.
  to: 'అది నజరేయుడైన యేసు అని విన్నప్పుడు, అతడు బిగ్గరగా కేకలు వేస్తూ ఇలా అనసాగాడు: “దావీదు కుమారుడా, యేసూ, నన్ను కరుణించు!”'
  rationale: The revision improves idiomatic Telugu syntax and the flow of the reported cry without changing the source sense. It preserves the source’s epithet “the Nazarene,” the order of address “Son of David, Jesus,” and the imperative plea for mercy. The footnote is retained and lightly edited for grammatical clarity.
