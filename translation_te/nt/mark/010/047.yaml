  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὅτι Ἰησοῦς ὁ ⸀Ναζαρηνός ἐστιν ἤρξατο κράζειν καὶ λέγειν· ⸀Υἱὲ Δαυὶδ Ἰησοῦ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/047.yaml
  text: And when he heard that it was Jesus the Nazarene[a], he began to cry out and say, “Jesus, Son of David, have mercy on me!”
translation:
  language: te
  text: 'అది నజరేయుడైన యేసు అని విన్నప్పుడు, అతడు బిగ్గరగా కేకలు వేస్తూ ఇలా అనసాగాడు: “దావీదు కుమారుడా, యేసూ, నన్ను కరుణించు!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: అని అతడు విని
  rationale: ప్రధాన క్రియకు ముందున్న aorist participleను సహజమైన తెలుగు పూర్వకాలిక క్రియారూపంతో అందించి, విన్న తరువాత కేకలు వేయడం మొదలుపెట్టాడనే క్రమాన్ని నిలుపుతుంది.
- source_word: Ναζαρηνός
  choice: నజరేయుడైన
  rationale: ఇది నజరేతు ప్రాంతానికి చెందినవాడని స్పష్టీకరించే వాక్యభాగం కంటే బిరుదు స్వభావమున్న విశేషణం; అందువల్ల మూలంలోని epithet రూపాన్ని నిలుపుతుంది.
- source_word: ἤρξατο κράζειν καὶ λέγειν
  choice: అని బిగ్గరగా కేకలు వేయడం మొదలుపెట్టాడు
  rationale: ἤρξατο యొక్క ఆరంభ భావాన్ని స్పష్టంగా ఉంచుతుంది. తెలుగు సహజత్వం కోసం κράζειν మరియు λέγεινలను ‘అని ... కేకలు వేయడం’ అనే ఒకే నిర్మాణంలో కలిపినా, పలికిన మాటలూ గట్టిగా చేసిన పిలుపూ రెండూ వ్యక్తమవుతాయి.
- source_word: κράζειν
  choice: బిగ్గరగా కేకలు వేయడం
  rationale: కోపాన్ని తప్పనిసరిగా సూచించకుండా, బర్తిమయి చేసిన గట్టైన అత్యవసర విజ్ఞప్తిని తెలియజేస్తుంది.
- source_word: Υἱὲ Δαυὶδ
  choice: దావీదు కుమారుడా
  rationale: అక్షరార్థ రూపాన్నీ, మార్కు సువార్త సందర్భంలోని రాజవంశీయ-మెస్సీయ సంబంధాన్నీ నిలుపుతుంది.
- source_word: ἐλέησόν με
  choice: నన్ను కనికరించు
  rationale: ఆజ్ఞార్థక విజ్ఞప్తి యొక్క గంభీరతను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: Ἰησοῦ
  choice: యేసూ
  rationale: సంబోధన విభక్తిని తెలుగులో సహజంగా చూపిస్తూ వ్యక్తినామాన్ని ప్రామాణిక రూపంలో ఉంచుతుంది.
theological_decisions:
- issue: ‘దావీదు కుమారుడు’ అనే సంబోధనలోని మెస్సీయ భావం
  choice: ప్రధాన పాఠ్యంలో ‘దావీదు కుమారుడా’ అనే బిరుదును యథాతథంగా ఉంచడం.
  alternative: ‘దావీదు వంశస్థుడా’ అని సాధారణ వంశసంబంధ అర్థంతో అనువదించడం.
  rationale: మార్కు కథనంలో ఈ సంబోధనకు రాజవంశీయ-మెస్సీయ ప్రతిధ్వని ఉంది; దానిని కేవలం వంశవివరణగా కుదించకుండా మూలంలోని రూపాన్నీ ఉద్వేగాన్నీ నిలుపాలి.
- issue: Ναζαρηνός పదరూపం
  choice: ‘నజరేయుడైన’ అనే బిరుదు స్వభావమున్న రూపాన్ని వాడడం.
  alternative: ‘నజరేతుకు చెందిన యేసు’ అని భౌగోళిక వివరణగా అనువదించడం.
  rationale: గ్రీకు పాఠ్యంలో స్పష్టమైన ἀπὸ Ναζαρέτ వంటి ‘నజరేతు నుండి’ నిర్మాణం కాకుండా Ναζαρηνός అనే epithet ఉంది; అందుచేత ప్రధాన పాఠ్యంలో ఆ రూపాన్ని కాపాడి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘యేసూ’ మరియు ‘కుమారుడా’ అనే సంబోధన రూపాలు ప్రత్యక్ష విజ్ఞప్తిని స్పష్టంగా చూపుతాయి. ‘బిగ్గరగా కేకలు వేయడం’ అత్యవసరమైన బహిరంగ పిలుపును తెలియజేస్తుంది; అనవసరంగా కోపభావాన్ని చేర్చదు.
