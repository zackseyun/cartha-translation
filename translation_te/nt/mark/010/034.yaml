id: MRK.10.34
reference: Mark 10:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐμπαίξουσιν αὐτῷ καὶ ⸂ἐμπτύσουσιν αὐτῷ καὶ μαστιγώσουσιν αὐτὸν⸃ καὶ ⸀ἀποκτενοῦσιν, καὶ ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/034.yaml
  text: And they will mock him[a], and spit on him, and flog him, and kill him, and after three days he will rise.
translation:
  language: te
  text: వారు ఆయనను ఎగతాళి చేస్తారు, ఆయన మీద ఉమ్మివేస్తారు, ఆయనను కొరడాలతో కొడతారు, చంపుతారు; మూడు రోజుల తర్వాత[a] ఆయన లేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మూడు రోజుల్లో.’ మార్కు గ్రీకు పాఠంలో ‘మూడు రోజుల తర్వాత’ అని ఉంది; ఇతర వాక్యాలు ఈ సమయాన్ని ‘మూడవ రోజున’ అని పేర్కొంటాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμπαίξουσιν
  choice: ఎగతాళి చేస్తారు
  rationale: ఈ క్రియ అవహేళనతో అపహాస్యం చేయడాన్ని సూచిస్తుంది. ‘ఎగతాళి చేస్తారు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, శత్రుత్వపూరితమైన అవమానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐμπτύσουσιν αὐτῷ
  choice: ఆయన మీద ఉమ్మివేస్తారు
  rationale: ఈ నిర్మాణం ఆయనను అవమానించడానికి ఆయన మీద ఉమ్మివేయడాన్ని సూచిస్తుంది. ‘ఆయన మీద ఉమ్మివేస్తారు’ తెలుగులో సహజమైన, బలమైన వ్యక్తీకరణ.
- source_word: μαστιγώσουσιν
  choice: ఆయనను కొరడాలతో కొడతారు
  rationale: ఈ క్రియ శిక్షగా కొరడాలతో కొట్టడాన్ని సూచిస్తుంది. సాధారణ ఆధునిక పాఠకులకు స్పష్టంగా ఉండేందుకు ‘కొరడాలతో కొడతారు’ అని అనువదించబడింది.
- source_word: ἀποκτενοῦσιν
  choice: చంపుతారు
  rationale: ఈ క్రియ యొక్క సూటి అర్థం ‘చంపడం.’ మూలంలో స్పష్టంగా లేని న్యాయపరమైన లేదా నైతిక ఛాయను చేర్చకుండా సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: మూడు రోజుల తర్వాత
  rationale: కర్మవిభక్తితో వచ్చిన μετά సాధారణంగా ‘తర్వాత’ అనే అర్థాన్ని ఇస్తుంది. సమాంతర వాక్యాల్లోని ‘మూడవ రోజున’ అనే రూపంతో సమన్వయం చేయకుండా మార్కు వాడిన మాటను నేరుగా ప్రతిబింబిస్తుంది.
- source_word: ἀναστήσεται
  choice: ఆయన లేస్తాడు
  rationale: భవిష్యత్ మధ్యమ రూపం ఇక్కడ అకర్మకంగా ‘లేస్తాడు’ అని సహజంగా అనువదించవచ్చు. మూలంలో లేని ‘తిరిగి’ అనే పదాన్ని చేర్చలేదు; కర్మణి భావాన్ని కూడా బలవంతంగా ప్రవేశపెట్టలేదు.
theological_decisions:
- issue: పునరుత్థానాన్ని తెలిపే క్రియారూపం
  choice: ఆయన లేస్తాడు
  alternative: ఆయన లేపబడతాడు; ఆయన తిరిగి లేస్తాడు
  rationale: ἀναστήσεται అనే భవిష్యత్ మధ్యమ రూపం అకర్మకమైన ‘ఆయన లేస్తాడు’ అనే అనువాదానికి మద్దతిస్తుంది. దేవుడు యేసును లేపాడని చెప్పే ఇతర నూతన నిబంధన వాక్యాలతో దీనిని బలవంతంగా సమన్వయం చేయలేదు. అలాగే గ్రీకులో స్పష్టంగా లేని ‘తిరిగి’ అనే భావాన్ని చేర్చలేదు.
- issue: పునరుత్థాన సమయ సూచన
  choice: మూడు రోజుల తర్వాత
  alternative: మూడు రోజుల్లో; మూడవ రోజున
  rationale: మార్కు గ్రీకు పాఠంలో ఉన్న μετὰ τρεῖς ἡμέρας ను నేరుగా అనుసరించి ‘మూడు రోజుల తర్వాత’ అని ఉంచబడింది. ఇతర వాక్యాల్లోని ‘మూడవ రోజున’ అనే మాటతో మౌనంగా సమన్వయం చేయకుండా మూలంలోని వ్యక్తీకరణను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. గ్రీకులో పునరావృతమయ్యే καί క్రమాన్ని తెలుగులో సహజమైన వరుస క్రియలతో ప్రతిబింబించాం. గౌరవసూచకంగా ‘ఆయన’ వాడబడింది.
