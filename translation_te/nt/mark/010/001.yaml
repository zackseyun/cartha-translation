id: MRK.10.1
reference: Mark 10:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐκεῖθεν ἀναστὰς ἔρχεται εἰς τὰ ὅρια τῆς Ἰουδαίας ⸀καὶ πέραν τοῦ Ἰορδάνου, καὶ συμπορεύονται πάλιν ὄχλοι πρὸς αὐτόν, καὶ ὡς εἰώθει πάλιν ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/001.yaml
  text: And from there[a], rising, he comes into the region of Judea and beyond the Jordan, and crowds gather to him again, and as was his custom[b], he again taught them.
translation:
  language: te
  text: ఆయన అక్కడి నుండి బయలుదేరి, యూదయ ప్రాంతానికి, యొర్దాను అవతలి ప్రాంతానికి[a][b] వచ్చాడు. జనసమూహాలు మళ్లీ ఆయన దగ్గరికి చేరాయి. ఆయన తన అలవాటు ప్రకారం మళ్లీ వారికి బోధించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యొర్దాను దాటి ఉన్న ప్రాంతానికి.” గ్రీకు పదబంధం యొర్దాను నదికి అవతలివైపున ఉన్న ప్రాంతాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ఈ మాటలను “యూదయ ప్రాంతానికి, యొర్దాను అవతలి ప్రాంతానికి” అని రెండు ప్రాంతాలుగానీ, “యొర్దాను అవతల ఉన్న యూదయ ప్రాంతానికి” అని ఒకే ప్రాంతంగానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκεῖθεν
  choice: అక్కడి నుండి
  rationale: మునుపటి స్థలం నుండి బయలుదేరడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀναστὰς
  choice: బయలుదేరి
  rationale: ఈ సందర్భంలో లేచి ప్రయాణం ప్రారంభించడమే భావం; పునరుత్థానాన్ని సూచించకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔρχεται
  choice: వచ్చాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని తెలుగులో సహజమైన గతకాల కథనశైలితో అందిస్తుంది.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: యూదయ ప్రాంతానికి
  rationale: ὅρια ఇక్కడ ఖచ్చితమైన సరిహద్దు రేఖలకన్నా భూభాగం లేదా ప్రాంతాన్ని సూచిస్తుంది.
- source_word: καὶ πέραν τοῦ Ἰορδάνου
  choice: యొర్దాను అవతలి ప్రాంతానికి
  rationale: యొర్దాను నదికి అవతల ఉన్న భూభాగాన్ని స్పష్టంగా సూచిస్తూ, ముందు పదబంధంతో దాని సంబంధాన్ని పూర్తిగా నిర్ణయించదు.
- source_word: συμπορεύονται … ὄχλοι πρὸς αὐτόν
  choice: జనసమూహాలు … ఆయన దగ్గరికి చేరాయి
  rationale: జనసమూహాలు కలిసి ఆయన వైపు రావడం అనే సందర్భోచిత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: మార్కు వాడిన ఈ పదం రెండుసార్లూ ఉంచబడి, చర్యల పునరావృతిని నిలుపుతుంది.
- source_word: ὡς εἰώθει
  choice: తన అలవాటు ప్రకారం
  rationale: యేసు సాధారణంగా చేసేవిధంగా చేశాడనే అలవాటైన చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐδίδασκεν αὐτούς
  choice: వారికి బోధించాడు
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగిన లేదా అలవాటైన బోధనా చర్యను ముందున్న పదబంధంతో కలిపి తెలియజేస్తుంది.
theological_decisions:
- issue: కథనంలోని చారిత్రక వర్తమాన కాలం
  choice: తెలుగులో సహజమైన గతకాలమైన ‘వచ్చాడు’ వాడబడింది
  alternative: గ్రీకు రూపాన్ని నేరుగా ప్రతిబింబించే ‘వస్తాడు’
  rationale: గ్రీకులో ἔρχεται చారిత్రక వర్తమానమైనా, తెలుగులో అకస్మాత్తుగా వర్తమాన కాలానికి మారడం అసహజంగా ఉంటుంది; గతకాలం సంఘటన స్వభావాన్ని మార్చదు.
- issue: καὶ πέραν τοῦ Ἰορδάνου అనే భౌగోళిక పదబంధపు అన్వయం
  choice: యూదయ ప్రాంతం, యొర్దాను అవతలి ప్రాంతం అనే రెండు సమన్విత గమ్యాలుగా ప్రధాన పాఠ్యంలో చూపబడింది
  alternative: ‘యొర్దాను అవతల ఉన్న యూదయ ప్రాంతం’ అనే ఒకే గమ్యంగా అన్వయించడం
  rationale: గ్రీకు వాక్యనిర్మాణం సంక్షిప్తంగా ఉండి రెండురకాల అన్వయాలకు వీలు ఇస్తుంది; ప్రధాన పాఠ్యం పదక్రమానికి దగ్గరగా ఉండగా ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘బయలుదేరి’ సందర్భోచితంగా ἀναστὰς భావాన్ని అందిస్తుంది; ‘జనసమూహాలు’ బహువచనాన్ని నిలుపుతుంది. రెండు పాదసూచిక గుర్తులూ సంబంధిత భౌగోళిక పదబంధం వెంట ఉంచబడ్డాయి.
