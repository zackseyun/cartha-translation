id: MRK.10.29
reference: Mark 10:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ἔφη ὁ Ἰησοῦς⸃· Ἀμὴν λέγω ὑμῖν, οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ἀδελφοὺς ἢ ἀδελφὰς ἢ ⸂μητέρα ἢ πατέρα⸃ ἢ τέκνα ἢ ἀγροὺς ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/029.yaml
  text: Jesus said, “Truly I say to you, there is no one who has left house or brothers or sisters or mother or father or children or fields for my sake and for the sake of the gospel,”
translation:
  language: te
  text: 'యేసు ఇలా అన్నాడు: “నేను మీతో నిజంగా చెబుతున్నాను: ఇల్లు గానీ, అన్నదమ్ములు గానీ, అక్కచెల్లెళ్లు గానీ, తల్లి గానీ, తండ్రి గానీ, పిల్లలు గానీ, పొలాలు గానీ నా నిమిత్తం, సువార్త నిమిత్తం విడిచిపెట్టినవాడు ఎవరూ లేడు,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη ὁ Ἰησοῦς
  choice: యేసు ఇలా అన్నాడు
  rationale: φημί ఇక్కడ యేసు మాటలను సరళంగా పరిచయం చేస్తుంది. ‘ఇలా అన్నాడు’ అనేది సహజమైన ఆధునిక తెలుగు; మూలంలో లేని ‘జవాబిచ్చాడు’ అనే భావాన్ని చేర్చదు.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: నేను మీతో నిజంగా చెబుతున్నాను
  rationale: సినాప్టిక్ సువార్తల్లో వాక్యారంభంలోని Ἀμήν దృఢమైన సత్యప్రకటనను సూచిస్తుంది. ‘నిజంగా’ దాని కార్యాన్ని సహజ తెలుగులో అందిస్తుంది; λέγω ὑμῖν యొక్క ప్రత్యక్షతను ‘నేను మీతో ... చెబుతున్నాను’ నిలుపుతుంది.
- source_word: οὐδείς ἐστιν ὃς
  choice: ఎవరైనా సరే
  rationale: 'ఈ వాక్య నిర్మాణం 30వ వచనంలో పూర్తయ్యే సార్వత్రిక ప్రతికూల ప్రకటనలో భాగం: ఇలాంటివారిలో ఎవరూ అక్కడ చెప్పిన ప్రతిఫలాన్ని పొందకుండా ఉండరు. విడిగా ఇచ్చిన 29వ వచనం తెలుగులో పూర్తిగా ప్రతికూల వాక్యంలా తప్పుగా వినిపించకుండా, కొనసాగింపును సహజంగా సూచించేందుకు ‘ఎవరైనా సరే’ ఎంచుకున్నాం.'
- source_word: ἀφῆκεν
  choice: విడిచిపెట్టినవారు
  rationale: ‘విడిచిపెట్టు’ స్థలం, బంధువులు లేదా ఆస్తిని శిష్యత్వం నిమిత్తం వదలి రావడాన్ని వ్యక్తం చేస్తుంది. ‘త్యజించు’ లేదా ‘పరిత్యజించు’ అనేవి కుటుంబ బాధ్యతలను పూర్తిగా నిరాకరించినట్టు మూలానికి మించిన కఠిన భావం కలిగించవచ్చు.
- source_word: οἰκίαν
  choice: ఇంటినైనా
  rationale: οἰκία ఇక్కడ నివాసమైన ఇంటిని సూచిస్తుంది. ‘కుటుంబం’ అని అనువదిస్తే అర్థపరిధి మారుతుంది.
- source_word: ἀδελφοὺς / ἀδελφὰς
  choice: అన్నదమ్ములనైనా, అక్కచెల్లెళ్లనైనా
  rationale: గ్రీకు పాఠం మగ తోబుట్టువులను, ఆడ తోబుట్టువులను విడివిడిగా పేర్కొంటుంది. తెలుగు బంధుత్వ పదజాలంలో సహజంగా, లింగభేదాన్ని స్పష్టంగా నిలుపుతున్న రూపాలు ఇవి.
- source_word: μητέρα ἢ πατέρα
  choice: తల్లినైనా, తండ్రినైనా
  rationale: రెండు కుటుంబ సంబంధాలకు నేరుగా సరిపోయే సహజ తెలుగు పదాలు; మూలంలోని క్రమాన్ని నిలుపుతాయి.
- source_word: τέκνα
  choice: పిల్లలనైనా
  rationale: τέκνα లింగభేదం లేకుండా సంతానాన్ని సూచిస్తుంది; ‘పిల్లలు’ దానికి సహజమైన సమానార్థకం.
- source_word: ἀγρούς
  choice: పొలాలనైనా
  rationale: ἀγρός సాగుభూమి లేదా పొలాన్ని సూచిస్తుంది. ‘పొలాలు’ concrete sense‌ను నిలుపుతుంది; ‘ఆస్తులు’ మరీ విస్తృతం, ‘వ్యవసాయాలు’ మరింత వ్యాఖ్యానాత్మకం.
- source_word: ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου
  choice: నా నిమిత్తం, సువార్త నిమిత్తం
  rationale: రెండు కారణాలను మూలంలాగే విడిగా, సమాన ప్రాధాన్యంతో ఉంచుతుంది. ‘సువార్త’ εὐαγγέλιον‌కు స్థిరమైన, విస్తృతంగా అర్థమయ్యే తెలుగు పదం.
theological_decisions:
- issue: కుటుంబాన్ని లేదా ఆస్తిని ‘విడిచిపెట్టడం’ అనే శిష్యత్వపు మూల్యాన్ని అతిశయింపకుండా అనువదించడం
  choice: విడిచిపెట్టినవారు
  alternative: త్యజించినవారు / పరిత్యజించినవారు
  rationale: వాక్యం యేసు మరియు సువార్త నిమిత్తం నిజమైన నష్టాన్ని, వేరుపడటాన్ని చెబుతుంది; అయితే కుటుంబపట్ల నైతిక బాధ్యతను పూర్తిగా నిరాకరించడాన్ని స్పష్టంగా బోధించదు. ఎంపిక చేసిన పదం ఈ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
- issue: 29వ వచనంలో మొదలై 30వ వచనంలో పూర్తయ్యే οὐδείς ... ἐὰν μή నిర్మాణం
  choice: విడిచిపెట్టినవారు ఎవరైనా సరే,
  alternative: విడిచిపెట్టినవారు ఎవరూ లేరు
  rationale: ‘ఎవరూ లేరు’ అని 29వ వచనానికే ముగింపు భావం ఇస్తే, అలాంటి వ్యక్తి అసలు లేడని తప్పుగా అర్థమవుతుంది. ‘ఎవరైనా సరే’ సార్వత్రిక పరిధిని కాపాడుతూ, తదుపరి వచనంలోని ఫలితానికి వాక్యం కొనసాగుతున్నదని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. జాబితాలో ‘-నైనా’ పునరుక్తి గ్రీకు ἢ ... ἢ నిర్మాణంలోని ప్రతి అంశపు ప్రత్యేకతను తెలుగులో సహజంగా చూపుతుంది. వచనం 30వ వచనంలో వ్యాకరణపరంగా పూర్తవుతుందని చివర కామా ఉంచబడింది.
