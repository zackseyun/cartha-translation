review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the renunciation list, its stated motives, and the verse’s continuation into 10:30. However, “ఎవరైనా సరే” renders an unrestricted universal (‘anyone’) rather than the explicit negative existential οὐδείς ἐστιν ὃς (‘there is no one who’). The negative is syntactically essential to the construction completed in the following verse and should be retained, even though the Telugu sentence remains incomplete at this verse boundary.
  naturalness: The register is clear, modern, and suitably dignified. The family terms and repeated alternatives are natural. A trailing comma appropriately indicates that the sentence continues into verse 30. The revised wording uses a singular generic subject, matching the Greek, while remaining natural Telugu.
  terminology: “సువార్త,” “పొలాలు,” and “విడిచిపెట్టిన” are appropriate. “విడిచిపెట్టిన” avoids importing the stronger implications of abandonment or repudiation. “అన్నదమ్ములు” and “అక్కచెల్లెళ్లు” suitably preserve the Greek’s separate references to male and female siblings.
  issues:
  - severity: medium
    issue: The explicit negative force of οὐδείς ἐστιν ὃς is not represented.
    rationale: “విడిచిపెట్టినవారు ఎవరైనా సరే” means ‘whoever has left,’ whereas the Greek says ‘there is no one who has left ... [who will not receive ...]’. Although verse 30 supplies the rest of the thought, the negative existential should be retained in verse 29 and allowed to continue syntactically into verse 30.
  revised_text: 'యేసు ఇలా అన్నాడు: “నేను మీతో నిజంగా చెబుతున్నాను: ఇల్లు గానీ, అన్నదమ్ములు గానీ, అక్కచెల్లెళ్లు గానీ, తల్లి గానీ, తండ్రి గానీ, పిల్లలు గానీ, పొలాలు గానీ నా నిమిత్తం, సువార్త నిమిత్తం విడిచిపెట్టినవాడు ఎవరూ లేడు,'
  revised_footnotes: []
