revisions:
- from: 'యేసు ఇలా అన్నాడు: “నేను మీతో నిజంగా చెబుతున్నాను: నా నిమిత్తం, సువార్త నిమిత్తం ఇంటినైనా, అన్నదమ్ములనైనా, అక్కచెల్లెళ్లనైనా, తల్లినైనా, తండ్రినైనా, పిల్లలనైనా, పొలాలనైనా విడిచిపెట్టినవారు ఎవరైనా సరే,'
  to: 'యేసు ఇలా అన్నాడు: “నేను మీతో నిజంగా చెబుతున్నాను: ఇల్లు గానీ, అన్నదమ్ములు గానీ, అక్కచెల్లెళ్లు గానీ, తల్లి గానీ, తండ్రి గానీ, పిల్లలు గానీ, పొలాలు గానీ నా నిమిత్తం, సువార్త నిమిత్తం విడిచిపెట్టినవాడు ఎవరూ లేడు,'
  rationale: The revision restores the negative existential force of οὐδείς ἐστιν ὃς and retains the Greek order in which the motives follow the list. The final comma deliberately preserves the syntactic dependence on Mark 10:30, where the qualification concerning receiving is completed. No footnote is needed.
