  to: 'యేసు చుట్టూ చూసి తన శిష్యులతో ఇలా అన్నాడు: “ధనం[a] ఉన్నవారు దేవుని రాజ్యంలో ప్రవేశించడం ఎంత కష్టమవుతుందో!”'
