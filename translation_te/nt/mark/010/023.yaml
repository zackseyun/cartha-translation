id: MRK.10.23
reference: Mark 10:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ περιβλεψάμενος ὁ Ἰησοῦς λέγει τοῖς μαθηταῖς αὐτοῦ· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/023.yaml
  text: And looking around[a], Jesus says to his disciples, “How difficult it is for those who have wealth to enter the kingdom of God!”
translation:
  language: te
  text: 'యేసు చుట్టూ చూసి తన శిష్యులతో ఇలా అన్నాడు: “ధనం[a] ఉన్నవారు దేవుని రాజ్యంలో ప్రవేశించడం ఎంత కష్టమవుతుందో!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “డబ్బు ఉన్నవారు,” “ఆస్తులు కలిగివున్నవారు.”
    reason: χρήματα అనే పదం డబ్బు, ఆస్తులు లేదా సంపదను సూచించగలదు.
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: చుట్టూ చూసి
  rationale: యేసు తన చుట్టూ ఉన్నవారిని పరిశీలించిన భావాన్ని, ప్రధాన క్రియకు ముందు జరిగిన భాగధాతు చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: λέγει
  choice: ఇలా అన్నాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమాన కాలం కథనానికి సజీవత ఇస్తుంది; తెలుగులో సహజమైన కథన శైలికి భూతకాల రూపం సరిపోతుంది.
- source_word: Πῶς δυσκόλως
  choice: ఎంత కష్టం
  rationale: ఇది కష్టతను బలంగా వ్యక్తం చేసే ఆశ్చర్యార్థక ప్రయోగం; అసాధ్యతను సూచించకుండా గ్రీకు భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: ధనం ఉన్నవారు
  rationale: స్థిరమైన సామాజిక వర్గపేరైన ‘ధనవంతులు’ అని సంక్షిప్తం చేయకుండా, ‘ధనం/ఆస్తి కలిగివున్నవారు’ అనే గ్రీకు భాగధాతు పదబంధాన్ని పారదర్శకంగా ప్రతిబింబిస్తుంది.
- source_word: χρήματα
  choice: ధనం
  rationale: ఈ పదం డబ్బుతోపాటు భౌతిక సంపద లేదా ఆస్తిని సూచించగలదు; ‘ధనం’ తెలుగులో సంక్షిప్తంగా, విస్తృతార్థంతో ఉంటుంది.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: మార్కు సువార్తలోని రాజ్య భాషను, దాని వేదాంతపరమైన కొనసాగింపును స్పష్టంగా కాపాడే ప్రామాణిక తెలుగు ప్రయోగం.
- source_word: εἰσελεύσονται
  choice: ప్రవేశించడం
  rationale: గ్రీకు క్రియ భవిష్యత్ ప్రవేశాన్ని సూచిస్తుంది; ‘ఎంత కష్టం’ అనే తెలుగు నిర్మాణంలో క్రియానామ రూపం సహజంగా ఉండి ఆ భావాన్ని సందర్భం ద్వారా తెలియజేస్తుంది.
theological_decisions:
- issue: ధనం ఉన్నవారు దేవుని రాజ్యంలో ప్రవేశించడం అసాధ్యమా, లేక అత్యంత కష్టమా?
  choice: 'తీవ్రమైన కష్టంగా అనువదించడం: ‘ప్రవేశించడం ఎంత కష్టం!’'
  alternative: ఆచరణలో అసాధ్యమని మరింత బలంగా వ్యాఖ్యానించే అనువాదం
  rationale: గ్రీకు δυσκόλως కష్టాన్ని సూచిస్తుంది, అసాధ్యతను కాదు. అందువల్ల ఈ వాక్యం కలిగించే వేదాంతపరమైన ఉద్రిక్తతను పరిష్కరించకుండా అలాగే ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. సాధారణ పాఠకులకు అర్థమయ్యే పదాలను వాడుతూ గ్రీకు వాక్యంలోని ఆశ్చర్యార్థక బలాన్ని మరియు వేదాంతపరమైన ఉద్రిక్తతను నిలుపుకుంది.
