  yaml_path: translation/nt/mark/010/007.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife,[a]
translation:
  language: te
  text: ఈ కారణంగా పురుషుడు తన తండ్రినీ తల్లినీ విడిచిపెట్టి తన భార్యతో కలిసియుంటాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన భార్యను అంటిపెట్టుకొని ఉంటాడు.” గ్రీకు క్రియ సన్నిహితమైన, గాఢమైన అనుబంధాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రాచీన ప్రతులలో “తన భార్యతో కలిసియుంటాడు” అనే పదాలు లేవు.
    reason: textual_variant
lexical_decisions:
- source_word: ἕνεκεν τούτου
  choice: ఈ కారణంగా
  rationale: వాక్యంలోని కారణార్థక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: καταλείψει
  choice: విడిచిపెట్టి
  rationale: తల్లిదండ్రుల గృహాన్ని విడిచి వెళ్లే సాధారణ భావాన్ని తెలియజేస్తుంది; ‘త్యజించి’ అనవసరంగా పరిత్యాగ భావాన్ని బలపరచవచ్చు.
- source_word: ἄνθρωπος
  choice: పురుషుడు
  rationale: ἄνθρωπος సాధారణంగా ‘మనిషి’ అని అర్థమవగలిగినా, ఇక్కడ ‘తన భార్య’ అనే వివాహ సందర్భం పురుష పక్షాన్ని నిర్దిష్టంగా సూచిస్తుంది.
- source_word: πατέρα αὐτοῦ καὶ τὴν μητέρα
  choice: తన తండ్రిని, తల్లిని
  rationale: రెండు కుటుంబ సంబంధాలను నేరుగా, సహజమైన తెలుగు సమన్వయంతో అందిస్తుంది.
- source_word: προσκολληθήσεται
  choice: హత్తుకొని ఉంటాడు
  rationale: కేవలం సమీపించడం కాకుండా గాఢంగా అంటిపెట్టుకొని నిలిచే అనుబంధాన్ని వ్యక్తపరుస్తుంది; గ్రీకు క్రియలోని సన్నిహిత బంధ భావాన్ని నిలుపుతుంది.
- source_word: πρὸς τὴν γυναῖκα αὐτοῦ
  choice: తన భార్యను
  rationale: వివాహ సందర్భంలో γυνή స్పష్టంగా ‘భార్య’ను సూచిస్తుంది; తెలుగు క్రియారూపంతో సహజంగా సరిపోతుంది.
theological_decisions:
- issue: వివాహ ఉల్లేఖనంలోని లింగ-నిర్దిష్ట ప్రతినిధి భాష
  choice: పురుషుడు ... తన భార్యను
  alternative: వ్యక్తి ... తన జీవిత భాగస్వామిని
  rationale: సందర్భం పురుషుడు–స్త్రీ వివాహ జంటలో పురుష పక్షాన్ని నిర్దిష్టంగా చూపుతుంది; దాన్ని లింగతటస్థంగా మార్చకుండా మూలంలోని నిర్దిష్టతను నిలుపుతుంది.
- issue: προσκολληθήσεταιలోని వివాహ బంధ భావం
  choice: హత్తుకొని ఉంటాడు
  alternative: జతచేయబడతాడు
  rationale: గ్రీకు భవిష్యత్ నిష్క్రియ రూపం రూపపరంగా ‘జతచేయబడతాడు’ అని అనువదించగలిగినా, ఈ క్రియకు గాఢంగా అంటిపెట్టుకోవడం లేదా నిబద్ధంగా కలిసి ఉండడం అనే భావమూ ఉంది. ప్రధాన పాఠం ఆ అనుబంధాన్ని సహజమైన తెలుగులో ఉంచుతుంది; ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘త్యజించు’ వంటి అధిక తీవ్రతగల పదాన్ని నివారించి, వివాహ అనుబంధంలోని గాఢతను సహజంగా వ్యక్తపరిచే పదబంధాన్ని ఎంచుకున్నాం.
