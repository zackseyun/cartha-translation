  text: But many who are first will be last[a], and the last first.
translation:
  language: te
  text: కాని, మొదటివారైన అనేకులు చివరివారవుతారు; చివరివారు మొదటివారవుతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత స్పష్టంగా: “మొదటివారైన అనేక మంది చివరివారవుతారు; చివరివారైనవారు మొదటివారవుతారు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: అనేకులు
  rationale: ఇది నామవాచకంగా వాడిన విశేషణం; ప్రతి ఒక్కరినీ కాక విస్తృతమైన, నిర్దిష్టం కాని సమూహాన్ని సూచిస్తుంది.
- source_word: δὲ
  choice: కాని
  rationale: ముందటి వాక్యంలోని వాగ్దానానికి వెంటనే వచ్చే విరుద్ధ మలుపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἔσονται
  choice: అవుతారు
  rationale: భవిష్యత్ కాలంలోని అనుసంధాన క్రియను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; స్థితి లేదా స్థానంలో కలిగే తారుమారును కూడా సందర్భానుసారంగా సూచిస్తుంది.
- source_word: πρῶτοι
  choice: మొదటివారు
  rationale: క్రమాన్ని మాత్రమే కాక స్థానం లేదా ప్రాధాన్యాన్ని కూడా సూచించగల మూలపదపు విస్తృతిని కాపాడుతుంది.
- source_word: ἔσχατοι
  choice: చివరివారు
  rationale: ‘మొదటివారు’ అనే పదానికి నేరమైన వ్యతిరేక సమాంతరాన్ని నిలుపుతూ, స్థానం లేదా హోదా భావాన్ని నిర్దిష్టంగా కుదించదు.
- source_word: οἱ ἔσχατοι
  choice: చివరివారు
  rationale: ఆర్టికల్‌తో నామవాచకంగా ఉన్న గ్రీకు పదబంధాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: καὶ
  choice: ;
  rationale: గ్రీకులోని రెండు సమాంతర భాగాల అనుసంధానాన్ని తెలుగులో బిగువైన సామెతసదృశ నిర్మాణంగా సెమీకోలన్ ద్వారా వ్యక్తపరుస్తుంది; భావపరంగా ‘మరియు’ అనే అనుసంధానం అలాగే ఉంటుంది.
theological_decisions:
- issue: తారుమారు గురించిన ఈ వాక్య స్వభావం
  choice: అంత్యకాల సంబంధమైన తారుమారును తెలిపే విస్తృత సూత్రంగా, వర్గాలను మరింత నిర్దిష్టం చేయకుండా అనువదించడం
  alternative: ‘మొదటివారు’, ‘చివరివారు’ అనేవారిని ధనికులు–పేదలు, శిష్యులు–బయటివారు, లేదా రక్షణ పొందినవారు–పొందనివారు అని ప్రత్యేకంగా గుర్తించడం
  rationale: ఈ వచనం బలమైన విరుద్ధతను చెబుతుంది గాని ఆయా వర్గాలను స్వయంగా నిర్వచించదు; ‘అనేకులు’ అనే పదం దీనిని ప్రతి వ్యక్తికీ వర్తించే సంపూర్ణ నియమంగా మార్చకుండా అడ్డుకుంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన సూక్తి శైలిని నిలిపాం. ‘మొదటివారు/చివరివారు’ అనే సమాంతర పదజంట మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను కాపాడుతుంది.
