id: MRK.10.27
reference: Mark 10:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἐμβλέψας αὐτοῖς ὁ Ἰησοῦς λέγει· Παρὰ ἀνθρώποις ἀδύνατον ἀλλ’ οὐ παρὰ θεῷ, πάντα γὰρ ⸀δυνατὰ παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/027.yaml
  text: Jesus looked at them and said, “With men it is impossible, but not with God, because all things are possible with God.”
translation:
  language: te
  text: యేసు వారిని చూసి, “మనుష్యులకు ఇది అసాధ్యం; కానీ దేవునికి కాదు. ఎందుకంటే దేవునికి అన్నీ సాధ్యమే” అని చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας αὐτοῖς
  choice: వారివైపు తదేకంగా చూసి
  rationale: ἐμβλέπω సాధారణంగా చూడడం కంటే శ్రద్ధగా, నిశితంగా చూడడాన్ని సూచిస్తుంది; తెలుగులో సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: Παρὰ ἀνθρώποις
  choice: మనుష్యులకు
  rationale: παρά + dative ఇక్కడ సామర్థ్య పరిధిని సూచిస్తుంది; సహజమైన తెలుగులో ‘మనుష్యులకు’ అని సంక్షిప్తంగా వ్యక్తమవుతుంది.
- source_word: ἀδύνατον
  choice: అసాధ్యం
  rationale: మానవ సామర్థ్యంతో సాధ్యం కానిదనే మూలార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἀλλ’ οὐ παρὰ θεῷ
  choice: కానీ దేవునికి కాదు
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్త విరుద్ధ నిర్మాణాన్ని అలాగే ఉంచి, ముందున్న ‘అసాధ్యం’ను పునరుక్తి చేయకుండా సహజంగా తెలుపుతుంది.
- source_word: πάντα γὰρ δυνατὰ παρὰ τῷ θεῷ
  choice: ఎందుకంటే దేవునికి అన్నీ సాధ్యమే
  rationale: γάρను సందర్భానుసారంగా కారణార్థకమైన ‘ఎందుకంటే’గా అనువదించి, πάντα అనే సమగ్రతను ‘అన్నీ’తో నిలుపుతుంది.
theological_decisions:
- issue: ‘అన్నీ సాధ్యమే’ అనే వాక్యపు పరిధి
  choice: ఏ వివరణాత్మక పరిమితినీ ప్రధాన పాఠ్యంలో చేర్చకుండా మూలంలోని విస్తృత వాక్యాన్నే ఉంచడం
  alternative: ‘దేవుని చిత్తానుసారమైన అన్నీ’ అని స్పష్టీకరించడం
  rationale: మూలపాఠ్యం పరిమితిని ఇక్కడ బహిరంగంగా పేర్కొనదు; సందర్భం దేవుని రక్షణకార్య సామర్థ్యాన్ని సూచించినా, ఆ వ్యాఖ్యానాన్ని అనువాదంలో చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘తదేకంగా’ అనే పదం యేసు చూపులోని శ్రద్ధను తెలియజేస్తుంది; మిగతా వాక్యం సంక్షిప్తంగా, మౌలిక విరుద్ధతను నిలుపుతుంది.
