revisions:
- from: యేసు వారివైపు తదేకంగా చూసి, “మనుష్యులకు ఇది అసాధ్యం; కానీ దేవునికి కాదు. ఎందుకంటే దేవునికి అన్నీ సాధ్యమే” అని చెప్పాడు.
  to: యేసు వారిని చూసి, “మనుష్యులకు ఇది అసాధ్యం; కానీ దేవునికి కాదు. ఎందుకంటే దేవునికి అన్నీ సాధ్యమే” అని చెప్పాడు.
  rationale: The revision removes an unnecessary intensification from the opening participle while preserving the Greek contrast, the causal γάρ clause, and the unqualified scope of “all things.”
