  text: And throwing off his cloak[a], he sprang up and came to Jesus.
translation:
  language: te
  text: అతడు తన పైవస్త్రాన్ని[a] విసిరివేసి, ఎగిరి లేచి, యేసు దగ్గరకు వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
