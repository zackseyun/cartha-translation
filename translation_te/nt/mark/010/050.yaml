    text: లేదా, ‘తన వస్త్రాన్ని విసిరివేసి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποβαλών
  choice: పక్కకు విసిరి
  rationale: ἀποβάλλω ఇక్కడ వస్త్రాన్ని నిర్ణయాత్మకంగా తొలగించి విసరడాన్ని సూచిస్తుంది. ‘పక్కకు విసిరి’ అనే ప్రయోగం చర్యలోని హఠాత్తుతనాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἱμάτιον
  choice: పైవస్త్రం
  rationale: ἱμάτιον సాధారణంగా వెలుపల ధరించే వస్త్రాన్ని సూచిస్తుంది. ‘పైవస్త్రం’ సందర్భానికి తగినదిగా ఉండి, సాధారణ ‘వస్త్రం’ కంటే నిర్దిష్టంగా ఉంది.
- source_word: ἀναπηδήσας
  choice: ఒక్కసారిగా లేచి
  rationale: ἀναπηδάω హఠాత్తుగా, ఉత్సాహంగా పైకి లేవడాన్ని సూచిస్తుంది. ‘ఒక్కసారిగా లేచి’ అతిశయోక్తి లేకుండా ఆ వేగాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: యేసు దగ్గరకు వచ్చాడు
  rationale: ἔρχομαι తో πρός కలయిక యేసు వైపు కదలి ఆయన వద్దకు చేరడాన్ని సూచిస్తుంది. ఈ సందర్భంలో ‘యేసు దగ్గరకు వచ్చాడు’ సహజమైన తెలుగు.
- source_word: δὲ
  choice: అతడు
  rationale: δέ ఇక్కడ కథనాన్ని ముందుకు నడిపే స్వల్ప అనుసంధాన పదం. తెలుగులో ప్రత్యేక సంధానపదాన్ని బలవంతంగా చేర్చకుండా వాక్యాన్ని ‘అతడు’తో ప్రారంభించడం సహజంగా అదే కథన ప్రవాహాన్ని ఇస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. గ్రీకు వాక్యంలోని వరుస చర్యలు—వస్త్రాన్ని విసరడం, హఠాత్తుగా లేవడం, యేసు వద్దకు రావడం—స్పష్టంగా నిలుపబడ్డాయి.
