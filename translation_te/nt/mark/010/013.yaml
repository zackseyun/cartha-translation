revisions:
- from: కొందరు చిన్నపిల్లలను ఆయన దగ్గరికి తీసుకొస్తూ ఉన్నారు; ఆయన వారిని తాకాలని అలా చేశారు.[a] అయితే శిష్యులు వారిని తీసుకొస్తున్నవారిని గద్దించారు.
  to: ఆయన వారిని తాకాలని వారు పిల్లలను ఆయన దగ్గరకు తీసుకొస్తూ ఉండేవారు.[a] కానీ శిష్యులు వారిని తీసుకొస్తున్నవారిని గద్దించారు.
  rationale: The revision removes the unsupported qualifier «కొందరు», renders παιδία with the broader «పిల్లలను», and recasts the purpose clause in natural modern Telugu. It retains the imperfect sense with «తీసుకొస్తూ ఉండేవారు», translates ἅψηται directly as «తాకాలని», and makes the intended referent of αὐτοῖς explicit without importing the hand-laying detail from parallel accounts.
  reviewer_model: gpt-5.6-terra
