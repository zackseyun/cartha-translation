  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ προσέφερον αὐτῷ παιδία ἵνα ⸂αὐτῶν ἅψηται⸃· οἱ δὲ μαθηταὶ ⸂ἐπετίμησαν αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/013.yaml
  text: And they were bringing children to him so that he might touch them[a], but the disciples rebuked them.
translation:
  language: te
  text: ఆయన వారిని తాకాలని వారు పిల్లలను ఆయన దగ్గరకు తీసుకొస్తూ ఉండేవారు.[a] కానీ శిష్యులు వారిని తీసుకొస్తున్నవారిని గద్దించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చిన్నపిల్లలను.” మూలభాషలోని παιδία అనే పదం పిల్లలను విస్తృతంగా సూచించగలదు; అందులో చిన్న వయస్సు పిల్లలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέφερον
  choice: తీసుకొస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం గతంలో కొనసాగిన లేదా పదేపదే జరిగిన చర్యను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ క్రియాంశాన్ని సహజంగా నిలుపుతుంది.
- source_word: παιδία
  choice: చిన్నపిల్లలను
  rationale: παιδία పిల్లలను విస్తృతంగా, ముఖ్యంగా చిన్న వయస్సు పిల్లలను సూచించగలదు. సందర్భానికి అనుగుణంగా ‘చిన్నపిల్లలు’ సహజమైన తెలుగు పదం; అయితే శిశువులకే పరిమితం చేయదు.
- source_word: ἵνα αὐτῶν ἅψηται
  choice: ఆయన వారిని తాకాలని
  rationale: ἵνα తో కూడిన విధ్యర్థక రూపం ఉద్దేశాన్ని తెలియజేస్తుంది; ἅπτομαι యొక్క ప్రత్యక్ష అర్థం ‘తాకు’. సమాంతర వృత్తాంతాల నుంచి ‘చేతులు ఉంచు’ అనే వివరాన్ని ఇక్కడికి దిగుమతి చేయలేదు.
- source_word: ἐπετίμησαν
  choice: గద్దించారు
  rationale: ἐπιτιμάω తీవ్రంగా మందలించడం లేదా గద్దించడం అనే భావం ఇస్తుంది; ‘గద్దించారు’ ఆధునిక తెలుగులో ఆ బలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: αὐτοῖς
  choice: వారిని తీసుకొస్తున్నవారిని
  rationale: గ్రీకులో సర్వనామం మాత్రమే ఉన్నప్పటికీ, దాని సహజ పూర్వపదం పిల్లలను తీసుకొస్తున్న వ్యక్తులు. తెలుగులో ‘వారిని’ మాత్రమే అంటే పిల్లలనే గద్దించినట్లు అపార్థమయ్యే అవకాశం ఉన్నందున భావాన్ని స్పష్టం చేశాం.
- source_word: δὲ
  choice: అయితే
  rationale: δέ ముందటి చర్యకు శిష్యుల ప్రతిస్పందనను స్వల్ప విరుద్ధతతో కలుపుతుంది; ‘అయితే’ ఆ సంబంధాన్ని సహజంగా చూపిస్తుంది.
theological_decisions:
- issue: శిష్యులు ఎవరిని గద్దించారు?
  choice: పిల్లలను తీసుకొస్తున్నవారిని
  alternative: పిల్లలను
  rationale: αὐτοῖς అనే సర్వనామానికి అత్యంత సహజమైన సూచిత పూర్వపదం προσέφερον క్రియలో అంతర్లీనంగా ఉన్న ‘తీసుకొస్తున్నవారు’. తదుపరి వచనంలోని కథన ప్రవాహమూ దీనికి అనుకూలంగా ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. కొనసాగుతున్న చర్యను నిలుపుతూ, గ్రీకు సర్వనామం వల్ల తెలుగులో కలగగల సందిగ్ధతను స్వల్పంగా స్పష్టం చేసింది.
