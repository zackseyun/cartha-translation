revisions:
- from: ఇప్పుడు ఈ కాలంలో ఇళ్లను, అన్నదమ్ములను, అక్కచెల్లెళ్లను, తల్లులను[a], పిల్లలను, పొలాలను—హింసలతో పాటు—నూరింతలుగా పొందకుండా ఉండడు; రాబోయే యుగంలో నిత్యజీవాన్ని పొందుతాడు.
  to: ఇప్పుడు ఈ కాలంలో నూరింతలు—ఇళ్లు, అన్నదమ్ములు, అక్కచెల్లెళ్లు, తల్లులు, పిల్లలు, పొలాలు, పీడనలతో పాటు—పొందకుండా ఉండడు; రాబోయే యుగంలో నిత్యజీవాన్ని పొందుతాడు.
