id: MRK.10.30
reference: Mark 10:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν μὴ λάβῃ ἑκατονταπλασίονα νῦν ἐν τῷ καιρῷ τούτῳ οἰκίας καὶ ἀδελφοὺς καὶ ἀδελφὰς καὶ ⸀μητέρας καὶ τέκνα καὶ ἀγροὺς μετὰ διωγμῶν, καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/030.yaml
  text: who will not receive a hundredfold now in this time—houses and brothers and sisters and mothers and children and fields[a], with persecutions—and in the age to come[b], eternal life.
translation:
  language: te
  text: ఇప్పుడు ఈ కాలంలో నూరింతలు—ఇళ్లు, అన్నదమ్ములు, అక్కచెల్లెళ్లు, తల్లులు, పిల్లలు, పొలాలు, పీడనలతో పాటు—పొందకుండా ఉండడు; రాబోయే యుగంలో నిత్యజీవాన్ని పొందుతాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λάβῃ
  choice: పొందు
  rationale: వాగ్దానంగా లభించే ప్రతిఫలాన్ని సూచించే సందర్భంలో ‘తీసుకొను’ కంటే ‘పొందు’ సహజంగా ఉండి గ్రీకు క్రియ భావాన్ని నిలుపుతుంది.
- source_word: ἑκατονταπλασίονα
  choice: నూరింతలుగా
  rationale: ‘నూరు రెట్లు’ అనే పరిమాణబలాన్ని సంక్షిప్తంగా, సహజమైన తెలుగు రూపంలో వ్యక్తం చేస్తుంది; తరువాతి జాబితా అంతటికీ వర్తించేలా ఉంచబడింది.
- source_word: νῦν ἐν τῷ καιρῷ τούτῳ
  choice: ఇప్పుడు ఈ కాలంలో
  rationale: ప్రస్తుత కాలానికీ రాబోయే యుగానికీ మధ్య గ్రీకులో ఉన్న స్పష్టమైన వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: οἰκίας
  choice: ఇళ్లను
  rationale: బహువచనంలోని నిర్దిష్ట, భౌతిక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀδελφοὺς καὶ ἀδελφὰς
  choice: అన్నదమ్ములను, అక్కచెల్లెళ్లను
  rationale: గ్రీకు పాఠం పురుష, స్త్రీ సహోదరులను విడివిడిగా పేర్కొంటున్నందున ఆ భేదాన్ని తెలుగులోనూ స్పష్టంగా నిలుపుతుంది.
- source_word: μητέρας
  choice: తల్లులను
  rationale: SBLGNT ప్రధాన పాఠంలోని బహువచనాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: τέκνα
  choice: పిల్లలను
  rationale: లింగాన్ని ప్రత్యేకంగా నిర్దేశించని విస్తృత పదమైన τέκναకు సహజమైన సమానార్థకం.
- source_word: ἀγρούς
  choice: పొలాలను
  rationale: సాగుభూములనే నిర్దిష్ట దృశ్యాన్ని ‘భూములు’ కంటే స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: μετὰ διωγμῶν
  choice: హింసలతో పాటు
  rationale: ప్రస్తుత ఆశీర్వాదాల మధ్య హింసలు కూడా ఉంటాయనే ముఖ్యమైన ఉద్రిక్తతను స్పష్టంగా నిలుపుతుంది.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: రాబోయే యుగంలో
  rationale: αἰώνను భౌతిక ‘లోకం’గా కాక కాలయుగంగా చూపి, ప్రస్తుత కాలంతో ఉన్న అంత్యకాల వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: ζωὴν αἰώνιον
  choice: నిత్యజీవాన్ని
  rationale: ఈ సందర్భంలోని స్థిరమైన అంత్యకాల భావాన్ని సహజంగా, ఖచ్చితంగా అందిస్తుంది.
theological_decisions:
- issue: ప్రస్తుత కాలంలో వాగ్దానం చేయబడిన ప్రతిఫల స్వభావం
  choice: ఇళ్లు, కుటుంబ సంబంధాలు, పొలాలు అనే వాస్తవిక జాబితాను యథాతథంగా ఉంచి, ‘హింసలతో పాటు’ అనే మాటను కూడా స్పష్టంగా నిలుపుట.
  alternative: దీనిని పూర్తిగా ఆత్మీయ ఆశీర్వాదాలుగా మాత్రమే మార్చడం, లేదా హింసను పక్కనపెట్టి భౌతిక సంపద వాగ్దానంగా మాత్రమే చూపడం.
  rationale: గ్రీకు పాఠం సమృద్ధిగా పొందడాన్నీ కొనసాగుతున్న హింసలనూ కలిపి చెబుతుంది. అనువాదం ఈ ఉద్రిక్తతను ఏదో ఒక సిద్ధాంత దిశగా పరిష్కరించకూడదు.
- issue: కుటుంబ సంబంధ పదాల్లో లింగ భేదం
  choice: ἀδελφοὺς మరియు ἀδελφὰςలను ‘అన్నదమ్ములు’ మరియు ‘అక్కచెల్లెళ్లు’గా విడివిడిగా అనువదించుట.
  alternative: రెండింటినీ కలిపి ‘సహోదరులు’ అని మాత్రమే అనువదించడం.
  rationale: మూలపాఠం పురుష, స్త్రీ సహోదరులను ప్రత్యేకంగా పేర్కొంటుంది; తెలుగు అనువాదం ఆ ఉద్దేశపూర్వక భేదాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదప్రయోగం. ఈ వాక్యం ముందటి వచనంలో మొదలైన నిర్మాణానికి కొనసాగింపు కావడంతో ‘పొందకుండా ఉండడు’ అనే రూపం ఉపయోగించబడింది.
