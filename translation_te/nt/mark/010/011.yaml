revisions:
- from: 'ఆయన వారితో ఇలా అన్నాడు: “ఎవరైనా తన భార్యకు విడాకులిచ్చి మరొకరిని[a] పెళ్లి చేసుకుంటే, ఆమెకు విరోధంగా వ్యభిచారం చేస్తున్నాడు.”


    [a] లేదా, మరింత స్పష్టంగా, “మరొక స్త్రీని.”'
  to: 'ఆయన వారితో ఇలా అన్నాడు: “ఎవరైనా తన భార్యకు విడాకులిచ్చి మరొక స్త్రీని పెళ్లి చేసుకుంటే, ఆమెకు వ్యతిరేకంగా వ్యభిచారం చేస్తాడు.”'
  rationale: The revision retains the Greek historical-narrative sense in natural Telugu, expresses the general conditional with idiomatic habitual wording, directly retains the feminine sense of ἄλλην, and preserves ἐπ’ αὐτήν as an offense against the divorced wife. Since the feminine sense is now explicit in the text, the former footnote would merely duplicate the translation and is omitted.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:02:39Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys divorce, remarriage, and the offense directed against the divorced wife. However, the conditional wording followed by the progressive present ('చేసుకుంటే ... చేస్తున్నాడు') is not a natural Telugu rendering of the Greek general condition. The feminine referent of ἄλλην can be stated directly in the main text without loss.
  naturalness: ‘ఆమెకు విరోధంగా’ is understandable but somewhat formal and less idiomatic here than ‘ఆమెకు వ్యతిరేకంగా.’ A simple habitual result form, ‘వ్యభిచారం చేస్తాడు,’ reads naturally in modern standard Telugu.
  terminology: ‘విడాకులివ్వడం,’ ‘భార్య,’ ‘పెళ్లి చేసుకోవడం,’ and ‘వ్యభిచారం’ are suitable modern standard Telugu terms. Rendering ἄλλην as ‘మరొక స్త్రీని’ preserves the source’s feminine form directly, so the supplied alternative footnote is no longer needed.
  issues:
  - severity: medium
    issue: Mixed conditional and progressive verb forms
    rationale: ‘ఎవరైనా ... చేసుకుంటే, ... చేస్తున్నాడు’ is stylistically awkward in Telugu. The Greek expresses a general conditional; Telugu idiom naturally uses ‘చేసుకుంటే ... చేస్తాడు.’
  - severity: low
    issue: The main text leaves the feminine reference of ἄλλην implicit
    rationale: ‘మరొకరిని’ can be natural Telugu, but the Greek explicitly uses a feminine form. ‘మరొక స్త్రీని’ is clear and natural in this context, eliminating the need for a lexical-alternative note.
  - severity: low
    issue: ‘విరోధంగా’ is less idiomatic than ‘వ్యతిరేకంగా’ in this construction
    rationale: Both can convey the sense of ἐπ’ αὐτήν, but ‘ఆమెకు వ్యతిరేకంగా’ more naturally expresses an action committed against her.
  revised_text: 'ఆయన వారితో ఇలా అన్నాడు: “ఎవరైనా తన భార్యకు విడాకులిచ్చి మరొక స్త్రీని పెళ్లి చేసుకుంటే, ఆమెకు వ్యతిరేకంగా వ్యభిచారం చేస్తాడు.”'
