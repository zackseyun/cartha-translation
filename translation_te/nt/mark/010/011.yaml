id: MRK.10.11
reference: Mark 10:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ὃς ⸀ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ καὶ γαμήσῃ ἄλλην μοιχᾶται ἐπ’ αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/011.yaml
  text: And he says to them[a], “Whoever divorces his wife and marries another commits adultery against her.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “ఎవరైనా తన భార్యకు విడాకులిచ్చి మరొక స్త్రీని పెళ్లి చేసుకుంటే, ఆమెకు వ్యతిరేకంగా వ్యభిచారం చేస్తాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో ఇది మార్కు తరచుగా ఉపయోగించే కథన వర్తమాన కాలం. ఆధునిక తెలుగు కథనశైలిలో సహజంగా ఉండేందుకు భూతకాల రూపాన్ని వాడినా, సంఘటన యొక్క భావం మారదు.
- source_word: αὐτοῖς
  choice: వారితో
  rationale: దత్తివాచక సర్వనామాన్ని తెలుగు మాటల సందర్భంలో సహజంగా ‘వారితో’ అని వ్యక్తం చేశాం.
- source_word: Ὃς ἂν
  choice: ఎవరైనా … చేసుకుంటే
  rationale: ఈ నిర్మాణం నిర్దిష్టం కాని సాధారణ షరతును సూచిస్తుంది; తెలుగు భాషలో ‘ఎవరైనా … చేస్తే’ దానికి సహజమైన సమానం.
- source_word: ἀπολύσῃ
  choice: విడాకులిచ్చి
  rationale: వివాహ సందర్భంలో ఈ క్రియ సాధారణంగా పంపివేయడాన్ని కాక వివాహ బంధాన్ని రద్దు చేయడాన్ని సూచిస్తుంది.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: తన భార్యకు
  rationale: γυνή అనే పదానికి ‘స్త్రీ’ లేదా ‘భార్య’ అనే అర్థాలు ఉండవచ్చు; స్వామ్యసూచనతో కూడిన విడాకుల సందర్భం ‘భార్య’ అనే అర్థాన్ని నిర్ధారిస్తుంది.
- source_word: γαμήσῃ ἄλλην
  choice: మరొకరిని పెళ్లి చేసుకుంటే
  rationale: ἄλλην స్త్రీలింగ రూపం కాబట్టి మరొక స్త్రీని సూచిస్తుంది. తెలుగులో ‘మరొకరిని పెళ్లి చేసుకోవడం’ సహజంగా ఉంది; స్పష్టమైన రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: μοιχᾶται
  choice: వ్యభిచారం చేస్తున్నాడు
  rationale: ఈ సందర్భంలోని క్రియను స్పష్టంగా, ప్రస్తుత సాధారణ ఫలితాన్ని నిలిపే విధంగా అనువదించాం.
- source_word: ἐπ’ αὐτήν
  choice: ఆమెకు విరోధంగా
  rationale: ఈ పదబంధం విడిచిపెట్టబడిన భార్యకు జరిగిన అపరాధాన్ని సూచిస్తుంది; దాని దిశాత్మక బలాన్ని తెలుగులో స్పష్టంగా నిలిపాం.
theological_decisions:
- issue: ἐπ’ αὐτήν అనే పదబంధం భార్యకు వ్యతిరేకంగా జరిగిన తప్పును సూచిస్తుందా
  choice: ‘ఆమెకు విరోధంగా వ్యభిచారం చేస్తున్నాడు’ అని అనువదించాం.
  alternative: ‘వ్యభిచారం చేస్తున్నాడు’ అని మాత్రమే చెప్పడం.
  rationale: గ్రీకు మూలంలో ఉన్న పదబంధాన్ని తొలగించకుండా, భర్త చర్య తన భార్యకు చేసిన అపరాధమనే వాక్య ప్రాధాన్యాన్ని నిలిపాం.
- issue: Ὃς ἂν లోని పుంలింగ ఏకవచన రూపాన్ని తెలుగులో ఎలా చూపాలి
  choice: ‘ఎవరైనా’ అనే సాధారణ షరతు రూపాన్ని వాడాం; ‘తన భార్య’ వల్ల తక్షణ సందర్భం స్పష్టమవుతుంది.
  alternative: ‘ఏ పురుషుడైనా’ అని స్పష్టంగా లింగాన్ని పేర్కొనడం.
  rationale: గ్రీకు నిర్మాణం నిర్దిష్టం కాని సాధారణ షరతును ఇస్తుంది. అవసరంలేని సంకుచితీకరణను నివారిస్తూ సందర్భంలోని భర్త సూచనను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. ‘ఆమెకు విరోధంగా’ కొంత గంభీరంగా వినిపించినా, ἐπ’ αὐτήν లోని ‘ఆమెకు వ్యతిరేకంగా చేసిన అపరాధం’ అనే భావాన్ని అస్పష్టత లేకుండా కాపాడుతుంది.
