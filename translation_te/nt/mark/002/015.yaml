id: MRK.2.15
reference: Mark 2:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ⸀γίνεται κατακεῖσθαι αὐτὸν ἐν τῇ οἰκίᾳ αὐτοῦ, καὶ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ, ἦσαν γὰρ πολλοὶ καὶ ⸀ἠκολούθουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/015.yaml
  text: And it happened that he was reclining at table in his house[a], and many tax collectors and sinners were reclining with Jesus and his disciples, for there were many, and they were following him.
translation:
  language: te
  text: ఒకసారి అతని ఇంట్లో[a] యేసు భోజనానికి కూర్చొని ఉండగా, అనేకమంది సుంకం వసూలు చేసేవారూ పాపులూ యేసుతోను ఆయన శిష్యులతోను కలిసి భోజనానికి కూర్చొని ఉన్నారు; ఎందుకంటే ఆయనను అనుసరించేవారు చాలామంది ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లేవి ఇంట్లో’; కొందరు దీనిని ‘యేసు ఇంట్లో’ అని అర్థం చేసుకుంటారు. గ్రీకులో కేవలం ‘అతని ఇంట్లో’ అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: γίνεται
  choice: ఆయన ... కూర్చున్నప్పుడు
  rationale: మార్కు వాడిన చారిత్రక వర్తమానాన్ని తెలుగులో సహజమైన కథన నిర్మాణంగా మార్చి, సంఘటనల క్రమాన్ని ‘అప్పుడు’ భావంతో తెలియజేస్తుంది.
- source_word: κατακεῖσθαι
  choice: భోజనానికి కూర్చున్నప్పుడు
  rationale: ప్రాచీన భోజన భంగిమ అక్షరార్థంగా ‘వాలుకొని ఉండడం’; ఆధునిక తెలుగు పాఠకునికి భోజన సందర్భాన్ని సహజంగా, తప్పుగా అర్థం కాకుండా వ్యక్తం చేయడానికి ఈ రూపం ఎంచుకున్నాం.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: తన ఇంట్లో
  rationale: గ్రీకు సర్వనామంలోని యజమాని అస్పష్టతను నిలుపుతుంది; ప్రధాన పాఠంలో లేవి లేదా యేసు అని నిర్దిష్టం చేయదు.
- source_word: τελῶναι
  choice: సుంకం వసూలు చేసేవారు
  rationale: రోమా పరిపాలనా సందర్భంలోని ఆదాయ వసూలుదారులను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: ἁμαρτωλοὶ
  choice: పాపులు
  rationale: మూలంలోని సరళమైన, సామాజిక-మతపరంగా గుర్తించబడిన వర్గపదాన్ని నేరుగా నిలుపుతుంది.
- source_word: συνανέκειντο
  choice: కలిసి భోజనానికి కూర్చున్నారు
  rationale: సహభోజన భావాన్ని, భోజన సందర్భాన్ని రెండింటినీ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μαθηταῖς
  choice: శిష్యులు
  rationale: బోధనాత్మకమైన అనుబంధం మరియు అనుసరణ భావాన్ని కలిగిన ప్రామాణిక నూతన నిబంధన పదం.
- source_word: ἦσαν γὰρ πολλοὶ
  choice: అలాంటివారు అనేకమంది ఉండి
  rationale: γάρ ఇచ్చే వివరణాత్మక సంబంధాన్ని సందర్భానికి సరిపోయే తెలుగు వాక్యానుసంధానంతో వ్యక్తం చేస్తుంది; ‘అలాంటివారు’ అనేది సుంకం వసూలు చేసేవారూ పాపులూ అనే సమీప బహువచన సమూహాన్ని సూచిస్తుంది.
- source_word: ἠκολούθουν αὐτῷ
  choice: ఆయనను అనుసరిస్తూ వచ్చారు
  rationale: అసంపూర్ణ కాలంలోని కొనసాగుతున్న లేదా అలవాటైన అనుసరణను తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ἐν τῇ οἰκίᾳ αὐτοῦ లోని ‘తన/అతని ఇల్లు’ ఎవరిది?
  choice: ప్రధాన పాఠంలో ‘తన ఇంట్లో’ అని యజమానిని నిర్దిష్టం చేయలేదు.
  alternative: ‘లేవి ఇంట్లో’ లేదా ‘యేసు ఇంట్లో’ అని స్పష్టీకరించడం.
  rationale: గ్రీకు αὐτοῦ యొక్క పూర్వపదం ఈ సందర్భంలో అస్పష్టంగా ఉంది. సమీప సందర్భం ఆధారంగా చాలామంది లేవి ఇంటిగా గ్రహిస్తారు; మరికొందరు యేసు ఇంటిగా గ్రహిస్తారు. మూలంలోని నిజమైన అస్పష్టతను అనువాదం తొలగించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి. ప్రాచీన భోజన భంగిమను అక్షరానువాదం చేయకుండా ‘భోజనానికి కూర్చోవడం’గా సహజీకరించాం; ఇంటి యజమాని విషయంలోని మూల అస్పష్టతను పాదటిప్పణితో నిలిపాం.
