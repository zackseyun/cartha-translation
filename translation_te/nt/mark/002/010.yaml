source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας⸃— λέγει τῷ παραλυτικῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/010.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he says to the paralyzed man[b][a],
translation:
  language: te
  text: '“అయితే, భూమిమీద పాపాలను క్షమించే అధికారం మనుష్య కుమారునికి[a] ఉందని మీరు తెలుసుకోవడానికి”—ఆయన పక్షవాతగ్రస్తునితో[b] ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మానవుడు.” “మనుష్య కుమారుడు” అనే గ్రీకు బిరుదు మానవత్వాన్ని సూచించే నుడికార భావాన్నీ, దానియేలు 7కు సూచననూ కలిగి ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా “పక్షవాతం ఉన్నవానితో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ
  choice: అయితే, … తెలుసుకోవడానికి
  rationale: δέ సూచించే స్వల్ప వ్యత్యాసాన్ని ‘అయితే’తో, ἵνα తెలిపే ఉద్దేశాన్ని ‘తెలుసుకోవడానికి’తో సహజమైన తెలుగులో నిలిపాం.
- source_word: εἰδῆτε
  choice: మీరు తెలుసుకోవడానికి
  rationale: రాబోయే స్వస్థత ద్వారా వారు గ్రహించవలసిన విషయాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ἐξουσίαν ἔχει
  choice: అధికారం … ఉంది
  rationale: ఇక్కడ కేవలం సామర్థ్యం కాక, పాపాలను క్షమించే హక్కు మరియు అధికారమే ప్రధాన భావం.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: యేసు ఉపయోగించిన బిరుదును, దాని మానవ సంబంధమైన భావాన్నీ దానియేలు 7తో ఉండగల సూచననూ ముందుగానే ఒకే అర్థానికి పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: ἐπὶ τῆς γῆς
  choice: భూమిమీద
  rationale: భూలోక పరిధిలో ఈ అధికారం అమలవుతున్నదనే సహజమైన భావాన్ని ఇస్తుంది.
- source_word: ἀφιέναι ἁμαρτίας
  choice: పాపాలను క్షమించే
  rationale: ఈ సందర్భంలో ἀφίημι పాపాలను మన్నించడం లేదా క్షమించడం అనే స్థిరమైన భావంలో ఉంది.
- source_word: λέγει τῷ παραλυτικῷ
  choice: ఆయన పక్షవాతం వచ్చినవానితో ఇలా అన్నాడు
  rationale: గ్రీకు చారిత్రక వర్తమానాన్ని సహజ తెలుగు కథనశైలిలో భూతకాలంగా ఇచ్చాం; substantival παραλυτικόςను సాధారణ పాఠకులకు స్పష్టంగా వివరించాం.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου అనే యేసు బిరుదు
  choice: మనుష్య కుమారుడు
  alternative: మానవుడు
  rationale: సంప్రదాయబద్ధమైన, మూలపాఠానికి దగ్గరైన బిరుదును ఉంచడం వల్ల సాధారణ మానవత్వ భావం, మెస్సీయ సంబంధ భావం, దానియేలు 7 ప్రతిధ్వని—వీటిలో ఏదో ఒక్కదానికే అనవసరంగా పరిమితం చేయబడదు.
- issue: పాపక్షమాపణకు సంబంధించి ἐξουσία అర్థం
  choice: అధికారం
  alternative: శక్తి
  rationale: ఈ సందర్భం ఒక పని చేయగల సామర్థ్యం గురించి మాత్రమే కాక, పాపాలను క్షమించే న్యాయసమ్మతమైన అధికారాన్ని గురించి చెబుతోంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలిని వాడాం. గ్రీకులో వాక్యం 11వ వచనంలో కొనసాగుతున్నందున చివర కోలన్ ఉంచాం; మధ్యలోని దీర్ఘ విరామాన్ని డాష్‌తో నిలిపాం.
