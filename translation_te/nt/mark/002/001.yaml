id: MRK.2.1
reference: Mark 2:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ⸀εἰσελθὼν πάλιν εἰς Καφαρναοὺμ δι’ ⸀ἡμερῶν ἠκούσθη ὅτι ⸂ἐν οἴκῳ⸃ ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/001.yaml
  text: And when he entered Capernaum again after some days[a], it was heard that he was at home.
translation:
  language: te
  text: 'కొన్ని రోజుల తర్వాత ఆయన మళ్లీ కపెర్నహూములోకి ప్రవేశించినప్పుడు, ఆయన ఒక ఇంట్లో[a] ఉన్నాడని తెలిసింది.


    [a] లేదా, “తన ఇంట్లో.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన ఇంట్లో.”
    reason: ἐν οἴκῳ అనేది సందర్భానుసారం సాధారణంగా ‘ఒక ఇంట్లో’ అని, లేదా నుడికారంగా ‘తన ఇంట్లో/ఇంటివద్ద’ అని అర్థమవవచ్చు. గ్రీకు పదబంధం ఇంటి యాజమాన్యాన్ని నిర్దిష్టంగా పేర్కొనదు.
lexical_decisions:
- source_word: εἰσελθὼν
  choice: ప్రవేశించినప్పుడు
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచించే అఒరిస్టు కృదంతాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా అనువదించాం.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: తిరిగి రావడం లేదా చర్య పునరావృతం కావడం అనే సాధారణ అర్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: Καφαρναούμ
  choice: కపెర్నహూము
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణంగా స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: δι’ ἡμερῶν
  choice: కొన్ని రోజుల తర్వాత
  rationale: నిర్దిష్టం కాని కొద్ది రోజుల విరామం గడిచిందనే గ్రీకు నుడికార భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἠκούσθη
  choice: వార్త వ్యాపించింది
  rationale: గ్రీకులోని వ్యక్తిరహిత కర్మణి నివేదిక సూత్రాన్ని పదశః ‘వినబడింది’ అని కాకుండా, ప్రజలకు విషయం తెలిసిందనే భావంతో సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐν οἴκῳ
  choice: ఇంట్లో
  rationale: ఈ పదబంధం ‘ఇంటివద్ద/తన నివాసంలో’ లేదా సాధారణంగా ‘ఒక ఇంట్లో’ అనే భావాలను ఇవ్వగలదు. ‘ఇంట్లో’ సహజంగా ఉండి కొంత అస్పష్టతను నిలుపుతుంది; మరో అర్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: ἐστίν
  choice: ఉన్నాడనే
  rationale: గ్రీకులో పరోక్ష వచనంలో వర్తమాన కాలం ఉన్నా, గతకాల నివేదిక సందర్భానికి తగిన సహజ తెలుగు నిర్మాణాన్ని వాడాం.
theological_decisions:
- issue: ἐν οἴκῳ అనేది యేసు తన నివాసంలో ఉన్నాడని సూచిస్తుందా, లేక సాధారణంగా ఒక ఇంట్లో ఉన్నాడని సూచిస్తుందా?
  choice: ఇంట్లో
  alternative: ఒక ఇంట్లో
  rationale: గ్రీకు పదబంధం రెండు భావాలకు వీలు కల్పిస్తుంది. ప్రధాన పాఠంలో సహజమైన, కొంత విస్తృతార్థం గల పదాన్ని ఉంచి, యేసుకు ఆ ఇల్లు స్వంతమని నిర్ధారించకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో చూపించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘వార్త వ్యాపించింది’ సాధారణ పాఠకులకు ‘వినబడింది’ కంటే సహజంగా ఉంటుంది; మూలంలోని నివేదిక భావాన్ని నిలుపుతుంది. పాదటిప్పణి సూచికను సంబంధిత ‘ఇంట్లో’ పదానికే జతచేశాం.
