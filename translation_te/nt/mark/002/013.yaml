id: MRK.2.13
reference: Mark 2:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν πάλιν παρὰ τὴν θάλασσαν· καὶ πᾶς ὁ ὄχλος ἤρχετο πρὸς αὐτόν, καὶ ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/013.yaml
  text: And he went out again beside the sea[a], and the whole crowd was coming to him[c][b], and he was teaching them.
translation:
  language: te
  text: ఆయన మళ్లీ సముద్రతీరం వెంబడి బయటికి వెళ్లాడు; జనమంతా ఆయన దగ్గరికి వస్తూ ఉండింది, ఆయన వారికి బోధిస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: బయటికి వెళ్లాడు
  rationale: ἐξέρχομαι అనే క్రియకు సందర్భానుసారమైన సహజ తెలుగు సమానార్థకం. మూలంలో లేని బయలుదేరిన స్థలాన్ని చేర్చదు.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: చర్య పునరావృతమైందనే భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: παρὰ τὴν θάλασσαν
  choice: సముద్రతీరం వెంబడి
  rationale: παρά + accusative ఇక్కడ తీరానికి ఆనుకొని వెళ్లడం లేదా ఉండడం అనే స్థల సంబంధాన్ని సూచిస్తుంది. 'వెంబడి' ఆ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: πᾶς ὁ ὄχλος
  choice: జనమంతా
  rationale: ఏకవచన సమూహవాచక నామంతో ఉన్న πᾶς ὁ అనే నిర్మాణానికి సహజమైన, సంక్షిప్తమైన తెలుగు రూపం.
- source_word: ἤρχετο
  choice: వస్తూ ఉండగా
  rationale: గ్రీకు imperfect సూచించే గతకాలంలో కొనసాగుతున్న చర్యను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; 'వస్తూనే ఉన్నారు' వంటి రూపంతో పునరావృత భావాన్ని అతిగా నిర్దేశించదు.
- source_word: πρὸς αὐτόν
  choice: ఆయన దగ్గరికి
  rationale: ఒక వ్యక్తి వైపు కదలికను సూచించే πρός భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἐδίδασκεν
  choice: బోధిస్తూ ఉన్నాడు
  rationale: గ్రీకు imperfect లోని కొనసాగుతున్న గత చర్యను కాపాడుతుంది.
- source_word: αὐτούς
  choice: వారికి
  rationale: గ్రీకులో accusative ప్రత్యక్ష కర్మ అయినప్పటికీ, 'బోధించు' అనే తెలుగు క్రియతో వ్యక్తులను సాధారణంగా దత్తివార్థక రూపంలో పేర్కొనడం సహజం; ఇది ముందున్న జనాన్ని సూచిస్తుంది.
