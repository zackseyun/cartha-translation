  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. గ్రీకు imperfect క్రియల కొనసాగింపు భావాన్ని కాపాడుతూ, తెలుగులో భారంగా అనిపించని వాక్య నిర్మాణాన్ని ఎంచుకున్నాం.
