revisions:
- from: ఆయన మళ్లీ సముద్రతీరం వెంబడి[a] బయటికి వెళ్లాడు. జనమంతా ఆయన దగ్గరికి వస్తూ ఉండగా[b], ఆయన వారికి బోధిస్తూ ఉన్నాడు.
  to: ఆయన మళ్లీ సముద్రతీరం వెంబడి బయటికి వెళ్లాడు; జనమంతా ఆయన దగ్గరికి వస్తూ ఉండింది, ఆయన వారికి బోధిస్తూ ఉన్నాడు.
  rationale: 'The revision changes only the clause relationship: the crowd’s coming and Jesus’ teaching are now expressed as coordinated ongoing past actions, matching the two Greek imperfect verbs joined by καί. Footnote b is updated to quote the revised verbal form.'
  reviewer_model: gpt-5.6-terra
