id: MRK.2.9
reference: Mark 2:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν τῷ παραλυτικῷ· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ ἆρον ⸂τὸν κράβαττόν σου⸃ καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/009.yaml
  text: 'Which is easier: to say to the paralyzed man[a], ‘Your sins are forgiven,’ or to say, ‘Get up, pick up your mat, and walk’?”'
translation:
  language: te
  text: “పక్షవాతంతో ఉన్న వ్యక్తికి, ‘నీ పాపాలు క్షమించబడ్డాయి’[a] అని చెప్పడమా, లేక ‘లేచి, నీ పడకను ఎత్తుకొని నడువు’ అని చెప్పడమా—ఏది సులభం?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నీ పాపాలు క్షమించబడి ఉన్నాయి” అని కూడా అనువదించవచ్చు. గ్రీకు క్రియ క్షమాపణ వల్ల ఏర్పడిన స్థితిని నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: ఏది సులభం?
  rationale: రెండు మాటలను పోల్చి అడిగే ప్రశ్నలోని comparative భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: εἰπεῖν
  choice: అని చెప్పడం
  rationale: రెండు ప్రత్యక్ష ఉక్తులను ఒకే విధంగా పరిచయం చేస్తూ గ్రీకు వాక్య నిర్మాణాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: τῷ παραλυτικῷ
  choice: పక్షవాతం వచ్చిన వ్యక్తితో
  rationale: పక్షవాతంతో బాధపడుతున్న వ్యక్తిని స్పష్టంగా, గౌరవప్రదంగా సూచిస్తుంది; సాంకేతికమైన లేదా వ్యక్తిని వ్యాధితోనే గుర్తించే నామవాచక ప్రయోగాన్ని నివారిస్తుంది.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: నీ పాపాలు క్షమించబడ్డాయి
  rationale: క్షమాపణను passive ప్రకటనగా సహజ తెలుగులో అందిస్తుంది. కార్యసాధకుడు ఎవరో వాక్యంలో చేర్చకుండా, మూలంలోని భావపరమైన ఉద్రిక్తతను నిలుపుతుంది.
- source_word: ἁμαρτίαι
  choice: పాపాలు
  rationale: ఈ సందర్భంలో ప్రామాణికమైన, స్పష్టమైన తెలుగు సమానం; అప్పులు లేదా అపరాధాలు అనే అదనపు రూపకార్థాన్ని చేర్చదు.
- source_word: Ἔγειρε
  choice: లేచి
  rationale: ఆ వ్యక్తి లేవాలనే ఆజ్ఞను సహజమైన ఆధునిక తెలుగు ఆజ్ఞాక్రమంలో వ్యక్తపరుస్తుంది.
- source_word: ἆρον
  choice: ఎత్తుకొని
  rationale: పరుపును పైకెత్తి తనతో తీసుకెళ్లాలనే భావాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὸν κράβαττόν σου
  choice: నీ పరుపు
  rationale: తేలికగా మోసుకెళ్లగల సాధారణ పడకను సూచిస్తుంది; ‘మంచం’ అనడం వల్ల కలిగే భారమైన నిర్మాణ భావాన్ని నివారిస్తుంది.
- source_word: περιπάτει
  choice: నడువు
  rationale: ఆజ్ఞార్థక భావాన్ని సహజంగా తెలియజేస్తుంది; సందర్భానికి అవసరం లేని కొనసాగింపు భావాన్ని జోడించదు.
theological_decisions:
- issue: పాపక్షమాపణ ప్రకటనను అనువదించడం
  choice: నీ పాపాలు క్షమించబడ్డాయి
  alternative: నీ పాపాలు క్షమించబడి ఉన్నాయి
  rationale: యేసు పలికిన క్షమాపణ ప్రకటనను passive రూపంలో ఉంచి, క్షమించేది ఎవరో లేదా అది ఎప్పుడు జరిగిందో అదనంగా నిర్ధారించదు. కనిపించని క్షమాపణ ప్రకటనకూ కనిపించే స్వస్థత ఆజ్ఞకూ మధ్య కథనంలో ఉన్న ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను కాపాడే శైలి. ప్రశ్నలోని రెండు ప్రత్యామ్నాయాలను స్పష్టంగా చూపేందుకు ‘అని చెప్పడమా ... అని చెప్పడమా—ఏది సులభం?’ అనే సహజ నిర్మాణం ఉపయోగించబడింది.
