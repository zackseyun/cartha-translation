source:
  edition: SBLGNT
  text: Σοὶ λέγω, ⸀ἔγειρε ἆρον τὸν κράβαττόν σου καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/011.yaml
  text: I say to you[a], get up, pick up your mat[b], and go to your house.
translation:
  language: te
  text: '“నేను నీతో చెబుతున్నాను: లేచి, నీ పరుపు[a] ఎత్తుకొని, నీ ఇంటికి వెళ్లు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ పడక.” గ్రీకు κράβαττος సాధారణంగా నేలపై వేసుకునే, మోసుకెళ్లగల సరళమైన నిద్ర పరుపు లేదా పడకను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఇంటికి వెళ్లు.” గ్రీకు మూలంలో అక్షరార్థంగా “నీ ఇంటికి వెళ్లు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σοὶ
  choice: నీతో
  rationale: వాక్యారంభంలో ఉన్న దత్తివాచక సర్వనామం వ్యక్తిగత సంబోధనను, స్వల్ప ఉద్ఘాటనను చూపుతుంది. ‘నీతో’ అనేది దానిని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ‘నీతోనే’ అని అనువదిస్తే గ్రీకులో ఉన్నదానికంటే ఎక్కువ వ్యత్యాసార్థక ఉద్ఘాటన కలగవచ్చు.
- source_word: λέγω
  choice: చెబుతున్నాను
  rationale: వర్తమాన కాలంలోని ప్రత్యక్ష అధికారపూర్వక మాటను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔγειρε
  choice: లేచి
  rationale: పక్షవాత రోగికి ఇచ్చిన తక్షణ ఆజ్ఞను ఆధునిక, స్పష్టమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἆρον
  choice: ఎత్తుకొని
  rationale: పరుపును పైకెత్తి వెంట తీసుకెళ్లే భౌతిక చర్యను ఆజ్ఞల వరుసలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κράβαττόν
  choice: పరుపు
  rationale: సులభంగా మోసుకెళ్లగల సాధారణ నిద్ర పరుపు లేదా పేదవారి పడకను సూచిస్తుంది. ‘మంచం’ అనడం వల్ల బరువైన చట్రంతో కూడిన పడక అనే భావం రావచ్చు.
- source_word: ὕπαγε
  choice: వెళ్లు
  rationale: సందర్భంలోని సరళమైన ఆజ్ఞకు సహజమైన సమానార్థకం; ‘వెళ్లిపో’ అనేది అవసరానికి మించిన కఠిన స్వరాన్ని కలిగించవచ్చు.
- source_word: εἰς τὸν οἶκόν σου
  choice: నీ ఇంటికి
  rationale: εἰς యొక్క దిశార్థాన్నీ, οἶκος అనే స్పష్టమైన నామవాచకాన్నీ నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: యేసు స్వస్థపరిచే ఆజ్ఞ యొక్క స్వరం, అధికారం
  choice: ‘నీతో చెబుతున్నాను’ అనే వ్యక్తిగత ప్రకటన తరువాత వరుసగా నేరమైన ఆజ్ఞలు
  alternative: మరింత సంప్రదాయ శైలిలో ‘నీతో చెప్పుచున్నాను, లేచి నీ పడక ఎత్తుకొని ఇంటికి పొమ్ము’
  rationale: మూలపాఠంలోని తక్షణ, అధికారపూర్వక స్వరాన్ని నిలుపుతూ, దానికి అదనపు సిద్ధాంత వివరణను జోడించకుండా ఆధునిక తెలుగులో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష వాక్యశైలి ఉపయోగించబడింది. మూలపాఠంలోని ఆజ్ఞల క్రమం నిలుపబడింది. ఆంగ్ల సంప్రదింపు పాఠంలో పాదసూచిక గుర్తులు వాటి విషయాలతో తారుమారుగా కనిపించినందున, [a]ను ‘పరుపు’కు, [b]ను ‘నీ ఇంటికి వెళ్లు’కు అర్థానుసారంగా జతచేశాం.
