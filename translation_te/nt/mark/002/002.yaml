source:
  edition: SBLGNT
  text: ⸀καὶ συνήχθησαν πολλοὶ ὥστε μηκέτι χωρεῖν μηδὲ τὰ πρὸς τὴν θύραν, καὶ ἐλάλει αὐτοῖς τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/002.yaml
  text: And many were gathered together[a], so that there was no longer room, not even at the door, and he was speaking the word to them.
translation:
  language: te
  text: చాలామంది కూడివచ్చారు. దాంతో ఇక చోటు లేకపోయింది; తలుపు దగ్గర కూడా చోటు లేదు. ఆయన వారికి వాక్యాన్ని[a] చెబుతూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సందేశాన్ని.” గ్రీకులో “వాక్యాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πολλοὶ
  choice: చాలామంది అక్కడ కూడివచ్చారు
  rationale: సందర్భంలో అనేకమంది ఒకేచోట చేరడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. గ్రీకు కర్మణి రూపాన్ని తెలుగులో యాంత్రికంగా అనుకరించకుండా, συν- సూచించే సమూహంగా చేరే భావాన్ని నిలుపుతుంది.
- source_word: ὥστε μηκέτι χωρεῖν
  choice: దాంతో ... ఇక చోటు లేకపోయింది
  rationale: ὥστε తెలిపే ఫలిత సంబంధాన్ని ‘దాంతో’ స్పష్టంగా చూపుతుంది; μηκέτι మరియు χωρεῖν కలిసి అక్కడ అందరికీ సరిపడే స్థలం పూర్తిగా అయిపోయిందనే భావాన్ని ఇస్తాయి.
- source_word: μηδὲ τὰ πρὸς τὴν θύραν
  choice: తలుపు దగ్గర కూడా
  rationale: తలుపు వైపు లేదా తలుపు సమీపంలోని ప్రదేశాన్ని సూచించే గ్రీకు నుడికారాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ἐλάλει αὐτοῖς
  choice: ఆయన వారికి ... చెబుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న చర్యను ‘చెబుతూ ఉన్నాడు’ నిలుపుతుంది. ‘ప్రసంగిస్తున్నాడు’ లేదా ‘బోధిస్తున్నాడు’ కంటే ఇది λαλέω యొక్క సాధారణ మాట్లాడే భావానికి దగ్గరగా ఉంటుంది.
- source_word: τὸν λόγον
  choice: వాక్యాన్ని
  rationale: గ్రీకు λόγος పదానికి రూపపరంగా దగ్గరగా ఉండి, యేసు వారికి తెలియజేస్తున్న సందేశాన్ని సూచిస్తుంది. మూలంలో లేని ‘దేవుని’ అనే విశేషణాన్ని చేర్చదు; ‘సందేశాన్ని’ అనేది సాధ్యమైన భావానువాదంగా పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: యేసు చెప్పిన τὸν λόγον యొక్క అర్థం
  choice: వాక్యాన్ని
  alternative: సందేశాన్ని; దేవుని వాక్యాన్ని
  rationale: మూలపాఠం కేవలం ‘వాక్యాన్ని’ అని చెబుతుంది. ఈ రూపం గ్రీకు పదప్రయోగాన్ని నిలుపుతూ, అది యేసు ప్రకటించిన సందేశమని పాఠకుడు సందర్భం నుండి గ్రహించేందుకు వీలు కల్పిస్తుంది. ‘దేవుని వాక్యాన్ని’ అనడం ఈ వచనంలో స్పష్టంగా లేని పదాన్ని చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన శైలి. చిన్న వాక్యాల ద్వారా జనసమ్మర్థం మరియు యేసు కొనసాగిస్తూ మాట్లాడిన చర్య స్పష్టంగా వ్యక్తమయ్యాయి.
