  text: ἦσαν δέ τινες τῶν γραμματέων ἐκεῖ καθήμενοι καὶ διαλογιζόμενοι ἐν ταῖς καρδίαις αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/006.yaml
  text: 'But some of the scribes were sitting there[a], reasoning in their hearts:'
translation:
  language: te
  text: 'కాని అక్కడ కూర్చున్న శాస్త్రులలో కొందరు తమ హృదయాల్లో[a] ఇలా తర్కించుకుంటూ ఉన్నారు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమలో తాము ఆలోచించుకుంటూ’ లేదా ‘తమ మనసుల్లో తర్కించుకుంటూ.’ గ్రీకు మూలంలో అక్షరార్థంగా ‘తమ హృదయాల్లో’ అని ఉంది; ఇది అంతరంగ ఆలోచనను సూచించే బైబిలీయ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: కాని ... ఉన్నారు
  rationale: δέ ఇక్కడ కథనాన్ని మరో వర్గం అంతరంగ స్పందనవైపు మళ్లిస్తూ స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది; ‘కాని’ ఆ వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τινες τῶν γραμματέων
  choice: శాస్త్రులలో కొందరు
  rationale: τινες తో వచ్చిన విభాజక షష్ఠీ విభక్తి, శాస్త్రులందరినీ కాక వారిలో కొందరినే సూచిస్తుంది. సువార్తల సందర్భంలో γραμματεῖςకు ‘శాస్త్రులు’ స్థిరపడిన, సంక్షిప్తమైన పదం.
- source_word: ἐκεῖ
  choice: అక్కడ
  rationale: స్థలాన్ని సూచించే సాధారణ క్రియావిశేషణాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: καθήμενοι
  choice: కూర్చున్న
  rationale: దృశ్యంలో వారి భంగిమను, కొనసాగుతున్న స్థితిని సహజ కథన శైలిలో తెలియజేస్తుంది.
- source_word: διαλογιζόμενοι
  choice: తర్కించుకుంటున్నారు
  rationale: ఈ క్రియ అంతరంగ పరిశీలన, ఆలోచన లేదా తర్కాన్ని సూచించగలదు. తరువాత వచ్చే అభ్యంతరానికి ముందు జరుగుతున్న లోపలి తర్కాన్ని ‘తర్కించుకుంటున్నారు’ స్పష్టంగా, అయితే అతివ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: తమ హృదయాల్లో
  rationale: అంతరంగ ఆలోచనకు నిలయంగా హృదయాన్ని చెప్పే బైబిలీయ నుడికారాన్ని యథాతథంగా నిలుపుతుంది; దానిని కేవలం ఆధునిక ‘మనసు’ భావనగా మార్చదు.
theological_decisions:
- issue: καρδίαις అనే మానవ స్వభావ సంబంధ నుడికారం
  choice: తమ హృదయాల్లో
  alternative: తమలో తాము; తమ మనసుల్లో
  rationale: మూలపాఠం హృదయాన్ని అంతరంగ ఆలోచన జరిగే స్థలంగా పేర్కొంటుంది. ‘హృదయాల్లో’ అని ఉంచడం ద్వారా ఆధునిక మనసు–హృదయం విభజనను పాఠంలోకి చొప్పించకుండా దాని భావలోకాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘శాస్త్రులు’ సువార్తల సందర్భంలో గుర్తింపుపొందిన పదంగా నిలుపబడింది; ‘తమ హృదయాల్లో’ అనే మూల నుడికారానికి సాధారణ పాఠకుల కోసం పాదసూచికలో వివరణ ఇచ్చబడింది.
