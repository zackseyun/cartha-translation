  edition: SBLGNT
  text: ὥστε κύριός ἐστιν ὁ υἱὸς τοῦ ἀνθρώπου καὶ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/028.yaml
  text: So the Son of Man is Lord even of the Sabbath[a].
translation:
  language: te
  text: కాబట్టి మనుష్యకుమారుడు విశ్రాంతిదినానికి కూడా ప్రభువు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అందువల్ల మనుష్యకుమారుడు విశ్రాంతిదినానికి సైతం ప్రభువు.’ గ్రీకు సంధిపదాన్ని ‘మరియు/కూడా’ అని అనువదించవచ్చు; ఇక్కడ అది ఆయన అధికారం ఎంతవరకు విస్తరిస్తుందో నొక్కిచెప్పే ‘సైతం’ అనే భావాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: కాబట్టి
  rationale: ముందటి వాదన నుండి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: ఈ సందర్భంలో అధికారాన్నీ సార్వభౌమత్వాన్నీ సూచించే బలమైన పదం; క్రీస్తును గురించిన వాక్యబలాన్ని తగ్గించదు.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: సువార్తల్లో యేసు వాడే స్థిరమైన బిరుదును, దాని అంతర్గ్రంథ మరియు క్రీస్తు సంబంధిత ప్రతిధ్వనులను కాపాడుతుంది.
- source_word: καὶ
  choice: కూడా
  rationale: ఇక్కడ విశ్రాంతిదినం వరకూ విస్తరించే అధికారాన్ని ఉద్ఘాటించే అధిరోహణాత్మక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: σαββάτου
  choice: విశ్రాంతిదినానికి
  rationale: సబ్బాతును సూచించే సాధారణ, అర్థవంతమైన తెలుగు పదం; షష్ఠీ సంబంధాన్ని తెలుగు విభక్తి ద్వారా సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: విశ్రాంతిదినంపై యేసు అధికారాన్ని తెలిపే క్రీస్తు సంబంధిత బలం
  choice: మనుష్యకుమారుడు విశ్రాంతిదినానికి ప్రభువు అని నేరుగా అనువదించడం
  alternative: ‘విశ్రాంతిదినం విషయంలో అధికారం కలవాడు’ అని బలహీనంగా చెప్పడం
  rationale: κύριος పరిమిత అనుమతిని మాత్రమే కాక ప్రభుత్వాన్ని సూచిస్తుంది; మూలపాఠంలోని బలమైన వాదనను అదనపు సిద్ధాంత వివరణ లేకుండా నిలుపుతుంది.
- issue: ‘మనుష్యకుమారుడు’ అనే పదబంధం ఎవరిని సూచిస్తుంది
  choice: యేసు బిరుదుగా ‘మనుష్యకుమారుడు’ అనే రూపాన్ని నిలుపుకోవడం
  alternative: ‘మానవుడు’ లేదా ‘మనిషి’ అని సామాన్యార్థంలో మార్చడం
  rationale: మార్కు సువార్తలో ఇది యేసు తనను తాను సూచించుకునే బిరుదుగా పనిచేస్తుంది; దానిలోని వేదాంతపరమైన ఉద్వేగాన్నీ సాధ్యమైన దానియేలు గ్రంథ ప్రతిధ్వనినీ పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. స్థిరమైన బైబిలు బిరుదైన ‘మనుష్యకుమారుడు’ మరియు అధికారబలాన్ని తెలిపే ‘ప్రభువు’ నిలుపబడ్డాయి.
