id: MRK.2.21
reference: Mark 2:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Οὐδεὶς ἐπίβλημα ῥάκους ἀγνάφου ἐπιράπτει ἐπὶ ⸂ἱμάτιον παλαιόν⸃· εἰ δὲ μή, αἴρει τὸ πλήρωμα ⸀ἀπ’ αὐτοῦ τὸ καινὸν τοῦ παλαιοῦ, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/021.yaml
  text: No one sews a patch of unshrunk cloth onto an old garment[a]; otherwise[b], the patch pulls away from it—the new from the old—and a worse tear results.
translation:
  language: te
  text: ఎవరూ కుదించని బట్ట ముక్కను పాత వస్త్రానికి అతుకుగా కుట్టరు[a]. లేకపోతే, ఆ కొత్త అతుకు పాత వస్త్రాన్ని లాగి విడిపోతుంది[b]; చినుగు మరింత పెద్దదవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇంకా ఫుల్లింగ్ చేయని బట్ట ముక్కను.” ఫుల్లింగ్ అనేది బట్టను కుదించడానికి చేసే సంప్రదాయ ప్రక్రియ; అది చేయని బట్ట తరువాత కుదియవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “నింపే ముక్క దానిలోనుండి తీసుకుంటుంది—కొత్తది పాతదాని నుండి.” ఇది క్లిష్టమైన గ్రీకు పదబంధం; భావం ఏమిటంటే, కొత్త అతుకు పాత వస్త్రాన్ని లాగి విడిపోవడం వల్ల చినుగు మరింత పెద్దదవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίβλημα
  choice: అతుకు
  rationale: చినిగిన వస్త్రాన్ని బాగుచేయడానికి దానిపై కుట్టే బట్ట ముక్కను ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: ῥάκους ἀγνάφου
  choice: ముడిబట్ట ముక్క
  rationale: ఇంకా నూలుదట్టింపు లేదా కుదింపు ప్రక్రియకు లోనుకాని బట్ట అనే భావాన్ని సాధారణ పాఠకునికి సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἐπιράπτει
  choice: కుట్టరు
  rationale: వస్త్రంపై అతుకును దారంతో జతచేసే నిర్దిష్ట చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἱμάτιον παλαιόν
  choice: పాత వస్త్రం
  rationale: ఒక నిర్దిష్ట పైవస్త్రంగా అతిగా పరిమితం చేయకుండా ἱμάτιον యొక్క విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: εἰ δὲ μή
  choice: అలా కుడితే
  rationale: గ్రీకు వాక్యంలోని ప్రతికూల షరతు సూచించే పరిణామాన్ని తెలుగులో సహజమైన షరతు రూపంలో తెలియజేస్తుంది.
- source_word: αἴρει
  choice: లాగివేస్తుంది
  rationale: కొత్త అతుకు పాత వస్త్రం నుండి విడిపోతూ దానిని లాగే సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది; మూలంలోని సాధారణ క్రియకు ఉన్న స్వల్ప అస్పష్టతను పాదసూచికలో చూపిస్తుంది.
- source_word: τὸ πλήρωμα
  choice: ఆ కొత్త అతుకు
  rationale: చినుగును నింపే ముక్కను సందర్భానుసారంగా స్పష్టీకరిస్తుంది.
- source_word: τὸ καινὸν τοῦ παλαιοῦ
  choice: కొత్త అతుకు పాత వస్త్రం నుండి
  rationale: కొత్తదానికి, పాతదానికి మధ్య గ్రీకులోని వ్యత్యాసాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: χεῖρον σχίσμα γίνεται
  choice: చినుగు మరింత పెద్దదవుతుంది
  rationale: ఫలితంగా చీలిక మునుపటికంటే తీవ్రమవుతుందనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా చెబుతుంది.
