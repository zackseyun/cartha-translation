  to: ఎవరూ కుదించని బట్ట ముక్కను పాత వస్త్రానికి అతుకుగా కుట్టరు[a]. లేకపోతే, ఆ కొత్త అతుకు పాత వస్త్రాన్ని లాగి విడిపోతుంది[b]; చినుగు మరింత పెద్దదవుతుంది.
