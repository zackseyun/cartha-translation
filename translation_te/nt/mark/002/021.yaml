translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా ‘ముడిబట్ట,’ ‘అతుకు,’ ‘చినుగు’ వంటి సుపరిచిత పదాలు వాడబడ్డాయి. వస్త్ర మరమ్మత్తు దృశ్యం స్పష్టంగా ఉండేలా వాక్యక్రమం సహజీకరించబడింది; మూలంలోని కఠినమైన పదబంధం పాదసూచికలో అక్షరార్థానికి దగ్గరగా ఇవ్వబడింది.
