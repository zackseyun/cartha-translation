id: MRK.2.7
reference: Mark 2:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τί οὗτος οὕτως λαλεῖ; ⸀βλασφημεῖ· τίς δύναται ἀφιέναι ἁμαρτίας εἰ μὴ εἷς ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/007.yaml
  text: Why does this man speak like this? He is blaspheming! Who can forgive sins except God alone?[a][b]
translation:
  language: te
  text: “ఇతడు ఇలా ఎందుకు మాట్లాడుతున్నాడు? దేవదూషణ చేస్తున్నాడు! ఒక్క దేవుడు తప్ప పాపాలను ఎవరు క్షమించగలరు?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏకైక దేవుడు తప్ప.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ... οὕτως λαλεῖ
  choice: ఇలా ఎందుకు మాట్లాడుతున్నాడు?
  rationale: గ్రీకు ప్రశ్నార్థక ప్రయోగం మాటల విషయాన్ని ‘ఏమిటి?’ అని అడగడం కంటే, అతడు ఈ విధంగా మాట్లాడటాన్ని ‘ఎందుకు?’ అని ప్రశ్నిస్తోంది; అందువల్ల సహజమైన ఆధునిక తెలుగు ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: οὗτος
  choice: ఇతడు
  rationale: యేసును కొంత దూరంగా సూచించే ధోరణిని సంక్షిప్తంగా నిలుపుతుంది; ‘ఈ మనిషి’ కంటే సహజంగా ఉండి, మూలంలో ఉన్నదానికంటే అధిక అవమానాన్ని జోడించదు.
- source_word: βλασφημεῖ
  choice: దేవదూషణ చేస్తున్నాడు
  rationale: తక్షణంగా పలికిన ఆరోపణను వర్తమాన కొనసాగింపు భావంతో తెలియజేస్తుంది. తెలుగులో ‘దేవదూషణ’ ఈ సందర్భంలోని మతపరమైన ఆరోపణను స్పష్టంగా అందిస్తుంది.
- source_word: ἀφιέναι ἁμαρτίας
  choice: పాపాలను క్షమించగలరు
  rationale: ఈ సందర్భంలో ἀφίημι పదానికి స్థిరమైన భావం ‘క్షమించడం’; ‘విడిచిపెట్టడం’ వంటి అక్షరార్థ రూపాలు భావాన్ని అస్పష్టం చేస్తాయి.
- source_word: εἰ μὴ εἷς ὁ θεός
  choice: ఒక్క దేవుడు తప్ప
  rationale: మూలంలోని మినహాయింపు మరియు ఏకైకత్వ భావాలను రెండింటినీ సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: οὗτοςలో అవమాన ధోరణిని ఎంతవరకు ప్రతిబింబించాలి
  choice: ఇతడు
  alternative: ఈ మనిషి / వీడు
  rationale: శాస్త్రుల విరోధ ధోరణి సందర్భంలో స్పష్టమే; అయితే ‘వీడు’ వంటి రూపం మూలపాఠం నిర్బంధించని అదనపు అవమానాన్ని చేర్చుతుంది.
- issue: βλασφημεῖ అనే ఆరోపణ బలం
  choice: దేవదూషణ చేస్తున్నాడు!
  alternative: దూషిస్తున్నాడు! / ఇది దేవదూషణ!
  rationale: ఇది యేసు మాటలపై శాస్త్రులు చేసిన మతపరమైన తీర్పుగా అనువదించబడింది; కథనంలోని క్రీస్తు సంబంధిత ఉద్రిక్తతను అనువాదమే ముందుగా పరిష్కరించదు.
- issue: εἰ μὴ εἷς ὁ θεός యొక్క నిర్మాణం
  choice: ఒక్క దేవుడు తప్ప
  alternative: ఏకైక దేవుడు తప్ప / దేవుడు ఒక్కడే తప్ప
  rationale: ‘ఒక్క దేవుడు తప్ప’ అనేది ‘దేవుడు మాత్రమే’ అనే భావానికీ ‘ఒకే దేవుడు’ అనే సాధ్యమైన నిర్మాణానికీ దగ్గరగా ఉండి, వాక్యాన్ని అతిగా వ్యాఖ్యానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రత్యక్ష సంభాషణ. ‘దేవదూషణ’ సాధారణ పాఠకునికి అర్థమయ్యే స్థిరమైన బైబిలు-మతపరమైన పదంగా నిలుపబడింది.
