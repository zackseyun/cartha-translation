  source_fidelity: గ్రీకు Τί ... οὕτως λαλεῖ; అనే ప్రయోగంలోని కారణార్థక ప్రశ్నను “ఇలా ఎందుకు మాట్లాడుతున్నాడు?” అని సహజంగా, విశ్వసనీయంగా ఇచ్చింది. οὗτος యొక్క కొంత దూరం ఉంచే సూచనకు “ఇతడు” సరిపోతుంది; βλασφημεῖ ఆరోపణను “దేవదూషణ చేస్తున్నాడు!” అని, ἀφιέναι ἁμαρτίας ను “పాపాలను క్షమించగలరు” అని, εἰ μὴ εἷς ὁ θεός ను “ఒక్క దేవుడు తప్ప” అని సరిగ్గా ప్రతిబింబించింది. ఆరోపణను కథనంలోని శాస్త్రుల మాటగానే ఉంచి, దానికి అనువాదం ద్వారా తీర్పు చెప్పలేదు.
