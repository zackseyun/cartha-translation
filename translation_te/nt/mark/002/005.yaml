source:
  edition: SBLGNT
  text: ⸂καὶ ἰδὼν⸃ ὁ Ἰησοῦς τὴν πίστιν αὐτῶν λέγει τῷ παραλυτικῷ· Τέκνον, ⸂ἀφίενταί σου⸃ αἱ ⸀ἁμαρτίαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/005.yaml
  text: And Jesus[a], seeing their faith, says to the paralyzed man, “Child, your sins are forgiven.”
translation:
  language: te
  text: 'యేసు వారి విశ్వాసాన్ని చూసి, పక్షవాతంతో ఉన్న ఆ మనిషితో ఇలా అన్నాడు: “బిడ్డా,[a] నీ పాపాలు క్షమించబడ్డాయి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కుమారుడా”; గ్రీకు పదమైన τέκνον ఆప్యాయమైన సంబోధనగా వాడబడుతుంది; దాని అర్థం “బిడ్డ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: చూసి
  rationale: ὁράω యొక్క భూతకాల క్రియావిశేషణ రూపాన్ని సహజమైన తెలుగు పూర్వకాలిక క్రియారూపంతో చూపిస్తుంది; చూడటం ప్రధాన క్రియకు ముందున్న చర్యగా నిలుస్తుంది.
- source_word: πίστιν
  choice: విశ్వాసాన్ని
  rationale: ఇక్కడ ఈ పదం ఆ మనిషిని యేసు దగ్గరకు తీసుకొచ్చినవారిలో స్పష్టంగా కనిపించిన నమ్మకాన్ని సూచిస్తుంది; ప్రామాణిక బైబిలు పదజాలమైన ‘విశ్వాసం’ దానిని సముచితంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτῶν
  choice: వారి
  rationale: బహువచన సర్వనామాన్ని అలాగే ఉంచి, ఆ విశ్వాసం అక్కడున్న సమూహానికి చెందినదని తెలియజేస్తుంది; ఆ సమూహంలో ఎవరు ఉన్నారనే విషయాన్ని అనవసరంగా నిర్ధారించదు.
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమాన కాలం మార్కు కథనానికి సజీవత ఇస్తుంది; అయితే తెలుగు కథనంలో ‘అన్నాడు’ సహజంగా ఉండి సంఘటన క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: παραλυτικῷ
  choice: పక్షవాతంతో ఉన్న ఆ మనిషితో
  rationale: నామవాచకంగా వాడిన విశేషణం పక్షవాతం ఉన్న వ్యక్తిని సూచిస్తుంది. ఈ రూపం ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: Τέκνον
  choice: బిడ్డా
  rationale: ఇది ఆప్యాయంగా సంబోధించే, వ్యాకరణపరంగా లింగనిరపేక్షమైన పదం. ‘బిడ్డా’ దాని కుటుంబసంబంధమైన వెచ్చదనాన్ని నిలుపుతుంది; సందర్భానుసారమైన ‘కుమారుడా’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: నీ పాపాలు క్షమించబడ్డాయి
  rationale: గ్రీకు వర్తమాన కర్మణి రూపంలోని ప్రత్యక్ష ప్రకటన బలాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. క్షమించేది ఎవరో గ్రీకు వాక్యంలాగే చెప్పకుండా వదిలేస్తుంది.
- source_word: ἁμαρτίαι
  choice: పాపాలు
  rationale: బహువచనాన్ని నిలుపుతూ ἁμαρτίαιకి ప్రామాణికమైన, సాధారణంగా అర్థమయ్యే తెలుగు సమానార్థకాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: యేసు చేసిన క్షమాపణ ప్రకటన స్వభావం
  choice: “నీ పాపాలు క్షమించబడ్డాయి” అనే ప్రత్యక్ష ప్రకటన
  alternative: “నీ పాపాలు క్షమించబడుతున్నాయి” లేదా “నీ పాపాలు క్షమించబడి ఉన్నాయి”
  rationale: ఈ మాటలు క్షమాపణను ప్రస్తుతం నిజమైన స్థితిగా ప్రకటిస్తున్నాయి. దాని విధానం, కాలసూక్ష్మత లేదా కర్త గురించి మూలపాఠం చెప్పనిదాన్ని అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘పక్షవాతంతో ఉన్న ఆ మనిషి’ అనే వ్యక్తి-కేంద్రిత ప్రయోగం పాఠకులకు సులభంగా అర్థమవుతుంది. ఆప్యాయ సంబోధనను ‘బిడ్డా’గా ఉంచి దాని ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
