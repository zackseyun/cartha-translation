source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν ἐν ⸂ἐκείνῃ τῇ ἡμέρᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/020.yaml
  text: But days will come when the bridegroom is taken away from them[a], and then they will fast in that day.
translation:
  language: te
  text: అయితే పెళ్లికుమారుడు వారి నుండి తీసివేయబడతాడో, అలాంటి రోజులు వస్తాయి; అప్పుడు ఆ రోజున[a] వారు ఉపవాసం ఉంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకు పదబంధం ఏకవచనంలో ఉంది: ‘ఆ రోజున’; ‘ఆ రోజుల్లో’ కాదు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: అయితే ... రోజులు వస్తాయి
  rationale: మునుపటి పరిస్థితితో ఉన్న వ్యత్యాసాన్ని δέ సూచిస్తున్నందున ‘అయితే’ అని అనువదించాం. ‘రోజులు వస్తాయి’ అనే ప్రయోగం గ్రీకు భాషలోని భవిష్యత్ కాలసూచక నుడికారాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὅταν
  choice: తీసివేయబడే
  rationale: ἀπαρθῇతో కలిసి భవిష్యత్తులో జరిగే సందర్భాన్ని సూచిస్తుంది. తెలుగులో సంబంధార్థక క్రియారూపం ద్వారా ‘ఎప్పుడు’ అనే భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: ἀπαρθῇ ἀπ’ αὐτῶν
  choice: వారి నుండి తీసివేయబడే
  rationale: కర్మణి ప్రయోగాన్ని అలాగే ఉంచి, ఎవరు తీసివేస్తారో లేదా ఏ విధంగా తీసివేస్తారో పేర్కొనలేదు. ‘వారి నుండి’ వేరుచేయబడటాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὁ νυμφίος
  choice: పెళ్లికుమారుడు
  rationale: వివాహ రూపకాన్ని స్పష్టంగా నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదాన్ని ఎంచుకున్నాం.
- source_word: καὶ τότε
  choice: అప్పుడు
  rationale: పెళ్లికుమారుడు తీసివేయబడిన తరువాత ఉపవాసం జరుగుతుందనే క్రమాన్ని స్పష్టంగా చూపుతుంది.
- source_word: νηστεύσουσιν
  choice: ఉపవాసం ఉంటారు
  rationale: మతపరమైన ఆచారాన్ని సూచించే νηστεύωకు సహజమైన, స్థిరమైన తెలుగు ప్రయోగం.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ఆ రోజున
  rationale: గ్రీకు పదబంధంలోని ఏకవచనాన్ని నిలుపుతూ, కాలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: యేసును పెళ్లికుమారునిగా సూచించే రూపకం
  choice: ‘పెళ్లికుమారుడు’ అనే రూపకాన్ని యథాతథంగా ఉంచడం
  alternative: ‘నేను వారి నుండి తీసివేయబడినప్పుడు’ అని స్పష్టీకరించడం
  rationale: సందర్భంలో యేసు తనను గురించే మాట్లాడుతున్నాడని అర్థమైనా, గ్రీకు పాఠం ప్రత్యక్షంగా ‘నేను’ అనకుండా పెళ్లికుమారుని రూపకాన్ని వాడుతుంది. దాని సాహిత్య, వేదాంత బలాన్ని అనువాదం నిలుపుతుంది.
- issue: పెళ్లికుమారుడు తీసివేయబడే విధానం
  choice: కర్తను, విధానాన్ని పేర్కొనకుండా కర్మణి రూపాన్ని నిలుపడం
  alternative: ‘చంపబడి వారి నుండి తీసివేయబడినప్పుడు’ లేదా ‘బలవంతంగా తీసుకుపోబడినప్పుడు’
  rationale: ఇది యేసు మరణాన్ని ముందుగా సూచిస్తున్నట్లు అర్థం చేసుకోవచ్చు; అయితే ఈ వాక్యం కర్తనుగానీ, తీసివేయబడే విధానాన్నిగానీ స్పష్టంగా చెప్పదు. అందువల్ల ఆ అంతర్లీన ఉద్వేగాన్ని పరిష్కరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని అనుసరించాం. ‘పెళ్లికుమారుడు,’ ‘ఉపవాసం ఉంటారు’ వంటి సాధారణంగా అర్థమయ్యే పదాలతో మూలంలోని వివాహ రూపకాన్నీ, భవిష్యత్ సూచననూ నిలుపుకున్నాం.
