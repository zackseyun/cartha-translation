  verdict: revise
  source_fidelity: The draft accurately preserves the contrast, future expectation, passive removal, separation from the disciples, bridegroom metaphor, subsequent fasting, and the singular final temporal expression. However, Telugu word order in the first sentence can more clearly attach the future-contingency clause (‘when’) to the bridegroom’s removal, rather than making it sound as though ‘days’ themselves are being removed.
  naturalness: ‘పెళ్లికుమారుడు’ and ‘ఉపవాసం ఉంటారు’ are natural modern standard Telugu. Recasting the opening as ‘పెళ్లికుమారుడు వారి నుండి తీసివేయబడే రోజులు వస్తాయి’ is structurally possible but mildly awkward and briefly susceptible to an attachment ambiguity. An explicit ‘ఎప్పుడు’ is more natural and precise here.
  terminology: ‘పెళ్లికుమారుడు’ appropriately renders νυμφίος without explicating the metaphor. ‘ఉపవాసం ఉంటారు’ is the established Telugu expression for fasting. The passive ‘తీసివేయబడతాడో’ retains the source’s unstated agent and manner.
  issues:
  - severity: low
    issue: Opening temporal clause has a potential Telugu attachment ambiguity.
    rationale: In ‘పెళ్లికుమారుడు వారి నుండి తీసివేయబడే రోజులు వస్తాయి,’ the relative clause immediately precedes ‘రోజులు’ and can momentarily be parsed as describing the days. Greek ὅταν unambiguously introduces the occasion of the bridegroom’s removal. Using ‘ఎప్పుడు … తీసివేయబడతాడో’ makes that relationship explicit without adding interpretation.
  revised_text: అయితే పెళ్లికుమారుడు వారి నుండి తీసివేయబడతాడో, అలాంటి రోజులు వస్తాయి; అప్పుడు ఆ రోజున[a] వారు ఉపవాసం ఉంటారు.
  revised_footnotes:
