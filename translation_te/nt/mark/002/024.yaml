id: MRK.2.24
reference: Mark 2:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οἱ Φαρισαῖοι ἔλεγον αὐτῷ· Ἴδε τί ⸀ποιοῦσιν τοῖς σάββασιν ὃ οὐκ ἔξεστιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/024.yaml
  text: And the Pharisees were saying to him[a], “Look, why are they doing what is not permitted on the Sabbath?”
translation:
  language: te
  text: 'పరిసయ్యులు ఆయనతో ఇలా అన్నారు: “చూడండి, వీరు సబ్బాతు రోజున అనుమతి లేనిది ఎందుకు చేస్తున్నారు?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చూడండి, వీరు సబ్బాతు రోజున అనుమతి లేని ఏ పని చేస్తున్నారు?” గ్రీకులోని τί అనే పదానికి “ఏమి/ఏ పని” అనే అర్థం కూడా ఉండవచ్చు; అయితే ఈ సందర్భంలో “ఎందుకు” అనే భావమే ఎక్కువ సంభావ్యమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: అప్పుడు
  rationale: కథన ప్రవాహంలో ముందరి సంఘటనతో ఈ మాటలను సహజంగా కలుపుతుంది; బలమైన కారణార్థాన్ని చేర్చదు.
- source_word: οἱ Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: ఈ యూద మతవర్గానికి ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన పేరు.
- source_word: ἔλεγον
  choice: అని అంటూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న లేదా పదేపదే పలికిన మాటల భావాన్ని నిలుపుతుంది.
- source_word: αὐτῷ
  choice: ఆయనతో
  rationale: ఇది యేసును సూచించే పరోక్ష కర్మ; తెలుగులో గౌరవప్రదంగా, సహజంగా ఉంది.
- source_word: Ἴδε
  choice: చూడండి
  rationale: దృష్టిని ఆకర్షించే ఆజ్ఞార్థక ప్రయోగాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τί
  choice: ఎందుకు
  rationale: ఫిర్యాదు సందర్భంలో τί క్రియావిశేషణార్థంగా ‘ఎందుకు’ అనే భావం ఇవ్వడం అత్యంత సహజం; ‘ఏమి’ అనే రూపసాధ్యాన్ని పాదసూచికలో ఉంచాం.
- source_word: ποιοῦσιν
  choice: వీరు ... చేస్తున్నారు
  rationale: ప్రత్యక్ష సంభాషణలోని వర్తమాన, కొనసాగుతున్న చర్యను సహజంగా వ్యక్తం చేస్తుంది; ‘వీరు’ మాట్లాడుతున్నవారి ఎదుట కనిపిస్తున్న శిష్యులను సూచిస్తుంది.
- source_word: τοῖς σάββασιν
  choice: విశ్రాంతి రోజున
  rationale: గ్రీకులోని బహువచన రూపం ఇక్కడ ఒక విశ్రాంతి దినాన్ని సూచించే సెమిటిక్ ప్రభావిత ప్రయోగం; తెలుగులో ఏకవచనం సహజం.
- source_word: ὃ οὐκ ἔξεστιν
  choice: చేయకూడనిదాన్ని
  rationale: అనుమతి లేదా ధర్మబద్ధత లేదనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలుపుతుంది; అది ఏ నియమవ్యవస్థ ప్రకారం నిషిద్ధమో అనవసరంగా నిర్ధారించదు.
theological_decisions:
- issue: పరిసయ్యుల అభ్యంతరానికి ఆధారమైన నియమం
  choice: ‘చేయకూడనిది’ అని మాత్రమే అనువదించి, నిషేధానికి ధర్మశాస్త్రమా, పరిసయ్యుల సంప్రదాయమా, లేక విస్తృత మతన్యాయ వ్యాఖ్యానమా ఆధారమో నిర్దిష్టంగా చెప్పలేదు.
  alternative: ‘ధర్మశాస్త్రానికి విరుద్ధమైనది’ లేదా ‘మోషే ధర్మశాస్త్రం నిషేధించినది’ అని స్పష్టీకరించడం.
  rationale: οὐκ ἔξεστιν అనుమతి లేదని మాత్రమే చెబుతుంది. నిషేధానికి ఖచ్చితమైన మూలాన్ని అనువాదమే నిర్ణయించకుండా మూలపాఠంలోని మతపరమైన ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘సబ్బాతు’ అనే లిప్యంతరీకరణకు బదులుగా అర్థస్పష్టమైన ‘విశ్రాంతి రోజు’ను ఎంచుకున్నాం; మాటల కొనసాగింపును ‘అంటూ ఉన్నారు’తో నిలిపాం.
