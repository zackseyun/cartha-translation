revisions:
- from: అప్పుడు పరిసయ్యులు ఆయనతో, “చూడండి, విశ్రాంతి రోజున చేయకూడనిదాన్ని వీరు ఎందుకు చేస్తున్నారు?[a]” అని అంటూ ఉన్నారు.
  to: 'పరిసయ్యులు ఆయనతో ఇలా అన్నారు: “చూడండి, వీరు సబ్బాతు రోజున అనుమతి లేనిది ఎందుకు చేస్తున్నారు?”[a]'
  rationale: The revision removes the extra temporal implication of ‘అప్పుడు,’ replaces an unidiomatic reporting construction with natural modern Telugu, and uses ‘సబ్బాతు రోజు’ to retain the source term’s specific historical-religious reference. It preserves the contextual ‘why’ reading of τί and retains the legitimate ‘what’ alternative in the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:00:50Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the Pharisees, their address to Jesus, the complaint, and the contextual ‘why’ sense of τί. However, ‘అప్పుడు’ adds a temporal nuance not expressed by καί, and ‘విశ్రాంతి రోజు’ can obscure that σάββασιν denotes the named Sabbath observance. ‘అని అంటూ ఉన్నారు’ is also an awkward and redundant attempt to reproduce the Greek imperfect.
  naturalness: The direct question is broadly natural, but the reporting clause ‘అని అంటూ ఉన్నారు’ is not idiomatic modern standard Telugu. A simple past reporting verb is natural in Telugu narrative and does not materially alter the complaint’s force.
  terminology: ‘పరిసయ్యులు’ is standard. ‘సబ్బాతు రోజు’ preserves the identifiable religious-calendar term while remaining clear for modern readers. ‘అనుమతి లేనిది’ conveys οὐκ ἔξεστιν without deciding whether the alleged prohibition rests on Torah, tradition, or another legal interpretation.
  issues:
  - severity: low
    issue: Added temporal connective
    rationale: ‘అప్పుడు’ means ‘then/at that time,’ whereas καί is simply connective here. It should not introduce temporal sequencing beyond the source.
  - severity: medium
    issue: Awkward reporting clause
    rationale: ‘అని అంటూ ఉన్నారు’ is redundant and unnatural. Telugu narrative idiom is better served by ‘ఇలా అన్నారు’; the Greek imperfect need not be mechanically reproduced at the expense of naturalness.
  - severity: medium
    issue: Sabbath term rendered too generically
    rationale: ‘విశ్రాంతి రోజు’ communicates rest day but can sound like any day of rest. ‘సబ్బాతు రోజు’ preserves the specific Jewish Sabbath reference in σάββασιν.
  revised_text: 'పరిసయ్యులు ఆయనతో ఇలా అన్నారు: “చూడండి, వీరు సబ్బాతు రోజున అనుమతి లేనిది ఎందుకు చేస్తున్నారు?”[a]'
  revised_footnotes:
