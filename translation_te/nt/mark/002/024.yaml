    reason: lexical_alternative
  revision_rationale: The revision removes the extra temporal implication of ‘అప్పుడు,’ replaces an unidiomatic reporting construction with natural modern Telugu, and uses ‘సబ్బాతు రోజు’ to retain the source term’s specific historical-religious reference. It preserves the contextual ‘why’ reading of τί and retains the legitimate ‘what’ alternative in the footnote.
