id: MRK.2.8
reference: Mark 2:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐπιγνοὺς ὁ Ἰησοῦς τῷ πνεύματι αὐτοῦ ὅτι ⸀οὕτως διαλογίζονται ἐν ἑαυτοῖς ⸀λέγει αὐτοῖς· Τί ταῦτα διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/008.yaml
  text: And immediately Jesus[a], perceiving in his spirit that they were reasoning this way within themselves, said to them, “Why are you reasoning about these things in your hearts?”
translation:
  language: te
  text: 'వెంటనే యేసు[a], వారు తమలో తాము ఈ విధంగా ఆలోచిస్తున్నారని తన ఆత్మలో గ్రహించి, వారితో ఇలా అన్నాడు: “మీ హృదయాల్లో ఈ విషయాల గురించి ఎందుకు ఆలోచిస్తున్నారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన ఆత్మలో తెలుసుకొని,” లేదా “తనలో తాను గుర్తించి.” యేసు గ్రహించిన విధానాన్ని గ్రీకు వాక్యం స్పష్టంగా నిర్వచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు వర్ణనలోని వేగాన్ని, సహజమైన ఆధునిక తెలుగులోని తక్షణ భావాన్ని నిలుపుతుంది.
- source_word: ἐπιγνοὺς
  choice: గ్రహించి
  rationale: స్పష్టంగా తెలుసుకోవడం లేదా గుర్తించడం అనే భావాన్ని ఇస్తుంది; యేసు ఎలా తెలుసుకున్నాడో అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: తన ఆత్మలో
  rationale: గ్రీకు దత్తివిభక్తిలో ఉన్న పరిధి లేదా సాధనార్థపు సందిగ్ధతను వీలైనంతవరకు నిలుపుతూ, యేసు అంతరంగ గ్రహింపును సూచిస్తుంది.
- source_word: οὕτως
  choice: ఈ విధంగా
  rationale: వారి ఆలోచనా తీరును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: διαλογίζονται
  choice: ఆలోచిస్తున్నారు
  rationale: ఇక్కడ మాటలతో వాదించడం కంటే అంతరంగంలో తర్కించడం లేదా తలపోసుకోవడం సందర్భానికి సరిపోతుంది.
- source_word: ἐν ἑαυτοῖς
  choice: తమలో తాము
  rationale: ఇది పరస్పర సంభాషణకన్నా వారి అంతరంగ ఆలోచనను సూచించే సహజ తెలుగు ప్రయోగం.
- source_word: Τί ταῦτα διαλογίζεσθε
  choice: ఈ విషయాల గురించి ఎందుకు ఆలోచిస్తున్నారు?
  rationale: τί ఈ ప్రశ్నలో కారణాన్ని అడిగే భావం కలిగి ఉంది; తెలుగు వాక్యనిర్మాణంలో ‘ఎందుకు’ సహజంగా ఉంటుంది.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: మీ హృదయాల్లో
  rationale: ‘హృదయం’ అనే బైబిలు రూపకాన్ని నిలుపుతూ, ఆలోచనలతో సహా అంతరంగ వ్యక్తిని సూచిస్తుంది.
theological_decisions:
- issue: ‘తన ఆత్మలో గ్రహించి’ అనే మాటలో యేసు జ్ఞాన స్వభావం
  choice: యేసు వారి అంతరంగ ఆలోచనను గ్రహించాడని చెప్పి, దాని విధానాన్ని నిర్దిష్టం చేయకుండా ‘తన ఆత్మలో’ అనే రూపాన్ని నిలుపడం.
  alternative: దీనిని స్పష్టంగా దైవిక సర్వజ్ఞానంగా లేదా కేవలం మానవ అంతర్దృష్టిగా వ్యాఖ్యానించడం.
  rationale: వాక్యం యేసు వారి అంతరంగ ఆలోచనను తెలుసుకున్నాడని స్పష్టం చేస్తుంది; అయితే τῷ πνεύματι αὐτοῦ ఆ జ్ఞాన విధానాన్ని తానే ఖచ్చితంగా నిర్వచించదు. అందువల్ల మూలంలోని వేదాంతపరమైన ఉద్వేగం, సందిగ్ధత నిలుపబడతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘హృదయాలు,’ ‘ఆత్మ’ వంటి మూలపాఠంలోని ప్రధాన బైబిలు పదచిత్రాలను నిలిపి, వాక్యాన్ని సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా రూపొందించాం.
