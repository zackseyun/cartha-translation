translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన క్రమాన్ని వాడాం. మార్కు వాక్యంలోని సరళ అనుసంధానాన్ని, నలుగురి గురించిన మూలపాఠ్య సంక్షిప్తతను నిలిపాం.
