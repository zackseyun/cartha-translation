  yaml_path: translation/nt/mark/002/003.yaml
  text: And they came[a], bringing to him a paralyzed man carried by four.
translation:
  language: te
  text: నలుగురిచేత[a] మోయబడుతున్న ఒక పక్షవాత రోగిని ఆయన దగ్గరికి తీసుకొని వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు మూలంలో ‘నలుగురిచేత’ అని మాత్రమే ఉంది; ‘నలుగురు మనుషులచేత’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: అప్పుడు
  rationale: మార్కు వాడిన సాధారణ అనుసంధానాన్ని సహజమైన తెలుగు కథనశైలిలో చూపుతుంది; సంఘటనల క్రమాన్ని సూచించినా అదనపు కారణార్థాన్ని చేర్చదు.
- source_word: ἔρχονται
  choice: కొందరు వచ్చారు
  rationale: గ్రీకు చారిత్రక వర్తమానాన్ని సహజ తెలుగు కథనంలో భూతకాలంగా అనువదించాం. గ్రీకులో కర్త స్పష్టంగా లేకపోవడంతో తెలుగులో అవసరమైన అనిర్దిష్ట కర్తగా ‘కొందరు’ వాడాం.
- source_word: φέροντες πρὸς αὐτὸν
  choice: ఆయన దగ్గరికి తీసుకొంటూ
  rationale: యేసు వద్దకు ఆ వ్యక్తిని తీసుకురావడమనే గమనాన్ని సహజంగా వ్యక్తం చేస్తుంది; మోసే భౌతిక చర్యను αἰρόμενον విడిగా తెలియజేస్తుంది.
- source_word: παραλυτικὸν
  choice: పక్షవాత రోగిని
  rationale: నామవాచకంగా వాడిన విశేషణానికి ఆధునిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన రూపం.
- source_word: αἰρόμενον
  choice: మోస్తున్న
  rationale: ఆ వ్యక్తిని ఇతరులు భౌతికంగా మోస్తున్నారనే కర్మణి భావాన్ని తెలుగు సంబంధవాచక నిర్మాణంలో సహజంగా తెలియజేస్తుంది.
- source_word: ὑπὸ τεσσάρων
  choice: నలుగురు
  rationale: గ్రీకులో ‘నలుగురిచేత’ అని మాత్రమే ఉంది; ‘మనుషులు’ లేదా ‘పురుషులు’ అని మూలంలో లేని పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
