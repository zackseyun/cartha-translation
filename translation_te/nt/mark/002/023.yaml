source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ⸂αὐτὸν ἐν τοῖς σάββασιν παραπορεύεσθαι⸃ διὰ τῶν σπορίμων, καὶ ⸂οἱ μαθηταὶ αὐτοῦ ἤρξαντο⸃ ὁδὸν ποιεῖν τίλλοντες τοὺς στάχυας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/023.yaml
  text: And it happened that on the Sabbath he was passing through the grainfields[a], and his disciples began to make their way[c][b], plucking the heads of grain.
translation:
  language: te
  text: 'విశ్రాంతిదినాన ఇలా జరిగింది: ఆయన పంటచేల గుండా[a] వెళ్తుండగా, ఆయన శిష్యులు ధాన్యపు కంకులు[c] తుంచుకుంటూ ముందుకు సాగడం మొదలుపెట్టారు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఎదిగి నిలిచిన ధాన్యం మధ్యగా.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “దారి చేయడం మొదలుపెట్టారు.” ఇక్కడ ఇది వారు కంకులు తుంచుకుంటూ పొలం గుండా ముందుకు సాగారని తెలిపే నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: లేదా “ధాన్యపు వెన్నులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ఇలా జరిగింది
  rationale: గ్రీకు కథనారంభ సూత్రంలోని సంఘటనను పరిచయం చేసే భావాన్ని ఆధునిక, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐν τοῖς σάββασιν
  choice: ఒక విశ్రాంతి దినాన
  rationale: గ్రీకులో రూపం బహువచనమైనా, ఈ సందర్భంలో అది ఒక విశ్రాంతి దినాన్ని సూచించే సాధారణ కోయినే ప్రయోగం; తెలుగు ఏకవచనం సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: παραπορεύεσθαι
  choice: వెళ్తుండగా
  rationale: కొనసాగుతున్న ప్రయాణ చర్యను సహజమైన తెలుగు కాలరూపంలో వ్యక్తం చేస్తుంది; పంటచేల గుండా అనే పదబంధంతో కలిసి ‘passing through’ భావం స్పష్టమవుతుంది.
- source_word: διὰ τῶν σπορίμων
  choice: పంటచేల గుండా
  rationale: σπόριμα విత్తబడిన, ధాన్యం పెరుగుతున్న పొలాలను సూచిస్తుంది. ‘పంటచేలు’ సామాన్య పాఠకులకు సహజంగా అర్థమయ్యే పదం.
- source_word: ἤρξαντο
  choice: మొదలుపెట్టారు
  rationale: పూరక క్రియతో కూడిన ἄρχομαι యొక్క ప్రారంభ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: ὁδὸν ποιεῖν
  choice: ముందుకు సాగడం
  rationale: అక్షరార్థంగా ‘దారి చేయడం’ అయిన ఈ నుడికారం సందర్భంలో పొలం గుండా ప్రయాణిస్తూ వెళ్లడాన్ని సూచిస్తుంది. రహదారి నిర్మించారనే అపార్థాన్ని నివారిస్తూ సందర్భార్థాన్ని ఇస్తుంది.
- source_word: τίλλοντες
  choice: తుంచుకుంటూ
  rationale: ధాన్యపు కంకులను చేతితో తెంపే చర్యనూ, ముందుకు సాగుతున్న చర్యతో దాని సమకాలిక సంబంధాన్నీ వ్యక్తం చేస్తుంది.
- source_word: τοὺς στάχυας
  choice: ధాన్యపు కంకులు
  rationale: στάχυας ధాన్యపు మొక్కలలో గింజలున్న తలభాగాలను సూచిస్తుంది; ‘కంకులు’ వ్యవసాయ సందర్భానికి సరైన ఆధునిక తెలుగు పదం.
- source_word: αὐτὸν
  choice: ఆయన
  rationale: గ్రీకు నిర్మాణంలో కర్మ విభక్తి రూపం ఉన్నప్పటికీ, తెలుగు ఉపవాక్యంలో సహజంగా కర్త రూపం అవసరం.
theological_decisions:
- issue: విశ్రాంతి దినపు పదప్రయోగం
  choice: ఒక విశ్రాంతి దినాన
  alternative: విశ్రాంతి దినాల్లో
  rationale: గ్రీకు బహువచన రూపం ఈ సందర్భంలో ఏకవచనార్థక నుడికారంగా గ్రహించబడింది. ఇది భాషాపరమైన నిర్ణయం; తరువాతి వివాదంలోని విశ్రాంతి దిన నేపథ్యాన్ని మార్చదు.
- issue: విశ్రాంతి దిన వివాదానికి సంబంధించి ὁδὸν ποιεῖν అర్థం
  choice: ముందుకు సాగడం
  alternative: దారి చేయడం
  rationale: నుడికారార్థాన్ని ఎంచుకోవడం వల్ల శిష్యులు దారి లేదా రహదారి నిర్మించారని అతిశయంగా సూచించదు. వారు కంకులు తుంచుకుంటూ పొలం గుండా వెళ్లారనే చర్యనే పాఠ్యం తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఆయన’ యేసును గౌరవపూర్వకంగా సూచిస్తుంది. గ్రీకు వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా, దాని కథన క్రమం మరియు నిజమైన నుడికార భేదం పాదసూచికలో నిలుపబడ్డాయి.
