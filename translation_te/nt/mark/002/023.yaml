  source_fidelity: The narrative sequence and the ongoing action of passing through sown fields are accurately represented. ‘తుంచుకుంటూ’ suitably conveys τίλλοντες, and ‘మొదలుపెట్టారు’ preserves ἤρξαντο. However, ἐν τοῖς σάββασιν specifically denotes the Sabbath; ‘ఒక విశ్రాంతి దినాన’ is less precise and its indefinite ‘ఒక’ does not reflect the contextual Sabbath reference.
