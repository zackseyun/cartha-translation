  terminology: Use ‘విశ్రాంతిదినాన’ as the established Telugu designation for the Sabbath, retaining the source’s specific religious-calendar term without importing interpretive detail. ‘ధాన్యపు కంకులు’ is an acceptable rendering of στάχυας; the alternative ‘ధాన్యపు వెన్నులు’ is appropriately retained.
