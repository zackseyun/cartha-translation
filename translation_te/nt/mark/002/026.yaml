    issue: Material from Mark 2:25 has been incorporated into the text of Mark 2:26.
    rationale: “దావీదు” and “మీరు చదవలేదా?” belong to the preceding verse, whereas the Greek text supplied for 2:26 begins with πῶς (“how”). Retaining them obscures the verse boundary and adds wording absent from this verse.
  - severity: low
    issue: “ధర్మశాస్త్రం ప్రకారం” is more specific than the Greek expression.
    rationale: οὐκ ἔξεστιν means ‘it is not permitted/lawful.’ The sacred legal context is evident, but explicitly naming the Torah/law is not required by the text.
