id: MRK.2.26
reference: Mark 2:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ ἐπὶ Ἀβιαθὰρ ἀρχιερέως καὶ τοὺς ἄρτους τῆς προθέσεως ἔφαγεν, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ ⸂τοὺς ἱερεῖς⸃, καὶ ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/026.yaml
  text: how he entered into the house of God in the time of Abiathar the high priest[a], and ate the bread of the Presence, which it is not lawful to eat except for the priests[b], and also gave some to those who were with him?
translation:
  language: te
  text: ప్రధాన యాజకుడైన అబీయాతారు కాలంలో[a] అతడు దేవుని మందిరంలోకి ప్రవేశించి, యాజకులు తప్ప మరెవ్వరూ తినడానికి అనుమతిలేని సన్నిధి రొట్టెలను[b] తిని, తనతో ఉన్నవారికీ కూడా ఎలా ఇచ్చాడో?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అబీయాతారు ప్రధాన యాజకుడిగా ఉన్నప్పుడు.” ఈ పదబంధాన్ని ప్రధాన యాజకుడైన అబీయాతారుతో సంబంధమున్న కాలాన్ని లేదా వృత్తాంత నేపథ్యాన్ని మరింత విస్తృతంగా సూచిస్తున్నట్లుగానూ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “సన్నిధి రొట్టెలు” అంటే పవిత్ర స్థలంలో దేవుని సన్నిధిలో ఉంచిన ప్రతిష్ఠిత రొట్టెలు; వీటిని సంప్రదాయంగా “సముఖపు రొట్టెలు” అని కూడా అంటారు.
    reason: cultural_note
lexical_decisions:
- source_word: πῶς
  choice: ఎలా
  rationale: దావీదు చేసిన కార్యాన్ని వివరించే ప్రశ్నలో గ్రీకు పదానికి సహజమైన తెలుగు సమానం.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: దేవుని మందిరంలోకి వెళ్లి
  rationale: ‘దేవుని ఇల్లు’ అనే అక్షరార్థం సాధ్యమైనా, పవిత్ర స్థలాన్ని సూచించే సందర్భంలో ‘దేవుని మందిరం’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ἐπὶ Ἀβιαθὰρ ἀρχιερέως
  choice: ప్రధాన యాజకుడైన అబీయాతారు కాలంలో
  rationale: ἐπί + షష్ఠీ విభక్తి ఇక్కడ కాలసంబంధ భావాన్ని కలిగి ఉంది. ఖచ్చితమైన పదవీకాలాన్ని బలవంతంగా నిర్ధారించకుండా గ్రీకులోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: ἄρτους τῆς προθέσεως
  choice: సన్నిధి రొట్టెలను
  rationale: దేవుని సన్నిధిలో ఉంచే ప్రతిష్ఠిత రొట్టెలను సూచించే సంక్షిప్తమైన, ఆరాధనా సందర్భానికి తగిన తెలుగు పదబంధం.
- source_word: οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ τοὺς ἱερεῖς
  choice: యాజకులు తప్ప మరెవరూ తినడం ధర్మశాస్త్రం ప్రకారం అనుమతించబడని
  rationale: ἔξεστιν లోని అనుమతి లేదా న్యాయబద్ధత భావాన్ని పవిత్ర ధర్మశాస్త్ర సందర్భంలో స్పష్టంగా వ్యక్తం చేస్తుంది; యాజకులకు మాత్రమే ఉన్న మినహాయింపును సహజ తెలుగులో తెలుపుతుంది.
- source_word: ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν
  choice: తనతో ఉన్నవారికి కూడా ... ఇచ్చాడో
  rationale: గ్రీకులోని ‘అతనితో ఉన్నవారు’ అనే వర్ణనను సహజంగా నిలుపుతూ καί యొక్క ‘కూడా’ భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: అబీయాతారుకు సంబంధించిన కాలపదబంధం మరియు 1 సమూయేలు 21తో కనిపించే ఉద్రిక్తత
  choice: ప్రధాన యాజకుడైన అబీయాతారు కాలంలో
  alternative: అబీయాతారు ప్రధాన యాజకుడిగా ఉన్నప్పుడు; ప్రధాన యాజకుడైన అబీయాతారుకు సంబంధించిన వృత్తాంతంలో
  rationale: గ్రీకు పదబంధం విస్తృత కాల లేదా వృత్తాంత నేపథ్యాన్ని సూచించగలదు. ప్రధాన పాఠంలో సహజమైన కాలార్థాన్ని ఉంచి, పాత నిబంధన సమాంతర వృత్తాంతంతో కనిపించే ఉద్రిక్తతను అనువాదంలో నిశ్శబ్దంగా పరిష్కరించకుండా పాదటిప్పణిలో ప్రత్యామ్నాయ అవగాహనను ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఈ వచనం ముందటి వాక్యంలో మొదలైన యేసు ప్రశ్నలో భాగమైనందున, తెలుగులో స్వతంత్రంగా సహజంగా వినిపించేందుకు ‘దావీదు’ మరియు ‘మీరు చదవలేదా?’ను సందర్భానుసారంగా స్పష్టీకరించాం. పాదటిప్పణి సూచికలు ప్రధాన పాఠంలో రెండూ ఉంచబడ్డాయి.
