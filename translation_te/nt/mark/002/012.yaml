id: MRK.2.12
reference: Mark 2:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἠγέρθη ⸂καὶ εὐθὺς⸃ ἄρας τὸν κράβαττον ἐξῆλθεν ⸀ἔμπροσθεν πάντων, ὥστε ἐξίστασθαι πάντας καὶ δοξάζειν τὸν θεὸν λέγοντας ὅτι ⸂Οὕτως οὐδέποτε⸃ εἴδομεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/012.yaml
  text: And he got up[a], and immediately picked up the mat and went out before them all, so that they were all amazed and glorified God, saying, “We have never seen anything like this.”
translation:
  language: te
  text: అతడు లేచి, వెంటనే తన పరుపును ఎత్తుకొని అందరి ముందుగా బయటికి వెళ్లాడు. అందువల్ల వారందరూ విస్తుపోయి, “ఇలాంటిది మనం ఎన్నడూ చూడలేదు” అని చెబుతూ దేవుణ్ణి మహిమపరిచారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγέρθη
  choice: లేచి
  rationale: స్వస్థత పొందిన పక్షవాత రోగి యేసు ఆజ్ఞకు స్పందించి లేవడమే తక్షణ సందర్భార్థం. ఇక్కడ పునరుత్థాన భావాన్ని అనవసరంగా ముందుకు తేవకుండా సహజమైన తెలుగు వాడబడింది.
- source_word: εὐθύς
  choice: వెంటనే
  rationale: మార్కు కథనంలో కనిపించే తక్షణత్వాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἄρας
  choice: ఎత్తుకొని
  rationale: పరుపును పైకెత్తి తనతో తీసుకువెళ్లిన చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: κράβαττον
  choice: పరుపు చుట్టను
  rationale: ఇది పూర్తి మంచం కంటే, మోసుకెళ్లగల సాధారణ పడక లేదా పరుపును సూచిస్తుంది; సందర్భంలో అతడు దానిని ఎత్తుకొని వెళ్లగలడనే భావాన్ని ఈ పదబంధం స్పష్టం చేస్తుంది.
- source_word: ἔμπροσθεν πάντων
  choice: అందరి ముందుగా
  rationale: ఈ స్వస్థత అందరి కళ్లముందు బహిరంగంగా జరిగినదనే అంశాన్ని నిలుపుతుంది.
- source_word: ὥστε ἐξίστασθαι πάντας
  choice: దాంతో వారందరూ విస్తుపోయి
  rationale: ఫలితాన్ని సూచించే ὥστε నిర్మాణాన్నీ, ἐξίστασθαι తెలిపే తీవ్రమైన ఆశ్చర్యాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δοξάζειν τὸν θεόν
  choice: దేవుణ్ణి మహిమపరిచారు
  rationale: దేవునికి మహిమ చెల్లించిన ప్రతిస్పందనను సంప్రదాయబద్ధమైనప్పటికీ సామాన్యులకు అర్థమయ్యే తెలుగులో కాపాడుతుంది.
- source_word: Οὕτως οὐδέποτε εἴδομεν
  choice: ఇలాంటిది మనం ఎన్నడూ చూడలేదు
  rationale: ‘ఈ విధంగా ఎన్నడూ చూడలేదు’ అనే గ్రీకు వాక్యప్రయోగం, వారికి ఈ సంఘటన అపూర్వమైనదని సూచిస్తుంది; తెలుగు సహజ వాక్యరూపంలో అదే భావం వస్తుంది.
theological_decisions:
- issue: ἠγέρθηలో ఉండగల పునరుత్థాన ప్రతిధ్వని
  choice: తక్షణ స్వస్థత సందర్భంలో ‘లేచి’ అని అనువదించడం
  alternative: లేపబడ్డాడు / తిరిగి లేచాడు
  rationale: ἐγείρω ఇతర సందర్భాల్లో పునరుత్థానాన్ని సూచించగలిగినా, ఇక్కడ పక్షవాత రోగి యేసు ఆజ్ఞ ప్రకారం శారీరకంగా లేవడమే ప్రధానార్థం. అందువల్ల సందర్భం ముందుకు తేవని సిద్ధాంతార్థాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే వాక్య గౌరవాన్ని నిలుపుతూ అనువదించబడింది. గ్రీకు చర్యల క్రమం—లేవడం, వెంటనే పరుపు ఎత్తుకోవడం, అందరి ముందుగా బయటికి వెళ్లడం—స్పష్టంగా ఉంచబడింది.
