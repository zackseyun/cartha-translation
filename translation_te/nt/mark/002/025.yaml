id: MRK.2.25
reference: Mark 2:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀λέγει αὐτοῖς· Οὐδέποτε ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε χρείαν ἔσχεν καὶ ἐπείνασεν αὐτὸς καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/025.yaml
  text: And he said to them, “Have you never read what David did when he was in need and was hungry, he and those with him?”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “దావీదు అవసరంలో ఉన్నప్పుడు, అతడూ అతనితో ఉన్నవారూ ఆకలిగొన్నప్పుడు, అతడు ఏమి చేశాడో మీరు ఎన్నడూ చదవలేదా?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρείαν ἔσχεν
  choice: అవసరంలో ఉన్నప్పుడు
  rationale: ‘అవసరం కలిగినప్పుడు’ అనే మూలార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; తరువాత వచ్చే ఆకలిని అదే భావంగా కలిపేయదు.
- source_word: ἐπείνασεν
  choice: ఆకలిగొన్నప్పుడు
  rationale: క్రియారూపంలోని ‘ఆకలితో ఉన్నాడు/ఆకలిగొన్నాడు’ అనే అర్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: οἱ μετ’ αὐτοῦ
  choice: అతనితో ఉన్నవారు
  rationale: దావీదుతో పాటు ఉన్న వ్యక్తులను మూలానికి దగ్గరగా, సహజంగా సూచిస్తుంది.
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: మీరు ఎన్నడూ చదవలేదా?
  rationale: ప్రతివాదాన్ని సూచించే అలంకారప్రశ్న బలాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘అవసరం’ మరియు ‘ఆకలి’ అనే రెండు మూల అంశాలను విడిగా ఉంచి, వాక్యంలోని అలంకారప్రశ్నను కాపాడాం.
