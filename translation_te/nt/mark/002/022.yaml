id: MRK.2.22
reference: Mark 2:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή, ⸂ῥήξει ὁ οἶνος⸃ τοὺς ἀσκούς, καὶ ὁ οἶνος ⸂ἀπόλλυται καὶ οἱ ἀσκοί⸃. ἀλλὰ οἶνον νέον εἰς ἀσκοὺς ⸀καινούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/022.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the wine will burst the wineskins, and the wine is ruined, and the wineskins too[b]. But new wine is for fresh wineskins.
translation:
  language: te
  text: ఎవ్వరూ కొత్త ద్రాక్షారసాన్ని పాత తోలు తిత్తుల్లో పోయరు. అలా పోస్తే, ద్రాక్షారసం ఆ తోలు తిత్తులను చీల్చివేస్తుంది; ద్రాక్షారసం, తోలు తిత్తులు రెండూ పాడైపోతాయి.[a] కాని కొత్త ద్రాక్షారసానికి కొత్త తోలు తిత్తులే తగినవి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పాడైపోతాయి’ అనే మాటను ‘నష్టమవుతాయి’ లేదా, ద్రాక్షారసం విషయంలో, ‘వృథా అవుతుంది’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘కొత్త’ అని అనువదించిన గ్రీకు పదం, పాత వాటికి విరుద్ధంగా కొత్తగా లేదా వాడబడని స్థితిలో ఉన్న తోలు తిత్తులను సూచిస్తుంది. చివరి వాక్యభాగంలో గ్రీకులో క్రియ లేదు; అక్షరార్థంగా, ‘కాని కొత్త ద్రాక్షారసం కొత్త తోలు తిత్తుల్లోకి.’
    reason: lexical_and_grammatical_note
lexical_decisions:
- source_word: βάλλει
  choice: పోయరు
  rationale: మూల క్రియకు సాధారణంగా ‘వేయడం/ఉంచడం’ అనే విస్తృత అర్థం ఉన్నా, ద్రాక్షారసాన్ని పాత్రలో నింపే సందర్భంలో ‘పోయడం’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: οἶνον νέον
  choice: కొత్త ద్రాక్షారసం
  rationale: ఇటీవల తయారై ఇంకా పులియబెట్టే ప్రక్రియలో ఉన్న ద్రాక్షారసం అనే దృశ్యాన్ని నిలుపుతూ విశేషణ-నామవాచక జతను నేరుగా అందిస్తుంది.
- source_word: ἀσκοὺς
  choice: తోలు తిత్తులు
  rationale: ద్రాక్షారసాన్ని నిల్వచేసే జంతు చర్మపు సంచులను సూచించే సాంస్కృతిక దృశ్యాన్ని స్పష్టంగా తెలిపే సహజ తెలుగు పదబంధం.
- source_word: παλαιούς
  choice: పాత
  rationale: ‘పాత’ అనే మూల వ్యత్యాసాన్ని నేరుగా నిలుపుతుంది; ‘అరిగిపోయిన’ అని అనువదిస్తే మూలంలో అంత స్పష్టంగా లేని భావాన్ని అదనంగా చేర్చినట్లవుతుంది.
- source_word: ῥήξει
  choice: చీల్చివేస్తుంది
  rationale: పులిసే ద్రాక్షారసం కలిగించే ఒత్తిడివల్ల తోలు తిత్తులు చీలిపోవడాన్ని తెలుగులో సహజమైన సకర్మక రూపంలో వ్యక్తం చేస్తుంది.
- source_word: ἀπόλλυται
  choice: పాడైపోతాయి
  rationale: ద్రాక్షారసం వృథా కావడం, తోలు తిత్తులు పనికిరాకపోవడం అనే రెండు ఫలితాలనూ సందర్భానుగుణంగా కలిపి తెలుపుతుంది; ‘నష్టమవుతాయి’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: καινούς
  choice: కొత్త
  rationale: καινός ఇక్కడ పాత వాటికి విరుద్ధంగా కొత్తగా, వాడబడని స్థితిలో ఉన్న తోలు తిత్తులను సూచిస్తుంది. తెలుగులో ‘కొత్త’ సహజమైన సమానార్థకం; గ్రీకులో νέος/καινός మధ్య ఉన్న సూక్ష్మ వ్యత్యాసాన్ని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: చివరి వాక్యభాగంలో క్రియ లేకపోవడం
  choice: ‘కొత్త ద్రాక్షారసానికి కొత్త తోలు తిత్తులే తగినవి’ అనే సాధారణ సూత్రంగా అనువదించడం
  alternative: ‘కొత్త ద్రాక్షారసాన్ని కొత్త తోలు తిత్తుల్లో పోయాలి’
  rationale: గ్రీకు వాక్యభాగంలో స్పష్టమైన క్రియ లేదు. ‘తగినవి’ అనే రూపం సామెతలాంటి సంక్షిప్త సూత్రాన్ని సహజ తెలుగులో అందిస్తూ, మూలంలో స్పష్టంగా లేని ఆజ్ఞాత్మక భావాన్ని బలవంతంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ఉపమానంలోని చారిత్రక ‘తోలు తిత్తులు’ అనే దృశ్యం నిలుపబడింది. చివరి భాగంలోని గ్రీకు సంక్షిప్తతను తెలుగులో సామెతలాంటి సాధారణ సూత్రంగా వ్యక్తం చేశాం.
