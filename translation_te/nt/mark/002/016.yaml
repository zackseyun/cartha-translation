- from: పరిసయ్యుల పక్షానికి చెందిన శాస్త్రులు[a] ఆయన పాపులతో, సుంకం వసూలు చేసేవారితో కలిసి భోజనం చేయడం చూసి, ఆయన శిష్యులతో, “ఆయన సుంకం వసూలు చేసేవారితో, పాపులతో కలిసి ఎందుకు భోజనం చేస్తున్నాడు?” అని అడుగుతూ ఉన్నారు.
