review_pass:
  verdict: revise
  source_fidelity: 'మూల గ్రీకు భావం మొత్తంగా సరిగానే ఉంది: పరిసయ్యులతో సంబంధమున్న శాస్త్రులు యేసు పాపులు, సుంకం వసూలు చేసేవారితో భోజనం చేయడాన్ని చూసి ఆయన శిష్యులను ప్రశ్నిస్తున్నారు. అయితే మొదటి వాక్యంలోని ‘పరిసయ్యుల పక్షానికి చెందిన’ అనేది రాజకీయ/వర్గీయ ‘పక్షం’ భావాన్ని అనవసరంగా చేర్చుతుంది; τῶν Φαρισαίων‌కు ‘పరిసయ్యుల శాస్త్రులు’ లేదా ‘పరిసయ్యులతో సంబంధమున్న శాస్త్రులు’ మరింత నిష్పక్షపాతమైనది. అలాగే ἔλεγον‌కు ‘అడుగుతూ ఉన్నారు’ సాధ్యమే అయినా, సంభాషణను ప్రశ్నారూపంలో ఉటంకించినప్పుడు ‘అన్నారు’ సహజంగా ఉంటుంది; అసంపూర్ణతను ‘అనసాగి అడిగారు’ వంటి రూపంతో బలవంతం చేయనవసరం లేదు.'
  naturalness: ‘ఆయన శిష్యులతో’ అనేది ‘శిష్యులకు’ కంటే కొద్దిగా తక్కువ సహజం, ఎందుకంటే వారు వారితో కలిసి కాదు, వారిని ఉద్దేశించి మాట్లాడుతున్నారు. ‘సుంకం వసూలు చేసేవారు’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది. పునరుక్తమైన ‘కలిసి’ని ఉంచడం మూలంలోని μετάను సహజంగా ప్రతిఫలిస్తుంది.
  terminology: ‘శాస్త్రులు,’ ‘పరిసయ్యులు,’ ‘పాపులు,’ ‘శిష్యులు’ స్థిరమైన, తగిన బైబిలు పరిభాషలు. ‘సుంకం వసూలు చేసేవారు’ τελῶναιకి స్పష్టమైన ఆధునిక సమానార్థకం. ‘పరిసయ్యుల పక్షం’ అనే పదబంధం మాత్రమే గ్రీకులో లేని భావసూచనను కలిగిస్తుంది.
