id: MRK.2.16
reference: Mark 2:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οἱ γραμματεῖς ⸂τῶν Φαρισαίων⸃ ⸀ἰδόντες ⸂ὅτι ἐσθίει⸃ μετὰ τῶν ⸂ἁμαρτωλῶν καὶ τελωνῶν⸃ ἔλεγον τοῖς μαθηταῖς αὐτοῦ· ⸀Ὅτι μετὰ τῶν ⸂τελωνῶν καὶ ἁμαρτωλῶν⸃ ⸀ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/016.yaml
  text: And the scribes of the Pharisees[a], seeing that he was eating with sinners and tax collectors, were saying to his disciples, “Why does he eat with tax collectors and sinners?”
translation:
  language: te
  text: పరిసయ్యుల శాస్త్రులు[a] ఆయన పాపులతో, సుంకం వసూలు చేసేవారితో కలిసి భోజనం చేయడం చూసి, ఆయన శిష్యులకు, “ఆయన సుంకం వసూలు చేసేవారితో, పాపులతో కలిసి ఎందుకు భోజనం చేస్తున్నాడు?” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిసయ్యులతో సంబంధమున్న శాస్త్రులు.” గ్రీకు పదబంధం పరిసయ్యులతో వారి అనుబంధాన్ని సూచిస్తుంది.
    reason: textual_ambiguity
lexical_decisions:
- source_word: γραμματεῖς
  choice: శాస్త్రులు
  rationale: సువార్తల సందర్భంలో ధర్మశాస్త్ర గ్రంథాలపై నిపుణులైన గుర్తింపు పొందిన వర్గాన్ని సూచించే స్థిరమైన, సంక్షిప్త తెలుగు పదం.
- source_word: τῶν Φαρισαίων
  choice: పరిసయ్యుల పక్షానికి చెందిన
  rationale: ఈ షష్ఠీ విభక్తి పదబంధం పరిసయ్యులతో అనుబంధాన్ని సూచిస్తుంది; వారు తప్పనిసరిగా పరిసయ్యులే అని నిర్బంధంగా నిర్ణయించకుండా మూలంలోని స్వల్ప అస్పష్టతను నిలుపుతుంది.
- source_word: ἰδόντες
  choice: చూసి
  rationale: అనంతర ప్రధాన క్రియకు నేపథ్యమైన కాలసూచక పరిస్థితిని సహజమైన తెలుగు క్రియావిశేషణ రూపంలో అందిస్తుంది.
- source_word: ὅτι ἐσθίει
  choice: భోజనం చేయడం
  rationale: కథనంలో కొనసాగుతున్న భోజన దృశ్యాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: μετὰ
  choice: తో కలిసి
  rationale: సహవాసాన్ని, ప్రత్యేకంగా ఇక్కడ భోజన సహవాసాన్ని, వివరణాత్మక విస్తరణ లేకుండానే తెలియజేస్తుంది.
- source_word: ἁμαρτωλῶν
  choice: పాపులతో
  rationale: మూలంలోని సామాజిక-మతపరమైన ముద్రను మృదువుపరచకుండా నేరుగా నిలుపుతుంది.
- source_word: τελωνῶν
  choice: సుంకం వసూలు చేసేవారితో
  rationale: τελώνης సూచించే పన్ను లేదా సుంక వసూలుదారులను సాధారణ ఆధునిక తెలుగు పాఠకుడికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἔλεγον
  choice: అడుగుతూ ఉన్నారు
  rationale: సందర్భంలో ఇది శిష్యులకు ఉద్దేశించిన ప్రశ్న; అసంపూర్ణ భూతకాల రూపంలోని కొనసాగింపు లేదా పునరావృత భావాన్ని ‘అడుగుతూ ఉన్నారు’ నిలుపుతుంది.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ఆయన శిష్యులతో
  rationale: గురువు-శిష్య సంబంధాన్ని సూచించే ప్రామాణిక తెలుగు రూపం.
- source_word: Ὅτι
  choice: ఎందుకు
  rationale: ప్రశ్నను ప్రవేశపెట్టే ὅτι ఇక్కడ కారణాన్ని ప్రశ్నించే సహజ తెలుగు రూపంతో అనువదించబడింది.
- source_word: ἐσθίει
  choice: భోజనం చేస్తున్నాడు
  rationale: ప్రత్యక్ష ప్రశ్నలోని కొనసాగుతున్న లేదా లక్షణాత్మక చర్యను సహజమైన వర్తమాన కొనసాగింపు రూపంలో తెలియజేస్తుంది.
theological_decisions:
- issue: భోజన సహవాసంలోని సామాజిక-మతపరమైన తీవ్రత
  choice: ప్రధాన వాక్యంలో ‘తో కలిసి భోజనం’ అని సూటిగా అనువదించడం
  alternative: ‘వారితో భోజన సహవాసం చేస్తున్నాడు’ లేదా ‘వారితో కలిసి భోజనాలు పంచుకుంటున్నాడు’ అని వివరణాత్మకంగా చెప్పడం
  rationale: యేసు ముద్రవేయబడిన వర్గాలతో కలిసినందులోని ఉద్రిక్తతను కథనం తానే వ్యక్తం చేయనివ్వాలి; మూలం సాధారణ ‘తిను’ క్రియతో ‘తో’ అనే సహవాస సూచననే ఉపయోగిస్తుంది.
- issue: τῶν Φαρισαίων అనే అనుబంధపు స్వభావం
  choice: ‘పరిసయ్యుల పక్షానికి చెందిన’ అని అనుబంధాన్ని సూచించడం
  alternative: ‘పరిసయ్యులైన శాస్త్రులు’ అని వారి గుర్తింపును నిర్దిష్టం చేయడం
  rationale: షష్ఠీ విభక్తి పరిసయ్యులతో సంబంధం లేదా వర్గ అనుబంధాన్ని సూచించగలదు; వారు స్వయంగా పరిసయ్యులే అనే భావాన్ని అనువాదంలో బలవంతంగా ఖరారు చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘శాస్త్రులు’ అనే సాంప్రదాయ బైబిలు పదాన్ని నిలిపి, ‘సుంకం వసూలు చేసేవారు’ అనే స్పష్టమైన ఆధునిక వ్యక్తీకరణను ఎంచుకున్నాం. అసంపూర్ణ భూతకాల భావాన్ని ‘అడుగుతూ ఉన్నారు’ ద్వారా సూచించాం.
