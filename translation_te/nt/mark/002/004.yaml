id: MRK.2.4
reference: Mark 2:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ μὴ δυνάμενοι ⸀προσενέγκαι αὐτῷ διὰ τὸν ὄχλον ἀπεστέγασαν τὴν στέγην ὅπου ἦν, καὶ ἐξορύξαντες χαλῶσι τὸν κράβαττον ⸀ὅπου ὁ παραλυτικὸς κατέκειτο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/004.yaml
  text: And not being able to bring him to him because of the crowd[a], they removed the roof where he was, and after digging through it[c][b], they lower the mat on which the paralyzed man was lying.
translation:
  language: te
  text: జనసమూహం కారణంగా అతణ్ణి యేసు దగ్గరికి తీసుకురాలేక, ఆయన ఉన్న చోట పైకప్పును తొలగించి, దానిని తవ్వి తెరిచిన తర్వాత పక్షవాతంతో ఉన్నవాడు పడుకున్న చాపను కిందికి దించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దించారు” అనే గ్రీకు క్రియను “కిందికి వదిలారు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δυνάμενοι … διὰ τὸν ὄχλον
  choice: జనసమూహం కారణంగా … తీసుకురాలేక
  rationale: గ్రీకు కృదంత నిర్మాణంలోని పరిస్థితి/కారణ భావాన్ని సహజమైన తెలుగు అసమాపక క్రియతో వ్యక్తం చేస్తుంది.
- source_word: προσενέγκαι αὐτῷ
  choice: అతణ్ణి యేసు దగ్గరికి తీసుకురాలేక
  rationale: గ్రీకులోని ప్రత్యక్ష కర్మ పక్షవాతంతో ఉన్నవాణ్ణి, పరోక్ష కర్మ యేసును సూచిస్తాయి. తెలుగులో వరుసగా రెండు సర్వనామాలు అస్పష్టంగా ఉండటంతో రెండవ సూచనను సందర్భానుసారంగా ‘యేసు’ అని స్పష్టం చేశాం.
- source_word: ἀπεστέγασαν τὴν στέγην ὅπου ἦν
  choice: ఆయన ఉన్న చోట పైన కప్పును తొలగించి
  rationale: కప్పును తీసివేయడం అనే అరుదైన క్రియార్థాన్ని నిలుపుతూ, యేసు ఉన్న స్థలానికి నిలువు సంబంధాన్ని తెలుగులో సహజంగా ‘పైన’తో స్పష్టం చేస్తుంది.
- source_word: ἐξορύξαντες
  choice: దాన్ని తవ్వి తెరిచారు
  rationale: కప్పు నిర్మాణ పదార్థాన్ని అనవసరంగా నిర్దిష్టపరచకుండా, దానిలో రంధ్రం చేయడానికి తవ్వి/పగులగొట్టి తెరిచిన చర్యను తెలుపుతుంది.
- source_word: χαλῶσι
  choice: కిందికి దించారు
  rationale: కిందికి వదలడం లేదా దించడం అనే భావానికి సందర్భోచితమైన సహజ తెలుగు. గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగు కథన శైలిలో భూతకాలంతో అందించాం.
- source_word: κράβαττον
  choice: చాపను
  rationale: ఇది బరువైన మంచం కంటే సాధారణంగా పడుకునే పలుచని పరుపు లేదా పాకను సూచిస్తుంది; ‘చాప’ సాధారణ పాఠకులకు స్పష్టమైన పదం.
- source_word: ὁ παραλυτικὸς
  choice: పక్షవాతంతో ఉన్నవాడు
  rationale: వ్యక్తిని వ్యాధితో సమానీకరించే నామవాచక రూపం బదులు, గ్రీకు అర్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
