translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి. యేసుకు ‘ఆయన’ వాడినా, వాక్యంలోని ఇతర వ్యక్తికి ‘అతణ్ణి’ వాడి సర్వనామ అస్పష్టతను తగ్గించాం. మూలంలోని చర్యల క్రమాన్ని కాపాడుతూ తెలుగు సహజ ప్రవాహం కోసం వాక్యాన్ని రెండు భాగాలుగా అమర్చాం.
