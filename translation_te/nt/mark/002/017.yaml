source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὁ Ἰησοῦς λέγει αὐτοῖς ⸀ὅτι Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλ’ οἱ κακῶς ἔχοντες· οὐκ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/017.yaml
  text: And when Jesus heard it, he says to them, “Those who are strong have no need of a physician, but those who are sick. I did not come to call the righteous, but sinners.”
translation:
  language: te
  text: 'యేసు అది విని వారితో ఇలా అంటున్నాడు: “బలంగా ఉన్నవారికి[a] వైద్యుని అవసరం లేదు; అనారోగ్యంతో ఉన్నవారికే అవసరం. నేను నీతిమంతులను[b] పిలవడానికి రాలేదు, పాపులను పిలవడానికి వచ్చాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆరోగ్యంగా ఉన్నవారికి.” గ్రీకు పదం అక్షరార్థంగా బలంగా లేదా దృఢంగా ఉన్నవారిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: సందర్భంలో “నీతిమంతులు” అనే మాట వ్యంగ్యంగా—ఇతరుల దృష్టిలో లేదా తమ దృష్టిలో నీతిమంతులుగా ఉన్నవారు అనే భావంలో—వినిపించవచ్చు. అయితే గ్రీకు పాఠ్యం నేరుగా “నీతిమంతులు” అంటుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: అది విని
  rationale: గ్రీకు భూతకాల కృదంతం ప్రధాన క్రియకు ముందున్న చర్యను సూచిస్తుంది. సందర్భంలో యేసు విన్న విషయం స్పష్టంగా ఉన్నందున తెలుగులో సహజంగా ‘అది’ చేర్చబడింది.
- source_word: λέγει
  choice: అంటున్నాడు
  rationale: మార్కు ఉపయోగించిన చారిత్రక వర్తమాన కాలపు సజీవ కథన శైలిని నిలుపుతుంది.
- source_word: οἱ ἰσχύοντες
  choice: బలంగా ఉన్నవారు
  rationale: ἰσχύω యొక్క ప్రాథమిక భావమైన బలం లేదా దృఢత్వాన్ని నిలుపుతూ వైద్యుని ఉపమానానికి సరిపోతుంది; ‘ఆరోగ్యంగా ఉన్నవారు’ అనే సందర్భార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἰατροῦ
  choice: వైద్యుని
  rationale: సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం; వైద్య ఉపమానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: οἱ κακῶς ἔχοντες
  choice: అనారోగ్యంతో ఉన్నవారు
  rationale: అక్షరార్థంగా ‘చెడుగా ఉన్నవారు’ అనే ఈ గ్రీకు నుడికారం వైద్య సందర్భంలో అనారోగ్యంగా ఉన్నవారిని సూచిస్తుంది.
- source_word: καλέσαι
  choice: పిలవడానికి
  rationale: శిష్యత్వపు పిలుపు, ఆహ్వానం, సమన్లు అనే భావాలను అతిగా నిర్దిష్టం చేయకుండా గ్రీకు క్రియ యొక్క విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: δικαίους
  choice: నీతిమంతులను
  rationale: గ్రీకులో ఉన్న నైతిక-మతపరమైన వర్గీకరణను యథాతథంగా నిలుపుతుంది; వ్యంగ్యార్థాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: ἁμαρτωλούς
  choice: పాపులను
  rationale: సువార్తల సందర్భంలో వాడే నైతిక-మతపరమైన designation‌కు ప్రామాణికమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: ‘నీతిమంతులు’ అనే పదం వ్యంగ్యంగా ఉద్దేశించబడిందా?
  choice: ప్రధాన పాఠ్యంలో ‘నీతిమంతులు’ అని నేరుగా ఉంచడం
  alternative: ‘తాము నీతిమంతులమని భావించేవారు’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: సందర్భంలో వ్యంగ్య సూచన ఉండవచ్చు; అయితే గ్రీకు పాఠ్యం కేవలం ‘నీతిమంతులు’ అంటుంది. అందువల్ల అసలు వాక్యంలోని వేదాంతపరమైన ఉద్వేగాన్ని పరిష్కరించకుండా నిలిపాం.
- issue: ‘విని’ అనే క్రియకు గ్రీకులో వ్యక్తం కాని కర్మను తెలుగులో చేర్చాలా?
  choice: ‘అది విని’ అని సందర్భానుసారంగా చేర్చడం
  alternative: ‘విని’ అని మాత్రమే ఉంచడం
  rationale: మునుపటి సందర్భంలోని మాటను యేసు విన్నాడని స్పష్టంగా ఉండటంతో, తెలుగులో సహజమైన అనుసంధానం కోసం ‘అది’ చేర్చడం సిద్ధాంతపరమైన విస్తరణ కాదు.
- issue: చారిత్రక వర్తమాన కాలాన్ని నిలుపాలా?
  choice: ‘అంటున్నాడు’ అని వర్తమాన కాలంలో ఉంచడం
  alternative: ‘అన్నాడు’ అని భూతకాలంలో సవరించడం
  rationale: λέγει అనే వర్తమాన రూపాన్ని నిలుపడం మార్కు కథనంలోని సజీవత్వాన్ని ప్రతిబింబిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. సామాన్య పాఠకుడికి అర్థమయ్యే పదాలను ఉపయోగిస్తూ, మార్కు కథనంలోని చారిత్రక వర్తమాన కాలాన్ని మరియు ‘నీతిమంతులు’ అనే పదంలోని వ్యాఖ్యానాత్మక ఉద్వేగాన్ని నిలిపాం.
