  to: 'యేసు అది విని వారితో ఇలా అంటున్నాడు: “బలంగా ఉన్నవారికి[a] వైద్యుని అవసరం లేదు; అనారోగ్యంతో ఉన్నవారికే అవసరం. నేను నీతిమంతులను[b] పిలవడానికి రాలేదు, పాపులను పిలవడానికి వచ్చాను.”'
  rationale: A safe correction removes the restrictive suffix -నే from “పాపులనే,” preserving the Greek antithesis rather than implying an exclusive purpose. The repeated infinitival phrase is retained for idiomatic Telugu clarity. Footnote b is grammatically corrected without changing its interpretive caution.
