review_pass:
  verdict: revise
  source_fidelity: The final contrast is not faithful to the Greek. οὐκ ἦλθον καλέσαι δικαίους ἀλλὰ ἁμαρτωλούς means, “I did not come to call the righteous, but sinners.” The draft instead says, in effect, “I did not come to call the righteous; I came to call sinners,” which is a permissible explicitation in Telugu only if the contrast is retained without the restrictive -నే. Its current “పాపులనే” adds an unwarranted ‘sinners only’ emphasis. The remainder accurately represents the historical present, the medical metaphor, and the textual reading without the later expansion “to repentance.”
  naturalness: 'The Telugu is generally modern and clear. Repeating “పిలవడానికి” in the final clause makes the ellipsis clear and natural. Footnote b has a small grammatical error: “అనే అంటుంది” should be “అంటుంది.”'
  terminology: “వైద్యుడు,” “నీతిమంతులు,” and “పాపులు” are appropriate standard Telugu renderings. “బలంగా ఉన్నవారు” retains the lexical force of οἱ ἰσχύοντες; the footnote appropriately supplies “ఆరోగ్యంగా ఉన్నవారు” as a contextual alternative.
  issues:
  - severity: high
    issue: The phrase “పాపులనే పిలవడానికి వచ్చాను” introduces restrictive emphasis not present in the Greek.
    rationale: The Greek contrasts “the righteous” with “sinners” after one stated purpose of coming; it does not say that Jesus came to call sinners exclusively. Removing -నే preserves the contrast without adding exclusivity.
  - severity: low
    issue: Footnote b contains the ungrammatical phrase “అనే అంటుంది.”
    rationale: The Greek text is simply said to “say ‘the righteous’”; Telugu should read “అయితే గ్రీకు పాఠ్యం నేరుగా ‘నీతిమంతులు’ అంటుంది.”
