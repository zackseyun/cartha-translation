  text: καὶ ἔλεγεν αὐτοῖς· Τὸ σάββατον διὰ τὸν ἄνθρωπον ἐγένετο ⸀καὶ οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/027.yaml
  text: And he was saying to them[a], “The Sabbath came into being for man, and not man for the Sabbath.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా చెబుతూ ఉన్నాడు: “విశ్రాంతి దినం మానవుని కోసం ఏర్పడింది[a]; మానవుడు విశ్రాంతి దినం కోసం కాదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మానవాళి కోసం.” గ్రీకులో ఏకవచన ἄνθρωπος (“మానవుడు”) సమస్త మానవులకు ప్రాతినిధ్యంగా వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: చెబుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా సందర్భంలో సాగిన మాటను సూచిస్తుంది; తెలుగు కథనంలో ఈ పార్శ్వాన్ని సహజంగా నిలుపుతుంది.
- source_word: τὸ σάββατον
  choice: విశ్రాంతి దినం
  rationale: ఇక్కడ నిర్దిష్టమైన సబ్బాతు దినం/వ్యవస్థ ఉద్దేశించబడింది. ఆధునిక సాధారణ తెలుగు పాఠకులకు అర్థమయ్యే స్థిరమైన పదబంధం ఇది.
- source_word: διὰ τὸν ἄνθρωπον
  choice: మానవుని కోసం
  rationale: accusativeతో διά ఉద్దేశం లేదా ప్రయోజనాన్ని—‘కోసం’—తెలుపుతుంది. ఏకవచన ἄνθρωπος ఇక్కడ మానవాళికి ప్రాతినిధ్యంగా వాడబడింది.
- source_word: ἐγένετο
  choice: ఏర్పడింది
  rationale: γίνομαι ఇక్కడ ఉనికిలోకి రావడం లేదా నియమంగా ఏర్పడడాన్ని సూచిస్తుంది. ‘ఏర్పడింది’ సబ్బాతు వ్యవస్థ యొక్క ఆవిర్భావం, ఉద్దేశం రెండింటినీ అతిగా వివరించకుండా సహజంగా తెలియజేస్తుంది.
- source_word: οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον
  choice: మానవుడు విశ్రాంతి దినం కోసం కాదు
  rationale: మూలంలోని సంక్షిప్త, సమాంతర వ్యతిరేక నిర్మాణాన్ని తెలుగులో నిలుపుతుంది; ‘ఏర్పడలేదు’ అనే భావం సందర్భం ద్వారా స్పష్టమవుతుంది.
theological_decisions:
- issue: సూత్రవాక్యంలో ప్రాతినిధ్య ఏకవచన ἄνθρωπος
  choice: ప్రధాన పాఠ్యంలో ‘మానవుడు/మానవుని’ అని ఏకవచన ప్రాతినిధ్య రూపంలో అనువదించడం
  alternative: ‘మానవాళి’ లేదా ‘మనుషులు’
  rationale: ఈ వాక్యం సబ్బాతు మానవుల మేలు కోసం ఉన్నదనే సాధారణ సూత్రాన్ని ప్రకటిస్తుంది. ‘మానవుడు’ మూలంలోని ఏకవచన సమాంతరతను, సమస్త మానవులకు వర్తించే భావాన్ని రెండింటినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘సబ్బాతు’ అనే లిప్యంతరీకరణకు బదులుగా సాధారణ పాఠకులకు వెంటనే అర్థమయ్యే ‘విశ్రాంతి దినం’ వాడబడింది; మూలంలోని రెండు భాగాల సమాంతరత కాపాడబడింది.
