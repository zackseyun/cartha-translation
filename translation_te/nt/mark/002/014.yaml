id: MRK.2.14
reference: Mark 2:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ παράγων εἶδεν Λευὶν τὸν τοῦ Ἁλφαίου καθήμενον ἐπὶ τὸ τελώνιον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι. καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/014.yaml
  text: And as he was passing by[a], he saw Levi the son of Alphaeus sitting at the tax booth, and he says to him, “Follow me.” And he rose and followed him.
translation:
  language: te
  text: ఆయన వెళ్తుండగా, అల్ఫయి కుమారుడైన లేవి పన్ను వసూలు చేసే చోట కూర్చొని ఉండగా చూశాడు. ఆయన అతనితో, “నన్ను అనుసరించు” అని అంటాడు. అప్పుడు లేవి లేచి ఆయనను అనుసరించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παράγων
  choice: దారిన వెళ్తూ
  rationale: వర్తమాన అసమాపక క్రియారూపం ప్రధాన సంఘటనతో సమకాలంలో కొనసాగుతున్న చర్యను సూచిస్తుంది; ఈ తెలుగు ప్రయోగం దాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἶδεν
  choice: చూశాడు
  rationale: ὁράω యొక్క భూతకాల సంఘటనను నేరుగా అనువదిస్తుంది; ‘గమనించాడు’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: Λευὶν
  choice: లేవి
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: τὸν τοῦ Ἁλφαίου
  choice: అల్ఫయి కుమారుడైన
  rationale: గ్రీకు షష్ఠీ విభక్తి నిర్మాణంలో సూచితమైన తండ్రి–కొడుకు సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καθήμενον
  choice: కూర్చొని ఉండడం
  rationale: యేసు చూసినప్పుడు లేవి ఉన్న స్థితిని కొనసాగుతున్న చర్యగా తెలియజేస్తుంది.
- source_word: ἐπὶ τὸ τελώνιον
  choice: పన్ను వసూలు చేసే చోట
  rationale: τελώνιον పన్నులు లేదా సుంకాలు వసూలు చేసే స్థలాన్ని సూచిస్తుంది. ‘చోట’ అనేది నిర్దిష్టంగా కార్యాలయమా, బల్లా, గుడిసెనా అని మూలంలో లేని వివరాన్ని జోడించదు.
- source_word: λέγει
  choice: అంటున్నాడు
  rationale: మార్కు ఉపయోగించిన చారిత్రక వర్తమాన కాలాన్ని నిలుపుతూ కథనానికి ఉన్న సజీవతను ప్రతిబింబిస్తుంది.
- source_word: Ἀκολούθει μοι
  choice: నన్ను అనుసరించు
  rationale: ఆజ్ఞారూపాన్ని నేరుగా అందిస్తుంది; మూలంలో లేని ‘రా’ అనే మాటను చేర్చదు. ‘అనుసరించు’ భౌతికంగా వెంట వెళ్లడం మరియు శిష్యునిగా అనుసరించడం అనే భావపరిధిని నిలుపుతుంది.
- source_word: ἀναστὰς
  choice: లేచి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను సహజమైన తెలుగు అసమాపక క్రియతో తెలియజేస్తుంది.
- source_word: ἠκολούθησεν αὐτῷ
  choice: ఆయనను అనుసరించాడు
  rationale: యేసు ఆజ్ఞలోని క్రియతో పదసంబంధాన్ని నిలుపుతూ లేవి స్పందనను నేరుగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: మార్కు కథనంలోని చారిత్రక వర్తమాన కాలం
  choice: λέγει అనే వర్తమాన కాలాన్ని ‘అంటున్నాడు’గా నిలిపి, చుట్టూ ఉన్న భూతకాల క్రియలను భూతకాలంలోనే ఉంచాం.
  alternative: కథనం అంతటినీ భూతకాలానికి క్రమబద్ధం చేసి ‘అన్నాడు’ అని అనువదించడం.
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కంటే కథనశైలికి సంబంధించినది. కాలాల మధ్య మూలంలో ఉన్న ఉద్వేగాన్ని తొలగించకుండా, మార్కు కథన సజీవతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. యేసును సూచించడానికి ‘ఆయన’, లేవిని సూచించడానికి ‘అతను’ వాడి సూచనలను స్పష్టంగా ఉంచాం. మూలంలోని చారిత్రక వర్తమానాన్ని ఉద్దేశపూర్వకంగా నిలిపాం.
