id: MRK.2.19
reference: Mark 2:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν νηστεύειν; ὅσον χρόνον ⸂ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν⸃ οὐ δύνανται νηστεύειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/019.yaml
  text: And Jesus said to them[a], “The wedding guests cannot fast while the bridegroom is with them, can they? As long as they have the bridegroom with them, they cannot fast.”
translation:
  language: te
  text: 'యేసు వారితో ఇలా అన్నాడు: “తమతో పెండ్లికుమారుడు ఉన్నంతకాలం పెండ్లివేడుకలో పాల్గొనేవారు[a] ఉపవాసం ఉండలేరుకదా? తమతో పెండ్లికుమారుడు ఉన్నంతకాలం వారు ఉపవాసం ఉండలేరు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పెండ్లిగది కుమారులు” లేదా “పెండ్లిమందిరపు కుమారులు”; ఇది పెండ్లి వేడుకలో పాల్గొనేవారిని సూచించే జాతీయం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνανται ... νηστεύειν;
  choice: ఉపవాసం ఉండగలరా?
  rationale: μήతో ప్రారంభమైన ఈ ప్రశ్నకు ‘లేదు’ అనే సమాధానం ఆశించబడుతుంది. తెలుగు సందర్భంలో ప్రశ్నారూపమే ఆ అలంకారిక బలాన్ని సహజంగా తెలియజేస్తుంది; వెంట వచ్చే వాక్యం దాని ప్రతికూల సమాధానాన్ని స్పష్టం చేస్తుంది.
- source_word: οἱ υἱοὶ τοῦ νυμφῶνος
  choice: పెండ్లివేడుకలో పాల్గొనేవారు
  rationale: అక్షరార్థంగా ‘పెండ్లిగది కుమారులు’ అనే ఈ జాతీయం పెండ్లి సంబరంలో పాలుపంచుకునేవారిని సూచిస్తుంది. అపారదర్శకమైన అక్షరానువాదాన్ని తప్పించి, మూలంలోని విస్తృత సామాజిక భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: ἐν ᾧ ... ἐστιν
  choice: ఉన్నంతకాలం
  rationale: ఇక్కడ నిర్మాణానికి ప్రధానంగా కాలసంబంధ భావం ఉంది. ‘ఉన్నంతకాలం’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ νυμφίος / τὸν νυμφίον
  choice: పెండ్లికుమారుడు
  rationale: మూలంలోని రూపకాన్ని, బైబిలు ప్రతిధ్వనిని నిలుపుతూ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యే పదం.
- source_word: μετ’ αὐτῶν
  choice: తమతో
  rationale: μετά ఇక్కడ సహవాసాన్ని సూచిస్తుంది. వాక్యంలోని కర్తను బట్టి తెలుగు ప్రతిబింబ సర్వనామం ‘తమతో’ సహజంగా ఉంటుంది.
- source_word: ὅσον χρόνον
  choice: ఉన్నంతకాలం
  rationale: ఈ పదబంధం వ్యవధిని సూచిస్తుంది; తెలుగులో ‘అంతకాలం’ నిర్మాణం దాని కాలపరిమాణాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν
  choice: పెండ్లికుమారుడు తమతో ఉన్నంతకాలం
  rationale: గ్రీకులో ‘కలిగి ఉన్నారు’ అనే క్రియ ఉన్నప్పటికీ, వ్యక్తిని ‘తమతో కలిగి ఉన్నారు’ అనడం తెలుగులో కృత్రిమంగా ఉంటుంది. సహవాస భావాన్ని సహజంగా నిలుపుటకు ‘తమతో ఉన్నంతకాలం’ వాడబడింది.
- source_word: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: యేసు వారితో ఇలా అన్నాడు
  rationale: సహజమైన, గౌరవప్రదమైన తెలుగు కథన పరిచయం. ‘ఇలా’ తరువాతి ప్రత్యక్ష వాక్యాన్ని సులభంగా కలుపుతుంది.
theological_decisions:
- issue: యేసును పెండ్లికుమారునిగా సూచించే రూపకం
  choice: ‘పెండ్లికుమారుడు’ అనే రూపకాన్ని వివరణ జోడించకుండా యథాతథంగా నిలుపుట
  alternative: మెస్సీయ లేదా దేవుని సంబంధిత పెండ్లికుమారుని భావాన్ని అనువాదంలోనే స్పష్టంగా చెప్పడం
  rationale: వచనం రూపకం ద్వారా సూచన చేస్తుంది గాని దాని సంపూర్ణ తాత్త్విక అర్థాన్ని ఇక్కడ వివరించదు. అందువల్ల రూపకంలోని ప్రతిధ్వనిని, వ్యాఖ్యానానికి ఉన్న విస్తృతిని కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘పెండ్లి’ రూపాన్ని ‘పెండ్లికుమారుడు’ మరియు ‘పెండ్లివేడుక’లో ఏకరీతిగా వాడాం. అలంకారిక ప్రశ్నను ప్రశ్నారూపంలోనే ఉంచి, వెంటనే వచ్చే ప్రతికూల ప్రకటనతో ఆశించిన సమాధానాన్ని స్పష్టం చేశాం.
