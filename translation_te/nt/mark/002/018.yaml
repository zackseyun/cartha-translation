- from: యోహాను శిష్యులూ, పరిసయ్యులూ ఉపవాసం చేస్తున్నారు. కొందరు వచ్చి ఆయనతో[a], “యోహాను శిష్యులూ, పరిసయ్యుల శిష్యులూ ఉపవాసం చేస్తారు; కానీ నీ శిష్యులు ఎందుకు ఉపవాసం చేయరు?” అని అడిగారు.
