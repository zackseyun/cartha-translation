reference: Mark 2:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἦσαν οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀Φαρισαῖοι νηστεύοντες. καὶ ἔρχονται καὶ λέγουσιν αὐτῷ· Διὰ τί οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀μαθηταὶ τῶν Φαρισαίων νηστεύουσιν, οἱ δὲ σοὶ μαθηταὶ οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/018.yaml
  text: John's disciples and the Pharisees were fasting. And they come and say to him[a], "Why do John's disciples and the disciples of the Pharisees fast, but your disciples do not fast?"
translation:
  language: te
  text: 'యోహాను శిష్యులూ, పరిసయ్యులూ ఉపవాసం పాటిస్తూ ఉండేవారు. వచ్చి ఆయనతో[a] ఇలా అన్నారు: “యోహాను శిష్యులూ, పరిసయ్యుల శిష్యులూ ఉపవాసం చేస్తారు; కానీ నీ శిష్యులు ఎందుకు ఉపవాసం చేయరు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో ‘వచ్చి,’ ‘అన్నారు’ అనే క్రియల కర్తను స్పష్టంగా పేర్కొనలేదు. ‘వారు వచ్చి ఆయనతో ఇలా అన్నారు’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν ... νηστεύοντες
  choice: ఉపవాసం చేస్తున్నారు
  rationale: అసంపూర్ణ భూతకాల సహాయక క్రియతో వర్తమాన కృదంతం కలిసిన ఈ నిర్మాణం గతంలో కొనసాగుతున్న కార్యాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సందర్భానుసారంగా ‘చేస్తున్నారు’ సహజంగా ఆ కొనసాగింపును తెలియజేస్తుంది.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: యోహాను శిష్యులు
  rationale: జనిటివ్ సంబంధాన్ని తెలుగులో సహజమైన నామవాచక సమాసంతో వ్యక్తం చేస్తుంది.
- source_word: οἱ Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: ఈ యూద మతవర్గానికి తెలుగులో స్థిరపడిన సాధారణ రూపం.
- source_word: ἔρχονται καὶ λέγουσιν
  choice: వచ్చి ... అని అడిగారు
  rationale: మార్కు వాడిన చారిత్రక వర్తమాన కాలానికి తెలుగు కథనంలో సహజమైన భూతకాలాన్ని వాడాం. ప్రత్యక్ష వాక్యం ప్రశ్న కావడం వల్ల λέγουσιν‌ను సందర్భానుసారంగా ‘అడిగారు’గా ఇచ్చాం; కర్తను గ్రీకు స్పష్టంగా చెప్పనందున ‘కొందరు’ అనే అనిర్దిష్ట రూపం వాడి, ఆ అంశాన్ని పాదసూచికలో తెలిపాం.
- source_word: Διὰ τί
  choice: ఎందుకు
  rationale: కారణాన్ని అడిగే సహజమైన, సంక్షిప్త తెలుగు ప్రశ్నార్థక రూపం.
- source_word: οἱ μαθηταὶ τῶν Φαρισαίων
  choice: పరిసయ్యుల శిష్యులు
  rationale: జనిటివ్ సంబంధాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: νηστεύουσιν
  choice: ఉపవాసం చేస్తారు
  rationale: ఇక్కడ వర్తమాన కాలం అలవాటు లేదా ఆచారాన్ని సూచించగలదు; తెలుగు సాధారణ వర్తమాన రూపం ఆ భావాన్ని కాపాడుతుంది.
- source_word: οἱ δὲ σοὶ μαθηταὶ
  choice: కానీ నీ శిష్యులు
  rationale: δέ లోని వ్యతిరేకతను ‘కానీ’తో, σοί లోని స్వామ్య సంబంధాన్ని ‘నీ’తో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘వచ్చి ఆయనతో చెప్పారు’ అనే క్రియల కర్త ఎవరు?
  choice: ముఖ్య పాఠ్యంలో ‘కొందరు’ అనే అనిర్దిష్ట కర్తను వాడి, పాదసూచికలో గ్రీకు కర్తను పేర్కొనలేదని తెలిపాం.
  alternative: సందర్భంలోని యోహాను శిష్యులు మరియు పరిసయ్యులనే కర్తలుగా నిర్దిష్టంగా గుర్తించడం; లేదా కర్తలేని తెలుగు నిర్మాణం వాడడం.
  rationale: గ్రీకు క్రియలకు వ్యక్తమైన కర్త లేదు. ఒక నిర్దిష్ట వర్గాన్ని చేర్చడం మూలంలో లేని స్పష్టతను దిగుమతి చేస్తుంది. తెలుగు వాక్యం సహజంగా ఉండేందుకు అనిర్దిష్ట కర్తను వాడినా, మూలంలోని సందిగ్ధతను పాదసూచిక ద్వారా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ఉపవాసం చేయడం’, ‘పరిసయ్యులు’ వంటి విస్తృతంగా తెలిసిన బైబిలు పదజాలాన్ని నిలిపాం. గ్రీకులోని మొదటి καίకి ప్రత్యేకంగా ‘ఇప్పుడు’ వంటి కాలసూచక పదాన్ని చేర్చలేదు.
