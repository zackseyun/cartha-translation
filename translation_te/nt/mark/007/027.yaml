id: MRK.7.27
reference: Mark 7:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂καὶ ἔλεγεν⸃ αὐτῇ· Ἄφες πρῶτον χορτασθῆναι τὰ τέκνα, οὐ γὰρ ⸂καλόν ἐστιν⸃ λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ ⸂τοῖς κυναρίοις βαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/027.yaml
  text: And he was saying to her[a], “Let the children be fed first, for it is not good to take the children’s bread and throw it to the little dogs.”
translation:
  language: te
  text: 'ఆయన ఆమెతో ఇలా అన్నాడు: “మొదట పిల్లలు కడుపునిండా తిననివ్వు. పిల్లల రొట్టెను తీసుకుని చిన్న కుక్కలకు[a] వేయడం మంచిది కాదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇంట్లో పెంచుకునే కుక్కలకు”; లేదా కేవలం “కుక్కలకు.” గ్రీకులో చిన్నదనాన్ని సూచించే రూపం ఉంది. అది వీధుల్లో తిరిగే కుక్కలను నొక్కిచెప్పడం కంటే చిన్న లేదా ఇంట్లో పెంచుకునే కుక్కలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ఇలా అన్నాడు
  rationale: గ్రీకు అసంపూర్ణ భూతకాల రూపానికి కొనసాగుతున్న చర్య అనే ఛాయ ఉండగలిగినా, ఇక్కడ అది సంభాషణను పరిచయం చేసే సాధారణ కథన ప్రయోగం. సహజమైన ఆధునిక తెలుగు కోసం ‘ఇలా అన్నాడు’ అని అనువదించాం.
- source_word: Ἄφες
  choice: తిననివ్వు
  rationale: ఈ సందర్భంలో ἀφίημι ఆజ్ఞారూపం అనుమతిని సూచిస్తుంది. తరువాతి χορτασθῆναιతో కలిపి ‘తిననివ్వు’ సహజంగా ఉంటుంది.
- source_word: πρῶτον
  choice: మొదట
  rationale: ‘పిల్లలకు’ ఉన్న ప్రాధాన్య క్రమాన్ని ఇది స్పష్టంగా నిలుపుతుంది; ఇతరులకు తరువాత అవకాశం ఉందా అనే అంతర్లీన ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచుతుంది.
- source_word: χορτασθῆναι
  choice: కడుపునిండా తిననివ్వు
  rationale: ఈ క్రియ కేవలం ఆహారం ఇవ్వడమే కాక తృప్తిగా తినడాన్ని సూచిస్తుంది. భోజన రూపకంలో ‘కడుపునిండా తినడం’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: τὰ τέκνα
  choice: పిల్లలు
  rationale: లింగం లేదా వయస్సును అనవసరంగా నిర్దిష్టం చేయకుండా కుటుంబ రూపకాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: καλόν ἐστιν
  choice: మంచిది కాదు
  rationale: καλόν ఇక్కడ మంచి, తగిన పని అనే భావాన్ని ఇస్తుంది. ‘మంచిది కాదు’ మూలపదానికి నేరుగా దగ్గరగా ఉండి తెలుగులో సహజంగా ఉంది.
- source_word: ἄρτον
  choice: రొట్టె
  rationale: సాధారణ ‘ఆహారం’ అని విస్తరించకుండా ఇంటి భోజనానికి సంబంధించిన స్పష్టమైన రూపకాన్ని నిలుపుతుంది.
- source_word: κυναρίοις
  choice: చిన్న కుక్కలకు
  rationale: గ్రీకులోని కించిదర్థక రూపాన్ని ‘చిన్న’ ద్వారా చూపించాం. ఇది వీధుల్లో తిరిగే కుక్కలకన్నా చిన్న లేదా ఇంట్లో పెంచుకునే కుక్కలను సూచించవచ్చనే భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: βαλεῖν
  choice: వేయడం
  rationale: βάλλω యొక్క ‘వేయు/విసురు’ అనే దృశ్యాత్మక భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘పిల్లలు’, ‘చిన్న కుక్కలు’ అనే రూపకం ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో రూపకాన్ని వివరించకుండా అలాగే ఉంచడం
  alternative: ‘పిల్లలు’ అంటే ఇశ్రాయేలీయులు/యూదులు, ‘చిన్న కుక్కలు’ అంటే యూదేతరులు అని అనువాదంలోనే స్పష్టీకరించడం
  rationale: గ్రీకు పాఠ్యం వివరణాత్మక గుర్తింపులను ఇవ్వకుండా ఇంటి భోజన రూపకాన్నే ఉపయోగిస్తుంది. సందర్భం ద్వారా అర్థం చేసుకునే వీలు ఉంచడం వ్యాఖ్యానాన్ని అనువాదంలోకి చేర్చకుండా ఉంటుంది.
- issue: πρῶτον (‘మొదట’) లోని క్రమ ప్రాధాన్యం
  choice: ‘మొదట’ అనే మాటను ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: వాక్యాన్ని సులభం చేయడానికి క్రమాన్ని సూచించే మాటను వదలడం
  rationale: ఇది పిల్లలకు ముందుగా ఉన్న ప్రాధాన్యాన్ని తెలియజేస్తుంది; అయితే ఇతరులు శాశ్వతంగా మినహాయించబడ్డారని చెప్పదు. మూలంలోని కథన, దైవశాస్త్ర ఉద్వేగం అలాగే నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. సంభాషణలో ఏకవచన ఆజ్ఞారూపం ఉంచబడింది; రూపకాన్ని వ్యాఖ్యానాత్మకంగా విప్పలేదు.
