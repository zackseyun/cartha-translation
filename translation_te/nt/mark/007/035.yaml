source:
  edition: SBLGNT
  text: ⸀καὶ ⸀ἠνοίγησαν αὐτοῦ αἱ ἀκοαί, καὶ ἐλύθη ὁ δεσμὸς τῆς γλώσσης αὐτοῦ, καὶ ἐλάλει ὀρθῶς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/035.yaml
  text: And his ears were opened[a], and the bond of his tongue was released[c][b], and he spoke plainly.
translation:
  language: te
  text: అతని చెవులు తెరవబడ్డాయి[a]; అతని నాలుక మీదున్న బంధం విడిపోయింది[b]; అతడు స్పష్టంగా[c] మాట్లాడాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని వినికిడి తెరవబడింది.’ గ్రీకు పదం చెవులను గానీ వినికిడి శక్తిని గానీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘అతని నాలుక మీదున్న బంధం విడిపోయింది’; అంటే, అతని మాటలకు ఉన్న ఆటంకం తొలగిపోయింది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘సరిగ్గా’ లేదా ‘సుస్పష్టంగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνοίγησαν
  choice: తెరవబడ్డాయి
  rationale: అనోయిగో అనే క్రియ యొక్క భూతకాల కర్మణి బహువచన రూపాన్ని ప్రతిబింబిస్తూ, వినికిడి అకస్మాత్తుగా పునరుద్ధరించబడినదని తెలియజేస్తుంది.
- source_word: αἱ ἀκοαί
  choice: అతని చెవులు
  rationale: ఈ బహువచన పదం వినికిడి శక్తిని లేదా చెవులను సూచించగలదు; స్వస్థత సందర్భంలో ‘చెవులు’ సహజమైన, సూటియైన తెలుగు.
- source_word: ἐλύθη
  choice: విడిపోయింది
  rationale: లూవో అనే క్రియ యొక్క భూతకాల కర్మణి రూపం. నాలుకను నిరోధించిన బంధం తొలగిపోయిందనే రూపకాన్ని సహజంగా నిలుపుతుంది.
- source_word: ὁ δεσμὸς τῆς γλώσσης αὐτοῦ
  choice: అతని నాలుకకు ఉన్న బంధం
  rationale: దెస్మోస్ అంటే బంధం, కట్టు లేదా సంకెళ్లు. ‘మాటల లోపం’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా మూలంలోని స్పష్టమైన రూపకాన్ని నిలుపుతుంది.
- source_word: ἐλάλει
  choice: అతడు మాట్లాడాడు
  rationale: అసంపూర్ణ భూతకాల రూపానికి సందర్భానుసారంగా సహజమైన కథన తెలుగు; ‘మాట్లాడడం మొదలుపెట్టాడు’ అనే మూలంలో స్పష్టంగా లేని ఆరంభ భావాన్ని చేర్చదు.
- source_word: ὀρθῶς
  choice: స్పష్టంగా
  rationale: ఈ సందర్భంలో సరిగా, సుస్పష్టంగా మాట్లాడడాన్ని సూచిస్తుంది. ‘సరిగ్గా’ అనేది వ్యాకరణ లేదా నైతిక సరిదిద్దుదల భావాన్ని కలిగించవచ్చు; ‘స్పష్టంగా’ స్వస్థపరచబడిన మాటతీరును సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: మాటల స్వస్థతను తెలిపే పదబంధాన్ని అక్షరార్థ రూపకంగా ఉంచాలా, వ్యాఖ్యానాత్మకంగా మార్చాలా
  choice: ‘అతని నాలుకకు ఉన్న బంధం విడిపోయింది’ అనే రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘అతని మాటల లోపం తొలగిపోయింది’ లేదా ‘అతని నాలుక స్వేచ్ఛ పొందింది’
  rationale: గ్రీకు పాఠ్యం వైద్యపరమైన పదానికి బదులు బంధం విడిపోవడం అనే స్పష్టమైన రూపకాన్ని ఉపయోగిస్తుంది. దానిని నిలపడం అద్భుత స్వస్థతను అనవసరంగా వివరణాత్మకం చేయకుండా మూల భావాన్ని కాపాడుతుంది.
- issue: ὀρθῶς మాటల నైతిక/వ్యాకరణ సరిదనాన్ని సూచిస్తుందా లేక స్వస్థమైన స్పష్టమైన ఉచ్చారణను సూచిస్తుందా
  choice: స్వస్థత సందర్భానికి తగినట్లు ‘స్పష్టంగా’
  alternative: ‘సరిగ్గా’ లేదా ‘సవ్యంగా’
  rationale: ముందున్న నాలుక బంధం తొలగిపోవడంతో అనుసంధానించి చూస్తే, ఇది మాటలు స్పష్టంగా, సహజంగా వెలువడినట్లు చెబుతుంది; నైతిక లేదా సిద్ధాంతపరమైన సరిదనాన్ని కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. మూలంలోని మూడు సమన్వయ క్రియలను అర్ధవిరామాలతో స్పష్టంగా అమర్చాం. SBLGNTలో పదానికి ముందు ఉన్న విమర్శా చిహ్నాలు పాఠ్యార్థంలో భాగం కావు. ‘వెంటనే’ అనే పదం ఈ గ్రీకు వాక్యంలో లేదు కాబట్టి ప్రధాన అనువాదంలో చేర్చరాదు; అందువల్ల ప్రచురణకు సవరించిన పాఠ్యం ‘అతని చెవులు తెరవబడ్డాయి[a]...’ అని మొదలవ్వాలి.
