source:
  edition: SBLGNT
  text: καὶ διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸀λέγωσιν· ὅσον δὲ ⸂αὐτοῖς διεστέλλετο, αὐτοὶ⸃ μᾶλλον περισσότερον ἐκήρυσσον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/036.yaml
  text: And he ordered them to tell no one. But the more he ordered them[a], the more abundantly they proclaimed it.
translation:
  language: te
  text: ఆయన ఎవరికీ చెప్పవద్దని వారికి గట్టిగా ఆదేశించాడు. అయితే ఆయన వారిని ఎంతగా ఆదేశిస్తుండేవాడో[a], వారు అంతకంత ఎక్కువగా దాన్ని ప్రకటించేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన వారిని ఎంతగా ఆదేశిస్తుండేవాడో, వారు మరింతగా, మరింతగా దాన్ని ప్రకటించేవారు.”
    reason: గ్రీకులోని అసంపూర్ణ భూతకాల క్రియల పునరావృత/కొనసాగింపు భావాన్నీ, μᾶλλον περισσότερον యొక్క ఉద్ఘాటననూ చూపే ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: διεστείλατο
  choice: గట్టిగా ఆదేశించాడు
  rationale: διαστέλλομαι ఇక్కడ దృఢమైన ఆదేశాన్ని ఇవ్వడం అనే భావాన్ని కలిగిస్తుంది. ‘గట్టిగా ఆదేశించాడు’ అనేది దాని బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: αὐτοῖς
  choice: వారికి / వారిని
  rationale: ఈ బహువచన సర్వనామం అక్కడ ఉన్నవారిని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా మొదటి వాక్యంలో ‘వారికి’, రెండవ వాక్యంలో ‘వారిని’ అని ఇచ్చాం.
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: ఈ సంగతి ఎవరికీ చెప్పవద్దని
  rationale: ఈ ఉపవాక్యం ఆదేశంలోని విషయాన్ని తెలియజేస్తుంది. సందర్భం స్పష్టత కోసం గ్రీకులో అంతర్లీనంగా ఉన్న విషయాన్ని ‘ఈ సంగతి’గా వ్యక్తం చేశాం.
- source_word: ὅσον ... διεστέλλετο
  choice: ఎంతగా ఆదేశించాడో
  rationale: ὅσονతో కూడిన అసంపూర్ణ భూతకాల క్రియ పునరావృతమైన, పరస్పరానుపాత భావాన్ని ఇస్తుంది. తెలుగు ‘ఎంతగా ... అంతకంత’ నిర్మాణం దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μᾶλλον περισσότερον
  choice: అంతకంత ఎక్కువగా
  rationale: ఈ రెండు క్రియావిశేషణాలు కలసి పెరుగుతున్న తీవ్రతను నొక్కిచెబుతాయి. ‘అంతకంత ఎక్కువగా’ ఆ ఉద్ఘాటనను తెలుగులో సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἐκήρυσσον
  choice: దాన్ని ప్రకటించారు
  rationale: κηρύσσω బహిరంగంగా చాటడం లేదా ప్రకటించడం అనే భావాన్ని కలిగిస్తుంది. ‘ప్రకటించారు’ ప్రజల మధ్య విస్తృతంగా చెప్పిన భావాన్ని ఇస్తుంది; అంతర్లీన కర్మను ‘దాన్ని’గా తెలిపాం.
theological_decisions:
- issue: యేసు ఇచ్చిన మౌన ఆదేశం మరియు దానికి విరుద్ధంగా జరిగిన బహిరంగ ప్రకటన
  choice: ఎవరికీ చెప్పవద్దనే ఆదేశాన్ని నిజమైన, దృఢమైన నిషేధంగా అనువదించి, దాని ఉద్దేశాన్ని వివరించకుండా ఉంచాం.
  alternative: ‘తీవ్రంగా హెచ్చరించాడు’ అని బలాన్ని మరింత పెంచడం, లేదా ఆయన ఎందుకు మౌనంగా ఉండమన్నాడో అనువాదంలోనే వివరించడం.
  rationale: వాక్యం దృఢమైన ఆదేశాన్నీ, ప్రజలు దానికి విరుద్ధంగా మరింతగా ప్రకటించడాన్నీ పక్కపక్కనే ఉంచుతుంది. అనువాదం ఈ ఉద్రిక్తతను ఏ ప్రత్యేక సిద్ధాంతంతోనూ పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘గట్టిగా ఆదేశించాడు’ ఆజ్ఞ బలాన్ని నిలుపుతుండగా, ‘అంతకంత ఎక్కువగా’ గ్రీకు వాక్యంలోని పెరుగుతున్న ప్రతిస్పందనను సాధారణ పాఠకుడికి స్పష్టంగా తెలియజేస్తుంది.
