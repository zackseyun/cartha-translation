revisions:
- from: ఆయన ఈ సంగతి ఎవరికీ చెప్పవద్దని వారికి గట్టిగా ఆదేశించాడు. అయితే ఆయన వారిని ఎంతగా ఆదేశించాడో[a], వారు అంతకంత ఎక్కువగా దాన్ని ప్రకటించారు.
  to: ఆయన ఎవరికీ చెప్పవద్దని వారికి గట్టిగా ఆదేశించాడు. అయితే ఆయన వారిని ఎంతగా ఆదేశిస్తుండేవాడో[a], వారు అంతకంత ఎక్కువగా దాన్ని ప్రకటించేవారు.
  rationale: The revision changes only the second occurrence of the command verb to an imperfective Telugu form, matching διεστέλλετο and ἐκήρυσσον. It also removes an unnecessary explicit object from the initial prohibition, while retaining ‘దాన్ని’ in the final clause to express the contextually implied content of the proclamation. The footnote is recast in natural Telugu and remains anchored to the correlative clause.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:02:02Z'
review_pass:
  verdict: revise
  source_fidelity: The first command accurately renders the aorist διεστείλατο and the prohibition ἵνα μηδενὶ λέγωσιν. In the second clause, however, the draft's simple past ‘ఆదేశించాడో’ does not adequately represent the imperfect διεστέλλετο, which presents his repeated/continuing charge in the correlative construction. The revision restores this aspect. ‘ప్రకటించేవారు’ appropriately conveys the imperfect ἐκήρυσσον and its public-proclamation sense in context.
  naturalness: The revised Telugu is natural modern standard Telugu. ‘ఎంతగా ఆదేశిస్తుండేవాడో ... అంతకంత ఎక్కువగా ప్రకటించేవారు’ is a clear and idiomatic correlative expression. ‘ఈ సంగతి’ is omitted because the Greek leaves the object implicit and Telugu can naturally do the same in the command.
  terminology: ‘గట్టిగా ఆదేశించాడు’ suitably conveys the firm directive expressed by διαστέλλομαι without importing an explanation. ‘ప్రకటించేవారు’ is an appropriate non-technical rendering of κηρύσσω. ‘అంతకంత ఎక్కువగా’ preserves the intensification of μᾶλλον περισσότερον.
  issues:
  - severity: medium
    issue: The second occurrence of ‘ఆదేశించాడో’ is perfective/simple past.
    rationale: The Greek διεστέλλετο is imperfect and, with ὅσον, depicts a continuing or repeated charge. Telugu ‘ఆదేశిస్తుండేవాడో’ better retains this aspect and the verse’s proportional contrast.
  - severity: low
    issue: The existing footnote’s proposed wording is awkward and duplicates the needed main-text aspectual correction.
    rationale: A revised alternative can state the intensified response more idiomatically while retaining the footnote anchor.
  revised_text: ఆయన ఎవరికీ చెప్పవద్దని వారికి గట్టిగా ఆదేశించాడు. అయితే ఆయన వారిని ఎంతగా ఆదేశిస్తుండేవాడో[a], వారు అంతకంత ఎక్కువగా దాన్ని ప్రకటించేవారు.
