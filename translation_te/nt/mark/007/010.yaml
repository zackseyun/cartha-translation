  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ εἶπεν· Τίμα τὸν πατέρα σου καὶ τὴν μητέρα σου, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/010.yaml
  text: For Moses said[a], ‘Honor your father and your mother,’ and[b], ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: te
  text: 'ఎందుకంటే మోషే ఇలా చెప్పాడు: “నీ తండ్రిని, నీ తల్లిని గౌరవించు.” అలాగే, “తండ్రినిగానీ తల్లినిగానీ దూషించేవాడు[a] తప్పక చనిపోవాలి[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శపించేవాడు.” ఇక్కడి గ్రీకు క్రియకు చెడుగా మాట్లాడడం, దూషించడం లేదా శపించడం అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మరణశిక్షకు గురికావాలి.” గ్రీకులో అక్షరార్థంగా “మరణంతో మరణించాలి” అనే న్యాయపరమైన సూత్రం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Μωϋσῆς
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన ఈ వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న యేసు వాదనకు మోషే మాటలు ఆధారమని చూపే వివరణాత్మక అనుసంధానాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἶπεν
  choice: ఇలా చెప్పాడు
  rationale: లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే సాధారణ భూతకాల క్రియను సహజంగా తెలియజేస్తుంది.
- source_word: Τίμα
  choice: గౌరవించు
  rationale: ఆజ్ఞారూప బలాన్ని, తల్లిదండ్రులకు ఇవ్వవలసిన గౌరవాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα σου
  choice: నీ తండ్రిని, నీ తల్లిని
  rationale: గ్రీకులో రెండు సంబంధాలకూ వేర్వేరుగా ఉన్న నిర్దిష్టతను, స్వామ్య భావాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: Ὁ κακολογῶν
  choice: దూషించేవాడు
  rationale: చెడుగా మాట్లాడడం, తిట్టడం, శపించడం వంటి అర్థ పరిధిని పూర్తిగా కేవలం ‘శపించడం’కే పరిమితం చేయకుండా తెలిపే సహజమైన పదం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: πατέρα ἢ μητέρα
  choice: తండ్రినిగానీ తల్లినిగానీ
  rationale: ἢ సూచించే ప్రత్యామ్నాయ సంబంధాన్ని సహజమైన తెలుగు న్యాయవాక్య శైలిలో వ్యక్తం చేస్తుంది; మూలంలో లేని స్వామ్యసర్వనామాన్ని చేర్చలేదు.
- source_word: θανάτῳ τελευτάτω
  choice: తప్పక చనిపోవాలి
  rationale: ఈ సెమిటిక్ నేపథ్యమున్న గ్రీకు న్యాయసూత్రంలోని నిశ్చితమైన మరణదండన భావాన్ని సహజంగా నిలుపుతుంది; కర్తృవాచకమా, కర్మణివాచకమా అనే అమలువిధానాన్ని ప్రధాన పాఠంలో అతిగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: θανάτῳ τελευτάτω అనే న్యాయపరమైన శిక్షాసూత్ర అనువాదం
  choice: తప్పక చనిపోవాలి
  alternative: మరణశిక్షకు గురికావాలి
  rationale: గ్రీకు పదబంధం అక్షరార్థంగా ‘మరణంతో మరణించాలి’ అనే బలవంతమైన న్యాయసూత్రం. ఎవరైనా అతణ్ణి చంపాలి అని ప్రధాన పాఠంలో స్పష్టీకరించకుండా, మరణం నిశ్చితమనే గంభీర బలాన్ని ఈ ఎంపిక కాపాడుతుంది; శిక్ష అమలు భావాన్ని పాదసూచికలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన ఆజ్ఞా మరియు న్యాయవాక్య శైలిని పాటించాం. ఉల్లేఖనాల మధ్య ‘అలాగే’ వాడి καί యొక్క అనుసంధానాన్ని సహజంగా నిలిపాం.
