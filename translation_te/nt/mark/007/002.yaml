source:
  edition: SBLGNT
  text: καὶ ἰδόντες τινὰς τῶν μαθητῶν αὐτοῦ ⸂ὅτι κοιναῖς χερσίν, τοῦτ’ ἔστιν ἀνίπτοις, ἐσθίουσιν⸃ ⸀τοὺς ⸀ἄρτους—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/002.yaml
  text: and they saw that some of his disciples were eating the bread with defiled hands—that is[a], unwashed hands—
translation:
  language: te
  text: వారు ఆయన శిష్యుల్లో కొందరు అపవిత్రమైన చేతులతో—అంటే, కడగని చేతులతో[a]—రొట్టెలు తింటుండగా చూశారు—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా ‘సాధారణమైన చేతులతో’ అని ఉంది; ఇక్కడ అది కేవలం మురికిగా ఉండడాన్ని కాక, ఆచారపరంగా అపవిత్రంగా పరిగణించబడడాన్ని సూచిస్తుంది. ‘అశుద్ధమైన చేతులతో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: వారు చూశారు
  rationale: సందర్భంలోని పరిసయ్యులు, శాస్త్రులు కర్తలుగా కొనసాగుతారు. గ్రీకు భూతకాల అసమాపక క్రియను సహజమైన తెలుగు సమాపక క్రియగా వ్యక్తం చేశాం.
- source_word: τινὰς τῶν μαθητῶν αὐτοῦ
  choice: ఆయన శిష్యుల్లో కొందరు
  rationale: τινάς మరియు విభాగార్థక షష్ఠీ విభక్తి కలిసి ‘ఆయన శిష్యుల్లో కొందరు’ అనే అర్థాన్ని ఇస్తాయి.
- source_word: ὅτι
  choice: …తినడం
  rationale: ఇది వారు చూసిన విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘తినడం చూశారు’ అనే నిర్మాణం సహజంగా అదే సంబంధాన్ని తెలియజేస్తుంది.
- source_word: κοιναῖς χερσίν
  choice: అపవిత్రమైన చేతులతో
  rationale: κοινός అక్షరార్థంగా ‘సామాన్యమైన’ అయినా, ఇక్కడ యూదుల ఆచారశుద్ధి సందర్భంలో ‘ఆచారపరంగా అపవిత్రమైన’ అని సూచిస్తుంది. ‘సామాన్యమైన చేతులు’ ఆధునిక తెలుగులో ఉద్దేశించిన భావాన్ని తెలియజేయదు.
- source_word: τοῦτ’ ἔστιν ἀνίπτοις
  choice: అంటే, కడుక్కోని చేతులతో
  rationale: మార్కు ఇచ్చిన వివరణను స్పష్టంగా, సహజంగా ఉంచుతుంది. ‘కడుక్కోని’ అనేది ἀνίπτοις యొక్క సరళమైన భావం.
- source_word: ἐσθίουσιν
  choice: తినడం
  rationale: చూసిన సమయంలో జరుగుతున్న క్రియను తెలుగు క్రియానామ నిర్మాణం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοὺς ἄρτους
  choice: రొట్టెలు
  rationale: బహువచన ἄρτους ను తెలుగులో సహజమైన లెక్కింపదగిన బహువచనంగా ఉంచాం; ఇక్కడ నిర్దిష్ట రొట్టెలను సూచించే అవకాశం నిలుస్తుంది.
theological_decisions:
- issue: κοινός లోని ఆచారశుద్ధి భావం
  choice: ప్రధాన పాఠ్యంలో ‘అపవిత్రమైన’ అని అనువదించాం; పాదసూచికలో అక్షరార్థం మరియు ఆచారపరమైన భావాన్ని వివరించాం.
  alternative: ‘సామాన్యమైన చేతులతో’ లేదా ‘అశుద్ధమైన చేతులతో’
  rationale: ఈ సందర్భం కేవలం భౌతిక మురికి గురించి కాదు; ఆచారపరమైన అపవిత్రత గురించి. ‘అపవిత్రమైన’ సహజమైన తెలుగులో సందర్భార్థాన్ని అందిస్తుండగా, పాదసూచిక మూలపదంలోని ‘సామాన్యమైన’ అనే అక్షరార్థాన్ని సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. వాక్యం తరువాతి వచనాలతో కొనసాగుతున్నందున చివర దీర్ఘ విరామ చిహ్నం ఉంచబడింది; పాదసూచిక సూచిక ప్రధాన పాఠ్యంలో ఉంది.
