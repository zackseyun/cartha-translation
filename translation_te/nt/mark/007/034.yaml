  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀναβλέψας εἰς τὸν οὐρανὸν ἐστέναξεν, καὶ λέγει αὐτῷ· Εφφαθα, ὅ ἐστιν Διανοίχθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/034.yaml
  text: And looking up to heaven[a], he sighed and said to him, “Ephphatha,” that is[b], “Be opened.”
translation:
  language: te
  text: ఆయన ఆకాశం వైపు కన్నులెత్తి చూసి, నిట్టూర్చి[a], అతనితో, “ఎఫ్ఫతా”[b] అన్నాడు. దాని అర్థం, “తెరుచుకో!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మూలిగి”; ఈ క్రియ లోతైన నిట్టూర్పును లేదా మూలుగును సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ఎఫ్ఫతా” అనేది అరామిక్ పదం; దాని అర్థం “తెరుచుకో.”
    reason: cultural_note
lexical_decisions:
- source_word: ἀναβλέψας
  choice: కన్నులెత్తి చూసి
  rationale: పైకి చూడడాన్ని సూచించే సమాస క్రియ యొక్క భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ప్రధాన క్రియకు ముందు జరిగిన అనుబంధ చర్యను కూడా నిలుపుతుంది.
- source_word: εἰς τὸν οὐρανόν
  choice: ఆకాశం వైపు
  rationale: పైకి చూసే దృశ్యాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది. οὐρανός సందర్భానుసారం ఆకాశం లేదా పరలోకం అనే భావం ఇవ్వగలదు; అనువాదం కనిపించే దిశను ముందుకు తెస్తూ ఆధ్యాత్మిక సూచనను నిరాకరించదు.
- source_word: ἐστέναξεν
  choice: నిట్టూర్చి
  rationale: στενάζω సూచించే లోతైన నిట్టూర్పు లేదా మూలుగును అతిశయింపకుండా సహజంగా అందిస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: λέγει αὐτῷ
  choice: అతనితో … అన్నాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని సహజ తెలుగు కథనరీతిలో భూతకాలంగా అనువదించి, αὐτῷ అనే వ్యక్తిగత సంబోధనను నిలుపుతుంది.
- source_word: Εφφαθα
  choice: ఎఫ్ఫతా
  rationale: మార్కు అరామిక్ పలుకును లిప్యంతరీకరించి వెంటనే అర్థం తెలిపిన మూలపాఠ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: Διανοίχθητι
  choice: తెరుచుకో
  rationale: ఏకవచన ఆజ్ఞ యొక్క అర్థాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది. గ్రీకు రూపం వ్యాకరణపరంగా కర్మణి అయినప్పటికీ, ‘తెరవబడు’ కంటే ‘తెరుచుకో’ సాధారణ పాఠకునికి స్పష్టంగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: αὐτῷ ఎవరిని సూచిస్తుంది?
  choice: అతనితో—వినికిడి లోపమున్న వ్యక్తితో
  alternative: అతని చెవులు లేదా మాటల సామర్థ్యాన్ని పరోక్షంగా ఉద్దేశించడం
  rationale: గ్రీకు దత్తివిభక్తి సహజంగా ఆ వ్యక్తినే సూచిస్తుంది. ఆజ్ఞ అతని మూసుకుపోయిన సామర్థ్యాలకు సంబంధించినదైనా, అనువాదం వ్యక్తిగత సంబోధనను మార్చకుండా ఉంచుతుంది.
- issue: οὐρανός భావం
  choice: ఆకాశం
  alternative: పరలోకం
  rationale: యేసు పైకి చూసిన దృశ్యాన్ని ‘ఆకాశం’ సహజంగా తెలియజేస్తుంది; ప్రార్థనాత్మక సందర్భంలో ‘పరలోకం’ అనే సూచన కూడా సాధ్యమే. పాఠం ఆ ద్వంద్వసూచనను సిద్ధాంతపరంగా బిగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. మూలంలోని అరామిక్ పలుకు నిలుపబడింది; ప్రాచీనంగా వినిపించే ‘తెరవబడుము’కు బదులుగా సహజమైన ‘తెరుచుకో’ ఎంచుకోబడింది.
