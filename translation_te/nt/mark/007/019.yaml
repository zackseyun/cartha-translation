id: MRK.7.19
reference: Mark 7:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι οὐκ εἰσπορεύεται αὐτοῦ εἰς τὴν καρδίαν ἀλλ’ εἰς τὴν κοιλίαν, καὶ εἰς τὸν ἀφεδρῶνα ἐκπορεύεται; —⸀καθαρίζων πάντα τὰ βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/019.yaml
  text: because it does not enter into his heart but into his stomach[a], and goes out into the latrine"—thus cleansing all foods.
translation:
  language: te
  text: ఎందుకంటే, అది అతని హృదయంలోకి వెళ్లదు; కడుపులోకి వెళ్లి, అక్కడి నుంచి మరుగుదొడ్డిలోకి వెళ్లిపోతుంది కదా?” — ఈ విధంగా ఆయన అన్ని ఆహారపదార్థాలను శుద్ధపరచాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, చివరి పదబంధాన్ని మార్కు చేసిన వివరణాత్మక వ్యాఖ్యగా కాక జీర్ణక్రియను సూచించేదిగా తీసుకుంటే, “ఈ విధంగా అన్ని ఆహారపదార్థాలను విసర్జిస్తూ” అని అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: καρδίαν
  choice: హృదయం
  rationale: అంతరంగ వ్యక్తికి, జీర్ణవ్యవస్థకు మధ్య ఉన్న మూలపాఠంలోని వ్యత్యాసాన్ని కాపాడే సహజమైన బైబిలీయ పదం.
- source_word: κοιλίαν
  choice: కడుపు
  rationale: జీర్ణక్రియ సందర్భంలో ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా, సహజంగా అర్థమయ్యే శరీరావయవ సూచన.
- source_word: ἀφεδρῶνα
  choice: మరుగుదొడ్డి
  rationale: విసర్జన జరిగే స్థలాన్ని స్పష్టంగా, మర్యాదగా సూచిస్తుంది; మురుగుకాలువ అని అనువదిస్తే మూలార్థానికి మించిన నిర్మాణాన్ని ఊహింపజేయవచ్చు.
- source_word: καθαρίζων
  choice: శుద్ధమైనవిగా చేస్తున్నాడు
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న/ఫలితార్థక భావాన్ని సాధ్యమైనంత నేరుగా నిలుపుతుంది; ‘ప్రకటించాడు’ అనే మరింత వ్యాఖ్యానాత్మక పదాన్ని చేర్చదు.
- source_word: βρώματα
  choice: అన్ని ఆహారపదార్థాలు
  rationale: గ్రీకు బహువచనాన్ని, వివిధ ఆహారవర్గాల సందర్భాన్ని కాపాడుతుంది.
- source_word: αὐτοῦ
  choice: అతని
  rationale: చర్చలో ఉన్న వ్యక్తిని సూచించే పుంలింగ ఏకవచన సర్వనామాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: εἰσπορεύεται / ἐκπορεύεται
  choice: వెళ్లదు / వెళ్లిపోతుంది
  rationale: లోపలికి ప్రవేశించడం, బయటికి వెళ్లడం అనే కదలిక వ్యత్యాసాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: καθαρίζων πάντα τὰ βρώματα అనే చివరి పదబంధం యొక్క అన్వయం
  choice: 'మార్కు వివరణాత్మక వ్యాఖ్యగా: ‘ఈ విధంగా ఆయన అన్ని ఆహారపదార్థాలను శుద్ధమైనవిగా చేస్తున్నాడు’'
  alternative: 'జీర్ణక్రియను సూచిస్తూ: ‘ఈ విధంగా అన్ని ఆహారపదార్థాలను బయటికి తొలగిస్తూ’'
  rationale: పుంలింగ ఏకవచన కృదంతాన్ని యేసును సూచించే మార్కు వివరణగా గ్రహించడం వ్యాకరణపరంగా బలమైన ప్రసిద్ధ పఠనం. అయినా, అది జీర్ణక్రియకు అన్వయిస్తుందనే పఠనం కూడా సాధ్యమే; ఆ నిజమైన సందిగ్ధతను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గౌరవప్రదంగా ఉంచబడింది. ‘హృదయం’ అనే బైబిలీయ రూపకం నిలుపబడింది. ప్రధాన పాఠం మరియు పాదటిప్పణి కలిసి వ్యాకరణాత్మక, ధార్మిక సందిగ్ధతను సంరక్షిస్తాయి.
