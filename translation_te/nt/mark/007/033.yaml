  text: καὶ ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου κατ’ ἰδίαν ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ καὶ πτύσας ἥψατο τῆς γλώσσης αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/033.yaml
  text: And taking him aside from the crowd privately[a], he put his fingers into his ears, and after spitting[b], he touched his tongue.
translation:
  language: te
  text: ఆయన ఆ వ్యక్తిని జనసమూహం నుండి విడిగా[a] తీసుకువెళ్లి, అతని చెవుల్లో తన వేళ్లు పెట్టాడు. తర్వాత ఉమ్మివేసి[b], అతని నాలుకను తాకాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఏకాంతంగా.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు మూలంలో, ‘ఉమ్మివేసి, అతని నాలుకను తాకాడు’ అని ఉంది; యేసు ఆ వ్యక్తి నాలుకపై ఉమ్మును పూశాడని అది స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου
  choice: ఆ వ్యక్తిని జనసమూహం నుండి పక్కకు తీసుకువెళ్లి
  rationale: జనసమూహంలోని ఇతరుల నుండి అతన్ని వేరుగా తీసుకెళ్లడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: κατ’ ἰδίαν
  choice: ఏకాంతంగా
  rationale: ఇతరులకు దూరంగా, ప్రత్యేకంగా జరిగిన చర్య అనే క్రియావిశేషణ భావాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ
  choice: అతని చెవుల్లో తన వేళ్లు పెట్టాడు
  rationale: 'రెండు αὐτοῦ పదాల వేర్వేరు సూచనలను తెలుగులో స్పష్టం చేస్తుంది: ‘తన’ యేసును, ‘అతని’ ఆ వ్యక్తిని సూచిస్తాయి; βάλλωను సందర్భానుసారంగా ‘పెట్టాడు’ అని అనువదించింది.'
- source_word: πτύσας
  choice: ఆ తర్వాత ఉమ్మి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యగా సహజంగా తెలుపుతుంది; ఉమ్మును ఎక్కడైనా పూశాడని మూలంలో లేని భావాన్ని చేర్చదు.
- source_word: ἥψατο τῆς γλώσσης αὐτοῦ
  choice: అతని నాలుకను తాకాడు
  rationale: ἅπτομαι యొక్క సాధారణ సందర్భార్థమైన ‘తాకడం’ను, దాని కర్మను స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: యేసు చేసిన స్వస్థతా చర్యల వివరణ
  choice: ఉమ్మిన తర్వాత ఆ వ్యక్తి నాలుకను తాకాడని మాత్రమే చెప్పడం
  alternative: ఉమ్మును ఆ వ్యక్తి నాలుకకు పూశాడని స్పష్టీకరించడం లేదా ఆ చర్యకు ప్రతీకాత్మక/వైద్యపరమైన అర్థం జోడించడం
  rationale: గ్రీకు మూలం యేసు ఉమ్మి, అతని నాలుకను తాకాడని మాత్రమే చెబుతుంది; ఉమ్ము నాలుకకు తగిలిందని గానీ, ఈ చర్యల ప్రాముఖ్యత ఏమిటని గానీ స్పష్టంగా చెప్పదు. అందువల్ల మూలంలోని సంయమనాన్ని, అస్పష్టతను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఆ వ్యక్తి’ అనేది సర్వనామ సందిగ్ధతను తగ్గిస్తుంది; ‘తన వేళ్లు/అతని చెవులు’ అనే వ్యత్యాసం చర్యలో పాల్గొన్న వారిని స్పష్టం చేస్తుంది.
