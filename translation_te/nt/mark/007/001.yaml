  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ συνάγονται πρὸς αὐτὸν οἱ Φαρισαῖοι καί τινες τῶν γραμματέων ἐλθόντες ἀπὸ Ἱεροσολύμων
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/001.yaml
  text: And the Pharisees and some of the scribes[a], who had come from Jerusalem, gather around him.
translation:
  language: te
  text: పరిసయ్యులూ, శాస్త్రులలో కొందరూ యెరూషలేము నుండి వచ్చి ఆయన దగ్గరకు సమకూడుతున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: —
  rationale: వచనారంభంలోని καί కథనాన్ని ముందున్న సందర్భంతో కొనసాగిస్తుంది. తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని పెట్టడం అసహజంగా ఉండడంతో, వాక్యక్రమం ద్వారానే కొనసాగింపు భావాన్ని తెలిపాం.
- source_word: συνάγονται πρὸς αὐτὸν
  choice: ఆయన దగ్గరికి సమకూడారు
  rationale: πρός + ద్వితీయా విభక్తిలోని ఆయనవైపు చేరిక/సంబంధ భావాన్ని ‘దగ్గరికి’ తెలియజేస్తుంది; συνάγονταιలోని సమూహంగా కూడే భావాన్ని ‘సమకూడారు’ సహజంగా వ్యక్తం చేస్తుంది. మార్కు వాడిన కథన వర్తమానాన్ని ఆధునిక తెలుగు కథనశైలికి తగిన భూతకాలంతో అనువదించాం.
- source_word: οἱ Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: యూదుల ఈ మతసమూహానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: τινες τῶν γραμματέων
  choice: శాస్త్రులలో కొందరు
  rationale: τινες + విభాజక షష్ఠీ నిర్మాణం ఆ సమూహంలోని కొందరినే సూచిస్తుంది; ‘లో కొందరు’ ఆ భావాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: ἐλθόντες ἀπὸ Ἱεροσολύμων
  choice: యెరూషలేము నుండి వచ్చిన
  rationale: సమకూడటానికి ముందు వారు యెరూషలేము నుండి వచ్చారనే పూర్వకాలిక భాగధాతు భావాన్ని సహజమైన తెలుగు విశేషణ ఉపవాక్యంతో తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని వ్యక్తులు, ప్రదేశం, విభాజక భావం, యేసువైపు సమకూడటం అన్నీ నిలుపబడ్డాయి; అవసరం లేని వివరణాత్మక పదాలు చేర్చలేదు.
