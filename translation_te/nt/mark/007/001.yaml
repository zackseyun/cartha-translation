- from: యెరూషలేము నుండి వచ్చిన పరిసయ్యులు, శాస్త్రులలో కొందరు ఆయన దగ్గరికి సమకూడారు.
  to: పరిసయ్యులూ, శాస్త్రులలో కొందరూ యెరూషలేము నుండి వచ్చి ఆయన దగ్గరకు సమకూడుతున్నారు.
