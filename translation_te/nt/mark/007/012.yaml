id: MRK.7.12
reference: Mark 7:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀οὐκέτι ἀφίετε αὐτὸν οὐδὲν ποιῆσαι τῷ ⸀πατρὶ ἢ τῇ ⸀μητρί,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/012.yaml
  text: you no longer allow him to do anything for his father or mother,[a]
translation:
  language: te
  text: మీరు ఇకపై అతడు తన తండ్రికిగానీ తల్లికిగానీ ఏమీ చేయనివ్వరు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన తండ్రికిగానీ తల్లికిగానీ సహాయంగా ఏమీ చేయడానికి.” ఈ సందర్భంలో విస్తృతార్థంగల గ్రీకు పదబంధం ఆచరణాత్మక లేదా ఆర్థిక సహాయాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: ఇక
  rationale: మునుపు సాధ్యమైన పని ఇప్పుడు కొనసాగనివ్వడం లేదనే కాలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀφίετε
  choice: అనుమతించరు
  rationale: ఈ సందర్భంలో ἀφίημι అంటే ‘క్షమించు’ లేదా ‘విడిచిపెట్టు’ కాదు; ఒక పని చేయనివ్వడం, అనుమతించడం అనే భావం.
- source_word: αὐτὸν
  choice: అతడు ... చేయడానికి
  rationale: గ్రీకు వాక్యంలోని పురుష ఏకవచన కర్మను తెలుగు అనంతక్రియా నిర్మాణంలో సహజంగా కర్తగా వ్యక్తం చేస్తుంది.
- source_word: οὐδὲν ποιῆσαι
  choice: ఏమీ చేయడానికి
  rationale: ఏ విధమైన కార్యాన్నీ చేయనివ్వడం లేదనే విస్తృత భావాన్ని నిలుపుతుంది; సహాయం లేదా ధనసహాయం అని మూలపాఠం కంటే సంకుచితం చేయదు.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: తన తండ్రికి గానీ తల్లికి గానీ
  rationale: దత్తివిభక్తి ప్రయోజనార్థక భావాన్ని ‘-కి’ ద్వారా సహజంగా తెలుపుతుంది. సందర్భానుసారం వీరు ఆ వ్యక్తి సొంత తల్లిదండ్రులు కాబట్టి ‘తన’ వాడబడింది; ‘గానీ ... గానీ’ ప్రత్యామ్నాయ సంబంధాన్ని స్పష్టంగా చూపుతుంది.
theological_decisions:
- issue: కొర్బాను సందర్భం సూచించే ఆర్థిక లేదా ఆచరణాత్మక సహాయ భావాన్ని పాఠ్యంలో స్పష్టంగా చేర్చాలా?
  choice: ‘ఏమీ చేయడానికి’ అనే విస్తృత పదబంధాన్ని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘సహాయం చేయడానికి’ లేదా ‘పోషణకు ఏమైనా ఇవ్వడానికి’ అని అనువదించడం
  rationale: ఈ వచనంలోని గ్రీకు పదాలు విస్తృతంగా ‘ఏదైనా చేయడం’ అని చెబుతున్నాయి. పరిసర సందర్భం ఆచరణాత్మక లేదా ఆర్థిక సహాయాన్ని సూచించినా, ప్రధాన పాఠ్యాన్ని ఆ భావానికే పరిమితం చేయకుండా మూలంలోని విస్తృతతను నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. సందర్భంలోని గద్దింపు ధోరణిని నిలుపుతూ, మూలంలోని విస్తృత అర్థాన్ని సంకుచితం చేయలేదు.
