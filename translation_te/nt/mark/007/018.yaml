- from: 'ఆయన వారితో ఇలా అన్నాడు: “మీరు కూడా ఇంత అవివేకంగా ఉన్నారా? బయట నుంచి మనిషిలోకి ప్రవేశించేదేదీ అతణ్ణి అపవిత్రం చేయలేదని[a] మీకు అర్థం కావడం లేదా?'
  to: 'ఆయన వారితో ఇలా అన్నాడు: “మీకు కూడా ఇంత అవగాహన లేదా? బయట నుంచి మనిషిలోకి ప్రవేశించేది ఏదీ అతనిని అపవిత్రం చేయలేకపోతుందని[a] మీకు అర్థం కావడం లేదా?”'
  rationale: The revision restores οὐ δύναται with ‘చేయలేకపోతుంది,’ retaining the source’s assertion of inability rather than a past non-occurrence. It also makes the relative construction more natural and completes the quotation punctuation, without adding theological interpretation.
