id: MRK.7.18
reference: Mark 7:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Οὕτως καὶ ὑμεῖς ἀσύνετοί ἐστε; οὐ νοεῖτε ὅτι πᾶν τὸ ἔξωθεν εἰσπορευόμενον εἰς τὸν ἄνθρωπον οὐ δύναται αὐτὸν κοινῶσαι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/018.yaml
  text: And he said to them[b][a], “So are you also without understanding? Do you not understand that everything that enters into the man from outside is not able to defile him,”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “మీకు కూడా ఇంత అవగాహన లేదా? బయట నుంచి మనిషిలోకి ప్రవేశించేది ఏదీ అతనిని అపవిత్రం చేయలేకపోతుందని[a] మీకు అర్థం కావడం లేదా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “అతనిని అశుద్ధుణ్ణి చేయలేకపోతుందని.” ఇక్కడి గ్రీకు క్రియకు ఈ సందర్భంలో ఆచారపరమైన శుద్ధి–అశుద్ధి భావం ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకు కథనంలోని చారిత్రక వర్తమాన కాలాన్ని సహజమైన తెలుగు కథన శైలిలో భూతకాలంగా అనువదించాం.
- source_word: Οὕτως καὶ ὑμεῖς
  choice: మీరు కూడా ఇంత
  rationale: οὕτως, καί, ὑμεῖς కలిగించే ఆశ్చర్యంతో కూడిన గద్దింపు భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀσύνετοί
  choice: అవివేకంగా
  rationale: ఇక్కడ ఉద్దేశం గ్రహింపులేమి; వెంటనే వచ్చే νοεῖτεతో ఉన్న భావసంబంధాన్ని కాపాడుతూ, అతిగా దూషణాత్మకంగా కాకుండా తెలుపుతుంది.
- source_word: νοεῖτε
  choice: అర్థం కావడం
  rationale: సందర్భంలోని గ్రహించడం అనే జ్ఞానసంబంధ భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: πᾶν τὸ ἔξωθεν εἰσπορευόμενον
  choice: బయట నుంచి ... ప్రవేశించేదేదీ
  rationale: నామవాచకార్థక వర్తమాన కృదంతాన్ని సహజమైన తెలుగు సంబంధార్థక నిర్మాణంగా అందించి, ἔξωθενను ‘బయట నుంచి’గా నిలుపుతుంది.
- source_word: εἰς τὸν ἄνθρωπον
  choice: మనిషిలోకి
  rationale: ఏ మానవునికైనా వర్తించే ఏకవచన సాధారణార్థక ἄνθρωπονను తెలుగులో సహజంగా కాపాడుతుంది.
- source_word: οὐ δύναται αὐτὸν κοινῶσαι
  choice: అతణ్ణి అపవిత్రం చేయలేదు
  rationale: οὐ δύναται యొక్క అసమర్థత భావాన్ని సందర్భానుసారంగా తెలుగులో సహజంగా వ్యక్తం చేస్తూ, κοινόωలోని శుద్ధి–అశుద్ధి భావాన్ని ‘అపవిత్రం చేయు’గా అందిస్తుంది.
theological_decisions:
- issue: κοινόωలోని శుద్ధి సంబంధిత పదజాలం
  choice: అపవిత్రం చేయు
  alternative: అశుద్ధుణ్ణి చేయు
  rationale: ఈ సందర్భం ఆచారపరమైన శుద్ధి వివాదానికి సంబంధించినది. ‘అపవిత్రం చేయు’ పాఠ్యంలో సహజంగా ఉండగా, ‘అశుద్ధుణ్ణి చేయు’ అనే ప్రత్యామ్నాయం ఆచారపరమైన భావాన్ని స్పష్టపరుస్తుంది; ఏ తరువాతి సిద్ధాంత నిర్ణయాన్నీ పాఠ్యంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. గ్రీకు వాక్యంలోని ప్రశ్నారూప గద్దింపును, సాధారణార్థక ‘మనిషి’ని, శుద్ధి సంబంధిత ఉద్వేగాన్ని నిలుపుకుంది.
