revisions:
- from: 'కాని మీరు ఇలా అంటారు: ‘ఒకడు తన తండ్రితో గాని తల్లితో గాని, “నా వల్ల నీకు అందవలసిన సహాయం ఏదైనా కొర్బాను[a]”—అంటే, దేవునికి అర్పించిన కానుక[b]—అని చెబితే—’'
  to: 'కాని మీరు ఇలా అంటారు: ‘ఒకడు తన తండ్రికిగాని తల్లికిగాని, “కొర్బాను[a]”—అంటే, కానుక[b]—“నా వల్ల నీకు కలిగే ప్రయోజనం ఏదైనా” అని చెబితే—’'
  rationale: The revision restores the Greek word order, translates Mark’s gloss δῶρον as “కానుక” without adding unstated detail, and uses Telugu dative wording for the father or mother as the addressee. It retains the loanword, the explanatory apposition, the indefinite sense of “whatever,” and the terminal dash because the syntax continues in verse 12. Footnote anchors are placed on the terms to which they directly pertain.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:01:52Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the overall conditional setting and the unfinished syntax leading into verse 12, but it materially rearranges the quoted formula. In Greek, “Corban, that is, a gift” precedes “whatever you may benefit from me.” The draft places the benefit phrase first and expands Mark’s gloss δῶρον (“gift”) to “a gift offered to God,” which is more specific than the explicit gloss.
  naturalness: The Telugu is generally clear and modern, but “తండ్రితో గాని తల్లితో గాని” can suggest speaking with them rather than speaking to them. “తండ్రికిగాని తల్లికిగాని” more naturally expresses the addressees. Restoring the source order also makes the quoted formula easier to follow.
  terminology: “కొర్బాను” appropriately retains the Semitic loanword. Mark’s own explanatory gloss should be translated simply as “కానుక”; the cultural footnote may explain dedication to God without putting that expansion into the main text. “ప్రయోజనం” accurately retains the broader sense of ὠφεληθῇς without limiting it to material aid.
  issues:
  - severity: medium
    issue: The order of the Corban formula is reversed.
    rationale: The source reads “Corban, that is, a gift, whatever you may benefit from me.” The draft puts “whatever help ...” before “Corban,” obscuring the source’s quoted formulation.
  - severity: medium
    issue: The main-text gloss adds “దేవునికి అర్పించిన” to δῶρον.
    rationale: Mark explicitly glosses Κορβᾶν only as “gift.” Dedication to God is useful cultural background and belongs in the footnote, but it should not replace the concise source gloss in the text.
  - severity: low
    issue: “తండ్రితో ... తల్లితో” is not the best rendering of the dative addressees.
    rationale: “తండ్రికిగాని తల్లికిగాని” clearly conveys “to his father or mother,” whereas “తో” can imply interaction with them.
  revised_text: 'కాని మీరు ఇలా అంటారు: ‘ఒకడు తన తండ్రికిగాని తల్లికిగాని, “కొర్బాను[a]”—అంటే, కానుక[b]—“నా వల్ల నీకు కలిగే ప్రయోజనం ఏదైనా” అని చెబితే—’'
