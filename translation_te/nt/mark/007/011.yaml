id: MRK.7.11
reference: Mark 7:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ λέγετε· Ἐὰν εἴπῃ ἄνθρωπος τῷ πατρὶ ἢ τῇ μητρί· Κορβᾶν, ὅ ἐστιν Δῶρον, ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/011.yaml
  text: But you say[a], ‘If a man says to his father or his mother, “Corban” (that is, a gift)[b], whatever you might have benefited from me—’
translation:
  language: te
  text: 'కాని మీరు ఇలా అంటారు: ‘ఒకడు తన తండ్రికిగాని తల్లికిగాని, “కొర్బాను[a]”—అంటే, కానుక[b]—“నా వల్ల నీకు కలిగే ప్రయోజనం ఏదైనా” అని చెబితే—’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కొర్బాను’ అనేది దేవునికి కానుకగా అంకితం చేసినదాన్ని సూచించే పదం; అలా అంకితం చేసినది సాధారణ కుటుంబ అవసరాలకు ఉపయోగించబడేది కాదు.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘అర్పణ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: కాని మీరు ఇలా అంటారు
  rationale: δὲ ముందున్న దేవుని ఆజ్ఞకు మానవ సంప్రదాయాన్ని వ్యతిరేకంగా నిలుపుతుంది; λέγετε సాధారణ వర్తమానాన్ని సూచిస్తుంది.
- source_word: Ἐὰν εἴπῃ ἄνθρωπος
  choice: ఒకడు ... అని చెబితే
  rationale: ἐὰν తో కూడిన aorist subjunctive షరతును సూచిస్తుంది. ἄνθρωπος ఇక్కడ ప్రతినిధి ఏకవచనంగా ఉంది; సహజమైన తెలుగులో ‘ఒకడు’ దానిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: తన తండ్రితో గాని తల్లితో గాని
  rationale: దత్తి విభక్తి సంబోధితులను సూచిస్తుంది; ‘గాని ... గాని’ గ్రీకు ప్రత్యామ్నాయ నిర్మాణాన్ని సహజంగా తెలుపుతుంది.
- source_word: Κορβᾶν
  choice: కొర్బాను
  rationale: గ్రీకు పాఠమే సెమిటిక్ మతపరమైన పదాన్ని లిప్యంతరీకరించి నిలుపుతుంది; అందువల్ల ప్రధాన పాఠంలో దానిని ఉంచి వివరణ జోడించబడింది.
- source_word: ὅ ἐστιν Δῶρον
  choice: అంటే, దేవునికి అర్పించిన కానుక
  rationale: δῶρον యొక్క ప్రాథమిక భావం ‘కానుక’; ఈ సందర్భంలో కొర్బాను అనే అంకిత పదానికి మార్కు ఇచ్చిన వివరణ స్పష్టంగా ఉండేందుకు ‘దేవునికి అర్పించిన’ అని వ్యక్తీకరించబడింది.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: నా వల్ల నీకు అందవలసిన సహాయం ఏదైనా
  rationale: ὃ ἐὰν అనిర్దిష్టమైన ‘ఏదైనా’ భావాన్ని ఇస్తుంది; ὠφεληθῇς తల్లిదండ్రికి లభించగల సహాయం లేదా ప్రయోజనాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో భావం స్పష్టంగా ఉండేందుకు ‘అందవలసిన సహాయం’ అని ఇచ్చాం.
theological_decisions:
- issue: కుటుంబ సహాయాన్ని దేవునికి అంకితమైనదిగా ప్రకటించే కొర్బాను సూత్రం
  choice: ‘కొర్బాను’ అనే చారిత్రక పదాన్ని ప్రధాన పాఠంలో ఉంచి, ‘దేవునికి అర్పించిన కానుక’ అని వివరించడం
  alternative: ప్రధాన పాఠంలోనే ‘దేవునికి అర్పణ’ లేదా ‘కానుక’ అని పూర్తిగా అనువదించడం
  rationale: మూల గ్రీకు సెమిటిక్ పదాన్ని నిలుపుకొని వెంటనే దానికి అర్థం చెబుతుంది. అదే నిర్మాణాన్ని అనుసరించడం చారిత్రక, మతపరమైన ప్రత్యేకతను కాపాడుతుంది; ప్రతిజ్ఞ అమలు గురించి పాఠం చెప్పనిదాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. 12వ వచనంలో వాక్య భావం పూర్తవుతుంది కాబట్టి చివర దీర్ఘ విరామచిహ్నం ఉంచబడింది.
