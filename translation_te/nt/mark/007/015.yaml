  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδέν ἐστιν ἔξωθεν τοῦ ἀνθρώπου εἰσπορευόμενον εἰς αὐτὸν ὃ δύναται ⸂κοινῶσαι αὐτόν⸃· ἀλλὰ τὰ ⸂ἐκ τοῦ ἀνθρώπου ἐκπορευόμενά⸃ ἐστιν τὰ κοινοῦντα τὸν ⸀ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/015.yaml
  text: There is nothing outside a man that by going into him is able to defile him; rather, the things that come out from the man are what defile the man.
translation:
  language: te
  text: మనిషి వెలుపల నుండి అతనిలోకి ప్రవేశించి అతన్ని అపవిత్రం చేయగలదేదీ లేదు[a]; అయితే మనిషిలోనుండి బయటికి వచ్చేవే మనిషిని అపవిత్రం చేసేవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతన్ని అశుద్ధం చేయగలదేదీ లేదు.’ గ్రీకు క్రియ శుద్ధి-అశుద్ధి భావంలో ఒకరిని అశుద్ధం చేయడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέν
  choice: ఉన్నదేదీ ... చేయలేదు
  rationale: నపుంసక ఏకవచన నిర్దేశక రూపాన్ని తెలుగులో సహజమైన సంపూర్ణ నిషేధంగా వ్యక్తపరుస్తుంది.
- source_word: ἔξωθεν τοῦ ἀνθρώπου
  choice: మనిషికి బయట ఉన్న
  rationale: బాహ్య స్థానం/మూలాన్ని సూచిస్తూ, తరువాతి ‘మనిషిలోనుండి బయటికి’ అనే వ్యతిరేక సమాంతరాన్ని నిలుపుతుంది.
- source_word: τοῦ ἀνθρώπου / τὸν ἄνθρωπον
  choice: మనిషి / మనిషిని
  rationale: ἄνθρωπος ఇక్కడ సాధారణ మానవ వ్యక్తిని సూచిస్తుంది; ‘మనిషి’ ఆధునిక తెలుగులో సహజంగా ఆ ప్రతినిధి భావాన్ని ఇస్తుంది.
- source_word: εἰσπορευόμενον εἰς αὐτόν
  choice: అతనిలోకి ప్రవేశించి
  rationale: లోపలికి వెళ్లే చర్యను స్పష్టంగా, సహజమైన తెలుగు క్రియాక్రమంలో తెలియజేస్తుంది.
- source_word: κοινῶσαι / κοινοῦντα
  choice: అపవిత్రునిగా చేయడం
  rationale: శుద్ధి-అశుద్ధి సందర్భాన్ని కాపాడుతూ, నైతిక అపవిత్రతను కూడా మినహాయించని పదప్రయోగం.
- source_word: τὰ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενα
  choice: మనిషిలోనుండి బయటికి వచ్చేవే
  rationale: నపుంసక బహువచన substantival participleను సహజంగా అనువదిస్తూ, బయట ఉన్నవి/లోనుండి వచ్చేవి అనే వ్యత్యాసాన్ని నిలుపుతుంది.
theological_decisions:
- issue: శుద్ధి వివాదంలో κοινόω అర్థం
  choice: అపవిత్రునిగా చేయడం
  alternative: అశుద్ధునిగా చేయడం
  rationale: ‘అపవిత్ర’ అనే పదం ఆచారపరమైన అశుద్ధతతో పాటు సందర్భంలోని విస్తృత నైతిక భావాన్ని కూడా మోయగలదు; ఏ ఒక్క భావానికీ వాక్యాన్ని పరిమితం చేయదు.
- issue: ἄνθρωπος యొక్క సాధారణ సూచన
  choice: మనిషి
  alternative: వ్యక్తి
  rationale: లింగాన్ని అనవసరంగా ప్రత్యేకించకుండా, ఏ మానవునికైనా వర్తించే ఏకవచన ప్రతినిధి భావాన్ని సహజంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన, సహజమైన వాక్యనిర్మాణం. మూలంలోని బయట/లోనుండి బయటికి అనే వ్యత్యాసం మరియు ‘మనిషి’ అనే ఏకవచన సమాంతరత కాపాడబడ్డాయి.
