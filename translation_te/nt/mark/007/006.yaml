review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the contrast, Isaiah citation formula, direct application to the audience, collective singular ‘heart,’ and relational distance from God. However, ‘వేషధారులైన’ primarily denotes those wearing a disguise or costume and can weaken or misdirect the ethical-religious force of ὑποκριτῶν. ‘కపటులైన’ more directly conveys ‘hypocrites’ in this context.
  naturalness: The revised wording is fluent modern standard Telugu and maintains an appropriately dignified scriptural register. ‘ఇలా వ్రాయబడి ఉంది’ is a natural citation introduction; the collective expression ‘ఈ ప్రజలు ... వారి హృదయం’ remains understandable and preserves the source’s singular-heart imagery.
  terminology: ‘కపటులు’ is the preferable established Telugu term here for ὑποκριταί. ‘ఘనపరుస్తారు’ adequately represents τιμᾷ (‘honors’), and ‘హృదయం’ correctly preserves the Greek singular collective metaphor.
  issues:
  - severity: medium
    issue: ‘వేషధారులైన’ for τῶν ὑποκριτῶν
    rationale: While it can suggest outward pretense, its primary modern sense is ‘costumed/disguised persons.’ In this prophetic moral indictment, ‘కపటులైన’ conveys hypocrisy more accurately without introducing an image of literal disguise.
