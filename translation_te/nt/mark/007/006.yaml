id: MRK.7.6
reference: Mark 7:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν ⸀αὐτοῖς· Καλῶς ἐπροφήτευσεν Ἠσαΐας περὶ ὑμῶν τῶν ὑποκριτῶν, ὡς γέγραπται ⸀ὅτι Οὗτος ὁ λαὸς τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/006.yaml
  text: 'But he said to them[a], “Isaiah prophesied well about you hypocrites, as it is written: ‘This people honors me with their lips, but their heart is far from me.’”'
translation:
  language: te
  text: 'అయితే ఆయన వారితో ఇలా అన్నాడు: “కపటులైన మీ గురించి యెషయా చక్కగా ప్రవచించాడు; ఇలా వ్రాయబడి ఉంది: ‘ఈ ప్రజలు తమ పెదవులతో నన్ను ఘనపరుస్తారు, కానీ వారి హృదయం నాకు దూరంగా ఉంది.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘ప్రజ’ మరియు ‘హృదయం’ ఏకవచనంలో ఉన్నాయి. అయితే సమూహాన్ని సూచించేందుకు తెలుగులో ‘ఈ ప్రజలు,’ ‘తమ,’ ‘వారి’ అనే రూపాలు వాడబడ్డాయి; ‘హృదయం’ మాత్రం ఏకవచనంగానే ఉంచబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి సంభాషణకు ప్రతిస్పందనగా స్వల్ప విరుద్ధతను, కథన మలుపును సహజంగా తెలియజేస్తుంది.
- source_word: εἶπεν αὐτοῖς
  choice: ఆయన వారితో ఇలా అన్నాడు
  rationale: దాత్యర్థక పరోక్ష కర్మతో ఉన్న గ్రీకు వాక్యాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో వ్యక్తం చేస్తుంది.
- source_word: Καλῶς ἐπροφήτευσεν
  choice: సరిగానే ప్రవచించాడు
  rationale: ప్రవచనం వారి పరిస్థితికి చక్కగా సరిపోతుందనే ప్రశంసాత్మక భావాన్ని ఇస్తుంది; ‘నైతికంగా సరిగా’ లేదా ‘అచ్చంగా’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: περὶ ὑμῶν τῶν ὑποκριτῶν
  choice: వేషధారులైన మీ గురించి
  rationale: ὑποκριτῶν అనేది ‘మీ’ అనే సర్వనామాన్ని వివరిస్తున్న అన్వయపదం. ‘వేషధారులు’ బాహ్య భక్తి ప్రదర్శనకు, అంతర్గత దూరానికి మధ్య ఉన్న వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὡς γέγραπται ὅτι
  choice: 'ఇలా రాసి ఉంది:'
  rationale: లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే గ్రీకు సూత్రవాక్యానికి సహజమైన తెలుగు రూపం.
- source_word: Οὗτος ὁ λαὸς
  choice: ఈ ప్రజలు
  rationale: గ్రీకులో సమూహాన్ని సూచించే ఏకవచన నామవాచకం ఉన్నప్పటికీ, ఆధునిక తెలుగులో ఒక జనసమూహాన్ని సహజంగా సూచించే రూపం ఇది; ప్రత్యక్ష ప్రవచన నింద యొక్క బలం నిలుస్తుంది.
- source_word: τοῖς χείλεσίν με τιμᾷ
  choice: తమ పెదవులతో నన్ను ఘనపరుస్తారు
  rationale: τιμάω యొక్క ‘గౌరవించు/ఘనపరచు’ భావాన్ని, పెదవులతో చేసే బాహ్య ప్రకటనను స్పష్టంగా నిలుపుతుంది.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: కానీ వారి హృదయం
  rationale: గ్రీకులోని ఏకవచన ‘హృదయం’ అనే సమూహాత్మక రూపకాన్ని ఉంచుతూ, αὐτῶν లోని బహువచన సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: నాకు దూరంగా ఉంది
  rationale: కేవలం భౌతిక దూరం కాక, దేవునితో ఉన్న అంతర్గత లేదా సంబంధపరమైన దూరాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యెషయా 29:13లోని ప్రవచన నిందను యేసు తన ఎదుటివారికి అన్వయించడం
  choice: ‘వేషధారులైన మీ గురించి’ మరియు ‘ఈ ప్రజలు’ అనే ప్రత్యక్ష సంబోధన బలాన్ని నిలిపాం.
  alternative: నిందను వినేవారినుంచి వేరుచేసి సాధారణ మానవ ప్రవర్తనగా మృదువుగా చెప్పడం.
  rationale: గ్రీకు వచనం యెషయా మాటలను యేసు ప్రస్తుత శ్రోతలకు నేరుగా అన్వయిస్తున్నట్లు చెబుతుంది; అదనపు సిద్ధాంత వ్యాఖ్యానం లేకుండా ఆ ఉద్రిక్తతను నిలపాలి.
- issue: ఏకవచన ‘హృదయం’ మరియు సమూహమైన ‘ప్రజలు’ మధ్య సంబంధం
  choice: ‘ఈ ప్రజలు … వారి హృదయం’ అని అనువదించి, సమూహానికి ఒకే అంతర్గత ధోరణి ఉన్నదనే రూపకాన్ని నిలిపాం.
  alternative: ‘వారి హృదయాలు’ అని బహువచనం చేసి ప్రతి వ్యక్తి అంతరంగాన్ని ప్రత్యేకంగా చూపడం.
  rationale: మూలంలో καρδία ఏకవచనంలో ఉంది; దాన్ని బహువచనం చేయడం ప్రవచనంలోని సమూహాత్మక చిత్రాన్ని అనవసరంగా మార్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన లేఖనశైలి వాడబడింది. ‘వేషధారులు’ ప్రత్యక్ష నిందను నిలుపుతుంది; ‘ఘనపరుస్తారు’ ఆరాధనా సందర్భానికి తగినదిగా ఉండి అతిగా మతశాఖాపరమైన పదజాలాన్ని నివారిస్తుంది.
