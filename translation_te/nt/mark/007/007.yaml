  text: But they worship me in vain[a], teaching as doctrines the commandments of men.
translation:
  language: te
  text: కాని వారు మనుషుల ఆజ్ఞలను సిద్ధాంతాలుగా బోధిస్తూ[a], నన్ను వ్యర్థంగా ఆరాధిస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనుషుల ఆజ్ఞలనే బోధనలుగా బోధిస్తూ.”
    reason: గ్రీకు పదబంధంలోని διδασκαλίας ἐντάλματα ἀνθρώπων ను, మానవ ఆజ్ఞలే బోధనలుగా సమర్పించబడుతున్నాయని స్పష్టపరిచే ప్రత్యామ్నాయ పదక్రమంలో తెలియజేస్తుంది.
lexical_decisions:
- source_word: μάτην
  choice: వ్యర్థంగా
  rationale: ‘ఏ ప్రయోజనం లేకుండా, నిష్ఫలంగా’ అనే క్రియావిశేషణ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: కాని
  rationale: మునుపటి వాక్యంలో పెదవులతో ఘనపరచడానికీ హృదయం దూరంగా ఉండడానికీ మధ్య ఉన్న వ్యత్యాసాన్ని కొనసాగిస్తుంది.
- source_word: σέβονταί με
  choice: నన్ను ... ఆరాధిస్తున్నారు
  rationale: దేవునిపట్ల చూపే భక్తి లేదా ఆరాధనను సూచించే σέβομαι భావాన్ని సందర్భానుగుణంగా స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: διδάσκοντες
  choice: బోధిస్తూ
  rationale: 'వర్తమాన కృదంతం తెలిపే సహవర్తి విధానాన్ని నిలుపుతుంది: వారి ఆరాధన మానవ ఆజ్ఞలను బోధించడంతో ముడిపడి ఉంది.'
- source_word: διδασκαλίας ἐντάλματα ἀνθρώπων
  choice: మనుషుల ఆజ్ఞలను సిద్ధాంతాలుగా
  rationale: మానవ మూలం గల ఆజ్ఞలను అధికారిక బోధనల స్థాయిలో బోధిస్తున్నారనే గ్రీకు పదబంధంలోని సంక్షిప్త సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవారాధనకూ మానవ అధికారంతో ఏర్పడిన ఆజ్ఞలకూ మధ్య వ్యత్యాసం
  choice: మనుషుల ఆజ్ఞలను సిద్ధాంతాలుగా బోధిస్తూ
  alternative: సిద్ధాంతాలుగా మనుషుల ఆజ్ఞలను బోధిస్తూ
  rationale: మానవ ఆజ్ఞలు సిద్ధాంతాల హోదాలో బోధించబడుతున్నాయనే విమర్శను స్పష్టంగా ఉంచుతుంది; అవి కేవలం మానవులు బోధించే ఆజ్ఞలని మాత్రమే సూచించే అపార్థాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రవచన ఉద్ధరణకు తగిన గంభీరతతో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదజాలం. ‘ఆజ్ఞలు,’ ‘సిద్ధాంతాలు,’ ‘ఆరాధిస్తున్నారు’ అనే పదాలు మూలంలోని మతపరమైన అధికార స్వరాన్ని నిలుపుతాయి.
