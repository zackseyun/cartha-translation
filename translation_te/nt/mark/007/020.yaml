    text: లేదా, “మనిషిని అశుద్ధునిగా చేస్తుంది.” గ్రీకు క్రియ ఒకరిని అపవిత్రునిగా లేదా అశుద్ధునిగా చేసే శుద్ధి–అశుద్ధత పరిభాషకు చెందినది.
    reason: lexical_alternative
  revision_rationale: The revision retains the source’s imperfect aspect, direct-speech form, generic singular parallelism, emphatic ‘that very thing,’ and purity-language sense. It removes an unnecessary specificity in ‘ఆ మనిషి,’ improves modern Telugu idiom, and smooths the footnote alternative without imposing a doctrinal interpretation.
