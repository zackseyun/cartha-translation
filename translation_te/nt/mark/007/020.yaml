  text: ἔλεγεν δὲ ὅτι Τὸ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενον ἐκεῖνο κοινοῖ τὸν ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/020.yaml
  text: And he was saying, “What comes out from the man—that defiles the man.”
translation:
  language: te
  text: 'ఆయన ఇలా చెబుతూ ఉన్నాడు: “మనిషి నుండి బయటికి వచ్చేదే మనిషిని అపవిత్రం చేస్తుంది.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనిషిని అశుద్ధునిగా చేస్తుంది.” గ్రీకు క్రియ ఒకరిని అపవిత్రునిగా లేదా అశుద్ధునిగా చేసే శుద్ధి–అశుద్ధత పరిభాషకు చెందినది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ఇలా అంటూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న లేదా పునరావృతమవుతున్న మాటల భావాన్ని తెలుగులో సహజంగా సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది స్వల్ప కథన అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో వాక్యక్రమమే ఆ కొనసాగింపును సహజంగా తెలియజేస్తుంది. ‘అయితే’ అనడం మూలంలో లేని బలమైన వ్యతిరేకతను సూచించవచ్చు.
- source_word: ὅτι
  choice: ప్రత్యక్ష ఉల్లేఖనానికి ద్విబిందువు మరియు ఉల్లేఖన చిహ్నాలు
  rationale: మాటల విషయాన్ని పరిచయం చేసే ὅτιని తెలుగులో ప్రత్యక్ష వాక్యంగా సహజంగా వ్యక్తం చేశాం.
- source_word: Τὸ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενον
  choice: మనిషిలో నుండి బయటికి వచ్చేది
  rationale: నామవాచకార్థక కృదంత నిర్మాణాన్ని సహజమైన తెలుగు సంబంధార్థక రూపంలో అందిస్తూ, ἐκ యొక్క ‘లో నుండి’ భావాన్ని నిలిపింది.
- source_word: ἀνθρώπου / ἄνθρωπον
  choice: మనిషి / ఆ మనిషిని
  rationale: ఇక్కడ ἄνθρωπος మానవుణ్ణి సాధారణ ప్రతినిధిగా సూచిస్తుంది. ఏకవచనాన్ని, రెండుసార్ల పదపునరుక్తిని నిలుపుతూ తెలుగు వాక్యంలో రెండవ ప్రస్తావనకు ‘ఆ’ను వాడాం.
- source_word: ἐκεῖνο
  choice: వచ్చేదే
  rationale: గ్రీకు నిర్దేశక సర్వనామంలోని ఉద్ఘాటనను తెలుగు ‘ఏ’ ప్రత్యయంతో సహజంగా వ్యక్తం చేశాం.
- source_word: κοινοῖ
  choice: అపవిత్రం చేస్తుంది
  rationale: ఈ శుద్ధి–అశుద్ధత సందర్భంలో క్రియకు ‘అపవిత్రం చేయడం’ అనే అర్థం ఉంది. ఇది స్పష్టంగా, సంక్షిప్తంగా ఉంది; మరింత ప్రత్యక్షమైన శుద్ధి-పరిభాషను పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: κοινόωలోని శుద్ధి–అశుద్ధత భావం
  choice: అపవిత్రం చేస్తుంది
  alternative: అశుద్ధుణ్ణి చేస్తుంది
  rationale: ప్రధాన పాఠంలో నైతిక, ఆచార సంబంధ అపవిత్రత రెండింటినీ మోయగల సహజ పదాన్ని ఎంచుకున్నాం. యూదుల శుద్ధి నేపథ్యాన్ని మరింత ప్రత్యక్షంగా చూపే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం; తద్వారా భావాన్ని ఏకపక్షంగా పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో అనువదించబడింది. ‘అంటూ ఉన్నాడు’ మూలంలోని అసంపూర్ణ భూతకాల భావాన్ని నిలుపుతుంది; ‘వచ్చేదే’ ἐκεῖνο యొక్క ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
