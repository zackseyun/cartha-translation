  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἰσῆλθεν ⸀εἰς οἶκον ἀπὸ τοῦ ὄχλου, ἐπηρώτων αὐτὸν οἱ μαθηταὶ αὐτοῦ ⸂τὴν παραβολήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/017.yaml
  text: And when he entered a house away from the crowd[a], his disciples asked him about the parable.
translation:
  language: te
  text: ఆయన జనసమూహాన్ని విడిచి ఒక ఇంట్లోకి ప్రవేశించినప్పుడు, ఆయన శిష్యులు ఆ ఉపమానం[a] గురించి ఆయనను అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆ మాట,” లేదా “ఆ దృష్టాంతం.” గ్రీకు పదం παραβολή (పరబోలే).
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: అప్పుడు/మరియు భావాన్ని సహజ కాలవాక్య నిర్మాణంలో ‘ప్రవేశించినప్పుడు’గా వ్యక్తపరచడం
  rationale: καί మార్కు కథన ప్రవాహాన్ని కొనసాగిస్తుంది; ὅτε కాలసంబంధాన్ని తెలియజేస్తుంది. తెలుగులో విడిగా ‘మరియు’ పెట్టడం కంటే కాలవాక్య నిర్మాణమే సహజం.
- source_word: εἰσῆλθεν εἰς οἶκον
  choice: ఒక ఇంట్లోకి ప్రవేశించినప్పుడు
  rationale: οἶκον ముందు నిర్దిష్ట ఉపపదం లేదు; అందువల్ల ‘ఆ ఇంట్లోకి’ కాకుండా ‘ఒక ఇంట్లోకి’ మూలరూపాన్ని ప్రతిబింబిస్తుంది. ‘ప్రవేశించాడు’ క్రియాబలాన్ని నిలుపుతుంది.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: జనసమూహాన్ని విడిచి
  rationale: ఆయన జనసమూహం నుండి వేరై ఇంట్లోకి వెళ్లిన సందర్భాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; మూలంలోని వియోగ భావాన్ని నిలుపుతుంది.
- source_word: ἐπηρώτων
  choice: అడిగారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగిన లేదా పునరావృతమైన ప్రశ్నను సూచించగలిగినా, కథన తెలుగులో సాధారణ భూతకాలం సహజంగా ఉంటుంది.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ఆయన శిష్యులు
  rationale: గ్రీకు స్వామ్య నిర్మాణానికి సహజమైన తెలుగు రూపం.
- source_word: τὴν παραβολήν
  choice: ఆ ఉపమానం
  rationale: παραβολήకు ‘ఉపమానం’ సాధారణమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం. ఇక్కడ అది ముందున్న అలంకారిక బోధను సూచిస్తుంది; పదం కలిగిన విస్తృతార్థాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
theological_decisions:
- issue: ఇక్కడ παραβολή చిన్న అలంకారిక వాక్యాన్నా, ఉపమాన బోధననా సూచిస్తుందనే అర్థ విస్తృతి
  choice: ఆ ఉపమానం
  alternative: ఆ మాట; ఆ దృష్టాంతం
  rationale: మార్కు ఉపయోగించిన బోధనా వర్గీకరణను నేరుగా నిలుపుతూ, సందర్భాన్ని ఒకే విధంగా సంకుచితం చేయకుండా ప్రత్యామ్నాయాలను పాదటిప్పణిలో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని నిర్దిష్టతలేని ‘ఒక ఇల్లు’ను, జనసమూహం నుండి వేరైన సందర్భాన్ని, παραβολή యొక్క అర్థ విస్తృతిని నిలుపుకుంది.
