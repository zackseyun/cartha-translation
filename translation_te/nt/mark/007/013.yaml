  to: మీరు అందజేసిన సంప్రదాయం ద్వారా దేవుని వాక్యాన్ని చెల్లనిదిగా చేస్తున్నారు.[a][b] ఇలాంటి మరెన్నో పనులు కూడా మీరు చేస్తున్నారు.[c]
