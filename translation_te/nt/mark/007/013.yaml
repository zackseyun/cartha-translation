source:
  edition: SBLGNT
  text: ἀκυροῦντες τὸν λόγον τοῦ θεοῦ τῇ παραδόσει ὑμῶν ᾗ παρεδώκατε· καὶ παρόμοια τοιαῦτα πολλὰ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/013.yaml
  text: thus nullifying the word of God by your tradition that you have handed down[c][b][a]. And you do many other similar things.
translation:
  language: te
  text: మీరు అందజేసిన సంప్రదాయం ద్వారా దేవుని వాక్యాన్ని చెల్లనిదిగా చేస్తున్నారు.[a][b] ఇలాంటి మరెన్నో పనులు కూడా మీరు చేస్తున్నారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని వాక్యాన్ని నిర్వీర్యం చేస్తున్నారు” లేదా “దాని చెల్లుబాటును కొట్టివేస్తున్నారు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీరు అందజేసిన సంప్రదాయం ద్వారా.”
    reason: lexical_alternative
  - marker: c
    text: గ్రీకు పదబంధం కొంత పునరుక్తితో ఉద్ఘాటిస్తుంది; అక్షరార్థానికి దగ్గరగా, “ఇలాంటివాటిని పోలిన అనేక విషయాలు.”
    reason: source_form
lexical_decisions:
- source_word: ἀκυροῦντες
  choice: చెల్లకుండా చేస్తున్నారు
  rationale: దేవుని వాక్యపు అధికారాన్ని లేదా ప్రభావాన్ని వారు తమ సంప్రదాయం ద్వారా నిర్వీర్యం చేస్తున్నారనే భావాన్ని ఇది సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఈ వర్తమాన రూపం కొనసాగుతున్న లేదా అలవాటైన చర్యను కూడా సూచిస్తుంది.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: దేవుని వాక్యాన్ని
  rationale: λόγος అనే పదానికి సందర్భానుగుణమైన ప్రత్యక్ష అనువాదం. దేవుని ఆజ్ఞకు వారి సంప్రదాయానికి మధ్య ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: τῇ παραδόσει ὑμῶν
  choice: మీ సంప్రదాయం ద్వారా
  rationale: 'దత్తి విభక్తి ఇక్కడ సాధనార్థకంగా ఉంది: దేవుని వాక్యాన్ని చెల్లకుండా చేయడానికి వారి సంప్రదాయమే సాధనం. ‘మీ’ అనే పదం మూలంలోని వ్యత్యాసాన్ని కాపాడుతుంది.'
- source_word: ᾗ παρεδώκατε
  choice: మీరు అందించిన
  rationale: παράδοσις–παραδίδωμι మధ్య ఉన్న పదసంబంధాన్ని తెలుగులో సాధ్యమైనంత సహజంగా ప్రతిబింబిస్తుంది. సంప్రదాయాన్ని వారే ఇతరులకు అందించారనే భావం నిలుస్తుంది.
- source_word: παρόμοια τοιαῦτα πολλὰ
  choice: ఇలాంటి మరెన్నో పనులు కూడా
  rationale: గ్రీకులోని కొంత పునరుక్తితో కూడిన ఉద్ఘాటనను తెలుగులో అసహజంగా కాకుండా ‘ఇలాంటి’, ‘మరెన్నో’, ‘కూడా’ అనే పదాలతో వ్యక్తం చేస్తుంది.
- source_word: ποιεῖτε
  choice: మీరు చేస్తున్నారు
  rationale: వర్తమాన కాలంలోని అలవాటైన, కొనసాగుతున్న ప్రవర్తనను సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యేసు తప్పుపట్టిన ‘సంప్రదాయం’ స్వభావం
  choice: మూలంలో ఉన్నట్లే ‘మీ సంప్రదాయం’ అని అనువదించి, ఈ ప్రత్యేక సంప్రదాయం దేవుని వాక్యానికి విరుద్ధంగా ఉందని సందర్భమే చూపనివ్వడం.
  alternative: ‘మానవ సంప్రదాయం’ అని స్పష్టీకరించడం.
  rationale: ఈ వచనంలో గ్రీకు పాఠం ‘మీ సంప్రదాయం’ అని మాత్రమే చెబుతుంది; ‘మానవ’ అనే విశేషణాన్ని చేర్చడం సందర్భబద్ధమైన వ్యాఖ్యానమే అయినా మూలంలో ప్రత్యక్షంగా లేదు.
- issue: ἀκυροῦντες సూచించే చర్య తీవ్రత
  choice: ‘చెల్లకుండా చేస్తున్నారు’ అని అనువదించడం.
  alternative: ‘నిరర్థకం చేస్తున్నారు’ లేదా ‘రద్దు చేస్తున్నారు’.
  rationale: ఇది దేవుని వాక్యం స్వతహాగా అధికారరహితమైందని కాకుండా, వారి ఆచరణలో దాని అధికారాన్ని లేదా ప్రభావాన్ని కొట్టివేస్తున్నారని తెలియజేస్తుంది; మూలంలోని ఆరోపణ తీవ్రతను తగ్గించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘సంప్రదాయం’ అనే సాధారణ పదాన్ని ఉంచి, సందర్భంలో ఉన్న ప్రతికూల భావాన్ని అనువాదంలో అదనపు విశేషణంతో ముందే నిర్ణయించలేదు. ‘అందించిన/సంప్రదాయం’ ద్వారా గ్రీకు మూలంలోని సంబంధిత పదాల ప్రతిధ్వనిని కొంతవరకు నిలుపుతూ, తెలుగులో అతిగా పునరుక్తి రాకుండా చూశాం.
