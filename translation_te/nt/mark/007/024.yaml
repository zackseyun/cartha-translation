id: MRK.7.24
reference: Mark 7:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂Ἐκεῖθεν δὲ⸃ ἀναστὰς ἀπῆλθεν εἰς τὰ ⸀ὅρια ⸀Τύρου. καὶ εἰσελθὼν εἰς οἰκίαν οὐδένα ἤθελεν γνῶναι, καὶ οὐκ ἠδυνήθη λαθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/024.yaml
  text: From there he got up and went away to the region of Tyre[a]. After entering a house, he wanted no one to know it[c][b], yet he could not remain hidden.
translation:
  language: te
  text: ఆయన అక్కడి నుండి లేచి తూరు ప్రాంతానికి[a] వెళ్లాడు. ఒక ఇంట్లోకి ప్రవేశించి, తాను అక్కడ ఉన్న సంగతి ఎవరికీ తెలియకూడదని కోరుకున్నాడు[b]. అయినా ఆయన దాగి ఉండలేకపోయాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తూరు భూభాగానికి.” గ్రీకు పదం కేవలం సరిహద్దు రేఖను మాత్రమే కాకుండా తూరుకు చెందిన జిల్లా లేదా ప్రాంతాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఎవరికీ తెలియకూడదని కోరుకున్నాడు.” గ్రీకులో కర్మ స్పష్టంగా లేదు; సందర్భంలో అది ఆయన అక్కడ ఉన్న సంగతి లేదా ఆయన ఆచూకీని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “అయినా ఆయన ఎవరి దృష్టికీ రాకుండా ఉండలేకపోయాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκεῖθεν δὲ
  choice: అక్కడి నుండి
  rationale: Ἐκεῖθεν మునుపటి ప్రదేశం నుండి కదలడాన్ని సూచిస్తుంది. δέ ఇక్కడ స్వల్ప అనుసంధాన పదం; సహజమైన తెలుగు కథనంలో దాన్ని విడిగా బలంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: ἀναστὰς
  choice: లేచి
  rationale: ఈ భూతకాల క్రియావిశేష రూపం కథనంలోని తదుపరి చర్యను ప్రవేశపెడుతుంది; ‘లేచి’ దాని స్పష్టమైన కదలిక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἀπῆλθεν
  choice: వెళ్లాడు
  rationale: ἀπέρχομαι ఒక చోటు నుండి మరొక చోటుకు వెళ్లడాన్ని సూచిస్తుంది. ‘అక్కడి నుండి’ ఇప్పటికే విడిచి వెళ్లే భావాన్ని తెలియజేస్తున్నందున ‘వెళ్లాడు’ సహజంగా సరిపోతుంది.
- source_word: εἰς τὰ ὅρια Τύρου
  choice: తూరు ప్రాంతానికి
  rationale: ὅρια అనే పదం సరిహద్దులు, ప్రాంతం, లేదా భూభాగాన్ని సూచించగలదు. ఇక్కడ కేవలం సరిహద్దు రేఖకన్నా తూరుతో అనుబంధమైన ప్రాంతమే సందర్భానికి తగినది.
- source_word: καὶ εἰσελθὼν εἰς οἰκίαν
  choice: ఒక ఇంట్లోకి ప్రవేశించి
  rationale: క్రియావిశేష రూపం వరుసగా జరిగిన చర్యను చూపుతుంది; οἰκίαν నిర్దిష్ట ఉపపదం లేకుండా ఉన్నందున ‘ఒక ఇల్లు’ అని అనువదించబడింది.
- source_word: οὐδένα ἤθελεν γνῶναι
  choice: తాను అక్కడ ఉన్న సంగతి ఎవరికీ తెలియకూడదని కోరుకున్నాడు
  rationale: గ్రీకులో ‘తెలుసుకోవడం’ అనే క్రియకు కర్మ స్పష్టంగా చెప్పబడలేదు; సందర్భంలో అది ఆయన ఉనికి లేదా ఆయన ఎక్కడ ఉన్నారనే సంగతిని సూచిస్తుంది. తెలుగు వాక్యం సహజంగా ఉండేందుకు ఆ అంతర్భావాన్ని పరిమితంగా స్పష్టం చేశాము.
- source_word: καὶ οὐκ ἠδυνήθη λαθεῖν
  choice: అయినా ఆయన దాగి ఉండలేకపోయాడు
  rationale: λανθάνω ఇక్కడ ఇతరుల దృష్టికి రాకుండా ఉండడం లేదా ఎవరికీ తెలియకుండా ఉండడం అనే భావాన్ని ఇస్తుంది. ‘అయినా’ ఆయన సంకల్పానికీ ఫలితానికీ మధ్య ఉన్న వ్యత్యాసాన్ని సహజంగా చూపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి వాడబడింది. గ్రీకులో అంతర్భావంగా ఉన్న కర్మను తెలుగు సహజత్వం కోసం పరిమితంగా స్పష్టం చేస్తూనే, పాదసూచికలో మూలంలోని అస్పష్టతను నిలిపాము.
