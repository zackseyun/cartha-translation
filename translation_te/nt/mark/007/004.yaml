id: MRK.7.4
reference: Mark 7:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀπ’ ⸀ἀγορᾶς ἐὰν μὴ ⸀βαπτίσωνται οὐκ ἐσθίουσιν, καὶ ἄλλα πολλά ἐστιν ἃ παρέλαβον κρατεῖν, βαπτισμοὺς ποτηρίων καὶ ξεστῶν καὶ χαλκίων ⸂καὶ κλινῶν⸃—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/004.yaml
  text: 'And when they come from the marketplace[a], they do not eat unless they wash themselves[b], and there are many other things that they have received to keep: washings of cups and pitchers and copper vessels and dining couches—'
translation:
  language: te
  text: 'వారు సంత నుంచి వచ్చినప్పుడు తమను తాము కడుక్కోకపోతే[a] భోజనం చేయరు. ఇంకా వారు పాటించడానికి స్వీకరించిన అనేక ఇతర ఆచారాలు ఉన్నాయి: గిన్నెలు, కూజాలు, రాగి పాత్రలు, భోజనానికి వాలుకునే మంచాలు[b] కడగడం—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమను తాము ముంచుకోకపోతే.’ ఇక్కడి గ్రీకు క్రియ తరచుగా ‘బాప్తిస్మం చేయడం’ అని అనువదించబడుతుంది; అయితే ఈ సందర్భంలో అది ఆచారశుద్ధి కోసం కడుక్కోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రాచీన ప్రతులలో ‘భోజనానికి వాలుకునే మంచాలు’ అనే మాటలు లేవు.
    reason: textual_variant
lexical_decisions:
- source_word: ἀγορᾶς
  choice: సంత
  rationale: ఇది ప్రజలు కొనుగోలు, అమ్మకాలు చేసే బహిరంగ మార్కెట్ ప్రదేశాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘సంత’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: βαπτίσωνται
  choice: తమను తాము కడుక్కోకపోతే
  rationale: ఇక్కడ క్రియ యూదుల ఆచారశుద్ధికి సంబంధించిన కడుక్కోవడాన్ని సూచిస్తుంది. మధ్యమ రూపంలోని స్వీయసంబంధ భావాన్ని ‘తమను తాము’ తెలియజేస్తుంది; ‘బాప్తిస్మం పొందడం’ అనే అనుచితమైన క్రైస్తవ ఆచార భావాన్ని ఇది దిగుమతి చేయదు.
- source_word: παρέλαβον κρατεῖν
  choice: పాటించడానికి స్వీకరించిన
  rationale: ఈ పదబంధం వారు అందుకున్న ఆచారాలను కొనసాగిస్తూ పాటించడాన్ని తెలియజేస్తుంది; స్వీకరణ, ఆచరణ అనే రెండు అంశాలనూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: βαπτισμοὺς
  choice: కడగడం
  rationale: ఈ సందర్భంలో పాత్రల ఆచారబద్ధమైన కడుగుదలలను సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో జాబితాతో సహజంగా కలవడానికి క్రియానామ రూపాన్ని వాడాం.
- source_word: ξεστῶν
  choice: కూజాలు
  rationale: ξέστης అనేది ద్రవాలను ఉంచే లేదా పోసే జాడీ/కూజా వంటి పాత్ర; ‘కూజాలు’ స్పష్టమైన, అతిగా నిర్దిష్టం కాని సమానార్థకం.
- source_word: χαλκίων
  choice: రాగి పాత్రలు
  rationale: ఈ పదం రాగి లేదా దాని మిశ్రమ లోహంతో చేసిన వస్తువులను సూచిస్తుంది; ‘రాగి పాత్రలు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: κλινῶν
  choice: భోజనం చేసేటప్పుడు వాలుకునే పీఠాలు
  rationale: κλίνη మంచం లేదా వాలుకునే పీఠాన్ని సూచించవచ్చు. ఈ భోజన సందర్భంలో ప్రాచీన కాలంలో భోజనం చేస్తూ వాలుకునే పీఠాలనే ఉద్దేశించినట్లు సందర్భం సూచిస్తుంది; ‘బల్లలు’ అని చదును చేయకుండా సాంస్కృతిక రూపాన్ని వివరిస్తుంది.
- source_word: ἄλλα πολλά
  choice: అనేక ఇతర ఆచారాలు
  rationale: అక్షరార్థంగా ‘అనేక ఇతర విషయాలు’; ఇక్కడ పాటించడానికి స్వీకరించిన వాటి గురించి ఉన్నందున ‘ఆచారాలు’ సహజమైన సందర్భోచిత వ్యక్తీకరణ.
theological_decisions:
- issue: ఆచారశుద్ధి సందర్భంలో βαπτίσωνται / βαπτισμοὺς అర్థం
  choice: ‘కడుక్కోవడం / కడగడం’గా అనువదించడం
  alternative: ‘ముంచుకోవడం / ముంచడాలు’ లేదా ‘బాప్తిస్మం పొందడం / బాప్తిస్మాలు’
  rationale: వాక్యం పరిసయ్యుల శుద్ధి ఆచారాల గురించి చెబుతోంది, క్రైస్తవ బాప్తిస్మం గురించి కాదు. ‘కడగడం’ ఆ సందర్భాన్ని నిలుపుతూ అనవసరమైన సాక్రమెంటు భావాన్ని నివారిస్తుంది; ‘ముంచుకోవడం’ అనే సాధ్యమైన మరింత అక్షరార్థ భావాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ప్రాచీన భోజన సంస్కృతిలోని κλινῶνను అస్పష్టమైన ‘మంచాలు’ లేదా తప్పుదారి పట్టించే ‘బల్లలు’గా కాకుండా సంక్షిప్త వివరణాత్మక పదబంధంతో అనువదించాం. మూలంలోని కొనసాగింపు సూచించే డాష్‌ను నిలిపాం.
