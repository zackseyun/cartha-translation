id: MRK.7.28
reference: Mark 7:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ δὲ ἀπεκρίθη καὶ λέγει αὐτῷ· ⸀Κύριε, ⸀καὶ τὰ κυνάρια ὑποκάτω τῆς τραπέζης ⸀ἐσθίουσιν ἀπὸ τῶν ψιχίων τῶν παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/028.yaml
  text: But she answered and said to him[a], “Lord[b], even the little dogs under the table eat from the children's crumbs.”
translation:
  language: te
  text: 'అయితే ఆమె ఆయనకు జవాబిచ్చి ఇలా చెప్పింది: “ప్రభువా,[a] బల్ల కిందనున్న చిన్న కుక్కలు[b] కూడా పిల్లల మెతుకులనుండి తింటాయి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అయ్యా.” గ్రీకు κύριε అనే పదం “ప్రభువా” అనే బిరుదుగానూ, గౌరవపూర్వక సంబోధనగానూ వాడవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “చిన్న కుక్కలు” అని అనువదించిన గ్రీకు పదం చిన్నవైన లేదా ఇంట్లో పెంచే కుక్కలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη καὶ λέγει αὐτῷ
  choice: ఆమె ఆయనకు జవాబిస్తూ … అని చెప్పింది
  rationale: గ్రీకు వాక్యంలోని జవాబివ్వడం, చెప్పడం అనే రెండు క్రియల భావాన్ని సహజమైన తెలుగు సంభాషణా నిర్మాణంలో నిలుపుతుంది; చారిత్రక వర్తమానాన్ని తెలుగు కథనానికి సహజమైన భూతకాలంలో అందిస్తుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: κύριε అనే సంబోధనకు ప్రధానమైన బిరుదు భావాన్ని నిలుపుతుంది; సందర్భంలో గౌరవార్థక సంబోధనగా కూడా అర్థం కావచ్చని పాదసూచిక తెలియజేస్తుంది.
- source_word: καὶ
  choice: కూడా
  rationale: చిన్న కుక్కలకు సైతం ముక్కలు దొరుకుతాయనే స్త్రీ వాదంలోని సమ్మిళిత/బలపరిచే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κυνάρια
  choice: చిన్న కుక్కలు
  rationale: దీనిలోని diminutive భావాన్ని నిలుపుతూ, ‘కుక్కపిల్లలు’ అని వయస్సును అనవసరంగా నిర్దిష్టం చేయదు; ఇంటి వద్ద ఉండే చిన్న కుక్కల భావం సాధ్యమని పాదసూచిక వివరిస్తుంది.
- source_word: ὑποκάτω τῆς τραπέζης
  choice: బల్ల కింద ఉన్న
  rationale: స్థానార్థాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἐσθίουσιν
  choice: తింటాయి
  rationale: ఉదాహరణలోని సాధారణంగా జరిగే చర్యను తెలుగు సాధారణ వర్తమానంతో వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ τῶν ψιχίων
  choice: రొట్టెముక్కల్లో నుండి
  rationale: ψιχία సూచించే చిన్న ఆహారపు ముక్కలు/crumbs భావాన్ని సందర్భానుకూలంగా వ్యక్తం చేస్తూ, ἀπό యొక్క ‘నుండి’ భావాన్ని నిలుపుతుంది.
- source_word: τῶν παιδίων
  choice: పిల్లల
  rationale: షష్ఠీ విభక్తి సంబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది; మూలంలో లేని ‘ఆహారం’ వంటి పదాన్ని చేర్చదు.
theological_decisions:
- issue: యేసును ఉద్దేశించిన κύριε సంబోధన
  choice: ప్రభువా
  alternative: అయ్యా
  rationale: ‘ప్రభువా’ κύριος యొక్క బిరుదు భావాన్ని నిలుపుతుంది. అయితే ఈ ప్రత్యక్ష సంబోధన గౌరవార్థకమైన ‘అయ్యా’ అనే అర్థాన్ని కూడా కలిగి ఉండగలదు; ఆ నిజమైన సందిగ్ధతను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సంభాషణా బలం, ‘కూడా’ అనే వాదనాత్మక నుడికారం, κύριε మరియు κυνάρια పదాల అర్థవిస్తృతిని పాదసూచికలతో నిలుపుకున్నాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
