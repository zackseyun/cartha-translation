reference: Mark 7:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ἀλλ’ εὐθὺς ἀκούσασα⸃ γυνὴ περὶ αὐτοῦ, ἧς εἶχεν τὸ θυγάτριον αὐτῆς πνεῦμα ἀκάθαρτον, ἐλθοῦσα προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/025.yaml
  text: But immediately a woman whose little daughter had an unclean spirit[a], having heard about him[c][b], came and fell at his feet.
translation:
  language: te
  text: అయితే, ఆయన గురించి వినగానే, అపవిత్ర ఆత్మ ఉన్న చిన్న కూతురు[a] గల ఒక స్త్రీ వచ్చి ఆయన పాదాల దగ్గర పడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చిన్న అమ్మాయి.’ గ్రీకులోని θυγάτριον అనేది ‘కూతురు’ అనే పదానికి అల్పార్థక రూపం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: అయితే
  rationale: ముందరి సందర్భంతో ఉన్న స్వల్ప వ్యతిరేక/కొనసాగింపు సంబంధాన్ని సహజమైన తెలుగు కథన శైలిలో నిలుపుతుంది.
- source_word: εὐθὺς ἀκούσασα ... περὶ αὐτοῦ
  choice: ఆయన గురించి వినగానే
  rationale: εὐθύς ఇచ్చే తక్షణత్వాన్ని, ἀκούσασα అనే కృదంతంతో దాని సన్నిహిత సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది; విన్న వెంటనే ఆమె స్పందించిందనే భావమూ నిలుస్తుంది.
- source_word: γυνὴ
  choice: ఒక స్త్రీ
  rationale: నిర్దేశక పదం లేని γυνή కొత్త పాత్రను అనిర్దిష్టంగా పరిచయం చేస్తుంది.
- source_word: θυγάτριον
  choice: చిన్న కూతురు
  rationale: కుమార్తె అనే కుటుంబ సంబంధంతో పాటు గ్రీకు అల్పార్థక రూపంలోని చిన్నతనం లేదా ఆప్యాయత ఛాయను నిలుపుతుంది.
- source_word: ἧς εἶχεν τὸ θυγάτριον αὐτῆς πνεῦμα ἀκάθαρτον
  choice: అపవిత్రాత్మ పట్టిన చిన్న కూతురు ఉన్న
  rationale: తెలుగులో ‘ఆత్మను కలిగి ఉంది’ అన్న కృత్రిమ నిర్మాణాన్ని తప్పించి, కుమార్తె పరిస్థితిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: πνεῦμα ἀκάθαρτον
  choice: అపవిత్రాత్మ
  rationale: మార్కు వాడే పదబంధాన్ని నేరుగా నిలుపుతుంది; ‘దయ్యం’ అని అనువదిస్తే మూలపదం కంటే ఎక్కువ వ్యాఖ్యానం చేరుతుంది.
- source_word: ἐλθοῦσα προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ
  choice: వచ్చి ఆయన పాదాల దగ్గర పడింది
  rationale: క్రమంగా జరిగిన చర్యలను సహజ తెలుగు కథనంగా అందిస్తూ, వినయపూర్వకమైన అత్యవసర వేడుకోలు సూచించే భౌతిక దృశ్యాన్ని నిలుపుతుంది.
theological_decisions:
- issue: πνεῦμα ἀκάθαρτον అనువాదం
  choice: అపవిత్రాత్మ
  alternative: దయ్యం / అశుద్ధాత్మ
  rationale: మార్కు ప్రత్యేక పదజాలాన్ని, దానిలోని అపవిత్రత భావాన్ని నిలుపుటకు నేర అనువాదాన్ని ఎంచుకున్నాం. ‘దయ్యం’ సమీపార్థకమైనప్పటికీ మరింత వ్యాఖ్యానాత్మకం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కథన శైలి. గ్రీకు పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, ‘వినగానే’ ద్వారా తక్షణ స్పందనను సహజంగా చూపించాం; అయినా εὐθύς–ἀκούσασα సంబంధాన్ని నిలిపాం.
