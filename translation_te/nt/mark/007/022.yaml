id: MRK.7.22
reference: Mark 7:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μοιχεῖαι⸃, πλεονεξίαι, πονηρίαι, δόλος, ἀσέλγεια, ὀφθαλμὸς πονηρός, βλασφημία, ὑπερηφανία, ἀφροσύνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/022.yaml
  text: adulteries[a], greed, wickedness, deceit, sensuality, an evil eye, slander, pride[b], foolishness.
translation:
  language: te
  text: వ్యభిచారాలు, దురాశలు, దుష్టకార్యాలు, మోసం, విచ్చలవిడితనం, చెడ్డ చూపు[a], దూషణ[b], అహంకారం, అవివేకం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘చెడ్డ కన్ను’; ఇది అసూయతో కూడిన లేదా ఇతరులకు హాని కోరే దృష్టిని సూచించే నుడికారం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అపవాదం’ లేదా ‘దైవదూషణ.’ గ్రీకు పదం మనుషులకు విరోధంగా పలికే దూషణను గానీ, దేవునికి విరోధంగా పలికే దూషణను గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχεῖαι
  choice: వ్యభిచారాలు
  rationale: గ్రీకు పదం బహువచనంలో ఉంది; వివాహేతర లైంగిక సంబంధాల క్రియలను సూచించేలా తెలుగు బహువచనాన్ని నిలిపింది.
- source_word: πλεονεξίαι
  choice: దురాశలు
  rationale: ఇతరులదాన్ని ఆశిస్తూ మరింత సంపాదించాలనే స్వార్థపూరిత కోరికలను సూచిస్తుంది; బహువచన భావాన్ని కూడా నిలిపింది.
- source_word: πονηρίαι
  choice: దుష్టకార్యాలు
  rationale: గ్రీకు బహువచనం దుష్టత్వం వ్యక్తమయ్యే అనేక క్రియలను సూచించగలదు. తెలుగులో సహజంగా ఉండేందుకు భావవాచకమైన ‘దుష్టత్వాలు’కు బదులు ‘దుష్టకార్యాలు’ అని ఇచ్చింది.
- source_word: δόλος
  choice: మోసం
  rationale: ఉద్దేశపూర్వకంగా వంచించడాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἀσέλγεια
  choice: విచ్చలవిడితనం
  rationale: సిగ్గు, నైతిక అదుపు లేకుండా ప్రవర్తించడాన్ని సూచిస్తుంది; దీనిలో తరచూ లైంగిక భావం ఉన్నా, పదార్థాన్ని కేవలం లైంగిక పాపానికే పరిమితం చేయదు.
- source_word: ὀφθαλμὸς πονηρός
  choice: చెడ్డ చూపు
  rationale: ‘చెడ్డ కన్ను’ అనే మూల రూపకాన్ని తెలుగులో సహజమైన ‘చెడ్డ చూపు’గా నిలిపింది; సందర్భానుసారం అసూయ లేదా హానికరమైన దృష్టి అనే నుడికార భావాన్ని పాదటిప్పణిలో తెలిపింది.
- source_word: βλασφημία
  choice: దూషణ
  rationale: మనుషులపై అపవాదం లేదా దేవునికి విరోధమైన దూషణ—రెండింటినీ పొందుపరచగల విస్తృత తెలుగు పదం. గ్రీకు పదంలోని సందర్భసంబంధ అనిశ్చితిని కాపాడుతుంది.
- source_word: ὑπερηφανία
  choice: అహంకారం
  rationale: తన్నుతాను గొప్పగా ఎంచుకునే గర్వాన్ని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀφροσύνη
  choice: అవివేకం
  rationale: ఇది కేవలం తక్కువ తెలివిని కాక నైతిక, ఆచరణాత్మక విచక్షణలేమిని సూచిస్తుంది; ‘అవివేకం’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: βλασφημία పదం మనుషులపై దూషణనా, దేవునిపై దైవదూషణనా
  choice: దూషణ
  alternative: అపవాదం; దైవదూషణ
  rationale: గ్రీకు పదం మనుషులను కించపరిచే మాటలకూ దేవునికి విరోధంగా పలికే మాటలకూ వాడవచ్చు. ప్రధాన పాఠంలో విస్తృతార్థకమైన పదాన్ని ఉంచి, రెండు సాధ్యార్థాలను పాదటిప్పణిలో స్పష్టం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన పాపాల జాబితాగా రూపొందించబడింది. గ్రీకు బహువచనాలు తెలుగులో సహజంగా ఉన్న చోట నిలిపాయి; అసహజమైన భావవాచక బహువచనానికి బదులు ‘దుష్టకార్యాలు’ వాడింది. అందించిన ఆంగ్ల సంప్రదింపుపాఠంలో పాదటిప్పణి గుర్తులు సంబంధిత పదాల వద్ద లేకపోవడంతో, మూలభాషా ఆధారానికి అనుగుణంగా [a]ను ‘చెడ్డ చూపు’ వద్ద, [b]ను ‘దూషణ’ వద్ద ఉంచింది.
