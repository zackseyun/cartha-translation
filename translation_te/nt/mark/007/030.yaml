revisions:
- from: ఆమె తన ఇంటికి వెళ్లినప్పుడు, ఆ బిడ్డ మంచం మీద పడి ఉండడం, దయ్యం వెళ్లిపోయి ఉండడం[a] చూసింది.
  to: ఆమె తన ఇంటికి వెళ్లినప్పుడు, ఆ బిడ్డ మంచం మీద పడి ఉండడాన్ని, దయ్యం వెళ్లిపోయి ఉండడాన్ని కనుగొంది.[a]
