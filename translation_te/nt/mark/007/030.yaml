  text: καὶ ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς εὗρεν τὸ ⸂παιδίον βεβλημένον ἐπὶ τὴν κλίνην καὶ τὸ δαιμόνιον ἐξεληλυθός⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/030.yaml
  text: And when she went away to her house, she found the child lying on the bed[a], and the demon gone.
translation:
  language: te
  text: ఆమె తన ఇంటికి వెళ్లినప్పుడు, ఆ బిడ్డ మంచం మీద పడి ఉండడాన్ని, దయ్యం వెళ్లిపోయి ఉండడాన్ని కనుగొంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “దయ్యం బయటికి వెళ్లిపోయి ఉండడాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθοῦσα
  choice: వెళ్లినప్పుడు
  rationale: అనంతర ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచించే ఏఓరిస్ట్ పార్టిసిపల్‌ను సహజమైన తెలుగు కాలసంబంధ ఉపవాక్యంగా అందిస్తుంది.
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: తన ఇంటికి
  rationale: ఆమె నివాసానికి వెళ్లడాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది; తెలుగు అన్వయానుసారం ప్రతిబింబ సర్వనామం ‘తన’ వాడబడింది.
- source_word: εὗρεν
  choice: చూసింది
  rationale: ఈ కథన సందర్భంలో εὑρίσκω అనేది అక్కడి పరిస్థితిని కనుగొనడం లేదా గమనించడం. ‘చూసింది’ సాధారణ ఆధునిక తెలుగులో ఆ అర్థాన్ని సహజంగా అందిస్తుంది.
- source_word: παιδίον
  choice: ఆ బిడ్డ
  rationale: మూలంలో ఈ వచనంలో లింగాన్ని ప్రత్యేకంగా చెప్పని ‘బిడ్డ/చిన్నపిల్ల’ అనే పదం ఉంది. సందర్భంలో ఆమె కుమార్తె అని తెలిసినా, మూలపద ఎంపికను నిలుపుతుంది.
- source_word: βεβλημένον
  choice: పడి ఉండడం
  rationale: βάλλω యొక్క పర్ఫెక్ట్ పాసివ్ రూపానికి అక్షరార్థంగా ‘వేయబడి’ అనే భావం ఉన్నా, మంచం మీద ఉన్న బిడ్డ స్థితిని ఇక్కడ సహజంగా ‘పడి ఉండడం’ అని వ్యక్తం చేయవచ్చు; అవసరం లేని హింసాభావాన్ని చేర్చదు.
- source_word: ἐπὶ τὴν κλίνην
  choice: మంచం మీద
  rationale: బిడ్డ ఉన్న స్థానాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: δαιμόνιον
  choice: దయ్యం
  rationale: ఈ వచనంలోని δαιμόνιονకు ఆధునిక ప్రామాణిక తెలుగులో సాధారణమైన, నేరమైన సమానార్థకం.
- source_word: ἐξεληλυθός
  choice: వెళ్లిపోయి ఉండడం
  rationale: పర్ఫెక్ట్ పార్టిసిపల్ దయ్యం బయటికి వెళ్లిన పూర్తయిన చర్యతో పాటు దాని ఫలితమైన గైర్హాజరును సూచిస్తుంది. తెలుగు రూపం ఆ ఫలితస్థితిని నిలుపుతుంది; ‘బయటికి’ అనే మూలభావం పాదసూచికలో స్పష్టం చేయబడింది.
theological_decisions:
- issue: దయ్యం వెళ్లిపోవడం వల్ల ఏర్పడిన స్థితి
  choice: దయ్యం వెళ్లిపోయి ఉండడం
  alternative: దయ్యం బయటికి వెళ్లిపోయి ఉండడం
  rationale: మూలంలోని పర్ఫెక్ట్ పార్టిసిపల్ దయ్యం బయటికి వెళ్లిన చర్య పూర్తై, ఇక అక్కడ లేకపోవడాన్ని సూచిస్తుంది. అనువాదం దీనిని అలంకరణ లేకుండా నిలుపుతుంది; మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని వరుస పరిస్థితులు—బిడ్డ మంచం మీద ఉండడం, దయ్యం వెళ్లిపోయి ఉండడం—రెండూ సమాంతరంగా నిలుపబడ్డాయి.
