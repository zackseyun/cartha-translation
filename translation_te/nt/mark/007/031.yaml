id: MRK.7.31
reference: Mark 7:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ πάλιν ἐξελθὼν ἐκ τῶν ὁρίων Τύρου ⸂ἦλθεν διὰ Σιδῶνος εἰς⸃ τὴν θάλασσαν τῆς Γαλιλαίας ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/031.yaml
  text: And again[a], after departing from the region of Tyre, he came through Sidon to the Sea of Galilee[b], through the midst of the region of the Decapolis.
translation:
  language: te
  text: ఆయన మళ్లీ తూరు ప్రాంతం నుండి బయలుదేరి, సీదోను మీదుగా[a] దెకపొలి ప్రాంతం మధ్యగా[b] గలిలయ సముద్రానికి వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సీదోను ద్వారా” లేదా “సీదోను గుండా.” గ్రీకు పదబంధం సీదోను గుండా లేదా సీదోను మార్గంగా జరిగిన ప్రయాణాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దెకపొలి ప్రాంతాల మధ్యగా.” ἀνὰ μέσον అనే గ్రీకు పదబంధానికి “మధ్యగా,” “మధ్యలో,” లేదా “మధ్య” అనే అర్థం రావచ్చు; ఇక్కడ చెప్పిన ప్రయాణ మార్గాన్ని భౌగోళికంగా ఖచ్చితంగా నిర్ధారించడం కష్టం.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: మళ్లీ
  rationale: కథనంలో మరొకసారి జరిగిన ప్రయాణాన్ని సహజంగా సూచిస్తుంది.
- source_word: ἐξελθὼν ἐκ τῶν ὁρίων Τύρου
  choice: తూరు ప్రాంతం నుండి బయలుదేరి
  rationale: కృదంతం ప్రధాన క్రియకు ముందున్న చర్యను సూచిస్తుంది; ὅρια ఇక్కడ సరిహద్దు రేఖకన్నా భూభాగం లేదా ప్రాంతాన్ని సూచిస్తుంది.
- source_word: ἦλθεν διὰ Σιδῶνος εἰς τὴν θάλασσαν τῆς Γαλιλαίας
  choice: సీదోను మీదుగా గలిలయ సముద్రం దగ్గరికి వచ్చాడు
  rationale: διά + సంబంధ విభక్తి ప్రయాణ మార్గాన్ని సూచిస్తుంది; θάλασσα సంప్రదాయ భౌగోళిక నామంలో ‘సముద్రం’గా నిలుపబడింది.
- source_word: ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως
  choice: దెకపొలి ప్రాంతం మధ్యగా ప్రయాణించాడు
  rationale: అసాధారణమైన గ్రీకు ప్రాదేశిక పదబంధంలోని ‘మధ్యగా/మధ్యలో’ అనే భావాన్ని కాపాడుతూ, తెలుగులో ప్రయాణ దిశను స్పష్టంగా తెలియజేస్తుంది.
