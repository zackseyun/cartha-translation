translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘తూరు,’ ‘సీదోను,’ ‘గలిలయ సముద్రం,’ ‘దెకపొలి’ అనే ప్రాచుర్యంలో ఉన్న బైబిలు భౌగోళిక నామరూపాలు ఉపయోగించబడ్డాయి.
