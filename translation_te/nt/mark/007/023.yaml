  edition: SBLGNT
  text: πάντα ταῦτα τὰ πονηρὰ ἔσωθεν ἐκπορεύεται καὶ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/023.yaml
  text: All these evil things come out from within and defile the man[a].
translation:
  language: te
  text: ఈ చెడు విషయాలన్నీ లోపలినుంచి బయటికి వచ్చి మనిషిని అపవిత్రం చేస్తాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα ταῦτα τὰ πονηρά
  choice: ఈ చెడు విషయాలన్నీ
  rationale: πάντα + ταῦτα అనే సమగ్ర, నొక్కిచెప్పే భావాన్ని ‘అన్నీ’ నిలుపుతుంది; నామవాచకంగా వాడిన πονηράను ముందు పేర్కొన్న దుష్ప్రవర్తనలను సూచించే సహజమైన ఆధునిక తెలుగులో ‘చెడు విషయాలు’గా అనువదించాం.
- source_word: ἔσωθεν
  choice: లోపలినుంచి
  rationale: బాహ్య మూలానికి విరుద్ధంగా అంతరంగ మూలాన్ని సూచించే పదం; సందర్భంలోని లోపలి–బయటి వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐκπορεύεται
  choice: బయటికి వచ్చి
  rationale: గ్రీకులో నపుంసక బహువచన కర్తతో ఏకవచన క్రియ రావడం సహజం; తెలుగులో కర్తకు అనుగుణంగా బహువచన భావం ‘వచ్చి’ అనే సహజ రూపంలో వ్యక్తమవుతుంది.
- source_word: κοινοῖ
  choice: అపవిత్రం చేస్తాయి
  rationale: మార్కు 7లోని శుద్ధి–అశుద్ధి సందర్భంలో κοινόω కేవలం ‘సామాన్యంగా చేయడం’ కాక, అపవిత్రపరచడాన్ని సూచిస్తుంది; ‘అపవిత్రం చేయు’ ఆ ఆచారపరమైన, నైతిక ఛాయలను రెండింటినీ నిలుపుతుంది.
- source_word: τὸν ἄνθρωπον
  choice: మనిషిని
  rationale: ἄνθρωπος ఇక్కడ ఒక మానవుని ప్రతినిధిగా సాధారణార్థంలో ఉంది. తెలుగు ‘మనిషి’ సహజంగా మానవ వ్యక్తిని సాధారణంగా సూచిస్తుంది; అందువల్ల ప్రత్యేకంగా పురుష లింగార్థాన్ని చేర్చకుండా గ్రీకు ఏకవచన సాధారణ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: అపవిత్రతకు మూలం మరియు దాని ప్రభావం
  choice: లోపలినుంచి బయటికి వచ్చి మనిషిని అపవిత్రం చేస్తాయి
  alternative: లోపలినుంచి వెలువడి మనిషిని అశుద్ధునిగా చేస్తాయి
  rationale: వాక్యం చెడు విషయాల అంతరంగ మూలాన్నీ, అవి మానవునిపై కలిగించే అపవిత్రతనూ స్పష్టంగా చెబుతుంది. ‘అపవిత్రం’ అనే పదం సందర్భంలోని శుద్ధి సంబంధిత భావాన్ని నిలుపుతూ, దానిని కేవలం ఆచారపరమైనదిగానో కేవలం నైతికమైనదిగానో పరిమితం చేయదు.
- issue: τὸν ἄνθρωπον యొక్క సాధారణ మానవార్థం
  choice: మనిషిని
  alternative: ఆ వ్యక్తిని
  rationale: గ్రీకు పదం వ్యాకరణపరంగా ఏకవచనమైనా ఇక్కడ సాధారణ మానవ ప్రతినిధిని సూచిస్తుంది. ‘మనిషిని’ తెలుగు వాడుకలో ఆ సాధారణార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది; కాబట్టి అదనపు పాదసూచిక అవసరం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే శుద్ధి–అపవిత్రత సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. గ్రీకు వాక్యంలోని ‘లోపలినుంచి’ అనే మూలభావం, ‘బయటికి రావడం’ అనే గమనం, ‘అపవిత్రం చేయడం’ అనే ఫలితం వరుసగా నిలుపబడ్డాయి.
