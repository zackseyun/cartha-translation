revisions:
- from: మీరు దేవుని ఆజ్ఞను విడిచిపెట్టి, మనుషుల[a] సంప్రదాయాన్ని గట్టిగా పట్టుకుంటున్నారు.
  to: మీరు దేవుని ఆజ్ఞను విడిచిపెట్టి మనుషుల[a] సంప్రదాయాన్ని గట్టిగా పట్టుకొని ఉన్నారు.
