id: MRK.7.8
reference: Mark 7:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἀφέντες τὴν ἐντολὴν τοῦ θεοῦ κρατεῖτε τὴν παράδοσιν τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/008.yaml
  text: Leaving the commandment of God[a], you hold fast to the tradition of men.
translation:
  language: te
  text: మీరు దేవుని ఆజ్ఞను విడిచిపెట్టి మనుషుల[a] సంప్రదాయాన్ని గట్టిగా పట్టుకొని ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మానవుల.’ గ్రీకు పదం పురుషులను మాత్రమే కాక మనుషులను సాధారణంగా సూచిస్తుంది; ఇక్కడ దేవుని నుండి వచ్చినదానికీ మానవ మూలమున్నదానికీ మధ్య వ్యత్యాసాన్ని చూపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφέντες
  choice: విడిచిపెట్టి
  rationale: అరిస్ట్ కృదంతం ప్రధాన క్రియకు ముందు లేదా దానితో ముడిపడిన చర్యను సూచిస్తుంది. ‘విడిచిపెట్టి’ అనేది దేవుని ఆజ్ఞను పక్కన పెట్టడమనే భావాన్ని సహజంగా, అతిశయోక్తి లేకుండా తెలియజేస్తుంది.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: దేవుని ఆజ్ఞను
  rationale: ἐντολή యొక్క అధికారపూర్వకమైన దైవ ఆదేశ భావాన్ని ‘ఆజ్ఞ’ స్పష్టంగా అందిస్తుంది; τοῦ θεοῦ దాని మూలం లేదా అధికారం దేవుడేనని సూచిస్తుంది.
- source_word: κρατεῖτε
  choice: గట్టిగా పట్టుకుంటున్నారు
  rationale: ఇక్కడ κρατέω కేవలం పాటించడాన్ని కాకుండా దృఢంగా అంటిపెట్టుకొని ఉండడాన్ని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం ఆ బలమైన అనురక్తిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὴν παράδοσιν
  choice: సంప్రదాయాన్ని
  rationale: παράδοσις ఇక్కడ తరతరాలుగా అందిన మానవ ఆచారబోధను సూచిస్తుంది; ‘సంప్రదాయం’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: τῶν ἀνθρώπων
  choice: మనుషుల
  rationale: ἄνθρωπος బహువచనం ఇక్కడ పురుషులను మాత్రమే కాక మానవులను సాధారణంగా సూచిస్తూ, దేవుని నుండి వచ్చినదానికీ మానవ మూలమున్నదానికీ మధ్య వ్యత్యాసాన్ని చూపుతుంది.
theological_decisions:
- issue: దేవుని ఆజ్ఞకూ మానవ సంప్రదాయానికీ మధ్య వ్యత్యాసం
  choice: ‘దేవుని ఆజ్ఞ’ మరియు ‘మనుషుల సంప్రదాయం’ అనే సమాంతర పదబంధాలతో పదునైన వ్యత్యాసాన్ని నిలిపివేయడం
  alternative: ‘ప్రజల సంప్రదాయం’ అని అనువదించడం లేదా సంప్రదాయమంతటినీ ఖండిస్తున్నట్లు విస్తరించడం
  rationale: వాక్యం మానవ మూలమున్న సంప్రదాయానికి దేవుని ఆజ్ఞకన్నా ప్రాధాన్యం ఇవ్వడాన్ని గద్దిస్తుంది. అయితే అన్ని సంప్రదాయాలపై సాధారణ తీర్పును పాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘గట్టిగా పట్టుకుంటున్నారు’ అనే రూపం మూలంలోని వర్తమానకాల దృఢ అనురక్తిని నిలుపుతుంది; ‘విడిచిపెట్టి’ కృదంత సంబంధాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
