  to: 'ఆయన మళ్లీ జనసమూహాన్ని తన దగ్గరికి పిలిచి, వారితో ఇలా చెబుతున్నాడు: “మీరందరూ నా మాట వినండి, అర్థం చేసుకోండి.”'
