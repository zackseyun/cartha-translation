  yaml_path: translation/nt/mark/007/014.yaml
  text: And calling the crowd to him again, he was saying to them, “Listen to me, all of you, and understand.”
translation:
  language: te
  text: 'ఆయన మళ్లీ జనసమూహాన్ని తన దగ్గరికి పిలిచి, వారితో ఇలా చెబుతున్నాడు: “మీరందరూ నా మాట వినండి, అర్థం చేసుకోండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: తన దగ్గరికి పిలిచి
  rationale: మధ్యమ వాచకంలోని తనవైపు పిలుచుకోవడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: క్రియ పునరావృతిని నేరుగా సూచిస్తుంది.
- source_word: ἔλεγεν
  choice: చెబుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న లేదా విస్తరించిన మాటల చర్యను నిలుపుతుంది.
- source_word: Ἀκούσατέ μου
  choice: నా మాట విని
  rationale: గ్రీకు షష్ఠీ విభక్తితో వచ్చిన ‘నన్ను వినండి’ అనే భావాన్ని సహజ తెలుగు ప్రయోగమైన ‘నా మాట వినండి’గా అందిస్తుంది.
- source_word: σύνετε
  choice: అర్థం చేసుకోండి
  rationale: విన్నదాని భావాన్ని గ్రహించమనే ఆజ్ఞను స్పష్టంగా, సాధారణ భాషలో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ἔλεγεν యొక్క అసంపూర్ణ కాల భావాన్ని ‘చెబుతూ ఉన్నాడు’ ద్వారా ఉద్దేశపూర్వకంగా నిలిపింది.
