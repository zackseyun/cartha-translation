- from: అప్పుడు వారు చెవిటివాడూ, మాట్లాడడానికి ఇబ్బందిపడేవాడూ అయిన ఒక మనిషిని ఆయన దగ్గరికి తీసుకొచ్చి, అతని మీద చెయ్యి ఉంచమని ఆయనను బతిమాలుకున్నారు.
