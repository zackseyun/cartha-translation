source:
  edition: SBLGNT
  text: καὶ φέρουσιν αὐτῷ κωφὸν ⸀καὶ ⸀μογιλάλον, καὶ παρακαλοῦσιν αὐτὸν ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/032.yaml
  text: And they brought to him a man who was deaf and had difficulty speaking[a], and they begged him to lay his hand on him.
translation:
  language: te
  text: వారు చెవిటివాడైన, మాట్లాడటానికి ఇబ్బందిపడే ఒక మనిషిని ఆయన దగ్గరకు తీసుకొచ్చి, ఆయన అతనిమీద చెయ్యి ఉంచాలని ఆయనను బతిమాలారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “చెవిటివానిని, కష్టంగా మాట్లాడేవానిని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρουσιν
  choice: తీసుకొచ్చి
  rationale: మార్కు వాడిన చారిత్రక వర్తమానాన్ని సహజమైన తెలుగు కథనశైలిలో భూతకాల అర్థంతో అనువదించాం.
- source_word: κωφόν
  choice: చెవిటివాడూ ... అయిన ఒక మనిషిని
  rationale: తరువాతి పదం మాటల ఇబ్బందిని ప్రత్యేకంగా సూచిస్తున్నందున, κωφόςను ఇక్కడ వినికిడి లేనివాడిగా మాత్రమే స్పష్టంగా అనువదించాం.
- source_word: μογιλάλον
  choice: మాట్లాడడానికి ఇబ్బందిపడేవాడూ
  rationale: ఈ అరుదైన పదం పూర్తిగా మూగవాడని కాకుండా కష్టంగా మాట్లాడేవాడని సూచిస్తుంది; అందుకే ఆ తేడాను నిలిపాం.
- source_word: παρακαλοῦσιν
  choice: బతిమాలుకున్నారు
  rationale: సాధారణంగా అడగడం కంటే ఈ స్వస్థత సందర్భంలోని గాఢమైన వేడుకోలును ఈ పదం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα
  choice: అతని మీద చెయ్యి ఉంచమని
  rationale: వారి వేడుకోలు ఏమిటో సహజమైన తెలుగులో తెలిపి, గ్రీకులోని ఏకవచనమైన ‘చెయ్యి’ని నిలిపాం.
theological_decisions:
- issue: ఆ మనిషి వైకల్య స్వభావం
  choice: అతడు చెవిటివాడు, అలాగే మాట్లాడడానికి ఇబ్బందిపడేవాడు.
  alternative: అతడు చెవిటి మరియు మూగవాడు.
  rationale: κωφός, μογιλάλος అనే రెండు వేర్వేరు విశేషణాలు వినికిడి లోపంతో పాటు మాటల ఇబ్బందిని సూచిస్తాయి. μογιλάλοςను ‘మూగవాడు’గా అనువదిస్తే మూలపాఠం చెప్పినదానికంటే ఎక్కువ అర్థం వస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘చెవిటివాడు’ అనే సాధారణంగా అర్థమయ్యే పదాన్ని వాడుతూ, ‘మూగవాడు’ అని అతిశయింపకుండా మాటల ఇబ్బందిని ప్రత్యేకంగా తెలిపాం.
