id: MRK.7.9
reference: Mark 7:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν αὐτοῖς· Καλῶς ἀθετεῖτε τὴν ἐντολὴν τοῦ θεοῦ, ἵνα τὴν παράδοσιν ὑμῶν ⸀τηρήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/009.yaml
  text: And he was saying to them[a], “You neatly set aside the commandment of God so that you may keep your tradition.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా చెబుతూ ఉన్నాడు: “మీ సంప్రదాయాన్ని పాటించడానికి దేవుని ఆజ్ఞను ఎంత చక్కగా పక్కన పెడుతున్నారు![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ సంప్రదాయాన్ని పాటించడానికి దేవుని ఆజ్ఞను పక్కన పెట్టడంలో మీరు బాగానే చేస్తున్నారు.” ఇక్కడ ‘చక్కగా/బాగానే’ అనేది ప్రశంస కాదు; వ్యంగ్యంగా పలికిన గద్దింపు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: చెబుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న లేదా పునరావృతమైన మాటను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Καλῶς
  choice: ఎంత చక్కగా
  rationale: ఇక్కడ ఇది ప్రశంస కాదు, వ్యంగ్యంతో కూడిన గద్దింపు. ఆశ్చర్యార్థక నిర్మాణంతో కలిపి ఈ పదబంధం ఆ వ్యంగ్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀθετεῖτε
  choice: పక్కన పెడుతున్నారు
  rationale: దేవుని ఆజ్ఞను ఉద్దేశపూర్వకంగా విస్మరించడం లేదా చెల్లకుండా చేయడం అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἐντολὴν τοῦ θεοῦ
  choice: దేవుని ఆజ్ఞను
  rationale: దైవ అధికారాన్ని సూచించే మూలపాఠంలోని సంబంధాన్ని సంక్షిప్తంగా, గంభీరంగా నిలుపుతుంది.
- source_word: ἵνα
  choice: పాటించడానికి
  rationale: వారి సంప్రదాయాన్ని పాటించడమే దేవుని ఆజ్ఞను పక్కన పెట్టే ఉద్దేశమని తెలిపే ప్రయోజనార్థక సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: παράδοσιν ὑμῶν
  choice: మీ సంప్రదాయాన్ని
  rationale: వారికి అందించబడిన మానవ సంప్రదాయాన్ని సూచిస్తూ, ‘దేవుని ఆజ్ఞ’తో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: τηρήσητε
  choice: పాటించడానికి
  rationale: సంప్రదాయాన్ని ఆచరించడం, కట్టుబడి ఉండడం అనే భావానికి సందర్భానుకూలమైన సాధారణ తెలుగు పదం.
theological_decisions:
- issue: యేసు మాటల స్వరం
  choice: ప్రశంసలా వినిపించే వ్యంగ్య గద్దింపు
  alternative: ‘దేవుని ఆజ్ఞను పక్కన పెట్టడం మీరు మంచిగానే చేస్తున్నారు’ అనే అక్షరార్థ ప్రశంస
  rationale: సందర్భంలో యేసు మానవ సంప్రదాయాన్ని దేవుని ఆజ్ఞకంటే పైగా ఉంచడాన్ని ఖండిస్తున్నాడు. అందువల్ల καλῶς‌ను ప్రశంసగా కాక, మూలంలోని వ్యంగ్య ఉద్రేకాన్ని కాపాడేలా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన వాక్య నిర్మాణం వాడబడింది. ‘ఎంత చక్కగా’ మరియు ఆశ్చర్యార్థకం కలిసి వ్యంగ్యాన్ని తెలియజేస్తాయి; ‘పక్కన పెడుతున్నారు’ అనేది అతిగా సాంకేతికంగా కాకుండా మూలంలోని ఉద్దేశపూర్వక నిరాకరణ భావాన్ని అందిస్తుంది.
