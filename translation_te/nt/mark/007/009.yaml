  source_fidelity: The translation faithfully represents the imperfect ἔλεγεν with a continuing-speech form, the ironic καλῶς, the present-force ἀθετεῖτε, the purposive ἵνα, and τηρήσητε as observing/keeping their tradition. The contrast between God's command and their own tradition is clear.
  naturalness: The wording is natural modern standard Telugu and has an appropriately serious register. “ఎంత చక్కగా” together with the exclamation effectively communicates the contextual irony without making it sound like genuine commendation.
  terminology: “దేవుని ఆజ్ఞ,” “సంప్రదాయం,” and “పాటించడానికి” are accurate, clear, and suitably consistent for this context. “పక్కన పెడుతున్నారు” naturally conveys deliberate setting aside without unnecessarily strengthening the sense to formal invalidation.
