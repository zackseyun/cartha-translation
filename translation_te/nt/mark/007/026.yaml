source:
  edition: SBLGNT
  text: ⸂ἡ δὲ γυνὴ ἦν⸃ Ἑλληνίς, Συροφοινίκισσα τῷ γένει· καὶ ἠρώτα αὐτὸν ἵνα τὸ δαιμόνιον ἐκβάλῃ ἐκ τῆς θυγατρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/026.yaml
  text: The woman was a Greek[a], a Syrophoenician by birth[b], and she kept asking him to cast the demon out of her daughter.
translation:
  language: te
  text: ఆ స్త్రీ గ్రీకు స్త్రీ[a]; ఆమె వంశరీత్యా సురోఫెనీకయురాలు[b]. ఆమె తన కుమార్తె నుండి దయ్యాన్ని వెళ్లగొట్టమని ఆయనను పదేపదే అడుగుతూ ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదేతర స్త్రీ’; గ్రీకు మూలంలో ‘గ్రీకు స్త్రీ’ అని ఉంది. ఈ సందర్భంలో అది ఆమె యూదేతరురాలు అని కూడా సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘వంశం/మూలం రీత్యా సురోఫెనీకయ స్త్రీ’; అంటే సురోఫెనీకయ వంశానికి చెందినది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑλληνίς
  choice: గ్రీకు స్త్రీ
  rationale: మూలపదం నేరుగా ‘గ్రీకు స్త్రీ’ అని సూచిస్తుంది. ఈ సందర్భంలో యూదేతరురాలు అనే భావం కూడా ఉండవచ్చు; అయితే ప్రధాన పాఠంలో నిర్దిష్టమైన మూలపదాన్నే నిలిపాం.
- source_word: Συροφοινίκισσα τῷ γένει
  choice: పుట్టుకరీత్యా సురోఫెనికయ ప్రాంతానికి చెందినది
  rationale: τῷ γένει వంశం/పుట్టుక/మూలాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేందుకు, ఇది భౌగోళిక-జాతి మూలాన్ని సూచించేలా అనువదించబడింది.
- source_word: ἠρώτα
  choice: పదేపదే వేడుకుంటూ ఉంది
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పునరావృతమైన అభ్యర్థనను సూచిస్తుంది. సందర్భం గంభీరమైన విన్నపాన్ని చూపుతున్నందున ‘వేడుకుంటూ ఉంది’ సహజంగా సరిపోతుంది.
- source_word: ἵνα ... ἐκβάλῃ
  choice: వెళ్లగొట్టమని
  rationale: అభ్యర్థనలోని విషయాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ἐκβάλλω యొక్క బలమైన ‘బయటికి పంపడం’ భావాన్ని నిలుపుతుంది.
- source_word: τὸ δαιμόνιον
  choice: దయ్యాన్ని
  rationale: మూలంలో δαιμόνιον అనే నిర్దిష్ట పదమే ఉంది; దానిని ‘అపవిత్రాత్మ’గా మార్చకుండా నేరుగా అనువదించాం.
- source_word: ἐκ τῆς θυγατρὸς αὐτῆς
  choice: తన కుమార్తెలో నుండి
  rationale: ἐκ యొక్క ‘లోపలి నుండి బయటికి’ అనే భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: δὲ
  choice: ఆ
  rationale: δέ ఇక్కడ బలమైన వ్యతిరేకతకన్నా స్వల్ప కథన సంబంధాన్ని సూచిస్తుంది. తెలుగులో అనవసరమైన ‘అప్పుడు/ఇప్పుడు’ చేర్చకుండా, ముందు ప్రస్తావించిన స్త్రీతో సంబంధాన్ని ‘ఆ స్త్రీ’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: స్త్రీ యొక్క సామాజిక-జాతి గుర్తింపు
  choice: ‘గ్రీకు స్త్రీ’ మరియు ‘పుట్టుకరీత్యా సురోఫెనికయ ప్రాంతానికి చెందినది’ అనే రెండు గుర్తింపులనూ ఉంచడం
  alternative: ‘యూదేతర స్త్రీ, సురోఫెనికయ వంశస్థురాలు’
  rationale: మూలపాఠం సాంస్కృతిక/మతపరమైన గుర్తింపుతో పాటు జాతి-భౌగోళిక మూలాన్ని కూడా వేర్వేరుగా పేర్కొంటుంది. రెండింటినీ ఒకే సాధారణ గుర్తింపుగా కలపలేదు.
- issue: కుమార్తె బాధ స్వభావం
  choice: ‘దయ్యాన్ని’ వెళ్లగొట్టడం
  alternative: ‘దుష్టాత్మను’ వెళ్లగొట్టడం
  rationale: మూలంలోని δαιμόνιον పదాన్ని నేరుగా అనుసరించి, వాక్యంలోని అతీంద్రియ వాదనను తగ్గించకుండా లేదా పునర్వ్యాఖ్యానించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘పదేపదే ... వేడుకుంటూ ఉంది’ అనే రూపం గ్రీకు అసంపూర్ణ భూతకాలంలోని కొనసాగింపు/పునరావృత భావాన్ని వ్యక్తం చేస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
