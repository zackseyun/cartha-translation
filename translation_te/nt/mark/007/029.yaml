  to: ఆయన ఆమెతో, “ఈ మాట కారణంగా వెళ్లు; నీ కుమార్తెలోనుండి దయ్యం బయటికి వెళ్లిపోయింది” అని అన్నాడు.[a]
  rationale: The revision removes a minor interpretive expansion in the causal phrase, improves Telugu orthography and flow, and retains the Greek perfect’s completed-and-continuing result through ‘వెళ్లిపోయింది.’ The demon’s exit from the daughter remains explicit.
