id: MRK.7.29
reference: Mark 7:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῇ· Διὰ τοῦτον τὸν λόγον ὕπαγε, ἐξελήλυθεν ⸂ἐκ τῆς θυγατρός σου τὸ δαιμόνιον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/029.yaml
  text: And he said to her[a], “Because of this word, go; the demon has gone out of your daughter.”
translation:
  language: te
  text: ఆయన ఆమెతో, “ఈ మాట కారణంగా వెళ్లు; నీ కుమార్తెలోనుండి దయ్యం బయటికి వెళ్లిపోయింది” అని అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ మాటను బట్టి వెళ్లు; నీ కుమార్తెలోనుండి దయ్యం బయటికి వెళ్లిపోయింది.”
    reason: Διὰ τοῦτον τὸν λόγον అనే పదబంధం కారణాన్ని సూచిస్తుంది; దీనిని ‘ఈ మాట కారణంగా’ లేదా ‘ఈ మాటను బట్టి’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: Διὰ τοῦτον τὸν λόγον
  choice: నువ్వు ఈ మాట చెప్పినందుకు
  rationale: διά + accusative ఇక్కడ కారణాన్ని సూచిస్తుంది. λόγος ఆ స్త్రీ ఇంతకుముందు పలికిన జవాబును సూచిస్తున్నందున, తెలుగులో సహజంగా ఉండేలా ‘నువ్వు ఈ మాట చెప్పినందుకు’ అని అనువదించాం; ఏ ప్రత్యేక పదమే స్వతహాగా శక్తి కలిగిందనే అపార్థాన్ని ఇది నివారిస్తుంది.
- source_word: ὕπαγε
  choice: వెళ్లు
  rationale: ఇక్కడ ὕπαγε పంపివేయడం లేదా వెళ్లేందుకు అనుమతించడం అనే భావంతో ఉన్న ఆజ్ఞ. ‘వెళ్లు’ ఆధునిక తెలుగులో స్పష్టమైన, నేరమైన సమానార్థకం.
- source_word: ἐξελήλυθεν
  choice: వెళ్లిపోయింది
  rationale: గ్రీకు perfect రూపం పూర్తయిన చర్యతో పాటు దాని కొనసాగుతున్న ఫలితాన్ని సూచిస్తుంది. ‘వెళ్లిపోయింది’ దయ్యం బయటికి వెళ్లి ఇక అక్కడ లేదనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐκ τῆς θυγατρός σου
  choice: నీ కుమార్తెలో నుండి
  rationale: ἐκ అనే విభక్తి-సంబంధ పదం దయ్యం ఎవరిలోనుండి బయటికి వెళ్లిందో సూచిస్తుంది. ‘లో నుండి’ మూలంలోని స్థలసంబంధ చిత్రణను నిలుపుతుంది.
- source_word: τὸ δαιμόνιον
  choice: దయ్యం
  rationale: δαιμόνιονకు నేరమైన, సాధారణ ఆధునిక తెలుగు సమానార్థకం ‘దయ్యం’. మూలంలో లేని ‘అపవిత్రాత్మ’ వంటి సమీప సందర్భపు పదాన్ని ఇక్కడ చేర్చలేదు.
- source_word: καὶ εἶπεν αὐτῇ
  choice: ఆయన ఆమెతో … అని అన్నాడు
  rationale: తెలుగు ఉల్లేఖన వాక్య నిర్మాణానికి అనుగుణంగా పలుకుబడి క్రియను చివర ఉంచాం. καίను ప్రత్యేకంగా ‘మరియు’ అని పెట్టడం తెలుగులో అసహజంగా ఉండేందున సహజ కథన అనుసంధానంలో వ్యక్తపరిచాం.
theological_decisions:
- issue: దయ్యాన్ని వెళ్లగొట్టిన సంఘటనలోని అతీంద్రియ వాదనను మృదువుచేయకుండా అనువదించడం
  choice: నీ కుమార్తెలో నుండి దయ్యం వెళ్లిపోయింది
  alternative: నీ కుమార్తెను దుష్టశక్తి విడిచిపోయింది
  rationale: మూలపాఠం వ్యక్తిగతమైన δαιμόνιονను స్పష్టంగా పేర్కొని, అది కుమార్తెలో నుండి బయటికి వెళ్లిందని చెబుతుంది. అందువల్ల దీనిని వ్యాధిగా లేదా అస్పష్టమైన దుష్ట ప్రభావంగా మార్చకుండా మూలంలోని వాదనను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. సంభాషణలో ఏకవచన ‘నువ్వు/నీ’ రూపాలు సందర్భానుకూలమైన నేరత్వాన్ని ఇస్తాయి; అనవసరంగా గౌరవార్థక బహువచనాన్ని చేర్చలేదు. మూలంలోని కారణార్థం, perfect ఫలిత భావం, దయ్యం బయటికి వెళ్లిన స్థలసంబంధ చిత్రణ నిలుపబడ్డాయి.
