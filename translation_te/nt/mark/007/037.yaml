id: MRK.7.37
reference: Mark 7:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὑπερπερισσῶς ἐξεπλήσσοντο λέγοντες· Καλῶς πάντα πεποίηκεν, καὶ τοὺς κωφοὺς ποιεῖ ἀκούειν ⸀καὶ ἀλάλους λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/037.yaml
  text: And they were utterly astonished[a], saying, “He has done everything well[b]. He makes even the deaf hear and the mute speak.”
translation:
  language: te
  text: 'వారు మిక్కిలిగా ఆశ్చర్యపడి ఇలా అన్నారు: “ఆయన అన్నిటినీ బాగా చేశాడు.[a] ఆయన చెవిటివారిని వినేటట్లు, మూగవారిని మాట్లాడేటట్లు చేస్తాడు.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత పదానువాదంగా, “ఆయన సమస్తమును బాగా చేశాడు.” ఈ మాటలు దేవుని కార్యాలను వర్ణించే లేఖన భాషను ప్రతిధ్వనింపజేయవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఈ మాటలు దేవుని పునరుద్ధరణలో చెవిటివారు వింటారని, మూగవారు మాట్లాడతారని చెప్పే యెషయా 35:5–6ను గుర్తుచేస్తాయి.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπερπερισσῶς
  choice: అపరిమితంగా
  rationale: అసాధారణమైన తీవ్రతను తెలిపే ఈ బలమైన క్రియావిశేషణానికి సహజమైన ఆధునిక తెలుగు రూపం; ‘మితిమీరినంతగా’ అనే భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: ἐξεπλήσσοντο
  choice: ఆశ్చర్యపడి
  rationale: వారి కొనసాగుతున్న విస్మయస్థితిని సందర్భానుగుణంగా తెలుపుతుంది; ప్రధాన క్రియతో సహజమైన తెలుగు వాక్యనిర్మాణాన్ని కలిగిస్తుంది.
- source_word: λέγοντες
  choice: అని చెప్పుకున్నారు
  rationale: సమూహంలోని ప్రజలు ఈ మాటలు పలుకుతూ తమ స్పందనను వ్యక్తం చేశారనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: Καλῶς
  choice: చక్కగా
  rationale: యేసు చేసిన కార్యాల నాణ్యతను ప్రశంసించే ‘బాగా/మంచిగా’ అనే భావాన్ని గౌరవప్రదమైన సాధారణ తెలుగులో అందిస్తుంది.
- source_word: πάντα
  choice: అన్నిటినీ
  rationale: గ్రీకు పదంలోని సమగ్ర పరిధిని నేరుగా నిలుపుతుంది; ‘సమస్తాన్ని’ కంటే సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: πεποίηκεν
  choice: చేశాడు
  rationale: పూర్తయిన కార్యం ప్రస్తుత ప్రశంసకు ఆధారమై ఉందనే పరిపూర్ణ కాల భావం తెలుగు సందర్భంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: κωφοὺς
  choice: చెవిటివారు
  rationale: వినలేని వ్యక్తులను సూచించే గ్రీకు నామవాచకీకృత విశేషణానికి స్పష్టమైన, ప్రస్తుత ప్రామాణిక తెలుగు సమానం.
- source_word: ποιεῖ ἀκούειν
  choice: వినేలా ... చేస్తున్నాడు
  rationale: ποιέω + ధాతురూపంలోని కారణార్థక భావాన్ని తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀλάλους
  choice: మూగవారు
  rationale: మాట్లాడలేని వారిని సూచించే సందర్భోచితమైన సంక్షిప్త తెలుగు పదం; ‘చెవిటివారు’తో సమాంతరతను కాపాడుతుంది.
- source_word: λαλεῖν
  choice: మాట్లాడేలా
  rationale: λαλέω యొక్క సాధారణ అర్థమైన ‘మాట్లాడు’ను కారణార్థక నిర్మాణంలో సహజంగా అందిస్తుంది.
- source_word: καὶ
  choice: కూడా
  rationale: రెండు అద్భుత ఫలితాల సమన్వయాన్ని నిలుపుతూ, మొత్తం వాక్యానికి అదనపు ఉద్ఘాటనను సహజమైన తెలుగులో ఇస్తుంది; ‘సైతం’ కంటే సాధారణంగా వినిపిస్తుంది.
theological_decisions:
- issue: యెషయా 35:5–6 ప్రతిధ్వని మరియు ‘అన్నిటినీ చక్కగా చేశాడు’లో సృష్టి-భాష సంభావ్యత
  choice: ప్రధాన పాఠ్యంలో గ్రీకు వాక్యాన్ని నేరుగా, సమగ్రంగా ఉంచి, సంభావ్య లేఖన ప్రతిధ్వనులను పాదటిప్పణుల్లో సూచించడం.
  alternative: ‘సమస్తమును మేలుగా చేసెను’ వంటి మరింత పదానువాద రూపంతో సృష్టి వర్ణన ప్రతిధ్వనిని బలపరచడం.
  rationale: గ్రీకు పాఠ్యం యెషయా పునరుద్ధరణ చిత్రణను బలంగా స్మరింపజేస్తుంది; ‘అన్నిటినీ చక్కగా చేశాడు’ సృష్టి కార్యాల మూల్యాంకనాన్ని కూడా ప్రతిధ్వనింపజేయవచ్చు. ప్రధాన పాఠ్యం ఈ అనుబంధాలను అవసరానికి మించి స్పష్టీకరించకుండా వాటి సంభావ్యతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. అసలు గ్రీకు ఉద్ఘాటనను ‘అపరిమితంగా’తో, కారణార్థక నిర్మాణాన్ని ‘వినేలా/మాట్లాడేలా చేస్తున్నాడు’తో నిలిపాం. రెండు పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత వాక్యాల వెంట ఉంచబడ్డాయి.
