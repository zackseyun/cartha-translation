revisions:
- from: వారు అపరిమితంగా ఆశ్చర్యపడి, “ఆయన అన్నిటినీ చక్కగా చేశాడు.[a] చెవిటివారు వినేలా, మూగవారు మాట్లాడేలా కూడా చేస్తున్నాడు” అని చెప్పుకున్నారు.[b]
  to: 'వారు మిక్కిలిగా ఆశ్చర్యపడి ఇలా అన్నారు: “ఆయన అన్నిటినీ బాగా చేశాడు.[a] ఆయన చెవిటివారిని వినేటట్లు, మూగవారిని మాట్లాడేటట్లు చేస్తాడు.”[b]'
