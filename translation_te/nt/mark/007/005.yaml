id: MRK.7.5
reference: Mark 7:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀καὶ ἐπερωτῶσιν αὐτὸν οἱ Φαρισαῖοι καὶ οἱ γραμματεῖς· Διὰ τί ⸂οὐ περιπατοῦσιν οἱ μαθηταί σου⸃ κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων, ἀλλὰ ⸀κοιναῖς χερσὶν ἐσθίουσιν τὸν ἄρτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/005.yaml
  text: And the Pharisees and the scribes asked him[a], “Why do your disciples not walk according to the tradition of the elders, but eat bread with unclean hands?”
translation:
  language: te
  text: 'పరిసయ్యులూ శాస్త్రులూ ఆయనను అడిగారు: “నీ శిష్యులు పెద్దల సంప్రదాయం ప్రకారం ఎందుకు నడుచుకోరు, ఆచారపరంగా అపవిత్రమైన[a] చేతులతో రొట్టె తింటున్నారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘సామాన్యమైన’; ఇక్కడ ఇది భౌతిక మురికిని కాదు, ఆచారపరమైన అపవిత్రతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπερωτῶσιν
  choice: అడిగారు
  rationale: కథనంలో వాడిన వర్తమాన కాలాన్ని సహజమైన తెలుగు కథనశైలిలో భూతకాలంగా అనువదించాం; ప్రశ్నించే క్రియను అదనపు పునరావృత భావం లేకుండా తెలిపింది.
- source_word: γραμματεῖς
  choice: శాస్త్రులు
  rationale: యూదుల ధర్మశాస్త్రంలో ప్రావీణ్యం గల గుర్తింపు పొందిన వర్గాన్ని సూచించే, సువార్తల సందర్భంలో స్థిరపడిన తెలుగు పదం.
- source_word: Διὰ τί
  choice: ఎందుకు
  rationale: తెలుగులో సహజమైన ప్రశ్నార్థక సమానార్థకం.
- source_word: περιπατοῦσιν
  choice: నడుచుకోకుండా
  rationale: అక్షరార్థమైన ‘నడవడం’లోని రూపకాన్ని ఉంచుతూ, ఇక్కడ జీవన ప్రవర్తన లేదా ఆచరణ అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων
  choice: పెద్దల సంప్రదాయం ప్రకారం
  rationale: κατά యొక్క ప్రమాణానుసరణ భావాన్నీ, పూర్వ అధికారులతో అనుసంధానమైన సంప్రదాయం అనే భావాన్నీ నేరుగా కాపాడుతుంది.
- source_word: κοιναῖς χερσὶν
  choice: అపవిత్రమైన చేతులతో
  rationale: ఇక్కడ κοινός భౌతిక మురికిని కాక ఆచారపరమైన అపవిత్రతను సూచిస్తుంది. ‘అపవిత్రమైన’ ఆ మతాచార సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐσθίουσιν τὸν ἄρτον
  choice: భోజనం చేస్తున్నారు
  rationale: అక్షరార్థంగా ‘రొట్టె తింటున్నారు’ అయినా, ఈ సందర్భంలో ἄρτος భోజనాన్ని సూచించే ప్రయోగం; ఆధునిక తెలుగులో ‘భోజనం చేస్తున్నారు’ ఆరోపణ యొక్క సహజ భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: κοινός సూచించే ఆచారపరమైన స్థితి
  choice: అపవిత్రమైన
  alternative: సామాన్యమైన; అశుద్ధమైన; మలినమైన
  rationale: వివాదం చేతుల పరిశుభ్రత గురించి కాక పరిసయ్యుల ఆచారపరమైన పవిత్రతా సంప్రదాయం గురించి. ‘అపవిత్రమైన’ నైతిక దుష్టత్వాన్ని నిర్బంధంగా చేర్చకుండా ఆచారపరమైన భావాన్ని మోస్తుంది; పాదసూచిక అక్షరార్థాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘పరిసయ్యులు,’ ‘శాస్త్రులు,’ ‘పెద్దల సంప్రదాయం’ వంటి పరిచిత బైబిలు పదజాలాన్ని ఉంచి, అసలు భాషలోని ఆచారపరమైన ఉద్రిక్తతను పాదసూచికతో సంరక్షించాం.
