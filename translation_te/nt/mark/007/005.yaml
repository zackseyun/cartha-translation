  source_fidelity: ‘అప్పుడు’ translates a temporal sense not present in καί, and ‘భోజనం చేస్తున్నారు’ broadens and omits the explicit object τὸν ἄρτον (‘the bread’). The revised wording retains the conjunction without adding temporal sequence and preserves ‘bread.’
  naturalness: The revised Telugu is natural modern-standard narrative prose. ‘నడుచుకోరు’ appropriately conveys the idiomatic ethical/behavioral sense of περιπατοῦσιν in this question.
  terminology: ‘పరిసయ్యులు,’ ‘శాస్త్రులు,’ and ‘పెద్దల సంప్రదాయం’ are suitable established terms. ‘ఆచారపరంగా అపవిత్రమైన’ makes clear that κοινός concerns ritual status, not dirt or moral evil; the footnote preserves the literal lexical sense.
  issues:
  - severity: medium
    issue: ‘అప్పుడు’ adds a temporal transition.
    rationale: The Greek begins with καί (‘and’), not τότε (‘then’). Telugu may omit an explicit conjunction for idiom, but ‘అప్పుడు’ introduces an unsupported temporal nuance.
  - severity: medium
    issue: ‘భోజనం చేస్తున్నారు’ does not represent τὸν ἄρτον explicitly.
    rationale: Although ἄρτος can sometimes have a broader meal-related force, this verse explicitly says ‘eat the bread.’ Rendering it as ‘రొట్టె తింటున్నారు’ better preserves the source wording without becoming unnatural.
