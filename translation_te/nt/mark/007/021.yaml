review_pass:
  verdict: revise
  source_fidelity: The source’s double expression of interior origin, the generic reference to human beings, the moral force of ‘evil,’ and the plural vice-list items are retained. ‘అక్రమ’ can primarily suggest what is legally unlawful, whereas πορνεῖαι denotes illicit/immoral sexual conduct more broadly. The Greek verse also continues into the following verse, so a terminal full stop should not be supplied here.
  naturalness: ‘లోపలి నుండి … హృదయం నుండి’ and ‘వెలువడతాయి’ are natural modern-standard Telugu while preserving the source’s deliberate repetition of origin. ‘లైంగిక దురాచారాలు’ is clear, idiomatic, and appropriately broad.
  terminology: ‘హృదయం,’ ‘మనుషుల,’ ‘చెడు ఆలోచనలు,’ ‘దొంగతనాలు,’ and ‘హత్యలు’ are suitable renderings. ‘లైంగిక దురాచారాలు’ avoids narrowing the term to legal violations or a particular sexual act and preserves the plural sense.
  issues:
  - severity: medium
    issue: ‘అక్రమ లైంగిక కార్యాలు’ may be understood chiefly as legally prohibited sexual acts.
    rationale: The Greek πορνεῖαι is a broad moral term for illicit sexual conduct; it is not limited to conduct prohibited by civil law. ‘లైంగిక దురాచారాలు’ conveys the moral category without adding a legal restriction.
  - severity: low
    issue: The draft ends this verse with a full stop.
    rationale: In the Greek sentence the vice list continues in Mark 7:22. Ending with a comma preserves the syntactic continuation.
  revised_text: 'ఎందుకంటే లోపలి నుండి, మనుషుల హృదయం నుండి, చెడు ఆలోచనలు వెలువడతాయి: లైంగిక దురాచారాలు[a], దొంగతనాలు, హత్యలు,'
  revised_footnotes:
  - marker: a
    text: లేదా “లైంగిక అనైతికతలు.” గ్రీకు పదం బహువచనంలో ఉండి, విస్తృతంగా అనైతిక లైంగిక కార్యాలను సూచిస్తుంది.
