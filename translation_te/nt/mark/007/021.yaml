id: MRK.7.21
reference: Mark 7:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔσωθεν γὰρ ἐκ τῆς καρδίας τῶν ἀνθρώπων οἱ διαλογισμοὶ οἱ κακοὶ ἐκπορεύονται, ⸂πορνεῖαι, κλοπαί, φόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/021.yaml
  text: 'For from within[a], out of the heart of men, evil thoughts come out: sexual immoralities, thefts, murders[b],'
translation:
  language: te
  text: 'ఎందుకంటే లోపలి నుండి, మనుషుల హృదయం నుండి, చెడు ఆలోచనలు వెలువడతాయి: లైంగిక దురాచారాలు[a], దొంగతనాలు, హత్యలు,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “లైంగిక అనైతికతలు.” గ్రీకు పదం బహువచనంలో ఉండి, విస్తృతంగా అనైతిక లైంగిక కార్యాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσωθεν
  choice: లోపలినుండి
  rationale: బాహ్యమైనదానికి విరుద్ధంగా, అపవిత్రత మనిషి అంతరంగం నుండే ఉద్భవిస్తుందనే సందర్భానుగత చిత్రాన్ని నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని లేదా వివరణను పరిచయం చేసే అనుసంధాన పదంగా సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: καρδίας
  choice: హృదయంలోనుండి
  rationale: నైతిక ఆలోచన, సంకల్పం ఉద్భవించే అంతరంగ కేంద్రాన్ని సూచించే బైబిలు రూపకాన్ని వ్యాఖ్యానించి తొలగించకుండా నిలుపుతుంది.
- source_word: ἀνθρώπων
  choice: మనుషుల
  rationale: గ్రీకు పుంలింగ బహువచనం ఇక్కడ స్త్రీపురుషులందరినీ సాధారణంగా సూచిస్తుంది; తెలుగులో ‘మనుషుల’ అనేది ఆ సాధారణ అర్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: διαλογισμοὶ οἱ κακοὶ
  choice: చెడు ఆలోచనలు
  rationale: అంతరంగంలో కలిగే నైతికంగా చెడ్డ తలంపులు లేదా యోచనలను స్పష్టంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా తెలియజేస్తుంది.
- source_word: ἐκπορεύονται
  choice: బయలుదేరుతాయి
  rationale: లోపలి మూలం నుండి వెలుపలికి వచ్చేవిగా చిత్రించే గ్రీకు క్రియ యొక్క చలన భావాన్ని నిలుపుతుంది.
- source_word: πορνεῖαι
  choice: అక్రమ లైంగిక కార్యాలు
  rationale: ఒక నిర్దిష్ట రకమైన పాపానికే పరిమితం చేయకుండా, అనుచితమైన లైంగిక చర్యలను విస్తృతంగా సూచిస్తుంది; గ్రీకు బహువచన భావాన్నీ నిలుపుతుంది.
- source_word: κλοπαί
  choice: దొంగతనాలు
  rationale: దొంగిలించే కార్యాలను సూచించే సహజమైన తెలుగు బహువచనం.
- source_word: φόνοι
  choice: హత్యలు
  rationale: సాధారణ చంపడాన్ని కాకుండా నైతికంగా, న్యాయపరంగా దోషకరమైన మనుష్యవధలను సూచిస్తుంది.
theological_decisions:
- issue: ἀνθρώπων అనే సాధారణ మానవసూచక పదం
  choice: మనుషుల
  alternative: మగవారి
  rationale: ఇక్కడ గ్రీకు పదం వ్యాకరణరీత్యా పుంలింగ బహువచనమైనా భావంలో మానవులందరినీ సూచిస్తుంది. ‘మగవారి’ అని అనువదిస్తే అర్థం అనవసరంగా పురుషులకు మాత్రమే పరిమితమవుతుంది.
- issue: πορνεῖαι యొక్క విస్తృతి మరియు బహువచనం
  choice: అక్రమ లైంగిక కార్యాలు
  alternative: లైంగిక దుర్నీతి; వ్యభిచారాలు
  rationale: మూలపదం వివిధ రకాల అనుచిత లైంగిక చర్యలను సూచించగలదు. ఒకే ఆధునిక వర్గానికి లేదా కేవలం వ్యభిచారానికి దాన్ని పరిమితం చేయకుండా, బహువచనాన్ని ప్రతిబింబించే విస్తృత పదబంధాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘హృదయం’ అనే బైబిలు అంతరంగ రూపకాన్ని నిలిపి, పాతకాలపు ‘వ్యభిచారములు’ వంటి రూపాన్ని నివారించాం.
