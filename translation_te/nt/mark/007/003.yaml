id: MRK.7.3
reference: Mark 7:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ γὰρ Φαρισαῖοι καὶ πάντες οἱ Ἰουδαῖοι ἐὰν μὴ πυγμῇ νίψωνται τὰς χεῖρας οὐκ ἐσθίουσιν, κρατοῦντες τὴν παράδοσιν τῶν πρεσβυτέρων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/003.yaml
  text: For the Pharisees and all the Jews do not eat unless they wash their hands with a fist[a], holding to the tradition of the elders.
translation:
  language: te
  text: ఎందుకంటే, పరిసయ్యులూ యూదులందరూ పెద్దల సంప్రదాయాన్ని పాటిస్తూ, తమ చేతులను పిడికిలితో[a] కడుక్కోనిదే తినరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, ‘పిడికిలితో.’ లేదా ‘మణికట్టు వరకు,’ ‘పూర్తిగా.’ గ్రీకు పదం యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం; ఇది ఆచారపూర్వక చేతులు కడిగే విధానాన్ని లేదా పరిమితిని సూచిస్తూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న సందర్భాన్ని వివరిస్తూ చేర్చిన వ్యాఖ్య అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: ఈ యూదు మతవర్గానికి ఆధునిక తెలుగు బైబిలు వాడుకలో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: యూదులందరూ
  rationale: గ్రీకు మూలంలోని విస్తృతమైన వాక్యప్రయోగాన్ని కుదించకుండా నిలుపుతుంది; ఇది ప్రతి వ్యక్తి గురించి గణితపరమైన నిరపవాద ప్రకటన కంటే వివరణాత్మక సాధారణీకరణగా సందర్భంలో పనిచేస్తుంది.
- source_word: ἐὰν μὴ
  choice: కడుక్కుంటే తప్ప
  rationale: ప్రతికూల షరతును తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πυγμῇ
  choice: పిడికిలితో[a]
  rationale: వివాదాస్పదమైన గ్రీకు పదానికి దగ్గరగా ఉండి దాని అస్పష్టతను ప్రధాన పాఠంలో తొలగించదు; సంభావ్య ఆచారపరమైన అర్థాలను పాదసూచికలో ఇస్తుంది.
- source_word: νίψωνται τὰς χεῖρας
  choice: తమ చేతులను ... కడుక్కుంటే
  rationale: శరీరంలోని ఒక భాగాన్ని, ఇక్కడ చేతులను, కడగడాన్ని స్పష్టంగా మరియు సహజంగా తెలియజేస్తుంది.
- source_word: οὐκ ἐσθίουσιν
  choice: భోజనం చేయరు
  rationale: అలవాటుగా జరిగే క్రియను సహజమైన తెలుగు వర్తమానకాలంలో వ్యక్తం చేస్తుంది; అంతర్లీన ఆహారార్థాన్ని ‘భోజనం’ సహజంగా తెలియజేస్తుంది.
- source_word: κρατοῦντες
  choice: పాటిస్తూ
  rationale: వారసత్వంగా వచ్చిన సంప్రదాయానికి కట్టుబడి దాన్ని ఆచరించే భావాన్ని సందర్భోచితంగా తెలియజేస్తుంది.
- source_word: παράδοσιν τῶν πρεσβυτέρων
  choice: పూర్వుల సంప్రదాయాన్ని
  rationale: ఇక్కడ πρεσβύτεροι ప్రస్తుత సంఘపెద్దల కంటే గత తరాల అధీకృత పెద్దలను సూచిస్తుంది; ‘పూర్వులు’ వారినుంచి వచ్చిన సంప్రదాయం అనే భావాన్ని తెలుగులో స్పష్టంగా ఇస్తుంది.
theological_decisions:
- issue: ‘యూదులందరూ’ అనే పదబంధపు పరిధి
  choice: మూలంలోని విస్తృత ప్రయోగాన్ని ‘యూదులందరూ’గా నిలిపింది.
  alternative: యూదయవాసులందరూ; అనేకమంది యూదులు
  rationale: గ్రీకు పాఠంలో πάντες (‘అందరూ’) స్పష్టంగా ఉంది. దాన్ని ‘అనేకమంది’గా మార్చడం మూలాన్ని మృదువుపరుస్తుంది; అయితే సందర్భంలో ఇది ప్రతి వ్యక్తిని మినహాయింపులేకుండా లెక్కించే ప్రకటనగా కాక, మార్కు ఇచ్చే విస్తృత వివరణగా గ్రహించాలి.
- issue: πυγμῇ యొక్క వివాదాస్పద అర్థం
  choice: ప్రధాన పాఠంలో ‘పిడికిలితో’ అని ఉంచి, ఇతర సంభావ్య అర్థాలను పాదసూచికలో తెలిపింది.
  alternative: మణికట్టు వరకు; జాగ్రత్తగా; పూర్తిగా
  rationale: ఈ పదం చేతులు కడిగే విధానాన్ని లేదా పరిమితిని సూచించవచ్చు, కానీ ఖచ్చితమైన ఆచారం అనిశ్చితం. ఒకే వ్యాఖ్యానాన్ని మూలార్థంగా నిర్ధారించకుండా నిజమైన పదార్థ అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని వివరణాత్మక గάρను ‘ఎందుకంటే’గా, వివాదాస్పద πυγμῇను పాదసూచికతో కూడిన సన్నిహిత రూపంలో ఉంచింది.
