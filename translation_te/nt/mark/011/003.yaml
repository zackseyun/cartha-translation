id: MRK.11.3
reference: Mark 11:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ· Τί ποιεῖτε τοῦτο; εἴπατε ⸀ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει· καὶ ⸀εὐθὺς αὐτὸν ἀποστέλλει ⸀πάλιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/003.yaml
  text: And if anyone says to you[a], ‘Why are you doing this?’ say[b], ‘The Lord has need of it,’ and he will send it back here immediately.
translation:
  language: te
  text: ఎవరైనా మిమ్మల్ని, “మీరు ఇలా ఎందుకు చేస్తున్నారు?” అని అడిగితే, “ప్రభువుకు దాని అవసరం ఉంది[a]” అని చెప్పండి. అతడు వెంటనే దాన్ని తిరిగి ఇక్కడికి పంపిస్తాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యజమానికి దాని అవసరం ఉంది.” గ్రీకు κύριος అనే పదానికి “ప్రభువు” లేదా “యజమాని” అనే అర్థాలు ఉండవచ్చు; ఇక్కడ సువార్త సందర్భాన్ని బట్టి “ప్రభువు” అని అనువదించబడింది.
    reason: alternative_reading
  - marker: b
    text: గ్రీకులో “పంపిస్తాడు” అనే క్రియ వర్తమాన కాలరూపంలో ఉంది; సందర్భంలో దాన్ని “వెంటనే తిరిగి పంపిస్తాడు” అనే సమీప భవిష్యత్తు భావంతో కూడా అర్థం చేసుకోవచ్చు. క్రియ కర్తను గ్రీకు పాఠ్యం పేరుతో స్పష్టం చేయదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: ఎవరైనా మీతో … అని అడిగితే
  rationale: ἐάν + subjunctive భవిష్యత్తులో సంభవించగల పరిస్థితిని సూచిస్తుంది. తెలుగులో ‘ఎవరైనా … అడిగితే’ సహజంగా ఉండి, షరతు యొక్క విపులత్వాన్ని నిలుపుతుంది.
- source_word: Τί ποιεῖτε τοῦτο;
  choice: మీరు ఇలా ఎందుకు చేస్తున్నారు?
  rationale: పదశః ‘ఏమి’ అనే భావం ఉన్నప్పటికీ, సందర్భంలో ఇది వారి చర్యను ప్రశ్నించే మాట. ‘ఇలా ఎందుకు చేస్తున్నారు?’ ఆధునిక తెలుగులో సహజంగా ఆ సవాలును వ్యక్తం చేస్తుంది.
- source_word: εἴπατε
  choice: అని చెప్పండి
  rationale: ఇది బహువచన ఆజ్ఞారూపం; సంభాషణలో ‘అని చెప్పండి’ దాని బలాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: Ὁ κύριος
  choice: ప్రభువు
  rationale: κύριοςకు ‘ప్రభువు’ లేదా ‘యజమాని’ అనే అర్థాలు సాధ్యమైనా, మార్కు సువార్త సందర్భంలో యేసును అధికారపూర్వకంగా సూచించే ‘ప్రభువు’ ప్రధాన పాఠ్యానికి తగినది. ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: αὐτοῦ χρείαν ἔχει
  choice: అది అవసరం
  rationale: పదబంధం ‘దాని అవసరం కలిగి ఉన్నాడు’ అని ఉన్నా, ‘ప్రభువుకు అది అవసరం’ తెలుగులో సహజంగా ఉండి మూలభావాన్ని నిలుపుతుంది. αὐτοῦ మునుపటి వచనంలోని గాడిదపిల్లను సూచిస్తుంది.
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు రచనలోని తక్షణత్వాన్ని ‘వెంటనే’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀποστέλλει
  choice: పంపిస్తాడు
  rationale: గ్రీకులో ఇది వర్తమాన రూపం; సందర్భంలో సమీప భవిష్యత్తును కూడా సూచించగలదు. తెలుగు సాధారణ వర్తమాన రూపమైన ‘పంపిస్తాడు’ ఈ రెండింటికీ సహజంగా చోటిస్తుంది.
- source_word: πάλιν ὧδε
  choice: తిరిగి ఇక్కడికి
  rationale: πάλινను ఈ సందర్భంలో ‘తిరిగి,’ ὧδεను ‘ఇక్కడికి’గా అనువదించడం గాడిదపిల్లను మళ్లీ ఈ స్థలానికి పంపే భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: κύριος అనే పదం యొక్క భావం మరియు సూచించబడిన వ్యక్తి
  choice: ప్రభువు—సందర్భంలో యేసును అధికారపూర్వక బిరుదుతో సూచించే పఠనం
  alternative: యజమాని—సాధారణ అధిపతి లేదా స్వామి అనే భావం
  rationale: κύριοςకు రెండు భావాలూ నిఘంటుపరంగా సాధ్యమే. అయితే యేసే ఈ ఆదేశాన్ని ఇస్తున్న మార్కు కథన సందర్భంలో ‘ప్రభువు’ ప్రధాన పాఠ్యానికి అనుకూలం; దానితో పాఠ్యంలో లేని అదనపు సిద్ధాంత వ్యాఖ్యను చేర్చలేదు.
- issue: ἀποστέλλει యొక్క కాలభావం
  choice: ‘పంపిస్తాడు’—వర్తమాన రూపాన్ని ఉంచుతూ సమీప భవిష్యత్తు భావానికీ వీలు కల్పించడం
  alternative: ‘పంపిస్తాడు/పంపివేస్తాడు’ను స్పష్టమైన భవిష్యత్తు హామీగా మాత్రమే గ్రహించడం
  rationale: గ్రీకు రూపం వ్యాకరణపరంగా వర్తమానం అయినా సందర్భంలో భవిష్యత్తు చర్యను సూచించవచ్చు. తెలుగు రూపం ఈ ఉద్రిక్తతను అవసరం లేకుండా తీర్చివేయదు.
- issue: ἀποστέλλειలో అంతర్లీన కర్త
  choice: ‘అతడు’ అని ఉంచి, కర్తను పేరుతో నిర్దిష్టం చేయకపోవడం
  alternative: ప్రశ్నించిన వ్యక్తి లేదా గాడిదపిల్ల యజమాని అని స్పష్టంగా పేర్కొనడం
  rationale: గ్రీకు క్రియలో కర్త అంతర్లీనంగా ఉంది; పాఠ్యం అతనిని పేరుతో గుర్తించదు. ‘అతడు’ మూలంలోని సూచనను నిలుపుతూ అధిక వివరణను నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణాశైలిని ఉపయోగించాం. ‘ప్రభువు’ బైబిలు సందర్భానికి తగిన గంభీరతను కలిగి ఉంది; మిగతా వాక్య నిర్మాణం సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా ఉంచబడింది.
