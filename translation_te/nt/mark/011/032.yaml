source:
  edition: SBLGNT
  text: ἀλλὰ εἴπωμεν· Ἐξ ἀνθρώπων;— ἐφοβοῦντο τὸν ⸀ὄχλον, ἅπαντες γὰρ εἶχον τὸν Ἰωάννην ⸂ὄντως ὅτι⸃ προφήτης ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/032.yaml
  text: But if we say[a], ‘From men’?”—they were afraid of the crowd[b], for everyone held that John truly was a prophet.
translation:
  language: te
  text: “కాని, ‘మనుషుల నుండి’ అని చెబుదామా?”—వారు జనసమూహానికి భయపడ్డారు; ఎందుకంటే యోహాను నిజంగానే ప్రవక్తేనని అందరూ భావించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘మనుషుల నుండి’ అని చెబుదామా?: లేదా, “మానవుల నుండి”; భావాన్ని మరింత వివరణాత్మకంగా చెబితే, “మానవ మూలం నుండి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ εἴπωμεν
  choice: కాని … అని చెబితే
  rationale: ఇది వారి తర్జనభర్జనలోని మరో ప్రత్యామ్నాయాన్ని సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో షరతును చూపడానికి ‘అని చెబితే’ సరిపోతుంది; గ్రీకులో లేని వివరణను జోడించదు.
- source_word: Ἐξ ἀνθρώπων
  choice: మనుషుల నుండి
  rationale: ἐξ అనే మూలం/ఆరంభాన్ని సూచించే భావాన్ని ‘నుండి’ నిలుపుతుంది. ‘మానవ మూలమైనది’ అనే వివరణాత్మక రూపం కంటే ఇది గ్రీకు పదబంధానికి పారదర్శకంగా ఉంటుంది.
- source_word: ἐφοβοῦντο τὸν ὄχλον
  choice: వారు జనసమూహానికి భయపడ్డారు
  rationale: అప్పటి పరిస్థితిలో కొనసాగుతున్న భయాన్ని సహజ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. ὄχλοςకు సందర్భానుగుణంగా ‘జనసమూహం’ సరిపోతుంది.
- source_word: ἅπαντες
  choice: అందరూ
  rationale: ‘అందరూ’ అనే రూపం గ్రీకు పదంలోని సమగ్ర, పంపిణీ భావాన్ని అదనపు నామవాచకం లేకుండా సహజంగా తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: వారు జనసమూహానికి ఎందుకు భయపడ్డారో తెలిపే కారణ సంబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἶχον
  choice: భావించారు
  rationale: ఇక్కడ ἔχω ఒకరి గురించి స్థిరమైన అభిప్రాయం కలిగి ఉండడాన్ని సూచిస్తుంది. ‘భావించారు’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ὄντως ὅτι προφήτης ἦν
  choice: నిజంగా ప్రవక్తేనని
  rationale: ὄντωςలోని నిశ్చయాత్మక బలాన్ని ‘నిజంగా’ మరియు ‘ప్రవక్తే’ కలిపి తెలియజేస్తాయి; అదే సమయంలో ఇది జనుల అభిప్రాయంగా నివేదించబడుతోందని ‘అని భావించారు’ అనే నిర్మాణం నిలుపుతుంది.
theological_decisions:
- issue: యోహాను బాప్తిస్మపు మూలాన్ని సూచించే Ἐξ ἀνθρώπων అనువాదం
  choice: మనుషుల నుండి
  alternative: మానవుల నుండి; మానవ మూలం నుండి
  rationale: ఈ పదబంధం దైవిక మూలానికి విరుద్ధంగా మానవ మూలాన్ని సూచిస్తుంది. ప్రధాన పాఠం గ్రీకు రూపకాన్ని నిలుపుతుంది; మరింత వివరణాత్మక అర్థాన్ని పాదటిప్పణిలో ఇస్తుంది.
- issue: ὄντως ὅτι προφήτης ἦνలో జనసమూహపు అంచనాకు ఉన్న బలం
  choice: యోహాను నిజంగా ప్రవక్తేనని అందరూ భావించారు
  alternative: యోహానును నిజమైన ప్రవక్తగా అందరూ పరిగణించారు; యోహాను ప్రవక్తేనని అందరూ నమ్మారు
  rationale: ఇది యోహాను గురించి జనుల దృఢమైన అభిప్రాయాన్ని నివేదిస్తుంది. వాక్యాన్ని వ్యాఖ్యాత స్వతంత్ర ప్రకటనగా మార్చకుండా, ὄντωςలోని ఉద్ఘాటనను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘మనుషుల నుండి’ అనే రూపం మూలపాఠపు సంక్షిప్తతను నిలుపగా, ‘జనసమూహం,’ ‘భావించారు’ వంటి పదాలు సహజ ప్రస్తుత వాడుకకు అనుగుణంగా ఉన్నాయి.
