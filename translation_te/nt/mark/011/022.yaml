revisions:
- from: అప్పుడు యేసు వారికి జవాబిస్తూ, “దేవునిపై విశ్వాసం ఉంచండి[a]” అన్నాడు.
  to: 'యేసు వారికి జవాబుగా ఇలా అన్నాడు: “దేవునిపై విశ్వాసం ఉంచండి[a].”'
  rationale: The revision removes the unsupported temporal addition and uses a more natural Telugu reply formula. It retains the contextual rendering “దేవునిపై విశ్వాసం” and preserves the disputed genitive relationship in the footnote, in line with both the Greek source and the English POB audit trail.
