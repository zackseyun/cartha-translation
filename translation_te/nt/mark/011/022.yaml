review_pass:
  verdict: revise
  source_fidelity: The main rendering of πίστιν θεοῦ as “దేవునిపై విశ్వాసం” is contextually sound, while the footnote appropriately preserves the Greek genitive’s genuine ambiguity. However, “అప్పుడు” adds a temporal inference not expressed by καί, which here is simply connective. “జవాబిస్తూ … అన్నాడు” is understandable but less direct than a standard Telugu narrative reply formula.
  naturalness: “యేసు వారికి జవాబుగా ఇలా అన్నాడు” is natural, modern standard Telugu and clearly conveys the combined force of ἀποκριθεὶς and λέγει without an awkward participial construction. The imperative “దేవునిపై విశ్వాసం ఉంచండి” is idiomatic and appropriately respectful.
  terminology: “విశ్వాసం” and “దేవునిపై” are suitable for the contextual objective-genitive reading. The footnote’s “దేవుని విశ్వాసం” preserves a deliberately literal, ambiguous formulation; the alternatives correctly signal possible senses without making any one of them doctrinally decisive.
  issues:
  - severity: low
    issue: Unwarranted temporal connective
    rationale: The draft’s “అప్పుడు” (‘then’) is not represented by καί. Although it does not materially alter the sense, omitting it more closely reflects the source.
  - severity: low
    issue: Reply formula can be more idiomatic
    rationale: “జవాబిస్తూ … అన్నాడు” is intelligible, but “జవాబుగా ఇలా అన్నాడు” is smoother narrative Telugu for ἀποκριθεὶς … λέγει.
  revised_text: 'యేసు వారికి జవాబుగా ఇలా అన్నాడు: “దేవునిపై విశ్వాసం ఉంచండి[a].”'
  revised_footnotes:
