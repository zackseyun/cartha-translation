  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς λέγει αὐτοῖς· Ἔχετε πίστιν θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/022.yaml
  text: And Jesus answered them[a], “Have faith in God.”
translation:
  language: te
  text: 'యేసు వారికి జవాబుగా ఇలా అన్నాడు: “దేవునిపై విశ్వాసం ఉంచండి[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “దేవుని విశ్వాసం కలిగి ఉండండి.” దీనిని “దేవుని విశ్వసనీయతను కలిగి ఉండండి” లేదా “దేవుని నుండి వచ్చే విశ్వాసం కలిగి ఉండండి” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: జవాబిస్తూ
  rationale: ఈ కృదంతం ముందున్న సందర్భానికి ప్రతిస్పందనగా పలికిన మాటను పరిచయం చేస్తుంది. తెలుగు కథనంలో ‘జవాబిస్తూ … అన్నాడు’ సహజంగా ఉండి గ్రీకు నిర్మాణాన్ని కూడా ప్రతిబింబిస్తుంది.
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉంది. ఆధునిక తెలుగు కథనంలో భూతకాల రూపమైన ‘అన్నాడు’ సహజం; ἀποκριθεὶςతో కలిపి ఒకే సాఫీ వాక్యంగా అనువదించబడింది.
- source_word: Ἔχετε
  choice: ఉంచండి
  rationale: వర్తమాన ఆజ్ఞారూపం నిరంతర వైఖరిని సూచించగలదు. ‘విశ్వాసం ఉంచండి’ అనేది సహజమైన తెలుగు ప్రయోగం; ఆజ్ఞ యొక్క కొనసాగింపు భావాన్ని అతిగా విస్తరించదు.
- source_word: πίστιν
  choice: విశ్వాసం
  rationale: ఈ సందర్భంలో πίστιςకు ‘విశ్వాసం’ సాధారణమైన, గౌరవప్రదమైన పదం. ‘నమ్మకం’ సాధ్యమైనప్పటికీ, ప్రార్థన మరియు దేవునిపై ఆధారపడే సందర్భంలో ‘విశ్వాసం’ సరిపోతుంది.
- source_word: θεοῦ
  choice: దేవునిపై
  rationale: πίστιν θεοῦలోని షష్ఠీ విభక్తి వ్యాకరణపరంగా సందిగ్ధమైనది. 11:23–24లో విశ్వసించడం, ప్రార్థించడం గురించి వచ్చే బోధను బట్టి దేవుని లక్ష్యంగా చేసుకున్న విశ్వాసం అనే అర్థాన్ని ప్రధాన పాఠంలో సహజమైన తెలుగులో ఇచ్చాం; ఇతర సాధ్యార్థాలను పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: πίστιν θεοῦలో సందిగ్ధమైన షష్ఠీ విభక్తి
  choice: దేవునిపై విశ్వాసం
  alternative: మరింత అక్షరార్థంగా ‘దేవుని విశ్వాసం’; దీనిని ‘దేవుని విశ్వసనీయత’ లేదా ‘దేవుని నుండి వచ్చే విశ్వాసం’ అని కూడా అర్థం చేసుకోవచ్చు.
  rationale: ఎండిపోయిన అంజూరపు చెట్టు సందర్భం తరువాత, ప్రార్థనలో విశ్వసించడం గురించి 11:23–24లో వచ్చే బోధకు ‘దేవునిపై విశ్వాసం’ అత్యంత సందర్భోచితం. అయినా గ్రీకు పదబంధం ఇతర సంబంధాలను కూడా అనుమతిస్తుంది కాబట్టి ఆ నిజమైన సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘దేవునిపై విశ్వాసం ఉంచండి’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది; గ్రీకు షష్ఠీ విభక్తిలోని భావసందిగ్ధత పాదసూచికలో నిలుపబడింది.
