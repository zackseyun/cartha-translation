id: MRK.11.29
reference: Mark 11:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰησοῦς εἶπεν αὐτοῖς· Ἐπερωτήσω ⸀ὑμᾶς ἕνα λόγον, καὶ ἀποκρίθητέ μοι, καὶ ἐρῶ ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/029.yaml
  text: But Jesus said to them[a], “I will ask you one question. Answer me[b], and I will tell you by what authority I do these things.”
translation:
  language: te
  text: 'అయితే యేసు వారితో ఇలా అన్నాడు: “నేను మిమ్మల్ని ఒక ప్రశ్న[a] అడుగుతాను. నాకు జవాబు చెప్పండి[b]; అప్పుడు నేను ఏ అధికారంతో ఈ పనులు చేస్తున్నానో మీకు చెబుతాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఒక విషయం”; అక్షరార్థంగా “ఒక మాట.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “నేను మిమ్మల్ని ఒక ప్రశ్న అడుగుతాను, నాకు జవాబు చెప్పండి; అప్పుడు నేను మీకు చెబుతాను.”
    reason: previous_rendering
lexical_decisions:
- source_word: δὲ
  choice: అప్పుడు
  rationale: మునుపటి ప్రశ్నకు యేసు ఇచ్చే ప్రతిస్పందనను సహజమైన తెలుగు కథన సంధితో సూచిస్తుంది; గ్రీకులోని స్వల్ప వ్యత్యాసాన్ని అతిగా బలపరచదు.
- source_word: εἶπεν αὐτοῖς
  choice: వారితో ... అన్నాడు
  rationale: తెలుగు ప్రత్యక్ష ప్రసంగానికి సహజమైన నిర్మాణం; పరోక్ష కర్మను స్పష్టంగా నిలుపుతుంది.
- source_word: Ἐπερωτήσω ὑμᾶς
  choice: నేను మిమ్మల్ని ... అడుగుతాను
  rationale: భవిష్యత్ రూపాన్నీ, యేసు వేయబోయే ప్రతిప్రశ్న భావాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἕνα λόγον
  choice: ఒక విషయం
  rationale: λόγος యొక్క విస్తృత భావాన్ని నిలుపుతూ, వెంటనే జవాబు కోరే సందర్భానికి సరిపోతుంది; ‘ఒక ప్రశ్న’ అనే సందర్భానుగుణ అర్థాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: ἀποκρίθητέ μοι
  choice: నాకు జవాబు చెప్పండి
  rationale: ఆజ్ఞార్థక బలాన్ని స్పష్టంగా, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: καὶ ἐρῶ ὑμῖν
  choice: అప్పుడు ... మీకు చెబుతాను
  rationale: గ్రీకు καὶ ఇక్కడ సూచించే వరుస/ఫలిత సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: ఏ అధికారంతో
  rationale: చర్యలకు ఆధారం లేదా హక్కు ఏమిటనే వివాదాన్ని సహజంగా, ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: ταῦτα ποιῶ
  choice: ఇవన్నీ ... చేస్తున్నానో
  rationale: వర్తమాన కాలంలోని కొనసాగుతున్న, వివాదాస్పదమైన యేసు చర్యలను తెలుగు సందర్భంలో సహజంగా చూపుతుంది.
theological_decisions:
- issue: సందర్భంలో ἐξουσία స్వభావం
  choice: అధికారం
  alternative: హక్కు; శక్తి
  rationale: ఆలయ నాయకులతో ఉన్న వివాదంలో యేసు ఈ కార్యాలు చేయడానికి గల అధికారబద్ధమైన ఆధారమే ప్రధానాంశం; ‘అధికారం’ సామర్థ్యానికి మాత్రమే పరిమితం చేయకుండా సంస్థాగత, ధార్మిక భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథన శైలిలో అనువదించబడింది. గ్రీకు వాక్యంలోని వరుస సంధులను తెలుగు విరామచిహ్నాలు మరియు ‘అప్పుడు’ ద్వారా సహజీకరించాం.
