revisions:
- from: అప్పుడు యేసు వారితో, “నేను మిమ్మల్ని ఒక విషయం[a] అడుగుతాను. నాకు జవాబు చెప్పండి[b]; అప్పుడు నేను ఇవన్నీ ఏ అధికారంతో చేస్తున్నానో మీకు చెబుతాను” అన్నాడు.
  to: 'అయితే యేసు వారితో ఇలా అన్నాడు: “నేను మిమ్మల్ని ఒక ప్రశ్న[a] అడుగుతాను. నాకు జవాబు చెప్పండి[b]; అప్పుడు నేను ఏ అధికారంతో ఈ పనులు చేస్తున్నానో మీకు చెబుతాను.”'
  rationale: 'The revision uses an idiomatic Telugu expression for Jesus’ counter-question, avoids adding the sense “all” to ταῦτα, and represents δὲ as a mild responsive contrast. The footnote anchors remain correctly attached: [a] to the lexical rendering of ἕνα λόγον and [b] to the imperative/connected alternative phrasing. No disputed textual or theological ambiguity has been narrowed.'
