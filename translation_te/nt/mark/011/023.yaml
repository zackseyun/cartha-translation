id: MRK.11.23
reference: Mark 11:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἀμὴν λέγω ὑμῖν ὅτι ὃς ἂν εἴπῃ τῷ ὄρει τούτῳ· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, καὶ μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ ἀλλὰ ⸀πιστεύῃ ὅτι ⸂ὃ λαλεῖ γίνεται, ἔσται αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/023.yaml
  text: Truly I tell you[a], whoever says to this mountain, ‘Be lifted up and be thrown into the sea,’ and does not doubt in his heart but believes that what he says is happening[b], it will be so for him.
translation:
  language: te
  text: 'నేను మీతో నిజంగా చెబుతున్నాను: ఎవరైనా ఈ కొండతో, ‘పైకెత్తబడి, సముద్రంలో పడవేయబడిపో’ అని చెప్పి, తన హృదయంలో సందేహించకుండా[a], తాను చెప్పేది జరుగుతోందని[b] నమ్మితే, అది అతనికి అలాగే జరుగుతుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తటపటాయించకుండా,’ ‘అంతరంగంలో విభజన చెందకుండా.’ గ్రీకు క్రియ సందేహంతో పాటు అంతరంగ విభజన భావాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తాను చెప్పేది జరుగుతుందని,’ ‘నెరవేరుతుందని.’ భవిష్యత్ ఫలితాన్ని తెలిపే వాక్యభాగానికి ముందు గ్రీకులో ఇక్కడ వర్తమాన కాలం (‘జరుగుతోంది/జరుగుతుంది’) ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: నేను మీతో నిజంగా చెబుతున్నాను
  rationale: యేసు పలికే గంభీరమైన ధృవీకరణ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ἀμήν బలాన్ని ‘నిజంగా’ నిలుపుతుంది.
- source_word: ὃς ἂν εἴπῃ
  choice: ఎవరైనా ... చెప్పి
  rationale: ἄνతో కూడిన సంబంధవాచక సర్వనామం, సంభావ్యార్థక క్రియ సాధారణ అనిర్దిష్ట షరతును సూచిస్తాయి; తెలుగులో ‘ఎవరైనా’ ఆ భావాన్ని సహజంగా ఇస్తుంది.
- source_word: τῷ ὄρει τούτῳ
  choice: ఈ కొండతో
  rationale: ὄροςకు ‘కొండ’ సాధారణ ఆధునిక తెలుగు పదం; τούτῳలోని సజీవమైన సమీప సూచనను ‘ఈ’ నిలుపుతుంది.
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  choice: పైకి ఎత్తబడి సముద్రంలో పడవేయబడు
  rationale: రెండు అఒరిస్ట్ పాసివ్ ఆజ్ఞారూపాల కర్మణి రూపాన్ని, అలాగే ఎత్తబడి విసరబడే స్పష్టమైన దృశ్యాన్ని నిలుపుతుంది.
- source_word: μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ
  choice: తన హృదయంలో సందేహించకుండా
  rationale: ఈ సందర్భంలో διακρίνω అంతరంగ సందేహం లేదా తటపటాయింపును సూచిస్తుంది; ‘హృదయంలో’ καρδίαను యథాతథంగా నిలుపుతుంది.
- source_word: πιστεύῃ
  choice: నమ్మితే
  rationale: నమ్మకాన్ని సూచించే సాధారణ, స్పష్టమైన తెలుగు క్రియ; షరతుతో సహజంగా అనుసంధానమవుతుంది.
- source_word: ὅτι ὃ λαλεῖ γίνεται
  choice: తాను చెప్పేది జరుగుతోందని
  rationale: γίνεται వర్తమాన కాలాన్ని భవిష్యత్తుగా మార్చకుండా ప్రగతిశీల వర్తమాన రూపంలో నిలుపుతుంది; λαλεῖని సందర్భానుకూలంగా ‘చెప్పేది’గా అందిస్తుంది.
- source_word: ἔσται αὐτῷ
  choice: అది అతనికి అలాగే జరుగుతుంది
  rationale: భవిష్యత్ ఫలితాన్ని స్పష్టంగా తెలిపినా, అది ఎలా నెరవేరుతుందో అదనంగా నిర్దేశించదు; αὐτῷలోని ఏకవచన పుంలింగాన్ని ‘అతనికి’గా నిలుపుతుంది.
theological_decisions:
- issue: విశ్వాసంతో పలికిన మాటకు సంబంధించిన వాగ్దానం స్వభావం
  choice: విశ్వసించి సందేహించకపోవడంతో ముడిపడిన షరతుగల వాగ్దానంగా వాక్యాన్ని నేరుగా అనువదించడం
  alternative: దీనిని కేవలం అతిశయోక్తిగా మృదువుపరచడం లేదా ఎలాంటి పరిమితులూ లేని హామీగా విస్తరించడం
  rationale: మూలవాక్యం కొండను సముద్రంలో పడవేసే బలమైన చిత్రాన్ని వాడుతుంది; తరువాతి సిద్ధాంతపరమైన పరిమితులను చేర్చకుండా, అలాగే దాని బలాన్ని తగ్గించకుండా వేదాంతపరమైన ఉద్రిక్తతను నిలుపుతుంది.
- issue: αὐτοῦ / αὐτῷలోని ఏకవచన పుంలింగ సాధారణ ప్రయోగం
  choice: ‘తన’, ‘అతనికి’ అనే ఏకవచన రూపాలు
  alternative: బహువచన లేదా లింగతటస్థ రూపాలతో సవరించడం
  rationale: గ్రీకు రూపాలు వ్యాకరణపరంగా పుంలింగ ఏకవచనంలో ఉండి ప్రతినిధి సాధారణార్థం కలిగివున్నాయి; అనువాదం ఆ రూపాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని కర్మణి ఆజ్ఞలు, హృదయానికి సంబంధించిన రూపకం, γίνεται వర్తమాన కాలం, ఏకవచన పుంలింగ సూచనలు నిలుపబడ్డాయి. [a], [b] సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
