review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the solemn affirmation, the indefinite conditional force, the demonstrative ‘this mountain,’ inward doubt, present-tense γίνονται/γίνεται nuance, and the open-ended future result. The two Greek passive imperatives should be expressed more clearly in Telugu; the draft’s final ‘పడవేయబడు’ is grammatically intelligible but stiff and incomplete-sounding in modern usage.
  naturalness: The overall register is clear, modern, and suitably solemn. Revising the quoted command to ‘పైకెత్తబడి, సముద్రంలో పడవేయబడిపో’ gives a more natural Telugu command while retaining the passive imagery. The first footnote’s ‘తనలో తాను చీలిపోకుండా’ is overly literal and unnatural; ‘అంతరంగంలో విభజన చెందకుండా’ communicates the lexical nuance naturally.
  terminology: ‘నిజంగా,’ ‘హృదయం,’ ‘సందేహించకుండా,’ and ‘నమ్మితే’ are appropriate modern-standard Telugu renderings. ‘సముద్రం’ correctly renders θάλασσα. The masculine singular references ‘తన’ and ‘అతనికి’ appropriately retain the Greek’s representative masculine singular.
  issues:
  - severity: medium
    issue: The second passive imperative is awkward in modern Telugu.
    rationale: ‘పడవేయబడు’ is a bare passive imperative and sounds stilted in this context. ‘పడవేయబడిపో’ more naturally conveys ‘be thrown,’ while the preceding passive participle retains the paired passive image.
  - severity: low
    issue: Footnote a uses an unnatural literal expression for inward division.
    rationale: ‘తనలో తాను చీలిపోకుండా’ is not idiomatic modern Telugu. ‘అంతరంగంలో విభజన చెందకుండా’ conveys the possible sense of διακρίνω without suggesting physical splitting.
  revised_text: 'నేను మీతో నిజంగా చెబుతున్నాను: ఎవరైనా ఈ కొండతో, ‘పైకెత్తబడి, సముద్రంలో పడవేయబడిపో’ అని చెప్పి, తన హృదయంలో సందేహించకుండా[a], తాను చెప్పేది జరుగుతోందని[b] నమ్మితే, అది అతనికి అలాగే జరుగుతుంది.'
