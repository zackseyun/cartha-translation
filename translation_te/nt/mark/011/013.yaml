id: MRK.11.13
reference: Mark 11:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν ⸀ἀπὸ μακρόθεν ἔχουσαν φύλλα ἦλθεν εἰ ἄρα ⸂τι εὑρήσει⸃ ἐν αὐτῇ, καὶ ἐλθὼν ἐπ’ αὐτὴν οὐδὲν εὗρεν εἰ μὴ φύλλα, ⸂ὁ γὰρ καιρὸς οὐκ ἦν⸃ σύκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/013.yaml
  text: And seeing from a distance a fig tree having leaves[a], he went to see whether perhaps he would find anything on it. But when he came to it, he found nothing except leaves, for it was not the season for figs.
translation:
  language: te
  text: ఆకులతో ఉన్న ఒక అంజూరపు చెట్టును దూరం నుంచి చూసి, దానిపై ఏమైనా దొరుకుతుందేమో అని ఆయన దాని దగ్గరకు వెళ్లాడు. కానీ దాని దగ్గరకు వచ్చినప్పుడు, ఆకులు తప్ప మరేమీ ఆయనకు దొరకలేదు; ఎందుకంటే అది అంజూరపు పండ్ల కాలం కాదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే అది అంజూరపు పండ్ల సమయం కాదు.”
    reason: καιρός అనే పదాన్ని సందర్భంలో ‘కాలం’ లేదా ‘సమయం’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: ἰδὼν
  choice: చూసి
  rationale: గ్రీకు భూతకాల కృదంతంలోని కాలసంబంధ సందర్భార్థాన్ని సహజమైన తెలుగు పూర్వకాలిక క్రియతో వ్యక్తం చేస్తుంది; సంఘటనల క్రమాన్ని అనవసరంగా విస్తరించదు.
- source_word: συκῆν
  choice: ఒక అంజూరపు చెట్టును
  rationale: తెలుగు బైబిలు సందర్భంలో సుపరిచితమైన, వృక్షాన్ని స్పష్టంగా సూచించే సమానార్థకం.
- source_word: ἀπὸ μακρόθεν
  choice: దూరం నుంచి
  rationale: స్థలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἔχουσαν φύλλα
  choice: ఆకులతో ఉన్న
  rationale: అక్షరార్థాన్ని కాపాడుతూ తెలుగులో సహజంగా ఉంది; చెట్టు ఆకులతో కనిపించిందనే వివరాన్ని మాత్రమే చెబుతుంది.
- source_word: ἦλθεν εἰ ἄρα τι εὑρήσει ἐν αὐτῇ
  choice: దానిపై ఏమైనా దొరుకుతుందేమో అని ఆయన దాని దగ్గరకు వెళ్లాడు
  rationale: εἰ ἄρα లోని అనిశ్చిత నిరీక్షణను ‘దొరుకుతుందేమో’ స్పష్టంగా నిలుపుతుంది; ἐν αὐτῇ సందర్భానుసారం చెట్టుపై ఫలం ఉండటాన్ని సూచించేందుకు ‘దానిపై’గా అనువదించబడింది.
- source_word: ἐλθὼν ἐπ’ αὐτὴν
  choice: దాని దగ్గరకు వచ్చినప్పుడు
  rationale: కృదంత నిర్మాణాన్ని సహజమైన కాలవాచక ఉపవాక్యంగా అందిస్తూ, చెట్టు వద్దకు చేరడాన్ని స్పష్టం చేస్తుంది.
- source_word: οὐδὲν εὗρεν εἰ μὴ φύλλα
  choice: ఆకులు తప్ప మరేమీ ఆయనకు దొరకలేదు
  rationale: εἰ μὴ లోని మినహాయింపు భావాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ γὰρ καιρὸς οὐκ ἦν σύκων
  choice: ఎందుకంటే అది అంజూరపు పండ్ల కాలం కాదు
  rationale: καιρός ను సందర్భంలోని తగిన ఋతువు లేదా కాలంగా అందిస్తుంది; కథనంలోని ఉద్రిక్తతను వివరణతో తొలగించకుండా మూల వాక్యాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: అంజూరపు పండ్ల కాలం కాదనే వివరణాత్మక వాక్యభాగం యొక్క భావం
  choice: ‘ఎందుకంటే అది అంజూరపు పండ్ల కాలం కాదు’ అని కథకుని వివరణగా నేరుగా అనువదించడం.
  alternative: ‘ఎందుకంటే అది అంజూరపు పండ్ల సమయం కాదు’ అని మరింత పదశఃగా అనువదించడం లేదా వ్యవసాయ నేపథ్యాన్ని జోడించి విస్తరించడం.
  rationale: యేసు ఫలం వెదకగా, అది పండ్ల కాలం కాదని మార్కు చెప్పడంలో ఉన్న వ్యాఖ్యానపరమైన ఉద్రిక్తతను అనువాదం పరిష్కరించకూడదు. మూలంలోని వివరణను యథాతథంగా ఉంచడం ఆ అస్పష్టతను, ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఆయన’ ద్వారా యేసును గౌరవంగా సూచించాం. మూలంలోని అనిశ్చితిని ‘దొరుకుతుందేమో’ ద్వారా, చివరి వివరణలోని వ్యాఖ్యానపరమైన ఉద్రిక్తతను ఎలాంటి అదనపు వ్యవసాయ వివరణ లేకుండా నిలిపాం.
