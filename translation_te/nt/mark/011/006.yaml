revisions:
- from: వారు యేసు చెప్పినట్టే వారికి చెప్పారు; అప్పుడు వారు వీరిని వెళ్లనిచ్చారు.[a]
  to: వారు యేసు చెప్పినట్టే వారికి చెప్పారు; అప్పుడు అక్కడున్నవారు వారిని వెళ్లనిచ్చారు.[a]
  rationale: The revision resolves the Telugu referential ambiguity by explicitly naming the bystanders as the subject of the final clause. This is contextually warranted by Mark 11:5–6 and does not add a new event or interpretive claim. The footnote is adjusted to match the revised pronouns and uses clearer alternatives for the Greek verb.
