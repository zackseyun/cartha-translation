  text: οἱ δὲ εἶπαν αὐτοῖς καθὼς ⸀εἶπεν ὁ Ἰησοῦς· καὶ ἀφῆκαν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/006.yaml
  text: And they said to them just as Jesus had said[a], and they let them go.
translation:
  language: te
  text: వారు యేసు చెప్పినట్టే వారికి చెప్పారు; అప్పుడు అక్కడున్నవారు వారిని వెళ్లనిచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారిని అనుమతించారు,’ ‘వారిని విడుదల చేశారు.’ గ్రీకు క్రియకు అనుమతించడం, విడుదల చేయడం, వెళ్లనివ్వడం అనే అర్థాలు ఉండవచ్చు. ఇక్కడ అక్కడున్నవారు శిష్యులు గాడిదపిల్లను తీసుకెళ్లకుండా ఇక అడ్డుకోలేదని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: వారు
  rationale: సందర్భంలో ఇది శిష్యులను సూచిస్తుంది. δέ అనే అనుసంధానాన్ని తెలుగులో సహజమైన కథన ప్రవాహం కోసం ప్రత్యేక పదంతో బలవంతంగా చూపకుండా వాక్యక్రమంలో వ్యక్తపరిచాం.
- source_word: εἶπαν αὐτοῖς
  choice: వారికి చెప్పారు
  rationale: λέγω యొక్క సాధారణ మాట్లాడే అర్థాన్ని, αὐτοῖς అనే పరోక్ష కర్మను సహజమైన ఆధునిక తెలుగులో నేరుగా అందిస్తుంది.
- source_word: καθὼς εἶπεν ὁ Ἰησοῦς
  choice: యేసు చెప్పినట్టే
  rationale: καθώς సూచించే సరిగ్గా అనుగుణమైన భావాన్ని ‘చెప్పినట్టే’ సహజంగా నిలుపుతుంది; ముందుగా జరిగిన యేసు మాటను తెలుగు భూతకాల కృదంత నిర్మాణం స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀφῆκαν αὐτούς
  choice: వీరిని వెళ్లనిచ్చారు
  rationale: ఇక్కడ ἀφίημι అంటే అడ్డుకోకుండా అనుమతించడం. ‘వెళ్లనిచ్చారు’ సందర్భానికి సహజంగా సరిపోతుంది; ‘వీరిని’ అనే రూపం శిష్యులను, ‘వారు’ అనే కర్త అక్కడున్నవారిని వేరుచేసి అస్పష్టతను తగ్గిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ఒకే వాక్యంలో ఉన్న రెండు బహువచన సమూహాలను స్పష్టంగా వేరుచేయడానికి ‘వారు/వీరిని’ ఉపయోగించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
