source:
  edition: SBLGNT
  text: ⸂καὶ ἀπῆλθον⸃ καὶ εὗρον πῶλον δεδεμένον ⸀πρὸς θύραν ἔξω ἐπὶ τοῦ ἀμφόδου, καὶ λύουσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/004.yaml
  text: And they went away and found a colt tied at a door outside on the street[a], and they untied it.
translation:
  language: te
  text: వారు వెళ్లి, బయట వీధిలో ఒక తలుపు దగ్గర కట్టివేయబడి ఉన్న ఒక గాడిద పిల్లను కనుగొన్నారు[a]. దాన్ని విప్పారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బయట, వీధిలోని ఒక తలుపు దగ్గర.” గ్రీకు పదబంధంలో స్థలానికి సంబంధించిన పదాల అన్వయం కొద్దిగా భిన్నంగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: వెళ్లి
  rationale: యేసు సూచనలు ఇచ్చిన చోటు నుండి వారు వెళ్లినట్లు సందర్భం స్పష్టం చేస్తుంది; తెలుగు కథన శైలిలో ‘వెళ్లి’ సహజంగా ఉంది.
- source_word: εὗρον
  choice: కనుగొన్నారు
  rationale: కథన సందర్భంలో εὑρίσκωకు సహజమైన, స్పష్టమైన సమానార్థకం.
- source_word: πῶλον
  choice: గాడిద పిల్లను
  rationale: πῶλος సాధారణంగా చిన్న వయసు జంతువును సూచించినా, సమీప సందర్భం దీనిని గాడిద పిల్లగా గుర్తిస్తుంది; ఆధునిక తెలుగు పాఠకులకు ‘పిల్లగాడిద’ కంటే ‘గాడిద పిల్ల’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: δεδεμένον
  choice: కట్టివేయబడి ఉన్న
  rationale: పరిపూర్ణ కర్మణి కృదంతం ఆ జంతువు అప్పటికే కట్టబడి ఉన్న స్థితిని తెలియజేస్తుంది.
- source_word: πρὸς θύραν
  choice: ఒక తలుపు దగ్గర
  rationale: πρός ఇక్కడ తలుపుకు సమీపంలో ఉన్న స్థానాన్ని సూచిస్తుంది; ‘దగ్గర’ సహజమైన తెలుగు.
- source_word: ἔξω
  choice: బయట
  rationale: లోపల కాకుండా వెలుపల ఉన్న ప్రదేశాన్ని సరళంగా సూచిస్తుంది.
- source_word: ἐπὶ τοῦ ἀμφόδου
  choice: వీధిలో
  rationale: ἄμφοδον వీధి, సందు లేదా బహిరంగ దారిని సూచిస్తుంది; ἐπί సహిత పదబంధానికి ఇక్కడ ‘వీధిలో’ సహజమైన స్థానార్థక అనువాదం.
- source_word: λύουσιν αὐτόν
  choice: దాన్ని విప్పారు
  rationale: చారిత్రక వర్తమానాన్ని తెలుగు కథనంలో భూతకాలంగా అందించాం; కట్టిన జంతువును విడదీయడాన్ని ‘విప్పారు’ సహజంగా వ్యక్తం చేస్తుంది.
