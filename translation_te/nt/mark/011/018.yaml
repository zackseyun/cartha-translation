  text: καὶ ἤκουσαν οἱ ⸂ἀρχιερεῖς καὶ οἱ γραμματεῖς⸃, καὶ ἐζήτουν πῶς αὐτὸν ἀπολέσωσιν· ἐφοβοῦντο γὰρ αὐτόν, ⸂πᾶς γὰρ⸃ ὁ ὄχλος ἐξεπλήσσετο ἐπὶ τῇ διδαχῇ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/018.yaml
  text: And the chief priests and the scribes heard it[a], and they were seeking how they might destroy him, for they feared him, because the whole crowd was astonished at his teaching.
translation:
  language: te
  text: ప్రధాన యాజకులూ శాస్త్రులూ ఇది విని, ఆయనను ఎలా నాశనం చేయవచ్చో వెదుకుతూ ఉన్నారు. ఎందుకంటే జనసమూహమంతా ఆయన బోధకు ఆశ్చర్యపోతూ ఉండడంతో వారు ఆయనకు భయపడ్డారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చంపాలో,” “మరణానికి గురిచేయాలో.” గ్రీకు క్రియకు విస్తృతంగా “నాశనం చేయు” అనే అర్థం ఉండగలదు; అయితే ఈ సందర్భం ప్రాణం తీయాలనే ఉద్దేశాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: ఇది విని
  rationale: క్రియకు గ్రీకులో ప్రత్యక్ష కర్మ లేకపోయినా, ఆలయంలో యేసు చేసినదీ చెప్పినదీ మునుపటి సందర్భం నుంచి సూచితమవుతోంది. సహజమైన తెలుగుకోసం ‘ఇది’ చేర్చబడింది; విషయం మరింత నిర్దిష్టంగా చెప్పబడలేదు.
- source_word: ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: యెరూషలేములోని యాజక నాయకవర్గాన్ని సూచించే స్థిరమైన, స్పష్టమైన తెలుగు పదబంధం.
- source_word: γραμματεῖς
  choice: శాస్త్రులు
  rationale: సువార్తలలో యూదుల ధర్మశాస్త్ర పండితవర్గానికి వాడే సుపరిచిత పదం; ‘ధర్మశాస్త్ర బోధకులు’ అనే వివరణాత్మక అనువాదం కంటే మూలంలోని వర్గపేరును నిలుపుతుంది.
- source_word: ἐζήτουν
  choice: మార్గం వెదుకుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న ప్రయత్న భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πῶς
  choice: ఎలా ... మార్గం
  rationale: వారు చేయదలచిన పనికి తగిన విధానం లేదా సాధనం గురించి ఆలోచిస్తున్న భావాన్ని అందిస్తుంది.
- source_word: ἀπολέσωσιν
  choice: నాశనం చేయాలో
  rationale: ἀπόλλυμι యొక్క విస్తృతమైన ‘నాశనం చేయు’ భావాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది. సందర్భంలో చంపాలనే ఉద్దేశం బలంగా సూచితమైనా, దానిని పాఠ్యంలోనే తప్పనిసరిగా కుదించలేదు.
- source_word: ἐφοβοῦντο
  choice: భయపడ్డారు
  rationale: వారిలో కొనసాగిన భయాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సందర్భం అది యేసు ప్రభావం మరియు జనసమూహ స్పందనతో ముడిపడి ఉందని చూపుతుంది.
- source_word: πᾶς ὁ ὄχλος
  choice: జనసమూహమంతా
  rationale: సమూహమంతటినీ సమష్టిగా నొక్కిచెప్పే గ్రీకు నిర్మాణాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἐξεπλήσσετο
  choice: ఆశ్చర్యపోతూ ఉండడంతో
  rationale: బలమైన, కొనసాగుతున్న ఆశ్చర్యస్థితిని తెలుపుతుంది; అసంపూర్ణ భూతకాల భావాన్ని ‘ఉండడంతో’ నిలుపుతుంది.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: ఆయన బోధకు
  rationale: వారి ఆశ్చర్యానికి ఆయన బోధ ఆధారం లేదా కారణమని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ἀπολέσωσινలో నాయకుల ఉద్దేశం ఎంతవరకు నిర్దిష్టమో
  choice: ‘నాశనం చేయాలో’ అని అనువదించడం
  alternative: ‘చంపాలో’ లేదా ‘మరణానికి గురిచేయాలో’
  rationale: తక్షణ సందర్భం ప్రాణాంతక కుట్రను సూచిస్తుంది. అయినా గ్రీకు క్రియకు ‘నాశనం చేయు’ అనే విస్తృత భావం కూడా ఉంది. అందువల్ల ప్రధాన పాఠ్యం ఆ విస్తృతిని నిలుపుతూ, సందర్భానుగుణమైన స్పష్టమైన ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని రెండు కారణసూచక సంబంధాలను తెలుగులో సహజంగా ఒక కారణ నిర్మాణంగా అమర్చాం; జనసమూహపు ఆశ్చర్యమే నాయకుల భయానికి కారణమనే సంబంధం నిలిచింది.
