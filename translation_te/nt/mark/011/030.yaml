  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου ἐξ οὐρανοῦ ἦν ἢ ἐξ ἀνθρώπων; ἀποκρίθητέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/030.yaml
  text: Was John's baptism from heaven or from men? Answer me[a][b].
translation:
  language: te
  text: యోహాను బాప్తిస్మం పరలోకం నుండి వచ్చిందా[a], లేక మనుషుల నుండి వచ్చిందా[b]? నాకు జవాబు చెప్పండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని నుండి’ అని అనువదించవచ్చు. గ్రీకు మూలంలో ‘పరలోకం నుండి’ అని ఉంది; ఇది దైవిక మూలాన్ని లేదా అధికారాన్ని సూచించే యూదుల నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: ‘మనుషుల నుండి’ అంటే మానవుల మూలం లేదా అధికారం నుండి అని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ βάπτισμα τὸ Ἰωάννου
  choice: యోహాను ఇచ్చిన బాప్తిస్మం
  rationale: ఇది యోహానుతో సంబంధమున్న బాప్తిస్మాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది. ‘యోహాను బాప్తిస్మం’ కంటే, ఆయన నిర్వహించిన బాప్తిస్మం అనే భావాన్ని ఇది సులభంగా అందిస్తుంది.
- source_word: ἐξ οὐρανοῦ
  choice: పరలోకం నుండి
  rationale: మూలంలోని ‘ఆకాశం/పరలోకం నుండి’ అనే యూదుల భక్తిపూర్వక నుడికారాన్ని వ్యాఖ్యానించి ‘దేవుని నుండి’ అని మార్చకుండా నిలుపుతుంది; ఇక్కడ దైవిక మూలం లేదా అధికారం సూచితం.
- source_word: ἐξ ἀνθρώπων
  choice: మనుషుల నుండి
  rationale: ἀνθρώπων ఇక్కడ లింగభేదం లేకుండా మానవులను సూచిస్తుంది. ‘పరలోకం నుండి’ అనే పదబంధానికి ఎదురుగా, కేవలం మానవ మూలం లేదా అధికారం అనే భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἀποκρίθητέ μοι
  choice: నాకు జవాబు చెప్పండి
  rationale: ఆజ్ఞలోని ప్రత్యక్షమైన డిమాండును గౌరవసూచక బహువచనంతో సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἦν ἢ
  choice: వచ్చిందా ... వచ్చిందా?
  rationale: గ్రీకులో ‘ఉండెనా’ అనే రూపం ఉన్నప్పటికీ, తెలుగులో మూలం లేదా అధికారాన్ని అడిగేటప్పుడు ‘నుండి వచ్చిందా?’ అనడం సహజంగా, స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: ‘పరలోకం నుండి’ అనే మాటకు అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘పరలోకం నుండి’ అనే నుడికారాన్ని నిలుపుతూ, దైవిక మూలం లేదా అధికారాన్ని పాదసూచికలో వివరణ ఇవ్వడం.
  alternative: దేవుని నుండి
  rationale: మూలంలోని యూదుల భక్తిపూర్వక నుడికారాన్ని యథాతథంగా ఉంచడం వల్ల యేసు ప్రశ్నలోని వాక్చాతుర్యమూ దైవిక సూచనమూ నిలుస్తాయి; పాఠ్యంలోనే వ్యాఖ్యానాన్ని కలపడం తప్పుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం. మూలంలోని పరలోక–మానవ విరోధాన్ని స్పష్టంగా నిలిపింది.
