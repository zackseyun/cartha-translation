  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες ⸂τῷ Ἰησοῦ λέγουσιν⸃· Οὐκ οἴδαμεν. καὶ ὁ ⸀Ἰησοῦς λέγει αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/033.yaml
  text: And answering Jesus[a], they say, “We do not know.” And Jesus says to them, “Neither do I tell you by what authority I do these things.”
translation:
  language: te
  text: 'వారు యేసుతో, “మాకు తెలియదు” అని జవాబిచ్చారు. యేసు వారితో, “నేనూ ఏ అధికారంతో[a] ఇవి చేస్తున్నానో మీకు చెప్పను” అన్నాడు.


    [a] లేదా “ఏ అధికారాన్ని బట్టి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఏ అధికారాన్ని బట్టి.”
    reason: ἐν ποίᾳ ἐξουσίᾳ అనే పదబంధంలో అధికారం ఏ ఆధారంపై ఉందనే సమీప భావాన్ని చూపే ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: జవాబిస్తూ
  rationale: ప్రధాన క్రియతో అనుసంధానమైన గ్రీకు కృదంత భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: λέγουσιν / λέγει / λέγω
  choice: అన్నారు / అన్నాడు / చెప్పను
  rationale: తెలుగు కథన శైలిలో భూతకాల రూపాలు సహజంగా ఉంటాయి; చివరి పరోక్ష ప్రశ్న ముందు ‘చెప్పను’ అనేది λέγω భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Οὐκ οἴδαμεν
  choice: మాకు తెలియదు
  rationale: తెలుగులో తెలియకపోవడాన్ని సహజంగా, నేరుగా తెలిపే రూపం.
- source_word: Οὐδὲ ἐγὼ
  choice: నేనూ … చెప్పను
  rationale: వారి నిరాకరణకు సమాంతరంగా యేసు ఇచ్చిన ‘నేనూ కాదు’ అనే ప్రతిస్పందనను -ఊ మరియు నిషేధ క్రియ ద్వారా నిలుపుతుంది.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: ఏ అధికారంతో
  rationale: యేసు కార్యాలకు ఆధారమైన అధికారం లేదా హక్కును తెలుగులో సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ταῦτα
  choice: ఇవి
  rationale: దేవాలయంలో యేసు చేసిన ఇటీవలి కార్యాలను సూచించే గ్రీకు నపుంసక బహువచనాన్ని నిలుపుతుంది.
- source_word: ποιῶ
  choice: చేస్తున్నానో
  rationale: సందర్భంలో కొనసాగుతున్న లేదా ప్రస్తుత కార్యాచరణ భావాన్ని తెలుగు పరోక్ష ప్రశ్న నిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. గ్రీకు చారిత్రక వర్తమానాన్ని యాంత్రికంగా అనుసరించకుండా సహజ తెలుగు కథన భూతకాలాన్ని వాడింది; అయితే సంభాషణలోని సమాంతర నిషేధాన్ని నిలిపింది.
