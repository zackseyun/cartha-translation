review_pass:
  verdict: revise
  source_fidelity: The conditional contrast and the two occurrences of ἀφίημι are accurately represented. ‘అపరాధాలు’ is a suitable rendering of παραπτώματα. The Greek plural τοῖς οὐρανοῖς is idiomatic in this designation of God; rendering it with Telugu plural ‘పరలోకాల్లో’ is overly literal and less natural in modern standard Telugu.
  naturalness: The sentence is otherwise clear and appropriately direct. ‘పరలోకంలో ఉన్న’ is the normal, natural Telugu idiom for ‘who is in heaven’ in this context and does not introduce a theological change.
  terminology: ‘క్షమించు’ consistently renders ἀφίημι well here, and ‘అపరాధాలు’ preserves the distinct sense of παραπτώματα without unnecessarily substituting the broader ‘పాపాలు.’ The textual-critical footnote is accurate, cautiously worded, and correctly anchored.
  issues:
  - severity: low
    issue: ‘పరలోకాల్లో ఉన్న’ is an unnaturally literal plural expression in Telugu.
    rationale: Although the Greek has a plural form (‘in the heavens’), this is a conventional Semitic/Greek idiom. Modern standard Telugu normally uses singular ‘పరలోకంలో’ for this divine designation; retaining a literal plural can sound as though several distinct paradises are intended.
  revised_text: అయితే[a] మీరు క్షమించకపోతే, పరలోకంలో ఉన్న మీ తండ్రి కూడా మీ అపరాధాలను క్షమించడు.
