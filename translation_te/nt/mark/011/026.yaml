source:
  edition: robinson-pierpont-2005-byzantine
  text: Εἰ δὲ ὑμεῖς οὐκ ἀφίετε, οὐδὲ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφήσει τὰ παραπτώματα ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/026.yaml
  text: But[a] if you do not forgive, neither will your Father who is in heaven forgive your trespasses.
translation:
  language: te
  text: అయితే[a] మీరు క్షమించకపోతే, పరలోకంలో ఉన్న మీ తండ్రి కూడా మీ అపరాధాలను క్షమించడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనం అత్యంత ప్రాచీన గ్రీకు ప్రతుల్లో—నాలుగో శతాబ్దానికి చెందిన సీనాయిటికస్, వాటికానస్ ప్రతులతో సహా—మరియు ప్రాచీన కాప్టిక్ అనువాదాల్లో లేదు. అయితే బైజాంటైన్ అధికసంఖ్యాక ప్రతుల సంప్రదాయంలో, లాటిన్ సంప్రదాయంలో, సిరియాక్ ప్రతుల్లో చాలావాటిలో ఉంది. మత్తయి 6:15లోని యేసు మాటలకు అనుగుణంగా ఉండేలా తరువాతి నకలుదారులు దీన్ని చేర్చి ఉండవచ్చు.
    reason: textual_critical
lexical_decisions:
- source_word: ἀφίημι
  choice: క్షమించు
  rationale: వ్యక్తుల మధ్య అపరాధాలనూ దేవుని క్షమాపణనూ సూచించే ఈ సందర్భంలో, నైతిక బాధ్యత నుంచి విడిచిపెట్టడం అనే భావాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: παράπτωμα
  choice: అపరాధాలు
  rationale: సరైన మార్గం నుంచి తప్పిపోవడం లేదా హద్దు మీరడం అనే మూలభావాన్ని తెలియజేస్తూ, సాధారణ ‘పాపాలు’ కంటే మూలపదానికి ఉన్న ప్రత్యేక ఛాయను నిలుపుతుంది.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: పరలోకాల్లో ఉన్న
  rationale: గ్రీకులోని బహువచన రూపాన్ని సాధ్యమైనంతగా నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో అర్థమయ్యే విధంగా అనువదిస్తుంది.
theological_decisions:
- issue: మానవ క్షమాపణకు, తండ్రి క్షమాపణకు మధ్య ఉన్న షరతుతో కూడిన సంబంధం
  choice: ‘మీరు క్షమించకపోతే ... మీ తండ్రి కూడా ... క్షమించడు’ అని మూలంలోని ప్రత్యక్ష సంబంధాన్ని యథాతథంగా ఉంచడం
  alternative: దీనిని కేవలం నిజమైన విశ్వాసానికి సూచనగా లేదా కృప పొందడానికి కారణంగా వివరణాత్మకంగా మలచడం
  rationale: వాక్యంలో ఉన్న ధార్మిక ఉద్రిక్తతను ఏ ప్రత్యేక సిద్ధాంతం ప్రకారం పరిష్కరించకుండా, గ్రీకు వాక్య నిర్మాణాన్ని నేరుగా ప్రతిబింబిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘అయితే’ ప్రతికూల షరతును ముందరి సందర్భంతో అనుసంధానిస్తుంది; ‘కూడా’ οὐδέ లోని సమాంతర నిరాకరణ భావాన్ని తెలియజేస్తుంది.
