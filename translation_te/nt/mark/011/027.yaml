id: MRK.11.27
reference: Mark 11:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται πάλιν εἰς Ἱεροσόλυμα. καὶ ἐν τῷ ἱερῷ περιπατοῦντος αὐτοῦ ἔρχονται πρὸς αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/027.yaml
  text: And they came again to Jerusalem. And as he was walking in the temple courts[a], the chief priests and the scribes and the elders came to him.
translation:
  language: te
  text: వారు మళ్లీ యెరూషలేముకు వచ్చారు. ఆయన దేవాలయ ప్రాంగణంలో[a] నడుస్తుండగా, ప్రధాన యాజకులు, శాస్త్రులు, పెద్దలు ఆయన దగ్గరికి వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవాలయంలో,” “దేవాలయ ఆవరణలో”; గ్రీకు పదం ప్రత్యేకంగా అంతర్గర్భాలయాన్ని కాకుండా విస్తృత దేవాలయ సముదాయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: వచ్చారు
  rationale: గ్రీకులో ఇది కథన వర్తమాన కాలమైనప్పటికీ, సహజమైన తెలుగు కథనశైలిలో భూతకాల రూపం సందర్భానుకూలం.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: యెరూషలేముకు మరొకసారి రావడాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: Ἱεροσόλυμα
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన ప్రదేశనామ రూపం.
- source_word: ἐν τῷ ἱερῷ
  choice: దేవాలయ ప్రాంగణంలో
  rationale: ἱερόν అంతర్గర్భాలయాన్ని మాత్రమే కాకుండా విస్తృత దేవాలయ సముదాయాన్ని సూచిస్తుంది; ‘ప్రాంగణం’ ప్రజలు సంచరించే స్థలాన్ని స్పష్టం చేస్తుంది.
- source_word: περιπατοῦντος αὐτοῦ
  choice: ఆయన ... నడుస్తుండగా
  rationale: జెనిటివ్ అబ్సల్యూట్ తెలిపే కొనసాగుతున్న నేపథ్య చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: బహువచనంలో ఇది ప్రముఖ యాజక అధికారులను సూచిస్తుంది.
- source_word: γραμματεῖς
  choice: శాస్త్రులు
  rationale: యూదుల ధర్మశాస్త్ర సంబంధిత లేఖకులు, పండితులు అనే చారిత్రక పదవిని నేరుగా సూచించే స్థిరమైన తెలుగు పదం.
- source_word: πρεσβύτεροι
  choice: పెద్దలు
  rationale: ఇక్కడ కేవలం వృద్ధులను కాకుండా గుర్తింపు పొందిన సమాజ నాయకులను సూచిస్తుంది.
- source_word: πρὸς αὐτόν
  choice: ఆయన దగ్గరికి
  rationale: యేసు వైపు వచ్చి చేరడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ἱερόν యొక్క స్థలార్థ అనువాదం
  choice: దేవాలయ ప్రాంగణంలో
  alternative: దేవాలయంలో; దేవాలయ ఆవరణలో
  rationale: అంతర్గర్భాలయం అనే భావం రాకుండా, ప్రజలకు అందుబాటులో ఉన్న విస్తృత దేవాలయ సముదాయాన్ని సూచిస్తుంది. ఇది సిద్ధాంతపరమైన నిర్ణయం కంటే స్థలార్థానికి సంబంధించిన నిర్ణయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన భూతకాలాన్ని ఉపయోగిస్తూ, గౌరవప్రదమైన ‘ఆయన’ రూపాన్ని నిలిపాం. ‘ప్రధాన యాజకులు, శాస్త్రులు, పెద్దలు’ అనే పదాలు చారిత్రక సంస్థాగత పాత్రలను సంక్షిప్తంగా, సంప్రదాయానికి అనుగుణంగా తెలియజేస్తాయి.
