source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτῇ· Μηκέτι ⸂εἰς τὸν αἰῶνα ἐκ σοῦ⸃ μηδεὶς καρπὸν φάγοι. καὶ ἤκουον οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/014.yaml
  text: And answering[a], he said to it[c][b], “May no one ever eat fruit from you again.” And his disciples were listening.
translation:
  language: te
  text: ఆయన దానికి జవాబుగా, “ఇక ఎన్నటికీ నీ నుండి ఎవరూ పండు తినకపోవుగాక!” అని అన్నాడు.[a] ఆయన శిష్యులు వింటూ ఉన్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇకపై నీ నుండి ఎవరూ ఎప్పటికీ పండు తినకపోవుగాక!” గ్రీకులో అక్షరార్థంగా, ‘యుగంలోనికి’; ఇక్కడ ఇది నిరవధిక భావాన్ని తెలియజేసే ప్రయోగం.
    reason: alternative_reading
  - marker: b
    text: గ్రీకు ఇంపర్ఫెక్ట్‌ను “విన్నారు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: జవాబుగా
  rationale: ముందుగా పలికిన మాట ఏదీ లేకపోయినా, గ్రీకులో ఇది సాధారణ కథన ప్రయోగం. ‘జవాబుగా’ అనే రూపం ఆ ప్రయోగాన్ని తొలగించకుండా సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: αὐτῇ
  choice: దానికి
  rationale: గ్రీకులో ‘అంజూరపు చెట్టు’ వ్యాకరణపరంగా స్త్రీలింగమైనందున సర్వనామం స్త్రీలింగంలో ఉంది; తెలుగులో చెట్టును సూచించడానికి సహజంగా ‘దానికి’ వాడబడుతుంది.
- source_word: Μηκέτι … εἰς τὸν αἰῶνα
  choice: ఇక ఎన్నటికీ
  rationale: μηκέτι లోని ‘ఇకపై కాదు’ అనే భావాన్ని, εἰς τὸν αἰῶνα లోని నిరవధిక బలాన్ని కలిపి సహజంగా, గట్టిగా వ్యక్తం చేస్తుంది.
- source_word: ἐκ σοῦ
  choice: నీ నుండి
  rationale: చెట్టును నేరుగా ద్వితీయ పురుషంలో సంబోధిస్తున్న గ్రీకు రూపంలోని సజీవతను నిలుపుతుంది.
- source_word: μηδεὶς καρπὸν φάγοι
  choice: ఎవరూ పండు తినకపోవుగాక
  rationale: φάγοι అనే ఆశీర్వచనాత్మక/శాపోక్తి భావమున్న ఆప్టేటివ్‌ను భవిష్యద్వాక్యంగా మార్చకుండా, కోరిక లేదా తీర్పు ప్రకటనగా నిలుపుతుంది.
- source_word: ἤκουον
  choice: విన్నారు
  rationale: గ్రీకు ఇంపర్ఫెక్ట్ సందర్భానుసారంగా ‘వింటూ ఉన్నారు’ లేదా ‘విన్నారు’ అని అర్థమవుతుంది. ప్రధాన పాఠ్యంలో సహజమైన ‘విన్నారు’ను ఉంచి, కొనసాగుతున్న చర్య భావాన్ని పాదటిప్పణిలో సూచించాం.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ఆయన శిష్యులు
  rationale: స్వామ్య సంబంధాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: అంజూరపు చెట్టుపై యేసు పలికిన మాట స్వభావం
  choice: ‘ఎవరూ పండు తినకపోవుగాక’ అనే శాపోక్తి/తీర్పు కోరికగా అనువదించడం
  alternative: ‘ఇక ఎవరూ నీ పండు తినరు’ అనే సరళ భవిష్యద్వాక్యంగా అనువదించడం
  rationale: φάγοι భవిష్యత్ సూచక క్రియ కాదు; ఆప్టేటివ్ రూపం కోరిక లేదా శాపోక్తి బలాన్ని కలిగి ఉంది. అందువల్ల అది కేవలం ముందస్తు అంచనాగా కాక తీర్పు ప్రకటనగా వినిపించాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కథన గంభీరతను మరియు గ్రీకు ఆప్టేటివ్‌లోని శాపోక్తి బలాన్ని కాపాడే శైలి. ‘జవాబుగా’ అనే ప్రయోగం మూలంలోని స్వల్ప అసాధారణతను ఉద్దేశపూర్వకంగా నిలుపుతుంది.
