id: MRK.11.31
reference: Mark 11:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀διελογίζοντο πρὸς ἑαυτοὺς λέγοντες· ⸂Τί εἴπωμεν;⸃ ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί ⸀οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/031.yaml
  text: And they were reasoning among themselves[a], saying, “What should we say? If we say, ‘From heaven,’ he will say, ‘Why then did you not believe him?’”
translation:
  language: te
  text: 'వారు తమలో తాము ఇలా తర్కించుకున్నారు: “మనం ఏమని చెప్పాలి? ‘పరలోకం నుండి[a]’ అని చెబితే, ఆయన, ‘అయితే మీరు అతన్ని ఎందుకు నమ్మలేదు?’ అంటాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పరలోకం నుండి” అనేది “దేవుని నుండి” లేదా “దైవిక మూలం గలది” అని చెప్పే యూదుల గౌరవసూచకమైన మాటతీరు.
    reason: cultural_note
lexical_decisions:
- source_word: διελογίζοντο
  choice: ఆలోచించుకుంటూ
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న తర్క deliberationను సూచిస్తుంది; మధ్యమ భావంతో కలిసి ‘ఆలోచించుకుంటూ’ సహజంగా ఆ అంతర్గత సంప్రదింపును తెలియజేస్తుంది.
- source_word: πρὸς ἑαυτοὺς
  choice: తమలో తాము
  rationale: ఇది వ్యక్తిగత మౌనచింతనే కాక, సమూహంలోని పరస్పర సంప్రదింపును సూచిస్తుంది; తెలుగులో ఈ ప్రయోగం రెండింటినీ సహజంగా మోస్తుంది.
- source_word: Τί εἴπωμεν;
  choice: మనం ఏమని చెప్పాలి?
  rationale: ఆలోచనాత్మక aorist subjunctiveలోని ‘ఏ సమాధానం ఇవ్వాలి?’ అనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: Ἐξ οὐρανοῦ
  choice: పరలోకం నుండి
  rationale: మూలంలోని ‘ఆకాశం/పరలోకం నుండి’ అనే యూదుల గౌరవోక్తిని ప్రత్యక్షంగా నిలుపుతూ, దైవిక మూలం అనే భావాన్ని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: ἐρεῖ
  choice: అని ఆయన అడుగుతాడు
  rationale: λέγω అక్షరార్థంగా ‘చెబుతాడు’ అయినా, తరువాతి ప్రత్యక్ష వాక్యం ప్రశ్న కావడంతో తెలుగులో ‘అడుగుతాడు’ సహజమైన సందర్భానుగుణ రూపం.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: మీరు అతన్ని ఎందుకు నమ్మలేదు?
  rationale: πιστεύω దత్తివిభక్తితో ఇక్కడ అతని సాక్ష్యాన్ని నిజమని అంగీకరించడం; ‘అతన్ని నమ్మడం’ ఈ అర్థాన్ని ‘అతనిలో విశ్వాసముంచడం’ కంటే కచ్చితంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యోహాను బాప్తిస్మం/అధికారం విషయంలో ‘Ἐξ οὐρανοῦ’ అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘పరలోకం నుండి’ అనే గౌరవోక్తిని నిలుపడం
  alternative: ‘దేవుని నుండి’ అని స్పష్టీకరించడం
  rationale: ఈ యూదీయ గౌరవోక్తి దైవిక మూలం లేదా అధికారాన్ని సూచిస్తుంది. మూలరూపాన్ని నిలపడం వాక్యంలోని సాంస్కృతిక స్వరాన్నీ వాదనలోని ఉద్వేగాన్నీ కాపాడుతుంది; అర్థాన్ని పాదటిప్పణి వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి. ‘తమలో తాము ఆలోచించుకుంటూ’ కొనసాగుతున్న పరస్పర సంప్రదింపును చూపుతుంది; ‘పరలోకం నుండి’ మూలంలోని గౌరవోక్తిని నిలుపుతుంది.
