  source_fidelity: మూల గ్రీకు వాక్యంలోని కొనసాగుతున్న పరస్పర ఆలోచన/చర్చ (διελογίζοντο πρὸς ἑαυτούς), ఆలోచనాత్మక ప్రశ్న, షరతు, అలాగే యోహానును నమ్మకపోవడంపై ఊహించిన ప్రశ్న—అన్నీ ముసాయిదాలో ప్రధానంగా సరిగానే ఉన్నాయి. అయితే ἐρεῖ అక్షరార్థంగా ‘అంటాడు/చెబుతాడు’; దానిని ‘అడుగుతాడు’గా మార్చడం సందర్భానుకూలమైనా మూలంలోని చెప్పడం అనే క్రియను అవసరం లేకుండా నిర్దిష్టం చేస్తుంది.
  naturalness: ‘ఆలోచించుకుంటూ ... అనుకున్నారు’ అనే నిర్మాణం ఒకే చర్యను పునరుక్తి చేస్తూ కొద్దిగా భారంగా ఉంది. ‘తమలో తాము ఇలా తర్కించుకున్నారు’ అనేది పరస్పర deliberationను స్పష్టంగా, సహజంగా తెలియజేస్తుంది. ప్రత్యక్ష ప్రశ్నను ‘అంటాడు’తో ప్రవేశపెట్టడం ఆధునిక ప్రామాణిక తెలుగులో సులభంగా ఉంటుంది.
  terminology: ‘పరలోకం నుండి’ మూలంలోని Ἐξ οὐρανοῦ అనే గౌరవసూచక ప్రయోగాన్ని నిలుపుతుంది. పాదటిప్పణిలో దీనిని దేవుని నుండి/దైవిక మూలం అనే భావంతో వివరించడం సముచితం. ‘అతన్ని నమ్మలేదు’ πιστεύω + dative యొక్క సందర్భోచిత అర్థాన్ని బాగా అందిస్తుంది.
