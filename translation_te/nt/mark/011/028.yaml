source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγον αὐτῷ· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; ⸀ἢ τίς σοι ⸂ἔδωκεν τὴν ἐξουσίαν ταύτην⸃ ἵνα ταῦτα ποιῇς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/028.yaml
  text: And they were saying to him[b][a], “By what authority are you doing these things? Or who gave you this authority to do these things?”
translation:
  language: te
  text: 'వారు ఆయనతో ఇలా అడుగుతూ ఉన్నారు: “నీవు ఏ అధికారంతో[a] ఇవి చేస్తున్నావు? లేదా ఇవి చేయడానికి[b] ఈ అధికారాన్ని నీకు ఎవరు ఇచ్చారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “ఏ అధికారంలో.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఇవి చేయునట్లు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: అడుగుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న మాటను సూచిస్తుంది. సందర్భంలో ఆ మాట ప్రశ్నల రూపంలో ఉన్నందున సహజమైన తెలుగులో ‘అడుగుతూ ఉన్నారు’ అని ఇచ్చాం.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: ఏ అధికారంతో
  rationale: ἐν + చతుర్థీ విభక్తి ఇక్కడ కార్యానికి ఆధారమైన అధికారం లేదా హక్కును ప్రశ్నిస్తుంది; ‘ఏ అధికారంతో’ సహజంగా, మూల భావానికి దగ్గరగా ఉంది.
- source_word: ἐξουσίᾳ / ἐξουσίαν
  choice: అధికారం
  rationale: ఈ సందర్భంలో ἐξουσία అనేది శక్తికన్నా చట్టబద్ధమైన హక్కు, అనుమతి లేదా అధికార పరిధిని సూచిస్తుంది.
- source_word: ταῦτα ποιεῖς / ἵνα ταῦτα ποιῇς
  choice: ఇవి చేస్తున్నావు / ఇవి చేయడానికి
  rationale: బహువచనమైన ταῦταను ‘ఇవి’గా నిలిపి, వర్తమాన క్రియను మరియు ἵνα ఉద్దేశార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: ἢ
  choice: లేదా
  rationale: రెండవ ప్రశ్న మొదటి ప్రశ్నను మరో విధంగా ఉంచుతున్న ప్రత్యామ్నాయ ప్రశ్న కావడంతో ‘లేదా’ సరిపోతుంది.
- source_word: τίς σοι ἔδωκεν
  choice: నీకు ఎవరు ఇచ్చారు
  rationale: అనిశ్చిత భూతకాల క్రియను సహజమైన సాధారణ భూతకాల ప్రశ్నగా అనువదించాం.
theological_decisions:
- issue: యేసు అధికారానికి మూలం
  choice: నాయకుల ప్రశ్నను తటస్థమైన అధికార సవాలుగానే ఉంచడం
  alternative: సందర్భాన్ని వివరిస్తూ ‘దైవిక అధికారం’ అని స్పష్టంగా చేర్చడం
  rationale: ఈ వచనంలో ప్రశ్న మాత్రమే ఉంది; సమాధానాన్ని లేదా అధికార మూలాన్ని అనువాదమే ముందుగా నిర్ణయించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; నేరుగా సంభాషించే సందర్భానికి తగిన ఏకవచన ‘నువ్వు’ వాడబడింది. భాష సహజంగా ఉండేందుకు ‘అన్నారు’ బదులు ప్రశ్నల స్వభావాన్ని తెలిపే ‘అడుగుతూ ఉన్నారు’ ఎంచుకున్నాం.
