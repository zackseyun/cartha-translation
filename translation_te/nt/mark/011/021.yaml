  yaml_path: translation/nt/mark/011/021.yaml
  text: And Peter[a], remembering, says to him, “Rabbi, look—the fig tree that you cursed has withered.”
translation:
  language: te
  text: పేతురు గుర్తుచేసుకొని ఆయనతో, “రబ్బీ, చూడు! నీవు శపించిన అంజూరపు చెట్టు ఎండిపోయింది[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
