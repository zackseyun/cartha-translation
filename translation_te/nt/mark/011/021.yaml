    text: లేదా “వాడిపోయింది.” గ్రీకు క్రియ ఎండిపోవడం లేదా వాడిపోవడం అనే రెండు భావాలనూ సూచించగలదు; దాని సంపూర్ణ కాలరూపం ప్రస్తుతం కొనసాగుతున్న ఫలితాన్ని నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναμνησθεὶς
  choice: గుర్తుచేసుకొని
  rationale: గతంలో జరిగిన విషయాన్ని జ్ఞాపకం చేసుకొని మాట్లాడాడనే కృదంత భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో మార్కు శైలికి సాధారణమైన చారిత్రక వర్తమాన కాలం ఉంది. తెలుగు కథనంలో వర్తమాన రూపం కృత్రిమంగా ఉండే అవకాశం ఉన్నందున సహజమైన భూతకాల రూపాన్ని ఉపయోగించాం.
- source_word: αὐτῷ
  choice: ఆయనతో
  rationale: మూలంలోని సర్వనామాన్ని నిలుపుతూ, సందర్భంలో యేసును గౌరవప్రదంగా సూచించే సహజ తెలుగు రూపం.
- source_word: Ῥαββί
  choice: రబ్బీ
  rationale: గ్రీకు పాఠంలో లిప్యంతరీకరించిన యూదు సంబోధనను అలాగే ఉంచి చారిత్రక-యూదు నేపథ్యాన్ని కాపాడుతుంది.
- source_word: ἴδε
  choice: చూడు
  rationale: దృష్టిని ఆకర్షించే ఏకవచన ఆజ్ఞారూపానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: συκῆ
  choice: అంజూరపు చెట్టు
  rationale: సందర్భంలో పండును కాక చెట్టును సూచిస్తుంది; ‘అంజూరపు చెట్టు’ ప్రామాణికమైన, స్పష్టమైన తెలుగు పదబంధం.
- source_word: κατηράσω
  choice: నీవు శపించిన
  rationale: యేసు గతంలో చేసిన చర్యను సూచించే ద్వితీయ పురుష ఏకవచన భూతార్థాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ἐξήρανται
  choice: ఎండిపోయింది
  rationale: చెట్టు ఎండిపోవడం లేదా వాడిపోవడం అనే భావాన్నీ, సంపూర్ణ కాలం సూచించే ప్రస్తుతం కనిపిస్తున్న ఫలితాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
