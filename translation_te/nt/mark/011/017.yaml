source:
  edition: SBLGNT
  text: καὶ ἐδίδασκεν ⸂καὶ ἔλεγεν⸃ ⸀αὐτοῖς· Οὐ γέγραπται ὅτι Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται πᾶσιν τοῖς ἔθνεσιν; ὑμεῖς δὲ ⸀πεποιήκατε αὐτὸν σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/017.yaml
  text: And he was teaching and saying to them[a], “Is it not written[b], ‘My house will be called a house of prayer for all the nations’? But you have made it a den of robbers.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా బోధిస్తూ చెప్పాడు: “నా మందిరం అన్ని జనాంగాలకు ప్రార్థనా మందిరం అని పిలువబడుతుంది అని రాయబడలేదా?[a] కానీ మీరు దాన్ని దొంగల గుహగా చేసేశారు.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అన్ని జనాంగాలకు” అని ఉన్న చోట “అందరి ప్రజల కొరకు” అని కూడా అనువదించవచ్చు. గ్రీకులో “అన్ని జనాంగాలకు” అని ఉంది; ఇది యెషయా 56:7ను ప్రతిధ్వనింపజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “దొంగల గుహ” అనే మాట యిర్మీయా 7:11ను ప్రతిధ్వనింపజేస్తుంది. “దొంగలు” అని అనువదించిన గ్రీకు పదానికి కొన్ని సందర్భాల్లో “బందిపోట్లు” లేదా “దోపిడీదారులు” అనే అర్థం కూడా ఉంటుంది.
    reason: cross_reference
lexical_decisions:
- source_word: ἐδίδασκεν καὶ ἔλεγεν
  choice: బోధిస్తూ ఇలా అన్నాడు
  rationale: రెండు అసంపూర్ణ క్రియల కొనసాగుతున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; బోధనతో కూడిన పలుకును సూచిస్తుంది.
- source_word: Οὐ γέγραπται
  choice: అని రాసి లేదా?
  rationale: లేఖనాధికారాన్ని ఉద్దేశించే గ్రీకు సంపూర్ణ కర్మణి సూత్రాన్ని సహజమైన ప్రశ్నారూపంలో నిలుపుతుంది.
- source_word: Ὁ οἶκός μου
  choice: నా మందిరం
  rationale: సందర్భంలో దేవాలయాన్ని సూచించే οἶκος భావాన్ని సాధారణ తెలుగు పాఠకునికి స్పష్టంగా తెలియజేస్తూ పవిత్ర స్థల భావాన్ని కాపాడుతుంది.
- source_word: οἶκος προσευχῆς
  choice: ప్రార్థన మందిరం
  rationale: గ్రీకు సంబంధ నిర్మాణాన్ని సంక్షిప్తమైన, సహజమైన తెలుగు పదబంధంగా అందిస్తుంది.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: సమస్త జనాలకు
  rationale: యెషయా 56:7లోని విశ్వవ్యాప్త పరిధిని తెలియజేస్తుంది; ἔθνη ఇక్కడ జాతులు లేదా ప్రజలు అనే రెండు సమీప భావాలకు వీలు ఇస్తుంది.
- source_word: πεποιήκατε
  choice: చేసేశారు
  rationale: మునుపటి చర్య వల్ల ఏర్పడిన ప్రస్తుత స్థితిని గ్రీకు సంపూర్ణ కాలానికి తగిన బలంతో సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: σπήλαιον λῃστῶν
  choice: దోపిడీదారుల గుహ
  rationale: యిర్మీయా 7:11 ప్రతిధ్వనిని కాపాడుతుంది; λῃστήςకు దొంగ, బందిపోటు అనే విస్తృత ఛాయలు ఉన్నా రాజకీయ అర్థాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: ప్రవచన ఉల్లేఖనంలోని విశ్వవ్యాప్త పరిధి
  choice: సమస్త జనాలకు
  alternative: అన్ని జనాంగాలకు
  rationale: దేవుని మందిర ఉద్దేశం ఇశ్రాయేలుకు అతీతంగా విస్తరించిందనే యెషయా వాక్య భావాన్ని కాపాడుతూ, నిర్దిష్టమైన తరువాతి సిద్ధాంత వ్యవస్థను పాఠ్యంలోకి చేర్చదు.
- issue: λῃστῶν అనే ఆరోపణ బలం
  choice: దోపిడీదారులు
  alternative: బందిపోట్లు
  rationale: యిర్మీయా 7:11తో ఉన్న సంబంధాన్ని నిలుపుతూ, ఈ సందర్భం తప్పనిసరిగా సూచించని తిరుగుబాటు లేదా రాజకీయ భావాన్ని చొప్పించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. ప్రవచన ఉల్లేఖనపు గంభీరతను నిలుపుతూ, సామాన్య పాఠకునికి అర్థమయ్యే పదాలను ఎంచుకున్నాం.
