id: MRK.11.2
reference: Mark 11:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν κώμην τὴν κατέναντι ὑμῶν, καὶ ⸀εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν εὑρήσετε πῶλον δεδεμένον ἐφ’ ὃν οὐδεὶς ⸀οὔπω ἀνθρώπων ⸀ἐκάθισεν· ⸂λύσατε αὐτὸν καὶ φέρετε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/002.yaml
  text: And he says to them[a], “Go into the village opposite you, and as soon as you enter it, you will find a colt tied there, on which no one has yet sat[b]. Untie it and bring it.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “మీ ఎదురుగా ఉన్న గ్రామంలోకి వెళ్లండి. మీరు అందులోకి ప్రవేశించిన వెంటనే, ఇంతవరకు ఏ మనిషీ ఎక్కని[a] ఒక గాడిదపిల్లను[b] కట్టివేయబడి ఉండగా మీరు కనుగొంటారు. దానిని విప్పి తీసుకురండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా, “దానిమీద ఇంతవరకు మనుష్యులలో ఎవరూ కూర్చోలేదు.” ఈ మాట జంతువును ఇంతవరకు ఏ మానవుడూ స్వారీ చేయలేదని స్పష్టంగా తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు πῶλον పదం యువ జంతువును సూచించగలదు; ఈ సందర్భంలో అది గాడిదపిల్లను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπάγετε
  choice: వెళ్లండి
  rationale: కదలికను సూచించే ఆజ్ఞార్థక క్రియకు ఇది సహజమైన, స్పష్టమైన ఆధునిక తెలుగు రూపం.
- source_word: κώμην τὴν κατέναντι ὑμῶν
  choice: మీ ఎదురుగా ఉన్న గ్రామం
  rationale: κώμην ను ‘గ్రామం’గా, κατέναντι ను ప్రస్తుత స్థానం నుంచి ఎదురుగా ఉన్నదనే భావంతో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν
  choice: మీరు దానిలో ప్రవేశించగానే
  rationale: εὐθύς యొక్క తక్షణ కాలసంబంధ భావాన్ని, గ్రీకు కృదంత నిర్మాణాన్ని సహజ తెలుగు ఉపవాక్యంగా అందిస్తుంది.
- source_word: εὑρήσετε
  choice: మీకు కనిపిస్తుంది
  rationale: ‘కనుగొంటారు’ అనే మూల భావాన్ని ఈ దృశ్య సందర్భంలో సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: πῶλον
  choice: గాడిద పిల్ల
  rationale: πῶλος సాధారణంగా చిన్న వాహన జంతువును సూచించగలిగినా, యేసు స్వారీ చేసే ఈ సందర్భంలో గాడిద పిల్లను సూచిస్తుంది; తెలుగులో ‘కోడె’ కంటే ఇది స్పష్టంగా ఉంటుంది.
- source_word: δεδεμένον
  choice: కట్టి ఉండడం
  rationale: పరిపూర్ణ కర్మణి కృదంతం జంతువు కట్టివేయబడిన స్థితిలో ఉందని సూచిస్తుంది.
- source_word: οὐδεὶς οὔπω ἀνθρώπων ἐκάθισεν
  choice: ఇంతవరకు ఏ మనిషీ ఎక్కని
  rationale: ἀνθρώπων లోని మానవ సూచనను నిలుపుతూ, జంతువుపై కూర్చోవడాన్ని తెలుగులో సహజంగా ‘ఎక్కడం’గా వ్యక్తపరుస్తుంది; οὔπω ను ‘ఇంతవరకు’గా అందిస్తుంది.
- source_word: λύσατε αὐτὸν καὶ φέρετε
  choice: దాన్ని విప్పి తీసుకురండి
  rationale: కట్టిన జంతువును విడదీయడాన్ని ‘విప్పి’ అని, φέρετε యొక్క విస్తృత ‘తీసుకురండి’ భావాన్ని జాతి-నిర్దిష్ట చర్యను చేర్చకుండా అనువదిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ప్రత్యక్ష వాక్యంలో బహువచన గౌరవ/సంబోధన రూపాలు వాడబడ్డాయి. ప్రధాన పాఠంలో ‘గాడిద పిల్ల’ అని సందర్భానుసారంగా స్పష్టం చేసి, ἀνθρώπων యొక్క ప్రత్యక్ష మానవ సూచనను ‘ఏ మనిషీ’ ద్వారా నిలిపాం.
