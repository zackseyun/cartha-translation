review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the commands, the village opposite, the immediacy of finding the animal, its tied condition, its having never been ridden by a human, and the instruction to untie and bring it. ‘గాడిదపిల్ల’ is contextually defensible for πῶλον, but its broader lexical range should be noted. Recasting ‘కట్టి ఉండడం మీకు కనిపిస్తుంది’ as a finite, object-based construction more directly renders εὑρήσετε.
  naturalness: ‘కట్టి ఉండడం మీకు కనిపిస్తుంది’ is awkward in modern Telugu because it turns the animal’s state into a nominal clause. ‘కట్టివేయబడి ఉన్న ... మీరు కనుగొంటారు’ is natural, clear narrative Telugu. Moving the footnote marker to the phrase it explains gives it a precise anchor.
  terminology: ‘గ్రామం,’ ‘గాడిదపిల్ల,’ ‘విప్పి,’ and ‘తీసుకురండి’ are suitable modern-standard Telugu choices. ‘ఎక్కని’ is idiomatic for riding an animal while preserving the sense that no human has previously sat on it.
  issues:
  - severity: low
    issue: Awkward rendering of the tied state
    rationale: ‘కట్టి ఉండడం మీకు కనిపిస్తుంది’ is less idiomatic and weakens the direct future ‘you will find.’
  - severity: low
    issue: Footnote marker is not anchored to the clause it explains
    rationale: The note concerns ‘no one has yet sat/ridden,’ but the marker appears only after the whole finding clause.
  - severity: low
    issue: Lexical breadth of πῶλον is unnoted
    rationale: While ‘గాడిదపిల్ల’ is supported by the immediate narrative context, πῶλον can more broadly mean a young animal; a brief note preserves that lexical transparency.
  revised_text: 'ఆయన వారితో ఇలా అన్నాడు: “మీ ఎదురుగా ఉన్న గ్రామంలోకి వెళ్లండి. మీరు అందులోకి ప్రవేశించిన వెంటనే, ఇంతవరకు ఏ మనిషీ ఎక్కని[a] ఒక గాడిదపిల్లను[b] కట్టివేయబడి ఉండగా మీరు కనుగొంటారు. దానిని విప్పి తీసుకురండి.”'
