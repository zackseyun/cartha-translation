id: MRK.11.24
reference: Mark 11:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν, πάντα ὅσα ⸂προσεύχεσθε καὶ αἰτεῖσθε⸃, πιστεύετε ὅτι ⸀ἐλάβετε, καὶ ἔσται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/024.yaml
  text: For this reason I tell you[a], whatever you pray and ask for, believe that you have received it[b], and it will be yours.
translation:
  language: te
  text: 'అందువల్ల నేను మీతో చెబుతున్నాను: మీరు ప్రార్థిస్తూ అడిగే వాటన్నిటినీ పొందారని నమ్మండి[b]; అవి మీకు లభిస్తాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: కొన్ని ప్రతులలో లేదా పాఠాలలో “పొందుతున్నారని” అనే వర్తమాన భావం కనిపిస్తుంది. ఇక్కడ అనుసరించిన గ్రీకు పాఠం “పొందారని” అని, పూర్తయిన క్రియాభావాన్ని తెలియజేస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: అందువల్ల
  rationale: ముందున్న విశ్వాసబోధతో ఈ వాక్యాన్ని అనుసంధానించే కారణార్థక/నిగమనార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో చెబుతున్నాను
  rationale: వ్యక్తిగతమైన, అధికారపూర్వకమైన ప్రత్యక్ష సంబోధనను సహజంగా నిలుపుతుంది.
- source_word: πάντα ὅσα
  choice: ఏవి … అయినా
  rationale: గ్రీకులోని సమగ్ర విస్తృతిని తెలుగులో సహజమైన అనిశ్చిత సంబంధ నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: προσεύχεσθε καὶ αἰτεῖσθε
  choice: ప్రార్థిస్తూ … అడిగినా
  rationale: ‘ప్రార్థించడం’ మరియు ‘అడగడం’ అనే రెండు క్రియలనూ నిలుపుతూ, తెలుగులో వాటి సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πιστεύετε
  choice: నమ్మండి
  rationale: తదుపరి ὅτι వాక్యం తెలిపే విషయాన్ని నిజమని విశ్వసించాలనే ఆజ్ఞను నేరుగా తెలియజేస్తుంది.
- source_word: ἐλάβετε
  choice: పొందారని
  rationale: అయోరిస్ట్ రూపంలోని పూర్తయిన క్రియాభావాన్ని నిలుపుతుంది; భవిష్యత్ ఫలితానికి ముందే పొందినట్లు నమ్మాలనే ఉద్దేశపూర్వక కాలపరమైన ఉద్వేగాన్ని సవరించదు.
- source_word: ἔσται ὑμῖν
  choice: అవి మీకు కలుగుతాయి
  rationale: అడిగిన వాటిని సూచించే బహువచన సంబంధాన్ని స్పష్టంగా ఉంచి, గ్రీకు భవిష్యత్ వాక్యాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: విశ్వాసం మరియు ప్రార్థనకు సమాధానం మధ్య కాలపరమైన సంబంధం
  choice: ‘వాటిని పొందారని నమ్మండి; అప్పుడు అవి మీకు కలుగుతాయి’ అనే విరోధాభాసంలా వినిపించే క్రమాన్ని నిలుపడం
  alternative: ‘వాటిని పొందుతున్నారని నమ్మండి’ అని వర్తమాన భావంతో అనువదించడం
  rationale: ఇక్కడ స్వీకరించిన గ్రీకు పాఠంలో ἐλάβετε అనే అయోరిస్ట్ ఉంది. కాబట్టి పూర్తయిన క్రియాభావాన్ని తొలగించకుండా, ఏ ప్రత్యేక ప్రార్థనా సిద్ధాంతాన్ని అనువాదంలో చొప్పించకుండా మూలంలోని వేదాంతపరమైన ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. రెండు గ్రీకు క్రియలను తెలుగులో సహజంగా కలిపి, ἐλάβετε మరియు ἔσται మధ్యనున్న కాలపరమైన ఉద్వేగాన్ని ఉద్దేశపూర్వకంగా నిలిపాం.
