id: MRK.11.1
reference: Mark 11:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐγγίζουσιν εἰς Ἱεροσόλυμα εἰς Βηθφαγὴ καὶ Βηθανίαν πρὸς τὸ Ὄρος τῶν Ἐλαιῶν, ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/001.yaml
  text: And when they were approaching Jerusalem[a], at Bethphage and Bethany, near the Mount of Olives[b], he sends two of his disciples
translation:
  language: te
  text: వారు యెరూషలేమును సమీపిస్తూ, ఒలీవల కొండ దగ్గరనున్న బేత్ఫగే, బేతనియల వద్దకు వచ్చినప్పుడు, ఆయన తన శిష్యుల్లో ఇద్దరిని పంపాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకులో కథనాన్ని సజీవంగా చెప్పే వర్తమాన కాల రూపం ఉంది: “ఆయన తన శిష్యుల్లో ఇద్దరిని పంపుతున్నాడు” అని కూడా అనువదించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζουσιν
  choice: సమీపిస్తూ
  rationale: గ్రీకు వర్తమాన కాలం మార్కు వాడే చారిత్రక వర్తమానం; తెలుగు కథన ప్రవాహంలో సమకాలీనంగా సాగుతున్న చేరికను ‘సమీపిస్తూ’ సహజంగా తెలియజేస్తుంది.
- source_word: εἰς Ἱεροσόλυμα
  choice: యెరూషలేముకు
  rationale: ἐγγίζωతో కలిసి ఇది సమీపిస్తున్న గమ్యాన్ని సూచిస్తుంది; తెలుగులో దత్తివిభక్తి సహజం.
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: బేత్ఫగే, బేతనియ ప్రాంతానికి వచ్చినప్పుడు
  rationale: పునరుక్త εἰς ప్రయాణంలో చేరిన పరిసరాన్ని సూచిస్తున్నట్లు సహజ తెలుగులో వ్యక్తం చేస్తుంది; రెండు గ్రామాల మధ్య ఖచ్చిత స్థానాన్ని అవసరంలేకుండా నిర్ణయించదు.
- source_word: πρὸς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ఒలీవల కొండ దగ్గర ఉన్న
  rationale: πρός యొక్క స్థలసంబంధమైన సామీప్య భావాన్ని ఇక్కడ ‘దగ్గర’ తెలియజేస్తుంది; తప్పనిసరిగా కొండవైపు కదలికను ప్రతిపాదించదు.
- source_word: ἀποστέλλει
  choice: పంపాడు
  rationale: ఇది మార్కు కథనంలోని చారిత్రక వర్తమానం. ఆధునిక తెలుగు కథనంలో భూతకాల రూపం సహజంగా ఉంటుంది; గ్రీకు కాలరూప ప్రత్యామ్నాయం పాదసూచికలో నమోదు చేయబడింది.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: తన శిష్యుల్లో ఇద్దరిని
  rationale: భాగార్థక నిర్మాణాన్ని, యేసుతో వారి సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో కాపాడుతుంది.
- source_word: Ὄρος τῶν Ἐλαιῶν
  choice: ఒలీవల కొండ
  rationale: గ్రీకు నామంలోని బహువచన సంబంధార్థాన్ని స్పష్టంగా ఉంచే, తెలుగులో అర్థమయ్యే స్థలనామ రూపం.
