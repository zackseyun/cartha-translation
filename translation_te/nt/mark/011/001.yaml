translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు స్థలసూచక అవ్యయాల భావాన్ని తెలుగులో స్పష్టమైన వాక్యనిర్మాణంతో ఇచ్చి, మార్కు చారిత్రక వర్తమానాన్ని సహజ భూతకాలంగా అనువదించాం.
