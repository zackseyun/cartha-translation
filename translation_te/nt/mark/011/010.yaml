  text: Blessed is the coming kingdom of our father David! Hosanna in the highest![a]
translation:
  language: te
  text: మన పితరుడైన దావీదు యొక్క వస్తున్న రాజ్యం ధన్యమైనది! సర్వోన్నత స్థలాల్లో హోసన్నా![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘హోసన్నా’ అనే పదం ‘దయచేసి రక్షించు’ లేదా ‘ఇప్పుడే రక్షించు’ అనే విజ్ఞాపనను ప్రతిబింబించవచ్చు; అయితే ఇక్కడ అది ఆరాధనలోని ప్రశంసా జయధ్వనిగా పనిచేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογημένη
  choice: ధన్యం
  rationale: ఇది ప్రజల ప్రశంసాపూర్వక ప్రకటనను పరిచయం చేసే విశేషణం. ‘ధన్యం’ అనే పదం ఆశీర్వాద ప్రకటన స్వరాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἡ ἐρχομένη βασιλεία
  choice: వస్తున్న రాజ్యం
  rationale: వర్తమాన కృదంతంలోని ‘వస్తూ ఉన్న’ భావాన్ని ‘వస్తున్న’ నేరుగా నిలుపుతుంది; ‘రానున్న’ అని అనువదిస్తే భవిష్యత్తు భావం మరింత బలపడవచ్చు.
- source_word: βασιλεία
  choice: రాజ్యం
  rationale: దావీదు వంశపారంపర్య రాజాధికార సందర్భంలో ‘రాజ్యం’ సహజమైనది; ‘పాలన’ అనే అమూర్త భావానికే పరిమితం చేయదు.
- source_word: τοῦ πατρὸς ἡμῶν Δαυίδ
  choice: మన పితరుడైన దావీదు యొక్క
  rationale: ఇక్కడ πατήρ పూర్వికునికి ఇచ్చే గౌరవసూచక సంబోధన. ‘పితరుడు’ ఆ భావాన్ని కాపాడుతుంది; ‘తండ్రి’ ప్రత్యక్ష జనకుడనే అపార్థం కలిగించవచ్చు.
- source_word: Ὡσαννὰ
  choice: హోసన్నా
  rationale: కొత్త నిబంధన వాడుకలో ఇది స్థిరమైన ఆరాధనా జయధ్వనిగా పనిచేస్తుంది. దాని మూల విజ్ఞాపన భావాన్ని పాదటిప్పణిలో ఇస్తున్నాం.
- source_word: ἐν τοῖς ὑψίστοις
  choice: సర్వోన్నతంలో
  rationale: అత్యున్నత పరలోక ప్రాంతాన్ని సూచించగల గ్రీకు నుడికారాన్ని సంక్షిప్తంగా ఉంచుతుంది; ‘పరలోకంలో’ అని స్పష్టీకరించి మూలంలోని స్వల్ప అనిశ్చితిని తొలగించదు.
theological_decisions:
- issue: దావీదు రాజ్యాన్ని గూర్చిన జయధ్వని స్వభావం
  choice: ‘మన పితరుడైన దావీదు యొక్క వస్తున్న రాజ్యం’ అని నేరుగా అనువదించడం
  alternative: ‘మన పితరుడైన దావీదు యొక్క వస్తున్న మెస్సీయ రాజ్యం’
  rationale: సందర్భంలో మెస్సీయ నిరీక్షణ బలంగా ఉన్నా, గ్రీకు పాఠంలో ‘మెస్సీయ’ అనే వివరణాత్మక పదం లేదు. అందువల్ల ఆ దైవశాస్త్ర సూచనను పాఠకుడు గ్రహించేలా ఉంచి, అనువాదంలో అదనపు సిద్ధాంత వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ఆరాధనా స్వరాన్ని ఉంచాం. ‘పితరుడు,’ ‘ధన్యం,’ ‘హోసన్నా’ వంటి పదాలు బైబిలు సందర్భానికి తగిన గౌరవాన్ని ఇస్తూనే సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి.
