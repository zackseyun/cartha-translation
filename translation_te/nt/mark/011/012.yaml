  text: Καὶ τῇ ἐπαύριον ἐξελθόντων αὐτῶν ἀπὸ Βηθανίας ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/012.yaml
  text: And on the next day, when they had gone out from Bethany, he was hungry.
translation:
  language: te
  text: మరుసటి రోజు వారు బేతనియ నుండి బయలుదేరినప్పుడు, ఆయనకు ఆకలి వేసింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: '[ప్రత్యేక పదంగా అనువదించలేదు]'
  rationale: ఇక్కడ Καὶ కథన కొనసాగింపును సూచిస్తుంది. తెలుగులో వాక్యారంభంలో ‘మరియు’ అనడం కృత్రిమంగా ఉంటుంది; ‘మరుసటి రోజు’తో కొనసాగింపు సహజంగానే వ్యక్తమవుతుంది.
- source_word: τῇ ἐπαύριον
  choice: మరుసటి రోజు
  rationale: ఈ పదబంధం ముందటి సంఘటనకు తరువాతి రోజును సూచిస్తుంది. ‘మరుసటి రోజు’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కాలవ్యక్తీకరణ.
- source_word: ἐξελθόντων αὐτῶν
  choice: వారు ... బయలుదేరినప్పుడు
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణంలోని బహువచనాన్ని ‘వారు’గా నిలిపి, ప్రధాన క్రియకు ముందుగా జరిగిన కాలసంబంధ చర్యను ‘బయలుదేరినప్పుడు’ సహజంగా తెలియజేస్తుంది.
- source_word: ἀπὸ Βηθανίας
  choice: బేతనియ నుండి
  rationale: ἀπό ఒక స్థలం నుంచి దూరంగా కదలడాన్ని సూచిస్తుంది. స్థలనామాన్ని తెలుగులో సాధారణంగా వాడే రూపమైన ‘బేతనియ’గా లిప్యంతరీకరించాం.
- source_word: ἐπείνασεν
  choice: ఆయనకు ఆకలి వేసింది
  rationale: ఈ సందర్భంలో ఆకలి కలిగిన స్థితిని లేదా దాని ఆరంభాన్ని తెలిపే సహజ తెలుగు నుడికారం ఇది. ‘ఆకలితో ఉన్నాడు’ కంటే గ్రీకు ఆఓరిస్ట్‌లో కనిపించే ఆకలి కలగడాన్ని కూడా బాగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ἐπείνασεν యొక్క అంతర్లీన ఏకవచన కర్త
  choice: పేరును చేర్చకుండా ‘ఆయన’ అని అనువదించడం
  alternative: స్పష్టత కోసం ‘యేసుకు’ అని చేర్చడం
  rationale: గ్రీకు పాఠ్యంలో కర్త పేరు ప్రత్యక్షంగా లేదు, కాని సందర్భం వల్ల అది యేసునే సూచిస్తుందని స్పష్టమవుతుంది. ‘ఆయన’ మూలపాఠ్య సంక్షిప్తతను కాపాడుతూ తెలుగులో గౌరవప్రదంగా, స్పష్టంగా ఉంటుంది; ఆకలి నిజంగా కలిగిందనే వాక్యార్థాన్నీ యథాతథంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. అనవసరంగా ‘మరియు’ చేర్చకుండా తెలుగు వాక్యప్రవాహానికి ప్రాధాన్యం ఇచ్చాం.
