translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. మూలంలోని కృదంత నిర్మాణాన్ని తెలుగులో ‘వెళ్తుండగా’ అనే నేపథ్య క్రియతో, ఫలితస్థితిని ‘ఎండిపోయి ఉండడం’తో వ్యక్తం చేశాం.
