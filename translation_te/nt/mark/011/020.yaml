  text: Καὶ ⸂παραπορευόμενοι πρωῒ⸃ εἶδον τὴν συκῆν ἐξηραμμένην ἐκ ῥιζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/020.yaml
  text: And as they were passing by early in the morning[a], they saw the fig tree withered from the roots.
translation:
  language: te
  text: వారు తెల్లవారుజామున అటుగా వెళ్తుండగా, వేర్లనుంచి ఎండిపోయి ఉన్న ఆ అంజూరపు చెట్టును చూశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వేర్లనుంచి వాడిపోయి ఉన్నది.’
    reason: ἐξηραμμένηνకు సందర్భానుకూలమైన ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: ఆ దారిలో వెళ్తుండగా
  rationale: వర్తమాన కృదంతం ప్రధాన క్రియతో సమకాలీనంగా జరుగుతున్న నేపథ్య చర్యను సూచిస్తుంది. ఈ తెలుగు ప్రయోగం ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: πρωῒ
  choice: తెల్లవారుజామున
  rationale: ఈ క్రియావిశేషణం ఉదయపు తొలివేళను సూచిస్తుంది; ఆధునిక తెలుగులో ‘తెల్లవారుజామున’ కాలాన్నీ, తొలివేళ అనే నొక్కునూ స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἶδον
  choice: చూశారు
  rationale: ఇది చూడడాన్ని తెలిపే సూటి భూతకాల క్రియ; ‘గమనించారు’ అనడం మూలంలో లేని అదనపు భావాన్ని చేర్చవచ్చు.
- source_word: συκῆν
  choice: అంజూరపు చెట్టు
  rationale: కథన సందర్భంలో συκῆకు సాధారణమైన, స్పష్టమైన తెలుగు పేరు.
- source_word: ἐξηραμμένην
  choice: ఎండిపోయి ఉండడం
  rationale: పూర్ణ నిష్క్రియ కృదంతం ముందే జరిగిన చర్య వల్ల ఏర్పడిన ప్రస్తుత స్థితిని తెలియజేస్తుంది. ‘ఎండిపోయి ఉండడం’ ఆ ఫలితస్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκ ῥιζῶν
  choice: వేర్లనుంచి
  rationale: చెట్టు ఎండిపోవడం వేర్లనుంచి సంభవించినదని లేదా వేర్లవరకు వ్యాపించినదని చెప్పే మూలపాఠంలోని సంక్షిప్త భావాన్ని, దాని స్వల్ప సందిగ్ధతతో సహా, ఇది నిలుపుతుంది.
