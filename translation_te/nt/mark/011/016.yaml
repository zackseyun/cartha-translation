  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐκ ἤφιεν ἵνα τις διενέγκῃ σκεῦος διὰ τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/016.yaml
  text: And he would not allow anyone to carry a vessel through the temple courts[a][b].
translation:
  language: te
  text: అతడు దేవాలయ ప్రాంగణం[a] గుండా ఎవరినీ ఏ వస్తువునూ[b] మోసుకుపోనివ్వలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవాలయ పరిసరాల గుండా.’ గ్రీకు పదం ప్రత్యేకంగా అంతరాలయాన్ని కాక, దేవాలయ సముదాయం మొత్తాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఏ పాత్రనూ’ లేదా ‘ఏ సామానునూ.’ గ్రీకు పదం విస్తృతార్థకమైనది; ఏ రకమైన వస్తువో నిర్దిష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤφιεν
  choice: మోసుకుపోనివ్వలేదు
  rationale: అసంపూర్ణ భూతకాల క్రియ ఇక్కడ కొనసాగుతున్న లేదా పదేపదే అడ్డుకున్న చర్యను సూచిస్తుంది. తెలుగులో సందర్భసహజమైన నిషేధార్థక ప్రయోగం దీనిని తగినంతగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα τις διενέγκῃ
  choice: ఎవరినీ ... మోసుకుపోనివ్వలేదు
  rationale: ἵνα + సంభావనార్థక క్రియ, ἤφιεν తరువాత అనుమతించని కార్యాన్ని తెలియజేస్తుంది; తెలుగులో ‘ఎవరినీ ... పోనివ్వలేదు’ అనే నిర్మాణం సహజంగా ఉంటుంది.
- source_word: διενέγκῃ
  choice: మోసుకుపో
  rationale: ఒక ప్రాంతం గుండా ఒక చోటు నుంచి మరొక చోటుకు తీసుకెళ్లడం అనే దిశాత్మక భావాన్ని ‘గుండా ... మోసుకుపో’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: σκεῦος
  choice: ఏ వస్తువునూ
  rationale: σκεῦος అనేది పాత్ర, పరికరం లేదా సామాను వంటి విస్తృతార్థక పదం. వస్తువు రకాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా ‘వస్తువు’ ఆ విస్తృతిని కాపాడుతుంది.
- source_word: διὰ τοῦ ἱεροῦ
  choice: దేవాలయ ప్రాంగణాల గుండా
  rationale: ἱερόν ఇక్కడ అంతరాలయాన్ని మాత్రమే కాక మొత్తం దేవాలయ సముదాయాన్ని సూచిస్తుంది. ‘దేవాలయ ప్రాంగణాలు’ సాధారణ పాఠకులకు ఈ భేదాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యెరూషలేము దేవాలయానికి సంబంధించి ἱερόν అర్థం
  choice: విస్తృత దేవాలయ సముదాయం—‘దేవాలయ ప్రాంగణాలు’
  alternative: ‘దేవాలయం’ లేదా ‘దేవాలయ పరిసరాలు’
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కాదు; సందర్భానికి ముఖ్యమైన స్థలభేదం. ἱερόν అనేది ναός అనే అంతరాలయ పదానికి భిన్నంగా విస్తృత దేవాలయ సముదాయాన్ని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘అంతేకాక’ καί యొక్క సందర్భానుసార కొనసాగింపును చూపుతుంది; ‘ఎవరినీ ఏ వస్తువునూ’ అనే జంట నిషేధ నిర్మాణం తెలుగులో స్పష్టతనిస్తుంది.
