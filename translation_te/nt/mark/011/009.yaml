  source_fidelity: గ్రంథపాఠానికి నమ్మకంగా ఉంది. οἱ προάγοντες/οἱ ἀκολουθοῦντες అనే సమాంతర వర్తమాన కృదంతాలు “ముందుగా వెళ్తున్నవారూ, వెనుక వస్తున్నవారూ”గా, ἔκραζον యొక్క కొనసాగింపు భావం “కేకలు వేస్తూనే ఉన్నారు”గా సరిగ్గా ప్రతిఫలించాయి. “హోసన్నా,” “ప్రభువు పేరట,” మరియు కీర్తనాత్మక ఆశీర్వాద సూత్రం మూలంలోని అర్థం, స్వరం, సూచనను నిలుపుతున్నాయి.
