id: MRK.11.9
reference: Mark 11:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οἱ προάγοντες καὶ οἱ ἀκολουθοῦντες ⸀ἔκραζον· Ὡσαννά· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/009.yaml
  text: And those going ahead and those following were crying out[b][a], “Hosanna! Blessed is the one who comes in the name of the Lord!”
translation:
  language: te
  text: 'ముందుగా వెళ్తున్నవారూ, వెనుక వస్తున్నవారూ ఇలా కేకలు వేస్తూనే ఉన్నారు: “హోసన్నా![a] ప్రభువు పేరట వచ్చేవాడు ధన్యుడు!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “హోసన్నా” అనేది హీబ్రూ/అరామిక్ ఆరాధనా నినాదం. దాని అర్థం “దయచేసి రక్షించు” లేదా “ఇప్పుడే రక్షించు” అన్నట్టుగా ఉంటుంది; అయితే ఇక్కడ అది స్తుతి నినాదంగానూ పనిచేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ ప్రశంసా నినాదం కీర్తన 118:26ను ప్రతిధ్వనిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: ముందుగా వెళ్తున్నవారు
  rationale: యేసు ఉన్న ఊరేగింపులో ముందు భాగంలో సాగుతున్నవారిని సూచించే నామవాచకార్థక వర్తమాన కృదంతం; కొనసాగుతున్న చర్యను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: οἱ ἀκολουθοῦντες
  choice: వెనుక వస్తున్నవారు
  rationale: ముందుగా వెళ్తున్నవారికి సమాంతరంగా, యేసు వెనుక సాగుతున్న గుంపును సహజంగా సూచిస్తుంది.
- source_word: ἔκραζον
  choice: కేకలు వేస్తూనే ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న లేదా పునరావృతమవుతున్న బహిరంగ నినాద భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: Ὡσαννά
  choice: హోసన్నా
  rationale: హీబ్రూ/అరామిక్ మూలమున్న ఆరాధనా నినాదాన్ని లిప్యంతరీకరించడం ద్వారా దాని వేడుకపరమైన, లేఖన సంబంధమైన ప్రతిధ్వనిని నిలుపుతుంది; మూలార్థాన్ని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: Εὐλογημένος
  choice: ధన్యుడు
  rationale: ఈ ఆశీర్వాద ప్రకటనలోని నిష్క్రియార్థాన్ని, కీర్తన 118:26 ప్రతిధ్వనిని తెలుగులో సుపరిచితమైన బైబిలు పదంతో నిలుపుతుంది.
- source_word: ὁ ἐρχόμενος
  choice: వచ్చేవాడు
  rationale: నామవాచకార్థక వర్తమాన కృదంతాన్ని సహజంగా అనువదిస్తుంది; ‘మెస్సీయ’ లేదా ‘రాజు’ అనే బిరుదును మూలపాఠంలో లేకుండానే చేర్చదు.
- source_word: ἐν ὀνόματι κυρίου
  choice: ప్రభువు పేరట
  rationale: ప్రభువు అధికారంతో లేదా ఆయన ప్రతినిధిగా రావడం అనే బైబిలు నుడికారాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తూ కీర్తన ఉల్లేఖనాన్ని నిలుపుతుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριοςకు గౌరవప్రదమైన, ప్రామాణిక తెలుగు బైబిలు సమానార్థక పదం.
theological_decisions:
- issue: ప్రజల నినాదంలో మెస్సీయ గుర్తింపును అనువాదంలో స్పష్టంగా చేర్చాలా?
  choice: “ప్రభువు పేరట వచ్చేవాడు ధన్యుడు” అనే ఉల్లేఖన రూపాన్నే నిలుపడం.
  alternative: “ప్రభువు పేరట వచ్చే మెస్సీయ ధన్యుడు” లేదా “ప్రభువు పేరట వచ్చే రాజు ధన్యుడు.”
  rationale: సందర్భంలో ఈ మాటలకు మెస్సీయ సంబంధమైన ప్రాధాన్యం ఉన్నా, గ్రీకు వాక్యంలో ఇక్కడ ‘మెస్సీయ’ లేదా ‘రాజు’ అనే బిరుదు లేదు. కీర్తన 118:26ను ప్రతిధ్వనించే పదాలను నిలుపడం ద్వారా వ్యాఖ్యానాన్ని పాఠ్యంలోకి దిగుమతి చేయకుండా దాని theological tensionను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘హోసన్నా’ అనే ఆరాధనా పదం లిప్యంతరీకరించబడింది; ‘వచ్చేవాడు’ అనే రూపం మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో ఉంది.
