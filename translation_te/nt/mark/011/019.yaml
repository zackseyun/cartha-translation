id: MRK.11.19
reference: Mark 11:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ⸀ὅταν ὀψὲ ἐγένετο, ⸀ἐξεπορεύοντο ἔξω τῆς πόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/019.yaml
  text: And whenever evening came, they would go out of the city.
translation:
  language: te
  text: సాయంకాలమైనప్పుడల్లా, వారు నగరం వెలుపలికి వెళ్లేవారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: అప్పుడల్లా
  rationale: తర్వాతి అసంపూర్ణ భూతకాల క్రియతో కలిసి ఇది పదేపదే జరిగే ఆచరణను సూచిస్తుంది; ‘అప్పుడల్లా’ ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὀψὲ ἐγένετο
  choice: సాయంకాలమైనప్పుడు
  rationale: ‘ఆలస్యమైంది/సాయంకాలమైంది’ అనే కాలసూచక ప్రయోగాన్ని సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: ἐξεπορεύοντο
  choice: వెళ్లేవారు
  rationale: అసంపూర్ణ భూతకాల రూపం సందర్భంలో అలవాటుగా లేదా పునరావృతంగా జరిగిన చర్యను సూచిస్తుంది; తెలుగు ‘వెళ్లేవారు’ ఆ భావాన్ని నిలుపుతుంది.
- source_word: ἔξω τῆς πόλεως
  choice: నగరం వెలుపలికి
  rationale: క్రియలోని బయటికి వెళ్లే చలన భావాన్నీ, ἔξω + షష్ఠీ విభక్తి తెలిపే నగరం బయట అనే భావాన్నీ సహజంగా అందిస్తుంది.
- source_word: πόλεως
  choice: నగరం
  rationale: మూలపాఠం యెరూషలేమును పేరుతో పేర్కొనకుండా ‘నగరం’ అని మాత్రమే చెబుతుంది; అందువల్ల సందర్భం ద్వారా తెలిసే పేరును అనువాదంలో చేర్చలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అదే సమయంలో కథనానికి తగిన గౌరవప్రదమైన శైలిని పాటించింది. పునరావృత చర్యను ‘అప్పుడల్లా … వెళ్లేవారు’ అనే నిర్మాణంతో స్పష్టంగా ఉంచింది.
