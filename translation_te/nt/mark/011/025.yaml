revisions:
- from: మీరు ప్రార్థిస్తూ నిలబడినప్పుడల్లా, ఎవరి మీదైనా మీకు ఏమైనా ఉంటే వారిని క్షమించండి. అప్పుడు పరలోకాల్లో[a] ఉన్న మీ తండ్రి కూడా మీ అపరాధాలను[b] క్షమించేలా అలా చేయండి.
  to: మీరు ప్రార్థిస్తూ నిలబడి ఉన్నప్పుడల్లా, పరలోకాల్లో[a] ఉన్న మీ తండ్రి కూడా మీ అపరాధాలను[b] క్షమించునట్లు, ఎవరి పట్లైనా మీకు ఏదైనా అభ్యంతరం ఉంటే వారిని క్షమించండి.
  rationale: The revision retains the concrete posture of standing while praying and the Greek plural ‘heavens.’ It replaces the vague grievance expression with an idiomatic equivalent and restores a single imperative (‘క్షమించండి’). The purpose relationship of ἵνα ... ἀφῇ is represented by ‘క్షమించునట్లు’ without adding doctrinal explanation or an extra command.
