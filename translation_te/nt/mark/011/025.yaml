review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the prayer posture, the broad scope of a grievance against anyone, the plural ‘heavens,’ and the distinction conveyed by παραπτώματα. However, the final clause is syntactically distorted: ‘అప్పుడు ... క్షమించేలా అలా చేయండి’ adds a second imperative (‘do so’) not present in Greek and fails to express the ἵνα purpose clause coherently.'
  naturalness: Most wording is modern and understandable. ‘ఎవరి మీదైనా మీకు ఏమైనా ఉంటే’ is somewhat vague in Telugu; ‘ఎవరి పట్లైనా మీకు ఏదైనా అభ్యంతరం ఉంటే’ clearly and naturally communicates a grievance. Recasting the purpose clause removes the awkward repetition.
  terminology: ‘ప్రార్థిస్తూ,’ ‘క్షమించండి,’ ‘పరలోకాల్లో,’ ‘తండ్రి,’ and ‘అపరాధాలు’ are suitable in a respectful modern-standard Telugu register. ‘అపరాధాలు’ appropriately represents παραπτώματα without collapsing it into the broader term ‘పాపాలు.’
  issues:
  - severity: high
    issue: The final Telugu clause adds ‘అలా చేయండి’ and leaves the purpose construction malformed.
    rationale: The Greek has one imperative, ἀφίετε (‘forgive’), followed by ἵνα plus a subjunctive, expressing the stated purpose/link to the Father’s forgiveness. ‘అలా చేయండి’ introduces an additional command and does not correspond to any Greek wording.
  - severity: medium
    issue: ‘ఎవరి మీదైనా మీకు ఏమైనా ఉంటే’ is imprecise and mildly unnatural for a personal grievance.
    rationale: The phrase can sound as though one merely possesses ‘something’ concerning someone. ‘ఎవరి పట్లైనా మీకు ఏదైనా అభ్యంతరం ఉంటే’ preserves εἴ τι ἔχετε κατά τινος as an indefinite grievance against anyone.
  revised_text: మీరు ప్రార్థిస్తూ నిలబడి ఉన్నప్పుడల్లా, పరలోకాల్లో[a] ఉన్న మీ తండ్రి కూడా మీ అపరాధాలను[b] క్షమించునట్లు, ఎవరి పట్లైనా మీకు ఏదైనా అభ్యంతరం ఉంటే వారిని క్షమించండి.
