source:
  edition: SBLGNT
  text: καὶ ὅταν ⸀στήκετε προσευχόμενοι, ἀφίετε εἴ τι ἔχετε κατά τινος, ἵνα καὶ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφῇ ὑμῖν τὰ παραπτώματα ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/025.yaml
  text: And whenever you stand praying[a], forgive, if you have anything against anyone[b], so that your Father who is in the heavens may also forgive you your trespasses.
translation:
  language: te
  text: మీరు ప్రార్థిస్తూ నిలబడి ఉన్నప్పుడల్లా, పరలోకాల్లో[a] ఉన్న మీ తండ్రి కూడా మీ అపరాధాలను[b] క్షమించునట్లు, ఎవరి పట్లైనా మీకు ఏదైనా అభ్యంతరం ఉంటే వారిని క్షమించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరలోకంలో.’ గ్రీకు మూలంలో ‘పరలోకాల్లో’ అని బహువచనం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతిక్రమాలను’ లేదా ‘తప్పులను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: στήκετε
  choice: నిలబడినప్పుడల్లా
  rationale: ప్రార్థనలోని నిలబడే భంగిమను తొలగించకుండా, ὅταν తో కూడిన వర్తమాన క్రియ సూచించే పునరావృత సందర్భాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: προσευχόμενοι
  choice: ప్రార్థిస్తూ
  rationale: ప్రధాన క్రియతో సమకాలీనంగా జరిగే చర్యను సూచించే వర్తమాన కృదంత భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἀφίετε
  choice: క్షమించండి
  rationale: వ్యక్తుల మధ్య ఉన్న అభ్యంతరం లేదా అపరాధం సందర్భంలో ‘విడిచిపెట్టండి’ కన్నా ‘క్షమించండి’ స్పష్టమైన, సహజమైన సమానార్థకం; తరువాత తండ్రి చేసే క్షమాపణతోనూ పదసంబంధాన్ని నిలుపుతుంది.
- source_word: εἴ τι ἔχετε κατά τινος
  choice: ఎవరి మీదైనా మీకు ఏమైనా ఉంటే
  rationale: τι మరియు τινος పదాల అనిర్దిష్ట, విస్తృత భావాన్ని నిలుపుతూ, ఒకరి మీద అభ్యంతరం లేదా మనస్పర్థ ఉండడాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: పరలోకాల్లో ఉన్న మీ తండ్రి
  rationale: గ్రీకులోని οὐρανοῖς బహువచనాన్ని నిలుపుతూ, సాధారణ తెలుగు బైబిలు పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన రూపాన్ని ఉపయోగిస్తుంది.
- source_word: ἀφῇ
  choice: క్షమించేలా
  rationale: ἵνα తరువాతి సంభావనార్థక క్రియలో ఉన్న ఉద్దేశం/ఫలిత సంబంధాన్ని ‘క్షమించేలా’ ద్వారా నిలుపుతుంది; καί భావాన్ని ‘కూడా’ వ్యక్తపరుస్తుంది.
- source_word: παραπτώματα
  choice: అపరాధాలు
  rationale: తప్పటడుగు, ఉల్లంఘన, మనస్తాపం కలిగించే తప్పు అనే భావ పరిధిని సాధారణ పాఠకులకు అర్థమయ్యేలా వ్యక్తపరుస్తుంది; సాధారణ ‘పాపాలు’ అనే పదంతో ఉన్న పదభేదాన్ని కూడా కాపాడుతుంది.
theological_decisions:
- issue: ఇతరులను క్షమించడానికీ తండ్రి క్షమించడానికీ మధ్య సంబంధం
  choice: ‘మీ తండ్రి కూడా ... క్షమించేలా’ అని ఉద్దేశం/ఫలిత సంబంధాన్ని నేరుగా నిలిపాము.
  alternative: మానవ క్షమాపణ కేవలం ముందే లభించిన దైవ క్షమాపణకు నిదర్శనం మాత్రమే అన్నట్లుగా వివరణాత్మకంగా మార్చడం.
  rationale: ἵνα ... ἀφῇ ఇతరులను క్షమించాలనే ఆజ్ఞకూ తండ్రి క్షమించడానికీ నిజమైన వాక్య సంబంధాన్ని చూపుతుంది. విస్తృత సిద్ధాంత వ్యవస్థతో ఆ ఉద్రిక్తతను తగ్గించకుండా అనువాదం దానిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘ప్రార్థిస్తూ నిలబడినప్పుడల్లా’ ప్రార్థనా భంగిమను స్పష్టంగా ఉంచుతుంది. మూలంలోని బహువచన ‘పరలోకాలు’ మరియు మానవ క్షమాపణ–దైవ క్షమాపణ మధ్య ఉన్న ఉద్దేశం/ఫలిత సంబంధం వ్యాఖ్యానంతో సడలించబడలేదు.
