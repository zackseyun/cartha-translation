translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ప్రశ్నలో మూలంలో లేని కారణార్థక ‘ఎందుకు’ను చేర్చలేదు; πῶλος యొక్క విస్తృత పదార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి సందర్భానుసారమైన నిర్దిష్టతను పాదసూచికలో ఇచ్చాం.
