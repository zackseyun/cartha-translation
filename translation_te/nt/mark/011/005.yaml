  text: καί τινες τῶν ἐκεῖ ἑστηκότων ἔλεγον αὐτοῖς· Τί ποιεῖτε λύοντες τὸν πῶλον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/005.yaml
  text: And some of those standing there were saying to them[a], “What are you doing, untying the colt?”
translation:
  language: te
  text: అక్కడ నిలబడి ఉన్నవారిలో కొందరు వారితో, “ఆ పిల్ల జంతువును[a] విప్పుతూ మీరేం చేస్తున్నారు?” అని అడుగుతూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ గాడిదపిల్లను.” గ్రీకు పదం πῶλος చిన్న వయసున్న జంతువును సూచించగలదు; ఈ సందర్భంలో అది గాడిదపిల్లను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινες
  choice: కొందరు
  rationale: అక్కడున్న వారిలో నిర్దిష్టంగా గుర్తించని కొంతమందిని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: అక్కడ నిలబడి ఉన్నవారిలో
  rationale: సుబంతంగా వాడిన కృదంతాన్ని, దానికి సంబంధించిన స్థల సూచనను దగ్గరగా ప్రతిబింబిస్తుంది; ‘చుట్టూ ఉన్నవారు’ వంటి అదనపు భావాన్ని చేర్చదు.
- source_word: ἔλεγον αὐτοῖς
  choice: వారితో … అన్నారు
  rationale: మాట్లాడినవారిని, శిష్యులనే బహువచన సంబోధ్యులను స్పష్టంగా ఉంచే సహజమైన తెలుగు కథన ప్రయోగం. గ్రీకు అసంపూర్ణ భూతకాల భావాన్ని తెలుగులో బలవంతంగా పునరావృతిగా చూపకుండా సందర్భానుకూలంగా అందిస్తుంది.
- source_word: Τί ποιεῖτε
  choice: మీరేం చేస్తున్నారు?
  rationale: క్రియ జరుగుతున్నప్పుడే వారి చర్యను నేరుగా ప్రశ్నిస్తుంది; మూలంలో లేని ‘ఎందుకు’ అనే భావాన్ని చేర్చదు.
- source_word: λύοντες
  choice: విప్పుతూ
  rationale: కట్టివున్న జంతువు కట్టును విప్పుతున్న చర్యను సహజంగా తెలియజేస్తూ, ప్రధాన క్రియతో ఉన్న కృదంత సంబంధాన్ని నిలుపుతుంది.
- source_word: τὸν πῶλον
  choice: ఆ పిల్లను
  rationale: πῶλος అనే పదంలోని సాధారణ ‘చిన్న వయసున్న జంతువు’ భావాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది. సందర్భం అది గాడిద పిల్ల అని తెలియజేస్తుంది; దాన్ని పాదసూచికలో స్పష్టం చేయడం ద్వారా మూలపదం కంటే ప్రధాన పాఠ్యాన్ని మరీ నిర్దిష్టం చేయదు.
