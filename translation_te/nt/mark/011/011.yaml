  to: ఆయన యెరూషలేములోకి వచ్చి దేవాలయ ప్రాంగణంలోకి ప్రవేశించాడు.[a] అక్కడ అన్నిటినీ చుట్టూ చూసిన తరువాత, అప్పటికే ఆలస్యమైనందున,[b] పన్నెండుమందితో[c] కలిసి బేతనియకు వెళ్లిపోయాడు.
