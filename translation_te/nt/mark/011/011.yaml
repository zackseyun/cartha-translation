id: MRK.11.11
reference: Mark 11:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν εἰς ⸀Ἱεροσόλυμα εἰς τὸ ἱερόν· καὶ περιβλεψάμενος πάντα ⸀ὀψὲ ἤδη οὔσης τῆς ὥρας ἐξῆλθεν εἰς Βηθανίαν μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/011.yaml
  text: And he entered Jerusalem[a], into the temple courts; and after looking around at everything, since it was already late[c][b], he went out to Bethany with the twelve.
translation:
  language: te
  text: ఆయన యెరూషలేములోకి వచ్చి దేవాలయ ప్రాంగణంలోకి ప్రవేశించాడు.[a] అక్కడ అన్నిటినీ చుట్టూ చూసిన తరువాత, అప్పటికే ఆలస్యమైనందున,[b] పన్నెండుమందితో[c] కలిసి బేతనియకు వెళ్లిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవాలయ ఆవరణలోకి,” లేదా కేవలం “దేవాలయంలోకి.” గ్రీకు పదం అంతర్గత పరిశుద్ధ మందిరాన్ని మాత్రమే కాకుండా విస్తృత దేవాలయ సముదాయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “సమయం అప్పటికే ఆలస్యమైనందున,” లేదా “అప్పటికే చాలా పొద్దుపోయినందున.”
    reason: lexical_alternative
  - marker: c
    text: అంటే, యేసు పన్నెండు మంది శిష్యులు.
    reason: cross_reference
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: ప్రవేశించి … వెళ్లాడు
  rationale: ఆయన యెరూషలేములో ప్రవేశించి దేవాలయ ప్రాంగణంలోకి వెళ్లిన కథన గమనాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Ἱεροσόλυμα
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన స్థలనామ రూపం.
- source_word: τὸ ἱερόν
  choice: దేవాలయ ప్రాంగణం
  rationale: ἱερόν అంతర్గత పరిశుద్ధ మందిరాన్ని మాత్రమే కాకుండా విస్తృతమైన దేవాలయ సముదాయాన్ని సూచిస్తుంది; యేసు ప్రవేశించి చుట్టూ చూడగల బహిరంగ ప్రాంత భావాన్ని ఇది స్పష్టం చేస్తుంది.
- source_word: περιβλεψάμενος
  choice: చుట్టూ చూసిన తరువాత
  rationale: పరిసరాలన్నిటినీ పరిశీలనగా చూడడాన్ని, ప్రధాన క్రియకు ముందున్న క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πάντα
  choice: అక్కడ ఉన్నవన్నీ
  rationale: నపుంసక బహువచనంలోని సమగ్రతను నిలుపుతూ తెలుగు సందర్భంలో సహజంగా ఉంటుంది.
- source_word: ὀψὲ ἤδη οὔσης τῆς ὥρας
  choice: అప్పటికే పొద్దుపోయినందున
  rationale: సమయం ఆలస్యమైందనే కాలసంబంధమైన పరిస్థితినీ, బయలుదేరడానికి దానితో ఉన్న కారణ సంబంధాన్నీ సంక్షిప్తంగా తెలుపుతుంది.
- source_word: ἐξῆλθεν
  choice: వెళ్లిపోయాడు
  rationale: ఆ ప్రదేశాన్ని విడిచి బేతనియకు వెళ్లిన దిశాత్మక కథన భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: Βηθανίαν
  choice: బేతనియ
  rationale: తెలుగు బైబిలు సంప్రదాయంలో పరిచితమైన స్థలనామ రూపం.
- source_word: μετὰ τῶν δώδεκα
  choice: పన్నెండుమందితో కలిసి
  rationale: సంఖ్యను బిరుదుగా మార్చకుండా, సందర్భంలోని యేసు పన్నెండు మంది శిష్యులను సూచిస్తుంది.
theological_decisions:
- issue: τὸ ἱερόν సూచించే ప్రదేశం
  choice: దేవాలయ ప్రాంగణం—విస్తృత దేవాలయ సముదాయం
  alternative: దేవాలయం
  rationale: ἱερόνను ναός అనే అంతర్గత మందిర భావంతో కలపకుండా, కథనానికి సరిపోయే విస్తృత ప్రాంగణ భావాన్ని నిలుపుతుంది.
- issue: οἱ δώδεκα యొక్క సమూహ గుర్తింపు
  choice: పన్నెండుమంది
  alternative: పన్నెండు మంది శిష్యులు
  rationale: మూలంలోని సంఖ్యాపదాన్ని నేరుగా నిలుపుతుంది; పాదసూచిక దాని సూచిత సమూహాన్ని వివరిస్తుంది, ప్రధాన పాఠ్యంలో అదనపు పదాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘దేవాలయ ప్రాంగణం’ ద్వారా ἱερόν యొక్క విస్తృత ప్రదేశార్థాన్ని స్పష్టం చేశాం; ‘పన్నెండుమంది’ అనే మూలంలోని సంక్షిప్త సూచనను నిలిపి, వివరణను పాదసూచికలో ఇచ్చాం.
