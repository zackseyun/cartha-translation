id: MRK.11.7
reference: Mark 11:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀φέρουσιν τὸν πῶλον πρὸς τὸν Ἰησοῦν, καὶ ⸀ἐπιβάλλουσιν αὐτῷ τὰ ἱμάτια αὐτῶν, καὶ ἐκάθισεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/007.yaml
  text: And they brought the colt to Jesus, and they threw their cloaks on it, and he sat on it.
translation:
  language: te
  text: వారు ఆ గాడిద పిల్లను యేసు దగ్గరికి తీసుకొచ్చి, దానిమీద తమ పైవస్త్రాలు వేశారు. ఆయన దానిమీద కూర్చున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶλον
  choice: గాడిద పిల్లను
  rationale: πῶλος సాధారణంగా చిన్న వాహన జంతువును సూచించగలదు; ఈ సందర్భంలోని మునుపటి వచనాలు దానిని గాడిద పిల్లగా స్పష్టం చేస్తున్నందున సహజమైన తెలుగులో ఇలా అనువదించబడింది.
- source_word: ἐπιβάλλουσιν
  choice: వేశారు
  rationale: వస్త్రాలను జంతువు మీద ఉంచడాన్ని సహజంగా తెలియజేస్తుంది; మూలంలోని చర్యను అనవసరంగా తీవ్రతరం చేయదు.
- source_word: ἱμάτια
  choice: పైవస్త్రాలు
  rationale: బయట ధరించే వస్త్రాలను సూచించే సందర్భోచితమైన, సాధారణ ఆధునిక తెలుగు పదం.
- source_word: ἐκάθισεν ἐπ’ αὐτόν
  choice: ఆయన దానిమీద కూర్చున్నాడు
  rationale: ఏకవచన పురుష కర్త యేసును, ఏకవచన నపుంసక సర్వనామం గాడిద పిల్లను సూచిస్తున్న నిర్మాణాన్ని స్పష్టమైన తెలుగులో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. మూలంలోని వరుస చర్యలను సహజమైన రెండు వాక్యాలుగా అందించాం; వ్యాఖ్యానాత్మక వివరాలు చేర్చలేదు.
