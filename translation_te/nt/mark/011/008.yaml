translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. గ్రీకులో రెండవ భాగంలో ప్రధాన క్రియ అధ్యాహారంగా ఉన్నందున, తెలుగులో స్పష్టత కోసం ‘పరిచారు’ అని పునరుక్తి చేయబడింది.
