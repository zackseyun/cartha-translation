source:
  edition: SBLGNT
  text: ⸂καὶ πολλοὶ⸃ τὰ ἱμάτια αὐτῶν ἔστρωσαν εἰς τὴν ὁδόν, ἄλλοι δὲ στιβάδας ⸂κόψαντες ἐκ τῶν ἀγρῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/008.yaml
  text: And many spread their cloaks on the road, and others spread leafy branches cut from the fields.
translation:
  language: te
  text: చాలామంది తమ పైవస్త్రాలను దారిమీద పరిచారు. మరికొందరు పొలాల నుండి కోసిన ఆకుకొమ్మలను[a] పరిచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కొమ్మలను’. ఇక్కడి గ్రీకు పదం కోసిన ఆకులు లేదా ఆకుకొమ్మల సమూహాలను విస్తృతంగా సూచిస్తుంది; ప్రత్యేకంగా ఖర్జూరపు కొమ్మలని కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: చాలామంది
  rationale: వ్యక్తులను సూచించే పరిమాణ విశేషణాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: ἱμάτια
  choice: పైవస్త్రాలు
  rationale: ఈ సందర్భంలో దారిమీద పరచిన బయటి వస్త్రాలను సూచిస్తుంది; సాధారణమైన ‘వస్త్రాలు’ కంటే సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἔστρωσαν
  choice: పరిచారు
  rationale: ఉపరితలంపై వస్త్రాలను లేదా ఆకులతో కూడిన కొమ్మలను పరచడాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: εἰς τὴν ὁδόν
  choice: దారిమీద
  rationale: εἰς అనే పదానికి అక్షరార్థంగా ‘లోనికి’ అనే భావం ఉన్నా, στρώννυμι క్రియతో కలిసి దారి ఉపరితలంపై ఉంచడమే ఇక్కడి సహజ భావం.
- source_word: ἄλλοι δὲ
  choice: మరికొందరు
  rationale: δέ సూచించే స్వల్ప వ్యత్యాసంతో కూడిన కొనసాగింపును అతిశయింపకుండా సహజంగా తెలియజేస్తుంది.
- source_word: στιβάδας
  choice: ఆకులతో కూడిన కొమ్మలు
  rationale: ఈ పదం కోసిన ఆకులు, పచ్చిక లేదా ఆకులతో కూడిన కొమ్మల గుట్టలను విస్తృతంగా సూచించగలదు. సందర్భానికి తగిన దృశ్యాన్ని అందిస్తూనే అవి ఖర్జూరపు కొమ్మలేనని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: κόψαντες ἐκ τῶν ἀγρῶν
  choice: పొలాల్లో కోసిన
  rationale: ప్రధాన చర్యకు ముందు జరిగిన కోయడాన్ని తెలుగులో సంక్షిప్తమైన విశేషణ పదబంధంగా సహజంగా వ్యక్తపరుస్తుంది.
