id: MRK.11.15
reference: Mark 11:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἱεροσόλυμα. καὶ ⸀εἰσελθὼν εἰς τὸ ἱερὸν ἤρξατο ἐκβάλλειν τοὺς πωλοῦντας καὶ ⸀τοὺς ἀγοράζοντας ἐν τῷ ἱερῷ, καὶ τὰς τραπέζας τῶν κολλυβιστῶν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστερὰς κατέστρεψεν
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/015.yaml
  text: And they came to Jerusalem. And entering the temple[a], he began to drive out those who were selling and those who were buying in the temple, and he overturned the tables of the money changers and the seats of those who were selling doves.
translation:
  language: te
  text: వారు యెరూషలేముకు వచ్చారు. ఆయన దేవాలయంలోకి[a] ప్రవేశించి, దేవాలయంలో అమ్ముతున్నవారిని, కొంటున్నవారిని వెళ్లగొట్టడం మొదలుపెట్టాడు. డబ్బు మార్చేవారి బల్లలను, పావురాలు అమ్మేవారి ఆసనాలను తలకిందులు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేవాలయ ప్రాంగణంలోకి’ లేదా ‘ఆలయ సముదాయంలోకి’; ఇక్కడి గ్రీకు పదం అంతర్గత పరిశుద్ధ మందిరాన్ని ప్రత్యేకంగా కాక, విస్తృత ఆలయ సముదాయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: వచ్చారు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, సహజమైన తెలుగు కథనశైలిలో గతకాల రూపం సంఘటనల క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: Ἱεροσόλυμα
  choice: యెరూషలేము
  rationale: స్థలనామానికి తెలుగులో స్థిరపడిన రూపాన్ని ఉపయోగించాం.
- source_word: εἰσελθὼν
  choice: ప్రవేశించి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను తెలుగు సంయుక్త క్రియారూపం సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: τὸ ἱερὸν / ἐν τῷ ἱερῷ
  choice: దేవాలయం / దేవాలయంలో
  rationale: ἱερόν అంతర్గత పరిశుద్ధ స్థలాన్ని మాత్రమే కాక విస్తృత ఆలయ సముదాయాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సుపరిచితమైన రూపాన్ని ఉంచి, దాని విస్తృత భావాన్ని పాదసూచికలో వివరించాం.
- source_word: ἤρξατο ἐκβάλλειν
  choice: వెళ్లగొట్టడం మొదలుపెట్టాడు
  rationale: చర్య ఆరంభాన్ని సూచించే ἤρξατο భావాన్ని నిలుపుతూ, ἐκβάλλειν యొక్క బలమైన అర్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τοὺς πωλοῦντας / τοὺς ἀγοράζοντας
  choice: అమ్ముతున్నవారిని / కొంటున్నవారిని
  rationale: రెండు వర్తమాన కృదంతాల కొనసాగుతున్న క్రియాభావాన్ని, వాటి సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: κολλυβιστῶν
  choice: డబ్బు మార్చేవారి
  rationale: ఆలయ ప్రాంతంలో నాణేలు లేదా కరెన్సీ మార్చే వ్యక్తులను సాధారణ పాఠకులకు స్పష్టంగా సూచిస్తుంది.
- source_word: καθέδρας
  choice: ఆసనాలను
  rationale: కుర్చీ, పీట లేదా బెంచీ అని అవసరానికి మించి నిర్దిష్టం చేయకుండా, మూలపదంలోని సాధారణ భావాన్ని నిలుపుతుంది.
- source_word: περιστερὰς
  choice: పావురాలు
  rationale: బలుల సందర్భానికి తగిన, తెలుగులో సహజమైన సాధారణ పదం.
- source_word: κατέστρεψεν
  choice: తలకిందులు చేశాడు
  rationale: బల్లలు, ఆసనాలను బలంగా బోర్లించిన చర్యను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఆలయ శుద్ధీకరణ కథనంలో ἱερόν సూచించే స్థల పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘దేవాలయం’ అని అనువదించి, అది విస్తృత ఆలయ సముదాయాన్ని సూచిస్తుందని పాదసూచికలో తెలిపాం.
  alternative: దేవాలయ ప్రాంగణం; ఆలయ ఆవరణలు
  rationale: ఈ గ్రీకు పదం అంతర్గత పరిశుద్ధ మందిరాన్ని మాత్రమే కాక ఆలయ సముదాయాన్ని సూచిస్తుంది. సుపరిచితమైన ప్రధాన పదాన్ని నిలుపుతూ, పాఠకులు అంతర్గత పరిశుద్ధ స్థలాన్నే ఊహించకుండా స్థలపరమైన సూక్ష్మభేదాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. మూలంలోని చర్యల క్రమం, అమ్మేవారు–కొనేవారు అనే సమాంతరత, చర్య ప్రారంభాన్ని తెలిపే భావం నిలుపబడ్డాయి.
