revisions:
- from: మరియు సువార్తను ముందుగా అన్ని జనాలకు ప్రకటించాలి[a][b].
  to: మరియు సువార్త ముందుగా అన్ని జనాంగాలకు ప్రకటించబడాలి[a][b].
  rationale: The revision retains the source’s sequence (“ముందుగా”), necessity (the -బడాలి construction), and universal scope. It uses an explicit passive for κηρυχθῆναι and “జనాంగాలు” for ἔθνη, while the footnote preserves the possible “among” sense and the context-dependent “Gentiles” sense without imposing it on the main text.
  reviewer_model: gpt-5.6-terra
