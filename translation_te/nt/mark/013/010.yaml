review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the connective, temporal priority, necessity, proclamation, and broad scope of the Greek. However, revising the main clause to an explicit passive construction better reflects κηρυχθῆναι (“be proclaimed”), and “జనాంగాలు” more precisely represents ἔθνη as nations/peoples than the less specific “జనాలు.”
  naturalness: “సువార్త ముందుగా అన్ని జనాంగాలకు ప్రకటించబడాలి” is clear, idiomatic modern standard Telugu, with an appropriately formal but accessible scriptural register.
  terminology: “సువార్త” is established Telugu Christian terminology for εὐαγγέλιον; footnote a supplies its literal sense. “జనాంగాలు” preserves the ethnic-national breadth of ἔθνη without narrowing it in the main text to non-Jews. The draft’s lexical-decision entry “చాలి” is a typo/inaccurate form for δεῖ, though it does not occur in the displayed translation; the revised wording resolves the underlying expression of necessity.
  issues:
  - severity: medium
    issue: The text uses “అన్ని జనాలకు,” which can mean all people rather than all nations/peoples.
    rationale: ἔθνη here naturally carries the broad collective sense “nations/peoples.” “అన్ని జనాంగాలకు” more closely preserves this scope while avoiding an unwarranted restriction to “Gentiles.”
  - severity: low
    issue: The main clause is phrased with an active-style Telugu necessity construction (“ప్రకటించాలి”).
    rationale: This is intelligible and can express the sense, but “ప్రకటించబడాలి” more directly preserves the passive κηρυχθῆναι without making an unspecified agent implicit.
  - severity: low
    issue: The lexical rationale lists “చాలి” as the choice for δεῖ.
    rationale: “చాలి” is not the appropriate Telugu expression here. The revised text expresses δεῖ through “ప్రకటించబడాలి” (“must be proclaimed”).
  revised_text: మరియు సువార్త ముందుగా అన్ని జనాంగాలకు ప్రకటించబడాలి[a][b].
  revised_footnotes:
