  yaml_path: translation/nt/mark/013/010.yaml
  text: And the good news must first be proclaimed to all the nations[a][b].
translation:
  language: te
  text: మరియు సువార్త ముందుగా అన్ని జనాంగాలకు ప్రకటించబడాలి[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మంచి వార్తను.” గ్రీకు εὐαγγέλιον అనే పదానికి అక్షరార్థం “మంచి వార్త.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అన్ని జనాంగాల మధ్య”; కొన్ని సందర్భాల్లో ἔθνη అనే గ్రీకు పదానికి “యూదేతరులు” అనే అర్థం కూడా ఉంటుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: మరియు
  rationale: మునుపటి ప్రసంగాన్ని కొనసాగించే అనుసంధాన భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: అన్ని జనాలకు
  rationale: εἰς దిశను లేదా పరిధిని సూచించగలదు; ἔθνη జాతులను లేదా యూదేతరులను సూచించగలదు. ఇక్కడ విస్తృతమైన ప్రపంచవ్యాప్త పరిధిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πρῶτον
  choice: ముందుగా
  rationale: కాలక్రమ ప్రాధాన్యాన్ని స్పష్టంగా తెలియజేస్తుంది; ఆ తరువాతి క్రమం గురించి అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: δεῖ
  choice: చాలి
  rationale: దైవిక లేదా అంత్యకాలిక అవసరత ఉండవచ్చనే భావాన్ని కొట్టివేయకుండా, దాని మూలాన్ని స్పష్టంగా చెప్పకుండా అవసరతను సహజ తెలుగులో నిలుపుతుంది.
- source_word: κηρυχθῆναι
  choice: ప్రకటించాలి
  rationale: బహిరంగంగా సందేశాన్ని చాటిచెప్పే అర్థాన్ని ఆధునిక, సహజ తెలుగులో అందిస్తుంది; గ్రీకు కర్మణి రూపపు భావం తెలుగు అవసరత నిర్మాణంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: τὸ εὐαγγέλιον
  choice: సువార్తను
  rationale: ‘మంచి వార్త’ అనే మూలార్థాన్ని మోసే, తెలుగు క్రైస్తవ వాడుకలో విస్తృతంగా గుర్తించబడే సహజ పదం.
theological_decisions:
- issue: ἔθνη యొక్క పరిధి
  choice: అన్ని జనాలకు
  alternative: అన్ని జనాల మధ్య; యూదేతరులందరికీ
  rationale: ప్రపంచవ్యాప్త విస్తృతిని నిలుపుతూ, ఈ సందర్భంలో స్పష్టంగా లేని యూదులు–యూదేతరులు అనే సంకుచిత వ్యత్యాసాన్ని అనవసరంగా ప్రవేశపెట్టదు. ప్రత్యామ్నాయ భావాలను పాదసూచిక తెలియజేస్తుంది.
- issue: δεῖ యొక్క బలం
  choice: ప్రకటించాలి
  alternative: ప్రకటించబడడం అవసరం
  rationale: గ్రీకు పదంలోని అవసరతను నిలుపుతుంది; అది దైవిక అవసరత అని వచనం ఇక్కడ ప్రత్యక్షంగా చెప్పనందున ఆ వివరణను ప్రధాన పాఠ్యంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘సువార్త’ పరిచితమైన పదమైనప్పటికీ దాని మూలార్థాన్ని పాదసూచికలో ఇచ్చాం. [a], [b] గుర్తులు రెండూ ప్రధాన పాఠ్యంలో ఉన్నాయి.
