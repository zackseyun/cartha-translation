    reason: alternative_reading
  revision_rationale: The revision retains the source’s sequence (“ముందుగా”), necessity (the -బడాలి construction), and universal scope. It uses an explicit passive for κηρυχθῆναι and “జనాంగాలు” for ἔθνη, while the footnote preserves the possible “among” sense and the context-dependent “Gentiles” sense without imposing it on the main text.
