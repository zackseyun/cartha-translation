    text: లేదా “కాపలా కాస్తూ ఉండండి” లేదా “అప్రమత్తంగా ఉండండి.”
    reason: lexical_alternative
  revision_rationale: 'The revision changes only the Telugu case expressions for the two dative recipients, preserving the source’s contrast and universalizing scope: “what I say to you, I say to all.” The repeated saying verb and the imperative’s wakefulness metaphor remain intact.'
