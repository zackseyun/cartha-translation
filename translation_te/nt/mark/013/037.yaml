- from: 'నేను మీతో చెప్పేది అందరితోనూ చెబుతున్నాను: మెలకువగా ఉండండి.[a]'
  to: 'నేను మీకు చెప్పేది అందరికీ చెబుతున్నాను: మెలకువగా ఉండండి.[a]'
  rationale: 'The revision changes only the Telugu case expressions for the two dative recipients, preserving the source’s contrast and universalizing scope: “what I say to you, I say to all.” The repeated saying verb and the imperative’s wakefulness metaphor remain intact.'
