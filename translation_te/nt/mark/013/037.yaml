  text: ⸀ὃ δὲ ὑμῖν λέγω πᾶσιν λέγω· γρηγορεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/037.yaml
  text: 'And what I say to you I say to all: stay awake[a].'
translation:
  language: te
  text: 'నేను మీకు చెప్పేది అందరికీ చెబుతున్నాను: మెలకువగా ఉండండి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కాపలా కాస్తూ ఉండండి” లేదా “అప్రమత్తంగా ఉండండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: చెప్పేది
  rationale: నపుంసక ఏకవచన సంబంధ సర్వనామం ఇక్కడ పదార్థవాచకంగా ఉంది; λέγωతో కలిపి సహజమైన ఆధునిక తెలుగులో “నేను ... చెప్పేది” అని వ్యక్తమవుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ ఇక్కడ స్వల్ప అనుసంధానకమైనది. తెలుగు వాక్యప్రవాహంలో అదనంగా “మరి” లేదా “అయితే” చేర్చితే మూలంలో లేని వ్యతిరేక భావం బలపడవచ్చు; వాక్యసంబంధం సందర్భం ద్వారానే స్పష్టమవుతుంది.
- source_word: ὑμῖν
  choice: మీతో
  rationale: రెండవ పురుష బహువచన దత్తివిభక్తిని సహజ తెలుగు ప్రయోగంలో “మీతో చెప్పేది”గా ఇచ్చాం; ఇది మొదట ప్రత్యక్ష శిష్యులను ఉద్దేశించిన మాటను సూచిస్తుంది.
- source_word: λέγω ... λέγω
  choice: చెప్పేది ... చెబుతున్నాను
  rationale: గ్రీకులోని పునరుక్తి, వాక్య నిర్మాణం నిలిచేలా తెలుగులో సహజమైన కాలరూపాలతో రెండుసార్లూ “చెప్పు” ధాతువునే ఉపయోగించాం.
- source_word: πᾶσιν
  choice: అందరితోనూ
  rationale: సంక్షిప్తమైన, సమగ్ర పరిధిని తెలిపే దత్తివిభక్తి భావాన్ని “అందరితోనూ” సహజంగా అందిస్తుంది; “నూ” మొదటి శ్రోతల నుంచి అందరికీ విస్తరణను స్పష్టం చేస్తుంది.
- source_word: γρηγορεῖτε
  choice: మెలకువగా ఉండండి
  rationale: వర్తమాన ఆజ్ఞార్థక బహువచనం నిరంతర అప్రమత్తతను కోరుతుంది. “మెలకువగా ఉండండి” నిద్రపోకుండుట అనే రూపకాన్ని నిలుపుతూ సందర్భంలోని జాగరూకత భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యేసు ఇచ్చిన హెచ్చరిక పరిధి
  choice: మొదట శిష్యులతో చెప్పిన మాటను యేసు అందరికీ వర్తింపజేస్తున్నట్లు అనువదించాం.
  alternative: కథన సందర్భంలోని ప్రత్యక్ష శ్రోతలకే ఇది పరిమితమని భావించడం.
  rationale: గ్రీకు పాఠం ὑμῖν (“మీతో”) మరియు πᾶσιν (“అందరితోనూ”) మధ్య స్పష్టమైన విస్తరణను చూపుతుంది; దానిని సంకుచితం చేయకుండా అనువాదంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం వాడబడింది. మూలంలోని సంక్షిప్తత, పునరుక్తి, చివరి ఆజ్ఞ యొక్క బలం నిలుపబడ్డాయి.
