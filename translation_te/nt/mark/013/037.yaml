review_pass:
  verdict: revise
  source_fidelity: The draft preserves the substantive relative sense of ὃ, the deliberate repetition of λέγω, the expansion from the immediate addressees (ὑμῖν) to all (πᾶσιν), and the ongoing plural imperative γρηγορεῖτε. However, “మీతో/అందరితోనూ చెబుతున్నాను” normally means “I am speaking with you/all,” whereas λέγω with the dative means “say to.”
  naturalness: The wording is otherwise clear and modern, but replacing the comitative forms with dative-recipient forms makes the sentence both more idiomatic and more exact in Telugu.
  terminology: “మెలకువగా ఉండండి” is an appropriate, natural rendering of γρηγορεῖτε and retains the wakefulness imagery. The lexical-alternative footnote is suitable.
  issues:
  - severity: medium
    issue: Recipient dative rendered with comitative postposition
    rationale: The Greek ὑμῖν and πᾶσιν are recipients of λέγω (“to you,” “to all”), not companions in conversation. Telugu “మీతో” and “అందరితోనూ” can shift this to “with you/all.” Use “మీకు” and “అందరికీ.”
  revised_text: 'నేను మీకు చెప్పేది అందరికీ చెబుతున్నాను: మెలకువగా ఉండండి.[a]'
  revised_footnotes:
