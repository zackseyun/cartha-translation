source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένου αὐτοῦ ἐκ τοῦ ἱεροῦ λέγει αὐτῷ εἷς τῶν μαθητῶν αὐτοῦ· Διδάσκαλε, ἴδε ποταποὶ λίθοι καὶ ποταπαὶ οἰκοδομαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/001.yaml
  text: And as he was going out of the temple[a], one of his disciples says to him, “Teacher[b], look—what wonderful stones and what wonderful buildings!”
translation:
  language: te
  text: ఆయన దేవాలయం[a] నుండి బయటికి వెళ్తుండగా, ఆయన శిష్యులలో ఒకడు ఆయనతో, “బోధకుడా, చూడు! ఎంత గొప్ప రాళ్లు! ఎంత గొప్ప కట్టడాలు!” అంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదమైన ἱερόν అంతర్గత పరిశుద్ధస్థలాన్ని మాత్రమే కాకుండా దేవాలయ సముదాయాన్ని లేదా దాని ఆవరణలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ
  choice: ఆయన ... బయటికి వెళ్తుండగా
  rationale: వర్తమాన కృదంతంతో కూడిన genitive absolute ప్రధాన క్రియతో సమకాలీనంగా కొనసాగుతున్న చర్యను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: τοῦ ἱεροῦ
  choice: దేవాలయ ప్రాంగణం
  rationale: ἱερόν అంతర్గత పరిశుద్ధ స్థలాన్ని మాత్రమే కాకుండా విశాలమైన దేవాలయ సముదాయాన్ని లేదా ఆవరణాన్ని సూచిస్తుంది; ‘ప్రాంగణం’ ఆ విస్తృత అర్థాన్ని స్పష్టం చేస్తుంది.
- source_word: λέγει
  choice: అన్నాడు
  rationale: ఇది మార్కు ఉపయోగించిన చారిత్రక వర్తమాన కాలం. ఆధునిక తెలుగు కథనంలో సహజమైన భూతకాల రూపం వాడినా, సంఘటనలోని ప్రత్యక్షతను సంభాషణ నిలుపుతుంది.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: ఆయన శిష్యులలో ఒకడు
  rationale: భాగార్థక గ్రీకు నిర్మాణాన్ని స్పష్టంగా, నేరుగా అనువదిస్తుంది.
- source_word: Διδάσκαλε
  choice: బోధకుడా
  rationale: సంబోధనలో ‘బోధించేవాడు’ అనే అర్థాన్ని సహజంగా తెలియజేస్తుంది; ఇక్కడ ప్రభువు లేదా యజమాని అనే అదనపు భావాన్ని చేర్చదు.
- source_word: ἴδε
  choice: చూడు
  rationale: దృష్టిని ఆకర్షించే ఆజ్ఞార్థక రూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ποταποὶ ... καὶ ποταπαὶ
  choice: ఎంత గొప్ప ... ఎంత గొప్ప ...
  rationale: ποταπός ఇక్కడ వాటి స్వభావం లేదా పరిమాణం చూసి కలిగిన ఆశ్చర్యం, ప్రశంసను వ్యక్తం చేస్తుంది. ‘ఎంత గొప్ప’ ఆ ఉద్ఘాటనను సహజంగా నిలుపుతూ ‘అద్భుతమైన’ అనే మరింత వ్యాఖ్యానాత్మక పదాన్ని నివారిస్తుంది.
- source_word: λίθοι
  choice: రాళ్లు
  rationale: దేవాలయ నిర్మాణంలో ఉపయోగించిన భారీ రాళ్లకు సరళమైన, సహజమైన తెలుగు పదం.
- source_word: οἰκοδομαί
  choice: కట్టడాలు
  rationale: దేవాలయ సముదాయంలోని అనేక నిర్మాణాలను సూచించే బహువచనానికి ‘కట్టడాలు’ సముచితంగా సరిపోతుంది.
