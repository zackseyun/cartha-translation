  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన కథన శైలి, అయితే గౌరవప్రదమైన బైబిలు భాషను నిలుపుకుంది. శిష్యుని ఆశ్చర్యాన్ని రెండు ఉద్ఘాటక వాక్యాలతో వ్యక్తం చేసింది.
