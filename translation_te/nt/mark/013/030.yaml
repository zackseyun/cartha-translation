  verdict: approve
  source_fidelity: ‘నేను మీతో నిజంగా చెబుతున్నాను’ ἀμὴν λέγω ὑμῖν యొక్క గంభీరమైన ప్రత్యక్ష ప్రకటనను సరిగ్గా తెలియజేస్తుంది. ‘ఈ తరం’ ἡ γενεὰ αὕτηను వ్యాఖ్యానాత్మకంగా విస్తరించకుండా నిలుపుతుంది. ‘ఇవన్నీ జరిగేంతవరకు’ μέχρις οὗ ταῦτα πάντα γένηταιను, అలాగే ‘ఎంతమాత్రమూ గతించదు’ οὐ μὴ παρέλθῃ యొక్క బలమైన నిషేధాన్ని విశ్వసనీయంగా ప్రతిబింబిస్తాయి.
