  terminology: ‘నిజంగా,’ ‘ఈ తరం,’ ‘ఇవన్నీ,’ మరియు ‘ఎంతమాత్రమూ’ సందర్భానుకూలమైన పదాలు. ‘ఈ తరం’కు ప్రత్యామ్నాయ విస్తృత అర్థాలను పాదసూచికలో మాత్రమే ఉంచడం మూలపాఠంలోని వివాదాస్పదతను కాపాడుతుంది. పాదసూచిక గుర్తులు సరైన స్థానాల్లో ఉన్నాయి.
