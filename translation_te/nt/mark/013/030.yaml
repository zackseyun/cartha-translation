  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη μέχρις οὗ ⸂ταῦτα πάντα⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/030.yaml
  text: Truly I say to you that this generation will certainly not pass away until all these things happen[a][b].
translation:
  language: te
  text: 'నేను మీతో నిజంగా చెబుతున్నాను: ఇవన్నీ జరిగేంతవరకు ఈ తరం ఎంతమాత్రమూ గతించదు[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఈ ప్రజలు’, ‘ఈ జాతి’; గ్రీకు γενεά అనే పదానికి ఈ విస్తృత అర్థాలు కూడా సాధ్యమే. అయితే ఇక్కడ ‘తరం’ అనేదే అత్యంత సహజమైన అనువాదం.
    reason: lexical_alternative
  - marker: b
    text: ‘ఎంతమాత్రమూ గతించదు’ అనే మాట గ్రీకులోని బలమైన నిషేధాన్ని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: నిజంగా
  rationale: గంభీరమైన, అధికారపూర్వకమైన ప్రకటనను పరిచయం చేసే పదం; ఆధునిక తెలుగులో సహజంగా దాని బలాన్ని తెలియజేస్తుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో చెబుతున్నాను
  rationale: ప్రత్యక్ష సంబోధనను, గ్రీకు వాక్య నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: οὐ μὴ παρέλθῃ
  choice: ఎంతమాత్రమూ గతించదు
  rationale: οὐ μή అనే బలమైన గ్రీకు నిషేధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἡ γενεὰ αὕτη
  choice: ఈ తరం
  rationale: ఈ సందర్భంలో γενεάకు అత్యంత సహజమైన అర్థం; వివాదాస్పదమైన వ్యాఖ్యానాన్ని అనువాదంలో ముందుగానే పరిష్కరించదు.
- source_word: μέχρις οὗ
  choice: జరిగేంతవరకు
  rationale: కాలపరమైన హద్దును తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ταῦτα πάντα
  choice: ఇవన్నీ
  rationale: బహువచన సూచనతో పాటు ‘అన్నీ’ అనే సమగ్ర భావాన్ని సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: γένηται
  choice: జరిగే
  rationale: ఈ సంఘటనలు సంభవించడాన్ని ఆధునిక తెలుగులో సూటిగా తెలియజేస్తుంది.
theological_decisions:
- issue: అంత్యకాల ప్రసంగంలో ἡ γενεὰ αὕτη అనే పదబంధం అర్థం
  choice: ‘ఈ తరం’ అని సూటిగా అనువదించడం
  alternative: ‘ఈ ప్రజలు/ఈ జాతి’ లేదా సూచనలు మొదలవడాన్ని చూసే భవిష్యత్ తరం
  rationale: గ్రీకు పదబంధానికి ‘ఈ తరం’ అనేదే అత్యంత సహజమైన పఠనం. విస్తృతంగా చర్చించబడే ఈ అంశాన్ని ఏదైనా ప్రత్యేక అంత్యకాల సిద్ధాంతం వైపు మళ్లించకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘గతించదు’ వాక్యంలోని కాలసంబంధ రూపకాన్ని నిలుపుతుంది; పాదసూచికలు పదార్థంలోని నిజమైన ప్రత్యామ్నాయాలనూ నిషేధ బలాన్నీ వివరిస్తాయి.
