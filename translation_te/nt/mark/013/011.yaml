id: MRK.13.11
reference: Mark 13:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂καὶ ὅταν⸃ ⸀ἄγωσιν ὑμᾶς παραδιδόντες, μὴ προμεριμνᾶτε τί ⸀λαλήσητε, ἀλλ’ ὃ ἐὰν δοθῇ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τοῦτο λαλεῖτε, οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τὸ ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/011.yaml
  text: And when they lead you away and hand you over[a], do not worry beforehand about what you should say; but whatever is given to you in that hour, speak that. For it is not you who are speaking[b], but the Holy Spirit.
translation:
  language: te
  text: వారు మిమ్మల్ని తీసుకెళ్లి అప్పగించినప్పుడు, ఏమి మాట్లాడాలో ముందుగా ఆందోళనపడకండి. ఆ సమయంలో మీకు ఏది ఇవ్వబడుతుందో అదే మాట్లాడండి. ఎందుకంటే మాట్లాడేది మీరు కాదు, పరిశుద్ధాత్మే.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὅταν
  choice: వారు ... అప్పగించినప్పుడు
  rationale: భవిష్యత్తులో ఎదురయ్యే పరిస్థితిని సూచించే ὅταν భావాన్ని సహజమైన తెలుగు కాలవాచక నిర్మాణంతో తెలిపింది; వాక్యారంభంలోని καίను తెలుగులో ప్రత్యేకంగా అనువదించకపోవడం ప్రవాహానికి సహజం.
- source_word: ἄγωσιν ὑμᾶς παραδιδόντες
  choice: వారు మిమ్మల్ని తీసుకెళ్లి అధికారులకు అప్పగించినప్పుడు
  rationale: ἄγωσινలోని బలవంతంగా తీసుకెళ్లే భావాన్నీ, παραδιδόντεςలోని అదుపులోకి అప్పగించే న్యాయపరమైన భావాన్నీ సహజంగా తెలిపింది. సందర్భం స్పష్టం చేయడానికి ‘అధికారులకు’ చేర్చబడింది; ‘ద్రోహం చేయడం’ అనే మరింత సంకుచిత భావాన్ని నివారించింది.
- source_word: μὴ προμεριμνᾶτε
  choice: ముందుగా ఆందోళనపడకండి
  rationale: προ-లోని ముందస్తు కాలభావాన్నీ, μεριμνάωలోని కలవరపడే భావాన్నీ నిలుపుతుంది.
- source_word: τί λαλήσητε
  choice: ఏమి మాట్లాడాలో
  rationale: λαλέωను సాధారణమైన ‘మాట్లాడు’తో అనువదించి, తరువాతి λαλεῖτε మరియు οἱ λαλοῦντεςతో పదబంధ అనుసరణను కాపాడింది.
- source_word: ὃ ἐὰν δοθῇ ὑμῖν
  choice: మీకు ఏది ఇవ్వబడుతుందో
  rationale: కర్తను పేర్కొనని గ్రీకు కర్మణి ప్రయోగాన్ని నిలిపి, ఇచ్చేది దేవుడే అని అనువాదంలో అదనంగా స్పష్టీకరించలేదు.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: ఆ సమయంలో
  rationale: అక్షరార్థమైన ‘ఆ గంటలో’ కంటే ఆధునిక తెలుగులో సహజంగా ఉండి, నిర్ణాయక సందర్భాన్ని సూచిస్తుంది.
- source_word: τοῦτο λαλεῖτε
  choice: అదే మాట్లాడండి
  rationale: τοῦτοలోని నిర్దిష్ట ఉద్ఘాటనను ‘అదే’తో నిలిపి, ఇవ్వబడినదానినే పలకాలని స్పష్టం చేసింది.
- source_word: οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες
  choice: ఎందుకంటే మాట్లాడేది మీరు కాదు
  rationale: ὑμεῖςపై ఉన్న ఉద్ఘాటనను సహజమైన తెలుగు విరుద్ధ నిర్మాణంలో కాపాడింది.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: పరిశుద్ధాత్మే
  rationale: ప్రామాణిక ఆధునిక తెలుగు పదాన్ని వాడి, గ్రీకులోని ‘మీరు కాదు—పరిశుద్ధాత్మ’ అనే వ్యత్యాసాన్ని ‘-ఏ’ ఉద్ఘాటనతో తెలిపింది.
theological_decisions:
- issue: హింస సమయంలో పలికే మాటల్లో దైవిక మరియు మానవ కార్యసాధకత్వం
  choice: శిష్యులు నిజంగా మాట్లాడాలని ఆజ్ఞ పొందుతారు; అయినా ఆ మాటలకు అంతిమ కార్యసాధకుడు పరిశుద్ధాత్మ అని వాక్యం చెబుతుంది.
  alternative: శిష్యులు పూర్తిగా నిష్క్రియమైన యంత్రాలుగా ఉండే నిర్బంధిత ఉక్తి నమూనా; లేదా పరిశుద్ధాత్మను కేవలం సాధారణ దైవిక ప్రభావంగా చూడడం.
  rationale: ‘మీకు ఇవ్వబడుతుంది’, ‘మాట్లాడండి’, ‘మాట్లాడేది మీరు కాదు, పరిశుద్ధాత్మే’ అనే మూడు అంశాలనూ అనువాదం నిలుపుతుంది. అందువల్ల మానవ భాగస్వామ్యాన్నీ దైవిక కార్యసాధకత్వాన్నీ ఒకదానితో మరొకటి రద్దు చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైనదిగా, అయితే గంభీరతను నిలిపే శైలి. ‘అదే’ మరియు ‘పరిశుద్ధాత్మే’ ద్వారా మూలంలోని ఉద్ఘాటనను సహజంగా వ్యక్తం చేసింది.
