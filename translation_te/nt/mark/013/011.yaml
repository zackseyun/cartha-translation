review_pass:
  verdict: revise
  source_fidelity: The translation accurately conveys the prohibition against prior anxiety, the passive divine provision of words, the command to speak those words, and the contrast between the disciples and the Holy Spirit. However, ‘అధికారులకు’ (“to the authorities”) is not stated in the Greek. Although authorities are implied by the wider setting, this verse says only that they are led and handed over.
  naturalness: The Telugu is clear, idiomatic modern standard Telugu, and appropriately solemn. ‘ఆ సమయంలో,’ ‘ముందుగా ఆందోళనపడకండి,’ and ‘అదే మాట్లాడండి’ are natural and preserve the sense well.
  terminology: ‘పరిశుద్ధాత్మ’ is standard modern Telugu terminology for τὸ πνεῦμα τὸ ἅγιον. The emphatic ‘-ఏ’ in ‘పరిశుద్ధాత్మే’ effectively represents the Greek contrast. ‘మాట్లాడండి’ consistently renders λαλέω naturally.
  issues:
  - severity: medium
    issue: The phrase ‘అధికారులకు’ has been added to the rendering of παραδιδόντες.
    rationale: The Greek text contains no expressed recipient of the handing over. The legal/persecutory context may suggest authorities, but adding them narrows and supplements the verse’s wording. Removing the addition preserves the source’s stated ambiguity.
  revised_text: వారు మిమ్మల్ని తీసుకెళ్లి అప్పగించినప్పుడు, ఏమి మాట్లాడాలో ముందుగా ఆందోళనపడకండి. ఆ సమయంలో మీకు ఏది ఇవ్వబడుతుందో అదే మాట్లాడండి. ఎందుకంటే మాట్లాడేది మీరు కాదు, పరిశుద్ధాత్మే.
  revised_footnotes: []
  revision_rationale: Removed the unstated ‘అధికారులకు’ in order to preserve the Greek wording without importing a contextual inference. All other wording is retained because it faithfully and naturally represents the source, including the passive ‘మీకు ... ఇవ్వబడుతుందో’ and the emphatic final contrast.
