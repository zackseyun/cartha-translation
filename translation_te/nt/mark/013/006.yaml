source:
  edition: SBLGNT
  text: ⸀πολλοὶ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες ὅτι Ἐγώ εἰμι, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/006.yaml
  text: Many will come in my name[a], saying, ‘I am he,’ and they will lead many astray.
translation:
  language: te
  text: చాలామంది నా పేరుతో వచ్చి, ‘నేనే ఆయనను’[a] అని చెబుతూ, చాలామందిని తప్పుదారి పట్టిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేనే.” గ్రీకు పాఠంలో “ఆయనను” అనే విధేయపదం స్పష్టంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: చాలామంది
  rationale: వ్యక్తులను సూచించే నామవాచకార్థ విశేషణం; ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ἐλεύσονται
  choice: వస్తారు
  rationale: ἔρχομαι భవిష్యత్ రూపానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: నా పేరుతో
  rationale: యేసు పేరును ఆధారంగా చేసుకొని లేదా ఆయనతో సంబంధం/అధికారం ఉందని చెప్పుకుంటూ రావడం అనే భావాన్ని సహజమైన తెలుగు నుడికారంలో వ్యక్తం చేస్తుంది.
- source_word: λέγοντες
  choice: అని చెబుతూ
  rationale: వారు ఎలా వస్తారో, ఏమని అంటారో తెలిపే వర్తమాన కృదంత భావాన్ని నిలుపుతుంది.
- source_word: ὅτι Ἐγώ εἰμι
  choice: ‘నేనే ఆయనను’
  rationale: సందర్భంలో తమను యేసే అని గుర్తింపజేసుకునే వాదనను తెలుగులో అర్థమయ్యేలా చేస్తుంది; గ్రీకులో విధేయపదం లేకపోవడం వల్ల ఉన్న అస్పష్టతను పాదసూచికలో నిలుపుతుంది.
- source_word: πολλοὺς
  choice: చాలామందిని
  rationale: క్రియకు కర్మగా ఉన్న అనిర్దిష్ట బహువచన వ్యక్తులను స్పష్టంగా సూచిస్తుంది; ఆరంభంలోని చాలామందితో పదసామ్యాన్ని నిలుపుతుంది.
- source_word: πλανήσουσιν
  choice: తప్పుదారి పట్టిస్తారు
  rationale: సత్యం నుండి దారి మళ్లించడం అనే πλανάω యొక్క రూపక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: తప్పుడు హక్కుదారుల సందర్భంలో Ἐγώ εἰμι అనువాదం
  choice: నేనే ఆయనను
  alternative: నేనే
  rationale: ఈ సందర్భంలో వక్తలు యేసుకు చెందిన గుర్తింపు లేదా పాత్ర తమదని చెప్పుకుంటున్న భావాన్ని ప్రధాన పాఠం స్పష్టంగా తెలియజేస్తుంది. అయితే గ్రీకులో విధేయపదం స్పష్టంగా లేదు కాబట్టి, దానిని సిద్ధాంతపరంగా అతిగా నిర్దిష్టం చేయకుండా మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘నా పేరుతో’ మరియు ‘తప్పుదారి పట్టిస్తారు’ వంటి సహజ నుడికారాలు ఉపయోగించబడ్డాయి; మూలంలోని Ἐγώ εἰμι అస్పష్టత పాదసూచికలో భద్రపరచబడింది.
