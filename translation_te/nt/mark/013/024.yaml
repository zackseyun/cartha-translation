id: MRK.13.24
reference: Mark 13:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀλλὰ ἐν ἐκείναις ταῖς ἡμέραις μετὰ τὴν θλῖψιν ἐκείνην ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/024.yaml
  text: But in those days[a], after that tribulation, the sun will be darkened, and the moon will not give its light,
translation:
  language: te
  text: అయితే ఆ రోజుల్లో, ఆ శ్రమ[a] తర్వాత సూర్యుడు చీకటిపడతాడు; చంద్రుడు తన వెలుగును ఇవ్వడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆ కష్టకాలం తర్వాత” లేదా “ఆ బాధ తర్వాత.”
    reason: θλῖψις అనే పదానికి సందర్భానుసారంగా ‘శ్రమ,’ ‘కష్టకాలం,’ లేదా ‘బాధ’ అనే అర్థాలు ఉండవచ్చు.
lexical_decisions:
- source_word: Ἀλλὰ
  choice: అయితే
  rationale: ముందటి వాక్యభాగంతో ఉన్న బలమైన వ్యత్యాసాన్ని లేదా కొత్త మలుపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: ఆ రోజుల్లో
  rationale: గ్రీకు కాలసూచక పదబంధాన్ని సంక్షిప్తంగా, సహజంగా, దాని అంత్యకాల స్వరాన్ని నిలుపుతూ అందిస్తుంది.
- source_word: μετὰ τὴν θλῖψιν ἐκείνην
  choice: ఆ శ్రమ తర్వాత
  rationale: μετά యొక్క కాలార్థమైన ‘తర్వాత’ను, ἐκείνην యొక్క నిర్దిష్టతను నిలుపుతుంది. ‘శ్రమ’ అనేది θλῖψις‌లోని బాధ, ఒత్తిడి, సంకట భావాలను ఏదో ఒక అంత్యకాల సిద్ధాంతానికి పరిమితం చేయకుండా మోస్తుంది.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: సూర్యుడు చీకటిపడతాడు
  rationale: భవిష్య సూచనను స్పష్టంగా ఉంచుతూ, గ్రీకు భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; అక్షరార్థక కర్మణి రూపం తెలుగులో కృత్రిమంగా వినిపిస్తుంది.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: చంద్రుడు తన వెలుగును ఇవ్వడు
  rationale: ‘ఇవ్వడు’ అనే రూపం గ్రీకులోని δίδωμι యొక్క సజీవ చిత్రణను నిలుపుతుంది; ‘తన వెలుగు’ φέγγος αὐτῆς‌ను స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: అంత్యకాల ప్రసంగంలో θλῖψις అనువాదం
  choice: శ్రమ
  alternative: కష్టకాలం; బాధ
  rationale: ‘శ్రమ’ మూలపదంలోని తీవ్రమైన సంకట భావాన్ని, సందర్భంలోని అంత్యకాల గంభీరతను నిలుపుతుంది; అయితే పాఠ్యంలో లేని ప్రత్యేక అంత్యకాల వ్యవస్థను లేదా ‘మహా’ అనే అదనపు విశేషణాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. ప్రవచనాత్మక గంభీరతను ఉంచుతూ అనవసరమైన పారిభాషిక పదజాలాన్ని నివారించాం.
