  yaml_path: translation/nt/mark/013/004.yaml
  text: Tell us[a], when will these things be, and what will be the sign when all these things are about to be accomplished?
translation:
  language: te
  text: “మాకు చెప్పండి, ఇవి ఎప్పుడు జరుగుతాయి? ఈ సంగతులన్నీ నెరవేరబోతున్నప్పుడు[a] ఏ సంకేతం ఉంటుంది?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ సంగతులన్నీ నెరవేరేటప్పుడు.” గ్రీకులో μέλλῃ అనే క్రియ అనంతరూపంతో కలిసి ఉంది; అది మరింత నిర్దిష్టంగా “నెరవేరబోతున్నప్పుడు” అనే రాబోయే/ఆసన్న భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰπὸν ἡμῖν
  choice: మాకు చెప్పండి
  rationale: ఆజ్ఞార్థక రూపాన్ని గౌరవపూర్వకమైన సహజ తెలుగు అభ్యర్థనగా ఇచ్చి, ἡμῖν అనే పరోక్ష కర్మను ‘మాకు’గా నిలిపింది.
- source_word: πότε ταῦτα ἔσται
  choice: ఇవి ఎప్పుడు జరుగుతాయి
  rationale: ἔσται అక్షరార్థంగా ‘ఉంటాయి’ అయినా, సంఘటనలను సూచించే ఈ సందర్భంలో ‘జరుగుతాయి’ సహజంగా ఉండి భావాన్ని అనవసరంగా విస్తరించదు.
- source_word: σημεῖον
  choice: సూచన
  rationale: రాబోయే సంఘటనలను గుర్తించేందుకు తోడ్పడే గుర్తు లేదా సంకేతం అనే భావాన్ని ఆధునిక సాధారణ తెలుగులో ‘సూచన’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: μέλλῃ
  choice: కాబోతున్నప్పుడు
  rationale: μέλλωతో కూడిన క్రియార్థక రూపంలో ఉన్న సమీప భవిష్యత్తు లేదా ఆసన్నత భావాన్ని సాధారణ భవిష్యత్తుగా చదును చేయకుండా నిలుపుతుంది.
- source_word: ταῦτα συντελεῖσθαι πάντα
  choice: ఇవన్నీ పూర్తి కాబోతున్నప్పుడు
  rationale: πάντα–ταῦτα కలయికను ‘ఇవన్నీ’గా, συντελεῖσθαι యొక్క పూర్తికి చేరే భావాన్ని ‘పూర్తి’గా, దాని కర్మణి రూపాన్ని తెలుగులో సహజమైన అకర్మక నిర్మాణంతో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: μέλλῃ + క్రియార్థక రూపంలోని అంత్యకాల సంబంధ భావం
  choice: ‘పూర్తి కాబోతున్నప్పుడు’ అని ఆసన్నత/రాబోయే స్థితి భావాన్ని నిలిపింది.
  alternative: ‘పూర్తయ్యేటప్పుడు’ లేదా ‘పూర్తవనున్నప్పుడు’
  rationale: గ్రీకు μέλλῃ సాధారణ భవిష్యత్తుకంటే రాబోయే లేదా ఆసన్నమైన కార్యాన్ని సూచించగలదు. ఈ సూక్ష్మతను ఉంచడం అంత్యకాల క్రమం గురించి అదనపు సిద్ధాంత నిర్ణయాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష ప్రశ్నారూపం వాడబడింది. మూలంలోని రెండు అనుసంధాన ప్రశ్నలు తెలుగులో స్పష్టంగా వినిపించేందుకు ప్రశ్నార్థక విరామం ఇచ్చినా, భావ సంబంధం అలాగే నిలిచింది.
