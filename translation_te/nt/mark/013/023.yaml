  yaml_path: translation/nt/mark/013/023.yaml
  text: But you[a], watch out[b]; I have told you all things beforehand.
translation:
  language: te
  text: అయితే మీరు జాగ్రత్తగా ఉండండి[a]. నేను మీకు అన్నిటినీ ముందుగానే చెప్పాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అప్రమత్తంగా ఉండండి’ లేదా ‘జాగ్రత్త వహించండి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నేను అన్నిటి గురించి మిమ్మల్ని ముందే హెచ్చరించాను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: మీరు
  rationale: బహువచన సర్వనామం మూలంలో స్పష్టంగా ఉండి, ముందున్న సందర్భానికి వ్యతిరేకతతో కూడిన ఉద్ఘాటనను ఇస్తుంది; తెలుగులో దానిని స్పష్టంగా ఉంచడం సహజం.
- source_word: δὲ
  choice: అయితే
  rationale: ఇక్కడ ముందున్న మాటల నుంచి హెచ్చరికవైపు వ్యతిరేకతతో కూడిన మార్పును సూచిస్తుంది.
- source_word: βλέπετε
  choice: జాగ్రత్తగా ఉండండి
  rationale: వర్తమాన ఆజ్ఞారూపం నిరంతర అప్రమత్తతను కోరుతుంది; అక్షరార్థమైన ‘చూడండి’ కంటే సందర్భానుసారంగా ఈ హెచ్చరిక సహజంగా ఉంటుంది.
- source_word: προείρηκα
  choice: ముందుగానే చెప్పాను
  rationale: ముందుగా చెప్పడం అనే సంయుక్త క్రియ భావాన్నీ, గతంలో చెప్పినది ఇప్పటికీ ప్రాసంగికమనే పరిపూర్ణ కాల బలాన్నీ సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: మాట్లాడే క్రియకు పరోక్ష కర్మగా ఉన్న దత్తి విభక్తిని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: πάντα
  choice: అన్నిటినీ
  rationale: ‘అన్నీ/సమస్త విషయాలు’ అనే సమగ్ర భావాన్ని సహజ ఆధునిక తెలుగులో ఇస్తుంది; దాని సందర్భపరమైన పరిధిని అనువాదంలో సంకుచితం చేయదు.
theological_decisions:
- issue: యేసు హెచ్చరిక మరియు ముందస్తు ప్రకటన యొక్క పరిధి
  choice: జాగ్రత్తగా ఉండమని శిష్యులను హెచ్చరిస్తూ, అన్నిటినీ ముందుగానే చెప్పానని యేసు అంటున్నట్లుగా మూలంలోని విస్తృత భాషను నిలిపాము.
  alternative: ‘ఈ సంగతులన్నిటినీ’ అని అనువదించి వెంటనే ముందున్న హెచ్చరికలకే పరిధిని పరిమితం చేయడం.
  rationale: πάντα యొక్క పరిధి సందర్భం ద్వారా గ్రహించబడాలి. అది భవిష్యత్తులోని ప్రతి వివరాన్ని సంపూర్ణంగా వెల్లడించాననే వాదమా, లేక సంబంధిత హెచ్చరికలన్నిటినీ సూచిస్తుందా అనే ఉద్రిక్తతను అనువాదం స్వయంగా తీర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాన్ని వాడాము. వాక్యం సంక్షిప్తంగా, అత్యవసర హెచ్చరిక స్వరంతో ఉంది; ‘అన్నిటినీ’ అనే పదం మూలంలోని ఉద్దేశపూర్వక విస్తృతతను కాపాడుతుంది.
