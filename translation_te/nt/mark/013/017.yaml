  yaml_path: translation/nt/mark/013/017.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a][b].
translation:
  language: te
  text: అయితే, ఆ రోజుల్లో గర్భవతులకూ, పసిబిడ్డలకు పాలిచ్చేవారికీ ఎంత దుఃఖం![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పసిబిడ్డలకు చనుబాలిచ్చేవారికీ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ
  choice: ఎంత దుఃఖం!
  rationale: రాబోయే తీవ్రమైన కష్టాన్ని గురించి విలాపం మరియు హెచ్చరిక కలిసిన ప్రవచనాత్మక ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి హెచ్చరిక నుంచి ఈ ప్రత్యేక వర్గాల దుస్థితివైపు జరిగే స్వల్ప భావమార్పును అతిగా వ్యతిరేకత చూపకుండా సూచిస్తుంది.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: గర్భవతులకు
  rationale: ‘గర్భంలో కలిగియున్నవారు’ అనే గ్రీకు నుడికారానికి స్పష్టమైన, సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: θηλαζούσαις
  choice: పసిబిడ్డలకు పాలిచ్చేవారికి
  rationale: గ్రీకులో అంతర్భూతంగా ఉన్న శిశువు అనే కర్మను తెలుగులో సహజ స్పష్టత కోసం వ్యక్తం చేస్తూ, పాలిచ్చే స్త్రీలను సూచిస్తుంది.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: ఆ రోజుల్లో
  rationale: సందర్భంలో ముందుగా ప్రస్తావించిన కాలంతో సంబంధాన్ని నిలుపుకునే సూటి కాలవాచక ప్రయోగం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. οὐαίలోని విలాపం-హెచ్చరిక భావాన్ని ‘ఎంత దుఃఖం!’ ద్వారా నిలిపి, గ్రీకు వాక్యంలోని స్త్రీల సూచనను ‘గర్భవతులు,’ ‘పాలిచ్చేవారు’ అనే రూపాలతో స్పష్టంగా ఉంచాం.
