review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the imperative to remain awake/watchful, the uncertainty of the householder's arrival, and the four temporal alternatives. However, తెల్లవారుజామున (“at dawn/early dawn”) is narrower than πρωΐ, which here denotes the morning watch; “ఉదయమో” preserves the Greek's broader sense.
  naturalness: The Telugu is generally clear and idiomatic. Joining the command and its γάρ-clause with a comma better reflects their close syntactic and logical connection. The lexical footnote can be made more natural by avoiding “కనిపెట్టుకొని ఉండే.”
  terminology: “ఇంటి యజమాని” appropriately renders the domestic/parabolic sense of ὁ κύριος τῆς οἰκίας without prematurely making it a direct divine title. “మెలకువగా ఉండండి” is a sound primary rendering of γρηγορεῖτε, with “జాగరూకంగా ఉండండి” as a suitable alternative.
  issues:
  - severity: medium
    issue: “తెల్లవారుజామునో” is overly specific for πρωΐ.
    rationale: The Greek names the morning watch/morning, not specifically the earliest dawn period. “ఉదయమో” retains the intended temporal breadth and matches the source sequence.
  - severity: low
    issue: The first footnote's wording is slightly unnatural.
    rationale: “కనిపెట్టుకొని ఉండే భావం” is not the most idiomatic way to express vigilant watchfulness in modern standard Telugu.
  revised_text: కాబట్టి మెలకువగా ఉండండి[a], ఎందుకంటే ఇంటి యజమాని ఎప్పుడు వస్తాడో మీకు తెలియదు—సాయంకాలమో, అర్ధరాత్రో, కోడి కూసే వేళో[b], ఉదయమో.
