id: MRK.13.35
reference: Mark 13:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γρηγορεῖτε οὖν, οὐκ οἴδατε γὰρ πότε ὁ κύριος τῆς οἰκίας ἔρχεται, ⸀ἢ ὀψὲ ἢ ⸀μεσονύκτιον ἢ ἀλεκτοροφωνίας ἢ πρωΐ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/035.yaml
  text: 'Therefore stay awake[a], for you do not know when the master of the house is coming: whether in the evening, or at midnight, or at cockcrow[b], or in the morning.'
translation:
  language: te
  text: కాబట్టి మెలకువగా ఉండండి[a], ఎందుకంటే ఇంటి యజమాని ఎప్పుడు వస్తాడో మీకు తెలియదు—సాయంకాలమో, అర్ధరాత్రో, కోడి కూసే వేళో[b], ఉదయమో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జాగరూకంగా ఉండండి.” ఈ ఆజ్ఞ అప్రమత్తంగా, జాగరూకంగా ఉండాలనే భావాన్ని కూడా కలిగి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “కోడి కూసే వేళ” అనేది కోడి కూతతో గుర్తించబడే రాత్రి కాలవిభాగాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: మెలకువగా ఉండండి
  rationale: ఈ ఆజ్ఞ నిద్రపోకుండా ఉండడం మాత్రమే కాక అప్రమత్తంగా, జాగరూకంగా ఉండడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండే రూపాన్ని ఎంచుకున్నాం; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి బోధన నుంచి వచ్చే నిర్ధారణాత్మక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὐκ οἴδατε ... πότε
  choice: ఎప్పుడు ... మీకు తెలియదు
  rationale: గ్రీకు వాక్యంలోని పరోక్ష కాలప్రశ్నను తెలుగులో సహజమైన వాక్యక్రమంతో, అదనపు భావం చేర్చకుండా వ్యక్తపరుస్తుంది.
- source_word: ὁ κύριος τῆς οἰκίας
  choice: ఇంటి యజమాని
  rationale: ఇక్కడ గృహసంబంధమైన ఉపమాన సందర్భంలో ఇంటిపై అధికారం గల వ్యక్తిని సూచిస్తుంది. ‘యజమాని’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండి, దీనిని నేరుగా దైవిక బిరుదుగా మార్చదు.
- source_word: ἔρχεται
  choice: వస్తాడో
  rationale: సందర్భంలో ఎదురుచూస్తున్న భవిష్యత్ రాకను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ὀψὲ
  choice: సాయంకాలమో
  rationale: రాత్రి కాలవిభాగాల వరుసలో మొదటి సాయంకాలపు వేళను సూచిస్తుంది.
- source_word: μεσονύκτιον
  choice: అర్ధరాత్రో
  rationale: మధ్యరాత్రి కాలాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀλεκτοροφωνίας
  choice: కోడి కూసే వేళో
  rationale: కోడి కూతతో గుర్తించబడే రాత్రి కాలవిభాగాన్ని ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: πρωΐ
  choice: తెల్లవారుజామునో
  rationale: రాత్రి చివరి కాలవిభాగం నుంచి ఉదయం మొదలయ్యే వేళను ‘ఉదయం’ కంటే కొంత నిర్దిష్టంగా, సందర్భానుగుణంగా సూచిస్తుంది.
theological_decisions:
- issue: గృహోపమానంలో κύριος పదం యేసును పరోక్షంగా సూచించగలిగినా, వాక్యస్థాయిలో ఇంటిపై అధికారం గల వ్యక్తిని సూచించడం
  choice: ఇంటి యజమాని
  alternative: ఇంటి ప్రభువు / ఇంటి అధిపతి
  rationale: ఉపమానంలోని సాధారణ గృహార్థాన్ని ముందుగా నిలుపుతూ, దాని విస్తృత క్రీస్తుసంబంధ సూచనను నిరాకరించదు. ‘ప్రభువు’ అని అనువదిస్తే ఈ వాక్యంలో ఉద్దేశించిన గృహచిత్రం నేరుగా దైవిక బిరుదుగా వినిపించే ప్రమాదం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. వరుసగా వచ్చే నాలుగు కాలసూచకాలకు ‘-మో’ రూపాన్ని పెట్టి గ్రీకులోని ప్రత్యామ్నాయాల నిర్మాణాన్ని నిలిపాం. ప్రధాన పాఠంలో [a], [b] సూచికలు రెండూ సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
