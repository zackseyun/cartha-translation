review_pass:
  verdict: revise
  source_fidelity: ‘నక్షత్రాలు ఆకాశం నుండి రాలుతూ ఉంటాయి’ accurately conveys οἱ ἀστέρες ἔσονται ... πίπτοντες, including the vivid ongoing future sense. ‘ఆకాశాల్లోని శక్తులు’ appropriately retains the plural ‘heavens’ and does not identify the δυνάμεις beyond what the Greek states. The final verb is better rendered in natural Telugu as ‘కదిలిపోతాయి’; the draft’s ‘కదిలించబడతాయి’ can suggest an explicit external causer more strongly than the Greek requires.
