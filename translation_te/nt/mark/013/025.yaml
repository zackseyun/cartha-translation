id: MRK.13.25
reference: Mark 13:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οἱ ἀστέρες ⸂ἔσονται ἐκ τοῦ οὐρανοῦ πίπτοντες⸃, καὶ αἱ δυνάμεις αἱ ἐν τοῖς οὐρανοῖς σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/025.yaml
  text: And the stars will be falling from heaven[b][a], and the powers in the heavens will be shaken.
translation:
  language: te
  text: నక్షత్రాలు ఆకాశం నుండి రాలుతూ ఉంటాయి[a]; ఆకాశాల్లోని శక్తులు[b] కదిలిపోతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరలోకం నుండి.’ గ్రీకు పదం సందర్భాన్ని బట్టి ‘ఆకాశం’ లేదా ‘పరలోకం’ అని అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆకాశాల్లోని శక్తులు’ అనేది పరలోక అధికారాలను, విశ్వశక్తులను, లేదా ఆకాశాల నిర్మాణాలను సూచించవచ్చు; గ్రీకు పదబంధం మరింత నిర్దిష్టంగా లేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀστέρες
  choice: నక్షత్రాలు
  rationale: సాధారణ ఖగోళార్థాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: ἔσονται ... πίπτοντες
  choice: రాలుతూ ఉంటాయి
  rationale: భవిష్యత్ కాల సహాయక క్రియతో కూడిన వర్తమాన కృదంత నిర్మాణంలోని కొనసాగుతున్న లేదా సజీవంగా చిత్రితమైన భవిష్యత్ చర్యను నిలుపుతుంది; కేవలం ‘రాలిపోతాయి’ అనడం ఆ దృక్కోణాన్ని కొంత చదును చేస్తుంది.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: ఆకాశం నుండి
  rationale: నక్షత్రాల సందర్భంలో సహజమైన తెలుగు; οὐρανός సూచించగల ‘ఆకాశం/పరలోకం’ అనే అర్థవ్యాప్తిని పాదసూచికలో నిలుపుతుంది.
- source_word: δυνάμεις
  choice: శక్తులు
  rationale: దేవదూతలైన అధికారాలు, విశ్వశక్తులు, లేదా ఆకాశ సంబంధ నిర్మాణాలు అనే అవకాశాల్లో దేనినీ నిర్దిష్టంగా నిర్ణయించకుండా గ్రీకు పదంలోని విస్తృతిని కాపాడుతుంది.
- source_word: αἱ ἐν τοῖς οὐρανοῖς
  choice: ఆకాశాల్లోని
  rationale: గ్రీకులోని బహువచన రూపాన్ని, విశ్వవ్యాప్త పరిధిని సాధ్యమైనంత సహజంగా నిలుపుతుంది.
- source_word: σαλευθήσονται
  choice: కదిలించబడతాయి
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నేరుగా ప్రతిబింబిస్తూ, బలంగా కదల్చబడడం లేదా కంపింపజేయబడడం అనే భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ఆకాశాల్లోని శక్తులు’ అనే పదబంధం యొక్క సూచన
  choice: అవి ఏవో నిర్దిష్టం చేయకుండా ‘ఆకాశాల్లోని శక్తులు’ అని అనువదించబడింది.
  alternative: దేవదూత సంబంధ పరలోక అధికారాలు; ఖగోళ శక్తులు లేదా ఖగోళ వస్తువులు; ఆకాశాల నిర్మాణాలు
  rationale: అంత్యకాల దర్శన సందర్భంలో గ్రీకు పదబంధం అర్థపరంగా విస్తృతమైనది. మూలపాఠం తేల్చని గుర్తింపును అనువాదం తేల్చకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన అంత్యకాల వర్ణన. ‘రాలుతూ ఉంటాయి’ కొనసాగుతున్న భవిష్యత్ చర్యను చూపుతుంది; ‘శక్తులు’ ఉద్దేశపూర్వకంగా వ్యాఖ్యాన నిర్దిష్టతను నివారిస్తుంది.
