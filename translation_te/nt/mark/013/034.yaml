  source_fidelity: మూల గ్రీకు వాక్యం యజమాని ఇంటిని విడిచి, తన బానిసలకు అధికారం మరియు ప్రతివానికి తన పని అప్పగించి, ద్వారపాలకుడు మెలకువగా ఉండమని ఆజ్ఞాపించిన ఉపమానాన్ని చెబుతుంది. ముసాయిదా ఈ భావాన్ని ప్రధానంగా సరిగానే అందిస్తుంది. అయితే ‘ఒక్కొక్కరికి వారి వారి పని ఇచ్చాడు’లో క్రియను పునరావృతం చేయడం మూలంలోని ‘అధికారం, ప్రతివానికి తన పని’ అనే సమన్వయ నిర్మాణాన్ని కొద్దిగా విస్తరిస్తుంది; దాన్ని మరింత సన్నిహితంగా, సహజంగా చేయవచ్చు.
  naturalness: ‘ప్రయాణానికి వెళ్లిన ఒక మనిషి,’ ‘ద్వారపాలకుడు,’ ‘మెలకువగా ఉండాలని ఆజ్ఞాపించాడు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగాను గౌరవప్రదంగాను ఉన్నాయి. ‘తన బానిసలకు అధికారం, వారిలో ప్రతివానికి తన పని అప్పగించి’ అనే నిర్మాణం మరింత ప్రవాహంగా ఉండి, పంపిణీ భావాన్ని స్పష్టంగా ఉంచుతుంది.
