id: MRK.13.34
reference: Mark 13:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς ἄνθρωπος ἀπόδημος ἀφεὶς τὴν οἰκίαν αὐτοῦ καὶ δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν, ⸀ἑκάστῳ τὸ ἔργον αὐτοῦ, καὶ τῷ θυρωρῷ ἐνετείλατο ἵνα γρηγορῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/034.yaml
  text: It is like a man away on a journey[a], who left his house and gave authority to his servants, to each one his work, and commanded the doorkeeper to stay awake.
translation:
  language: te
  text: ఇది ప్రయాణానికి వెళ్లిన ఒక మనిషి వంటిది. అతడు తన ఇంటిని విడిచిపెట్టి, తన బానిసలకు[a] అధికారం, వారిలో ప్రతివానికి తన పని అప్పగించి, ద్వారపాలకుడు మెలకువగా ఉండాలని ఆజ్ఞాపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సేవకులకు.” గ్రీకు పదం δοῦλοι అంటే యజమాని అధికారానికి లోబడిన గృహ బానిసలు.
    reason: మూలపదమైన δοῦλοι యొక్క సామాజిక భావాన్ని స్పష్టంగా తెలియజేస్తూ, సాధ్యమైన సాధారణ తెలుగు ప్రత్యామ్నాయాన్ని అందించడం.
lexical_decisions:
- source_word: ὡς
  choice: ఇది ... వంటిది
  rationale: ముందున్న హెచ్చరికకు ఈ ఉపమానాన్ని అనుసంధానించే పోలికను సహజమైన తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: ἄνθρωπος ἀπόδημος
  choice: ప్రయాణానికి వెళ్లిన ఒక మనిషి
  rationale: ἄνθρωπος ఇక్కడ ఉపమానంలోని పురుష వ్యక్తిని సూచిస్తుంది; ἀπόδημος అతడు తన స్థలానికి దూరంగా ప్రయాణంలో ఉన్నాడనే భావాన్ని ఇస్తుంది.
- source_word: ἀφεὶς τὴν οἰκίαν αὐτοῦ
  choice: తన ఇంటిని విడిచిపెట్టి
  rationale: అతడు తన ఇంటిని వదలి వెళ్లిన ముందరి చర్యను సంక్షిప్తంగా, మూలంలోని కృదంత నిర్మాణానికి దగ్గరగా అందిస్తుంది.
- source_word: τοῖς δούλοις αὐτοῦ
  choice: తన బానిసలకు
  rationale: గృహ యజమాని అధికారానికి లోబడిన బంధిత సేవకుల సామాజిక స్థితిని δοῦλος స్పష్టంగా సూచిస్తుంది; అందువల్ల దానిని మృదువుగా మార్చకుండా ‘బానిసలు’ అని అనువదించాం.
- source_word: τὴν ἐξουσίαν
  choice: అధికారం
  rationale: అప్పగించబడిన హక్కు లేదా కార్యనిర్వహణ శక్తి అనే ἐξουσία యొక్క ప్రధాన భావాన్ని కాపాడుతుంది.
- source_word: ἑκάστῳ τὸ ἔργον αὐτοῦ
  choice: ఒక్కొక్కరికి వారి వారి పని
  rationale: ἑκάστῳ యొక్క పంపిణీ భావాన్ని, ἔργον యొక్క సాధారణ అర్థమైన ‘పని’ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τῷ θυρωρῷ
  choice: ద్వారపాలకుడు
  rationale: ఇంటి ద్వారాన్ని కాపాడే వ్యక్తిని సూచించే స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: ἐνετείλατο ἵνα γρηγορῇ
  choice: మెలకువగా ఉండాలని ఆజ్ఞాపించాడు
  rationale: ἐνετείλατο లోని అధికారపూర్వక ఆజ్ఞను, γρηγορέω లోని మేలుకొని అప్రమత్తంగా ఉండే నిరంతర భావాన్ని రెండింటినీ కాపాడుతుంది.
theological_decisions:
- issue: గృహ సంబంధ సందర్భంలో δοῦλος అనువాదం
  choice: బానిసలు
  alternative: సేవకులు; దాసులు
  rationale: ఈ ఉపమానంలో యజమాని తన ఆధీనంలోని వారికి అధికారం, పనులు అప్పగిస్తున్నాడు. ‘బానిసలు’ మూలపదం సూచించే బంధిత స్థితిని స్పష్టంగా ఉంచుతుంది. పాఠకులకు పరిచితమైన మృదువైన ప్రత్యామ్నాయంగా ‘సేవకులు’ను పాదసూచికలో ఇచ్చాం; ‘దాసులు’ కూడా సాధ్యమే కాని ఆధునిక తెలుగులో దాని సామాజిక స్థితి అంత స్పష్టంగా ఉండకపోవచ్చు.
- issue: γρηγορέω యొక్క అక్షరార్థం మరియు రూపకాల భావం
  choice: మెలకువగా ఉండాలి
  alternative: అప్రమత్తంగా ఉండాలి; కాపలా కాయాలి
  rationale: ఈ ప్రసంగమంతటా వినిపించే మేలుకొని ఉండటం అనే రూపకాన్ని నిలుపుతూ, అప్రమత్తత భావాన్ని పాఠకుడు గ్రహించేలా ‘మెలకువగా’ అని అనువదించాం; కేవలం ద్వారపాలకుని కాపలా పనికే భావాన్ని పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘ద్వారపాలకుడు,’ ‘అధికారం,’ ‘ఆజ్ఞాపించాడు’ వంటి పదాలు వాక్య గాంభీర్యాన్ని నిలుపుతాయి; ‘మెలకువగా’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది.
