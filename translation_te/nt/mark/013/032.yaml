source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης ἢ ⸀τῆς ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι ⸀ἐν οὐρανῷ οὐδὲ ὁ υἱός, εἰ μὴ ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/032.yaml
  text: But concerning that day or hour[a], no one knows—not even the angels in heaven, nor the Son, but only the Father.
translation:
  language: te
  text: అయితే, ఆ రోజు గురించిగానీ ఆ గంట గురించిగానీ ఎవరికీ తెలియదు—పరలోకంలోని దూతలకు కూడా తెలియదు, కుమారునికీ తెలియదు[a]; తండ్రికి మాత్రమే తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కుమారునికీ తెలియదు’ అనే మాటను కొందరు వ్యాఖ్యాతలు కుమారుని అవతార పరిచర్యకు లేదా ఆయన మానవ స్వభావానికి సంబంధించినదిగా అర్థం చేసుకుంటారు. ఆ వివరణను ప్రధాన పాఠంలో చేర్చకుండా, ఈ అనువాదం గ్రీకు పాఠంలోని మాటలను యథాతథంగా ఉంచుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: అయితే ... గురించి
  rationale: περί + షష్ఠీ విభక్తి చర్చావిషయాన్ని సూచిస్తుంది; δέ మునుపటి మాటల నుంచి స్వల్ప మార్పు లేదా వ్యత్యాసాన్ని సూచిస్తుంది. ‘అయితే ... గురించి’ ఈ రెండింటినీ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τῆς ἡμέρας ἐκείνης ἢ τῆς ὥρας
  choice: ఆ రోజు గురించి గానీ, ఆ గంట గురించి గానీ
  rationale: రోజు, గంట అనే రెండు కాల సూచనలను స్పష్టంగా ఉంచుతూ, గ్రీకు ἢ యొక్క ప్రత్యామ్నాయ భావాన్ని తెలుగు ‘గానీ ... గానీ’ నిర్మాణం సహజంగా వ్యక్తపరుస్తుంది.
- source_word: οὐδεὶς οἶδεν
  choice: ఎవరికీ తెలియదు
  rationale: οὐδείς సంపూర్ణ నిరాకరణను సూచిస్తుంది; రూపరీత్యా perfect అయిన οἶδα ఇక్కడ వర్తమానార్థంలో ‘తెలుసు/తెలియడం’ అనే భావం ఇస్తుంది. ‘ఎవరికీ తెలియదు’ ఆధునిక తెలుగులో సహజం.
- source_word: οὐδὲ οἱ ἄγγελοι ἐν οὐρανῷ
  choice: పరలోకంలోని దూతలకు కూడా తెలియదు
  rationale: οὐδέ నిరాకరణను బలంగా విస్తరిస్తుంది; ‘కూడా తెలియదు’ దాని ‘not even’ భావాన్ని అందిస్తుంది. ἐν οὐρανῷ ను దూతల స్థానాన్ని సూచించేలా అనువదించాం.
- source_word: οὐδὲ ὁ υἱός
  choice: కుమారునికీ తెలియదు
  rationale: పునరుక్తమైన οὐδέ నిరాకరణ శ్రేణిని కొనసాగిస్తుంది. ‘కుమారుడు’ అనే క్రీస్తుసంబంధ బిరుదును వ్యాఖ్యానాత్మకంగా మార్చకుండా ఉంచి, తెలుగులో వాక్యాన్ని సంపూర్ణంగా చేయడానికి ‘తెలియదు’ను పునరుక్తం చేశాం.
- source_word: εἰ μὴ ὁ πατήρ
  choice: తండ్రికి మాత్రమే తెలుసు
  rationale: నిరాకరణ తర్వాత εἰ μή ఏకైక మినహాయింపును సూచిస్తుంది. ‘మాత్రమే’ ఆ ప్రత్యేకతను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఆ రోజు లేదా గంట కుమారునికి తెలియదనే క్రీస్తుసంబంధ ప్రకటన
  choice: ‘కుమారునికీ తెలియదు’ అనే గ్రీకు పాఠంలోని స్పష్టమైన మాటను తగ్గించకుండా ప్రధాన వాక్యంలో ఉంచడం.
  alternative: ‘మానవ స్వభావంలో కుమారునికి తెలియదు’ వంటి వ్యాఖ్యానాత్మక పరిమితిని ప్రధాన పాఠంలో చేర్చడం, లేదా ఈ పదబంధాన్ని తొలగించడం.
  rationale: గ్రీకు మూలపాఠంలో οὐδὲ ὁ υἱός స్పష్టంగా ఉంది. మూలభాషకు ప్రాధాన్యమిస్తూ, వచనంలోని క్రీస్తుసంబంధ ఉద్రిక్తతను అనువాదంలోనే పరిష్కరించకుండా యథాతథంగా నిలిపాం; సాధ్యమైన వ్యాఖ్యానాన్ని పాదసూచికకే పరిమితం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలిపే శైలిని వాడాం. ‘పరలోకం,’ ‘దూతలు,’ ‘కుమారుడు,’ ‘తండ్రి’ అనే స్థిరమైన బైబిలు పదజాలాన్ని కొనసాగించాం. బలమైన నిరాకరణ క్రమం వినిపించేందుకు ‘కూడా తెలియదు ... కుమారునికీ తెలియదు’ అని నిర్మించాం.
