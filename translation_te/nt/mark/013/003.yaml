translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. వాక్యం తరువాతి వచనంలోని ప్రత్యక్ష ప్రశ్నకు దారితీస్తుంది కాబట్టి చివర ద్విబిందువు ఉంచబడింది. ἱερόν యొక్క ‘దేవాలయ సముదాయం/ప్రాంగణం’ అనే సూక్ష్మార్థం ఈ సందర్భంలో భావాన్ని మార్చనందున ప్రత్యేక పాదటిప్పణి అవసరం లేదని నిర్ణయించాం.
