  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ καθημένου αὐτοῦ εἰς τὸ Ὄρος τῶν Ἐλαιῶν κατέναντι τοῦ ἱεροῦ ⸀ἐπηρώτα αὐτὸν κατ’ ἰδίαν Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/003.yaml
  text: And as he was sitting on the Mount of Olives opposite the temple, Peter and James and John and Andrew were asking him privately,
translation:
  language: te
  text: 'ఆయన ఒలీవల కొండమీద దేవాలయానికి ఎదురుగా[a] కూర్చొని ఉండగా, పేతురు, యాకోబు, యోహాను, అంద్రేయ ఆయనను ఏకాంతంగా అడుగుతూ ఉన్నారు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ἱερόν అనేది లోపలి పరిశుద్ధస్థలాన్ని ప్రత్యేకంగా సూచించే ναός కాదు; దేవాలయ సముదాయం లేదా ప్రాంగణాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθημένου αὐτοῦ
  choice: ఆయన ... కూర్చొని ఉండగా
  rationale: వర్తమాన కృదంతంతో కూడిన genitive absolute, కొనసాగుతున్న నేపథ్య పరిస్థితిని సూచిస్తుంది; ఈ తెలుగు రూపం దానిని సహజంగా నిలుపుతుంది.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ఒలీవల కొండమీద
  rationale: స్థితిని సూచించే సందర్భంలో εἰς ఇక్కడ ప్రదేశార్థకంగా ఉంది; సంప్రదాయ భౌగోళిక పేరును సహజమైన తెలుగులో ఇచ్చింది.
- source_word: κατέναντι τοῦ ἱεροῦ
  choice: దేవాలయానికి ఎదురుగా
  rationale: κατέναντι అంటే ఎదురుగా లేదా ముఖాముఖిగా; ἱερόν మొత్తం దేవాలయ ప్రాంగణాన్ని సూచించగలిగినా, సందర్భంలో ‘దేవాలయం’ స్పష్టమైన సాధారణ తెలుగు పదం.
- source_word: ἐπηρώτα
  choice: అడుగుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం ప్రశ్నించడం కొనసాగుతున్న చర్యగా చూపుతుంది; తెలుగు కొనసాగింపు రూపం ఆ దృక్కోణాన్ని నిలుపుతుంది.
- source_word: κατ’ ἰδίαν
  choice: ఏకాంతంగా
  rationale: ఇతరుల నుండి వేరుగా, వ్యక్తిగతంగా అనే భావాన్ని సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας
  choice: పేతురు, యాకోబు, యోహాను, అంద్రెయ
  rationale: తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన నామరూపాలు వాడబడ్డాయి; జాబితాను సహజ తెలుగు విరామచిహ్నాలతో ఇచ్చాం.
