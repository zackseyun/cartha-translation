revisions:
- from: 'ఆయన ఒలీవల కొండమీద దేవాలయానికి ఎదురుగా కూర్చొని ఉండగా, పేతురు, యాకోబు, యోహాను, అంద్రెయ ఆయనను ఏకాంతంగా అడుగుతూ ఉన్నారు:'
  to: 'ఆయన ఒలీవల కొండమీద దేవాలయానికి ఎదురుగా[a] కూర్చొని ఉండగా, పేతురు, యాకోబు, యోహాను, అంద్రేయ ఆయనను ఏకాంతంగా అడుగుతూ ఉన్నారు:'
  rationale: The imperfective Telugu verb form is retained because ἐπηρώτα is imperfect. The standard Telugu form “అంద్రేయ” replaces “అంద్రెయ,” and a footnote is added at “దేవాలయం” to preserve the ἱερόν/ναός distinction documented in the English audit trail.
