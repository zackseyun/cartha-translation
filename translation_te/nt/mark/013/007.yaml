source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀ἀκούσητε πολέμους καὶ ἀκοὰς πολέμων, μὴ θροεῖσθε· ⸀δεῖ γενέσθαι, ἀλλ’ οὔπω τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/007.yaml
  text: And when you hear of wars and reports of wars[a], do not be alarmed; these things must happen, but the end is not yet.
translation:
  language: te
  text: మీరు యుద్ధాలనూ యుద్ధాల వార్తలనూ[a] విన్నప్పుడు కలవరపడకండి. ఇవి జరగాల్సిందే; కానీ ఇంకా అంతం కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యుద్ధాల గురించిన వదంతులు.’ గ్రీకు పదం యుద్ధాల గురించి వినబడే వార్తలు, నివేదికలు లేదా వదంతులను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: మీరు విన్నప్పుడు
  rationale: ὅταν భవిష్యత్ సందర్భంలోని కాలసంబంధ పరిస్థితిని సూచిస్తుంది; δέ స్వల్ప అనుసంధానక అవ్యయం. తెలుగులో వాక్యప్రవాహం సహజంగా ఉండేందుకు దానిని ప్రత్యేక పదంతో చూపకుండా నిర్మాణంలోనే ప్రతిబింబించాం.
- source_word: ἀκούσητε
  choice: మీరు విన్నప్పుడు
  rationale: ὅτανతో కూడిన aorist subjunctiveను భవిష్యత్ సందర్భంలో సహజమైన తెలుగు కాలవాచక నిర్మాణంగా అనువదించాం.
- source_word: πολέμους
  choice: యుద్ధాల గురించి
  rationale: πόλεμος యొక్క బహువచన భావాన్ని నేరుగా చూపిస్తూ, ἀκούωతో తెలుగులో సహజంగా వచ్చే ‘గురించి వినడం’ అనే నిర్మాణాన్ని ఉపయోగించాం.
- source_word: ἀκοὰς πολέμων
  choice: యుద్ధాల వార్తల గురించి
  rationale: ἀκοή ఇక్కడ విన్న సమాచారం, వార్త లేదా నివేదికను సూచించగలదు. ‘వార్తలు’ ధృవీకరించని వదంతులకే భావాన్ని పరిమితం చేయకుండా విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: μὴ θροεῖσθε
  choice: కలవరపడకండి
  rationale: θροέομαι సూచించే ఆందోళన, భయకంపిత స్థితి లేదా అలజడిని సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: δεῖ γενέσθαι
  choice: ఇవి జరగాల్సిందే
  rationale: δεῖలోని అవసరతను ‘జరగాల్సిందే’ నిలుపుతుంది; జన్యమైన కర్తలేని గ్రీకు నిర్మాణానికి సందర్భంలోని విషయాలను సూచిస్తూ ‘ఇవి’ చేర్చాం.
- source_word: ἀλλ’ οὔπω τὸ τέλος
  choice: అయితే అంతం ఇంకా రాలేదు
  rationale: ἀλλάలోని వ్యత్యాసాన్ని ‘అయితే’తో, οὔπωలోని ‘ఇంకా కాదు’ భావాన్ని సహజమైన తెలుగు ప్రయోగమైన ‘ఇంకా రాలేదు’తో వ్యక్తం చేశాం.
theological_decisions:
- issue: δεῖ γενέσθαιలో అంత్యకాల సంబంధ అవసరత
  choice: ‘జరగాల్సిందే’ అని అనువదించి అవసరతను నిలుపడం
  alternative: ‘జరుగుతాయి’ లేదా ‘జరగడం అవసరం’
  rationale: వాక్యం ఈ సంఘటనల అవసరతను చెబుతుంది గాని దాని విధానాన్ని వివరించదు. ‘జరగాల్సిందే’ ఆ బలాన్ని కాపాడుతూ నిర్దిష్ట అంత్యకాల వ్యవస్థను లేదా తాత్త్విక నిర్ణయవాదాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలిని ఉపయోగించాం. సంప్రదాయ ‘వదంతులు’ అనే పదాన్ని ప్రధాన పాఠంలో కాకుండా పాదటిప్పణిలో ఉంచి గ్రీకు పదంలోని విస్తృత అర్థాన్ని కాపాడాం.
