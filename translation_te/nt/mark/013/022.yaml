id: MRK.13.22
reference: Mark 13:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται καὶ δώσουσιν σημεῖα καὶ τέρατα πρὸς τὸ ἀποπλανᾶν εἰ ⸀δυνατὸν τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/022.yaml
  text: For false messiahs and false prophets will arise and will give signs and wonders in order to lead astray[a], if possible[c][b], the elect.
translation:
  language: te
  text: ఎందుకంటే తప్పుడు మెస్సీయలు[a], తప్పుడు ప్రవక్తలు ఉద్భవించి, ఎన్నుకోబడినవారిని, సాధ్యమైతే[b], తప్పుదారి పట్టించడానికి సూచకాలను, అద్భుతాలను చేస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తప్పుడు క్రీస్తులు.’ గ్రీకులోని క్రీస్తోస్ (Christos) అనే బిరుదుపదం నుండి ఈ పదం ఏర్పడింది; ఇక్కడ దాని అర్థం ‘మెస్సీయ.’
    reason: alternative_reading
  - marker: b
    text: లేదా ‘అది సాధ్యమయ్యేదైతే.’ గ్రీకు మాట, ఎన్నుకోబడినవారిని నిజంగా తప్పుదారి పట్టించడం సాధ్యమా కాదా అని స్పష్టంగా తేల్చదు; మోసగాళ్ల ఉద్దేశాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: బయలుదేరి
  rationale: ఇక్కడ ఈ క్రియ వ్యక్తులు ఉద్భవించడం లేదా రంగంలోకి రావడం అనే భావాన్ని ఇస్తుంది. ‘బయలుదేరి’ ఆధునిక తెలుగులో సహజంగా ఉండి, వారిని దేవుడే లేపాడనే అనవసర భావాన్ని కలిగించదు.
- source_word: ψευδόχριστοι
  choice: తప్పుడు మెస్సీయలు
  rationale: Χριστός ఇక్కడ బిరుదు భావంలో ఉంది. అందువల్ల యూదుల మెస్సీయ నిరీక్షణ నేపథ్యాన్ని స్పష్టంగా ఉంచే ‘మెస్సీయలు’ సరైనది; ‘క్రీస్తులు’ కంటే ఇది ఆధునిక పాఠకులకు భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: ψευδοπροφῆται
  choice: తప్పుడు ప్రవక్తలు
  rationale: గ్రీకు సమాసపదంలోని ‘అబద్ధమైన/నకిలీ’ భావాన్ని సహజమైన, స్పష్టమైన తెలుగులో తెలియజేస్తుంది.
- source_word: δώσουσιν σημεῖα καὶ τέρατα
  choice: సూచక క్రియలనూ అద్భుతాలనూ చేస్తారు
  rationale: δώσουσιν అక్షరార్థంగా ‘ఇస్తారు’ అయినా, సూచక క్రియలు మరియు అద్భుతాల సందర్భంలో ‘చేస్తారు’ అనేది సహజ తెలుగు. ‘సూచక క్రియలు, అద్భుతాలు’ అనే జంట మూలంలోని రెండు పదాల ప్రత్యేక భావాన్ని నిలుపుతుంది.
- source_word: πρὸς τὸ ἀποπλανᾶν
  choice: తప్పుదారి పట్టించడానికి
  rationale: ఈ నిర్మాణం ఉద్దేశాన్ని తెలియజేస్తుంది. ‘మోసం చేయడానికి’ కంటే ‘తప్పుదారి పట్టించడానికి’లో సత్యమార్గం నుంచి దారి మళ్లించే మూలపద చిత్రణ నిలుస్తుంది.
- source_word: εἰ δυνατόν
  choice: సాధ్యమైతే
  rationale: గ్రీకు షరతును సంక్షిప్తంగా, నేరుగా అనువదిస్తుంది; అది నిజంగా సాధ్యమా కాదా అనే ప్రశ్నను అనువాదం స్వయంగా తీర్చదు.
- source_word: τοὺς ἐκλεκτούς
  choice: ఎన్నుకోబడినవారిని
  rationale: ఎవరిని ఎన్నుకున్నారో మూలంలో స్పష్టంగా చెప్పకుండా, ἐκλεκτούς పదంలోని ఎంపిక/ఎన్నిక భావాన్ని మరియు దాని ధార్మిక ప్రాముఖ్యతను నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న హెచ్చరికకు ఈ వాక్యం కారణాత్మక వివరణ ఇస్తున్న అనుసంధానాన్ని తెలుగులో స్పష్టంగా చూపుతుంది.
theological_decisions:
- issue: ψευδόχριστοι లో Χριστός బిరుదు అనువాదం
  choice: తప్పుడు మెస్సీయలు
  alternative: తప్పుడు క్రీస్తులు
  rationale: ఈ సమాసంలో Χριστός పేరు వలె కాక మెస్సీయ బిరుదుగా పనిచేస్తుంది. ‘మెస్సీయలు’ అనే రూపం మూలంలోని యూదు సందర్భాన్ని, అర్థాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: εἰ δυνατόν ఎన్నుకోబడినవారు తప్పుదారి పట్టే అవకాశం గురించి ఏమి సూచిస్తుంది
  choice: సాధ్యమైతే
  alternative: అది సాధ్యమయ్యేదైతే
  rationale: మూలంలోని సంక్షిప్త షరతు, చివరకు అది సాధ్యమేనా అసాధ్యమా అని స్పష్టంగా తేల్చదు. ‘సాధ్యమైతే’ ఆ ధార్మిక ఉద్రిక్తతను పరిష్కరించకుండా అలాగే ఉంచుతుంది.
- issue: εἰ δυνατόν వాక్యంలో దేనితో ప్రధానంగా అనుసంధానమవుతుంది
  choice: సాధ్యమైతే ఎన్నుకోబడినవారిని తప్పుదారి పట్టించడానికి
  alternative: ఎన్నుకోబడినవారిని తప్పుదారి పట్టించడానికి—అది సాధ్యమైతే
  rationale: తెలుగు వాక్యక్రమం సహజంగా ఉండేలా చేసినప్పటికీ, షరతు మోసగాళ్ల ఉద్దేశానికి సంబంధించినదని చూపుతుంది. విరామచిహ్నాలతో దాని పరిధిని అతిగా నిర్దిష్టం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన శైలి. ‘సూచక క్రియలు,’ ‘మెస్సీయలు,’ ‘ఎన్నుకోబడినవారు’ వంటి కీలక పదాల్లో బైబిలు భావగాంభీర్యాన్ని నిలుపుతూ, పాతకాలపు లేదా మతశాఖాపరమైన పదప్రయోగాన్ని నివారించింది.
