  text: προσεύχεσθε δὲ ἵνα μὴ ⸀γένηται χειμῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/018.yaml
  text: But pray that it may not happen in winter[a].
translation:
  language: te
  text: అయితే, అది చలికాలంలో జరగకూడదని ప్రార్థించండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సందర్భాన్ని దృష్టిలో ఉంచుకొని మరింత స్పష్టంగా చెబితే, ‘మీ పారిపోవడం చలికాలంలో జరగకూడదని ప్రార్థించండి.’ మత్తయి 24:20లోని సమాంతర వాక్యంతో పోలిస్తే, మార్కు గ్రీకు వాక్యం మరింత సంక్షిప్తంగా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: προσεύχεσθε
  choice: ప్రార్థించండి
  rationale: వర్తమానకాల మధ్యమ/డిపోనెంట్ ఆజ్ఞార్థక క్రియ, బహువచనం. ఆధునిక తెలుగు వాడుకలో మర్యాదపూర్వక బహువచన ఆజ్ఞగా ‘ప్రార్థించండి’ సహజంగా ఉంటుంది; ‘ప్రార్థిస్తూ ఉండండి’ అని అనువదిస్తే క్రియాంశాన్ని అవసరానికి మించి స్పష్టీకరించినట్లవుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందున్న హెచ్చరికతో మృదువైన సంధానాన్ని, స్వల్ప వ్యతిరేక భావాన్ని సూచిస్తుంది. ‘అయితే’ తెలుగు ప్రవాహంలో సహజంగా ఆ పని చేస్తుంది.
- source_word: ἵνα μὴ
  choice: జరగకుండా ఉండాలని
  rationale: ప్రార్థనలోని విషయాన్ని నిషేధార్థంతో పరిచయం చేస్తుంది. తెలుగులో ‘...కుండా ఉండాలని ప్రార్థించండి’ సహజమైన నిర్మాణం.
- source_word: γένηται
  choice: అది ... జరగకుండా
  rationale: γίνομαι యొక్క ఏకవచన అఓరిస్ట్ మధ్యమ సబ్జంక్టివ్. సందర్భంలోని సంఘటనను గ్రీకు వాక్యం స్పష్టంగా పేరుపెట్టకుండా సూచిస్తున్నందున, ‘అది’తో దాని సంక్షిప్తతను నిలిపి ‘జరగకుండా’ అని సహజంగా అనువదించాం.
- source_word: χειμῶνος
  choice: చలికాలంలో
  rationale: కాలాన్ని సూచించే సంబంధ విభక్తి రూపం. ఆధునిక ప్రామాణిక తెలుగులో ‘చలికాలంలో’ సంక్షిప్తంగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: γένηται యొక్క అప్రకటిత కర్త/సూచిత సంఘటన
  choice: ‘అది ... జరగకుండా’ అనే అనిర్దిష్ట సూచనతో మార్కు వాక్యంలోని సంక్షిప్తతను నిలిపాము.
  alternative: ‘మీ పారిపోవడం చలికాలంలో జరగకుండా’ అని సందర్భాన్ని స్పష్టంగా చేర్చడం.
  rationale: మార్కు గ్రీకు పాఠంలో ‘మీ పారిపోవడం’ అనే పదాలు లేవు; మత్తయి 24:20లోని స్పష్టమైన సమాంతర వాక్యాన్ని ఇక్కడికి దిగుమతి చేయకుండా మూలపాఠంలోని ఉద్దేశపూర్వకమో సందర్భాధారితమో అయిన అస్పష్టతను కాపాడాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని సంక్షిప్తతను ప్రధాన వాక్యంలో నిలిపి, సందర్భాధారిత విస్తరణను పాదటిప్పణిలో ఇచ్చాము.
