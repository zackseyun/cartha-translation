  text: ὁ δὲ Ἰησοῦς ⸂ἤρξατο λέγειν αὐτοῖς⸃· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/005.yaml
  text: Then Jesus began to say to them[a], “See to it that no one leads you astray.”
translation:
  language: te
  text: 'అప్పుడు యేసు వారితో ఇలా చెప్పడం మొదలుపెట్టాడు: “ఎవరూ మిమ్మల్ని తప్పుదారి పట్టించకుండా జాగ్రత్తపడండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: అప్పుడు
  rationale: δέ స్వల్ప అనుసంధాన పదం. కథన ప్రవాహాన్ని సహజంగా కొనసాగించడానికి ‘అప్పుడు’ అనువైనది; ఇది అనవసరమైన వ్యతిరేక భావాన్ని కలిగించదు.
- source_word: ἤρξατο λέγειν
  choice: ఇలా చెప్పడం మొదలుపెట్టాడు
  rationale: మార్కు రచనలో సాధారణమైన కథన నిర్మాణాన్ని దగ్గరగా ఉంచుతూ, ఆధునిక తెలుగులో సహజంగా వినిపిస్తుంది. మూలంలో లేని ‘జవాబిచ్చాడు’ అనే భావాన్ని చేర్చలేదు.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: సందర్భంలో వారు శిష్యులే అయినప్పటికీ, గ్రీకు పాఠంలో ఉన్న సర్వనామాన్ని మాత్రమే ప్రతిబింబిస్తూ వివరణాత్మక నామవాచకాన్ని చేర్చలేదు.
- source_word: Βλέπετε
  choice: జాగ్రత్తపడండి
  rationale: వర్తమాన ఆజ్ఞారూపంలోని నిరంతర అప్రమత్తతను సహజమైన ఆధునిక తెలుగు హెచ్చరికగా వ్యక్తపరుస్తుంది.
- source_word: μή τις ὑμᾶς πλανήσῃ
  choice: ఎవరూ మిమ్మల్ని తప్పుదారి పట్టించకుండా
  rationale: μή తో కూడిన సంభావనార్థక క్రియ నివారించవలసిన ప్రమాదాన్ని సూచిస్తుంది. ‘తప్పుదారి పట్టించు’ అనేది మోసగించడం మరియు సరైన మార్గం నుంచి తొలగించడం అనే πλανάω యొక్క విస్తృత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: πλανήσῃలోని హెచ్చరిక స్వభావం
  choice: మోసం ద్వారా సరైన మార్గం నుంచి తప్పుదారి పట్టిపోకుండా ఉండాలనే హెచ్చరిక
  alternative: కేవలం మేధోపరమైన మోసానికి సంబంధించిన హెచ్చరిక
  rationale: πλανάω కేవలం తప్పుడు సమాచారం ఇవ్వడమే కాకుండా, దారితప్పించడం లేదా సరైన మార్గం నుంచి తొలగించడం అనే భావాన్నీ కలిగి ఉంటుంది. ‘తప్పుదారి పట్టించు’ ఈ విస్తృత నైతిక, ఆధ్యాత్మిక బలాన్ని అదనపు సిద్ధాంత వివరణ లేకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సర్వనామాన్ని అలాగే ఉంచి, సందర్భం నుంచి ‘శిష్యులు’ అని ప్రధాన పాఠ్యంలో చేర్చలేదు. పాఠ్యంలో పాదసూచికలు లేవు.
