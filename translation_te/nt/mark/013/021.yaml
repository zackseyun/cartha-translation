id: MRK.13.21
reference: Mark 13:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀καὶ τότε ἐάν τις ὑμῖν εἴπῃ· ⸀Ἴδε ὧδε ὁ ⸀χριστός, ⸁Ἴδε ἐκεῖ, μὴ πιστεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/021.yaml
  text: And then[a], if anyone says to you, ‘Look, here is the Messiah!’ or, ‘Look, there!’ do not believe it.
translation:
  language: te
  text: అప్పుడు ఎవరైనా మీతో, “ఇదిగో, మెస్సీయ[a] ఇక్కడ ఉన్నాడు!” అనో, “ఇదిగో, అక్కడ ఉన్నాడు!” అనో చెబితే, ఆ మాట నమ్మకండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు.”
    reason: χριστός అనే గ్రీకు బిరుదుకు సంప్రదాయ ప్రత్యామ్నాయ అనువాదాన్ని చూపిస్తుంది.
lexical_decisions:
- source_word: καὶ τότε
  choice: అప్పుడు
  rationale: ఇది ముందున్న ప్రసంగంతో సంబంధాన్ని కొనసాగిస్తూ ఆ సందర్భంలోని తదుపరి సమయాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు’ ఈ రెండు భావాలను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: ఎవరైనా మీతో … చెబితే
  rationale: ఇది సాధారణ షరతును తెలిపే నిర్మాణం. τις లోని అనిర్దిష్ట భావాన్ని ‘ఎవరైనా’ స్పష్టంగా అందిస్తుంది.
- source_word: Ἴδε
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే ఈ ఉద్గారానికి ‘ఇదిగో’ సహజమైన, బలమైన ఆధునిక తెలుగు సమానం.
- source_word: ὧδε
  choice: ఇక్కడ
  rationale: సమీప స్థలాన్ని సూచించే ὧδε కు నేరమైన తెలుగు సమానం.
- source_word: ὁ χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ χριστός వ్యక్తిపేరులా కాక, అభిషిక్తుడైన విమోచకుని బిరుదుగా వాడబడింది; అందువల్ల ‘మెస్సీయ’ బిరుదు భావాన్ని నిలుపుతుంది.
- source_word: ἐκεῖ
  choice: అక్కడ
  rationale: ఇది దూరంలోని స్థలాన్ని సూచిస్తూ ὧδε (‘ఇక్కడ’)తో ఉన్న వ్యత్యాసాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: μὴ πιστεύετε
  choice: ఆ మాట నమ్మకండి
  rationale: గ్రీకులో కర్మ ప్రత్యక్షంగా లేకపోయినా, సందర్భంలో నమ్మవద్దని చెప్పేది ఆ ప్రకటననే. ‘ఆ మాట’ అని చేర్చడం వ్యక్తిని కాక వాదనను సూచిస్తూ తెలుగులో అర్థాన్ని సహజంగా స్పష్టం చేస్తుంది.
theological_decisions:
- issue: Χριστός పదానికి అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: అంత్యకాలంలో తామే అభిషిక్త విమోచకులమని చెప్పుకునే వారి సందర్భంలో ఇది బిరుదుగా పనిచేస్తుంది. ‘మెస్సీయ’ ఆ బిరుదు భావాన్ని స్పష్టంగా ఉంచుతుంది; సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి వాడబడింది. రెండు తప్పుడు ప్రకటనల సమాంతర నిర్మాణాన్ని ‘అనో … అనో’ ద్వారా నిలిపాం; రెండో వాక్యంలో గ్రీకులోలాగే ‘మెస్సీయ’ను పునరుక్తి చేయకుండా భావాన్ని సూచితంగా ఉంచాం.
