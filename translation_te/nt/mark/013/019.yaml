id: MRK.13.19
reference: Mark 13:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔσονται γὰρ αἱ ἡμέραι ἐκεῖναι θλῖψις οἵα οὐ γέγονεν τοιαύτη ἀπ’ ἀρχῆς κτίσεως ⸀ἣν ἔκτισεν ὁ θεὸς ἕως τοῦ νῦν καὶ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/019.yaml
  text: For those days will be a tribulation such as has not been from the beginning of the creation that God created until now[a], and never will be.
translation:
  language: te
  text: ఎందుకంటే ఆ రోజులు, దేవుడు సృష్టించిన సృష్టి ఆరంభం నుంచి ఇప్పటివరకు ఎన్నడూ లేనంత తీవ్రమైన శ్రమకాలంగా ఉంటాయి; ఇక ఎప్పటికీ అలాంటిది ఉండదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλῖψις
  choice: తీవ్రమైన శ్రమకాలం
  rationale: ఈ అంత్యకాల ప్రసంగంలో అసాధారణ స్థాయిలో కలిగే తీవ్రమైన బాధను సూచిస్తుంది. ‘శ్రమకాలం’ సందర్భానికి తగిన గంభీరతను నిలుపుతుంది; ‘తీవ్రమైన’ అనే పదం దాని అసాధారణ పరిమాణాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: οἵα οὐ γέγονεν τοιαύτη
  choice: ఎన్నడూ లేనంత
  rationale: రాబోయే శ్రమకు సాటిగా మరొకటి లేదనే గ్రీకు తులనాత్మక నిర్మాణపు బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: సృష్టి ఆరంభం నుంచి
  rationale: κτίσις‌ను ‘సృష్టి’గా నేరుగా ఉంచి, కాలారంభ భావాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: ἣν ἔκτισεν ὁ θεὸς
  choice: దేవుడు సృష్టించిన
  rationale: దేవుడే సృష్టికర్త అని తెలిపే సంబంధవాచక ఉపవాక్యాన్ని తొలగించకుండా, తెలుగులో సహజంగా ముందుంచింది.
- source_word: ἕως τοῦ νῦν
  choice: ఇప్పటివరకు
  rationale: గ్రీకు కాలసూచనకు సహజమైన, ఖచ్చితమైన తెలుగు సమానం.
- source_word: οὐ μὴ γένηται
  choice: ఇక ఎప్పటికీ అలాంటిది ఉండదు
  rationale: οὐ μή అనే బలమైన భవిష్యత్ నిరాకరణను ‘ఇక ఎప్పటికీ’ ద్వారా వ్యక్తం చేస్తుంది; గ్రీకులో లేని ‘మళ్లీ’ అనే భావాన్ని ప్రత్యేకంగా చేర్చకుండా, సూచిత పోలికను ‘అలాంటిది’ ద్వారా నిలుపుతుంది.
- source_word: ἔσονται ... αἱ ἡμέραι ἐκεῖναι θλῖψις
  choice: ఆ రోజులు ... శ్రమకాలంగా ఉంటాయి
  rationale: ‘ఆ రోజులు శ్రమగా ఉంటాయి’ అనే సంక్షిప్త గ్రీకు విధేయ నిర్మాణాన్ని తెలుగులో సహజంగా ‘శ్రమకాలంగా ఉంటాయి’ అని అందిస్తుంది.
theological_decisions:
- issue: ‘సృష్టి’ భాష యొక్క పరిధి
  choice: ‘దేవుడు సృష్టించిన సృష్టి ఆరంభం నుంచి’ అనే సృష్టి-వ్యాప్త భాషను నిలుపడం
  alternative: ‘లోకం పుట్టినప్పటి నుంచి’ అని మరింత స్వేచ్ఛగా చెప్పడం
  rationale: మూలంలో κτίσις, κτίζω రెండూ ఉండి దేవుడు కర్తగా పేర్కొనబడ్డాడు. కాబట్టి వాక్యాన్ని స్థానిక లేదా ఒడంబడిక సంబంధిత ఆరంభానికి పరిమితం చేయకుండా మూలంలోని సృష్టి పరిధిని నిలిపాం.
- issue: చివరి నిరాకరణలో ‘మళ్లీ’ భావం
  choice: ‘ఇక ఎప్పటికీ అలాంటిది ఉండదు’
  alternative: ‘మళ్లీ ఎన్నడూ జరగదు’
  rationale: οὐ μὴ γένηται భవిష్యత్తు గురించి అత్యంత బలమైన నిరాకరణను ఇస్తుంది; ‘మళ్లీ’ అనేది సందర్భం నుంచి గ్రహించగలిగినా గ్రీకులో స్పష్టంగా లేదు. అందువల్ల దాన్ని చేర్చకుండా భావబలాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే అంత్యకాల సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. మూలంలోని పునరుక్త సృష్టి భాషను సంక్షిప్తం చేయకుండా నిలిపింది.
