id: MRK.13.14
reference: Mark 13:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως ⸀ἑστηκότα ὅπου οὐ δεῖ, ὁ ἀναγινώσκων νοείτω, τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/014.yaml
  text: But when you see the abomination of desolation standing where it ought not to be (let the reader understand)[a], then let those in Judea flee to the mountains[b],
translation:
  language: te
  text: అయితే, నాశనకరమైన అసహ్యమైనది ఉండకూడని చోట నిలిచి ఉండడాన్ని మీరు చూసినప్పుడు—చదివేవాడు గ్రహించాలి[a]—యూదయలో ఉన్నవారు అప్పుడు కొండలకు పారిపోవాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు ఉండకూడని చోట నిలిచి ఉండడం.” గ్రీకులో ‘నిలిచి ఉన్న’ అనే కృదంతం పుంలింగంలో ఉంది; ఇది ‘అసహ్యమైనది’ వెనుక ఒక వ్యక్తిగత సూచన ఉండవచ్చని తెలియజేస్తుంది.
    reason: alternative_reading
  - marker: b
    text: ‘నాశనకరమైన అసహ్యమైనది’ అనే మాటలు దానియేలు గ్రంథంలోని భాషను ప్రతిధ్వనిస్తాయి (దాని. 9:27; 11:31; 12:11 చూడండి).
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: అయితే, ... చూసినప్పుడు
  rationale: ὅταν యొక్క కాలసంబంధ భావాన్ని ‘చూసినప్పుడు’ సహజంగా తెలియజేస్తూ, δέ యొక్క స్వల్ప సంధాన/వ్యతిరేక ఛాయను ‘అయితే’ నిలుపుతుంది.
- source_word: ἴδητε
  choice: మీరు చూసినప్పుడు
  rationale: కాలసంబంధ ఉపవాక్యంలో ఉన్న ὁράω క్రియారూపానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: పాడుచేసే హేయమైనది
  rationale: βδέλυγμα యొక్క అసహ్యకరమైన, అపవిత్రమైన విషయమనే భావాన్ని ‘హేయమైనది’ తెలియజేస్తుంది; τῆς ἐρημώσεως యొక్క వినాశకర భావాన్ని సహజ తెలుగులో ‘పాడుచేసే’గా వ్యక్తం చేస్తుంది. నిర్దిష్ట చారిత్రక వ్యక్తి, వస్తువు లేదా చర్యను నిర్ణయించదు.
- source_word: ἑστηκότα
  choice: నిలిచి ఉండడం
  rationale: ἵστημι యొక్క పరిపూర్ణ కృదంతం గతంలో నిలపబడినదాని ప్రస్తుత స్థితిని సూచిస్తుంది; ‘నిలిచి ఉండడం’ ఆ స్థితిని సహజంగా నిలుపుతుంది.
- source_word: ὅπου οὐ δεῖ
  choice: ఉండకూడని చోట
  rationale: δεῖ ఇక్కడ యోగ్యత/అవశ్యకతను సూచిస్తుంది. తెలుగు ప్రధాన పాఠంలో ప్రత్యక్ష నామవాచకమైన ‘హేయమైనది’తో సహజంగా అన్వయిస్తుంది; వ్యక్తిగత సూచన సాధ్యతను పాదటిప్పణి భద్రపరుస్తుంది.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: చదివేవాడు గ్రహించాలి
  rationale: మధ్యలో చేర్చిన హెచ్చరికను సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τότε
  choice: అప్పుడు
  rationale: ఆ సూచనను చూసిన తరువాత చేయవలసిన చర్యను అనుసంధానిస్తుంది.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: యూదయలో ఉన్నవారు
  rationale: భౌగోళిక నిర్దిష్టతను యథాతథంగా ఉంచే సహజ తెలుగు రూపం.
- source_word: φευγέτωσαν
  choice: పారిపోవాలి
  rationale: మూడవ పురుష బహువచన ఆజ్ఞ యొక్క అత్యవసర బలాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἰς τὰ ὄρη
  choice: కొండలకు
  rationale: ὄρηకు సందర్భానుకూలమైన, సాధారణ పాఠకులకు సహజమైన తెలుగు సమానం.
theological_decisions:
- issue: దానియేలు గ్రంథాన్ని ప్రతిధ్వనించే βδέλυγμα τῆς ἐρημώσεως పదబంధం
  choice: ‘పాడుచేసే హేయమైనది’ అని మూలానికి సమీపంగా ఉంచి, దాని చారిత్రక సూచనను ప్రధాన పాఠంలో నిర్దిష్టం చేయలేదు.
  alternative: ‘వినాశనకరమైన అపవిత్ర కార్యం’ లేదా ఒక నిర్దిష్ట అపవిత్ర వ్యక్తి/వస్తువుగా వివరించడం.
  rationale: ఈ పదబంధం వస్తువు, కార్యం లేదా వ్యక్తిని సూచించవచ్చు; వివాదాస్పదమైన చారిత్రక-అంత్యకాల గుర్తింపును అనువాదం నిర్ణయించకుండా దాని సూచనాత్మక ఉద్రిక్తతను కాపాడాలి.
- issue: నపుంసకలింగ βδέλυγμαతో అనుసంధానమైన పుంలింగ ἑστηκότα
  choice: ప్రధాన పాఠంలో ‘హేయమైనది ... నిలిచి ఉండడం’ అని పఠనసౌలభ్యాన్ని కాపాడి, వ్యక్తిగత సూచన సాధ్యతను [a] పాదటిప్పణిలో తెలిపాం.
  alternative: ‘అతడు ఉండకూడని చోట నిలిచి ఉండడం’ అని ప్రధాన పాఠంలో అనువదించడం.
  rationale: గ్రీకు పుంలింగ కృదంతం అంతర్లీన వ్యక్తిని లేదా వ్యక్తీకరణను సూచించవచ్చు; అయితే ప్రత్యక్ష నామవాచకం నపుంసకలింగంలో ఉంది. అందువల్ల ఏకైక వ్యాఖ్యానాన్ని బలవంతంగా ఎంచుకోకుండా రెండు అవకాశాలనూ భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. అపోకలిప్టిక్ పదబంధంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతూ, ఆజ్ఞ యొక్క అత్యవసరతను ‘పారిపోవాలి’ ద్వారా స్పష్టంగా వ్యక్తం చేశాం.
