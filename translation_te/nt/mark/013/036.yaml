  text: lest, coming suddenly, he find you sleeping.
translation:
  language: te
  text: ఆయన అకస్మాత్తుగా వచ్చి మిమ్మల్ని నిద్రపోతూ ఉండగా కనుగొనకుండునట్లు జాగ్రత్తగా ఉండండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαίφνης
  choice: అకస్మాత్తుగా
  rationale: హఠాత్తుగా, ఊహించని సమయంలో రావడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εὕρῃ
  choice: చూడడం
  rationale: ‘మిమ్మల్ని ఒక స్థితిలో కనుగొనడం’ అనే గ్రీకు ప్రయోగాన్ని తెలుగులో సహజంగా ‘మీరు ... ఉండడం చూడడం’గా అందిస్తుంది.
- source_word: καθεύδοντας
  choice: నిద్రపోతూ ఉండడం
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న స్థితిని నిలుపుతుంది; సందర్భంలోని అప్రమత్తతకు వ్యతిరేకమైన రూపక భావాన్ని ముందుగానే వివరణతో పరిమితం చేయదు.
theological_decisions:
- issue: నిద్ర అనే పదం అక్షరార్థమా, రూపకార్థమా
  choice: ‘నిద్రపోతూ’ అనే మూల రూపకాన్నే నిలుపుకోవడం
  alternative: ‘అప్రమత్తంగా లేకపోవడం’ అని స్పష్టీకరించడం
  rationale: మూల వచనం నిజమైన నిద్ర మరియు ఆధ్యాత్మిక అప్రమత్తతల మధ్య ఉన్న సందర్భోచిత ద్వంద్వార్థాన్ని ఉంచుతుంది; దానిని వ్యాఖ్యానంతో ఒక్క అర్థానికే పరిమితం చేయలేదు.
- issue: నిషేధార్థక ఉద్దేశ వాక్య నిర్మాణం
  choice: ‘... చూడకుండా జాగ్రత్తపడండి’
  alternative: ‘ఒకవేళ ... చూస్తాడేమో’
  rationale: μὴ ... εὕρῃ లోని హెచ్చరిక/నివారణ భావాన్ని సహజ తెలుగులో అందిస్తూ, క్రియకు కర్త అయిన ‘ఆయన’ను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన హెచ్చరిక శైలి. ముందరి వచనంలోని ఆజ్ఞార్థక సందర్భాన్ని తెలుగులో పూర్తి వాక్యంగా సహజంగా ప్రతిబింబించింది.
