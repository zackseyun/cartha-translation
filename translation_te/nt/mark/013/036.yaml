revisions:
- from: ఆయన అకస్మాత్తుగా వచ్చి, మీరు నిద్రపోతూ ఉండడం చూడకుండా జాగ్రత్తపడండి.
  to: ఆయన అకస్మాత్తుగా వచ్చి మిమ్మల్ని నిద్రపోతూ ఉండగా కనుగొనకుండునట్లు జాగ్రత్తగా ఉండండి.
  rationale: The revision restores the source verb's 'find' sense, keeps 'suddenly' with the act of coming, and retains the ambiguous sleeping image. It uses a modern standard Telugu warning construction suitable for the verse's dependence on the preceding command to keep watch.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:14:43Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft retains the warning, sudden arrival, and sleeping imagery, but it renders εὕρῃ (''find'') as ''చూడడం'' (''see'') and reshapes the clause more freely than necessary. The Greek construction is a negative purpose/warning clause: ''lest, coming suddenly, he find you sleeping.'''
  naturalness: The present Telugu is understandable, but 'మీరు నిద్రపోతూ ఉండడం చూడకుండా జాగ్రత్తపడండి' is somewhat indirect and makes the warning sound like preventing him from seeing them. A purpose clause with 'కనుగొనకుండునట్లు' is clearer and natural in a formal modern Bible register.
  terminology: '''అకస్మాత్తుగా'' appropriately renders ἐξαίφνης, and ''నిద్రపోతూ ఉండగా'' preserves the participial state without deciding whether the contextual sense is literal or figurative. ''కనుగొన'' is the closer equivalent for εὕρῃ.'
  issues:
  - severity: medium
    issue: εὕρῃ is translated as 'చూడడం' rather than 'కనుగొనడం.'
    rationale: While 'see' can be contextually related, the source says that the coming master may 'find' the hearers in a sleeping state. 'కనుగొనడం' preserves this wording and the resulting-state nuance more precisely.
  - severity: low
    issue: The Telugu warning construction is unnecessarily indirect.
    rationale: Using 'కనుగొనకుండునట్లు జాగ్రత్తగా ఉండండి' directly expresses the Greek negative warning/purpose sense and avoids the implication that the concern is merely his observing them.
  revised_text: ఆయన అకస్మాత్తుగా వచ్చి మిమ్మల్ని నిద్రపోతూ ఉండగా కనుగొనకుండునట్లు జాగ్రత్తగా ఉండండి.
  revised_footnotes: []
  revision_rationale: The revision restores the source verb's 'find' sense, keeps 'suddenly' with the act of coming, and retains the ambiguous sleeping image. It uses a modern standard Telugu warning construction suitable for the verse's dependence on the preceding command to keep watch.
