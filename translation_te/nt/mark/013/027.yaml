revisions:
- from: అప్పుడు ఆయన దేవదూతలను పంపి, నాలుగు దిక్కుల గాలుల నుండి[b]—భూమి అంచు మొదలుకొని ఆకాశం అంచు వరకు[c]—ఎన్నుకోబడినవారిని[a] సమకూరుస్తాడు.
  to: అప్పుడు ఆయన దేవదూతలను పంపి, ఎన్నుకోబడినవారిని నాలుగు దిక్కుల గాలుల నుండి, భూమి అంచు నుండి ఆకాశం అంచు వరకు, ఒకచోట చేర్చుతాడు.
  rationale: 'The revision makes only safe stylistic and lexical adjustments: it clarifies that the chosen people are those gathered from the stated full extent, uses an idiomatic verb for gathering people, and corrects the alternative Telugu wording in footnote a. The source’s spatial imagery and its ambiguity are retained.'
