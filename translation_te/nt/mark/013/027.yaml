id: MRK.13.27
reference: Mark 13:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τότε ἀποστελεῖ τοὺς ⸀ἀγγέλους καὶ ἐπισυνάξει τοὺς ⸀ἐκλεκτοὺς ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρου γῆς ἕως ἄκρου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/027.yaml
  text: And then he will send out the angels and gather the chosen ones from the four winds[c][b][a], from the end of the earth to the end of heaven.
translation:
  language: te
  text: అప్పుడు ఆయన దేవదూతలను పంపి, ఎన్నుకోబడినవారిని నాలుగు దిక్కుల గాలుల నుండి, భూమి అంచు నుండి ఆకాశం అంచు వరకు, ఒకచోట చేర్చుతాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: అంత్యకాల ప్రసంగంలోని సంఘటనల క్రమాన్ని సహజంగా సూచించే కాలవాచక పదం.
- source_word: ἀποστελεῖ
  choice: పంపి
  rationale: భవిష్యత్ చర్యను తెలుగులో తరువాతి సమాపక క్రియతో సహజంగా అనుసంధానిస్తుంది; దేవదూతలను కార్యనిమిత్తం పంపే భావాన్ని నిలుపుతుంది.
- source_word: ἀγγέλους
  choice: దేవదూతలను
  rationale: ఈ ప్రళయదర్శన సందర్భంలో మానవ దూతలు కాక పరలోక సంబంధమైన దూతలే ఉద్దేశించబడ్డారు.
- source_word: ἐπισυνάξει
  choice: సమకూరుస్తాడు
  rationale: చెల్లాచెదురుగా ఉన్నవారిని ఒకచోట చేర్చే భావాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐκλεκτούς
  choice: ఎన్నుకోబడినవారిని
  rationale: దేవునిచేత ఎంపిక చేయబడినవారు అనే భావాన్ని తెలియజేస్తూ, తరువాతి కాలపు నిర్దిష్ట సిద్ధాంతపరమైన సాంకేతిక పదజాలాన్ని రుద్దదు.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: నాలుగు దిక్కుల గాలుల నుండి
  rationale: గ్రీకు మూలంలోని ‘నాలుగు గాలులు’ అనే చిత్రాన్ని, అది అన్ని దిక్కులను సూచిస్తుందనే భావంతో తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: ἀπ’ ἄκρου γῆς ἕως ἄκρου οὐρανοῦ
  choice: భూమి అంచు మొదలుకొని ఆకాశం అంచు వరకు
  rationale: మొత్తం వ్యాప్తిని తెలిపే మూలభాషా సమాంతర రూపకాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: καὶ τότε ... καὶ
  choice: అప్పుడు ... పంపి
  rationale: తెలుగు వాక్య నిర్మాణంలో అసహజమైన సంధికారక పునరుక్తిని నివారిస్తూ, రెండు చర్యల క్రమం మరియు అనుసంధానాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ἐκλεκτούς అనే పదాన్ని అంత్యకాల సందర్భంలో అనువదించడం
  choice: ఎన్నుకోబడినవారు
  alternative: ఎన్నికైనవారు
  rationale: ఎంపిక దేవుని చర్యవల్ల జరిగిందనే భావాన్ని నిలుపుతుంది; అయితే ఎవరు, ఏ సిద్ధాంతపరమైన విధానంలో ఎన్నుకోబడ్డారో వచనం చెప్పనిదాన్ని అనువాదం నిర్ణయించదు.
- issue: సమకూర్చడం యొక్క భౌగోళిక/విశ్వవ్యాప్త పరిధి
  choice: నాలుగు దిక్కుల గాలుల నుండి—భూమి అంచు మొదలుకొని ఆకాశం అంచు వరకు
  alternative: లోకమంతటి నుండి / ఆకాశం ఒక అంచు నుండి మరొక అంచు వరకు
  rationale: మూలంలోని దిక్కుల రూపకాన్నీ, భూమి నుండి ఆకాశం వరకు ఉన్న విస్తృతి చిత్రాన్నీ కుదించకుండా ఉంచుతుంది; ‘ఆకాశం’ ఇక్కడ స్థలవ్యాప్తి చిత్రంలో భాగం, దేవుని నివాసం గురించిన ప్రత్యేక సిద్ధాంత ప్రకటనగా నిర్ధారించబడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా గౌరవప్రదంగా ఉంది. మూలంలోని అంత్యకాల దృశ్యభాషను నిలుపుతూ, వాక్య ప్రవాహం కోసం తెలుగు క్రియానుసంధానాన్ని ఉపయోగించింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
