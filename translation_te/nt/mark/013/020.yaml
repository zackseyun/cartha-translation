id: MRK.13.20
reference: Mark 13:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ⸂ἐκολόβωσεν κύριος⸃ τὰς ἡμέρας, οὐκ ἂν ἐσώθη πᾶσα σάρξ. ἀλλὰ διὰ τοὺς ἐκλεκτοὺς οὓς ἐξελέξατο ἐκολόβωσεν τὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/020.yaml
  text: And if the Lord had not cut short the days[a], no flesh would have been saved. But for the sake of the elect, whom he chose, he cut short the days.
translation:
  language: te
  text: ప్రభువు ఆ రోజులను కుదించకపోయి ఉంటే, ఏ మనిషీ[a] రక్షించబడేవాడు కాదు. అయితే ఎన్నికైనవారి కోసం—వారిని ఆయన ఎన్నుకున్నాడు—ఆ రోజులను కుదించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, “ఏ శరీరమూ” లేదా “ఏ మాంసమూ”; భావం, “ఏ మనిషీ.”
    reason: మూలంలోని πᾶσα σάρξ అనే నుడికారపు పదశః రూపాన్ని చూపిస్తూ, సందర్భార్థం మానవులను సూచిస్తుందని తెలియజేయడం.
lexical_decisions:
- source_word: ἐκολόβωσεν
  choice: కుదించాడు
  rationale: κολοβόω అంటే పొడవు లేదా వ్యవధిని తగ్గించడం. విపత్తు దినాల వ్యవధిని తగ్గించిన భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘కుదించాడు’ స్పష్టంగా తెలియజేస్తుంది; రెండు సందర్భాల్లోనూ ఒకే పదాన్ని ఉంచాం.
- source_word: κύριος
  choice: ప్రభువు
  rationale: సందర్భంలో నిర్దిష్టమైన దైవిక కర్తను సూచించే κύριοςకు స్థిరమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం.
- source_word: τὰς ἡμέρας
  choice: ఆ రోజులను
  rationale: ముందు వివరించిన శ్రమకాలపు రోజులను తిరిగి సూచిస్తున్నందున తెలుగు నిర్దేశకమైన ‘ఆ’ సహజంగా ఆ సందర్భ సంబంధాన్ని వ్యక్తం చేస్తుంది; కాలాన్ని మరింత నిర్దిష్టం చేయలేదు.
- source_word: οὐκ ἂν ἐσώθη
  choice: రక్షించబడేవాడు కాదు
  rationale: ἄνతో కూడిన రూపం జరగని షరతు ఫలితాన్ని సూచిస్తుంది. సందర్భంలో ప్రాణాలతో కాపాడబడడమే ప్రధాన భావమైనా, σῴζω యొక్క విస్తృతమైన ‘రక్షించు’ పదాన్ని నిలిపి, భావాన్ని కేవలం ‘బతికివుండు’గా కుదించలేదు.
- source_word: πᾶσα σάρξ
  choice: ఏ మనిషీ
  rationale: పదశః ‘సమస్త శరీరం/మాంసం’ అయిన ఈ బైబిలీయ నుడికారం ఇక్కడ మానవజాతిని సూచిస్తుంది. ప్రతికూల వాక్యంలో సహజమైన తెలుగు ‘ఏ మనిషీ ... కాదు’ అర్థాన్ని స్పష్టంగా ఇస్తుంది; పదశః రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: ఎన్నుకున్నవారి కోసం
  rationale: διά + accusative ఇక్కడ వారి నిమిత్తం లేదా మేలు కోసం జరిగిన చర్యను సూచిస్తుంది. ‘కోసం’ ఈ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκλεκτούς
  choice: ఎన్నుకున్నవారు
  rationale: ἐκλεκτός యొక్క ఎంపిక భావాన్ని సాధారణ పాఠకునికి నేరుగా అర్థమయ్యే తెలుగులో తెలియజేస్తుంది; ప్రత్యేక మతశాస్త్ర పద్ధతిని రుద్దదు.
- source_word: οὓς ἐξελέξατο
  choice: తాను ఎన్నుకున్నవారి
  rationale: సంబంధ వాక్యాన్ని తెలుగులో సహజంగా విశేషణ రూపంలో కలిపాం. ‘తాను’ అనే ఆత్మవాచక సర్వనామం ఎన్నుకున్నవాడు ప్రభువేనని స్పష్టం చేస్తుంది; మూలంలోని ἐκλεκτούς/ἐξελέξατο పదప్రయోగ సంబంధాన్ని ‘ఎన్నుకున్న’ ద్వారా నిలిపాం.
theological_decisions:
- issue: ఈ సందర్భంలో ‘రక్షించబడటం’ అనే మాట భావం
  choice: ప్రధానంగా శ్రమకాలంలో మానవ ప్రాణాలు కాపాడబడటాన్ని సూచిస్తూ, ప్రధాన పాఠ్యంలో ‘రక్షించబడేవాడు’ అని ఉంచడం.
  alternative: ‘బతికేవాడు కాదు’ లేదా దీనిని పూర్తిగా ఆత్మీయ నిత్యరక్షణగా అర్థం చేయడం.
  rationale: రోజులు కుదించబడకపోతే మనుషులు నశించే సందర్భమే తక్షణ భావం. అయినా σῴζωను కేవలం జీవించి మిగలడానికే పరిమితం చేయకుండా దాని విస్తృత పదార్థాన్ని నిలిపాం; నిత్యరక్షణ గురించిన ప్రత్యేక సిద్ధాంతాన్ని వచనంలో చేర్చలేదు.
- issue: ἐκλεκτοί ఎవరనే ప్రశ్న
  choice: ప్రభువు ఎన్నుకున్నవారు అనే పాఠ్య నిర్దేశాన్ని మాత్రమే నిలిపి ఉంచడం.
  alternative: దీనిని ప్రత్యేకంగా సామూహిక ఎన్నికగా లేదా వ్యక్తిగత పూర్వనిర్ణయంగా నిర్వచించడం.
  rationale: వచనం వారు దేవునిచేత ఎన్నుకోబడినవారని చెబుతుంది గాని ఎన్నిక స్వభావంపై విస్తృత సిద్ధాంత వివాదాలను ఇక్కడ పరిష్కరించదు. అందువల్ల ‘తాను ఎన్నుకున్నవారు’ అనే తెరచిన రూపం వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల వాక్యనిర్మాణం వాడాం. ‘కుదించాడు’ను రెండు సార్లూ ఉంచి మూలంలోని పునరుక్తిని నిలిపాం. ‘ఎన్నుకున్నవారి’ అనే రూపం సహజతతో పాటు మూలంలోని ఎంపిక భావాన్ని కాపాడుతుంది.
