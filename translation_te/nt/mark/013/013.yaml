id: MRK.13.13
reference: Mark 13:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου. ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/013.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: te
  text: నా పేరు కారణంగా అందరూ మిమ్మల్ని ద్వేషిస్తారు.[a] అయితే చివరి వరకు సహించేవాడు రక్షించబడతాడు.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా పేరు నిమిత్తం.’
    reason: lexical_alternative
  - marker: b
    text: ‘సహించేవాడు’ అనే మాటను ‘పట్టుదలతో నిలిచేవాడు’ లేదా ‘చివరి వరకు స్థిరంగా ఉండేవాడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘విడిపించబడతాడు.’ గ్రీకు పదం ప్రమాదం నుంచి విడిపించడాన్నీ, రక్షణనూ సూచించగలదు; ఇక్కడ దాని పూర్తి భావపరిధి తెరిచి ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι ὑπὸ πάντων
  choice: అందరూ మిమ్మల్ని ద్వేషిస్తారు
  rationale: ἔσεσθε μισούμενοι అనే భవిష్యత్ భావాన్ని ఆధునిక తెలుగులో సహజమైన కర్తరి వాక్యంగా ఇచ్చాం; πάντων లోని విస్తృతమైన ‘అందరూ’ అనే భావాన్ని తగ్గించలేదు.
- source_word: διὰ τὸ ὄνομά μου
  choice: నా పేరు కారణంగా
  rationale: διά + accusative తెలిపే కారణ భావాన్ని స్పష్టంగా ఉంచుతూ, ‘పేరు’ ద్వారా యేసు వ్యక్తిత్వం, అధికారం, ఆయనతో అనుబంధం సూచించబడే బైబిలు ప్రయోగాన్ని నిలిపాం.
- source_word: ὁ δὲ ὑπομείνας
  choice: అయితే ... సహించేవాడు
  rationale: ὑπομένω ఒత్తిడి, శ్రమల మధ్య నిలకడగా ఉండడాన్ని సూచిస్తుంది. ‘సహించేవాడు’ సాధారణ పాఠకులకు సహజంగా ఉండి, తరువాతి సిద్ధాంత పరిభాషను అనవసరంగా చేర్చదు.
- source_word: εἰς τέλος
  choice: చివరి వరకు
  rationale: పరీక్ష ముగింపు, వ్యక్తి జీవితం ముగింపు, లేదా అంత్యకాల ముగింపు అనే సాధ్యమైన పరిధులను నిర్ణయించకుండా మూలంలోని అస్పష్టతను నిలుపుతుంది.
- source_word: οὗτος
  choice: తెలుగులో ప్రత్యేకంగా పునరుక్తి చేయలేదు
  rationale: ముందున్న నామవాచకార్థక కృదంతాన్ని తిరిగి సూచించే గ్రీకు οὗτος యొక్క నొక్కిచెప్పే భావం తెలుగులో ‘సహించేవాడు రక్షించబడతాడు’ అనే నిర్మాణంలో సహజంగా వ్యక్తమవుతుంది; ‘ఇతడే’ అని చేరిస్తే సందర్భానికంటే అధిక విరుద్ధ నొక్కు రావచ్చు.
- source_word: σωθήσεται
  choice: రక్షించబడతాడు
  rationale: σῴζω లోని విడిపించడం మరియు సంపూర్ణ రక్షణ అనే భావవ్యాప్తిని తెలుగులోని సాంప్రదాయమైనప్పటికీ సులభంగా అర్థమయ్యే ‘రక్షించబడతాడు’ నిలుపుతుంది.
theological_decisions:
- issue: సహన వాక్యంలో σωθήσεται యొక్క అర్థం
  choice: రక్షించబడతాడు
  alternative: విడిపించబడతాడు
  rationale: ఇది కేవలం తాత్కాలిక ప్రమాదం నుంచి విడిపించబడడమని గానీ, ఏదైనా ప్రత్యేక సంఘపరమైన సహన సిద్ధాంతమని గానీ నిర్ధారించకుండా గ్రీకు పదంలోని రక్షణ సంబంధమైన విస్తృతిని నిలుపుతుంది.
- issue: πάντων యొక్క పరిధి
  choice: అందరూ
  alternative: ప్రజలందరూ
  rationale: మూలంలోని ఉద్దేశపూర్వక విస్తృత ప్రకటనను వివరణాత్మక పరిమితులతో తగ్గించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు స్పష్టమైన శైలి. గ్రీకు వాక్యంలోని కఠినమైన భావాన్ని నిలుపుతూ, కృత్రిమమైన పునరుక్తిని నివారించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
