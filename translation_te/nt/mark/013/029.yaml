id: MRK.13.29
reference: Mark 13:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ⸂ἴδητε ταῦτα⸃ γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/029.yaml
  text: So also you[a], when you see these things happening, know that it is near, at the doors.
translation:
  language: te
  text: అదేవిధంగా మీరు కూడా, ఇవి జరుగుతున్నట్లు చూసినప్పుడు, అది గుమ్మాల దగ్గరే ఉందని తెలుసుకోండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన గుమ్మాల దగ్గరే ఉన్నాడని.” గ్రీకు వాక్యంలో కర్త స్పష్టంగా చెప్పబడలేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: అలాగే మీరు కూడా
  rationale: οὕτως ముందున్న అంజూరపు చెట్టు ఉపమానంతో ఈ మాటను అనుసంధానిస్తుంది; καὶ ὑμεῖς శిష్యులను అనురూప పరిశీలకులుగా నొక్కిచెబుతుంది. ఈ తెలుగు రూపం రెండింటినీ సహజంగా నిలుపుతుంది.
- source_word: ὅταν ἴδητε
  choice: చూసినప్పుడు
  rationale: ὅταν మరియు aorist subjunctive భవిష్యత్తులో సంభవించే పరిస్థితిని సూచిస్తాయి; ఈ సందర్భంలో ‘చూసినప్పుడు’ సహజమైన ఆధునిక తెలుగు.
- source_word: ταῦτα γινόμενα
  choice: ఇవి జరుగుతున్నట్లు
  rationale: ταῦτα అనే బహువచన సూచనను ‘ఇవి’గా నిలిపి, γινόμενα యొక్క జరుగుతూ ఉండడం/సంభవించడం అనే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: γινώσκετε
  choice: తెలుసుకోండి
  rationale: వర్తమాన ఆజ్ఞారూపం సూచనలను చూసి తగిన నిర్ణయానికి రావాలని చెబుతుంది; ‘తెలుసుకోండి’ దాని ప్రత్యక్ష ఆజ్ఞాత్మక బలాన్ని నిలుపుతుంది.
- source_word: ὅτι ἐγγύς ἐστιν
  choice: అది దగ్గరగా ఉందని
  rationale: గ్రీకులో ἐστιν‌కు కర్త స్పష్టంగా లేదు. తెలుగు వాక్యానికి అవసరమైన సర్వనామంగా ‘అది’ను సరఫరా చేయడం రాబోయే సంఘటన లేదా నెరవేర్పును సాధారణంగా సూచిస్తుంది; వ్యక్తిగత కర్తను బలవంతంగా నిర్ణయించదు.
- source_word: ἐπὶ θύραις
  choice: గుమ్మాల దగ్గరే
  rationale: θύραις బహువచనాన్ని ‘గుమ్మాలు’గా నిలుపుతూ, -ఏ ద్వారా అత్యంత సమీపత్వాన్ని తెలిపే గ్రీకు నుడికార బలాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἐστιν (‘దగ్గరగా ఉంది’) యొక్క అంతర్లీన కర్త
  choice: ప్రధాన పాఠ్యంలో ‘అది దగ్గరగా ... ఉంది’ అని అవ్యక్త/సంఘటనాత్మక సూచనతో అనువదించడం.
  alternative: ‘ఆయన దగ్గరగా ... ఉన్నాడు’ అని వ్యక్తిగతంగా అనువదించడం.
  rationale: గ్రీకు కర్తను పేర్కొనదు. ‘అది’ అనడం ద్వారా సూచనలు తెలియజేసే సమీప నెరవేర్పును సాధారణంగా ఉంచి, పాఠ్యం స్పష్టంగా చెప్పని నిర్దిష్ట వ్యక్తిని దిగుమతి చేయకుండా ఉంటుంది. ‘ఆయన’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే వాక్య గౌరవం మరియు మూలంలోని బహువచనం, అవ్యక్త కర్త, సమీపత్వ నుడికారాన్ని నిలుపుతూ రూపొందించబడింది.
