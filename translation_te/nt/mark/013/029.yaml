revisions:
- from: అలాగే మీరు కూడా, ఇవి జరుగుతున్నట్లు చూసినప్పుడు, అది దగ్గరగా, గుమ్మాల దగ్గరే ఉందని తెలుసుకోండి.[a]
  to: అదేవిధంగా మీరు కూడా, ఇవి జరుగుతున్నట్లు చూసినప్పుడు, అది గుమ్మాల దగ్గరే ఉందని తెలుసుకోండి.[a]
  rationale: The revision removes an unnatural duplication while preserving the Greek plural door imagery, the imperative, and the deliberately unspecified subject. The footnote continues to present the viable personal referent without imposing it on the main text.
