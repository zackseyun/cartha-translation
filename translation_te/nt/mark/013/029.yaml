review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the future-contingent observation (ὅταν ἴδητε), the plural ‘these things,’ the imperative to draw a conclusion, and the unstated subject of ἐστιν. However, ‘దగ్గరగా, గుమ్మాల దగ్గరే’ redundantly renders the single Greek nearness idiom (ἐγγύς ... ἐπὶ θύραις). In Telugu, ‘గుమ్మాల దగ్గరే’ naturally conveys the intended extreme nearness without a second, repetitive ‘దగ్గరగా.’
  naturalness: The wording is generally modern and clear. Replacing ‘అలాగే’ with ‘అదేవిధంగా’ gives the comparison with the preceding illustration a slightly clearer, standard connective force. Removing the repeated proximity expressions makes the predicate idiomatic Telugu.
  terminology: ‘గుమ్మాల దగ్గరే’ appropriately retains the plural-door imagery and expresses the idiom of imminent nearness. The supplied impersonal ‘అది’ remains suitably noncommittal, while the personal alternative is retained in the footnote.
  issues:
  - severity: low
    issue: Redundant rendering of nearness
    rationale: ‘అది దగ్గరగా, గుమ్మాల దగ్గరే ఉంది’ repeats ‘near’ in Telugu. The Greek expression is idiomatic as a whole (‘near, at the doors’); Telugu ‘గుమ్మాల దగ్గరే’ conveys its force naturally.
  revised_text: అదేవిధంగా మీరు కూడా, ఇవి జరుగుతున్నట్లు చూసినప్పుడు, అది గుమ్మాల దగ్గరే ఉందని తెలుసుకోండి.[a]
  revised_footnotes:
  - marker: a
    text: లేదా, “ఆయన గుమ్మాల దగ్గరే ఉన్నాడని.” గ్రీకు వాక్యంలో కర్త స్పష్టంగా చెప్పబడలేదు.
    reason: alternative_reading
  revision_rationale: The revision removes an unnatural duplication while preserving the Greek plural door imagery, the imperative, and the deliberately unspecified subject. The footnote continues to present the viable personal referent without imposing it on the main text.
