source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, ⸀ἔσονται σεισμοὶ κατὰ τόπους, ⸁ἔσονται ⸀λιμοί· ⸀ἀρχὴ ὠδίνων ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/008.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom. There will be earthquakes in various places; there will be famines. These are the beginning of birth pains.
translation:
  language: te
  text: ఎందుకంటే ఒక దేశం మరొక దేశానికి వ్యతిరేకంగా, ఒక రాజ్యం మరొక రాజ్యానికి వ్యతిరేకంగా లేస్తాయి. వివిధ ప్రాంతాల్లో భూకంపాలు వస్తాయి; క్షామాలు వస్తాయి. ఇవి ప్రసవవేదనల[a] ఆరంభం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రసవ నొప్పుల.’ గ్రీకు పదం ప్రసవ సమయంలో కలిగే నొప్పులను సూచిస్తుంది; ఇక్కడ తరువాత జరగబోయేదానికి ముందు వచ్చే బాధలకు రూపకంగా వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: లేస్తాయి
  rationale: ἐγείρω యొక్క భవిష్యత్ కర్మణి రూపం ఇక్కడ ఒక వర్గం మరొక వర్గానికి వ్యతిరేకంగా పోరాటానికి లేవడాన్ని సూచించే నుడికారంగా ఉంది. ‘లేస్తాయి’ ఆ సంఘర్షణ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἔθνος ... ἐπ’ ἔθνος
  choice: ఒక దేశం మరొక దేశానికి వ్యతిరేకంగా
  rationale: ἔθνος ప్రజను లేదా జనసమూహాన్ని కూడా సూచించగలిగినా, βασιλείαతో సమాంతరంగా ఉన్న ఈ సందర్భంలో రాజకీయ దేశం అనే భావం బలంగా ఉంది. తెలుగులో సంబంధాన్ని స్పష్టంగా చెప్పడానికి ‘ఒక... మరొక...’ వాడబడింది.
- source_word: βασιλεία ... ἐπὶ βασιλείαν
  choice: ఒక రాజ్యం మరొక రాజ్యానికి వ్యతిరేకంగా
  rationale: ఇక్కడ βασιλεία రాజ్యపాలన అనే అమూర్త భావం కంటే రాజకీయ రాజ్యాన్ని సూచిస్తుంది; ఈ అనువాదం ముందరి వాక్యభాగంతో ఉన్న సమాంతరతను కాపాడుతుంది.
- source_word: σεισμοὶ
  choice: భూకంపాలు
  rationale: ఈ సందర్భంలో σεισμόςకు స్పష్టమైన, సాధారణ ఆధునిక తెలుగు పదం ‘భూకంపం’.
- source_word: κατὰ τόπους
  choice: వివిధ ప్రాంతాల్లో
  rationale: బహువచన τόπουςతో κατά అనేక వేర్వేరు ప్రదేశాల్లో సంభవించడాన్ని సూచిస్తుంది.
- source_word: λιμοί
  choice: కరవులు
  rationale: λιμός కేవలం ఆకలిని కాక, విస్తృతమైన ఆహార కొరత లేదా కరవును సూచిస్తుంది.
- source_word: ἀρχὴ
  choice: ఆరంభం
  rationale: ఈ సంఘటనలు తరువాతి దానికి మొదటి దశ మాత్రమేనని తెలియజేసే సహజమైన తెలుగు రూపం.
- source_word: ὠδίνων
  choice: ప్రసవవేదనలకు
  rationale: ὠδίνες ప్రసవంతో ముడిపడిన వేదనలను సూచిస్తుంది. ‘ప్రసవవేదనలు’ రూపకాన్ని స్పష్టంగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: ταῦτα
  choice: ఇవి
  rationale: ముందు పేర్కొన్న అనేక సంఘటనలను సూచించే సహజమైన తెలుగు బహువచన సర్వనామం.
theological_decisions:
- issue: ἀρχὴ ὠδίνωνలోని అంత్యకాల రూపకం
  choice: ఈ సంఘటనలు ప్రసవవేదనల ఆరంభమని రూపకాన్ని యథాతథంగా ఉంచడం
  alternative: ఇవి సాధారణ కష్టాల ఆరంభమని రూపకాన్ని తొలగించడం; లేదా నిర్దిష్ట అంత్యకాల వ్యవస్థలోని ఒక ఖచ్చిత దశగా వివరించడం
  rationale: మూలపాఠం బాధను ప్రసవవేదనలతో పోల్చి, తరువాత రాబోయేదానికి ఇవి ముందస్తు వేదనలనే భావాన్ని కలిగిస్తుంది. అనువాదం ఆ ఉద్వేగాన్ని నిలుపుతూ, పాఠంలో లేని ప్రత్యేక అంత్యకాల సిద్ధాంతాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. ‘ఒక... మరొక...’ నిర్మాణం గ్రీకు సమాంతరతను సహజ తెలుగులో స్పష్టం చేస్తుంది. అడుగుటిప్పణి గుర్తు సంబంధిత ‘ప్రసవవేదనలకు’ పదం వద్ద ఉంచబడింది.
