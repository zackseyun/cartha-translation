id: MRK.13.15
reference: Mark 13:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω μηδὲ εἰσελθάτω ⸂τι ἆραι⸃ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/015.yaml
  text: Let the one on the housetop not go down[a], nor enter to take anything out of his house.
translation:
  language: te
  text: ఇంటి మిద్దె మీద ఉన్నవాడు కిందికి దిగకూడదు[a]; తన ఇంట్లో నుంచి ఏదైనా తీసుకోవడానికి లోపలికి వెళ్లకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘మిద్దె’ అంటే ఇంటి చదునైన పైకప్పు భాగం. అప్పట్లో దాన్ని నివాస అవసరాలకు కూడా ఉపయోగించేవారు.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: ఇంటి మిద్దె మీద ఉన్నవాడు
  rationale: వ్యక్తిని సూచించే ఈ పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, ప్రాచీన యూదయ ఇళ్లలో ఉపయోగంలో ఉండే చదునైన మిద్దె భావాన్ని నిలుపుతుంది.
- source_word: δώματος
  choice: మిద్దె
  rationale: ఇక్కడ సాధారణ వాలుకప్పు కాకుండా, ఎక్కి ఉండగలిగే చదునైన ఇంటి పైభాగం ఉద్దేశించబడింది; ‘మిద్దె’ ఆ సాంస్కృతిక దృశ్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: μὴ καταβάτω
  choice: కిందికి దిగకూడదు
  rationale: మూడవ పురుష ఏకవచన నిషేధాజ్ఞను ఆధునిక తెలుగులో సహజంగానూ దృఢంగానూ తెలియజేస్తుంది.
- source_word: μηδὲ εἰσελθάτω
  choice: లోపలికి వెళ్లకూడదు
  rationale: μηδέ కలిపే రెండవ నిషేధాన్ని సమాంతరంగా ఉంచుతుంది; ఇంట్లోకి ప్రవేశించడమే సందర్భంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: τι ἆραι
  choice: ఏదైనా తీసుకోవడానికి
  rationale: అనిర్దిష్ట సర్వనామంతో కూడిన ఉద్దేశార్థక క్రియారూపాన్ని ప్రతిబింబిస్తూ, అత్యవసర పరిస్థితిలో ఏ వస్తువుకోసమూ వెళ్లవద్దనే విస్తృత నిషేధాన్ని తెలియజేస్తుంది.
- source_word: ἐκ τῆς οἰκίας αὐτοῦ
  choice: తన ఇంట్లో నుంచి
  rationale: ἐκ సూచించే లోపలి నుంచి బయటికి తీసుకురావడం అనే భావాన్ని నిలుపుతుంది; αὐτοῦను తెలుగు వాక్యనిర్మాణానికి సహజమైన ప్రతిబింబక ‘తన’తో ఏకవచనంలో ఉంచుతుంది.
theological_decisions:
- issue: సాధారణ అన్వయమున్న పుంలింగ ఏకవచన సూచన
  choice: ఉన్నవాడు ... తన ఇంట్లో
  alternative: ఉన్నవారు ... వారి ఇంట్లో
  rationale: గ్రీకు మూలంలోని పుంలింగ ఏకవచన ప్రతినిధి రూపాన్ని తెలుగు సహజ ప్రయోగంలో నిలుపుతూ, సాధారణ అన్వయాన్ని సందర్భానుసారంగా తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ఆజ్ఞలోని అత్యవసరతను మరియు మూలంలోని ఏకవచన నిర్మాణాన్ని నిలిపే గౌరవప్రదమైన శైలి.
