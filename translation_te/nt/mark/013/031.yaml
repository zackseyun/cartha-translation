source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ ⸀μὴ ⸁παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/031.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: te
  text: ఆకాశమూ భూమీ గతించిపోతాయి; కానీ నా మాటలు మాత్రం ఎన్నటికీ గతించిపోవు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎన్నడూ గతించిపోవు” లేదా “ఎంతమాత్రమూ గతించిపోవు.” గ్రీకు మూలంలో భవిష్యత్ క్రియతో కూడిన బలమైన నిరాకరణ ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: ఆకాశం
  rationale: γῆతో జతగా వచ్చినప్పుడు ఇది కేవలం కనిపించే ఆకాశాన్ని కాక సృష్టిలోని ఆకాశాన్ని సూచిస్తుంది; ‘ఆకాశమూ భూమీ’ అనే సహజమైన జంట మూలభావాన్ని నిలుపుతుంది.
- source_word: ἡ γῆ
  choice: భూమి
  rationale: ‘ఆకాశం’తో జతగా ఉన్నందున ఇది ఒక నిర్దిష్ట ప్రాంతాన్ని లేదా దేశాన్ని కాక భూమిని సూచిస్తుంది.
- source_word: παρελεύσονται
  choice: గతించిపోతాయి / గతించిపోవు
  rationale: ఇక్కడ παρέρχομαι అంతరించిపోవడం లేదా ఉనికిలోని ప్రస్తుత స్థితి ముగియడం అనే భావాన్ని ఇస్తుంది. ‘గతించిపోవు’ ఆ భావాన్ని సహజంగా తెలియజేస్తూ, అది ఎలా జరుగుతుందో అదనంగా నిర్ధారించదు.
- source_word: δὲ
  choice: కానీ ... మాత్రం
  rationale: ఆకాశభూముల అశాశ్వతత్వానికి యేసు మాటల శాశ్వత స్థిరత్వానికి మధ్య ఉన్న స్పష్టమైన వ్యత్యాసాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἱ λόγοι μου
  choice: నా మాటలు
  rationale: ఇది యేసు పలికిన మాటలు లేదా ప్రకటనలను నేరుగా సూచిస్తుంది; ‘నా మాటలు’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: οὐ μὴ παρελεύσονται
  choice: ఎన్నటికీ గతించిపోవు
  rationale: οὐ μήతో కూడిన భవిష్యత్ క్రియ బలమైన నిరాకరణను వ్యక్తం చేస్తుంది. ‘ఎన్నటికీ ... పోవు’ ఆ ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో వినిపిస్తుంది.
theological_decisions:
- issue: యేసు మాటలు గతించిపోవని చెప్పే బలమైన నిరాకరణ
  choice: ‘ఎన్నటికీ గతించిపోవు’ అని స్పష్టమైన ఉద్ఘాటనతో అనువదించడం
  alternative: ‘ఎంతమాత్రమూ గతించిపోవు’ లేదా ‘నిశ్చయంగా గతించిపోవు’
  rationale: సృష్టి వ్యవస్థ గతించిపోవడానికీ యేసు మాటల స్థిరత్వానికీ మధ్య మూలపాఠం బలమైన వ్యత్యాసాన్ని చూపుతుంది. ‘ఎన్నటికీ’ అనేది ఆ బలాన్ని నిలుపుతుంది; అదే సమయంలో ఆ మాటల నెరవేర్పు లేదా శాశ్వతత్వానికి సంబంధించిన అదనపు సిద్ధాంత వివరణను పాఠ్యంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘ఆకాశమూ భూమీ’ అనే సముచ్చయ రూపం సహజత్వాన్ని ఇస్తుంది; అర్ధవిరామం రెండు విరుద్ధ వాక్యభాగాల మధ్య సమతుల్యతను చూపుతుంది.
