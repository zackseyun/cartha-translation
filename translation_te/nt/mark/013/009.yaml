id: MRK.13.9
reference: Mark 13:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: βλέπετε δὲ ὑμεῖς ἑαυτούς· ⸀παραδώσουσιν ὑμᾶς εἰς συνέδρια καὶ εἰς συναγωγὰς δαρήσεσθε καὶ ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/009.yaml
  text: But watch yourselves. They will hand you over to councils[a], and you will be beaten in synagogues, and you will stand before governors and kings because of me, as a testimony to them.
translation:
  language: te
  text: అయితే మీ విషయమై మీరు జాగ్రత్తగా ఉండండి. వారు మిమ్మల్ని న్యాయసభలకు అప్పగిస్తారు; సమాజ మందిరాల్లో మీరు కొట్టబడతారు. నా కారణంగా మీరు పాలకుల ఎదుట, రాజుల ఎదుట వారికి సాక్ష్యంగా నిలబడతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “వారికి సాక్ష్యంగా” అనే మాటకు “వారికి వ్యతిరేకంగా సాక్ష్యంగా” అనే భావం కూడా ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε δὲ ὑμεῖς ἑαυτούς
  choice: అయితే మీరు మీ విషయంలో జాగ్రత్తగా ఉండండి
  rationale: వర్తమాన కాల ఆజ్ఞలోని నిరంతర అప్రమత్తతను, ὑμεῖς ἑαυτούς ఇచ్చే స్వీయ-ప్రాధాన్యాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: παραδώσουσιν
  choice: అప్పగిస్తారు
  rationale: హింసా, న్యాయపరమైన సందర్భంలో అధికారుల చేతికి అప్పగించబడటాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘ద్రోహం చేస్తారు’ అనే అవసరంలేని భావాన్ని చేర్చదు.
- source_word: συνέδρια
  choice: న్యాయసభలు
  rationale: ఇక్కడ బహువచనం యెరూషలేము మహాసభను మాత్రమే కాక స్థానిక పాలనా లేదా న్యాయ మండళ్లను సూచించగలదు; ‘న్యాయసభలు’ ఆ పరిధిని కాపాడుతుంది.
- source_word: συναγωγάς
  choice: సమాజ మందిరాలు
  rationale: యూదుల ఆరాధనా, సామాజిక మరియు క్రమశిక్షణా సమావేశ స్థలాలను సూచించే తెలుగులో సుపరిచితమైన పదబంధం.
- source_word: δαρήσεσθε
  choice: మీరు కొట్టబడతారు
  rationale: భౌతికంగా కొట్టబడటాన్ని తెలిపే భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతుంది; ఏ ప్రత్యేక శిక్షా పరికరాన్ని అనవసరంగా నిర్దేశించదు.
- source_word: ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε
  choice: మీరు పాలనాధికారుల ఎదుట, రాజుల ఎదుట నిలబడతారు
  rationale: అధికారుల సమక్షంలో విచారణ లేదా సాక్ష్యం కోసం నిలబడే భావాన్ని, ἡγεμόνων మరియు βασιλέων మధ్య తేడాను కాపాడుతుంది.
- source_word: ἕνεκεν ἐμοῦ
  choice: నా కారణంగా
  rationale: యేసుతో వారి అనుబంధమే హింసకు కారణమని నేరుగా, ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: అది వారికి సాక్ష్యంగా ఉంటుంది
  rationale: వారి అధికారుల ఎదుట నిలబడటం సాక్ష్యంగా పనిచేస్తుందనే భావాన్ని సహజంగా వ్యక్తం చేస్తూ, అది తప్పనిసరిగా వారికి వ్యతిరేకమైన తీర్పు సాక్ష్యమని ప్రధాన పాఠ్యంలో నిర్ణయించదు.
theological_decisions:
- issue: εἰς μαρτύριον αὐτοῖς అనే సాక్ష్య పదబంధం యొక్క భావం
  choice: శిష్యులు బలవంతంగా అధికారుల ఎదుట నిలబడటం వారికి సాక్ష్యంగా పనిచేస్తుంది.
  alternative: అది ఆ అధికారులకు వ్యతిరేకంగా, వారిని దోషులుగా నిలిపే సాక్ష్యంగా పనిచేస్తుంది.
  rationale: αὐτοῖς అనే పదం సాక్ష్యం వారి వైపు ఉద్దేశించబడిందని చెప్పగలదు, కాని వ్యతిరేక లేదా దోషారోపణ భావాన్ని తప్పనిసరిగా నిర్దేశించదు. అందువల్ల ప్రధాన పాఠ్యం విస్తృతమైన భావాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి వాడబడింది. చిన్న వాక్య విభజన ద్వారా గ్రీకు వాక్యంలోని వరుస హెచ్చరికలు స్పష్టంగా ఉంచబడ్డాయి; మతశాఖాపరమైన ప్రత్యేక పదజాలం నివారించబడింది.
