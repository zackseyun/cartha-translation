  rationale: సాక్ష్య పదబంధాన్ని “నిలబడతారు”తో నేరుగా కలిపి, గ్రీకు వాక్యనిర్మాణానికి సమీపంగా ఉంచాం; దీనివల్ల అస్పష్టమైన “అది” తొలగిపోయింది. ప్రధాన పాఠ్యం αὐτοῖς యొక్క ‘వారికి’ అనే దిశాత్మక భావాన్ని కాపాడుతుంది; ‘వ్యతిరేకంగా’ అనే సంభావ్య భావాన్ని పాదటిప్పణిలోనే ఉంచుతుంది. ఇతర మార్పులు సహజ ఆధునిక తెలుగు కోసం మాత్రమే; అర్థంలో మార్పు లేదు.
