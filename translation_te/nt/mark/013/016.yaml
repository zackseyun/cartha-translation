source:
  edition: SBLGNT
  text: καὶ ὁ εἰς τὸν ⸀ἀγρὸν μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω ἆραι τὸ ἱμάτιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/016.yaml
  text: And the one in the field must not turn back to get his cloak[a].
translation:
  language: te
  text: పొలంలో ఉన్నవాడు తన పైవస్త్రాన్ని తీసుకోవడానికి వెనక్కి తిరగకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బయట ధరించే వస్త్రం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εἰς τὸν ἀγρόν
  choice: పొలంలో ఉన్నవాడు
  rationale: ఈ విశేషణార్థక నిర్మాణం పొలంలో ఉన్న వ్యక్తిని ఏకవచనంలో సూచిస్తుంది; తెలుగు సహజ వాక్యనిర్మాణంలో ‘ఉన్నవాడు’ మూలంలోని పుంలింగ ఏకవచన రూపాన్ని నిలుపుతుంది.
- source_word: ἀγρός
  choice: పొలం
  rationale: ఈ పారిపోవాలనే హెచ్చరిక సందర్భంలో వ్యవసాయ భూమిని సూచించే ప్రత్యక్షమైన, సాధారణ తెలుగు పదం.
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: వెనక్కి తిరగకూడదు
  rationale: μήతో కూడిన ఆజ్ఞార్థక క్రియలోని నిషేధాన్ని, εἰς τὰ ὀπίσωలోని వెనుదిరిగే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἆραι
  choice: తీసుకోవడానికి
  rationale: ఇది ఉద్దేశాన్ని తెలిపే క్రియారూపం; వదిలివచ్చిన వస్త్రాన్ని తెచ్చుకోవడానికి తిరగడాన్ని సందర్భానుసారంగా సూచిస్తుంది.
- source_word: ἱμάτιον
  choice: పైవస్త్రం
  rationale: సాధారణ వస్త్రం కంటే బయట ధరించే వస్త్రాన్ని సూచించే మూలపద భావాన్ని స్పష్టంగా, అనవసర సాంస్కృతిక ప్రత్యేకీకరణ లేకుండా అందిస్తుంది.
- source_word: αὐτοῦ
  choice: తన
  rationale: వస్త్రం అదే వ్యక్తికి చెందినదని సహజ తెలుగులో స్పష్టం చేస్తుంది; తెలుగు ప్రతిబింబ సర్వనామం మూలంలోని ఏకవచన సంబంధాన్ని కాపాడుతుంది.
theological_decisions:
- issue: సాధారణార్థక పుంలింగ ఏకవచన సూచన
  choice: ‘ఉన్నవాడు ... తన పైవస్త్రం’ అని ఏకవచన పుంలింగ రూపాన్ని నిలుపడం
  alternative: ‘పొలంలో ఉన్నవారు ... తమ వస్త్రాలు’ అని బహువచనం చేయడం
  rationale: గ్రీకు మూలంలో పుంలింగ ఏకవచన విశేషణార్థక నిర్మాణం, దానికి సరిపడే ఏకవచన సర్వనామం ఉన్నాయి. తెలుగు రూపం దానిని పురుషులకు మాత్రమే పరిమితం చేయకుండా ప్రతినిధి ఏకవచనంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. నిషేధంలోని అత్యవసరతను ‘తిరగకూడదు’ ద్వారా, మూలంలోని ఏకవచన నిర్మాణాన్ని ‘ఉన్నవాడు/తన’ ద్వారా నిలిపింది.
