  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ⸂ἤδη ὁ κλάδος αὐτῆς⸃ ἁπαλὸς γένηται καὶ ἐκφύῃ τὰ φύλλα, γινώσκετε ὅτι ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/028.yaml
  text: 'Learn the parable from the fig tree: when its branch has already become tender and puts out leaves[a], you know that summer is near.'
translation:
  language: te
  text: 'అంజూరపు చెట్టు నుండి ఉపమానాన్ని[a] నేర్చుకోండి: దాని కొమ్మ అప్పటికే లేతగా మారి ఆకులు చిగురించినప్పుడు, వేసవికాలం దగ్గరలో ఉందని మీకు తెలుసు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఉపమానం’ అనే పదాన్ని ‘పాఠం’ లేదా ‘దృష్టాంతం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: అంజూరపు చెట్టు నుండి
  rationale: ἀπό + షష్ఠీ విభక్తి నేర్చుకునే మూలాన్ని సూచిస్తుంది. δέ స్వల్ప అనుసంధాన పదం; తెలుగులో సందర్భం ద్వారానే అనుసంధానం స్పష్టమవుతున్నందున అదనపు కాలసూచక పదం చేర్చలేదు.
- source_word: μάθετε
  choice: నేర్చుకోండి
  rationale: μανθάνω యొక్క భూతకాల ఆజ్ఞార్థక రూపం బోధను స్వీకరించమనే పిలుపు ఇస్తుంది; ఆధునిక తెలుగులో ‘నేర్చుకోండి’ సహజమైన ప్రత్యక్ష అనువాదం.
- source_word: τὴν παραβολήν
  choice: ఈ ఉపమానం
  rationale: παραβολή ఇక్కడ అంజూరపు చెట్టు ఆధారంగా చెప్పే పోలికతో కూడిన బోధను సూచిస్తుంది. ‘ఉపమానం’ సువార్తల పదప్రయోగంతో అనుసంధానాన్ని నిలుపుతుంది; తెలుగు వాక్యంలో నిర్దిష్టత కోసం ‘ఈ’ వాడబడింది.
- source_word: ὅταν
  choice: చిగురించినప్పుడు
  rationale: ὅταν + సంభావనార్థక క్రియ సాధారణ కాలపరమైన పరిస్థితిని తెలియజేస్తుంది; తెలుగులో ‘అప్పుడు/ఎప్పుడు’ భావాన్ని ‘-నప్పుడు’ నిర్మాణం సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἤδη
  choice: అప్పటికే
  rationale: ἤδη ఒక స్థితి అప్పటికే మొదలై లేదా ఏర్పడి ఉందనే కాలసూక్ష్మతను సూచిస్తుంది.
- source_word: ὁ κλάδος αὐτῆς
  choice: దాని కొమ్మ
  rationale: κλάδος అంటే కొమ్మ; αὐτῆς చెట్టును తిరిగి సూచిస్తుంది.
- source_word: ἁπαλὸς γένηται
  choice: లేతగా మారి
  rationale: ἁπαλός కొత్త పెరుగుదలలోని మెత్తదనం లేదా లేతదనాన్ని సూచిస్తుంది. అంజూరపు కొమ్మ సందర్భంలో ‘లేతగా’ సహజంగా ఉంది; γένηται లోని స్థితిమార్పును ‘మారి’ నిలుపుతుంది.
- source_word: ἐκφύῃ τὰ φύλλα
  choice: ఆకులు చిగురించినప్పుడు
  rationale: ἐκφύω మొలకెత్తడం లేదా బయటికి రావడాన్ని సూచిస్తుంది; చెట్టుకు ఆకులు రావడాన్ని తెలుగులో ‘ఆకులు చిగురించు’ అని సహజంగా చెబుతారు.
- source_word: γινώσκετε
  choice: మీకు తెలుసు
  rationale: ఇది సందర్భంలో వర్తమాన నిర్దేశక రూపం, ఆజ్ఞ కాదు. సూచనను చూసి కలిగే గుర్తింపును ‘మీకు తెలుసు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐγγὺς
  choice: దగ్గరలో
  rationale: ἐγγύς ఇక్కడ కాలపరమైన సమీపతను సూచిస్తుంది; ‘దగ్గరలో’ సాధారణ ఆధునిక తెలుగు ప్రయోగం.
- source_word: τὸ θέρος
  choice: వేసవికాలం
  rationale: θέρος యొక్క సాధారణ అర్థం ‘వేసవి’; అంజూరపు చెట్టు ఋతు సూచనలో కోతకాలం కంటే వేసవికాలమే తగినది.
theological_decisions:
- issue: ఈ సందర్భంలో παραβολή అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘ఉపమానం’
  alternative: పాఠం; దృష్టాంతం
  rationale: గ్రీకు పదం యేసు బోధలో సాధారణంగా వాడే పదమే అయినప్పటికీ, ఇక్కడ అది అంజూరపు చెట్టు నుండి నేర్చుకునే సాదృశ్యపూర్వక పాఠాన్ని సూచిస్తుంది. ‘ఉపమానం’ మూలపదంతో పదసంబంధాన్ని నిలుపుతూ అదనపు అలంకారిక లేదా సిద్ధాంతపరమైన వివరాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. మూలంలోని సాధారణ కాలపరమైన పరిశీలనను, ‘అప్పటికే’ అనే కాలసూక్ష్మతను, γινώσκετε యొక్క నిర్దేశక భావాన్ని నిలుపుకుంది.
