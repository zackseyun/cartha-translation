  text: βλέπετε ⸀ἀγρυπνεῖτε, οὐκ οἴδατε γὰρ πότε ὁ καιρός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/033.yaml
  text: Be on guard; stay awake[a], for you do not know when the time is.
translation:
  language: te
  text: జాగ్రత్తగా ఉండండి; మెలకువగా ఉండండి. ఎందుకంటే ఆ సమయం[a] ఎప్పుడో మీకు తెలియదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిర్ణయించబడిన సమయం” లేదా “కాలం.” గ్రీకు καιρός అనే పదం తరచుగా నిర్ణాయకమైన లేదా నియమితమైన సమయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: జాగ్రత్తగా ఉండండి
  rationale: ఇక్కడ ఈ బహువచన ఆజ్ఞ కేవలం కళ్లతో చూడమని కాకుండా, ప్రమాదం పట్ల జాగ్రత్తగా ఉండమని హెచ్చరిస్తోంది. తరువాతి ἀγρυπνεῖτεతో అనవసర పునరుక్తి రాకుండా ఈ భావాన్ని ఎంచుకున్నాం.
- source_word: ἀγρυπνεῖτε
  choice: మెలకువగా ఉండండి
  rationale: మేలుకొని ఉండడం అనే రూపకాన్ని, దానిలోని అప్రమత్తత భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: οὐκ οἴδατε
  choice: మీకు తెలియదు
  rationale: తెలుసుకోవడం అనే క్రియకు వచ్చిన సరళమైన నిషేధాన్ని అదనపు భావం చేర్చకుండా అనువదిస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞలకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: πότε
  choice: ఎప్పుడో
  rationale: పరోక్ష ప్రశ్నలో కాలాన్ని సూచించే సహజమైన తెలుగు రూపం.
- source_word: ὁ καιρός
  choice: ఆ సమయం
  rationale: καιρός సాధారణ కాలం కంటే నిర్ణాయకమైన లేదా నియమితమైన సమయాన్ని సూచించగలదు. ప్రధాన పాఠంలో అతిగా నిర్దిష్టం చేయకుండా సందర్భోచితమైన ‘ఆ సమయం’ ఉంచాం.
- source_word: ἐστιν
  choice: —
  rationale: గ్రీకులోని సంధానక్రియ భావం తెలుగులో ‘ఆ సమయం ఎప్పుడో’ అనే సహజ వాక్య నిర్మాణంలో అంతర్లీనంగా వ్యక్తమవుతుంది; ప్రత్యేక పదం అవసరం లేదు.
theological_decisions:
- issue: అంత్యకాల సందర్భంలో καιρός పదంలోని భావ ఛాయ
  choice: ఆ సమయం
  alternative: నిర్ణయించబడిన సమయం; కాలం
  rationale: యేసు చెప్పిన అంత్యకాల ప్రసంగంలో ఈ పదం నిర్ణాయకమైన లేదా నియమితమైన క్షణాన్ని సూచించవచ్చు. అయితే గ్రీకు పదం అనుమతించే విస్తృతతను ప్రధాన పాఠం నిలుపుతుంది; మరింత నిర్దిష్టమైన అర్థాలను పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన ఆజ్ఞారూపాలు వాడబడ్డాయి. βλέπετε మరియు ἀγρυπνεῖτε మధ్యనున్న భావ వ్యత్యాసాన్ని ‘జాగ్రత్తగా ఉండండి’ మరియు ‘మెలకువగా ఉండండి’ ద్వారా నిలిపాం.
