  terminology: ‘ఆ సమయం’ appropriately preserves the broad yet weighty sense of καιρός without forcing ‘appointed time’ into the main text. The footnote responsibly supplies ‘నిర్ణయించబడిన సమయం’ and ‘కాలం’ as alternatives and explains the lexical nuance. The footnote anchor is correctly placed on ‘సమయం’.
