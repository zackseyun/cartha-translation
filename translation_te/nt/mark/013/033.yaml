  source_fidelity: 'The draft accurately renders both plural imperatives: βλέπετε as a cautionary call (''జాగ్రత్తగా ఉండండి'') and ἀγρυπνεῖτε as remaining awake (''మెలకువగా ఉండండి''). It retains the causal γάρ and the uncertainty concerning when ὁ καιρός is. No unsupported doctrinal specification is introduced.'
