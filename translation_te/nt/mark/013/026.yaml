source:
  edition: SBLGNT
  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλαις μετὰ δυνάμεως πολλῆς καὶ δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/026.yaml
  text: And then they will see the Son of Man coming in the clouds with great power and glory[a].
translation:
  language: te
  text: అప్పుడు వారు మనుష్యకుమారుడు గొప్ప శక్తితో, మహిమతో మేఘాలలో రావడం చూస్తారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మేఘాలతో రావడం.’ గ్రీకు పాఠంలో అక్షరార్థంగా ‘మేఘాలలో’ అని ఉంది; ప్రత్యామ్నాయ అనువాదం దానియేలు 7:13లోని ప్రతిధ్వనిని మరింత స్పష్టంగా చూపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: చూస్తారు
  rationale: ὁράω క్రియ యొక్క భవిష్యత్ రూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, సంఘటన కనిపించే స్వభావాన్ని అదనపు వ్యాఖ్యానం లేకుండా నిలుపుతుంది.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: ఇది స్థిరపడిన బైబిలు బిరుదును, దానియేలు 7తో ఉన్న అంతర్గ్రంథ సంబంధాన్ని కాపాడుతుంది; కేవలం సాధారణ మానవుణ్ణి సూచించేలా అర్థాన్ని కుదించదు.
- source_word: ἐρχόμενον
  choice: రావడం
  rationale: వర్తమాన కృదంతం సూచించే రాకను సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది; ‘చేరుకోవడం’ కంటే అపోకలిప్టిక్ సందర్భానికి తగినది.
- source_word: ἐν νεφέλαις
  choice: మేఘాలలో
  rationale: ἐν యొక్క ప్రాథమిక స్థలార్థాన్ని, νεφέλαις యొక్క బహువచనాన్ని నేరుగా ప్రతిబింబిస్తుంది. దానియేలు 7:13 ప్రతిధ్వనిని స్పష్టపరచే ‘మేఘాలతో’ అనే సాధ్యమైన అనువాదాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: గొప్ప శక్తితో
  rationale: μετά + షష్ఠీ విభక్తి సూచించే సహవర్తిత్వాన్ని ‘తో’ ద్వారా చూపుతూ, πολλῆς యొక్క పరిమాణాన్ని సహజంగా ‘గొప్ప’ అని వ్యక్తపరుస్తుంది.
- source_word: καὶ δόξης
  choice: మహిమతో
  rationale: δόξα యొక్క బైబిలు సంబంధమైన ప్రత్యక్ష వైభవం, ఘనత భావాలను సంప్రదాయబద్ధంగా మరియు స్పష్టంగా కాపాడుతుంది.
theological_decisions:
- issue: అపోకలిప్టిక్ బిరుదు మరియు మేఘాల దృశ్యరూపం
  choice: ‘మనుష్యకుమారుడు’ అనే బిరుదును, మేఘాలలో వచ్చే దృశ్యాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపడం.
  alternative: బిరుదును ‘మానవుడు’ అని చలనాత్మకంగా అనువదించడం లేదా దానియేలు 7 సూచనను ప్రధాన పాఠ్యంలోనే వివరించడం.
  rationale: ఈ వచనం దానియేలు 7:13ను బలంగా ప్రతిధ్వనింపజేస్తుంది. అయితే అనువాదం ఆ సూచనను వివరించి పరిష్కరించకుండా, పాఠకుడు గుర్తించగలిగేలా అలాగే ఉంచాలి; దీనివల్ల గ్రీకులోని క్రీస్తుసంబంధమైన, అంత్యకాల సంబంధమైన ఉద్వేగం నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉండే నిర్మాణాన్ని వాడాం. ‘మనుష్యకుమారుడు,’ ‘శక్తి,’ ‘మహిమ’ వంటి గుర్తించదగిన బైబిలు పదాలను నిలిపి, అనవసరమైన సిద్ధాంత వివరణను చేర్చలేదు.
