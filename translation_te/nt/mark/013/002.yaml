source:
  edition: SBLGNT
  text: καὶ ὁ ⸀Ἰησοῦς εἶπεν αὐτῷ· Βλέπεις ταύτας τὰς μεγάλας οἰκοδομάς; οὐ μὴ ἀφεθῇ ⸀ὧδε λίθος ἐπὶ ⸀λίθον ὃς οὐ μὴ καταλυθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/002.yaml
  text: And Jesus said to him[c][b][a], “Do you see these great buildings? Not one stone will be left here upon another that will not be torn down.”
translation:
  language: te
  text: యేసు అతనితో, “ఈ గొప్ప కట్టడాలను[a] చూస్తున్నావా? కూల్చబడని[c] ఒక్క రాయి కూడా ఇక్కడ మరొక రాయి మీద[b] మిగిలి ఉండనే ఉండదు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఈ గొప్ప ఆలయ కట్టడాలను.’ సందర్భం ఆలయ సముదాయాన్ని సూచిస్తుంది; అయితే గ్రీకు మూలంలో కేవలం ‘కట్టడాలు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఒక్క రాయి కూడా మరొక రాయి మీద మిగిలి ఉండదు’ అనే మాట పూర్తిస్థాయి విధ్వంసాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా ‘పడగొట్టబడని’ లేదా ‘నాశనం చేయబడని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπεις
  choice: చూస్తున్నావా?
  rationale: వర్తమానకాల సూచనార్థక క్రియను సందర్భానుసారంగా ప్రత్యక్ష ప్రశ్నగా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఆజ్ఞార్థక భావాన్ని జోడించదు.
- source_word: μεγάλας οἰκοδομάς
  choice: గొప్ప కట్టడాలను
  rationale: μεγάλας లోని పరిమాణం, వైభవం రెండింటినీ ‘గొప్ప’ సూచించగలదు; οἰκοδομάς ను సందర్భం ఆలయ సముదాయాన్ని సూచించినా మూలంలో లేని ‘ఆలయ’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా ‘కట్టడాలు’గా అనువదించాం.
- source_word: οὐ μὴ ἀφεθῇ
  choice: మిగిలి ఉండనే ఉండదు
  rationale: οὐ μή యొక్క బలమైన భవిష్యత్ నిరాకరణను సహజ తెలుగులో ‘ఉండనే ఉండదు’ అనే నిశ్చయార్థక రూపంతో నిలుపుతుంది.
- source_word: ὧδε
  choice: ఇక్కడ
  rationale: స్థలాన్ని నేరుగా సూచించే మూలపదానికి సరళమైన, సహజమైన సమానం.
- source_word: λίθος ἐπὶ λίθον
  choice: ఒక రాయి మీద మరొక రాయి
  rationale: పూర్తి విధ్వంసాన్ని సూచించే స్పష్టమైన దృశ్యరూపాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: καταλυθῇ
  choice: పడగొట్టబడకుండా
  rationale: కట్టడాన్ని కూల్చడం లేదా పూర్తిగా విడదీయడం అనే సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తూ, మూలంలోని కర్మణి రూపాన్ని నిలుపుతుంది.
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: యేసు అతనితో … అన్నాడు
  rationale: తెలుగు సంభాషణ వాక్యక్రమానికి అనుగుణంగా సహజంగా అమర్చి, ‘జవాబిచ్చాడు’ వంటి అదనపు సంభాషణార్థాన్ని చేర్చలేదు.
theological_decisions:
- issue: యేసు ప్రవచనం సూచించే కట్టడాల పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘కట్టడాలు’ అని సాధారణంగా అనువదించడం
  alternative: ‘ఈ గొప్ప ఆలయ కట్టడాలు’
  rationale: తక్షణ సందర్భం ఆలయ సముదాయాన్ని స్పష్టం చేసినా, గ్రీకు మూలంలో οἰκοδομάς అంటే ‘కట్టడాలు’ మాత్రమే. అందువల్ల ప్రధాన పాఠ్యంలో మూలం కంటే నిర్దిష్టతను పెంచకుండా, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: విధ్వంస ప్రకటనలోని బలమైన నిరాకరణ
  choice: ‘మిగిలి ఉండనే ఉండదు’ అని నిశ్చయార్థకంగా అనువదించడం
  alternative: ‘మిగిలి ఉండదు’
  rationale: రెండుసార్లు వాడిన οὐ μή నిర్మాణంలోని గట్టి నిశ్చయాన్ని తెలుగులో అతిశయోక్తి లేదా సిద్ధాంతాత్మక వివరణ లేకుండా ప్రతిబింబిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన సంభాషణ శైలిని ఉపయోగించాం. ‘ఉండనే ఉండదు’ మూలంలోని బలమైన నిరాకరణను సహజంగా వ్యక్తం చేస్తుంది. పాదసూచిక గుర్తులను వాటికి సంబంధించిన పదబంధాల వెంట ఉంచాం.
