id: MRK.13.12
reference: Mark 13:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂καὶ παραδώσει⸃ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/012.yaml
  text: And brother will hand over brother to death[a], and a father his child[b], and children will rise up against parents and put them to death.
translation:
  language: te
  text: సోదరుడు సోదరుణ్ణి మరణానికి అప్పగిస్తాడు[a], తండ్రి తన బిడ్డను మరణానికి అప్పగిస్తాడు; పిల్లలు తల్లిదండ్రులకు వ్యతిరేకంగా లేచి వారిని చంపుతారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ద్రోహం చేసి అప్పగిస్తాడు.’ గ్రీకు క్రియకు ‘అప్పగించు,’ ‘చేతికి అప్పజెప్పు,’ అలాగే ఈ సందర్భంలో ‘ద్రోహం చేయు’ అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారిని మరణానికి గురిచేస్తారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: అప్పగిస్తాడు
  rationale: παραδίδωμι యొక్క ప్రాథమిక భావమైన ‘ఇతరుల చేతికి అప్పగించడం’ను ఇది సహజంగా తెలియజేస్తుంది. హింస సందర్భంలో అధికారులకు లేదా మరణానికి అప్పగించే భావాన్ని నిలుపుతూ, ప్రతిసారీ భావోద్వేగపూరితమైన ‘ద్రోహం చేయడం’ అనే అర్థాన్ని బలవంతంగా రుద్దదు.
- source_word: ἀδελφὸς ... ἀδελφὸν
  choice: సోదరుడు తన సోదరుణ్ణి
  rationale: గ్రీకు ఏకవచన పుంలింగ కుటుంబపదాలనూ వాటి ఉద్దేశిత బంధాన్నీ స్పష్టంగా ఉంచుతుంది; ‘తన’ చేర్చడం ఆధునిక తెలుగులో సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἰς θάνατον
  choice: మరణానికి
  rationale: ఈ పదబంధం అప్పగింపు యొక్క ఫలితం లేదా గమ్యాన్ని సూచిస్తుంది. ‘మరణానికి అప్పగిస్తాడు’ గ్రీకు నిర్మాణంలోని తీవ్రతను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: πατὴρ τέκνον
  choice: తండ్రి తన బిడ్డను
  rationale: πατήρ ను ‘తండ్రి’గా ప్రత్యేకంగా ఉంచి, τέκνον లింగపరంగా విస్తృతమైనందున ‘బిడ్డ’గా అనువదించాం. గ్రీకులో క్రియ విడిచిపెట్టబడిన చోట తెలుగులో ముందటి క్రియను ‘అలాగే అప్పగిస్తాడు’ అని పూరించాం.
- source_word: ἐπαναστήσονται
  choice: వ్యతిరేకంగా లేస్తారు
  rationale: ఈ క్రియలోని శత్రుత్వపూర్వకంగా ఎదిరించి లేచే సజీవ భావాన్ని నిలుపుతుంది; కేవలం అభిప్రాయభేదం లేదా సాధారణ అవిధేయతగా తగ్గించదు.
- source_word: γονεῖς
  choice: తల్లిదండ్రులు
  rationale: బహువచన γονεῖς కు ఆధునిక తెలుగులో నేరుగా, సహజంగా సరిపోయే పదం.
- source_word: θανατώσουσιν αὐτούς
  choice: వారిని చంపుతారు
  rationale: θανατόω అంటే చంపడం లేదా మరణానికి గురిచేయడం. ‘చంపుతారు’ ఆధునిక పాఠకులకు స్పష్టంగా, సహజంగా ఉండి క్రియ యొక్క తీవ్రతను నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: కుటుంబ సంబంధ పదాల్లో లింగ నిర్దిష్టత
  choice: ἀδελφός, πατήρ పదాలను ‘సోదరుడు,’ ‘తండ్రి’గా ఉంచి, τέκνον, γονεῖς పదాలను ‘బిడ్డ,’ ‘తల్లిదండ్రులు’గా అనువదించడం
  alternative: మొదటి రెండు పదాలను కూడా ‘తోబుట్టువు,’ ‘తల్లిదండ్రుల్లో ఒకరు’ వంటి లింగతటస్థ రూపాల్లో ఇవ్వడం
  rationale: గ్రీకు మూలంలో మొదటి రెండు కుటుంబపదాలు పుంలింగ నిర్దిష్ట రూపాల్లో ఉన్నాయి; తరువాతి పదాలు విస్తృతమైనవి. మూలంలోని ఈ తేడాను నిలుపుతూ, వాక్యం చిత్రించే కుటుంబ విభేదాన్ని ఏ సిద్ధాంతపరమైన విస్తరణ లేకుండా అందించాం.
- issue: θανατόω లో న్యాయపరమైన లేదా సాధారణ హత్య భావం
  choice: ప్రధాన పాఠంలో ‘చంపుతారు’
  alternative: ‘మరణశిక్షకు గురిచేస్తారు’ లేదా ‘మరణానికి గురిచేస్తారు’
  rationale: సందర్భం హింసను, అప్పగింపును సూచించినా, ఈ క్రియ స్వయంగా తప్పనిసరిగా అధికారిక న్యాయశిక్షనే నిర్దేశించదు. అందువల్ల ప్రధాన పాఠంలో విస్తృతమైన సహజ అర్థాన్ని ఉంచి, ప్రత్యామ్నాయ రూపాన్ని గమనికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. కుటుంబ బంధాల పునరుక్తిని, హింస యొక్క తీవ్రతను నిలిపాం. రెండవ ఉపవాక్యంలో గ్రీకులో అంతర్భూతమైన క్రియను తెలుగులో స్పష్టత కోసం ‘అలాగే అప్పగిస్తాడు’గా పూరించాం.
