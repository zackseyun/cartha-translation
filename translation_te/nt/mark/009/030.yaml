source:
  edition: SBLGNT
  text: Κἀκεῖθεν ἐξελθόντες ⸀παρεπορεύοντο διὰ τῆς Γαλιλαίας, καὶ οὐκ ἤθελεν ἵνα τις γνοῖ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/030.yaml
  text: And from there[a] they went on through Galilee[b], and he did not want anyone to know.
translation:
  language: te
  text: వారు అక్కడి నుంచి బయలుదేరి, గలిలయ గుండా ప్రయాణిస్తూ ఉన్నారు[a]. ఎవరికీ తెలియకూడదని ఆయన కోరుకున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గలిలయ గుండా వెళ్తూ ఉన్నారు’ అని కూడా అనువదించవచ్చు. గ్రీకు అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న కదలికను నొక్కి చెప్పవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఏమి తెలియకూడదని ఆయన కోరుకున్నాడో గ్రీకు వాక్యం స్పష్టంగా చెప్పదు. సందర్భంలో అది ఆయన గలిలయలో ఉన్న సంగతిని లేదా ఆయన ప్రయాణ మార్గాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντες
  choice: వారు అక్కడి నుంచి బయలుదేరి
  rationale: καί + ἐκεῖθεν కథన కొనసాగింపుతో పాటు మునుపటి స్థలం నుంచి కదలడాన్ని సూచిస్తుంది; ἐξελθόντες‌లోని బయలుదేరే భావాన్ని సహజమైన తెలుగు క్రియారూపంతో స్పష్టంగా నిలుపుతుంది.
- source_word: παρεπορεύοντο
  choice: ప్రయాణిస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న ప్రయాణాన్ని సూచిస్తుంది. ఈ రూపం ఆ కొనసాగింపు భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: διὰ τῆς Γαλιλαίας
  choice: గలిలయ గుండా
  rationale: διά + షష్ఠీ విభక్తి ఒక ప్రాంతం మధ్యగా కదలడాన్ని సూచిస్తుంది; ‘గుండా’ ఆ దిశార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: οὐκ ἤθελεν
  choice: కోరుకోలేదు / తెలియకూడదని కోరుకున్నాడు
  rationale: θέλω ఇక్కడ సంకల్పం లేదా అభిలాషను వ్యక్తం చేస్తుంది. ప్రతికూలతను ἵνα ఉపవాక్యంతో కలిపి ‘తెలియకూడదని ఆయన కోరుకున్నాడు’ అని తెలుగులో సహజంగా నిర్మించాం.
- source_word: ἵνα τις γνοῖ
  choice: ఎవరికీ తెలియకూడదని
  rationale: ఈ ఉపవాక్యం ఎవరూ తెలుసుకోకూడదనే ఉద్దేశాన్ని తెలియజేస్తుంది. గ్రీకులో ‘ఏమి’ తెలియకూడదో చెప్పలేదు; తెలుగులోనూ కర్మను చేర్చకుండా ఆ అస్పష్టతను నిలిపాం.
theological_decisions:
- issue: ἤθελεν క్రియకు అంతర్లీనంగా ఉన్న కర్త
  choice: ‘ఆయన’ అని ఇచ్చి, యేసును సూచించాం.
  alternative: వ్యక్తిరహితమైన లేదా సమూహ కర్తగా అర్థం చేసుకోవడం.
  rationale: ఏకవచన క్రియ సందర్భంలో యేసునే సహజంగా సూచిస్తుంది. తెలుగులో గౌరవప్రదమైన ‘ఆయన’ స్పష్టతను ఇస్తుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: γνοῖ క్రియకు చెప్పని కర్మ
  choice: ఏమి తెలియకూడదో వచనంలో చెప్పకుండా వదిలాం.
  alternative: ‘ఆయన అక్కడ ఉన్న సంగతి’ లేదా ‘ఆయన ప్రయాణ మార్గం’ అని స్పష్టీకరించడం.
  rationale: మూల గ్రీకు కర్మను పేర్కొనదు. సందర్భం యేసు ఉనికిని లేదా ఆయన ప్రయాణాన్ని సూచించవచ్చు కాబట్టి, ఆ నిజమైన అస్పష్టతను అనువాదంలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. కొనసాగుతున్న ప్రయాణ భావాన్ని నిలిపి, చివరి క్రియకు చెప్పని కర్మను ఉద్దేశపూర్వకంగా పూరించలేదు.
