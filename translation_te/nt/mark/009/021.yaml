source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησεν τὸν πατέρα αὐτοῦ· Πόσος χρόνος ἐστὶν ὡς τοῦτο γέγονεν αὐτῷ; ὁ δὲ εἶπεν· ⸀Ἐκ παιδιόθεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/021.yaml
  text: And he asked his father[a], “How long has this been happening to him?” And he said, “From childhood.”
translation:
  language: te
  text: ఆయన అతని తండ్రిని, “ఇతనికి ఇలా జరుగుతూ ఎంతకాలమైంది?” అని అడిగాడు. అతడు, “చిన్నప్పటి నుంచే[a],” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బాల్యం నుంచి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: అడిగాడు
  rationale: ఇక్కడ ἐπερωτάω సాధారణ ప్రశ్నను పరిచయం చేస్తుంది; అదనపు తీవ్రత లేదా అధికారికతను చేర్చకుండా సహజమైన ఆధునిక తెలుగులో ‘అడిగాడు’ సరిపోతుంది.
- source_word: τὸν πατέρα αὐτοῦ
  choice: అతని తండ్రిని
  rationale: సందర్భంలో αὐτοῦ బాధపడుతున్న బాలుణ్ణి సూచిస్తుంది. మూలంలోని సర్వనామ నిర్మాణాన్ని నిలుపుతూ ‘అతని తండ్రిని’ సహజంగా ఉంది.
- source_word: Πόσος χρόνος ἐστὶν ὡς
  choice: ఎంతకాలమైంది?
  rationale: ఈ గ్రీకు ప్రయోగం ఒక పరిస్థితి మొదలైనప్పటి నుంచి ఇప్పటివరకు గడిచిన కాలాన్ని అడుగుతుంది; ‘ఎంతకాలమైంది?’ ఆ భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τοῦτο γέγονεν αὐτῷ
  choice: ఇది ఇతనికి ఇలా జరుగుతూ
  rationale: γέγονεν పరిపూర్ణ కాలరూపం ప్రస్తుతంవరకు కొనసాగుతున్న పరిస్థితిని సూచిస్తుంది. ‘జరుగుతూ’ అనేది ఒక్కసారి జరిగిన సంఘటనగా కాక కొనసాగుతున్న అనుభవంగా దానిని వ్యక్తం చేస్తుంది; ‘ఇది’ మూలంలోని τοῦτο యొక్క సూచనాత్మక స్వభావాన్ని నిలుపుతుంది.
- source_word: ὁ δὲ εἶπεν
  choice: అతడు … అన్నాడు
  rationale: δέ ఇక్కడ సాధారణ కథన పురోగతిని సూచిస్తుంది. తెలుగులో ప్రత్యేక సంధిపదం లేకుండానే వాక్యక్రమం ఆ పురోగతిని సహజంగా తెలియజేస్తుంది.
- source_word: Ἐκ παιδιόθεν
  choice: చిన్నప్పటి నుంచే
  rationale: ఈ పదబంధం చిన్ననాటి నుంచి పరిస్థితి కొనసాగుతున్నదని తెలుపుతుంది. ‘చిన్నప్పటి నుంచే’ సాధారణ పాఠకులకు సహజంగా ఉండి, ప్రారంభబిందువును స్పష్టంగా చూపిస్తుంది.
