source:
  edition: SBLGNT
  text: ἐδίδασκεν γὰρ τοὺς μαθητὰς αὐτοῦ καὶ ἔλεγεν αὐτοῖς ὅτι Ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἀνθρώπων, καὶ ἀποκτενοῦσιν αὐτόν, καὶ ἀποκτανθεὶς ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/031.yaml
  text: For he was teaching his disciples and telling them[a], “The Son of Man is being handed over into the hands of men, and they will kill him, and after he is killed[b], after three days he will rise.”
translation:
  language: te
  text: 'ఎందుకంటే ఆయన తన శిష్యులకు బోధిస్తూ, వారికి ఇలా చెబుతూ ఉండేవాడు: “మనుష్యకుమారుడు మనుషుల చేతుల్లోకి అప్పగించబడుతున్నాడు[a]. వారు ఆయనను చంపుతారు. చంపబడిన తర్వాత, మూడు రోజుల తర్వాత ఆయన లేస్తాడు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మానవుల చేతుల్లోకి.” గ్రీకులో అక్షరార్థంగా, “మనుషుల చేతుల్లోకి” అని ఉంది. ఇక్కడ “చేతులు” అధికారం లేదా అదుపును సూచిస్తాయి.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మూడు రోజుల్లో.” ఇక్కడ గ్రీకులో “మూడు రోజుల తర్వాత” అని ఉంది; ఇతర చోట్ల ఇదే కాలవ్యవధిని “మూడవ రోజున” అని కూడా చెబుతారు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: బోధిస్తూ ... ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పదేపదే జరుగుతున్న బోధనను సూచిస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి సందర్భానికి ఈ వాక్యం వివరణ ఇస్తున్న సంబంధాన్ని స్పష్టంగా చూపిస్తుంది.
- source_word: μαθητὰς
  choice: శిష్యులకు
  rationale: సువార్తల సందర్భంలో గురువును అనుసరించి నేర్చుకునేవారిని సూచించే సహజమైన, స్థిరమైన తెలుగు పదం.
- source_word: ἔλεγεν
  choice: చెబుతూ ఉన్నాడు
  rationale: ఇది కూడా అసంపూర్ణ భూతకాల రూపం; కొనసాగుతున్న ఉపదేశాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: ఈ స్వీయనామంలోని స్థిరమైన బైబిలు రూపాన్ని, దానిలో ఉండగల దానియేలు గ్రంథ ప్రతిధ్వనిని వివరణతో కుదించకుండా నిలుపుతుంది.
- source_word: παραδίδοται
  choice: అప్పగించబడుతున్నాడు
  rationale: వర్తమాన కర్మణి రూపంలోని సమీపిస్తున్న లేదా ఆరంభమైన అప్పగింపును నిలుపుతుంది; ‘ద్రోహం చేయబడుతున్నాడు’ అని అనువదిస్తే భావాన్ని అనవసరంగా సంకుచితం చేస్తుంది.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: మనుషుల చేతులకు
  rationale: ఇతరుల అధికారానికి లేదా అదుపుకు అప్పగించడాన్ని తెలిపే గ్రీకు మూర్తమైన నుడికారాన్ని నిలుపుతుంది; ‘మనుష్య కుమారుడు—మనుషులు’ అనే పదసంబంధాన్నీ ప్రతిబింబిస్తుంది.
- source_word: ἀποκτενοῦσιν
  choice: వారు ... చంపుతారు
  rationale: పేరు చెప్పని మానవ కర్తలతో ఉన్న భవిష్యత్ క్రియను సూటిగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀποκτανθεὶς
  choice: చంపబడిన తర్వాత
  rationale: కర్మణి అసమాపక క్రియ ప్రధాన క్రియకు ముందుగా జరిగే చర్యను సూచిస్తుంది; తెలుగు వాక్యక్రమంలో దాని కాలక్రమాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: మూడు రోజుల తర్వాత
  rationale: μετά మరియు ద్వితీయా విభక్తి కలయికలోని సాధారణ ‘తర్వాత’ భావాన్ని అనుసరిస్తుంది; ఇతర చోట్ల ఉన్న ‘మూడవ రోజున’ అనే రూపంతో సమన్వయం చేయదు.
- source_word: ἀναστήσεται
  choice: ఆయన లేస్తాడు
  rationale: భవిష్యత్ మధ్యమ రూపంలోని అకర్మక భావాన్ని నిలుపుతుంది; ఇక్కడ లేని కర్మణి భావాన్ని చేర్చదు.
theological_decisions:
- issue: Ὁ υἱὸς τοῦ ἀνθρώπου మరియు ἀνθρώπων మధ్య పదసంబంధం
  choice: మనుష్య కుమారుడు ... మనుషుల చేతులకు
  alternative: మనుష్య కుమారుడు ... మానవుల అధీనానికి
  rationale: మూలంలోని పదపునరుక్తిని, మనుష్య కుమారుడికీ ఆయనను అదుపులోకి తీసుకునే సాధారణ మానవులకీ మధ్య ఉన్న వ్యత్యాసాన్ని వీలైనంతగా నిలుపుతుంది.
- issue: παραδίδοται యొక్క కర్మణి రూపం మరియు విస్తృత భావం
  choice: అప్పగించబడుతున్నాడు
  alternative: ద్రోహం చేయబడుతున్నాడు
  rationale: గ్రీకు వాక్యం కార్యసాధకుడిని పేర్కొనదు; ఈ పదం ద్రోహం, పట్టివేత, మానవ చర్య, దైవ అనుమతి వంటి పొరలను కలిగి ఉండగలదు. ఎంపిక చేసిన రూపం ఆ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
- issue: ἀναστήσεται యొక్క వాచ్యం
  choice: ఆయన లేస్తాడు
  alternative: ఆయన లేపబడతాడు
  rationale: ఇక్కడి గ్రీకు భవిష్యత్ మధ్యమ రూపాన్ని అకర్మకంగా అనువదించడం సహజం; ఇతర పునరుత్థాన వాక్యాల్లోని కర్మణి రూపాన్ని దీనిలోకి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. అసంపూర్ణ భూతకాల క్రియల కొనసాగింపు భావాన్ని ‘బోధిస్తూ ... చెబుతూ ఉన్నాడు’తో చూపించాం. ‘మనుష్య కుమారుడు’ అనే స్థిర బైబిలు పదబంధాన్ని నిలిపి, అప్పగింపులోని కార్యసాధకుడిని పేర్కొనకుండా మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను కాపాడాం.
