id: MRK.9.29
reference: Mark 9:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τοῦτο τὸ γένος ἐν οὐδενὶ δύναται ἐξελθεῖν εἰ μὴ ἐν ⸀προσευχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/029.yaml
  text: And he said to them[a], “This kind cannot come out by anything except prayer.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “ఈ రకం ప్రార్థన వల్ల తప్ప మరి దేనివల్లా బయటకు రాదు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని తరువాతి ప్రతుల్లో “ప్రార్థన మరియు ఉపవాసం వల్ల తప్ప” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: Τοῦτο τὸ γένος
  choice: ఈ రకం
  rationale: γένος ఇక్కడ ఒక వర్గాన్ని లేదా రకాన్ని సూచిస్తుంది. సందర్భంలో అపవిత్రాత్మ ఉద్దేశించబడినా, గ్రీకు పాఠంలో ‘ఆత్మ’ అనే నామవాచకం మళ్లీ స్పష్టంగా లేదు; అందువల్ల ‘ఈ రకం’ మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
- source_word: ἐν οὐδενὶ
  choice: మరి దేనివల్లా
  rationale: ἐν + οὐδενί ఇక్కడ సాధనం లేదా మార్గాన్ని సూచించే ప్రయోగం. ‘మరి దేనివల్లా’ అనే రూపం తెలుగులో సహజంగా ఉండి, ఇతర ఏ సాధనమూ ఫలించదనే భావాన్ని తెలియజేస్తుంది.
- source_word: δύναται ἐξελθεῖν
  choice: బయటకు రాదు
  rationale: δύναται తో కూడిన ἐξελθεῖν అసమర్థతను వ్యక్తం చేస్తుంది. ప్రతికూల వాక్యంలో ‘బయటకు రాదు’ అనేది తెలుగులో సహజంగా ఉండి, అపవిత్రాత్మ వెళ్లిపోవడాన్ని సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: εἰ μὴ
  choice: తప్ప
  rationale: εἰ μὴ ముందున్న ప్రతికూల ప్రకటనకు ఏకైక మినహాయింపును సూచిస్తుంది; తెలుగులో ‘తప్ప’ దీనిని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν προσευχῇ
  choice: ప్రార్థన వల్ల
  rationale: ἐν προσευχῇ ఇక్కడ సాధనార్థక భావాన్ని కలిగి ఉంది. ‘ప్రార్థన వల్ల’ ఆ సంబంధాన్ని స్పష్టంగా చూపుతూ, వాక్యంలో ‘మరి దేనివల్లా ... తప్ప’ అనే నిర్మాణంతో సహజంగా సరిపోతుంది.
theological_decisions:
- issue: ‘ఉపవాసం’ అనే పదాన్ని చేర్చాలా?
  choice: ప్రధాన పాఠంలో ‘ప్రార్థన’ మాత్రమే
  alternative: ‘ప్రార్థన మరియు ఉపవాసం’
  rationale: అందించిన SBLGNT గ్రీకు పాఠంలో προσευχῇ (‘ప్రార్థన’) మాత్రమే ఉంది. కొన్ని తరువాతి ప్రతుల్లో ‘మరియు ఉపవాసం’ అనే దీర్ఘ పాఠం కనిపిస్తుంది. మూలభాషా పాఠానికి ప్రాధాన్యం ఇస్తూ ప్రధాన వచనంలో ‘ప్రార్థన’ మాత్రమే ఉంచి, సంప్రదాయ దీర్ఘ పాఠాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని ‘ఈ రకం’ అనే సంక్షిప్త, కొంత సందర్భాధారిత సూచనను విపులీకరించకుండా అలాగే నిలిపాం.
