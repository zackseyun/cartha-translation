source:
  edition: SBLGNT
  text: καὶ τὰ ἱμάτια αὐτοῦ ⸀ἐγένετο στίλβοντα λευκὰ ⸀λίαν οἷα γναφεὺς ἐπὶ τῆς γῆς οὐ δύναται ⸀οὕτως λευκᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/003.yaml
  text: And his clothes became gleaming[a], very white, such as no launderer on earth is able to whiten.
translation:
  language: te
  text: ఆయన బట్టలు మెరుస్తూ ఎంతో తెల్లగా మారాయి—భూమిమీద బట్టలను శుభ్రపరచి తెల్లబరచే ఏ వృత్తివ్యక్తి[a] కూడా వాటిని అంత తెల్లగా తెల్లబరచలేడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదం బట్టలను శుభ్రపరచి తెల్లబరచే వృత్తికుడిని సూచిస్తుంది; సంప్రదాయ అనువాదాల్లో దీనిని ‘ఫుల్లర్’ అని అనవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱμάτια
  choice: బట్టలు
  rationale: సాధారణంగా దుస్తులను సూచించే పదం. ఆధునిక తెలుగులో ‘బట్టలు’ సహజంగా, స్పష్టంగా ఉంటుంది; ‘వస్త్రాలు’ కంటే సామాన్య పాఠకులకు సులభం, ‘అంగీలు’ వంటి పదాల కంటే తక్కువ నిర్దిష్టం.
- source_word: ἐγένετο
  choice: అయ్యాయి
  rationale: రూపాంతర సందర్భంలో స్థితి మార్పును సూచిస్తుంది. గ్రీకులో క్రియ ఏకవచన రూపంలో ఉన్నప్పటికీ, తెలుగులో ‘బట్టలు’ అనే బహువచన కర్తకు అనుగుణంగా సహజ వాక్యనిర్మాణం వాడబడింది.
- source_word: στίλβοντα
  choice: మెరుస్తూ
  rationale: ప్రకాశిస్తూ మెరుస్తున్న దృశ్య గుణాన్ని తెలియజేస్తుంది; అదనపు వేదాంతార్థాన్ని చేర్చదు.
- source_word: λευκὰ λίαν
  choice: ఎంతో తెల్లగా
  rationale: λευκά యొక్క తెల్లదనాన్ని λίαν బలంగా తీవ్రపరుస్తుంది. ‘ఎంతో తెల్లగా’ ఆధునిక తెలుగులో సహజంగా ఆ బలాన్ని వ్యక్తం చేస్తుంది.
- source_word: γναφεύς
  choice: బట్టలు శుభ్రం చేసి తెల్లగా చేసే వ్యక్తి
  rationale: ఈ వృత్తి బట్టలను శుభ్రపరచి తెల్లగా చేసే పనిని సూచిస్తుంది. కులసూచకంగా లేదా ప్రాచీన వృత్తిపదంగా అపార్థమయ్యే పదం బదులు కార్యాన్ని స్పష్టంగా వివరించే సమగ్ర పదబంధం వాడబడింది.
- source_word: ἐπὶ τῆς γῆς
  choice: భూమిమీద
  rationale: మానవ లోకంలోని సామర్థ్యంతో పోలికను నేరుగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: οὐ δύναται οὕτως λευκᾶναι
  choice: వాటిని అంత తెల్లగా చేయలేడు
  rationale: సామర్థ్యలేమినీ, οὕτως సూచించే తెల్లదనపు స్థాయినీ సహజ తెలుగులో కాపాడుతుంది. ‘వాటిని’ అనేది బట్టలను సూచించేందుకు సందర్భం నుంచి స్పష్టంగా చేర్చబడింది.
theological_decisions:
- issue: రూపాంతరంలో కనిపించిన ప్రభావం
  choice: యేసు బట్టలు అసాధారణంగా మెరుస్తూ తెల్లగా మారిన దృశ్యాన్ని మాత్రమే వర్ణించడం
  alternative: ‘మహిమతో ప్రకాశించాయి’ వంటి వివరణాత్మక వేదాంత పదజాలాన్ని చేర్చడం
  rationale: ఈ వచనం బట్టల కనిపించిన స్థితిని వర్ణిస్తుంది; ఆ ప్రకాశానికి వేదాంతపరమైన వివరణను ప్రత్యక్షంగా ఇవ్వదు. అందువల్ల సందర్భం నుంచే అర్థం వెలువడేలా, మూలంలోని దృశ్య వర్ణనను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన, సహజ కథన శైలి. మూలంలోని బలమైన పోలికను డాష్‌తో స్పష్టంగా కలిపాం; కులం లేదా లింగాన్ని అనవసరంగా సూచించే వృత్తిపదాన్ని నివారించాం.
