  yaml_path: translation/nt/mark/009/032.yaml
  text: But they did not understand the statement[a], and they were afraid to ask him.
translation:
  language: te
  text: కాని వారు ఆ మాటను[a] అర్థం చేసుకోలేదు; ఆయనను అడగడానికి భయపడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ వాక్యాన్ని.’ గ్రీకు ῥῆμα పలికిన మాటను, చెప్పిన విషయాన్ని లేదా ప్రకటనను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: కాని వారు
  rationale: δέ ఇక్కడ యేసు ముందుగా చెప్పిన విషయానికి శిష్యుల స్పందనను వ్యత్యాసంగా కలుపుతోంది; అందువల్ల ‘కాని’ సహజంగా ఉంది. గ్రీకులో సూచితమైన శిష్యులను ‘వారు’గా వ్యక్తం చేశాం.
- source_word: ἠγνόουν
  choice: అర్థం చేసుకోలేదు
  rationale: ἀγνοέω ఇక్కడ తెలియకపోవడం కంటే పలికిన విషయాన్ని గ్రహించలేకపోవడాన్ని సూచిస్తుంది. అసంపూర్ణ భూతకాల రూపంలోని కొనసాగిన స్థితి తెలుగులో సహజమైన భూతకాల ప్రయోగంతో వ్యక్తమవుతుంది.
- source_word: τὸ ῥῆμα
  choice: ఆ మాటను
  rationale: ῥῆμα యేసు అప్పుడే పలికిన సందేశం లేదా వాక్యాన్ని సూచిస్తుంది. ‘ఆ మాట’ ఆధునిక తెలుగులో సహజంగా ఉండి, ఒకే పదం అనే సంకుచిత భావానికి పరిమితం కాదు.
- source_word: ἐφοβοῦντο
  choice: భయపడ్డారు
  rationale: φοβέομαι ఇక్కడ భయస్థితిని సూచిస్తుంది. ‘భయపడ్డారు’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: αὐτὸν
  choice: ఆయనను
  rationale: ఈ సర్వనామం యేసును సూచిస్తుంది; గౌరవప్రదమైన తెలుగు సర్వనామాన్ని ఉపయోగించాం.
- source_word: ἐπερωτῆσαι
  choice: అడగడానికి
  rationale: ἐπερωτάω అంటే అడగడం లేదా ప్రశ్నించడం. భయపడటంతో కలిపి ‘అడగడానికి’ అత్యంత సహజమైన తెలుగు రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ఆ మాట’ సాధారణ పాఠకులకు సహజంగా ఉండటంతో పాటు గ్రీకు పదంలోని అర్థ విస్తృతిని నిలుపుతుంది.
