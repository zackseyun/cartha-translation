id: MRK.9.18
reference: Mark 9:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν αὐτὸν καταλάβῃ ῥήσσει αὐτόν, καὶ ἀφρίζει καὶ τρίζει τοὺς ⸀ὀδόντας καὶ ξηραίνεται· καὶ εἶπα τοῖς μαθηταῖς σου ἵνα αὐτὸ ἐκβάλωσιν, καὶ οὐκ ἴσχυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/018.yaml
  text: And wherever it seizes him[a], it throws him down, and he foams and grinds his teeth and becomes rigid. And I told your disciples to cast it out, but they were not able.
translation:
  language: te
  text: అది అతన్ని ఎక్కడ పట్టుకున్నా, అతన్ని నేలకేసి పడేస్తుంది; అతడు నురుగు కక్కుతూ, పళ్లు రుబ్బుతూ, బిగుసుకుపోతాడు.[a] దాన్ని వెళ్లగొట్టమని మీ శిష్యులకు చెప్పాను, కానీ వారు చేయలేకపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వాడిపోతాడు,” “క్షీణించిపోతాడు”; మరింత అక్షరార్థంగా, “ఎండిపోతాడు.”
    reason: ξηραίνεται అనే పదానికి ఇక్కడ ‘బిగుసుకుపోతాడు’ అనే సందర్భోచిత భావంతో పాటు ‘ఎండిపోతాడు/వాడిపోతాడు’ అనే అక్షరార్థ అవకాశం కూడా ఉంది.
lexical_decisions:
- source_word: ὅπου ἐὰν
  choice: ఎక్కడ ... అక్కడ
  rationale: అనిర్దిష్టంగా, పదేపదే సంభవించే పరిస్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: καταλάβῃ
  choice: పట్టుకుంటే
  rationale: దుష్టాత్మ బాలుణ్ణి బలవంతంగా వశపరచుకునే భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: ῥήσσει
  choice: నేలకేసి పడేస్తుంది
  rationale: సందర్భంలో హింసాత్మకంగా కింద పడవేయడాన్ని సూచిస్తుంది; ‘చీల్చుతుంది’ అనే అనర్థాన్ని నివారిస్తుంది.
- source_word: ἀφρίζει
  choice: నురుగు కక్కుతూ
  rationale: తెలుగులో ఈ శారీరక లక్షణాన్ని సహజంగా తెలిపే ప్రయోగం; నోటి వద్ద నురుగు రావడం భావంలో అంతర్లీనంగా ఉంటుంది.
- source_word: τρίζει τοὺς ὀδόντας
  choice: పళ్లు కొరుకుతూ
  rationale: పళ్లు రుబ్బడం లేదా కొరకడం అనే శారీరక లక్షణాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ξηραίνεται
  choice: బిగుసుకుపోతాడు
  rationale: లక్షణాల వరుసలో శరీరం గట్టిపడడం అనే సందర్భోచిత భావాన్ని ఇస్తుంది; మూలపదంలోని అక్షరార్థ ప్రత్యామ్నాయాలు పాదసూచికలో ఉంచబడ్డాయి.
- source_word: ἐκβάλωσιν
  choice: వెళ్లగొట్టమని
  rationale: దుష్టాత్మను వ్యక్తి నుండి బలవంతంగా బయటకు పంపే భూతవైద్య సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὐκ ἴσχυσαν
  choice: వారు చేయలేకపోయారు
  rationale: వారి అసమర్థతను కారణం ఊహించకుండా సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ἐκβάλωσιν తో ఉన్న αὐτό యొక్క నిర్దేశ్యం
  choice: ‘దాన్ని’ అనేది బాలుణ్ణి బాధిస్తున్న దుష్టాత్మను సూచిస్తుంది.
  alternative: బాధను లేదా వ్యాధిని సాధారణంగా సూచించవచ్చు.
  rationale: తక్షణ కథా సందర్భంలో బాలుణ్ణి పట్టుకుని పడేస్తున్న ఆత్మను శిష్యులు వెళ్లగొట్టడానికి ప్రయత్నించారు. ‘దాన్ని’ మూలంలోని నపుంసక సర్వనామాన్ని నిలుపుతుంది; ‘వెళ్లగొట్టడం’ భూతవైద్య సందర్భాన్ని సూచిస్తుంది.
- issue: ξηραίνεται యొక్క సందర్భోచిత భావం
  choice: శరీరం బిగుసుకుపోవడం
  alternative: ఎండిపోవడం, వాడిపోవడం, క్షీణించిపోవడం
  rationale: మూర్ఛసదృశ లక్షణాల వరుసలో శరీరం గట్టిపడడం సందర్భానికి సరిపోతుంది; అయితే గ్రీకు పదంలోని నిజమైన అర్థసందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గౌరవప్రదమైన కథన శైలి. మూలంలోని చర్యల క్రమం, దుష్టాత్మకు సంబంధించిన నపుంసక సూచన, ξηραίνεται లోని అర్థసందిగ్ధత సంరక్షించబడ్డాయి.
