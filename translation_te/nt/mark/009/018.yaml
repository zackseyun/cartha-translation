revisions:
- from: అది అతన్ని ఎక్కడ పట్టుకుంటే అక్కడ అతన్ని నేలకేసి పడేస్తుంది. అప్పుడు అతడు నురుగు కక్కుతూ, పళ్లు కొరుకుతూ, బిగుసుకుపోతాడు.[a] దాన్ని వెళ్లగొట్టమని మీ శిష్యులకు చెప్పాను, కానీ వారు చేయలేకపోయారు.”
  to: అది అతన్ని ఎక్కడ పట్టుకున్నా, అతన్ని నేలకేసి పడేస్తుంది; అతడు నురుగు కక్కుతూ, పళ్లు రుబ్బుతూ, బిగుసుకుపోతాడు.[a] దాన్ని వెళ్లగొట్టమని మీ శిష్యులకు చెప్పాను, కానీ వారు చేయలేకపోయారు.
  rationale: The revision retains the draft’s sound contextual rendering of ξηραίνεται and its ambiguity-preserving footnote. It makes the repeated indefinite force of ὅπου ἐὰν more idiomatic, renders tooth-grinding precisely, removes an added temporal connective, and corrects the unmatched quotation punctuation.
