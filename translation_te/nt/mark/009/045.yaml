id: MRK.9.45
reference: Mark 9:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ πούς σου σκανδαλίζῃ σε, ἀπόκοψον αὐτόν· καλόν ἐστίν ⸀σε εἰσελθεῖν εἰς τὴν ζωὴν χωλὸν ἢ τοὺς δύο πόδας ἔχοντα βληθῆναι εἰς τὴν ⸀γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/045.yaml
  text: And if your foot causes you to stumble[a], cut it off. It is better for you to enter into life lame than, having both feet, to be thrown into Gehenna.
translation:
  language: te
  text: నీ పాదం నిన్ను తొట్రుపడేలా చేస్తే, దాన్ని నరికివేయి. రెండు పాదాలూ ఉండి గెహెన్నా[a]లో పడవేయబడటం కంటే, కుంటివాడిగా జీవంలో ప్రవేశించడం నీకు మేలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నరకం.” గ్రీకు పదం ‘గెహెన్నా’; ఇది హిన్నోము లోయను, దానితో ముడిపడిన దైవిక తీర్పు భావాలను గుర్తుచేస్తుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: తొట్రుపడేలా చేస్తే
  rationale: మూలంలోని తడబడటం లేదా పడిపోవడం అనే రూపకాన్ని నిలుపుతూ, పాపంలో పడే భావాన్ని సందర్భంలో సూచిస్తుంది; నేరుగా ‘పాపం చేయిస్తే’ అని చెప్పి అర్థాన్ని కుదించదు.
- source_word: ἀπόκοψον
  choice: నరికివేయి
  rationale: బలమైన ఆజ్ఞను, దాని స్పష్టమైన మరియు అతిశయోక్తిపూర్వక శరీర రూపకాన్ని మృదువుచేయకుండా వ్యక్తం చేస్తుంది.
- source_word: καλόν ἐστίν
  choice: నీకు మేలు
  rationale: ἤతో కూడిన పోలికలో ‘మంచిది’ అనే పదానికి ఉన్న ‘మేలైనది’ అనే తులనాత్మక భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: జీవంలో ప్రవేశించడం
  rationale: అంత్యకాల జీవాన్ని సూచించే మూల రూపకాన్ని నిలుపుతుంది; మూలంలో లేని ‘నిత్య’ అనే విశేషణాన్ని చేర్చదు.
- source_word: χωλὸν
  choice: కుంటివాడిగా
  rationale: పాదం కోల్పోవడం వల్ల నడకలో లోపం కలిగిన స్థితిని సందర్భానుగుణంగా, నిర్దిష్టంగా తెలియజేస్తుంది.
- source_word: βληθῆναι
  choice: పడవేయబడడం
  rationale: βάλλω యొక్క కర్మణి రూపంలో ఉన్న బలవంతంగా విసరబడే లేదా పడవేయబడే భావాన్ని నిలుపుతుంది.
- source_word: γέενναν
  choice: గెహెన్నా
  rationale: యూదుల చారిత్రక మరియు అంత్యకాల తీర్పు అనుబంధాలు గల నిర్దిష్ట గ్రీకు పదాన్ని సంప్రదాయ సాధారణీకరణ లేకుండా నిలుపుతుంది.
- source_word: τοὺς δύο πόδας ἔχοντα
  choice: రెండు పాదాలూ ఉండి
  rationale: రెండు పాదాలు కలిగి ఉండటానికి, కుంటివాడిగా ప్రవేశించటానికి మధ్యనున్న వ్యత్యాసాన్ని సహజమైన తెలుగులో స్పష్టంగా చూపిస్తుంది.
theological_decisions:
- issue: తీర్పు సందర్భంలో γέεννα అనువాదం
  choice: గెహెన్నా
  alternative: నరకం
  rationale: మూలపదం సాధారణ పరలోక శిక్షాస్థల పదం కాకుండా, హిన్నోము లోయను మరియు దైవిక తీర్పును గుర్తుచేసే నిర్దిష్ట నామం. అందువల్ల ప్రధాన పాఠంలో దానిని నిలిపి, పరిచితమైన భావానువాదాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ‘తొట్రుపడేలా’ అనే రూపం మూలంలోని రూపకాన్నీ దాని నైతిక తీవ్రతనూ నిలుపుతుంది; ‘నరికివేయి’ ఆజ్ఞ యొక్క ఉద్దేశపూర్వక తీవ్రతను మృదువుచేయదు.
