  to: 'వారు కపెర్నహూముకు వచ్చారు. ఆయన ఆ ఇంట్లో ఉన్నప్పుడు వారిని అడుగుతున్నాడు: “దారిలో మీరు దేని గురించి చర్చించుకుంటున్నారు?[a]”'
  rationale: The revision explicitly reflects the definite article for the house, improves Telugu sentence structure and direct-speech idiom, and retains the progressive/imperfective narrative force of both relevant verbs. The lexical-alternative footnote remains anchored to “చర్చించుకుంటున్నారు” and preserves the source word’s contextual range.
