source:
  edition: SBLGNT
  text: Καὶ ⸀ἦλθον εἰς Καφαρναούμ. καὶ ἐν τῇ οἰκίᾳ γενόμενος ἐπηρώτα αὐτούς· Τί ἐν τῇ ⸀ὁδῷ διελογίζεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/033.yaml
  text: And they came to Capernaum. And when he was in the house, he was asking them, “What were you discussing on the way?”
translation:
  language: te
  text: 'వారు కపెర్నహూముకు వచ్చారు. ఆయన ఆ ఇంట్లో ఉన్నప్పుడు వారిని అడుగుతున్నాడు: “దారిలో మీరు దేని గురించి చర్చించుకుంటున్నారు?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దారిలో మీరు దేని గురించి వాదించుకుంటున్నారు?” ఈ క్రియ చర్చ, వాదోపవాదం లేదా వివాదాన్ని సూచించగలదు; తరువాతి వచనం వారిలో ఎవరు గొప్పవారనే విషయమై ఉందని చూపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: వచ్చారు
  rationale: εἰς + స్థలనామంతో కలిసి ఇక్కడ గమ్యస్థానానికి చేరుకోవడాన్ని తెలిపే సహజమైన తెలుగు రూపం.
- source_word: Καφαρναούμ
  choice: కపెర్నహూము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన స్థలనామ లిప్యంతరీకరణను అనుసరిస్తుంది.
- source_word: ἐν τῇ οἰκίᾳ
  choice: ఇంట్లో
  rationale: నిర్దిష్టమైన ఇంటి అంతర్గత స్థలాన్ని సహజంగా తెలియజేస్తుంది; ఇది ‘తన ఇంట్లో’ అని అనవసరంగా నిర్ధారించదు.
- source_word: γενόμενος
  choice: ఉన్నప్పుడు
  rationale: ఈ కృదంతం ప్రధాన క్రియకు కాలసంబంధ నేపథ్యాన్ని ఇస్తుంది; తెలుగులో ‘ఉన్నప్పుడు’ సహజంగా ఆ సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐπηρώτα
  choice: అడుగుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న లేదా పునరావృత ప్రయత్న ఛాయను నిలుపుతుంది.
- source_word: Τί
  choice: దేని గురించి
  rationale: తెలుగులో చర్చకు సంబంధించిన ప్రశ్నను స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ ὁδῷ
  choice: దారిలో
  rationale: ప్రయాణ సందర్భంలో ‘on the way’ భావానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: διελογίζεσθε
  choice: చర్చించుకుంటూ ఉన్నారు
  rationale: పరస్పర చర్చ, వాదోపవాదం లేదా తర్కం అనే విస్తృత భావపరిధిని పూర్తిగా ‘వాదించుకోవడం’గా కుదించకుండా ఉంచుతుంది.
theological_decisions:
- issue: ἦλθον అనే బహువచన కర్త నుంచి γενόμενος/ἐπηρώτα అనే ఏకవచన కర్తకు మార్పు
  choice: మొదటి వాక్యంలో ‘వారు’ అని, తరువాతి వాక్యంలో సందర్భానుసారం యేసును సూచించే ‘ఆయన’ అని స్పష్టం చేయడం
  alternative: ‘వారు వచ్చారు; ఇంట్లోకి వచ్చిన తరువాత ఆయన వారిని అడిగాడు’ అని ప్రవేశ చర్యను మరింత స్పష్టీకరించడం
  rationale: గ్రీకు వాక్యంలో సహజంగా జరిగే కర్త మార్పును తెలుగులో అయోమయం లేకుండా చూపుతుంది; ‘ఇంట్లోకి ప్రవేశించాడు’ అనే అదనపు భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. అసలు గ్రీకు వాక్యంలోని కొనసాగుతున్న క్రియాభావాన్ని ‘అడుగుతూ ఉన్నాడు’, ‘చర్చించుకుంటూ ఉన్నారు’ రూపాలతో నిలిపి, వివాద ఛాయను పాదటిప్పణిలో భద్రపరచింది.
