review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately retains the conditional warning, the imperative to cut off the hand, the contrast between entering life and going to Gehenna, and the concrete judgment imagery. However, it reverses the source order of the final appositional phrases: Greek has “into Gehenna, into the unquenchable fire,” whereas the draft has “into the unquenchable fire, into Gehenna.” “వెళ్లిపోవడం” also better represents ἀπελθεῖν than the neutral “వెళ్లడం.”'
  naturalness: The Telugu is generally clear and suitably solemn. Recasting “చెయ్యి కోల్పోయినవాడిగా” as “ఒక చేయి కోల్పోయి” is more inclusive and natural while retaining the contextual force of κυλλόν.
  terminology: “గెహెన్నా” appropriately preserves γέεννα rather than prematurely replacing it with “నరకం.” “ఆరిపోని అగ్ని” naturally conveys ἄσβεστον. The footnotes correctly preserve the lexical alternative for σκανδαλίζῃ and identify Gehenna without doctrinal overstatement.
  issues:
  - severity: medium
    issue: The order of “Gehenna” and “unquenchable fire” is reversed.
    rationale: The Greek reads εἰς τὴν γέενναν, εἰς τὸ πῦρ τὸ ἄσβεστον (“into Gehenna, into the unquenchable fire”). Restoring this order improves source fidelity without altering the meaning.
  - severity: low
    issue: “వెళ్లడం” weakens the directional force of ἀπελθεῖν.
    rationale: “వెళ్లిపోవడం” more naturally conveys “go away/depart” and maintains the contrast with “జీవంలో ప్రవేశించడం.”
  revised_text: నీ చేయి నిన్ను తడబడేలా చేస్తే[a], దాన్ని నరికివేయి. రెండు చేతులు కలిగి గెహెన్నాలోకి, ఆరిపోని అగ్నిలోకి వెళ్లిపోవడం కంటే, ఒక చేయి కోల్పోయి జీవంలో ప్రవేశించడం నీకు మేలు.
