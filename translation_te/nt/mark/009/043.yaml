id: MRK.9.43
reference: Mark 9:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐὰν ⸀σκανδαλίζῃ σε ἡ χείρ σου, ἀπόκοψον αὐτήν· καλόν ⸂ἐστίν σε⸃ κυλλὸν ⸂εἰσελθεῖν εἰς τὴν ζωὴν⸃ ἢ τὰς δύο χεῖρας ἔχοντα ἀπελθεῖν εἰς τὴν γέενναν, εἰς τὸ πῦρ τὸ ⸀ἄσβεστον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/043.yaml
  text: And if your hand causes you to stumble[a], cut it off. It is better for you to enter into life crippled than, having two hands, to go away into Gehenna[b], into the unquenchable fire.
translation:
  language: te
  text: నీ చేయి నిన్ను తడబడేలా చేస్తే[a], దాన్ని నరికివేయి. రెండు చేతులు కలిగి గెహెన్నాలోకి, ఆరిపోని అగ్నిలోకి వెళ్లిపోవడం కంటే, ఒక చేయి కోల్పోయి జీవంలో ప్రవేశించడం నీకు మేలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నీతో పాపం చేయిస్తే.” గ్రీకు క్రియకు ఎవరినైనా తడబడేలా చేయడం, పడిపోయేలా చేయడం లేదా పాపం చేయించడం అనే అర్థాలు రావచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: తడబడేలా చేస్తే
  rationale: పాపం చేయించడం, పడిపోవడానికి కారణం కావడం అనే సందర్భార్థాలను కలిగిన మూలభాషలోని రూపకాన్ని నిలుపుతుంది; అర్థాన్ని కేవలం నైతిక అపరాధానికే పరిమితం చేయదు.
- source_word: ἀπόκοψον
  choice: నరికివేయి
  rationale: బలమైన ఆజ్ఞను, ఉద్దేశపూర్వకంగా దిగ్భ్రాంతి కలిగించే శరీర సంబంధ చిత్రణను నేరుగా నిలుపుతుంది.
- source_word: καλόν
  choice: మేలు
  rationale: ἢ తో కూడిన పోలికలో καλόν తులనాత్మక భావాన్ని ఇస్తుంది; తెలుగులో ‘మేలు’ సహజంగా ‘కంటే’ నిర్మాణంతో ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: κυλλόν
  choice: చెయ్యి కోల్పోయినవాడిగా
  rationale: ఒక అవయవం లేని లేదా ఛేదించబడిన స్థితిని ఈ సందర్భంలో స్పష్టంగా చెబుతుంది; ఆధునిక తెలుగులో అవమానకరంగా వినిపించగల సాధారణ వైకల్య పదాన్ని నివారిస్తుంది.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: జీవంలో ప్రవేశించడం
  rationale: మూలంలోని ప్రవేశ రూపకాన్ని, అంత్యకాల సంబంధ గంభీర భావాన్ని నిలుపుతుంది.
- source_word: ἀπελθεῖν
  choice: వెళ్లడం
  rationale: తెలుగులో సహజమైన దిశాత్మక క్రియ; ‘జీవంలో ప్రవేశించడం’తో ఉన్న వ్యత్యాసాన్ని సందర్భమే స్పష్టం చేస్తుంది.
- source_word: γέενναν
  choice: గెహెన్నాలోకి
  rationale: ప్రత్యేక యూదా స్థలనామం మరియు తీర్పు చిత్రణను సాధారణ వేదాంత పదంలో కలిపివేయకుండా మూలపదాన్ని లిప్యంతరీకరిస్తుంది.
- source_word: ἄσβεστον
  choice: ఆరని
  rationale: ఆర్పబడని లేదా ఆరనిది అనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἡ χείρ σου
  choice: నీ చెయ్యి
  rationale: హెచ్చరికకు కేంద్రంగా ఉన్న శరీర చిత్రణను నేరుగా నిలుపుతుంది.
- source_word: τὰς δύο χεῖρας ἔχοντα
  choice: రెండు చేతులు కలిగి
  rationale: ఒక చెయ్యి కోల్పోయిన స్థితితో మూలంలో ఉన్న స్పష్టమైన వ్యత్యాసాన్ని కాపాడుతుంది.
theological_decisions:
- issue: తీర్పు వాక్యంలో γέεννα అనువాదం
  choice: గెహెన్నా
  alternative: నరకం
  rationale: మూలంలోని నిర్దిష్ట యూదా స్థలనామాన్ని, దానితో ముడిపడిన తీర్పు చిత్రణను నిలుపుతుంది; విస్తృతమైన వేదాంతార్థం గల ‘నరకం’ను ప్రధాన పాఠ్యంలో పెట్టదు.
- issue: చెయ్యిని నరికివేయమనే హెచ్చరిక తీవ్రత
  choice: నిర్దిష్ట శరీర సంబంధ భాషను వ్యాఖ్యానాత్మకంగా మృదువుచేయకుండా నిలుపడం
  alternative: పాపానికి దూరంగా ఉండు అనే సాధారణ నీతిపరమైన వివరణ
  rationale: మూలవాక్యంలోని దిగ్భ్రాంతికరమైన చిత్రణ పాపం మరియు తీర్పు తీవ్రతను బలంగా వ్యక్తం చేస్తుంది; అనువాదం దాన్ని ముందుగానే వివరించి తగ్గించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ‘చెయ్యి’ సాధారణ పాఠకులకు సహజంగా ఉండగా, ‘జీవంలో ప్రవేశించడం’ అంత్యకాల సంబంధ మూలరూపకాన్ని నిలుపుతుంది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో చేర్చబడింది.
