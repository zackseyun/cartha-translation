  yaml_path: translation/nt/mark/009/014.yaml
  text: And when they came to the disciples[a], they saw a large crowd around them, and scribes arguing with them.
translation:
  language: te
  text: వారు శిష్యుల దగ్గరకు వచ్చినప్పుడు, శిష్యుల చుట్టూ పెద్ద జనసమూహం ఉండడాన్ని, ధర్మశాస్త్ర పండితులు శిష్యులతో వాదించడాన్ని[a] చూశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చర్చించడాన్ని.’ గ్రీకు క్రియ చర్చను లేదా వాదనను సూచించగలదు; ఈ సందర్భంలో వాదన భావమే ఎక్కువగా కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: వచ్చినప్పుడు
  rationale: కాలసంబంధ అర్థాన్ని సహజమైన తెలుగు ఉపవాక్యంగా వ్యక్తం చేస్తూ, రావడం జరిగిన తరువాత చూడడం జరిగిందనే క్రమాన్ని నిలుపుతుంది.
- source_word: πρὸς τοὺς μαθητάς
  choice: శిష్యుల దగ్గరికి
  rationale: πρός‌తో ద్వితీయా విభక్తి వ్యక్తుల వైపు కదలికను సూచిస్తుంది; ఈ కథన సందర్భంలో ‘దగ్గరికి’ సహజంగా ఉంది.
- source_word: εἶδον
  choice: చూశారు
  rationale: కథనంలో ὁράω యొక్క సాధారణ భూతకాల భావాన్ని నేరుగా అందిస్తుంది.
- source_word: ὄχλον πολύν
  choice: పెద్ద జనసమూహం
  rationale: ὄχλος జనసమూహాన్ని, πολύς దాని పెద్ద పరిమాణాన్ని సూచిస్తాయి.
- source_word: περὶ αὐτούς
  choice: వారి చుట్టూ
  rationale: περί ఇక్కడ స్థలసంబంధంగా శిష్యుల చుట్టూ జనసమూహం ఉన్నట్లు సూచిస్తుంది.
- source_word: γραμματεῖς
  choice: ధర్మశాస్త్ర పండితులు
  rationale: యూదుల లేఖనాలు, ధర్మశాస్త్రంలో నిపుణులైన వర్గాన్ని ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; కేవలం లేఖకులు అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: συζητοῦντας
  choice: వాదిస్తూ ఉండడాన్ని
  rationale: క్రియ చర్చ లేదా వాదన రెండింటినీ సూచించగలదు; ఈ ఘర్షణాత్మక సందర్భంలో ‘వాదిస్తూ’ ప్రధాన భావానికి సరిపోతుంది, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: πρὸς αὐτούς
  choice: వారితో
  rationale: సంభాషణ లేదా వాదనలో ఎదుటి పక్షంతో నిమగ్నతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘వారు’ శిష్యులను సూచిస్తుంది.
