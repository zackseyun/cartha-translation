id: MRK.9.8
reference: Mark 9:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐξάπινα περιβλεψάμενοι οὐκέτι οὐδένα εἶδον ⸂ἀλλὰ τὸν Ἰησοῦν μόνον μεθ’ ἑαυτῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/008.yaml
  text: And suddenly, looking around, they no longer saw anyone except Jesus alone with them.
translation:
  language: te
  text: అకస్మాత్తుగా వారు చుట్టూ చూసి, తమతో ఉన్న యేసు తప్ప ఇక ఎవరినీ చూడలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξάπινα
  choice: అకస్మాత్తుగా
  rationale: హఠాత్తుగా జరిగిన మార్పును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: περιβλεψάμενοι
  choice: చుట్టూ చూసినప్పుడు
  rationale: చుట్టుపక్కల పరిశీలిస్తూ చూడడం అనే క్రియార్థాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: οὐκέτι οὐδένα εἶδον
  choice: మరెవరూ వారికి కనిపించలేదు
  rationale: ‘ఇక ఎవరినీ చూడలేదు’ అనే మూలార్థాన్ని తెలుగు వాక్యప్రవాహానికి అనుగుణంగా తెలియజేస్తుంది.
- source_word: ἀλλὰ τὸν Ἰησοῦν μόνον μεθ’ ἑαυτῶν
  choice: తమతో ఉన్న యేసు తప్ప
  rationale: యేసు మాత్రమే వారితో మిగిలి కనిపించాడనే ప్రత్యేకతను సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: యేసు మాత్రమే కనిపించాడనే ప్రత్యేక ఉద్ఘాటన
  choice: తమతో ఉన్న యేసు తప్ప మరెవరూ వారికి కనిపించలేదు
  alternative: యేసు ఒక్కడే తమతో ఉండడం చూశారు
  rationale: μόνον అనే ఉద్ఘాటనను నిలుపుతూ, మూలంలోని మినహాయింపు నిర్మాణాన్ని అనవసరమైన సిద్ధాంత వివరణ లేకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనదైనా గౌరవప్రదమైన వచనశైలి. మూలంలోని సంఘటనల క్రమం—అకస్మాత్తుగా, చుట్టూ చూడడం, యేసు మాత్రమే కనిపించడం—స్పష్టంగా నిలుపబడింది.
