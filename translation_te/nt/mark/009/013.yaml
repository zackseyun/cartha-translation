id: MRK.9.13
reference: Mark 9:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ λέγω ὑμῖν ὅτι καὶ Ἠλίας ἐλήλυθεν, καὶ ἐποίησαν αὐτῷ ὅσα ⸀ἤθελον, καθὼς γέγραπται ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/013.yaml
  text: But I tell you that Elijah also has come[a], and they did to him whatever they wanted, just as it is written about him.
translation:
  language: te
  text: 'కాని నేను మీతో చెబుతున్నాను: ఏలీయా కూడా ఇప్పటికే వచ్చాడు[a], వారు కోరినదంతా అతనికి చేశారు, అతని గురించి రాయబడినట్లుగానే.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, బాప్తిస్మమిచ్చే యోహాను వ్యక్తిత్వంలోను పరిచర్యలోను ఏలీయా ఇప్పటికే వచ్చాడు; మార్కు 9:11–12 చూడండి; మత్తయి 11:14; 17:12–13తో పోల్చండి.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: శిష్యుల నిరీక్షణకు విరుద్ధమైన విషయాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో చెబుతున్నాను
  rationale: వ్యక్తిగత సంబోధనను, ప్రత్యక్షంగా చెప్పే బలాన్ని నిలుపుతుంది.
- source_word: ὅτι καὶ Ἠλίας ἐλήλυθεν
  choice: ఏలీయా ఇప్పటికే వచ్చాడు
  rationale: ἐλήλυθεν అనే పరిపూర్ణ కాలరూపం సూచించే పూర్తయిన రాకను, దాని ప్రస్తుత ప్రాసంగికతను ‘ఇప్పటికే వచ్చాడు’ సహజంగా వ్యక్తం చేస్తుంది; καὶ ఇక్కడ సందర్భానుసారంగా ఏలీయా కూడా వచ్చాడనే భావాన్ని బలపరుస్తుంది.
- source_word: ἐποίησαν αὐτῷ ὅσα ἤθελον
  choice: వారు తమకు ఇష్టమైనదంతా అతనికి చేశారు
  rationale: అతనికి వారు చేసినదాని అపరిమిత విస్తృతిని, మూలంలోని కఠినమైన తెరచిన భావాన్ని నిలుపుతుంది.
- source_word: καθὼς γέγραπται ἐπ’ αὐτόν
  choice: అతని గురించి రాయబడినట్లుగానే
  rationale: లేఖన సూచన సూత్రాన్ని సహజంగా అందిస్తూ, ἐπ’ αὐτόνను ‘అతని గురించి’గా అనువదిస్తుంది; ‘అతనికి వ్యతిరేకంగా’ అనే తక్కువ సంభావ్య అర్థాన్ని ప్రధాన పాఠ్యంలో ఎంచుకోదు.
theological_decisions:
- issue: ఈ మాటలో ఏలీయా ఎవరు?
  choice: ప్రధాన పాఠ్యంలో ‘ఏలీయా’ అనే పేరునే ఉంచడం
  alternative: బాప్తిస్మమిచ్చే యోహాను రూపంలో లేదా పరిచర్యలో ఏలీయా వచ్చాడని ప్రధాన పాఠ్యంలో స్పష్టీకరించడం
  rationale: మూల వాక్యం ఏలీయా అని మాత్రమే చెబుతుంది. సందర్భం దీనిని బాప్తిస్మమిచ్చే యోహానుతో అనుసంధానించినా, ఆ వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా పాదసూచికలో ఇవ్వడం మూలంలోని భావ ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గంభీరతను నిలుపుతూ రూపొందించబడింది. ‘తమకు ఇష్టమైనదంతా అతనికి చేశారు’ అనే నిర్మాణం ఉద్దేశపూర్వకంగా మూలంలోని తెరచిన, తీవ్రమైన భావాన్ని కాపాడుతుంది.
