id: MRK.9.20
reference: Mark 9:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἤνεγκαν αὐτὸν πρὸς αὐτόν. καὶ ἰδὼν αὐτὸν ⸂τὸ πνεῦμα εὐθὺς⸃ ⸀συνεσπάραξεν αὐτόν, καὶ πεσὼν ἐπὶ τῆς γῆς ἐκυλίετο ἀφρίζων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/020.yaml
  text: And they brought him to him[a]. And when the spirit saw him, it immediately convulsed him, and he fell on the ground and rolled about[b], foaming.
translation:
  language: te
  text: వారు అతణ్ణి ఆయన దగ్గరికి తీసుకొచ్చారు. ఆ ఆత్మ ఆయనను చూడగానే[a], వెంటనే అతనికి తీవ్రమైన మూర్ఛ కలిగించింది.[b] అతడు నేలమీద పడి, నురుగు కక్కుతూ దొర్లుతూనే ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ అపవిత్రాత్మ.’ సందర్భం ఈ ఆత్మను అపవిత్రాత్మగా గుర్తిస్తుంది; అయితే ఈ వచనంలో మూలపాఠం కేవలం ‘ఆ ఆత్మ’ అని మాత్రమే చెబుతుంది.
    reason: alternative_reading
  - marker: b
    text: ‘అతణ్ణి మూర్ఛతో విలవిలలాడించింది’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκαν
  choice: తీసుకొచ్చారు
  rationale: ఇక్కడ φέρω బాలుణ్ణి యేసు దగ్గరికి తీసుకురావడాన్ని సూచిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘తీసుకొచ్చారు’ సహజంగా ఉంది.
- source_word: πρὸς αὐτόν
  choice: ఆయన దగ్గరికి
  rationale: πρός + ద్వితీయా విభక్తి ఒక వ్యక్తివైపు కదలికను సూచిస్తుంది. సందర్భంలో ఈ గౌరవ ఏకవచన సర్వనామం యేసును సూచిస్తుంది.
- source_word: ἰδὼν αὐτόν
  choice: ఆ ఆత్మ ఆయనను చూడగానే
  rationale: అసలు వాక్యంలో కర్త ‘ఆ ఆత్మ’; కాలసంబంధమైన అసమాపక క్రియను తెలుగులో ‘చూడగానే’ అని సహజంగా వ్యక్తం చేశాం.
- source_word: τὸ πνεῦμα
  choice: ఆ ఆత్మ
  rationale: ఈ వచనంలో ఉన్నది కేవలం ‘ఆత్మ’ అనే పదమే. విస్తృత సందర్భం దాన్ని అపవిత్రాత్మగా గుర్తించినా, ఇక్కడ లేని విశేషణాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు రచనలోని తక్షణత్వాన్ని సహజమైన ఆధునిక తెలుగు పదంతో నిలిపాం.
- source_word: συνεσπάραξεν
  choice: అతణ్ణి తీవ్రంగా కొట్టుకునేలా చేసింది
  rationale: ఈ క్రియ తీవ్రమైన శరీర సంకోచాలు లేదా మూర్ఛవంటి కొట్టుకోవడాన్ని కలిగించడాన్ని సూచిస్తుంది. తెలుగు పాఠకులకు స్పష్టంగా ఉండేలా కారణార్థక నిర్మాణాన్ని వాడాం.
- source_word: πεσὼν ἐπὶ τῆς γῆς
  choice: అతడు నేలమీద పడి
  rationale: అసమాపక క్రియను నిలిపి, నేలమీద పడింది బాలుడేనని తెలుగులో స్పష్టంగా చేశాం.
- source_word: ἐκυλίετο
  choice: దొర్లుతూనే ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న కదలికను ‘తూనే ఉన్నాడు’ ద్వారా వ్యక్తం చేశాం.
- source_word: ἀφρίζων
  choice: నురుగు కక్కుతూ
  rationale: నురుగు వస్తున్న స్థితిని సహజమైన తెలుగు ప్రయోగంతో తెలిపాం; మూలంలో స్పష్టంగా లేని ‘నోటి దగ్గర’ అనే మాటను చేర్చలేదు.
theological_decisions:
- issue: πνεῦμα అనే పదం ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘ఆ ఆత్మ’ అని మాత్రమే అనువదించడం
  alternative: ‘ఆ అపవిత్రాత్మ’ లేదా ‘ఆ దయ్యం’
  rationale: విస్తృత సందర్భం అది అపవిత్రాత్మ అని తెలియజేస్తుంది; అయితే ఈ వచనం τὸ πνεῦμα అని మాత్రమే చెబుతుంది. కాబట్టి మూలభాషలోని సంక్షిప్త రూపాన్ని నిలిపి, సందర్భపూర్వక గుర్తింపును పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని వాడాం. యేసుకు ‘ఆయన’, బాలునికి ‘అతడు/అతణ్ణి’ వాడి సర్వనామ సూచనలను సహజంగా వేరు చేశాం. ‘నురుగు కక్కుతూ’ సాధారణ తెలుగు ప్రయోగం; మూలంలో లేని శరీర భాగాన్ని చేర్చలేదు.
