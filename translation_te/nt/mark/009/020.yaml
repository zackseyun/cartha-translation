revisions:
- from: వారు అతణ్ణి ఆయన దగ్గరికి తీసుకొచ్చారు. ఆ ఆత్మ ఆయనను చూడగానే[a], వెంటనే అతణ్ణి తీవ్రంగా కొట్టుకునేలా చేసింది. అతడు నేలమీద పడి, నురుగు కక్కుతూ దొర్లుతూనే ఉన్నాడు.[b]
  to: వారు అతణ్ణి ఆయన దగ్గరికి తీసుకొచ్చారు. ఆ ఆత్మ ఆయనను చూడగానే[a], వెంటనే అతనికి తీవ్రమైన మూర్ఛ కలిగించింది.[b] అతడు నేలమీద పడి, నురుగు కక్కుతూ దొర్లుతూనే ఉన్నాడు.
