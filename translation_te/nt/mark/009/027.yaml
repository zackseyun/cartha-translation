id: MRK.9.27
reference: Mark 9:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς κρατήσας ⸂τῆς χειρὸς αὐτοῦ⸃ ἤγειρεν αὐτόν, καὶ ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/027.yaml
  text: But Jesus[a], taking hold of his hand, raised him up[b], and he stood up.
translation:
  language: te
  text: అయితే యేసు అతని చెయ్యి పట్టుకొని, అతన్ని పైకి లేపాడు[a]; అతడు లేచి నిలబడ్డాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతన్ని లేపాడు’; ఈ గ్రీకు క్రియ నిద్రనుండి లేదా మరణంనుండి లేపే సందర్భాల్లో కూడా వాడబడుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతడు లేచాడు’ లేదా ‘అతడు పైకి లేచాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: బాలుడు చనిపోయాడని ప్రజలు అనుకున్న నేపథ్యానికి యేసు చేసిన కార్యానికి మధ్య ఉన్న స్వల్ప వ్యత్యాసాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: κρατήσας
  choice: పట్టుకొని
  rationale: యేసు బాలుని చెయ్యిని భౌతికంగా పట్టుకున్న స్పష్టమైన చర్యను సహజంగా వ్యక్తపరుస్తుంది; ‘గట్టిగా పట్టుకొని’ అని మూలంలో లేని తీవ్రతను చేర్చదు.
- source_word: τῆς χειρὸς αὐτοῦ
  choice: అతని చెయ్యి
  rationale: χείρ సూచించే నిర్దిష్ట శరీర భాగమైన ‘చెయ్యి’ని నిలుపుతుంది; ‘చేయి పట్టుకొని’ అనేది ఆధునిక తెలుగులో సహజమైన నిర్మాణం.
- source_word: ἤγειρεν
  choice: అతన్ని పైకి లేపాడు
  rationale: నేలపై ఉన్న బాలుడు లేచేలా యేసు చేసిన కార్యాన్ని తెలియజేస్తూ, నిద్రనుండి లేదా మరణంనుండి లేపడానికీ వాడగల మూల క్రియలోని విస్తృత ప్రతిధ్వనిని పూర్తిగా తొలగించదు.
- source_word: ἀνέστη
  choice: అతడు లేచి నిలబడ్డాడు
  rationale: యేసు పైకి లేపిన తరువాత బాలుడు లేచి నిలబడిన ఫలితాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ἤγειρεν / ἀνέστη క్రియల్లో ఉండగల పునరుత్థాన భాషా ప్రతిధ్వని
  choice: సందర్భానికి తగిన సాధారణంగా పైకి లేవడాన్ని సూచించే భాషను వాడుతూ ‘లేపాడు / లేచి’ అనే పదబంధ సంబంధాన్ని నిలుపడం.
  alternative: ‘అతనికి లేవడానికి సహాయం చేశాడు’ అని పూర్తిగా సాధారణీకరించడం, లేదా ‘అతన్ని లేపాడు; అతడు లేచాడు’ అని పునరుత్థాన ప్రతిధ్వనిని మరింత ముందుకు తేవడం.
  rationale: ఈ సందర్భం దయ్యం వెళ్లిపోయిన తరువాత బాలుడు నేలపై నుండి లేవడాన్ని వర్ణిస్తుంది; అతడు నిజంగా మృతులలోనుండి పునరుత్థానమయ్యాడని వాక్యం స్పష్టంగా చెప్పదు. అయినా మార్కు ఉపయోగించిన క్రియలు ఇతర సందర్భాల్లో నిద్ర లేదా మరణం నుండి లేపడాన్ని సూచించగలవు. అందువల్ల సందర్భార్థాన్ని ప్రధానంగా ఉంచుతూ సాధ్యమైన ప్రతిధ్వనిని అణచివేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘లేచి నిలబడ్డాడు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, పురాతనంగా వినిపించే రూపాలను నివారిస్తుంది. అర్థవిరామ చిహ్నం యేసు చేసిన కార్యానికీ దాని ఫలితానికీ మధ్య సంబంధాన్ని స్పష్టపరుస్తుంది.
