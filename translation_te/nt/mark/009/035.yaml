review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects καθίσας, ἐφώνησεν, τοὺς δώδεκα, the historical-present λέγει, and the paired πάντων expressions. However, ἔσται is future indicative ('will be'), whereas 'ఉండాలి' changes the statement into an explicit obligation. Telugu can preserve the declarative future without losing the saying's ethical force.
  naturalness: The Telugu is clear, idiomatic, and suitably respectful for modern standard usage. ‘పన్నెండుమందిని’ naturally refers to the Twelve. The revised future wording is equally natural.
  terminology: ‘మొదటివాడిగా,’ ‘చివరివాడిగా,’ and ‘సేవకుడిగా’ preserve the contrast and the nonspecialized sense of διάκονος. No ecclesiastical office terminology is introduced.
  issues:
  - severity: medium
    issue: ‘ఉండాలి’ for ἔσται
    rationale: 'The Greek future indicative is declarative: ‘he will be last of all and servant of all.’ ‘ఉండాలి’ makes it a direct prescriptive ‘must be,’ narrowing the grammatical force. ‘అవుతాడు’ retains the future assertion and remains natural in Telugu.'
  revised_text: 'ఆయన కూర్చుని, పన్నెండుమందిని పిలిచి వారితో ఇలా అంటాడు: “ఎవరైనా మొదటివాడిగా ఉండాలని కోరుకుంటే, అతడు అందరిలో చివరివాడిగా, అందరికీ సేవకుడిగా అవుతాడు.”'
