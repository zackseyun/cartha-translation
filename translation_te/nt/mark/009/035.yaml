revisions:
- from: 'ఆయన కూర్చుని, పన్నెండుమందిని పిలిచి వారితో ఇలా అంటాడు: “ఎవరైనా మొదటివాడిగా ఉండాలని కోరుకుంటే, అతడు అందరిలో చివరివాడిగా, అందరికీ సేవకుడిగా ఉండాలి.”'
  to: 'ఆయన కూర్చుని, పన్నెండుమందిని పిలిచి వారితో ఇలా అంటాడు: “ఎవరైనా మొదటివాడిగా ఉండాలని కోరుకుంటే, అతడు అందరిలో చివరివాడిగా, అందరికీ సేవకుడిగా అవుతాడు.”'
  rationale: Only the rendering of ἔσται is revised, from an obligation (‘ఉండాలి’) to a future declarative (‘అవుతాడు’). All other wording is retained because it is faithful to the Greek and natural in modern standard Telugu.
