  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ καθίσας ἐφώνησεν τοὺς δώδεκα καὶ λέγει αὐτοῖς· Εἴ τις θέλει πρῶτος εἶναι ἔσται πάντων ἔσχατος καὶ πάντων διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/035.yaml
  text: And sitting down, he called the twelve and says to them, “If anyone wants to be first, he will be last of all and servant of all.”
translation:
  language: te
  text: 'ఆయన కూర్చుని, పన్నెండుమందిని పిలిచి వారితో ఇలా అంటాడు: “ఎవరైనా మొదటివాడిగా ఉండాలని కోరుకుంటే, అతడు అందరిలో చివరివాడిగా, అందరికీ సేవకుడిగా అవుతాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθίσας
  choice: కూర్చుని
  rationale: యూదా బోధనా సందర్భంలో కూర్చోవడం గమనించదగినదైనా, మూలంలోని సాధారణ క్రియారూపాన్ని సహజమైన తెలుగులో నేరుగా తెలిపింది.
- source_word: λέγει
  choice: ఇలా అంటాడు
  rationale: మూలంలోని చారిత్రక వర్తమాన కాలాన్ని నిలబెట్టి, ప్రత్యక్ష వాక్యాన్ని తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: πρῶτος
  choice: మొదటివాడిగా
  rationale: స్థానం లేదా ప్రాధాన్యంలో ‘మొదటి’ అనే విస్తృత భావాన్ని పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: ἔσχατος
  choice: చివరివాడిగా
  rationale: ‘మొదటి’కి ఉద్దేశపూర్వక వ్యతిరేకతను స్పష్టంగా నిలుపుతుంది.
- source_word: διάκονος
  choice: సేవకుడిగా
  rationale: ఇక్కడ సాధారణంగా ఇతరులకు సేవచేసే వ్యక్తిని సూచిస్తుంది; తరువాతి సంఘపదవిని సూచించే సాంకేతిక పదంగా మార్చలేదు.
theological_decisions:
- issue: ἔσται యొక్క భావబలం
  choice: ఉండాలి
  alternative: అవుతాడు / ఉంటాడు
  rationale: సందర్భంలోని శిష్యత్వ బోధనను సహజమైన తెలుగులో ఆజ్ఞాత్మక ఫలితంగా వ్యక్తం చేస్తుంది; అయినా గ్రీకు భవిష్యత్ రూపంలో ప్రకటనాత్మక ఛాయ కూడా ఉండవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘పన్నెండుమంది’ శిష్యుల ప్రత్యేక వర్గాన్ని సహజంగా సూచిస్తుంది; ‘అందరిలో… అందరికీ…’ అనే పునరుక్తి మూలంలోని πάντων… πάντων బలాన్ని నిలుపుతుంది.
