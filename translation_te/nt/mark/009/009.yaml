id: MRK.9.9
reference: Mark 9:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂Καὶ καταβαινόντων⸃ αὐτῶν ⸀ἐκ τοῦ ὄρους διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸂ἃ εἶδον διηγήσωνται⸃, εἰ μὴ ὅταν ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ἀναστῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/009.yaml
  text: And as they were coming down from the mountain[a], he ordered them to tell no one what they had seen[b], except when the Son of Man had risen from among the dead.
translation:
  language: te
  text: వారు కొండనుండి దిగుతూ ఉండగా, మనుష్యకుమారుడు మృతులలోనుంచి లేచేంతవరకు వారు చూసిన సంగతులను ఎవరికీ చెప్పవద్దని ఆయన వారికి ఆజ్ఞాపించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταβαινόντων
  choice: దిగుతూ ఉండగా
  rationale: వర్తమాన కృదంతంతో కూడిన genitive absolute ప్రధాన క్రియతో సమకాలంలో కొనసాగుతున్న చర్యను సూచిస్తుంది; ఈ తెలుగు రూపం సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: ὄρους
  choice: కొండ
  rationale: ὄρος ఎత్తైన భూభాగాన్ని సూచిస్తుంది; ఆధునిక తెలుగు బైబిలు కథన శైలిలో ‘కొండ’ సహజంగా ఉండి రూపాంతర సంఘటన జరిగిన ప్రదేశానికి సరిపోతుంది.
- source_word: διεστείλατο
  choice: గట్టిగా ఆజ్ఞాపించాడు
  rationale: ఈ క్రియ బలమైన నిర్దేశం లేదా కట్టుదిట్టమైన ఆజ్ఞ భావాన్ని ఇస్తుంది; ‘గట్టిగా’ దాని తీవ్రతను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἵνα μηδενὶ
  choice: ఎవరికీ చెప్పవద్దని
  rationale: ఆజ్ఞలోని నిషేధాత్మక విషయాన్ని ఆధునిక తెలుగులో సహజమైన పరోక్ష వాక్య నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: ἃ εἶδον
  choice: తాము చూసినవాటిని
  rationale: నపుంసక బహువచన సంబంధవాచకాన్ని ‘చూసినవాటిని’ అని స్పష్టంగా అనువదించి, కర్తలవైపు తిరిగి సూచించేందుకు ‘తాము’ వాడబడింది.
- source_word: διηγήσωνται
  choice: చెప్పవద్దని
  rationale: వారు చూసిన విషయాన్ని వివరించడం లేదా తెలియజేయడం అనే భావాన్ని సందర్భానికి తగిన సరళమైన తెలుగులో అందిస్తుంది.
- source_word: εἰ μὴ ὅταν
  choice: లేచేంతవరకు
  rationale: అక్షరార్థంగా ‘తప్ప, ఎప్పుడైతే’ అనే నిర్మాణమైనప్పటికీ, ఆజ్ఞ అమలులో ఉండే కాలపరిమితిని తెలుగులో ‘వరకు’ సహజంగా, స్పష్టంగా తెలియజేస్తుంది; భావాన్ని అనవసరంగా విస్తరించదు.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: యేసు ఉపయోగించిన బిరుదును అనువదిస్తూ దాని దానియేలు గ్రంథ సంబంధ ప్రతిధ్వనిని, బిరుదాత్మక స్వభావాన్ని నిలుపుతుంది.
- source_word: ἐκ νεκρῶν
  choice: మృతులలోనుంచి
  rationale: కేవలం మరణస్థితినుంచి కాక, చనిపోయినవారి మధ్యనుంచి లేవడం అనే గ్రీకు పదబంధపు ఖచ్చితమైన భావాన్ని నిలుపుతుంది.
- source_word: ἀναστῇ
  choice: లేచే
  rationale: ὅταν తో వచ్చిన aorist subjunctive, ఆజ్ఞ ఇచ్చిన సమయానికి భవిష్యత్తులో జరిగే సంఘటనను సూచిస్తుంది; ‘లేచేంతవరకు’ తెలుగులో ఆ భవిష్యత్ కాలపరిమితిని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου అనువాదం
  choice: మనుష్య కుమారుడు
  alternative: మానవ కుమారుడు
  rationale: సంప్రదాయబద్ధమైనప్పటికీ అర్థవంతంగా ఉన్న ఈ రూపం బిరుదును, దాని గ్రంథాంతర ప్రతిధ్వనిని కాపాడుతుంది; దానిని సాధారణ మానవుణ్ణి సూచించే మాటగా కుదించదు.
- issue: εἰ μὴ ὅταν కాలార్థం
  choice: మనుష్య కుమారుడు ... లేచేంతవరకు
  alternative: మనుష్య కుమారుడు ... లేచినప్పుడు తప్ప
  rationale: గ్రీకు నిర్మాణానికి ‘లేచినప్పుడు తప్ప’ మరింత రూపసామ్యం కలిగినా, నిషేధ ఆజ్ఞ యొక్క కాలపరిమితి తెలుగులో ‘లేచేంతవరకు’ ద్వారా స్పష్టంగా, సహజంగా వ్యక్తమవుతుంది; మూలంలోని ఉద్దేశాన్ని సిద్ధాంతపరంగా అధికంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళంగా, అయితే బైబిలు కథనానికి తగిన గౌరవప్రద శైలిలో రూపొందించబడింది. మూలంలోని ‘మృతులలోనుంచి’ అనే సూక్ష్మతను ప్రధాన పాఠ్యంలోనే ఉంచినందున పాదటిప్పణి అవసరం లేదు.
