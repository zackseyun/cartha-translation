revisions:
- from: వారు కొండ మీదనుంచి దిగుతూ ఉండగా, తాము చూసినవాటిని మనుష్య కుమారుడు మృతులలోనుంచి లేచేంతవరకు ఎవరికీ చెప్పవద్దని ఆయన వారికి గట్టిగా ఆజ్ఞాపించాడు.
  to: వారు కొండనుండి దిగుతూ ఉండగా, మనుష్యకుమారుడు మృతులలోనుంచి లేచేంతవరకు వారు చూసిన సంగతులను ఎవరికీ చెప్పవద్దని ఆయన వారికి ఆజ్ఞాపించాడు.
  rationale: The revision preserves all source elements and the temporal restriction while improving modern Telugu idiom. It uses the established compound form for the title ‘Son of Man,’ avoids introducing an implication of loud speech, and expresses the reported content naturally. No footnote is required because the main text already retains the ‘from among the dead’ nuance, and the temporal alternative does not need to be supplied in this concise verse translation.
  reviewer_model: gpt-5.6-terra
