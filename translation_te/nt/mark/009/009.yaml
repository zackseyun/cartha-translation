review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the descent, the prohibition against telling anyone, the content of what was seen, and the temporal limit tied to the Son of Man's rising from among the dead. ‘లేచేంతవరకు’ is an idiomatic Telugu rendering of the practical force of εἰ μὴ ὅταν in this command.
  naturalness: The sentence is generally natural modern Telugu. Replacing ‘కొండ మీదనుంచి’ with ‘కొండనుండి’ is slightly cleaner, and ‘చూసిన సంగతులను’ better suits a reported vision/event than the more object-like ‘చూసినవాటిని.’ ‘గట్టిగా’ can suggest speaking loudly rather than issuing a firm directive.
  terminology: ‘మనుష్య కుమారుడు’ should be written as the established titular compound ‘మనుష్యకుమారుడు,’ preserving its recognizable biblical-title force and avoiding an unnecessarily generic reading. ‘మృతులలోనుంచి’ appropriately reflects ἐκ νεκρῶν.
  issues:
  - severity: medium
    issue: Title formatting and idiomatic force of ‘మనుష్య కుమారుడు’
    rationale: As two separate words it can be read more readily as a descriptive phrase. ‘మనుష్యకుమారుడు’ is the conventional, clear Telugu rendering of this titular expression.
  - severity: low
    issue: ‘గట్టిగా ఆజ్ఞాపించాడు’ may imply volume of speech
    rationale: The Greek verb conveys a directive/charge, not necessarily that it was spoken loudly. ‘ఆజ్ఞాపించాడు’ retains the command force without adding that nuance.
  - severity: low
    issue: ‘చూసినవాటిని’ is somewhat concrete in this context
    rationale: The relative plural refers broadly to what they saw; ‘చూసిన సంగతులను’ is natural Telugu for the disclosed vision or events.
  revised_text: వారు కొండనుండి దిగుతూ ఉండగా, మనుష్యకుమారుడు మృతులలోనుంచి లేచేంతవరకు వారు చూసిన సంగతులను ఎవరికీ చెప్పవద్దని ఆయన వారికి ఆజ్ఞాపించాడు.
  revised_footnotes: []
