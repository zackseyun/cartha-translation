source:
  edition: SBLGNT
  text: καὶ ⸂κράξας καὶ πολλὰ σπαράξας⸃ ἐξῆλθεν· καὶ ἐγένετο ὡσεὶ νεκρὸς ὥστε ⸀τοὺς πολλοὺς λέγειν ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/026.yaml
  text: And after crying out and convulsing him greatly[a], it came out; and he became like a dead man, so that many were saying[b], “He is dead.”
translation:
  language: te
  text: ఆ అపవిత్రాత్మ కేక వేసి, బాలుణ్ణి తీవ్రంగా కుదిపి[a], అతనిలోనుంచి బయటికి వచ్చింది. అప్పుడు అతడు చనిపోయినవాడిలా అయ్యాడు[b]. అందువల్ల చాలామంది, “అతడు చనిపోయాడు” అని చెప్పసాగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బాలుణ్ణి తీవ్రమైన కుదుపులకు గురిచేసి.”
    reason: lexical_alternative
  - marker: b
    text: 'గ్రీకు భావం: “చనిపోయినవాడిలా అయ్యాడు”; అంటే చూసేవారికి అతడు చనిపోయినట్లు కనిపించాడు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας
  choice: కేక వేసి
  rationale: అపవిత్రాత్మ చేసిన చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది; కేక స్వరాన్ని ‘భయంకరంగా’ లేదా ‘బిగ్గరగా’ అని మూలంలో లేనంతగా నిర్దిష్టం చేయదు.
- source_word: πολλὰ σπαράξας
  choice: బాలుణ్ణి తీవ్రంగా విలవిలలాడించి
  rationale: భూతవిమోచన సందర్భంలో σπαράσσω శరీరాన్ని తీవ్రమైన మూర్ఛలు లేదా కుదుపులకు గురిచేయడాన్ని సూచిస్తుంది; πολλὰ యొక్క తీవ్రతను ‘తీవ్రంగా’ తెలియజేస్తుంది. సందర్భం నుంచి కర్మ అయిన బాలుణ్ణి స్పష్టంగా పేర్కొంది.
- source_word: ἐξῆλθεν
  choice: అతనిలోనుంచి బయటికి వచ్చింది
  rationale: సందర్భంలో కర్త అపవిత్రాత్మ. తెలుగులో సహజంగా ఉండేందుకు అది ఎవరినుంచి బయటికి వచ్చిందో సందర్భానుసారంగా స్పష్టం చేయబడింది.
- source_word: ἐγένετο ὡσεὶ νεκρός
  choice: అతడు చనిపోయినవాడిలా అయ్యాడు
  rationale: ὡσεὶ లోని పోలికను కాపాడి, బాలుడు నిజంగా చనిపోయాడని కథకుడు నిర్ధారించినట్లు చెప్పకుండా అతని కనిపించిన స్థితిని వ్యక్తపరుస్తుంది.
- source_word: ὥστε τοὺς πολλοὺς λέγειν
  choice: అందువల్ల చాలామంది … అంటూ ఉన్నారు
  rationale: τοὺς πολλούς ను ‘చాలామంది’గా, λέγειν లోని కొనసాగుతున్న సమూహ స్పందనను ‘అంటూ ఉన్నారు’గా సహజంగా అందిస్తుంది.
- source_word: ὅτι ἀπέθανεν
  choice: “అతడు చనిపోయాడు”
  rationale: చూసినవారు అప్పటికప్పుడు చేసిన నిర్ధారణను తెలుగులో సహజమైన ప్రత్యక్ష ఉక్తిగా అందిస్తుంది; ఇది కథకుని స్వంత నిర్ధారణ కాదు.
theological_decisions:
- issue: బాలుడు నిజంగా చనిపోయాడా, లేక చనిపోయినవాడిలా కనిపించాడా
  choice: కథకుడు బాలుడు చనిపోయినవాడిలా అయ్యాడని చెబుతాడు; అతడు చనిపోయాడన్నది అక్కడున్న చాలామంది చేసిన వ్యాఖ్యగా ఉంచబడింది.
  alternative: బాలుడు నిజంగా కొంతసేపు చనిపోయాడని అనువదించడం.
  rationale: ὡσεὶ (‘వలె/లాగా’) పోలికను సూచిస్తుంది; ἀπέθανεν అనేది జనసమూహపు మాటలో ఉంది. కాబట్టి మూలపాఠం చెప్పేదానికంటే ముందుకు వెళ్లి మరణాన్ని లేదా పునరుత్థానాన్ని నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘అపవిత్రాత్మ’ను సందర్భం నుంచి స్పష్టంగా చేర్చి, అస్పష్ట సర్వనామాన్ని నివారించాం; ‘చనిపోయినవాడిలా’ అనే పోలిక ద్వారా మూలంలోని ఉద్దేశపూర్వక భేదాన్ని నిలిపాం.
