  terminology: “మృతులలోనుండి లేవడం” is a natural, suitably literal rendering of τὸ ἐκ νεκρῶν ἀναστῆναι. It preserves the resurrection language without supplying doctrinal explanation. “ఆ మాట” appropriately represents τὸν λόγον in context.
