source:
  edition: SBLGNT
  text: καὶ τὸν λόγον ἐκράτησαν πρὸς ἑαυτοὺς συζητοῦντες τί ἐστιν τὸ ἐκ νεκρῶν ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/010.yaml
  text: And they kept the matter to themselves[b][a], discussing what it meant to rise from the dead.
translation:
  language: te
  text: వారు ఆ మాటను తమలోనే ఉంచుకొని, “మృతులలోనుండి లేవడం” అంటే ఏమిటో చర్చించుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మృతుల మధ్యనుండి లేవడం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν λόγον
  choice: ఆ మాటను
  rationale: ఇది 9వ వచనంలో యేసు చెప్పిన మాటను సూచిస్తుంది. ‘ఆ మాట’ అనేది λόγος యొక్క సందర్భానుగుణ భావాన్ని సహజంగా, స్పష్టంగా అందిస్తుంది.
- source_word: ἐκράτησαν
  choice: ఉంచుకొని
  rationale: πρὸς ἑαυτούς‌తో కలిసి ఇది ఆ మాటను తమ పరిధిలోనే ఉంచుకున్నారనే భావాన్ని ఇస్తుంది.
- source_word: πρὸς ἑαυτοὺς
  choice: తమలోనే
  rationale: వారు ఆ మాటను ఇతరులకు చెప్పకుండా తమ మధ్యనే ఉంచుకున్నారనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: συζητοῦντες
  choice: తమలో తాము చర్చించుకున్నారు
  rationale: శిష్యులు అయోమయంతో పరస్పరం ఆలోచించి మాట్లాడుకున్న భావాన్ని ఇస్తుంది; ‘వాదించుకున్నారు’ అని అనవసరంగా ఘర్షణను సూచించదు.
- source_word: τί ἐστιν
  choice: అంటే ఏమిటో
  rationale: అక్షరార్థంగా ‘అది ఏమిటి’ అయినా, ఇక్కడ వారు ఆ పదబంధం భావాన్ని తెలుసుకోవడానికి ప్రయత్నిస్తున్నందున ఈ రూపం సహజంగా ఉంటుంది.
- source_word: τὸ ἐκ νεκρῶν ἀναστῆναι
  choice: చనిపోయినవారిలో నుండి లేవడం
  rationale: ἐκ νεκρῶνలోని ‘చనిపోయినవారి మధ్య నుండి’ అనే భావాన్ని నిలుపుతూ, పునరుత్థానాన్ని సూచించే మూలపాఠపు నిర్మాణాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: శిష్యుల చర్చలోని పునరుత్థాన భాష
  choice: చనిపోయినవారిలో నుండి లేవడం
  alternative: మృతులలో నుండి తిరిగి లేవడం
  rationale: శిష్యుల అయోమయాన్ని తరువాతి సిద్ధాంత వివరణలతో పరిష్కరించకుండా, మూలపాఠంలోని పునరుత్థాన భావాన్నీ ‘మృతుల మధ్య నుండి’ అనే ప్రత్యేకతనూ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘ఆ మాట’ ముందటి వచనంలోని యేసు ఆదేశాన్ని సూచిస్తుంది; ఉద్ధరణ చిహ్నాలు శిష్యులు చర్చించిన పదబంధాన్ని స్పష్టంగా చూపిస్తాయి.
