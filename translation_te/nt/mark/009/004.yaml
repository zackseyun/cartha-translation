  yaml_path: translation/nt/mark/009/004.yaml
  text: And Elijah appeared to them with Moses[a], and they were talking with Jesus.
translation:
  language: te
  text: ఏలీయా మోషేతో కలిసి వారికి కనిపించాడు; వారిద్దరూ యేసుతో మాట్లాడుకుంటూ ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: కనిపించాడు
  rationale: ὁράω యొక్క ఈ నిష్క్రియ రూపం సందర్భంలో ‘ప్రత్యక్షమయ్యాడు’ లేదా ‘కనిపించాడు’ అనే భావాన్ని ఇస్తుంది. సహజమైన ఆధునిక తెలుగులో ఆకస్మికంగా వారికి కనబడిన ఘటనను ‘కనిపించాడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: ఏలీయా ఎవరికి కనిపించాడో తెలిపే దత్తివిభక్తి సర్వనామానికి నేరమైన తెలుగు రూపం.
- source_word: Ἠλίας
  choice: ఏలీయా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: σὺν Μωϋσεῖ
  choice: మోషేతో కలిసి
  rationale: σύν సహవాసాన్ని సూచిస్తుంది. ‘తో కలిసి’ అనే రూపం ఏలీయా మోషేతో ఉన్నాడనే భావాన్ని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: συλλαλοῦντες
  choice: మాట్లాడుతున్నారు
  rationale: ఈ క్రియ పరస్పరం సంభాషించడాన్ని సూచిస్తుంది. బహువచన కర్తతో ‘యేసుతో మాట్లాడుతున్నారు’ అనడం ఆ పరస్పర భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: τῷ Ἰησοῦ
  choice: యేసుతో
  rationale: συλλαλέωలో అంతర్లీనమైన పరస్పర సంభాషణ భావం వల్ల దత్తివిభక్తిని ‘యేసుతో’ అని అనువదించడం తెలుగులో సరైనది.
theological_decisions:
- issue: రూపాంతర ఘటనలో ఏలీయా, మోషేల గుర్తింపు మరియు వారి ప్రత్యక్షత యొక్క వాస్తవికత
  choice: ఏలీయా మోషేతో కలిసి కనిపించి, వారిద్దరూ యేసుతో మాట్లాడినట్లు వాక్యాన్ని నేరుగా అనువదించడం.
  alternative: దీనిని కేవలం దర్శనాత్మక ప్రత్యక్షతగా లేదా వ్యక్తిగత ప్రత్యక్షత కాని సంకేతాత్మక ప్రతినిధిత్వంగా వివరించడం.
  rationale: గ్రీకు కథనం ఏలీయా, మోషే కనిపించి యేసుతో సంభాషించినట్లు చెబుతుంది. అనువాదం ఈ వర్ణనను బలహీనపరచకూడదు; అలాగే మూలపాఠానికి మించిన సిద్ధాంత వివరణను చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే గౌరవప్రదమైన కథనశైలిలో ఉంచబడింది. గ్రీకులోని రెండవ καίను తెలుగులో సహజమైన వాక్యసంధి కోసం అర్థవిరామంతో వ్యక్తం చేసి, బహువచన కర్తను స్పష్టం చేయడానికి ‘వారిద్దరూ’ ఉపయోగించబడింది.
