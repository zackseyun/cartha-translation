id: MRK.9.41
reference: Mark 9:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὃς γὰρ ἂν ποτίσῃ ὑμᾶς ποτήριον ὕδατος ἐν ⸀ὀνόματι ὅτι χριστοῦ ἐστε, ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ ⸀ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/041.yaml
  text: For whoever gives you a cup of water to drink in the name that you are Messiah's[a], truly I say to you, he will certainly not lose his reward.
translation:
  language: te
  text: ఎందుకంటే, మీరు మెస్సీయకు చెందినవారన్న పేరున మీకు తాగడానికి ఒక గిన్నెడు నీళ్లు ఇచ్చేవాడు ఎవడైనా తన ప్రతిఫలాన్ని ఎంతమాత్రమూ కోల్పోడని మీతో నిజంగా చెబుతున్నాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὃς γὰρ ἂν
  choice: ఎందుకంటే, ... ఎవడైనా
  rationale: γάρను ముందరి బోధతో సంబంధం చూపే ‘ఎందుకంటే’గా, అనిర్దిష్ట సంబంధవాచక నిర్మాణాన్ని సహజమైన తెలుగులో ‘ఎవడైనా’గా అందించింది.
- source_word: ποτίσῃ ὑμᾶς ποτήριον ὕδατος
  choice: మీకు ఒక గిన్నెడు నీళ్లు తాగడానికి ఇచ్చేవాడు
  rationale: ‘తాగడానికి ఇవ్వడం’ అనే ποτίζω భావాన్ని, పరిమాణాన్ని సూచించే ποτήριον ὕδατοςను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν ὀνόματι ὅτι χριστοῦ ἐστε
  choice: మీరు మెస్సీయకు చెందినవారు అనే కారణంతో
  rationale: ἐν ὀνόματι మరియు దానిని వివరిస్తున్న ὅτι వాక్యభాగం కలిసి సూచించే గుర్తింపు/సంబంధ కారణాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది; గ్రీకులో లేని ‘నా’ అనే పదాన్ని చేర్చదు.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: మీతో నిజంగా చెబుతున్నాను
  rationale: యేసు పలికే గంభీర నిశ్చయోక్తిని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: ఎంతమాత్రమూ కోల్పోడు
  rationale: οὐ μή అనే బలమైన నిరాకరణను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: తన ప్రతిఫలాన్ని
  rationale: నైతిక, అంత్యకాలిక సందర్భంలో μισθόςకు ‘ప్రతిఫలం’ సహజమైన సమానార్థకం.
theological_decisions:
- issue: Χριστόςను స్వామ్య సంబంధ నిర్మాణంలో అనువదించడం
  choice: మెస్సీయకు చెందినవారు
  alternative: క్రీస్తుకు చెందినవారు
  rationale: ఇక్కడ Χριστός యేసు బిరుదుగా పనిచేస్తుంది; ‘మెస్సీయ’ అభిషిక్తుడనే బిరుదు భావాన్ని నిలుపుతుంది. ‘చెందినవారు’ అనే రూపం χριστοῦ ἐστεలోని స్వామ్య/సంబంధ భావాన్ని సహజంగా తెలియజేస్తుంది.
- issue: ἐν ὀνόματιకు వ్యక్తిని సూచించే స్వామ్యపదం చేర్చాలా
  choice: ‘అనే కారణంతో’ అని సందర్భానుసారంగా వ్యక్తీకరించడం; ‘నా’ను చేర్చకపోవడం
  alternative: నా పేరున
  rationale: SBLGNT పాఠంలో ἐν ὀνόματι తరువాత ‘నా’ లేదు; ὅτι χριστοῦ ἐστε ఆ చర్యకు కారణం లేదా గుర్తింపు ఆధారాన్ని తెలుపుతుంది. అందువల్ల గ్రీకులో లేని స్వామ్యపదాన్ని చేర్చకుండా భావాన్ని సహజ తెలుగులో అందించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే యేసు నిశ్చయోక్తికి తగిన గంభీరతతో. మూలంలోని బలమైన నిరాకరణను ‘ఎంతమాత్రమూ ... కోల్పోడు’గా నిలిపింది.
