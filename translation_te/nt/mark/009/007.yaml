id: MRK.9.7
reference: Mark 9:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐγένετο νεφέλη ἐπισκιάζουσα αὐτοῖς, καὶ ⸀ἐγένετο φωνὴ ἐκ τῆς νεφέλης· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/007.yaml
  text: 'And a cloud came[a], overshadowing them, and a voice came out of the cloud: “This is my beloved Son; listen to him.”'
translation:
  language: te
  text: 'అప్పుడు ఒక మేఘం వచ్చి వారిని కమ్ముకుంది. ఆ మేఘంలోనుండి ఒక స్వరం వినిపించింది: “ఈయన నా ప్రియ కుమారుడు; ఈయన మాట వినండి[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈయన చెప్పేది ఆలకించండి.” ఇక్కడ “వినండి” అంటే కేవలం ధ్వని వినడం కాక, శ్రద్ధగా విని లక్ష్యపెట్టడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο νεφέλη
  choice: ఒక మేఘం వచ్చింది
  rationale: γίνομαι ఇక్కడ మేఘం అకస్మాత్తుగా రావడాన్ని సూచిస్తుంది. ‘వచ్చింది’ సంఘటనాత్మక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐπισκιάζουσα αὐτοῖς
  choice: వారిని కమ్ముకుంది
  rationale: మేఘం వారిపై నీడ వేసి వారిని ఆవరించిన భావాన్ని ‘కమ్ముకుంది’ సహజంగా వ్యక్తపరుస్తుంది; దైవసన్నిధి అనే వివరణను పాఠ్యంలో అదనంగా చేర్చదు.
- source_word: φωνὴ ἐκ τῆς νεφέλης
  choice: ఆ మేఘంలోనుండి ఒక స్వరం వినిపించింది
  rationale: φωνή ఇక్కడ అర్థవంతమైన పలుకును తెలిపే ‘స్వరం.’ ἐκ యొక్క లోపలినుండి వెలువడే భావాన్ని ‘మేఘంలోనుండి’ నిలుపుతుంది; ‘వినిపించింది’ తెలుగులో స్వరం ఉద్భవించిన సంఘటనను సహజంగా తెలియజేస్తుంది.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: నా ప్రియ కుమారుడు
  rationale: ‘ప్రియ’ ἀγαπητός లోని ప్రేమింపబడినవాడు అనే భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా అందిస్తుంది; ‘కుమారుడు’ υἱός కు నేర అనువాదం.
- source_word: ἀκούετε αὐτοῦ
  choice: ఈయన మాట వినండి
  rationale: తెలుగులో ‘మాట వినండి’ అనేది కేవలం ధ్వని వినడం కాక శ్రద్ధగా ఆలకించి ప్రాముఖ్యత ఇవ్వడాన్ని సూచిస్తుంది. ‘లోబడండి’ అని అనువదిస్తే మూలంలోని విస్తృత భావం అనవసరంగా ఒకే అర్థానికి పరిమితమవుతుంది.
theological_decisions:
- issue: యేసు గుర్తింపుపై దైవ ప్రకటన
  choice: “ఈయన నా ప్రియ కుమారుడు”
  alternative: వివరణాత్మకంగా క్రీస్తు సంబంధ సిద్ధాంత పదాలను చేర్చడం
  rationale: గ్రీకు పాఠ్యం యేసును దేవుని కుమారునిగా నేరుగా ప్రకటిస్తుంది. అనువాదం ఆ ప్రకటనను నిలుపుతూ పాఠ్యంలో లేని సిద్ధాంత వివరణను జోడించదు.
- issue: ἀκούετε αὐτοῦ ఆజ్ఞ యొక్క భావపరిధి
  choice: “ఈయన మాట వినండి”
  alternative: “ఈయనకు లోబడండి” లేదా “ఈయనను వినండి”
  rationale: ఈ ఆజ్ఞ శ్రద్ధగా విని లక్ష్యపెట్టే భావాన్ని కలిగి ఉంది. ‘మాట వినండి’ ఆ స్పందనాత్మక బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ‘లోబడండి’ అని మాత్రమే చెప్పి భావాన్ని సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘కమ్ముకుంది,’ ‘స్వరం వినిపించింది,’ ‘మాట వినండి’ వంటి సహజ ప్రయోగాలతో మూలంలోని దృశ్యాన్ని, ఆజ్ఞ బలాన్ని నిలిపాం.
