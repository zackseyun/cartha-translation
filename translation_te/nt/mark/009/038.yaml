id: MRK.9.38
reference: Mark 9:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂Ἔφη αὐτῷ ὁ Ἰωάννης⸃· Διδάσκαλε, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, ⸂καὶ ἐκωλύομεν αὐτόν, ὅτι οὐκ ἠκολούθει ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/038.yaml
  text: John said to him[a], “Teacher, we saw someone casting out demons in your name, and we tried to stop him because he was not following us.”
translation:
  language: te
  text: 'యోహాను ఆయనతో ఇలా అన్నాడు: “బోధకుడా, నీ పేరట దయ్యాలను వెళ్లగొడుతున్న ఒక వ్యక్తిని మేము చూశాం. అతడు మమ్మల్ని అనుసరించకపోవడం వల్ల, మేము అతన్ని అడ్డుకోవడానికి ప్రయత్నించాం[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మేము అతన్ని అడ్డుకుంటూ ఉన్నాం.” గ్రీకు అసంపూర్ణ భూతకాల రూపం పదేపదే జరిగిన లేదా ప్రయత్నించిన చర్యను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔφη αὐτῷ ὁ Ἰωάννης
  choice: యోహాను ఆయనతో ఇలా అన్నాడు
  rationale: సాధారణ కథన భూతకాలాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, కర్తయైన యోహానును మరియు పరోక్ష కర్మను స్పష్టంగా నిలుపుతుంది.
- source_word: Διδάσκαλε
  choice: బోధకుడా
  rationale: διδάσκαλος యొక్క ప్రత్యక్ష అర్థమైన ‘బోధకుడు/ఉపాధ్యాయుడు’ను గౌరవసూచక సంబోధనగా అందిస్తుంది; ‘గురువా’ కంటే మూలపదానికి దగ్గరగా ఉంది.
- source_word: εἴδομέν τινα
  choice: ఒక వ్యక్తిని మేము చూశాం
  rationale: τινα అనిర్దిష్టమైన వ్యక్తిని సూచిస్తుంది; తెలుగులో సహజంగా ఉండేందుకు ‘ఒక వ్యక్తి’ అని అనువదించబడింది.
- source_word: ἐν τῷ ὀνόματί σου
  choice: నీ పేరట
  rationale: యేసు పేరు మరియు అధికారాన్ని ఆధారంగా చేసుకొని చేసిన కార్యమనే బైబిలు నుడికారాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: దయ్యాలను వెళ్లగొడుతున్న
  rationale: ἐκβάλλω యొక్క బలమైన బయటకు పంపే భావాన్ని, సువార్తల సందర్భానికి తగిన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καὶ ἐκωλύομεν αὐτόν
  choice: మేము అతన్ని అడ్డుకోవడానికి ప్రయత్నించాం
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగిన లేదా ప్రయత్నించిన చర్యను సూచించగలదు; ఈ పాఠ్యంలో ‘ప్రయత్నించాం’ ఆ సూక్ష్మతను సహజంగా తెలియజేస్తుంది.
- source_word: ὅτι οὐκ ἠκολούθει ἡμῖν
  choice: అతడు మమ్మల్ని అనుసరించకపోవడం వల్ల
  rationale: ἡμῖν‌ను నేరుగా ‘మమ్మల్ని’గా నిలుపుతూ, యోహాను సమస్యను శిష్యుల గుంపుతో అనుబంధం పరంగా చెప్పిన కథన ఉద్వేగాన్ని కాపాడుతుంది.
theological_decisions:
- issue: చివరి ఉపవాక్యంలో ఆ వ్యక్తి ఎవరిని అనుసరించలేదనే సూచన
  choice: మమ్మల్ని అనుసరించకపోవడం వల్ల
  alternative: నిన్ను అనుసరించకపోవడం వల్ల; మాలో ఒకడు కాకపోవడం వల్ల
  rationale: గ్రీకు పాఠ్యంలో స్పష్టంగా ἡμῖν (‘మాకు/మమ్మల్ని’) ఉంది. దాన్ని ‘నిన్ను’గా మార్చడం లేదా గుంపు సభ్యత్వంగా వ్యాఖ్యానించడం మూలంలోని కథన ఉద్వేగాన్ని ముందుగానే పరిష్కరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘నీ పేరట’ అనే బైబిలు నుడికారాన్ని, అలాగే ‘మమ్మల్ని’ అనే మూలపాఠ్యంలోని స్పష్టమైన గుంపు-కేంద్రిత భాషను నిలుపుకున్నాం.
