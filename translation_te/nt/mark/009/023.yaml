id: MRK.9.23
reference: Mark 9:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τὸ Εἰ ⸀δύνῃ, πάντα δυνατὰ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/023.yaml
  text: But Jesus said to him[b][a], “ ‘If you can’? All things are possible for the one who believes.”
translation:
  language: te
  text: యేసు అతనితో, “‘చేయగలిగితే’నా?”[a] అని అన్నాడు. “అన్నీ నమ్మేవానికి సాధ్యమే.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ఆ ‘చేయగలిగితే’ ఏమిటి?” యేసు తండ్రి ముందటి వచనంలో పలికిన మాటను తిరిగి ప్రస్తావిస్తూ దానిని సవాలు చేస్తున్నాడు.
    reason: lexical_alternative
  - marker: b
    text: “నమ్మేవానికి” అనే మాటను “విశ్వసించేవానికి” లేదా “నమ్మకం ఉంచేవానికి” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Τὸ Εἰ δύνῃ
  choice: ‘చేయగలిగితే’ అంటున్నావా?
  rationale: నపుంసకలింగ నిర్దేశక పదం Τὸ, తండ్రి పలికిన మాటలను యేసు సూటిగా తిరిగి ప్రస్తావించి సవాలు చేస్తున్నట్లు సూచిస్తుంది. తెలుగులో ఉద్ధరణతో కూడిన ఈ ప్రశ్న ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: δύνῃ
  choice: చేయగలిగితే
  rationale: δύναμαι అంటే ‘సామర్థ్యం కలిగి ఉండు/చేయగలుగు.’ ముందటి వచనంలోని తండ్రి మాటను ప్రతిధ్వనించేలా షరతురూపం ఉంచబడింది.
- source_word: πάντα
  choice: అన్నీ
  rationale: నపుంసక బహువచనమైన πάντα యొక్క సమగ్రతను సహజమైన ఆధునిక తెలుగులో ‘అన్నీ’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: δυνατὰ
  choice: సాధ్యమే
  rationale: ఈ విధేయ నిర్మాణంలో δυνατά అంటే ‘సాధ్యమైనవి.’ ‘సాధ్యమే’ గ్రీకు వాక్యంలోని బలమైన ఉద్ఘాటనను తెలుగులో నిలుపుతుంది.
- source_word: τῷ πιστεύοντι
  choice: నమ్మేవారికి
  rationale: వర్తమాన కృదంతం సాధారణంగా నమ్మే వ్యక్తిని సూచిస్తుంది. ‘నమ్మేవారికి’ అనేది వ్యక్తి లింగాన్ని పరిమితం చేయకుండా కృదంత భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: πιστεύοντι
  choice: నమ్మేవారికి
  rationale: πιστεύω యొక్క ప్రాథమిక భావం నమ్మడం; సందర్భానుసారంగా విశ్వసించడం లేదా నమ్మకం ఉంచడం అనే ఛాయలూ ఉండవచ్చు.
theological_decisions:
- issue: ‘అన్నీ సాధ్యమే’ అనే మాట యొక్క పరిధి
  choice: మూలంలో ఉన్న సంపూర్ణంగా వినిపించే ప్రకటనను ప్రధాన పాఠ్యంలో ఎలాంటి వివరణాత్మక పరిమితి చేర్చకుండా ఉంచడం.
  alternative: ‘దేవునివల్ల నమ్మేవారికి అన్నీ సాధ్యమే’ అని సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో స్పష్టీకరించడం.
  rationale: గ్రీకు వాక్యంలో ఇక్కడ ‘దేవునివల్ల’ అనే పదాలు లేవు. అందువల్ల వాక్యపు అలంకార బలాన్నీ, దానిలోని నిజమైన దైవశాస్త్రీయ ఉద్వేగాన్నీ అనువాదం స్వయంగా పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ. ‘అంటున్నావా?’ అనేది గ్రీకులోని ఉద్ధృత పునరుక్తి భావాన్ని తెలియజేస్తుంది; ‘అన్నీ సాధ్యమే’ మూలంలోని సంక్షిప్తతను, బలాన్ని కాపాడుతుంది.
