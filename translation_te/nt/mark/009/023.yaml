- from: అప్పుడు యేసు అతనితో, “ ‘చేయగలిగితే’ అంటున్నావా?[a] నమ్మేవారికి అన్నీ సాధ్యమే”[b] అన్నాడు.
  to: యేసు అతనితో, “‘చేయగలిగితే’నా?”[a] అని అన్నాడు. “అన్నీ నమ్మేవానికి సాధ్యమే.”[b]
