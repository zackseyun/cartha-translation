  yaml_path: translation/nt/mark/009/016.yaml
  text: And he asked them[a], “What are you discussing with one another?”
translation:
  language: te
  text: ఆయన వారిని, “మీరు ఒకరితో ఒకరు దేని గురించి చర్చిస్తున్నారు[a]?” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు ఒకరితో ఒకరు దేని గురించి వాదిస్తున్నారు?” సందర్భాన్ని బట్టి ఈ క్రియకు చర్చ లేదా వాదోపవాదం అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: అడిగాడు
  rationale: ప్రత్యక్ష ప్రశ్నను పరిచయం చేసే సాధారణ కథన సందర్భంలో సహజమైన ఆధునిక తెలుగు పదం.
- source_word: αὐτούς
  choice: వారిని
  rationale: గ్రీకు సర్వనామం ఎవరిని సూచిస్తుందో ఈ వచనంలో ప్రత్యేకంగా చెప్పలేదు; ‘వారిని’ ఆ అస్పష్టతను నిలుపుతుంది.
- source_word: Τί
  choice: దేని గురించి
  rationale: ఇక్కడ ప్రశ్న చర్చకు కారణాన్ని కాకుండా దాని విషయాన్ని అడుగుతోంది; తెలుగులో ‘దేని గురించి’ సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: συζητεῖτε
  choice: చర్చిస్తున్నారు
  rationale: ఈ క్రియ చర్చ, వాదోపవాదం లేదా వివాదాన్ని సూచించగలదు. ప్రధాన పాఠంలో తటస్థమైన విస్తృత భావాన్ని నిలుపుతూ, వివాదార్థాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: πρὸς αὑτούς
  choice: ఒకరితో ఒకరు
  rationale: పాఠంలో కనిపించే పరస్పర సంబంధ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: καὶ
  choice: అప్పుడు
  rationale: తెలుగు కథన ప్రవాహంలో ముందు జరిగిన సంఘటనతో అనుసంధానాన్ని సహజంగా చూపిస్తుంది; అదనపు బలమైన కాలార్థాన్ని చేర్చదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. సర్వనామ సూచనలోని అస్పష్టతను అలాగే ఉంచి, συζητεῖτε లోని వివాదార్థ అవకాశాన్ని పాదసూచికలో భద్రపరచింది.
