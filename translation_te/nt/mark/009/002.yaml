id: MRK.9.2
reference: Mark 9:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ μετὰ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ τὸν Ἰάκωβον ⸀καὶ Ἰωάννην, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν μόνους. καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/002.yaml
  text: And after six days[a], Jesus takes Peter and James and John, and brings them up onto a high mountain by themselves. And he was transfigured before them[c][b],
translation:
  language: te
  text: ఆరు రోజుల తర్వాత[a] యేసు పేతురును, యాకోబును, యోహానును తనతో తీసుకొని, వారినే విడిగా ఒక ఎత్తైన కొండపైకి తీసుకెళ్లాడు. వారి ఎదుట ఆయన రూపాంతరం చెందాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆరు రోజులు గడిచిన తరువాత.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారి ఎదుట ఆయన రూపం మారిపోయింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ἡμέρας ἓξ
  choice: ఆరు రోజుల తర్వాత
  rationale: కాలక్రమంలో ఆరు రోజులు గడిచిన తరువాత అని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; మరింత పదానుసారమైన రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: παραλαμβάνει
  choice: తనతో తీసుకొని
  rationale: శిష్యులను వెంట తీసుకెళ్లడమనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది. మార్కు ఉపయోగించిన చారిత్రక వర్తమాన కాలం తెలుగులో సహజ కథన శైలికోసం భూతకాలంగా అనువదించబడింది.
- source_word: ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν
  choice: ఒక ఎత్తైన కొండపైకి తీసుకెళ్లాడు
  rationale: పైకి వెళ్లే కదలికను, గమ్యస్థానాన్ని సహజమైన తెలుగు ప్రయోగంలో కలిపి వ్యక్తం చేస్తుంది.
- source_word: κατ’ ἰδίαν μόνους
  choice: వారిని మాత్రమే ప్రత్యేకంగా
  rationale: μόνους లోని ‘వారిని మాత్రమే’ అనే పరిమితినీ, κατ’ ἰδίαν లోని ఇతరులకు దూరంగా ప్రత్యేకంగా ఉండడాన్నీ నిలుపుతుంది; తెలుగులో అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: μετεμορφώθη
  choice: రూపాంతరం చెందాడు
  rationale: కనిపించే రూపమార్పును సూచించే గ్రీకు క్రియకు స్పష్టమైన, గౌరవప్రదమైన తెలుగు; మార్పు ఎలా సంభవించిందో అదనంగా నిర్ణయించదు.
- source_word: ἔμπροσθεν αὐτῶν
  choice: వారి ఎదుట
  rationale: ఈ సంఘటన ఆ ముగ్గురు శిష్యుల సమక్షంలో, వారి కళ్లముందు జరిగిందనే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: క్రీస్తు సంబంధ సందర్భంలో μετεμορφώθη అనువాదం
  choice: రూపాంతరం చెందాడు
  alternative: ఆయన రూపం మారిపోయింది
  rationale: మూలంలోని దృశ్యమాన మార్పును తెలియజేస్తూనే, దాని స్వభావం లేదా కారణం గురించి వాక్యం చెప్పనిదాన్ని చేర్చదు. సంప్రదాయ సంఘటన పేరును బలవంతంగా ప్రయోగించకుండా మూలార్థాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకులోని చారిత్రక వర్తమానాన్ని తెలుగు కథనానికి సహజమైన భూతకాలంలో ఇచ్చాం. κατ’ ἰδίαν μόνους లోని ద్విగుణిత ప్రత్యేకతను ‘వారిని మాత్రమే ప్రత్యేకంగా’ అని అర్థభేదం నిలిచేలా వ్యక్తం చేశాం.
