  text: καλὸν τὸ ἅλας· ἐὰν δὲ τὸ ἅλας ἄναλον γένηται, ἐν τίνι αὐτὸ ἀρτύσετε; ἔχετε ἐν ἑαυτοῖς ⸀ἅλα, καὶ εἰρηνεύετε ἐν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/050.yaml
  text: Salt is good[a]; but if the salt becomes unsalty, with what will you season it? Have salt in yourselves[c][b], and be at peace with one another.
translation:
  language: te
  text: ఉప్పు మంచిది. అయితే ఉప్పు తన ఉప్పదనాన్ని కోల్పోతే[a], దేనితో దానికి రుచి కలిగిస్తారు? మీలో ఉప్పు కలిగి ఉండండి[b]; ఒకరితో ఒకరు శాంతిగా ఉండండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరో విధంగా: ‘ఉప్పు ఉప్పులేనిదిగా మారితే’ లేదా ‘చప్పబడితే.’'
    reason: lexical_alternative
  - marker: b
    text: ‘మీలో ఉప్పు కలిగి ఉండండి’ అనే మాట గ్రీకులోని రూపకాన్ని అలాగే ఉంచుతుంది. ఇది పవిత్రత, జ్ఞానం, నిబంధనకు నమ్మకంగా ఉండడం లేదా సంరక్షించే ప్రభావం వంటి భావాలను సూచించవచ్చు; అయితే ఈ వాక్యం ఒక్క అర్థాన్ని స్పష్టంగా నిర్దేశించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: మంచిది
  rationale: ఉప్పును సాధారణంగా సానుకూలంగా అంచనా వేసే καλός భావాన్ని సహజంగా, అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
- source_word: ἅλας / ἅλα
  choice: ఉప్పు
  rationale: రెండు సందర్భాల్లోనూ రూపకాన్ని యథాతథంగా నిలుపుతూ ఒకే పదంతో అనువదించబడింది.
- source_word: ἄναλον γένηται
  choice: తన ఉప్పదనాన్ని కోల్పోతే
  rationale: అక్షరార్థంగా ‘ఉప్పులేనిదిగా మారితే’ అనే భావం. తెలుగులో ‘ఉప్పదనాన్ని కోల్పోతే’ సహజంగా ఉండి, స్థితి మార్పునూ పదప్రయోగ సంబంధాన్నీ నిలుపుతుంది.
- source_word: ἐν τίνι αὐτὸ ἀρτύσετε
  choice: దేనితో దానికి రుచి కలిగిస్తారు?
  rationale: ἐν τίνι సాధనాన్ని అడుగుతుంది; ἀρτύω ఆహారానికి రుచి కలిగించడం లేదా ఉప్పు వేయడం అనే వంటసంబంధ రూపకాన్ని సూచిస్తుంది.
- source_word: ἔχετε ἐν ἑαυτοῖς ἅλα
  choice: మీలో మీరు ఉప్పు కలిగి ఉండండి
  rationale: గ్రీకు రూపకాన్ని వ్యాఖ్యానించి ఒక్క అర్థానికి పరిమితం చేయకుండా నిలుపుతుంది. ἐν ἑαυτοῖς యొక్క ఆత్మవాచక భావాన్ని ‘మీలో మీరు’ తెలియజేస్తుంది.
- source_word: εἰρηνεύετε ἐν ἀλλήλοις
  choice: ఒకరితో ఒకరు సమాధానంగా ఉండండి
  rationale: కొనసాగే పరస్పర శాంతి స్థితిని సూచించే ఆజ్ఞను ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: చివరి ఆజ్ఞలోని ‘ఉప్పు’ రూపకార్థం
  choice: ‘మీలో మీరు ఉప్పు కలిగి ఉండండి’ అని రూపకాన్ని నిలుపడం
  alternative: ‘మీలో పవిత్రత/జ్ఞానం/నిబంధన విశ్వాస్యత ఉండాలి’ అని ఒక నిర్దిష్ట వివరణ ఇవ్వడం
  rationale: వాక్యం రూపకాన్ని స్పష్టంగా నిర్వచించదు. కాబట్టి పవిత్రత, జ్ఞానం, నిబంధన విశ్వాస్యత లేదా సంరక్షక ప్రభావం వంటి సాధ్యమైన భావాల్లో ఒక్కదాన్ని మూలపాఠ్యంలోకి చేర్చకుండా అసలు అనిశ్చితిని కాపాడాలి.
- issue: εἰρηνεύετε యొక్క ఆజ్ఞాత్మక భావం
  choice: ‘సమాధానంగా ఉండండి’
  alternative: ‘సమాధానంగా జీవించండి’
  rationale: వర్తమాన ఆజ్ఞ సూచించే కొనసాగుతున్న ప్రవర్తనను సందర్భం తెలియజేస్తుంది; ‘ఉండండి’ మూలానికి దగ్గరగా, సహజంగా ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘ఉప్పు’ రూపకం వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపబడింది; ‘మీలో మీరు’ ఆత్మవాచక అంతర్గత భావాన్ని స్పష్టపరుస్తుంది.
