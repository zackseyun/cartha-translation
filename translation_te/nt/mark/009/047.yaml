id: MRK.9.47
reference: Mark 9:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ ὀφθαλμός σου σκανδαλίζῃ σε, ἔκβαλε αὐτόν· καλόν ⸀σέ ἐστιν μονόφθαλμον εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς ⸀τὴν ⸀γέενναν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/047.yaml
  text: And if your eye causes you to stumble[a], throw it out. It is better for you to enter the kingdom of God with one eye than, having two eyes, to be thrown into Gehenna,
translation:
  language: te
  text: నీ కన్ను నిన్ను తడబడేలా చేస్తే, దాన్ని విసిరివేయి. రెండు కళ్లతో గెహెన్నాలోకి[a] విసిరివేయబడడం కంటే, ఒకే కన్నుతో దేవుని రాజ్యంలో ప్రవేశించడం నీకు మేలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నరకంలోకి.” గ్రీకులో “గెహెన్నా” అని ఉంది. ఈ పదం హిన్నోము లోయ పేరుతో సంబంధమున్నది; అంత్యకాల తీర్పును సూచించడానికి వాడబడుతుంది.
    reason: ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేస్తూ, మూలపదానికి ఉన్న చారిత్రక మరియు తీర్పుసంబంధ నేపథ్యాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: తడబడేలా చేస్తే
  rationale: పాపం లేదా పతనానికి దారితీయడాన్ని సూచించే గ్రీకు రూపకాన్ని నిలుపుతూ, దాన్ని కేవలం ‘పాపం చేయించడం’గా పరిమితం చేయకుండా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔκβαλε
  choice: విసిరివేయి
  rationale: ἐκβάλλω అనే క్రియలోని బలమైన ‘బయటకు విసరడం’ భావాన్ని నిలుపుతుంది; గ్రీకులో స్పష్టంగా లేని ‘పెరికి వేయి’ లేదా ‘పీకివేయి’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: καλόν
  choice: మేలు
  rationale: ‘ఇది మంచిది ... దానికంటే’ అనే గ్రీకు తులనాత్మక నిర్మాణాన్ని తెలుగులో సహజంగా ‘... కంటే ... నీకు మేలు’గా అందిస్తుంది.
- source_word: μονόφθαλμον
  choice: ఒంటి కన్నుతో
  rationale: ‘ఒకే కన్ను గలవాడిగా’ అనే అర్థాన్ని సంక్షిప్తంగా, సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: మూలపదబంధంలోని సంబంధాన్ని, నూతన నిబంధనలోని ప్రామాణిక ధార్మిక భావాన్ని పారదర్శకంగా నిలుపుతుంది.
- source_word: βληθῆναι
  choice: విసిరివేయబడడం
  rationale: βάλλω యొక్క కర్మణి భావాన్ని నేరుగా ప్రతిబింబిస్తుంది; తీర్పుకు గురై వేయబడడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: γέενναν
  choice: గెహెన్నా
  rationale: హిన్నోము లోయ నేపథ్యంతో అంత్యకాల తీర్పును సూచించే నిర్దిష్ట గ్రీకు పదాన్ని సాధారణ ‘నరకం’ అనే పదంలో కలిపివేయకుండా దాని చారిత్రక, ధార్మిక ప్రత్యేకతను కాపాడుతుంది.
theological_decisions:
- issue: తీర్పు సందర్భంలో γέεννα పదానికి అనువాదం
  choice: గెహెన్నా
  alternative: నరకం
  rationale: మూలంలో పాతాళం లేదా శిక్షకు సంబంధించిన సాధారణ పదం కాకుండా γέεννα అనే నిర్దిష్ట పదం ఉంది. అందువల్ల ప్రధాన పాఠ్యంలో దాన్ని లిప్యంతరీకరించి, పాఠకులకు పరిచితమైన ‘నరకం’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చాం.
- issue: σκανδαλίζῃలోని నైతిక పతన భావం
  choice: తడబడేలా చేస్తే
  alternative: పాపంలో పడేలా చేస్తే
  rationale: సందర్భంలో పాపానికి దారితీయడం అంతర్భావంగా ఉన్నా, గ్రీకు క్రియలోని తడబడడం అనే రూపకాన్ని అనువాదం నిలుపుతుంది; దాని అర్థాన్ని ఒకే ధార్మిక వివరణకు పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే యేసు హెచ్చరికలోని గంభీరత మరియు స్పష్టమైన దృశ్యరూపాన్ని నిలుపుతూ అనువదించబడింది. గ్రీకు వాక్యంలోని తులనాత్మక నిర్మాణం తెలుగులో సహజమైన క్రమంలో అమర్చబడింది.
