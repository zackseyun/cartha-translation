revisions:
- from: నీ కన్ను నిన్ను తడబడేలా చేస్తే, దాన్ని విసిరివేయి. రెండు కళ్లతో గెహెన్నాలోకి[a] విసిరివేయబడడం కంటే, ఒంటి కన్నుతో దేవుని రాజ్యంలో ప్రవేశించడం నీకు మేలు.
