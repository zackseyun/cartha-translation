review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the conditional warning, the imperative to remove the offending eye, the comparison, entry into God's kingdom, and being thrown into Gehenna. It appropriately preserves γέεννα as “గెహెన్నా” rather than conflating it with a generalized term for hell.
  naturalness: The sentence is generally clear modern Telugu, but “ఒంటి కన్నుతో” is less idiomatic and can suggest an awkward literalism. “ఒకే కన్నుతో” is clearer and more natural for μονόφθαλμον. The footnote’s wording “ఈ పేరు ... పాతుకుపోయినది” is also somewhat unnatural in Telugu.
  terminology: “దేవుని రాజ్యం,” “గెహెన్నా,” and “విసిరివేయబడడం” preserve the Greek terminology and force well. “తడబడేలా చేస్తే” retains the metaphor of σκανδαλίζῃ without narrowing it solely to sin.
  issues:
  - severity: low
    issue: Less idiomatic rendering of μονόφθαλμον
    rationale: “ఒంటి కన్నుతో” is understandable, but “ఒకే కన్నుతో” is standard, unambiguous modern Telugu and more naturally expresses “one-eyed/with one eye.”
  - severity: low
    issue: Footnote phrasing is unnatural
    rationale: The phrase “ఈ పేరు హిన్నోము లోయలో పాతుకుపోయినది” does not naturally state the term’s historical association. Rewording it as an association with the Valley of Hinnom preserves the intended historical information more clearly.
  revised_text: నీ కన్ను నిన్ను తడబడేలా చేస్తే, దాన్ని విసిరివేయి. రెండు కళ్లతో గెహెన్నాలోకి[a] విసిరివేయబడడం కంటే, ఒకే కన్నుతో దేవుని రాజ్యంలో ప్రవేశించడం నీకు మేలు.
