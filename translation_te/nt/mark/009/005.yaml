id: MRK.9.5
reference: Mark 9:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Πέτρος λέγει τῷ Ἰησοῦ· Ῥαββί, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν ⸂τρεῖς σκηνάς⸃, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/005.yaml
  text: 'And Peter answered and said to Jesus[a], “Rabbi, it is good for us to be here, and let us make three shelters: one for you, one for Moses, and one for Elijah.”'
translation:
  language: te
  text: 'పేతురు యేసుతో ఇలా జవాబిచ్చాడు: “రబ్బీ, మనం ఇక్కడ ఉండడం మంచిది. మనం మూడు గుడారాలు[a] వేద్దాం—నీకు ఒకటి, మోషేకు ఒకటి, ఏలీయాకు ఒకటి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పర్ణశాలలు” లేదా “తాత్కాలిక ఆశ్రయాలు.” గ్రీకు పదం తాత్కాలిక గుడారాలు లేదా ఆశ్రయాలను సూచించగలదు; అయితే ఈ వచనం వాటిని పర్ణశాలల పండుగతో గానీ, ఆరాధనా గుడారంతో గానీ స్పష్టంగా అనుసంధానించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... λέγει
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: ἀποκριθείς అనే కథన ప్రయోగం తప్పనిసరిగా ముందున్న ప్రశ్నకు జవాబు అని సూచించదు. సహజమైన తెలుగు కథనంలో ‘అప్పుడు ... అన్నాడు’ సందర్భానుసార ప్రతిస్పందనను తెలియజేస్తుంది; λέγει అనే చారిత్రక వర్తమానాన్ని తెలుగు భూతకాల కథనశైలిలో ఇచ్చాం.
- source_word: Ῥαββί
  choice: రబ్బీ
  rationale: గౌరవపూర్వక సంబోధనలోని సెమిటిక్ నేపథ్యాన్ని నిలుపుతుంది; ‘బోధకుడా’ అనే అర్థవ్యాఖ్యకన్నా మూలరూపానికి పారదర్శకంగా ఉంటుంది.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: మనం ఇక్కడ ఉండడం మంచిది
  rationale: పీటరు చేసిన మదింపును అతిశయింపజేయకుండా, మూలంలోని అపురుష నిర్మాణ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ποιήσωμεν
  choice: మనం ... వేద్దాం
  rationale: మొదటి పురుష బహువచన ప్రోత్సాహక subjunctive భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘నిర్మిద్దాం’ కంటే సాధారణమైన ποιέω అర్థానికి దగ్గరగా ఉంది.
- source_word: σκηνάς
  choice: పర్ణశాలలు
  rationale: తాత్కాలికంగా వేసే గుడారాలు/మండపాల భావాన్ని తెలిపే గౌరవప్రదమైన తెలుగు పదం. పండుగ లేదా పరిశుద్ధ మందిర సంబంధాన్ని ప్రధాన పాఠ్యంలో తప్పనిసరిగా మోపకుండా ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: నీకు ఒకటి, మోషేకు ఒకటి, ఏలీయాకు ఒకటి
  rationale: μίαν పదపు పంపిణీ పునరుక్తిని, మూలంలోని సమాంతర నిర్మాణాన్ని యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: σκηνάς పదంలో ఉండగల పండుగ లేదా ఆరాధనా సంబంధ సూచనలు
  choice: ప్రధాన పాఠ్యంలో ‘పర్ణశాలలు’
  alternative: ‘గుడారాలు’ లేదా ‘తాత్కాలిక నివాసాలు’; సంప్రదాయంగా ‘కూటారాలు’
  rationale: ఈ వచనం వీటిని పర్ణశాలల పండుగతో గానీ, ప్రత్యక్ష గుడారం/పరిశుద్ధ మందిర సిద్ధాంతంతో గానీ స్పష్టంగా అనుసంధానించదు. అందువల్ల సంభావ్య సూచనలను చెరపకుండా, వాటిని ఖచ్చితమైన సిద్ధాంతార్థంగా మార్చకుండా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘రబ్బీ’ అనే చారిత్రక సంబోధనను నిలిపి, ‘పర్ణశాలలు’కు స్పష్టీకరణ పాదసూచిక ఇచ్చాం.
