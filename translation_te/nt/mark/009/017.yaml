source:
  edition: SBLGNT
  text: καὶ ⸂ἀπεκρίθη αὐτῷ εἷς ἐκ τοῦ ὄχλου⸃· Διδάσκαλε, ἤνεγκα τὸν υἱόν μου πρὸς σέ, ἔχοντα πνεῦμα ἄλαλον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/017.yaml
  text: And one from the crowd answered him[a], “Teacher, I brought my son to you, having a mute spirit.”
translation:
  language: te
  text: 'జనసమూహంలోని ఒకడు ఆయనకు జవాబిచ్చాడు: “బోధకుడా, మూగ ఆత్మ ఉన్న నా కుమారుణ్ణి నీ దగ్గరికి తీసుకొచ్చాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: జవాబిచ్చాడు
  rationale: సువార్త కథనంలో ప్రతిస్పందనను తెలిపే సాధారణ క్రియ; తెలుగు కథనశైలిలో సహజంగా ఉంది.
- source_word: εἷς ἐκ τοῦ ὄχλου
  choice: జనసమూహంలో ఒకడు
  rationale: గ్రీకులోని విభాగార్థక నిర్మాణాన్ని సహజమైన తెలుగులో చూపిస్తూ, మూలంలో స్పష్టంగా లేని అదనపు గుర్తింపును చేర్చదు.
- source_word: Διδάσκαλε
  choice: బోధకుడా
  rationale: సంబోధన రూపాన్ని, బోధించే వ్యక్తి అనే ప్రధాన అర్థాన్ని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἤνεγκα
  choice: తీసుకొచ్చాను
  rationale: గ్రీకు ఏఓరిస్ట్‌ను సందర్భానికి సహజమైన తెలుగు భూతకాల క్రియతో వ్యక్తం చేస్తుంది.
- source_word: υἱόν
  choice: నా కుమారుణ్ణి
  rationale: కుటుంబ సంబంధాన్ని ముందుంచే ‘కుమారుడు’ అనే మూలార్థాన్ని నిలుపుతుంది.
- source_word: πρὸς σέ
  choice: నీ దగ్గరికి
  rationale: ‘తీసుకురావడం’ అనే క్రియతో πρός యొక్క దిశార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἔχοντα
  choice: పట్టిన
  rationale: ఈ కృదంతం ‘నా కుమారుణ్ణి’ అనే పదాన్ని విశేషిస్తూ అతని స్థితిని చెబుతుంది; ఆత్మ సంబంధ సందర్భంలో ‘ఆత్మ పట్టిన’ అనేది సహజమైన తెలుగు ప్రయోగం.
- source_word: πνεῦμα ἄλαλον
  choice: మూగ ఆత్మ
  rationale: ἄλαλον యొక్క సంక్షిప్త విశేషణార్థాన్ని నిలుపుతూ, πνεῦμαకు మూలంలో లేని ‘దుష్ట’ లేదా ‘దయ్యం’ అనే పదాలను జోడించదు.
theological_decisions:
- issue: భూతవైద్య సందర్భంలో πνεῦμα యొక్క అర్థం
  choice: ‘ఆత్మ’ అని మాత్రమే అనువదించి, సందర్భం సూచించే హానికరమైన/దయ్యపు స్వభావాన్ని పాఠకునికి వదిలివేయడం
  alternative: ‘దుష్టాత్మ’ లేదా ‘దయ్యం’ అని స్పష్టీకరించడం
  rationale: మార్కు కథన సందర్భం దయ్యపు ఆత్మను సూచించినప్పటికీ, ఈ వాక్యంలో గ్రీకు పాఠం πνεῦμα అని మాత్రమే చెబుతుంది. అందువల్ల మూలంలోని సంక్షిప్తతను, అంతర్లీన ఉద్వేగాన్ని నిలుపుతుంది.
- issue: ἄλαλον ఆత్మనూ లేక కుమారుని మాటలేమినీ వర్ణిస్తుందా
  choice: ‘మూగ ఆత్మ’—వ్యాకరణపరంగా ఆత్మను నేరుగా వర్ణించడం
  alternative: ‘అతణ్ణి మాట్లాడలేకుండా చేసే ఆత్మ’
  rationale: గ్రీకు విశేషణం నేరుగా πνεῦμαను విశేషిస్తుంది. ప్రత్యామ్నాయం సందర్భార్థాన్ని స్పష్టపరుస్తుంది గాని మూలంలోని వ్యక్తీకరణను వివరణాత్మకంగా మార్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకునికి అర్థమయ్యే, గౌరవప్రదమైన కథనశైలి. మూలంలోని కృదంత నిర్మాణాన్ని తెలుగులో సహజమైన ‘ఆత్మ పట్టిన’ రూపంతో వ్యక్తం చేశాం.
