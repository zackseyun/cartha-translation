  to: 'యేసు జనసమూహం వేగంగా గుమికూడుతున్నదని చూసి[a], ఆ అపవిత్ర ఆత్మను గద్దించి, దానితో ఇలా అన్నాడు: “మూగ, చెవిటి ఆత్మా, నేను నీకు ఆజ్ఞాపిస్తున్నాను: అతనిలోనుండి బయటికి రా; ఇక మళ్లీ అతనిలో ప్రవేశించవద్దు.”'
