id: MRK.9.25
reference: Mark 9:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ὅτι ἐπισυντρέχει ὄχλος ἐπετίμησεν τῷ πνεύματι τῷ ἀκαθάρτῳ λέγων αὐτῷ· Τὸ ⸂ἄλαλον καὶ κωφὸν πνεῦμα⸃, ἐγὼ ⸂ἐπιτάσσω σοι⸃, ἔξελθε ἐξ αὐτοῦ καὶ μηκέτι εἰσέλθῃς εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/025.yaml
  text: But when Jesus saw that a crowd was quickly gathering[a], he rebuked the unclean spirit, saying to it, “You mute and deaf spirit, I command you, come out of him and never enter him again.”
translation:
  language: te
  text: 'యేసు జనసమూహం వేగంగా గుమికూడుతున్నదని చూసి[a], ఆ అపవిత్ర ఆత్మను గద్దించి, దానితో ఇలా అన్నాడు: “మూగ, చెవిటి ఆత్మా, నేను నీకు ఆజ్ఞాపిస్తున్నాను: అతనిలోనుండి బయటికి రా; ఇక మళ్లీ అతనిలో ప్రవేశించవద్దు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘జనసమూహం పరుగెత్తుకుంటూ ఒకచోటికి చేరుతుండడం.’ గ్రీకు క్రియ ప్రజలు వేగంగా ఒకచోటికి చేరుతున్న భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: కాని ... చూసి
  rationale: ἰδών ప్రధాన క్రియకు నేపథ్య పరిస్థితిని తెలిపే భూతకాల క్రియావిశేష రూపం; δέ స్వల్ప కథన సంధానాన్ని సూచిస్తుంది. ‘కాని ... చూసి’ సహజమైన తెలుగు కథన ప్రవాహాన్ని ఇస్తుంది.
- source_word: ἐπισυντρέχει ὄχλος
  choice: జనసమూహం వేగంగా గుమికూడుతుండడం
  rationale: ἐπισυντρέχω ప్రజలు వేగంగా ఒకచోటికి చేరడాన్ని లేదా పరుగెత్తుకుంటూ కలిసివస్తుండడాన్ని సూచిస్తుంది. ఈ ఎంపిక గ్రీకు వర్తమానకాలంలోని కొనసాగుతున్న దృశ్యాన్నీ వేగాన్నీ సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἐπετίμησεν
  choice: గద్దిస్తూ
  rationale: ἐπιτιμάω అధికారపూర్వకంగా గద్దించడం లేదా తీవ్రంగా మందలించడం అనే భావాన్ని ఇస్తుంది. సువార్తల్లో యేసు ఆత్మలను అధికారంతో అదుపుచేసే సందర్భానికి ‘గద్దిస్తూ’ తగినది.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: ఆ అపవిత్ర ఆత్మను
  rationale: ἀκάθαρτος‌లోని అపవిత్రత భావాన్ని ‘అపవిత్ర’ నేరుగా నిలుపుతుంది; ‘ఆత్మ’ వ్యక్తిగతంగా సంబోధించబడే సత్తాను అస్పష్టపరచదు.
- source_word: Τὸ ἄλαλον καὶ κωφὸν πνεῦμα
  choice: మూగ, చెవిటి ఆత్మా
  rationale: ἄλαλος‌ను ‘మూగ’, κωφός‌ను ‘చెవిటి’గా వేర్వేరు లక్షణాలుగా నిలిపి, సంబోధనను సహజమైన తెలుగు రూపంలో అందిస్తుంది.
- source_word: ἐγὼ ἐπιτάσσω σοι
  choice: నేను నీకు ఆజ్ఞాపిస్తున్నాను
  rationale: ἐπιτάσσω అధికారపూర్వక ఆజ్ఞను సూచిస్తుంది. స్పష్టంగా ఉన్న ἐγώకు అనుగుణంగా ‘నేను’ ఉంచడం యేసు పలుకులోని వ్యక్తిగత అధికార ఉద్ఘాటనను కాపాడుతుంది.
- source_word: ἔξελθε ἐξ αὐτοῦ
  choice: ఇతనిలో నుండి బయటికి రా
  rationale: ఆత్మను నేరుగా సంబోధించిన ఆజ్ఞను ‘బయటికి రా’ సహజంగా వ్యక్తపరుస్తుంది; αὐτοῦకు సమీపంలో ఉన్న బాలుణ్ణి సూచించే ‘ఇతనిలో నుండి’ స్పష్టమైనది.
- source_word: μηκέτι εἰσέλθῃς εἰς αὐτόν
  choice: ఇక ఎన్నడూ ఇతనిలో ప్రవేశించకు
  rationale: μηκέτι ఇకపై మళ్లీ జరగకూడదనే నిషేధాన్ని సూచిస్తుంది. ‘ఇక ఎన్నడూ ... ప్రవేశించకు’ భవిష్యత్తులో తిరిగి ప్రవేశించడంపై నిర్ణయాత్మక నిషేధాన్ని తెలుగులో బలంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దుష్టాత్మ సంబంధ పదజాలం మరియు యేసు అధికారం
  choice: πνεῦμα ἀκάθαρτον‌ను ‘అపవిత్ర ఆత్మ’గా, ἐπετίμησεν/ἐπιτάσσωను ‘గద్దిస్తూ’/‘ఆజ్ఞాపిస్తున్నాను’గా బలమైన అధికార భాషతో అనువదించడం
  alternative: ‘దుష్టాత్మ’ లేదా ‘అశుద్ధ ఆత్మ’; ‘తీవ్రంగా మాట్లాడాడు’
  rationale: మూలపాఠం యేసు నేరుగా సంబోధించి ఆజ్ఞాపించే వ్యక్తిగత ఆత్మను చిత్రిస్తుంది. అనువాదం దీనిని కేవలం అనారోగ్యంగా మృదువుపరచకూడదు, అలాగే పాఠానికి మించిన సిద్ధాంత వివరణను జోడించకూడదు. ‘అపవిత్ర ఆత్మ’ మూలంలోని వర్గీకరణను, అధికారపూర్వక క్రియలు యేసు ప్రత్యక్ష అధికారాన్ని నిలుపుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. సంభాషణలోని ఆజ్ఞ బలంగా ఉన్నప్పటికీ అనవసరమైన అలంకరణను నివారించాం; ‘మూగ, చెవిటి’ అనే జంట మూలంలోని రెండు వేర్వేరు విశేషణాలను నిలుపుతుంది.
