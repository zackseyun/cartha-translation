    issue: The expression ‘మరణాన్ని రుచి చూడనే చూడరు’ is linguistically defective.
    rationale: ‘చూడనే చూడరు’ repeats ‘see,’ whereas γεύσωνται means ‘taste.’ It obscures the intended death-tasting idiom rather than supplying a Telugu emphatic negation.
  - severity: low
    issue: Footnote markers are placed only at the end of the sentence.
    rationale: The marker for the death idiom and the marker for the kingdom-coming phrase should be anchored immediately after their respective expressions for unambiguous reference.
