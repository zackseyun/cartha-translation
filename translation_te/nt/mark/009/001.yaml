id: MRK.9.1
reference: Mark 9:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι εἰσίν τινες ⸂τῶν ὧδε⸃ ἑστηκότων οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ ἐληλυθυῖαν ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/001.yaml
  text: And he was saying to them[a], “Truly I say to you[d][c][b], there are some standing here who will certainly not taste death until they see the kingdom of God having come in power.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “నేను మీతో నిజంగా చెబుతున్నాను: ఇక్కడ నిలబడి ఉన్నవారిలో కొందరు దేవుని రాజ్యం శక్తితో వచ్చి ఉండడాన్ని[b] చూసే వరకు మరణాన్ని ఎన్నటికీ రుచి చూడరు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మరణాన్ని రుచి చూడడం’ అంటే ‘మరణాన్ని అనుభవించడం’ లేదా ‘చనిపోవడం’ అనే జాతీయ ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: ‘శక్తితో వచ్చి ఉన్న దేవుని రాజ్యాన్ని’ అని కూడా అనువదించవచ్చు. ఇది రూపాంతరం, పునరుత్థానం, పెంతెకొస్తు, యెరూషలేముపై తీర్పు, లేదా రాజ్యపు అంతిమ పరిపూర్ణత—వీటిలో దేనిని సూచిస్తుందో వాక్యం స్వయంగా నిర్దిష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: ఇలా అన్నాడు
  rationale: గ్రీకు అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా సందర్భంలో ముందుకు సాగే మాటను సూచించవచ్చు. తెలుగులో ‘చెబుతూ ఉన్నాడు’ ఇక్కడ కృతకంగా వినిపించే కారణంగా సహజమైన కథన రూపమైన ‘ఇలా అన్నాడు’ను ఎంచుకున్నాం.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: నేను మీతో నిజంగా చెబుతున్నాను
  rationale: బోధనకు ముందు వచ్చే Ἀμήν గంభీరమైన నిశ్చయ ప్రకటన. ‘ఆమేన్’ అని లిప్యంతరీకరించకుండా, ఆధునిక తెలుగులో దాని వాక్యప్రయోగ భావాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: τινες τῶν ὧδε ἑστηκότων
  choice: ఇక్కడ నిలబడి ఉన్నవారిలో కొందరు
  rationale: τῶν అనే భాగార్థక నిర్మాణాన్ని ‘వారిలో కొందరు’ స్పష్టంగా నిలుపుతుంది; ἑστηκότων యొక్క స్థితి భావాన్ని ‘నిలబడి ఉన్న’ తెలియజేస్తుంది.
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: మరణాన్ని రుచి చూడనే చూడరు
  rationale: οὐ μή యొక్క బలమైన నిరాకరణను ‘చూడనే చూడరు’ ద్వారా, γεύομαι యొక్క రూపకాన్ని ‘రుచి చూడు’ ద్వారా నిలిపాం.
- source_word: ἕως ἂν ἴδωσιν
  choice: చూసే వరకు
  rationale: భవిష్యత్తులో జరిగే అంశాన్ని సూచించే కాలపరిమితి నిర్మాణాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: βασιλεία పాలనను లేదా రాజ్యాన్ని సూచించగలిగినా, సువార్తల సందర్భంలో విస్తృతార్థాన్ని నిలిపే స్థిరమైన తెలుగు పదబంధం ‘దేవుని రాజ్యం’.
- source_word: ἐληλυθυῖαν ἐν δυνάμει
  choice: శక్తితో రావడాన్ని
  rationale: ἐν δυνάμειని ‘శక్తితో’గా నేరుగా నిలిపాం. గ్రీకు పరిపూర్ణ కృదంతం వచ్చిన ఫలితస్థితిని సూచిస్తుంది; తెలుగులో అత్యంత సహజంగా ఉండేందుకు ‘రావడాన్ని’ వాడి, దాని పరిపూర్ణ భావాన్ని పాదసూచికలో తెలియజేశాం.
theological_decisions:
- issue: ‘దేవుని రాజ్యం శక్తితో రావడం’ ఏ సంఘటనను సూచిస్తుంది?
  choice: ఏ నిర్దిష్ట సంఘటనతోనూ దానిని అనువాదంలో సమానం చేయకుండా ఉంచడం
  alternative: రూపాంతరం, పునరుత్థానం/మహిమపరచడం, పెంతెకొస్తు, యెరూషలేముపై తీర్పు, లేదా రాజ్యపు అంతిమ పరిపూర్ణతగా స్పష్టీకరించడం
  rationale: గ్రీకు వాక్యం ఏ సంఘటనను ఉద్దేశిస్తుందో స్వయంగా చెప్పదు. కాబట్టి వ్యాఖ్యాన అవకాశాల మధ్య ఉన్న ఉత్కంఠను అనువాదంలో పరిష్కరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గంభీరమైన వాక్యనిర్మాణం. బలమైన నిరాకరణను తెలుగు పునరుక్తి నిర్మాణంతో వ్యక్తం చేసి, మూలంలోని మరణ-రుచి రూపకాన్ని నిలిపాం.
