  source_fidelity: The draft accurately conveys the solemn declaration, the partitive group present, the temporal limit, and the kingdom’s coming in power. However, ‘మరణాన్ని రుచి చూడనే చూడరు’ conflates the idiom ‘taste’ with the verb ‘see’ and is not a valid natural rendering of the emphatic negation. The revised wording retains the Greek metaphor while expressing οὐ μή clearly. The perfect participle ἐληλυθυῖαν is represented by ‘వచ్చి ఉండడం.’
  naturalness: ‘మరణాన్ని ఎన్నటికీ రుచి చూడరు’ is natural modern standard Telugu and gives the required strong negative force. Moving each footnote marker directly after its relevant expression makes the anchors clear.
  terminology: ‘దేవుని రాజ్యం,’ ‘మరణాన్ని రుచి చూడడం,’ and ‘శక్తితో’ are appropriate, established, and suitably formal Telugu renderings. The interpretive footnote preserves the source text’s ambiguity and does not select an interpretation.
  issues:
