id: MRK.9.42
reference: Mark 9:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὃς ⸀ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν ⸀τούτων τῶν πιστευόντων ⸂εἰς ἐμέ⸃, καλόν ἐστιν αὐτῷ μᾶλλον εἰ περίκειται ⸂μύλος ὀνικὸς⸃ περὶ τὸν τράχηλον αὐτοῦ καὶ βέβληται εἰς τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/042.yaml
  text: And whoever causes one of these little ones who believe in me to stumble[a], it is better for him if a donkey millstone is put around his neck and he is thrown into the sea.
translation:
  language: te
  text: నాపై విశ్వాసముంచే ఈ చిన్నవారిలో ఒకరిని ఎవడైనా తడబడేలా చేస్తే, వాడి మెడకు గాడిదతో తిప్పించే తిరుగలి రాయి[a] కట్టి వాణ్ణి సముద్రంలో పడవేస్తే వాడికే మరింత మేలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, గాడిదతో తిప్పించే పెద్ద తిరుగలి రాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: తడబడటానికి ... కారణమవుతాడో
  rationale: పాపంలో పడటం, విశ్వాసం నుంచి తొలగిపోవడం వంటి భావాలను కలిగించగల గ్రీకు రూపకాన్ని ‘తడబడటం’ నిలుపుతుంది; కేవలం ‘బాధపరచడం’ అనే బలహీన భావాన్ని నివారిస్తుంది.
- source_word: μικρῶν τούτων
  choice: ఈ చిన్నవారిలో
  rationale: ఇది కేవలం చిన్నపిల్లలకే పరిమితం కాకుండా అల్పులుగా లేదా బలహీనులుగా పరిగణించబడే విశ్వాసులను కూడా సూచించగల విస్తృతిని నిలుపుతుంది.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: నాపై విశ్వాసముంచే
  rationale: యేసును వ్యక్తిగత విశ్వాసానికి లక్ష్యంగా చూపే πιστεύω εἰς భావాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: καλόν ἐστιν αὐτῷ μᾶλλον
  choice: వాడికి మేలు
  rationale: తీవ్రమైన హెచ్చరికలోని తులనాత్మక ప్రయోజన భావాన్ని సంక్షిప్తమైన సహజ తెలుగు నుడికారంలో తెలియజేస్తుంది.
- source_word: μύλος ὀνικός
  choice: గాడిద తిప్పే తిరుగలి రాయి
  rationale: చేతితో తిప్పే చిన్న రాయి కాకుండా గాడిదతో తిప్పించే పెద్ద తిరుగలి రాయిని గ్రీకు పదబంధం నిర్దిష్టంగా సూచిస్తుంది.
- source_word: περίκειται ... περὶ τὸν τράχηλον
  choice: మెడ చుట్టూ ... కట్టి
  rationale: మెడ చుట్టూ రాయిని ఉంచి బిగించే దృశ్యాన్ని తెలుగులో స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: βέβληται εἰς τὴν θάλασσαν
  choice: సముద్రంలో పడవేయడం
  rationale: గ్రీకు కర్మణి రూపంలోని విసిరివేయబడే ఘోరమైన ఫలితాన్ని సహజమైన తెలుగు క్రియారూపంలో నిలుపుతుంది.
theological_decisions:
- issue: ‘ఈ చిన్నవారు’ ఎవరిని సూచిస్తారు?
  choice: చిన్నపిల్లలకే పరిమితం చేయకుండా, యేసుపై విశ్వాసముంచే అల్పులు లేదా బలహీనులు కూడా చేరేలా విస్తృతంగా అనువదించడం.
  alternative: చిన్నపిల్లలు మాత్రమే; లేదా వినయంగల శిష్యులందరూ.
  rationale: ‘నాపై విశ్వాసముంచే’ అనే విశేషణ భాగం వయస్సును మించిన సూచనను ఇస్తుంది. పిల్లలను మినహాయించకుండానే మూలంలోని విస్తృతిని, వ్యాఖ్యాన ఉద్రిక్తతను అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే యేసు పలికిన తీవ్రమైన హెచ్చరికకు తగిన గంభీరతతో రూపొందించబడింది. మూలంలోని తడబడే రూపకాన్ని, ‘చిన్నవారు’ అనే విస్తృత సూచనను నిలిపింది.
