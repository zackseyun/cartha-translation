revisions:
- from: నాపై విశ్వాసముంచే ఈ చిన్నవారిలో ఒక్కరు తడబడటానికి ఎవడు కారణమవుతాడో, వాడి మెడ చుట్టూ గాడిద తిప్పే తిరుగలి రాయి[a] కట్టి సముద్రంలో పడవేయడం వాడికి మేలు.
  to: నాపై విశ్వాసముంచే ఈ చిన్నవారిలో ఒకరిని ఎవడైనా తడబడేలా చేస్తే, వాడి మెడకు గాడిదతో తిప్పించే తిరుగలి రాయి[a] కట్టి వాణ్ణి సముద్రంలో పడవేస్తే వాడికే మరింత మేలు.
  rationale: The revision explicitly represents the Greek comparative μᾶλλον, uses a more direct Telugu causative for σκανδαλίζω, and retains the source’s deliberately broad “little ones” and stumbling metaphor. The footnote anchor remains attached to μύλος ὀνικός and explains the large, donkey-driven millstone without adding interpretation.
