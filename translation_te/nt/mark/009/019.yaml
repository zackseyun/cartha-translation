source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸀αὐτοῖς λέγει· Ὦ γενεὰ ἄπιστος, ἕως πότε πρὸς ὑμᾶς ἔσομαι; ἕως πότε ἀνέξομαι ὑμῶν; φέρετε αὐτὸν πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/019.yaml
  text: And answering them[a], he says, “O unbelieving generation[b], how long will I be with you? How long will I put up with you? Bring him to me.”
translation:
  language: te
  text: 'ఆయన వారికి జవాబుగా ఇలా అంటున్నాడు: “విశ్వాసంలేని తరమా[a], నేను ఎంతకాలం మీతో ఉంటాను? ఎంతకాలం మిమ్మల్ని సహిస్తాను[b]? అతనిని నా దగ్గరకు తీసుకురండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విశ్వాసంలో నిలకడలేని తరం.” గ్రీకు పదం నమ్మకం లేకపోవడాన్ని లేదా విశ్వాసంలో నిలకడగా లేకపోవడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మిమ్మల్ని ఎంతకాలం భరిస్తాను/ఓర్చుకుంటాను?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς
  choice: వారికి జవాబిస్తూ
  rationale: గ్రీకు కృదంత నిర్మాణాన్ని సహజమైన తెలుగు వాక్యప్రవాహంలో ఉంచి, స్పందనను సూచిస్తుంది.
- source_word: λέγει
  choice: ఇలా అంటున్నాడు
  rationale: మార్కు వాడిన చారిత్రక వర్తమాన కాలపు సజీవ కథనశైలిని నిలుపుతుంది.
- source_word: γενεὰ ἄπιστος
  choice: విశ్వాసంలేని తరమా
  rationale: ఈ సందర్భంలో దేవుని శక్తిని నమ్మకపోవడాన్ని స్పష్టంగా తెలియజేస్తుంది; నమ్మకంగా ఉండకపోవడం అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: ἕως πότε
  choice: ఎంతకాలం
  rationale: కాలవ్యవధిని ప్రశ్నించే గ్రీకు ప్రయోగానికి సహజమైన తెలుగు సమానం.
- source_word: πρὸς ὑμᾶς ἔσομαι
  choice: మీతో ఉండాలి
  rationale: వారితో కొనసాగుతున్న సాన్నిధ్యాన్ని సూచించే ప్రయోగాన్ని సహజంగా అందిస్తుంది.
- source_word: ἀνέξομαι ὑμῶν
  choice: మిమ్మల్ని సహించాలి
  rationale: భరించడం లేదా ఓర్చుకోవడం అనే భావంతో పాటు యేసు వ్యక్తం చేసిన వేదనను గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: φέρετε αὐτὸν πρός με
  choice: అతణ్ణి నా దగ్గరకు తీసుకురండి
  rationale: బాలుణ్ణి యేసు వద్దకు తీసుకురావాలనే ప్రత్యక్ష ఆజ్ఞను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: γενεὰ ἄπιστοςలో ἄπιστος పద భావం
  choice: విశ్వాసంలేని
  alternative: నమ్మకంగా లేని
  rationale: తక్షణ సందర్భంలో నమ్మకం లేకపోవడం ప్రధాన భావం. అయితే గ్రీకు పదానికి నమ్మకంగా ఉండకపోవడం అనే భావం కూడా ఉండగలదు కాబట్టి దానిని పాదసూచికలో నిలిపాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. మార్కు చారిత్రక వర్తమానాన్ని ‘అంటున్నాడు’గా నిలిపి, రెండు ప్రశ్నల పునరావృత నిర్మాణాన్ని కాపాడాము.
