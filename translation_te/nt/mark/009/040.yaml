  text: ὃς γὰρ οὐκ ἔστιν καθ’ ⸂ἡμῶν, ὑπὲρ ἡμῶν⸃ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/040.yaml
  text: For whoever is not against us is for us[a].
translation:
  language: te
  text: ఎందుకంటే, మనకు వ్యతిరేకంగా లేనివాడు మన పక్షాన ఉన్నాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మన కోసం ఉన్నాడు.’ గ్రీకు పదబంధం ὑπὲρ ἡμῶνకు ‘మన తరఫున’ అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: లేనివాడు
  rationale: సంబంధవాచక సర్వనామం ఇక్కడ సాధారణంగా, నామవాచకార్థంలో వాడబడింది. ‘లేనివాడు’ అనే నిర్మాణం తెలుగులో సహజంగా ఉండి, ఎవరైనా అనే సాధారణ వర్తనను నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి వివరణ లేదా కారణాన్ని పరిచయం చేసే γάρ భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: οὐκ ἔστιν
  choice: లేనివాడు
  rationale: నిషేధార్థక వర్తమాన స్థితిని తెలుగు సంబంధ నిర్మాణంలో సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: καθ’ ἡμῶν
  choice: మనకు విరోధంగా
  rationale: γενitive‌తో κατά ఇక్కడ వ్యతిరేకతను సూచిస్తుంది. ‘మనకు విరోధంగా’ ఆ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὑπὲρ ἡμῶν
  choice: మన పక్షంగా
  rationale: γενitive‌తో ὑπέρ ఇక్కడ ‘మన కోసం/మన పక్షాన’ అనే భావాన్ని కలిగి ఉంది. వ్యతిరేక సమాంతర నిర్మాణంలో ‘మన పక్షంగా’ సహజంగా ఉండి, మద్దతు లేదా అనుకూలత భావాన్ని నిలుపుతుంది.
- source_word: ἐστιν
  choice: ఉన్నాడు
  rationale: వాక్యంలోని విరుద్ధ సమాంతరతను పూర్తి చేసే సాధారణ వర్తమాన స్థితిని నేరుగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ‘మనకు విరోధంగా’ మరియు ‘మన పక్షంగా’ అనే మాటల్లో సూచించబడిన అనుబంధపు పరిధి
  choice: గ్రీకులో ఉన్న మొదటి పురుష బహువచన సంబంధ భాషను అలాగే నిలుపుతూ, ‘మనకు విరోధంగా’ మరియు ‘మన పక్షంగా’ అని అనువదించడం.
  alternative: ‘మన సేవకు విరోధంగా లేనివాడు మన పక్షాన ఉన్నాడు’ లేదా ‘దేవునికి విరోధంగా లేనివాడు దేవుని పక్షాన ఉన్నాడు.’
  rationale: మూలపాఠం స్పష్టంగా ‘మన’ అనే భాషనే ఉపయోగిస్తుంది. ‘సేవ’ లేదా ‘దేవుడు’ అని విస్తరించడం సందర్భార్థాన్ని ముందుగానే నిర్ణయిస్తుంది; అందువల్ల ఆ వ్యాఖ్యానాన్ని పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని సంక్షిప్త విరుద్ధ సమాంతరతను నిలుపుతూ, ‘మన’ అనే సంబంధ భాషకు అదనపు సిద్ధాంతార్థం జోడించలేదు.
