  to: ఎందుకంటే, మనకు వ్యతిరేకంగా లేనివాడు మన పక్షాన ఉన్నాడు[a].
  rationale: 'The revision makes only an idiomatic Telugu adjustment: ‘మన పక్షాన’ is the standard expression for being on someone’s side. It retains the Greek’s generic singular, explanatory connection, and unexpanded relational language. The footnote continues to signal the lexical range of ὑπὲρ ἡμῶν.'
