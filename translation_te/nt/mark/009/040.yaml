  terminology: ‘మనకు వ్యతిరేకంగా’ and ‘మన పక్షాన’ clearly express καθ’ ἡμῶν and ὑπὲρ ἡμῶν without broadening ‘us’ to God, the kingdom, or ministry. The footnote should present a genuine lexical alternative to the revised main rendering.
