id: MRK.9.11
reference: Mark 9:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτων αὐτὸν λέγοντες· Ὅτι λέγουσιν οἱ γραμματεῖς ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/011.yaml
  text: And they were asking him[a], saying, “Why do the scribes say that Elijah must come first?”
translation:
  language: te
  text: 'వారు ఆయనను ఇలా అడుగుతూ ఉన్నారు: “ఏలీయా ముందుగా రావాలని శాస్త్రులు ఎందుకు చెబుతున్నారు?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏలీయా ముందుగా రావాలని శాస్త్రులు చెప్పడం ఎలా?”
    reason: Ὅτι ఇక్కడ ‘ఎందుకు’ అని కారణాన్ని అడగవచ్చు; లేదా ‘అది ఎలా?’ అనే ప్రశ్నార్థక భావాన్ని ఇవ్వవచ్చు.
lexical_decisions:
- source_word: ἐπηρώτων
  choice: అడుగుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పునరావృతమైన ప్రశ్నను సూచిస్తుంది; తెలుగు కథనంలో ‘అడుగుతూ ఉన్నారు’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: λέγοντες
  choice: అని
  rationale: ప్రశ్నలోని మాటలను పరిచయం చేసే ఈ కృదంతాన్ని తెలుగులో సహజమైన ప్రత్యక్ష వాక్య నిర్మాణమైన ‘అని’తో వ్యక్తం చేశాం.
- source_word: Ὅτι
  choice: ఎందుకు
  rationale: ఇక్కడ ὅτι ప్రశ్నార్థక సందర్భంలో ‘ఎందుకు/ఎలా అంటే’ అనే భావాన్ని ఇస్తుంది; ప్రధాన పాఠంలో ‘ఎందుకు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: γραμματεῖς
  choice: శాస్త్రులు
  rationale: సువార్తల చారిత్రక సందర్భంలో ధర్మశాస్త్రాన్ని లిఖించి బోధించే వర్గానికి తెలుగులో ప్రామాణికంగా వినిపించే పదం.
- source_word: Ἠλίαν
  choice: ఏలీయా
  rationale: ఈ ప్రవక్త పేరుకు ప్రాచుర్యంలో ఉన్న తెలుగు బైబిలు రూపాన్ని వాడాం.
- source_word: δεῖ
  choice: రావాలి
  rationale: అవసరతను సూచించే δεῖ యొక్క బలాన్ని తెలుగులో సహజమైన విధ్యర్థక రూపం ‘రావాలి’ నిలుపుతుంది.
- source_word: ἐλθεῖν
  choice: రావాలని
  rationale: δεῖతో కలిసి ‘రావాలి’ అనే సహజ తెలుగు నిర్మాణంలో రాకను సూచిస్తుంది.
- source_word: πρῶτον
  choice: ముందుగా
  rationale: కాలపరమైన ప్రాధాన్యాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: Ὅτιతో ప్రారంభమైన శిష్యుల ప్రశ్న స్వభావం
  choice: శాస్త్రుల బోధకు కారణం అడిగే ప్రత్యక్ష ‘ఎందుకు’ ప్రశ్నగా అనువదించాం.
  alternative: ‘ఏమిటి, శాస్త్రులు ... అని చెప్పడం?’ లేదా ‘శాస్త్రులు ... అని ఎలా చెబుతున్నారు?’
  rationale: ప్రశ్నార్థక భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తూ, మూలంలోని ‘ఎందుకు/ఎలా అంటే’ అనే స్వల్ప సందిగ్ధతను పాదటిప్పణిలో ఉంచాం.
- issue: ఏలీయా రాక స్వభావం
  choice: ‘ఏలీయా ముందుగా రావాలి’ అని మాత్రమే ఉంచాం.
  alternative: ‘ఏలీయా మళ్లీ రావాలి’ లేదా ‘మెస్సీయకు ముందు ఏలీయా రావాలి’
  rationale: ‘మళ్లీ’ లేదా ‘మెస్సీయకు ముందు’ అనే వివరణలు ఈ వచనంలో ప్రత్యక్షంగా లేవు; అందువల్ల వ్యాఖ్యానాన్ని పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘శాస్త్రులు’ అనే చారిత్రక పదాన్ని నిలిపి, అవసరతను ‘రావాలి’తో స్పష్టంగా తెలిపాం; మూలంలోని ప్రశ్నార్థక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో సంరక్షించాం.
