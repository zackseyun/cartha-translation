  text: καὶ λαβὼν παιδίον ἔστησεν αὐτὸ ἐν μέσῳ αὐτῶν καὶ ἐναγκαλισάμενος αὐτὸ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/036.yaml
  text: 'And taking a child[a], he set him in their midst, and taking him in his arms[b], he said to them:'
translation:
  language: te
  text: 'ఆయన ఒక చిన్నపిల్లను తీసుకొని, వారి మధ్య నిలబెట్టి[a], ఆ పిల్లను తన చేతుల్లోకి తీసుకొని[b], వారితో ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి మధ్య ఉంచి.’ గ్రీకు క్రియకు అక్షరార్థంగా ‘నిలబడేలా చేశాడు’ అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆ పిల్లను కౌగిలించుకొని.’ గ్రీకు క్రియ ఒకరిని చేతుల్లోకి తీసుకోవడం లేదా కౌగిలించుకోవడం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: తీసుకొని
  rationale: అనంతరం జరిగే ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచించే ఏఓరిస్ట్ కృదంతాన్ని సహజమైన తెలుగు క్రియాసముచ్చయంతో వ్యక్తం చేస్తుంది.
- source_word: παιδίον
  choice: ఒక చిన్నపిల్లను
  rationale: పిల్లవాడిని లేదా చిన్న పిల్లను సూచించే పదం; తెలుగులో సహజంగా, లింగాన్ని నిర్దిష్టం చేయకుండా ‘చిన్నపిల్ల’ అని అనువదించవచ్చు.
- source_word: ἔστησεν
  choice: నిలబెట్టి
  rationale: ఇక్కడ ἵστημι సకర్మక భావంలో ‘నిలబడేలా చేయడం’ అని సూచిస్తుంది; ‘నిలబెట్టి’ ఆ భౌతిక చర్యను స్పష్టంగా కాపాడుతుంది.
- source_word: ἐν μέσῳ αὐτῶν
  choice: వారి మధ్య
  rationale: గుంపు మధ్యలో ఉన్న స్థానాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐναγκαλισάμενος
  choice: ఆ పిల్లను తన చేతుల్లోకి తీసుకొని
  rationale: ఒకరిని చేతుల్లోకి తీసుకోవడం లేదా కౌగిలించుకోవడం అనే అర్థపరిధిలో, సందర్భంలోని స్పష్టమైన శారీరక సంజ్ఞను వ్యక్తం చేస్తుంది.
- source_word: εἶπεν αὐτοῖς
  choice: వారితో ఇలా అన్నాడు
  rationale: తెలుగులో ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే సహజమైన, తటస్థ రూపం.
