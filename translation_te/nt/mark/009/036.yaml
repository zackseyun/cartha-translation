translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. παιδίον యొక్క లింగాన్ని అవసరం లేకుండా నిర్దిష్టం చేయలేదు; రెండు గ్రీకు కృదంతాల చర్యాక్రమాన్ని తెలుగు ‘తీసుకొని/నిలబెట్టి/తీసుకొని’ నిర్మాణాలతో నిలిపాం.
