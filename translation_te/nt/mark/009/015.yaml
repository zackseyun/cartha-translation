id: MRK.9.15
reference: Mark 9:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς πᾶς ὁ ὄχλος ⸂ἰδόντες αὐτὸν ἐξεθαμβήθησαν⸃, καὶ προστρέχοντες ἠσπάζοντο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/015.yaml
  text: And immediately the whole crowd[a], when they saw him, were greatly amazed, and running up to him, greeted him.
translation:
  language: te
  text: వెంటనే జనసమూహమంతా ఆయనను చూసి ఎంతో ఆశ్చర్యపోయి[a], ఆయన దగ్గరికి పరుగెత్తుకుంటూ వచ్చి ఆయనకు అభివాదం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విస్మయపడ్డారు”; లేదా, “భయాందోళన చెందారు.” గ్రీకు క్రియ సందర్భాన్ని బట్టి తీవ్రమైన ఆశ్చర్యం, విస్మయం లేదా భయాందోళనను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు వృత్తాంతంలో కనిపించే తక్షణత్వాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πᾶς ὁ ὄχλος
  choice: జనసమూహమంతా
  rationale: ఏకవచన సమూహవాచకంతో కూడిన πᾶς సూచించే సమగ్రతను సహజంగా నిలుపుతుంది.
- source_word: ἰδόντες αὐτόν
  choice: ఆయనను చూసి
  rationale: అయోరిస్ట్ కృదంతం ప్రధాన చర్యకు దారితీసిన కాలసంబంధ పరిస్థితిని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐξεθαμβήθησαν
  choice: ఎంతో ఆశ్చర్యపోయి
  rationale: క్రియలోని తీవ్రమైన ఆశ్చర్య భావాన్ని నిలుపుతూ, కారణాన్ని గానీ భయాన్ని గానీ అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: προστρέχοντες
  choice: ఆయన దగ్గరికి పరుగెత్తుకుంటూ వచ్చి
  rationale: యేసు వైపు వేగంగా, ఆసక్తితో కదిలిన భావాన్ని స్పష్టమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: ἠσπάζοντο αὐτόν
  choice: ఆయనకు అభివాదం చేశారు
  rationale: ἀσπάζομαι యొక్క తటస్థమైన ‘పలకరించడం/అభివాదం చేయడం’ భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ἐξεθαμβήθησανలో జనసమూహం స్పందన యొక్క స్వభావం
  choice: తీవ్రమైన ఆశ్చర్యం
  alternative: వారు భయాందోళన చెందారు; లేదా మోషేను పోలిన ప్రకాశవంతమైన రూపం కారణంగా ఆశ్చర్యపోయారు
  rationale: వచనం జనసమూహం ఆయనను చూసినప్పుడు తీవ్రమైన స్పందన చూపిందని మాత్రమే చెబుతుంది. దాని కారణాన్ని లేదా అది ప్రత్యేకంగా భయమని అనువాదంలో చేర్చకుండా భావతీవ్రతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని చర్యల క్రమం మరియు భావతీవ్రత నిలుపబడ్డాయి.
