  yaml_path: translation/nt/mark/009/044.yaml
  text: where[a] their worm does not die, and the fire is not quenched.
translation:
  language: te
  text: అక్కడ[a] వారి పురుగు చావదు; అగ్ని ఆరిపోదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనం అత్యంత ప్రాచీన గ్రీకు ప్రతుల్లో (నాలుగో శతాబ్దానికి చెందిన సీనైటికస్, వాటికానస్ ప్రతులతో సహా), అలాగే ప్రాచీన కాప్టిక్ అనువాదాల్లో లేదు. అయితే ఐదో శతాబ్దానికి చెందిన అలెగ్జాండ్రినస్ ప్రతిలో, లాటిన్ సంప్రదాయంలో, తరువాతి బైజాంటైన్ మెజారిటీ ప్రతుల్లో ఉంది. 48వ వచనంలోని ఇదే మాటలను తరువాతి కాలంలో ఒక లేఖకుడు ఇక్కడ కూడా చేర్చి ఉండే అవకాశం ఎక్కువ.
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: పురుగు
  rationale: కుళ్లుతున్న పదార్థాన్ని తినే పురుగు లేదా లార్వాను సూచిస్తుంది. ‘పురుగు’ అనేది సహజమైన, నేరుగా అర్థమయ్యే తెలుగు పదం; యెషయా 66:24లోని దృశ్యరూపాన్ని కూడా నిలుపుతుంది.
- source_word: τελευτᾷ
  choice: చావదు
  rationale: ఈ క్రియకు ‘అంతమవడం’ లేదా ‘చనిపోవడం’ అనే అర్థాలున్నాయి. జీవిని గురించి చెబుతున్నందున ‘చావదు’ సహజమైన, సందర్భోచితమైన అనువాదం.
- source_word: σβέννυται
  choice: ఆరిపోదు
  rationale: అగ్ని ఆర్పబడకపోవడం లేదా ఆరిపోకపోవడం అనే భావాన్ని వ్యక్తం చేస్తుంది. ‘ఆరిపోదు’ ఆధునిక తెలుగులో సహజంగా ఉండి, అగ్ని నిరంతరం కొనసాగుతుందనే మూలభావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: పురుగు, అగ్ని గురించిన దృశ్యభాషను వ్యాఖ్యానించడం
  choice: మూలంలోని దృశ్యభాషను యథాతథంగా ఉంచడం
  alternative: ఇది సూచించే శిక్ష స్వభావాన్ని వివరణాత్మకంగా అనువదించడం
  rationale: వాక్యం యెషయా 66:24లోని దృశ్యభాషను ఉపయోగిస్తుంది; దాని భావాన్ని ఒక నిర్దిష్ట సిద్ధాంతపరమైన వ్యాఖ్యానంగా మార్చకుండా, మూలంలోని ఉద్రిక్తతను నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘అక్కడ’ సంబంధవాచక భావాన్ని సహజంగా అందిస్తుంది; ‘చావదు’, ‘ఆరిపోదు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటాయి. రెండు సమాంతర వాక్యభాగాల మధ్య అర్థసంబంధాన్ని చూపేందుకు అర్ధవిరామం వాడబడింది.
