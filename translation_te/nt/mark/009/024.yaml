source:
  edition: SBLGNT
  text: ⸀εὐθὺς κράξας ὁ πατὴρ τοῦ ⸀παιδίου ἔλεγεν· ⸀Πιστεύω· βοήθει μου τῇ ἀπιστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/024.yaml
  text: Immediately the father of the child cried out and said[a], “I believe[b]; help my unbelief!”
translation:
  language: te
  text: 'వెంటనే ఆ బాలుని[a] తండ్రి బిగ్గరగా కేక వేసి ఇలా అన్నాడు: “నేను నమ్ముతున్నాను; నా అపనమ్మకం విషయంలో నాకు సహాయం చేయండి!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పిల్లవాని తండ్రి.” గ్రీకు పదం παιδίον సందర్భాన్ని బట్టి “పిల్లవాడు” లేదా “బాలుడు” అని అర్థమవుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నా విశ్వాసలోపం విషయంలో నాకు సహాయం చేయండి.” గ్రీకు పదం ἀπιστία ‘అపనమ్మకం’ను లేదా ‘విశ్వాసలోపం’ను సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: వెంటనే
  rationale: తండ్రి తక్షణ స్పందనను, మార్కు వర్ణనలోని ఆవశ్యకతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: κράξας
  choice: బిగ్గరగా ... అన్నాడు
  rationale: గట్టిగా, ఆవేదనతో పలికిన భావాన్ని తెలుగులో సహజంగా అందిస్తుంది; కేవలం మాటలాడటాన్ని మించిన తీవ్రతను నిలుపుతుంది.
- source_word: ὁ πατὴρ τοῦ παιδίου
  choice: ఆ బాలుని తండ్రి
  rationale: సందర్భంలో ఇతడు కుమారుడని స్పష్టంగా ఉన్నందున παιδίον అనే పదానికి ఇక్కడ ‘బాలుడు’ సహజమైన ఎంపిక.
- source_word: Πιστεύω
  choice: నేను నమ్ముతున్నాను
  rationale: πιστεύω యొక్క విశ్వాసార్థాన్ని నేరుగా వ్యక్తం చేస్తూ, తరువాతి ‘అపనమ్మకం’తో ఉన్న ఉద్దేశపూర్వక ఉద్రిక్తతను నిలుపుతుంది.
- source_word: βοήθει
  choice: సహాయం చేయండి
  rationale: వర్తమాన ఆజ్ఞార్థకంలోని అత్యవసర విన్నపాన్ని గౌరవసూచకమైన, సహజ తెలుగు ప్రయోగంతో తెలియజేస్తుంది.
- source_word: μου τῇ ἀπιστίᾳ
  choice: నా అపనమ్మకంలో నాకు
  rationale: ἀπιστίαలోని అపనమ్మకం లేదా విశ్వాసలోపం అనే అర్థాన్ని నిలుపుతూ, గ్రీకులోని దత్తి నిర్మాణాన్ని సహజ తెలుగులో ‘అపనమ్మకంలో’గా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: Πιστεύω మరియు ἀπιστίᾳ మధ్య ఉన్న ఉద్రిక్తత
  choice: “నేను నమ్ముతున్నాను; నా అపనమ్మకంలో నాకు సహాయం చేయండి!” అనే విరోధాభాసాన్ని నిలుపడం
  alternative: “నేను నమ్ముతున్నాను; నా విశ్వాసలోపాన్ని తొలగించండి!”
  rationale: తండ్రిలో నిజమైన నమ్మకమూ మిగిలిన అపనమ్మకమూ ఒకేసారి ఉన్నాయనే వాక్యంలోని ధార్మిక ఉద్రిక్తతను పరిష్కరించకుండా యథాతథంగా వినిపిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవభరితమైన శైలి. ప్రత్యక్ష సంభాషణలో తండ్రి ఆవేదనను నిలుపుతూ, నమ్మకం–అపనమ్మకం మధ్య ఉన్న విరోధాభాసాన్ని ఉద్దేశపూర్వకంగా సరళీకరించలేదు.
