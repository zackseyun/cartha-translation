translation:
  language: te
  text: ఎందుకంటే ప్రతి ఒక్కరూ అగ్నితో ఉప్పు వేయబడతారు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రతి ఒక్కరూ అగ్నితో రుచికరంగా చేయబడతారు.’ ఈ చిత్రం తీర్పు, శుద్ధీకరణ లేదా బలికి సంబంధించిన భాషను సూచించవచ్చు; లేవీయకాండము 2:13తో పోల్చండి.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రతుల్లో, ‘ప్రతి బలి ఉప్పుతో ఉప్పు వేయబడుతుంది’ అని అదనంగా ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: Πᾶς
  choice: ప్రతి ఒక్కరూ
  rationale: ఇది ఏకవచన పుంలింగ ప్రథమావిభక్తిలో నామవాచకంగా వాడబడింది; సందర్భంలో వ్యక్తులను సూచిస్తున్నందున ‘ప్రతి ఒక్కరూ’ సహజమైన ఎంపిక.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న హెచ్చరికకు కారణం లేదా వివరణను కలుపుతుంది; ఆ తార్కిక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: πυρὶ
  choice: అగ్నితో
  rationale: దత్తివిభక్తి సాధనం లేదా సహచర్య భావాన్ని సూచించవచ్చు. ‘అగ్నితో’ అనేది సాధనం/మాధ్యమం మధ్యనున్న మూలపాఠపు అస్పష్టతను బలవంతంగా పరిష్కరించదు.
- source_word: ἁλισθήσεται
  choice: ఉప్పు వేయబడతారు
  rationale: ἁλίζω యొక్క భవిష్యత్ కర్మణి రూపానికి ‘ఉప్పు వేయడం’ అనే ప్రత్యక్ష భావం ఉంది. ‘అగ్నితో ఉప్పు వేయబడటం’ అనే ఉద్దేశపూర్వకంగా కఠినమైన రూపకాన్ని వ్యాఖ్యానించి సులభీకరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: ‘అగ్నితో ఉప్పు వేయబడటం’ అనే రూపకానికి అర్థం
  choice: తీర్పు, శుద్ధీకరణ, బలి లేదా శిష్యత్వ పరీక్షలలో ఏ ఒక్క అర్థానికీ పరిమితం చేయకుండా రూపకాన్ని యథాతథంగా నిలుపడం.
  alternative: ‘ప్రతి ఒక్కరూ అగ్నిచేత తీర్పు పొందుతారు’; ‘ప్రతి ఒక్కరూ అగ్నిచేత శుద్ధి చేయబడతారు’; ‘ప్రతి ఒక్కరూ ఉప్పు వేసిన బలివలె ప్రతిష్ఠించబడతారు.’
  rationale: గ్రీకు వాక్యం సంక్షిప్తమైనది, సూచనాత్మకమైనది; సమీప సందర్భం పరస్పర సంబంధమున్న అనేక అర్థాలకు అవకాశం ఇస్తుంది. అందువల్ల ప్రధాన పాఠం ఆ ధార్మిక ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి. అరుదైన రూపకాన్ని సరళీకరించకుండా, సాధారణ పాఠకుడు అర్థం చేసుకోగల ‘ఉప్పు వేయబడతారు’ అనే ప్రత్యక్ష ప్రయోగాన్ని ఉపయోగించాం.
