lexical_decisions:
- source_word: ὅπου
  choice: అక్కడ
  rationale: ముందు ప్రస్తావించిన స్థలాన్ని సూచించే సంబంధార్థక అవ్యయం; తెలుగులో వాక్యారంభంలో ‘అక్కడ’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ὁ σκώληξ αὐτῶν
  choice: వారి పురుగు
  rationale: σκώληξ అనే పదానికి విస్తృతమైన, స్థిరమైన తెలుగు సమానార్థకం ‘పురుగు’; αὐτῶν లోని వ్యక్తిగత సంబంధాన్ని ‘వారి’ నిలుపుతుంది. ‘మృతదేహాలను తినే పురుగు’ అని విపులీకరిస్తే మూలంలో లేని నిర్దిష్టత చేరుతుంది.
- source_word: οὐ τελευτᾷ
  choice: చావదు
  rationale: τελευτάω కు ‘అంతమవడం’ అనే అర్థం ఉన్నా, పురుగు కర్తగా ఉన్నప్పుడు ‘చావదు’ సహజమైన భావం; వాక్యంలోని తీవ్రమైన దృశ్యాన్ని కూడా నిలుపుతుంది.
- source_word: τὸ πῦρ
  choice: అగ్ని
  rationale: మూల నామవాచకానికి నేరమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం.
- source_word: οὐ σβέννυται
  choice: ఆరిపోదు
  rationale: వర్తమాన నిషేధాత్మక భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది; అగ్ని ఆరని స్థితిని తెలిపి గ్రీకు కర్మణి రూపం ఉద్దేశాన్ని నిలుపుతుంది.
theological_decisions:
- issue: తీర్పుకు సంబంధించిన పురుగు, అగ్ని దృశ్యాల స్వభావం
  choice: పురుగు, అగ్ని అనే స్పష్టమైన దృశ్యాలను వ్యాఖ్యానించకుండా యథాతథంగా నిలుపడం.
  alternative: ఇది నిరంతర చైతన్య శిక్షను, పూర్తిగా నాశనం చేయడాన్ని, లేదా కేవలం రూపకాలంకారమైన అవమానాన్ని సూచిస్తుందని అనువాదంలోనే నిర్ధారించడం.
  rationale: వచనం యెషయా 66:24ను ప్రతిధ్వనిస్తూ తీర్పును బలమైన దృశ్యాలతో వివరిస్తుంది; అయితే ఆ దృశ్యాలపై ఉన్న విస్తృత సిద్ధాంత వివాదాలను ఈ ఒక్క వాక్యం తేల్చదు. అందువల్ల అనువాదం ఆ ఉత్కంఠను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన శైలి వాడబడింది. ‘పురుగు,’ ‘చావదు,’ ‘ఆరిపోదు’ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదాలు; మూలంలోని సమాంతర నిర్మాణం, కఠినమైన తీర్పు దృశ్యం నిలుపబడ్డాయి.
