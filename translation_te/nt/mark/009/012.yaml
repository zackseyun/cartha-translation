id: MRK.9.12
reference: Mark 9:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἔφη αὐτοῖς· Ἠλίας μὲν ἐλθὼν πρῶτον ⸀ἀποκαθιστάνει πάντα, καὶ πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου ἵνα πολλὰ πάθῃ καὶ ⸀ἐξουδενηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/012.yaml
  text: He said to them[a], “Elijah indeed, having come first, restores all things. And how is it written about the Son of Man that he should suffer many things and be treated with contempt?”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “ఏలీయా మొదట వచ్చి అన్నిటినీ పునరుద్ధరిస్తాడు. మరి మనుష్యకుమారుని గురించి, ఆయన ఎన్నో బాధలు అనుభవించి తృణీకరించబడాలని[a] ఎలా రాయబడి ఉంది?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చులకనగా చూడబడాలని,’ ‘విలువలేనివానిగా పరిగణించబడాలని.’ గ్రీకు క్రియ ఒకరిని ఏమాత్రం విలువలేనివానిగా భావించి నిరాదరించడం అనే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτοῖς
  choice: ఆయన వారితో ఇలా అన్నాడు
  rationale: సాధారణ కథన వాక్యప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; αὐτοῖς అనే పరోక్ష కర్మను కూడా స్పష్టంగా ఉంచుతుంది.
- source_word: Ἠλίας
  choice: ఏలీయా
  rationale: తెలుగు బైబిలు సంప్రదాయంలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ἐλθὼν πρῶτον
  choice: మొదట వచ్చి
  rationale: ప్రధాన క్రియకు ముందు జరిగే చర్యను సూచించే గ్రీకు కృదంత నిర్మాణాన్ని సహజమైన తెలుగు అసమాపక క్రియతో నిలుపుతుంది.
- source_word: ἀποκαθιστάνει πάντα
  choice: అన్నిటినీ పునరుద్ధరిస్తాడు
  rationale: వర్తమానకాల సాధారణ ప్రకటనను నిలుపుతూ, తిరిగి సరైన స్థితికి తీసుకురావడం అనే భావాన్ని ‘పునరుద్ధరిస్తాడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు … అని ఆయన గురించి ఎలా రాయబడి ఉంది?
  rationale: γέγραπται అనే లేఖనసూత్రాన్ని ‘రాయబడి ఉంది’గా ఉంచి, ἐπίని ‘గురించి’ అనే అర్థంలో అనువదిస్తుంది; ప్రశ్నారూపాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: సువార్తల్లోని ప్రాముఖ్యమైన బిరుదును వ్యాఖ్యానాత్మక విస్తరణ లేకుండా సంప్రదాయబద్ధంగా అనువదిస్తుంది.
- source_word: πολλὰ πάθῃ
  choice: ఎన్నో బాధలు అనుభవించి
  rationale: πολλά సూచించే అనేక కష్టాల భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐξουδενηθῇ
  choice: తృణీకరించబడాలని
  rationale: ఎవరినైనా విలువలేనివానిగా ఎంచి నిరాదరించడం అనే గ్రీకు క్రియ యొక్క నిష్క్రియార్థాన్ని సంక్షిప్తంగా, గంభీరంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఏలీయా పునరుద్ధరణ కార్యానికీ మనుష్య కుమారుని బాధలకూ మధ్య ఉన్న సంబంధం
  choice: రెండవ వాక్యాన్ని ‘మరి … ఎలా రాయబడి ఉంది?’ అనే నిజమైన అలంకారిక ప్రశ్నగా నిలుపడం
  alternative: ‘అయినప్పటికీ’ వంటి స్పష్టమైన విరోధసూచక పదాన్ని చేర్చి సంబంధాన్ని ముందుగానే వివరించడం
  rationale: గ్రీకు పాఠం పునరుద్ధరణను, బాధను పక్కపక్కన ఉంచి ప్రశ్నిస్తుంది; వాటి మధ్యనున్న భావ ఉద్రిక్తతను అనువాదమే పరిష్కరించకూడదు.
- issue: ‘మనుష్య కుమారుడు’ అనే బిరుదు ఎవరిని సూచిస్తుంది
  choice: బిరుదును ‘మనుష్య కుమారుడు’గానే ఉంచడం
  alternative: ‘మెస్సీయ’ లేదా ‘యేసు’ అని వ్యాఖ్యానాత్మకంగా విస్తరించడం
  rationale: ఈ బిరుదుకు క్రీస్తుసంబంధమైన ప్రాముఖ్యత ఉన్నప్పటికీ, మూలపాఠంలోని రూపమే అనువాదంలో నిలవాలి.
- issue: ἵνα యొక్క భావం
  choice: ‘… అనుభవించి, తృణీకరించబడాలని’ అని లేఖనంలో రాసి ఉన్న విషయంగా వ్యక్తం చేయడం
  alternative: కేవలం ఉద్దేశార్థంగా ‘అలా జరగడానికి’ అని అనువదించడం
  rationale: ఇక్కడ ἵνα లేఖనంలో చెప్పబడిన నిరీక్షిత విషయాన్ని పరిచయం చేస్తుంది; సంకుచితమైన ఉద్దేశార్థాన్ని బలవంతంగా రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే లేఖనసూత్రం మరియు ‘మనుష్య కుమారుడు’ వంటి కీలక పదాల్లో గంభీరతను నిలుపుతూ రూపొందించబడింది. పాదసూచిక గుర్తు దానికి సంబంధించిన ‘తృణీకరించబడాలని’ అన్న పదం వెంట ఉంచబడింది.
