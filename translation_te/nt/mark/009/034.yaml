  yaml_path: translation/nt/mark/009/034.yaml
  text: But they kept silent[a], because on the road they had argued with one another about who was greater.
translation:
  language: te
  text: అయితే వారు మౌనంగా ఉండిపోయారు. ఎందుకంటే దారిలో తమలో ఎవరు మరింత గొప్పవారు[a] అనే విషయమై ఒకరితో ఒకరు వాదించుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎవరు అందరికంటే గొప్పవారు.” గ్రీకులో “గొప్ప” అనే పదం తులనాత్మక రూపంలో ఉంది; అయితే ఈ సందర్భంలో దాన్ని అత్యుత్తమార్థంలో కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπων
  choice: మౌనంగా ఉండిపోయారు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగిన మౌనాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: διελέχθησαν
  choice: వాదించుకున్నారు
  rationale: సాధారణంగా చర్చించుకోవడం అనే అర్థం సాధ్యమైనా, ఎవరు గొప్పవారు అనే పోటీ సందర్భం పరస్పర వాదనను సూచిస్తుంది.
- source_word: πρὸς ἀλλήλους
  choice: ఒకరితో ఒకరు
  rationale: పరస్పర చర్యను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐν τῇ ὁδῷ
  choice: దారిలో
  rationale: ప్రయాణ సందర్భానికి సరిపోయే సహజమైన తెలుగు ప్రయోగం.
- source_word: τίς μείζων
  choice: తమలో ఎవరు మరింత గొప్పవారు
  rationale: మూలంలోని తులనాత్మక రూపమైన μείζωνను ‘మరింత గొప్పవారు’గా నిలుపుతూ, పోలిక శిష్యుల మధ్యనిదని సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: οἱ δὲ
  choice: అయితే వారు
  rationale: యేసు ప్రశ్నకు వారి ప్రతిస్పందనలోని స్వల్ప వ్యతిరేకతను δέకు తగినట్లు తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: వారు మౌనంగా ఉండటానికి కారణాన్ని γάρ పరిచయం చేస్తున్నందున స్పష్టమైన కారణార్థక అనుసంధానం వాడబడింది.
theological_decisions:
- issue: μείζων అనే తులనాత్మక రూపాన్ని అత్యుత్తమార్థకంగా అనువదించాలా
  choice: ఎవరు మరింత గొప్పవారు
  alternative: ఎవరు అందరికంటే గొప్పవారు
  rationale: శిష్యుల హోదా పోటీ భావం రెండు విధాలా వ్యక్తమవుతుంది; అయితే గ్రీకు పాఠంలోని తులనాత్మక రూపాన్ని ప్రధాన పాఠంలో నిలిపి, సహజమైన అత్యుత్తమార్థక పఠనాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘మరింత గొప్పవారు’ కొద్దిగా గుర్తించదగిన తులనాత్మక నిర్మాణమైనప్పటికీ, మూలపాఠంలోని నిజమైన రూపభేదాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది.
