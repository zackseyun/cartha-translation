id: MRK.9.22
reference: Mark 9:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πολλάκις ⸂καὶ εἰς πῦρ αὐτὸν⸃ ἔβαλεν καὶ εἰς ὕδατα ἵνα ἀπολέσῃ αὐτόν· ἀλλ’ εἴ τι ⸀δύνῃ, βοήθησον ἡμῖν σπλαγχνισθεὶς ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/022.yaml
  text: And many times it has thrown him both into fire and into waters to destroy him[a]. But if you can do anything, help us[b], having compassion on us.
translation:
  language: te
  text: అది అతన్ని నాశనం చేయడానికి చాలాసార్లు అతన్ని అగ్నిలోకీ, నీళ్లలోకీ పడేసింది.[a] కానీ, మీరు ఏమైనా చేయగలిగితే, మాపై కనికరం చూపి మాకు సహాయం చేయండి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో ‘నీళ్లలోకి’ అనే పదం బహువచనంలో ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మాపై జాలిపడి మాకు సహాయం చేయండి’ లేదా ‘మాపై దయచూపి మాకు సహాయం చేయండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάκις
  choice: చాలాసార్లు
  rationale: పదేపదే జరిగిన సంఘటనలను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἔβαλεν
  choice: పడేసింది
  rationale: ఇక్కడ కర్త బాలుణ్ణి పట్టుకున్న అపవిత్రాత్మ; పునరావృతమైన గత చర్యను తెలుగు సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: εἰς πῦρ ... καὶ εἰς ὕδατα
  choice: మంటలోనూ, నీళ్లలోనూ
  rationale: రెండు గమ్యాలను సమాంతరంగా, ఉద్ఘాటనతో చూపుతుంది. గ్రీకులో ὕδατα బహువచనం అయినా, తెలుగులో ‘నీళ్లు’ సహజంగానే బహువచన రూపం.
- source_word: ἵνα ἀπολέσῃ αὐτόν
  choice: అతన్ని నాశనం చేయాలని
  rationale: ἵνα ఉద్దేశాన్ని నిలుపుతుంది; ἀπόλλυμι భావాన్ని కేవలం ‘చంపడం’కు కుదించకుండా విస్తృత విధ్వంసార్థంతో అందిస్తుంది.
- source_word: ἀλλ’ εἴ τι δύνῃ
  choice: అయినా, నువ్వు ఏమైనా చేయగలిగితే
  rationale: τι ను ‘ఏమైనా’గా స్పష్టంగా ప్రతిబింబించి, యేసు సామర్థ్యం గురించి తండ్రి పలికిన సందేహభరిత విజ్ఞప్తిని అలాగే ఉంచుతుంది.
- source_word: βοήθησον ἡμῖν
  choice: మాకు సహాయం చేయి
  rationale: తక్షణ సహాయం కోరే ఆజ్ఞార్థక విజ్ఞప్తిని సూటిగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: σπλαγχνισθεὶς ἐφ’ ἡμᾶς
  choice: మామీద కనికరపడి
  rationale: లోతైన జాలిని తెలిపే క్రియార్థాన్ని సహజమైన తెలుగు పూర్వకాలిక క్రియతో నిలుపుతుంది.
theological_decisions:
- issue: యేసు సామర్థ్యం గురించి తండ్రి విజ్ఞప్తిలోని సందేహం
  choice: ‘నువ్వు ఏమైనా చేయగలిగితే’ అని నేరుగా అనువదించడం
  alternative: ‘నీకు సాధ్యమైతే’ లేదా సందేహాన్ని తగ్గించే మరింత విశ్వాసపూర్వక వాక్యం
  rationale: గ్రీకు వాక్యం తండ్రి సంకోచాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది. తరువాతి సంభాషణకు ముఖ్యమైన ఈ ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా అలాగే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన సంభాషణ శైలి. తండ్రి యేసుతో నేరుగా మాట్లాడుతున్నందున ‘నువ్వు/చేయి’ రూపాలు సహజంగా వాడబడ్డాయి; అవి అగౌరవాన్ని సూచించవు.
