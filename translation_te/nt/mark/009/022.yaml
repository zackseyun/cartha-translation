revisions:
- from: అది అతన్ని నాశనం చేయాలని చాలాసార్లు మంటలోనూ, నీళ్లలోనూ పడేసింది.[a] అయినా, నువ్వు ఏమైనా చేయగలిగితే, మామీద కనికరపడి మాకు సహాయం చేయి.[b]
  to: అది అతన్ని నాశనం చేయడానికి చాలాసార్లు అతన్ని అగ్నిలోకీ, నీళ్లలోకీ పడేసింది.[a] కానీ, మీరు ఏమైనా చేయగలిగితే, మాపై కనికరం చూపి మాకు సహాయం చేయండి.[b]
  rationale: 'The revision preserves every element of the Greek: repeated action, movement into fire and waters, destructive purpose, the father''s unsoftened ‘if you can do anything,’ the imperative plea, and the participial appeal for compassion. It also uses standard Telugu directional forms and a respectful conversational register.'
  reviewer_model: gpt-5.6-terra
