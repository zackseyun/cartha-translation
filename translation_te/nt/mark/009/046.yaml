  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన శైలి వాడబడింది. మూలంలోని సమాంతర నిర్మాణం—‘పురుగు చావదు / అగ్ని ఆరదు’—నిలుపబడింది.
