  terminology: ‘పురుగు’ σκώληξ‌కు తటస్థమైన, యెషయా 66:24 ప్రతిధ్వనిని నిలిపే సరైన పదం. ‘చావదు’ మరియు ‘ఆరదు’ వరుసగా τελευτᾷ మరియు σβέννυταιలకు సందర్భోచితమైన అనువాదాలు. పాఠాంతర విమర్శాత్మక గమనిక ఇంగ్లీషు ఆడిట్ ట్రైల్‌కు అనుగుణంగా ఉంది; 44, 48 వచనాల పునరావృత్తిని సరిగ్గా సూచిస్తుంది.
