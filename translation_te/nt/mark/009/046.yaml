  text: అక్కడ[a] వారి పురుగు చావదు, అగ్ని ఆరదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనం అత్యంత ప్రాచీన గ్రీకు ప్రతుల్లో—నాలుగో శతాబ్దానికి చెందిన సీనాయిటికస్, వాటికానస్ ప్రతులు సహా—మరియు ప్రాచీన కాప్టిక్ అనువాదాల్లో లేదు. అయితే బైజాంటైన్ అధికసంఖ్యాక ప్రతుల సంప్రదాయంలోనూ లాటిన్ సంప్రదాయంలోనూ ఉంది. 48వ వచనంలోని (అలాగే 44వ వచనంలోని) అవే మాటలను తిరిగి చేర్చిన తరువాతి లేఖకుని చేర్పు కావడానికి ఎక్కువ అవకాశం ఉంది.
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: పురుగు
  rationale: కుళ్లుతున్న పదార్థాన్ని తినే పురుగు లేదా కీటకాన్ని సూచిస్తుంది. యెషయా 66:24తో ఉన్న ప్రత్యక్ష సంబంధాన్ని నిలుపుతూ, సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే పదంగా ‘పురుగు’ ఎంచుకోబడింది.
- source_word: τελευτᾷ
  choice: చావదు
  rationale: τελευτάω అంటే ‘అంతమవడం’ లేదా ‘చనిపోవడం’. ఈ సందర్భంలో నిరంతర వర్తమాన భావాన్ని సహజమైన తెలుగులో ‘చావదు’ స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: σβέννυται
  choice: ఆరదు
  rationale: σβέννυμι అంటే మంటను ఆర్పడం లేదా ఆరిపోవడం. అగ్నితో సహజంగా వాడే ‘ఆరదు’ అనే రూపం, అది అంతం కాకుండా కొనసాగుతుందనే తీర్పు చిత్రణను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ὅπου
  choice: అక్కడ
  rationale: ముందటి వాక్యంలోని స్థలాన్ని సూచించే సంబంధార్థక అవ్యయాన్ని ఆధునిక తెలుగులో సహజంగా ‘అక్కడ’ అని అనువదించాం.
