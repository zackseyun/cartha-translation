  source_fidelity: బైజాంటైన్ గ్రీకు పాఠంలోని ὅπου, ὁ σκώληξ αὐτῶν, οὐ τελευτᾷ, καὶ τὸ πῦρ οὐ σβέννυται అనే అన్ని అంశాలను అనువాదం విశ్వసనీయంగా ప్రతిబింబిస్తుంది. ‘వారి పురుగు చావదు, అగ్ని ఆరదు’ మూలంలోని సమాంతర నిరాకరణను, వర్తమాన-నిరంతర భావాన్ని సహజంగా నిలుపుతుంది.
