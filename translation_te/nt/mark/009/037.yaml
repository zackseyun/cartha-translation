id: MRK.9.37
reference: Mark 9:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὃς ⸀ἂν ἓν τῶν τοιούτων παιδίων δέξηται ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται· καὶ ὃς ⸁ἂν ἐμὲ ⸀δέχηται, οὐκ ἐμὲ δέχεται ἀλλὰ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/037.yaml
  text: Whoever receives one of such children in my name receives me; and whoever receives me receives not me, but the one who sent me.
translation:
  language: te
  text: “ఎవరైనా ఇలాంటి చిన్నపిల్లల్లో ఒకరిని నా పేరున స్వీకరిస్తే, నన్ను స్వీకరిస్తాడు[a]; ఎవరైనా నన్ను స్వీకరిస్తే, నన్ను కాదు, నన్ను పంపినవానినే స్వీకరిస్తాడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘స్వీకరించు’కు బదులుగా ‘ఆహ్వానించి ఆదరించు’ అని కూడా అనువదించవచ్చు. ఈ వచనంలోని ప్రతి భాగంలో ఒకే గ్రీకు క్రియ పునరావృతమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃς ἂν
  choice: స్వీకరించేవాడు
  rationale: ἄνతో కూడిన సంబంధ సర్వనామం సాధారణంగా ఎవరైనా అనే అనిర్దిష్ట భావాన్ని ఇస్తుంది. తెలుగులో పునరుక్త నిర్మాణాన్ని సహజంగా ఉంచేందుకు ‘స్వీకరించేవాడు’ అని అనువదించాం.
- source_word: ἓν τῶν τοιούτων παιδίων
  choice: ఇలాంటి చిన్నపిల్లల్లో ఒకరిని
  rationale: ἓν ... παιδίων లోని విభాజక నిర్మాణాన్ని ‘చిన్నపిల్లల్లో ఒకరిని’ నిలుపుతుంది; τοιούτων లోని ‘ఈ విధమైన/ఇలాంటి’ గుణార్థాన్ని ‘ఇలాంటి’ తెలియజేస్తుంది. ‘ఈ చిన్నపిల్లల్లో’ అని అనడం మూలంలో లేని నిర్దిష్ట సూచనను బలపరచవచ్చు.
- source_word: δέξηται / δέχεται / δέχηται
  choice: స్వీకరించేవాడు / స్వీకరిస్తాడు
  rationale: δέχομαι అంటే స్వీకరించడం, ఆహ్వానించడం అనే భావాలు ఉండవచ్చు. ఒకే గ్రీకు క్రియ పునరావృతమవుతున్నందున తెలుగు అంతటా ‘స్వీకరించు’ అనే పదాన్నే వాడి వాక్యంలోని సంబంధ శృంఖలాన్ని నిలిపాం.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: నా పేరున
  rationale: ఈ పదబంధం యేసు పేరు కారణంగా లేదా ఆయనతో సంబంధం ఆధారంగా స్వీకరించడాన్ని సూచిస్తుంది. ‘నా పేరున’ సంక్షిప్తంగా ఉండి ఆ సంబంధం, అధికార ప్రతిధ్వని రెండింటినీ నిలుపుతుంది.
- source_word: οὐκ ἐμὲ δέχεται ἀλλὰ
  choice: నన్ను కాదు ... స్వీకరిస్తాడు
  rationale: οὐκ ... ἀλλά లోని బలమైన వ్యత్యాసాన్ని వివరణాత్మకంగా ‘నన్ను మాత్రమే కాదు’ అని మార్చకుండా యథాతథంగా నిలిపాం.
- source_word: τὸν ἀποστείλαντά με
  choice: నన్ను పంపినవానినే
  rationale: ఆర్టికల్‌తో ఉన్న కృదంతాన్ని తెలుగులో సహజమైన వ్యక్తివాచక పదబంధంగా అనువదించాం. ‘-నే’ గ్రీకు ἀλλά తరువాతి ప్రధాన వ్యత్యాసాన్ని స్పష్టంగా వినిపిస్తుంది.
theological_decisions:
- issue: ‘నన్ను కాదు, నన్ను పంపినవానిని’ అనే చివరి వ్యత్యాసం
  choice: మూలంలోని నిరాకరణ–వ్యత్యాస నిర్మాణాన్ని ‘నన్ను కాదు, నన్ను పంపినవానినే’గా నిలిపాం.
  alternative: ‘నన్ను మాత్రమే కాదు, నన్ను పంపినవానిని కూడా’ అని వివరణాత్మకంగా అనువదించడం.
  rationale: గ్రీకు వాక్యం నిజంగా ‘నన్ను కాదు, ... పంపినవానిని’ అంటుంది. భావాన్ని సులభతరం చేయాలనే ఉద్దేశంతో ‘మాత్రమే/కూడా’ చేరిస్తే మూలంలోని ఉద్దేశపూర్వక theological tension తగ్గిపోతుంది. అందువల్ల యేసును స్వీకరించడం లేదనే సంపూర్ణ నిరాకరణగా ముందే పరిష్కరించకుండా, సంబంధాత్మక బలాన్ని పాఠకుడికి అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ రచించబడింది. ‘ఇలాంటి చిన్నపిల్లల్లో ఒకరిని’ కొద్దిగా విశదమైన నిర్మాణమైనప్పటికీ, మూలంలోని విభాజక బహువచనాన్నీ గుణార్థాన్నీ కాపాడుతుంది. ఉద్ధరణ చిహ్నాలు యేసు ప్రత్యక్ష వాక్యాన్ని సూచిస్తాయి.
