review_pass:
  verdict: revise
  source_fidelity: The temporal participle is better represented by ‘ప్రవేశించిన తర్వాత’ than by ‘వెళ్లినప్పుడు,’ since entry precedes the disciples’ question. The imperfect ἐπηρώτων should be retained where natural as an ongoing/repeated questioning action. The final neuter pronoun is suitably rendered ‘దానిని,’ with the contextual referent clarified only in the footnote.
  naturalness: The revised wording is modern, clear Telugu. ‘ఏకాంతంగా’ appropriately conveys κατ’ ἰδίαν, and ‘బయటకు వెళ్లగొట్టలేకపోయాం’ naturally communicates the exorcistic force of ἐκβαλεῖν.
  terminology: ‘శిష్యులు’ is appropriate Gospel terminology. The text does not introduce ‘ఆత్మ’ into the verse itself; the footnote identifies the likely contextual referent as an అపవిత్రాత్మ while preserving the alternative reference to the boy.
  issues:
  - severity: medium
    issue: The temporal relation and imperfect aspect are weakened in the draft.
    rationale: ‘వెళ్లినప్పుడు’ can suggest simultaneity, whereas the aorist participle sets completed entry in the background. ‘అడిగారు’ omits the imperfect’s ongoing/repeated nuance without a strong Telugu idiomatic necessity.
  revised_text: ఆయన ఇంట్లోకి ప్రవేశించిన తర్వాత, ఆయన శిష్యులు ఆయనను ఏకాంతంగా, “మేము దానిని[a] ఎందుకు బయటకు వెళ్లగొట్టలేకపోయాం?” అని అడుగుతూ ఉన్నారు.
