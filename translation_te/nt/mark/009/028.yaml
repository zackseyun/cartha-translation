source:
  edition: SBLGNT
  text: καὶ ⸂εἰσελθόντος αὐτοῦ⸃ εἰς οἶκον οἱ μαθηταὶ αὐτοῦ ⸂κατ’ ἰδίαν ἐπηρώτων αὐτόν⸃· Ὅτι ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/028.yaml
  text: And when he had entered the house[a], his disciples were asking him privately, “Why were we not able to cast it out?”
translation:
  language: te
  text: ఆయన ఇంట్లోకి ప్రవేశించిన తర్వాత, ఆయన శిష్యులు ఆయనను ఏకాంతంగా, “మేము దానిని[a] ఎందుకు బయటకు వెళ్లగొట్టలేకపోయాం?” అని అడుగుతూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతనిని’; ఈ సర్వనామం అపవిత్రాత్మను కాక బాలుణ్ణి సూచిస్తుందని తీసుకుంటే ఇలా అనువదించవచ్చు. అయితే గ్రీకులో ఇది నపుంసక లింగంలో ఉంది కాబట్టి, అపవిత్రాత్మను సూచించడమే మరింత సహజం.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: ఆయన ... వెళ్లినప్పుడు
  rationale: కాలాన్ని సూచించే aorist participle ప్రధాన క్రియకు నేపథ్యంగా, ఆయన ఇంట్లోకి ప్రవేశించిన తర్వాత శిష్యులు ప్రశ్నించారని తెలియజేస్తుంది. సహజమైన తెలుగులో దీనిని ‘వెళ్లినప్పుడు’గా ఇచ్చాం.
- source_word: εἰς οἶκον
  choice: ఇంట్లోకి
  rationale: గ్రీకులో οἶκονకు నిర్దిష్ట ఉపపదం లేకపోయినా, కథన సందర్భంలో తెలిసిన నివాసస్థలాన్ని సూచిస్తుంది. తెలుగు వాడుకలో ‘ఇంట్లోకి’ సహజంగా ఉంటుంది; ‘ఒక ఇంట్లోకి’ అనవసరమైన అనిర్దిష్టతను కలిగిస్తుంది.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ఆయన శిష్యులు
  rationale: μαθηταί యేసును అనుసరించి నేర్చుకునేవారి సంబంధాన్ని సూచిస్తుంది; సువార్తల సందర్భంలో ‘శిష్యులు’ స్థిరమైన, స్పష్టమైన పదం.
- source_word: κατ’ ἰδίαν
  choice: ఏకాంతంగా
  rationale: ఇతరులకు వేరుగా, వ్యక్తిగతంగా ప్రశ్నించారనే భావాన్ని సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπηρώτων
  choice: అడిగారు
  rationale: గ్రీకు imperfect ప్రశ్నించే చర్యను నేపథ్యంగా చూపుతుంది. తెలుగులో ‘అడుగుతూ ఉన్నారు’ ఇక్కడ కృత్రిమంగా వినిపించేందున, కథనానికి సహజమైన ‘అడిగారు’ను ఎంచుకున్నాం; సందర్భం వ్యక్తిగత సంభాషణను స్పష్టంగా ఉంచుతుంది.
- source_word: Ὅτι
  choice: ఎందుకు
  rationale: ఈ ప్రశ్నార్థక సందర్భంలో ὅτι కారణాన్ని అడిగే ‘ఎందుకు’ అనే అర్థంలో వాడబడింది.
- source_word: ἠδυνήθημεν
  choice: లేకపోయాం
  rationale: δύναμαι సామర్థ్యాన్ని సూచిస్తుంది. ‘వెళ్లగొట్టలేకపోయాం’ అనే సంయుక్త రూపం ‘మాకు సాధ్యం కాలేదు’ అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκβαλεῖν
  choice: వెళ్లగొట్టడం
  rationale: దయ్యం లేదా అపవిత్రాత్మను ఒకరి నుండి బయటకు పంపే సందర్భంలో ἐκβάλλωకు ‘వెళ్లగొట్టు’ స్పష్టమైన, సాధారణ తెలుగు సమానం.
- source_word: αὐτό
  choice: దానిని
  rationale: αὐτό నపుంసక ఏకవచనం. అందువల్ల ఇది మగ బాలునికన్నా అపవిత్రాత్మను సూచించడం మరింత సహజం; తెలుగు ‘దానిని’ ఈ వ్యాకరణ సూచనను నిలుపుతుంది.
theological_decisions:
- issue: చివరి సర్వనామమైన αὐτό దేనిని సూచిస్తుంది?
  choice: అది అపవిత్రాత్మను/దయ్యాన్ని సూచిస్తుందని తీసుకొని ‘దానిని’ అని అనువదించాం.
  alternative: అది బాధపడుతున్న బాలుని సూచిస్తుందని తీసుకొని ‘అతనిని’ అని అనువదించవచ్చు.
  rationale: గ్రీకు సర్వనామం నపుంసక లింగంలో ఉంది; కాబట్టి పుంలింగమైన బాలునికన్నా అపవిత్రాత్మ లేదా దయ్యమే దాని సహజ పూర్వపదం. అయితే సందర్భపరమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా అసలులోని సాధ్యమైన సందిగ్ధతను దాచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా సువార్త కథనానికి తగిన గౌరవప్రదమైన శైలిలో అనువదించాం. ‘ఏకాంతంగా’ వ్యక్తిగత సంభాషణను తెలియజేస్తుంది; చివరి సర్వనామంలోని అసలు భాషా సందిగ్ధతను పాదసూచికలో సంరక్షించాం.
