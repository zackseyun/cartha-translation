revisions:
- from: ఆయన ఇంట్లోకి వెళ్లినప్పుడు, ఆయన శిష్యులు ఏకాంతంగా ఆయనను, “మేము దానిని[a] ఎందుకు వెళ్లగొట్టలేకపోయాం?” అని అడిగారు.
  to: ఆయన ఇంట్లోకి ప్రవేశించిన తర్వాత, ఆయన శిష్యులు ఆయనను ఏకాంతంగా, “మేము దానిని[a] ఎందుకు బయటకు వెళ్లగొట్టలేకపోయాం?” అని అడుగుతూ ఉన్నారు.
  rationale: ఈ సవరణ గ్రీకు కాలసంబంధాన్ని (‘ప్రవేశించిన తర్వాత’) మరియు imperfect క్రియ యొక్క కొనసాగుతున్న/పునరావృత భావాన్ని (‘అడుగుతూ ఉన్నారు’) స్పష్టంగా ఉంచుతుంది. చివరి సర్వనామానికి ‘దానిని’ అనే నపుంసక రూపాన్ని నిలిపి, సందర్భంలో సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో సంక్షిప్తంగా, తటస్థంగా ఇచ్చింది.
