id: MRK.9.39
reference: Mark 9:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Μὴ κωλύετε αὐτόν, οὐδεὶς γάρ ἐστιν ὃς ποιήσει δύναμιν ἐπὶ τῷ ὀνόματί μου καὶ δυνήσεται ταχὺ κακολογῆσαί με·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/039.yaml
  text: But Jesus said[a], “Do not stop him[b], for there is no one who will do a mighty work in my name and soon be able to speak evil of me.”
translation:
  language: te
  text: 'అయితే యేసు ఇలా అన్నాడు: “అతణ్ణి అడ్డుకోకండి. ఎందుకంటే, నా పేరున శక్తివంతమైన కార్యం చేసి, త్వరలో నా గురించి చెడుగా మాట్లాడగలిగేవాడు ఎవరూ లేరు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κωλύετε
  choice: అడ్డుకోకండి
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞారూపం ఇక్కడ నిషేధాన్ని సూచిస్తుంది. శిష్యులు ఆ వ్యక్తిని ఆపడానికి ప్రయత్నించిన సందర్భంలో ‘అడ్డుకోకండి’ సహజమైన ఆధునిక తెలుగు.
- source_word: δύναμιν
  choice: శక్తివంతమైన కార్యం
  rationale: δύναμις ప్రాథమికంగా శక్తిని సూచిస్తూ సువార్తలలో అసాధారణమైన శక్తికార్యాన్ని కూడా సూచిస్తుంది. ‘శక్తివంతమైన కార్యం’ అనే అనువాదం దానిని కేవలం ‘అద్భుతం’గా సంకుచితం చేయకుండా మూలపదంలోని శక్తి భావాన్ని నిలుపుతుంది.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: నా పేరున
  rationale: ఈ సందర్భంలో యేసు పేరును ఉచ్చరించి లేదా ఆయన పేరుతో అనుసంధానమైన అధికారంపై ఆధారపడి చేయడాన్ని సూచిస్తుంది. ‘నా పేరున’ సంక్షిప్తంగా, సహజంగా ఈ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ταχὺ
  choice: వెంటనే
  rationale: ఇది ఆ తరువాత సమీప కాలంలో అలా చేయగల సామర్థ్యాన్ని సూచిస్తుంది. ‘వెంటనే’ కాలసమీపతను స్పష్టంగా తెలియజేస్తుంది; చర్య జరిగిన ఖచ్చిత క్షణాన్నే తప్పనిసరిగా నిర్దేశించదు.
- source_word: κακολογῆσαί
  choice: నా గురించి చెడుగా మాట్లాడగలిగేవాడు
  rationale: κακολογέω అంటే ఒకరి గురించి చెడుగా మాట్లాడడం, దూషించడం లేదా నిందించడం. ప్రధాన పాఠంలోని పదబంధం మూలంలోని విస్తృత భావాన్ని నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: οὐδεὶς γάρ ἐστιν ὃς
  choice: ఎందుకంటే … ఎవడూ లేడు
  rationale: కారణసూచకమైన γάρను, ‘ఎవరూ లేరు’ అనే గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగు వాక్యక్రమంలో నిలుపుతుంది.
- source_word: δυνήσεται
  choice: మాట్లాడగలిగేవాడు
  rationale: భవిష్యత్ సామర్థ్యాన్ని సూచించే δυνήσεται భావాన్ని తెలుగు సామర్థ్యరూపంతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యేసు పేరున జరిగే కార్య స్వభావం
  choice: ‘శక్తివంతమైన కార్యం’ అని అనువదించబడింది.
  alternative: ‘అద్భుతం’ లేదా ‘గొప్ప కార్యం’
  rationale: మూలంలోని δύναμις శక్తి మరియు అసాధారణ కార్యం అనే భావాలను కలిగి ఉంది. ఎటువంటి కార్యమో అవసరానికి మించి నిర్దిష్టం చేయకుండా ఆ భావవ్యాప్తిని ఈ ఎంపిక నిలుపుతుంది.
- issue: ఆ వ్యక్తికి యేసుతో ఉన్న సంబంధం
  choice: ఆ వ్యక్తి యేసు పేరున కార్యం చేయడం, ఆ వెంటనే యేసు గురించి చెడుగా మాట్లాడలేకపోవడం మాత్రమే వర్ణించబడింది.
  alternative: అతడు సంపూర్ణ శిష్యుడని లేదా కేవలం అవకాశవాది అని సూచించే వివరణాత్మక అనువాదం
  rationale: వచనం ఆ వ్యక్తి శిష్యత్వ స్థితి లేదా సంపూర్ణ బోధాపరమైన ఆమోదం గురించి తీర్పు ఇవ్వదు. కాబట్టి మూలంలో ఉన్న పరిమిత వాదననే అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘అతణ్ణి,’ ‘అడ్డుకోకండి,’ ‘నా పేరున’ వంటి రూపాలు సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా ఉన్నాయి; మూలంలోని కారణసంబంధం, భవిష్యత్ సామర్థ్యం, మరియు భావపరమైన అనిశ్చితి నిలుపబడ్డాయి.
