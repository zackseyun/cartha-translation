translation:
  language: te
  text: ఎందుకంటే అతనికి ఏమి జవాబివ్వాలో తెలియలేదు[a]; ఎందుకంటే వారు భయభ్రాంతులయ్యారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతను ఏమని బదులివ్వాలో.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో, ‘వారు తీవ్రమైన భయస్థితిలోకి వచ్చారు’ అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: తెలియలేదు
  rationale: οἶδα ఇక్కడ జ్ఞానం లేదా అవగాహనను సూచిస్తుంది; నిరాకరణతో కూడిన సందర్భంలో సహజమైన ఆధునిక తెలుగు రూపం ‘తెలియలేదు’.
- source_word: τί ἀποκριθῇ
  choice: ఏమి జవాబివ్వాలో
  rationale: ἀποκρίνομαι సాధారణంగా మాట్లాడటాన్ని కాక జవాబు ఇవ్వడాన్ని సూచిస్తుంది; deliberative subjunctive భావాన్ని ‘ఏమి ... ఇవ్వాలో’ సహజంగా తెలియజేస్తుంది.
- source_word: ἔκφοβοι
  choice: భయభ్రాంతులు
  rationale: ἔκφοβος సాధారణ భయంకంటే తీవ్రమైన భయాన్ని సూచిస్తుంది; ‘భయభ్రాంతులు’ ఆ తీవ్రతను గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐγένοντο
  choice: అయ్యారు
  rationale: γίνομαι ఒక స్థితిలోకి రావడాన్ని సూచిస్తుంది; ‘అయ్యారు’ అనే రూపం కేవలం ‘ఉన్నారు’ కంటే ఆ మార్పును మెరుగ్గా నిలుపుతుంది.
- source_word: γὰρ ... γὰρ
  choice: ఎందుకంటే ... [అసిండెటిక్ వివరణ]
  rationale: మొదటి γάρను ‘ఎందుకంటే’గా స్పష్టంగా ఇచ్చాం. రెండవ γάρకు తెలుగులో మళ్లీ ‘ఎందుకంటే’ అనడం భారంగా ఉండటంతో, సెమికోలన్ ద్వారా అదే వివరణాత్మక సంబంధాన్ని సహజంగా నిలిపాం.
theological_decisions:
- issue: బహువచన వాక్యభాగపు కర్త
  choice: వారు భయభ్రాంతులయ్యారు
  alternative: అతడు భయభ్రాంతుడయ్యాడు
  rationale: ἔκφοβοι మరియు ἐγένοντο రెండూ బహువచన రూపాలు. సందర్భంలో అవి పేతురు మరియు అతనితో ఉన్నవారిని సూచిస్తాయి; ఏకవచనంగా మార్చడానికి గ్రీకు పాఠంలో ఆధారం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని కారణార్థక నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగులో అనవసర పునరుక్తిని నివారించాం.
