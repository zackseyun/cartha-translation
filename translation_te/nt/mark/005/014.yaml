  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂Καὶ οἱ⸃ βόσκοντες ⸀αὐτοὺς ἔφυγον καὶ ⸀ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς· καὶ ⸀ἦλθον ἰδεῖν τί ἐστιν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/014.yaml
  text: And those who were tending them fled and reported it in the city and in the countryside[a], and they came to see what had happened.
translation:
  language: te
  text: వాటిని మేపుతున్నవారు పారిపోయి, పట్టణంలోనూ చుట్టుపక్కల గ్రామీణ ప్రాంతాల్లోనూ[a] ఆ సంగతి తెలియజేశారు. అప్పుడు వారు ఏమి జరిగిందో చూడడానికి వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పొలాల్లోనూ.” ఇక్కడ గ్రీకు పదం అక్షరార్థంగా “పొలాలు” అని అర్థమివ్వగలదు; అయితే పట్టణం చుట్టూ ఉన్న గ్రామీణ ప్రాంతాలను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: βόσκοντες
  choice: మేపుతున్నవారు
  rationale: సందర్భంలో పందుల మందను చూసుకుంటూ మేపుతున్నవారిని సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన, స్పష్టమైన పదప్రయోగం.
- source_word: αὐτούς
  choice: వాటిని
  rationale: మునుపటి వచనంలోని పందులను సూచించే గ్రీకు సర్వనామాన్ని తెలుగులోనూ సర్వనామంగానే ఉంచుతుంది.
- source_word: ἔφυγον
  choice: పారిపోయి
  rationale: భయంతో లేదా ఆకస్మికంగా అక్కడి నుంచి వెళ్లిపోయిన భావాన్ని కథన బలంతో తెలియజేస్తుంది.
- source_word: ἀπήγγειλαν
  choice: ఆ సంగతి తెలియజేశారు
  rationale: వారు జరిగిన విషయాన్ని ఇతరులకు చేరవేశారనే భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: εἰς τὴν πόλιν
  choice: పట్టణంలోనూ
  rationale: వార్త పట్టణంలో వ్యాపింపజేయబడిన స్థలాన్ని తెలుగు వాడుకకు అనుగుణంగా తెలియజేస్తుంది.
- source_word: εἰς τοὺς ἀγρούς
  choice: చుట్టుపక్కల గ్రామీణ ప్రాంతాల్లోనూ
  rationale: పట్టణానికి విరుద్ధంగా ఉన్న పొలాలు లేదా గ్రామీణ పరిసర ప్రాంతాల భావాన్ని సందర్భానుసారంగా అందిస్తుంది.
- source_word: ἦλθον
  choice: వారు ... వచ్చారు
  rationale: గ్రీకులోని అనిర్దిష్ట బహువచన కర్తను అదనపు గుర్తింపు జోడించకుండా సర్వనామంతో నిలుపుతుంది.
- source_word: ἰδεῖν
  choice: చూడడానికి
  rationale: వారు రావడానికి గల ఉద్దేశాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τί ἐστιν τὸ γεγονός
  choice: ఏమి జరిగిందో
  rationale: జరిగిన సంఘటన ఏమిటో తెలుసుకోవడానికి వచ్చారనే గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగు కథన రూపంలో అందిస్తుంది.
