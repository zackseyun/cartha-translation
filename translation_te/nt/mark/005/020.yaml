source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν καὶ ἤρξατο κηρύσσειν ἐν τῇ Δεκαπόλει ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς, καὶ πάντες ἐθαύμαζον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/020.yaml
  text: And he went away and began to proclaim in the Decapolis how much Jesus had done for him[a], and everyone was amazed.
translation:
  language: te
  text: 'అతడు వెళ్లి, యేసు అతని కోసం ఎంత చేశాడో[a] దెకపొలి ప్రాంతంలో ప్రకటించడం మొదలుపెట్టాడు. అందరూ ఆశ్చర్యపోయారు.


    [a] లేదా, “యేసు అతని కోసం చేసినదంతా.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు అతని కోసం చేసినదంతా.”
    reason: ὅσα అనే పదానికి ‘ఎంత’తో పాటు ‘చేసినదంతా’ అనే అర్థం కూడా సాధ్యమైనందున ఈ పదార్థ ప్రత్యామ్నాయం ఇవ్వబడింది.
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: వెళ్లి
  rationale: సంఘటన జరిగిన స్థలం నుంచి అతడు వెళ్లిపోవడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἤρξατο κηρύσσειν
  choice: ప్రకటించడం మొదలుపెట్టాడు
  rationale: ἤρξατο యొక్క ఆరంభ భావాన్ని, κηρύσσειν యొక్క బహిరంగంగా తెలియజేయడం అనే విస్తృత భావాన్ని కాపాడుతుంది; అధికారిక ప్రసంగం చేశాడనే అదనపు భావాన్ని చేర్చదు.
- source_word: ἐν τῇ Δεκαπόλει
  choice: దెకపొలి ప్రాంతంలో
  rationale: ἐν అనే స్థానార్థక సంబంధాన్ని నేరుగా నిలుపుతుంది. ‘ప్రాంతం’ అనే పదం దెకపొలి ఒక భౌగోళిక ప్రాంతమని సాధారణ పాఠకునికి స్పష్టం చేస్తుంది; ‘ప్రాంతమంతటా’ అని మూలంలో లేని విస్తృతిని చేర్చదు.
- source_word: ὅσα
  choice: ఎంత
  rationale: చేసిన కార్యాల పరిమాణం లేదా విస్తారాన్ని సహజంగా తెలియజేస్తుంది. ‘చేసినదంతా’ కూడా సాధ్యమైనందున దాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐποίησεν αὐτῷ
  choice: తన కోసం చేశాడో
  rationale: ఇక్కడ దత్తివిభక్తి αὐτῷ లబ్ధిదారుని సూచిస్తుంది. ‘తన కోసం’ అనేది యేసు అతని మేలు కోసం చేసిన కార్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πάντες
  choice: అందరూ
  rationale: మానవ సమూహాన్ని సూచించే πάντες కు సహజమైన సమానార్థకం; మూలంలో లేని నామవాచకాన్ని చేర్చదు.
- source_word: ἐθαύμαζον
  choice: ఆశ్చర్యపోయారు
  rationale: వారి ఆశ్చర్యాన్ని ఆధునిక తెలుగులో సహజంగా తెలుపుతుంది. గ్రీకు అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న లేదా పునరావృత స్పందన భావాన్ని సందర్భం అనుమతించినంత వరకు విస్తరించకుండా ఉంచుతుంది.
- source_word: ὁ Ἰησοῦς
  choice: యేసు
  rationale: వ్యక్తి పేరుకు ప్రామాణిక తెలుగు రూపం.
theological_decisions:
- issue: యేసు ఎవరు అనే అంశంతో మనిషి ప్రకటనకు ఉన్న సంబంధం
  choice: ఆ మనిషి యేసు తన కోసం చేసినదాన్ని ప్రకటించాడని కథనాన్ని నేరుగా అనువదించడం
  alternative: యేసు దైవిక అధికారాన్ని స్పష్టంగా వివరించే వేదాంతపరమైన వివరణను చేర్చడం
  rationale: ఈ వాక్యం యేసు చేసిన కార్యాన్ని, ప్రజల ఆశ్చర్యాన్ని తెలియజేస్తుంది గాని స్పష్టమైన సిద్ధాంత నిర్ణయాన్ని ప్రకటించదు. అందువల్ల కథనంలోని సూచనను విస్తరించకుండా, దాని వేదాంతపరమైన ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ప్రకటించడం’ బహిరంగ సాక్ష్యాన్ని తెలియజేస్తుంది, కానీ అధికారిక ప్రసంగ వాతావరణాన్ని అనవసరంగా సూచించదు.
