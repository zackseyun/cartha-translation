source:
  edition: SBLGNT
  text: Καὶ διαπεράσαντος τοῦ Ἰησοῦ ἐν τῷ πλοίῳ πάλιν εἰς τὸ πέραν συνήχθη ὄχλος πολὺς ἐπ’ αὐτόν, καὶ ἦν παρὰ τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/021.yaml
  text: And after Jesus had crossed over again in the boat to the other side[a], a large crowd gathered around him, and he was beside the sea.
translation:
  language: te
  text: యేసు పడవలో మళ్లీ అవతలి ఒడ్డుకు[a] దాటిన తరువాత, పెద్ద జనసమూహం ఆయన చుట్టూ గుమికూడింది. ఆయన సముద్రం ఒడ్డున ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇది గలిలయ సముద్రాన్ని సూచిస్తుంది. వాస్తవానికి అది ఒక సరస్సు; అయితే సువార్తల్లో దానిని సాధారణంగా ‘సముద్రం’ అని పిలుస్తారు.
    reason: cultural_note
lexical_decisions:
- source_word: διαπεράσαντος
  choice: దాటివచ్చిన తరువాత
  rationale: కర్తరి భూతకాల కృదంతంతో కూడిన జనిటివ్ అబ్సల్యూట్ ప్రధాన క్రియకు ముందుగా జరిగిన సందర్భాన్ని సూచిస్తుంది; ‘దాటివచ్చిన తరువాత’ ఆ కాలక్రమాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐν τῷ πλοίῳ
  choice: పడవలో
  rationale: గ్రీకు విభక్తిపూర్వక పదబంధాన్ని స్పష్టంగా నిలుపుతూ, గలిలయ సముద్రపు కథన సందర్భానికి ఆధునిక తెలుగులో ‘పడవ’ సహజంగా సరిపోతుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: పునరావృత చర్యను తెలిపే అవ్యయానికి ఇది సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: εἰς τὸ πέραν
  choice: అవతలి ఒడ్డుకు
  rationale: సరస్సు దాటే ఈ సందర్భంలో గ్రీకు పదబంధం ఎదురువైపు తీరాన్ని సూచిస్తుంది; ‘అవతలి ఒడ్డుకు’ తెలుగులో దిశను స్పష్టంగా తెలియజేస్తుంది.
- source_word: συνήχθη
  choice: గుమికూడింది
  rationale: రూపంలో కర్మణి అయినా, ఇక్కడ జనసమూహం ఒకచోట చేరడాన్ని సూచిస్తుంది; ఏకవచన సమూహవాచకానికి ‘గుమికూడింది’ సహజంగా ఉంటుంది.
- source_word: ὄχλος πολὺς
  choice: పెద్ద జనసమూహం
  rationale: జనుల సంఖ్య అధికంగా ఉందనే భావాన్ని గౌరవప్రదమైన, సులభమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπ’ αὐτόν
  choice: ఆయన చుట్టూ
  rationale: ఈ సందర్భంలో ἐπί + ద్వితీయా విభక్తి యేసు వైపు చేరి ఆయన పరిసరంలో కూడడాన్ని సూచిస్తుంది; ‘ఆయన చుట్టూ’ ఆ స్థలసంబంధ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: παρὰ τὴν θάλασσαν
  choice: సముద్రం ఒడ్డున
  rationale: παρά ఇక్కడ తీరానికి ఆనుకొని ఉన్న స్థానాన్ని సూచిస్తుంది; తెలుగులో ‘సముద్రం ఒడ్డున’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: θάλασσαν
  choice: సముద్రం
  rationale: గ్రీకు మూలపదం ‘సముద్రం’ అని ఉంది. భౌగోళికంగా ఇది సరస్సైనా, సువార్తల సంప్రదాయ నామకరణాన్ని ప్రధాన పాఠ్యంలో నిలిపి, వివరణను పాదసూచికలో ఇస్తుంది.
