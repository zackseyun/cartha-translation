translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘ఆయన’ అనే గౌరవ సూచక సర్వనామం తీసుకోబడింది. మూలంలోని సముద్రం అనే పదాన్ని నిలిపి, భౌగోళిక వివరణను పాదసూచికలో ఉంచాం.
