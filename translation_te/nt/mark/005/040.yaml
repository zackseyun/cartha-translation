id: MRK.5.40
reference: Mark 5:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ κατεγέλων αὐτοῦ. ⸀αὐτὸς δὲ ἐκβαλὼν πάντας παραλαμβάνει τὸν πατέρα τοῦ παιδίου καὶ τὴν μητέρα καὶ τοὺς μετ’ αὐτοῦ, καὶ εἰσπορεύεται ὅπου ἦν τὸ ⸀παιδίον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/040.yaml
  text: And they were laughing at him[a]. But he, after putting them all outside, takes the child's father and mother and those with him[b], and goes in where the child was.
translation:
  language: te
  text: వారు ఆయనను ఎగతాళి చేస్తూ నవ్వుతూ ఉన్నారు.[a] అయితే ఆయన వారందరినీ బయటికి పంపి, ఆ చిన్నబిడ్డ తండ్రినీ తల్లినీ, తనతో ఉన్నవారిని[b] వెంట తీసుకొని, చిన్నబిడ్డ ఉన్న చోటికి లోపలికి వెళ్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనను అపహాస్యం చేస్తూ ఉన్నారు.’ గ్రీకు క్రియ హేళనతో కూడిన నవ్వును సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, ఆయనతోపాటు వచ్చిన శిష్యులు.
    reason: cross_reference
lexical_decisions:
- source_word: κατεγέλων
  choice: ఎగతాళిగా నవ్వుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న చర్యను సూచిస్తుంది; ఈ క్రియలోని హేళనతో కూడిన నవ్వు భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: αὐτοῦ
  choice: ఆయనను చూసి
  rationale: καταγελάωతో వచ్చిన సంబంధ విభక్తి ‘ఆయనను చూసి/ఆయనపై నవ్వడం’ అనే అర్థం ఇస్తుంది; తెలుగులో ‘ఆయనను చూసి నవ్వడం’ సహజంగా ఉంటుంది.
- source_word: ἐκβαλὼν πάντας
  choice: వారందరినీ బయటికి పంపి
  rationale: ప్రధాన క్రియలకు ముందు జరిగిన చర్యను సూచిస్తుంది. ‘వెళ్లగొట్టి’ కంటే ‘బయటికి పంపి’ సందర్భానికి సహజంగా ఉండి, దయ్యాన్ని వెళ్లగొట్టే భాషతో అనవసర సంబంధాన్ని నివారిస్తుంది.
- source_word: παραλαμβάνει
  choice: వెంట తీసుకొని
  rationale: ఎంచుకున్న వ్యక్తులను తనతోపాటు తీసుకెళ్లడం అనే భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తూ, గ్రీకులోని చారిత్రక వర్తమానాన్ని తరువాతి ‘వెళ్తాడు’తో నిలుపుతుంది.
- source_word: παιδίου / παιδίον
  choice: చిన్నబిడ్డ
  rationale: παιδίον లింగనిరపేక్షంగా చిన్న పిల్లను సూచిస్తుంది. విస్తృత సందర్భంలో ఈ బిడ్డ కుమార్తె అయినప్పటికీ, ఈ వచనంలోని పదానికి మించిన లింగ నిర్దిష్టతను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: τοὺς μετ’ αὐτοῦ
  choice: తనతో ఉన్నవారిని
  rationale: యేసుతో ఉన్న సహచరులను సూచించే గ్రీకు వ్యక్తీకరణను వారి గుర్తింపును ప్రధాన పాఠ్యంలో అతిగా నిర్దిష్టం చేయకుండా పారదర్శకంగా అనువదిస్తుంది.
- source_word: εἰσπορεύεται
  choice: లోపలికి వెళ్తాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని నిలుపుతూ, ఆ బిడ్డ ఉన్న ప్రదేశంలోకి ప్రవేశించడాన్ని సహజమైన తెలుగులో చెబుతుంది.
- source_word: ὅπου ἦν τὸ παιδίον
  choice: చిన్నబిడ్డ ఉన్న చోటికి
  rationale: గ్రీకు మూలం కేవలం స్థానాన్ని తెలుపుతుంది; ‘పడుకొని ఉన్న’ వంటి సందర్భానుమానాన్ని చేర్చకుండా పాఠ్య నియంత్రణను కాపాడుతుంది.
theological_decisions:
- issue: కథన కాలం మరియు సజీవత
  choice: ‘వెంట తీసుకొని ... లోపలికి వెళ్తాడు’ అనే చారిత్రక వర్తమానాన్ని నిలుపడం
  alternative: ‘వెంట తీసుకొని ... లోపలికి వెళ్లాడు’ అని మొత్తం వాక్యాన్ని భూతకాలంలోకి మార్చడం
  rationale: మార్కు కథనంలో చారిత్రక వర్తమానం తరచుగా సజీవతను కలిగిస్తుంది. తెలుగులో కాలమార్పు కొంత గుర్తించదగినదైనా, ఇక్కడ మూలంలోని కథన శైలిని నిలుపడం సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘ఆయన’ ద్వారా యేసును గౌరవసూచకంగా పేర్కొన్నాం. మూలంలోని లింగనిరపేక్ష παιδίον కోసం ‘చిన్నబిడ్డ’ వాడి, చారిత్రక వర్తమానాన్ని చివరి ప్రధాన క్రియలో నిలిపాం.
