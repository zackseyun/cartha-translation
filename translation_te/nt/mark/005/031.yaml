  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా సంభాషణాత్మకమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. శిష్యులు యేసుతో నేరుగా మాట్లాడుతున్నందున ఏకవచన ‘నువ్వు’ రూపం సహజంగా ఉంచబడింది; ఇది అగౌరవాన్ని సూచించదు.
