source:
  edition: SBLGNT
  text: καὶ ἔλεγον αὐτῷ οἱ μαθηταὶ αὐτοῦ· Βλέπεις τὸν ὄχλον συνθλίβοντά σε, καὶ λέγεις· Τίς μου ἥψατο;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/031.yaml
  text: And his disciples were saying to him[a], “You see the crowd pressing in on you, and you say, ‘Who touched me?’”
translation:
  language: te
  text: 'ఆయన శిష్యులు ఆయనతో ఇలా చెబుతూ ఉన్నారు: “జనం నిన్ను నొక్కుతూ ఉండటం చూస్తున్నావు, అయినా ‘ఎవరు నన్ను తాకారు?’ అని అంటున్నావా?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: అంటున్నారు
  rationale: గ్రీకు అసంపూర్ణ భూతకాలం కొనసాగుతున్న లేదా స్పందనగా పలుకుతున్న మాటను సూచిస్తుంది. తెలుగు కథనంలో ‘అంటున్నారు’ ఆ కొనసాగుతున్న భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μαθηταὶ
  choice: శిష్యులు
  rationale: యేసుతో ఉన్న బోధనాత్మక, అనుబంధ సంబంధాన్ని తెలియజేసే ప్రామాణికమైన సహజ తెలుగు పదం.
- source_word: Βλέπεις
  choice: నువ్వు చూస్తూనే ఉన్నావు కదా
  rationale: ప్రస్తుతకాల సూచనను నిలుపుతూ, శిష్యులు కళ్లముందున్న స్పష్టమైన పరిస్థితిని ప్రస్తావిస్తున్న భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ὄχλον
  choice: జనం
  rationale: సమూహంగా కూడిన ప్రజలను సూచించడానికి ఆధునిక సాధారణ తెలుగులో సహజమైన పదం.
- source_word: συνθλίβοντά
  choice: నీ మీదికి ఒత్తుకుంటూ రావడం
  rationale: యేసు చుట్టూ జనం శారీరకంగా దగ్గరగా నొక్కుకుంటున్న భావాన్ని అతిశయోక్తి లేకుండా వ్యక్తం చేస్తుంది.
- source_word: λέγεις
  choice: అని అడుగుతున్నావా
  rationale: మూలంలో ‘అంటున్నావు’ ఉన్నప్పటికీ, ఉటంకించిన మాట ప్రశ్న కావడంతో తెలుగులో ‘అడుగుతున్నావా’ సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: Τίς μου ἥψατο
  choice: నన్ను తాకింది ఎవరు?
  rationale: ἅπτομαι ఇక్కడ జరిగిన నిర్దిష్టమైన స్పర్శను సూచిస్తుంది. ‘తాకింది’ లింగాన్ని ముందే నిర్ధారించకుండా మూలంలోని ‘ఎవరు’ అనే అనిశ్చితిని నిలుపుతుంది.
- source_word: μου
  choice: నన్ను
  rationale: ἅπτομαιతో వచ్చే గ్రీకు షష్ఠీ విభక్తిని తెలుగులో సహజమైన కర్మరూపంగా అనువదించింది.
