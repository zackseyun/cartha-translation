id: MRK.5.30
reference: Mark 5:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ὁ Ἰησοῦς ἐπιγνοὺς ἐν ἑαυτῷ τὴν ἐξ αὐτοῦ δύναμιν ἐξελθοῦσαν ἐπιστραφεὶς ἐν τῷ ὄχλῳ ἔλεγεν· Τίς μου ἥψατο τῶν ἱματίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/030.yaml
  text: And immediately Jesus[a], perceiving in himself that power had gone out from him, turned around in the crowd and said, “Who touched my garments?”
translation:
  language: te
  text: వెంటనే యేసు తన నుండి శక్తి వెలువడిందని తనలో తాను గ్రహించి, జనసమూహం మధ్యలో వెనక్కి తిరిగి, “నా వస్త్రాలను[a] తాకినది ఎవరు?” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా బట్టలను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు వర్ణనలోని వేగాన్ని తెలియజేసే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: ἐπιγνοὺς ἐν ἑαυτῷ
  choice: తనలో తాను గ్రహించి
  rationale: బాహ్య పరిశీలనకన్నా యేసుకు కలిగిన అంతర్గత, స్పష్టమైన అవగాహనను వ్యక్తం చేస్తుంది.
- source_word: τὴν ἐξ αὐτοῦ δύναμιν ἐξελθοῦσαν
  choice: తనలోనుండి శక్తి వెలువడిందని
  rationale: శక్తి యేసు నుండి ఇప్పటికే వెలువడినట్లు ఆయన గ్రహించాడనే గ్రీకు వాక్యార్థాన్ని నేరుగా నిలుపుతుంది; ‘స్వస్థపరిచే శక్తి’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: ἐπιστραφεὶς ἐν τῷ ὄχλῳ
  choice: జనసమూహం మధ్యలో వెనక్కి తిరిగి
  rationale: యేసు జనసమూహంలో ఉండి శారీరకంగా వెనక్కి తిరిగిన దృశ్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἔλεγεν
  choice: అని అడిగాడు
  rationale: ప్రశ్నతో కూడిన ప్రత్యక్ష సంభాషణను తెలుగులో సహజంగా పరిచయం చేస్తుంది; అపూర్ణ భూతకాల రూపాన్ని అనవసరంగా పునరుక్తిగా చూపదు.
- source_word: ἥψατο
  choice: తాకినది
  rationale: ఈ సందర్భంలో ἅπτω మధ్యమ రూపానికి సరళమైన, ఖచ్చితమైన అర్థం ‘తాకడం’.
- source_word: τῶν ἱματίων
  choice: నా వస్త్రాలను
  rationale: బహువచనాన్ని నిలుపుతూ గౌరవప్రదమైన ఆధునిక ప్రమాణ తెలుగును అందిస్తుంది; ‘పైవస్త్రం’ అని అతి నిర్దిష్టం చేయదు.
theological_decisions:
- issue: యేసు నుండి శక్తి వెలువడినదనే వర్ణన
  choice: తనలోనుండి శక్తి వెలువడిందని
  alternative: తనలోనుండి స్వస్థపరిచే శక్తి వెలువడిందని
  rationale: మూలపాఠం శక్తి నిజంగా వెలువడినట్లు సూటిగా చెబుతుంది. దాన్ని రూపకంగా మార్చకుండా, అద్భుతం ఎలా జరిగిందో సిద్ధాంతపరంగా వివరించకుండా, వాక్యంలోని ఉద్వేగాన్ని యథాతథంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగులో సహజమైనదిగా, అయితే గౌరవప్రదమైన వచనశైలితో రూపొందించబడింది. ‘వస్త్రాలు’ ప్రధాన పాఠంలో కొంత అధికారికమైన సరైన సమానార్థకంగా ఉంచి, సాధారణ వాడుకలోని ‘బట్టలు’ను పాదటిప్పణిలో ఇచ్చాం.
