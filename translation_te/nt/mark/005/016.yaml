source:
  edition: SBLGNT
  text: ⸂καὶ διηγήσαντο⸃ αὐτοῖς οἱ ἰδόντες πῶς ἐγένετο τῷ δαιμονιζομένῳ καὶ περὶ τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/016.yaml
  text: And those who had seen it told them how it had happened to the demon-possessed man[a], and about the pigs.
translation:
  language: te
  text: అది చూసినవారు, దయ్యం పట్టిన ఆ మనిషికి[a] అది ఎలా జరిగిందో, పందుల గురించి కూడా వారికి వివరించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దయ్యం ఆవహించిన ఆ మనిషికి”; లేదా, “దయ్యపీడితునికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διηγήσαντο
  choice: వివరించారు
  rationale: ఈ క్రియ జరిగినదాన్ని క్రమంగా లేదా వివరంగా తెలియజేయడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వివరించారు’ సహజంగా ఉండి, కేవలం ‘చెప్పారు’ కంటే మూలంలోని నివేదన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: οἱ ἰδόντες
  choice: అది చూసినవారు
  rationale: నిర్దిష్ట ఆర్టిక్యులర్ కృదంతం సంఘటనను ప్రత్యక్షంగా చూసినవారిని సూచిస్తుంది. ‘అది’ సందర్భంలో జరిగిన సంఘటనను సహజంగా సూచిస్తుంది; ‘ప్రత్యక్ష సాక్షులు’ అనే వివరణాత్మక నామాన్ని మూలంలో లేనప్పటికీ చేర్చదు.
- source_word: πῶς ἐγένετο
  choice: ఎలా జరిగిందో
  rationale: సంఘటన ఏ విధంగా జరిగిందో అనే భావాన్ని నిలుపుతుంది. ‘ఏమి జరిగిందో’ కంటే πῶς లోని విధానార్థాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: τῷ δαιμονιζομένῳ
  choice: దయ్యం పట్టిన ఆ మనిషికి
  rationale: ఈ కృదంతం దయ్యపు పీడ లేదా ఆధీనంలో ఉన్న వ్యక్తిని సూచిస్తుంది. సందర్భంలో అతడు ముందే తెలిసిన వ్యక్తి కాబట్టి ‘ఆ మనిషి’ సహజంగా ఉంటుంది; వ్యక్తిని కేవలం ఒక ముద్రపేరుగా మార్చకుండా వ్యక్తిత్వాన్ని నిలుపుతుంది.
- source_word: περὶ τῶν χοίρων
  choice: పందుల సంగతి కూడా
  rationale: περί + షష్ఠీ విభక్తి ‘గురించి/సంగతి’ అనే అర్థాన్ని ఇస్తుంది. καί యొక్క అనుసంధాన భావాన్ని తెలుగులో సహజంగా చూపడానికి ‘కూడా’ వాడబడింది.
theological_decisions:
- issue: దయ్యపు ప్రభావాన్ని సూచించే δαιμονιζομένῳ పదబంధం
  choice: దయ్యం పట్టిన ఆ మనిషి
  alternative: దయ్యం ఆవహించిన మనిషి; దయ్యపీడితుడు
  rationale: మార్కు కథనంలో దయ్యపు కార్యాన్ని వాస్తవమైన వ్యక్తిగత పీడగా ఉంచుతూ, దానిని కేవలం మానసిక స్థితిగా మార్చదు. అదే సమయంలో ‘దయ్యపీడితుడు’ అనే సంక్షిప్త ముద్రపేరు కంటే ‘ఆ మనిషి’ అని వ్యక్తిని ముందుకు తెస్తుంది. ‘పట్టిన’ అనేది సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అర్థమయ్యే వ్యక్తీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. వాక్యక్రమం గ్రీకు మూలంలోని రెండు నివేదన అంశాలను—మనిషికి జరిగినది, పందుల సంగతి—స్పష్టంగా ఉంచుతుంది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పదబంధం వెంట ఉంచబడింది.
