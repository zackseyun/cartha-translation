  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐκ ἀφῆκεν οὐδένα ⸂μετ’ αὐτοῦ⸃ συνακολουθῆσαι εἰ μὴ ⸀τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/037.yaml
  text: And he allowed no one to accompany him except Peter and James and John, the brother of James.
translation:
  language: te
  text: ఆయన తనతో పాటు రావడానికి పేతురు, యాకోబు, యాకోబు సోదరుడైన యోహాను తప్ప మరెవరినీ అనుమతించలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφῆκεν
  choice: అనుమతించలేదు
  rationale: క్రియారూపంతో కలిసి ఇక్కడ ἀφίημι ‘అనుమతించు’ అనే భావాన్ని ఇస్తుంది. నిషేధంతో కలిపిన ఈ రూపం యేసు ఇతరులను తనతో రావడానికి అనుమతించలేదని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οὐδένα
  choice: మరెవరినీ
  rationale: εἰ μὴ ద్వారా తరువాత వచ్చే మినహాయింపుతో కలిపి ‘...తప్ప మరెవరినీ’ అనడం సంపూర్ణ మినహాయింపును తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μετ’ αὐτοῦ
  choice: తనతో పాటు
  rationale: కర్త యేసే కాబట్టి αὐτοῦను తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా ‘తనతో’ అని ఇచ్చాం; ‘తో పాటు’ సహవాసంగా వెళ్లే భావాన్ని స్పష్టం చేస్తుంది.
- source_word: συνακολουθῆσαι
  choice: రావడానికి
  rationale: ఈ సందర్భంలో ఈ సంయుక్త క్రియ యేసుతో కలిసి వెంట వెళ్లడాన్ని సూచిస్తుంది. ‘తనతో పాటు రావడానికి’ అనేది ఆ భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: εἰ μὴ
  choice: తప్ప
  rationale: ఇక్కడ ఇది షరతును కాక మినహాయింపును సూచిస్తుంది; అందువల్ల ‘తప్ప’ సరైన తెలుగు సమానార్థకం.
- source_word: τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: పేతురు, యాకోబు, ... యోహాను
  rationale: వ్యక్తుల పేర్లను ప్రామాణిక తెలుగు బైబిలు రూపాల్లో ఇచ్చాం. గ్రీకులోని పునరుక్త καίను తెలుగులో సహజమైన జాబితా నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: τὸν ἀδελφὸν Ἰακώβου
  choice: యాకోబు సోదరుడైన
  rationale: ఈ అన్వయ పదబంధం ఏ యోహాను ఉద్దేశించబడుతున్నాడో గుర్తిస్తుంది. ‘యాకోబు సోదరుడైన యోహాను’ మూలంలోని సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘తనతో పాటు రావడానికి’ అనే ప్రయోగం μετ’ αὐτοῦ మరియు συνακολουθῆσαι రెండింటి సమిష్టి భావాన్ని అనవసర పునరుక్తి లేకుండా అందిస్తుంది.
