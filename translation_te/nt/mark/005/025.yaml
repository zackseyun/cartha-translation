  text: And there was a woman who had been suffering from a flow of blood for twelve years,[a]
translation:
  language: te
  text: పన్నెండు సంవత్సరాలుగా రక్తస్రావంతో బాధపడుతున్న ఒక స్త్రీ ఉంది.[a]
