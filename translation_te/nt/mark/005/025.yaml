lexical_decisions:
- source_word: καὶ
  choice: కూడా
  rationale: మార్కు వాడిన అనుసంధానాన్ని నిలుపుతూ, ముందున్న కథనంలో మరొక వ్యక్తిని పరిచయం చేయడానికి తెలుగులో సహజంగా ఉంటుంది.
- source_word: γυνὴ
  choice: ఒక స్త్రీ
  rationale: నిర్దిష్ట ఉపపదం లేని ఈ నామవాచకం కథనంలో కొత్త వ్యక్తిని పరిచయం చేస్తోంది; ‘ఒక స్త్రీ’ సహజమైన తెలుగు రూపం.
- source_word: οὖσα
  choice: బాధపడుతున్న
  rationale: అక్షరార్థంగా ‘ఉన్న’ అయినా, రక్తస్రావ స్థితి పన్నెండు సంవత్సరాలుగా కొనసాగుతోందనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; బాధ భావం సందర్భానుగుణంగా అంతర్లీనంగా ఉంది.
- source_word: ἐν ῥύσει αἵματος
  choice: రక్తస్రావంతో
  rationale: ఈ పదబంధం రక్తం కారుతున్న నిరంతర స్థితిని సూచిస్తుంది. ‘రక్తస్రావం’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: δώδεκα ἔτη
  choice: పన్నెండు సంవత్సరాలుగా
  rationale: కాలవ్యాప్తిని సూచించే accusative భావాన్ని తెలుగులో ‘-గా’ రూపం సహజంగా వ్యక్తం చేస్తుంది.
