translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. గ్రీకు వాక్యంలోని వరుస అసమాపక క్రియలను తెలుగు వాక్యప్రవాహానికి అనుగుణంగా కలిపి, ‘పైగా’ ద్వారా వ్యతిరేక ఉద్ధృతిని నిలిపాము. మూల ఆంగ్లంలో [b] గుర్తు చివర కనిపించినా, దాని గమనిక τὰ παρ’ αὐτῆς πάντα గురించి కావడంతో ‘తనకున్నదంతా’ దగ్గర ఉంచబడింది.
