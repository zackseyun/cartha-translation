source:
  edition: SBLGNT
  text: καὶ πολλὰ παθοῦσα ὑπὸ πολλῶν ἰατρῶν καὶ δαπανήσασα τὰ παρ’ αὐτῆς πάντα καὶ μηδὲν ὠφεληθεῖσα ἀλλὰ μᾶλλον εἰς τὸ χεῖρον ἐλθοῦσα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/026.yaml
  text: and after suffering much under many physicians[a], and after spending all that she had and benefiting nothing, but rather becoming worse[b],
translation:
  language: te
  text: ఆమె అనేకమంది వైద్యులవల్ల ఎంతో బాధపడి[a], తన వద్దనున్నదంతా ఖర్చుచేసి[b], ఏ ప్రయోజనమూ పొందక, పైగా మరింత అధ్వాన్న స్థితికి చేరి,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అనేకమంది వైద్యుల చేతుల్లో’ లేదా ‘అనేకమంది వైద్యుల చికిత్సలకు లోనై.’ గ్రీకు పదబంధం వైద్యుల కార్యసాధకత్వాన్ని గానీ, వారి చికిత్సలకు ఆమె లోనైన పరిస్థితిని గానీ నొక్కి చెప్పవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఆమె వద్దనున్నవన్నీ’; అంటే, ఆమెకున్న సమస్తం.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ παθοῦσα
  choice: ఎంతో బాధ అనుభవించి
  rationale: ఈ భూతకాల అసమాపక క్రియ ఆమె ముందుగా అనుభవించిన తీవ్రమైన బాధను తెలియజేస్తూ, వాక్యంలోని వరుస సంఘటనలతో సహజంగా కలుస్తుంది.
- source_word: ὑπὸ πολλῶν ἰατρῶν
  choice: అనేకమంది వైద్యుల చేతుల్లో
  rationale: ὑπό + షష్ఠీ విభక్తి వైద్యుల కార్యసాధకత్వాన్ని లేదా వారి చికిత్సలకు ఆమె లోనైన పరిస్థితిని సూచించగలదు. ఈ తెలుగు ప్రయోగం రెండింటినీ సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: δαπανήσασα
  choice: ఖర్చుచేసినా
  rationale: ఆమె ఖర్చు చేసిన సంగతి తరువాతి వ్యతిరేక ఫలితంతో ముడిపడి ఉంది; ‘-చేసినా’ ఆ భావసంబంధాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: τὰ παρ’ αὐτῆς πάντα
  choice: తనకున్నదంతా
  rationale: ఆమె వద్ద ఉన్న లేదా ఆమెకు చెందిన సమస్తాన్ని సూచించే ఈ గ్రీకు నుడికారానికి ఇది సహజమైన, సంపూర్ణతను నిలిపే అనువాదం.
- source_word: μηδὲν ὠφεληθεῖσα
  choice: ఏ ప్రయోజనమూ పొందక
  rationale: చికిత్సలవల్ల ఆమెకు ఏమాత్రం మేలు కలగలేదనే కర్మణి భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀλλὰ μᾶλλον
  choice: పైగా
  rationale: మేలు కలగకపోవడమే కాక దానికి విరుద్ధంగా పరిస్థితి దిగజారిందనే ఉద్ధృత వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς τὸ χεῖρον ἐλθοῦσα
  choice: మరింత క్షీణించింది
  rationale: అక్షరార్థంగా ‘మరింత చెడ్డ స్థితికి వచ్చింది’ అనే భావాన్ని ఆధునిక, సంక్షిప్త తెలుగులో తెలియజేస్తుంది.
