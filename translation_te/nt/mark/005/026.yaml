  source_fidelity: 'మూల గ్రీకులోని వరుస అఓరిస్ట్ అసమాపక క్రియలు ఆమె గత పరిస్థితిని వివరిస్తాయి: అనేక వైద్యులవల్ల/చికిత్సల కింద ఎంతో బాధపడటం, తన వద్దనున్నదంతా వెచ్చించడం, ఎలాంటి ప్రయోజనం పొందకపోవడం, అంతకంటే అధ్వాన్న స్థితికి చేరడం. ముసాయిదా ఈ భావాన్ని చాలావరకు నిలుపుతుంది; అయితే ‘ఖర్చుచేసినా’ మూలంలో లేని రాయితీ భావాన్ని (‘అలా చేసినప్పటికీ’) చేర్చుతుంది.'
  naturalness: ‘వైద్యుల చేతుల్లో’ సహజమే అయినా వైద్యులపై ప్రత్యక్ష నిందను కొద్దిగా బలపరచగలదు. ‘వైద్యులవల్ల ఎంతో బాధపడి’ ప్రధాన పాఠంలో సహజంగా, సంక్షిప్తంగా ఉంది; గమనిక చికిత్సలకు లోనైన భావాన్ని తెలియజేస్తుంది. వచనం ఈ వాక్యంలోని కొనసాగుతున్న ఉపవాక్య స్వభావాన్ని ప్రతిబింబించేందుకు చివర అసమాపక రూపంతో ముగియడం సముచితం.
  terminology: ‘వైద్యులు,’ ‘ప్రయోజనం పొందక,’ ‘తన వద్దనున్నదంతా’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా ఉన్నాయి. ‘మరింత అధ్వాన్న స్థితికి చేరి’ εἰς τὸ χεῖρον ἐλθοῦσα యొక్క స్థితి-దిగజారుదల భావాన్ని ‘క్షీణించింది’ కంటే మరింత ప్రత్యక్షంగా వ్యక్తపరుస్తుంది.
