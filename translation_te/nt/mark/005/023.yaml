id: MRK.5.23
reference: Mark 5:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀παρακαλεῖ αὐτὸν πολλὰ λέγων ὅτι Τὸ θυγάτριόν μου ἐσχάτως ἔχει, ἵνα ἐλθὼν ἐπιθῇς ⸂τὰς χεῖρας αὐτῇ⸃ ⸀ἵνα σωθῇ καὶ ⸀ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/023.yaml
  text: And he begged him earnestly[a], saying, “My little daughter is at the point of death. Come and lay your hands on her, so that she may be healed and live.”
translation:
  language: te
  text: ఆయనను ఎంతో బతిమాలుతూ, “నా చిన్న కూతురు చావుబతుకుల్లో ఉంది. మీరు వచ్చి ఆమె మీద చేతులు ఉంచండి; ఆమె కాపాడబడి[a] బతికేలా” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “స్వస్థపడి” లేదా “బాగుపడి.” ఈ గ్రీకు క్రియకు కాపాడడం, రక్షించడం, స్వస్థపరచడం అనే అర్థాలు రావచ్చు; ఈ సందర్భంలో ప్రత్యక్షంగా ఉద్దేశించినది శారీరక స్వస్థత.
    reason: alternative_reading
lexical_decisions:
- source_word: παρακαλεῖ … πολλὰ
  choice: ఎంతో బతిమాలుతూ
  rationale: ఇక్కడ παρακαλέω అత్యవసరమైన విజ్ఞాపనను సూచిస్తుంది; πολλὰ ఆ విజ్ఞాపన తీవ్రతను పెంచుతుంది. ‘ఎంతో బతిమాలుతూ’ అనేది తండ్రి ఆవేదనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: θυγάτριόν
  choice: చిన్న కూతురు
  rationale: దీనిలోని అల్పార్థక రూపం ఆమె చిన్న వయస్సును, తండ్రి ఆప్యాయతను సూచించగలదు. ‘చిన్న కూతురు’ ఈ రెండింటినీ సహజంగా నిలుపుతుంది.
- source_word: ἐσχάτως ἔχει
  choice: చావుబతుకుల్లో ఉంది
  rationale: ఈ గ్రీకు నుడికారం ఆమె మరణానికి అత్యంత సమీపంలో ఉన్నదని తెలియజేస్తుంది. ‘చావుబతుకుల్లో ఉంది’ తెలుగులో సహజంగా ఉండి పరిస్థితి తీవ్రతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐλθὼν ἐπιθῇς τὰς χεῖρας αὐτῇ
  choice: మీరు వచ్చి ఆమె మీద చేతులు ఉంచండి
  rationale: క్రియావిశేషణ రూపమైన ἐλθών విజ్ఞాపనలో తరువాతి క్రియతో కలిసి ఆజ్ఞార్థక భావాన్ని ఇస్తుంది. బహువచనమైన ‘చేతులు’ కూడా మూలపాఠానికి అనుగుణంగా నిలుపబడింది.
- source_word: σωθῇ
  choice: కాపాడబడి
  rationale: σῴζω అంటే కాపాడడం, రక్షించడం, స్వస్థపరచడం అనే అర్థాలు రావచ్చు. శారీరక స్వస్థత సందర్భాన్ని మూసివేయకుండా, మూలంలోని విస్తృత భావాన్ని ‘కాపాడబడి’ నిలుపుతుంది; వైద్యసంబంధ ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: ζήσῃ
  choice: బతుకుతుంది
  rationale: ζάω యొక్క ప్రత్యక్ష భావం ‘బతకడం.’ ఇక్కడ అది కాపాడబడటం లేదా స్వస్థపడటం వల్ల కలిగే ఫలితాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: స్వస్థత సందర్భంలో σωθῇ అనువాదం
  choice: కాపాడబడి
  alternative: స్వస్థపడి; బాగుపడి
  rationale: ఈ సందర్భంలో క్రియ శారీరక స్వస్థతను సూచించినప్పటికీ, దానికి కాపాడడం లేదా రక్షించడం అనే విస్తృత భావం కూడా ఉంది. ప్రధాన పాఠంలో ‘కాపాడబడి’ అని ఉంచడం ద్వారా ఆ భావపరిధి నిలుస్తుంది; సందర్భానుగుణమైన స్వస్థత భావాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. యేసును ఉద్దేశించిన మాటల్లో ‘మీరు,’ ‘ఉంచండి’ అనే గౌరవ రూపాలు ఉపయోగించబడ్డాయి; తండ్రి ఆవేదనను ‘ఎంతో బతిమాలుతూ,’ ‘చావుబతుకుల్లో’ అనే సాధారణంగా అర్థమయ్యే పదబంధాలు తెలియజేస్తాయి.
