  yaml_path: translation/nt/mark/005/003.yaml
  text: who had his dwelling among the tombs[a], and no one could bind him anymore, not even with a chain.
translation:
  language: te
  text: అతడు సమాధుల మధ్య నివసించేవాడు.[a] ఇక ఎవ్వరూ అతణ్ణి గొలుసుతో కూడా కట్టలేకపోయేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “అతని నివాసం సమాధుల్లో ఉండేది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοίκησιν εἶχεν
  choice: నివసించేవాడు
  rationale: గ్రీకు ప్రయోగం అతని నివాసాన్ని సూచిస్తుంది. తెలుగులో ‘నివాసం కలిగి ఉండేవాడు’ కంటే ‘నివసించేవాడు’ సహజంగా ఉండి, అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న స్థితిని తెలియజేస్తుంది.
- source_word: ἐν τοῖς μνήμασιν
  choice: సమాధుల మధ్య
  rationale: μνῆμα ఇక్కడ మృతులను ఉంచే సమాధి లేదా సమాధి గుహను సూచిస్తుంది. ‘సమాధుల మధ్య’ సందర్భానికి సహజంగా సరిపోతూ, అతడు ఎల్లప్పుడూ ఏదో ఒక సమాధి లోపలే ఉన్నాడని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: οὐδὲ ἁλύσει
  choice: గొలుసుతో కూడా
  rationale: ἅλυσις ఏకవచనంలో ఉంది; ‘గొలుసుతో కూడా’ దానిని నిలుపుతూ, అంత బలమైన సాధనంతో సైతం అతణ్ణి కట్టలేకపోయారనే ఉద్ఘాటనను వ్యక్తం చేస్తుంది.
- source_word: οὐκέτι
  choice: ఇక
  rationale: గతంలో కట్టగలిగిన పరిస్థితి ఇప్పుడు ముగిసిందనే భావాన్ని సంక్షిప్తంగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: οὐδεὶς ἐδύνατο
  choice: ఎవ్వరూ ... కట్టలేకపోయారు
  rationale: గతకాలంలో కొనసాగిన అసమర్థతను సహజ తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: δῆσαι
  choice: కట్టడం
  rationale: δέω యొక్క భౌతికంగా బంధించడం లేదా కట్టడం అనే అర్థాన్ని సందర్భానుగుణంగా నేరుగా తెలియజేస్తుంది.
