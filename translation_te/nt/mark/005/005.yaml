id: MRK.5.5
reference: Mark 5:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ διὰ παντὸς νυκτὸς καὶ ἡμέρας ἐν τοῖς ⸂μνήμασιν καὶ ἐν τοῖς ὄρεσιν⸃ ἦν κράζων καὶ κατακόπτων ἑαυτὸν λίθοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/005.yaml
  text: And continually[a], night and day, among the tombs and on the mountains, he was crying out and cutting himself with stones.
translation:
  language: te
  text: అతడు రాత్రింబగళ్లు ఎల్లప్పుడూ సమాధుల మధ్య, కొండల మీద కేకలు వేస్తూ, రాళ్లతో తనను తాను కోసుకుంటూ[a] ఉండేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రాళ్లతో తనను తాను తీవ్రంగా గాయపరచుకుంటూ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ παντὸς νυκτὸς καὶ ἡμέρας
  choice: రాత్రింబగళ్లు ఎల్లప్పుడూ
  rationale: διά παντός అనే నిరంతర భావాన్నీ, νυκτὸς καὶ ἡμέρας అనే కాలవ్యాప్తినీ సహజమైన ఆధునిక తెలుగులో కలిపి వ్యక్తపరుస్తుంది.
- source_word: μνήμασιν
  choice: సమాధుల
  rationale: μνῆμα ఇక్కడ మృతదేహాన్ని ఉంచే సమాధి స్థలాన్ని సూచిస్తుంది; సందర్భానికి తగిన సాధారణ తెలుగు పదం ‘సమాధి’.
- source_word: ὄρεσιν
  choice: కొండల
  rationale: ὄροςకు ‘కొండ’ లేదా ‘పర్వతం’ అనే అర్థం ఉంది; ఈ వాక్యంలోని భూభాగాన్ని సాధారణ పాఠకులకు సహజంగా తెలిపేందుకు ‘కొండలు’ ఎంచుకున్నాం.
- source_word: ἦν κράζων
  choice: కేకలు వేస్తూ ... ఉండేవాడు
  rationale: ἦνతో వర్తమాన అసమాపక క్రియ కలయిక గతంలో కొనసాగిన చర్యను తెలియజేస్తుంది; ‘కేకలు వేస్తూ ఉండేవాడు’ ఆ కొనసాగింపు భావాన్ని నిలుపుతుంది.
- source_word: κατακόπτων ἑαυτὸν
  choice: తనను తాను కోసుకుంటూ
  rationale: κατακόπτω కోయడం లేదా తీవ్రంగా గాయపరచడం అనే భావం ఇస్తుంది; ‘కోసుకుంటూ’ స్పష్టమైనదీ సంయమనంతో కూడినదీ కాగా, తీవ్రతకు సంబంధించిన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: λίθοις
  choice: రాళ్లతో
  rationale: ఇక్కడ దత్తివిభక్తి సాధనార్థకం; ‘రాళ్లతో’ అనే రూపం సహజంగా సాధనాన్ని తెలుపుతుంది.
