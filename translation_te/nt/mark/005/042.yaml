id: MRK.5.42
reference: Mark 5:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἀνέστη τὸ κοράσιον καὶ περιεπάτει, ἦν γὰρ ἐτῶν δώδεκα. καὶ ἐξέστησαν ⸁εὐθὺς ἐκστάσει μεγάλῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/042.yaml
  text: And immediately the girl stood up and began walking[a], for she was twelve years old[b]. And immediately they were overcome with great amazement.
translation:
  language: te
  text: వెంటనే ఆ బాలిక లేచి నడవడం మొదలుపెట్టింది[a]; ఎందుకంటే ఆమెకు పన్నెండేళ్లు. వెంటనే వారు ఎంతో ఆశ్చర్యంతో దిగ్భ్రాంతి చెందారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లేచి నడుస్తూ ఉంది.’ గ్రీకు అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న నడకను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘గొప్ప ఆశ్చర్యంతో ఆశ్చర్యపోయారు.’ తీవ్రమైన విస్మయాన్ని తెలియజేయడానికి గ్రీకులో ఒకే మూలానికి చెందిన పదాలు వాడబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు వర్ణనలోని వేగాన్ని, తక్షణత్వాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀνέστη
  choice: లేచి
  rationale: యేసు ఆజ్ఞ తర్వాత బాలిక భౌతికంగా లేచిన చర్యను సహజంగా వ్యక్తం చేస్తుంది; ప్రధాన పాఠంలో పునరుత్థాన సంబంధమైన భావాన్ని అవసరానికి మించి బలపరచదు.
- source_word: τὸ κοράσιον
  choice: ఆ బాలిక
  rationale: κοράσιον యొక్క సాధారణ అర్థాన్ని ఇస్తుంది; తరువాత వయస్సు స్పష్టంగా ఉన్నందున మరింత వయోనిర్దేశం అవసరం లేదు.
- source_word: περιεπάτει
  choice: నడవడం మొదలుపెట్టింది
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే ప్రారంభమై కొనసాగిన చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἦν γὰρ ἐτῶν δώδεκα
  choice: ఎందుకంటే ఆమెకు పన్నెండేళ్లు
  rationale: γάρ యొక్క వివరణాత్మక సంబంధాన్ని నిలుపుతూ, వయస్సు చెప్పే సహజ తెలుగు ప్రయోగాన్ని ఉపయోగిస్తుంది.
- source_word: ἐξέστησαν
  choice: దిగ్భ్రాంతి చెందారు
  rationale: తీవ్రమైన విస్మయం వల్ల కలిగిన మనోస్థితిని తెలియజేస్తుంది; తరువాతి సహజాత పదబంధంతో ఉన్న గ్రీకు తీవ్రతను కలిపి అందిస్తుంది.
- source_word: ἐκστάσει μεγάλῃ
  choice: ఎంతో ఆశ్చర్యంతో
  rationale: తీవ్రమైన ఆశ్చర్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ఆధునిక పాఠకులను తప్పుదోవ పట్టించగల ‘పరవశం’ వంటి పదాన్ని నివారిస్తుంది.
theological_decisions:
- issue: ἀνέστηలో ఉండగల పునరుత్థాన ఛాయ
  choice: ప్రధాన పాఠంలో ‘లేచి’ అని అనువదించడం
  alternative: ‘పైకి లేచింది’ లేదా పునరుత్థాన భావాన్ని మరింత స్పష్టంగా వినిపించే పదప్రయోగం
  rationale: సందర్భం జీవానికి తిరిగి రావడాన్ని స్పష్టం చేస్తున్నా, క్రియ స్వయంగా సాధారణంగా లేవడాన్ని కూడా సూచించగలదు. అందువల్ల మూలంలోని భావపరిధిని మించకుండా సంఘటనను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వాక్యానికి తగిన గౌరవభరితమైన శైలిలో ఉంది. మూలంలోని రెండు εὐθὺς పదాలనూ ‘వెంటనే’గా నిలుపుకుంది; γάρ యొక్క వివరణాత్మక పాత్రను కూడా వ్యక్తం చేసింది.
