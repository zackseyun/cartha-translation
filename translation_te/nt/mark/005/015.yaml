id: MRK.5.15
reference: Mark 5:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔρχονται πρὸς τὸν Ἰησοῦν, καὶ θεωροῦσιν τὸν δαιμονιζόμενον ⸀καθήμενον ἱματισμένον καὶ σωφρονοῦντα, τὸν ἐσχηκότα τὸν ⸀λεγιῶνα, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/015.yaml
  text: And they came to Jesus and saw the demon-possessed man sitting there[b][a], clothed and in his right mind—the one who had the legion—and they were afraid.
translation:
  language: te
  text: వారు యేసు దగ్గరికి వచ్చి, దయ్యాలు పట్టిన ఆ మనిషిని చూశారు. అతడు బట్టలు వేసుకొని, స్వస్థబుద్ధితో కూర్చొని ఉన్నాడు; అతడే లెగియోను[a] పట్టిన మనిషి. అప్పుడు వారు భయపడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “లెగియోను” అనేది రోమా సైన్యంలోని పెద్ద దళానికి వాడే పదం. ఇక్కడ ఇది అనేక దయ్యాలు తమను తాము ముందుగా పిలుచుకున్న పేరు లేదా సమూహ సూచనను తిరిగి ప్రస్తావిస్తుంది.
    reason: historical_and_lexical_clarification
lexical_decisions:
- source_word: ἔρχονται
  choice: వచ్చి
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నా, తెలుగు కథన శైలిలో భూతకాల సందర్భానికి సహజంగా సరిపడే క్రియారూపం వాడబడింది.
- source_word: θεωροῦσιν
  choice: చూశారు
  rationale: ఇది కేవలం క్షణికంగా చూడడం కంటే ఎదురుగా ఉన్న స్థితిని గమనించడాన్ని సూచిస్తుంది; తెలుగులో ‘చూశారు’ సహజంగా ఆ భావాన్ని మోస్తుంది.
- source_word: δαιμονιζόμενον
  choice: దయ్యాలు పట్టిన ఆ మనిషి
  rationale: సందర్భంలో అనేక దయ్యాలు ఉన్నందున బహువచనం సహజం; ఇది అతని నిజమైన దయ్యాల పీడను తగ్గించకుండా, సామాన్య ఆధునిక తెలుగులో స్పష్టంగా చెబుతుంది.
- source_word: καθήμενον
  choice: కూర్చొని ఉండడం
  rationale: ఆ మనిషి కనిపించిన స్థితిని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: ἱματισμένον
  choice: బట్టలు వేసుకొని
  rationale: అతని మునుపటి స్థితికి విరుద్ధంగా ఇప్పుడు వస్త్రధారణలో ఉన్నాడనే దృశ్యమాన మార్పును సాధారణ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: σωφρονοῦντα
  choice: స్వస్థబుద్ధితో
  rationale: మానసిక స్పష్టతతో, ఆత్మనిగ్రహంతో ఉన్న పునరుద్ధరిత స్థితిని గౌరవప్రదంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: ἐσχηκότα
  choice: పట్టినవాడు
  rationale: గ్రీకు పరిపూర్ణ కృదంతం అతని పూర్వస్థితి ఆధారంగా అతన్ని గుర్తిస్తుంది. తెలుగు సందర్భంలో విముక్తి ఇప్పటికే స్పష్టంగా ఉండడంతో ఈ సహజ రూపం గత సంబంధాన్ని తగినంతగా తెలియజేస్తుంది.
- source_word: λεγιῶνα
  choice: ఆ లెగియోను
  rationale: ఇది ముందు వచనాల్లో దయ్యాలు తమను తాము పిలిచుకున్న పదాన్ని తిరిగి సూచిస్తుంది. లిప్యంతరీకరణ సైనిక ‘దళం’ అనే అర్థాన్ని మాత్రమే బలవంతంగా రుద్దకుండా ఆ ప్రత్యేక సూచనను కాపాడుతుంది.
- source_word: ἐφοβήθησαν
  choice: భయపడ్డారు
  rationale: వారి ప్రతిస్పందనను అతిశయింపకుండా సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: దయ్యాల పీడ వివరణ
  choice: దయ్యాలు పట్టిన ఆ మనిషి
  alternative: దయ్యం పట్టిన ఆ మనిషి
  rationale: మూలపాఠం δαιμονιζόμενον అనే ఏకవచన రూపంతో స్థితిని పేర్కొన్నప్పటికీ, సమీప సందర్భం అనేక దయ్యాలను స్పష్టంగా చూపుతుంది. తెలుగు బహువచనం ఆ కథన వాస్తవాన్ని సహజంగా ప్రతిబింబిస్తుంది; దాన్ని కేవలం మానసిక వ్యాధిగా మార్చదు.
- issue: λεγιών పదాన్ని బిరుదుగా లేదా పేరుగా చూపడం
  choice: ఆ లెగియోను
  alternative: ‘లెగియోను’ అనే దయ్యాల గుంపు
  rationale: గ్రీకు పదానికి ఉపపదం ఉండి, ముందు వచ్చిన స్వీయ-పేరును లేదా సమూహ సూచనను తిరిగి ప్రస్తావిస్తుంది. ప్రధాన పాఠం దీనిని లిప్యంతరీకరించి పేరా, వివరణాత్మక హోదానా అనే స్వల్ప సందిగ్ధతను కాపాడుతుంది.
- issue: ἐσχηκότα సూచించే పూర్వస్థితి
  choice: ఆ లెగియోను పట్టినవాడు
  alternative: ఆ లెగియోను పట్టివున్నవాడు
  rationale: ఆ మనిషి అప్పటికే విముక్తుడై స్వస్థబుద్ధితో కూర్చున్నాడని వాక్యం స్పష్టం చేస్తుంది. అందువల్ల సహజమైన తెలుగు గుర్తింపు ప్రయోగాన్ని ఎంచుకొని, అతనికి ఇంకా దయ్యాలు పట్టివున్నాయనే భావాన్ని నివారించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘స్వస్థబుద్ధితో’ కొద్దిగా సాహిత్య గంభీరత కలిగినప్పటికీ ఈ సందర్భంలో సహజంగా, అపహాస్యం లేకుండా పునరుద్ధరణను తెలియజేస్తుంది. మూలంలో లేని ‘అక్కడ’ను చేర్చలేదు; వాక్య నిర్మాణాన్ని తెలుగు సహజ క్రమానికి అనుగుణంగా మార్చాం.
