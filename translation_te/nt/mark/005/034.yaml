  to: అయితే ఆయన ఆమెతో, “కుమార్తె, నీ విశ్వాసం నిన్ను రక్షించింది[a]. సమాధానంతో వెళ్లు[b]; నీ బాధ నుండి స్వస్థంగా ఉండు” అని చెప్పాడు.
