id: MRK.5.34
reference: Mark 5:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· ὕπαγε εἰς εἰρήνην, καὶ ἴσθι ὑγιὴς ἀπὸ τῆς μάστιγός σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/034.yaml
  text: But he said to her[a], “Daughter, your faith has saved you. Go in peace[b], and be well from your affliction.”
translation:
  language: te
  text: అయితే ఆయన ఆమెతో, “కుమార్తె, నీ విశ్వాసం నిన్ను రక్షించింది[a]. సమాధానంతో వెళ్లు[b]; నీ బాధ నుండి స్వస్థంగా ఉండు” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ విశ్వాసం నిన్ను స్వస్థపరిచింది,” లేదా “నీ విశ్వాసం నిన్ను బాగుచేసింది.” ఈ గ్రీకు క్రియ రక్షణను, క్షేమాన్ని లేదా స్వస్థతను సూచించగలదు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “క్షేమంగా వెళ్లు” లేదా “సమాధానంలోకి వెళ్లు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Θυγάτηρ
  choice: కుమారీ
  rationale: సంబోధనలోని ఆప్యాయతను, కుటుంబ సంబంధ ఛాయను అదనపు స్వామ్యపదం చేర్చకుండా సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: πίστις
  choice: విశ్వాసం
  rationale: ఇక్కడ యేసుపై ఆమె ఉంచిన నమ్మకాన్ని సూచిస్తుంది; కీలకమైన గ్రీకు పదానికి స్థిరమైన, విస్తృతంగా అర్థమయ్యే తెలుగు రూపం.
- source_word: σέσωκέν σε
  choice: నిన్ను రక్షించింది
  rationale: σῴζω పదంలోని రక్షణ, స్వస్థత అనే విస్తృత భావపరిధిని కేవలం శారీరక స్వస్థతకే పరిమితం చేయకుండా ఉంచుతుంది; పరిపూర్ణ కాల ఫలితస్థితిని తెలుగు క్రియ సహజంగా తెలియజేస్తుంది.
- source_word: ὕπαγε εἰς εἰρήνην
  choice: సమాధానంతో వెళ్లు
  rationale: ప్రయాణం లేదా విడిచి వెళ్లడం సమాధాన స్థితిలో జరగాలని తెలిపే గ్రీకు నుడికారాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ἴσθι ὑγιὴς
  choice: స్వస్థతతో ఉండు
  rationale: ఇది నేరుగా ‘స్వస్థపరచబడుము’ అనే సంఘటనాత్మక ఆజ్ఞకంటే, ఆరోగ్యంగా ఉండే స్థితిని సూచించే వాక్యరూపం; అందువల్ల స్థిత్యర్థాన్ని నిలుపుతుంది.
- source_word: μάστιγός
  choice: బాధ
  rationale: అక్షరార్థమైన ‘కొరడా’ను ఇక్కడ రూపకాలంకారంగా తీవ్రమైన వ్యాధిబాధకు వాడారు; ‘బాధ’ ఆ విస్తృతమైన వేదనను సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: σῴζω పదంలో రక్షణ–స్వస్థత భావాల సంబంధం
  choice: రక్షించింది
  alternative: స్వస్థపరిచింది / బాగుచేసింది
  rationale: తరువాతి వాక్యభాగం శారీరక స్వస్థతను ప్రత్యేకంగా ప్రస్తావిస్తున్నందున, మొదటి క్రియలోని విస్తృత రక్షణార్థాన్ని నిలిపి, ఉద్దేశపూర్వకమైన భావ ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచుతుంది.
- issue: πίστις భావం
  choice: విశ్వాసం
  alternative: నమ్మకం
  rationale: ఈ సందర్భంలో అది యేసుపై ఆమె ఉంచిన నమ్మకాన్ని సూచించినా, మూలపదానికి ఉన్న ముఖ్యమైన ధార్మిక మరియు కథన సంబంధాన్ని ‘విశ్వాసం’ బాగా కాపాడుతుంది.
- issue: ἴσθι ὑγιὴς యొక్క స్థిత్యర్థం
  choice: స్వస్థతతో ఉండు
  alternative: స్వస్థపడు / బాగుండు
  rationale: యేసు పలికిన మాటను కొత్త స్వస్థత సంభవింపజేసే ఆజ్ఞగా మాత్రమే కాక, పొందిన ఆరోగ్యస్థితిలో కొనసాగమనే భావంతోనూ చదవగల గ్రీకు నిర్మాణాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘కుమారీ’ ఆప్యాయ సంబోధనను నిలుపుతుంది. ‘స్వస్థతతో ఉండు’ కొద్దిగా గంభీరమైన నిర్మాణమైనా గ్రీకు స్థిత్యర్థాన్ని స్పష్టంగా కాపాడుతుంది.
