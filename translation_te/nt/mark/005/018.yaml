source:
  edition: SBLGNT
  text: καὶ ⸀ἐμβαίνοντος αὐτοῦ εἰς τὸ πλοῖον παρεκάλει αὐτὸν ὁ δαιμονισθεὶς ἵνα ⸂μετ’ αὐτοῦ ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/018.yaml
  text: And as he was getting into the boat[a], the man who had been demon-possessed kept begging him that he might be with him.
translation:
  language: te
  text: ఆయన పడవలోకి ఎక్కుతుండగా, ఇంతకుముందు దయ్యం పట్టినవాడు ఆయనతో ఉండనివ్వమని ఆయనను పదేపదే వేడుకున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβαίνοντος αὐτοῦ
  choice: ఆయన పడవ ఎక్కుతూ ఉండగా
  rationale: వర్తమాన కృదంతంతో ఏర్పడిన genitive absolute ప్రధాన క్రియ జరుగుతున్న సమయంలోనే కొనసాగుతున్న చర్యను సూచిస్తుంది; ‘ఎక్కుతూ ఉండగా’ ఆ సమకాలీన, కొనసాగుతున్న భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: πλοῖον
  choice: పడవ
  rationale: గలిలయ సముద్రపు సువార్త సందర్భంలో ‘పడవ’ సహజమైన ఆధునిక తెలుగు పదం; ‘ఓడ’ అనవసరంగా పెద్ద నౌక భావాన్ని కలిగించవచ్చు.
- source_word: παρεκάλει
  choice: పదేపదే వేడుకున్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగిన లేదా మళ్లీమళ్లీ చేసిన విజ్ఞప్తిని సూచిస్తుంది; ఈ అనువాదం ఆ కాలరూపపు కొనసాగింపు భావాన్నీ విజ్ఞప్తి తీవ్రతనూ వ్యక్తం చేస్తుంది.
- source_word: ὁ δαιμονισθείς
  choice: ఇంతకుముందు దయ్యం పట్టి ఉండినవాడు
  rationale: నామవాచకంగా వాడిన కృదంతం ముందుగా దయ్యపు పీడలో ఉండి ఇప్పుడు విడుదల పొందిన వ్యక్తిని సూచిస్తుంది. ‘ఇంతకుముందు’ అనే పదం కథన సందర్భంలోని పూర్వస్థితిని స్పష్టం చేస్తుంది.
- source_word: ἵνα μετ’ αὐτοῦ ᾖ
  choice: తనను ఆయనతో ఉండనివ్వమని
  rationale: ἵνα + వర్తమాన subjunctive విజ్ఞప్తి విషయాన్ని తెలియజేస్తుంది. ఈ రూపం కేవలం ప్రయాణించడం కంటే ‘ఆయనతో ఉండడం’ అనే వ్యక్తిగత, సంబంధాత్మక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: δαιμονισθείς అనే పదాన్ని తరువాతి కాలపు వైద్య లేదా రూపకాల వర్గాలను రుద్దకుండా వ్యక్తిగత దయ్యపు పీడను సూచించేలా అనువదించడం
  choice: దయ్యం పట్టి ఉండినవాడు
  alternative: దయ్యాల ఆధీనంలో ఉండినవాడు
  rationale: సువార్త కథనంలో ఈ పదం వ్యక్తిపై నిజమైన దయ్యపు ఆధిపత్యాన్ని సూచిస్తుంది. ‘దయ్యం పట్టడం’ సాధారణ తెలుగు పాఠకులకు స్పష్టమైన, స్థిరపడిన వ్యక్తీకరణ; ఇది ఆ స్థితిని కేవలం అనారోగ్యంగా తగ్గించదు. అదే సమయంలో మూలపదంలో వ్యాకరణపరంగా స్పష్టంగా లేని దయ్యాల సంఖ్యను ప్రధాన పాఠ్యంలో అనవసరంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా రూపొందించబడింది. సర్వనామాల సూచన స్పష్టంగా ఉండేందుకు ‘ఆయన’ను పునరావృతం చేశాం; ‘పదేపదే’ అసంపూర్ణ భూతకాలపు కొనసాగింపు భావాన్ని తెలియజేస్తుంది.
