  text: ἦν δὲ ἐκεῖ πρὸς τῷ ὄρει ἀγέλη χοίρων μεγάλη βοσκομένη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/011.yaml
  text: There was there near the mountain a large herd of pigs feeding[a][b].
translation:
  language: te
  text: అక్కడ కొండ దగ్గర ఒక పెద్ద పందుల మంద మేస్తూ ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కొండ పక్కన.’ గ్రీకు పదబంధం కొండకు సమీపంలో లేదా దాని పక్కన ఉన్న స్థానాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: ఉంది
  rationale: ἦν ఉనికిని సూచిస్తుంది; δέ స్వల్ప కథన అనుసంధానకం. తెలుగులో సహజమైన వాక్యప్రవాహంలో దీనికి ప్రత్యేక పదం అవసరం లేదు.
- source_word: ἐκεῖ
  choice: అక్కడ
  rationale: స్థలాన్ని సూచించే సాధారణ, ప్రత్యక్ష తెలుగు సమానార్థకం.
- source_word: πρὸς τῷ ὄρει
  choice: కొండ దగ్గర
  rationale: దత్తివుతో కూడిన πρός ఇక్కడ కొండకు సమీపంలో లేదా పక్కన ఉన్న స్థానాన్ని సూచిస్తుంది; ‘దగ్గర’ సహజంగా ఉండి అతినిర్దిష్టతను నివారిస్తుంది.
- source_word: ἀγέλη
  choice: మంద
  rationale: జంతువుల గుంపును సూచించే సహజమైన తెలుగు పదం.
- source_word: χοίρων
  choice: పందుల
  rationale: χοῖρος‌కు ఆధునిక, సాధారణ తెలుగు సమానార్థకం ‘పంది’; సందర్భానుసారం సంబంధరూపం వాడబడింది.
- source_word: μεγάλη
  choice: పెద్ద
  rationale: ఇక్కడ మంద పరిమాణం లేదా సంఖ్య అధికంగా ఉందని సూచిస్తుంది.
- source_word: βοσκομένη
  choice: మేస్తూ
  rationale: వర్తమాన మధ్య/కర్మణి కృదంతం మంద ఆహారం తింటున్న స్థితిని వర్ణిస్తుంది. సందర్భంలో ‘మేస్తూ’ సహజమైనది; ఎవరో మేపుతున్నారని అనవసరంగా నిర్దిష్టం చేయదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘మేస్తూ ఉంది’ అనే ఏకవచన క్రియారూపం ‘మంద’ అనే సమూహవాచక నామవాచకానికి అనుగుణంగా ఉంది. ‘పందులు’కు ‘సూకరాలు’ వంటి ప్రత్యేక పాదటిప్పణి ఇవ్వలేదు; అది అర్థభేదం కాక కేవలం అధిక సాహిత్య/సంస్కృతనిష్ఠ రూపం.
