  source_fidelity: 'The translation accurately represents ἦν ... ἀγέλη χοίρων μεγάλη βοσκομένη: an existential statement locating a large herd of pigs near the mountain and describing it as feeding/grazing. ‘కొండ దగ్గర’ appropriately conveys πρὸς τῷ ὄρει without over-specifying the location. The mild connective δέ may naturally remain implicit in Telugu narrative style.'
