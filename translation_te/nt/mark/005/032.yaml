  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘చూస్తూనే ఉన్నాడు’ అనే రూపం కొనసాగుతున్న చర్యను స్పష్టంగా తెలియజేస్తుంది.
