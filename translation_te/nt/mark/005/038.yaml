  text: καὶ ⸀ἔρχονται εἰς τὸν οἶκον τοῦ ἀρχισυναγώγου, καὶ θεωρεῖ θόρυβον ⸀καὶ κλαίοντας καὶ ἀλαλάζοντας πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/038.yaml
  text: And they come to the house of the synagogue leader[a], and he sees a commotion, and people weeping and wailing loudly.
translation:
  language: te
  text: వారు సమాజమందిరపు నాయకుని ఇంటికి వస్తారు, ఆయన కోలాహలాన్ని[a], ఏడుస్తున్నవారినీ బిగ్గరగా విలపిస్తున్నవారినీ చూస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గందరగోళాన్ని”; గ్రీకు పదం పెద్ద శబ్దంతో కూడిన కలవరాన్ని లేదా అల్లకల్లోలాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: వస్తారు
  rationale: కథనానికి సజీవతనిచ్చే గ్రీకు చారిత్రక వర్తమాన కాలాన్ని తెలుగులోనూ వర్తమాన రూపంతో నిలిపింది.
- source_word: οἶκον
  choice: ఇంటికి
  rationale: οἶκοςకు సందర్భానుగుణమైన సహజ తెలుగు సమానార్థకం; నివాస స్థలాన్ని నేరుగా సూచిస్తుంది.
- source_word: ἀρχισυναγώγου
  choice: సమాజమందిరపు నాయకుని
  rationale: యూదుల సమాజమందిరానికి నాయకత్వం వహించే అధికారిని ఆధునిక పాఠకునికి స్పష్టంగా సూచిస్తుంది.
- source_word: θεωρεῖ
  choice: చూస్తాడు
  rationale: ఏకవచన క్రియ సందర్భంలో యేసును సూచిస్తుంది; సరళమైన వర్తమాన రూపం గ్రీకు కథన సజీవతను నిలుపుతుంది.
- source_word: θόρυβον
  choice: కోలాహలాన్ని
  rationale: కేవలం శబ్దాన్ని కాక, దుఃఖ సందర్భంలోని పెద్ద శబ్దంతో కూడిన కలవరాన్ని కూడా వ్యక్తం చేస్తుంది.
- source_word: κλαίοντας
  choice: ఏడుస్తూ
  rationale: దృశ్యంలో ఉన్నవారి కొనసాగుతున్న రోదనను సహజమైన తెలుగు క్రియావిశేషణ రూపంలో తెలియజేస్తుంది.
- source_word: ἀλαλάζοντας
  choice: విలపిస్తున్నవారిని
  rationale: దుఃఖంలో గొంతెత్తి రోదించడాన్ని సూచించే గ్రీకు పదానికి సందర్భోచితమైన తెలుగు రూపం.
- source_word: πολλά
  choice: బిగ్గరగా
  rationale: ఇక్కడ ఈ పదం విలాప తీవ్రతను క్రియావిశేషణంగా పెంచుతుంది; సహజ తెలుగులో ‘బిగ్గరగా’ ఆ భావాన్ని అందిస్తుంది.
