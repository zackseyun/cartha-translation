  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τὸ αὐτὸν πολλάκις πέδαις καὶ ἁλύσεσι δεδέσθαι καὶ διεσπάσθαι ὑπ’ αὐτοῦ τὰς ἁλύσεις καὶ τὰς πέδας συντετρῖφθαι, καὶ οὐδεὶς ⸂ἴσχυεν αὐτὸν⸃ δαμάσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/004.yaml
  text: because he had often been bound with shackles and chains[a], and the chains had been torn apart by him and the shackles smashed to pieces, and no one was strong enough to subdue him.
translation:
  language: te
  text: ఎందుకంటే, అతణ్ణి చాలాసార్లు కాళ్ల సంకెళ్లతోను గొలుసులతోను బంధించారు; అతడు గొలుసులను తెంచివేశాడు, కాళ్ల సంకెళ్లను ముక్కలు చేశాడు. అతణ్ణి అదుపులోకి తీసుకురావడానికి ఎవరికీ శక్తి సరిపోలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతణ్ణి మచ్చిక చేయడానికి ఎవరికీ శక్తి సరిపోలేదు.” గ్రీకు క్రియకు “మచ్చిక చేయడం” లేదా విస్తృతంగా “లొంగదీసి అదుపులోకి తీసుకురావడం” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ αὐτὸν
  choice: ఎందుకంటే, అతణ్ణి … బంధించారు
  rationale: διάతో కూడిన articular infinitive ముందున్న వాక్యానికి కారణాన్ని సూచిస్తుంది. తెలుగులో సహజమైన కారణార్థక నిర్మాణంగా మార్చబడింది; గ్రీకు కర్మవాచ్య భావం నిలుపబడింది.
- source_word: πολλάκις
  choice: చాలాసార్లు
  rationale: పునరావృతంగా జరిగిన క్రియను సామాన్య ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: πέδαις
  choice: కాళ్ల సంకెళ్లతో
  rationale: πέδη ప్రత్యేకంగా పాదాలకు వేసే బంధనాన్ని సూచిస్తుంది. ἅλυσιςతో ఉన్న భేదాన్ని నిలుపుటకు ‘కాళ్ల సంకెళ్లు’ అని అనువదించబడింది.
- source_word: ἁλύσεσι / τὰς ἁλύσεις
  choice: గొలుసులతో / గొలుసులను
  rationale: సాధారణ గొలుసులను సూచించే పదం; πέδαις నుండి పదార్థ భేదం స్పష్టంగా ఉంటుంది.
- source_word: δεδέσθαι
  choice: బంధించారు
  rationale: అతడు పదేపదే బంధించబడిన విషయాన్ని సహజ తెలుగు కథనంలో కర్మవాచ్య భావంతో తెలియజేస్తుంది.
- source_word: διεσπάσθαι ὑπ’ αὐτοῦ
  choice: అతడు … తెంచివేశాడు
  rationale: గొలుసులను బలంగా విడదీయడం అనే భావాన్ని క్రియాశీల తెలుగు వాక్యంతో స్పష్టంగా వ్యక్తం చేస్తుంది; ὑπ’ αὐτοῦ సూచించే కర్తృత్వం నిలిచింది.
- source_word: συντετρῖφθαι
  choice: ముక్కలు చేశాడు
  rationale: నలగగొట్టడం లేదా పూర్తిగా విరగగొట్టడం అనే బలమైన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: οὐδεὶς ἴσχυεν
  choice: బలం ఎవరికీ లేదు
  rationale: కేవలం సామర్థ్యం కాక శక్తి చాలకపోవడం అనే ἰσχύω భావాన్ని కాపాడుతుంది.
- source_word: δαμάσαι
  choice: అదుపులోకి తీసుకురాగల
  rationale: సందర్భంలో వ్యక్తిని లొంగదీసి నియంత్రణలో ఉంచడం అనే విస్తృత భావాన్ని ఇస్తుంది; ‘మచ్చిక చేయడం’ అనే ప్రత్యామ్నాయ భావాన్ని పాదసూచనలో ఉంచింది.
theological_decisions:
- issue: ఆ మనిషి స్థితి మరియు అసాధారణ బలానికి కారణం
  choice: అతణ్ణి బంధించడానికి పదేపదే చేసిన ప్రయత్నాలు విఫలమయ్యాయని మాత్రమే వర్ణనాత్మకంగా అనువదించడం
  alternative: ఈ వచనంలోనే ఆ బలాన్ని దయ్యపు శక్తిగా ప్రత్యక్షంగా పేర్కొనడం
  rationale: గ్రీకు పాఠం ఇక్కడ అతని అసాధారణ బలాన్ని, అతణ్ణి అదుపు చేయలేకపోవడాన్ని వర్ణిస్తుంది; దానికి అదనపు కారణ వివరణను ఈ వచనంలో చేర్చదు. చుట్టుపక్కల కథనం ఇచ్చే సందర్భాన్ని అనువాదం ముందుగానే సిద్ధాంతీకరించదు.
- issue: δαμάσαι యొక్క భావపరిధి
  choice: అదుపులోకి తీసుకురావడం
  alternative: మచ్చిక చేయడం
  rationale: ఈ క్రియకు ‘మచ్చిక చేయడం’ మరియు విస్తృతంగా ‘లొంగదీయడం/అదుపు చేయడం’ అనే భావాలు రెండూ సాధ్యమే. మనిషి గురించి ఈ సందర్భంలో ‘అదుపులోకి తీసుకురావడం’ సహజమైనదిగా ఉండగా, నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని పాదసూచనలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరమైన కథన శైలి. కాళ్ల సంకెళ్లు మరియు గొలుసులు అనే రెండు వేర్వేరు బంధన పదాలు నిలుపబడ్డాయి. పొడవైన గ్రీకు కారణ నిర్మాణం తెలుగు పఠనసౌలభ్యం కోసం మూడు వాక్యాలుగా విభజించబడింది.
