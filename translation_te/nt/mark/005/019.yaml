- from: ఆయన అతణ్ణి అనుమతించలేదు. బదులుగా అతనితో, “నీ ఇంటికి, నీ వాళ్ల దగ్గరికి[a] వెళ్లి, ప్రభువు[b] నీకు చేసినదంతా, నిన్ను కనికరించిన విధానమంతా వారికి తెలియజేయి” అని చెప్పాడు.
  to: ఆయన అతణ్ణి అనుమతించలేదు. బదులుగా అతనితో, “నీ ఇంటికి, నీ సొంతవారి దగ్గరికి[a] వెళ్లి, ప్రభువు[b] నీకోసం ఎంత చేశాడో, నీపై ఎలా కనికరం చూపాడో వారికి తెలియజేయి” అని చెప్పాడు.
  rationale: The revision directly expresses the two coordinated actions—what the Lord did for the man and how he showed him mercy—without introducing an unnecessary focus on the manner or totality of mercy. It also replaces a colloquial expression with a modern-standard equivalent that more transparently reflects the Greek ‘his own [people].’
  reviewer_model: gpt-5.6-terra
