id: MRK.5.19
reference: Mark 5:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀καὶ οὐκ ἀφῆκεν αὐτόν, ἀλλὰ λέγει αὐτῷ· Ὕπαγε εἰς τὸν οἶκόν σου πρὸς τοὺς σούς, καὶ ⸀ἀπάγγειλον αὐτοῖς ὅσα ⸂ὁ κύριός σοι⸃ πεποίηκεν καὶ ἠλέησέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/019.yaml
  text: And he did not permit him[a], but said to him, “Go to your home, to your own people[c][b], and report to them how much the Lord has done for you and has shown mercy to you.”
translation:
  language: te
  text: ఆయన అతణ్ణి అనుమతించలేదు. బదులుగా అతనితో, “నీ ఇంటికి, నీ సొంతవారి దగ్గరికి[a] వెళ్లి, ప్రభువు[b] నీకోసం ఎంత చేశాడో, నీపై ఎలా కనికరం చూపాడో వారికి తెలియజేయి” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా, ‘నీ సొంతవారి దగ్గరికి.’ ఇది కుటుంబ సభ్యులతోపాటు బంధువులు, సన్నిహితులను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘ప్రభువు’ అనేది ప్రత్యేకంగా దేవుణ్ణి సూచిస్తుందని కొందరు భావిస్తారు; మరికొందరు దేవుని కనికరానికీ యేసు చేసిన కార్యానికీ మధ్య ఉన్న సంబంధాన్ని మార్కు ఉద్దేశపూర్వకంగా నిలిపాడని భావిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφῆκεν
  choice: అనుమతించలేదు
  rationale: ఈ సందర్భంలో ἀφίημι అంటే ‘అనుమతించడం’; ‘క్షమించడం’ లేదా ‘విడిచిపెట్టడం’ కాదు.
- source_word: εἰς τὸν οἶκόν σου
  choice: నీ ఇంటికి
  rationale: οἶκος ఇక్కడ కేవలం భవనాన్ని కాక, అతని గృహ పరిధిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నీ ఇంటికి’ సహజంగా ఉంది.
- source_word: πρὸς τοὺς σούς
  choice: నీ వాళ్ల దగ్గరికి
  rationale: గ్రీకు పదబంధం అక్షరార్థంగా ‘నీ సొంతవారి దగ్గరికి.’ ‘నీ వాళ్లు’ కుటుంబం, బంధువులు, సన్నిహితులు అనే విస్తృత భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀπάγγειλον
  choice: తెలియజేయి
  rationale: ἀπαγγέλλω జరిగినదాన్ని తిరిగి నివేదించడం లేదా చెప్పడం అనే భావం ఇస్తుంది; ‘తెలియజేయి’ స్పష్టంగా, గౌరవప్రదంగా ఉంది.
- source_word: ὅσα
  choice: చేసినదంతా … విధానమంతా
  rationale: ὅσα ఇక్కడ ప్రభువు చేసిన కార్యం యొక్క విస్తృతి లేదా సమగ్రతను సూచిస్తుంది. తెలుగు వాక్యంలో ‘దంతా/మంతా’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ κύριος
  choice: ప్రభువు
  rationale: κύριος యొక్క సాధారణ ధార్మిక అర్థాన్ని ‘ప్రభువు’ నిలుపుతుంది; దాన్ని ప్రధాన పాఠ్యంలో ‘దేవుడు’గా మార్చి సందర్భంలోని ఉద్దేశపూర్వక ఉద్వేగాన్ని పరిష్కరించలేదు.
- source_word: ἠλέησέν σε
  choice: నిన్ను కనికరించిన
  rationale: ἐλεάω అంటే కనికరం లేదా కరుణ చూపడం. ‘కనికరించిన’ మూలంలోని క్రియాభావాన్ని, ధార్మిక ప్రాముఖ్యతను నిలుపుతుంది.
theological_decisions:
- issue: యేసు చెప్పిన ‘ప్రభువు’ (κύριος) ఎవరిని సూచిస్తుంది?
  choice: ప్రభువు
  alternative: దేవుడు
  rationale: ఈ సందర్భంలో కొందరు దీన్ని ప్రత్యేకంగా దేవునికి సూచనగా గ్రహిస్తారు. అయితే స్వస్థపరిచిన కార్యాన్ని యేసే చేసినందున, దేవుని కనికరానికీ యేసు అధికారానికీ మధ్య మార్కు నిలిపిన సంబంధాన్ని ‘ప్రభువు’ అనే అనువాదం తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘నీ వాళ్లు’ సామాన్య పాఠకులకు సులభంగా అర్థమవుతూ, గ్రీకు పదబంధంలోని విస్తృతిని ‘కుటుంబం’ అనే సంకుచిత అర్థానికి పరిమితం చేయదు.
