id: MRK.5.29
reference: Mark 5:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐξηράνθη ἡ πηγὴ τοῦ αἵματος αὐτῆς, καὶ ἔγνω τῷ σώματι ὅτι ἴαται ἀπὸ τῆς μάστιγος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/029.yaml
  text: And immediately the flow of her blood dried up[b][a], and she knew in her body that she had been healed of the affliction.
translation:
  language: te
  text: వెంటనే ఆమె రక్తస్రావపు ఊట ఎండిపోయింది[a], మరియు ఆ బాధ నుండి[b] తాను స్వస్థత పొందానని ఆమె తన శరీరంలో గ్రహించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమె రక్తస్రావపు మూలం ఎండిపోయింది.” గ్రీకులో ఊట లేదా మూలం అనే సజీవమైన చిత్రం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “బాధ”కు వాడిన గ్రీకు పదానికి అక్షరార్థంగా “కొరడా దెబ్బ” అనీ, రూపకంగా “తీవ్రమైన పీడ” లేదా “వ్యాధి” అనీ అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు వర్ణనలోని తక్షణత్వాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐξηράνθη
  choice: ఎండిపోయింది
  rationale: క్రియలోని సజీవమైన ‘ఎండిపోవడం’ అనే రూపకాన్ని నిలుపుతుంది; కేవలం ‘ఆగిపోయింది’ అని వివరణాత్మకంగా మార్చదు.
- source_word: ἡ πηγὴ τοῦ αἵματος αὐτῆς
  choice: ఆమె రక్తస్రావపు ఊట
  rationale: πηγή అనే ‘ఊట/మూలం’ చిత్రాన్ని కాపాడుతూ, సందర్భంలో అది రక్తస్రావాన్ని సూచిస్తుందని సహజంగా తెలియజేస్తుంది.
- source_word: ἔγνω τῷ σώματι
  choice: ఆమె తన శరీరంలో గ్రహించింది
  rationale: ἔγνω లోని తెలుసుకోవడం/గ్రహించడం భావాన్నీ, τῷ σώματι లోని శారీరక అనుభూతినీ రెండింటినీ నిలుపుతుంది.
- source_word: ἴαται
  choice: స్వస్థత పొందానని
  rationale: గ్రీకు పరిపూర్ణ కాలం సూచించే పూర్తయిన స్వస్థత మరియు కొనసాగుతున్న ఫలితాన్ని సందర్భానుకూల తెలుగు రూపం తెలియజేస్తుంది.
- source_word: ἀπὸ τῆς μάστιγος
  choice: ఆ బాధనుండి
  rationale: μάστιξ యొక్క అక్షరార్థమైన ‘కొరడా’ కాకుండా, ఇక్కడ ఉద్దేశించిన తీవ్రమైన బాధ/వ్యాధిని సులభంగా తెలియజేస్తూ ἀπό లోని ‘నుండి’ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: స్వస్థత యొక్క స్వభావం
  choice: రక్తస్రావం నిజంగా, వెంటనే నిలిచిపోయిందనీ, ఆ శారీరక స్వస్థతను ఆమె స్వయంగా గ్రహించిందనీ అనువదించడం
  alternative: ఆమెకు స్వస్థత కలిగినట్లు కేవలం అనిపించిందని భావానువాదం చేయడం
  rationale: గ్రీకు పాఠం రక్తస్రావపు ఊట ఎండిపోవడం అనే వాస్తవిక మార్పునూ, దాన్ని ఆమె శరీరంలో గ్రహించడాన్నీ వేర్వేరుగా పేర్కొంటుంది; స్వస్థత ఎలా సంభవించిందనే అదనపు సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే మూలంలోని ఊట-ఎండిపోవడం అనే సజీవ రూపకాన్నీ శరీరంలో గ్రహించడం అనే భావాన్నీ కాపాడే గౌరవప్రదమైన శైలి.
