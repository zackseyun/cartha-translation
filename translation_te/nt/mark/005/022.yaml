    text: మూల గ్రీకులో కథనాన్ని సజీవంగా చెప్పేందుకు ‘వస్తున్నాడు … పడుతున్నాడు’ అనే చారిత్రక వర్తమాన కాల రూపాలు ఉన్నాయి.
    reason: lexical_alternative
  revision_rationale: Removed the added temporal adverb “అప్పుడు,” improved the appositional naming construction, and used “పడిపోయాడు” for the direct physical sense of falling at someone’s feet. The historical-present footnote remains correctly anchored and accurately describes both Greek present verbs.
