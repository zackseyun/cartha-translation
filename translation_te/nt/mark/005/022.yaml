revisions:
- from: అప్పుడు సమాజమందిరపు అధికారులలో ఒకడైన యాయీరు వచ్చాడు.[a] అతడు యేసును చూసి, ఆయన పాదాల దగ్గర పడ్డాడు.
  to: సమాజమందిరపు నాయకులలో ఒకడు, యాయీరు అనే వాడు, వచ్చాడు.[a] అతడు యేసును చూసి, ఆయన పాదాల దగ్గర పడిపోయాడు.
  rationale: Removed the added temporal adverb “అప్పుడు,” improved the appositional naming construction, and used “పడిపోయాడు” for the direct physical sense of falling at someone’s feet. The historical-present footnote remains correctly anchored and accurately describes both Greek present verbs.
  reviewer_model: gpt-5.6-terra
