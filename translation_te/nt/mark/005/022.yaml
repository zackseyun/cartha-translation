id: MRK.5.22
reference: Mark 5:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀καὶ ἔρχεται εἷς τῶν ἀρχισυναγώγων, ὀνόματι Ἰάϊρος, καὶ ἰδὼν αὐτὸν πίπτει πρὸς τοὺς πόδας αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/022.yaml
  text: And one of the synagogue rulers[a], named Jairus, came, and when he saw him[b], he fell at his feet.
translation:
  language: te
  text: సమాజమందిరపు నాయకులలో ఒకడు, యాయీరు అనే వాడు, వచ్చాడు.[a] అతడు యేసును చూసి, ఆయన పాదాల దగ్గర పడిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో కథనాన్ని సజీవంగా చెప్పేందుకు ‘వస్తున్నాడు … పడుతున్నాడు’ అనే చారిత్రక వర్తమాన కాల రూపాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: వచ్చాడు
  rationale: గ్రీకులో కథనానికి సజీవతనిచ్చే చారిత్రక వర్తమాన కాలం ఉంది. ఆధునిక తెలుగు కథనంలో సహజంగా ఉండే భూతకాల రూపాన్ని ఎంచుకున్నాం.
- source_word: εἷς τῶν ἀρχισυναγώγων
  choice: సమాజమందిరపు అధికారులలో ఒకడు
  rationale: εἷς τῶν అనే భాగసూచక నిర్మాణాన్ని ‘అధికారులలో ఒకడు’ అని నిలిపాం. ἀρχισυνάγωγος సమాజమందిర నిర్వహణ బాధ్యతగల నాయకుడు లేదా అధికారిని సూచిస్తుంది; ‘అధికారి’ సాధారణ పాఠకులకు సహజంగా ఉండి, అతని పరిపాలనా పాత్రను తెలియజేస్తుంది.
- source_word: ὀνόματι Ἰάϊρος
  choice: యాయీరు
  rationale: పేరు తెలిపే గ్రీకు ప్రయోగాన్ని తెలుగులో ‘ఒకడైన యాయీరు’ అనే సహజమైన నిర్మాణంలో వ్యక్తం చేశాం; Ἰάϊρος అనే పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: ἰδὼν αὐτὸν
  choice: అతడు యేసును చూసి
  rationale: అస్పష్టత కలగకుండా సందర్భంలోని αὐτόν ఎవరిని సూచిస్తుందో ‘యేసును’ అని వ్యక్తం చేశాం. Aorist participle తెలిపే చర్యల క్రమాన్ని ‘చూసి’ సహజంగా చూపిస్తుంది.
- source_word: πίπτει πρὸς τοὺς πόδας αὐτοῦ
  choice: ఆయన పాదాల దగ్గర పడ్డాడు
  rationale: πίπτει అనే చారిత్రక వర్తమానాన్ని సహజ తెలుగు కథన భూతకాలంలో ఇచ్చాం. πρὸς τοὺς πόδας అనే శారీరక చర్యను ‘పాదాల దగ్గర పడ్డాడు’ అని నేరుగా వ్యక్తం చేశాం.
theological_decisions:
- issue: యేసు ఎదుట యాయీరు చేసిన చర్య స్వభావం
  choice: ఆయన పాదాల దగ్గర పడ్డాడు
  alternative: ఆయనను ఆరాధించాడు / ఆయన ఎదుట మోకరించాడు
  rationale: గ్రీకు పాఠం యేసు పాదాల దగ్గర పడిన భౌతిక చర్యను మాత్రమే స్పష్టంగా చెబుతుంది. అది గౌరవం, వేడుకోలు లేదా తీవ్ర ఆవేదనను సూచించవచ్చు; అయితే ఇక్కడ ఆరాధనను తెలిపే ప్రత్యేక పదం లేదు. అందువల్ల భావాన్ని సిద్ధాంతపరంగా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. గ్రీకు చారిత్రక వర్తమానాన్ని సహజ తెలుగు భూతకాలంలో అందించి, దాని రూపాన్ని పాదసూచికలో తెలిపాం.
