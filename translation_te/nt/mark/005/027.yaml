translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. గ్రీకు అసమాపక క్రియల క్రమాన్ని ‘విని… వచ్చి… తాకింది’గా నిలిపి, ప్రధాన చర్యను స్పష్టంగా ఉంచింది.
