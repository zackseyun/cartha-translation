  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἀκούσασα περὶ τοῦ Ἰησοῦ, ἐλθοῦσα ἐν τῷ ὄχλῳ ὄπισθεν ἥψατο τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/027.yaml
  text: having heard about Jesus[a], she came up behind him in the crowd and touched his garment.
translation:
  language: te
  text: ఆమె యేసు గురించి విని, జనసమూహంలో ఆయన వెనుకనుంచి వచ్చి, ఆయన వస్త్రాన్ని[a] తాకింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పైవస్త్రాన్ని.’ గ్రీకు పదం ἱμάτιον సాధారణంగా ఒక వస్త్రాన్ని, తరచుగా పైవస్త్రాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσασα
  choice: విని
  rationale: స్త్రీలింగ ఏకవచన భూతకాల అసమాపక క్రియ ప్రధాన చర్యకు ముందు జరిగినదాన్ని సూచిస్తుంది; తెలుగులో ‘విని’ ఈ క్రమాన్ని సహజంగా నిలుపుతుంది.
- source_word: περὶ τοῦ Ἰησοῦ
  choice: యేసు గురించి
  rationale: περί + షష్ఠీ విభక్తి ఇక్కడ ‘గురించి’ అనే సమాచారార్థాన్ని ఇస్తుంది.
- source_word: ἐλθοῦσα
  choice: వచ్చి
  rationale: మరో భూతకాల అసమాపక క్రియగా ప్రధాన చర్యకు దారితీసే కదలికను తెలుగులో సహజమైన క్రియాక్రమంతో వ్యక్తపరుస్తుంది.
- source_word: ἐν τῷ ὄχλῳ
  choice: జనసమూహంలో
  rationale: ἐν + చతుర్థీ విభక్తి ఇక్కడ స్థలాన్ని లేదా చుట్టూ ఉన్న పరిస్థితిని సూచిస్తుంది.
- source_word: ὄπισθεν
  choice: ఆయన వెనుకనుంచి
  rationale: వెనుక వైపు నుంచి సమీపించిన భావాన్ని స్పష్టంగా తెలియజేస్తుంది; సందర్భం ప్రకారం ‘ఆయన’ అనేది యేసును సూచిస్తుంది.
- source_word: ἥψατο
  choice: తాకింది
  rationale: ఈ సందర్భంలో మధ్యమ ప్రయోగంలోని ἅπτω సాధారణ స్పర్శను సూచిస్తుంది; పట్టుకుంది లేదా అంటిపెట్టుకుంది అనే అధిక భావాన్ని చేర్చదు.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: ఆయన వస్త్రాన్ని
  rationale: ἱμάτιον ఒక వస్త్రాన్ని, తరచుగా పైవస్త్రాన్ని సూచిస్తుంది; ‘వస్త్రం’ ఏ ప్రత్యేక ఆధునిక దుస్తును అనవసరంగా నిర్దేశించకుండా గ్రీకు ఏకవచనాన్ని నిలుపుతుంది.
