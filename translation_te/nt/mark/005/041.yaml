id: MRK.5.41
reference: Mark 5:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ κρατήσας τῆς χειρὸς τοῦ παιδίου λέγει αὐτῇ· Ταλιθα ⸀κουμ, ὅ ἐστιν μεθερμηνευόμενον· Τὸ κοράσιον, σοὶ λέγω, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/041.yaml
  text: And taking the child's hand[a], he says to her, “Talitha koum,” which is translated, “Little girl, I say to you, get up.”
translation:
  language: te
  text: 'ఆ చిన్నారి చేయి పట్టుకొని ఆమెతో ఇలా అంటున్నాడు: “తలితా కూమ్[a],” అంటే, “చిన్న అమ్మాయీ, నీకు చెబుతున్నాను, లేచి నిలబడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని సంప్రదాయ లిప్యంతరీకరణల్లో ఈ అరామిక్ మాటను “తలితా కమ్” అని రాస్తారు. ఇక్కడి గ్రీకు పాఠంలో κουμ ఉన్నందున “కూమ్” అని లిప్యంతరీకరించబడింది.
    reason: అరామిక్ పదబంధానికి సంప్రదాయంగా వాడే ప్రత్యామ్నాయ లిప్యంతరీకరణను, ఈ అనువాదం SBLGNTలోని κουμను అనుసరిస్తున్నదనే మూలపాఠ ఆధారాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: κρατήσας τῆς χειρὸς τοῦ παιδίου
  choice: ఆ చిన్నారి చెయ్యి పట్టుకొని
  rationale: κρατέωతో వచ్చిన షష్ఠీ విభక్తి నిర్మాణం చెయ్యిని పట్టుకోవడాన్ని సూచిస్తుంది. ‘చెయ్యి పట్టుకొని’ సహజమైన ఆధునిక తెలుగు; παιδίονలోని చిన్న వయస్సు భావాన్ని ‘చిన్నారి’ తెలియజేస్తుంది, అయితే తరువాతి κοράσιονలో స్పష్టమయ్యే లింగాన్ని ముందుగానే అనవసరంగా పునరుక్తి చేయదు.
- source_word: λέγει αὐτῇ
  choice: ఆమెతో ... అని అంటున్నాడు
  rationale: మార్కు వాడిన చారిత్రక వర్తమాన కాలాన్ని నిలుపుతూ, తెలుగులో సహజమైన ప్రత్యక్ష వాక్య నిర్మాణాన్ని ఉపయోగిస్తుంది.
- source_word: Ταλιθα κουμ
  choice: తలితా కూమ్
  rationale: మూల గ్రీకు పాఠం భద్రపరచిన అరామిక్ మాటలను లిప్యంతరీకరించి, మార్కు వెంటనే ఇచ్చిన అనువాదాన్ని కూడా నిలుపుతుంది. ‘కూమ్’ అనేది κουμను నేరుగా ప్రతిబింబిస్తుంది.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: దాని అనువాదం
  rationale: అరామిక్ మాటలకు మార్కు ఇచ్చిన వివరణ అనువాదమేనని స్పష్టంగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: Τὸ κοράσιον
  choice: చిన్న అమ్మాయీ
  rationale: κοράσιον ఒక చిన్న వయస్సు గల బాలికను సూచిస్తుంది. సంబోధనను తెలుగులో స్పష్టంగా చూపడానికి ‘అమ్మాయీ’ రూపాన్ని వాడింది.
- source_word: σοὶ λέγω
  choice: నీతో చెబుతున్నాను
  rationale: గ్రీకులో స్పష్టంగా ఉన్న రెండవ పురుష ఏకవచన సర్వనామ ప్రాధాన్యాన్ని, అలాగే λέγωను అనవసరంగా తొలగించకుండా నిలుపుతుంది.
- source_word: ἔγειρε
  choice: లేచి నిలబడు
  rationale: ἐγείρω ఇక్కడ పడుకున్న స్థితి నుంచి లేవమనే ఆజ్ఞ. ‘లేచి నిలబడు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, కేవలం మేల్కొనడం అనే అర్థానికి పరిమితం కాకుండా శారీరకంగా లేవడాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: యేసు పలికిన అరామిక్ మాటలను ప్రధాన పాఠంలో ఉంచడం
  choice: ‘తలితా కూమ్’ అనే లిప్యంతరీకరణను ఉంచి, వెంటనే మార్కు ఇచ్చిన అనువాదాన్ని ఇవ్వడం
  alternative: అరామిక్ మాటలను వదిలి తెలుగు అనువాదాన్ని మాత్రమే ఇవ్వడం
  rationale: మూల పాఠమే యేసు పలికిన సెమిటిక్ మాటలను భద్రపరచి తరువాత వాటిని అనువదిస్తుంది. రెండింటినీ ఉంచడం వాక్యంలోని కథన స్వభావాన్ని, మూలంలోని ఉద్దేశపూర్వక పునరుక్తిని కాపాడుతుంది.
- issue: ἔγειρεలో మేల్కొనడం మరియు లేచి నిలబడడం మధ్య భావ పరిధి
  choice: లేచి నిలబడు
  alternative: మేలుకో; లే
  rationale: ఈ సందర్భంలో ఆ బాలిక శారీరకంగా లేచే తదుపరి చర్య ప్రధానంగా ఉంది. అయినా ἐγείρωకు ఉండే విస్తృతమైన ‘లేపడం/మేల్కొలపడం’ భావాన్ని సిద్ధాంతపరంగా విస్తరించి వ్యాఖ్యానించకుండా సందర్భానుగుణ ఆజ్ఞగా అనువదించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని అనుసరించింది. మార్కు చారిత్రక వర్తమానాన్ని ‘అంటున్నాడు’తో నిలిపింది. ప్రత్యక్ష సంబోధనకు ‘అమ్మాయీ’ని, స్పష్టమైన ఆజ్ఞకు ‘లేచి నిలబడు’ను వాడింది.
