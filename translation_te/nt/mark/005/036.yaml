id: MRK.5.36
reference: Mark 5:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀παρακούσας τὸν λόγον λαλούμενον λέγει τῷ ἀρχισυναγώγῳ· Μὴ φοβοῦ, μόνον πίστευε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/036.yaml
  text: But Jesus[a], overhearing the word being spoken, says to the synagogue leader, “Do not be afraid[b]; only believe.”
translation:
  language: te
  text: 'అయితే యేసు, చెబుతున్న మాటను విని[a], సమాజమందిర నాయకునితో ఇలా అన్నాడు: “భయపడకు; కేవలం నమ్ము[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చెప్పిన మాటను పట్టించుకోకుండా.” παρακούσας అనే గ్రీకు పదానికి, విన్న మాటను లెక్కచేయకపోవడం అనే భావం కూడా ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా “విశ్వాసముంచు” లేదా “భరోసా ఉంచు.” ఇక్కడున్న గ్రీకు క్రియ πιστεύω.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσας
  choice: విని
  rationale: ఈ సందర్భంలో యాయీరు వద్దకు వచ్చినవారు చెప్పిన మాటను యేసు విని వెంటనే అతనితో మాట్లాడడం కథన ప్రవాహానికి సహజంగా సరిపోతుంది. ఈ పదానికి ‘పట్టించుకోకుండా’ అనే అర్థం కూడా సాధ్యమైనందున దానిని పాదసూచికలో ఉంచాం.
- source_word: τὸν λόγον λαλούμενον
  choice: చెబుతున్న మాటను
  rationale: గ్రీకు పదబంధంలోని ‘మాట’ను నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా అర్థమయ్యే రూపాన్ని ఎంచుకున్నాం.
- source_word: λέγει
  choice: అన్నాడు
  rationale: ఇది మార్కు ఉపయోగించిన చారిత్రక వర్తమాన కాలం. తెలుగు కథనశైలిలో సహజమైన భూతకాల రూపం భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἀρχισυναγώγῳ
  choice: సమాజమందిరపు అధికారితో
  rationale: సమాజమందిరానికి నాయకత్వం వహించే లేదా దాని వ్యవహారాలను పర్యవేక్షించే అధికారిని సూచించే స్పష్టమైన ఆధునిక తెలుగు పదబంధం.
- source_word: Μὴ φοβοῦ
  choice: భయపడకు
  rationale: నిషేధార్థక ఆజ్ఞను సహజంగా, నేరుగా వ్యక్తపరుస్తుంది.
- source_word: μόνον
  choice: -తూనే
  rationale: ‘నమ్ముతూనే ఉండు’లోని ‘నే’ ఇతర ప్రతిస్పందనలకు బదులు నమ్మడానికే పరిమితం కావాలనే μόνον భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: πίστευε
  choice: నమ్ముతూనే ఉండు
  rationale: πιστεύω యొక్క ‘నమ్ము’ అనే ప్రాథమిక భావంతోపాటు వర్తమాన ఆజ్ఞలో ఉండగల కొనసాగింపు భావాన్ని కూడా తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: παρακούσας పదం యొక్క భావం
  choice: యేసు చెప్పబడుతున్న మాటను విన్నాడు
  alternative: యేసు చెప్పబడిన మాటను పట్టించుకోలేదు
  rationale: రెండు భావాలూ పదపరంగా సాధ్యమే. అయితే ఆ నివేదికకు యేసు వెంటనే స్పందించడం వల్ల ‘విని’ అనే భావం సందర్భానికి మరింత సహజం. నిజమైన వ్యాఖ్యాన భేదాన్ని పాదసూచికలో నిలిపాం.
- issue: πίστευε అనే ఆజ్ఞ యొక్క భావం
  choice: నమ్ముతూనే ఉండు
  alternative: విశ్వాసముంచు; భరోసా ఉంచు
  rationale: ‘నమ్ము’ క్రియకు నేరమైన సమానార్థకం. కొనసాగింపు భావాన్ని నిలుపుతూ, ‘విశ్వాసం’ లేదా ‘భరోసా’ అనే ఒక్క వ్యాఖ్యానంతో భావాన్ని పరిమితం చేయకుండా ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘సమాజమందిరం’ యూదుల ప్రార్థనా-సమావేశ స్థలాన్ని సూచించే స్థిరమైన తెలుగు పదం. ‘నమ్ముతూనే ఉండు’ ఆజ్ఞలోని కొనసాగింపు మరియు పరిమితి భావాలను సంక్షిప్తంగా అందిస్తుంది.
