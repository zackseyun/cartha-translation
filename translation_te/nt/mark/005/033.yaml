id: MRK.5.33
reference: Mark 5:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ δὲ γυνὴ φοβηθεῖσα καὶ τρέμουσα, εἰδυῖα ὃ γέγονεν ⸀αὐτῇ, ἦλθεν καὶ προσέπεσεν αὐτῷ καὶ εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/033.yaml
  text: But the woman[a], fearing and trembling, knowing what had happened to her[b], came and fell down before him and told him the whole truth.
translation:
  language: te
  text: కానీ ఆ స్త్రీ, తనకు ఏమి జరిగిందో తెలుసుకొని, భయపడుతూ వణుకుతూ, వచ్చి ఆయన ఎదుట పడిపోయి, ఆయనకు నిజమంతా చెప్పింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వాక్యంలోని యేసు ప్రశ్నకు స్త్రీ స్పందనను సూచించే స్వల్ప వ్యత్యాసంతో కూడిన కథన మలుపును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἡ γυνὴ
  choice: ఆ స్త్రీ
  rationale: కథనంలో ఇంతకుముందే పరిచయమైన నిర్దిష్ట స్త్రీని సూచిస్తుంది.
- source_word: φοβηθεῖσα καὶ τρέμουσα
  choice: భయపడుతూ వణుకుతూ
  rationale: రెండు గ్రీకు కృదంతాల క్రియాత్మకతను, ఆమె భావోద్వేగ స్థితి తీవ్రతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: εἰδυῖα ὃ γέγονεν αὐτῇ
  choice: తనకు ఏమి జరిగిందో తెలుసుకొని
  rationale: కృదంత నిర్మాణాన్ని అనవసరంగా స్పష్ట కారణార్థక వాక్యంగా మార్చకుండా, ఆమె అనుభవించిన స్వస్థత సంఘటనను సహజంగా తెలియజేస్తుంది.
- source_word: ἦλθεν
  choice: వచ్చి
  rationale: సరళమైన కథన కదలికను అదనపు భావం చేర్చకుండా వ్యక్తం చేస్తుంది.
- source_word: προσέπεσεν αὐτῷ
  choice: ఆయన ఎదుట సాగిలపడి
  rationale: ఆయన సమక్షంలో నేలపై వంగి పడిన భంగిమను తెలియజేస్తుంది; దానిని తప్పనిసరిగా ఆరాధనగా వ్యాఖ్యానించదు.
- source_word: εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν
  choice: ఆయనకు నిజమంతా చెప్పింది
  rationale: ఆమె ఏదీ దాచకుండా పూర్తి వృత్తాంతాన్ని చెప్పిందనే భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: προσέπεσεν αὐτῷలో యేసు ఎదుట స్త్రీ భంగిమ
  choice: ఆయన ఎదుట సాగిలపడి
  alternative: ఆయన పాదాల దగ్గర పడిపోయి; ఆయన ఎదుట సాష్టాంగపడి
  rationale: క్రియ గౌరవం, భయం లేదా వేడుకోలుతో ఒకరి ఎదుట పడటాన్ని సూచించగలదు. ఎటువంటి నిర్దిష్ట ఆరాధనా ఉద్దేశాన్ని వాక్యంలోకి చేర్చకుండా శారీరక చర్యను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు కృదంతాల క్రమాన్ని తెలుగులో సహజంగా అమర్చి, భావసంబంధాన్ని అతిగా నిర్ధారించలేదు.
