  to: కానీ ఆ స్త్రీ, తనకు ఏమి జరిగిందో తెలుసుకొని, భయపడుతూ వణుకుతూ, వచ్చి ఆయన ఎదుట పడిపోయి, ఆయనకు నిజమంతా చెప్పింది.
