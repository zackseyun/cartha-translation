  text: καὶ διεστείλατο αὐτοῖς πολλὰ ἵνα μηδεὶς γνοῖ τοῦτο, καὶ εἶπεν δοθῆναι αὐτῇ φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/043.yaml
  text: And he strictly ordered them that no one should know this[c][b][a], and he said that she should be given something to eat.
translation:
  language: te
  text: ఈ విషయం ఎవరికీ తెలియకూడదని ఆయన వారికి గట్టిగా ఆజ్ఞాపించాడు[a]. ఆ అమ్మాయికి తినడానికి ఏమైనా ఇవ్వాలని చెప్పాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన వారికి పదేపదే గట్టి ఆజ్ఞలు ఇచ్చాడు.” గ్రీకు నుడికారంలో ఆజ్ఞ తీవ్రతను పెంచే, అక్షరార్థంగా “ఎక్కువగా/అనేక విషయాలు” అనే పదం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఆమెకు తినడానికి ఇవ్వబడాలని చెప్పాడు”; భావార్థంగా, ఆమెకు తినడానికి ఏదైనా ఇవ్వాలని చెప్పాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεστείλατο ... πολλὰ
  choice: గట్టిగా ఆజ్ఞాపించాడు
  rationale: διαστέλλομαι బలమైన ఆదేశాన్ని సూచిస్తుంది; πολλὰ ఇక్కడ ఆ ఆదేశ తీవ్రతను పెంచుతుంది. ఈ రెండింటి భావాన్ని సహజమైన ఆధునిక తెలుగులో ఈ పదబంధం వ్యక్తం చేస్తుంది.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: అక్కడ ఉన్నవారిని సూచించే దత్తి విభక్తి పరోక్ష కర్మను తెలుగులో సహజంగా చూపిస్తుంది.
- source_word: ἵνα μηδεὶς γνοῖ τοῦτο
  choice: ఈ విషయం ఎవరికీ తెలియకూడదని
  rationale: ἵναతో కూడిన సంభావనార్థక క్రియ ఆ ఆజ్ఞ ఉద్దేశాన్ని తెలియజేస్తుంది. 'ఈ విషయం' τοῦτοను స్పష్టంగా ఉంచుతూ, సంఘటనను మరింత వివరించదు.
- source_word: εἶπεν
  choice: చెప్పాడు
  rationale: మూలంలోని సాధారణ 'చెప్పాడు' అనే అర్థాన్ని నిలుపుతుంది; సందర్భం వల్ల అది ఆదేశ స్వరూపంలో ఉన్నదని పాఠకుడు గ్రహించగలడు.
- source_word: δοθῆναι αὐτῇ φαγεῖν
  choice: ఆ అమ్మాయికి తినడానికి ఏమైనా ఇవ్వాలని
  rationale: గ్రీకు వాక్యనిర్మాణం అక్షరార్థంగా 'ఆమెకు తినడానికి ఇవ్వబడాలని' ఉంటుంది. తెలుగులో సహజత కోసం కర్తను పేర్కొనని ఆదేశ రూపంతో, అంతర్లీన ఆహారార్థాన్ని 'ఏమైనా' ద్వారా వ్యక్తం చేసింది.
theological_decisions:
- issue: యేసు ఆజ్ఞ యొక్క పరిధి మరియు మెస్సీయ రహస్య భావన
  choice: ఈ విషయం ఎవరికీ తెలియకూడదనే బలమైన ఆజ్ఞగా మాత్రమే అనువదించడం
  alternative: ఇది మార్కు సువార్తలోని విస్తృతమైన రహస్య భావనలో భాగమని వివరణను వాక్యంలో చేర్చడం
  rationale: మూల వచనం ఆ సంఘటన తెలియకూడదనే ఆజ్ఞను మాత్రమే చెబుతుంది. దాని వెనుక కారణాన్ని లేదా ఆజ్ఞ ఎవరికి వర్తిస్తుందో అదనంగా నిర్ధారించకుండా ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. 'ఆ అమ్మాయికి' అనేది సమీప సందర్భంలోని బాలికను స్పష్టంగా సూచిస్తుంది. మొదటి గ్రీకు καίను తెలుగు కథన ప్రవాహంలో ప్రత్యేకంగా 'మరియు' అని పెట్టకుండా రెండు వరుస వాక్యాలుగా సహజీకరించాం.
