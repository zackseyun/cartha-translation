source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ὅτι ⸂Ἐὰν ἅψωμαι κἂν τῶν ἱματίων αὐτοῦ⸃ σωθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/028.yaml
  text: For she was saying[a], "If I touch even his garments, I will be healed."
translation:
  language: te
  text: 'ఎందుకంటే ఆమె ఇలా చెబుతూ ఉండేది: “నేను ఆయన బట్టలనైనా తాకితే స్వస్థపడతాను[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకులో: “నేను రక్షింపబడతాను.” ఈ క్రియకు “రక్షింపబడటం,” “స్వస్థపడటం,” లేదా “బాగుపడటం” అనే అర్థాలు రావచ్చు; ఈ సందర్భం శారీరక స్వస్థతను సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: అని అనుకుంటూ ఉండేది
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న లేదా పునరావృతమైన మాటను సూచిస్తుంది. సందర్భంలో ఇది ఆమె తనలో తాను అనుకున్నదిగా సహజంగా అర్థమవుతుంది; అయినా బిగ్గరగా పలికిందని నిర్దిష్టంగా చెప్పదు.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి చర్యకు కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది.
- source_word: ὅτι
  choice: ప్రత్యక్ష ఉల్లేఖనంతో తెలిపింది
  rationale: ఆమె అనుకుంటున్న మాటల విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ప్రత్యక్ష ఉల్లేఖనం సహజం.
- source_word: ἐὰν ἅψωμαι
  choice: తాకితే
  rationale: ఉపపదంతో కూడిన షరతును సహజమైన తెలుగు షరతార్థక క్రియారూపంలో వ్యక్తం చేస్తుంది.
- source_word: κἂν
  choice: అయినా
  rationale: ‘కనీసం/కేవలం ... అయినా’ అనే పరిమితిని నొక్కిచెప్పే భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: τῶν ἱματίων αὐτοῦ
  choice: ఆయన బట్టలు
  rationale: ἱμάτια బహువచనం; ఆధునిక సాధారణ తెలుగులో ‘బట్టలు’ సహజంగా, స్పష్టంగా ఉంది. ‘వస్త్రాలు’ కంటే ఇది సాధారణ పాఠకులకు సులభం.
- source_word: σωθήσομαι
  choice: స్వస్థపడతాను
  rationale: ఈ సందర్భంలో రక్తస్రావం నుండి శారీరక స్వస్థత ప్రధాన భావం. అయితే మూలక్రియకు ‘రక్షింపబడతాను’ అనే విస్తృత భావం కూడా ఉన్నందున దానిని పాదసూచికలో నిలుపుతున్నాం.
theological_decisions:
- issue: స్వస్థత సందర్భంలో σωθήσομαι అనువాదం
  choice: స్వస్థపడతాను
  alternative: రక్షింపబడతాను; బాగుపడతాను
  rationale: తక్షణ సందర్భం శారీరక వ్యాధి నుండి స్వస్థతను సూచిస్తుంది. అయినా σῴζω క్రియలో స్వస్థత-రక్షణ భావాల మధ్య ఉన్న విస్తృత అర్థసంభావనను తొలగించకుండా పాదసూచికలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘బట్టలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండగా, మూలంలోని బహువచనాన్ని కాపాడుతుంది. ‘అనుకుంటూ ఉండేది’ అసంపూర్ణ కాలభావాన్ని, అంతరంగ వాక్యానికి సందర్భానుకూలమైన సహజత్వాన్ని ఇస్తుంది.
