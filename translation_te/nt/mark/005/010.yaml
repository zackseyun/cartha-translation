  yaml_path: translation/nt/mark/005/010.yaml
  text: And he begged him repeatedly not to send them out of the region[a].
translation:
  language: te
  text: ఆ దయ్యం, వాటిని ఆ ప్రాంతం బయటికి పంపవద్దని యేసును పదేపదే బతిమాలింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ దయ్యం, వాటిని ఆ భూభాగం వెలుపలికి పంపవద్దని యేసును చాలాసార్లు వేడుకుంది.”
    reason: παρακαλέω, πολλά, χώρα పదబంధాలకు సాధ్యమైన సహజ ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: παρεκάλει
  choice: బతిమాలింది
  rationale: ఈ భూతవైద్య సందర్భంలో ఈ క్రియ సాధారణంగా అడగడం కంటే తీవ్రమైన వేడుకోలును సూచిస్తుంది. ‘బతిమాలింది’ ఆధునిక తెలుగులో సహజంగా ఆ తీవ్రతను తెలియజేస్తుంది.
- source_word: πολλὰ
  choice: పదేపదే
  rationale: క్రియను విశేషించే ఈ రూపం వేడుకోలు పునరావృతమైందనే భావాన్ని ఇక్కడ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα μὴ
  choice: పంపవద్దని
  rationale: వేడుకోలు యొక్క విషయాన్ని, దానిలోని నిషేధ భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: αὐτὰ
  choice: వాటిని
  rationale: గ్రీకు పదం నపుంసక బహువచనం; ఇది అనేక దయ్యాలను సూచిస్తుంది. అందువల్ల బహువచనాన్ని నిలుపుకున్నాం.
- source_word: ἀποστείλῃ
  choice: పంప
  rationale: ‘పంపివేయడం’ అనే మూలభావాన్ని నేరుగా అందిస్తుంది; ‘తరిమివేయడం’ వంటి అదనపు బలప్రయోగ భావాన్ని చేర్చదు.
- source_word: ἔξω τῆς χώρας
  choice: ఆ ప్రాంతం బయటికి
  rationale: χώρα ఇక్కడ ఆధునిక దేశాన్ని కాక స్థానిక భూభాగాన్ని లేదా పరిసర ప్రాంతాన్ని సూచిస్తుంది.
theological_decisions:
- issue: ఏకవచనంలో వేడుకునే వక్తకు, బహువచనంలో పంపబడే దయ్యాలకు మధ్య ఉన్న సంఖ్యా మార్పు
  choice: ‘ఆ దయ్యం ... వాటిని’ అని ఏకవచన వక్తను, బహువచన దయ్యాలను రెండింటినీ స్పష్టంగా నిలుపుకోవడం
  alternative: సంఖ్యా మార్పును సవరించి అంతటా సమూహవాచకంగా అనువదించడం
  rationale: గ్రీకు వాక్యంలో ఒక దయ్యం అనేక దయ్యాల తరఫున మాట్లాడుతున్నట్టుగా ఏకవచనం నుంచి బహువచనానికి మార్పు ఉంది. ఆ ఉద్రిక్తతను సమన్వయపరచకుండా అనువాదంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ముందు వచనాల సందర్భం లేకుండా కూడా సర్వనామ సూచనలు అర్థమయ్యేలా ‘ఆ దయ్యం’ మరియు ‘యేసును’ అని స్పష్టీకరించాం; అయితే గ్రీకులోని ఏకవచన–బహువచన మార్పును అలాగే కాపాడాం.
