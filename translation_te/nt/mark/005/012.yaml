revisions:
- from: అవి ఆయనను వేడుకుంటూ, “మమ్మల్ని పందుల్లోకి పంపు, మేము వాటిలో ప్రవేశించేలా” అన్నాయి.
  to: 'ఆ అపవిత్రాత్మలు ఆయనను వేడుకొని ఇలా అన్నాయి: “మేము వాటిలోకి ప్రవేశించడానికి మమ్మల్ని పందులలోకి పంపు.”'
  rationale: The revision keeps the source’s sequence—pleading, saying, sending into the pigs, and purpose of entering them—while making the speakers explicit and the purpose construction idiomatic in modern standard Telugu. It does not add a doctrinal explanation or alter the ambiguity of the narrative context.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:01:20Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the urgent plea, Jesus as its object, the request to be sent into the pigs, and the purpose of entering them. However, “అవి” can sound impersonal despite the source presenting the unclean spirits as speaking agents, and “మేము వాటిలో ప్రవేశించేలా” is incomplete/unnatural as a purpose clause in this direct request.
  naturalness: A finite plea followed by “ఇలా అన్నాయి” is more idiomatic modern Telugu than “వేడుకుంటూ … అన్నాయి.” Recasting the request as “మేము వాటిలోకి ప్రవేశించడానికి మమ్మల్ని ... పంపు” naturally expresses ἵνα plus the subjunctive without adding meaning.
  terminology: '“అపవిత్రాత్మలు” retains the narrative referent without replacing it with a more interpretive label. “పందులలోకి” is standard modern Telugu for χοίρους, and “ప్రవేశించడానికి” preserves εἰσέλθωμεν. No Telugu footnote is needed: the English pigs/swine lexical alternative does not require a distinct or useful modern-Telugu alternative.'
  issues:
  - severity: medium
    issue: The subject pronoun “అవి” may depersonalize the speaking spirits.
    rationale: The Greek uses a plural personal subject in direct speech. Since the prior context identifies them as unclean spirits, explicitly naming them as “అపవిత్రాత్మలు” is clearer and more natural in Telugu.
  - severity: medium
    issue: “మేము వాటిలో ప్రవేశించేలా” is syntactically unfinished after “పంపు.”
    rationale: The purpose clause needs an idiomatic connection to the request. “మేము వాటిలోకి ప్రవేశించడానికి మమ్మల్ని ... పంపు” preserves the purpose relation and the distinct repetition of entering the pigs.
  revised_text: 'ఆ అపవిత్రాత్మలు ఆయనను వేడుకొని ఇలా అన్నాయి: “మేము వాటిలోకి ప్రవేశించడానికి మమ్మల్ని పందులలోకి పంపు.”'
  revised_footnotes: []
  revision_rationale: The revision keeps the source’s sequence—pleading, saying, sending into the pigs, and purpose of entering them—while making the speakers explicit and the purpose construction idiomatic in modern standard Telugu. It does not add a doctrinal explanation or alter the ambiguity of the narrative context.
