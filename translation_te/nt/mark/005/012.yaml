id: MRK.5.12
reference: Mark 5:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ παρεκάλεσαν ⸀αὐτὸν λέγοντες· Πέμψον ἡμᾶς εἰς τοὺς χοίρους, ἵνα εἰς αὐτοὺς εἰσέλθωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/012.yaml
  text: And they begged him[a], saying, “Send us into the pigs, so that we may enter them.”
translation:
  language: te
  text: 'ఆ అపవిత్రాత్మలు ఆయనను వేడుకొని ఇలా అన్నాయి: “మేము వాటిలోకి ప్రవేశించడానికి మమ్మల్ని పందులలోకి పంపు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκάλεσαν
  choice: వేడుకుంటూ … అన్నాయి
  rationale: ఈ సందర్భంలో παρακαλέω తీవ్రమైన విన్నపాన్ని సూచిస్తుంది. ‘వేడుకున్నాయి’ అనే భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో ‘వేడుకుంటూ … అన్నాయి’గా వ్యక్తం చేశాం.
- source_word: αὐτὸν
  choice: ఆయనను
  rationale: ఈ సర్వనామం యేసును సూచిస్తుంది; గౌరవప్రదమైన ఆధునిక తెలుగు ప్రయోగంగా ‘ఆయనను’ వాడాం.
- source_word: λέγοντες
  choice: … అన్నాయి
  rationale: ఈ కృదంతం విన్నపంలోని మాటలను పరిచయం చేస్తుంది. తెలుగులో సహజంగా ఉండేందుకు ప్రధాన క్రియతో కలిపి అనువదించాం.
- source_word: Πέμψον ἡμᾶς
  choice: మమ్మల్ని … పంపు
  rationale: πέμπω యొక్క స్పష్టమైన అర్థం ‘పంపు.’ సందర్భంలో అనుమతి భావం ఉన్నా, మూలపాఠంలోని ఆజ్ఞారూపాన్ని వ్యాఖ్యానాత్మకంగా మార్చలేదు.
- source_word: εἰς τοὺς χοίρους
  choice: పందుల్లోకి
  rationale: χοῖρος అంటే పంది. εἰς సూచించే లోపలికి వెళ్లే దిశను ‘లోకి’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα εἰς αὐτοὺς εἰσέλθωμεν
  choice: మేము వాటిలో ప్రవేశించేలా
  rationale: ἵνα ఉద్దేశాన్ని సూచిస్తుంది; εἰσέρχομαι యొక్క ‘ప్రవేశించు’ భావాన్ని నిలుపుతూ ఈ ప్రయోజన సంబంధాన్ని సహజమైన తెలుగులో తెలిపాం.
theological_decisions:
- issue: మాట్లాడుతున్నవారి విన్నపం మరియు యేసు అధికారం
  choice: వారు యేసును వేడుకొని, తమను పందుల్లోకి పంపమని కోరుతున్నట్లుగా అనువదించాం.
  alternative: వారు కేవలం మరొక చోటికి వెళ్లేందుకు సాధారణంగా అడిగినట్లు బలహీనంగా అనువదించడం.
  rationale: παρεκάλεσαν అనే బలమైన విన్నపపదం, Πέμψον అనే ఆజ్ఞారూప విన్నపం కలిసి వారు యేసు నిర్ణయానికి లోబడి ఉన్నారని కథనంలో సూచిస్తాయి; దీనికి మించిన సిద్ధాంత వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. మూలంలోని ‘పందుల్లోకి పంపు’ మరియు ‘వాటిలో ప్రవేశించేలా’ అనే ఉద్దేశపూర్వక పునరుక్తిని తొలగించకుండా నిలిపాం.
