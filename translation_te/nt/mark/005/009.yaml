source:
  edition: SBLGNT
  text: καὶ ἐπηρώτα αὐτόν· Τί ⸂ὄνομά σοι⸃; καὶ ⸂λέγει αὐτῷ⸃· ⸀Λεγιὼν ὄνομά μοι, ὅτι πολλοί ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/009.yaml
  text: And he was asking him, “What is your name?” And he says to him, “My name is Legion,[a] because we are many.”
translation:
  language: te
  text: ఆయన అతనిని, “నీ పేరేమిటి?” అని అడుగుతూ ఉన్నాడు. అతడు ఆయనతో, “నా పేరు లెగియోను[a], ఎందుకంటే మేము అనేకులం” అని అంటున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “లెగియోను” అనేది గ్రీకులో ఉపయోగంలోకి వచ్చిన లాటిన్ సైనిక పదం; అది రోమన్ సైన్యంలోని పెద్ద దళాన్ని సూచిస్తుంది. ఇక్కడ అది దయ్యం చెప్పుకున్న పేరుగా ఉండి, అనేకమంది ఉన్నారనే భావాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτα
  choice: అడుగుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న లేదా పునరావృత చర్యను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Τί ὄνομά σοι
  choice: నీ పేరేమిటి?
  rationale: గ్రీకు నామవాచకం-దత్తివాచక నిర్మాణానికి సహజమైన, నేరమైన ఆధునిక తెలుగు సమానం.
- source_word: λέγει αὐτῷ
  choice: అందుకు అది ఆయనతో … అని చెప్పింది
  rationale: మాట్లాడేది మనిషిలోని అపవిత్రాత్మ అని సందర్భం సూచిస్తుంది; తెలుగు లింగసమ్మతి కోసం ‘అది/చెప్పింది’ వాడబడింది. గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగులో సహజ కథన గతకాలంతో అందించింది.
- source_word: Λεγιών
  choice: లెగియోను
  rationale: ఇక్కడ ఇది అనువదించాల్సిన సాధారణ నామవాచకం కంటే, చెప్పబడిన పేరు లేదా బిరుదుగా పనిచేసే గ్రీకు రూపాంతరిత లాటిన్ సైనిక పదం.
- source_word: ὄνομά μοι
  choice: నా పేరు
  rationale: గ్రీకు దత్తివాచక నామవాచక వాక్యానికి సహజమైన తెలుగు స్వీయ-గుర్తింపు రూపం.
- source_word: ὅτι πολλοί ἐσμεν
  choice: ఎందుకంటే మేము అనేకులం
  rationale: ὅτι తెలిపే కారణాన్ని స్పష్టంగా ఉంచుతూ, ప్రాముఖ్యమైన ప్రథమ పురుష బహువచనాన్ని యథాతథంగా కాపాడుతుంది.
theological_decisions:
- issue: మాట్లాడేవాని ఏకవచనం నుంచి బహువచనానికి మార్పు
  choice: ‘నా పేరు’ అనే ఏకవచనాన్ని, ‘మేము అనేకులం’ అనే బహువచనాన్ని రెండింటినీ నిలుపుట
  alternative: ఉద్రిక్తతను తొలగిస్తూ ‘మా పేరు లెగియోను’ అని సమన్వయపరచడం
  rationale: గ్రీకు పాఠం ఏకవచన స్వీయ-గుర్తింపునుంచి బహువచన వివరణకు ఉద్దేశపూర్వకంగా మారుతుంది; ఈ భావపరమైన ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. సందర్భంలోని యేసును ‘ఆయన’గా, మనిషిలోని అపవిత్రాత్మను ‘అది’గా సూచించి తెలుగు వ్యాకరణ స్పష్టతను కాపాడింది; మూలంలోని ఏకవచన–బహువచన మార్పు మాత్రం నిలుపబడింది.
