    reason: παρακαλεῖνకు “కోరడం,” ὅριαకు “భూభాగం” అనే తటస్థమైన సాధ్య ప్రత్యామ్నాయాలను ఇస్తుంది; మూలంలో లేని విధాన-తీవ్రతను జోడించదు.
lexical_decisions:
- source_word: καὶ
  choice: అప్పుడు
  rationale: ముందటి సంఘటనతో కథన సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో చూపిస్తుంది; సందర్భంలో క్రమాన్ని సూచించినా గ్రీకు సంధికి మించిన బలమైన కాలార్థాన్ని విధించదు.
- source_word: ἤρξαντο
  choice: మొదలుపెట్టారు
  rationale: క్రియారంభాన్ని తెలిపే ἄρχομαι + infinitive నిర్మాణాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: παρακαλεῖν
  choice: వేడుకోవడం
  rationale: ఈ సందర్భంలోని తీవ్రమైన అభ్యర్థనను సహజమైన, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది; ‘బతిమాలడం’ కంటే తటస్థంగా ఉంటుంది.
- source_word: αὐτὸν
  choice: ఆయనను
  rationale: సూచించబడుతున్న యేసుకు తెలుగు కథన శైలిలో సహజమైన గౌరవ ఏకవచన సర్వనామం.
- source_word: ἀπελθεῖν
  choice: వెళ్లిపోవాలని
  rationale: వారి వేడుకోలు ఏ విషయమైందో తెలిపే infinitive భావాన్ని తెలుగులో సహజమైన ఉద్ధరణాత్మక నిర్మాణంతో అందిస్తుంది.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: తమ ప్రాంతం నుండి
  rationale: ὅρια యొక్క అక్షరార్థం ‘సరిహద్దులు’ అయినా, ఈ బహువచన ప్రయోగం వారి అధీనంలోని ప్రాంతాన్ని సూచిస్తుంది; ‘తమ’ కర్తతో అన్వయాన్ని స్పష్టం చేస్తుంది.
