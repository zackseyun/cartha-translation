source:
  edition: SBLGNT
  text: καὶ ⸂ἐξελθόντος αὐτοῦ⸃ ἐκ τοῦ πλοίου ⸂εὐθὺς ὑπήντησεν⸃ αὐτῷ ἐκ τῶν μνημείων ἄνθρωπος ἐν πνεύματι ἀκαθάρτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/002.yaml
  text: And when he got out of the boat[a], immediately a man with an unclean spirit came out from the tombs to meet him,
translation:
  language: te
  text: ఆయన పడవనుండి దిగగానే, అపవిత్రాత్మతో ఉన్న ఒక మనిషి సమాధులలోనుంచి వెంటనే ఆయనకు ఎదురయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθόντος αὐτοῦ ἐκ τοῦ πλοίου
  choice: ఆయన పడవలోనుంచి దిగగానే
  rationale: అయోరిస్ట్ కృదంతంతో ఉన్న జనిటివ్ అబ్సల్యూట్‌ను సహజమైన కాలవాచక ఉపవాక్యంగా ఇచ్చింది. పడవ సందర్భంలో ‘దిగగానే’ సహజంగా ఉండి, వెంటనే జరిగిన తదుపరి చర్యతో సంబంధాన్ని చూపుతుంది.
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు వర్ణనలోని వేగాన్ని, సజీవత్వాన్ని ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: ὑπήντησεν αὐτῷ
  choice: ఆయనను ఎదుర్కొనేందుకు వచ్చాడు
  rationale: ὑπαντάωలోని ‘కలుసుకోవడానికి/ఎదుర్కోవడానికి రావడం’ అనే భావాన్ని సందర్భానికి తగిన సహజ తెలుగులో తెలియజేస్తుంది; ‘ఎదుర్కొనేందుకు’ అనేది తప్పనిసరిగా శత్రుత్వాన్ని నిర్ణయించదు.
- source_word: ἐκ τῶν μνημείων
  choice: సమాధుల మధ్యనుంచి
  rationale: ఆ మనిషి సమాధుల ప్రదేశం నుంచి వచ్చాడనే కదలికను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; బహువచనాన్ని నిలుపుతుంది.
- source_word: ἄνθρωπος
  choice: ఒక మనిషి
  rationale: నిర్దిష్ట పురుష వ్యక్తిని సూచించే సందర్భానికి సరిపోయే సాధారణ ఆధునిక తెలుగు.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: అపవిత్రాత్మ పట్టిన
  rationale: తెలుగులో సహజంగా ఆ మనిషి స్థితిని తెలియజేస్తుంది; అయితే గ్రీకు పదబంధం అక్షరార్థంగా ‘అపవిత్రాత్మతో/అపవిత్రాత్మలో’ ఉన్నందున ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: దుష్టాత్మ సంబంధమైన బాధను వర్ణించే భాష
  choice: అపవిత్రాత్మ పట్టిన
  alternative: అపవిత్రాత్మతో ఉన్న
  rationale: ‘పట్టిన’ అనేది సాధారణ పాఠకునికి సహజంగా అర్థమవుతుంది; కానీ ‘ఆవహించిన’ వంటి మరింత వ్యవస్థీకృత భావనను చేర్చదు. మూలంలోని ἐν నిర్మాణానికి దగ్గరైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇవ్వడం ద్వారా అసలు వాక్యంలోని విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథన వేగాన్ని నిలుపుతూ సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే శైలి. వాక్యక్రమం తెలుగు ప్రవాహానికి అనుగుణంగా మార్చబడింది.
