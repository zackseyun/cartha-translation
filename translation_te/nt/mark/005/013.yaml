id: MRK.5.13
reference: Mark 5:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐπέτρεψεν ⸀αὐτοῖς. καὶ ἐξελθόντα τὰ πνεύματα τὰ ἀκάθαρτα εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, ⸀ὡς δισχίλιοι, καὶ ἐπνίγοντο ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/013.yaml
  text: And he permitted them[a]. Then the unclean spirits came out and entered the pigs, and the herd—about two thousand—rushed down the steep bank into the sea[b], and they drowned in the sea.
translation:
  language: te
  text: ఆయన వారికి అనుమతి ఇచ్చాడు. అప్పుడు అపవిత్ర ఆత్మలు బయటికి వచ్చి పందుల్లోకి ప్రవేశించాయి. ఆ మంద—దాదాపు రెండువేల పందులు—నిటారైన వాలు దిగి[a] సముద్రంలోకి[b] దూసుకుపోయి, సముద్రంలో మునిగిపోయాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిటారైన గట్టు దిగి’ లేదా ‘కొండచరియ దిగి’ అని కూడా అనువదించవచ్చు; గ్రీకు పదం నిటారైన వాలు లేదా చరియను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ‘సముద్రం.’ ఇక్కడ ఇది గలిలయ సముద్రాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέτρεψεν αὐτοῖς
  choice: ఆయన వాటికి అనుమతి ఇచ్చాడు
  rationale: ἐπιτρέπω అనుమతించడం అనే అర్థాన్ని ఇస్తుంది. సందర్భంలో ‘వాటికి’ అనేది అపవిత్ర ఆత్మలను సూచిస్తుంది; అవి ఏమి చేయడానికి అనుమతి పొందాయో మునుపటి వచనం తెలియజేస్తుంది కాబట్టి ఇక్కడ అదనంగా చేర్చలేదు.
- source_word: τὰ πνεύματα τὰ ἀκάθαρτα
  choice: అపవిత్ర ఆత్మలు
  rationale: ఈ పదబంధంలోని వ్యక్తిగత ఆత్మసంబంధ భాషను నిలుపుతూ, ἀκάθαρτος యొక్క అపవిత్రత భావాన్ని సహజమైన తెలుగు పదంతో వ్యక్తం చేస్తుంది.
- source_word: ἐξελθόντα
  choice: బయటికి వచ్చి
  rationale: ఆత్మలు ఆ మనిషిని విడిచి బయటికి వచ్చిన కథన క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: పందుల్లోకి ప్రవేశించాయి
  rationale: εἰσέρχομαι + εἰς యొక్క దిశాత్మక భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: ὥρμησεν ἡ ἀγέλη
  choice: ఆ మంద … దూసుకుపోయి
  rationale: ὁρμάω సూచించే ఆకస్మికమైన, వేగమైన కదలికను ‘దూసుకుపోయి’ స్పష్టంగా వ్యక్తం చేస్తుంది. ‘మంద’ సమూహవాచక పదం; తరువాతి బహువచన క్రియ పందులను సహజంగా సూచిస్తుంది.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: నిటారైన వాలు మీదుగా
  rationale: κρημνός నిటారైన వాలు, గట్టు లేదా కొండచరియను సూచించవచ్చు. ‘నిటారైన వాలు’ ప్రమాదకరమైన దిగువ మార్గాన్ని తెలియజేస్తూనే అది తప్పనిసరిగా నిలువుగా ఉన్న చరియ అని నిర్ణయించదు.
- source_word: εἰς τὴν θάλασσαν
  choice: సముద్రంలోకి
  rationale: θάλασσα యొక్క మూల అర్థమైన ‘సముద్రం’ను నిలిపింది; భౌగోళికంగా ఇది గలిలయ సముద్రాన్ని సూచిస్తుందని పాదసూచిక తెలియజేస్తుంది.
- source_word: ὡς δισχίλιοι
  choice: దాదాపు రెండువేల పందులు
  rationale: ὡς సంఖ్యతో కలిసి సుమారు అనే భావాన్ని ఇస్తుంది. గ్రీకు పురుష బహువచనం సంఖ్యను పందులతో అనుసంధానిస్తుంది; తెలుగు పాఠకుడికి సూచిత నామవాచకాన్ని స్పష్టంగా పేర్కొనడం సహజం.
- source_word: ἐπνίγοντο
  choice: మునిగిపోయాయి
  rationale: అసంపూర్ణ భూతకాల రూపం నీటిలో మునిగి చనిపోతున్న సంఘటనను చిత్రిస్తుంది. తెలుగు కథనంలో ‘మునిగిపోయాయి’ సహజంగా ఆ ప్రక్రియతో పాటు దాని ప్రాణాంతక ఫలితాన్ని కూడా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ఆయన వాటికి అనుమతి ఇచ్చాడు’లో ‘వాటికి’ అనే పదం ఎవరిని సూచిస్తుంది
  choice: అపవిత్ర ఆత్మలను సూచిస్తుంది
  alternative: పందులను సూచిస్తుంది
  rationale: తక్షణ సందర్భంలో అనుమతి కోరినవీ, తరువాత బయటికి వచ్చి పందుల్లో ప్రవేశించినవీ అపవిత్ర ఆత్మలే. వచనంలో లేని అదనపు సిద్ధాంత వివరణను చేర్చలేదు.
- issue: ‘అపవిత్ర ఆత్మలు’ అనే వ్యక్తిగత ఆత్మసంబంధ భాష
  choice: వ్యక్తిగత ఆత్మలను సూచించే భాషను అలాగే ఉంచడం
  alternative: వ్యక్తిత్వరహిత ‘దుష్ట శక్తులు’గా అనువదించడం
  rationale: πνεύματα కథనంలో చర్యలు చేసే ఆత్మసంబంధ సత్తలను సూచిస్తుంది. ‘ఆత్మలు’ అని అనువదించడం మూలపాఠ భావాన్ని నిలుపుతుంది; వచనానికి మించిన దయ్యశాస్త్ర వివరాలను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. గ్రీకు వాక్యంలోని వరుస చర్యలు స్పష్టంగా ఉండేలా చిన్న వాక్యాలు మరియు అనుసంధాన క్రియలు ఉపయోగించబడ్డాయి. పాదసూచిక [a] దానికి సంబంధించిన ‘నిటారైన వాలు’ వద్ద ఉంచబడింది; [b] మొదటి ‘సముద్రం’ వద్ద ఉంచబడింది.
