revisions:
- from: ఆయన వాటికి అనుమతి ఇచ్చాడు. అప్పుడు అపవిత్ర ఆత్మలు బయటికి వచ్చి పందుల్లోకి ప్రవేశించాయి. ఆ మంద—దాదాపు రెండువేల పందులు—నిటారైన వాలు మీదుగా[a] సముద్రంలోకి[b] దూసుకుపోయి, సముద్రంలో మునిగిపోయాయి.
