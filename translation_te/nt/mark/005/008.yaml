source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ αὐτῷ· Ἔξελθε τὸ πνεῦμα τὸ ἀκάθαρτον ἐκ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/008.yaml
  text: For he was saying to him[a], “Come out of the man, unclean spirit.”
translation:
  language: te
  text: 'ఎందుకంటే ఆయన అతనితో ఇలా చెబుతూ ఉన్నాడు: “ఆ మనిషిలోనుండి బయటికి రా, అపవిత్రాత్మా!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బయటికి వెళ్లు’ అని కూడా అనువదించవచ్చు. గ్రీకులో ‘ఆ అపవిత్రాత్మ’ అనే రూపం ఉన్నప్పటికీ, ఇక్కడ అది ప్రత్యక్ష సంబోధనగా పనిచేస్తుంది.
    reason: ‘రా/వెళ్లు’ అనే దృక్కోణ భేదాన్ని, గ్రీకు సంబోధన నిర్మాణాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: ἔλεγεν
  choice: చెబుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న లేదా పదేపదే జరుగుతున్న మాటను సూచిస్తుంది; తెలుగు కథనంలో ‘చెబుతూ ఉన్నాడు’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి వివరణాత్మక నేపథ్యాన్ని కలుపుతుంది.
- source_word: αὐτῷ
  choice: అతనితో
  rationale: గ్రీకు దత్తివాచక సర్వనామాన్ని సహజమైన తెలుగులో వ్యక్తితో మాటలాడటాన్ని సూచించేలా అనువదిస్తుంది; ఆజ్ఞ మాత్రం అతనిలోని అపవిత్రాత్మను ఉద్దేశిస్తుంది.
- source_word: Ἔξελθε
  choice: బయటికి రా
  rationale: ఇది నేరుగా ఇచ్చిన ఆజ్ఞ. మనిషిలోనుండి వెలుపలికి రావాలని చెప్పే సందర్భంలో ‘బయటికి రా’ సహజంగా ఉంది.
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: అపవిత్రాత్మా
  rationale: రూపరీత్యా ఉపపదంతో ఉన్న నామవాచక నిర్మాణమైనా, ఇక్కడ అది ప్రత్యక్ష సంబోధనగా పనిచేస్తుంది. సంబోధన రూపం ఆ భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐκ τοῦ ἀνθρώπου
  choice: ఈ మనిషిలోనుండి
  rationale: ἐκ లోపలినుండి వెలుపలికి కదలికను సూచిస్తుంది; సందర్భంలోని నిర్దిష్ట పురుషుణ్ణి ἄνθρωπος సూచిస్తున్నందున ‘ఈ మనిషి’ సహజంగా, స్పష్టంగా ఉంది.
theological_decisions:
- issue: భూతవైద్య సందర్భంలో πνεῦμα ἀκάθαρτον అనువాదం
  choice: అపవిత్రాత్మ
  alternative: దుష్టాత్మ
  rationale: గ్రీకు పాఠం అక్షరార్థంగా ‘అపవిత్రాత్మ’ అని చెబుతుంది. ‘దుష్టాత్మ’ భావవ్యాఖ్యాత్మకంగా ఉండి అపవిత్రతకు సంబంధించిన మూలపద భావాన్ని తగ్గిస్తుంది.
- issue: τὸ πνεῦμα τὸ ἀκάθαρτον యొక్క వ్యాకరణ కార్యం
  choice: ప్రత్యక్ష సంబోధనగా ‘అపవిత్రాత్మా’
  alternative: కర్త/కర్మ రూపంలో ‘ఆ అపవిత్రాత్మ’
  rationale: ఉపపదంతో కూడిన నామవాచక రూపం ఉన్నప్పటికీ, ఆజ్ఞ తరువాత ఇది ఎవరిని ఉద్దేశించిందో తెలిపే సంబోధనగా పనిచేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. కొనసాగుతున్న గత చర్యను ‘చెబుతూ ఉన్నాడు’తో, ప్రత్యక్ష సంబోధనను ‘అపవిత్రాత్మా’తో వ్యక్తం చేశాం.
