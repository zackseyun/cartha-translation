source:
  edition: SBLGNT
  text: ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν ἀπὸ μακρόθεν ἔδραμεν καὶ προσεκύνησεν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/006.yaml
  text: And seeing Jesus from a distance[a], he ran and bowed down before him,
translation:
  language: te
  text: అతడు దూరం నుండి యేసును చూసి, పరుగెత్తి ఆయన ఎదుట సాగిలపడ్డాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనను ఆరాధించాడు’ లేదా ‘ఆయనకు గౌరవప్రణామం చేశాడు.’ గ్రీకు క్రియ సందర్భాన్ని బట్టి ఆరాధనను లేదా గౌరవసూచకంగా వంగి నమస్కరించే చర్యను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: చూసి
  rationale: ὁράω క్రియ యొక్క ఏఒరిస్ట్ పార్టిసిపిల్‌ను సహజమైన తెలుగు పూర్వకాలిక క్రియారూపంగా ఇచ్చాం; ఇది చూసిన తరువాత పరుగెత్తిన కథన క్రమాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἀπὸ μακρόθεν
  choice: దూరం నుంచే
  rationale: స్థలపరమైన దూరాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. ‘నుంచే’ అతడు దూరంలో ఉండగానే యేసును చూశాడనే భావాన్ని స్పష్టం చేస్తుంది, అదనపు తీవ్రతను చేర్చదు.
- source_word: ἔδραμεν
  choice: పరుగెత్తుకొచ్చి
  rationale: τρέχω యొక్క సూటి అర్థమైన పరుగెత్తడాన్ని నిలుపుతూ, యేసు వైపు కదలికను తెలుగు కథనంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: προσεκύνησεν αὐτόν
  choice: ఆయన ఎదుట సాగిలపడ్డాడు
  rationale: προσκυνέω సూచించగల శారీరకంగా వంగి నమస్కరించే లేదా సాష్టాంగపడే చర్యను వ్యక్తం చేస్తూ, అది ఆరాధనా లేక గౌరవప్రణామమా అనే భావాన్ని ప్రధాన పాఠ్యంలో తేల్చకుండా ఉంచుతుంది.
- source_word: καὶ
  choice: -ి
  rationale: గ్రీకు కథన సమన్వయాన్ని తెలుగులో సహజమైన వరుస క్రియారూపాలు—‘చూసి’, ‘పరుగెత్తుకొచ్చి’—ద్వారా వ్యక్తం చేశాం; విడిగా ‘మరియు’ అనడం అసహజంగా ఉంటుంది.
- source_word: τὸν Ἰησοῦν
  choice: యేసును
  rationale: సరైన నామాన్ని తెలుగు కర్మవిభక్తితో నేరుగా అనువదించాం.
theological_decisions:
- issue: προσεκύνησεν అనే పదం యేసుకు చేసిన స్పష్టమైన ఆరాధనగా అనువదించాలా
  choice: ప్రధాన పాఠ్యంలో ‘ఆయన ఎదుట సాగిలపడ్డాడు’
  alternative: ‘ఆయనను ఆరాధించాడు’ లేదా ‘ఆయనకు ప్రణామం చేశాడు’
  rationale: προσκυνέω ఆరాధనను గానీ, గౌరవంతో వంగి నమస్కరించడం/సాగిలపడటాన్ని గానీ సూచించవచ్చు. ఈ సందర్భంలో మూలపాఠ్యం అనుమతించే భావవిస్తృతిని కాపాడేందుకు కనిపించే చర్యను ప్రధాన పాఠ్యంలో ఇచ్చి, ఇతర భావాలను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘సాగిలపడ్డాడు’ సాధారణ పాఠకులకు అర్థమయ్యేలా శారీరక చర్యను తెలియజేస్తూ, ‘ఆరాధించాడు’ అనే నిర్దిష్ట ధార్మిక నిర్ణయాన్ని రుద్దదు. గ్రీకు καὶల వరుసను తెలుగులో సహజమైన సంయుక్త క్రియాక్రమంగా మార్చాం.
