- from: 'ఆయన లోపలికి వెళ్లి వారితో ఇలా అంటాడు: “మీరు ఎందుకు ఇంత గోల చేస్తూ ఏడుస్తున్నారు? ఈ చిన్నారి చనిపోలేదు; నిద్రపోతోంది[a].”'
  to: 'ఆయన లోపలికి వెళ్లి వారితో ఇలా అంటాడు: “మీరు ఎందుకు గోల చేస్తూ ఏడుస్తున్నారు? ఆ బిడ్డ చనిపోలేదు; నిద్రపోతోంది[a].”'
  rationale: 'The revision makes two limited source-oriented adjustments: it replaces potentially gender-specific ‘చిన్నారి’ with the gender-inclusive ‘బిడ్డ’ for παιδίον, and removes the added intensifier ‘ఇంత.’ The historical present, the noisy mourning, and the intentionally unresolved ‘not died, but sleeping’ formulation are retained. The footnote anchor remains correctly placed after ‘నిద్రపోతోంది.’'
  reviewer_model: gpt-5.6-terra
