id: MRK.5.39
reference: Mark 5:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἰσελθὼν λέγει αὐτοῖς· Τί θορυβεῖσθε καὶ κλαίετε; τὸ παιδίον οὐκ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/039.yaml
  text: And after entering, he says to them, “Why are you making a commotion and weeping? The child has not died, but is sleeping.”
translation:
  language: te
  text: 'ఆయన లోపలికి వెళ్లి వారితో ఇలా అంటాడు: “మీరు ఎందుకు గోల చేస్తూ ఏడుస్తున్నారు? ఆ బిడ్డ చనిపోలేదు; నిద్రపోతోంది[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ బిడ్డ చనిపోలేదు; నిద్రపోతుంది.” త్వరలో ఆ బిడ్డను లేపబోతున్న సందర్భంలో యేసు మరణాన్ని ‘నిద్ర’కు రూపకంగా పేర్కొని ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: లోపలికి వెళ్లి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన ప్రవేశాన్ని సహజమైన తెలుగు క్రియావిశేషణ రూపంలో తెలియజేస్తుంది; గ్రీకు భూతకాల కృదంత సంబంధాన్ని అతిగా విప్పదు.
- source_word: λέγει
  choice: ఇలా అంటాడు
  rationale: మార్కు వాడిన చారిత్రక వర్తమాన కాలపు సజీవ కథన శైలిని నిలుపుతుంది.
- source_word: Τί
  choice: ఎందుకు
  rationale: ఈ ప్రశ్నలోని మందలింపు భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: θορυβεῖσθε
  choice: ఇంత గోల చేస్తూ
  rationale: శబ్దంతో కూడిన కలకలం లేదా రభసను సూచించే క్రియ భావాన్ని సందర్భానుకూలంగా అందిస్తుంది.
- source_word: κλαίετε
  choice: ఏడుస్తున్నారు
  rationale: దుఃఖంతో ఏడవడాన్ని సాధారణులకు స్పష్టమైన, గౌరవప్రదమైన భాషలో తెలియజేస్తుంది; కర్మకాండ సంబంధమైన విలాపాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: παιδίον
  choice: ఈ చిన్నారి
  rationale: లింగాన్ని ప్రధాన పదంలో నిర్దిష్టం చేయకుండా ‘బిడ్డ/చిన్నారి’ అనే సాధారణ భావాన్ని నిలుపుతుంది; తెలుగు సందర్భంలో సహజంగా వినిపిస్తుంది.
- source_word: οὐκ ἀπέθανεν
  choice: చనిపోలేదు
  rationale: గ్రీకు క్రియలోని మరణ సంఘటనను నేరుగా తెలుగులో అందిస్తుంది; ‘చనిపోయి లేదు’ కంటే ఇది సహజం.
- source_word: καθεύδει
  choice: నిద్రపోతోంది
  rationale: వర్తమాన క్రియాభావాన్ని, అలాగే నిద్ర అనే రూపకాలంకారానికి ఉన్న సాధ్యమైన అర్థాన్ని వ్యాఖ్యానించి తొలగించకుండా నిలుపుతుంది.
theological_decisions:
- issue: యేసు మాటలు మరణాన్ని అక్షరార్థంగా నిరాకరిస్తున్నాయా, లేక మరణాన్ని నిద్రగా రూపకంగా పేర్కొంటున్నాయా
  choice: “చనిపోలేదు; నిద్రపోతోంది” అనే ఉద్విగ్నతను ప్రధాన వాక్యంలో యథాతథంగా నిలుపడం
  alternative: “ఆమె శాశ్వతంగా చనిపోలేదు; నిద్రపోతున్నట్టే ఉంది” అని రాబోయే పునరుత్థానాన్ని వివరణగా చేర్చడం
  rationale: గ్రీకు వాక్యం అర్థాన్ని స్వయంగా పరిష్కరించకుండా మరణం–నిద్ర మధ్య ఉద్దేశపూర్వక ఉద్విగ్నతను ఉంచుతుంది. అందువల్ల ముందస్తు అద్భుతం, రూపకం, లేదా ప్రత్యక్ష నిరాకరణగా ఒకే విధంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మార్కు చారిత్రక వర్తమానాన్ని ‘అంటాడు’తో నిలిపి, మరణం–నిద్ర మధ్య ఉన్న అర్థ ఉద్విగ్నతను వ్యాఖ్యానంతో పరిష్కరించకుండా ఉంచింది.
