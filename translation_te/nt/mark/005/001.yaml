revisions:
- from: వారు సముద్రం అవతలి ఒడ్డుకు, గెరసేనీయుల ప్రాంతానికి వచ్చారు.[a]
  to: వారు సముద్రానికి అవతలి ఒడ్డుకు, గెరసేనీయుల ప్రాంతానికి వచ్చారు.[a]
  rationale: The revision preserves the base-text reading ‘గెరసేనీయుల’ and all directional elements while improving standard Telugu syntax. The footnote continues to preserve the significant place-name variants, without adding a claim not present in the audit trail.
