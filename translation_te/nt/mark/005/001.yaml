  text: Καὶ ἦλθον εἰς τὸ πέραν τῆς θαλάσσης εἰς τὴν χώραν τῶν ⸀Γερασηνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/001.yaml
  text: And they came to the other side of the sea[a], to the region of the Gerasenes.
translation:
  language: te
  text: వారు సముద్రానికి అవతలి ఒడ్డుకు, గెరసేనీయుల ప్రాంతానికి వచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘గదరేనీయుల’ అని, మరికొన్నింటిలో ‘గెర్గెసేనీయుల’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ
  choice: వారు… వచ్చారు
  rationale: తెలుగులో వాక్యారంభ ‘మరియు’ సహజంగా ఉండదు; మార్కు కథన కొనసాగింపును పదక్రమం, సందర్భం ద్వారా నిలిపి, అనవసర సంధానపదాన్ని చేర్చలేదు.
- source_word: ἦλθον
  choice: వారు వచ్చారు
  rationale: బహువచన భూతకాల క్రియను సరళంగా అనువదించి, ముందటి సందర్భంలోని యేసు మరియు ఆయనతో ఉన్నవారిని సూచించే బహువచనాన్ని నిలిపింది.
- source_word: εἰς τὸ πέραν τῆς θαλάσσης
  choice: సముద్రం అవతలి ఒడ్డుకు
  rationale: అవతలి వైపుకు చేరడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; θάλασσα అనే మూలపదానికి అనుగుణంగా ‘సముద్రం’ను నిలిపింది.
- source_word: εἰς τὴν χώραν
  choice: ప్రాంతానికి
  rationale: χώρα ఇక్కడ ఆధునిక దేశరాజ్యాన్ని కాక ఒక భూభాగం లేదా ప్రాంతాన్ని సూచిస్తుంది.
- source_word: Γερασηνῶν
  choice: గెరసేనీయుల
  rationale: SBLGNT పాఠంలోని జనసమూహవాచక నామాన్ని తెలుగులో సహజమైన రూపంతో లిప్యంతరీకరించింది.
theological_decisions:
- issue: దయ్యాలు పట్టిన వ్యక్తి కథనంలోని స్థలనామ పాఠభేదం
  choice: గెరసేనీయులు
  alternative: గదరేనీయులు; గెర్గెసేనీయులు
  rationale: ప్రధాన పాఠం SBLGNTలోని Γερασηνῶνను అనుసరిస్తుంది; ముఖ్యమైన ఇతర ప్రతుల పాఠాలను పాదటిప్పణిలో ఉంచి పాఠభేదాన్ని దాచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అదే సమయంలో గౌరవప్రదమైన బైబిలు కథన శైలిని పాటించింది. పాదటిప్పణి సూచికను సంబంధిత స్థలనామం ఉన్న వాక్యాంతంలో ఉంచింది.
