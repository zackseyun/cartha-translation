id: MRK.5.35
reference: Mark 5:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχονται ἀπὸ τοῦ ἀρχισυναγώγου λέγοντες ὅτι Ἡ θυγάτηρ σου ἀπέθανεν· τί ἔτι σκύλλεις τὸν διδάσκαλον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/035.yaml
  text: While he was still speaking[a], people came from the synagogue leader's house, saying, “Your daughter has died[b]. Why do you still trouble the Teacher?”
translation:
  language: te
  text: ఆయన ఇంకా మాట్లాడుతుండగానే, సమాజమందిరపు అధికారి ఇంటి నుంచి[a] కొందరు వచ్చి, “మీ కుమార్తె చనిపోయింది. ఇక బోధకుణ్ణి ఎందుకు ఇబ్బంది పెడుతున్నారు[b]?” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో అక్షరార్థంగా ‘సమాజమందిరపు అధికారి నుంచి’; సందర్భానుసారంగా అతని ఇంటి నుంచి అని అర్థం.
    reason: contextual_clarification
  - marker: b
    text: లేదా ‘శ్రమ పెడుతున్నారు’ లేదా ‘బాధ పెడుతున్నారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: ఆయన ఇంకా మాట్లాడుతుండగానే
  rationale: ఈ genitive absolute సమకాలీనంగా జరుగుతున్న చర్యను సూచిస్తుంది. ‘ఇంకా’ ἔτι భావాన్ని, ‘మాట్లాడుతుండగానే’ వెంటనే జరిగిన అంతరాయాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తాయి.
- source_word: ἔρχονται
  choice: కొందరు వచ్చి
  rationale: ఇది కథనంలోని historical present. తెలుగులో గతకాల కథన ప్రవాహానికి ‘వచ్చి’ సహజం. క్రియ బహువచనంలో ఉండటంతో స్పష్టత కోసం ‘కొందరు’ చేర్చబడింది.
- source_word: ἀπὸ τοῦ ἀρχισυναγώγου
  choice: సమాజమందిరపు అధికారి ఇంటి నుంచి
  rationale: ἀρχισυνάγωγος సమాజమందిరపు అధికారిని సూచిస్తుంది. సందర్భంలో ఆ అధికారి యేసుతో ఉన్నందున, అతని ఇంటివారి దగ్గర నుంచి దూతలు వచ్చారనే గ్రీకు ప్రయోగ భావాన్ని ‘ఇంటి నుంచి’ సహజంగా వ్యక్తం చేస్తుంది; ‘ఇంటి’ అన్నది మూలంలో ప్రత్యక్షంగా లేదని పాదసూచిక తెలియజేస్తుంది.
- source_word: Ἡ θυγάτηρ σου ἀπέθανεν
  choice: మీ కుమార్తె చనిపోయింది
  rationale: ἀπέθανεν పూర్తయిన మరణ సంఘటనను తెలియజేస్తుంది. ‘చనిపోయింది’ స్పష్టమైన, గౌరవభరితమైన సాధారణ తెలుగు.
- source_word: τί ἔτι σκύλλεις
  choice: ఇక ... ఎందుకు ఇబ్బంది పెడుతున్నారు
  rationale: τί ἔτι కొనసాగిస్తున్న చర్య ఇక అవసరం లేదనే ప్రశ్నార్థక భావాన్ని ఇస్తుంది. σκύλλω ఇక్కడ ఒకరిని శ్రమపెట్టడం లేదా ఇబ్బంది పెట్టడం అనే అర్థంలో ఉంది.
- source_word: τὸν διδάσκαλον
  choice: బోధకుణ్ణి
  rationale: διδάσκαλος యొక్క ప్రత్యక్ష అర్థం ‘బోధకుడు.’ పేరును చేర్చకుండా మూలంలోని బిరుదును నిలుపుతుంది.
theological_decisions:
- issue: ‘బోధకుడు’ ఎవరో వ్యక్తీకరించే విధానం
  choice: యేసు పేరును చేర్చకుండా ‘బోధకుడు’ అనే బిరుదునే నిలుపడం
  alternative: ‘యేసును’ లేదా ‘ప్రభువును’ అని విస్తరించడం
  rationale: గ్రీకు పాఠం వ్యక్తి పేరుకు బదులు బిరుదును ఉపయోగిస్తుంది. అదే రూపాన్ని ఉంచడం మాట్లాడినవారి దృక్కోణాన్ని కాపాడి, మూలంలో లేని క్రీస్తుసంబంధ అర్థాన్ని చేర్చకుండా ఉంటుంది.
- issue: దూతలు వచ్చిన స్థలాన్ని స్పష్టం చేయడం
  choice: ‘సమాజమందిరపు అధికారి ఇంటి నుంచి’ అని అనువదించి, ‘ఇంటి’ సందర్భానుసారమైన స్పష్టీకరణ అని పాదసూచికలో చెప్పడం
  alternative: ‘సమాజమందిరపు అధికారి నుంచి’ అని అక్షరార్థంగా ఉంచడం
  rationale: ఈ సందర్భంలో అధికారి యేసుతోనే ఉన్నాడు. కాబట్టి గ్రీకు సంక్షిప్త ప్రయోగం అతని ఇంటిని లేదా ఇంటివారిని సూచిస్తుంది; పాదసూచిక మూలరూపాన్ని పారదర్శకంగా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవభరితమైన కథన శైలి వాడబడింది. యాయీరు పట్ల గౌరవ సూచకంగా ‘మీ,’ ‘పెడుతున్నారు’ రూపాలు ఉపయోగించబడ్డాయి. ‘సమాజమందిరం’ యూదుల synagogue‌ను సూచించే స్థిరమైన తెలుగు పదప్రయోగంగా తీసుకోబడింది.
