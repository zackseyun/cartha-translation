  terminology: ‘సమాజమందిరపు అధికారి’ appropriately renders ἀρχισυνάγωγος, and ‘బోధకుడు’ preserves διδάσκαλος as a title without adding theological interpretation. ‘ఇబ్బంది పెడుతున్నారు’ fits σκύλλεις in this context.
