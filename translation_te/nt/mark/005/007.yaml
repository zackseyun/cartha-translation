id: MRK.5.7
reference: Mark 5:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ κράξας φωνῇ μεγάλῃ ⸀λέγει· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; ὁρκίζω σε τὸν θεόν, μή με βασανίσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/007.yaml
  text: And crying out with a loud voice[a], he says, “What have I to do with you, Jesus, Son of the Most High God? I adjure you by God[c][b], do not torment me.”
translation:
  language: te
  text: అతడు బిగ్గరగా కేక వేసి, “సర్వోన్నతుడైన దేవుని కుమారుడా యేసూ, నాతో నీకేమి పని?[a] దేవుని పేరట నిన్ను వేడుకుంటున్నాను[b]—నన్ను యాతన పెట్టకు!” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థానికి దగ్గరగా, “నాకూ నీకూ ఏమిటి?” ఇది దూరం, విరోధం లేదా జోక్యం వద్దనే భావాన్ని తెలిపే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దేవుని సాక్షిగా నిన్ను ప్రమాణానికి లోబరుస్తున్నాను.” గ్రీకు క్రియలో గంభీరంగా ప్రమాణం చేయించే లేదా ప్రమాణబద్ధంగా వేడుకునే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας φωνῇ μεγάλῃ
  choice: బిగ్గరగా కేక వేసి
  rationale: క్రియలోని తీవ్రమైన కేక భావాన్ని, φωνῇ μεγάλῃలోని పెద్ద స్వరాన్ని సహజమైన ఆధునిక తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో ఇది కథన వర్తమాన కాలమైనా, తెలుగు కథన శైలిలో భూతకాలం సహజంగా ఉండి సంఘటన యొక్క అర్థాన్ని మార్చదు.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: నాతో నీకేమి పని?
  rationale: ఇది సంబంధాన్ని నిరాకరించడం, దూరంగా ఉండమని కోరడం లేదా ఎదురుదాడి భావాన్ని తెలిపే నుడికారం. తెలుగు నుడికారం దాని సంక్షిప్తమైన, గట్టి ధ్వనిని నిలుపుతుంది.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: సర్వోన్నతుడైన దేవుని కుమారుడా
  rationale: దేవునికి సంబంధించిన ‘సర్వోన్నతుడు’ అనే బిరుదును, యేసుకు సంబంధించిన ‘కుమారుడు’ అనే సంబోధనను స్పష్టంగా నిలుపుతుంది.
- source_word: ὁρκίζω σε τὸν θεόν
  choice: దేవుని పేరట నిన్ను వేడుకుంటున్నాను
  rationale: దేవుని పేరును ఆధారంగా చేసుకున్న గంభీరమైన విన్నపం లేదా ప్రమాణబద్ధమైన విజ్ఞాపన భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ప్రమాణానికి లోబరచే బలమైన భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: μή με βασανίσῃς
  choice: నన్ను యాతన పెట్టకు
  rationale: βασανίζωలోని తీవ్రమైన బాధ లేదా హింస భావాన్ని, బాధ కలిగించే విధానాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దయ్యం యేసు గుర్తింపును ప్రకటించడం
  choice: సర్వోన్నతుడైన దేవుని కుమారుడా యేసూ
  alternative: అత్యున్నతుడైన దేవుని కుమారుడా యేసూ
  rationale: మూలంలోని కుమారత్వ బిరుదును, దేవుని సర్వోన్నతత్వాన్ని ఏదీ తగ్గించకుండా లేదా తరువాతి సిద్ధాంత భాషను చేర్చకుండా నిలుపుతుంది.
- issue: దయ్యం దేవుని పేరట యేసును వేడుకోవడంలోని ఉద్రిక్తత
  choice: దేవుని పేరట నిన్ను వేడుకుంటున్నాను
  alternative: దేవుని సాక్షిగా నిన్ను ప్రమాణానికి లోబరుస్తున్నాను
  rationale: దయ్యం దేవుని పేరును ఉటంకిస్తూ యేసుకు గంభీర విజ్ఞాపన చేయడంలోని ఆశ్చర్యకరమైన ఉద్రిక్తతను తొలగించదు; అదే సమయంలో ప్రధాన వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సులభంగా అర్థమయ్యే కథన శైలి వాడబడింది. ‘సర్వోన్నతుడైన’, ‘దేవుని పేరట’ వంటి పదబంధాలు వాక్యంలోని గంభీరతను నిలుపుతాయి; అరుదైన ‘శపథపూర్వకంగా ఆజ్ఞాపించు’ వంటి కృత్రిమ పదజాలం ప్రధాన పాఠ్యంలో నివారించబడింది.
