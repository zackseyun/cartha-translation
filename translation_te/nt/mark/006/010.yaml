source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ὅπου ⸀ἐὰν εἰσέλθητε εἰς οἰκίαν, ἐκεῖ μένετε ἕως ἂν ἐξέλθητε ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/010.yaml
  text: And he was saying to them[a], “Wherever you enter a house, stay there until you leave that place.”
translation:
  language: te
  text: 'ఆయన వారికి ఇలా చెబుతూ ఉండేవాడు: “మీరు ఎక్కడైనా ఒక ఇంట్లోకి ప్రవేశిస్తే, ఆ చోటు విడిచి వెళ్లేవరకు అదే ఇంట్లో ఉండండి.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “మీరు అక్కడి నుంచి వెళ్లేవరకు అక్కడే ఉండండి.” గ్రీకు వాక్యం మరింత అక్షరార్థంగా “అక్కడి నుంచి బయటికి వెళ్లేవరకు” అని ఉంది; సందర్భంలో ఇది వారు ఆ ప్రాంతాన్ని విడిచి వెళ్లడాన్ని సూచించే అవకాశం ఎక్కువ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: చెబుతూ ఉండేవాడు
  rationale: అసంపూర్ణ భూతకాల రూపం గతంలో కొనసాగిన లేదా పునరావృతమైన ఉపదేశాన్ని సూచించగలదు; తెలుగు కథనంలో ‘చెబుతూ ఉండేవాడు’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: Ὅπου ἐὰν
  choice: ఎక్కడైనా
  rationale: ఈ కలయిక అనిర్దిష్ట స్థల సంబంధ భావాన్ని ఇస్తుంది; ‘ఎక్కడైనా’ ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: εἰσέλθητε εἰς οἰκίαν
  choice: ఒక ఇంట్లోకి ప్రవేశిస్తే
  rationale: εἰς సూచించే లోపలికి ప్రవేశించే దిశను ‘ఇంట్లోకి’ స్పష్టంగా చూపుతుంది; ‘ప్రవేశిస్తే’ ఉపదేశ శైలికి తగిన గౌరవప్రదమైన సాధారణ పదం.
- source_word: οἰκίαν
  choice: ఒక ఇల్లు
  rationale: ఇక్కడ ప్రధానంగా బస చేసే భౌతిక గృహమే ఉద్దేశం; అందువల్ల ‘ఇల్లు’ సరైనది.
- source_word: ἐκεῖ μένετε
  choice: అదే ఇంట్లో ఉండండి
  rationale: ‘అక్కడే ఉండండి’ అనేది మరింత అక్షరార్థమైనా, సందర్భంలో ఒక ఇంటి నుంచి మరొక ఇంటికి మారకూడదనే సూచనను సహజ తెలుగులో ‘అదే ఇంట్లో ఉండండి’ స్పష్టం చేస్తుంది.
- source_word: ἕως ἂν ἐξέλθητε ἐκεῖθεν
  choice: ఆ చోటు విడిచి వెళ్లేవరకు
  rationale: ἐκεῖθεν అక్షరార్థంగా ‘అక్కడి నుంచి’ అని ఉండగలదు; మిషన్ సందర్భంలో ఆ ప్రాంతం లేదా చోటు నుంచి బయలుదేరడాన్ని ఈ రూపం సహజంగా వ్యక్తం చేస్తుంది, అయితే ప్రత్యామ్నాయ అక్షరార్థాన్ని పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: ἐκεῖθεν సూచించే పరిధి
  choice: శిష్యులు ఆ చోటు లేదా ప్రాంతాన్ని విడిచి వెళ్లేవరకు అదే ఇంట్లో ఉండాలి.
  alternative: వారు ఆ ఇంటి నుంచి బయటికి వెళ్లేవరకు అక్కడ ఉండాలి; లేదా మరింత అక్షరార్థంగా ‘అక్కడి నుంచి వెళ్లేవరకు.’
  rationale: సందర్భం శిష్యుల మిషన్ ప్రయాణంలో బస విధానాన్ని గురించి ఉంది; అందువల్ల మెరుగైన వసతి కోసం ఇళ్లు మారకుండా, ఆ ప్రాంతాన్ని విడిచేంతవరకు ఒకే ఇంట్లో ఉండమనే భావం సహజంగా కనిపిస్తుంది. అయినా గ్రీకు పదబంధంలోని స్థలపరమైన స్వల్ప అస్పష్టతను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఉపదేశ శైలి వాడబడింది. అసంపూర్ణ భూతకాల భావాన్ని ‘చెబుతూ ఉండేవాడు’తో నిలిపి, ప్రధాన వాక్యంలో సందర్భోచిత అర్థాన్ని ఇచ్చి, గ్రీకు పదబంధంలోని ప్రత్యామ్నాయాన్ని పాదసూచికలో సంరక్షించాం.
