    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: మునుపటి ప్రయాణ సూచనలకు భిన్నమైన అనుమతిని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ὑποδεδεμένους
  choice: తొడుక్కోండి
  rationale: చెప్పులు కాళ్లకు వేసుకొని ఉండాలనే సంపూర్ణ కృదంత భావాన్ని సందర్భానుసారమైన బహువచన ఆజ్ఞగా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: σανδάλια
  choice: చెప్పులు
  rationale: ఆ కాలపు పాదరక్షలను సాధారణ పాఠకులకు స్పష్టమైన, సహజమైన తెలుగు పదంతో సూచిస్తుంది; మరింత సాంకేతికమైన పదం అవసరం లేదు.
- source_word: μὴ ἐνδύσησθε
  choice: వేసుకోవద్దు
  rationale: μήతో వచ్చిన నిషేధాన్ని, దుస్తులు వేసుకునే క్రియాభావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: δύο
  choice: రెండు
  rationale: సంఖ్యను నేరుగా అనువదిస్తుంది.
- source_word: χιτῶνας
  choice: అంగీలు
  rationale: శరీరంపై ధరించే ప్రాథమిక వస్త్రమైన χιτώνను, ‘చొక్కాలు’ అనే ఆధునికీకరణకు పోకుండా, అర్థమయ్యే తెలుగు పదంతో సూచిస్తుంది.
