id: MRK.6.50
reference: Mark 6:50
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάντες γὰρ αὐτὸν εἶδον καὶ ἐταράχθησαν. ⸂ὁ δὲ εὐθὺς⸃ ἐλάλησεν μετ’ αὐτῶν, καὶ λέγει αὐτοῖς· Θαρσεῖτε, ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/050.yaml
  text: For they all saw him and were troubled. But he immediately spoke with them and says to them, “Take courage; I am; do not be afraid.”
translation:
  language: te
  text: ఎందుకంటే వారందరూ ఆయనను చూసి కలవరపడ్డారు. అయితే ఆయన వెంటనే వారితో ఇలా అన్నాడు, “ధైర్యంగా ఉండండి; నేనే[a]; భయపడకండి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, అక్షరార్థంగా, “నేను ఉన్నాను.” గ్రీకులో ἐγώ εἰμι.
    reason: తెలుగులో సందర్భానుసారమైన ‘నేనే’ అనే గుర్తింపును ప్రధాన పాఠంలో ఉంచి, గ్రీకు పదబంధం యొక్క అక్షరార్థ రూపాన్ని పాఠకునికి తెలియజేస్తుంది; అదనపు ధార్మిక అర్థాన్ని నిర్దేశించదు.
lexical_decisions:
- source_word: ἐταράχθησαν
  choice: కలవరపడ్డారు
  rationale: భయం, మనస్సులో తీవ్ర అలజడి అనే భావాలను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: Θαρσεῖτε
  choice: ధైర్యంగా ఉండండి
  rationale: ఆజ్ఞారూపంలోని ప్రోత్సాహాన్ని సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: ἐγώ εἰμι
  choice: నేను ఉన్నాను
  rationale: గ్రీకు పదబంధం యొక్క అక్షరార్థ రూపాన్ని నిలుపుతూ, కేవలం గుర్తింపును సూచించే ‘నేనే’ అని మాత్రమే పరిమితం చేయకుండా దాని సాధ్యమైన విస్తృత ప్రతిధ్వనిని కాపాడుతుంది.
- source_word: μὴ φοβεῖσθε
  choice: భయపడకండి
  rationale: గ్రీకు నిషేధాజ్ఞకు సహజమైన, నేరమైన తెలుగు సమానం.
theological_decisions:
- issue: ἐγώ εἰμι అనే మాటలో గుర్తింపు మరియు దైవిక ప్రతిధ్వని మధ్య ఉన్న సాధ్యమైన ఉద్వేగం
  choice: నేను ఉన్నాను[a]
  alternative: నేనే / నేనే ఆయనను
  rationale: సందర్భంలో ఇది ‘నేనే’ అనే సాధారణ గుర్తింపుగా అర్థమవవచ్చు; అయినా మూలంలోని ‘నేను ఉన్నాను’ రూపం మరింత విస్తృతమైన ధార్మిక ప్రతిధ్వనికి అవకాశం ఇస్తుంది. అనువాదం ఆ సందిగ్ధతను మూసివేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. మూలంలోని చారిత్రక వర్తమాన కాలమైన λέγει తెలుగులో సహజ కథనానికి అనుగుణంగా ‘అన్నాడు’గా ఇవ్వబడింది; εὐθύς భావం ‘వెంటనే’గా నిలుపబడింది.
