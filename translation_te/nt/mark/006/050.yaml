    text: లేదా, అక్షరార్థంగా, “నేను ఉన్నాను.” గ్రీకులో ἐγώ εἰμι.
    reason: తెలుగులో సందర్భానుసారమైన ‘నేనే’ అనే గుర్తింపును ప్రధాన పాఠంలో ఉంచి, గ్రీకు పదబంధం యొక్క అక్షరార్థ రూపాన్ని పాఠకునికి తెలియజేస్తుంది; అదనపు ధార్మిక అర్థాన్ని నిర్దేశించదు.
  revision_rationale: The revision smooths the narration while retaining ‘వెంటనే’ and the content of Jesus’ reassurance. It renders the Greek phrase ἐγώ εἰμι idiomatically as immediate self-identification, while the footnote preserves its literal wording and does not foreclose interpretive discussion.
