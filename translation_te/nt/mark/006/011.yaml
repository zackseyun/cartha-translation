id: MRK.6.11
reference: Mark 6:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸂ὃς ἂν τόπος μὴ δέξηται⸃ ὑμᾶς μηδὲ ἀκούσωσιν ὑμῶν, ἐκπορευόμενοι ἐκεῖθεν ἐκτινάξατε τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν εἰς μαρτύριον ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/011.yaml
  text: And whatever place does not receive you or listen to you, as you leave there, shake off the dust that is under your feet as a testimony against them.
translation:
  language: te
  text: ఏ ప్రదేశంలోని వారు మిమ్మల్ని స్వీకరించక, మీ మాట వినకపోతే, అక్కడి నుంచి బయలుదేరేటప్పుడు వారికి సాక్ష్యంగా మీ పాదాల కిందనున్న దుమ్మును దులిపివేయండి[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారికి వ్యతిరేకంగా సాక్ష్యంగా.” గ్రీకు వాక్యభాగాన్ని “వారికి సాక్ష్యంగా” అని అనువదించవచ్చు; అయితే సందేశాన్ని తిరస్కరించిన సందర్భంలో ఇది వారికి వ్యతిరేకమైన సాక్ష్యాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: పాదాల దుమ్మును దులిపివేయడం, తమను తిరస్కరించిన వారినుంచి వేరుపడుతున్నామని సూచిస్తూ వారిని హెచ్చరించే సంకేత చర్య.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν τόπος
  choice: ఏ ప్రాంతంలోనైనా
  rationale: ఈ అనిర్దిష్ట, సాధారణీకరణ నిర్మాణం ఏ ప్రాంతమైనా అనే విస్తృత భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండేందుకు స్థలాన్ని సూచించే రూపం వాడబడింది.
- source_word: μὴ δέξηται ὑμᾶς
  choice: వారు మిమ్మల్ని స్వీకరించకపోయినా
  rationale: δέχομαι ఇక్కడ దూతలను అంగీకరించి ఆతిథ్యంతో చేర్చుకోవడాన్ని సూచిస్తుంది. ప్రాంతం స్వీకరిస్తుంది అనే అసహజ వ్యక్తీకరణను నివారించేందుకు అక్కడి ప్రజలను సూచించే ‘వారు’ స్పష్టం చేయబడింది.
- source_word: μηδὲ ἀκούσωσιν ὑμῶν
  choice: మీ మాట వినకపోయినా
  rationale: ἀκούω కేవలం శబ్దం వినడం కాక శ్రద్ధగా ఆలకించడం అనే భావాన్నీ కలిగి ఉంది. ‘మీ మాట వినడం’ ఆ భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘లోబడడం’ అంత వ్యాఖ్యాత్మకంగా మారదు.
- source_word: ἐκπορευόμενοι ἐκεῖθεν
  choice: అక్కడి నుంచి బయలుదేరేటప్పుడు
  rationale: కాలసూచకమైన participleను సహజ తెలుగు క్రియావిశేషణ రూపంలో అనువదించి, బయలుదేరే సమయంలో చేయవలసిన చర్యగా చూపుతుంది.
- source_word: ἐκτινάξατε
  choice: దులిపివేయండి
  rationale: దుమ్మును పాదాల నుంచి ఊడిపోయేలా చేయడం అనే చర్యకు ‘దులిపివేయండి’ సహజమైన, స్పష్టమైన తెలుగు పదం.
- source_word: τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν
  choice: మీ పాదాల కింద ఉన్న దుమ్మును
  rationale: మూలంలోని ‘మీ పాదాల కింద ఉన్న దుమ్ము’ అనే స్థల సంబంధాన్ని సన్నిహితంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: అది వారికి సాక్ష్యంగా ఉంటుంది
  rationale: αὐτοῖς యొక్క సాధారణ దత్తివాచక భావాన్ని ‘వారికి’గా నిలిపి, సాక్ష్యం వారికి అనుకూలమా ప్రతికూలమా అన్నదాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా నిర్ణయించదు; సందర్భంలోని ప్రతికూల భావం పాదసూచికలో తెలియజేయబడింది.
theological_decisions:
- issue: దుమ్ము దులిపివేయడం అనే చర్యలోని సాక్ష్య స్వభావం
  choice: వారికి సాక్ష్యంగా
  alternative: వారికి వ్యతిరేకంగా సాక్ష్యంగా
  rationale: εἰς μαρτύριον αὐτοῖς అనే గ్రీకు వాక్యభాగం అక్షరార్థంగా ‘వారికి సాక్ష్యంగా’ అని ఉంటుంది. తిరస్కరణ సందర్భం దానికి హెచ్చరిక లేదా ప్రతికూల సాక్ష్యం అనే బలాన్ని ఇవ్వవచ్చు; అయినా ప్రధాన పాఠ్యంలో ఆ సంబంధాన్ని పూర్తిగా నిర్ణయించకుండా, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం మూలంలోని ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. ‘వారు’ అనేది ఆ ప్రాంతంలోని ప్రజలను సూచించే సందర్భసిద్ధమైన స్పష్టీకరణ. గ్రీకు వాక్యంలోని చివరి ఉద్దేశ్య భాగాన్ని తెలుగులో సహజత కోసం ప్రత్యేక వాక్యంగా ఇచ్చినా, దుమ్ము దులిపివేయడం సాక్ష్యంగా పనిచేస్తుందనే సంబంధం స్పష్టంగా నిలుపబడింది.
