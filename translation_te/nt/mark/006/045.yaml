translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. “బలవంతం చేశాడు” మూలంలోని బలాన్ని నిలుపుతుంది; “బేత్సయిదా వైపు” గమ్యం గురించిన నిజమైన భాషాత్మక అనిశ్చితిని పరిష్కరించకుండా ఉంచుతుంది.
