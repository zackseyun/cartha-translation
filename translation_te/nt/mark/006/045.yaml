id: MRK.6.45
reference: Mark 6:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἠνάγκασεν τοὺς μαθητὰς αὐτοῦ ἐμβῆναι εἰς τὸ πλοῖον καὶ προάγειν ⸂εἰς τὸ πέραν⸃ πρὸς Βηθσαϊδάν, ἕως αὐτὸς ⸀ἀπολύει τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/045.yaml
  text: And immediately he compelled his disciples to get into the boat and go ahead to the other side[a], toward Bethsaida[b], until he himself dismissed the crowd.
translation:
  language: te
  text: వెంటనే ఆయన తన శిష్యులను పడవ ఎక్కించి, తాను స్వయంగా జనసమూహాన్ని పంపివేసేంతవరకు[b] అవతలి ఒడ్డుకు బేత్సయిదా వైపు[a] తనకంటే ముందుగా వెళ్లమని బలవంతం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బేత్సయిదాకు.” గ్రీకు విభక్త్యర్థక పదం సాధారణంగా దిశను (“వైపు”) లేదా మరింత నిర్దిష్టంగా గమ్యాన్ని (“కు”) సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా “ఆయన జనసమూహాన్ని పంపివేస్తున్నంతవరకు” అని వర్తమానకాల క్రియారూపం ఉంది. కాలవాచక ఉపవాక్యంలో తెలుగు “పంపివేసేంతవరకు” అని సహజంగా వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు వర్ణనలోని వేగాన్ని, అత్యవసర భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἠνάγκασεν
  choice: బలవంతం చేశాడు
  rationale: బలమైన ఒత్తిడి లేదా తప్పనిసరి పరిస్థితి కలిగించడాన్ని సూచిస్తుంది; కేవలం కోరడం కంటే మూలపదంలోని బలాన్ని మెరుగుగా నిలుపుతుంది, అయితే శారీరక బలప్రయోగమని నిర్దిష్టంగా చెప్పదు.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: తన శిష్యులను
  rationale: బోధకుడు–శిష్యుడు సంబంధాన్ని సహజంగా, ఖచ్చితంగా వ్యక్తం చేస్తుంది.
- source_word: ἐμβῆναι εἰς τὸ πλοῖον
  choice: పడవ ఎక్కించి
  rationale: పడవలోకి ప్రవేశించే క్రియను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ప్రధాన క్రియతో ఉన్న కారణార్థక సంబంధాన్ని కూడా స్పష్టం చేస్తుంది.
- source_word: προάγειν
  choice: తనకంటే ముందుగా వెళ్లమని
  rationale: శిష్యులు యేసుకంటే ముందుగా ప్రయాణించాలనే సంబంధార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: εἰς τὸ πέραν
  choice: అవతలి ఒడ్డుకు
  rationale: సరస్సు ఎదురువైపుకు వెళ్లడాన్ని సందర్భానుకూలంగా, సహజంగా తెలియజేస్తుంది.
- source_word: πρὸς Βηθσαϊδάν
  choice: బేత్సయిదా వైపు
  rationale: πρός అనే విభక్త్యర్థక పదంలోని దిశాభావాన్ని నిలుపుతుంది; చేరుకోవడమే ఖచ్చిత గమ్యమని అవసరానికి మించి నిర్ణయించదు.
- source_word: ἕως
  choice: పంపివేసేంతవరకు
  rationale: శిష్యులు ముందుగా వెళ్లడం మరియు యేసు జనసమూహాన్ని పంపివేయడం మధ్యనున్న కాలపరిమితి సంబంధాన్ని నిలుపుతుంది.
- source_word: αὐτὸς
  choice: తాను స్వయంగా
  rationale: యేసే వ్యక్తిగతంగా అక్కడ ఉండి జనసమూహాన్ని పంపివేశాడనే గ్రీకు సర్వనామంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἀπολύει
  choice: పంపివేసే
  rationale: జనసమూహాన్ని అక్కడి నుంచి వెళ్లనివ్వడం అనే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది; కాలవాచక ఉపవాక్యంలో గ్రీకు వర్తమాన రూపానికి సరిపడే తెలుగు రూపాన్ని ఉపయోగిస్తుంది.
- source_word: τὸν ὄχλον
  choice: జనసమూహాన్ని
  rationale: సువార్త కథనంలోని ὄχλος పదానికి ఆధునిక, గౌరవప్రదమైన, సులభంగా అర్థమయ్యే సమానార్థకం.
