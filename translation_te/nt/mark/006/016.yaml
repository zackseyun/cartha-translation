    rationale: ‘నేను తల నరికించిన’ causatively says that Herod caused another person to behead John. The Greek ἀπεκεφάλισα is active and states, “I beheaded.” The historical context need not be used to alter the verbal form.
  - severity: medium
    issue: పాదసూచిక bలో ప్రత్యామ్నాయ పఠనం అస్పష్టంగా ఉంది
    rationale: The note introduces ‘లేపబడ్డాడు’ as though it were an alternative, but that is already the wording of the main text. It should instead identify active alternatives such as ‘లేచాడు’ and explain that the Greek form is passive.
