  source_fidelity: ‘తల నరికించిన’ is causative (“had [someone] cut off [his] head”), whereas ἀπεκεφάλισα is active, “I beheaded.” The Greek passive ἠγέρθη is well represented by ‘లేపబడ్డాడు,’ and ‘ఇతడే’ suitably preserves the demonstrative emphasis of οὗτος.
  naturalness: The sentence is clear and appropriate in modern standard Telugu. Replacing the causative wording with the active ‘తల నరికిన’ is both more source-faithful and still natural in Herod’s direct speech.
  terminology: ‘హేరోదు,’ ‘యోహాను,’ and ‘లేపబడ్డాడు’ are suitable. The alternative-reading footnote must not present the primary wording ‘లేపబడ్డాడు’ as an alternative to itself.
