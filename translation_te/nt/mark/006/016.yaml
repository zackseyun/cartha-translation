source:
  edition: SBLGNT
  text: ἀκούσας δὲ ⸀ὁ Ἡρῴδης ⸀ἔλεγεν· Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην, οὗτος ⸀ἠγέρθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/016.yaml
  text: But when Herod heard it[a], he said, “John, whom I beheaded[b], has been raised.”
translation:
  language: te
  text: అయితే హేరోదు అది విన్నప్పుడు, “నేను తల నరికిన యోహాను—ఇతడే లేపబడ్డాడు[b]” అని అన్నాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అంటూ ఉండేవాడు.” గ్రీకు అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న లేదా పదేపదే చెప్పే భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'లేదా, “లేచాడు” లేదా “తిరిగి లేచాడు.” గ్రీకు క్రియ కర్మణి రూపంలో ఉంది: “లేపబడ్డాడు.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: అది విన్నప్పుడు
  rationale: అవరిస్టు కృదంతానికి ప్రధాన క్రియతో ఉన్న కాలసంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది. ‘అది’ అనేది సందర్భంలో హేరోదు విన్న వార్తను సూచిస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: కథనం తిరిగి హేరోదు స్పందనవైపు మళ్లడంలోని స్వల్ప భేదాన్ని సూచిస్తుంది.
- source_word: ἔλεγεν
  choice: అని అన్నాడు
  rationale: కథన తెలుగులో సహజమైన రూపం. గ్రీకు అసంపూర్ణ భూతకాల క్రియలో కొనసాగింపు లేదా పునరావృత భావం ఉండవచ్చు; దాన్ని పాదసూచికలో ఉంచాం.
- source_word: Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην
  choice: నేను తల నరికించిన యోహాను
  rationale: గ్రీకులో ముందుకు తెచ్చిన కర్మను తెలుగులో సహజంగా అమర్చి, హేరోదు తన అధికారంతో చేయించిన శిరచ్ఛేదానికి అతడే బాధ్యుడన్న భావాన్ని నిలుపుతుంది.
- source_word: οὗτος
  choice: ఇతడే
  rationale: సూచనార్థక సర్వనామంలోని ఉద్ఘాటనను ‘అతడు’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: ἠγέρθη
  choice: లేపబడ్డాడు
  rationale: గ్రీకు క్రియలోని కర్మణి ప్రయోగాన్ని నిలుపుతూ, దాన్ని ‘లేచాడు’ అనే కర్తరి రూపంగా మార్చకుండా ఉంచుతుంది.
theological_decisions:
- issue: ἠγέρθη అనే పునరుత్థాన సంబంధ పదబంధం
  choice: లేపబడ్డాడు
  alternative: లేచాడు / తిరిగి లేచాడు
  rationale: మూల గ్రీకు కర్మణి రూపంలో ఉంది. ‘లేపబడ్డాడు’ అనేది ఆ రూపాన్ని, అలాగే కార్యాన్ని ఎవరు చేశారనే విషయాన్ని వాక్యం స్పష్టంగా చెప్పకపోవడాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇతడే’ ద్వారా οὗτος యొక్క ఉద్ఘాటనను, ‘లేపబడ్డాడు’ ద్వారా మూలంలోని కర్మణి రూపాన్ని నిలిపాం. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
