  yaml_path: translation/nt/mark/006/008.yaml
  text: And he instructed them to take nothing for the journey except a staff only—no bread[a], no bag[b], no copper in their belt—
translation:
  language: te
  text: ఆయన వారికి ప్రయాణానికి చేతికర్ర ఒక్కటి తప్ప మరేమీ తీసుకువెళ్లవద్దని ఆదేశించాడు—రొట్టె వద్దు, సంచి[a] వద్దు, నడుము పట్టీలో రాగి[b] కూడా వద్దు—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ప్రయాణానికి కావలసిన ఆహారం లేదా ఇతర సరఫరాలు పెట్టుకునే సంచి.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థం ‘రాగి’; అంటే, నడుము పట్టీలో పెట్టుకునే రాగి నాణేలు లేదా డబ్బు.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγειλεν
  choice: ఆదేశించాడు
  rationale: ఈ క్రియ అధికారంతో కూడిన నిర్దేశాన్ని సూచిస్తుంది. ‘ఆదేశించాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ అధికార భావాన్ని నిలుపుతుంది.
- source_word: μηδὲν αἴρωσιν
  choice: మరేమీ తీసుకువెళ్లవద్దని
  rationale: ప్రయాణ సామగ్రిని వెంట తీసుకెళ్లే సందర్భంలో αἴρω యొక్క భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰς ὁδὸν
  choice: ప్రయాణానికి
  rationale: ప్రయాణ సన్నాహానికి సంబంధించిన ఉద్దేశాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: εἰ μὴ ῥάβδον μόνον
  choice: చేతికర్ర ఒక్కటి తప్ప
  rationale: ῥάβδος ఇక్కడ ప్రయాణంలో ఉపయోగించే కర్ర; ‘ఒక్కటి’ అనే పదం μόνον యొక్క ప్రత్యేక ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἄρτον
  choice: రొట్టె
  rationale: మూలంలోని నిర్దిష్టమైన ఆహారపదార్థాన్ని ‘ఆహారం’ అని సాధారణీకరించకుండా అనువదిస్తుంది.
- source_word: πήραν
  choice: ఆహారపు సంచి
  rationale: πήρα ప్రయాణంలో ఆహారం లేదా సరఫరాలు పెట్టుకునే సంచిని సూచిస్తుంది. ‘ఆహారపు సంచి’ సాధారణ ‘సంచి’ కంటే సందర్భార్థాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: ζώνην
  choice: నడుము పట్టీ
  rationale: డబ్బు దాచుకునే లేదా మోసుకెళ్లే నడుము చుట్టూ కట్టే పట్టీని స్పష్టంగా సూచిస్తుంది.
- source_word: χαλκόν
  choice: రాగి
  rationale: మూలపదపు అక్షరార్థాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; సందర్భంలో ఇది రాగి నాణేలను, అంటే డబ్బును సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
