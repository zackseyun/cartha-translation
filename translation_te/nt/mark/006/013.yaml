id: MRK.6.13
reference: Mark 6:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ δαιμόνια πολλὰ ἐξέβαλλον, καὶ ἤλειφον ἐλαίῳ πολλοὺς ἀρρώστους καὶ ἐθεράπευον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/013.yaml
  text: And they were casting out many demons[a], and were anointing many sick people with oil and healing them.
translation:
  language: te
  text: వారు అనేక దయ్యాలను వెళ్లగొట్టేవారు; అనేక మంది రోగులకు నూనె[a]తో పూసేవారు మరియు వారిని స్వస్థపరిచేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒలీవ నూనె.’
    reason: ἔλαιον అనే పదం నూనెను సూచిస్తుంది; ఆ కాలపు మధ్యధరా సందర్భంలో అది సాధారణంగా ఒలీవ నూనె అయి ఉండేది.
lexical_decisions:
- source_word: δαιμόνια
  choice: దయ్యాలను
  rationale: δαιμόνιον ఇక్కడ దుష్ట ఆత్మసంబంధ జీవులను సూచిస్తుంది. సమీప వచనాల పదజాలాన్ని దిగుమతి చేయకుండా, ఆధునిక తెలుగులో నేరుగా అర్థమయ్యే ‘దయ్యాలు’ను వాడాం.
- source_word: πολλὰ
  choice: అనేక
  rationale: δαιμόνιαను విశేషించే పరిమాణార్థాన్ని సరళంగా నిలుపుతుంది.
- source_word: ἐξέβαλλον
  choice: వెళ్లగొట్టేవారు
  rationale: అసంపూర్ణ భూతకాల రూపం తెలిపే పునరావృత లేదా కొనసాగిన కార్యాన్ని తెలుగు అలవాటైన క్రియారూపంతో వ్యక్తం చేస్తుంది.
- source_word: ἤλειφον
  choice: పూసి
  rationale: ἀλείφω అంటే పూయడం లేదా రాయడం. ‘అభిషేకించడం’ వల్ల అనవసరంగా కర్మకాండ భావం బలపడవచ్చు; ‘నూనె పూసి’ సహజంగా, వివరణాత్మకంగా ఉంది.
- source_word: ἐλαίῳ
  choice: నూనెతో / నూనె
  rationale: ἔλαιον సాధారణంగా నూనెను, ప్రాచీన మధ్యధరా సందర్భంలో తరచుగా ఒలీవ నూనెను సూచిస్తుంది. ప్రధాన పాఠ్యంలో విస్తృతమైన ‘నూనె’ సరిపోతుంది.
- source_word: ἀρρώστους
  choice: రోగులైన ... మందికి
  rationale: నామవాచకంగా వాడిన విశేషణాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πολλοὺς
  choice: అనేకమందికి
  rationale: రోగుల సంఖ్య ఎక్కువగా ఉందనే సూటి పరిమాణార్థాన్ని నిలుపుతుంది.
- source_word: ἐθεράπευον
  choice: స్వస్థపరిచేవారు
  rationale: θεραπεύω యొక్క స్వస్థపరచడం అనే అర్థాన్ని, అలాగే అసంపూర్ణ భూతకాలంలోని పునరావృత కార్యభావాన్ని నిలుపుతుంది.
- source_word: καὶ
  choice: వారు ...; ... పూసి
  rationale: తెలుగులో సహజ ప్రవాహం కోసం మొదటి καίను ప్రత్యక్షంగా ‘మరియు’ అని పెట్టకుండా వాక్య కొనసాగింపులో ఉంచి, తరువాతి సమన్వయాన్ని అర్ధవిరామం మరియు అనుసంధాన క్రియతో వ్యక్తం చేశాం.
theological_decisions:
- issue: నూనె పూయడానికి మరియు స్వస్థపరచడానికి మధ్య సంబంధం
  choice: శిష్యులు నూనె పూసి రోగులను స్వస్థపరిచారని చారిత్రక చర్యలుగా మాత్రమే వర్ణించడం
  alternative: నూనె స్వయంగా స్వస్థత కలిగించిందని లేదా అది పూర్తిగా ప్రతీక మాత్రమేనని స్పష్టీకరించడం
  rationale: వచనం నూనె పూయడం, స్వస్థపరచడం రెండింటినీ నివేదిస్తుంది; వాటి మధ్య ఉన్న ఖచ్చితమైన ధార్మిక లేదా కారణ సంబంధాన్ని నిర్వచించదు. అందువల్ల అనువాదం ఆ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. అసంపూర్ణ భూతకాలంలోని పునరావృత కార్యభావాన్ని ‘-ేవారు’ రూపాలతో నిలిపాం; ‘అభిషేకించేవారు’ కంటే తటస్థమైన ‘నూనె పూసి’ని ఎంచుకున్నాం.
