  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀποταξάμενος αὐτοῖς ἀπῆλθεν εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/046.yaml
  text: And after saying goodbye to them[a], he went away to the mountain to pray.
translation:
  language: te
  text: ఆయన వారికి వీడ్కోలు చెప్పిన తరువాత[a], ప్రార్థించడానికి ఆ కొండకు వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి నుండి సెలవు తీసుకున్న తరువాత.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποταξάμενος
  choice: వీడ్కోలు చెప్పిన తరువాత
  rationale: ఈ మధ్యమ ప్రయోగ కృదంతం సాధారణంగా ఒకరి దగ్గర సెలవు తీసుకోవడం లేదా వీడ్కోలు చెప్పడాన్ని సూచిస్తుంది. దత్తివిభక్తిలోని αὐτοῖς‌తో కలిసి ఈ అర్థం సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: ముందు సందర్భంలో ప్రస్తావించబడిన ప్రజలను సూచించే దత్తివిభక్తి బహువచన సర్వనామం; ‘వారికి వీడ్కోలు చెప్పి’ అనే తెలుగులో సహజమైన నిర్మాణంలో నిలుపబడింది.
- source_word: ἀπῆλθεν
  choice: వెళ్లాడు
  rationale: ἀπέρχομαι భూతకాల రూపం అక్కడి నుంచి బయలుదేరి వెళ్లడాన్ని సూచిస్తుంది. ‘వెళ్లాడు’ సహజమైన ఆధునిక తెలుగు; ముందు ఉన్న వీడ్కోలు సందర్భం వల్ల నిష్క్రమణ భావం స్పష్టంగా ఉంటుంది.
- source_word: εἰς τὸ ὄρος
  choice: ఆ కొండపైకి
  rationale: ὄρος కొండ లేదా పర్వతాన్ని సూచించగలదు. నిర్దిష్ట ఉపపదాన్ని ‘ఆ’తో ప్రతిబింబిస్తూ, ప్రార్థించడానికి ఎక్కి వెళ్లే స్థలానికి తెలుగులో సహజంగా ‘కొండపైకి’ అని అనువదించబడింది.
- source_word: προσεύξασθαι
  choice: ప్రార్థించడానికి
  rationale: ఇది ఉద్దేశాన్ని తెలిపే అనిశ్చిత క్రియారూపం; ఆయన వెళ్లిన ఉద్దేశం ప్రార్థించడమేనని నేరుగా తెలియజేస్తుంది.
- source_word: καὶ
  choice: —
  rationale: గ్రీకులోని సాధారణ కథన సంధానకమైన καὶను స్వతంత్ర ‘మరియు’తో ప్రారంభించడం తెలుగులో కృత్రిమంగా ఉంటుంది; వాక్యక్రమంలోని కొనసాగింపుతో దాని కథన సంబంధం సహజంగా వ్యక్తమవుతుంది.
theological_decisions:
- issue: ‘ఆ కొండ’ యొక్క సూచన
  choice: ప్రత్యేకమైన కొండగా మాత్రమే అనువదించి, దానికి ప్రతీకాత్మక లేదా ప్రత్యేక ప్రకటన సంబంధమైన అర్థం జోడించలేదు.
  alternative: ‘ఒక కొండ’ అని సాధారణీకరించడం, లేదా దానిని ప్రత్యేక దైవిక ప్రకటన స్థలంగా వ్యాఖ్యానించడం.
  rationale: గ్రీకు పాఠంలో నిర్దిష్ట ఉపపదం ఉంది, కాని ఆ స్థలానికి ఎలాంటి ప్రతీకాత్మక లేదా సిద్ధాంతపరమైన ప్రాముఖ్యతను స్పష్టంగా ఆపాదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘వీడ్కోలు చెప్పిన తరువాత’ సాధారణ పాఠకులకు స్పష్టంగా ఉండగా, మరింత పదసన్నిహితమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
