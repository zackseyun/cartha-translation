source:
  edition: SBLGNT
  text: καὶ γενομένου σαββάτου ἤρξατο ⸂διδάσκειν ἐν τῇ συναγωγῇ⸃· καὶ ⸀οἱ πολλοὶ ἀκούοντες ἐξεπλήσσοντο λέγοντες· Πόθεν τούτῳ ταῦτα, καὶ τίς ἡ σοφία ἡ δοθεῖσα ⸀τούτῳ, καὶ ⸀αἱ δυνάμεις τοιαῦται διὰ τῶν χειρῶν αὐτοῦ ⸀γινόμεναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/002.yaml
  text: And when the Sabbath came[a], he began to teach in the synagogue. And many who heard him were astonished, saying, “Where did this man get these things? And what is this wisdom given to him, and such mighty works happening through his hands?”
translation:
  language: te
  text: సబ్బాతు వచ్చినప్పుడు, ఆయన సమాజమందిరంలో బోధించడం మొదలుపెట్టాడు. ఆయన మాట విన్న అనేకులు ఆశ్చర్యపడి, “ఇతనికి ఇవన్నీ ఎక్కడి నుంచి వచ్చాయి? ఇతనికి ఇవ్వబడిన ఈ జ్ఞానం ఏమిటి? ఇతని చేతుల ద్వారా ఇలాంటి శక్తికార్యాలు[a] జరుగుతున్నాయేమిటి?” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇలాంటి అద్భుత కార్యాలు,” లేదా “ఇలాంటి శక్తి ప్రదర్శనలు.” గ్రీకు బహువచన పదం δυνάμεις అద్భుత కార్యాలను లేదా శక్తి వెల్లడయ్యే కార్యాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένου σαββάτου
  choice: విశ్రాంతి దినం వచ్చినప్పుడు
  rationale: కాలాన్ని సూచించే genitive absolute నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, ‘వచ్చినప్పుడు’ అనే కాలభావాన్ని నిలుపుతుంది.
- source_word: ἤρξατο διδάσκειν
  choice: బోధించడం మొదలుపెట్టాడు
  rationale: ἄρχομαι + infinitive లోని ఆరంభ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: συναγωγῇ
  choice: సమాజమందిరంలో
  rationale: ఈ యూదు సందర్భంలో ప్రార్థన, బోధన కోసం కూడే స్థలాన్ని సూచించే స్థిరమైన తెలుగు పదం.
- source_word: οἱ πολλοὶ ἀκούοντες
  choice: ఆయన మాట విన్న అనేకులు
  rationale: ἀκούοντες యొక్క సందర్భార్థాన్ని సహజ తెలుగులో తెలియజేయడానికి వినబడిన విషయాన్ని ‘ఆయన మాట’గా స్పష్టం చేసింది; οἱ πολλοὶ ను ‘అనేకులు’గా నిలిపింది.
- source_word: ἐξεπλήσσοντο
  choice: ఆశ్చర్యపడి
  rationale: వారు బలంగా విస్మయం చెందిన ప్రతిస్పందనను సరళమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: Πόθεν τούτῳ ταῦτα
  choice: ఇతనికి ఇవన్నీ ఎక్కడి నుంచి వచ్చాయి?
  rationale: Πόθεν లోని మూలం లేదా ఉద్భవం గురించిన ప్రశ్నను నిలుపుతుంది; ‘ఇతనికి’ అనేది τούτῳ లోని కొంత దూరం పెట్టే స్వరాన్ని వ్యక్తం చేస్తుంది.
- source_word: τίς ἡ σοφία ἡ δοθεῖσα τούτῳ
  choice: ఇతనికి ఇవ్వబడిన ఈ జ్ఞానం ఏమిటి?
  rationale: δοθεῖσα లోని కర్మణి భావాన్ని, ప్రశ్నలోని విస్మయాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: δυνάμεις
  choice: శక్తికార్యాలు
  rationale: δύναμις బహువచనం ఇక్కడ శక్తి వెల్లడయ్యే అసాధారణ కార్యాలను సూచిస్తుంది. ‘శక్తికార్యాలు’ మూలపదంలోని శక్తి భావాన్ని నిలుపుతూ, కేవలం ‘అద్భుతాలు’ అని ముందుగానే పరిమితం చేయదు.
- source_word: διὰ τῶν χειρῶν αὐτοῦ γινόμεναι
  choice: ఇతని చేతుల ద్వారా ... జరుగుతున్నాయి
  rationale: διά + genitive లోని సాధన భావాన్నీ, ‘చేతులు’ అనే గ్రీకు రూపకాన్నీ, γινόμεναι లోని జరుగుతున్న కార్యభావాన్నీ కాపాడుతుంది.
theological_decisions:
- issue: δυνάμεις యొక్క స్వభావం
  choice: ‘శక్తికార్యాలు’ అని అనువదించి, శక్తి వెల్లడయ్యే కార్యాలు అనే విస్తృత భావాన్ని నిలిపాం.
  alternative: ‘అద్భుతాలు’ లేదా ‘మహత్కార్యాలు’
  rationale: మార్కు సందర్భంలో ఈ పదం అద్భుత కార్యాలను సూచించగలిగినా, గ్రీకు పదంలో ఉన్న ‘శక్తి’ భావాన్ని పాఠ్యంలో నిలపడం ద్వారా అసలు పదంలోని అర్థ విస్తృతిని అనవసరంగా కుదించకుండా ఉంటాం.
- issue: τούτῳ లోని సంభాషణ స్వరం
  choice: ‘ఇతనికి’
  alternative: ‘ఆయనకు’ లేదా ‘ఈయనకు’
  rationale: సందర్భంలో మాట్లాడేవారు యేసును కొంత దూరంగా ఉంచి ప్రశ్నిస్తున్న స్వరాన్ని ఇది సహజ తెలుగులో ప్రతిబింబిస్తుంది; అవమాన భావాన్ని అతిగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ప్రశ్నల వరుసలోని విస్మయాన్ని నిలుపుతూ, గ్రీకు వాక్య నిర్మాణాన్ని తెలుగులో భారంగా అనిపించకుండా విభజించాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘శక్తికార్యాలు’ పదం వెంట ఉంచాం.
