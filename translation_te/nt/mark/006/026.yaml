id: MRK.6.26
reference: Mark 6:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ περίλυπος γενόμενος ὁ βασιλεὺς διὰ τοὺς ὅρκους καὶ τοὺς ⸀ἀνακειμένους οὐκ ἠθέλησεν ⸂ἀθετῆσαι αὐτήν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/026.yaml
  text: And the king[a], becoming deeply grieved, because of his oaths and those reclining at the table[c][b], did not want to refuse her.
translation:
  language: te
  text: రాజు ఎంతో దుఃఖించాడు. అయినా తాను చేసిన ప్రమాణాలను బట్టి, తనతో భోజనానికి కూర్చున్నవారిని బట్టి[a], ఆమెను కాదనడానికి[b] ఇష్టపడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలోని పదం, ఆనాటి భోజన ఆచారం ప్రకారం బల్ల దగ్గర ఆనుకొని పడుకున్నవారిని సూచిస్తుంది; అంటే భోజనానికి వచ్చిన అతిథులు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆమెను తిరస్కరించడానికి’ లేదా ‘ఆమె కోరికను తోసిపుచ్చడానికి.’ తాను ఆమెకు ఇచ్చిన మాటను పక్కన పెట్టడానికి అతడు ఇష్టపడలేదన్నది భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: περίλυπος γενόμενος
  choice: ఎంతో దుఃఖించాడు
  rationale: περίλυπος తీవ్రమైన దుఃఖాన్ని సూచిస్తుంది; γενόμενος స్థితిలో వచ్చిన మార్పును తెలియజేస్తుంది. ఆధునిక తెలుగులో ఈ రెండింటి భావాన్ని సహజంగా కలిపి వ్యక్తం చేస్తుంది.
- source_word: ὁ βασιλεὺς
  choice: రాజు
  rationale: మార్కు హేరోదును వర్ణించడానికి ఉపయోగించిన గ్రీకు బిరుదును నేరుగా నిలుపుతుంది.
- source_word: διὰ τοὺς ὅρκους
  choice: తాను చేసిన ప్రమాణాలను బట్టి
  rationale: διά + accusative కారణాన్ని సూచిస్తుంది. ὅρκους బహువచనాన్ని ‘ప్రమాణాలు’గా నిలిపి, అవి రాజు చేసినవని సందర్భం నుంచి సహజంగా స్పష్టం చేస్తుంది.
- source_word: τοὺς ἀνακειμένους
  choice: తనతో భోజనానికి కూర్చున్నవారిని
  rationale: పదం భోజన సమయంలో ఆనాటి ఆచారం ప్రకారం ఆనుకొని పడుకున్నవారిని సూచిస్తుంది. లక్ష్య పాఠకులకు సహజంగా అర్థమయ్యేలా భోజన సందర్భాన్ని స్పష్టంగా ఉంచింది.
- source_word: οὐκ ἠθέλησεν
  choice: ఇష్టపడలేదు
  rationale: అసమర్థతను కాకుండా సంకల్పం లేదా ఇష్టంలేమిని వ్యక్తం చేస్తుంది.
- source_word: ἀθετῆσαι αὐτήν
  choice: ఆమెను కాదనడానికి
  rationale: ఇక్కడ ఆమె విజ్ఞప్తిని లేదా తన మాటపై ఆమెకున్న హక్కును తోసిపుచ్చకపోవడం భావం. ‘కాదనడం’ ఆధునిక తెలుగులో సహజంగా ఈ సందర్భార్థాన్ని అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. గ్రీకులోని కారణ సంబంధాన్ని రెండుసార్లు ‘బట్టి’ అని ఉంచి, ప్రమాణాలు మరియు భోజన అతిథులు రెండూ రాజు నిర్ణయంపై ప్రభావం చూపినట్లు నిలిపాం. గ్రీకు participleకు సందర్భంలో అంతర్లీనంగా ఉన్న విరుద్ధ భావాన్ని సహజ తెలుగులో ‘అయినా’తో వ్యక్తం చేశాం.
