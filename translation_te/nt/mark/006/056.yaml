revisions:
- from: ఆయన ఏ గ్రామాల్లోకి, పట్టణాల్లోకి, పల్లెప్రాంతాల్లోకి వెళ్లినా, ప్రజలు రోగులను సంతవీధుల్లో ఉంచుతూ, ఆయన వస్త్రపు అంచునైనా[a] తాకనివ్వమని ఆయనను వేడుకున్నారు. ఆయనను తాకినవారంతా స్వస్థత పొందుతూ ఉండేవారు.[b]
  to: ఆయన ఏ గ్రామాల్లోకైనా, పట్టణాల్లోకైనా, పల్లెప్రాంతాల్లోకైనా వెళ్లినప్పుడు, ప్రజలు రోగులను సంతస్థలాల్లో ఉంచేవారు; కనీసం ఆయన వస్త్రపు అంచునైనా[a] తాకనివ్వమని ఆయనను వేడుకునేవారు. ఆయనను తాకినవారందరూ స్వస్థులయ్యేవారు.[b]
  rationale: The revision preserves the source text's distributive “wherever,” its sequence of villages, towns/cities, and rural areas, the repeated actions marked by the imperfects, and the contextual physical sense of ἐσῴζοντο. It also preserves the source's slight ambiguity in ἥψαντο αὐτοῦ by retaining “ఆయనను తాకినవారు.” No doctrinal interpretation has been added.
