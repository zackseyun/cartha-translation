id: MRK.6.56
reference: Mark 6:56
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὅπου ἂν εἰσεπορεύετο εἰς κώμας ἢ ⸂εἰς πόλεις ἢ εἰς⸃ ἀγροὺς ἐν ταῖς ἀγοραῖς ⸀ἐτίθεσαν τοὺς ἀσθενοῦντας, καὶ παρεκάλουν αὐτὸν ἵνα κἂν τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ ἅψωνται· καὶ ὅσοι ἂν ⸀ἥψαντο αὐτοῦ ἐσῴζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/056.yaml
  text: And wherever he entered villages or cities or countryside[a], they were laying the sick in the marketplaces and begged him that they might even touch the fringe of his garment[c][b]; and as many as touched it were being healed.
translation:
  language: te
  text: ఆయన ఏ గ్రామాల్లోకైనా, పట్టణాల్లోకైనా, పల్లెప్రాంతాల్లోకైనా వెళ్లినప్పుడు, ప్రజలు రోగులను సంతస్థలాల్లో ఉంచేవారు; కనీసం ఆయన వస్త్రపు అంచునైనా[a] తాకనివ్వమని ఆయనను వేడుకునేవారు. ఆయనను తాకినవారందరూ స్వస్థులయ్యేవారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “వస్త్రపు అంచు” అనే గ్రీకు పదం వస్త్రం కొంగు లేదా అంచును, లేక కుచ్చును సూచించవచ్చు; యూదుల వస్త్రాల కుచ్చుల భావన కూడా ఇందులో ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “స్వస్థులయ్యేవారు” అని అనువదించిన గ్రీకు క్రియకు అక్షరార్థంగా “రక్షింపబడేవారు” అని కూడా చెప్పవచ్చు; ఇక్కడ సందర్భం శారీరక స్వస్థతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἂν εἰσεπορεύετο
  choice: ఆయన ... వెళ్లినా
  rationale: ὅπου ἄν యొక్క సాధారణీకరణ భావాన్ని, అసంపూర్ణ భూతకాల క్రియ సూచించే పునరావృత చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: κώμας ... πόλεις ... ἀγρούς
  choice: గ్రామాల్లోకి, పట్టణాల్లోకి, పల్లెప్రాంతాల్లోకి
  rationale: మూడు రకాల నివాస/ప్రాంత విభాగాలను స్పష్టంగా వేరు చేస్తుంది; ἀγρούς ఇక్కడ వ్యక్తిగత పొలాలకన్నా గ్రామీణ ప్రాంతాలను సూచిస్తుంది.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: సంతవీధుల్లో
  rationale: ἀγορά అనే బహిరంగ మార్కెట్ లేదా కూడలి భావాన్ని సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἐτίθεσαν τοὺς ἀσθενοῦντας
  choice: ప్రజలు రోగులను ... ఉంచుతూ
  rationale: అస్పష్ట బహువచన కర్తను సహజంగా ‘ప్రజలు’ అని వ్యక్తం చేసి, imperfect సూచించే పునరావృత చర్యను ‘ఉంచుతూ’తో నిలుపుతుంది.
- source_word: παρεκάλουν αὐτόν
  choice: ఆయనను వేడుకున్నారు
  rationale: చికిత్స కోసం చేసిన గాఢమైన విన్నపాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἵνα κἂν ... ἅψωνται
  choice: '... అంచునైనా తాకనివ్వమని'
  rationale: κἄνలోని ‘కనీసం/అయినా’ అనే కనిష్ఠ విన్నప భావాన్ని ‘అయినా’ సహజంగా అందిస్తుంది.
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: ఆయన వస్త్రపు అంచు
  rationale: κράσπεδονకు అంచు, అల్లిక అంచు, కుచ్చు అనే అవకాశాలు ఉన్నాయి; ప్రధాన పాఠంలో ‘అంచు’ అతిగా నిర్దిష్టం చేయకుండా మూల భావాన్ని నిలుపుతుంది.
- source_word: ἥψαντο αὐτοῦ
  choice: ఆయనను తాకినవారు
  rationale: గ్రీకులో αὐτοῦ పురుషలింగ సర్వనామం యేసునే ప్రత్యక్షంగా సూచిస్తుంది; ముందరి వాక్యం ప్రకారం ఆయన వస్త్రపు అంచును తాకడం ఉద్దేశమై ఉండవచ్చు, అయినా మూలంలోని వ్యాకరణ రూపాన్ని ప్రధాన పాఠంలో నిలుపుతుంది.
- source_word: ἐσῴζοντο
  choice: స్వస్థత పొందుతూ ఉండేవారు
  rationale: σῴζωకు ‘రక్షించు’ అనే విస్తృత అర్థం ఉన్నప్పటికీ, రోగుల సందర్భంలో శారీరక స్వస్థత ప్రధాన భావం; imperfect యొక్క పునరావృత ఫలితాన్ని కూడా ఈ రూపం చూపిస్తుంది.
theological_decisions:
- issue: ἐσῴζοντο అనే σῴζω రూపం యొక్క అనువాదం
  choice: స్వస్థత పొందుతూ ఉండేవారు
  alternative: రక్షించబడుతూ ఉండేవారు
  rationale: తక్షణ సందర్భం రోగుల శారీరక స్వస్థత గురించి ఉంది. అయినా ‘రక్షించబడేవారు’ అనే మూలపదపు విస్తృత అర్థాన్ని పాదసూచనలో ఉంచడం ద్వారా దాని భావ పరిధిని పూర్తిగా దాచలేదు.
- issue: ἥψαντο αὐτοῦలో తాకబడినది ఎవరు/ఏది
  choice: ఆయనను తాకినవారు
  alternative: దాన్ని తాకినవారు / ఆయన వస్త్రపు అంచును తాకినవారు
  rationale: గ్రీకు పాఠం αὐτοῦ (‘ఆయనను/ఆయనకు చెందినది’) అని ఉంది. సందర్భం వస్త్రపు అంచును సూచించినా, ‘దాన్ని’ అని మార్చడం కంటే మూలంలోని వ్యక్తి సూచనను నిలపడం నిజమైన స్వల్ప సందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన వచనశైలి. అసంపూర్ణ భూతకాలంలోని పునరావృత చర్యలను ‘ఉంచుతూ’, ‘పొందుతూ ఉండేవారు’ ద్వారా సాధ్యమైనంత సహజంగా నిలిపాం. ప్రధాన పాఠంలో రెండు పాదసూచిక గుర్తులూ [a], [b] చేర్చబడ్డాయి.
