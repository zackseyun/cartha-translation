id: MRK.6.30
reference: Mark 6:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ συνάγονται οἱ ἀπόστολοι πρὸς τὸν Ἰησοῦν, καὶ ἀπήγγειλαν αὐτῷ ⸀πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/030.yaml
  text: And the apostles gathered to Jesus[a], and they reported to him all that they had done and taught.
translation:
  language: te
  text: అపొస్తలులు యేసు దగ్గరకు కూడివచ్చి, తాము చేసినవన్నీ, బోధించినవన్నీ ఆయనకు నివేదించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνάγονται
  choice: తిరిగి వచ్చి సమావేశమై
  rationale: కథనంలోని వర్తమాన కాలాన్ని సహజమైన తెలుగు భూతకాల సందర్భంలో చూపిస్తూ, మిషన్ నుంచి యేసు దగ్గరికి కూడివచ్చిన సమూహ భావాన్ని వ్యక్తం చేస్తుంది. సందర్భం వల్ల స్పష్టమైన ‘తిరిగి’ అనే భావాన్ని సహజత్వం కోసం చేర్చింది.
- source_word: οἱ ἀπόστολοι
  choice: అపొస్తలులు
  rationale: ఇక్కడ పంపబడిన పన్నెండుమందికి గుర్తింపు పొందిన పాత్రపదం; సాధారణ ‘దూతలు’ అని అనువదిస్తే మార్కు వాడిన ప్రత్యేక designation మరుగునపడుతుంది.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: యేసు దగ్గరికి
  rationale: πρός + accusative వ్యక్తివైపు కదలికను సూచిస్తుంది; ఆధునిక తెలుగులో ‘దగ్గరికి’ సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: ἀπήγγειλαν
  choice: వివరించారు
  rationale: తమ సేవా కార్యాన్ని తిరిగి నివేదించిన భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; కేవలం ‘చెప్పారు’ కంటే నివేదిక స్వరాన్ని మెరుగుగా అందిస్తుంది.
- source_word: πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν
  choice: తాము చేసినవన్నీ, బోధించినవన్నీ
  rationale: πάντα యొక్క సమగ్రతను, రెండు సమాంతర ὅσα ఉపవాక్యాలను సంక్షిప్తంగా కాకుండా స్పష్టమైన తెలుగు సమాంతర నిర్మాణంలో నిలుపుతుంది.
theological_decisions:
- issue: శిష్యులను ἀπόστολοι అని పేర్కొనడం
  choice: ‘అపొస్తలులు’ అనే పాత్ర/గుర్తింపు పదాన్ని నిలుపడం
  alternative: ‘దూతలు’ లేదా ‘పంపబడినవారు’
  rationale: ఈ సందర్భంలో ఇది యేసు పంపి తిరిగివచ్చిన పన్నెండుమందిని సూచించే స్థిరమైన పదం. సాధారణ అర్థపదంతో మార్చడం వారి నియమిత సేవాపాత్రను అస్పష్టం చేయవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గౌరవప్రదమైన కథన శైలి. మూలంలోని రెండు సమాంతర నివేదిక అంశాలను ‘చేసినవన్నీ, బోధించినవన్నీ’గా నిలిపింది.
