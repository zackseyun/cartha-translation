translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి వాడబడింది. ప్రశ్నలోని ఆశ్చర్యం లేదా అభ్యంతర స్వరాన్ని అదనపు పదాలతో నిర్ణయించకుండా, మూలంలోని పరిశీలనాత్మక ప్రశ్న రూపాన్ని అలాగే నిలిపాం. ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదసూచిక గుర్తులు వాటి సంబంధిత పదాల దగ్గర లేకపోవడంతో, తెలుగు పాఠ్యంలో [a]ను ‘రొట్టె’కు, [b]ను ‘దేనారాలకు’ జతచేశాం.
