id: MRK.6.37
reference: Mark 6:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Δότε αὐτοῖς ὑμεῖς φαγεῖν. καὶ λέγουσιν αὐτῷ· Ἀπελθόντες ἀγοράσωμεν δηναρίων διακοσίων ἄρτους καὶ ⸀δώσομεν αὐτοῖς φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/037.yaml
  text: But he answered and said to them[a], “You yourselves give them something to eat.” And they said to him[b], “Should we go and buy bread for two hundred denarii and give it to them to eat?”
translation:
  language: te
  text: అయితే ఆయన వారికి జవాబుగా, “మీరే వారికి తినడానికి ఏమైనా ఇవ్వండి” అన్నాడు. వారు ఆయనతో, “మేము వెళ్లి రెండువందల దేనారాలకు[b] రొట్టె[a] కొని, వారికి తినడానికి ఇవ్వాలా?” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రొట్టెలు.” గ్రీకు పదం ఆహారంగా ‘రొట్టె’నూ, విడివిడిగా ‘రొట్టెలు’నూ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: దేనారం అనేది ఒక కూలీకి లేదా సైనికుడికి సాధారణంగా ఒక రోజు పనికి ఇచ్చే వేతనం.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: జవాబుగా ... అన్నాడు
  rationale: గ్రీకు కథనంలోని ‘జవాబిచ్చి చెప్పాడు’ అనే జంట క్రియల భావాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా వినిపించేలా అనువదించబడింది.
- source_word: Δότε ... ὑμεῖς
  choice: మీరే ... ఇవ్వండి
  rationale: ప్రత్యేకంగా వాడిన ὑμεῖς సర్వనామంలోని ఉద్ఘాటనను ‘మీరే’ స్పష్టంగా తెలియజేస్తుంది; ఆజ్ఞార్థక Δότεను నేరుగా ‘ఇవ్వండి’గా ఉంచింది.
- source_word: φαγεῖν
  choice: తినడానికి ఏమైనా
  rationale: ‘వారికి తినడానికి ఇవ్వండి’ అనే తెలుగు ప్రయోగం మూలంలోని ఉద్దేశార్థక క్రియారూపాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘ఏమైనా’ సందర్భంలో అంతర్భూతమైన ఆహార భావాన్ని వెల్లడిస్తుంది.
- source_word: Ἀπελθόντες ἀγοράσωμεν
  choice: మేము వెళ్లి ... కొనాలా
  rationale: పరిశీలనాత్మక ప్రశ్నగా ఉన్న subjunctive భావాన్ని ‘కొనాలా?’ నిలుపుతుంది; participleను సహజమైన తెలుగు వరుసక్రియ ‘వెళ్లి’గా అనువదించింది.
- source_word: δηναρίων διακοσίων
  choice: రెండువందల దేనారాలకు
  rationale: ఈ genitive ధరను సూచిస్తుంది; ‘-కు’ విభక్తి తెలుగులో కొనుగోలు ధరను సహజంగా తెలియజేస్తుంది.
- source_word: ἄρτους
  choice: రొట్టె
  rationale: ἄρτος ఆహార పదార్థమైన ‘రొట్టె’నూ, లెక్కించగల ‘రొట్టెలు’నూ సూచించగలదు. ప్రధాన పాఠ్యంలో సహజమైన సమష్టి పదాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: δώσομεν αὐτοῖς φαγεῖν
  choice: వారికి తినడానికి ఇవ్వాలా
  rationale: యేసు ఆజ్ఞలోని ‘ఇవ్వండి’ అనే క్రియతో ఉన్న ఉద్దేశపూర్వక పునరుక్తిని నిలుపుతుంది; ‘వారిని పోషించాలా’ వంటి విస్తృత వ్యాఖ్యానాన్ని నివారిస్తుంది.
