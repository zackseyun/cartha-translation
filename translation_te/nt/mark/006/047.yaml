source:
  edition: SBLGNT
  text: Καὶ ὀψίας γενομένης ἦν τὸ πλοῖον ἐν μέσῳ τῆς θαλάσσης, καὶ αὐτὸς μόνος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/047.yaml
  text: And when evening had come[a], the boat was in the middle of the sea, and he was alone on the land.
translation:
  language: te
  text: సాయంకాలం వచ్చినప్పుడు, పడవ సముద్రం మధ్యలో ఉంది, ఆయన ఒక్కడే భూమిపై ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒడ్డున.’ గ్రీకు పాఠ్యంలో అక్షరార్థంగా ‘భూమిపై’ అని ఉంది; ఇది సముద్రంలో ఉన్న పడవకు, ఆయన ఉన్న ప్రదేశానికి మధ్య వ్యత్యాసాన్ని చూపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας γενομένης
  choice: సాయంకాలం వచ్చినప్పుడు
  rationale: ఈ genitive absolute కాలసంబంధ పరిస్థితిని సూచిస్తుంది. ‘సాయంకాలం వచ్చినప్పుడు’ అనేది సహజమైన ఆధునిక తెలుగు; సాయంకాలం ప్రవేశించిన భావాన్ని నిలుపుతుంది.
- source_word: πλοῖον
  choice: పడవ
  rationale: గలిలయ పరిసరానికి ‘పడవ’ సహజమైనది, సందర్భోచితమైనది; ‘ఓడ’ ఆధునిక పాఠకులకు మరీ పెద్ద నౌకను సూచించవచ్చు.
- source_word: ἐν μέσῳ τῆς θαλάσσης
  choice: సముద్రం మధ్యలో
  rationale: పడవ ఒడ్డుకు దూరంగా సముద్రం మధ్యభాగంలో ఉన్న స్థానాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: θάλασσα
  choice: సముద్రం
  rationale: భౌగోళికంగా ఇది సరస్సయినా, గ్రీకు మూలపదం ‘సముద్రం’ అని ఉంది. కాబట్టి మూలపాఠ్య పదప్రయోగాన్ని నిలుపుకున్నాం.
- source_word: αὐτὸς μόνος
  choice: ఆయన ఒక్కరే
  rationale: సర్వనామంతో పాటు μόνος యేసు ఒంటరిగా ఉన్న విషయాన్ని నొక్కిచెబుతుంది. ‘ఆయన ఒక్కరే’ ఆ ఉద్ఘాటనను తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ἐπὶ τῆς γῆς
  choice: నేలమీద
  rationale: పడవ సముద్రంలో ఉండగా ఆయన భూమిమీద ఉన్నారనే వ్యత్యాసాన్ని నేరుగా నిలుపుతుంది; ‘ఒడ్డున’ అనేది సందర్భోచిత ప్రత్యామ్నాయమైనా కొంత వివరణాత్మకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని సముద్రం–నేల వ్యత్యాసాన్ని నిలుపుతూ, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదాలు ఉపయోగించబడ్డాయి.
