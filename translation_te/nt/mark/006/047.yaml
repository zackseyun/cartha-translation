- from: సాయంకాలం వచ్చినప్పుడు, పడవ సముద్రం మధ్యలో ఉంది; ఆయన ఒక్కరే నేలమీద ఉన్నాడు.[a]
  to: సాయంకాలం వచ్చినప్పుడు, పడవ సముద్రం మధ్యలో ఉంది, ఆయన ఒక్కడే భూమిపై ఉన్నారు.[a]
  rationale: The revision corrects honorific verb agreement and uses ‘భూమిపై’ to express the Greek land/sea contrast more precisely, while retaining ‘ఒడ్డున’ as a contextual lexical alternative in the footnote. No interpretive or theological expansion has been added.
