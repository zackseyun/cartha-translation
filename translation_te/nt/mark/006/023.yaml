id: MRK.6.23
reference: Mark 6:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὤμοσεν ⸀αὐτῇ· ⸂Ὅ τι⸃ ἐάν με αἰτήσῃς δώσω σοι ἕως ἡμίσους τῆς βασιλείας μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/023.yaml
  text: And he swore to her[a], “Whatever you ask me, I will give you[b], up to half of my kingdom.”
translation:
  language: te
  text: 'అతడు ఆమెతో ఇలా ప్రమాణం చేశాడు: “నువ్వు నన్ను ఏది అడిగినా[a] నీకు ఇస్తాను—నా రాజ్యంలో సగం వరకు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నువ్వు నన్ను ఏదైనా అడిగినా.”
    reason: lexical_alternative
  - marker: b
    text: “నా రాజ్యంలో సగం వరకు” అనేది రాజులు చేసే అతిశయోక్తితో కూడిన సంప్రదాయ వాగ్దానం.
    reason: cultural_note
lexical_decisions:
- source_word: ὤμοσεν
  choice: ప్రమాణం చేస్తూ
  rationale: ὀμνύω ఇక్కడ గంభీరమైన ఒట్టు లేదా ప్రమాణం చేయడాన్ని సూచిస్తుంది. తెలుగు కథనంలో ప్రత్యక్ష వాక్యానికి సహజంగా అనుసంధానమయ్యేలా ‘ప్రమాణం చేస్తూ’ అని అనువదించబడింది.
- source_word: αὐτῇ
  choice: ఆమెతో
  rationale: స్త్రీలింగ ఏకవచన దత్తివిభక్తి సందర్భంలోని బాలికను సూచిస్తుంది. తెలుగులో మాట చెప్పబడిన వ్యక్తిని సహజంగా ‘ఆమెతో’ అని వ్యక్తపరుస్తుంది.
- source_word: Ὅ τι ἐάν
  choice: ఏమి … అయినా
  rationale: ఈ అనిర్దిష్ట సంబంధపద నిర్మాణం అడగగల దేనినైనా పరిమితి లేకుండా సూచిస్తుంది. ‘ఏమి అడిగినా’ ఆధునిక తెలుగులో సహజంగా ఆ విస్తృతిని నిలుపుతుంది.
- source_word: με αἰτήσῃς
  choice: నన్ను … అడిగినా
  rationale: αἰτέω అడగడం లేదా కోరడాన్ని సూచిస్తుంది. వ్యక్తిని కర్మగా ఉంచే ‘నన్ను అడిగినా’ తెలుగు వాడుకలో సహజమైన నిర్మాణం.
- source_word: δώσω σοι
  choice: నీకు ఇస్తాను
  rationale: భవిష్యత్ కాల క్రియతో కూడిన ఈ నిర్మాణం స్పష్టమైన వాగ్దానాన్ని తెలియజేస్తుంది.
- source_word: ἕως ἡμίσους
  choice: సగం వరకైనా
  rationale: ἕως ఇక్కడ కాలాన్ని కాక పరిమాణపు గరిష్ఠ హద్దును సూచిస్తుంది. ‘సగం వరకైనా’ ఆ హద్దుతోపాటు మాటలోని అతిశయోక్తి ధోరణిని సహజంగా అందిస్తుంది.
- source_word: τῆς βασιλείας μου
  choice: నా రాజ్యంలో
  rationale: βασιλεία పాలన, రాజ్యాధికారం లేదా రాజ్యప్రాంతాన్ని సూచించగలదు. ఈ రాజసభ సందర్భంలో ‘నా రాజ్యం’ అనే స్థూల అర్థం అత్యంత సహజమైనది; విభక్తి నిర్మాణం వల్ల వాక్యంలో ‘నా రాజ్యంలో సగం’ అయింది.
theological_decisions:
- issue: హేరోదు మాటలో βασιλεία అర్థం
  choice: రాజ్యం
  alternative: పాలన; రాజ్యాధికారం
  rationale: ఈ పదానికి పాలన లేదా రాజ్యాధికారం అనే అర్థాలు సాధ్యమైనా, ఇక్కడ అతిశయోక్తితో కూడిన రాజోచిత వాగ్దానంలో పంచగల రాజ్యప్రాంతం అనే భావమే సందర్భానికి అనుకూలం. ఇది పదానికి ప్రత్యేకమైన దైవశాస్త్రీయ అర్థాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ప్రమాణంలోని గంభీరతను, వాగ్దానంలోని విస్తృతిని, చివరి మాటలోని రాజోచిత అతిశయోక్తిని నిలుపుతూ పదేపదే అనిపించే అసహజ నిర్మాణాలను నివారించాం.
