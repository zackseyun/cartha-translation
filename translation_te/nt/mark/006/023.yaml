revisions:
- from: ఆమెతో ప్రమాణం చేస్తూ, “నువ్వు నన్ను ఏమి అడిగినా[a] నీకు ఇస్తాను—నా రాజ్యంలో సగం వరకైనా[b],” అన్నాడు.
  to: 'అతడు ఆమెతో ఇలా ప్రమాణం చేశాడు: “నువ్వు నన్ను ఏది అడిగినా[a] నీకు ఇస్తాను—నా రాజ్యంలో సగం వరకు[b].”'
  rationale: The revision changes the participial, potentially ambiguous narrative frame into a completed oath formula that reflects ὤμοσεν and naturally introduces direct speech in modern Telugu. It retains the indefinite breadth of Ὅ τι ἐάν, the future promise, and the extent phrase ‘up to half of my kingdom.’ Footnote anchors and their functions are preserved.
