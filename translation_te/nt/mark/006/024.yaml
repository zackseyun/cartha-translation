source:
  edition: SBLGNT
  text: ⸀καὶ ἐξελθοῦσα εἶπεν τῇ μητρὶ αὐτῆς· Τί ⸀αἰτήσωμαι; ἡ δὲ εἶπεν· Τὴν κεφαλὴν Ἰωάννου τοῦ ⸀βαπτίζοντος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/024.yaml
  text: And after going out, she said to her mother, “What should I ask for?” And she said, “The head of John the Baptizer.”
translation:
  language: te
  text: ఆమె బయటికి వెళ్లి తన తల్లితో, “నేను ఏమి అడగాలి?” అని అడిగింది. ఆమె తల్లి, “బాప్తిస్మమిచ్చే యోహాను తలను” అని చెప్పింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθοῦσα
  choice: బయటికి వెళ్లి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను సహజమైన తెలుగు క్రియాశ్రేణితో వ్యక్తం చేస్తుంది.
- source_word: Τί αἰτήσωμαι
  choice: నేను ఏమి అడగాలి?
  rationale: ఆలోచనాత్మక అఒరిస్టు మధ్యమ సుబ్జంక్టివ్ భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఏమి అడగాలి?’ అని అందిస్తుంది.
- source_word: μητρὶ αὐτῆς
  choice: తన తల్లితో
  rationale: కర్తనే సూచించే స్వీయ సంబంధాన్ని తెలుగులో సహజంగా ‘తన’తో వ్యక్తం చేస్తుంది; εἶπεν యొక్క సంభాషణ గ్రహీతను ‘తో’ సూచిస్తుంది.
- source_word: κεφαλήν
  choice: తలను
  rationale: అభ్యర్థించాల్సిన ప్రత్యక్ష వస్తువును ఎలాంటి మృదూకరణ లేకుండా స్పష్టంగా నిలుపుతుంది.
- source_word: τοῦ βαπτίζοντος
  choice: బాప్తిస్మమిచ్చే
  rationale: వర్తమాన కృదంతం యోహానును అతని ప్రత్యేక కార్యం ద్వారా గుర్తిస్తుంది; ఒక మతశాఖ పేరులా వినిపించే రూపాన్ని ప్రవేశపెట్టకుండా గ్రీకు అర్థాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: యోహాను బిరుదైన βαπτίζων అనువాదం
  choice: బాప్తిస్మమిచ్చే యోహాను
  alternative: బాప్తిస్మికుడైన యోహాను
  rationale: గ్రీకు పదం యోహాను చేసే కార్యాన్ని సూచించే కృదంతం. అందువల్ల సంప్రదాయ బిరుదును మాత్రమే ఉంచడం కంటే దాని అర్థాన్ని పారదర్శకంగా అనువదించాం; శాఖాపరమైన భావాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకులోని సంక్షిప్త సమాధానాన్ని విస్తరించకుండా ‘యోహాను తలను’ అనే అసంపూర్ణ వాక్యరూపంగానే నిలిపాం.
