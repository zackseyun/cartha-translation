  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా రెండు చిన్న వాక్యాలుగా ఇచ్చాం. నౌకాయాన భావాన్ని నిలుపుతూ కృత్రిమమైన అక్షరానువాదాన్ని నివారించాం.
