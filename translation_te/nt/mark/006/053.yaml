language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ διαπεράσαντες ⸂ἐπὶ τὴν γῆν ἦλθον εἰς⸃ Γεννησαρὲτ καὶ προσωρμίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/053.yaml
  text: And after crossing over to the land[b][a], they came to Gennesaret and moored there.
translation:
  language: te
  text: వారు దాటి ఒడ్డుకు చేరి, గెన్నెసరేతుకు వచ్చారు[a]. అక్కడ పడవను కట్టివేశారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘నేలకు చేరి, గెన్నెసరేతుకు వచ్చారు.’ పడవ ప్రయాణ సందర్భంలో ‘నేల’ అంటే ఒడ్డు లేదా తీరం అని అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘లంగరు వేశారు,’ ‘పడవను ఒడ్డుకు చేర్చారు,’ లేదా ‘ఒడ్డున నిలిపారు’ అని కూడా అనువదించవచ్చు; మూలపదానికి పడవను మూరింగ్‌లో నిలపడం అనే ప్రత్యేక నౌకాయాన భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπεράσαντες
  choice: సరస్సు దాటి
  rationale: ముందుగా జరిగిన చర్యను సూచించే భూతకాల అసమాపక క్రియారూపం. సందర్భం గలిలయ సరస్సును సూచిస్తున్నందున, తెలుగులో సహజంగా ఉండేందుకు ‘సరస్సు’ను స్పష్టంగా చేర్చాం.
- source_word: ἐπὶ τὴν γῆν ... ἦλθον εἰς Γεννησαρὲτ
  choice: గెన్నెసరేతు ఒడ్డుకు చేరుకున్నారు
  rationale: γῆ ప్రాథమికంగా ‘నేల/భూమి’ అని అర్థమిచ్చినా, పడవ ప్రయాణ సందర్భంలో నీటి నుండి ఒడ్డుకు చేరడాన్ని సూచిస్తుంది. గమ్యస్థానమైన గెన్నెసరేతును కలిపి సహజమైన తెలుగు వాక్యంగా అనువదించాం.
- source_word: Γεννησαρὲτ
  choice: గెన్నెసరేతు
  rationale: స్థలనామాన్ని ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: προσωρμίσθησαν
  choice: పడవను ఒడ్డున నిలిపారు
  rationale: ఈ క్రియకు పడవను ఒడ్డుకు చేర్చి నిలపడం లేదా లంగరు వేయడం అనే నౌకాయాన భావం ఉంది. తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదబంధాన్ని ఎంచుకున్నాం.
- source_word: καί
  choice: అక్కడ
  rationale: రెండవ καί కథనంలోని తదుపరి చర్యను కలుపుతుంది. తెలుగులో స్థలసంబంధాన్ని సహజంగా చూపేందుకు సందర్భానుసారంగా ‘అక్కడ’ వాడాం; వాక్య విభజనే అనుసంధానాన్ని తెలియజేస్తుంది.
