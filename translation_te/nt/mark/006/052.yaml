  text: for they did not understand about the loaves[b][a], but their hearts were hardened.
translation:
  language: te
  text: ఎందుకంటే వారు ఆ రొట్టెల విషయాన్ని గ్రహించలేదు[b]; కానీ వారి హృదయాలు కఠినమైపోయాయి[a][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి హృదయాలు మొద్దుబారిపోయాయి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆ రొట్టెల ప్రాముఖ్యతను వారు గ్రహించలేదు.’
    reason: lexical_alternative
  - marker: c
    text: కొన్ని ప్రాచీన ప్రతుల్లో ‘కాని’ అనే వ్యతిరేక భావాన్ని తెలిపే పదాలు లేవు.
    reason: textual_variant
lexical_decisions:
- source_word: συνῆκαν
  choice: గ్రహించలేదు
  rationale: సυνίημι ఇక్కడ కేవలం సమాచారం తెలియకపోవడాన్ని కాక, జరిగిన దాని భావాన్ని లేదా ప్రాముఖ్యతను అర్థం చేసుకోలేకపోవడాన్ని సూచిస్తుంది. ‘గ్రహించలేదు’ ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐπὶ τοῖς ἄρτοις
  choice: ఆ రొట్టెల సంగతిని
  rationale: ἐπί + దత్తివిభక్తి ఇక్కడ రొట్టెలతో జరిగిన అద్భుతం గురించిన విషయాన్ని, ముఖ్యంగా దాని ప్రాముఖ్యతను సూచిస్తుంది. ముందటి కథనంలోని నిర్దిష్ట రొట్టెలను చూపడానికి ‘ఆ’ చేర్చబడింది.
- source_word: ἄρτοις
  choice: రొట్టెలు
  rationale: బహువచనమైన ἄρτοις ఐదువేల మందికి ఆహారం పెట్టిన సందర్భంలోని నిర్దిష్ట రొట్టెలను సూచిస్తుంది; అందువల్ల సాధారణ ‘ఆహారం’ లేదా ఏకవచన ‘రొట్టె’ కంటే ‘రొట్టెలు’ సముచితం.
- source_word: καρδία
  choice: హృదయాలు
  rationale: καρδία అంతరంగ అవగాహన, స్పందన, వైఖరిని సూచిస్తుంది. గ్రీకులో సమూహార్థక ఏకవచనం ఉన్నప్పటికీ, అనేకమంది శిష్యులను ఉద్దేశించిన తెలుగులో ‘వారి హృదయాలు’ సహజంగా ఉంటుంది.
- source_word: πεπωρωμένη
  choice: కఠినమైపోయాయి
  rationale: πωρόω గట్టిపడటం లేదా మొద్దుబారటం అనే రూపకంతో ఆధ్యాత్మిక స్పందనలేమిని సూచిస్తుంది. ‘కఠినమైపోయాయి’ ఆ రూపకాన్ని నిలుపుతూ సహజమైన తెలుగు ఇస్తుంది.
- source_word: ἀλλ’ ἦν
  choice: ; … కఠినమైపోయాయి
  rationale: ἀλλά ముందు వాక్యభాగంతో వ్యత్యాసాన్ని చూపుతుంది. తెలుగులో అర్ధవిరామంతో అనుసంధానించిన రెండవ వాక్యభాగం ఆ భావసంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: πεπωρωμένηలో శిష్యుల అంతరంగ స్థితి స్వభావం
  choice: వారి హృదయాలు కఠినమైపోయాయి
  alternative: వారి హృదయాలు మొద్దుబారిపోయాయి
  rationale: మూలపాఠం ఆధ్యాత్మిక అస్పందనను వర్ణిస్తుంది గాని దానికి అంతిమ కారణం ఎవరో ఇక్కడ స్పష్టంగా చెప్పదు. ‘కఠినమైపోయాయి’ ఆ ఉద్రిక్తతను నిలుపుతుంది; దైవిక తీర్పుగా కలిగిన కఠినత అనే మరింత నిర్దిష్ట సిద్ధాంతార్థాన్ని అనువాదంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. ‘ఆ రొట్టెలు’ ముందటి అద్భుతానికి స్పష్టమైన కథన సంబంధాన్ని కల్పిస్తుంది. గ్రీకు సమూహార్థక ఏకవచనానికి బదులుగా సహజ తెలుగు కోసం ‘హృదయాలు’ అనే బహువచనం ఉపయోగించబడింది.
