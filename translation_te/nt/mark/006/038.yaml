  text: ὁ δὲ λέγει αὐτοῖς· Πόσους ⸂ἔχετε ἄρτους⸃; ⸀ὑπάγετε ἴδετε. καὶ γνόντες λέγουσιν· Πέντε, καὶ δύο ἰχθύας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/038.yaml
  text: But he said to them, “How many loaves do you have? Go and see.” And when they found out, they said, “Five, and two fish.”
translation:
  language: te
  text: 'అయితే ఆయన వారితో ఇలా అన్నాడు: “మీ దగ్గర ఎన్ని రొట్టెలు ఉన్నాయి? వెళ్లి చూడండి.” వారు తెలుసుకున్న తర్వాత, “ఐదు రొట్టెలు, రెండు చేపలు” అన్నారు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρτους
  choice: రొట్టెలు
  rationale: మొదటి శతాబ్దపు సాధారణ ఆహారమైన రొట్టెలను సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: ὑπάγετε ἴδετε
  choice: వెళ్లి చూడండి
  rationale: వరుసగా ఉన్న రెండు ఆజ్ఞారూపాల సరళతను, సహజమైన తెలుగు మాటతీరును కాపాడుతుంది.
- source_word: γνόντες
  choice: తెలుసుకొని
  rationale: వారు వెళ్లి పరిస్థితిని నిర్ధారించుకున్నారనే భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: ἰχθύας
  choice: చేపలు
  rationale: సంఖ్యతో సహజంగా సరిపోయే సాధారణ తెలుగు పదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వర్తమానకాల కథన క్రియలను తెలుగు కథన సంప్రదాయానికి అనుగుణంగా భూతకాలంలో అనువదించాం; తాజా ఆంగ్ల సవరణతోనూ ఇది సరిపోతుంది.
