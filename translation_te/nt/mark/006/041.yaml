  terminology: “రొట్టెలు,” “చేపలు,” “శిష్యులు,” and “ఆశీర్వదించాడు” are suitable modern-standard Telugu choices. The footnote responsibly gives “కృతజ్ఞతలు చెల్లించాడు” as a meal-context alternative while retaining the source-transparent main rendering.
