source:
  edition: SBLGNT
  text: καὶ λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κατέκλασεν τοὺς ἄρτους καὶ ἐδίδου τοῖς μαθηταῖς ⸀αὐτοῦ ἵνα ⸀παρατιθῶσιν αὐτοῖς, καὶ τοὺς δύο ἰχθύας ἐμέρισεν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/041.yaml
  text: And taking the five loaves and the two fish[a], looking up to heaven, he blessed and broke the loaves, and kept giving them to his disciples to set before them[b], and he divided the two fish among them all.
translation:
  language: te
  text: ఆయన ఆ ఐదు రొట్టెలను, రెండు చేపలను తీసుకొని, పైకి ఆకాశం వైపు చూసి, ఆశీర్వదించాడు[a]. తరువాత రొట్టెలను విరిచి, ప్రజల ముందు ఉంచడానికి తన శిష్యులకు ఇస్తూ ఉన్నాడు. ఆ రెండు చేపలను కూడా అందరికీ పంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కృతజ్ఞతలు చెల్లించాడు.” ఇక్కడి గ్రీకు క్రియకు అక్షరార్థంగా “ఆశీర్వదించాడు” అని అర్థం; భోజన సందర్భాల్లో అది కృతజ్ఞతలు చెల్లించే భావంతోనూ వాడవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: తీసుకొని
  rationale: ప్రధాన క్రియలకు ముందున్న క్రియాక్రమాన్ని సహజమైన తెలుగు అసమాపక క్రియతో వ్యక్తం చేస్తుంది.
- source_word: τοὺς πέντε ἄρτους
  choice: ఆ ఐదు రొట్టెలను
  rationale: లెక్కించబడిన ἄρτοι ఇక్కడ విడివిడిగా ఉన్న రొట్టెలను సూచిస్తుంది; ‘రొట్టెలు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: τοὺς δύο ἰχθύας
  choice: రెండు చేపలను
  rationale: మూలంలోని బహువచన వస్తువుకు నేరమైన, సహజమైన అనువాదం.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: ఆకాశం వైపు చూసి
  rationale: పైకి దృష్టి సారించిన చర్యను సహజంగా తెలియజేస్తూ, οὐρανός యొక్క ఆకాశ/పరలోక ప్రతిధ్వనిని పూర్తిగా సిద్ధాంతీకరించకుండా ఉంచుతుంది.
- source_word: εὐλόγησεν
  choice: ఆశీర్వదించాడు
  rationale: εὐλογέω అనే మూలక్రియను నేరుగా ప్రతిబింబిస్తుంది. కర్మను చేర్చకుండా ఉంచడం వల్ల ఆయన ఆహారాన్నే ఆశీర్వదించాడా లేక ఆశీర్వాదవచనం పలికాడా అనే మూలంలోని సంక్షిప్తత నిలుస్తుంది.
- source_word: κατέκλασεν τοὺς ἄρτους
  choice: రొట్టెలను విరిచి
  rationale: మూలంలోని స్పష్టమైన కర్మతో కూడిన చర్యను యథాతథంగా, సహజ తెలుగు క్రమంలో అందిస్తుంది.
- source_word: ἐδίδου
  choice: ఇస్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న లేదా పునరావృత పంపిణీ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: తన శిష్యులకు
  rationale: αὐτοῦ అనే స్వామ్య భావాన్ని తెలుగులో సహజంగా ‘తన’తో నిలుపుతుంది.
- source_word: ἵνα παρατιθῶσιν αὐτοῖς
  choice: ప్రజల ముందు ఉంచడానికి
  rationale: ἵνα యొక్క ఉద్దేశ్య భావాన్ని, παρατίθημι యొక్క ‘ముందు ఉంచు/వడ్డించు’ అనే దృశ్యరూపాన్ని కాపాడుతుంది. సందర్భం ప్రకారం αὐτοῖς యొక్క సూచితులను ‘ప్రజలు’గా స్పష్టం చేస్తుంది.
- source_word: ἐμέρισεν πᾶσιν
  choice: అందరికీ పంచాడు
  rationale: μερίζω లోని విభజించి పంచే భావాన్ని ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: భోజన సందర్భంలో εὐλόγησεν అనువాదం
  choice: ఆశీర్వదించాడు
  alternative: కృతజ్ఞతలు చెల్లించాడు
  rationale: మూలంలో εὐλογέω ఉంది, εὐχαριστέω కాదు. భోజన సందర్భంలో కృతజ్ఞత భావం కలిసివుండగలిగినా, ‘ఆశీర్వదించాడు’ మూలపదానికి మరింత పారదర్శకంగా ఉండి భావపరమైన ఉద్రిక్తతను నిలుపుతుంది.
- issue: εὐλόγησεν కు అంతర్లీన కర్మను స్పష్టం చేయాలా
  choice: కర్మను చేర్చకుండా ‘ఆశీర్వదించాడు’ అని ఉంచడం
  alternative: వాటిని ఆశీర్వదించాడు
  rationale: గ్రీకులో ప్రత్యక్ష కర్మ లేదు. ‘వాటిని’ అని చేర్చితే ఆశీర్వాదం ఆహారంపైనే పలికాడనే ఒక వ్యాఖ్యానాన్ని అనవసరంగా స్థిరపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. కొనసాగుతున్న పంపిణీని ‘ఇస్తూ ఉన్నాడు’తో చూపించాం; గ్రీకు సర్వనామం సందర్భంలో జనసమూహాన్ని సూచిస్తుందని ‘ప్రజల’తో స్పష్టం చేశాం. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో చేర్చబడింది.
