id: MRK.6.22
reference: Mark 6:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἰσελθούσης τῆς θυγατρὸς ⸂αὐτῆς τῆς⸃ Ἡρῳδιάδος καὶ ὀρχησαμένης ⸂καὶ ἀρεσάσης⸃ τῷ Ἡρῴδῃ καὶ τοῖς συνανακειμένοις, ⸂εἶπεν ὁ βασιλεὺς⸃ τῷ κορασίῳ· Αἴτησόν με ὃ ἐὰν θέλῃς, καὶ δώσω σοι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/022.yaml
  text: And when Herodias's daughter came in and danced[a], and pleased Herod and those reclining at the table with him, the king said to the girl, “Ask me for whatever you want[b], and I will give it to you.”
translation:
  language: te
  text: హేరోదియ కుమార్తె[a] లోపలికి వచ్చి నాట్యం చేసి, హేరోదును, అతనితో కలిసి భోజనం చేస్తున్నవారిని[b] మెప్పించినప్పుడు, రాజు ఆ బాలికతో, “నీకు ఏది కావాలంటే అది నన్ను అడుగు; నీకు ఇస్తాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతులు లేదా పాఠసంప్రదాయాల ప్రకారం దీనిని ‘అతని కుమార్తె హేరోదియ’ అని అర్థం చేసుకోవచ్చు. ఇక్కడ అనుసరించిన గ్రీకు పాఠంలో ‘హేరోదియ కుమార్తె’ అని ఉంది.
    reason: textual_variant
  - marker: b
    text: అక్షరార్థంగా, ‘అతనితోపాటు ఆనుకొని భోజనం చేస్తున్నవారు.’ అప్పటి విందుల్లో అతిథులు బల్ల దగ్గర పక్కకు ఒరిగి భోజనం చేసేవారు.
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθούσης
  choice: లోపలికి వచ్చి
  rationale: విందు జరుగుతున్న చోటికి ఆమె ప్రవేశించడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; జనిటివ్ అబ్సల్యూట్‌లోని కాలసంబంధ భావం తరువాతి ‘మెప్పించినప్పుడు’లో వ్యక్తమవుతుంది.
- source_word: τῆς θυγατρὸς αὐτῆς τῆς Ἡρῳδιάδος
  choice: హేరోదియ కుమార్తె
  rationale: అనుసరించిన గ్రీకు పాఠం ఆ బాలికను హేరోదియ కుమార్తెగా గుర్తిస్తుంది. ‘ఆమె స్వంత కుమార్తె’ అనే అధిక బలాన్ని తెలుగులో చేర్చకుండా సంక్షిప్తంగా ఉంచింది.
- source_word: ὀρχησαμένης
  choice: నాట్యం చేసి
  rationale: క్రియల క్రమాన్ని సహజంగా చూపిస్తూ, మూలంలోని సాధారణ ‘నాట్యం చేయడం’ అనే భావాన్నే ఉంచుతుంది.
- source_word: ἀρεσάσης
  choice: మెప్పించినప్పుడు
  rationale: ἀρέσκω యొక్క ప్రత్యక్ష భావమైన ‘మెప్పించు’ను ఇస్తుంది; ‘పరవశింపజేసింది’ వంటి అధిక తీవ్రతను చేర్చదు.
- source_word: τοῖς συνανακειμένοις
  choice: అతనితో కలిసి భోజనం చేస్తున్నవారిని
  rationale: తోటి విందు అతిథులను ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది. వారు బల్ల దగ్గర ఆనుకొని భోజనం చేసే నాటి ఆచారాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: εἶπεν ὁ βασιλεὺς
  choice: రాజు ... అన్నాడు
  rationale: హేరోదు అంతిప అధికారికంగా చతుర్థాధిపతి అయినప్పటికీ, మార్కు ఉపయోగించిన βασιλεύς (‘రాజు’) అనే పదాన్నే అనుసరిస్తుంది.
- source_word: τῷ κορασίῳ
  choice: ఆ బాలికతో
  rationale: κοράσιονకు సహజమైన ఆధునిక తెలుగు సమానార్థకం; వయస్సు గురించి మూలంలో లేని అదనపు నిర్దిష్టతను చేర్చదు.
- source_word: Αἴτησόν με ὃ ἐὰν θέλῃς
  choice: నీకు ఏది కావాలంటే అది నన్ను అడుగు
  rationale: అపరిమిత ఎంపికతో కూడిన అభ్యర్థనను స్పష్టమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δώσω σοι
  choice: నీకు ఇస్తాను
  rationale: ముందు ప్రస్తావించిన ‘ఏది’నే కర్మగా సహజంగా గ్రహింపజేస్తూ భవిష్యత్ వాగ్దానాన్ని నిలుపుతుంది.
theological_decisions:
- issue: హేరోదు అంతిపకు βασιλεύς అనే బిరుదు
  choice: రాజు
  alternative: చతుర్థాధిపతి / పాలకుడు
  rationale: చారిత్రకంగా సాంకేతికమైన బిరుదుతో మూలాన్ని సవరించకుండా, మార్కు కథనంలోని పదప్రయోగాన్ని యథాతథంగా గౌరవిస్తుంది.
- issue: హేరోదియతో కుమార్తెకు ఉన్న సంబంధం
  choice: హేరోదియ కుమార్తె
  alternative: అతని కుమార్తె హేరోదియ
  rationale: ఎంచుకున్న SBLGNT పాఠంలోని సహజమైన జనిటివ్ నిర్మాణాన్ని అనుసరిస్తుంది; భిన్న పాఠం/వ్యాఖ్యానాన్ని పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘హేరోదియ,’ ‘హేరోదు’ అనే రూపాలు వేర్వేరు వ్యక్తులను స్పష్టంగా చూపుతాయి. మూలంలోని భాగవాచక నిర్మాణాన్ని తెలుగులో సులభంగా చదవగల కాలవాక్యంగా మార్చినా, చర్యల క్రమం మరియు భావం నిలుపబడ్డాయి.
