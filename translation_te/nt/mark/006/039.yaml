  text: And he commanded them all to recline in groups on the green grass[a][b].
translation:
  language: te
  text: అప్పుడు ఆయన వారికి, అందరినీ పచ్చని గడ్డి మీద గుంపులు గుంపులుగా[a] భోజనానికి కూర్చోబెట్టమని[b] ఆజ్ఞాపించాడు.
  philosophy: optimal-equivalence
  footnotes:
