id: MRK.6.5
reference: Mark 6:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐδύνατο ἐκεῖ ⸂ποιῆσαι οὐδεμίαν δύναμιν⸃, εἰ μὴ ὀλίγοις ἀρρώστοις ἐπιθεὶς τὰς χεῖρας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/005.yaml
  text: And he was not able to do any mighty work there[a], except that he laid his hands on a few sick people and healed them.
translation:
  language: te
  text: కొద్దిమంది రోగులపై చేతులు ఉంచి వారిని స్వస్థపరచడం తప్ప, ఆయన అక్కడ ఏ అద్భుత కార్యమూ చేయలేకపోయాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఏ మహత్కార్యమూ” లేదా “ఏ శక్తికార్యమూ.” గ్రీకులో అక్షరార్థంగా “ఏ శక్తినీ” అని ఉంది; మార్కు రచనలో ఈ మాట అద్భుత కార్యాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: చేయలేకపోయాడు
  rationale: నిరాకరణతో ఉన్న δύναμαι తెలిపే నిజమైన అసమర్థతను సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది; దానిని కేవలం ఇష్టపడకపోవడంగా మార్చదు.
- source_word: ποιῆσαι
  choice: చేయ
  rationale: ποιέω అనే సాధారణ క్రియకు దగ్గరగా ఉండి, దాని కర్మగా వచ్చిన δύναμις‌తో తెలుగులో సహజంగా జతపడుతుంది.
- source_word: οὐδεμίαν δύναμιν
  choice: ఏ అద్భుత కార్యమూ
  rationale: మార్కు వాడుకలో δύναμις సూచించే అద్భుతమైన శక్తికార్యాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది. ‘శక్తి’ అనే మూలభావాన్ని పాదసూచికలో భద్రపరచబడింది.
- source_word: εἰ μὴ
  choice: అయితే
  rationale: ముందటి నిరాకరణకు తరువాతి స్వస్థపరచడాన్ని మినహాయింపుగా సహజమైన తెలుగు వాక్యనిర్మాణంలో పరిచయం చేస్తుంది.
- source_word: ὀλίγοις
  choice: కొద్దిమంది
  rationale: పరిమిత సంఖ్యను సరళంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀρρώστοις
  choice: రోగుల
  rationale: అనారోగ్యంతో ఉన్నవారిని సూచించే గౌరవప్రదమైన, ప్రస్తుత ప్రామాణిక తెలుగు పదం.
- source_word: ἐπιθεὶς τὰς χεῖρας
  choice: చేతులు ఉంచి
  rationale: చేతులను వారిమీద ఉంచిన భౌతిక చర్యను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ἐθεράπευσεν
  choice: స్వస్థపరిచాడు
  rationale: స్వస్థత కలిగించిన భావాన్ని తెలుగు బైబిలు శైలిలో పరిచితమైనప్పటికీ ఇప్పటికీ అర్థమయ్యే పదంతో తెలియజేస్తుంది.
theological_decisions:
- issue: యేసుకు పరిమితి ఉన్నట్లు అనిపించకుండా οὐκ ἐδύνατοను మృదువుగా అనువదించాలా?
  choice: చేయలేకపోయాడు
  alternative: చేయడానికి ఇష్టపడలేదు / చేయలేదు
  rationale: గ్రీకు పాఠం నిరాకరణతో δύναμαιను వాడి అసమర్థతను స్పష్టంగా చెబుతుంది. ఆ వేదాంతపరమైన ఉద్రిక్తతను అనువాదం నిలుపుతుంది; దానిని కేవలం అయిష్టతగా వ్యాఖ్యానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘చేయలేకపోయాడు’ మూలపాఠంలోని వేదాంతపరమైన ఉద్రిక్తతను నిలుపుతుంది; ‘అద్భుత కార్యం’ సాధారణ పాఠకుడికి సందర్భార్థాన్ని స్పష్టం చేస్తుంది, కాగా మూలంలోని ‘శక్తి’ భావం పాదసూచికలో ఇవ్వబడింది.
