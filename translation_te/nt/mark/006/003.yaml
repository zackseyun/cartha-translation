id: MRK.6.3
reference: Mark 6:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τέκτων, ὁ υἱὸς ⸀τῆς Μαρίας ⸂καὶ ἀδελφὸς⸃ Ἰακώβου καὶ ⸀Ἰωσῆτος καὶ Ἰούδα καὶ Σίμωνος; καὶ οὐκ εἰσὶν αἱ ἀδελφαὶ αὐτοῦ ὧδε πρὸς ἡμᾶς; καὶ ἐσκανδαλίζοντο ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/003.yaml
  text: Is this not the carpenter[b][a], the son of Mary and brother of James and Joses and Judas and Simon? And are not his sisters here with us? And they took offense at him.
translation:
  language: te
  text: “ఇతడు వడ్రంగి కాదా? ఇతడు మరియ కుమారుడు, యాకోబు, యోసే, యూదా, సీమోనుల సహోదరుడు[a] కాదా? ఇతని సహోదరీలు[a] ఇక్కడ మనతోనే లేరా?” వారు ఆయనను బట్టి అభ్యంతరపడ్డారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సహోదరుడు,’ ‘సహోదరీలు’ అనే గ్రీకు పదాలు సాధారణంగా తోబుట్టువులను సూచిస్తాయి; అయితే కొన్ని క్రైస్తవ సంప్రదాయాలు ఇక్కడ వాటిని విస్తృత బంధువులు లేదా సవతి సహోదర సహోదరీలు అని అర్థం చేసుకుంటాయి.
    reason: alternative_reading
  - marker: b
    text: లేదా, “వారు ఆయన విషయమై అభ్యంతరం చెందారు”; అక్షరార్థ భావానికి దగ్గరగా, “ఆయనను బట్టి వారు తొట్రుపడ్డారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκτων
  choice: వడ్రంగి
  rationale: ఈ పదం సాధారణంగా చేతివృత్తి నిపుణుణ్ణి సూచించగలిగినా, ఈ సందర్భంలో సంప్రదాయబద్ధమైన, అత్యంత సంభావ్యమైన భావం ‘వడ్రంగి’; ఆధునిక తెలుగులో ఇది స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: υἱὸς τῆς Μαρίας
  choice: మరియ కుమారుడు
  rationale: గ్రీకులోని గుర్తించదగిన మాతృసంబంధ నిర్దేశాన్ని నేరుగా నిలుపుతుంది; దానిలో అవమానార్థం ఉందో లేదో అనువాదం నిర్ణయించదు.
- source_word: ἀδελφὸς / ἀδελφαὶ
  choice: సహోదరుడు / సహోదరీలు
  rationale: గ్రీకు పదాల సాధారణ అర్థమైన అన్నదమ్ములు/అక్కచెల్లెళ్లు అనే కుటుంబ సంబంధాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, విస్తృత బంధుత్వం లేదా సవతి సంబంధం అనే అవగాహనలను పాదటిప్పణిలో ఉంచుతుంది.
- source_word: Ἰωσῆτος
  choice: యోసే
  rationale: మూలంలోని ప్రత్యేక గ్రీకు నామరూపాన్ని ‘యోసేపు’గా సాధారణీకరించకుండా లిప్యంతరీకరిస్తుంది.
- source_word: ὧδε πρὸς ἡμᾶς
  choice: ఇక్కడ మనతోనే
  rationale: మాట్లాడుతున్న వారితో స్థానిక, సామాజిక సాన్నిహిత్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: ఆయనను బట్టి అభ్యంతరపడ్డారు
  rationale: ఇక్కడ అక్షరార్థమైన తొట్రుపాటు కంటే యేసు విషయంలో వ్యతిరేక భావం కలిగి ఆయనను అంగీకరించకపోవడాన్ని సూచిస్తుంది; ‘అభ్యంతరపడ్డారు’ ఆ ప్రతికూల స్పందనను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యేసు కుటుంబానికి సంబంధించి ‘సహోదరుడు’, ‘సహోదరీలు’ అనే పదాల అర్థం
  choice: ప్రధాన పాఠ్యంలో సాధారణ కుటుంబసంబంధ పదాలను ఉంచి, ఖచ్చితమైన సంబంధాన్ని నిర్ణయించకుండా వదిలివేయడం
  alternative: వీరు విస్తృత బంధువులు, మరియకు పుట్టిన ఇతర పిల్లలు, లేదా సవతి సహోదరులు అని నిర్దిష్టంగా వ్యాఖ్యానించడం
  rationale: ἀδελφός, ἀδελφή పదాలు సాధారణంగా సహోదర సహోదరీలను సూచిస్తాయి; అయితే క్రైస్తవ సంప్రదాయాల్లో సంబంధంపై భిన్న అవగాహనలు ఉన్నాయి. మూలపాఠ్యం పరిష్కరించని సిద్ధాంత వివాదాన్ని అనువాదం పరిష్కరించదు.
- issue: ‘మరియ కుమారుడు’ అనే సంబోధనలోని సామాజిక భావం
  choice: వివరణ జోడించకుండా నేరుగా అనువదించడం
  alternative: దీనిని అవమానకరమైన సంబోధనగా లేదా పూర్తిగా తటస్థమైన గుర్తింపుగా స్పష్టీకరించడం
  rationale: సందర్భంలో దీనికి సామాజిక ముల్లు ఉండవచ్చు, కాని మూలపాఠ్యం దానిని బహిరంగంగా వివరించదు; అందువల్ల అంతర్లీన భావాన్ని పాఠకుని వ్యాఖ్యానానికి వదిలివేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గ్రామస్థుల ఆశ్చర్యం, పరిచయభావం ప్రతిధ్వనించేలా ప్రశ్నలను సహజంగా ఉంచి, కథన ముగింపులో గౌరవప్రదమైన సాధారణ శైలిని పాటించాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
