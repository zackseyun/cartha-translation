  yaml_path: translation/nt/mark/006/044.yaml
  text: And those who ate the loaves were five thousand men[a][b].
translation:
  language: te
  text: ఆ రొట్టెలు[a] తిన్నవారు ఐదువేల మంది పురుషులు[b] ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదానికి సాధారణంగా ‘రొట్టె’ అనే అర్థమూ ఉండవచ్చు; అయితే ఇక్కడ అది ఈ భోజన ఘటనలోని నిర్దిష్ట రొట్టెలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ప్రత్యేకంగా వయోజన మగవారిని సూచించే ‘పురుషులు’ అనే పదం ఉంది; ప్రజలందరినీ సూచించే సాధారణ పదం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν
  choice: ఐదువేల మంది … ఉన్నారు అనే భావాన్ని సహజమైన సంఖ్యా వాక్య నిర్మాణంలో వ్యక్తపరచడం
  rationale: ఇక్కడ εἰμί యొక్క అపూర్ణ భూతకాల రూపం తిన్నవారి సంఖ్యను తెలిపే అనుసంధాన క్రియగా పనిచేస్తుంది. తెలుగులో ప్రత్యేకంగా ‘ఉన్నారు’ అని చేర్చకుండా ‘ఐదువేల మంది పురుషులు’ అని చెప్పడం సహజం; ‘లెక్కించబడ్డారు’ అనే భావం మూలంలో లేదు.
- source_word: οἱ φαγόντες
  choice: తిన్నవారు
  rationale: నిర్దేశకంతో కూడిన భూతకాల కృదంతం, తినడం అనే పూర్తయిన చర్య ద్వారా ఆ సమూహాన్ని గుర్తిస్తుంది. ‘తిన్నవారు’ దీనిని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τοὺς ἄρτους
  choice: ఆ రొట్టెలు
  rationale: ἄρτος అనే పదం ‘రొట్టె’ లేదా ‘రొట్టెలు’ అని అర్థమివ్వగలదు. ఇక్కడ బహువచనం, భోజన ఘటనలో ముందుగా ప్రస్తావించిన నిర్దిష్ట రొట్టెలను సూచిస్తున్నందున ‘ఆ రొట్టెలు’ అని అనువదించబడింది.
- source_word: πεντακισχίλιοι
  choice: ఐదువేల
  rationale: మూలంలోని సంఖ్యను నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἄνδρες
  choice: పురుషులు
  rationale: ἀνήρ ఇక్కడ సాధారణంగా మనుషులందరినీ సూచించే పదం కాదు; ప్రత్యేకంగా మగవారిని, సాధారణంగా వయోజన పురుషులను సూచిస్తుంది. అందువల్ల లింగ నిర్దిష్టతను నిలుపుకోవడానికి ‘పురుషులు’ ఉపయోగించబడింది.
theological_decisions:
- issue: లెక్కలో పేర్కొన్నవారి లింగ నిర్దిష్టత
  choice: ἄνδρες‌ను ప్రధాన పాఠ్యంలో ‘పురుషులు’గా అనువదించడం.
  alternative: ‘ప్రజలు’ లేదా ‘మనుషులు’
  rationale: గ్రీకు మూలం వ్యక్తులకు సాధారణ పదాన్ని కాకుండా ప్రత్యేకంగా పురుషులను సూచించే ἀνήρ పదాన్ని వాడుతుంది. లెక్క మొత్తం ఎవరిని సూచిస్తుందో అనువాదమే విస్తరించి నిర్ణయించకుండా, మూలంలోని నిర్దిష్టతను నిలుపుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘ఆ’ అనే నిర్దేశకం ముందుగా ప్రస్తావించిన రొట్టెలతో అనుసంధానాన్ని సహజంగా చూపుతుంది. ‘మంది’ వ్యక్తుల సంఖ్యకు సాధారణ తెలుగు వర్గసూచకం; ‘పురుషులు’ మూలంలోని లింగ నిర్దిష్టతను కాపాడుతుంది.
