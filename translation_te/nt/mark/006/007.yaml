id: MRK.6.7
reference: Mark 6:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ προσκαλεῖται τοὺς δώδεκα, καὶ ἤρξατο αὐτοὺς ἀποστέλλειν δύο δύο, καὶ ἐδίδου αὐτοῖς ἐξουσίαν τῶν πνευμάτων τῶν ἀκαθάρτων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/007.yaml
  text: And he called the Twelve and began to send them out two by two[c][b][a], and he was giving them authority over the unclean spirits.
translation:
  language: te
  text: ఆయన పన్నెండుమందిని తన దగ్గరికి పిలిచి, వారిని ఇద్దరిద్దరుగా పంపడం మొదలుపెట్టాడు; అపవిత్ర ఆత్మలపై వారికి అధికారం ఇస్తూ ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శక్తి.”
    reason: ἐξουσία అనే పదం సందర్భానుసారం ‘అధికారం’ లేదా ‘శక్తి’ అని అనువదించవచ్చు; ప్రధాన పాఠంలో అప్పగించబడిన అధికార భావానికి ప్రాధాన్యం ఇచ్చాం.
lexical_decisions:
- source_word: προσκαλεῖται
  choice: తన దగ్గరికి పిలిచి
  rationale: మధ్యమ ప్రయోగంలోని ‘తనవద్దకు పిలుచుకోవడం’ అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. మార్కు వాడిన చారిత్రక వర్తమానాన్ని తరువాతి భూతకాల క్రియతో తెలుగులో అసహజంగా కలపకుండా భూతకాల సందర్భానికి అనుగుణంగా అనువదించాం.
- source_word: τοὺς δώδεκα
  choice: పన్నెండుమందిని
  rationale: ఇది యేసు ఏర్పరచిన పన్నెండుమంది శిష్యుల సమూహానికి సందర్భంలో స్థిరమైన గుర్తింపు; మూలంలో లేని ‘శిష్యులు’ అనే పదాన్ని చేర్చలేదు.
- source_word: ἤρξατο ... ἀποστέλλειν
  choice: పంపడం మొదలుపెట్టాడు
  rationale: ἄρχομαι + క్రియార్థక రూపం తెలిపే ఆరంభ భావాన్ని సహజంగా నిలుపుతుంది; సేవకోసం బయటకు పంపడం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: δύο δύο
  choice: ఇద్దరిద్దరుగా
  rationale: గ్రీకు పదపునరుక్తిలోని విభజనార్థాన్ని, అంటే జంటలుగా పంపడాన్ని, సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: ἐδίδου
  choice: ఇస్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న లేదా ఒక్కో జంటను పంపేటప్పుడు పునరావృతమైన చర్య భావాన్ని సాధారణ భూతకాలమైన ‘ఇచ్చాడు’ కంటే స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: ἐξουσίαν
  choice: అధికారం
  rationale: కేవలం సామర్థ్యం లేదా బలం కాకుండా, యేసు వారికి అనుగ్రహించిన కార్యాధికార భావాన్ని నిలుపుతుంది.
- source_word: τῶν πνευμάτων τῶν ἀκαθάρτων
  choice: అపవిత్ర ఆత్మలపై
  rationale: మార్కు ఉపయోగించిన పదజాలాన్ని నేరుగా నిలుపుతూ, దానిని వివరణాత్మకంగా ‘దయ్యాలు’ అని సంకుచితం చేయదు.
theological_decisions:
- issue: అపవిత్ర ఆత్మలకు సంబంధించి పన్నెండుమందికి ఇచ్చిన ἐξουσία స్వభావం
  choice: అపవిత్ర ఆత్మలపై వారికి అధికారం
  alternative: అపవిత్ర ఆత్మలపై వారికి శక్తి
  rationale: ‘అధికారం’ అనేది యేసు అప్పగించిన కార్యాధికారాన్ని తెలియజేస్తుంది; ‘శక్తి’ మాత్రమే అంటే అంతర్లీనంగా ఉన్న బలం అనే భావం కలగవచ్చు. అయితే సందర్భంలో అధికారంతో పాటు దానిని అమలు చేసే శక్తి కూడా సూచితమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇద్దరిద్దరుగా’ మూలంలోని లయను, పంపిణీ భావాన్ని నిలుపుతుంది; ‘ఇస్తూ ఉన్నాడు’ గ్రీకు అసంపూర్ణ భూతకాల చర్యను ప్రతిబింబిస్తుంది.
