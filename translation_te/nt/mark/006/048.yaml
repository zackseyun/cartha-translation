id: MRK.6.48
reference: Mark 6:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀ἰδὼν αὐτοὺς βασανιζομένους ἐν τῷ ἐλαύνειν, ἦν γὰρ ὁ ἄνεμος ἐναντίος ⸀αὐτοῖς, περὶ τετάρτην φυλακὴν τῆς νυκτὸς ἔρχεται πρὸς αὐτοὺς περιπατῶν ἐπὶ τῆς θαλάσσης· καὶ ἤθελεν παρελθεῖν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/048.yaml
  text: And seeing them straining at the oars[a], because the wind was against them, about the fourth watch of the night he comes to them, walking on the sea[d][c][b]; and he intended to pass by them.
translation:
  language: te
  text: గాలి వారికి ఎదురుగా వీస్తుండడంతో, వారు తెడ్లు వేస్తూ ఎంతో కష్టపడుతున్నారని ఆయన చూశాడు. రాత్రి నాలుగవ జాము సమయంలో[a] ఆయన సముద్రం మీద నడుస్తూ[b] వారి దగ్గరకు వచ్చాడు. ఆయన వారిని దాటి వెళ్లాలని ఉద్దేశించాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రాత్రి నాలుగవ జాము’ అనేది రోమా కాలగణన ప్రకారం సుమారు తెల్లవారుజామున 3 గంటల నుంచి 6 గంటల మధ్య సమయం.
    reason: cultural_note
  - marker: b
    text: లేదా ‘నీళ్ల మీద నడుస్తూ.’ గ్రీకులో ‘సముద్రం మీద’ అని ఉంది.
    reason: lexical_alternative
  - marker: c
    text: ‘వారిని దాటి వెళ్లాలని ఉద్దేశించాడు’ అంటే ఆయన వారి పక్కగా ముందుకు వెళ్లాలనుకున్నాడని సాధారణంగా అర్థం కావచ్చు. అయితే దేవుడు తనను వెల్లడించుకుంటూ ‘దాటి వెళ్లే’ పాత నిబంధన సందర్భాలను కూడా ఇది ప్రతిధ్వనింపజేయవచ్చు (ఉదా., నిర్గమకాండం 33:19, 22; 34:6; 1 రాజులు 19:11).
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: చూశాడు
  rationale: గ్రీకు భూతకాల అసమాపక క్రియను తెలుగులో సహజమైన కథన ప్రవాహంతో వ్యక్తం చేస్తుంది; తరువాతి చర్యతో కాలసంబంధం సందర్భంలో స్పష్టంగా ఉంటుంది.
- source_word: βασανιζομένους ἐν τῷ ἐλαύνειν
  choice: తెడ్లు వేయడానికి ఎంతో ప్రయాసపడుతున్నారని
  rationale: βασανίζω యొక్క తీవ్రమైన ఇబ్బంది భావాన్ని ‘ఎంతో ప్రయాసపడుతున్నారు’ అని సహజంగా తెలియజేస్తూ, ἐλαύνειν‌ను సందర్భానుసారంగా తెడ్లు వేయడమని స్పష్టం చేస్తుంది.
- source_word: ἐναντίος αὐτοῖς
  choice: వారికి ఎదురుగా
  rationale: గాలి వారి ప్రయాణ దిశకు విరుద్ధంగా ఉందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: περὶ τετάρτην φυλακὴν τῆς νυκτός
  choice: రాత్రి నాలుగవ జామున
  rationale: పురాతన కాలవిభజనను ప్రధాన పాఠ్యంలో నిలుపుతూ, περὶ సూచించే సుమారు కాలాన్ని తెలుగు ‘జామున’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔρχεται
  choice: వచ్చాడు
  rationale: ఇది మార్కు వాడిన చారిత్రక వర్తమాన కాలం. తెలుగులో ‘వస్తాడు’ అనడం ఈ సందర్భంలో అసహజం కావడంతో సహజ కథన భూతకాలాన్ని వాడాం.
- source_word: περιπατῶν ἐπὶ τῆς θαλάσσης
  choice: సముద్రం మీద నడుస్తూ
  rationale: θάλασσα అనే ‘సముద్రం’ పదాన్ని, ἐπί యొక్క ‘మీద’ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἤθελεν παρελθεῖν αὐτούς
  choice: ఆయన వారిని దాటి వెళ్లాలని ఉద్దేశించాడు
  rationale: ἤθελεν‌ను కేవలం కోరికగా కాక ఉద్దేశంగా తెలుపుతూ, παρελθεῖν యొక్క సాధారణ గమనార్థాన్నీ సంభావ్య దైవప్రత్యక్షత ప్రతిధ్వనినీ ప్రధాన పాఠ్యంలో నిర్ణయించకుండా ఉంచుతుంది.
theological_decisions:
- issue: ‘ఆయన వారిని దాటి వెళ్లాలని ఉద్దేశించాడు’ అనే మాట యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో అక్షరార్థానికి దగ్గరగా, వ్యాఖ్యాన విస్తరణ లేకుండా ఉంచడం
  alternative: ఆయన వారి పక్కగా ముందుకు వెళ్లాలనుకున్నాడు; లేదా పాత నిబంధనలో దేవుడు ‘దాటి వెళ్లి’ తనను వెల్లడించుకునే సందర్భాలకు ఇది సూచన
  rationale: గ్రీకు వాక్యం ఉద్దేశాన్ని మరింత వివరించదు. అందువల్ల సాధారణ గమనార్థం మరియు దైవప్రత్యక్షతకు సంబంధించిన సంభావ్య ప్రతిధ్వని మధ్య ఉన్న వ్యాఖ్యాన ఉద్రిక్తతను పాఠ్యంలో పరిష్కరించకుండా, పాదసూచికలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘సముద్రం,’ ‘నాలుగవ జాము,’ ‘దాటి వెళ్లాలని ఉద్దేశించాడు’ వంటి మూలపాఠ్య లక్షణాలను నిలిపి, అవసరమైన సాంస్కృతిక మరియు వ్యాఖ్యాన సమాచారాన్ని పాదసూచికలకు పరిమితం చేశాం.
