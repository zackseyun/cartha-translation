  edition: SBLGNT
  text: Καὶ ἐξελθόντες ⸀ἐκήρυξαν ἵνα ⸀μετανοῶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/012.yaml
  text: And they went out and proclaimed that people should repent[a].
translation:
  language: te
  text: వారు బయలుదేరి వెళ్లి, ప్రజలు పశ్చాత్తాపపడాలని ప్రకటించారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘వారు పశ్చాత్తాపపడాలని’; ఇక్కడ ‘వారు’ అనేది వారి ప్రకటన విన్నవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: వారు…
  rationale: గ్రీకు సంధాయకమైన Καὶ ఈ వాక్యాన్ని ముందున్న సందర్భంతో కలుపుతుంది. తెలుగులో సహజమైన కథన ప్రవాహం కోసం ప్రత్యేకంగా ‘మరియు’ అనకుండా వాక్యక్రమంలోనే ఆ అనుసంధానాన్ని వ్యక్తం చేశాం.
- source_word: ἐξελθόντες
  choice: బయలుదేరి వెళ్లి
  rationale: ఈ ఏకకాలిక/పూర్వకాలిక కృదంతం శిష్యులు బయటకు వెళ్లిన చర్యను ప్రధాన క్రియతో అనుసంధానిస్తుంది; ‘బయలుదేరి వెళ్లి’ సహజమైన ఆధునిక తెలుగు.
- source_word: ἐκήρυξαν
  choice: ప్రకటించారు
  rationale: κηρύσσω బహిరంగంగా సందేశాన్ని ప్రకటించడాన్ని సూచిస్తుంది. ‘ప్రకటించారు’ దాని బహిరంగ ప్రకటన భావాన్ని నిలుపుతూ, తరువాతి కాలపు సంఘపరమైన అర్థాలను అనవసరంగా చేర్చదు.
- source_word: ἵνα
  choice: అని/ఆలని
  rationale: ఇక్కడ ἵνα ప్రకటనలోని ఉద్దేశించిన స్పందన లేదా విషయాన్ని పరిచయం చేస్తుంది. తెలుగు సమాస క్రియారూపమైన ‘పశ్చాత్తాపపడాలని’ ఈ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: μετανοῶσιν
  choice: పశ్చాత్తాపపడాలని
  rationale: μετανοέω మనస్సు మరియు జీవన దిశ మారి దేవునివైపు తిరగడాన్ని సూచిస్తుంది. ‘పశ్చాత్తాపపడు’ ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, పరిచితంగా, దాని సువార్తాత్మక బరువును నిలుపుతుంది.
theological_decisions:
- issue: μετανοῶσιν క్రియలో అంతర్లీనంగా ఉన్న బహువచన కర్తను స్పష్టపరచాలా?
  choice: ప్రజలు పశ్చాత్తాపపడాలని
  alternative: వారు పశ్చాత్తాపపడాలని
  rationale: గ్రీకులో అంతర్లీన బహువచన కర్త శిష్యులు కాదు, వారి ప్రకటన విన్నవారు. తెలుగులో ‘వారు’ అంటే శిష్యులనే అపార్థం కలగవచ్చు కాబట్టి ‘ప్రజలు’ అని స్పష్టపరిచాం; ఇది సిద్ధాంతపరమైన అదనపు భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ప్రకటించారు’ మరియు ‘పశ్చాత్తాపపడాలని’ పదాలు మూలంలోని బహిరంగ ప్రకటనను, ఆ ప్రకటన కోరిన స్పందనను నిలుపుతున్నాయి.
