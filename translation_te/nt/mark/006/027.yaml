  yaml_path: translation/nt/mark/006/027.yaml
  text: And immediately the king sent an executioner and ordered him to bring his head[a]. And he went and beheaded him in the prison.
translation:
  language: te
  text: వెంటనే రాజు ఒక తలారిని[a] పంపి, యోహాను తలను తీసుకురమ్మని అతనికి ఆజ్ఞాపించాడు. ఆ తలారి వెళ్లి చెరసాలలో యోహాను తల నరికాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అంగరక్షకుణ్ణి’ లేదా ‘కాపలా సైనికుణ్ణి’; పాలకుని అంగరక్షక దళ సభ్యుణ్ణి సూచించే లాటిన్ నుండి వచ్చిన పదాన్ని గ్రీకు ఇక్కడ వాడింది. ఈ సందర్భంలో అతడు తల నరికే శిక్షను అమలుచేస్తున్నాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు వర్ణనలోని తక్షణత్వాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: βασιλεὺς
  choice: రాజు
  rationale: హేరోదు అంతిప చారిత్రకంగా సామంతరాజైనా, మూల గ్రీకు అతణ్ణి βασιλεύς అని పిలుస్తుంది; అందువల్ల కథనంలోని బిరుదును యథాతథంగా నిలుపుతుంది.
- source_word: σπεκουλάτορα
  choice: తలారి
  rationale: ఇది పాలకుని అంగరక్షక దళ సభ్యునికి వాడిన లాటిన్ మూలపదం; ఈ సందర్భంలో అతడు మరణశిక్ష అమలుచేస్తున్నందున ‘తలారి’ పాత్రను స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది. పదం సూచించే విస్తృత అర్థాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: ἐπέταξεν ἐνέγκαι
  choice: తీసుకురమ్మని ఆజ్ఞాపించాడు
  rationale: ఆజ్ఞలోని బలాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉండే పరాధీన వాక్య నిర్మాణం.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: యోహాను తలను
  rationale: గ్రీకులో సర్వనామం ఉన్నప్పటికీ సందర్భంలో అది యోహానును స్పష్టంగా సూచిస్తుంది; తెలుగులో వరుస పురుష సర్వనామాల వల్ల కలిగే అనవసర అయోమయాన్ని నివారించేందుకు పేరును వాడింది.
- source_word: ἀπεκεφάλισεν
  choice: తల నరికాడు
  rationale: శిరచ్ఛేదం చేయడాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా, కథన శైలికి తగినట్లు వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ φυλακῇ
  choice: చెరసాలలో
  rationale: ఇప్పటికే కథలో స్థాపితమైన నిర్బంధ స్థలాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో సూచిస్తుంది.
