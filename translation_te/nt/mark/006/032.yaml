  text: And they went away in the boat to a desolate place by themselves[a][b].
translation:
  language: te
  text: వారు పడవలో ఒక నిర్జనమైన ప్రదేశానికి వెళ్లారు[a], ఏకాంతంగా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘జనసంచారం లేని ప్రదేశానికి’ లేదా ‘అరణ్య ప్రదేశానికి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఇతరులకు వేరుగా’ లేదా ‘వ్యక్తిగతంగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: అప్పుడు
  rationale: ఇది కథన కొనసాగింపును సూచిస్తుంది. తెలుగులో ‘అప్పుడు’ సహజంగా ఉండి, సందర్భంలోని వరుస చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀπῆλθον
  choice: వెళ్లారు
  rationale: ἀπέρχομαι యొక్క భూతకాల రూపం మునుపటి స్థలం నుండి వెళ్లడాన్ని సూచిస్తుంది; ‘వెళ్లారు’ ఆధునిక తెలుగులో సహజమైన, అనవసరంగా గంభీరత లేని ఎంపిక.
- source_word: ἐν τῷ πλοίῳ
  choice: పడవలో
  rationale: గ్రీకు పదబంధంలోని ‘పడవలో’ అనే స్థానార్థాన్ని నేరుగా నిలుపుతుంది; ‘ఓడలో’ కంటే గలిలయ సందర్భానికి ‘పడవలో’ సరిపోతుంది.
- source_word: εἰς ἔρημον τόπον
  choice: ఏకాంత ప్రదేశానికి
  rationale: ἔρημος ఇక్కడ జనసంచారం లేని, ఒంటరైన ప్రదేశాన్ని సూచిస్తుంది. ‘ఏకాంత ప్రదేశం’ తెలుగులో సహజంగా ఉండి, తప్పనిసరిగా ఎడారి అనే భౌగోళిక భావాన్ని రుద్దదు.
- source_word: κατ’ ἰδίαν
  choice: తమంతట తామే
  rationale: ఈ నుడికారం ఇతరులకు వేరుగా, తమలో తాము ఉండడాన్ని సూచిస్తుంది; బహువచన కర్తకు ‘తమంతట తామే’ సహజంగా సరిపోతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని సరళమైన కథన ప్రవాహాన్ని నిలుపుతూ, ἔρημος అనే పదాన్ని భౌగోళిక ‘ఎడారి’గా అతిగా నిర్దిష్టం చేయకుండా అనువదించబడింది.
