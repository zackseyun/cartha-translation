revisions:
- from: అప్పుడు వారు పడవలో ఏకాంత ప్రదేశానికి తమంతట తామే వెళ్లారు[a][b].
  to: వారు పడవలో ఒక నిర్జనమైన ప్రదేశానికి వెళ్లారు[a], ఏకాంతంగా[b].
  rationale: The revision renders καί with an unmarked Telugu narrative continuation, retains the literal sense of travel ‘in the boat,’ and replaces the potentially misleading idiom «తమంతట తామే» with «ఏకాంతంగా», which conveys going apart from others. Footnote anchors are placed immediately after the phrases they explain.
