source:
  edition: SBLGNT
  text: καὶ εἶδον αὐτοὺς ὑπάγοντας καὶ ⸀ἐπέγνωσαν πολλοί, καὶ πεζῇ ἀπὸ πασῶν τῶν πόλεων συνέδραμον ἐκεῖ καὶ προῆλθον ⸀αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/033.yaml
  text: And many saw them going and recognized them[b][a], and on foot from all the towns they ran there together and got there ahead of them.
translation:
  language: te
  text: వారు వెళ్తుండగా చాలామంది వారిని చూసి గుర్తుపట్టారు. అప్పుడు వారు అన్ని పట్టణాల నుండి కాలినడకన అక్కడికి కలిసి పరుగెత్తి, వారికంటే ముందుగానే చేరుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో, “ఆయన దగ్గరకు సమకూడారు” అనే అదనపు మాటలు ఉన్నాయి.
    reason: textual_variant
lexical_decisions:
- source_word: εἶδον
  choice: చూసి
  rationale: సందర్భంలోని వరుస చర్యలను సహజమైన తెలుగులో తెలియజేస్తూ, సాధారణ దృశ్యగ్రహణ భావాన్ని నిలుపుతుంది.
- source_word: ὑπάγοντας
  choice: వారు వెళ్లడం
  rationale: మునుపటి వచనంలో తెలిపిన పడవ ప్రయాణాన్ని అనవసరంగా మళ్లీ చేర్చకుండా, ప్రయాణిస్తున్న చర్యను సూటిగా వ్యక్తం చేస్తుంది.
- source_word: ἐπέγνωσαν
  choice: వారిని గుర్తుపట్టారు
  rationale: ఇక్కడ విస్తృతమైన జ్ఞానప్రాప్తి కాకుండా, వెళ్లేవారు ఎవరో గుర్తించడం అనే సందర్భోచిత భావాన్ని ఇస్తుంది.
- source_word: πολλοί
  choice: చాలామంది
  rationale: నామవాచకంగా వాడిన విశేషణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πεζῇ
  choice: కాలినడకన
  rationale: పడవ ప్రయాణానికి వ్యతిరేకంగా భూమిమీద నడిచి లేదా పరుగెత్తి వెళ్లిన భావాన్ని సంక్షిప్తంగా, స్పష్టంగా ఇస్తుంది.
- source_word: ἀπὸ πασῶν τῶν πόλεων
  choice: అన్ని పట్టణాల నుండి
  rationale: పాసోన్ అనే సమగ్ర భావాన్ని నిలుపుతూ, గలిలయ సందర్భంలో πόλις కు సహజమైన విస్తృత తెలుగు పదంగా 'పట్టణాలు'ను ఉపయోగిస్తుంది.
- source_word: συνέδραμον
  choice: కలిసి పరుగెత్తి
  rationale: συντρέχω లోని పరుగెత్తడం మరియు పలుచోట్లనుంచి ఒకచోటికి చేరే సమూహ భావం రెండింటినీ నిలుపుతుంది.
- source_word: ἐκεῖ
  choice: అక్కడికి
  rationale: గమ్యస్థానాన్ని సూచించే దిశార్థక తెలుగుతో మూలంలోని స్థల సూచనను సహజంగా అందిస్తుంది.
- source_word: προῆλθον αὐτούς
  choice: వారి కంటే ముందే చేరుకున్నారు
  rationale: వారిని దాటి వెళ్లడం అనే అస్పష్ట భావం కాకుండా, గమ్యానికి వారి కంటే ముందుగా చేరిన సందర్భోచిత తులనార్థాన్ని స్పష్టం చేస్తుంది.
