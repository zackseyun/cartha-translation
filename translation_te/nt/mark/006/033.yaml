translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. గ్రీకు వాక్యంలోని వరుస కై సంధులను తెలుగులో సహజమైన వాక్యప్రవాహంగా మలిచాం. 'కాలినడకన' అనేది పడవ ప్రయాణంతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
