  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ὁ Ἰωάννης τῷ Ἡρῴδῃ ὅτι Οὐκ ἔξεστίν σοι ἔχειν τὴν γυναῖκα τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/018.yaml
  text: For John had been saying to Herod[a], “It is not lawful for you to have your brother’s wife.”
translation:
  language: te
  text: ఎందుకంటే యోహాను హేరోదుతో, “నీ సోదరుని భార్యను నీ భార్యగా ఉంచుకోవడం నీకు ధర్మసమ్మతం కాదు[a]” అని చెబుతుండేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ సోదరుని భార్యను నీ భార్యగా ఉంచుకోవడానికి నీకు అనుమతి లేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: చెబుతూ ఉండేవాడు
  rationale: అసంపూర్ణ భూతకాల రూపం గతంలో కొనసాగిన లేదా పదేపదే జరిగిన మాటను సూచిస్తుంది; తెలుగు సహజ ప్రయోగంలో ఈ భావాన్ని నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి సందర్భానికి కారణం లేదా వివరణను తెలిపే అనుసంధానాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: Ἡρῴδῃ
  choice: హేరోదుతో
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చి, దత్తివాచకాన్ని సహజంగా ‘తో’తో వ్యక్తం చేసింది.
- source_word: Οὐκ ἔξεστίν σοι
  choice: నీకు ధర్మసమ్మతం కాదు
  rationale: అనుమతి మరియు ధర్మశాస్త్ర సంబంధమైన న్యాయబద్ధత రెండింటినీ సూచించే గ్రీకు భావాన్ని, ఈ నైతిక-చట్టపరమైన సందర్భంలో సహజంగా నిలుపుతుంది.
- source_word: ἔχειν
  choice: ఉంచుకోవడం
  rationale: మూలంలోని ‘కలిగి ఉండడం’ అనే భావాన్ని వైవాహిక సంబంధ సందర్భంలో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; కొత్తగా తీసుకోవడం అనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: γυναῖκα
  choice: భార్యను
  rationale: γυνή అనే పదానికి ‘స్త్రీ’ లేదా ‘భార్య’ అనే అర్థాలు ఉన్నా, ‘నీ సోదరుని’ అనే సంబంధవాచక పదబంధం ఇక్కడ భార్య అనే అర్థాన్ని నిర్ధారిస్తుంది.
- source_word: τοῦ ἀδελφοῦ σου
  choice: నీ సోదరుని
  rationale: కేంద్ర కుటుంబ సంబంధాన్ని సహజమైన తెలుగు సంబంధవాచక నిర్మాణంలో నిలుపుతుంది.
theological_decisions:
- issue: యోహాను చేసిన గద్దింపు స్వభావం
  choice: ‘నీకు ధర్మసమ్మతం కాదు’ అనే నైతిక-చట్టపరమైన నిషేధంగా అనువదించడం
  alternative: ‘నీకు అనుమతి లేదు’ లేదా ‘ఇది నీకు సరైనది కాదు’
  rationale: ἔξεστιν అనుమతించబడినది లేదా చట్టబద్ధమైనది అనే భావాన్ని కలిగి ఉంది. లేవీయకాండంలోని నిషేధాల నేపథ్యం ఉండవచ్చుగానీ, వచనంలో లేని ప్రత్యక్ష ధర్మశాస్త్ర ఉల్లేఖనాన్ని చేర్చకుండా దాని న్యాయ-నైతిక బలాన్ని నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘చెబుతూ ఉండేవాడు’ ద్వారా కొనసాగిన లేదా పునరావృతమైన చర్యను, ‘ధర్మసమ్మతం కాదు’ ద్వారా ప్రవచనాత్మక గద్దింపులోని నైతిక-చట్టపరమైన బలాన్ని కాపాడింది.
