revisions:
- from: ఎందుకంటే యోహాను హేరోదుతో, “నీ సోదరుని భార్యను ఉంచుకోవడం నీకు ధర్మసమ్మతం కాదు[a]” అని చెబుతూ ఉండేవాడు.
  to: ఎందుకంటే యోహాను హేరోదుతో, “నీ సోదరుని భార్యను నీ భార్యగా ఉంచుకోవడం నీకు ధర్మసమ్మతం కాదు[a]” అని చెబుతుండేవాడు.
  rationale: The revision keeps the explanatory γάρ, the imperfect ongoing/repeated action, and the legal-moral prohibition intact. It improves modern Telugu flow and clarifies that the prohibited “having” is having one’s brother’s wife as one’s own wife, without adding a specific legal rationale absent from the verse.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:01:35Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents γάρ as an explanatory connector, preserves the imperfect/durative sense of ἔλεγεν, addresses Herod directly, and renders οὐκ ἔξεστίν σοι with appropriate legal-moral force. γυναῖκα is correctly understood as “wife.”
  naturalness: ‘చెబుతూ ఉండేవాడు’ is understandable but ‘చెబుతుండేవాడు’ is smoother modern standard Telugu. Adding ‘నీ భార్యగా’ makes the marital force of ἔχειν explicit in Telugu and avoids an unduly broad sense of merely keeping or retaining someone.
  terminology: ‘ధర్మసమ్మతం కాదు’ suitably conveys the juridical and moral force of ἔξεστιν without asserting an explicit legal citation. ‘సోదరుడు,’ ‘భార్య,’ ‘యోహాను,’ and ‘హేరోదు’ are appropriate modern Telugu biblical terms and forms.
  issues:
  - severity: low
    issue: The phrase ‘నీ సోదరుని భార్యను ఉంచుకోవడం’ can sound like simply keeping or retaining her.
    rationale: In this context ἔχειν denotes having her as wife. ‘నీ భార్యగా ఉంచుకోవడం’ retains the source’s “have” sense while making the marital relationship clear in idiomatic Telugu.
  - severity: low
    issue: ‘చెబుతూ ఉండేవాడు’ is slightly less idiomatic than a finite progressive imperfect form.
    rationale: ‘చెబుతుండేవాడు’ naturally conveys John’s ongoing or repeated speech represented by the Greek imperfect ἔλεγεν.
  revised_text: ఎందుకంటే యోహాను హేరోదుతో, “నీ సోదరుని భార్యను నీ భార్యగా ఉంచుకోవడం నీకు ధర్మసమ్మతం కాదు[a]” అని చెబుతుండేవాడు.
