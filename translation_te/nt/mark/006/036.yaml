  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘పంపివేయండి’ సాధారణ పాఠకులకు స్పష్టంగా ఉంది; పాదటిప్పణి ἀπόλυσον మరియు ἵνα నిర్మాణానికి మరింత రూపానుగత ప్రత్యామ్నాయాన్ని ఇస్తుంది.
