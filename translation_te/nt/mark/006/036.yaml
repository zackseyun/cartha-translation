id: MRK.6.36
reference: Mark 6:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπόλυσον αὐτούς, ἵνα ἀπελθόντες εἰς τοὺς κύκλῳ ἀγροὺς καὶ κώμας ἀγοράσωσιν ἑαυτοῖς ⸂τί φάγωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/036.yaml
  text: Send them away[a], so that they may go into the surrounding countryside and villages and buy themselves something to eat.
translation:
  language: te
  text: వారు చుట్టుపక్కల ఉన్న పొలాలకు, గ్రామాలకు వెళ్లి తమ కోసం తినడానికి ఏమైనా కొనుక్కునేలా వారిని పంపివేయండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόλυσον
  choice: పంపివేయండి
  rationale: ఇక్కడ ἀπολύω జనసమూహాన్ని అక్కడి నుంచి వెళ్లనివ్వడం లేదా పంపివేయడం అనే అర్థంలో ఉంది. ‘పంపివేయండి’ ఆ ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἵνα
  choice: అప్పుడు
  rationale: ఈ సందర్భంలో ἵνα సూచించే ఉద్దేశం/ఫలిత సంబంధాన్ని తెలుగులో సహజమైన వాక్యసంబంధంగా ‘అప్పుడు’ తెలియజేస్తుంది; మరింత రూపానుగతంగా ‘వారు ... కొనుక్కునేలా’ అని కూడా అనువదించవచ్చు.
- source_word: ἀπελθόντες
  choice: వెళ్లి
  rationale: అయోరిస్ట్ పార్టిసిపుల్ ప్రధాన క్రియకు ముందు జరిగే చర్యను సూచిస్తుంది. తెలుగు క్రమార్థక అసమాపక క్రియ ‘వెళ్లి’ ఈ వరుసను సహజంగా నిలుపుతుంది.
- source_word: τοὺς κύκλῳ ἀγροὺς καὶ κώμας
  choice: చుట్టుపక్కల ఉన్న పొలాల్లోకి, గ్రామాల్లోకి
  rationale: κύκλῳ అంటే ‘చుట్టూ/చుట్టుపక్కల’; ἀγροί పొలాలు, వ్యవసాయ ప్రాంతాలు లేదా పల్లెప్రాంతాలను సూచించవచ్చు; κῶμαι గ్రామాలు. మూలంలోని రెండు భిన్న ప్రదేశపదాలను ఈ రూపం నిలుపుతుంది.
- source_word: ἀγοράσωσιν
  choice: కొనుక్కుంటారు
  rationale: ἀγοράζω యొక్క సాధారణ అర్థం ధర చెల్లించి కొనడం. ‘కొనుక్కోవడం’ ἑαυτοῖς లోని తమ ప్రయోజనార్థక భావాన్ని కూడా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἑαυτοῖς
  choice: తమ కోసం ... కొనుక్కుంటారు
  rationale: రిఫ్లెక్సివ్ డేటివ్ వారు తమ అవసరానికే కొనుగోలు చేస్తారని సూచిస్తుంది. ‘తమ కోసం’ ఆ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τί φάγωσιν
  choice: తినడానికి ఏమైనా
  rationale: ఇక్కడ τί అనిర్దిష్టంగా తినదగిన దేనినైనా సూచిస్తుంది. ‘తినడానికి ఏమైనా’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని అనిర్దిష్టతను కాపాడుతుంది.
