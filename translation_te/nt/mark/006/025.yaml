id: MRK.6.25
reference: Mark 6:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσα ⸀εὐθὺς μετὰ σπουδῆς πρὸς τὸν βασιλέα ᾐτήσατο λέγουσα· Θέλω ἵνα ⸂ἐξαυτῆς δῷς μοι⸃ ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/025.yaml
  text: And she immediately went in with haste to the king and asked[a], saying, “I want you to give me at once, on a platter, the head of John the Baptizer.”
translation:
  language: te
  text: వెంటనే ఆమె తొందరగా రాజు సమక్షంలోకి ప్రవేశించి, “మీరు ఇప్పుడే ఒక పళ్లెంలో బాప్తిస్మమిచ్చే యోహాను తలను నాకు ఇవ్వాలని నేను కోరుకుంటున్నాను” అని అడిగింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: దగ్గరికి వెళ్లి
  rationale: ఆమె విందు జరిగే చోటికి లేదా రాజు సమక్షంలోకి ప్రవేశించిన కదలికను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు కథనంలోని తక్షణతను నిలుపుతుంది.
- source_word: μετὰ σπουδῆς
  choice: త్వరత్వరగా
  rationale: సానుకూల ఉత్సాహాన్ని అనవసరంగా సూచించకుండా, తొందరతో చేసిన కదలికను తెలుపుతుంది.
- source_word: βασιλέα
  choice: రాజు
  rationale: హేరోదు చారిత్రకంగా చతుర్థాధిపతి అయినప్పటికీ, మూలపాఠంలోని βασιλεύς అనే పదాన్నే అనుసరిస్తుంది.
- source_word: ᾐτήσατο
  choice: అడిగింది
  rationale: αἰτέω ఇక్కడ అభ్యర్థన చేయడాన్ని సూచిస్తుంది; మాటలలోని తీవ్రతను ఉల్లేఖనమే తెలియజేస్తుంది.
- source_word: Θέλω
  choice: కోరుకుంటున్నాను
  rationale: తెలుగులో సహజంగా సంకల్పం లేదా బలమైన కోరికను వ్యక్తం చేస్తుంది.
- source_word: ἵνα ... δῷς μοι
  choice: నాకు ఇవ్వాలని
  rationale: ఆమె కోరుకున్న విషయాన్ని తెలిపే ἵνα ఉపవాక్యాన్ని సహజమైన తెలుగు నిర్మాణంలో అందిస్తుంది.
- source_word: ἐξαυτῆς
  choice: ఇప్పుడే
  rationale: మొదటి εὐθύς నుండి వేరుగా, ఆమె డిమాండులోని తక్షణతను నిలుపుతుంది.
- source_word: ἐπὶ πίνακι
  choice: ఒక పళ్లెంలో పెట్టి
  rationale: విందు సందర్భంలోని వడ్డించే పెద్ద పాత్ర భావాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: κεφαλὴν
  choice: తలను
  rationale: కథనంలోని భయానకమైన నిర్దిష్టతను మృదువుచేయకుండా నేరుగా అనువదిస్తుంది.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: బాప్తిస్మమిచ్చే యోహాను
  rationale: βαπτιστής అనే వృత్తి/కార్య వివరణాత్మక బిరుదును తెలుగులో అర్థవంతంగా అనువదిస్తుంది.
theological_decisions:
- issue: Ἰωάννου τοῦ βαπτιστοῦ అనువాదం
  choice: బాప్తిస్మమిచ్చే యోహాను
  alternative: బాప్తిస్మదాత యోహాను
  rationale: గ్రీకు బిరుదులోని కార్యవివరణను స్పష్టంగా ఉంచుతూ, సంప్రదాయ రూపాన్ని మాత్రమే ఆధారపడకుండా సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సహజమైన శైలి. εὐθύς మరియు ἐξαυτῆς రెండింటి వేర్వేరు తక్షణతలను వరుసగా ‘వెంటనే’, ‘ఇప్పుడే’గా నిలిపింది.
