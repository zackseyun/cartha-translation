revisions:
- from: వెంటనే ఆమె త్వరత్వరగా రాజు దగ్గరికి వెళ్లి, “బాప్తిస్మమిచ్చే యోహాను తలను ఇప్పుడే ఒక పళ్లెంలో పెట్టి నాకు ఇవ్వాలని కోరుకుంటున్నాను” అని అడిగింది.
  to: వెంటనే ఆమె తొందరగా రాజు సమక్షంలోకి ప్రవేశించి, “మీరు ఇప్పుడే ఒక పళ్లెంలో బాప్తిస్మమిచ్చే యోహాను తలను నాకు ఇవ్వాలని నేను కోరుకుంటున్నాను” అని అడిగింది.
  rationale: The revision restores the entry sense of εἰσελθοῦσα and renders ἐπὶ πίνακι without adding a separate placing action. It retains the source’s twofold urgency, direct volitional request, ‘king,’ literal ‘head,’ and descriptive rendering of John’s title.
