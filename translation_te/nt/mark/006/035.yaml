id: MRK.6.35
reference: Mark 6:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἤδη ὥρας πολλῆς γενομένης προσελθόντες αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ἔλεγον ὅτι Ἔρημός ἐστιν ὁ τόπος, καὶ ἤδη ὥρα πολλή·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/035.yaml
  text: And when it was already very late[a], his disciples came to him and were saying, “This place is deserted[b], and it is already very late.”
translation:
  language: te
  text: అప్పటికే బాగా ఆలస్యమైనప్పుడు[a], ఆయన శిష్యులు ఆయన దగ్గరికి వచ్చి, “ఈ ప్రదేశం నిర్జనంగా ఉంది[b], ఇప్పటికే బాగా ఆలస్యమైంది” అని ఇలా అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అప్పటికే ఎంతో ఆలస్యమైన సమయం వచ్చినప్పుడు.”
    reason: గ్రీకు కాలప్రయోగంలోని రూపాన్ని చూపించే అక్షరార్థ ప్రత్యామ్నాయం.
  - marker: b
    text: లేదా, “ఇది జనసంచారం లేని ప్రదేశం.”
    reason: ἔρημος అనే పదానికి సందర్భోచితమైన వివరణాత్మక ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: ἤδη
  choice: అప్పటికే / ఇప్పటికే
  rationale: కాలం ముందుకు సాగిపోయిందనే భావాన్ని రెండు సందర్భాల్లోనూ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తాయి; వాక్యస్థితికి అనుగుణంగా రూపభేదం వాడబడింది.
- source_word: ὥρας πολλῆς γενομένης
  choice: అప్పటికే చాలా పొద్దుపోయినప్పుడు
  rationale: ఈ genitive absolute ప్రయోగం రోజులో చాలా ఆలస్యమైన సమయం వచ్చిందని సూచిస్తుంది. తెలుగు కథనశైలిలో ‘చాలా పొద్దుపోయినప్పుడు’ సహజంగా ఉండి, πολλῆς ఇచ్చే తీవ్రతను నిలుపుతుంది.
- source_word: προσελθόντες αὐτῷ
  choice: ఆయన దగ్గరికి వచ్చి
  rationale: προσέρχομαι సూచించే దగ్గరకు రావడం లేదా సమీపించడం అనే భావాన్ని సహజమైన తెలుగులో ఇస్తుంది.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ఆయన శిష్యులు
  rationale: గ్రీకు స్వామ్యసంబంధాన్ని స్పష్టమైన, సహజమైన తెలుగు పదక్రమంలో వ్యక్తం చేస్తుంది.
- source_word: ἔλεγον
  choice: చెబుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న మాటల క్రియను నిలుపుతుంది; పునరావృతమైందని అవసరానికి మించి నిర్ధారించదు.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: ఇది నిర్జన ప్రదేశం
  rationale: ἔρημος ఇక్కడ జనావాసం లేని లేదా ఏకాంతమైన ప్రదేశాన్ని సూచిస్తుంది. ‘నిర్జన ప్రదేశం’ సంక్షిప్తంగా, గౌరవప్రదంగా, స్పష్టంగా ఉంది.
- source_word: καὶ ἤδη ὥρα πολλή
  choice: ఇప్పటికే చాలా పొద్దుపోయింది
  rationale: రోజులో సమయం బాగా మించిపోయిందనే శిష్యుల మాటను సహజమైన తెలుగులో తెలియజేస్తూ πολλή యొక్క ఉద్ఘాటనను కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలి వాడబడింది. ‘పొద్దుపోయింది’ రోజులో ఆలస్యమైన సమయాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; ‘నిర్జన ప్రదేశం’ మూలంలోని జనావాసరాహిత్య భావాన్ని భావోద్వేగపూరితమైన ‘విషాదకరమైన’ అర్థం చొప్పించకుండా నిలుపుతుంది. ఆంగ్ల సంప్రదింపు పాఠంలో పాదసూచికల విషయాలు వాటి గుర్తులకు తారుమారుగా కనిపించినందున, మూలభాషకు అనుగుణంగా [a]ను కాలప్రయోగానికి, [b]ను ప్రదేశవర్ణనకు జోడించాం.
