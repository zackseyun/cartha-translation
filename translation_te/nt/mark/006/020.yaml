id: MRK.6.20
reference: Mark 6:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ γὰρ Ἡρῴδης ἐφοβεῖτο τὸν Ἰωάννην, εἰδὼς αὐτὸν ἄνδρα δίκαιον καὶ ἅγιον, καὶ συνετήρει αὐτόν, καὶ ἀκούσας αὐτοῦ πολλὰ ⸀ἠπόρει, καὶ ἡδέως αὐτοῦ ἤκουεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/020.yaml
  text: For Herod feared John[a], knowing that he was a righteous and holy man, and he kept him safe. And when he heard him, he was greatly perplexed, and yet he listened to him gladly.
translation:
  language: te
  text: ఎందుకంటే హేరోదు యోహానుకు భయపడేవాడు. యోహాను నీతిమంతుడు, పరిశుద్ధుడు అని అతనికి తెలుసు కాబట్టి అతణ్ణి కాపాడేవాడు. యోహాను మాటలు విన్నప్పుడు అతడు ఎంతో అయోమయానికి గురయ్యేవాడు[a]; అయినా అతని మాటలను సంతోషంగా వినేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో “ఎంతో అయోమయానికి గురయ్యేవాడు” అనే మాటలకు బదులు “అనేక పనులు చేసేవాడు” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ἐφοβεῖτο
  choice: భయపడేవాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ హేరోదుకు యోహాను పట్ల కొనసాగిన భయాన్ని సూచిస్తుంది. ‘గౌరవించేవాడు’ అని మృదువుగా మార్చకుండా మూలపదపు ప్రత్యక్ష భావాన్ని నిలుపుతుంది; సందర్భం ఆ భయంలో యోహాను స్వభావం పట్ల గౌరవం కూడా ఉందని చూపిస్తుంది.
- source_word: εἰδὼς αὐτὸν ἄνδρα δίκαιον καὶ ἅγιον
  choice: యోహాను నీతిమంతుడు, పరిశుద్ధుడు అని అతనికి తెలుసు కాబట్టి
  rationale: కృదంతంలోని జ్ఞానం కారణార్థకంగా పనిచేస్తోంది. ‘నీతిమంతుడు’ నైతిక యథార్థతను, ‘పరిశుద్ధుడు’ దేవునికి ప్రత్యేకమైన పవిత్ర స్వభావాన్ని సహజమైన తెలుగు పదాలతో తెలియజేస్తాయి.
- source_word: συνετήρει αὐτόν
  choice: అతణ్ణి కాపాడేవాడు
  rationale: సందర్భంలో హేరోదు యోహానును హాని నుండి రక్షించాడనే భావం ప్రధానంగా ఉంది. ‘ఉంచేవాడు’ కంటే ‘కాపాడేవాడు’ ఈ రక్షణార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἀκούσας αὐτοῦ
  choice: యోహాను మాటలు విన్నప్పుడు
  rationale: వ్యక్తిని వినడాన్ని సూచించే గ్రీకు ప్రయోగాన్ని సహజ తెలుగులో స్పష్టం చేయడానికి ‘మాటలు’ చేర్చబడింది; కాలసంబంధ భావం ‘విన్నప్పుడు’ ద్వారా నిలిచింది.
- source_word: πολλὰ ἠπόρει
  choice: ఎంతో అయోమయానికి గురయ్యేవాడు
  rationale: ἠπόρει అనేది ఏమి చేయాలో లేదా ఎలా స్పందించాలో తోచని కలవరాన్ని సూచిస్తుంది; πολλὰ దానిని బలపరుస్తుంది. ఈ అనువాదం హేరోదు అంతర్గత సంఘర్షణను అనవసరంగా పరిష్కరించకుండా ఉంచుతుంది.
- source_word: ἡδέως αὐτοῦ ἤκουεν
  choice: అయినా అతని మాటలను సంతోషంగా వినేవాడు
  rationale: ἡδέωςలోని ఇష్టపూర్వకమైన ఆనందభావాన్ని ‘సంతోషంగా’ అందిస్తుంది. ముందు ఉన్న అయోమయంతో గల భావవ్యతిరేకతను సహజ తెలుగులో ‘అయినా’ వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యోహాను మాటలు విన్న తరువాత హేరోదు స్పందనకు సంబంధించిన పాఠాంతరం
  choice: SBLGNT పాఠమైన ἠπόρει ప్రకారం ‘ఎంతో అయోమయానికి గురయ్యేవాడు’
  alternative: ἐποίει ప్రకారం ‘అనేక పనులు చేసేవాడు’
  rationale: ప్రామాణిక మూలపాఠం ἠπόρειని అనుసరించడం హేరోదు అయోమయపడుతూనే యోహానును సంతోషంగా వినేవాడనే ఉత్కంఠను నిలుపుతుంది. అర్థాన్ని గణనీయంగా మార్చే మరో పురాతన పాఠాన్ని పాదసూచికలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్యానికి తగిన గంభీరతను నిలుపుతూ అనువదించబడింది. పునరుక్త సర్వనామాల వల్ల కలిగే అస్పష్టతను తగ్గించడానికి అవసరమైన చోట ‘యోహాను’ అనే పేరును మళ్లీ వాడాం.
