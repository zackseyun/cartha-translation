id: MRK.6.14
reference: Mark 6:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἤκουσεν ὁ βασιλεὺς Ἡρῴδης, φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ, καὶ ⸀ἔλεγον ὅτι Ἰωάννης ὁ βαπτίζων ⸂ἐγήγερται ἐκ νεκρῶν⸃, καὶ διὰ τοῦτο ἐνεργοῦσιν αἱ δυνάμεις ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/014.yaml
  text: And King Herod heard of it[a], for his name had become well known, and people were saying, “John the Baptizer has been raised from the dead[c][b], and because of this these powers are at work in him.”
translation:
  language: te
  text: హేరోదు రాజు దీని గురించి విన్నాడు. ఎందుకంటే యేసు పేరు ప్రసిద్ధమైంది. ప్రజలు, “బాప్తిస్మం ఇచ్చే యోహాను మృతులలో నుండి లేపబడ్డాడు[a]. అందుకే ఈ శక్తులు[b] అతనిలో పనిచేస్తున్నాయి” అని చెప్పేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “మృతులలో నుండి లేచాడు.” గ్రీకు క్రియ కర్మణి రూపంలో ఉంది: “లేపబడ్డాడు.”'
    reason: alternative_reading
  - marker: b
    text: లేదా, “ఈ అద్భుత శక్తులు” లేదా “ఈ మహత్కార్యాలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: హేరోదు రాజు
  rationale: తెలుగులో వ్యక్తిపేరు తరువాత ‘రాజు’ ఉంచడం సహజంగా ఉండి, βασιλεύς అనే బిరుదును స్పష్టంగా నిలుపుతుంది.
- source_word: ἤκουσεν
  choice: దీని గురించి విన్నాడు
  rationale: గ్రీకులో కర్మ ప్రత్యక్షంగా లేకపోయినా, ముందటి సందర్భంలోని యేసు కార్యాలు మరియు ఖ్యాతిని సూచిస్తుంది; ‘దీని గురించి’ అనేది కొత్త సమాచారాన్ని చేర్చకుండా తెలుగులో సహజతనిస్తుంది.
- source_word: φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ
  choice: ఎందుకంటే యేసు పేరు ప్రసిద్ధమైంది
  rationale: పదశః ఉన్న ‘ఆయన పేరు’ తెలుగులో వెంటనే ముందున్న హేరోదును సూచించినట్లు అపార్థం కలిగించవచ్చు. సందర్భంలోని సూచిత వ్యక్తి యేసు అని స్పష్టం చేస్తూ, ‘పేరు’ అనే గ్రీకు రూపకాన్ని నిలిపింది.
- source_word: ἔλεγον
  choice: ప్రజలు … అని చెప్పుకుంటున్నారు
  rationale: బహువచన క్రియకు నిర్దిష్ట కర్త లేదు. ‘ప్రజలు’ ఆ అనిర్దిష్ట బహువచనాన్ని సహజంగా తెలియజేస్తుంది; అసంపూర్ణ కాలంలోని కొనసాగుతున్న ప్రచార భావాన్ని ‘చెప్పుకుంటున్నారు’ అందిస్తుంది.
- source_word: Ἰωάννης ὁ βαπτίζων
  choice: బాప్తిస్మం ఇచ్చే యోహాను
  rationale: వర్తమాన కృదంతంలోని క్రియాత్మక భావాన్ని ‘ఇచ్చే’ అని పారదర్శకంగా నిలుపుతూ, ఆధునిక పాఠకులకు సహజంగా ఉంటుంది.
- source_word: ἐγήγερται ἐκ νεκρῶν
  choice: మృతులలో నుండి లేపబడ్డాడు
  rationale: ἐγείρω యొక్క పూర్ణ వర్తమాన కర్మణి రూపాన్ని ‘లేపబడ్డాడు’ అని నిలుపుతుంది; ‘మృతులలో నుండి’ ἐκ νεκρῶν యొక్క బహువచన రూపాన్ని ప్రతిబింబిస్తుంది.
- source_word: διὰ τοῦτο
  choice: అందుకే
  rationale: ముందటి వాదనను తరువాతి ఫలితంతో కలిపే కారణార్థాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐνεργοῦσιν αἱ δυνάμεις
  choice: ఈ శక్తులు … పనిచేస్తున్నాయి
  rationale: δυνάμειςను ముందుగానే కేవలం అద్భుత కార్యాలుగా పరిమితం చేయకుండా ‘శక్తులు’గా ఉంచి, ἐνεργοῦσιν యొక్క కొనసాగుతున్న కార్యశీలతను ‘పనిచేస్తున్నాయి’గా వ్యక్తం చేసింది.
- source_word: ἐν αὐτῷ
  choice: ఆయనలో
  rationale: ἐν యొక్క ప్రత్యక్ష స్థానార్థమైన ‘లో’ను నిలుపుతుంది; ‘ఆయన ద్వారా’ అని సాధనార్థంగా వివరించి వేయదు.
theological_decisions:
- issue: పునరుత్థాన సందర్భంలో ἐγήγερται యొక్క కర్మణి భావం
  choice: లేపబడ్డాడు
  alternative: లేచాడు
  rationale: గ్రీకు క్రియ స్పష్టంగా కర్మణి రూపంలో ఉంది. ‘లేపబడ్డాడు’ దానిని నిలుపుతూ, క్రియను స్వయంకర్తృకంగా మార్చకుండా theological tensionను కాపాడుతుంది.
- issue: Ἰωάννης ὁ βαπτίζων అనే గుర్తింపు
  choice: బాప్తిస్మం ఇచ్చే యోహాను
  alternative: బాప్తిస్మదాత యోహాను
  rationale: సంప్రదాయ బిరుదుకన్నా మూలంలోని కృదంత క్రియాభావాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా ప్రతిబింబిస్తుంది.
- issue: αἱ δυνάμεις యొక్క అర్థ పరిధి
  choice: ఈ శక్తులు
  alternative: ఈ అద్భుత కార్యాలు
  rationale: ఈ సందర్భంలో అద్భుత శక్తులు లేదా మహత్కార్యాలు అనే రెండు భావ ఛాయలు సాధ్యమైనందున, ప్రధాన పాఠ్యం విస్తృతమైన పదాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘బాప్తిస్మం ఇచ్చే యోహాను’ మూలంలోని క్రియాత్మక బిరుదును సాధారణ పాఠకుడికి స్పష్టంగా చేస్తుంది. ‘యేసు పేరు’ అనేది గ్రీకులోని సర్వనామ సూచనను సందర్భానుసారంగా స్పష్టం చేసి, ‘హేరోదు పేరు’ అనే సంభావ్య తెలుగు అపార్థాన్ని నివారిస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
