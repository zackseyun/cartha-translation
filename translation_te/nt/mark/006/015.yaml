revisions:
- from: కానీ మరికొందరు, “ఈయన ఏలీయా” అని చెబుతూ ఉన్నారు; ఇంకొందరు, “ఈయన ప్రవక్తలలో ఒకరిలాంటి ప్రవక్త[a]” అని చెబుతూ ఉన్నారు.
  to: కానీ మరికొందరు, “ఈయనే ఏలీయా” అని చెబుతుండేవారు; ఇంకొందరు, “ఈయన ప్రవక్తలలో ఒకరిలా ఉన్న ఒక ప్రవక్త” అని చెబుతుండేవారు.
  rationale: The revision changes both speech verbs to a past imperfective Telugu form, matching ἔλεγον. It also smooths the comparative phrase while retaining the indefinite identification, the comparison to one of the prophets, and the footnoted less-likely reading. The footnote marker remains attached to ‘ప్రవక్త,’ as in the draft.
