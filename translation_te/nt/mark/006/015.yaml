id: MRK.6.15
reference: Mark 6:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄλλοι ⸀δὲ ἔλεγον ὅτι Ἠλίας ἐστίν· ἄλλοι δὲ ἔλεγον ὅτι ⸀προφήτης ὡς εἷς τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/015.yaml
  text: But others were saying[a], “He is Elijah,” and others were saying, “He is a prophet, like one of the prophets.”
translation:
  language: te
  text: కానీ మరికొందరు, “ఈయనే ఏలీయా” అని చెబుతుండేవారు; ఇంకొందరు, “ఈయన ప్రవక్తలలో ఒకరిలా ఉన్న ఒక ప్రవక్త” అని చెబుతుండేవారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλοι δὲ
  choice: కానీ మరికొందరు / ఇంకొందరు
  rationale: ἄλλοι వేర్వేరు ప్రజాసమూహాలను సూచిస్తుంది; δέ స్వల్ప వ్యత్యాసంతో మాటను కొనసాగిస్తుంది. మొదటి సందర్భంలో ‘కానీ మరికొందరు’, రెండవ సందర్భంలో సహజమైన పునరుక్తిగా ‘ఇంకొందరు’ వాడాం.
- source_word: ἔλεγον
  choice: చెబుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పదేపదే వినిపిస్తున్న అభిప్రాయాన్ని సూచిస్తుంది; ‘చెబుతూ ఉన్నారు’ ఆ భావాన్ని తెలుగులో నిలుపుతుంది.
- source_word: ὅτι Ἠλίας ἐστίν
  choice: “ఈయన ఏలీయా”
  rationale: మాట్లాడుతున్నవారి ప్రత్యక్ష వాక్యంగా సహజంగా అనువదించాం; Ἠλίαςకు ప్రామాణిక తెలుగు రూపం ‘ఏలీయా’.
- source_word: προφήτης
  choice: ఒక ప్రవక్త
  rationale: ఇక్కడ పదానికి నిర్దిష్ట ఉపపదం లేదు; వెంటనే వచ్చే ‘ప్రవక్తలలో ఒకరిలాంటి’ అనే పోలిక కారణంగా సాధారణ ప్రవక్త అనే భావమే సహజం.
- source_word: ὡς εἷς τῶν προφητῶν
  choice: ప్రవక్తలలో ఒకరిలాంటి
  rationale: ὡς పోలికను తెలియజేస్తుంది. ఈ రూపం పూర్వ ప్రవక్తలలో ఒకరితో పోల్చుతున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో ఇస్తుంది.
theological_decisions:
- issue: προφήτηςను సాధారణంగా ‘ఒక ప్రవక్త’ అని అనువదించాలా, లేక అంత్యకాల నిరీక్షణలోని నిర్దిష్ట బిరుదుగా ‘ఆ ప్రవక్త’ అని అనువదించాలా
  choice: ఒక ప్రవక్త
  alternative: ఆ ప్రవక్త
  rationale: గ్రీకులో నిర్దిష్ట ఉపపదం లేకపోవడం, అలాగే ‘ప్రవక్తలలో ఒకరిలాంటి’ అనే వెంటనే వచ్చే వివరణ సాధారణ ప్రవక్త అనే గుర్తింపునే బలపరుస్తాయి. అయినప్పటికీ నిర్దిష్ట అంత్యకాల వ్యక్తిని సూచించే అవకాశాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలిని అనుసరించాం. మూలంలోని రెండు ప్రజాభిప్రాయాలు, స్వల్ప వ్యత్యాసం, కొనసాగుతున్న మాటల భావం నిలిపాం.
