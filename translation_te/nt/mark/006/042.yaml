  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: తిని
  rationale: ἐσθίω యొక్క భూతకాల క్రియారూపం; సాధారణంగా ‘తినడం’ అనే అర్థాన్ని సహజంగా తెలియజేస్తుంది. ప్రత్యేకంగా కర్మను చేర్చాల్సిన అవసరం లేదు.
- source_word: πάντες
  choice: అందరూ
  rationale: సందర్భంలోని సమూహమంతటినీ సూచించే నామవాచక ప్రయోగం. ‘అందరూ’ దాని సార్వత్రిక పరిధిని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: ἐχορτάσθησαν
  choice: తృప్తి చెందారు
  rationale: కడుపు నిండేంతగా తిని సంతృప్తి పొందారనే భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: καὶ ... καὶ
  choice: — ... —
  rationale: మొదటి καί ముందరి కథనంతో అనుసంధానిస్తుంది; రెండవది రెండు క్రియలను కలుపుతుంది. తెలుగులో ‘అందరూ తిని తృప్తి చెందారు’ అనే క్రియాసముచ్చయ నిర్మాణమే ఈ సమన్వయాన్ని సహజంగా తెలియజేస్తుంది; ప్రతి καίని విడిగా ‘మరియు’ అని అనువదిస్తే కృత్రిమంగా ఉంటుంది.
