translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా, సాధారణ పాఠకులకు స్పష్టంగా రూపొందించబడింది. ‘పగ పెంచుకొని’ అనే నుడికారం మూలంలోని కొనసాగుతున్న కక్షను ప్రతిబింబిస్తుంది; వాక్యంలోని రెండు అసంపూర్ణ భూతకాల క్రియల కొనసాగింపు భావం తెలుగులో సందర్భానుగుణంగా వ్యక్తమైంది.
