- from: అయితే హేరోదియ యోహానుపై పగ పెంచుకొని, అతన్ని చంపాలని కోరుకుంది[a]; కానీ ఆమె వల్ల కాలేదు.
  to: అయితే హేరోదియ అతనిపై పగతో ఉండేది[a], అతన్ని చంపాలని కోరుకునేది; కానీ ఆమెకు సాధ్యపడేది కాదు.
