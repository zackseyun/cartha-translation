base_translation:
  language: en
  yaml_path: translation/nt/mark/006/019.yaml
  text: But Herodias held a grudge against him and wanted to kill him[a], but she could not.
translation:
  language: te
  text: అయితే హేరోదియ అతనిపై పగతో ఉండేది[a], అతన్ని చంపాలని కోరుకునేది; కానీ ఆమెకు సాధ్యపడేది కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనిపై మనసులో శత్రుత్వాన్ని కలిగి ఉండేది,” లేదా “అతనిపై కక్ష పెట్టుకొని ఉండేది.” ఈ గ్రీకు ప్రయోగం కొనసాగుతున్న శత్రుభావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వాక్యంతో ఉన్న వ్యతిరేకతను, కథనంలోని తదుపరి పరిణామాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: Ἡρῳδιὰς
  choice: హేరోదియ
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: ἐνεῖχεν αὐτῷ
  choice: యోహానుపై పగ పెంచుకొని
  rationale: ఈ గ్రీకు ప్రయోగం నిరంతరంగా కొనసాగిన శత్రుభావాన్ని సూచిస్తుంది. సందర్భం స్పష్టంగా ఉండేందుకు సర్వనామానికి బదులుగా ‘యోహాను’ పేరును ఉపయోగించింది; అసంపూర్ణ భూతకాల భావాన్ని ‘పగ పెంచుకొని’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἤθελεν
  choice: కోరుకుంది
  rationale: ఆమెకు కొనసాగుతూ ఉన్న ఉద్దేశాన్ని సరళమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: αὐτὸν ἀποκτεῖναι
  choice: అతన్ని చంపాలని
  rationale: మూల క్రియలో ఉన్న ప్రత్యక్షమైన ‘చంపడం’ అనే భావాన్ని, ‘హత్య చేయడం’ వంటి అదనపు న్యాయపరమైన తీర్పు లేకుండా నిలుపుతుంది.
- source_word: καὶ οὐκ ἠδύνατο
  choice: కానీ ఆమె వల్ల కాలేదు
  rationale: వ్యాకరణపరంగా καὶ సాధారణంగా ‘మరియు’ అయినా, ఇక్కడ ఆమె కోరికకు విరుద్ధంగా ఉన్న అసమర్థతను సూచిస్తుంది. ‘ఆమె వల్ల కాలేదు’ సహజమైన తెలుగులో ఆ భావాన్ని అందిస్తుంది.
