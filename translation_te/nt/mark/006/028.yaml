source:
  edition: SBLGNT
  text: καὶ ἤνεγκεν τὴν κεφαλὴν αὐτοῦ ἐπὶ πίνακι καὶ ἔδωκεν αὐτὴν τῷ κορασίῳ, καὶ τὸ κοράσιον ἔδωκεν αὐτὴν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/028.yaml
  text: And he brought his head on a platter and gave it to the girl[a], and the girl gave it to her mother.
translation:
  language: te
  text: అతడు అతని తలను ఒక పళ్లెంపై[a] తీసుకొచ్చి, ఆ బాలికకు ఇచ్చాడు; ఆ బాలిక దానిని తన తల్లికి ఇచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక తట్టపై’ లేదా ‘ఒక వడ్డించే పాత్రపై.’ గ్రీకు πίναξ అనే పదం వడ్డించడానికి ఉపయోగించే పళ్లెం, తట్టి లేదా పాత్రను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκεν
  choice: తీసుకొచ్చి
  rationale: φέρω క్రియ యొక్క భూతకాల రూపం ఇక్కడ నరికిన తలను విందు జరిగే చోటికి తీసుకురావడాన్ని సూచిస్తుంది. ‘తీసుకొచ్చి’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: అతని తలను
  rationale: ముందటి సందర్భంలోని బాప్తిస్మమిచ్చే యోహానును αὐτοῦ సూచిస్తుంది. తెలుగు సహజ స్వామ్య నిర్మాణాన్ని ఉపయోగించాం.
- source_word: ἐπὶ πίνακι
  choice: ఒక పళ్లెంలో పెట్టి
  rationale: πίναξ వడ్డించడానికి ఉపయోగించే పెద్ద పళ్లెం, తట్టి లేదా పాత్రను సూచించగలదు. తెలుగులో ‘పళ్లెంలో పెట్టి’ చర్యను సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయ అర్థాలు పాదసూచికలో ఉన్నాయి.
- source_word: ἔδωκεν
  choice: ఇచ్చాడు / ఇచ్చింది
  rationale: మూలంలోని δίδωμι క్రియ రెండు ఉపవాక్యాల్లోనూ పునరావృతమైంది. కర్తల లింగానికి అనుగుణంగా తెలుగులో ‘ఇచ్చాడు’, ‘ఇచ్చింది’ అని అదే పునరుక్తిని నిలిపాం.
- source_word: τῷ κορασίῳ / τὸ κοράσιον
  choice: ఆ బాలికకు / ఆ బాలిక
  rationale: κοράσιον చిన్నవయసు గల అమ్మాయిని సూచిస్తుంది. ‘బాలిక’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: τῇ μητρὶ αὐτῆς
  choice: తన తల్లికి
  rationale: αὐτῆς బాలికను సూచిస్తుంది. వాక్యకర్త బాలికే కావడంతో ‘తన తల్లికి’ సహజమైన తెలుగు అన్వయాన్ని స్పష్టంగా ఉంచుతుంది.
