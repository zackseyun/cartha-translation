- from: ఆయన వారితో, “మీరే ఏకాంతంగా ఒక నిర్మానుష్య ప్రదేశానికి వచ్చి, కాసేపు విశ్రాంతి తీసుకోండి” అని అన్నాడు. ఎందుకంటే వచ్చేవారూ పోయేవారూ చాలామంది ఉండడంతో, వారికి భోజనం చేయడానికి కూడా అవకాశం లేకపోయింది.[a]
