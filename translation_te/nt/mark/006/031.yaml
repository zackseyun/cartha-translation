source:
  edition: SBLGNT
  text: καὶ ⸀λέγει αὐτοῖς· Δεῦτε ὑμεῖς αὐτοὶ κατ’ ἰδίαν εἰς ἔρημον τόπον καὶ ⸀ἀναπαύσασθε ὀλίγον. ἦσαν γὰρ οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί, καὶ οὐδὲ φαγεῖν εὐκαίρουν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/031.yaml
  text: And he said to them[a], “Come away by yourselves to a desolate place and rest a little.” For many were coming and going[b], and they did not even have an opportunity to eat.
translation:
  language: te
  text: ఆయన వారితో, “మీరు మాత్రమే ఒక నిర్మానుష్య ప్రదేశానికి విడిగా వెళ్లి, కాసేపు విశ్రాంతి తీసుకోండి” అని అన్నాడు. ఎందుకంటే చాలామంది వచ్చిపోతూ ఉండేవారు; శిష్యులకు తినడానికి కూడా వీలు లేకపోయేది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తినడానికి కూడా సమయం లేకపోయేది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, తెలుగు కథనశైలిలో భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: Δεῦτε
  choice: వచ్చి
  rationale: ఇది ఆహ్వానార్థక ఆజ్ఞ; జనసమూహం నుండి వేరుగా ఒక ప్రదేశానికి తనతో రావాలని యేసు పిలుస్తున్న భావాన్ని తెలుపుతుంది.
- source_word: ὑμεῖς αὐτοὶ κατ’ ἰδίαν
  choice: మీరే ఏకాంతంగా
  rationale: బలప్రయోగంతో ఉన్న సర్వనామాలు మరియు ‘వేరుగా/ఏకాంతంగా’ అనే పదబంధం, ఇతరుల నుండి విడిగా ఉండడాన్ని నొక్కి చెబుతున్నాయి.
- source_word: ἔρημον τόπον
  choice: ఒక నిర్మానుష్య ప్రదేశానికి
  rationale: ἔρημος ఇక్కడ ఆధునిక అర్థంలోని ఎడారిని తప్పనిసరిగా సూచించదు; జనావాసం లేని లేదా ఒంటరి ప్రదేశాన్ని సూచిస్తుంది.
- source_word: ἀναπαύσασθε
  choice: విశ్రాంతి తీసుకోండి
  rationale: పని నుండి కొంత విరామం తీసుకొని సేదతీరాలనే మధ్యమ ఆజ్ఞార్థక భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ὀλίγον
  choice: కాసేపు
  rationale: కొద్ది కాలవ్యవధిని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες
  choice: వచ్చేవారూ పోయేవారూ
  rationale: ప్రజల నిరంతర రాకపోకలను తెలుగు జంటపద ప్రయోగంతో సహజంగా నిలుపుతుంది.
- source_word: πολλοί
  choice: చాలామంది
  rationale: వ్యక్తుల సంఖ్య అధికంగా ఉందనే సాధారణ పరిమాణార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὐδὲ φαγεῖν εὐκαίρουν
  choice: వారికి భోజనం చేయడానికి కూడా అవకాశం లేకపోయింది
  rationale: εὐκαιρέω లోని సమయం లేదా వీలు లభించకపోవడం అనే భావాన్ని ‘అవకాశం’ నిలుపుతుంది; ‘కూడా’ οὐδέ యొక్క ఉద్ఘాటనను ప్రతిబింబిస్తుంది.
