id: MRK.6.1
reference: Mark 6:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ἐκεῖθεν, καὶ ⸀ἔρχεται εἰς τὴν πατρίδα αὐτοῦ, καὶ ἀκολουθοῦσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/001.yaml
  text: And he went out from there and came to his hometown[a], and his disciples followed him.
translation:
  language: te
  text: ఆయన అక్కడి నుండి బయలుదేరి తన స్వగ్రామానికి వచ్చాడు[a]. ఆయన శిష్యులు ఆయనను అనుసరించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన స్వగ్రామానికి వస్తాడు; ఆయన శిష్యులు ఆయనను అనుసరిస్తారు.” కథనాన్ని సజీవంగా చూపడానికి గ్రీకు మూలంలో ఇక్కడ వర్తమాన కాల క్రియారూపాలు వాడబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: బయలుదేరి
  rationale: ἐξέρχομαι యొక్క భూతకాల రూపం మునుపటి స్థలం నుండి వెళ్లడాన్ని సూచిస్తుంది. ‘బయలుదేరి’ అనే పదం గ్రీకు క్రియలోని ప్రయాణారంభ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐκεῖθεν
  choice: అక్కడి నుండి
  rationale: బయలుదేరిన స్థలాన్ని సూచించే సహజమైన, స్పష్టమైన తెలుగు ప్రయోగం.
- source_word: ἔρχεται
  choice: వచ్చాడు
  rationale: గ్రీకులో కథనానికి సజీవతనిచ్చే చారిత్రక వర్తమాన కాలం ఉంది. ఆధునిక తెలుగు కథనశైలిలో సహజత్వం కోసం భూతకాలంగా అనువదించబడింది.
- source_word: πατρίδα
  choice: స్వగ్రామానికి
  rationale: ఈ సందర్భంలో πατρίς యేసు సొంత ప్రాంతం లేదా ఊరిని, సందర్భానుసారం నజరేతును, సూచిస్తుంది. ‘స్వగ్రామం’ విస్తృతమైన ‘స్వదేశం’ కంటే సందర్భానికి తగినది.
- source_word: ἀκολουθοῦσιν
  choice: అనుసరించారు
  rationale: ἀκολουθέω యొక్క సాధారణ శిష్యత్వ సంబంధిత భావాన్ని ‘అనుసరించారు’ నిలుపుతుంది. గ్రీకు చారిత్రక వర్తమానాన్ని సహజ తెలుగు కథనం కోసం భూతకాలంగా ఇచ్చాం.
- source_word: μαθηταὶ
  choice: శిష్యులు
  rationale: సువార్తల సందర్భంలో μαθηταίకు స్థిరపడిన, సంబంధం మరియు అభ్యాసం రెండింటినీ సూచించే సహజ తెలుగు పదం.
theological_decisions:
- issue: ἔρχεται, ἀκολουθοῦσιν అనే చారిత్రక వర్తమాన క్రియల అనువాదం
  choice: తెలుగు కథనంలో ‘వచ్చాడు’, ‘అనుసరించారు’ అని భూతకాలంలో ఇవ్వడం
  alternative: ‘వస్తాడు ... అనుసరిస్తారు’ అని చారిత్రక వర్తమానాన్ని నిలుపడం
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కాదు; కథనశైలికి సంబంధించినది. ఆధునిక ప్రామాణిక తెలుగులో సహజంగా చదవడానికి భూతకాలాన్ని వాడుతూ, గ్రీకు రూపంలోని సజీవ కథన ప్రభావాన్ని పాదసూచికలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే కథనశైలి. వరుసగా ఉన్న గ్రీకు καί సంధులను తెలుగులో సహజమైన వాక్యప్రవాహం కోసం రెండు వాక్యాలుగా అమర్చాం.
