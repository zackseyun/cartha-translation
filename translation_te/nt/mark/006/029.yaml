revisions:
- from: అతని శిష్యులు ఈ సంగతి విన్నప్పుడు వచ్చి, అతని మృతదేహాన్ని తీసుకెళ్లి ఒక సమాధిలో ఉంచారు.
  to: అతని శిష్యులు విని వచ్చి, అతని మృతదేహాన్ని తీసుకొని ఒక సమాధిలో ఉంచారు.
  rationale: The revision removes an unstated object of hearing and replaces the directional “తీసుకెళ్లి” with “తీసుకొని,” which more closely reflects αἴρω while retaining natural Telugu. All other elements of the draft are retained in substance.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:01:38Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies John as the referent of «his» in context and accurately renders μαθηταί, πτῶμα, τίθημι, and μνημεῖον. However, “ఈ సంగతి” adds a specific object not expressed in the Greek, and “తీసుకెళ్లి” can imply carrying the body away, whereas αἴρω here more directly denotes taking/lifting it up. “తీసుకొని” preserves the action without that added directional implication.
  naturalness: The revised wording is fluent, concise, and appropriately dignified modern standard Telugu narrative.
  terminology: '“శిష్యులు,” “మృతదేహం,” and “సమాధి” are accurate and suitable. No footnote is needed: “మృతదేహం” directly conveys πτῶμα’s sense of a dead body.'
  issues:
  - severity: low
    issue: “ఈ సంగతి” specifies an object for ‘heard’ that is not stated in the Greek.
    rationale: The participle ἀκούσαντες is absolute in this verse. Telugu can express it naturally as “విని,” preserving the source’s brevity and leaving the understood news to the context.
  - severity: medium
    issue: “తీసుకెళ్లి” is more directional than αἴρω.
    rationale: Although the disciples necessarily moved the body for burial, αἴρω principally expresses taking up/lifting. “తీసుకొని” accurately allows the following burial action to supply the movement without over-specifying it.
  revised_text: అతని శిష్యులు విని వచ్చి, అతని మృతదేహాన్ని తీసుకొని ఒక సమాధిలో ఉంచారు.
  revised_footnotes: []
  revision_rationale: The revision removes an unstated object of hearing and replaces the directional “తీసుకెళ్లి” with “తీసుకొని,” which more closely reflects αἴρω while retaining natural Telugu. All other elements of the draft are retained in substance.
