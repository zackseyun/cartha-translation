id: MRK.6.29
reference: Mark 6:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες οἱ μαθηταὶ αὐτοῦ ἦλθον καὶ ἦραν τὸ πτῶμα αὐτοῦ καὶ ἔθηκαν αὐτὸ ἐν μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/029.yaml
  text: And when his disciples heard[a], they came and took up his body and laid it in a tomb.
translation:
  language: te
  text: అతని శిష్యులు విని వచ్చి, అతని మృతదేహాన్ని తీసుకొని ఒక సమాధిలో ఉంచారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: ఈ సంగతి విన్నప్పుడు
  rationale: సందర్భంలో కారణమైన వార్తను విన్న తరువాత జరిగిన చర్యలను సూచించే కాలార్థక ఏఓరిస్ట్ కృదంతాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: అతని శిష్యులు
  rationale: μαθηταί అనే పదంలోని గురు-శిష్య సంబంధాన్ని నిలుపుతుంది; సమీప సందర్భంలో ‘అతని’ అనేది బాప్తిస్మమిచ్చే యోహానును సూచిస్తుంది.
- source_word: ἦλθον
  choice: వచ్చి
  rationale: ἔρχομαι యొక్క సాధారణ అర్థాన్ని తెలుగు కథన ప్రవాహానికి తగిన సంయుక్త క్రియారూపంలో అందిస్తుంది.
- source_word: ἦραν
  choice: తీసుకెళ్లి
  rationale: αἴρω ఇక్కడ మృతదేహాన్ని ఎత్తుకొని అక్కడి నుంచి తీసుకుపోవడాన్ని సూచిస్తుంది; అంత్యక్రియల సందర్భంలో ‘తీసుకెళ్లి’ సహజంగా ఉంటుంది.
- source_word: πτῶμα
  choice: మృతదేహాన్ని
  rationale: πτῶμα ప్రత్యేకంగా చనిపోయిన దేహాన్ని సూచిస్తుంది. ‘మృతదేహం’ ఆ అర్థాన్ని స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: ἔθηκαν
  choice: ఉంచారు
  rationale: τίθημι యొక్క ప్రాథమిక భావాన్ని సమాధిలో దేహాన్ని ఉంచే సందర్భానికి తగిన సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐν μνημείῳ
  choice: ఒక సమాధిలో
  rationale: μνημεῖον ఇక్కడ శవాన్ని ఉంచే సమాధి స్థలాన్ని సూచిస్తుంది; అనిర్దిష్టమైన గ్రీకు నిర్మాణాన్ని తెలుగులో ‘ఒక’తో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ‘అతని శిష్యులు’ అనే మాటలోని ‘అతని’ ఎవరిని సూచిస్తుంది?
  choice: బాప్తిస్మమిచ్చే యోహాను శిష్యులు
  alternative: యేసు శిష్యులు
  rationale: తక్షణ సందర్భంలో హతమార్చబడిన యోహానే పూర్వపదం; అతని మృతదేహాన్ని తీసుకొని సమాధి చేసినవారు అతని శిష్యులని వాక్యం తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు πτῶμα యొక్క స్పష్టమైన అర్థాన్ని ‘మృతదేహం’ నేరుగా అందిస్తున్నందున ప్రత్యామ్నాయ పదానికి పాదటిప్పణి అవసరం లేదు.
