id: MRK.6.34
reference: Mark 6:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν ⸀εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ ⸀αὐτοὺς ὅτι ἦσαν ὡς πρόβατα μὴ ἔχοντα ποιμένα, καὶ ἤρξατο διδάσκειν αὐτοὺς πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/034.yaml
  text: And when he went ashore[a], he saw a large crowd, and he had compassion on them, because they were like sheep without a shepherd[b]. And he began to teach them many things.
translation:
  language: te
  text: యేసు ఒడ్డుకు దిగినప్పుడు[a], ఆయన పెద్ద జనసమూహాన్ని చూశాడు. వారు కాపరిలేని గొర్రెల్లా[b] ఉన్నందున, ఆయన వారిపట్ల కనికరపడ్డాడు. అప్పుడు ఆయన వారికి ఎన్నో విషయాలు బోధించడం మొదలుపెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “బయటికి వచ్చినప్పుడు.” మునుపటి సందర్భంలో యేసు పడవలో ప్రయాణిస్తున్నందున, ఇక్కడ పడవ నుండి ఒడ్డుకు దిగడం ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “కాపరిలేని గొర్రెలు” అనే రూపకం నమ్మకమైన నాయకత్వం లేని ప్రజలను వర్ణించే బైబిలు భాషను ప్రతిధ్వనిస్తుంది; సంఖ్యాకాండము 27:17; 1 రాజులు 22:17; యెహెజ్కేలు 34:5 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθὼν
  choice: ఒడ్డుకు దిగినప్పుడు
  rationale: అక్షరార్థం ‘బయటికి వచ్చినప్పుడు.’ మార్కు 6:32-33లోని పడవ ప్రయాణ సందర్భం వల్ల పడవ నుండి ఒడ్డుకు దిగడమే సహజ భావం; అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: πολὺν ὄχλον
  choice: పెద్ద జనసమూహం
  rationale: πολύς సమూహపు పరిమాణాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజమైన, స్పష్టమైన వ్యక్తీకరణ.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοὺς
  choice: వారిపట్ల కనికరపడ్డాడు
  rationale: క్రియ లోతైన దయను సూచిస్తుంది. ‘వారిపట్ల కనికరపడ్డాడు’ అనేది తెలుగులో సహజంగా ఉండి, భావాన్ని అతిశయింపజేయదు.
- source_word: ὡς πρόβατα μὴ ἔχοντα ποιμένα
  choice: కాపరిలేని గొర్రెల్లా
  rationale: మూలంలోని ఉపమానాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది; దాని నాయకత్వ సంబంధమైన భావాన్ని ప్రధాన వాక్యంలో వివరణగా చేర్చదు.
- source_word: ἤρξατο διδάσκειν αὐτοὺς πολλά
  choice: వారికి ఎన్నో విషయాలు బోధించడం మొదలుపెట్టాడు
  rationale: ప్రారంభ భావాన్ని స్పష్టంగా నిలిపి, πολλάను బోధించిన విస్తృత విషయవస్తువుగా సహజ తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: కాపరిలేని గొర్రెల రూపకం
  choice: ‘కాపరిలేని గొర్రెల్లా’ అనే రూపకాన్ని ప్రధాన పాఠ్యంలో యథాతథంగా ఉంచడం
  alternative: ‘ఆధ్యాత్మిక నాయకత్వం లేని ప్రజల్లా’ అని వివరణాత్మకంగా విస్తరించడం
  rationale: ఈ మాట పాత నిబంధనలోని దేవుని ప్రజలు, వారి నాయకుల గురించిన కాపరి రూపకాన్ని ప్రతిధ్వనించవచ్చు. అయితే ప్రధాన పాఠ్యం దాని భావాన్ని ఒకే విధంగా తీర్మానించకుండా మూల రూపకాన్నే కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. స్పష్టత కోసం ‘యేసు’ అనే కర్తను తెలుగులో వ్యక్తంగా చేర్చాం. మూలంలోని కాపరి రూపకాన్ని వివరణాత్మకంగా మార్చకుండా నిలిపాం.
