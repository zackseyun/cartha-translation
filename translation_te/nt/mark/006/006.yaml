  text: καὶ ⸀ἐθαύμαζεν διὰ τὴν ἀπιστίαν αὐτῶν. Καὶ περιῆγεν τὰς κώμας κύκλῳ διδάσκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/006.yaml
  text: And he was amazed because of their unbelief[a]. And he went around among the villages[b], teaching.
translation:
  language: te
  text: వారి అవిశ్వాసం వల్ల ఆయన ఆశ్చర్యపడ్డాడు.[a] ఆయన చుట్టుపక్కల గ్రామాల్లో తిరుగుతూ బోధించాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి అవిశ్వాసం వల్ల ఆయన విస్మయపడ్డాడు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆయన గ్రామాల మధ్య ఒక వలయంలా తిరుగుతూ బోధించాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζεν
  choice: ఆశ్చర్యపడ్డాడు
  rationale: θαυμάζω యొక్క ఆశ్చర్య భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది. గ్రీకు అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న భావం సందర్భం ద్వారా గ్రహించబడుతుంది; తెలుగులో కృత్రిమంగా విస్తరించకుండా సరళ భూతకాల క్రియను వాడాం.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: వారి అవిశ్వాసాన్ని బట్టి
  rationale: διά + ద్వితీయా విభక్తి ఇక్కడ కారణాన్ని సూచిస్తుంది. ἀπιστίαను మృదువైన ‘విశ్వాసం కొరవడడం’గా కాకుండా, దాని బలమైన భావాన్ని నిలుపుతూ ‘అవిశ్వాసం’గా అనువదించాం.
- source_word: περιῆγεν
  choice: తిరుగుతూ
  rationale: περιάγω యొక్క అసంపూర్ణ భూతకాలం ఒక ప్రాంతంలో ఊరూరా కొనసాగిన సంచారాన్ని సూచిస్తుంది. ‘తిరుగుతూ’ అనే రూపం తరువాతి సమకాలిక కార్యమైన బోధనతో సహజంగా కలుస్తుంది.
- source_word: τὰς κώμας
  choice: గ్రామాల్లో
  rationale: κώμη గ్రామం లేదా గ్రామీణ నివాసాన్ని సూచిస్తుంది; ‘గ్రామాలు’ సాధారణ పాఠకులకు స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: κύκλῳ
  choice: చుట్టుపక్కల ఉన్న
  rationale: κύκλῳ పరిసర ప్రాంతంలో లేదా ఒక వలయ మార్గంలో సంచరించడాన్ని సూచించవచ్చు. సందర్భంలో ‘చుట్టుపక్కల ఉన్న’ సహజంగా ఉండి భౌగోళిక పరిసర భావాన్ని నిలుపుతుంది; ప్రత్యామ్నాయ చక్రాకార సంచార భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: διδάσκων
  choice: బోధించాడు
  rationale: ప్రస్తుత కృదంతం ప్రధాన క్రియతో సమకాలికమైన కార్యాన్ని సూచిస్తుంది. ‘తిరుగుతూ బోధించాడు’ అనే తెలుగు నిర్మాణం ఆ సమకాలికతను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యేసు అవిశ్వాసాన్ని చూసి ఆశ్చర్యపడినట్లు చెప్పడంలో ఉన్న క్రీస్తు సంబంధమైన ఉద్వేగాన్ని నిలుపడం
  choice: వారి అవిశ్వాసాన్ని బట్టి ఆయన ఆశ్చర్యపడ్డాడు
  alternative: వారి అవిశ్వాసాన్ని చూసి ఆయన విస్మయపడ్డాడు
  rationale: మూలపాఠం యేసు ఆశ్చర్యపడ్డాడని నేరుగా చెబుతుంది. ఆయనకు తెలియకపోవడం వల్ల ఆశ్చర్యం కలిగిందని గానీ, ఈ మాటను కేవలం అలంకారంగా గానీ అనువాదం నిర్ణయించదు; వాక్యంలోని నిజమైన theological tensionను వివరణ జోడించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయినా గౌరవప్రదమైన కథన శైలిలో ఉంచాం. రెండు గ్రీకు వాక్యాల సంబంధాన్ని తెలుగులో సహజంగా చూపేందుకు రెండవ వాక్యంలో ‘తరువాత’ వాడాం; ఇది కొత్త theological భావాన్ని జోడించదు.
