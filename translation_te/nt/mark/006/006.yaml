    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported temporal addition “తరువాత,” uses a direct modern Telugu causal expression for διά, and refines the alternative for κύκλῳ so that it preserves the possible circuit-like sense without suggesting movement only around the exterior of the villages. The text retains the source’s theological and narrative tension without interpretive expansion.
