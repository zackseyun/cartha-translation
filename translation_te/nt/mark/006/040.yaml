revisions:
- from: వారు వందమంది చొప్పున, యాభైమంది చొప్పున గుంపులు గుంపులుగా[a] భోజనానికి కూర్చున్నారు.
  to: వారు గుంపులు గుంపులుగా[a], వందమంది, యాభైమంది చొప్పున భోజనానికి కూర్చున్నారు.
