lexical_decisions:
- source_word: ἀνέπεσαν
  choice: భోజనానికి కూర్చున్నారు
  rationale: ἀναπίπτω భోజనం కోసం తన స్థానంలో కూర్చోవడం లేదా ఆనుకోవడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా, భోజన సందర్భాన్ని నిలుపుతూ ఈ పదబంధాన్ని ఎంచుకున్నాం.
- source_word: πρασιαὶ πρασιαὶ
  choice: గుంపులు గుంపులుగా
  rationale: πρασιά అక్షరార్థంగా తోట మడి; ఇక్కడ క్రమంగా విభజించిన సమూహాలను చిత్రాత్మకంగా సూచిస్తుంది. గ్రీకులోని పునరుక్తిని తెలుగులో సహజమైన పునరుక్తితో నిలిపాం; అక్షరార్థ చిత్రాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: κατὰ ἑκατὸν
  choice: వందమంది చొప్పున
  rationale: κατάతో కూడిన సంఖ్య ఇక్కడ విభజనాత్మక భావాన్ని తెలియజేస్తుంది. ‘చొప్పున’ ఆ భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: κατὰ πεντήκοντα
  choice: యాభైమంది చొప్పున
  rationale: ముందటి పదబంధానికి సమాంతరంగా, κατά యొక్క విభజనాత్మక భావాన్ని ‘చొప్పున’తో నిలిపాం.
