  yaml_path: translation/nt/mark/006/054.yaml
  text: And when they got out of the boat[a], immediately they recognized him.
translation:
  language: te
  text: వారు పడవనుండి దిగగానే, అక్కడి ప్రజలు వెంటనే ఆయనను గుర్తుపట్టారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “వారు పడవనుండి దిగినప్పుడు, వెంటనే ఆయనను గుర్తించినవారు...” గ్రీకులో ‘గుర్తించినవారు’ ఎవరో ప్రత్యేకంగా చెప్పలేదు; సందర్భం ప్రకారం వారు అక్కడి ప్రజలు.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξελθόντων αὐτῶν
  choice: వారు ... దిగగానే
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణాన్ని సహజమైన కాలార్థక ఉపవాక్యంగా అనువదించాం. ‘దిగగానే’ అనే రూపం బయటికి రావడాన్నీ, వెంటనే జరిగిన గుర్తింపునీ సూటిగా కలుపుతుంది.
- source_word: πλοίου
  choice: పడవలోనుంచి
  rationale: గలిలయ సముద్రపు సందర్భంలో πλοῖον చిన్న పడవను సూచిస్తుంది; ఆధునిక తెలుగులో ‘పడవ’ సహజమైన పదం.
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: మార్కు రచనలో తరచుగా కనిపించే తక్షణత్వాన్ని ‘వెంటనే’ స్పష్టంగా నిలుపుతుంది.
- source_word: ἐπιγνόντες
  choice: గుర్తుపట్టారు
  rationale: ఇక్కడ ἐπιγινώσκω చూసి ఎవరో గుర్తించడం అనే భావాన్ని ఇస్తుంది; ‘గుర్తుపట్టారు’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: αὐτὸν
  choice: ఆయనను
  rationale: సందర్భంలో సర్వనామం యేసును సూచిస్తుంది; గౌరవప్రదమైన తెలుగు కథనశైలికి ‘ఆయనను’ తగినది.
- source_word: implicit subject of ἐπιγνόντες
  choice: అక్కడి ప్రజలు
  rationale: గ్రీకులో కర్తకు ప్రత్యేక నామవాచకం లేదు. అయితే nominative plural participle అయిన ἐπιγνόντες, genitive absolute లోని αὐτῶνను సహజంగా సూచించదు; తరువాతి వచనం ప్రకారం ఆ ప్రాంత ప్రజలే యేసును గుర్తించారు. తెలుగులో భావస్పష్టత కోసం ‘అక్కడి ప్రజలు’ చేర్చాం.
theological_decisions:
- issue: యేసును గుర్తుపట్టినవారి గుర్తింపు
  choice: అక్కడి ప్రజలు ఆయనను గుర్తుపట్టారు
  alternative: ‘వెంటనే ఆయనను గుర్తుపట్టి...’ అని కర్తను వ్యక్తం చేయకుండా ఉంచడం
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కంటే వాక్యనిర్మాణం, సందర్భానికి సంబంధించినది. గ్రీకు వాక్యంలో గుర్తించినవారు స్థానిక ప్రజలని తదుపరి వచనం తెలియజేస్తుంది. ప్రధాన పాఠ్యంలో వారిని స్పష్టం చేస్తూనే, గ్రీకులో కర్త అంతర్లీనంగా ఉందన్న విషయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడాం. ‘గుర్తుపట్టారు’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది; మూలంలోని అంతర్లీన కర్త వల్ల కలిగే స్వల్ప అస్పష్టతను పాదటిప్పణిలో భద్రపరిచాం.
