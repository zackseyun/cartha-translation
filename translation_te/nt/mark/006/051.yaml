revisions:
- from: ఆయన వారి దగ్గరికి పడవలో ఎక్కగానే గాలి అణిగిపోయింది. అప్పుడు వారు తమలో తాము ఎంతో విస్మయపడ్డారు.[a]
  to: ఆయన వారి దగ్గరకు, పడవలోకి ఎక్కాడు; గాలి ఆగిపోయింది. అప్పుడు వారు తమలో తాము మితిమీరి విస్మయపడ్డారు.[a]
  rationale: The revision removes an added temporal inference, renders the wind’s cessation directly, and more fully reflects the Greek’s emphatic description of the disciples’ astonishment. The footnote remains anchored to the intensified reaction and gives the principal lexical alternative without imposing interpretation.
