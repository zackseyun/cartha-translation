source:
  edition: SBLGNT
  text: καὶ ἀνέβη πρὸς αὐτοὺς εἰς τὸ πλοῖον, καὶ ἐκόπασεν ὁ ἄνεμος. καὶ λίαν ⸂ἐκ περισσοῦ⸃ ἐν ἑαυτοῖς ⸀ἐξίσταντο,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/051.yaml
  text: And he got into the boat with them[a], and the wind stopped. And they were utterly astonished within themselves[b],
translation:
  language: te
  text: ఆయన వారి దగ్గరకు, పడవలోకి ఎక్కాడు; గాలి ఆగిపోయింది. అప్పుడు వారు తమలో తాము మితిమీరి విస్మయపడ్డారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థంగా, గ్రీకులో తీవ్రతను సూచించే పదాలు కలిసి ఉన్నాయి: “చాలా మితిమీరి.” “విస్మయపడ్డారు” అనే పదానికి “దిగ్భ్రాంతికి లోనయ్యారు” అనే మరింత బలమైన భావం కూడా ఉండవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη πρὸς αὐτοὺς εἰς τὸ πλοῖον
  choice: వారి దగ్గరికి పడవలో ఎక్కగానే
  rationale: పడవలోకి ప్రవేశించి వారితో చేరడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. గ్రీకు వాక్యంలోని కదలిక, వారి దగ్గరికి చేరడం రెండూ నిలుస్తాయి; తరువాతి క్రియతో సన్నిహిత కాలసంబంధాన్ని ‘ఎక్కగానే’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐκόπασεν ὁ ἄνεμος
  choice: గాలి అణిగిపోయింది
  rationale: κοπάζω సూచించే గాలి తగ్గి శాంతించడాన్ని ‘అణిగిపోయింది’ సహజంగా తెలియజేస్తుంది; పూర్తిగా ఆగిపోయిందని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: λίαν ἐκ περισσοῦ
  choice: ఎంతో
  rationale: రెండు తీవ్రతాసూచక పదాల సమిష్టి బలాన్ని చదవడానికి సహజమైన రీతిలో అందిస్తుంది; అసలు గ్రీకులోని అసాధారణ ఉద్ఘాటనను పాదసూచికలో స్పష్టం చేశాం.
- source_word: ἐν ἑαυτοῖς
  choice: తమలో తాము
  rationale: శిష్యుల అంతరంగ ప్రతిస్పందనను ప్రతిబింబించే సహజమైన తెలుగు ప్రయోగం.
- source_word: ἐξίσταντο
  choice: విస్మయపడ్డారు
  rationale: ἐξίστημι యొక్క సందర్భానుసార అర్థమైన తీవ్రమైన ఆశ్చర్యాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘తమ అదుపు తప్పారు’ వంటి అతివ్యాఖ్యానాన్ని నివారిస్తుంది.
theological_decisions:
- issue: యేసు కార్యానికి శిష్యుల ప్రతిస్పందన తీవ్రత
  choice: వారు తమలో తాము ఎంతో విస్మయపడ్డారు
  alternative: వారు తమలో తాము కొలవలేనంతగా దిగ్భ్రాంతి చెందారు
  rationale: కథనంలో ఉన్న తీవ్రమైన ఆశ్చర్యాన్ని నిలుపుతూ, వారి మానసిక స్థితి లేదా అదనపు సిద్ధాంతార్థాన్ని అనవసరంగా చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కథన గౌరవం మరియు గ్రీకు మూలంలోని తీవ్రత నిలిచేలా రూపొందించబడింది.
