- from: అప్పుడు అనువైన ఒక రోజు వచ్చింది[a]. హేరోదు తన పుట్టినరోజున తన ఉన్నతాధికారులకు, సైన్యాధిపతులకు, గలిలయలోని ప్రముఖులకు విందు ఏర్పాటు చేశాడు[b].
  to: హేరోదు తన పుట్టినరోజు సందర్భంగా తన ఉన్నతాధికారులకు, సైన్యాధిపతులకు, గలిలయలోని ప్రముఖులకు విందు[b] ఏర్పాటు చేసినప్పుడు, ఒక అనుకూలమైన రోజు[a] వచ్చింది.
