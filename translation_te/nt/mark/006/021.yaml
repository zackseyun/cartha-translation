source:
  edition: SBLGNT
  text: Καὶ γενομένης ἡμέρας εὐκαίρου ὅτε Ἡρῴδης τοῖς γενεσίοις αὐτοῦ δεῖπνον ⸀ἐποίησεν τοῖς μεγιστᾶσιν αὐτοῦ καὶ τοῖς χιλιάρχοις καὶ τοῖς πρώτοις τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/021.yaml
  text: And when an opportune day came[a], Herod gave a banquet on his birthday for his nobles and military commanders and the leading men of Galilee[d][c][b],
translation:
  language: te
  text: హేరోదు తన పుట్టినరోజు సందర్భంగా తన ఉన్నతాధికారులకు, సైన్యాధిపతులకు, గలిలయలోని ప్రముఖులకు విందు[b] ఏర్పాటు చేసినప్పుడు, ఒక అనుకూలమైన రోజు[a] వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అనుకూలమైన రోజు’ అంటే తగిన లేదా అవకాశం కలిగించే రోజు అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘భోజనం ఏర్పాటు చేశాడు’; ఇక్కడ అధికారవర్గ అతిథుల కోసం ఇచ్చిన విందు ఉద్దేశించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ γενομένης ἡμέρας εὐκαίρου
  choice: అప్పుడు అనువైన ఒక రోజు వచ్చింది
  rationale: Genitive absoluteను సహజమైన తెలుగు కథన వాక్యంగా మలిచాం. εὔκαιροςలోని తగిన లేదా అవకాశం కలిగించే సమయం అనే భావాన్ని ‘అనువైన’ నిలుపుతుంది; సందర్భంలోని వ్యూహాత్మక అవకాశాన్ని పాఠకుడు గ్రహించగలిగేలా చేస్తుంది.
- source_word: ὅτε
  choice: ఆ రోజున జరిగినదాన్ని తదుపరి వాక్యం వివరిస్తుంది
  rationale: గ్రీకు వాక్యంలో ὅτε ఆ ‘అనువైన రోజు’ ఏ సందర్భమో నిర్దిష్టంగా చెబుతుంది. తెలుగులో రెండుసార్లు ‘ఎప్పుడు’ అని అసహజంగా పునరుక్తి చేయకుండా, రెండు అనుసంధాన వాక్యాలతో అదే సంబంధాన్ని తెలిపాం.
- source_word: τοῖς γενεσίοις αὐτοῦ
  choice: తన పుట్టినరోజున
  rationale: γενέσια పుట్టినరోజు ఆచరణను సూచిస్తుంది. ‘పుట్టినరోజున’ ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: δεῖπνον ἐποίησεν
  choice: విందు ఏర్పాటు చేశాడు
  rationale: అక్షరార్థంగా ‘భోజనం చేశాడు/చేశాడు’ అనడం తెలుగులో ఆతిథ్య భావాన్ని స్పష్టంగా ఇవ్వదు. అధికారవర్గ అతిథుల కోసం విందు నిర్వహించాడనే గ్రీకు నుడికార భావాన్ని ఇది సహజంగా తెలియజేస్తుంది.
- source_word: τοῖς μεγιστᾶσιν αὐτοῦ
  choice: తన ఉన్నతాధికారులకు
  rationale: μεγιστᾶνες ఉన్నత హోదాలోని ప్రముఖులను లేదా రాజాస్థాన అధికారులను సూచిస్తుంది. ‘ఉన్నతాధికారులు’ అనేది వంశపారంపర్య ‘ప్రభువులు’ అనే అర్థాన్ని అనవసరంగా మోపకుండా వారి స్థాయిని తెలుపుతుంది.
- source_word: τοῖς χιλιάρχοις
  choice: సైన్యాధిపతులకు
  rationale: χιλίαρχοι ఉన్నత సైనిక కమాండర్లను సూచిస్తుంది. ‘సైన్యాధిపతులు’ వారి విధిని స్పష్టంగా తెలుపుతుంది; నిర్దిష్ట రోమా సాంకేతిక పదవిని బలవంతంగా దిగుమతి చేయదు.
- source_word: τοῖς πρώτοις τῆς Γαλιλαίας
  choice: గలిలయలోని ప్రముఖులకు
  rationale: πρῶτοι ఇక్కడ ఆ ప్రాంతంలోని ప్రథమ శ్రేణి లేదా ప్రభావశీల వ్యక్తులను సూచిస్తుంది. ‘ప్రముఖులు’ స్థాయి, సామాజిక ప్రాధాన్యాన్ని సహజంగా తెలియజేస్తుంది; తెలుగు బహువచనంలో లింగాన్ని అనవసరంగా చేర్చదు.
- source_word: Ἡρῴδης
  choice: హేరోదు
  rationale: తెలుగు బైబిలు సంప్రదాయానికి అనుగుణమైన పేరురూపం.
