translation:
  language: te
  text: వారు విరిగిన ముక్కలతో నిండిన పన్నెండు గంపలను, చేపలలోనివాటిని కూడా, సేకరించారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విరిగిన ముక్కల పన్నెండు గంపల నిండుదనం.’ గ్రీకు పదబంధం అక్షరార్థంగా ‘విరిగిన ముక్కలు,’ ‘పన్నెండు గంపలు,’ ‘నింపిన పరిమాణాలు’ అనే భావాలను కలిపి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: పోగుచేశారు
  rationale: ఈ సందర్భంలో αἴρω మిగిలిన ఆహారాన్ని ఎత్తి సమకూర్చడాన్ని సూచిస్తుంది. ‘పోగుచేశారు’ అనేది ఆ చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: κλάσματα
  choice: విరిగిన ముక్కలు
  rationale: κλάσματα విరిచినప్పుడు ఏర్పడిన ముక్కలను సూచిస్తుంది. సందర్భం రొట్టెను సూచించినా, ఈ వచనంలో లేని ‘రొట్టె’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: δώδεκα κοφίνων πληρώματα
  choice: పన్నెండు గంపల నిండా
  rationale: ఈ ప్రయోగంలో సంఖ్య, పాత్రలు, వాటిని నింపిన పరిమాణం కలిసి ఉన్నాయి. ‘పన్నెండు గంపల నిండా’ అనే రూపం ఈ భావాన్ని సహజంగా, మూలానికి దగ్గరగా అందిస్తుంది.
- source_word: κόφινος
  choice: గంప
  rationale: κόφινος ఒక రకమైన బుట్ట లేదా గంపను సూచిస్తుంది. పరిమాణాన్ని నిర్దిష్టంగా చెప్పకుండా సాధారణంగా అర్థమయ్యే ‘గంప’ను ఎంచుకున్నాం.
- source_word: πληρώματα
  choice: నిండా
  rationale: πληρώματα ఇక్కడ గంపలను నింపిన మొత్తం లేదా వాటి నిండుదనాన్ని సూచిస్తుంది. ‘నిండా’ అనే ప్రయోగం ఆ పరిమాణ భావాన్ని తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ τῶν ἰχθύων
  choice: చేపల్లో మిగిలినవాటిని
  rationale: ἀπό ఇక్కడ చేపల నుండి వచ్చిన మిగులు భాగాలను సూచిస్తుంది. ‘చేపల్లో మిగిలినవాటిని’ అనేది ఆ భాగార్థాన్ని సహజంగా తెలియజేస్తుంది; చేపలన్నీ పోగుచేశారనే అర్థం రాకుండా చేస్తుంది.
