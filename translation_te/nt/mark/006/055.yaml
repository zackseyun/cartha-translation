  text: They ran throughout that whole region and began carrying those who were sick on mats to wherever they heard he was[a].
translation:
  language: te
  text: వారు ఆ ప్రాంతమంతటా పరుగెత్తి, ఆయన ఎక్కడ ఉన్నాడని విన్నారో అక్కడికి రోగులను చాపలపై మోసుకెళ్లడం మొదలుపెట్టారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరుపులపై’ లేదా ‘చిన్న మంచాలపై’; గ్రీకు పదం మోసుకెళ్లగల సాధారణ పడక సామగ్రిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέδραμον
  choice: ప్రాంతమంతటా పరుగెత్తి
  rationale: సమాస క్రియలోని వేగాన్ని, ప్రాంతమంతటా సంచరించిన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὅλην τὴν χώραν ἐκείνην
  choice: ఆ ప్రాంతమంతటా
  rationale: χώρα ఇక్కడ ఆధునిక దేశాన్ని కాక పరిసర ప్రాంతాన్ని సూచిస్తుంది; ὅλην మరియు ἐκείνην భావాలనూ ఈ రూపం సంక్షిప్తంగా అందిస్తుంది.
- source_word: ἤρξαντο ... περιφέρειν
  choice: మోసుకురావడం మొదలుపెట్టారు
  rationale: ἤρξαντο తెలిపే చర్య ఆరంభాన్ని నిలుపుతూ, సందర్భంలో రోగులను యేసు ఉన్న చోటికి తీసుకువచ్చారనే గమ్యభావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐπὶ τοῖς κραβάττοις
  choice: చాపల మీద
  rationale: κράβαττος సాధారణంగా మోసుకెళ్లగల సాధారణ పరుపు, చాప లేదా చిన్న మంచాన్ని సూచిస్తుంది; ‘చాపలు’ సామాన్య పాఠకులకు స్పష్టమైన పదం.
- source_word: τοὺς κακῶς ἔχοντας
  choice: రోగులను
  rationale: ఈ గ్రీకు నుడికారం అనారోగ్యంతో ఉన్నవారిని సూచిస్తుంది; ‘రోగులను’ సంక్షిప్తంగా, స్పష్టంగా అదే భావాన్ని ఇస్తుంది.
- source_word: ὅπου ἤκουον ὅτι ἐστίν
  choice: ఆయన ఎక్కడ ఉన్నాడని విన్నారో అక్కడికి
  rationale: ὅπου యొక్క స్థల/గమ్య భావాన్ని, ὅτι ద్వారా వచ్చిన పరోక్ష నివేదికను తెలుగులో సహజంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గంభీరతను కాపాడుతూ అనువదించబడింది. వాక్యంలోని అత్యవసరతను ‘పరుగెత్తి’ ద్వారా, రోగులను యేసు ఉన్న చోటికి తీసుకువెళ్లిన దిశను ‘అక్కడికి ... మోసుకురావడం’ ద్వారా వ్యక్తపరచబడింది.
