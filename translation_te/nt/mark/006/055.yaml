  source_fidelity: ‘మోసుకురావడం’ తెలుగులో సాధారణంగా వక్త/కథన కేంద్రం వైపుకు తీసుకురావడాన్ని సూచిస్తుంది. గ్రీకు περιφέρειν మరియు ὅπου ἤκουον ὅτι ἐστίν మాత్రం యేసు ఎక్కడ ఉన్నాడని విన్నారో ఆ చోటుకు రోగులను తీసుకువెళ్లడాన్ని చెబుతాయి. ‘మోసుకెళ్లడం’ ఈ దిశను నిర్దిష్టం చేయకుండా మూలానికి మరింత నమ్మకంగా ఉంటుంది. మిగిలిన అంశాలు—ఆ ప్రాంతమంతటా పరుగెత్తడం, రోగులు, చాపలు, చర్య ఆరంభం—మూలభావాన్ని సరిగ్గా అందిస్తున్నాయి.
  naturalness: సవరించిన వాక్యం ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది. ‘చాపల మీద’ కంటే ‘చాపలపై’ కొద్దిగా సంక్షిప్తమైన ప్రామాణిక రూపం; రెండూ సహజమే.
