  text: ⸂καὶ ἔλεγεν⸃ αὐτοῖς ὁ Ἰησοῦς ὅτι Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ πατρίδι αὐτοῦ καὶ ἐν τοῖς ⸂συγγενεῦσιν αὐτοῦ⸃ καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/004.yaml
  text: And Jesus was saying to them[c][b][a], “A prophet is not without honor except in his hometown and among his relatives and in his household.”
translation:
  language: te
  text: 'యేసు వారితో ఇలా అన్నాడు: “ప్రవక్తకు తన సొంత ఊరిలో[a], తన బంధువుల మధ్య[b], తన ఇంటివారి మధ్య[c] తప్ప గౌరవం దక్కదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సొంత ప్రాంతం’ లేదా ‘పుట్టిన ప్రదేశం’ అని కూడా అనువదించవచ్చు. గ్రీకు πατρίς ఒకరి స్వస్థలాన్ని సూచిస్తుంది; ఇక్కడ నజరేతు సందర్భానికి ‘సొంత ఊరు’ సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘బంధుజనులు’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం ఒకే బంధుత్వ వర్గానికి చెందినవారిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘ఇంటిలో’ అని కూడా అనువదించవచ్చు. గ్రీకు οἰκία భౌతిక ఇంటినీ లేదా ఆ ఇంటికి చెందిన కుటుంబాన్నీ సూచించగలదు; ఇక్కడ ‘ఇంటివారు’ అని తీసుకోవడం ‘బంధువులు’ నుండి మరింత సన్నిహిత వర్గాన్ని వేరుచేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ఇలా అన్నాడు
  rationale: గ్రీకు అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా నేపథ్య ప్రసంగాన్ని సూచించగలదు. అయితే ఈ సామెతవంటి ఒక్క వాక్యాన్ని పరిచయం చేసే కథన సందర్భంలో సహజమైన ఆధునిక తెలుగులో ‘ఇలా అన్నాడు’ సరిపోతుంది.
- source_word: προφήτης
  choice: ప్రవక్త
  rationale: προφήτηςకు ప్రామాణికమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: ἄτιμος
  choice: గౌరవం దక్కనిది
  rationale: మూలంలోని గౌరవం–అగౌరవం వ్యత్యాసాన్ని నిలుపుతూ, గ్రీకు ‘గౌరవం లేనివాడు’ అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰ μὴ
  choice: మాత్రమే
  rationale: నిరాకరణతో కూడిన ఈ వాక్యంలో εἰ μὴ మినహాయింపును సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ‘దక్కనిది ... మాత్రమే’ ఆ మినహాయింపు భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: πατρίδι
  choice: సొంత ఊరు
  rationale: నజరేతు సందర్భంలో ఇది విస్తృతమైన దేశాన్ని కాక, వ్యక్తి పుట్టి పెరిగిన సొంత ప్రాంతాన్ని సూచిస్తుంది.
- source_word: συγγενεῦσιν
  choice: బంధువులు
  rationale: ఒకే బంధుత్వ వర్గానికి చెందినవారిని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: οἰκίᾳ
  choice: ఇంటివారు
  rationale: οἰκία భౌతిక ఇంటినీ, ఆ ఇంటికి చెందిన కుటుంబం లేదా గృహసమూహాన్నీ సూచించగలదు. ‘బంధువులు’ తర్వాత ఉన్న క్రమంలో ‘ఇంటివారు’ అత్యంత సమీప కుటుంబ వర్గాన్ని సహజంగా సూచిస్తుంది.
- source_word: καὶ ... καὶ ... καὶ
  choice: ఊరిలో, బంధువుల మధ్య, ఇంటివారి మధ్య
  rationale: మూలంలోని వరుసగా సంకుచితమయ్యే మూడు సామాజిక వలయాలను తెలుగులో సమాంతర పదబంధాలుగా నిలిపింది; తెలుగు సహజ ప్రవాహం కోసం ప్రతి καὶను విడిగా ‘మరియు’ అని అనువదించలేదు.
theological_decisions:
- issue: ప్రవక్త గౌరవం గురించి యేసు చెప్పిన సామెత పరిధి
  choice: యేసు తన సందర్భానికి వర్తింపజేసిన సాధారణ ప్రవక్తసంబంధ సామెతగానే అనువదించడం
  alternative: యేసు తాను తిరస్కరించబడిన మెస్సీయనని స్పష్టంగా గుర్తిస్తున్నట్లు వ్యాఖ్యానాత్మకంగా విస్తరించడం
  rationale: గ్రీకు పాఠం ప్రవక్తకు పరిచిత వర్గాల్లో గౌరవం దక్కకపోవడం గురించి మాత్రమే నేరుగా చెబుతుంది. సందర్భం దానిని యేసుకు వర్తింపజేసినా, అనువాదంలో అదనపు క్రీస్తుశాస్త్ర వివరణను చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సామెతశైలిని ఉపయోగించాం. ‘గౌరవం దక్కనిది ... మాత్రమే’ అనే నిర్మాణం మూలంలోని నిరాకరణతో కూడిన మినహాయింపును తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
