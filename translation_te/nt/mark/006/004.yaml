- from: 'యేసు వారితో ఇలా అన్నాడు: “ప్రవక్తకు గౌరవం దక్కనిది తన సొంత ఊరిలో[a], తన బంధువుల మధ్య[b], తన ఇంటివారి మధ్య[c] మాత్రమే.”'
