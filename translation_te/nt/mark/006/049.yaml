source:
  edition: SBLGNT
  text: οἱ δὲ ἰδόντες αὐτὸν ⸂ἐπὶ τῆς θαλάσσης περιπατοῦντα⸃ ἔδοξαν ⸂ὅτι φάντασμά ἐστιν⸃ καὶ ἀνέκραξαν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/049.yaml
  text: But when they saw him walking on the sea[a], they thought that it was a ghost, and they cried out,
translation:
  language: te
  text: అయితే వారు ఆయనను సముద్రం మీద నడుస్తుండగా చూసి, ఆయన భూతమని[a] భావించి కేకలు వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “భూతాకారం” లేదా “కనిపించిన ఆకారం.” గ్రీకు పదం భూతంలా కనిపించిన ఒక రూపాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: అయితే … వారు
  rationale: δέకు స్వల్ప వ్యతిరేకతతో కూడిన కథన మలుపు భావాన్ని ఇస్తూ, substantival article సూచించే శిష్యుల సమూహాన్ని ‘వారు’తో వ్యక్తం చేసింది.
- source_word: ἰδόντες αὐτὸν
  choice: ఆయనను … చూసి
  rationale: Aorist participleను సహజమైన తెలుగు కాలసంబంధ నిర్మాణంగా అనువదించి, చూసిన తరువాత కలిగిన ప్రతిస్పందన క్రమాన్ని నిలిపింది.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: సముద్రం మీద నడుస్తుండడం
  rationale: ἐπί + genitiveను ఈ సందర్భంలో నీటి ఉపరితలం మీద నడవడంగా తీసుకుంది; θάλασσα పదానికి ‘సముద్రం’ అనే రూపాన్ని నిలిపింది.
- source_word: ἔδοξαν
  choice: భావించి
  rationale: δοκέω ఇక్కడ పొరపాటుగా అనుకోవడం లేదా భావించడం అనే అర్థంలో ఉంది; తెలుగు వాక్యప్రవాహానికి అనుగుణంగా అసమాపక క్రియారూపం వాడింది.
- source_word: ὅτι φάντασμά ἐστιν
  choice: ఆయన ఒక భూతమని
  rationale: φάντασμα అతీంద్రియమైన లేదా భూతసదృశమైన రూపాన్ని సూచిస్తుంది. ‘భూతం’ సాధారణ పాఠకులకు స్పష్టంగా ఉన్నప్పటికీ, పదంలోని విస్తృత భావాన్ని పాదసూచికలో ఉంచింది. గ్రీకులోని వర్తమాన ἐστινను తెలుగు పరోక్ష వాక్యంలో సహజంగా ‘అని’ నిర్మాణంతో తెలిపింది.
- source_word: καὶ ἀνέκραξαν
  choice: కేకలు వేశారు
  rationale: ἀνακράζω సూచించే బిగ్గరగా అరవడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; భయ స్వరూపాన్ని అనవసరంగా మరింత నిర్దిష్టం చేయదు.
theological_decisions:
- issue: నీటిపై యేసు చేసిన కార్య స్వభావం
  choice: సముద్రం మీద నడుస్తుండడం
  alternative: సముద్రం పక్కగా నడుస్తుండడం
  rationale: ఈ కథన సందర్భంలో ἐπὶ τῆς θαλάσσης అనేది సముద్ర ఉపరితలం మీద నడవడాన్నే సహజంగా సూచిస్తుంది; అద్భుత వృత్తాంతపు సూటి భావాన్ని అదనపు వివరణ లేకుండా నిలుపుతుంది.
- issue: φάντασμα యొక్క స్వభావం
  choice: భూతం
  alternative: ఆత్మాకారం / మాయారూపం
  rationale: మూలపదం కనిపించిన అతీంద్రియ రూపాన్ని సూచిస్తుంది; అది తప్పనిసరిగా ‘దయ్యం’ అనే దుష్టాత్మ భావానికి పరిమితం కాదు. అందువల్ల ప్రధాన పాఠంలో సాధారణమైన ‘భూతం’ను వాడి, భావ పరిధిని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘దయ్యం’ అనేది దుష్టాత్మ భావాన్ని అధికంగా సూచించే అవకాశం ఉన్నందున ‘భూతం’ ఎంచుకుంది. పాదసూచిక గుర్తును దాని సంబంధిత φάντασμα అనువాదమైన ‘భూతం’ వద్ద ఉంచింది.
