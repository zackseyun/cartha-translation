id: MRK.6.17
reference: Mark 6:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Αὐτὸς γὰρ ὁ Ἡρῴδης ἀποστείλας ἐκράτησεν τὸν Ἰωάννην καὶ ἔδησεν αὐτὸν ἐν φυλακῇ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ, ὅτι αὐτὴν ἐγάμησεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/017.yaml
  text: For Herod himself had sent and seized John[a], and bound him in prison because of Herodias, the wife of Philip his brother[b], because he had married her.
translation:
  language: te
  text: ఎందుకంటే హేరోదు తానే పంపించి యోహానును పట్టించి, అతణ్ణి చెరసాలలో బంధించాడు[a]. తన సోదరుడైన ఫిలిప్పు భార్య హేరోదియను అతడు పెళ్లి చేసుకున్నందువల్లే ఇలా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, “పంపి యోహానును పట్టుకొని, అతణ్ణి చెరసాలలో బంధించాడు.” హేరోదు ఎవరిని పంపాడో గ్రీకు పాఠం పేర్కొనదు; ప్రధాన పాఠంలోని ప్రయోజక రూపం ఈ చర్యకు హేరోదే బాధ్యుడని తెలియజేస్తుంది.
    reason: agency_and_grammatical_alternative
lexical_decisions:
- source_word: Αὐτὸς γὰρ ὁ Ἡρῴδης
  choice: ఎందుకంటే, హేరోదు తానే
  rationale: γὰρ ముందున్న వాక్యానికి వివరణాత్మక కారణాన్ని సూచిస్తుంది; Αὐτός హేరోదు బాధ్యతను నొక్కిచెబుతుంది. ఆధునిక తెలుగులో ‘ఎందుకంటే’ మరియు ‘తానే’ ఈ రెండు భావాలను సహజంగా నిలుపుతాయి.
- source_word: ἀποστείλας ἐκράτησεν
  choice: మనుష్యులను పంపి … పట్టించాడు
  rationale: ముందుగా పంపడం, దాని ద్వారా యోహాను పట్టుబడడం అనే కార్యక్రమాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది. పంపబడినవారు మూలపాఠంలో ప్రత్యక్షంగా చెప్పబడకపోయినా, రాజు ఆజ్ఞతో జరిగిన చర్య అనే సహజమైన కర్తృత్వం ‘పట్టించాడు’లో వ్యక్తమవుతుంది.
- source_word: ἔδησεν αὐτὸν ἐν φυλακῇ
  choice: చెరసాలలో బంధించాడు
  rationale: δέω యొక్క ‘బంధించు’ అనే స్పష్టమైన భావాన్ని నిలుపుతూ, φυλακήని ఈ సందర్భంలో నిర్బంధ స్థలమైన ‘చెరసాల’గా అనువదిస్తుంది; సంకెళ్లు వంటి మూలంలో లేని వివరాలను చేర్చదు.
- source_word: διὰ Ἡρῳδιάδα
  choice: హేరోదియను … పెళ్లి చేసుకున్నందువల్లే
  rationale: διά + accusative సూచించే కారణాన్ని సహజమైన తెలుగు కారణ నిర్మాణంలో వ్యక్తం చేస్తుంది. ‘ఏ’ నొక్కు ఆ వివాహమే చర్యకు కారణమని వాక్యం చెప్పే సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: తన సోదరుడైన ఫిలిప్పు భార్య హేరోదియను
  rationale: γυνή ఇక్కడ ‘భార్య’ అనే అర్థంలో ఉంది. Φιλίππου మరియు τοῦ ἀδελφοῦ αὐτοῦ మధ్య సంబంధాన్ని తెలుగులో సహజమైన విశేషణ నిర్మాణంతో చూపిస్తుంది.
- source_word: ὅτι αὐτὴν ἐγάμησεν
  choice: హేరోదు పెళ్లి చేసుకున్నందువల్ల
  rationale: γαμέωను సాధారణ ఆధునిక తెలుగు ‘పెళ్లి చేసుకున్నాడు’తో అనువదించింది. గ్రీకులోని సర్వనామ సూచన తెలుగులో సందిగ్ధం కాకుండా కర్తగా హేరోదు పేరును మళ్లీ పేర్కొంది.
theological_decisions:
- issue: హేరోదు వివాహంపై చారిత్రక-నైతిక వ్యాఖ్యానం
  choice: ఈ వచనంలో ఉన్న కారణ సంబంధాన్ని మాత్రమే పేర్కొని, వివాహం చట్టవిరుద్ధమని అదనపు తీర్పును చేర్చలేదు.
  alternative: చుట్టుపక్కల వచనాల ఆధారంగా ఈ వివాహాన్ని ప్రధాన పాఠంలోనే ‘అక్రమ వివాహం’గా పేర్కొనడం.
  rationale: ఈ వాక్యం నిర్బంధానికి దారితీసిన చారిత్రక కారణాన్ని చెబుతుంది; దాని నైతిక-ధార్మిక విశ్లేషణ తరువాతి సందర్భంలో వస్తుంది. అందువల్ల మూలవాక్యంలో లేని వ్యాఖ్యానాన్ని ఇక్కడ చేర్చలేదు.
- issue: హేరోదు స్వయంగా చేశాడా లేక ప్రతినిధుల ద్వారా చేశాడా
  choice: హేరోదు మనుష్యులను పంపి యోహానును పట్టించాడని ప్రధాన పాఠంలో తెలిపి, మొత్తం చర్యకు హేరోదే బాధ్యుడని నిలిపింది.
  alternative: ‘హేరోదు పంపి, యోహానును పట్టుకొని బంధించాడు’ అని అక్షరానుసారంగా అనువదించడం; ఇది హేరోదు స్వయంగా పట్టుకున్నట్లు తెలుగులో వినిపించవచ్చు.
  rationale: ἀποστείλας తరువాత ἐκράτησεν రావడం హేరోదు ఆజ్ఞతో చర్య జరిగిందని సూచిస్తుంది. తెలుగు ప్రయోజక రూపం ఆ రాజాధికార కర్తృత్వాన్ని సహజంగా వ్యక్తం చేస్తుంది; కార్యనిర్వాహకుల వివరాలు మూలంలో నిర్దిష్టంగా లేవని పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించింది. ‘చెరసాల’, ‘బంధించాడు’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి మూలంలోని గంభీరతను నిలుపుతాయి. దీర్ఘమైన గ్రీకు వాక్యాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించినా కారణ సంబంధాన్ని ‘ఎందుకంటే’ మరియు ‘అందువల్లే’ ద్వారా కాపాడింది.
