id: MRK.12.18
reference: Mark 12:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται Σαδδουκαῖοι πρὸς αὐτόν, οἵτινες λέγουσιν ἀνάστασιν μὴ εἶναι, καὶ ⸀ἐπηρώτων αὐτὸν λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/018.yaml
  text: And Sadducees came to him, who say there is no resurrection, and they began questioning him, saying,
translation:
  language: te
  text: 'పునరుత్థానం లేదని చెప్పే సద్దూకయ్యులు ఆయన దగ్గరికి వచ్చి, ఆయనను ఇలా ప్రశ్నించడం మొదలుపెట్టారు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: సద్దూకయ్యులు
  rationale: చారిత్రక యూద మతవర్గానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: ἀνάστασιν
  choice: పునరుత్థానం
  rationale: మరణం నుండి తిరిగి లేవడాన్ని సూచించే స్థిరమైన, సందర్భోచిత తెలుగు పదం.
- source_word: ἐπηρώτων
  choice: ప్రశ్నించడం మొదలుపెట్టారు
  rationale: అపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న లేదా ఆరంభమైన ప్రశ్నించే చర్యను సహజ తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: సద్దూకయ్యుల పునరుత్థాన నిరాకరణ
  choice: పునరుత్థానం లేదని చెప్పే
  alternative: పునరుత్థానం లేదని నమ్మే
  rationale: λέγουσιν అంటే ప్రత్యక్షంగా ‘చెబుతారు’; వారి అభిప్రాయాన్ని ‘నమ్మే’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా మూలంలోని వాక్యరీతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే వాక్య నిర్మాణం. తరువాతి వచనంలోని ప్రత్యక్ష సంభాషణకు దారితీయడానికి చివరలో ద్విబిందువు వాడబడింది.
