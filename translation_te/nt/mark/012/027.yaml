source:
  edition: SBLGNT
  text: οὐκ ἔστιν ⸀θεὸς νεκρῶν ⸀ἀλλὰ ζώντων· ⸀πολὺ πλανᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/027.yaml
  text: He is not God of the dead[a], but of the living[b]. You are greatly mistaken.
translation:
  language: te
  text: ఆయన చనిపోయినవారి దేవుడు కాదు, జీవించేవారి దేవుడు.[a] మీరు చాలా పొరబడుతున్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత రూపపరంగా, “దేవుడు మృతుల దేవుడు కాదు, సజీవుల దేవుడు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీరు చాలా తప్పు చేస్తున్నారు,” లేదా “మీరు తీవ్రమైన తప్పులో ఉన్నారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸς
  choice: దేవుడు
  rationale: సందర్భంలో అబ్రాహాము, ఇస్సాకు, యాకోబుల దేవుడే ఉద్దేశించబడ్డాడు; కాబట్టి అనిర్దిష్టమైన ‘ఒక దేవుడు’ అనే భావం కాదు. సహజమైన తెలుగు వాక్యనిర్మాణం కోసం ముందున్న సందర్భం నుండి ‘ఆయన’ను సరఫరా చేశాం.
- source_word: νεκρῶν
  choice: చనిపోయినవారికి
  rationale: జన్యేటివ్ బహువచనం వ్యక్తులను సూచిస్తూ వాడబడింది. ‘మృతులు’ కంటే ‘చనిపోయినవారు’ సాధారణ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది; అలాగే జీవించేవారితో ఉన్న వ్యతిరేకతను నిలుపుతుంది.
- source_word: ἀλλὰ ζώντων
  choice: జీవించేవారికి దేవుడు
  rationale: ζώντων అనేది వ్యక్తులను సూచించే వర్తమాన కృదంతం. ‘జీవించేవారు’ మూలంలోని కొనసాగుతున్న జీవస్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది. సమతుల్యమైన తెలుగు వాక్యం కోసం ‘దేవుడు’ను మళ్లీ ఉంచాం.
- source_word: πολὺ
  choice: చాలా
  rationale: ఇది πλανᾶσθε క్రియను బలపరుస్తుంది. ‘చాలా’ ఆధునిక తెలుగులో సహజంగా ఆ తీవ్రతను తెలియజేస్తుంది.
- source_word: πλανᾶσθε
  choice: పొరబడుతున్నారు
  rationale: ఈ సందర్భంలో ఇది తప్పుదారిలో ఉండడం లేదా తీవ్రమైన అభిప్రాయదోషంలో ఉండడాన్ని సూచిస్తుంది. ‘పొరబడుతున్నారు’ బాహ్య మోసాన్నో ఉద్దేశపూర్వక తిరుగుబాటునో అనవసరంగా జోడించకుండా గద్దింపు బలాన్ని నిలుపుతుంది.
- source_word: οὐκ ἔστιν
  choice: ఆయన ... కాదు
  rationale: గ్రీకులో స్పష్టమైన కర్త సర్వనామం లేకపోయినా, ముందరి సందర్భంలోని దేవుణ్ణి సూచిస్తూ సహజమైన తెలుగులో ‘ఆయన’ను సరఫరా చేశాం. ‘కాదు’ నిషేధాన్ని నేరుగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుని ఎదుట జీవించడం మరియు పునరుత్థానం గురించి యేసు వాదనలోని సూచన
  choice: ‘చనిపోయినవారు’ మరియు ‘జీవించేవారు’ అనే వ్యతిరేకతను మాత్రమే నేరుగా అనువదించడం
  alternative: పునరుత్థానం లేదా మరణానంతర మధ్యస్థితి గురించి వివరణాత్మక సిద్ధాంత వాక్యాన్ని చేర్చడం
  rationale: ఈ మాట యేసు పునరుత్థాన వాదనలో భాగమైనప్పటికీ, వచనం స్వయంగా చెప్పినదానికంటే ఎక్కువగా ఏదైనా ప్రత్యేక సిద్ధాంత వివరణను అనువాదంలో చేర్చకూడదు. సరళమైన వ్యతిరేకత మూలపాఠంలోని భావబలాన్నీ theological tensionనూ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ప్రధాన పాఠంలో ‘చనిపోయినవారు/జీవించేవారు’ అనే సహజ జంటను ఎంచుకుని, మరింత రూపపరమైన ‘మృతులు/సజీవులు’ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం. యేసు గద్దింపు స్పష్టంగా ఉండేలా, కానీ మూలంలో లేని బాహ్య మోసం అనే భావాన్ని బలవంతంగా చేర్చకుండా అనువదించాం.
