id: MRK.12.25
reference: Mark 12:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅταν γὰρ ἐκ νεκρῶν ἀναστῶσιν, οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ εἰσὶν ὡς ⸀ἄγγελοι ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/025.yaml
  text: For when they rise from the dead[a], they neither marry nor are given in marriage, but are like angels in heaven.
translation:
  language: te
  text: ఎందుకంటే వారు మృతులలోనుండి లేచినప్పుడు పెళ్లి చేసుకోరు, వివాహానికి ఇవ్వబడరు; అయితే పరలోకంలోని దేవదూతల్లా ఉంటారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν γὰρ
  choice: ఎందుకంటే, ... లేచినప్పుడు
  rationale: γάρ యొక్క వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’తో, ὅταν యొక్క కాలార్థాన్ని ‘లేచినప్పుడు’తో సహజమైన తెలుగులో నిలిపింది.
- source_word: ἐκ νεκρῶν ἀναστῶσιν
  choice: వారు మృతులలోనుండి లేచినప్పుడు
  rationale: ἀναστῶσιν క్రియాశీల రూపాన్ని ‘లేచినప్పుడు’గా ఉంచి, ἐκ νεκρῶνను పునరుత్థాన సందర్భానికి తగిన ‘మృతులలోనుండి’గా అనువదించింది.
- source_word: οὔτε γαμοῦσιν οὔτε γαμίζονται
  choice: పెళ్లి చేసుకోరు, పెళ్లికి ఇవ్వబడరు
  rationale: 'రెండు గ్రీకు క్రియల మధ్య ఉన్న తేడాను కాపాడుతుంది: మొదటిది వివాహం చేసుకోవడం, రెండవది వివాహానికి ఇవ్వబడడం. తెలుగు ప్రతికూల సమాంతర నిర్మాణం భావాన్ని స్పష్టంగా అందిస్తుంది.'
- source_word: ἀλλ’ εἰσὶν
  choice: అయితే ... ఉంటారు
  rationale: ప్రస్తుత వివాహ పద్ధతులకు పునరుత్థాన జీవితం భిన్నమని చూపే వ్యతిరేక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὡς ἄγγελοι
  choice: దేవదూతల్లా
  rationale: ὡς పోలికను సూచిస్తుంది; పునరుత్థానమైనవారు దేవదూతలుగా మారతారని కాక, వారిలా ఉంటారని స్పష్టం చేస్తుంది.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: పరలోకాల్లో
  rationale: గ్రీకులోని బహువచన రూపాన్ని తెలుగులో సహజంగా, ప్రత్యక్షంగా నిలిపింది.
theological_decisions:
- issue: దేవదూతలతో పోలిక స్వభావం
  choice: పునరుత్థానమైనవారు దేవదూతల్లా ఉంటారు
  alternative: పునరుత్థానమైనవారు దేవదూతలుగా మారుతారు
  rationale: ὡς అనేది పోలికను సూచిస్తుంది, స్వరూపపరమైన ఏకత్వాన్ని కాదు. అందువల్ల ‘దేవదూతల్లా’ అనే రూపం మూలంలోని హద్దును కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘మృతులలోనుండి’ మూలంలోని ἐκ νεκρῶνను దగ్గరగా ప్రతిబింబిస్తుంది; ‘పెళ్లికి ఇవ్వబడరు’ రెండవ వివాహక్రియ యొక్క కర్మణి భావాన్ని నిలుపుతుంది.
