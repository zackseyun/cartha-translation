review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the explanatory-temporal force of ὅταν γάρ, the active resurrection verb ('లేచినప్పుడు'), the distinction between marrying and being given in marriage, and the comparative force of ὡς ('దేవదూతల్లా'). The main rendering 'పరలోకాల్లో' is a possible literal reflection of the Greek plural, but it is less idiomatic in modern standard Telugu than the singular collective expression 'పరలోకంలో'; the plural should be retained in the footnote.
  naturalness: The sentence is generally clear and contemporary. Removing the comma after 'ఎందుకంటే' and using 'వివాహానికి ఇవ్వబడరు' makes the correlative marriage wording more natural and precise. 'పరలోకంలోని దేవదూతల్లా' is smoother than 'పరలోకాల్లో ఉన్న దేవదూతల్లా.'
  terminology: '''మృతులలోనుండి,'' ''దేవదూతలు,'' and the comparison ''దేవదూతల్లా'' are appropriate. ''వివాహానికి ఇవ్వబడరు'' preserves the passive distinction of γαμίζονται without implying that resurrected persons become angels.'
  issues:
  - severity: low
    issue: Main text and footnote treatment of the Greek plural in ἐν τοῖς οὐρανοῖς is stylistically reversed from the audit trail.
    rationale: Modern Telugu naturally uses singular 'పరలోకంలో' here, while a footnote can report the Greek plural and offer 'పరలోకాల్లో' as the alternative.
  - severity: low
    issue: ‘పెళ్లికి ఇవ్వబడరు’ is slightly less precise idiomatically.
    rationale: ‘వివాహానికి ఇవ్వబడరు’ more clearly denotes being given in marriage and maintains a suitable respectful register.
  revised_text: ఎందుకంటే వారు మృతులలోనుండి లేచినప్పుడు పెళ్లి చేసుకోరు, వివాహానికి ఇవ్వబడరు; అయితే పరలోకంలోని దేవదూతల్లా ఉంటారు.
