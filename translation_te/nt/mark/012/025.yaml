- from: ఎందుకంటే, వారు మృతులలోనుండి లేచినప్పుడు పెళ్లి చేసుకోరు, పెళ్లికి ఇవ్వబడరు; పరలోకాల్లో[a] ఉన్న దేవదూతల్లా ఉంటారు.
  to: ఎందుకంటే వారు మృతులలోనుండి లేచినప్పుడు పెళ్లి చేసుకోరు, వివాహానికి ఇవ్వబడరు; అయితే పరలోకంలోని దేవదూతల్లా ఉంటారు.
  rationale: The revision preserves every relevant Greek distinction while using idiomatic modern Telugu. The singular collective expression ‘పరలోకంలోని’ is preferred in the text; the plural form of the Greek is transparently documented in the footnote. The comparative wording continues to indicate likeness to angels, not transformation into angels.
