  text: οἱ κατεσθίοντες τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσευχόμενοι· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/040.yaml
  text: who devour widows’ houses and for appearance’s sake pray at length—these will receive greater condemnation[a][b].
translation:
  language: te
  text: విధవరాళ్ల ఇళ్లను మింగివేస్తూ, నెపంగా[a] దీర్ఘంగా ప్రార్థించేవారు—వీరు మరింత తీవ్రమైన తీర్పును పొందుతారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పైకి కనిపించడానికి’ లేదా ‘ప్రదర్శన కోసం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మరింత గొప్ప తీర్పును పొందుతారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίοντες
  choice: మింగివేస్తారు
  rationale: ఇతరుల ఆస్తిని దోచుకొని హరించడాన్ని సూచించే బలమైన రూపకాన్ని నిలుపుతుంది; కేవలం ‘దోచుకుంటారు’ అని వివరణాత్మకంగా మార్చకుండా మూలంలోని నైతిక తీవ్రతను వ్యక్తం చేస్తుంది.
- source_word: οἰκίας
  choice: ఇళ్లను
  rationale: మూలంలోని స్పష్టమైన ‘ఇళ్లు’ అనే పదాన్ని నిలుపుతుంది. సందర్భంలో ఇది గృహాలు, కుటుంబ ఆస్తి లేదా జీవనాధారాన్ని సూచించవచ్చు; అయితే ప్రధాన పాఠ్యంలో దానిని విస్తరించి వ్యాఖ్యానించలేదు.
- source_word: χηρῶν
  choice: విధవరాళ్ల
  rationale: బలహీన సామాజిక స్థితిలో ఉన్న బాధితులను సూచించే సంబంధార్థక బహువచనాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: προφάσει
  choice: పైకి కనిపించడానికి
  rationale: బాహ్య ప్రదర్శన లేదా కపటమైన నెపం అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది. ‘నెపంగా’ అనే మరింత శాబ్దిక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: μακρὰ
  choice: దీర్ఘంగా
  rationale: ప్రార్థనలు ఎక్కువసేపు కొనసాగుతాయనే క్రియావిశేషణ భావాన్ని గౌరవప్రదంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: προσευχόμενοι
  choice: ప్రార్థిస్తారు
  rationale: గ్రీకు వర్తమాన కృదంతాన్ని తెలుగులో సహజమైన సమాపక క్రియగా ఇచ్చింది; ముందున్న ప్రవర్తనతో దాని సమన్వయం కొనసాగుతుంది.
- source_word: λήμψονται
  choice: పొందుతారు
  rationale: భవిష్యత్ కాలంలోని ‘పొందడం’ అనే భావాన్ని తీర్పు సందర్భానికి తగిన గంభీరమైన తెలుగులో నిలుపుతుంది.
- source_word: περισσότερον
  choice: మరింత తీవ్రమైన
  rationale: తులనాత్మక పరిమాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, రాబోయే శిక్షావిధి అధిక తీవ్రతను సూచిస్తుంది.
- source_word: κρίμα
  choice: శిక్షావిధి
  rationale: ఈ హెచ్చరిక సందర్భంలో తీర్పు యొక్క శిక్షాత్మక ఫలితాన్ని తెలియజేస్తుంది. విస్తృతార్థకమైన ‘తీర్పు’ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో భద్రపరిచింది.
theological_decisions:
- issue: మతకపటత్వంపై హెచ్చరికలో κρίμα పదం యొక్క భావబలం
  choice: శిక్షావిధి
  alternative: తీర్పు
  rationale: సందర్భం కేవలం పరిశీలనాత్మక తీర్పును కాక, దోపిడీ మరియు కపటత్వానికి కలిగే శిక్షాత్మక దైవిక జవాబుదారీతనాన్ని సూచిస్తుంది. అయినప్పటికీ ‘తీర్పు’ అనే విస్తృత భావాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా మూలపదపు అర్థవిస్తృతిని పూర్తిగా మూసివేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన శైలిని ఉపయోగించింది. ‘ఇళ్లను మింగివేస్తారు’ అనే ఉద్దేశపూర్వకంగా బలమైన రూపకాన్ని నిలిపి, προφάσει మరియు κρίμα పదాల నిజమైన అర్థవిస్తృతిని పాదటిప్పణుల్లో భద్రపరిచింది.
