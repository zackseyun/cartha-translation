- from: వీరు విధవరాళ్ల ఇళ్లను మింగివేస్తారు; పైకి కనిపించడానికి[a] దీర్ఘంగా ప్రార్థిస్తారు. వీరు మరింత తీవ్రమైన శిక్షావిధిని పొందుతారు[b].
  to: విధవరాళ్ల ఇళ్లను మింగివేస్తూ, నెపంగా[a] దీర్ఘంగా ప్రార్థించేవారు—వీరు మరింత తీవ్రమైన తీర్పును పొందుతారు[b].
  rationale: The revision replaces an appearance-only expression with ‘నెపంగా,’ which better represents the hypocritical pretext expressed by προφάσει. It also replaces the bureaucratic ‘శిక్షావిధి’ with ‘తీర్పు,’ modified as severe in accordance with the warning context, while a footnote preserves the Greek’s more literal comparative expression. The concrete metaphor ‘విధవరాళ్ల ఇళ్లను మింగివేస్తూ’ is retained.
