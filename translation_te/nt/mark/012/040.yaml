review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the two practices condemned and the future comparative κρίμα. However, ‘పైకి కనిపించడానికి’ weakens προφάσει, which more directly denotes a pretext, and ‘శిక్షావిధి’ narrows κρίμα into a technical legal sentence. The revision retains the Greek’s vivid metaphor and preserves the judgment/condemnation range.
  naturalness: ‘దీర్ఘంగా ప్రార్థిస్తారు’ is natural, but ‘శిక్షావిధి’ is comparatively bureaucratic in this warning. ‘మరింత తీవ్రమైన తీర్పు’ is idiomatic, solemn modern Telugu. The revised participial phrasing more clearly identifies the condemned group.
  terminology: ‘విధవరాళ్లు,’ ‘ఇళ్లు,’ and ‘మింగివేయడం’ appropriately retain the concrete and vivid source-language imagery. ‘నెపంగా’ best represents προφάσει; the outward-show sense is retained as an alternative. ‘తీర్పు’ is retained in the main text, qualified contextually as severe, with the more literal comparative phrasing footnoted.
  issues:
  - severity: medium
    issue: ‘పైకి కనిపించడానికి’ does not fully represent προφάσει.
    rationale: The Greek indicates acting under a pretext or pretence, not simply praying in a publicly visible manner. ‘నెపంగా’ more directly retains the hypocritical-cover sense.
  - severity: low
    issue: ‘శిక్షావిధి’ is overly technical and constricts κρίμα.
    rationale: While punitive judgment is clearly contextual, κρίμα itself can mean judgment. ‘మరింత తీవ్రమైన తీర్పు’ reflects the warning without making the term exclusively a formal legal sentence.
