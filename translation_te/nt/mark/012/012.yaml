id: MRK.12.12
reference: Mark 12:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐζήτουν αὐτὸν κρατῆσαι, καὶ ἐφοβήθησαν τὸν ὄχλον, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς τὴν παραβολὴν εἶπεν. καὶ ἀφέντες αὐτὸν ἀπῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/012.yaml
  text: And they were seeking to seize him[a], but they feared the crowd, for they knew that he had spoken the parable against them. So they left him and went away.
translation:
  language: te
  text: వారు ఆయనను పట్టుకోవడానికి ప్రయత్నిస్తూ ఉన్నారు, కానీ జనసమూహానికి భయపడ్డారు; ఎందుకంటే ఆయన ఆ ఉపమానం తమకు వ్యతిరేకంగా[a] చెప్పాడని వారు గ్రహించారు. వారు ఆయనను వదిలి వెళ్లిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమను ఉద్దేశించి’ లేదా ‘వారి గురించి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: ప్రయత్నించారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగిన లేదా ఫలించని ప్రయత్నాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘పట్టుకోవాలని ప్రయత్నించారు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: κρατῆσαι
  choice: పట్టుకోవాలని
  rationale: ఇక్కడ క్రియకు ‘పట్టుకోవడం, అదుపులోకి తీసుకోవడం’ అనే భావం ఉంది. ‘అరెస్టు చేయడం’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని అధికారిక న్యాయప్రక్రియను చేర్చినట్లవుతుంది.
- source_word: ἐφοβήθησαν τὸν ὄχλον
  choice: జనసమూహానికి భయపడ్డారు
  rationale: మూలంలోని నేరుగా ఉన్న భావాన్ని సహజమైన ఆధునిక తెలుగు ప్రయోగంతో వ్యక్తం చేస్తుంది.
- source_word: ἔγνωσαν
  choice: గ్రహించారు
  rationale: సందర్భంలో ఇది కేవలం సమాచారం తెలిసి ఉండడం కంటే, ఉపమానం తమను గురించేనని వారు గుర్తించిన భావాన్ని సూచిస్తుంది. ‘గ్రహించారు’ ఆ నిర్ధారిత గుర్తింపును సహజంగా తెలియజేస్తుంది.
- source_word: πρὸς αὐτοὺς
  choice: తమకు వ్యతిరేకంగా
  rationale: విరోధపూరిత సందర్భంలో ఉపమానం వారిని ప్రతికూలంగా లక్ష్యంగా చేసిందనే భావాన్ని ఇది తెలియజేస్తుంది. అయితే గ్రీకు పదబంధం ‘తమను ఉద్దేశించి’ లేదా ‘తమతో’ అనే విస్తృత భావాన్నీ అనుమతిస్తుంది; అందువల్ల ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: τὴν παραβολὴν
  choice: ఆ ఉపమానం
  rationale: నిర్దిష్ట ఉపపదం ముందున్న, వెంటనే గుర్తించగల ఉపమానాన్ని సూచిస్తుంది; తెలుగులో ‘ఆ ఉపమానం’ సహజంగా ఉంటుంది.
- source_word: εἶπεν
  choice: చెప్పాడని
  rationale: తెలుగు పరోక్ష వాక్య నిర్మాణంలో ‘చెప్పాడని’ ముందుగా జరిగిన క్రియను సందర్భానుసారంగా స్పష్టంగా తెలియజేస్తుంది; ప్రత్యేక పూర్వభూతకాల రూపం అవసరం లేదు.
- source_word: ἀφέντες αὐτὸν
  choice: ఆయనను వదిలి
  rationale: ఇక్కడ కృదంతం ఆయనను అక్కడే వదిలి తమ ప్రయత్నాన్ని మానుకున్నారని సూచిస్తుంది. ‘వదిలి’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: ἀπῆλθον
  choice: వెళ్లిపోయారు
  rationale: కథనంలోని అక్కడి నుండి నిష్క్రమించిన కదలికను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: πρὸς αὐτοὺς అనే పదబంధం ఉపమానం వారిని ప్రతికూలంగా లక్ష్యంగా చేసిందా, లేక కేవలం వారిని ఉద్దేశించిందా అనే భావవ్యాప్తి
  choice: తమకు వ్యతిరేకంగా
  alternative: తమను ఉద్దేశించి; తమతో
  rationale: సందర్భంలోని పట్టుకోవాలనే ప్రయత్నం ప్రతికూల భావానికి బలం ఇస్తుంది. అయినా πρός పదబంధంలోని నిజమైన విస్తృతతను పాదసూచికలో నిలుపుకున్నాం; తద్వారా ఒకే వ్యాఖ్యానాన్ని మూలంపై బలవంతంగా మోపలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘అరెస్టు చేయాలని’ వంటి సందర్భానుకూలమైనప్పటికీ మూలం కంటే నిర్దిష్టమైన న్యాయపరమైన పదాన్ని నివారించాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘తమకు వ్యతిరేకంగా’ అనే పదబంధం వెంట ఉంచాం.
