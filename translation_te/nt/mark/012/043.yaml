  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ ⸀εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ἡ χήρα αὕτη ἡ πτωχὴ πλεῖον πάντων ⸀ἔβαλεν τῶν βαλλόντων εἰς τὸ γαζοφυλάκιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/043.yaml
  text: And calling his disciples to himself[a], he said to them, “Truly I say to you that this poor widow has put in more than all those who are putting into the treasury.”
translation:
  language: te
  text: 'ఆయన తన శిష్యులను దగ్గరకు పిలిచి వారితో ఇలా అన్నాడు: “నేను మీతో నిజంగా చెబుతున్నాను: దేవాలయ ఖజానాలో[a] వేస్తున్న వారందరికంటే ఈ పేద విధవరాలు ఎక్కువ వేసింది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కానుకల పెట్టెలో” లేదా “కానుకల పాత్రలో.” గ్రీకు పదం దేవాలయ ఖజానాను, కానుకల పాత్రను, లేదా కానుకలు స్వీకరించే స్థలాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: తన శిష్యులను దగ్గరకు పిలిచి
  rationale: మధ్యమ ప్రయోగంలోని ‘తన దగ్గరకు పిలుచుకోవడం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ప్రధాన క్రియకు ముందున్న చర్యను కృదంత నిర్మాణంతో ఉంచుతుంది.
- source_word: μαθητὰς
  choice: శిష్యులను
  rationale: యేసును అనుసరిస్తూ ఆయన వద్ద నేర్చుకునేవారిని సూచించే స్థిరమైన, సహజమైన నూతన నిబంధన పదం.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: నేను మీతో నిశ్చయంగా చెబుతున్నాను
  rationale: Ἀμήν అనే గంభీరమైన ధృవీకరణ సూత్రంలోని బలాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: χήρα
  choice: విధవరాలు
  rationale: మూలపదానికి నేరమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: πτωχὴ
  choice: పేద
  rationale: మూలంలోని సాధారణ అర్థాన్ని అతిశయింపకుండా తెలియజేస్తుంది.
- source_word: πλεῖον πάντων
  choice: వారందరికంటే ... ఎక్కువ
  rationale: ఇతర దాతలందరితో ఉన్న పోలికను నిలుపుతుంది; ‘ఎక్కువ’ ఏ ప్రమాణంలో అన్నది ప్రధాన వాక్యంలో వివరించకుండా సందర్భానికే వదిలేస్తుంది.
- source_word: ἔβαλεν
  choice: వేసింది
  rationale: కానుకల పెట్టెలో ధనం వేయడాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ, పూర్తయిన చర్యను సూచిస్తుంది.
- source_word: τῶν βαλλόντων
  choice: వేస్తున్న వారు
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న చర్యను నిలుపుతుంది.
- source_word: γαζοφυλάκιον
  choice: కానుకల పెట్టె
  rationale: దేవాలయంలో కానుకలు వేసే పాత్రను సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; విస్తృతమైన ‘ఖజానా’ భావాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: విధవరాలి కానుక గురించి యేసు చేసిన అంచనా
  choice: ‘వారందరికంటే ... ఎక్కువ’ అనే నేరమైన పోలికను నిలుపడం
  alternative: ఆమె ఇచ్చిన నగదు మొత్తం సంఖ్యాపరంగా అందరిదానికంటే ఎక్కువని చెప్పడం; లేదా ఆమె త్యాగమే ఎక్కువని ప్రధాన వాక్యంలో స్పష్టీకరించడం
  rationale: తదుపరి వచనం ఆమె పేదరికంలోనుండి ఇచ్చిందని వివరిస్తుంది. ఈ వచనం మాత్రం పోలికను ఏ ప్రమాణంలో చేశాడో ప్రత్యక్షంగా చెప్పదు; అందువల్ల అనువాదం ఆ ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ పాతకాలపు క్రియారూపాలను నివారించింది. ఉద్ధరణలోని ప్రకటన సూటిగా, సాధారణ పాఠకునికి అర్థమయ్యేలా ఉంది.
