id: MRK.12.23
reference: Mark 12:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν τῇ ἀναστάσει ⸂ὅταν ἀναστῶσιν⸃ τίνος αὐτῶν ἔσται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/023.yaml
  text: In the resurrection[a], when they rise, whose wife will she be? For the seven had her as wife.
translation:
  language: te
  text: పునరుత్థానంలో, వారు లేచినప్పుడు[a], ఆమె వారిలో ఎవరికి భార్య అవుతుంది? ఎందుకంటే ఆ ఏడుగురూ ఆమెను భార్యగా కలిగి ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేక, “వారు మళ్లీ లేచినప్పుడు.” గ్రీకు మూలంలో కేవలం “వారు లేచినప్పుడు” అని ఉంది; పునరుత్థాన సందర్భం ‘మళ్లీ’ అనే భావాన్ని అందిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάστασις
  choice: పునరుత్థానం
  rationale: సద్దూకయ్యులతో జరుగుతున్న చర్చలో ఇది అంత్యకాలంలో మృతులు లేవడాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘పునరుత్థానం’ స్థిరపడిన, సహజమైన సమానార్థకం.
- source_word: ὅταν ἀναστῶσιν
  choice: వారు లేచినప్పుడు
  rationale: ὅταν తో కూడిన aorist subjunctive భవిష్యత్తులో జరిగే సమయాన్ని సూచిస్తుంది. ‘మళ్లీ’ అనే భావం సందర్భంలో ఉన్నప్పటికీ గ్రీకులో ప్రత్యక్షంగా లేదు కాబట్టి ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: τίνος αὐτῶν
  choice: వారిలో ఎవరికి
  rationale: ప్రశ్నార్థక షష్ఠీ విభక్తి, దానితో ఉన్న సమూహార్థక ప్రయోగం తెలుగులో ‘వారిలో ఎవరికి’ అని సహజంగా వ్యక్తమవుతుంది.
- source_word: ἔσται γυνή
  choice: భార్యగా ఉంటుంది
  rationale: ఇది ఆమె ఎవరితో భార్యాభర్తల సంబంధంలో ఉంటుందో అడుగుతుంది. గ్రీకులో γυνή ముందు article లేకపోయినా తెలుగులో ‘భార్యగా’ అనే రూపం సహజంగా సంబంధాన్ని తెలియజేస్తుంది.
- source_word: γυνή
  choice: భార్య
  rationale: రెండు చోట్లా వివాహ సంబంధమే సందర్భం; అందువల్ల విస్తృతార్థమైన ‘స్త్రీ’ కంటే ‘భార్య’ సరైనది.
- source_word: οἱ γὰρ ἑπτὰ
  choice: ఆ ఏడుగురికీ ... కదా
  rationale: γάρ ప్రశ్నకు వివరణాత్మక ఆధారాన్ని ఇస్తుంది. తెలుగులో వాక్యాంత ‘కదా’ ఆ కారణభావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ముందటి సందర్భం వారిని గుర్తిస్తుంది కాబట్టి ‘పురుషులు’ లేదా ‘సోదరులు’ అని అదనంగా చేర్చలేదు.
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: ఆమె భార్యగా ఉంది
  rationale: గ్రీకు ప్రయోగం వివాహ సంఘటనకన్నా భార్యగా ఉన్న సంబంధస్థితిని చెబుతుంది. ‘ఆ ఏడుగురికీ ఆమె భార్యగా ఉంది’ అనేది తెలుగులో సహజంగా ఉండి, ఒక్కొక్కరికి వరుసగా భార్యగా ఉన్నదనే ముందటి సందర్భంతో సరిపోతుంది.
theological_decisions:
- issue: సద్దూకయ్యులతో వాదనలో పునరుత్థాన భాష
  choice: పునరుత్థానంలో, వారు లేచినప్పుడు
  alternative: మృతుల పునరుత్థానంలో, వారు మళ్లీ లేచినప్పుడు
  rationale: ఈ వచనం భవిష్యత్తులో జరిగే పునరుత్థానాన్ని ఊహిస్తుంది; అయితే గ్రీకులో లేని ‘మృతుల’ లేదా ‘మళ్లీ’ అనే పదాలను ప్రధాన పాఠ్యంలో చేర్చకుండా మూలంలోని సంక్షిప్తతను, భావ ఉద్రిక్తతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన సంభాషణ శైలిని వాడాం. మొదటి వాక్యంలో మూలంలోని పునరుక్తి—‘పునరుత్థానంలో ... లేచినప్పుడు’—ఉద్దేశపూర్వకంగా నిలిపాం. చివరి కారణ వాక్యంలో γάρ భావాన్ని సహజమైన తెలుగు ‘కదా’ ద్వారా తెలిపాం.
