translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఇది ముందరి వచనంలో ప్రారంభమైన క్రియకు కొనసాగింపుగా ఉన్న మూల గ్రీకు ఖండవాక్యం కాబట్టి, తెలుగులో అర్థస్పష్టత కోసం ‘కోరుకుంటారు’ను సందర్భానుసారంగా పూరించింది.
