language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὁ Ἰησοῦς ἰδὼν ⸀αὐτὸν ὅτι νουνεχῶς ἀπεκρίθη εἶπεν αὐτῷ· Οὐ μακρὰν εἶ ἀπὸ τῆς βασιλείας τοῦ θεοῦ. καὶ οὐδεὶς οὐκέτι ἐτόλμα αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/034.yaml
  text: And Jesus[a], seeing that he had answered wisely, said to him, “You are not far from the kingdom of God.” And no one any longer dared to question him.
translation:
  language: te
  text: 'యేసు, అతను వివేకంగా జవాబిచ్చాడని గమనించి, అతనితో ఇలా అన్నాడు: “నీవు దేవుని రాజ్యానికి దూరంగా లేవు[a].” ఇక ఎవరూ ఆయనను ప్రశ్నించడానికి సాహసించలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు దేవుని రాజ్యానికి సమీపంలో ఉన్నావు.” గ్రీకు పాఠం సమీపాన్ని సూచిస్తుంది గానీ, రాజ్యంలో ప్రవేశించడాన్ని స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: గమనించి
  rationale: ఇక్కడ చూడడం కేవలం కంటితో చూడడం కాదు; అతని జవాబులోని వివేకాన్ని గుర్తించడం. ‘గమనించి’ అనేది ఆ పరిశీలనాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: νουνεχῶς
  choice: వివేకంగా
  rationale: ఈ క్రియావిశేషణం తెలివి, సరైన అవగాహన, మంచి నిర్ణయశక్తితో జవాబివ్వడాన్ని సూచిస్తుంది. ‘వివేకంగా’ ప్రశంసాత్మక భావాన్ని అతిశయింపకుండా నిలుపుతుంది.
- source_word: ἀπεκρίθη
  choice: జవాబిచ్చాడని
  rationale: యేసు మాట్లాడటానికి ముందు అతడు ఇచ్చిన జవాబును గమనించిన క్రమాన్ని తెలుగు వాక్య నిర్మాణంలో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: Οὐ μακρὰν εἶ ἀπὸ
  choice: నీవు … దూరంగా లేవు
  rationale: మూలంలోని స్థలసంబంధ రూపకాన్ని నేరుగా నిలుపుతూ, సమీపాన్ని సూచిస్తుంది; అయితే రాజ్యంలో ప్రవేశించాడని చెప్పదు.
- source_word: βασιλείας τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: ఇది సువార్తల సందర్భంలో స్థిరంగా అర్థమయ్యే పదబంధం; దేవుని పాలన, రాజ్య పరిధి అనే రెండు భావసూచనలను తెరిచి ఉంచుతుంది.
- source_word: οὐκέτι
  choice: ఆ తర్వాత … ఎవరూ
  rationale: ఆ సంఘటన నుంచి ఇకపై ఎవరూ ప్రశ్నించడానికి ముందుకు రాలేదనే కాలసంబంధ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐτόλμα
  choice: సాహసించలేదు
  rationale: ప్రశ్న అడగడానికి ధైర్యం చేయకపోవడాన్ని స్పష్టంగా, సమకాలీన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπερωτῆσαι
  choice: ప్రశ్నించడానికి
  rationale: సందర్భంలో ఇది సాధారణంగా అడగడం కంటే ప్రశ్నలు వేసి పరీక్షించే ఛాయను కలిగి ఉంది. ‘ప్రశ్నించడానికి’ ఆ భావాన్ని అతిగా కఠినం చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: శాస్త్రి దేవుని రాజ్యానికి సంబంధించిన స్థితి
  choice: “నీవు దేవుని రాజ్యానికి దూరంగా లేవు” అని అనువదించి, సమీపాన్ని మాత్రమే పేర్కొనడం
  alternative: “నీవు దేవుని రాజ్యానికి సమీపంలో ఉన్నావు”
  rationale: గ్రీకు వాక్యం అతడు రాజ్యంలో ప్రవేశించాడని లేదా రాజ్యాన్ని పొందాడని స్పష్టంగా చెప్పదు. అతని వివేకాన్ని యేసు ప్రశంసిస్తూనే, అతని స్థితి గురించి ఉన్న వేదాంతపరమైన ఉద్వేగాన్ని అనువాదం అలాగే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ఆయన’ అనే గౌరవసూచక సర్వనామం యేసును సూచిస్తుంది; మూలంలోని భావాన్ని మతశాఖాపరమైన వివరణతో విస్తరించలేదు.
