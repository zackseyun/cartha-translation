source:
  edition: SBLGNT
  text: Καὶ προσελθὼν εἷς τῶν γραμματέων ἀκούσας αὐτῶν συζητούντων, ⸀ἰδὼν ὅτι καλῶς ⸂ἀπεκρίθη αὐτοῖς⸃, ἐπηρώτησεν αὐτόν· Ποία ἐστὶν ⸂ἐντολὴ πρώτη πάντων⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/028.yaml
  text: And one of the scribes came up and heard them debating, and seeing that he had answered them well, he asked him, “Which commandment is the first of all?”
translation:
  language: te
  text: 'ధర్మశాస్త్ర పండితులలో ఒకడు దగ్గరకు వచ్చి, వారు వాదించుకుంటుండగా విని, యేసు వారికి చక్కగా జవాబిచ్చాడని గ్రహించి, ఆయనను ఇలా అడిగాడు: “అన్ని ఆజ్ఞల్లో మొదటిది[a] ఏది?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అన్నిటికంటే ప్రధానమైనది” లేదా “అన్నిటికంటే ముఖ్యమైనది.”
    reason: πρώτη అనే పదం క్రమంలో మొదటిదనే భావంతో పాటు స్థానం లేదా ప్రాముఖ్యంలో అగ్రగణ్యమైనదనే భావాన్నీ కలిగి ఉండగలదు.
lexical_decisions:
- source_word: γραμματέων
  choice: ధర్మశాస్త్ర పండితుల్లో
  rationale: సువార్తల సందర్భంలో ఈ పదం యూదుల ధర్మశాస్త్రంలో గుర్తింపు పొందిన నిపుణులను సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు వారి పాత్రను స్పష్టంగా, సహజంగా తెలియజేయడానికి ‘ధర్మశాస్త్ర పండితులు’ ఎంచుకున్నాం.
- source_word: προσελθὼν
  choice: దగ్గరకు వచ్చి
  rationale: యేసు ఉన్న చోటికి సమీపించడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀκούσας αὐτῶν συζητούντων
  choice: వారు చర్చించుకోవడం విన్నాడు
  rationale: సυζητέωలో చర్చ లేదా వాదోపవాదం అనే భావాలు ఉన్నాయి. అనవసరంగా శత్రుత్వాన్ని సూచించకుండా సందర్భంలోని బహిరంగ సంభాషణను ‘చర్చించుకోవడం’ తెలియజేస్తుంది.
- source_word: ἰδὼν ὅτι καλῶς ἀπεκρίθη αὐτοῖς
  choice: యేసు వారికి చక్కగా జవాబిచ్చాడని గ్రహించి
  rationale: కర్త ఎవరో తెలుగులో స్పష్టంగా ఉండేందుకు ‘యేసు’ అని పేర్కొన్నాం. καλῶςను తీర్పును అతిగా వివరించకుండా ‘చక్కగా’ అని అనువదించాం.
- source_word: ἐπηρώτησεν
  choice: అడిగాడు
  rationale: సందర్భానికి సరిపోయే సాధారణ, సహజమైన తెలుగు క్రియ.
- source_word: Ποία
  choice: ఏది
  rationale: అనేక ఆజ్ఞలలో ఒకదాన్ని గుర్తించమనే ప్రశ్నను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐντολή
  choice: ఆజ్ఞ
  rationale: దైవిక ఆదేశం లేదా ధర్మశాస్త్ర ఆజ్ఞ అనే బైబిలు భావాన్ని సంక్షిప్తంగా, ప్రామాణికంగా వ్యక్తం చేస్తుంది.
- source_word: πρώτη πάντων
  choice: అన్ని ఆజ్ఞల్లో మొదటిది
  rationale: πρώτη యొక్క ‘మొదటిది’ అనే మూల రూపాన్ని నిలుపుతూ, అది క్రమంలో మొదటిదా లేదా ప్రాముఖ్యంలో అగ్రస్థానమా అనే భావవిస్తృతిని పాఠ్యంలోనే పరిష్కరించకుండా ఉంచుతుంది.
theological_decisions:
- issue: ఆజ్ఞకు సంబంధించి πρώτη యొక్క భావం
  choice: మొదటిది
  alternative: అన్నిటికంటే ముఖ్యమైనది; ప్రధానమైనది; గొప్పది
  rationale: గ్రీకు πρώτη క్రమంలోని మొదటి స్థానాన్నీ, ప్రాధాన్యంలో అగ్రస్థానాన్నీ సూచించగలదు. మూలంలోని నిజమైన భావవిస్తృతిని కాపాడేందుకు ప్రధాన పాఠ్యంలో ‘మొదటిది’ ఉంచి, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘శాస్త్రి’ అనే అస్పష్ట లేదా పాత వాడుకకు బదులుగా పాత్రను స్పష్టపరిచే ‘ధర్మశాస్త్ర పండితుడు’ ఎంచుకున్నాం. పొడవైన గ్రీకు వాక్య నిర్మాణాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించి పఠన సౌలభ్యం కల్పించాం.
