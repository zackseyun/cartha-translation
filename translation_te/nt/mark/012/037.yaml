  text: ⸀αὐτὸς Δαυὶδ λέγει αὐτὸν κύριον, καὶ πόθεν ⸂αὐτοῦ ἐστιν υἱός⸃; καὶ ὁ πολὺς ὄχλος ἤκουεν αὐτοῦ ἡδέως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/037.yaml
  text: David himself calls him Lord[b][a], so how is he his son? And the large crowd was listening to him gladly.
translation:
  language: te
  text: దావీదే ఆయనను ‘ప్రభువు’ అని పిలుస్తున్నాడు. అలాంటప్పుడు ఆయన దావీదు కుమారుడు[a] ఎలా అవుతాడు?[b] పెద్ద జనసమూహం ఆయనను సంతోషంగా వింటూ ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘కుమారుడు’ అనే మాట ‘దావీదు కుమారుడు’ అనే మెస్సీయ బిరుదును ప్రతిధ్వనిస్తుంది; దీనికి విస్తృతంగా ‘వంశస్థుడు’ అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'మరింత అక్షరార్థంగా: “ఆయన అతని కుమారుడు ఎక్కడి నుండి?” అంటే, “ఏ ఆధారంగా ఆయన అతని కుమారుడు?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: దావీదే
  rationale: αὐτός ఇచ్చే వ్యక్తిగత ఉద్ఘాటనను తెలుగులో సహజమైన ‘ఏ’ ప్రత్యయంతో నిలిపింది.
- source_word: λέγει αὐτὸν κύριον
  choice: ఆయనను ‘ప్రభువు’ అని పిలుస్తున్నాడు
  rationale: ఈ నిర్మాణం కేవలం చెప్పడాన్ని కాక, ఒకరిని ఒక బిరుదుతో సంబోధించడం లేదా పేర్కొనడాన్ని సూచిస్తుంది; వర్తమాన కాలాన్ని కూడా నిలిపింది.
- source_word: κύριον
  choice: ప్రభువు
  rationale: లేఖనసంబంధమైన మరియు క్రీస్తుసంబంధమైన బిరుదు బలాన్ని నిలిపే సహజ తెలుగు పదం.
- source_word: πόθεν
  choice: అలాంటప్పుడు ... ఎలా
  rationale: అక్షరార్థంగా ‘ఎక్కడి నుండి’ అయినా, ఇక్కడ తార్కిక ఆధారాన్ని ప్రశ్నిస్తుంది; ‘అలాంటప్పుడు ... ఎలా’ వాదన ప్రవాహాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: αὐτοῦ ἐστιν υἱός
  choice: ఆయన దావీదు కుమారుడు ... అవుతాడు
  rationale: ‘కుమారుడు’ అనే పదాన్ని నిలిపి ‘దావీదు కుమారుడు’ అనే మెస్సీయ బిరుదుతో ఉన్న ప్రతిధ్వనిని కాపాడింది; తెలుగులో సర్వనామ సందిగ్ధత తగ్గేందుకు ‘దావీదు’ను మళ్లీ పేర్కొంది.
- source_word: ὁ πολὺς ὄχλος
  choice: పెద్ద జనసమూహం
  rationale: సామాజిక వర్గం అనే భావాన్ని చేర్చకుండా, సంఖ్యాపరంగా పెద్ద గుంపు అనే అర్థాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: ἤκουεν αὐτοῦ
  choice: ఆయన మాటలను ... వింటూ ఉండేది
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న వినికిడిని ‘వింటూ ఉండేది’ తెలియజేస్తుంది; తెలుగు సహజత్వం కోసం ఉద్దేశ్యాన్ని ‘ఆయన మాటలను’గా వ్యక్తం చేసింది.
- source_word: ἡδέως
  choice: సంతోషంగా
  rationale: ఆనందంతో, ఇష్టంగా వినడాన్ని ఆధునిక సాధారణ తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దావీదు మెస్సీయను ‘ప్రభువు’ అని పిలవడంలోని క్రీస్తుసంబంధమైన బలం
  choice: ‘ప్రభువు’ అనే ప్రత్యక్ష బిరుదును, దాని వెంట వచ్చే ప్రశ్నలోని ఉద్రిక్తతను వివరణాత్మక విస్తరణ లేకుండా నిలిపింది.
  alternative: ‘మెస్సీయను ప్రభువు’ అని పాఠ్యంలోనే స్పష్టీకరించడం
  rationale: వచనం మెస్సీయ దావీదు వంశస్థుడు మాత్రమే కాదనే దిశలో ప్రశ్న లేవనెత్తుతుంది; అయితే ఆ ప్రశ్నకు సిద్ధాంతపరమైన పూర్తి సమాధానాన్ని అనువాదంలో చేర్చకూడదు.
- issue: మెస్సీయ సందర్భంలో υἱός అనువాదం
  choice: కుమారుడు
  alternative: వంశస్థుడు
  rationale: ‘వంశస్థుడు’ ఉద్దేశించిన వంశపారంపర్య భావాన్ని స్పష్టం చేసినా, ‘కుమారుడు’ మూలపదాన్ని మరియు ‘దావీదు కుమారుడు’ అనే పరిచిత మెస్సీయ బిరుదుతో ఉన్న వాక్చాతుర్య సంబంధాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘దావీదే’ ఉద్ఘాటనను సంక్షిప్తంగా నిలుపుతుంది; ‘వింటూ ఉండేది’ కొనసాగుతున్న చర్యను తెలియజేస్తుంది. పాఠ్యంలో ప్రతి పాదసూచిక గుర్తు [a], [b] చేర్చబడింది.
