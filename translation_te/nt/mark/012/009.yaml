id: MRK.12.9
reference: Mark 12:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀τί ποιήσει ὁ κύριος τοῦ ἀμπελῶνος; ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργούς, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/009.yaml
  text: What will the owner of the vineyard do? He will come and destroy the tenant farmers[a], and give the vineyard to others.
translation:
  language: te
  text: ద్రాక్షతోట యజమాని ఏమి చేస్తాడు? అతడు వచ్చి ఆ కౌలు రైతులను నాశనం చేసి, ద్రాక్షతోటను ఇతరులకు ఇస్తాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί ποιήσει
  choice: ఏమి చేస్తాడు?
  rationale: గ్రీకు ప్రశ్నలో లేని అదనపు అనుసంధాన భావాన్ని చేర్చకుండా, భవిష్యత్ క్రియతో కూడిన ప్రశ్నను సహజమైన ఆధునిక తెలుగులో నేరుగా తెలిపింది.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: ద్రాక్షతోట యజమాని
  rationale: ఈ ఉపమాన సందర్భంలో κύριος ద్రాక్షతోటకు చెందిన యజమానిని సూచిస్తుంది; ‘ప్రభువు’ అనే దైవిక బిరుదు భావాన్ని అనవసరంగా దిగుమతి చేయకుండా సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἀμπελῶνος / ἀμπελῶνα
  choice: ద్రాక్షతోట
  rationale: ἀμπελών అనే వ్యవసాయ పదానికి ప్రామాణికమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: ἐλεύσεται
  choice: అతడు వచ్చి
  rationale: యజమాని స్వయంగా జోక్యం చేసుకోవడానికి రావడాన్ని సహజంగా తెలియజేస్తూ, తరువాతి భవిష్యత్ క్రియలతో తెలుగు వాక్యాన్ని సాఫీగా కలుపుతుంది.
- source_word: ἀπολέσει
  choice: నాశనం చేసి
  rationale: ἀπόλλυμι సూచించే తీవ్రమైన, నిర్ణాయక తీర్పును నిలుపుతుంది; ‘చంపి’ కంటే మూలపదంలోని విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: τοὺς γεωργούς
  choice: ఆ కౌలు రైతులను
  rationale: వారు కేవలం కూలీలు లేదా సాగుదారులు కాక, మరొకరి ద్రాక్షతోటను కౌలుకు తీసుకుని సాగు చేస్తున్నవారని ఉపమాన సందర్భం సూచిస్తుంది; ‘కౌలు రైతులు’ వ్యవసాయం మరియు కౌలు అనే రెండు పార్శ్వాలనూ అందిస్తుంది.
- source_word: δώσει
  choice: ఇస్తాడు
  rationale: δίδωμι యొక్క విస్తృత, నేరమైన అర్థాన్ని నిలుపుతుంది; ‘అప్పగిస్తాడు’ లేదా ‘కౌలుకు ఇస్తాడు’ అని మూలంలో ఉన్నదానికంటే ఎక్కువగా నిర్దిష్టం చేయదు.
- source_word: ἄλλοις
  choice: ఇతరులకు
  rationale: గ్రీకులోలాగే ఎవరనే విషయాన్ని తెరిచి ఉంచే సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: ఉపమానంలోని మానవ సూచితార్థానికి κύριος అనువాదం
  choice: యజమాని
  alternative: ప్రభువు / యజమానుడు
  rationale: తక్షణ కథా సందర్భంలో ఈ పదం ద్రాక్షతోట సొంతదారుని సూచిస్తుంది. ‘యజమాని’ అని అనువదించడం మూలభాషా సందర్భాన్ని అనుసరిస్తుంది; అదే సమయంలో ఉపమానం కలిగించే విస్తృతమైన దైవశాస్త్ర సంబంధాలను పదంలోనే బలవంతంగా చేర్చకుండా సందర్భం ద్వారా వెలువడనిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన ఉపమాన శైలి ఉపయోగించబడింది. గ్రీకు వాక్యంలోని ప్రశ్న, భవిష్యత్ చర్యలు, తీర్పు తీవ్రత, అలాగే ‘ఇతరులు’ అనే అనిర్దిష్టత కాపాడబడ్డాయి.
