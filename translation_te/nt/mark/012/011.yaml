translation:
  language: te
  text: ఇది ప్రభువు నుండి వచ్చింది[a][b], మరియు అది మన కళ్లకు అద్భుతమైనది.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువు చేత.” గ్రీకు పదబంధం మూలాన్ని లేదా కర్తృత్వాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ఈ పంక్తి కీర్తన 118:23 నుండి ఉల్లేఖించబడింది.
    reason: cross_reference
lexical_decisions:
- source_word: παρὰ κυρίου
  choice: ప్రభువు నుండే
  rationale: παρά + షష్ఠీ విభక్తి ఇక్కడ మూలాన్ని లేదా కర్తృత్వాన్ని సూచించగలదు. ‘ప్రభువు నుండి’ అనే మూలార్థాన్ని సహజమైన తెలుగులో చూపిస్తూ, ఉద్ఘాటన కోసం ‘నుండే’ ఎంచుకున్నాం.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: గ్రీకు కొత్త నిబంధనలోని κύριος పదాన్ని సహజంగా ‘ప్రభువు’గా అనువదించాం. ఇది కీర్తన 118:23లో దేవుణ్ణి సూచిస్తున్నప్పటికీ, మూల గ్రీకు రూపాన్నే అనుసరించాం.
- source_word: ἐγένετο
  choice: జరిగింది
  rationale: γίνομαι ఇక్కడ ‘సంభవించింది/కలిగింది’ అనే విస్తృత భావంలో ఉంది. ‘జరిగింది’ ఆధునిక తెలుగులో సహజంగా ఉండి, ఇది ప్రభువు మూలంగా జరిగినదనే భావాన్ని సందర్భంతో తెలియజేస్తుంది.
- source_word: αὕτη
  choice: ఇది
  rationale: ఈ స్త్రీలింగ నిర్దేశక సర్వనామం ముందు వాక్యంలో చెప్పిన తిరస్కరించబడిన రాయి మూలరాయిగా కావడాన్ని సూచిస్తుంది. ‘ఈ రాయి’ అని మూలంలో లేని పదాన్ని చేర్చకుండా ‘ఇది’గా ఉంచాం.
- source_word: θαυμαστὴ
  choice: అద్భుతంగా
  rationale: θαυμαστός ఆశ్చర్యకరమైన, అద్భుతమైనదాన్ని సూచిస్తుంది. ‘అద్భుతంగా ఉంది’ కీర్తనాత్మక గంభీరతను నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: ἐν ὀφθαλμοῖς ἡμῶν
  choice: మన కళ్లకు
  rationale: మూలంలోని నేత్రాల రూపకాన్ని నిలుపుతూ, తెలుగులో సహజమైన ‘మన కళ్లకు’ అనే ప్రయోగాన్ని ఎంచుకున్నాం; భావం ‘మన దృష్టిలో/మనకు’.
theological_decisions:
- issue: దేవుణ్ణి సూచించే కీర్తన ఉల్లేఖనంలో κύριος అనువాదం
  choice: ప్రభువు
  alternative: యెహోవా
  rationale: నేపథ్య హీబ్రూ కీర్తనలో దైవనామం ఉన్నప్పటికీ, ఇక్కడి గ్రీకు కొత్త నిబంధన పాఠం κυρίου అని ఉంది. అందువల్ల నేపథ్య దైవనామాన్ని ప్రధాన పాఠ్యంలోకి దిగుమతి చేయకుండా ‘ప్రభువు’గా అనువదించాం.
- issue: παρὰ κυρίουలో మూలం మరియు కర్తృత్వం మధ్య అర్థ ఛాయ
  choice: ప్రభువు నుండే
  alternative: ప్రభువు చేతనే
  rationale: గ్రీకు పదబంధం మూలాన్ని లేదా కర్తృత్వాన్ని వ్యక్తం చేయగలదు. ప్రధాన పాఠ్యంలో మూల భావాన్ని ముందుకు తెచ్చి, కర్తృత్వ అనువాదాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, కీర్తన ఉల్లేఖనానికి తగిన గంభీరతను నిలిపాం. వచనం కొనసాగుతున్న ప్రత్యక్ష ఉల్లేఖనంలో భాగమైనందున చివర ముగింపు ఉద్ధరణ గుర్తు ఉంచబడింది.
