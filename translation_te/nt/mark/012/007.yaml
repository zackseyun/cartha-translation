  edition: SBLGNT
  text: ἐκεῖνοι δὲ οἱ γεωργοὶ ⸂πρὸς ἑαυτοὺς εἶπαν⸃ ὅτι Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτόν, καὶ ἡμῶν ἔσται ἡ κληρονομία.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/007.yaml
  text: But those tenant farmers said to one another[a], ‘This is the heir. Come, let us kill him[b], and the inheritance will be ours.’
translation:
  language: te
  text: అయితే ఆ కౌలు రైతులు ఒకరితో ఒకరు, ‘ఇతడే వారసుడు. రండి, ఇతన్ని చంపేద్దాం; మరి వారసత్వం మనదవుతుంది’ అని చెప్పుకున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκεῖνοι δὲ οἱ γεωργοὶ
  choice: అయితే ఆ కౌలు రైతులు
  rationale: δέ లోని స్వల్ప వ్యతిరేక భావాన్ని ‘అయితే’ సహజంగా తెలియజేస్తుంది; ἐκεῖνοι లోని సూచనార్థాన్ని ‘ఆ’ నిలుపుతుంది. ద్రాక్షతోటను యజమాని నుండి తీసుకొని సాగుచేసే వారి పాత్రను γεωργοί సందర్భానుసారంగా ‘కౌలు రైతులు’ స్పష్టం చేస్తుంది.
- source_word: πρὸς ἑαυτοὺς εἶπαν
  choice: ఒకరితో ఒకరు ... అని చెప్పుకున్నారు
  rationale: సమూహంలోని పరస్పర సంభాషణను ఈ సహజ తెలుగు ప్రయోగం తెలియజేస్తుంది; కేవలం మనసులో అనుకున్నారనే భావాన్ని కలిగించదు.
- source_word: Οὗτός ἐστιν ὁ κληρονόμος
  choice: ఇతడే వారసుడు
  rationale: Οὗτός లోని సమీప సూచనను ‘ఇతడు’, వాక్యంలోని గుర్తింపు/ఉద్ఘాటనను ‘ఏ’ నిలుపుతాయి; κληρονόμος కు సహజమైన న్యాయ-కుటుంబ పదం ‘వారసుడు’.
- source_word: δεῦτε ἀποκτείνωμεν αὐτόν
  choice: రండి, ఇతన్ని చంపేద్దాం
  rationale: δεῦτε లోని ఆహ్వానాత్మక ప్రేరణను ‘రండి’ తెలియజేస్తుంది; హోర్తేటివ్ సబ్జంక్టివ్‌ను ‘చంపేద్దాం’ నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: καὶ ἡμῶν ἔσται ἡ κληρονομία
  choice: అప్పుడు వారసత్వం మనదవుతుంది
  rationale: καί ఇక్కడ చర్య ఫలితంగా వారు ఆశించే పరిణామాన్ని కలుపుతోంది; తెలుగులో ‘అప్పుడు’ ఆ సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది. ἡμῶν లోని స్వాధీన ఉద్ఘాటనను ‘మనదవుతుంది’ నిలుపుతుంది; గ్రీకులో లేని ‘అతని’ అనే పదాన్ని చేర్చలేదు.
theological_decisions:
- issue: ఉపమాన సందర్భంలో γεωργοί అనువాదం
  choice: కౌలు రైతులు
  alternative: రైతులు / ద్రాక్షతోట పనివారు / కౌలుదారులు
  rationale: వీరు కేవలం వ్యవసాయ కూలీలు కాక, యజమానికి బాధ్యత వహిస్తూ తోటను సాగుచేసే కౌలుదారులని సందర్భం సూచిస్తుంది. ‘కౌలు రైతులు’ ఆ సామాజిక సంబంధాన్ని స్పష్టం చేస్తుంది; అదనపు అలంకారార్థ వివరణను రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే ఉపమానంలోని గంభీరతను నిలుపుతూ రూపొందించబడింది. ‘ఇతడే’, ‘చంపేద్దాం’, ‘మనదవుతుంది’ వంటి రూపాలు మూలంలోని ప్రత్యక్షతను, కుట్రపూరిత సంకల్పాన్ని కాపాడుతాయి.
