  text: καὶ ⸂οἱ ἑπτὰ⸃ οὐκ ἀφῆκαν σπέρμα· ⸀ἔσχατον πάντων ⸂καὶ ἡ γυνὴ ἀπέθανεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/022.yaml
  text: And the seven left no offspring. Last of all[a], the woman also died.
translation:
  language: te
  text: ఆ ఏడుగురూ సంతానాన్ని[a] మిగల్చలేదు. అందరికంటే చివరగా ఆ స్త్రీ కూడా చనిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో అక్షరార్థంగా ‘విత్తనాన్ని మిగల్చలేదు’; ఇక్కడ ‘విత్తనం’ అంటే సంతానం లేదా వంశస్థులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἑπτὰ
  choice: ఆ ఏడుగురిలో ఎవరూ
  rationale: ముందటి సందర్భంలోని ఏడుగురు సహోదరులనే సూచిస్తుంది. గ్రీకు వాక్యంలోని సమూహ నిరాకరణను సహజమైన ఆధునిక తెలుగులో వ్యక్తిగతంగా స్పష్టంచేయడానికి ‘ఆ ఏడుగురిలో ఎవరూ’ అని అనువదించాం.
- source_word: οὐκ ἀφῆκαν σπέρμα
  choice: సంతానాన్ని మిగల్చలేదు
  rationale: శబ్దార్థంగా ‘విత్తనాన్ని మిగల్చలేదు’; ఇక్కడ σπέρμα వంశస్థులను లేదా సంతానాన్ని సూచిస్తుంది. ‘సంతానాన్ని మిగల్చలేదు’ అనేది భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: ἔσχατον πάντων
  choice: అందరి తరువాత, చివరగా
  rationale: ఈ ప్రయోగం సంఘటనల క్రమంలో ఆమె అందరి తరువాత మరణించిందని సూచిస్తుంది. ‘అందరి తరువాత, చివరగా’ అన్న రూపం πάντων మరియు ἔσχατον రెండింటి భావాన్నీ నిలుపుతుంది.
- source_word: καὶ ἡ γυνὴ
  choice: ఆ స్త్రీ కూడా
  rationale: καί యొక్క చేర్పు భావాన్ని ‘కూడా’ తెలియజేస్తుంది; నిర్దిష్ట ఉపపదం ముందే ప్రస్తావించిన స్త్రీని సూచిస్తున్నందున ‘ఆ స్త్రీ’ అని ఇచ్చాం.
- source_word: ἀπέθανεν
  choice: చనిపోయింది
  rationale: గ్రీకు క్రియ మరణాన్ని సూటిగా చెబుతుంది. ‘చనిపోయింది’ ఆధునిక సాధారణ తెలుగులో స్పష్టమైన, నేరుగా ఉన్న సమానార్థకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా సూటిగా మరియు గౌరవప్రదంగా రూపొందించబడింది. మూలంలోని సంఘటనల క్రమం, చేర్పు భావం నిలుపబడ్డాయి.
