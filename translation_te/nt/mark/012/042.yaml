translation:
  language: te
  text: ఒక పేద విధవరాలు వచ్చి రెండు లెప్టాలు[a] వేసింది; అవి కలిపి ఒక క్వాడ్రాన్స్‌కు సమానం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లెప్టా అనేది చాలా చిన్న విలువగల నాణెం; రెండు లెప్టాలు ఒక రోమా క్వాడ్రాన్స్‌కు సమానం. దీనిని ‘రెండు చిన్న రాగి నాణాలు’ అని కూడా అనువదించవచ్చు.
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: ἐλθοῦσα
  choice: వచ్చి
  rationale: అయోరిస్ట్ కృదంతాన్ని తెలుగులో సహజమైన పూర్వకాలిక క్రియారూపంగా అనువదించడం ద్వారా ‘వచ్చి... వేసింది’ అనే కథన ప్రవాహం నిలుస్తుంది.
- source_word: μία
  choice: ఒక
  rationale: ఇక్కడ సంఖ్యాపరమైన ప్రత్యేక బలాఘాతం కంటే కథనంలో ఒక వ్యక్తిని పరిచయం చేస్తోంది; తెలుగులో ‘ఒక పేద విధవరాలు’ సహజంగా ఉంటుంది.
- source_word: χήρα
  choice: విధవరాలు
  rationale: మూలపదానికి ప్రామాణికమైన, ఆధునిక తెలుగులో సాధారణంగా అర్థమయ్యే సమానార్థకం.
- source_word: πτωχὴ
  choice: పేద
  rationale: పేదరికాన్ని సహజంగా తెలియజేస్తుంది; ‘నిరుపేద’ అని అనువదిస్తే ఈ వాక్యంలో మూలపదం స్పష్టంగా చెప్పని తీవ్రతను ముందుగానే చేర్చినట్లవుతుంది.
- source_word: ἔβαλεν
  choice: వేసింది
  rationale: కానుక పెట్టెలో నాణాలు వేయడాన్ని ఆధునిక తెలుగులో సహజంగా తెలిపే పదం; బలంగా విసిరిందనే అనవసర భావాన్ని కలిగించదు.
- source_word: λεπτὰ δύο
  choice: రెండు లెప్టా నాణాలు[a]
  rationale: చారిత్రక నాణెం పేరును నిలుపుతూ, తెలుగు పాఠకునికి అది నాణెమని వెంటనే స్పష్టం చేస్తుంది; విలువను పాదసూచిక వివరిస్తుంది.
- source_word: ὅ ἐστιν
  choice: అవి ... సమానం
  rationale: రెండు లెప్టాల కలిపిన విలువ ఒక క్వాడ్రాన్స్ అని మూలంలోని వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: κοδράντης
  choice: ఒక క్వాడ్రాన్స్
  rationale: గ్రీకు పాఠ్యంలో ఉన్న రోమా నాణెం పేరును చారిత్రక ఖచ్చితత్వంతో నిలుపుతుంది; ఆధునిక కరెన్సీ పేరుతో తప్పుదారి పట్టించదు.
