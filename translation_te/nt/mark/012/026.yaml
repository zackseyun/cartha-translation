id: MRK.12.26
reference: Mark 12:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: περὶ δὲ τῶν νεκρῶν ὅτι ἐγείρονται οὐκ ἀνέγνωτε ἐν τῇ βίβλῳ Μωϋσέως ἐπὶ τοῦ βάτου ⸀πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων· Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ⸂ὁ θεὸς Ἰσαὰκ καὶ ὁ⸃ θεὸς Ἰακώβ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/026.yaml
  text: And concerning the dead[a], that they are raised, have you not read in the book of Moses, in the passage about the bush, how God spoke to him, saying, ‘I am the God of Abraham and the God of Isaac and the God of Jacob’?”
translation:
  language: te
  text: చనిపోయినవారు లేపబడతారనే విషయం గురించి—మోషే గ్రంథంలో, పొద గురించిన భాగంలో[a], దేవుడు అతనితో, ‘నేను అబ్రాహాము దేవుణ్ణి, ఇస్సాకు దేవుణ్ణి, యాకోబు దేవుణ్ణి’ అని ఎలా చెప్పాడో మీరు చదవలేదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పొద దగ్గర.” గ్రీకు వ్యక్తీకరణ పొద సంఘటన ద్వారా లేఖన భాగాన్ని గుర్తిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τῶν νεκρῶν
  choice: చనిపోయినవారు … అనే విషయం గురించి
  rationale: περί + షష్ఠీ విభక్తి చర్చలోని అంశాన్ని పరిచయం చేస్తుంది. δέను తెలుగు వాక్యప్రవాహంలో ప్రత్యేక సంధాయక పదంతో బలవంతంగా చూపకుండా విషయమార్పు ద్వారా సహజంగా వ్యక్తం చేశాం.
- source_word: ὅτι ἐγείρονται
  choice: లేపబడతారు
  rationale: వర్తమానకాల కర్మణి రూపాన్ని కాపాడుతూ, చనిపోయినవారి పునరుత్థానం సాధారణ సత్యంగా ప్రస్తావించబడుతున్న భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: οὐκ ἀνέγνωτε
  choice: మీరు చదవలేదా?
  rationale: ఇది లేఖన పరిజ్ఞానాన్ని ప్రశ్నించే అలంకారిక ప్రశ్న. తెలుగు వాడుకలో సహజమైన భూతకాల ప్రశ్నారూపం మూలంలోని భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἐν τῇ βίβλῳ Μωϋσέως
  choice: మోషే గ్రంథంలో
  rationale: βίβλος పుస్తకం లేదా గ్రంథచుట్టను సూచించగలదు; ఆధునిక పాఠకులకు ‘గ్రంథం’ సహజంగా ఉండి మోషే రచనలను సూచిస్తుంది.
- source_word: ἐπὶ τοῦ βάτου
  choice: ముల్లపొద గురించిన భాగంలో
  rationale: ఈ వ్యక్తీకరణ ముల్లపొద సంఘటన ద్వారా గుర్తించబడే లేఖన భాగాన్ని సూచిస్తుంది. ‘భాగంలో’ అనే పదం ఆ ఉల్లేఖన విధిని స్పష్టం చేస్తుంది; స్థలార్థాన్ని ప్రత్యామ్నాయంగా పాదసూచికలో ఉంచాం.
- source_word: πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων
  choice: దేవుడు అతనితో … అని ఎలా చెప్పాడో
  rationale: తెలుగు పరోక్ష-ప్రత్యక్ష ఉల్లేఖన నిర్మాణంలో λέγωνను ప్రత్యేకంగా పునరుక్తి చేయకుండా ‘అని చెప్పాడు’ ద్వారా సహజంగా కలిపాం; πῶςను ‘ఎలా’తో నిలిపాం.
- source_word: Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: నేను అబ్రాహాము దేవుణ్ణి, ఇస్సాకు దేవుణ్ణి, యాకోబు దేవుణ్ణి
  rationale: మూలంలోని ἐγώను ‘నేను’గా స్పష్టంగా ఉంచి, ప్రతి పితరునితో ‘దేవుణ్ణి’ అనే నిర్మాణాన్ని పునరావృతం చేసి ఉల్లేఖనంలోని వర్తమాన స్వీయ-గుర్తింపును, అలంకార బలాన్ని కాపాడాం.
theological_decisions:
- issue: ὅτι ἐγείρονταιలో పునరుత్థాన భాష
  choice: లేపబడతారు
  alternative: తిరిగి లేస్తారు
  rationale: కర్మణి రూపాన్ని నిలిపి, లేపబడటం దేవుని కార్యమనే మూలంలోని సూచనను కాపాడుతుంది; అదే సమయంలో మూలం చెప్పినదానికంటే ఎక్కువ సిద్ధాంత వివరణను చేర్చదు.
- issue: దైవ స్వీయ-గుర్తింపులో వర్తమాన భావం మరియు పునరావృత నిర్మాణం
  choice: నేను అబ్రాహాము దేవుణ్ణి, ఇస్సాకు దేవుణ్ణి, యాకోబు దేవుణ్ణి
  alternative: నేను అబ్రాహాము, ఇస్సాకు, యాకోబుల దేవుణ్ణి
  rationale: ‘నేను’తో కూడిన వర్తమాన నామవాక్యాన్ని, ప్రతి పితరుని వద్ద ‘దేవుణ్ణి’ అనే పునరావృతాన్ని నిలిపాం; యేసు వాదన ఆధారపడే ఉల్లేఖన రూపాన్ని సంక్షిప్తీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘పునరుత్థానం’ అనే సాంకేతిక నామవాచకానికి బదులు మూలంలోని క్రియారూపాన్ని ‘లేపబడతారు’గా నిలిపాం. ఉల్లేఖనంలో పునరావృతాన్ని ఉద్దేశపూర్వకంగా కాపాడాం.
