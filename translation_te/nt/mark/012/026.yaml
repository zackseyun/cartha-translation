    rationale: βάτος ఇక్కడ నిర్దిష్టంగా ‘ముళ్లపొద’ అని చెప్పదు; నిర్దిష్ట వృక్షజాతి లేదా ముళ్లు అనే భావాన్ని చేర్చకుండా ‘పొద’ అని అనువదించడం మూలపాఠానికి మరింత నమ్మకమైనది.
