  to: చనిపోయినవారు లేపబడతారనే విషయం గురించి—మోషే గ్రంథంలో, పొద గురించిన భాగంలో[a], దేవుడు అతనితో, ‘నేను అబ్రాహాము దేవుణ్ణి, ఇస్సాకు దేవుణ్ణి, యాకోబు దేవుణ్ణి’ అని ఎలా చెప్పాడో మీరు చదవలేదా?
  rationale: βάτοςకు అదనపు వృక్ష-లక్షణాన్ని జోడించకుండా ‘పొద’గా మార్చాం. స్థలార్థాన్ని సూచించే ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపి, ఈ పదబంధం లేఖనంలోని సంఘటన-ఆధారిత భాగసూచనగా పనిచేస్తుందనే విషయాన్ని స్పష్టంగా చేశాం. మిగిలిన వాక్యభాగాలు మూలపాఠంలోని ప్రశ్నారూపం, కర్మణి పునరుత్థానభావం, మరియు ఉల్లేఖనంలోని పునరావృతాన్ని తగిన రీతిలో కాపాడుతున్నాయి.
