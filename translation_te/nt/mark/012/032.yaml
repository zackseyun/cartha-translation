    rationale: The phrase faithfully conveys the sense, but “నిజంగా చెప్పావు” is more natural modern Telugu for the scribe’s affirmation that Jesus has spoken truthfully.
  revised_text: ఆ ధర్మశాస్త్ర పండితుడు ఆయనతో, “బోధకుడా, బాగా చెప్పావు. ఆయన ఒక్కడే, ఆయన తప్ప మరొకరు లేరని నీవు నిజంగా చెప్పావు” అన్నాడు.
