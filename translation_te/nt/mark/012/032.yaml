source:
  edition: SBLGNT
  text: ⸀καὶ εἶπεν αὐτῷ ὁ γραμματεύς· Καλῶς, διδάσκαλε, ἐπ’ ἀληθείας εἶπες ὅτι εἷς ἐστιν καὶ οὐκ ἔστιν ἄλλος πλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/032.yaml
  text: And the scribe said to him[a], “Well said, Teacher. You have spoken truly that he is one, and there is no other besides him.”
translation:
  language: te
  text: ఆ ధర్మశాస్త్ర పండితుడు ఆయనతో, “బోధకుడా, బాగా చెప్పావు. ఆయన ఒక్కడే, ఆయన తప్ప మరొకరు లేరని నీవు నిజంగా చెప్పావు” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γραμματεύς
  choice: ధర్మశాస్త్ర పండితుడు
  rationale: ఇది యూదుల ధర్మశాస్త్రంలో ప్రావీణ్యం కలిగిన గుర్తింపు పొందిన వర్గానికి చెందిన వ్యక్తిని సూచిస్తుంది. ‘శాస్త్రి’ కంటే ఈ రూపం నేటి సాధారణ పాఠకులకు అర్థాన్ని మరింత స్పష్టంగా తెలియజేస్తుంది; అయితే ‘ఉపదేశకుడు’ అని అనువదించి అతని పాత్రను అనవసరంగా పరిమితం చేయదు.
- source_word: Καλῶς
  choice: బాగా చెప్పావు
  rationale: ముందు చెప్పిన సమాధానాన్ని మెచ్చుకుంటూ పలికిన మాటగా, సహజమైన ఆధునిక తెలుగు సంభాషణలో ఈ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: διδάσκαλε
  choice: బోధకుడా
  rationale: διδάσκαλος అనే సంబోధనకు సహజమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం.
- source_word: ἐπ’ ἀληθείας
  choice: సత్యంగా
  rationale: యేసు పలికిన మాట నిజమైనదని ధృవీకరించే క్రియావిశేషణ భావాన్ని కాపాడుతుంది.
- source_word: εἷς ἐστιν
  choice: ఆయన ఒక్కడే
  rationale: గ్రీకులో దేవుడు అనే నామవాచకం ఈ వాక్యంలో మళ్లీ లేదు; ముందు సందర్భం ద్వారా సూచితమైన పుంలింగ ఏకవచన కర్తను ‘ఆయన’గా ఉంచి మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
- source_word: οὐκ ἔστιν ἄλλος πλὴν αὐτοῦ
  choice: ఆయన తప్ప మరొకరు లేరు
  rationale: మినహాయింపు మరియు ఏకైకత్వాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; మూలంలో లేని అదనపు వివరణను చేర్చదు.
theological_decisions:
- issue: εἷς ἐστινలో సూచిత కర్త
  choice: ప్రధాన పాఠ్యంలో ‘ఆయన ఒక్కడే’ అని అనువదించడం
  alternative: ‘దేవుడు ఒక్కడే’ అని స్పష్టంగా అనువదించడం
  rationale: ముందటి సందర్భం దేవుణ్ణే సూచిస్తున్నప్పటికీ, ఈ వచనంలోని గ్రీకు పాఠ్యం θεός అనే పదాన్ని మళ్లీ ఉపయోగించదు. అందువల్ల సూచిత కర్తను అలాగే ఉంచి, స్పష్టమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సంభాషణ శైలిని, గౌరవప్రదమైన దైవసూచక రూపాలను ఉపయోగించాం. మూలపాఠ్యంలోని సూచిత కర్తను ప్రధాన పాఠ్యంలో నిలిపి, పాఠకునికి అవసరమైన స్పష్టీకరణను పాదసూచికలో ఇచ్చాం.
