  to: ఆ ధర్మశాస్త్ర పండితుడు ఆయనతో, “బోధకుడా, బాగా చెప్పావు. ఆయన ఒక్కడే, ఆయన తప్ప మరొకరు లేరని నీవు నిజంగా చెప్పావు” అన్నాడు.
