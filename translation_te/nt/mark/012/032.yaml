  terminology: “ధర్మశాస్త్ర పండితుడు” is an appropriately clear rendering of γραμματεύς in this context, without reducing the role to merely a teacher. “బోధకుడా” suitably renders διδάσκαλε. “ఆయన ఒక్కడే” preserves the Greek’s unstated but contextually supplied referent; the footnote properly gives the explicit contextual alternative, “దేవుడు ఒక్కడే.”
