source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν ⸀αὐτοῖς· ⸂Τὰ Καίσαρος ἀπόδοτε⸃ Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ. καὶ ⸀ἐξεθαύμαζον ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/017.yaml
  text: But Jesus said to them[a], “Give back to Caesar the things that are Caesar’s, and to God the things that are God’s.” And they were utterly amazed at him.
translation:
  language: te
  text: 'అయితే యేసు వారితో ఇలా అన్నాడు: “కైసరుకు చెందినవాటిని కైసరుకు, దేవునికి చెందినవాటిని దేవునికి తిరిగి ఇవ్వండి.”[a] వారు ఆయన విషయంలో ఎంతో ఆశ్చర్యపోయారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కైసరుకు రావలసినవాటిని కైసరుకు, దేవునికి రావలసినవాటిని దేవునికి చెల్లించండి.” ఇక్కడి క్రియకు ‘తిరిగి ఇవ్వండి,’ ‘బాకీ తీర్చండి,’ లేదా ‘రావలసినది చెల్లించండి’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόδοτε
  choice: తిరిగి ఇవ్వండి
  rationale: ἀποδίδωμι అనే క్రియకు తిరిగి ఇవ్వడం, బాకీ తీర్చడం, లేదా రావలసినదాన్ని చెల్లించడం అనే భావాలు ఉన్నాయి. పన్నుకే పరిమితం చేయకుండా, యథార్థంగా చెందవలసినదాన్ని ఇవ్వాలనే భావాన్ని ఇది నిలుపుతుంది.
- source_word: Τὰ Καίσαρος ... Καίσαρι
  choice: కైసరుకు చెందినవాటిని కైసరుకు
  rationale: నపుంసక బహువచన పదబంధంలోని స్వామ్య భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, దాని సూచనను కేవలం పన్నుకు పరిమితం చేయదు.
- source_word: τὰ τοῦ θεοῦ ... τῷ θεῷ
  choice: దేవునికి చెందినవాటిని దేవునికి
  rationale: మొదటి భాగంతో ఉద్దేశపూర్వక సమాంతర నిర్మాణాన్ని నిలుపుతూ, దేవునికి చెందే వాటి పరిధిని అనవసరంగా నిర్వచించదు.
- source_word: ἐξεθαύμαζον
  choice: ఎంతో ఆశ్చర్యపోయారు
  rationale: ἐκθαυμάζωలోని బలమైన ఆశ్చర్య భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; గ్రీకు అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న ప్రతిస్పందనను తెలుగు సందర్భం సహజంగా అందిస్తుంది.
- source_word: ἐπ’ αὐτῷ
  choice: ఆయనను చూసి
  rationale: ἐπί + దత్తి విభక్తి ఇక్కడ ఆశ్చర్యానికి వ్యక్తిని లేదా ఆధారాన్ని సూచించవచ్చు. ఈ ఎంపిక ఆశ్చర్యం యేసుపట్లనో ఆయన సమాధానం కారణంగానో అన్న సూక్ష్మ అనిశ్చితిని పూర్తిగా పరిష్కరించకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: δέ సూచించే స్వల్ప వ్యత్యాసం లేదా సంభాషణాత్మక మలుపును తెలుగులో సహజంగా చూపుతుంది.
- source_word: εἶπεν αὐτοῖς
  choice: వారితో ఇలా అన్నాడు
  rationale: మాటల పరిచయాన్ని సహజమైన తెలుగులో ఇస్తూ, అదనపు వ్యాఖ్యాన భావాన్ని చేర్చదు.
theological_decisions:
- issue: యేసు మాటలో పౌర బాధ్యతకు, దేవునిపట్ల బాధ్యతకు మధ్య సంబంధం
  choice: రెండు సమాంతర భాగాలను నేరుగా అనువదించి, కైసరుకు మరియు దేవునికి చెందేవాటి పరిధిని వివరించకుండా ఉంచడం.
  alternative: దీనిని పౌర అధికారానికి బలమైన ఆమోదంగా గానీ, కైసరు హక్కులను పరోక్షంగా తగ్గించే మాటగా గానీ స్పష్టీకరించడం.
  rationale: వాక్యం కైసరుకు చెందేవి, దేవునికి చెందేవి ఉన్నాయని చెబుతుంది; అయితే వాటి సంబంధంపై సంపూర్ణ రాజకీయ లేదా సంఘ-రాజ్య సిద్ధాంతాన్ని వివరించదు. అందువల్ల మూలంలోని ఉద్వేగం, సమాంతరత నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘కైసరు’ అనే రూపం బైబిలు సందర్భానికి సుపరిచితంగా ఉండి, Caesar అనే బిరుదును సూచిస్తుంది. ప్రధాన వాక్యంలో సమాంతర నిర్మాణం సాధ్యమైనంత స్పష్టంగా నిలుపబడింది.
