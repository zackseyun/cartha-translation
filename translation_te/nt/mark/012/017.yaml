  rationale: Only the final reaction clause is revised. The revision removes the unsupported visual implication of ‘చూసి’ while preserving the imperfect, intensified amazement and the Greek ambiguity of ἐπ’ αὐτῷ. The saying itself and its lexical-alternative footnote remain sound.
