  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὸ ἀγαπᾶν αὐτὸν ἐξ ὅλης ⸀τῆς καρδίας καὶ ἐξ ὅλης τῆς ⸀συνέσεως καὶ ἐξ ὅλης τῆς ἰσχύος καὶ τὸ ἀγαπᾶν τὸν πλησίον ὡς ἑαυτὸν ⸀περισσότερόν ἐστιν πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/033.yaml
  text: and to love him with all the heart and with all the understanding and with all the strength[a], and to love one’s neighbor as oneself, is more than all burnt offerings and sacrifices.
translation:
  language: te
  text: మరియు పూర్ణ హృదయంతో, పూర్ణ అవగాహనతో, పూర్ణ బలంతో ఆయనను ప్రేమించడం, తనను తాను ప్రేమించుకున్నట్టే తన పొరుగువాణ్ణి ప్రేమించడం—ఇవి అన్ని దహనబలులకన్నా[a], అన్ని బలులకన్నా గొప్పవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దహనబలులు” అనే గ్రీకు పదం బలిపీఠంపై పూర్తిగా దహించబడే బలులను ప్రత్యేకంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶν
  choice: ప్రేమించడం
  rationale: ఆర్టికల్‌తో ఉన్న క్రియారూపాన్ని తెలుగులో క్రియానామంగా సహజంగా వ్యక్తపరుస్తూ, రెండు సమాంతర ప్రేమ ఆజ్ఞల నిర్మాణాన్ని నిలుపుతుంది.
- source_word: αὐτόν
  choice: ఆయనను
  rationale: సర్వనామాన్ని అలాగే ఉంచుతుంది; ముందు సందర్భం దాని సూచన దేవునికేనని స్పష్టం చేస్తుంది.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: పూర్ణ హృదయంతో
  rationale: సమగ్ర అంతరంగ భక్తిని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: συνέσεως
  choice: అవగాహనతో
  rationale: σύνεσις సూచించే గ్రహింపు, వివేచన భావాన్ని ‘మనస్సు’ కంటే నిర్దిష్టంగా తెలియజేస్తుంది.
- source_word: ἰσχύος
  choice: బలంతో
  rationale: వ్యక్తి యొక్క సమస్త శక్తి లేదా సామర్థ్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: πλησίον
  choice: తన పొరుగువాణ్ణి
  rationale: ఏకవచనంలోని సాధారణ నైతిక భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ὡς ἑαυτόν
  choice: తనను తాను ప్రేమించుకున్నట్టే
  rationale: పరోక్షంగా చెప్పబడిన సాధారణ ఆత్మవాచక భావాన్ని నిలుపుతుంది; ‘నిన్ను నీవు’ అని ప్రత్యక్ష సంబోధనగా మార్చదు.
- source_word: περισσότερόν ἐστιν
  choice: గొప్పవి
  rationale: ఆ ప్రేమ కార్యాలు బలులకంటే శ్రేష్ఠమైనవని తెలిపే తులనాత్మక భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν
  choice: దహనబలులన్నిటికంటే, ఇతర బలులన్నిటికంటే
  rationale: ὁλοκαυτώματα అనేది బలిపీఠంపై పూర్తిగా దహించబడే ప్రత్యేక బలులను సూచిస్తుంది. θυσιῶν‌తో ఉన్న భేదం తెలుగులో స్పష్టంగా ఉండేందుకు ‘ఇతర’ అని సందర్భానుగుణంగా చేర్చబడింది.
theological_decisions:
- issue: ప్రేమ ఆజ్ఞలకు బలుల ఆరాధనతో ఉన్న సంబంధం
  choice: దేవునిపట్ల సంపూర్ణ ప్రేమ, పొరుగువానిపట్ల ప్రేమ అన్నీ దహనబలులు మరియు ఇతర బలులకంటే గొప్పవని చెప్పడం
  alternative: ఈ వాక్యం బలుల వ్యవస్థను పూర్తిగా రద్దు చేస్తుందని చెప్పడం
  rationale: περισσότερόν ἐστιν స్పష్టమైన శ్రేష్ఠతను తెలుపుతుంది; అయితే బలుల వ్యవస్థ రద్దయిందని ఈ వాక్యం స్వయంగా ప్రకటించదు. కాబట్టి ఆ వేదాంత ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. గ్రీకులోని సాధారణ తృతీయపురుష భావాన్ని నిలుపుతూ ‘ఆయనను,’ ‘తన పొరుగువాణ్ణి,’ ‘తనను తాను’ అనే రూపాలు ఎంచుకోబడ్డాయి. రెండు ఆర్టిక్యులర్ ఇన్ఫినిటివ్‌లు కలసి బహువచన భావకర్తగా పనిచేయడం వల్ల ‘ఇవి... గొప్పవి’ అని ఇచ్చాం.
