- from: మరియు పూర్ణ హృదయంతో, పూర్ణ అవగాహనతో, పూర్ణ బలంతో ఆయనను ప్రేమించడం, తనను తాను ప్రేమించుకున్నట్టే తన పొరుగువాణ్ణి ప్రేమించడం—ఇవి దహనబలులన్నిటికంటే, ఇతర బలులన్నిటికంటే గొప్పవి.[a]
  to: మరియు పూర్ణ హృదయంతో, పూర్ణ అవగాహనతో, పూర్ణ బలంతో ఆయనను ప్రేమించడం, తనను తాను ప్రేమించుకున్నట్టే తన పొరుగువాణ్ణి ప్రేమించడం—ఇవి అన్ని దహనబలులకన్నా[a], అన్ని బలులకన్నా గొప్పవి.
