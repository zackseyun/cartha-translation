- from: 'వారు వచ్చి ఆయనతో ఇలా అన్నారు: “బోధకుడా, నీవు సత్యవంతుడవనీ, ఎవరి అభిప్రాయానికీ తలొగ్గవనీ మాకు తెలుసు. ఎందుకంటే నీవు మనుషుల ముఖం చూసేవాడివి కావు[a]; దేవుని మార్గాన్ని సత్యంగా బోధిస్తావు. కైసరుకు తలపన్ను చెల్లించడం ధర్మసమ్మతమేనా, కాదా? మేము దాన్ని చెల్లించాలా[b], వద్దా?”'
  to: 'వారు వచ్చి ఆయనతో ఇలా అన్నారు: “బోధకుడా, నీవు సత్యవంతుడవనీ, ఎవరి అభిప్రాయానికీ తలొగ్గవనీ మాకు తెలుసు. ఎందుకంటే నీవు మనుషుల ముఖం చూసి పక్షపాతం చూపవు[a], కానీ దేవుని మార్గాన్ని సత్యంగా బోధిస్తావు. కైసరుకు తలపన్ను చెల్లించడం ధర్మసమ్మతమా, కాదా? మేము దాన్ని చెల్లించాలా[b], చెల్లించకూడదా?”'
  rationale: The revision replaces an opaque literalism with an idiomatic Telugu expression that conveys the Greek idiom’s meaning, documents the literal imagery in the footnote, restores the Greek contrast between the two explanatory clauses, and retains the repeated verb in the final question. No doctrinal interpretation has been introduced.
