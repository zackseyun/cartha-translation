id: MRK.12.14
reference: Mark 12:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀καὶ ἐλθόντες λέγουσιν αὐτῷ· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις· ἔξεστιν ⸂δοῦναι κῆνσον Καίσαρι⸃ ἢ οὔ; δῶμεν ἢ μὴ δῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/014.yaml
  text: And they came and said to him[a], “Teacher, we know that you are truthful and do not care about anyone, for you do not look at the face of men, but truly teach the way of God. Is it lawful to pay the poll tax to Caesar or not? Should we pay it[b], or should we not pay it?”
translation:
  language: te
  text: 'వారు వచ్చి ఆయనతో ఇలా అన్నారు: “బోధకుడా, నీవు సత్యవంతుడవనీ, ఎవరి అభిప్రాయానికీ తలొగ్గవనీ మాకు తెలుసు. ఎందుకంటే నీవు మనుషుల ముఖం చూసి పక్షపాతం చూపవు[a], కానీ దేవుని మార్గాన్ని సత్యంగా బోధిస్తావు. కైసరుకు తలపన్ను చెల్లించడం ధర్మసమ్మతమా, కాదా? మేము దాన్ని చెల్లించాలా[b], చెల్లించకూడదా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీవు మనుషుల ముఖాన్ని చూడవు.” అంటే, నీవు మనుషుల పట్ల పక్షపాతం చూపవు లేదా వారి హోదా, బాహ్యరూపం చూసి ప్రభావితం కావు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “తలపన్ను” అనేది రోమా ప్రభుత్వం జనగణన ఆధారంగా వ్యక్తులపై విధించిన పన్ను.
    reason: cultural_note
lexical_decisions:
- source_word: Διδάσκαλε
  choice: బోధకుడా
  rationale: సువార్తలలో బోధించే వ్యక్తిని సంబోధించే సాధారణ పదం; ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: ἀληθὴς
  choice: సత్యవంతుడవు
  rationale: వ్యక్తిగా యేసు నిజం పలికేవాడని సూచిస్తుంది; ‘నిజమైనవాడవు’ కంటే వ్యక్తిగత సత్యనిష్ఠను స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: ఎవరి అభిప్రాయానికీ తలొగ్గవు
  rationale: ఎవరిపట్లా శ్రద్ధ లేదనే ప్రతికూల భావాన్ని కలిగించకుండా, ప్రజల ఒత్తిడి లేదా అభిప్రాయం ఆయనను ప్రభావితం చేయదనే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐ ... βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: మనుషుల ముఖం చూసేవాడివి కావు
  rationale: గ్రీకు మూలంలోని దృశ్యరూపాన్ని నిలుపుతుంది; పక్షపాతం చూపకపోవడం లేదా హోదాను బట్టి ప్రభావితం కాకపోవడం అనే నుడికారార్థాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: ἐπ’ ἀληθείας
  choice: సత్యంగా
  rationale: ‘బోధిస్తావు’ అనే క్రియను విశేషించే గ్రీకు క్రియావిశేషణ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: దేవుని మార్గం
  rationale: మూలంలోని పరిచితమైన బైబిలు రూపకాన్ని కాపాడుతుంది; దేవుని చిత్తానుసారమైన బోధన, జీవన విధానం రెండింటినీ సూచించగలదు.
- source_word: ἔξεστιν
  choice: ధర్మసమ్మతమేనా
  rationale: అనుమతి, ధర్మబద్ధత గురించి వేసిన ప్రశ్నను సహజమైన తెలుగు న్యాయ-నైతిక పదబంధంతో వ్యక్తం చేస్తుంది; కేవలం రోమా చట్టాన్ని మాత్రమే ఉద్దేశించిందని ముందే నిర్ణయించదు.
- source_word: δοῦναι κῆνσον Καίσαρι
  choice: కైసరుకు తలపన్ను చెల్లించడం
  rationale: κῆνσος రోమా జనగణనకు సంబంధించిన వ్యక్తిగత పన్నును సూచిస్తుంది; ‘చెల్లించడం’ తెలుగు పన్ను సందర్భంలో సహజమైన క్రియ.
- source_word: Καίσαρι
  choice: కైసరుకు
  rationale: పాలకుని పేరు/బిరుదును సంప్రదాయ తెలుగు రూపంలో లిప్యంతరీకరిస్తుంది.
- source_word: δῶμεν ἢ μὴ δῶμεν
  choice: మేము దాన్ని చెల్లించాలా, వద్దా?
  rationale: మూలంలోని పదునైన ద్వంద్వ ప్రశ్నను సహజమైన తెలుగులో నిలుపుతుంది; ‘దాన్ని’ అనే పదం పన్నును స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: మనుషుల ముఖం చూడడం అనే నుడికారాన్ని అనువదించడం
  choice: ప్రధాన పాఠ్యంలో ‘మనుషుల ముఖం చూసేవాడివి కావు’ అనే మూలరూపాన్ని ఉంచి, నుడికారార్థాన్ని పాదటిప్పణిలో వివరించడం.
  alternative: ‘మనుషుల పట్ల పక్షపాతం చూపవు’ లేదా ‘వారి హోదా చూసి ప్రభావితం కావు.’
  rationale: ఇది మూలంలోని స్పష్టమైన దృశ్యరూపాన్ని కాపాడుతూ, దాని భావాన్ని పాఠకునికి అందిస్తుంది; ఏ ప్రత్యేక సిద్ధాంత వ్యాఖ్యానాన్నీ చొప్పించదు.
- issue: ἔξεστιν ప్రశ్నలోని ధర్మబద్ధత పరిధి
  choice: ‘ధర్మసమ్మతమేనా’ అని అనువదించడం.
  alternative: ‘చట్టబద్ధమేనా’ లేదా ‘అనుమతి ఉందా.’
  rationale: ప్రశ్న రోమా చట్టాన్ని మాత్రమే గాక దేవుని ధర్మానికి అనుగుణతనూ తాకవచ్చు. ‘ధర్మసమ్మతం’ ఈ ఉద్దేశపూర్వక విస్తృతతను అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని ప్రశంసాపూర్వకమైనా కపట ఉద్దేశంతో కూడిన మాటల గంభీరతను నిలిపింది. నుడికారాన్ని ప్రధాన పాఠ్యంలో కొంత రూపసామ్యంతో ఉంచి పాదటిప్పణిలో అర్థాన్ని స్పష్టం చేసింది.
