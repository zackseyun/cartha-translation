id: MRK.12.10
reference: Mark 12:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδὲ τὴν γραφὴν ταύτην ἀνέγνωτε· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/010.yaml
  text: 'Have you not even read this Scripture: ‘The stone that the builders rejected[a], this has become the cornerstone’?”'
translation:
  language: te
  text: “ఈ లేఖనాన్నైనా మీరు చదవలేదా? ‘నిర్మాణకర్తలు తిరస్కరించిన రాయి మూలరాయి అయింది.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γραφὴν
  choice: లేఖనాన్ని
  rationale: కొత్త నిబంధనలో γραφή సాధారణంగా పవిత్ర లేఖనాన్ని సూచిస్తుంది. ‘లేఖనం’ అనే పదం ఉద్ధరణ సూత్రానికి సహజంగా సరిపోతూ ఆ భావాన్ని నిలుపుతుంది.
- source_word: ἀνέγνωτε
  choice: చదవలేదా
  rationale: ఆలంకారిక ప్రశ్నలోని ఏకకాల గతరూపాన్ని ఆధునిక తెలుగులో సహజంగా ‘చదవలేదా?’ అని వ్యక్తం చేయవచ్చు.
- source_word: οὐδὲ
  choice: కూడా ... లేదా
  rationale: οὐδέ లోని బలమైన ‘కూడా/కూడానా’ భావాన్ని నిలుపుతూ యేసు గద్దింపును స్పష్టంగా తెలియజేస్తుంది.
- source_word: Λίθον
  choice: రాయి
  rationale: గ్రీకులో నిర్దేశక పదం లేకపోయినా, కీర్తన 118 నుండి తీసుకున్న ఈ ఉద్ధరణలో ఒక నిర్దిష్ట రూపకాలంకార రాయి ఉద్దేశించబడింది; తెలుగు వాక్యనిర్మాణంలో ‘రాయి’ సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: ἀπεδοκίμασαν
  choice: తిరస్కరించిన
  rationale: పరిశీలించి పనికిరాదని త్రోసివేసిన భావాన్ని సందర్భంలో సంక్షిప్తంగా, స్పష్టంగా తెలియజేసే సాధారణ తెలుగు పదం.
- source_word: οἱ οἰκοδομοῦντες
  choice: ఇల్లు కట్టేవారు
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ నిర్మాణ రూపకాన్ని నిలుపుతుంది.
- source_word: ἐγενήθη
  choice: అయింది
  rationale: రాయి కొత్త స్థానాన్ని పొందిన పూర్తయిన సంఘటనను సరళంగా తెలియజేస్తుంది; దాని ఫలితస్థితి సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: εἰς κεφαλὴν γωνίας
  choice: మూలరాయి
  rationale: మూలలో ప్రధాన స్థానమున్న రాయిని ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా తెలియజేసే సంక్షిప్త సమానార్థకం. గ్రీకు పదబంధపు అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచి నిర్మాణపరమైన అస్పష్టతను కాపాడాం.
theological_decisions:
- issue: కీర్తన 118:22లోని రాయి రూపకానికి మెస్సీయ సంబంధమైన అన్వయం
  choice: రాయి, ఇల్లు కట్టేవారు, మూలరాయి అనే రూపకాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా యథాతథంగా ఉంచడం
  alternative: ప్రధాన పాఠ్యంలోనే రాయి యేసును లేదా మెస్సీయను సూచిస్తుందని స్పష్టంగా చెప్పడం
  rationale: సందర్భంలో ఈ వాక్యం యేసుకు వర్తించినప్పటికీ, మూలపాఠ్యం దానిని రూపకం ద్వారానే తెలియజేస్తుంది. అన్వయాన్ని అనువాదంలో చేర్చకుండా ఉంచడం లేఖనంలోని రూపక బలాన్ని, వ్యాఖ్యానాత్మక ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘మీరు ... చదవలేదా?’ అనే రూపం ఆలంకారిక గద్దింపును నిలుపుతుంది. ఉద్ధరించిన కీర్తన వాక్యంలో రూపకాన్ని వివరణతో విస్తరించలేదు.
