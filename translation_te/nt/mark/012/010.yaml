revisions:
- from: “మీరు ఈ లేఖనాన్ని కూడా చదవలేదా? ‘ఇల్లు కట్టేవారు తిరస్కరించిన రాయి మూలరాయి[a] అయింది.’”
  to: “ఈ లేఖనాన్నైనా మీరు చదవలేదా? ‘నిర్మాణకర్తలు తిరస్కరించిన రాయి మూలరాయి అయింది.’”
  rationale: The revision removes the unsupported specification ‘house’ and strengthens the natural Telugu expression of the Greek emphatic negative question. It retains the stone/builders/cornerstone metaphor without adding a messianic interpretation or resolving the architectural nuance beyond the existing footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:14:19Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the rhetorical question, the Scripture citation, rejection by builders, and the stone's elevation to the corner position. However, «ఇల్లు కట్టేవారు» adds a specific object (‘house’) not present in οἱ οἰκοδομοῦντες, which simply means ‘the builders/those building.’ «ఈ లేఖనాన్నైనా చదవలేదా?» more naturally and clearly conveys the emphatic οὐδέ (‘not even’).
  naturalness: The revised wording is modern, idiomatic Telugu. «నిర్మాణకర్తలు» is a natural concise rendering in this stone-and-building metaphor, without specifying a house. The respectful plural question preserves the rebuking rhetorical register.
  terminology: «లేఖనం» appropriately renders γραφή in this citation formula. «మూలరాయి» is an established and clear equivalent for κεφαλὴ γωνίας; the footnote retains the more literal alternative and does not force a debated architectural interpretation.
  issues:
  - severity: low
    issue: «ఇల్లు కట్టేవారు» specifies ‘house.’
    rationale: The Greek substantival participle οἱ οἰκοδομοῦντες identifies builders but does not state that they are building a house. «నిర్మాణకర్తలు» preserves the broader construction metaphor.
  - severity: low
    issue: The emphatic force of οὐδέ is less direct in «ఈ లేఖనాన్ని కూడా చదవలేదా?»
    rationale: Although understandable, «ఈ లేఖనాన్నైనా చదవలేదా?» is a more idiomatic Telugu rhetorical expression for ‘Have you not even read this Scripture?’
  revised_text: “ఈ లేఖనాన్నైనా మీరు చదవలేదా? ‘నిర్మాణకర్తలు తిరస్కరించిన రాయి మూలరాయి అయింది.’”
  revised_footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మూలకు తలరాయి”; సాంప్రదాయికంగా, “ప్రధాన మూలరాయి.”
    reason: κεφαλὴ γωνίας అనే పదబంధానికి అక్షరార్థ అనువాదమూ, సాంప్రదాయిక అనువాదమూ ఉన్నందున ప్రత్యామ్నాయాలను సూచించడం.
  revision_rationale: The revision removes the unsupported specification ‘house’ and strengthens the natural Telugu expression of the Greek emphatic negative question. It retains the stone/builders/cornerstone metaphor without adding a messianic interpretation or resolving the architectural nuance beyond the existing footnote.
