id: MRK.12.19
reference: Mark 12:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν ὅτι ἐάν τινος ἀδελφὸς ἀποθάνῃ καὶ καταλίπῃ γυναῖκα καὶ ⸂μὴ ἀφῇ τέκνον⸃, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν ⸀γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/019.yaml
  text: Teacher[a], Moses wrote for us that if someone's brother dies and leaves behind a wife and leaves no child[c][b], his brother should take the wife and raise up offspring for his brother.
translation:
  language: te
  text: “బోధకుడా, మోషే మన కోసం ఇలా రాశాడు:[a] ‘ఒకరి సోదరుడు చనిపోయి, తన వెనుక భార్యను విడిచిపెట్టి, సంతానం లేకపోతే[b], అతని సోదరుడు ఆ భార్యను భార్యగా స్వీకరించి, మరణించిన తన సోదరుని కొరకు సంతానం కలిగించాలి[c].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ద్వితీయోపదేశకాండము 25:5 చూడండి.
    reason: cross_reference
  - marker: b
    text: మరింత అక్షరార్థంగా, “ఒక్క బిడ్డనూ విడిచిపెట్టకపోతే.” గ్రీకు పదం ఏకవచనంలో ఉంది; ఇక్కడ అది సాధారణంగా సంతానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “తన సోదరుని కొరకు విత్తనాన్ని లేపాలి.” ఇది దేవర వివాహ బాధ్యత ప్రకారం మరణించిన సోదరుని పేరున సంతానం కలిగించడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: బోధకుడా
  rationale: యేసును నేరుగా సంబోధించే పదం. ఆధునిక తెలుగులో ‘బోధకుడా’ స్పష్టంగా, గౌరవప్రదంగా ఉండి διδάσκαλος అనే పదంలోని బోధించే వ్యక్తి భావాన్ని తెలియజేస్తుంది.
- source_word: ἔγραψεν ἡμῖν
  choice: మన కోసం రాశాడు
  rationale: ἡμῖν ఇక్కడ ప్రయోజనం లేదా సంబంధాన్ని సూచించే చతుర్థీ విభక్తి; ధర్మశాస్త్రం ఇశ్రాయేలు ప్రజల కోసం రాయబడిందనే వక్తల వాదనను ఈ అనువాదం సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: ఒకరి సోదరుడు చనిపోయి
  rationale: τινος అనిర్దిష్ట షష్ఠీ విభక్తి కావడంతో ‘ఒకరి’ అని సాధారణ నియమంగా అనువదించబడింది; ἀδελφός లోని పురుష బంధుత్వ సూచనను ‘సోదరుడు’ నిలుపుతుంది.
- source_word: καταλίπῃ γυναῖκα
  choice: తన వెనుక భార్యను విడిచిపెట్టి
  rationale: καταλείπω ఇక్కడ మరణ సమయంలో భార్యను వెనుక మిగిల్చడం. తెలుగులో కేవలం ‘భార్యను విడిచిపెట్టి’ అంటే విడాకుల భావం రావచ్చు కాబట్టి ‘తన వెనుక’ చేర్చి మరణ సందర్భాన్ని స్పష్టం చేశాం.
- source_word: μὴ ἀφῇ τέκνον
  choice: సంతానం లేకపోతే
  rationale: గ్రీకులో τέκνον ఏకవచనంలో ఉన్నా, ఈ నిషేధాత్మక న్యాయవాక్యంలో భావం సంతానం ఎవరూ లేకపోవడం. ‘సంతానం లేకపోతే’ ఆధునిక తెలుగులో సహజంగా ఉండి సంఖ్యను అనవసరంగా నిర్ణయించదు; అక్షరార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: అతని సోదరుడు ఆ భార్యను వివాహం చేసుకొని
  rationale: λαμβάνω + γυναῖκα ఈ వివాహ న్యాయ సందర్భంలో ఆమెను భార్యగా స్వీకరించడాన్ని సూచిస్తుంది. ‘వివాహం చేసుకొని’ అనే ప్రయోగం ఆధునిక పాఠకుడికి ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ
  choice: తన సోదరునికి సంతానం కలిగించాలి
  rationale: ‘విత్తనాన్ని లేపాలి’ అనే అక్షరానువాదం తెలుగులో అపారదర్శకంగా ఉంటుంది. దేవర వివాహ బాధ్యతలో మరణించిన సోదరుని పేరున సంతానం కలిగించడమే ఈ నుడికారం యొక్క భావం; మరణించిన అనే పదాన్ని ప్రధాన పాఠ్యంలో అదనంగా చేర్చకుండా సందర్భానికే వదిలాం.
theological_decisions:
- issue: దేవర వివాహానికి సంబంధించిన న్యాయ నుడికారాన్ని అనువదించడం
  choice: ‘ఆ భార్యను వివాహం చేసుకొని, తన సోదరునికి సంతానం కలిగించాలి’
  alternative: ‘ఆ విధవరాలిని పెళ్లి చేసుకొని, చనిపోయిన సోదరుని వంశాన్ని నిలబెట్టాలి’
  rationale: ప్రత్యామ్నాయ రూపం సందర్భ భావాన్ని బాగా వివరిస్తున్నా ‘విధవరాలు,’ ‘చనిపోయిన,’ ‘వంశాన్ని నిలబెట్టు’ అనే వివరణాత్మక పదాలను మూలంలో ఉన్న దానికంటే ఎక్కువగా చేర్చుతుంది. ఎంచుకున్న రూపం న్యాయపరమైన కుటుంబ బాధ్యతను స్పష్టంగా తెలుపుతూ మూలంలోని నిర్మాణానికి దగ్గరగా ఉంటుంది.
- issue: లింగ సూచక బంధుత్వ పదాలు
  choice: ἀδελφός మరియు γυνή పదాలకు ‘సోదరుడు,’ ‘భార్య’ అనే లింగ సూచక పదాలను నిలిపాం.
  alternative: ‘తోబుట్టువు,’ ‘జీవిత భాగస్వామి’ వంటి లింగ-తటస్థ పదాలు
  rationale: ఈ వాక్యం పురుషుడు–స్త్రీ వివాహ సందర్భంలో ఉన్న నిర్దిష్ట మోషే ధర్మశాస్త్ర నియమాన్ని ప్రస్తావిస్తుంది. అందువల్ల మూలంలోని లింగ సూచనలను తటస్థీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. న్యాయవాక్య స్వరాన్ని ‘కలిగించాలి’ ద్వారా నిలిపాం. ‘తన వెనుక భార్యను విడిచిపెట్టి’ అనే రూపం విడాకుల భావాన్ని నివారిస్తుంది. ఉద్ధరణలోని ఉద్ధరణను ఏక ఉద్ధరణ చిహ్నాలతో చూపించాం.
