revisions:
- from: “బోధకుడా, మోషే మన కోసం ఇలా రాశాడు:[a] ‘ఒకరి సోదరుడు చనిపోయి, తన వెనుక భార్యను విడిచిపెట్టి, సంతానం లేకపోతే[b], అతని సోదరుడు ఆ భార్యను వివాహం చేసుకొని, తన సోదరునికి సంతానం కలిగించాలి[c].’”
  to: “బోధకుడా, మోషే మన కోసం ఇలా రాశాడు:[a] ‘ఒకరి సోదరుడు చనిపోయి, తన వెనుక భార్యను విడిచిపెట్టి, సంతానం లేకపోతే[b], అతని సోదరుడు ఆ భార్యను భార్యగా స్వీకరించి, మరణించిన తన సోదరుని కొరకు సంతానం కలిగించాలి[c].’”
  rationale: సవరణ కేవలం సూచన-అస్పష్టతను తొలగించడానికి మరియు గ్రీకు న్యాయభాషకు కొద్దిగా దగ్గరగా ఉండడానికి చేయబడింది. ‘మరణించిన’ అనే పదం కొత్త చారిత్రక లేదా సిద్ధాంతపరమైన వివరణను చేర్చదు; ముందున్న ‘చనిపోయి’ అనే షరతులో స్పష్టమైన సూచనను చివరి పదబంధంలో నిర్దిష్టంగా మళ్లీ చూపిస్తుంది. పాదసూచిక గుర్తులు మరియు వాటి ఉద్దేశాలు సక్రమంగా నిలిపబడ్డాయి.
