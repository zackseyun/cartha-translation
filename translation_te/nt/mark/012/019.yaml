    rationale: ఈ న్యాయ-వివాహ సందర్భంలో అది సరైన భావమే. అయినప్పటికీ ‘ఆ భార్యను భార్యగా స్వీకరించి’ మూలంలోని ‘ఆ భార్యను తీసుకోవాలి’ నిర్మాణాన్ని మరింత స్పష్టంగా నిలుపుతుంది; పాదసూచికలో దేవర వివాహ వివరణ ఉండటం వల్ల అర్థం అందుబాటులో ఉంటుంది.
  revised_text: “బోధకుడా, మోషే మన కోసం ఇలా రాశాడు:[a] ‘ఒకరి సోదరుడు చనిపోయి, తన వెనుక భార్యను విడిచిపెట్టి, సంతానం లేకపోతే[b], అతని సోదరుడు ఆ భార్యను భార్యగా స్వీకరించి, మరణించిన తన సోదరుని కొరకు సంతానం కలిగించాలి[c].’”
