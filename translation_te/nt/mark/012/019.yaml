    rationale: ‘తన సోదరునికి సంతానం కలిగించాలి’లో ‘తన’ అనేది కర్త అయిన జీవించి ఉన్న సోదరునికి తిరిగి సూచించవచ్చు. గ్రీకు సందర్భంలో దాతృవిభక్తి పదబంధం మరణించిన సోదరుని కొరకే ఉంది. ‘మరణించిన సోదరుని కొరకు’ అని చేయడం భావాన్ని మార్చకుండా సూచనను స్పష్టం చేస్తుంది.
