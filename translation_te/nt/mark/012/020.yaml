  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి పాటించబడింది. మూలంలోని వరుస క్రమాన్ని ‘మొదటివాడు’గా నిలిపి, ‘పెద్దవాడు’ అనే నిర్ధారించని వయస్సు భావాన్ని చేర్చలేదు.
