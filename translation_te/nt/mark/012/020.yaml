  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἑπτὰ ἀδελφοὶ ἦσαν· καὶ ὁ πρῶτος ἔλαβεν γυναῖκα, καὶ ἀποθνῄσκων οὐκ ἀφῆκεν σπέρμα·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/020.yaml
  text: There were seven brothers; and the first took a wife[a], and when he died he left no offspring.
translation:
  language: te
  text: ఏడుగురు అన్నదమ్ములు ఉండేవారు. మొదటివాడు పెళ్లి చేసుకున్నాడు; అతడు చనిపోయినప్పుడు సంతానం[a] ఏదీ మిగిల్చలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘విత్తనం.’ గ్రీకులో ఈ పదం సంతానం లేదా సంతతిని సూచించే నుడికారంగా వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτὰ ἀδελφοὶ ἦσαν
  choice: ఏడుగురు అన్నదమ్ములు ఉండేవారు
  rationale: అస్తిత్వాన్ని తెలిపే గ్రీకు వాక్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, ఈ సందర్భంలో పురుష సహోదరులనే సూచిస్తున్నందున ‘అన్నదమ్ములు’ అని అనువదించబడింది.
- source_word: ὁ πρῶτος
  choice: మొదటివాడు
  rationale: ఇది వయస్సును తప్పనిసరిగా సూచించకుండా, ఆ ఏడుగురిలో క్రమపరంగా మొదటివాణ్ణి సూచిస్తుంది; అందువల్ల ‘పెద్దవాడు’ అనే అదనపు భావాన్ని చేర్చలేదు.
- source_word: ἔλαβεν γυναῖκα
  choice: పెళ్లి చేసుకున్నాడు
  rationale: గ్రీకు పదబంధం వివాహం చేసుకోవడాన్ని సూచించే నుడికారం. ‘భార్యను తీసుకున్నాడు’ అనే కృత్రిమ అక్షరానువాదం కంటే ఇది సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ἀποθνῄσκων
  choice: అతడు చనిపోయినప్పుడు
  rationale: వర్తమాన కృదంతంలోని కాలసంబంధాన్ని తెలుగులో సహజమైన ఉపవాక్యంగా వ్యక్తం చేస్తుంది.
- source_word: οὐκ ἀφῆκεν
  choice: ఏదీ మిగిల్చలేదు
  rationale: మరణించినప్పుడు తన వెనుక ఎవరినీ ఉంచకపోవడం అనే సందర్భార్థాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: σπέρμα
  choice: సంతానం
  rationale: అక్షరార్థం ‘విత్తనం’ అయినా, ఈ కుటుంబ-న్యాయ సందర్భంలో ఇది సంతతిని సూచిస్తుంది. ‘సంతానం’ ఆ విస్తృత భావాన్ని సహజంగా తెలియజేస్తుంది.
