id: MRK.12.5
reference: Mark 12:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀καὶ ἄλλον ἀπέστειλεν· κἀκεῖνον ἀπέκτειναν, καὶ πολλοὺς ἄλλους, ⸂οὓς μὲν δέροντες οὓς δὲ ἀποκτέννοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/005.yaml
  text: And he sent another[a], and they killed that one; and many others—some they beat, and some they killed.
translation:
  language: te
  text: ఆ తర్వాత అతడు మరొకరిని పంపాడు; అతనిని కూడా వారు చంపేశారు. ఇంకా అనేకమందిని పంపాడు[a]—వారిలో కొందరిని కొట్టారు, మరికొందరిని చంపేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో అక్షరార్థంగా, “ఇంకా అనేకమందిని—కొందరిని కొడుతూ, మరికొందరిని చంపుతూ” అని ఉంది; “పంపాడు” అనే క్రియ సందర్భానుసారం సరఫరా చేయబడింది.
    reason: ellipsis_and_lexical_alternative
lexical_decisions:
- source_word: ἄλλον
  choice: మరొకరిని
  rationale: యజమాని వరుసగా పంపిన సేవకుల్లో ఇంకొకరిని సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజమైన, నేరుగా అర్థమయ్యే రూపం.
- source_word: ἀπέστειλεν
  choice: పంపాడు
  rationale: సాధారణ కథన క్రియను అదనపు భావం చేర్చకుండా స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: κἀκεῖνον
  choice: అతనిని కూడా
  rationale: καί + ἐκεῖνονలోని నిర్దేశక, అదనపు భావాలు రెండింటినీ తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: ἀπέκτειναν / ἀποκτέννοντες
  choice: చంపేశారు
  rationale: హత్య యొక్క తీవ్రతను స్పష్టంగా తెలియజేస్తూ, కథనానికి తగిన సహజమైన ఆధునిక తెలుగు రూపాన్ని ఇస్తుంది.
- source_word: πολλοὺς ἄλλους
  choice: ఇంకా అనేకమందిని
  rationale: ముందు పంపబడినవారికి అదనంగా మరెందరో ఉన్నారని తెలియజేస్తుంది.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: వారిలో కొందరిని ... మరికొందరిని
  rationale: గ్రీకు విభజనాత్మక నిర్మాణాన్ని సహజమైన తెలుగులో స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: δέροντες
  choice: కొట్టారు
  rationale: δέρω సూచించే దెబ్బలు కొట్టడాన్ని నిలుపుతుంది; న్యాయపరమైన కొరడా శిక్ష అనే అవసరం లేని ప్రత్యేక భావాన్ని చేర్చదు.
theological_decisions:
- issue: వరుస చర్యలను తెలిపే గ్రీకు వర్తమాన కృదంతాల అనువాదం
  choice: పరిమిత క్రియలుగా ‘కొందరిని కొట్టారు, మరికొందరిని చంపేశారు’ అని అనువదించడం
  alternative: ‘కొందరిని కొడుతూ, మరికొందరిని చంపుతూ’
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కాదు. గ్రీకు కృదంతాలు అనేక సేవకులపై జరిగిన వేర్వేరు చర్యలను సంక్షిప్తంగా వివరిస్తున్నాయి; తెలుగులో పరిమిత క్రియలు ఆ విభజనను మరింత సహజంగా, స్పష్టంగా తెలియజేస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా ఉండడంతో పాటు కథనంలోని పెరుగుతున్న హింసను, గ్రీకు వాక్యంలోని విభజనాత్మక భావాన్ని నిలుపుకుంది.
