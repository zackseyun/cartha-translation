id: MRK.12.1
reference: Mark 12:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο αὐτοῖς ἐν παραβολαῖς ⸀λαλεῖν· Ἀμπελῶνα ⸂ἄνθρωπος ἐφύτευσεν⸃, καὶ περιέθηκεν φραγμὸν καὶ ὤρυξεν ὑπολήνιον καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/001.yaml
  text: 'And he began to speak to them in parables: “A man planted a vineyard[a], and put a fence around it, and dug a winepress pit, and built a tower, and leased it to tenant farmers[d][c][b], and went away.”'
translation:
  language: te
  text: 'మరి ఆయన వారికి ఉపమానాల రూపంలో మాట్లాడడం మొదలుపెట్టాడు: “ఒక మనిషి ద్రాక్షతోట నాటాడు. దాని చుట్టూ కంచె వేశాడు[a], ద్రాక్షరసం చేరే గుంత తవ్వాడు[b], ఒక గోపురం కట్టాడు[d]. ఆ తోటను కౌలు రైతులకు ఇచ్చి[c], వెళ్లిపోయాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దాని చుట్టూ ముళ్లకంచె పెంచాడు.” గ్రీకు φραγμός అనే పదం కంచెను, పొదల కంచెను లేదా చుట్టూ ఉండే అడ్డంకిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ద్రాక్షగానుగ కింది తొట్టి కోసం గుంత తవ్వాడు.” గ్రీకు ὑπολήνιον ద్రాక్షగానుగలో రసం చేరే కింది తొట్టిని లేదా గుంతను ప్రత్యేకంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా “ద్రాక్షతోట సాగుదారులకు కౌలుకు ఇచ్చి” లేదా “రైతులకు అద్దెకు ఇచ్చి.”
    reason: lexical_alternative
  - marker: d
    text: ఈ దృశ్యం యెషయా 5:1–2ను ప్రతిధ్వనిస్తుంది; అక్కడ కూడా ద్రాక్షతోటను నాటి, దాని చుట్టూ రక్షణ ఏర్పాటు చేసి, ద్రాక్షగానుగను మరియు గోపురాన్ని సిద్ధం చేస్తారు.
    reason: cross_reference
lexical_decisions:
- source_word: ἤρξατο αὐτοῖς ἐν παραβολαῖς λαλεῖν
  choice: ఆయన వారికి ఉపమానాల ద్వారా మాట్లాడడం మొదలుపెట్టాడు
  rationale: గ్రీకు వాక్యంలోని ఆరంభార్థక నిర్మాణాన్ని నిలుపుతూ, ἐν παραβολαῖς అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఉపమానాల ద్వారా’ అని వ్యక్తం చేస్తుంది.
- source_word: Ἀμπελῶνα ἄνθρωπος ἐφύτευσεν
  choice: ఒక మనిషి ద్రాక్షతోట నాటాడు
  rationale: ἄνθρωπος ఇక్కడ కథలోని పురుష భూయజమానిని సూచిస్తుంది; ἀμπελώνకు ‘ద్రాక్షతోట’ సాధారణమైన స్పష్టమైన సమానం.
- source_word: περιέθηκεν φραγμόν
  choice: దాని చుట్టూ కంచె వేశాడు
  rationale: φραγμός కంచె, ముళ్లకంచె లేదా ఇతర రక్షణ ఆవరణను సూచించగలదు. ప్రధాన పాఠంలో ‘కంచె’ విస్తృతమైన, సహజమైన ఎంపిక.
- source_word: ὤρυξεν ὑπολήνιον
  choice: ద్రాక్షరసం చేరే తొట్టి కోసం గుంత తవ్వాడు
  rationale: ὑπολήνιον ద్రాక్షగానుగలో పిండిన రసం కిందికి చేరే తొట్టి లేదా గుంతను ప్రత్యేకంగా సూచిస్తుంది. కేవలం ‘ద్రాక్షగానుగ’ అనడం కంటే ఈ అనువాదం దాని నిర్దిష్ట పనిని స్పష్టం చేస్తుంది.
- source_word: ᾠκοδόμησεν πύργον
  choice: ఒక కావలి గోపురం కట్టాడు
  rationale: πύργοςకు ‘గోపురం’ నేరమైన సమానం; ద్రాక్షతోట సందర్భంలో దాని కావలి ప్రయోజనాన్ని ‘కావలి’ సహజంగా తెలియజేస్తుంది.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: ఆ తోటను కౌలు రైతులకు ఇచ్చి
  rationale: ἐκδίδωμι ఆస్తిని కౌలుకు ఇవ్వడాన్ని సూచిస్తుంది. γεωργοί ఇక్కడ యజమాని భూమిని సాగుచేసే రైతులు కాబట్టి ‘కౌలు రైతులు’ యాజమాన్య-కౌలు సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἀπεδήμησεν
  choice: దూరదేశానికి వెళ్లాడు
  rationale: ἀποδημέω కొంతకాలం తన ప్రాంతం విడిచి వేరే చోటికి వెళ్లడాన్ని సూచిస్తుంది. ‘దూరదేశానికి వెళ్లాడు’ ఆ భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ἄνθρωπος యొక్క లింగ సూచన
  choice: ఒక మనిషి
  alternative: ఒక వ్యక్తి / ఒకరు
  rationale: ఇక్కడ సాధారణ మానవజాతి కాక, కథలోని పురుష భూయజమాని ఉద్దేశించబడ్డాడు. అందువల్ల మూలంలోని కథాచిత్రానికి ‘ఒక మనిషి’ సరిపోతుంది.
- issue: γεωργοῖς యొక్క సందర్భానుగుణ నిర్దిష్టత
  choice: కౌలు రైతులు
  alternative: రైతులు / ద్రాక్షతోట సాగుదారులు
  rationale: తోటను వారికి కౌలుకు ఇచ్చినట్లు క్రియ స్పష్టం చేస్తుంది. అందువల్ల కేవలం ‘రైతులు’ అనకుండా ‘కౌలు రైతులు’ అనడం కథలోని యాజమాన్య సంబంధాన్ని సంరక్షిస్తుంది; అదనపు సిద్ధాంతార్థాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. వ్యవసాయ సాంకేతిక పదమైన ὑπολήνιονను అతిగా సంక్షిప్తం చేయకుండా దాని పనిని వివరించే పదబంధంతో అనువదించాం. యెషయా ప్రతిధ్వనిని ప్రధాన పాఠంలో వ్యాఖ్యానించకుండా పాదటిప్పణిలో ఉంచాం.
