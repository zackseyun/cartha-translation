id: MRK.12.44
reference: Mark 12:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάντες γὰρ ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον, αὕτη δὲ ἐκ τῆς ὑστερήσεως αὐτῆς πάντα ὅσα εἶχεν ἔβαλεν, ὅλον τὸν βίον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/044.yaml
  text: For they all gave out of their abundance[a], but she, out of her poverty, put in everything she had—her whole livelihood.
translation:
  language: te
  text: ఎందుకంటే వారందరూ తమ అవసరాలకు మించినదానిలో నుండి వేశారు; కానీ ఈమె తన లేమిలో నుండి తనకు ఉన్నదంతా—తన జీవనాధారమంతా[a]—వేసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తాను జీవించడానికి ఉన్నదంతా.”
    reason: ὅλον τὸν βίον αὐτῆς లో βίοςకు ‘జీవనాధారం’తో పాటు ‘జీవించడానికి ఉన్నది’ అనే స్పష్టీకరణాత్మక అర్థం కూడా సాధ్యమే.
lexical_decisions:
- source_word: πάντες γὰρ
  choice: ఎందుకంటే వారందరూ
  rationale: γάρ ముందటి వాక్యంలోని యేసు అంచనాకు కారణాన్ని వివరిస్తుంది; πάντες యొక్క సమగ్ర భావాన్ని ‘వారందరూ’ సహజంగా నిలుపుతుంది.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: తమకు మిగిలినదానిలో నుంచి
  rationale: περισσεύω ఇక్కడ అవసరాలకు మించి ఉన్నదాన్ని సూచిస్తుంది. ‘మిగిలినదానిలో నుంచి’ అనే రూపం సంపదను అతిశయింపజేయకుండా మిగులు అనే భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: ἔβαλον / ἔβαλεν
  choice: వేశారు / వేసింది
  rationale: కానుక పెట్టెలో నాణేలు వేయడమనే సందర్భంలో βάλλω యొక్క భౌతిక చర్యను సహజమైన తెలుగులో నిలుపుతూ, రెండు చోట్ల ఉన్న మూలపద పునరుక్తిని కూడా కాపాడుతుంది.
- source_word: αὕτη δὲ
  choice: కాని ఈమె
  rationale: δέ యొక్క వ్యతిరేకతను ‘కాని’ తెలియజేస్తుంది; αὕτη యొక్క సూచనాత్మక బలాన్ని ‘ఈమె’ నిలుపుతుంది.
- source_word: ἐκ τῆς ὑστερήσεως αὐτῆς
  choice: తన లేమిలో నుంచి
  rationale: ὑστέρησις కొరత, అవసరం, దారిద్ర్య స్థితిని సూచిస్తుంది. ‘లేమి’ మూలంలోని విస్తృత భావాన్ని కాపాడుతూ సహజంగా ఉంటుంది.
- source_word: πάντα ὅσα εἶχεν
  choice: తనకున్నదంతా
  rationale: ఈ పదబంధంలోని సమగ్రతను సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగులో పూర్తిగా వ్యక్తం చేస్తుంది.
- source_word: ὅλον τὸν βίον αὐτῆς
  choice: తాను జీవించడానికి ఉన్నదంతా
  rationale: βίος ఇక్కడ జీవనోపాధి లేదా బతుకుదెరువుకు ఉన్న సాధనాలను సూచిస్తుంది. ఈ రూపం కేవలం జీవితం అనే అపార్థాన్ని నివారించి ఆర్థిక భావాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ὅλον τὸν βίον αὐτῆς లో βίος యొక్క అర్థం
  choice: తాను జీవించడానికి ఉన్నదంతా—ఆమె జీవనాధారమంతా
  alternative: ఆమె జీవితమంతా
  rationale: సందర్భం ధనకానుక గురించి; βίος జీవించడానికి అవసరమైన ఆస్తి లేదా జీవనోపాధిని సూచించగలదు. కాబట్టి ఆమె అక్షరార్థంగా తన ప్రాణాన్ని ఇచ్చిందనే భావాన్ని చేర్చకుండా, ఆమె ఇచ్చినదాని సంపూర్ణతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా గంభీరంగా రూపొందించబడింది. మూలంలోని ధనికుల మిగులు–విధవరాలి లేమి అనే వ్యతిరేకతను, అలాగే βάλλω పునరుక్తిని నిలుపుకుంది.
