- from: ఎందుకంటే వారందరూ తమకు మిగిలినదానిలో నుంచి వేశారు; కాని ఈమె తన లేమిలో నుంచి తనకున్నదంతా—తాను జీవించడానికి ఉన్నదంతా—వేసింది.
  to: ఎందుకంటే వారందరూ తమ అవసరాలకు మించినదానిలో నుండి వేశారు; కానీ ఈమె తన లేమిలో నుండి తనకు ఉన్నదంతా—తన జీవనాధారమంతా[a]—వేసింది.
