translation_notes:
  register: సాధారణ ఆధునిక ప్రమాణ తెలుగులో, కథనానికి తగిన సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘వట్టి చేతులతో’ అనే సుపరిచిత నుడికారం మూలంలోని భావాన్ని సహజంగా తెలియజేస్తుంది; అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
