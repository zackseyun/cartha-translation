  text: And they took him[a], beat him, and sent him away empty-handed.
translation:
  language: te
  text: వారు అతణ్ణి పట్టుకొని, కొట్టి, వట్టి చేతులతో పంపివేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఖాళీగా పంపివేశారు.’ గ్రీకు κενόν అనే పదం ఇక్కడ ఆ సేవకుడు ఏమీ పొందకుండా తిరిగి పంపబడ్డాడని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: పట్టుకొని
  rationale: ఇది తరువాతి క్రియలకు ముందు జరిగిన చర్యను తెలిపే భూతకాల క్రియావిశేష రూపం. సందర్భంలో బలవంతంగా అదుపులోకి తీసుకోవడం సూచితమైనా, మూలపదం అవసరానికి మించిన తీవ్రతను చేర్చకుండా ‘పట్టుకొని’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ἔδειραν
  choice: కొట్టి
  rationale: δέρω ఇక్కడ కొట్టడం లేదా చితకబాదడం అనే అర్థం ఇస్తుంది. అధికారికంగా కొరడాలతో శిక్షించారని మూలంలో స్పష్టంగా లేనందున సాధారణమైన ‘కొట్టి’ని ఎంచుకున్నాం.
- source_word: ἀπέστειλαν
  choice: పంపివేశారు
  rationale: దుర్వ్యవహారం చేసిన తరువాత తమ దగ్గర నుంచి అతణ్ణి తిరిగి పంపిన భావాన్ని ‘పంపివేశారు’ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: κενόν
  choice: వట్టి చేతులతో
  rationale: ఈ విశేషణానికి అక్షరార్థం ‘ఖాళీగా’. ఇక్కడ సేవకుడు పొందవలసినదేదీ పొందకుండా తిరిగి పంపబడ్డాడనే భావాన్ని తెలుగు నుడికారమైన ‘వట్టి చేతులతో’ స్పష్టంగా అందిస్తుంది.
- source_word: καὶ ... καὶ
  choice: పట్టుకొని, కొట్టి, ... పంపివేశారు
  rationale: తెలుగులో వరుస చర్యలను అసమాపక క్రియలతో సహజంగా అనుసంధానించడం ద్వారా గ్రీకు వాక్యంలోని సరళమైన క్రమాన్ని నిలిపాం.
