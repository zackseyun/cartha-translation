  text: καὶ πάλιν ἀπέστειλεν πρὸς αὐτοὺς ἄλλον δοῦλον· ⸀κἀκεῖνον ⸀ἐκεφαλίωσαν καὶ ⸀ἠτίμασαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/004.yaml
  text: And again he sent another servant to them[c][b][a], and they struck him on the head and dishonored him.
translation:
  language: te
  text: మళ్లీ అతడు వారి దగ్గరకు మరో సేవకుణ్ణి[a] పంపించాడు. వారు అతని తలపై కొట్టి[b], అతణ్ణి అవమానించారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరో బానిసను.” గ్రీకు పదమైన δοῦλος సందర్భాన్ని బట్టి “సేవకుడు” లేదా “బానిస” అని అర్థమవుతుంది.
    reason: alternative_reading
  - marker: b
    text: ఇక్కడున్న అరుదైన గ్రీకు క్రియ తలపై హింస చేయడాన్ని సూచిస్తుంది. దీనికి “తలపై కొట్టారు” లేదా “తలకు గాయం చేశారు” అనే అర్థం ఉండవచ్చు; “తల నరికారు” అని కాదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “అతనితో అవమానకరంగా ప్రవర్తించారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: మళ్లీ
  rationale: ఉపమానంలోని వరుస చర్య పునరావృతమైందని సహజమైన, సంక్షిప్తమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀπέστειλεν
  choice: పంపించాడు
  rationale: సాధారణ భూతకాల కథన చర్యను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πρὸς αὐτοὺς
  choice: వారి దగ్గరకు
  rationale: పంపించడం అనే క్రియతో గమ్యాన్ని సూచించే πρὸς భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἄλλον δοῦλον
  choice: మరో సేవకుణ్ణి
  rationale: యజమాని–సేవకుని సంబంధాన్ని స్పష్టంగా ఉంచుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది; δοῦλος‌కు ‘బానిస’ అనే అర్థం కూడా సాధ్యమని పాదటిప్పణిలో ఉంచబడింది.
- source_word: κἀκεῖνον
  choice: అతని / అతణ్ణి
  rationale: ‘ఆ వ్యక్తిని కూడా’ అనే కొనసాగింపు భావం వాక్యసందర్భంలో సహజమైన సర్వనామాల ద్వారా వ్యక్తమవుతుంది.
- source_word: ἐκεφαλίωσαν
  choice: అతని తలపై కొట్టి
  rationale: అరుదైన ఈ క్రియ తలపై జరిగిన హింసను సూచిస్తుంది; శిరచ్ఛేదం చేశారనే తప్పుదారి పట్టించే భావాన్ని నివారిస్తుంది.
- source_word: ἠτίμασαν
  choice: అతణ్ణి అవమానించారు
  rationale: అగౌరవంగా, సిగ్గుపడేలా ప్రవర్తించారనే భావాన్ని సంక్షిప్తమైన ఆధునిక తెలుగులో అందిస్తుంది.
