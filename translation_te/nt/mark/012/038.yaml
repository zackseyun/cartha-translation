  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐν τῇ διδαχῇ αὐτοῦ ἔλεγεν⸃· Βλέπετε ἀπὸ τῶν γραμματέων τῶν θελόντων ἐν στολαῖς περιπατεῖν καὶ ἀσπασμοὺς ἐν ταῖς ἀγοραῖς
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/038.yaml
  text: And in his teaching he was saying[b][a], “Beware of the scribes who want to walk around in long robes and receive greetings in the marketplaces,”
translation:
  language: te
  text: 'ఆయన బోధిస్తూ ఇలా చెప్పేవాడు: “పొడవాటి వస్త్రాలు[b] ధరించి తిరగాలని, సంతస్థలాల్లో అభివాదాలు పొందాలని కోరుకునే శాస్త్రుల విషయంలో జాగ్రత్తగా ఉండండి[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “శాస్త్రుల పట్ల అప్రమత్తంగా ఉండండి” లేదా “శాస్త్రుల విషయంలో మిమ్మల్ని మీరు కాపాడుకోండి.”
    reason: lexical_alternative
  - marker: b
    text: “పొడవాటి వస్త్రాలు” అనేవి హోదాను, బహిరంగ గౌరవాన్ని ప్రదర్శించే ప్రత్యేకమైన పైవస్త్రాలను సూచిస్తాయి.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τῇ διδαχῇ αὐτοῦ ἔλεγεν
  choice: ఆయన బోధిస్తూ ఇలా చెప్పేవాడు
  rationale: బోధ సందర్భాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, ἔλεγεν లోని కొనసాగుతున్న లేదా అలవాటైన భూతకాల భావాన్ని ‘చెప్పేవాడు’ ద్వారా నిలుపుతుంది.
- source_word: Βλέπετε ἀπὸ
  choice: విషయంలో జాగ్రత్తగా ఉండండి
  rationale: ఇది కేవలం చూడమనే ఆజ్ఞ కాదు; వారిపట్ల అప్రమత్తంగా ఉండాలనే హెచ్చరిక. తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉండేందుకు హెచ్చరిక పొందే వర్గం తర్వాత ఈ పదబంధం ఉంచబడింది.
- source_word: γραμματέων
  choice: శాస్త్రులు
  rationale: యూదుల ధర్మశాస్త్రాన్ని ప్రతిలిఖించి బోధించే నిపుణులకు సువార్తలలో సంప్రదాయంగా, సంక్షిప్తంగా వాడే పదం.
- source_word: τῶν θελόντων
  choice: కోరుకునే
  rationale: వారి ప్రత్యేకమైన అభిలాష లేదా ఇష్టాన్ని నేరుగా వ్యక్తపరుస్తుంది; కేవలం ప్రవర్తనను మాత్రమే కాక దాని వెనుకనున్న కోరికను కూడా నిలుపుతుంది.
- source_word: ἐν στολαῖς περιπατεῖν
  choice: పొడవాటి వస్త్రాలు ధరించి తిరగాలని
  rationale: στολαί సూచించే పొడవైన, హోదాను ప్రదర్శించే బాహ్య వస్త్రాల రూపాన్ని స్పష్టంగా తెలియజేస్తుంది; περιπατεῖν ను సహజంగా ‘తిరగడం’గా అనువదిస్తుంది.
- source_word: ἀσπασμοὺς
  choice: గౌరవపూర్వక అభివాదాలు
  rationale: సాధారణ పలకరింపులకన్నా బహిరంగంగా లభించే సామాజిక గౌరవం ఈ సందర్భంలో ప్రధానమైనందున, సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: సంతవీధుల్లో
  rationale: ἀγοραί అనేవి వ్యాపారంతోపాటు ప్రజలు కూడే బహిరంగ ప్రదేశాలు; ‘సంతవీధులు’ ఆ ప్రజా సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: శాస్త్రుల గురించి యేసు చేసిన హెచ్చరిక ఎవరిని ఉద్దేశిస్తుంది?
  choice: హోదా ప్రదర్శనను, బహిరంగ గౌరవాన్ని కోరుకునే శాస్త్రుల గురించి హెచ్చరికగా అనువదించబడింది.
  alternative: శాస్త్రులందరినీ ఎలాంటి భేదం లేకుండా ఖండించడం.
  rationale: τῶν θελόντων అనే విశేషణాత్మక భాగం ప్రస్తావించిన శాస్త్రులను వారి కోరికల ద్వారా వర్ణిస్తుంది. విరామచిహ్నం లేదా వివరణ ద్వారా శాస్త్రులందరిపై సంపూర్ణ ఖండనను అనువాదం రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే యేసు హెచ్చరికకు తగిన గంభీరతతో రూపొందించబడింది. మూలంలోని కొనసాగుతున్న భూతకాల భావం మరియు శాస్త్రులను పరిమితం చేసి వర్ణించే భాగం నిలుపబడ్డాయి.
