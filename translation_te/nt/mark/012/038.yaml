    rationale: The Greek text says “greetings”; the public-honor nuance is appropriately supplied by the cultural footnote, preserving the concise wording of the source.
  - severity: low
    issue: “సంతవీధుల్లో” narrows ἀγοραῖς to streets.
    rationale: The Greek denotes market areas/public market places more generally. “సంతస్థలాల్లో” better preserves that scope.
