source:
  edition: SBLGNT
  text: Καὶ ἀποστέλλουσιν πρὸς αὐτόν τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν ἵνα αὐτὸν ἀγρεύσωσιν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/013.yaml
  text: And they send to him some of the Pharisees and some of the Herodians[a], so that they might trap him by a word.
translation:
  language: te
  text: వారు పరిసయ్యులలో కొందరినీ హేరోదీయులలో కొందరినీ ఆయన దగ్గరకు పంపారు; ఆయన మాట ద్వారా ఆయనను ఉచ్చులో పట్టుకోవాలన్న ఉద్దేశంతో.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన చెప్పిన మాటతో ఆయనను చిక్కించుకోవాలని.” గ్రీకు క్రియలో వేటాడి పట్టుకునే రూపకం ఉంది; చివరి పదబంధం ఆయన మాటనే ఆయనను పట్టుకోవడానికి సాధనంగా వాడాలన్న భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: పంపారు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, తెలుగు కథనశైలిలో సహజమైన భూతకాలాన్ని ఉపయోగించాం.
- source_word: τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν
  choice: పరిసయ్యులలో కొందరినీ హేరోదు పక్షంవారిలో కొందరినీ
  rationale: τινας తో కూడిన విభాగార్థక షష్ఠీ నిర్మాణం రెండు వర్గాల నుంచీ కొందరిని పంపినట్లు సూచిస్తుంది.
- source_word: Φαρισαίων
  choice: పరిసయ్యులు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన యూదు వర్గనామాన్ని ఉపయోగించాం.
- source_word: Ἡρῳδιανῶν
  choice: హేరోదు పక్షంవారు
  rationale: హేరోదుతో అనుబంధమున్న వర్గం అనే భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἵνα
  choice: చిక్కించుకోవాలని
  rationale: ఉద్దేశాన్ని తెలిపే ἵνα ఉపవాక్యాన్ని సహజమైన తెలుగు ప్రయోజనార్థక నిర్మాణంగా అందించాం.
- source_word: ἀγρεύσωσιν
  choice: చిక్కించుకోవడం
  rationale: వేటలో పట్టుకోవడం అనే రూపకాన్ని సందర్భానుసారంగా ఉచ్చులో చిక్కించడం అనే శత్రుత్వ భావంతో అందిస్తుంది.
- source_word: λόγῳ
  choice: మాటల్లోనే
  rationale: సాధనార్థక దత్తిని, ఆయన పలికే మాట ఆధారంగానే ఆయనను పట్టుకోవాలనే భావంతో సహజంగా అందించాం; గ్రీకు ఏకవచనంలోని సంక్షిప్తత తెలుగులో భావపరంగా వ్యక్తమవుతుంది.
theological_decisions:
- issue: గ్రీకు బహువచన క్రియలో కర్త ప్రత్యక్షంగా పేర్కొనబడలేదు
  choice: వారు
  alternative: మునుపటి సందర్భంలోని ప్రధాన యాజకులు, శాస్త్రులు, పెద్దలు
  rationale: ఈ వచనం కర్తను మళ్లీ నిర్దిష్టంగా చెప్పనందున, సందర్భం నుంచి పేర్లను ప్రధాన పాఠ్యంలో చేర్చకుండా అస్పష్ట బహువచనాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథనశైలి. వాక్య కర్తలోని మూలభాష అస్పష్టతను కాపాడాం.
