id: MRK.12.2
reference: Mark 12:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν πρὸς τοὺς γεωργοὺς τῷ καιρῷ δοῦλον, ἵνα παρὰ τῶν γεωργῶν λάβῃ ἀπὸ ⸂τῶν καρπῶν⸃ τοῦ ἀμπελῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/002.yaml
  text: And at the proper time he sent a servant to the vine-growers[b][a], so that he might receive from the vine-growers some of the fruit of the vineyard.
translation:
  language: te
  text: తగిన కాలంలో, ద్రాక్షతోటను సాగుచేసేవారి[b] దగ్గర నుంచి ఆ తోట పండ్లలో కొంత పొందడానికి అతడు వారి దగ్గరికి ఒక బానిసను[a] పంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సేవకుణ్ణి’ అని అనువదించవచ్చు. గ్రీకు పదం δοῦλος యజమాని అధీనంలో ఉన్న బానిసను లేదా సేవకుణ్ణి సూచించగలదు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘రైతులు’ లేదా ‘కౌలుదారులు.’ గ్రీకు పదం భూమిని సాగుచేసేవారిని సూచిస్తుంది; ఇక్కడ ద్రాక్షతోట సందర్భం వల్ల మరింత నిర్దిష్టంగా అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: పంపాడు
  rationale: సాధారణ కథన శైలిలోని భూతకాల క్రియను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γεωργούς / γεωργῶν
  choice: ద్రాక్షతోటను సాగుచేసేవారు
  rationale: γεωργός భూమిని సాగుచేసే వ్యక్తిని సూచిస్తుంది; ఈ సందర్భంలోని ద్రాక్షతోట ప్రత్యేకతను ఈ పదబంధం నిలుపుతుంది, అయితే కౌలుదారులనే అర్థాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: τῷ καιρῷ
  choice: తగిన కాలంలో
  rationale: καιρός ఇక్కడ సముచితమైన లేదా నియమితమైన కాలాన్ని సూచిస్తుంది; పంటకాలమని పాఠంలో లేనిదాన్ని నేరుగా చేర్చకుండా భావాన్ని తెలియజేస్తుంది.
- source_word: δοῦλον
  choice: బానిసను
  rationale: δοῦλος సూచించే యజమాని అధీనంలోని సామాజిక స్థితిని ‘బానిస’ స్పష్టంగా నిలుపుతుంది; ‘సేవకుడు’ అనే సాంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἵνα ... λάβῃ
  choice: పొందడానికి
  rationale: ἵνα ఉపవాక్యంలోని ఉద్దేశ భావాన్ని సహజమైన తెలుగు క్రియారూపంతో వ్యక్తం చేస్తుంది.
- source_word: παρὰ τῶν γεωργῶν
  choice: సాగుచేసేవారి దగ్గర నుంచి
  rationale: παρά + షష్ఠీ విభక్తి తెలిపే మూలం లేదా వ్యక్తుల నుంచి స్వీకరించడమనే భావాన్ని నేరుగా అందిస్తుంది.
- source_word: ἀπὸ τῶν καρπῶν τοῦ ἀμπελῶνος
  choice: ఆ తోట పండ్లలో కొంత
  rationale: ἀπό + షష్ఠీ విభక్తిలోని భాగార్థాన్ని ‘కొంత’ సహజంగా స్పష్టం చేస్తుంది; ‘తన వాటా’ అని మూలంలో లేని భావాన్ని చేర్చదు.
- source_word: ἀμπελῶνος
  choice: ద్రాక్షతోట
  rationale: ἀμπελώνకు ప్రామాణికమైన, స్పష్టమైన తెలుగు సమానార్థకం.
