translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘సాగుచేసేవారు’ అనే రూపం సులభంగా అర్థమవుతూ మూలపదంలోని విస్తృత అర్థాన్ని, ద్రాక్షతోట సందర్భాన్ని రెండింటినీ నిలుపుతుంది.
