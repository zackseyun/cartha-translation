source:
  edition: SBLGNT
  text: ⸀αὐτὸς Δαυὶδ εἶπεν ἐν ⸂τῷ πνεύματι τῷ⸃ ἁγίῳ· ⸀Εἶπεν ⸀κύριος τῷ κυρίῳ μου· ⸀Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/036.yaml
  text: David himself said in the Holy Spirit[a], ‘The Lord said to my Lord[b], “Sit at my right hand until I put your enemies under your feet.”’
translation:
  language: te
  text: 'దావీదే పరిశుద్ధాత్మలో[a] ఇలా అన్నాడు: “ప్రభువు నా ప్రభువుతో ఇలా అన్నాడు: ‘నేను నీ శత్రువులను నీ పాదాల కింద ఉంచేవరకు నా కుడివైపున కూర్చో.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ ఉల్లేఖనం కీర్తన 110:1 నుండి వచ్చింది. హీబ్రూ పాఠంలో మొదటి ‘ప్రభువు’ హీబ్రూ దైవనామం YHWHను సూచిస్తుంది; రెండవది దావీదు ప్రభువును సూచిస్తుంది. ‘పరిశుద్ధాత్మలో’ అనే మాటను ‘పరిశుద్ధాత్మ ద్వారా’ అని కూడా అనువదించవచ్చు.
    reason: cross_reference_and_alternative_rendering
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: దావీదే
  rationale: αὐτός యొక్క ఉద్ఘాటనను ఆధునిక తెలుగులో సహజంగా వ్యక్తపరచడానికి ‘దావీదే’ అని అనువదించాం.
- source_word: ἐν τῷ πνεύματι τῷ ἁγίῳ
  choice: పరిశుద్ధాత్మలో
  rationale: ἐν అనే పూర్వప్రత్యయాన్ని నేరుగా ప్రతిబింబిస్తూ, ప్రేరణ యొక్క విధానాన్ని అవసరానికి మించి నిర్దిష్టం చేయకుండా గ్రీకు వాక్యంలోని అస్పష్టతను నిలుపుతుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: κύριοςకు సాధారణమైన గౌరవార్థక దైవసంబంధ తెలుగు పదం; రెండు సందర్భాల్లోనూ ఒకే పదాన్ని ఉంచడం ద్వారా మార్కు గ్రీకు పాఠంలోని పదపునరుక్తిని కాపాడాం.
- source_word: τῷ κυρίῳ μου
  choice: నా ప్రభువుతో
  rationale: దావీదు ‘నా ప్రభువు’ అని సంబోధించిన భావాన్ని, κύριος పదపునరుక్తిని నిలుపుతూ వ్యక్తపరుస్తుంది.
- source_word: Κάθου
  choice: కూర్చో
  rationale: సింహాసనారోహణ సందర్భంలో సహజమైన, సంక్షిప్తమైన ఆజ్ఞారూపం.
- source_word: ἐκ δεξιῶν μου
  choice: నా కుడివైపున
  rationale: గ్రీకు నుడికారానికి సహజమైన తెలుగు సమానం; పదశః ‘కుడిచేతి నుండి’ అని అనడం ఇక్కడ భావాన్ని వక్రీకరిస్తుంది.
- source_word: ἕως ἂν θῶ
  choice: నేను … ఉంచేవరకు
  rationale: భవిష్య పరిమితిని సూచించే గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగు కాలవాచక నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: నీ పాదాల కింద
  rationale: మార్కు పాఠంలోని ‘పాదపీఠం’ కాని సంక్షిప్త రూపాన్ని యథాతథంగా కాపాడుతుంది.
theological_decisions:
- issue: దావీదు పలికిన మాటలో పరిశుద్ధాత్మ పాత్ర
  choice: పరిశుద్ధాత్మలో
  alternative: పరిశుద్ధాత్మ ద్వారా
  rationale: గ్రీకు ἐν నిర్మాణాన్ని నిలుపుతూ, పరిశుద్ధాత్మ ప్రేరణ యొక్క ఖచ్చితమైన విధానాన్ని అనువాదంలోనే నిర్ణయించదు.
- issue: కీర్తన 110:1లోని ప్రభువు పదాల క్రీస్తుసంబంధ బలం
  choice: ప్రభువు నా ప్రభువుతో
  alternative: యెహోవా నా ప్రభువుతో
  rationale: మార్కు గ్రీకు పాఠంలో రెండు చోట్లా κύριος ఉన్నందున ప్రధాన పాఠంలో ఒకే తెలుగు పదాన్ని ఉంచాం; హీబ్రూ మూలంలో మొదటి పదం దైవనామాన్ని సూచిస్తుందనే విషయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఉల్లేఖనంలోని ప్రభువు/ప్రభువు పునరుక్తిని, అలాగే ‘పరిశుద్ధాత్మలో’ అనే గ్రీకు నిర్మాణంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలుపుకున్నాం.
