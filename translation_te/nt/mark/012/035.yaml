id: MRK.12.35
reference: Mark 12:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς ἔλεγεν διδάσκων ἐν τῷ ἱερῷ· Πῶς λέγουσιν οἱ γραμματεῖς ὅτι ὁ χριστὸς υἱὸς ⸂Δαυίδ ἐστιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/035.yaml
  text: And Jesus answered and said[a], as he was teaching in the temple, “How do the scribes say that the Messiah is the son of David?”
translation:
  language: te
  text: 'యేసు దేవాలయంలో బోధిస్తూ ఇలా స్పందించాడు: “మెస్సీయ[a] దావీదు కుమారుడని శాస్త్రులు ఎలా అంటున్నారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు.” గ్రీకు బిరుదు క్రిస్టోస్ ఇక్కడ మెస్సీయ అనే అర్థంలో వాడబడింది.
    reason: ప్రత్యామ్నాయ అనువాదాన్ని మరియు గ్రీకు బిరుదు యొక్క సందర్భార్థాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: ἀποκριθεὶς … ἔλεγεν
  choice: స్పందనగా ఇలా అన్నాడు
  rationale: ἀποκριθεὶς సాధారణంగా ‘జవాబిస్తూ’ అని అర్థమిచ్చినా, ఇక్కడ ముందుగా స్పష్టమైన ప్రశ్న లేదు. అందువల్ల యేసు ముందున్న చర్చ లేదా పరిస్థితికి స్పందిస్తున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపింది; ἔλεγεν‌ను ‘అన్నాడు’గా వ్యక్తం చేసింది.
- source_word: διδάσκων
  choice: బోధిస్తూ
  rationale: యేసు మాటలాడిన సమయంలోనే బోధిస్తున్నాడనే సమకాలిక భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐν τῷ ἱερῷ
  choice: దేవాలయంలో
  rationale: ἱερόν ఇక్కడ అంతర్గర్భాలయాన్ని మాత్రమే కాక దేవాలయ ప్రాంగణ సముదాయాన్ని సూచించగలదు. ‘దేవాలయంలో’ సాధారణ పాఠకులకు సహజంగా ఉండి ఆ విస్తృత భావాన్ని నిరోధించదు.
- source_word: Πῶς λέγουσιν
  choice: ఎలా అంటున్నారు?
  rationale: Πῶς అనే ప్రశ్నార్థక పదాన్ని నేరుగా నిలిపి, శాస్త్రుల వాదనను యేసు ప్రశ్నిస్తున్న అలంకారిక బలాన్ని పాఠకుడు సందర్భం ద్వారా గ్రహించేలా చేసింది; ‘ఎలా అనగలుగుతున్నారు?’ అని చేర్చి ప్రశ్నను మరింత తీవ్రంగా వ్యాఖ్యానించలేదు.
- source_word: οἱ γραμματεῖς
  choice: శాస్త్రులు
  rationale: సువార్తల చారిత్రక సందర్భంలో ధర్మశాస్త్రాన్ని అధ్యయనం చేసి బోధించే వర్గానికి తెలుగులో స్థిరపడిన సంక్షిప్త పదం.
- source_word: ὁ χριστός
  choice: మెస్సీయ
  rationale: ఈ సందర్భంలో Χριστός వ్యక్తినామంలా కాక యూదుల నిరీక్షణకు సంబంధించిన బిరుదుగా వాడబడింది; అందువల్ల ‘మెస్సీయ’ ప్రధాన పాఠ్యంలో ఉంచబడింది.
- source_word: υἱὸς Δαυίδ
  choice: దావీదు కుమారుడు
  rationale: ఇది కేవలం వంశస్థుడనే సాధారణ సమాచారం కాక, గుర్తింపబడిన మెస్సీయ బిరుదును సూచించే సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ పదం యూదుల మెస్సీయ నిరీక్షణ నేపథ్యంలో స్పష్టంగా బిరుదుగా ఉంది. అందువల్ల ప్రధాన పాఠ్యంలో ‘మెస్సీయ’ను వాడి, సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదటిప్పణిలో నిలిపాం.
- issue: మెస్సీయను ‘దావీదు కుమారుడు’ అనడంపై ప్రశ్న యొక్క బలం
  choice: శాస్త్రులు ఎలా అంటున్నారు?
  alternative: శాస్త్రులు ఎలా అనగలుగుతున్నారు?
  rationale: మూలంలోని Πῶς ప్రశ్న వాదనను సవాలు చేస్తుంది; అయితే అది అసాధ్యతను స్పష్టంగా చెప్పదు. కాబట్టి మూలంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను పరిష్కరించకుండా సన్నిహితమైన ప్రశ్నారూపమే ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘స్పందనగా’ అనే రూపం ముందుగా స్పష్టమైన ప్రశ్న లేకపోయినా ἀποκριθεὶς యొక్క ప్రతిస్పందన భావాన్ని నిలుపుతుంది. ప్రశ్నను అతిగా వివరణాత్మకం చేయకుండా మూలంలోని సంక్షిప్తత, వేదాంత ఉద్రిక్తత కాపాడబడ్డాయి.
