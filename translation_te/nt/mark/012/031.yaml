source:
  edition: SBLGNT
  text: ⸀δευτέρα αὕτη· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν. μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/031.yaml
  text: 'The second is this: ‘You shall love your neighbor as yourself.’ There is no other commandment greater than these[a].'
translation:
  language: te
  text: 'రెండవది ఇది: “నిన్ను నీవు ప్రేమించుకున్నట్లే నీ పొరుగువానిని ప్రేమించాలి.” వీటికంటే గొప్ప ఆజ్ఞ మరొకటి లేదు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “వీటికంటే గొప్ప మరొక ఆజ్ఞ లేదు.” సందర్భంలో “వీటి” అనేది ఈ రెండు ఆజ్ఞలను కలిపి సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δευτέρα αὕτη
  choice: రెండవది ఇది
  rationale: గ్రీకులోని సంక్షిప్త నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతూ, సందర్భంలోని మొదటి ఆజ్ఞతో స్పష్టంగా అనుసంధానిస్తుంది.
- source_word: Ἀγαπήσεις
  choice: ప్రేమించాలి
  rationale: లేఖన ఉద్ధరణలో ఆజ్ఞార్థకంగా పనిచేసే భవిష్యత్ సూచక రూపాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజమైన విధి/ఆజ్ఞ రూపంతో వ్యక్తం చేస్తుంది.
- source_word: τὸν πλησίον σου
  choice: నీ పొరుగువానిని
  rationale: లేవీయకాండము 19:18తో ఉన్న అంతర్‌పాఠ్య సంబంధాన్ని కాపాడే, బైబిలు సందర్భంలో స్థిరపడిన సహజ తెలుగు పదబంధం.
- source_word: ὡς σεαυτόν
  choice: నిన్ను నీవు ప్రేమించుకున్నట్లే
  rationale: తెలుగులో పోలికను స్పష్టంగా, సహజంగా చేయడానికి సందర్భంలో అంతర్లీనంగా ఉన్న ‘ప్రేమించు’ భావాన్ని పునరుక్తం చేస్తుంది; భావానికి కొత్త అంశం జోడించదు.
- source_word: μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν
  choice: వీటికంటే గొప్ప ఆజ్ఞ మరొకటి లేదు
  rationale: μείζων యొక్క తులనాత్మక భావాన్నీ, τούτων అనే బహువచన సూచననూ నేరుగా నిలుపుతుంది.
- source_word: ἐντολή
  choice: ఆజ్ఞ
  rationale: తోరా ఆజ్ఞల సందర్భానికి తగిన, గౌరవప్రదమైన మరియు సాధారణ ఆధునిక తెలుగు పదం.
theological_decisions:
- issue: చివరి వాక్యంలోని τούτων (‘వీటి’) దేనిని సూచిస్తుంది?
  choice: సందర్భంలోని రెండు ఆజ్ఞలను కలిపి సూచించే బహువచనం
  alternative: వెంటనే ముందు చెప్పిన రెండవ ఆజ్ఞను సాధారణీకరించి సూచించడం
  rationale: గ్రీకు బహువచన సూచన సహజంగా సందర్భంలో చర్చించిన రెండు ఆజ్ఞలవైపు చూపుతుంది. ‘వీటికంటే’ అని అనువదించడం ఈ బహువచనాన్ని పరిష్కరించకుండా యథాతథంగా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే లేఖన ఉద్ధరణకు తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. ‘పొరుగువాడు,’ ‘ఆజ్ఞ’ వంటి స్థిరమైన బైబిలు పదజాలం నిలుపబడింది.
