id: MRK.12.15
reference: Mark 12:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἰδὼς αὐτῶν τὴν ὑπόκρισιν εἶπεν αὐτοῖς· Τί με πειράζετε; φέρετέ μοι δηνάριον ἵνα ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/015.yaml
  text: But knowing their hypocrisy[a], he said to them[b], “Why are you testing me? Bring me a denarius so that I may see it.”
translation:
  language: te
  text: అయితే ఆయన వారి కపటాన్ని గ్రహించి వారితో, “మీరు నన్నెందుకు పరీక్షిస్తున్నారు?[a] నేను చూడడానికి ఒక దేనారం[b] తీసుకురండి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీరు నన్నెందుకు శోధిస్తున్నారు?”
    reason: lexical_alternative
  - marker: b
    text: దేనారం రోమా వెండి నాణెం; అది సాధారణంగా ఒక రోజు కూలికి సమానంగా ఉండేది.
    reason: cultural_note
lexical_decisions:
- source_word: εἰδὼς
  choice: గ్రహించి
  rationale: యేసు వారి అంతరంగ ఉద్దేశాన్ని తెలుసుకున్నాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సందర్భంలో కేవలం సమాచారం తెలిసి ఉండడం కంటే వారి కపటాన్ని గుర్తించడం ప్రధానంగా ఉంది.
- source_word: ὑπόκρισιν
  choice: కపటాన్ని
  rationale: నిజాయితీగా కనిపించే మాటల వెనుక దాగిన మోసపూరిత ఉద్దేశాన్ని బలంగా, సాధారణ పాఠకులకు స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: Τί
  choice: ఎందుకు
  rationale: πειράζετεతో కలిసిన ఈ ప్రశ్నార్థక ప్రయోగంలో కారణాన్ని అడుగుతుంది; తెలుగులో ‘ఎందుకు’ సహజ సమానం.
- source_word: πειράζετε
  choice: పరీక్షిస్తున్నారు
  rationale: వారు యేసును చిక్కులో పెట్టాలనే ఉద్దేశంతో పరీక్షిస్తున్న శత్రుత్వపూరిత చర్యను తెలియజేస్తుంది; ‘శోధిస్తున్నారు’ అనే ప్రత్యామ్నాయం పాపానికి ప్రలోభపెట్టడం అనే అర్థాన్ని అనవసరంగా ముందుకు తేవచ్చు.
- source_word: φέρετέ
  choice: తీసుకురండి
  rationale: ఒక వస్తువును తన దగ్గరకు తీసుకురమ్మనే ఆజ్ఞను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δηνάριον
  choice: ఒక దేనారం
  rationale: చారిత్రక నాణెం పేరును సాధారణీకరించకుండా నిలుపుతుంది; దాని స్వరూపాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: ἵνα ἴδω
  choice: నేను దాన్ని చూస్తాను
  rationale: గ్రీకు ఉద్దేశార్థక ఉపవాక్య భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ‘దాన్ని’ అనేది దేనారాన్ని సూచించే అంతర్లీన కర్మ.
theological_decisions:
- issue: πειράζετεలో యేసు చేసిన ఆరోపణ స్వభావం
  choice: శత్రుత్వపూరితంగా పరీక్షించడం
  alternative: నన్ను శోధించడం / ప్రలోభపెట్టడం
  rationale: సందర్భంలో వారు యేసును మాటలో చిక్కించేందుకు ప్రయత్నిస్తున్నారు. ‘పరీక్షిస్తున్నారు’ ఆ విరోధపూరిత ఉద్దేశాన్ని నిలుపుతూ, పాపానికి ప్రలోభపెట్టడం అనే మరింత సంకుచిత భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. మూలపాఠంలోని ప్రతికూల భావాన్ని ‘అయితే’తో, కపట ఆరోపణను ‘కపటం’తో నిలిపాం. ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదసూచిక గుర్తులు వాటి విషయాలకు సరిపోని చోట్ల ఉన్నందున, తెలుగులో సంబంధిత పదాల దగ్గర సరైన గుర్తులు ఉంచబడ్డాయి.
