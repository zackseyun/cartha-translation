revisions:
- from: ఇంకా అతనికి ఒకడు[b] ఉన్నాడు—ప్రియమైన కుమారుడు[a]. అతన్ని చివరిగా వారి దగ్గరికి పంపిస్తూ, ‘వారు నా కుమారుణ్ణి గౌరవిస్తారు[c]’ అని అన్నాడు.
  to: ఇంకా అతనికి ఒకడు మిగిలి ఉన్నాడు—ప్రియమైన కుమారుడు. అతడు, ‘వారు నా కుమారుణ్ణి గౌరవిస్తారు’ అని చెబుతూ, అతన్ని చివరిగా వారి దగ్గరికి పంపాడు.
  rationale: The revision restores the Greek clause structure by making “పంపాడు” the main verb and rendering λέγων with “చెబుతూ.” It also expresses the remaining-one nuance of ἔτι ἕνα εἶχεν more idiomatically. Footnote content is retained; markers should be attached in the published text as “కుమారుడు[a]”, “ఒకడు[b]”, and “గౌరవిస్తారు[c]”.
