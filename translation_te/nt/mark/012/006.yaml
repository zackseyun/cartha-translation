source:
  edition: SBLGNT
  text: ἔτι ⸂ἕνα εἶχεν, υἱὸν ἀγαπητόν· ἀπέστειλεν⸃ αὐτὸν ⸂ἔσχατον πρὸς αὐτοὺς⸃ λέγων ὅτι Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/006.yaml
  text: He still had one[a], a beloved son. He sent him last to them, saying[c][b], ‘They will respect my son.’
translation:
  language: te
  text: ఇంకా అతనికి ఒకడు మిగిలి ఉన్నాడు—ప్రియమైన కుమారుడు. అతడు, ‘వారు నా కుమారుణ్ణి గౌరవిస్తారు’ అని చెబుతూ, అతన్ని చివరిగా వారి దగ్గరికి పంపాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔτι ἕνα εἶχεν
  choice: ఇంకా అతనికి ఒకడు ఉన్నాడు
  rationale: మునుపు పంపిన సేవకుల తర్వాత పంపడానికి అతని దగ్గర ఇంకా ఒక వ్యక్తి మిగిలి ఉన్నాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘ఒకడు’ అనే పదం కుమారుని పరిచయానికి దారి తీస్తుంది.
- source_word: υἱὸν ἀγαπητόν
  choice: ప్రియమైన కుమారుడు
  rationale: ἀγαπητός లోని ప్రేమకు పాత్రుడైన, ఎంతో ప్రీతిపాత్రుడైన కుమారుడు అనే భావాన్ని నిలుపుతుంది; మార్కు సువార్తలోని ‘ప్రియ కుమారుడు’ అనే క్రీస్తు సంబంధిత ప్రతిధ్వనిని వివరణగా విస్తరించకుండా కాపాడుతుంది.
- source_word: ἀπέστειλεν
  choice: పంపిస్తూ
  rationale: ప్రధాన క్రియను సరళంగా తెలియజేస్తూ, λέγων తో ఉన్న సమకాలిక సంబంధాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో చూపుతుంది.
- source_word: ἔσχατον πρὸς αὐτούς
  choice: చివరిగా వారి దగ్గరికి
  rationale: కుమారుడు పంపబడిన క్రమంలో చివరి వ్యక్తి అనే శిఖరస్థానాన్ని ‘చివరిగా’ నిలుపుతుంది; πρὸς αὐτούς ను పంపే సందర్భానికి సహజంగా ‘వారి దగ్గరికి’ అని అనువదిస్తుంది.
- source_word: λέγων ὅτι
  choice: ‘…’ అని అన్నాడు
  rationale: యజమాని నిరీక్షణను ప్రత్యక్ష ఉక్తిగా సహజమైన తెలుగులో అందిస్తుంది.
- source_word: Ἐντραπήσονται
  choice: గౌరవిస్తారు
  rationale: ఈ సందర్భంలో ἐντρέπω భయభక్తి లేదా మర్యాద చూపడం అనే భావాన్ని ఇస్తుంది; ‘గౌరవిస్తారు’ స్పష్టమైన ఆధునిక తెలుగు, అయితే సిగ్గుపడడం అనే మూలార్థ ఛాయను పాదసూచికలో నిలిపింది.
- source_word: τὸν υἱόν μου
  choice: నా కుమారుణ్ణి
  rationale: స్వామ్యసూచక పదబంధాన్ని నేరుగా అనువదించి, ఉపమానంలోని క్రీస్తు సంబంధిత బలాన్ని వివరణ జోడించకుండా నిలుపుతుంది.
theological_decisions:
- issue: ఉపమానంలో ‘ప్రియమైన కుమారుడు’ అనే మాటకు ఉన్న క్రీస్తు సంబంధిత ప్రతిధ్వని
  choice: ప్రధాన పాఠంలో ‘ప్రియమైన కుమారుడు’ అని ఉంచి, దాని అర్థాన్ని విస్తరించలేదు.
  alternative: ఎంతో ప్రేమించిన కుమారుడు
  rationale: ఈ పదబంధం మార్కు సువార్తలో యేసు ప్రియ కుమారుడిగా వెల్లడయ్యే సందర్భాలను సహజంగా ప్రతిధ్వనిస్తుంది. అనువాదం ఆ ప్రతిధ్వనిని నిలపాలి గాని, వ్యాఖ్యానాన్ని పాఠంలోకి చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ప్రియమైన కుమారుడు,’ ‘చివరిగా,’ ‘గౌరవిస్తారు’ వంటి పదాలు మూలపాఠపు బరువును నిలుపుతూ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యేలా ఉన్నాయి.
