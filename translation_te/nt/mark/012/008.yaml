source:
  edition: SBLGNT
  text: καὶ λαβόντες ⸂ἀπέκτειναν αὐτόν, καὶ ἐξέβαλον αὐτὸν⸃ ἔξω τοῦ ἀμπελῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/008.yaml
  text: And they took him[a], killed him, and threw him out of the vineyard.
translation:
  language: te
  text: వారు అతన్ని పట్టుకొని[a], చంపి, ద్రాక్షతోట బయటికి విసిరేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సమాంతర ఉపమాన వృత్తాంతం కారణంగా కొందరు ఇక్కడ ‘అతన్ని ద్రాక్షతోట బయటికి విసిరి చంపారు’ అనే క్రమాన్ని ఆశించవచ్చు. అయితే మార్కు గ్రంథంలోని గ్రీకు పాఠం ‘అతన్ని చంపి, ద్రాక్షతోట బయటికి విసిరేశారు’ అని చెబుతోంది.
    reason: cross_reference
lexical_decisions:
- source_word: λαβόντες
  choice: పట్టుకొని
  rationale: ముందుగా జరిగిన చర్యను తెలిపే aorist participle. సందర్భంలో బలవంతంగా అదుపులోకి తీసుకోవడం సూచితమైనప్పటికీ, మూలపదంలో లేని అధిక హింసాత్మక భావాన్ని చేర్చకుండా ‘పట్టుకొని’ సహజంగా వరుస చర్యను తెలియజేస్తుంది.
- source_word: ἀπέκτειναν
  choice: చంపి
  rationale: ἀποκτείνω యొక్క సూటి అర్థం ‘చంపడం’. ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: ἐξέβαλον
  choice: విసిరేశారు
  rationale: ἐκβάλλω ఇక్కడ బలంగా బయటికి పారవేయడాన్ని సూచిస్తుంది. ‘విసిరేశారు’ ఆ తీవ్రతను ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: ద్రాక్షతోట బయటికి
  rationale: చలనాన్ని సూచించే ἐξέβαλονతో కలిసి, తోట లోపలి నుంచి బయటికి విసరడాన్ని ‘బయటికి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀμπελῶνος
  choice: ద్రాక్షతోట
  rationale: ἀμπελώνకు సందర్భానుకూలమైన ప్రామాణిక తెలుగు పదం.
theological_decisions:
- issue: ఉపమానంలో చంపడం, బయటికి విసరడం అనే చర్యల క్రమం
  choice: గ్రీకు పాఠంలోని క్రమం ప్రకారం ముందుగా చంపి, తరువాత ద్రాక్షతోట బయటికి విసిరేశారు.
  alternative: సమాంతర ఉపమాన సంప్రదాయాన్ని అనుసరించి ముందుగా బయటికి విసిరి, తరువాత చంపారు అని ఇవ్వడం.
  rationale: SBLGNTలో మార్కు 12:8 చర్యలను పట్టుకోవడం, చంపడం, బయటికి విసరడం అనే క్రమంలో ఉంచుతుంది. సమాంతర వాక్యాలతో సమన్వయపరచకుండా మూలపాఠ క్రమాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. వేగవంతమైన చర్యల వరుసను సహజమైన అసమాపక క్రియలతో నిలిపాం.
