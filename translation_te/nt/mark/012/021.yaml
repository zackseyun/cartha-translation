id: MRK.12.21
reference: Mark 12:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὁ δεύτερος ἔλαβεν αὐτήν, καὶ ἀπέθανεν ⸂μὴ καταλιπὼν⸃ σπέρμα, καὶ ὁ τρίτος ὡσαύτως·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/021.yaml
  text: And the second took her[a], and died, leaving no offspring, and the third likewise.
translation:
  language: te
  text: రెండవవాడు ఆమెను పెళ్లి చేసుకొని[a], సంతానం లేకుండానే చనిపోయాడు. మూడవవాడూ అలాగే చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, ‘ఆమెను తీసుకున్నాడు’; ఇక్కడ భావం, ఆమెను భార్యగా స్వీకరించాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: రెండవవాడు
  rationale: ఆర్టికల్‌తో నామవాచకంగా వాడిన క్రమసంఖ్య. సందర్భంలో సోదరుడు ఉద్దేశించబడినా, ఈ వాక్యభాగంలో అది స్పష్టంగా లేకపోవడంతో ‘రెండవవాడు’ అని అనువదించాం.
- source_word: ἔλαβεν αὐτήν
  choice: ఆమెను పెళ్లి చేసుకొని
  rationale: λαμβάνω ప్రాథమికంగా ‘తీసుకొను/స్వీకరించు’ అని అర్థమైనా, ఇక్కడ విధవరాలిని భార్యగా స్వీకరించే సందర్భం. తెలుగులో ‘ఆమెను తీసుకున్నాడు’ అస్పష్టంగా ఉండవచ్చు కాబట్టి సందర్భార్థాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: ἀπέθανεν
  choice: చనిపోయాడు
  rationale: సరళ కథన శైలికి తగిన నేరుగా చెప్పే ఆధునిక తెలుగు రూపం.
- source_word: μὴ καταλιπὼν σπέρμα
  choice: సంతానం లేకుండానే
  rationale: సంతానాన్ని విడిచిపెట్టకుండానే మరణించాడనే భావాన్ని సహజమైన తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: σπέρμα
  choice: సంతానం
  rationale: ఈ వివాహ సందర్భంలో పదం విత్తనాన్ని కాదు, పుట్టిన సంతతిని సూచిస్తుంది. ‘సంతానం’ ఏకవచనానికి అనవసరంగా పరిమితం చేయదు.
- source_word: ὁ τρίτος ὡσαύτως
  choice: మూడవవాడూ అలాగే చేశాడు
  rationale: గ్రీకులో ముందటి చర్యలు అధ్యాహారంగా ఉన్నాయి. తెలుగు పాఠకుడికి సహజంగా ఉండేందుకు ‘చేశాడు’ను చేర్చి సంక్షిప్తతను నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు ఉంచుతూ, వివాహార్థాన్ని అస్పష్టత లేకుండా వ్యక్తం చేశాం.
