  text: οἱ δὲ ἤνεγκαν. καὶ λέγει αὐτοῖς· Τίνος ἡ εἰκὼν αὕτη καὶ ἡ ἐπιγραφή; οἱ δὲ εἶπαν αὐτῷ· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/016.yaml
  text: And they brought one. And he says to them[a], “Whose image is this, and whose inscription?” And they said to him, “Caesar’s.”
translation:
  language: te
  text: 'వారు తీసుకొచ్చారు[a]. ఆయన వారితో ఇలా అన్నాడు: “ఈ ప్రతిరూపం ఎవరిది? ఈ లేఖనం ఎవరిది?” వారు ఆయనకు, “కైసరుది,” అన్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు దానిని తీసుకొచ్చారు.” ఇక్కడ కర్మ చెప్పబడలేదు; ముందరి సందర్భాన్ని బట్టి అది నాణెం, అంటే ఒక దేనారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκαν
  choice: తీసుకొచ్చారు
  rationale: గ్రీకులో కర్మ ప్రత్యక్షంగా లేదు; మునుపటి వచనంలోని దేనారాన్ని సూచనగా గ్రహించాలి. తెలుగులో కర్మను చెప్పకుండానే వాక్యం సహజంగా ఉంటుంది కాబట్టి మూలంలోని అంతర్నిహితత్వాన్ని నిలిపాం.
- source_word: λέγει
  choice: అడిగాడు
  rationale: ఇది రూపంలో చారిత్రక వర్తమాన కాలమైనా, తరువాత నేరుగా ప్రశ్న వస్తుంది. ఆధునిక తెలుగు కథనంలో సహజత్వం కోసం భూతకాలంలోని ‘అడిగాడు’ వాడాం.
- source_word: Τίνος
  choice: ఎవరిది
  rationale: స్వామ్యాన్ని లేదా సంబంధాన్ని అడిగే షష్ఠీ విభక్తి ప్రశ్నను సహజమైన తెలుగులో ‘ఎవరిది?’ అని ఇచ్చాం; రెండు నామవాచకాలకూ ప్రశ్నను పునరుక్తి చేయడం స్పష్టంగా ఉంటుంది.
- source_word: εἰκών
  choice: రూపం
  rationale: నాణెంపై ముద్రించిన వ్యక్తి ప్రతిరూపాన్ని సూచించే, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన పదం.
- source_word: ἐπιγραφή
  choice: రాత
  rationale: నాణెంపై ఉన్న వ్రాతను ఆధునిక సాధారణ తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ‘శాసనం’ ఇక్కడ ఆజ్ఞ లేదా అధికారిక ప్రకటన అనే అదనపు భావాన్ని కలిగించవచ్చు.
- source_word: Καίσαρος
  choice: కైసరువి
  rationale: రూపం, రాత అనే రెండు అంశాలూ కైసరుకు చెందినవని తెలిపే సంక్షిప్త, సహజ సమాధానం.
