translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సహజంగా ఉండే కథనశైలిని అనుసరించాం. మార్కు ఉపయోగించిన చారిత్రక వర్తమాన కాలాన్ని తెలుగులో అసహజంగా అనిపించకుండా సాధారణ భూతకాలంగా ఇచ్చాం; మూలంలో చెప్పకుండా వదిలిన కర్మను ప్రధాన పాఠ్యంలో అలాగే ఉంచి, పాదసూచికలో వివరించాం.
