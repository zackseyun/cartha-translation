id: MRK.12.24
reference: Mark 12:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ἔφη αὐτοῖς ὁ Ἰησοῦς⸃· Οὐ διὰ τοῦτο πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/024.yaml
  text: 'Jesus said to them[a], “Is this not why you are mistaken: because you know neither the Scriptures nor the power of God?”'
translation:
  language: te
  text: 'యేసు వారితో ఇలా అన్నాడు[a]: “మీరు లేఖనాలనుగానీ దేవుని శక్తినిగానీ తెలియకపోవడం వల్లనే తప్పుదారి పడుతున్నారు కదా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “యేసు వారితో ఇలా అన్నాడు: ‘మీరు లేఖనాలనుగానీ దేవుని శక్తినిగానీ ఎరుగరు కాబట్టే దారి తప్పుతున్నారు కదా?’”'
    reason: πλανᾶσθεకు ‘తప్పుదారి పడడం/దారి తప్పడం’ అనే సమీప ప్రత్యామ్నాయ వ్యక్తీకరణను చూపిస్తుంది; కారణ నిర్మాణంలో స్వల్ప భేదాన్ని కూడా ప్రతిబింబిస్తుంది.
lexical_decisions:
- source_word: ἔφη αὐτοῖς ὁ Ἰησοῦς
  choice: యేసు వారితో ఇలా అన్నాడు
  rationale: φημί ప్రత్యక్ష సంభాషణను పరిచయం చేసే సాధారణ ‘అను’ అనే అర్థంలో ఉంది. ‘ఇలా అన్నాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, మూలంలో లేని ‘జవాబిచ్చాడు’ వంటి భావాన్ని చేర్చదు.
- source_word: Οὐ διὰ τοῦτο
  choice: ఇది ... వల్లనే ... కదా?
  rationale: οὐ తో కూడిన ప్రశ్న సమ్మతిని ఆశించే అలంకారప్రశ్న; διὰ τοῦτο కారణాన్ని సూచిస్తుంది. తెలుగులో ‘వల్లనే ... కదా?’ ఈ రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πλανᾶσθε
  choice: తప్పుదారి పడుతున్నారు
  rationale: ఈ మధ్యమ/కర్మణి రూపం ‘పొరబడుతున్నారు’ లేదా ‘తప్పుదారి పడుతున్నారు’ అనే అర్థాలను అనుమతిస్తుంది. ఎంపిక చేసిన పదబంధం భ్రమలో ఉండడం, దారి తప్పడం అనే మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది; తప్పనిసరిగా బయటి వ్యక్తి మోసం చేశాడని చెప్పదు.
- source_word: μὴ εἰδότες
  choice: ఎరుగకపోవడం వల్లనే
  rationale: ఈ వర్తమాన కృదంతం వారి తప్పుకు కారణాన్ని తెలియజేస్తుంది. తెలుగులో కారణార్థక నిర్మాణం సహజంగా ఉంటుంది.
- source_word: τὰς γραφὰς
  choice: లేఖనాలు
  rationale: యూదుల పవిత్ర రచనలను సూచించే స్థిరమైన బైబిలు పదం; ‘రాతలు’ కంటే సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: దేవుని శక్తినిగాని
  rationale: μηδέ ముందు ఉన్న నిరాకరణతో కలిసి ‘...నుగాని ...నిగాని’ అనే సమన్విత నిరాకరణగా వస్తుంది; δύναμις‌కు ‘శక్తి’ నేరమైన, సహజమైన సమానం.
theological_decisions:
- issue: πλανᾶσθε సూచించే తప్పు స్వభావం
  choice: తప్పుదారి పడుతున్నారు
  alternative: పొరబడుతున్నారు; మోసపోతున్నారు
  rationale: గ్రీకు పదం సాధారణ పొరపాటు నుండి దారి తప్పడం లేదా మోసపోవడం వరకు అర్థవిస్తృతిని కలిగి ఉంది. సందర్భంలో పునరుత్థానం, లేఖనాలు, దేవుని శక్తి గురించిన వారి అవగాహన తప్పు ప్రధానమైనది. ‘తప్పుదారి పడుతున్నారు’ గద్దింపును నిలుపుతూ, అది కేవలం మేధోపరమైన పొరపాటో లేదా బయటి మోసమో అని ఖచ్చితంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘లేఖనాలు,’ ‘దేవుని శక్తి’ వంటి స్థిరమైన బైబిలు పదజాలం ఉంచబడింది. అలంకారప్రశ్నను ‘కదా?’తో స్పష్టంగా వ్యక్తం చేశాం.
