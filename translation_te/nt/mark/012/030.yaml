id: MRK.12.30
reference: Mark 12:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ἐξ ὅλης τῆς ψυχῆς σου καὶ ἐξ ὅλης τῆς διανοίας σου καὶ ἐξ ὅλης τῆς ἰσχύος ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/030.yaml
  text: And you shall love the Lord your God with all your heart and with all your soul and with all your mind and with all your strength[a][b][c].
translation:
  language: te
  text: నీ హృదయమంతటితో, నీ ప్రాణమంతటితో[a], నీ మనస్సంతటితో[b], నీ బలమంతటితో[c] నీ దేవుడైన ప్రభువును ప్రేమించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ జీవితమంతటితో’; ψυχή అనే పదానికి ‘ప్రాణం’ లేదా ‘జీవితం’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీ అవగాహన అంతటితో’; διάνοια ఆలోచించే లేదా అవగాహన చేసే సామర్థ్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘నీ శక్తి అంతటితో’; ἰσχύςకు ‘బలం’ లేదా ‘శక్తి’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπήσεις
  choice: ప్రేమించాలి
  rationale: భవిష్యత్ సూచనారూపం ఆజ్ఞార్థక బలంతో వాడబడింది. ఆధునిక తెలుగులో ‘ప్రేమించాలి’ ఆ ఆజ్ఞను సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: κύριον τὸν θεόν σου
  choice: నీ దేవుడైన ప్రభువును
  rationale: ఒడంబడిక సంబంధాన్ని సూచించే ‘ప్రభువైన నీ దేవుడు’ అనే భావాన్ని సహజమైన తెలుగు కర్మరూపంలో వ్యక్తం చేస్తుంది; κύριος, θεός రెండింటినీ విడిచిపెట్టకుండా నిలుపుతుంది.
- source_word: ἐξ ὅλης
  choice: నీ పూర్ణ ...తో
  rationale: ἐξ యొక్క పదశః ‘నుండి’ కంటే, వ్యక్తి తన సమస్త అంతరంగ సామర్థ్యాలతో ప్రేమించడాన్ని తెలుగులో ‘తో’ సహజంగా వ్యక్తం చేస్తుంది. పునరావృతమైన ὅλης యొక్క సంపూర్ణతను ‘పూర్ణ’ నిలుపుతుంది.
- source_word: καρδίας
  choice: హృదయం
  rationale: సంకల్పం, అనురాగం సహా అంతరంగ కేంద్రాన్ని సూచించే స్థిరమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: ψυχῆς
  choice: ప్రాణం
  rationale: ψυχήకి ప్రాణం, జీవితం, వ్యక్తిత్వం వంటి అర్థవిస్తృతి ఉంది. ‘ప్రాణం’ జాబితాలోని ఇతర అంశాలనుంచి భేదాన్ని నిలుపుతూ ఆధునిక తెలుగు పాఠకులకు సహజంగా ఉంటుంది.
- source_word: διανοίας
  choice: మనస్సు
  rationale: ఆలోచన, అవగాహన చేసే సామర్థ్యాన్ని సహజంగా సూచిస్తుంది; ‘హృదయం’తో ఉన్న పదభేదాన్ని నిలుపుతుంది.
- source_word: ἰσχύος
  choice: బలం
  rationale: శక్తి లేదా సామర్థ్యాన్ని తెలిపే స్పష్టమైన సాధారణ తెలుగు పదం.
- source_word: καὶ ... καὶ ... καὶ
  choice: ప్రతి పదబంధాన్ని కామాలతో వరుసగా ఉంచడం
  rationale: తెలుగు జాబితా నిర్మాణంలో ప్రతి చోట ‘మరియు’ పునరావృతం కృత్రిమంగా వినిపిస్తుంది. సమాంతరమైన ‘నీ పూర్ణ ...తో’ పునరావృతం గ్రీకు వాక్యంలోని కూడికను, ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: κύριος పదానికి అనువాదం
  choice: ప్రభువు
  alternative: యెహోవా / యజమాని
  rationale: గ్రీకు పాఠంలో κύριος ఉంది. ‘ప్రభువు’ కొత్త నిబంధన వాడుకను, ఇశ్రాయేలు దేవునికి సంబంధించిన ఉల్లేఖన ప్రతిధ్వనిని నిలుపుతుంది; గ్రీకులో ప్రత్యక్షంగా లేని దైవనామ రూపాన్ని చేర్చదు.
- issue: నాలుగు మానవ సామర్థ్యాల ప్రత్యేకత
  choice: హృదయం / ప్రాణం / మనస్సు / బలం
  alternative: వీటన్నిటినీ ‘నీ సంపూర్ణ వ్యక్తిత్వంతో’ అని ఏకీకరించడం
  rationale: మార్కు వాక్యంలోని నాలుగు ప్రత్యేక పదాలను నిలుపుతూ, సంపూర్ణ భక్తి గురించిన బహుముఖ వర్ణనలోని వేదాంతపరమైన ఉద్వేగాన్ని సరళీకరించకుండా కాపాడుతుంది.
- issue: ἀγαπήσεις యొక్క ఆజ్ఞార్థక బలం
  choice: ప్రేమించాలి
  alternative: ప్రేమిస్తావు / ప్రేమించు
  rationale: ఉల్లేఖనంలోని భవిష్యత్ సూచనారూపానికి ఆజ్ఞార్థక శక్తి ఉంది. ‘ప్రేమించాలి’ ఆధునిక తెలుగులో దానిని స్పష్టంగా తెలియజేస్తుంది; కేవలం భవిష్యద్వాక్యంగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘నీ పూర్ణ ...తో’ అనే సమాంతర నిర్మాణం మూలంలోని సంపూర్ణతా ఉద్ఘాటనను నిలుపుతుంది. ‘ప్రభువు’ బైబిలు సందర్భానికి తగినదైనా అతిగా ప్రాచీనంగా లేదు.
