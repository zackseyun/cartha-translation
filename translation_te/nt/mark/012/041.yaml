- from: యేసు దేవాలయ కానుకల పెట్టెలకు[a] ఎదురుగా కూర్చుని, జనసమూహం వాటిలో డబ్బు ఎలా వేస్తున్నారో గమనిస్తూ ఉన్నాడు. ధనవంతులు చాలామంది పెద్ద మొత్తాల్లో వేస్తున్నారు.
