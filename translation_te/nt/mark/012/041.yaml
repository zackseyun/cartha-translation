translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘యేసు’ అనే కర్తను తెలుగు కథన స్పష్టత కోసం సందర్భానుగుణంగా వ్యక్తం చేసింది. గ్రీకు ఏకవచన సమాహారపదాన్ని ఆలయంలోని కానుకల పాత్రల సందర్భానికి అనుగుణంగా బహువచనంగా ఇచ్చి, దాని అస్పష్టతను పాదసూచికలో కాపాడింది.
