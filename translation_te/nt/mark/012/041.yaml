id: MRK.12.41
reference: Mark 12:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ⸀καθίσας ⸀κατέναντι τοῦ γαζοφυλακίου ἐθεώρει πῶς ὁ ὄχλος βάλλει χαλκὸν εἰς τὸ γαζοφυλάκιον· καὶ πολλοὶ πλούσιοι ἔβαλλον πολλά·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/041.yaml
  text: And sitting opposite the treasury[a], he was watching how the crowd was putting money into the treasury; and many rich people were putting in much.
translation:
  language: te
  text: యేసు దేవాలయ ఖజానాకు[a] ఎదురుగా కూర్చొని, జనసమూహం ఖజానాలో డబ్బు ఎలా వేస్తున్నదో గమనిస్తూ ఉన్నాడు. చాలామంది ధనవంతులు ఎంతో వేస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కానుకల పెట్టె” లేదా “కానుకల పెట్టెలు.” గ్రీకు పదం దేవాలయ ఖజానాను గానీ, దానితో సంబంధమున్న కానుకలు వేసే పెట్టెను లేదా పెట్టెలను గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθίσας
  choice: కూర్చుని
  rationale: ప్రధాన క్రియకు ముందున్న దృశ్యస్థాపక ఏఒరిస్ట్ కృదంతాన్ని సహజమైన తెలుగు సమాపక క్రియతో తెలిపింది.
- source_word: κατέναντι
  choice: ఎదురుగా
  rationale: నేరుగా ఎదురుగా ఉన్న స్థానాన్ని సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: γαζοφυλάκιον
  choice: దేవాలయ కానుకల పెట్టెలు
  rationale: సందర్భంలో కానుకలు వేసే ఆలయ ఖజానాతో అనుబంధిత పాత్రలను సూచిస్తుంది; తెలుగు పాఠకునికి చర్య స్పష్టమవుతుంది. గ్రీకు పదంలోని ఖజానా-ప్రాంతం/పాత్రలు అనే విస్తృతిని పాదసూచికలో నిలిపింది.
- source_word: ἐθεώρει
  choice: గమనిస్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న పరిశీలన భావాన్ని నిలుపుతుంది.
- source_word: πῶς
  choice: ఎలా
  rationale: కేవలం వారు వేస్తున్నారనే వాస్తవం కాక, వేసే విధానం లేదా తీరు మీద దృష్టిని నిలుపుతుంది.
- source_word: ὄχλος
  choice: జనసమూహం
  rationale: సామూహిక అర్థాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: βάλλει / ἔβαλλον
  choice: వేస్తున్నారో / వేస్తున్నారు
  rationale: డబ్బును పాత్రలో జమచేసే సందర్భంలో βάλλωకు సహజమైన తెలుగు ప్రయోగం; అసంపూర్ణ భూతకాలపు కొనసాగింపు భావాన్ని నిలుపుతుంది.
- source_word: χαλκόν
  choice: డబ్బు
  rationale: అక్షరార్థంగా రాగి/కంచు అయినా, ఈ ద్రవ్యసందర్భంలో నాణేల రూపంలోని ధనాన్ని సూచిస్తుంది; ‘డబ్బు’ సహజంగా అర్థాన్ని అందిస్తుంది.
- source_word: πολλοὶ πλούσιοι
  choice: ధనవంతులు చాలామంది
  rationale: వ్యక్తులను సూచించే పుంలింగ బహువచనాన్ని అనవసరంగా పురుషులకు మాత్రమే పరిమితం చేయకుండా సహజంగా అనువదిస్తుంది.
- source_word: πολλά
  choice: పెద్ద మొత్తాల్లో
  rationale: డబ్బు సందర్భంలో ‘చాలా’ అనే పరిమాణార్థాన్ని స్పష్టమైన ఆధునిక తెలుగు రూపంలో తెలియజేస్తుంది.
