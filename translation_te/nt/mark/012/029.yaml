source:
  edition: SBLGNT
  text: ⸂ἀπεκρίθη ὁ Ἰησοῦς⸃ ὅτι Πρώτη ⸀ἐστίν· Ἄκουε, Ἰσραήλ, κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/029.yaml
  text: 'Jesus answered[a], “The first is: Hear, O Israel, the Lord our God[b], the Lord is one.'
translation:
  language: te
  text: 'యేసు జవాబిచ్చాడు: “మొదటిది ఇది: ‘ఇశ్రాయేలూ, విను! మన దేవుడైన ప్రభువు[b], ప్రభువు ఒక్కడే[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మన దేవుడైన ప్రభువు ఒక్క ప్రభువే,” లేదా “ప్రభువే మన దేవుడు, ప్రభువు మాత్రమే.” ఈ గ్రీకు వాక్యం ద్వితీయోపదేశకాండము 6:4ను ప్రతిధ్వనిస్తూ, దేవుని ఏకత్వాన్ని, ఆయనకే చెందవలసిన ప్రత్యేక భక్తిని, లేదా రెండింటినీ నొక్కిచెప్పవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ఇది షెమా వాక్యాన్ని (ద్వితీయోపదేశకాండము 6:4) ఉదహరిస్తున్నందున, ఇక్కడ “ప్రభువు” అనేది సెప్టువజింటులో YHWH అనే దైవనామానికి బదులుగా వాడిన గ్రీకు κύριοςను ప్రతిబింబిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: జవాబిచ్చాడు
  rationale: సంభాషణలో ప్రతిస్పందనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: Πρώτη
  choice: మొదటిది
  rationale: స్త్రీలింగ విశేషణం నామవాచకంగా వాడబడి, సందర్భంలోని ‘ఆజ్ఞ’ను సూచిస్తుంది; మూలంలో లేని పదాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా ఆ భావాన్ని నిలుపుతుంది.
- source_word: Ἄκουε
  choice: విను
  rationale: ఇది ద్వితీయోపదేశకాండము 6:4లోని షెమా ప్రారంభం; ఆజ్ఞార్థక ఏకవచనాన్ని, ఒడంబడిక సంబంధ పిలుపును నేరుగా నిలుపుతుంది.
- source_word: Ἰσραήλ
  choice: ఇశ్రాయేలూ
  rationale: నేర సంబోధనను సహజమైన తెలుగు సంబోధన రూపంలో ఉంచుతుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: కొత్త నిబంధనలో κύριοςకు ప్రామాణికమైన గౌరవపూర్వక తెలుగు సమానార్థకం; ఇక్కడ దైవనామ నేపథ్యాన్ని పాదటీపులో వివరిస్తుంది.
- source_word: ὁ θεὸς ἡμῶν
  choice: మన దేవుడు
  rationale: స్వామ్య సంబంధాన్ని స్పష్టంగా, సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది; వాక్యంలో ‘మన దేవుడైన ప్రభువు’గా రూపాంతరం చెందుతుంది.
- source_word: εἷς
  choice: ఒక్కడే
  rationale: దేవునిని సూచించే పుంలింగ ఏకవచనానికి సహజమైన తెలుగు రూపం; ఏకత్వ భావాన్ని వ్యక్తం చేస్తూ, ప్రత్యేకత్వ భావాన్ని పూర్తిగా వేరుచేసి నిర్ణయించదు.
theological_decisions:
- issue: షెమా చివరి భాగంలోని ఏకత్వం మరియు ప్రత్యేకత్వం మధ్య భావ ఉద్వేగాన్ని నిలుపడం
  choice: మన దేవుడైన ప్రభువు, ప్రభువు ఒక్కడే
  alternative: మన దేవుడైన ప్రభువు ఒక్క ప్రభువే; లేదా ప్రభువే మన దేవుడు, ప్రభువు మాత్రమే
  rationale: గ్రీకు పదక్రమానికి దగ్గరగా ఉండి దేవుని ఏకత్వ ప్రకటనను నిలుపుతుంది. అదే సమయంలో ఇది సంఖ్యాత్మక ఏకత్వాన్నేనా, ప్రభువుకే ప్రత్యేక భక్తినేనా, లేక రెండింటినీనా బలపరుస్తుందో ప్రధాన పాఠ్యంలో అతిగా నిర్ణయించకుండా ప్రత్యామ్నాయాలను పాదటీపులో ఇస్తుంది.
- issue: షెమాలో κύριος ద్వారా దైవనామ సూచన
  choice: ప్రభువు
  alternative: యెహోవా
  rationale: సువార్త యొక్క గ్రీకు పాఠ్యంలో ఉన్న κύριοςను అనువదిస్తూ, సెప్టువజింటులో అది YHWH దైవనామానికి ప్రతినిధిగా వాడబడిన విషయాన్ని పాదటీపులో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి. ‘ఇశ్రాయేలూ, విను!’ అనే రూపం నేర సంబోధనను, షెమా ప్రకటన యొక్క ఆజ్ఞాత్మక బలాన్ని కాపాడుతుంది. ప్రధాన పాఠ్యం గ్రీకు పదక్రమానికి సమీపంగా ఉండగా, సాధ్యమైన ఇతర అర్థవ్యవస్థలను పాదటీపులో ఉంచింది.
