translation:
  language: te
  text: సిలువ మీద నుంచి దిగి నిన్ను నీవు రక్షించుకో![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నిన్ను నీవు రక్షించుకో; సిలువ మీద నుంచి దిగిరా!” మరింత రూపనిష్ఠగా: “నిన్ను నీవు రక్షించుకో, సిలువ మీద నుంచి దిగి!”'
    reason: καταβάς అనే అఒరిస్ట్ అసమాపక క్రియకు σῶσον అనే ఆజ్ఞతో ఉన్న సంబంధాన్ని ప్రత్యామ్నాయంగా చూపిస్తుంది; దానిని తప్పనిసరిగా సాధనం లేదా ముందుకాల చర్యగా నిర్ధారించదు.
lexical_decisions:
- source_word: σῶσον
  choice: రక్షించుకో
  rationale: రెండవ పురుష ఏకవచన ఆజ్ఞారూపాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది. ఇది ఎగతాళితో కూడిన ఆజ్ఞను, అలాగే ‘రక్షణ’ అనే విస్తృత భావంతో ఉన్న పదసంబంధాన్ని నిలుపుతుంది.
- source_word: σεαυτόν
  choice: నిన్ను నీవు
  rationale: కర్మస్థానంలో ఉన్న ఆత్మవాచక సర్వనామాన్ని స్పష్టంగా చూపి, తనను తానే రక్షించుకోవాలనే ఎగతాళి బలాన్ని నిలుపుతుంది.
- source_word: καταβάς
  choice: దిగివచ్చి
  rationale: అనంతర క్రియావిశేషణాత్మక అసమాపక క్రియగా సహజమైన ఆధునిక తెలుగులో ఉంటుంది. ఇది ప్రధాన ఆజ్ఞతో చర్యకు ఉన్న సన్నిహిత సంబంధాన్ని చూపుతుంది; అయితే అది సాధనమా, అనుబంధ చర్యా, లేక వరుస చర్యా అన్నదాన్ని అతిగా నిర్ధారించదు.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: సిలువ మీద నుంచి
  rationale: సిలువపై ఉన్న స్థానం నుంచి కిందికి రావడాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: καταβάς అనే అసమాపక క్రియకు σῶσον అనే ఆజ్ఞతో ఉన్న సంబంధం
  choice: ‘సిలువ మీద నుంచి దిగివచ్చి నిన్ను నీవు రక్షించుకో!’ అని అసమాపక క్రియతో అనుసంధానించడం
  alternative: ‘నిన్ను నీవు రక్షించుకో; సిలువ మీద నుంచి దిగిరా!’ అని రెండు సమన్వయ ఆజ్ఞలుగా అనువదించడం
  rationale: గ్రీకు వాక్యం సంక్షిప్తమైన ఎగతాళి; అసమాపక క్రియ సాధనం, అనుబంధ చర్య, లేదా ముందుగా జరిగే చర్య అనే భావాల్లో గ్రహించవచ్చు. ‘దిగివచ్చి’ అనే రూపం తెలుగులో సహజంగా ఉండి, ఆ సంబంధాన్ని పూర్తిగా ఒకే విధంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఎగతాళితో కూడిన ప్రత్యక్ష ఆజ్ఞను సంక్షిప్తంగా, గంభీరంగా ఉంచింది. ‘క్రిందికి’ వంటి అనవసర ద్విరుక్తిని నివారించి, సాధారణ పాఠకులకు సహజమైన ‘దిగివచ్చి’ వాడబడింది.
