id: MRK.15.36
reference: Mark 15:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δραμὼν δέ ⸂τις καὶ⸃ γεμίσας σπόγγον ὄξους ⸀περιθεὶς καλάμῳ ἐπότιζεν αὐτόν, λέγων· Ἄφετε ἴδωμεν εἰ ἔρχεται Ἠλίας καθελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/036.yaml
  text: Then someone ran[a], filled a sponge with sour wine, put it on a reed, and gave him a drink, saying, “Leave him alone[b]. Let us see whether Elijah is coming to take him down.”
translation:
  language: te
  text: అప్పుడు ఒకడు పరుగెత్తి, పులిసిన ద్రాక్షారసంతో[a] ఒక స్పంజిని నింపి, దాన్ని ఒక రెల్లుకాడకు తగిలించి, ఆయనకు తాగిస్తూ, “ఆయన్ని అలాగే వదిలేయండి[b]. ఏలీయా వచ్చి ఆయన్ని కిందికి దింపుతాడేమో చూద్దాం” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పులిసిన ద్రాక్షారసం” అంటే సాధారణంగా చవకైన, పుల్లని ద్రాక్షారస పానీయం; ఆధునిక అర్థంలోని వెనిగర్ అని తప్పనిసరిగా కాదు.
    reason: cultural_note
  - marker: b
    text: లేదా, “ఆగండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δραμὼν
  choice: పరుగెత్తి
  rationale: అనంతరంగా జరిగిన చర్యల వరుసను సహజమైన తెలుగు క్రియావిశేషణ రూపంలో తెలియజేస్తుంది.
- source_word: τις καὶ
  choice: ఒకడు
  rationale: τις సూచించే పేరు తెలియని వ్యక్తిని సహజంగా తెలియజేస్తుంది; καίకు ఇక్కడ ప్రత్యేకంగా ‘కూడా’ అని అనువదించడం తెలుగులో అవసరం లేదు.
- source_word: γεμίσας σπόγγον ὄξους
  choice: పులిసిన ద్రాక్షారసంతో ఒక స్పంజిని నింపి
  rationale: ὄξοςను ఆధునిక గృహ వినియోగ వెనిగర్‌గా అపార్థం చేసుకోకుండా, పుల్లగా ఉండే చవక ద్రాక్షారస పానీయంగా సూచిస్తుంది.
- source_word: περιθεὶς καλάμῳ
  choice: దాన్ని ఒక రెల్లుకాడకు తగిలించి
  rationale: κάλαμος యొక్క నిర్దిష్ట అర్థమైన రెల్లుకాడను నిలుపుతూ, స్పంజిని దానికి అమర్చిన చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπότιζεν αὐτόν
  choice: ఆయనకు తాగిస్తూ
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న చర్యను తెలుగులో సహజంగా నిలుపుతుంది; అది కేవలం ప్రయత్నమేనని అదనంగా నిర్ణయించదు.
- source_word: Ἄφετε
  choice: ఆయన్ని అలాగే వదిలేయండి
  rationale: ఆపడం లేదా జోక్యం చేసుకోకుండా వదిలేయడం అనే ἀφίημι యొక్క ప్రధాన భావాన్ని వ్యక్తం చేస్తుంది; ‘ఆగండి’ అనే సందర్భోచిత ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: ἴδωμεν εἰ ἔρχεται Ἠλίας
  choice: ఏలీయా వచ్చి … దింపుతాడేమో చూద్దాం
  rationale: ఏలీయా జోక్యం చేసుకుంటాడా లేదా అని వేచి చూడాలనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: καθελεῖν αὐτόν
  choice: ఆయన్ని కిందికి దింపుతాడేమో
  rationale: సిలువ వంటి ఎత్తైన స్థలం నుంచి ఒకరిని కిందికి దించడం అనే సందర్భార్థాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: Ἄφετε అన్న మాటలో వక్త ఉద్దేశం
  choice: కొంతసేపు యేసును అలాగే వదిలేయమనే ఆజ్ఞగా ప్రధాన పాఠ్యంలో అనువదించబడింది.
  alternative: “ఆగండి” అని కూడా అనువదించవచ్చు.
  rationale: ἀφίημι యొక్క ప్రాథమిక భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సందర్భానుసారమైన జాతీయార్థాన్ని పాదసూచికలో ఇవ్వడం ద్వారా అస్పష్టతను అతిగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘స్పంజి,’ ‘రెల్లుకాడ’ వంటి స్పష్టమైన సాధారణ పదాలు మూలంలోని వస్తువులను నిలుపుతాయి; కొనసాగుతున్న ἐπότιζεν చర్యను ‘తాగిస్తూ’ రూపం సహజంగా ప్రతిబింబిస్తుంది.
