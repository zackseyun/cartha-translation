  text: ⸂Καὶ γενομένης⸃ ὥρας ἕκτης σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/033.yaml
  text: And when the sixth hour had come[b][a], darkness came over the whole land until the ninth hour.
translation:
  language: te
  text: ఆరవ గంట వచ్చినప్పుడు[a], తొమ్మిదవ గంట వరకు దేశమంతటా[b] చీకటి కమ్ముకుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యూదుల పగటి వేళల లెక్క ప్రకారం, ఆరవ గంట సుమారు మధ్యాహ్నం పన్నెండు గంటలు; తొమ్మిదవ గంట సుమారు మధ్యాహ్నం మూడు గంటలు.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘భూమి అంతటా.’ గ్రీకు పదానికి ‘దేశం’ లేదా ‘భూమి’ అనే రెండు అర్థాలూ రావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: γενομένης ὥρας ἕκτης
  choice: ఆరవ గంట వచ్చినప్పుడు
  rationale: గ్రీకు షష్ఠీ విభక్తి నిరపేక్ష నిర్మాణంలోని కాలార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. మూలంలోని గంటల లెక్కను ప్రధాన పాఠ్యంలో నిలుపుతూ, ఆధునిక సమయాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: σκότος
  choice: చీకటి
  rationale: ఈ నామవాచకానికి నేరమైన, సాధారణ ఆధునిక తెలుగు సమానార్థకం.
- source_word: ἐγένετο
  choice: కమ్ముకుంది
  rationale: చీకటి ఒక ప్రాంతమంతటా వ్యాపించిన సంఘటనను సహజమైన తెలుగులో తెలియజేస్తుంది; మూలంలోని సంఘటనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: దేశమంతటా
  rationale: γῆ అనే పదానికి ‘దేశం/ప్రాంతం’ లేదా ‘భూమి’ అనే అర్థాలు ఉండవచ్చు. సందర్భంలో అతిగా విశ్వవ్యాప్త అర్థాన్ని నిర్ధారించకుండా ‘దేశమంతటా’ అని అనువదించి, మరో సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: ἕως ὥρας ἐνάτης
  choice: తొమ్మిదవ గంట వరకు
  rationale: ‘ఆరవ గంట’తో అనుగుణంగా మూలంలోని కాలవ్యక్తీకరణను నిలుపుతుంది; ఆధునిక సమయ సమానాన్ని పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: సిలువవేత సమయంలో కలిగిన చీకటి విషయంలో γῆ పదపు పరిధి
  choice: దేశమంతటా
  alternative: భూమి అంతటా
  rationale: γῆ పదం భూభాగాన్ని గానీ భూమి మొత్తాన్ని గానీ సూచించగలదు. ‘దేశమంతటా’ అనడం ప్రపంచమంతటికీ చీకటి వ్యాపించిందని పాఠ్యం తప్పనిసరిగా చెబుతున్నట్లు నిర్ణయించదు; నిజమైన భాషాత్మక సందిగ్ధతను ‘భూమి అంతటా’ అనే ప్రత్యామ్నాయంతో పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. మూలంలోని ప్రాచీన గంటల లెక్కను ప్రధాన పాఠ్యంలో ఉంచి పాదసూచికలో వివరణ ఇచ్చింది; γῆ పదంలోని నిజమైన సందిగ్ధతను తొలగించలేదు.
