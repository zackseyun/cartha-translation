  yaml_path: translation/nt/mark/015/007.yaml
  text: The man called Barabbas was bound with the rebels who had committed murder in the rebellion[a].
translation:
  language: te
  text: బరబ్బ అనే వ్యక్తి తిరుగుబాటులో హత్య చేసిన తిరుగుబాటుదారులతో కలిసి బంధించబడి ఉన్నాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తిరుగుబాటుదారులతో’ అనే చోట ‘తిరుగుబాటులో పాల్గొన్నవారితో’ అని కూడా అనువదించవచ్చు. గ్రీకులో తిరుగుబాటులో పాల్గొన్నవారిని, తిరుగుబాటును సూచించడానికి సంబంధమున్న పదాలు వాడబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: ఉన్నాడు
  rationale: δέ యొక్క స్వల్ప కథన అనుసంధానాన్ని తెలుగులో ప్రత్యేక కాలసూచక పదం చేర్చకుండా సహజ వాక్యప్రవాహంలో ఉంచాం; ἦν భావం స్థితిని సూచించే ‘ఉన్నాడు’లో వ్యక్తమవుతుంది.
- source_word: ὁ λεγόμενος Βαραββᾶς
  choice: బరబ్బ అని పిలువబడే వ్యక్తి
  rationale: వ్యక్తిని అతని పేరుతో గుర్తించే గ్రీకు నిర్మాణాన్ని అవమానార్థం రాకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μετὰ τῶν στασιαστῶν
  choice: తిరుగుబాటుదారులతో పాటు
  rationale: στασιασταί రాజకీయ తిరుగుబాటులో పాల్గొన్నవారిని సూచిస్తుంది; ‘తిరుగుబాటుదారులు’ స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: δεδεμένος
  choice: బంధించబడి ఉన్నాడు
  rationale: δέω యొక్క పరిపూర్ణ కర్మణి రూపం బంధించబడిన స్థితిలో ఉండడాన్ని తెలియజేస్తుంది; కేవలం ‘ఖైదు చేయబడ్డాడు’ అని సందర్భార్థానికే పరిమితం చేయకుండా మూలంలోని బంధన భావాన్ని నిలుపుతుంది.
- source_word: οἵτινες ἐν τῇ στάσει
  choice: తిరుగుబాటులో ... చేసిన తిరుగుబాటుదారులు
  rationale: సంబంధవాచక ఉపవాక్యాన్ని తెలుగులో సహజమైన పూర్వవిశేషణ నిర్మాణంగా మార్చాం. στάσις‌ను ‘తిరుగుబాటు’గా అనువదించి, στασιασταίతో ఉన్న మూలపద సంబంధాన్ని నిలిపాం.
- source_word: φόνον πεποιήκεισαν
  choice: హత్య చేసిన
  rationale: ముందే పూర్తయిన హత్యాకార్యాన్ని సందర్భం స్పష్టం చేస్తుంది; ‘హత్య’ φόνοςలోని నేరపూరిత హతక్రియ భావాన్ని కాపాడుతుంది.
