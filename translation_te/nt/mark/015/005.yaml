  yaml_path: translation/nt/mark/015/005.yaml
  text: But Jesus no longer answered anything[a], so that Pilate was amazed.
translation:
  language: te
  text: కాని యేసు ఇక ఏ జవాబూ చెప్పలేదు[a]. దాంతో పిలాతు ఆశ్చర్యపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కాని యేసు ఇక ఏ ప్రత్యుత్తరమూ ఇవ్వలేదు; దాని ఫలితంగా పిలాతు ఆశ్చర్యపోయాడు.”
    reason: జవాబివ్వడం, ఫలిత సంబంధం అనే గ్రీకు భావాలకు సాధ్యమైన మరింత రూపసన్నిహిత ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: δὲ
  choice: కాని
  rationale: మునుపటి ఆరోపణలు, జవాబుల నేపథ్యానికి స్వల్ప వ్యతిరేకతను సూచిస్తుంది.
- source_word: οὐκέτι
  choice: ఇక
  rationale: ముందు జవాబిచ్చిన స్థితి ఇప్పుడు కొనసాగడం లేదనే కాలార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὐδὲν ἀπεκρίθη
  choice: ఏ జవాబూ చెప్పలేదు
  rationale: సంపూర్ణ మౌనాన్ని న్యాయ విచారణ సందర్భానికి తగిన సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὥστε
  choice: దాంతో
  rationale: యేసు మౌనం ఫలితంగా పిలాతు ఆశ్చర్యపడ్డాడనే ఫలిత సంబంధాన్ని స్పష్టంగా చూపిస్తుంది.
- source_word: θαυμάζειν
  choice: ఆశ్చర్యపోయాడు
  rationale: పిలాతు ప్రతిస్పందనను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Πιλᾶτον
  choice: పిలాతు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
