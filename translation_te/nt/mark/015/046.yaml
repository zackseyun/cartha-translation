translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. గ్రీకు మూలంలోని వరుస చర్యలు—కొనడం, దించడం, చుట్టడం, ఉంచడం, రాయిని దొర్లించడం—తెలుగు అసమాపక క్రియలతో సహజంగా నిలుపబడ్డాయి. ‘ఆయన’ గౌరవసూచకంగా వాడినా, క్రియలో లేని అదనపు ధార్మిక భావం చేర్చబడలేదు.
