review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the sequence of actions and accurately renders σινδών, καθαιρέω, ἐνείλησεν, τίθημι, and μνημεῖον. Two expressions merit refinement: ‘బండలో తొలిచిన’ is less idiomatic and can suggest merely boring into a boulder, whereas the Greek describes a tomb cut out of rock; and ‘ప్రవేశద్వారానికి ... దొర్లించాడు’ does not fully express the stone being rolled against/across the entrance.'
  naturalness: The register is modern and clear. ‘రాతిని తొలిచి చేసిన సమాధి’ is more natural standard Telugu than ‘బండలో తొలిచిన సమాధి.’ ‘ప్రవేశద్వారానికి అడ్డంగా’ naturally conveys the closing placement of the stone.
  terminology: ‘నారబట్ట,’ ‘సమాధి,’ and ‘ప్రవేశద్వారం’ are suitable, accurate modern Telugu choices. The alternatives in the notes appropriately retain the lexical range of σινδών and θύρα.
  issues:
  - severity: low
    issue: ‘బండలో తొలిచిన సమాధి’ is an awkward rendering of λελατομημένον ἐκ πέτρας.
    rationale: The Greek refers to a tomb cut out of rock. ‘రాతిని తొలిచి చేసిన సమాధి’ states this more idiomatically and precisely.
  - severity: medium
    issue: ‘సమాధి ప్రవేశద్వారానికి ఒక రాయిని దొర్లించాడు’ weakens the force of προσεκύλισεν ἐπὶ τὴν θύραν.
    rationale: The construction places the stone against/across the tomb entrance, not merely at or toward it. ‘ప్రవేశద్వారానికి అడ్డంగా’ preserves the closing placement without asserting a hinged door.
  revised_text: అతడు నారబట్టను[a] కొని, యేసును కిందికి దించి, ఆ నారబట్టలో చుట్టి, రాతిని తొలిచి చేసిన సమాధిలో[b] ఆయనను ఉంచాడు. తరువాత సమాధి ప్రవేశద్వారానికి అడ్డంగా[c] ఒక రాయిని దొర్లించాడు.
