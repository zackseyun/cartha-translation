id: MRK.15.46
reference: Mark 15:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀγοράσας ⸀σινδόνα καθελὼν αὐτὸν ἐνείλησεν τῇ σινδόνι καὶ ⸀ἔθηκεν αὐτὸν ἐν ⸀μνημείῳ ὃ ἦν λελατομημένον ἐκ πέτρας, καὶ προσεκύλισεν λίθον ἐπὶ τὴν θύραν τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/046.yaml
  text: And after buying a linen cloth[a], he took him down, wrapped him in the linen cloth, and laid him in a tomb that had been cut out of rock[c][b]. Then he rolled a stone against the entrance of the tomb.
translation:
  language: te
  text: అతడు నారబట్టను[a] కొని, యేసును కిందికి దించి, ఆ నారబట్టలో చుట్టి, రాతిని తొలిచి చేసిన సమాధిలో[b] ఆయనను ఉంచాడు. తరువాత సమాధి ప్రవేశద్వారానికి అడ్డంగా[c] ఒక రాయిని దొర్లించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నారబట్ట’కు ‘నారతో నేసిన వస్త్రం’ లేదా సందర్భానుసారం ‘శవాన్ని చుట్టే వస్త్రం’ అని కూడా అనువదించవచ్చు (σινδών).
    reason: lexical_alternative
  - marker: b
    text: ‘రాతిని తొలిచి చేసిన’ అనే మాట సమాధి సహజమైన రాతిలో చెక్కబడి తయారై ఉందని సూచిస్తుంది.
    reason: lexical_clarification
  - marker: c
    text: ‘ప్రవేశద్వారం’కు మూలపదమైన θύραను ‘తలుపు’ అని కూడా అనువదించవచ్చు. ‘అడ్డంగా’ అనేది రాయిని ప్రవేశద్వారానికి ఎదురుగా/ఆనించి దొర్లించిన భావాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: σινδόνα / σινδόνι
  choice: నారబట్టను / ఆ నారబట్టలో
  rationale: σινδών నారతో చేసిన వస్త్రాన్ని సూచిస్తుంది; సందర్భంలో అది మృతదేహాన్ని చుట్టడానికి ఉపయోగించబడింది. ‘నారబట్ట’ పదార్థాన్ని, సందర్భోచితమైన పనిని అతిగా నిర్దిష్టం చేయకుండా సహజంగా తెలియజేస్తుంది.
- source_word: καθελών
  choice: కిందికి దించి
  rationale: ఈ సందర్భంలో సిలువపై ఉన్న యేసు దేహాన్ని కిందికి దించడాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో కర్మను స్పష్టంచేయడానికి ‘యేసును’ అని పేర్కొనబడింది.
- source_word: ἐνείλησεν
  choice: చుట్టి
  rationale: కప్పి చుట్టడం లేదా ఆవరించడం అనే క్రియార్థాన్ని సరళంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἔθηκεν
  choice: ఉంచాడు
  rationale: τίθημι యొక్క సాధారణ అర్థాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: μνημείῳ / μνημείου
  choice: సమాధిలో / సమాధి
  rationale: ఇక్కడ μνημεῖον శవాన్ని ఉంచే రాతి సమాధి గదిని సూచిస్తుంది; ‘సమాధి’ ఆధునిక ప్రామాణిక తెలుగులో స్థిరమైన సమానార్థకం.
- source_word: λελατομημένον ἐκ πέτρας
  choice: బండలో తొలిచిన
  rationale: పూర్తయిన స్థితిని సూచించే perfect passive participle భావాన్ని సంక్షిప్తంగా నిలుపుతూ, సహజ శిలలో చెక్కి చేసిన సమాధి అనే అర్థాన్ని తెలియజేస్తుంది.
- source_word: προσεκύλισεν
  choice: దొర్లించాడు
  rationale: రాయిని దొర్లిస్తూ ప్రవేశద్వారానికి చేర్చిన చర్యను సహజంగా తెలియజేస్తుంది; దిశను తరువాతి పదబంధం అందిస్తుంది.
- source_word: ἐπὶ τὴν θύραν τοῦ μνημείου
  choice: సమాధి ప్రవేశద్వారానికి
  rationale: θύρα ‘తలుపు’ లేదా ‘ప్రవేశద్వారం’ అని అర్థమవగలదు. రాతి సమాధి సందర్భంలో ‘ప్రవేశద్వారం’ ఆధునిక పాఠకునికి స్పష్టంగా ఉంటుంది; -కి విభక్తి రాయిని దాని వద్దకు/దానికి ఆనుకునేలా దొర్లించిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀγοράσας
  choice: కొని
  rationale: aorist participle ప్రధాన చర్యలకు ముందుగా జరిగిన కొనుగోలును సూచిస్తుంది; తెలుగు అసమాపక క్రియ ‘కొని’ ఆ క్రమాన్ని సహజంగా నిలుపుతుంది.
