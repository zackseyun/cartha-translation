id: MRK.15.19
reference: Mark 15:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔτυπτον αὐτοῦ τὴν κεφαλὴν καλάμῳ καὶ ἐνέπτυον αὐτῷ, καὶ τιθέντες τὰ γόνατα προσεκύνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/019.yaml
  text: And they were striking his head with a reed and spitting on him[a], and kneeling down they were bowing down to him.
translation:
  language: te
  text: వారు ఆయన తలపై రెల్లుతో పదేపదే కొడుతూ, ఆయన మీద ఉమ్మివేస్తూ, మోకాళ్లూని ఆయనకు సాగిలపడేవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనను ఆరాధించేవారు.” గ్రీకు క్రియకు “సాగిలపడు,” “గౌరవం చెల్లించు,” లేదా “ఆరాధించు” అనే అర్థాలు రావచ్చు. ఇక్కడ సైనికులు రాజుకు ఇచ్చే గౌరవాన్ని ఎగతాళిగా అనుకరిస్తున్నారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτυπτον
  choice: పదేపదే కొడుతూ
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పునరావృతమైన చర్యను సూచిస్తుంది; ‘పదేపదే’ ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: αὐτοῦ τὴν κεφαλήν
  choice: ఆయన తలపై
  rationale: గ్రీకు స్వామ్య నిర్మాణాన్ని సహజమైన తెలుగు స్వామ్య ప్రయోగంతో ఇచ్చి, కొట్టిన స్థలాన్ని ‘పై’ ద్వారా స్పష్టం చేశాం.
- source_word: καλάμῳ
  choice: రెల్లుతో
  rationale: κάλαμος సాధారణంగా రెల్లు లేదా రెల్లుతో చేసిన కర్రను సూచిస్తుంది; సమీప సందర్భంలోని ఎగతాళి రాజదండంతో కథన సంబంధాన్ని నిలుపుతుంది.
- source_word: ἐνέπτυον αὐτῷ
  choice: ఆయన మీద ఉమ్మివేస్తూ
  rationale: అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న లేదా పునరావృత అవమానకర చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τιθέντες τὰ γόνατα
  choice: మోకాళ్లూని
  rationale: అక్షరార్థంగా ‘మోకాళ్లు ఉంచి’; ఇది మోకరించే చర్యకు గ్రీకు నుడికారం. ‘మోకాళ్లూని’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: προσεκύνουν αὐτῷ
  choice: ఆయనకు సాగిలపడేవారు
  rationale: προσκυνέωలోని వంగి నమస్కరించడం లేదా రాజగౌరవం చూపడం అనే భావాన్ని, ఈ ఎగతాళి సందర్భంలో నిజమైన ఆరాధనగా ముందే నిర్ణయించకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: ఎగతాళి సందర్భంలో προσκυνέω అనువాదం
  choice: సాగిలపడేవారు
  alternative: ఆరాధించేవారు
  rationale: సైనికులు రాజుకు ఇచ్చే గౌరవాన్ని ఎగతాళిగా అనుకరిస్తున్నారు. ‘సాగిలపడేవారు’ వారి బాహ్య చర్యను నిలుపుతూ, వారు యేసును హృదయపూర్వకంగా ఆరాధించారని అనవసరంగా సూచించదు; అయినా ‘ఆరాధించు’ అనే నిఘంటు సాధ్యతను పాదటిప్పణిలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. అసంపూర్ణ భూతకాల క్రియల పునరావృత లేదా కొనసాగుతున్న భావాన్ని ‘పదేపదే’ మరియు ‘-వేస్తూ/-పడేవారు’ రూపాలతో నిలిపాం. యేసును సూచించడానికి గౌరవవాచక ఏకవచనం వాడాం.
