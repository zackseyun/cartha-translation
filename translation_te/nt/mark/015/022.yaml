  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని స్థలనామం, ‘స్థలం’ అనే పదం, అనువాద వివరణ అన్నీ నిలుపబడ్డాయి.
