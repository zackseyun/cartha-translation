  text: καὶ φέρουσιν αὐτὸν ἐπὶ ⸀τὸν ⸀Γολγοθᾶν τόπον, ὅ ἐστιν ⸀μεθερμηνευόμενον Κρανίου Τόπος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/022.yaml
  text: And they bring him to the place Golgotha[a], which is translated, “Place of a Skull.”
translation:
  language: te
  text: వారు ఆయనను గొల్గొతా స్థలానికి తీసుకొచ్చారు. దాని అనువాదం “పుర్రె స్థలం.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదబంధంలో నిర్దిష్ట ఉపపదం లేదు. అందువల్ల ఆంగ్లంలో “Place of a Skull” లేదా “Place of the Skull” అని అనువదించవచ్చు; తెలుగు “పుర్రె స్థలం” ఈ నిర్దిష్టతను నిర్ణయించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρουσιν
  choice: తీసుకొచ్చారు
  rationale: గమ్యస్థానానికి ఆయనను తీసుకురావడాన్ని సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది; ఆయనను మోసుకొచ్చారని అనవసరంగా నిర్దిష్టం చేయదు. గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగులో సహజమైన భూతకాలంతో అనువదించాం.
- source_word: ἐπὶ τὸν Γολγοθᾶν τόπον
  choice: గొల్గొతా అనే స్థలానికి
  rationale: ἐπίతో కూడిన ద్వితీయా విభక్తి ఒక స్థలం వైపు కదలికను సూచిస్తుంది. τόποςనూ స్థలనామాన్నీ నిలుపుతూ, తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉండేందుకు ‘అనే’ వాడాం.
- source_word: Γολγοθᾶν
  choice: గొల్గొతా
  rationale: స్థలనామాన్ని అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: μεθερμηνευόμενον
  choice: దాని అనువాదం
  rationale: మరో భాషలోకి అనువదించి వివరణ ఇవ్వడం అనే భావాన్ని ‘అర్థం’ కంటే స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: Κρανίου Τόπος
  choice: పుర్రె స్థలం
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని తెలుగులో సహజమైన సమాసరూపంతో నిలిపాం. ఈ రూపం ‘ఒక పుర్రె’ లేదా ‘ఆ పుర్రె’ అని అనవసరంగా నిర్ణయించదు.
