  yaml_path: translation/nt/mark/015/028.yaml
  text: And[a] the scripture was fulfilled that says, "And he was numbered with the transgressors."
translation:
  language: te
  text: మరియు, “ఆయన అతిక్రమించేవారితో పాటు లెక్కించబడ్డాడు” అని చెప్పే లేఖనం నెరవేరింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనం అత్యంత ప్రాచీన గ్రీకు ప్రతుల్లో—నాలుగో శతాబ్దపు సీనైటికస్, వాటికానస్ ప్రతులతో సహా—మరియు ప్రాచీన కాప్టిక్ అనువాదాల్లో లేదు. అయితే బైజాంటైన్ అధికసంఖ్యాక ప్రతుల సంప్రదాయంలోను లాటిన్ సంప్రదాయంలోను ఉంది. యెషయా 53:12ను ఉల్లేఖించే లూకా 22:37కు అనుగుణంగా తరువాతి నకలుదారులు దీన్ని చేర్చి ఉండవచ్చు.
    reason: textual_critical
lexical_decisions:
- source_word: πληρόω (ἐπληρώθη)
  choice: నెరవేరింది
  rationale: ప్రవచనాత్మక లేఖనం సాకారమైందనే భావాన్ని సహజమైన ఆధునిక తెలుగు పదప్రయోగంతో తెలియజేస్తుంది.
- source_word: ἄνομος (ἀνόμων)
  choice: అక్రమస్థులు
  rationale: పదానికి మూలమైన ‘ధర్మశాస్త్రానికి లోబడని వారు’ అనే భావాన్ని నిలుపుతూ, ఇక్కడ నేరస్థులుగా పరిగణించబడిన వారిని సూచించే గంభీరమైన పదం.
- source_word: λογίζομαι (ἐλογίσθη)
  choice: ఒకడిగా లెక్కించబడ్డాడు
  rationale: ఆయనను ఆ వర్గానికి చెందినవానిగా ఎంచి వారితో కలిపి లెక్కించారనే కర్మణి భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: γραφή
  choice: లేఖనం
  rationale: అధికారిక పవిత్రలేఖన వాక్యాన్ని సూచించే స్థిరమైన, సహజమైన తెలుగు ప్రయోగం.
theological_decisions:
- issue: యెషయా 53:12 ఉల్లేఖనంలోని వర్గీకరణ భావం
  choice: అక్రమస్థులలో ఒకడిగా లెక్కించబడ్డాడు
  alternative: నేరస్థులతో పాటు లెక్కించబడ్డాడు
  rationale: μετά మరియు కర్మణి ἐλογίσθη కలిపి తెలిపే ‘వారిలో ఒకరిగా పరిగణించబడటం’ అనే భావాన్ని నిలుపుతుంది; అదే సమయంలో ఆయన నిజంగా అక్రమస్థుడని వాక్యం నిర్ణయిస్తున్నట్లు చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్య నిర్మాణం వాడబడింది. గ్రీకు వాక్యారంభంలోని Καὶను యాంత్రికంగా ‘మరియు’ అని కాకుండా సందర్భానుసారంగా ‘అప్పుడు’గా ఇచ్చాం; ఉల్లేఖనంలోని రెండవ Καὶకు తెలుగులో ప్రత్యేక పదం అవసరం లేకపోవడంతో అనువదించలేదు.
