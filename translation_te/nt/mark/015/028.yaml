- from: అప్పుడు, “ఆయన అక్రమస్థులలో ఒకడిగా లెక్కించబడ్డాడు” అని చెప్పే లేఖనం నెరవేరింది.[a]
  to: మరియు, “ఆయన అతిక్రమించేవారితో పాటు లెక్కించబడ్డాడు” అని చెప్పే లేఖనం నెరవేరింది.[a]
  rationale: The revision retains the Byzantine Greek wording’s fulfillment formula and quotation while replacing the added temporal “అప్పుడు” with “మరియు.” It also uses idiomatic “అతిక్రమించేవారితో పాటు లెక్కించబడ్డాడు” for μετὰ ἀνόμων ἐλογίσθη, preserving both the association and passive reckoning. The textual-critical footnote is retained unchanged because it accurately reflects the supplied English audit trail and appropriately qualifies the verse’s disputed textual status.
