id: MRK.15.29
reference: Mark 15:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ οἱ παραπορευόμενοι ἐβλασφήμουν αὐτὸν κινοῦντες τὰς κεφαλὰς αὐτῶν καὶ λέγοντες· Οὐὰ ὁ καταλύων τὸν ναὸν καὶ ⸂οἰκοδομῶν ἐν τρισὶν ἡμέραις⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/029.yaml
  text: And those passing by were reviling him[a], shaking their heads and saying[b], “Aha! You who would tear down the temple and build it in three days,”
translation:
  language: te
  text: 'అటుగా వెళ్తున్నవారు తమ తలలు ఊపుతూ ఆయనను వెక్కిరిస్తూ ఇలా అన్నారు: “ఆహా! దేవాలయాన్ని[a] పడగొట్టే వాడా, మూడు రోజుల్లో కట్టేవాడా[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత నిర్దిష్టంగా, “ఆలయపు పరిశుద్ధ స్థలాన్ని.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “మూడు రోజుల్లో మళ్లీ కట్టేవాడా.” గ్రీకు క్రియకు నేరుగా “కట్టు” అని అర్థం; అయితే పడగొట్టడం అనే సందర్భం మళ్లీ కట్టడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: అటుగా వెళ్తున్నవారు
  rationale: సంఘటనాస్థలం పక్కగా వెళ్తున్నవారిని, కొనసాగుతున్న చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐβλασφήμουν
  choice: దూషిస్తూ
  rationale: ఇక్కడ యేసును ఉద్దేశించి అవమానకరంగా మాట్లాడడమే సందర్భార్థం; సాంకేతిక మతపరమైన అర్థాన్ని అనవసరంగా రుద్దకుండా గ్రీకు క్రియలోని నిందాభావాన్ని తెలియజేస్తుంది.
- source_word: κινοῦντες τὰς κεφαλὰς αὐτῶν
  choice: తమ తలలు ఊపుతూ
  rationale: హేళనను సూచించే గ్రీకు నుడికారానికి స్పష్టమైన, సహజమైన తెలుగు రూపం.
- source_word: Οὐὰ
  choice: ఆహా!
  rationale: ఈ సందర్భంలోని ఎగతాళి, వెక్కిరింపు ధ్వనిని నిలుపుతుంది.
- source_word: ὁ καταλύων
  choice: పడగొట్టి
  rationale: నేరుగా సంబోధించే కృదంత నిర్మాణంలో దేవాలయాన్ని కూల్చివేయడమనే ఆరోపణను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ναὸν
  choice: దేవాలయాన్ని
  rationale: సాధారణ పాఠకులకు స్పష్టమైన రూపం; గ్రీకు పదం మరింత నిర్దిష్టంగా పరిశుద్ధ స్థలాన్ని సూచించే అవకాశాన్ని పాదసూచికలో ఉంచింది.
- source_word: οἰκοδομῶν ἐν τρισὶν ἡμέραις
  choice: మూడు రోజుల్లో కట్టేవాడా
  rationale: గ్రీకు క్రియ యొక్క నేర అర్థమైన ‘కట్టు’ను నిలుపుతూ, సందర్భంలో ఉన్న పునర్నిర్మాణ భావసాధ్యతను పాదసూచికలో తెలియజేస్తుంది.
theological_decisions:
- issue: దేవాలయం గురించిన మాట దేనిని సూచిస్తుంది?
  choice: హేళన చేస్తున్నవారి ఆరోపణను ఈ వచనం చెప్పినట్టుగానే అనువదించడం
  alternative: దేవాలయం యేసు శరీరాన్ని సూచిస్తుందని ప్రధాన పాఠ్యంలోనే వివరణాత్మకంగా చూపించడం
  rationale: మార్కు ఇక్కడ సిలువవద్ద ఉన్నవారి వెక్కిరింపును వర్ణిస్తున్నాడు. ఇతర సువార్తలోని వివరణను ఈ వచనంలో చేర్చి అంతర్లీనమైన ధార్మిక ఉద్వేగాన్ని ముందుగానే పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ఎగతాళి ధ్వనిని ‘ఆహా!’ మరియు సంబోధనాత్మక ‘కట్టేవాడా’ ద్వారా నిలిపాం.
