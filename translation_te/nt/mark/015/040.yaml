id: MRK.15.40
reference: Mark 15:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἦσαν δὲ καὶ γυναῖκες ἀπὸ μακρόθεν θεωροῦσαι, ἐν ⸀αἷς καὶ ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸀ἡ Ἰακώβου τοῦ μικροῦ καὶ ⸀Ἰωσῆτος μήτηρ καὶ Σαλώμη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/040.yaml
  text: There were also women watching from a distance[a], among whom were Mary Magdalene, Mary the mother of James the younger and of Joses, and Salome[c][b],
translation:
  language: te
  text: దూరం నుంచి చూస్తున్న స్త్రీలు కూడా ఉన్నారు.[a] వారిలో మగ్దలేనే మరియ, చిన్న యాకోబు, యోసేలకు తల్లియైన మరియ, సలోమే ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దూరం నుండి.”
    reason: ‘నుంచి/నుండి’ రెండూ ἀπό యొక్క సహజ తెలుగు రూపాలు; ప్రత్యామ్నాయాన్ని నమోదు చేస్తుంది.
lexical_decisions:
- source_word: Ἦσαν δὲ καὶ γυναῖκες
  choice: స్త్రీలు కూడా ఉన్నారు
  rationale: δέను తెలుగులో ప్రత్యేక సంధానపదంతో భారంగా చేయకుండా, καί యొక్క చేరిక భావాన్ని ‘కూడా’తో సహజమైన కథనశైలిలో వ్యక్తం చేసింది.
- source_word: ἀπὸ μακρόθεν θεωροῦσαι
  choice: దూరం నుంచి చూస్తున్న
  rationale: దూరంగా ఉండి నిరంతరం దృశ్యాన్ని గమనిస్తున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν αἷς
  choice: వారిలో
  rationale: ముందు చెప్పిన స్త్రీల సమూహంలో ఇప్పుడు పేర్లు చెప్పబడుతున్నవారు ఉన్నారని స్పష్టంగా సూచిస్తుంది.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: మగ్దల మరియ
  rationale: ఆమెను మగ్దల ప్రాంతంతో గుర్తించే పేరును తెలుగు బైబిలు నామరూపానికి అనుగుణంగా అందిస్తుంది.
- source_word: Μαρία ἡ Ἰακώβου τοῦ μικροῦ καὶ Ἰωσῆτος μήτηρ
  choice: చిన్నవాడైన యాకోబుకు, యోసేకు తల్లి అయిన మరియ
  rationale: μήτηρ రెండు షష్ఠీ సంబంధాలకూ వర్తిస్తుందని స్పష్టంగా చూపిస్తూ, τοῦ μικροῦలోని ఉద్దేశపూర్వక అస్పష్టతను పూర్తిగా వయస్సుకు మాత్రమే పరిమితం చేయదు.
- source_word: Ἰωσῆτος
  choice: యోసే
  rationale: మూలంలోని Ἰωσῆς అనే ప్రత్యేక నామరూపాన్ని ‘యోసేపు’గా సమన్వయం చేయకుండా నిలుపుతుంది.
- source_word: Σαλώμη
  choice: సలోమే
  rationale: గ్రీకు వ్యక్తినామానికి ప్రాచుర్యంలో ఉన్న సహజమైన తెలుగు లిప్యంతరీకరణ.
theological_decisions:
- issue: τοῦ μικροῦ ద్వారా యాకోబుకు ఇచ్చిన గుర్తింపు
  choice: చిన్నవాడైన
  alternative: చిన్న యాకోబు; పిన్నవాడైన యాకోబు; అల్పుడైన యాకోబు
  rationale: μικρός వయస్సు, శరీరాకారం లేదా తక్కువ ప్రాముఖ్యతను సూచించగలదు. సందర్భం ఏ భావమో నిర్ధారించదు. అందువల్ల ప్రధాన పాఠ్యంలో సహజమైన గుర్తింపును ఇచ్చి, పాదసూచికలో అస్పష్టతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథనశైలి వాడబడింది. వ్యక్తినామాలు సుపరిచిత తెలుగు రూపాల్లో ఉన్నాయి; మూలంలోని సంబంధాలు, నామభేదం, μικρός యొక్క అస్పష్టత కాపాడబడ్డాయి.
