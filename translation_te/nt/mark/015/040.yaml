revisions:
- from: దూరం నుంచి చూస్తున్న స్త్రీలు కూడా ఉన్నారు.[a] వారిలో మగ్దల మరియ, చిన్నవాడైన[b] యాకోబుకు, యోసేకు[c] తల్లి అయిన మరియ, సలోమే ఉన్నారు.
  to: దూరం నుంచి చూస్తున్న స్త్రీలు కూడా ఉన్నారు.[a] వారిలో మగ్దలేనే మరియ, చిన్న యాకోబు, యోసేలకు తల్లియైన మరియ, సలోమే ఉన్నారు.
  rationale: The revised wording improves idiomatic Telugu and uses the familiar form “మగ్దలేనే మరియ.” “చిన్న యాకోబు” is retained with footnote b so that the source’s unresolved nuance remains explicit. Footnote c continues to preserve the source-text distinction between Joses and Joseph. Footnote anchors b and c belong immediately after “చిన్న” and “యోసే” respectively in the complete formatted text.
