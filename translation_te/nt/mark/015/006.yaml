  text: Κατὰ δὲ ἑορτὴν ἀπέλυεν αὐτοῖς ἕνα δέσμιον ⸂ὃν παρῃτοῦντο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/006.yaml
  text: At the feast he would release for them one prisoner whom they asked for[a].
translation:
  language: te
  text: పండుగ సమయంలో అతడు వారు కోరిన ఒక ఖైదీని వారి కోసం విడుదల చేసేవాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: పండుగ సమయంలో
  rationale: κατά + accusative ఇక్కడ కాలాన్ని సూచిస్తుంది. δέ స్వల్ప అనుసంధాన పదం; తెలుగులో అనవసరమైన బలమైన వ్యతిరేక భావం రాకుండా వాక్యప్రవాహంలో సహజంగా ఉంచబడింది.
- source_word: ἀπέλυεν
  choice: విడుదల చేసేవాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ ఇక్కడ గతంలో కొనసాగిన ఆచారాన్ని సూచిస్తుంది; ‘చేసేవాడు’ ఆ అలవాటైన చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτοῖς
  choice: వారి కోసం
  rationale: ఈ దత్తి రూపం విడుదల వల్ల లబ్ధి పొందే ప్రజలను సూచిస్తుంది; తెలుగులో ‘వారి కోసం’ సహజంగా ఉంటుంది.
- source_word: ἕνα δέσμιον
  choice: ఒక ఖైదీని
  rationale: ἕνα సంఖ్యను స్పష్టంగా తెలియజేస్తుంది; న్యాయపరమైన ఈ సందర్భంలో δέσμιοςకు ‘ఖైదీ’ సరైన ఆధునిక పదం.
- source_word: ὃν παρῃτοῦντο
  choice: వారు కోరిన
  rationale: παραιτέομαι ఇక్కడ ఒకరిని విడుదల చేయమని కోరడాన్ని సూచిస్తుంది. ‘వారు కోరిన’ సంక్షిప్తంగా, సహజంగా అదే భావాన్ని అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. మూలంలోని అలవాటైన గత చర్యను ‘విడుదల చేసేవాడు’ ద్వారా నిలిపాం.
