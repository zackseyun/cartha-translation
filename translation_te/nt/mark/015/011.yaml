  yaml_path: translation/nt/mark/015/011.yaml
  text: But the chief priests stirred up the crowd so that he would release Barabbas to them instead[a][b].
translation:
  language: te
  text: కాని ప్రధాన యాజకులు బరబ్బాన్నే వారికి విడుదల చేయాలని జనసమూహాన్ని రెచ్చగొట్టారు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘జనసమూహాన్ని ఉసిగొల్పారు.’ గ్రీకు క్రియ ఒక సమూహాన్ని కోరుకున్న చర్యవైపు ప్రేరేపించడం లేదా రెచ్చగొట్టడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘బరబ్బాను బదులుగా.’ సందర్భంలో సూచితమైన మరొకరికి బదులుగా బరబ్బాను విడుదల చేయాలన్నదే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: కాని
  rationale: δέ ఇక్కడ ముందున్న సందర్భంతో స్వల్ప వ్యతిరేకతను సూచిస్తుంది; ఆధునిక తెలుగులో ‘కాని’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: యెరూషలేము యాజక నాయకత్వాన్ని సూచించే ఈ బహువచనానికి ఇది ప్రామాణికమైన, స్పష్టమైన తెలుగు రూపం.
- source_word: ἀνέσεισαν
  choice: రెచ్చగొట్టారు
  rationale: జనసమూహాన్ని తాము కోరిన చర్యవైపు ప్రేరేపించడం లేదా ఉసిగొల్పడం అనే ἀνασείω భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸν ὄχλον
  choice: జనసమూహాన్ని
  rationale: ὄχλος అనే పదానికి సందర్భానుకూలమైన, సాధారణ ఆధునిక తెలుగు సమానార్థకం.
- source_word: ἵνα
  choice: విడుదల చేయాలని
  rationale: తెలుగులో ఉద్దేశార్థక పరోక్ష వాక్య నిర్మాణం ద్వారా ἵνα సూచించే ఉద్దేశాన్ని సహజంగా నిలుపుతుంది.
- source_word: μᾶλλον
  choice: బదులుగా
  rationale: సందర్భంలో సూచితమైన మరో వ్యక్తికి బదులుగా బరబ్బాను ఎంచుకోవాలనే ప్రాధాన్య భావాన్ని తెలుపుతుంది; ఈ వచనంలో లేని ‘యేసుకు’ అనే పదాన్ని చేర్చదు.
- source_word: τὸν Βαραββᾶν
  choice: బరబ్బాను
  rationale: వ్యక్తి పేరును ప్రాచుర్యంలో ఉన్న తెలుగు లిప్యంతరీకరణతో, కర్మవిభక్తితో అందిస్తుంది.
- source_word: ἀπολύσῃ
  choice: విడుదల చేయాలని
  rationale: ἵνα తరువాతి ఏఒరిస్ట్ సబ్జంక్టివ్ సూచించే ఉద్దేశిత ఫలితాన్ని సహజమైన తెలుగు పరోక్ష కోరిక రూపంలో వ్యక్తం చేస్తుంది; కర్తగా పిలాతు సందర్భం ద్వారా సూచితుడే.
- source_word: αὐτοῖς
  choice: తమకు
  rationale: విడుదల వల్ల లబ్ధి పొందే జనసమూహాన్ని సూచించే దత్తివాచక భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
