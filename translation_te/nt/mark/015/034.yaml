  terminology: “ఎలోయీ, ఎలోయీ, లెమా సబక్తానీ” preserves Mark’s form rather than harmonizing it with Matthew. “విడిచిపెట్టావు” faithfully conveys ἐγκατέλιπές με, and the Psalm 22:1 cross-reference is appropriate.
