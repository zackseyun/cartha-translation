id: MRK.15.34
reference: Mark 15:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τῇ ⸂ἐνάτῃ ὥρᾳ⸃ ἐβόησεν ὁ Ἰησοῦς φωνῇ ⸀μεγάλῃ· Ἐλωῒ ἐλωῒ ⸀λεμὰ σαβαχθάνι; ὅ ἐστιν μεθερμηνευόμενον Ὁ θεός μου ὁ θεός μου, εἰς τί ⸂ἐγκατέλιπές με⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/034.yaml
  text: And at the ninth hour Jesus cried out with a loud voice[a], “Eloi, Eloi, lema sabachthani?” which is translated, “My God, my God[c][b], for what reason have you forsaken me?”
translation:
  language: te
  text: 'తొమ్మిదవ గంటకు యేసు బిగ్గరగా కేక వేసి, “ఎలోయీ, ఎలోయీ, లెమా[a] సబక్తానీ?” అన్నాడు. దీని అనువాదం ఇలా ఉంది: “నా దేవా, నా దేవా,[b] ఏ కారణం చేత నన్ను విడిచిపెట్టావు?[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో, అలాగే అనేక ఆంగ్ల అనువాద సంప్రదాయాల్లో, ‘లెమా’కు బదులుగా ‘లామా’ అనే రూపం కనిపిస్తుంది.
    reason: textual_variant
  - marker: b
    text: యేసు పలికిన ఈ మాటలు కీర్తన 22:1ను ప్రతిధ్వనింపజేస్తాయి.
    reason: cross_reference
  - marker: c
    text: లేదా, “నన్ను ఎందుకు విడిచిపెట్టావు?”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐνάτῃ ὥρᾳ
  choice: తొమ్మిదవ గంటకు
  rationale: మార్కు ఉపయోగించిన కాలగణన వ్యక్తీకరణను మూలానికి దగ్గరగా ఉంచుతుంది; ‘మధ్యాహ్నం మూడు గంటలకు’ అని వివరణాత్మకంగా మార్చదు.
- source_word: ἐβόησεν ... φωνῇ μεγάλῃ
  choice: బిగ్గరగా కేక వేసి
  rationale: క్రియతోపాటు దాని తీవ్రతను తెలిపే పదబంధాన్నీ సహజమైన ఆధునిక తెలుగులో బలంగా వ్యక్తం చేస్తుంది.
- source_word: Ἐλωῒ ἐλωῒ λεμὰ σαβαχθάνι
  choice: ఎలోయీ, ఎలోయీ, లెమా సబక్తానీ?
  rationale: మార్కు భద్రపరచిన సెమిటిక్ పలుకులను లిప్యంతరీకరించి, ఆయన ఇచ్చిన అనువాదాన్ని వెంటనే కొనసాగిస్తుంది; మత్తయి రూపమైన ‘ఏలీ’తో సమన్వయం చేయదు.
- source_word: μεθερμηνευόμενον
  choice: దానికి అనువాదం
  rationale: సెమిటిక్ పలుకులకు గ్రీకు అర్థానువాదం ఇవ్వబడుతోందని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: εἰς τί
  choice: ఏ కారణం చేత
  rationale: ప్రశ్నలోని కారణార్థాన్ని కొంత రూపసామ్యంతో నిలుపుతుంది; సహజమైన ‘ఎందుకు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: ἐγκατέλιπές με
  choice: నన్ను విడిచిపెట్టావు
  rationale: పరిత్యాగ భావాన్ని గంభీరంగా తెలియజేస్తూ కీర్తన 22:1తో ఉన్న ప్రతిధ్వనిని నిలుపుతుంది.
theological_decisions:
- issue: యేసు పలుకులకు కీర్తన 22:1తో ఉన్న సంబంధం
  choice: పరిత్యాగాన్ని ప్రశ్నించే ప్రత్యక్ష మొరగా పాఠాన్ని ఉంచి, కీర్తన ప్రతిధ్వనిని పాదసూచికలో సూచించడం
  alternative: సిలువపై తండ్రి-కుమారుల సంబంధాన్ని ప్రధాన పాఠంలో సిద్ధాంతపరంగా వివరించడం లేదా పరిత్యాగ భావాన్ని మృదువుచేయడం
  rationale: వచనంలోని నిజమైన దైవశాస్త్ర ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది; మూలపాఠం చెప్పినదానికంటే ఎక్కువను చేర్చదు.
- issue: యేసు పలికిన సెమిటిక్ మాటల రూపం
  choice: లిప్యంతరీకృత పలుకులను ఉంచి, వెంటనే వాటి అర్థానువాదాన్ని ఇవ్వడం
  alternative: అర్థాన్ని మాత్రమే ఇవ్వడం లేదా మత్తయిలోని ‘ఏలీ, ఏలీ’ రూపానికి మార్చడం
  rationale: మార్కు ఉద్దేశపూర్వకంగా పాటించిన పలుకు-తర్వాత-అనువాదం నమూనాను కాపాడి, సువార్తల మధ్య భేదాన్ని సమన్వయం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి వాడబడింది. ‘కేక వేసి’ మరియు ‘విడిచిపెట్టావు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటాయి; ‘ఏ కారణం చేత’ మూలంలోని εἰς τί నిర్మాణాన్ని కొంత సన్నిహితంగా ప్రతిబింబిస్తుంది.
