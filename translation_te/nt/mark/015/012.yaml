id: MRK.15.12
reference: Mark 15:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ⸂πάλιν ἀποκριθεὶς ἔλεγεν⸃ αὐτοῖς· Τί οὖν ⸀θέλετε ποιήσω ⸂ὃν λέγετε⸃ ⸀τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/012.yaml
  text: Pilate answered them again[a], “Then what do you want me to do with the one you call the king of the Jews?”
translation:
  language: te
  text: 'పిలాతు మళ్లీ వారికి జవాబుగా ఇలా అన్నాడు: “అయితే, మీరు యూదుల రాజు అని పిలిచే ఇతనిని నేను ఏమి చేయాలని మీరు కోరుకుంటున్నారు?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: మళ్లీ
  rationale: కొనసాగుతున్న సంభాషణలో పిలాతు మరొకసారి మాట్లాడాడనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀποκριθεὶς ἔλεγεν
  choice: జవాబిస్తూ ... అని అడిగాడు
  rationale: కృదంతం-అసమాపక క్రియా నిర్మాణాన్ని తెలుగులో సహజమైన కథన శైలిలో అందిస్తూ, ప్రత్యక్ష ప్రశ్నను ‘అడిగాడు’తో పరిచయం చేస్తుంది.
- source_word: Τί οὖν
  choice: అయితే ... ఏమి
  rationale: మునుపటి జనసమూహపు డిమాండుకు అనుసంధానమైన తార్కిక పరిణామాన్ని తెలియజేస్తుంది.
- source_word: θέλετε
  choice: కోరుకుంటున్నారు
  rationale: ఈ సందర్భంలో వారి కోరిక లేదా అభీష్టాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ποιήσω
  choice: నేను ఏమి చేయాలని
  rationale: θέλετεతో కూడిన మొదటి పురుష ఏకవచన భావాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: ὃν λέγετε
  choice: మీరు ... అని పిలిచే ఇతనిని
  rationale: యేసుకు ఆ బిరుదును ఆపాదిస్తున్నది జనసమూహమే అనే వాక్యబలాన్ని నిలుపుతుంది; గ్రీకులో లేని అదనపు నిర్ధారణను చేర్చదు.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: యూదుల రాజు
  rationale: శ్రమానుభవ కథనంలో వాడే రాజకీయ/వర్ణనాత్మక బిరుదును ప్రామాణిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: పిలాతు యేసు రాజత్వాన్ని స్వయంగా అంగీకరిస్తున్నాడా, లేక జనసమూహం ఉపయోగించే బిరుదును ప్రతిధ్వనిస్తున్నాడా
  choice: ‘మీరు యూదుల రాజు అని పిలిచే ఇతనిని’ అని అనువదించి, ఆ బిరుదును జనసమూహపు మాటగానే ఉంచడం
  alternative: ‘యూదుల రాజు అని మీరు చెప్పే ఇతనిని’
  rationale: ὃν λέγετε అనే సంబంధ వాక్యం ‘మీరు’ అనే అంశాన్ని ముందుకు తెస్తుంది. అందువల్ల పిలాతు స్వయంగా రాజత్వాన్ని ఒప్పుకున్నాడని గానీ తిరస్కరించాడని గానీ అనువాదం నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగానూ, న్యాయవిచారణ సందర్భానికి తగిన గంభీరతతోనూ రూపొందించబడింది.
