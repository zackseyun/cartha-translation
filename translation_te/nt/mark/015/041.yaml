  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀αἳ ὅτε ἦν ἐν τῇ Γαλιλαίᾳ ἠκολούθουν αὐτῷ καὶ διηκόνουν αὐτῷ, καὶ ἄλλαι πολλαὶ αἱ συναναβᾶσαι αὐτῷ εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/041.yaml
  text: These women[a], when he was in Galilee, used to follow him and minister to him[b]; and there were many other women who had gone up with him to Jerusalem.
translation:
  language: te
  text: ఆయన గలిలయలో ఉన్నప్పుడు, ఈ స్త్రీలు ఆయనను అనుసరిస్తూ ఆయనకు సేవ చేసేవారు[a]. ఆయనతో కలిసి యెరూషలేముకు వెళ్లిన ఇతర అనేక స్త్రీలు కూడా ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన అవసరాలు చూసుకునేవారు.’ గ్రీకు క్రియ ఆచరణాత్మక సేవను లేదా సహాయాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἳ
  choice: ఈ స్త్రీలు
  rationale: ఈ సంబంధవాచక సర్వనామం ముందటి వచనంలో పేర్కొన్న స్త్రీలను సూచిస్తుంది. తెలుగులో స్వతంత్ర వాక్యంగా సహజంగా ఉండేందుకు ‘ఈ స్త్రీలు’ అని అనువదించాం.
- source_word: ὅτε ἦν ἐν τῇ Γαλιλαίᾳ
  choice: ఆయన గలిలయలో ఉన్నప్పుడు
  rationale: కాలసూచక ఉపవాక్యాన్ని సరళంగా, మూలంలోని స్థలసూచనను యథాతథంగా ఉంచుతూ అనువదించాం.
- source_word: ἠκολούθουν
  choice: అనుసరిస్తూ ... చేసేవారు
  rationale: అసంపూర్ణ భూతకాల రూపం గతంలో అలవాటుగా లేదా కొనసాగుతూ జరిగిన క్రియను సూచిస్తుంది; తెలుగు సంయుక్త నిర్మాణంలో ‘అనుసరిస్తూ ... చేసేవారు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: διηκόνουν
  choice: సేవ చేసేవారు
  rationale: ఈ క్రియ ఆచరణాత్మక పరిచర్య, సహాయం లేదా పోషణను సూచించగలదు. ‘సేవ చేసేవారు’ దాని విస్తృతార్థాన్ని నిలుపుతూ, తరువాతి సంఘపదవిని ఇందులోకి దిగుమతి చేయదు.
- source_word: ἄλλαι πολλαὶ
  choice: అనేకమంది ఇతర స్త్రీలు
  rationale: స్త్రీలనే సూచిస్తున్నది సందర్భంలో స్పష్టమైనందున తెలుగులో ‘స్త్రీలు’ అని వ్యక్తంగా చేర్చడం సహజం.
- source_word: αἱ συναναβᾶσαι αὐτῷ
  choice: ఆయనతో కలిసి ... వెళ్లిన
  rationale: క్రియావిశేషణ రూపం ప్రధాన సందర్భానికి ముందే జరిగిన సహప్రయాణాన్ని సూచిస్తుంది. ‘కలిసి వెళ్లిన’ అనే రూపం ఆ భావాన్ని స్పష్టంగా అందిస్తుంది; ‘పైకి వెళ్లిన’ అనే మూల నుడికారాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: εἰς Ἱεροσόλυμα
  choice: యెరూషలేముకు
  rationale: పట్టణాన్ని గమ్యస్థానంగా సూచించే εἰςకు సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: διηκόνουν సూచించే స్త్రీల సేవ స్వభావం
  choice: ఆయనకు సేవ చేసేవారు
  alternative: ఆయనకు పరిచర్య చేసేవారు / ఆయన అవసరాలు చూసుకునేవారు
  rationale: ‘సేవ చేసేవారు’ ఆచరణాత్మక సహాయం, సంరక్షణ, పోషణ వంటి అర్థవిస్తృతిని నిలుపుతుంది; దాన్ని కేవలం ఇంటిపనిగా కుదించదు, అలాగే తరువాతి కాలపు సంఘపదవిని సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. అపూర్ణ భూతకాలంలోని అలవాటు/కొనసాగింపు భావాన్ని ‘అనుసరిస్తూ ... సేవ చేసేవారు’తో తెలిపాం. మూలంలోని యెరూషలేముకు ‘పైకి వెళ్లడం’ అనే నుడికారాన్ని ప్రధాన వాక్యంలో సహజీకరించి, పాదటిప్పణిలో భద్రపరిచాం.
