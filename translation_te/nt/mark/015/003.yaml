lexical_decisions:
- source_word: καὶ
  choice: (ప్రత్యేకంగా అనువదించలేదు)
  rationale: తెలుగు కథన ప్రవాహంలో ముందరి వాక్యంతో అనుసంధానం సహజంగానే స్పష్టమవుతుంది; ‘మరియు’ అని పెట్టడం ఇక్కడ కృత్రిమంగా ఉంటుంది.
- source_word: κατηγόρουν
  choice: నేరాలు మోపుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న లేదా పదేపదే జరిగిన ఆరోపణను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: αὐτοῦ
  choice: ఆయన మీద
  rationale: κατηγορέωతో వచ్చిన సంబంధ విభక్తి ఆరోపణకు గురైన వ్యక్తిని సూచిస్తుంది; తెలుగులో ‘మీద’ సహజమైన ప్రయోగం.
- source_word: οἱ ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: ఇది అనేకమంది మహాయాజకులు అని కాక, యాజక వర్గంలోని ప్రముఖ అధికారులను సూచించే స్థిరమైన పదబంధం.
- source_word: πολλά
  choice: అనేక నేరాలు
  rationale: అనేక విషయాలపై ఆరోపణలు చేశారనే భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; అధికారిక న్యాయాభియోగాలనే తప్పనిసరిగా సూచించదు.
