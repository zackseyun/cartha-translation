source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ κεντυρίων ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ ὅτι ⸀οὕτως ἐξέπνευσεν εἶπεν· Ἀληθῶς ⸂οὗτος ὁ ἄνθρωπος⸃ υἱὸς ⸂θεοῦ ἦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/039.yaml
  text: When the centurion[a], who was standing opposite him, saw that he breathed his last in this way, he said, “Truly this man was God's Son.”
translation:
  language: te
  text: ఆయనకు ఎదురుగా నిలబడి ఉన్న శతాధిపతి, ఆయన ఈ విధంగా తుదిశ్వాస విడిచాడని చూసి, “నిజంగా ఈ మనిషి దేవుని కుమారుడు[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవుని కుమారుల్లో ఒకడు.” గ్రీకు పదబంధాన్ని గుణాత్మకంగానూ అనిర్దిష్టంగానూ అర్థం చేసుకోవచ్చు; అయితే మార్కు సువార్త సందర్భంలో అది “దేవుని కుమారుడు” అనే బిరుదు బలాన్ని కలిగి ఉండే అవకాశం ఎక్కువ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: చూసి
  rationale: ఆరిస్ట్ పార్టిసిపిల్ ἰδών ఇక్కడ ప్రధాన క్రియకు ముందున్న గ్రహింపును తెలియజేస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘చూసి’ సహజంగా ఆ కాలసంబంధాన్ని వ్యక్తం చేస్తుంది; δέ స్వల్ప అనుసంధానక పదం కాబట్టి ప్రత్యేక విరోధార్థక పదం అవసరం లేదు.
- source_word: κεντυρίων
  choice: శతాధిపతి
  rationale: రోమా సైనిక హోదాను సూచించే κεντυρίωνకు తెలుగు బైబిలు వాడుకలో స్థిరపడిన, సంక్షిప్తమైన సమానార్థకం.
- source_word: ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ
  choice: ఆయనకు ఎదురుగా నిలబడి ఉన్న
  rationale: παρεστηκώς సూచించే అప్పటికే కొనసాగుతున్న నిలబడిన స్థితినీ, ἐξ ἐναντίας సూచించే ఎదురుగా ఉన్న స్థానాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὅτι οὕτως ἐξέπνευσεν
  choice: ఆయన ఈ విధంగా తుదిశ్వాస విడిచినది
  rationale: ἐκπνέωలోని శ్వాస విడవడం అనే సజీవ రూపకాన్ని ‘తుదిశ్వాస విడిచాడు’ నిలుపుతుంది; οὕτωςను ‘ఈ విధంగా’ అని స్పష్టంగా అనువదించి, శతాధిపతి స్పందన యేసు మరణించిన తీరుకు సంబంధించినదని చూపుతుంది.
- source_word: Ἀληθῶς
  choice: నిజంగా
  rationale: ἀληθῶς యొక్క దృఢమైన, గంభీరమైన నిర్ధారణను ఆధునిక ప్రమాణ తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: ఈ మనిషి
  rationale: యేసును నిర్దిష్టమైన మానవ వ్యక్తిగా సూచించే గ్రీకు పదబంధాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: υἱὸς θεοῦ
  choice: దేవుని కుమారుడు
  rationale: గ్రీకులో ఆర్టికల్ లేకపోయినా, మార్కు సువార్త కథన సందర్భంలో ఇది గుణాత్మకంగా లేదా నిర్దిష్ట బిరుదుగా వినిపించగలదు. తెలుగు ‘దేవుని కుమారుడు’ మూలంలోని రూపాన్ని అనవసరంగా ‘ఆ’ అనే నిర్దిష్ట సూచకంతో బలపరచకుండా బిరుదు బలాన్ని నిలుపుతుంది.
- source_word: ἦν
  choice: అన్నాడు అనే ఉద్ధరణలో నామవాక్యంగా సహజీకరించబడింది
  rationale: గ్రీకులోని భూతకాల ἦνను తెలుగులో యథాతథంగా ‘ఉండెను’ అని పెడితే ఉద్ధరణ అసహజంగా ఉంటుంది. ‘ఈ మనిషి దేవుని కుమారుడు’ అనే తెలుగు నామవాక్యం, దానిని పరిచయం చేసే భూతకాల ‘అన్నాడు’తో కలిసి మూల ప్రకటనను సహజంగా అందిస్తుంది; ఇది ‘కుమారుడై ఉండేవాడు’ అనే ముగిసిపోయిన స్థితిని సూచించదు.
theological_decisions:
- issue: υἱὸς θεοῦ యొక్క నిర్దిష్ట/గుణాత్మక లేదా అనిర్దిష్ట భావం
  choice: దేవుని కుమారుడు
  alternative: దేవుని కుమారుల్లో ఒకడు
  rationale: ఆర్టికల్ లేని గ్రీకు పదబంధం గుణాత్మకంగా లేదా అనిర్దిష్టంగా అర్థమయ్యే వ్యాకరణ అవకాశాన్ని కలిగి ఉంది. అయితే మార్కు సువార్తలో ‘దేవుని కుమారుడు’ క్రీస్తు సంబంధమైన ప్రధాన బిరుదుగా పనిచేస్తుంది. ప్రధాన పాఠం ఆ కథన బలాన్ని నిలుపుతుంది; నిజమైన భాషాత్మక సందిగ్ధతను పాదటీకలో తెలియజేస్తుంది.
- issue: ἦν అనే భూతకాల క్రియకు తెలుగు రూపం
  choice: నామవాక్యంలో ప్రత్యేక కాలసూచక క్రియను చేర్చకుండా, ‘అన్నాడు’ ద్వారా గత ఉద్ధరణగా వ్యక్తీకరించడం
  alternative: ఈ మనిషి దేవుని కుమారుడై ఉండేవాడు
  rationale: ప్రత్యామ్నాయ తెలుగు రూపం కుమారత్వం ఇక లేదనే అనుచిత భావాన్ని కలిగించవచ్చు. మూలంలోని భూతకాలాన్ని సిద్ధాంతపరంగా వర్తమానంగా మార్చకుండానే, సహజ తెలుగు ప్రత్యక్షోక్తి నిర్మాణం దాని సందర్భకాలాన్ని మోస్తుంది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగులో సహజమైనప్పటికీ గంభీరమైన కథన శైలి. ‘శతాధిపతి’ వంటి స్థిరపడిన బైబిలు-చారిత్రక పదాన్ని ఉంచి, ‘తుదిశ్వాస విడిచినది’ ద్వారా మూలంలోని దృశ్య బలాన్ని కాపాడాం. ప్రధాన పాఠంలోని ప్రతి పాదటీక సూచిక సరైన స్థానంలో [a]గా ఇవ్వబడింది.
