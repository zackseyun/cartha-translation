  naturalness: ‘శతాధిపతి,’ ‘ఎదురుగా నిలబడి ఉన్న,’ ‘నిజంగా’ ఆధునిక ప్రమాణ తెలుగు గంభీర కథనశైలికి అనుకూలంగా ఉన్నాయి. ప్రధాన సవరణ ఉపవాక్యాన్ని సహజంగా చేయడమే. ఉద్ధరణలో తెలుగు నామవాక్యం సహజమైనదే; అక్కడ ప్రత్యేకంగా ‘ఉండెను’ చేర్చడం అవసరం లేదు మరియు అది అనవసరమైన ముగిసిన-స్థితి భావాన్ని కలిగించవచ్చు.
