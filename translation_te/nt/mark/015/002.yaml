source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησεν αὐτὸν ὁ Πιλᾶτος· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς ⸂αὐτῷ λέγει⸃· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/002.yaml
  text: And Pilate asked him[a], “Are you the king of the Jews?” And he answered him[b], “You say so.”
translation:
  language: te
  text: పిలాతు ఆయనను, “నీవు యూదుల రాజువా?”[a] అని అడిగాడు. ఆయన అతనికి, “నీవు అంటున్నావు” అని జవాబిచ్చాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యూదయవాసుల రాజువా?” ఇక్కడ “యూదుల రాజు” అనే మాట పిలాతు ఎదుట మోపబడిన సాధారణ రాజకీయ ఆరోపణను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “నీవు అంటున్నావు”; లేదా భావాన్ని కొంచెం విప్పి, “అది నీవు అన్న మాట.” యేసు జవాబు సంక్షిప్తంగా ఉండి, కొంత అస్పష్టతను నిలుపుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: అడిగాడు
  rationale: ఈ క్రియకు ‘అడిగాడు/ప్రశ్నించాడు’ అనే అర్థం ఉంది. సందర్భంలో న్యాయవిచారణ ఉన్నప్పటికీ, గ్రీకు పదం సూచించేదానికంటే అధిక బలాన్ని చేర్చకుండా సహజమైన తెలుగులో ‘అడిగాడు’ అని అనువదించాం.
- source_word: Σὺ εἶ
  choice: నీవు ... వా?
  rationale: ప్రత్యక్ష ప్రశ్నను సహజమైన తెలుగు ప్రశ్నారూపంలో ఇచ్చాం; వ్యక్తమైన సర్వనామంలోని నొక్కిచెప్పే భావాన్ని ‘నీవు’ నిలుపుతుంది.
- source_word: βασιλεὺς
  choice: రాజు
  rationale: రాజరిక మరియు రాజకీయ ఆరోపణ రెండింటినీ నిలిపే సాధారణ, నిర్దిష్ట సమానార్థకం.
- source_word: Ἰουδαίων
  choice: యూదుల
  rationale: ఈ శ్రమకథ సందర్భంలో ‘యూదుల రాజు’ అనేది పిలాతు ఎదుట మోపబడిన స్థిరమైన రాజకీయ ఆరోపణను ప్రతిబింబిస్తుంది. ‘యూదయవాసుల’ అనేది సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: ἀποκριθεὶς αὐτῷ λέγει
  choice: అందుకు ఆయన అతనితో ... అని జవాబిచ్చాడు
  rationale: గ్రీకులోని సమాధాన క్రియను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేశాం. మార్కు వాడిన చారిత్రక వర్తమానాన్ని తెలుగులో అసహజత రాకుండా కథన భూతకాలంగా ఇచ్చాం.
- source_word: Σὺ λέγεις
  choice: నీవే అంటున్నావు
  rationale: మూలంలోని సంక్షిప్తతను, పిలాతు పలికిన మాటలపైనే బాధ్యత ఉంచే ధోరణిని, అది సంపూర్ణ అంగీకారమా కాదా అనే అస్పష్టతను నిలుపుతుంది.
theological_decisions:
- issue: Σὺ λέγεις అనే యేసు జవాబు యొక్క భావబలం
  choice: నీవే అంటున్నావు
  alternative: అవును, నీవు అన్నట్టే; లేదా మరింత అక్షరార్థంగా ‘నీవు అంటున్నావు’
  rationale: గ్రీకు పాఠ్యంలో స్పష్టమైన ‘అవును’ లేదు. కాబట్టి దీనిని సంపూర్ణ అంగీకారంగా గానీ తిరస్కారంగా గానీ నిర్ణయించకుండా, ఉద్దేశపూర్వకంగా సంక్షిప్తంగా ఉన్న అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. ‘ఆయన’ ద్వారా యేసుకు సాధారణ గౌరవప్రయోగాన్ని ఉంచాం; మూలంలో లేని నిర్దిష్ట సిద్ధాంతార్థాన్ని చేర్చలేదు. పాదసూచిక గుర్తులను సంబంధిత వాక్యాల వెంట ఉంచాం.
