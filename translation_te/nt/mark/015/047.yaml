- from: మగ్దల మరియ, యోసేకు చెందిన మరియ[a] ఆయనను ఎక్కడ ఉంచారో గమనిస్తూ ఉన్నారు.
  to: మగ్దల మరియ, యోసేతో సంబంధమున్న మరియ కూడా ఆయనను ఎక్కడ ఉంచారో గమనిస్తూ ఉన్నారు.[a]
  rationale: Revised the second Mary’s designation to a natural Telugu relational expression that does not imply possession and does not add ‘mother’ to the main text. The footnote preserves the Greek ellipsis while noting the contextual basis for the maternal identification. Added “కూడా” to convey the mild connective/coordinating force without introducing a strong contrast.
