  text: ἡ δὲ Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸂ἡ Ἰωσῆτος⸃ ἐθεώρουν ποῦ ⸀τέθειται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/047.yaml
  text: And Mary Magdalene and Mary the mother of Joses were watching where he was laid[a].
translation:
  language: te
  text: మగ్దల మరియ, యోసేతో సంబంధమున్న మరియ కూడా ఆయనను ఎక్కడ ఉంచారో గమనిస్తూ ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘యోసే యొక్క మరియ’ లేదా ‘యోసేతో సంబంధమున్న మరియ.’ గ్రీకులో సంబంధం స్పష్టంగా చెప్పబడలేదు; అయితే మార్కు 15:40 సందర్భంలో ఈమెను యోసే తల్లిగా గుర్తించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించకుండా వాక్యప్రవాహంలో చూపించడం
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక, సమాధి కథనాన్ని కొనసాగించే స్వల్ప సంధిని సూచిస్తుంది. తెలుగులో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండానే సహజమైన కొనసాగింపు వస్తుంది.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: మగ్దల మరియ
  rationale: మరియను మగ్దల ప్రాంతంతో గుర్తించే సహజమైన, ప్రామాణిక తెలుగు రూపం.
- source_word: Μαρία ἡ Ἰωσῆτος
  choice: యోసేకు చెందిన మరియ
  rationale: గ్రీకులోని సంబంధార్థక షష్ఠీ విభక్తి సంబంధాన్ని మాత్రమే తెలియజేస్తుంది; ‘తల్లి’ అని ప్రధాన పాఠంలో స్పష్టీకరించకుండా అసలు వాక్యంలోని సంక్షిప్తతను, అస్పష్టతను నిలుపుతుంది.
- source_word: ἐθεώρουν
  choice: గమనిస్తూ ఉన్నారు
  rationale: అపరిణత భూతకాల రూపం గతంలో కొనసాగుతున్న శ్రద్ధగల పరిశీలనను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ దురేటివ్ భావాన్ని నిలుపుతుంది.
- source_word: ποῦ
  choice: ఎక్కడ
  rationale: స్థలాన్ని సూచించే ప్రత్యక్ష ప్రశ్నార్థక క్రియావిశేషణానికి సహజమైన తెలుగు సమానం.
- source_word: τέθειται
  choice: ఆయనను ... ఉంచారో
  rationale: τίθημι యొక్క పరిపూర్ణ కర్మణి రూపం ఉంచబడిన చర్యతో పాటు దాని ఫలితస్థితిని సూచిస్తుంది. సందర్భంలో అంతర్లీన కర్మ యేసు కాబట్టి గౌరవార్థక ‘ఆయనను’ స్పష్టంగా చేర్చబడింది.
theological_decisions:
- issue: కర్మణి క్రియలో అంతర్లీనంగా ఉన్న కర్మ
  choice: ‘ఆయనను’ అని స్పష్టంగా చేర్చడం
  alternative: కర్మను పేర్కొనకుండా ‘ఎక్కడ ఉంచారో’ అనడం లేదా ‘దేహాన్ని’ అని అనడం
  rationale: గ్రీకులో సందర్భం వల్ల యేసు సూచించబడుతున్నాడు. తెలుగులో స్పష్టత కోసం ‘ఆయనను’ చేర్చడం సహజం; ‘దేహాన్ని’ అనడం మూలంలో లేని వస్తువీకరణను తెస్తుంది.
- issue: యోసేతో మరియకు ఉన్న సంబంధం
  choice: ప్రధాన పాఠంలో ‘యోసేకు చెందిన మరియ’ అని సంబంధాన్ని తెరిచి ఉంచడం
  alternative: ‘యోసే తల్లి మరియ’ అని స్పష్టీకరించడం
  rationale: మార్కు సందర్భం తల్లి సంబంధాన్ని బలంగా సూచించినప్పటికీ, ఈ వచనంలోని గ్రీకు స్వయంగా ‘తల్లి’ అనే పదాన్ని ఉపయోగించదు. కాబట్టి అసలు సంక్షిప్త సంబంధవ్యక్తీకరణను ప్రధాన పాఠంలో నిలిపి, సాధ్యమైన వివరణను పాదటీకలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. గ్రీకు అపరిణత కాలంలోని కొనసాగుతున్న గమనింపును ‘గమనిస్తూ ఉన్నారు’తో, పరిపూర్ణ కర్మణి భావాన్ని సహజ తెలుగు ‘ఉంచారో’తో వ్యక్తం చేసింది. సంబంధార్థక గ్రీకు నిర్మాణంలోని నిజమైన అస్పష్టతను పాదటీకతో సంరక్షించింది.
