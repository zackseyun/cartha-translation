  revision_rationale: The revision retains the imperfect force of ἔλεγεν with ‘అడుగుతూనే ఉన్నాడు,’ renders the γάρ-question idiom naturally as a challenge to identify the alleged evil, represents περισσῶς ἔκραξαν as an intensified outcry, and uses idiomatic Telugu for the crowd’s imperative to Pilate. The footnote is retained as a lexical alternative for κακόν.
