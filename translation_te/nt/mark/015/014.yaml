source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ἔλεγεν αὐτοῖς· Τί γὰρ ⸂ἐποίησεν κακόν⸃; οἱ δὲ ⸀περισσῶς ἔκραξαν· Σταύρωσον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/014.yaml
  text: But Pilate was saying to them[a], “For what evil has he done?” But they cried out all the more, “Crucify him!”
translation:
  language: te
  text: 'కానీ పిలాతు వారితో ఇలా అడుగుతూనే ఉన్నాడు: “ఇతడు ఏ చెడు చేశాడని?” కానీ వారు ఇంకా బిగ్గరగా కేకలు వేశారు: “అతణ్ణి సిలువ వేయించు!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: అడుగుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ పిలాతు మాట కొనసాగిందని సూచిస్తుంది. తెలుగులో ప్రశ్న సందర్భానికి సహజంగా ఉండే ‘అడుగుతూ ఉన్నాడు’ ఆ కొనసాగుతున్న భావాన్ని అనవసరంగా పునరావృతిగా నిర్ధారించకుండా వ్యక్తపరుస్తుంది.
- source_word: Τί γὰρ ἐποίησεν κακόν
  choice: ఎందుకు? ఇతడు ఏ చెడు చేశాడు?
  rationale: γάρ ఇక్కడ జనసమూహపు డిమాండుకు కారణం అడిగే ప్రశ్నను ప్రవేశపెడుతుంది; ‘ఎందుకు?’ దాని సంభాషణాత్మక బలాన్ని చూపుతుంది. ‘ఏ చెడు చేశాడు?’ κακόν యొక్క నైతిక బలాన్ని నిలుపుతుంది.
- source_word: κακόν
  choice: చెడు
  rationale: ‘చెడు’ అనేది κακόν లోని నైతిక బలాన్ని ‘తప్పు’ కంటే ప్రత్యక్షంగా నిలుపుతుంది; అదే సమయంలో అదనపు న్యాయ లేదా సిద్ధాంతార్థాన్ని చేర్చదు.
- source_word: περισσῶς
  choice: ఇంకా ఎక్కువగా
  rationale: జనసమూహపు ప్రతిస్పందన మరింత తీవ్రమైందనే తులనాత్మక ఉద్ధృతిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἔκραξαν
  choice: కేకలు వేస్తూ … అన్నారు
  rationale: κράζω సూచించే బిగ్గర బహిరంగ అరుపును ‘కేకలు వేస్తూ’ స్పష్టంగా తెలియజేస్తుంది; ‘అన్నారు’ ద్వారా వారి మాటను సహజంగా పరిచయం చేస్తుంది.
- source_word: Σταύρωσον αὐτόν
  choice: అతణ్ణి సిలువ వేయి!
  rationale: ఏకవచన ఆజ్ఞారూపాన్ని, పిలాతును నేరుగా ఉద్దేశించిన తీవ్ర డిమాండును నిలుపుతుంది; కారక రూపమైన ‘వేయించు’ను చేర్చి మూలంలోని ప్రత్యక్ష ఆజ్ఞను మార్చలేదు.
- source_word: δὲ
  choice: అయితే / కానీ
  rationale: మొదటి δέ సందర్భ మార్పుతో కూడిన వ్యత్యాసాన్ని ‘అయితే’గా, రెండవది పిలాతు ప్రశ్నకు జనసమూహపు విరుద్ధ ప్రతిస్పందనను ‘కానీ’గా సహజంగా చూపుతుంది.
- source_word: Πιλᾶτος
  choice: పిలాతు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన పేరురూపాన్ని ఉపయోగించింది.
theological_decisions:
- issue: పిలాతు ప్రశ్నలో κακόν యొక్క నైతిక బలం
  choice: ‘చెడు’గా అనువదించడం
  alternative: ‘తప్పు’గా అనువదించడం
  rationale: ఈ సందర్భం న్యాయపరమైన ఆరోపణతో పాటు నైతిక ప్రశ్నను కూడా కలిగి ఉంది. ‘చెడు’ మూలపదపు బలాన్ని తగ్గించకుండా ఉంచుతుంది; యేసు గురించి అదనపు సిద్ధాంత ప్రకటనను అనువాదంలో చేర్చదు.
- issue: Σταύρωσον లోని ప్రత్యక్ష ఆజ్ఞ
  choice: ‘సిలువ వేయి’
  alternative: ‘సిలువ వేయించు’
  rationale: మూల గ్రీకులో పిలాతుకు ఇచ్చిన ప్రత్యక్ష ఏకవచన ఆజ్ఞ ఉంది. ‘వేయించు’ చారిత్రక కార్యనిర్వహణను స్పష్టం చేసినా, మూలంలో లేని కారక నిర్మాణాన్ని చేర్చుతుంది; అందువల్ల ప్రత్యక్ష రూపాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, కానీ న్యాయ విచారణలోని గంభీరత మరియు జనసమూహపు తీవ్రత నిలిచేలా రూపొందించబడింది. ‘అతణ్ణి’ సాధారణ ఆధునిక రూపం; ‘సిలువ వేయి’ ప్రత్యక్షమైన, ఉద్ధృత ఆజ్ఞ.
