source:
  edition: SBLGNT
  text: Καὶ ἀγγαρεύουσιν παράγοντά τινα Σίμωνα Κυρηναῖον ἐρχόμενον ἀπ’ ἀγροῦ, τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου, ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/021.yaml
  text: And they compelled a certain passerby[a], Simon of Cyrene, who was coming from the country, the father of Alexander and Rufus[c][b], to carry his cross.
translation:
  language: te
  text: వారు పల్లెప్రాంతం నుంచి వస్తున్న కురేనేకు చెందిన సీమోను అనే ఒక వ్యక్తిని[a]—అలెగ్జాండరు, రూఫుల తండ్రిని—అతడు అటుగా వెళ్తున్నప్పుడు, యేసు సిలువను[c] మోయడానికి బలవంతపెట్టారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పొలం నుంచి వస్తున్న’ అని కూడా అనువదించవచ్చు; మూలపదానికి ‘పొలం,’ ‘పల్లెప్రాంతం’ అనే రెండు భావాలూ ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘బలవంతపెట్టారు’ అని అనువదించిన గ్రీకు క్రియ, అధికారంతో ఒకరిని బలవంతపు సేవకు నియమించడాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: కొందరు దీనిని మరింత నిర్దిష్టంగా ‘సిలువ అడ్డకొయ్య’ అని అర్థం చేసుకుంటారు; అయితే గ్రీకు పాఠం ‘సిలువ’ అని మాత్రమే చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγαρεύουσιν
  choice: బలవంతపెట్టారు
  rationale: ఈ క్రియ బలవంతపు సేవకు నియమించడాన్ని సూచిస్తుంది; కేవలం అడగడం లేదా స్వచ్ఛందంగా సహాయం కోరడం అనే భావాన్ని ఇవ్వదు.
- source_word: παράγοντά τινα
  choice: అటుగా వెళ్తున్న ... ఒక వ్యక్తిని
  rationale: παράγοντα అటుగా వెళ్తున్న వ్యక్తిని, τινα నిర్దిష్టంగా పరిచయం చేయని ఒక వ్యక్తిని సూచిస్తాయి. ఈ తెలుగు నిర్మాణం రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: Σίμωνα Κυρηναῖον
  choice: కురేనీయుడైన సీమోను
  rationale: వ్యక్తి పేరును సీమోను అని లిప్యంతరీకరించి, Κυρηναῖονను అతని భౌగోళిక గుర్తింపుగా ‘కురేనీయుడు’ అని ఇచ్చాం.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: పల్లెప్రాంతం నుంచి వస్తూ
  rationale: ἀγρόςకు పొలం, గ్రామీణ ప్రాంతం, పట్టణం వెలుపలి ప్రాంతం అనే అర్థాలు ఉండవచ్చు. సందర్భంలో అతిగా నిర్దిష్టం చేయకుండా ‘పల్లెప్రాంతం’ సహజమైన విస్తృత భావాన్ని ఇస్తుంది.
- source_word: τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου
  choice: అలెక్సాందరు, రూఫు తండ్రిని
  rationale: సీమోనును గుర్తించే మూలపాఠంలోని సమానాధికార వివరణను వ్యాఖ్యానం జోడించకుండా నేరుగా నిలిపాం.
- source_word: ἵνα ἄρῃ
  choice: మోయాలని
  rationale: ἵνα మరియు ఉపవిధ్యర్థక క్రియ ఇక్కడ ఉద్దేశాన్ని తెలియజేస్తాయి. బలవంతపెట్టారు అనే క్రియతో ‘మోయాలని’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: σταυρὸν
  choice: సిలువను
  rationale: మూలపదం సాధారణంగా ‘సిలువ’ను సూచిస్తుంది. చారిత్రకంగా అడ్డకొయ్యను మాత్రమే మోసి ఉండవచ్చనే అభిప్రాయాన్ని ప్రధాన పాఠంలో చేర్చి అర్థాన్ని కుదించలేదు.
- source_word: αὐτοῦ
  choice: ఆయన
  rationale: సందర్భంలో ఈ సర్వనామం యేసును సూచిస్తుంది. మూలంలోని సర్వనామ రూపాన్ని నిలుపుతూ తెలుగులో గౌరవప్రదంగా ‘ఆయన’ అని ఇచ్చాం.
theological_decisions:
- issue: సీమోనుపై విధించిన బలవంతపు సేవ స్వభావం
  choice: సీమోను సిలువ మోయాలని బలవంతపెట్టబడ్డాడు.
  alternative: అతనిని కేవలం అడిగారు లేదా స్వచ్ఛందంగా సేవకు తీసుకున్నారు.
  rationale: ἀγγαρεύω బలవంతపు సేవ లేదా అధికారిక నిర్బంధ నియామకాన్ని సూచిస్తుంది; అందువల్ల ఆ బలవంతపు స్వభావాన్ని అనువాదంలో నిలిపాం.
- issue: సీమోను మోసిన వస్తువు ఎంత నిర్దిష్టంగా చెప్పాలి
  choice: సిలువ
  alternative: సిలువ అడ్డకొయ్య
  rationale: చారిత్రక పునర్నిర్మాణాల్లో అడ్డకొయ్య అని భావించినా, గ్రీకు పాఠంలో σταυρός మాత్రమే ఉంది. కాబట్టి మూలపాఠం కంటే అర్థాన్ని కుదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘అటుగా వెళ్తున్న’ అనే మాటతో యాదృచ్ఛికంగా దారిన వెళ్తున్న భావాన్ని, ‘బలవంతపెట్టారు’తో నిర్బంధ సేవ భావాన్ని స్పష్టంగా ఉంచాం. ἀγρόςలోని నిజమైన పదార్థ సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
