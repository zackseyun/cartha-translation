  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గంభీరమైన కథన శైలి. జనసమూహపు గట్టి ఆజ్ఞను ప్రత్యక్ష ఉల్లేఖనంగా నిలిపింది.
