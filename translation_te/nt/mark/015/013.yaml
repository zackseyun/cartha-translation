translation:
  language: te
  text: కాని వారు మళ్లీ, “అతణ్ణి సిలువ వేయించు!” అని కేకలు వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ
  choice: వారు
  rationale: నామవాచకంగా వాడిన బహువచన నిర్దేశక పదం, ముందటి సందర్భంలో ఉన్న సమూహాన్ని సూచిస్తుంది. తెలుగులో సహజంగా ‘వారు’ అని వ్యక్తం చేయబడింది.
- source_word: δὲ
  choice: కాని
  rationale: పిలాతు మునుపు అడిగిన ప్రశ్నకు వారి ప్రతిస్పందనలో ఉన్న స్వల్ప వ్యతిరేక భావాన్ని ‘కాని’ సహజంగా తెలియజేస్తుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: కేకను పునరావృతం చేశారనే కథన ప్రాధాన్యాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: ἔκραξαν
  choice: కేకలు వేశారు
  rationale: κράζω సూచించే బిగ్గరగా అరవడాన్ని ఆధునిక తెలుగులో సహజంగా, తీవ్రత తగ్గకుండా వ్యక్తం చేస్తుంది.
- source_word: Σταύρωσον
  choice: సిలువ వేయించు
  rationale: ఇది పిలాతును ఉద్దేశించిన ఏకవచన ఆజ్ఞ. గ్రీకులో వ్యాకరణపరంగా కర్తృవాచక ఆజ్ఞ ఉన్నప్పటికీ, శిక్షను అధికారిగా అమలు చేయించాలనే సందర్భార్థాన్ని తెలుగులో ‘సిలువ వేయించు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτόν
  choice: అతణ్ణి
  rationale: యేసును సూచించే ప్రత్యక్ష కర్మ సర్వనామాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
