  text: καὶ ἤρξαντο ἀσπάζεσθαι αὐτόν· Χαῖρε, ⸀βασιλεῦ τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/018.yaml
  text: 'And they began to salute him: “Hail[b][a], King of the Jews!”'
translation:
  language: te
  text: 'మరియు వారు ఆయనకు వందనం[a] చేయసాగారు: “జయం[b], యూదుల రాజా!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పలకరించడం.” గ్రీకు క్రియ సాధారణ పలకరింపును సూచించగలదు; అయితే ఇక్కడ అది ఎగతాళిగా చేసే లాంఛనప్రాయ రాజవందనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నమస్కారం.” గ్రీకు అభివందనం సాధారణ పలకరింపుగా కూడా వాడబడుతుంది; ఇక్కడ అది రాజును ఉద్దేశించిన వందననినాదంగా, ఎగతాళి స్వరంతో వినిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: అప్పుడు
  rationale: మార్కు వాడిన సరళ అనుసంధానాన్ని తెలుగులో సహజమైన కథన ప్రవాహంతో తెలియజేస్తుంది; ఇది అదనపు కారణార్థాన్ని చేర్చదు.
- source_word: ἤρξαντο
  choice: మొదలుపెట్టి
  rationale: అనంతక్రియతో వచ్చిన ἄρχομαι యొక్క ఆరంభార్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἀσπάζεσθαι
  choice: వందనం చేయడం
  rationale: సాధారణంగా ‘పలకరించడం’ అని అర్థమయ్యే ఈ క్రియ, ఇక్కడ సైనికులు రాజుకు చేసే లాంఛనప్రాయ వందనాన్ని ఎగతాళిగా నటిస్తున్న సందర్భాన్ని కూడా వ్యక్తం చేస్తుంది.
- source_word: Χαῖρε
  choice: నీకు జయం
  rationale: ఇది పలకరింపుగా వాడిన ఆజ్ఞారూపం. ఈ సందర్భంలో ‘నీకు జయం’ రాజును ఉద్దేశించిన ఎగతాళి జయఘోషను సహజంగా తెలియజేస్తుంది; పదశః ‘సంతోషించు’ అనడం ఇక్కడి ప్రయోగార్థానికి సరిపోదు.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: యూదుల రాజా
  rationale: సంబోధన విభక్తిని ‘రాజా’తో నిలుపుతూ, శ్రమవృత్తాంతంలోని స్థిరమైన బిరుదుకు అనుగుణంగా Ἰουδαίωνను ‘యూదుల’గా అనువదిస్తుంది.
theological_decisions:
- issue: యేసును ఉద్దేశించిన ఎగతాళి రాజవందనంలోని వ్యంగ్యాన్ని, రాజరిక భావాన్ని నిలుపడం
  choice: “యూదుల రాజా, నీకు జయం!” అనే లాంఛనప్రాయమైన ఎగతాళి జయఘోష
  alternative: “యూదుల రాజా, శుభం!” లేదా “యూదుల రాజా, నమస్కారం!”
  rationale: మూలంలోని పలకరింపు ప్రయోగాన్ని మాత్రమే కాక, సైనికులు యేసు రాజత్వాన్ని పరిహసిస్తూ చేసిన రాజవందన స్వరాన్ని కూడా ఇది నిలుపుతుంది; పాఠ్యానికి మించిన సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: Ἰουδαίων యొక్క ప్రజావాచక లేదా ప్రాంతవాచక సాధ్యత
  choice: యూదుల
  alternative: యూదయవారి
  rationale: ఈ పదం ‘యూదులు’ లేదా ‘యూదయవారు’ అనే భావాలను కలిగి ఉండగలదు. అయితే శ్రమవృత్తాంతంలోని ఈ రాజబిరుదులో ‘యూదుల రాజు’ అనే ప్రజావాచక అర్థం సందర్భానుకూలం మరియు తెలుగులో స్థిరంగా అర్థమయ్యేది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయినా శ్రమవృత్తాంతానికి తగిన గౌరవభరిత స్వరంతో రూపొందించబడింది. ఎగతాళిని వివరణగా ప్రధాన పాఠ్యంలో చేర్చకుండా, వాక్యంలోని రాజవందన రూపం ద్వారానే వినిపించేలా ఉంచాం.
