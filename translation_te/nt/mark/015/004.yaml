  text: ὁ δὲ Πιλᾶτος πάλιν ⸀ἐπηρώτα αὐτὸν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; ἴδε πόσα σου ⸀κατηγοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/004.yaml
  text: But Pilate again questioned him, saying, “Do you give no answer? Look how many charges they are bringing against you.”
translation:
  language: te
  text: 'కానీ పిలాతు ఆయనను మళ్లీ ఇలా ప్రశ్నించాడు: “నువ్వేమీ జవాబు చెప్పవా? చూడు, వారు నీ మీద ఎన్ని ఆరోపణలు[a] చేస్తున్నారో!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: “వారు నిన్ను ఎన్ని విషయాల్లో ఆరోపిస్తున్నారో చూడు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: కానీ
  rationale: కథనంలో స్వల్పమైన వ్యతిరేకతతో తదుపరి పరిణామాన్ని సూచిస్తుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: ప్రశ్నించడం పునరావృతమైనదని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπηρώτα
  choice: ప్రశ్నించాడు
  rationale: న్యాయ విచారణ సందర్భానికి తగిన పదం. గ్రీకు అసంపూర్ణ భూతకాలంలోని కొనసాగింపు భావాన్ని సందర్భం మద్దతు ఇస్తున్నప్పటికీ, తెలుగులో కృత్రిమత లేకుండా సహజంగా అనువదించబడింది.
- source_word: λέγων
  choice: ఇలా
  rationale: గ్రీకు భాషలోని మాటను పరిచయం చేసే కృదంతాన్ని సహజమైన తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంగా మార్చుతుంది.
- source_word: Οὐκ ἀποκρίνῃ οὐδέν;
  choice: నువ్వేమీ జవాబు చెప్పవా?
  rationale: యేసు మౌనంగా ఉండడాన్ని ఒత్తి అడిగే ప్రతికూల ప్రశ్న యొక్క బలాన్ని నిలుపుతుంది.
- source_word: ἴδε
  choice: చూడు
  rationale: ఎదుట జరుగుతున్న విషయంపై దృష్టి పెట్టమనే ఆజ్ఞను ఆధునిక, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: πόσα
  choice: ఎన్ని ఆరోపణలు
  rationale: పదశః ‘ఎన్ని విషయాలు’ అయినప్పటికీ, κατηγοροῦσιν అనే క్రియతో కూడిన న్యాయ సందర్భంలో సూచిత భావమైన ‘ఆరోపణలు’ను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: σου
  choice: నీ మీద
  rationale: κατηγορέωతో వ్యక్తిని సూచించే షష్ఠీ విభక్తికి సహజమైన తెలుగు రూపం.
- source_word: κατηγοροῦσιν
  choice: ఆరోపణలు చేస్తున్నారు
  rationale: వర్తమాన కాలంలోని కొనసాగుతున్న నిందారోపణను న్యాయ సందర్భానికి తగిన విధంగా తెలియజేస్తుంది.
