  text: And they were giving him wine mixed with myrrh[b][a], but he did not take it.
translation:
  language: te
  text: వారు ఆయనకు బోళము కలిపిన ద్రాక్షామద్యం ఇస్తూ ఉన్నారు; కాని ఆయన దాన్ని తీసుకోలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδίδουν
  choice: ఇవ్వడానికి ప్రయత్నించారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా ప్రయత్నపూర్వకమైన చర్యను సూచించగలదు. సందర్భంలో యేసు దాన్ని తీసుకోకపోవడం వల్ల, సహజమైన తెలుగులో ‘ఇవ్వడానికి ప్రయత్నించారు’ అని అనువదించడం ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘ఇచ్చారు’ అనడం ఆయన స్వీకరించినట్లు అపార్థమయ్యే అవకాశం ఉంది.
- source_word: ἐσμυρνισμένον οἶνον
  choice: బోళము కలిపిన ద్రాక్షారసం
  rationale: σμυρνίζω రూపం బోళముతో సిద్ధం చేసిన లేదా బోళము కలిపిన ద్రాక్షారసాన్ని సూచిస్తుంది. ‘బోళము కలిపిన ద్రాక్షారసం’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి మూలపదార్థాన్ని నిలుపుతుంది.
- source_word: ὃς δὲ
  choice: కాని ఆయన
  rationale: ὃς రూపరీత్యా సంబంధ సర్వనామమైనా ఇక్కడ యేసును తిరిగి సూచించే resumptive ప్రయోగం; δέ స్వల్ప వ్యతిరేక భావాన్ని ఇస్తుంది. తెలుగులో ‘కాని ఆయన’ సహజంగా అదే సంబంధాన్ని తెలియజేస్తుంది.
- source_word: ἔλαβεν
  choice: దాన్ని తీసుకోలేదు
  rationale: λαμβάνω ఇక్కడ ‘తీసుకోవడం/స్వీకరించడం’ అనే భావం కలిగి ఉంది. సందర్భం ద్వారా తెలిసే ద్రాక్షారసాన్ని ‘దాన్ని’ అని స్పష్టపరచడం సహజమైన తెలుగు.
theological_decisions:
- issue: యేసు ఆ పానీయాన్ని తీసుకోకపోవడానికి కారణం
  choice: కారణాన్ని జోడించకుండా చర్యను మాత్రమే వర్ణించడం
  alternative: బాధను తగ్గించే మత్తు పానీయాన్ని ఆయన తిరస్కరించారని లేదా ఆచారబద్ధమైన పానీయాన్ని వేరే కారణంతో తీసుకోలేదని వివరించడం
  rationale: గ్రీకు వాక్యం బోళము కలిపిన ద్రాక్షారసం ఇవ్వడానికి ప్రయత్నించారని, ఆయన దాన్ని తీసుకోలేదని మాత్రమే చెబుతుంది. ఆయన ఉద్దేశాన్ని వివరించే వ్యాఖ్యానాన్ని అనువాదంలో చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘బోళము’ బైబిలు సందర్భంలో మిర్రా (myrrh) అనే సుగంధ ద్రవ్యాన్ని సూచిస్తుంది; ‘ద్రాక్షారసం’ οἶνος ను స్పష్టంగా తెలియజేస్తుంది.
