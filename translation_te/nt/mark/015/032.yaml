source:
  edition: SBLGNT
  text: ὁ χριστὸς ὁ ⸀βασιλεὺς Ἰσραὴλ καταβάτω νῦν ἀπὸ τοῦ σταυροῦ, ἵνα ἴδωμεν καὶ ⸀πιστεύσωμεν. καὶ οἱ συνεσταυρωμένοι ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/032.yaml
  text: Let the Messiah[a], the King of Israel, come down now from the cross[b], so that we may see and believe.” And those who were crucified with him were also insulting him.
translation:
  language: te
  text: “ఇశ్రాయేలు రాజైన మెస్సీయ[a] ఇప్పుడు సిలువ మీద నుంచి దిగిరావాలి! అప్పుడు మేము చూసి నమ్ముతాం.” ఆయనతో పాటు సిలువ వేయబడినవారు కూడా ఆయనను దూషిస్తూ ఉన్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “క్రీస్తు.” గ్రీకు పదం Χριστός అంటే “అభిషిక్తుడు”; ఇక్కడ అది రాజసంబంధమైన బిరుదుగా వాడబడింది.
    reason: alternative_reading
  - marker: b
    text: లేదా “ఆయనను నిందిస్తూ ఉన్నారు,” “ఆయనను అవమానిస్తూ ఉన్నారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ ఇది పేరులా కాక, ఇశ్రాయేలు రాజు అనే భావంతో కూడిన అభిషిక్తుని బిరుదుగా ఎగతాళిలో వాడబడింది. అందువల్ల దాని యూదా రాజసంబంధమైన భావాన్ని నిలుపుకోవడానికి ‘మెస్సీయ’ అని అనువదించాం.
- source_word: ὁ βασιλεὺς Ἰσραήλ
  choice: ఇశ్రాయేలు రాజైన
  rationale: ‘మెస్సీయ’ను విశేషించే రాజబిరుదును సహజమైన తెలుగు నిర్మాణంలో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: καταβάτω νῦν ἀπὸ τοῦ σταυροῦ
  choice: ఇప్పుడు సిలువ మీద నుంచి దిగిరావాలి
  rationale: మూడవ పురుష ఆజ్ఞార్థక రూపంలోని సవాలును, తక్షణత్వాన్ని, ఎగతాళి ధోరణిని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμεν
  choice: అప్పుడు మేము చూసి నమ్ముతాం
  rationale: వక్తల వ్యంగ్య సవాలులోని ఉద్దేశం లేదా షరతు-ఫలిత సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, ‘చూడడం’ మరియు ‘నమ్మడం’ రెండింటినీ నిలుపుతుంది.
- source_word: οἱ συνεσταυρωμένοι σὺν αὐτῷ
  choice: ఆయనతో పాటు సిలువ వేయబడినవారు
  rationale: యేసుతో కలిసి సిలువ శిక్షకు గురైన ఇతరులను సూచించే కర్మణి భావాన్ని, మూలంలో లేని అదనపు నిర్దిష్టీకరణ లేకుండా నిలుపుతుంది.
- source_word: ὠνείδιζον αὐτόν
  choice: ఆయనను నిందిస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న చర్యను ‘నిందిస్తూ ఉన్నారు’ తెలియజేస్తుంది; పదంలో ఉన్న దూషణ, అవమానపరచడం అనే భావాలకు ఇది సాధారణ పాఠకులకు అర్థమయ్యే సమతుల్య పదప్రయోగం.
theological_decisions:
- issue: ఎగతాళి సందర్భంలో Χριστός బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: Χριστός ఇక్కడ ఇశ్రాయేలు రాజు అనే రాజసంబంధమైన అభిషిక్తుని బిరుదుగా ఉంది. ‘మెస్సీయ’ ఆ భావాన్ని స్పష్టంగా నిలుపుతుంది; ‘క్రీస్తు’ కూడా సంప్రదాయ ప్రత్యామ్నాయం కాబట్టి పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే వాక్యంలోని ఎగతాళి, రాజబిరుదు, కొనసాగుతున్న నింద అనే సూక్ష్మతలను నిలుపుతూ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. అన్ని పాదటిప్పణి గుర్తులు సంబంధిత పదాల దగ్గరే ఉంచబడ్డాయి.
