id: MRK.15.17
reference: Mark 15:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀ἐνδιδύσκουσιν αὐτὸν πορφύραν καὶ περιτιθέασιν αὐτῷ πλέξαντες ἀκάνθινον στέφανον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/017.yaml
  text: And they dress him in purple[a], and after weaving a crown of thorns, they place it on him.
translation:
  language: te
  text: వారు ఆయనకు ఊదారంగు వస్త్రం[a] తొడిగించి, ముళ్లతో ఒక కిరీటం అల్లి ఆయన తలపై పెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఊదారంగు బట్టను తొడిగించారు.” గ్రీకు పాఠంలో ఈ వచనంలో “అంగీ” అనే మాట స్పష్టంగా లేదు; అయితే సందర్భం ఒక వస్త్రాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδιδύσκουσιν
  choice: తొడిగించి
  rationale: ఈ క్రియ మరొకరికి వస్త్రం తొడిగించడాన్ని సూచిస్తుంది; తెలుగులో సహజంగా ఉండేలా దాని causative భావాన్ని నిలుపుతుంది.
- source_word: πορφύραν
  choice: ఊదారంగు వస్త్రం
  rationale: ఈ నామవాచకం ఊదారంగు బట్టను లేదా వస్త్రాన్ని సూచించగలదు. గ్రీకులో 'అంగీ' అని స్పష్టంగా లేకపోవడంతో సాధారణమైన 'వస్త్రం'ను వాడి, రంగు మరియు వస్త్రార్థం రెండింటినీ తెలిపాం.
- source_word: περιτιθέασιν
  choice: ఆయన తలపై పెట్టారు
  rationale: క్రియ చుట్టూ ఉంచడం లేదా మీద పెట్టడం అని అర్థం. కిరీటం విషయంలో తెలుగులో సహజమైన స్థలాన్ని స్పష్టంచేయడానికి 'తలపై' అని పేర్కొన్నాం; ఇది సందర్భంలో అంతర్లీనంగా ఉంది.
- source_word: πλέξαντες
  choice: అల్లి
  rationale: Aorist participle ప్రధాన క్రియకు ముందు జరిగిన పనిని సూచిస్తుంది. తెలుగులో వరుస చర్యలను సహజంగా తెలియజేయడానికి 'అల్లి ... పెట్టారు' అని అనువదించాం.
- source_word: ἀκάνθινον
  choice: ముళ్లతో
  rationale: ముళ్లతో తయారైనదని సూచించే విశేషణాన్ని సహజ తెలుగు సాధనార్థక రూపంలో ఇచ్చాం.
- source_word: στέφανον
  choice: కిరీటం
  rationale: ఈ పదానికి పుష్పమాల లేదా విజయమాల అనే అర్థాలు ఉండగలిగినా, ఇక్కడ రాజరికాన్ని అపహాస్యం చేసే సందర్భంలో 'కిరీటం' ఉద్దేశిత వ్యంగ్యాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: యేసును అవమానించడంలో రాజరికపు అపహాస్య చిత్రణ
  choice: στέφανοςకు 'కిరీటం'
  alternative: '''మాల'' లేదా ''విజయమాల'''
  rationale: ఊదారంగు వస్త్రం, ముళ్ల కిరీటం ద్వారా సైనికులు రాజరికాన్ని పరిహసిస్తున్నారు. 'కిరీటం' ఈ కథన వ్యంగ్యాన్ని కాపాడుతుంది; పాఠ్యంలో లేని సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. Greek historical presentsను తెలుగు కథనానికి సహజమైన భూతకాలంలో వ్యక్తం చేశాం.
