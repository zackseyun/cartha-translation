  yaml_path: translation/nt/mark/015/027.yaml
  text: And with him they crucify two robbers[a], one at his right and one at his left.
translation:
  language: te
  text: ఆయనతోపాటు ఇద్దరు దోపిడీదారులను[a] సిలువ వేస్తారు—ఒకరిని ఆయన కుడివైపున, మరొకరిని ఆయన ఎడమవైపున.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బందిపోట్లు’; ఈ పదాన్ని రాజకీయ ఛాయతో అర్థం చేసుకుంటే, ‘తిరుగుబాటుదారులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν αὐτῷ
  choice: ఆయనతోపాటు
  rationale: సύν + చతుర్థీ విభక్తి సహవాసాన్ని సూచిస్తుంది. ‘ఆయనతోపాటు’ అనే ప్రయోగం యేసుతో కలిసి వారినీ సిలువ వేసిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: σταυροῦσιν
  choice: సిలువ వేస్తారు
  rationale: ఇది వర్తమాన క్రియారూపం; మార్కు సజీవ కథనం కోసం తరచుగా ఉపయోగించే చారిత్రక వర్తమానాన్ని తెలుగులో కూడా నిలుపుతుంది.
- source_word: δύο λῃστάς
  choice: ఇద్దరు దోపిడీదారులను
  rationale: λῃστής దోచుకునే వ్యక్తిని, బందిపోటును లేదా కొన్ని సందర్భాల్లో రాజకీయ తిరుగుబాటుదారుని సూచించవచ్చు. ప్రధాన పాఠ్యంలో విస్తృతమైన, సులభంగా అర్థమయ్యే ‘దోపిడీదారులు’ ఉంచి, ఇతర అవకాశాలను పాదసూచికలో ఇచ్చాం.
- source_word: ἕνα ἐκ δεξιῶν
  choice: ఒకరిని ఆయన కుడివైపున
  rationale: ఈ సందర్భంలో ἐκ δεξιῶν కుడి పక్కన ఉన్న స్థానాన్ని సూచిస్తుంది. సమాంతర వాక్య నిర్మాణంలో ‘ఆయన’ను స్పష్టంగా చేర్చడం తెలుగులో సహజం.
- source_word: ἕνα ἐξ εὐωνύμων αὐτοῦ
  choice: మరొకరిని ఎడమవైపున
  rationale: εὐώνυμος ఇక్కడ కుడికి వ్యతిరేకమైన ఎడమ వైపును సూచించే సభ్యోక్తి. ముందున్న ‘ఆయన’ ఈ సమాంతర భాగానికీ వర్తిస్తుంది.
theological_decisions:
- issue: సిలువవేయబడినవారిని సూచించే λῃσταί పదం
  choice: దోపిడీదారులు
  alternative: బందిపోట్లు; తిరుగుబాటుదారులు
  rationale: ఈ పదం హింసాత్మక దోపిడీదారులను లేదా బందిపోట్లను సూచించగలదు; కొన్ని సందర్భాల్లో తిరుగుబాటు సంబంధమైన రాజకీయ ఛాయ కూడా ఉండవచ్చు. ఈ వచనం మాత్రమే ఆ రాజకీయ అర్థాన్ని నిర్బంధించదు కాబట్టి ప్రధాన పాఠ్యంలో విస్తృత అర్థాన్ని ఉంచి, మిగతా అవకాశాలను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని చారిత్రక వర్తమానాన్ని ‘సిలువ వేస్తారు’ ద్వారా నిలిపాం; λῃστής పదంలోని భావ విస్తృతిని పాదసూచికలో భద్రపరిచాం.
