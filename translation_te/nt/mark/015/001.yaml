id: MRK.15.1
reference: Mark 15:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς πρωῒ συμβούλιον ποιήσαντες οἱ ἀρχιερεῖς μετὰ τῶν πρεσβυτέρων καὶ γραμματέων καὶ ὅλον τὸ συνέδριον δήσαντες τὸν Ἰησοῦν ἀπήνεγκαν καὶ ⸀παρέδωκαν Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/001.yaml
  text: And immediately[a], early in the morning, the chief priests held a consultation with the elders and scribes and the whole council; then they bound Jesus, led him away, and handed him over to Pilate.
translation:
  language: te
  text: వెంటనే, ఉదయాన్నే ప్రధాన యాజకులు పెద్దలతో, శాస్త్రులతో, మొత్తం మహాసభతో కలిసి సమాలోచన జరిపారు. తరువాత వారు యేసును బంధించి తీసుకువెళ్లి పిలాతుకు అప్పగించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς πρωῒ
  choice: తెల్లవారగానే
  rationale: εὐθύς సూచించే తక్షణత్వాన్ని, πρωῒ సూచించే వేకువ సమయాన్ని సహజమైన ఆధునిక తెలుగు ప్రయోగంలో కలిపి తెలియజేస్తుంది.
- source_word: συμβούλιον ποιήσαντες
  choice: సంప్రదింపులు జరిపారు
  rationale: ఆలోచనాపూర్వకంగా, అధికారికంగా సంప్రదించిన భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; కేవలం ఒక పథకం వేశారనే సంకుచిత అర్థాన్ని రుద్దదు.
- source_word: ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: ఇది అప్పటి ప్రముఖ యాజక అధికారులను సూచించే బహువచన పదానికి సాధారణమైన, స్పష్టమైన తెలుగు అనువాదం.
- source_word: πρεσβυτέρων
  choice: పెద్దలు
  rationale: ఈ పరిపాలనా సందర్భంలో గుర్తింపు పొందిన నాయకులను సూచిస్తుంది.
- source_word: γραμματέων
  choice: శాస్త్రులు
  rationale: ధర్మశాస్త్ర పరిజ్ఞానం, ప్రతుల రచనతో సంబంధమున్న అధికార వర్గానికి తెలుగులో స్థిరపడిన సంక్షిప్త పదం.
- source_word: ὅλον τὸ συνέδριον
  choice: మహాసభ అంతటితో
  rationale: యూదుల పాలక మండలిని లిప్యంతరీకరించకుండా దాని సంస్థాగత భావాన్ని తెలియజేస్తుంది; చారిత్రక పేరు పాదసూచికలో ఇవ్వబడింది.
- source_word: δήσαντες
  choice: బంధించి
  rationale: యేసును కట్టి అదుపులో ఉంచిన చర్యను గంభీరంగా, నేరుగా తెలియజేస్తుంది.
- source_word: ἀπήνεγκαν
  choice: తీసుకుపోయి
  rationale: కాపలా కింద అక్కడి నుండి తీసుకెళ్లిన భావాన్ని సహజంగా ఇస్తుంది; భౌతికంగా మోసుకెళ్లారనే అనవసర భావాన్ని కలిగించదు.
- source_word: παρέδωκαν
  choice: అప్పగించారు
  rationale: యేసును రోమా అధికారి అధీనానికి అధికారికంగా ఇచ్చిన న్యాయపరమైన భావాన్ని నిలుపుతుంది.
- source_word: Πιλάτῳ
  choice: పిలాతుకు
  rationale: Πιλᾶτος అనే వ్యక్తి పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
theological_decisions:
- issue: συνέδριον అనే పదం సూచించే సంస్థ
  choice: మహాసభ
  alternative: సన్హెద్రిన్ సభ
  rationale: పాలక మండలి అనే సంస్థాగత అర్థాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది. మరింత నిర్దిష్టమైన చారిత్రక లిప్యంతరీకరణను పాదసూచికలో ఉంచడం ద్వారా సమాచారం కోల్పోకుండా చూస్తుంది.
- issue: శ్రమకథనంలో παρέδωκαν పదం యొక్క భావం
  choice: అప్పగించారు
  alternative: చేతికి ఇచ్చారు
  rationale: ఈ వచనంలో ప్రధానంగా యేసును రోమా అధికారికి అప్పగించిన చర్యనే తెలియజేస్తుంది. విస్తృతమైన వేదాంతార్థాలను వచనంలోకి అదనంగా చేర్చకుండా, అధికారిక అధీన బదిలీ భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. మూలంలోని చర్యల క్రమం—సంప్రదించడం, బంధించడం, తీసుకుపోవడం, అప్పగించడం—స్పష్టంగా నిలుపబడింది. εὐθύς మరియు πρωῒ కలిపి తెలిపే కాలత్వం, తక్షణత్వం ‘తెల్లవారగానే’లో వ్యక్తమయ్యాయి.
