id: MRK.15.43
reference: Mark 15:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἐλθὼν Ἰωσὴφ ⸀ὁ ἀπὸ Ἁριμαθαίας εὐσχήμων βουλευτής, ὃς καὶ αὐτὸς ἦν προσδεχόμενος τὴν βασιλείαν τοῦ θεοῦ, τολμήσας εἰσῆλθεν πρὸς ⸀τὸν Πιλᾶτον καὶ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/043.yaml
  text: Joseph of Arimathea[a], a respected council member who was himself also waiting for the kingdom of God[d][c][b], boldly went in to Pilate and asked for the body of Jesus.
translation:
  language: te
  text: అరిమతయకు చెందిన యోసేపు, గౌరవనీయుడైన సభ సభ్యుడూ తాను కూడా దేవుని రాజ్యం కోసం ఎదురుచూస్తూ ఉన్నవాడూ, వచ్చి ధైర్యంగా పిలాతు సమక్షంలోకి ప్రవేశించి యేసు దేహాన్ని అడిగాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: వచ్చి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన కదలికను సూచించే గ్రీకు భూతకాల అసమాపక క్రియను సహజమైన తెలుగు క్రియావిశేషణ రూపంలో నిలుపుతుంది.
- source_word: ὁ ἀπὸ Ἁριμαθαίας
  choice: అరిమతయికి చెందిన
  rationale: యోసేపు ఏ ప్రాంతానికి చెందినవాడో సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ἀπό లోని మూలస్థాన భావాన్ని కాపాడుతుంది.
- source_word: εὐσχήμων βουλευτής
  choice: గౌరవనీయుడైన సభాసభ్యుడు
  rationale: εὐσχήμων సూచించే గౌరవం లేదా సామాజిక ప్రతిష్ఠను, βουλευτής సూచించే సభలోని సభ్యత్వాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; మూలంలో లేని ‘సన్హెద్రిన్’ అనే ప్రత్యేక పేరును చేర్చదు.
- source_word: ὃς καὶ αὐτὸς
  choice: అతడు కూడా
  rationale: యోసేపు స్వయంగా ఈ నిరీక్షణలో పాలుపంచుకున్నాడనే καὶ αὐτός ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: ἦν προσδεχόμενος
  choice: ఎదురుచూస్తున్నాడు
  rationale: కొనసాగుతున్న నిరీక్షణను సూచించే గ్రీకు పరిభాషాత్మక నిర్మాణానికి సహజమైన తెలుగు రూపం.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: సువార్తలలోని కేంద్ర భావవ్యక్తీకరణకు సూటియైన, సుపరిచితమైన అనువాదం.
- source_word: τολμήσας
  choice: ధైర్యం చేసి
  rationale: పిలాతును సమీపించడంలో ఉన్న సాహసాన్ని కాపాడుతూ, తెలుగు వాక్యంలో సహజంగా ప్రవహిస్తుంది.
- source_word: εἰσῆλθεν πρὸς τὸν Πιλᾶτον
  choice: పిలాతు సమక్షంలోకి వెళ్లి
  rationale: εἰσῆλθεν లోని లోపలికి ప్రవేశించే భావాన్ని, πρὸς లోని వ్యక్తివైపు వెళ్లే భావాన్ని కలిపి సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ
  choice: యేసు దేహాన్ని అడిగాడు
  rationale: యేసు దేహాన్ని తనకు అప్పగించమని కోరిన చర్యను సరళంగా, గంభీరంగా తెలియజేస్తుంది.
theological_decisions:
- issue: βουλευτής సూచించే సభ ఏది?
  choice: ప్రధాన పాఠ్యంలో ‘సభాసభ్యుడు’ అని మాత్రమే అనువదించడం
  alternative: ‘సన్హెద్రిన్ సభ్యుడు’
  rationale: సందర్భంలో యూదుల మహాసభ ఉద్దేశించబడి ఉండవచ్చు; అయినా గ్రీకు పదం ఆ సభను పేరుతో పేర్కొనదు. అందువల్ల మూలం చెప్పిన దానికంటే నిర్దిష్టతను పెంచలేదు.
- issue: దేవుని రాజ్యం కోసం యోసేపు నిరీక్షించిన తీరు
  choice: ‘అతడు కూడా ... ఎదురుచూస్తున్నాడు’ అని కొనసాగుతున్న వ్యక్తిగత నిరీక్షణగా చూపడం
  alternative: కేవలం ‘దేవుని రాజ్యాన్ని ఆశించాడు’
  rationale: ἦν προσδεχόμενος కొనసాగుతున్న నిరీక్షణను, καὶ αὐτός యోసేపు స్వయంగా కూడా ఆ నిరీక్షణలో ఉన్నాడనే ఉద్ఘాటనను సూచిస్తాయి.
- issue: τολμήσας యొక్క బలం
  choice: ‘ధైర్యం చేసి’
  alternative: ‘తెగించి’ లేదా ‘సాహసించి’
  rationale: ఈ చర్యలోని ప్రమాదాన్ని లేదా ధైర్యాన్ని తుడిచివేయకుండా, దాని స్వరూపం గురించి మూలంలో లేని వివరణను చేర్చకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదాలను వాడాం. పొడవైన గ్రీకు సంబంధవాక్యాన్ని తెలుగులో మూడు చిన్న వాక్యాలుగా విభజించినా, యోసేపు గుర్తింపు, హోదా, నిరీక్షణ, ధైర్యపూర్వక చర్యల అనుసంధానాన్ని నిలిపాం. ‘సమక్షంలోకి’ కొద్దిగా గంభీరమైనదైనా న్యాయాధికారిని కలుసుకోవడానికి లోపలికి వెళ్లిన భావాన్ని సహజంగా అందిస్తుంది.
