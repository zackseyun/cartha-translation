  text: καὶ ἦν ἡ ἐπιγραφὴ τῆς αἰτίας αὐτοῦ ἐπιγεγραμμένη· Ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/026.yaml
  text: 'And the inscription of the charge against him was written: “The King of the Jews.”[a]'
translation:
  language: te
  text: 'ఆయనపై ఉన్న అభియోగాన్ని తెలిపే శాసనం ఇలా రాసి ఉంది: “యూదుల రాజు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యూదయుల రాజు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  choice: శాసనం
  rationale: సిలువపై లేదా దాని పైన ఉంచిన లిఖిత ప్రకటనను సూచిస్తుంది. ‘శాసనం’ వ్రాతపూర్వకంగా ప్రదర్శించిన అధికారిక మాటలను సంక్షిప్తంగా, గంభీరంగా తెలియజేస్తుంది.
- source_word: αἰτία
  choice: ఆయనపై మోపిన నేరారోపణ
  rationale: ఈ న్యాయసంబంధ సందర్భంలో యేసుపై ప్రకటించిన అభియోగాన్ని సూచిస్తుంది. ‘నేరారోపణ’ దాని న్యాయపరమైన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐπιγεγραμμένη
  choice: రాసి ఉంది
  rationale: ἦνతో కూడిన పరిపూర్ణ కృదంత నిర్మాణం ఆ మాటలు రాయబడి అలాగే ప్రదర్శితమై ఉన్న స్థితిని సూచిస్తుంది. ‘రాసి ఉంది’ ఆధునిక తెలుగులో సహజంగా ఆ స్థితిని తెలియజేస్తుంది.
- source_word: βασιλεὺς
  choice: రాజు
  rationale: ఆరోపణలోని రాజపదవిని నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: Ἰουδαίων
  choice: యూదుల
  rationale: సువార్తల శ్రమానుభవ వృత్తాంతాల్లో కనిపించే స్థిరమైన బిరుదును, సంబంధిత ప్రజాసమూహ సూచనను నిలుపుతుంది. ‘యూదయుల’ అనే భౌగోళిక ప్రత్యామ్నాయం సాధ్యమైనందున పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: సిలువపై ఆరోపణలో Ἰουδαίων అనువాదం
  choice: యూదుల
  alternative: యూదయుల
  rationale: ఇది యేసుకు జోడించిన రోమా అధికారిక ఆరోపణ లేదా బిరుదును నివేదిస్తుంది. ‘యూదుల రాజు’ సువార్తలలో గుర్తించదగిన స్థిర ప్రయోగాన్ని కాపాడుతుంది; అయితే Ἰουδαῖος కొన్ని సందర్భాల్లో ‘యూదయుడు’ అనే ప్రాంతీయ భావాన్ని కూడా కలిగి ఉండగలదు కాబట్టి ఆ ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. గ్రీకు వాక్యంలోని లిఖిత ఆరోపణ భావాన్ని స్పష్టంగా ఉంచుతూ అనవసర వివరణను చేర్చలేదు.
