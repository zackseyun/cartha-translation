  text: And after learning from the centurion[a], he granted the body to Joseph.
translation:
  language: te
  text: శతాధిపతి నుండి తెలుసుకున్న తర్వాత, పిలాతు దేహాన్ని[a] యోసేపుకు ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “శవాన్ని,” “మృతదేహాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: తెలుసుకున్న తర్వాత
  rationale: 'γινώσκω క్రియ యొక్క భూతకాల అసమాపక రూపం ఇక్కడ కాలక్రమాన్ని సూచిస్తుంది: శతాధిపతి ఇచ్చిన సమాచారం తెలుసుకున్న తరువాత పిలాతు తదుపరి చర్య తీసుకున్నాడు.'
- source_word: ἀπὸ τοῦ κεντυρίωνος
  choice: శతాధిపతి ద్వారా
  rationale: ἀπό + షష్ఠీ విభక్తి సమాచార మూలాన్ని సూచిస్తుంది. కెంటూరియన్ అనే రోమా సైనిక హోదాకు అర్థవంతమైన, ప్రాచుర్యంలో ఉన్న తెలుగు పదం ‘శతాధిపతి’.
- source_word: ἐδωρήσατο
  choice: అప్పగించాడు
  rationale: ఈ మధ్యమ రూపం అనుగ్రహంగా ఇవ్వడం లేదా అధికారపూర్వకంగా మంజూరు చేయడం అనే భావాన్ని కలిగిస్తుంది. మృతదేహాన్ని యోసేపు స్వాధీనానికి ఇవ్వడానికి పిలాతు చేసిన అధికారిక చర్యను ‘అప్పగించాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: πτῶμα
  choice: దేహాన్ని
  rationale: πτῶμα ఇక్కడ మరణించిన వ్యక్తి శరీరాన్ని, అంటే శవాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో గౌరవప్రదంగా, సహజంగా ఉండే ‘దేహం’ వాడి, స్పష్టమైన నిఘంటు అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: τῷ Ἰωσήφ
  choice: యోసేపుకు
  rationale: చతుర్థీ విభక్తి పిలాతు అప్పగించిన దేహాన్ని పొందిన వ్యక్తిని సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి పాటించబడింది. గ్రీకు వాక్యంలో కర్త పూర్వసందర్భం ద్వారా తెలిసినా, తెలుగులో వాక్య స్పష్టత కోసం ‘అతడు’ చేర్చబడింది. పాదసూచిక గుర్తు అది వివరిస్తున్న ‘దేహాన్ని’ అనే పదానికే జోడించబడింది.
