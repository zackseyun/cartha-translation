revisions:
- from: శతాధిపతి ద్వారా తెలుసుకున్న తర్వాత, అతడు దేహాన్ని[a] యోసేపుకు అప్పగించాడు.
  to: శతాధిపతి నుండి తెలుసుకున్న తర్వాత, పిలాతు దేహాన్ని[a] యోసేపుకు ఇచ్చాడు.
  rationale: The revision more directly reflects the Greek source relation (‘from the centurion’), identifies the contextually implicit subject as Pilate to avoid Telugu ambiguity, and uses a straightforward modern equivalent for the official granting of the body. The main-text softness of ‘దేహం’ and the lexical alternative in the footnote are retained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:15:28Z'
review_pass:
  verdict: revise
  source_fidelity: The temporal sequence of γνοὺς is retained, and the footnote correctly records that πτῶμα denotes a corpse/dead body. However, శతాధిపతి ద్వారా is less direct than ἀπὸ τοῦ κεντυρίωνος (‘from the centurion’), and the implicit subject is potentially unclear after that phrase. The revised wording makes Pilate explicit for Telugu clarity without altering the source sense.
  naturalness: శతాధిపతి నుండి తెలుసుకున్న తర్వాత is more idiomatic modern Telugu than శతాధిపతి ద్వారా తెలుసుకున్న తర్వాత. Naming పిలాతు removes an avoidable pronoun-reference ambiguity. ఇచ్చాడు is a natural narrative rendering of ἐδωρήσατο in this context.
  terminology: శతాధిపతి is an appropriate established rendering for κεντυρίων. దేహం is acceptable in the main text, while the footnote preserves the more explicit lexical sense ‘corpse/dead body.’ యోసేపు is retained.
  issues:
  - severity: medium
    issue: Source relation and subject clarity
    rationale: ἀπό marks the person from whom Pilate learned the information; శతాధిపతి నుండి expresses this more directly than ద్వారా. In Telugu, the following అతడు can be momentarily associated with the immediately preceding శతాధిపతి, whereas the Greek subject is Pilate from the prior context.
  - severity: low
    issue: Rendering of ἐδωρήσατο
    rationale: అప్పగించాడు can suggest handing something over, but ఇచ్చాడు more directly conveys the act of granting/giving expressed by δωρέομαι, without importing a custody-transfer nuance.
  revised_text: శతాధిపతి నుండి తెలుసుకున్న తర్వాత, పిలాతు దేహాన్ని[a] యోసేపుకు ఇచ్చాడు.
  revised_footnotes:
  - marker: a
    text: లేదా “శవాన్ని,” “మృతదేహాన్ని.”
    reason: lexical_alternative
  revision_rationale: The revision more directly reflects the Greek source relation (‘from the centurion’), identifies the contextually implicit subject as Pilate to avoid Telugu ambiguity, and uses a straightforward modern equivalent for the official granting of the body. The main-text softness of ‘దేహం’ and the lexical alternative in the footnote are retained.
