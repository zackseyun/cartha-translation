source:
  edition: SBLGNT
  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν πορφύραν καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια ⸂τὰ ἴδια⸃. καὶ ἐξάγουσιν αὐτὸν ἵνα ⸀σταυρώσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/020.yaml
  text: And when they had mocked him, they stripped the purple robe off him and put his own clothes on him. And they lead him out to crucify him.
translation:
  language: te
  text: వారు ఆయనను ఎగతాళి చేసిన తరువాత, ఆ ఊదారంగు వస్త్రాన్ని[a] ఆయన మీద నుంచి తీసివేసి, ఆయన సొంత బట్టలు ఆయనకు తొడిగారు. తరువాత ఆయనను సిలువ వేయడానికి[b] బయటికి తీసుకెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ ఊదారంగు వస్త్రాన్ని” లేదా “ఆ ఊదారంగు పైవస్త్రాన్ని.” గ్రీకులో అక్షరార్థంగా “ఆ ఊదారంగును” అని ఉంది; వస్త్రం అనే భావం సందర్భం నుంచి తెలుస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారు ఆయనను సిలువ వేయాలని ఆయనను బయటికి తీసుకెళ్లారు.” గ్రీకులో ఉద్దేశాన్ని తెలిపే ఉపవాక్యం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: ఎగతాళి చేసిన
  rationale: ఈ క్రియ అవహేళనతో కూడిన పరిహాసాన్ని సూచిస్తుంది. ‘ఎగతాళి’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, వృత్తాంతపు గంభీర స్వరాన్ని నిలుపుతుంది.
- source_word: ἐξέδυσαν αὐτὸν τὴν πορφύραν
  choice: ఆ ఊదారంగు వస్త్రాన్ని ఆయన మీద నుంచి తీసివేసి
  rationale: క్రియ ఆయనకు తొడిగిన దుస్తును తొలగించడాన్ని సూచిస్తుంది. సందర్భంలో పోర్ఫ్యురా రాజవేషంగా ఉపయోగించిన ఊదారంగు వస్త్రం; తెలుగులో ‘మీద నుంచి తీసివేసి’ చర్యను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: πορφύραν
  choice: ఊదారంగు వస్త్రం
  rationale: గ్రీకులో అక్షరార్థంగా ‘ఊదారంగు’ మాత్రమే ఉండి, వస్త్రం సందర్భం వల్ల అవగతమవుతుంది. ఏ నిర్దిష్ట దుస్తురకాన్ని అనవసరంగా నిర్ణయించకుండా ‘వస్త్రం’ అని స్పష్టం చేయబడింది.
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια τὰ ἴδια
  choice: ఆయన సొంత బట్టలు ఆయనకు తొడిగారు
  rationale: ἱμάτια సాధారణంగా దుస్తులను సూచిస్తుంది; τὰ ἴδια ఆయనకు చెందినవే అనే భావాన్ని బలపరుస్తుంది. ‘సొంత బట్టలు’ సాధారణ పాఠకులకు సహజమైన ఆధునిక తెలుగు.
- source_word: ἐξάγουσιν
  choice: బయటికి తీసుకెళ్లారు
  rationale: మూలంలోని చారిత్రక వర్తమానాన్ని తెలుగులో సహజమైన భూతకాల వృత్తాంతంగా ఇచ్చాం. ‘తీసుకెళ్లారు’ కాపలా కింద ఆయనను వెలుపలికి తీసుకుపోయిన చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: ἵνα σταυρώσωσιν αὐτόν
  choice: ఆయనను సిలువ వేయడానికి
  rationale: ἵνα ఉపవాక్యం ఇక్కడ ఉద్దేశాన్ని సూచిస్తుంది. తెలుగు క్రియార్థక రూపం మూల భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: సిలువ వేయడానికి ముందు యేసుకు జరిగిన అవమానాన్ని వర్ణించడం
  choice: ఎగతాళి, ఊదారంగు వస్త్రం తొలగింపు, ఆయన సొంత బట్టలు తొడగడం, సిలువ వేయడానికి బయటికి తీసుకెళ్లడం అనే చర్యలను నేరుగా వర్ణించడం
  alternative: ఈ చర్యలకు రాజత్వం లేదా ప్రాయశ్చిత్తం గురించి వివరణాత్మక వ్యాఖ్యానాన్ని జోడించడం
  rationale: వచనం నేరుగా వృత్తాంతాన్ని చెబుతుంది. అంతర్లీన అవమానాన్ని చర్యల ద్వారానే నిలుపుతూ, మూలంలో లేని సిద్ధాంత వివరణను చేర్చలేదు.
- issue: ἵνα ఉద్దేశ ఉపవాక్యం
  choice: ‘సిలువ వేయడానికి’ అని ఉద్దేశార్థంగా అనువదించడం
  alternative: ‘వారు ఆయనను సిలువ వేయగలిగేలా’ అని విస్తరించడం
  rationale: ఇక్కడ సహజమైన ఉద్దేశ భావమే ప్రధానమైనది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో చూపడం ద్వారా గ్రీకు నిర్మాణం కూడా పాఠకునికి అందుబాటులో ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వృత్తాంత శైలి వాడబడింది. ‘ఊదారంగు వస్త్రం’ గ్రీకు పదంలోని సందర్భసిద్ధ అర్థాన్ని స్పష్టం చేస్తూనే దుస్తురకాన్ని అతిగా నిర్దిష్టం చేయదు. వాక్యాల కాలక్రమాన్ని ‘తరువాత’తో స్పష్టంగా ఉంచి, మూలంలోని ఉద్దేశ భావాన్ని ‘-డానికి’ రూపంలో సహజంగా వ్యక్తం చేశాం.
