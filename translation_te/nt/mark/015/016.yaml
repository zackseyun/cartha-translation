translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. చారిత్రక వర్తమాన కాలాన్ని నిలిపి, ‘ప్రైటోరియం’ అనే రోమా పదానికి పాదసూచికలో వివరణ ఇచ్చాం. ప్రధాన వాక్యంలో సాంకేతిక ‘కోహోర్టు’కు బదులుగా సాధారణ పాఠకుడికి స్పష్టమైన ‘సైనిక దళం’ను ఎంచుకున్నాం.
