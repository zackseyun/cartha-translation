source:
  edition: SBLGNT
  text: Οἱ δὲ στρατιῶται ἀπήγαγον αὐτὸν ἔσω τῆς αὐλῆς, ὅ ἐστιν πραιτώριον, καὶ συγκαλοῦσιν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/016.yaml
  text: Then the soldiers led him inside the courtyard[a], which is the praetorium[b], and they call together the whole cohort.
translation:
  language: te
  text: అప్పుడు సైనికులు ఆయనను ప్రాంగణంలోకి—అనగా ప్రైటోరియంలోకి[a]—తీసుకువెళ్లారు; వారు సైనిక దళమంతటినీ[b] కూడగడతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రైటోరియం’ అంటే రోమా పాలకుని ప్రధాన కార్యస్థలం; సందర్భానుసారం అతని అధికార నివాసాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మూలభాషలోని పదం రోమా సైన్యంలోని ‘కోహోర్టు’ అనే విభాగాన్ని సూచిస్తుంది; ఇక్కడ రోమా అధికారం కింద ఉన్న సైనికుల సమూహాన్ని ఉద్దేశిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: Οἱ δὲ
  choice: అప్పుడు
  rationale: δέ ఇక్కడ బలమైన వ్యతిరేకతను కాక కథనంలోని తదుపరి ఘట్టాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ సహజంగా ఆ పురోగతిని తెలియజేస్తుంది.
- source_word: στρατιῶται
  choice: సైనికులు
  rationale: వ్యక్తిగత రోమా సైనికులను సూచించే నేరమైన, సహజమైన తెలుగు పదం.
- source_word: ἀπήγαγον
  choice: తీసుకువెళ్లి
  rationale: ἔσω సూచించే గమ్యాన్ని దృష్టిలో ఉంచుకొని, ఒకరిని తమతో నడిపించుకొని వెళ్లడమనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔσω τῆς αὐλῆς
  choice: ప్రాంగణం లోపలికి
  rationale: ἔσω యొక్క అంతర్భాగానికి వెళ్లే ప్రాదేశిక భావాన్ని నిలుపుతుంది; αὐλήని సందర్భం మించిన విధంగా రాజభవనం లేదా నివాసమని నిర్దిష్టం చేయదు.
- source_word: ὅ ἐστιν πραιτώριον
  choice: అంటే ప్రైటోరియంలోకి
  rationale: గ్రీకు వివరణాత్మక వాక్యభాగాన్ని సహజంగా చూపిస్తూ, రోమా పరిపాలనా స్థలానికి సంబంధించిన చారిత్రక పదాన్ని లిప్యంతరీకరణలో నిలుపుతుంది; అర్థాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: συγκαλοῦσιν
  choice: పిలిచి సమావేశపరుస్తారు
  rationale: సమూహంగా కూడేందుకు పిలవడమనే సమాస క్రియ భావాన్ని తెలియజేస్తుంది; మార్కు ఉపయోగించిన చారిత్రక వర్తమాన కాలపు సజీవతను ‘సమావేశపరుస్తారు’తో నిలుపుతుంది.
- source_word: ὅλην τὴν σπεῖραν
  choice: సైనిక దళమంతటినీ
  rationale: σπεῖρα ఒక రోమా సైనిక విభాగాన్ని సూచిస్తుంది. సాధారణ పాఠకుడికి అర్థమయ్యే ‘సైనిక దళం’ను వాడి, సాంకేతిక వివరాన్ని పాదసూచికలో ఇస్తుంది.
