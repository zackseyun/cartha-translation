  text: It was the third hour[a], and they crucified him.
translation:
  language: te
  text: మూడవ గంట[a] అయింది; వారు ఆయనను సిలువ వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సాధారణ యూదుల కాలగణన ప్రకారం, అంటే ఉదయం దాదాపు తొమ్మిది గంటలు.
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν
  choice: అయింది
  rationale: εἰμί యొక్క అసంపూర్ణ భూతకాల రూపం ఇక్కడ సమయాన్ని సూచించే నుడికారంగా ఉంది; తెలుగులో ‘మూడవ గంట అయింది’ సహజంగా ఉంటుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: δέ ఇక్కడ బలమైన వ్యతిరేకతను కాక కథనం ముందుకు సాగడాన్ని సూచించే స్వల్ప అనుసంధాన పదం; ‘అప్పుడు’ ఆ కథన గమనాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὥρα τρίτη
  choice: మూడవ గంట
  rationale: మూలంలోని ప్రాచీన కాలగణన పదబంధాన్ని ప్రధాన పాఠ్యంలో యథాతథ భావంతో ఉంచి, ఆధునిక సమయ వివరణను పాదటిప్పణిలో ఇస్తుంది.
- source_word: ἐσταύρωσαν
  choice: వారు సిలువ వేశారు
  rationale: సిలువ వేయడం అనే కార్యాన్ని నేరుగా, ప్రామాణిక ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: αὐτόν
  choice: ఆయనను
  rationale: సందర్భంలో యేసును సూచించే కర్మ సర్వనామం; గౌరవప్రదమైన తెలుగు రూపం సహజంగా సరిపోతుంది.
theological_decisions:
- issue: కాలక్రమానికి సంబంధించి సమయ సూచనను అనువదించడం
  choice: ప్రధాన పాఠ్యంలో ‘మూడవ గంట’ అని నిలుపుకోవడం
  alternative: ‘ఉదయం దాదాపు తొమ్మిది గంటలు’ అని ప్రధాన పాఠ్యంలో అనువదించడం
  rationale: వచనం ప్రాచీన సమయ సూచననే ఇస్తుంది. దానిని నిలుపుకోవడం వల్ల ఏదైనా కాలక్రమ సమన్వయాన్ని లేదా ప్రత్యేక వివరణను అనువాదంలోకి చొప్పించకుండా మూలంలోని ఉద్విగ్నతను కాపాడవచ్చు; ఆధునిక సమానార్థ సమయాన్ని పాదటిప్పణి వివరిస్తుంది.
translation_notes:
  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. మూలంలోని సమయపదాన్ని నిలిపి, పాఠకునికి అవసరమైన సాంస్కృతిక వివరణను పాదటిప్పణిలో ఇచ్చాం.
