id: MRK.15.35
reference: Mark 15:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καί τινες τῶν παρεστηκότων ἀκούσαντες ἔλεγον· ⸀Ἴδε Ἠλίαν φωνεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/035.yaml
  text: And some of those standing there[a], when they heard it, were saying, “Look, he is calling Elijah.”
translation:
  language: te
  text: అక్కడ నిలబడి ఉన్నవారిలో కొందరు అది విని, “చూడండి! ఇతడు ఏలీయాను పిలుస్తున్నాడు[a]” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇతడు ఏలీయాను రమ్మని పిలుస్తున్నాడు.”
    reason: φωνεῖ అనే క్రియను ఏలీయాను ఉద్దేశించి పిలవడం లేదా ఆయనను రమ్మని పిలవడం అనే స్వల్ప భేదంతో అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: καί
  choice: ప్రత్యేక పదంగా అనువదించకుండా వాక్యప్రవాహంలో కలిపాం
  rationale: తెలుగులో ఈ సందర్భంలో ‘మరియు’ అని ప్రారంభించడం కృత్రిమంగా ఉంటుంది; ముందటి సంఘటనతో సంబంధం వాక్యక్రమం ద్వారానే స్పష్టమవుతుంది.
- source_word: τινες τῶν παρεστηκότων
  choice: అక్కడ నిలబడి ఉన్నవారిలో కొందరు
  rationale: ఘటనాస్థలంలో నిలిచి ఉన్నవారిలో నిర్దిష్టం కాని కొందరిని సూచించే గ్రీకు భావాన్ని సహజంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: ἀκούσαντες
  choice: అది విని
  rationale: ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సహజమైన తెలుగు కాలసంబంధంతో తెలుపుతుంది; ‘అది’ యేసు పలికిన కేకను సందర్భం నుంచి సూచిస్తుంది.
- source_word: ἔλεγον
  choice: అని అన్నారు
  rationale: గ్రీకు అపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న మాటల భావాన్ని తెలుగులో అతిగా వివరించకుండా సాధారణ కథనశైలిలో అందిస్తుంది.
- source_word: Ἴδε
  choice: చూడండి!
  rationale: ఇతరుల దృష్టిని ఆకర్షించే ఆజ్ఞారూపాన్ని ఆధునిక, సహజమైన తెలుగు ప్రత్యక్ష సంభాషణగా వ్యక్తం చేస్తుంది.
- source_word: Ἠλίαν
  choice: ఏలీయాను
  rationale: ప్రవక్త పేరుకు తెలుగులో స్థిరపడిన రూపాన్ని ఉపయోగిస్తుంది.
- source_word: φωνεῖ
  choice: పిలుస్తున్నాడు
  rationale: వర్తమాన కాల భావాన్ని నిలుపుతూ, ఏలీయాను ఉద్దేశించి పిలుస్తున్నాడా లేక రమ్మని పిలుస్తున్నాడా అనే గ్రీకు వాక్యంలోని స్వల్ప అస్పష్టతను పరిష్కరించకుండా ఉంచుతుంది.
theological_decisions:
- issue: చుట్టూ ఉన్నవారు యేసు మాటను ఏలీయాకు చేసిన పిలుపుగా అపార్థం చేసుకున్నారని వివరణగా చేర్చాలా
  choice: వారు పలికిన మాటను మాత్రమే నివేదించి, అపార్థమని ప్రధాన వచనంలో వివరించలేదు
  alternative: ‘అతడు ఏలీయాను పిలుస్తున్నాడని వారు అనుకున్నారు’ అని స్పష్టీకరించడం
  rationale: గ్రీకు పాఠం వారి మాటను నేరుగా నివేదిస్తుంది; కథకుడు ఇక్కడ వారి అపార్థాన్ని వివరణాత్మకంగా పేర్కొనడు. సందర్భమే దానిని వెల్లడించనివ్వడం మూలపాఠానికి నమ్మకమైనది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి. ప్రత్యక్ష సంభాషణలో ‘చూడండి!’ సహజమైన దృష్టి ఆకర్షణ పదంగా వాడబడింది; అవసరం లేని వివరణాత్మక విస్తరణలను నివారించాం.
