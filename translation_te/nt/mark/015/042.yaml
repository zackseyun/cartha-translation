  choice: అంటే
  rationale: ఇది వివరణ ఇచ్చే సాధారణ సూత్రప్రయోగం; ఆధునిక తెలుగులో ‘అంటే’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: Καὶ
