  text: ἐγίνωσκεν γὰρ ὅτι διὰ φθόνον παραδεδώκεισαν αὐτὸν οἱ ἀρχιερεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/010.yaml
  text: For he knew that the chief priests had handed him over because of envy[a].
translation:
  language: te
  text: ఎందుకంటే, ముఖ్య యాజకులు అసూయవల్ల ఆయనను అప్పగించారని అతనికి తెలుసు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈర్ష్యవల్ల’ లేదా ‘మత్సరంతో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: అతనికి తెలుసు
  rationale: అసంపూర్ణ భూతకాల రూపం పిలాతుకు ఉన్న స్థిరమైన అవగాహనను సూచిస్తుంది; ఆధునిక తెలుగులో ‘తెలుసు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని వివరిస్తున్న అనుసంధానాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ὅτι
  choice: అని
  rationale: పిలాతుకు తెలిసిన విషయాన్ని పరిచయం చేసే సహజమైన తెలుగు పూరక అవ్యయం.
- source_word: διὰ φθόνον
  choice: అసూయతోనే
  rationale: διά + ద్వితీయా విభక్తి కారణాన్ని సూచిస్తుంది; φθόνοςకు ‘అసూయ’ సహజమైన ప్రధాన సమానార్థకం. ‘నే’ ఆ ఉద్దేశకారణాన్ని తెలుగులో స్పష్టంగా చూపుతుంది, కాని భావాన్ని మితిమీరా తీవ్రం చేయదు.
- source_word: παραδεδώκεισαν
  choice: అప్పగించారని
  rationale: పిలాతు గ్రహించిన దానికి ముందే పూర్తయిన అప్పగింతను సందర్భం తెలియజేస్తుంది. ‘అప్పగించారు’ న్యాయపరమైన అధికార బదిలీని చూపుతుంది; ‘ద్రోహం చేశారు’ అని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: αὐτὸν
  choice: ఆయనను
  rationale: యేసును సూచించే కర్మ సర్వనామం; తెలుగు బైబిలు గౌరవప్రయోగానికి అనుగుణంగా ‘ఆయనను’ వాడబడింది.
- source_word: οἱ ἀρχιερεῖς
  choice: ముఖ్య యాజకులు
  rationale: ఒకే ప్రధాన యాజకుని కాక, నాయకత్వ స్థానాల్లోని యాజక అధికారులను సూచించే ప్రామాణికమైన తెలుగు పదబంధం.
theological_decisions:
- issue: ముఖ్య యాజకుల ఉద్దేశం
  choice: యేసును అప్పగించడానికి వారి ఉద్దేశం అసూయ అని పిలాతు తెలుసుకున్నట్లు వాక్యం చెబుతుంది.
  alternative: ‘ఈర్ష్యతో’ లేదా ‘మత్సరంతో’ అని అనువదించడం.
  rationale: φθόνοςలో అసూయ/ఈర్ష్య భావపరిధి ఉంది. వచనం దీనిని పిలాతు గ్రహించిన ఉద్దేశంగా మాత్రమే చెబుతుంది; అదనపు ధార్మిక వివరణను చేర్చకుండా ఆ వాదనను యథాతథంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. ‘ఎందుకంటే’ ద్వారా వివరణాత్మక అనుసంధానం, ‘అప్పగించారు’ ద్వారా న్యాయపరమైన సందర్భం నిలుపబడ్డాయి.
