id: MRK.15.15
reference: Mark 15:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος βουλόμενος τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, καὶ παρέδωκεν τὸν Ἰησοῦν φραγελλώσας ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/015.yaml
  text: So Pilate[a], wanting to satisfy the crowd, released Barabbas to them; and after having Jesus flogged, he handed him over to be crucified.
translation:
  language: te
  text: అప్పుడు పిలాతు జనసమూహాన్ని తృప్తిపరచాలని కోరుకొని[a], బరబ్బాను వారికి విడుదల చేశాడు; యేసును కొరడాలతో కొట్టించిన తర్వాత, ఆయనను సిలువ వేయబడటానికి అప్పగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జనసమూహాన్ని సంతోషపరచాలని.” అక్షరార్థంగా, “జనసమూహానికి సరిపడేదాన్ని చేయాలని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενος
  choice: కోరుకొని
  rationale: ఈ అసమాపక క్రియ పిలాతు ఉద్దేశాన్ని లేదా అభిలాషను సూచిస్తుంది. ‘కోరుకొని’ సహజమైన ఆధునిక తెలుగు; అతని ఆలోచనా ప్రక్రియను మూలపాఠానికి మించి బలపరచదు.
- source_word: τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: జనసమూహాన్ని తృప్తిపరచాలని
  rationale: ఈ గ్రీకు నుడికారం అక్షరార్థంగా ‘జనసమూహానికి సరిపడేదాన్ని చేయడం’ అని ఉన్నా, సందర్భంలో వారి డిమాండును తీర్చి వారిని తృప్తిపరచడాన్ని సూచిస్తుంది.
- source_word: ἀπέλυσεν
  choice: విడుదల చేశాడు
  rationale: న్యాయసంబంధ సందర్భంలో ఖైదీని స్వేచ్ఛగా పంపించడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: ఈ చతుర్థీ విభక్తి జనసమూహాన్ని విడుదల నిర్ణయానికి లబ్ధిదారులుగా సూచిస్తుంది.
- source_word: παρέδωκεν
  choice: ఆయనను అప్పగించాడు
  rationale: యేసును ఇతరుల అధికారానికి అప్పగించిన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది. గ్రీకులోని కర్మ సర్వనామాన్ని తెలుగులో స్పష్టత కోసం వ్యక్తం చేశాం.
- source_word: φραγελλώσας
  choice: యేసును కొరడాలతో కొట్టించిన తర్వాత
  rationale: అనంతర చర్యకు ముందు జరిగిన క్రియను స్పష్టం చేస్తుంది. సందర్భంలో పిలాతు స్వయంగా కొట్టలేదు, కొట్టించాడనే కారక భావాన్ని ‘కొట్టించిన’ తెలియజేస్తుంది.
- source_word: ἵνα σταυρωθῇ
  choice: సిలువ వేయించడానికి
  rationale: ఈ ἵνα వాక్యభాగంలోని ఉద్దేశం/ఫలిత భావాన్ని ‘అప్పగించాడు’తో సహజంగా అనుసంధానిస్తుంది; కర్మణి భావాన్ని తెలుగులో కారక నిర్మాణం ద్వారా వ్యక్తం చేస్తుంది.
- source_word: Βαραββᾶν
  choice: బరబ్బా
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం; విభక్తి సందర్భంలో ‘బరబ్బాను’ అవుతుంది.
- source_word: Ἰησοῦν
  choice: యేసు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు రూపంలో ఇచ్చాం; కర్మ రూపంలో ‘యేసును’ అవుతుంది.
theological_decisions:
- issue: τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαιలో పిలాతు ఉద్దేశం
  choice: జనసమూహం డిమాండును తీర్చి వారిని తృప్తిపరచడం
  alternative: జనసమూహాన్ని సంతోషపరచడం; వారికి సరిపడేదాన్ని చేయడం
  rationale: ఈ నుడికారం కేవలం దయతో సేవ చేయడాన్ని కాక రాజకీయంగా జనాన్ని శాంతింపజేయడం లేదా వారి డిమాండును తీర్చడాన్ని సూచిస్తుంది. ‘తృప్తిపరచడం’ కథనంలోని నైతిక ఉద్రిక్తతను తొలగించదు.
- issue: φραγελλώσαςలో పిలాతు పాత్ర
  choice: పిలాతు యేసును కొరడాలతో కొట్టించాడు
  alternative: పిలాతు యేసును కొరడాలతో కొట్టాడు
  rationale: కర్త వ్యాకరణపరంగా పిలాతే అయినప్పటికీ, పరిపాలనా సందర్భంలో శిక్షను అతడు ఆదేశించి అమలు చేయించిన భావం ఉంది. తెలుగు కారక రూపం దీనిని సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. ‘జనసమూహం,’ ‘విడుదల చేశాడు,’ ‘అప్పగించాడు’ వంటి స్పష్టమైన పదాలను ఎంచుకున్నాం. యేసును సూచించే సర్వనామానికి గౌరవార్థకంగా ‘ఆయనను’ వాడాం.
