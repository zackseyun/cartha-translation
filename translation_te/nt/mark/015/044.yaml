source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ἐθαύμασεν εἰ ἤδη τέθνηκεν, καὶ προσκαλεσάμενος τὸν κεντυρίωνα ἐπηρώτησεν αὐτὸν εἰ ⸀πάλαι ἀπέθανεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/044.yaml
  text: But Pilate was amazed that he had already died[a], and summoning the centurion, he asked him whether he had died already.
translation:
  language: te
  text: అయితే యేసు అప్పటికే చనిపోయాడని పిలాతు ఆశ్చర్యపోయాడు. శతాధిపతిని పిలిపించి, యేసు చనిపోయి కొంతసేపు అయిందా[a] అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు అప్పటికే చనిపోయాడా?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμασεν
  choice: ఆశ్చర్యపోయాడు
  rationale: యేసు అంత త్వరగా చనిపోయాడనే వార్తపై పిలాతు పొందిన ఆశ్చర్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: εἰ ἤδη τέθνηκεν
  choice: యేసు అప్పటికే చనిపోయాడని
  rationale: εἰ ఇక్కడ పరోక్ష ప్రశ్నను సూచించినా, ఆశ్చర్యాన్ని తెలిపే క్రియతో తెలుగులో ‘అని’ సహజంగా ఉంటుంది. τέθνηκεν సంపూర్ణ క్రియ సూచించే మరణం మరియు దాని ఫలిత స్థితి రెండింటినీ ఈ వాక్యం సందర్భానుసారంగా అందిస్తుంది.
- source_word: προσκαλεσάμενος
  choice: పిలిపించి
  rationale: పిలాతు తన వద్దకు అధికారిని రప్పించుకున్న భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: κεντυρίωνα
  choice: శతాధిపతిని
  rationale: రోమా సైనిక హోదాను సూచించే κεντυρίωνకు బైబిలు తెలుగులో పరిచితమైన, చారిత్రక ప్రత్యేకతను నిలిపే పదం.
- source_word: ἐπηρώτησεν
  choice: అడిగాడు
  rationale: సరళమైన ఆధునిక కథనశైలిలో ప్రశ్నించడం లేదా విచారించడం అనే భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: εἰ πάλαι ἀπέθανεν
  choice: ఆయన కొంతసేపటి కిందటే చనిపోయాడా
  rationale: πάλαι ఇక్కడ సుదీర్ఘ గతాన్ని కాక, సిలువ మరణం జరిగినదని చెప్పబడిన సమయానికి ముందే కొంత వ్యవధి గడిచిందా అనే విచారణను సూచిస్తుంది.
