lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: δέ స్వల్ప అనుసంధాన పదం; ఇక్కడ కథనంలోని గంభీరమైన మలుపును సహజంగా సూచిస్తుంది. సందర్భానుసారం ‘మరియు’ అని కూడా అనువదించవచ్చు.
- source_word: ἀφεὶς
  choice: వేసి
  rationale: ἀφίημι అనే క్రియ φωνὴν μεγάληνతో కలిసి శబ్దాన్ని వెలువరించడం అనే భావాన్ని ఇస్తుంది; తెలుగులో ‘పెద్ద కేక వేసి’ సహజమైన ప్రయోగం.
- source_word: φωνὴν μεγάλην
  choice: పెద్ద కేక
  rationale: φωνήకు స్వరం, శబ్దం, కేక అనే అర్థాలు ఉన్నాయి; శ్రమానుభవ సందర్భంలో ‘కేక’ బలమైన స్వరాన్ని సహజంగా తెలియజేస్తుంది. μεγάλην తీవ్రత లేదా బిగ్గరతను సూచిస్తుంది.
- source_word: ἐξέπνευσεν
  choice: తుదిశ్వాస విడిచాడు
  rationale: ἐκπνέω అక్షరార్థంగా ఊపిరి బయటకు విడవడాన్ని, ఇక్కడ మరణించడాన్ని సూచిస్తుంది. ‘తుదిశ్వాస విడిచాడు’ శ్వాససంబంధ చిత్రాన్ని, వాక్య గాంభీర్యాన్ని నిలుపుతుంది.
- source_word: ὁ δὲ Ἰησοῦς
  choice: అయితే యేసు
  rationale: గ్రీకులో వ్యక్తినామానికి ముందున్న article తెలుగులో విడిగా అనువదించాల్సిన అవసరం లేదు; δέ భావాన్ని ‘అయితే’ ద్వారా తెలిపాం.
theological_decisions:
- issue: యేసు మరణాన్ని అదనపు వేదాంత భావం చేర్చకుండా అనువదించడం
  choice: తుదిశ్వాస విడిచాడు
  alternative: చనిపోయాడు; ప్రాణం విడిచాడు
  rationale: ఈ పదబంధం గ్రీకు క్రియలోని శ్వాస చిత్రాన్ని నిలుపుతూ మరణాన్ని స్పష్టంగా తెలియజేస్తుంది. ‘ఆత్మను అప్పగించాడు’ అనడం ఇతర సువార్తల పదప్రయోగాన్ని ఇక్కడికి తీసుకువచ్చి అదనపు భావాన్ని చేర్చవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. ‘పెద్ద కేక వేసి’ సాధారణ పాఠకులకు స్పష్టంగా ఉండగా, ‘తుదిశ్వాస విడిచాడు’ మూలంలోని శ్వాస చిత్రాన్ని కాపాడుతుంది.
