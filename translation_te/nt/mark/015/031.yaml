source:
  edition: SBLGNT
  text: ὁμοίως καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες πρὸς ἀλλήλους μετὰ τῶν γραμματέων ἔλεγον· Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/031.yaml
  text: In the same way the chief priests[a], mocking among themselves with the scribes, were saying, “He saved others; he cannot save himself.”
translation:
  language: te
  text: అదే విధంగా ప్రధాన యాజకులు కూడా శాస్త్రులతో కలిసి తమలో తాము ఎగతాళి చేస్తూ[a], “ఇతరులను రక్షించాడు; తనను తాను రక్షించుకోలేడు” అని చెబుతూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శాస్త్రులతో కలిసి ప్రధాన యాజకులు ఒకరితో ఒకరు ఎగతాళిగా మాట్లాడుకుంటూ ఉన్నారు.” గ్రీకు పదబంధం ప్రధాన యాజకులు పరస్పరం మాట్లాడుకున్నారనే అంశాన్ని నొక్కిచెప్పవచ్చు; శాస్త్రులు కూడా వారితో కలిశారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: అదే విధంగా
  rationale: ముందటి వచనాల్లోని ఎగతాళికి సమాంతరంగా ఇప్పుడు మతనాయకుల ఎగతాళిని పరిచయం చేసే పోలిక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: ఏకకాలంలో అనేకమంది ప్రధాన యాజకుల పదవిలో ఉన్నారని సూచించకుండా, ప్రముఖ యాజక అధికారులను సూచించే స్థిరమైన తెలుగు పదబంధం.
- source_word: ἐμπαίζοντες
  choice: ఎగతాళి చేస్తూ
  rationale: అవహేళనతో కూడిన పరిహాస భావాన్ని సంక్షిప్తంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: πρὸς ἀλλήλους
  choice: తమలో తాము
  rationale: వారు ఒకరితో ఒకరు మాట్లాడుకుంటున్న పరస్పర భావాన్ని సహజంగా తెలియజేస్తుంది; వారు ఒకరినొకరు ఎగతాళి చేశారనే అపార్థాన్ని తగ్గిస్తుంది.
- source_word: μετὰ τῶν γραμματέων
  choice: శాస్త్రులతో కలిసి
  rationale: శాస్త్రులు కూడా ప్రధాన యాజకులతో కలిసి ఈ ఎగతాళిలో పాలుపంచుకున్నారని చూపుతుంది.
- source_word: ἔλεγον
  choice: అని అంటూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న లేదా పునరావృతమైన మాటను తెలుగులో నిలుపుతుంది.
- source_word: Ἄλλους
  choice: ఇతరులను
  rationale: యేసు రక్షించిన లేదా విడిపించిన ఇతర వ్యక్తులను నేరుగా సూచిస్తుంది.
- source_word: ἔσωσεν
  choice: రక్షించాడు
  rationale: σῴζωలోని రక్షించడం, విడిపించడం అనే విస్తృత భావంతో పాటు ఈ సందర్భంలోని వ్యంగ్యమైన రక్షణ భావాన్ని కూడా నిలుపుతుంది.
- source_word: ἑαυτὸν
  choice: తనను తాను
  rationale: గ్రీకు ఆత్మవాచక సర్వనామాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా అందిస్తుంది.
- source_word: οὐ δύναται σῶσαι
  choice: రక్షించుకోలేడు
  rationale: అసమర్థతను సహజంగా వ్యక్తం చేస్తూ, ముందటి ‘రక్షించాడు’ అనే క్రియతో ఉన్న పదపునరుక్తిని నిలుపుతుంది.
theological_decisions:
- issue: రెండు ఉపవాక్యాల్లోనూ σῴζωను ఒకే మూలభావంతో అనువదించడం
  choice: రక్షించాడు ... రక్షించుకోలేడు
  alternative: విడిపించాడు ... విడిపించుకోలేడు
  rationale: ఒకే తెలుగు క్రియామూలాన్ని ఉపయోగించడం ద్వారా గ్రీకు పదపునరుక్తి, అపహాస్యంలోని వ్యంగ్యం, అలాగే ‘రక్షణ’ అనే విస్తృత భావం నిలుస్తాయి; సందర్భం అనుమతించేదానికంటే సంకుచితమైన సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి పాటించబడింది. సాధారణ పాఠకులకు అర్థమయ్యే ‘ప్రధాన యాజకులు,’ ‘శాస్త్రులు,’ ‘రక్షించాడు’ వంటి స్థిరమైన పదాలు వాడబడ్డాయి. πρὸς ἀλλήλους మరియు μετὰ τῶν γραμματέων మధ్య ఉన్న నిర్మాణాత్మక అస్పష్టతను ప్రధాన పాఠ్యంలో సహజంగా ఉంచి, పాదటిప్పణిలో ప్రత్యామ్నాయ దృష్టిని తెలిపాం.
