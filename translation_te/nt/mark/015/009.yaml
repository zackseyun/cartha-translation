id: MRK.15.9
reference: Mark 15:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ἀπεκρίθη αὐτοῖς λέγων· Θέλετε ἀπολύσω ὑμῖν τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/009.yaml
  text: But Pilate answered them[a], saying, “Do you want me to release to you the King of the Jews?”
translation:
  language: te
  text: 'అయితే పిలాతు వారికి జవాబిచ్చి వారితో ఇలా అన్నాడు: “నేను యూదుల రాజును మీకు విడుదల చేయాలని మీరు కోరుతున్నారా?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదయా ప్రజల రాజును.” గ్రీకు పదం Ἰουδαίωνకు “యూదులు” లేదా “యూదయా ప్రజలు” అనే అర్థాలు రావచ్చు. అయితే శ్రమవృత్తాంతంలోని ఈ స్థిర బిరుదులో “యూదులు” అనేది సంప్రదాయబద్ధమైన, సందర్భోచితమైన అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ δέ కథనాన్ని ముందుకు నడిపిస్తూ పిలాతు ప్రతిస్పందనను పరిచయం చేస్తుంది. తెలుగులో ‘అప్పుడు’ సహజమైన కథన అనుసంధానం; బలమైన వ్యతిరేకతను అనవసరంగా చేర్చదు.
- source_word: ἀπεκρίθη αὐτοῖς λέγων
  choice: వారికి జవాబిస్తూ … అని అడిగాడు
  rationale: గ్రీకు వాక్యంలోని ప్రతిస్పందన భావాన్ని ‘వారికి జవాబిస్తూ’ నిలుపుతూ, ప్రత్యక్ష ప్రశ్నను తెలుగులో సహజంగా ముగించేందుకు ‘అని అడిగాడు’ వాడబడింది.
- source_word: Θέλετε
  choice: మీరు కోరుతున్నారా?
  rationale: θέλω ఇక్కడ కోరిక లేదా అభిలాషను సూచిస్తుంది. ‘కోరుతున్నారా’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగాను గౌరవప్రదంగాను ఉంది.
- source_word: ἀπολύσω ὑμῖν
  choice: మీ కోసం విడుదల చేయాలని
  rationale: న్యాయపరమైన సందర్భంలో ἀπολύω అంటే నిర్బంధం నుంచి విడుదల చేయడం. ὑμῖν యొక్క ప్రయోజనార్థక భావాన్ని తెలుగులో సహజంగా ‘మీ కోసం’ వ్యక్తం చేస్తుంది.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: యూదుల రాజును
  rationale: మార్కు శ్రమవృత్తాంతంలో ఇది రాజకీయంగా, వ్యంగ్యార్థ ఛాయతో వినిపించే స్థిరమైన బిరుదు. ‘యూదుల రాజు’ తెలుగు బైబిలు వాడుకలో గుర్తించదగినదిగా ఉండి సందర్భానికి సరిపోతుంది.
theological_decisions:
- issue: τὸν βασιλέα τῶν Ἰουδαίων అనే బిరుదు
  choice: యూదుల రాజు
  alternative: యూదయుల రాజు
  rationale: Ἰουδαῖοι అనే పదం ‘యూదులు’ లేదా ప్రాంతీయంగా ‘యూదయులు’ అని అర్థమవవచ్చు. అయితే శ్రమవృత్తాంతంలోని ఈ స్థిర రాజకీయ బిరుదులో ‘యూదుల రాజు’ సంప్రదాయబద్ధంగా, సందర్భోచితంగా ఉంది; ఇది అనువాదకుడు చేర్చిన సిద్ధాంత ప్రకటన కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే కథన గాంభీర్యాన్ని నిలుపుతూ రూపొందించబడింది. ప్రశ్నార్థక గుర్తు తర్వాతే పాదసూచిక గుర్తు ఉంచబడింది.
