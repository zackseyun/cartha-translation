id: MRK.15.24
reference: Mark 15:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸂σταυροῦσιν αὐτὸν καὶ⸃ διαμερίζονται τὰ ἱμάτια αὐτοῦ, βάλλοντες κλῆρον ἐπ’ αὐτὰ τίς τί ἄρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/024.yaml
  text: And they crucify him and divide his garments among themselves[a], casting lots for them to decide what each would take.
translation:
  language: te
  text: వారు ఆయనను సిలువ వేస్తారు; ఆయన వస్త్రాలను తమలో తాము పంచుకుంటూ, వారిలో ఎవరు ఏది తీసుకోవాలో వాటికోసం చీట్లు వేస్తారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మూలంలోని పదక్రమాన్ని మరింత నేరుగా అనుసరిస్తే: “వాటిపై చీట్లు వేస్తూ—ఎవరు ఏది తీసుకోవాలో.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σταυροῦσιν
  choice: సిలువ వేస్తారు
  rationale: గ్రీకు వర్తమాన కాలంలోని చారిత్రక వర్తమాన ప్రయోగాన్ని నిలుపుతూ, మార్కు కథనంలోని సజీవతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: διαμερίζονται
  choice: తమలో తాము పంచుకుంటారు
  rationale: వస్త్రాలను వేర్వేరు వాటాలుగా చేసుకుని తీసుకోవడం అనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἱμάτια
  choice: వస్త్రాలు
  rationale: దుస్తులుగా ధరించే వస్తువులను సూచించే స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: βάλλοντες κλῆρον
  choice: చీట్లు వేస్తారు
  rationale: యాదృచ్ఛిక పద్ధతిలో ఎవరికేది రావాలో నిర్ణయించే ఆచారాన్ని తెలుగులో సాధారణంగా తెలిపే నుడికారం.
- source_word: ἐπ’ αὐτὰ
  choice: వాటిపై
  rationale: చీట్లు వేయబడిన విషయం ముందుగా ప్రస్తావించిన వస్త్రాలేనని మూలంలోని సంబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: τίς τί ἄρῃ
  choice: ఎవరు ఏది తీసుకోవాలో
  rationale: τίς మరియు τί పదాల పంపిణీ భావాన్ని—ఏ వ్యక్తి ఏ వస్తువును తీసుకోవాలి అన్నదాన్ని—సంక్షిప్తంగా, స్పష్టంగా కాపాడుతుంది.
theological_decisions:
- issue: శ్రమల కథనంలో చారిత్రక వర్తమాన కాలం
  choice: ‘సిలువ వేస్తారు’, ‘పంచుకుంటారు’, ‘చీట్లు వేస్తారు’ అనే వర్తమాన రూపాలను నిలుపుట
  alternative: ‘సిలువ వేశారు’, ‘పంచుకున్నారు’, ‘చీట్లు వేశారు’ అనే భూతకాల రూపాలు
  rationale: మార్కు ఉపయోగించిన వర్తమాన కాలపు కథన సజీవతను నిలుపుతుంది; దీనివల్ల అదనపు సిద్ధాంతార్థం ఏదీ చేర్చబడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన కథన శైలి. గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగులోనూ వర్తమాన క్రియారూపాలతో నిలిపాం; చీట్ల ఉద్దేశాన్ని స్పష్టంగా చెప్పినా మూలంలోని ‘ఎవరు ఏది’ అనే పంపిణీ నిర్మాణాన్ని మార్చలేదు.
