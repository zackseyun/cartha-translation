revisions:
- from: వారు ఆయనను సిలువ వేస్తారు. ఆయన వస్త్రాలను తమలో తాము పంచుకుంటారు; ఎవరు ఏది తీసుకోవాలో నిర్ణయించడానికి వాటిపై చీట్లు వేస్తారు.[a]
  to: వారు ఆయనను సిలువ వేస్తారు; ఆయన వస్త్రాలను తమలో తాము పంచుకుంటూ, వారిలో ఎవరు ఏది తీసుకోవాలో వాటికోసం చీట్లు వేస్తారు.[a]
  rationale: The revision replaces a wooden locative expression with idiomatic Telugu while preserving the referent of ἐπ’ αὐτά. It keeps the historical-present narration, the concrete reference to garments, and the distributive force of “who [takes] what.” The footnote retains the more literal source-order alternative and remains anchored to the relevant phrase.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:15:22Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the three main actions and retains Mark’s historical presents. However, Telugu “వాటిపై చీట్లు వేస్తారు” is overly physical and less idiomatic for ἐπ’ αὐτά with lot-casting; “వాటికోసం చీట్లు వేస్తారు” naturally conveys that the garments are the objects being allocated. The revised wording also retains the Greek distributive ambiguity of τίς τί ἄρῃ without adding interpretive detail.
  naturalness: “తమలో తాము పంచుకుంటారు” is natural and appropriately formal. Joining the lot-casting participle more closely to the division produces smoother modern standard Telugu. “వారిలో ఎవరు ఏది తీసుకోవాలో” is clear, idiomatic, and preserves the who/what distribution.
  terminology: “సిలువ వేస్తారు,” “వస్త్రాలు,” and “చీట్లు వేస్తారు” are suitable modern standard Telugu terms in this solemn narrative register. No doctrinally loaded terminology has been introduced.
  issues:
  - severity: low
    issue: “వాటిపై చీట్లు వేస్తారు” is semantically possible but idiomatically stiff in Telugu.
    rationale: In this context ἐπ’ αὐτά identifies the garments as the items for which lots are cast. “వాటికోసం” states this relationship naturally without altering the meaning.
  - severity: low
    issue: The draft separates the participial lot-casting action into an independent final clause.
    rationale: This does not substantially distort the sense, but linking it with “పంచుకుంటూ” better reflects the Greek’s connected sequence of dividing garments and casting lots.
  revised_text: వారు ఆయనను సిలువ వేస్తారు; ఆయన వస్త్రాలను తమలో తాము పంచుకుంటూ, వారిలో ఎవరు ఏది తీసుకోవాలో వాటికోసం చీట్లు వేస్తారు.[a]
