  text: And the curtain of the temple was torn in two[b][a], from top to bottom.
translation:
  language: te
  text: మరియు ఆలయపు తెర[a][b] పై నుంచి కిందివరకు రెండుగా చినిగిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆలయపు ముసుగు.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పదం మరింత నిర్దిష్టంగా ఆలయ అంతర్భాగాన్ని, అంటే పరిశుద్ధ స్థలాన్ని, సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταπέτασμα
  choice: తెర
  rationale: ఆలయంలో వేలాడదీసిన తెరను సూచిస్తుంది. ఆధునిక తెలుగులో ‘తెర’ సహజంగా, స్పష్టంగా ఉండి, వచనంలో లేని ప్రతీకాత్మక అర్థాన్ని చేర్చదు.
- source_word: ναοῦ
  choice: ఆలయపు
  rationale: ναός మరింత నిర్దిష్టంగా ఆలయ అంతర్భాగాన్ని లేదా పరిశుద్ధ స్థలాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో సహజమైన ‘ఆలయపు’ను ఉంచి, ఆ నిర్దిష్టతను పాదసూచికలో తెలిపాం.
- source_word: ἐσχίσθη
  choice: చినిగిపోయింది
  rationale: σχίζω యొక్క భూతకాల కర్మణి రూపం తెర చినిగిన సంఘటనను తెలియజేస్తుంది. ‘చినిగిపోయింది’ తెలుగులో సహజమైన కర్మణి భావాన్ని ఇస్తుంది; చర్య చేసినవారిని వచనం స్పష్టంగా పేర్కొనదు.
- source_word: εἰς δύο
  choice: రెండుగా
  rationale: రెండు భాగాలుగా విడిపోవడాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: పై నుండి కింది వరకు
  rationale: చినిగిన దిశను, దాని పూర్తి విస్తృతిని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: καὶ
  choice: అప్పుడు
  rationale: మునుపటి సంఘటనతో కథన సంబంధాన్ని సహజ తెలుగులో చూపుతుంది. ఇది బలమైన కారణార్థాన్ని చేర్చకుండా కథన పురోగతిని తెలియజేస్తుంది.
theological_decisions:
- issue: ఆలయపు తెర చినగడంలోని ప్రతీకాత్మక ప్రాముఖ్యత
  choice: సంఘటనను మాత్రమే వర్ణించి, దాని ప్రతీకాత్మక అర్థాన్ని ప్రధాన పాఠ్యంలో వివరించలేదు.
  alternative: ఇది దేవుని సన్నిధికి ప్రవేశాన్ని సూచిస్తుందని లేదా ఆలయ వ్యవస్థపై తీర్పును సూచిస్తుందని అనువాదంలోనే వివరించడం.
  rationale: ఈ వచనం సంఘటనను నివేదిస్తుంది గాని దాని వేదాంతపరమైన అర్థాన్ని ప్రత్యక్షంగా నిర్ధారించదు. అందువల్ల సాధ్యమైన వివరణల మధ్య ఉన్న ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే కథన శైలి. ప్రధాన పాఠ్యంలో సంక్షిప్తతను కాపాడుతూ మూలంలోని పదార్థ సంబంధిత ప్రత్యామ్నాయాలను పాదసూచికల్లో నిలిపాం.
