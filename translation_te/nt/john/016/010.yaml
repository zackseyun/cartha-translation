review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the principal terms, including δικαιοσύνη as “నీతి,” πρός τὸν πατέρα as movement to the Father, and the future-oriented present ὑπάγω. However, the final “కాబట్టి” is placed so that it can be read as making the disciples’ no-longer-seeing Jesus the result of his going, rather than presenting both clauses as the explanatory ground introduced by ὅτι. The additive δέ is also best represented in Telugu by “కూడా” in this continuing list.
  naturalness: The wording is generally modern and clear. Recasting the sentence with “కూడా” and placing “కాబట్టి” after the first explanatory clause produces a more natural Telugu rendering while retaining the compact, dependent structure of this clause within Jesus’ larger statement.
  terminology: “నీతి” is an appropriate primary rendering for δικαιοσύνη here. “న్యాయం” should remain in the footnote as a legitimate lexical alternative. The footnote’s explanation is adjusted to state Jesus’ vindication more idiomatically and without overstating the interpretation.
  issues:
  - severity: medium
    issue: The placement of “కాబట్టి” gives unclear scope to the Greek ὅτι clause.
    rationale: In the draft, “ఇక మీరు నన్ను చూడరు కాబట్టి” may be understood as the reason for Jesus’ going, or as a disconnected final causal phrase. The Greek presents Jesus’ going to the Father and the disciples’ no longer seeing him together in explanation of “righteousness.”
  - severity: low
    issue: The additive force of δέ is not expressed.
    rationale: Although Telugu can sometimes leave this implicit, “కూడా” naturally marks this as the next item in the sequence of vv. 9–11.
  revised_text: 'నీతి[a] గురించి కూడా: నేను తండ్రి దగ్గరికి వెళ్తున్నాను కాబట్టి, ఇక మీరు నన్ను చూడరు;'
  revised_footnotes:
