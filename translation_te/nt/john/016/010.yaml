id: JHN.16.10
reference: John 16:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: περὶ δικαιοσύνης δέ, ὅτι πρὸς τὸν ⸀πατέρα ὑπάγω καὶ οὐκέτι θεωρεῖτέ με·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/010.yaml
  text: and concerning righteousness[a], because I am going to the Father and you no longer see me.
translation:
  language: te
  text: 'నీతి[a] గురించి కూడా: నేను తండ్రి దగ్గరికి వెళ్తున్నాను కాబట్టి, ఇక మీరు నన్ను చూడరు;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “న్యాయం.” గ్రీకు పదం నీతి, న్యాయం అనే రెండు భావాలనూ సూచించగలదు. ఇక్కడ యేసు తండ్రి దగ్గరికి వెళ్లడం ఆయన నీతిమంతుడని సమర్థించబడటంతో సంబంధం కలిగి ఉన్న సందర్భంలో ప్రధాన పాఠ్యంలో “నీతి” అని ఇచ్చాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δικαιοσύνης δέ
  choice: నీతి గురించి
  rationale: δέ ఇక్కడ వ్యతిరేకతకన్నా జాబితాలోని తదుపరి అంశాన్ని సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండానే ‘నీతి గురించి’ అనడం ఆ కొనసాగింపును సహజంగా తెలియజేస్తుంది.
- source_word: δικαιοσύνης
  choice: నీతి
  rationale: δικαιοσύνηకు నీతి, న్యాయం అనే భావపరిధి ఉంది. ఈ సందర్భంలో యేసు తండ్రి దగ్గరికి వెళ్లడం ద్వారా ఆయన సరైనవాడని వెల్లడయ్యే భావానికి ‘నీతి’ ప్రధాన పాఠ్యంలో బాగా సరిపోతుంది; ‘న్యాయం’ను పాదసూచికలో ఉంచాం.
- source_word: ὅτι
  choice: కాబట్టి
  rationale: ఇక్కడ ὅτι కారణాన్ని పరిచయం చేస్తుంది. తెలుగు పదక్రమంలో కారణ వాక్యభాగం చివర ‘కాబట్టి’ ఉంచడం సహజంగా ఉంటుంది.
- source_word: πρὸς τὸν πατέρα
  choice: తండ్రి దగ్గరికి
  rationale: చలనాన్ని సూచించే ὑπάγωతో πρός గమ్యాన్ని తెలియజేస్తుంది. మూలంలో ‘నా తండ్రి’ కాక ‘తండ్రి’ ఉన్నందున అదే సంబంధపదాన్ని నిలిపాం.
- source_word: ὑπάγω
  choice: వెళ్తున్నాను
  rationale: వర్తమాన రూపం సందర్భంలో సమీప భవిష్యత్తు భావాన్ని కలిగిస్తుంది. ‘వెళ్తున్నాను’ ఆ తక్షణతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: οὐκέτι θεωρεῖτέ με
  choice: ఇక మీరు నన్ను చూడరు
  rationale: οὐκέτι ఇకపై కొనసాగని స్థితిని సూచిస్తుంది; θεωρέω ఇక్కడ దృశ్యంగా చూడడాన్ని సూచిస్తుంది. ‘ఇక ... చూడరు’ స్పష్టమైన సహజ తెలుగు.
theological_decisions:
- issue: δικαιοσύνη అనే ధార్మికంగా ప్రాముఖ్యమైన పదం
  choice: నీతి
  alternative: న్యాయం
  rationale: ఈ పదం నీతి మరియు న్యాయం రెండింటినీ సూచించగలదు. తండ్రి దగ్గరికి వెళ్లే యేసుకు లభించే సమర్థన ఈ సందర్భంలో ముందున్నందున ప్రధాన పాఠ్యంలో ‘నీతి’ని ఎంచుకున్నాం; అయినా మూలపదపు విస్తృతిని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ఇది 9–11 వచనాల్లోని జాబితా భాగమని చూపేందుకు చివర సెమికోలన్ ఉంచబడింది; మూలంలోని కారణ సంబంధం మరియు అనిశ్చితి కాపాడబడ్డాయి.
