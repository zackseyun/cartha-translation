revisions:
- from: నీతి[a] గురించి—నేను తండ్రి దగ్గరికి వెళ్తున్నాను, ఇక మీరు నన్ను చూడరు కాబట్టి;
  to: 'నీతి[a] గురించి కూడా: నేను తండ్రి దగ్గరికి వెళ్తున్నాను కాబట్టి, ఇక మీరు నన్ను చూడరు;'
  rationale: The revision preserves the source’s list continuation, causal explanation, and both coordinated clauses, while making their relationship clearer in modern standard Telugu. It retains the lexical ambiguity of δικαιοσύνη in the footnote.
