  text: and concerning judgment[c][b][a], because the ruler of this world has been judged.
translation:
  language: te
  text: తీర్పు విషయమై, ఎందుకంటే ఈ లోకపు అధిపతి[a][b]కి తీర్పు తీర్చబడి ఉంది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ లోకపు పాలకుడు.’
    reason: lexical_alternative
  - marker: b
    text: ఇది సాతానును సూచిస్తున్నట్లు తెలుస్తుంది; యోహాను 12:31; 14:30 చూడండి.
    reason: cross_reference
  - marker: c
    text: లేదా, ‘తీర్పు తీర్చబడి ఉన్నాడు.’ గ్రీకు పరిపూర్ణ కాలరూపం ఇప్పటికే జరిగిన తీర్పును, దాని కొనసాగుతున్న ఫలితాన్ని నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ κρίσεως
  choice: తీర్పు గురించి కూడా
  rationale: περί + షష్ఠీ విభక్తి చర్చాంశాన్ని సూచిస్తుంది; δέ ఇక్కడ అనుసంధాన భావాన్ని ఇస్తుంది. κρίσιςకు ‘తీర్పు’ నేరమైన, సందర్భోచితమైన పదం.
- source_word: ὅτι
  choice: కాబట్టి
  rationale: ఇక్కడ ὅτι ముందున్న ‘తీర్పు గురించి’ అనే అంశానికి కారణాన్ని తెలియజేస్తుంది; తెలుగు వాక్యక్రమంలో చివర ‘కాబట్టి’ సహజంగా ఆ కారణ సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: ὁ ἄρχων
  choice: అధిపతి
  rationale: ἄρχων అధికారం చలాయించే పాలకుణ్ణి సూచిస్తుంది. ‘అధిపతి’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, రాజవంశీయ ‘యువరాజు’ అనే అనవసర భావాన్ని కలిగించదు.
- source_word: τοῦ κόσμου τούτου
  choice: ఈ లోకపు
  rationale: యోహాను రచనల్లో κόσμοςకు సాధారణంగా ‘లోకం’ సరైన సమానార్థకం; τούτου సూచించే ‘ఈ’ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: κέκριται
  choice: తీర్పు పొందాడు
  rationale: ఇది κρίνω యొక్క perfect passive indicative రూపం. ‘తీర్పు పొందాడు’ కర్మణి భావాన్నీ, పూర్తయి ప్రభావం కొనసాగుతున్న తీర్పునూ సాధ్యమైనంత సహజంగా నిలుపుతుంది; ‘దోషిగా తీర్చబడ్డాడు’ అని అనువదించడం మూలపద పరిధిని కుదిస్తుంది.
theological_decisions:
- issue: ‘ఈ లోకపు అధిపతి’ ఎవరు?
  choice: ప్రధాన పాఠ్యంలో ‘ఈ లోకపు అధిపతి’ అనే బిరుదునే ఉంచడం.
  alternative: ‘ఈ లోకపు అధిపతియైన సాతాను’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం.
  rationale: యోహాను 12:31; 14:30 ప్రకారం ఈ మాట సాతానును సూచిస్తున్నట్లు తెలుస్తుంది; అయితే ఈ వచనం స్వయంగా పేరును కాక బిరుదును వాడుతుంది. అందువల్ల ప్రధాన పాఠ్యం మూలంలోని వ్యక్తీకరణను నిలుపుతుంది.
- issue: κέκριται యొక్క భావవ్యాప్తి
  choice: ‘తీర్పు పొందాడు’ అని అనువదించడం.
  alternative: ‘దోషిగా తీర్చబడ్డాడు’ లేదా ‘శిక్షకు గురయ్యాడు’ అని అనువదించడం.
  rationale: సందర్భంలో ప్రతికూల తీర్పు సూచితమైనప్పటికీ, κρίνω అనే పదం స్వయంగా ‘దోషిగా తీర్చడం’ కంటే విస్తృతమైనది. మూలంలోని భావవ్యాప్తిని, దైవశాస్త్ర సంబంధమైన ఉద్రిక్తతను నిలుపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ముందున్న సమాంతర అంశాలైన పాపం, నీతి, తీర్పు అనే క్రమాన్ని దృష్టిలో ఉంచి ‘తీర్పు గురించి కూడా’ అని ఇచ్చాం. మూల గ్రీకు వాక్యంలోని కారణ సంబంధాన్ని తెలుగుకు సహజమైన వాక్యక్రమంలో అమర్చాం.
