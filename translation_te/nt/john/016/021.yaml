id: JHN.16.21
reference: John 16:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ γυνὴ ὅταν τίκτῃ λύπην ἔχει, ὅτι ἦλθεν ἡ ὥρα αὐτῆς· ὅταν δὲ γεννήσῃ τὸ παιδίον, οὐκέτι μνημονεύει τῆς θλίψεως διὰ τὴν χαρὰν ὅτι ἐγεννήθη ἄνθρωπος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/021.yaml
  text: When a woman is giving birth[a], she has sorrow because her hour has come; but when she has given birth to the child, she no longer remembers the distress because of the joy that a child has been born into the world.
translation:
  language: te
  text: ఒక స్త్రీ ప్రసవిస్తున్నప్పుడు, ఆమె గడియ వచ్చిందని ఆమెకు దుఃఖం కలుగుతుంది. అయితే బిడ్డను కన్న తర్వాత, ఒక మానవుడు[a] లోకంలోకి జన్మించాడనే ఆనందం వల్ల ఆమె ఆ వేదనను ఇక జ్ఞాపకం చేసుకోదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదం ‘మగవాడు’ అని లేదా సాధారణంగా ‘మానవుడు’ అని అర్థం ఇవ్వగలదు; ఇక్కడ అది ప్రత్యేకంగా మగబిడ్డను సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γυνή
  choice: ఒక స్త్రీ
  rationale: ఇది ప్రసవం గురించిన సాధారణ ఉదాహరణ; అందువల్ల ‘భార్య’ కంటే ‘స్త్రీ’ సందర్భానికి సరిపోతుంది.
- source_word: ὅταν τίκτῃ
  choice: ప్రసవిస్తున్నప్పుడు
  rationale: ὅτανతో కూడిన వర్తమాన సుబ్జంక్టివ్ సాధారణంగా ప్రసవ ప్రక్రియ కొనసాగుతున్న సందర్భాన్ని సూచిస్తుంది.
- source_word: λύπην ἔχει
  choice: ఆమెకు దుఃఖం కలుగుతుంది
  rationale: λύπη శారీరక నొప్పికే పరిమితం కాకుండా దుఃఖం, మనోవేదనను కూడా సూచిస్తుంది; తదుపరి ఆనందంతో ఉన్న వ్యత్యాసాన్ని ఇది నిలుపుతుంది.
- source_word: ἡ ὥρα αὐτῆς
  choice: తన గడియ
  rationale: ప్రసవానికి నిర్ణయమైన సమయాన్ని సహజంగా సూచిస్తూనే, యోహాను రచనలో ὥραకు ఉండే భావప్రాధాన్యాన్ని ‘గడియ’ నిలుపుతుంది.
- source_word: γεννήσῃ τὸ παιδίον
  choice: బిడ్డను కన్న తర్వాత
  rationale: అయోరిస్ట్ రూపం పూర్తయిన ప్రసవాన్ని సూచిస్తుంది; ‘కన్న తర్వాత’ ఆధునిక తెలుగులో సహజంగా ఆ పూర్తయిన ఘటనను వ్యక్తం చేస్తుంది.
- source_word: οὐκέτι μνημονεύει τῆς θλίψεως
  choice: ఆమె ఇక ఆ బాధను జ్ఞాపకం చేసుకోదు
  rationale: μνημονεύει యొక్క జ్ఞాపకార్థాన్ని నిలుపుతూ, ప్రసవ సందర్భంలో θλῖψις సూచించే తీవ్రమైన బాధను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: διὰ τὴν χαράν
  choice: ఆనందం వల్ల
  rationale: అక్యూసేటివ్‌తో వచ్చిన διά కారణాన్ని తెలియజేస్తుంది.
- source_word: ἄνθρωπος
  choice: ఒక మనిషి
  rationale: ἄνθρωπος ఇక్కడ కొత్తగా పుట్టిన మానవ వ్యక్తిని సాధారణార్థంలో సూచిస్తుంది; ‘మనిషి’ మూలంలోని మానవత్వ సూచనను నిలుపుతుంది.
- source_word: εἰς τὸν κόσμον
  choice: లోకంలో
  rationale: తెలుగులో ‘లోకంలో పుట్టాడు’ అనేది సహజ ప్రయోగం; మూలంలోని లోకంలోకి జన్మించడం అనే భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: ἄνθρωπος యొక్క సాధారణ మానవార్థం
  choice: ఒక మనిషి[a]
  alternative: ఒక మగవాడు; ఒక బిడ్డ
  rationale: ఈ సందర్భంలో వ్యాకరణపరంగా పుంలింగమైన ἄνθρωπος ప్రత్యేకంగా మగబిడ్డను కాకుండా మానవ వ్యక్తిని సాధారణంగా సూచిస్తుంది. ప్రధాన పాఠం మూలపదాన్ని ప్రతిబింబించగా, పాదసూచిక ఆ లింగసంబంధ అస్పష్టతను వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యనిర్మాణాన్ని ఉపయోగిస్తూ, యోహాను సువార్తలోని ‘గడియ’ అనే భావప్రతిధ్వనిని నిలుపుకున్నాం. ‘దుఃఖం’ మరియు ‘ఆనందం’ మధ్య వ్యత్యాసాన్ని స్పష్టంగా ఉంచి, ἄνθρωπος యొక్క సాధారణ మానవార్థాన్ని పాదసూచికతో వివరించాం.
