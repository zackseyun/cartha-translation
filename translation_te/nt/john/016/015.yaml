id: JHN.16.15
reference: John 16:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάντα ὅσα ἔχει ὁ πατὴρ ἐμά ἐστιν· διὰ τοῦτο εἶπον ὅτι ἐκ τοῦ ἐμοῦ λαμβάνει καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/015.yaml
  text: Everything that the Father has is mine[a]. That is why I said that he takes from what is mine and will declare it to you.
translation:
  language: te
  text: 'తండ్రికి ఉన్నదంతా నాదే. అందుకే నేను చెప్పాను: ఆయన నాదైన దానిలోనుంచి తీసుకుంటాడు[a], దానిని మీకు తెలియజేస్తాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాదైన దానిలోనుంచి పొందుతాడు.”
    reason: λαμβάνει అనే గ్రీకు క్రియకు ‘తీసుకుంటాడు’తో పాటు ‘పొందుతాడు’ అనే అర్థం కూడా సందర్భానుసారంగా సాధ్యమవుతుంది.
lexical_decisions:
- source_word: πάντα ὅσα
  choice: ఉన్నదంతా
  rationale: సమస్తాన్ని సూచించే గ్రీకు పదబంధంలోని సమగ్ర భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔχει ὁ πατὴρ
  choice: తండ్రికి ఉన్న
  rationale: ἔχω అనే క్రియలోని ‘కలిగి ఉండడం’ అనే సాధారణ భావాన్ని తెలుగులో సహజంగా అందిస్తుంది; ‘తండ్రి కలిగి ఉన్న’ కంటే ఇది సాధారణ పాఠకులకు సులభంగా ఉంటుంది.
- source_word: ἐμά ἐστιν
  choice: నాదే
  rationale: స్వామ్యాన్ని బలంగా తెలిపే గ్రీకు విధానాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: διὰ τοῦτο
  choice: అందుకే
  rationale: ముందటి వాక్యం నుంచి వచ్చే కారణాత్మక నిర్ధారణను స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: εἶπον
  choice: నేను చెప్పాను
  rationale: గ్రీకు భూతకాల క్రియను నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: నాదైన దానిలోనుంచి
  rationale: గ్రీకులో అంతర్లీనంగా ఉన్న ‘నాకు చెందినది’ అనే భావాన్ని తెలుగులో స్పష్టం చేస్తూ, మూలంలోని స్వామ్య సంబంధాన్ని కాపాడుతుంది.
- source_word: λαμβάνει
  choice: తీసుకుంటాడు
  rationale: λαμβάνωకు ఇక్కడ సాధ్యమైన ‘తీసుకోవడం’ అనే భావాన్ని ప్రధాన పాఠ్యంలో ఉంచింది; ‘పొందుతాడు’ అనే స్వీకార భావాన్ని పాదసూచికలో నిలిపింది.
- source_word: ἀναγγελεῖ
  choice: తెలియజేస్తాడు
  rationale: భవిష్యత్ క్రియలోని ప్రకటన/వెల్లడి భావాన్ని సాధారణ ఆధునిక తెలుగులో గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: శిష్యులను ఉద్దేశించిన దత్తి విభక్తి భావాన్ని నేరుగా అందిస్తుంది.
theological_decisions:
- issue: తండ్రికి ఉన్న సమస్తంతో కుమారుని సంబంధం
  choice: తండ్రికి ఉన్నదంతా నాదే
  alternative: తండ్రికి ఉన్నదంతా నాకు చెందుతుంది
  rationale: మూలపాఠ్యంలోని బలమైన స్వామ్య వాదనను తరువాతి సిద్ధాంత పదజాలాన్ని చేర్చకుండా యథాతథంగా నిలుపుతుంది.
- issue: కుమారునికి చెందినదానినుంచి ఆత్మ తీసుకోవడం లేదా పొందడం
  choice: తీసుకుంటాడు
  alternative: పొందుతాడు
  rationale: λαμβάνει అనే పదం ‘తీసుకుంటాడు’ లేదా ‘పొందుతాడు’ అనే రెండు భావాలకు అవకాశం ఇస్తుంది. ప్రధాన పాఠ్యంలో మొదటి భావాన్ని ఉంచి, రెండవదాన్ని పాదసూచికలో ఇవ్వడం ద్వారా మూలంలోని భావసంభావ్యతను అనవసరంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘నాదే’ మూలంలోని బలాన్ని నిలుపుతుంది; ‘నాదైన దానిలోనుంచి’ గ్రీకు పదబంధంలోని సంక్షిప్తతను తెలుగులో అవసరమైనంత స్పష్టం చేస్తుంది. పాదసూచిక గుర్తు సంబంధిత క్రియ తర్వాత ప్రధాన పాఠ్యంలో ఉంచబడింది.
