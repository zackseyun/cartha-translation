id: JHN.16.30
reference: John 16:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: νῦν οἴδαμεν ὅτι οἶδας πάντα καὶ οὐ χρείαν ἔχεις ἵνα τίς σε ἐρωτᾷ· ἐν τούτῳ πιστεύομεν ὅτι ἀπὸ θεοῦ ἐξῆλθες.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/030.yaml
  text: Now we know that you know all things and have no need that anyone should question you[a]. By this we believe that you came from God.
translation:
  language: te
  text: ఇప్పుడు నీకు అన్నీ తెలుసనీ, ఎవరైనా నిన్ను ప్రశ్నించాల్సిన అవసరం నీకు లేదనీ మాకు తెలుసు.[a] దీనివల్ల నీవు దేవుని నుండి వచ్చావని మేము నమ్ముతున్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎవరైనా నిన్ను అడగాల్సిన అవసరం నీకు లేదు.” గ్రీకు క్రియకు ‘అడుగు’ లేదా ‘ప్రశ్నించు’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: ఇప్పుడు
  rationale: శిష్యులకు ప్రస్తుతం కలిగిన అవగాహనను సూచించే కాలవాచక క్రియావిశేషణానికి సహజమైన, సంక్షిప్తమైన అనువాదం.
- source_word: οἴδαμεν
  choice: మాకు తెలుసు
  rationale: οἶδα రూపం వర్తమానార్థంలో ‘తెలుసు’ అని అర్థమిస్తుంది; తెలుగులో ఈ నిర్మాణం సహజంగా ఉంటుంది.
- source_word: οἶδας πάντα
  choice: నీకు అన్నీ తెలుసు
  rationale: πάντα యొక్క సమగ్ర భావాన్ని సరళంగా, విస్తరించకుండా నిలుపుతుంది.
- source_word: οὐ χρείαν ἔχεις
  choice: అవసరం నీకు లేదు
  rationale: గ్రీకులోని ‘అవసరం కలిగి ఉండడం లేదు’ అనే నామవాచక నిర్మాణంలోని ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἵνα τίς σε ἐρωτᾷ
  choice: ఎవరైనా నిన్ను ప్రశ్నించాల్సిన
  rationale: ἐρωτάωకు ‘అడుగు’ లేదా ‘ప్రశ్నించు’ అనే అర్థాలు రావచ్చు. యేసు జ్ఞానం మరియు శిష్యుల మనసులోని ప్రశ్నలు సందర్భం కావడంతో ‘ప్రశ్నించు’ ఎంచుకోబడింది; ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: ἐν τούτῳ
  choice: దీనివల్ల
  rationale: శిష్యుల నమ్మకానికి ఆధారం లేదా నిదర్శనాన్ని సూచించే భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πιστεύομεν
  choice: మేము నమ్ముతున్నాం
  rationale: ఒప్పుకోలు వంటి ఈ సందర్భంలో πιστεύω యొక్క సాధారణ భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ θεοῦ
  choice: దేవుని నుండి
  rationale: మూలపాఠం ‘దేవుని నుండి’ అని మాత్రమే చెబుతుంది; ‘తండ్రి నుండి’ అని ప్రత్యేకీకరించకుండా దానినే నిలుపుతుంది.
- source_word: ἐξῆλθες
  choice: వచ్చావు
  rationale: ఇక్కడ యేసు మూలం లేదా పంపబడడాన్ని సూచించే ἐξέρχομαιకు ‘దేవుని నుండి వచ్చావు’ అనేది సహజమైన తెలుగు ప్రయోగం.
theological_decisions:
- issue: ‘నీకు అన్నీ తెలుసు’ అనే మాటలోని క్రీస్తు సంబంధిత భావం
  choice: శిష్యుల ప్రకటనను వివరణాత్మక విస్తరణ లేకుండా యథార్థంగా నిలుపడం
  alternative: ‘నీవు సర్వజ్ఞుడవు’ అని సిద్ధాంతపరంగా విస్తరించడం
  rationale: వాక్యం యేసు జ్ఞానం గురించి శిష్యుల ఒప్పుకోలును అందిస్తుంది. దాని బలాన్ని నిలుపుతూ, గ్రీకులో లేని సిద్ధాంతపరమైన వివరణను అనువాదంలో చేర్చలేదు.
- issue: ἀπὸ θεοῦ ἐξῆλθες యొక్క భావం
  choice: నీవు దేవుని నుండి వచ్చావు
  alternative: నీవు తండ్రి నుండి వచ్చావు
  rationale: ఈ పదబంధం దైవిక మూలం లేదా పంపబడడాన్ని సూచిస్తుంది. సమీప సందర్భంతో ‘తండ్రి’ అని సమన్వయపరచకుండా, ఈ వాక్యంలో ఉన్న ‘దేవుడు’ అనే పదాన్నే అనువదించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన శైలిని ఉపయోగించింది. ‘నీకు/నీవు’ రూపాలు యేసును ఉద్దేశించిన బైబిలు తెలుగు సంభాషణలో సహజంగా ఉండి, అనవసరమైన గౌరవ బహువచనాన్ని చేర్చవు.
