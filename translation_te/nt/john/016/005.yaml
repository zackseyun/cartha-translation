id: JHN.16.5
reference: John 16:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: νῦν δὲ ὑπάγω πρὸς τὸν πέμψαντά με καὶ οὐδεὶς ἐξ ὑμῶν ἐρωτᾷ με· Ποῦ ὑπάγεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/005.yaml
  text: But now I am going to the one who sent me, and none of you asks me, ‘Where are you going?’
translation:
  language: te
  text: కానీ ఇప్పుడు నేను నన్ను పంపినవాడి వద్దకు వెళ్తున్నాను. ‘మీరు ఎక్కడికి వెళ్తున్నారు?’ అని మీలో ఎవరూ నన్ను అడగడం లేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: కానీ ఇప్పుడు
  rationale: δέ సూచించే సందర్భ విరుద్ధతను నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: ὑπάγω
  choice: నేను వెళ్తున్నాను
  rationale: ప్రస్తుతకాలంలో ఉన్న గమనార్థాన్ని సహజమైన కొనసాగుతున్న ప్రయాణ భావంతో వ్యక్తం చేస్తుంది; కేవలం ‘విడిచిపోతున్నాను’ అనే అర్థానికి పరిమితం చేయదు.
- source_word: πρὸς τὸν πέμψαντά με
  choice: నన్ను పంపినవాని దగ్గరికి
  rationale: గ్రీకులోని వ్యక్తిని సూచించే విశేషణార్థక కృదంతాన్ని సహజంగా అనువదిస్తూ, మూలంలో లేని ‘తండ్రి’ అనే పదాన్ని చేర్చదు.
- source_word: πέμψαντά
  choice: పంపిన
  rationale: యోహాను సువార్తలోని పంపడం/దౌత్య భావాన్ని అతిగా వ్యాఖ్యానించకుండా నేరుగా అందిస్తుంది.
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: మీలో ఎవరూ
  rationale: భాగసూచక నిర్మాణాన్నీ సంపూర్ణ నిరాకరణనూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐρωτᾷ με
  choice: నన్ను అడగడం లేదు
  rationale: ఇక్కడ ἐρωτάω ప్రశ్న అడగడాన్ని సూచిస్తుంది; ‘విచారించడం’ కంటే ఇది సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: Ποῦ ὑπάγεις;
  choice: నువ్వు ఎక్కడికి వెళ్తున్నావు?
  rationale: ప్రత్యక్ష ప్రశ్నను, గమన దిశను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘నన్ను పంపినవాడు’ ఎవరు?
  choice: మూలంలోని సాధారణ వ్యక్తి సూచనను అనుసరించి ‘నన్ను పంపినవాని’ అని అనువదించడం
  alternative: ‘నన్ను పంపిన తండ్రి దగ్గరికి’ అని స్పష్టీకరించడం
  rationale: యోహాను సువార్త సందర్భంలో ఆ వ్యక్తి తండ్రి అని స్పష్టమైనప్పటికీ, ఈ వాక్యంలో గ్రీకు పాఠం ‘తండ్రి’ అని ప్రత్యక్షంగా చెప్పదు. కాబట్టి అనువాదం మూలంలోని వ్యక్తీకరణనే కాపాడుతుంది.
- issue: ‘మీలో ఎవరూ నన్ను అడగడం లేదు’ మరియు యోహాను 13:36 మధ్య కనిపించే ఉద్రిక్తత
  choice: ఈ వాక్యంలోని సంపూర్ణ నిరాకరణను యథాతథంగా నిలుపడం
  alternative: ‘ఇప్పుడు మీలో ఎవరూ’ లేదా ‘నిజంగా ఎవరూ’ వంటి వివరణాత్మక పదాలతో ఉద్రిక్తతను సవరించడం
  rationale: οὐδεὶς అనే పదం సంపూర్ణ నిరాకరణను వ్యక్తం చేస్తుంది. ముందటి ప్రశ్నతో ఉన్న సందర్భ సంబంధాన్ని అనువాదంలోనే పరిష్కరించకుండా, పాఠంలోని ఉద్రిక్తతను నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన శైలి. యేసు తన శిష్యులతో సన్నిహితంగా మాట్లాడుతున్న సందర్భానికి అనుగుణంగా ఉల్లేఖనంలోని ఏకవచన సంబోధనకు ‘నువ్వు’ వాడబడింది.
