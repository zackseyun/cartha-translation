id: JHN.16.7
reference: John 16:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ ἐγὼ τὴν ἀλήθειαν λέγω ὑμῖν, συμφέρει ὑμῖν ἵνα ἐγὼ ἀπέλθω. ἐὰν ⸀γὰρ μὴ ἀπέλθω, ὁ παράκλητος ⸂οὐ μὴ ἔλθῃ⸃ πρὸς ὑμᾶς· ἐὰν δὲ πορευθῶ, πέμψω αὐτὸν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/007.yaml
  text: 'But I am telling you the truth: it is better for you that I go away. For if I do not go away[a], the Advocate will certainly not come to you; but if I go, I will send him to you.'
translation:
  language: te
  text: 'అయితే నేను మీకు నిజం చెబుతున్నాను: నేను వెళ్లిపోవడమే మీకు మేలు. ఎందుకంటే నేను వెళ్లిపోకపోతే, సహాయకుడు[a] మీ దగ్గరకు ఎంతమాత్రమూ రాడు; కానీ నేను వెళితే, ఆయనను మీ దగ్గరకు పంపుతాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పక్షాన వాదించేవాడు,” “సలహాదారు,” లేదా “ఆదరణకర్త” అని కూడా అనువదించవచ్చు; గ్రీకులో ‘పారాక్లేతోస్.’
    reason: παράκλητος అనే పదంలోని విస్తృత భావపరిధిని ఒకే తెలుగు పదం పూర్తిగా తెలియజేయలేనందున ముఖ్యమైన ప్రత్యామ్నాయ అర్థాలను ఇస్తుంది.
lexical_decisions:
- source_word: ἀλλ’
  choice: అయితే
  rationale: మునుపటి సందర్భంలో శిష్యుల దుఃఖానికి భిన్నమైన సత్యాన్ని పరిచయం చేసే సహజమైన వ్యతిరేక సంధానంగా ఉంది.
- source_word: τὴν ἀλήθειαν λέγω ὑμῖν
  choice: నేను మీకు నిజం చెబుతున్నాను
  rationale: గంభీరమైన సత్యప్రకటన భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: συμφέρει ὑμῖν ἵνα ἐγὼ ἀπέλθω
  choice: నేను వెళ్లిపోవడమే మీకు మేలు
  rationale: సంఘటన శిష్యులకు ప్రయోజనకరమనే భావాన్ని స్పష్టంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది; ἵνα ఉపవాక్యాన్ని ప్రయోజనకరమైన విషయంగా అందిస్తుంది.
- source_word: ὁ παράκλητος
  choice: సహాయకుడు
  rationale: యేసు తరఫున వచ్చి శిష్యులకు తోడుగా పనిచేసే వ్యక్తిగత పాత్రను సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది. గ్రీకు పదంలోని పక్షవాది, సలహాదారు, ఆదరణకర్త వంటి విస్తృత భావాలను పాదసూచికలో భద్రపరచాం.
- source_word: οὐ μὴ ἔλθῃ
  choice: ఎంతమాత్రమూ రాడు
  rationale: οὐ μήతో ఉన్న బలమైన నిరాకరణను గౌరవప్రదమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐὰν δὲ πορευθῶ
  choice: కానీ నేను వెళితే
  rationale: మునుపటి షరతుకు విరుద్ధమైన రెండవ షరతును సహజంగా అందిస్తుంది; πορεύομαιను సందర్భానుసారంగా ‘వెళ్లు’ అని అనువదించింది.
- source_word: πέμψω αὐτὸν πρὸς ὑμᾶς
  choice: ఆయనను మీ దగ్గరకు పంపుతాను
  rationale: పంపబడే వ్యక్తి శిష్యుల వద్దకు రావడాన్ని నేరుగా వ్యక్తం చేస్తూ, αὐτόνలోని వ్యక్తిగత పురుష సూచనను ‘ఆయనను’గా నిలుపుతుంది.
theological_decisions:
- issue: యోహాను రచనల్లో παράκλητος అనే బిరుదు అనువాదం
  choice: సహాయకుడు
  alternative: పక్షవాది; సలహాదారు; ఆదరణకర్త; పారాక్లేతోస్
  rationale: ఏ ఒక్క తెలుగు పదమూ παράκλητος యొక్క పూర్తి భావవ్యాప్తిని అందించదు. ఈ వీడ్కోలు ప్రసంగ సందర్భంలో ‘సహాయకుడు’ సహజంగా, విస్తృతంగా అర్థమవుతుంది; ఇతర ముఖ్య భావాలను పాదసూచికలో ఉంచడం ద్వారా మూలంలోని భావసంపదను సంకుచితం చేయలేదు.
- issue: παράκλητοςను సూచించే αὐτόν యొక్క వ్యక్తిగత భాష
  choice: ఆయనను
  alternative: దానిని
  rationale: గ్రీకు వాక్యం παράκλητοςను పంపబడే వ్యక్తిగత కర్తగా సూచిస్తుంది. ‘ఆయనను’ ఆ వ్యక్తిగత సూచనను నిలుపుతుంది; పరిశుద్ధాత్మ గురించిన సిద్ధాంతాన్ని వాక్యానికి మించి విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన సంభాషణ శైలిని వాడాం. ‘వెళ్లిపోవడం/వెళ్లిపోకపోతే’ అనే పునరుక్తిని మూలానికి అనుగుణంగా నిలిపి, చివరి πορευθῶను సహజంగా ‘వెళితే’ అని అందించాం. బలమైన నిరాకరణను ‘ఎంతమాత్రమూ రాడు’గా వ్యక్తం చేశాం.
