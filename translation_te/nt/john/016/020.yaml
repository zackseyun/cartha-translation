id: JHN.16.20
reference: John 16:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι κλαύσετε καὶ θρηνήσετε ὑμεῖς, ὁ δὲ κόσμος χαρήσεται· ⸀ὑμεῖς λυπηθήσεσθε, ἀλλ’ ἡ λύπη ὑμῶν εἰς χαρὰν γενήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/020.yaml
  text: Truly[a], truly, I say to you, you will weep and mourn, but the world will rejoice; you will be grieved, but your grief will become joy.
translation:
  language: te
  text: '“నిజంగా, నిజంగా నేను మీతో చెప్తున్నాను: మీరు ఏడుస్తారు, విలపిస్తారు; అయితే లోకం సంతోషిస్తుంది. మీరు దుఃఖపడతారు, కాని మీ దుఃఖం ఆనందమవుతుంది.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ దుఃఖం ఆనందంగా మారుతుంది.”
    reason: εἰς χαρὰν γενήσεται అనే గ్రీకు పదబంధాన్ని తెలుగులో సహజంగా వ్యక్తపరచగల ప్రత్యామ్నాయ రూపం.
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: నిజంగా, నిజంగా
  rationale: యేసు మాటలోని గంభీరమైన ధృవీకరణను, గ్రీకు మూలంలోని పునరుక్తిని నిలుపుతూ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో చెప్తున్నాను
  rationale: యోహాను సువార్తలో మళ్లీ మళ్లీ కనిపించే ప్రత్యక్ష సంబోధన సూత్రాన్ని సహజమైన తెలుగులో దగ్గరగా ప్రతిబింబిస్తుంది.
- source_word: κλαύσετε
  choice: మీరు ఏడుస్తారు
  rationale: బహిరంగంగా కన్నీరు పెట్టే దుఃఖాన్ని స్పష్టంగా తెలియజేస్తుంది; తరువాతి θρηνήσετεతో ఉన్న భేదాన్ని కూడా నిలుపుతుంది.
- source_word: θρηνήσετε
  choice: విలపిస్తారు
  rationale: ఏడవడం కంటే ఉద్దేశపూర్వకంగా శోకాన్ని వ్యక్తం చేయడాన్ని సూచించి, రెండు గ్రీకు క్రియలను ఒకే అర్థంలో కలిపివేయదు.
- source_word: ὁ δὲ κόσμος
  choice: అయితే లోకం
  rationale: δὲ సూచించే వ్యత్యాసాన్ని నిలుపుతూ, κόσμοςకు వ్యాఖ్యానాత్మక విశేషణం జోడించకుండా యోహాను వాడే విస్తృత పదాన్నే ఉంచుతుంది.
- source_word: χαρήσεται
  choice: సంతోషిస్తుంది
  rationale: శిష్యుల దుఃఖానికి ఎదురుగా లోకం పొందే ఆనందాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: λυπηθήσεσθε
  choice: మీరు దుఃఖపడతారు
  rationale: భవిష్యత్తులో వారు దుఃఖాన్ని అనుభవిస్తారనే భావాన్ని సహజంగా వ్యక్తపరుస్తూ, తరువాతి λύπηతో పదసంబంధాన్ని నిలుపుతుంది.
- source_word: ἡ λύπη ὑμῶν
  choice: మీ దుఃఖం
  rationale: ముందటి దుఃఖపడతారు అనే క్రియతో మూలపద సంబంధాన్ని తెలుగులోనూ స్పష్టంగా నిలుపుతుంది.
- source_word: εἰς χαρὰν γενήσεται
  choice: ఆనందమవుతుంది
  rationale: εἰς + γενήσεται సూచించే పరివర్తనను సంక్షిప్తంగా, మూల నిర్మాణానికి దగ్గరగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: యోహాను సువార్తలో κόσμος పదప్రయోగం
  choice: లోకం
  alternative: అవిశ్వాస లోకం / దేవునికి విరోధమైన లోక వ్యవస్థ
  rationale: ఈ సందర్భంలో లోకం శిష్యులకు వ్యతిరేకంగా సంతోషించే సమూహాన్ని సూచించినా, వచనం దానిని మరింత నిర్దిష్టంగా నిర్వచించదు. అందువల్ల వ్యాఖ్యానాన్ని వచనంలో చేర్చకుండా మూలంలోని విస్తృతమైన, ఉద్విగ్నతను నిలిపే పదాన్ని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా వచన గంభీరతను నిలుపుతూ రూపొందించబడింది. ‘నిజంగా, నిజంగా’ అనే పునరుక్తి యోహాను సువార్తలోని ప్రత్యేక ధృవీకరణ సూత్రాన్ని కాపాడుతుంది. విరామచిహ్నాలు వాక్యంలోని వ్యత్యాసాలను స్పష్టంగా చూపుతాయి.
