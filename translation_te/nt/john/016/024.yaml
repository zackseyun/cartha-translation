  yaml_path: translation/nt/john/016/024.yaml
  text: Until now you have asked for nothing in my name[a]. Ask, and you will receive[c][b], so that your joy may be full.
translation:
  language: te
  text: ఇప్పటివరకు మీరు నా నామంలో[a] ఏదీ అడగలేదు. అడగండి[b], మీరు పొందుతారు; అప్పుడు మీ ఆనందం నిండుగా ఉంటుంది.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా నామంలో’ అంటే యేసు వ్యక్తిత్వం, అధికారం, కార్యంతో సంబంధం కలిగి అడగడం అని సూచించవచ్చు; ప్రధాన పాఠం ఈ అర్థాన్ని ఒక్క వివరణకు పరిమితం చేయదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అడుగుతూ ఉండండి.’ ఇక్కడి వర్తమాన ఆజ్ఞార్థక రూపం సందర్భంలో కొనసాగించే లేదా మళ్లీ మళ్లీ చేసే చర్యను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘మీ ఆనందం పరిపూర్ణంగా ఉంటుంది.’ మూలంలోని మాట సంపూర్ణతతోపాటు నిండుదల భావాన్నీ కలిగి ఉంది.
    reason: lexical_alternative
