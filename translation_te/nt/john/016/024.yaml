theological_decisions:
- issue: ‘నా నామంలో’ ప్రార్థించడం అనే మాట యొక్క భావం
  choice: ‘నా నామంలో’ అనే రూపాన్ని యథాతథంగా నిలుపడం
  alternative: నా తరఫున; నా అధికారంతో; నాతో ఐక్యంగా
  rationale: ఈ మాట యేసు వ్యక్తిత్వం, అధికారం, కార్యం వంటి పరస్పర సంబంధిత భావాలను కలిగి ఉంది. వాటిలో ఒక్కదానికే పరిమితం చేయకుండా మూలంలోని దైవశాస్త్రపరమైన విస్తృతిని నిలుపుతుంది.
- issue: ἵνα సూచించే ఉద్దేశం లేదా ఫలితం
  choice: ‘అలా’ అని అనువదించి రెండింటికీ అవకాశం ఉంచడం
  alternative: ‘మీ ఆనందం పరిపూర్ణమయ్యే ఉద్దేశంతో’ అని కేవలం ఉద్దేశార్థంగా చెప్పడం
  rationale: ἵνα ఇక్కడ ఉద్దేశం మరియు ఫలితం మధ్య భావసంబంధాన్ని కలిగి ఉండవచ్చు; అనువాదం దానిని అనవసరంగా ఒకే వైపుకు తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వాక్య గౌరవాన్ని నిలుపుతూ రూపొందించబడింది. ‘నామంలో’ అనే బైబిలీయమైన పదబంధం దాని దైవశాస్త్రపరమైన విస్తృతిని కాపాడటానికి ఉంచబడింది.
