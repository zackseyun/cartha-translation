source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ἐκεῖνος ἐλέγξει τὸν κόσμον περὶ ἁμαρτίας καὶ περὶ δικαιοσύνης καὶ περὶ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/008.yaml
  text: And when that one comes[c][b][a], he will convict the world concerning sin and concerning righteousness and concerning judgment.
translation:
  language: te
  text: ఆయన వచ్చినప్పుడు[a], పాపం గురించి, నీతి గురించి[b], తీర్పు గురించి లోకాన్ని దోషిగా నిరూపిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకులో ‘ఆయన’ స్థానంలో ఉద్ఘాటనగల నిర్దేశక సర్వనామం ఉంది; భావం: ‘ఆయన వచ్చినప్పుడు, ఆయనే…’.'
    reason: lexical_alternative
  - marker: b
    text: ‘నీతి’కి ‘న్యాయం’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθὼν
  choice: వచ్చి
  rationale: కాలసంబంధ భావమున్న భూతకాల అసమాపక క్రియను తెలుగులో సహజమైన పూర్వకాలిక క్రియారూపంతో వ్యక్తం చేస్తుంది; ‘వచ్చినప్పుడు’ అని కూడా అనువదించవచ్చు.
- source_word: ἐκεῖνος
  choice: ఆయన
  rationale: సమీప సందర్భంలోని ఆదరణకర్తను సూచించే గ్రీకు నిర్దేశక సర్వనామం. తెలుగులో గౌరవార్థక ‘ఆయన’ సహజంగా ఉండి వ్యక్తిగత సూచనను నిలుపుతుంది; గ్రీకులోని ప్రత్యేక ఉద్ఘాటనను పాదసూచిక తెలియజేస్తుంది.
- source_word: ἐλέγξει
  choice: దోషిగా నిరూపిస్తాడు
  rationale: తప్పును బయటపెట్టి, దోషాన్ని స్థాపించడం అనే నైతిక-న్యాయ భావాన్ని వ్యక్తం చేస్తుంది. కేవలం ‘గద్దిస్తాడు’ కంటే ఈ సందర్భంలో విస్తృతమైన భావాన్ని నిలుపుతుంది.
- source_word: τὸν κόσμον
  choice: లోకాన్ని
  rationale: యోహాను రచనలోని విస్తృతమైన θεological ప్రతిధ్వనిని అతిగా వివరణ చేయకుండా సంప్రదాయబద్ధమైన, సహజమైన పదంతో నిలుపుతుంది.
- source_word: περὶ
  choice: గురించి
  rationale: మూడు సార్లు పునరావృతమైన గ్రీకు నిర్మాణాన్ని తెలుగులోనూ సమాంతరంగా, సహజంగా నిలుపుతుంది.
- source_word: ἁμαρτίας
  choice: పాపం
  rationale: గ్రీకు ఏకవచనాన్ని అలాగే నిలుపుతున్న ప్రామాణిక సమానార్థకం.
- source_word: δικαιοσύνης
  choice: నీతి
  rationale: సరైన స్థితి లేదా న్యాయసమ్మతత అనే విస్తృత భావాన్ని మోయగల సహజమైన తెలుగు పదం; తరువాతి వచనంలోని క్రీస్తుసంబంధ వివరణకు సరిపోతుంది.
- source_word: κρίσεως
  choice: తీర్పు
  rationale: న్యాయపరమైన మరియు అంత్యకాల సంబంధ విస్తృతిని నిలుపుతుంది; ఫలితాన్ని ముందుగానే ‘శిక్షావిధి’గా కుదించదు.
theological_decisions:
- issue: ἐκεῖνος యొక్క సూచన మరియు ఉద్ఘాటన
  choice: సమీప సందర్భంలోని ఆదరణకర్తను సూచిస్తూ ‘ఆయన’ అని అనువదించడం; ఉద్ఘాటనను పాదసూచికలో తెలియజేయడం.
  alternative: ‘ఆ వ్యక్తి’ లేదా ‘ఆయనే’ అని ప్రధాన పాఠ్యంలో ఉద్ఘాటించడం.
  rationale: ‘ఆయన’ ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంటుంది. ‘ఆ వ్యక్తి’ ఇక్కడ అసహజంగా లేదా దూరభావంతో వినిపించవచ్చు; ‘ఆయనే’ అయితే గ్రీకులో ఉన్నదానికంటే విరుద్ధతను ఎక్కువగా సూచించే ప్రమాదం ఉంది.
- issue: δικαιοσύνη యొక్క అనువాదం
  choice: నీతి
  alternative: న్యాయం
  rationale: 16:10లో యేసు తండ్రి దగ్గరకు వెళ్లడమనే వివరణతో ‘నీతి’ బాగా సరిపోతుంది; ‘న్యాయం’ సాధ్యమైన భావాన్ని సూచించినా, ఇక్కడ దానికే పరిమితం చేయడం తగదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని పాపం–నీతి–తీర్పు అనే త్రివిధ సమాంతర నిర్మాణం నిలుపబడింది.
