id: JHN.16.13
reference: John 16:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅταν δὲ ἔλθῃ ἐκεῖνος, τὸ πνεῦμα τῆς ἀληθείας, ὁδηγήσει ὑμᾶς ⸂ἐν τῇ ἀληθείᾳ πάσῃ⸃, οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ, ἀλλ’ ὅσα ⸀ἀκούσει λαλήσει, καὶ τὰ ἐρχόμενα ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/013.yaml
  text: But when he[a], the Spirit of truth, comes, he will guide you into all the truth. For he will not speak from himself, but whatever he hears he will speak[d][c][b], and he will declare to you the things that are coming.
translation:
  language: te
  text: అయితే ఆయన—సత్యపు ఆత్మ—వచ్చినప్పుడు, మిమ్మల్ని సత్యమంతటిలోకి[a] నడిపిస్తాడు. ఎందుకంటే ఆయన తనంతట తానే[b] మాట్లాడడు; ఏది వింటాడో అదే మాట్లాడతాడు. రాబోయే సంగతులను[c] ఆయన మీకు తెలియజేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సత్యమంతటిలో.’ గ్రీకులోని ἐν సాధారణంగా ‘లో’ అని అర్థమిస్తుంది; అయితే ‘నడిపించు’తో కలిసి దిశను కూడా సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, ‘తన నుండి మాట్లాడడు’; భావార్థంగా, ‘తన సొంతగా మాట్లాడడు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘రానున్నవి’ / ‘రాబోయేది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: అయితే ... వచ్చినప్పుడు
  rationale: ὅταν తెలిపే భవిష్యదభిముఖ కాలసంబంధ భావాన్ని ‘వచ్చినప్పుడు’ సహజంగా వ్యక్తం చేస్తుంది; δέను ముందటి సందర్భంతో ఉన్న స్వల్ప వ్యత్యాసంగా ‘అయితే’తో ఉంచాం.
- source_word: ἔλθῃ ἐκεῖνος
  choice: ఆయన ... వచ్చినప్పుడు
  rationale: ἐκεῖνος పుంలింగ వ్యక్తిసూచనను గౌరవప్రదమైన వ్యక్తివాచక సర్వనామం ‘ఆయన’తో నిలిపాం; ὅτανతో కూడిన aorist subjunctiveను సహజమైన భవిష్యదర్థ కాలవాక్యంగా అనువదించాం.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: సత్యపు ఆత్మ
  rationale: యోహాను రచనలోని ఈ విశేషణాత్మక నామాన్ని, genitive సంబంధాన్ని ‘సత్యపు’గా ఉంచి, ‘ఆత్మ’ను వ్యక్తిసూచనతో అనుసంధానించాం; ‘సత్యస్వరూపియైన’ అని మార్చి genitiveను అనవసరంగా నిర్ధారించలేదు.
- source_word: ὁδηγήσει ὑμᾶς ἐν τῇ ἀληθείᾳ πάσῃ
  choice: మిమ్మల్ని సత్యమంతటిలోకి నడిపిస్తాడు
  rationale: ὁδηγέω యొక్క మార్గనిర్దేశ రూపకాన్ని ‘నడిపిస్తాడు’గా, πάσῃతో కూడిన నిర్దిష్టమైన ἀληθείᾳను ‘సత్యమంతటిలోకి’గా ఇచ్చాం. ἐν యొక్క స్థితివాచక సాధ్యతను పాదసూచికలో నిలిపాం.
- source_word: οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ
  choice: ఎందుకంటే ఆయన తనంతట తానే మాట్లాడడు
  rationale: γάρను కారణసూచకంగా, ἀφ’ ἑαυτοῦను స్వతంత్ర మూలం లేదా స్వచొరవ భావం రెండింటినీ అనుమతించే సహజ తెలుగు నుడికారంతో అనువదించాం; మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἀλλ’ ὅσα ἀκούσει λαλήσει
  choice: ఏది వింటాడో అదే మాట్లాడతాడు
  rationale: వినడం-మాట్లాడడం మధ్యనున్న పరస్పర సంబంధాన్ని, అలాగే గ్రీకు భవిష్యత్ రూపాల భావాన్ని సహజ తెలుగు నిర్మాణంలో నిలిపాం.
- source_word: τὰ ἐρχόμενα ἀναγγελεῖ ὑμῖν
  choice: రాబోయే సంగతులను ఆయన మీకు తెలియజేస్తాడు
  rationale: τὰ ἐρχόμεναను ముందున్న వాస్తవాలు లేదా సంఘటనలుగా విస్తృతంగా ఉండే ‘రాబోయే సంగతులు’తో, ἀναγγελεῖను ప్రకటనాత్మకమైనా సహజమైన ‘తెలియజేస్తాడు’తో అనువదించాం.
theological_decisions:
- issue: ఆత్మకు వ్యక్తివాచక సూచన
  choice: ‘ఆయన’ అనే గౌరవప్రదమైన వ్యక్తివాచక సర్వనామం వాడటం
  alternative: సర్వనామాన్ని తప్పించి ప్రతిసారి ‘ఆత్మ’ అని పునరుక్తి చేయడం
  rationale: నపుంసకలింగ πνεῦμαతో పాటు మూలపాఠం పుంలింగ ἐκεῖνοςను ఉపయోగిస్తుంది. ‘ఆయన’ ఆ వ్యక్తిసూచనను నిలుపుతుంది; పాఠానికి వెలుపలి సిద్ధాంత వివరణను జోడించదు.
- issue: ἐν τῇ ἀληθείᾳ πάσῃ దిశావాచకమా, స్థితివాచకమా
  choice: ప్రధాన పాఠంలో ‘సత్యమంతటిలోకి’
  alternative: ‘సత్యమంతటిలో’
  rationale: ὁδηγέωతో కలిసినప్పుడు దిశావాచక భావం సహజంగా ఉంటుంది; అయితే ἐν యొక్క సాధారణ స్థితివాచక అర్థం నిజమైన ప్రత్యామ్నాయం కాబట్టి పాదసూచికలో ఉంచాం.
- issue: ἀφ’ ἑαυτοῦ యొక్క భావపరిధి
  choice: ‘తనంతట తానే’
  alternative: ‘తన నుండి’
  rationale: తెలుగులో ప్రధాన పాఠం స్వతంత్రంగా లేదా స్వచొరవతో మాట్లాడటం లేదనే భావాన్ని సహజంగా ఇస్తుంది. మూలపదబంధంలోని ‘నుండి’ భావాన్ని పాదసూచిక కాపాడుతుంది; ‘తన అధికారంతో’ అని చెప్పి భావాన్ని అతిగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. appositionను స్పష్టంచేయడానికి em dashలు వాడాం. ‘సత్యస్వరూపియైన’ అనే మరింత వ్యాఖ్యానాత్మక రూపానికి బదులు ‘సత్యపు ఆత్మ’తో genitive సంబంధాన్ని తెరిచి ఉంచాం; ‘ప్రకటిస్తాడు’ కంటే సాధారణ పాఠకునికి సహజమైన ‘తెలియజేస్తాడు’ను ఎంచుకున్నాం.
