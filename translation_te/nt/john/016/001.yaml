    text: లేదా ‘పడిపోకుండా,’ ‘అభ్యంతరపడకుండా.’ ఈ గ్రీకు క్రియ తడబడేలా చేయబడటం, అభ్యంతరపడటం, లేదా అవిశ్వాసానికి/వైదొలగడానికి దారితీసే తడబాటును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: ఈ సంగతులు
  rationale: నపుంసక బహువచన సూచక సర్వనామం యేసు ఇంతకుముందు చెప్పిన మాటలను సూచిస్తుంది; బహువచనాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: λελάληκα
  choice: చెప్పాను
  rationale: λαλέω యొక్క పరిపూర్ణ వర్తమాన రూపం. తెలుగులో ‘చెప్పాను’ సహజంగా గతంలో పలికిన మాటలు ప్రస్తుత సందర్భానికి వర్తిస్తున్న భావాన్ని మోస్తుంది; ‘మాట్లాడి ఉన్నాను’ అసహజంగా ఉంటుంది.
- source_word: ὑμῖν
  choice: మీతో
  rationale: ద్వితీయ పురుష బహువచన దత్తివాచకం. మాటలు చెప్పే క్రియతో ‘మీతో చెప్పాను’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి బహువచనాన్నీ స్పష్టం చేస్తుంది.
- source_word: ἵνα μὴ
  choice: …పోకుండా ఉండాలని
  rationale: ప్రతికూల ఉద్దేశాన్ని తెలిపే ἵνα μὴ నిర్మాణాన్ని సహజమైన తెలుగు ఉద్దేశార్థక నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: σκανδαλισθῆτε
  choice: విశ్వాసం నుంచి తొలగిపోకుండా
  rationale: హింసను ముందుగా హెచ్చరిస్తున్న సందర్భంలో ఈ క్రియ విశ్వాసంలో కూలిపోవడం లేదా దానిని విడిచిపెట్టడం అనే గంభీరమైన భావాన్ని సూచించగలదు. తెలుగు పాఠ్యంలో ఆ సందర్భోచిత అర్థాన్ని స్పష్టం చేస్తూ, మూలపదంలోని రూపకాన్నీ ఇతర సాధ్యార్థాలనూ పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: శిష్యత్వం, హింస సందర్భంలో σκανδαλισθῆτε అనువాదం
  choice: విశ్వాసం నుంచి తొలగిపోకుండా
  alternative: తడబడకుండా; పడిపోకుండా; అభ్యంతరపడకుండా
  rationale: తదుపరి వచనంలో ఎదురయ్యే బహిష్కరణ, హింసల నేపథ్యంలో ఇది కేవలం మనస్తాపాన్ని కాక విశ్వాసపరమైన పతనం లేదా వైదొలగడాన్ని సూచించవచ్చు. అయితే గ్రీకు క్రియలోని ‘తడబడటం’ అనే రూపకానికి విస్తృతార్థం ఉన్నందున ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చి వ్యాఖ్యాన సాధ్యతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి. ‘ఈ సంగతులు’ మూలంలోని బహువచనాన్ని నిలుపుతుంది; ‘మీతో’ శిష్యుల బహువచనాన్ని స్పష్టం చేస్తుంది.
