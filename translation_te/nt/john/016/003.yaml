id: JHN.16.3
reference: John 16:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ταῦτα ποιήσουσιν ὅτι οὐκ ἔγνωσαν τὸν πατέρα οὐδὲ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/003.yaml
  text: And they will do these things because they have not known the Father or me[a].
translation:
  language: te
  text: వారు తండ్రినిగానీ నన్నుగానీ తెలుసుకోలేదు కాబట్టి, ఈ పనులు చేస్తారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు తండ్రినిగానీ నన్నుగానీ ఎరుగలేదు,” లేదా “వారు తండ్రినిగానీ నన్నుగానీ తెలిసికోలేదు.” ఇక్కడి గ్రీకు క్రియను తెలుగులో ఒకటి కంటే ఎక్కువ సహజమైన రీతుల్లో అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (తెలుగులో ప్రత్యేకంగా అనువదించలేదు)
  rationale: ముందటి వాక్యంతో ఉన్న అనుసంధానం సందర్భం ద్వారా స్పష్టంగా ఉంది; వాక్యారంభంలో ‘మరియు’ అనడం ఆధునిక తెలుగులో అసహజంగా ఉంటుంది.
- source_word: ταῦτα
  choice: ఈ పనులు
  rationale: ముందటి సందర్భంలో చెప్పిన శత్రుత్వ చర్యలను సూచించే నపుంసక బహువచనాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ποιήσουσιν
  choice: చేస్తారు
  rationale: ποιέω భవిష్యత్ క్రియారూపాన్ని, ‘ఈ పనులు’ అనే కర్మతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὅτι
  choice: కాబట్టి
  rationale: వారు ఆ పనులు చేయడానికి కారణాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὐκ ἔγνωσαν
  choice: తెలుసుకోలేదు
  rationale: γινώσκω యొక్క అఒరిస్ట్ రూపంలో ఉన్న గత/సంపూర్ణ భావాన్ని సహజంగా తెలియజేస్తూనే, కేవలం సమాచారం కలిగి ఉండటం కంటే వ్యక్తిగతంగా తెలుసుకోవడం అనే యోహాను రచనలోని భావానికి చోటిస్తుంది.
- source_word: τὸν πατέρα
  choice: తండ్రిని
  rationale: ఇక్కడ దేవునికి సంబంధించిన వ్యక్తిగత బిరుదును సహజంగా నిలుపుతుంది.
- source_word: οὐδὲ ἐμέ
  choice: గానీ నన్ను గానీ
  rationale: οὐδέ కలిపే రెండు నిరాకరిత కర్మలను తెలుగులో ‘తండ్రిని గానీ నన్ను గానీ’ అనే సమతుల నిర్మాణంతో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుని మరియు యేసును ‘తెలుసుకోవడం’ అనే యోహాను రచనలోని భావం
  choice: తండ్రిని గానీ నన్ను గానీ తెలుసుకోలేదు
  alternative: తండ్రిని గానీ నన్ను గానీ ఎరుగలేదు / తెలుసుకోకుండా ఉన్నారు
  rationale: ఈ వాక్యం హింసకు మూలకారణంగా తండ్రిని మరియు యేసును వ్యక్తిగతంగా తెలుసుకోకపోవడాన్ని చెబుతుంది. ‘తెలుసుకోలేదు’ ఆ సంబంధాత్మక భావాన్ని నిలుపుతూ, దానిని అదనపు సిద్ధాంత వివరణతో విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళమైనా గౌరవప్రదమైన శైలి. ‘గానీ…గానీ’ నిర్మాణం ద్వంద్వ నిరాకరణను సహజంగా తెలుపుతుంది.
