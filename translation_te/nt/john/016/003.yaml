- from: వారు తండ్రిని గానీ నన్ను గానీ తెలుసుకోలేదు కాబట్టి ఈ పనులు చేస్తారు.[a]
  to: వారు తండ్రినిగానీ నన్నుగానీ తెలుసుకోలేదు కాబట్టి, ఈ పనులు చేస్తారు.[a]
