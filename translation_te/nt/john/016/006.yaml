id: JHN.16.6
reference: John 16:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτι ταῦτα λελάληκα ὑμῖν ἡ λύπη πεπλήρωκεν ὑμῶν τὴν καρδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/006.yaml
  text: But because I have spoken these things to you[a], sorrow has filled your heart.
translation:
  language: te
  text: కానీ నేను ఈ సంగతులు మీతో చెప్పినందువల్ల, దుఃఖం మీ హృదయాన్ని నింపింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీ హృదయాలను నింపింది.’ గ్రీకులో ‘మీ’ అనేది బహువచనం, ‘హృదయం’ అనేది ఏకవచనం; ఈ నిర్మాణం ఆ సమూహం పంచుకున్న అంతరంగ దుఃఖాన్ని వ్యక్తం చేయవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: కానీ
  rationale: ముందటి మాటతో ఉన్న వ్యత్యాసాన్ని సహజంగా తెలియజేసే విరోధార్థక సంధానపదం.
- source_word: ὅτι
  choice: చెప్పినందువల్ల
  rationale: ఇక్కడ ὅτι శిష్యుల దుఃఖానికి కారణాన్ని తెలియజేస్తుంది; అందువల్ల కారణార్థాన్ని స్పష్టంగా వ్యక్తం చేశాం.
- source_word: ταῦτα
  choice: ఈ సంగతులు
  rationale: యేసు ఇంతకుముందు చెప్పిన అనేక విషయాలను సూచించే బహువచన సర్వనామ భావాన్ని నిలుపుతుంది.
- source_word: λελάληκα
  choice: నేను ... చెప్పిన
  rationale: పూర్తయిన మాటల ప్రభావం ప్రస్తుతం కొనసాగుతున్నదనే గ్రీకు పరిపూర్ణకాల భావం కారణ నిర్మాణంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: ὑμῖν
  choice: మీతో
  rationale: తెలుగులో ‘మీతో చెప్పడం’ సహజమైన ప్రయోగం; ఇది సంబోధితుల బహువచనాన్ని కూడా నిలుపుతుంది.
- source_word: ἡ λύπη
  choice: దుఃఖం
  rationale: లోతైన విచారాన్ని సూచించే λύπηకి గంభీరమైన, సాధారణ ఆధునిక తెలుగు సమానార్థకం.
- source_word: πεπλήρωκεν
  choice: నింపింది
  rationale: πληρόω యొక్క మూల రూపకాన్ని అనవసర వ్యాఖ్యానం లేకుండా నిలుపుతుంది; గ్రీకు పరిపూర్ణకాలం తెలిపే ప్రస్తుత ఫలితం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: ὑμῶν τὴν καρδίαν
  choice: మీ హృదయాన్ని
  rationale: గ్రీకులో బహువచన స్వామ్యరూపంతో ఏకవచన ‘హృదయం’ ఉంది. తెలుగు ‘మీ హృదయం’ ఆ సామూహిక ఏకవచనాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: సామూహిక ఏకవచన ‘హృదయం’ లేదా పంపిణీ బహువచన ‘హృదయాలు’
  choice: మీ హృదయాన్ని
  alternative: మీ హృదయాలను
  rationale: గ్రీకు పాఠం బహువచన ‘మీ’తో ఏకవచన καρδίανను వాడి, శిష్యులందరి ఉమ్మడి అంతరంగ దుఃఖాన్ని సూచించవచ్చు. ఆ ఉద్రిక్తతను పరిష్కరించకుండా ప్రధాన పాఠంలో ఏకవచనాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి. ‘దుఃఖం ... హృదయాన్ని నింపింది’ అనే రూపకాన్ని మూలపాఠానికి దగ్గరగా ఉంచాం; సామూహిక ఏకవచనంలోని నిజమైన అస్పష్టతను పాదసూచికలో తెలిపాం.
