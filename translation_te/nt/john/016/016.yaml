  text: Μικρὸν καὶ ⸀οὐκέτι θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/016.yaml
  text: A little while[a], and you no longer see me; and again a little while, and you will see me.
translation:
  language: te
  text: కొద్దికాలం తర్వాత మీరు ఇక నన్ను చూడరు; మళ్లీ కొద్దికాలం తర్వాత మీరు నన్ను చూస్తారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ఇక్కడ ‘చూడడం’ కోసం గ్రీకులో రెండు వేర్వేరు క్రియలు ఉన్నాయి: మొదటి భాగంలో θεωρέω, రెండో భాగంలో ὁράω. వాటి మధ్య భావఛాయలో తేడా ఉండవచ్చు; అయితే ఈ వాక్యంలో ప్రధాన వ్యత్యాసం కాలానికి సంబంధించినది కాబట్టి రెండింటినీ ‘చూడు’ అనే క్రియతో అనువదించాం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μικρὸν
  choice: కొద్దికాలం తర్వాత
  rationale: నపుంసక ఏకవచన విశేషణం ఇక్కడ క్రియావిశేషణార్థకంగా, స్వల్ప కాలవ్యవధిని సూచిస్తుంది. సహజమైన తెలుగులో ‘కొద్దికాలం తర్వాత’ ఆ సమీప కాలభావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὐκέτι
  choice: ఇక ... చూడరు
  rationale: ఇప్పటి నుంచి ఒక స్థితి నిలిచిపోవడాన్ని సూచించే οὐκέτι భావాన్ని తెలుగులో ‘ఇక ... చూడరు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: θεωρεῖτέ
  choice: చూడరు
  rationale: θεωρέωకు గమనించి చూడడం అనే ఛాయ ఉండవచ్చు; అయితే ఇక్కడ ὁράωతో అర్థపరమైన అతివ్యాప్తి ఎక్కువగా ఉన్నందున ప్రధాన పాఠ్యంలో సాధారణ ‘చూడు’ క్రియనే వాడాం.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: తదుపరి కాలంలో పరిస్థితి తిరిగి మారడాన్ని πάλιν సూచిస్తుంది; ‘మళ్లీ’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: ὄψεσθέ
  choice: మీరు నన్ను చూస్తారు
  rationale: ὁράω యొక్క భవిష్యత్ రూపం ఇక్కడ భవిష్యత్తులో చూడడాన్ని సూచిస్తుంది. మొదటి క్రియతో సమాంతరతను నిలుపుతూ ‘చూస్తారు’ అని అనువదించాం.
- source_word: με
  choice: నన్ను
  rationale: యేసును సూచించే ప్రత్యక్ష కర్మ సర్వనామానికి సహజమైన తెలుగు రూపం.
- source_word: καὶ
  choice: ; / మళ్లీ
  rationale: గ్రీకులోని పునరుక్త καὶ రెండు సమతూక భాగాలను కలుపుతుంది. తెలుగులో విరామచిహ్నం మరియు ‘మళ్లీ’తో ఆ క్రమం, సమాంతరత సహజంగా వ్యక్తమవుతాయి.
theological_decisions:
- issue: θεωρέω మరియు ὁράω అనే రెండు ‘చూడడం’ క్రియలకు తెలుగులో వేర్వేరు పదాలు వాడాలా?
  choice: ప్రధాన పాఠ్యంలో రెండింటికీ ‘చూడు’ వాడడం
  alternative: మొదటిదాన్ని ‘గమనించి చూడడం’ లేదా ‘కనిపించడం’, రెండోదాన్ని ‘చూడడం’ అని వేరు చేయడం
  rationale: యోహాను వాడుకలో ఈ రెండు గ్రీకు క్రియల అర్థాలు గణనీయంగా అతివ్యాప్తి చెందుతాయి. వాటి మధ్య ఖచ్చితమైన ఆధ్యాత్మిక భేదాన్ని తెలుగు పాఠ్యంలో బలవంతంగా ప్రవేశపెట్టడం మూలపాఠం చెప్పినదానికంటే ఎక్కువ చెప్పడమవుతుంది. అసలైన ప్రధాన వ్యత్యాసం కాలపరమైనది; అయినా పదభేదాన్ని పాదసూచికలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. గ్రీకు వాక్యంలోని రెండు సమతూక కాలభాగాలను అర్థవిరామంతో నిలిపి, భావాన్ని అతిగా వ్యాఖ్యానించకుండా ఉంచాం.
