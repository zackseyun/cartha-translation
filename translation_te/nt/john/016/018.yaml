revisions:
- from: అందుచేత వారు, “ఆయన ‘కొంతసేపు’ అని చెప్పడం ఏమిటి? ఆయన ఏమి చెబుతున్నాడో మనకు తెలియడం లేదు” అని చెప్పుకుంటూ ఉన్నారు.
  to: కాబట్టి వారు, “ఆయన ‘కొంతసేపు’ అని చెప్పేదేమిటి? ఆయన ఏమి చెబుతున్నాడో మనకు తెలియదు” అని చెప్పుకుంటూ ఉన్నారు.
  rationale: 'The revision retains the draft’s faithful rendering of the Greek imperfect and its central phrase ‘a little while,’ while making the question and the statement of ignorance more idiomatic in modern standard Telugu. No footnote is needed: the English audit footnote reflects an English stylistic alternative and has no corresponding unresolved lexical issue in the Telugu rendering.'
  reviewer_model: gpt-5.6-terra
