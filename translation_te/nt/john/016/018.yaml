review_pass:
  verdict: revise
  source_fidelity: The draft conveys the repeated/ongoing speech (ἔλεγον), the discourse link (οὖν), the puzzlement over μικρόν, and the final statement of not knowing what Jesus is saying. No theological or textual ambiguity is lost.
  naturalness: The wording is generally clear modern Telugu, but “ఆయన ‘కొంతసేపు’ అని చెప్పడం ఏమిటి?” is somewhat awkward as a nominal construction. “ఆయన ‘కొంతసేపు’ అని చెప్పేదేమిటి?” is more idiomatic for the direct question. “మనకు తెలియదు” naturally expresses οὐκ οἴδαμεν without suggesting a temporary process of coming to know.
  terminology: “కొంతసేపు” appropriately renders the elliptical temporal μικρόν, and “ఆయన ఏమి చెబుతున్నాడో” is a direct, natural rendering of τί λαλεῖ. No specialized theological terms occur.
  issues:
  - severity: low
    issue: Awkward formulation of the disciples’ question
    rationale: “చెప్పడం ఏమిటి?” is intelligible but less idiomatic in this context. “చెప్పేదేమిటి?” preserves the Greek question’s focus on the expression Jesus used and reads more naturally.
  - severity: low
    issue: Progressive expression for a stative verb of knowing
    rationale: “మనకు తెలియడం లేదు” is possible, but “మనకు తెలియదు” more directly reflects οὐκ οἴδαμεν, ‘we do not know,’ in natural Telugu.
  revised_text: కాబట్టి వారు, “ఆయన ‘కొంతసేపు’ అని చెప్పేదేమిటి? ఆయన ఏమి చెబుతున్నాడో మనకు తెలియదు” అని చెప్పుకుంటూ ఉన్నారు.
  revised_footnotes: []
  revision_rationale: 'The revision retains the draft’s faithful rendering of the Greek imperfect and its central phrase ‘a little while,’ while making the question and the statement of ignorance more idiomatic in modern standard Telugu. No footnote is needed: the English audit footnote reflects an English stylistic alternative and has no corresponding unresolved lexical issue in the Telugu rendering.'
