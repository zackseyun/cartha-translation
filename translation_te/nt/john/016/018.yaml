id: JHN.16.18
reference: John 16:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔλεγον οὖν· ⸂Τί ἐστιν τοῦτο⸃ ὃ ⸀λέγει μικρόν; οὐκ οἴδαμεν τί λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/018.yaml
  text: So they were saying[a], “What is this that he says, ‘A little while’? We do not know what he is saying.”
translation:
  language: te
  text: కాబట్టి వారు, “ఆయన ‘కొంతసేపు’ అని చెప్పేదేమిటి? ఆయన ఏమి చెబుతున్నాడో మనకు తెలియదు” అని చెప్పుకుంటూ ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: చెప్పుకుంటూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పదేపదే జరిగిన సంభాషణను సూచిస్తుంది; శిష్యులు తమలో తాము మాట్లాడుకుంటున్న సందర్భానికి ఈ తెలుగు సహజంగా సరిపోతుంది.
- source_word: οὖν
  choice: అందుచేత
  rationale: ముందటి వాక్యాలకు ప్రతిస్పందనగా వచ్చిన కొనసాగింపు లేదా ఫలిత సంబంధాన్ని చూపిస్తుంది.
- source_word: Τί ἐστιν τοῦτο
  choice: ఇది ఏమిటి
  rationale: గ్రీకు ప్రశ్నలోని నేర స్వరూపాన్ని, వారి అయోమయాన్ని వ్యాఖ్యానించి పరిష్కరించకుండా నిలుపుతుంది.
- source_word: ὃ λέγει μικρόν
  choice: ఆయన ‘కొంతసేపు’ అని చెప్పడం
  rationale: యేసు పలికిన μικρόν అనే మాటనే ప్రశ్నకు కేంద్రంగా ఉంచి, సంబంధ వాక్యాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: μικρόν
  choice: కొంతసేపు
  rationale: ఈ సందర్భంలో కొద్దికాలాన్ని సూచించే అవ్యయార్థక ప్రయోగం; చుట్టుపక్కల వచనాల్లో పునరావృతమయ్యే పదబంధంగా కూడా సహజంగా ఉంటుంది.
- source_word: οὐκ οἴδαμεν
  choice: మనకు తెలియడం లేదు
  rationale: οἶδα యొక్క వర్తమానార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τί λαλεῖ
  choice: ఆయన ఏమి చెబుతున్నాడో
  rationale: λαλεῖని నేరుగా మాటలాడటం లేదా చెప్పడం అనే అర్థంలో ఉంచి, ‘ఆయన ఉద్దేశం ఏమిటో’ అని వ్యాఖ్యానాత్మకంగా మార్చదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే సంభాషణ శైలి. గ్రీకులో λέγει మరియు λαλεῖ మధ్య స్వల్ప పదభేదం ఉన్నా, తెలుగులో సహజత్వం కోసం రెండింటినీ ‘చెప్పు’ మూలంతో అనువదించాం.
