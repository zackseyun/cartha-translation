id: JHN.16.26
reference: John 16:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐν τῷ ὀνόματί μου αἰτήσεσθε, καὶ οὐ λέγω ὑμῖν ὅτι ἐγὼ ἐρωτήσω τὸν πατέρα περὶ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/026.yaml
  text: On that day you will ask in my name[a], and I do not say to you that I will ask the Father concerning you[c][b];
translation:
  language: te
  text: ఆ రోజున మీరు నా నామంలో అడుగుతారు. మీ గురించి[a] నేను తండ్రిని అడుగుతానని మీతో చెప్పడం లేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీ పక్షంగా’; ‘మీ తరఫున.’
    reason: lexical_alternative
  - marker: b
    text: 'ఈ వచనంలో ‘అడుగు’ అనే భావానికి గ్రీకు మూలం రెండు వేర్వేరు క్రియలను ఉపయోగిస్తుంది: శిష్యులు అడగడానికి αἰτέω, యేసు తండ్రిని అడగడానికి ἐρωτάω.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ఆ రోజున
  rationale: కాలాన్ని సూచించే ఈ పదబంధాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తూ, ἐκείνῃ లోని నిర్దేశక భావాన్ని నిలుపుతుంది.
- source_word: ἐν τῷ ὀνόματί μου
  choice: నా నామంలో
  rationale: యోహాను సువార్తలోని స్థిరమైన ప్రయోగాన్ని, యేసు వ్యక్తిత్వం మరియు అధికారంతో ఉన్న సంబంధాన్ని అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: αἰτήσεσθε
  choice: మీరు ... అడుగుతారు
  rationale: భవిష్యత్ కాలం, ద్వితీయ పురుష బహువచనాన్ని సహజంగా వ్యక్తపరుస్తుంది; ప్రార్థన లేదా విన్నప సందర్భంలో ‘అడగడం’ సరైన తెలుగు సమానార్థకం.
- source_word: οὐ λέγω ὑμῖν
  choice: మీతో చెప్పడం లేదు
  rationale: వర్తమాన కాలంలోని తక్షణ భావాన్ని సహజమైన ఆధునిక తెలుగు నిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: ὅτι
  choice: అని
  rationale: ఇక్కడ ఇది కారణాన్ని కాక, యేసు చెప్పడం లేదని పేర్కొన్న విషయాన్ని పరిచయం చేస్తుంది.
- source_word: ἐρωτήσω
  choice: నేను ... అడుగుతాను
  rationale: భవిష్యత్ కాలాన్ని నేరుగా అందిస్తుంది. మూలంలో αἰτέω కంటే వేరే క్రియ ఉన్న విషయాన్ని పాదటిప్పణిలో తెలుపుతూ, ప్రధాన వాక్యంలో అసహజమైన పదభేదాన్ని బలవంతంగా పెట్టదు.
- source_word: τὸν πατέρα
  choice: తండ్రిని
  rationale: గ్రీకులో స్పష్టమైన స్వామ్యసూచక పదం లేనందున ‘నా తండ్రిని’ అని విస్తరించకుండా యోహానీయ సంబోధనను నిలుపుతుంది.
- source_word: περὶ ὑμῶν
  choice: మీ గురించి
  rationale: περί + షష్ఠీ విభక్తి యొక్క ప్రాథమిక ‘గురించి/సంబంధించి’ భావాన్ని నిలుపుతుంది; ‘మీ పక్షంగా’ అనే మధ్యవర్తిత్వ భావాన్ని ప్రధాన పాఠ్యంలో నిర్ణయాత్మకంగా చేర్చదు.
theological_decisions:
- issue: యేసు భవిష్యత్తులో చేసే ప్రతి మధ్యవర్తిత్వాన్ని నిరాకరిస్తున్నాడా, లేక ఈ సందర్భంలో శిష్యులు తండ్రిని అడగడాన్ని తన విన్నపంపై ఆధారపడినదిగా వివరించడం లేదని మాత్రమే చెబుతున్నాడా
  choice: యేసు ఇక్కడ ఏమి చెప్పడం లేదో వాక్యం నేరుగా తెలిపేలా అనువదించి, ఆయన ఎన్నడూ మధ్యవర్తిత్వం చేయడని సూచించలేదు.
  alternative: యేసు వారి కోసం అసలు విన్నవించడని బలంగా వ్యాఖ్యానించడం, లేదా ఎలాంటి మధ్యవర్తిత్వం లేకుండానే తండ్రిని నేరుగా చేరవచ్చని విస్తరించి చెప్పడం.
  rationale: సమీప సందర్భం యేసు నామంలో శిష్యులు అడగడాన్ని నొక్కిచెబుతుంది; ఇతర నూతన నిబంధన భాగాలు ఆయన పక్షవాదం లేదా మధ్యవర్తిత్వం గురించి చెబుతాయి. అందువల్ల మూలపాఠ్యంలోని ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. ‘నా నామంలో’ అనే స్థిరమైన బైబిలు ప్రయోగాన్ని అంతర్వచన, ధార్మిక బలం కోసం నిలిపాం. గ్రీకు వాక్యాంతంలోని సెమికోలన్ భావపరంగా వాక్యముగింపుగా ఉన్నందున తెలుగులో పూర్ణవిరామం వాడాం.
