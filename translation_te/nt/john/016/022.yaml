source:
  edition: SBLGNT
  text: καὶ ὑμεῖς οὖν ⸂νῦν μὲν λύπην⸃ ἔχετε· πάλιν δὲ ὄψομαι ὑμᾶς, καὶ χαρήσεται ὑμῶν ἡ καρδία, καὶ τὴν χαρὰν ὑμῶν οὐδεὶς ⸀αἴρει ἀφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/022.yaml
  text: So you also now have sorrow; but I will see you again[a], and your heart will rejoice, and no one will take your joy from you.
translation:
  language: te
  text: కాబట్టి ఇప్పుడు మీకూ దుఃఖం ఉంది; కానీ నేను మిమ్మల్ని మళ్లీ చూస్తాను[a], మీ హృదయం ఆనందిస్తుంది, మీ ఆనందాన్ని ఎవరూ మీ నుండి తీసివేయరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు నన్ను మళ్లీ చూస్తారు.” అయితే గ్రీకు మూలపాఠంలో అక్షరార్థంగా, “నేను మిమ్మల్ని మళ్లీ చూస్తాను” అని ఉంది. యేసు తన శిష్యుల దగ్గరకు తిరిగి రావడంలో ఆయనే చొరవ తీసుకుంటాడనే భావాన్ని ఇది నొక్కిచెప్పవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: అలాగే
  rationale: ముందటి ప్రసవవేదన ఉపమానం నుండి శిష్యుల పరిస్థితికి అన్వయాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన అనుసంధానం.
- source_word: νῦν μὲν λύπην ἔχετε
  choice: ఇప్పుడు మీకూ దుఃఖం ఉంది
  rationale: λύπη లోని దుఃఖం/వేదన భావాన్ని నిలుపుతుంది; μέν తరువాతి δέతో ఏర్పడే వ్యత్యాసంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: πάλιν δὲ ὄψομαι ὑμᾶς
  choice: అయితే నేను మిమ్మల్ని మళ్లీ చూస్తాను
  rationale: δέ సూచించే వ్యత్యాసాన్ని ‘అయితే’తో, πάλινను ‘మళ్లీ’తో తెలిపి, గ్రీకులోని మొదటి పురుష కర్తను యథాతథంగా ఉంచుతుంది.
- source_word: χαρήσεται ὑμῶν ἡ καρδία
  choice: మీ హృదయం ఆనందిస్తుంది
  rationale: హృదయాన్ని అంతరంగ వ్యక్తిత్వానికి రూపకంగా నిలుపుతూ, χαρήσεται యొక్క క్రియాత్మక ఆనంద భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: τὴν χαρὰν ὑμῶν
  choice: మీ ఆనందాన్ని
  rationale: χαρήσεταιతో ఉన్న పదసంబంధాన్ని ‘ఆనందిస్తుంది/ఆనందం’ ద్వారా కాపాడుతుంది.
- source_word: οὐδεὶς αἴρει ἀφ’ ὑμῶν
  choice: ఎవరూ మీ నుండి తీసివేయలేరు
  rationale: గ్రీకు వర్తమాన రూపం సందర్భంలో భవిష్యత్తుకు సంబంధించిన స్థిరమైన అసాధ్యతను తెలియజేస్తుంది; తెలుగులో ‘తీసివేయలేరు’ సహజంగా, బలంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: భవిష్యత్తులో జరిగే పునఃకలయికలో కర్త మరియు దృష్టి
  choice: నేను మిమ్మల్ని మళ్లీ చూస్తాను
  alternative: మీరు నన్ను మళ్లీ చూస్తారు
  rationale: గ్రీకులో ὄψομαι మొదటి పురుష కర్తతో, ὑμᾶς రెండో పురుష కర్మగా స్పష్టంగా ఉంది. సమీప వచనానికి అనుగుణంగా మార్చకుండా, యేసే తిరిగి వచ్చి వారిని కలుసుకునే చొరవను సూచించే మూలపాఠ రూపాన్ని నిలుపుతుంది.
- issue: ఆనందాన్ని తీసివేయడం గురించిన కాలభావం
  choice: ఎవరూ మీ నుండి తీసివేయలేరు
  alternative: ఎవరూ మీ నుండి తీసివేయరు
  rationale: αἴρει రూపపరంగా వర్తమాన కాలమైనా, వాక్యంలోని భవిష్యత్ సందర్భంలో ఆనందం తొలగించబడదనే స్థిరమైన అసాధ్యతను సూచిస్తుంది. ‘తీసివేయలేరు’ ఈ బలాన్ని సహజ తెలుగులో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘హృదయం’ అనే బైబిలు రూపకాన్ని నిలుపుతూ, క్లిష్టమైన పదబంధాలను నివారించాం. మూలంలోని స్పష్టమైన ‘నేను మిమ్మల్ని చూస్తాను’ అనే నిర్మాణాన్ని ప్రధాన పాఠంలో ఉంచి, ప్రాచుర్యంలో ఉన్న ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
