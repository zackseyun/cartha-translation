id: JHN.16.4
reference: John 16:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα λελάληκα ὑμῖν ἵνα ὅταν ἔλθῃ ἡ ὥρα ⸀αὐτῶν μνημονεύητε ⸁αὐτῶν ὅτι ἐγὼ εἶπον ὑμῖν. Ταῦτα δὲ ὑμῖν ἐξ ἀρχῆς οὐκ εἶπον, ὅτι μεθ’ ὑμῶν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/004.yaml
  text: But I have spoken these things to you so that when their hour comes[a], you may remember that I told you. But I did not tell you these things from the beginning, because I was with you.
translation:
  language: te
  text: అయితే వారి గడియ వచ్చినప్పుడు, నేను మీకు చెప్పానని మీరు వాటిని జ్ఞాపకం చేసుకోవడానికి ఈ సంగతులను మీకు చెప్పాను.[a] మొదటినుంచి ఈ సంగతులను మీకు చెప్పలేదు; ఎందుకంటే నేను మీతో ఉన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మూల గ్రీకులో ‘వారి/వాటిని’ అనే సర్వనామం రెండుసార్లు ఉంది. మరింత అక్షరార్థంగా: ‘వారి గడియ వచ్చినప్పుడు, మీరు వాటిని జ్ఞాపకం చేసుకోవడానికి—నేను మీకు చెప్పానని.’ ఆ సర్వనామాలు ఎవరిని లేదా వేటిని సూచిస్తున్నాయో పూర్తిగా స్పష్టం కాదు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λελάληκα
  choice: చెప్పాను
  rationale: గ్రీకు పరిపూర్ణ కాలం గతంలో పలికిన మాటలకు ప్రస్తుతం కొనసాగుతున్న ప్రాసంగికతను సూచిస్తుంది. తెలుగులో సందర్భం మరియు ఉద్దేశ్య వాక్యం కలసి ఈ భావాన్ని సహజంగా తెలియజేస్తాయి.
- source_word: ταῦτα
  choice: ఈ సంగతులు
  rationale: ఇది యేసు ఇంతకుముందు ఇచ్చిన హెచ్చరికలను సమష్టిగా సూచించే బహువచన ప్రయోగం.
- source_word: ἵνα
  choice: …జ్ఞాపకం చేసుకోవడానికి
  rationale: ఉద్దేశాన్ని తెలిపే ἵνα భావాన్ని సహజమైన తెలుగు క్రియారూపంతో వ్యక్తం చేస్తుంది.
- source_word: ὅταν ἔλθῃ ἡ ὥρα αὐτῶν
  choice: వారి గడియ వచ్చినప్పుడు
  rationale: ὅταν మరియు సంభావనార్థక క్రియ భవిష్యత్తులో సంభవించే సందర్భాన్ని సూచిస్తాయి. యోహాను రచనలో ὥρα నియమిత సమయాన్ని సూచించగలందున ‘గడియ’ను ఉంచాం; αὐτῶν లోని అస్పష్టతను ‘వారి’ అని అలాగే నిలిపాం.
- source_word: μνημονεύητε αὐτῶν
  choice: మీరు వాటిని జ్ఞాపకం చేసుకోవడానికి
  rationale: రెండవ αὐτῶνను విడిచిపెట్టకుండా, ముందు చెప్పిన సంగతులు లేదా సంఘటనలను తిరిగి జ్ఞాపకం చేసుకోవడం అనే భావాన్ని తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὅτι ἐγὼ εἶπον ὑμῖν
  choice: నేను మీకు చెప్పానని
  rationale: ὅτι ప్రవేశపెట్టే విషయార్థక ఉపవాక్యాన్ని సహజంగా, ‘నేనే’ అనే అనవసరమైన అదనపు ఉద్ఘాటన లేకుండా అనువదిస్తుంది.
- source_word: ἐξ ἀρχῆς
  choice: మొదటినుంచి
  rationale: కాలారంభం నుంచే అనే మూలార్థాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: μεθ’ ὑμῶν ἤμην
  choice: నేను మీతో ఉన్నాను
  rationale: సంబంధసాన్నిధ్యాన్ని తెలిపే గ్రీకు పదబంధానికి నేరమైన తెలుగు అనువాదం.
theological_decisions:
- issue: రెండు αὐτῶν సర్వనామాల సూచన
  choice: మొదటిదాన్ని ‘వారి గడియ’గా, రెండవదాన్ని ‘వాటిని జ్ఞాపకం చేసుకోవడానికి’గా ప్రధాన పాఠ్యంలో నిలిపాం.
  alternative: రెండవ సర్వనామాన్ని తెలుగులో వ్యక్తం చేయకుండా, ‘నేను మీకు చెప్పానని మీరు జ్ఞాపకం చేసుకోవడానికి’ అని అనువదించవచ్చు.
  rationale: SBLGNT పాఠ్యంలో αὐτῶν రెండుసార్లు ఉంది. వాటి సూచన పూర్తిగా స్పష్టం కానందున ఒకే వ్యాఖ్యానంతో దానిని పరిష్కరించకుండా, మూలపాఠ్యంలోని నిర్మాణాన్నీ అస్పష్టతనూ సాధ్యమైనంతవరకు నిలిపాం.
- issue: ‘వారి గడియ’ యొక్క సూచన
  choice: ఎవరిని లేదా వేటిని సూచిస్తుందో ప్రధాన పాఠ్యంలో వివరించకుండా ‘వారి’ అని అనువదించాం.
  alternative: ‘ఆ సంఘటనల సమయం’ లేదా ‘హింసించేవారి సమయం’ అని స్పష్టీకరించవచ్చు.
  rationale: సమీప సందర్భం హింసించే వ్యక్తులనూ జరగబోయే సంగతులనూ సూచించగలదు; మూలంలోని భావ ఉద్రిక్తతను అనువాదంలో ముందుగానే తీర్మానించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘గడియ’ యోహాను సువార్తలోని నియమిత సమయం అనే సాహిత్య భావాన్ని నిలుపుతుంది. మూలంలోని రెండు αὐτῶν ప్రయోగాల వల్ల కలిగే అస్పష్టతను ప్రధాన పాఠ్యం మరియు పాదసూచిక ద్వారా సంరక్షించాం.
