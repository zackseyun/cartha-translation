  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔτι πολλὰ ἔχω ⸂ὑμῖν λέγειν⸃, ἀλλ’ οὐ δύνασθε βαστάζειν ἄρτι·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/012.yaml
  text: I still have many things to say to you[a], but you are not able to bear them now.
translation:
  language: te
  text: నేను మీకు చెప్పవలసిన విషయాలు ఇంకా చాలా ఉన్నాయి, కానీ ఇప్పుడు మీరు వాటిని భరించలేరు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇప్పుడు మీరు వాటిని మోయలేరు” లేదా “ఇప్పుడు మీరు వాటిని సహించలేరు.” గ్రీకు క్రియ మోయడం, భరించడం లేదా సహించడం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι
  choice: ఇంకా
  rationale: యేసు చెప్పవలసిన బోధ మరింత మిగిలి ఉందనే కొనసాగింపు భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πολλὰ
  choice: చాలా విషయాలు
  rationale: నపుంసక బహువచన విశేషణం నామవాచకంగా వాడబడింది; తెలుగులో దాని అంతర్లీన అర్థాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔχω ὑμῖν λέγειν
  choice: మీతో చెప్పాల్సిన ... ఉన్నాయి
  rationale: ‘మీకు చెప్పడానికి ఉన్నాయి’ అన్నది మరింత అక్షరానువాదమైనా, ప్రస్తుత తెలుగు వాడుకలో ఈ రూపం సహజంగా ఉండి, చెప్పవలసినవి మిగిలి ఉన్నాయనే గ్రీకు నిర్మాణ భావాన్ని నిలుపుతుంది.
- source_word: ἀλλ’
  choice: కానీ
  rationale: వ్యతిరేక భావాన్ని సరళంగా, స్పష్టంగా సూచిస్తుంది.
- source_word: οὐ δύνασθε
  choice: మీరు ... లేరు
  rationale: తెలుగు సామర్థ్య సూచక క్రియారూపంలో ‘చేయలేరు’ అనేది గ్రీకులోని అసమర్థత భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: βαστάζειν
  choice: వాటిని భరించలేరు
  rationale: మోయడం, భరించడం, సహించడం అనే రూపక విస్తృతిని ‘భరించు’ నిలుపుతుంది; దానిని కేవలం అర్థం చేసుకోవడంగా పరిమితం చేయదు.
- source_word: ἄρτι
  choice: ఇప్పుడు
  rationale: తదుపరి వచనాల్లో వచ్చే భవిష్యత్ పరిస్థితికి విరుద్ధంగా ప్రస్తుత సమయాన్ని సంక్షిప్తంగా సూచిస్తుంది.
theological_decisions:
- issue: శిష్యుల ప్రస్తుత అసమర్థతకు సంబంధించి βαστάζειν అర్థం
  choice: మరింత బోధ యొక్క భారాన్ని ఇప్పుడు వారు భరించలేరు.
  alternative: ఇప్పుడు వారు దానిని పూర్తిగా అర్థం చేసుకోలేరు; లేదా ఇప్పుడు దాన్ని విని సహించలేరు.
  rationale: βαστάζω మోయడం, భరించడం, సహించడం అనే అర్థాలను కలిగి ఉండవచ్చు. ‘భరించలేరు’ అనే అనువాదం మానసిక, ఆత్మీయ, భావోద్వేగ సామర్థ్యాల మధ్య ఉన్న ఉద్దేశపూర్వక విస్తృతిని కేవలం ‘అర్థం చేసుకోవడం’ లేదా ‘సహించడం’గా పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. ‘భరించలేరు’ అనే పదం మూలంలోని రూపకాన్ని, అర్థ విస్తృతిని నిలుపుతుంది.
