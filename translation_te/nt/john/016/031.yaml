translation:
  language: te
  text: యేసు వారికి జవాబిచ్చాడు, “ఇప్పుడు మీరు నమ్ముతున్నారా?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇప్పుడు మీరు నమ్ముతున్నారు.” గ్రీకు వాక్యాన్ని ప్రకటనగా కూడా చదవవచ్చు; అయితే సందర్భం ప్రశ్నార్థక భావానికే ఎక్కువ బలం ఇస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: జవాబిచ్చాడు
  rationale: సంభాషణ సందర్భంలో ἀποκρίνομαι యొక్క కథన వాడుకను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: యేసు ఎవరికీ జవాబిచ్చాడో తెలిపే దత్తివాచక బహువచన సర్వనామాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ἰησοῦς
  choice: యేసు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: Ἄρτι
  choice: ఇప్పుడు
  rationale: ప్రస్తుత క్షణాన్ని సూచించే ἄρτι యొక్క కాల భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: πιστεύετε
  choice: మీరు నమ్ముతున్నారా
  rationale: πιστεύω అనే క్రియ యొక్క వర్తమానకాల, ద్వితీయ పురుష బహువచన రూపాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; ప్రశ్నార్థక రూపం సందర్భంలోని సవాలుతో కూడిన ధ్వనిని నిలుపుతుంది.
theological_decisions:
- issue: Ἄρτι πιστεύετε; వాక్యానికి ప్రశ్నార్థక భావమా, ప్రకటన భావమా
  choice: “ఇప్పుడు మీరు నమ్ముతున్నారా?” అనే ప్రశ్నగా అనువదించడం
  alternative: “ఇప్పుడు మీరు నమ్ముతున్నారు.” అనే ప్రకటనగా అనువదించడం
  rationale: గ్రీకు పదరూపం స్వయంగా ప్రశ్నను మరియు ప్రకటనను వేరుచేయదు. అయితే వెంటనే వచ్చే శిష్యుల చెదరిపోవడం గురించిన సందర్భం ప్రశ్నార్థక, స్వల్ప వ్యంగ్య ధ్వనికి బలం ఇస్తుంది. ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా అసలు భాషలోని సందిగ్ధతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి. “నమ్ముతున్నారా” అనేది వర్తమాన భావాన్ని నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
