id: JHN.16.14
reference: John 16:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐκεῖνος ἐμὲ δοξάσει, ὅτι ἐκ τοῦ ἐμοῦ λήμψεται καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/014.yaml
  text: He will glorify me[a], because he will take from what is mine and declare it to you.
translation:
  language: te
  text: ఆయన నన్ను మహిమపరుస్తాడు, ఎందుకంటే ఆయన నాకు చెందిన దానిలోనుంచి తీసుకుని మీకు తెలియజేస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పొందుకుని.’
    reason: λήμψεται అనే పదానికి సందర్భానుసారంగా ‘తీసుకుని’ లేదా ‘పొందుకుని’ అనే అర్థం ఉండవచ్చు.
lexical_decisions:
- source_word: ἐκεῖνος
  choice: ఆయన
  rationale: సమీప సందర్భంలోని ఆదరణకర్తయైన ఆత్మను సూచిస్తుంది. తెలుగు గౌరవార్థక ఏకవచన సర్వనామం వ్యక్తిగత సూచనను సహజంగా తెలియజేస్తుంది; గ్రీకు నిర్దేశక బలాన్ని ‘ఆ వ్యక్తి’ అని అతిగా చూపదు.
- source_word: ἐμὲ
  choice: నన్ను
  rationale: ‘మహిమపరుస్తాడు’ అనే క్రియకు ప్రత్యక్ష కర్మగా ఉన్న మొదటి పురుష ఏకవచన సర్వనామానికి సహజమైన రూపం.
- source_word: δοξάσει
  choice: మహిమపరుస్తాడు
  rationale: యోహాను రచనల్లో δοξάζωకు ఉన్న దైవశాస్త్రీయ బరువును నిలుపుతుంది; కేవలం గౌరవించడం అనే అర్థానికి పరిమితం చేయదు.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఇక్కడ ఆత్మ యేసును ఎందుకు మహిమపరుస్తాడో తెలిపే కారణార్థాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: నాదైన దానిలో నుంచి
  rationale: నపుంసకలింగ ఆర్టికల్‌తో ఉన్న స్వామ్యవిశేషణం సూచించే ‘నాకు చెందిన దానిలో నుంచి’ అనే విస్తృత భావాన్ని నిలుపుతుంది; అది బోధనా, అధికారమా, ప్రత్యక్షతా అని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: λήμψεται
  choice: తీసుకుని
  rationale: λαμβάνωలోని ‘తీసుకోవడం/పొందడం’ అనే భావ పరిధిలో ప్రధాన పాఠానికి సహజమైన ఎంపిక. మధ్యమ రూపాన్ని అనవసరంగా ఆత్మనేపదార్థంగా చేయదు; ‘పొందుకుని’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: ἀναγγελεῖ
  choice: తెలియజేస్తాడు
  rationale: తెలియపరచడం, నివేదించడం అనే అర్థాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది. ముందున్న ‘నాదైన దానిలో నుంచి’ అనే పదబంధమే అవ్యక్త కర్మను సందర్భానుసారంగా అందిస్తుంది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: రెండవ పురుష బహువచన దత్తివుకు సహజమైన తెలుగు రూపం; శిష్యుల సమూహాన్ని సందర్భం స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ἐκ τοῦ ἐμοῦ λήμψεταιలో ఆత్మకు యేసుతో ఉన్న సంబంధాన్ని ఎలా వ్యక్తం చేయాలి
  choice: నాదైన దానిలో నుంచి తీసుకుని
  alternative: నా నుంచి పొందుకుని / నాకు చెందిన దానిలో నుంచి పొందుకుని
  rationale: ఆత్మ కుమారునికి చెందినదాన్ని తెలియజేస్తాడనే విస్తృత యోహానీయ భావాన్ని ఉంచుతుంది. దీనిని తరువాతి కాలపు నిర్దిష్ట సిద్ధాంత సూత్రంగా మార్చకుండా, మూలంలోని విస్తృతతనూ ఉద్రిక్తతనూ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘మహిమపరుస్తాడు’ యోహానీయ దైవశాస్త్రీయ పదబరువును నిలుపుతుంది; మిగిలిన వాక్యం సాధారణ పాఠకులకు సహజంగా ఉండేలా రూపొందించబడింది.
