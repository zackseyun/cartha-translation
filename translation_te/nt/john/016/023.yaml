id: JHN.16.23
reference: John 16:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐμὲ οὐκ ἐρωτήσετε οὐδέν· ἀμὴν ἀμὴν λέγω ὑμῖν, ⸂ἄν τι⸃ αἰτήσητε τὸν πατέρα ⸂δώσει ὑμῖν ἐν τῷ ὀνόματί μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/023.yaml
  text: And in that day you will ask me nothing[a]. Truly, truly, I say to you, whatever you ask the Father in my name[b], he will give to you.
translation:
  language: te
  text: 'ఆ రోజున మీరు నన్ను ఏమీ ప్రశ్నించరు.[a] నిజంగా, నిజంగా, నేను మీతో చెబుతున్నాను: మీరు తండ్రిని ఏదైనా అడిగితే, ఆయన దాన్ని నా పేరున మీకు ఇస్తాడు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకులో ఇక్కడ రెండు వేర్వేరు క్రియలు ఉన్నాయి: యేసును ఉద్దేశించి మొదటిది ‘ప్రశ్నించడం’; తండ్రిని ఉద్దేశించి రెండవది ‘అడగడం’ లేదా ‘విన్నవించడం.’'
    reason: lexical_alternative
  - marker: b
    text: 'కొన్ని ప్రాచీన ప్రతుల్లో ‘నా పేరున’ అనే పదబంధం ‘అడిగితే’తో అనుసంధానమవుతుంది: “మీరు నా పేరున తండ్రిని ఏదైనా అడిగితే, ఆయన దాన్ని మీకు ఇస్తాడు.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ఆ రోజున
  rationale: సహజమైన ఆధునిక తెలుగు కాలసూచక ప్రయోగం; యోహాను సువార్తలోని భావగాంభీర్యాన్ని కూడా నిలుపుతుంది.
- source_word: ἐμὲ οὐκ ἐρωτήσετε οὐδέν
  choice: మీరు నన్ను ఏమీ ప్రశ్నించరు
  rationale: ἐρωτάω ఇక్కడ యేసును ప్రశ్నించడం అనే భావాన్ని ఇస్తుంది. తరువాతి αἰτέωతో ఉన్న పదభేదాన్ని తెలుగులో ‘ప్రశ్నించరు’—‘అడిగినా’ ద్వారా సహజంగా చూపిస్తుంది.
- source_word: ἀμὴν ἀμὴν
  choice: నిజంగా, నిజంగా
  rationale: యోహాను సువార్తకు ప్రత్యేకమైన బలమైన పునరుక్తిని స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἄν τι αἰτήσητε τὸν πατέρα
  choice: మీరు తండ్రిని ఏది అడిగినా
  rationale: ἄν τιతో కూడిన అనిర్దిష్ట పరిధిని ‘ఏది ... అడిగినా’ సహజంగా వ్యక్తం చేస్తుంది; τὸν πατέραలో లేని ‘నా’ అనే స్వామ్యపదాన్ని చేర్చదు.
- source_word: δώσει ὑμῖν
  choice: ఆయన దాన్ని ... మీకు ఇస్తాడు
  rationale: గ్రీకులో కర్త క్రియారూపంలో అంతర్లీనంగా ఉంది; తెలుగులో స్పష్టత కోసం ‘ఆయన’, అడిగిన దానిని సూచించేందుకు ‘దాన్ని’ సహజంగా పూరించబడ్డాయి.
- source_word: ἐν τῷ ὀνόματί μου
  choice: నా పేరున
  rationale: మూలపాఠంలోని ప్రాతినిధ్య/అధికార సంబంధిత విస్తృత భావాన్ని అతిగా వివరించకుండా నిలుపుతుంది. SBLGNT పదక్రమం ప్రకారం ఇది ‘ఇస్తాడు’తో అనుసంధానించబడింది.
theological_decisions:
- issue: యేసును ప్రశ్నించడం (ἐρωτάω), తండ్రిని అడగడం (αἰτέω) మధ్య భేదం
  choice: మొదటిదాన్ని ‘ప్రశ్నించరు’, రెండవదాన్ని ‘అడిగినా’ అని అనువదించడం
  alternative: రెండింటినీ ‘అడుగు’ అనే ఒకే తెలుగు క్రియతో అనువదించడం
  rationale: సందర్భానికి సరిపోయే సహజ తెలుగులోనే గ్రీకు క్రియల నిజమైన భేదాన్ని కనిపించేలా చేస్తుంది; దానిని సిద్ధాంతపరంగా అతిగా పదును పెట్టదు.
- issue: ‘నా పేరున’ అనే పదబంధం ఏ క్రియతో అనుసంధానమవుతుంది
  choice: SBLGNT ప్రధాన పాఠం, పదక్రమం ప్రకారం ‘ఆయన ... ఇస్తాడు’తో అనుసంధానించడం
  alternative: కొన్ని పాఠాంతరాల ప్రకారం ‘మీరు ... అడిగినా’తో అనుసంధానించడం
  rationale: ఇచ్చిన మూలభాషా పాఠానికి ప్రాధాన్యం ఇచ్చి ప్రధాన పాఠాన్ని అనువదించాం; ప్రార్థన గురించిన సాధారణ పరిచిత రూపానికి అనుగుణంగా పదక్రమాన్ని మౌనంగా మార్చకుండా పాఠాంతరాన్ని పాదసూచికలో ఉంచాం.
- issue: నా పేరున అడిగే ప్రార్థనకు సంబంధించిన వాగ్దాన పరిధి
  choice: వచనం చెప్పిన వాగ్దానాన్ని అదనపు షరతులు చేర్చకుండా నేరుగా అనువదించడం
  alternative: ‘యేసు చిత్తానికి అనుగుణంగా’ వంటి వివరణాత్మక పరిమితిని చేర్చడం
  rationale: విస్తృత యోహాను సందర్భం వ్యాఖ్యానానికి తోడ్పడినా, ఈ వచనంలో లేని సిద్ధాంతపరమైన షరతులను అనువాదం చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గౌరవప్రదమైన వచనశైలితో రూపొందించబడింది. ‘నిజంగా, నిజంగా’ అనే పునరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది. పాదసూచిక సూచిక [a] ప్రధాన పాఠంలో ఉంది.
