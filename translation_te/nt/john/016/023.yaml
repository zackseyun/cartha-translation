  to: 'ఆ రోజున మీరు నన్ను ఏమీ ప్రశ్నించరు.[a] నిజంగా, నిజంగా, నేను మీతో చెబుతున్నాను: మీరు తండ్రిని ఏదైనా అడిగితే, ఆయన దాన్ని నా పేరున మీకు ఇస్తాడు.[b]'
  rationale: 'సవరణ ప్రధానంగా రెండు చిన్న మెరుగుదలలు చేస్తుంది: ἄν τι నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఏదైనా అడిగితే’గా వ్యక్తపరుస్తుంది; అలాగే ἐρωτάω/αἰτέω క్రియాభేదాన్ని పాదసూచికలో నమోదు చేస్తుంది. SBLGNTలో ఇవ్వబడిన ప్రధాన పదక్రమాన్ని మార్చలేదు: ‘నా పేరున’ ప్రధాన పాఠంలో ‘ఇస్తాడు’తోనే ఉంది. పాఠభేద పాదసూచిక ఆ ప్రత్యామ్నాయ పదక్రమాన్ని మాత్రమే తెలియజేస్తుంది; దాని అర్థాన్ని సిద్ధాంతపరంగా నిర్ణయించదు.'
