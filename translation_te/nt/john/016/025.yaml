source:
  edition: SBLGNT
  text: Ταῦτα ἐν παροιμίαις λελάληκα ὑμῖν· ⸀ἔρχεται ὥρα ὅτε οὐκέτι ἐν παροιμίαις λαλήσω ὑμῖν ἀλλὰ παρρησίᾳ περὶ τοῦ πατρὸς ⸀ἀπαγγελῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/025.yaml
  text: I have spoken these things to you in figures of speech[a]. An hour is coming when I will no longer speak to you in figures of speech[c][b], but will tell you plainly about the Father.
translation:
  language: te
  text: “ఈ విషయాలను నేను మీతో పరోక్షమైన మాటల్లో[a] మాట్లాడాను. ఒక ఘడియ[b] వస్తోంది; అప్పుడు ఇక పరోక్షమైన మాటల్లో మీతో మాట్లాడను, తండ్రి గురించి మీకు స్పష్టంగా[c] తెలియజేస్తాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఉపమానాల్లో,” “రూపకాలతో కూడిన మాటల్లో,” లేదా “సూచకమైన మాటల్లో.” ఇక్కడి గ్రీకు పదం రూపకాలతో కూడిన లేదా నేరుగా చెప్పని మాటలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఒక సమయం.” యోహాను సువార్తలో “ఘడియ” అనే పదానికి తరచూ ప్రత్యేకమైన ధార్మిక ప్రాధాన్యం ఉంటుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా “బహిరంగంగా” లేదా “నిర్మొహమాటంగా.” ఇక్కడ పరోక్షమైన మాటలకు వ్యతిరేకంగా నేరుగా, స్పష్టంగా చెప్పడం ప్రధాన భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαις
  choice: నిగూఢమైన మాటల్లో
  rationale: యోహాను సువార్తలో ఈ పదం సాధారణంగా ఉపమాన కథ అనే సాంకేతిక భావం కంటే రూపకాలతో కూడిన, పరోక్షమైన లేదా పూర్తిగా బోధపడని మాటలను సూచిస్తుంది. ‘నిగూఢమైన మాటల్లో’ అనే అనువాదం ఆ పరోక్షతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచింది.
- source_word: λελάληκα
  choice: చెప్పాను
  rationale: గతంలో పలికిన మాటలకు ప్రస్తుత సందర్భంలోనూ ప్రాసంగికత ఉందనే పరిపూర్ణ కాల భావాన్ని తెలుగు సందర్భం సహజంగా అందిస్తుంది. ‘చెప్పాను’ సాధారణంగా, స్పష్టంగా ఉంది.
- source_word: ἔρχεται ὥρα
  choice: ఒక ఘడియ రాబోతోంది
  rationale: నిర్దిష్ట ఉపపదం లేని గ్రీకు నిర్మాణానికి ‘ఒక ఘడియ’ సరిపోతుంది. ‘ఘడియ’ యోహాను రచనలోని ప్రత్యేక పదప్రయోగాన్నీ దాని భావగాంభీర్యాన్నీ నిలుపుతుంది.
- source_word: οὐκέτι
  choice: ఇక ... మాట్లాడను
  rationale: భవిష్యత్తులో మునుపటి విధానం కొనసాగదనే ‘ఇకపై కాదు’ అనే వ్యత్యాసాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: λαλήσω
  choice: మాట్లాడను
  rationale: λαλέω యొక్క మాటలాడే చర్యను నిలుపుతూ, ముందున్న చెప్పడానికీ తరువాతి తెలియజేయడానికీ మధ్య సహజమైన తెలుగు వ్యత్యాసాన్ని ఇస్తుంది.
- source_word: παρρησίᾳ
  choice: స్పష్టంగా
  rationale: ఇక్కడ ప్రధాన వ్యత్యాసం ధైర్యంగా లేదా బహిరంగంగా మాట్లాడడంలో కాక, నిగూఢమైన మాటలకు బదులు నేరుగా అర్థమయ్యేలా చెప్పడంలో ఉంది. అందువల్ల ‘స్పష్టంగా’ సందర్భానికి తగినది.
- source_word: ἀπαγγελῶ
  choice: తెలియజేస్తాను
  rationale: యేసు తండ్రి గురించి నేరుగా వెల్లడిస్తాడనే భావాన్ని ‘తెలియజేస్తాను’ సహజంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది; ‘ప్రకటిస్తాను’ కంటే సంభాషణ సందర్భానికి ఇది అనుకూలం.
- source_word: περὶ τοῦ πατρὸς
  choice: తండ్రి గురించి
  rationale: గ్రీకు సంబంధసూచక పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా అందిస్తుంది; ‘తండ్రి’ అనే యోహానీయ సంబంధపూర్వక, ధార్మిక పదాన్ని యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: యోహాను సందర్భంలో ὥρα పదం
  choice: ఒక ఘడియ రాబోతోంది
  alternative: ఒక సమయం రాబోతోంది; ఆ ఘడియ రాబోతోంది
  rationale: ‘సమయం’ అని మాత్రమే అనువదిస్తే యోహాను రచనలో ‘ఘడియ’కు ఉండే ప్రతిధ్వని తగ్గుతుంది; ‘ఆ ఘడియ’ అని అనువదిస్తే గ్రీకులోని అనిర్దిష్ట నిర్మాణాన్ని మించిన నిర్దిష్టత చేరుతుంది. ‘ఒక ఘడియ’ ఈ రెండింటి మధ్య సమతుల్యతను కాపాడుతుంది.
- issue: ἐν παροιμίαις మరియు παρρησίᾳ మధ్య వ్యత్యాసం
  choice: నిగూఢమైన మాటల్లో ... స్పష్టంగా
  alternative: ఉపమానాల్లో ... బహిరంగంగా; రూపకాలలో ... నిర్మొహమాటంగా
  rationale: వాక్యంలోని ప్రధాన ఉద్రిక్తత పరోక్షమైన లేదా నిగూఢమైన బోధన నుంచి నేరుగా అర్థమయ్యే వెల్లడికి మారడంలో ఉంది. ఈ ఎంపిక ధైర్యం లేదా బహిరంగ ప్రచారం అనే వేరే భావాన్ని అనవసరంగా ముందుకు తేవదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘ఘడియ’ కొంత సాహిత్య గాంభీర్యం కలిగినప్పటికీ యోహానీయ పదప్రయోగాన్ని నిలుపుతుంది; అర్థసౌలభ్యం కోసం ‘సమయం’ పాదసూచికలో ఇవ్వబడింది. వాక్యంలోని నిగూఢత–స్పష్టత వ్యత్యాసం స్పష్టంగా కనిపించేలా సమాంతర నిర్మాణం ఉపయోగించబడింది.
