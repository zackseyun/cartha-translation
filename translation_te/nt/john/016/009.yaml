  text: concerning sin[a], because they do not believe in me;
translation:
  language: te
  text: పాపం గురించి—ఎందుకంటే వారు నన్ను విశ్వసించరు;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ
  choice: గురించి
  rationale: షష్ఠీ విభక్తితో వచ్చిన περί ఇక్కడ పరిశుద్ధాత్మ ఒప్పింపజేసే అంశాన్ని పరిచయం చేస్తుంది; 10–11 వచనాల్లోని సమాంతర నిర్మాణానికి కూడా ‘గురించి’ సహజంగా సరిపోతుంది.
- source_word: ἁμαρτίας
  choice: పాపం
  rationale: ఏకవచన భావవాచక నామవాచకాన్ని వ్యక్తిగత పాపక్రియలుగా విస్తరించకుండా, మూలంలోని వర్గార్థాన్ని నిలుపుతుంది.
- source_word: μέν
  choice: —
  rationale: μέν 9–11 వచనాల వరుసలో మొదటి అంశాన్ని సూచిస్తుంది. తెలుగులో దీనికి ప్రత్యేక పదం చేర్చకుండా విరామచిహ్నం మరియు సమాంతర నిర్మాణం ద్వారా దాని సంభాషణాత్మక పని నిలుస్తుంది.
- source_word: ὅτι
  choice: కాబట్టి
  rationale: ముందున్న ‘పాపం గురించి’ అనే మాటకు కారణం లేదా వివరణను ఇక్కడ ὅτι అందిస్తుంది. ‘కాబట్టి’ ఆ కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ‘అని’ అనే ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: οὐ πιστεύουσιν
  choice: విశ్వసించరు
  rationale: వర్తమానకాల బహువచన క్రియ కొనసాగుతున్న అవిశ్వాస వాస్తవాన్ని తెలియజేస్తుంది. ‘విశ్వసించరు’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: εἰς ἐμέ
  choice: నన్ను
  rationale: πιστεύω εἰς అనే యోహాను ప్రయోగం యేసువైపు మళ్లిన వ్యక్తిగత విశ్వాసాన్ని సూచిస్తుంది. తెలుగులో ‘నన్ను విశ్వసించరు’ సహజమైన ప్రయోగం; మూలంలోని సంబంధాత్మక భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ఈ వచనంలో పేర్కొన్న పాప స్వభావం
  choice: ఈ సందర్భంలో యేసును విశ్వసించకపోవడమే ‘పాపం’ గురించిన ఒప్పింపుకు కారణం లేదా నిర్ణాయక వ్యక్తీకరణగా వచనం చూపుతుంది.
  alternative: మానవ పాపస్థితిని సాధారణంగా సూచిస్తూ, అవిశ్వాసాన్ని దాని ఒక ఉదాహరణగా మాత్రమే చూడడం.
  rationale: ὅτι తో మొదలయ్యే వివరణాత్మక వాక్యభాగం ‘పాపం గురించి’ అనే మాటను ‘వారు నన్ను విశ్వసించరు’ అనే వాస్తవంతో నేరుగా అనుసంధానిస్తుంది. మూలంలో లేని విస్తృత సిద్ధాంత వివరణను అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. 9–11 వచనాల సమాంతర నిర్మాణాన్ని నిలపడానికి ‘పాపం గురించి’ ఉపయోగించబడింది. కారణార్థాన్ని స్పష్టపరచడానికి డాష్ వాడబడింది; నిజమైన ὅτι సందిగ్ధత పాదసూచికలో భద్రపరచబడింది.
