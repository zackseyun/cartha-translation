revisions:
- from: పాపం గురించి—వారు నన్ను విశ్వసించరు కాబట్టి[a];
  to: పాపం గురించి—ఎందుకంటే వారు నన్ను విశ్వసించరు;
  rationale: The revision replaces potentially ambiguous “కాబట్టి” with the explicitly causal “ఎందుకంటే,” preserving the explanatory force of ὅτι. It also corrects the footnote’s grammatical terminology. No doctrinal interpretation is added, and the alternative “that” rendering remains available in the footnote.
  reviewer_model: gpt-5.6-terra
