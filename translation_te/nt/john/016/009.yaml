review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders περὶ ἁμαρτίας as “పాపం గురించి” and preserves the singular abstract sense of ἁμαρτίας. It also correctly renders οὐ πιστεύουσιν εἰς ἐμέ as “వారు నన్ను విశ్వసించరు.” However, placing “కాబట్టి” after the clause can be read consequentially (“therefore”), whereas ὅτι here introduces the explanatory/causal ground. “ఎందుకంటే” represents this relation more directly in modern Telugu.
  naturalness: The revised wording is clear, idiomatic modern standard Telugu. The dash suitably introduces the explanation within this verse fragment and coheres with the parallel sequence in John 16:9–11.
  terminology: “పాపం” and “విశ్వసించు” are established, natural biblical Telugu terms and accurately retain the text’s theological and relational language without interpretive expansion.
  issues:
  - severity: medium
    issue: “కాబట్టి” is potentially consequential in the main text.
    rationale: Although postposed “కాబట్టి” may sometimes convey a causal sense, it can naturally be understood as “therefore/so.” The Greek ὅτι in this context is better represented unambiguously by “ఎందుకంటే” (“because”).
  - severity: low
    issue: The footnote calls ὅτι a “సంధిపదం.”
    rationale: “సంయోజకం” is the more accurate Telugu grammatical designation for the Greek conjunction.
  revised_text: పాపం గురించి—ఎందుకంటే వారు నన్ను విశ్వసించరు;
  revised_footnotes:
