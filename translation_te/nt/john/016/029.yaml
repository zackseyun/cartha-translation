id: JHN.16.29
reference: John 16:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Λέγουσιν οἱ μαθηταὶ αὐτοῦ· Ἴδε νῦν ⸀ἐν παρρησίᾳ λαλεῖς, καὶ παροιμίαν οὐδεμίαν λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/029.yaml
  text: His disciples said[a], “Look[b], now you are speaking openly and are not speaking in any figure of speech.”
translation:
  language: te
  text: ఆయన శిష్యులు, “ఇదిగో, ఇప్పుడు నీవు స్పష్టంగా మాట్లాడుతున్నావు; ఏ రూపకమైన మాటా చెప్పడం లేదు[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “రూపకమైన మాట” అనే గ్రీకు పదానికి “సామెత,” “ఉపమానం,” లేదా “పరోక్షమైన మాట” అనే అర్థాలు కూడా ఉండవచ్చు. ఇక్కడ అది రూపకంగా లేదా పరోక్షంగా చెప్పే మాటను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν
  choice: అన్నారు
  rationale: గ్రీకు చారిత్రక వర్తమానాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో భూతకాలంగా ఇచ్చాం.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ఆయన శిష్యులు
  rationale: సంబంధాన్ని స్పష్టంగా, సహజమైన తెలుగు పదక్రమంలో వ్యక్తం చేస్తుంది.
- source_word: Ἴδε
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే సంభాషణాత్మక ఉద్గారం; గంభీరతను నిలుపుకుంటూనే ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: νῦν
  choice: ఇప్పుడు
  rationale: యేసు మాట్లాడే విధానంలో ప్రస్తుతం కనిపిస్తున్న మార్పును సూచించే కాలవాచకం.
- source_word: ἐν παρρησίᾳ
  choice: స్పష్టంగా
  rationale: ఇక్కడ παροιμίαతో ఉన్న వ్యత్యాసం కారణంగా ధైర్యంగా అనే భావంకన్నా బహిరంగంగా/తేటగా మాట్లాడటం ప్రధాన భావం.
- source_word: λαλεῖς
  choice: మాట్లాడుతున్నావు
  rationale: ప్రస్తుత సంభాషణలో కొనసాగుతున్న క్రియను సహజమైన తెలుగు వర్తమాన ప్రగతిరూపంలో తెలిపింది.
- source_word: παροιμίαν
  choice: నిగూఢమైన మాట
  rationale: యోహాను సందర్భంలో ఇది సామెతకే పరిమితం కాకుండా రూపకమైన, పరోక్షమైన లేదా మరుగైన మాటను సూచిస్తుంది.
- source_word: οὐδεμίαν
  choice: ఏ ... మాటా ... లేదు
  rationale: గ్రీకు సంపూర్ణ నిరాకరణను సహజమైన తెలుగు నిరాకరణ నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: λέγεις
  choice: చెప్పడం లేదు
  rationale: παροιμίανతో కలిసి ‘నిగూఢమైన మాట చెప్పడం’ అనే సహజ తెలుగు ప్రయోగాన్ని ఇస్తుంది; గ్రీకు λέγω భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: παρρησία మరియు παροιμία మధ్య వ్యత్యాసం
  choice: స్పష్టంగా మాట్లాడటం—నిగూఢమైన మాట చెప్పకపోవటం
  alternative: ధైర్యంగా/నిర్భయంగా మాట్లాడటం—సామెత చెప్పకపోవటం
  rationale: తక్షణ సందర్భంలోని వ్యత్యాసం మాటల ధైర్యంపై కాక, ప్రత్యక్షమైన మాటకు మరియు రూపకమైన లేదా పరోక్షమైన మాటకు మధ్య ఉంది. అయినా παροιμία యొక్క విస్తృత భావపరిధిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి. ‘స్పష్టంగా’ అనే పదం παρρησία–παροιμία వ్యత్యాసాన్ని సూటిగా తెలియజేస్తుంది; ‘నిగూఢమైన మాట’ మూలంలోని ఉద్దేశపూర్వక భావవిస్తృతిని కాపాడుతుంది.
