review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the announcement, the disciples’ scattering, their leaving Jesus alone, and the Father’s presence. The present-plus-perfect force of ἔρχεται ... καὶ ἐλήλυθεν is retained, though placing the whole disciples’ action before “సమయం వస్తోంది” is less direct than the Greek clause structure.
  naturalness: The Telugu is generally clear and modern. A small recasting makes the temporal clause and the perfect “has come” read more smoothly while retaining the deliberate Johannine tension.
  terminology: “ఇదిగో,” “తండ్రి,” “నాతో ఉన్నాడు,” and “ఒంటరిగా” are appropriate in register and meaning. “తమ సొంతవాటివైపు” maintains the intentional breadth of τὰ ἴδια without restricting it to a house.
  issues:
  - severity: low
    issue: The temporal announcement is somewhat delayed by fronting the full description of the disciples’ scattering and departure.
    rationale: Greek first foregrounds “an hour is coming, and has come,” then specifies what that hour entails. Recasting improves readability and more closely reflects the source’s rhetorical progression.
  - severity: low
    issue: “వచ్చేసింది కూడా” is understandable but slightly colloquial and less precise in conveying the perfect’s already-arrived sense.
    rationale: “ఇప్పటికే వచ్చింది” is natural modern standard Telugu and explicitly represents that the decisive time has already arrived.
  revised_text: ఇదిగో, మీరు చెదరిపోయి, ఒక్కొక్కరు తమ సొంతవాటివైపు వెళ్లి, నన్ను ఒంటరిగా విడిచిపెట్టే సమయం వస్తోంది; అది ఇప్పటికే వచ్చింది కూడా. అయినా నేను ఒంటరిగా లేను, ఎందుకంటే తండ్రి నాతో ఉన్నాడు.
  revised_footnotes:
  - marker: a
    text: లేదా, ‘ఒక్కొక్కరు తమ సొంత స్థలానికి’ లేదా ‘తమ ఇంటికి.’ గ్రీకు పదబంధం ఒక నిర్దిష్ట స్థలానికే పరిమితం కాదు; అది ఒక్కొక్కరికి చెందినవి లేదా వారి సొంత పరిధిని సాధారణంగా సూచించవచ్చు.
    reason: lexical_alternative
