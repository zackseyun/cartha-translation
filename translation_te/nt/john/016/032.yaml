id: JHN.16.32
reference: John 16:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδοὺ ἔρχεται ὥρα ⸀καὶ ἐλήλυθεν ἵνα σκορπισθῆτε ἕκαστος εἰς τὰ ἴδια κἀμὲ μόνον ἀφῆτε· καὶ οὐκ εἰμὶ μόνος, ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/032.yaml
  text: Behold[a], an hour is coming, and has come, when you will be scattered, each to his own, and will leave me alone. Yet I am not alone, because the Father is with me.
translation:
  language: te
  text: ఇదిగో, మీరు చెదరిపోయి, ఒక్కొక్కరు తమ సొంతవాటివైపు వెళ్లి, నన్ను ఒంటరిగా విడిచిపెట్టే సమయం వస్తోంది; అది ఇప్పటికే వచ్చింది కూడా. అయినా నేను ఒంటరిగా లేను, ఎందుకంటే తండ్రి నాతో ఉన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రోతల దృష్టిని గంభీరంగా రాబోయే ప్రకటనవైపు మళ్లించే గ్రీకు అవ్యయ బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἔρχεται ὥρα καὶ ἐλήλυθεν
  choice: సమయం వస్తోంది; అది వచ్చేసింది కూడా
  rationale: 'వర్తమానకాలం మరియు పూర్ణకాలం మధ్య ఉన్న ఉద్దేశపూర్వక ఉద్వేగాన్ని నిలుపుతుంది: నిర్ణాయక సమయం ఇంకా సమీపిస్తూనే ఉంది, అదే సమయంలో ఇప్పటికే వచ్చేసింది.'
- source_word: ἵνα σκορπισθῆτε
  choice: మీరు చెదరిపోయి
  rationale: గంట/సమయం యొక్క విషయాన్ని పరిచయం చేసే ἵναను తెలుగులో సహజమైన కాలసంబంధ నిర్మాణంలో అందిస్తూ, నిష్క్రియార్థకమైన σκορπισθῆτε సూచించే విడిపోవడాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἕκαστος εἰς τὰ ἴδια
  choice: ఎవరి సొంతవాటికి వారు వెళ్లి
  rationale: ప్రతి ఒక్కరిపై ఉన్న విభజనాత్మక బలాన్ని తెలుగులో సహజంగా చూపిస్తుంది. τὰ ἴδιαను కేవలం ‘ఇల్లు’గా పరిమితం చేయకుండా, వ్యక్తికి చెందిన స్థలం, వస్తువులు లేదా వ్యవహారాలు అనే విస్తృత అస్పష్టతను కాపాడుతుంది.
- source_word: κἀμὲ μόνον ἀφῆτε
  choice: నన్ను ఒంటరిగా విడిచిపెట్టే
  rationale: ἀφίημι యొక్క సందర్భానుగుణమైన ‘విడిచిపెట్టు’ భావాన్ని నిలుపుతుంది; ‘త్యజించు’ వంటి మరింత తీవ్రమైన పదంతో మూలాన్ని అతిశయింపజేయదు.
- source_word: καὶ οὐκ εἰμὶ μόνος
  choice: అయినా నేను ఒంటరిగా లేను
  rationale: శిష్యులు విడిచిపెట్టడం మరియు తండ్రి సన్నిధి మధ్యనున్న వ్యత్యాసాన్ని καί సందర్భంలో కలిగించే స్వల్ప విరుద్ధబలంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν
  choice: ఎందుకంటే తండ్రి నాతో ఉన్నాడు
  rationale: యేసు ఒంటరిగా లేనందుకు కారణాన్ని స్పష్టంగా తెలియజేస్తూ, యోహాను రచనలో ముఖ్యమైన ‘తండ్రి’ అనే సంబంధబిరుదును యథాతథంగా ఉంచుతుంది.
theological_decisions:
- issue: ἕκαστος εἰς τὰ ἴδιαలో వ్యక్తిగత విభజన మరియు విస్తృతార్థం
  choice: ఎవరి సొంతవాటికి వారు వెళ్లి
  alternative: ఎవరి ఇంటికి వారు వెళ్లి
  rationale: ‘ఇల్లు’ అని మాత్రమే నిర్ణయించకుండా, ఒక్కొక్కరు తమకు చెందిన దాని వైపు వెళ్లడం అనే మూలంలోని విస్తృత భావాన్ని, అలాగే ప్రతి వ్యక్తిపై ఉన్న దృష్టిని కాపాడుతుంది.
- issue: శిష్యులు యేసును ఒంటరిగా విడిచిపెట్టడం మరియు తండ్రి సన్నిధి మధ్య సంబంధం
  choice: అయినా నేను ఒంటరిగా లేను, ఎందుకంటే తండ్రి నాతో ఉన్నాడు
  alternative: నేను ఒంటరిగా లేను, ఎందుకంటే తండ్రి నాతో ఉన్నాడు
  rationale: శిష్యులు నిజంగా ఆయనను విడిచిపెట్టబోతున్నప్పటికీ తండ్రి ఆయనతో ఉన్నాడనే వాక్యంలోని ఉద్వేగాన్ని నిలుపుతుంది; ఈ వచనం చెప్పేదానికంటే మించిన సిద్ధాంతపరమైన వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘ఇదిగో’ ప్రకటనాత్మక స్వరాన్ని నిలుపుతుంది; ‘సమయం’ అనేది ఇక్కడ అరవై నిమిషాల గంటకన్నా నిర్ణాయక సందర్భాన్ని సూచిస్తుంది. మూలంలోని ‘వస్తోంది—వచ్చేసింది’ కాల ఉద్వేగాన్ని ఉద్దేశపూర్వకంగా కాపాడాం.
