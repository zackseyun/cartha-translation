revisions:
- from: ఇదిగో, మీరు చెదరిపోయి, ఎవరి సొంతవాటికి వారు వెళ్లి[a], నన్ను ఒంటరిగా విడిచిపెట్టే సమయం వస్తోంది; అది వచ్చేసింది కూడా. అయినా నేను ఒంటరిగా లేను, ఎందుకంటే తండ్రి నాతో ఉన్నాడు.
  to: ఇదిగో, మీరు చెదరిపోయి, ఒక్కొక్కరు తమ సొంతవాటివైపు వెళ్లి, నన్ను ఒంటరిగా విడిచిపెట్టే సమయం వస్తోంది; అది ఇప్పటికే వచ్చింది కూడా. అయినా నేను ఒంటరిగా లేను, ఎందుకంటే తండ్రి నాతో ఉన్నాడు.
  rationale: The revision preserves every element of the source while using a smoother Telugu temporal construction and making explicit that the announced hour has already arrived. The footnote remains anchored to “తమ సొంతవాటివైపు” and preserves the lexical breadth of τὰ ἴδια.
  reviewer_model: gpt-5.6-terra
