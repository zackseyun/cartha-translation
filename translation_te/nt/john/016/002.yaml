  verdict: revise
  source_fidelity: The draft accurately conveys expulsion from synagogue communities, the escalating force of ἀλλά, the coming hour, the universal/generic killer, and the killers’ mistaken conviction that their act constitutes λατρεία offered to God. The plural sense of ἀποσυναγώγους is retained. The revision only makes the object of ‘offer’ explicit in idiomatic Telugu.
  naturalness: ‘ఆరాధనాసేవ అర్పిస్తున్నానని’ is understandable but is more natural and syntactically clear in modern standard Telugu as ‘ఆరాధనా సేవను అర్పిస్తున్నానని.’
  terminology: ‘సమాజమందిరాలు’ suitably identifies synagogues. ‘ఆరాధనా సేవ’ preserves the religious/cultic-service sense of λατρεία without reducing it to ordinary service or asserting approval of the killers’ belief.
  issues:
