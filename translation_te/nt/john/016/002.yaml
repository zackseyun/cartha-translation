source:
  edition: SBLGNT
  text: ἀποσυναγώγους ποιήσουσιν ὑμᾶς· ἀλλ’ ἔρχεται ὥρα ἵνα πᾶς ὁ ἀποκτείνας ὑμᾶς δόξῃ λατρείαν προσφέρειν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/002.yaml
  text: They will make you outcasts from the synagogues[a]; indeed[b], an hour is coming when everyone who kills you will think he is offering service to God.
translation:
  language: te
  text: వారు మిమ్మల్ని సమాజమందిరాల నుండి వెలివేస్తారు.[a] అంతేకాదు, మిమ్మల్ని చంపే ప్రతివాడూ తాను దేవునికి ఆరాధనా సేవను అర్పిస్తున్నానని భావించే సమయం వస్తోంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమాజమందిరాల నుండి మిమ్మల్ని బహిష్కరిస్తారు”; అంటే, సమాజమందిర సమాజం నుండి మిమ్మల్ని తొలగిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: “ఆరాధనా సేవ”కు “మతపరమైన సేవ” లేదా “ఆరాధన” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσυναγώγους ποιήσουσιν ὑμᾶς
  choice: వారు మిమ్మల్ని సమాజమందిరాల నుండి వెలివేస్తారు
  rationale: విశేషణంతో కూడిన causative భావాన్ని సహజమైన తెలుగులో క్రియారూపంగా వ్యక్తం చేసింది. ఇది సమాజమందిర సముదాయం నుండి బహిష్కరణను సూచిస్తుంది; మూలంలోని బహువచన భావాన్ని ‘సమాజమందిరాల’ ద్వారా నిలిపింది.
- source_word: ἀλλ’
  choice: అంతేకాదు
  rationale: ఇక్కడ ఇది సాధారణ వ్యతిరేకతకన్నా, ముందటి హింసను మరింత తీవ్రమైన స్థాయికి తీసుకెళ్లే భావాన్ని తెలియజేస్తుంది.
- source_word: ἔρχεται ὥρα
  choice: సమయం వస్తోంది
  rationale: యోహాను రచనలోని రాబోయే ‘గడియ’ భావాన్ని సాధారణ ఆధునిక తెలుగు పాఠకులకు సహజంగా ‘సమయం’ అని అందించింది; వర్తమాన రూపంలోని సమీపిస్తున్న భావాన్ని ‘వస్తోంది’ నిలుపుతుంది.
- source_word: ἵνα πᾶς ὁ ἀποκτείνας ὑμᾶς
  choice: మిమ్మల్ని చంపే ప్రతివాడూ
  rationale: ἵνα ఇక్కడ రాబోయే సమయపు విషయాన్ని పరిచయం చేస్తుంది; తెలుగు వాక్యనిర్మాణంలో సంబంధవాచక రూపమే ఆ భావాన్ని సహజంగా అందిస్తుంది. πᾶς యొక్క సమగ్రతను ‘ప్రతివాడూ’ నిలుపుతుంది.
- source_word: δόξῃ
  choice: భావించే
  rationale: హంతకుని తప్పైన వ్యక్తిగత నమ్మకాన్ని సూచించే δοκέω భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λατρείαν προσφέρειν τῷ θεῷ
  choice: దేవునికి ఆరాధనాసేవ అర్పిస్తున్నానని
  rationale: λατρεία యొక్క దేవునికి అంకితమైన మతపరమైన సేవ/ఆరాధన భావాన్నీ, προσφέρειν లోని అర్పణ భావాన్నీ కలిపి నిలుపుతుంది. కేవలం ‘సేవ’ అని అనడం వల్ల కలిగే లౌకిక అస్పష్టతను తగ్గిస్తుంది.
theological_decisions:
- issue: హింసకుల స్వీయ అవగాహనను ఆరాధనా భాషలో చూపడం
  choice: తాను దేవునికి ఆరాధనాసేవ అర్పిస్తున్నానని భావించే
  alternative: తాను దేవునికి సేవ చేస్తున్నానని భావించే / దేవునికి ఆరాధన అర్పిస్తున్నానని భావించే
  rationale: హత్యనే దేవునికి అర్పించే సముచిత మతసేవగా వారు పొరబడతారనే దిగ్భ్రాంతికరమైన వ్యంగ్యాన్ని అనుమోదించకుండా, మృదువుపరచకుండా నిలుపుతుంది. ‘ఆరాధనాసేవ’ λατρεία లోని సేవ మరియు ఆరాధన అనే పరస్పర సంబంధిత ఛాయలను కాపాడుతుంది.
- issue: πᾶς ὁ ἀποκτείνας లోని వ్యక్తివాచక సాధారణీకరణ
  choice: మిమ్మల్ని చంపే ప్రతివాడూ తాను ... అని
  alternative: మిమ్మల్ని చంపేవారెవరైనా తాము ... అని
  rationale: మూలంలోని ఏకవచన ప్రతినిధి నిర్మాణాన్ని సహజమైన తెలుగులో ‘ప్రతివాడూ తాను’ అని నిలుపుతూ, అది వర్గమంతటికీ వర్తించే సాధారణ భావమని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన శైలి. ‘సమాజమందిరం’ యూదుల synagogueను సూచించే స్థిరమైన బైబిలు పదంగా ఉంచబడింది. ‘ఆరాధనాసేవ’ కొద్దిగా ఘనమైన పదమైనా, λατρεία యొక్క మతపరమైన/ఆరాధనా పరిధిని సాధారణ ‘సేవ’ కంటే స్పష్టంగా తెలియజేస్తుంది.
