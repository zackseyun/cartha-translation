id: JHN.16.17
reference: John 16:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπαν οὖν ἐκ τῶν μαθητῶν αὐτοῦ πρὸς ἀλλήλους· Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με; καί· ⸀Ὅτι ὑπάγω πρὸς τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/017.yaml
  text: 'So some of his disciples said to one another[a], “What is this that he is saying to us: ‘A little while, and you will not see me, and again a little while, and you will see me’? And, ‘Because I am going to the Father’?”'
translation:
  language: te
  text: 'అప్పుడు ఆయన శిష్యులలో కొందరు ఒకరితో ఒకరు ఇలా చెప్పుకున్నారు: “ఆయన మనతో చెబుతున్న ఈ మాట ఏమిటి? ‘కొద్దికాలంలో మీరు నన్ను చూడరు; మళ్లీ కొద్దికాలంలో నన్ను చూస్తారు’ అనీ, ‘ఎందుకంటే నేను తండ్రి దగ్గరికి వెళ్తున్నాను’[a] అనీ చెబుతున్నారే?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను తండ్రి దగ్గరికి వెళ్తున్నానని.” గ్రీకు సంధిపదాన్ని ఉటంకించిన విషయాన్ని పరిచయం చేసేదిగా లేదా “ఎందుకంటే” అనే కారణార్థంలో అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: అప్పుడు
  rationale: ముందటి మాటకు కొనసాగింపుగా శిష్యుల ప్రతిస్పందనను సహజమైన తెలుగు కథనశైలిలో సూచిస్తుంది; కఠినమైన తార్కిక నిర్ధారణను అనవసరంగా బలపరచదు.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: ఆయన శిష్యులలో కొందరు
  rationale: ἐκ యొక్క భాగసూచక భావాన్ని, శిష్యులందరూ కాక వారిలో కొందరని, స్పష్టంగా నిలుపుతుంది.
- source_word: πρὸς ἀλλήλους
  choice: ఒకరితో ఒకరు
  rationale: పరస్పర సంభాషణను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν
  choice: ఆయన మనతో చెబుతున్న ఈ మాట ఏమిటి?
  rationale: శిష్యుల అయోమయాన్ని గ్రీకు వాక్య నిర్మాణానికి సమీపంగా, అయితే తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: Μικρὸν
  choice: కొద్దికాలం తర్వాత
  rationale: ఇక్కడున్న అంతర్లీన కాలార్థాన్ని స్పష్టం చేస్తుంది. తెలుగు వాక్యంలో ‘తర్వాత’ చేర్చడం సంఘటనల క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: θεωρεῖτέ με
  choice: మీరు నన్ను చూడరు
  rationale: దృశ్య లేదా గ్రాహ్య భావాన్ని సాధారణమైన ‘చూడు’తో అందిస్తుంది.
- source_word: πάλιν μικρὸν καὶ ὄψεσθέ με
  choice: మళ్లీ కొద్దికాలం తర్వాత నన్ను చూస్తారు
  rationale: πάλιν యొక్క పునరావృత్తి భావాన్ని నిలుపుతూ, θεωρεῖτε మరియు ὄψεσθε రెండింటికీ ‘చూడు’ వాడి వాక్యంలోని సమాంతరతను కాపాడుతుంది.
- source_word: Ὅτι ὑπάγω πρὸς τὸν πατέρα
  choice: ఎందుకంటే నేను తండ్రి దగ్గరికి వెళ్తున్నాను
  rationale: ὅτιకి సాధ్యమైన కారణార్థాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; ఉటంకించిన విషయాన్ని పరిచయం చేసే ‘నేను తండ్రి దగ్గరికి వెళ్తున్నానని’ అనే అర్థాన్ని పాదసూచికలో భద్రపరుస్తుంది.
- source_word: τὸν πατέρα
  choice: తండ్రి
  rationale: గ్రీకులోని ‘తండ్రి’ అనే రూపాన్ని ‘నా తండ్రి’గా విస్తరించకుండా నిలుపుతుంది; సందర్భంలో ఇది బిరుదుగా స్పష్టంగా ఉంది.
theological_decisions:
- issue: యేసు వెళ్లడం, తిరిగి కనిపించడం దేనిని సూచిస్తాయి?
  choice: శిష్యుల అయోమయాన్ని అలాగే ఉంచి, ప్రధాన పాఠ్యంలో నిర్దిష్ట సంఘటనను నిర్ణయించలేదు.
  alternative: మరణం మరియు పునరుత్థానం; ఆరోహణ మరియు ఆత్మీయ సన్నిధి; పునరుత్థానానంతర దర్శనాలు.
  rationale: ఈ వచనం ఆ మాటకు వివరణ ఇవ్వకుండా శిష్యుల ప్రశ్ననే నమోదు చేస్తుంది. అందువల్ల సాధ్యమైన వివరణల్లో దేనినీ అనువాదంలో చొప్పించలేదు.
- issue: ὅτι యొక్క సంబంధం
  choice: ప్రధాన పాఠ్యంలో కారణార్థంగా ‘ఎందుకంటే’ అని ఇచ్చి, ప్రత్యామ్నాయ ఉటంకణార్థాన్ని పాదసూచికలో ఇచ్చాం.
  alternative: ‘నేను తండ్రి దగ్గరికి వెళ్తున్నానని’—యేసు చెప్పిన మరొక మాటగా నేరుగా ఉటంకించడం.
  rationale: గ్రీకు సంధిపదం రెండు విధాలుగా అర్థమయ్యే వీలున్నందున నిజమైన వ్యాకరణ సందిగ్ధతను పాదసూచిక ద్వారా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. అంతర్గత ఉటంకణాలు, ప్రశ్న స్వరం, శిష్యుల అయోమయం నిలుపబడ్డాయి. పాదసూచిక సూచిక [a] సంబంధిత ὅτι వాక్యభాగం దగ్గర ఉంచబడింది.
