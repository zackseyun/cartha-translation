  yaml_path: translation/nt/john/016/028.yaml
  text: I came from the Father and have come into the world. Again[a], I am leaving the world and going to the Father.
translation:
  language: te
  text: నేను తండ్రి నుండి బయలుదేరి[a] లోకంలోకి వచ్చాను; మళ్లీ లోకాన్ని విడిచిపెట్టి తండ్రి దగ్గరికి వెళ్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తండ్రి నుండి వచ్చాను’ అని కూడా అనువదించవచ్చు.
    reason: ἐξῆλθον ἐκ అనే పదబంధం బయలుదేరి రావడాన్ని లేదా మూలంగా తండ్రి నుండి రావడాన్ని తెలుపగలదు; ప్రత్యామ్నాయం ఆ సంక్షిప్త మూలార్థాన్ని చూపుతుంది.
lexical_decisions:
- source_word: ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: తండ్రి నుండి బయలుదేరి
  rationale: ἐξέρχομαι మరియు ἐκ కలిపి తండ్రి నుండి వచ్చిన మూలాన్ని, అక్కడి నుండి సాగిన కదలికను తెలియజేస్తాయి. ‘బయలుదేరి’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ కదలికను నిలుపుతుంది.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: లోకంలోకి వచ్చాను
  rationale: εἰς లోకంలోకి ప్రవేశాన్ని సూచిస్తుంది. గ్రీకు పరిపూర్ణ కాలంలోని పూర్తయిన రాకను తెలుగు సందర్భంలో ‘వచ్చాను’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: మొదటి కదలికకు అనుసరించే తిరుగు కదలికను సూచించే గ్రీకు అవ్యయానికి నేరమైన, సహజమైన సమానం.
- source_word: ἀφίημι τὸν κόσμον
  choice: లోకాన్ని విడిచిపెట్టి
  rationale: ఇక్కడ ἀφίημι లోకాన్ని వదలి వెళ్లడాన్ని సూచిస్తుంది; ‘విడిచిపెట్టి’ ఆ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: తండ్రి దగ్గరికి వెళ్తున్నాను
  rationale: πρός దిశతోపాటు గమ్యాన్ని సూచిస్తుంది. ‘దగ్గరికి’ వ్యక్తి సన్నిధికి వెళ్లే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘వెళ్తున్నాను’ ప్రస్తుత/సమీప భవిష్యత్ కదలికను నిలుపుతుంది.
theological_decisions:
- issue: యేసు తండ్రి నుండి రావడం మరియు తండ్రి దగ్గరికి తిరిగి వెళ్లడం
  choice: మూలం మరియు కదలికను సూచించే విధంగా ‘తండ్రి నుండి బయలుదేరి ... తండ్రి దగ్గరికి వెళ్తున్నాను’ అని అనువదించడం
  alternative: ‘దేవుని నుండి వచ్చాను’ అని బలహీనపరచడం లేదా ముందస్తు ఉనికి/అవతారం గురించి మూలంలో లేని వివరణను చేర్చడం
  rationale: వచనం యేసు తండ్రి నుండి వచ్చి తండ్రి దగ్గరికి వెళ్లడాన్ని నేరుగా చెబుతుంది. అనువాదం ఆ ఉన్నత క్రీస్తు సంబంధిత ప్రకటనను నిలుపుతుంది గాని దానిని సిద్ధాంతపరమైన వివరణతో విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. రెండు పరస్పర సమాంతర కదలికలను అర్ధవిరామంతో కలిపి గ్రీకు వాక్యంలోని సమతౌల్యాన్ని నిలిపాం.
