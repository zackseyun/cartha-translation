id: JHN.16.19
reference: John 16:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἔγνω Ἰησοῦς ὅτι ἤθελον αὐτὸν ἐρωτᾶν, καὶ εἶπεν αὐτοῖς· Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων ὅτι εἶπον· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/019.yaml
  text: Jesus knew that they wanted to ask him[a], and he said to them, “Are you discussing this with one another, that I said, ‘A little while, and you no longer see me, and again a little while[c][b], and you will see me’?”
translation:
  language: te
  text: 'యేసు, వారు తనను అడగాలని కోరుకుంటున్నారని తెలిసి, వారితో ఇలా అన్నాడు: “నేను, ‘ఇంక కొద్దికాలంలో మీరు నన్ను చూడరు[b]; మళ్లీ కొద్దికాలంలో మీరు నన్ను చూస్తారు’ అని[a] చెప్పిన దాని గురించి మీరు ఒకరితో ఒకరు చర్చించుకుంటున్నారా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను అలా చెప్పినందుకు.” గ్రీకు ὅτι ఇక్కడ చర్చలోని విషయాన్ని గానీ, చర్చకు కారణాన్ని గానీ పరిచయం చేయవచ్చు.
    reason: alternative_reading
  - marker: b
    text: 'ఇక్కడ గ్రీకులో ‘చూడడం’కు రెండు వేర్వేరు క్రియలు ఉన్నాయి: మొదట θεωρέω (‘గమనించు/తిలకించు’), తర్వాత ὁράω (‘చూడు’). వాక్యంలోని సమాంతరతను సహజంగా ఉంచడానికి తెలుగులో రెండింటినీ ‘చూడు’ అని ఇచ్చాం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: తెలుసుకొని
  rationale: ఇక్కడ γινώσκω శిష్యుల ఉద్దేశం యేసుకు తెలిసిందని సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో ‘తెలుసుకొని’ సహజంగా ఉంది.
- source_word: ἤθελον αὐτὸν ἐρωτᾶν
  choice: తనను అడగాలని వారు కోరుకుంటున్నారని
  rationale: ἤθελον వారి కొనసాగుతున్న కోరికను లేదా ఉద్దేశాన్ని, ἐρωτᾶν ప్రశ్న అడగడాన్ని తెలియజేస్తాయి. ‘తనను’ అనేది యేసునే తిరిగి సూచిస్తుంది.
- source_word: Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων
  choice: ఈ విషయం గురించే మీరు ఒకరితో ఒకరు చర్చించుకుంటున్నారా?
  rationale: ζητέω యొక్క మూలార్థం ‘వెదకడం’ అయినా, μετ’ ἀλλήλωνతో కలిసిన ఈ సందర్భంలో వారు మాట యొక్క అర్థాన్ని పరస్పరం తెలుసుకోవడానికి చర్చించుకోవడాన్ని సూచిస్తుంది.
- source_word: ὅτι εἶπον
  choice: అని చెప్పిన విషయం
  rationale: ὅτιను ప్రధాన పాఠంలో యేసు చెప్పిన మాటనే వారి చర్చకు విషయంగా పరిచయం చేసేదిగా అనువదించాం; కారణార్థక అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: Μικρὸν
  choice: కొద్దికాలం తర్వాత
  rationale: ఇక్కడ నపుంసక విశేషణం స్వల్ప కాలవ్యవధిని సూచిస్తుంది. సందర్భంలో దాని కాలసంబంధ భావాన్ని సహజమైన తెలుగులో స్పష్టపరుస్తుంది.
- source_word: οὐ θεωρεῖτέ με
  choice: మీరు నన్ను చూడరు
  rationale: గ్రీకు వర్తమాన రూపాన్ని సమీప భవిష్యత్తును సూచించే సందర్భంలో తెలుగు సహజంగా ‘చూడరు’ అని వ్యక్తపరుస్తుంది; ‘ఇక’ వంటి అదనపు భావాన్ని చేర్చలేదు.
- source_word: πάλιν μικρὸν καὶ ὄψεσθέ με
  choice: మళ్లీ కొద్దికాలం తర్వాత మీరు నన్ను చూస్తారు
  rationale: πάλιν క్రమంలో మళ్లీ సంభవించడాన్ని, ὄψεσθέ భవిష్యత్తులో చూడడాన్ని సూచిస్తాయి.
theological_decisions:
- issue: θεωρέω మరియు ὁράω అనే రెండు ‘చూడడం’ క్రియల మధ్య భావఛాయ
  choice: రెండింటినీ ప్రధాన పాఠంలో ‘చూడడం’తో అనువదించడం
  alternative: మొదటిదాన్ని ‘గమనించడం/తిలకించడం’, రెండవదాన్ని ‘చూడడం’గా వేరు చేయడం
  rationale: ఈ సందర్భంలో ప్రధాన వ్యత్యాసం యేసు కొంతకాలం కనిపించకపోవడం, ఆపై మళ్లీ కనిపించడం. తెలుగులో కృత్రిమమైన భేదాన్ని బలవంతంగా చేర్చకుండా సమాంతరతను కాపాడి, గ్రీకు పదభేదాన్ని పాదసూచికలో తెలిపాం.
- issue: ὅτι యొక్క సంబంధం
  choice: యేసు చెప్పిన మాటను చర్చ యొక్క విషయంగా చూపించడం
  alternative: ‘నేను చెప్పినందుకే’ అని కారణార్థంగా అనువదించడం
  rationale: ὅτι ఇక్కడ తరువాతి ప్రత్యక్ష ఉద్ధరణను చర్చలోని విషయంగా పరిచయం చేయగలదు; అయితే కారణార్థం కూడా వ్యాకరణపరంగా సాధ్యమే కాబట్టి ఆ సందిగ్ధతను పాదసూచికలో నిలిపాం.
- issue: యేసు మాట యొక్క ప్రశ్నార్థక స్వరూపం
  choice: ‘చర్చించుకుంటున్నారా?’ అనే నిజమైన ప్రశ్నగా ఉంచడం
  alternative: ‘మీరు ఒకరితో ఒకరు దీనిగురించి చర్చించుకుంటున్నారు’ అనే ప్రకటనగా ఇవ్వడం
  rationale: గ్రీకు వాక్య నిర్మాణం శిష్యుల అంతర్గత చర్చను బయటపెట్టే ప్రశ్నగా సహజంగా అర్థమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన కథనశైలి. ప్రత్యక్ష ఉద్ధరణలోని పునరుక్తిని మూలపాఠానికి అనుగుణంగా నిలిపాం.
