id: JHN.16.27
reference: John 16:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: αὐτὸς γὰρ ὁ πατὴρ φιλεῖ ὑμᾶς, ὅτι ὑμεῖς ἐμὲ πεφιλήκατε καὶ πεπιστεύκατε ὅτι ἐγὼ παρὰ τοῦ ⸀θεοῦ ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/027.yaml
  text: For the Father himself loves you[a], because you have loved me and have believed that I came from God.
translation:
  language: te
  text: తండ్రి తానే మిమ్మల్ని ప్రేమిస్తున్నాడు; ఎందుకంటే మీరు నన్ను ప్రేమించారు, నేను దేవుని నుండి వచ్చానని[a] నమ్మారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నేను దేవుని నుండి బయలుదేరి వచ్చానని”; గ్రీకు పదబంధం దేవుని సన్నిధి నుండి రావడం అనే భావాన్ని కూడా సూచించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς γὰρ ὁ πατὴρ
  choice: ఎందుకంటే ... తండ్రి తానే
  rationale: γάρ ముందున్న మాటకు వివరణాత్మక కారణాన్ని పరిచయం చేస్తుంది; αὐτός తండ్రిని బలంగా సూచిస్తుంది. తెలుగులో సహజమైన వాక్యక్రమం కోసం కారణ ఉపవాక్యాన్ని ముందుంచి, ‘తండ్రి తానే’తో ఆ బలాన్ని నిలిపాం.
- source_word: φιλεῖ ὑμᾶς
  choice: మిమ్మల్ని ప్రేమిస్తున్నాడు
  rationale: φιλέω ఇక్కడ వ్యక్తిగత ప్రేమాభిమానాన్ని సూచిస్తుంది. ‘ప్రేమిస్తున్నాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, భావాన్ని తగ్గించదు.
- source_word: ὅτι ὑμεῖς ἐμὲ πεφιλήκατε
  choice: మీరు నన్ను ప్రేమించి ... కాబట్టి
  rationale: మొదటి ὅτι కారణార్థకం. πεφιλήκατε పరిపూర్ణ కాలంలోని గత చర్యకు ప్రస్తుత ప్రాసంగికత ఉంది; తెలుగులో ‘ప్రేమించి’ ప్రధాన క్రియతో కలసి ఆ కొనసాగుతున్న సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: καὶ πεπιστεύκατε
  choice: నమ్మారు
  rationale: ఇది రెండవ కారణాన్ని సమన్వయపరుస్తుంది. ప్రతిపాదనాత్మక విషయాన్ని నమ్మడాన్ని ‘నమ్మారు’ స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది; తెలుగు సందర్భంలో దాని ప్రస్తుత ప్రాసంగికత నిలుస్తుంది.
- source_word: ὅτι ἐγὼ παρὰ τοῦ θεοῦ ἐξῆλθον
  choice: నేను దేవుని దగ్గర నుండి వచ్చానని
  rationale: రెండవ ὅτι నమ్మకపు విషయాన్ని పరిచయం చేస్తుంది. παρά + genitive మూలాన్ని లేదా దేవుని సన్నిధి నుండి రావడాన్ని సూచించగలదు; ‘దేవుని దగ్గర నుండి’ ఈ రెండు ఛాయలను అతిగా విప్పకుండా నిలుపుతుంది.
theological_decisions:
- issue: ‘నేను దేవుని దగ్గర నుండి వచ్చాను’ అనే క్రీస్తు సంబంధిత భావం
  choice: దేవుని మూలం/సన్నిధి నుండి వచ్చిన భాషగా నేరుగా అనువదించడం
  alternative: ‘దేవునిచేత పంపబడ్డాను’ లేదా సిద్ధాంతపరమైన విస్తృత వివరణ
  rationale: మూలపాఠం యేసు దేవునితో కలిగిన మూలం మరియు సంబంధాన్ని ధృవీకరిస్తుంది; అయితే ఇక్కడ ‘పంపబడ్డాను’ అని మాత్రమే చెప్పదు. అందువల్ల సిద్ధాంతాన్ని విస్తరించకుండా అసలు వాక్యంలోని ఉద్వేగం, విస్తృతి నిలుపబడ్డాయి.
- issue: తండ్రి ప్రేమకు శిష్యుల ప్రేమ, విశ్వాసం కారణంగా చెప్పబడటం
  choice: ‘కాబట్టి’ అనే కారణ సంబంధాన్ని స్పష్టంగా నిలుపడం
  alternative: కారణ సంబంధాన్ని బలహీనపరచి కేవలం అనుబంధంగా చూపడం
  rationale: మొదటి ὅτι స్పష్టంగా కారణాన్ని తెలుపుతుంది. ఈ వాక్యం లేవనెత్తే theological tension‌ను మరొక సిద్ధాంతంతో సమన్వయపరచకుండా యథాతథంగా ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘తండ్రి తానే’ మూలంలోని emphasis‌ను నిలుపుతుంది. కారణాన్ని ముందుంచిన వాక్యక్రమం తెలుగులో సులభగ్రాహ్యంగా ఉంది; [a] గుర్తు ప్రధాన వాక్యంలో సంబంధిత భావం వెంట ఉంచబడింది.
