id: JHN.16.33
reference: John 16:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ταῦτα λελάληκα ὑμῖν ἵνα ἐν ἐμοὶ εἰρήνην ἔχητε· ἐν τῷ κόσμῳ θλῖψιν ἔχετε, ἀλλὰ θαρσεῖτε, ἐγὼ νενίκηκα τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/033.yaml
  text: I have spoken these things to you so that in me you may have peace[a]. In the world you have tribulation, but take courage[b]; I have overcome the world.
translation:
  language: te
  text: మీరు నాలో శాంతి కలిగి ఉండాలని ఈ సంగతులు మీతో చెప్పాను. లోకంలో మీకు శ్రమ[a] ఉంది, కానీ ధైర్యంగా ఉండండి[b]; నేను లోకాన్ని జయించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కష్టం,’ ‘బాధ,’ ‘వేదన.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నిబ్బరంగా ఉండండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: ఈ సంగతులు
  rationale: బహువచన సూచన సర్వనామాన్ని నిలుపుతూ, యేసు ఇంతకుముందు చెప్పిన బోధను సహజంగా సూచిస్తుంది.
- source_word: λελάληκα
  choice: చెప్పాను
  rationale: తెలుగులో సహజమైన భూతకాల రూపం; సందర్భంలో పూర్తయిన మాటల చర్యను, దాని ప్రస్తుత ప్రాముఖ్యతను తెలియజేస్తుంది.
- source_word: ἵνα
  choice: కలిగి ఉండాలని
  rationale: గ్రీకు ఉద్దేశార్థక భావాన్ని తెలుగులో సహజమైన ఉద్దేశ వాక్య నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: ἐν ἐμοὶ
  choice: నాలో
  rationale: యోహాను రచనలోని ప్రాముఖ్యమైన ‘నాలో’ అనే సంబంధ/ఐక్యత భాషను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
- source_word: εἰρήνην
  choice: శాంతి
  rationale: అంతరంగ నెమ్మది, సంపూర్ణ క్షేమం అనే భావాలకు చోటిస్తూ సాధారణంగా అర్థమయ్యే ప్రమాణ పదం.
- source_word: ἔχητε
  choice: కలిగి ఉండాలని
  rationale: ἵνα తో వచ్చిన వర్తమాన సుబ్జంక్టివ్ ఉద్దేశాన్ని, కొనసాగుతూ కలిగి ఉండే భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: ἐν τῷ κόσμῳ
  choice: లోకంలో
  rationale: ‘ఈ’ వంటి అదనపు నిర్దేశాన్ని చేర్చకుండా గ్రీకు పదబంధాన్ని, యోహాను రచనలోని ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: θλῖψιν
  choice: శ్రమ
  rationale: ఒత్తిడి, బాధ, కష్టం అనే గంభీర భావాన్ని తెలుగులో సహజంగా అందిస్తుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
- source_word: ἔχετε
  choice: మీకు ... ఉంది
  rationale: వర్తమాన సూచక క్రియను నేరుగా నిలుపుతుంది; భవిష్యత్తు కాలంగా మార్చదు.
- source_word: ἀλλὰ
  choice: అయినా
  rationale: లోకంలోని శ్రమకు, తరువాతి ధైర్య పిలుపుకు మధ్య బలమైన వ్యతిరేకతను సహజంగా చూపిస్తుంది.
- source_word: θαρσεῖτε
  choice: ధైర్యంగా ఉండండి
  rationale: ఆపదలో నిబ్బరంగా ఉండాలనే ఆజ్ఞను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: νενίκηκα
  choice: జయించాను
  rationale: పూర్తయి కొనసాగుతున్న విజయ ప్రభావాన్ని సందర్భం తెలియజేసేలా, నిర్ణాయక విజయాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: τὸν κόσμον
  choice: లోకాన్ని
  rationale: మొదటి κόσμος తో పదసామ్యాన్ని నిలిపి, దాని యోహానీయ బహుళార్థాన్ని అతిగా నిర్వచించదు.
theological_decisions:
- issue: యోహాను సందర్భంలో κόσμος అర్థం
  choice: రెండు చోట్లా ‘లోకం’
  alternative: ‘లోక వ్యవస్థ’ లేదా ‘పతనమైన ఈ లోకం’
  rationale: దేవునికి విరోధంగా ఉన్న మానవ లోక క్రమం అనే భావాన్ని సందర్భమే తెలియజేయనివ్వడం ద్వారా పదంలోని బహుళార్థాన్ని, ‘నాలో/లోకంలో’ అనే వ్యత్యాసాన్ని నిలుపుతుంది.
- issue: పరిపూర్ణ కాల క్రియల బలం
  choice: తెలుగులో సహజమైన ‘చెప్పాను’, ‘జయించాను’ రూపాలు
  alternative: ‘చెప్పి ఉన్నాను’, ‘జయించి ఉన్నాను’ వంటి రూపపరంగా విస్తరించిన అనువాదాలు
  rationale: తెలుగులో కృత్రిమంగా వినిపించే పదేపదే రూపాలను నివారిస్తూ, పూర్తయిన చర్యల కొనసాగుతున్న ప్రాముఖ్యతను సందర్భం ద్వారా నిలుపుతుంది; ముఖ్యంగా కథన కాలంలో సిలువకు ముందు పలికిన విజయ ప్రకటనలోని ఉద్దేశపూర్వక ఉద్వేగాన్ని పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; గౌరవప్రదమైన బహువచన సంబోధనతో సరళమైన, గంభీరమైన వాక్య నిర్మాణం. ‘నాలో’ మరియు ‘లోకం’ వంటి యోహానీయ కీలక పదాలను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలిపింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
