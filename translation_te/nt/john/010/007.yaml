id: JHN.10.7
reference: John 10:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ⸀ὅτι ἐγώ εἰμι ἡ θύρα τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/007.yaml
  text: So Jesus said to them again[a], “Truly, truly, I say to you, I am the door for the sheep.”
translation:
  language: te
  text: 'అందువల్ల యేసు మళ్లీ వారితో ఇలా అన్నాడు: “నిజంగా, నిజంగా మీతో చెబుతున్నాను: గొర్రెల ద్వారం నేనే.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గొర్రెల గుమ్మం నేనే.” ఇక్కడి గ్రీకు పదం తలుపు, ద్వారం లేదా గుమ్మం అని అర్థం కావచ్చు; గొర్రెల దొడ్డి సందర్భంలో “గుమ్మం” కూడా సహజమైన అర్థమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: అందువల్ల
  rationale: ముందటి మాటలను వారు గ్రహించకపోవడానికి ప్రతిస్పందనగా వచ్చే తార్కిక, కథన సంబంధాన్ని చూపిస్తుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: యేసు మరోసారి చెప్పడాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: Ἀμὴν ἀμὴν
  choice: నిజంగా, నిజంగా
  rationale: యోహాను సువార్తలోని గంభీరమైన ద్విగుణ ధృవీకరణను పునరుక్తితోనే నిలుపుతుంది; సాధారణ పాఠకులకు ‘ఆమేన్, ఆమేన్’ కంటే అర్థవంతంగా ఉంటుంది.
- source_word: λέγω ὑμῖν
  choice: మీతో చెబుతున్నాను
  rationale: గ్రీకు వర్తమానకాల వాక్యసూత్రాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
- source_word: ὅτι
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ప్రత్యక్ష ఉద్ధరణలో తెలుగు వాక్యనిర్మాణానికి వేరుగా ‘అని’ అవసరం లేదు; విషయవాక్యం పూర్తిగా నిలిచింది.
- source_word: ἐγώ εἰμι
  choice: నేనే
  rationale: గ్రీకులో వ్యక్తమైన కర్త సర్వనామం ఇచ్చే ఉద్ఘాటనను తెలుగు ‘నేనే’ సహజంగా నిలుపుతుంది.
- source_word: θύρα
  choice: ద్వారం
  rationale: ‘తలుపు’ లేదా ‘గుమ్మం’ అనే భావాలను కలిగిన పదానికి ఇది గౌరవప్రదమైన, రూపకానికి సరిపోయే విస్తృత తెలుగు సమానార్థకం.
- source_word: τῶν προβάτων
  choice: గొర్రెల
  rationale: గ్రీకు షష్ఠీ విభక్తిలోని సంబంధాన్ని ‘కోసం’ అని వివరణాత్మకంగా నిర్ణయించకుండా అలాగే నిలుపుతుంది.
theological_decisions:
- issue: ‘నేను’ అనే రూపకాత్మక స్వీయ-గుర్తింపు
  choice: గొర్రెల ద్వారం నేనే
  alternative: గొర్రెల కోసం ఉన్న ద్వారం నేనే
  rationale: యేసును ప్రవేశమార్గంగా చూపే రూపకాన్ని విస్తరించి సిద్ధాంతపరమైన వివరణగా మార్చకుండా నిలుపుతుంది.
- issue: τῶν προβάτων అనే షష్ఠీ విభక్తి సంబంధం
  choice: గొర్రెల ద్వారం
  alternative: గొర్రెల కోసం ద్వారం
  rationale: మూలంలోని సంబంధం ‘గొర్రెలకు సంబంధించిన ద్వారం’ లేదా ‘గొర్రెల కోసం ద్వారం’ అని అర్థమయ్యే అవకాశాన్ని కలిగి ఉంది. ప్రధాన పాఠం ఆ అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘అందువల్ల’ ముందటి సందర్భంతో అనుమానార్థక సంబంధాన్ని చూపిస్తుంది; ‘నేనే’ గ్రీకు ἐγώ యొక్క ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది. ప్రధాన పాఠంలో ‘గొర్రెల ద్వారం’ అని ఉంచి షష్ఠీ విభక్తి సంబంధాన్ని అతిగా వివరించలేదు.
