  revised_text: 'మరికొందరు ఇలా అంటూనే ఉన్నారు: “ఈ మాటలు దయ్యం పట్టినవాని మాటలు కావు. దయ్యం గుడ్డివారి కళ్లను తెరవగలదా?”'
