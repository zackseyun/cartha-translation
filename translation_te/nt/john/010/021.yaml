  naturalness: The wording is generally clear and modern. “మరికొందరు ఇలా అంటూనే ఉన్నారు” is natural narrative Telugu and supplies the needed past-continuative sense. The rhetorical question remains idiomatic in Telugu without adding interpretive material.
  terminology: “దయ్యం పట్టినవాని” / “దయ్యం” are established, readily understood renderings of δαιμονιζομένου / δαιμόνιον. “గుడ్డివారి కళ్లను తెరవడం” appropriately retains the Greek imagery and its contextual resonance.
  issues:
