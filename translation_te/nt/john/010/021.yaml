id: JHN.10.21
reference: John 10:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἄλλοι ἔλεγον· Ταῦτα τὰ ῥήματα οὐκ ἔστιν δαιμονιζομένου· μὴ δαιμόνιον δύναται τυφλῶν ὀφθαλμοὺς ⸀ἀνοῖξαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/021.yaml
  text: Others were saying[a], “These words are not those of a demon-possessed man. A demon cannot open the eyes of the blind, can it?”
translation:
  language: te
  text: 'మరికొందరు ఇలా అంటూనే ఉన్నారు: “ఈ మాటలు దయ్యం పట్టినవాని మాటలు కావు. దయ్యం గుడ్డివారి కళ్లను తెరవగలదా?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλοι
  choice: మరికొందరు
  rationale: ముందటి వచనంలో మాట్లాడినవారికి భిన్నమైన మరో వర్గాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఈ వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἔλεγον
  choice: ఇలా అంటున్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న లేదా పలుమార్లు వ్యక్తమైన మాటను సూచిస్తుంది. కథన సందర్భంలో తెలుగు వర్తమాన కాలం ఆ కొనసాగుతున్న సంభాషణను సహజంగా చూపిస్తుంది.
- source_word: Ταῦτα τὰ ῥήματα
  choice: ఈ మాటలు
  rationale: యేసు పలికిన మాటలను నేరుగా, సహజంగా సూచిస్తుంది.
- source_word: οὐκ ἔστιν δαιμονιζομένου
  choice: దయ్యం పట్టినవాని మాటలు కావు
  rationale: గ్రీకు షష్ఠీ విభక్తి నిర్మాణం ఈ మాటలు అలాంటి వ్యక్తికి చెందినవి కావని సూచిస్తుంది; తెలుగులో ఈ రూపం సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: μὴ ... δύναται
  choice: తెరవగలదా?
  rationale: μή ప్రతికూల సమాధానాన్ని ఆశించే అలంకార ప్రశ్నను సూచిస్తుంది. తెలుగు సందర్భంలో సాధారణ ప్రశ్నారూపమే ఆ ఆశించిన ‘లేదు’ అనే జవాబును స్పష్టంగా మోస్తుంది.
- source_word: δαιμόνιον
  choice: దయ్యం
  rationale: గ్రీకు పదానికి నేరమైన, ఆధునిక తెలుగులో విస్తృతంగా అర్థమయ్యే సమానార్థకం.
- source_word: τυφλῶν ὀφθαλμοὺς
  choice: గుడ్డివారి కళ్లను
  rationale: మూలంలోని స్పష్టమైన ‘కళ్లు’ అనే దృశ్యరూపాన్ని నిలుపుతూ, ముందరి స్వస్థత సంఘటనతో సంబంధాన్ని కాపాడుతుంది.
- source_word: ἀνοῖξαι
  choice: తెరవడం
  rationale: మూలంలోని ‘తెరచు’ అనే స్పష్టమైన రూపకాన్ని నిలుపుతుంది; ‘చూపు ఇవ్వడం’ అని వివరణాత్మకంగా మార్చదు.
theological_decisions:
- issue: δαιμονίζομαι / δαιμόνιον పదాల అనువాదం
  choice: దయ్యం పట్టినవాడు / దయ్యం
  alternative: దయ్యం వశమైనవాడు / అపవిత్రాత్మ
  rationale: మూలంలోని దయ్యసంబంధ భాషను మెత్తబరచకుండా నేరుగా అందిస్తుంది; అదే సమయంలో దయ్యం పట్టడం గురించి మూలం చెప్పనంత సాంకేతిక సిద్ధాంతాన్ని జోడించదు.
- issue: μή ప్రవేశపెట్టే అలంకార ప్రశ్న బలం
  choice: దయ్యం గుడ్డివారి కళ్లను తెరవగలదా?
  alternative: దయ్యం గుడ్డివారి కళ్లను తెరవలేదు కదా?
  rationale: ప్రశ్నకు ‘లేదు’ అనే జవాబు ఆశించబడుతున్నప్పటికీ, సాధారణ ప్రశ్నారూపం తెలుగులో సహజంగా ఉండి మూలంలోని ప్రశ్నను అలాగే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు కథన శైలిలో రూపొందించబడింది. ‘దయ్యం పట్టినవాడు’ అనే ప్రాచుర్యంలో ఉన్న పదబంధం వాడబడింది; ‘కళ్లను తెరవడం’ అనే మూల దృశ్యరూపం కాపాడబడింది.
