source:
  edition: SBLGNT
  text: τούτῳ ὁ θυρωρὸς ἀνοίγει, καὶ τὰ πρόβατα τῆς φωνῆς αὐτοῦ ἀκούει καὶ τὰ ἴδια πρόβατα ⸀φωνεῖ κατ’ ὄνομα καὶ ἐξάγει αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/003.yaml
  text: To him the gatekeeper opens[a], and the sheep hear his voice, and he calls his own sheep by name and leads them out.
translation:
  language: te
  text: అతనికి ద్వారపాలకుడు ద్వారం తెరుస్తాడు. గొర్రెలు అతని స్వరాన్ని వింటాయి. అతడు తన సొంత గొర్రెలను పేరుపేరున పిలిచి, వాటిని బయటికి నడిపిస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వాటిని బయటికి తీసుకువస్తాడు.’
    reason: ἐξάγει అనే క్రియకు ‘బయటికి నడిపిస్తాడు,’ ‘బయటికి తీసుకువస్తాడు’ అనే రెండు సందర్భోచిత అర్థఛాయలు ఉన్నాయి.
lexical_decisions:
- source_word: τούτῳ
  choice: అతనికి
  rationale: దత్తివిభక్తిలోని ఈ సర్వనామం ముందటి వచనంలోని కాపరిని సూచిస్తుంది. ‘అతనికి’ అనేది ఆ వ్యక్తిగత సూచనను సహజంగా నిలుపుతుంది.
- source_word: ὁ θυρωρός
  choice: ద్వారపాలకుడు
  rationale: ప్రవేశద్వారాన్ని కాపాడి తెరిచే వ్యక్తిని సూచిస్తుంది; గొర్రెల దొడ్డి సందర్భానికి ఇది స్పష్టమైన, ప్రస్తుత ప్రామాణిక తెలుగు పదం.
- source_word: ἀνοίγει
  choice: ద్వారం తెరుస్తాడు
  rationale: సాధారణ వర్తమానకాల క్రియను నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: τὰ πρόβατα
  choice: గొర్రెలు
  rationale: కాపరి రూపకంలోని πρόβατα పదానికి సాధారణ తెలుగు సమానార్థకం.
- source_word: τῆς φωνῆς αὐτοῦ ἀκούει
  choice: అతని స్వరాన్ని వింటాయి
  rationale: గ్రీకులో నపుంసకలింగ బహువచన కర్తతో ఏకవచన క్రియ రావడం సహజం; తెలుగులో భావానుసారంగా బహువచన క్రియ అవసరం. ‘స్వరం’ కాపరిని గుర్తించే సంబంధాత్మక భావాన్ని నిలుపుతుంది.
- source_word: τὰ ἴδια πρόβατα
  choice: తన సొంత గొర్రెలను
  rationale: ἴδια తెలిపే స్వామ్యాన్ని, ప్రత్యేక అనుబంధాన్ని ‘సొంత’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: φωνεῖ κατ’ ὄνομα
  choice: పేరుపేరున పిలిచి
  rationale: ప్రతి గొర్రెనూ దాని పేరుతో వ్యక్తిగతంగా పిలవడాన్ని సహజమైన తెలుగు నుడికారంతో తెలియజేస్తుంది.
- source_word: ἐξάγει αὐτά
  choice: వాటిని బయటికి నడిపిస్తాడు
  rationale: ἐξάγω అంటే బయటికి తీసుకురావడం లేదా నడిపించడం. కాపరి రూపకంలో ‘నడిపిస్తాడు’ వ్యక్తిగత మార్గదర్శకత్వాన్ని సజీవంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: కాపరి రూపకం మరియు క్రియల కర్తృత్వం
  choice: ద్వారపాలకుడు అతనికి ద్వారం తెరవడం, గొర్రెలు అతని స్వరం వినడం, అతడు తన గొర్రెలను పిలిచి బయటికి నడిపించడం అనే రూపక క్రియలను ఉన్నట్లుగానే అనువదించాం.
  alternative: ఈ వచనంలోనే కాపరిని యేసుగా స్పష్టంగా పేర్కొనే వ్యాఖ్యానాత్మక అనువాదం.
  rationale: సందర్భంలో ఈ రూపకానికి క్రీస్తుసంబంధమైన భావం ఉన్నప్పటికీ, గ్రీకు వచనం ఇక్కడ కాపరి వ్యక్తిని పేరుతో గుర్తించదు. అందువల్ల వ్యాఖ్యానాన్ని మూలపాఠ్యంలోకి చేర్చకుండా రూపకంలోని భావ ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన శైలి వాడాం. చిన్న వాక్యాలతో గ్రీకు వాక్యంలోని వరుస క్రియలను స్పష్టపరిచాం; ‘పేరుపేరున’ అనే సహజ నుడికారం వ్యక్తిగత పిలుపును నిలుపుతుంది.
