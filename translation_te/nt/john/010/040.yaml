id: JHN.10.40
reference: John 10:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν πάλιν πέραν τοῦ Ἰορδάνου εἰς τὸν τόπον ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων, καὶ ἔμεινεν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/040.yaml
  text: And he went away again across the Jordan to the place where John had first been baptizing[a], and he stayed there.
translation:
  language: te
  text: ఆయన మళ్లీ యొర్దాను అవతలనున్న, యోహాను మొదట బాప్తిస్మం ఇస్తున్న చోటికి వెళ్లి అక్కడ ఉండిపోయాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: వెళ్లి
  rationale: సందర్భంలో ఆ ప్రదేశం నుంచి బయలుదేరి మరో చోటికి వెళ్లడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: చర్య పునరావృతమైందనే సాధారణ క్రియావిశేషణ భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: యొర్దాను అవతలికి
  rationale: పέραν + షష్ఠీ విభక్తి యొర్దాను నదికి అవతలి వైపును సూచిస్తుంది; ‘అవతలికి’ గమ్యదిశను కూడా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς τὸν τόπον
  choice: చోటికి
  rationale: εἰς సూచించే గమ్యస్థాన దిశను సంక్షిప్తమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὅπου ἦν Ἰωάννης
  choice: యోహాను ... ఉన్న చోటికి
  rationale: గ్రీకు అసంపూర్ణ భూతకాలంలోని స్థితిని తెలుగు ఉపవాక్య నిర్మాణంలో సహజంగా నిలుపుతుంది.
- source_word: τὸ πρῶτον
  choice: మొదట
  rationale: యోహాను పరిచర్యలోని పూర్వ దశను సూచించే కాలార్థాన్ని నేరుగా కాపాడుతుంది.
- source_word: βαπτίζων
  choice: బాప్తిస్మం ఇస్తూ
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న కార్యభావాన్ని ‘ఇస్తూ’ నిర్మాణం సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἔμεινεν
  choice: ఉన్నాడు
  rationale: μένω యొక్క అక్కడ నిలిచి ఉండడం అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐκεῖ
  choice: అక్కడే
  rationale: స్థల సూచనను స్పష్టంగా ఉంచుతూ, యేసు అదే ప్రదేశంలో ఉండిపోయాడనే భావానికి సహజమైన బలం ఇస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని వాక్యక్రమాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగు పఠన సౌలభ్యానికి అనుగుణంగా కృదంత నిర్మాణం వాడబడింది. ‘యొర్దాను అవతలికి’ అనే పదబంధం మూలంలోని భౌగోళిక సంబంధాన్ని స్పష్టంగా అందిస్తుంది; ప్రత్యేక పాదటిప్పణి అవసరం లేదు.
