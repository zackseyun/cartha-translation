id: JHN.10.20
reference: John 10:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔλεγον δὲ πολλοὶ ἐξ αὐτῶν· Δαιμόνιον ἔχει καὶ μαίνεται· τί αὐτοῦ ἀκούετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/020.yaml
  text: But many of them were saying[a], “He has a demon and is insane. Why do you listen to him?”
translation:
  language: te
  text: అయితే వారిలో చాలామంది, “ఇతనికి దయ్యం పట్టింది, ఇతను పిచ్చివాడు. ఇతని మాట ఎందుకు వింటున్నారు?” అని చెబుతూ ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇతనిలో దయ్యం ఉంది, ఇతను పిచ్చివాడు.”
    reason: Δαιμόνιον ἔχειను మరింత పదశఃగా, మరియు μαίνεταιను ప్రత్యక్ష ఆరోపణగా నిలుపుతూ చూపించే ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: ἔλεγον
  choice: అని అంటూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం ఆ సందర్భంలో కొనసాగుతున్న లేదా పదేపదే పలికిన మాటను సూచిస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందున్న వాక్యభాగంతో వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో చూపిస్తుంది.
- source_word: πολλοὶ ἐξ αὐτῶν
  choice: వారిలో చాలామంది
  rationale: సమూహంలోని కొందరిని సూచించే భాగార్థక నిర్మాణాన్ని సహజంగా నిలుపుతుంది.
- source_word: Δαιμόνιον ἔχει
  choice: ఇతనికి దయ్యం పట్టింది
  rationale: పదశః ‘ఇతనికి దయ్యం ఉంది’ అనేది తెలుగులో అసహజంగా ఉండవచ్చు; ‘దయ్యం పట్టింది’ మూలంలోని ఆరోపణను సాధారణ తెలుగు వాడుకలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: μαίνεται
  choice: ఇతనికి పిచ్చి
  rationale: మానసిక స్థిమితం లేనివాడని ప్రత్యర్థులు చేసిన ఆరోపణను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది; ఇది వారి మాటగానే నిలుస్తుంది.
- source_word: τί αὐτοῦ ἀκούετε;
  choice: ఇతని మాట ఎందుకు వింటున్నారు?
  rationale: ఇక్కడ τί సందర్భానుసారంగా ‘ఎందుకు?’ అనే భావాన్ని ఇస్తుంది; αὐτοῦ ἀκούετε అంటే అతని మాటకు చెవియొగ్గడం లేదా వినడం.
theological_decisions:
- issue: యేసు స్థితి గురించి ప్రత్యర్థుల విరోధపూరిత ఆరోపణ
  choice: ఇతనికి దయ్యం పట్టింది; ఇతనికి పిచ్చి
  alternative: ఇతనిలో దయ్యం ఉంది; ఇతను వెర్రివాడిలా ప్రవర్తిస్తున్నాడు
  rationale: ఇది కథకుడి నిర్ధారణగా కాకుండా ప్రత్యర్థుల నిందారోపణగా స్పష్టంగా ఉంచుతుంది; ఆరోపణను మృదువుచేయకుండా, దానికి అదనపు సిద్ధాంత వివరణను కూడా జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగానూ, బైబిలు వచనానికి తగిన గంభీరతతోనూ ఉంది. ‘ఇతను/ఇతని’ రూపాలు ప్రత్యర్థుల తృణీకార స్వరాన్ని అతిగా పెంచకుండా సంభాషణలో సహజంగా నిలుపుతాయి.
