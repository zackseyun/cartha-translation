  yaml_path: translation/nt/john/010/026.yaml
  text: But you do not believe[a], because you are not among my sheep.
translation:
  language: te
  text: కాని మీరు నమ్మరు[a], ఎందుకంటే మీరు నా గొర్రెలకు చెందినవారు కారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు నా గొర్రెలకు చెందినవారు కారని మీరు నమ్మరు.” గ్రీకు సంధానపదాన్ని కారణాన్ని సూచించేదిగా కాకుండా, నమ్మకపు విషయాన్ని పరిచయం చేసేదిగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: ముందున్న మాటతో వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ὑμεῖς
  choice: మీరు
  rationale: గ్రీకులో కర్త సర్వనామం స్పష్టంగా ఉండి కొంత నొక్కి చెబుతుంది; తెలుగులో ‘మీరు’ దానిని అతిశయింపకుండా తెలియజేస్తుంది.
- source_word: οὐ πιστεύετε
  choice: నమ్మడం లేదు
  rationale: నిరాకరణతో కూడిన వర్తమానకాల క్రియను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; యోహాను సందర్భంలో ‘నమ్మడం’ సముచితం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: సందర్భ ప్రవాహంలో ఇది కారణార్థకంగా ఉండే అవకాశం ఎక్కువ; అయినా విషయార్థక పఠనాన్ని పాదసూచికలో నిలుపుతున్నాం.
- source_word: οὐκ ἐστὲ
  choice: కారు
  rationale: తెలుగులో బహువచన గౌరవార్థక కర్తకు సరిపోయే సహజమైన నిరాకరణాత్మక సంధాయక రూపం.
- source_word: ἐκ τῶν προβάτων
  choice: గొర్రెలలోనివారు
  rationale: ἐκ ఇక్కడ ఒక సమూహానికి చెందినవారనే భావాన్ని ఇస్తుంది; ‘లోనివారు’ ఆ సభ్యత్వ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τῶν ἐμῶν
  choice: నా
  rationale: స్వామ్యాన్ని తెలుగులో నేరుగా, సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: అవిశ్వాసానికి, యేసు గొర్రెలలో చేరికకు మధ్య ὅτι సూచించే సంబంధం
  choice: 'కారణార్థకం: ‘ఎందుకంటే మీరు నా గొర్రెలలోనివారు కారు’'
  alternative: 'విషయార్థకం: ‘మీరు నా గొర్రెలలోనివారు కారని మీరు నమ్మడం లేదు’'
  rationale: తక్షణ సందర్భంలో యేసు గొర్రెలు ఆయన స్వరం విని ఆయనను అనుసరిస్తారనే మాటకు వీరి అవిశ్వాసం వ్యతిరేకంగా నిలుస్తుంది; అందువల్ల కారణార్థం సందర్భానికి బాగా సరిపోతుంది. అయితే గ్రీకు ὅτι విషయాన్ని పరిచయం చేసే అర్థాన్నీ అనుమతిస్తుంది కాబట్టి, సిద్ధాంతపరమైన ఉద్రిక్తతను ఏకపక్షంగా పరిష్కరించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అదే సమయంలో గౌరవప్రదంగా ఉంది. ‘గొర్రెలలోనివారు’ అనే రూపం సమూహానికి చెందినవారనే భావాన్ని కాపాడుతుంది. ప్రధాన పాఠంలోని [a] పాదసూచిక గుర్తుతో సరిపోతుంది.
