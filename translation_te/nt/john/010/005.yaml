  verdict: revise
  source_fidelity: The draft accurately renders the contrast, the emphatic οὐ μή negation, the sheep’s refusal to follow, their flight away from the outsider, and their lack of knowledge/recognition of outsiders’ voices. The singular ‘అపరిచితుని’ and plural ‘అపరిచితుల’ appropriately reflect the Greek.
  naturalness: The wording is clear modern standard Telugu. Replacing the somewhat colloquial/spatial ‘అతని దగ్గర నుంచి’ with ‘అతని నుండి’ more directly and naturally conveys ἀπ’ αὐτοῦ (‘from him’).
  terminology: ‘అపరిచితుడు,’ ‘వెంబడించు,’ and ‘స్వరం’ preserve the shepherding metaphor without importing an ethnic sense or an allegorical identification. ‘ఎంతమాత్రమూ’ suitably conveys emphatic negation.
  issues:
