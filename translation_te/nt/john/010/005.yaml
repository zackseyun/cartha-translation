    issue: ‘అతని దగ్గర నుంచి’ is less precise for ἀπ’ αὐτοῦ.
    rationale: It can emphasize physical proximity (‘from near him’), whereas the Greek directly says that they flee ‘from him.’ ‘అతని నుండి’ is a closer, idiomatic rendering.
