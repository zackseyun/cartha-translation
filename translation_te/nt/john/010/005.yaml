  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλοτρίῳ δὲ οὐ μὴ ⸀ἀκολουθήσουσιν ἀλλὰ φεύξονται ἀπ’ αὐτοῦ, ὅτι οὐκ οἴδασι τῶν ἀλλοτρίων τὴν φωνήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/005.yaml
  text: But they will certainly not follow a stranger[a]; instead, they will flee from him[b], because they do not know the voice of strangers.
translation:
  language: te
  text: కాని అవి అపరిచితుని ఎంతమాత్రమూ వెంబడించవు[a]; బదులుగా అతని నుండి పారిపోతాయి. ఎందుకంటే అపరిచితుల స్వరం వాటికి తెలియదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అపరిచితుని ఎన్నటికీ వెంబడించవు.” గ్రీకులో οὐ μή అనే బలమైన నిరాకరణ ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “స్వరం తెలియదు” అనే మాటను “స్వరాన్ని గుర్తుపట్టవు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: అపరిచితుని
  rationale: గొర్రెల కాపరి రూపకంలో, గొర్రెలకు చెందినవాడు కాని మరియు వాటికి పరిచయం లేని వ్యక్తిని సూచిస్తుంది. ‘విదేశీయుడు’ అనడం జాతి లేదా దేశ సంబంధమైన భావాన్ని అనవసరంగా చేర్చుతుంది.
- source_word: οὐ μὴ ἀκολουθήσουσιν
  choice: ఎంతమాత్రమూ వెంబడించవు
  rationale: οὐ μή తో కూడిన భవిష్యత్ క్రియ బలమైన నిరాకరణను వ్యక్తం చేస్తుంది. ‘ఎంతమాత్రమూ ... వెంబడించవు’ అనేది ఆ ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἀκολουθήσουσιν
  choice: వెంబడించవు
  rationale: గొర్రెలు కాపరిని అనుసరించే సందర్భంలో ‘వెంబడించు’ సహజంగా ఉండి, ముందున్న వ్యక్తి వెంట వెళ్లే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: φεύξονται ἀπ’ αὐτοῦ
  choice: అతని దగ్గర నుంచి పారిపోతాయి
  rationale: φεύγω మరియు ἀπό కలయిక ఆ వ్యక్తి నుంచి దూరంగా పారిపోవడాన్ని సూచిస్తుంది. ఈ అనువాదం కేవలం తప్పించుకోవడం కంటే బలమైన ప్రతిస్పందనను నిలుపుతుంది.
- source_word: οἴδασι
  choice: తెలియదు
  rationale: οἶδα తెలుసుకోవడం లేదా గుర్తుపట్టడం అనే భావాలను ఇవ్వగలదు. ‘స్వరం వాటికి తెలియదు’ అనడం మూలంలోని విస్తృత భావాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: τῶν ἀλλοτρίων
  choice: అపరిచితుల
  rationale: బహువచన షష్ఠీ రూపాన్ని నేరుగా ప్రతిబింబిస్తూ, గొర్రెలకు పరిచయం లేని వ్యక్తుల వర్గాన్ని సూచిస్తుంది.
- source_word: φωνήν
  choice: స్వరం
  rationale: ఇక్కడ φωνή గుర్తించదగిన పిలుపు లేదా గొంతుస్వరాన్ని సూచిస్తుంది; ‘స్వరం’ దాని అక్షరార్థాన్నీ సంబంధాత్మక భావాన్నీ నిలుపుతుంది.
- source_word: δὲ ... ἀλλὰ
  choice: కాని ... ; ... పారిపోతాయి
  rationale: వెంబడించకపోవడం మరియు విరుద్ధంగా పారిపోవడం మధ్య ఉన్న వ్యత్యాసాన్ని ‘కాని’తోను వాక్య నిర్మాణంతోను సహజంగా వ్యక్తం చేసింది.
theological_decisions:
- issue: గొర్రెలు–కాపరి రూపకపు భావం
  choice: రూపకాన్ని వివరించకుండా యథాతథంగా నిలుపడం
  alternative: ‘అపరిచితుడు’ అంటే అబద్ధ బోధకుడు లేదా అక్రమ నాయకుడు అని ప్రధాన వచనంలో స్పష్టీకరించడం
  rationale: ఈ వచనం రూపకంలోనే మాట్లాడుతుంది; అపరిచితుడు ఎవరిని సూచిస్తున్నాడో ఇక్కడ ప్రత్యక్షంగా నిర్వచించదు. అనువాదంలో ఆ గుర్తింపును చేర్చడం మూలపాఠానికి మించిన వ్యాఖ్యానం అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘అపరిచితుడు’ రూపకాన్ని జాతి లేదా దేశ భావం వైపు మళ్లించకుండా ఉంచుతుంది; బలమైన గ్రీకు నిరాకరణను ‘ఎంతమాత్రమూ’తో వ్యక్తం చేసింది.
