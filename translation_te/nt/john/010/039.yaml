base_translation:
  language: en
  yaml_path: translation/nt/john/010/039.yaml
  text: So they were seeking again to seize him[a], but he escaped from their hand.
translation:
  language: te
  text: అందుచేత వారు మళ్లీ ఆయనను పట్టుకోవడానికి ప్రయత్నించారు. కానీ ఆయన వారి చేతి నుండి[a] బయటపడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘వారి చేయి నుండి.’ ‘వారి చేతుల నుండి’ లేదా ‘వారి పట్టు నుండి’ అని కూడా అనువదించవచ్చు. గ్రీకులో ‘చేయి’ ఏకవచనంలో ఉంది; ఇది వారి అధికారం లేదా అదుపును సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: ప్రయత్నించారు
  rationale: అసంపూర్ణ భూతకాల రూపం గతంలో కొనసాగిన లేదా ఫలించని ప్రయత్నాన్ని సూచిస్తుంది. తెలుగులో ‘పట్టుకోవడానికి ప్రయత్నించారు’ అనడం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: οὖν
  choice: అందుచేత
  rationale: ముందటి సంభాషణ ఫలితంగా జరిగిన పరిణామాన్ని సూచించే అనుసంధానాన్ని నిలుపుతుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: ఇంతకుముందు కూడా ఆయనను పట్టుకోవడానికి చేసిన ప్రయత్నం పునరావృతమైందని నేరుగా తెలియజేస్తుంది.
- source_word: πιάσαι
  choice: పట్టుకోవడానికి
  rationale: శారీరకంగా అదుపులోకి తీసుకోవాలనే విరోధపూరిత ఉద్దేశాన్ని తెలియజేస్తుంది; మూలంలో స్పష్టంగా లేని అధికారిక న్యాయపరమైన ‘అరెస్టు’ భావాన్ని చేర్చదు.
- source_word: ἐξῆλθεν
  choice: బయటికి వెళ్లిపోయాడు
  rationale: ఈ క్రియ యొక్క ప్రాథమిక అర్థమైన ‘బయటికి వెళ్లాడు’ను నిలుపుతుంది. సందర్భంలో తప్పించుకున్న భావం ఉన్నప్పటికీ, మూలంలో ప్రత్యేకమైన ‘తప్పించుకున్నాడు’ అనే క్రియ లేదు.
- source_word: ἐκ τῆς χειρὸς αὐτῶν
  choice: వారి చేతిలోనుండి
  rationale: గ్రీకులో ఏకవచనంగా ఉన్న ‘వారి చేయి నుండి’ అనే అధికారము లేదా అదుపును సూచించే నుడికారాన్ని తెలుగులో దగ్గరగా, అర్థమయ్యేలా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: యేసు తప్పించుకున్నాడని స్పష్టంగా చెప్పాలా, లేక మూలంలోని ‘వారి చేతిలోనుండి బయటికి వెళ్లాడు’ అనే కథన రూపాన్ని నిలుపాలా
  choice: ‘వారి చేతిలోనుండి బయటికి వెళ్లిపోయాడు’ అనే మూలానికి దగ్గరైన రూపాన్ని నిలుపడం
  alternative: ‘వారి నుండి తప్పించుకున్నాడు’ లేదా ‘వారి పట్టు నుండి తప్పించుకున్నాడు’
  rationale: సందర్భం ఆయనను వారు పట్టుకోలేకపోయారని సూచిస్తుంది. అయితే గ్రీకు పాఠం ప్రత్యేకంగా ‘తప్పించుకున్నాడు’ అని కాకుండా, వారి చేతిలోనుండి బయటికి వెళ్లాడని చెబుతుంది. ఈ రూపం ఫలితాన్ని తెలియజేస్తూనే మూలంలోని వ్యక్తీకరణను అనవసరంగా విప్పి చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘అరెస్టు చేయడం’ వంటి అదనపు న్యాయపరమైన భావాన్ని నివారించి, మూలంలోని భౌతికంగా పట్టుకోవాలనే భావం మరియు నుడికారపు స్వరూపం నిలుపబడ్డాయి.
