revisions:
- from: అందుచేత వారు మళ్లీ ఆయనను పట్టుకోవడానికి ప్రయత్నించారు. కానీ ఆయన వారి చేతిలోనుండి[a] బయటికి వెళ్లిపోయాడు.
  to: అందుచేత వారు మళ్లీ ఆయనను పట్టుకోవడానికి ప్రయత్నించారు. కానీ ఆయన వారి చేతి నుండి[a] బయటపడ్డాడు.
  rationale: The revision replaces an unnatural literal calque with a standard Telugu idiom. It preserves the Greek singular ‘hand,’ the idiomatic reference to the opponents’ control, and the narrative result, while avoiding the more explicit interpretive verb ‘తప్పించుకున్నాడు.’
