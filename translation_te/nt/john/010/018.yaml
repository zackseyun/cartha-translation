  to: దాన్ని నా నుండి ఎవరూ తీసివేయరు. అయితే నా అంతట నేనే దాన్ని వదులుతాను.[a] దాన్ని వదులుకోవడానికి నాకు అధికారం ఉంది; దాన్ని మళ్లీ తీసుకోవడానికి కూడా నాకు అధికారం ఉంది.[b][c] ఈ ఆజ్ఞను నా తండ్రి నుండి పొందాను.
  rationale: మూలంలోని τίθημι మరియు θεῖναι పునరుక్తిని ‘వదులుతాను / వదులుకోవడానికి’గా ఒకే పదబంధంతో నిలిపాం. దీనివల్ల యేసు చర్య స్వచ్ఛందమైనదనే భావం నిలుస్తుంది; అయితే మూలంలో ప్రత్యక్షంగా లేని బలిపరమైన ‘అర్పణ’ భావాన్ని చేర్చదు. పాదటిప్పణి aను పదబంధపు అర్థానికే పరిమితం చేశాం. పాదటిప్పణి గుర్తులు, వాటి క్రమం, మరియు సూచ్యానికి సంబంధించిన వివరణలు నిలిపివేయబడ్డాయి.
