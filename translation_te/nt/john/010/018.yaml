id: JHN.10.18
reference: John 10:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδεὶς ⸀αἴρει αὐτὴν ἀπ’ ἐμοῦ, ἀλλ’ ἐγὼ τίθημι αὐτὴν ἀπ’ ἐμαυτοῦ. ἐξουσίαν ἔχω θεῖναι αὐτήν, καὶ ἐξουσίαν ἔχω πάλιν λαβεῖν αὐτήν· ταύτην τὴν ἐντολὴν ἔλαβον παρὰ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/018.yaml
  text: No one takes it from me[a], but I lay it down of myself. I have authority to lay it down, and I have authority to take it up again[c][b]. This command I received from my Father.
translation:
  language: te
  text: దాన్ని నా నుండి ఎవరూ తీసివేయరు. అయితే నా అంతట నేనే దాన్ని వదులుతాను.[a] దాన్ని వదులుకోవడానికి నాకు అధికారం ఉంది; దాన్ని మళ్లీ తీసుకోవడానికి కూడా నాకు అధికారం ఉంది.[b][c] ఈ ఆజ్ఞను నా తండ్రి నుండి పొందాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా అంతట నేనే’ అంటే ‘నా ఇష్టపూర్వకంగా’ లేదా ‘నా స్వంత చొరవతో’ అని కూడా అనువదించవచ్చు. యేసు తన ప్రాణాన్ని స్వచ్ఛందంగా విడిచిపెడుతున్నాడని ఈ మాట నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘అధికారం’ అనే గ్రీకు పదాన్ని ‘హక్కు’ లేదా ‘శక్తి’ అని కూడా అనువదించవచ్చు. అది కార్యసామర్థ్యంతో పాటు దానికి గల సముచిత అధికారాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: ‘దాన్ని’ అంటే యేసు ప్రాణాన్ని సూచిస్తుంది; వెంటనే ముందున్న యోహాను 10:17లో ‘నా ప్రాణం’ అని ఉంది. ‘మళ్లీ తీసుకోవడానికి’ అనే మాటను ‘మళ్లీ పొందడానికి’ అని కూడా అనువదించవచ్చు.
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: αἴρει
  choice: తీసివేయరు
  rationale: ἀπόతో కలిసి ఇక్కడ ‘నా నుండి తీసివేయడం’ అనే భావం వస్తుంది. ఇది యేసు స్వచ్ఛందంగా ప్రాణం అర్పించడాన్ని తరువాతి వాక్యంతో స్పష్టంగా వ్యతిరేకిస్తుంది.
- source_word: τίθημι αὐτὴν / θεῖναι αὐτήν
  choice: దాన్ని అర్పిస్తాను / దాన్ని అర్పించడానికి
  rationale: తెలుగులో ప్రాణాన్ని ‘పెట్టడం’ సహజంగా వేరే భావాలను ఇవ్వవచ్చు. సందర్భంలో ప్రాణాన్ని స్వచ్ఛందంగా ఇవ్వడాన్ని ‘అర్పించడం’ సహజంగా వ్యక్తం చేస్తుంది; రెండు చోట్ల ఒకే పదాన్ని వాడి గ్రీకు పునరుక్తిని నిలిపింది.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: నా అంతట నేనే
  rationale: యేసు స్వచ్ఛంద కార్యసామర్థ్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. చివరలో తండ్రి ఆజ్ఞ ప్రస్తావన ఉండటంతో, ఇది తండ్రికి స్వతంత్రంగా వ్యవహరించాడని తేల్చదు.
- source_word: ἐξουσίαν
  choice: అధికారం
  rationale: ఈ పదం కేవలం సామర్థ్యాన్ని మాత్రమే కాక, చట్టబద్ధమైన హక్కు లేదా అనుమతితో కూడిన అధికారాన్ని సూచించగలదు. తండ్రి ఇచ్చిన ఆజ్ఞతో దాని సంబంధాన్ని ‘అధికారం’ బాగా నిలుపుతుంది.
- source_word: πάλιν λαβεῖν αὐτήν
  choice: దాన్ని మళ్లీ తీసుకోవడానికి
  rationale: πάλινను ‘మళ్లీ’గా స్పష్టంగా ఉంచి, λαμβάνωలోని క్రియాశీలమైన ‘తీసుకోవడం’ భావాన్ని కాపాడింది; ‘తిరిగి పొందడం’ అనే భావసాధ్యతను పాదటిప్పణిలో సూచించింది.
- source_word: ἐντολήν
  choice: ఆజ్ఞ
  rationale: ἐντολή యొక్క ప్రత్యక్ష అర్థాన్ని కాపాడుతూ, తండ్రి-కుమారుల మధ్య ఈ వచనం పేర్కొనే సంబంధాన్ని మృదువుగా మార్చకుండా ఉంచుతుంది.
- source_word: παρὰ τοῦ πατρός μου
  choice: నా తండ్రి నుండి
  rationale: παρά + షష్ఠీ విభక్తి ఇక్కడ మూలం లేదా ఇచ్చినవారిని సూచిస్తుంది; ‘నా తండ్రి నుండి’ ఆధునిక తెలుగులో సహజం.
theological_decisions:
- issue: యేసు మరణం, పునరుత్థానానికి సంబంధించి ἐξουσία అర్థం
  choice: అధికారం
  alternative: శక్తి; హక్కు
  rationale: వచనం కేవలం సామర్థ్యాన్ని కాక, యేసు స్వచ్ఛంద కార్యాన్ని మరియు తండ్రి ఆజ్ఞతో దానికి ఉన్న సమన్వయాన్ని చూపుతుంది. ‘అధికారం’ ఈ రెండింటినీ కలిపి ఉంచుతుంది.
- issue: ἀπ’ ἐμαυτοῦ యొక్క భావబలం
  choice: నా అంతట నేనే
  alternative: నా ఇష్టప్రకారం; నా స్వంత చొరవతో
  rationale: యేసు ప్రాణార్పణం స్వచ్ఛందమని తెలియజేస్తూనే, వెంటనే వచ్చే తండ్రి ఆజ్ఞను బట్టి ఆయన తండ్రికి విరుద్ధంగా లేదా స్వతంత్రంగా చేశాడనే భావాన్ని అనువాదం బలవంతంగా చేర్చదు.
- issue: αὐτήν అనే సర్వనామం దేనిని సూచిస్తుంది
  choice: దాన్ని
  alternative: నా ప్రాణాన్ని
  rationale: సమీప సందర్భంలోని ‘నా ప్రాణం’ (యోహాను 10:17)ను ఇది తిరిగి సూచిస్తుంది. సర్వనామాన్ని నిలిపి గ్రీకు వాక్య నిర్మాణాన్ని కాపాడుతూ, పాదటిప్పణిలో దాని సూచ్యాన్ని స్పష్టం చేసింది.
- issue: πάλιν λαβεῖνలో యేసు కార్యసామర్థ్యం
  choice: మళ్లీ తీసుకోవడం
  alternative: మళ్లీ పొందడం
  rationale: ‘తీసుకోవడం’ యేసు స్వయంగా కార్యం చేస్తున్న భావాన్ని నిలుపుతుంది; అయితే λαμβάνωకు ‘పొందడం’ అనే భావం కూడా సాధ్యమని పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి వాడబడింది. ‘నా అంతట నేనే’ సహజమైన స్వచ్ఛందతను చూపుతుంది; ‘ప్రాణాన్ని పెట్టడం’ తెలుగులో కలిగించే అనిశ్చిత భావాలను నివారించేందుకు సందర్భానుగుణంగా ‘అర్పించడం’ ఎంచుకోబడింది. మూలంలోని సర్వనామ పునరుక్తి ‘దాన్ని’ ద్వారా నిలుపబడింది.
