id: JHN.10.29
reference: John 10:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ πατήρ μου ⸀ὃ δέδωκέν ⸀μοι ⸂πάντων μεῖζων⸃ ἐστίν, καὶ οὐδεὶς δύναται ἁρπάζειν ἐκ τῆς χειρὸς τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/029.yaml
  text: My Father[a], who has given them to me, is greater than all, and no one is able to snatch them out of the Father's hand.
translation:
  language: te
  text: నాకు వారిని ఇచ్చిన నా తండ్రి[a] అన్నిటికంటే గొప్పవాడు; తండ్రి చేతిలోనుండి వారిని ఎవరూ లాక్కోలేరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “నా తండ్రి నాకు ఇచ్చినది అన్నిటికంటే గొప్పది.” ఇక్కడి గ్రీకు పదప్రయోగం క్లిష్టమైనది; కొందరు, ఇవ్వబడిన వ్యక్తులకు బదులు ఇచ్చినదే పోలికకు కర్తగా అర్థం చేసుకుంటారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατήρ μου
  choice: నా తండ్రి
  rationale: యేసుకు దేవునితో ఉన్న కుమార సంబంధాన్ని అదనపు వివరణ లేకుండా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὃ δέδωκέν μοι
  choice: నాకు వారిని ఇచ్చిన
  rationale: నపుంసక ఏకవచన సంబంధసర్వనామం వాక్యనిర్మాణపరంగా క్లిష్టమైనది. ముందున్న గొర్రెల సందర్భం మరియు వారు లాక్కోబడటం గురించిన సమాంతర భావం దృష్ట్యా, వ్యక్తులను సూచించే ‘వారిని’ అని సందర్భార్థాన్ని స్పష్టం చేశాం; సంపూర్ణ కాలంలోని కొనసాగుతున్న ఫలితాన్ని ‘ఇచ్చిన’ సహజంగా తెలియజేస్తుంది.
- source_word: πάντων μεῖζων
  choice: అందరికంటే గొప్పవాడు
  rationale: తండ్రి అనే వ్యక్తిని ఉద్దేశించినందున తెలుగులో సహజమైన వ్యక్తివాచక పోలికను వాడాం. గ్రీకు πάντων యొక్క విస్తృత పోలికను నిర్దిష్ట వర్గానికి పరిమితం చేయలేదు.
- source_word: οὐδεὶς δύναται ἁρπάζειν
  choice: ఎవరూ లాక్కోలేరు
  rationale: సామర్థ్యలేమిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, ἁρπάζειν లోని బలవంతంగా అపహరించే భావాన్ని ‘లాక్కోవడం’ నిలుపుతుంది.
- source_word: ἐκ τῆς χειρὸς τοῦ πατρός
  choice: తండ్రి చేతిలోనుండి
  rationale: ἐκ యొక్క ‘లోపలినుండి బయటకు’ భావాన్నీ, రక్షణాత్మక అధీనానికి మరియు శక్తికి సూచకమైన ‘చెయ్యి’ రూపకాలంకారాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: ὃ δέδωκέν μοι లోని పాఠాంతర మరియు వాక్యనిర్మాణ క్లిష్టత
  choice: ముందున్న గొర్రెలను సూచిస్తూ ‘నాకు వారిని ఇచ్చిన నా తండ్రి’ అని ప్రధాన పాఠంలో అనువదించడం
  alternative: ‘నా తండ్రి నాకు ఇచ్చినది అన్నిటికంటే గొప్పది’ లేదా ‘నా తండ్రి—ఆయన నాకు ఇచ్చినది—అందరికంటే గొప్పవాడు’
  rationale: ముద్రిత గ్రీకు వాక్యనిర్మాణం క్లిష్టంగా ఉంది; ప్రతులలో కూడా పాఠభేదాలున్నాయి. సందర్భం తండ్రి కుమారునికి ఇచ్చిన గొర్రెల గురించి కాబట్టి వ్యక్తులను సూచించే పఠనం ప్రధాన పాఠానికి సహజం. అయితే బహుమతినే పోలికకు కర్తగా గ్రహించే అవకాశం నిజమైనది కాబట్టి దాన్ని పాదసూచికలో నిలిపాం.
- issue: πάντων μεῖζων లో పోలిక పరిధి
  choice: ‘అందరికంటే గొప్పవాడు’ అని విస్తృత పోలికను ఉంచడం
  alternative: ‘అన్నిటికంటే గొప్పవాడు’
  rationale: πάντων వ్యక్తులనో సమస్త విషయాలనో సూచించగల విస్తృత రూపం. తెలుగు వ్యాకరణంలో తండ్రిని సూచించే ప్రధాన పఠనానికి ‘అందరికంటే’ సహజమైనప్పటికీ, పోలికను ఏ నిర్దిష్ట మానవ వర్గానికీ పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘లాక్కోలేరు’ తక్షణ బలవంతపు అపహరణ భావాన్ని సహజంగా ఇస్తుంది. ప్రధాన పాఠంలో [a] గుర్తు సంబంధిత క్లిష్ట వాక్యభాగం వెంట ఉంచబడింది.
