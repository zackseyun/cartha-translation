revisions:
- from: అతడు తనవాటినన్నిటినీ బయటికి తీసుకొచ్చినప్పుడు[a], వాటికి ముందుగా నడుస్తాడు. గొర్రెలు అతని స్వరం ఎరుగుతాయి కాబట్టి అతని వెంట వెళ్తాయి.
  to: అతడు తనకు చెందినవన్నిటినీ బయటికి తీసుకొచ్చినప్పుడు[a], వాటి ముందుగా వెళ్తాడు; గొర్రెలు అతని వెంట వెళ్తాయి, ఎందుకంటే వాటికి అతని స్వరం తెలుసు.
