source:
  edition: SBLGNT
  text: ⸀ὅταν τὰ ἴδια ⸀πάντα ἐκβάλῃ, ἔμπροσθεν αὐτῶν πορεύεται, καὶ τὰ πρόβατα αὐτῷ ἀκολουθεῖ, ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/004.yaml
  text: When he has brought out all his own[a], he goes before them, and the sheep follow him, because they know his voice.
translation:
  language: te
  text: అతడు తనకు చెందినవన్నిటినీ బయటికి తీసుకొచ్చినప్పుడు[a], వాటి ముందుగా వెళ్తాడు; గొర్రెలు అతని వెంట వెళ్తాయి, ఎందుకంటే వాటికి అతని స్వరం తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బయటికి తోలినప్పుడు,” లేదా “బయటికి నడిపించినప్పుడు”; గ్రీకు క్రియకు గొర్రెల కొట్టం వంటి ఆవరణలో నుంచి తోలడం లేదా బయటికి తీసుకురావడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: ఎప్పుడు … అప్పుడు అనే భావంలో ‘…తీసుకొచ్చినప్పుడు’
  rationale: అనిర్దిష్ట కాలసూచక ఉపవాక్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; సందర్భంలోని సాధారణంగా జరిగే చర్య భావాన్ని కాపాడుతుంది.
- source_word: τὰ ἴδια πάντα
  choice: తనవాటినన్నిటినీ
  rationale: ‘తనకు చెందినవన్నీ’ అనే గ్రీకు నపుంసక బహువచన ప్రయోగాన్ని కాపాడుతూ, సందర్భానుసారం అవి గొర్రెలని పాఠకుడు గ్రహించేలా చేస్తుంది; తరువాత వచ్చే ‘గొర్రెలు’ అనే పదాన్ని ముందుగానే చేర్చదు.
- source_word: ἐκβάλῃ
  choice: బయటికి తీసుకొచ్చినప్పుడు
  rationale: మంద నుంచి బయటికి కదిలించే భావాన్ని స్పష్టంగా తెలియజేస్తుంది. గ్రీకు క్రియలో ఉండగల ‘తోలడం’ అనే బలమైన ఛాయను పాదసూచికలో ఉంచి, ఈ కాపరి సందర్భంలో అనవసరమైన కఠినత్వాన్ని ప్రధాన పాఠ్యంలో నివారిస్తుంది.
- source_word: ἔμπροσθεν αὐτῶν πορεύεται
  choice: వాటికి ముందుగా నడుస్తాడు
  rationale: కాపరి మందకు ముందు వెళ్లే దృశ్యాన్ని సహజమైన తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: τὰ πρόβατα αὐτῷ ἀκολουθεῖ
  choice: గొర్రెలు … అతని వెంట వెళ్తాయి
  rationale: ἀκολουθέω యొక్క అనుసరించే భావాన్ని సాధారణ తెలుగు నుడికారమైన ‘వెంట వెళ్తాయి’తో వ్యక్తపరుస్తుంది.
- source_word: ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ
  choice: అతని స్వరం ఎరుగుతాయి కాబట్టి
  rationale: ὅτι తెలిపే కారణాన్ని ‘కాబట్టి’తో స్పష్టం చేస్తుంది. ‘ఎరుగుతాయి’ అనేది కేవలం శబ్దాన్ని గుర్తుపట్టడం కంటే విస్తృతమైన ‘తెలుసుకోవడం’ భావాన్ని నిలుపుతూ, గౌరవప్రదమైన సహజ శైలిని ఇస్తుంది.
theological_decisions:
- issue: కాపరి దృశ్యంలో ἐκβάλῃ క్రియ బలం
  choice: బయటికి తీసుకొచ్చినప్పుడు
  alternative: బయటికి తోలినప్పుడు; బయటికి నడిపించినప్పుడు
  rationale: సందర్భం కాపరి తన సొంత గొర్రెలను మంద నుంచి బయటికి తీసుకురావడం గురించినది; శత్రుత్వపూర్వకంగా వెళ్లగొట్టడం గురించినది కాదు. అందువల్ల ప్రధాన పాఠ్యం బయటికి కదిలించే భావాన్ని నిలుపుతుంది; క్రియలోని బలమైన ప్రత్యామ్నాయ భావాలను పాదసూచిక వెల్లడిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘తనవాటినన్నిటినీ’ గ్రీకు ప్రయోగంలోని ఉద్దేశపూర్వక సాధారణతను కాపాడుతుంది; ‘గొర్రెలు’ తరువాత స్పష్టంగా వస్తుంది. ప్రధాన పాఠ్యంలోని [a] పాదసూచిక గుర్తుతో సరిపోతుంది.
