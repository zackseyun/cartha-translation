revisions:
- from: 'యూదులు ఆయనకు ఇలా జవాబిచ్చారు: “మంచి పని చేసినందుకు మేము నిన్ను రాళ్లతో కొట్టడం లేదు; దేవదూషణ చేసినందుకే కొడుతున్నాం. ఎందుకంటే, నువ్వు మనిషివై ఉండి నిన్ను నీవు దేవునిగా చేసుకుంటున్నావు[a].”'
  to: 'యూదులు ఆయనకు ఇలా జవాబిచ్చారు: “మంచి పని చేసినందుకు మేము నిన్ను రాళ్లతో కొట్టడం లేదు; దేవదూషణ కారణంగా, నువ్వు మనిషివై ఉండి నిన్ను నీవే దేవునిగా చేసుకుంటున్నావు కాబట్టి రాళ్లతో కొడుతున్నాం[a].”'
  rationale: The revision maintains the source’s single causal structure (“for blasphemy, and because ...”), retains the explicit stoning imagery on both sides of the contrast, and preserves the contextual yet grammatically disputed sense of θεόν through the anchored footnote. No doctrinal conclusion beyond the accusers’ stated charge is added.
