id: JHN.10.33
reference: John 10:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ οἱ ⸀Ἰουδαῖοι· Περὶ καλοῦ ἔργου οὐ λιθάζομέν σε ἀλλὰ περὶ βλασφημίας, καὶ ὅτι σὺ ἄνθρωπος ὢν ποιεῖς σεαυτὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/033.yaml
  text: The Jews answered him[a], “We are not stoning you for a good work, but for blasphemy, and because you, being a man, make yourself God.”
translation:
  language: te
  text: 'యూదులు ఆయనకు ఇలా జవాబిచ్చారు: “మంచి పని చేసినందుకు మేము నిన్ను రాళ్లతో కొట్టడం లేదు; దేవదూషణ కారణంగా, నువ్వు మనిషివై ఉండి నిన్ను నీవే దేవునిగా చేసుకుంటున్నావు కాబట్టి రాళ్లతో కొడుతున్నాం[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిన్ను నీవు ఒక దేవుడిగా చేసుకుంటున్నావు.” గ్రీకులో θεόν అనే పదానికి నిర్దిష్ట ఉపపదం లేదు. అయితే దేవదూషణ ఆరోపణ ఉన్న ఈ సందర్భంలో “దేవునిగా” అనే అర్థమే ఎక్కువ సంభావ్యం.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰουδαῖοι
  choice: యూదులు
  rationale: గ్రీకు పదానికి నేరమైన అనువాదం. ఈ సందర్భంలో యేసును ఎదిరిస్తున్న సమూహాన్ని సూచిస్తుంది; ‘యూదుల నాయకులు’ అని అనువదిస్తే మూలంలో లేని పరిమితిని విధించినట్లవుతుంది.
- source_word: Περὶ καλοῦ ἔργου
  choice: మంచి పని చేసినందుకు
  rationale: περί + షష్ఠీ విభక్తి ఇక్కడ కారణాన్ని లేదా వివాద విషయాన్ని తెలియజేస్తుంది. ఏకవచన ἔργουను నిలుపుతూ సహజమైన తెలుగులో కారణార్థాన్ని వ్యక్తపరుస్తుంది.
- source_word: λιθάζομέν
  choice: రాళ్లతో కొట్టడం లేదు … కొడుతున్నాం
  rationale: వర్తమానకాల క్రియలోని తక్షణ చర్య లేదా ఉద్దేశాన్ని సహజమైన తెలుగులో నిలుపుతుంది. రెండవ భాగంలో తెలుగు వాక్య సంపూర్ణత కోసం క్రియను పునరుక్తం చేశాం.
- source_word: βλασφημίας
  choice: దేవదూషణ
  rationale: ఈ సందర్భంలో దేవునికి కలిగే అవమానాన్ని సూచించే ప్రామాణికమైన, సంక్షిప్తమైన తెలుగు పదం.
- source_word: ἄνθρωπος ὢν
  choice: మనిషివై ఉండి
  rationale: మూలంలోని పరిస్థిత్యర్థక/వ్యతిరేక భావం రెండింటినీ బలవంతంగా విడదీయకుండా నిలుపుతుంది; ఆరోపణ చేసేవారు ఉద్దేశించిన మానవత్వం–దైవస్థానం మధ్య వ్యత్యాసాన్ని వ్యక్తపరుస్తుంది.
- source_word: ποιεῖς σεαυτὸν θεόν
  choice: నిన్ను నీవు దేవునిగా చేసుకుంటున్నావు
  rationale: ప్రతిబింబ సర్వనామం మరియు విధేయ ద్వితీయను దగ్గరగా అనుసరిస్తుంది. ఈ దేవదూషణ ఆరోపణ సందర్భంలో θεόνను ‘దేవుడు’ అనే భావంలో అనువదించడం అత్యంత సంభావ్యం; వ్యాకరణపరమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: ποιεῖς σεαυτὸν θεόνలో θεόν అనువాదం
  choice: దేవునిగా
  alternative: ఒక దేవుడిగా
  rationale: θεόνకు నిర్దేశక ఉపపదం లేకపోవడం వల్ల విడిగా చూస్తే రెండు అర్థాలూ వ్యాకరణపరంగా సాధ్యమే. అయితే దేవదూషణ ఆరోపణ మరియు యోహాను సువార్తలోని ఏకదైవ సందర్భం దృష్ట్యా ‘దేవునిగా’ అనేది ఆరోపణ బలాన్ని మెరుగ్గా తెలియజేస్తుంది. నిజమైన వ్యాకరణ సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే సంభాషణ శైలి. గ్రీకులోని ప్రత్యక్ష సంబోధన బలాన్ని నిలుపడానికి ఉద్ధరణలో ‘నువ్వు/నిన్ను’ వాడాం; కథన భాగంలో ‘ఆయనకు’ వాడాం.
