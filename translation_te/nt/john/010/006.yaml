revisions:
- from: యేసు ఈ అలంకారిక ఉపమానాన్ని వారికి చెప్పాడు[a]. అయితే ఆయన తమతో చెప్పిన మాటల అర్థం ఏమిటో వారు గ్రహించలేదు.
  to: యేసు ఈ అలంకారిక మాటను వారికి చెప్పాడు[a]. కానీ ఆయన వారికి ఏమి చెబుతున్నాడో వారు గ్రహించలేదు.
  rationale: The revision corrects the addressee expression from the reflexive “తమతో” to “వారికి,” preserves the ongoing sense of ἐλάλει with “చెబుతున్నాడో,” and uses the broader, more idiomatic “అలంకారిక మాట” for παροιμία. The footnote is adjusted to match this wording and to express the figurative sense naturally.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:29:15Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ figurative speech and the hearers’ failure to understand it. However, the final αὐτοῖς means “to them”; rendering it “తమతో” (“with themselves/their own”) is not idiomatic for the intended referent and does not preserve the Greek dative of addressee. The imperfect ἐλάλει is well represented by “చెబుతున్నాడో.”
  naturalness: The proposed revision is natural modern standard Telugu. “అలంకారిక మాట” is less cumbersome than “అలంకారిక ఉపమానం” and retains the deliberately broad sense of παροιμία. “కాని” supplies the contrast clearly.
  terminology: “అలంకారిక మాట” appropriately avoids narrowing παροιμία to a technical parable. The footnote retains viable alternatives, including “ఉపమానం,” “దృష్టాంతం,” and “సామెత,” while explaining the broad figurative sense.
  issues:
  - severity: medium
    issue: The phrase “ఆయన తమతో చెప్పిన” uses the reflexive pronoun తమతో.
    rationale: The Greek αὐτοῖς is “to them,” not “with themselves.” In this context, “తమతో” is grammatically and semantically unsuitable; “వారికి” correctly identifies them as the addressees.
  - severity: low
    issue: “అలంకారిక ఉపమానం” is somewhat redundant and can suggest a narrower comparison-based form.
    rationale: παροιμία has a broad Johannine sense of a figurative or veiled saying. “అలంకారిక మాట” is clearer in Telugu and better preserves that breadth.
  revised_text: యేసు ఈ అలంకారిక మాటను వారికి చెప్పాడు[a]. కానీ ఆయన వారికి ఏమి చెబుతున్నాడో వారు గ్రహించలేదు.
  revised_footnotes:
  - marker: a
    text: లేదా “ఉపమానం,” “దృష్టాంతం,” లేదా “సామెత.” గ్రీకు పదం విస్తృతంగా అలంకారికమైన లేదా నిగూఢమైన మాటను సూచించగలదు; ఇక్కడ అది యేసు కాపరి గురించి చెప్పిన మాటలు అక్షరార్థంలో కాకుండా రూపకంగా ఉన్నాయని సూచిస్తుంది.
    reason: lexical_alternative
  revision_rationale: The revision corrects the addressee expression from the reflexive “తమతో” to “వారికి,” preserves the ongoing sense of ἐλάλει with “చెబుతున్నాడో,” and uses the broader, more idiomatic “అలంకారిక మాట” for παροιμία. The footnote is adjusted to match this wording and to express the figurative sense naturally.
