id: JHN.10.6
reference: John 10:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ταύτην τὴν παροιμίαν εἶπεν αὐτοῖς ὁ Ἰησοῦς· ἐκεῖνοι δὲ οὐκ ἔγνωσαν τίνα ⸀ἦν ἃ ἐλάλει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/006.yaml
  text: Jesus spoke this figure of speech to them[a], but they did not understand what he was saying to them.
translation:
  language: te
  text: యేసు ఈ అలంకారిక మాటను వారికి చెప్పాడు[a]. కానీ ఆయన వారికి ఏమి చెబుతున్నాడో వారు గ్రహించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఉపమానం,” “దృష్టాంతం,” లేదా “సామెత.” గ్రీకు పదం విస్తృతంగా అలంకారికమైన లేదా నిగూఢమైన మాటను సూచించగలదు; ఇక్కడ అది యేసు కాపరి గురించి చెప్పిన మాటలు అక్షరార్థంలో కాకుండా రూపకంగా ఉన్నాయని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαν
  choice: అలంకారిక ఉపమానం
  rationale: ఈ పదం సామెతను, ఉపమానాన్ని, లేదా నిగూఢమైన అలంకారిక వాక్యాన్ని సూచించగలదు. ఇక్కడ కాపరి గురించిన మాటలు అక్షరార్థంలో కాకుండా రూపకాలంకారంగా చెప్పబడినందున, సాంకేతికంగా ‘ఉపమానకథ’ అని పరిమితం చేయకుండా ‘అలంకారిక ఉపమానం’ అని అనువదించాం.
- source_word: εἶπεν
  choice: చెప్పాడు
  rationale: తెలుగులో ఒక ఉపమానాన్ని ఉద్దేశించి ‘చెప్పాడు’ అనడం సహజంగా ఉండి, సంబోధించి మాట్లాడిన క్రియను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐκεῖνοι δὲ
  choice: అయితే ... వారు
  rationale: ἐκεῖνοι యేసుకు మరియు వినినవారికి మధ్య వ్యత్యాసాన్ని సూచిస్తుంది; δέ ఇక్కడ వైరుధ్యాన్ని తెలియజేస్తుంది. ‘అయితే ... వారు’ ఆధునిక తెలుగులో ఆ వ్యత్యాసాన్ని సహజంగా నిలుపుతుంది.
- source_word: οὐκ ἔγνωσαν
  choice: గ్రహించలేదు
  rationale: సందర్భంలో సమస్య యేసు మాటల భావాన్ని తెలుసుకోలేకపోవడం కాదు, వాటిని అర్థం చేసుకోలేకపోవడం. ‘గ్రహించలేదు’ ఈ భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: τίνα ἦν ἃ ἐλάλει αὐτοῖς
  choice: ఆయన తమతో చెప్పిన మాటల అర్థం ఏమిటో
  rationale: గ్రీకు నిర్మాణం అక్షరార్థంగా కొంత అసహజంగా ఉన్నప్పటికీ, వారు ఆయన చెప్పిన సంగతుల భావాన్ని గ్రహించలేదన్నదే ఉద్దేశం. ఈ తెలుగు రూపం ఆ భావాన్ని స్పష్టంగా అందిస్తుంది; ‘అర్థం’ అనే పదం సందర్భార్థాన్ని బహిర్గతం చేస్తుంది.
- source_word: αὐτοῖς
  choice: వారికి / తమతో
  rationale: మొదటి αὐτοῖς‌ను పరోక్ష కర్మగా ‘వారికి’ అని, చివరిదాన్ని తెలుగు వాక్యప్రవాహానికి తగినట్లు ‘తమతో’ అని ఇచ్చి, మూలంలోని పునరుక్తిని భావపరంగా నిలిపాం.
