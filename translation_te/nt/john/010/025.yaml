id: JHN.10.25
reference: John 10:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Εἶπον ὑμῖν καὶ οὐ πιστεύετε· τὰ ἔργα ἃ ἐγὼ ποιῶ ἐν τῷ ὀνόματι τοῦ πατρός μου ταῦτα μαρτυρεῖ περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/025.yaml
  text: Jesus answered them[a], “I told you, and you do not believe[b]. The works that I do in the name of my Father—these testify about me.”
translation:
  language: te
  text: 'యేసు వారికి ఇలా జవాబిచ్చాడు: “నేను మీకు చెప్పాను, అయినా మీరు నమ్మడం లేదు. నా తండ్రి పేరున నేను చేస్తున్న ఈ కార్యాలే నా గురించి సాక్ష్యం ఇస్తున్నాయి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: జవాబిచ్చాడు
  rationale: సంభాషణ సందర్భంలో ἀποκρίνομαιకు సహజమైన ఆధునిక తెలుగు రూపం; యేసు వారి ప్రశ్నకు స్పందించాడనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: Εἶπον ὑμῖν
  choice: నేను మీకు చెప్పాను
  rationale: గతంలో వారికి చెప్పిన మాటను సూచించే గ్రీకు ఏఒరిస్ట్ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: οὐ πιστεύετε
  choice: మీరు నమ్మడం లేదు
  rationale: యోహాను సువార్తలో πιστεύωకు ఉన్న ముఖ్యమైన ‘నమ్ము/విశ్వసించు’ భావాన్ని కాపాడుతూ, సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: τὰ ἔργα
  choice: కార్యాలు
  rationale: యేసు చేసే క్రియలు, సూచక కార్యాలు అనే యోహానీయ భావాన్ని ‘పనులు’ కంటే గౌరవప్రదంగా, విస్తృతంగా వ్యక్తపరుస్తుంది.
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: నా తండ్రి పేరట
  rationale: తండ్రికి ప్రాతినిధ్యం వహించడం, ఆయన అధికారంతో చేయడం అనే భావ పరిధిని ముందే ఒక్క అర్థానికి పరిమితం చేయకుండా గ్రీకు నుడికారాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: ταῦτα μαρτυρεῖ περὶ ἐμοῦ
  choice: కార్యాలే నా గురించి సాక్ష్యమిస్తున్నాయి
  rationale: ταῦτα యొక్క ఉద్ఘాటనను ‘కార్యాలే’ ద్వారా చూపిస్తూ, μαρτυρέωలోని సాక్ష్య భావాన్ని మరియు యోహాను సువార్తలో దాని ప్రాముఖ్యతను కాపాడుతుంది.
theological_decisions:
- issue: యేసు చేసే కార్యాలకు తండ్రి పేరు, అధికారం, ప్రాతినిధ్యంతో ఉన్న సంబంధం
  choice: నా తండ్రి పేరట
  alternative: నా తండ్రి అధికారంతో
  rationale: గ్రీకు పదబంధం దైవిక అధికారాన్ని సూచించగలిగినా, అది ప్రాతినిధ్యం మరియు సంబంధం వంటి విస్తృత భావాలను కూడా కలిగి ఉంది. ‘పేరట’ అనే అనువాదం వాక్యం చెప్పినదానికంటే ఎక్కువ సిద్ధాంత వివరణను చేర్చకుండా ఆ భావ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘నామమందు’ వంటి ప్రాచీన రూపాన్ని నివారించి ‘పేరట’ను ఎంచుకున్నాం. గ్రీకులో ఉద్ఘాటించబడిన ταῦτα భావాన్ని తెలుగులో ‘కార్యాలే’ ద్వారా సహజంగా వ్యక్తపరిచాం.
