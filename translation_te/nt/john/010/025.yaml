  source_fidelity: మూల గ్రీకు వాక్యంలోని గతకాలపు «నేను మీకు చెప్పాను», ప్రస్తుతకాలపు «మీరు నమ్మడం లేదు», అలాగే తండ్రి పేరులో యేసు చేసే కార్యాలు ఆయన గురించి సాక్ష్యమివ్వడం అనే భావాలు ముసాయిదాలో సరిగ్గానే ఉన్నాయి. అయితే ముందుకు తెచ్చిన ταῦτα (‘ఇవే/ఈవి’) ఉద్ఘాటనను ‘ఈ కార్యాలే’ అని స్పష్టపరచడం మరింత సమీపమైన ప్రతిరూపం.
