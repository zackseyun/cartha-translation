id: JHN.10.12
reference: John 10:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ⸀μισθωτὸς καὶ οὐκ ὢν ποιμήν, οὗ οὐκ ⸀ἔστιν τὰ πρόβατα ἴδια, θεωρεῖ τὸν λύκον ἐρχόμενον καὶ ἀφίησιν τὰ πρόβατα καὶ φεύγει— καὶ ὁ λύκος ἁρπάζει αὐτὰ καὶ ⸀σκορπίζει—
base_translation:
  language: en
  yaml_path: translation/nt/john/010/012.yaml
  text: The hired hand[a], who is not a shepherd and whose sheep are not his own, sees the wolf coming and leaves the sheep and flees—and the wolf snatches them and scatters them.
translation:
  language: te
  text: కూలివాడు కాపరి కాదు, గొర్రెలు అతనివి కావు; అతడు తోడేలు వస్తుండగా చూసి గొర్రెలను వదిలేసి పారిపోతాడు—తోడేలు వాటిని లాక్కొని చెదరగొడుతుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μισθωτός
  choice: కూలికి పనిచేసేవాడు
  rationale: వేతనం కోసం పనిచేసే వ్యక్తిని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండి, నిజమైన కాపరితో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: οὐκ ὢν ποιμήν
  choice: కాపరి కాదు
  rationale: గ్రీకు భాగధేయ నిర్మాణంలోని విధేయ భావాన్ని స్పష్టమైన తెలుగు వాక్యంగా అందిస్తుంది.
- source_word: οὗ οὐκ ἔστιν τὰ πρόβατα ἴδια
  choice: గొర్రెలు అతనివి కావు
  rationale: గొర్రెలపై అతనికి యాజమాన్యం లేదా వ్యక్తిగత అనుబంధం లేదనే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: θεωρεῖ
  choice: చూసి
  rationale: ప్రమాదం సమీపిస్తున్నదని గ్రహించే దృశ్యాన్ని సందర్భానుగుణంగా, అతివ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
- source_word: τὸν λύκον ἐρχόμενον
  choice: తోడేలు రావడం
  rationale: తోడేలు సమీపిస్తున్న కదలికను గ్రీకు వర్తమాన భాగధేయానికి సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀφίησιν
  choice: వదిలి
  rationale: ఈ క్రియకు ‘వదలడం’ లేదా సందర్భానుసారంగా ‘విడిచిపెట్టడం’ అనే బలమైన భావం ఉండవచ్చు; ప్రధాన పాఠంలో విస్తృతమైన అర్థాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: φεύγει
  choice: పారిపోతాడు
  rationale: ప్రమాదం నుంచి తప్పించుకొని పోవడాన్ని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἁρπάζει
  choice: పట్టుకొని
  rationale: తోడేలు గొర్రెలపై బలవంతంగా పట్టు సాధించే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; వెంటనే వచ్చే చెదరగొట్టే చర్యతో సులభంగా కలుస్తుంది.
- source_word: σκορπίζει
  choice: చెదరగొడుతుంది
  rationale: గొర్రెలను విడివిడిగా చెదరగొట్టే చర్యను సూటిగా తెలియజేస్తుంది.
- source_word: πρόβατα
  choice: గొర్రెలు
  rationale: సామూహిక పదమైన ‘మంద’కు బదులు మూలంలోని బహువచన, సజీవ కాపరి రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: కాపరి రూపకంలోని భావబలం
  choice: ‘కాపరి,’ ‘కూలికి పనిచేసేవాడు,’ ‘గొర్రెలు’ అనే పశుపోషణ పదాలను యథాతథ రూపకంగా నిలుపడం
  alternative: ‘నాయకుడు’ లేదా ‘సంరక్షకుడు’ వంటి వ్యాఖ్యానాత్మక పదాలను ఉపయోగించడం
  rationale: యోహాను 10 అంతటా కొనసాగే కాపరి రూపకాన్ని మూలపాఠం ఉద్దేశించినట్లే నిలుపుతుంది; నిర్దిష్ట మతపరమైన వ్యాఖ్యానాన్ని పాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరత కోల్పోకుండా రూపొందించబడింది. గ్రీకు వాక్యంలోని వేగవంతమైన చర్యల క్రమాన్ని నిలుపుతూ, తెలుగు సహజ వాక్య నిర్మాణం కోసం మొదటి భాగాన్ని రెండు ఉపవాక్యాలుగా ఇచ్చాం.
