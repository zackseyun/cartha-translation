    issue: Footnote alternative uses the dative phrase “గొర్రెలకు ఒక కాపరి.”
    rationale: This does not most naturally express the Greek genitive τῶν προβάτων (“of the sheep”) and may shift the relation toward beneficiary (“for the sheep”). “ఒక గొర్రెల కాపరి” is the idiomatic Telugu indefinite alternative and retains the same shepherd–sheep relation.
  revised_text: అయితే ద్వారం గుండా ప్రవేశించేవాడు గొర్రెల కాపరి[a].
