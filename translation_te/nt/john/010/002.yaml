  edition: SBLGNT
  text: ὁ δὲ εἰσερχόμενος διὰ τῆς θύρας ποιμήν ἐστιν τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/002.yaml
  text: But the one who enters through the door is the shepherd of the sheep[a].
translation:
  language: te
  text: అయితే ద్వారం గుండా ప్రవేశించేవాడు గొర్రెల కాపరి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఒక గొర్రెల కాపరి.” గ్రీకులో ‘కాపరి’ అనే విధేయ నామవాచకానికి ఉపపదం లేదు; అయితే అక్రమంగా ప్రవేశించేవారికి భిన్నంగా హక్కుగల కాపరిని సందర్భం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰσερχόμενος
  choice: అయితే … ప్రవేశించేవాడు
  rationale: δέ ముందటి వచనంలోని దొంగలు, దోపిడీదారులతో ఉన్న వ్యత్యాసాన్ని సూచిస్తుంది; కర్తార్థక వర్తమాన కృదంతం ఒక వ్యక్తిని అతని సహజ చర్య ద్వారా గుర్తిస్తుంది. ఆధునిక తెలుగులో ‘ప్రవేశించేవాడు’ ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: διὰ τῆς θύρας
  choice: ద్వారం గుండా
  rationale: షష్ఠీ విభక్తితో διά ఒక దాని గుండా జరిగే చలనాన్ని సూచిస్తుంది. ‘ద్వారం గుండా’ మూలంలోని స్థలార్థక చిత్రాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ποιμήν
  choice: కాపరి
  rationale: ποιμήνకు సాధారణ అర్థం ‘కాపరి’. గ్రీకులో ఇది విధేయ నామవాచకంగా ఉపపదం లేకుండా ఉంది; తెలుగు ఉపపదాలను వాడదు కాబట్టి ‘కాపరి’ సహజంగా ఉండి, నిర్దిష్టతను సందర్భానికే వదిలేస్తుంది.
- source_word: τῶν προβάτων
  choice: గొర్రెల
  rationale: πρόβατα అనే మూలపదంలోని ప్రత్యక్ష ‘గొర్రెలు’ అనే చిత్రాన్ని కాపాడుతుంది; ‘మంద’ అని అనువదించడం అదనపు వ్యాఖ్యానంగా ఉంటుంది.
theological_decisions:
- issue: విధేయ నామవాచకమైన ποιμήν నిర్దిష్టత
  choice: గొర్రెల కాపరి
  alternative: గొర్రెలకు ఒక కాపరి
  rationale: గ్రీకులో ποιμήνకు ఉపపదం లేకున్నా, సందర్భం అక్రమంగా ప్రవేశించేవారికి భిన్నంగా హక్కుగల కాపరిని గుర్తిస్తుంది. అయితే తెలుగులో నిర్దిష్ట/అనిర్దిష్ట ఉపపదాలు లేనందున ‘కాపరి’ మూలంలోని వ్యాకరణ అస్పష్టతను సహజంగా నిలుపుతూ, నిర్దిష్ట భావాన్ని సందర్భం ద్వారా అందిస్తుంది; తరువాతి క్రీస్తుశాస్త్ర సంబంధ భావాలను ఈ వాక్యంలోకి బలవంతంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘ద్వారం గుండా’ మరియు ‘గొర్రెల కాపరి’ మూల రూపకాన్ని నేరుగా నిలుపుతాయి. తెలుగు వాక్యంగా సహజంగా ఉండేందుకు ‘అతడే’ లేదా ‘అవుతాడు’ వంటి మూలంలో లేని బలపరిచే పదాలు చేర్చలేదు.
