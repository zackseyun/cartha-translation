  alternative: ‘విరగగొట్టబడదు’ లేదా ‘పక్కన పెట్టబడదు’
  rationale: λυθῆναι ఇక్కడ లేఖనపు అధికారాన్ని చెల్లనిదిగా చేయడం లేదా తొలగించడం సాధ్యం కాదనే భావాన్ని ఇస్తుంది. సంప్రదాయ రూపకాన్ని ప్రత్యామ్నాయంగా పాదటిప్పణిలో సూచిస్తుంది.
