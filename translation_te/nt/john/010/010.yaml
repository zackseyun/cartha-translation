id: JHN.10.10
reference: John 10:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ κλέπτης οὐκ ἔρχεται εἰ μὴ ἵνα κλέψῃ καὶ θύσῃ καὶ ἀπολέσῃ· ἐγὼ ἦλθον ἵνα ζωὴν ἔχωσιν καὶ περισσὸν ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/010.yaml
  text: The thief comes only to steal and slaughter and destroy[a]; I came so that they may have life[b], and have it abundantly.
translation:
  language: te
  text: దొంగ దొంగిలించడానికి, వధించడానికి, నాశనం చేయడానికి మాత్రమే వస్తాడు[a]. వారు జీవం కలిగి ఉండాలని, దాన్ని సమృద్ధిగా కలిగి ఉండాలని నేను వచ్చాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వధించడానికి’ (θύσῃ) బదులు ‘చంపడానికి’ అని కూడా అనువదించవచ్చు. ఈ గ్రీకు క్రియ తరచుగా జంతువులను వధించడాన్ని సూచిస్తుంది; ఈ సందర్భంలోని గొర్రెల దృశ్యానికి అది సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారు జీవాన్ని సమృద్ధిగా కలిగి ఉండాలని”; లేదా, “వారు జీవాన్ని సంపూర్ణంగా కలిగి ఉండాలని.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ κλέπτης
  choice: దొంగ
  rationale: నిర్దిష్ట/ప్రాతినిధ్య ఏకవచన భావాన్ని తెలుగు సహజంగా ‘దొంగ’ ద్వారా తెలియజేస్తుంది; కాపరి ప్రసంగంలో ఇది ఒక ప్రాతినిధ్య వ్యక్తిని సూచిస్తుంది.
- source_word: οὐκ ἔρχεται εἰ μὴ
  choice: మాత్రమే వస్తాడు
  rationale: ‘ఇది తప్ప మరొక ఉద్దేశంతో రాడు’ అనే ప్రత్యేక ఉద్దేశ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἵνα κλέψῃ
  choice: దొంగిలించడానికి
  rationale: ἵνα ఉద్దేశాన్ని తెలుగు క్రియార్థక రూపం సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: θύσῃ
  choice: వధించడానికి
  rationale: θύω జంతువులను వధించడాన్ని తరచుగా సూచిస్తుంది; గొర్రెల సందర్భంలో ‘చంపడానికి’ కంటే ‘వధించడానికి’ మూలపదపు దృశ్యాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: ἀπολέσῃ
  choice: నాశనం చేయడానికి
  rationale: దొంగిలించడం, వధించడం అనే వరుసలో సంపూర్ణ విధ్వంస భావాన్ని తెలియజేస్తూ, విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: ἐγὼ ἦλθον
  choice: నేను వచ్చాను
  rationale: గ్రీకు ఏఓరిస్ట్‌ను సహజమైన తెలుగు భూతకాలంతో అందించి, దొంగ ఉద్దేశానికి యేసు రాక ఉద్దేశాన్ని విరుద్ధంగా నిలుపుతుంది.
- source_word: ἵνα ζωὴν ἔχωσιν
  choice: వారు జీవం కలిగి ఉండాలని
  rationale: ఉద్దేశ ఉపవాక్యాన్ని నిలుపుతూ, యోహాను రచనలో కీలకమైన ζωή పదాన్ని ‘నిత్యజీవం’ అని విస్తరించకుండా ‘జీవం’గానే ఉంచుతుంది.
- source_word: περισσὸν ἔχωσιν
  choice: దాన్ని సమృద్ధిగా కలిగి ఉండాలని
  rationale: περισσόν జీవాన్ని కలిగి ఉండే పరిమాణం లేదా సంపూర్ణతను సూచిస్తుంది; ‘దాన్ని’ అనేది జీవాన్ని తిరిగి సూచించి తెలుగు వాక్యాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: యోహాను వాడుకలో ζωή పరిధి
  choice: జీవం
  alternative: నిత్యజీవం; నిజమైన జీవం
  rationale: ఈ వచనంలో ‘నిత్య’ అనే విశేషణం లేదు. ‘జీవం’ అనే రూపం యోహాను సంబంధిత లోతును నిలుపుతూ, మూలంలో లేని ప్రత్యేక సిద్ధాంత పదబంధాన్ని చేర్చదు.
- issue: περισσόν యొక్క భావబలం
  choice: సమృద్ధిగా
  alternative: పరిపూర్ణంగా; సమృద్ధిలో
  rationale: యేసు ఇచ్చే జీవంలోని సమృద్ధి లేదా నిండుదనాన్ని తెలియజేస్తుంది; దాన్ని భౌతిక సంపద లేదా ఐశ్వర్య వాగ్దానంగా విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూడు విధ్వంసక క్రియల సమాంతరతను నిలిపి, తరువాతి రెండు ఉద్దేశ ఉపవాక్యాల మధ్య వ్యత్యాసాన్ని స్పష్టంగా ఉంచింది. ‘జీవం’ను సిద్ధాంతపరంగా విస్తరించలేదు; ‘సమృద్ధిగా’ను భౌతిక ఐశ్వర్యార్థంగా మార్చలేదు.
