id: JHN.10.1
reference: John 10:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ μὴ εἰσερχόμενος διὰ τῆς θύρας εἰς τὴν αὐλὴν τῶν προβάτων ἀλλὰ ἀναβαίνων ἀλλαχόθεν ἐκεῖνος κλέπτης ἐστὶν καὶ λῃστής·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/001.yaml
  text: Truly[a], truly, I say to you, the one who does not enter through the door into the sheepfold[c][b], but climbs up from somewhere else—that man is a thief and a robber.
translation:
  language: te
  text: '“నిజంగా, నిజంగా మీతో చెబుతున్నాను: గొర్రెల దొడ్డి[b]లోకి ద్వారం[a] గుండా ప్రవేశించకుండా, వేరొక చోటు నుంచి ఎక్కి వచ్చేవాడు—అతడు దొంగ, దోపిడీదారుడు.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు θύρα అనే పదాన్ని సందర్భానుసారం ‘తలుపు’ లేదా ‘గుమ్మం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు αὐλή అంటే చుట్టూ కట్టబడిన ఆవరణ; ఇక్కడ ‘గొర్రెల కొట్టం’ లేదా ‘గొర్రెల ఆవరణ’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకులో ‘దొంగ’ (κλέπτης), ‘దోపిడీదారుడు’ (λῃστής) అనే రెండు వేరు పదాలు ఉన్నాయి; రెండవ పదం తరచుగా బలప్రయోగంతో లేదా హింసతో దోచుకునే వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: నిజంగా, నిజంగా
  rationale: యోహాను సువార్తలోని గంభీరమైన ద్విగుణ ఆమోద సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో, దాని ఉద్ఘాటనను నిలుపుతూ వ్యక్తపరుస్తుంది.
- source_word: λέγω ὑμῖν
  choice: మీతో చెబుతున్నాను
  rationale: ప్రత్యక్ష సంభాషణ సూత్రాన్ని స్పష్టంగా, గౌరవప్రదమైన సాధారణ తెలుగులో అందిస్తుంది.
- source_word: ὁ μὴ εἰσερχόμενος
  choice: ప్రవేశించకుండా … వచ్చేవాడు
  rationale: గ్రీకు ఏకవచన substantival participle యొక్క సాధారణ వర్తనను తెలుగులో సహజమైన వ్యక్తి-సూచక నిర్మాణంతో నిలుపుతుంది.
- source_word: διὰ τῆς θύρας
  choice: ద్వారం గుండా
  rationale: θύρα సందర్భానుసారం తలుపు లేదా ప్రవేశ ద్వారాన్ని సూచించగలదు; పశువుల దొడ్డి సందర్భంలో ‘ద్వారం’ సహజంగా ఉండి, ప్రవేశ మార్గం అనే భావాన్ని నిలుపుతుంది.
- source_word: εἰς τὴν αὐλὴν τῶν προβάτων
  choice: గొర్రెల దొడ్డిలోకి
  rationale: αὐλή సూచించే చుట్టూ కట్టబడిన ప్రదేశాన్ని ఈ కాపరి దృశ్యంలో సాధారణ పాఠకుడికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀλλὰ ἀναβαίνων ἀλλαχόθεν
  choice: మరొక వైపు నుంచి ఎక్కి వచ్చేవాడు
  rationale: ἀναβαίνων లోని ఎక్కడం అనే భౌతిక చిత్రాన్నీ, ἀλλαχόθεν లోని వేరొక స్థలం లేదా దిశ భావాన్నీ నిలుపుతుంది.
- source_word: ἐκεῖνος
  choice: అతడే
  rationale: గ్రీకు నిర్దేశక సర్వనామంలోని ఉద్ఘాటనను సంక్షిప్తమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: κλέπτης
  choice: దొంగ
  rationale: రహస్యంగా దొంగిలించే వ్యక్తికి సాధారణమైన ప్రత్యక్ష తెలుగు సమానార్థకం.
- source_word: λῃστής
  choice: దోపిడీదారుడు
  rationale: బలప్రయోగం లేదా హింసతో దోచుకునే భావాన్ని ఇవ్వడం ద్వారా κλέπτης తో ఉన్న పదభేదాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
theological_decisions:
- issue: αὐλή మరియు θύρα రూపక దృశ్యం
  choice: ‘ద్వారం’, ‘గొర్రెల దొడ్డి’ అనే స్పష్టమైన భౌతిక చిత్రంగా అనువదించడం
  alternative: ఈ దశలోనే ద్వారాన్ని లేదా దొడ్డిని యేసు, రక్షణ, లేదా మతనాయకులతో వ్యాఖ్యానాత్మకంగా సమీకరించడం
  rationale: ఈ వచనం రూపకాన్ని పరిచయం చేస్తుంది; దాని వివరణ తరువాతి సందర్భంలో వస్తుంది. కాబట్టి అనువాదం ఈ వచనం చెప్పిన దానికంటే ముందుకు వెళ్లదు.
- issue: ఏకవచన పురుషలింగ substantival participle మరియు ἐκεῖνος
  choice: ‘వచ్చేవాడు—అతడే’
  alternative: లింగ సూచన లేని బహువచన లేదా పూర్తిగా అమూర్తమైన నిర్మాణం
  rationale: గ్రీకు ఏకవచన వ్యక్తి-సూచనను, దాని ప్రతినిధి స్వభావాన్ని మరియు ἐκεῖνος లోని ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- issue: κλέπτης మరియు λῃστής మధ్య భేదం
  choice: ‘దొంగ, దోపిడీదారుడు’
  alternative: రెండింటినీ ఒకే రకమైన ‘దొంగ’ పదంతో కలిపివేయడం
  rationale: మూలంలో ఉన్న రెండు వేరు పదాలను నిలుపుతూ, రెండవది మరింత బలవంతపు లేదా హింసాత్మక దోపిడిని సూచించగలదనే భావానికి అవకాశం ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే యేసు మాటల గంభీరతను నిలుపుతూ రూపొందించబడింది. ‘ద్వారం’ మరియు ‘దొడ్డి’ గ్రామీణ దృశ్యాన్ని స్పష్టంగా ఉంచుతాయి; ‘ఎక్కి వచ్చేవాడు’ అనధికారంగా గోడ దాటి ప్రవేశించే చిత్రాన్ని వ్యక్తపరుస్తుంది.
