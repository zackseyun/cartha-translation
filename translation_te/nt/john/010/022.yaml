lexical_decisions:
- source_word: Ἐγένετο
  choice: జరిగింది
  rationale: ఇక్కడ γίνομαι ఒక సంఘటన చోటుచేసుకోవడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘జరిగింది’ సహజంగా, నేరుగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: τότε
  choice: ఆ సమయంలో
  rationale: τότε కథనంలోని కాలసంబంధ మార్పును సూచిస్తుంది; ‘ఆ సమయంలో’ దాని కాలార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τὰ ἐγκαίνια
  choice: ప్రతిష్ఠాపన పండుగ
  rationale: ఈ పదం దేవాలయ పునఃప్రతిష్ఠాపనను జ్ఞాపకం చేసుకునే పండుగను సూచిస్తుంది. ‘ప్రతిష్ఠాపన పండుగ’ గ్రీకు పదార్థాన్ని అనువదిస్తూ తెలుగు పాఠకులకు సందర్భాన్ని తెలియజేస్తుంది; సాధారణ నామమైన ‘హనుక్కా’ను పాదసూచికలో ఉంచాం.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: యెరూషలేములో
  rationale: ఇది సాధారణ స్థలవాచక ప్రయోగం; ‘యెరూషలేములో’ ఆధునిక తెలుగులో సహజమైన రూపం.
- source_word: χειμὼν ἦν
  choice: అది చలికాలం
  rationale: గ్రీకు వాక్యం సరళమైన కాలవర్ణన. ‘అది చలికాలం’ దాని సంక్షిప్తతను, దృశ్య నేపథ్యాన్ని నిలుపుతుంది.
theological_decisions:
- issue: τὰ ἐγκαίνια అనే పండుగ గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో ‘ప్రతిష్ఠాపన పండుగ’
  alternative: ‘హనుక్కా’ లేదా ‘ప్రతిష్ఠాపన’
  rationale: మూల గ్రీకు పదంలోని అర్థాన్ని ప్రధాన పాఠ్యంలో అనువదించడం మూలభాష ప్రాధాన్యాన్ని కాపాడుతుంది. యూదులలో సాధారణంగా వాడే ‘హనుక్కా’ అనే పేరును సాంస్కృతిక వివరణగా పాదసూచికలో ఇచ్చాం; ఎటువంటి మతశాఖాపరమైన వ్యాఖ్యానాన్నీ చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘ప్రతిష్ఠాపన’ అనే పదం పండుగ స్వభావాన్ని స్పష్టంగా తెలియజేస్తుంది; పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
