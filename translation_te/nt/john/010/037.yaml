id: JHN.10.37
reference: John 10:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ οὐ ποιῶ τὰ ἔργα τοῦ πατρός μου, μὴ πιστεύετέ μοι·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/037.yaml
  text: If I am not doing the works of my Father[a], do not believe me;
translation:
  language: te
  text: నేను నా తండ్రి కార్యాలు చేయకపోతే, నన్ను నమ్మకండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను చెప్పేది నమ్మకండి.”
    reason: πιστεύω + దత్తివిభక్తి μοι అనే నిర్మాణానికి సాధ్యమైన వాక్యార్థక ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: εἰ οὐ ποιῶ
  choice: నేను ... చేయకపోతే
  rationale: షరతును మరియు ποιῶను నిరాకరించే οὐను సహజమైన ఆధునిక తెలుగులో షరతార్థక క్రియారూపంతో వ్యక్తం చేస్తుంది. వర్తమాన సందర్భంలో కొనసాగుతున్న కార్యాచరణ భావాన్ని తెలుగు రూపం సహజంగా మోస్తుంది.
- source_word: τὰ ἔργα
  choice: కార్యాలు
  rationale: ἔργαకు ‘పనులు’ లేదా ‘క్రియలు’ సాధ్యమైనా, యోహాను సువార్తలో యేసు చేసే క్రియలు/సూచక కార్యాలకున్న భావభారాన్ని ‘కార్యాలు’ గౌరవప్రదంగా, విస్తృతంగా నిలుపుతుంది.
- source_word: τοῦ πατρός μου
  choice: నా తండ్రి
  rationale: గ్రీకు సంబంధవిభక్తి భావాన్ని తెలుగులో సహజమైన స్వామ్య నిర్మాణంతో అందిస్తుంది; సందర్భంలో ఇది దేవునితో యేసుకున్న సంబంధాన్ని సూచిస్తుంది.
- source_word: μὴ πιστεύετέ μοι
  choice: నన్ను నమ్మకండి
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞార్థక నిషేధాన్ని మర్యాదార్థక బహువచన నిషేధంగా అనువదిస్తుంది. πιστεύω + దత్తివిభక్తి వ్యక్తిని నమ్మడం లేదా అతడు చెప్పేది నమ్మడం అనే సమీపార్థాలను అనుమతిస్తుంది; ప్రధాన పాఠం ప్రత్యక్ష వ్యక్తిగత నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: πιστεύωతో దత్తివిభక్తి μοι యొక్క భావం
  choice: నన్ను నమ్మకండి
  alternative: నేను చెప్పేది నమ్మకండి
  rationale: గ్రీకు నిర్మాణం ‘ఒక వ్యక్తిని నమ్మడం’ అనే ప్రత్యక్ష అర్థాన్ని ఇస్తూనే, అతని మాటలను విశ్వసించడం అనే భావాన్ని కూడా కలిగి ఉండవచ్చు. ప్రధాన పాఠం వ్యక్తిగత దిశను నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా అసలులోని భావవిస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘కార్యాలు’ అనే పదం యోహాను సువార్తలోని θεολογిక భావభారాన్ని అతిగా వివరించకుండా నిలుపుతుంది. పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
