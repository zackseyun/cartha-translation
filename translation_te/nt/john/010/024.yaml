id: JHN.10.24
reference: John 10:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐκύκλωσαν οὖν αὐτὸν οἱ Ἰουδαῖοι καὶ ἔλεγον αὐτῷ· Ἕως πότε τὴν ψυχὴν ἡμῶν αἴρεις; εἰ σὺ εἶ ὁ χριστός, εἰπὲ ἡμῖν παρρησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/024.yaml
  text: So the Jews surrounded him and were saying to him[a], “How long will you keep us in suspense? If you are the Messiah[b], tell us plainly.”
translation:
  language: te
  text: 'కాబట్టి యూదులు[b] ఆయనను చుట్టుముట్టి, ఆయనతో ఇలా అన్నారు: “ఇంకెంతకాలం మమ్మల్ని అనిశ్చితిలో ఉంచుతావు?[a] నీవే మెస్సీయవైతే, మాకు స్పష్టంగా చెప్పు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ఇంకెంతకాలం మా ప్రాణాన్ని ఎత్తి ఉంచుతావు?” ఇది ఒకరిని అనిశ్చితిలో లేదా ఉత్కంఠలో ఉంచడాన్ని తెలిపే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: యోహాను సువార్తలో “యూదులు” అనే పదం కొన్ని సందర్భాల్లో యూదులందరినీ కాక, ప్రత్యేకంగా యూదయ మతాధికారులను లేదా యేసును వ్యతిరేకించినవారిని సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκύκλωσαν
  choice: చుట్టుముట్టి
  rationale: κυκλόω యొక్క చుట్టూ ఆవరించడం అనే భౌతిక, కొంత ఒత్తిడితో కూడిన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: οὖν
  choice: అప్పుడు
  rationale: ఇక్కడ కథనంలోని తదుపరి పరిణామాన్ని సూచిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘అప్పుడు’ సహజంగా ఉంటుంది.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: గ్రీకు పదబంధాన్ని అనవసరంగా ‘నాయకులు’ అని సంకుచితం చేయకుండా అనువదిస్తుంది; యోహాను సందర్భంలో ఉండగల పరిమిత సూచనను పాదటిప్పణిలో వివరిస్తుంది.
- source_word: ἔλεγον αὐτῷ
  choice: ఆయనతో ఇలా అన్నారు
  rationale: తెలుగులో సహజమైన సంభాషణ ప్రవేశం. గ్రీకు అసంపూర్ణ భూతకాల రూపంలోని కొనసాగింపు భావాన్ని యాంత్రికంగా చూపితే తెలుగు వాక్యం కృతకంగా ఉంటుంది.
- source_word: Ἕως πότε τὴν ψυχὴν ἡμῶν αἴρεις
  choice: ఇంకెంతకాలం మమ్మల్ని సందిగ్ధంలో ఉంచుతావు?
  rationale: అక్షరార్థంగా ‘మా ప్రాణాన్ని ఎత్తిపట్టుకుంటావు’ అనే గ్రీకు నుడికారానికి, అనిశ్చితిలో లేదా ఉత్కంఠలో ఉంచడం అనే సందర్భోచిత అర్థాన్ని సహజమైన తెలుగులో ఇస్తుంది.
- source_word: ὁ χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός వ్యక్తిపేరులా కాక, యూదుల నిరీక్షణలోని అభిషిక్త రాజు-విమోచకుని బిరుదుగా వాడబడింది.
- source_word: εἰπὲ ἡμῖν παρρησίᾳ
  choice: మాతో స్పష్టంగా చెప్పు
  rationale: నేరుగా, సందేహానికి తావులేకుండా చెప్పాలనే ఆజ్ఞను παρρησίᾳ సందర్భంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ ప్రశ్నలో పదం బిరుదుగా, యూదుల మెస్సీయ నిరీక్షణకు సంబంధించినదిగా పనిచేస్తుంది; అందువల్ల ‘మెస్సీయ’ ఆ సందర్భాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: యోహానులో οἱ Ἰουδαῖοι సూచించే వర్గం
  choice: యూదులు
  alternative: యూదా మతాధికారులు / యూదయులు
  rationale: ఈ వచనం స్వయంగా నాయకులు లేదా ఒక నిర్దిష్ట వర్గం అని చెప్పదు. అందువల్ల ప్రధాన పాఠ్యంలో గ్రీకు పదబంధపు విస్తృత రూపాన్ని ఉంచి, సందర్భానుసారమైన సంకుచిత సూచనను పాదటిప్పణిలో పేర్కొనడం ద్వారా అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘సందిగ్ధంలో ఉంచు’ ద్వారా మూల నుడికారపు అర్థం అందించబడింది; అక్షర రూపం పాదటిప్పణిలో నిలుపబడింది. రెండు పాదటిప్పణి సూచికలూ ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
