source:
  edition: SBLGNT
  text: Ἐβάστασαν ⸀οὖν πάλιν λίθους οἱ Ἰουδαῖοι ἵνα λιθάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/031.yaml
  text: So the Jews picked up stones again to stone him[a].
translation:
  language: te
  text: కాబట్టి యూదులు ఆయనను రాళ్లతో కొట్టడానికి మళ్లీ రాళ్లు ఎత్తుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సందర్భాన్ని బట్టి, ‘యూదు నాయకులు’ లేదా ‘యూదయ ప్రాంతస్థులు.’ యోహాను సువార్తలో ‘యూదులు’ అనే పదబంధం తరచుగా యూదులందరినీ కాకుండా, యేసును వ్యతిరేకించిన నిర్దిష్ట యూదులను సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐβάστασαν
  choice: ఎత్తుకున్నారు
  rationale: βαστάζωకు ‘మోయడం/ఎత్తుకోవడం’ అనే అర్థాలున్నాయి. ఇక్కడ వెంటనే రాళ్లతో కొట్టాలనే ఉద్దేశం ఉన్నందున ‘రాళ్లు ఎత్తుకున్నారు’ సహజమైన, సందర్భోచితమైన తెలుగు.
- source_word: οὖν
  choice: అందుచేత
  rationale: ముందటి వాక్యానికి ప్రతిస్పందనగా లేదా దాని ఫలితంగా జరిగిన చర్యను సూచించే అనుసంధానాన్ని నిలుపుతుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: చర్య పునరావృతమైందనే భావాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: λίθους
  choice: రాళ్లు
  rationale: λίθοςకు సాధారణమైన తెలుగు సమానం ‘రాయి’; బహువచనంలో ‘రాళ్లు’.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: గ్రీకు పదబంధానికి నేరమైన అనువాదం. యోహాను సువార్తలో ఇది సందర్భానుసారంగా యేసును వ్యతిరేకించిన కొందరిని సూచించవచ్చు; ఆ పరిమితిని మూలపాఠం ఈ వాక్యంలో స్పష్టంగా చెప్పనందున ప్రధాన పాఠంలో చేర్చలేదు.
- source_word: ἵνα
  choice: కొట్టడానికి
  rationale: ఉద్దేశాన్ని సూచించే ἵνα వాక్యనిర్మాణాన్ని తెలుగులో సహజమైన ప్రయోజనార్థక రూపంతో వ్యక్తం చేస్తుంది.
- source_word: λιθάσωσιν
  choice: రాళ్లతో కొట్టడానికి
  rationale: λιθάζω అంటే రాళ్లతో కొట్టడం. ‘రాళ్లతో కొట్టి చంపడానికి’ అని అనడం ప్రాణాంతక ఉద్దేశాన్ని స్పష్టీకరించినా, మూల క్రియలో లేని ‘చంపడం’ను ప్రత్యక్షంగా చేర్చుతుంది.
- source_word: αὐτόν
  choice: ఆయనను
  rationale: యేసును సూచించే కర్మ సర్వనామం; తెలుగు గౌరవప్రయోగానికి అనుగుణంగా ‘ఆయనను’.
theological_decisions:
- issue: యోహాను సువార్తలో οἱ Ἰουδαῖοι అనే పదబంధం ఎవరిని, ఎంత విస్తృతంగా సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో ‘యూదులు’ అని మూలానికి నేరుగా అనువదించి, సందర్భపరమైన పరిమితిని పాదసూచికలో తెలియజేయడం.
  alternative: ‘యూదా నాయకులు’ లేదా ‘యూదయులు’
  rationale: ఈ వాక్యంలో గ్రీకు పాఠం ‘యూదులు’ అని మాత్రమే చెబుతుంది; ‘నాయకులు’ అని చేర్చడం సూచిత వర్గాన్ని అనువాదకుడు ముందుగానే పరిమితం చేయడమవుతుంది. అయితే యోహాను వాడుకలో ఈ పదం తరచుగా యూదులందరినీ కాక యేసును వ్యతిరేకించిన నిర్దిష్ట వ్యక్తులను సూచించగలదు. అందువల్ల అసలు ఉద్రిక్తతను ప్రధాన పాఠం మరియు పాదసూచిక కలిసి కాపాడుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘రాళ్లతో కొట్టడానికి మళ్లీ రాళ్లు’ అనే పునరుక్తి తెలుగులో కొంత భారంగా అనిపించినా, మూలంలోని λίθους–λιθάσωσιν పదపునరావృతిని మరియు చర్య ఉద్దేశాన్ని స్పష్టంగా నిలుపుతుంది.
