id: JHN.10.16
reference: John 10:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἄλλα πρόβατα ἔχω ἃ οὐκ ἔστιν ἐκ τῆς αὐλῆς ταύτης· κἀκεῖνα ⸂δεῖ με⸃ ἀγαγεῖν, καὶ τῆς φωνῆς μου ἀκούσουσιν, καὶ ⸀γενήσονται μία ποίμνη, εἷς ποιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/016.yaml
  text: And I have other sheep that are not from this sheepfold[a]. I must bring them also, and they will listen to my voice. Then there will be one flock[b], one shepherd.
translation:
  language: te
  text: “ఈ గొర్రెల దొడ్డికి చెందని వేరే గొర్రెలు కూడా నాకు ఉన్నాయి. వాటిని కూడా నేను తీసుకురావాలి. అవి నా స్వరం వింటాయి.[a] అప్పుడు అవి ఒకే మందగా అవుతాయి; కాపరి ఒక్కడే ఉంటాడు.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అవి నా స్వరాన్ని ఆలకిస్తాయి.” గ్రీకు క్రియకు ‘వినడం’ లేదా స్పందనతో ‘ఆలకించడం’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ‘గొర్రెల దొడ్డి’ (αὐλή)—గొర్రెలను ఉంచే ఆవరణ—అనే పదం, ‘మంద’ (ποίμνη)—గొర్రెల సమూహం—అనే పదం వేర్వేరు. కాబట్టి చివరి మాట ‘ఒకే మంద,’ ‘ఒకే దొడ్డి’ కాదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλα πρόβατα
  choice: వేరే గొర్రెలు
  rationale: πρόβατα సాధారణంగా ‘గొర్రెలు’ అని అర్థం; అది ప్రత్యేకంగా గొర్రెపిల్లలను సూచించదు. ἄλλα ఇప్పటికే ప్రస్తావనలో ఉన్నవాటికి అదనంగా వేరే గొర్రెలను సూచిస్తుంది.
- source_word: αὐλή
  choice: గొర్రెల దొడ్డి
  rationale: కాపరి రూపకంలోని αὐλή గొర్రెలను ఉంచే కంచెగల స్థలాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘గొర్రెల దొడ్డి’ ఈ భావాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: κἀκεῖνα
  choice: వాటిని కూడా
  rationale: ఈ సర్వనామం ‘వేరే గొర్రెలు’ను తిరిగి సూచిస్తుంది. ‘వాటిని కూడా’ తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉండి καί యొక్క అదనపు భావాన్ని నిలుపుతుంది.
- source_word: δεῖ με ἀγαγεῖν
  choice: నేను తీసుకురావాలి
  rationale: δεῖ అవసరతను బలంగా వ్యక్తం చేస్తుంది; ‘తీసుకురావాలి’ ఆ అవసరతను, ἀγαγεῖν యొక్క తీసుకురావడం/నడిపించడం అనే భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: τῆς φωνῆς μου ἀκούσουσιν
  choice: అవి నా స్వరం వింటాయి
  rationale: ἀκούω ‘వినడం’ లేదా స్పందనతో ‘ఆలకించడం’ అనే రెండు భావాలను కలిగి ఉండగలదు. ‘వింటాయి’ మూలంలోని ఈ అర్థవిస్తృతిని తెలుగులో నిలుపుతుంది.
- source_word: γενήσονται μία ποίμνη
  choice: అవి ఒకే మందగా అవుతాయి
  rationale: γενήσονται ఫలితంగా ఏర్పడే స్థితిని సూచిస్తుంది; ποίμνη గొర్రెల సమూహమైన ‘మంద’. ఈ అనువాదం ‘దొడ్డి’తో దానిని కలపకుండా మూలంలోని భేదాన్ని కాపాడుతుంది.
- source_word: εἷς ποιμήν
  choice: కాపరి ఒక్కడే ఉంటాడు
  rationale: ποιμήν అంటే కాపరి. తెలుగు సహజ ప్రయోగంలో ‘ఒక్కడే’ ఏకత్వాన్ని స్పష్టంగా తెలియజేస్తూ మూలంలోని εἷς బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: αὐλή మరియు ποίμνη మధ్య భేదం
  choice: ఈ గొర్రెల దొడ్డి … ఒకే మంద
  alternative: ఈ మంద … ఒకే మంద; లేదా ఈ దొడ్డి … ఒకే దొడ్డి
  rationale: గ్రీకు పాఠం మొదట గొర్రెలను ఉంచే స్థలానికి αὐλή, చివర గొర్రెల సమూహానికి ποίμνη అనే వేర్వేరు పదాలను వాడుతుంది. ‘దొడ్డి’ మరియు ‘మంద’గా అనువదించడం సంస్థాగతంగా ఒకే ఆవరణ అనే భావాన్ని చొప్పించకుండా మూలంలోని భేదాన్ని నిలుపుతుంది.
- issue: δεῖ యొక్క అవసరతా బలం
  choice: నేను తీసుకురావాలి
  alternative: నేను తీసుకురావడం అవసరం; నేను తీసుకురావాల్సి ఉంది
  rationale: యోహాను రచనలో δεῖ తరచుగా బలమైన అవసరతను సూచిస్తుంది. ‘తీసుకురావాలి’ దానికి నిర్దిష్టమైన సిద్ధాంత వివరణను జోడించకుండా ఆ బలాన్ని సహజ తెలుగులో నిలుపుతుంది.
- issue: ἀκούωలో వినడం మరియు స్పందనతో ఆలకించడం
  choice: నా స్వరం వింటాయి
  alternative: నా స్వరానికి చెవియొగ్గుతాయి; నా స్వరం విని లోబడతాయి
  rationale: సందర్భం స్పందనతో కూడిన వినికిడిని సూచించినప్పటికీ, మూల క్రియ సాధారణంగా వినడం అనే అర్థాన్నీ కలిగి ఉంటుంది. ‘వింటాయి’ ఆ ఉద్దేశపూర్వక అస్పష్టతను కాపాడుతుంది; ‘లోబడతాయి’ అని పెంచడం మూలంలో లేని భావాన్ని స్పష్టీకరించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన శైలి వాడబడింది. ‘గొర్రెల దొడ్డి,’ ‘మంద,’ ‘కాపరి’ వంటి సులభమైన గ్రామీణ-పశుపోషణ పదజాలం రూపకాన్ని సహజంగా నిలుపుతుంది. [a], [b] గుర్తులు ప్రధాన పాఠంలో సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
