revisions:
- from: నా గొర్రెలు నా స్వరం వింటాయి; నేను వాటిని ఎరుగుతాను, అవి నన్ను అనుసరిస్తాయి.
  to: నా గొర్రెలు నా స్వరం వింటాయి; మరియు నాకు అవి తెలుసు, అవి నన్ను అనుసరిస్తాయి.
  rationale: The revision explicitly represents καί in κἀγώ and uses idiomatic modern Telugu for γινώσκω. It preserves the Greek present-tense characteristic actions, the shepherd-and-sheep metaphor, and the unexpanded relational sense of ‘know.’
