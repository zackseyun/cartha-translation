id: JHN.10.27
reference: John 10:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὰ πρόβατα τὰ ἐμὰ τῆς φωνῆς μου ⸀ἀκούουσιν, κἀγὼ γινώσκω αὐτά, καὶ ἀκολουθοῦσίν μοι,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/027.yaml
  text: My sheep hear my voice, and I know them, and they follow me.
translation:
  language: te
  text: నా గొర్రెలు నా స్వరం వింటాయి; మరియు నాకు అవి తెలుసు, అవి నన్ను అనుసరిస్తాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρόβατα
  choice: గొర్రెలు
  rationale: కాపరి–గొర్రెల రూపకంలో మూలపదానికి సహజమైన, ప్రామాణికమైన తెలుగు సమానం.
- source_word: τὰ ἐμὰ
  choice: నా
  rationale: స్వామ్యాన్ని సహజమైన తెలుగు పదక్రమంలో తెలియజేస్తుంది; అదనపు ఉద్ఘాటనను చేర్చదు.
- source_word: φωνῆς
  choice: స్వరం
  rationale: వ్యక్తిని గుర్తించగల కంఠధ్వని అనే సందర్భార్థాన్ని ‘శబ్దం’ కంటే స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀκούουσιν
  choice: వింటాయి
  rationale: వర్తమానకాలంలోని లక్షణాత్మక, కొనసాగుతున్న చర్యను సహజమైన తెలుగు సాధారణ వర్తమానంతో వ్యక్తం చేస్తుంది; ‘శ్రద్ధగా వింటాయి’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: κἀγὼ
  choice: నేను
  rationale: καί + ἐγώలోని కర్తను స్పష్టంగా ఉంచుతుంది; ముందు ఉన్న విరామచిహ్నం తెలుగు ప్రవాహంలో అనుసంధానాన్ని సహజంగా అందిస్తుంది.
- source_word: γινώσκω
  choice: ఎరుగుతాను
  rationale: వ్యక్తిగత, సంబంధాత్మక పరిచయానికి అవకాశం ఉంచుతూ ‘గుర్తుపడతాను’ కంటే లోతైన మూలార్థాన్ని నిలుపుతుంది; వివరణాత్మక విస్తరణ చేయదు.
- source_word: αὐτά
  choice: వాటిని
  rationale: ‘గొర్రెలు’ను తిరిగి సూచించే తెలుగు నపుంసక బహువచన కర్మరూపం.
- source_word: ἀκολουθοῦσίν μοι
  choice: అవి నన్ను అనుసరిస్తాయి
  rationale: లక్షణాత్మకంగా కొనసాగుతున్న చర్యను సహజమైన తెలుగు సాధారణ వర్తమానంలో తెలియజేస్తుంది.
theological_decisions:
- issue: కాపరి–గొర్రెల రూపకంలో γινώσκω యొక్క సంబంధాత్మక భావం
  choice: ‘ఎరుగుతాను’ అని విస్తరణ లేకుండా అనువదించడం
  alternative: ‘వ్యక్తిగతంగా తెలుసు’ లేదా ‘గుర్తుపడతాను’
  rationale: మూలంలోని సంబంధాత్మక లోతును నిలుపుతూ దానిని ఒక నిర్దిష్ట సిద్ధాంత వివరణగా కుదించదు. ‘గుర్తుపడతాను’ భావాన్ని బలహీనపరచవచ్చు; ‘వ్యక్తిగతంగా తెలుసు’ మూలంలో లేని వివరణను జోడిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిని నిలుపుతూ రూపొందించబడింది. ‘ఎరుగుతాను’ కొద్దిగా ఉన్నత శైలికి చెందినదైనా, ఈ సందర్భంలోని సంబంధాత్మక ‘తెలుసుకోవడం’ భావాన్ని సంక్షిప్తంగా, సహజంగా మోస్తుంది.
