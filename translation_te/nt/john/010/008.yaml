id: JHN.10.8
reference: John 10:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάντες ὅσοι ἦλθον ⸂πρὸ ἐμοῦ⸃ κλέπται εἰσὶν καὶ λῃσταί· ἀλλ’ οὐκ ἤκουσαν αὐτῶν τὰ πρόβατα.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/008.yaml
  text: All who came before me are thieves and robbers[a], but the sheep did not listen to them.
translation:
  language: te
  text: నాకు ముందు వచ్చిన వారందరూ దొంగలు, దోపిడీదారులు.[a] అయితే గొర్రెలు వారి మాట వినలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాకంటే ముందుగా వచ్చినవారు.’ ఈ పదబంధాన్ని కాలపరంగా ‘నాకు ముందు’ అని, లేదా యేసుకు వేరుగా అధికారం తమదని చెప్పుకుంటూ ముందుగా వచ్చినవారిని సూచించేదిగా అర్థం చేసుకోవచ్చు. సందర్భం దేవుని పూర్వ సేవకులందరినీ కాక, అబద్ధ కాపరులను సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες ὅσοι
  choice: వచ్చిన వారందరూ
  rationale: ఈ సంయుక్త పదబంధంలోని సమగ్ర, సమూహార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἦλθον
  choice: వచ్చిన
  rationale: గ్రీకు ఏయొరిస్ట్‌ను సందర్భానికి తగిన సాధారణ భూతకాల భావంతో అందిస్తుంది.
- source_word: πρὸ ἐμοῦ
  choice: నాకు ముందు
  rationale: కాలపరంగా ‘నాకంటే ముందు’ అనే అర్థాన్నీ, ముందుగా వచ్చి అధికారాన్ని ప్రకటించే భావసంభావ్యతనూ తెలుగులో నిలుపుతుంది; వివరణను పాదసూచికలో ఉంచాం.
- source_word: κλέπται
  choice: దొంగలు
  rationale: రహస్యంగా దొంగిలించేవారిని సూచించే సాధారణ, స్పష్టమైన తెలుగు పదం.
- source_word: λῃσταί
  choice: దోపిడీదారులు
  rationale: κλέπταιతో భేదాన్ని నిలుపుతూ, బలప్రయోగం లేదా దాడితో దోచుకునే వారనే తీవ్రమైన భావాన్ని తెలియజేస్తుంది.
- source_word: ἀλλ’
  choice: అయితే
  rationale: వాక్యంలోని వ్యతిరేక భావాన్ని సహజంగా కలుపుతుంది.
- source_word: οὐκ ἤκουσαν αὐτῶν
  choice: వారి మాట వినలేదు
  rationale: కేవలం శబ్దం వినడం కాక, వారి స్వరానికి స్పందించి లోబడకపోవడం అనే కాపరి–గొర్రెల సందర్భార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: τὰ πρόβατα
  choice: గొర్రెలు
  rationale: యోహాను 10లోని కాపరి రూపకానికి నేరుగా సరిపోయే ప్రామాణిక పదం.
theological_decisions:
- issue: ‘నాకు ముందు వచ్చిన వారందరూ’ అనే మాట పరిధి
  choice: ప్రధాన పాఠ్యంలో గ్రీకు వాక్యపు విస్తృత రూపాన్ని సంకుచితం చేయకుండా ‘నాకు ముందు వచ్చిన వారందరూ’ అని ఉంచడం.
  alternative: ‘నాకంటే ముందుగా అధికారాన్ని ప్రకటిస్తూ వచ్చిన వారందరూ’ లేదా ‘యేసుకు వేరుగా కాపరి అధికారాన్ని చెప్పుకున్నవారందరూ’.
  rationale: ఈ మాటను దేవుడు పంపిన పూర్వ ప్రవక్తలందరిపై తీర్పుగా వివరించడం సందర్భానికి తగదు; అయినా గ్రీకు పాఠ్యంలో ఆ పరిమితి ప్రత్యక్షంగా లేదు. అందువల్ల ప్రధాన పాఠ్యంలో ఉన్న ఉద్రిక్తతను నిలిపి, సందర్భసంబంధ వివరణను పాదసూచికకు పరిమితం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘దొంగలు, దోపిడీదారులు’ అనే జంట గ్రీకులోని రెండు వేర్వేరు నేరపదాల భేదాన్ని కాపాడుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
