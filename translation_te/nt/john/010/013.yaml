id: JHN.10.13
reference: John 10:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ὅτι μισθωτός ἐστιν καὶ οὐ μέλει αὐτῷ περὶ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/013.yaml
  text: because he is a hired hand and does not care about the sheep.
translation:
  language: te
  text: ఎందుకంటే అతడు కూలికి పనిచేసేవాడు; గొర్రెల గురించి అతనికి పట్టదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: మునుపటి వాక్యభాగంలో కూలివాడు పారిపోవడానికి గల కారణాన్ని ఇది తెలియజేస్తుంది; ఆధునిక తెలుగులో కారణార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μισθωτός
  choice: కూలికి పనిచేసేవాడు
  rationale: సొంతదారుగా బాధ్యత వహించేవాడు కాకుండా జీతం లేదా కూలి కోసం పనిచేసే వ్యక్తిని సూచిస్తుంది. కాపరి సందర్భంలోనూ ఇది స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: οὐ μέλει αὐτῷ περὶ
  choice: గురించి అతనికి పట్టదు
  rationale: దత్తివుతో కూడిన μέλει మరియు περί నిర్మాణం శ్రద్ధ లేదా పట్టింపును సూచిస్తుంది. ఈ తెలుగు ప్రయోగం మూలంలోని నైతిక తీవ్రతను సహజంగా నిలుపుతుంది.
- source_word: τῶν προβάτων
  choice: గొర్రెల
  rationale: మూల నామవాచకాన్ని నేరుగా అనువదించి, ఈ ప్రసంగంలోని కాపరి రూపకాన్ని కాపాడుతుంది; ‘మంద’ అని విస్తరించి చెప్పదు.
theological_decisions:
- issue: మంచి కాపరికి విరుద్ధంగా μισθωτός వ్యక్తి స్వభావ చిత్రణ
  choice: వచనం చెప్పినట్లే, అతడు కూలికి పనిచేసేవాడు కావడం మరియు గొర్రెలపై అతనికి పట్టింపు లేకపోవడం అనే నైతిక వ్యత్యాసాన్ని సూటిగా వ్యక్తం చేయడం.
  alternative: అతడిని ఒక నిర్దిష్టమైన అబద్ధ నాయకుల వర్గంగా గుర్తించడం, లేదా వ్యత్యాసాన్ని కేవలం వృత్తిపరమైన దూరంగా మృదువుగా చూపడం.
  rationale: ఈ వచనం కూలివాడి నిర్దిష్ట గుర్తింపును చెప్పదు; అతడు పారిపోవడానికి కారణంగా అతని కూలి స్థితిని, గొర్రెల పట్ల పట్టింపు లేకపోవడాన్ని మాత్రమే పేర్కొంటుంది. అందువల్ల అదనపు సిద్ధాంత నిర్ణయాన్ని చేర్చకుండా మంచి కాపరితో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన సహజ శైలి. ‘కూలివాడు’ కంటే ‘కూలికి పనిచేసేవాడు’ అనే రూపం సందర్భాన్ని వెంటనే స్పష్టం చేస్తుంది. మూలంలో లేని వివరణను చేర్చలేదు.
