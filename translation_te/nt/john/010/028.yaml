id: JHN.10.28
reference: John 10:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κἀγὼ ⸂δίδωμι αὐτοῖς ζωὴν αἰώνιον⸃, καὶ οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα, καὶ οὐχ ἁρπάσει τις αὐτὰ ἐκ τῆς χειρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/028.yaml
  text: And I give them eternal life, and they will certainly never perish forever, and no one will snatch them out of my hand.
translation:
  language: te
  text: నేను వాటికి నిత్యజీవం ఇస్తాను. అవి ఎన్నటికీ నశించనే నశించవు; ఎవ్వరూ వాటిని నా చేతిలోనుంచి లాక్కుపోరు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζωὴν αἰώνιον
  choice: నిత్యజీవం
  rationale: ‘Eternal life’ అనే భావాన్ని ఆధునిక తెలుగు బైబిలు వాడుకలో సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα
  choice: ఎన్నటికీ నశించనే నశించవు
  rationale: οὐ μή అనే బలమైన నిరాకరణను ‘నశించనే నశించవు’తో, εἰς τὸν αἰῶνα అనే కాలవ్యాప్తిని ‘ఎన్నటికీ’తో వ్యక్తం చేస్తుంది; మూలంలోని ఉద్ఘాటనను అనవసర పునరుక్తి లేకుండా నిలుపుతుంది.
- source_word: ἁρπάσει
  choice: లాక్కుపోరు
  rationale: బలవంతంగా పట్టుకొని తీసుకుపోవడం అనే క్రియాభావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ἐκ τῆς χειρός μου
  choice: నా చేతిలోనుంచి
  rationale: మూలంలోని ‘నా చేతి నుండి’ అనే రక్షణ/అధీనత రూపకాన్ని యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: οὐ μή ... εἰς τὸν αἰῶνα లోని బలమైన, శాశ్వత నిరాకరణ
  choice: ఎన్నటికీ నశించనే నశించవు
  alternative: ఎప్పటికీ నశించవు
  rationale: ఎంచుకున్న రూపం మూలంలోని ద్విగుణ బలమైన నిరాకరణను స్పష్టంగా ప్రతిబింబిస్తుంది; దీనికి మించి ఏ సంప్రదాయ సిద్ధాంత వివరణనూ చేర్చదు.
- issue: ‘నా చేతిలోనుంచి లాక్కుపోరు’ అనే వాక్యంలోని రక్షణ స్వరూపం
  choice: మూలంలోని రూపకాన్నే ఉంచడం
  alternative: నా సంరక్షణ నుండి వారిని ఎవరూ తొలగించలేరు
  rationale: వివరణాత్మకంగా సిద్ధాంతార్థాన్ని నిర్ణయించకుండా, యేసు పలికిన చేతి రూపకాన్ని మరియు దాని సహజమైన ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగా, సాధారణ పాఠకునికి సులభంగా ఉండేలా రూపొందించబడింది. ముందున్న ‘గొర్రెలు’ అనే సందర్భానికి అనుగుణంగా గ్రీకు నపుంసక బహువచన సర్వనామాలను ‘వాటికి/అవి/వాటిని’గా ఉంచింది.
