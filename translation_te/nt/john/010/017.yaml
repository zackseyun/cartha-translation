id: JHN.10.17
reference: John 10:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τοῦτό ⸂με ὁ πατὴρ⸃ ἀγαπᾷ ὅτι ἐγὼ τίθημι τὴν ψυχήν μου, ἵνα πάλιν λάβω αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/017.yaml
  text: For this reason the Father loves me[a], because I lay down my life so that I may take it up again.
translation:
  language: te
  text: నా ప్రాణాన్ని మళ్లీ స్వీకరించడానికి నేను దానిని విడిచిపెడుతున్నాను; ఈ కారణంగానే తండ్రి నన్ను ప్రేమిస్తున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రాణం’కు బదులుగా ‘జీవితం’ లేదా ‘ఆత్మ’ అని కూడా అనువదించవచ్చు. ఇక్కడ ψυχή అనే గ్రీకు పదం, యేసు మరణంలో విడిచిపెట్టి మళ్లీ స్వీకరించే ప్రాణాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: అందుకే
  rationale: ముందున్న కారణాన్ని తరువాతి ప్రధాన వాక్యంతో సహజంగా కలిపే ఆధునిక తెలుగు రూపం.
- source_word: με ὁ πατὴρ ἀγαπᾷ
  choice: తండ్రి నన్ను ప్రేమిస్తున్నాడు
  rationale: గ్రీకులో ఉన్న ‘తండ్రి’ అనే నిర్దిష్ట కర్తను, ‘నా తండ్రి’ అనే స్వామ్య భావాన్ని చేర్చకుండా నిలుపుతుంది.
- source_word: ὅτι
  choice: కారణాన్ని ముందుంచిన వాక్య నిర్మాణం
  rationale: ὅτι ఇక్కడ తండ్రి ప్రేమకు కారణాన్ని పరిచయం చేస్తుంది; తెలుగులో కారణ ఉపవాక్యాన్ని ముందుంచి ‘అందుకే’తో ప్రధాన వాక్యాన్ని కలపడం సహజం.
- source_word: τίθημι
  choice: అర్పిస్తున్నాను
  rationale: ψυχήతో కలిసి ఇది యేసు తన ప్రాణాన్ని స్వచ్ఛందంగా ఇవ్వడాన్ని సూచిస్తుంది; ‘అర్పించు’ ఆ స్వచ్ఛందతను గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τὴν ψυχήν μου
  choice: నా ప్రాణాన్ని
  rationale: ఈ సందర్భంలో ψυχή శరీరానికి భిన్నమైన ‘ఆత్మ’కన్నా మరణంలో ఇవ్వబడే జీవప్రాణాన్ని సూచిస్తుంది.
- source_word: ἵνα
  choice: పొందడానికి
  rationale: ఉద్దేశ భావాన్ని సహజమైన తెలుగు క్రియార్థక నిర్మాణంతో వ్యక్తం చేస్తుంది; ఫలితం మాత్రమేనని నిర్ధారించదు.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: ప్రాణాన్ని అర్పించిన తరువాత తిరిగి పొందడాన్ని స్పష్టంగా సూచించే సాధారణ తెలుగు పదం.
- source_word: λάβω αὐτήν
  choice: దాన్ని ... పొందడానికి
  rationale: λαμβάνω యొక్క ‘తీసుకొను/పొందు’ పరిధిలో, ప్రాణాన్ని తిరిగి స్వీకరించే భావాన్ని సహజంగా ఇస్తుంది; కర్త స్వయంగా చర్య చేయడాన్ని చెరపదు.
theological_decisions:
- issue: క్రీస్తు స్వీయబలిదాన సందర్భంలో ψυχή అర్థం
  choice: ‘ప్రాణం’గా అనువదించడం
  alternative: ‘ఆత్మ’ లేదా ‘జీవితం’
  rationale: వాక్యం యేసు స్వచ్ఛంద మరణం మరియు తిరిగి ప్రాణం పొందడం గురించి మాట్లాడుతుంది. ‘ఆత్మ’ శరీర–ఆత్మ విభజనను అనవసరంగా సూచించవచ్చు; ‘ప్రాణం’ సందర్భార్థాన్ని సహజంగా నిలుపుతుంది.
- issue: ἵνα λάβωలో ఉద్దేశం మరియు ఫలితం మధ్య సంబంధం
  choice: ‘మళ్లీ పొందడానికి’
  alternative: ‘మళ్లీ పొందేలా’ లేదా ‘మళ్లీ పొందుతాను కాబట్టి’
  rationale: తెలుగు ఉద్దేశార్థక నిర్మాణం గ్రీకు ἵνα యొక్క ప్రయోజన భావాన్ని నిలుపుతుంది; దాన్ని కేవలం భవిష్యత్ ప్రకటనగా మార్చదు.
- issue: తండ్రి ప్రేమకు ὅτι ఉపవాక్యం తెలిపే కారణం
  choice: కారణ వాక్యాన్ని ముందుంచి ‘అందుకే’తో అనుసంధానం
  alternative: ‘తండ్రి నన్ను ప్రేమిస్తున్నాడు, ఎందుకంటే...’
  rationale: కారణ సంబంధాన్ని స్పష్టంగా ఉంచుతూ ఆధునిక తెలుగులో సహజమైన ప్రవాహాన్ని ఇస్తుంది; ప్రేమ సంపాదించబడిందనే అదనపు సిద్ధాంత నిర్ణయాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘అర్పిస్తున్నాను’ స్వచ్ఛంద స్వీయదానాన్ని తెలియజేస్తుంది; ‘తండ్రి’ అనే యోహాను సువార్త పదప్రయోగాన్ని నిలుపుతుంది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
