  source_fidelity: 'The draft accurately renders the speaker, addressees, rhetorical question, ‘your Law,’ and the direct lexical force of θεοί as ‘దేవుళ్లు.’ However, it reverses the syntax of the embedded Psalm citation: the Greek says, ‘I said: You are gods,’ whereas the draft reads, in effect, ‘I said that you are gods,’ with ‘అని’ placed within the quotation and the words ordered as ‘You are gods ... I said.’ The revised wording preserves the citation’s direct speech structure.'
  naturalness: ‘యేసు వారికి ఇలా జవాబిచ్చాడు’ and ‘మీ ధర్మశాస్త్రంలో’ are natural modern-standard Telugu in a formal biblical register. ‘వ్రాయబడి లేదా?’ is a suitably clear formal rendering of the rhetorical ‘Is it not written?’ and is preferable here to the more colloquial ‘రాసి లేదా?’
  terminology: ‘ధర్మశాస్త్రం’ appropriately retains νόμος as the scriptural designation used by Jesus, despite the citation being from Psalm 82:6. ‘దేవుళ్లు’ is the direct rendering of θεοί and should remain in the text. The footnote appropriately signals ‘దైవిక జీవులు’ only as an alternative, without deciding the debated interpretation.
