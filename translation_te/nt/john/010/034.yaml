    issue: The quoted citation has its speech formula and content in the wrong order.
    rationale: 'Ἐγὼ εἶπα· Θεοί ἐστε means ‘I said: You are gods.’ The draft’s ‘మీరు దేవుళ్లు అని నేను చెప్పాను’ recasts this as an indirect-content construction and reverses the source order. Moving ‘అని’ outside the quoted words and restoring ‘నేను చెప్పాను: మీరు దేవుళ్లు’ preserves the direct quotation.'
