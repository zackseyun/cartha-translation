id: JHN.10.34
reference: John 10:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἔστιν γεγραμμένον ἐν τῷ νόμῳ ὑμῶν ⸀ὅτι Ἐγὼ εἶπα· Θεοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/034.yaml
  text: Jesus answered them[a], “Is it not written in your Law, ‘I said, you are gods’?”
translation:
  language: te
  text: 'యేసు వారికి ఇలా జవాబిచ్చాడు: “మీ ధర్మశాస్త్రంలో, ‘నేను చెప్పాను: మీరు దేవుళ్లు[a]’ అని వ్రాయబడి లేదా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దైవిక జీవులు.’ యేసు కీర్తన 82:6ను ఉటంకిస్తున్నాడు. అక్కడి పదాన్ని ఎలా అర్థం చేసుకోవాలనే విషయంలో భిన్నాభిప్రాయాలు ఉన్నాయి; ప్రధాన పాఠ్యం ఉద్ధరణలోని నేరమైన పదాన్ని నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: యేసు వారికి ఇలా జవాబిచ్చాడు
  rationale: గ్రీకు కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది; αὐτοῖς అనే దత్తివును ‘వారికి’గా స్పష్టంగా నిలుపుతుంది.
- source_word: Οὐκ ἔστιν γεγραμμένον
  choice: రాసి లేదా?
  rationale: గ్రంథోక్తిని పరిచయం చేసే గ్రీకు perfect passive భావాన్ని తెలుగులో సహజమైన ప్రతికూల ప్రశ్నగా వ్యక్తపరుస్తుంది; వాక్యం ఇప్పటికీ లిఖితంగా ఉందనే వర్తమాన ప్రాసంగికత నిలుస్తుంది.
- source_word: ἐν τῷ νόμῳ ὑμῶν
  choice: మీ ధర్మశాస్త్రంలో
  rationale: ఇక్కడ νόμος కీర్తన 82:6ను కూడా కలుపుకొని అధికారిక యూద గ్రంథాలను విస్తృతంగా సూచిస్తుంది; ‘ధర్మశాస్త్రం’ తెలుగు బైబిలు సందర్భంలో గుర్తించదగిన, గౌరవప్రదమైన పదం.
- source_word: Ἐγὼ εἶπα
  choice: నేను చెప్పాను
  rationale: వ్యక్తమైన Ἐγώను ‘నేను’గా నిలిపి, εἶπαను సాధారణ భూతకాల క్రియగా నేరుగా అనువదిస్తుంది; అవసరం లేని అదనపు ఉద్ఘాటనను చేర్చదు.
- source_word: Θεοί ἐστε
  choice: మీరు దేవుళ్లు
  rationale: θεοί అనే బహువచన నామవాచకానికి నేరమైన సమానార్థకం ‘దేవుళ్లు’; ἐστεను ‘అని పిలువబడ్డారు’గా విస్తరించకుండా, తెలుగు నామవాచక విధేయ నిర్మాణంలో ‘మీరు దేవుళ్లు’గా నిలుపుతుంది.
theological_decisions:
- issue: కీర్తన 82:6 ఉద్ధరణలో θεοί అనువాదం
  choice: దేవుళ్లు
  alternative: దైవిక జీవులు
  rationale: నేరమైన పదార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచడం యేసు వాదనలోని అలంకారిక బలాన్నీ, మూలపాఠ్యంలోని వ్యాఖ్యాన ఉద్రిక్తతనూ కాపాడుతుంది. ‘దైవిక జీవులు’ అనేది సాధ్యమైన వ్యాఖ్యానాత్మక ప్రత్యామ్నాయం కాబట్టి పాదటిప్పణిలో మాత్రమే ఇవ్వబడింది.
- issue: ἐν τῷ νόμῳ ὑμῶνలో νόμος పరిధి
  choice: మీ ధర్మశాస్త్రంలో
  alternative: మీ గ్రంథాల్లో
  rationale: యేసు కీర్తనను ఉటంకిస్తున్నప్పటికీ గ్రీకు పాఠ్యం νόμος అనే పదాన్నే ఉపయోగిస్తుంది. అందువల్ల దానిని ‘గ్రంథాలు’గా మార్చకుండా ‘ధర్మశాస్త్రం’గా ఉంచి, ఇక్కడ దాని విస్తృత శాస్త్రార్థాన్ని సందర్భానికి వదిలివేయడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి. ‘మీ ధర్మశాస్త్రంలో’ అనే రూపం మూలంలోని ‘మీ’ భావాన్ని నిలుపుతుంది. ‘దేవుళ్లు’ సాధారణ పాఠకునికి స్పష్టమైన నేర పదం; పాదటిప్పణి దాని వ్యాఖ్యానాత్మక ప్రత్యామ్నాయాన్ని సూచిస్తుంది.
