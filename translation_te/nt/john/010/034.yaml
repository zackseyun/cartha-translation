  to: 'యేసు వారికి ఇలా జవాబిచ్చాడు: “మీ ధర్మశాస్త్రంలో, ‘నేను చెప్పాను: మీరు దేవుళ్లు[a]’ అని వ్రాయబడి లేదా?”'
  rationale: 'A safe syntactic correction restores the Greek citation as direct speech: ‘I said: You are gods.’ The translation otherwise faithfully retains the rhetorical question, the broad scriptural use of ‘Law,’ and the disputed term θεοί without interpretive softening. The footnote anchor remains attached to ‘దేవుళ్లు,’ the term it explains.'
