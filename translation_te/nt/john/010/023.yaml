translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ప్రదేశ సంబంధిత రెండు పదాల మధ్య గందరగోళం రాకుండా ‘దేవాలయ ప్రాంగణం’ మరియు దానిలోని ప్రత్యేక స్థలమైన ‘సొలొమోను మంటపం’ వేరుగా చూపబడ్డాయి. పాదసూచిక గుర్తులన్నీ ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
