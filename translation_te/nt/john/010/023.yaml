  yaml_path: translation/nt/john/010/023.yaml
  text: And Jesus was walking in the temple courts[b][a], in Solomon’s Portico.
translation:
  language: te
  text: యేసు దేవాలయ ప్రాంగణంలో, సొలొమోను స్తంభమండపంలో[a] నడుస్తూ ఉన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “స్తంభాల మంటపంలో”; గ్రీకు పదం στοά స్తంభాలతో కూడిన కప్పబడిన నడవను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “దేవాలయ ప్రాంగణం” అని అనువదించిన గ్రీకు పదం ἱερόν; ఇది కేవలం లోపలి పరిశుద్ధ స్థలాన్ని కాక దేవాలయ సముదాయాన్ని లేదా ఆవరణలను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: περιεπάτει
  choice: నడుస్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ గతంలో కొనసాగుతున్న చర్యను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ కొనసాగింపు భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἱερῷ
  choice: దేవాలయ ప్రాంగణంలో
  rationale: ἱερόν అంతర్గత పరిశుద్ధ స్థలాన్ని మాత్రమే కాక దేవాలయ సముదాయాన్ని లేదా ఆవరణను సూచిస్తుంది; ‘ప్రాంగణం’ ప్రజలు సంచరించే విస్తృత ప్రాంతాన్ని స్పష్టం చేస్తుంది.
- source_word: στοᾷ
  choice: మంటపంలో
  rationale: στοά స్తంభాలతో కూడిన కప్పబడిన నడవను సూచిస్తుంది; తెలుగు పాఠకులకు సహజంగా అర్థమయ్యే నిర్మాణపదంగా ‘మంటపం’ ఎంచుకోబడింది, ఖచ్చితమైన నిర్మాణార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: τοῦ Σολομῶνος
  choice: సొలొమోను
  rationale: సంబంధ విభక్తి ఇక్కడ ఆ ప్రదేశపు పేరును సూచిస్తుంది; ‘సొలొమోను మంటపం’ సహజమైన తెలుగు నామరూపం.
- source_word: καὶ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: తెలుగులో వాక్యారంభ ‘మరియు’ అసహజంగా ఉంటుంది; సందర్భ అనుసంధానం వాక్యక్రమంలోనే స్పష్టంగా ఉండటంతో అదనపు కాలార్థాన్ని చేర్చకుండా వదిలివేయబడింది.
