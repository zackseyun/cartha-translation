id: JHN.10.38
reference: John 10:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ ποιῶ, κἂν ἐμοὶ μὴ πιστεύητε τοῖς ἔργοις ⸀πιστεύετε, ἵνα γνῶτε καὶ ⸀γινώσκητε ὅτι ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν ⸂τῷ πατρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/038.yaml
  text: But if I do them[a], even if you do not believe me, believe the works, so that you may know and continue to know that the Father is in me[c][b], and I am in the Father.
translation:
  language: te
  text: కాని నేను వాటిని చేస్తే, మీరు నన్ను నమ్మకపోయినా[a], ఆ కార్యాలను నమ్మండి; తద్వారా తండ్రి నాలో ఉన్నాడనీ, నేను తండ్రిలో ఉన్నాననీ మీరు తెలుసుకొని, తెలుసుకుంటూ ఉండేలా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీరు నాలో విశ్వాసం ఉంచకపోయినా.’ గ్రీకులో ‘నమ్ము’ అనే క్రియతో దత్తివిభక్తి సర్వనామం ఉంది; అది ‘నన్ను నమ్మడం’ లేదా ‘నాలో విశ్వాసం ఉంచడం’ అనే అర్థాలను ఇవ్వగలదు. ఇక్కడ తరువాత వచ్చే ‘కార్యాలను నమ్మండి’ అనే వ్యత్యాసానికి ‘నన్ను నమ్మకపోయినా’ బాగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘తెలుసుకొని, తెలుసుకుంటూ ఉండేలా’ అనే మాటలు గ్రీకులోని రెండు వేర్వేరు క్రియారూపాలను ప్రతిబింబిస్తాయి. అవి తెలుసుకోవడానికి రావడాన్నీ, ఆ తెలుసుకోవడం కొనసాగడాన్నీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῶ
  choice: నేను వాటిని చేస్తుంటే
  rationale: వర్తమానకాల క్రియను సహజమైన తెలుగులో వ్యక్తం చేస్తూ, సందర్భంలో చెప్పబడిన కార్యాలనే సూచించడానికి గ్రీకులో అంతర్లీనంగా ఉన్న కర్మను ‘వాటిని’ అని స్పష్టం చేశాం.
- source_word: κἂν ἐμοὶ μὴ πιστεύητε
  choice: మీరు నన్ను నమ్మకపోయినా
  rationale: πιστεύω దత్తివిభక్తి సర్వనామంతో ఇక్కడ యేసు చెప్పిన మాటను నమ్మడాన్ని సూచిస్తుంది. ‘నన్ను నమ్మకపోయినా’ అనేది తరువాతి ‘కార్యాలను నమ్మండి’ అనే వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: τοῖς ἔργοις πιστεύετε
  choice: ఆ కార్యాలను నమ్మండి
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్త బలాన్ని నిలుపుతూ, యేసు చేసిన కార్యాలు ఇచ్చే సాక్ష్యాన్ని అంగీకరించమనే భావాన్ని వ్యక్తం చేస్తుంది; ‘కార్యాలలో విశ్వాసం ఉంచండి’ అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: ἔργοις
  choice: కార్యాలు
  rationale: యోహాను రచనలో ἔργα యేసు చేసే వెల్లడిపరచే కార్యాలను సూచిస్తుంది. ‘సూచకక్రియలు’ అని అనువదిస్తే మూలంలో లేని σημεῖα భావాన్ని చేర్చినట్లవుతుంది.
- source_word: ἵνα γνῶτε καὶ γινώσκητε
  choice: మీరు తెలుసుకుని, తెలుసుకుంటూనే ఉండగలరు
  rationale: మొదటి ఎయోరిస్ట్ క్రియారూపం తెలుసుకోవడానికి రావడాన్ని, తరువాతి వర్తమాన క్రియారూపం ఆ తెలుసుకోవడం కొనసాగడాన్ని సూచించగలదు. తెలుగు పునరుక్తి ఈ కాలాంశ వ్యత్యాసాన్ని సాధ్యమైనంత స్పష్టంగా నిలుపుతుంది.
- source_word: ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν τῷ πατρί
  choice: తండ్రి నాలో ఉన్నాడనీ, నేను తండ్రిలో ఉన్నాననీ
  rationale: పరస్పర అంతర్నివాసాన్ని తెలిపే పునరుక్త ἐν ను ‘లో’తో నేరుగా అనువదించి, వ్యాఖ్యానాత్మక విస్తరణ లేకుండా యోహాను వాక్యబలాన్ని నిలిపాం.
- source_word: πατήρ
  choice: తండ్రి
  rationale: గ్రీకులో ఉన్న నిర్దిష్ట ‘తండ్రి’ రూపాన్ని నిలుపుతూ, మూలంలో లేని ‘నా’ అనే స్వామ్యపదాన్ని చేర్చలేదు.
theological_decisions:
- issue: తండ్రి మరియు కుమారుని పరస్పర అంతర్నివాసం
  choice: ‘తండ్రి నాలో ఉన్నాడు, నేను తండ్రిలో ఉన్నాను’ అనే సంబంధాత్మక భాషను నేరుగా నిలుపడం
  alternative: ‘తండ్రి నాతో ఐక్యంగా ఉన్నాడు, నేను తండ్రితో ఐక్యంగా ఉన్నాను’ లేదా ‘తండ్రి నాలో నివసిస్తున్నాడు, నేను తండ్రిలో నివసిస్తున్నాను’
  rationale: మూలవాక్యం బలమైన క్రీస్తుతత్వ ప్రకటన చేస్తుంది; అయితే తరువాతి సిద్ధాంతపర పదజాలాన్ని వచనంలోకి చేర్చకుండా, దాని నిజమైన భావగంభీరతను మరియు ఉద్వేగాన్ని యథాతథంగా ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘కార్యాలు’ అనే పదం యోహాను రచనలోని ప్రధాన పదజాలాన్ని నిలుపుతుంది. చివరి భాగంలోని ఉద్దేశపూర్వక పునరుక్తి కొంత అసాధారణంగా వినిపించినా, గ్రీకు క్రియారూపాల మధ్య ఉన్న నిజమైన కాలాంశ వ్యత్యాసాన్ని సంరక్షిస్తుంది.
