review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the contrast between believing Jesus and believing his works, and it retains the reciprocal Johannine expression, “the Father is in me and I am in the Father.” However, “చేస్తుంటే” unnecessarily makes ποιῶ progressive (“am doing”), whereas the contextual present is better rendered simply “చేస్తే.” Also, ἵνα introduces purpose; “అప్పుడు” is chiefly temporal/resultative, and “ఉండగలరు” can suggest mere ability rather than the intended purpose.
  naturalness: The vocabulary and register are generally natural modern standard Telugu. Recasting the final purpose clause with “తద్వారా” makes the logical relation clearer and more idiomatic while retaining the deliberate paired knowledge expressions.
  terminology: “కార్యాలు” appropriately preserves Johannine ἔργα without importing “signs.” “తండ్రి” and the direct “నాలో/తండ్రిలో” wording are accurate and avoid doctrinal paraphrase. The note on πιστεύω with the dative is useful; its wording is adjusted so that it does not shift from the verse’s negative statement to an imperative.
  issues:
  - severity: medium
    issue: “చేస్తుంటే” renders ποιῶ as progressive.
    rationale: The Greek present here refers generally to the works under discussion and does not require an ongoing-progressive Telugu form. “చేస్తే” is more neutral and contextually accurate.
  - severity: medium
    issue: “అప్పుడు” and “ఉండగలరు” weaken the purpose force of ἵνα.
    rationale: ἵνα γνῶτε καὶ γινώσκητε expresses intended result/purpose with two subjunctives. “తద్వారా … తెలుసుకొని, తెలుసుకుంటూ ఉండేలా” better represents this without making an unwarranted claim about ability.
