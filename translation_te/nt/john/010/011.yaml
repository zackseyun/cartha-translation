id: JHN.10.11
reference: John 10:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ὁ ποιμὴν ὁ καλός· ὁ ποιμὴν ὁ καλὸς τὴν ψυχὴν αὐτοῦ τίθησιν ὑπὲρ τῶν προβάτων·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/011.yaml
  text: I am the good shepherd[c][b][a]. The good shepherd lays down his life for the sheep.
translation:
  language: te
  text: “నేనే మంచి కాపరిని.[a] మంచి కాపరి గొర్రెల కోసం తన ప్రాణాన్ని అర్పిస్తాడు.[b][c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఉదాత్త కాపరి’ లేదా ‘ఆదర్శప్రాయమైన కాపరి’ అని కూడా అనువదించవచ్చు; గ్రీకు పదం మంచితనం, శ్రేష్ఠత, ఆదర్శప్రాయత అనే భావాలను కలిగి ఉంటుంది.
    reason: lexical_alternative
  - marker: b
    text: పదశః, ‘తన ప్రాణాన్ని ఉంచుతాడు’; ఇది తన ప్రాణాన్ని అర్పించడాన్ని తెలిపే గ్రీకు నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: ‘గొర్రెల తరఫున’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: నేనే
  rationale: గ్రీకులో వ్యక్తమైన ἐγώ ఇచ్చే ఉద్ఘాటనను సహజమైన తెలుగులో ‘నేనే’ తెలియజేస్తుంది; దీనికి దైవనామ సూచనను అనువాదంలో అదనంగా నిర్ధారించదు.
- source_word: ποιμήν
  choice: కాపరి
  rationale: గొర్రెలను కాచే వ్యక్తి అనే ప్రత్యక్ష రూపకాన్ని సహజంగా తెలియజేస్తుంది; ‘పాస్టర్’ వంటి తరువాతి సంఘసంబంధ భావాన్ని చేర్చదు.
- source_word: καλός
  choice: మంచి
  rationale: నైతిక మంచితనం, శ్రేష్ఠత, ఆదర్శప్రాయత అనే భావవిస్తృతిని సాధారణ ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: τὴν ψυχὴν αὐτοῦ τίθησιν
  choice: తన ప్రాణాన్ని అర్పిస్తాడు
  rationale: పదశః ‘తన ప్రాణాన్ని ఉంచుతాడు’ అనే గ్రీకు నుడికారానికి తెలుగులో సహజమైన అర్థసమాన రూపం; స్వచ్ఛంద ప్రాణత్యాగ భావాన్ని తెలియజేస్తుంది.
- source_word: ὑπὲρ τῶν προβάτων
  choice: గొర్రెల కోసం
  rationale: ὑπέρ లోని ప్రయోజనార్థక/ప్రతినిధి భావాన్ని ఏకైక ప్రాయశ్చిత్త సిద్ధాంతానికి పరిమితం చేయకుండా సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: Ἐγώ εἰμι అనే స్వీయ గుర్తింపు యొక్క బలం
  choice: ‘నేనే’ అని ఉద్ఘాటనతో అనువదించడం
  alternative: ‘నేను’ అని సరళంగా అనువదించడం; లేదా దైవనామ సూచనను స్పష్టంగా చేర్చడం
  rationale: ఇక్కడి వాక్యనిర్మాణం ‘నేను మంచి కాపరిని’ అనే విధేయ స్వీయ గుర్తింపు. వ్యక్తమైన సర్వనామపు ఉద్ఘాటనను నిలిపినా, ఈ వాక్యం నిర్బంధించని దైవనామ వ్యాఖ్యానాన్ని అనువాదంలో చేర్చలేదు.
- issue: καλός అనే పదంతో కాపరి గుణవర్ణన
  choice: ‘మంచి కాపరి’
  alternative: ‘ఉత్తమ కాపరి’ లేదా ‘ఉదాత్త కాపరి’
  rationale: ‘మంచి’ సుపరిచితంగా, సహజంగా ఉండి καλός పదంలోని మంచితనం, శ్రేష్ఠత, ఆదర్శప్రాయతలను అతిగా నిర్దిష్టం చేయకుండా ఉంచుతుంది.
- issue: ὑπὲρ τῶν προβάτων యొక్క భావం
  choice: ‘గొర్రెల కోసం’
  alternative: ‘గొర్రెల తరఫున’ లేదా ‘గొర్రెల మేలు కోసం’
  rationale: మూలంలోని ప్రయోజనార్థక, ప్రతినిధి అవకాశాలను నిలుపుతూ, యేసు మరణాన్ని ఒక నిర్దిష్ట ప్రాయశ్చిత్త సిద్ధాంతంతో మాత్రమే వివరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గొర్రెల కాపరి రూపకాన్ని నేరుగా నిలిపి, సంఘపదజాలాన్ని లేదా ప్రత్యేక ప్రాయశ్చిత్త సిద్ధాంతాన్ని చేర్చలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన వచనంలో పొందుపరచబడ్డాయి.
