id: JHN.10.41
reference: John 10:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ἦλθον πρὸς αὐτὸν καὶ ἔλεγον ὅτι Ἰωάννης μὲν σημεῖον ἐποίησεν οὐδέν, πάντα δὲ ὅσα εἶπεν Ἰωάννης περὶ τούτου ἀληθῆ ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/041.yaml
  text: And many came to him and were saying, “John did no sign, but everything that John said about this man was true.”
translation:
  language: te
  text: చాలామంది ఆయన దగ్గరకు వచ్చి, “యోహాను ఏ సూచక కార్యమూ చేయలేదు. కానీ ఈయన గురించి యోహాను చెప్పినవన్నీ నిజమైనవే” అని చెబుతూ ఉన్నారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “చెబుతూ ఉన్నారు” అనే మాట కొనసాగుతున్న లేదా పదేపదే జరుగుతున్న మాటలను సూచించవచ్చు.
    reason: aspectual_clarification
lexical_decisions:
- source_word: πολλοὶ
  choice: అనేకులు
  rationale: విశేషణం నామవాచకంగా వాడబడింది; ‘అనేకులు’ సంక్షిప్తంగా, సహజంగా ప్రజలను సూచిస్తుంది.
- source_word: ἦλθον πρὸς αὐτόν
  choice: ఆయన దగ్గరికి వచ్చి
  rationale: πρός తో కూడిన ἔρχομαι ఒక వ్యక్తివైపు వచ్చుటను సూచిస్తుంది; సందర్భంలో ఇది సహజమైన తెలుగు ప్రయోగం.
- source_word: ἔλεγον
  choice: అని అంటూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న లేదా పునరావృతమైన మాటల భావాన్ని నిలుపుతుంది.
- source_word: σημεῖον
  choice: సూచకకార్యం
  rationale: యోహాను సువార్తలో అద్భుతం తనకతీతమైన సత్యాన్ని సూచించే కార్యంగా ఉండే భావాన్ని ‘సూచకకార్యం’ నిలుపుతుంది.
- source_word: ἐποίησεν οὐδέν
  choice: ఏ సూచకకార్యమూ చేయలేదు
  rationale: గ్రీకు వాక్యంలోని సంపూర్ణ నిరాకరణను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: πάντα δὲ ὅσα
  choice: అయితే ... చెప్పినవన్నీ
  rationale: πάντα యొక్క సమగ్ర భావాన్ని ‘అన్నీ’ నిలుపుతుంది; δέ లోని వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది.
- source_word: περὶ τούτου
  choice: ఈయన గురించి
  rationale: τούτου లోని సమీప సూచనను, గౌరవప్రదమైన తెలుగు వ్యక్తి సూచకరూపంతో నిలుపుతుంది; సందర్భంలో ఇది యేసును సూచిస్తుంది.
- source_word: ἀληθῆ ἦν
  choice: నిజమే
  rationale: విషయాలన్నీ సత్యమైనవని నేరుగా తెలుపుతుంది; గ్రీకులో లేని ‘నిరూపితమయ్యాయి’ వంటి అదనపు భావాన్ని చేర్చదు.
theological_decisions:
- issue: యోహాను సువార్తలో σημεῖον పదప్రయోగం
  choice: సూచకకార్యం
  alternative: అద్భుతం
  rationale: ‘అద్భుతం’ శక్తికార్యాన్ని మాత్రమే ముందుకు తేవవచ్చు; ‘సూచకకార్యం’ యోహాను సువార్తలోని సంకేతాత్మక భావాన్ని కాపాడుతుంది.
- issue: περὶ τούτου యొక్క సూచన
  choice: ఈయన గురించి
  alternative: ఆయన గురించి
  rationale: τούτου లోని నిర్దేశక బలాన్ని నిలుపుతూ, యేసును గౌరవంగా సూచిస్తుంది; కేవలం సర్వనామంగా మార్చి దాని బలాన్ని తగ్గించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఈయన’ యేసును గౌరవంగా సూచిస్తూ గ్రీకు నిర్దేశక సర్వనామ బలాన్ని నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
