revisions:
- from: అనేకులు ఆయన దగ్గరికి వచ్చి, “యోహాను ఏ సూచకకార్యమూ చేయలేదు[a]. అయితే ఈయన గురించి యోహాను చెప్పినవన్నీ నిజమే” అని అంటూ ఉన్నారు[b].
  to: చాలామంది ఆయన దగ్గరకు వచ్చి, “యోహాను ఏ సూచక కార్యమూ చేయలేదు. కానీ ఈయన గురించి యోహాను చెప్పినవన్నీ నిజమైనవే” అని చెబుతూ ఉన్నారు[a].
  rationale: The revision replaces the redundant “అని అంటూ ఉన్నారు” with the natural imperfect-sensitive expression “అని చెబుతూ ఉన్నారు.” It improves agreement and fluency with “చెప్పినవన్నీ నిజమైనవే,” while retaining the comprehensive force of πάντα ὅσα. The misleading lexical-alternative footnote is removed because it introduces ‘displaying’ and does not preserve σημεῖον accurately. The remaining footnote is re-anchored to the expression that renders ἔλεγον.
