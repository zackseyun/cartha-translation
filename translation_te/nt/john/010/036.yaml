id: JHN.10.36
reference: John 10:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃν ὁ πατὴρ ἡγίασεν καὶ ἀπέστειλεν εἰς τὸν κόσμον ὑμεῖς λέγετε ὅτι Βλασφημεῖς, ὅτι εἶπον· Υἱὸς τοῦ θεοῦ εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/036.yaml
  text: do you say of the one whom the Father sanctified and sent into the world[a], ‘You are blaspheming,’ because I said, ‘I am the Son of God’?”
translation:
  language: te
  text: తండ్రి పరిశుద్ధపరచి[a] లోకంలోకి పంపినవాని గురించి, ‘నేను దేవుని కుమారుణ్ణి’ అని నేను చెప్పినందుకు, ‘నీవు దైవదూషణ చేస్తున్నావు’ అని మీరు అంటున్నారా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రతిష్ఠించి’ లేదా ‘ప్రత్యేకపరచి’.
    reason: ἡγίασεν అనే పదానికి ఈ సందర్భంలో సాధ్యమైన భావాంతరాలను తెలియజేయడం.
lexical_decisions:
- source_word: ἡγίασεν
  choice: పరిశుద్ధపరచి
  rationale: ἁγιάζωలోని పరిశుద్ధతకు సంబంధించిన పదబంధాన్ని నిలుపుతూ, తండ్రి కుమారుణ్ణి తన కార్యం కోసం ప్రతిష్ఠించిన భావాన్నీ సందర్భంలో వ్యక్తం చేస్తుంది. ఇది నైతిక లోపం తొలగించబడిందని తప్పనిసరిగా సూచించదు; ప్రత్యామ్నాయ భావాలను పాదసూచికలో ఇచ్చాం.
- source_word: ἀπέστειλεν
  choice: పంపిన
  rationale: యోహాను సువార్తలో కనిపించే పంపబడినవాని కార్యభాషను నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: κόσμον
  choice: లోకంలోకి
  rationale: εἰς τὸν κόσμον యొక్క దిశను స్పష్టంగా చూపిస్తూ, యోహాను రచనలో κόσμοςకు సాధారణమైన ‘లోకం’ అనే పదాన్ని నిలుపుతుంది.
- source_word: Βλασφημεῖς
  choice: నీవు దైవదూషణ చేస్తున్నావు
  rationale: వర్తమానకాల ఆరోపణను సహజమైన తెలుగు ప్రత్యక్ష వాక్యంగా అందిస్తుంది.
- source_word: Υἱὸς τοῦ θεοῦ
  choice: దేవుని కుమారుణ్ణి
  rationale: ఈ సందర్భంలోని క్రీస్తుసంబంధమైన బిరుదు బలాన్ని నిలుపుతుంది; ‘నేను ... కుమారుణ్ణి’ అనే తెలుగు విధేయ నిర్మాణానికి అనుగుణంగా ఉంది.
- source_word: ὃν ὁ πατὴρ
  choice: తండ్రి ... పంపినవాని గురించి
  rationale: గ్రీకు సంబంధవాచక నిర్మాణాన్ని సహజమైన తెలుగు కృదంత నిర్మాణంగా మార్చి, ఆరోపణ ఎవరి గురించి చేయబడిందో స్పష్టంగా ఉంచుతుంది.
- source_word: ὅτι ... ὅτι
  choice: '... అని ... చెప్పినందుకు ... అని'
  rationale: మొదటి ὅτι ద్వారా ఆరోపణలోని మాటను, రెండవ ὅτι ద్వారా ఆ ఆరోపణకు చెప్పబడిన కారణాన్ని తెలుగులో స్పష్టంగా వేరు చేస్తుంది.
theological_decisions:
- issue: కుమారునికి సంబంధించి ἡγίασεν అనువాదం
  choice: పరిశుద్ధపరచి
  alternative: ప్రతిష్ఠించి / ప్రత్యేకపరచి
  rationale: మూలపదంలోని పరిశుద్ధత భావాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, కుమారుడు ముందుగా అపవిత్రుడని లేదా నైతికంగా మెరుగుపరచబడ్డాడని అనువాదం స్వయంగా నిర్ణయించదు. కార్యం కోసం ప్రతిష్ఠించడం లేదా ప్రత్యేకపరచడం అనే సందర్భోచిత భావాలను పాదసూచిక తెలియజేస్తుంది.
- issue: Υἱὸς τοῦ θεοῦ యొక్క క్రీస్తుసంబంధమైన బలం
  choice: దేవుని కుమారుడు
  alternative: దేవుని కుమారుడు అనే వాడు
  rationale: దైవదూషణ ఆరోపణ ఉన్న తక్షణ సందర్భంలో ఈ పదబంధం బిరుదుగా ఉన్న బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది; తరువాతి సిద్ధాంత సూత్రీకరణలను పాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ప్రశ్నారూపం వాడబడింది. ‘దైవదూషణ’ బైబిలు సందర్భానికి తగిన స్థిరమైన పదం; మిగతా వాక్య నిర్మాణం సహజమైన ప్రస్తుత తెలుగు శైలిలో ఉంది.
