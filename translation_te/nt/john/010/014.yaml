  text: I am the good shepherd[a], and I know my own, and my own know me,
translation:
  language: te
  text: “నేనే మంచి కాపరిని. నా వారు[a] నాకు తెలుసు; నా వారికి నేను తెలుసు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా గొర్రెలు.” రెండు వాక్యభాగాల్లోనూ గ్రీకు మూలంలో అక్షరార్థంగా “నా సొంతమైనవి” అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: నేనే
  rationale: ప్రత్యక్ష స్వీయ గుర్తింపును, ἐγώ వల్ల వచ్చే ఉద్ఘాటనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ποιμὴν ὁ καλός
  choice: మంచి కాపరి
  rationale: ποιμήν యొక్క సాధారణ అర్థమైన గొర్రెల కాపరి రూపకాన్ని నిలుపుతుంది; ‘పాస్టర్’ వంటి తరువాతి సంఘపరమైన భావాలను చేర్చదు. καλός లోని మంచితనం, ఆదర్శయోగ్యత రెండింటినీ ‘మంచి’ సహజంగా మోస్తుంది.
- source_word: γινώσκω / γινώσκουσί
  choice: తెలుసు
  rationale: కేవలం గుర్తుపట్టడం కాక వ్యక్తిగత, పరస్పర పరిచయాన్ని సూచిస్తుంది. తెలుగులో ‘నాకు తెలుసు / వారికి తెలుసు’ నిర్మాణం సహజంగా ఈ సంబంధాత్మక భావాన్ని తెలియజేస్తుంది.
- source_word: τὰ ἐμὰ / τὰ ἐμά
  choice: నా వారు
  rationale: గ్రీకులోని సంక్షిప్త స్వామ్య వ్యక్తీకరణను మనుషులను సూచించే సహజ తెలుగులో నిలుపుతుంది. సందర్భంలో గొర్రెలను సూచించినా, ఈ వచనంలో ‘గొర్రెలు’ అనే పదం ప్రత్యక్షంగా లేదు.
- source_word: καί
  choice: వాక్య సమన్వయం; అర్ధవిరామం
  rationale: గ్రీకు καί కలిపే రెండు సమాంతర వాక్యభాగాలను తెలుగులో సహజమైన అర్ధవిరామంతో సమన్వయపరచింది; కొత్త ఉద్ఘాటనను చేర్చలేదు.
theological_decisions:
- issue: యేసుకు ఆయనవారికి మధ్య పరస్పర సంబంధాన్ని తరువాతి సిద్ధాంతపరమైన పదజాలం చేర్చకుండా వ్యక్తం చేయడం
  choice: నా వారు
  alternative: నా గొర్రెలు; నాకు చెందినవారు
  rationale: ‘నా వారు’ అనేది చెందినవారనే సంబంధ భావాన్ని, పరస్పర వ్యక్తిగత పరిచయాన్ని నిలుపుతుంది; మూలంలో ఈ వచనంలో లేని ‘గొర్రెలు’ అనే నామవాచకాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా, అయినా గంభీరతను నిలుపుతూ ‘నేనే మంచి కాపరిని’ మరియు పరస్పర ‘తెలుసు’ నిర్మాణం వాడబడింది.
