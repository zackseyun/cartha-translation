id: JHN.10.15
reference: John 10:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καθὼς γινώσκει με ὁ πατὴρ κἀγὼ γινώσκω τὸν πατέρα, καὶ τὴν ψυχήν μου τίθημι ὑπὲρ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/015.yaml
  text: just as the Father knows me and I know the Father[b][a], and I lay down my life for the sheep.
translation:
  language: te
  text: తండ్రి నన్ను తెలిసినట్లే, నేను తండ్రిని తెలుసుకొంటున్నాను, మరియు గొర్రెల కోసం[b] నా ప్రాణాన్ని[a] అర్పిస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా జీవాన్ని.’ ఇక్కడ ఈ పదం ఆత్మార్పణ సందర్భంలో ఒకరి ప్రాణం లేదా జీవితాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘గొర్రెల పక్షాన.’ గ్రీకు విభక్త్యర్థక పదం వాటి మేలు నిమిత్తం జరిగే ప్రతినిధిత్వ లేదా బలిదాన భావాన్ని కూడా మోయగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: ఎరిగినట్లే
  rationale: ముందటి వాక్యంలోని పరస్పర పరిచయంతో ఈ వాక్యాన్ని బలమైన పోలిక ద్వారా కలుపుతుంది; ‘అట్లే’ అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: γινώσκει / γινώσκω
  choice: ఎరిగినట్లే / ఎరుగుతున్నాను
  rationale: తండ్రి–కుమారుల మధ్య ఉన్న లోతైన సంబంధపూర్వక జ్ఞానాన్ని కేవలం సమాచారపరమైన ‘తెలుసుకోవడం’గా కుదించకుండా, రెండు క్రియల పదసంబంధాన్ని నిలుపుతుంది.
- source_word: ὁ πατὴρ / τὸν πατέρα
  choice: తండ్రి / తండ్రిని
  rationale: గ్రీకు పాఠంలో స్వామ్యసూచక సర్వనామం లేదు; యోహాను రచనలోని ‘తండ్రి’ అనే ప్రయోగాన్ని అలాగే నిలుపుతుంది.
- source_word: κἀγὼ
  choice: నేను
  rationale: καί + ἐγώ సూచించే సమాంతర ప్రత్యుత్తరాన్ని తెలుగు వాక్య నిర్మాణంలో సహజంగా వ్యక్తపరుస్తుంది; ప్రత్యేకంగా ‘కూడా’ చేర్చకుండానే పరస్పరత స్పష్టంగా ఉంది.
- source_word: ψυχήν μου
  choice: నా ప్రాణాన్ని
  rationale: ఈ ఆత్మార్పణ సందర్భంలో ψυχή శరీరానికి భిన్నమైన ‘ఆత్మ’ను మాత్రమే కాక, ఒకరి ప్రాణం లేదా జీవాన్ని సూచిస్తుంది. ‘నా ప్రాణాన్ని’ ఆధునిక తెలుగులో సహజంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: τίθημι
  choice: అర్పిస్తున్నాను
  rationale: ψυχήతో కలిసి వాడినప్పుడు తన ప్రాణాన్ని స్వచ్ఛందంగా ఇవ్వడాన్ని సూచించే యోహానీయ ప్రయోగం. పదశః ‘పెడుతున్నాను’ కంటే ‘అర్పిస్తున్నాను’ తెలుగులో సహజంగా ఉండి స్వచ్ఛంద ఆత్మత్యాగాన్ని తెలియజేస్తుంది.
- source_word: ὑπὲρ
  choice: కోసం
  rationale: గొర్రెల మేలు నిమిత్తం, వాటి పక్షాన జరిగే ఆత్మార్పణం అనే విస్తృత భావాన్ని సహజంగా ఉంచుతుంది; ఒకే సాంకేతిక సిద్ధాంతార్థానికి దాన్ని పరిమితం చేయదు.
- source_word: τῶν προβάτων
  choice: గొర్రెల
  rationale: ఈ భాగానికి కేంద్రంగా ఉన్న కాపరి రూపకాన్ని ‘మంద’ అని సాధారణీకరించకుండా గ్రీకు నామవాచకాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
theological_decisions:
- issue: యేసు ఆత్మార్పణంలో ὑπὲρ పదబలం
  choice: గొర్రెల కోసం
  alternative: గొర్రెల పక్షాన; గొర్రెల స్థానంలో
  rationale: ఈ విభక్త్యర్థక పదం గొర్రెల మేలు నిమిత్తం, వాటి పక్షాన జరిగే బలిదాన భావాన్ని మోయగలదు. ‘కోసం’ ఆ పరిధిని నిలుపుతూ, మూలపాఠం స్పష్టంగా నిర్దేశించని ఒకే ప్రత్యామ్నాయ లేదా ప్రతినిధిత్వ సిద్ధాంత సూత్రానికి అనువాదాన్ని పరిమితం చేయదు.
- issue: ఈ సందర్భంలో ψυχή అర్థం
  choice: ప్రాణం
  alternative: జీవం; ఆత్మ
  rationale: మంచి కాపరి గొర్రెల కొరకు మరణించడమే సమీప సందర్భం కాబట్టి, ఇక్కడ ψυχή యేసు అర్పించే ప్రాణాన్ని సూచిస్తుంది. ‘ఆత్మ’ అని మాత్రమే అనువదిస్తే మానవ స్వభావం గురించి మూలపాఠంలో లేని సంకుచిత భావం కలగవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి పాటించబడింది. ‘ఎరుగుతున్నాను’ సంబంధపూర్వక జ్ఞానానికి తగిన గంభీరతను ఇస్తుంది; ‘అర్పిస్తున్నాను’ స్వచ్ఛంద ప్రాణత్యాగాన్ని సహజంగా వ్యక్తపరుస్తుంది. రెండు పాదాల సమాంతర నిర్మాణం నిలుపబడింది.
