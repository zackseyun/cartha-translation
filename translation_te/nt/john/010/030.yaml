translation:
  language: te
  text: నేనూ తండ్రియూ ఒకటే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘ఒకటి’ అనే పదం నపుంసక లింగంలో ఉంది. ఇది యేసును, తండ్రిని ఒకే వ్యక్తిగా గుర్తించకుండా వారి ఏకత్వాన్ని నొక్కిచెబుతుంది.
