lexical_decisions:
- source_word: ἐγὼ
  choice: నేను (సంధి రూపంలో ‘నేనూ’)
  rationale: గ్రీకులో కర్త సర్వనామం స్పష్టంగా, ఉద్ఘాటనతో ఉంది. తెలుగులో ‘తండ్రీ’తో అనుసంధానించడానికి సహజమైన ‘నేనూ’ రూపాన్ని వాడాం.
- source_word: καὶ
  choice: -ూ
  rationale: రెండు కర్తలను సమన్వయపరిచే సాధారణ గ్రీకు సంధానాన్ని తెలుగులో సహజమైన సముచ్చయ ప్రత్యయం ‘-ూ’ ద్వారా వ్యక్తం చేశాం.
- source_word: ὁ πατὴρ
  choice: తండ్రి (సంధి రూపంలో ‘తండ్రీ’)
  rationale: యోహాను సందర్భంలో ఇది యేసు తండ్రిని సూచించే బిరుదాత్మక వ్యక్తిగత సంబోధన. తెలుగులో సహజమైన ‘తండ్రి’ని ఎంచుకుని, సముచ్చయంలో ‘తండ్రీ’గా ఇచ్చాం.
- source_word: ἕν
  choice: ఒక్కటిగా
  rationale: నపుంసక ఏకవచనమైన ἕν నిజమైన ఏకత్వాన్ని తెలియజేస్తుంది; యేసు, తండ్రి ఒకే వ్యక్తి అని చెప్పదు. ‘ఒక్కటిగా’ తెలుగు వాక్యంలో సహజంగా ఉండి ఈ అర్థాన్ని నిలుపుతుంది.
- source_word: ἐσμεν
  choice: ఉన్నాం
  rationale: మొదటి పురుష బహువచన వర్తమాన క్రియ. ‘ఉన్నాం’ యేసు, తండ్రి మధ్య భేదాన్ని బహువచనంలో నిలుపుతూ వారి ఏకత్వాన్ని ప్రకటిస్తుంది.
theological_decisions:
- issue: నపుంసక ἕν మరియు బహువచన ἐσμεν కలయికలోని క్రీస్తు సంబంధమైన అర్థం
  choice: ‘నేనూ తండ్రీ ఒక్కటిగా ఉన్నాం’ అని నిజమైన ఏకత్వాన్ని ప్రకటిస్తూ, ఇద్దరి వ్యక్తిగత భేదాన్ని బహువచన క్రియ ద్వారా నిలుపడం.
  alternative: ‘నేనూ తండ్రీ ఒకే వ్యక్తిమి’ లేదా ‘నేనూ తండ్రీ ఒకే అభిప్రాయంతో ఉన్నాం.’
  rationale: గ్రీకు నపుంసక ‘ఒకటి’ని వ్యక్తులను కూలదోసే ‘ఒకే వ్యక్తి’గా మార్చకూడదు; అలాగే దానిని కేవలం అభిప్రాయసామ్యానికి బలహీనపరచకూడదు. మూలంలోని ఏకత్వం–భేదం ఉద్వేగాన్ని అనువాదం అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన నిర్మాణం. ‘ఒక్కటిగా ఉన్నాం’ మూలంలోని నపుంసక ఏకత్వపదం మరియు బహువచన క్రియ రెండింటినీ స్పష్టంగా ప్రతిబింబిస్తుంది.
