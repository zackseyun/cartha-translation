id: JHN.10.9
reference: John 10:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ θύρα· δι’ ἐμοῦ ἐάν τις εἰσέλθῃ σωθήσεται καὶ εἰσελεύσεται καὶ ἐξελεύσεται καὶ νομὴν εὑρήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/009.yaml
  text: I am the door. If anyone enters through me[a], he will be saved, and will go in and go out and find pasture.
translation:
  language: te
  text: “నేనే ద్వారం.[a] ఎవరైనా నా ద్వారా లోపలికి ప్రవేశిస్తే, వారు రక్షించబడతారు; లోపలికి వస్తారు, బయటికి వెళ్తారు, మేతభూమిని కనుగొంటారు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గేటు.” గ్రీకు పదం తలుపును లేదా గేటును సూచించగలదు; మరింత నేరమైన పదార్థం కావడంతో ప్రధాన పాఠ్యంలో “ద్వారం” ఉంచాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: ద్వారం
  rationale: θύρα ప్రాథమికంగా తలుపు లేదా ప్రవేశద్వారాన్ని సూచిస్తుంది. యోహాను 10లోని గొర్రెల కాపరి దృశ్యంలో ‘గేటు’ కూడా సందర్భోచితమే అయినా, ‘ద్వారం’ మూలపదానికి నేరమైన, సహజమైన తెలుగు సమానార్థకం; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: δι’ ἐμοῦ
  choice: నా ద్వారా
  rationale: జనిటివ్‌తో διά సాధనం లేదా మాధ్యమాన్ని తెలియజేస్తుంది. ‘నా ద్వారా’ యేసే ప్రవేశానికి మార్గమని సహజంగా తెలియజేస్తుంది.
- source_word: ἐάν τις εἰσέλθῃ
  choice: ఎవరైనా ... లోపలికి ప్రవేశిస్తే
  rationale: ἐάν + ఏఓరిస్ట్ సబ్జంక్టివ్ సాధారణ షరతును, τις నిర్దిష్టతలేని విస్తృత పరిధిని సూచిస్తాయి. ఈ తెలుగు రూపం ఆ రెండింటినీ నిలుపుతుంది.
- source_word: σωθήσεται
  choice: రక్షించబడతారు
  rationale: σῴζωలో రక్షించడం, విడిపించడం అనే భావాలు ఉన్నాయి. ఇక్కడ ‘రక్షించబడతారు’ యోహాను సువార్తలోని విస్తృత రక్షణార్థాన్ని నిలుపుతూ, దాన్ని కేవలం భౌతిక భద్రతకు పరిమితం చేయదు.
- source_word: εἰσελεύσεται καὶ ἐξελεύσεται
  choice: లోపలికి వస్తారు, బయటికి వెళ్తారు
  rationale: ఈ జతచేయబడిన కదలికను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, దానిలోని స్వేచ్ఛ లేదా భద్రత భావాన్ని అనువాదంలో అదనంగా వివరణ చేయకుండా ఉంచుతుంది.
- source_word: νομὴν
  choice: మేత
  rationale: νομή మేత లేదా మేతభూమిని సూచిస్తుంది. గొర్రెల సందర్భంలో ‘మేత’ సంక్షిప్తంగా, సహజంగా ఉండి మూలార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: εὑρήσει
  choice: కనుగొంటారు
  rationale: εὑρίσκω యొక్క సరళమైన అర్థం ‘కనుగొను’; మూలంలోని నేరమైన ప్రకటనను ఇది నిలుపుతుంది.
theological_decisions:
- issue: గొర్రెల కాపరి సందర్భంలో θύρα రూపకం
  choice: ద్వారం
  alternative: గేటు
  rationale: ‘ద్వారం’ గ్రీకు రూపకానికి నేరమైన పదసామ్యాన్ని, యేసు పలికిన ‘నేనే’ ప్రకటన రూపాన్ని నిలుపుతుంది. గొర్రెల దొడ్డి సందర్భంలో ‘గేటు’ సాధ్యమైన అర్థం కాబట్టి దాన్ని పాదటిప్పణిలో ఇచ్చాం; ప్రధాన పాఠ్యంలో ఒక వ్యాఖ్యానాన్ని బలవంతంగా స్థిరపరచలేదు.
- issue: σωθήσεται యొక్క భావపరిధి
  choice: రక్షించబడతారు
  alternative: కాపాడబడతారు; విడిపించబడతారు
  rationale: ఈ రూపం వాక్యాన్ని కేవలం శారీరక కాపుదలకు పరిమితం చేయకుండా, అలాగే ఒక నిర్దిష్ట సిద్ధాంత సూత్రంగా విస్తరించకుండా, యోహాను సువార్తలోని రక్షణ భావ విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘ఎవరైనా’కు అనుసంధానంగా లింగాన్ని నిర్దేశించని సహజమైన ‘వారు’ రూపాన్ని వాడాం. మూలంలోని వరుస క్రియలను స్పష్టంగా నిలుపుతూ, అధిక ప్రాచీన రూపాలైన ‘ద్వారమును’, ‘ప్రవేశించినయెడల’ వంటివి నివారించాం.
