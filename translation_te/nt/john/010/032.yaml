id: JHN.10.32
reference: John 10:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Πολλὰ ⸂ἔργα καλὰ ἔδειξα ὑμῖν⸃ ἐκ τοῦ ⸀πατρός· διὰ ποῖον αὐτῶν ἔργον ⸂ἐμὲ λιθάζετε⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/032.yaml
  text: Jesus answered them[a], “I showed you many good works from the Father[b]; for which of them are you stoning me?”
translation:
  language: te
  text: 'యేసు వారికి ఇలా జవాబిచ్చాడు: “తండ్రి[b] నుండి ఎన్నో మంచి కార్యాలను మీకు చూపించాను. వాటిలో ఏ కార్యం కారణంగా[a] మీరు నన్ను రాళ్లతో కొడుతున్నారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటిలో ఏ కార్యాన్ని బట్టి.”
    reason: lexical_alternative
  - marker: b
    text: కొన్ని అనువాదాల్లో “నా తండ్రి” అని ఉంది; అయితే ఇక్కడి గ్రీకు పాఠంలో “తండ్రి” అని మాత్రమే ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: జవాబిచ్చాడు
  rationale: సంభాషణలో ప్రతిస్పందనను తెలిపే సహజమైన ఆధునిక తెలుగు రూపం; గ్రీకు కథన క్రియ యొక్క సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: Πολλὰ ἔργα καλὰ
  choice: ఎన్నో మంచి కార్యాలను
  rationale: యోహాను సువార్తలో ἔργα యేసు చేసిన క్రియలను, సూచక కార్యాలను కూడా సూచించగలదు. ‘మంచి కార్యాలు’ వాటి మేలు మరియు ప్రశంసనీయ స్వభావాన్ని నిలుపుతుంది.
- source_word: ἔδειξα
  choice: మీకు చూపించాను
  rationale: ‘చూపించాను’ గ్రీకు క్రియ యొక్క ప్రత్యక్ష భావాన్ని కాపాడుతూ, ఆ కార్యాలను వారి ఎదుట వెల్లడించాడనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐκ τοῦ πατρός
  choice: తండ్రి నుండి
  rationale: మూలం లేదా ఉద్భవాన్ని సూచించే ἐκ భావాన్ని నిలుపుతుంది. గ్రీకులో లేని ‘నా’ అనే స్వామ్యపదాన్ని చేర్చలేదు.
- source_word: διὰ ποῖον αὐτῶν ἔργον
  choice: వాటిలో ఏ కార్యం కారణంగా
  rationale: διά + accusative ఇక్కడ కారణం లేదా ఆధారాన్ని సూచిస్తుంది. αὐτῶν ముందున్న అనేక కార్యాలను సూచించగా, ఏకవచన ἔργονను ‘ఏ కార్యం’గా స్పష్టంగా నిలిపింది.
- source_word: λιθάζετε
  choice: మీరు నన్ను రాళ్లతో కొడుతున్నారు
  rationale: రాళ్లతో కొట్టడాన్ని సూచించే క్రియను ప్రత్యక్షంగా అనువదించింది. ‘చంపడానికి ప్రయత్నిస్తున్నారు’ వంటి మూలంలో స్పష్టంగా లేని ఉద్దేశాన్ని చేర్చకుండా వర్తమాన చర్య భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యేసు మాటల్లో ‘తండ్రి’ అనే సంబోధన
  choice: ‘తండ్రి నుండి’ అని మాత్రమే ఉంచడం
  alternative: ‘నా తండ్రి నుండి’
  rationale: గ్రీకు పాఠంలో μου (‘నా’) లేదు. సందర్భం యేసుకు తండ్రితో ఉన్న సంబంధాన్ని తెలియజేసినా, అనువాదం మూలపాఠం కంటే ఆ సంబంధ ప్రకటనను బలపరచకుండా నిజమైన పదరూపాన్ని నిలుపుతుంది.
- issue: రాళ్లతో కొట్టడం జరుగుతున్నదా లేక ప్రయత్నంగా ఉందా
  choice: ‘రాళ్లతో కొడుతున్నారు’ అనే వర్తమాన రూపం
  alternative: ‘రాళ్లతో కొట్టడానికి ప్రయత్నిస్తున్నారు’
  rationale: గ్రీకు వర్తమాన క్రియ చర్యను లేదా తక్షణ ఉద్దేశాన్ని సందర్భంలో సూచించగలదు. ‘ప్రయత్నిస్తున్నారు’ అని స్పష్టీకరించడం వ్యాఖ్యాత్మకమవుతుంది కాబట్టి మూలంలోని ఉద్రిక్తతను అలాగే ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవభరితమైన సంభాషణ శైలిని ఉపయోగించాం. ‘కార్యాలు,’ ‘తండ్రి నుండి’ వంటి పదబంధాలు యోహాను సువార్తలోని భావగాంభీర్యాన్ని కాపాడుతాయి; వాక్య నిర్మాణం సాధారణ పాఠకులకు సులభంగా ఉండేలా ఉంచాం.
