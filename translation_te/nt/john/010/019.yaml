  text: ⸀Σχίσμα πάλιν ἐγένετο ἐν τοῖς Ἰουδαίοις διὰ τοὺς λόγους τούτους.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/019.yaml
  text: Because of these words[a], a division arose again among the Jews.
translation:
  language: te
  text: ఈ మాటల కారణంగా యూదుల[a] మధ్య మళ్లీ విభేదం ఏర్పడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యూదయవాసుల.’ యోహాను సువార్తలోని కొన్ని సందర్భాల్లో ‘యూదా నాయకుల’ అని కూడా అర్థం కావచ్చు. ఇక్కడ ‘యూదులు’ అనే అనువాదం గ్రీకు పదప్రయోగాన్ని ప్రతిబింబిస్తుంది; అయితే యోహాను సువార్తలో ఈ పదం తరచుగా యూద ప్రజలందరినీ కాకుండా, సందర్భంలోని ఒక నిర్దిష్ట వర్గాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σχίσμα
  choice: విభేదం
  rationale: ఈ సందర్భంలో ప్రజలు భిన్న వర్గాలుగా విడిపోయిన ప్రతిస్పందనను సూచిస్తుంది. ఆధునిక తెలుగులో ‘విభేదం’ సహజంగాను గౌరవప్రదంగాను ఉంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: ఇంతకుముందు కూడా ఇలాంటి విభేదం ఏర్పడిందనే పునరావృత భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐγένετο
  choice: ఏర్పడింది
  rationale: విభేదం ఉనికిలోకి వచ్చిందనే సంఘటనాత్మక భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: యూదుల మధ్య
  rationale: గ్రీకు పదబంధానికి నేరమైన అర్థాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, యోహాను సువార్తలో ఈ పదం సందర్భానుసారంగా కలిగే పరిమిత అర్థాలను పాదసూచికలో తెలియజేస్తుంది.
- source_word: διὰ
  choice: కారణంగా
  rationale: అక్యూసేటివ్‌తో వాడిన διά ఇక్కడ కారణాన్ని సూచిస్తుంది; ‘కారణంగా’ దానిని సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది.
- source_word: τοὺς λόγους τούτους
  choice: ఈ మాటల
  rationale: యేసు అంతకుముందు పలికిన మాటలను సూచిస్తుంది; ‘మాటలు’ సాధారణ పాఠకులకు సహజమైన, నేరమైన అనువాదం.
theological_decisions:
- issue: యోహాను సువార్తలో Ἰουδαῖοι పదం సూచించే వర్గం
  choice: ప్రధాన పాఠ్యంలో ‘యూదులు’ అని అనువదించి, సందర్భానుసారమైన అర్థపరిధిని పాదసూచికలో వివరించడం
  alternative: ‘యూదయవాసులు’ లేదా ‘యూదా నాయకులు’
  rationale: మూలంలోని పదప్రయోగాన్ని నిలుపుతూనే, అది యూద ప్రజలందరినీ సమష్టిగా తప్పనిసరిగా సూచించదనే సందర్భపరమైన ఉద్రిక్తతను పరిష్కరించకుండా స్పష్టపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని కారణం, పునరావృతం, విభేదం ఏర్పడిన భావాలను సహజమైన తెలుగు పదక్రమంలో అందించింది.
