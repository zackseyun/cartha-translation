- from: అక్కడ అనేకులు ఆయనను విశ్వసించారు.
  to: అక్కడ అనేకులు ఆయనపై విశ్వాసం ఉంచారు.
  rationale: Replaced the potentially ambiguous object construction with an idiomatic Telugu expression that preserves the Greek πιστεύω εἰς αὐτόν as faith directed toward Jesus. No footnote is needed for this brief, undisputed narrative statement.
  reviewer_model: gpt-5.6-terra
