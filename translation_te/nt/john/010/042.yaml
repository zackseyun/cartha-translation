  yaml_path: translation/nt/john/010/042.yaml
  text: And many believed in him there.
translation:
  language: te
  text: అక్కడ అనేకులు ఆయనపై విశ్వాసం ఉంచారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: అంతర్లీన కథన అనుసంధానం
  rationale: తెలుగులో ఈ చిన్న ముగింపు వాక్యానికి ‘మరియు’ అని ప్రారంభించడం సహజంగా ఉండదు. ముందు వచనంతో ఉన్న సాధారణ అనుసంధానం వాక్యక్రమంలోనే స్పష్టంగా ఉంటుంది.
- source_word: πολλοὶ
  choice: అనేకులు
  rationale: వ్యక్తులను సూచించే substantival విశేషణాన్ని సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐπίστευσαν
  choice: విశ్వసించారు
  rationale: πιστεύω అనే క్రియలోని నమ్మకం/విశ్వాసం భావాన్ని నేరుగా తెలియజేస్తుంది; కేవలం aorist రూపం ఆధారంగా ‘విశ్వసించడం మొదలుపెట్టారు’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: εἰς αὐτόν
  choice: ఆయనను
  rationale: ‘విశ్వసించు’ క్రియతో వ్యక్తిని కర్మరూపంలో ఉంచడం సహజమైన తెలుగు వాడుక; ఇది యేసువైపు దిశాన్వితమైన వ్యక్తిగత విశ్వాసాన్ని తెలుపుతుంది.
- source_word: ἐκεῖ
  choice: అక్కడ
  rationale: సంఘటన జరిగిన స్థలాన్ని సూచించే గ్రీకు స్థానవాచక క్రియావిశేషణానికి సహజమైన తెలుగు సమానం; మూలంలోని స్థల ప్రాధాన్యాన్ని నిలుపుతుంది.
theological_decisions:
- issue: πιστεύω εἰς αὐτόν అనే పదబంధాన్ని రక్షణ సంబంధమైన విశ్వాస సందర్భంలో అనువదించడం
  choice: ఆయనను విశ్వసించారు
  alternative: ఆయనపై విశ్వాసముంచారు
  rationale: ఈ ఎంపిక యేసువైపు దిశాన్వితమైన నమ్మకాన్ని సహజమైన తెలుగులో నిలుపుతుంది. ‘ఆయనపై విశ్వాసముంచారు’ కూడా సాధ్యమే కాని కొంత వివరణాత్మకంగా ఉంటుంది; ‘ఆయనను విశ్వసించారు’ మూలంలోని సాధారణ πιστεύω పదజాలానికి మరింత నేరుగా సరిపోతుంది.
translation_notes:
  register: సంక్షిప్తమైన, ఆధునిక ప్రామాణిక తెలుగు. వాక్యం గౌరవప్రదంగా, సాధారణ పాఠకులకు సులభంగా ఉంది. పాదటీపులు అవసరం లేదు.
