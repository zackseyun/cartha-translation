revisions:
- from: ఆయన పస్కా పండుగ సమయంలో యెరూషలేములో ఉన్నప్పుడు, ఆయన చేస్తున్న సూచక క్రియలను చూస్తూ చాలామంది ఆయన నామంలో విశ్వాసముంచారు.[a]
  to: ఆయన పస్కా పండుగ సమయంలో యెరూషలేములో ఉన్నప్పుడు, ఆయన చేస్తున్న సూచక కార్యాలను[b] చూస్తూ చాలామంది ఆయన నామంపై[a] విశ్వాసం ఉంచారు.
