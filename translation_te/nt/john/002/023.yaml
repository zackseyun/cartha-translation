  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις ἐν τῷ πάσχα ἐν τῇ ἑορτῇ, πολλοὶ ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ, θεωροῦντες αὐτοῦ τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/023.yaml
  text: When he was in Jerusalem at the Passover[a], during the feast[b], many believed in his name as they were seeing the signs that he was doing.
translation:
  language: te
  text: ఆయన పస్కా పండుగ సమయంలో యెరూషలేములో ఉన్నప్పుడు, ఆయన చేస్తున్న సూచక కార్యాలను[b] చూస్తూ చాలామంది ఆయన నామంపై[a] విశ్వాసం ఉంచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆయన నామంపై విశ్వాసం ఉంచారు.” ఇది ఆయన వెల్లడైన వ్యక్తిత్వంపై ఉంచిన నమ్మకాన్ని సూచించే యోహాను శైలిలోని వ్యక్తీకరణ. “ఆయనలో విశ్వాసం ఉంచారు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “సూచక కార్యాలు” అనేది యేసు ఎవరో తెలియజేసే కార్యాలకు యోహాను ప్రత్యేకంగా వాడే పదం; కొందరు దీనిని “అద్భుత సూచనలు” అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις
  choice: ఆయన ... యెరూషలేములో ఉన్నప్పుడు
  rationale: ὡς δέ యొక్క కాలసంబంధ భావాన్ని సహజమైన తెలుగు ఉపవాక్యంతో తెలియజేస్తూ, కథనంలోని స్వల్ప కొనసాగింపును ప్రత్యేక అవ్యయాన్ని చేర్చకుండా సందర్భానికే వదిలింది.
- source_word: ἐν τῷ πάσχα ἐν τῇ ἑορτῇ
  choice: పస్కా పండుగ సమయంలో
  rationale: రెండు గ్రీకు పదబంధాలు ఒకే పండుగ సందర్భాన్ని సూచిస్తాయి; తెలుగులో అనవసర పునరుక్తి లేకుండా వాటి సంయుక్త భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ
  choice: ఆయన నామంలో విశ్వాసముంచారు
  rationale: యోహాను వాడే ‘నామంలో విశ్వసించడం’ అనే ప్రత్యేక రూపాన్ని నిలుపుతూ, ఆయన వెల్లడైన వ్యక్తిత్వంపై ఉంచిన నమ్మకాన్ని సూచిస్తుంది.
- source_word: θεωροῦντες
  choice: చూస్తూ
  rationale: ప్రధాన క్రియతో సమకాలంగా కొనసాగిన పరిశీలనను సహజమైన తెలుగు అసమాపక క్రియతో వ్యక్తం చేస్తుంది.
- source_word: τὰ σημεῖα ἃ ἐποίει
  choice: ఆయన చేస్తున్న సూచక క్రియలను
  rationale: σημεῖα కేవలం అద్భుతాలు కాక, యేసు ఎవరో సూచించే కార్యాలు అనే యోహాను భావాన్ని ‘సూచక క్రియలు’ నిలుపుతుంది; ‘చేస్తున్న’ అనే రూపం ἐποίει యొక్క కొనసాగుతున్న గత చర్య భావాన్ని సందర్భంలో అందిస్తుంది.
theological_decisions:
- issue: ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ వర్ణించే విశ్వాస స్వభావం
  choice: ‘చాలామంది ఆయన నామంలో విశ్వాసముంచారు’ అని నేరుగా అనువదించడం
  alternative: వారు కేవలం పైపైగా లేదా ప్రారంభ దశలో మాత్రమే నమ్మారని ఈ వచనంలోనే స్పష్టీకరించడం
  rationale: గ్రీకు వాక్యం వారి విశ్వాసాన్ని తగ్గించి చెప్పదు. తరువాతి వచనం దాని సమృద్ధి లేదా తగినతనంపై ఉద్వేగాన్ని సృష్టిస్తుంది; కాబట్టి ఈ వచనంలో ఆ ఉద్వేగాన్ని ముందుగానే పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పస్కా’ మరియు ‘యెరూషలేము’ వంటి స్థిరపడిన బైబిలు పేర్లను ఉపయోగించింది. మూలంలోని రెండు ముఖ్య యోహాను పదబంధాలను—‘నామంలో విశ్వాసం’, ‘సూచక క్రియలు’—వివరణాత్మకంగా కలిపేయకుండా నిలిపింది.
