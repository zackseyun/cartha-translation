  text: యేసు కూడా తన శిష్యులతో పాటు ఆ పెళ్లికి ఆహ్వానించబడ్డాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత మూలరూపానికి దగ్గరగా: “యేసు కూడా, ఆయన శిష్యులూ ఆ పెళ్లికి ఆహ్వానించబడ్డారు.”'
    reason: మూలంలోని యేసు మరియు ఆయన శిష్యుల సమన్వయాన్ని స్పష్టంగా చూపే ప్రత్యామ్నాయం; తెలుగులో సమన్వయించిన కర్తలకు బహువచన క్రియ సహజంగా ఉంటుంది.
lexical_decisions:
- source_word: ἐκλήθη
  choice: ఆహ్వానించబడ్డాడు
  rationale: సామాజిక వేడుకకు హాజరయ్యే సందర్భంలో καλέω యొక్క కర్మణి రూపం ‘పిలువబడ్డాడు’ కంటే సహజంగా ‘ఆహ్వానించబడ్డాడు’ అనే అర్థాన్నిస్తుంది.
- source_word: δὲ καὶ
  choice: కూడా
  rationale: δέ యొక్క స్వల్ప అనుసంధాన భావాన్ని, వెంటనే వచ్చే καί యొక్క చేర్పు భావంతో కలిపి ఆధునిక తెలుగులో సహజమైన ‘కూడా’ ద్వారా తెలిపింది.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: తన శిష్యులతో పాటు
  rationale: రెండవ καί యేసును ఆయన శిష్యులతో సమన్వయపరుస్తుంది; తెలుగులో ‘తన శిష్యులతో పాటు’ సహజంగా ఉండి, వారూ ఆహ్వానించబడ్డారనే భావాన్ని నిలుపుతుంది.
- source_word: εἰς τὸν γάμον
  choice: ఆ పెళ్లికి
  rationale: γάμος ఇక్కడ వివాహ వేడుకను సూచిస్తుంది. ముందు వచనంలో పేర్కొన్న వేడుక కావడంతో నిర్దిష్ట భావాన్ని ‘ఆ పెళ్లికి’ అని సహజంగా వ్యక్తపరిచింది.
