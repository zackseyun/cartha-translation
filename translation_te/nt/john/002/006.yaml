base_translation:
  language: en
  yaml_path: translation/nt/john/002/006.yaml
  text: There were six stone water jars standing there[a], in accordance with the Jewish rites of purification[b], each holding two or three measures.
translation:
  language: te
  text: యూదుల శుద్ధీకరణ ఆచారానికి అనుగుణంగా అక్కడ ఆరు రాతి నీటి బానలు ఉంచబడి ఉన్నాయి. ఒక్కొక్కటి రెండు లేదా మూడు కొలతలు[a] పట్టేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘కొలత’ (గ్రీకు: మెత్రేతేస్) ఒక ప్రాచీన ద్రవ పరిమాణం; అది సుమారు 35–40 లీటర్లకు సమానం.'
    reason: cultural_note
lexical_decisions:
- source_word: λίθιναι ὑδρίαι
  choice: రాతి నీటి బానలు
  rationale: λίθιναι పాత్రలు రాతితో చేసినవని, ὑδρίαι నీటిని ఉంచే పెద్ద పాత్రలని సూచిస్తుంది. ‘రాతి నీటి బానలు’ ఆధునిక తెలుగులో సహజంగా ఉండి పాత్ర రకాన్నీ పదార్థాన్నీ నిలుపుతుంది.
- source_word: ἦσαν δὲ ἐκεῖ ... κείμεναι
  choice: అక్కడ ... ఉంచబడి ఉన్నాయి
  rationale: δέ స్వల్ప కథన అనుసంధానాన్ని ఇస్తుంది; తెలుగులో ప్రత్యేక సంధానపదం లేకుండానే సహజంగా వ్యక్తమవుతుంది. ἐκεῖని ‘అక్కడ’గా, κείμεναιలోని అమర్చబడి ఉండే భావాన్ని ‘ఉంచబడి ఉన్నాయి’గా తెలిపాం.
- source_word: κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων
  choice: యూదుల శుద్ధీకరణ ఆచారం కోసం
  rationale: κατά ఇక్కడ ఆచారానికి అనుగుణంగా లేదా దాని ఉపయోగార్థంగా ఉన్న సంబంధాన్ని సూచించగలదు. సందర్భంలో పాత్రల ప్రయోజనం ప్రధానంగా ఉన్నందున ‘కోసం’ సహజంగా ఉంది; καθαρισμόςలోని ఆచారపరమైన శుద్ధి భావాన్ని ‘శుద్ధీకరణ ఆచారం’ తెలియజేస్తుంది.
- source_word: χωροῦσαι
  choice: పట్టేది
  rationale: ఇక్కడ χωρέω పాత్ర సామర్థ్యాన్ని సూచిస్తుంది. తెలుగు వాడుకలో పాత్ర ఎంత ద్రవాన్ని ఇముడ్చగలదో చెప్పడానికి ‘పట్టు’ సహజమైన పదం.
- source_word: ἀνὰ μετρητὰς δύο ἢ τρεῖς
  choice: ఒక్కొక్కటి రెండు లేదా మూడు కొలతలు
  rationale: ἀνάలోని పంపిణీ భావాన్ని ‘ఒక్కొక్కటి’ స్పష్టంగా వ్యక్తం చేస్తుంది. ప్రాచీన ప్రమాణాన్ని ప్రధాన పాఠ్యంలో ఆధునిక పరిమాణంగా అతిగా నిర్దిష్టం చేయకుండా μετρητήςను ‘కొలత’గా ఉంచాం.
theological_decisions:
- issue: τῶν Ἰουδαίων యొక్క సాంస్కృతిక-మతపరమైన సూచన
  choice: యూదుల శుద్ధీకరణ ఆచారం
  alternative: యూదయవాసుల శుద్ధీకరణ ఆచారం
  rationale: ఈ సందర్భంలో Ἰουδαίων ప్రాంతీయ గుర్తింపుకన్నా యూదుల ఆచారపరమైన శుద్ధి విధానాన్ని సూచిస్తుంది. అందువల్ల ‘యూదుల’ అనేది భావాన్ని స్పష్టంగా, అనవసరమైన వివాదార్థం లేకుండా అందిస్తుంది.
- issue: κατά ద్వారా వ్యక్తమయ్యే సంబంధం
  choice: ఆచారం కోసం
  alternative: ఆచారం ప్రకారం
  rationale: κατά అనుగుణత లేదా సంబంధిత ప్రయోజనం అనే భావాలను మోయగలదు. ఈ పాత్రలు శుద్ధీకరణ అవసరాలకు ఉంచబడ్డాయని సందర్భం సూచిస్తున్నందున ‘కోసం’ ఎంచుకున్నాం; అయితే మూలంలోని అర్థ పరిధిని సిద్ధాంతపరంగా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. ‘బానలు’ పెద్ద నీటి పాత్రలను సహజంగా సూచిస్తుంది. ప్రధాన పాఠ్యంలో ప్రాచీన ప్రమాణాన్ని అలాగే ఉంచి, అంచనా లీటర్ల పరిమాణాన్ని పాదసూచికలో ఇచ్చాం.
