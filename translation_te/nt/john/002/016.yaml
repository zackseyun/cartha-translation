id: JHN.2.16
reference: John 2:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τοῖς τὰς περιστερὰς πωλοῦσιν εἶπεν· Ἄρατε ταῦτα ἐντεῦθεν, μὴ ποιεῖτε τὸν οἶκον τοῦ πατρός μου οἶκον ἐμπορίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/016.yaml
  text: And he said to those selling the doves[a], “Take these things away from here; do not make my Father’s house a house of trade.”
translation:
  language: te
  text: 'పావురాలను అమ్ముతున్నవారితో ఆయన ఇలా చెప్పాడు: “వీటిని ఇక్కడి నుంచి తీసుకుపోండి; నా తండ్రి గృహాన్ని వ్యాపార గృహంగా చేయకండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιστερὰς
  choice: పావురాలు
  rationale: బలుల కోసం అమ్మబడే పక్షులను సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘పావురాలు’ సహజమైన, సాధారణంగా అర్థమయ్యే పదం.
- source_word: πωλοῦσιν
  choice: అమ్ముతున్నవారితో
  rationale: వర్తమాన కృదంతం వారి కొనసాగుతున్న వ్యాపార క్రియ ఆధారంగా ఆ గుంపును గుర్తిస్తుంది; ఈ తెలుగు రూపం ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: Ἄρατε
  choice: తీసివేయండి
  rationale: నిర్ణయాత్మక ఆజ్ఞను తెలియజేస్తుంది; వస్తువులను అక్కడి నుండి తొలగించాలనే చలన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ταῦτα
  choice: వీటిని
  rationale: నపుంసక బహువచన సూచక సర్వనామాన్ని అనవసరంగా నిర్దిష్టీకరించకుండా ఉంచుతుంది; సందర్భంలో పక్షులు లేదా వాటికి సంబంధించిన వస్తువులను సూచించవచ్చు.
- source_word: ἐντεῦθεν
  choice: ఇక్కడి నుండి
  rationale: ప్రస్తుత స్థలం నుండి తొలగింపును నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μὴ ποιεῖτε
  choice: చేయకండి
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞార్థక రూపంలోని నిషేధాన్ని నేరుగా నిలుపుతుంది; ‘మార్చకండి’ వంటి వ్యాఖ్యానాత్మక విస్తరణను నివారిస్తుంది.
- source_word: οἶκον τοῦ πατρός μου
  choice: నా తండ్రి గృహాన్ని
  rationale: μου అనే ఏకవచన స్వామ్యరూపంలో ఉన్న యేసు ప్రత్యేక పుత్ర సంబంధ ప్రకటనను తగ్గించకుండా నిలుపుతుంది; ఆలయ సూచన కూడా స్పష్టంగా ఉంటుంది.
- source_word: οἶκον ἐμπορίου
  choice: వ్యాపార గృహంగా
  rationale: ἐμπόριονలోని వాణిజ్య భావాన్ని అందిస్తూ, గ్రీకులోని ‘గృహం … గృహం’ అనే ఉద్దేశపూర్వక పదపునరుక్తిని తెలుగులోనూ నిలుపుతుంది.
theological_decisions:
- issue: ఆలయాన్ని యేసు ‘నా తండ్రి గృహం’ అని పేర్కొనడం
  choice: ‘నా తండ్రి గృహం’ అనే స్పష్టమైన ఏకవచన పుత్ర సంబంధ ప్రకటనను యథాతథంగా నిలుపడం
  alternative: ‘మన తండ్రి గృహం’ లేదా ‘దేవుని గృహం’
  rationale: గ్రీకు పాఠంలో πατρόςతో ఏకవచన స్వామ్యరూపమైన μου ఉంది. కాబట్టి యేసు వ్యక్తపరచిన ప్రత్యేక సంబంధాన్ని మృదువుచేయకుండా, అలాగే మూలపాఠానికి మించిన వివరణను చేర్చకుండా అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యనిర్మాణాన్ని ఉపయోగిస్తూ, ఆలయ సందర్భానికి తగిన గౌరవప్రద స్వరాన్ని నిలిపాం. ‘గృహం … గృహం’ అనే పునరుక్తి కొద్దిగా సాహిత్య ధోరణి కలిగినప్పటికీ సులభంగా అర్థమవుతుంది మరియు మూలంలోని వాక్చాతుర్యాన్ని కాపాడుతుంది.
