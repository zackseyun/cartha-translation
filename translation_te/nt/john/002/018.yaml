id: JHN.2.18
reference: John 2:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν οὖν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Τί σημεῖον δεικνύεις ἡμῖν, ὅτι ταῦτα ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/018.yaml
  text: So the Jews answered and said to him[a], “What sign do you show us, that you do these things?”
translation:
  language: te
  text: 'అందుకు యూదులు ఆయనతో ఇలా అన్నారు[a]: “నీవు ఈ పనులు చేస్తున్నావు కాబట్టి మాకు ఏ సూచన చూపిస్తావు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యూదు నాయకులు,” లేదా “యూదయులు.” యోహాను సువార్తలో “యూదులు” అనే మాట సందర్భాన్నిబట్టి యూదులందరినీ కాక, ప్రత్యేకంగా యూదయ ప్రాంతపు అధికారులను లేదా ఒక ప్రతినిధి వర్గాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν οὖν
  choice: అందుకు ... ఇలా అన్నారు
  rationale: οὖν తెలిపే ముందటి సంఘటనతో సంబంధాన్ని ‘అందుకు’ సహజంగా వ్యక్తం చేస్తుంది. ‘జవాబిచ్చి అన్నారు’ అనే కృత్రిమ పునరుక్తికి బదులు ἀπεκρίθησαν ... καὶ εἶπαν అనే గ్రీకు సంభాషణ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో కలిపి చెప్పింది.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: గ్రీకు పదబంధం పేర్కొన్న సమూహాన్ని ప్రధాన పాఠంలో వ్యాఖ్యానాత్మకంగా ‘నాయకులు’ అని కుదించకుండా నేరుగా ఉంచింది; యోహాను సందర్భంలో ఉండగల పరిమిత అర్థాన్ని పాదటిప్పణిలో తెలిపింది.
- source_word: Τί σημεῖον
  choice: ఏ సూచక క్రియను
  rationale: σημεῖον కేవలం అద్భుతం కాక, అధికారాన్ని ధ్రువీకరిస్తూ మరొక వాస్తవాన్ని సూచించే కార్యం. ‘సూచక క్రియ’ యోహాను రచనలోని ఈ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: δεικνύεις ἡμῖν
  choice: మాకు చూపిస్తావు
  rationale: ప్రత్యక్షంగా కనిపించే ధ్రువీకరణను కోరుతున్న సవాలును, దాతువు ἡμῖνను స్పష్టంగా ఉంచుతుంది.
- source_word: ὅτι ταῦτα ποιεῖς
  choice: నీవు ఈ పనులు చేయడానికి నీకు అధికారం ఉందని చూపించే
  rationale: ὅτι ఇక్కడ వారి ప్రశ్నకు ఆధారాన్ని—యేసు ఈ కార్యాలు చేయడాన్ని—తెలుపుతుంది. తెలుగులో అక్షరానువాదం అసహజంగా లేదా అస్పష్టంగా ఉండటంతో, సందర్భంలో అడుగుతున్న అధికార ధ్రువీకరణను స్పష్టంగా వ్యక్తం చేసింది.
theological_decisions:
- issue: యోహాను సువార్తలో οἱ Ἰουδαῖοι అనే పదబంధపు పరిధి
  choice: ప్రధాన పాఠంలో ‘యూదులు’ అని ఉంచడం
  alternative: ‘యూదు నాయకులు’ లేదా ‘యూదయులు’
  rationale: ఈ సందర్భం ఆలయ చర్యకు ప్రతిస్పందించే అధికార ప్రతినిధులను సూచించవచ్చు; అయినా గ్రీకు పాఠం నాయకులను ప్రత్యేకంగా పేర్కొనదు. కాబట్టి ప్రధాన పాఠం విస్తృత పదాన్ని నిలిపి, సందర్భానుసారమైన పరిమిత అర్థాలను పాదటిప్పణిలో ఇస్తుంది.
- issue: ὅτι యొక్క సంబంధం
  choice: ఈ పనులు చేయడానికి ఉన్న అధికారానికి సూచక క్రియను అడుగుతున్న ప్రశ్నగా సహజీకరించడం
  alternative: ‘నీవు ఈ పనులు చేస్తున్నావు గనుక’ లేదా ‘నీవు ఈ పనులు చేస్తున్నావని’
  rationale: ὅτι కారణం లేదా వారు సవాలు చేస్తున్న వాస్తవాన్ని పరిచయం చేయగలదు. అధికార భావం సందర్భం నుండి వస్తుంది; ఇది యేసు కార్యాలను సమర్థించే సూచనను కోరుతున్న ప్రశ్నను తెలుగులో స్పష్టంగా చేస్తుంది, అయితే ఏ నిర్దిష్ట సిద్ధాంతపరమైన అధికార నిర్మాణాన్నీ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకులోని ద్వంద్వ సంభాషణ సూత్రాన్ని తెలుగులో సహజంగా కుదించింది; ‘సూచక క్రియ’ ద్వారా యోహాను రచనలో σημεῖονకు ఉన్న ప్రత్యేక భావాన్ని నిలిపింది. పాదటిప్పణి గుర్తు [a] ప్రధాన పాఠంలో ఉంది.
