revisions:
- from: 'అందుకు యూదులు ఆయనతో ఇలా అన్నారు[a]: “నీవు ఈ పనులు చేయడానికి నీకు అధికారం ఉందని చూపించే ఏ సూచక క్రియను మాకు చూపిస్తావు?”'
  to: 'అందుకు యూదులు ఆయనతో ఇలా అన్నారు[a]: “నీవు ఈ పనులు చేస్తున్నావు కాబట్టి మాకు ఏ సూచన చూపిస్తావు?”'
  rationale: The revision removes the unstated proposition that Jesus has authority, while retaining the challenge’s causal basis through “నీవు ఈ పనులు చేస్తున్నావు కాబట్టి.” It uses “సూచన” for σημεῖον, preserving the Johannine term in natural modern Telugu. The footnote is retained because the referent of οἱ Ἰουδαῖοι may be contextually narrower than all Jewish people, though the Greek main text itself does not specify that narrowing.
