    issue: Redundant connective in the main text
    rationale: ὅτε οὖν is sufficiently represented by ‘కాబట్టి ... లేపబడినప్పుడు.’ The additional ‘అప్పుడు’ before the second clause is not required by the Greek and produces an unnecessarily doubled transition.
  - severity: low
    issue: Footnote b’s Telugu alternative is somewhat marked
    rationale: ‘చెబుతూ వచ్చారని’ can imply an extended prior course of speech. ‘చెబుతూ ఉన్నారని’ more directly expresses the ongoing/iterative possibility of the Greek imperfect without making the duration stronger than the source.
