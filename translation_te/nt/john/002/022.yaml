id: JHN.2.22
reference: John 2:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτε οὖν ἠγέρθη ἐκ νεκρῶν, ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι τοῦτο ἔλεγεν, καὶ ἐπίστευσαν τῇ γραφῇ καὶ τῷ λόγῳ ⸀ὃν εἶπεν ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/022.yaml
  text: So when he was raised from the dead, his disciples remembered that he had been saying this, and they believed the Scripture and the word that Jesus had spoken.
translation:
  language: te
  text: కాబట్టి ఆయన మృతులలోనుండి లేపబడినప్పుడు[a], ఆయన శిష్యులు ఆయన ఈ మాట చెప్పాడని[b] జ్ఞాపకం చేసుకున్నారు; వారు లేఖనాన్నీ యేసు చెప్పిన మాటనూ[c] నమ్మారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “మృతులలోనుండి లేచినప్పుడు.” గ్రీకులో క్రియ కర్మణి ప్రయోగంలో ఉంది: “లేపబడినప్పుడు.”'
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఈ మాట చెబుతూ ఉన్నారని.” గ్రీకు imperfect క్రియ గతంలో కొనసాగిన లేదా పునరావృతమైన మాటను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “మాటను” అనే పదాన్ని “ప్రకటనను” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: కాబట్టి ... అప్పుడు
  rationale: ὅτε యొక్క కాలసంబంధ భావాన్ని ‘అప్పుడు’ నిర్మాణంతో, οὖν యొక్క కథన కొనసాగింపు/నిగమన భావాన్ని ‘కాబట్టి’తో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἠγέρθη
  choice: లేపబడినప్పుడు
  rationale: క్రియలోని కర్మణి ప్రయోగాన్ని నిలుపుతూ, పునరుత్థాన సందర్భంలో ἐγείρω యొక్క సహజ భావాన్ని అందిస్తుంది.
- source_word: ἐκ νεκρῶν
  choice: మృతులలోనుండి
  rationale: గ్రీకు బహువచన నిర్మాణాన్ని కాపాడుతూ, పునరుత్థానానికి తెలుగులో స్పష్టమైన రూపం.
- source_word: ἐμνήσθησαν
  choice: జ్ఞాపకం చేసుకున్నారు
  rationale: గతంలో చెప్పబడినది తరువాత వారికి గుర్తుకు వచ్చిందనే భావాన్ని సహజంగా తెలుపుతుంది.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ఆయన శిష్యులు
  rationale: స్వామ్య సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὅτι τοῦτο ἔλεγεν
  choice: ఆయన ఈ మాట చెప్పారని
  rationale: సందర్భంలో గతంలో పలికిన మాటను నేరుగా, సహజంగా సూచిస్తుంది; imperfect రూపాన్ని తప్పనిసరిగా పునరావృత చర్యగా విస్తరించదు.
- source_word: ἐπίστευσαν
  choice: నమ్మారు
  rationale: లేఖనాన్ని మరియు యేసు మాటను సత్యమని అంగీకరించిన భావాన్ని అదనపు వ్యాఖ్యానం లేకుండా అందిస్తుంది.
- source_word: τῇ γραφῇ
  choice: లేఖనాన్ని
  rationale: ఏకవచన γραφήను అలాగే నిలుపుతూ పవిత్ర లేఖనాన్ని సూచిస్తుంది.
- source_word: τῷ λόγῳ
  choice: మాటను
  rationale: ఇక్కడ λόγος యేసు పలికిన నిర్దిష్ట వాక్యాన్ని సూచిస్తుంది; ‘మాట’ తెలుగులో సహజమూ సందర్భోచితమూ.
- source_word: ὃν εἶπεν ὁ Ἰησοῦς
  choice: యేసు చెప్పిన
  rationale: λόγοςను విశేషించే సంబంధ వాక్యాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పునరుత్థాన క్రియలోని కర్మణి ప్రయోగం
  choice: ఆయన ... లేపబడినప్పుడు
  alternative: ఆయన మృతులలోనుండి లేచినప్పుడు
  rationale: ἠγέρθη కర్మణి రూపం కాబట్టి ప్రధాన పాఠంలో దానిని నిలుపుతుంది; కార్యసాధకుని పేరును పాఠంలో లేనందున చేర్చదు.
- issue: πιστεύωకు దత్తివిభక్తి కర్మలు
  choice: లేఖనాన్ని, యేసు చెప్పిన మాటను నమ్మారు
  alternative: లేఖనంపై, యేసు చెప్పిన మాటపై విశ్వాసముంచారు
  rationale: ‘నమ్మారు’ అనేది తక్కువ వ్యాఖ్యానభారం గల సహజ రూపం; శిష్యులు లేఖనం మరియు యేసు మాట చెప్పినదాన్ని నమ్మారనే భావాన్ని నిలుపుతుంది.
- issue: ἔλεγεν అనే imperfect క్రియ యొక్క కాలవ్యాప్తి
  choice: చెప్పారని
  alternative: చెబుతూ వచ్చారని
  rationale: imperfect గతంలో కొనసాగిన లేదా పునరావృతమైన మాటను సూచించవచ్చు; అయితే ఈ సందర్భంలో ఒక్క ముందరి ప్రకటనను తిరిగి సూచించే అవకాశమూ ఉంది. ప్రధాన పాఠం అతివ్యాఖ్యానం చేయకుండా సహజ రూపాన్ని వాడి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన కథనశైలి. ‘లేఖనం’ అనే ఏకవచనాన్ని, పునరుత్థాన క్రియలోని కర్మణి రూపాన్ని నిలుపుకుంది; అనిశ్చితమైన imperfect భావాన్ని పాదసూచికలో సూచించింది.
