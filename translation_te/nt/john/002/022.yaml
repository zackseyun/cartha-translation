review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the passive force of ἠγέρθη (‘లేపబడినప్పుడు’), the resurrection expression ἐκ νεκρῶν, the singular γραφή (‘లేఖనం’), and the two coordinated objects of ἐπίστευσαν. The imperfect ἔλεγεν is rendered non-over-specifically in the main text, with an appropriate alternative retained in a footnote.
  naturalness: The Telugu is generally clear and modern. However, the paired ‘కాబట్టి ... అప్పుడు’ redundantly represents the single connective sequence ὅτε οὖν and makes the sentence slightly less direct. A semicolon better retains the Greek coordination without adding a distinct temporal transition.
  terminology: ‘మృతులలోనుండి,’ ‘లేఖనం,’ and ‘మాట’ are suitable modern-standard Telugu renderings in this context. The respectful narrative forms are appropriate. The imperfect alternative is more idiomatic as ‘చెబుతూ ఉన్నారని’ than ‘చెబుతూ వచ్చారని.’
  issues:
