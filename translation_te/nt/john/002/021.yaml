  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐκεῖνος δὲ ἔλεγεν περὶ τοῦ ναοῦ τοῦ σώματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/021.yaml
  text: But he was speaking about the temple of his body[a].
translation:
  language: te
  text: కానీ ఆయన తన శరీరమనే ఆలయం గురించి మాట్లాడుతూ ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన శరీరమనే పవిత్రస్థలం.’ ఇక్కడి గ్రీకు పదం naos; ఇది దేవాలయ ప్రాంగణమంతటికంటే ప్రత్యేకంగా దేవాలయంలోని అంతర్గత పవిత్రస్థలాన్ని తరచుగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: ఆయన
  rationale: సందర్భంలో ఈ సూచన సర్వనామం యేసును సూచిస్తుంది; ఆధునిక గౌరవప్రద తెలుగు వాడుకలో ‘ఆయన’ సహజంగా ఉంటుంది.
- source_word: δὲ
  choice: కానీ
  rationale: మునుపటి వచనంలోని అపార్థానికి, యేసు నిజంగా దేనిని గురించి మాట్లాడాడో తెలిపే వివరణకు మధ్య ఉన్న స్వల్ప వ్యత్యాసాన్ని చూపుతుంది.
- source_word: ἔλεγεν
  choice: మాట్లాడుతున్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న లేదా వివరణాత్మక చర్యను సహజమైన తెలుగు కథన శైలిలో నిలుపుతుంది.
- source_word: περὶ
  choice: గురించి
  rationale: పరిసరార్థంలో περί + షష్ఠీ విభక్తి అర్థమైన ‘గురించి’ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ναοῦ
  choice: ఆలయం
  rationale: ναός దేవాలయ సముదాయమంతటికంటే ప్రత్యేకంగా అంతర్గత పవిత్రస్థలాన్ని సూచించగలదు; ప్రధాన పాఠ్యంలో సహజమైన ‘ఆలయం’ను ఉంచి, సూక్ష్మార్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: σώματος
  choice: శరీరం
  rationale: ‘శరీరం’ మూలపదానికి నేరమైన, సందర్భానుకూలమైన సమానార్థకం; రూపకంలోని దైవశాస్త్రీయ ప్రాధాన్యాన్ని కాపాడుతుంది.
- source_word: αὐτοῦ
  choice: తన
  rationale: ఇది యేసు సొంత శరీరాన్ని సూచిస్తుంది; వాక్య కర్తనే తిరిగి సూచించడానికి తెలుగులో ‘తన’ సహజంగా, స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: యేసు శరీరాన్ని ఆలయంతో రూపకంగా గుర్తించడం
  choice: ‘తన శరీరమనే ఆలయం’ అని రూపక సంబంధాన్ని నేరుగా నిలుపడం
  alternative: ‘తన శరీరపు ఆలయం’ లేదా ‘ఆలయమైన తన శరీరం’
  rationale: గ్రీకు షష్ఠీ నిర్మాణంలోని రూపక గుర్తింపును వివరణాత్మక సిద్ధాంత విస్తరణ లేకుండా తెలియజేస్తుంది. ‘శరీరమనే ఆలయం’ ఆధునిక తెలుగులో సహజంగా ఉండి, యేసు శరీరమే ఉద్దేశించిన ఆలయమని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఆయన’ యేసుకు తగిన గౌరవ సూచక సర్వనామం; ‘శరీరమనే ఆలయం’ మూలంలోని రూపకాన్ని సాధారణ పాఠకునికి స్పష్టంగా ఉంచుతుంది.
