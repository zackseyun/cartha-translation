id: JHN.2.10
reference: John 2:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Πᾶς ἄνθρωπος πρῶτον τὸν καλὸν οἶνον τίθησιν, καὶ ὅταν ⸀μεθυσθῶσιν τὸν ἐλάσσω· σὺ τετήρηκας τὸν καλὸν οἶνον ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/010.yaml
  text: And he said to him[a], “Everyone sets out the good wine first, and when they have become drunk, then the inferior[b]. But you have kept the good wine until now.”
translation:
  language: te
  text: 'అతడు అతనితో ఇలా అన్నాడు: “ప్రతి ఒక్కరూ మొదట మంచి ద్రాక్షారసాన్ని వడ్డిస్తారు; వారు మత్తెక్కిన తర్వాత[a] తక్కువ నాణ్యతగల ద్రాక్షారసాన్ని వడ్డిస్తారు. కానీ నువ్వు మంచి ద్రాక్షారసాన్ని ఇప్పటివరకు ఉంచావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారు మత్తులో ఉన్నప్పుడు.” గ్రీకు క్రియ సాధారణంగా మద్యం వల్ల మత్తెక్కడాన్ని సూచిస్తుంది; కొన్ని అనువాదాలు దీనిని “బాగా తాగిన తర్వాత” అని మృదువుగా వ్యక్తం చేస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: అతడు అతనితో ఇలా అన్నాడు
  rationale: గ్రీకులో ఇది కథనాత్మక వర్తమాన కాలం; సహజమైన తెలుగు కథనశైలిలో భూతకాలంతో అనువదించబడింది. కర్తలు సందర్భం నుంచే గుర్తించబడతారు.
- source_word: Πᾶς ἄνθρωπος
  choice: ప్రతి ఒక్కరూ
  rationale: ఏకవచన సాధారణీకరణ మనుషులందరికీ వర్తించే ఆచారాన్ని సూచిస్తుంది; ‘ప్రతి ఒక్కరూ’ ఆధునిక తెలుగులో సహజంగా, లింగభేదం లేకుండా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: τὸν καλὸν οἶνον
  choice: మంచి ద్రాక్షారసాన్ని
  rationale: καλός ఇక్కడ నాణ్యతను సూచిస్తుంది. ‘మంచి’ అనేది తరువాతి నాసిరకం ద్రాక్షారసంతో ఉన్న వ్యత్యాసాన్ని నేరుగా నిలుపుతుంది.
- source_word: τίθησιν
  choice: వడ్డిస్తారు
  rationale: τίθημι ప్రాథమికంగా ‘పెట్టు/ఉంచు’ అయినా, విందు సందర్భంలో పానీయాన్ని అతిథులకు అందించడాన్ని తెలుగులో సహజంగా ‘వడ్డిస్తారు’ అంటారు.
- source_word: ὅταν μεθυσθῶσιν
  choice: అతిథులు మత్తెక్కిన తర్వాత
  rationale: μεθύω సాధారణంగా మద్యం వల్ల మత్తెక్కడాన్ని సూచిస్తుంది. అసలు వాక్యంలోని స్పష్టతను తగ్గించకుండా, గ్రీకు బహువచన కర్తను తెలుగు పాఠకునికి స్పష్టంచేయడానికి ‘అతిథులు’ చేర్చబడింది.
- source_word: τὸν ἐλάσσω
  choice: నాసిరకం ద్రాక్షారసాన్ని
  rationale: ἐλάσσων ఇక్కడ ముందున్న దానికంటే తక్కువ నాణ్యతగలదని సూచిస్తుంది. తెలుగులో కేవలం ‘తక్కువదాన్ని’ అనడం అసహజం కావడంతో సందర్భంలో అంతర్లీనంగా ఉన్న ‘ద్రాక్షారసం’ పునరుక్తి చేయబడింది.
- source_word: τετήρηκας
  choice: ఉంచావు
  rationale: పరిపూర్ణ కాలరూపం గతంలో దాచిపెట్టి ఇప్పటివరకు అందుబాటులో ఉంచిన ఫలితాన్ని సూచిస్తుంది; ‘ఉంచావు’ దీనిని సహజంగా తెలియజేస్తుంది.
- source_word: ἕως ἄρτι
  choice: ఇప్పటివరకు
  rationale: కథనంలోని ప్రస్తుత క్షణం వరకు అనే కాలపరిమితిని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: ద్రాక్షారస అద్భుత సందర్భంలో μεθυσθῶσιν పదాన్ని ఎలా అనువదించాలి
  choice: మత్తెక్కిన తర్వాత
  alternative: బాగా తాగిన తర్వాత / తృప్తిగా తాగిన తర్వాత
  rationale: μεθύω యొక్క సాధారణ అర్థం మత్తెక్కడం. నైతిక లేదా సిద్ధాంతపరమైన అసౌకర్యం కారణంగా దీనిని మృదువుగా మార్చలేదు. ఇది విందు నిర్వాహకుడు చెప్పిన సామాజిక పరిశీలన; వచనం మద్యపాన మత్తును సమర్థిస్తున్నదని అదనంగా తేల్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి. ‘ద్రాక్షారసం’ అనే పదం οἶνος యొక్క పానీయార్థాన్ని నిలుపుతుంది; ‘మత్తెక్కిన’ అనే పదం అసలు గ్రీకు పదబలాన్ని మృదువుచేయదు. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
