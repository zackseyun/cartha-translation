  text: Καὶ ἐγγὺς ἦν τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβη εἰς Ἱεροσόλυμα ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/013.yaml
  text: The Passover of the Jews was near[a], and Jesus went up to Jerusalem.
translation:
  language: te
  text: యూదుల పస్కా పండుగ సమీపంలో ఉంది[a], మరియు యేసు యెరూషలేముకు పైకి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదయవారి పస్కా పండుగ.’ యోహాను సువార్తలో Ἰουδαῖοι అనే పదం కొన్ని సందర్భాల్లో ‘యూదులు’ అని కాకుండా ‘యూదయవారు’ అని అర్థమివ్వవచ్చు; అయితే ఇక్కడ అది యూదుల పండుగను గుర్తిస్తున్నదనే అర్థమే అత్యంత సహజం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς ἦν
  choice: సమీపించింది
  rationale: ఇక్కడ కాలపరమైన సమీపతను సూచిస్తుంది. ‘సమీపించింది’ ఆధునిక తెలుగులో పండుగ దగ్గరపడిందనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πάσχα
  choice: పస్కా పండుగ
  rationale: యూదుల పస్కా ఉత్సవానికి తెలుగులో స్థిరపడిన పేరు; ‘పండుగ’ను చేర్చడం సాధారణ పాఠకునికి అర్థాన్ని స్పష్టం చేస్తుంది.
- source_word: τῶν Ἰουδαίων
  choice: యూదుల
  rationale: ఇక్కడ ఈ పదబంధం పస్కాను యూదుల పండుగగా గుర్తిస్తోంది. యోహాను రచనలో సాధ్యమైన ‘యూదయవారి’ అనే ప్రాంతీయ అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἀνέβη
  choice: వెళ్లాడు
  rationale: యెరూషలేముకు ప్రయాణించడాన్ని సూచించే సహజ తెలుగు రూపం. గ్రీకులోని ‘పైకి వెళ్లాడు’ అనే భౌగోళిక/యాత్రా నుడికారాన్ని తెలుగులో అక్షరార్థంగా ‘ఎక్కి వెళ్లాడు’ అని అనడం అసహజంగా ఉంటుంది.
- source_word: Ἱεροσόλυμα
  choice: యెరూషలేము
  rationale: పట్టణానికి తెలుగులో సంప్రదాయంగా స్థిరపడిన రూపం.
- source_word: Καὶ … καὶ
  choice: రెండు వాక్యాలుగా అనుసంధానం
  rationale: గ్రీకు καί కథనాన్ని కొనసాగించి రెండు విషయాలను కలుపుతుంది. తెలుగులో పూర్ణవిరామంతో వరుసగా చెప్పడం సహజం; కారణార్థక సంబంధాన్ని చేర్చలేదు.
theological_decisions:
- issue: యోహాను సువార్తలో Ἰουδαῖοι పదానికి అర్థం
  choice: యూదుల
  alternative: యూదయవారి
  rationale: ఈ సందర్భంలో అది ఒక ప్రాంతీయ లేదా విరోధి వర్గాన్ని కాకుండా పస్కా పండుగను యూదుల పండుగగా గుర్తించడం అత్యంత సహజం. అయినా మూలపదానికి యోహానులో కనిపించే ప్రాంతీయ అర్థసాధ్యతను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి. మూలంలో లేని ‘ఇప్పుడు’ లేదా కారణార్థకమైన ‘కాబట్టి’ చేర్చలేదు.
