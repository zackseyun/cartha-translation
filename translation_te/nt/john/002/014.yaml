  yaml_path: translation/nt/john/002/014.yaml
  text: And he found in the temple those selling oxen and sheep and doves[a], and the money changers sitting there.
translation:
  language: te
  text: ఆలయంలో ఎద్దులను, గొర్రెలను, పావురాలను అమ్ముతున్నవారినీ, కూర్చొని ఉన్న నాణాలు మార్చేవారినీ ఆయన కనుగొన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘ఆలయం’గా అనువదించిన గ్రీకు పదం ἱερόν; ఇది ప్రత్యేకంగా అంతరాలయాన్ని కాక, ఆలయ సముదాయాన్ని లేదా దాని ప్రాంగణాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν
  choice: చూశాడు
  rationale: εὑρίσκω ఇక్కడ యేసు ఆలయంలో ప్రవేశించి ఎదురుగా గమనించిన దృశ్యాన్ని సూచిస్తుంది. తెలుగు కథనంలో ‘కనుగొన్నాడు’ కంటే ‘చూశాడు’ సహజంగా ఉంటుంది; సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: ἱερῷ
  choice: ఆలయంలో
  rationale: ἱερόν అంతరాలయాన్ని మాత్రమే కాక ఆలయ సముదాయాన్ని లేదా ప్రాంగణాలను సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన ‘ఆలయం’ వాడి, విస్తృత స్థలార్థాన్ని పాదసూచికలో స్పష్టం చేశాం.
- source_word: πωλοῦντας
  choice: అమ్ముతున్నవారిని
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న అమ్మకపు చర్యను తెలియజేస్తుంది; ఈ తెలుగు రూపం ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: βόας
  choice: ఎద్దులను
  rationale: βοῦς పశువులను విస్తృతంగా సూచించగలిగినా, బలి జంతువుల సందర్భంలో ‘ఎద్దులు’ స్పష్టమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: πρόβατα
  choice: గొర్రెలను
  rationale: ఈ సందర్భంలో πρόβατα సాధారణంగా గొర్రెలనే సూచిస్తుంది.
- source_word: περιστερὰς
  choice: పావురాలను
  rationale: περιστερά పావురం/గువ్వ జాతి పక్షిని సూచిస్తుంది; బలి సందర్భంలో ‘పావురాలు’ ఆధునిక తెలుగులో సహజమైన పదం.
- source_word: κερματιστὰς
  choice: నాణాలు మార్చేవారిని
  rationale: κερματιστής నాణాలను లేదా కరెన్సీని మార్పిడి చేసే వ్యక్తి. ‘నాణాలు మార్చేవారు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: καθημένους
  choice: కూర్చొని ఉన్న
  rationale: వారి ఆసీన స్థితిని, అక్కడ స్థిరంగా వ్యాపారం చేస్తున్న దృశ్యాన్ని ఈ రూపం నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: యెరూషలేము ఆలయానికి సంబంధించి ἱερόν యొక్క పరిధి
  choice: ప్రధాన పాఠంలో ‘ఆలయం’; ఆలయ సముదాయం లేదా ప్రాంగణాలు అనే అర్థాన్ని పాదసూచికలో స్పష్టం చేయడం
  alternative: ఆలయ ప్రాంగణాల్లో; ఆలయ సముదాయంలో; పరిశుద్ధ స్థలంలో
  rationale: జంతువుల అమ్మకందారులు, నాణాలు మార్చేవారు ఉన్న కథన స్థలం అంతరాలయం కాక విస్తృత ఆలయ ప్రాంగణమని సూచిస్తుంది. సహజమైన ప్రధాన పాఠాన్ని ఉంచుతూ గ్రీకు పదంలోని స్థలభేదాన్ని పాదసూచిక కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన క్రమాన్ని ఉపయోగించాం. గౌరవప్రదమైన ‘ఆయన’ను వాడాం. ప్రధాన పాఠం సులభంగా ఉండేలా చేసి, ἱερόν యొక్క చారిత్రక-స్థలార్థ సూక్ష్మతను పాదసూచికలో నిలిపాం.
