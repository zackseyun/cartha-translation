id: JHN.2.5
reference: John 2:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει ἡ μήτηρ αὐτοῦ τοῖς διακόνοις· ⸂Ὅ τι⸃ ἂν λέγῃ ὑμῖν ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/005.yaml
  text: His mother said to the servants[a], “Whatever he tells you, do it.”
translation:
  language: te
  text: 'ఆయన తల్లి పరిచారకులతో ఇలా చెప్పింది: “ఆయన మీకు ఏది చెప్పినా, అది చేయండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτηρ αὐτοῦ
  choice: ఆయన తల్లి
  rationale: గ్రీకు షష్ఠీ విభక్తి నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తూ, కథలోని కుటుంబ సంబంధాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: διακόνοις
  choice: పరిచారకులతో
  rationale: వివాహ విందులో సేవ చేసే వారిని సూచిస్తుంది; సంఘ పదవిగా తర్వాత ఏర్పడిన ‘డీకనులు’ అనే అర్థాన్ని ఇక్కడ రుద్దదు. ‘పరిచారకులు’ సందర్భానికి తగిన, గౌరవప్రదమైన సాధారణ పదం.
- source_word: Ὅ τι ἂν
  choice: ఏమి … అయినా
  rationale: ἄνతో కూడిన అనిర్దిష్ట సంబంధవాచక నిర్మాణంలోని విస్తృత, ముందుగా నిర్దేశించని భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: λέγῃ ὑμῖν
  choice: మీతో … చెప్పినా
  rationale: వర్తమాన సుబ్జంక్టివ్ రూపంలోని అనిర్దిష్ట భావాన్ని తెలుగు షరతార్థక నిర్మాణం సహజంగా వ్యక్తం చేస్తుంది; ‘చెప్పవచ్చో’ అనే మరింత రూపసన్నిహిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: ποιήσατε
  choice: అది చేయండి
  rationale: బహువచన ఆజ్ఞను స్పష్టంగా తెలియజేస్తుంది. ‘అది’ అనేది ముందున్న ‘ఏమి’ని తిరిగి సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: λέγει
  choice: అని చెప్పింది
  rationale: గ్రీకులోని కథన వర్తమాన కాలాన్ని తెలుగు కథన శైలికి సహజమైన భూతకాలంతో అందిస్తుంది; మాట చెప్పిన కార్యార్థంలో మార్పు కలిగించదు.
theological_decisions:
- issue: ‘ఏమి చెప్పినా’ అనే వాక్యంలో అంతర్లీన కర్త ఎవరనేది
  choice: సందర్భంలో యేసును సూచించే ‘ఆయన’ అని అనువదించడం
  alternative: ‘యేసు మీతో ఏమి చెప్పినా’ అని పేరును స్పష్టంగా చేర్చడం
  rationale: గ్రీకులో కర్త అంతర్లీనంగా ఉన్నా, సందర్భం యేసునే సూచిస్తుంది. ‘ఆయన’ అనే సర్వనామం మూలంలోని సంక్షిప్తతను కాపాడి, అనవసరమైన వివరణాత్మక విస్తరణను నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అదే సమయంలో గౌరవప్రదమైన కథన శైలి పాటించబడింది. ‘పరిచారకులు’ అనే పదం వివాహ విందులో సేవ చేసేవారిని సూచిస్తుంది; సంఘ పదవిని కాదు.
