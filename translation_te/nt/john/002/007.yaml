  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలిని వాడాం. ‘నీరు’ కంటే సంభాషణలో సహజమైన ‘నీళ్లు’ రూపాన్ని ఎంచుకున్నాం; వాక్య నిర్మాణం సంక్షిప్తంగా ఉంచాం.
