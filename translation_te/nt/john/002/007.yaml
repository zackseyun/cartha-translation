language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Γεμίσατε τὰς ὑδρίας ὕδατος· καὶ ἐγέμισαν αὐτὰς ἕως ἄνω.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/007.yaml
  text: Jesus said to them[a], “Fill the water jars with water.” And they filled them to the brim.
translation:
  language: te
  text: యేసు వారితో, “ఈ నీళ్ల కుండలను నీళ్లతో నింపండి” అన్నాడు. వారు వాటిని పై అంచుల వరకు[a] నింపారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పైదాకా.”
    reason: ἕως ἄνω అనే గ్రీకు పదబంధాన్ని మరింత అక్షరార్థంగా ‘పైదాకా’ అని కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో కథన వర్తమాన కాలం (‘అంటున్నాడు’) ఉన్నప్పటికీ, ఆధునిక తెలుగు కథనశైలిలో భూతకాల రూపమైన ‘అన్నాడు’ సహజంగా ఉంటుంది; మూలంలోని కథన భావాన్ని కాపాడుతుంది.
- source_word: αὐτοῖς
  choice: వారితో
  rationale: యేసు ఎవరికీ ఆజ్ఞ ఇచ్చాడో తెలిపే బహువచన సర్వనామాన్ని తెలుగులో సహజంగా ‘వారితో’ అని వ్యక్తం చేశాం.
- source_word: Γεμίσατε
  choice: నింపండి
  rationale: ఇది బహువచన ప్రత్యక్ష ఆజ్ఞ. గౌరవ/బహువచన ఆజ్ఞారూపమైన ‘నింపండి’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: τὰς ὑδρίας
  choice: ఈ నీళ్ల కుండలను
  rationale: ὑδρία అంటే నీటిని ఉంచే కుండ. ముందటి వచనంలో పేర్కొన్న నిర్దిష్ట కుండలను సూచిస్తున్నందున తెలుగులో ‘ఈ’ చేర్చడం సహజమైన అనాఫొరిక్ వ్యక్తీకరణ; ‘రాతి’ అనే వివరాన్ని ఈ వచనంలో మళ్లీ చేర్చలేదు.
- source_word: ὕδατος
  choice: నీళ్లతో
  rationale: γεμίζω తరువాతి జనిటివ్ కుండల్లో నింపవలసిన పదార్థాన్ని సూచిస్తుంది; తెలుగులో సాధన/విషయార్థక రూపం ‘నీళ్లతో’ సహజం.
- source_word: ἐγέμισαν
  choice: నింపారు
  rationale: సేవకులు ఆ ఆజ్ఞను పూర్తిచేసిన సంఘటనను తెలిపే భూతకాల బహువచన రూపం.
- source_word: ἕως ἄνω
  choice: పై అంచుల వరకు
  rationale: ఈ పదబంధం ‘పైవరకు’ లేదా ‘అత్యున్నత స్థానం వరకు’ అనే భావాన్ని ఇస్తుంది. కుండల సందర్భంలో ‘పై అంచుల వరకు’ సంపూర్ణంగా నింపిన భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
