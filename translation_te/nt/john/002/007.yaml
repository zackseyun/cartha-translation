  source_fidelity: యేసు వారితో మాట్లాడినట్టు, బహువచన ఆజ్ఞను, కుండల్లో నీరు నింపడాన్ని, అలాగే అవి పై అంచుల వరకు నింపబడిన సంపూర్ణతను అనువాదం నమ్మకంగా తెలియజేస్తోంది. కథన వర్తమానమైన λέγειని తెలుగులో భూతకాల కథనరూపం ‘అన్నాడు’గా ఇవ్వడం సహజమైన, అర్థవంతమైన ఎంపిక.
