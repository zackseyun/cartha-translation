  text: καὶ ὑστερήσαντος οἴνου λέγει ἡ μήτηρ τοῦ Ἰησοῦ πρὸς αὐτόν· Οἶνον οὐκ ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/003.yaml
  text: And when the wine ran out[a], the mother of Jesus says to him[b], “They have no wine.”
translation:
  language: te
  text: 'ద్రాక్షారసం అయిపోయినప్పుడు[a], యేసు తల్లి ఆయనతో ఇలా అంటుంది[b]: “వారికి ద్రాక్షారసం లేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, ‘ద్రాక్షారసం లేకపోయినప్పుడు.’
    reason: lexical_alternative
  - marker: b
    text: 'గ్రీకులో ఇక్కడ చారిత్రక వర్తమాన కాలం వాడబడింది: ‘అంటుంది.’ కొన్ని అనువాదాలు దీనిని ‘అంది’ అని అనువదిస్తాయి.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστερήσαντος οἴνου
  choice: ద్రాక్షారసం అయిపోయినప్పుడు
  rationale: Aorist genitive absolute ప్రధాన క్రియకు నేపథ్యమైన సందర్భాన్ని సూచిస్తుంది. ‘అయిపోయినప్పుడు’ అనేది కొరత ఏర్పడిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: λέγει
  choice: అంటుంది
  rationale: గ్రీకు కథనంలోని historical present‌ను నిలుపుతూ, తెలుగులో సహజమైన వర్తమాన కథన రూపాన్ని ఉపయోగిస్తుంది.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: యేసు తల్లి
  rationale: గ్రీకు పదబంధాన్ని సంక్షిప్తంగా, సహజంగా అనుసరిస్తూ యోహాను ఈ సందర్భంలో ఆమెను సూచించిన విధానాన్ని నిలుపుతుంది.
- source_word: πρὸς αὐτόν
  choice: ఆయనతో
  rationale: మాట్లాడే క్రియతో కలిసి πρὸς αὐτόνను సహజమైన తెలుగు సంభాషణ నిర్మాణంలో ‘ఆయనతో’ అని వ్యక్తం చేస్తుంది.
- source_word: Οἶνον οὐκ ἔχουσιν
  choice: వారికి ద్రాక్షారసం లేదు
  rationale: బహువచన క్రియలోని కర్తను ‘వారు’ అని మాత్రమే సూచించి, అది ఆతిథ్యమిచ్చేవారినో పెళ్లివారినో స్పష్టీకరించకుండా మూలంలోని అస్పష్టతను కాపాడుతుంది.
- source_word: οἶνος
  choice: ద్రాక్షారసం
  rationale: తెలుగులో ద్రాక్షతో చేసిన wine‌ను సూచించే సాధారణ, గౌరవప్రదమైన పదం; సందర్భం అనుమతించని విధంగా అర్థాన్ని బలహీనపరచదు.
theological_decisions:
- issue: యోహాను కథనంలోని historical present
  choice: ‘అంటుంది’ అనే వర్తమాన రూపాన్ని నిలుపడం
  alternative: తెలుగు గతకాల కథనానికి అనుగుణంగా ‘అంది’ అని అనువదించడం
  rationale: ఇది ప్రధానంగా కథనశైలికి సంబంధించిన నిర్ణయం. వర్తమాన రూపం గ్రీకు పాఠంలోని సజీవ కథన ధోరణిని ప్రతిబింబిస్తుంది; పాదసూచిక ప్రత్యామ్నాయాన్ని తెలియజేస్తుంది.
- issue: ‘వారికి ద్రాక్షారసం లేదు’లోని అంతర్నిహిత బహువచన కర్త
  choice: ‘వారికి’ అని మాత్రమే ఉంచడం
  alternative: ‘విందు ఏర్పాటు చేసినవారికి’ లేదా ‘పెళ్లివారికి’ అని స్పష్టీకరించడం
  rationale: గ్రీకు పాఠం బహువచన కర్త ఎవరనేది స్పష్టంగా చెప్పదు. దానిని నిర్దిష్టం చేయకుండా ఉంచడం మూలంలోని సహజమైన అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని historical present‌ను ప్రధాన పాఠంలో నిలిపి, తెలుగులో సాధారణమైన గతకాల ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
