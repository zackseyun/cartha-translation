id: JHN.2.19
reference: John 2:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Λύσατε τὸν ναὸν τοῦτον καὶ ἐν τρισὶν ἡμέραις ἐγερῶ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/019.yaml
  text: Jesus answered and said to them[a], “Destroy this temple, and in three days I will raise it up.”
translation:
  language: te
  text: 'యేసు వారికి జవాబుగా ఇలా అన్నాడు: “ఈ ఆలయాన్ని పడగొట్టండి; మూడు రోజుల్లో నేను దాన్ని లేపుతాను[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ ఆలయాన్ని కూల్చివేయండి … నేను దాన్ని తిరిగి కడతాను.” “లేపుతాను” అని అనువదించిన గ్రీకు క్రియ ఈ సందర్భంలో పునరుత్థాన భావాన్ని కూడా ప్రతిధ్వనింపజేస్తుంది; యేసు తన శరీరమనే ఆలయం గురించి మాట్లాడాడని యోహాను తరువాత వివరిస్తాడు (2:21).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: జవాబుగా ఇలా అన్నాడు
  rationale: గ్రీకులోని రెండు క్రియల సమ్మిళిత వాక్యరీతిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; జవాబు ఇచ్చాడనే భావాన్నీ, పలికాడనే భావాన్నీ నిలుపుతుంది.
- source_word: Λύσατε
  choice: పడగొట్టండి
  rationale: ఇక్కడ λύω ఆలయాన్ని విడదీయడం లేదా ధ్వంసం చేయడాన్ని సూచిస్తుంది. ‘పడగొట్టండి’ నిర్మాణాన్ని కూల్చే సందర్భంలో సహజంగా ఉండి, ఆజ్ఞారూప బహువచనాన్ని నిలుపుతుంది.
- source_word: τὸν ναὸν τοῦτον
  choice: ఈ ఆలయాన్ని
  rationale: ναός ఆలయం లేదా దాని పవిత్ర మందిర భాగాన్ని సూచించగలదు. ఈ సందర్భంలో ‘ఆలయం’ సాధారణ పాఠకులకు సహజంగా ఉండి, యోహాను 2:21 వరకు అంతర్లీన సూచనను ముందుగానే వివరించదు.
- source_word: ἐν τρισὶν ἡμέραις
  choice: మూడు రోజుల్లో
  rationale: గ్రీకు కాలవ్యక్తీకరణలోని సహజ అర్థాన్ని సంక్షిప్తంగా తెలుపుతుంది; ఖచ్చితమైన కాలగణనను అనవసరంగా నిర్ణయించదు.
- source_word: ἐγερῶ αὐτόν
  choice: దాన్ని లేపుతాను
  rationale: ἐγείρωలో ఉన్న ‘లేపడం’ అనే ప్రాథమిక భావాన్నీ, పునరుత్థాన ప్రతిధ్వనినీ కాపాడుతుంది. ‘తిరిగి కడతాను’ అని అనువదిస్తే నిర్మాణార్థానికే పరిమితమవుతుంది.
theological_decisions:
- issue: ‘ఈ ఆలయం’ అనేది యేసు శరీరమని ఈ వచనంలోనే స్పష్టీకరించాలా?
  choice: ప్రధాన పాఠ్యంలో ‘ఈ ఆలయం’ అనే నిగూఢ వ్యక్తీకరణనే ఉంచడం.
  alternative: ‘నా శరీరమనే ఈ ఆలయాన్ని’ అని వివరణను చేర్చడం.
  rationale: యోహాను 2:21లోనే కథకుడు దాని అర్థాన్ని వివరిస్తాడు. ఇక్కడ ముందుగానే వివరణ చేరిస్తే కథనంలోని ఉద్దేశపూర్వక అస్పష్టత, ఉద్వేగం తొలగిపోతాయి.
- issue: ἐγερῶను నిర్మాణ సంబంధమైన పదంతోనా, పునరుత్థాన ప్రతిధ్వని గల పదంతోనా అనువదించాలి?
  choice: ‘లేపుతాను’ అని అనువదించడం.
  alternative: ‘తిరిగి కడతాను’ అని అనువదించడం.
  rationale: ‘లేపుతాను’ ఆలయ రూపకంలో అర్థవంతంగానే ఉండడంతో పాటు, తరువాత వెల్లడయ్యే యేసు పునరుత్థాన సూచనను కూడా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘జవాబుగా ఇలా అన్నాడు’ మూలంలోని ద్విక్రియా నిర్మాణాన్ని తెలుగు నుడికారానికి అనుగుణంగా అందిస్తుంది. ‘లేపుతాను’ ఉద్దేశపూర్వక ద్వంద్వార్థాన్ని కాపాడుతుంది.
