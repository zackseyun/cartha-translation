source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ἀντλήσατε νῦν καὶ φέρετε τῷ ἀρχιτρικλίνῳ· ⸂οἱ δὲ⸃ ἤνεγκαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/008.yaml
  text: And he said to them[b][a], “Draw some out now and take it to the master of the feast.” So they took it.
translation:
  language: te
  text: ఆయన వారితో, “ఇప్పుడు కొంత తోడి, విందు నిర్వాహకుని దగ్గరకు తీసుకెళ్లండి[a]” అని చెప్పాడు. అప్పుడు వారు దానిని తీసుకెళ్లారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విందు ప్రధాన పరిచారకుని దగ్గరకు” లేదా “విందు అధికారിയുടെ దగ్గరకు.” గ్రీకు పదం విందు నిర్వహణ బాధ్యత వహించే వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారు దానిని తీసుకొచ్చారు.” గ్రీకు క్రియను సందర్భంలోని దృష్టికోణాన్ని బట్టి ‘తీసుకెళ్లారు’ లేదా ‘తీసుకొచ్చారు’ అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: చెప్పాడు
  rationale: గ్రీకు వర్తమాన కాలం ఇక్కడ కథనంలోని చారిత్రక వర్తమానంగా ఉంది; సహజమైన తెలుగు కథనశైలిలో భూతకాల రూపం సరిపోతుంది.
- source_word: Ἀντλήσατε
  choice: కొంత తోడి
  rationale: ద్రవాన్ని తోడడాన్ని సూచించే ఆజ్ఞారూపం. సందర్భం ద్వారా తెలిసే పరిమాణాన్ని ‘కొంత’ సహజంగా వ్యక్తం చేస్తుంది; ద్రవం ఏమిటో అనవసరంగా నిర్ధారించదు.
- source_word: νῦν
  choice: ఇప్పుడు
  rationale: ఆజ్ఞ తక్షణమే అమలవ్వాలనే కాలార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: φέρετε
  choice: దగ్గరికి తీసుకెళ్లండి
  rationale: తోడిన ద్రవాన్ని విందును పర్యవేక్షించే వ్యక్తి వద్దకు చేర్చాలనే కదలికను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀρχιτρικλίνῳ
  choice: విందు పర్యవేక్షకుని
  rationale: విందు ఏర్పాట్లు, నిర్వహణ బాధ్యత వహించే వ్యక్తిని సూచించే గ్రీకు పదానికి స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగు రూపం.
- source_word: οἱ δὲ ἤνεγκαν
  choice: వారు దాన్ని తీసుకెళ్లారు
  rationale: δέ ఇక్కడ స్వల్ప అనుసంధానాన్ని ఇస్తుంది; ప్రత్యేక విరోధార్థం అవసరం లేదు. ἤνεγκαν మోసుకొని వెళ్లడం లేదా తీసుకురావడం అనే దృష్టికోణ భేదాన్ని అనుమతిస్తుంది. తెలుగులో ఆజ్ఞతో అనుసంధానంగా ‘తీసుకెళ్లారు’ సహజం; స్పష్టత కోసం ‘దాన్ని’ సందర్భానుసారంగా చేర్చబడింది.
