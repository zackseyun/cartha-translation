source:
  edition: SBLGNT
  text: ⸀ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι γεγραμμένον ἐστίν· Ὁ ζῆλος τοῦ οἴκου σου καταφάγεταί με.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/017.yaml
  text: His disciples remembered that it is written[a], “Zeal for your house will consume me.”
translation:
  language: te
  text: ఆయన శిష్యులు, “నీ ఇంటి పట్ల ఉన్న తపన నన్ను కబళిస్తుంది” అని వ్రాయబడి ఉందని జ్ఞాపకం చేసుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నన్ను కబళించింది.” ఇది కీర్తన 69:9లోని కొన్ని పాఠ సంప్రదాయాల పదప్రయోగాన్ని ప్రతిబింబిస్తుంది; అయితే ఇక్కడ యోహాను గ్రీకు పాఠంలో “నన్ను కబళిస్తుంది” అనే భవిష్యదర్థం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: జ్ఞాపకం చేసుకున్నారు
  rationale: ఈ సందర్భంలో శిష్యులు లేఖన వాక్యాన్ని గుర్తుచేసుకున్నారని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ఆయన శిష్యులు
  rationale: μαθηταίకి కొత్త నిబంధన సందర్భంలో స్థిరమైన, సహజమైన తెలుగు సమానార్థకం ‘శిష్యులు’; αὐτοῦను ‘ఆయన’గా స్పష్టంగా ఉంచాం.
- source_word: γεγραμμένον ἐστίν
  choice: వ్రాయబడి ఉన్నది
  rationale: లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే సూత్రప్రయోగాన్ని, పరిపూర్ణ క్రియ యొక్క కొనసాగుతున్న స్థితిని కాపాడుతూ తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ζῆλος
  choice: ఆసక్తి
  rationale: ఇక్కడ దేవుని ఇంటిపట్ల ఉన్న తీవ్రమైన అంకితభావాన్ని సూచిస్తుంది. ‘ఆసక్తి’ సాధారణ పాఠకులకు స్పష్టమైనది; ‘ఉత్సాహం’ కంటే అంతర్గత తపనను మెరుగుగా తెలియజేస్తుంది.
- source_word: τοῦ οἴκου σου
  choice: నీ ఇంటిపట్ల
  rationale: మూల ఉల్లేఖనంలోని ‘ఇల్లు’ అనే రూపకాన్ని కాపాడుతుంది; సందర్భానుసారంగా దేవాలయం ఉద్దేశించబడినా దానిని నేరుగా ‘దేవాలయం’గా మార్చలేదు.
- source_word: καταφάγεταί με
  choice: నన్ను దహించివేస్తుంది
  rationale: భవిష్యత్ భావాన్ని కాపాడుతూ, తీవ్రమైన ఆసక్తి వ్యక్తిని పూర్తిగా ఆవరించి క్షీణింపజేస్తుందనే రూపకాన్ని గంభీరమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: కీర్తన ఉల్లేఖనంలోని క్రియాకాలం యేసుకు అన్వయించబడటం
  choice: ‘దహించివేస్తుంది’ అనే భవిష్యదర్థాన్ని నిలుపుకున్నాం
  alternative: ‘దహించివేసింది’ / ‘మింగివేసింది’
  rationale: యోహాను గ్రీకు పాఠంలో καταφάγεταί భవిష్యత్ రూపంలో ఉంది. కొన్ని కీర్తన పాఠ సంప్రదాయాల్లో కనిపించే గతకాల భావంతో సమన్వయం చేయకుండా యోహాను వాడిన రూపాన్నే అనుసరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, లేఖన ఉల్లేఖనానికి తగిన గౌరవప్రదమైన శైలిని నిలుపుకుంది. ఉల్లేఖనంలో ‘ఇల్లు’ అనే మూల రూపకాన్ని కాపాడింది.
