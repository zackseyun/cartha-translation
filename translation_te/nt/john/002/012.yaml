id: JHN.2.12
reference: John 2:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μετὰ τοῦτο κατέβη εἰς Καφαρναοὺμ αὐτὸς καὶ ἡ μήτηρ αὐτοῦ καὶ οἱ ⸀ἀδελφοὶ καὶ οἱ μαθηταὶ αὐτοῦ, καὶ ἐκεῖ ἔμειναν οὐ πολλὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/012.yaml
  text: After this he went down to Capernaum[a], he and his mother and his brothers and his disciples, and they stayed there not many days.
translation:
  language: te
  text: దీని తర్వాత ఆయన తన తల్లితో, తన సహోదరులతో[a], తన శిష్యులతో కలిసి కపెర్నహూముకు దిగివెళ్లాడు. వారు అక్కడ ఎక్కువ రోజులు ఉండలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బంధువులతో,” “సన్నిహిత బంధువులతో”; గ్రీకు పదం సంకుచిత అర్థంలో సహోదరులను, కొన్ని సందర్భాల్లో విస్తృత కుటుంబ సంబంధాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: దీని తర్వాత
  rationale: సహజమైన ఆధునిక తెలుగు కాలసూచన; ఏకవచన సూచనార్థాన్ని నిలుపుతుంది.
- source_word: κατέβη
  choice: దిగివెళ్లాడు
  rationale: కానా నుండి కపెర్నహూముకు జరిగిన భౌగోళిక దిగువ ప్రయాణ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: εἰς Καφαρναοὺμ
  choice: కపెర్నహూముకు
  rationale: గమ్యస్థానాన్ని తెలుగులో సహజంగా సూచిస్తూ స్థలనామాన్ని లిప్యంతరీకరిస్తుంది.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: తన తల్లి
  rationale: మూలంలోని సంబంధాన్ని మాత్రమే తెలుపుతుంది; ఈ వచనంలో లేని ‘మరియ’ అనే పేరును చేర్చదు.
- source_word: οἱ ἀδελφοὶ
  choice: తన సహోదరులు
  rationale: వ్యాకరణపరంగా పుంలింగ బహువచనమైన పదానికి ప్రత్యక్ష సమానార్థం; విస్తృత బంధుత్వ అర్థసంభావ్యతను పాదటిప్పణిలో ఉంచింది.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: తన శిష్యులు
  rationale: యోహాను సువార్తలోని ముఖ్య పదాన్ని స్థిరంగా, గౌరవప్రదంగా అనువదిస్తుంది.
- source_word: ἐκεῖ ἔμειναν
  choice: వారు అక్కడ ... ఉండలేదు
  rationale: బహువచన క్రియ ద్వారా మొత్తం బృందమే అక్కడ ఉన్నదని స్పష్టం చేస్తుంది.
- source_word: οὐ πολλὰς ἡμέρας
  choice: ఎక్కువ రోజులు ఉండలేదు
  rationale: మూలంలోని నిషేధాత్మక, మితవ్యయమైన వ్యక్తీకరణను సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: యేసు కుటుంబానికి సంబంధించి ἀδελφοί అనే పదం సూచించే బంధుత్వం
  choice: ప్రధాన పాఠ్యంలో ‘సహోదరులు’
  alternative: బంధువులు లేదా దగ్గరి రక్తసంబంధీకులు
  rationale: గ్రీకు పదానికి అత్యంత ప్రత్యక్ష అర్థం ‘సహోదరులు’; అయితే కొన్ని సందర్భాల్లో అది విస్తృత కుటుంబ సంబంధాన్ని సూచించగలదు. ప్రధాన పాఠ్యం ప్రత్యక్ష అర్థాన్ని ఉంచి, సిద్ధాంతపరమైన వివాదాన్ని పరిష్కరించకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గౌరవప్రదమైన కథన శైలి. జాబితాను తెలుగులో సహజంగా ‘తో ... కలిసి’ నిర్మాణంలో అందించాం; మూలంలోని అర్థభేదాన్ని పాదటిప్పణిలో నిలిపాం.
