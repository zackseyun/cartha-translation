review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal transition, descent to Capernaum, the accompanying mother, brothers, and disciples, and the limited duration of the stay. The singular ‘దిగివెళ్లాడు’ appropriately retains Jesus as the grammatical subject, while ‘వారు’ naturally refers to the whole accompanying group.
  naturalness: 'The verse is fluent modern standard Telugu. A small footnote revision improves idiomatic Telugu: ‘దగ్గరి రక్తసంబంధీకులు’ is unnecessarily restrictive and less natural for the broader kinship alternative.'
  terminology: ‘సహోదరులు’ suitably renders the masculine plural ἀδελφοί without deciding later theological questions. ‘శిష్యులు’ is the appropriate consistent rendering of μαθηταί. The revised note preserves the possible broader family-reference without implying that it is the primary sense.
  issues:
  - severity: low
    issue: Footnote alternative is phrased as ‘దగ్గరి రక్తసంబంధీకులతో.’
    rationale: The Greek term’s broader possible sense is better represented idiomatically as ‘సన్నిహిత బంధువులు’; ‘రక్తసంబంధీకులు’ can sound overly technical and unnecessarily narrows the English audit trail’s ‘relatives/kinsmen.’
  revised_text: దీని తర్వాత ఆయన తన తల్లితో, తన సహోదరులతో[a], తన శిష్యులతో కలిసి కపెర్నహూముకు దిగివెళ్లాడు. వారు అక్కడ ఎక్కువ రోజులు ఉండలేదు.
