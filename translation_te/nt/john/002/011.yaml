id: JHN.2.11
reference: John 2:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ταύτην ⸀ἐποίησεν ἀρχὴν τῶν σημείων ὁ Ἰησοῦς ἐν Κανὰ τῆς Γαλιλαίας καὶ ἐφανέρωσεν τὴν δόξαν αὐτοῦ, καὶ ἐπίστευσαν εἰς αὐτὸν οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/011.yaml
  text: Jesus did this[a], the beginning of his signs, in Cana of Galilee, and revealed his glory, and his disciples believed in him.
translation:
  language: te
  text: యేసు గలిలయలోని కానాలో తన సూచకక్రియలకు ఆరంభంగా దీనిని చేశాడు[a]. ఆయన తన మహిమను వెల్లడించాడు; ఆయన శిష్యులు ఆయనను విశ్వసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన సూచకక్రియలలో మొదటిదిగా దీనిని చేశాడు.”
    reason: ἀρχή ఇక్కడ ‘ఆరంభం’ లేదా ‘మొదటిది’ అనే భావాన్ని ఇవ్వగలదు; రెండవ సహజమైన అనువాదాన్ని భద్రపరచడం.
lexical_decisions:
- source_word: ταύτην ἐποίησεν
  choice: దీనిని చేశాడు
  rationale: ταύτην అనేది ముందు వివరించిన కార్యాన్ని సూచించే సర్వనామం; గ్రీకులో లేని ‘అద్భుతం’ లేదా ‘సూచకక్రియ’ను దానిలో నేరుగా చేర్చకుండా, ποιέω యొక్క సాధారణ భావాన్ని నిలుపుతుంది.
- source_word: ἀρχὴν τῶν σημείων
  choice: తన సూచకక్రియలకు ఆరంభంగా
  rationale: ἀρχή యొక్క ‘ఆరంభం’ భావాన్ని నిలుపుతూ, ఇది యేసు చేసిన సూచకక్రియల పరంపరకు నాంది అని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: σημείων
  choice: సూచకక్రియలు
  rationale: యోహాను సువార్తలో σημεῖον అనేది శక్తికార్యమే కాక యేసు ఎవరో సూచించి వెల్లడించే కార్యం. ‘అద్భుతాలు’ కంటే ‘సూచకక్రియలు’ ఈ భావాన్ని మెరుగ్గా కాపాడుతుంది.
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: గలిలయలోని కానాలో
  rationale: ప్రాంతం మరియు పట్టణం మధ్య సంబంధాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐφανέρωσεν
  choice: వెల్లడిచేశాడు
  rationale: φανερόω లోని కనబడేలా లేదా తెలిసేలా చేయడం అనే భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: τὴν δόξαν αὐτοῦ
  choice: తన మహిమను
  rationale: δόξα అనే యోహాను సువార్తలోని కీలక వేదాంత పదానికి ‘మహిమ’ స్థిరమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: ఆయనను విశ్వసించారు
  rationale: πιστεύω εἰς నిర్మాణంలోని యేసువైపు దిశచూపే వ్యక్తిగత నమ్మకాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ఆయన శిష్యులు
  rationale: గ్రీకు నామవాచక పదబంధానికి సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: యోహాను సువార్తలో σημεῖον పదప్రయోగం
  choice: ‘సూచకక్రియలు’ అని అనువదించడం
  alternative: అద్భుతాలు
  rationale: ఈ కార్యాలు కేవలం శక్తి ప్రదర్శనలు కాకుండా యేసు స్వరూపాన్ని, మహిమను వెల్లడించే సూచనలు. అందువల్ల ‘సూచకక్రియలు’ యోహాను ఉద్దేశాన్ని కాపాడుతుంది.
- issue: ἀρχὴν τῶν σημείων యొక్క భావం
  choice: ‘తన సూచకక్రియలకు ఆరంభంగా’ అని అనువదించడం
  alternative: తన సూచకక్రియలలో మొదటిదిగా
  rationale: ἀρχή లోని ‘ఆరంభం’ అనే మూలభావాన్ని ప్రధాన పాఠంలో నిలుపుతూ, ‘మొదటిది’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో భద్రపరుస్తుంది.
- issue: శిష్యుల విశ్వాసం
  choice: ‘ఆయనను విశ్వసించారు’ అని మాత్రమే చెప్పడం
  alternative: ఆయనపై తమ విశ్వాసాన్ని ఉంచారు
  rationale: గ్రీకు వాక్యం విశ్వాసపు స్వభావం లేదా దాని సంపూర్ణతను మరింత నిర్వచించదు; కాబట్టి వేదాంతపరమైన అదనపు వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన వాక్యశైలి. గ్రీకు వాక్యంలోని వరుస సంధులను తెలుగులో సహజత కోసం రెండు వాక్యాలుగా విభజించాం; ‘అలా’ మొదటి కార్యానికీ మహిమ వెల్లడికీ ఉన్న సంబంధాన్ని స్పష్టం చేస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
