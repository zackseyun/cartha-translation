  source_fidelity: The draft correctly conveys the historical-present narrative as Telugu past tense, the distancing force of Τί ἐμοὶ καὶ σοί, the temporal force of οὔπω, and the Johannine wording ‘my hour.’ However, the dative coordination in the idiom should be expressed idiomatically as ‘నాకూ నీకూ,’ rather than the comma-separated ‘నాకు, నీకు.’
  naturalness: ‘దానితో నాకూ నీకూ ఏమి సంబంధం?’ is natural modern Telugu and retains the source’s deliberately tense, distancing question. ‘స్త్రీ’ is lexically literal but is not a natural respectful direct address in modern Telugu and can sound more dismissive than γύναι does in context. ‘అమ్మా’ is the ordinary respectful Telugu vocative here; the footnote should preserve the Greek’s literal wording and clarify that it does not require an affectionate interpretation.
  terminology: Retain ‘నా గడియ’ for ἡ ὥρα μου. Though somewhat elevated, it is intelligible Telugu and preserves the repeated Johannine ‘hour’ motif better than a generalized ‘సమయం.’
  issues:
