id: JHN.2.4
reference: John 2:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀καὶ λέγει αὐτῇ ὁ Ἰησοῦς· Τί ἐμοὶ καὶ σοί, γύναι; οὔπω ἥκει ἡ ὥρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/004.yaml
  text: And Jesus said to her[a], “What does that have to do with me and with you[b], woman? My hour has not yet come.”
translation:
  language: te
  text: యేసు ఆమెతో, “దానితో నాకూ నీకూ ఏమి సంబంధం[a], అమ్మా[b]? నా గడియ ఇంకా రాలేదు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇంకా అక్షరార్థంగా, “నాకూ నీకూ ఏమిటి?” ఇది ఆసక్తి లేదా బాధ్యత విషయంలో దూరాన్ని సూచించే నుడికారం; తప్పనిసరిగా విరోధాన్ని సూచించదు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా “స్త్రీ.” ఆ కాలపు సందర్భంలో ఇది గౌరవాన్ని కోల్పోని సాధారణ సంబోధన; ‘అమ్మా’ దాని సహజమైన తెలుగు సంబోధనను తెలియజేస్తుంది, అయితే అది తప్పనిసరిగా ఆప్యాయతను సూచించదు.
    reason: cultural_note
lexical_decisions:
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, తెలుగు కథన శైలిలో భూతకాలమైన ‘అన్నాడు’ సహజంగా ఉండి అదే కథన విధిని నిలుపుతుంది.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: దానితో నాకు, నీకు ఏమి సంబంధం
  rationale: ఈ గ్రీకు-సెమిటిక్ నుడికారం ఆసక్తి లేదా బాధ్యత విషయంలో కొంత దూరాన్ని సూచిస్తుంది. తెలుగు పాఠం ఆ దూరాన్ని నిలుపుతూ, సంబంధాన్నే పూర్తిగా తిరస్కరించినట్లు లేదా తీవ్ర విరోధాన్ని వ్యక్తం చేసినట్లు అతిశయింపదు.
- source_word: γύναι
  choice: స్త్రీ
  rationale: సంబోధన రూపానికి నేరమైన అర్థం ‘స్త్రీ.’ ‘అమ్మా’ అని అనువదిస్తే గ్రీకులో స్పష్టంగా లేని ఆప్యాయత లేదా బంధుత్వ ఛాయ చేరవచ్చు; అందువల్ల నేరమైన పదాన్ని ఉంచి దాని సాంస్కృతిక స్వరాన్ని పాదసూచికలో వివరించాం.
- source_word: οὔπω
  choice: ఇంకా ... లేదు
  rationale: సంబంధిత సమయం ఈ దశవరకు రాలేదనే భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἥκει
  choice: రాలేదు
  rationale: ἥκω చేరడం లేదా వచ్చి ఉండడాన్ని సూచిస్తుంది. ‘గడియ’తో ‘రావడం’ తెలుగు నుడికారంలో సహజంగా సరిపోతుంది.
- source_word: ἡ ὥρα μου
  choice: నా గడియ
  rationale: ‘గడియ’ మూలంలోని ‘hour’ రూపకాన్ని, యోహాను సువార్తలో దానికి ఉన్న పునరావృతమైన భావభారాన్ని నిలుపుతుంది; సాధారణమైన ‘సమయం’ ఆ అంతర్గ్రంథీయ అనుసంధానాన్ని కొంత మందగించవచ్చు.
theological_decisions:
- issue: యేసు తన తల్లిని ఉద్దేశించి పలికిన మాటల స్వరం, తీవ్రత
  choice: గౌరవాన్ని పూర్తిగా కోల్పోకుండా దూరాన్ని సూచించే ప్రతిస్పందన
  alternative: తీవ్రమైన గద్దింపు; లేదా స్పష్టంగా ఆప్యాయమైన సంబోధన
  rationale: Τί ἐμοὶ καὶ σοί అనే నుడికారం సందర్భం లేదా బాధ్యత విషయంలో దూరాన్ని సృష్టిస్తుంది; γύναι ఆ సందర్భంలో తప్పనిసరిగా అవమానకరం కాదు. అనువాదం దానిని కఠినమైన అవమానంగానూ, భావుకమైన ఆప్యాయతగానూ మార్చకుండా ఉద్రిక్తతను నిలుపుతుంది.
- issue: యోహాను సువార్తలో ‘నా గడియ’ భావం
  choice: యేసు నియమిత గడియను సూచించే, తక్షణ సందర్భాన్ని మించిన భావప్రతిధ్వని గల పదబంధం
  alternative: ఈ సూచకక్రియ చేయవలసిన క్షణం మాత్రమే; లేదా ప్రత్యేక వేదాంత భావం లేని సాధారణ సమయం
  rationale: యోహాను సువార్తలో ‘గడియ’ యేసు కార్యం, బాధ, మరణం, మహిమపరచబడడం వంటి అంశాలతో పునరావృతంగా అనుసంధానమవుతుంది. ప్రధాన పాఠంలో దానిని మరీ నిర్వచించకుండా మూల రూపకాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన క్రమాన్ని వాడుతూ, మూలంలోని దూరం మరియు వేదాంత ఉద్రిక్తతను నిలిపాం. ‘స్త్రీ’ నేటి వాడుకలో కొంత అసహజంగా వినిపించినా మూల సంబోధనను మృదువుగా మార్చకుండా పాదసూచికతో స్పష్టం చేశాం; ‘గడియ’ యోహాను సువార్తలోని ప్రధాన ప్రతీకాత్మక పదబంధాన్ని కాపాడుతుంది.
