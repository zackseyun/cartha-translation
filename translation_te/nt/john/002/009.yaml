source:
  edition: SBLGNT
  text: ὡς δὲ ἐγεύσατο ὁ ἀρχιτρίκλινος τὸ ὕδωρ οἶνον γεγενημένον, καὶ οὐκ ᾔδει πόθεν ἐστίν, οἱ δὲ διάκονοι ᾔδεισαν οἱ ἠντληκότες τὸ ὕδωρ, φωνεῖ τὸν νυμφίον ὁ ἀρχιτρίκλινος
base_translation:
  language: en
  yaml_path: translation/nt/john/002/009.yaml
  text: When the master of the feast tasted the water that had become wine[a], and did not know where it came from (though the servants who had drawn the water knew)[c][b], the master of the feast calls the bridegroom
translation:
  language: te
  text: విందు నిర్వాహకుడు[a] ద్రాక్షారసంగా మారిన నీటిని రుచి చూసినప్పుడు, అది ఎక్కడి నుండి వచ్చిందో అతనికి తెలియదు (ఆ నీటిని తోడిన సేవకులకు మాత్రం తెలుసు). విందు నిర్వాహకుడు పెండ్లికుమారుణ్ణి పిలుస్తాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విందు నిర్వాహకుడు’ అని అనువదించిన గ్రీకు పదం విందు ఏర్పాట్లను పర్యవేక్షించే వ్యక్తిని సూచిస్తుంది; ‘ప్రధాన పరిచారకుడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ గ్రీకులో ‘పిలుస్తాడు’ అనే చారిత్రక వర్తమాన కాలం ఉంది; సందర్భానుసారంగా ‘పిలిచాడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιτρίκλινος
  choice: విందు నిర్వాహకుడు
  rationale: విందు ఏర్పాట్లను పర్యవేక్షించే వ్యక్తిని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు పాత్రను సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐγεύσατο
  choice: రుచి చూశాడు
  rationale: రుచి చూడడం లేదా కొద్దిగా చవిచూడడం అనే సందర్భోచిత అర్థాన్ని సహజ తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: τὸ ὕδωρ οἶνον γεγενημένον
  choice: ద్రాక్షారసంగా మారిన నీటిని
  rationale: పూర్తయిన స్థితిమార్పును సూచించే perfect participle భావాన్ని కాపాడుతూ, నీరు నిజంగా ద్రాక్షారసంగా మారిందని స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὐκ ᾔδει πόθεν ἐστίν
  choice: అది ఎక్కడి నుండి వచ్చిందో అతనికి తెలియదు
  rationale: πόθεν సూచించే మూలం లేదా ఉద్భవస్థానాన్ని సహజ ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: διάκονοι
  choice: సేవకులు
  rationale: ఈ విందు సందర్భంలో గృహ లేదా విందు సేవకులను సూచిస్తుంది; సంఘపదవిని సూచించే అర్థాన్ని అనవసరంగా దిగుమతి చేయదు.
- source_word: ἠντληκότες
  choice: తోడిన
  rationale: నీటిని పాత్రలోనుంచి లేదా నీటి మూలం నుంచి తోడడాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: φωνεῖ
  choice: పిలుస్తాడు
  rationale: యోహాను ఉపయోగించిన చారిత్రక వర్తమాన కాలపు సజీవతను తెలుగులోనూ నిలుపుతుంది.
- source_word: νυμφίον
  choice: పెండ్లికుమారుణ్ణి
  rationale: వివాహ సందర్భంలోని bridegroom అనే అర్థానికి ప్రామాణికమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: ὡς δὲ
  choice: అప్పుడు
  rationale: తదుపరి చర్యకు మార్పును సహజంగా సూచిస్తుంది; మూలంలో లేని ప్రత్యేకమైన ‘ఇప్పుడు’ భావాన్ని చేర్చదు.
theological_decisions:
- issue: అద్భుతంలో జరిగిన మార్పు యొక్క వర్ణన
  choice: ద్రాక్షారసంగా మారిన నీరు
  alternative: ద్రాక్షారసంలా అనిపించిన నీరు
  rationale: గ్రీకు పాఠం నీరు ద్రాక్షారసంగా మారిన పూర్తయిన స్థితిని నేరుగా చెబుతుంది. దానిని కేవలం కనిపించిన లేదా అనిపించిన మార్పుగా బలహీనపరచకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి. మూలంలోని చారిత్రక వర్తమానాన్ని చివరి క్రియలో నిలిపి, మధ్యలోని వివరణను సహజ తెలుగు వాక్య నిర్మాణంలో అందించాం.
