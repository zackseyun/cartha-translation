revisions:
- from: విందు నిర్వాహకుడు ద్రాక్షారసంగా మారిన నీటిని రుచి చూశాడు.[a] అది ఎక్కడి నుండి వచ్చిందో అతనికి తెలియదు; అయితే ఆ నీటిని తోడిన సేవకులకు తెలుసు. అప్పుడు విందు నిర్వాహకుడు పెండ్లికుమారుణ్ణి పిలుస్తాడు.[b]
  to: విందు నిర్వాహకుడు[a] ద్రాక్షారసంగా మారిన నీటిని రుచి చూసినప్పుడు, అది ఎక్కడి నుండి వచ్చిందో అతనికి తెలియదు (ఆ నీటిని తోడిన సేవకులకు మాత్రం తెలుసు). విందు నిర్వాహకుడు పెండ్లికుమారుణ్ణి పిలుస్తాడు.[b]
  rationale: The revision restores the temporal force of ὡς δὲ with “రుచి చూసినప్పుడు,” retains the Greek parenthetical clarification concerning the servants, and preserves the historical present “పిలుస్తాడు.” It makes no theological or interpretive addition.
