id: JHN.2.25
reference: John 2:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὅτι οὐ χρείαν εἶχεν ἵνα τις μαρτυρήσῃ περὶ τοῦ ἀνθρώπου, αὐτὸς γὰρ ἐγίνωσκεν τί ἦν ἐν τῷ ἀνθρώπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/025.yaml
  text: and because he had no need that anyone should testify about man[a], for he himself knew what was in man.
translation:
  language: te
  text: అంతేకాక, మనిషి గురించి ఎవరైనా సాక్ష్యమివ్వవలసిన అవసరం ఆయనకు లేదు[a], ఎందుకంటే మనిషిలో ఏముందో ఆయన స్వయంగా తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక వ్యక్తి గురించి’; తరువాత, ‘ఒక వ్యక్తిలో ఏముందో.’ గ్రీకులో ఏకవచనంలో ఉన్న ‘మనిషి’ అనే పదం ఇక్కడ సాధారణంగా ఒక మానవుణ్ణి లేదా మానవాళిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαν εἶχεν
  choice: ఆయనకు అవసరం లేదు
  rationale: ‘అవసరం కలిగి ఉండడం’ అనే గ్రీకు నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα τις μαρτυρήσῃ
  choice: ఎవరైనా సాక్ష్యం చెప్పడం
  rationale: μαρτυρέω లోని ‘సాక్ష్యమివ్వడం/సాక్ష్యం చెప్పడం’ అనే భావాన్ని నిలుపుతూ, χρείαν εἶχεν తరువాతి ఉద్దేశ్యవాచక నిర్మాణాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: περὶ τοῦ ἀνθρώπου
  choice: మనిషి గురించి
  rationale: ఏ ఒక్క పురుషుణ్ణి మాత్రమే సూచించకుండా, మానవుణ్ణి సాధారణ ప్రతినిధి ఏకవచనంలో సూచించే ἄνθρωπος భావాన్ని ‘మనిషి’ నిలుపుతుంది.
- source_word: αὐτὸς γὰρ
  choice: ఎందుకంటే … ఆయనకే
  rationale: γάρ ఇచ్చే వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’ చూపిస్తుంది; αὐτός లోని నొక్కిచెప్పే భావాన్ని ‘ఆయనకే’ నిలుపుతుంది.
- source_word: ἐγίνωσκεν
  choice: తెలుసు
  rationale: ఇది స్థితిని తెలిపే క్రియ కావడంతో, గ్రీకు అసంపూర్ణ భూతకాలంలోని నిరంతర లేదా స్వభావసిద్ధ జ్ఞానాన్ని తెలుగులో సహజమైన ‘తెలుసు’ వ్యక్తం చేస్తుంది.
- source_word: τί ἦν ἐν τῷ ἀνθρώπῳ
  choice: మనిషిలో ఏముందో
  rationale: మనిషి అంతరంగంలో ఉన్నదాన్ని విస్తృతంగా సూచించే మూలపాఠ భావాన్ని వివరణతో సంకుచితం చేయకుండా, ముందు వచ్చిన ‘మనిషి’ అనే పదంతో అనుసంధానాన్ని నిలుపుతుంది.
theological_decisions:
- issue: మానవుల విషయంలో యేసు జ్ఞానపు పరిధి
  choice: ‘మనిషిలో ఏముందో ఆయనకే తెలుసు’ అని విస్తృతంగానే ఉంచడం
  alternative: ప్రతి వ్యక్తి అంతరంగమూ ఆయనకు తెలుసు / మానవ స్వభావం ఆయనకు తెలుసు
  rationale: గ్రీకు ప్రతినిధి ఏకవచనం వ్యక్తిగత మానవుణ్ణీ, మానవాళిని సాధారణంగానూ సూచించగలదు. అనువాదం దీనిని కేవలం సామాజిక అవగాహనగా సంకుచితం చేయదు; అలాగే అదనపు సిద్ధాంత వివరణతో విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే సాక్ష్యభాషలోని గంభీరతను మరియు మూలపాఠంలోని ప్రతినిధి ఏకవచన అస్పష్టతను నిలుపుతూ అనువదించబడింది.
