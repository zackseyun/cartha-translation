id: JHN.2.20
reference: John 2:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπαν οὖν οἱ Ἰουδαῖοι· Τεσσεράκοντα καὶ ἓξ ἔτεσιν οἰκοδομήθη ὁ ναὸς οὗτος, καὶ σὺ ἐν τρισὶν ἡμέραις ἐγερεῖς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/020.yaml
  text: So the Jews said[a], “This temple was built in forty-six years[b], and will you raise it up in three days?”
translation:
  language: te
  text: అందుకు యూదులు[a], “ఈ ఆలయాన్ని కట్టడానికి నలభై ఆరు సంవత్సరాలు పట్టింది; నువ్వు దీన్ని మూడు రోజుల్లో లేపుతావా[b]?” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదయవాసులు.’ గ్రీకులో ‘యూదులు’ అని ఉంది; యోహాను ఈ పదాన్ని సందర్భానుసారం విభిన్న అర్థ పరిధులతో వాడుతాడు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘మళ్లీ కడతావా?’ మాట్లాడినవారు గ్రీకు క్రియను నిర్మాణ సంబంధమైన అర్థంలో గ్రహించి ఉండవచ్చు; అయితే ‘లేపుతావా’ అనే అనువాదం, యోహాను తరువాత యేసు పునరుత్థానంతో అనుసంధానించే పదప్రయోగాన్ని నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: అప్పుడు
  rationale: ముందటి మాటకు ప్రతిస్పందనగా సంభాషణ కొనసాగుతున్నదని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది; ఇక్కడ కఠినమైన తార్కిక నిర్ధారణకన్నా కథన సంబంధం ప్రధానంగా ఉంది.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: గ్రీకు పదబంధంలోని సాధారణ అర్థాన్ని నిలుపుతుంది. ‘యూదయవాసులు’ లేదా ‘యూదా నాయకులు’ అని అనువదిస్తే ఈ వచనంలో స్పష్టంగా లేని పరిమితిని చేర్చినట్లవుతుంది; సందర్భ సంబంధమైన సంక్లిష్టతను పాదసూచికలో తెలిపాం.
- source_word: Τεσσεράκοντα καὶ ἓξ ἔτεσιν
  choice: నలభై ఆరు సంవత్సరాల్లో
  rationale: దత్తి విభక్తిలోని కాలవ్యవధిని, నిర్మాణం జరిగిన కాలపరిమితిగా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: οἰκοδομήθη
  choice: కట్టబడింది
  rationale: అయోరిస్ట్ కర్మణి రూపానికి సూటిగా సరిపోతుంది; దీర్ఘ నిర్మాణ ప్రక్రియను మితిమీరి వివరించదు.
- source_word: ὁ ναὸς οὗτος
  choice: ఈ ఆలయం
  rationale: ναός ప్రత్యేకంగా పవిత్ర ఆలయాన్ని సూచించినప్పటికీ, ఈ సందర్భంలో ‘ఆలయం’ సహజమైనది, స్పష్టమైనది.
- source_word: καὶ σὺ
  choice: నువ్వు
  rationale: σὺలోని నొక్కిచెప్పే భావాన్ని ఏకవచన ‘నువ్వు’ సహజంగా తెలియజేస్తుంది; ప్రశ్న మొత్తం వారి అపనమ్మకాన్ని వ్యక్తపరుస్తుంది.
- source_word: ἐν τρισὶν ἡμέραις
  choice: మూడు రోజుల్లో
  rationale: కాలపరిమితిని సహజమైన తెలుగులో తెలియజేస్తూ, తరువాతి పునరుత్థాన సందర్భంతో ఉన్న పదబంధ సంబంధాన్ని నిలుపుతుంది.
- source_word: ἐγερεῖς
  choice: లేపుతావా
  rationale: ἐγείρωలోని ‘లేపు’ భావాన్ని నిలిపి, వక్తలు ఊహించిన ‘మళ్లీ కట్టు’ అనే భావానికీ, యోహాను తరువాత అనుసంధానించే పునరుత్థాన భావానికీ మధ్యనున్న ఉద్దేశపూర్వక ద్వంద్వార్థాన్ని చెరపదు.
- source_word: αὐτόν
  choice: దీన్ని
  rationale: ముందున్న ‘ఈ ఆలయం’ను సహజమైన తెలుగు సర్వనామంతో తిరిగి సూచిస్తుంది.
theological_decisions:
- issue: యోహాను సువార్తలో οἱ Ἰουδαῖοι వల్ల కలగగల యూదు వ్యతిరేక అపార్థం
  choice: ప్రధాన పాఠ్యంలో ‘యూదులు’ అని ఉంచడం
  alternative: ‘యూదయవాసులు’ లేదా ‘యూదా నాయకులు’
  rationale: మూలంలోని పదాన్ని నిలుపుతూ, ఈ వచనం స్పష్టంగా ఇవ్వని పరిమితిని అనువాదంలో చేర్చలేదు. యోహాను ఈ పదాన్ని సందర్భానుసారం విభిన్నంగా వాడుతాడనే విషయాన్ని పాదసూచిక వివరిస్తుంది.
- issue: ἐγερεῖςకు పునరుత్థాన చిత్రణతో ఉన్న సంబంధం
  choice: ‘లేపుతావా’
  alternative: ‘మళ్లీ కడతావా’
  rationale: మాట్లాడేవారు భౌతిక ఆలయాన్ని ఉద్దేశించి అర్థం చేసుకుంటుండగా, సువార్తకర్త తరువాత యేసు శరీరం మరియు పునరుత్థానంతో దీనిని అనుసంధానిస్తాడు. ‘లేపు’ ఆ theological irony మరియు ఉద్వేగాన్ని ముందుగానే పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. యూదులు యేసుతో నేరుగా మాట్లాడుతున్న సందర్భంలో ఏకవచన ‘నువ్వు’ వాడి గ్రీకు σὺ యొక్క నొక్కిచెప్పే భావాన్ని నిలిపాం. ‘లేపుతావా’ కొద్దిగా అసాధారణంగా వినిపించినా మూలంలోని ఉద్దేశపూర్వక ద్వంద్వార్థాన్ని కాపాడుతుంది.
