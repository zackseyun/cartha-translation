  verdict: revise
  source_fidelity: οὖν here marks the interlocutors’ consequential response, so ‘అందుకు’ is preferable to the merely temporal ‘అప్పుడు.’ εἶπαν is more directly represented by ‘అన్నారు’ than by ‘అడిగారు.’ The rendering ‘లేపుతావా’ appropriately retains the deliberate lexical connection with resurrection while allowing the speakers’ construction-oriented misunderstanding.
  naturalness: The revised wording is natural modern standard Telugu. ‘ఈ ఆలయాన్ని కట్టడానికి నలభై ఆరు సంవత్సరాలు పట్టింది’ idiomatically expresses the construction duration, while retaining the sense of the Greek passive statement. The direct, incredulous question remains clear.
  terminology: ‘యూదులు,’ ‘ఆలయం,’ and ‘లేపుతావా’ are retained. The footnotes appropriately identify ‘యూదయవాసులు’ as an alternative contextual rendering and ‘మళ్లీ కడతావా?’ as the construction-oriented alternative, without resolving John’s intended ambiguity in the main text.
  issues:
  - severity: medium
    issue: ‘అప్పుడు’ for οὖν
    rationale: ‘అప్పుడు’ primarily indicates temporal sequence (‘then’), whereas οὖν in this response introduces the consequence or reaction to Jesus’ statement. ‘అందుకు’ preserves this connection naturally.
  - severity: low
    issue: ‘అని అడిగారు’ for εἶπαν
    rationale: The Greek states that they ‘said,’ though the utterance is a rhetorical question. ‘అన్నారు’ is more source-close and does not add a speech-act description beyond the text.
