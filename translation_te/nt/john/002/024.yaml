translation:
  language: te
  text: అయితే యేసు తాను మాత్రం తనను వారికి అప్పగించలేదు[a]; ఎందుకంటే ఆయనకు మనుషులందరూ తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ముందరి వచనంలో చాలామంది యేసును ‘నమ్మారు’ అని చెప్పడానికి ఉపయోగించిన అదే గ్రీకు క్రియ ఇక్కడ ఉంది. అక్కడ అది ‘నమ్మడం’ అనే అర్థంలో ఉండగా, ఇక్కడ ‘తనను వారికి అప్పగించడం’ అనే అర్థంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ Ἰησοῦς
  choice: అయితే యేసు తాను మాత్రం
  rationale: δέ సూచించే వ్యతిరేక మలుపును ‘అయితే’ తెలియజేస్తుంది; αὐτός లోని ఉద్ఘాటనను ‘తాను మాత్రం’ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: οὐκ ἐπίστευεν
  choice: నమ్మి ... అప్పగించుకోలేదు
  rationale: ఇక్కడ πιστεύω వ్యక్తిగత కర్మతో, చతుర్థీ విభక్తి సంబంధంతో వచ్చి ‘తనను తాను ఎవరికైనా నమ్మి అప్పగించుకోవడం’ అనే భావం ఇస్తుంది. ఈ రూపం 23వ వచనంలోని ‘నమ్మారు’ అనే అదే క్రియతో ఉన్న పదప్రయోగ సంబంధాన్ని కూడా కొంతవరకు నిలుపుతుంది.
- source_word: αὑτὸν αὐτοῖς
  choice: తనను తాను వారికి
  rationale: ఆత్మవాచక సర్వనామం వ్యక్తిగత స్వీయ అప్పగింతను సూచిస్తుంది; ‘తనను తాను వారికి’ మూల నిర్మాణాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: διὰ τὸ
  choice: ఎందుకంటే
  rationale: διά తో కూడిన articular infinitive ఇక్కడ కారణాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగులో ‘ఎందుకంటే’ సహజంగా causal సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: αὐτὸν γινώσκειν πάντας
  choice: ఆయనకు మనుషులందరూ తెలుసు
  rationale: గ్రీకు infinitival clause ను సహజమైన తెలుగు finite clause గా ఇచ్చాం. πάντας సందర్భంలో సమస్త మనుషులను సూచిస్తుంది; ‘మనుషులందరూ’ దాని పరిధిని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: 23–24 వచనాల్లో πιστεύω పదప్రయోగ సంబంధం
  choice: 23వ వచనంలోని ‘నమ్మారు’తో సంబంధం కనిపించేలా ‘నమ్మి తనను తాను ... అప్పగించుకోలేదు’ అని అనువదించడం
  alternative: ‘తనను తాను వారికి అప్పగించుకోలేదు’ అని మాత్రమే అనువదించడం
  rationale: 'ఒకే గ్రీకు క్రియతో ఉద్దేశపూర్వక పదప్రయోగం ఉంది: చాలామంది యేసును ‘నమ్మారు,’ కానీ యేసు తనను తాను వారికి ‘నమ్మి అప్పగించుకోలేదు.’ తెలుగు వాక్యం భావాన్నీ, సాధ్యమైనంతవరకు పదసంబంధాన్నీ నిలుపుతుంది.'
- issue: πάντας యొక్క పరిధి
  choice: మనుషులందరూ
  alternative: అందరూ
  rationale: సందర్భం మానవులను సాధారణంగా సూచిస్తుంది. ‘మనుషులందరూ’ పరిధిని ఏ ప్రత్యేక గుంపుకూ పరిమితం చేయకుండా స్పష్టంగా తెలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘తాను మాత్రం’ వ్యతిరేక ఉద్ఘాటనను, ‘నమ్మి ... అప్పగించుకోలేదు’ మూలంలోని పదప్రయోగాన్నీ భావాన్నీ సమతుల్యంగా నిలుపుతున్నాయి.
