id: JHN.2.1
reference: John 2:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ γάμος ἐγένετο ἐν Κανὰ τῆς Γαλιλαίας, καὶ ἦν ἡ μήτηρ τοῦ Ἰησοῦ ἐκεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/001.yaml
  text: And on the third day there was a wedding in Cana of Galilee[b][a], and the mother of Jesus was there.
translation:
  language: te
  text: మూడవ రోజున గలిలయలోని కానాలో ఒక పెళ్లి[a] జరిగింది. యేసు తల్లి అక్కడ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వివాహ వేడుక’ లేదా ‘వివాహ విందు.’ గ్రీకు పదం వివాహ సంఘటనతో పాటు దాని వేడుకను కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: (ప్రత్యేక పదంగా అనువదించలేదు)
  rationale: వాక్యారంభంలోని ఈ సాధారణ కథన సంధిని తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని పెడితే అసహజంగా ఉంటుంది; సంఘటనల కొనసాగింపును ‘మూడవ రోజున’ అనే ప్రారంభమే సహజంగా తెలియజేస్తుంది.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: మూడవ రోజున
  rationale: కాలాన్ని సూచించే దత్తివిభక్తి నిర్మాణాన్ని సహజమైన తెలుగులో నేరుగా అందిస్తుంది; ప్రతీకాత్మక అర్థాన్ని అనువాదంలో చేర్చదు.
- source_word: γάμος
  choice: ఒక పెళ్లి[a]
  rationale: ఈ గ్రీకు పదం వివాహ సంఘటనను లేదా దానితో కూడిన వేడుక/విందును సూచించగలదు. ‘పెళ్లి’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ విస్తృతిని చాలావరకు నిలుపుతుంది; ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: ἐγένετο
  choice: జరిగింది
  rationale: ఒక సంఘటన చోటుచేసుకున్నదని తెలిపే సందర్భోచిత, సహజ తెలుగు క్రియ.
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: గలిలయలోని కానాలో
  rationale: స్థలాల మధ్య సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ ‘కానా’ అనే పేరును లిప్యంతరీకరిస్తుంది.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: యేసు తల్లి
  rationale: గ్రీకు సంబంధాన్ని సంక్షిప్తంగా, సహజంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: ἦν ... ἐκεῖ
  choice: అక్కడ ఉన్నారు
  rationale: నేపథ్యంగా ఆమె అక్కడ ఉన్న సంగతిని తెలిపే గ్రీకు అసంపూర్ణ భూతకాల భావాన్ని సహజ తెలుగులో అందిస్తుంది; గౌరవార్థక బహువచనం ఆధునిక తెలుగు మర్యాదా ప్రయోగం.
theological_decisions:
- issue: ‘మూడవ రోజు’ అనే కాలసూచన
  choice: కాలక్రమ సూచనగా యథాతథంగా ఉంచడం
  alternative: పునరుత్థానాన్ని సూచించే ప్రతీకాత్మక భావాన్ని అనువాదంలో స్పష్టంగా చేర్చడం
  rationale: యోహాను రచనలో పాఠకులు ప్రతీకాత్మక సంబంధాన్ని గమనించవచ్చు; అయినా ఈ వాక్యంలో పదబంధం ప్రత్యక్షంగా కాలాన్ని సూచిస్తుంది. అందువల్ల సాధ్యమైన ధార్మిక ప్రతిధ్వనిని నిరాకరించకుండానే, దానిని ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. వాక్యారంభ సంధిని అక్షరానువాదం చేయకుండా తెలుగు కథన ప్రవాహానికి అనుగుణంగా ఉంచాం; యేసు తల్లిని సూచించేటప్పుడు సాధారణ మర్యాదార్థక క్రియారూపం వాడాం.
