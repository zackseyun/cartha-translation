id: JHN.2.15
reference: John 2:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ποιήσας φραγέλλιον ἐκ σχοινίων πάντας ἐξέβαλεν ἐκ τοῦ ἱεροῦ τά τε πρόβατα καὶ τοὺς βόας, καὶ τῶν κολλυβιστῶν ἐξέχεεν ⸂τὰ κέρματα⸃ καὶ τὰς τραπέζας ⸀ἀνέστρεψεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/015.yaml
  text: And after making a whip out of cords[a], he drove them all out of the temple courts, including both the sheep and the cattle[c][b]; and he poured out the coins of the money changers and overturned the tables.
translation:
  language: te
  text: ఆయన తాళ్లతో ఒక కొరడా చేసి, అందరినీ[c]—గొర్రెలనూ ఎడ్లనూ కూడా[b]—దేవాలయ ప్రాంగణం నుండి[a] వెళ్లగొట్టాడు. నాణేలు మార్చేవారి నాణేలను కుమ్మరించి, వారి బల్లలను బోర్లా తిప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి గ్రీకు పదం ἱερόν అంతర్గత పరిశుద్ధస్థలాన్ని మాత్రమే కాక దేవాలయ సముదాయాన్ని లేదా ప్రాంగణాలను సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా ‘గొర్రెలనూ పశువులనూ కూడా.’
    reason: lexical_alternative
  - marker: c
    text: గ్రీకు వాక్యం మొదట ‘అందరినీ’ అని చెప్పి, తరువాత ‘గొర్రెలనూ ఎడ్లనూ’ అని పేర్కొంటుంది. కొరడాను మనుషులపై ఉపయోగించాడని అది స్పష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσας
  choice: చేసి
  rationale: అనంతరం జరిగిన ప్రధాన క్రియకు ముందున్న చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: φραγέλλιον ἐκ σχοινίων
  choice: తాళ్లతో ఒక కొరడా
  rationale: కొరడా వంటి సాధనాన్ని, అది తాళ్లతో చేయబడిందనే పదార్థ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: πάντας
  choice: అందరినీ
  rationale: గ్రీకు పుంలింగ బహువచనంలోని సమగ్ర భావాన్ని ఉంచుతూ, అది మనుషులకు మాత్రమేనా లేక వెంట చెప్పబడిన జంతువులకూ వర్తిస్తుందా అన్న అస్పష్టతను పూర్తిగా తొలగించదు.
- source_word: ἐξέβαλεν
  choice: వెళ్లగొట్టాడు
  rationale: బలంగా బయటకు పంపడం అనే సందర్భోచిత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοῦ ἱεροῦ
  choice: దేవాలయ ప్రాంగణం నుండి
  rationale: ἱερόν అంతర్గత పరిశుద్ధస్థలాన్ని మాత్రమే కాక దేవాలయ సముదాయాన్ని లేదా ఆవరణలను సూచిస్తుంది.
- source_word: τά τε πρόβατα καὶ τοὺς βόας
  choice: గొర్రెలనూ ఎడ్లనూ కూడా
  rationale: τε...καί నిర్మాణంలోని రెండు వర్గాల సమన్వయాన్ని నిలుపుతుంది; βόαςకు సందర్భానుకూలమైన నిర్దిష్ట పదంగా ‘ఎడ్లు’ ఎంచుకోబడింది.
- source_word: κολλυβιστῶν
  choice: నాణేలు మార్చేవారి
  rationale: దేవాలయ సందర్భంలో నాణేలు లేదా కరెన్సీ మార్చే వారిని సాధారణ పాఠకులకు స్పష్టంగా గుర్తిస్తుంది.
- source_word: ἐξέχεεν τὰ κέρματα
  choice: నాణేలను కుమ్మరించి
  rationale: ἐκχέωలోని ‘పోసివేయడం/కుమ్మరించడం’ అనే చిత్రాన్ని సహజంగా నిలుపుతుంది; ‘చెల్లాచెదురు చేశాడు’ కంటే తక్కువ వ్యాఖ్యానాత్మకం.
- source_word: ἀνέστρεψεν
  choice: బల్లలను బోర్లా తిప్పాడు
  rationale: ఈ సందర్భంలో బల్లలను తలకిందులు చేయడం లేదా పడగొట్టడం అనే భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: దేవాలయంలో యేసు చర్య యొక్క పరిధి, కొరడా వినియోగం
  choice: ‘అందరినీ’ అని అనువదించి, వెంటనే గొర్రెలనూ ఎడ్లనూ కూడా పేర్కొన్నాం; కొరడాను మనుషులపై ఉపయోగించాడని వాక్యంలో చేర్చలేదు.
  alternative: అతడు మనుషులనూ జంతువులనూ అందరినీ కొరడాతో వెళ్లగొట్టాడు; లేదా అతడు జంతువులను మాత్రమే వెళ్లగొట్టాడు.
  rationale: గ్రీకు వాక్యం πάντας తరువాత గొర్రెలు, ఎడ్లను పేర్కొంటుంది; అయితే కొరడా మనుషులపై ఉపయోగించబడిందని స్పష్టంగా చెప్పదు. అందువల్ల మూలంలోని పరిధి సంబంధమైన ఉద్వేగం, అస్పష్టత నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘దేవాలయ ప్రాంగణం’ ద్వారా ἱερόν–ναός వ్యత్యాసం స్పష్టం చేయబడింది. మూలంలోని వాక్య నిర్మాణ అస్పష్టతను ప్రధాన పాఠ్యం మరియు పాదసూచిక ద్వారా నిలుపుకున్నాం.
