- from: కాబట్టి యేసు అతనితో[a], “మీరు సూచక క్రియలనూ అద్భుతాలనూ చూడకపోతే ఎంతమాత్రమూ నమ్మరు” అన్నాడు.
  to: కాబట్టి యేసు అతనితో[a], “మీరు సూచకాలను మరియు అద్భుతాలను చూడకపోతే ఎంతమాత్రమూ నమ్మరు” అన్నాడు.
  rationale: The revision replaces the less idiomatic ‘సూచక క్రియలు’ with ‘సూచకాలు,’ preserving the distinct sense of σημεῖα alongside τέρατα. The footnote is adjusted to avoid specifying a group’s physical presence, which the Greek does not state, while maintaining the plural-based observation.
