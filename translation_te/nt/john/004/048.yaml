id: JHN.4.48
reference: John 4:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς πρὸς αὐτόν· Ἐὰν μὴ σημεῖα καὶ τέρατα ἴδητε, οὐ μὴ πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/048.yaml
  text: So Jesus said to him[a], “Unless you see signs and wonders, you will certainly not believe.”
translation:
  language: te
  text: కాబట్టి యేసు అతనితో[a], “మీరు సూచకాలను మరియు అద్భుతాలను చూడకపోతే ఎంతమాత్రమూ నమ్మరు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చూడడం,’ ‘నమ్మడం’ అనే క్రియలు గ్రీకులో బహువచనంలో ఉన్నాయి. కాబట్టి యేసు మాటలు ఈ అధికారిని మాత్రమే కాక, మరింత విస్తృతమైన సమూహాన్ని కూడా ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సందర్భం నుంచి వచ్చే తార్కిక కొనసాగింపును సూచిస్తుంది; కేవలం కాలక్రమాన్ని తెలిపే ‘అప్పుడు’ కంటే మూలంలోని అన్వయాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: πρὸς αὐτόν
  choice: అతనితో
  rationale: ఒక వ్యక్తిని ఉద్దేశించి యేసు మాట్లాడినట్లు సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: Ἐὰν μὴ
  choice: చూడకపోతే
  rationale: గ్రీకు షరతుతో కూడిన నిషేధాన్ని తెలుగులో సహజమైన ‘-కపోతే’ నిర్మాణంతో అందిస్తుంది.
- source_word: σημεῖα
  choice: సూచక క్రియలు
  rationale: యోహాను సువార్తలో ఈ క్రియలు తమను మించిన ప్రాముఖ్యాన్ని సూచిస్తాయనే భావాన్ని నిలుపుతుంది; కేవలం ‘అద్భుతాలు’ అని అనువదించడం వల్ల కలిగే భావసంకోచాన్ని నివారిస్తుంది.
- source_word: τέρατα
  choice: అద్భుతాలు
  rationale: ఆశ్చర్యాన్ని కలిగించే అసాధారణ కార్యాలు అనే భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἴδητε
  choice: మీరు ... చూడకపోతే
  rationale: షరతు వాక్యంలో ఉన్న aorist subjunctive భావాన్ని సహజమైన తెలుగులో అందిస్తుంది. ‘మీరు’ గ్రీకులోని బహువచనాన్ని సాధ్యమైనంతవరకు ప్రతిబింబిస్తుంది.
- source_word: οὐ μὴ πιστεύσητε
  choice: ఎంతమాత్రమూ నమ్మరు
  rationale: οὐ μή అనే బలమైన నిషేధాన్ని అతిశయోక్తి లేకుండా స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: πιστεύσητε
  choice: నమ్మరు
  rationale: యోహాను రచనల్లో πιστεύωకు సాధారణంగా ఉన్న నమ్మడం/విశ్వసించడం అనే భావాన్ని సరళంగా, వ్యాఖ్యాన భారం లేకుండా అందిస్తుంది.
theological_decisions:
- issue: సంబోధితుని సంఖ్య మరియు మాటల పరిధి
  choice: కథన పరిచయంలో ‘అతనితో’ అని ఏకవచన వ్యక్తిని చూపిస్తూ, యేసు మాటల్లో ‘మీరు’ అని ఉంచడం
  alternative: యేసు మాటలన్నీ అధికారిని మాత్రమే వ్యక్తిగతంగా ఉద్దేశించినట్లు ఏకవచన భావంలో అనువదించడం; లేదా ‘మీరందరూ’ అని విస్తరించి చెప్పడం
  rationale: యేసు ఒక అధికారితో మాట్లాడుతున్నప్పటికీ ἴδητε, πιστεύσητε రెండూ గ్రీకులో బహువచన రూపాలు. అందువల్ల మాటలు అతనిని మించిన విస్తృత సమూహానికి లేదా వైఖరికి వర్తించే అవకాశాన్ని పాఠ్యంలో పరిష్కరించకుండా నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘సూచక క్రియలు’ యోహాను సువార్తలోని ప్రత్యేక పదప్రయోగాన్ని నిలుపుతుంది; ‘ఎంతమాత్రమూ నమ్మరు’ మూలంలోని బలమైన నిషేధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
