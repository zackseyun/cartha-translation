  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని కారణసంబంధాన్ని సహజ తెలుగు వాక్య విభజనతో స్పష్టం చేశాం; పాఠ్యంలో ఉన్న [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోతాయి.
