source:
  edition: SBLGNT
  text: ὅτε οὖν ἦλθεν εἰς τὴν Γαλιλαίαν, ἐδέξαντο αὐτὸν οἱ Γαλιλαῖοι, πάντα ἑωρακότες ⸀ὅσα ἐποίησεν ἐν Ἱεροσολύμοις ἐν τῇ ἑορτῇ, καὶ αὐτοὶ γὰρ ἦλθον εἰς τὴν ἑορτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/045.yaml
  text: So when he came into Galilee[a], the Galileans welcomed him, having seen all that he had done in Jerusalem at the feast[b], for they too had gone to the feast.
translation:
  language: te
  text: కాబట్టి ఆయన గలిలయకు వచ్చినప్పుడు గలిలయవారు ఆయనను స్వాగతించారు[a]; యెరూషలేములో పండుగ[b] సమయంలో ఆయన చేసినవన్నీ వారు చూశారు, ఎందుకంటే వారూ ఆ పండుగకు వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనను స్వీకరించారు.’ గ్రీకు క్రియకు స్వీకరించడం లేదా స్వాగతించడం అనే అర్థాలు ఉండవచ్చు; ఇక్కడ సందర్భం అనుకూలమైన స్వీకరణను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘పండుగ’ అనే గ్రీకు పదం ఒక మతపరమైన ఉత్సవాన్ని సూచిస్తుంది; చుట్టుపక్కల సందర్భాన్ని బట్టి యెరూషలేములో జరిగే యాత్రికుల పండుగ ఉద్దేశించి ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε οὖν
  choice: కాబట్టి ... వచ్చినప్పుడు
  rationale: οὖν యొక్క కథన అనుసంధాన భావాన్ని ‘కాబట్టి’ తెలియజేస్తుంది; ὅτε కాలసంబంధాన్ని ‘వచ్చినప్పుడు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἦλθεν εἰς τὴν Γαλιλαίαν
  choice: ఆయన గలిలయకు వచ్చినప్పుడు
  rationale: εἰς ఒక ప్రాంతం వైపు/లోనికి జరిగిన గమనాన్ని సూచిస్తుంది; తెలుగులో ‘గలిలయకు వచ్చాడు’ సహజమైన సమానార్థక ప్రయోగం.
- source_word: ἐδέξαντο αὐτὸν
  choice: ఆయనను ఆహ్వానించారు
  rationale: δέχομαι ఇక్కడ అనుకూలంగా స్వీకరించడం లేదా స్వాగతించడం అనే సామాజిక భావాన్ని ఇస్తుంది; ‘ఆహ్వానించారు’ ఆధునిక తెలుగులో ఆ సాదర స్వీకరణను సహజంగా తెలియజేస్తుంది.
- source_word: οἱ Γαλιλαῖοι
  choice: గలిలయవారు
  rationale: ప్రాంత నివాసులను సూచించే సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: πάντα ἑωρακότες ὅσα
  choice: ఆయన చేసినవన్నీ వారు చూశారు
  rationale: పూర్వమే చూసిన కార్యాలే వారి స్వీకరణకు నేపథ్య కారణమని వాక్య క్రమం స్పష్టం చేస్తుంది; ‘అన్నీ’ మూలంలోని సమగ్రతను కాపాడుతుంది.
- source_word: ἐποίησεν
  choice: ఆయన చేసిన
  rationale: వారు చూచిన వాటికన్నా ముందు/అదే సందర్భంలో జరిగిన ఆయన కార్యాలను సహజమైన తెలుగు సంబంధకృదంతంతో వ్యక్తం చేస్తుంది.
- source_word: ἐν Ἱεροσολύμοις
  choice: యెరూషలేములో
  rationale: స్థలవాచక భావానికి ప్రామాణిక తెలుగు రూపం.
- source_word: ἐν τῇ ἑορτῇ
  choice: పండుగ సమయంలో
  rationale: ἑορτή మతపరమైన పండుగను సూచిస్తుంది; ἐν యొక్క కాలసంబంధ భావాన్ని ‘సమయంలో’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: καὶ αὐτοὶ γὰρ
  choice: ఎందుకంటే ... వారు కూడా
  rationale: γάρ ఇచ్చే వివరణాత్మక కారణాన్ని ‘ఎందుకంటే’తో, αὐτοί καί ఇచ్చే సమ్మిళిత ఉద్ఘాటనను ‘వారు కూడా’తో నిలుపుతుంది.
- source_word: ἦλθον εἰς τὴν ἑορτήν
  choice: ఆ పండుగకు వెళ్లారు
  rationale: వారు ముందుగా యెరూషలేము పండుగకు హాజరైన విషయాన్ని తెలుగు దృష్టికోణంలో సహజంగా ‘వెళ్లారు’ అని వ్యక్తం చేస్తుంది.
