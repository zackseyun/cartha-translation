  text: For his disciples had gone away into the city to buy food[a][b].
translation:
  language: te
  text: ఎందుకంటే ఆయన శిష్యులు ఆహారం కొనడానికి పట్టణంలోకి వెళ్లారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పట్టణానికి’; πόλιςను ‘పట్టణం’ లేదా సందర్భానుసారంగా ‘ఊరు’ అని అనువదించవచ్చు.
