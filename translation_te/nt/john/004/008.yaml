    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలోని పరిస్థితికి వివరణను జోడించే γάρ యొక్క అనుసంధాన భావాన్ని సహజమైన తెలుగులో చూపుతుంది.
- source_word: μαθηταὶ αὐτοῦ
  choice: ఆయన శిష్యులు
  rationale: యోహాను కథనంలో μαθηταίకు స్థిరమైన, సహజమైన తెలుగు సమానార్థకం; αὐτοῦ యొక్క స్వామ్య భావాన్ని ‘ఆయన’ తెలియజేస్తుంది.
- source_word: ἀπεληλύθεισαν
  choice: వెళ్లి ఉన్నారు
  rationale: ప్రధాన సందర్భానికి ముందే జరిగిన ప్రయాణాన్ని సూచించే ప్లూపర్‌ఫెక్ట్ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς τὴν πόλιν
  choice: పట్టణంలోకి
  rationale: εἰς సూచించే గమనం/లోపలికి ప్రవేశ భావాన్ని కాపాడుతుంది; ఈ సందర్భంలో πόλιςకు ‘పట్టణం’ సహజంగా ఉంటుంది.
- source_word: ἵνα
  choice: కొనడానికి
  rationale: ἵνα తెలిపే ఉద్దేశాన్ని తెలుగు క్రియార్థక రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τροφὰς
  choice: ఆహారం
  rationale: τροφάς ఇక్కడ తినుబండారాలు లేదా సరుకులను సమష్టిగా సూచిస్తుంది; ‘ఆహారం’ సాధారణమైన స్పష్టమైన పదం.
- source_word: ἀγοράσωσιν
  choice: కొనడానికి
  rationale: కొనుగోలు చేయాలనే ఉద్దేశిత చర్యను సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
