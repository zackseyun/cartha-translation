  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని వివరణాత్మక అనుసంధానం, ముందే పూర్తైన చర్య, ఉద్దేశ భావం నిలుపబడ్డాయి.
