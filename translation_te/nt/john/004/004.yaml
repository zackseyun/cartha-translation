translation:
  language: te
  text: ఆయన సమరయ ప్రాంతం గుండా వెళ్లవలసి వచ్చింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన సమరయ ప్రాంతం గుండా వెళ్లడం అవసరమైంది.” గ్రీకు మూలం అవసరాన్ని తెలియజేస్తుంది; అయితే ఆ అవసరానికి ఖచ్చితమైన ఆధారం ఏమిటో పేర్కొనదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδει
  choice: వెళ్లవలసి వచ్చింది
  rationale: భూతకాల కథనంలో ఉన్న అవసర భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఆ అవసరానికి కారణం ఏమిటో మాత్రం నిర్ణయించదు.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక కథన కొనసాగింపును సూచిస్తుంది. తెలుగులో ప్రత్యేక సంధాయక పదం లేకుండానే ఆ కొనసాగింపు సహజంగా వ్యక్తమవుతుంది.
- source_word: αὐτὸν
  choice: ఆయన
  rationale: గ్రీకులో అనంతక్రియకు కర్మవిభక్తి రూపంలో ఉన్న కర్తను సహజమైన తెలుగు వాక్య నిర్మాణంలో కర్తగా ఇచ్చాం.
- source_word: διέρχεσθαι
  choice: గుండా వెళ్ల
  rationale: ఒక ప్రాంతం మధ్యగా ప్రయాణించడాన్ని సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: διὰ τῆς Σαμαρείας
  choice: సమరయ ప్రాంతం గుండా
  rationale: διά + షష్ఠీ విభక్తి ఒక ప్రదేశం మధ్యగా కదలికను సూచిస్తుంది. సమరయ అనేది ఇక్కడ ప్రాంతమని తెలుగు పాఠకునికి స్పష్టంగా ఉండేందుకు ‘ప్రాంతం’ చేర్చాం.
theological_decisions:
- issue: ἔδει లోని అవసర భావం
  choice: నిజమైన అవసరంగా ‘వెళ్లవలసి వచ్చింది’ అని తెలిపి, దాని ఆధారాన్ని పేర్కొనలేదు.
  alternative: కేవలం భౌగోళిక అవసరం; లేదా యేసు దైవిక కార్యనియోగానికి సంబంధించిన అవసరం
  rationale: ఈ వచనంలోని గ్రీకు అవసరాన్ని స్పష్టంగా చెబుతుంది గాని అది భౌగోళికమా, సామాజిక పరిస్థితికి సంబంధించినదా, దైవిక ఉద్దేశంతో కూడినదా అనేది నిర్దిష్టంగా చెప్పదు. అనువాదం ఆ భావ ఉద్రిక్తతను అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఆయన’ సందర్భానుకూల గౌరవాన్ని నిలుపుతుంది; ‘వెళ్లవలసి వచ్చింది’ అవసరాన్ని తెలియజేస్తూ దాని కారణాన్ని వ్యాఖ్యానించదు.
