  yaml_path: translation/nt/john/004/041.yaml
  text: And many more believed because of his word[b][a],
translation:
  language: te
  text: ఆయన మాటను బట్టి ఇంకా ఎంతోమంది నమ్మారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన సందేశాన్ని బట్టి ఇంకా చాలా ఎక్కువమంది నమ్మారు.’ గ్రీకులో తులనాత్మక భావాన్ని బలపరిచే పదప్రయోగం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῷ πλείους
  choice: ఇంకా ఎంతోమంది
  rationale: πολλῷ అనే దత్తివిభక్తి రూపం πλείους అనే తులనాత్మక పదాన్ని బలపరుస్తుంది. ‘ఇంకా ఎంతోమంది’ అనేది ముందటి వచనంతో పోలిస్తే సంఖ్య గణనీయంగా పెరిగిందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπίστευσαν
  choice: నమ్మారు
  rationale: πιστεύω యొక్క భూతకాల క్రియారూపానికి ‘నమ్మారు’ నేరమైన, సహజమైన అనువాదం. మూలంలో లేని ఆరంభ భావాన్ని లేదా విస్తృతమైన సిద్ధాంతపరమైన పదబంధాన్ని ఇది చేర్చదు.
- source_word: διὰ
  choice: బట్టి
  rationale: ద్వితీయావిభక్తితో వచ్చిన διά ఇక్కడ కారణాన్ని సూచిస్తుంది. ‘ఆయన మాటను బట్టి’ అనేది వారు నమ్మడానికి ఆయన పలికిన మాట కారణమైందనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λόγον
  choice: మాటను
  rationale: λόγος ఇక్కడ యేసు పలికిన మాట లేదా సందేశాన్ని సూచిస్తుంది. ‘మాట’ యోహాను సువార్తలోని పదప్రతిధ్వనిని సాధ్యమైనంతవరకు నిలుపుతూ సందర్భంలో సహజంగా ఉంటుంది.
- source_word: αὐτοῦ
  choice: ఆయన
  rationale: సమీప సందర్భంలో ఈ సర్వనామం యేసును సూచిస్తుంది. గౌరవప్రదమైన ఆధునిక తెలుగు వాడుకకు అనుగుణంగా ‘ఆయన’ ఎంచుకోబడింది.
theological_decisions:
- issue: రక్షణ సందర్భంలోని πιστεύω పదానికి అనువాదం
  choice: నమ్మారు
  alternative: విశ్వాసంలోకి వచ్చారు; ఆయనపై విశ్వాసముంచారు
  rationale: గ్రీకు వాక్యం కేవలం ‘నమ్మారు’ అని చెబుతుంది; ఈ వచనంలో క్రియకు స్పష్టమైన కర్మ లేదు. కాబట్టి సందర్భం యేసునే వారు నమ్మిన వ్యక్తిగా సూచించనిస్తూనే, మూలంలో లేని విస్తృత సిద్ధాంతపరమైన వివరణను అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘మాట’ అనే ఎంపిక λόγος పదానికి ఉన్న యోహానీయ ప్రతిధ్వనిని నిలుపుతుంది; పాదసూచికలో ‘సందేశం’ అనే సందర్భానుకూల ప్రత్యామ్నాయం మరియు బలపరచిన తులనాత్మక భావం ఇవ్వబడ్డాయి.
