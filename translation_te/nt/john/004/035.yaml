id: JHN.4.35
reference: John 4:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς λέγετε ὅτι Ἔτι τετράμηνός ἐστιν καὶ ὁ θερισμὸς ἔρχεται; ἰδοὺ λέγω ὑμῖν, ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν καὶ θεάσασθε τὰς χώρας ὅτι λευκαί εἰσιν πρὸς θερισμόν· ἤδη
base_translation:
  language: en
  yaml_path: translation/nt/john/004/035.yaml
  text: 'Do you not say[a], ‘There are still four months, and then the harvest comes’? Look, I tell you: lift up your eyes and see the fields, that they are white for harvest already.'
translation:
  language: te
  text: '“ఇంకా నాలుగు నెలలు ఉన్నాయి; ఆ తర్వాత కోతకాలం వస్తుంది అని మీరు అంటారు కదా? ఇదిగో, నేను మీతో చెబుతున్నాను: మీ కళ్లు పైకెత్తి పొలాలను చూడండి; అవి కోతకు ఇప్పటికే తెల్లగా ఉన్నాయి.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అవి కోతకు పండివున్నాయి.” గ్రీకులో అక్షరార్థంగా “తెల్లగా” అని ఉంది; అది దృశ్యమైన కోత రూపకాన్ని నిలుపుతూ పంట సిద్ధంగా ఉందని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὑμεῖς λέγετε
  choice: మీరు అంటారు కదా?
  rationale: గ్రీకు ప్రతికూల ప్రశ్నలోని నిరీక్షిత సమ్మతిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ὑμεῖς లోని ఉద్ఘాటన ‘మీరు’ ద్వారా నిలుస్తుంది.
- source_word: Ἔτι τετράμηνός ἐστιν
  choice: ఇంకా నాలుగు నెలలు ఉన్నాయి
  rationale: కోతకు ముందు మిగిలి ఉన్న కాలవ్యవధిని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ὁ θερισμὸς ἔρχεται
  choice: కోతకాలం వస్తుంది
  rationale: వర్తమానకాల భావాన్ని నిలుపుతూ, ‘కోత వస్తుంది’ కంటే తెలుగులో సహజమైన వ్యవసాయ ప్రయోగాన్ని వాడుతుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రోతల దృష్టిని ఆకర్షించే గ్రీకు సంభాషణా సూచకానికి ప్రస్తుత, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν
  choice: మీ కళ్లు పైకెత్తి
  rationale: కేవలం ‘పైకి చూడండి’ అని సరళీకరించకుండా మూలంలోని దృశ్యమైన నుడికారాన్ని నిలుపుతుంది.
- source_word: θεάσασθε
  choice: చూడండి
  rationale: శ్రద్ధగా పరిశీలించమనే ఆజ్ఞను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τὰς χώρας
  choice: పొలాలను
  rationale: కోత సందర్భంలో χώρας సాగుచేసే పొలాలను సూచించడం అత్యంత సహజం.
- source_word: λευκαί εἰσιν
  choice: తెల్లగా ఉన్నాయి
  rationale: ‘పండివున్నాయి’ అని భావాన్ని మాత్రమే చెప్పకుండా గ్రీకు మూలంలోని తెలుపు అనే దృశ్యరూపకాన్ని నిలుపుతుంది.
- source_word: πρὸς θερισμόν
  choice: కోతకు
  rationale: సంక్షిప్తంగా కోత లక్ష్యాన్ని తెలియజేస్తూ వ్యవసాయ రూపకాన్ని కాపాడుతుంది.
- source_word: ἤδη
  choice: ఇప్పటికే
  rationale: నాలుగు నెలలు వేచి ఉండాలనే సామెతకు విరుద్ధంగా, పొలాలు ఇప్పుడు కోత స్థితిలో ఉన్నాయనే ఉద్ఘాటనను నిలుపుతుంది.
theological_decisions:
- issue: కోత మాటను ప్రధాన పాఠ్యంలో అక్షరార్థ వ్యవసాయ దృశ్యంగా ఉంచాలా, ఆధ్యాత్మిక అర్థాన్ని స్పష్టంగా చేర్చాలా
  choice: ప్రజలను సమకూర్చే సేవను నేరుగా ప్రస్తావించకుండా వ్యవసాయ రూపకాన్ని యథాతథంగా ఉంచడం
  alternative: ‘ప్రజలు సమకూర్చబడటానికి సిద్ధంగా ఉన్నారు’ వంటి వ్యాఖ్యానాత్మక అనువాదం
  rationale: సందర్భంలో ఆధ్యాత్మిక లేదా సేవాసంబంధ అన్వయం ఉన్నప్పటికీ, గ్రీకు వాక్యం కోత రూపకాన్నే ఉపయోగిస్తుంది; అందువల్ల అనువాదం ఆ ఉద్రిక్తతను వ్యాఖ్యానంతో పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మీ కళ్లు పైకెత్తి’ మరియు ‘తెల్లగా ఉన్నాయి’ అనే రూపాలు మూలంలోని స్పష్టమైన దృశ్యభాషను కాపాడుతాయి; పాదసూచిక గుర్తు సంబంధిత పదబంధం వద్ద ఉంచబడింది.
