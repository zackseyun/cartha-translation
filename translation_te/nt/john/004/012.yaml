id: JHN.4.12
reference: John 4:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἰακώβ, ὃς ἔδωκεν ἡμῖν τὸ φρέαρ καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν καὶ οἱ υἱοὶ αὐτοῦ καὶ τὰ θρέμματα αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/012.yaml
  text: Are you greater than our father Jacob[a], who gave us the well and drank from it himself, as did his sons and his livestock?
translation:
  language: te
  text: మా తండ్రియైన యాకోబుకంటే మీరు గొప్పవారా?[a] ఆయన మాకు ఈ బావిని ఇచ్చాడు; తానే దానిలోనుండి తాగాడు; ఆయన కుమారులూ ఆయన పశువులూ కూడా దానిలోనుండి తాగాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత స్పష్టంగా: “మా తండ్రియైన యాకోబుకంటే మీరు గొప్పవారు కారు కదా?” గ్రీకు ప్రశ్న ప్రతికూల జవాబును ఆశిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ σὺ
  choice: నువ్వు ... గొప్పవాడివా?
  rationale: μήతో మొదలైన ప్రశ్నకు ‘కాదు’ అనే జవాబు వస్తుందని మాట్లాడేవారు ఆశిస్తున్నారు. తెలుగులో సహజమైన ప్రశ్నారూపాన్ని ఉంచి, ఆ భావాన్ని పాదటిప్పణిలో స్పష్టం చేశాం; σὺలోని ఉద్ఘాటనను ‘నువ్వు’ వ్యక్తపరుస్తుంది.
- source_word: μείζων
  choice: గొప్పవాడివా
  rationale: ఇక్కడ పోలిక శరీర పరిమాణానికి సంబంధించినది కాదు; హోదా లేదా మహత్తుకు సంబంధించినది. అందువల్ల ‘గొప్పవాడు’ సహజమైన ఎంపిక.
- source_word: τοῦ πατρὸς ἡμῶν Ἰακώβ
  choice: మన తండ్రి యాకోబుకంటే
  rationale: ఇది సమరయ స్త్రీ యాకోబును తమ పూర్వికుడిగా గౌరవంగా పేర్కొనడాన్ని నిలుపుతుంది. సంభాషణలో యేసును కూడా కలుపుకొని ఉమ్మడి పూర్వికత్వాన్ని సూచించే ‘మన’ సహజంగా ఉంది.
- source_word: ἔδωκεν ἡμῖν
  choice: మాకు ... ఇచ్చాడు
  rationale: అయోరిస్టును గతంలో జరిగిన చారిత్రక కార్యంగా సరళ భూతకాలంలో అనువదించాం.
- source_word: τὸ φρέαρ
  choice: ఈ బావిని
  rationale: φρέαρ ఇక్కడ నీరు తీసుకునే బావిని సూచిస్తుంది; ‘బావి’ ఆధునిక తెలుగులో స్పష్టమైన, సందర్భోచిత పదం.
- source_word: καὶ αὐτὸς
  choice: ఆయనా
  rationale: αὐτόςలోని ఉద్ఘాటనను ‘ఆయనా’ సహజంగా తెలియజేస్తుంది; యాకోబుపట్ల గౌరవసూచక ఏకవచనం వాడాం.
- source_word: ἐξ αὐτοῦ
  choice: దీనిలోనుంచే
  rationale: సర్వనామం బావిని సూచిస్తుంది. ‘లోనుంచే’ నీటిని బావి నుంచి తాగడాన్ని, అలాగే గ్రీకు వాక్యంలో అన్ని కర్తలకు వర్తించే ఉమ్మడి మూలాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἔπιεν
  choice: తాగారు
  rationale: అయోరిస్టును సరళ భూతకాలంగా అనువదించాం. యాకోబుకు గౌరవ బహువచనం మరియు తరువాతి బహువచన కర్తలతో సరిపోయే రూపం ఇది.
- source_word: οἱ υἱοὶ αὐτοῦ
  choice: ఆయన కుమారులు
  rationale: υἱοί ప్రత్యేకంగా కుమారులను సూచిస్తుంది; లింగనిర్దిష్ట అర్థాన్ని నిలుపుకున్నాం.
- source_word: τὰ θρέμματα αὐτοῦ
  choice: ఆయన పశువులు
  rationale: θρέμματα పెంచబడే ఇంటి జంతువులు లేదా పశుసంపదను విస్తృతంగా సూచిస్తుంది. ‘పశువులు’ దానిని ఏ ఒక్క జాతికీ పరిమితం చేయకుండా సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: μήతో ప్రవేశపెట్టిన అలంకారిక ప్రశ్న బలం
  choice: ‘కాదు’ అనే సమాధానాన్ని ఆశించే ప్రశ్నారూపం; ప్రధాన పాఠ్యంలో సహజమైన ప్రశ్న, పాదటిప్పణిలో ఆశించిన ప్రతికూల సమాధానం
  alternative: ‘మన తండ్రి యాకోబుకంటే నువ్వు గొప్పవాడివి కావు కదా?’ అని ప్రతికూల నిరీక్షణను ప్రధాన పాఠ్యంలోనే స్పష్టంగా చెప్పడం
  rationale: గ్రీకు μή మాట్లాడేవారి ప్రతికూల నిరీక్షణను సూచిస్తుంది. ప్రధాన పాఠ్యంలో ప్రశ్న యొక్క సవాలుతో కూడిన సహజ స్వరాన్ని ఉంచి, పాదటిప్పణి ద్వారా దాని వ్యాకరణ బలాన్ని పాఠకునికి తెలియజేయడం మూలంలోని ఉద్రిక్తతను అనవసరంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలిని వాడాం. స్త్రీ యేసుతో నేరుగా మాట్లాడుతున్నందున ‘నువ్వు’ను ఉంచాం; యాకోబు పూర్వికుడిగా గౌరవింపబడుతున్నందున ‘ఆయన’ మరియు గౌరవ బహువచన క్రియారూపాన్ని వాడాం. గ్రీకు సమన్వయ నిర్మాణాన్ని తెలుగులో సులభంగా చదవదగిన రెండు భాగాల వాక్యంగా మలిచాం.
