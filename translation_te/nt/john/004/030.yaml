  text: They went out of the city and were coming to him[a].
translation:
  language: te
  text: వారు పట్టణం నుండి బయటికి వచ్చి ఆయన దగ్గరికి వస్తూ ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు పట్టణం నుండి బయటికి వచ్చి ఆయనవైపు వెళ్తూ ఉన్నారు.’
    reason: ἤρχοντο అనే క్రియను కథనం యొక్క దృష్టికోణాన్ని బట్టి ‘వస్తూ ఉన్నారు’ లేదా ‘వెళ్తూ ఉన్నారు’ అని అనువదించవచ్చు; ఈ ప్రత్యామ్నాయం కొనసాగుతున్న కదలిక భావాన్ని కాపాడుతుంది.
lexical_decisions:
- source_word: ἐξῆλθον
  choice: బయలుదేరి
  rationale: ἐξέρχομαι అనే క్రియ ఇక్కడ ఒక నిర్దిష్ట స్థలం లోపలి నుండి వెలుపలికి రావడాన్ని సూచిస్తుంది. ‘బయలుదేరి’ సహజమైన తెలుగులో ఆ నిష్క్రమణ భావాన్ని తెలియజేస్తుంది.
- source_word: ἐκ τῆς πόλεως
  choice: పట్టణం నుండి
  rationale: ἐκ కదలిక ప్రారంభమైన స్థలాన్ని సూచిస్తుంది; πόλις సందర్భానుసారం పట్టణం లేదా నగరం కావచ్చు. సమరయలోని ఈ నివాసస్థలానికి ఆధునిక తెలుగులో ‘పట్టణం’ సహజంగా ఉంటుంది.
- source_word: ἤρχοντο
  choice: వస్తూ ఉన్నారు
  rationale: ἔρχομαι యొక్క imperfect రూపం గతంలో కొనసాగుతున్న కదలికను చూపుతుంది. ‘వస్తూ ఉన్నారు’ ఆ కొనసాగుతున్న చర్యను కాపాడుతుంది.
- source_word: πρὸς αὐτόν
  choice: ఆయన దగ్గరికి
  rationale: πρός + accusative ఒక వ్యక్తివైపు కదలికను సూచిస్తుంది. గౌరవార్థకమైన ‘ఆయన’ యేసును సూచించగా, ‘దగ్గరికి’ ఆయనను చేరుకునే దిశను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
