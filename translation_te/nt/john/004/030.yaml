translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. గ్రీకు aorist క్రియను ‘బయలుదేరి’తో, imperfect క్రియలోని కొనసాగుతున్న భావాన్ని ‘వస్తూ ఉన్నారు’తో వేరు చేసి చూపించాం.
