id: JHN.4.9
reference: John 4:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ἡ γυνὴ ἡ Σαμαρῖτις· Πῶς σὺ Ἰουδαῖος ὢν παρ’ ἐμοῦ πεῖν αἰτεῖς ⸂γυναικὸς Σαμαρίτιδος οὔσης⸃; οὐ γὰρ συγχρῶνται Ἰουδαῖοι Σαμαρίταις.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/009.yaml
  text: So the Samaritan woman said to him[a], “How is it that you, being a Jew, ask for a drink from me, a Samaritan woman?” (For Jews do not associate with Samaritans.)
translation:
  language: te
  text: అప్పుడు ఆ సమరయ స్త్రీ ఆయనతో, “నీవు యూదుడివై ఉండి, సమరయ స్త్రీనైన నా దగ్గర తాగడానికి నీళ్లు ఎలా అడుగుతున్నావు?” అని అడిగింది. (ఎందుకంటే యూదులు సమరయులతో కలిసిమెలసి ఉండరు.[a])
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదులు సమరయులతో ఎలాంటి సంబంధాలు కలిగివుండరు.” ఇక్కడ వారు పాత్రలు వంటి వస్తువులను ఉమ్మడిగా ఉపయోగించరు అనే మరింత నిర్దిష్ట భావం కూడా ఉండవచ్చు.
    reason: συγχρῶνται అనే గ్రీకు క్రియ సామాజికంగా సహవసించడం లేదా వస్తువులను కలిసి/ఉమ్మడిగా ఉపయోగించడం అనే భావాన్ని సూచించవచ్చు.
lexical_decisions:
- source_word: λέγει οὖν
  choice: అప్పుడు ... అడిగింది
  rationale: οὖν ఇక్కడ కథన పురోగతిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ సహజంగా ఆ అనుసంధానాన్ని తెలియజేస్తుంది. ప్రత్యక్ష వాక్యం ప్రశ్న కావడంతో ‘అడిగింది’ సందర్భానుకూలం.
- source_word: ἡ γυνὴ ἡ Σαμαρῖτις
  choice: ఆ సమరయ స్త్రీ
  rationale: పునరుక్త నిర్దిష్ట ఉపపదాలు ముందే పరిచయమైన స్త్రీని ప్రత్యేకంగా గుర్తిస్తాయి; ‘ఆ సమరయ స్త్రీ’ ఆమె లింగ, సామాజిక-జాతి గుర్తింపులను నిలుపుతుంది.
- source_word: Πῶς
  choice: '... అడుగుతున్నావేమిటి?'
  rationale: ఇది కేవలం విధానాన్ని ప్రశ్నించడం కాక, సామాజికంగా అసాధారణమైన అభ్యర్థనపై ఆశ్చర్యాన్ని వ్యక్తం చేస్తుంది; తెలుగు ప్రశ్నాంతంలోని ‘ఏమిటి?’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: Ἰουδαῖος
  choice: యూదుడు
  rationale: ఇక్కడ సమరయులతో పోల్చబడుతున్నది ప్రాంతీయ నివాసం మాత్రమే కాదు, సామాజిక-మత సమూహ గుర్తింపు; అందువల్ల ‘యూదుడు’ తగినది.
- source_word: ὢν
  choice: '...వై ఉండి'
  rationale: కృదంతం నేపథ్య పరిస్థితిని ఇస్తుంది; ‘వై ఉండి’ కారణం లేదా విరోధాన్ని అతిగా నిర్ధారించకుండా గ్రీకు నిర్మాణంలోని సంబంధాన్ని నిలుపుతుంది.
- source_word: παρ’ ἐμοῦ πεῖν αἰτεῖς
  choice: నన్ను తాగడానికి నీళ్లు అడుగుతున్నావు
  rationale: αἰτέω + πεῖν తాగేందుకు అడగడాన్ని సూచిస్తుంది. బావి సందర్భంలో తెలుగులో ‘తాగడానికి నీళ్లు’ స్పష్టంగా, సహజంగా ఉంటుంది; మూలంలోని ‘నా నుండి’ భావం ‘నన్ను ... అడుగుతున్నావు’లో వ్యక్తమవుతుంది.
- source_word: γυναικὸς Σαμαρίτιδος οὔσης
  choice: సమరయ స్త్రీనైన నన్ను
  rationale: స్త్రీ తనను తాను మొదటి పురుషలో గుర్తించుకుంటూ, తన ఆశ్చర్యానికి నేపథ్యాన్ని చెబుతుంది; ఈ తెలుగు నిర్మాణం ఆ స్వీయ గుర్తింపును, కృదంత భావాన్ని కాపాడుతుంది.
- source_word: συγχρῶνται
  choice: సంబంధాలు పెట్టుకోరు
  rationale: క్రియకు సామాజికంగా మెలగడం లేదా కలిసివాడడం అనే విస్తృత భావం ఉండవచ్చు. ప్రధాన పాఠంలో విస్తృత సామాజిక దూరాన్ని సహజ తెలుగులో ఇచ్చి, వస్తువులు ఉమ్మడిగా వాడకపోవడం అనే నిర్దిష్ట సాధ్యతను పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: యోహాను సువార్తలో Ἰουδαῖος అర్థం
  choice: యూదుడు
  alternative: యూదయవాడు
  rationale: ఈ సందర్భంలో యూదులు, సమరయులు సామాజిక-మత సమూహాలుగా పరస్పరం ఎదురుగా నిలుస్తున్నారు; కేవలం యూదయ ప్రాంతానికి చెందినవాడు అనే భావం ప్రధానంగా లేదు.
- issue: συγχρῶνται భావపరిధి
  choice: సాధారణ సామాజిక సంబంధాలు పెట్టుకోవడం
  alternative: పాత్రల వంటి వస్తువులను ఉమ్మడిగా వాడడం లేదా పంచుకోవడం
  rationale: వివరణాత్మక వాక్యం రెండు సమూహాల మధ్య ఉన్న విస్తృత సామాజిక దూరాన్ని సూచించగలదు. అయితే నీళ్లు తాగే పాత్ర తక్షణ సందర్భంలో ఉన్నందున నిర్దిష్టమైన ‘ఉమ్మడి వాడకం’ భావమూ సాధ్యమే; దానిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. ‘సమరయ’ అనే స్థిరమైన బైబిలు భౌగోళిక-సమూహ పదాన్ని ఉంచాం. మూలంలోని వివరణాత్మక పక్కవాక్యాన్ని కుండలీకరణలో నిలిపి, [a] గుర్తును ప్రధాన పాఠంలో చేర్చాం.
