id: JHN.4.10
reference: John 4:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Εἰ ᾔδεις τὴν δωρεὰν τοῦ θεοῦ καὶ τίς ἐστιν ὁ λέγων σοι· Δός μοι πεῖν, σὺ ἂν ᾔτησας αὐτὸν καὶ ἔδωκεν ἄν σοι ὕδωρ ζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/010.yaml
  text: Jesus answered and said to her[a], “If you knew the gift of God, and who it is who says to you, ‘Give me a drink,’ you would have asked him, and he would have given you living water.”
translation:
  language: te
  text: 'యేసు ఆమెకు జవాబిచ్చి ఇలా అన్నాడు: “దేవుని బహుమానం ఏమిటో, ‘నాకు తాగడానికి ఇవ్వు’ అని నీతో చెబుతున్నవాడు ఎవరో నీకు తెలిసి ఉంటే, నువ్వే ఆయనను అడిగి ఉండేదానివి; ఆయన నీకు జీవజలాన్ని[a] ఇచ్చి ఉండేవాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రవహించే నీరు,” “తాజా నీరు.” ఈ పదబంధం ప్రవహించే నీటిని సూచించగలదు; అయితే ఇక్కడ యేసు ఉద్దేశించిన ద్వంద్వార్థాన్ని “జీవజలం” నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: జవాబిస్తూ ఇలా అన్నాడు
  rationale: గ్రీకు భాషలోని జవాబివ్వడం–చెప్పడం అనే ద్వంద్వ వాక్యసూత్రాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో ప్రతిబింబిస్తుంది.
- source_word: τὴν δωρεὰν τοῦ θεοῦ
  choice: దేవుని బహుమానం
  rationale: దేవుడు ఉచితంగా ఇచ్చే వరం అనే భావాన్ని ‘బహుమానం’ సహజంగా తెలియజేస్తుంది; షష్ఠీ విభక్తిలోని సాధ్యమైన సంబంధాన్ని ముందుగానే కేవలం ‘దేవుని నుండి’ అని పరిమితం చేయదు.
- source_word: τίς ἐστιν ὁ λέγων σοι
  choice: నీతో చెబుతున్నవాడు ఎవరో
  rationale: వర్తమాన కృదంత భావాన్నీ, మాట్లాడుతున్న వ్యక్తి గుర్తింపుపై ఉన్న ఉద్ఘాటననూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: Δός μοι πεῖν
  choice: నాకు తాగడానికి ఇవ్వు
  rationale: గ్రీకు ఆజ్ఞార్థకం మరియు క్రియార్థక రూపానికి దగ్గరగా ఉండి, తెలుగులో సహజంగా ఉంది; సందర్భంలో నీరు అనే పదాన్ని అనవసరంగా చేర్చదు.
- source_word: ᾔτησας
  choice: నువ్వే ఆయనను అడిగి ఉండేదానివి
  rationale: స్త్రీని ఉద్దేశించిన అవాస్తవ గత షరతు భావాన్ని తెలుగులో స్పష్టంగా చూపుతుంది; ‘నువ్వే’ అనే రూపం గ్రీకులోని ఉద్ఘాటిత σὺను ప్రతిబింబిస్తుంది.
- source_word: ἔδωκεν ἄν
  choice: ఆయన నీకు … ఇచ్చి ఉండేవాడు
  rationale: ἄνతో కూడిన ఫలిత వాక్యంలోని అవాస్తవ గత సాధ్యతను సహజమైన తెలుగు షరతు నిర్మాణంతో తెలియజేస్తుంది.
- source_word: ὕδωρ ζῶν
  choice: జీవజలం
  rationale: ప్రవహించే లేదా తాజా నీరు అనే భౌతిక భావాన్నీ, యోహాను సందర్భంలోని లోతైన ఆధ్యాత్మిక భావాన్నీ ఒకేసారి నిలుపగల స్థిరమైన తెలుగు బైబిలు పదబంధం.
theological_decisions:
- issue: ὕδωρ ζῶν లోని భౌతిక–ప్రతీకాత్మక ద్వంద్వార్థం
  choice: జీవజలం
  alternative: ప్రవహించే నీరు; తాజా నీరు
  rationale: యేసు మాటలు సాధారణ నీటి స్థాయిలో అర్థమయ్యేలా ఉండటంతో పాటు లోతైన ఆధ్యాత్మిక వాస్తవాన్ని సూచిస్తాయి. ‘జీవజలం’ ఆ ఉద్దేశపూర్వక ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కథనశైలి. యేసుకు ‘ఆయన’ అనే గౌరవ సూచక సర్వనామం వాడబడింది; సమరయ స్త్రీని నేరుగా ఉద్దేశించే ఏకవచన రూపాలు సందర్భానుగుణంగా ఉంచబడ్డాయి.
