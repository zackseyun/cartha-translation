revisions:
- from: అయితే యేసు స్వయంగా బాప్తిస్మం ఇస్తూ ఉండలేదు[a]; ఆయన శిష్యులే ఇస్తూ ఉండేవారు—
  to: అయినప్పటికీ, యేసు స్వయంగా బాప్తిస్మం ఇస్తూ ఉండలేదు[a]; కాని ఆయన శిష్యులు ఇస్తూ ఉండేవారు—
  rationale: The revision renders καίτοιγε with a clearly concessive connector and ἀλλά with an explicit adversative, while retaining the emphatic ‘స్వయంగా,’ the imperfect nuance, the conventional baptism terminology, and the source text's concluding dash.
