  text: although Jesus himself was not baptizing[a], but his disciples were—
translation:
  language: te
  text: అయినప్పటికీ, యేసు స్వయంగా బాప్తిస్మం ఇస్తూ ఉండలేదు[a]; కాని ఆయన శిష్యులు ఇస్తూ ఉండేవారు—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యేసు స్వయంగా బాప్తిస్మం ఇవ్వలేదు; కాని ఆయన శిష్యులు ఇచ్చారు.’ గ్రీకు క్రియారూపం కొనసాగుతున్న లేదా అలవాటైన చర్యను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καίτοιγε
  choice: అయితే
  rationale: మునుపటి వాక్యంలోని సమాచారానికి విరుద్ధతతో కూడిన వివరణను ఇది పరిచయం చేస్తుంది. ఆధునిక తెలుగులో ‘అయితే’ సహజంగా ఉండి ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: Ἰησοῦς
  choice: యేసు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: αὐτὸς
  choice: స్వయంగా
  rationale: బాప్తిస్మం ఇచ్చింది యేసు వ్యక్తిగతంగా కాదనే గ్రీకు వాక్యంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: οὐκ ἐβάπτιζεν
  choice: బాప్తిస్మం ఇస్తూ ఉండలేదు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించగల కొనసాగుతున్న లేదా అలవాటైన చర్య భావాన్ని సహజమైన తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: ἀλλ’
  choice: శిష్యులే
  rationale: ‘ఏమో గాని/కాని’ అనే యాంత్రిక పునరుక్తి లేకుండా, ‘ఏ’ నొక్కిచెప్పే ప్రత్యయం యేసు మరియు ఆయన శిష్యుల మధ్య గ్రీకు పాఠంలోని స్పష్టమైన వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ఆయన శిష్యులే ఇస్తూ ఉండేవారు
  rationale: గ్రీకులో రెండో భాగంలో విడిచిపెట్టిన ‘బాప్తిస్మం ఇవ్వడం’ అనే క్రియాభావాన్ని తెలుగులో స్పష్టత కోసం పూరిస్తుంది; అదే సమయంలో ‘శిష్యులే’ ద్వారా వ్యత్యాసాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యేసు పరిచర్యలో బాప్తిస్మం ఎవరు ఇచ్చారనే వివరణ
  choice: యేసు స్వయంగా బాప్తిస్మం ఇవ్వలేదు; ఆయన శిష్యులే ఇచ్చేవారు.
  alternative: ‘యేసు బాప్తిస్మం ఇవ్వలేదు; ఆయన శిష్యులు ఇచ్చారు’ అని సాధారణ భూతకాలంలో అనువదించవచ్చు.
  rationale: వ్యక్తిగతంగా యేసు ఇవ్వలేదనే ఉద్ఘాటనను, అలాగే గ్రీకు అసంపూర్ణ భూతకాలం సూచించగల కొనసాగుతున్న లేదా అలవాటైన చర్యను కాపాడుతుంది; పాఠానికి మించిన సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘బాప్తిస్మం ఇవ్వడం’ అనే విస్తృతంగా అర్థమయ్యే బైబిలు పదబంధాన్ని వాడి, అసంపూర్ణ భూతకాల భావాన్ని ‘ఇస్తూ ఉండలేదు/ఇస్తూ ఉండేవారు’ ద్వారా నిలిపాం. చివరి దీర్ఘ గీత తరువాతి వాక్యంతో ఉన్న వాక్యనిర్మాణ సంబంధాన్ని సూచిస్తుంది.
