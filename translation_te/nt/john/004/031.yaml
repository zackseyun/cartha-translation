translation:
  language: te
  text: ఈలోగా[a] శిష్యులు ఆయనను, “రబ్బీ[c], తినండి” అని కోరుతూనే ఉన్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అంతలో.”
    reason: lexical_alternative
  - marker: b
    text: ఈ క్రియను “అడుగుతూ ఉన్నారు” లేదా “పదేపదే అడుగుతూ ఉన్నారు” అని కూడా అనువదించవచ్చు; ఇక్కడ యేసును తినమని కోరుతున్న భావం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: “రబ్బీ” అనేది యూదులు ఉపయోగించే సంబోధనా బిరుదు; దీనికి “బోధకుడు” అనే అర్థం కూడా ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν τῷ μεταξὺ
  choice: ఈలోగా
  rationale: స్త్రీ వెళ్లిన తరువాతి సంఘటనల మధ్యనున్న కాలాన్ని సూచించే ఈ గ్రీకు ప్రయోగానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ἠρώτων
  choice: కోరుతూనే ఉన్నారు
  rationale: ἐρωτάω ఇక్కడ అభ్యర్థించడం అనే భావాన్ని ఇస్తుంది; అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పదేపదే చేసిన అభ్యర్థనను సూచిస్తుంది.
- source_word: αὐτὸν
  choice: ఆయనను
  rationale: సందర్భంలో యేసును సూచించే ప్రత్యక్ష కర్మ సర్వనామం; గౌరవప్రదమైన సహజ తెలుగు రూపం వాడబడింది.
- source_word: οἱ μαθηταὶ
  choice: శిష్యులు
  rationale: నిర్దిష్టమైన, సందర్భంలో ఇప్పటికే తెలిసిన శిష్యుల సమూహాన్ని సూచిస్తుంది; తెలుగులో ప్రత్యేక నిర్దేశక పదం అవసరం లేదు.
- source_word: λέγοντες
  choice: అని
  rationale: వారి అభ్యర్థనలోని మాటలను ప్రధాన క్రియతో సహజంగా కలిపే తెలుగు ఉద్ధరణ నిర్మాణం.
- source_word: Ῥαββί
  choice: రబ్బీ
  rationale: యూదుల సంబోధనా బిరుదును లిప్యంతరీకరించడం ద్వారా యోహాను సువార్తలోని సాంస్కృతిక రూపం నిలుపబడింది.
- source_word: φάγε
  choice: భోజనం చేయండి
  rationale: ఏకవచన ఆజ్ఞార్థక రూపంలోని ‘తిను’ అనే ప్రత్యక్ష భావాన్ని, యేసుతో శిష్యులు మాట్లాడే సందర్భానికి తగిన గౌరవప్రదమైన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
