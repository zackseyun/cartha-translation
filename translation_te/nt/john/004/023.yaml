id: JHN.4.23
reference: John 4:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ ἔρχεται ὥρα καὶ νῦν ἐστιν, ὅτε οἱ ἀληθινοὶ προσκυνηταὶ προσκυνήσουσιν τῷ πατρὶ ἐν πνεύματι καὶ ἀληθείᾳ, καὶ γὰρ ὁ πατὴρ τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/023.yaml
  text: But an hour is coming[a], and is now here, when the true worshipers will worship the Father in spirit and truth; for the Father indeed seeks such people to worship him.
translation:
  language: te
  text: అయితే ఒక సమయం వస్తోంది, అది ఇప్పుడే వచ్చి ఉంది; ఆ సమయంలో నిజమైన ఆరాధకులు తండ్రిని ఆత్మలోను సత్యంలోను[a] ఆరాధిస్తారు. ఎందుకంటే తనను ఆరాధించే అలాంటివారినే తండ్రి వెదుకుతున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరిశుద్ధాత్మలోను సత్యంలోను.’ గ్రీకు పదబంధం పరిశుద్ధాత్మ శక్తితో జరిగే ఆరాధనను, మానవ ఆత్మలో జరిగే ఆరాధనను, లేదా ఆధ్యాత్మిక వాస్తవికతతో గుర్తించబడిన ఆరాధనను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: మునుపటి స్థలకేంద్రీకృత ఆరాధన చర్చకు వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ἔρχεται ὥρα
  choice: ఒక సమయం వస్తోంది
  rationale: ὥρα యోహాను రచనలో ప్రత్యేక భావఛాయ కలిగినప్పటికీ, ఈ సందర్భంలో తెలుగు పాఠకునికి ‘సమయం’ సహజంగా ఉండి రాబోయే నిర్ణీత కాలాన్ని తెలియజేస్తుంది.
- source_word: καὶ νῦν ἐστιν
  choice: అది ఇప్పుడే వచ్చింది
  rationale: రాబోయే సమయం ఇప్పటికే ఆరంభమైందనే realized-present భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οἱ ἀληθινοὶ προσκυνηταὶ
  choice: నిజమైన ఆరాధకులు
  rationale: ἀληθινοίలోని యథార్థమైన, నిజమైన అనే గుణార్థాన్ని కాపాడుతుంది.
- source_word: προσκυνήσουσιν τῷ πατρὶ
  choice: తండ్రిని ఆరాధిస్తారు
  rationale: భవిష్యత్ క్రియను స్పష్టంగా తెలుపుతూ, τῷ πατρί యొక్క లక్ష్యార్థాన్ని సహజ తెలుగు కర్మ నిర్మాణంతో అందిస్తుంది.
- source_word: ἐν πνεύματι καὶ ἀληθείᾳ
  choice: ఆత్మతోను సత్యంతోను
  rationale: ἐν యొక్క సాధన/పరిధి భావాన్ని ఉంచుతూ, πνεῦμα మానవ ఆత్మనా పరిశుద్ధాత్మనా అనే అస్పష్టతను ప్రధాన పాఠంలో పూర్తిగా పరిష్కరించదు.
- source_word: καὶ γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు కారణాన్ని పరిచయం చేస్తుంది; καί యొక్క బలాన్ని తరువాతి ‘అలాంటివారే’లో సహజంగా ప్రతిఫలింపజేస్తుంది.
- source_word: τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν
  choice: తనను ఆరాధించేవారు అలాంటివారే కావాలని తండ్రి కోరుతున్నాడు
  rationale: ζητεῖను ఇక్కడ ‘అలాంటి ఆరాధకులను కోరుతున్నాడు/వెదుకుతున్నాడు’ అనే భావంలో సహజ తెలుగులో వ్యక్తం చేసి, τοιούτους యొక్క రకసూచక బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ἐν πνεύματι యొక్క సూచన
  choice: ప్రధాన పాఠంలో ‘ఆత్మతోను’ అని అనువదించి సూచనను తెరిచి ఉంచడం
  alternative: ‘పరిశుద్ధాత్మ ద్వారా’ లేదా ‘తమ అంతరాత్మతో’
  rationale: గ్రీకులో πνεύματιకి నిర్దిష్ట ఉపపదం లేదు; ఇది పరిశుద్ధాత్మ శక్తిలో ఆరాధనను, మానవ ఆత్మతో ఆరాధనను, లేదా ఆధ్యాత్మిక వాస్తవికతతో కూడిన ఆరాధనను సూచించవచ్చు. ఏ ఒక్క అర్థాన్నీ ప్రధాన పాఠంలో బలవంతంగా నిర్ణయించలేదు.
- issue: ἀληθινοὶ προσκυνηταί యొక్క పరిధి
  choice: ‘నిజమైన ఆరాధకులు’ అనే గుణాత్మక భావం
  alternative: ‘యథార్థ ఆరాధకులు’
  rationale: ఏ మతసమూహాన్నీ ప్రత్యేకంగా గుర్తించకుండా, దేవుని వాస్తవికతకు అనుగుణమైన ఆరాధనను సూచించే యోహానీయ భావాన్ని కాపాడుతుంది.
- issue: ζητεῖ యొక్క భావం
  choice: ‘కోరుతున్నాడు’
  alternative: ‘వెదుకుతున్నాడు’
  rationale: ఇక్కడ తండ్రి అలాంటి ఆరాధకులను అభిలషిస్తున్నాడనే భావం సహజంగా వ్యక్తమవుతుంది; ‘వెదుకుతున్నాడు’ కూడా సాధ్యమైనందున వ్యాఖ్యానాత్మక ప్రత్యామ్నాయంగా గుర్తించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. ‘గడియ’కన్నా ‘సమయం’ను ఎంచుకుని సహజత్వాన్ని పెంచగా, యోహానీయ కాలభావాన్ని వాక్య నిర్మాణంలో నిలిపాం. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
