revisions:
- from: అయితే ఒక సమయం వస్తోంది; అది ఇప్పుడే వచ్చింది. అప్పుడు నిజమైన ఆరాధకులు ఆత్మతోను సత్యంతోను[a] తండ్రిని ఆరాధిస్తారు. ఎందుకంటే తనను ఆరాధించేవారు అలాంటివారే కావాలని తండ్రి కోరుతున్నాడు.
  to: అయితే ఒక సమయం వస్తోంది, అది ఇప్పుడే వచ్చి ఉంది; ఆ సమయంలో నిజమైన ఆరాధకులు తండ్రిని ఆత్మలోను సత్యంలోను[a] ఆరాధిస్తారు. ఎందుకంటే తనను ఆరాధించే అలాంటివారినే తండ్రి వెదుకుతున్నాడు.
  rationale: The revision corrects the substantive shift from ‘seeks’ to ‘wants ... to be,’ preserves the Greek object construction (‘such ones who worship him’), and retains the realized-present aspect of the coming hour. It also improves the footnote so that the alternative reading does not distort the coordinated Greek expression. No disputed theological interpretation is resolved in the main text.
