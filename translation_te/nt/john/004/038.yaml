base_translation:
  language: en
  yaml_path: translation/nt/john/004/038.yaml
  text: I sent you to reap what you have not labored for[a]; others have labored[b], and you have entered into their labor.
translation:
  language: te
  text: మీరు శ్రమించని దానిని కోయడానికి[a] నేను మిమ్మల్ని పంపాను. ఇతరులు శ్రమించారు; మీరు వారి శ్రమలోకి ప్రవేశించారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పంట కోయడానికి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మీరు వారి శ్రమఫలాన్ని పొందారు,’ లేదా ‘వారి పనిలో పాలుపంచుకున్నారు.’ గ్రీకు మూలంలో మరింత అక్షరార్థంగా, ‘మీరు వారి శ్రమలోకి ప్రవేశించారు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλα
  choice: పంపాను
  rationale: సందర్భంలో పూర్తయిన పంపడాన్ని సూచించే aorist క్రియకు సహజమైన తెలుగు భూతకాల రూపం; అదనంగా ‘నియమించాను’ అనే భావాన్ని చేర్చదు.
- source_word: θερίζειν
  choice: కోయడానికి
  rationale: ముందున్న వ్యవసాయ రూపకాన్ని కొనసాగించే ప్రత్యక్ష, సాధారణ తెలుగు పదం.
- source_word: ὃ
  choice: దేనికోసం … దాన్ని
  rationale: నపుంసక సంబంధసర్వనామాన్ని తెలుగులో సహజమైన సంబంధ–ప్రతిసంబంధ నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: κεκοπιάκατε
  choice: కష్టపడలేదు
  rationale: కొపియావో సూచించే శ్రమను స్పష్టంగా తెలియజేస్తూ, గ్రీకు perfect రూపంలోని గత శ్రమకు ప్రస్తుత సంబంధాన్ని సందర్భం ద్వారా నిలుపుతుంది.
- source_word: ἄλλοι
  choice: ఇతరులు
  rationale: ఎవరిని ఉద్దేశించిందో నిర్దిష్టంగా చెప్పకుండా గ్రీకు పదంలోని విస్తృతతను కాపాడుతుంది.
- source_word: κεκοπιάκασιν
  choice: కష్టపడ్డారు
  rationale: మొదటి కొపియావో రూపంతో పదబంధ సంబంధాన్ని నిలుపుతూ, ముందుగా చేసిన శ్రమను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε
  choice: మీరు వారి కష్టంలోకి ప్రవేశించారు
  rationale: ‘వారి శ్రమ ఫలాన్ని పొందారు’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా, ‘వారి కష్టంలోకి ప్రవేశించారు’ అనే గ్రీకు చిత్రణను మరియు దాని ఉద్దేశపూర్వక అసాధారణతను నిలుపుతుంది.
- source_word: ἐγὼ … ὑμεῖς
  choice: నేను … మీరు
  rationale: స్పష్టంగా ఉన్న గ్రీకు సర్వనామాలను తెలుగులో ఉంచి, వక్త మరియు శిష్యుల మధ్య వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: κόπον
  choice: కష్టం
  rationale: కొపియావో క్రియతో భావసంబంధాన్ని నిలుపుతూ, సాధారణ ఆధునిక తెలుగులో శ్రమను సూచిస్తుంది.
theological_decisions:
- issue: పంట కోత రూపకంలోని ‘ఇతరులు’ ఎవరు?
  choice: ‘ఇతరులు’ అనే విస్తృత సూచననే నిలుపడం
  alternative: ప్రవక్తలు, బాప్తిస్మమిచ్చే యోహాను, యేసు, లేదా మునుపటి సాక్షులలో ఒక వర్గంగా నిర్దిష్టీకరించడం
  rationale: ఈ వాక్యం వారి గుర్తింపును నిర్దిష్టంగా చెప్పదు. అందువల్ల అనిశ్చితిని నిలుపుతూ ఏ ప్రత్యేక వ్యాఖ్యానాన్నీ పాఠ్యంలో చేర్చలేదు.
- issue: ‘వారి కష్టంలోకి ప్రవేశించారు’ అనే మాట యొక్క భావం
  choice: గ్రీకు రూపకాన్ని ప్రధాన పాఠ్యంలో యథాశక్తి నిలుపడం
  alternative: ‘వారి కష్టఫలాన్ని పొందారు’ లేదా ‘వారి పనిలో పాలుపంచుకున్నారు’
  rationale: ప్రత్యామ్నాయాలు సాధ్యమైన భావాన్ని స్పష్టం చేసినా, గ్రీకు పాఠ్యం నేరుగా ‘వారి కష్టంలోకి’ అని చెబుతుంది; కాబట్టి వ్యాఖ్యానాత్మక పరిష్కారాన్ని పాదసూచికకే పరిమితం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. వ్యవసాయ రూపకాన్ని కాపాడుతూ, ‘వారి కష్టంలోకి ప్రవేశించారు’ అనే కొంత అసాధారణమైన కానీ మూలానికి సమీపమైన వ్యక్తీకరణను ఉద్దేశపూర్వకంగా నిలిపాం.
