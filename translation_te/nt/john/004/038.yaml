  verdict: revise
  source_fidelity: The draft correctly retains the agricultural metaphor, the broad reference of “others,” and the literal image of entering into others’ labor. However, “దేనికోసం … దాన్ని” changes the Greek relative object (“what/that which”) into a purpose expression (“for what purpose”), so it should be corrected.
  naturalness: The revised wording is modern standard Telugu and keeps the deliberately somewhat marked metaphor “వారి శ్రమలోకి ప్రవేశించారు” without turning it into an interpretive paraphrase.
  terminology: “శ్రమించు/శ్రమ” provides a clearer cognate linkage for both occurrences of κοπιάω and κόπος than the draft’s mixed construction. “కోయడానికి” appropriately renders θερίζειν.
  issues:
  - severity: medium
    issue: “దేనికోసం” is used for ὃ.
    rationale: 'దేనికోసం means “for what purpose,” whereas ὃ is the substantive object of θερίζειν: “what/that which [you have not labored for].” The Telugu should use a relative-object construction such as “మీరు శ్రమించని దానిని.”'
  - severity: low
    issue: The lexical linkage between κοπιάω and κόπος can be more transparent.
    rationale: Using “శ్రమించలేదు/శ్రమించారు/శ్రమ” consistently reflects the repeated Greek labor vocabulary while remaining natural in modern Telugu.
  revised_text: మీరు శ్రమించని దానిని కోయడానికి[a] నేను మిమ్మల్ని పంపాను. ఇతరులు శ్రమించారు; మీరు వారి శ్రమలోకి ప్రవేశించారు.[b]
