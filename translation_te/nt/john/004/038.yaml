  to: మీరు శ్రమించని దానిని కోయడానికి[a] నేను మిమ్మల్ని పంపాను. ఇతరులు శ్రమించారు; మీరు వారి శ్రమలోకి ప్రవేశించారు.[b]
  rationale: The revision corrects the relative-pronoun construction so that it means “what you have not labored for,” rather than “for what purpose you have not labored.” It also uses consistent labor terminology and preserves the source text’s broad ambiguity about the identity of “others.”
