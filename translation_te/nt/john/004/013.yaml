  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Πᾶς ὁ πίνων ἐκ τοῦ ὕδατος τούτου διψήσει πάλιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/013.yaml
  text: Jesus answered and said to her[a], “Everyone who drinks from this water will be thirsty again.”
translation:
  language: te
  text: 'యేసు ఆమెకు జవాబిచ్చి ఇలా అన్నాడు: “ఈ నీళ్లు తాగే ప్రతి ఒక్కరికి మళ్లీ దాహం వేస్తుంది.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: జవాబిస్తూ ఇలా అన్నాడు
  rationale: గ్రీకులోని రెండు క్రియల జవాబు–మాట్లాడే సూత్రాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా వినిపించే రూపం.
- source_word: αὐτῇ
  choice: ఆమెకు
  rationale: సమరయ స్త్రీని సూచించే దత్తివిభక్తి పరోక్ష కర్మను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: Πᾶς ὁ πίνων
  choice: తాగే ప్రతి ఒక్కరికీ
  rationale: వర్తమానకాల ఆర్టిక్యులర్ పార్టిసిపిల్‌లోని సాధారణ, సార్వత్రిక భావాన్ని లింగభేదం లేకుండా సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἐκ τοῦ ὕδατος τούτου
  choice: ఈ నీళ్లు
  rationale: చర్చలో ఉన్న భౌతిక నీటిని సూచించే τούτου యొక్క నిర్దేశక బలాన్ని కాపాడుతుంది; తాగడాన్ని సూచించే తెలుగు వాడుకలో ‘నుండి’ని విడిచిపెట్టడం సహజం.
- source_word: διψήσει πάλιν
  choice: మళ్లీ దాహం వేస్తుంది
  rationale: భవిష్యత్ భావాన్నీ పునరావృత్తినీ సాధారణ ఆధునిక తెలుగు ప్రయోగంతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἀπεκρίθη ... καὶ εἶπεν అనే ద్విక్రియా వాక్యసూత్రం
  choice: జవాబిస్తూ ఇలా అన్నాడు
  alternative: ‘జవాబిచ్చాడు’ లేదా ‘అన్నాడు’ అనే ఒక్క క్రియకు కుదించడం
  rationale: మూలంలోని రెండు క్రియల భావాన్ని అనవసరంగా తొలగించకుండా, తెలుగులో కృత్రిమంగా అనిపించే ‘జవాబిచ్చి అన్నాడు’ రూపాన్ని నివారిస్తుంది.
- issue: Πᾶς ὁ πίνων లోని వ్యాకరణపరమైన పుంలింగ రూపం
  choice: ప్రతి ఒక్కరికీ
  alternative: తాగే ప్రతి పురుషునికీ
  rationale: ఈ నిర్మాణం పురుషులకు మాత్రమే పరిమితం కాదు; సార్వత్రిక భావాన్ని లింగనిరపేక్షంగా అనువదించడం మూలార్థానికి అనుగుణం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. ‘ఈ నీళ్లు’ మరియు ‘దాహం వేస్తుంది’ వంటి సహజ ప్రయోగాలు ఉపయోగించబడ్డాయి.
