  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πέντε γὰρ ἄνδρας ἔσχες, καὶ νῦν ὃν ἔχεις οὐκ ἔστιν σου ἀνήρ· τοῦτο ἀληθὲς εἴρηκας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/018.yaml
  text: For you have had five husbands[a], and the man you now have is not your husband; this you have said truly.
translation:
  language: te
  text: ఎందుకంటే నీకు ఐదుగురు భర్తలు ఉండేవారు[a]; ఇప్పుడు నీతో ఉన్నవాడు నీ భర్త కాడు. నీవు నిజమే చెప్పావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “నీకు ఐదుగురు పురుషులు ఉండేవారు; ఇప్పుడు నీతో ఉన్నవాడు నీ పురుషుడు/భర్త కాడు.” గ్రీకు ἀνήρ అనే పదానికి “పురుషుడు” లేదా “భర్త” అనే అర్థాలు ఉండవచ్చు; ఇక్కడ సందర్భం “భర్త” అనే అర్థానికే అనుకూలంగా ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέντε
  choice: ఐదుగురు
  rationale: వ్యక్తులను లెక్కించే సహజ తెలుగు సంఖ్యారూపం.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి మాట నిజమని యేసు చెప్పడానికి గల కారణాన్ని వివరించే అనుసంధాన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἄνδρας
  choice: భర్తలు
  rationale: ἀνήρ అనే పదానికి ‘పురుషుడు’ లేదా ‘భర్త’ అనే అర్థాలు ఉండగలిగినా, వివాహ సంబంధాన్ని సూచించే ఈ సందర్భంలో ‘భర్తలు’ సహజమైన అర్థం.
- source_word: ἔσχες
  choice: నీకు ... ఉన్నారు
  rationale: గతంలో ఆమెకు ఉన్న వివాహ సంబంధాలను తెలుగులో సహజంగా తెలియజేస్తుంది; సందర్భమే అవి పూర్వ సంబంధాలని స్పష్టం చేస్తుంది.
- source_word: νῦν
  choice: ఇప్పుడు
  rationale: ప్రస్తుత పరిస్థితిని సూచించే సరళమైన కాలవాచకం.
- source_word: ὃν ἔχεις
  choice: నీతో ఉన్నవాడు
  rationale: అక్షరార్థమైన ‘నీవు కలిగియున్నవాడు’ ఆధునిక తెలుగులో అసహజంగా, స్వామ్య భావంతో వినిపిస్తుంది; ‘నీతో ఉన్నవాడు’ ప్రస్తుత సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: οὐκ ἔστιν σου ἀνήρ
  choice: నీ భర్త కాడు
  rationale: సంబంధాన్ని తెలిపే σου మరియు ἀνήρ కలయికకు స్పష్టమైన, సహజమైన తెలుగు రూపం.
- source_word: τοῦτο ἀληθὲς εἴρηκας
  choice: నీవు చెప్పినది నిజమే
  rationale: ఆమె పలికిన మాటను వెనక్కి సూచిస్తూ, అది నిజమని ధృవీకరించే గ్రీకు భావాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ἀνήρ పదం యొక్క రెండు సందర్భాల అర్థం
  choice: మొదటి సందర్భంలో ‘భర్తలు,’ రెండవ సందర్భంలో ‘భర్త’ అని అనువదించడం.
  alternative: రెండు సందర్భాల్లోనూ ‘పురుషులు/పురుషుడు’ అని మరింత అక్షరార్థంగా అనువదించడం.
  rationale: తక్షణ సందర్భం ఆమె గత వివాహ సంబంధాలనూ ప్రస్తుత వివాహేతర సంబంధాన్నీ పరస్పరం భేదపరుస్తోంది. అందువల్ల ‘భర్త’ అనే సందర్భోచిత అర్థం ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది; ఇది అదనపు సిద్ధాంతాన్ని చేర్చడం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన వాక్యనిర్మాణం. ‘నీతో ఉన్నవాడు’ అనే రూపం స్వామ్య భావాన్ని నివారిస్తూ గ్రీకు సంబంధార్థాన్ని సహజంగా అందిస్తుంది; [a] గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
