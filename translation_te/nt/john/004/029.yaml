id: JHN.4.29
reference: John 4:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Δεῦτε ἴδετε ἄνθρωπον ὃς εἶπέ μοι πάντα ⸀ὅσα ἐποίησα· μήτι οὗτός ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/029.yaml
  text: Come[a], see a man who told me everything I have done. Could this be the Messiah?
translation:
  language: te
  text: “రండి, నేను చేసినదంతా నాకు చెప్పిన ఒక మనిషిని చూడండి. ఈయన మెస్సీయా[a] అయి ఉండవచ్చా?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు.”
    reason: χριστός అనే గ్రీకు బిరుదుకు సంప్రదాయ తెలుగు రూపం.
lexical_decisions:
- source_word: Δεῦτε ἴδετε
  choice: వచ్చి చూడండి
  rationale: ఇతరులను నేరుగా ఆహ్వానించే రెండు ఆజ్ఞలను సహజమైన ఆధునిక తెలుగు ప్రయోగంగా కలిపి, ‘రండి, చూడండి’ అనే భావాన్ని నిలిపింది.
- source_word: ἄνθρωπον
  choice: ఒక మనిషిని
  rationale: ఇక్కడ ఈ పదం యేసును సూచించే ఏకవచన పురుష వ్యక్తిని సూచిస్తుంది; మూలంలోని నిర్దిష్ట మానవ సూచనను నిలిపింది.
- source_word: ὃς εἶπέ μοι
  choice: నాకు చెప్పిన
  rationale: తరువాత వచ్చే విషయవాక్యంతో కలిసి λέγω ఇక్కడ ‘నాకు చెప్పిన’ అని సహజంగా అర్థమవుతుంది.
- source_word: πάντα ὅσα ἐποίησα
  choice: నేను చేసినవన్నీ
  rationale: πάντα ὅσα లోని సమగ్రతను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది; గ్రీకు ఏరిస్టు ఆమె గత కార్యాలను సూచిస్తుంది.
- source_word: μήτι
  choice: అయి ఉండవచ్చా?
  rationale: μήτι లోని సందేహభరితమైన, పరిశీలనకు ఆహ్వానించే ప్రశ్నార్థక భావాన్ని కఠినమైన నిరాకరణగా మార్చకుండా నిలిపింది.
- source_word: ὁ χριστός
  choice: మెస్సీయా
  rationale: ఇక్కడ χριστός వ్యక్తినామంలా కాక యూదుల నిరీక్షణలోని అభిషిక్తుని బిరుదుగా వాడబడింది; అందువల్ల అర్థానువాదమైన ‘మెస్సీయా’ సందర్భానికి తగినది.
theological_decisions:
- issue: χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయా
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో ఇది గుర్తించబడిన మెస్సీయా బిరుదుగా పనిచేస్తుంది. ‘మెస్సీయా’ యూదుల మెస్సీయా నిరీక్షణను స్పష్టంగా ఉంచుతుంది; సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదసూచికలో ఇచ్చాం.
- issue: μήτι ప్రశ్నలోని అంచనా లేదా సందేహం
  choice: ఈయన మెస్సీయా అయి ఉండవచ్చా?
  alternative: ఈయన మెస్సీయా కాదా?
  rationale: మూలంలోని ప్రశ్న కొంత ప్రతికూల సమాధానాన్ని ఊహించవచ్చు, కానీ సందర్భంలో స్త్రీ ఇతరులను పరిశీలించమని ఆహ్వానిస్తోంది. ఎటువంటి నిర్ధారణను బలవంతంగా రుద్దకుండా సందేహం మరియు సాధ్యత రెండింటినీ ఎంపిక చేసిన రూపం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవబహువచన ఆహ్వాన రూపం వాడబడింది. మాటల శైలి సహజంగా, సాక్ష్యభరితంగా ఉండేలా చేసి, μήτι లోని సంకోచభరిత ప్రశ్నార్థకతను కాపాడాం.
