id: JHN.4.15
reference: John 4:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ἡ γυνή· Κύριε, δός μοι τοῦτο τὸ ὕδωρ, ἵνα μὴ διψῶ μηδὲ ⸀διέρχωμαι ἐνθάδε ἀντλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/015.yaml
  text: The woman said to him[a], “Lord, give me this water, so that I may not be thirsty or come here to draw.”
translation:
  language: te
  text: ఆ స్త్రీ ఆయనతో, “ప్రభువా,[a] నాకు దాహం వేయకుండా, నీళ్లు తోడుకోవడానికి ఇక్కడికి రాకుండా ఉండేలా ఈ నీటిని నాకు ఇవ్వండి” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అయ్యా”.
    reason: κύριε ఇక్కడ మర్యాదపూర్వక సంబోధనగా కూడా అర్థం కావచ్చు.
lexical_decisions:
- source_word: λέγει
  choice: అంది
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, తెలుగు కథనశైలిలో భూతకాలంలోని ‘అంది’ సహజంగా ఉండి అదే కథన విధిని నిలుపుతుంది.
- source_word: γυνή
  choice: ఆ స్త్రీ
  rationale: సందర్భంలో ఇది సమరయ స్త్రీని సూచిస్తుంది; ‘స్త్రీ’ సహజమైన, సందర్భోచితమైన పదం.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: κύριε అనే సంబోధనకు ‘ప్రభువా’ ప్రధాన అర్థాన్ని, యోహాను సువార్తలో ఉండగల అంతర్లీన భావాన్ని నిలుపుతుంది; మర్యాదపూర్వకమైన ‘అయ్యా’ అనే అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: δός μοι
  choice: నాకు ఇవ్వండి
  rationale: ఆజ్ఞార్థక క్రియను నేరుగా అనువదిస్తూ, సంభాషణలో మర్యాదను తెలిపే ఆధునిక తెలుగు రూపాన్ని ఉపయోగించాం.
- source_word: τοῦτο τὸ ὕδωρ
  choice: ఈ నీటిని
  rationale: గ్రీకు పాఠంలో ఈ వచనంలో ‘జీవజలం’ అని కాక కేవలం ‘ఈ నీరు’ అని ఉంది; అందువల్ల లేని విశేషణాన్ని చేర్చలేదు.
- source_word: ἵνα μὴ διψῶ
  choice: నాకు దాహం వేయకుండా
  rationale: ప్రయోజనాన్ని సూచించే ἵνα μὴ నిర్మాణాన్ని సహజమైన తెలుగు నిషేధ ప్రయోజన రూపంలో అందించాం.
- source_word: μηδὲ διέρχωμαι ἐνθάδε
  choice: మళ్లీ ఇక్కడికి రాకుండా
  rationale: μηδὲ రెండవ ప్రతికూల ఫలితాన్ని కలుపుతుంది. వర్తమాన సంభావనార్థక క్రియలోని పునరావృత భావాన్ని సందర్భానుసారంగా ‘మళ్లీ’ స్పష్టం చేస్తుంది; ἐνθάδεను ‘ఇక్కడికి’గా అనువదించాం.
- source_word: ἀντλεῖν
  choice: నీళ్లు తోడుకోవడానికి
  rationale: బావి సందర్భంలో ἀντλεῖν అంటే నీటిని తోడడం. తెలుగులో కర్మను తెలిపితే వాక్యం సహజంగా, స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: సమరయ స్త్రీ సంబోధనలో κύριος పదం
  choice: ప్రభువా
  alternative: అయ్యా
  rationale: ఈ పదం సాధారణ మర్యాదపూర్వక సంబోధనగానూ, మరింత లోతైన ప్రభు-సూచనగానూ వినిపించవచ్చు. ప్రధాన పాఠంలో ‘ప్రభువా’ ఉంచి, తక్షణ సంభాషణలో సాధ్యమైన ‘అయ్యా’ అర్థాన్ని పాదసూచికలో ఇచ్చి ఆ ఉద్దేశపూర్వక ఉద్వేగాన్ని పరిష్కరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ. ‘ఇవ్వండి’ గౌరవ ఏకవచన సంబోధనను చూపుతుంది. బావి నుంచి నీటిని తీసే చర్యకు సాధారణంగా అర్థమయ్యే ‘నీళ్లు తోడుకోవడం’ వాడాం.
