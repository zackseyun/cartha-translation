revisions:
- from: ఆ స్త్రీ ఆయనతో, “ప్రభువా,[a] నాకు దాహం వేయకుండా, నీళ్లు తోడుకోవడానికి మళ్లీ ఇక్కడికి రాకుండా ఈ నీటిని నాకు ఇవ్వండి” అంది.
  to: ఆ స్త్రీ ఆయనతో, “ప్రభువా,[a] నాకు దాహం వేయకుండా, నీళ్లు తోడుకోవడానికి ఇక్కడికి రాకుండా ఉండేలా ఈ నీటిని నాకు ఇవ్వండి” అంది.
  rationale: A small source-fidelity correction removes the added temporal nuance “మళ్లీ.” The revised syntax keeps the request and its two coordinated purposes together in natural modern Telugu, without resolving the contextual ambiguity of κύριε.
