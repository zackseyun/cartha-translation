id: JHN.4.20
reference: John 4:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ πατέρες ἡμῶν ἐν τῷ ὄρει τούτῳ προσεκύνησαν· καὶ ὑμεῖς λέγετε ὅτι ἐν Ἱεροσολύμοις ἐστὶν ὁ τόπος ὅπου ⸂προσκυνεῖν δεῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/020.yaml
  text: Our fathers worshiped on this mountain[b][a], and you say that in Jerusalem is the place where one must worship.
translation:
  language: te
  text: మన పితరులు ఈ కొండ మీద ఆరాధించారు[a], మరియు మీరు యెరూషలేములో ఆరాధించవలసిన[b] స్థలం ఉందని చెబుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మన పూర్వీకులు ఈ కొండ మీద ఆరాధించారు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘యెరూషలేములో ఆరాధించడం అవసరమని మీరు చెబుతారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: మన పితరులు
  rationale: గ్రీకు నుడికారంలోని సామూహిక వంశపారంపర్య భావాన్ని నిలుపుతుంది. ఆధునిక తెలుగులో ‘మన పూర్వీకులు’ మరింత సహజమైన ప్రత్యామ్నాయం అయినప్పటికీ, ‘పితరులు’ మూలపదానికి దగ్గరగా ఉండి ఈ మత-చారిత్రక సందర్భంలో అర్థమవుతుంది.
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: ఈ కొండ మీద
  rationale: ఆరాధన జరిగిన ప్రదేశాన్ని తెలిపే సహజమైన తెలుగు ప్రయోగం; ἐν యొక్క స్థానార్థాన్ని యథార్థంగా అందిస్తుంది.
- source_word: προσεκύνησαν
  choice: ఆరాధించారు
  rationale: προσκυνέω నమస్కరించడం లేదా సాష్టాంగపడడం అనే భావాలు కలిగి ఉన్నా, సరైన ఆరాధనా స్థలం గురించిన ఈ సందర్భంలో మతపరమైన ‘ఆరాధించారు’ అనేది తగిన అర్థం.
- source_word: ὑμεῖς
  choice: మీరు
  rationale: గ్రీకులో సర్వనామం స్పష్టంగా ఉండి ‘మన పితరులు’తో వ్యత్యాసాన్ని చూపుతుంది; తెలుగులో ‘మీరు’ ఆ వ్యత్యాసాన్ని అదనపు గుర్తింపులు చేర్చకుండా నిలుపుతుంది.
- source_word: καὶ
  choice: అయితే
  rationale: καί రూపపరంగా ‘మరియు’ అయినప్పటికీ, ఇక్కడ రెండు వర్గాల ఆరాధనా స్థల వాదనల మధ్య స్పష్టమైన సంభాషణాత్మక వ్యత్యాసం ఉంది. సహజమైన తెలుగులో ‘అయితే’ ఆ సంబంధాన్ని అతిశయింపకుండా తెలియజేస్తుంది.
- source_word: ἐν Ἱεροσολύμοις
  choice: యెరూషలేములోనే
  rationale: ‘యెరూషలేములో’ స్థానార్థాన్ని సహజంగా అందిస్తుంది. వాక్యంలో నిర్దిష్టమైన ‘స్థలం’ అనే నిర్మాణం తెలిపే ఏకైక స్థల వాదనను తెలుగు ‘నే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ τόπος
  choice: స్థలం
  rationale: నిర్దిష్ట ఆరాధనా ప్రదేశాన్ని సూటిగా తెలియజేస్తుంది; ‘సరైన స్థలం’ వంటి వివరణాత్మక పదాన్ని చేర్చదు.
- source_word: ὅπου προσκυνεῖν δεῖ
  choice: ఆరాధించవలసిన
  rationale: δεῖ యొక్క అవసరత లేదా విధిబద్ధత భావాన్ని సంక్షిప్తమైన, సహజమైన తెలుగు విశేషణ నిర్మాణంలో నిలుపుతుంది; ఎవరు ఆరాధించాలి అనేది మూలంలోలాగే సాధారణంగా ఉంటుంది.
theological_decisions:
- issue: సమరయుల ఆరాధనకూ యూదుల ఆరాధనకూ మధ్య ఉన్న వ్యత్యాసాన్ని మూలం కంటే స్పష్టంగా చేయాలా
  choice: ‘మన పితరులు ... అయితే మీరు ...’ అనే రూపంలో వ్యత్యాసాన్ని మాత్రమే చూపించడం
  alternative: ‘మన సమరయ పితరులు ... యూదులైన మీరు ...’ అని వర్గాలను పేరుపెట్టి విస్తరించడం
  rationale: ఈ వచనంలో గ్రీకు పాఠం సమరయులు, యూదులు అనే పేర్లను చెప్పదు; సర్వనామాలు మరియు సందర్భమే వ్యత్యాసాన్ని తెలియజేస్తాయి. అందువల్ల గుర్తింపులను ప్రధాన పాఠంలో చేర్చలేదు.
- issue: προσκυνεῖν δεῖ లోని వ్యక్తిరహిత అవసరతను ఎలా వ్యక్తం చేయాలి
  choice: ‘ఆరాధించవలసిన స్థలం’
  alternative: ‘ఆరాధించడం అవసరమైన స్థలం’ లేదా ‘ప్రజలు ఆరాధించాల్సిన స్థలం’
  rationale: ఈ రూపం సాధారణమైన విధిబద్ధతను సహజమైన తెలుగులో తెలియజేస్తుంది; నిర్దిష్ట వ్యక్తిని లేదా వర్గాన్ని కర్తగా చేర్చదు.
- issue: యెరూషలేము ఒక్కటే ఆరాధనా స్థలమనే వాదనలోని నిర్దిష్టతను ఎలా తెలియజేయాలి
  choice: ‘యెరూషలేములోనే’
  alternative: ‘యెరూషలేములో’
  rationale: ὁ τόπος అనే నిర్దిష్ట నామవాచకంతో ఏర్పడే ఏకైక-స్థల వాదనను ‘నే’ తెలుగులో సహజంగా అందిస్తుంది. ఇది ఆ వాదనను వక్త చెప్పినదిగా ఉంచుతుంది; దాని సత్యాసత్యాలను అనువాదకుడు తీర్మానించడు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి. ‘పితరులు’ మూలంలోని వంశపారంపర్య నుడికారాన్ని నిలుపుతుంది; పాదసూచికలో మరింత సాధారణమైన ‘పూర్వీకులు’ ఇచ్చాం. ప్రధాన పాఠంలోని ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధం వెంట ఉంచబడింది.
