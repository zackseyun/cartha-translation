  yaml_path: translation/nt/john/004/032.yaml
  text: But he said to them[a], “I have food to eat that you do not know.”
translation:
  language: te
  text: కానీ ఆయన వారితో, “నేను తినడానికి నా దగ్గర మీకు తెలియని ఆహారం ఉంది” అని అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: కానీ
  rationale: శిష్యుల మాటలకు యేసు ఇచ్చిన సమాధానంలో ఉన్న స్వల్ప వ్యత్యాసాన్ని, కథన పురోగతిని సహజంగా తెలియజేస్తుంది.
- source_word: εἶπεν αὐτοῖς
  choice: ఆయన వారితో ... అని అన్నాడు
  rationale: తెలుగు ప్రత్యక్ష వాక్య నిర్మాణానికి సహజమైన రూపం; λέγω మరియు పరోక్ష కర్మ రెండింటినీ ప్రతిబింబిస్తుంది.
- source_word: Ἐγὼ
  choice: నాకు
  rationale: గ్రీకులోని స్పష్టమైన ప్రథమ పురుష సర్వనామానికి అనుగుణంగా, తెలుగులో ‘నాకు’ను ఉంచడం ద్వారా ‘మీకు’తో ఉన్న వ్యత్యాసం సహజంగా వ్యక్తమవుతుంది.
- source_word: βρῶσιν
  choice: ఆహారం
  rationale: ఇక్కడ ఈ పదం తినే క్రియను కాక ఆహారాన్ని సూచిస్తుంది; తరువాతి సందర్భంలో వెల్లడయ్యే రూపకార్థాన్ని ముందుగానే వివరించకుండా నిలుపుతుంది.
- source_word: ἔχω φαγεῖν
  choice: తినడానికి ఉంది
  rationale: ఆహారం తినేందుకు తన వద్ద ఉందనే నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἣν ὑμεῖς οὐκ οἴδατε
  choice: మీకు తెలియని
  rationale: ‘ఆహారం’ను విశేషించే సంబంధవాచక నిర్మాణాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తూ, ὑμεῖςలోని వ్యత్యాసాన్ని ‘మీకు’ ద్వారా నిలుపుతుంది.
theological_decisions:
- issue: యేసు చెప్పిన ‘ఆహారం’ యొక్క రూపకార్థం
  choice: ప్రధాన పాఠ్యంలో ‘ఆహారం’ అనే ప్రత్యక్ష పదాన్నే ఉంచడం
  alternative: ‘మీకు తెలియని పని/ఆత్మీయ పోషణ నాకు ఉంది’ అని రూపకాన్ని వివరించడం
  rationale: తరువాతి సందర్భం దాని రూపకార్థాన్ని వెల్లడిస్తుంది; ఈ వచనంలో దానిని ముందుగానే విప్పి చెప్పడం శిష్యుల అపార్థాన్ని మరియు కథనంలోని ఉద్దేశపూర్వక ఉద్వేగాన్ని తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గంభీరమైన కథన శైలిని నిలుపుతూ అనువదించబడింది. అవసరం లేని పాదసూచికను చేర్చలేదు.
