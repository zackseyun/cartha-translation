  naturalness: ‘నేను తినడానికి నా దగ్గర మీకు తెలియని ఆహారం ఉంది’ అనేది సహజమైన ఆధునిక ప్రామాణిక తెలుగు. ‘నా దగ్గర ఉంది’ అనేది ἔχω యొక్క స్వాధీనార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; ‘నేను’ మరియు ‘మీకు’ మూలంలోని వ్యక్తిగత వ్యత్యాసాన్ని కూడా నిలుపుతాయి.
