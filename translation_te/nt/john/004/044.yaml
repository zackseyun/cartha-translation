id: JHN.4.44
reference: John 4:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: αὐτὸς ⸀γὰρ Ἰησοῦς ἐμαρτύρησεν ὅτι προφήτης ἐν τῇ ἰδίᾳ πατρίδι τιμὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/044.yaml
  text: For Jesus himself testified that a prophet has no honor in his own homeland[a].
translation:
  language: te
  text: ఎందుకంటే, ఒక ప్రవక్తకు తన సొంత ప్రాంతంలో గౌరవం ఉండదని యేసే సాక్ష్యమిచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన సొంత దేశంలో’ లేదా ‘తన స్వస్థలంలో.’ గ్రీకు పదం πατρίς ఒకరి స్వదేశాన్ని, స్వస్థలాన్ని లేదా స్వప్రాంతాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: చుట్టుపక్కల కథనంతో ఈ వాక్యానికి ఉన్న వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో చూపిస్తుంది.
- source_word: αὐτὸς ... Ἰησοῦς
  choice: యేసే
  rationale: αὐτός ఇచ్చే ఉద్ఘాటనను తెలుగులో ‘ఏ’ ప్రత్యయంతో సహజంగా నిలుపుతుంది.
- source_word: ἐμαρτύρησεν
  choice: సాక్ష్యమిచ్చాడు
  rationale: యోహాను సువార్తలో ప్రాముఖ్యమైన సాక్ష్య భాషను నిలుపుతూ, ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: ὅτι
  choice: అని
  rationale: యేసు ఇచ్చిన సాక్ష్యంలోని విషయాన్ని పరిచయం చేసే సహజ తెలుగు పూరక రూపం.
- source_word: προφήτης
  choice: ఒక ప్రవక్త
  rationale: నిర్దిష్ట ఉపపదం లేని ఏకవచనం ఇక్కడ సామెతసదృశమైన సాధారణ సత్యాన్ని సూచిస్తుంది.
- source_word: ἐν τῇ ἰδίᾳ πατρίδι
  choice: తన సొంత ప్రాంతంలో
  rationale: πατρίς సూచించగల స్వదేశం, స్వస్థలం లేదా స్వప్రాంతం అనే విస్తృత భావాన్ని, భౌగోళిక సూచనను సంకుచితం చేయకుండా సహజ తెలుగులో అందిస్తుంది.
- source_word: τιμὴν οὐκ ἔχει
  choice: గౌరవం ఉండదు
  rationale: τιμή అనే నామవాచకాన్ని నిలుపుతూ, గ్రీకు వాక్య నిర్మాణానికి సమీపమైన సహజ తెలుగు వ్యక్తీకరణను ఇస్తుంది.
theological_decisions:
- issue: యోహాను కథనంలో ‘తన సొంత ప్రాంతం’ దేనిని సూచిస్తుందనే ప్రశ్న
  choice: సామెతను సాధారణ రూపంలో అనువదించి, నిర్దిష్ట భౌగోళిక సూచనను నిర్ణయించకుండా ఉంచడం
  alternative: యూదయ, గలిలయ లేదా నజరేతు అని స్పష్టీకరించడం
  rationale: ఈ వచనం ఆ ప్రాంతాన్ని స్పష్టంగా గుర్తించదు. అందువల్ల కథనంలోని నిజమైన వ్యాఖ్యాన ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరమైనప్పటికీ సహజమైన శైలి. ‘యేసే’ మూలంలోని ఉద్ఘాటనను సంక్షిప్తంగా నిలుపుతుంది.
