- from: కాబట్టి అతడు, అతనికి ఏ గంటకు ఆరోగ్యం మెరుగుపడిందో వారిని అడిగాడు. వారు అతనితో, “నిన్న ఏడవ గంటకు[a] జ్వరం అతణ్ణి విడిచిపోయింది” అన్నారు.
  to: కాబట్టి, అతనికి ఏ గంటకు ఆరోగ్యం మెరుగుపడిందో అతడు వారిని అడిగాడు. అప్పుడు వారు అతనితో, “నిన్న ఏడవ గంటకు[a] జ్వరం అతణ్ణి విడిచిపోయింది” అన్నారు.
