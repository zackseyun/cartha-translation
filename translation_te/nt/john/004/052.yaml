id: JHN.4.52
reference: John 4:52
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπύθετο οὖν ⸂τὴν ὥραν παρ’ αὐτῶν⸃ ἐν ᾗ κομψότερον ἔσχεν· ⸂εἶπαν οὖν⸃ αὐτῷ ὅτι ⸀Ἐχθὲς ὥραν ἑβδόμην ἀφῆκεν αὐτὸν ὁ πυρετός.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/052.yaml
  text: So he asked them the hour in which he got better. Then they said to him[a], “Yesterday at the seventh hour the fever left him.”
translation:
  language: te
  text: కాబట్టి, అతనికి ఏ గంటకు ఆరోగ్యం మెరుగుపడిందో అతడు వారిని అడిగాడు. అప్పుడు వారు అతనితో, “నిన్న ఏడవ గంటకు[a] జ్వరం అతణ్ణి విడిచిపోయింది” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సూర్యోదయం నుండి గంటలను లెక్కిస్తే, ‘ఏడవ గంట’ అంటే మధ్యాహ్నం సుమారు ఒక గంట. అయితే యోహాను కాలాన్ని వేరే విధంగా లెక్కించాడని కొందరు భావిస్తారు.
    reason: మూలపాఠ్యం కాలగణన విధానాన్ని నిర్దిష్టం చేయనందున ప్రత్యామ్నాయ అవగాహనను తెలియజేయడం.
lexical_decisions:
- source_word: ἐπύθετο οὖν
  choice: కాబట్టి ... అడిగాడు
  rationale: ἐπύθετο అంటే విచారించి అడగడం; సాధారణ ఆధునిక తెలుగులో ‘అడిగాడు’ సహజం. οὖν ముందరి వాక్యంతో తార్కిక-కథన సంబంధాన్ని చూపుతుంది కాబట్టి ‘కాబట్టి’ వాడాం.
- source_word: τὴν ὥραν παρ’ αὐτῶν
  choice: ఏ గంటకు ... వారిని అడిగాడు
  rationale: గ్రీకులోని ‘వారి దగ్గర గంటను విచారించాడు’ అనే భావాన్ని సహజమైన తెలుగు ప్రశ్నార్థక సంబంధ నిర్మాణంతో వ్యక్తం చేశాం; ὥρα యొక్క ‘గంట’ భావాన్ని నిలిపాం.
- source_word: ἐν ᾗ κομψότερον ἔσχεν
  choice: ఏ గంటకు ఆరోగ్యం మెరుగుపడిందో
  rationale: κομψότερον ἔσχεν అనేది ఆరోగ్యస్థితి మెరుగుపడడాన్ని సూచించే ప్రయోగం. ప్రారంభ క్షణాన్ని గ్రీకు స్పష్టంగా చెప్పనందున ‘కోలుకోవడం మొదలైందో’ అని అదనంగా నిర్ధారించలేదు.
- source_word: εἶπαν οὖν αὐτῷ
  choice: వారు అతనితో ... అన్నారు
  rationale: తెలుగులో ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే సహజ నిర్మాణం; రెండవ οὖνను విడిగా అనువదించకపోయినా కథన క్రమం వాక్యసంధిలో స్పష్టంగా ఉంది.
- source_word: Ἐχθὲς ὥραν ἑβδόμην
  choice: నిన్న ఏడవ గంటకు
  rationale: మూలంలోని కాలగణనను ఆధునిక గడియార సమయంగా మార్చకుండా యథాతథంగా నిలిపి, దాని అస్పష్టతను సంరక్షించాం.
- source_word: ἀφῆκεν αὐτὸν ὁ πυρετός
  choice: జ్వరం అతణ్ణి విడిచిపోయింది
  rationale: గ్రీకులో జ్వరమే కర్తగా ఉండే వ్యక్తీకరణను తెలుగులోనూ సహజంగా నిలిపాం.
theological_decisions:
- issue: ‘ఏడవ గంట’కు ఉపయోగించిన కాలగణన విధానం
  choice: ప్రధాన పాఠ్యంలో ‘ఏడవ గంట’ అని అక్షరార్థ వ్యక్తీకరణను ఉంచడం
  alternative: సూర్యోదయం నుంచి లెక్కిస్తే సుమారు మధ్యాహ్నం ఒక గంట; యోహాను వేరొక కాలగణనను అనుసరించాడని భావిస్తే వేరే సమయం
  rationale: ఈ వచనం ఏ కాలగణన విధానమో నిర్దిష్టంగా చెప్పదు. అందువల్ల ఒక ఆధునిక సమయాన్ని ప్రధాన పాఠ్యంలో నిర్ణయించడం మూలంలోని నిజమైన అస్పష్టతను తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా గౌరవప్రదమైన కథన శైలిని పాటించాం. ‘ఏడవ గంట’ను మార్చకుండా ఉంచి మూలంలోని కాలసంబంధ అస్పష్టతను కాపాడాం.
