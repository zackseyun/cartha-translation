id: JHN.4.28
reference: John 4:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀφῆκεν οὖν τὴν ὑδρίαν αὐτῆς ἡ γυνὴ καὶ ἀπῆλθεν εἰς τὴν πόλιν καὶ λέγει τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/028.yaml
  text: So the woman left her water jar and went into the town and says to the people,
translation:
  language: te
  text: 'కాబట్టి ఆ స్త్రీ తన నీళ్ల కుండను వదిలి, పట్టణంలోకి వెళ్లి, అక్కడి ప్రజలతో ఇలా అంటుంది:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑδρία
  choice: నీళ్ల కుండ
  rationale: నీటిని తెచ్చుకోవడానికి ఉపయోగించే పాత్రను ఆధునిక సాధారణ తెలుగులో సహజంగా, సందర్భానికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: πόλις
  choice: పట్టణం
  rationale: సమరయ ప్రాంతంలోని నివాసస్థలాన్ని సూచించే సాధారణ పదం; మూలంలోని పదానికి తగిన విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: τοῖς ἀνθρώποις
  choice: అక్కడి ప్రజలతో
  rationale: లింగాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా, పట్టణంలోని వారిని సమూహంగా సూచిస్తుంది.
- source_word: λέγει
  choice: ఇలా అంటుంది
  rationale: చారిత్రక వర్తమాన కాలాన్ని మూలంలో ఉన్నట్లే నిలుపుతూ, తరువాత వచ్చే ప్రత్యక్ష సంభాషణను సహజంగా పరిచయం చేస్తుంది.
theological_decisions:
- issue: λέγει అనే చారిత్రక వర్తమాన కాలం
  choice: అంటుంది
  alternative: అంది
  rationale: గ్రీకు పాఠంలోని వర్తమాన క్రియారూపాన్ని ఉద్దేశపూర్వకంగా నిలిపి, కథనంలోని సజీవత్వాన్ని కాపాడుతుంది; దానిని సాధారణ భూతకాలంగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘అక్కడే’ అనేది కుండను వదిలిన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘అక్కడి’ అనేది పట్టణంలోని ప్రజలను స్పష్టం చేస్తుంది.
