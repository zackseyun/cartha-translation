  text: A woman from Samaria came to draw water. Jesus said to her[a], “Give me a drink.”
translation:
  language: te
  text: సమరయ నుండి ఒక స్త్రీ నీళ్లు తోడుకోవడానికి వచ్చింది. యేసు ఆమెతో ఇలా అన్నాడు[a], “నాకు తాగడానికి నీళ్లు ఇవ్వు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “వస్తుంది … అంటాడు”; గ్రీకులో కథనం చెప్పేటప్పుడు చారిత్రక వర్తమాన కాల రూపాలు వాడబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔρχεται
  choice: వచ్చింది
  rationale: కథనంలో ఇది చారిత్రక వర్తమాన కాల ప్రయోగం. ఆధునిక తెలుగు కథనశైలిలో భూతకాలం సహజంగా ఉండి సంఘటన క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: γυνὴ
  choice: ఒక స్త్రీ
  rationale: ఈ సందర్భంలో ఇది నిర్దిష్టంగా భార్యను కాక, అప్పటివరకు పరిచయం చేయని ఒక మహిళను సూచిస్తుంది.
- source_word: ἐκ τῆς Σαμαρείας
  choice: సమరయ ప్రాంతం నుండి
  rationale: ἐκ మూలస్థానాన్ని సూచిస్తుంది. ఇక్కడ సమరయను ప్రాంతంగా గ్రహించడం సహజం; ‘ప్రాంతం’ అనే పదం నగరమనే అపార్థాన్ని తగ్గిస్తుంది, అయితే ఆమె జాతి లేదా మత గుర్తింపును ఈ వాక్యంలో అదనంగా చేర్చదు.
- source_word: ἀντλῆσαι ὕδωρ
  choice: నీళ్లు తోడుకోవడానికి
  rationale: ఉద్దేశాన్ని తెలిపే infinitiveను తెలుగులో ‘-డానికి’తో అందించాం. బావి నుండి నీటిని తీసే చర్యకు ‘నీళ్లు తోడుకోవడం’ సహజమైన తెలుగు ప్రయోగం.
- source_word: λέγει αὐτῇ
  choice: ఆమెతో … అన్నాడు
  rationale: ఇదీ కథన చారిత్రక వర్తమానం. తెలుగు కథనంలో భూతకాల రూపం సహజం; αὐτῇ యొక్క సంబోధన భావాన్ని ‘ఆమెతో’ తెలియజేస్తుంది.
- source_word: Δός μοι πεῖν
  choice: నాకు తాగడానికి నీళ్లు ఇవ్వు
  rationale: అక్షరార్థంగా ‘నేను తాగడానికి నాకు ఇవ్వు’ అనే అభ్యర్థన. సందర్భానుసారం వస్తువు నీరు అని స్పష్టమైనందున, ఆధునిక తెలుగులో సహజంగా ‘నీళ్లు’ను వ్యక్తం చేశాం.
theological_decisions:
- issue: ‘సమరయ’ అనే సూచన యొక్క పరిధి
  choice: సమరయ ప్రాంతం నుండి వచ్చిన స్త్రీ
  alternative: సమరయ పట్టణం నుండి వచ్చిన స్త్రీ; సమరయ స్త్రీ
  rationale: గ్రీకు వాక్యం ఆమెను ‘సమరయ నుండి’ వచ్చినదిగా చెబుతుంది; ఈ వచనంలోనే ‘సమరయ స్త్రీ’ అని జాతి లేదా మత గుర్తింపును నేరుగా పేర్కొనదు. ‘ప్రాంతం’ మూలంలోని భౌగోళిక సూచనను కాపాడుతూ అదనపు నిర్ధారణను నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘నీళ్లు తోడుకోవడానికి’ మరియు ‘తాగడానికి నీళ్లు ఇవ్వు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండే ప్రస్తుత ప్రయోగాలు. ప్రధాన పాఠ్యంలో భూతకాలాన్ని వాడి, గ్రీకు చారిత్రక వర్తమానాన్ని పాదసూచికలో నిలిపాం.
