  yaml_path: translation/nt/john/004/001.yaml
  text: Therefore[a], when Jesus knew that the Pharisees had heard that Jesus was making and baptizing more disciples than John—
translation:
  language: te
  text: కాబట్టి, యేసు యోహాను కంటే ఎక్కువ మంది శిష్యులను శిష్యులుగా మారుస్తూ బాప్తిస్మం ఇస్తున్నాడని పరిసయ్యులు విన్నారని యేసు తెలుసుకున్నప్పుడు—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు యోహాను కంటే ఎక్కువ మంది శిష్యులను శిష్యులుగా మారుస్తున్నాడనీ, బాప్తిస్మం ఇస్తున్నాడనీ.” గ్రీకులో ఈ తులన కేవలం “ఎక్కువ మంది శిష్యులు” అన్న దానికే కాక, శిష్యులను చేయడం మరియు బాప్తిస్మం ఇవ్వడం అనే రెండు కార్యాలకూ వర్తించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς οὖν
  choice: కాబట్టి ... తెలిసినప్పుడు
  rationale: ὡς తెలిపే కాలసంబంధ భావాన్ని ‘తెలిసినప్పుడు’తో, οὖν తెలిపే అన్వయాన్ని లేదా కథన పురోగతిని ‘కాబట్టి’తో నిలిపింది.
- source_word: ἔγνω
  choice: ఆయనకు తెలిసినప్పుడు
  rationale: γινώσκω యొక్క సందర్భోచిత భావం ‘తెలుసుకున్నాడు/తెలిసింది.’ సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణం కోసం ‘ఆయనకు తెలిసినప్పుడు’ అని ఇచ్చాం.
- source_word: οἱ Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: నూతన నిబంధనలో ఈ వర్గానికి వాడుకలో ఉన్న ప్రామాణిక తెలుగు రూపం.
- source_word: ἤκουσαν
  choice: విన్న విషయం
  rationale: యేసుకు తెలిసే సమయానికి పరిసయ్యులు ఆ నివేదికను అప్పటికే విన్నారనే సంఘటనల క్రమం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: πλείονας μαθητὰς
  choice: ఎక్కువమందిని శిష్యులుగా
  rationale: తులనాత్మక విశేషణం మరియు నామవాచకాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ποιεῖ
  choice: శిష్యులుగా చేసుకుంటూ
  rationale: μαθητάςతో కలిసి ποιεῖ ఇక్కడ ‘శిష్యులను చేయడం/సంపాదించడం’ అనే భావాన్ని ఇస్తుంది; ‘చేసుకుంటూ’ సహజంగా ఉండి మూల భావానికి దగ్గరగా ఉంది.
- source_word: βαπτίζει
  choice: బాప్తిస్మమిస్తున్నాడని
  rationale: βαπτίζωకు నూతన నిబంధన సందర్భంలో స్పష్టమైన, స్థిరంగా వాడే తెలుగు పదబంధం.
- source_word: ἢ Ἰωάννης
  choice: యోహాను కంటే
  rationale: గ్రీకు తులనాత్మక నిర్మాణాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యేసే స్వయంగా బాప్తిస్మమిచ్చాడనే సంభావ్య సూచన
  choice: 4:1లోని ఉపరితల వాక్యాన్ని యేసే బాప్తిస్మమిస్తున్నాడని ఉన్నట్లుగానే నిలిపాం.
  alternative: 4:2లో వచ్చే వివరణను ముందుగానే చేర్చి, ‘ఆయన శిష్యులు బాప్తిస్మమిస్తున్నారు’ అని అనువదించడం.
  rationale: యేసు స్వయంగా బాప్తిస్మమివ్వలేదని తరువాతి వచనం వివరిస్తుంది. ఆ వివరణను ఈ వచనంలోకి ముందుగానే తీసుకురాకుండా, మూలపాఠంలోని కథన ఉద్వేగాన్ని నిలిపాం.
- issue: ‘ఎక్కువమంది’ అనే తులన యొక్క పరిధి
  choice: యేసు యోహాను కంటే ఎక్కువమందిని శిష్యులుగా చేసుకుంటూ బాప్తిస్మమిస్తున్నాడనే ప్రధాన పఠనం.
  alternative: శిష్యులను చేయడం, బాప్తిస్మమివ్వడం అనే రెండు కలిపిన కార్యకలాపాల్లో యేసు యోహాను కంటే ఎక్కువ చేస్తున్నాడని గ్రహించడం.
  rationale: గ్రీకు నిర్మాణంలో తులన ‘ఎక్కువమంది శిష్యులు’పై నేరుగా పడుతున్నప్పటికీ, సమన్వయించబడిన రెండు క్రియలకు కలిపి వర్తించే పఠనానికి కూడా అవకాశం ఉంది; దానిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున చివర దీర్ఘవిరామ చిహ్నాన్ని నిలిపాం; పాదసూచిక గుర్తు ప్రధాన పాఠంలో ఉంది.
