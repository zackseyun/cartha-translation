  source_fidelity: The draft accurately conveys the man's hearing, his journey to Jesus, the requested descent and healing, and the son's imminent death. However, the imperfect ἠρώτα is better represented in the main text as an ongoing request ('అడుగుతున్నాడు') rather than relegated entirely to a footnote. Adding 'ఆయనను' also makes explicit that Jesus—not the official—is the one requested to come down and heal.
