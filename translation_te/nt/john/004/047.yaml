id: JHN.4.47
reference: John 4:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτος ἀκούσας ὅτι Ἰησοῦς ἥκει ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν ἀπῆλθεν πρὸς αὐτὸν καὶ ⸀ἠρώτα ἵνα καταβῇ καὶ ἰάσηται αὐτοῦ τὸν υἱόν, ἤμελλεν γὰρ ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/047.yaml
  text: When this man heard that Jesus had come from Judea into Galilee[a], he went to him and asked him to come down and heal his son[b], for he was about to die.
translation:
  language: te
  text: ఆ వ్యక్తి యేసు యూదయ నుంచి గలిలయకు వచ్చాడని విన్నప్పుడు, ఆయన దగ్గరకు వెళ్లి, దిగివచ్చి తన కుమారుణ్ణి స్వస్థపరచమని ఆయనను అడుగుతున్నాడు[a]. ఎందుకంటే అతని కుమారుడు చనిపోబోతున్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అడిగాడు.” గ్రీకు ఇంపర్ఫెక్ట్ క్రియ కొనసాగుతున్న లేదా మళ్లీ మళ్లీ చేసిన అభ్యర్థనను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “దిగివచ్చి” అనే మాట గలిలయలోని ఆ రెండు ప్రదేశాల మధ్య ఉన్న ఎత్తు తేడాను ప్రతిబింబిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: ఆ వ్యక్తి
  rationale: మునుపటి వచనంలోని రాజోద్యోగిని తిరిగి సూచించే నిర్దేశక సర్వనామ బలాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: ἀκούσας
  choice: విన్నప్పుడు
  rationale: అయోరిస్ట్ పార్టిసిపుల్‌కు ప్రధాన క్రియతో ఉన్న కాలసంబంధాన్ని సహజమైన తెలుగు ఉపవాక్యంగా వ్యక్తం చేస్తుంది.
- source_word: ἥκει
  choice: వచ్చాడని
  rationale: వచ్చి చేరి ఉన్నాడనే ἥκω భావాన్ని వార్తగా విన్న సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: యూదయ నుంచి గలిలయకు
  rationale: ప్రయాణపు ఆరంభస్థలాన్నీ గమ్యస్థలాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: ἀπῆλθεν πρὸς αὐτόν
  choice: ఆయన దగ్గరకు వెళ్లి
  rationale: యేసు ఉన్న చోటుకు ఆ వ్యక్తి వెళ్లాడనే కదలికను సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ἠρώτα
  choice: అడిగాడు
  rationale: ἐρωτάω యొక్క ప్రాథమిక అభ్యర్థన భావాన్ని అతిశయింపకుండా ఇస్తుంది; ఇంపర్ఫెక్ట్ సూచించగల కొనసాగింపు లేదా పునరావృతిని పాదసూచికలో నిలిపింది.
- source_word: ἵνα καταβῇ
  choice: దిగివచ్చి
  rationale: అభ్యర్థన నిర్మాణాన్ని సంక్షిప్తంగా తెలుగులో ఇస్తూనే καταβαίνωలోని దిగువకు ప్రయాణించే భావాన్ని నిలుపుతుంది.
- source_word: ἰάσηται
  choice: స్వస్థపరచమని
  rationale: శారీరక స్వస్థతను కలిగించడమనే అర్థాన్ని గౌరవప్రదమైన, సాధారణ బైబిలు తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: αὐτοῦ τὸν υἱόν
  choice: తన కుమారుణ్ణి
  rationale: అధికారికి చెందిన కుమారుడనే స్వాధీన సంబంధాన్ని సహజంగా తెలుపుతుంది.
- source_word: ἤμελλεν γὰρ ἀποθνῄσκειν
  choice: ఎందుకంటే అతని కుమారుడు చనిపోబోతున్నాడు
  rationale: μέλλωతో వ్యక్తమైన సమీప మరణాన్ని స్పష్టంగా అందిస్తుంది; తెలుగులో సర్వనామ సందిగ్ధత రాకుండా కుమారుణ్ణి మళ్లీ పేర్కొంటుంది.
theological_decisions:
- issue: ἤμελλεν γὰρ ἀποθνῄσκεινలో అంతర్లీన కర్త
  choice: చనిపోబోతున్నది కుమారుడే అని స్పష్టంగా పేర్కొనడం
  alternative: అతడు చనిపోబోతున్నాడు
  rationale: సమీప సందర్భంలోనూ కథా సందర్భంలోనూ ఈ వాక్యం కుమారుణ్ణే సూచిస్తుంది; తెలుగు సర్వనామం యేసును లేదా అధికారిని సూచించినట్లు అపార్థం కాకుండా నామవాచకాన్ని పునరుక్తం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. మూలంలోని భౌగోళిక కదలికను “దిగివచ్చి”తో నిలిపి, ἠρώτα యొక్క కాలదృష్టి సంభావ్యతను ప్రధాన పాఠ్యంలో బలవంతంగా నిర్ణయించకుండా పాదసూచికలో తెలిపింది.
