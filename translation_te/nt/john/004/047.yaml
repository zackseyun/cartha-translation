    issue: The main text renders ἠρώτα simply as 'అడిగాడు.'
    rationale: The Greek imperfect presents the asking as ongoing or potentially repeated. While a simple past is possible in Telugu, 'అడుగుతున్నాడు' more directly reflects the verbal aspect without imposing the stronger iterative sense 'మళ్లీ మళ్లీ అడిగాడు.'
  - severity: low
    issue: The request construction can briefly leave the intended subject of 'దిగివచ్చి' less explicit.
    rationale: In Telugu, adding 'ఆయనను' after the requested action clearly marks Jesus as the person being asked to come down and heal.
