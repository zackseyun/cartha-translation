id: JHN.4.34
reference: John 4:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Ἐμὸν βρῶμά ἐστιν ἵνα ⸀ποιήσω τὸ θέλημα τοῦ πέμψαντός με καὶ τελειώσω αὐτοῦ τὸ ἔργον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/034.yaml
  text: Jesus said to them[b][a], “My food is to do the will of him who sent me and to complete his work.”
translation:
  language: te
  text: 'యేసు వారితో ఇలా అన్నాడు: “నన్ను పంపినవాని[b] చిత్తాన్ని చేయడం, ఆయన పనిని పూర్తి చేయడమే[a] నా ఆహారం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన పనిని ముగించడమే.”
    reason: lexical_alternative
  - marker: b
    text: “నన్ను పంపినవాని” అనేది సందర్భానుసారంగా తండ్రిని సూచిస్తుంది; అయితే ఇక్కడ గ్రీకు మూలంలో “తండ్రి” అనే బిరుదు ప్రత్యక్షంగా లేదు.
    reason: cross_reference
lexical_decisions:
- source_word: βρῶμά
  choice: ఆహారం
  rationale: శిష్యులు భౌతిక ఆహారం గురించి మాట్లాడుతున్న సందర్భంలో, మూలంలోని స్పష్టమైన రూపకాన్ని సహజంగా నిలుపుతుంది.
- source_word: Ἐμὸν βρῶμά ἐστιν
  choice: నా ఆహారం … చేయడమే
  rationale: తెలుగులో సహజమైన వాక్యనిర్మాణంతో ‘నా ఆహారం’ అనే రూపకాన్ని యథాతథంగా కాపాడుతుంది.
- source_word: ἵνα ποιήσω
  choice: నెరవేర్చడం
  rationale: చిత్తానికి విధేయత చూపుతూ దాన్ని కార్యరూపంలో పెట్టడం అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ θέλημα
  choice: చిత్తం
  rationale: దేవుని సంకల్పం లేదా ఇష్టం అనే భావానికి తెలుగు బైబిలు శైలిలోనూ సాధారణ గౌరవప్రద వాడుకలోనూ ఖచ్చితమైన పదం.
- source_word: τοῦ πέμψαντός με
  choice: నన్ను పంపినవాని
  rationale: మూలంలోని వ్యక్తిగత సూచనను నిలుపుతూ, ‘తండ్రి’ అనే బిరుదును వచనంలో అదనంగా చేర్చదు.
- source_word: τελειώσω
  choice: పూర్తి చేయడం
  rationale: పనిని ముగింపుకు తీసుకురావడం, దాని లక్ష్యాన్ని సాధించడం అనే τελειόω భావవ్యాప్తిని కాపాడుతుంది.
- source_word: ἔργον
  choice: పని
  rationale: అప్పగించబడిన కార్యం లేదా పరిచర్యను సూచించే సహజమైన, విస్తృతార్థక తెలుగు పదం.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: యేసు వారితో ఇలా అన్నాడు
  rationale: గ్రీకు చారిత్రక వర్తమానాన్ని సహజమైన తెలుగు కథనశైలిలో భూతకాలంగా అందిస్తుంది.
theological_decisions:
- issue: ‘నన్ను పంపినవాని’ ఎవరిని సూచిస్తుంది?
  choice: సందర్భంలో తండ్రి/దేవునికి సూచనగా గ్రహించినప్పటికీ, ప్రధాన వచనంలో ‘నన్ను పంపినవాని’ అని మాత్రమే ఉంచడం.
  alternative: ‘నన్ను పంపిన తండ్రి’ అని స్పష్టీకరించడం.
  rationale: యోహాను సువార్త సందర్భం తండ్రిని సూచిస్తుంది; అయితే ఈ గ్రీకు వాక్యంలో ఆ బిరుదు ప్రత్యక్షంగా లేదు. అందువల్ల మూలంలోని పరోక్ష సూచనను కాపాడాం.
- issue: τελειώσω లోని భావం
  choice: ‘పూర్తి చేయడం’ అని అనువదించడం.
  alternative: ‘ముగించడం’ అని అనువదించడం.
  rationale: ‘పూర్తి చేయడం’ కేవలం ఆపివేయడం లేదా ముగించడం మాత్రమే కాక, పనిని ఉద్దేశించిన గమ్యానికి తీసుకెళ్లే భావాన్ని కూడా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఆహారం’ అనే concrete రూపకాన్ని నిలిపి, మూలంలో లేని ‘తండ్రి’ అనే బిరుదును ప్రధాన వచనంలో చేర్చలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన వచనంలో ఉన్నాయి.
