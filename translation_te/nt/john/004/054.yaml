id: JHN.4.54
reference: John 4:54
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο ⸀δὲ πάλιν δεύτερον σημεῖον ἐποίησεν ὁ Ἰησοῦς ἐλθὼν ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/054.yaml
  text: This again was the second sign Jesus did after coming from Judea into Galilee[a].
translation:
  language: te
  text: యేసు యూదయ నుండి గలిలయకు వచ్చిన తర్వాత చేసిన రెండవ సూచక కార్యం[a] ఇది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అద్భుతం.” యోహాను సాధారణంగా ఈ పదాన్ని ఒక కార్యంలోని శక్తితో పాటు అది సూచించే అర్థాన్ని నొక్కిచెప్పడానికి ఉపయోగిస్తాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: ఇది
  rationale: ఇప్పుడే వివరించిన స్వస్థపరిచే కార్యాన్ని సూచించే సహజమైన తెలుగు సర్వనామం.
- source_word: δὲ πάλιν δεύτερον
  choice: రెండవ
  rationale: δέ స్వల్ప అనుసంధానాన్ని చూపుతుంది; πάλιν రెండవసారి జరిగినదనే భావాన్ని బలపరుస్తుంది. తెలుగులో ‘రెండవ’ అనేది ఆ క్రమభావాన్ని సహజంగా అందిస్తుంది; ‘మళ్లీ రెండవ’ అనడం అసహజం.
- source_word: σημεῖον
  choice: సూచక కార్యం
  rationale: యోహాను వాడుకలో ఈ పదం కేవలం అద్భుత శక్తిని కాక, ఆ కార్యం సూచించే వెల్లడిపరమైన అర్థాన్ని కూడా తెలియజేస్తుంది.
- source_word: ἐποίησεν
  choice: చేసిన
  rationale: σημεῖονతో కలిసి సాధారణ కార్యాన్ని తెలిపే ποιέωకు సహజమైన తెలుగు రూపం.
- source_word: ἐλθὼν
  choice: వచ్చిన తర్వాత
  rationale: పూర్వకాలిక క్రియావిశేషణ భావాన్ని సహజంగా వ్యక్తం చేసి, గలిలయకు రావడం ఆ కార్యానికి ముందే జరిగిందని తెలియజేస్తుంది.
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: యూదయ నుండి గలిలయకు
  rationale: ప్రయాణపు ఆరంభ స్థలం, గమ్యస్థలాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యోహాను సువార్తలో σημεῖον పదప్రయోగం
  choice: సూచక కార్యం
  alternative: అద్భుతం
  rationale: ‘సూచక కార్యం’ ఆ ఘటనలోని శక్తితో పాటు అది సూచించే వెల్లడిపరమైన ప్రాముఖ్యతను కూడా నిలుపుతుంది; ‘అద్భుతం’ ప్రధానంగా ఆశ్చర్యకర కార్యాన్నే ముందుకు తెస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యక్రమం, అయితే యోహాను సువార్తలోని ప్రత్యేక ‘సూచక కార్యం’ పదభావం నిలుపబడింది.
