  terminology: ‘గడియ’ యోహాను సువార్తలోని ὥρα పదసూత్రాన్ని కాపాడుతుంది. ‘తండ్రి,’ ‘ఆరాధించు,’ ‘యెరూషలేము’ తగిన మరియు స్థిరమైన పదప్రయోగాలు. ‘అమ్మా’కు ‘స్త్రీ’ అనే అక్షరార్థాన్ని పాదసూచికలో ఉంచడం మూలపదాన్ని దాచకుండా తెలుగు మర్యాదా-రిజిస్టర్ను కాపాడుతుంది.
