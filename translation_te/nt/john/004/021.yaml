  source_fidelity: మూలంలోని Πίστευέ μοι వ్యక్తిని ఉద్దేశించిన ప్రత్యక్ష ఆజ్ఞ. ముసాయిదాలోని “నా మాట నమ్ము” సందర్భానికి సరిపోయినా, మూలంలోని ‘నన్ను’ అనే ప్రత్యక్షతను కొద్దిగా వివరిస్తుంది. “నన్ను నమ్ము” దానిని మరింత నేరుగా నిలుపుతుంది. οὔτε ... οὔτε, భవిష్యత్ బహువచనం, ‘తండ్రిని’ అనే దైవసూచన అన్నీ సవరించిన పాఠంలో నిలిచాయి.
