id: JHN.4.21
reference: John 4:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· ⸂Πίστευέ μοι, γύναι⸃, ὅτι ἔρχεται ὥρα ὅτε οὔτε ἐν τῷ ὄρει τούτῳ οὔτε ἐν Ἱεροσολύμοις προσκυνήσετε τῷ πατρί.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/021.yaml
  text: Jesus said to her[a], “Believe me, woman[c][b], an hour is coming when neither on this mountain nor in Jerusalem will you worship the Father.”
translation:
  language: te
  text: 'యేసు ఆమెతో ఇలా అన్నాడు: “అమ్మా,[b] నన్ను నమ్ము.[a] ఈ కొండమీదగానీ, యెరూషలేములోగానీ మీరు తండ్రిని ఆరాధించని గడియ[c] వస్తోంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా మాట నమ్ము.” గ్రీకు క్రియ ఒకరు చెప్పే మాటను నమ్మడాన్నీ, ఆ వ్యక్తిపై నమ్మకం ఉంచడాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా “స్త్రీ.” ఈ సందర్భంలో అది మొరటైన సంబోధన కాదు, గౌరవపూర్వకమైనది.
    reason: cultural_note
  - marker: c
    text: లేదా, “ఆ గడియ.” ఇక్కడ గ్రీకు నామవాచకానికి నిర్దిష్ట ఉపపదం లేకపోయినా, యోహాను సువార్తలో “గడియ” దేవుని ప్రణాళికలోని నిర్ణాయక సమయాన్ని తరచుగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστευέ μοι
  choice: నా మాట నమ్ము
  rationale: ఈ సందర్భంలో యేసు వెంట చెప్పబోయే మాటను నిజమని అంగీకరించమనే ప్రత్యక్ష విజ్ఞప్తి ఇది. ‘నన్ను నమ్ము’ కూడా సాధ్యమే కాని, తెలుగులో అది వ్యక్తిపై సాధారణ విశ్వాసాన్ని ఎక్కువగా సూచించవచ్చు; ‘నా మాట నమ్ము’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: γύναι
  choice: అమ్మా
  rationale: γύναι అక్షరార్థంగా ‘స్త్రీ’ అయినా, ఇక్కడ అది అవమానకరమైనది కాక గౌరవపూర్వక సంబోధన. ఆధునిక తెలుగులో నేరుగా ‘స్త్రీ’ అని సంబోధించడం కఠినంగా లేదా అసహజంగా వినిపిస్తుంది; ‘అమ్మా’ గౌరవభావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἔρχεται ὥρα
  choice: ఒక గడియ రాబోతుంది
  rationale: ὥραకు ‘గడియ’ అని అనువదించడం యోహాను సువార్తలో పునరావృతమయ్యే నిర్ణాయక సమయపు భావాన్ని నిలుపుతుంది. గ్రీకులో నిర్దిష్ట ఉపపదం లేనందున ప్రధాన పాఠంలో ‘ఒక గడియ’ ఉంచబడింది.
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: ఈ కొండ మీద
  rationale: ఆరాధనా స్థలమైన కొండను సూచించడానికి తెలుగులో ‘కొండ మీద’ సహజమైన స్థలప్రయోగం.
- source_word: ἐν Ἱεροσολύμοις
  choice: యెరూషలేములో
  rationale: నగరంలో జరిగే ఆరాధనను తెలుగులో సహజంగా ‘యెరూషలేములో’ అని వ్యక్తపరుస్తుంది.
- source_word: προσκυνήσετε
  choice: మీరు ... ఆరాధించని
  rationale: ఇది రెండవ పురుష బహువచన భవిష్యత్ క్రియ. ‘మీరు’ ద్వారా బహువచనం స్పష్టమవుతుంది; ‘ఆరాధించని ఒక గడియ రాబోతుంది’ అనే నిర్మాణం భవిష్యత్ భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: τῷ πατρί
  choice: తండ్రిని
  rationale: యోహాను సందర్భంలో ఇది దేవుణ్ణి తండ్రిగా సూచిస్తుంది. ‘తండ్రి’ అనే వ్యక్తిగత దైవ సంబోధనను యథాతథంగా నిలుపుతుంది.
- source_word: οὔτε ... οὔτε
  choice: '... మీదగానీ, ... లోగానీ'
  rationale: గ్రీకు జంట నిరాకరణను తెలుగులో సహజమైన ‘గానీ ... గానీ’ నిర్మాణంతో అందించి, రెండు ఆరాధనా కేంద్రాలనూ సమానంగా నిరాకరిస్తుంది.
theological_decisions:
- issue: γύναι అనే సంబోధన స్వరం
  choice: గౌరవపూర్వకమైన ‘అమ్మా’
  alternative: ‘స్త్రీ’
  rationale: మూలంలోని సంబోధన అవమానకరమైనది కాదు. తెలుగులో అక్షరార్థమైన ‘స్త్రీ’ అనవసరంగా కఠినంగా వినిపించే ప్రమాదం ఉన్నందున, మూలంలోని గౌరవ స్వరాన్ని ‘అమ్మా’ ద్వారా వ్యక్తపరచి అక్షరార్థాన్ని పాదసూచికలో తెలిపాం.
- issue: యోహాను సువార్తలో ὥρα అనే భావసూత్రం
  choice: ‘గడియ’ అనే పదాన్ని నిలుపడం
  alternative: ‘సమయం’ లేదా ‘కాలం’
  rationale: సాధారణ ‘సమయం’గా మార్చకుండా ‘గడియ’ని ఉంచడం ద్వారా దేవుని కార్యంలో రాబోయే నిర్ణాయక వేళను సూచించే యోహాను పదసూత్రం నిలుస్తుంది; అది ‘ఒక గడియ’నా ‘ఆ గడియ’నా అనే స్వల్ప అనిశ్చితిని పాదసూచికలో సూచించాం.
- issue: ఆరాధన స్థలాలపై వాక్యపు భావం
  choice: రెండు స్థలాల్లోనూ ఆరాధించని గడియగా అనువదించడం
  alternative: ఒక స్థలం నుండి మరొక స్థలానికి ఆరాధన మారుతుందని వివరణాత్మకంగా చెప్పడం
  rationale: మూలపాఠం ఈ కొండనూ యెరూషలేమునూ జంటగా నిరాకరిస్తుంది; తదుపరి వచనాల ఆధారంగా భావాన్ని ముందుగానే విస్తరించకుండా ఆ ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవభరితంగా రూపొందించబడింది. ‘అమ్మా’ సాధారణ పాఠకునికి సంబోధన స్వరాన్ని సరిగ్గా అందిస్తుంది; ‘గడియ’ యోహాను సువార్తలోని ప్రత్యేక భావసూత్రాన్ని కాపాడుతుంది. వాక్య నిర్మాణం రెండవ పురుష బహువచనాన్ని మరియు రెండు స్థలాల జంట నిరాకరణను స్పష్టంగా ఉంచుతుంది.
