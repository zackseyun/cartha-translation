  to: 'యేసు ఆమెతో ఇలా అన్నాడు: “అమ్మా,[b] నన్ను నమ్ము.[a] ఈ కొండమీదగానీ, యెరూషలేములోగానీ మీరు తండ్రిని ఆరాధించని గడియ[c] వస్తోంది.”'
