id: JHN.4.39
reference: John 4:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐκ δὲ τῆς πόλεως ἐκείνης πολλοὶ ἐπίστευσαν εἰς αὐτὸν τῶν Σαμαριτῶν διὰ τὸν λόγον τῆς γυναικὸς μαρτυρούσης ὅτι Εἶπέν μοι πάντα ⸀ἃ ἐποίησα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/039.yaml
  text: And many of the Samaritans from that town believed in him because of the word of the woman who was testifying, “He told me everything I did.”
translation:
  language: te
  text: ఆ పట్టణానికి చెందిన సమరయులలో చాలామంది, “నేను చేసినవన్నీ ఆయన నాకు చెప్పాడు” అని సాక్ష్యమిస్తూ ఉన్న ఆ స్త్రీ మాటను బట్టి[a] ఆయనను విశ్వసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ స్త్రీ సందేశాన్ని బట్టి.” గ్రీకు పదమైన λόγος కు “మాట,” “సందేశం,” లేదా “నివేదిక” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκ δὲ τῆς πόλεως ἐκείνης
  choice: ఆ పట్టణంలోని
  rationale: ἐκ మూలం లేదా స్థలాన్ని సూచిస్తుంది. సందర్భంలో సహజమైన ఆధునిక తెలుగులో ‘ఆ పట్టణంలోని’ అని అనువదించడం మూలభావాన్ని స్పష్టంగా అందిస్తుంది; δέ ఇక్కడ స్వల్ప కథన అనుసంధానం మాత్రమే కాబట్టి ప్రత్యేక పదంతో చూపాల్సిన అవసరం లేదు.
- source_word: πολλοὶ ... τῶν Σαμαριτῶν
  choice: సమరయులలో చాలామంది
  rationale: భాగార్థక షష్ఠీ విభక్తి భావాన్ని ‘సమరయులలో చాలామంది’ సహజంగానూ ఖచ్చితంగానూ నిలుపుతుంది.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: ఆయనను విశ్వసించారు
  rationale: πιστεύω εἰς ఒక వ్యక్తివైపు మళ్లిన నమ్మకాన్ని సూచిస్తుంది. ‘ఆయనను విశ్వసించారు’ వ్యక్తిగత విశ్వాస భావాన్ని అదనపు సిద్ధాంత విస్తరణ లేకుండా తెలియజేస్తుంది.
- source_word: διὰ τὸν λόγον τῆς γυναικὸς
  choice: ఆ స్త్రీ మాటను బట్టి
  rationale: διά + accusative కారణాన్ని సూచిస్తుంది. λόγος కు మాట, సందేశం, నివేదిక అనే అర్థాలు సాధ్యమైనా, ‘మాటను బట్టి’ ఈ సందర్భంలో సహజంగా ఉండి మూలంలోని పదబంధాన్ని సన్నిహితంగా నిలుపుతుంది.
- source_word: μαρτυρούσης
  choice: సాక్ష్యమిస్తూ ఉన్న
  rationale: వర్తమాన కృదంతం ఆమె కొనసాగిస్తూ చెప్పిన సాక్ష్యాన్ని చిత్రిస్తుంది. ‘సాక్ష్యమిస్తూ ఉన్న’ ఆ కొనసాగింపు ఛాయను నిలుపుతుంది.
- source_word: Εἶπέν μοι πάντα ἃ ἐποίησα
  choice: నేను చేసినవన్నీ ఆయన నాకు చెప్పాడు
  rationale: πάντα ἃ యొక్క సమగ్రతను ‘చేసినవన్నీ’ తెలియజేస్తుంది. ἐποίησα అఓరిస్ట్‌ను సహజమైన భూతకాల రూపంతో అనువదించాం; ‘ఆయన నాకు చెప్పాడు’ తెలుగులో ప్రత్యక్ష ఉల్లేఖనానికి సహజం.
theological_decisions:
- issue: యోహాను రచనలో πιστεύω εἰς యొక్క భావం
  choice: ఆయనను విశ్వసించారు
  alternative: ఆయనపై విశ్వాసముంచారు
  rationale: వాక్యం యేసువైపు మళ్లిన నిజమైన నమ్మకాన్ని నివేదిస్తుంది; దానిని తరువాతి సిద్ధాంత వర్గీకరణలతో విస్తరించదు. ఎంచుకున్న రూపం సంబంధాత్మక దిశను నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సహజమైన కథన శైలిని ఉపయోగించాం. ‘సమరయులు,’ ‘సాక్ష్యమిస్తూ,’ ‘విశ్వసించారు’ వంటి పదాలు బైబిలు సందర్భానికి తగిన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి.
