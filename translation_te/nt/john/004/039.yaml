  terminology: “సమరయులు,” “విశ్వసించారు,” and “సాక్ష్యమిస్తూ” are suitable biblical-register terms. “మాట” is a valid rendering of λόγος here, and the footnote appropriately supplies “సందేశం” as an alternative.
