id: JHN.4.42
reference: John 4:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῇ τε γυναικὶ ἔλεγον ὅτι Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν· αὐτοὶ γὰρ ἀκηκόαμεν, καὶ οἴδαμεν ὅτι οὗτός ἐστιν ἀληθῶς ὁ σωτὴρ τοῦ ⸀κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/042.yaml
  text: And they were saying to the woman[a], “We no longer believe because of your word, for we ourselves have heard[b], and we know that this one truly is the Savior of the world.”
translation:
  language: te
  text: 'వారు ఆ స్త్రీతో ఇలా చెబుతూ ఉన్నారు: “ఇకపై నీ మాటను బట్టి మేము నమ్మడం లేదు[a]. ఎందుకంటే మేమే స్వయంగా విన్నాము; ఈయనే నిజంగా లోకానికి రక్షకుడని మాకు తెలుసు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, వారు ఆ స్త్రీ మాటను తిరస్కరిస్తున్నారని కాదు; ఇప్పుడు వారి విశ్వాసం ఆమె చెప్పినదానిపై మాత్రమే ఆధారపడి లేదని భావం.
    reason: ambiguity_clarification
lexical_decisions:
- source_word: τῇ τε γυναικὶ ἔλεγον
  choice: వారు ఆ స్త్రీతో ... అని చెబుతూ ఉన్నారు
  rationale: దత్తివిభక్తి సంబోధిత వ్యక్తిని సూచిస్తుంది; అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న లేదా పునరావృతమైన మాటను సూచిస్తుంది. τε యొక్క స్వల్ప అనుసంధాన భావాన్ని తెలుగులో విడిగా బలవంతంగా చేర్చలేదు.
- source_word: Οὐκέτι
  choice: ఇకపై ... లేదు
  rationale: ముందున్న ఆధారం ఇక కొనసాగడం లేదనే కాలసంబంధ నిరాకరణను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: διὰ τὴν σὴν λαλιὰν
  choice: నీ మాటను బట్టి
  rationale: διά + ద్వితీయావిభక్తి కారణం లేదా ఆధారాన్ని సూచిస్తుంది; λαλιά ఇక్కడ స్త్రీ పలికిన సాక్ష్యమాటను సూచిస్తుంది.
- source_word: πιστεύομεν
  choice: మేము నమ్మడం లేదు
  rationale: వర్తమాన విశ్వాసస్థితిని Οὐκέτιతో కలిపి సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: αὐτοὶ γὰρ ἀκηκόαμεν
  choice: ఎందుకంటే మేమే స్వయంగా విన్నాము
  rationale: αὐτοὶ లోని ఉద్ఘాటనను ‘మేమే స్వయంగా’ నిలుపుతుంది; గ్రీకు సంపూర్ణకాలం సూచించే పూర్తయిన వినికిడి మరియు దాని ప్రస్తుత ఫలితాన్ని సందర్భానుకూలంగా వ్యక్తం చేస్తుంది.
- source_word: οἴδαμεν
  choice: మాకు తెలుసు
  rationale: రూపంలో సంపూర్ణకాలమైనా వర్తమాన స్థితిని సూచించే οἶδα కు సహజమైన తెలుగు సమానం.
- source_word: οὗτός
  choice: ఈయనే
  rationale: సాధారణ సర్వనామం కంటే గ్రీకు సూచనాత్మక సర్వనామంలోని ఉద్ఘాటనను గౌరవప్రదమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: ἀληθῶς
  choice: నిజంగా
  rationale: ఒప్పుకోలులోని సత్యనిశ్చయాన్ని సహజంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ σωτὴρ τοῦ κόσμου
  choice: లోక రక్షకుడు
  rationale: σωτήρ యొక్క రక్షణార్థక బరువును నిలుపుతూ, κόσμος యొక్క విస్తృత పరిధిని తగ్గించకుండా లేదా ‘సమస్త’ వంటి అదనపు పదంతో విస్తరించకుండా నేరుగా అనువదిస్తుంది.
theological_decisions:
- issue: సమరయుల ఒప్పుకోలులో ‘లోకం’ యొక్క పరిధి
  choice: ఈయనే నిజంగా లోక రక్షకుడు
  alternative: ఈయనే ప్రజలందరి రక్షకుడు / లోకంలోనుండి ఎన్నుకోబడినవారి రక్షకుడు
  rationale: మూలపాఠం విస్తృతమైన క్రీస్తుసంబంధ ఒప్పుకోలును ఇస్తుంది. దాని పరిధిని ఒక వర్గానికి కుదించకుండా, మూలంలో లేని సిద్ధాంత వివరణను జోడించకుండా ఉంచబడింది.
- issue: విశ్వాసానికి స్త్రీ మాటతో ఉన్న సంబంధం
  choice: ఇకపై నీ మాటను బట్టి మేము నమ్మడం లేదు
  alternative: నీ మాటను ఇక మేము నమ్మడం లేదు
  rationale: వారు స్త్రీ మాటను అవిశ్వసిస్తున్నారని కాక, వారి విశ్వాసం ఇక ఆమె సాక్ష్యంపై మాత్రమే ఆధారపడటం లేదని διά సూచిస్తుంది; ఈ భేదాన్ని ‘బట్టి’ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ఒప్పుకోలులోని గంభీరతను నిలుపుతూ రచించబడింది. ‘ఈయనే’ గ్రీకు οὗτός యొక్క ఉద్ఘాటనను సహజంగా చూపిస్తుంది.
