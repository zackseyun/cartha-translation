  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· Ἐγώ εἰμι, ὁ λαλῶν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/026.yaml
  text: Jesus said to her[a], “I am, the one speaking to you.”
translation:
  language: te
  text: యేసు ఆమెతో, “నేనే నీతో మాట్లాడుతున్నవాడిని” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో ఇది కథన వర్తమాన కాలంలో ఉన్నప్పటికీ, ఆధునిక తెలుగు కథన శైలిలో భూతకాల రూపమైన ‘అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: αὐτῇ
  choice: ఆమెతో
  rationale: తెలుగులో సంభాషణను సూచించడానికి దత్తి భావాన్ని ‘ఆమెతో’ అని సహజంగా వ్యక్తం చేయవచ్చు.
- source_word: Ἐγώ εἰμι
  choice: నేనే
  rationale: మునుపటి వచనంలో ప్రస్తావించిన మెస్సీయ తానేనని యేసు గుర్తింపజేస్తున్న సందర్భంలో ‘నేనే’ సహజమైన తెలుగు రూపం. ఇది గ్రీకులో లేని ‘ఆయన’ లేదా ‘మెస్సీయను’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: ὁ λαλῶν σοι
  choice: నీతో మాట్లాడుతున్నవాణ్ణి
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, మాట్లాడే క్రియ కొనసాగుతున్నదనే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: మెస్సీయ గుర్తింపును ప్రధాన పాఠ్యంలో స్పష్టంగా విస్తరించాలా
  choice: గ్రీకు వాక్యంలోని సంక్షిప్త గుర్తింపును ‘నేనే’గా ఉంచడం
  alternative: ‘ఆ మెస్సీయను నేనే’ లేదా ‘నేనే ఆయనను’
  rationale: యోహాను 4:25 సందర్భం యేసు మెస్సీయగా తనను గుర్తింపజేస్తున్నాడని స్పష్టం చేస్తుంది. అయితే ఈ వచనంలో ‘మెస్సీయ’ లేదా ‘ఆయన’ అనే విధేయ పదం గ్రీకులో లేదు; కాబట్టి దానిని చేర్చకుండా మూలంలోని సంక్షిప్తతను, భావసాంద్రతను నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘నేనే’ మూలంలోని Ἐγώ εἰμι అనే సంక్షిప్త స్వీయగుర్తింపును తెలుగులో అసహజమైన పదశః నిర్మాణం లేకుండా వ్యక్తం చేస్తుంది.
