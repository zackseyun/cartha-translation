revisions:
- from: ఆ స్త్రీ ఆయనతో, “ప్రభువా,[a] మీరు ప్రవక్త అని నాకు తెలుస్తోంది” అంది.
  to: ఆ స్త్రీ ఆయనతో ఇలా అంది, “ప్రభువా,[a] మీరు ప్రవక్త అని నేను గ్రహిస్తున్నాను.”
  rationale: The revision more closely renders θεωρῶ as personal perception (‘నేను గ్రహిస్తున్నాను’), improves the natural flow into the quotation, and clarifies the alternative sense of κύριε in the footnote. It retains the source’s ambiguity about whether the address carries a fuller titular sense.
