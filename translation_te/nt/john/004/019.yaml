id: JHN.4.19
reference: John 4:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ἡ γυνή· Κύριε, θεωρῶ ὅτι προφήτης εἶ σύ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/019.yaml
  text: The woman said to him[a], “Lord, I see that you are a prophet.”
translation:
  language: te
  text: ఆ స్త్రీ ఆయనతో ఇలా అంది, “ప్రభువా,[a] మీరు ప్రవక్త అని నేను గ్రహిస్తున్నాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అయ్యా.” గ్రీకు κύριε అనే పదం “ప్రభువా” అని అర్థం కావచ్చు; గౌరవపూర్వక సంబోధనగా కూడా వాడవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: అంది
  rationale: గ్రీకులో కథన వర్తమాన కాలం (‘అంటుంది’) ఉన్నప్పటికీ, ఆధునిక తెలుగు కథన శైలిలో భూతకాల రూపమైన ‘అంది’ సహజంగా ఉంటుంది.
- source_word: αὐτῷ
  choice: ఆయనతో
  rationale: మాట ఎవరిని ఉద్దేశించి చెప్పబడిందో తెలిపే దత్తివాచక సర్వనామాన్ని సహజమైన తెలుగులో ‘ఆయనతో’గా ఇచ్చాం.
- source_word: ἡ γυνή
  choice: ఆ స్త్రీ
  rationale: సందర్భంలో ఇది సమరయ స్త్రీని సూచిస్తుంది; భార్య అనే అర్థం కాదు.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: κύριε అనే సంబోధనకు ప్రాజెక్టు ప్రామాణిక పదమైన ‘ప్రభువా’ను వాడాం; ఈ సందర్భంలో గౌరవార్థక సంబోధన కూడా కావచ్చని పాదసూచికలో ఉంచాం.
- source_word: θεωρῶ
  choice: నాకు తెలుస్తోంది
  rationale: యేసు వెల్లడించిన దాని ఆధారంగా ఆమె గ్రహించిన విషయాన్ని సూచిస్తుంది; ‘నాకు తెలుస్తోంది’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ὅτι
  choice: అని
  rationale: ఆమె గ్రహించిన విషయాన్ని పరిచయం చేసే సహజ తెలుగు ఉపవాక్య సూచకం.
- source_word: προφήτης
  choice: ప్రవక్త
  rationale: గ్రీకు పదం ఇక్కడ యేసును ఒక ప్రవక్తగా ఆమె గుర్తించడాన్ని సూచిస్తుంది; ‘ఆ ప్రవక్త’ అనే నిర్దిష్ట భావాన్ని చేర్చలేదు.
- source_word: σύ
  choice: మీరు
  rationale: గ్రీకులో స్పష్టమైన సర్వనామం కొంత ఉద్ఘాటనను కలిగిస్తుంది; గౌరవ సంబోధనకు సరిపోయే సహజ తెలుగు రూపం ‘మీరు’.
theological_decisions:
- issue: యేసును ఉద్దేశించిన κύριε సంబోధన
  choice: ప్రభువా
  alternative: అయ్యా
  rationale: తక్షణ సందర్భంలో ఇది సంపూర్ణ క్రీస్తుతత్వ ఒప్పుకోలు కాకుండా గౌరవార్థక సంబోధన కావచ్చు. అయినప్పటికీ ‘ప్రభువా’ అనే ప్రధాన అనువాదాన్ని ఉంచి, అసలు పదంలోని సందర్భోచిత సందిగ్ధతను పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవభరితంగా ఉండే కథన శైలి. ‘మీరు’ రూపం సంభాషణలో గౌరవాన్ని నిలుపుతుంది.
