id: JHN.4.17
reference: John 4:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν ⸀αὐτῷ· Οὐκ ἔχω ἄνδρα. λέγει αὐτῇ ὁ Ἰησοῦς· Καλῶς εἶπας ὅτι Ἄνδρα οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/017.yaml
  text: 'The woman answered and said to him[a], “I do not have a husband.” Jesus said to her[b], “You have spoken well: ‘I do not have a husband.’”'
translation:
  language: te
  text: 'ఆ స్త్రీ ఆయనకు జవాబిచ్చి ఇలా అంది: “నాకు భర్త లేడు.” యేసు ఆమెతో ఇలా అన్నాడు: “నాకు భర్త లేడు అని నువ్వు సరిగానే చెప్పావు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν
  choice: ఆ స్త్రీ ఆయనకు జవాబిస్తూ ... అంది
  rationale: గ్రీకు వాక్యంలోని జవాబివ్వడం, చెప్పడం అనే రెండు క్రియల భావాన్ని సహజమైన ఆధునిక తెలుగు కథన శైలిలో ‘జవాబిస్తూ ... అంది’ అని వ్యక్తం చేసింది.
- source_word: Οὐκ ἔχω ἄνδρα
  choice: నాకు భర్త లేడు
  rationale: ἄνδρα అనే పదానికి ‘పురుషుడు’ లేదా ‘భర్త’ అనే అర్థాలు ఉండవచ్చు; తరువాతి వచనంలోని వివాహ సందర్భం ఇక్కడ ‘భర్త’ అనే అర్థాన్ని స్పష్టం చేస్తుంది. ‘నాకు భర్త లేడు’ సహజమైన తెలుగు వ్యక్తీకరణ.
- source_word: λέγει αὐτῇ ὁ Ἰησοῦς
  choice: యేసు ఆమెతో ... అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నా, తెలుగు కథన ప్రవాహానికి సహజంగా భూతకాలంలోని ‘అన్నాడు’ వాడబడింది.
- source_word: Καλῶς εἶπας
  choice: నువ్వు సరిగానే చెప్పావు
  rationale: καλῶς ఇక్కడ ఆమె మాట నిజమైనదని లేదా సరైనదని అంగీకరించే భావంలో ఉంది. ‘సరిగానే’ అనే రూపం ప్రశంసకన్నా నిజత్వ ధృవీకరణను సహజంగా తెలియజేస్తుంది.
- source_word: ὅτι Ἄνδρα οὐκ ἔχω
  choice: ‘నాకు భర్త లేడు’ అని
  rationale: ὅτι ఆమె చెప్పిన మాటల విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ప్రత్యక్ష ఉల్లేఖనంతో ‘అని’ వాడటం సహజం. గ్రీకులోని పునరుక్తి నిలుపబడింది.
theological_decisions:
- issue: ἄνδρα పదం యొక్క సందర్భార్థం
  choice: భర్త
  alternative: పురుషుడు
  rationale: యోహాను 4:18లో ఆమె వివాహ చరిత్రను యేసు ప్రస్తావించడం వల్ల ఇక్కడ ఉద్దేశించిన సంబంధార్థం ‘భర్త.’ ఇది అదనపు సిద్ధాంత భావాన్ని చేర్చకుండా సందర్భాన్ని స్పష్టంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. స్త్రీ మాటకు ‘అంది,’ యేసు మాటకు ‘అన్నాడు’ అనే సహజ లింగానుగుణ క్రియారూపాలు వాడబడ్డాయి. మూలంలో లేని పాదసూచికలు చేర్చలేదు.
