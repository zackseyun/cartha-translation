id: JHN.4.27
reference: John 4:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐπὶ τούτῳ ἦλθαν οἱ μαθηταὶ αὐτοῦ, καὶ ⸀ἐθαύμαζον ὅτι μετὰ γυναικὸς ἐλάλει· οὐδεὶς μέντοι εἶπεν· Τί ζητεῖς; ἢ τί λαλεῖς μετ’ αὐτῆς;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/027.yaml
  text: And at this point his disciples came[a], and they were amazed that he was speaking with a woman. Yet no one said, “What are you seeking?” or[b], “Why are you speaking with her?”
translation:
  language: te
  text: ఇంతలో ఆయన శిష్యులు వచ్చారు. ఆయన ఒక స్త్రీతో మాట్లాడుతున్నాడని వారు ఆశ్చర్యపడ్డారు. అయినా, “మీకు ఏమి కావాలి?”[a] అనిగానీ, “ఆమెతో ఎందుకు మాట్లాడుతున్నారు?”[b] అనిగానీ ఎవ్వరూ అడగలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు ఏమి వెదుకుతున్నారు?”
    reason: lexical_alternative
  - marker: b
    text: 'అక్షరార్థంగా, “ఆమెతో ఏమి మాట్లాడుతున్నారు?” సందర్భార్థం: “ఆమెతో ఎందుకు మాట్లాడుతున్నారు?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τούτῳ
  choice: అప్పుడే
  rationale: ఇక్కడ ఈ పదబంధం స్థలార్థంలో కాక, కథనంలోని అదే సమయాన్ని సూచిస్తుంది. ‘అప్పుడే’ సహజమైన ఆధునిక తెలుగు.
- source_word: ἐθαύμαζον
  choice: ఆశ్చర్యపోయారు
  rationale: అసంపూర్ణ భూతకాల రూపం వారి కొనసాగిన ఆశ్చర్యప్రతిస్పందనను సూచిస్తుంది; తెలుగులో ఈ ఎంపిక సహజంగా దాని భావాన్ని అందిస్తుంది.
- source_word: μετὰ γυναικὸς
  choice: ఒక స్త్రీతో
  rationale: ఆర్టికల్ లేని γυνή ఇక్కడ అనిర్దిష్టంగా ‘ఒక స్త్రీ’ అని అర్థమవుతుంది; సందర్భంలో ‘భార్య’ అనే అర్థం సరిపోదు.
- source_word: ἐλάλει
  choice: మాట్లాడుతుండడం
  rationale: అసంపూర్ణ భూతకాలం కొనసాగుతున్న సంభాషణను సూచిస్తుంది; తరువాతి λαλεῖς‌తో ఉన్న పదసంబంధాన్ని కూడా ‘మాట్లాడు’ నిలుపుతుంది.
- source_word: μέντοι
  choice: అయినా
  rationale: వారు ఆశ్చర్యపోయినప్పటికీ ప్రశ్నించలేదనే వ్యత్యాసాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: Τί ζητεῖς;
  choice: నీకు ఏమి కావాలి?
  rationale: ζητέω ప్రాథమికంగా ‘వెదుకు/కోరు’ అయినా, కర్మ చెప్పని ఈ సంభాషణ సందర్భంలో ‘నీకు ఏమి కావాలి?’ అనేది సహజమైన ప్రయోగార్థం. మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: τί λαλεῖς μετ’ αὐτῆς;
  choice: ఆమెతో ఎందుకు మాట్లాడుతున్నావు?
  rationale: τί అక్షరార్థంగా ‘ఏమి?’ అయినప్పటికీ μετά + షష్ఠీ విభక్తితో ఈ సందర్భంలో ప్రశ్న యొక్క సహజ ప్రయోగబలం ‘ఎందుకు మాట్లాడుతున్నావు?’ అవుతుంది; అక్షరార్థ నిర్మాణాన్ని పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: యేసు ఒక స్త్రీతో మాట్లాడటంపై శిష్యుల సామాజిక ఆశ్చర్యం
  choice: వారు ఆశ్చర్యపోయారని మాత్రమే చెప్పి, దానికి నిర్దిష్టమైన సామాజిక, జాతి లేదా నైతిక కారణాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
  alternative: యూదు–సమరయ లేదా పురుష–స్త్రీ సామాజిక ఆచారాన్ని వచనంలోనే వివరిస్తూ విస్తరించడం.
  rationale: గ్రీకు పాఠ్యం ఆయన ఒక స్త్రీతో మాట్లాడుతున్నందుకు వారు ఆశ్చర్యపోయారని మాత్రమే చెబుతుంది. నేపథ్య కారణాలను స్పష్టంగా పేర్కొనదు; అందువల్ల మూలపాఠ్య సంయమనాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. మూలంలోని కొనసాగుతున్న సంభాషణ, శిష్యుల ఆశ్చర్యం, వారు ప్రశ్నించకపోవడం అనే వ్యత్యాసం నిలిచాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
