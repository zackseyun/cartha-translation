source:
  edition: SBLGNT
  text: ἤδη δὲ αὐτοῦ καταβαίνοντος οἱ δοῦλοι αὐτοῦ ⸀ὑπήντησαν ⸀αὐτῷ λέγοντες ὅτι ὁ παῖς ⸀αὐτοῦ ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/051.yaml
  text: And while he was already going down[a], his servants met him, saying that his child was alive.
translation:
  language: te
  text: అతడు అప్పటికే దిగివెళ్తుండగా, అతని దాసులు అతనికి ఎదురువచ్చి, అతని బిడ్డ[a] బ్రతికే ఉందని చెప్పారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కుమారుడు’; గ్రీకు పదం παῖς (పైస్)కు ‘బిడ్డ,’ ‘బాలుడు,’ లేదా కొన్ని సందర్భాల్లో ‘సేవకుడు’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: అప్పటికే
  rationale: సమావేశం జరగకముందే ప్రయాణం కొనసాగుతున్నదని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది కథనాన్ని ముందుకు నడిపే స్వల్ప అనుసంధాన అవ్యయం; తెలుగు వాక్య నిర్మాణంలో ‘-గా’ అనే అనుసంధానంతో దాని పని సహజంగా వ్యక్తమవుతుంది.
- source_word: καταβαίνοντος
  choice: దిగివెళ్తుండగా
  rationale: వర్తమాన కృదంతంతో కూడిన genitive absolute సమకాలీనంగా కొనసాగుతున్న చర్యను సూచిస్తుంది; కానా నుండి కపెర్నహూము వైపు దిగిపోవడాన్ని సహజంగా తెలుపుతుంది.
- source_word: δοῦλοι
  choice: దాసులు
  rationale: ఇంటి అధికారి ఆధీనంలోని బానిసల సామాజిక స్థితిని ‘సేవకులు’ కంటే స్పష్టంగా నిలుపుతుంది; ఆధునిక తెలుగులో గౌరవప్రదమైన కథన శైలికీ సరిపోతుంది.
- source_word: ὑπήντησαν αὐτῷ
  choice: అతనికి ఎదురువచ్చి
  rationale: వారు అతనిని కలుసుకోవడానికి ఎదురుగా వచ్చారనే క్రియలోని భావాన్ని ‘కలిశారు’ కంటే స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: λέγοντες
  choice: చెప్పారు
  rationale: తెలుగులో ప్రధాన క్రియగా మార్చడం ద్వారా attendant participle భావాన్ని సహజమైన కథన వాక్యంగా అందిస్తుంది.
- source_word: παῖς
  choice: బిడ్డ
  rationale: ఈ సందర్భంలో కుటుంబ సంబంధాన్ని నిలుపుతూ వయస్సును లేదా ‘కుమారుడు’ అనే మరింత నిర్దిష్ట అర్థాన్ని బలవంతంగా నిర్ణయించదు; పదంలోని విస్తృత అర్థసాధ్యతను పాదటిప్పణి తెలియజేస్తుంది.
- source_word: ζῇ
  choice: బ్రతికే ఉన్నాడు
  rationale: గ్రీకు వర్తమాన కాలంలోని ‘జీవిస్తున్నాడు/బ్రతికి ఉన్నాడు’ అనే తక్షణ స్థితిని నిలుపుతుంది; ‘కోలుకున్నాడు’ అనే వ్యాఖ్యానాత్మక విస్తరణను నివారిస్తుంది.
theological_decisions:
- issue: స్వస్థత కథనంలో παῖς ఎవరిని సూచిస్తుంది
  choice: అతని బిడ్డ
  alternative: అతని కుమారుడు; అతని సేవకుడు
  rationale: παῖς అనే పదం బిడ్డ, బాలుడు, కుమారుడు లేదా కొన్ని సందర్భాల్లో సేవకుడు అని అర్థమివ్వగలదు. యోహాను 4 విస్తృత సందర్భం కుటుంబ సంబంధాన్ని బలపరుస్తున్నా, ఈ వచనంలోని పదం ‘కుమారుడు’ అనే సన్నని అర్థాన్ని తప్పనిసరి చేయదు. అందువల్ల ప్రధాన పాఠ్యంలో ‘బిడ్డ’ను ఉంచి నిజమైన పదార్థ వైశాల్యాన్ని పాదటిప్పణిలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘దిగివెళ్తుండగా’ భౌగోళిక దిగుముఖ ప్రయాణాన్ని, ‘ఎదురువచ్చి’ ఉద్దేశపూర్వకంగా కలవడానికి రావడాన్ని సహజంగా తెలియజేస్తాయి. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో సంబంధిత పదం వెంట ఉంచబడింది.
