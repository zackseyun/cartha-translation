- from: అతడు అప్పటికే దిగివెళ్తుండగా, అతని దాసులు అతనికి ఎదురువచ్చి, అతని బిడ్డ[a] బ్రతికే ఉన్నాడని చెప్పారు.
  to: అతడు అప్పటికే దిగివెళ్తుండగా, అతని దాసులు అతనికి ఎదురువచ్చి, అతని బిడ్డ[a] బ్రతికే ఉందని చెప్పారు.
