id: JHN.4.25
reference: John 4:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ἡ γυνή· Οἶδα ὅτι Μεσσίας ἔρχεται, ὁ λεγόμενος χριστός· ὅταν ἔλθῃ ἐκεῖνος, ἀναγγελεῖ ἡμῖν ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/025.yaml
  text: The woman said to him[a], “I know that Messiah is coming” (the one called Messiah). “When he comes, he will tell us all things.”
translation:
  language: te
  text: ఆ స్త్రీ ఆయనతో, “మెస్సీయ వస్తున్నాడని నాకు తెలుసు (ఆయనను క్రీస్తు అని పిలుస్తారు).[a] ఆయన వచ్చినప్పుడు మాకు అన్నీ తెలియజేస్తాడు” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మెస్సీయ” అనేది సెమిటిక్ బిరుదు; దానికి సమానార్థకమైన గ్రీకు బిరుదు “క్రీస్తు.” రెండింటికీ “అభిషిక్తుడు” అని అర్థం.
    reason: మూలపాఠంలో ఉన్న రెండు భాషల సమానార్థక బిరుదుల సంబంధాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: λέγει
  choice: అంది
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, ఆధునిక తెలుగు కథనంలో భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: ἡ γυνή
  choice: ఆ స్త్రీ
  rationale: సందర్భంలో ముందే ప్రస్తావించబడిన సమరయ స్త్రీని సూచిస్తుంది; ‘ఆ స్త్రీ’ తెలుగులో సహజమైన నిర్దిష్ట సూచన.
- source_word: Οἶδα
  choice: నాకు తెలుసు
  rationale: జ్ఞానం లేదా అవగాహనను నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: Μεσσίας
  choice: మెస్సీయ
  rationale: సెమిటిక్ బిరుదును గుర్తించదగిన రూపంలో లిప్యంతరీకరించి, యూదు–సమరయ సందర్భాన్ని నిలుపుతుంది.
- source_word: ἔρχεται
  choice: వస్తున్నాడని
  rationale: వర్తమాన రూపంలోని భవిష్యదర్థాన్నీ, రాబోతున్నాడనే సమీప భావాన్నీ నిలుపుతుంది.
- source_word: ὁ λεγόμενος χριστός
  choice: క్రీస్తు అని పిలువబడే
  rationale: Μεσσίας అనే సెమిటిక్ బిరుదుకు χριστός అనే గ్రీకు సమానార్థక బిరుదుతో యోహాను ఇచ్చిన వివరణను కనిపించేలా ఉంచుతుంది.
- source_word: ὅταν ἔλθῃ ἐκεῖνος
  choice: ఆయన వచ్చినప్పుడు
  rationale: భవిష్యత్తులో ఆయన రాకను సూచించే నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; ἐκεῖνος లోని సూచనను ‘ఆయన’ నిలుపుతుంది.
- source_word: ἀναγγελεῖ ἡμῖν ἅπαντα
  choice: మనకు అన్నీ తెలియజేస్తాడు
  rationale: చెప్పి వెల్లడించడం అనే క్రియాభావాన్ని, ἅπαντα యొక్క సమగ్రతను స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: Μεσσίας మరియు χριστός అనే రెండు బిరుదుల సంబంధం
  choice: ప్రధాన వాక్యంలో ‘మెస్సీయ’ను, దానిని వివరించే పదంగా ‘క్రీస్తు’ను రెండింటినీ ఉంచడం
  alternative: రెండింటినీ ‘మెస్సీయ’గా అనువదించి మూలంలోని ద్విభాషా వివరణాత్మక భేదాన్ని కోల్పోవడం
  rationale: మూలపాఠం సెమిటిక్ బిరుదైన Μεσσίαςను గ్రీకు బిరుదైన χριστόςతో వివరిస్తుంది. రెండు రూపాలనూ ఉంచడం కొత్త సిద్ధాంతభేదాన్ని సృష్టించకుండా యోహాను ఇచ్చిన వివరణను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అదే సమయంలో గౌరవప్రదమైన వాక్యనిర్మాణం. ‘మెస్సీయ’ మరియు ‘క్రీస్తు’ రెండింటినీ నిలిపి మూలంలోని వివరణాత్మక నిర్మాణాన్ని సంరక్షించింది.
