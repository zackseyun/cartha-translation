- from: ఆ స్త్రీ ఆయనతో, “క్రీస్తు అని పిలువబడే మెస్సీయ వస్తున్నాడని నాకు తెలుసు.[a] ఆయన వచ్చినప్పుడు మనకు అన్నీ తెలియజేస్తాడు” అంది.
  to: ఆ స్త్రీ ఆయనతో, “మెస్సీయ వస్తున్నాడని నాకు తెలుసు (ఆయనను క్రీస్తు అని పిలుస్తారు).[a] ఆయన వచ్చినప్పుడు మాకు అన్నీ తెలియజేస్తాడు” అంది.
  rationale: The revision places the Greek explanatory expression after the statement that Messiah is coming, preserving the source’s appositional sequence and its bilingual explanatory function. It also uses exclusive “మాకు” for the woman’s community-directed ‘us’ in this immediate dialogue.
