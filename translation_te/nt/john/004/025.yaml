    reason: మూలపాఠంలో ఉన్న రెండు భాషల సమానార్థక బిరుదుల సంబంధాన్ని వివరిస్తుంది.
  revision_rationale: The revision places the Greek explanatory expression after the statement that Messiah is coming, preserving the source’s appositional sequence and its bilingual explanatory function. It also uses exclusive “మాకు” for the woman’s community-directed ‘us’ in this immediate dialogue.
