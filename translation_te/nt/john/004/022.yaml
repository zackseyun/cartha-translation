id: JHN.4.22
reference: John 4:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑμεῖς προσκυνεῖτε ὃ οὐκ οἴδατε, ἡμεῖς προσκυνοῦμεν ὃ οἴδαμεν, ὅτι ἡ σωτηρία ἐκ τῶν Ἰουδαίων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/022.yaml
  text: You worship what you do not know; we worship what we know[a], because salvation is from the Jews.
translation:
  language: te
  text: మీకు తెలియనిదానిని మీరు ఆరాధిస్తున్నారు; మాకు తెలిసినదానిని మేము ఆరాధిస్తున్నాము, ఎందుకంటే రక్షణ యూదుల నుండి వస్తుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదు ప్రజల నుండి.’ యోహాను సువార్తలో కొన్ని సందర్భాల్లో ఈ పదానికి ‘యూదయవాసులు’ అనే అర్థం సరిపోవచ్చు; అయితే ఇక్కడ ఆరాధన మరియు రక్షణ చరిత్ర విషయాల్లో సమరయులతో ఉన్న వ్యత్యాసం దృష్టిలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνεῖτε / προσκυνοῦμεν
  choice: ఆరాధిస్తున్నారు / ఆరాధిస్తున్నాం
  rationale: ఈ సందర్భంలో ఈ క్రియ కేవలం వంగి నమస్కరించడాన్ని కాక మతపరమైన ఆరాధనను సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఆరాధించు’ సహజమైన, స్పష్టమైన సమానార్థకం.
- source_word: ὃ
  choice: దాన్ని
  rationale: గ్రీకు నపుంసకలింగ సంబంధ సర్వనామంలోని సాధారణ సూచనను నిలుపుతూ, ‘ఎరుగనిదాన్ని / ఎరిగినదాన్ని’ అనే తెలుగు నిర్మాణం సహజంగా ఉంటుంది. ‘ఎవరిని’ అని అనువదిస్తే మూలంలో లేని వ్యక్తీకరణను అధికంగా నిర్దిష్టం చేసినట్టవుతుంది.
- source_word: οἴδατε / οἴδαμεν
  choice: ఎరుగనిది / ఎరిగినది
  rationale: ఆరాధనకు సంబంధించిన విషయంపై జ్ఞానాన్ని తెలిపే పదునైన వ్యత్యాసాన్ని ‘ఎరుగు’ కాపాడుతుంది; ఇది గౌరవప్రదమైన ప్రామాణిక తెలుగులో అర్థమయ్యే రూపం.
- source_word: σωτηρία
  choice: రక్షణ
  rationale: ఇక్కడ దేవుని రక్షణ కార్యాన్ని సూచించడానికి ‘రక్షణ’ ప్రామాణికమైన, సందర్భోచితమైన పదం; కేవలం తాత్కాలిక విడిపింపుకు పరిమితం చేయదు.
- source_word: ἐκ
  choice: నుంచే వస్తుంది
  rationale: ἐκ సూచించే మూలం లేదా ఉద్భవాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘నుంచి వస్తుంది’ ఉపయోగించబడింది. ‘ఏ’ బలం సందర్భంలోని కారణాత్మక ప్రకటనను స్పష్టంగా ఉంచుతుంది, అయితే మూలార్థాన్ని మార్చదు.
- source_word: τῶν Ἰουδαίων
  choice: యూదుల
  rationale: ఇక్కడ సమరయుల ఆరాధనతో యూదుల ఆరాధన, రక్షణ చరిత్ర మధ్య వ్యత్యాసం ఉంది. అందువల్ల ‘యూదులు’ ప్రత్యక్షమైన సరిపోలిక; ‘యూదయవాసులు’ అనే భౌగోళిక అర్థం ఈ సందర్భంలో అతిగా సంకుచితం.
theological_decisions:
- issue: ‘రక్షణ యూదుల నుంచి వస్తుంది’ అనే మాట యొక్క భావం
  choice: రక్షణ చరిత్రలో దాని మూలం, మధ్యవర్తిత్వం యూదు ప్రజల ద్వారా వచ్చాయని తెలిపే ప్రకటనగా మూలభాషా ఉద్రిక్తతను అలాగే ఉంచడం.
  alternative: ఇది కేవలం మెస్సీయ యూదుడిగా పుట్టడాన్ని సూచిస్తుంది; లేదా యూదుల ప్రత్యక్షత, ఆరాధన ప్రాధాన్యాన్ని విస్తృతంగా ప్రకటిస్తుంది.
  rationale: వాక్యం ముందు చెప్పిన ఆరాధన వ్యత్యాసానికి రక్షణ చరిత్ర ఆధారంగా కారణం ఇస్తుంది. అనువాదం జాతిపరమైన శ్రేష్ఠతను గానీ, మూలంలో స్పష్టంగా లేని విస్తృత సిద్ధాంత నిర్ణయాన్ని గానీ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక, గౌరవప్రదమైన తెలుగు. ‘ఆరాధించు,’ ‘రక్షణ’ వంటి పరిచితమైన బైబిలు పదాలను ఉంచి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకుడికి సహజంగా తీర్చిదిద్దాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
