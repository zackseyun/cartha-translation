  to: మీకు తెలియనిదానిని మీరు ఆరాధిస్తున్నారు; మాకు తెలిసినదానిని మేము ఆరాధిస్తున్నాము, ఎందుకంటే రక్షణ యూదుల నుండి వస్తుంది.[a]
