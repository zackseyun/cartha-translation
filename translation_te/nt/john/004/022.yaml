review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the twofold contrast in worship, the neuter/general object ('what'), and the causal statement about salvation's historical source. However, the emphatic suffix in ‘యూదుల నుంచే’ adds an exclusivity/emphasis not expressed by ἐκ τῶν Ἰουδαίων.
  naturalness: ‘ఎరుగనిదాన్ని / ఎరిగినదాన్ని’ is understandable but somewhat elevated/archaic for modern standard Telugu. ‘మీకు తెలియనిదానిని / మాకు తెలిసినదానిని’ is natural, clear, and retains the source contrast. Repeating the pronouns is idiomatic and gives the contrast appropriate clarity.
  terminology: ‘ఆరాధించు’ and ‘రక్షణ’ are appropriate standard biblical terms. ‘యూదులు’ is contextually suitable here, with the lexical-alternative footnote appropriately noting ‘యూదు ప్రజలు’ and the possible Johannine sense ‘యూదయవాసులు’ elsewhere.
  issues:
  - severity: low
    issue: Unwarranted emphasis in ‘యూదుల నుంచే’
    rationale: The enclitic ‘-ఏ’ means ‘from the Jews alone/indeed’ and adds emphasis not marked in the Greek ἐκ τῶν Ἰουδαίων. Use ‘యూదుల నుండి’.
  - severity: low
    issue: Slightly archaic wording ‘ఎరుగనిదాన్ని / ఎరిగినదాన్ని’
    rationale: Though valid Telugu, these forms are less natural in a modern-standard translation. ‘తెలియనిదానిని / తెలిసినదానిని’ communicates οἴδατε / οἴδαμεν directly and naturally.
  revised_text: మీకు తెలియనిదానిని మీరు ఆరాధిస్తున్నారు; మాకు తెలిసినదానిని మేము ఆరాధిస్తున్నాము, ఎందుకంటే రక్షణ యూదుల నుండి వస్తుంది.[a]
