  terminology: “మాటను నమ్మి” appropriately renders πιστεύω with τῷ λόγῳ and does not impose a doctrinal reading. “కుమారుడు” correctly preserves the male-specific υἱός. The alternative “విశ్వసించి” remains suitable in the footnote.
