  text: λέγει αὐτῷ ὁ Ἰησοῦς· Πορεύου· ὁ υἱός σου ζῇ. ⸀ἐπίστευσεν ὁ ἄνθρωπος τῷ λόγῳ ⸀ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς καὶ ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/050.yaml
  text: Jesus said to him[a], “Go; your son lives.” The man believed the word that Jesus spoke to him and went on his way.
translation:
  language: te
  text: యేసు అతనితో, “వెళ్లు; నీ కుమారుడు బ్రతికే ఉన్నాడు” అన్నాడు. యేసు అతనితో చెప్పిన మాటను ఆ మనిషి నమ్మి, వెళ్లిపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు అతనితో చెప్పిన మాటను విశ్వసించి, తన దారిన వెళ్లిపోయాడు.”
    reason: πιστεύωను “విశ్వసించి”గా, ἐπορεύετοను “తన దారిన వెళ్లిపోయాడు”గా సందర్భానుకూలంగా అనువదించే ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: Πορεύου
  choice: వెళ్లు
  rationale: πορεύομαι యొక్క ఆజ్ఞారూపాన్ని కథన సందర్భానికి తగిన సహజమైన, సంక్షిప్తమైన ఆదేశంగా అనువదిస్తుంది.
- source_word: ὁ υἱός σου
  choice: నీ కుమారుడు
  rationale: υἱός సాధారణంగా ‘బిడ్డ’ కంటే నిర్దిష్టంగా ‘కుమారుడు’ అని సూచిస్తుంది.
- source_word: ζῇ
  choice: బ్రతికే ఉన్నాడు
  rationale: వర్తమాన సూచనార్థక రూపాన్ని కాపాడుతూ, అతడు సజీవంగా ఉన్నాడనే యేసు ప్రకటనకు తెలుగులో సహజమైన బలాన్ని ఇస్తుంది; భవిష్యత్తులో బ్రతుకుతాడని మార్చదు.
- source_word: ἐπίστευσεν
  choice: నమ్మి
  rationale: τῷ λόγῳతో వచ్చిన πιστεύω ఇక్కడ పలికిన మాటను నమ్మడం లేదా విశ్వసించడాన్ని సూచిస్తుంది; యోహాను కథనంలోని విశ్వాస సంబంధమైన ఉద్వేగాన్ని అతిగా నిర్ణయించదు.
- source_word: ὁ ἄνθρωπος
  choice: ఆ మనిషి
  rationale: ఈ వచనం ముందటి గుర్తింపైన రాజోద్యోగి అనే పదాన్ని పునరావృతం చేయకుండా సాధారణంగా ἄνθρωπος అని చెప్పినందున దానిని కాపాడుతుంది.
- source_word: τῷ λόγῳ
  choice: మాటను
  rationale: ఇక్కడ λόγος యేసు పలికిన నిర్దిష్ట వాక్యాన్ని సూచిస్తుంది; ‘మాట’ ఆధునిక తెలుగులో సహజంగా ఉండి, తరువాతి సంబంధవాక్యంతో స్పష్టమవుతుంది.
- source_word: ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: యేసు తనతో చెప్పిన
  rationale: λόγοςను విశేషించే సంబంధవాక్యాన్ని తెలుగులో సహజమైన క్రమంలో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπορεύετο
  choice: బయలుదేరాడు
  rationale: ఆ మనిషి యేసు మాటను నమ్మిన తరువాత ప్రయాణం మొదలుపెట్టిన కథన గమనాన్ని సహజంగా తెలియజేస్తుంది; అసంపూర్ణ భూతకాల రూపానికి మించిన కాలవ్యాప్తిని బలవంతంగా చేర్చదు.
theological_decisions:
- issue: యేసు పలికిన వాగ్దానానికి ప్రతిస్పందనగా πιστεύω అనువాదం
  choice: నమ్మి
  alternative: విశ్వసించి / ఆ మాటపై నమ్మకం ఉంచి
  rationale: ఈ సందర్భంలో ఆ మనిషి యేసు మాటను నిజమని స్వీకరించాడని తెలుపుతుంది. దీన్ని రక్షణాత్మక విశ్వాసమా లేక తక్షణ నమ్మకమా అని వచనం చెప్పినదానికంటే ఎక్కువగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. యేసు ఆజ్ఞను సంక్షిప్తంగా ఉంచి, గ్రీకు వర్తమాన కాలంలోని ‘జీవించి ఉన్నాడు’ అనే భావాన్ని ‘బ్రతికే ఉన్నాడు’గా వ్యక్తం చేసింది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోతుంది.
