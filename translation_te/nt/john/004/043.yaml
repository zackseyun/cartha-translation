  yaml_path: translation/nt/john/004/043.yaml
  text: After the two days[a], he departed from there for Galilee.
translation:
  language: te
  text: ఆ రెండు రోజులు గడిచిన తర్వాత, ఆయన అక్కడి నుంచి గలిలయకు బయలుదేరాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ τὰς δύο ἡμέρας
  choice: ఆ రెండు రోజులు గడిచిన తర్వాత
  rationale: μετά + ద్వితీయా విభక్తి కాలక్రమంలో ‘తర్వాత’ అనే భావాన్ని ఇస్తుంది. నిర్దిష్ట సూచకంతో ఉన్న ‘రెండు రోజులు’ ముందుగా ప్రస్తావించిన సమరయలోని రెండు రోజుల బసను సూచిస్తున్నందున ‘ఆ రెండు రోజులు’ అని అనువదించాం. తెలుగులో సహజమైన కాలవ్యక్తీకరణ కోసం ‘గడిచిన’ చేర్చబడింది; δέ ఇక్కడ స్వల్ప అనుసంధానక పదం కాబట్టి ప్రత్యేకంగా అనువదించలేదు.
- source_word: ἐξῆλθεν
  choice: బయలుదేరాడు
  rationale: ἐξέρχομαι యొక్క భూతకాల రూపం అక్షరార్థంగా ‘బయటికి వెళ్లాడు’; ప్రయాణ కథనంలో ఒక ప్రదేశాన్ని విడిచి తదుపరి గమ్యానికి వెళ్లడాన్ని ‘బయలుదేరాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: ἐκεῖθεν
  choice: అక్కడి నుంచి
  rationale: ముందుగా పేర్కొన్న ప్రదేశం నుంచి ప్రయాణం మొదలైనట్లు తెలిపే సహజమైన ఆధునిక తెలుగు వ్యక్తీకరణ.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: గలిలయకు
  rationale: εἰς గమ్యస్థానం వైపు కదలికను సూచిస్తుంది. ‘గలిలయకు’ ఈ సందర్భంలో సరళంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. మూలంలోని కాలక్రమం మరియు ప్రయాణ గమ్యం సహజంగా వ్యక్తమయ్యాయి.
