translation:
  language: te
  text: ఆయన ఆమెతో, “వెళ్లి, నీ భర్తను పిలిచి, ఇక్కడికి రా” అని అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన ఆమెతో ఇలా అంటున్నాడు.” గ్రీకులో ఇక్కడ కథన వర్తమాన కాలం వాడబడింది; సహజమైన తెలుగు కథనశైలిలో దాన్ని భూతకాలంగా అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: అన్నాడు
  rationale: కథనంలో గ్రీకు వర్తమాన కాలం చారిత్రక వర్తమానంగా వాడబడింది; సహజమైన తెలుగు కథనశైలిలో భూతకాల రూపం సరిపోతుంది.
- source_word: αὐτῇ
  choice: ఆమెతో
  rationale: మాట్లాడటానికి సంబంధించిన పరోక్ష కర్మను తెలుగులో సహజంగా ‘ఆమెతో’ అని వ్యక్తం చేస్తుంది.
- source_word: Ὕπαγε
  choice: వెళ్లి
  rationale: తదుపరి ఆజ్ఞతో కలిపినప్పుడు తెలుగు వరుస క్రియారూపం సహజంగా ఉంటుంది; వెళ్లి ఆ పని చేయమనే ఆదేశాన్ని తెలియజేస్తుంది.
- source_word: φώνησον
  choice: పిలిచి
  rationale: φωνέω ఇక్కడ ఒక వ్యక్తిని పిలవడం లేదా వెంట తీసుకురావడానికి పిలవడం అనే అర్థంలో ఉంది; ‘పిలిచి’ సహజమైన సమానార్థకం.
- source_word: τὸν ἄνδρα σου
  choice: నీ భర్తను
  rationale: ἀνήρ అనే పదానికి ‘పురుషుడు’ లేదా ‘భర్త’ అనే అర్థాలు ఉండవచ్చు; స్వామ్యసూచక పదం మరియు సంభాషణ సందర్భం ఇక్కడ ‘భర్త’ అనే అర్థాన్ని సూచిస్తున్నాయి.
- source_word: καὶ
  choice: —
  rationale: గ్రీకు సముచ్చయాన్ని తెలుగులో ‘వెళ్లి… పిలిచి… రా’ అనే సహజమైన వరుస క్రియానిర్మాణం ద్వారా వ్యక్తం చేశాం; ప్రత్యేకంగా ‘మరియు’ అనడం అసహజంగా ఉంటుంది.
- source_word: ἐλθὲ
  choice: రా
  rationale: ప్రత్యక్ష ఆజ్ఞలో ఏకవచన సంబోధనకు సహజమైన తెలుగు రూపం; గ్రీకులో స్పష్టంగా లేని ‘తిరిగి’ అనే భావాన్ని చేర్చలేదు.
- source_word: ἐνθάδε
  choice: ఇక్కడికి
  rationale: గమ్యాన్ని సూచించే ‘ఇక్కడికి’ అనే రూపం ἐλθὲతో సహజంగా సరిపోతుంది.
