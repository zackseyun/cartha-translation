review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the two present actions, the harvest imagery, the orientation of the fruit toward eternal life, and the shared joy of sower and reaper. However, “ఆ విధంగా ... సంతోషిస్తారు” weakens the explicit ἵνα purpose clause into an indicative result statement. “సమకూరుస్తున్నాడు” can mean provides or makes available rather than gathers/collects; “కూడబెడుతున్నాడు” more directly reflects συνάγει.
  naturalness: The register is modern and accessible. The revised wording retains this while making the sentence linkage and harvest action more idiomatic and precise.
  terminology: “కూలి” appropriately preserves μισθός within the agricultural image. “ఫలం,” “నిత్యజీవం,” “విత్తేవాడు,” and “పంట కోసేవాడు” are clear, standard choices. The footnote appropriately preserves the goal/result range of εἰς.
  issues:
  - severity: medium
    issue: 'The ἵνα clause is rendered as an indicative statement: “ఆ విధంగా ... సంతోషిస్తారు.”'
    rationale: ἵνα introduces purpose (with possible result coloring). Telugu “... సంతోషించడానికి” preserves that relation without forcing a theological interpretation.
  - severity: low
    issue: “సమకూరుస్తున్నాడు” is less exact for συνάγει.
    rationale: In current Telugu it may suggest supplying or arranging rather than gathering. “కూడబెడుతున్నాడు” directly conveys collecting the fruit.
  revised_text: పంట కోసేవాడు కూలి పొందుతున్నాడు, నిత్యజీవం కోసం ఫలాన్ని కూడబెడుతున్నాడు[b], విత్తేవాడూ పంట కోసేవాడూ కలిసి సంతోషించడానికి.
  revised_footnotes:
