id: JHN.4.36
reference: John 4:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ὁ θερίζων μισθὸν λαμβάνει καὶ συνάγει καρπὸν εἰς ζωὴν αἰώνιον, ⸀ἵνα ὁ σπείρων ὁμοῦ χαίρῃ καὶ ὁ θερίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/036.yaml
  text: The one who reaps is receiving wages and gathering fruit for eternal life[b][a], so that the one who sows and the one who reaps may rejoice together.
translation:
  language: te
  text: పంట కోసేవాడు కూలి పొందుతున్నాడు, నిత్యజీవం కోసం ఫలాన్ని కూడబెడుతున్నాడు[b], విత్తేవాడూ పంట కోసేవాడూ కలిసి సంతోషించడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా, “నిత్యజీవంలోకి.” ఈ పదబంధం లక్ష్యాన్ని లేదా ఫలితాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θερίζων
  choice: కోత కోసేవాడు
  rationale: నామవాచకంగా వాడిన వర్తమాన కృదంతంలోని క్రియాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: μισθὸν
  choice: కూలి
  rationale: పంటపని రూపకంలో శ్రమకు లభించే ప్రతిఫలం అనే స్పష్టమైన భావాన్ని ఇస్తుంది; సందర్భానుసారం ‘ప్రతిఫలం’ అనే విస్తృత భావమూ దీనిలో ఉంది.
- source_word: λαμβάνει
  choice: పొందుతున్నాడు
  rationale: వర్తమాన కాలంలోని కొనసాగుతున్న లేదా ప్రస్తుతం జరుగుతున్న చర్యను వ్యక్తం చేస్తుంది.
- source_word: συνάγει
  choice: సమకూరుస్తున్నాడు
  rationale: పంట ఫలాన్ని ఒకచోట చేర్చే భావాన్ని, ముందున్న వర్తమాన చర్యకు సమాంతరంగా, సహజంగా తెలియజేస్తుంది.
- source_word: καρπὸν
  choice: ఫలాన్ని
  rationale: మూలంలోని పంట రూపక విస్తృతిని కాపాడుతుంది; ‘పంట’ అని అనువదిస్తే కోయడం మరియు సమకూర్చబడే ఫలం మధ్య తేడా తగ్గిపోతుంది.
- source_word: εἰς ζωὴν αἰώνιον
  choice: నిత్యజీవం కోసం
  rationale: εἰς సూచించగల లక్ష్యం లేదా ఫలిత దిశను సహజ తెలుగులో ఉంచుతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: ἵνα
  choice: ఆ విధంగా
  rationale: ఉద్దేశం/ఫలితం రెండింటికీ వీలున్న సంబంధాన్ని సందర్భానుకూలంగా తెలియజేస్తుంది; తెలుగులో వచ్చే తుది క్రియతో సహజంగా సరిపోతుంది.
- source_word: ὁ σπείρων
  choice: విత్తేవాడు
  rationale: నామవాచకంగా వాడిన వర్తమాన కృదంతాన్ని సంక్షిప్తంగా, ὁ θερίζωνతో సమాంతరంగా అందిస్తుంది.
- source_word: ὁμοῦ
  choice: కలిసి
  rationale: ఇద్దరి ఉమ్మడి సంతోషాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: χαίρῃ
  choice: సంతోషిస్తారు
  rationale: ἵναతో ఉన్న సంభావ్యార్థాన్ని తెలుగులో విడిగా సహాయక క్రియతో బరువెక్కించకుండా, ఉద్దేశం/ఫలిత సంబంధంలో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: వర్తమాన కోతను స్పష్టం చేయడానికి మూలంలో లేని ‘ఇప్పటికే’ అనే పదాన్ని చేర్చాలా
  choice: చేర్చలేదు
  alternative: ‘ఇప్పటికే కోత కోసేవాడు...’
  rationale: సమీప సందర్భంలో కోత ప్రస్తుతం జరుగుతోందనే భావం ఉన్నప్పటికీ, ఈ వాక్యంలో ప్రత్యేకంగా ‘ఇప్పటికే’ అనే క్రియావిశేషణం లేదు. ‘పొందుతున్నాడు’, ‘సమకూరుస్తున్నాడు’ అనే వర్తమాన రూపాలే తగిన తక్షణత్వాన్ని అందిస్తాయి.
- issue: εἰς ζωὴν αἰώνιονను లక్ష్యంగా లేదా ఫలితంగా నిర్దిష్టం చేయాలా
  choice: ‘నిత్యజీవం కోసం’ అని ఉంచి అర్థవిస్తృతిని కాపాడింది
  alternative: ‘నిత్యజీవంలోకి’
  rationale: εἰς ఇక్కడ లక్ష్యాన్ని లేదా ఫలిత దిశను సూచించగలదు. ఒకే భావాన్ని సిద్ధాంతపరంగా ఖరారు చేయకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. వ్యవసాయ రూపకాన్ని నిలుపుతూ ‘కోత కోసేవాడు’, ‘విత్తేవాడు’, ‘ఫలం’, ‘కూలి’ అనే సాధారణ పదాలను ఉపయోగించింది. పాదటిప్పణి గుర్తు [b] ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం తరువాత ఉంచబడింది; [a] అవసరం లేదు, ఎందుకంటే తెలుగు ‘కూలి’కి ‘ప్రతిఫలం’ ప్రత్యామ్నాయం వివరణాత్మకంగా తప్పనిసరి కాదు.
