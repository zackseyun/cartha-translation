revisions:
- from: కోత కోసేవాడు కూలి పొందుతున్నాడు; నిత్యజీవం కోసం ఫలాన్ని సమకూరుస్తున్నాడు[b]. ఆ విధంగా విత్తేవాడూ కోత కోసేవాడూ కలిసి సంతోషిస్తారు.
  to: పంట కోసేవాడు కూలి పొందుతున్నాడు, నిత్యజీవం కోసం ఫలాన్ని కూడబెడుతున్నాడు[b], విత్తేవాడూ పంట కోసేవాడూ కలిసి సంతోషించడానికి.
