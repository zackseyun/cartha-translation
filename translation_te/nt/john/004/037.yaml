id: JHN.4.37
reference: John 4:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν γὰρ τούτῳ ὁ λόγος ⸀ἐστὶν ἀληθινὸς ὅτι Ἄλλος ἐστὶν ὁ σπείρων καὶ ἄλλος ὁ θερίζων·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/037.yaml
  text: 'For in this the saying is true: one is the one sowing[c][b][a], and another the one reaping.'
translation:
  language: te
  text: ఎందుకంటే, “విత్తేవాడు ఒకడు, కోసేవాడు మరొకడు” అనే నానుడి[a] ఈ విషయంలో నిజమే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మాట.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ఈ విషయంలో
  rationale: ప్రస్తుత సందర్భాన్ని సూచించే గ్రీకు నిర్దేశక పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి మాటకు వివరణ లేదా ఆధారం అందించే అనుసంధాన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ὁ λόγος
  choice: నానుడి
  rationale: ఇక్కడ λόγος దైవశాస్త్ర సంబంధమైన ‘వాక్యము’ అనే బిరుదు కాదు; తరువాత వచ్చే సాధారణ వ్యవసాయ సూక్తిని సూచిస్తుంది. ‘నానుడి’ ఈ సందర్భంలో సహజంగా సరిపోతుంది; అయితే ‘మాట’ కూడా సాధ్యమే.
- source_word: ἀληθινός
  choice: నిజమే
  rationale: ఈ నానుడి చెల్లుబాటు అవుతుందని చెప్పే భావాన్ని సహజంగా అందిస్తుంది; ‘మే’ నిశ్చయార్థాన్ని తెలుగులో సున్నితంగా వ్యక్తం చేస్తుంది.
- source_word: ἄλλος ... καὶ ἄλλος
  choice: ఒకడు ... మరొకడు
  rationale: రెండు వేర్వేరు వ్యక్తులు లేదా పక్షాల మధ్య ఉన్న వ్యత్యాసాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ὁ σπείρων
  choice: విత్తేవాడు
  rationale: నామవాచకంగా వాడిన వర్తమాన కృదంతాన్ని తెలుగులో సహజమైన కర్తృరూపంతో అనువదిస్తుంది.
- source_word: ὁ θερίζων
  choice: కోసేవాడు
  rationale: పంట కోయడాన్ని సూచించే కృదంతానికి సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే సహజ తెలుగు రూపం; ‘విత్తేవాడు’తో సమాంతరతను కాపాడుతుంది.
theological_decisions:
- issue: వ్యవసాయ నానుడిలోని వ్యక్తుల గుర్తింపు
  choice: విత్తేవాడు, కోసేవాడు ఎవరో ఈ వాక్యంలో నిర్దిష్టంగా చెప్పకుండా సాధారణ నానుడిగానే ఉంచడం
  alternative: విత్తేవాడిని ప్రవక్తలు, యోహాను లేదా యేసుగా; కోసేవాడిని శిష్యులుగా అనువాదంలోనే గుర్తించడం
  rationale: గ్రీకు వాక్యం ఈ వ్యక్తులను ఇక్కడ గుర్తించదు; సందర్భం దాని అన్వయాన్ని అందిస్తుంది. అందువల్ల వ్యాఖ్యానాన్ని పాఠ్యంలోకి చేర్చకుండా మూలంలోని విస్తృతతను, దైవశాస్త్ర సంబంధమైన ఉద్వేగాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన నానుడి శైలిని ఉపయోగించాం. గ్రీకు పదక్రమాన్ని యథాతథంగా అనుసరించకుండా, సూక్తి విషయాన్ని ముందుగా ఉంచి తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా తీర్చిదిద్దాం.
