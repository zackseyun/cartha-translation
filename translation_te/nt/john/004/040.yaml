source:
  edition: SBLGNT
  text: ὡς οὖν ἦλθον πρὸς αὐτὸν οἱ Σαμαρῖται, ἠρώτων αὐτὸν μεῖναι παρ’ αὐτοῖς· καὶ ἔμεινεν ἐκεῖ δύο ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/040.yaml
  text: So when the Samaritans came to him[a], they asked him to stay with them, and he stayed there two days.
translation:
  language: te
  text: కాబట్టి సమరయులు ఆయన దగ్గరకు వచ్చినప్పుడు, తమతో ఉండమని ఆయనను అడుగుతూనే ఉన్నారు[a]. ఆయన అక్కడ రెండు రోజులు ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆయనను అడిగారు.’ గ్రీకు అసంపూర్ణ భూతకాల క్రియారూపం కొనసాగిస్తూ లేదా పదేపదే అడిగారని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς οὖν
  choice: కాబట్టి ... వచ్చినప్పుడు
  rationale: οὖν లోని ముందటి సందర్భంతో సంబంధాన్ని ‘కాబట్టి’ తెలియజేస్తుంది; ὡς యొక్క కాలార్థాన్ని ‘వచ్చినప్పుడు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἦλθον πρὸς αὐτὸν
  choice: ఆయన దగ్గరకు వచ్చినప్పుడు
  rationale: πρός + ద్వితీయా విభక్తి ఒక వ్యక్తివైపు వచ్చి చేరడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘దగ్గరకు వచ్చారు’ సహజమైన వ్యక్తీకరణ.
- source_word: οἱ Σαμαρῖται
  choice: సమరయులు
  rationale: ఇది సమరయ ప్రాంతానికి చెందిన ప్రజలను సూచించే సూటి జాతి/సమూహ నామం.
- source_word: ἠρώτων
  choice: అడుగుతూనే ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పదేపదే చేసిన అభ్యర్థనను సూచించగలదు; తెలుగు క్రియారూపం ఆ భావాన్ని నిలుపుతుంది.
- source_word: μεῖναι παρ’ αὐτοῖς
  choice: తమతో ఉండమని
  rationale: μένω ఇక్కడ ‘ఉండు’ అనే భావంలో ఉంది; παρά + చతుర్థీ విభక్తి వారి సహవాసంలో ఉండటాన్ని సూచిస్తుంది. కర్తతో తిరిగి సంబంధాన్ని చూపేందుకు ‘తమతో’ వాడబడింది.
- source_word: καὶ ἔμεινεν ἐκεῖ
  choice: ఆయన అక్కడ ... ఉన్నాడు
  rationale: ముందటి μένω పదంతో భావసామ్యాన్ని నిలుపుతూ ἐκεῖని ‘అక్కడ’ అని స్పష్టంగా అనువదిస్తుంది.
- source_word: δύο ἡμέρας
  choice: రెండు రోజులు
  rationale: కాలవ్యవధిని తెలిపే ద్వితీయా విభక్తికి నేరమైన, సహజమైన తెలుగు అనువాదం.
