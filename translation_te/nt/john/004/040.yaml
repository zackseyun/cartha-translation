  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘అడుగుతూనే ఉన్నారు’ అనే రూపం గ్రీకు imperfect యొక్క కొనసాగింపు/పునరావృత సంభావ్యతను ప్రధాన పాఠ్యంలో నిలుపుతుంది; సహజమైన సరళ ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
