  source_fidelity: ‘కాబట్టి … వచ్చినప్పుడు’ appropriately conveys the sequential/inferential οὖν together with temporal ὡς. ‘సమరయులు ఆయన దగ్గరకు వచ్చినప్పుడు’ accurately renders the subject and πρὸς αὐτόν. ‘అడుగుతూనే ఉన్నారు’ is a defensible, clear rendering of the imperfect ἠρώτων, preserving its possible continuing/repeated sense without overstating it. The request ‘తమతో ఉండమని’ accurately represents μεῖναι παρ’ αὐτοῖς, and the final clause retains both ἐκεῖ and the two-day duration.
  naturalness: The Telugu is fluent, modern standard, and appropriately respectful. ‘తమతో’ correctly refers back to the Samaritans, and the two-sentence structure reads naturally in Telugu while preserving the Greek sequence.
  terminology: ‘సమరయులు’ is an established and suitable designation for the Samaritans. ‘ఉండమని’ / ‘ఉన్నాడు’ consistently conveys the relevant sense of μένω in this context. No theological terminology is at issue.
