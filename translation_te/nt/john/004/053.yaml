source:
  edition: SBLGNT
  text: ἔγνω οὖν ὁ πατὴρ ⸀ὅτι ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ εἶπεν αὐτῷ ὁ ⸀Ἰησοῦς· Ὁ υἱός σου ζῇ, καὶ ἐπίστευσεν αὐτὸς καὶ ἡ οἰκία αὐτοῦ ὅλη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/053.yaml
  text: So the father knew that it was at that hour when Jesus said to him[a], “Your son lives,” and he himself believed[b], and his whole household.
translation:
  language: te
  text: కాబట్టి, యేసు అతనితో, “నీ కుమారుడు సజీవంగా ఉన్నాడు[a]” అని చెప్పిన అదే సమయంలో తన కుమారునికి జ్వరం తగ్గిందని ఆ తండ్రి గ్రహించాడు. అతడు స్వయంగా విశ్వసించాడు[b]; అతని ఇంటివారందరూ కూడా విశ్వసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ కుమారుడు బతికున్నాడు.”
    reason: lexical_alternative
  - marker: b
    text: “విశ్వసించాడు” అనే క్రియ యేసు పలికిన మాటను ప్రత్యేకంగా నమ్మడాన్నిగానీ, యేసుపై మరింత సంపూర్ణ విశ్వాసానికి రావడాన్నిగానీ సూచించవచ్చు; గ్రీకు పాఠం దాని పరిధిని స్పష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: గ్రహించాడు
  rationale: సేవకులు తెలిపిన సమయమూ యేసు పలికిన సమయమూ ఒకటేనని తండ్రి గుర్తించిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: మునుపటి వచనంలోని సేవకుల నివేదిక ఆధారంగా వచ్చిన నిర్ధారణను సూచిస్తుంది.
- source_word: ὁ πατὴρ
  choice: ఆ తండ్రి
  rationale: గ్రీకు పాఠంలోని కుటుంబ సంబంధ సూచనను నిలుపుతూ, కథనంలో ఇప్పటికే ప్రస్తావించబడిన వ్యక్తిని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ
  choice: చెప్పిన సమయం అదే
  rationale: నిర్దిష్టమైన సమయసామ్యాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో స్పష్టంగా వ్యక్తం చేస్తుంది; మూలంలో లేని అదనపు ఉద్ఘాటనను చేర్చదు.
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: యేసు తనతో చెప్పిన
  rationale: λέγω యొక్క సాధారణ అర్థాన్ని, పరోక్ష కర్మను, తెలుగు సంబంధవాచక నిర్మాణంలో సహజంగా అందిస్తుంది.
- source_word: Ὁ υἱός σου ζῇ
  choice: నీ కుమారుడు బతికే ఉన్నాడు
  rationale: ζῇ సూచించే ప్రస్తుత సజీవ స్థితిని సందర్భానుకూలమైన, సాధారణ తెలుగులో తెలియజేస్తుంది; భవిష్యత్తు అర్థాన్ని చేర్చదు.
- source_word: ἐπίστευσεν
  choice: విశ్వసించారు
  rationale: πιστεύω యొక్క పరిధిని—యేసు మాటను నమ్మడమా లేక యేసుపై మరింత సంపూర్ణ విశ్వాసానికి రావడమా—నిర్ణయించకుండా సాధారణ విశ్వాస పదాన్ని ఉపయోగిస్తుంది.
- source_word: αὐτὸς
  choice: అతడు స్వయంగా
  rationale: వ్యక్తి స్వయంగా విశ్వసించినట్లు గ్రీకులోని స్పష్టమైన సర్వనామ ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἡ οἰκία αὐτοῦ ὅλη
  choice: అతని ఇంటివారందరూ
  rationale: οἰκίαను భవనంగా కాక గృహసముదాయంగా అర్థం చేసుకుని, ὅλη సూచించే సంపూర్ణతను సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: తండ్రి ‘విశ్వసించాడు’ అనే మాట పరిధి
  choice: విశ్వసించారు అనే సాధారణ పదంతోనే, విశ్వాసం యొక్క పూర్తి పరిధిని నిర్దిష్టం చేయకుండా ఉంచడం
  alternative: అతడు యేసు స్వస్థపరిచే మాటనే నమ్మాడు; లేదా ఈ సమయంలో యేసుపై సంపూర్ణ రక్షక విశ్వాసానికి వచ్చాడు
  rationale: యోహాను సువార్తలో πιστεύωకు లోతైన ధార్మిక ప్రాధాన్యం ఉండగలిగినా, ఈ వచనం ఆ విశ్వాసపు పరిధిని స్పష్టంగా నిర్వచించదు. అందువల్ల మూలంలోని ఉద్దేశపూర్వక అనిర్దిష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథన శైలిలో రూపొందించబడింది. ‘బతికే ఉన్నాడు’ సందర్భంలో సహజంగా ఉండగా, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం. మూలంలోని విశ్వాస సంబంధిత అనిశ్చితిని పరిష్కరించకుండా నిలిపాం.
