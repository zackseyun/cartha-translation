revisions:
- from: అక్కడ యాకోబు బావి[a] ఉంది. ప్రయాణం వల్ల అలసిపోయిన యేసు, ఆ బావి దగ్గర అలాగే[b] కూర్చొని ఉన్నాడు. అప్పుడు సుమారు ఆరవ గంట[c] అయింది.
  to: అక్కడ యాకోబు బావి[a] ఉంది. ప్రయాణం వల్ల అలసిపోయిన యేసు ఆ బావి దగ్గర అలాగే[b] కూర్చొని ఉన్నాడు. ఆ సమయం సుమారు ఆరవ గంట[c].
  rationale: The revision removes an unnecessary temporal addition, uses a more direct Telugu expression for the Greek time clause, and makes the explanatory noon gloss conditional. It retains the draft's source-sensitive rendering of the disputed nuance of οὕτως and the lexical alternative for πηγή.
