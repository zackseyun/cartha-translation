id: JHN.4.6
reference: John 4:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἦν δὲ ἐκεῖ πηγὴ τοῦ Ἰακώβ. ὁ οὖν Ἰησοῦς κεκοπιακὼς ἐκ τῆς ὁδοιπορίας ἐκαθέζετο οὕτως ἐπὶ τῇ πηγῇ· ὥρα ἦν ⸀ὡς ἕκτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/006.yaml
  text: Jacob’s well was there[a]. So Jesus, wearied from the journey, was sitting there by the well[c][b]. It was about the sixth hour.
translation:
  language: te
  text: అక్కడ యాకోబు బావి[a] ఉంది. ప్రయాణం వల్ల అలసిపోయిన యేసు ఆ బావి దగ్గర అలాగే[b] కూర్చొని ఉన్నాడు. ఆ సమయం సుమారు ఆరవ గంట[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఊట’; గ్రీకు పదం ఊటను లేదా బావిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘అలాగే’ అనే పదానికి ‘ఆ విధంగా’ లేదా ‘ఉన్న స్థితిలోనే’ అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: పగటి గంటల పద్ధతిలో లెక్కిస్తే ఇది సుమారు మధ్యాహ్నం. అయితే ఇక్కడి కాలగణనపై భిన్నాభిప్రాయాలు ఉన్నాయి.
    reason: interpretive_alternative
lexical_decisions:
- source_word: πηγὴ τοῦ Ἰακώβ
  choice: యాకోబు బావి
  rationale: πηγή అనేది ఊటను లేదా బావిని సూచించగలదు. ఇక్కడ నీళ్లు తోడే స్థలంగా తరువాతి కథనం వర్ణిస్తున్నందున ‘బావి’ సహజమైన సందర్భోచిత పదం; ‘ఊట’ను పాదటిప్పణిలో ఉంచాం.
- source_word: κεκοπιακὼς ἐκ τῆς ὁδοιπορίας
  choice: ప్రయాణం వల్ల అలసిపోయిన
  rationale: పూర్తయిన శ్రమ ఫలితంగా కొనసాగుతున్న అలసట స్థితిని κεκοπιακώς తెలియజేస్తుంది; ἐκ ఇక్కడ కారణాన్ని సూచిస్తుంది.
- source_word: ἐκαθέζετο
  choice: కూర్చొని ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న, వర్ణనాత్మక భావాన్ని తెలుగులో ‘కూర్చొని ఉన్నాడు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὕτως
  choice: అలాగే
  rationale: ఈ పదానికి ‘ఆ విధంగా’ లేదా ‘ఉన్న స్థితిలోనే’ అనే భావం ఉండవచ్చు. దాన్ని తొలగించకుండా ‘అలాగే’ అని ఉంచి, దాని అనిశ్చిత సూక్ష్మార్థాన్ని పాదటిప్పణిలో వివరించాం.
- source_word: ἐπὶ τῇ πηγῇ
  choice: ఆ బావి దగ్గర
  rationale: ἐπί + dative ఇక్కడ స్థానాన్ని సూచిస్తుంది; బావి పక్కన విశ్రాంతి తీసుకుంటున్న సందర్భంలో ‘దగ్గర’ సహజమైన తెలుగు ప్రయోగం.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: అప్పుడు సుమారు ఆరవ గంట అయింది
  rationale: ὡς లోని సుమారు అనే భావాన్ని నిలుపుతూ, ἕκτηను ఆధునిక గడియార సమయంగా ముందే నిర్ణయించకుండా మూలంలోని ‘ఆరవ గంట’నే ఉంచాం.
theological_decisions:
- issue: ‘ఆరవ గంట’కు ఆధునిక సమయ సమానం
  choice: ప్రధాన పాఠ్యంలో ‘సుమారు ఆరవ గంట’ అని మూల వ్యక్తీకరణను నిలుపుకోవడం
  alternative: యూదుల పగటి గంటల లెక్క ప్రకారం సుమారు మధ్యాహ్నం; రోమా కాలగణన అనే అభిప్రాయం ప్రకారం సాయంత్రం సుమారు ఆరు గంటలు
  rationale: గ్రీకు పాఠ్యం ఏ ఆధునిక గడియార సమానాన్ని స్పష్టంగా చెప్పదు. యోహాను సువార్తలోని కాలగణనపై ఉన్న వ్యాఖ్యాన భేదాన్ని అనువాదంలో ఏకపక్షంగా పరిష్కరించకుండా మూలంలోని ఉద్రిక్తతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ‘బావి’, ‘అలసిపోయిన’, ‘కూర్చొని ఉన్నాడు’ వంటి సహజ పదాలను వాడుతూ, οὕτως మరియు కాలసూచనలోని నిజమైన అనిశ్చితిని పాదటిప్పణుల్లో నిలుపుకున్నాం.
