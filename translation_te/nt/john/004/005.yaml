reference: John 4:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔρχεται οὖν εἰς πόλιν τῆς Σαμαρείας λεγομένην Συχὰρ πλησίον τοῦ χωρίου ὃ ἔδωκεν Ἰακὼβ ⸀τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/005.yaml
  text: So he came to a town of Samaria called Sychar[b][a], near the piece of land that Jacob had given to Joseph his son.
translation:
  language: te
  text: కాబట్టి ఆయన సమరయలోని సుఖారు అనే పట్టణానికి వచ్చాడు.[a] అది యాకోబు తన కుమారుడైన యోసేపుకు ఇచ్చిన భూభాగానికి దగ్గరగా ఉంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సమరయ నగరానికి.” గ్రీకు పదం πόλις సందర్భాన్ని బట్టి నగరాన్నైనా పట్టణాన్నైనా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “పొలానికి” లేదా “ఆస్తికి.” గ్రీకు పదం χωρίον పొలం, ఆస్తి లేదా భూమిలో ఒక భాగాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: వచ్చాడు
  rationale: కథనంలో ఇది చారిత్రక వర్తమాన కాలం; ఆధునిక తెలుగు కథనశైలిలో భూతకాల రూపం సహజంగా సంఘటనల క్రమాన్ని తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సందర్భంతో ఉన్న అనుసంధానాన్ని, దాని ఫలితంగా జరిగిన కథన పురోగతిని నిలుపుతుంది.
- source_word: πόλιν τῆς Σαμαρείας
  choice: సమరయ పట్టణానికి
  rationale: πόλις నగరాన్నైనా పట్టణాన్నైనా సూచించగలదు; సుఖారు పరిమాణాన్ని అతిశయింపజేయకుండా ‘పట్టణం’ సహజంగా ఉంది. సంబంధవాచక గ్రీకు నిర్మాణాన్ని తెలుగులో ప్రాంతసంబంధ విశేషణంగా అందించాం.
- source_word: λεγομένην Συχὰρ
  choice: సుఖారు అనే
  rationale: ఆ పట్టణం పేరును పరిచయం చేసే గ్రీకు కృదంత నిర్మాణానికి సహజమైన తెలుగు రూపం.
- source_word: πλησίον
  choice: దగ్గరగా
  rationale: స్థలసామీప్యాన్ని స్పష్టంగా, సాధారణ ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: χωρίου
  choice: భూమి భాగానికి
  rationale: χωρίον పొలం, ఆస్తి లేదా ఒక భూభాగాన్ని సూచించగలదు; ‘భూమి భాగం’ సాగుభూమి అనే భావానికే పరిమితం చేయదు.
- source_word: ὃ ἔδωκεν Ἰακὼβ τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ
  choice: యాకోబు తన కుమారుడైన యోసేపుకు ఇచ్చిన
  rationale: యాకోబు ఇచ్చినవాడని, యోసేపు స్వీకర్త మరియు అతని కుమారుడని గ్రీకు వాక్య సంబంధాలను స్పష్టంగా నిలుపుతుంది.
