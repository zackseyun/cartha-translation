  rationale: ముఖ్య వాక్యాన్ని μή τις ప్రశ్న యొక్క ప్రతికూల జవాబు నిరీక్షణను సహజమైన తెలుగు ప్రశ్నారూపంలో వ్యక్తం చేసేలా సవరించాం. ἔλεγον సూచించే కొనసాగుతున్న గతకాల సంభాషణను “చెప్పుకుంటూ ఉన్నారు” ద్వారా నిలిపాం. పాదసూచికలో తటస్థ ప్రశ్నా ప్రత్యామ్నాయాన్ని ఉంచి, అర్థాన్ని అతిగా నిర్దిష్టం చేయకుండా మూలభాషా సూక్ష్మతను స్పష్టం చేశాం.
