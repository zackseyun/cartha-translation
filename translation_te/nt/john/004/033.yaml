  yaml_path: translation/nt/john/004/033.yaml
  text: So the disciples were saying to one another[a], “Has anyone brought him something to eat?”
translation:
  language: te
  text: కాబట్టి శిష్యులు ఒకరితో ఒకరు, “ఎవరూ ఆయనకు తినడానికి ఏమీ తెచ్చి ఉండరు కదా?” అని చెప్పుకుంటూ ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎవరైనా ఆయనకు తినడానికి ఏమైనా తెచ్చారా?” గ్రీకు భాషలో μήతో మొదలయ్యే ఈ ప్రశ్న ప్రతికూల జవాబును ఆశిస్తుంది.
    reason: గ్రీకు ప్రశ్నలోని ప్రతికూల జవాబు నిరీక్షణను ప్రధాన అనువాదం ప్రతిబింబిస్తుంది; మరింత తటస్థంగా వినిపించే ప్రత్యామ్నాయ రూపాన్ని ఇక్కడ ఇస్తుంది.
lexical_decisions:
- source_word: ἔλεγον
  choice: చెప్పుకుంటున్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న సంభాషణను తెలుగులో సహజమైన పరస్పర క్రియతో వ్యక్తం చేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి మాటకు ప్రతిస్పందనగా శిష్యులు చేసిన ఊహను, కథనంలోని తార్కిక అనుసంధానాన్ని తెలియజేస్తుంది.
- source_word: οἱ μαθηταὶ
  choice: శిష్యులు
  rationale: యోహాను సువార్త సందర్భంలో μαθηταίకు స్థిరమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: πρὸς ἀλλήλους
  choice: ఒకరితో ఒకరు
  rationale: గుంపులోని పరస్పర సంభాషణను నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Μή τις
  choice: ఎవరైనా ... తెచ్చారా?
  rationale: తెలుగులో సహజమైన ప్రశ్నగా ఉంటుంది; μή వల్ల ఆశించబడే ప్రతికూల జవాబును పాదసూచికలో స్పష్టం చేసి, ప్రశ్నలోని సూక్ష్మ భావాన్ని అతిగా నిర్ధారించకుండా ఉంచుతుంది.
- source_word: ἤνεγκεν
  choice: తెచ్చారా
  rationale: ఈ సందర్భంలో ఆహారాన్ని యేసు దగ్గరకు తీసుకురావడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: αὐτῷ
  choice: ఆయనకు
  rationale: దత్తివాచక పరోక్ష కర్మను గౌరవప్రదమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: φαγεῖν
  choice: తినడానికి ఏమైనా
  rationale: ‘తినడానికి’ అనే క్రియార్థక రూపంతో పాటు సందర్భంలో సూచితమైన ఆహారాన్ని ‘ఏమైనా’ అని సహజంగా వెల్లడిస్తుంది.
