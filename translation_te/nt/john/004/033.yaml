translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. అసంపూర్ణ క్రియాభావాన్ని ‘చెప్పుకుంటున్నారు’ ద్వారా నిలిపి, గ్రీకు ప్రశ్నలోని ప్రతికూల జవాబు నిరీక్షణను పాదసూచికలో సంరక్షించాం.
