id: JHN.4.14
reference: John 4:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν πίῃ ἐκ τοῦ ὕδατος οὗ ἐγὼ δώσω αὐτῷ, οὐ μὴ ⸀διψήσει εἰς τὸν αἰῶνα, ἀλλὰ τὸ ὕδωρ ὃ δώσω αὐτῷ γενήσεται ἐν αὐτῷ πηγὴ ὕδατος ἁλλομένου εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/014.yaml
  text: But whoever drinks from the water that I will give him will never thirst forever; rather, the water that I will give him will become in him a spring of water welling up to eternal life.
translation:
  language: te
  text: కాని నేను అతనికి ఇవ్వబోయే నీటిని తాగే వ్యక్తి ఎన్నటికీ దాహపడడు. అంతేకాదు, నేను అతనికి ఇచ్చే నీరు అతనిలో నిత్యజీవానికి ఉబికే నీటి ఊటగా మారుతుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴ διψήσει εἰς τὸν αἰῶνα
  choice: ఎన్నటికీ దాహపడడు
  rationale: οὐ μή అనే బలమైన నిరాకరణను, εἰς τὸν αἰῶνα సూచించే నిరంతర కాల భావాన్ని సహజమైన ఆధునిక తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: πηγὴ ὕδατος
  choice: నీటి ఊట
  rationale: πηγή ఇక్కడ ప్రవహించే నీటి మూలాన్ని సూచిస్తుంది; ‘ఊట’ ఆ జీవంతమైన మూల భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: ἁλλομένου
  choice: ఉబికే
  rationale: ἅλλομαι యొక్క ఎగసిపడే లేదా ఉబికి ప్రవహించే చలన భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ζωὴν αἰώνιον
  choice: నిత్యజీవం
  rationale: యోహాను సువార్తలో స్థిరంగా కనిపించే theological పదబంధాన్ని సహజమైన, విస్తృతంగా అర్థమయ్యే తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: εἰς ζωὴν αἰώνιον లోని εἰς సంబంధం
  choice: నిత్యజీవానికి ఉబికే
  alternative: నిత్యజీవంలోకి ఉబికే
  rationale: εἰς యొక్క గమ్యం లేదా ఫలిత భావాన్ని నిలుపుతూ, నీరు అక్షరార్థంగా ‘జీవంలోకి’ దూకుతుందనే అసహజతను నివారిస్తుంది; నిత్యజీవమే ఆ ఊట ప్రవాహపు గమ్యం లేదా ఫలితం అనే ఉద్రిక్తతను పరిష్కరించకుండా ఉంచుతుంది.
- issue: దాహం ఇక ఎప్పటికీ ఉండదనే వాక్య స్వభావం
  choice: ఎన్నటికీ దాహపడడు
  alternative: ఎప్పటికీ దాహపడనే పడడు
  rationale: మూలంలోని బలమైన నిరాకరణను స్పష్టంగా నిలుపుతుంది; అదే సమయంలో ఇది శారీరక దాహమా లేక యోహాను సందర్భంలోని ఆధ్యాత్మిక రూపకమా అని అనువాదంలో అదనపు వివరణ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘అతనికి/అతనిలో’ అనే రూపాలు మూలంలోని ఏకవచన αὐτῷను నిలుపుతున్నాయి.
