  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. గ్రీకు వాక్యంలో కర్త అంతర్లీనంగా ఉన్నప్పటికీ, తెలుగు సందర్భస్పష్టత కోసం ‘ఆయన’ చేర్చబడింది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
