    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῆκεν
  choice: విడిచిపెట్టి
  rationale: ఇక్కడ ἀφίημι ఒక ప్రదేశాన్ని వదలి వెళ్లడాన్ని సూచిస్తుంది. ‘విడిచిపెట్టి’ సహజమైన తెలుగులో తరువాతి ప్రయాణక్రియతో సులభంగా కలుస్తుంది.
- source_word: τὴν Ἰουδαίαν
  choice: యూదయను
  rationale: సువార్తల భౌగోళిక సందర్భంలో Ἰουδαίαకు ప్రామాణిక తెలుగు స్థలనామం ‘యూదయ’.
- source_word: ἀπῆλθεν
  choice: వెళ్లాడు
  rationale: ἀπέρχομαι ఇక్కడ ఒక ప్రాంతం నుంచి మరొక ప్రాంతానికి వెళ్లడాన్ని తెలియజేస్తుంది; ‘వెళ్లాడు’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: πάλιν
  choice: తిరిగి
  rationale: ఈ ప్రయాణ సందర్భంలో πάλιν కేవలం చర్య పునరావృతం కంటే మునుపటి ప్రాంతానికి తిరుగు ప్రయాణాన్ని సూచిస్తుంది. ‘తిరిగి’ ఈ అర్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: గలిలయకు
  rationale: εἰς గమ్యస్థానం వైపు కదలికను సూచిస్తుంది; ప్రాంతానికి ప్రయాణాన్ని తెలుగులో ‘గలిలయకు’ సహజంగా తెలియజేస్తుంది.
