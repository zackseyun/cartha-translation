base_translation:
  language: en
  yaml_path: translation/nt/john/004/024.yaml
  text: God is spirit[b][a], and those who worship him must worship in spirit and truth.
translation:
  language: te
  text: దేవుడు ఆత్మస్వరూపి[b]. ఆయనను ఆరాధించేవారు ఆత్మలోను సత్యంలోను[a] ఆరాధించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిశుద్ధాత్మలోను సత్యంలోను.” గ్రీకు పదబంధాన్ని ఇలా మరింత నిర్దిష్టంగా అర్థం చేసుకోవచ్చు; ప్రధాన పాఠం దాని విస్తృత భావాన్ని నిలుపుతుంది.
    reason: alternative_reading
  - marker: b
    text: “దేవుడు ఆత్మస్వరూపి” అనేది దేవుని స్వభావాన్ని తెలియజేస్తుంది; దేవుడు ఇతర ఆత్మజీవుల్లో ఒకడని దీని అర్థం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: ఆత్మస్వరూపి
  rationale: వ్యాసరహిత విధేయ నామవాచకం దేవుని స్వభావాన్ని గుణాత్మకంగా తెలియజేస్తుంది. ‘ఒక ఆత్మ’ అని చెప్పి దేవుణ్ణి ఇతర ఆత్మజీవుల్లో ఒకరిగా చూపకుండా, సహజమైన తెలుగులో ఈ భావాన్ని అందిస్తుంది.
- source_word: ὁ θεός
  choice: దేవుడు
  rationale: θεόςకు ప్రామాణిక తెలుగు రూపం; గ్రీకులోని పదనిర్దేశక ఉపపదం ఈ వాక్యంలో ‘దేవుడు’నే కర్తగా గుర్తిస్తుంది.
- source_word: τοὺς προσκυνοῦντας αὐτόν
  choice: ఆయనను ఆరాధించేవారు
  rationale: ఉపపదంతో కూడిన వర్తమాన కృదంతం ఆరాధించే వారిని ఒక వర్గంగా సూచిస్తుంది; ఈ రూపం ఆధునిక తెలుగులో సహజంగా ఉండి సాధారణ/కొనసాగుతున్న భావాన్ని నిలుపుతుంది.
- source_word: ἐν πνεύματι
  choice: ఆత్మతో
  rationale: ἐν యొక్క సాధనాత్మక లేదా పరిధి భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది. ఇక్కడ πνεύματιకి ఉపపదం లేకపోవడం, అది ‘సత్యం’తో జతగా ఉండడం వల్ల పరిశుద్ధాత్మనే ప్రత్యేకంగా నిర్దేశించకుండా విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: ἀληθείᾳ
  choice: సత్యంతో
  rationale: యోహాను రచనల్లోని వాస్తవిక, ప్రత్యక్షపరచబడిన సత్య భావాలను నిలిపే ప్రామాణికమైన, సహజమైన తెలుగు పదం.
- source_word: δεῖ προσκυνεῖν
  choice: ఆరాధించాలి
  rationale: δεῖ తెలిపే అవసరం లేదా విధిని తెలుగు ‘ఆలి’ రూపం సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘దేవుడు ఆత్మ’ అనే వాక్యభాగం అర్థం
  choice: దేవుని స్వభావాన్ని తెలిపే గుణాత్మక ప్రకటనగా ‘దేవుడు ఆత్మస్వరూపి’
  alternative: ‘దేవుడు ఒక ఆత్మ’
  rationale: πνεῦμαకు ఉపపదం లేకపోవడం, అది కర్తకు ముందు విధేయంగా రావడం గుణాత్మక భావానికి మద్దతిస్తుంది. దేవుడు అనేక ఆత్మజీవుల్లో ఒకడనే అపార్థాన్ని ఇది నివారిస్తుంది.
- issue: ‘ఆత్మలోను సత్యంలోను’ అనే పదబంధం అర్థం
  choice: ‘ఆత్మతోను సత్యంతోను’—ఆత్మ సంబంధమైన వాస్తవికతతో, సత్యంతో జరిగే ఆరాధన అనే విస్తృత భావం
  alternative: ‘పరిశుద్ధాత్మలోను సత్యంలోను’; ‘నిష్కపటంగా, నిజాయితీగా’
  rationale: πνεύματι, ἀληθείᾳ రెండింటికీ ఉపపదాలు లేవు. అందువల్ల వాక్యాన్ని పరిశుద్ధాత్మకు మాత్రమే ప్రత్యేకంగా పరిమితం చేయకుండా, లేదా కేవలం అంతరంగ నిజాయితీగా కుదించకుండా మూలంలోని అర్థవిస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఆత్మస్వరూపి’ గుణాత్మక వాక్యాన్ని స్పష్టంగా అందిస్తుండగా, ‘ఆత్మతోను సత్యంతోను’ మూలంలోని ఉద్దేశపూర్వక అర్థవిస్తృతిని నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
