id: JHN.4.46
reference: John 4:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἦλθεν οὖν ⸀πάλιν εἰς τὴν Κανὰ τῆς Γαλιλαίας, ὅπου ἐποίησεν τὸ ὕδωρ οἶνον. καὶ ἦν τις βασιλικὸς οὗ ὁ υἱὸς ἠσθένει ἐν Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/046.yaml
  text: So he came again to Cana of Galilee[a], where he had made the water wine[b]. And there was a certain royal official whose son was sick in Capernaum.
translation:
  language: te
  text: కాబట్టి ఆయన మళ్లీ గలిలయలోని కానాకు వచ్చాడు, అక్కడ ఆయన నీటిని ద్రాక్షారసంగా చేశాడు. కపెర్నహూములో కుమారుడు అనారోగ్యంతో ఉన్న ఒక రాజోద్యోగి ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రాజోద్యోగి’ అని అనువదించిన గ్రీకు పదం రాజుతో లేదా రాజాస్థానంతో సంబంధమున్న వ్యక్తిని సూచిస్తుంది; ‘రాజు అధికారి,’ ‘రాజాస్థాన అధికారి,’ లేదా ‘కులీనుడు’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సందర్భంతో ఉన్న కథన సంబంధాన్ని స్పష్టంగా సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో సహజంగా ఉంటుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: తిరిగి అదే ప్రదేశానికి రావడాన్ని సూటిగా, సహజంగా తెలియజేస్తుంది.
- source_word: Κανὰ τῆς Γαλιλαίας
  choice: గలిలయలోని కానా
  rationale: ప్రాంత సంబంధాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తూ స్థలనామాన్ని నిలుపుతుంది.
- source_word: ἐποίησεν τὸ ὕδωρ οἶνον
  choice: నీటిని ద్రాక్షారసంగా చేశాడు
  rationale: గ్రీకు వాక్య నిర్మాణంలోని ‘నీటిని ద్రాక్షారసంగా చేశాడు’ అనే భావాన్ని అనవసర వివరణ లేకుండా స్పష్టంగా అందిస్తుంది.
- source_word: βασιλικός
  choice: రాజోద్యోగి
  rationale: రాజుతో లేదా రాజాస్థానంతో సంబంధమున్న సేవాధికారిని సూచిస్తుంది; అతని ఖచ్చిత హోదా లేదా కులీన స్థితిని ఊహించదు.
- source_word: τις
  choice: ఒక
  rationale: పేరు చెప్పని ఒక నిర్దిష్ట వ్యక్తిని తెలుగులో సహజంగా పరిచయం చేస్తుంది; ‘ఒకానొక’ ఇక్కడ కృత్రిమంగా వినిపించవచ్చు.
- source_word: υἱός
  choice: కుమారుడు
  rationale: మూలంలోని పురుష లింగాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἠσθένει
  choice: అనారోగ్యంతో ఉన్న
  rationale: ఈ సందర్భంలో శారీరక అస్వస్థతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: Καφαρναούμ
  choice: కపెర్నహూము
  rationale: తెలుగు బైబిలు వాడుకలో గుర్తించదగిన స్థలనామ రూపం.
theological_decisions:
- issue: βασιλικός అనే పదం సూచించే రాజసంబంధాన్ని అతిగా నిర్దిష్టీకరించకుండా అనువదించడం
  choice: రాజోద్యోగి
  alternative: రాజు అధికారి; రాజాస్థాన అధికారి; కులీనుడు
  rationale: మూలపదం రాజుతో లేదా రాజాస్థానంతో సంబంధాన్ని తెలియజేస్తుంది గాని ఖచ్చిత పదవి, సామాజిక శ్రేణి, లేదా ఏ రాజు సేవలో ఉన్నాడో నిర్ధారించదు. ‘రాజోద్యోగి’ ఆ అస్పష్టతను తగినంతగా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే కథనశైలి. మూలంలోని సంబంధాలు, కాలక్రమం, రాజోద్యోగి హోదాపై ఉన్న అస్పష్టతను కాపాడింది.
