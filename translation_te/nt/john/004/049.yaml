id: JHN.4.49
reference: John 4:49
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ὁ βασιλικός· Κύριε, κατάβηθι πρὶν ἀποθανεῖν τὸ παιδίον μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/049.yaml
  text: The royal official said to him[a], “Lord, come down before my child dies.”
translation:
  language: te
  text: 'రాజోద్యోగి ఆయనతో ఇలా అన్నాడు: “ప్రభువా,[a] నా బిడ్డ చనిపోకముందే దిగిరండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అయ్యా.” గ్రీకు పదం κύριε గౌరవపూర్వక సంబోధనగా వాడబడుతుంది; దానికి “ప్రభువా” అనే అర్థమూ ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ βασιλικός
  choice: రాజోద్యోగి
  rationale: రాజుతో లేదా రాజాస్థానంతో సంబంధమున్న అధికారిని సూచించే substantival adjective. ‘రాజోద్యోగి’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, ‘ప్రభువు/సామంతుడు’ వంటి సామాజిక హోదా భావాన్ని అనవసరంగా చేర్చదు.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: κύριε గౌరవపూర్వక సంబోధనగా ‘అయ్యా’ అనే అర్థం ఇవ్వగలిగినా, యోహాను సువార్తలో ఉన్న విస్తృతమైన ‘ప్రభువు’ ప్రతిధ్వనిని నిలుపుతుంది. తక్షణ సందర్భంలోని ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: κατάβηθι
  choice: దిగిరండి
  rationale: కానా నుండి కపెర్నహూముకు దిగివెళ్లే భౌగోళిక భావాన్ని ‘దిగి’ నిలుపుతుంది; మాట్లాడుతున్న వ్యక్తి యేసును తనతో రావాలని కోరుతున్నందున ‘రండి’ సహజమైన తెలుగు.
- source_word: πρὶν ἀποθανεῖν
  choice: చనిపోకముందే
  rationale: πρίν + infinitive తెలిపే పూర్వకాల సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది. ‘ఏ’ ఆ వ్యక్తి అభ్యర్థనలోని అత్యవసరతను తెలుగులో వెల్లడిస్తుంది.
- source_word: τὸ παιδίον μου
  choice: నా బిడ్డ
  rationale: παιδίον చిన్నవాణ్ణి లేదా బిడ్డను సూచిస్తుంది; ఈ వచనంలో లింగాన్ని ప్రత్యేకంగా చెప్పకుండానే మూలంలోని భావాన్ని ‘బిడ్డ’ సహజంగా నిలుపుతుంది.
- source_word: λέγει πρὸς αὐτόν
  choice: ఆయనతో ... అన్నాడు
  rationale: గ్రీకు historical present‌ను తెలుగు కథనశైలికి సహజమైన భూతకాలంతో అనువదించాం; πρὸς αὐτόν లోని సంభాషణ దిశను ‘ఆయనతో’ నిలిపాం.
theological_decisions:
- issue: యేసును సంబోధించే κύριε పదం
  choice: ప్రభువా
  alternative: అయ్యా
  rationale: ఈ సందర్భంలో ఇది సాధారణ గౌరవ సంబోధన కావచ్చు; అదే సమయంలో యోహాను సువార్తలో ‘ప్రభువు’ అనే లోతైన ప్రతిధ్వనికి కూడా అవకాశం ఉంది. ప్రధాన పాఠం ఆ సాధ్యమైన ద్వంద్వార్థాన్ని నిలుపుతుండగా, తక్షణ సామాజిక భావాన్ని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సహజమైన కథనశైలి. అధికారిని ఉద్దేశించిన ప్రత్యేక రాజదర్బారు పదజాలం కాకుండా సాధారణ పాఠకులకు అర్థమయ్యే ‘రాజోద్యోగి’ వాడాం. విజ్ఞప్తిలో యేసుకు గౌరవ బహువచన క్రియారూపమైన ‘దిగిరండి’ వాడాం.
