revisions:
- from: ఆ స్త్రీ ఆయనతో, “అయ్యా[a], నీళ్లు తోడుకోవడానికి మీ దగ్గర ఏ పాత్రా లేదు; బావి కూడా లోతుగా ఉంది. మరి ఆ జీవజలం[b] మీకు ఎక్కడి నుంచి వస్తుంది?” అని అడిగింది.
  to: ఆ స్త్రీ ఆయనతో, “అయ్యా[a], నీళ్లు తోడుకోవడానికి మీ దగ్గర ఏ పాత్రా లేదు; బావి కూడా లోతుగా ఉంది. మరి ఆ జీవజలం[b] మీకు ఎక్కడి నుంచి దొరుకుతుంది?” అని అడిగింది.
  rationale: The sole revision replaces “వస్తుంది” with “దొరుకుతుంది” in order to represent more directly the Greek question concerning the source from which Jesus obtains the water. The rest of the draft faithfully and naturally preserves the source’s sense and ambiguity.
