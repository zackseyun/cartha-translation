review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly represents the woman’s two observations: Jesus has no vessel for drawing water, and the well is deep. It also preserves the inferential question and the deliberate ambiguity of ὕδωρ ζῶν through “జీవజలం,” with an appropriate lexical footnote. However, “మీకు ఎక్కడి నుంచి వస్తుంది?” can suggest that the water comes to Jesus rather than asking where he obtains it. “దొరుకుతుంది” more directly expresses πόθεν ... ἔχεις in this context.'
  naturalness: The Telugu is modern, clear, and appropriately respectful. “అయ్యా” with plural-respectful forms is natural. Recasting the final question with “దొరుకుతుంది” is more idiomatic for asking the source from which someone has or obtains something.
  terminology: “బావి,” “నీళ్లు తోడుకోవడానికి ... పాత్ర,” and “జీవజలం” are suitable. The footnote properly retains “ప్రభువా” as an alternative for Κύριε without forcing a theological sense, and explains the literal sense of living water as fresh/running water.
  issues:
  - severity: low
    issue: The final verb “వస్తుంది” is less precise for ἔχεις in the question about the water’s source.
    rationale: The Greek asks, literally, where Jesus has/gets the living water. “ఎక్కడి నుంచి దొరుకుతుంది?” naturally conveys obtaining it and avoids implying merely that it comes to him.
  revised_text: ఆ స్త్రీ ఆయనతో, “అయ్యా[a], నీళ్లు తోడుకోవడానికి మీ దగ్గర ఏ పాత్రా లేదు; బావి కూడా లోతుగా ఉంది. మరి ఆ జీవజలం[b] మీకు ఎక్కడి నుంచి దొరుకుతుంది?” అని అడిగింది.
