id: JHN.4.11
reference: John 4:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸂ἡ γυνή⸃· Κύριε, οὔτε ἄντλημα ἔχεις καὶ τὸ φρέαρ ἐστὶν βαθύ· πόθεν οὖν ἔχεις τὸ ὕδωρ τὸ ζῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/011.yaml
  text: The woman said to him[a], “Lord, you have neither a bucket nor is the well deep[b]. So where do you get the living water?”
translation:
  language: te
  text: ఆ స్త్రీ ఆయనతో, “అయ్యా[a], నీళ్లు తోడుకోవడానికి మీ దగ్గర ఏ పాత్రా లేదు; బావి కూడా లోతుగా ఉంది. మరి ఆ జీవజలం[b] మీకు ఎక్కడి నుంచి దొరుకుతుంది?” అని అడిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రభువా.” గ్రీకు పదం గౌరవపూర్వక సంబోధనగా “అయ్యా” అనీ, సందర్భాన్ని బట్టి “ప్రభువా” అనీ అర్థమవుతుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా “పారే నీరు,” అంటే నిల్వ ఉన్న నీటికి భిన్నంగా తాజా ప్రవాహజలం. “జీవజలం” అనే మాట యేసు ఉద్దేశించిన లోతైన భావాన్ని కూడా నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: ఆయనతో … అని అడిగింది
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నా, తెలుగు కథనంలో భూతకాలం సహజం. వాక్యం ప్రశ్న కావడంతో ‘చెప్పింది’ కంటే ‘అడిగింది’ సందర్భానుకూలం.
- source_word: ἡ γυνή
  choice: ఆ స్త్రీ
  rationale: సందర్భంలో ఇది బావి దగ్గర ఉన్న సమరయ స్త్రీని సూచిస్తుంది; నిర్దిష్టతను ‘ఆ’ సహజంగా తెలియజేస్తుంది.
- source_word: Κύριε
  choice: అయ్యా
  rationale: ఈ సంభాషణ దశలో ఇది గౌరవపూర్వక సంబోధనగా సహజంగా అర్థమవుతుంది. ‘ప్రభువా’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచి గ్రీకు పదంలోని సందిగ్ధతను కాపాడాం.
- source_word: ἄντλημα
  choice: నీళ్లు తోడుకోవడానికి … పాత్ర
  rationale: బావిలో నుంచి నీరు తీయడానికి ఉపయోగించే సాధనాన్ని సూచిస్తుంది. ప్రాంతీయంగా మారగల ‘బొక్కెన’ వంటి పదం బదులు సాధారణ పాఠకులకు స్పష్టమైన వివరణాత్మక రూపం వాడాం.
- source_word: τὸ φρέαρ
  choice: బావి
  rationale: ఈ సందర్భంలో నీరు తోడే బావినే సూచించే సహజమైన, ఖచ్చితమైన తెలుగు పదం.
- source_word: βαθύ
  choice: లోతుగా ఉంది
  rationale: మూలంలోని సాధారణ విశేషణార్థాన్ని అతిశయింపకుండా తెలియజేస్తుంది.
- source_word: πόθεν οὖν
  choice: మరి … ఎక్కడి నుంచి
  rationale: ప్రశ్న మూలం లేదా ఉద్భవస్థానాన్ని అడుగుతుంది; ‘మరి’ ముందున్న పరిస్థితుల నుంచి వచ్చే నిర్ధారణాత్మక సంబంధాన్ని సహజంగా చూపిస్తుంది.
- source_word: τὸ ὕδωρ τὸ ζῶν
  choice: ఆ జీవజలం
  rationale: ‘జీవజలం’ అనే రూపం తాజా లేదా ప్రవహించే నీరు అనే సాధారణ భావాన్నీ, యోహాను సువార్తలోని లోతైన రూపకాలంకార భావాన్నీ ఒకేసారి నిలుపుతుంది.
theological_decisions:
- issue: సమరయ స్త్రీ యేసును Κύριε అని సంబోధించడం
  choice: అయ్యా
  alternative: ప్రభువా
  rationale: ఈ దశలో స్త్రీ యేసును గౌరవపూర్వకంగా సంబోధిస్తున్నదనే పఠనం సందర్భానికి సరిపోతుంది; ‘ప్రభువా’ అని ప్రధాన పాఠంలో పెట్టడం ఆమె అప్పటికే చేసిన విశ్వాస ప్రకటనగా అధికంగా వినిపించవచ్చు. అయినా κύριεకు ‘ప్రభువా’ అనే అర్థం నిజమైన ప్రత్యామ్నాయం కాబట్టి పాదసూచికలో ఇచ్చాం.
- issue: ὕδωρ τὸ ζῶν లోని యోహానీయ ద్వంద్వార్థం
  choice: జీవజలం
  alternative: పారే నీరు లేదా తాజా నీరు
  rationale: స్త్రీ గ్రహించిన సాధారణ భౌతిక అర్థాన్నీ, యేసు మాటల్లోని లోతైన ఆధ్యాత్మిక భావాన్నీ ‘జీవజలం’ పరిష్కరించకుండా నిలుపుతుంది; సాధారణ వాడుకలోని భావాన్ని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవపూర్వక సంభాషణ శైలిని వాడాం. ‘మీ దగ్గర’ అనే రూపం సంభాషణ సహజత్వాన్ని ఇస్తుంది; ‘జీవజలం’ గంభీరతను, ఉద్దేశపూర్వక ద్వంద్వార్థాన్ని కాపాడుతుంది.
