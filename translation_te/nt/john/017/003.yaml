id: JHN.17.3
reference: John 17:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ αἰώνιος ζωὴ ἵνα γινώσκωσι σὲ τὸν μόνον ἀληθινὸν θεὸν καὶ ὃν ἀπέστειλας Ἰησοῦν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/003.yaml
  text: 'And this is eternal life: that they may know you[a], the only true God, and Jesus the Messiah whom you sent.'
translation:
  language: te
  text: 'నిత్యజీవం ఇదే: ఏకైక సత్యమైన దేవుడవైన నిన్నూ, నీవు పంపిన యేసు మెస్సీయను[a] వారు తెలుసుకోవడం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంప్రదాయంగా, “యేసు క్రీస్తు.” గ్రీకు Χριστός అనే పదం “మెస్సీయ” అనే బిరుదుగానూ, కొన్ని సందర్భాల్లో “క్రీస్తు” అనే పేరువలె కూడా ఉపయోగించబడవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη δέ ἐστιν
  choice: ఇక ... ఇదే
  rationale: δέ యొక్క అనుసంధాన భావాన్ని సహజమైన తెలుగులో ‘ఇక’తో చూపిస్తూ, αὕτη ἐστιν యొక్క నిర్వచనాత్మక బలాన్ని ‘ఇదే’ నిలుపుతుంది.
- source_word: ἡ αἰώνιος ζωὴ
  choice: నిత్యజీవం
  rationale: యోహాను రచనల్లో కనిపించే స్థిరమైన భావవ్యక్తీకరణకు ఇది సహజమైన, విస్తృతంగా అర్థమయ్యే తెలుగు రూపం.
- source_word: ἵνα γινώσκωσι
  choice: వారు తెలుసుకోవడం
  rationale: ఇక్కడ ἵνα నిత్యజీవం దేనిలో ఉందో వివరిస్తుంది. వర్తమాన కాల క్రియలోని కొనసాగుతున్న, సంబంధాత్మక పరిజ్ఞాన భావాన్ని ‘తెలుసుకోవడం’ సహజంగా తెలియజేస్తుంది.
- source_word: σὲ τὸν μόνον ἀληθινὸν θεὸν
  choice: ఏకైక సత్య దేవుడవైన నిన్నూ
  rationale: σέను ప్రధాన కర్మగా ఉంచి, τὸν μόνον ἀληθινὸν θεόνను దానికి సమానాధికరణ విశేషణంగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καὶ
  choice: నిన్నూ ... యేసునూ
  rationale: తెలుగులోని ‘-నూ ... -నూ’ సముచ్చయం రెండు కర్మలను γινώσκωσιతో స్పష్టంగా కలుపుతుంది; వాక్య నిర్మాణం చెప్పేదానికంటే ఎక్కువగా వాటి సంబంధాన్ని నిర్వచించదు.
- source_word: ὃν ἀπέστειλας
  choice: నీవు పంపిన
  rationale: సంబంధవాచక ఉపవాక్యాన్ని తెలుగులో సహజమైన కృదంత నిర్మాణంగా అనువదించి, తండ్రి పంపినవాడిగా యేసును గుర్తిస్తుంది.
- source_word: Ἰησοῦν Χριστόν
  choice: మెస్సీయ యేసు
  rationale: Χριστόςలోని బిరుదు భావాన్ని ‘మెస్సీయ’గా నిలుపుతూ, ఆధునిక తెలుగులో సహజమైన బిరుదు-పేరు క్రమాన్ని ఉపయోగిస్తుంది. పేరులాంటి సంప్రదాయ రూపాన్ని పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: ‘ఏకైక సత్య దేవుడు’ అనే సంబోధనకు యేసుతో ఉన్న సంబంధం
  choice: తండ్రిని ‘ఏకైక సత్య దేవుడు’ అని నేరుగా సంబోధిస్తూ, యేసును తండ్రి పంపినవాడిగా వేరుగా పేర్కొనే మూలవాక్య నిర్మాణాన్ని అలాగే ఉంచడం.
  alternative: త్రిత్వ సిద్ధాంతాన్ని స్పష్టీకరించేందుకు అనువాదంలో వివరణాత్మక పదాలు చేర్చడం లేదా తండ్రి-యేసు భేదాన్ని మందగించడం.
  rationale: ఈ వాక్యంలోని నిజమైన దైవశాస్త్ర ఉద్వేగాన్ని అనువాదమే పరిష్కరించకూడదు. మూలపాఠం చెప్పినదానిని మాత్రమే స్పష్టంగా అందించి, యోహాను సువార్తలోని విస్తృత క్రీస్తుశాస్త్ర సందర్భాన్ని పాఠకుడు పరిశీలించేందుకు వీలు కల్పిస్తుంది.
- issue: Χριστόν అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో బిరుదు భావం వినిపిస్తుండటంతో ప్రధాన పాఠంలో ‘మెస్సీయ’ను ఎంచుకుంది; పేరులాంటి సంప్రదాయ ప్రయోగం సాధ్యమే కనుక ‘క్రీస్తు’ను పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించింది. ‘ఏకైక సత్య దేవుడవైన’ అనే నిర్మాణం మూలంలోని సమానాధికరణాన్ని స్పష్టంగా ఉంచుతుంది; ‘నిన్నూ ... యేసునూ’ రెండు కర్మల సముచ్చయాన్ని సహజంగా తెలియజేస్తుంది.
