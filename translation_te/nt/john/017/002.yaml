  text: καθὼς ἔδωκας αὐτῷ ἐξουσίαν πάσης σαρκός, ἵνα πᾶν ὃ δέδωκας αὐτῷ ⸀δώσῃ αὐτοῖς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/002.yaml
  text: just as you gave him authority over all flesh[a], so that to all whom you have given him[b], he may give eternal life.
translation:
  language: te
  text: నీవు ఆయనకు సమస్త శరీరులపై[a] అధికారం ఇచ్చినట్లే, నీవు ఆయనకు ఇచ్చిన వారందరికీ[b] ఆయన నిత్యజీవం ఇవ్వునట్లు ఆయనకు అధికారం ఇచ్చావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మానవాళి అంతటిపై.’ గ్రీకులో అక్షరార్థంగా ‘సమస్త శరీరంపై’ ఉంది; ఇది మానవులందరినీ సూచించే బైబిలీయ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నీవు ఆయనకు ఇచ్చినదంతటికీ.’ కుమారునికి ఇవ్వబడిన ప్రజలను సమష్టిగా సూచించడానికి గ్రీకులో నపుంసక ఏకవచన రూపం ఉపయోగించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: ఇచ్చినట్లే
  rationale: ముందటి వాక్యంలోని అభ్యర్థనతో పోలికను, అనురూపతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἔδωκας
  choice: ఇచ్చావు
  rationale: తండ్రి కుమారునికి అధికారాన్ని అనుగ్రహించిన కార్యాన్ని గ్రీకు భూతకాల సూచనకు అనుగుణంగా సాధారణ భూతకాలంలో అందిస్తుంది.
- source_word: ἐξουσίαν
  choice: అధికారం
  rationale: కేవలం శక్తిని కాక, అప్పగించబడిన హక్కును మరియు అధికార పరిధిని సూచిస్తుంది.
- source_word: πάσης σαρκός
  choice: సకల శరీరులపై
  rationale: మానవులందరినీ సూచించే బైబిలీయ నుడికారాన్ని నిలుపుతూ, తెలుగులో వ్యక్తులను సూచించడానికి బహువచన రూపాన్ని ఉపయోగిస్తుంది.
- source_word: ἵνα
  choice: ఇవ్వడానికి అలా చేశావు
  rationale: గ్రీకు ఉద్దేశార్థక సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది; ‘అలా చేశావు’ అనేది ముందున్న అధికారమిచ్చే కార్యాన్నే తిరిగి సూచిస్తుంది.
- source_word: πᾶν ὃ
  choice: వారందరికీ
  rationale: గ్రీకులో నపుంసక ఏకవచన సమష్టి వ్యక్తీకరణ ఉన్నప్పటికీ, సందర్భంలో తండ్రి కుమారునికి ఇచ్చిన ప్రజలను సూచిస్తున్నందున సహజమైన వ్యక్తివాచక తెలుగును వాడింది.
- source_word: δέδωκας
  choice: ఇచ్చిన
  rationale: పూర్తయి ఇప్పటికీ వర్తించే తండ్రి ఇచ్చిన కార్యాన్ని తెలుగు సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: δώσῃ
  choice: ఇవ్వడానికి
  rationale: ἵνα తరువాతి సంభావనార్థక రూపంలోని ఉద్దేశాన్ని కర్తవ్యార్థంగా మార్చకుండా వ్యక్తపరుస్తుంది.
- source_word: ζωὴν αἰώνιον
  choice: నిత్యజీవం
  rationale: యోహాను రచనల్లోని ప్రామాణిక భావాన్ని—అంతంలేని జీవం మరియు రాబోయే యుగానికి చెందిన జీవం—సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘సకల శరీరులు’ మరియు ‘నీవు ఆయనకు ఇచ్చిన వారందరూ’ అనే వర్గాల పరిధి
  choice: కుమారుని అధికారం మానవులందరిపై ఉందని, నిత్యజీవం పొందేవారు తండ్రి ఆయనకు ఇచ్చినవారని వాక్యం చూపే భేదాన్ని యథాతథంగా ఉంచడం.
  alternative: రెండు వ్యక్తీకరణలనూ ఒకే పరిధిగా వ్యాఖ్యానించడం లేదా ‘సకల శరీరులు’ను నేరుగా ‘మానవాళి అంతా’గా ప్రధాన పాఠ్యంలో మార్చడం.
  rationale: గ్రీకు పాఠ్యం విశ్వవ్యాప్త అధికారాన్నీ, తండ్రి కుమారునికి ఇచ్చినవారికి నిత్యజీవం ఇవ్వడాన్నీ పక్కపక్కనే ఉంచుతుంది. ఏ మతశాఖ సిద్ధాంతానికీ అనుకూలంగా ఈ ఉద్రిక్తతను పరిష్కరించకుండా అనువాదం దానిని కాపాడుతుంది.
- issue: πᾶν ὃ లోని నపుంసక ఏకవచన సమష్టి రూపం
  choice: ప్రధాన పాఠ్యంలో ‘వారందరికీ’ అని వ్యక్తులను స్పష్టపరచి, మూలరూపాన్ని పాదటిప్పణిలో తెలియజేయడం.
  alternative: పదశః ‘నీవు ఆయనకు ఇచ్చినదంతటికీ’ అని అనువదించడం.
  rationale: పదశః రూపం తెలుగులో వస్తువులను సూచిస్తున్నట్లు అపార్థం కలిగించవచ్చు; వ్యక్తివాచక భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టం చేస్తూనే మూలంలోని సమష్టి వ్యాకరణ రూపాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ఏకవచన సంబోధనను వాడింది. ‘సకల శరీరులు’ బైబిలీయ నుడికారాన్ని నిలుపుతుంది; దాని సాధారణ అర్థాన్ని పాదటిప్పణి వివరిస్తుంది. మూలంలోని ఉద్దేశార్థక నిర్మాణం తెలుగులో అసంపూర్ణంగా వినిపించకుండా ‘అలా చేశావు’ అనే అనాఫరిక పదబంధంతో సహజీకరించబడింది.
