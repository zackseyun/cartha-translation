review_pass:
  verdict: revise
  source_fidelity: The draft correctly distinguishes the Son’s authority over all humanity from the group given to him who receive eternal life. However, “ఇవ్వడానికి అలా చేశావు” introduces an explicit causal assertion (“you did so”) not present in the Greek and obscures that the purpose clause modifies the granting of authority.
  naturalness: “సకల శరీరులపై” is understandable but somewhat awkward in modern standard Telugu. “సమస్త శరీరులపై” preserves the biblical idiom more naturally. The revised wording retains the Greek’s dependence on the preceding sentence while making the purposive relation clear.
  terminology: “అధికారం” and “నిత్యజీవం” are appropriate. The collective personal sense of πᾶν ὃ is properly conveyed by “వారందరికీ,” with a footnote preserving the neuter-singular collective form.
  issues:
  - severity: medium
    issue: “అలా చేశావు” has no direct counterpart in the Greek.
    rationale: The Greek says that authority was given to the Son with the purpose that he give eternal life; it does not separately say that the Father “did so.” This phrasing can shift the clause’s syntactic connection and adds emphasis absent from the source.
  - severity: low
    issue: “సకల శరీరులపై” is less idiomatic than necessary.
    rationale: The expression aims to retain the biblical ‘all flesh’ idiom, but “సమస్త శరీరులపై” is more natural in modern formal Telugu while preserving that texture.
  revised_text: నీవు ఆయనకు సమస్త శరీరులపై[a] అధికారం ఇచ్చినట్లే, నీవు ఆయనకు ఇచ్చిన వారందరికీ[b] ఆయన నిత్యజీవం ఇవ్వునట్లు ఆయనకు అధికారం ఇచ్చావు.
