  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καθὼς ἐμὲ ἀπέστειλας εἰς τὸν κόσμον, κἀγὼ ἀπέστειλα αὐτοὺς εἰς τὸν κόσμον·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/018.yaml
  text: Just as you sent me into the world, I also sent them into the world.
translation:
  language: te
  text: నీవు నన్ను లోకంలోకి పంపినట్లే, నేనూ వారిని లోకంలోకి పంపాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: పంపినట్లే
  rationale: తండ్రి యేసును పంపినదానికి, యేసు శిష్యులను పంపినదానికి మధ్య ఉన్న పోలికను సహజమైన తెలుగులో స్పష్టంగా చూపిస్తుంది.
- source_word: ἐμὲ
  choice: నన్ను
  rationale: ἀπέστειλας క్రియకు ప్రత్యక్ష కర్మ; గ్రీకు సర్వనామాన్ని సహజంగా, నేరుగా ప్రతిబింబిస్తుంది.
- source_word: ἀπέστειλας
  choice: పంపిన
  rationale: ἀποστέλλω యొక్క సాధారణ అర్థమైన ‘పంపు’ను నిలుపుతుంది; ‘నియమించు’ వంటి వ్యాఖ్యానాత్మక విస్తరణను నివారిస్తుంది.
- source_word: εἰς τὸν κόσμον
  choice: లోకంలోకి
  rationale: εἰς సూచించే లోపలికి దిశను నిలుపుతూ, యోహాను రచనల్లోని κόσμος పదానికి ఉన్న విస్తృత భావసాధ్యతను కాపాడుతుంది.
- source_word: κἀγὼ
  choice: నేనూ
  rationale: καὶ ἐγώ లోని అదనపు మరియు సమాంతర భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀπέστειλα
  choice: పంపాను
  rationale: మొదటి ఖండంలోని అదే గ్రీకు క్రియతో ఉన్న ఉద్దేశపూర్వక సమాంతరతను ఒకే తెలుగు క్రియ ద్వారా నిలుపుతుంది.
- source_word: αὐτοὺς
  choice: వారిని
  rationale: సందర్భంలో శిష్యులను సూచించే ప్రత్యక్ష కర్మకు గౌరవప్రదమైన, సహజమైన తెలుగు రూపం.
- source_word: κόσμον
  choice: లోకం
  rationale: యోహాను రచనల్లో కీలకమైన κόσμος పదాన్ని అతిగా నిర్వచించకుండా, దాని ప్రాదేశిక మరియు వేదాంతపరమైన ఉద్వేగాన్ని నిలుపుతుంది.
theological_decisions:
- issue: తండ్రి కుమారుణ్ణి పంపడం మరియు కుమారుడు శిష్యులను పంపడం మధ్య కార్యసంబంధ సమాంతరత
  choice: రెండు చోట్లా ‘పంపు’ అనే ఒకే క్రియను ఉపయోగించడం
  alternative: మొదట ‘పంపు’, తరువాత ‘నియమించు’ లేదా ‘అప్పగించి పంపు’ అని వేరుగా అనువదించడం
  rationale: మూలపాఠంలోని ‘పంపినట్లే ... పంపాను’ అనే స్పష్టమైన సమాంతరతను ఇది కాపాడుతుంది. అదే సమయంలో ‘అట్లే’ అనే పోలిక వారి స్థానం లేదా కార్యం అన్ని విధాలా ఒకటేనని అనవసరంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం. ‘ప్రపంచం’కు బదులు యోహాను సాహిత్యంలోని θεολογిక ప్రతిధ్వనిని నిలుపేందుకు ‘లోకం’ వాడబడింది. మూలంలోని సంక్షిప్త సమాంతర నిర్మాణం అలాగే ఉంచబడింది.
