  yaml_path: translation/nt/john/017/017.yaml
  text: Sanctify them in the truth[a]; your word is truth.
translation:
  language: te
  text: వారిని సత్యంలో పవిత్రపరచు; నీ వాక్యం సత్యం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ వాక్యమే సత్యం.” గ్రీకులో విధేయ నామవాచకమైన “సత్యం” ముందు నిర్దిష్ట ఉపపదం లేదు; అందువల్ల ఇది కేవలం గుర్తింపుకన్నా గుణాన్ని—“సత్య స్వభావమైంది”—నొక్కి చెప్పవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγίασον
  choice: పవిత్రపరచు
  rationale: ἁγιάζω అనే క్రియలో దేవునికి ప్రతిష్ఠించడం, పవిత్రులుగా చేయడం అనే భావాలు రెండూ ఉన్నాయి. ఆధునిక ప్రామాణిక తెలుగులో ‘పవిత్రపరచు’ ఈ రెండు పార్శ్వాలను సంక్షిప్తంగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: αὐτοὺς
  choice: వారిని
  rationale: ఇది శిష్యులను సూచించే బహువచన కర్మ సర్వనామం. సందర్భానికి సహజమైన గౌరవప్రద తెలుగు రూపం ‘వారిని’.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: సత్యంలో
  rationale: ἐν అనే విభక్త్యర్థక పదానికి ఇక్కడ స్థితి (‘సత్యంలో’) లేదా సాధనం (‘సత్యం ద్వారా’) అనే భావవిస్తృతి ఉండవచ్చు. ‘సత్యంలో’ ప్రధాన స్థితి భావాన్ని నిలుపుతూ సాధన భావాన్ని పూర్తిగా మూసివేయదు.
- source_word: ὁ λόγος ὁ σὸς
  choice: నీ వాక్యం
  rationale: λόγος ఇక్కడ దేవుడు తెలియజేసిన వాక్యాన్ని సూచిస్తుంది; ὁ σὸς దాని యాజమాన్యాన్ని బలపరుస్తుంది. ‘నీ వాక్యం’ సహజమైనదీ యోహాను రచనాశైలికి తగినదీ.
- source_word: ἀλήθειά ἐστιν
  choice: సత్యం
  rationale: విధేయ నామవాచకమైన ἀλήθεια గ్రీకులో నిర్దిష్ట ఉపపదం లేకుండా ఉంది. అందువల్ల ‘సత్యం’ అనే రూపం గుణాత్మక బలాన్ని నిలుపుతుంది; ‘ఆ సత్యం’ అని చేర్చి భావాన్ని అనవసరంగా నిర్దిష్టీకరించదు.
theological_decisions:
- issue: రెండవ వాక్యభాగంలోని ἀλήθεια గుణాత్మకమా, నిర్దిష్ట గుర్తింపా?
  choice: నీ వాక్యం సత్యం
  alternative: నీ వాక్యమే ఆ సత్యం
  rationale: ἀλήθεια ముందు గ్రీకు నిర్దిష్ట ఉపపదం లేదు. కాబట్టి ప్రధాన పాఠం దేవుని వాక్య స్వభావాన్ని ‘సత్యం’గా ప్రకటించే గుణాత్మక భావాన్ని నిలుపుతుంది. అయినప్పటికీ నిర్దిష్ట గుర్తింపుగా అర్థం చేసుకోవడం వ్యాకరణపరంగా సాధ్యమేనని పాదటిప్పణి తెలియజేస్తుంది.
- issue: ἐν τῇ ἀληθείᾳలో ἐν యొక్క భావం
  choice: సత్యంలో
  alternative: సత్యం ద్వారా
  rationale: మూలంలోని ἐν స్థితి మరియు సాధన భావాలకు అవకాశం ఇస్తుంది. ‘సత్యంలో’ అని అనువదించడం ఆ విస్తృతిని ‘ద్వారా’ అనే సాధనార్థానికి మాత్రమే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ప్రార్థనా శైలి వాడబడింది. ‘పవిత్రపరచు’ ధార్మిక బరువును నిలుపుతూనే సాధారణ పాఠకులకు అర్థమయ్యే పదం. వాక్య నిర్మాణం మూలంలోని రెండు సమతుల్య ప్రకటనలను సెమికోలన్‌తో స్పష్టంగా ఉంచుతుంది.
