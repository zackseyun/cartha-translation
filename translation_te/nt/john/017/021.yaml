id: JHN.17.21
reference: John 17:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα πάντες ἓν ὦσιν, καθὼς σύ, ⸀πάτερ, ἐν ἐμοὶ κἀγὼ ἐν σοί, ἵνα καὶ αὐτοὶ ἐν ⸀ἡμῖν ὦσιν, ἵνα ὁ κόσμος ⸀πιστεύῃ ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/021.yaml
  text: that they may all be one[a], just as you, Father, are in me and I am in you; that they also may be in us[c][b], so that the world may believe that you sent me.
translation:
  language: te
  text: వారందరూ ఒక్కటిగా ఉండాలని[a]—తండ్రీ, నీవు నాలో, నేను నీలో ఉన్నట్లే—వారు కూడా మనలో ఉండాలని[b], తద్వారా నీవు నన్ను పంపావని లోకం నమ్మాలని[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారందరూ ఐక్యంగా ఉండాలని.’ గ్రీకులో మరింత అక్షరార్థంగా ‘వారందరూ ఒకటిగా ఉండాలని’ ఉంది; ఇది ఏకత్వాన్ని ఒకే అంశానికి పరిమితం చేయకుండా దాని విస్తృత భావాన్ని నిలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నాలో,’ ‘నీలో,’ ‘మనలో’ అని పునరావృతమయ్యే ‘లో’ అనే భాష యోహాను రచనలో పరస్పర అంతర్నివాసం, పాలుపంచుకోవడం అనే భావాలను ప్రతిబింబిస్తుంది; ఇది కేవలం సహవాసం కన్నా బలమైనది.
    reason: cross_reference
  - marker: c
    text: లేదా ‘నమ్మేలా.’ గ్రీకు పదరూపం లోకం విశ్వసించడాన్ని సూచిస్తుంది; ఇక్కడ నమ్మడం మొదలవడమే ప్రధానమా, విశ్వాసంలో కొనసాగడమా అనేది స్పష్టంగా నిర్దిష్టం చేయదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ఉండాలని / నమ్మాలని
  rationale: మూడు ἵνα ఉపవాక్యాల ఉద్దేశ్య–ఫలిత పరంపరను తెలుగులో సహజంగా వ్యక్తం చేస్తూ, వాటి పునరావృత నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: πάντες ἓν
  choice: వారందరూ ఒక్కటిగా
  rationale: πάντες యొక్క సమగ్ర పరిధిని ‘వారందరూ’ నిలుపుతుంది; ἓν సూచించే ఐక్యతను దాని విధానాన్ని సంకుచితం చేయకుండా ‘ఒక్కటిగా’ వ్యక్తం చేస్తుంది.
- source_word: καθὼς
  choice: ఉన్నట్లే
  rationale: విశ్వాసుల ఐక్యతకు తండ్రి–కుమారుల పరస్పర సంబంధం పోలికగా ఉందని స్పష్టంగా చూపుతుంది.
- source_word: πάτερ
  choice: తండ్రీ
  rationale: సంబోధన రూపాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: ἐν ἐμοὶ ... ἐν σοί ... ἐν ἡμῖν
  choice: నాలో ... నీలో ... మనలో
  rationale: యోహాను రచనలోని ἐν పదపునరావృతాన్ని, పరస్పర అంతర్నివాసం మరియు పాలుపంచుకోవడం అనే గాఢ భావాన్ని బలహీనపరచకుండా నిలుపుతుంది.
- source_word: κόσμος
  choice: లోకం
  rationale: యోహాను రచనలో θεολογిక సాంద్రతగల κόσμος పదానికి విస్తృత పరిధిని నిలిపే స్థిరమైన తెలుగు సమానార్థకం.
- source_word: πιστεύῃ
  choice: నమ్మాలని
  rationale: ప్రస్తుత సబ్జంక్టివ్‌ను విశ్వాసం మొదలవడమా కొనసాగడమా అని నిర్దిష్టంగా తేల్చకుండా ఉంచుతుంది.
- source_word: ἀπέστειλας
  choice: పంపావని
  rationale: అయోరిస్ట్ క్రియను సందర్భానికి సహజమైన భూతకాల రూపంలో అందిస్తుంది.
theological_decisions:
- issue: తండ్రి–కుమారుల సంబంధంతో పోల్చబడిన విశ్వాసుల ఏకత్వ స్వభావం
  choice: ‘ఒక్కటిగా’ అని అనువదించి, దాని విధానాన్ని వివరించే పదాలను చేర్చలేదు.
  alternative: ‘ఒకే ఉద్దేశంతో ఐక్యంగా’ లేదా ‘సంస్థాపరంగా ఒక్కటిగా’
  rationale: మూలపాఠం ఏకత్వాన్ని ప్రకటిస్తుంది గాని అది సంస్థాపరమైనదా, నైతికమైనదా, ఉద్దేశపూర్వకమైనదా అని సంకుచితంగా నిర్వచించదు.
- issue: యోహాను రచనలోని అంతర్నివాస భాష
  choice: ‘నాలో,’ ‘నీలో,’ ‘మనలో’ అనే రూపాలను యథాతథంగా నిలిపాం.
  alternative: ‘నాతో,’ ‘నీతో,’ ‘మనతో’ లేదా ‘మనతో ఐక్యమై’
  rationale: ἐν యొక్క పునరావృతం కేవలం సహవాసం కన్నా బలమైన పరస్పర అంతర్నివాసం/పాలుపంచుకోవడం అనే భావాన్ని మోస్తుంది; దాన్ని వివరణాత్మకంగా కుదించడం తగదు.
- issue: πιστεύῃ యొక్క కాలాంశం
  choice: ‘నమ్మాలని’ అని, ప్రవేశాత్మక లేదా కొనసాగింపు భావాన్ని నిర్దిష్టం చేయకుండా అనువదించాం.
  alternative: ‘నమ్మడం మొదలుపెట్టాలని’
  rationale: గ్రీకు ప్రస్తుత సబ్జంక్టివ్ ఇక్కడ లోకం విశ్వసించడాన్ని సూచిస్తుంది; విశ్వాసం మొదలయ్యే క్షణానికే ప్రత్యేకంగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలిని వాడాం. ముందరి వాక్యంపై ఆధారపడే గ్రీకు ἵνα నిర్మాణాన్ని కాపాడటానికి మూలంలో లేని ‘నేను ప్రార్థిస్తున్నాను’ వంటి ప్రధాన క్రియను చేర్చలేదు. పోలిక భాగాన్ని డాష్‌ల మధ్య ఉంచడం ద్వారా దీర్ఘ వాక్య నిర్మాణాన్ని స్పష్టంగా చేశాం.
