source:
  edition: SBLGNT
  text: καὶ ὑπὲρ αὐτῶν ἐγὼ ἁγιάζω ἐμαυτόν, ἵνα ⸂ὦσιν καὶ αὐτοὶ⸃ ἡγιασμένοι ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/019.yaml
  text: And for their sake I sanctify myself[b][a], so that they also may be sanctified in truth.
translation:
  language: te
  text: వారి కోసం నన్ను నేను ప్రతిష్ఠించుకుంటున్నాను[a], తద్వారా వారు కూడా సత్యంలో[b] ప్రతిష్ఠించబడినవారై ఉండునట్లు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నన్ను నేను పరిశుద్ధపరచుకుంటున్నాను.’ ఈ వచనంలో తరువాత ‘ప్రతిష్ఠించబడినవారై’ అని అనువదించిన పదం కూడా ఇదే గ్రీకు మూలపదం నుంచి వచ్చింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆ సత్యంలో’; యోహాను 17:17తో పోల్చండి.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ αὐτῶν
  choice: వారి కోసం
  rationale: ὑπέρ + షష్ఠీ విభక్తి ఇక్కడ వారి ప్రయోజనార్థం చేసే కార్యాన్ని సూచిస్తుంది. ‘వారి కోసం’ ఆధునిక తెలుగులో సహజంగా ఉండి, ప్రతినిధిత్వం లేదా ప్రత్యామ్నాయ బలి అనే భావాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: ἁγιάζω ἐμαυτόν
  choice: నన్ను నేను ప్రతిష్ఠించుకుంటున్నాను
  rationale: ఇక్కడ ἁγιάζω యేసు అపవిత్రత నుంచి పవిత్రతకు రావడం కంటే, తన కార్యం కోసం తనను తాను ప్రత్యేకంగా అంకితం చేసుకోవడాన్ని సూచిస్తుంది. ‘ప్రతిష్ఠించుకుంటున్నాను’ ఆ సమర్పణ భావాన్ని సహజంగా తెలియజేస్తుంది; ἐμαυτόν యొక్క ఆత్మార్థక బలాన్ని ‘నన్ను నేను’ నిలుపుతుంది.
- source_word: ἵνα
  choice: తద్వారా
  rationale: ἵνα తెలిపే ఉద్దేశం లేదా ఉద్దేశిత ఫలితాన్ని స్పష్టంగా చూపిస్తుంది.
- source_word: καὶ αὐτοὶ
  choice: వారు కూడా
  rationale: καί యొక్క చేర్పు భావాన్ని, αὐτοί యొక్క స్వల్ప ఉద్ఘాటనను సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: ἡγιασμένοι
  choice: ప్రతిష్ఠించబడినవారై
  rationale: పూర్త భూతకర్మక భాగధాతువు, జరిగిన ప్రతిష్ఠాపన వల్ల ఏర్పడిన స్థితిని సూచిస్తుంది. మొదటి ఉపవాక్యంలోని ἁγιάζωతో ఉన్న ఒకే మూలపద సంబంధాన్ని తెలుగులోనూ ‘ప్రతిష్ఠించు’ అనే పదాన్ని పునరావృతం చేసి నిలుపుతుంది.
- source_word: ἐν ἀληθείᾳ
  choice: సత్యంలో
  rationale: వ్యాసం లేని ఈ గ్రీకు పదబంధాన్ని ‘సత్యంలో’ అని అనువదించడం, సత్యం అనే పరిధి లేదా వాస్తవికతలో ప్రతిష్ఠించబడటాన్ని తెలియజేస్తుంది; గ్రీకులో లేని నిర్దిష్టతను అనవసరంగా చేర్చదు.
theological_decisions:
- issue: యేసు తనను తాను ప్రతిష్ఠించుకోవడం అనే మాట యొక్క భావం
  choice: శిష్యుల కోసం యేసు తన కార్యానికి తనను తాను ప్రత్యేకంగా అంకితం చేసుకుంటున్నాడు.
  alternative: యేసు తనను తాను నైతికంగా పరిశుద్ధునిగా చేసుకుంటున్నాడు.
  rationale: సందర్భంలో ఈ క్రియ అపవిత్రత నుంచి పవిత్రతకు మారడాన్ని కాక, యేసు తన నియోగానికి చేసుకునే స్వీయ సమర్పణను సూచించడం సహజం. అందుకే ‘ప్రతిష్ఠించుకుంటున్నాను’ అని అనువదించబడింది; అయితే అదే గ్రీకు మూలపదం రెండు ఉపవాక్యాల్లోనూ ఉండటం తెలుగు పునరావృతంలో నిలుపబడింది.
- issue: ἐν ἀληθείᾳ యొక్క భావం
  choice: ‘సత్యంలో’—ప్రతిష్ఠాపన జరిగే పరిధి లేదా వాస్తవికత.
  alternative: ‘ఆ సత్యంలో’ లేదా ‘సత్యం ద్వారా.’
  rationale: గ్రీకులో వ్యాసం లేకపోవడం వల్ల ‘సత్యంలో’ అనే రూపం మూలంలోని అనిర్దిష్టతను కాపాడుతుంది. అదే సమయంలో యోహాను 17:17లోని సమీప సందర్భంతో ఉన్న ప్రతిధ్వనిని పాఠకుడు వినగలిగేలా చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘ప్రతిష్ఠించు’ అనే పదం యేసు స్వీయ అంకితభావాన్ని తెలియజేస్తూనే, వచనంలోని ఒకే గ్రీకు మూలపద పునరావృతాన్ని రెండు ఉపవాక్యాల్లోనూ నిలుపుతుంది. ప్రధాన పాఠ్యంలో ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధం వెంట ఉంచబడింది.
