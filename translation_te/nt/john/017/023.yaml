source:
  edition: SBLGNT
  text: ἐγὼ ἐν αὐτοῖς καὶ σὺ ἐν ἐμοί, ἵνα ὦσιν τετελειωμένοι εἰς ἕν, ⸀ἵνα γινώσκῃ ὁ κόσμος ὅτι σύ με ἀπέστειλας καὶ ἠγάπησας αὐτοὺς καθὼς ἐμὲ ἠγάπησας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/023.yaml
  text: I in them and you in me[a], so that they may be perfected into one, so that the world may know that you sent me and loved them just as you loved me.
translation:
  language: te
  text: నేను వారిలోను, నీవు నాలోను ఉన్నాము—వారు ఒక్కటిగా సంపూర్ణులై ఉండేలా[a], లోకం నీవు నన్ను పంపావనీ, నీవు నన్ను ప్రేమించినట్లే వారినీ ప్రేమించావనీ తెలుసుకునేలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు ఒక్కటిగా సంపూర్ణులుగా చేయబడేలా’ లేదా ‘ఒక్కటిగా పూర్తికి తీసుకురాబడేలా.’
    reason: τετελειωμένοι అనే పరిపూర్ణకాల కర్మణి రూపం సంపూర్ణతకు చేర్చబడిన ఫలితస్థితిని సూచిస్తుంది.
lexical_decisions:
- source_word: ἐν αὐτοῖς / ἐν ἐμοί
  choice: వారిలో / నాలో
  rationale: యోహాను సువార్తలో ప్రాముఖ్యమైన పరస్పర అంతర్వాస భావాన్ని కాపాడేందుకు ἐν అనే ఉపసర్గను ‘లో’ అని నేరుగా అనువదించాం.
- source_word: τετελειωμένοι
  choice: పరిపూర్ణం చేయబడేలా
  rationale: τελειόω యొక్క పరిపూర్ణకాల కర్మణి రూపం పూర్తికి తీసుకురాబడిన స్థితిని సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ఉద్దేశాన్ని సహజంగా తెలిపేందుకు ఈ రూపాన్ని వాడాం; దీన్ని కేవలం పాపరహిత నైతిక పరిపూర్ణతగా పరిమితం చేయలేదు.
- source_word: εἰς ἕν
  choice: ఒక్కటిగా
  rationale: εἰς తో ఉన్న దిశ లేదా ఫలిత భావాన్ని, అంటే ఐక్యత వైపు తీసుకురాబడటాన్ని, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: γινώσκῃ
  choice: తెలుసుకుంటుంది
  rationale: ἵνα తరువాతి వర్తమాన సంభావనార్థక క్రియను ఉద్దేశం లేదా ఫలితంగా సహజ తెలుగులో వ్యక్తం చేస్తుంది; ‘గుర్తిస్తుంది’ అనే మరింత వ్యాఖ్యానాత్మక పదాన్ని నివారించాం.
- source_word: κόσμος
  choice: లోకం
  rationale: యోహాను రచనల్లోని విస్తృతమైన, ఉద్దేశపూర్వకంగా కొంత సందిగ్ధమైన వాడుకను కాపాడుతుంది; ‘లోకంలోని ప్రజలు’ అని వివరణాత్మకంగా విస్తరించలేదు.
- source_word: ἀπέστειλας
  choice: పంపావు
  rationale: కుమారుని పంపిన తండ్రి కార్యాన్ని సరళంగా, యోహాను సువార్తలోని పదప్రయోగానికి అనుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: ἠγάπησας
  choice: ప్రేమించావు
  rationale: రెండు చోట్లా ఒకే గ్రీకు క్రియ పునరావృతాన్ని తెలుగులోనూ నిలుపుతుంది.
- source_word: καθὼς
  choice: ప్రేమించినట్లే
  rationale: తండ్రి శిష్యులను ప్రేమించడానికీ కుమారుణ్ణి ప్రేమించడానికీ మధ్య ఉన్న బలమైన పోలికను తగ్గించకుండా సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ‘నీవు నన్ను ప్రేమించినట్లే వారినీ ప్రేమించావు’ అనే పోలిక బలం
  choice: ‘ప్రేమించినట్లే’ అని పోలికను నేరుగా నిలిపాం.
  alternative: ‘ప్రేమించిన విధమైన ప్రేమతో’ వంటి మృదువైన లేదా వివరణాత్మక రూపం.
  rationale: καθὼς నిజమైన పోలికను సూచిస్తుంది. దాని పరిధిని సిద్ధాంతపరంగా ముందే నిర్ణయించకుండా వాక్యంలోని theological tension ను అలాగే ఉంచాం.
- issue: ఈ సందర్భంలో τετελειωμένοι అర్థం
  choice: ఐక్యతలో పూర్తికి తీసుకురాబడే భావంతో ‘ఒక్కటిగా పరిపూర్ణం చేయబడేలా’ అని అనువదించాం.
  alternative: ‘ఒక్కటిలో పరిపూర్ణులుగా’ లేదా ‘ఐక్యతలో సంపూర్ణులుగా’ అని అనువదించడం.
  rationale: ఈ రూపం పూర్తికి లేదా పరిపక్వతకు తీసుకురావడాన్ని సూచించగలదు. విశ్వాసులు ఇప్పటికే సంపూర్ణ పాపరహిత స్థితిని పొందారని వాక్యంలోకి దిగుమతి చేయకుండా, మూలంలోని రూపాంతర మరియు పూర్తి భావాలను నిలిపాం.
- issue: రెండు ἵνα ఉపవాక్యాల సంబంధం
  choice: రెండవ ఉద్దేశం లేదా ఫలితాన్ని సహజ తెలుగులో ‘అప్పుడు ... తెలుసుకుంటుంది’ అని వ్యక్తం చేశాం.
  alternative: రెండింటినీ ‘...లా, ...లా’ అని సమాంతరంగా అనువదించడం.
  rationale: గ్రీకులో రెండు ἵνα ఉపవాక్యాలు ఉన్నప్పటికీ, తెలుగులో వరుసగా ఒకే నిర్మాణాన్ని వాడితే భారంగా ఉంటుంది. ‘అప్పుడు’ ఐక్యతకు లోకం తెలుసుకోవడం అనుసంధానమై ఉందనే భావాన్ని నిలుపుతుంది; కఠినమైన కారణ సంబంధాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ఆరంభంలోని ‘నేను వారిలో, నీవు నాలో’ అనే సంక్షిప్త సమాంతర నిర్మాణాన్ని మూలంలోని యోహానీయ శైలికి అనుగుణంగా నిలిపాం. ‘లోకం,’ ‘పంపావు,’ ‘ప్రేమించావు’ వంటి సుపరిచిత పదాలను ఎంచుకున్నాం.
