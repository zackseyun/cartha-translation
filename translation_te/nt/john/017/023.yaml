review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the Johannine ‘in’ language, the sending of the Son, the repeated verb ‘loved,’ and the direct force of ‘just as.’ However, ‘అప్పుడు ... తెలుసుకుంటుంది’ changes the second ἵνα purpose clause into a temporal/result statement. The perfect passive force of τετελειωμένοι is also better represented by a resultant-state expression.
  naturalness: The wording is generally modern and clear. ‘వారు ఒక్కటిగా పరిపూర్ణం చేయబడేలా’ is understandable but somewhat stiff; ‘వారు ఒక్కటిగా సంపూర్ణులై ఉండేలా’ is more natural while conveying the completed/resultant state. Retaining parallel ‘...ఉండేలా’ clauses better reflects the Greek structure.
  terminology: ‘వారిలో,’ ‘నాలో,’ ‘లోకం,’ ‘పంపావు,’ and ‘ప్రేమించావు’ are appropriate, natural, and consistent. ‘సంపూర్ణులై’ avoids unnecessarily narrowing τετελειωμένοι to moral sinlessness while preserving its completion/perfection sense.
  issues:
  - severity: medium
    issue: The second ἵνα clause is rendered as ‘అప్పుడు ... తెలుసుకుంటుంది.’
    rationale: ἵνα γινώσκῃ expresses purpose (‘so that the world may know’), not simply a subsequent event (‘then the world will know’). The revision retains the purposive relation without imposing a stronger temporal or causal sequence.
  - severity: low
    issue: ‘పరిపూర్ణం చేయబడేలా’ does not clearly convey the perfect participle’s resultant state and is less idiomatic here.
    rationale: ‘సంపూర్ణులై ఉండేలా’ naturally expresses being in a state of completion, while the footnote supplies the more explicitly passive alternative ‘సంపూర్ణులుగా చేయబడేలా.’
  revised_text: నేను వారిలోను, నీవు నాలోను ఉన్నాము—వారు ఒక్కటిగా సంపూర్ణులై ఉండేలా[a], లోకం నీవు నన్ను పంపావనీ, నీవు నన్ను ప్రేమించినట్లే వారినీ ప్రేమించావనీ తెలుసుకునేలా.
