revisions:
- from: నేను వారిలో, నీవు నాలో—వారు ఒక్కటిగా పరిపూర్ణం చేయబడేలా[a]; అప్పుడు నీవు నన్ను పంపావనీ, నీవు నన్ను ప్రేమించినట్లే వారినీ ప్రేమించావనీ లోకం తెలుసుకుంటుంది.
  to: నేను వారిలోను, నీవు నాలోను ఉన్నాము—వారు ఒక్కటిగా సంపూర్ణులై ఉండేలా[a], లోకం నీవు నన్ను పంపావనీ, నీవు నన్ను ప్రేమించినట్లే వారినీ ప్రేమించావనీ తెలుసుకునేలా.
  rationale: The revision preserves both Greek ἵνα clauses as purpose clauses, keeps εἰς ἕν as ‘ఒక్కటిగా,’ and expresses τετελειωμένοι as a completed/resultant condition without importing the idea of sinless perfection. The direct comparison in ‘నీవు నన్ను ప్రేమించినట్లే వారినీ ప్రేమించావు’ remains unchanged.
