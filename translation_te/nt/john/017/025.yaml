id: JHN.17.25
reference: John 17:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Πάτερ δίκαιε, καὶ ὁ κόσμος σε οὐκ ἔγνω, ἐγὼ δέ σε ἔγνων, καὶ οὗτοι ἔγνωσαν ὅτι σύ με ἀπέστειλας,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/025.yaml
  text: Righteous Father[a], though the world has not known you, I have known you[b], and these have known that you sent me.
translation:
  language: te
  text: నీతిమంతుడైన తండ్రీ, లోకం[a] నిన్ను తెలుసుకోకపోయినా, నేను నిన్ను తెలుసుకున్నాను; నీవే నన్ను పంపావని వీరు తెలుసుకున్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యోహాను రచనల్లో ‘లోకం’ అనేది కేవలం సృష్టిని మాత్రమే కాక, దేవునికి దూరమైన మానవాళిని కూడా తరచుగా సూచిస్తుంది.
    reason: cross_reference
  - marker: b
    text: ‘తెలుసుకోలేదు/తెలుసుకున్నాను/తెలుసుకున్నారు’ అనే భావాలకు గ్రీకులో ఇక్కడ అంతటా aorist రూపాలే ఉన్నాయి. సందర్భంలో వాటి కొనసాగుతున్న ప్రాసంగికతను తెలుగులో సహజంగా వ్యక్తం చేశాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάτερ δίκαιε
  choice: నీతిమంతుడైన తండ్రీ
  rationale: సంబోధన రూపాన్ని సహజమైన ఆధునిక తెలుగులో ఉంచుతూ, δίκαιος లోని నైతిక-దైవశాస్త్రపరమైన భావాన్ని ‘నీతిమంతుడైన’ కాపాడుతుంది.
- source_word: καὶ ὁ κόσμος σε οὐκ ἔγνω
  choice: లోకం నిన్ను తెలుసుకోకపోయినా
  rationale: మొదటి καὶ సందర్భంలో రాయితీ/వ్యతిరేక సంబంధాన్ని సూచిస్తుంది; ‘తెలుసుకోకపోయినా’ ఆ సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. κόσμος ను వివరణాత్మకంగా సంకుచితం చేయకుండా ‘లోకం’గా ఉంచాం.
- source_word: ἐγὼ δέ σε ἔγνων
  choice: నేను నిన్ను తెలుసుకున్నాను
  rationale: ἐγώ వల్ల వచ్చే కర్త ప్రాధాన్యాన్ని ‘నేను’ నిలుపుతుంది. ముందు ఉన్న ‘తెలుసుకోకపోయినా’తోనే δέ యొక్క వ్యతిరేకత స్పష్టమవుతుంది.
- source_word: οὗτοι ἔγνωσαν
  choice: వీరు తెలుసుకున్నారు
  rationale: οὗτοι అనే సూచన సర్వనామాన్ని ‘శిష్యులు’ వంటి వివరణను చేర్చకుండా నేరుగా ‘వీరు’గా అనువదించాం.
- source_word: ὅτι σύ με ἀπέστειλας
  choice: నీవే నన్ను పంపావని
  rationale: σύ యొక్క స్పష్టమైన ప్రాధాన్యాన్ని ‘నీవే’ తెలియజేస్తుంది; ὅτι తెలిపే విషయవాక్యాన్ని తెలుగులో సహజమైన ‘అని’ నిర్మాణంతో ఇచ్చాం.
theological_decisions:
- issue: δίκαιε అనే తండ్రి లక్షణం
  choice: నీతిమంతుడైన తండ్రీ
  alternative: న్యాయవంతుడైన తండ్రీ
  rationale: ‘నీతిమంతుడు’ న్యాయనిర్ణయానికి మాత్రమే పరిమితం కాకుండా నైతిక యథార్థత అనే విస్తృత భావాన్ని కాపాడుతుంది.
- issue: యోహాను సందర్భంలో κόσμος భావం
  choice: లోకం
  alternative: లోకంలోని ప్రజలు
  rationale: మానవాళి, దేవునికి దూరమైన వ్యవస్థ అనే యోహాను రచనలోని పొరలుగల భావాన్ని ప్రధాన పాఠ్యంలో ఒకే వివరణకు పరిమితం చేయలేదు.
- issue: γινώσκω క్రియల కాలాంశం
  choice: తెలుసుకోకపోయినా / తెలుసుకున్నాను / తెలుసుకున్నారు
  alternative: తెలియలేదు / తెలుసుకున్నాను / తెలుసుకున్నారు
  rationale: గ్రీకు aorist రూపాల గత చర్యతోపాటు ప్రార్థనా సందర్భంలోని ప్రస్తుత ప్రాసంగికతను తెలుగులో సహజంగా వినిపించే విధంగా వ్యక్తం చేశాం; ‘తెలుసుకోవడం’ సంబంధాత్మక, జ్ఞానాత్మక రెండు ఛాయలనూ అనుమతిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవప్రదమైన, అయినా సాధారణ పాఠకులకు సులభమైన శైలి. దేవునితో ప్రత్యక్ష సంబోధనలో బైబిలు తెలుగుకు సహజమైన ఏకవచన రూపాలు వాడబడ్డాయి.
