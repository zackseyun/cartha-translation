  text: καὶ ἐγνώρισα αὐτοῖς τὸ ὄνομά σου καὶ γνωρίσω, ἵνα ἡ ἀγάπη ἣν ἠγάπησάς με ἐν αὐτοῖς ᾖ κἀγὼ ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/026.yaml
  text: And I made your name known to them[a], and I will make it known, so that the love with which you loved me may be in them[c][b], and I in them.
translation:
  language: te
  text: నీ నామాన్ని వారికి తెలియజేశాను[a], ఇంకా తెలియజేస్తాను—నీవు నన్ను ప్రేమించిన ప్రేమ వారిలో ఉండాలని[b], నేను కూడా వారిలో ఉండాలని.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ నామాన్ని వారికి వెల్లడించాను; ఇంకా వెల్లడిస్తాను.”
    reason: lexical_alternative
  - marker: b
    text: “నీ నామం” అంటే కేవలం పలికే పేరు మాత్రమే కాదు; దేవుడు వెల్లడిచేసిన తన గుర్తింపు, స్వభావం కూడా ఇందులో సూచితమవుతాయి. “వారిలో” అనే మాటను “వారి మధ్య” అని కూడా అర్థం చేసుకోవచ్చు; అయితే “వారిలో” అనే అనువాదం యోహాను సువార్తలోని అంతర్నివాస భావాన్ని మరింత నేరుగా నిలుపుతుంది.
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισα
  choice: తెలియజేశాను
  rationale: γνωρίζω యొక్క causative భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; aorist మొదటి పురుష ఏకవచనాన్ని నిలుపుతుంది.
- source_word: τὸ ὄνομά σου
  choice: నీ నామాన్ని
  rationale: మూలంలోని ‘నీ నామం’ అనే స్పష్టమైన రూపకాన్ని వ్యాఖ్యానాత్మకంగా ‘నీ స్వభావం’ లేదా ‘నీవెవరో’ అని విస్తరించకుండా నిలుపుతుంది.
- source_word: γνωρίσω
  choice: ఇంకా తెలియజేస్తాను
  rationale: భవిష్యత్ క్రియను ముందున్న ‘తెలియజేశాను’తో సమాంతరంగా ఉంచుతుంది; తెలుగు వాక్యంలో కర్మను సహజంగా అధ్యాహారంగా ఉంచింది.
- source_word: ἵνα
  choice: ఉండాలని ... ఇలా చేశాను
  rationale: గ్రీకు ఉద్దేశ్య/ఫలిత సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἡ ἀγάπη ἣν ἠγάπησάς με
  choice: నీవు నన్ను ప్రేమించిన ప్రేమ
  rationale: మూలంలోని cognate నిర్మాణమైన ‘ప్రేమ ... ప్రేమించావు’ను సాధ్యమైనంత దగ్గరగా నిలుపుతూ, తండ్రి కుమారునిపట్ల చూపిన ప్రేమనే సూచిస్తుంది.
- source_word: ἐν αὐτοῖς
  choice: వారిలో
  rationale: ἐν + dative యొక్క ప్రత్యక్ష అర్థాన్ని, యోహాను సువార్తలోని అంతర్నివాస భావాన్ని నిలుపుతుంది; ‘వారి మధ్య’ అనే ప్రత్యామ్నాయాన్ని ప్రధాన పాఠ్యంలో ఎంచుకోలేదు.
- source_word: κἀγὼ ἐν αὐτοῖς
  choice: నేను కూడా వారిలో ఉండాలని
  rationale: గ్రీకులో అధ్యాహారంగా ఉన్న ᾖ క్రియను తెలుగులో స్పష్టత కోసం పునరుద్ధరిస్తూ, ప్రేమ మరియు క్రీస్తు వారిలో ఉండడం అనే రెండు సమన్విత అంశాలను కాపాడుతుంది.
theological_decisions:
- issue: ‘నీ నామం’ అనే యోహాను సంబంధిత పదబంధం యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో ‘నీ నామం’ అని నిలుపడం
  alternative: ‘నీ స్వభావం’ లేదా ‘నీవెవరో’ అని అనువదించడం
  rationale: ఈ పదబంధం దేవుని వెల్లడైన గుర్తింపును, స్వభావాన్ని సూచించినా, మూలపాఠ్యం ‘నామం’ అంటుంది. దాని ధార్మిక లోతును అనువాదంలో ముందుగానే పరిష్కరించకుండా పాదటిప్పణిలో వివరిస్తుంది.
- issue: దైవప్రేమకు క్రీస్తు అంతర్నివాసానికి మధ్య సంబంధం
  choice: ‘ప్రేమ వారిలో ఉండాలని, నేను కూడా వారిలో ఉండాలని’ అనే సమన్విత నిర్మాణం
  alternative: క్రీస్తు వారిలో ఉండడాన్ని ప్రేమకు కారణంగా లేదా ఉపవాక్యంగా స్పష్టీకరించడం
  rationale: గ్రీకు రెండు వాస్తవాలను సమన్వయంగా ఉంచుతుంది; వాటి మధ్య సంబంధాన్ని మూలం చెప్పినదానికంటే ఎక్కువగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘నామం’ అనే బైబిలు రూపకాన్ని నిలుపుతూ, భారమైన వాక్యనిర్మాణాన్ని నివారించేందుకు చివర ‘ఇలా చేశాను’ అని ἵνα సంబంధాన్ని సహజీకరించాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
