  terminology: ‘నామం,’ ‘తెలియజేశాను,’ ‘ప్రేమ,’ and ‘వారిలో’ are suitable for modern standard Telugu and retain the biblical register without interpretive expansion. The note appropriately distinguishes ‘నామం’ from a merely spoken label. Separate footnote anchors make the two distinct notes clearer.
