lexical_decisions:
- source_word: τὰ ἐμὰ πάντα
  choice: నావన్నీ
  rationale: నపుంసక బహువచనంతో కూడిన πᾶς యేసుకు చెందిన సమస్తాన్ని సమగ్రంగా సూచిస్తుంది. ‘నావన్నీ’ సహజమైన, సంక్షిప్తమైన తెలుగు ప్రయోగం; కేవలం వస్తువులనే సూచించే భావాన్ని కలిగించదు.
- source_word: σά
  choice: నీవి
  rationale: స్వామ్యవాచక విశేషణాన్ని సమీకరణ వాక్యంలో సహజమైన తెలుగు స్వామ్యరూపంగా అనువదించింది; పరస్పర స్వామ్యాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: τὰ σὰ ἐμά
  choice: నీవన్నీ నావి
  rationale: మొదటి భాగంలోని నిర్మాణానికి సమాంతరంగా ఉండి, తండ్రికి చెందిన సమస్తం తనదని యేసు చెప్పిన పరస్పర స్వామ్య భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: δεδόξασμαι
  choice: నేను మహిమపరచబడ్డాను
  rationale: పర్ఫెక్ట్ పాసివ్ రూపం పూర్తయిన క్రియతో పాటు కొనసాగుతున్న ఫలితాన్ని సూచిస్తుంది. ‘మహిమపరచబడ్డాను’ కర్మణి భావాన్ని నిలుపుతుంది; దాన్ని సాధారణ వర్తమాన కాలంగా కుదించదు.
- source_word: ἐν αὐτοῖς
  choice: వారిలో
  rationale: ἐν యొక్క ప్రత్యక్షమైన స్థానార్థాన్ని నిలుపుతుంది. సందర్భంలో αὐτοῖς తండ్రి యేసుకు ఇచ్చిన వ్యక్తులను సూచిస్తున్నందున తెలుగు వ్యక్తివాచక బహువచన రూపమైన ‘వారిలో’ సహజం; దీని ద్వారా ‘వారి ద్వారా’ లేదా ‘వారి మధ్య’ అనే సాధ్యమైన సందర్భార్థాలను ప్రధాన పాఠ్యంలో నిర్ణయించకుండా ఉంచుతుంది.
theological_decisions:
- issue: కుమారునికీ తండ్రికీ మధ్య పరస్పర స్వామ్యం
  choice: ‘నావన్నీ నీవి, నీవన్నీ నావి’ అని పరస్పర స్వామ్యాన్ని నేరుగా అనువదించడం.
  alternative: దీనిని కేవలం కార్యసహకారంగా బలహీనపరచడం.
  rationale: గ్రీకు పాఠ్యం పరస్పర స్వామ్యాన్ని స్పష్టంగా ప్రకటిస్తుంది. ఆ భావాన్ని తగ్గించకుండా, అదే సమయంలో వచనంలో లేని తరువాతి సిద్ధాంత పదజాలాన్ని చేర్చకుండా అనువాదం నిలుపుతుంది.
- issue: ἐν αὐτοῖς యొక్క సంబంధం మరియు భావం
  choice: ప్రధాన పాఠ్యంలో ‘వారిలో’ అనే స్థానార్థ రూపాన్ని ఉంచడం.
  alternative: ‘వారి ద్వారా’ అనే సాధనార్థం లేదా ‘వారి మధ్య’ అనే సంబంధార్థం.
  rationale: ἐν సందర్భానుసారంగా స్థానం, సాధనం, లేదా ప్రత్యక్షీకరణ భావాలను కలిగి ఉండగలదు. గ్రీకు పాఠ్యం ఈ అవకాశాల్లో ఒక్కదానినే తప్పనిసరిగా నిర్ణయించదు; కాబట్టి ప్రధాన పాఠ్యం ప్రత్యక్ష రూపాన్ని ఉంచి, ప్రత్యామ్నాయాలను పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘నావన్నీ… నీవన్నీ…’ అనే సమాంతర నిర్మాణం మూలంలోని సంక్షిప్తతను, బలాన్ని నిలుపుతుంది. ‘వారిలో’ వ్యక్తులను సూచిస్తున్న సందర్భానికి తగినది; [a] గుర్తు ప్రధాన పాఠ్యంలో స్పష్టంగా చేర్చబడింది.
