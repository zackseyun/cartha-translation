review_pass:
  verdict: revise
  source_fidelity: The first clause accurately renders the two perfect verbs and δόξα. However, ‘ఇలా చేశాను’ (‘I did this’) is not expressed in the Greek and introduces an additional demonstrative action. The purpose clause should be linked directly to the giving of glory. ‘వారు కూడా’ is likewise not required by αὐτοῖς and is best omitted, while the additive nuance of κἀγώ remains appropriately footnoted.
  naturalness: The Telugu is modern and clear. Recasting the second sentence as a direct purpose clause makes the flow both more idiomatic and closer to the compact Greek syntax.
  terminology: ‘మహిమ’ suitably renders δόξα in Johannine usage. ‘ఒక్కటిగా’ naturally communicates the neuter ἕν as unity without defining the mode of oneness. ‘మనం’ appropriately represents the Father-and-Son speaker reference in the comparison.
  issues:
  - severity: medium
    issue: ‘ఇలా చేశాను’ has been added to the purpose clause.
    rationale: ἵνα ὦσιν introduces the intended purpose/result of giving the glory; it does not contain a separate statement equivalent to ‘I did this.’ The addition slightly expands the source wording and should be removed.
  - severity: low
    issue: ‘వారు కూడా’ adds an unnecessary ‘also.’
    rationale: The additive emphasis in κἀγώ concerns ‘I,’ not ‘they.’ Telugu need not mark anything additional with respect to the disciples.
  revised_text: నీవు నాకు ఇచ్చిన మహిమను నేను వారికి ఇచ్చాను[a], వారు మనం ఒక్కటిగా ఉన్నట్లే ఒక్కటిగా ఉండాలని.
  revised_footnotes:
