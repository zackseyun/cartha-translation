id: JHN.17.22
reference: John 17:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κἀγὼ τὴν δόξαν ἣν δέδωκάς μοι δέδωκα αὐτοῖς, ἵνα ὦσιν ἓν καθὼς ἡμεῖς ⸀ἕν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/022.yaml
  text: And I have given them the glory that you have given me[a], so that they may be one, just as we are one.
translation:
  language: te
  text: నీవు నాకు ఇచ్చిన మహిమను నేను వారికి ఇచ్చాను[a], వారు మనం ఒక్కటిగా ఉన్నట్లే ఒక్కటిగా ఉండాలని.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీవు నాకు ఇచ్చిన మహిమను నేను కూడా వారికి ఇచ్చాను.’ గ్రీకు κἀγώ అనే పదంలో ‘నేను కూడా’ అనే అదనపు ఉద్ఘాటన ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: నేను
  rationale: καί + ἐγώ కలయికలో అనుసంధాన లేదా అదనపు భావం ఉంది. తెలుగులో సందర్భప్రవాహం సహజంగా ఉండేందుకు ప్రధాన పాఠంలో ‘నేను’ అని ఇచ్చి, ‘నేను కూడా’ అనే సాధ్యమైన అదనపు ఉద్ఘాటనను పాదటిప్పణిలో ఉంచాం.
- source_word: δόξαν
  choice: మహిమను
  rationale: యోహాను రచనలో δόξα దైవిక మహిమ అనే గంభీరమైన భావాన్ని తరచుగా మోస్తుంది; ‘గౌరవం’ కంటే ‘మహిమ’ ఆ భావాన్ని, అంతర్గ్రంథ సాంగత్యాన్ని మెరుగ్గా కాపాడుతుంది.
- source_word: ἣν δέδωκάς μοι
  choice: నీవు నాకు ఇచ్చిన
  rationale: గ్రీకు పరిపూర్ణ కాలం పూర్తయి కొనసాగుతున్న ఫలితమున్న క్రియను సూచిస్తుంది. తెలుగులో ‘ఇచ్చిన’ అనే సహజ సంబంధవాచక నిర్మాణం సందర్భంలో ఆ స్థిర ఫలితాన్ని తగినంతగా వ్యక్తం చేస్తుంది.
- source_word: δέδωκα αὐτοῖς
  choice: నేను వారికి ఇచ్చాను
  rationale: పూర్తయిన దానక్రియను సహజ ఆధునిక తెలుగులో తెలియజేస్తుంది; సందర్భం దాని కొనసాగుతున్న ఫలితాన్ని మోస్తుంది.
- source_word: ἵνα ὦσιν
  choice: ఉండాలని ఇలా చేశాను
  rationale: ἵνα ఉద్దేశం లేదా ఉద్దేశిత ఫలితాన్ని సూచిస్తుంది. ‘ఉండాలని’ ఆ ఉద్దేశాన్ని సహజంగా తెలుపుతుంది; ముందటి దానక్రియతో సంబంధం స్పష్టమయ్యేందుకు ‘ఇలా చేశాను’ను భావపూరకంగా చేర్చాం.
- source_word: ἓν
  choice: ఒక్కటిగా
  rationale: నపుంసక ఏకవచనమైన ἕν వ్యక్తులు ఒకే వ్యక్తిగా మారడాన్ని కాక ఐక్యతను సూచిస్తుంది. ‘ఒక్కటిగా’ మూలంలోని సంక్షిప్తతను కాపాడుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: καθὼς
  choice: ఉన్నట్లే
  rationale: స్పష్టమైన పోలికను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἡμεῖς ἕν
  choice: మనం ఒక్కటిగా ఉన్నట్లే
  rationale: గ్రీకులో రెండో ‘ఉన్నాం’ భావితమైనది. తెలుగులో ‘మనం ఒక్కటిగా ఉన్నట్లే’ పోలికను సంపూర్ణంగా, అతివ్యాఖ్యానం లేకుండా అందిస్తుంది.
theological_decisions:
- issue: విశ్వాసుల ఏకత్వానికి తండ్రి–కుమారుల ఏకత్వంతో ఉన్న పోలిక స్వభావం
  choice: ‘మనం ఒక్కటిగా ఉన్నట్లే వారు కూడా ఒక్కటిగా ఉండాలి’ అనే పోలికను దాని స్వరూపం ఏమిటో నిర్దేశించకుండా నేరుగా అనువదించడం.
  alternative: దీనిని కేవలం సంబంధపరమైన, దైవజీవితంలో భాగస్వామ్యమైన, లేదా సంస్థాగత సంఘ ఐక్యతగా నిర్దిష్టంగా వ్యాఖ్యానించడం.
  rationale: వాక్యం శిష్యుల ఏకత్వాన్ని తండ్రి–కుమారుల ఏకత్వంతో నిజంగా పోలుస్తుంది; అయితే ఆ పోలిక ఏ విధమైనదో ఇక్కడ నిర్వచించదు. అందువల్ల మూలంలోని ధార్మిక విస్తృతిని, ఉద్రిక్తతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మహిమ’, ‘ఒక్కటిగా’ వంటి పదాలు యోహాను సువార్తలోని ధార్మిక బరువును కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠంలో ఉంచబడింది.
