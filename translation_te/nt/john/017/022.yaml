revisions:
- from: నీవు నాకు ఇచ్చిన మహిమను నేను వారికి ఇచ్చాను[a]. మనం ఒక్కటిగా ఉన్నట్లే వారు కూడా ఒక్కటిగా ఉండాలని ఇలా చేశాను.
  to: నీవు నాకు ఇచ్చిన మహిమను నేను వారికి ఇచ్చాను[a], వారు మనం ఒక్కటిగా ఉన్నట్లే ఒక్కటిగా ఉండాలని.
  rationale: 'The revision removes material not present in the Greek and renders the ἵνα purpose clause directly: Jesus has given the glory so that the disciples may be one, just as he and the Father are one. It preserves the source’s theological openness and the existing lexical alternative for κἀγώ.'
  reviewer_model: gpt-5.6-terra
