source:
  edition: SBLGNT
  text: Οὐ περὶ τούτων δὲ ἐρωτῶ μόνον, ἀλλὰ καὶ περὶ τῶν πιστευόντων διὰ τοῦ λόγου αὐτῶν εἰς ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/020.yaml
  text: I do not ask concerning these only[a], but also concerning those who believe in me through their word[b],
translation:
  language: te
  text: నేను వీరి గురించి మాత్రమే అడగడం లేదు; వీరి మాట[a] ద్వారా నాయందు విశ్వాసం ఉంచేవారి గురించి కూడా అడుగుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వీరి సందేశం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: అడుగుతున్నాను
  rationale: యోహాను సువార్తలో ఈ క్రియ తండ్రిని ఉద్దేశించి యేసు చేసే మనవిని సూచిస్తుంది. ‘ప్రార్థిస్తున్నాను’ అని అనువదిస్తే మూలక్రియలో లేని భక్తిపరమైన భావాన్ని అదనంగా చేర్చే అవకాశం ఉంది; ‘అడుగుతున్నాను’ సహజంగాను పారదర్శకంగాను ఉంది.
- source_word: περὶ τούτων
  choice: వీరి గురించి
  rationale: περί + షష్ఠీ విభక్తి ‘గురించి’ అనే సంబంధార్థాన్ని ఇస్తుంది. τούτων ఇక్కడ వ్యక్తులను, సందర్భానుసారం సమీప శిష్యులను, సూచిస్తుంది కాబట్టి ఆధునిక తెలుగులో ‘వీరి’ సహజం; అయితే ‘శిష్యులు’ అని స్పష్టీకరించి మూలంలోని సూచనాత్మకతను తొలగించలేదు.
- source_word: μόνον
  choice: మాత్రమే
  rationale: యేసు అడుగుతున్న వారి పరిధిని పరిమితం చేసే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀλλὰ καὶ
  choice: కూడా
  rationale: తెలుగు వాక్య నిర్మాణంలోని ‘మాత్రమే … లేదు; … కూడా’ అనే జత గ్రీకు విరోధ-సముచ్చయ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τῶν πιστευόντων
  choice: నమ్మేవారి
  rationale: వర్తమాన కాల కృదంతం నామవాచకార్థంలో ఉంది. ‘నమ్మేవారు’ దాని క్రియాత్మక భావాన్ని కాపాడుతుంది; మూలంలో లేని ‘ముందు ముందు నమ్మబోయేవారు’ అనే కాలసూచనను చేర్చదు.
- source_word: διὰ τοῦ λόγου αὐτῶν
  choice: వీరి మాట ద్వారా
  rationale: διά ఇక్కడ సాధనాన్ని సూచిస్తుంది. λόγος‌కు ‘మాట’ అనే ఎంపిక మూలానికి సన్నిహితంగా ఉండి యోహాను రచనలోని పదప్రతిధ్వనిని నిలుపుతుంది; ‘సందేశం’ కూడా సందర్భానుకూల ప్రత్యామ్నాయం.
- source_word: εἰς ἐμέ
  choice: నన్ను నమ్మే
  rationale: πιστεύω + εἰς నిర్మాణం యోహానులో వ్యక్తిపై విశ్వాసాన్ని సూచిస్తుంది. తెలుగులో ‘నన్ను నమ్మడం’ సహజమైన వ్యక్తీకరణ; ‘నాలోకి నమ్మడం’ అనే అక్షరానువాదం అసహజం.
theological_decisions:
- issue: యేసు మనవి సమీప శిష్యులను దాటి ఎవరిని చేర్చుతుంది
  choice: వారి సాక్ష్యమైన మాట ద్వారా యేసును నమ్మేవారిని కూడా చేర్చుతుంది; కాలపరిధిని అనువాదం స్పష్టీకరించదు.
  alternative: ఇది భవిష్యత్తులో అపొస్తలుల సందేశం ద్వారా విశ్వసించబోయే వారిని ప్రత్యేకంగా సూచిస్తుందని ‘నమ్మబోయేవారు’ అని అనువదించడం.
  rationale: τῶν πιστευόντων అనే వర్తమాన కృదంతం విస్తృతంగా లేదా భవిష్యత్ ఫలితాన్ని కలుపుకొని అర్థం కావచ్చు, కాని వచనంలో భవిష్యత్ కాలం ప్రత్యక్షంగా లేదు. అందువల్ల ‘నమ్మేవారు’ అనే రూపం విస్తృత సంఘ సంబంధ భావాన్ని అనుమతిస్తూ నిజమైన కాలసంబంధ అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘వీరి గురించి మాత్రమే … వీరి మాట ద్వారా’ అనే పునరుక్తి మూలంలోని τούτων / αὐτῶν సూచన సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
