id: JHN.17.14
reference: John 17:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ δέδωκα αὐτοῖς τὸν λόγον σου, καὶ ὁ κόσμος ἐμίσησεν αὐτούς, ὅτι οὐκ εἰσὶν ἐκ τοῦ κόσμου καθὼς ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/014.yaml
  text: I have given them your word[a], and the world has hated them because they are not of the world, just as I am not of the world.
translation:
  language: te
  text: నేను వారికి నీ వాక్యాన్ని ఇచ్చాను. వారు లోకానికి చెందినవారు కారు[a] కాబట్టి లోకం వారిని ద్వేషించింది; నేను లోకానికి చెందినవాడను కానట్లే వారూ లోకానికి చెందినవారు కారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లోకం నుండి వచ్చినవారు కారు.” గ్రీకులోని ἐκ అనే పదం మూలం లేదా ఉద్భవాన్ని, అలాగే చెందినతనాన్ని సూచించగలదు. ఇదే భావం ఈ వాక్యంలో రెండుసార్లు వస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέδωκα
  choice: ఇచ్చాను
  rationale: గ్రీకు పరిపూర్ణ కాలం పూర్తయిన కార్యాన్నీ దాని కొనసాగుతున్న ఫలితాన్నీ సూచిస్తుంది. తెలుగులో ‘ఇచ్చాను’ సహజంగా ఉండి, సందర్భంలో ఆ వాక్యం ఇంకా వారి వద్ద ఉందనే భావాన్ని అనుమతిస్తుంది.
- source_word: λόγον
  choice: వాక్యాన్ని
  rationale: ‘వాక్యం’ తండ్రి యేసు ద్వారా తెలియజేసిన మాటను సూచిస్తూ, యోహాను రచనలో λόγος పదానికి ఉన్న ప్రతిధ్వనిని కాపాడుతుంది; ‘సందేశం’ కంటే తక్కువ వివరణాత్మకంగా ఉంటుంది.
- source_word: κόσμος
  choice: లోకం
  rationale: యోహానులో κόσμος దేవునికి విరోధంగా ఉన్న మానవ వ్యవస్థను సందర్భానుసారంగా సూచించగలదు. ‘లోకం’ పదం దాని విస్తృతిని కాపాడుతుంది; విరోధ భావం ‘ద్వేషించింది’ ద్వారా స్పష్టమవుతుంది.
- source_word: ἐμίσησεν
  choice: ద్వేషించింది
  rationale: గ్రీకు భూతకాల క్రియను సహజమైన తెలుగు సాధారణ భూతకాలంతో అనువదించాం. ఇది ద్వేషం జరిగిన వాస్తవాన్ని తెలుపుతుంది; కొనసాగుతున్న స్థితిని అనవసరంగా క్రియారూపంలో చేర్చదు.
- source_word: ὅτι
  choice: కాబట్టి
  rationale: 'ఇక్కడ ὅτι కారణాన్ని తెలియజేస్తుంది: శిష్యులు లోకానికి చెందినవారు కాకపోవడమే లోక ద్వేషానికి కారణంగా చెప్పబడింది.'
- source_word: ἐκ τοῦ κόσμου
  choice: లోకానికి చెందినవారు కారు
  rationale: ἐκ మూలం లేదా ఉద్భవాన్ని సూచించినప్పటికీ, ఈ సందర్భంలో చెందినతనాన్ని కూడా వ్యక్తం చేస్తుంది. ప్రధాన పాఠంలో సహజమైన తెలుగు వాడి, ‘లోకం నుండి వచ్చినవారు కారు’ అనే మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: καθὼς
  choice: కానట్టే
  rationale: శిష్యులకూ యేసుకూ లోకంతో ఉన్న సంబంధం మధ్య గ్రీకు పాఠం చేసే ప్రత్యక్ష పోలికను సహజమైన తెలుగులో స్పష్టంగా చూపుతుంది.
theological_decisions:
- issue: యేసు మరియు శిష్యులు ‘లోకం నుండి/లోకానికి చెందినవారు’ కాకపోవడం మధ్య పోలిక
  choice: ‘నేను లోకానికి చెందినవాణ్ణి కానట్టే వారూ లోకానికి చెందినవారు కారు’ అని పోలికను నేరుగా నిలిపాం.
  alternative: ‘నేను లోకం నుండి వచ్చినవాణ్ణి కానట్టే వారూ లోకం నుండి వచ్చినవారు కారు.’
  rationale: ప్రధాన అనువాదం చెందినతనాన్ని సహజంగా తెలియజేస్తుంది; పాదసూచిక మూలం/ఉద్భవం అనే ἐκ భావాన్ని నిలుపుతుంది. దీనివల్ల పోలికను బలహీనపరచకుండా, దానికి పాఠానికి మించిన తాత్త్విక వివరణను జోడించకుండా గ్రీకు భావంలోని ఉద్రిక్తత కాపాడబడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడాం. ‘నీ వాక్యం,’ ‘లోకం’ వంటి యోహాను రచనకు ముఖ్యమైన పదాలను స్థిరంగా ఉంచాం. ప్రధాన పాఠంలో ‘లోకానికి చెందినవారు’ సహజంగా ఉండగా, మూలభాషలోని ἐκ పదానికి ఉన్న ‘నుండి’ భావాన్ని పాదసూచికలో సంరక్షించాం.
