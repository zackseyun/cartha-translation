lexical_decisions:
- source_word: ἐκ τοῦ κόσμου
  choice: లోకానికి చెందినవారు
  rationale: ἐκ అనే విభక్తి ప్రయోగం మూలం, ఉద్భవం లేదా సంబంధాన్ని సూచించగలదు. తెలుగులో అక్షరార్థమైన ‘లోకం నుండి’ ఈ సందర్భంలో భౌతికంగా బయలుదేరడాన్ని సూచించే అవకాశం ఉన్నందున, ‘లోకానికి చెందినవారు’ యోహాను వాడుకలోని సంబంధం/మూలం భావాన్ని సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: κόσμου
  choice: లోకం
  rationale: κόσμος పదాన్ని వ్యాఖ్యానాత్మకంగా ‘లోక వ్యవస్థ’ అని విస్తరించకుండా, యోహాను రచనలోని దాని ఉద్దేశపూర్వక విస్తృతతను నిలిపే సాధారణ పదం.
- source_word: οὐκ εἰσὶν
  choice: చెందినవారు కారు
  rationale: వర్తమానకాల నిరాకరణను సహజమైన తెలుగు విధేయ నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: καθὼς
  choice: కానట్లే
  rationale: శిష్యులకు, యేసుకు మధ్య ఉన్న పోలికను సహజంగా మరియు స్పష్టంగా సూచిస్తుంది.
- source_word: ἐγὼ
  choice: నేను
  rationale: గ్రీకులో స్పష్టంగా ఉన్న సర్వనామాన్ని పోలికలోని ఉద్ఘాటన కోసం నిలిపాం.
- source_word: οὐκ εἰμὶ
  choice: చెందినవాడిని కాను
  rationale: మొదటి పురుష ఏకవచన వర్తమాన నిరాకరణను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యోహాను రచనలో ‘లోకం’ అనే పదం యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో ‘లోకం’ అనే సరళ పదాన్నే ఉంచడం
  alternative: ‘లోక వ్యవస్థ’ లేదా ‘పతనమైన ప్రస్తుత వ్యవస్థ’
  rationale: ఈ సందర్భంలో κόσμος దేవునికి విరోధంగా ఉన్న మానవ లోకాన్ని సూచించే లోతు కలిగి ఉండవచ్చు. అయితే పదాన్ని వ్యాఖ్యానాత్మకంగా విస్తరిస్తే వాక్యం ఉంచిన భావ విస్తృతత, ఉద్రిక్తత తగ్గిపోతాయి.
- issue: ἐκ యొక్క మూలం/సంబంధం భావం
  choice: ప్రధాన పాఠ్యంలో ‘చెందిన’ అని, పాదటిప్పణిలో ‘నుండి’ అని ఇవ్వడం
  alternative: రెండు చోట్లా ‘లోకం నుండి వచ్చినవారు కారు’ అని అనువదించడం
  rationale: ‘చెందిన’ అనేది తెలుగులో సహజంగా సంబంధాన్ని తెలియజేస్తుంది; ‘నుండి’ అనే మూలభావాన్ని పాదటిప్పణి నిలుపుతుంది. తద్వారా శారీరక స్థానం గురించి అనవసరమైన అర్థాన్ని రుద్దకుండా గ్రీకు పదబంధంలోని భావ పరిధిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్య క్రమం శిష్యులతో మొదలైనా, తెలుగు పోలిక స్పష్టంగా వినిపించేందుకు ‘నేను... కానట్లే, వారూ... కారు’ అనే క్రమం వాడాం. ‘వారూ’ పోలికలోని సమాంతరతను బలపరుస్తుంది.
