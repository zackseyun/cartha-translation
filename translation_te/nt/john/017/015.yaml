id: JHN.17.15
reference: John 17:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐκ ἐρωτῶ ἵνα ἄρῃς αὐτοὺς ἐκ τοῦ κόσμου ἀλλ’ ἵνα τηρήσῃς αὐτοὺς ἐκ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/015.yaml
  text: I am not asking that you take them out of the world[a], but that you keep them from the evil one.
translation:
  language: te
  text: మీరు వారిని లోకం నుండి తీసుకుపోవాలని నేను అడగడం లేదు; కానీ మీరు వారిని దుష్టుని నుండి కాపాడాలని అడుగుతున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చెడు నుండి వారిని కాపాడాలని అడుగుతున్నాను.” గ్రీకు τοῦ πονηροῦ అనే పదబంధానికి “దుష్టుడు” లేదా “చెడు” అనే రెండు అర్థాలూ రావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: అడగడం లేదు / అడుగుతున్నాను
  rationale: వర్తమానకాలంలోని ప్రత్యక్ష విన్నప భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ప్రార్థనా సందర్భాన్ని మించి ప్రత్యేక మతపరమైన పదాన్ని చేర్చదు.
- source_word: ἄρῃς
  choice: తీసివేయమని
  rationale: αἴρω ఇక్కడ లోకం నుండి తొలగించడం లేదా బయటకు తీసుకుపోవడం అనే భావంలో ఉంది; ‘లోకం నుండి తీసివేయడం’ నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: κόσμου
  choice: లోకం
  rationale: యోహాను రచనల్లో κόσμος‌కు ఉన్న విస్తృతమైన, కొన్నిసార్లు దేవునికి విరోధమైన మానవ వ్యవస్థను సూచించే భావాన్ని ముందుగానే కుదించకుండా సాధారణ పదంతో నిలుపుతుంది.
- source_word: τηρήσῃς
  choice: కాపాడమని
  rationale: τηρέω యొక్క కాపాడటం, భద్రపరచటం అనే సందర్భార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἐκ
  choice: నుండి
  rationale: మొదటి భాగంలో లోకం నుండి బయటకు తీసివేయడం, రెండవ భాగంలో దుష్టుని నుండి కాపాడడం అనే వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοῦ πονηροῦ
  choice: దుష్టుని
  rationale: వ్యాకరణపరంగా వ్యక్తిగతమైన ‘దుష్టుడు’ లేదా అవ్యక్తమైన ‘చెడు’ రెండూ సాధ్యమే; యోహాను సంబంధిత వాడుక వ్యక్తిగత సూచనకు కొంత మద్దతు ఇస్తుంది. నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: τοῦ πονηροῦ అనేది అవ్యక్తమైన ‘చెడు’నా, వ్యక్తిగతమైన ‘దుష్టుడు’నా?
  choice: దుష్టుని
  alternative: చెడు నుండి
  rationale: గ్రీకు రూపం పుంలింగంగానూ నపుంసకలింగంగానూ అర్థమయ్యే అవకాశం కలిగివుంది. యోహాను రచనల వాడుక వ్యక్తిగత సూచనకు మొగ్గు చూపినా, అవ్యక్తమైన అర్థాన్ని తొలగించకుండా పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనకు తగిన గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని ‘లోకం నుండి తీసివేయడం’ మరియు ‘దుష్టుని నుండి కాపాడడం’ మధ్య వ్యత్యాసాన్ని నిలిపింది; నిజమైన లింగార్థ సందిగ్ధతను పాదసూచికలో భద్రపరిచింది.
