    reason: alternative_reading
  revision_rationale: The revision replaces the potentially overbroad తీసివేయమని with తీసుకుపోవాలని, which more closely represents taking the disciples out of the world. It also makes the implied second-person addressee explicit and maintains a natural, parallel Telugu construction. The text retains the personal reading “దుష్టుని,” and the footnote preserves the genuine grammatical ambiguity of τοῦ πονηροῦ.
