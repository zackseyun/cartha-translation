source:
  edition: SBLGNT
  text: καὶ νῦν δόξασόν με σύ, πάτερ, παρὰ σεαυτῷ τῇ δόξῃ ᾗ εἶχον πρὸ τοῦ τὸν κόσμον εἶναι παρὰ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/005.yaml
  text: And now[a], Father[b], glorify me in your presence with the glory that I had with you before the world existed.
translation:
  language: te
  text: ఇప్పుడు, తండ్రీ, నీవు నన్ను నీ సన్నిధిలో[a], లోకం ఉనికిలో ఉండకముందు[b] నీతో నాకు ఉన్న మహిమతో మహిమపరచు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ దగ్గర’ లేదా ‘నీతోనే’; గ్రీకు పదబంధం తండ్రికి సమీపంగా ఉండటాన్ని మరింత అక్షరార్థంగా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘లోకం ఉండకముందు’ లేదా ‘లోకం ఉనికిలోకి రాకముందు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξασόν
  choice: మహిమపరచు
  rationale: ఆజ్ఞార్థక రూపాన్ని నిలుపుతూ, యోహాను రచనల్లో కనిపించే ‘మహిమ’ మరియు పరస్పర మహిమపరచడం అనే ప్రధాన పదజాలాన్ని కాపాడుతుంది.
- source_word: παρὰ σεαυτῷ
  choice: నీ సన్నిధిలో
  rationale: παρά + దత్తివిభక్తి సూచించే సమీపత లేదా సమక్ష భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τῇ δόξῃ
  choice: మహిమతో
  rationale: క్రియతో అనుసంధానమైన దత్తివిభక్తిని సహవాస/సాధన భావంతో వ్యక్తపరుస్తూ, తరువాతి సంబంధవాక్యం నిర్దేశించే మహిమనే సూచిస్తుంది.
- source_word: ᾗ εἶχον
  choice: నాకు ఉన్న
  rationale: అసంపూర్ణ భూతకాల క్రియ యేసుకు పూర్వమే ఆ మహిమ ఉండటాన్ని సూచిస్తుంది; తెలుగు స్వామ్య నిర్మాణం సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: πρὸ τοῦ τὸν κόσμον εἶναι
  choice: లోకం ఉనికిలో ఉండకముందు
  rationale: కర్తతో కూడిన ఆర్టిక్యులర్ ఇన్ఫినిటివ్ వ్యక్తపరచే పూర్వకాల సంబంధాన్ని, εἶναι యొక్క ఉనికి భావాన్ని అతిగా విస్తరించకుండా నిలుపుతుంది.
- source_word: παρὰ σοί
  choice: నీతో
  rationale: తండ్రితో ఉన్న సమీపత మరియు సహవాసాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: σύ, πάτερ
  choice: తండ్రీ … నీవు
  rationale: సంబోధనతో పాటు గ్రీకులోని స్పష్టమైన σύ ఇచ్చే ఉద్ఘాటనను తెలుగులో ‘నీవు’ ద్వారా నిలుపుతుంది.
- source_word: κόσμον
  choice: లోకం
  rationale: యోహాను వాడుకకు సరిపోయే ప్రామాణిక పదం; ‘విశ్వం’ లేదా ‘సృష్టి వ్యవస్థ’ వంటి వివరణాత్మక విస్తరణను నివారిస్తుంది.
theological_decisions:
- issue: కుమారుని పూర్వాస్తిత్వం
  choice: లోకం ఉనికిలో ఉండకముందు యేసుకు తండ్రితో ఉన్న మహిమగా కాలవాక్యాన్ని నేరుగా అనువదించడం.
  alternative: ఈ మాటలను కేవలం ముందుగా నిర్ణయించబడిన మహిమగా వివరణాత్మకంగా మార్చడం.
  rationale: గ్రీకు వాక్యం లోకం ఉనికికి ముందు తండ్రితో యేసుకు మహిమ ఉన్నదని నేరుగా చెబుతుంది; అనువాదం ఈ వాదనను తగ్గించకూడదు, దానికి అదనపు సిద్ధాంత వివరణనూ చేర్చకూడదు.
- issue: తండ్రితో పంచుకున్న ‘మహిమ’ స్వభావం
  choice: ‘మహిమ’ అనే పదాన్నే నిలుపడం.
  alternative: ‘ఘనత’ లేదా ‘గౌరవం’ అని కుదించడం.
  rationale: ఈ వచనం ఆ మహిమను ఇక్కడ మరింత నిర్వచించదు. ‘మహిమ’ యోహాను పదజాలాన్ని, వచనంలోని దైవశాస్త్రీయ ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రార్థనకు తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. గ్రీకులోని ఉద్ఘాటిత ‘నీవు’ నిలుపబడింది; రెండు παρά పదబంధాల భావసామ్యాన్ని ‘నీ సన్నిధిలో’ మరియు ‘నీతో’ ద్వారా సహజంగా వ్యక్తపరిచింది. ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధం వద్ద ఉంచబడింది.
