id: JHN.17.8
reference: John 17:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι τὰ ῥήματα ἃ ⸀ἔδωκάς μοι δέδωκα αὐτοῖς, καὶ αὐτοὶ ἔλαβον καὶ ἔγνωσαν ἀληθῶς ὅτι παρὰ σοῦ ἐξῆλθον, καὶ ἐπίστευσαν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/008.yaml
  text: For the words that you gave me I have given to them[a], and they received them and truly came to know that I came from you[b], and they believed that you sent me.
translation:
  language: te
  text: ఎందుకంటే నీవు నాకు ఇచ్చిన మాటలను నేను వారికి ఇచ్చాను[a]. వారు వాటిని స్వీకరించారు, నేను నీ నుండి వచ్చానని[b] నిజంగానే తెలుసుకున్నారు; నీవే నన్ను పంపావని వారు నమ్మారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీవు నాకు ఇచ్చిన పలుకులను నేను వారికి ఇచ్చాను.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నేను నీ నుండి వెలువడి వచ్చాను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥήματα
  choice: మాటలు
  rationale: బహువచనంలోని పలికిన మాటలు లేదా వాక్కులను సూచించే concrete భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ఏకవచన ‘సందేశం’ కంటే మూలానికి దగ్గరగా ఉంటుంది.
- source_word: ἔδωκάς ... δέδωκα
  choice: నీవు ... ఇచ్చిన ... నేను ... ఇచ్చాను
  rationale: తెలుగులో సహజంగా ఉండే నిర్మాణాన్ని ఉపయోగించింది. సందర్భం రెండవ క్రియలోని పూర్తయిన కార్యం మరియు దాని ప్రస్తుత ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది; కృత్రిమంగా కాలభేదాన్ని బలవంతంగా చూపలేదు.
- source_word: ἔλαβον
  choice: స్వీకరించి
  rationale: ఇవ్వబడిన ప్రకటనను పొందడం/అంగీకరించడం అనే సందర్భానుకూల భావాన్ని ఇస్తుంది; భౌతికంగా ‘తీసుకున్నారు’ అనే భావాన్ని నివారిస్తుంది.
- source_word: ἔγνωσαν ἀληθῶς
  choice: నిజంగా తెలుసుకున్నారు
  rationale: ἀληθῶςను ‘నిజంగా’గా స్పష్టంగా నిలుపుతూ, వారు జ్ఞానానికి లేదా గుర్తింపుకు చేరుకున్న భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: παρὰ σοῦ ἐξῆλθον
  choice: నేను నీ దగ్గర నుండి వచ్చాను
  rationale: παρά + షష్ఠీ విభక్తి సూచించే మూలాన్ని సహజంగా వ్యక్తపరుస్తుంది; మూలపాఠం చెప్పినదానికంటే అధికమైన సిద్ధాంత పదజాలాన్ని చేర్చదు.
- source_word: ἐπίστευσαν
  choice: నమ్మారు
  rationale: తరువాతి ὅτι ఉపవాక్యంలో ఉన్న ప్రతిపాదన నిజమని విశ్వసించడాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: ἀπέστειλας
  choice: పంపావు
  rationale: తండ్రి యేసును పంపిన కార్యాన్ని సరళంగా, తగిన గంభీరతతో వ్యక్తపరుస్తుంది; ‘నియమించావు’ వంటి అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: వచనారంభంలోని వివరణాత్మక/కారణ సంబంధాన్ని మునుపటి సందర్భంతో స్పష్టంగా కలుపుతుంది.
theological_decisions:
- issue: παρὰ σοῦ ἐξῆλθονలో యేసు మరియు తండ్రి మధ్య సంబంధం
  choice: నేను నీ దగ్గర నుండి వచ్చాను
  alternative: నేను నీ నుండి బయలుదేరి వచ్చాను
  rationale: తండ్రి మూలమని వాక్యం చెప్పే బరువును నిలుపుతుంది; అదే సమయంలో తరువాతి సిద్ధాంత పరిభాషతో భావాన్ని ముందుగానే నిర్ణయించదు.
- issue: ὅτι ఉపవాక్యంతో వచ్చిన πιστεύω అనువాదం
  choice: నీవే నన్ను పంపావని వారు నమ్మారు
  alternative: నీవే నన్ను పంపావని వారు విశ్వసించారు
  rationale: ఇక్కడ నమ్మకానికి విషయంగా ఒక ప్రతిపాదన ఉన్నందున ‘నమ్మారు’ సహజంగా వాక్యనిర్మాణాన్ని నిలుపుతుంది; సంబంధపరమైన ‘నిన్ను నమ్ముకున్నారు’ అనే భిన్న భావానికి మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనా సందర్భానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు స్పష్టమైన వాక్యనిర్మాణం. దేవునికి సంబోధనలో ఏకవచన ‘నీవు’ మూలంలోని σύను మరియు యోహాను 17 ప్రార్థనా స్వరాన్ని నిలుపుతుంది.
