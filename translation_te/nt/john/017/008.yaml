    reason: lexical_alternative
  revision_rationale: The revision replaces a potentially spatial expression with a direct expression of origin, aligns the Telugu clause structure more closely with the Greek coordination, and adjusts the second lexical alternative to express ‘came forth’ without adding doctrinal interpretation.
