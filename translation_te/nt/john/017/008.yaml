- from: ఎందుకంటే నీవు నాకు ఇచ్చిన మాటలను నేను వారికి ఇచ్చాను[a]. వారు వాటిని స్వీకరించి, నేను నీ దగ్గర నుండి వచ్చానని[b] నిజంగా తెలుసుకున్నారు; నీవే నన్ను పంపావని వారు నమ్మారు.
  to: ఎందుకంటే నీవు నాకు ఇచ్చిన మాటలను నేను వారికి ఇచ్చాను[a]. వారు వాటిని స్వీకరించారు, నేను నీ నుండి వచ్చానని[b] నిజంగానే తెలుసుకున్నారు; నీవే నన్ను పంపావని వారు నమ్మారు.
