source:
  edition: SBLGNT
  text: ὅτε ἤμην μετ’ ⸀αὐτῶν ἐγὼ ἐτήρουν αὐτοὺς ἐν τῷ ὀνόματί σου ⸀ᾧ δέδωκάς μοι, ⸀καὶ ἐφύλαξα, καὶ οὐδεὶς ἐξ αὐτῶν ἀπώλετο εἰ μὴ ὁ υἱὸς τῆς ἀπωλείας, ἵνα ἡ γραφὴ πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/012.yaml
  text: While I was with them[a], I kept them in your name, which you have given me, and I guarded them, and not one of them perished except the son of destruction[b], so that the Scripture might be fulfilled.
translation:
  language: te
  text: నేను వారితో ఉన్నప్పుడు, నీవు నాకు ఇచ్చిన నీ నామంలో వారిని కాపాడుతూ ఉన్నాను; వారిని భద్రంగా కాచాను. నాశన పుత్రుడు[b] తప్ప వారిలో ఒక్కడూ నశించలేదు[a], లేఖనం నెరవేరునట్లు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారిలో ఒక్కడూ తప్పిపోలేదు.’
    reason: lexical_alternative
  - marker: b
    text: ‘నాశన పుత్రుడు’ అనేది హీబ్రూ శైలిలోని వ్యక్తీకరణ; భావానువాదంగా ‘నాశనానికి చెందినవాడు’ లేదా ‘నాశనానికి గురయ్యేవాడు’ అని కూడా చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἤμην μετ’ αὐτῶν
  choice: నేను వారితో ఉన్నప్పుడు
  rationale: కాలసంబంధ ఉపవాక్యాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, యేసు వారితో ఉన్న కాలవ్యవధిని సూచిస్తుంది.
- source_word: ἐτήρουν αὐτοὺς
  choice: వారిని కాపాడుతూ వచ్చాను
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న చర్యను ‘కాపాడుతూ వచ్చాను’ సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἐν τῷ ὀνόματί σου ᾧ δέδωκάς μοι
  choice: నీవు నాకు ఇచ్చిన నీ నామంలో
  rationale: నపుంసక ఏకవచన సంబంధ సర్వనామం ‘నామం’ను సూచిస్తుందనే గ్రీకు వ్యాకరణాన్ని అనుసరిస్తుంది; దానిని శిష్యులకు వర్తింపజేయదు.
- source_word: καὶ ἐφύλαξα
  choice: వారిని భద్రంగా కాచాను
  rationale: τηρέωతో ఉన్న భావసామ్యాన్ని ఉంచుతూనే, φυλάσσωలోని కాపలా కాయడం/రక్షించడం అనే బలమైన ఛాయను వేరుగా వ్యక్తం చేస్తుంది.
- source_word: οὐδεὶς ἐξ αὐτῶν ἀπώλετο
  choice: వారిలో ఒక్కడూ నశించలేదు
  rationale: ἀπόλλυμι యొక్క గంభీరమైన ‘నశించు’ భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, యోహాను రచనల్లో కనిపించే ‘తప్పిపోవు’ భావాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: నాశన పుత్రుడు
  rationale: సెమిటిక్ శైలిలోని సంబంధాన్ని వ్యాఖ్యానంతో పూర్తిగా విప్పకుండా, సంక్షిప్తంగా మరియు గంభీరంగా నిలుపుతుంది.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: లేఖనం నెరవేరడానికి
  rationale: ἵνα నిర్మాణంలోని ఉద్దేశం/ఫలితం మధ్య ఉన్న భావ ఉద్వేగాన్ని కాపాడుతూ, నిర్దిష్ట లేఖన సాక్ష్యాన్ని సూచించే ఏకవచనాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ᾧ δέδωκάς μοι అనే సంబంధ ఉపవాక్యపు పూర్వపదం
  choice: ‘నీవు నాకు ఇచ్చిన నీ నామం’—ఉపవాక్యం ‘నామం’ను విశేషిస్తుంది.
  alternative: ‘నీవు నాకు ఇచ్చినవారు’—ఉపవాక్యం శిష్యులను సూచిస్తుంది.
  rationale: ఇచ్చిన SBLGNT పాఠ్యంలో సంబంధ సర్వనామం నపుంసక ఏకవచనంలో ఉండి, నపుంసక ఏకవచనమైన ὀνόματιతో సహజంగా సరిపోతుంది; పురుష బహువచనమైన αὐτούςతో కాదు.
- issue: ὁ υἱὸς τῆς ἀπωλείας యొక్క భావం
  choice: సెమిటిక్ రూపాన్ని ‘నాశన పుత్రుడు’గా నిలుపడం.
  alternative: ‘నాశనానికి నియమించబడినవాడు’ లేదా సంప్రదాయ రూపమైన ‘వినాశ పుత్రుడు’.
  rationale: ఈ పదబంధాన్ని ముందే నిర్ణయించబడిన నాశనం గురించిన విస్తృత సిద్ధాంత ప్రకటనగా మార్చకుండా, మూలంలోని రూపకాన్నీ వేదాంత ఉద్వేగాన్నీ కాపాడుతుంది.
- issue: ἵνα ద్వారా వ్యక్తమయ్యే సంబంధం
  choice: ‘లేఖనం నెరవేరడానికి’ అని ఉద్దేశం/ఫలితం రెండింటికీ చోటిచ్చే రూపం.
  alternative: ‘దీనివల్ల లేఖనం నెరవేరింది’ అని కేవలం ఫలితంగా విప్పడం.
  rationale: గ్రీకు ἵνα ఉపవాక్యాన్ని కేవలం కారణ-ఫలిత వివరణగా కుదించకుండా దాని వేదాంతపరమైన ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రార్థనా శైలిని వాడింది. ‘నామంలో’ అనే మూల రూపాన్ని వ్యాఖ్యానాత్మకంగా ‘అధికారంతో’ అని విస్తరించలేదు. τηρέω, φυλάσσω మధ్య పదభేదాన్ని ‘కాపాడుతూ వచ్చాను’, ‘భద్రంగా కాచాను’ ద్వారా సాధ్యమైనంతవరకు నిలిపింది. పాదసూచిక [a] దాని సంబంధిత ‘నశించలేదు’ పదబంధం వద్ద ఉంచబడింది.
