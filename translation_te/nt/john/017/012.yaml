    issue: ‘లేఖనం నెరవేరడానికి ఇలా జరిగింది’ adds ‘ఇలా జరిగింది.’
    rationale: The Greek reads ἵνα ἡ γραφὴ πληρωθῇ, literally expressing ‘so that/in order that the Scripture might be fulfilled.’ The added independent result assertion narrows the construction and is not represented by a source expression.
  - severity: low
    issue: ‘కాపాడుతూ వచ్చాను’ may imply a continuing action up to the present rather than the imperfect action during Jesus’ time with the disciples.
    rationale: ‘కాపాడుతూ ఉన్నాను’ more directly preserves the temporal frame introduced by ‘నేను వారితో ఉన్నప్పుడు’ and the ongoing force of ἐτήρουν.
