revisions:
- from: “లోకం నుండి నీవు నాకు ఇచ్చిన మనుషులకు[c][d] నీ నామాన్ని[a][b] తెలియజేశాను. వారు నీవారు; నీవు వారిని నాకు ఇచ్చావు. వారు నీ వాక్యాన్ని పాటించారు.[e]”
  to: “లోకంలో నుండి నీవు నాకు ఇచ్చిన మనుషులకు[c][d] నీ నామాన్ని[a][b] తెలియజేశాను. వారు నీవారు; నీవు వారిని నాకు ఇచ్చావు. వారు నీ వాక్యాన్ని పాటించి ఉన్నారు.[e]”
  rationale: The revision makes the “out of the world” nuance explicit and reflects the perfect aspect of τετήρηκαν, while preserving the draft’s natural modern Telugu, its generic rendering of ἄνθρωποι, and its non-sectarian handling of divine giving.
