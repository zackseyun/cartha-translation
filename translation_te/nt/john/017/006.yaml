source:
  edition: SBLGNT
  text: Ἐφανέρωσά σου τὸ ὄνομα τοῖς ἀνθρώποις οὓς ⸀ἔδωκάς μοι ἐκ τοῦ κόσμου. σοὶ ἦσαν κἀμοὶ αὐτοὺς ⸁ἔδωκας, καὶ τὸν λόγον σου τετήρηκαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/006.yaml
  text: I have made your name known to the men whom you gave me out of the world. They were yours, and you gave them to me, and they have kept your word.
translation:
  language: te
  text: “లోకంలో నుండి నీవు నాకు ఇచ్చిన మనుషులకు[c][d] నీ నామాన్ని[a][b] తెలియజేశాను. వారు నీవారు; నీవు వారిని నాకు ఇచ్చావు. వారు నీ వాక్యాన్ని పాటించి ఉన్నారు.[e]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ నామాన్ని వెల్లడించాను.”
    reason: lexical_alternative
  - marker: b
    text: “నీ నామం” అనేది కేవలం పలికే పేరును మాత్రమే కాక, దేవుడు వెల్లడించిన తన వ్యక్తిత్వాన్ని, స్వభావాన్ని కూడా సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: “మనుషులు” అనే గ్రీకు పదాన్ని “ప్రజలు” అని కూడా అనువదించవచ్చు; ఈ సందర్భంలో యేసు శిష్యులే తక్షణంగా ఉద్దేశించబడ్డారు.
    reason: lexical_alternative
  - marker: d
    text: లేదా, “లోకం నుండి.”
    reason: lexical_alternative
  - marker: e
    text: లేదా, “వారు నీ వాక్యాన్ని కాపాడారు.” గ్రీకు క్రియ పూర్తైన చర్యకు కొనసాగుతున్న ఫలితం ఉన్నట్లు సూచిస్తుంది; దీనిలో పాటించడం, కట్టుబడి ఉండడం, కాపాడడం అనే భావాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφανέρωσά
  choice: తెలియజేశాను
  rationale: φανερόω అంటే ప్రత్యక్షపరచడం లేదా తెలిసేలా చేయడం. ‘తెలియజేశాను’ అనే సహజమైన ఆధునిక తెలుగు పదం, ‘నీ నామం’ అనే కర్మతో కలిసి ప్రకటన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὸ ὄνομα
  choice: నీ నామాన్ని
  rationale: యోహాను రచనలో ‘నామం’ దేవుని వెల్లడైన వ్యక్తిత్వం, స్వభావం, సన్నిధిని సూచించగలదు. అయినా మూలపాఠంలోని స్పష్టమైన రూపకాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా ‘నామం’గానే ఉంచాం.
- source_word: τοῖς ἀνθρώποις
  choice: మనుషులకు
  rationale: ἄνθρωποι అనే పదం సాధారణంగా మనుషులు లేదా ప్రజలు అని అర్థమవుతుంది; ఇక్కడ తక్షణ సందర్భంలో యేసు శిష్యులే ఉద్దేశించబడ్డారు. ‘మనుషులకు’ మూలపదపు విస్తృత అర్థాన్ని కాపాడుతూ తెలుగులో సహజంగా ఉంది.
- source_word: οὓς ἔδωκάς μοι
  choice: నీవు నాకు ఇచ్చిన
  rationale: సంబంధ వాక్యంలోని అఒరిస్ట్ క్రియను తెలుగులో సహజమైన భూతకాల రూపంతో నేరుగా అనువదిస్తుంది.
- source_word: ἐκ τοῦ κόσμου
  choice: లోకం నుండి
  rationale: ἐκ ఎంపిక లేదా వేరుచేయడం జరిగిన పరిధిని సూచిస్తుంది. ‘లోకం నుండి’ ఆ భావాన్ని సంక్షిప్తంగా, సహజంగా కాపాడుతుంది.
- source_word: σοὶ ἦσαν
  choice: వారు నీవారు
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్తమైన స్వామ్య భావాన్ని ‘వారు నీవారు’ నేరుగా ప్రతిబింబిస్తుంది.
- source_word: κἀμοὶ αὐτοὺς ἔδωκας
  choice: నీవు వారిని నాకు ఇచ్చావు
  rationale: κἀμοίలోని ‘నాకూ/నాకు’ భావాన్ని సహజ తెలుగు పదక్రమంలో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τὸν λόγον σου
  choice: నీ వాక్యాన్ని
  rationale: λόγοςకు మాట, సందేశం, బోధ అనే అర్థాలు ఉన్నా, ‘వాక్యం’ మూలపదంతో సన్నిహితంగా ఉండి యోహాను రచనలోని పదసంబంధాన్ని నిలుపుతుంది.
- source_word: τετήρηκαν
  choice: పాటించారు
  rationale: τηρέω ఇక్కడ దేవుని వాక్యాన్ని ఆచరించడం, దానికి కట్టుబడి ఉండడం అనే భావాన్ని ఇస్తుంది. ‘పాటించారు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; గ్రీకు పరిపూర్ణకాలంలోని కొనసాగుతున్న ఫలితాన్ని సందర్భం మోస్తుంది.
theological_decisions:
- issue: యోహాను రచనలో ‘నీ నామం’ అనే మాట అర్థం
  choice: ప్రధాన పాఠంలో ‘నీ నామాన్ని’ అని యథాతథంగా ఉంచడం
  alternative: ‘నీవెవరో’ లేదా ‘నీ స్వభావాన్ని’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: ఈ మాట తండ్రి వెల్లడైన వ్యక్తిత్వాన్ని, స్వభావాన్ని సూచించినప్పటికీ, మూలపాఠం ‘నామం’ అనే సాంద్రమైన బైబిలు రూపకాన్నే వాడుతుంది. దానిని నిలుపుకోవడం వచనంలోని వేదాంత లోతును కాపాడుతుంది.
- issue: τοῖς ἀνθρώποις పదంలోని లింగం మరియు సందర్భోచిత సూచన
  choice: ‘మనుషులకు’ అని అనువదించి, తక్షణ సందర్భంలోని పురుష శిష్యుల సూచనను పాదసూచికలో తెలియజేయడం
  alternative: ‘పురుషులకు’ లేదా ‘ప్రజలకు’ అని అనువదించడం
  rationale: గ్రీకు పదం స్వతహాగా సాధారణార్థకంగా ఉండగలదు; సందర్భంలో యేసు శిష్యుల సమూహం ఉద్దేశించబడింది. తెలుగు ‘మనుషులు’ మూలంలోని సాధారణ పదాన్ని సహజంగా కాపాడి, అవసరానికి మించిన లింగ నిర్ధారణను ప్రధాన పాఠంలో ప్రవేశపెట్టదు.
- issue: తండ్రి మనుషులను కుమారునికి ఇవ్వడంలోని ఎన్నిక మరియు శిష్యత్వ భావం
  choice: తండ్రి వారిని కుమారునికి ఇచ్చాడనే మాటను ఎలాంటి సిద్ధాంతపరమైన వివరణను జోడించకుండా నిలుపుకోవడం
  alternative: దీనిని ఏదైనా ప్రత్యేక ఎన్నిక సిద్ధాంతం లేదా ముందుగా తెలిసిన మానవ స్పందనగా విపులీకరించడం
  rationale: వచనం తండ్రి వారిని కుమారునికి ఇచ్చాడని స్పష్టంగా చెబుతుంది, కాని ఆ ఇవ్వడపు పూర్తి విధానాన్ని వివరించదు. అందువల్ల తరువాతి మతశాఖాపరమైన వివాదాన్ని అనువాదంలో పరిష్కరించలేదు.
- issue: τετήρηκανలోని ‘కాపాడటం/పాటించడం’ భావం
  choice: ప్రధాన పాఠంలో ‘పాటించారు’ అని అనువదించడం
  alternative: ‘కాపాడారు’ లేదా మరింత పాత శైలిలో ‘గైకొనియున్నారు’ అని అనువదించడం
  rationale: ఇక్కడ వాక్యాన్ని భద్రపరచడం కన్నా దానికి కట్టుబడి ఆచరించడం ప్రధాన సందర్భోచిత భావం. ‘పాటించారు’ సాధారణ ఆధునిక పాఠకునికి స్పష్టంగా ఉంది; పదశః ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవభరితమైన ప్రార్థనా శైలిని అనుసరించాం. దేవునికి సంబోధనగా ఏకవచన ‘నీవు/నీ’ రూపాలను వాడాం. ‘నామం,’ ‘వాక్యం,’ ‘లోకం’ వంటి యోహాను రచనలో ప్రాధాన్యమున్న పదాలను నిలిపి, అసహజమైన ప్రాచీన క్రియారూపాలను నివారించాం.
