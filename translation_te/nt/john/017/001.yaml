id: JHN.17.1
reference: John 17:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ⸂ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τὸν οὐρανὸν εἶπεν⸃· Πάτερ, ἐλήλυθεν ἡ ὥρα· δόξασόν σου τὸν υἱόν, ⸀ἵνα ὁ ⸀υἱὸς δοξάσῃ σέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/001.yaml
  text: 'Jesus said these things, and lifting up his eyes to heaven, he said: “Father, the hour has come. Glorify your Son, so that the Son may glorify you,”'
translation:
  language: te
  text: 'యేసు ఈ మాటలు చెప్పి, తన కళ్లను ఆకాశం వైపు ఎత్తి, ఇలా అన్నాడు: “తండ్రీ, ఆ ఘడియ వచ్చింది. నీ కుమారుణ్ణి మహిమపరచు, కుమారుడు నిన్ను మహిమపరచునట్లు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα
  choice: ఈ మాటలు
  rationale: నపుంసకలింగ బహువచన సూచన సర్వనామం ముందటి ఉపదేశాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఈ మాటలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ἐλάλησεν
  choice: చెప్పి
  rationale: λαλέω అర్థం ‘మాట్లాడు’ అయినా, ముందున్న విషయాలను ప్రస్తావించి తరువాత చర్యకు వెళ్లే ఈ నిర్మాణంలో ‘చెప్పి’ సహజమైన తెలుగు అనుసంధానం.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: తన కళ్లను ... ఎత్తి
  rationale: ἐπαίρω భూతకాల అసమాపక క్రియ సూచించే శారీరక భంగిమను నిలుపుతూ, తెలుగు వాక్యక్రమానికి అనుగుణంగా అనుసంధాన క్రియగా ఇచ్చాం.
- source_word: εἰς τὸν οὐρανόν
  choice: ఆకాశం వైపు
  rationale: εἰς ఇక్కడ దిశను సూచిస్తుంది; ‘వైపు’ ఆ పైదిశను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Πάτερ
  choice: తండ్రీ
  rationale: సంబోధన రూపాన్ని ‘తండ్రీ’గా ఇచ్చాం; గ్రీకులో లేని ‘నా’ అనే పదాన్ని చేర్చలేదు.
- source_word: ἐλήλυθεν ἡ ὥρα
  choice: ఆ ఘడియ వచ్చింది
  rationale: పరిపూర్ణ కాలం నిర్ణీత ఘడియ వచ్చి ఉన్నదనే భావాన్ని తెలియజేస్తుంది; ‘ఘడియ’ యోహాను సువార్తలోని ఇతివృత్త సంబంధాన్ని కాపాడుతుంది.
- source_word: δόξασόν
  choice: మహిమపరచు
  rationale: δοξάζωలో గౌరవం, మహిమ వెల్లడికావడం అనే విస్తృత భావాలు ఉన్నాయి; ‘మహిమపరచు’ ఆ యోహానీయ ధార్మిక బరువును నిలుపుతుంది.
- source_word: σου τὸν υἱόν
  choice: నీ కుమారుణ్ణి
  rationale: సంబంధబోధక సర్వనామాన్ని సహజమైన స్వామ్య నిర్మాణంగా ఇచ్చాం.
- source_word: ἵνα
  choice: అప్పుడు
  rationale: ἵνα ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది. తెలుగులో ‘అప్పుడు’ ముందటి ప్రార్థనకు అనుసరించే ఉద్దేశ్య-ఫలిత సంబంధాన్ని సహజంగా తెలియజేస్తుంది; దీనిని కేవలం కాలసూచనగా పరిమితం చేయరాదు.
- source_word: ὁ υἱὸς
  choice: కుమారుడు
  rationale: ముందటి ‘నీ కుమారుణ్ణి’ నుండి ఇప్పుడు కర్తగా ఉన్న కుమారునికి గ్రీకు చేసే మార్పును పునరావృత నామవాచకంతో నిలిపాం.
- source_word: δοξάσῃ σέ
  choice: నిన్ను మహిమపరుస్తాడు
  rationale: ἵνα తరువాతి భూతకాల సంభావనార్థక క్రియ ఉద్దేశ్యాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగులో ఈ సందర్భంలో సాధారణ భవిష్యత్ రూపం సహజంగా ఆ ఉద్దేశ్య ఫలితాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: తండ్రి, కుమారుల పరస్పర మహిమపరచడం
  choice: “నీ కుమారుణ్ణి మహిమపరచు; అప్పుడు కుమారుడు నిన్ను మహిమపరుస్తాడు” అని వ్యాఖ్యాన విస్తరణ లేకుండా నిలిపాం.
  alternative: “నీ కుమారునికి మహిమను అనుగ్రహించు, తద్వారా ఆయన నీకు మహిమ తెస్తాడు”
  rationale: గ్రీకు వాక్యంలోని ఒకే δοξάζω మూలపద పునరావృతం, పరస్పర సంబంధం నిలుస్తాయి; తరువాతి సిద్ధాంత వివరణలను వాక్యంలోకి చేర్చలేదు.
- issue: υἱόςను సందర్భంలో గుర్తించడం
  choice: ‘నీ కుమారుడు’ మరియు ‘కుమారుడు’ అని అనువదించాం.
  alternative: ‘నీ కుమారుడు’ మరియు ‘ఆయన’
  rationale: రెండవ ప్రస్తావనలోనూ ‘కుమారుడు’ అనే నామాన్ని ఉంచడం ద్వారా గ్రీకు పునరుక్తి, తండ్రి–కుమారుల సంబంధ నిర్మాణం స్పష్టంగా ఉంటాయి; తెలుగు లిపిలో పెద్ద అక్షర భేదం లేకపోవడం వల్ల సందర్భమే బిరుదాత్మక సూచనను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఆ ఘడియ’ యోహాను సువార్తలోని నిర్ణీత సమయ ఇతివృత్తాన్ని నిలుపుతుంది. మూలంలో పాఠాంతర సూచకాలు ఉన్నప్పటికీ, అందించిన వచన అర్థాన్ని ప్రభావితం చేసే అవసరమైన పాదటిప్పణి ఇక్కడ లేదు.
