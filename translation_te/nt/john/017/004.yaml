id: JHN.17.4
reference: John 17:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγώ σε ἐδόξασα ἐπὶ τῆς γῆς, τὸ ἔργον ⸀τελειώσας ὃ δέδωκάς μοι ἵνα ποιήσω·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/004.yaml
  text: I glorified you on the earth by completing the work that you have given me to do[a].
translation:
  language: te
  text: నీవు నాకు చేయడానికి ఇచ్చిన పనిని పూర్తి చేయడం ద్వారా భూమిపై నిన్ను మహిమపరిచాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు నాకు చేయడానికి ఇచ్చిన పనిని పూర్తి చేసి, భూమిపై నిన్ను మహిమపరిచాను.”
    reason: τελειώσας అనే కృదంతాన్ని సాధనార్థంగా కాక కాలార్థకంగా లేదా అనుబంధ పరిస్థితిగా అనువదించే అవకాశాన్ని చూపుతుంది.
lexical_decisions:
- source_word: ἐδόξασα
  choice: మహిమపరిచాను
  rationale: యోహాను సువార్తలో δοξάζω దేవుని మహిమను వెల్లడించడం లేదా ఆయనకు మహిమ కలిగించడం అనే గంభీరమైన భావాన్ని కలిగి ఉంది; ‘మహిమపరిచాను’ దానిని సహజంగా కాపాడుతుంది.
- source_word: ἐπὶ τῆς γῆς
  choice: భూమిపై
  rationale: ἐπί + షష్ఠీ విభక్తి తెలిపే స్థలార్థాన్ని ఆధునిక తెలుగులో సహజంగా, నేరుగా వ్యక్తం చేస్తుంది.
- source_word: τελειώσας
  choice: పూర్తి చేయడం ద్వారా
  rationale: ఈ భూతకాల కృదంతం ప్రధాన క్రియకు సాధనార్థక సంబంధాన్ని సూచిస్తుందని గ్రహించి, తండ్రిని ఎలా మహిమపరిచాడో స్పష్టంగా తెలిపే సహజ తెలుగు రూపాన్ని ఎంచుకున్నాం.
- source_word: τὸ ἔργον
  choice: పనిని
  rationale: ἔργον ఇక్కడ తండ్రి యేసుకు అప్పగించిన కార్యాన్ని సూచిస్తుంది; ‘పని’ సాధారణ పాఠకులకు స్పష్టమైన, విస్తృతార్థక పదం.
- source_word: δέδωκάς μοι
  choice: నాకు ... ఇచ్చిన
  rationale: గ్రీకు పరిపూర్ణ కాలం గతంలో ఇచ్చి, ఇప్పటికీ ప్రాముఖ్యత కలిగిన కార్యాన్ని సూచిస్తుంది; తెలుగు సంబంధవాచక నిర్మాణంలో ‘ఇచ్చిన’ సహజంగా ఆ భావాన్ని మోస్తుంది.
- source_word: ἵνα ποιήσω
  choice: చేయడానికి
  rationale: ఇచ్చిన పనికి ఉద్దేశాన్ని తెలిపే ἵνα + విధ్యర్థక క్రియను సంక్షిప్తమైన, సహజ తెలుగు ప్రయోజనార్థక రూపంతో వ్యక్తం చేస్తుంది.
- source_word: ἐγώ σε
  choice: నిన్ను ... మహిమపరిచాను
  rationale: తెలుగులో కర్త క్రియారూపంలో అంతర్భూతంగా ఉంటుంది. ప్రత్యేకంగా ‘నేను’ చేర్చకపోయినా మొదటి పురుష ఏకవచన క్రియ కర్తను స్పష్టంగా తెలియజేస్తుంది; గ్రీకులోని స్వల్ప ఉద్ఘాటనను అతిగా అనువదించదు.
theological_decisions:
- issue: తండ్రిని మహిమపరచడానికి τελειώσας అనే కృదంతానికి ఉన్న సంబంధం
  choice: అప్పగించిన పనిని పూర్తి చేయడం తండ్రిని మహిమపరిచిన విధానం లేదా సాధనంగా అనువదించబడింది.
  alternative: ‘నీవు నాకు చేయడానికి ఇచ్చిన పనిని పూర్తి చేసి, భూమిపై నిన్ను మహిమపరిచాను’—ఇది కాలసంబంధం లేదా అనుబంధ పరిస్థితిగా కూడా అర్థమవవచ్చు.
  rationale: వాక్యనిర్మాణం కృదంతాన్ని ప్రధాన క్రియతో సహజంగా అనుసంధానించి, యేసు తండ్రిని ఎలా మహిమపరిచాడో వివరిస్తుంది. అయినా గ్రీకు కృదంతంలో సాధనార్థం, కాలార్థం లేదా అనుబంధ పరిస్థితి మధ్య ఉన్న కొంత అస్పష్టతను పాదసూచికలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘మహిమపరిచాను’ అనే యోహానీయ ధార్మిక పదాన్ని నిలిపి, మిగతా వాక్యాన్ని సహజ తెలుగు క్రమంలో అమర్చాం.
