  terminology: ‘మహిమపరిచాను’ suitably retains Johannine glory language, and ‘పని’ is an accessible, contextually appropriate equivalent for ἔργον. The respectful second-person forms are consistent and natural. The footnote marker is correctly anchored after the sentence and corresponds to the single supplied footnote.
