- from: వారి గురించి నేను అడుగుతున్నాను.[a] లోకం గురించి నేను అడగడం లేదు; నీవు నాకు ఇచ్చినవారి గురించి అడుగుతున్నాను. ఎందుకంటే వారు నీవారు.[b]
  to: వారి గురించి నేను అడుగుతున్నాను.[a][b] లోకం గురించి నేను అడగడం లేదు; కాని నీవు నాకు ఇచ్చినవారి గురించి అడుగుతున్నాను, ఎందుకంటే వారు నీ వారే.
