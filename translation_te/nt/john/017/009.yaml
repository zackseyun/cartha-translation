id: JHN.17.9
reference: John 17:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ περὶ αὐτῶν ἐρωτῶ· οὐ περὶ τοῦ κόσμου ἐρωτῶ ἀλλὰ περὶ ὧν δέδωκάς μοι, ὅτι σοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/009.yaml
  text: I am asking on their behalf[a]. I am not asking on behalf of the world, but on behalf of those whom you have given me[b], because they are yours.
translation:
  language: te
  text: వారి గురించి నేను అడుగుతున్నాను.[a][b] లోకం గురించి నేను అడగడం లేదు; కాని నీవు నాకు ఇచ్చినవారి గురించి అడుగుతున్నాను, ఎందుకంటే వారు నీ వారే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి కొరకు నేను అడుగుతున్నాను.” ఈ సందర్భంలో గ్రీకు విభక్తి ప్రయోగం ‘వారి గురించి’ లేదా ‘వారి కొరకు’ అనే రెండు భావాలనూ ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: “అడుగుతున్నాను” అని అనువదించిన గ్రీకు క్రియను ఈ ప్రార్థనా సందర్భంలో “విన్నవిస్తున్నాను” లేదా “ప్రార్థిస్తున్నాను” అని కూడా వ్యక్తపరచవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: అడుగుతున్నాను
  rationale: మూల క్రియకు ప్రాథమికంగా ‘అడుగు/విన్నవించు’ అనే అర్థం ఉంది. తండ్రిని ఉద్దేశించిన ప్రార్థనా సందర్భాన్ని పాఠకుడు గ్రహించగలిగేలా ఉంచుతూ, మూలంలో లేని మరింత నిర్దిష్టమైన మతపరమైన పదాన్ని చేర్చకుండా వర్తమాన క్రియగా అనువదించబడింది.
- source_word: περὶ αὐτῶν
  choice: వారి గురించి
  rationale: περί + షష్ఠీ విభక్తి ‘గురించి’ లేదా ఈ ప్రార్థనా సందర్భంలో ‘కొరకు’ అనే భావాన్ని ఇవ్వగలదు. ‘గురించి’ మూల నిర్మాణాన్ని, వాక్యమంతటా ఉన్న పునరుక్త సమాంతరతను కాపాడుతుంది; ప్రత్యామ్నాయ భావం పాదసూచికలో ఇవ్వబడింది.
- source_word: κόσμου
  choice: లోకం
  rationale: యోహాను రచనలలోని κόσμος పదానికి సాధారణమైన, విస్తృతమైన సమానార్థకం. ఇక్కడ దాని పరిధిని ‘మానవాళి’ లేదా ‘అవిశ్వాస వ్యవస్థ’గా సంకుచితం చేయకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
- source_word: ὧν δέδωκάς μοι
  choice: నీవు నాకు ఇచ్చినవారు
  rationale: సాపేక్ష సర్వనామం ఇక్కడ వ్యక్తుల సమూహాన్ని సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ‘నీవు నాకు ఇచ్చినవారు’ అని చెప్పడం ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: δέδωκάς
  choice: ఇచ్చిన
  rationale: గ్రీకు సంపూర్ణకాలం గతంలో జరిగిన ఇచ్చుటకు ప్రస్తుతం కొనసాగుతున్న ఫలితముందని సూచిస్తుంది. తెలుగు విశేషణ క్రియారూపం సందర్భంలో ఆ పూర్తయిన చర్యను సహజంగా వ్యక్తపరుస్తుంది; కొనసాగుతున్న సంబంధం తరువాతి ‘వారు నీవారు’లో స్పష్టమవుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: యేసు వారి గురించి అడగడానికి కారణాన్ని పరిచయం చేసే కారణార్థక సంబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: σοί εἰσιν
  choice: వారు నీవారు
  rationale: దత్తి సర్వనామంతో εἰμί తెలిపే స్వామ్య/సంబంధ భావాన్ని సంక్షిప్తంగా, ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: ἐγὼ
  choice: నేను
  rationale: మూలంలోని స్పష్టమైన, ప్రాధాన్యమున్న కర్తను నిలుపుతూ ‘నేను అడుగుతున్నాను’ అనే వ్యత్యాస నిర్మాణాన్ని కాపాడుతుంది.
- source_word: ἀλλὰ
  choice: కాని అనే వ్యత్యాసాన్ని తెలుగులో సెమికోలన్ తరువాత సానుకూల విరుద్ధ వాక్యంతో వ్యక్తపరచడం
  rationale: ‘లోకం గురించి కాదు’ అనే నిరాకరణకు ‘నీవు ఇచ్చినవారి గురించి’ అనే బలమైన వ్యత్యాసం ఉంది. తెలుగులో పునరుక్త క్రియతో కూడిన విరుద్ధ నిర్మాణం దీనిని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ἐρωτῶను స్పష్టమైన ప్రార్థనా పదంతో అనువదించాలా
  choice: ‘ప్రార్థిస్తున్నాను’ కాకుండా ‘అడుగుతున్నాను’
  alternative: వారి కొరకు ప్రార్థిస్తున్నాను / వారి కొరకు విన్నవిస్తున్నాను
  rationale: సందర్భం తండ్రికి చేయబడుతున్న ప్రార్థనే అయినప్పటికీ, మూల క్రియ సాధారణంగా ‘అడుగు/విన్నవించు’ అని అర్థమిస్తుంది. ‘అడుగుతున్నాను’ పదస్పష్టతను కాపాడి, మూలం కంటే అధికంగా మతపరమైన పదప్రయోగాన్ని చేర్చదు.
- issue: ‘లోకం’ అనే పదం యొక్క పరిధి
  choice: వివరణాత్మకంగా సంకుచితం చేయకుండా ‘లోకం’గానే ఉంచడం
  alternative: సాధారణ మానవాళి / అవిశ్వాస లోకవ్యవస్థ
  rationale: యోహాను వాడుకలో κόσμοςకు సందర్భానుసారం అనేక ఛాయలు ఉన్నాయి. ఈ వాక్యంలోని వ్యత్యాసాన్ని ఒక ప్రత్యేక సిద్ధాంత వ్యాఖ్యానంగా పరిష్కరించకుండా యథాతథంగా నిలుపుతుంది.
- issue: περὶ యొక్క మధ్యవర్తిత్వ భావం
  choice: ప్రధాన పాఠంలో ‘గురించి’; పాదసూచికలో ‘కొరకు’
  alternative: వారి కొరకు నేను అడుగుతున్నాను
  rationale: ఈ ప్రార్థనా సందర్భంలో ‘కొరకు’ సముచితమైన భావమే అయినా, ‘గురించి’ మూల విభక్తి నిర్మాణాన్ని, మూడు సార్లు వచ్చే సమాంతరతను బాగా నిలుపుతుంది. నిజమైన అర్థసంభావ్యతను పాదసూచిక వెల్లడిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘వారు నీవారు’ అనే సంక్షిప్త నిర్మాణం మూలంలోని సంబంధాత్మక స్వామ్యభావాన్ని నిలుపుతుంది. ప్రధాన పాఠంలో ‘గురించి’ అనే పునరుక్తి గ్రీకు వాక్యంలోని సమాంతర వ్యత్యాసాన్ని ఉద్దేశపూర్వకంగా ప్రతిబింబిస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
