review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the principal clauses, the SBLGNT construal in which the relative pronoun refers to ‘name,’ and the comparison of unity. However, it introduces an adversative ‘కాని’ where Greek has a simple connective καί, and it repeats ‘కాపాడు’ at the purpose clause although τήρησον occurs only once.
  naturalness: The register is respectful, clear modern standard Telugu. ‘నీ వద్దకు వస్తున్నాను’ is slightly more natural and suitably elevated than ‘నీ దగ్గరికి వస్తున్నాను’ in this prayer. Restructuring the final purpose clause avoids an unnecessary repetition while retaining fluent Telugu.
  terminology: ‘లోకం,’ ‘పరిశుద్ధ తండ్రీ,’ ‘నామం,’ ‘కాపాడు,’ and ‘ఒక్కటిగా’ are appropriate. ‘నీ నామంలో’ retains the source phrase’s useful semantic breadth without doctrinal expansion.
  issues:
  - severity: medium
    issue: An adversative connective is added.
    rationale: The draft has ‘కాని వారు లోకంలో ఉన్నారు,’ but the source reads καὶ αὐτοὶ ἐν τῷ κόσμῳ εἰσίν (‘and they are in the world’), with no explicit adversative. Telugu can express the contextual contrast without adding ‘కాని.’
  - severity: medium
    issue: The imperative ‘కాపాడు’ is repeated in the purpose clause.
    rationale: The Greek has one imperative, τήρησον, followed by ἵνα (‘so that’). Repeating ‘కాపాడు’ can make the final clause sound like a second imperative rather than the purpose of the first. ‘వారు ... ఉండునట్లు’ preserves the syntactic relation.
  revised_text: నేను ఇక లోకంలో లేను; వారైతే లోకంలో ఉన్నారు, నేను నీ వద్దకు వస్తున్నాను. పరిశుద్ధ తండ్రీ, నీవు నాకు ఇచ్చిన నీ నామంలో[a][b] వారిని కాపాడు; మనం ఒక్కటిగా ఉన్నట్లే వారూ ఒక్కటిగా ఉండునట్లు.
