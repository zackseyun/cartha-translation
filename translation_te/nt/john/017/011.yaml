id: JHN.17.11
reference: John 17:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐκέτι εἰμὶ ἐν τῷ κόσμῳ, καὶ ⸀αὐτοὶ ἐν τῷ κόσμῳ εἰσίν, κἀγὼ πρὸς σὲ ἔρχομαι. πάτερ ἅγιε, τήρησον αὐτοὺς ἐν τῷ ὀνόματί σου ᾧ δέδωκάς μοι, ἵνα ὦσιν ἓν ⸀καθὼς ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/011.yaml
  text: And I am no longer in the world[a], but they are in the world, and I am coming to you. Holy Father, keep them in your name, which you have given to me, so that they may be one[b], just as we are.
translation:
  language: te
  text: నేను ఇక లోకంలో లేను; వారైతే లోకంలో ఉన్నారు, నేను నీ వద్దకు వస్తున్నాను. పరిశుద్ధ తండ్రీ, నీవు నాకు ఇచ్చిన నీ నామంలో[a][b] వారిని కాపాడు; మనం ఒక్కటిగా ఉన్నట్లే వారూ ఒక్కటిగా ఉండునట్లు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీ నామం ద్వారా వారిని కాపాడు’ లేదా ‘నీ నామపు అధికారంతో వారిని కాపాడు’ అని కూడా అర్థం కావచ్చు. గ్రీకు పదబంధం పరిధి, సాధనం లేదా అధికారాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రాచీన ప్రతుల పాఠాన్ని ‘నీవు నాకు ఇచ్చిన వారిని నీ నామంలో కాపాడు’ అని అర్థం చేసుకోవచ్చు. ఇక్కడ అనుసరించిన SBLGNT పాఠంలో ‘నీవు నాకు ఇచ్చిన’ అనేది ‘నామం’ను సూచిస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: οὐκέτι εἰμὶ ἐν τῷ κόσμῳ
  choice: నేను ఇక లోకంలో లేను
  rationale: οὐκέτι యొక్క కాలపరమైన ‘ఇక ... లేదు’ భావాన్ని, అలాగే εἰμί యొక్క వర్తమాన రూపాన్ని నిలుపుతుంది; యోహాను వాడుకలో κόσμοςకు స్థిరమైన ‘లోకం’ పదాన్ని ఉపయోగిస్తుంది.
- source_word: κἀγὼ πρὸς σὲ ἔρχομαι
  choice: నేను నీ దగ్గరికి వస్తున్నాను
  rationale: ἔρχομαιలోని ‘వస్తున్నాను’ అనే దృక్కోణాన్ని, సందర్భంలోని సమీప భవిష్యత్ భావాన్ని సహజమైన తెలుగులో ఉంచుతుంది.
- source_word: πάτερ ἅγιε
  choice: పరిశుద్ధ తండ్రీ
  rationale: తండ్రి అనే సన్నిహిత సంబోధనను, ἅγιε తెలిపే పరిశుద్ధతను రెండింటినీ గౌరవప్రదంగా నిలుపుతుంది.
- source_word: τήρησον
  choice: కాపాడు
  rationale: τηρέωలోని కాపాడటం, భద్రపరచటం, నిలిపి ఉంచటం అనే విస్తృత భావాన్ని సాధారణ ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐν τῷ ὀνόματί σου
  choice: నీ నామంలో
  rationale: ἐνను ‘లో’ అని ఉంచడం ద్వారా పరిధి, సాధనం, అధికారం అనే సాధ్యమైన భావాలలో ఒక్కదానికే పరిమితం చేయకుండా మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
- source_word: ᾧ δέδωκάς μοι
  choice: నీవు నాకు ఇచ్చిన నీ నామం
  rationale: SBLGNT పాఠంలో ᾧ అనేది ὀνόματιతో ఏకీభవిస్తుంది; అందువల్ల తండ్రి కుమారునికి ఇచ్చింది ‘నామం’ అని స్పష్టంగా, కానీ వివరణాత్మక విస్తరణ లేకుండా అనువదించబడింది.
- source_word: ἵνα ὦσιν ἓν
  choice: వారూ ఒక్కటిగా ఉండేలా
  rationale: ἵνα యొక్క ఉద్దేశ భావాన్ని ‘ఉండేలా’ తెలియజేస్తుంది; నపుంసక ఏకవచనమైన ἓνను వ్యక్తుల సంఖ్యగా కాక ఐక్యతగా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: καθὼς ἡμεῖς
  choice: మనం ఒక్కటిగా ఉన్నట్లే
  rationale: καθώςలోని పోలికను నిలుపుతూ, తండ్రి-కుమారుల ఐక్యత స్వభావాన్ని అనువాదంలో మరింత నిర్వచించదు.
theological_decisions:
- issue: ‘నీ నామంలో వారిని కాపాడు’ అనే పదబంధం యొక్క భావం
  choice: ముఖ్య పాఠంలో ‘నీ నామంలో’ అని అనువదించబడింది.
  alternative: ‘నీ నామం ద్వారా వారిని కాపాడు’ లేదా ‘నీ నామపు అధికారంతో వారిని కాపాడు’
  rationale: ἐν అనే విభక్తి ప్రయోగం పరిధి, సాధనం లేదా అధికారం సూచించవచ్చు. ఒకే వ్యాఖ్యానాన్ని బలవంతంగా నిర్ణయించకుండా మూలంలోని భావ విస్తృతిని నిలుపుతుంది.
- issue: ‘మనం ఒక్కటిగా ఉన్నట్లే వారూ ఒక్కటిగా’ అనే పోలిక
  choice: శిష్యుల ఐక్యతకు తండ్రి-కుమారుల ఐక్యతతో నిజమైన పోలికను అలాగే ఉంచబడింది.
  alternative: దీనిని కేవలం సహకారంగా కుదించడం లేదా ఒక నిర్దిష్ట తాత్త్విక సమానత్వంగా విస్తరించడం
  rationale: వాక్యం పోలికను బలంగా చెబుతుంది గాని దాని స్వభావాన్ని ఇక్కడ పూర్తిగా నిర్వచించదు; అనువాదం ఆ వేదాంతపరమైన ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
- issue: ᾧ దేనిని సూచిస్తుంది?
  choice: SBLGNT ప్రకారం అది ‘నామం’ను సూచించేలా అనువదించబడింది.
  alternative: ‘నీవు నాకు ఇచ్చిన వారిని నీ నామంలో కాపాడు’
  rationale: ఇచ్చిన గ్రీకు పాఠంలో సంబంధసర్వనామం ὀνόματιతో వ్యాకరణపరంగా సరిపోతుంది; ఇతర ప్రతుల పఠనాన్ని పాదటిప్పణిలో తెలియజేయడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలిని ఉపయోగించాం. ‘పరిశుద్ధ తండ్రీ’, ‘నీ నామంలో’, ‘ఒక్కటిగా’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, యోహాను వాక్యంలోని గంభీరత మరియు ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతాయి. పాదటిప్పణి గుర్తులను అవి వివరించే పదబంధం వద్ద ఉంచాం.
