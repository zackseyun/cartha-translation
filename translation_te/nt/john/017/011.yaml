revisions:
- from: నేను ఇక లోకంలో లేను; కాని వారు లోకంలో ఉన్నారు, నేను నీ దగ్గరికి వస్తున్నాను. పరిశుద్ధ తండ్రీ, నీవు నాకు ఇచ్చిన నీ నామంలో[a][b] వారిని కాపాడు; మనం ఒక్కటిగా ఉన్నట్లే వారూ ఒక్కటిగా ఉండేలా కాపాడు.
  to: నేను ఇక లోకంలో లేను; వారైతే లోకంలో ఉన్నారు, నేను నీ వద్దకు వస్తున్నాను. పరిశుద్ధ తండ్రీ, నీవు నాకు ఇచ్చిన నీ నామంలో[a][b] వారిని కాపాడు; మనం ఒక్కటిగా ఉన్నట్లే వారూ ఒక్కటిగా ఉండునట్లు.
  rationale: The revision removes the unsupported adversative, reflects the emphatic αὐτοὶ with ‘వారైతే,’ and makes the ἵνα clause dependent on the single imperative. It preserves the SBLGNT reading that the Father gave the name to the Son, retains the textual-variant and lexical footnotes at the relevant phrase, and does not resolve the theological scope of ‘in your name’ or ‘one.’
