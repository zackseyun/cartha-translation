revisions:
- from: ఇప్పుడు, నీవు నాకు ఇచ్చినవన్నీ నీ నుంచే వచ్చినవని వారు తెలుసుకున్నారు.[a]
  to: ఇప్పుడు వారు నీవు నాకు ఇచ్చినవన్నీ నీ నుంచే వచ్చాయని తెలుసుకున్నారు.[a]
  rationale: The revision retains every semantic component of the Greek while making the content clause syntactically explicit and natural in modern Telugu. The footnote preserves the valid alternative that more closely reflects the present-tense form εἰσιν.
  reviewer_model: gpt-5.6-terra
