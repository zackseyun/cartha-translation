review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys νῦν, the disciples as the plural subject, the totality of πάντα ὅσα, the Father’s giving to Jesus, and παρά + genitive as source. However, the finite perfect-result sense of ἔγνωκαν is more clearly represented by a finite Telugu verb, and the present εἰσιν is best retained as a current assertion of source rather than only an attributive past participle.
  naturalness: The proposed revision has straightforward modern-standard Telugu syntax. Moving ఇప్పుడు into normal adverbial position and using వచ్చాయని after the content clause makes the sentence more fluent and explicit.
  terminology: నీవు and నాకు appropriately preserve the reverent singular address and the Son’s first-person reference. నీ నుంచే preserves the emphatic source sense without adding doctrinal explanation.
  issues:
  - severity: low
    issue: The wording తెలుసుకున్నారు followed by వచ్చినవని uses an attributive participial construction that can leave the resultative force of ἔγνωκαν and the assertion introduced by ὅτι less explicit.
    rationale: A finite content clause, వచ్చాయని, naturally expresses what the disciples have now come to know. It also reads more smoothly in contemporary Telugu.
  revised_text: ఇప్పుడు వారు నీవు నాకు ఇచ్చినవన్నీ నీ నుంచే వచ్చాయని తెలుసుకున్నారు.[a]
  revised_footnotes:
  - marker: a
    text: లేదా, “నీవు నాకు ఇచ్చిన ప్రతిదీ నీ నుంచే వస్తుందని.”
    reason: παρὰ σοῦ εἰσιν అనే మాటలు వాటి మూలాన్ని తెలిపే స్థితివాక్యంగా ఉన్నాయి; తెలుగులో దానిని ‘వచ్చాయి’ లేదా ‘వస్తుంది’ అనే క్రియారూపాలతో సహజంగా వ్యక్తపరచవచ్చు.
