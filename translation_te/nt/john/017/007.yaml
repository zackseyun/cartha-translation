base_translation:
  language: en
  yaml_path: translation/nt/john/017/007.yaml
  text: Now they have come to know that everything you have given me is from you[a].
translation:
  language: te
  text: ఇప్పుడు వారు నీవు నాకు ఇచ్చినవన్నీ నీ నుంచే వచ్చాయని తెలుసుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు నాకు ఇచ్చిన ప్రతిదీ నీ నుంచే వస్తుందని.”
    reason: παρὰ σοῦ εἰσιν అనే మాటలు వాటి మూలాన్ని తెలిపే స్థితివాక్యంగా ఉన్నాయి; తెలుగులో దానిని ‘వచ్చాయి’ లేదా ‘వస్తుంది’ అనే క్రియారూపాలతో సహజంగా వ్యక్తపరచవచ్చు.
lexical_decisions:
- source_word: νῦν
  choice: ఇప్పుడు
  rationale: శిష్యుల అవగాహన ప్రస్తుతం చేరుకున్న దశను సూచించే సహజమైన కాలవాచక పదం.
- source_word: ἔγνωκαν
  choice: తెలుసుకున్నారు
  rationale: గతంలో కలిగిన గ్రహింపు ఫలితంగా ఇప్పుడు నిలిచివున్న అవగాహనను సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ὅτι
  choice: అని
  rationale: వారు తెలుసుకున్న విషయాన్ని పరిచయం చేసే తెలుగు అన్వయ రూపం.
- source_word: πάντα ὅσα
  choice: ఇచ్చినవన్నీ
  rationale: సంబంధవాచక భావంతో కూడిన సంపూర్ణతను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: δέδωκάς μοι
  choice: నీవు నాకు ఇచ్చిన
  rationale: పూర్తయిన క్రియకు కొనసాగుతున్న ప్రాముఖ్యత ఉందనే భావాన్ని తెలుగు సంబంధవాచక నిర్మాణం సందర్భానుసారంగా నిలుపుతుంది.
- source_word: παρὰ σοῦ εἰσιν
  choice: నీ నుంచే వచ్చినవి
  rationale: παρά + షష్ఠీ విభక్తి తెలిపే మూలం లేదా ఉద్భవాన్ని స్పష్టంగా చూపుతుంది; ‘వచ్చినవి’ అనే రూపం సహజ తెలుగు.
theological_decisions:
- issue: కుమారునికి తండ్రి ఇచ్చిన వాటికీ వాటి మూలానికీ ఉన్న సంబంధం
  choice: నీవు నాకు ఇచ్చినవన్నీ నీ నుంచే వచ్చినవి
  alternative: నీవు నాకు ఇచ్చినవన్నీ నీవే ఇచ్చినవి
  rationale: మూలపాఠం తండ్రినే వాటి మూలంగా పేర్కొంటుంది. దీనిని తరువాతి సిద్ధాంత వివరణలతో విస్తరించకుండా, మూలం అనే భావాన్ని అలాగే ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనా సందర్భానికి తగిన గౌరవభరితమైన ఏకవచన సంబోధనను, సాధారణ పాఠకులకు అర్థమయ్యే సహజ వాక్యనిర్మాణాన్ని ఉపయోగించింది.
