id: JHN.17.24
reference: John 17:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀πάτερ, ⸀ὃ δέδωκάς μοι, θέλω ἵνα ὅπου εἰμὶ ἐγὼ κἀκεῖνοι ὦσιν μετ’ ἐμοῦ, ἵνα θεωρῶσιν τὴν δόξαν τὴν ἐμὴν ἣν ⸀δέδωκάς μοι, ὅτι ἠγάπησάς με πρὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/024.yaml
  text: Father[a], I desire that those whom you have given me also may be with me where I am, so that they may see my glory that you have given me, because you loved me before the foundation of the world.
translation:
  language: te
  text: తండ్రీ, నీవు నాకు ఇచ్చినవారు[a] నేను ఎక్కడ ఉన్నానో అక్కడ వారూ నాతో ఉండాలని కోరుతున్నాను, తద్వారా వారు నీవు నాకు ఇచ్చిన నా మహిమను చూడాలని; ఎందుకంటే లోకపు పునాది వేయబడకముందే నీవు నన్ను ప్రేమించావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా ‘నీవు నాకు ఇచ్చినది’ అని ఉంది. ఈ నపుంసక ఏకవచన రూపం ఒక సమూహాన్ని సూచిస్తుంది; తరువాత వచ్చే బహువచన పదాలు తండ్రి కుమారునికి ఇచ్చిన వ్యక్తులే ఉద్దేశమని చూపుతున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  choice: తండ్రీ
  rationale: దేవునికి నేరుగా చేసే సంబోధనను సహజమైన, గౌరవప్రదమైన తెలుగు సంబోధనారూపంతో తెలియజేస్తుంది; గ్రీకులో లేని ‘నా’ అనే పదాన్ని చేర్చదు.
- source_word: ὃ δέδωκάς μοι
  choice: నీవు నాకు ఇచ్చినవారు
  rationale: ὃ రూపరీత్యా నపుంసక ఏకవచనమైనా, తరువాతి బహువచన వ్యక్తిసూచకమైన κἀκεῖνοι ὦσιν దాని సమూహార్థం తండ్రి కుమారునికి ఇచ్చిన వ్యక్తులేనని స్పష్టం చేస్తుంది. తెలుగు వ్యక్తిసూచక బహువచనం సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: δέδωκάς
  choice: ఇచ్చిన
  rationale: గ్రీకు పరిపూర్ణ కాలంలోని పూర్తయిన క్రియ మరియు కొనసాగుతున్న ఫలితాన్ని తెలుగు సంబంధకృదంతం సందర్భానుసారంగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: θέλω
  choice: కోరుతున్నాను
  rationale: ప్రార్థనా సందర్భంలో బలమైన కోరికను తెలియజేస్తూనే, దానిని ఆజ్ఞగా లేదా భవిష్యత్ ప్రకటనగా మార్చకుండా θέλω యొక్క సంకల్పార్థాన్ని నిలుపుతుంది.
- source_word: ὅπου εἰμὶ ἐγὼ κἀκεῖνοι ὦσιν μετ’ ἐμοῦ
  choice: నేను ఎక్కడ ఉన్నానో అక్కడ నాతో కూడా ఉండాలని
  rationale: ἐγώ యొక్క వ్యక్తిగత ఉనికిని, κἀκεῖνοι లోని వ్యక్తిసూచనను, καί లోని ‘కూడా’ అనే అదనపు భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: θεωρῶσιν
  choice: చూసేలా
  rationale: మహిమను దర్శించడం లేదా గమనించడం అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది; కృత్రిమంగా ప్రాచీనమైన పదాన్ని నివారిస్తుంది.
- source_word: τὴν δόξαν τὴν ἐμὴν ἣν δέδωκάς μοι
  choice: నీవు నాకు ఇచ్చిన నా మహిమను
  rationale: మహిమ కుమారునిదనే స్వామ్య ఉద్ఘాటనను, అదే మహిమను తండ్రి ఇచ్చాడనే సంబంధవాక్యాన్ని రెండింటినీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: πρὸ καταβολῆς κόσμου
  choice: లోకం ఏర్పడకముందే
  rationale: సృష్టికి పూర్వమైన కాలసూచనను ఆధునిక పాఠకులకు సహజంగా తెలియజేస్తుంది; ‘పునాది వేయడం’ అనే గ్రీకు రూపకానికి అర్థసమానమైన తెలుగు వ్యక్తీకరణ.
theological_decisions:
- issue: లోకం ఏర్పడకముందే తండ్రి కుమారుని ప్రేమించాడనే కాలసూచన
  choice: లోకం ఏర్పడకముందే నీవు నన్ను ప్రేమించావు
  alternative: సృష్టికి ముందున్న ప్రేమను రూపకార్థంగా లేదా ముందస్తు సంకల్పంగా మాత్రమే వివరిస్తూ చేసిన విస్తృత వ్యాఖ్యాన అనువాదం
  rationale: గ్రీకు వాక్యం సృష్టికి పూర్వమైన ప్రేమను నేరుగా కాలసూచనతో చెబుతుంది. అనువాదం దానిని బలహీనపరచకుండా, అదనపు సిద్ధాంత వివరణ లేకుండా నిలుపుతుంది.
- issue: ప్రార్థనలో θέλω యొక్క బలం
  choice: కోరుతున్నాను
  alternative: నేను నిర్ణయిస్తున్నాను / నాకు కావాలి
  rationale: యేసు సంకల్పపూర్వకమైన కోరికను నిలుపుతూ, గ్రీకు వాక్యాన్ని ఆజ్ఞగా గానీ కేవలం సాధారణ ఇష్టంగా గానీ ముందే నిర్ణయించదు.
- issue: తండ్రి ఇచ్చినది వ్యక్తుల సమూహమా, నపుంసక ఏకవచన సమష్టియా
  choice: నీవు నాకు ఇచ్చినవారు
  alternative: నీవు నాకు ఇచ్చినది
  rationale: మూలంలోని ὃ నపుంసక ఏకవచన రూపాన్ని పాదటిప్పణిలో తెలియజేస్తూ, వెంటనే వచ్చే వ్యక్తిసూచక బహువచనం కారణంగా ప్రధాన పాఠ్యంలో ఉద్దేశిత వ్యక్తులను స్పష్టంగా చూపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలి. ‘తండ్రీ’ అనే సంబోధనను, ‘కోరుతున్నాను’ అనే సహజమైన సంకల్పవ్యక్తీకరణను వాడింది. మూలంలోని రెండు ἵνα వాక్యాల సంబంధం స్పష్టంగా ఉండేందుకు రెండవదాన్ని ‘చూసేలా ఇలా కోరుతున్నాను’ అని తెలిపింది; సృష్టిపూర్వ కాలసూచనను వ్యాఖ్యాన విస్తరణ లేకుండా నిలిపింది.
