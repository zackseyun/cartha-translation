id: JHN.17.13
reference: John 17:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: νῦν δὲ πρὸς σὲ ἔρχομαι, καὶ ταῦτα λαλῶ ἐν τῷ κόσμῳ ἵνα ἔχωσιν τὴν χαρὰν τὴν ἐμὴν πεπληρωμένην ἐν ⸀ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/013.yaml
  text: But now I am coming to you[b][a], and I am speaking these things in the world so that they may have my joy fulfilled in themselves.
translation:
  language: te
  text: అయితే ఇప్పుడు నేను నీ వద్దకు వస్తున్నాను. నా ఆనందం వారిలో[a] పరిపూర్ణమై ఉండేలా నేను లోకంలో ఈ మాటలు చెబుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి అంతరంగంలో”; “వారి మధ్య” అనే అర్థం కూడా సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: అయితే ఇప్పుడు
  rationale: νῦν సూచించే ప్రస్తుత క్షణాన్నీ, δέ సూచించే స్వల్ప వ్యత్యాసం లేదా సంభాషణ మలుపునూ సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: πρὸς σὲ ἔρχομαι
  choice: నేను నీ వద్దకు వస్తున్నాను
  rationale: πρός తో కూడిన ἔρχομαι తండ్రి వైపు కదలికను సూచిస్తుంది; వర్తమాన రూపాన్ని ‘వస్తున్నాను’ సహజంగా నిలుపుతుంది.
- source_word: ταῦτα λαλῶ
  choice: ఈ మాటలు చెబుతున్నాను
  rationale: λαλέω యొక్క మాట్లాడటం లేదా పలకటం అనే భావాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: ἐν τῷ κόσμῳ
  choice: లోకంలో
  rationale: యోహాను రచనలోని κόσμος పదప్రయోగాన్ని నిలుపుతూ, యేసు ప్రస్తుతం ఉన్న భూలోక పరిధిని సూచిస్తుంది.
- source_word: ἵνα ἔχωσιν
  choice: ఉండేలా
  rationale: ἵνα తెలిపే ఉద్దేశం లేదా లక్ష్య ఫలితాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; ఆనందాన్ని ‘కలిగియుండటం’ కంటే ‘వారిలో ఉండటం’ ఇక్కడ సులభంగా ప్రవహిస్తుంది.
- source_word: τὴν χαρὰν τὴν ἐμὴν
  choice: నా ఆనందం
  rationale: ἐμὴν యొక్క స్వామ్యార్థాన్ని సరళంగా నిలుపుతుంది; ఇది యేసుకు చెందిన ఆనందమనే భావాన్ని అదనపు వ్యాఖ్యానం లేకుండా ఇస్తుంది.
- source_word: πεπληρωμένην
  choice: పరిపూర్ణమై
  rationale: πληρόω యొక్క నింపబడటం లేదా సంపూర్ణ స్థితికి చేరటం అనే భావాన్ని, perfect passive participle సూచించే ఫలిత స్థితితో సహా తెలియజేస్తుంది.
- source_word: ἐν ἑαυτοῖς
  choice: వారిలో
  rationale: శిష్యులలో అంతర్గతంగా ఆ ఆనందం ఉండటాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; ప్రత్యామ్నాయ అంతరంగార్థాన్ని పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: ‘నా ఆనందం’ యొక్క స్వభావం
  choice: యేసుకు చెందిన ఆనందమే శిష్యులలో పరిపూర్ణంగా ఉండాలని వచనం చెబుతున్నట్లు అనువదించడం
  alternative: యేసు గురించి కలిగే ఆనందంగా విపులీకరించడం
  rationale: ἐμὴν సహజంగా యేసుకు చెందిన ఆనందాన్ని సూచిస్తుంది. ఆ ఆనందంలో వారు ఎలా పాలుపంచుకుంటారనే సిద్ధాంత వివరణను అనువాదంలో చేర్చకుండా మూలంలోని ఉద్వేగాన్ని నిలుపుతుంది.
- issue: ἐν ἑαυτοῖς యొక్క పరిధి
  choice: వారిలో
  alternative: వారి అంతరంగంలో; వారి మధ్య
  rationale: సందర్భంలో అంతర్గత అనుభవమే బలమైన అర్థం. అయినా గ్రీకు ప్రయోగానికి సాధ్యమైన ఇతర ఛాయలను పూర్తిగా మూసివేయకుండా పాదసూచికలో సూచించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘నీ వద్దకు’ అనే రూపం తండ్రిని నేరుగా ఏకవచనంలో సంబోధించే మూలభాషను నిలుపుతూ, పాతకాలపు ‘నీ యొద్దకు’ కంటే ప్రస్తుత వాడుకకు దగ్గరగా ఉంటుంది.
