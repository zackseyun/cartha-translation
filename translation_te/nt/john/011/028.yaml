id: JHN.11.28
reference: John 11:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ⸀τοῦτο εἰποῦσα ἀπῆλθεν καὶ ἐφώνησεν ⸀Μαριὰμ τὴν ἀδελφὴν αὐτῆς λάθρᾳ εἰποῦσα· Ὁ διδάσκαλος πάρεστιν καὶ φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/028.yaml
  text: And after saying this[a], she went away and called Mary her sister privately, saying[c][b], “The Teacher is here and is calling for you.”
translation:
  language: te
  text: ఆమె ఈ మాట చెప్పిన తర్వాత వెళ్లి, తన సహోదరి మరియను ఇతరులకు వినిపించకుండా[a] పిలిచి, “గురువు[b] ఇక్కడ ఉన్నాడు; ఆయన నిన్ను పిలుస్తున్నాడు[c]” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రహస్యంగా” లేదా “ఏకాంతంగా.” గ్రీకు పదం ఇతరులకు వినిపించకుండా మాట్లాడడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “బోధకుడు.” గ్రీకులో διδάσκαλος, అంటే “బోధించేవాడు” లేదా “గురువు.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “నిన్ను రమ్మని పిలుస్తున్నాడు.” గ్రీకు వర్తమాన కాలం అక్షరార్థంగా “నిన్ను పిలుస్తున్నాడు” అని ఉంటుంది; ఈ సందర్భంలో ఆయన తన దగ్గరకు రమ్మని కోరుతున్నాడనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο εἰποῦσα
  choice: ఈ మాట చెప్పిన తర్వాత
  rationale: గ్రీకు భూతకాల కృదంతం ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచిస్తుంది; ఈ రూపం సంఘటనల క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀπῆλθεν
  choice: వెళ్లి
  rationale: ప్రస్తుత స్థలం నుండి వెళ్లడాన్ని సూచిస్తుంది; తరువాతి చర్యతో కలిపిన ఈ రూపం తెలుగు కథన ప్రవాహానికి సహజంగా ఉంటుంది.
- source_word: ἐφώνησεν Μαριὰμ
  choice: మరియను … పిలిచి
  rationale: ఇక్కడ φωνέω ఒకరిని పిలవడం లేదా రమ్మని కబురు చేయడం అనే అర్థంలో ఉంది.
- source_word: τὴν ἀδελφὴν αὐτῆς
  choice: తన సహోదరి
  rationale: మరియ ఎవరో గుర్తించే అనుబంధ పదబంధాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: λάθρᾳ
  choice: ఇతరులకు వినిపించకుండా
  rationale: బహిరంగంగా కాకుండా, చుట్టూ ఉన్నవారికి వినిపించని విధంగా చెప్పడమే ప్రధాన భావం; మోసం లేదా భయం అనే అదనపు ఉద్దేశాన్ని ఇది చేర్చదు.
- source_word: εἰποῦσα
  choice: అని చెప్పింది
  rationale: ప్రత్యక్ష సంభాషణను పరిచయం చేసే కృదంతాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో ప్రధాన వాక్యాంత క్రియగా వ్యక్తపరుస్తుంది.
- source_word: Ὁ διδάσκαλος
  choice: బోధకుడు
  rationale: διδάσκαλος యొక్క సాధారణ అర్థమైన ‘బోధించేవాడు’ అనే భావాన్ని గౌరవసూచక బిరుదుగా నిలుపుతుంది; ‘యజమాని’ అనే అధికార సంబంధిత భావాన్ని చేర్చదు.
- source_word: πάρεστιν
  choice: ఇక్కడ ఉన్నాడు
  rationale: ఉన్నచోట ప్రత్యక్షంగా ఉండడాన్ని సూచించే గ్రీకు భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: φωνεῖ σε
  choice: నిన్ను పిలుస్తున్నాడు
  rationale: గ్రీకు వర్తమాన కాలంలోని కొనసాగుతున్న పిలుపు భావాన్ని నిలుపుతూ, మరియను తన దగ్గరకు రమ్మని పిలుస్తున్న సందర్భానికి సరిపోతుంది.
theological_decisions:
- issue: యేసుకు వాడిన διδάσκαλος అనే బిరుదు
  choice: బోధకుడు
  alternative: గురువు / యజమాని
  rationale: మూలపదం ప్రధానంగా బోధించేవాడిని సూచిస్తుంది. ‘బోధకుడు’ ఆ సాధారణ పదార్థాన్ని నిలుపుతుంది; అధికారాన్ని లేదా ప్రత్యేక సిద్ధాంతార్థాన్ని అనవసరంగా విస్తరించదు.
- issue: λάθρᾳ లోని గోప్యత భావం
  choice: ఇతరులకు వినిపించకుండా
  alternative: రహస్యంగా / ఏకాంతంగా
  rationale: సంభాషణ బహిరంగంగా జరగలేదని మూలం చెబుతుంది; అయితే దానికి మోసం, భయం లేదా మరే ఉద్దేశం ఉందని నిర్బంధంగా చెప్పదు. ఎంపిక చేసిన రూపం ఆ ఉద్రిక్తతను అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. ‘ఇతరులకు వినిపించకుండా’ అనే రూపం సహజంగా ఉండేలా చూసి, గోప్య ఉద్దేశాన్ని అతిగా నిర్ధారించలేదు. ప్రత్యక్ష సంభాషణలో యేసును సూచించేందుకు సహజ తెలుగు గౌరవ ఏకవచనమైన ‘ఆయన’ వాడబడింది.
