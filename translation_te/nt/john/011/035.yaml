lexical_decisions:
- source_word: ἐδάκρυσεν
  choice: కన్నీళ్లు కార్చాడు
  rationale: δακρύω అనే క్రియ కన్నీళ్లు కార్చడాన్ని ప్రత్యేకంగా సూచిస్తుంది. సందర్భంలో కనిపించే బిగ్గరగా విలపించడాన్ని సూచించే ఇతర పదాలకంటే ఇది మృదువైన భావవ్యక్తీకరణ. ‘కన్నీళ్లు కార్చాడు’ అనే అనువాదం క్రియ యొక్క అర్థాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; అవసరం లేని ఆరంభ భావాన్ని జోడించదు.
- source_word: ὁ Ἰησοῦς
  choice: యేసు
  rationale: నిర్దేశక ఉపపదంతో ఉన్న వ్యక్తినామం వాక్యానికి కర్త. తెలుగులో వ్యక్తినామానికి ఆ ఉపపదాన్ని విడిగా అనువదించాల్సిన అవసరం లేదు.
theological_decisions:
- issue: యేసు భావోద్వేగాన్ని వ్యక్తం చేయడం
  choice: యేసు కన్నీళ్లు కార్చాడు
  alternative: యేసు ఏడ్చాడు
  rationale: మూలవాక్యం యేసు నిజమైన మానవ దుఃఖాన్ని సంక్షిప్తంగా, ప్రత్యక్షంగా చూపిస్తుంది. అనువాదం ఆ భావాన్ని తగ్గించకుండా, అదే సమయంలో మూలంలోని క్రియకన్నా బలమైన విలాప భావాన్ని చేర్చకుండా నిలుపుతుంది.
translation_notes:
  register: సంక్షిప్తమైన, గంభీరమైన, ఆధునిక ప్రామాణిక తెలుగు. మూలవాక్యపు సరళతను, భావోద్వేగ బలాన్ని నిలిపి ఉంచుతూ గ్రీకు క్రియలోని ప్రత్యేకతను ప్రధాన పాఠంలో సహజంగా వ్యక్తం చేసింది.
