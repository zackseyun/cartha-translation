translation:
  language: te
  text: యేసు కన్నీళ్లు కార్చాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యేసు ఏడ్చాడు.’ ఇక్కడి గ్రీకు క్రియ ప్రత్యేకంగా కన్నీళ్లు కార్చడాన్ని సూచిస్తుంది; ఈ సందర్భంలో మరొకచోట చెప్పబడిన బిగ్గర విలాపానికి వాడిన పదానికి ఇది భిన్నమైనది.
