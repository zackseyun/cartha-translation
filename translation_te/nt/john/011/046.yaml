  text: τινὲς δὲ ἐξ αὐτῶν ἀπῆλθον πρὸς τοὺς Φαρισαίους καὶ εἶπαν αὐτοῖς ἃ ⸀ἐποίησεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/046.yaml
  text: But some of them went to the Pharisees and told them what Jesus had done[a].
translation:
  language: te
  text: అయితే వారిలో కొందరు పరిసయ్యుల దగ్గరికి వెళ్లి, యేసు చేసినదేమిటో వారికి చెప్పారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు చేసినదాన్ని వారికి తెలియజేశారు.” పరిసయ్యుల దగ్గరికి వెళ్లినవారి ఉద్దేశం ఏమిటో గ్రీకు పాఠం స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: అయితే వారిలో కొందరు
  rationale: ముందటి వచనంలో విశ్వసించినవారితో ఉన్న వ్యత్యాసాన్ని δὲ సూచిస్తుంది; τινὲς ἐξ αὐτῶν ఆ గుంపులోని కొందరిని సూచిస్తుంది.
- source_word: ἀπῆλθον πρὸς τοὺς Φαρισαίους
  choice: పరిసయ్యుల దగ్గరికి వెళ్లి
  rationale: ἀπῆλθον అక్కడి నుంచి వెళ్లడాన్ని సూచించినా, తెలుగులో ‘దగ్గరికి వెళ్లి’ సహజంగా గమ్యాన్ని తెలియజేస్తుంది; మూలంలో లేని ఉద్దేశాన్ని చేర్చదు.
- source_word: εἶπαν αὐτοῖς
  choice: వారికి చెప్పారు
  rationale: సందర్భంలో జరిగిన విషయాన్ని వారికి తెలియజేయడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; ఫిర్యాదు చేశారనే ప్రతికూల ఉద్దేశాన్ని చేర్చదు.
- source_word: ἃ ἐποίησεν Ἰησοῦς
  choice: యేసు చేసినదేమిటో
  rationale: నపుంసక బహువచన సంబంధసర్వనామమైన ἃను తెలుగు వాక్యనిర్మాణంలో సహజమైన సమగ్ర రూపంతో అందిస్తుంది; ἐποίησεν పూర్తయిన క్రియను సూచిస్తుంది.
theological_decisions:
- issue: పరిసయ్యులకు తెలియజేసినవారి ఉద్దేశం
  choice: తటస్థమైన ‘చెప్పారు’ అనే పదప్రయోగం
  alternative: యేసుపై ఫిర్యాదు చేశారు / యేసును పట్టించారు
  rationale: ఈ వచనంలోని గ్రీకు పాఠం వారు వెళ్లి యేసు చేసినది చెప్పారని మాత్రమే పేర్కొంటుంది; వారి ఉద్దేశం శత్రుత్వపూరితమని స్పష్టంగా చెప్పదు. అందువల్ల ఆ కథనాత్మక అనిశ్చితిని నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘పరిసయ్యులు’ అనే ప్రాచుర్యంలో ఉన్న సమూహనామాన్ని వాడాం; ఉద్దేశాన్ని సూచించే వ్యాఖ్యానాత్మక పదాలను నివారించాం.
