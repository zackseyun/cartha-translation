id: JHN.11.45
reference: John 11:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πολλοὶ οὖν ἐκ τῶν Ἰουδαίων, οἱ ἐλθόντες πρὸς τὴν ⸀Μαριὰμ καὶ θεασάμενοι ⸀ἃ ⸀ἐποίησεν, ἐπίστευσαν εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/045.yaml
  text: Therefore many of the Jews who had come to Mary and had seen what he had done believed in him[a].
translation:
  language: te
  text: కాబట్టి మరియ దగ్గరకు వచ్చిన యూదుల్లో చాలామంది, ఆయన చేసినదాన్ని చూసి, ఆయనను విశ్వసించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదులలోనుండి”; యోహాను సువార్తలోని కొన్ని సందర్భాల్లో Ἰουδαῖοι అనే పదాన్ని “యూదయవాసులు” అని కూడా అనువదించవచ్చని కొందరు వాదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ οὖν
  choice: కాబట్టి ... చాలామంది
  rationale: οὖν ముందటి సంఘటన ఫలితాన్ని సూచిస్తుంది; ‘కాబట్టి’ ఆ అనుబంధాన్ని స్పష్టంగా ఉంచుతుంది. Πολλοὶ అనిర్దిష్టమైన గణనీయ సంఖ్యను ‘చాలామంది’గా సహజంగా తెలియజేస్తుంది.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: యూదుల్లో
  rationale: ἐκ తో ఉన్న భాగసూచక భావాన్ని ఆధునిక తెలుగులో సహజంగా ‘యూదుల్లో’ తెలియజేస్తుంది.
- source_word: οἱ ἐλθόντες πρὸς τὴν Μαριὰμ
  choice: మరియ దగ్గరకు వచ్చిన
  rationale: ఆర్టికల్‌తో కూడిన కృదంతం ఏ యూదులు ఉద్దేశించబడ్డారో నిర్దేశిస్తుంది; πρὸς యొక్క దిశాభావాన్ని ‘దగ్గరకు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: θεασάμενοι
  choice: చూసి
  rationale: సంఘటనను ప్రత్యక్షంగా గమనించిన భావాన్ని సరళమైన, సహజమైన తెలుగులో ఇస్తుంది.
- source_word: ἃ ἐποίησεν
  choice: ఆయన చేసినదాన్ని
  rationale: నపుంసక బహువచన సంబంధసర్వనామాన్ని తెలుగు ఏకవచన సమాహార రూపంలో సహజంగా వ్యక్తం చేస్తుంది; సందర్భంలో చేసినవాడు యేసు అని గౌరవసూచక ‘ఆయన’ స్పష్టం చేస్తుంది.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: ఆయనను విశ్వసించారు
  rationale: యోహాను రచనలో వ్యక్తి వైపు దిశాన్వితమైన నమ్మకాన్ని సూచించే πιστεύω εἰς నిర్మాణానికి ఇది సహజమైన తెలుగు సమానార్థకం; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
theological_decisions:
- issue: యోహాను సందర్భంలో πιστεύω εἰς αὐτόν యొక్క అనువాదం
  choice: ఆయనను విశ్వసించారు
  alternative: ఆయన మీద విశ్వాసముంచారు
  rationale: ‘ఆయనను విశ్వసించారు’ వ్యక్తిగత నమ్మకాన్ని సహజంగా తెలియజేస్తూ గ్రీకు నిర్మాణంలోని దిశాభావాన్ని కాపాడుతుంది; ‘విశ్వాసముంచారు’ కంటే తక్కువ విస్తరణతో ఉంటుంది.
- issue: Ἰουδαῖοι యొక్క గుర్తింపు
  choice: యూదులు
  alternative: యూదయవాసులు
  rationale: ఈ సందర్భంలో పదం మరియ దగ్గరకు వచ్చిన యూదుల సమూహాన్ని సూచిస్తుంది. ‘యూదులు’ సంప్రదాయబద్ధమైన, సహజమైన అర్థం; అయితే యోహానులో కొన్ని సందర్భాల్లో ప్రాంతీయ అర్థమైన ‘యూదయవాసులు’ కూడా వాదించబడుతుంది కాబట్టి ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి. గ్రీకు వాక్యంలోని కారణ-ఫలిత సంబంధం, భాగసూచక భావం, విశ్వాసం యొక్క వ్యక్తిగత లక్ష్యం నిలుపబడ్డాయి.
