source:
  edition: SBLGNT
  text: εἶπεν οὖν Θωμᾶς ὁ λεγόμενος Δίδυμος τοῖς συμμαθηταῖς· Ἄγωμεν καὶ ἡμεῖς ἵνα ἀποθάνωμεν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/016.yaml
  text: So Thomas[a], called Didymus, said to his fellow disciples, “Let us also go, so that we may die with him.”
translation:
  language: te
  text: 'కాబట్టి దిదుము[a] అని పిలువబడే తోమా తన తోటి శిష్యులతో ఇలా అన్నాడు: “ఆయనతో పాటు చనిపోవడానికి మనం కూడా వెళ్దాం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: దిదుము అంటే “కవల.”
    reason: లిప్యంతరీకరించిన గ్రీకు పిలుపుపేరు యొక్క అర్థాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సంభాషణ నుంచి వచ్చే తార్కికమైన, కథనపరమైన కొనసాగింపును సూచిస్తుంది.
- source_word: Θωμᾶς
  choice: తోమా
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు తగిన విధంగా లిప్యంతరీకరించింది.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: దిదుమ అని పిలువబడే
  rationale: Δίδυμος ను పేరుగా లిప్యంతరీకరించి, దాని అర్థమైన ‘కవల’ను పాదసూచికలో తెలిపింది; మూలంలోని పిలుపుపేరును, వివరణాత్మక స్వభావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: τοῖς συμμαθηταῖς
  choice: తన తోటి శిష్యులతో
  rationale: సహశిష్యులను సూచించే పదానికి సందర్భానుకూలమైన, సహజమైన తెలుగు రూపం.
- source_word: Ἄγωμεν καὶ ἡμεῖς
  choice: మనం కూడా వెళ్దాం
  rationale: ప్రథమ పురుష బహువచన ప్రేరణార్థక భావాన్ని, καὶ ἡμεῖς లోని చేర్పు ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα ἀποθάνωμεν μετ’ αὐτοῦ
  choice: ఆయనతో పాటు చనిపోవడానికి
  rationale: ఉద్దేశం లేదా ఆశించిన ఫలితాన్ని తెలిపే ἵνα నిర్మాణాన్ని స్పష్టంగా ఉంచుతూ, యేసుతో కలిసి మరణించడమనే భావాన్ని సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: తోమా మాటల ధోరణి, ఉద్దేశం
  choice: ఏ అదనపు భావవ్యాఖ్య లేకుండా మాటను నేరుగా అనువదించడం
  alternative: ధైర్యమైన విశ్వాసం, నిరాశాపూరిత అంగీకారం, లేదా వ్యంగ్య నిరాశగా స్పష్టీకరించడం
  rationale: గ్రీకు వాక్యం తోమా ధోరణిని నిర్దిష్టంగా పేర్కొనదు. అందువల్ల అనువాదం అతని మాటల్లోని సాధ్యమైన ధైర్యం, నిరాశ, లేదా వ్యంగ్య ఛాయల మధ్య ఉన్న అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘చనిపోవడానికి’ సాధారణ పాఠకులకు స్పష్టంగా ఉండగా, వాక్య గంభీరతను కూడా నిలుపుతుంది.
