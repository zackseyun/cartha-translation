reference: John 11:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὐχὶ δώδεκα ⸂ὧραί εἰσιν⸃ τῆς ἡμέρας; ἐάν τις περιπατῇ ἐν τῇ ἡμέρᾳ, οὐ προσκόπτει, ὅτι τὸ φῶς τοῦ κόσμου τούτου βλέπει·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/009.yaml
  text: Jesus answered[a], “Are there not twelve hours in the day? If anyone walks in the day, he does not stumble[c][b], because he sees the light of this world.”
translation:
  language: te
  text: 'యేసు ఇలా జవాబిచ్చాడు: “పగటిలో పన్నెండు గంటలు ఉన్నాయి కదా?[a] ఎవరైనా పగటివేళ నడిస్తే తడబడడు; ఎందుకంటే అతడు ఈ లోకపు వెలుగును చూస్తాడు.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పగటికి పన్నెండు గంటలు ఉన్నాయి కదా?”
    reason: lexical_alternative
  - marker: b
    text: “ఈ లోకపు వెలుగు” అనే మాటకు యోహాను సువార్తలో దైవిక వెలుగు గురించిన విస్తృత ప్రతిధ్వని ఉండవచ్చు; అయితే ప్రధాన పాఠ్యం దానిని మరింత నిర్దిష్టంగా వ్యాఖ్యానించదు.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς
  choice: యేసు ఇలా జవాబిచ్చాడు
  rationale: సాధారణ కథన శైలిలో సహజమైన తెలుగు; ‘ఇలా’ తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని సులభంగా పరిచయం చేస్తుంది.
- source_word: Οὐχὶ δώδεκα ὧραί εἰσιν τῆς ἡμέρας
  choice: పగటికి పన్నెండు గంటలు ఉన్నాయి కదా?
  rationale: Οὐχὶ సూచించే సమ్మతిని ఆశించే అలంకారప్రశ్నను ‘కదా?’ సహజంగా నిలుపుతుంది. ఇక్కడ ἡμέρα సందర్భానుసారం వెలుతురు ఉండే పగటి కాలాన్ని సూచిస్తుంది.
- source_word: ἐάν τις περιπατῇ ἐν τῇ ἡμέρᾳ
  choice: ఎవరైనా పగటివేళ నడిస్తే
  rationale: τις యొక్క సాధారణ, అనిర్దిష్ట భావాన్ని ‘ఎవరైనా’ తెలియజేస్తుంది; ‘పగటివేళ’ తెలుగు వాడుకలో సహజంగా ఉండి మూలంలోని కాలసూచనను కాపాడుతుంది.
- source_word: οὐ προσκόπτει
  choice: తడబడడు
  rationale: προσκόπτω లోని కాలికి ఏదైనా తగిలి తడబడే ప్రత్యక్ష చిత్రంతోపాటు దాని రూపకాల విస్తృతిని కూడా ‘తడబడు’ నిలుపుతుంది.
- source_word: τὸ φῶς τοῦ κόσμου τούτου βλέπει
  choice: అతడు ఈ లోకపు వెలుగును చూస్తాడు
  rationale: మూలంలోని ఏకవచన ప్రతినిధి నిర్మాణాన్ని, βλέπει యొక్క ప్రత్యక్ష ‘చూస్తాడు’ అర్థాన్ని నిలుపుతుంది; ‘వెలుగు’కు యోహాను సువార్తలో ఉండగల విస్తృత ప్రతిధ్వనిని వివరణతో పరిమితం చేయదు.
theological_decisions:
- issue: ‘ఈ లోకపు వెలుగు’ అనే మాటకు యోహాను సువార్తలో ఉండగల సంకేతార్థం
  choice: ప్రధాన పాఠ్యంలో సాధారణ దృశ్యరూపాన్నే ఉంచి, దాని విస్తృత ప్రతిధ్వనిని పాదసూచికలో సూచించడం
  alternative: దీనిని యేసు లేదా దైవిక మార్గదర్శకత్వానికి ప్రత్యక్ష సూచనగా అనువదించడం
  rationale: తక్షణ సందర్భంలో ఈ మాట పగటివేళ నడిచే వ్యక్తి గురించిన సామెతలాంటి చిత్రంగా పనిచేస్తుంది. అయితే యోహాను రచనలో ‘వెలుగు’కు లోతైన ధార్మిక ప్రతిధ్వని ఉండవచ్చు; అనువాదం ఆ ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
- issue: τις ... βλέπει లోని సాధారణ ఏకవచన వ్యక్తి
  choice: ‘ఎవరైనా ... అతడు’ అనే ఏకవచన నిర్మాణాన్ని నిలుపడం
  alternative: బహువచన లేదా వ్యక్తిరహిత నిర్మాణంతో లింగసూచనను తొలగించడం
  rationale: గ్రీకు మూలంలోని అనిర్దిష్ట ఏకవచన ప్రతినిధి నిర్మాణాన్ని తెలుగులో స్పష్టంగా ప్రతిబింబిస్తుంది; ఇది పురుషులకు మాత్రమే వర్తిస్తుందనే భావాన్ని ఉద్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. అలంకారప్రశ్నకు ‘కదా?’ వాడబడింది. మూలంలోని ప్రతినిధి ఏకవచనం ‘ఎవరైనా ... అతడు’గా నిలుపబడింది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
