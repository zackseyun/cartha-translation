  text: ἀπ’ ἐκείνης οὖν τῆς ἡμέρας ⸀ἐβουλεύσαντο ἵνα ἀποκτείνωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/053.yaml
  text: So from that day on they planned to kill him.
translation:
  language: te
  text: కాబట్టి ఆ రోజు నుండి ఆయనను చంపడానికి వారు పథకం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπ’ ἐκείνης ... τῆς ἡμέρας
  choice: ఆ రోజు నుంచే
  rationale: ἀπόతో కూడిన కాలవాచక పదబంధం ఆ రోజును మొదలుబిందువుగా చూపిస్తుంది. ‘నుంచే’ అనే రూపం అప్పటి నుండి కొనసాగిన సంకల్పాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: οὖν ముందున్న మహాసభ చర్చ ఫలితంగా జరిగిన పరిణామాన్ని సూచిస్తుంది. ‘కాబట్టి’ దాని తార్కిక-కథన సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐβουλεύσαντο
  choice: పథకం వేశారు
  rationale: ఈ మధ్యమ రూప క్రియ ఇక్కడ ఆలోచించి రూపొందించిన ఉద్దేశపూర్వక ప్రణాళికను సూచిస్తుంది. ‘పథకం వేశారు’ కుట్రపూరితమైన నిర్ణయ భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; కేవలం ‘ఆలోచించారు’ అనడం దాని నిర్ణయాత్మకతను తగ్గిస్తుంది.
- source_word: ἵνα ἀποκτείνωσιν
  choice: చంపడానికి
  rationale: ἵναతో ఉన్న క్రియ వారి ప్రణాళిక ఉద్దేశాన్ని తెలియజేస్తుంది. తెలుగు ప్రయోజనార్థక క్రియారూపమైన ‘చంపడానికి’ మూలంలోని ఉద్దేశ భావాన్ని సరళంగా, నేరుగా అందిస్తుంది.
- source_word: αὐτόν
  choice: ఆయనను
  rationale: సర్వనామం సమీప సందర్భంలోని యేసును సూచిస్తుంది. గౌరవార్థక ఏకవచనమైన ‘ఆయనను’ ఆధునిక తెలుగు బైబిలు శైలిలో సహజంగా ఉంటుంది; మూలంలో లేని పేరును చేర్చదు.
theological_decisions:
- issue: యేసును చంపాలన్న నాయకుల ఉద్దేశ స్వభావం
  choice: కేవలం చర్చగా కాక, ఆయనను చంపడానికి రూపొందించిన పథకంగా అనువదించడం.
  alternative: ఆయనను చంపడం గురించి వారు ఆలోచించారు.
  rationale: ἐβουλεύσαντο మరియు దాని తరువాతి ఉద్దేశ వాక్యభాగం నిర్ణయాత్మకమైన శత్రుత్వ ప్రణాళికను సూచిస్తాయి. ‘పథకం వేశారు’ అని చెప్పడం దాని తీవ్రతను నిలుపుతుంది; అయితే మూలంలో స్పష్టంగా లేని న్యాయపరమైన లేదా సిద్ధాంతపరమైన వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. వాక్యంలోని కారణ-పరిణామ సంబంధం, కాలారంభ భావం, హత్యా పథకపు నిర్ణయాత్మకత అన్నీ సంక్షిప్తంగా నిలుపబడ్డాయి.
