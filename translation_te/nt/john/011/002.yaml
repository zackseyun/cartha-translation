source:
  edition: SBLGNT
  text: ἦν δὲ ⸀Μαριὰμ ἡ ἀλείψασα τὸν κύριον μύρῳ καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ ταῖς θριξὶν αὐτῆς, ἧς ὁ ἀδελφὸς Λάζαρος ἠσθένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/002.yaml
  text: It was Mary who had anointed the Lord with perfume and wiped his feet with her hair[a], whose brother Lazarus was sick.
translation:
  language: te
  text: ప్రభువుకు సుగంధ తైలం[a] పూసి, తన వెంట్రుకలతో ఆయన పాదాలను తుడిచినది మరియే; ఆమె సోదరుడైన లాజరు అనారోగ్యంతో ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సుగంధ లేపనం’; గ్రీకు పదం పరిమళభరితమైన తైలం లేదా లేపనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ Μαριὰμ
  choice: మరియ ఈమెనే
  rationale: గ్రీకు వాక్యంలోని గుర్తింపును సహజమైన తెలుగు వాక్యనిర్మాణంతో తెలియజేస్తుంది. δέ యొక్క స్వల్ప అనుసంధాన భావాన్ని సందర్భమే అందించగలదు కాబట్టి ప్రత్యేకంగా ‘అప్పుడు’ వంటి కాలసూచక పదాన్ని చేర్చలేదు.
- source_word: ἡ ἀλείψασα
  choice: పూసి ... తుడిచిన
  rationale: ఆర్టికల్‌తో ఉన్న భూతకాల కృదంతాన్ని మరియను గుర్తించే విశేషణ ఉపవాక్యంగా సహజంగా అనువదించింది; గ్రీకు రూపం సూచించనిదానికంటే అధిక కాలనిర్ణయాన్ని తెలుగులో రుద్దలేదు.
- source_word: τὸν κύριον
  choice: ప్రభువుకు
  rationale: యేసుకు వాడిన κύριος అనే గౌరవబిరుదు యొక్క కథన, దైవశాస్త్ర ప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: μύρῳ
  choice: సుగంధ తైలం
  rationale: పరిమళభరితమైన తైలం లేదా లేపనం అనే అర్థపరిధిని ఆధునిక పాఠకునికి స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐκμάξασα τοὺς πόδας αὐτοῦ
  choice: ఆయన పాదాలను తుడిచిన
  rationale: ἐκμάσσω యొక్క తుడవడం లేదా తుడిచి ఆరబెట్టడం అనే భావాన్ని సందర్భానుకూలంగా వ్యక్తపరుస్తుంది.
- source_word: ταῖς θριξὶν αὐτῆς
  choice: తన తలవెంట్రుకలతో
  rationale: కరణార్థక దత్తి విభక్తిని ‘తో’ ద్వారా స్పష్టంగా చూపుతుంది; ‘తలవెంట్రుకలు’ తెలుగు పాఠకునికి సహజంగా ఉంటుంది.
- source_word: ἧς ὁ ἀδελφὸς Λάζαρος
  choice: ఆమె సోదరుడు లాజరు
  rationale: సంబంధవాచక సర్వనామం మరియకు లాజరుతో ఉన్న సంబంధాన్ని తెలియజేస్తుంది; విరామచిహ్నంతో రెండు భావఖండాలను స్పష్టంగా కలిపింది.
- source_word: ἠσθένει
  choice: అనారోగ్యంతో ఉన్నాడు
  rationale: ఈ సందర్భంలో ἀσθενέω శారీరక అనారోగ్యాన్ని సూచిస్తుంది; తెలుగు సాధారణ వాడుకలో ఇది సహజమైన, గౌరవప్రదమైన రూపం.
theological_decisions:
- issue: యేసుకు κύριος అనే బిరుదు
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఇక్కడ ఇది కేవలం సామాజిక యజమానిత్వాన్ని కాక యేసుకు సంబంధించిన గౌరవబిరుదుగా పనిచేస్తుంది; ‘ప్రభువు’ దాని కథన, దైవశాస్త్ర బరువును నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని ఒకే వాక్య నిర్మాణాన్ని అర్ధవిరామంతో చదవడానికి సులభంగా ఉంచి, మరియను గుర్తించే వివరణకూ లాజరు అనారోగ్య సమాచారానికీ ఉన్న సంబంధాన్ని నిలిపింది.
