id: JHN.11.15
reference: John 11:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ χαίρω δι’ ὑμᾶς, ἵνα πιστεύσητε, ὅτι οὐκ ἤμην ἐκεῖ· ἀλλὰ ἄγωμεν πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/015.yaml
  text: And I am glad for your sake that I was not there[a], so that you may believe. But let us go to him.
translation:
  language: te
  text: మీరు నమ్మేలా ఉండేందుకు, నేను అక్కడ లేనందుకు మీ కోసమే సంతోషిస్తున్నాను.[a] అయితే మనం అతని దగ్గరికి వెళ్దాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు నమ్మడం మొదలుపెట్టేలా.” గ్రీకు ఏరిస్ట్ సంభావనార్థక రూపం విశ్వాసంలోకి రావడాన్ని నొక్కిచెప్పవచ్చు; అయితే విస్తృతమైన, తక్కువ వ్యాఖ్యానభారం గల “నమ్మేలా” ప్రధాన పాఠంలో ఉంచబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: సంతోషిస్తున్నాను
  rationale: వర్తమానకాలంలోని సానుకూల భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘ఆనందిస్తున్నాను’ కంటే సందర్భంలో సాధారణంగా వినిపిస్తుంది.
- source_word: δι’ ὑμᾶς
  choice: మీ నిమిత్తం
  rationale: διά + ద్వితీయా విభక్తి ఇక్కడ శిష్యుల ప్రయోజనాన్ని సూచిస్తుంది; కేవలం కారణార్థకమైన ‘మీ వల్ల’ అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: ἵνα πιστεύσητε
  choice: మీరు నమ్మేలా
  rationale: ἵνα తో కూడిన భూతకాలిక సంభావనార్థక క్రియ ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది. ‘నమ్మడం మొదలుపెట్టేలా’ అనే సాధ్యమైన ఆరంభార్థాన్ని ప్రధాన పాఠంలో బలవంతంగా చేర్చదు.
- source_word: ὅτι οὐκ ἤμην ἐκεῖ
  choice: నేను అక్కడ లేకపోయినందుకు
  rationale: యేసు సంతోషిస్తున్న విషయాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది; గ్రీకు ὅτι ఇక్కడ విషయవాచకంగా ఉన్నప్పటికీ తెలుగులో ‘అని’ నిర్మాణం అసహజంగా ఉండే అవకాశం ఉంది.
- source_word: ἀλλὰ
  choice: అయితే
  rationale: వివరణ నుంచి చర్యకు మారే వ్యత్యాసాన్ని సహజంగా సూచిస్తుంది.
- source_word: ἄγωμεν
  choice: మనం ... వెళ్దాం
  rationale: మొదటి పురుష బహువచన ప్రోత్సాహక సంభావనార్థక రూపాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: πρὸς αὐτόν
  choice: అతని దగ్గరికి
  rationale: ఒక వ్యక్తివైపు కదలికను సూచించే πρός భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యోహాను సువార్త సందర్భంలో πιστεύσητε యొక్క భావబలం
  choice: నమ్మేలా
  alternative: నమ్మడం మొదలుపెట్టేలా
  rationale: భూతకాలిక సంభావనార్థక రూపం విశ్వాసంలోకి రావడాన్ని సూచించవచ్చు; అయితే శిష్యులకు అంతకుముందు అసలు విశ్వాసమే లేదనే బలమైన నిర్ణయాన్ని వాక్యం తప్పనిసరిగా కోరదు. ప్రధాన పాఠం ఈ ఉద్రిక్తతను తెరిచి ఉంచుతుంది.
- issue: ἵνα ఉపవాక్యం ఉద్దేశమా ఫలితమా
  choice: మీరు నమ్మేలా ఇది జరిగింది
  alternative: మీరు నమ్మాలని
  rationale: ἵνα సాధారణంగా ఉద్దేశాన్ని సూచించినా, తెలుగు ‘నమ్మాలని’ యేసు కేవలం కోరిక వ్యక్తం చేస్తున్నట్టు వినిపించవచ్చు. ‘నమ్మేలా’ ఉద్దేశం/ఫలితం మధ్య గ్రీకు నిర్మాణంలోని విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా గౌరవప్రదమైన శైలి. వాక్యక్రమం తెలుగు సహజ ప్రవాహానికి అనుగుణంగా మార్చబడింది; మూలంలోని ఉద్దేశార్థం మరియు πιστεύσητε లోని సాధ్యమైన ఆరంభార్థ అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
