source:
  edition: SBLGNT
  text: εἷς δέ τις ἐξ αὐτῶν Καϊάφας, ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου, εἶπεν αὐτοῖς· Ὑμεῖς οὐκ οἴδατε οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/049.yaml
  text: But one of them[a], Caiaphas, who was high priest that year, said to them, “You know nothing at all.”
translation:
  language: te
  text: 'అయితే వారిలో ఒకడైన కయప, ఆ సంవత్సరంలో ప్రధాన యాజకుడిగా ఉండి, వారితో ఇలా అన్నాడు: “మీకు అసలు ఏమీ తెలియదు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత పదశః: “మీకు ఏమీ తెలియదు.” గ్రీకు వాక్యనిర్మాణంలో ద్వినిషేధం ఉండి, అది గట్టి గద్దింపును వ్యక్తం చేస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δέ τις ἐξ αὐτῶν
  choice: అయితే వారిలో ఒకడైన
  rationale: εἷς ... τις అనే గ్రీకు ప్రయోగం సమూహంలోని ఒక వ్యక్తిని పరిచయం చేస్తుంది. సహజమైన తెలుగులో ‘వారిలో ఒకడైన’ అని అనువదించడం సరిపోతుంది; δέ సందర్భంలోని స్వల్ప వ్యత్యాసం లేదా మలుపును ‘అయితే’ తెలియజేస్తుంది.
- source_word: Καϊάφας
  choice: కయప
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో లిప్యంతరీకరించబడింది.
- source_word: ἀρχιερεὺς
  choice: ప్రధాన యాజకుడు
  rationale: ఈ సందర్భంలో ఏకవచన పదవిని స్పష్టంగా సూచించే ప్రామాణిక తెలుగు పదబంధం; యాజక నాయకుల విస్తృత సమూహంతో దీనిని కలపదు.
- source_word: ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: ఆ సంవత్సరంలో ప్రధాన యాజకుడిగా ఉండి
  rationale: కయపను వర్ణించే గ్రీకు కృదంత పదబంధాన్ని సహజమైన తెలుగులో ఇస్తూ, ‘ఆ సంవత్సరం’ అనే యోహాను కాలసూచనను యథాతథంగా నిలుపుతుంది.
- source_word: εἶπεν αὐτοῖς
  choice: వారితో ఇలా అన్నాడు
  rationale: దత్తి విభక్తిలోని αὐτοῖς‌ను సహజ తెలుగు సంభాషణా నిర్మాణమైన ‘వారితో ... అన్నాడు’గా అందిస్తుంది; ‘ఇలా’ తరువాతి ప్రత్యక్ష వాక్యాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: Ὑμεῖς
  choice: మీకు
  rationale: గ్రీకులో స్పష్టంగా వాడిన సర్వనామం గద్దింపును బలపరుస్తుంది. తెలుగులో ‘మీకు’ మరియు ‘అసలు’ కలయిక ఆ ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: οὐκ οἴδατε οὐδέν
  choice: మీకు అసలు ఏమీ తెలియదు
  rationale: గ్రీకు ద్వినిషేధం తార్కికంగా ఒకదానిని మరొకటి రద్దు చేయదు; అది తీవ్ర నిరాకరణ. ‘అసలు ఏమీ తెలియదు’ ఆ గద్దింపు బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: కయప పదవికి సంబంధించిన యోహాను కాలసూచనను అనువదించడం
  choice: ఆ సంవత్సరంలో ప్రధాన యాజకుడిగా ఉండి
  alternative: ఆ సంవత్సరపు ప్రధాన యాజకుడై ఉండి
  rationale: ఈ పదబంధాన్ని చారిత్రక వర్ణనగానే సూటిగా అందించి, ప్రధాన యాజకత్వ స్వభావం గురించి వివరణను లేదా కథనంలోని వ్యంగ్యార్థాన్ని అనువాదంలో చేర్చలేదు. తద్వారా విస్తృత సందర్భం ఇచ్చే భావతీవ్రత తెరిచి ఉంచబడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘అసలు ఏమీ తెలియదు’ అనే మాట కయప గద్దింపులోని తీవ్రతను సహజంగా నిలుపుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత వాక్యానికి వెంటనే ఉంచబడింది.
