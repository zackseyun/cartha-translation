id: JHN.11.32
reference: John 11:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ ὡς ἦλθεν ὅπου ⸀ἦν Ἰησοῦς ἰδοῦσα αὐτὸν ἔπεσεν αὐτοῦ ⸀πρὸς τοὺς πόδας, λέγουσα αὐτῷ· Κύριε, εἰ ἦς ὧδε οὐκ ἄν ⸂μου ἀπέθανεν⸃ ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/032.yaml
  text: So when Mary came where Jesus was and saw him[a], she fell at his feet, saying to him, “Lord, if you had been here, my brother would not have died.”
translation:
  language: te
  text: కాబట్టి మరియ యేసు ఉన్న చోటికి వచ్చి, ఆయనను చూసి ఆయన పాదాల దగ్గర పడిపోయి, ఆయనతో, “ప్రభువా,[a] నీవు ఇక్కడ ఉండి ఉంటే, నా సోదరుడు చనిపోయేవాడు కాదు” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అయ్యా.” గ్రీకు పదం గౌరవపూర్వక సంబోధనగా కూడా వాడబడవచ్చు; ఇక్కడ యేసును సంబోధిస్తున్న సందర్భంలో ప్రధాన పాఠంలో “ప్రభువా” అని అనువదించబడింది.
    reason: κύριε అనే గ్రీకు సంబోధనలోని నిజమైన భావసంభావ్యతను తెలియజేయడానికి.
lexical_decisions:
- source_word: οὖν
  choice: అప్పుడు
  rationale: ఇక్కడ ఇది ముందున్న సంఘటనల నుంచి కథనం కొనసాగుతున్నదని సూచిస్తుంది. తెలుగు కథనంలో ‘అప్పుడు’ సహజంగా ఆ అనుసంధానాన్ని తెలియజేస్తుంది.
- source_word: ὡς ἦλθεν ὅπου ἦν Ἰησοῦς
  choice: యేసు ఉన్న చోటికి వచ్చి
  rationale: మరియ యేసు ఉన్న ప్రదేశానికి చేరుకున్నదనే కాలసంబంధ, స్థలసంబంధ భావాలను సహజమైన తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: ἰδοῦσα αὐτόν
  choice: ఆయనను చూడగానే
  rationale: ఈ భూతకాల కృదంతం మరియ యేసును చూసిన వెంటనే తదుపరి చర్య జరిగిందని సందర్భంలో సూచిస్తుంది; ‘చూడగానే’ ఆ క్రమాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: ἔπεσεν αὐτοῦ πρὸς τοὺς πόδας
  choice: ఆయన పాదాల దగ్గర పడి
  rationale: ఈ గ్రీకు ప్రయోగం ఒకరి పాదాల వద్ద పడడాన్ని సూచిస్తుంది. ‘పాదాల దగ్గర పడి’ ఆధునిక తెలుగులో సహజంగా ఉంది; నమస్కారం లేదా కేవలం కూలిపోవడం అని అదనంగా నిర్ణయించదు.
- source_word: λέγουσα αὐτῷ
  choice: ఆయనతో … అంది
  rationale: తెలుగు ప్రత్యక్ష సంభాషణలో సహజమైన నిర్మాణాన్ని వాడుతూ, మాటలు ఆయనకే చెప్పబడినవని నిలుపుతుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: κύριος అనే సంబోధనలో గౌరవార్థక ‘అయ్యా’ అనే భావం ఉండవచ్చు; అయినా యోహాను సువార్తలో యేసు చిత్రణను, పదంలోని విస్తృత భావసంభావ్యతను నిలుపుటకు ప్రధాన పాఠంలో ‘ప్రభువా’ ఉంచబడింది.
- source_word: εἰ ἦς ὧδε
  choice: నీవు ఇక్కడ ఉండి ఉంటే
  rationale: గతంలో నిజం కాని షరతును తెలుగులో సహజంగా వ్యక్తం చేసే నిర్మాణం ఇది.
- source_word: οὐκ ἄν μου ἀπέθανεν ὁ ἀδελφός
  choice: నా సోదరుడు చనిపోయి ఉండేవాడు కాదు
  rationale: ἄν తో కూడిన భూతకాల క్రియ తెలిపే గతకాల వ్యతిరేక-వాస్తవ ఫలితాన్ని ఈ తెలుగు రూపం స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: మరియ యేసును సంబోధించినప్పుడు κύριος పదం అనువాదం
  choice: ప్రభువా
  alternative: అయ్యా
  rationale: ‘ప్రభువా’ అనే అనువాదం పదానికి ఉన్న గౌరవాన్ని, యోహాను సువార్తలో దానికి ఉండగల మరింత గంభీరమైన భావాన్ని నిలుపుతుంది. అయితే ఈ ఒక్క సంబోధనే పూర్తి దైవత్వ ఒప్పుకోలు అని బలవంతంగా నిర్ణయించకుండా ‘అయ్యా’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలిని, గౌరవభరితమైన ధోరణిని వాడాం. యేసును సూచించేటప్పుడు కథనంలో ‘ఆయన’ వాడి, ప్రత్యక్ష సంబోధనలో మూలంలోని ఏకవచనానికి అనుగుణంగా ‘నీవు’ వాడాం. మూలంలో లేని ఆరాధన లేదా భావోద్వేగ వివరణను చేర్చలేదు.
