  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἠγάπα δὲ ὁ Ἰησοῦς τὴν Μάρθαν καὶ τὴν ἀδελφὴν αὐτῆς καὶ τὸν Λάζαρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/005.yaml
  text: Jesus loved Martha and her sister and Lazarus.
translation:
  language: te
  text: యేసు మార్తను, ఆమె సహోదరిని, లాజరును ప్రేమించేవాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγάπα
  choice: ప్రేమించేవాడు
  rationale: ἀγαπάω అనే క్రియ యొక్క అసంపూర్ణ భూతకాల రూపం గతంలో కొనసాగిన స్థితిని సూచిస్తుంది. ఆధునిక తెలుగులో “ప్రేమించేవాడు” యేసుకు వారిపట్ల నిలకడైన ప్రేమ ఉందనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ ఇక్కడ స్వల్ప కథన అనుసంధానాన్ని ఇస్తుంది; తెలుగులో ప్రత్యేకంగా “అయితే” లేదా “ఇక” చేరిస్తే మూలంలో లేని విరోధం లేదా బలమైన మార్పు భావం కలగవచ్చు. వాక్యక్రమమే అనుసంధానాన్ని సహజంగా మోస్తుంది.
- source_word: τὴν Μάρθαν
  choice: మార్తను
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, కర్మను సూచించే “ను” చేర్చాం.
- source_word: τὴν ἀδελφὴν αὐτῆς
  choice: ఆమె సహోదరిని
  rationale: మూలంలోని నామవాచకం మరియు స్వామ్య సర్వనామాన్ని సహజమైన తెలుగు పదక్రమంలో ఇచ్చాం. ఈ వచనంలో పేరు చెప్పబడనందున “మరియ” అని స్పష్టీకరించలేదు.
- source_word: τὸν Λάζαρον
  choice: లాజరును
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు రూపంలో లిప్యంతరీకరించి, కర్మ విభక్తిని చేర్చాం.
- source_word: καὶ ... καὶ
  choice: కామాలతో సమన్వయించిన జాబితా
  rationale: గ్రీకులోని పునరుక్త καί ముగ్గురు వ్యక్తులను సమన్వయిస్తుంది. తెలుగులో ప్రతి అంశం ముందు “మరియు” పునరావృతం చేయడం కంటే కామాలతో జాబితా ఇవ్వడం సహజంగా ఉండి, ముగ్గురూ సమానంగా క్రియకు కర్మలనే నిర్మాణాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ἠγάπα అనే అసంపూర్ణ భూతకాల క్రియ యేసు ప్రేమను ఎలా వ్యక్తం చేస్తుంది
  choice: మార్త, ఆమె సహోదరి, లాజరు పట్ల యేసుకు కొనసాగిన ప్రేమ ఉందని తెలిపే సాధారణ వాక్యం
  alternative: “ప్రేమించడం మొదలుపెట్టాడు” అనే ఆరంభార్థం లేదా “ప్రేమిస్తూ ఉన్నాడు” అనే మరింత బలమైన ప్రగతిశీల రూపం
  rationale: ఈ సందర్భంలో అసంపూర్ణ భూతకాలం గతంలో కొనసాగిన స్థితిని అత్యంత సహజంగా చిత్రిస్తుంది. మూలపాఠం చెప్పేదానిని మించి భావోద్వేగ లేదా సిద్ధాంతపరమైన వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. “సహోదరి” సాధారణ “చెల్లెలు/అక్క” కంటే మూలంలోని వయోసంబంధ అస్పష్టతను కాపాడుతుంది. పాఠక వచనంలో పాదసూచికలు లేవు.
