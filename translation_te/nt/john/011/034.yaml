id: JHN.11.34
reference: John 11:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ποῦ τεθείκατε αὐτόν; λέγουσιν αὐτῷ· Κύριε, ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/034.yaml
  text: And he said[a], “Where have you laid him?” They said to him, “Lord, come and see.”
translation:
  language: te
  text: ఆయన, “మీరు అతణ్ణి ఎక్కడ ఉంచారు?” అని అన్నాడు. వారు ఆయనతో, “ప్రభువా[a], వచ్చి చూడండి” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అయ్యా, వచ్చి చూడండి.” గ్రీకు κύριε అనే పదం గౌరవార్థక సంబోధనగా కూడా ఉపయోగించవచ్చు; ప్రధాన పాఠంలో “ప్రభువా” అని అనువదించాం.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: అన్నాడు
  rationale: λέγω సాధారణంగా మాట్లాడడాన్ని సూచిస్తుంది. పలికిన మాట ప్రశ్న అయినప్పటికీ, మూలంలోని సాధారణ క్రియను వ్యాఖ్యానాత్మకంగా ‘అడిగాడు’గా మార్చకుండా ‘అన్నాడు’గా ఉంచాం.
- source_word: Ποῦ
  choice: ఎక్కడ
  rationale: స్థలాన్ని గురించి నేరుగా ప్రశ్నించే క్రియావిశేషణానికి సహజమైన తెలుగు రూపం.
- source_word: τεθείκατε
  choice: ఉంచారు
  rationale: τίθημι యొక్క సంపూర్ణ భూతకాల రూపం; లాజరు దేహాన్ని ఒక చోట ఉంచిన పూర్తయిన చర్యను సూచిస్తుంది. తెలుగులో ‘ఎక్కడ ఉంచారు?’ సహజంగా ఉండి సందర్భానికి సరిపోతుంది.
- source_word: αὐτόν
  choice: అతణ్ణి
  rationale: లాజరును సూచించే పుంలింగ ఏకవచన సర్వనామం.
- source_word: λέγουσιν
  choice: అన్నారు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నా, తెలుగు కథనంలో భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: యేసును నేరుగా సంబోధించే κύριεకు ‘ప్రభువా’ ప్రధాన అనువాదం. ఇది గౌరవార్థక సంబోధనతో పాటు ఉండగల క్రీస్తుసంబంధమైన భావసూచనను కూడా నిలుపుతుంది.
- source_word: ἔρχου
  choice: వచ్చి
  rationale: ‘రండి’ అనే గౌరవార్థక ఆహ్వాన భావం, తరువాతి ‘చూడండి’తో కలిసి తెలుగులో సహజమైన ‘వచ్చి చూడండి’ నిర్మాణంలో వ్యక్తమవుతుంది.
- source_word: ἴδε
  choice: చూడండి
  rationale: ὁράω ఆజ్ఞార్థక రూపానికి సహజమైన గౌరవార్థక తెలుగు అనువాదం; యేసును ఉద్దేశించిన సంభాషణకు తగినది.
theological_decisions:
- issue: యేసును సంబోధించే κύριε పదం అనువాదం
  choice: ప్రభువా
  alternative: అయ్యా
  rationale: ఈ సందర్భంలో κύριε గౌరవార్థక సంబోధనగా పనిచేయవచ్చు; అదే సమయంలో యోహాను కథనంలో మరింత లోతైన క్రీస్తుసంబంధ భావాన్ని కూడా కలిగి ఉండవచ్చు. ప్రధాన పాఠంలో ‘ప్రభువా’ ఈ రెండు అవకాశాలను అతిగా నిర్ణయించకుండా నిలుపుతుంది; ‘అయ్యా’ను పాదసూచికలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవభరితమైన సంభాషణ శైలిని వాడాం. మూలంలోని ‘అన్నాడు’ను నిలిపి, ప్రశ్న కాబట్టి ‘అడిగాడు’ అని వ్యాఖ్యానాత్మకంగా మార్చలేదు. యేసును ఉద్దేశించిన ఆజ్ఞార్థక క్రియలను తెలుగు గౌరవార్థక రూపంలో ఇచ్చాం.
