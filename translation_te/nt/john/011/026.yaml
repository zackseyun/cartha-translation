source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμὲ οὐ μὴ ἀποθάνῃ εἰς τὸν αἰῶνα· πιστεύεις τοῦτο;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/026.yaml
  text: And everyone who lives and believes in me will certainly never die forever. Do you believe this?
translation:
  language: te
  text: జీవించి ఉండి నన్ను విశ్వసించే ప్రతి ఒక్కరూ ఎన్నటికీ మరణించరు. ఇది నమ్ముతున్నావా?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμέ
  choice: జీవించి ఉండి నన్ను విశ్వసించే ప్రతి ఒక్కరూ
  rationale: గ్రీకు వర్తమాన కృదంతాలైన ζῶν, πιστεύων రెండింటి సమాంతర భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపింది; εἰς ἐμέ లోని వ్యక్తిగత విశ్వాస దిశను ‘నన్ను విశ్వసించే’ అని తెలిపింది.
- source_word: οὐ μὴ ἀποθάνῃ
  choice: మరణించరు
  rationale: οὐ μή నిర్మాణంలోని బలమైన నిరాకరణను తరువాతి ‘ఎన్నటికీ’తో కలిపి తెలుగులో దృఢంగా వ్యక్తం చేసింది.
- source_word: εἰς τὸν αἰῶνα
  choice: ఎన్నటికీ
  rationale: కాలాతీతమైన బలమైన నిరాకరణను సహజంగా తెలియజేస్తుంది; సందర్భంలోని శారీరక మరణం–నిత్యజీవం మధ్య ఉద్దేశపూర్వక ఉద్వేగాన్ని వివరణతో తొలగించదు.
- source_word: πιστεύεις τοῦτο;
  choice: ఇది నమ్ముతున్నావా?
  rationale: ప్రత్యక్షమైన ఏకవచన ప్రశ్నను సహజమైన, గౌరవభరిత ఆధునిక తెలుగులో నిలిపింది.
theological_decisions:
- issue: విశ్వాసి ‘ఎన్నటికీ మరణించడు’ అనే వాక్యం మరియు శారీరక మరణ వాస్తవం మధ్య ఉద్వేగం
  choice: ఎన్నటికీ మరణించరు
  alternative: శాశ్వతంగా మరణించరు / అసలు మరణించరు
  rationale: మూలంలోని οὐ μή ... εἰς τὸν αἰῶνα ను నేరుగా నిలిపి, ‘ఆత్మీయ మరణం’ లేదా ‘శాశ్వత మరణం’ అని వ్యాఖ్యానాత్మకంగా పరిమితం చేయలేదు. ముందరి వచనంతో కలిసి చదివినప్పుడు ఉద్దేశపూర్వక యోహాను సంబంధిత ఉద్వేగం నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గంభీరంగా ఉంది. మూలంలోని బలమైన నిరాకరణను ‘ఎన్నటికీ మరణించరు’గా సహజంగా వ్యక్తం చేసింది.
