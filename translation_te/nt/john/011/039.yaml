- from: యేసు, “రాయిని తొలగించండి” అన్నాడు. చనిపోయినవాని సోదరి మార్త ఆయనతో, “ప్రభువా, ఇప్పటికీ అతని నుంచి దుర్వాసన వస్తుంది; అతడు చనిపోయి నాలుగు రోజులైంది[a]” అంది.
  to: యేసు, “రాయిని తొలగించండి” అన్నాడు. చనిపోయినవాని సోదరి మార్త ఆయనతో, “ప్రభువా, ఇప్పటికే అతని నుంచి దుర్వాసన వస్తోంది; అతడు చనిపోయి నాలుగు రోజులు అయ్యాయి” అంది.[a]
