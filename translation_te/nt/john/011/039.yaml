id: JHN.11.39
reference: John 11:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει ὁ Ἰησοῦς· Ἄρατε τὸν λίθον. λέγει αὐτῷ ἡ ἀδελφὴ τοῦ ⸀τετελευτηκότος Μάρθα· Κύριε, ἤδη ὄζει, τεταρταῖος γάρ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/039.yaml
  text: Jesus said[a], “Take away the stone.” Martha, the sister of the dead man, said to him, “Lord, by now he smells[c][b], for he has been dead four days.”
translation:
  language: te
  text: యేసు, “రాయిని తొలగించండి” అన్నాడు. చనిపోయినవాని సోదరి మార్త ఆయనతో, “ప్రభువా, ఇప్పటికే అతని నుంచి దుర్వాసన వస్తోంది; అతడు చనిపోయి నాలుగు రోజులు అయ్యాయి” అంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతడు నాలుగో-రోజువాడు,” అంటే అతడు చనిపోయి నాలుగు రోజులు అయ్యాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρατε τὸν λίθον
  choice: రాయిని తొలగించండి
  rationale: బహువచన ఆజ్ఞారూపమైన Ἄρατε సమాధి ప్రవేశానికి అడ్డంగా ఉన్న రాయిని అక్కడున్నవారు తీసివేయాలని సూచిస్తుంది. ‘తొలగించండి’ ఆధునిక తెలుగులో సహజంగా ఉండి సందర్భానికి సరిపోతుంది.
- source_word: τοῦ τετελευτηκότος
  choice: చనిపోయినవాని
  rationale: పరిపూర్ణ కృదంతం మరణించి ఆ స్థితిలో ఉన్న వ్యక్తిని సూచిస్తుంది. ‘చనిపోయినవాని’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: మార్త యేసును గౌరవంతో సంబోధిస్తున్న సందర్భంలో κύριε లోని గౌరవార్థక, యోహాను సువార్తలోని విస్తృత భావబలాన్ని ‘ప్రభువా’ నిలుపుతుంది.
- source_word: ἤδη ὄζει
  choice: ఇప్పటికీ అతని నుంచి దుర్వాసన వస్తుంది
  rationale: ὄζει అంటే వాసన వెలువడడం; మరణ సందర్భం అది చెడు వాసనని స్పష్టం చేస్తుంది. వ్యక్తినే నేరుగా ‘దుర్వాసన కొడుతున్నాడు’ అనడం కంటే ఈ రూపం సహజమైన తెలుగు, అయినా గ్రీకులోని వ్యక్తి-సంబంధాన్ని ‘అతని నుంచి’ ద్వారా నిలుపుతుంది.
- source_word: τεταρταῖος γάρ ἐστιν
  choice: అతడు చనిపోయి నాలుగు రోజులైంది
  rationale: τεταρταῖος అక్షరార్థంగా ‘నాలుగో రోజుకు చెందినవాడు’ అనే విశేషణ రూపం. సందర్భంలో మరణించి నాలుగు రోజులయ్యాయని అర్థం; తెలుగులో స్పష్టత కోసం సహజంగా విస్తరించబడింది.
theological_decisions:
- issue: మార్త యేసును κύριε అని సంబోధించడం
  choice: ప్రభువా
  alternative: అయ్యా
  rationale: ‘అయ్యా’ కేవలం మర్యాదపూర్వక సంబోధనగా పరిమితం కావచ్చు. ‘ప్రభువా’ మూలపదంలోని భావబలాన్ని, యోహాను కథనంలోని ఉదాత్తతను నిలుపుతుంది; అయితే ఈ వచనం ఒక్కటే సంపూర్ణ విశ్వాస ప్రకటన చేస్తున్నట్లు అదనంగా చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. సంభాషణ సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఉంచుతూ, τεταρταῖος అనే అసాధారణ గ్రీకు ప్రయోగాన్ని పాదసూచికలో నిలుపుకున్నాం.
