source:
  edition: SBLGNT
  text: Ἦν δὲ ἐγγὺς τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβησαν πολλοὶ εἰς Ἱεροσόλυμα ἐκ τῆς χώρας πρὸ τοῦ πάσχα ἵνα ἁγνίσωσιν ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/055.yaml
  text: The Passover of the Jews was near[b][a], and many went up to Jerusalem from the countryside before the Passover to purify themselves.
translation:
  language: te
  text: యూదుల పస్కా పండుగ సమీపంలో ఉంది[a]. పస్కా పండుగకు ముందు తమను తాము శుద్ధి చేసుకోవడానికి[b] గ్రామీణ ప్రాంతాల నుండి చాలామంది యెరూషలేముకు వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదుల పస్కా.” గ్రీకులో అక్షరార్థంగా “యూదుల పస్కా” అని ఉంది; యోహాను సువార్తలో ఈ వ్యక్తీకరణ మళ్లీ మళ్లీ కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, పస్కా పండుగకు సిద్ధపడేందుకు ఆచారపరంగా శుద్ధి పొందడం.
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν δὲ ἐγγὺς
  choice: సమీపించింది
  rationale: ఇక్కడ ἐγγύς కాలసంబంధంగా ‘దగ్గరలో ఉంది’ అనే భావాన్ని ఇస్తుంది. పండుగ సమయం దగ్గరపడిందని సహజమైన ఆధునిక తెలుగులో ‘సమీపించింది’ తెలియజేస్తుంది; δέ స్వల్ప అనుసంధాన పదం కావడంతో ప్రత్యేక విరోధార్థక పదాన్ని చేర్చలేదు.
- source_word: τὸ πάσχα τῶν Ἰουδαίων
  choice: యూదుల పస్కా పండుగ
  rationale: గ్రీకు షష్ఠీ నిర్మాణాన్ని స్పష్టంగా నిలుపుతూ, πάσχαకు తెలుగులో స్థిరంగా వాడే ‘పస్కా’తో పాటు సాధారణ పాఠకుని కోసం ‘పండుగ’ను చేర్చింది.
- source_word: ἀνέβησαν
  choice: వెళ్లారు
  rationale: యెరూషలేముకు చేసే ప్రయాణంలో ‘పైకి వెళ్లడం’ అనే భౌగోళిక, యాత్రాసంబంధ ఛాయ గ్రీకులో ఉన్నప్పటికీ, తెలుగులో ‘పైకి వెళ్లారు’ అనడం ఇక్కడ అసహజంగా లేదా కేవలం దిశాసూచకంగా వినిపించవచ్చు. అందువల్ల లక్ష్యస్థానంతో సహజమైన ‘వెళ్లారు’ను ఎంచుకుంది.
- source_word: πολλοὶ
  choice: చాలామంది
  rationale: నామవాచకంగా పనిచేసే ఈ విశేషణాన్ని వ్యక్తులను సూచించే సహజమైన తెలుగు రూపంలో అనువదించింది.
- source_word: εἰς Ἱεροσόλυμα
  choice: యెరూషలేముకు
  rationale: εἰς తెలిపే గమ్యదిశను తెలుగు దత్తివిభక్తి ‘-కు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκ τῆς χώρας
  choice: గ్రామీణ ప్రాంతాల నుండి
  rationale: నగరానికి భిన్నమైన చుట్టుపక్కల దేశప్రాంతం లేదా పల్లె ప్రాంతాన్ని χώρα ఇక్కడ సూచిస్తుంది. ‘గ్రామీణ ప్రాంతాలు’ ఆ భేదాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: πρὸ τοῦ πάσχα
  choice: పస్కా పండుగకు ముందు
  rationale: πρό యొక్క కాలసంబంధ అర్థాన్ని సూటిగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα ἁγνίσωσιν ἑαυτούς
  choice: తమను తాము శుద్ధి చేసుకోవడానికి
  rationale: ἵναతో ఉన్న ఉద్దేశాన్ని ‘-డానికి’ రూపం తెలియజేస్తుంది. ἁγνίζωలోని ఆచారశుద్ధి భావాన్ని ప్రధాన పాఠ్యంలో అతిగా వివరించకుండా ‘శుద్ధి చేసుకోవడం’గా నిలుపుతుంది.
theological_decisions:
- issue: పస్కాకు ముందు జరిగే శుద్ధి స్వభావం
  choice: తమను తాము శుద్ధి చేసుకోవడానికి
  alternative: ఆచారపరంగా తమను తాము శుద్ధి చేసుకోవడానికి
  rationale: సందర్భం యూదుల పస్కా యాత్రకు సంబంధించిన ఆచారపరమైన సిద్ధతను సూచిస్తుంది. ప్రధాన పాఠ్యం గ్రీకు పదంలోని సాధారణ భావాన్ని నిలుపుతుంది; అది క్రైస్తవ సక్రమెంటు లేదా కేవలం అంతరంగ నైతిక శుద్ధి అని నిర్దిష్టం చేయదు. చారిత్రక నేపథ్యాన్ని పాదటిప్పణి వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలిని ఉపయోగించింది. మూలంలోని రెండు ఉద్దేశ/సందర్భ అంశాలను విడదీసి చదవడానికి సులభమైన రెండు వాక్యాలుగా ఇచ్చింది. ‘యూదుల పస్కా’ అనే యోహానీయ వ్యక్తీకరణను ప్రధాన పాఠ్యంలో నిలిపి, ప్రత్యామ్నాయ రూపాన్ని పాదటిప్పణిలో తెలిపింది.
