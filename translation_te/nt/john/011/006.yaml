id: JHN.11.6
reference: John 11:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς οὖν ἤκουσεν ὅτι ἀσθενεῖ, τότε μὲν ἔμεινεν ἐν ᾧ ἦν τόπῳ δύο ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/006.yaml
  text: So when he heard that he was sick[a], he then stayed two days in the place where he was.
translation:
  language: te
  text: కాబట్టి, లాజరు అనారోగ్యంతో ఉన్నాడని యేసు విన్నప్పుడు, అప్పుడు ఆయన తాను ఉన్న చోటే రెండు రోజులు ఉండిపోయాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς οὖν
  choice: కాబట్టి ... విన్నప్పుడు
  rationale: οὖν యొక్క అనుసంధాన భావాన్ని ‘కాబట్టి’తో, ὡς యొక్క కాలసూచక భావాన్ని ‘విన్నప్పుడు’తో సహజమైన తెలుగులో నిలిపింది.
- source_word: ἤκουσεν
  choice: విన్నప్పుడు
  rationale: ἀκούω యొక్క సాధారణ అర్థమైన ‘వినడం’నే ఉంచి, చెప్పబడింది లేదా తెలుసుకున్నాడు వంటి అదనపు భావాన్ని చేర్చలేదు.
- source_word: ὅτι ἀσθενεῖ
  choice: లాజరు అనారోగ్యంతో ఉన్నాడని
  rationale: ἀσθενέω ఈ సందర్భంలో శారీరక అనారోగ్యాన్ని సూచిస్తుంది. గ్రీకులోని వర్తమాన కాల భావం తెలుగులో ‘ఉన్నాడని’ ద్వారా సహజంగానే నిలుస్తుంది; అస్పష్టమైన సర్వనామం వల్ల కలిగే గందరగోళాన్ని నివారించేందుకు సందర్భంలో స్పష్టంగా ఉన్న లాజరు పేరును వాడింది.
- source_word: τότε μὲν
  choice: అప్పుడు ఆయన
  rationale: τότε యొక్క కాలక్రమ భావాన్ని ‘అప్పుడు’ తెలియజేస్తుంది. μένకు తెలుగులో బలవంతంగా ‘నిజంగా’ లేదా ‘మాత్రం’ జోడిస్తే అవసరానికి మించిన వ్యతిరేక భావం రావచ్చు; తరువాతి కథనంతో ఏర్పడే స్వల్ప నిరీక్షణను వాక్యక్రమమే మోస్తుంది.
- source_word: ἔμεινεν
  choice: ఉండిపోయాడు
  rationale: ఒక చోటనే కొనసాగి ఉండడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν ᾧ ἦν τόπῳ
  choice: తాను ఉన్న చోటే
  rationale: గ్రీకు వాక్యంలోని స్థల ప్రాధాన్యాన్ని నిలుపుతూ, ‘తాను’ ద్వారా కర్త యేసేనని స్పష్టం చేస్తుంది. ‘చోటే’ అదే ప్రదేశంలో కొనసాగి ఉన్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δύο ἡμέρας
  choice: రెండు రోజులు
  rationale: కాలవ్యవధిని నేరుగా, సందిగ్ధత లేకుండా అనువదిస్తుంది.
theological_decisions:
- issue: లాజరు అనారోగ్యం గురించి విన్న తరువాత యేసు ఆలస్యం చేసినట్లు కనిపించే కథన ఉద్రిక్తత
  choice: యేసు విన్నప్పుడు తాను ఉన్న చోటే రెండు రోజులు ఉండిపోయాడని సూటిగా చెప్పడం
  alternative: ఆ ఆలస్యానికి కరుణాపూర్వకమైన లేదా వ్యూహాత్మకమైన కారణాన్ని అనువాదంలోనే వివరించడం
  rationale: మూల వాక్యం కారణాన్ని ఈ వచనంలో వివరించదు. అందువల్ల కథనంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను తగ్గించకుండా అలాగే నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలి. ‘ఉన్నాడని’ గ్రీకు వర్తమాన కాలాన్ని తెలుగులో సహజంగా నిలుపుతున్నందున కాలభేదంపై పాదసూచిక అవసరం లేదు.
