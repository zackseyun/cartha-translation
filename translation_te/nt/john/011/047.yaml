id: JHN.11.47
reference: John 11:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: συνήγαγον οὖν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι συνέδριον, καὶ ἔλεγον· Τί ποιοῦμεν ὅτι οὗτος ὁ ἄνθρωπος πολλὰ ⸂ποιεῖ σημεῖα⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/047.yaml
  text: So the chief priests and the Pharisees gathered a council and were saying[a], “What are we doing? For this man is doing many signs.”
translation:
  language: te
  text: కాబట్టి ప్రధాన యాజకులూ పరిసయ్యులూ మహాసభను కూడబెట్టారు.[a] వారు, “మనం ఏం చేస్తున్నాం? ఎందుకంటే ఈ మనిషి అనేక సూచక క్రియలు చేస్తున్నాడు” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే సన్హెద్రిన్ అని పిలువబడే యూదుల పాలక మండలి.
    reason: ‘మహాసభ’గా అనువదించిన συνέδριον యొక్క సంప్రదాయ సాంకేతిక పేరు, సందర్భానుసార సంస్థాగత గుర్తింపును తెలియజేస్తుంది.
lexical_decisions:
- source_word: συνήγαγον
  choice: సమావేశపరచి
  rationale: సυνέδριον‌ను కర్మగా తీసుకొని, నాయకులు సభను కూడబెట్టారనే సకర్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: లాజరును లేపిన సూచక క్రియకు ప్రతిస్పందనగా జరిగిన పరిణామాన్ని సూచించే తార్కిక-కథన సంబంధాన్ని నిలుపుతుంది.
- source_word: ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: అగ్రశ్రేణి యాజక అధికారులను సూచించే స్థిరమైన తెలుగు పదబంధం; అనేక మంది ప్రధాన యాజక పదవీధారులు ఉన్నారనే అపార్థాన్ని తగ్గిస్తుంది.
- source_word: Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: ఈ యూదు మతవర్గానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: συνέδριον
  choice: మహాసభ
  rationale: సందర్భంలో యూదుల పాలక మండలిని సూచిస్తుంది; సాధారణ ‘సభ’ కంటే సంస్థాగత భావాన్ని స్పష్టంగా ఇస్తూనే ‘సన్హెద్రిన్’ అనే సాంకేతిక లిప్యంతరీకరణను ప్రధాన పాఠ్యంలో పెట్టదు.
- source_word: ἔλεγον
  choice: అని అంటూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న లేదా పునరావృత మాటల భావాన్ని నిలుపుతుంది.
- source_word: Τί ποιοῦμεν
  choice: మనం ఏం చేస్తున్నాం?
  rationale: గ్రీకులోని వర్తమాన సూచక రూపాన్ని నేరుగా నిలుపుతుంది; సందర్భం దీనికి ఆందోళనతో కూడిన deliberative భావాన్ని ఇస్తుంది.
- source_word: ὅτι
  choice: —దానికి ప్రత్యేక సంధానపదం లేకుండా తదుపరి వాక్యంగా
  rationale: తెలుగు ప్రత్యక్ష సంభాషణలో కారణాన్ని వేరే వాక్యంగా చెప్పడం సహజం; ‘ఎందుకంటే’ చేర్చకుండానే సందర్భం కారణ సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: ఈ మనిషి
  rationale: లింగాన్ని, అలాగే వక్తల మాటలోని కొంత దూరం లేదా తృణీకార ధోరణిని నిలుపుతుంది.
- source_word: πολλὰ ποιεῖ σημεῖα
  choice: అనేక సూచక క్రియలు చేస్తున్నాడు
  rationale: వర్తమాన కాలాన్ని నిలుపుతూ, యోహాను రచనలో σημεῖα అనేవి యేసు గుర్తింపును వెల్లడించే కార్యాలనే భావాన్ని ‘అద్భుతాలు’ కంటే స్పష్టంగా కాపాడుతుంది.
theological_decisions:
- issue: యోహాను సువార్తలో σημεῖα అనువాదం
  choice: సూచక క్రియలు
  alternative: అద్భుతాలు; అద్భుత సూచనలు
  rationale: ఈ కార్యాలు ఆశ్చర్యకరమైనవి మాత్రమే కాక యేసు ఎవరో సూచించేవి కూడా. ‘సూచక క్రియలు’ ఆ యోహానీయ ధార్మిక బరువును వివరణాత్మకంగా విస్తరించకుండా నిలుపుతుంది.
- issue: συνέδριον యొక్క సంస్థాగత గుర్తింపు
  choice: మహాసభ
  alternative: సభ; సన్హెద్రిన్
  rationale: సందర్భంలో యెరూషలేము పాలక మండలి ఉద్దేశించబడే అవకాశం బలంగా ఉంది. ‘మహాసభ’ చదవడానికి సహజంగా ఉండి సంస్థాగత భావాన్ని ఇస్తుంది; సంప్రదాయ సాంకేతిక పేరు పాదసూచికలో ఇవ్వబడింది.
- issue: Τί ποιοῦμεν యొక్క వ్యాకరణ ఉద్రిక్తత
  choice: మనం ఏం చేస్తున్నాం?
  alternative: మనం ఏం చేయాలి?
  rationale: మూలంలోని వర్తమాన సూచక రూపాన్ని మార్చకుండా ఉంచుతుంది. ఇది వారి నిష్క్రియపై ఆందోళనను వ్యక్తం చేయవచ్చు; ‘ఏం చేయాలి?’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని deliberative భావాన్ని నిర్ణయించినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘అని అంటూ ఉన్నారు’ ద్వారా అసంపూర్ణ క్రియాభావం, ‘సూచక క్రియలు’ ద్వారా యోహానీయ పదప్రయోగం నిలుపబడ్డాయి. పాదసూచిక గుర్తు అది వివరిస్తున్న ‘మహాసభ’కు వెంటనే ఉంచబడింది.
