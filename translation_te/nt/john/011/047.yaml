revisions:
- from: కాబట్టి ప్రధాన యాజకులూ పరిసయ్యులూ మహాసభను సమావేశపరచి[a], “మనం ఏం చేస్తున్నాం? ఈ మనిషి అనేక సూచక క్రియలు చేస్తున్నాడే!” అని అంటూ ఉన్నారు.
  to: కాబట్టి ప్రధాన యాజకులూ పరిసయ్యులూ మహాసభను కూడబెట్టారు.[a] వారు, “మనం ఏం చేస్తున్నాం? ఎందుకంటే ఈ మనిషి అనేక సూచక క్రియలు చేస్తున్నాడు” అని అన్నారు.
  rationale: The revision restores the explicit causal relation introduced by ὅτι, removes unsupported Telugu emphasis, and recasts the sentence in idiomatic modern Telugu. The aorist gathering is rendered by కూడబెట్టారు; the following speech is rendered naturally without forcing an awkward periphrastic equivalent for the imperfect ἔλεγον. The footnote remains anchored immediately after మహాసభను and explains the traditional institutional designation without making it an additional claim in the main text.
