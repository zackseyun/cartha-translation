id: JHN.11.56
reference: John 11:56
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐζήτουν οὖν τὸν Ἰησοῦν καὶ ἔλεγον μετ’ ἀλλήλων ἐν τῷ ἱερῷ ἑστηκότες· Τί δοκεῖ ὑμῖν; ὅτι οὐ μὴ ἔλθῃ εἰς τὴν ἑορτήν;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/056.yaml
  text: So they were looking for Jesus and saying to one another as they stood in the temple courts[b][a], “What do you think? That he certainly will not come to the feast?”
translation:
  language: te
  text: 'కాబట్టి వారు యేసు కోసం వెదుకుతూ, దేవాలయ ప్రాంగణంలో[a] నిలబడి ఒకరితో ఒకరు ఇలా చెప్పుకుంటూ ఉన్నారు: “మీకేమనిపిస్తోంది? ఆయన పండుగకు అసలు రాడా?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి గ్రీకు పదం ἱερόν అంతర్గత పరిశుద్ధస్థలాన్ని మాత్రమే కాదు, దేవాలయ సముదాయాన్ని లేదా దాని ప్రాంగణాలను కూడా సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా, “ఆయన పండుగకు ఎంతమాత్రమూ రాడా?” గ్రీకులో ఇక్కడ బలమైన నిరాకరణ (οὐ μή) ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: వెదుకుతూ
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పదేపదే జరిగిన వెదకడాన్ని సూచిస్తుంది; ఈ సందర్భంలో సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: οὖν
  choice: అందువల్ల
  rationale: ముందున్న సందర్భం నుంచి ఏర్పడిన కథన కొనసాగింపును లేదా పర్యవసానాన్ని తెలియజేస్తుంది.
- source_word: ἔλεγον
  choice: మాట్లాడుకుంటున్నారు
  rationale: అసంపూర్ణ భూతకాల భావాన్ని, పరస్పరం కొనసాగుతున్న సంభాషణను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μετ’ ἀλλήλων
  choice: ఒకరితో ఒకరు
  rationale: గుంపులోని పరస్పర సంభాషణను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν τῷ ἱερῷ
  choice: దేవాలయ ప్రాంగణాల్లో
  rationale: ἱερόν అంతర్గత పరిశుద్ధ స్థలాన్ని మాత్రమే కాక దేవాలయ సముదాయం లేదా ఆవరణలను సూచిస్తుంది.
- source_word: ἑστηκότες
  choice: నిలబడి
  rationale: వారు ఉన్న స్థితిని తెలిపే పరిపూర్ణ కృదంత భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: Τί δοκεῖ ὑμῖν;
  choice: మీకేమనిపిస్తోంది?
  rationale: అభిప్రాయం అడిగే గ్రీకు నుడికారానికి సమకాలీన తెలుగులో సహజమైన సమానం.
- source_word: ὅτι
  choice: తదుపరి ప్రశ్నను పరిచయం చేసే నిర్మాణం
  rationale: తెలుగులో ‘అని’ వంటి పదాన్ని బలవంతంగా చేర్చకుండా, రెండో ప్రశ్నను మొదటి ప్రశ్నలోని అభిప్రాయ విషయంగా సహజంగా ఉంచింది.
- source_word: οὐ μὴ ἔλθῃ
  choice: అసలు రాడా?
  rationale: οὐ μή యొక్క బలమైన నిరాకరణను ‘అసలు’ ద్వారా నిలుపుతూ, ప్రశ్నగా ఉన్న వాక్యపు నిజమైన అనిశ్చితిని కూడా కాపాడుతుంది.
- source_word: εἰς τὴν ἑορτήν
  choice: పండుగకు
  rationale: సందర్భంలోని యూదుల పస్కా పండుగను సూచించేందుకు సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే పదం.
theological_decisions:
- issue: οὐ μὴ కలిగిన ప్రశ్న యొక్క భావం
  choice: “ఆయన పండుగకు అసలు రాడా?”
  alternative: “ఆయన పండుగకు ఎంతమాత్రమూ రాడని అనుకుంటున్నారా?”
  rationale: బలమైన నిరాకరణను నిలుపుతూ, మాటలాడుతున్నవారు యేసు రాకపై వ్యక్తం చేసిన సందేహం లేదా ఊహను ఒకే ఖచ్చిత భావంగా పరిష్కరించకుండా ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కథన శైలి. గ్రీకు అసంపూర్ణ భూతకాలాల కొనసాగింపు భావాన్ని ‘వెదుకుతూ’, ‘మాట్లాడుకుంటున్నారు’ ద్వారా తెలిపింది; ἱερόν మరియు οὐ μή సూక్ష్మతలను పాదసూచికల్లో స్పష్టం చేసింది.
