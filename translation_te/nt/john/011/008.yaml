id: JHN.11.8
reference: John 11:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ οἱ μαθηταί· Ῥαββί, νῦν ἐζήτουν σε λιθάσαι οἱ Ἰουδαῖοι, καὶ πάλιν ὑπάγεις ἐκεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/008.yaml
  text: The disciples said to him[a], “Rabbi, just now the Jews were seeking to stone you, and are you going there again?”
translation:
  language: te
  text: శిష్యులు ఆయనతో, “రబ్బీ, ఇప్పుడే యూదులు[a] మిమ్మల్ని రాళ్లతో కొట్టాలని ప్రయత్నించారు; అయినా మీరు మళ్లీ అక్కడికి వెళ్తున్నారా?” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యూదయవాసులు”; సందర్భానుసారంగా “యూదయ నాయకులు.” యోహాను సువార్తలో “యూదులు” అనే పదం తరచుగా యూదులందరినీ కాక, యూదయలో యేసును వ్యతిరేకించినవారిని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγουσιν
  choice: అన్నారు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని ఆధునిక తెలుగు కథనశైలికి సహజమైన భూతకాలంతో అనువదించాం.
- source_word: Ῥαββί
  choice: రబ్బీ
  rationale: మూలంలోని సెమిటిక్ సంబోధనను అలాగే ఉంచడం ద్వారా శిష్యులు యేసును సంబోధించిన ప్రత్యేక బిరుదు, యోహాను శైలి నిలుస్తాయి.
- source_word: νῦν
  choice: ఇప్పుడే
  rationale: ఇక్కడ ఇది ప్రస్తుత క్షణాన్ని మాత్రమే కాక, ఆ బెదిరింపు అతి ఇటీవలే జరిగిందనే భావాన్ని తెలియజేస్తుంది.
- source_word: ἐζήτουν
  choice: కొట్టాలని చూశారు
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగిన లేదా ప్రయత్నించిన చర్య భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ప్రయత్నం సఫలమైందని సూచించదు.
- source_word: λιθάσαι
  choice: రాళ్లతో కొట్టాలని
  rationale: రాళ్లతో కొట్టడమే మూలపదపు ప్రత్యక్ష భావం. మరణం ఉద్దేశమై ఉండవచ్చుగాని, మూలంలో స్పష్టంగా లేని ‘చంపాలని’ అనే పదాన్ని చేర్చలేదు.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: ఇది పదానికి సాధారణ, ప్రత్యక్ష అర్థం. యోహాను సందర్భంలో యూదయ ప్రాంతపు ప్రత్యర్థులను లేదా యూదా నాయకులను సూచించే అవకాశం ఉన్నందున ఆ భావాలను పాదసూచికలో ఉంచాం.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: పునరావృతిని సహజంగా, నేరుగా తెలియజేస్తుంది.
- source_word: ὑπάγεις
  choice: వెళ్తున్నారా
  rationale: ఇక్కడ ముందుగా ప్రస్తావించిన ప్రమాదకరమైన ప్రదేశానికి వెళ్లడాన్ని సూచిస్తుంది; గౌరవార్థక బహువచనం ఆధునిక తెలుగులో సంబోధనకు సహజం.
- source_word: ἐκεῖ
  choice: అక్కడికి
  rationale: ముందు ప్రస్తావించిన యూదయ ప్రాంతాన్ని సూచించే స్థానవాచకాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యోహాను సువార్తలో οἱ Ἰουδαῖοι ఎవరిని సూచిస్తుంది?
  choice: యూదులు
  alternative: యూదయవాసులు; సందర్భానుసారంగా యూదా నాయకులు
  rationale: ప్రధాన పాఠంలో మూలపదపు సాధారణ అర్థాన్ని ఉంచాం. అయితే యోహాను రచనలో ఈ పదం యూదులందరినీ కాక, యూదయలో యేసును వ్యతిరేకించిన నిర్దిష్ట వర్గాన్ని సూచించే సందర్భాలు ఉన్నాయి. ఆ సందర్భసాధ్యమైన పరిమిత అర్థాన్ని ప్రధాన పాఠంలో నిర్బంధించకుండా పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణశైలిని వాడాం. యేసును ఉద్దేశించిన ఏకవచన గ్రీకు సర్వనామాన్ని తెలుగులో సహజమైన గౌరవార్థక రూపాలైన ‘మిమ్మల్ని,’ ‘మీరు’గా ఇచ్చాం. ‘అయినా’ శిష్యుల ప్రశ్నలోని ఆశ్చర్యం మరియు ప్రమాదం ఉన్నప్పటికీ తిరిగి వెళ్లడమనే వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
