  edition: SBLGNT
  text: ἔπειτα μετὰ τοῦτο λέγει τοῖς μαθηταῖς· Ἄγωμεν εἰς τὴν Ἰουδαίαν πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/007.yaml
  text: Then after this he says to the disciples[a], “Let us go into Judea again.”
translation:
  language: te
  text: 'ఆ తర్వాత ఆయన శిష్యులతో ఇలా అంటున్నాడు: “మనం మళ్లీ యూదయలోకి[a] వెళ్దాం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యూదయకు.” ఇక్కడ గ్రీకు విభక్త్యర్థక పదం ఒక ప్రాంతం “లోపలికి” వెళ్లడాన్నిగానీ, ఆ ప్రాంతం “వైపు/కు” వెళ్లడాన్నిగానీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα μετὰ τοῦτο
  choice: ఆ తర్వాత
  rationale: రెండు కాలసూచక పదబంధాలు కలిసి కథనంలోని తదుపరి క్రమాన్ని సూచిస్తున్నాయి. వాటిని విడివిడిగా అనువదిస్తే తెలుగులో అనవసర పునరుక్తి కలుగుతుంది; ‘ఆ తర్వాత’ సహజంగా మొత్తం భావాన్ని అందిస్తుంది.
- source_word: λέγει
  choice: అంటున్నాడు
  rationale: యోహాను ఉపయోగించిన చారిత్రక వర్తమాన కాలాన్ని నిలుపుతూ, కథనానికి ఉన్న సజీవతను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοῖς μαθηταῖς
  choice: శిష్యులతో
  rationale: దత్తివాచక పరోక్ష కర్మను తెలుగు మాటలాడే నిర్మాణానికి అనుగుణంగా ‘శిష్యులతో ... అంటున్నాడు’ అని ఇచ్చాం. మూలంలో లేని ‘తన’ అనే పదాన్ని చేర్చలేదు.
- source_word: Ἄγωμεν
  choice: మనం ... వెళ్దాం
  rationale: ప్రథమ పురుష బహువచన ప్రేరణార్థక సంభావనను సహజమైన, భాగస్వామ్య ఆహ్వానంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: యూదయలోకి
  rationale: εἰς సూచించే ఒక ప్రాంతం లోపలికి కదలికను స్పష్టంగా నిలుపుతుంది; సందర్భంలో ‘యూదయకు’ అని కూడా సహజంగా అనువదించవచ్చు.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: మునుపు వెళ్లిన ప్రాంతానికి తిరిగి వెళ్లడాన్ని సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: యోహాను కథనంలోని చారిత్రక వర్తమాన కాలం
  choice: ‘అంటున్నాడు’ అని వర్తమాన కాలాన్ని నిలుపడం
  alternative: తెలుగు కథనరీతికి అనుగుణంగా ‘అన్నాడు’ అని భూతకాలంలో మార్చడం
  rationale: మూలంలోని λέγει వర్తమాన రూపాన్ని నిలుపడం యోహాను కథన శైలిలోని సజీవతను కాపాడుతుంది; దీనివల్ల ప్రత్యేక సిద్ధాంతార్థం ఏదీ చేర్చబడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని చారిత్రక వర్తమానాన్ని నిలిపి, తెలుగు ప్రత్యక్ష సంభాషణకు తగిన వాక్యనిర్మాణం ఎంచుకున్నాం.
