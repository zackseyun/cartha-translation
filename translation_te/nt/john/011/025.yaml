  yaml_path: translation/nt/john/011/025.yaml
  text: Jesus said to her[a], “I am the resurrection and the life. The one who believes in me, even if he dies, will live,”
translation:
  language: te
  text: 'యేసు ఆమెతో ఇలా అన్నాడు: “పునరుత్థానమూ జీవమూ నేనే. నన్ను విశ్వసించేవాడు చనిపోయినా జీవిస్తాడు,[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నన్ను విశ్వసించే ఎవరైనా చనిపోయినా జీవిస్తారు.” గ్రీకులో “విశ్వసించేవాడు … అతడు చనిపోయినా” అనే పుంలింగ ఏకవచన రూపం అందరినీ ప్రతినిధిగా సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῇ
  choice: ఆమెతో ఇలా అన్నాడు
  rationale: దత్తివ విభక్తిలోని స్త్రీలింగ ఏకవచన సర్వనామం సందర్భంలో మార్తాను సూచిస్తుంది; ప్రత్యక్ష వాక్యానికి సహజమైన తెలుగు పరిచయంగా ‘ఇలా అన్నాడు’ వాడబడింది.
- source_word: Ἐγώ εἰμι
  choice: నేనే
  rationale: స్పష్టంగా ఉంచిన ἐγώ వల్ల కలిగే ఉద్ఘాటనను తెలుగు ‘నేనే’ సహజంగా, బలంగా వ్యక్తం చేస్తుంది.
- source_word: ἡ ἀνάστασις
  choice: పునరుత్థానం
  rationale: ఇక్కడ మరణించినవారి పునరుత్థానమే ఉద్దేశం; సాధారణంగా లేవడం కాదు.
- source_word: ἡ ζωή
  choice: జీవం
  rationale: ἀνάστασις‌తో సమాంతరంగా ఉన్న నిర్దిష్టమైన స్వీయ-గుర్తింపును నిలుపుతుంది; ‘జీవితం’ కంటే ‘జీవం’ యోహాను సందర్భంలోని జీవదాయక, నిత్యజీవ భావానికి విస్తృతంగా సరిపోతుంది.
- source_word: ὁ πιστεύων εἰς ἐμὲ
  choice: నన్ను విశ్వసించేవాడు
  rationale: వర్తమాన కృదంతం విశ్వసించే వ్యక్తిని లక్షణాత్మకంగా సూచిస్తుంది. πιστεύω + εἰς యొక్క సంబంధాత్మక నమ్మకం తెలుగులో ‘నన్ను విశ్వసించు’ అని సహజంగా వ్యక్తమవుతుంది.
- source_word: κἂν ἀποθάνῃ
  choice: చనిపోయినా
  rationale: κἄν యొక్క concessive భావాన్ని, దాని వెంట ఉన్న aorist subjunctive సంఘటనను సహజమైన తెలుగు concessive రూపం వ్యక్తం చేస్తుంది.
- source_word: ζήσεται
  choice: జీవిస్తాడు
  rationale: భవిష్యత్తు వాగ్దానాన్ని నేరుగా నిలుపుతూ, గ్రీకులో స్పష్టంగా లేని ‘మళ్లీ’ అనే భావాన్ని చేర్చదు.
theological_decisions:
- issue: Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή లో యేసు స్వీయ-గుర్తింపు పరిధి
  choice: పునరుత్థానమూ జీవమూ నేనే
  alternative: పునరుత్థానాన్ని, జీవాన్ని ఇచ్చేవాడిని నేనే
  rationale: మూలంలోని ప్రత్యక్ష విధేయ స్వీయ-గుర్తింపును కార్యాత్మక వివరణగా మార్చకుండా నిలుపుతుంది; ‘నేనే’ ఉద్ఘాటనను కాపాడుతుంది.
- issue: ὁ πιστεύων మరియు ఏకవచన క్రియలలో ప్రతినిధి పుంలింగం
  choice: నన్ను విశ్వసించేవాడు చనిపోయినా జీవిస్తాడు
  alternative: నన్ను విశ్వసించే ఎవరైనా చనిపోయినా జీవిస్తారు
  rationale: గ్రీకు ఏకవచన నిర్మాణాన్ని తెలుగులో సహజంగా నిలుపుతూ, అది పురుషులకు మాత్రమే పరిమితం కాదనే సమగ్ర భావాన్ని పాదటిప్పణిలో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘పునరుత్థానం’ స్థిరమైన బైబిలు-తాత్త్విక పదంగా ఉంచబడింది; వాక్యభారం సహజంగా ఉండేందుకు ‘పునరుత్థానమూ జీవమూ నేనే’ అనే తెలుగు క్రమం ఎంచుకోబడింది.
