id: JHN.11.40
reference: John 11:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· Οὐκ εἶπόν σοι ὅτι ἐὰν πιστεύσῃς ⸀ὄψῃ τὴν δόξαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/040.yaml
  text: Jesus said to her, “Did I not tell you that if you believe, you will see the glory of God?”
translation:
  language: te
  text: యేసు ఆమెతో, “నీవు నమ్మితే దేవుని మహిమను చూస్తావని నేను నీకు చెప్పలేదా?” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకు మూలంలో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, ఆధునిక తెలుగు కథనంలో భూతకాల రూపమైన ‘అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: αὐτῇ
  choice: ఆమెతో
  rationale: సందర్భంలో ఇది మార్తను సూచించే పరోక్ష కర్మ; తెలుగులో ‘ఆమెతో’ సహజమైన ప్రయోగం.
- source_word: Οὐκ εἶπόν σοι
  choice: నేను నీతో చెప్పలేదా?
  rationale: అంగీకార సమాధానాన్ని ఆశించే అలంకార ప్రశ్నను ఈ రూపం నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: ἐὰν πιστεύσῃς
  choice: నీవు నమ్మితే
  rationale: πιστεύω అనే క్రియకు ‘నమ్ము’ సాధారణమైన, సందర్భోచితమైన అనువాదం; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- source_word: ὄψῃ
  choice: చూస్తావని
  rationale: భవిష్యత్ భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; పరోక్ష ఉద్ధరణ నిర్మాణానికి ‘అని’ అవసరం.
- source_word: δόξαν
  choice: మహిమను
  rationale: యోహాను సువార్తలోని దైవిక ప్రత్యక్షత భావాన్ని నిలిపే స్థిరమైన బైబిలీయ తెలుగు పదం.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: గ్రీకు షష్ఠీ విభక్తిలోని సంబంధాన్ని తెలుగులో సహజమైన స్వామ్య రూపంతో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: నమ్మకానికి దేవుని మహిమను చూడటానికి ఉన్న సంబంధం
  choice: యేసు మార్తతో చెప్పిన షరతుతో కూడిన వాగ్దానంగా నేరుగా అనువదించడం
  alternative: దీనిని విశ్వాసం మరియు అద్భుతాల గురించి సార్వత్రిక సూత్రంగా లేదా లాజరు లేపబడటానికే పరిమితమైన వాగ్దానంగా స్పష్టీకరించడం
  rationale: మూల వాక్యం విస్తృత సిద్ధాంతపరమైన పరిధిని నిర్ణయించకుండా నేరుగా షరతుతో కూడిన మాటను ఉంచుతుంది; అనువాదం అదే ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. మూలంలోని అలంకార ప్రశ్నను, షరతుతో కూడిన వాగ్దానాన్ని నిలిపింది.
