  source_fidelity: The draft accurately represents the rhetorical question, the conditional ‘if you believe,’ the future result ‘you will see,’ and ‘the glory of God.’ The narrative past for the Greek historical present is appropriate in modern Telugu.
  naturalness: The wording is generally clear and modern. However, ‘నేను నీతో చెప్పలేదా?’ can suggest ‘did I not speak with you?’ In this construction, ‘నేను నీకు చెప్పలేదా?’ is the more idiomatic Telugu equivalent of Greek σοι (‘to you’).
  terminology: ‘నమ్మితే,’ ‘దేవుని,’ and ‘మహిమను’ are appropriate, established, and theologically noninterpretive choices. No footnote is required.
  issues:
