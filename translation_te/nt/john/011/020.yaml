id: JHN.11.20
reference: John 11:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ οὖν Μάρθα ὡς ἤκουσεν ὅτι Ἰησοῦς ἔρχεται ὑπήντησεν αὐτῷ· ⸀Μαρία δὲ ἐν τῷ οἴκῳ ἐκαθέζετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/020.yaml
  text: So when Martha heard that Jesus was coming[a], she went to meet him; but Mary was sitting in the house.
translation:
  language: te
  text: అప్పుడు యేసు వస్తున్నాడని[a] మార్త విన్నప్పుడు, ఆమె ఆయనను కలుసుకోవడానికి వెళ్లింది; అయితే మరియ ఇంట్లో కూర్చొని ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మూల గ్రీకు వాక్యంలో ఇక్కడ వర్తమానకాల క్రియ ఉంది: ‘యేసు వస్తున్నాడు.’'
    reason: గ్రీకు నివేదిత వాక్యంలో ఉన్న సజీవ వర్తమాన రూపాన్ని స్పష్టపరుస్తుంది; తెలుగు ప్రధాన పాఠం దానిని సహజంగా ‘వస్తున్నాడని’ అని అందిస్తుంది.
lexical_decisions:
- source_word: οὖν
  choice: అప్పుడు
  rationale: ముందటి వాక్యంతో కథన సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సందర్భంలో దీనిని కఠినమైన తార్కిక నిర్ధారణగా చూపదు.
- source_word: ὡς
  choice: విన్నప్పుడు
  rationale: ὡς ఇక్కడ కాలసంబంధ ఉపవాక్యాన్ని పరిచయం చేస్తుంది. ‘విన్న వెంటనే’ అని అనడం మూలంలో స్పష్టంగా లేని తక్షణత్వాన్ని చేర్చుతుంది.
- source_word: ἤκουσεν
  choice: విన్నప్పుడు
  rationale: ἀκούω యొక్క ప్రత్యక్ష అర్థమైన ‘విను’ను నిలుపుతూ, తెలుగు కాలసంబంధ వాక్య నిర్మాణంలో సహజంగా అమర్చబడింది.
- source_word: ἔρχεται
  choice: వస్తున్నాడని
  rationale: గ్రీకు వర్తమానకాల క్రియలోని కొనసాగుతున్న రాక భావాన్ని తెలుగు సహజంగా వర్తమాన ప్రగతిరూపంతోనే నిలుపుతుంది.
- source_word: ὑπήντησεν αὐτῷ
  choice: ఆమె ఆయనను కలుసుకోవడానికి వెళ్లింది
  rationale: ὑπαντάωలో ఉన్న ఒకరిని కలవడానికి వెళ్లే దిశాత్మక భావాన్ని వ్యక్తం చేస్తుంది; ‘ఎదుర్కోవడానికి’ అనే పదానికి తెలుగులో రావచ్చే ప్రతికూల భావాన్ని నివారిస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మార్త చేసిన పనికీ మరియ ఉన్న స్థితికీ మధ్యనున్న స్వల్ప వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐν τῷ οἴκῳ
  choice: ఇంట్లో
  rationale: οἶκος అనే స్పష్టమైన నామవాచకాన్ని సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἐκαθέζετο
  choice: కూర్చొని ఉంది
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న స్థితిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘అలాగే కూర్చుండిపోయింది’ వంటి అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: Μάρθα / Μαρία / Ἰησοῦς
  choice: మార్త / మరియ / యేసు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాలను ఉపయోగిస్తుంది.
