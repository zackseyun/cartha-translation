translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని కాలసంబంధ నిర్మాణం, మార్త చర్యకు మరియ స్థితికి మధ్య వ్యత్యాసం, అలాగే ἔρχεται యొక్క వర్తమాన భావం నిలుపబడ్డాయి.
