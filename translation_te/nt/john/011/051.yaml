  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἀφ’ ἑαυτοῦ οὐκ εἶπεν, ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου ἐπροφήτευσεν ὅτι ἔμελλεν Ἰησοῦς ἀποθνῄσκειν ὑπὲρ τοῦ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/051.yaml
  text: He did not say this from himself[a], but being high priest that year, he prophesied that Jesus was going to die for the nation[c][b],
translation:
  language: te
  text: అతడు ఈ మాట తనంతట తానే చెప్పలేదు[a], కాని ఆ సంవత్సరంలో ప్రధాన యాజకుడిగా ఉండి, యేసు ఆ జాతి కోసం[c] చనిపోబోతున్నాడని[b] ప్రవచించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన సొంత చొరవతో.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “చనిపోవలసి ఉందని.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఆ జాతి తరఫున.”
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο δὲ ... οὐκ εἶπεν
  choice: అతడు ఈ మాట ... చెప్పలేదు. అయితే
  rationale: δέ యొక్క స్వల్ప అనుసంధాన/వ్యతిరేక భావాన్ని సహజమైన తెలుగు వాక్య ప్రవాహంలో ‘అయితే’ ద్వారా చూపిస్తుంది; మూలంలో లేని కాలార్థక ‘ఇప్పుడు’ను చేర్చదు.
- source_word: ἀφ’ ἑαυτοῦ
  choice: తనంతట తానే
  rationale: ఆ మాట కయప స్వంత మూలం లేదా చొరవ నుండి రాలేదనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: ఆ సంవత్సరంలో ప్రధాన యాజకుడిగా ఉండి
  rationale: పరిస్థితిని తెలిపే గ్రీకు వర్తమాన కృదంత నిర్మాణాన్ని అతిగా కారణార్థకం చేయకుండా నిలుపుతుంది.
- source_word: ἐπροφήτευσεν
  choice: ప్రవచించాడు
  rationale: ఇది నిజమైన ప్రవచన వాక్యమని యోహాను చెప్పే స్పష్టమైన బలాన్ని కాపాడుతుంది.
- source_word: ἔμελλεν ... ἀποθνῄσκειν
  choice: చనిపోబోతున్నాడని
  rationale: రాబోయే మరణాన్ని సూచించే μέλλω + క్రియార్థక రూప భావాన్ని సహజంగా ఇస్తుంది; తప్పనిసరి విధి అనే భావాన్ని ప్రధాన పాఠ్యంలో అదనంగా చేర్చదు.
- source_word: ὑπὲρ τοῦ ἔθνους
  choice: ఆ జనాంగం కోసం
  rationale: ὑπέρ యొక్క ప్రయోజనార్థక/ప్రాతినిధ్య విస్తృతిని నిలుపుతూ, ఈ ఒక్క వాక్యం కంటే సంకుచితమైన ప్రాయశ్చిత్త సూత్రాన్ని బలవంతంగా ప్రవేశపెట్టదు; ἔθνος ఏకవచనాన్ని ‘జనాంగం’గా ఉంచుతుంది.
theological_decisions:
- issue: కయప మాట ప్రవచనంగా ఉండటం
  choice: అతడు ప్రధాన యాజకుడిగా ఉండి ప్రవచించాడని నేరుగా అనువదించడం
  alternative: అతడు తెలిసే దైవప్రేరణతో ప్రవచించాడని లేదా ఇది కేవలం వ్యంగ్యమని వివరించడం
  rationale: మూలపాఠం ‘ప్రవచించాడు’ అని స్పష్టంగా చెబుతుంది; అయితే కయపకు ఎంత అవగాహన ఉండిందో లేదా అతని నీతిస్థితి ఏమిటో చెప్పదు.
- issue: యేసు మరణానికి సంబంధించి ὑπέρ భావం
  choice: ఆ జనాంగం కోసం
  alternative: ఆ జనాంగం తరఫున; ఆ జనాంగం స్థానంలో
  rationale: ప్రయోజనార్థక, ప్రాతినిధ్య భావాలకు చోటిస్తూ, ఈ వచనం మాత్రమే నిర్దేశించని సాంకేతిక ప్రత్యామ్నాయార్థాన్ని ప్రధాన పాఠ్యంలో ఖరారు చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా గంభీరమైన గ్రంథశైలిని నిలుపుతూ రూపొందించబడింది. ‘ప్రధాన యాజకుడు,’ ‘ప్రవచించాడు,’ ‘జనాంగం’ వంటి పదాలు సందర్భంలోని మతపరమైన మరియు జాతీయ భావాలను కాపాడుతాయి.
