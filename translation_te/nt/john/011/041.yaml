id: JHN.11.41
reference: John 11:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἦραν οὖν τὸν ⸀λίθον. ὁ δὲ Ἰησοῦς ἦρεν τοὺς ὀφθαλμοὺς ἄνω καὶ εἶπεν· Πάτερ, εὐχαριστῶ σοι ὅτι ἤκουσάς μου,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/041.yaml
  text: So they took away the stone[a]. And Jesus lifted his eyes upward and said, “Father[b], I thank you that you have heard me,”
translation:
  language: te
  text: 'కాబట్టి వారు ఆ రాయిని తొలగించారు. యేసు పైకి కన్నులెత్తి ఇలా అన్నాడు: “తండ్రీ, నీవు నన్ను ఆలకించినందుకు నీకు కృతజ్ఞతలు తెలియజేస్తున్నాను,”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలపాఠంలో యేసు మాటలు తదుపరి వచనంలో కొనసాగుతాయి.
    reason: verse_boundary
lexical_decisions:
- source_word: ἦραν
  choice: తొలగించారు
  rationale: సమాధి ప్రవేశద్వారం వద్దనున్న రాయిని అక్కడి నుంచి తీసివేయడాన్ని సందర్భానుసారంగా సహజంగా తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: మునుపటి ఆజ్ఞకు పర్యవసానంగా వారు చేసిన కార్యాన్ని సూచించే అన్వయాన్ని నిలుపుతుంది.
- source_word: λίθον
  choice: రాయిని
  rationale: సమాధి ద్వారాన్ని మూసిన వస్తువుకు ఆధునిక తెలుగులో సహజమైన పదం.
- source_word: ἦρεν τοὺς ὀφθαλμοὺς ἄνω
  choice: పైకి కన్నులెత్తి
  rationale: ప్రార్థనలో దృష్టిని పైకి మళ్లించే గ్రీకు రూపకాన్ని సహజమైన తెలుగు నుడికారంతో నిలుపుతుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ బలమైన వ్యతిరేకతకన్నా తదుపరి కథన చర్యకు మార్పును సూచిస్తుంది.
- source_word: Πάτερ
  choice: తండ్రీ
  rationale: సంబోధన రూపాన్ని, సాన్నిహిత్యాన్ని, గౌరవాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εὐχαριστῶ σοι
  choice: నీకు కృతజ్ఞతలు
  rationale: వర్తమాన కృతజ్ఞతా వ్యక్తీకరణను సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: ὅτι ἤκουσάς μου
  choice: నీవు నా ప్రార్థన ఆలకించినందుకు
  rationale: ప్రార్థనా సందర్భంలో ἀκούω సూచించే అనుకూలంగా వినడాన్ని స్పష్టం చేస్తుంది; తెలుగులో కేవలం ‘నన్ను విన్నావు’ అనడం వ్యక్తి మాట వినిపించిందనే అర్థానికి పరిమితం కావచ్చు.
theological_decisions:
- issue: యేసు దేవుణ్ణి సంబోధించిన విధానం
  choice: తండ్రీ
  alternative: ఓ తండ్రీ
  rationale: గ్రీకు సంబోధనలో లేని అదనపు ప్రార్థనా లేదా ప్రాచీన శైలిని చేర్చకుండా సాన్నిహిత్యం, గౌరవం రెండింటినీ నిలుపుతుంది.
- issue: ἤκουσάς μου అనే ప్రార్థనా వ్యక్తీకరణ భావం
  choice: నీవు నా ప్రార్థన ఆలకించినందుకు
  alternative: నీవు నన్ను విన్నందుకు
  rationale: తండ్రి యేసు ప్రార్థనను అనుకూలంగా ఆలకించాడనే సందర్భార్థాన్ని తెలియజేస్తుంది; అయితే దానికి మించిన సిద్ధాంత వివరణను చేర్చదు.
- issue: గ్రీకు ఏఓరిస్ట్ ἤκουσάς కాలభావం
  choice: ఆలకించినందుకు
  alternative: ఆలకించావు గనుక
  rationale: తెలుగు భూతకృదంత రూపం పూర్తయిన క్రియను సహజంగా తెలియజేస్తుంది; గ్రీకు ఏఓరిస్ట్‌కు అవసరానికి మించిన కాలసూక్ష్మతను బలవంతంగా జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన-ప్రార్థనా శైలి. ‘పైకి కన్నులెత్తి’ ద్వారా మూలంలోని దృశ్యరూపం నిలుపబడింది.
