revisions:
- from: కాబట్టి వారు ఆ రాయిని తొలగించారు. అప్పుడు యేసు పైకి కన్నులెత్తి, “తండ్రీ, నీవు నా ప్రార్థన ఆలకించినందుకు నీకు కృతజ్ఞతలు,” అని అన్నాడు.[a]
  to: 'కాబట్టి వారు ఆ రాయిని తొలగించారు. యేసు పైకి కన్నులెత్తి ఇలా అన్నాడు: “తండ్రీ, నీవు నన్ను ఆలకించినందుకు నీకు కృతజ్ఞతలు తెలియజేస్తున్నాను,”[a]'
  rationale: The revision removes the unsupported explicit object ‘ప్రార్థన,’ supplies the explicit first-person thanksgiving sense, and retains the source’s continuing speech with a correctly placed verse-boundary note. No theological expansion has been introduced.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:29:44Z'
review_pass:
  verdict: revise
  source_fidelity: ‘నా ప్రార్థన’ adds an object not expressed in the Greek (μου, ‘me’), even though prayer is the context. The revised wording retains the source’s direct object while allowing the context to convey its prayer sense. ‘కృతజ్ఞతలు’ alone is elliptical; adding ‘తెలియజేస్తున్నాను’ explicitly represents εὐχαριστῶ (‘I thank [you]’).
  naturalness: The revised direct-speech introduction with a colon and the full thanksgiving expression is natural modern standard Telugu. ‘పైకి కన్నులెత్తి’ appropriately retains the source image and suits a dignified narrative-prayer register.
  terminology: ‘తండ్రీ’ is an appropriate respectful Telugu vocative for Πάτερ. ‘ఆలకించినందుకు’ naturally conveys favorable hearing in this prayer context without adding doctrinal explanation. ‘రాయిని తొలగించారు’ accurately fits removal of the tomb stone.
  issues:
  - severity: medium
    issue: ‘నా ప్రార్థన’ is more specific than the Greek wording.
    rationale: ὅτι ἤκουσάς μου literally refers to hearing ‘me’; it does not explicitly say ‘my prayer.’ The setting makes prayer clear, but the translation should not add the object.
  - severity: low
    issue: ‘నీకు కృతజ్ఞతలు’ omits the explicit first-person verbal force of εὐχαριστῶ.
    rationale: Although understandable idiomatically, it is incomplete as a direct equivalent. ‘నీకు కృతజ్ఞతలు తెలియజేస్తున్నాను’ is both natural and fully explicit.
  - severity: low
    issue: The verse-continuation footnote should be anchored within the continuing quotation and worded as a textual formatting note.
    rationale: The Greek discourse continues into the next verse; placing the marker after the continuing comma makes its function clear.
  revised_text: 'కాబట్టి వారు ఆ రాయిని తొలగించారు. యేసు పైకి కన్నులెత్తి ఇలా అన్నాడు: “తండ్రీ, నీవు నన్ను ఆలకించినందుకు నీకు కృతజ్ఞతలు తెలియజేస్తున్నాను,”[a]'
