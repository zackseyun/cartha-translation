source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν πάλιν ἐμβριμώμενος ἐν ἑαυτῷ ἔρχεται εἰς τὸ μνημεῖον· ἦν δὲ σπήλαιον, καὶ λίθος ἐπέκειτο ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/038.yaml
  text: Jesus[a], then, again deeply moved within himself, came to the tomb. Now it was a cave, and a stone was lying against it.
translation:
  language: te
  text: అప్పుడు యేసు[a] తనలో తాను మళ్లీ తీవ్రంగా కలతచెంది సమాధి వద్దకు వచ్చాడు. అది ఒక గుహ; దానికి అడ్డంగా ఒక రాయి పెట్టి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తనలో తాను ఆగ్రహించి,” లేక “తనలో తాను ఎంతో వ్యాకులపడి”; ఇక్కడి గ్రీకు క్రియ అసాధారణంగా బలమైనది; అది దుఃఖం మాత్రమే కాక మరేదో భావాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: అప్పుడు
  rationale: ముందటి సంఘటనతో సంబంధాన్ని, కథన పురోగతిని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: యేసు భావోద్వేగ స్పందన మరొకసారి కలిగిందనే పునరావృత్తిని నేరుగా తెలియజేస్తుంది.
- source_word: ἐμβριμώμενος ἐν ἑαυτῷ
  choice: తనలో తాను తీవ్రంగా కలతచెంది
  rationale: గ్రీకు పదబంధంలోని బలమైన అంతరంగ భావోద్వేగాన్ని నిలుపుతూ, అది దుఃఖమా ఆగ్రహమా అని ప్రధాన పాఠంలో ఏకపక్షంగా నిర్ణయించదు.
- source_word: ἔρχεται
  choice: వచ్చాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని సహజమైన తెలుగు కథన శైలిలో భూతకాలంగా అందిస్తుంది.
- source_word: μνημεῖον
  choice: సమాధి
  rationale: గుహ రూపంలో ఉన్న శవపేటిక స్థలాన్ని సూచించడానికి సాధారణంగా అర్థమయ్యే తెలుగు పదం.
- source_word: σπήλαιον
  choice: గుహ
  rationale: మూలంలోని cave అనే భౌతిక స్వరూపాన్ని నేరుగా తెలుపుతుంది.
- source_word: λίθος
  choice: రాయి
  rationale: సమాధి ప్రవేశాన్ని మూసే రాయిని సూచించే సహజమైన తెలుగు సమానం.
- source_word: ἐπέκειτο ἐπ’ αὐτῷ
  choice: దానికి అడ్డంగా ఒక రాయి పెట్టి ఉంది
  rationale: గుహసమాధి ప్రవేశానికి రాయి అడ్డుగా ఉంచబడిన స్థితిని సహజంగా తెలియజేస్తుంది; రాయి పైన సమతలంగా ఉందనే అపార్థాన్ని నివారిస్తుంది.
theological_decisions:
- issue: యేసుకు సంబంధించిన ἐμβριμώμενος అనే క్రియలోని భావోద్వేగ బలం
  choice: తీవ్రమైన అంతరంగ కలతగా అనువదించి, భావం దుఃఖానికే లేదా ఆగ్రహానికే పరిమితమని నిర్ణయించలేదు.
  alternative: “తనలో తాను ఆగ్రహించాడు” లేదా “తనలో తాను ఎంతో వ్యాకులపడ్డాడు.”
  rationale: ఈ గ్రీకు క్రియ బలమైన భావోద్వేగ స్పందనను సూచించినా, ఇక్కడ దాని ఖచ్చితమైన భావ ఛాయ వివాదాస్పదం. అందువల్ల ప్రధాన పాఠం ఆ ఉత్కంఠను నిలుపుతుంది; బలమైన ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. “తీవ్రంగా కలతచెంది” అనే రూపం మూలంలోని భావోద్వేగ తీవ్రతను ఉంచి దాని ఖచ్చిత స్వభావాన్ని అతిగా నిర్దేశించదు. పాదసూచిక గుర్తు ప్రధాన పాఠంలోని “యేసు” తర్వాత ఉంచబడింది.
