id: JHN.11.17
reference: John 11:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐλθὼν οὖν ὁ Ἰησοῦς εὗρεν αὐτὸν τέσσαρας ⸂ἤδη ἡμέρας⸃ ἔχοντα ἐν τῷ μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/017.yaml
  text: So when Jesus arrived, he found that Lazarus had already been in the tomb four days.
translation:
  language: te
  text: అప్పుడు యేసు అక్కడికి రాగానే, లాజరు సమాధిలో ఉండి అప్పటికే నాలుగు రోజులు అయిందని కనుగొన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν
  choice: అక్కడికి వచ్చి
  rationale: ఆరిస్టు క్రియావిశేషణ రూపం ప్రధాన క్రియకు ముందు జరిగిన రాకను సూచిస్తుంది. తెలుగు కథన శైలిలో ‘అక్కడికి వచ్చి’ సహజంగా ఆ కాల సంబంధాన్ని తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సందర్భంతో ఈ సంఘటనను అనుసంధానించే కథన సంబంధాన్ని చూపిస్తుంది; ఇక్కడ బలమైన తార్కిక నిర్ధారణకన్నా సందర్భానుసంధాన భావమే ప్రధానమైనది.
- source_word: εὗρεν
  choice: తెలుసుకున్నాడు
  rationale: ఇక్కడ εὗρεν అనేది లాజరు సమాధిలో ఉన్న కాలవ్యవధిని యేసు అక్కడికి వచ్చాక గ్రహించడం లేదా తెలుసుకోవడం అనే భావంలో ఉంది. ‘కనుగొన్నాడు’ కంటే ‘తెలుసుకున్నాడు’ ఆధునిక తెలుగులో సహజం.
- source_word: αὐτὸν
  choice: లాజరు
  rationale: గ్రీకు సర్వనామానికి ముందటి సందర్భంలో లాజరే స్పష్టమైన సూచ్యుడు. తెలుగులో పేరును పేర్కొనడం అస్పష్టతను నివారిస్తుంది; కొత్త సమాచారాన్ని చేర్చదు.
- source_word: τέσσαρας ἤδη ἡμέρας ἔχοντα
  choice: అప్పటికే నాలుగు రోజులుగా ... ఉన్నాడని
  rationale: అక్షరార్థంగా ‘అప్పటికే నాలుగు రోజులు కలిగి ఉన్నవాడు’ అనే నిర్మాణం, సమాధిలో గడిచిన వ్యవధిని సూచిస్తుంది. తెలుగు కాలవ్యవధి ప్రయోగమైన ‘నాలుగు రోజులుగా’ ఆ భావాన్ని సహజంగా అందిస్తుంది; ἤδηని ‘అప్పటికే’గా నిలుపుతుంది.
- source_word: μνημείῳ
  choice: సమాధిలో
  rationale: ఈ సందర్భంలో μνημεῖον మృతదేహాన్ని ఉంచే సమాధి లేదా గుహా సమాధిని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘సమాధి’ సరైన, గౌరవప్రదమైన పదం.
theological_decisions:
- issue: αὐτόν యొక్క సూచ్యుణ్ణి స్పష్టంగా పేర్కొనడం
  choice: సర్వనామానికి బదులుగా ‘లాజరు’ అని స్పష్టంగా పేర్కొనడం
  alternative: ‘అతడు’ అనే సర్వనామాన్ని ఉంచడం
  rationale: గ్రీకులో సూచ్యుడు సందర్భం వల్ల స్పష్టంగా ఉన్నాడు. తెలుగులో పేరును వాడటం అర్థస్పష్టతను పెంచుతుంది; ఎటువంటి సిద్ధాంతపరమైన వ్యాఖ్యానాన్నీ చేర్చదు.
- issue: τέσσαρας ἤδη ἡμέρας ἔχοντα సూచించే వ్యవధి
  choice: లాజరు అప్పటికే నాలుగు రోజులుగా సమాధిలో ఉన్నాడని అనువదించడం
  alternative: లాజరుకు సమాధిలో అప్పటికే నాలుగు రోజులు అయ్యాయని అనువదించడం
  rationale: రెండు రూపాలూ మరణం లేదా సమాధి ఉంచినప్పటి నుంచి గడిచిన వ్యవధిని వ్యక్తం చేయగలవు. ‘నాలుగు రోజులుగా సమాధిలో ఉన్నాడు’ మూలంలోని స్థితి మరియు వ్యవధిని నేరుగా నిలుపుతుంది; మరణ సమయంపై మూలం చెప్పనిదాన్ని నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. మూలంలోని పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, కాల సంబంధం మరియు వ్యవధిని సహజమైన తెలుగు వాక్య నిర్మాణంలో వ్యక్తం చేసింది.
