revisions:
- from: కాబట్టి యేసు అక్కడికి వచ్చి, లాజరు అప్పటికే నాలుగు రోజులుగా సమాధిలో ఉన్నాడని తెలుసుకున్నాడు.
  to: అప్పుడు యేసు అక్కడికి రాగానే, లాజరు సమాధిలో ఉండి అప్పటికే నాలుగు రోజులు అయిందని కనుగొన్నాడు.
  rationale: The revision restores the direct force of εὗρεν as ‘కనుగొన్నాడు’ and uses a narrative Telugu equivalent for οὖν. It retains the explicit referent Lazarus, the temporal force of ἤδη (‘అప్పటికే’), the four-day duration, and the tomb setting without specifying an unstated time of death.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:29:31Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Lazarus, preserves ‘already,’ the four-day duration, and the tomb setting. However, εὗρεν is better represented by ‘కనుగొన్నాడు’ (‘found’) than by ‘తెలుసుకున్నాడు’ (‘learned/came to know’). The latter shifts the narrative observation to an act of acquiring information.
  naturalness: The revised wording is natural modern standard Telugu. ‘సమాధిలో ఉండి అప్పటికే నాలుగు రోజులు అయిందని’ idiomatically expresses the elapsed duration while retaining the source’s focus on Lazarus’s being in the tomb.
  terminology: ‘లాజరు’ and ‘సమాధి’ are appropriate conventional Telugu biblical terms. ‘అప్పుడు’ renders οὖν as a narrative connective more naturally than ‘కాబట్టి,’ which can imply a stronger logical conclusion than the Greek requires here.
  issues:
  - severity: medium
    issue: εὗρεν is translated as ‘తెలుసుకున్నాడు.’
    rationale: Although understandable in context, ‘తెలుసుకున్నాడు’ foregrounds learning rather than finding/observing. ‘కనుగొన్నాడు’ more directly reflects εὗρεν and preserves the narrative action.
  - severity: low
    issue: οὖν is translated as ‘కాబట్టి.’
    rationale: In this context οὖν primarily advances the narrative. ‘అప్పుడు’ is a more idiomatic Telugu narrative connector and avoids overstating a logical inference.
  revised_text: అప్పుడు యేసు అక్కడికి రాగానే, లాజరు సమాధిలో ఉండి అప్పటికే నాలుగు రోజులు అయిందని కనుగొన్నాడు.
  revised_footnotes: []
  revision_rationale: The revision restores the direct force of εὗρεν as ‘కనుగొన్నాడు’ and uses a narrative Telugu equivalent for οὖν. It retains the explicit referent Lazarus, the temporal force of ἤδη (‘అప్పటికే’), the four-day duration, and the tomb setting without specifying an unstated time of death.
