translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. యేసును సూచించడానికి ‘ఆయన’ అనే గౌరవ సర్వనామం ఉపయోగించబడింది. ప్రధాన వాక్యం సహజత్వాన్ని కాపాడగా, గ్రీకు అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న కదలికను పాదటిప్పణి తెలియజేస్తుంది.
