- from: ఆమె అది వినగానే, వెంటనే లేచి ఆయన దగ్గరికి వెళ్లింది.[a]
  to: ఆమె అది విని, త్వరగా లేచి ఆయనవద్దకు వెళ్లింది.[a]
  rationale: The revision removes the duplicated immediacy while retaining the sequence of hearing, rising quickly, and going toward Jesus. The footnote preserves the more explicit temporal sense of ὡς and the imperfective nuance of ἤρχετο without making the main Telugu narrative unnatural.
  reviewer_model: gpt-5.6-terra
