review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Mary as the referent, renders the intransitive sense of ἠγέρθη appropriately, and preserves movement toward Jesus. However, ‘వినగానే’ already conveys immediate succession and, when paired with ‘వెంటనే’ for ταχὺ, effectively duplicates and strengthens the temporal promptness beyond the distinct Greek elements ὡς (‘when’) and ταχὺ (‘quickly’).
  naturalness: The wording is generally modern and clear, but ‘ఆమె అది వినగానే, వెంటనే’ is stylistically redundant. ‘ఆమె అది విని, త్వరగా లేచి’ is concise, natural modern Telugu and distinguishes hearing from rising quickly.
  terminology: ‘ఆయన’ appropriately maintains the respectful narrative reference to Jesus. ‘ఆయనవద్దకు’ naturally expresses πρὸς αὐτόν in this context. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: The main text renders both ὡς and ταχὺ with overlapping immediacy (‘వినగానే, వెంటనే’).
    rationale: ‘వినగానే’ means roughly ‘as soon as she heard,’ while ‘వెంటనే’ means ‘immediately.’ The Greek says that, when she heard, she rose quickly; it does not require two separate immediate-action expressions in Telugu.
  revised_text: ఆమె అది విని, త్వరగా లేచి ఆయనవద్దకు వెళ్లింది.[a]
  revised_footnotes:
