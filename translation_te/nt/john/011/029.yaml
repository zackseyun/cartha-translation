  text: ἐκείνη ⸀δὲ ὡς ἤκουσεν ⸀ἠγέρθη ταχὺ καὶ ⸀ἤρχετο πρὸς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/029.yaml
  text: And when she heard it[a], she got up quickly and went to him.
translation:
  language: te
  text: ఆమె అది విని, త్వరగా లేచి ఆయనవద్దకు వెళ్లింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “ఆమె విన్నప్పుడు, త్వరగా లేచి, ఆయన వైపు వెళ్తూ ఉంది.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνη
  choice: ఆమె
  rationale: ఈ సూచన సర్వనామం ముందున్న సందర్భంలోని మరియను సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఆమె’ సహజంగా ఉండి, ఉద్దేశించిన వ్యక్తిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక కథనాన్ని ముందుకు నడిపించే స్వల్ప అనుసంధానాన్ని సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో దాన్ని ప్రత్యేకంగా ‘అయితే’ లేదా ‘మరియు’ అని చేర్చడం అవసరం లేదు.
- source_word: ὡς ἤκουσεν
  choice: అది వినగానే
  rationale: ὡς ఇక్కడ కాలసంబంధాన్ని సూచిస్తుంది; ‘వినగానే’ చర్య వెంటనే కొనసాగిన సహజ కథన ప్రవాహాన్ని ఇస్తుంది. ‘అది’ మునుపటి వచనంలో తెలియజేసిన మాటను సూచిస్తూ తెలుగులో అవసరమైన కర్మను అందిస్తుంది.
- source_word: ἠγέρθη
  choice: లేచి
  rationale: రూపంలో నిష్క్రియార్థకమైనా, ఈ సందర్భంలో క్రియ అకర్మకంగా ‘లేచింది’ అనే అర్థాన్ని ఇస్తుంది; బాహ్య కర్త ఆమెను లేపాడనే భావాన్ని కలిగించదు.
- source_word: ταχὺ
  choice: వెంటనే
  rationale: ఈ క్రియావిశేషణం త్వరితత్వం లేదా ఆలస్యం లేకపోవడాన్ని సూచిస్తుంది. ‘వెంటనే’ ఆధునిక తెలుగులో సహజంగా ఆ సత్వర స్పందనను తెలియజేస్తుంది.
- source_word: ἤρχετο
  choice: వెళ్లింది
  rationale: అసంపూర్ణ భూతకాల రూపం ప్రయాణం కొనసాగుతున్న దృశ్యాన్ని చూపగలదు; అయితే వరుస కథనంలో ‘వెళ్లింది’ సహజమైన తెలుగు రూపం. ప్రగతిశీల భావాన్ని పాదటిప్పణిలో నిలుపుతున్నాం.
- source_word: πρὸς αὐτόν
  choice: ఆయన దగ్గరికి
  rationale: πρός + ద్వితీయా విభక్తి ఒక వ్యక్తి వైపు కదలికను సూచిస్తుంది. యేసును సూచించే గౌరవప్రయోగంతో ‘ఆయన దగ్గరికి’ సహజంగా గమ్యాన్ని తెలియజేస్తుంది.
