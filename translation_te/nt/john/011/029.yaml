    reason: lexical_alternative
  revision_rationale: The revision removes the duplicated immediacy while retaining the sequence of hearing, rising quickly, and going toward Jesus. The footnote preserves the more explicit temporal sense of ὡς and the imperfective nuance of ἤρχετο without making the main Telugu narrative unnatural.
