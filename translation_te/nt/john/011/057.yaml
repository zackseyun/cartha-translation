id: JHN.11.57
reference: John 11:57
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δεδώκεισαν ⸀δὲ οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ⸀ἐντολὰς ἵνα ἐάν τις γνῷ ποῦ ἐστιν μηνύσῃ, ὅπως πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/057.yaml
  text: The chief priests and the Pharisees had given orders that if anyone knew where he was[a], he should report it[b], so that they might seize him.
translation:
  language: te
  text: ప్రధాన యాజకులూ పరిసయ్యులూ, ఎవరికైనా ఆయన ఎక్కడ ఉన్నారో తెలిస్తే తమకు తెలియజేయాలని, ఆయనను పట్టుకోవడానికి[a] ఆదేశాలు ఇచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అరెస్టు చేయడానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδώκεισαν
  choice: ఆదేశాలు ఇచ్చి ఉన్నారు
  rationale: పూర్వభూతకాల రూపం కథనంలోని ఆ సమయానికి ముందే ఆదేశాలు ఇవ్వబడి ఉన్నాయని సూచిస్తుంది; తెలుగు సహజత్వాన్ని కాపాడుతూ ఆ ముందస్తు స్థితిని వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది బలమైన వ్యతిరేకతకన్నా కథన పురోగతిని సూచించే స్వల్ప అనుసంధానకం. తెలుగులో వాక్యక్రమమే ఆ అనుసంధానాన్ని సహజంగా అందిస్తుంది; ‘అయితే’ వంటి పదం అనవసరమైన వ్యతిరేక భావాన్ని కలిగించవచ్చు.
- source_word: οἱ ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: యూదులలోని ప్రముఖ యాజక అధికారులను సూచించే స్థిరమైన, సందర్భోచిత తెలుగు పదబంధం.
- source_word: οἱ Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: ఈ యూద మతవర్గానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: ἐντολὰς
  choice: ఆదేశాలు
  rationale: అధికారపూర్వకంగా ఇచ్చిన నిర్దేశాలను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἵνα ἐάν τις γνῷ
  choice: ఎవరికైనా తెలిస్తే … తెలియజేయాలని
  rationale: ఆదేశంలోని షరతును, దానిపై ఆధారపడిన చర్యను స్పష్టంగా మరియు సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ποῦ ἐστιν
  choice: ఆయన ఎక్కడ ఉన్నాడో
  rationale: గ్రీకు వర్తమానకాలాన్ని తెలుగులో సహజంగానే నిలుపుతుంది; ఆంగ్లంలో అవసరమయ్యే కాలమార్పు తెలుగులో అవసరం లేదు.
- source_word: μηνύσῃ
  choice: తమకు తెలియజేయాలని
  rationale: అధికారులకు సమాచారాన్ని చేరవేయడం అనే భావాన్ని స్పష్టపరుస్తుంది; గ్రీకులో పరోక్ష కర్మ స్పష్టంగా లేకపోయినా సందర్భం దానిని సూచిస్తుంది.
- source_word: ὅπως πιάσωσιν αὐτόν
  choice: ఆయనను పట్టుకోవడానికి
  rationale: ఉద్దేశాన్ని సంక్షిప్తంగా తెలియజేస్తూ πιάζω యొక్క పట్టుకోవడం/అదుపులోకి తీసుకోవడం అనే విస్తృత భావాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. యేసును సూచించే సర్వనామానికి గౌరవార్థక ‘ఆయన’ వాడబడింది. గ్రీకు వాక్యంలోని ఉద్దేశ సంబంధాన్ని తెలుగులో సహజమైన ‘-డానికి’ నిర్మాణంతో వ్యక్తం చేశాం.
