revisions:
- from: అందువల్ల, యేసు ఆమె ఏడుస్తుండడం, ఆమెతో వచ్చిన యూదులు[a] కూడా ఏడుస్తుండడం చూసినప్పుడు, తన ఆత్మలో తీవ్రంగా చలించిపోయి[b], తనను తాను కలవరపరచుకున్నాడు.
  to: అందువల్ల, యేసు ఆమె ఏడుస్తుండడం, ఆమెతో వచ్చిన యూదులు[a] కూడా ఏడుస్తుండడం చూసినప్పుడు, తన ఆత్మలో బలంగా ఉద్రేకం చెంది[b], తనలో తాను కలతచెందాడు.
  rationale: The revision replaces only the final reflexive expression with an idiomatic modern Telugu equivalent that maintains its source-text force without adding a sense of deliberate self-agitation. It also slightly strengthens and clarifies the first emotional verb while retaining the Greek ambiguity through the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:29:36Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the temporal connective, the two instances of weeping, the accompanying Jewish mourners, and the debated force of ἐνεβριμήσατο. The explicit reflexive force of ἐτάραξεν ἑαυτόν should be retained without suggesting unnecessarily that Jesus deliberately caused distress to himself.
  naturalness: ‘తనను తాను కలవరపరచుకున్నాడు’ is grammatically understandable but unnatural in modern Telugu and can imply self-induced agitation. ‘తనలో తాను కలతచెందాడు’ is idiomatic, preserves the reflexive emphasis, and distinguishes the second emotional expression from the first.
  terminology: ‘యూదులు’ is appropriate here, with the note appropriately limiting its contextual reference. ‘ఆత్మలో’ preserves τῷ πνεύματι. ‘బలంగా ఉద్రేకం చెంది’ conveys strong inner agitation without deciding whether it was indignation, anger, or grief.
  issues:
  - severity: medium
    issue: The rendering ‘తనను తాను కలవరపరచుకున్నాడు’ is overly literal and potentially misleading.
    rationale: In current Telugu, కలవరపరచుకోవడం commonly suggests actively bringing anxiety upon oneself. The Greek reflexive construction marks Jesus’ own disturbance, but does not require that connotation.
  revised_text: అందువల్ల, యేసు ఆమె ఏడుస్తుండడం, ఆమెతో వచ్చిన యూదులు[a] కూడా ఏడుస్తుండడం చూసినప్పుడు, తన ఆత్మలో బలంగా ఉద్రేకం చెంది[b], తనలో తాను కలతచెందాడు.
