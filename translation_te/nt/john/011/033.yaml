id: JHN.11.33
reference: John 11:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν ὡς εἶδεν αὐτὴν κλαίουσαν καὶ τοὺς συνελθόντας αὐτῇ Ἰουδαίους κλαίοντας ἐνεβριμήσατο τῷ πνεύματι καὶ ἐτάραξεν ἑαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/033.yaml
  text: Therefore[a], when Jesus saw her weeping, and the Jews who had come with her weeping[b], he was deeply moved in his spirit and troubled himself.
translation:
  language: te
  text: అందువల్ల, యేసు ఆమె ఏడుస్తుండడం, ఆమెతో వచ్చిన యూదులు[a] కూడా ఏడుస్తుండడం చూసినప్పుడు, తన ఆత్మలో బలంగా ఉద్రేకం చెంది[b], తనలో తాను కలతచెందాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యూదయులు.’ ఇక్కడ ఈ పదం మరియతో వచ్చిన యూదు సంతాపకులను సూచిస్తుంది; యూదు ప్రజలందరినీ కాదు.
    reason: lexical_alternative
  - marker: b
    text: ఈ క్రియకు ‘ఆగ్రహించాడు,’ ‘తీవ్రంగా కదిలాడు’ అనే భావాలు కూడా ఉండవచ్చు; ఇది బలమైన అంతరంగ ఉద్రేకాన్ని వ్యక్తం చేస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: అందువల్ల
  rationale: ముందటి సంఘటనతో ఉన్న కథన సంబంధాన్ని, పర్యవసాన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὡς εἶδεν
  choice: చూసినప్పుడు
  rationale: ఇక్కడ ὡς కాలసూచకంగా పనిచేస్తుంది; సహజమైన తెలుగులో సంఘటనల క్రమాన్ని నిలుపుతుంది.
- source_word: κλαίουσαν / κλαίοντας
  choice: ఏడుస్తుండడం
  rationale: κλαίω వినిపించేలా ఏడవడాన్ని సూచించగలదు. ‘ఏడుస్తుండడం’ సందర్భానికి సహజంగా ఉండి, ఆచారబద్ధమైన విలాపమని అనవసరంగా నిర్ధారించదు.
- source_word: συνελθόντας αὐτῇ
  choice: ఆమెతో వచ్చిన
  rationale: మరియతో కలిసి వచ్చినవారనే సందర్భార్థాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: Ἰουδαίους
  choice: యూదులు
  rationale: ప్రత్యక్ష పదార్థాన్ని నిలుపుతూ, ఇక్కడ యూదులందరినీ కాక మరియతో వచ్చిన యూదు సంతాపకులను సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
- source_word: ἐνεβριμήσατο
  choice: తీవ్రంగా చలించిపోయి
  rationale: ఈ క్రియలో బలమైన అంతరంగ కదలికతో పాటు ఆగ్రహం లేదా రోషం అనే ఛాయ కూడా ఉండవచ్చు. ప్రధాన పాఠం ఆ భావోద్వేగ తీవ్రతను నిలుపుతూ దాని స్వరూపాన్ని ఖచ్చితంగా నిర్ణయించదు.
- source_word: τῷ πνεύματι
  choice: తన ఆత్మలో
  rationale: భావోద్వేగ కదలిక సంభవించిన అంతరంగ పరిధిని సూచించే దత్తివును సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἐτάραξεν ἑαυτόν
  choice: తనను తాను కలవరపరచుకున్నాడు
  rationale: గ్రీకులోని స్పష్టమైన ఆత్మవాచక నిర్మాణాన్ని నిలుపుతుంది; కేవలం ‘కలవరపడ్డాడు’ అని సాఫీ చేయదు.
theological_decisions:
- issue: ἐνεβριμήσατο అనే పదంలో యేసు భావోద్వేగ స్వరూపం
  choice: తీవ్రమైన అంతరంగ కదలికను తెలియజేసి, అది దుఃఖమా, ఆగ్రహమా, రోషమా అని ప్రధాన పాఠంలో నిర్ణయించకపోవడం
  alternative: ‘ఆగ్రహించాడు’ లేదా ‘తీవ్రంగా కలతచెందాడు’
  rationale: గ్రీకు క్రియ బలమైన భావోద్వేగ ఉద్రేకాన్ని సూచిస్తుంది; అయితే దాని లక్ష్యం, స్వరూపం గురించి భిన్న అవగాహనలు ఉన్నాయి. అనువాదం ఆ వ్యాఖ్యానపరమైన, వేదాంతపరమైన ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకులోని రెండు వేర్వేరు భావోద్వేగ క్రియలను ‘తీవ్రంగా చలించిపోయి’ మరియు ‘తనను తాను కలవరపరచుకున్నాడు’ అని వేరుగా నిలిపింది.
