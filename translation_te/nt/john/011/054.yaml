id: JHN.11.54
reference: John 11:54
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂Ὁ οὖν Ἰησοῦς⸃ οὐκέτι παρρησίᾳ περιεπάτει ἐν τοῖς Ἰουδαίοις, ἀλλὰ ἀπῆλθεν ἐκεῖθεν εἰς τὴν χώραν ἐγγὺς τῆς ἐρήμου, εἰς Ἐφραὶμ λεγομένην πόλιν, κἀκεῖ ⸀ἔμεινεν μετὰ τῶν ⸀μαθητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/054.yaml
  text: So Jesus no longer walked openly among the Jews[a], but departed from there to the region near the wilderness, to a city called Ephraim, and stayed there with the disciples.
translation:
  language: te
  text: కాబట్టి యేసు ఇకపై యూదుల మధ్య[a] బహిరంగంగా సంచరించలేదు. ఆయన అక్కడి నుంచి అరణ్యానికి సమీపంలోని ప్రాంతానికి వెళ్లి, ఎఫ్రాయిము అనే పట్టణానికి చేరుకొని, అక్కడ శిష్యులతో ఉండిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదయవాసుల మధ్య.’ యోహాను సువార్తలో ‘యూదులు’ అనే పదం సందర్భానుసారం మరింత నిర్దిష్టంగా యూదయ ప్రాంత ప్రజలను లేదా యూదయ అధికారులను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: కాబట్టి
  rationale: మునుపటి వచనంలో యేసును చంపడానికి జరిగిన కుట్రకు ఈ చర్యను కథనపరమైన పర్యవసానంగా అనుసంధానిస్తుంది.
- source_word: οὐκέτι
  choice: ఇకపై ... లేదు
  rationale: ఇంతకుముందు ఉన్న ప్రవర్తన ఇక కొనసాగలేదనే కాలసంబంధమైన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: παρρησίᾳ περιεπάτει
  choice: బహిరంగంగా సంచరించలేదు
  rationale: ఇక్కడ παρρησίᾳ ధైర్యం కన్నా ప్రజల కంటపడే బహిరంగతను సూచిస్తుంది; περιπατέω ప్రయాణం లేదా సంచారాన్ని సూచించే కథన సందర్భంలో ఉంది.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: యూదుల మధ్య
  rationale: Ἰουδαῖοι అనే పదానికి యూదులు, యూదయవాసులు, లేదా సందర్భానుసారం యూదయ నాయకులు అనే పరిధులు ఉండవచ్చు. ప్రధాన పాఠంలో సాధారణ అర్థాన్ని ఉంచి, ప్రాంతీయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἀπῆλθεν ἐκεῖθεν
  choice: అక్కడి నుంచి ... వెళ్లి
  rationale: మునుపటి ప్రదేశాన్ని విడిచి మరో ప్రాంతానికి వెళ్లిన కథన గమనాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: χώραν
  choice: ప్రాంతం
  rationale: ఆధునిక దేశాన్ని కాక ఒక భూభాగాన్ని లేదా పరిసర ప్రాంతాన్ని సూచిస్తుంది.
- source_word: ἐγγὺς τῆς ἐρήμου
  choice: అరణ్యానికి సమీపంలోని
  rationale: ἔρημος జనావాసం తక్కువగా ఉన్న నిర్జన ప్రాంతాన్ని సూచిస్తుంది; తెలుగు బైబిలు భౌగోళిక సందర్భంలో ‘అరణ్యం’ సహజంగా సరిపోతుంది.
- source_word: εἰς Ἐφραὶμ λεγομένην πόλιν
  choice: ఎఫ్రాయిము అనే పట్టణానికి
  rationale: πόλις చిన్న పట్టణాన్ని కూడా సూచించగలదు; ఈ స్థలానికి ఆధునిక తెలుగులో ‘పట్టణం’ సహజమైన ఎంపిక.
- source_word: κἀκεῖ ἔμεινεν
  choice: అక్కడ ... ఉండిపోయాడు
  rationale: ప్రయాణ కథనంలో μένω అక్కడే కొంతకాలం నిలిచి ఉండడాన్ని సూచిస్తుంది.
- source_word: μετὰ τῶν μαθητῶν
  choice: శిష్యులతో
  rationale: గ్రీకులో స్వామ్యసూచక పదం లేకపోవడంతో ‘తన శిష్యులతో’ అని విస్తరించకుండా, సందర్భంలో స్పష్టమైన సంక్షిప్త రూపాన్ని ఎంచుకున్నాం.
theological_decisions:
- issue: యోహాను సువార్తలో Ἰουδαῖοι పదం యొక్క సూచన
  choice: యూదుల మధ్య
  alternative: యూదయవాసుల మధ్య
  rationale: ఈ పదం జాతి, ప్రాంతం, లేదా నాయకత్వ వర్గాన్ని సందర్భానుసారం సూచించగలదు. ఈ వచనం యూదులందరి గురించి ఒక సిద్ధాంత ప్రకటన చేయడం కాక, ఆ ప్రాంతంలో యేసు బహిరంగ సంచారాన్ని వివరిస్తోంది. అందువల్ల పరిచితమైన పదాన్ని ప్రధాన పాఠంలో ఉంచి, ప్రాంతీయ భావాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి. ‘బహిరంగంగా సంచరించలేదు’ మూలంలోని ప్రజల మధ్య స్వేచ్ఛగా తిరిగే భావాన్ని సహజంగా అందిస్తుంది. పాదసూచిక సూచిక [a] ప్రధాన పాఠంలో చేర్చబడింది.
