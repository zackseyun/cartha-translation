review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents Martha’s address, the past contrary-to-fact condition, and its unreal result. However, «చనిపోయేవాడు కాదు» is less exact for the completed past event expressed by οὐκ ἂν ἀπέθανεν; «చనిపోయి ఉండేవాడు కాదు» more clearly conveys “would not have died.”
  naturalness: The sentence is generally clear, but «నా సహోదరుడు» is bookish in this direct speech, and the intimate «నువ్వు» sits awkwardly beside the reverential address «ప్రభువా». Honorific «మీరు» and «నా సోదరుడు» are natural modern standard Telugu in this setting.
  terminology: «ప్రభువా» appropriately preserves κύριε’s respectful address and possible theological resonance without deciding that question. The alternative «అయ్యా» in the footnote adequately signals the possible non-theological respectful sense.
  issues:
  - severity: medium
    issue: Past counterfactual result is not fully explicit
    rationale: «చనిపోయేవాడు కాదు» can be read as a general/hypothetical outcome. The Greek aorist apodosis refers to the completed past event, so «చనిపోయి ఉండేవాడు కాదు» is preferable.
  - severity: low
    issue: Register mismatch in direct address
    rationale: With «ప్రభువా», honorific «మీరు» is more idiomatic and respectful than intimate «నువ్వు» in modern standard Telugu.
  - severity: low
    issue: Overly bookish kinship term
    rationale: «సోదరుడు» is more natural than «సహోదరుడు» in contemporary direct speech, while retaining the unambiguous sibling sense.
  revised_text: అప్పుడు మార్త యేసుతో, “ప్రభువా,[a] మీరు ఇక్కడ ఉండి ఉంటే, నా సోదరుడు చనిపోయి ఉండేవాడు కాదు” అంది.
  revised_footnotes:
  - marker: a
    text: లేదా, ‘అయ్యా’; గ్రీకు పదం κύριε గౌరవపూర్వక సంబోధనగా కూడా వాడబడవచ్చు. అయితే ‘ప్రభువా’ అనే అనువాదం యోహాను సువార్తలో ఉండగల ధార్మిక భావగాంభీర్యాన్ని కూడా నిలుపుతుంది.
    reason: alternative_reading
  revision_rationale: The revision makes the unreal past result explicit, improves modern Telugu speech register, and retains the source text’s ambiguity in κύριε through the existing alternative-reading footnote.
