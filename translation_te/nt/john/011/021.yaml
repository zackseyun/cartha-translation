id: JHN.11.21
reference: John 11:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν οὖν ⸀ἡ Μάρθα πρὸς ⸀τὸν Ἰησοῦν· Κύριε, εἰ ἦς ὧδε ⸂οὐκ ἂν ἀπέθανεν ὁ ἀδελφός μου⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/021.yaml
  text: So Martha said to Jesus[a], “Lord, if you had been here, my brother would not have died.”
translation:
  language: te
  text: అప్పుడు మార్త యేసుతో, “ప్రభువా,[a] మీరు ఇక్కడ ఉండి ఉంటే, నా సోదరుడు చనిపోయి ఉండేవాడు కాదు” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అయ్యా’; గ్రీకు పదం κύριε గౌరవపూర్వక సంబోధనగా కూడా వాడబడవచ్చు. అయితే ‘ప్రభువా’ అనే అనువాదం యోహాను సువార్తలో ఉండగల ధార్మిక భావగాంభీర్యాన్ని కూడా నిలుపుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: అప్పుడు
  rationale: ఇక్కడ οὖν కథనంలోని కొనసాగింపును సూచిస్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు’ సహజంగా ఉండి ఆ అనుసంధానాన్ని నిలుపుతుంది.
- source_word: εἶπεν
  choice: అంది
  rationale: మాట్లాడుతున్నది మార్త కాబట్టి, సాధారణ తెలుగు సంభాషణా క్రియగా స్త్రీలింగ రూపమైన ‘అంది’ సహజంగా సరిపోతుంది.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: యేసుతో
  rationale: మాట ఎవరిని ఉద్దేశించి చెప్పబడిందో πρός సూచిస్తుంది. తెలుగులో ‘యేసుతో’ సంక్షిప్తంగా, సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: ‘ప్రభువా’ గౌరవపూర్వక సంబోధనను, అలాగే యోహాను సువార్తలో ఉండగల క్రీస్తు సంబంధమైన భావగాంభీర్యాన్ని అతిశయింపకుండా నిలుపుతుంది.
- source_word: εἰ ἦς ὧδε
  choice: నువ్వు ఇక్కడ ఉండి ఉంటే
  rationale: ఇది గతానికి సంబంధించిన వాస్తవవిరుద్ధ షరతు. ‘ఉండి ఉంటే’ అనే తెలుగు నిర్మాణం ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ὧδεను ‘ఇక్కడ’గా అనువదించాం.
- source_word: οὐκ ἂν ἀπέθανεν
  choice: చనిపోయేవాడు కాదు
  rationale: οὐκ + ἄν + aorist indicative గతంలోని వాస్తవవిరుద్ధ ఫలితాన్ని సూచిస్తుంది. ‘చనిపోయేవాడు కాదు’ తెలుగులో ఆ ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὁ ἀδελφός μου
  choice: నా సహోదరుడు
  rationale: ఇక్కడ ἀδελφός మార్తకు రక్తసంబంధమైన పురుష సహోదరుడైన లాజరును సూచిస్తుంది. ‘నా సహోదరుడు’ స్పష్టమైన, గౌరవప్రదమైన ప్రామాణిక తెలుగు రూపం.
theological_decisions:
- issue: మార్త యేసును సంబోధించిన κύριος పదం
  choice: ప్రభువా
  alternative: అయ్యా; బోధకుడా
  rationale: κύριος ఇక్కడ గౌరవ సంబోధనగా పనిచేయగలదు; యోహాను సువార్తలో దీనికి క్రీస్తు సంబంధమైన భావం కూడా ఉండవచ్చు. ‘ప్రభువా’ ఈ రెండు అవకాశాలను నిలుపుతుంది; పాదసూచిక గౌరవ సంబోధన అనే ప్రత్యామ్నాయ భావాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణా శైలి వాడబడింది. యేసును ఉద్దేశించిన మాటలో సన్నిహిత ఏకవచనమైన ‘నువ్వు’ సహజంగా ఉంటుంది; ‘ప్రభువా’ అనే సంబోధన గౌరవాన్ని స్పష్టంగా నిలుపుతుంది.
