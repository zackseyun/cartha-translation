revisions:
- from: అప్పుడు మార్త యేసుతో, “ప్రభువా,[a] నువ్వు ఇక్కడ ఉండి ఉంటే, నా సహోదరుడు చనిపోయేవాడు కాదు” అంది.
  to: అప్పుడు మార్త యేసుతో, “ప్రభువా,[a] మీరు ఇక్కడ ఉండి ఉంటే, నా సోదరుడు చనిపోయి ఉండేవాడు కాదు” అంది.
