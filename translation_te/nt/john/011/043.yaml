  text: καὶ ταῦτα εἰπὼν φωνῇ μεγάλῃ ἐκραύγασεν· Λάζαρε, δεῦρο ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/043.yaml
  text: And after saying these things[a], he cried out with a loud voice, “Lazarus, come out!”
translation:
  language: te
  text: 'ఈ మాటలు చెప్పి, ఆయన బిగ్గరగా కేక వేశాడు: “లాజరూ, బయటికి రా!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: ఇలా
  rationale: నపుంసక బహువచన సర్వనామమైనప్పటికీ, ముందుగా పలికిన మాటలను సూచించే ఈ సందర్భంలో ఆధునిక తెలుగులో ‘ఇలా చెప్పిన తర్వాత’ సహజంగా ఉంటుంది; ‘ఈ సంగతులు’ అన్న పదశః రూపం అనవసరంగా భారంగా వినిపిస్తుంది.
- source_word: εἰπὼν
  choice: చెప్పిన తర్వాత
  rationale: అయోరిస్ట్ కృదంతం ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచిస్తుంది; ‘చెప్పిన తర్వాత’ కాలక్రమాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: φωνῇ μεγάλῃ
  choice: బిగ్గరగా
  rationale: శబ్దం అధికంగా ఉన్నదనే విధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘గొప్ప స్వరంతో’ అనేది ఇక్కడ కృత్రిమంగా ఉంటుంది.
- source_word: ἐκραύγασεν
  choice: కేక వేసి
  rationale: κραυγάζω గట్టిగా అరవడం లేదా కేక వేయడాన్ని సూచిస్తుంది. ముందున్న ‘బిగ్గరగా’తో కలిపి మూలంలోని తీవ్రతను నిలుపుతుంది.
- source_word: Λάζαρε
  choice: లాజరూ
  rationale: సంబోధన విభక్తిని తెలుగులో సహజంగా చూపించేందుకు ప్రామాణిక పేరురూపం ‘లాజరు’కు ‘లాజరూ’ అనే సంబోధన రూపం వాడబడింది.
- source_word: δεῦρο ἔξω
  choice: బయటికి రా
  rationale: δεῦρο ఆజ్ఞార్థకంగా ‘రా’ అనే భావాన్ని, ἔξω ‘బయటికి’ అనే దిశను తెలియజేస్తాయి. ఈ కలయిక ఆధునిక తెలుగులో స్పష్టమైన, బలమైన పిలుపుగా ఉంటుంది.
theological_decisions:
- issue: ప్రసిద్ధమైన అద్భుత ఆజ్ఞను సంప్రదాయ లేదా ప్రాచీన శైలిని చొప్పించకుండా అనువదించడం
  choice: బయటికి రా
  alternative: వెలుపలికి రమ్ము
  rationale: మూలపాఠంలోని δεῦρο ἔξω సూటిగా బయటకు రావాలనే ఆజ్ఞ. ‘బయటికి రా’ ఆధునికంగా, సహజంగా ఉండి ఆ ఆజ్ఞ బలాన్ని నిలుపుతుంది; ‘వెలుపలికి రమ్ము’ మరింత సంప్రదాయబద్ధంగా, నేటి సాధారణ వాడుకకు కొంత దూరంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి, అయితే యేసు నేరుగా ఇచ్చిన ఆజ్ఞలో సహజమైన ఏకవచన సంబోధన వాడబడింది. మూలంలోని పునరుక్తి భావాన్ని (‘బిగ్గరగా కేక వేసి’) తీవ్రత కోసం నిలుపుకున్నాం.
