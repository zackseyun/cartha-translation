id: JHN.11.4
reference: John 11:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς εἶπεν· Αὕτη ἡ ἀσθένεια οὐκ ἔστιν πρὸς θάνατον ἀλλ’ ὑπὲρ τῆς δόξης τοῦ θεοῦ ἵνα δοξασθῇ ὁ υἱὸς τοῦ θεοῦ δι’ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/004.yaml
  text: But when Jesus heard it[a], he said, “This sickness is not unto death, but for the glory of God, so that the Son of God may be glorified through it.”
translation:
  language: te
  text: అయితే యేసు అది విని, “ఈ అనారోగ్యం మరణంతో ముగిసేది కాదు[a]; ఇది దేవుని మహిమ కోసం, దీని ద్వారా దేవుని కుమారుడు మహిమపరచబడటానికి ఉంది” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరణానికి దారితీసేది కాదు.” గ్రీకు పదబంధం మరణం ఈ అనారోగ్యపు తుది ఫలితం లేదా గమ్యం కాదని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: అయితే యేసు అది విని
  rationale: ఆరిస్టు కృదంతంలోని కాలసంబంధ భావాన్ని సహజమైన తెలుగులో ‘విని’ అని వ్యక్తం చేశాం. δέ సూచించే స్వల్ప కథన మలుపును ‘అయితే’ నిలుపుతుంది. ‘అది’ అనేది లాజరు అనారోగ్యం గురించిన సమాచారాన్ని సందర్భం నుంచి పూరిస్తుంది.
- source_word: ἀσθένεια
  choice: అనారోగ్యం
  rationale: లాజరు పరిస్థితిని సూచించే విస్తృతమైన, ఆధునిక ప్రామాణిక తెలుగు పదం; అతిగా వైద్యపరమైన భావాన్ని కలిగించదు.
- source_word: οὐκ ἔστιν πρὸς θάνατον
  choice: మరణంతో ముగిసేది కాదు
  rationale: πρός ఇక్కడ అంతిమ ఫలితం లేదా గమ్యాన్ని సూచిస్తుంది. లాజరు కొంతకాలం నిజంగా మరణిస్తాడనే తరువాతి కథనంతో ఉన్న ఉద్రిక్తతను తొలగించకుండా, మరణమే ఈ అనారోగ్యపు తుది పరిణామం కాదనే భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: ὑπὲρ τῆς δόξης τοῦ θεοῦ
  choice: దేవుని మహిమ కోసం
  rationale: ὑπέρ లోని ఉద్దేశం/ప్రయోజనం భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది; δόξα యొక్క వేదాంతపరమైన బరువును ‘మహిమ’ నిలుపుతుంది.
- source_word: ἵνα δοξασθῇ ὁ υἱὸς τοῦ θεοῦ
  choice: దేవుని కుమారుడు మహిమపరచబడేలా
  rationale: ἵνα ఉద్దేశాన్ని, δοξασθῇ లోని కర్మణి ప్రయోగాన్ని నిలుపుతూ క్రీస్తు సంబంధ బిరుదును నేరుగా అనువదిస్తుంది.
- source_word: δι’ αὐτῆς
  choice: దీని ద్వారా
  rationale: διά + షష్ఠీ విభక్తిలోని సాధనార్థాన్ని చూపుతుంది. స్త్రీలింగ సర్వనామం అనారోగ్యాన్నే తిరిగి సూచిస్తుంది.
theological_decisions:
- issue: లాజరు తరువాత నిజంగా మరణించినప్పటికీ ‘మరణానికి కాదు’ అనే మాట యొక్క అర్థం
  choice: ‘మరణంతో ముగిసేది కాదు’ అని అనువదించి, మరణం ఈ అనారోగ్యపు అంతిమ ఫలితం కాదనే గమ్యార్థాన్ని వ్యక్తం చేయడం
  alternative: లాజరు అసలు మరణించడని సూటిగా చెప్పడం; లేదా కేవలం ‘ప్రాణాంతకం కాదు’ అని అనువదించడం
  rationale: యోహాను 11:14లో లాజరు మరణం స్పష్టమవుతుంది. అందువల్ల πρὸς యొక్క అంతిమ ఫలితం/గమ్యం భావాన్ని నిలుపుతూ, కథనంలోని ఉద్దేశపూర్వక వేదాంత ఉద్రిక్తతను బలవంతంగా పరిష్కరించకుండా ఉంచాం.
- issue: ‘దేవుని మహిమ’కు, ‘దేవుని కుమారుడు మహిమపరచబడడం’కు మధ్య సంబంధం
  choice: రెండు వాక్యభాగాలను వేర్వేరుగా నిలిపి, అనారోగ్యం దేవుని మహిమ కోసం ఉండటాన్నీ దాని ద్వారా కుమారుడు మహిమపరచబడటాన్నీ స్పష్టంగా చెప్పడం
  alternative: రెండింటినీ దైవిక మహిమ గురించిన ఒక సాధారణ ప్రకటనగా కలిపివేయడం
  rationale: గ్రీకు పాఠం దేవుని మహిమను, కుమారుని మహిమపరచబడడాన్ని ఉద్దేశసంబంధంగా ప్రత్యేకంగా ప్రస్తావిస్తుంది. ఈ నిర్మాణాన్ని నిలపడం పాఠంలోని క్రీస్తు సంబంధ ప్రకటనను అదనపు సిద్ధాంత వివరణ లేకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘మరణంతో ముగిసేది కాదు’ అనే రూపం మూలంలోని భావ ఉద్రిక్తతను కాపాడుతూ, సాధారణ పాఠకుడికి అర్థమయ్యేలా ఉంది. ప్రధాన పాఠంలో [a] గుర్తు సంబంధిత పదబంధం వెంట ఉంచబడింది.
