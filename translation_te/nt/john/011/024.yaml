review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Martha’s knowledge, the future resurrection, and the eschatological ‘last day.’ However, ‘అంత్యదినాన జరిగే పునరుత్థానంలో’ turns the second ἐν phrase into an explicit relative characterization (‘the resurrection that takes place on the last day’). While compatible with the sense, this is more interpretive than the Greek’s two parallel prepositional phrases. A more direct Telugu rendering preserves their sequence and scope without resolving the syntactic relation.
  naturalness: The draft is generally fluent and appropriately respectful. ‘చివరి దినాన, పునరుత్థానంలో’ is clear modern standard Telugu and avoids the heavier, interpretive participial phrase ‘అంత్యదినాన జరిగే.’
  terminology: ‘మార్త,’ ‘పునరుత్థానం,’ and ‘తిరిగి లేస్తాడు’ are suitable. ‘చివరి దినం’ is a clear modern Telugu equivalent of the Johannine expression ἐσχάτῃ ἡμέρᾳ. The footnote should address the lexical/idiomatic alternative for ἐν τῇ ἀναστάσει rather than claim a syntactic alternative that the revised wording does not require.
  issues:
  - severity: medium
    issue: The main text makes ‘on the last day’ explicitly modify ‘resurrection.’
    rationale: ‘అంత్యదినాన జరిగే పునరుత్థానంలో’ adds the relative notion ‘taking place,’ thereby selecting and strengthening one possible relationship between the two Greek ἐν phrases. The source can be translated directly without this clarification.
  - severity: low
    issue: The footnote describes a broader attachment ambiguity than is needed and is not aligned with the English audit trail’s lexical alternative.
    rationale: The supplied English footnote identifies ‘at the resurrection’ as an alternative for ‘in the resurrection.’ A Telugu note should retain that lexical/idiomatic alternative rather than recast the whole clause around attachment.
  revised_text: మార్త ఆయనతో, “చివరి దినాన, పునరుత్థానంలో అతడు తిరిగి లేస్తాడని నాకు తెలుసు” అంది.[a]
