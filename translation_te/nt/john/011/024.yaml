id: JHN.11.24
reference: John 11:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ἡ Μάρθα· Οἶδα ὅτι ἀναστήσεται ἐν τῇ ἀναστάσει ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/024.yaml
  text: Martha said to him[a], “I know that he will rise again in the resurrection on the last day.”
translation:
  language: te
  text: మార్త ఆయనతో, “చివరి దినాన, పునరుత్థానంలో అతడు తిరిగి లేస్తాడని నాకు తెలుసు” అంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చివరి దినాన, పునరుత్థాన సమయంలో అతడు తిరిగి లేస్తాడని నాకు తెలుసు.”
    reason: ‘పునరుత్థానంలో’కు బదులుగా గ్రీకులోని ἐν τῇ ἀναστάσειని కాలసూచకంగా ‘పునరుత్థాన సమయంలో’ అని కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: λέγει
  choice: అంది
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, ఆధునిక తెలుగు కథన సంభాషణలో భూతకాల రూపమైన ‘అంది’ సహజంగా ఉంటుంది.
- source_word: αὐτῷ
  choice: ఆయనతో
  rationale: మాట ఎవరితో చెప్పబడిందో సూచించే దత్తివాచక సర్వనామానికి సందర్భానుగుణమైన గౌరవప్రద తెలుగు రూపం.
- source_word: ἡ Μάρθα
  choice: మార్త
  rationale: వ్యక్తి పేరుకు తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: Οἶδα
  choice: నాకు తెలుసు
  rationale: మార్త వ్యక్తం చేస్తున్న దృఢమైన జ్ఞానాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἀναστήσεται
  choice: తిరిగి లేస్తాడు
  rationale: భవిష్యత్ మధ్యమ రూపం పునరుత్థాన సందర్భంలో స్వయంగా లేవడాన్ని సూచిస్తుంది; ‘లేపబడతాడు’ అనే కర్మణి భావాన్ని అనవసరంగా చేర్చదు.
- source_word: ἐν τῇ ἀναστάσει
  choice: పునరుత్థానంలో
  rationale: ἐν అనే ఉపసర్గలోని కాల/సందర్భ భావాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: అంత్యదినాన జరిగే
  rationale: ‘చివరి రోజున’ అనే కాలార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, అది పునరుత్థానాన్ని విశేషించే నిర్మాణమనే పఠనాన్ని ప్రధాన పాఠ్యంలో స్పష్టం చేస్తుంది.
- source_word: ἐσχάτῃ
  choice: అంత్య
  rationale: యోహాను సువార్తలోని యుగాంత సంబంధమైన ‘last’ భావానికి గౌరవప్రదమైన, సుపరిచితమైన తెలుగు పదం.
theological_decisions:
- issue: అంత్యకాల పునరుత్థాన సూచన
  choice: ‘అంత్యదినాన జరిగే పునరుత్థానం’గా అనువదించడం
  alternative: మరణానంతర జీవితం గురించిన సాధారణ నిరీక్షణగా తీసుకోవడం
  rationale: ἀναστήσεται, ἀνάστασις అనే ద్విగుణ పునరుత్థాన భాషతో పాటు ‘అంత్యదినం’ అనే నిర్దిష్ట కాలసూచన ఉన్నందున, వాక్యం యుగాంత పునరుత్థానాన్ని సూచిస్తుంది; దానికంటే మించిన సిద్ధాంత వివరాలను అనువాదం చేర్చదు.
- issue: రెండు ἐν పదబంధాల అన్వయం
  choice: ‘అంత్యదినాన జరిగే పునరుత్థానంలో’
  alternative: ‘పునరుత్థానంలో, అంత్యదినాన’
  rationale: గ్రీకు వాక్యనిర్మాణం ‘అంత్యదినాన జరిగే పునరుత్థానం’ అనే అన్వయాన్నీ, చివరి పదబంధాన్ని క్రియకు నేరుగా కాలసూచనగా అన్వయించడాన్నీ అనుమతిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన మొదటి అన్వయాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. ‘పునరుత్థానం,’ ‘అంత్యదినం’ అనే స్థిరమైన బైబిలు పదజాలాన్ని నిలిపాం.
