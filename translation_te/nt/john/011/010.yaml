id: JHN.11.10
reference: John 11:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν δέ τις περιπατῇ ἐν τῇ νυκτί, προσκόπτει, ὅτι τὸ φῶς οὐκ ἔστιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/010.yaml
  text: But if anyone walks in the night[a], he stumbles, because the light is not in him.
translation:
  language: te
  text: కాని ఎవరైనా రాత్రివేళ నడిస్తే, అతడు తడబడతాడు; ఎందుకంటే వెలుగు అతనిలో[a] ఉండదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వెలుగు అతనితో ఉండదు.” గ్రీకు పాఠం మరింత అక్షరార్థంగా “అతనిలో” అని చెబుతుంది; ఇది బాహ్య వెలుగు లేకపోవడం కంటే ఎక్కువ భావాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν δέ τις
  choice: కాని ఎవరైనా … నడిస్తే
  rationale: δέ యొక్క వ్యతిరేక భావాన్ని ‘కాని’తో, ἐὰν యొక్క షరతును ‘-తే’తో, τις యొక్క సాధారణ అనిర్దిష్ట భావాన్ని ‘ఎవరైనా’తో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: περιπατῇ ἐν τῇ νυκτί
  choice: రాత్రివేళ నడిస్తే
  rationale: ‘నడుచు’ అనే ప్రత్యక్ష దృశ్యాన్ని నిలుపుతూ, ‘రాత్రివేళ’ ఆధునిక తెలుగులో సహజంగా కాలసూచనను తెలియజేస్తుంది; దీనిని ముందుగానే రూపకాలంకారమైన ‘చీకటిలో’గా మార్చదు.
- source_word: προσκόπτει
  choice: తడబడతాడు
  rationale: శారీరకంగా అడ్డు తగిలి తడబడటం అనే భావంతో పాటు రూపకాలంకార భావాన్నీ నిలుపుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: తడబడటానికి గల కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: τὸ φῶς
  choice: వెలుగు
  rationale: సందర్భంలోని నిర్దిష్టమైన వెలుగు భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; తెలుగు భాషలో నిర్దిష్ట ఉపపదం లేకపోవడం వల్ల అదనపు పదం అవసరం లేదు.
- source_word: οὐκ ἔστιν ἐν αὐτῷ
  choice: అతనిలో ఉండదు
  rationale: ἐν యొక్క ప్రాథమిక ‘లో’ భావాన్ని కాపాడి, బాహ్య వెలుగు లేకపోవడం మరియు అంతర్గత ఆధ్యాత్మిక సూచన మధ్యనున్న యోహాను రచనలోని ఉద్దేశపూర్వక ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచుతుంది.
theological_decisions:
- issue: ‘వెలుగు అతనిలో ఉండదు’ అనే మాట యొక్క భావం
  choice: ‘అతనిలో’ అనే అంతర్గత స్థానసూచనను ప్రధాన పాఠ్యంలో నిలుపుట
  alternative: ‘వెలుగు అతనితో ఉండదు’ అని కేవలం బాహ్య వెలుగు లేమిగా అనువదించుట
  rationale: గ్రీకు ἐν αὐτῷ అక్షరార్థంగా ‘అతనిలో’ అని చెబుతుంది. యోహాను రచనలో వెలుగు-చీకటి భాషకు అక్షరార్థంతో పాటు ఆధ్యాత్మిక లోతు ఉండవచ్చు; అందువల్ల ఏ ఒక్క భావానికీ పరిమితం చేయకుండా అసలు పాఠ్యంలోని ఉద్వేగాన్ని నిలుపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. ‘నడిస్తే,’ ‘తడబడతాడు’ అనే పదాలు ప్రత్యక్ష దృశ్యాన్నీ సాధ్యమైన రూపకాలంకార భావాన్నీ నిలుపుతాయి. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో చేర్చబడింది.
