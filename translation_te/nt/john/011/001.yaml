source:
  edition: SBLGNT
  text: Ἦν δέ τις ἀσθενῶν, Λάζαρος ἀπὸ Βηθανίας ἐκ τῆς κώμης Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/001.yaml
  text: A certain man was sick[a], Lazarus from Bethany, from the village of Mary and her sister Martha.
translation:
  language: te
  text: మరియ మరియు ఆమె సహోదరి మార్తల గ్రామమైన బేతనియకు చెందిన లాజరు అనే ఒక వ్యక్తి అనారోగ్యంతో ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అనారోగ్యంతో ఉన్న ఒక వ్యక్తి ఉన్నాడు—మరియ మరియు ఆమె సహోదరి మార్తల గ్రామమైన బేతనియకు చెందిన లాజరు.”
    reason: గ్రీకు వాక్యక్రమాన్ని ప్రతిబింబించే పదనిర్మాణ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: Ἦν δέ
  choice: ఉన్నాడు
  rationale: Ἦν ప్రధాన క్రియను తెలుగులో సహజమైన గతస్థితి రూపంతో వ్యక్తపరిచాం. δέ స్వల్ప కథన సంధానాన్ని సూచిస్తుంది; ఈ ఒక్క వాక్యంలో దానికి ప్రత్యేకంగా ‘అప్పుడు’ వంటి కాలార్థ పదాన్ని జోడించలేదు.
- source_word: τις
  choice: ఒక వ్యక్తి
  rationale: ఇది నిర్దిష్టమైనప్పటికీ ఇంకా పరిచయం చేయని వ్యక్తిని సూచిస్తుంది. ‘ఒక వ్యక్తి’ ఆధునిక తెలుగులో సహజంగా ఉండి, లాజరు పురుషుడనే విషయాన్నీ సందర్భం స్పష్టం చేస్తుంది.
- source_word: ἀσθενῶν
  choice: అనారోగ్యంతో
  rationale: ఈ సందర్భంలో పదం సాధారణ బలహీనతను కాక వ్యాధిగ్రస్త స్థితిని సూచిస్తుంది; ‘అనారోగ్యంతో ఉన్నాడు’ సహజమైన తెలుగు ప్రయోగం.
- source_word: Λάζαρος
  choice: లాజరు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకలో స్థిరపడిన రూపంలో లిప్యంతరీకరించాం.
- source_word: ἀπὸ Βηθανίας
  choice: బేతనియ గ్రామానికి చెందిన
  rationale: ἀπό మూలస్థానం లేదా అనుబంధాన్ని సూచిస్తుంది. వెంటనే వచ్చే κώμηతో కలిపి తెలుగులో సహజంగా ‘బేతనియ గ్రామానికి చెందిన’ అని ఇచ్చాం.
- source_word: ἐκ τῆς κώμης
  choice: ఆ గ్రామం
  rationale: κώμη చిన్న నివాసస్థలమైన ‘గ్రామం’. గ్రీకులోని పునరుక్త మూలస్థాన నిర్మాణాన్ని తెలుగులో భారంగా కాకుండా తదుపరి వాక్యంలో ‘ఆ గ్రామం’గా కొనసాగించాం.
- source_word: Μαρίας καὶ Μάρθας
  choice: మరియది, ... మార్తది
  rationale: సంబంధవిభక్తులు ఆ గ్రామాన్ని మరియ, మార్తలతో అనుసంధానిస్తున్నాయి. తెలుగులో ‘ఆ గ్రామం మరియది, ... మార్తది’ అని సహజంగా వ్యక్తపరిచాం.
- source_word: τῆς ἀδελφῆς αὐτῆς
  choice: ఆమె సహోదరి
  rationale: ఈ అన్వయం మార్తను మరియ సహోదరిగా గుర్తిస్తుంది. ‘సహోదరి’ గౌరవప్రదమైన, స్పష్టమైన ఆధునిక ప్రామాణిక తెలుగు రూపం.
