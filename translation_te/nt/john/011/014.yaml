  text: τότε οὖν εἶπεν αὐτοῖς ὁ Ἰησοῦς παρρησίᾳ· Λάζαρος ἀπέθανεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/014.yaml
  text: So then Jesus told them plainly[a], “Lazarus has died.”
translation:
  language: te
  text: 'అప్పుడు యేసు వారితో స్పష్టంగా ఇలా చెప్పాడు: “లాజరు చనిపోయాడు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “అప్పుడు యేసు వారితో బహిరంగంగా ఇలా చెప్పాడు: ‘లాజరు చనిపోయాడు.’”'
    reason: παρρησίᾳ అనే పదానికి సందర్భంలో ‘స్పష్టంగా’ ప్రధానార్థం కాగా, ‘బహిరంగంగా’ అనే పదార్థ ప్రత్యామ్నాయం కూడా సాధ్యమే.
lexical_decisions:
- source_word: τότε οὖν
  choice: అప్పుడు
  rationale: ఈ సంయుక్త ప్రయోగం సందర్భంలోని కాలక్రమ పురోగతినీ, ముందటి మాటలకు కొనసాగింపునీ సూచిస్తుంది. తెలుగులో ‘అప్పుడు’ సహజంగా ఆ భావాన్ని అందిస్తుంది; ‘కాబట్టి అప్పుడు’ అనడం కృత్రిమంగా ఉంటుంది.
- source_word: εἶπεν αὐτοῖς
  choice: వారితో ... అని చెప్పాడు
  rationale: తెలుగులో ప్రత్యక్ష ఉల్లేఖనంతో సహజంగా వాడే నిర్మాణం; గ్రీకు వాక్యంలోని సంభాషణ క్రియను అదనపు భావం లేకుండా వ్యక్తపరుస్తుంది.
- source_word: παρρησίᾳ
  choice: స్పష్టంగా
  rationale: ముందు ‘నిద్రపోయాడు’ అని పరోక్షంగా చెప్పిన మాటకు భిన్నంగా, ఇప్పుడు సందేహానికి తావులేకుండా చెప్పడాన్ని ఈ సందర్భంలో సూచిస్తుంది. ‘బహిరంగంగా’ కూడా సాధ్యమే కానీ ఇక్కడ స్పష్టత ప్రధాన భావం.
- source_word: Λάζαρος
  choice: లాజరు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన సహజ నామరూపాన్ని ఉపయోగించింది.
- source_word: ἀπέθανεν
  choice: చనిపోయాడు
  rationale: గ్రీకు ఏఓరిస్ట్ లాజరు మరణించిన సంఘటనను నేరుగా తెలియజేస్తుంది. తెలుగులో ‘చనిపోయాడు’ సహజమైన, స్పష్టమైన సమానార్థకం.
theological_decisions:
- issue: లాజరు స్థితి గురించి యేసు చెప్పిన మాట స్వభావం
  choice: లాజరు శారీరకంగా చనిపోయాడని నేరుగా చెప్పడం
  alternative: ముందటి ‘నిద్ర’ రూపకాన్ని ఇక్కడ కూడా కొనసాగించడం
  rationale: ἀπέθανεν అనే క్రియ ముందటి రూపకభాషలోని సందిగ్ధతను మూలపాఠమే తొలగిస్తుంది. కాబట్టి అనువాదం మరణాన్ని స్పష్టంగా చెప్పాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన శైలి. ప్రత్యక్ష ఉల్లేఖనం సహజ తెలుగు వాక్యనిర్మాణంలో ఉంచబడింది; [a] గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
