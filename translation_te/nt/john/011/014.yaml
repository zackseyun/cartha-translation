  source_fidelity: 'ప్రధాన అనువాదం మూల గ్రీకు భావాన్ని నమ్మకంగా తెలియజేస్తుంది: τότε οὖν యొక్క సందర్భానుసారమైన కొనసాగింపును ‘అప్పుడు’గా, παρρησίᾳ ను ‘స్పష్టంగా’గా, ἀπέθανεν ను నేరుగా ‘చనిపోయాడు’గా వ్యక్తం చేసింది. అయితే ప్రత్యక్ష ఉల్లేఖనాన్ని పరిచయం చేసే తెలుగు నిర్మాణాన్ని మరింత సహజంగా చేయడానికి ‘ఇలా చెప్పాడు:’ అవసరం.'
