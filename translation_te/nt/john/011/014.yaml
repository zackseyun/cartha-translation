  terminology: ‘యేసు,’ ‘లాజరు,’ మరియు ‘చనిపోయాడు’ తెలుగు బైబిలు వాడుకకు, అలాగే మూలపాఠంలోని వ్యక్తినామం మరియు స్పష్టమైన మరణ-ప్రకటనకు తగినవి. ‘స్పష్టంగా’ ఈ సందర్భంలో παρρησίᾳ యొక్క ప్రధానమైన నిర్ద్వంద్వ భావాన్ని చక్కగా అందిస్తుంది. ప్రత్యామ్నాయంగా ‘బహిరంగంగా’ను పాదటిప్పణిలో ఉంచడం సముచితం.
